מְנַחֵם אוֹתִי עַל יְדֵי רְשָׁעִים שֶׁאֵינָן אֶלָּא מַקְנִיטִים:", "rashi_en": "כי ירט הדרך לנגדי BECAUSE THY WAY IS PERVERSE BEFORE ME — Our Rabbis, the Mishnaic Sages, explain it as an acrostic, יראה she feared when ראתה, she saw, and נטתה she turned aside (Shabbat 105a), because that the journey (הדרך) is לנגדי, is against me, that is to say, to anger me, to affront me. — But according to its literal meaning, it is equivalent to חרד הדרך לנגדי, the word ירט being associated in meaning with רטט, “rapid movement” (cf.  49:24). The phrase therefore signifies: for I have seen the man who is taking the journey (Balaam) that he hastened and hurried on the journey, which was taken to my anger and to my despite. It is an elliptical verse (the words בעל הדרך being omitted after ירט), just as (II Samuel 13:39) “And the soul of David longed” (the word נפש being omitted). Another explanation is: ירט is an expression denoting “being pleased”. Similar is, (Job 16:11) “Through the wicked ירטני” — i.e., He appeases and comforts me through the wicked, whilst indeed they do nought but annoy me (Midrash Tanchuma, Balak 9)."}, {"ch": 22, "v": 33, "aliyah": 5, "heb": "וַתִּרְאַ֙נִי֙ הָֽאָת֔וֹן וַתֵּ֣ט לְפָנַ֔י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִפָּנַ֔י כִּ֥י עַתָּ֛ה גַּם־אֹתְכָ֥ה הָרַ֖גְתִּי וְאוֹתָ֥הּ הֶחֱיֵֽיתִי׃", "onk": "וַחֲזַתְנִי אַתָּנָא וּסְטַת מִן קֳדָמַי דְּנַן תְּלַת זִמְנִין אִלּוּפוֹן לָא סְטַת מִן קֳדָמַי אֲרֵי כְעַן אַף יָתָךְ קְטָלִית וְיָתַהּ קַיֵּמִית:", "onk_en": "And when the donkey saw me, it turned aside these three times; had she not turned aside before me as [she did] now I would surely have killed you and she, I would let live.”", "pj": "וַחֲמַתְנִי אַתְנָא וּסְטַת מִן קֳדָמַי דְנַן תְּלַת זִמְנִין אִלוּלֵי פוֹן לָא סְטַת מִן קֳדָמַי אֲרוּם כְּעַן אוּף יָתָךְ קְטָלִית וְיָתָהּ קַיֵימִית", "pj_en": "But the ass discerned me, and turned away from me these three times: had she not turned from me, surely now I should have slain thee, and spared her alive.", "tj": "", "tj_en": "", "rashi": "<b>אולי נטתה.<\/b> כְּמוֹ לוּלֵי, פְּעָמִים שֶׁאוּלַי מְשַׁמֵּשׁ בִּלְשׁוֹן לוּלֵי:<br><br><b>גם אתכה הרגתי.<\/b> הֲרֵי זֶה מִקְרָא מְסֹרָס וְהוּא כְמוֹ גַּם הָרַגְתִּי אוֹתְךָ, כְּלוֹמַר, לֹא הָעַכָּבָה בִּלְבַד קְרָאַתְךָ עַל יָדִי, כִּי גַם הַהֲרִיגָה:<br><br><b>ואותה החייתי.<\/b> וְעַתָּה מִפְּנֵי שֶׁדִּבְּרָה וְהוֹכִיחַתְךָ, וְלֹא יָכֹלְתָּ לַעֲמֹד בְּתוֹכַחְתָּהּ — כְּמוֹ שֶׁכָּתוּב <b>ויאמר לא<\/b> — הֲרַגְתִּיהָ, שֶׁלֹּא יֹאמְרוּ, זוֹ הִיא שֶׁסִּלְּקָה בִלְעָם בְּתוֹכַחְתָּהּ וְלֹא יָכוֹל לְהָשִׁיב, שֶׁחָס הַמָּקוֹם עַל כְּבוֹד הַבְּרִיּוֹת, וְכֵן (ויקרא כ') \"וְהָרַגְתָּ אֶת הָאִשָּׁה וְאֶת הַבְּהֵמָה\", וְכֵן (שם) \"אֶת הַבְּהֵמָה תַּהֲרֹגוּ\" (תנחומא):", "rashi_en": "אולי נטתה — This is the same as לולא: UNLESS SHE HAD [TURNED ASIDE]. Sometimes אולי is used in the sense of לולא “unless”.<br><br>גם אתכה הרגתי SURELY NOW ALSO THEE HAD I SLAIN — This is an inverted sentence, and it is the same as גם הרגתי אותך — I would also have slain thee, as much as to say: not only would this delay have happened to you through me, but death also. <br><br>ואותה החייתי AND IT WOULD I HAVE KEPT ALIVE — but now because it spoke and rebuked you andyou could not stand against its rebuke, — just as it is written, \"and he said, No!\" — I have killed it in order that people should not be able to say: This is the animal that silenced Balaam by its rebuke, so that he could not reply. For God has regard for human dignity. Similar is (Leviticus 20:16): “And thou shalt slay the woman and the animal (with which sin was committed)”, and similarly Leviticus 20:15): “And the animal shalt thou slay” (Midrash Tanchuma, Balak 9)."}, {"ch": 22, "v": 34, "aliyah": 5, "heb": "וַיֹּ֨אמֶר בִּלְעָ֜ם אֶל־מַלְאַ֤ךְ יְהֹוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִקְרָאתִ֖י בַּדָּ֑רֶךְ וְעַתָּ֛ה אִם־רַ֥ע בְּעֵינֶ֖יךָ אָשׁ֥וּבָה לִּֽי׃", "onk": "וַאֲמַר בִּלְעָם לְמַלְאָכָא דַיְיָ חָבִית אֲרֵי לָא יְדָעִית דִּי אַתְּ מְעַתַּד לָקֳדָמוּתִי בְּאָרְחָא וּכְעַן אִם בִּישׁ בְּעֵינָיךְ אֵתוֹב לִי:", "onk_en": "Bil’am said to the angel of Adonoy: “I have sinned because I did not know that you were standing in the way before me; now therefore, if it is wicked in your eyes, I shall return.”", "pj": "וַאֲמַר בִּלְעָם לְמַלְאָכָא דַיְיָ חָבִית אֲרוּם לָא יְדָעִית אֲרוּם אַנְתְּ מְעַתַּד לִקְדָמוּתִי בְּאָרְחָא וּכְדוֹן אִין בִּישׁ קֳדָמָךְ אִיתוּב לִי", "pj_en": "And Bileam said to the angel of the Lord, I have sinned, because I knew not that thou wast standing against me in the way. But now, if it displease thee, I will go back.", "tj": "", "tj_en": "", "rashi": "<b>כי לא ידעתי.<\/b> גַּם זֶה גְנוּתוֹ, וְעַל כָּרְחוֹ הוֹדָה, שֶׁהוּא הָיָה מִשְׁתַּבֵּחַ שֶׁיּוֹדֵעַ דַּעַת עֶלְיוֹן, וּפִיו הֵעִיד לֹא יָדַעְתִּי (שם):<br><br><b>אם רע בעיניך אשובה לי.<\/b> לְהַתְרִיס נֶגֶד הַמָּקוֹם הִיא תְשׁוּבָה זוֹ, אָמַר לוֹ הוּא בְעַצְמוֹ צִוַּנִי לָלֶכֶת וְאַתָּה מַלְאָךְ מְבַטֵּל אֶת דְּבָרָיו, לָמוּד הוּא בְּכָךְ שֶׁאוֹמֵר דָּבָר וּמַלְאָךְ מַחֲזִירוֹ, אָמַר לְאַבְרָהָם \"קַח נָא אֶת בִּנְךָ\" וְגוֹ' (בראשית כ\"ב), וְעַל יְדֵי מַלְאָךְ בִּטֵּל אֶת דְּבָרוֹ, אַף אֲנִי אִם רַע בְּעֵינֶיךָ צָרִיךְ אֲנִי לָשׁוּב:", "rashi_en": "כי לא ידעתי FOR I KNEW NOT — This statement, too, (cf. v. 29), was a disgrace for him, for in spite of himself he had to admit it — because he used to boast that he knew the will of of the Most High (24:16) and now his own mouth bore testimony: “I knew not” (Midrash Tanchuma, Balak 10).<br><br>אם רע בעיניך אשובה לי IF IT BE EVIL IN THINE EYES, I WILL RETURN — To set himself in opposition to the Omnipresent was the purpose of this reply. He said, in effect, “He Himself commanded me to go, and you, angel, annul His words. He is accustomed to this — that He says something and an angel recalls it. He said to Abraham, (Genesis 22:2) Take now thy son, etc.’ and by an angel annulled His words. I, too: \"If it be evil in thine eyes, then I must return” (Midrash Tanchuma, Balak 10)."}, {"ch": 22, "v": 35, "aliyah": 5, "heb": "וַיֹּ֩אמֶר֩ מַלְאַ֨ךְ יְהֹוָ֜ה אֶל־בִּלְעָ֗ם לֵ֚ךְ עִם־הָ֣אֲנָשִׁ֔ים וְאֶ֗פֶס אֶת־הַדָּבָ֛ר אֲשֶׁר־אֲדַבֵּ֥ר אֵלֶ֖יךָ אֹת֣וֹ תְדַבֵּ֑ר וַיֵּ֥לֶךְ בִּלְעָ֖ם עִם־שָׂרֵ֥י בָלָֽק׃", "onk": "וַאֲמַר מַלְאָכָא דַיְיָ לְבִלְעָם אִזֵּל עִם גֻּבְרַיָּא וּלְחוֹד יָת פִּתְגָּמָא דִי אֲמַלֵּל עִמָּךְ יָתֵיהּ תְּמַלֵּל וַאֲזַל בִּלְעָם עִם רַבְרְבֵי בָלָק:", "onk_en": "The angel of Adonoy said to Bil’am: “Go with the men, but only the word that I will speak to you shall you speak” Bil’am then continued to go with Balak's dignitaries.", "pj": "וַאֲמַר מַלְאָכָא דַיְיָ לְבִלְעָם אִיזֵיל עִם גוּבְרַיָא וּבְרַם יַת פִּתְגָמָא דַאֲמַלֵיל עִמָךְ יָתֵיהּ תְמַלֵיל וְאָזַל בִּלְעָם יַת רַבְרְבֵי בָּלָק", "pj_en": "But the angel of the Lord said to Bileam, Go with these men; but the word that I will tell thee that thou shalt speak. And Bileam went with the princes of Balak.", "tj": "", "tj_en": "", "rashi": "<b>לך עם האנשים.<\/b> בַּדֶּרֶךְ שֶׁאָדָם רוֹצֶה לֵילֵךְ בָּהּ, מוֹלִיכִין אוֹתוֹ:<br><br><b>לך עם האנשים.<\/b> כִּי חֶלְקְךָ עִמָּהֶם וְסוֹפְךָ לֹאבַד מִן הָעוֹלָם (מכות י'):<br><br><b>ואפס.<\/b> עַל כָּרְחֲךָ <b>את הדבר אשר אדבר וגו'<\/b>:<br><br><b>עם שרי בלק.<\/b> שָֹמַח לְקַלְּלֵם כְּמוֹתָם:", "rashi_en": "לך עם האנשים GO WITH THE MEN — On that road which a man is resolved to go, he is allowed to go (Makkot 10b).<br><br>לך עם האנשים GO WITH THE MEN — for thy lot is with them, for in the end you will perish from the world. <br><br>ואפס BUT — in spite of yourself,  את הדבר אשר אדבר וגו׳ THE WORD THAT I SHALL SPEAK [TO THEE, THAT THOU SHALT SPEAK].<br><br>עם שרי בלק [SO BALAAM WENT] WITH THE PRINCES OF BALAK — he was glad to curse them, even as they were (see Rashi v. 21) (Midrash Tanchuma, Balak 10)."}, {"ch": 22, "v": 36, "aliyah": 5, "heb": "וַיִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַיֵּצֵ֨א לִקְרָאת֜וֹ אֶל־עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל־גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּקְצֵ֥ה הַגְּבֽוּל׃", "onk": "וּשְׁמַע בָּלָק אֲרֵי אֲתָא בִלְעָם וּנְפַק לָקֳדָמוּתֵיהּ לְקַרְתָּא דְמוֹאָב דִּי עַל תְּחוּם אַרְנוֹן דִּי בִּסְטַר תְּחוּמָא:", "onk_en": "When Balak heard that Bil’am was coming, he went out to meet him, to the city of Moav, which is on the boundary of Arnon—at the very edge of the boundary.", "pj": "וּשְׁמַע בָּלָק אֲרוּם אָתָא בִלְעָם וּנְפַק לִקְדָמוּתֵיהּ לְקַרְתָּא דְמוֹאָב דְעַל תְּחוּם אַרְנוֹן דְבִסְטַר תְּחוּמָא", "pj_en": "And Balak heard that Bileam was coming, and came out to meet him at a city of Moab on the border of Arnon, which is on the side of the frontier.", "tj": "", "tj_en": "", "rashi": "<b>וישמע בלק.<\/b> שָׁלַח שְׁלוּחִים לְבַשְּׂרוֹ:<br><br><b>אל עיר מואב.<\/b> אֶל מֶטְרוֹפּוֹלִין שֶׁלּוֹ — עִיר הַחֲשׁוּבָה שֶׁלּוֹ, לוֹמַר רְאֵה מָה אֵלּוּ מְבַקְשִׁים לַעֲקֹר (תנחומא):", "rashi_en": "וישמע בלק AND BALAK HEARD [THAT BALAAM WAS COMING] — He sent messengers to announce this to him.<br><br>אל עיר מואב [AND HE WENT TOWARDS HIM] UNTO THE CITY OF MOAB — to his metropolis, the most important city he had, as much as to say: See what these Israelites wish to exterminate (Midrash Tanchuma, Balak 10)."}, {"ch": 22, "v": 37, "aliyah": 5, "heb": "וַיֹּ֨אמֶר בָּלָ֜ק אֶל־בִּלְעָ֗ם הֲלֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֙יךָ֙ לִקְרֹא־לָ֔ךְ לָ֥מָּה לֹא־הָלַ֖כְתָּ אֵלָ֑י הַֽאֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽךָ׃", "onk": "וַאֲמַר בָּלָק לְבִלְעָם הֲלָא מִשְׁלַח שְׁלָחִית לְוָתָךְ לְמִקְרֵי לָךְ לְמָא לָא אָתֵיתָא לְוָתִי <b>הַבְּקוּשְׁטָא הֲוֵיתָא אָמַר לֵית אֲנָא<\/b> יָכִיל לְיַקְּרוּתָךְ:", "onk_en": "Balak said to Bil’am: “Did I not send so many [dignitaries] to invite you? Why did you not come to me? Am I really [<b>can you truthfully say that I am<\/b>] incapable of honoring you?”", "pj": "וַאֲמַר בָּלָק לְבִלְעָם הֲלָא שַׁדְרָא שְׁדָרִית לְוָתָךְ לְמִקְרֵי לָךְ לְמָא לָא אָתֵיתָא לְוָתִי הַבְּרַם מִן קוּשְׁטִין הֲוֵוית אָמַר לֵית אֲנָא יָכִיל לִמְיַיקְרָא יָתָךְ", "pj_en": "And Balak said to Bileam, Did I not send to call thee? Why camest thou not to me? Didst thou not indeed say that I could not do thee honour?", "tj": "", "tj_en": "", "rashi": "<b>האמנם לא אוכל כבדך.<\/b> נִתְנַבֵּא שֶׁסּוֹפוֹ לָצֵאת מֵעִמּוֹ בְקָלוֹן (שם):", "rashi_en": "האמנם לא אוכל כבדך AM I NOT ABLE INDEED TO HONOUR YOU — He prophesied unwittingly that he (Balaam) would eventually leave him in disgrace (Midrash Tanchuma, Balak 10)."}, {"ch": 22, "v": 38, "aliyah": 5, "heb": "וַיֹּ֨אמֶר בִּלְעָ֜ם אֶל־בָּלָ֗ק הִֽנֵּה־בָ֙אתִי֙ אֵלֶ֔יךָ עַתָּ֕ה הֲיָכֹ֥ל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַדָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּפִ֖י אֹת֥וֹ אֲדַבֵּֽר׃", "onk": "וַאֲמַר בִּלְעָם לְבָלָק הָא אָתֵיתִי לְוָתָךְ כְּעַן הֲמֵיכַל יָכִלְנָא לְמַלָּלָא מִדָּעָם פִּתְגָּמָא דִּישַׁוִּי יְיָ בְּפוּמִי יָתֵיהּ אֲמַלֵּל:", "onk_en": "Bil’am replied to Balak: “Now that I have come to you, have I any power to say anything? Only the word that God puts in my mouth will I speak.”", "pj": "וַאֲמַר בִּלְעָם לְבָלָק הָא אָתֵיתִי לְוָתָךְ כְּדוֹן הֲמֵיכַל יְכִילְנָא לְמַלָלָא מִדַעַם פִּתְגָמָא דִיזַמֵן יְיָ בְּפוּמִי יָתֵיהּ אֲמַלֵיל", "pj_en": "And Bileam said to Balak, Behold, I have come to thee; yet now am I able to say any thing to thee? But the word that the Lord shall ordain for my mouth, that I must speak.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 39, "aliyah": 6, "heb": "וַיֵּ֥לֶךְ בִּלְעָ֖ם עִם־בָּלָ֑ק וַיָּבֹ֖אוּ קִרְיַ֥ת חֻצֽוֹת׃", "onk": "וַאֲזַל בִּלְעָם עִם בָּלָק וַאֲתוֹ <b>לְקִרְיַת מָחוֹזוֹהִי<\/b>:", "onk_en": "Bil’am went with Balak and they came to Kiryas Chutzos [<b>the city of his territory<\/b>].", "pj": "וַאֲזַל בִּלְעָם עִם בָּלָק וְאָתוּן לְקַרְתָּא דְמַקְפַן שׁוּרִין לְפַּלְטִיוַון קַרְתָּא רַבְּתָא הִיא קַרְתָּא דְסִיחוֹן הִיא בִּירוֹשָׁא", "pj_en": "And Bileam went with Balak, and they came to a city surrounded with walls, to the streets of the great city, the city of Sihon, which is Berosha.", "tj": "", "tj_en": "", "rashi": "<b>קרית חצות.<\/b> עִיר מְלֵאָה שְׁוָקִים, אֲנָשִׁים וָטַף בְּחוּצוֹתֶיהָ, לוֹמַר רְאֵה וְרַחֵם שֶׁלֹּא יֵעָקְרוּ אֵלּוּ:", "rashi_en": "קרית חצות — a city (קריה) full of streets (חצות), — men and women and children thronging the streets, as much as to say: Look and have pity that these should not be exterminated (Midrash Tanchuma, Balak 11)."}, {"ch": 22, "v": 40, "aliyah": 6, "heb": "וַיִּזְבַּ֥ח בָּלָ֖ק בָּקָ֣ר וָצֹ֑אן וַיְשַׁלַּ֣ח לְבִלְעָ֔ם וְלַשָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽוֹ׃", "onk": "וּנְכֵס בָּלָק תּוֹרִין וְעָאן וּשְׁלַח לְבִלְעָם וּלְרַבְרְבַיָּא דִּי עִמֵּיהּ:", "onk_en": "Balak slaughtered cattle and sheep and he sent some to Bil’am and to the dignitaries that were with him.", "pj": "וּנְחַר בָּלָק תּוֹרִין וְעָאן וְשָׁדַר לְבִלְעָם וּלְרַבְרְבַיָא דְעִמֵיהּ", "pj_en": "And Balak slew oxen and sheep, and sent to Bileam and the princes, and those who were with them.", "tj": "", "tj_en": "", "rashi": "<b>בקר וצאן.<\/b> דָּבָר מוּעָט:", "rashi_en": "בקר וצאן THE HERD AND FLOCK — a small matter (one ox and one sheep, nothing in comparison with what he had promised him) (Midrash Tanchuma, Balak 11)."}, {"ch": 22, "v": 41, "aliyah": 6, "heb": "וַיְהִ֣י בַבֹּ֔קֶר וַיִּקַּ֤ח בָּלָק֙ אֶת־בִּלְעָ֔ם וַֽיַּעֲלֵ֖הוּ בָּמ֣וֹת בָּ֑עַל וַיַּ֥רְא מִשָּׁ֖ם קְצֵ֥ה הָעָֽם׃", "onk": "וַהֲוָה בְצַפְרָא וּדְבַר בָּלָק יָת בִּלְעָם וְאַסְּקֵיהּ <b>לְרָמַת דַּחַלְתֵּיהּ<\/b> וְחֲזָא מִתַּמָּן קְצַת מִן עַמָּא:", "onk_en": "In the morning, Balak took Bil’am and he led him up to Bamos Ba’al [<b>the high place of his idol<\/b>]; from there he saw part of the people.", "pj": "וַהֲוָה עִידוֹנֵי צַפְרָא וּדְבַר בָּלָק יַת בִּלְעָם וְאַסְקֵיהּ לְרָמַת דַחַלְתָּא דִפְעוֹר וַחֲמָא מִתַּמָן מַשִׁירְיַית דָן דִמְהַלְכִין בִּקְצַת עַמָא דְאִתְפָּרְסִימוּ מִתְּחוֹת עֲנָנֵי יְקָרָא", "pj_en": "And at the time of the morning Balak took Bileam, and brought him up to the high place of the idol Peor; saw from thence the camp of Dan, which went at the rear of the people; and they were discovered under the Cloud of Glory.", "tj": "", "tj_en": "", "rashi": "<b>במות בעל.<\/b> כְּתַרְגּוּמוֹ, \"לְרָמַת דַּחַלְתֵּהּ\", שֵׁם עֲ\"זָ:", "rashi_en": "במות בעל BAMOTH-BAAL — Understand this as the Targum does: to the heights of his god (more lit., of that which he reverenced); Baal is the name of a god."}, {"ch": 23, "v": 1, "aliyah": 6, "heb": "וַיֹּ֤אמֶר בִּלְעָם֙ אֶל־בָּלָ֔ק בְּנֵה־לִ֥י בָזֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְהָכֵ֥ן לִי֙ בָּזֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְשִׁבְעָ֥ה אֵילִֽים׃", "onk": "וַאֲמַר בִּלְעָם לְבָלָק בְּנֵה לִי הָכָא שַׁבְעָא מַדְבְּחִין וְאַתְקֵן לִי הָכָא שַׁבְעָא תוֹרִין וְשַׁבְעָא דִכְרִין:", "onk_en": "Bil’am said to Balak: “Build seven altars for me here, and prepare for me seven bulls and seven rams.”", "pj": "וַהֲוָה כֵּיוַן דְחָמָא בִּלְעָם יַתְהוֹן דְפוּלְחָנָא נוּכְרָאָה בֵּינֵיהוֹן חֲדָא בְּלִבֵּיהּ וַאֲמַר לְבָלָק בְּנֵה לִי הָכָא שׁוּבְעָא אֱגוֹרִין וְעַתַּד לִי הָכָא שַׁבְעָא תוֹרִין וְשַׁבְעָא דִכְרִין", "pj_en": "And Bileam, as he looked upon them, knew that strange worship was among them, and rejoiced in his heart; and he said to Balak, Build here seven altars, and prepare me here seven bullocks and seven rams.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 2, "aliyah": 6, "heb": "וַיַּ֣עַשׂ בָּלָ֔ק כַּאֲשֶׁ֖ר דִּבֶּ֣ר בִּלְעָ֑ם וַיַּ֨עַל בָּלָ֧ק וּבִלְעָ֛ם פָּ֥ר וָאַ֖יִל בַּמִּזְבֵּֽחַ׃", "onk": "וַעֲבַד בָּלָק כְּמָא דִי מַלֵּיל בִּלְעָם וְאַסֵּק בָּלָק וּבִלְעָם תּוֹר וּדְכַר עַל כָּל מַדְבְּחָא:", "onk_en": "Balak did as Bil’am requested. Balak and Bil’am then sacrificed as burnt-offerings an ox and a ram on each altar.", "pj": "וַעֲבַד בָּלָק הֵיכְמָא דְמַלֵיל בִּלְעָם וְאַסֵיק בָּלָק וּבִלְעָם תּוֹר וּדְכַר עַל אָגוֹרָא", "pj_en": "And Balak did as Bileam had said, and Balak and Bileam offered a bullock and a ram upon an altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 3, "aliyah": 6, "heb": "וַיֹּ֨אמֶר בִּלְעָ֜ם לְבָלָ֗ק הִתְיַצֵּב֮ עַל־עֹלָתֶ֒ךָ֒ וְאֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהֹוָה֙ לִקְרָאתִ֔י וּדְבַ֥ר מַה־יַּרְאֵ֖נִי וְהִגַּ֣דְתִּי לָ֑ךְ וַיֵּ֖לֶךְ שֶֽׁפִי׃", "onk": "וַאֲמַר בִּלְעָם לְבָלָק אִתְעַתַּד עַל עֲלָתָךְ וְאֵיהַךְ מָאִים יְעָרַע <b>מֵימַר מִן קֳדָם<\/b> יְיָ לָקֳדָמוּתִי וּפִתְגָּמָא דְיַחֲזִנַּנִי וְאֵחַוֵּי לָךְ וַאֲזַל יְחִידִי:", "onk_en": "Bil’am said to Balak: “Stand beside your burnt-offering and I will go away. Perhaps, [<b>a word from before<\/b>] Adonoy will appear to me, and whatever He will show me I will tell you.” And he went away alone.", "pj": "וַאֲמַר בִּלְעָם לְבָלָק אִתְעַתַּד עַל עֲלָתָךְ וְאֵיהַךְ וְדִלְמָא יִזְדְמַן מֵימְרָא דַיְיָ לְקָדָמוּתִי וּפִתְגָם מָה דִיחַוֵי לִי וְאֵיתְנֵיהּ לָךְ וְאָזִיל גָחִין כְּחִיוְיָא", "pj_en": "And Bileam said to Balak, Stand by thy burnt offering, and I will go, if preadventure the Word of the Lord may come to meet me; and the word that shall be discovered to me, that I will declare to thee. And he went, bending as a serpent.", "tj": "וַאֲזַל בִּלְעָם בְּלֵב שֶׁפִי:", "tj_en": "And Bileam went with a humbled heart.", "rashi": "<b>אולי יקרה ה' לקראתי.<\/b> אֵינוֹ רָגִיל לְדַבֵּר עִמִּי בַּיּוֹם:<br><br><b>וילך שפי.<\/b> כְּתַרְגּוּמוֹ יְחִידִי, לְשׁוֹן שֹׁפִי וְשֶׁקֶט, שֶׁאֵין עִמּוֹ אֶלָּא שְׁתִיקָה:", "rashi_en": "'אולי יקרה ה‎‎ לקראתי PERHAPS THE LORD WILL HAPPEN TO MEET ME — Perhaps: He is not accustomed to speak with me by day.<br><br>וילך שפי AND HE WENT שפי — Understand this as the Targum does: “alone”; it is an expression denoting ease and tranquillity; the statement means that there was nothing with him except silence (nothing to disturb him)."}, {"ch": 23, "v": 4, "aliyah": 6, "heb": "וַיִּקָּ֥ר אֱלֹהִ֖ים אֶל־בִּלְעָ֑ם וַיֹּ֣אמֶר אֵלָ֗יו אֶת־שִׁבְעַ֤ת הַֽמִּזְבְּחֹת֙ עָרַ֔כְתִּי וָאַ֛עַל פָּ֥ר וָאַ֖יִל בַּמִּזְבֵּֽחַ׃", "onk": "וַעֲרַע <b>מֵימַר מִן קֳדָם<\/b> יְיָ לְוָת בִּלְעָם וַאֲמַר לֵיהּ יָת שַׁבְעָא מַדְבְּחִין סַדָּרִית וְאַסֵּקִית תּוֹר וּדְכַר עַל כָּל מַדְבְּחָא:", "onk_en": "[<b>A word from before<\/b>] God chanced to appear to Bil’am, and he said to Him: “I have set up the seven altars and I offered [as burnt-offerings] an ox and a ram on the altar.”", "pj": "וְאַרַע מֵימְרָא מִן קֳדָם יְיָ בְּבִלְעָם וַאֲמַר קֳדָמוֹהִי יַת שׁוּבְעָתֵי אוֹגָרַיָא סְדָרִית וְאַסֵיקִית תּוֹר וּדְכַר עַל כָּל אַגוֹרָא", "pj_en": "And the Word from before the Lord met with Bileam, who said before Him, The seven altars I have set in order, and have offered a bullock and a ram upon every altar.", "tj": "", "tj_en": "", "rashi": "<b>ויקר.<\/b> לְשׁוֹן עֲרַאי, לְשׁוֹן גְּנַאי, לְשׁוֹן טֻמְאַת קֶרִי, כְּלוֹמַר בְּקֹשִׁי וּבְבִזָּיוֹן, וְלֹא הָיָה נִגְלֶה אֵלָיו בַּיּוֹם אֶלָּא בִּשְׁבִיל לְהַרְאוֹת חִבָּתָן שֶׁל יִשְׂרָאֵל (בראשית רבה נ\"ב):<br><br><b>את שבעת המזבחת.<\/b> שִׁבְעָה מִזְבְּחֹת עָרַכְתִּי אֵין כְּתִיב כָּאן, אֶלָּא אֶת שִׁבְעַת הַמִּזְבְּחֹת, אָמַר לְפָנָיו אֲבוֹתֵיהֶם שֶׁל אֵלּוּ בָּנוּ לְפָנֶיךָ שִׁבְעָה מִזְבְּחוֹת וַאֲנִי עָרַכְתִּי כְּנֶגֶד כֻּלָּן, אַבְרָהָם בָּנָה אַרְבָּעָה — \"וַיִּבֶן שָׁם מִזְבֵּחַ לַה' הַנִּרְאֶה אֵלָיו\" (בראשית י\"ב), \"וַיַּעְתֵּק מִשָּׁם הָהָרָה\" וְגוֹ' (שם), \"וַיֶּאֱהַל אַבְרָהָם\" וְגוֹ' (שם י\"ג), וְאֶחָד בְּהַר הַמּוֹרִיָּה; וְיִצְחָק בָּנָה אֶחָד — \"וַיִּבֶן שָׁם מִזְבֵּחַ\" וְגוֹ' (שם כ\"ו), וְיַעֲקֹב בָּנָה שְׁתַּיִם, אֶחָד בִּשְׁכֶם וְאֶחָד בְּבֵית אֵל:<br><br><b>ואעל פר ואיל במזבח.<\/b> וְאַבְרָהָם לֹא הֶעֱלָה אֶלָּא אַיִל אֶחָד (תנחומא צו):", "rashi_en": "ויקר AND [GOD] HAPPENED TO MEET [BALAAM] — This is an expression ordinarily used to denote events of a casual character, an expression for something shameful, an expression for an unclean happening (קרי). It is as much as to say: with reluctance and in a contemptuous manner. And on this occasion He revealed Himself to him by day, only to show how dear Israel was to Him (cf. Genesis Rabbah 52:5; Rashi on Leviticus 1:1).<br><br>את שבעת המזבחות — “Seven altars I have set in order” is not written here, but “THE SEVEN ALTARS”. He said to Him: The ancestors of these people together built before Thee seven altars, but I alone have built altars equal to all of them. — Abraham built four: (Genesis 12:7) “And he built there an altar to the Lord who had appeared to him”; (Genesis 12:8) “And he removed thence unto the mount… [and he built there an altar]; (Genesis 13:18) “And Abraham moved his tent … [and built there an altar]”; and one he built on Mount Moriah (Genesis 22:9). Isaac built one: (Genesis 26:25) “And he built there an altar”. Jacob built two, one at Shechem and one at Bethel (Genesis 33:20 and Genesis 35:7);<br><br>ואעל פר ואיל במזבח AND I HAVE OFFERED UPON EVERY ALTAR A BULLOCK AND A RAM — “but Abraham”, said he, “offered only a single ram” (cf. Midrash Tanchuma, Balak 11, Midrash Tanchuma, Tzav 1)."}, {"ch": 23, "v": 5, "aliyah": 6, "heb": "וַיָּ֧שֶׂם יְהֹוָ֛ה דָּבָ֖ר בְּפִ֣י בִלְעָ֑ם וַיֹּ֛אמֶר שׁ֥וּב אֶל־בָּלָ֖ק וְכֹ֥ה תְדַבֵּֽר׃", "onk": "וְשַׁוִּי יְיָ פִּתְגָּמָא בְּפוּמָא דְבִלְעָם וַאֲמַר תּוּב לְוָת בָּלָק וּכְדֵין תְּמַלֵּל:", "onk_en": "Adonoy put a message in Bil’am's mouth and He said: “Return to Balak and tell him as follows.”", "pj": "וְשַׁוִי יְיָ יַת פִּתְגָמָא בְּפוּם בִּלְעָם וַאֲמַר תּוּב לְוַת בָּלָק וְהֵיכְדֵין תְּמַלֵיל", "pj_en": "And the Lord put a word in Bileam's mouth, and said, Return to Balak, and thus speak.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 6, "aliyah": 6, "heb": "וַיָּ֣שׇׁב אֵלָ֔יו וְהִנֵּ֥ה נִצָּ֖ב עַל־עֹלָת֑וֹ ה֖וּא וְכׇל־שָׂרֵ֥י מוֹאָֽב׃", "onk": "וְתָב לְוָתֵיהּ וְהָא מְעַתַּד עַל עֲלָתֵיהּ הוּא וְכָל רַבְרְבֵי מוֹאָב:", "onk_en": "When he returned, Balak was still standing next to his burnt-offering together with all the dignitaries of Moav.", "pj": "וְתַב לְוָתֵיהּ וְהָא מְעַתַּד עַל עֲלָתֵיהּ הוּא וְכָל רַבְרְבֵי מוֹאָב", "pj_en": "And he returned to him, and, behold, he was standing by his burnt-offering, he and all the nobles of Moab.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 7, "aliyah": 6, "heb": "וַיִּשָּׂ֥א מְשָׁל֖וֹ וַיֹּאמַ֑ר מִן־אֲ֠רָ֠ם יַנְחֵ֨נִי בָלָ֤ק מֶֽלֶךְ־מוֹאָב֙ מֵֽהַרְרֵי־קֶ֔דֶם לְכָה֙ אָֽרָה־לִּ֣י יַעֲקֹ֔ב וּלְכָ֖ה זֹעֲמָ֥ה יִשְׂרָאֵֽל׃", "onk": "וּנְטַל מַתְלֵיהּ וַאֲמַר מִן אֲרָם דַּבְּרַנִי בָלָק מַלְכָּא דְמוֹאָב מִטּוּרֵי מַדִּינְחָא אִיתָא לוּט לִי יַעֲקֹב וְאִיתָא תָּרֵךְ לִי יִשְׂרָאֵל:", "onk_en": "Bil’am set forth his parable, and said: “From Aram has Balak, King of Moav, brought me, out of the mountains of the east [saying]: 'Come, curse Yaakov for me; go, invoke wrath against Yisroel.", "pj": "וּנְטַל מְתַל נְבוּתֵיהּ וַאֲמַר מִן אֲרַם דְעַל פְּרָת דַבְּרַנִי בָּלָק מַלְכָּא דְמוֹאֲבָאֵי מִן טַוְורֵי מַדִינְחָא אִיתָא לוֹט בְּגִנִי דְבֵית יַעֲקב וְאִיתָא זְעֵיר לִי יִשְרָאֵל", "pj_en": "And he took up the parable of his prophecy, and said: From Aram on Euphrates hath Balak king of the Moabaee brought me; from the mountains of the east come, curse for me the house of Jakob; come, for me make Israel small.", "tj": "וּנְטַל בִּמְתַל נְבִיוּתֵיהּ וַאֲמַר מִן אֲרָם דַבַּר יָתִי בָּלָק מַלְכֵיהוֹן דְמוֹאֲבָאֵי מִטוּרֵי מַדִינְחָא אִיתָא כְעַן לַיִיט לִי דְבֵית יַעֲקב וְאִיתָא זְעֵיר לִי שִׁבְטַיָא דְבֵית יִשְרָאֵל:", "tj_en": "And he took up the parable of his prophecy, and said: Balak, the king of the Moabaee, hath brought me from Aram, from the mountains of the east: Come, curse for me the house of Jakob, come, diminish for me the tribes of the house of Israel.", "rashi": "<b>ארה לי יעקב ולכה זעמה ישראל.<\/b> בִּשְׁנֵי שְׁמוֹתֵיהֶם אָמַר לוֹ לְקַלְּלָם שֶׁמָּא אֶחָד מֵהֶם אֵינוֹ מֻבְהָק:", "rashi_en": "ארה לי יעקב ולכה זעמה ישראל CURSE JACOB FOR ME AND COME EXECRATE ISRAEL — by their two names did he bid him curse them, for perhaps one of them was not distinctive enough to point them out beyond all doubt as being the people against whom the curse was directed."}, {"ch": 23, "v": 8, "aliyah": 6, "heb": "מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖ה אֵ֑ל וּמָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהֹוָֽה׃", "onk": "מָא אֲלוֹטֵיהּ דְלָא לַטְיֵהּ אֵל וּמָא אֲתָרְכֵיהּ דְּלָא תָרְכֵיהּ יְיָ:", "onk_en": "How can I curse, when God has not cursed? What Divine wrath can I evoke if Adonoy has not been angry?", "pj": "מָה אֲנָא לָאִיט וּמֵימְרָא דַיְיָ מְבָרֵךְ יַתְהוֹן וּמִן אֲנָא מַזְעֵיר וּמֵימְרָא דַיְיָ מַסְגֵי יַתְהוֹן", "pj_en": "How shall I curse, (while) the Word of the Lord blesseth them? and whom shall I diminish, when the Word of the Lord increaseth them?", "tj": "מָה אֲנָא לַיִיט דְבֵית יַעֲקב וּמֵימְרָא דַיְיָ מְבָרֵךְ יַתְהוֹן וּמָה אֲנָא מַזְעֵיר דְבֵית יִשְרָאֵל וּמֵימְרָא דַיְיָ מַסְגֵי יַתְהוֹן:", "tj_en": "Wherewith shall I curse the house of Jakob, when the Word of the Lord blesseth them? and how shall I diminish the house of Israel, when the Word of the Lord doth multiply them?", "rashi": "<b>מה אקב לא קבה אל.<\/b> כְּשֶׁהָיוּ רְאוּיִים לְהִתְקַלֵּל לֹא נִתְקַלְּלוּ — כְּשֶׁהִזְכִּיר אֲבִיהֶם אֶת עֲוֹנָם \"כִּי בְאַפָּם הָרְגוּ אִישׁ\", לֹא קִלֵּל אֶלָּא אַפָּם, שֶׁנֶּאֱמַר \"אָרוּר אַפָּם\" (בראשית מ\"ט); כְּשֶׁנִּכְנַס אֲבִיהֶם בְּמִרְמָה אֵצֶל אָבִיו הָיָה רָאוּי לְהִתְקַלֵּל, מַה נֶּאֱמַר שָׁם? \"גַּם בָּרוּךְ יִהְיֶה\" (שם כ\"ז), בַּמְבָרְכִים נֶאֱמַר \"אֵלֶּה יַעַמְדוּ לְבָרֵךְ אֶת הָעָם\", בַּמְקַלְּלִים לֹא נֶאֱמַר וְאֵלֶּה יַעַמְדוּ לְקַלֵּל אֶת הָעָם אֶלָּא \"וְאֵלֶּה יַעַמְדוּ עַל הַקְּלָלָה\" (דברים כ\"ז) — לֹא רָצָה לְהַזְכִּיר עֲלֵיהֶם שֵׁם קְלָלָה (תנחומא):<br><br><b>לא זעם ה'.<\/b> אֲנִי אֵין כֹּחִי אֶלָּא שֶׁאֲנִי יוֹדֵעַ לְכַוֵּן הַשָּׁעָה שֶׁהַקָּבָּ\"ה כוֹעֵס בָּהּ, וְהוּא לֹא כָעַס כָּל הַיָּמִים הַלָּלוּ שֶׁבָּאתִי אֵלֶיךָ, וְזֶהוּ שֶׁנֶּאֱמַר (מיכה ו') \"עַמִּי זְכָר נָא מַה יָּעַץ\" וְגוֹ' \"וּמֶה עָנָה אֹתוֹ בִּלְעָם\" וְגוֹ' \"לְמַעַן דַּעַת צִדְקוֹת ה'\" (סנהדרין ק\"ה):", "rashi_en": "מה אקב ולא קבה אל HOW SHALL I CURSE WHOM GOD HATH NOT CURSED — Even when they deserved to be cursed, they were not cursed. When their ancestor, Jacob, made mention of their sin — (Genesis 49:6) “For in their anger they slew a man” — he cursed their anger only, as it is said, (Genesis 49:7) “Cursed be their anger”. When their ancestor, Jacob, went to his father with deceit he deserved to be cursed, but what is stated there (Genesis 27:33)? “Yea, he shall be blessed”. In the case of those tribes who had to recite the blessings it is said, (Deuteronomy 27:12) “These shall stand to bless the people”, but in the case of those who had to pronounce the curses it does not state, “And these shall stand to curse the people”, but, “And these shall stand for the curse”, — it does not wish to mention the term “cursing” in direct reference to them (the people) (Midrash Tanchuma, Vayechi 1; Midrash Tanchuma, Balak 12).<br><br>לא זעם ה׳” GOD IS NOT ANGRY — As for me, my power lies only in that I know to determine the exact moment when the Holy One, blessed be He, is angry, and He has not been angry all these days that I have been coming to you. And this is the meaning of what is said (Micah 6:5): “O my people, remember now what [Balak, king of Moab] devised and what Balaam [the son of Beor] answered him … that ye may know the righteous acts of the Lord” (Sanhedrin 105b)."}, {"ch": 23, "v": 9, "aliyah": 6, "heb": "כִּֽי־מֵרֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔נּוּ וּמִגְּבָע֖וֹת אֲשׁוּרֶ֑נּוּ הֶן־עָם֙ לְבָדָ֣ד יִשְׁכֹּ֔ן וּבַגּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב׃", "onk": "אֲרֵי מֵרֵישׁ טוּרַיָּא חֲזִיתֵיהּ וּמֵרָמָתָא סְכִיתֵיהּ הָא עַמָּא בִּלְחוֹדֵיהוֹן <b>עֲתִידִין דְּיַחְסְנוּן עָלְמָא<\/b> וּבַעֲמָמַיָּא <b>לָא יִתְדָּנוּן גְּמִירָא<\/b>:", "onk_en": "For I view it, from the mountain peaks, I gaze upon it from the hills; behold! A people which shall dwell alone [<b>and are destined to inhabit the world<\/b>] and will not be reckoned among the nations [<b>not be judged for annihilation<\/b>].", "pj": "אָמַר בִּלְעָם רַשִׁיעָא מִסְתַּכֵּל אֲנָא בְּעַמָא הָדֵין דְהִינוּן מְדַבְּרִין בִּזְכוּת אַבְהַתְהוֹן צַדִיקַיָא דִמְתִילִין לְטַוְרַיָא וּבִזְכוּת אִימָהַתְהוֹן דִמְתִילַן לִגְלִימָתָא הָא עַמָא בִלְחוֹדֵיהוֹן עֲתִידִין לְמִיחְסַן עַלְמָא מְטוּל דִבְנִימוּסֵי אוּמַיָא לָא מְדַבְּרִין", "pj_en": "For, said Bileam the wicked, I look on this people who are led on for the sake of their righteous fathers, who are like the mountains, and of their mothers, who are like the hills: behold, this people alone are to possess the world, because they are not led by the laws of the nations.", "tj": "חֲמֵי אֲנָא עַמָא הָאִלֵין מְדַבְּרִין בִּזְכוּת אַבְהַתְהוֹן צַדִיקַיָא דִמְתִילִין לְטוּרַיָא אַבְרָהָם יִצְחָק וְיַעֲקב וּבִזְכוּת אַרְבַּעְתֵּי אַמְהָתָא דִמְתִילִין כְּגַלְמָתָא שָרָה רִבְקָה רָחֵל וְלֵאָה הָא עַמָא דְאִינוּן לְבִלְחוֹדֵיהוֹן שַׁרְיָין וּבְנִימוּסֵי עַמְמַיָא לָא מִתְעַרְבִין:", "tj_en": "I see this people, who are conducted through the merit of their righteous fathers, Abraham, Izhak, and Jakob, who are like the mountains, and of their four mothers, Sarah, Rivekah, Rahel, and Leah: behold, this people shall dwell alone, and not be mixed with the laws of the Gentiles.", "rashi": "<b>כי מראש צרים אראנו.<\/b> אֲנִי מִסְתַּכֵּל בְּרֵאשִׁיתָם וּבִתְחִלַּת שָׁרְשֵׁיהֶם וַאֲנִי רוֹאֶה אוֹתָם מְיֻסָּדִים וַחֲזָקִים כְּצוּרִים וּגְבָעוֹת הַלָּלוּ עַל יְדֵי אָבוֹת וְאִמָּהוֹת (תנחומא):<br><br><b>הן עם לבדד ישכן.<\/b> הוּא אֲשֶׁר זָכוּ לוֹ אֲבוֹתָיו — לִשְׁכֹּן בָּדָד, כְּתַרְגּוּמוֹ:<br><br><b>ובגוים לא יתחשב.<\/b> כְּתַרְגּוּמוֹ, לֹא יִהְיוּ נַעֲשִׂין כָּלָה עִם שְׁאָר הָאֻמּוֹת, שֶׁנֶּאֱמַר (ירמיהו ל') \"כִּי אֶעֱשֶׂה כָלָה בְּכָל הַגּוֹיִם\" וְגוֹ', אֵינָן נִמְנִין עִם הַשְּׁאָר. דָּ\"אַ — כְּשֶׁהֵן שְׂמֵחִין אֵין אֻמָּה שְׂמֵחָה עִמָּהֶם, שֶׁנֶּאֱמַר \"ה' בָּדָד יַנְחֶנּוּ\" (דברים ל\"ב), וּכְשֶׁהָאֻמּוֹת בְּטוֹבָה הֵן אוֹכְלִין עִם כָּל אֶחָד וְאֶחָד וְאֵין עוֹלֶה לָהֶם מִן הַחֶשְׁבּוֹן, וְזֶהוּ <b>ובגוים לא יתחשב<\/b> (תנחומא):", "rashi_en": "כי מראש צורים אראנו FOR FROM THE TOP OF THE ROCKS I SEE HIM — I look at their origin and at the beginning of their root (descent), and I behold them strongly founded as younder rocks and mountains through their ancestors and ancestresses (Rashi translates thus: For (כי) starting from their very beginning (מראש) I behold them firm as rocks) (Midrash Tanchuma, Balak 12).<br><br>הן עם לבדד ישכן LO, THE PEOPLE SHALL DWELL ALONE — This it is what their ancestors have given them as a prerogative: to dwell in the world alone — as is the sense given to the passage by the Targum (“Lo, this people is alone destined to inherit the world\").<br><br>ובגוים לא יתחשב AND SHALL NOT RECKON ITSELF AMONG THE NATIONS — Understand this as the Targum does — They will not be exterminated with the other nations, as it is said, ( 30:11) “For I will make a full end of all the nations [… but I will not make a full end of thee]”. The words therefore mean: They do not come under the same reckoning (לא יתחשב) with other nations. — Another explanation is: When they rejoice, no other nation rejoices with them, as it is said, (Deuteronomy 32:12) “The Lord will lead him alone to future bliss”, and when the nations are in prosperity they (the Israelites) eat with each one of them and yet it is not taken into account or them thereby to diminish their reward in the future life; and this is the meaning of ובגוים לא יתחשב (“and when they enjoy with the nations it is not taken into account) (Midrash Tanchuma, Balak 12)."}, {"ch": 23, "v": 10, "aliyah": 6, "heb": "מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּמִסְפָּ֖ר אֶת־רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁי֙ מ֣וֹת יְשָׁרִ֔ים וּתְהִ֥י אַחֲרִיתִ֖י כָּמֹֽהוּ׃", "onk": "מָן יֵיכוֹל לְמִמְנֵי דַּעְדְּקַיָּא <b>דְבֵית<\/b> יַעֲקֹב <b>דְּאָמִיר עֲלֵיהוֹן יִסְגּוּן כְּעַפְרָא דְאַרְעָא<\/b> אוֹ <b>חֲדָא מֵאַרְבַּע מַשִּׁרְיָתָא דְיִשְׂרָאֵל<\/b> תְּמוּת נַפְשִׁי מוֹתָא דְקַשִּׁיטוֹהִי וִיהֵי סוֹפִי כְּוָתְהוֹן:", "onk_en": "Who can count the dust of [<b>the house of<\/b>] Yaakov [<b>of whom it is said: they will multiply as the dust of the earth<\/b>] or count the seed of Yisroel [<b>or one of the four camps of Yisrael<\/b>]? May my soul die the death of the righteous, and let my end be like his.”", "pj": "וַהֲוָה כֵּיוַן דְחָמָא בִּלְעָם חַיָיבָא דְבֵית יִשְרָאֵל הֲווֹן גָזְרִין עוּרְלַתְהוֹן וְטַמְרִין בְּעַפְרָא דְמַדְבְּרָא אָמַר מַאן יֵיכוֹל לְמִמְנֵי זַכְוָותָא חַסִינְיָיא הָאִילֵין וּסְכוּם עוּבְדַיָא טַבְיָא דְעִם חֲדָא מִן אַרְבַּעְתֵּי מַשִׁירְיָתָא דְיִשְרָאֵל אָמַר בִּלְעָם רַשִׁיעָא אִין קַטְלִין יָתִי בֵּית יִשְרָאֵל בְּסַיְיפָא כְּבַר מְבַשְרָנָא דְלֵית לִי חוּלַק לְעַלְמָא דְאָתֵי בְּרַם אִין מַיִיתְנָא מוֹתָא דְקַשִׁיטִין לְוַאי דְתֵיהֵי סוֹפִי כִּזְעֵירָא דִבְהוֹן", "pj_en": "And when Bileam the sinner beheld the house of Israel, a circumcised people, hidden in the dust of the desert, he said, Who can number the merits of these strong ones, or count the good works of one of the four camps of Israel? Bileam the wicked said: If the house of Israel kill me with the sword, then, it is made known to me, I shall have no portion in the world to come: nevertheless if I may but die the death of the true! O that my last end may be as the least among them!", "tj": "מָן יֵיכְלֵי לְמִמְנֵי עוּלֵימֵיהוֹן דְבֵית יַעֲקב דְאִתְאַמַר עֲלֵיהוֹן דִי הֲווֹן סַגְיָן כְּכוֹכְבֵי שְׁמַיָא אָמַר בִּלְעָם רַשִׁיעָא בִּמְתַל נְבִיוּתֵיהּ אִין קַטְלִין הִינוּן יִשְרָאֵל יָתֵיהּ בְּחַרְבָּא מְבַשֵר הוּא בִּלְעָם דְלֵית לֵיהּ חוּלַק לְעַלְמָא דְאָתֵי בְּרַם אִין מַיִית הוּא בִּלְעָם מוֹתְנִין קְשִׁיטִין הַלְוַאי תֶּהֱוֵי אַחֲרִיתִי כִּזְעֵירָא דִי בְהוֹן:", "tj_en": "Who can number the youth of the house of Jakob, of whom it is said, They are to be like the stars of the skies? Bileam the wicked said, in the parable of his prophecy, If Israel do kill him with the sword Bileam himself declareth that he hath no portion in the world to come: but if Bileam may die as the faithful die, may his last end be as one of the least among them.", "rashi": "<b>מי מנה עפר יעקב וגו'.<\/b> כְּתַרְגּוּמוֹ \"דַּעְדְּקַיָּא דְבֵית יַעֲקֹב\", מֵאַרְבַּע מַשִּׁרְיָתָא — מֵאַרְבָּעָה דְּגָלִים; דָּ\"אַ, עֲפַר יַעֲקֹב, אֵין חֶשְׁבּוֹן בַּמִּצְוֹת שֶׁהֵם מְקַיְּמִין בְּעָפָר, \"לֹא תַחֲרֹשׁ בְּשׁוֹר וּבַחֲמֹר\" (דברים כ\"ב), \"לֹא תִזְרַע כִּלְאָיִם\" (ויקרא י\"ט), אֵפֶר פָּרָה וַעֲפַר סוֹטָה וְכַיּוֹצֵא בָהֶם (תנחומא):<br><br><b>ומספר את רבע ישראל.<\/b> רְבִיעוֹתֵיהֶן, זֶרַע הַיּוֹצֵא מִן הַתַּשְׁמִישׁ שֶׁלָּהֶם (עי' נדה ל\"א):<br><br><b>תמת נפשי מות ישרים.<\/b> שֶׁבָּהֶם:", "rashi_en": "מי מנה עפר יעקב וגו׳ WHO HATH COUNTED THE DUST OF JACOB [AND THE NUMBER OF THE FOURTH PART OF ISRAEL] — Understand this as the Targum does: [who has counted] the infants of the house of Jacob, who are compared to the dust of the earth (Genesis 13:16). The words מארבע משריתא in the Targum mean; [who can count … even one] of the four (רבע “a fourth”) banners (companies of the tribes). — Another explanation of עפר יעקב is: Countless are the commandments which they practise in connection with dust: (Deuteronomy 22:10) “Thou shalt not plough with an ox and an ass [together]”; (Leviticus 19:19): “Thou shalt not sow thy field with two kinds of seeds”. There are also the ashes of the red cow (Numbers 19:9 ff.), and the dust used in the ordeal to which a woman suspected of infidelity is subjected (Numbers 5:17), and others similar to these (Midrash Tanchuma, Balak 12).<br><br>ומספר את רבע ישראל The word רבע implies their matings — the offspring which issues from their relations  (cf. Nedarim 31a; and Rashi on Numbers 24:3).<br><br>תמת נפשי מות ישרים LET ME DIE THE DEATH OF THE UPRIGHT amongst them."}, {"ch": 23, "v": 11, "aliyah": 6, "heb": "וַיֹּ֤אמֶר בָּלָק֙ אֶל־בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑י לָקֹ֤ב אֹיְבַי֙ לְקַחְתִּ֔יךָ וְהִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ׃", "onk": "וַאֲמַר בָּלָק לְבִלְעָם מֶה עֲבַדְתְּ לִי לְמֵילַט סַנְאַי דְּבַרְתִּיךְ וְהָא בָרָכָא מְבָרְכַת לְהוֹן:", "onk_en": "Balak said to Bil’am: “What have you done to me? I took you to curse my enemies but you have in fact blessed them!”", "pj": "וַאֲמַר בָּלָק לְבִלְעָם מָה עָבַדְתְּ לִי לְמֵילוֹט סַנְאַי דְבַרְתִּיךְ וְהָא בָרְכָא מְבָרְכַת לְהוֹן", "pj_en": "And Balak said to Bileam, What hast thou done to me? I brought thee to curse my enemies, and, behold, blessing, thou hast blessed them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 12, "aliyah": 6, "heb": "וַיַּ֖עַן וַיֹּאמַ֑ר הֲלֹ֗א אֵת֩ אֲשֶׁ֨ר יָשִׂ֤ים יְהֹוָה֙ בְּפִ֔י אֹת֥וֹ אֶשְׁמֹ֖ר לְדַבֵּֽר׃", "onk": "וַאֲתֵב וַאֲמַר הֲלָא יָת דִּישַׁוִּי יְיָ בְּפוּמִי יָתֵיהּ אֶטַּר לְמַלָּלָא:", "onk_en": "Bil’am replied and said: “Only what Adonoy tells me must I be careful to say.”", "pj": "וְאָתֵיב וַאֲמַר הֲלָא יַת מִן דִי שַׁוֵי יְיָ בְּפוּמִי יָתֵיהּ אַנְטַר לְמַלָלָא", "pj_en": "But he answered and said, That which the Lord hath put in my mouth shall I not be careful to speak?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 13, "aliyah": 6, "heb": "וַיֹּ֨אמֶר אֵלָ֜יו בָּלָ֗ק <span class=\"mam-kq\"><span class=\"mam-kq-k\">(לך)<\/span> <span class=\"mam-kq-q\">[לְכָה־]<\/span><\/span>נָּ֨א אִתִּ֜י אֶל־מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣נּוּ מִשָּׁ֔ם אֶ֚פֶס קָצֵ֣הוּ תִרְאֶ֔ה וְכֻלּ֖וֹ לֹ֣א תִרְאֶ֑ה וְקׇבְנוֹ־לִ֖י מִשָּֽׁם׃", "onk": "וַאֲמַר לֵיהּ בָּלָק אִיתָא כְעַן עִמִּי לַאֲתַר אוֹחֳרַן דְּתֵחֲזִנֵּיהּ מִתַּמָּן לְחוֹד קְצָתֵיהּ תֶּחֱזֵי וְכוּלֵּיהּ לָא תֶחֱזֵי וּתְלוּטֵיהּ לִי מִתַּמָּן:", "onk_en": "Balak then said to him, “Come with me to another place from where you will see them. But you will see only a part of them, without seeing them all, and curse them for me from there.”", "pj": "וַאֲמַר לֵיהּ בָּלָק אִיתָא כְדוֹן עִמִי לַאֲתַר חוֹרַן דְתַחֲמִינֵיהּ מִתַּמָן לְחוֹד מַשִׁרְיָתָא דִמְהַלֵךְ בְּקַצְתֵּיהּ תֶחֱמֵי וְכֻלְהוֹן מַשִׁרְיָיתוֹי לֵית אֶפְשַׁר דְתֶחֱמֵי וּתְלוֹטֵיהּ לִי מִתַּמָן", "pj_en": "And Balak said to him, Come now with me where thou mayest see him from another place. Thou shalt see only the camp that goeth in his rear, but not all their camps; and curse him for me there.", "tj": "", "tj_en": "", "rashi": "<b>וקבנו לי.<\/b> לְשׁוֹן צִוּוּי, קַלְּלֵהוּ לִי:", "rashi_en": "וקבנו לי — The verb is the imperative: CURSE THEM FOR ME (cf. Rashi on v. 27)."}, {"ch": 23, "v": 14, "aliyah": 6, "heb": "וַיִּקָּחֵ֙הוּ֙ שְׂדֵ֣ה צֹפִ֔ים אֶל־רֹ֖אשׁ הַפִּסְגָּ֑ה וַיִּ֙בֶן֙ שִׁבְעָ֣ה מִזְבְּחֹ֔ת וַיַּ֛עַל פָּ֥ר וָאַ֖יִל בַּמִּזְבֵּֽחַ׃", "onk": "וְדַבְּרֵיהּ לַחֲקַל סְכוּתָא לְרֵישׁ רָמָתָא וּבְנָא שַׁבְעָא מַדְבְּחִין וְאַסֵּק תּוֹר וּדְכַר עַל כָּל מַדְבְּחָא:", "onk_en": "He took him [Bil’am] to the field of Tzofim, to the peak of the mountain; he built seven altars and sacrificed as a burnt-offering a bull and a ram on each altar.", "pj": "וְדַבְּרֵיהּ לַחֲקַל סָכוּתָא לְרֵישׁ רָמָתָא וּבְנָא שׁוּבְעָא אֲגוֹרִין וְאַסֵיק תּוֹר וּדְכַר עַל כָּל אֲגוֹרָא", "pj_en": "And he brought him to the field of the observatory on the top of the hill, and builded seven altars, and offered a bullock and a ram on every altar.", "tj": "", "tj_en": "", "rashi": "<b>שדה צפים.<\/b> מָקוֹם גָּבוֹהַּ הָיָה שֶׁשָּׁם הַצּוֹפֶה עוֹמֵד לִשְׁמֹר אִם יָבֹא חַיִל עַל הָעִיר:<br><br><b>ראש הפסגה.<\/b> בִּלְעָם לֹא הָיָה קוֹסֵם כְּבָלָק, רָאָה בָלָק שֶׁעֲתִידָה פִרְצָה לְהִפָּרֵץ בְּיִשָׂרָאֵל מִשָּׁם, שֶׁשָּׁם מֵת מֹשֶׁה, כְּסָבוּר שֶׁשָּׁם תָּחוּל עֲלֵיהֶם הַקְּלָלָה וְזוֹ הִיא הַפִּרְצָה שֶׁאֲנִי רוֹאֶה (תנחומא):", "rashi_en": "שדה צפים FIELD OF ZOPHIM — There was a high spot upon which the watchman (צופה) used to stand to observe whether any hostile force was coming against the city.<br><br>ראש הפסגה THE TOP OF PISGAH — Balaam was not as expert a diviner as Balak. Balak forsaw that at some time a breach in Israel would originate from there — and as a matter of fact Moses died there, — and therefore he believed that there the curse would certainly fall upon them. “And this (the effects of the curse)” — he thought — “must be the breach which I behold” (Midrash Tanchuma, Balak 13)."}, {"ch": 23, "v": 15, "aliyah": 6, "heb": "וַיֹּ֙אמֶר֙ אֶל־בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל־עֹלָתֶ֑ךָ וְאָנֹכִ֖י אִקָּ֥רֶה כֹּֽה׃", "onk": "וַאֲמַר לְבָלָק אִתְעַתַּד הָכָא עַל עֲלָתָךְ וַאֲנָא אִתְמְטֵי <b>עַד כָּא<\/b>:", "onk_en": "He then said to Balak: “Stand here next to your burnt-offering, and I will be called here by chance [<b>will continue there<\/b>].”", "pj": "וַאֲמַר לְבָלָק אִתְעַתַּד הָכָא עַל עֲלָתָךְ וַאֲנָא אֶתְעָרַא עַד הָכָא", "pj_en": "And he said to Balak, Stand thou here by thy burnt offering and I will meet (Him) yonder.", "tj": "וַאֲנָא בְּמֵימְרִי אִיקַר יָתָךְ:", "tj_en": "And I with My Word will honour thee.", "rashi": "<b>אקרה כה.<\/b> מֵאֵת הַקָּבָּ\"ה, <b>אקרה<\/b> — לְשׁוֹן אִתְפַּעֵל:", "rashi_en": "אקרה כה — This means, I WILL BE MET YONDER by the Holy One, blessed be He, for אקרה has a passive sense."}, {"ch": 23, "v": 16, "aliyah": 6, "heb": "וַיִּקָּ֤ר יְהֹוָה֙ אֶל־בִּלְעָ֔ם וַיָּ֥שֶׂם דָּבָ֖ר בְּפִ֑יו וַיֹּ֛אמֶר שׁ֥וּב אֶל־בָּלָ֖ק וְכֹ֥ה תְדַבֵּֽר׃", "onk": "וַעֲרַע <b>מֵימַר מִן קֳדָם<\/b> יְיָ לְבִלְעָם וְשַׁוִּי פִתְגָּמָא בְּפוּמֵיהּ וַאֲמַר תּוּב לְוָת בָּלָק וּכְדֵין תְּמַלֵּל:", "onk_en": "[<b>A word from before<\/b>] Adonoy chanced to appear to Bil’am and placed the word in his mouth; He said: “Return to Balak and say as follows.”", "pj": "וְאַרַע מֵימְרָא מִן קֳדָם יְיָ בְּבִלְעָם וְשַׁוֵי פִתְגָמָא בְּפוּמֵיהּ וַאֲמַר תּוּב לְוַת בָּלָק וְהֵיכְדֵין תְּמַלֵיל", "pj_en": "And the Word from before the Lord met Bileam, and put a word in his mouth, and said, Return to Balak, and thus speak.", "tj": "", "tj_en": "", "rashi": "<b>וישם דבר בפיו.<\/b> וּמַה הִיא הַשִּׂימָה הַזֹּאת? וּמֶה חָסֵר הַמִּקְרָא בְּאָמְרוֹ \"שׁוּב אֶל בָּלָק וְכֹה תְדַבֵּר\"? אֶלָּא כְּשֶׁהָיָה שׁוֹמֵעַ שֶׁאֵינוֹ נִרְשֶׁה לְקַלֵּל אָמַר מָה אֲנִי חוֹזֵר אֵצֶל בָּלָק לְצַעֲרוֹ? וְנָתַן לוֹ הַקָּבָּ\"ה רֶסֶן וְחַכָּה בְּפִיו, כְּאָדָם הַפּוֹקֵס בְּהֵמָה בְּחַכָּה לְהוֹלִיכָהּ אֶל אֲשֶׁר יִרְצֶה, אָמַר לוֹ עַל כָּרְחֲךָ תָּשׁוּב אֶל בָּלָק (שם):", "rashi_en": "וישם דבר בפיו AND HE PUT A WORD IN HIS MOUTH —And what was this “putting”? What would Scripture have lacked if it had stated “[And the Lord met Balaam and said,] Return to Balak, and thus shalt thou speak”? But the explanation is: When he heard that he was not permitted to curse, he said, “Why should I return to Balak to cause him annoyance?” Therefore the Holy One, blessed be He, put a halter and hook in his mouth as a person who pricks an animal with a hook to make it go wherever he wants. He said to him, “Despite yourself shall you return to Balak’ (cf. Sanhedrin 105b; Midrash Tanchuma, Balak 13)."}, {"ch": 23, "v": 17, "aliyah": 6, "heb": "וַיָּבֹ֣א אֵלָ֗יו וְהִנּ֤וֹ נִצָּב֙ עַל־עֹ֣לָת֔וֹ וְשָׂרֵ֥י מוֹאָ֖ב אִתּ֑וֹ וַיֹּ֤אמֶר לוֹ֙ בָּלָ֔ק מַה־דִּבֶּ֖ר יְהֹוָֽה׃", "onk": "וַאֲתָא לְוָתֵיהּ וְהוּא מְעַתַּד עַל עֲלָתֵיהּ וְרַבְרְבֵי מוֹאָב עִמֵּיהּ וַאֲמַר לֵיהּ בָּלָק מָא מַלִּיל יְיָ:", "onk_en": "When he returned, he (Balak) was still standing next to his burnt-offering accompanied by the Moavite dignitaries; Balak asked: “What did Adonoy say?”", "pj": "וְאָתָא לְוָתֵיהּ וְהָא מְעַתֵּיד עַל עֲלָתֵיהּ וְרַבְרְבֵי מוֹאָב עִמֵיהּ וַאֲמַר לֵיהּ בָּלָק מַה מַלֵיל יְיָ", "pj_en": "And he came to him, and, behold, he was standing by his burnt offering, and the princes of Moab with him. And Balak said to him, What hath the Lord spoken?", "tj": "", "tj_en": "", "rashi": "<b>ושרי מואב אתו.<\/b> וּלְמַעְלָה הוּא אוֹמֵר \"וְכָל שָׂרֵי מוֹאָב\", כֵּיוָן שֶׁרָאוּ שֶׁאֵין בּוֹ תִקְוָה הָלְכוּ לָהֶם מִקְצָתָם וְלֹא נִשְׁאֲרוּ אֶלָּא מִקְצָתָם:<br><br><b>מה דבר ה'.<\/b> לְשׁוֹן צְחוֹק הוּא זֶה, כְּלוֹמַר אֵינְךָ בִרְשׁוּתְךָ (שם):", "rashi_en": "ושרי מואב עמו AND THE PRINCES OF MOAB WITH HIM — But above (v. 6) it states, “And all the princes of Moab”?! As soon as they saw that there was no hope for them in him, part of them went away, and only part of them remained (Midrash Tanchuma, Balak 13).<br><br>מה דבר ה׳ WHAT HATH THE LORD SPOKEN? — This was a derisive expression, as much as to say, “You are not your own master” (Midrash Tanchuma, Balak 13)."}, {"ch": 23, "v": 18, "aliyah": 6, "heb": "וַיִּשָּׂ֥א מְשָׁל֖וֹ וַיֹּאמַ֑ר ק֤וּם בָּלָק֙ וּֽשְׁמָ֔ע הַאֲזִ֥ינָה עָדַ֖י בְּנ֥וֹ צִפֹּֽר׃", "onk": "וּנְטַל מַתְלֵיהּ וַאֲמַר קוּם בָּלָק וּשְׁמַע אָצֵית <b>לְמֵימְרִי<\/b> בַּר צִפֹּר:", "onk_en": "Bil’am set forth his parable, and said: “Arise, Balak, and hear, listen closely to me [<b>my word<\/b>], son of Tzipor.", "pj": "וּנְטַל מְתַל נְבוּתֵיהּ וַאֲמַר קוּם בָּלָק וּשְׁמַע אָצִית מִילַי בְּרֵיהּ דְצִפּוֹר", "pj_en": "And he took up the parable of his prophecy, and said: Arise, Balak, and hear; listen to my words, Bar Zippor.", "tj": "", "tj_en": "", "rashi": "<b>קום בלק.<\/b> כֵּיוָן שֶׁרָאָהוּ מְצַחֵק בּוֹ, נִתְכַּוֵּן לְצַעֲרוֹ — \"עֲמֹד עַל רַגְלֶיךָ, אֵינְךָ רַשַּׁאי לֵישֵׁב, וַאֲנִי שָׁלוּחַ אֵלֶיךָ בִשְׁלִיחוּתוֹ שֶׁל מָקוֹם\" (שם):<br><br><b>בנו צפר.<\/b> לְשׁוֹן מִקְרָא הוּא זֶה, כְּמוֹ \"חַיְתוֹ יָעַר\" (תהלים נ') \"וְחַיְתוֹ אֶרֶץ\" (בראשית א'), \"לְמַעְיְנוֹ מָיִם\" (תהילים קי\"ד):", "rashi_en": "קום בלק RISE UP, BALAK — When he perceived that he was mocking at him, he set himself to annoy him, saying, “Stand on your feet; you have no right to remain seated, seeing that I am sent to you on a mission by the Omnipresent” (Midrash Tanchuma, Balak 13).<br><br>בנו צפור SON OF ZIPPOR — This (the suffix ו to mark the construct) is often found as a Biblical Hebrew form, as in (Psalms 50:10), “beast of (חיתו) the forest”; (Genesis 1:24) “beast of (חיתו) the earth”; (Psalms 114:8), “to a spring of (מעינו) water”."}, {"ch": 23, "v": 19, "aliyah": 6, "heb": "לֹ֣א אִ֥ישׁ אֵל֙ וִֽיכַזֵּ֔ב וּבֶן־אָדָ֖ם וְיִתְנֶחָ֑ם הַה֤וּא אָמַר֙ וְלֹ֣א יַעֲשֶׂ֔ה וְדִבֶּ֖ר וְלֹ֥א יְקִימֶֽנָּה׃", "onk": "<b>לָא כְמִלֵּי בְנֵי אֱנָשָׁא מֵימַר אֱלָהָא בְּנֵי אֱנָשָׁא אָמְרִין וּמְכַדְּבִין וְאַף לָא כְּעוֹבָדֵי בְנֵי בִשְׂרָא דִּי אִנּוּן גָּזְרִין לְמֶעְבַּד וְתַיְּבִין וּמִתְמַלְּכִין דְּהוּא אָמַר וְעָבֵד וְכָל מֵימְרֵיהּ מִתְקַיָּם<\/b>:", "onk_en": "God is not like man that He should act falsely, nor is He mortal that He should change His mind. [<b>God’s word is not as that of man who speaks with deceit. Nor is it as that of mankind who decree and then change their mind<\/b>] Would He say and not do it? Or speak and not fulfill it [<b>He says and does, and His word endures<\/b>]?", "pj": "לָא כְמִילֵי בַּר נַשׁ מֵימַר אֱלָהָא חַי וְקַיָם רִבּוֹן כָּל עָלְמַיָא יְיָ דְבַר נַשׁ אָמַר וּמְסָרֵב וְאוּף לָא דַמְיַין עוֹבָדוֹי לְעוֹבָדֵי בְּנֵי בִישְרָא דְמִתְמַלְכִין וְתַיְיבִין מִמַה דְגָזְרִין בְּרַם רִבּוֹן כָּל עָלְמַיָא יְיָ אָמַר לְאַסְגָאָה יַת עַמָא הָדֵין הֵי כְּכוֹכְבֵי שְׁמַיָא וּלְאַחֲסָנוֹתְהוֹן יַת אֲרַע כְּנַעֲנָאֵי הַאֶפְשַׁר דְאָמַר וְלָא יֶעֱבַד וּמַה דְמַלֵיל הַאֶפְשַׁר דְלָא יְקַיְימִינֵיהּ", "pj_en": "The Word of the living God is not as the words of men for the Lord, the Ruler of all worlds, is the unchangeable (but) man speaketh and denieth. Neither are His works like the works of the children of flesh, who consult, and then repent them of what they had decreed. But when the Lord of all worlds hath said, I will multiply this people as the stars of the heavens, and will give them to possess the land of the Kenaanites, is He not able to perform what He hath spoken? and what He hath said, can He not confirm it?", "tj": "לָא כְמֵימַר בְּנֵי אֱנָשָׁא הֲוַת מֵימְרֵיהּ דֶאֱלָהָא חַיָיא וְלָא כְעוֹבָדֵיהוֹן דִבְנֵי אֱנָשָׁא עוֹבָדוֹי דֶאֱלָהָא בְּנֵי אֱנָשָׁא אָמְרִין וְלָא עָבְדִין גָזְרִין וְלָא מְקַיְימִין וְחָזְרִין וְכָפְרִין בְּמִילֵיהוֹן בְּרַם אֱלָהָא אֲמַר וַעֲבַד גְזַר וּמְקַיֵים וּגְזֵרָתוֹהִי קַיְימִין עַד לַעֲלָם:", "tj_en": "Not as the word of the sons of men is the word of the living God, nor are the works of God as the works of men. Men say, and do not; they decree, but do not confirm; but God saith and performeth, He maketh decree and confirmeth it, and His decrees are established forever.", "rashi": "<b>לא איש וגו'.<\/b> כְּבָר נִשְׁבַּע לָהֶם לַהֲבִיאָם וּלְהוֹרִישָׁם אֶרֶץ שִׁבְעָה אֻמּוֹת וְאַתָּה סָבוּר לַהֲמִיתָם בַּמִּדְבָּר?:<br><br><b>ההוא אמר וגו'.<\/b> בִּלְשׁוֹן תֵּמַהּ, וְתַרְגּוּמוֹ וְתָיְבִין וּמִתְמַלְּכִין — חוֹזְרִים וְנִמְלָכִין לַחֲזֹר בָּהֶם:", "rashi_en": "לא איש וגו׳ [GOD IS] NOT A MAN [THAT HE SHOULD LIE] — He has already sworn to them that He will bring them thither and give them as a possession the land of the seven peoples, and you think to slay them in the wilderness?! (cf. Midrash Tanchuma, Vayera 13)<br><br>ההוא אמר וגו׳ — Read this in the form of a question: HATH HE SAID, [AND SHALL HE NOT DO IT]? — The rendering of ויתנחם in the Targum, ותיבין ומחמלכין, means, “[and not as the doings of mortals who decide to do things] and again reconsider” — to withdraw from them."}, {"ch": 23, "v": 20, "aliyah": 6, "heb": "הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּבֵרֵ֖ךְ וְלֹ֥א אֲשִׁיבֶֽנָּה׃", "onk": "הָא בִרְכָן קַבֵּלִית וַאֲבָרֵכִנֵּיהּ לְיִשְׂרָאֵל וְלָא <b>אָתֵב בִּרְכְּתִי מִנֵּיהּ<\/b>:", "onk_en": "Behold, I was commanded to bless, and [when] He has blessed, I cannot reverse it [<b>turn my blessing from him<\/b>].", "pj": "הָא בִּרְכָתָא קַבֵּלִית מִן פּוּם מֵימַר קוּדְשָׁא לָא אֶמְנַע סֵדֶר בִּרְכַתְהוֹן מִנְהוֹן", "pj_en": "Behold, from the mouth of the Holy Word I have received the benediction, and their appointed benediction I cannot restrain from them.", "tj": "הָא לִמְבָרְכָא אַדְבָּרִית וּמְבָרֵךְ אֲנָא יַת יִשְ¦רָאֵל וּבִרְכַן לֵית אֲנָא מְנַע מִנְהוֹן:", "tj_en": "Behold, I have received to bless Israel, and I cannot restrain the blessings from them.", "rashi": "<b>הנה ברך לקחתי.<\/b> אַתָּה שׁוֹאֲלֵנִי \"מַה דִּבֶּר ה'?\", קִבַּלְתִּי מִמֶּנּוּ לְבָרֵךְ אוֹתָם:<br><br><b>וברך ולא אשיבנה.<\/b> הוּא בֵּרֵךְ אוֹתָם וַאֲנִי לֹא אָשִׁיב אֶת בִּרְכָתוֹ:<br><br><b>וברך.<\/b> כְּמוֹ וּבִרֵּךְ, וְכֵן הִיא גִזְרַת רֵי\"ש, כְּמוֹ (תהלים ע\"ד) \"אוֹיֵב חֵרֵף\" כְּמוֹ חִרֵּף, וְכֵן (שם מ') \"וּבֹצֵעַ בֵּרֵךְ\" — הַמְהַלֵּל וּמְבָרֵךְ אֶת הַגּוֹזֵל וְאוֹמֵר אַל תִּירָא כִּי לֹא תֵעָנֵשׁ, שָׁלוֹם יִהְיֶה לְךָ, מַרְגִּיז הוּא לְהַקָּבָּ\"ה; וְאֵין לוֹמַר <b>ברך<\/b> שֵׁם דָּבָר, שֶׁאִם כֵּן הָיָה נָקוּד בְּפַתָּ\"ח קָטָן וְטַעְמוֹ לְמַעְלָה, אֲבָל לְפִי שֶׁהוּא לְשׁוֹן פִּעֵל, הוּא נָקוּד קָמָץ קָטָן וְטַעְמוֹ לְמַטָּה:", "rashi_en": "הנה ברך לקחתי BEHOLD, I HAVE RECEIVED COMMANDMENT TO BLESS — You ask me derisively, (v. 17) “What hath the Lord spoken”? I will tell you: I have received an order from Him to bless them.<br><br>וברך ולא אשיבנה AND HE HAS BLESSED AND I CANNOT REVERSE IT — “He” has blessed them, and “I” cannot reverse this blessing. <br><br>וברך — This is equivalent to וּבִרֵּךְ. This is the rule of the letter ר, as in (Psalms 74:18): “the enemy blasphemeth”, חֵרֵף like חִרֵּף; and similarly (Psalms 10:3): [ובצע בֵּרֵךְ [נאץ ה׳ (where בֵּרֵךְ is for בִּרֵּךְ), which means, He who praises and blesses the robber (בצע) and says, ‘Do not be afraid, for you will not be punished; peace will be unto you’, he angers (נאץ) God thereby (but see Rashi on this verse where another translation is given). — One cannot say that ברך is a noun, for if it were, it would be voweled in both syllables with Short Patach (our Segol), and its accent would be on the first syllable (בֶּרָךְ) because it is a verb in the Piel conjugation, it is voweled with Short Kametz (our Tzéré) on both syllables, and its accent is on the last syllable."}, {"ch": 23, "v": 21, "aliyah": 6, "heb": "לֹֽא־הִבִּ֥יט אָ֙וֶן֙ בְּיַעֲקֹ֔ב וְלֹא־רָאָ֥ה עָמָ֖ל בְּיִשְׂרָאֵ֑ל יְהֹוָ֤ה אֱלֹהָיו֙ עִמּ֔וֹ וּתְרוּעַ֥ת מֶ֖לֶךְ בּֽוֹ׃", "onk": "<b>אִסְתַּכָּלִית לֵית פָּלְחֵי גִּלּוּלִין בִּדְבֵית<\/b> יַעֲקֹב <b>וְאַף לָא עָבְדֵי לֵאוּת שְׁקַר בְּיִשְׂרָאֵל מֵימְרָא דַיְיָ אֱלָהָהוֹן בְּסַעְדְּהוֹן וּשְׁכִינַת מַלְכְּהוֹן בֵּינֵיהוֹן<\/b>:", "onk_en": "[<b>Behold,<\/b>] One does not see evildoers [<b>there are no idol worshippers<\/b>] in [<b>the house of<\/b>] Yaakov; and He has seen no transgression [<b>nor is there the work of liars<\/b>] in Yisroel; [<b>the word of<\/b>] Adonoy, his God, is with [<b>aids them<\/b>] him, and he has the King's friendship [<b>and the Shechinah of their King is among them<\/b>].", "pj": "אָמַר בִּלְעָם רַשִׁיעָא לֵית אֲנָא מִסְתַּכֵּל פַּלְחֵי טַעֲוָותָא בִּדְבֵית יַעֲקב וְלָא מִתְקַיְימִין עַבְדֵי לֵיעוּת שְׁקַר בִּדְבֵית יִשְרָאֵל מֵימְרָא דַיְיָ אֱלָהָהוֹן בְּסַעַדְהוֹן וְיַבְּבוּת מַלְכָּא מְשִׁיחָא מְיַיבָּבָא בֵּינֵיהוֹן", "pj_en": "Bileam the wicked said, I see not among them of the house of Jakob such as worship idols: they who serve false idols are not established among the tribes of the sons of Israel. The Word of the Lord their God is their help, and the trumpets of the King Meshiha resound among them:", "tj": "לֵית אֲנָא חָמֵי פַּלְחֵי שְׁקַר וְלָא פַּלְחֵי פּוּלְחַן נוּכְרֵי בְּגוֹ שִׁבְטַיָא דִבְנֵי יִשְרָאֵל מֵימְרָא דַיְיָ הֲוֵי עִמְהוֹן וְיַבָּבוּת מִן אִיקַר מַלְכֵּיהוֹן מֵגִין עֲלֵיהוֹן:", "tj_en": "I have not seen the worshippers of a lie, nor those who offer strange service, among the tribes of the sons of Israel. The Word of the Lord is with them, and the trumpet of their glorious King protecteth them.", "rashi": "<b>לא הביט און ביעקב וגו'.<\/b> כְּתַרְגּוּמוֹ; דָּבָר אַחֵר אַחֲרֵי פְשׁוּטוֹ הוּא נִדְרָשׁ מִדְרָשׁ נָאֶה —<br><br><b>לא הביט.<\/b> הַקָּבָּ\"ה <b>און<\/b> שֶׁבְּיַעֲקֹב — כְּשֶׁהֵן עוֹבְרִין עַל דְּבָרָיו אֵינוֹ מְדַקְדֵּק אַחֲרֵיהֶם לְהִתְבּוֹנֵן בְּאוֹנִיּוֹת שֶׁלָּהֶם וַעֲמָלָן שֶׁהֵן עוֹבְרִין עַל דָּתוֹ:<br><br><b>עמל.<\/b> לְשׁוֹן עֲבֵרָה, כְּמוֹ \"וְהָרָה עָמָל\" (תהלים ז'), \"כִּי אַתָּה עָמָל וָכַעַס תַּבִּיט\" (שם י'), לְפִי שֶׁהָעֲבֵרָה הִיא עָמָל לִפְנֵי הַמָּקוֹם:<br><br><b>ה' אלהיו עמו.<\/b> אֲפִלּוּ מַכְעִיסִין וּמַמְרִים לְפָנָיו, אֵינוֹ זָז מִתּוֹכָן:<br><br><b>ותרועת מלך בו.<\/b> לְשׁוֹן חִבָּה וְרֵעוּת, כְּמוֹ (שמואל ב ט\"ו) \"רֵעֶה דָּוִד\" — אוֹהֵב דָּוִד, (שופטים ט\"ו) \"וַיִּתְּנָהּ לְמֵרֵעֵהוּ\", וְכֵן תִּרְגֵּם אֻנְקְלוֹס \"וּשְׁכִינַת מַלְכְּהוֹן בֵּינֵהוֹן\":", "rashi_en": "לא הביט און ביעקב וגו׳ HE HATH NOT BEHELD INIQUITY IN JACOB, etc. — Understand this as the Targum has it (“I have seen that there are no worshippers of idols in the house of Jacob”). Another explanation: According to its plain sense it can receive a beautiful exposition:<br><br>לא הביט HE DOTH NOT SEE — i. e., the Holy One, blessed be He, doth not see און THE INIQUITY which is IN JACOB: when they transgress His Words He does not deal so strictly with them as to pay regard to their iniquitous doings and their transgression by which they infringe His law (cf. Midrash Tanchuma, Balak 14).<br><br>עמל denotes transgression, as in (Psalms 7:15): “He conceiveth transgression (עמל)\"; (Psalms 10:14) “For thou beholdest transgression (עמל) and vexation” — and it denotes this because transgression is a vexation (עמל) before the Omnipresent.<br><br>ה' אלקיו עמו THE LORD HIS GOD IS WITH HIM — Even when they provoke Him to anger and act rebelliously before Him He does not depart from their midst,<br><br>ותרועת מלך בו BUT THE תרועה OF A KING IS STILL WITH THEM — תרועה is an expression for love and fellowship, as (II Samuel 15:37) “the רעה of David’ — the friend of David; (Judges 15:6) “And he gave her to his friend (מרעהו).\" (The translation is therefore: and the fellowship of their king is still with them). In this sense, too, does Onkelos translate it: and the Shechina of their King is among them."}, {"ch": 23, "v": 22, "aliyah": 6, "heb": "אֵ֖ל מוֹצִיאָ֣ם מִמִּצְרָ֑יִם כְּתוֹעֲפֹ֥ת רְאֵ֖ם לֽוֹ׃", "onk": "אֱלָהָא דְּאַפֵּקִנּוּן מִמּצְרָיִם <b>תּוּקְפָּא וְרוּמָא דִּילֵיהּ<\/b>:", "onk_en": "God Who has brought them out of Egypt, has shown His great strength to them [<b>with His might and loftiness<\/b>].", "pj": "אֱלָהָא דִי פְרַק וְאַפֵּיק יַתְהוֹן פְּרִיקִין מִן אַרְעָא דְמִצְרַיִם תּוּקְפָא וְרוֹמְמוּתָא תּוּשְׁבְּחָא וּגְבוּרְתָּא דִידֵיהּ הוּא", "pj_en": "Unto Eloha, who redeemed and led them out of Mizraim free, belong power and exaltation, glorification and greatness.", "tj": "אֱלָהָא דִי פְרַק וְאַפֵּיק יַתְהוֹן פְּרִיקִין מִמִצְרַיִם תּוּקְפָא וְתוּשְׁבַּחְתָּא וְרוֹמְמוּתָא דִידֵיהּ הִיא:", "tj_en": "Unto God who redeemed, and brought them out from Mizraim free, belong power, and praise, and exaltation.", "rashi": "<b>אל מוציאם ממצרים.<\/b> אַתָּה אָמַרְתָּ \"הִנֵּה עַם יָצָא מִמִּצְרַיִם\", לֹא יָצָא מֵעַצְמוֹ, אֶלָּא הָאֱלֹהִים הוֹצִיאָם:<br><br><b>כתועפת ראם לו.<\/b> כְּתֹקֶף רוּם וְגֹבַהּ שֶׁלּוֹ, וְכֵן \"וְכֶסֶף תּוֹעָפוֹת\" (איוב כ\"ב) לְשׁוֹן מָעוֹז הֵמָּה, וְאוֹמֵר אֲנִי שֶׁהוּא לְשׁוֹן \"וְעוֹף יְעוֹפֵף\" (בראשית א') — הַמְעוֹפֵף בְּרוּם וְגֹבַהּ, תֹקֶף רַב הוּא זֶה, וְתוֹעֲפֹת רְאֵם — עֲפִיפַת גֹּבַהּ; דָּ\"אַ, תּוֹעֲפוֹת רְאֵם — תֹּקֶף רְאֵמִים, וְאָמְרוּ רַבּוֹתֵינוּ אֵלּוּ הַשֵּׁדִים (עי' גיטין ס\"ח):", "rashi_en": "אל מוציאם ממצרים GOD BROUGHT THEM OUT FROM EGYPT — You said, (Numbers 22:5) “Behold, there is a people come out from Egypt” — it did not come out of its own account, but God brought it out (Midrash Tanchuma, Balak 14).<br><br>כתועפת ראם לו means [GOD BROUGHT THEM OUT OF EGYPT] IN ACCORDANCE WITH THE STRENGTH BEFITTING HIS SUBLIMITY (רום) and loftiness. Similar is (Job 22:25) “and silver of strength (‎תועפות‎)\"‏ — they (the word תועפות here and in the verse quoted) are both expressions signifying strength. — And I say that really it has the same meaning as the verb in (Genesis 1:20) ועוף יעופף which signifies: a bird that raises itself into the heights and lofty spheres — and this is evidence of great strength. Accordingly ותועפות ראם really signifies “a flight in the heights”. — Another explanation of תועפות ראם is: “the strength of Reemim” and our Rabbis said that this refers to “the demons’” (their strength is subject to Him) (cf. Gittin 68b)."}, {"ch": 23, "v": 23, "aliyah": 6, "heb": "כִּ֤י לֹא־נַ֙חַשׁ֙ בְּיַעֲקֹ֔ב וְלֹא־קֶ֖סֶם בְּיִשְׂרָאֵ֑ל כָּעֵ֗ת יֵאָמֵ֤ר לְיַעֲקֹב֙ וּלְיִשְׂרָאֵ֔ל מַה־פָּ֖עַל אֵֽל׃", "onk": "אֲרֵי <b>לָא נַחֲשַׁיָּא צָבָן דְּיִיטַב לִדְבֵית<\/b> יַעֲקֹב וְאַף <b>לָא קְסָמַיָּא רְעַן בִּרְבוּת בֵּית<\/b> יִשְׂרָאֵל כְּעִדַּן יִתְאַמַּר לְיַעֲקֹב וּלְיִשְׂרָאֵל מֶה עֲבַד אֱלָהָא:", "onk_en": "For, there is no sorcery in [<b>sorcerers wish no good to come to the house of<\/b>] Yaakov, nor occult powers against [<b>nor greatness for the house of<\/b>] Yisroel; in due time it will be said to Yaakov and Yisroel, 'What has God done?'", "pj": "אֲרוּם לָא קָאִים נַטוּרֵי נַחְשִׁין בִּדְבֵית יַעֲקב וְלָא קִסוּמֵי קִיסְמִין בִּרְבוּתָא דְיִשְרָאֵל בְּעִידָנָא הָדֵין יִתְאַמַר לְבֵית יַעֲקב וּלְבֵית יִשְרָאֵל מַה מְשַׁבְּחִין הִינוּן נִיסַיָא וּפְרִישָׁתָא דְעָבַד לְהוֹן אֱלָהָא", "pj_en": "They of the house of Jakob who use divination are not establisbed, nor the enchanters, who enchant among the greatness (multitudes) of Israel. At this time it is said to the house of Jakob and Israel, How glorious are the miracles and wonder-works which God hath wrought!", "tj": "אֲרוּם לֵית אֲנָא חָמֵי עָבְדֵי נַחְשָׁא בְּגוֹ דְבֵית יַעֲקב וְאַף לָא קוּסְמֵי קָסְמִין בְּגוֹ שִׁבְטַיָא דִבְנֵי יִשְרָאֵל בְּעִידָנָא הָדֵין יִתְאַמַר לְיַעֲקב מַה טִבוּ וְנַחֲמָן דַיְיָ עָתִיד לְמִתַּנְיָא עֲלֵיכוֹן דְבֵית יַעֲקב כְּדוֹ אָמַר בִּמְתַל נְבִיוּתֵיהּ טוּבֵיכוֹן צַדִיקַיָא מָה אֲגַר טַב מְתַקֵן לְכוֹן גַבֵּי אֲבוּכוֹן דְבִשְׁמַיָא לְעַלְמָא דְאָתֵי:", "tj_en": "For I see not those who perform divination in the house of Jakob, nor them who enchant with enebantments among the tribes of Israel. At this time it is said to Jakob, What bounties and comforts are prepared of the Lord to bestow upon you of the house of Jakob! Then said he in the parable of his prophecy, O happy saints, how goodly is the reward prepared for you by your Father in heaven, in the world to come!", "rashi": "<b>כי לא נחש ביעקב.<\/b> כִּי רְאוּיִים הֵם לִבְרָכָה, שֶׁאֵין בָּהֶם מְנַחֲשִׁים וְקוֹסְמִים:<br><br><b>כעת יאמר ליעקב וגו'.<\/b> עוֹד עָתִיד לִהְיוֹת עֵת כָּעֵת הַזֹּאת אֲשֶׁר תִּגָּלֶה חִבָּתָן לְעֵין כֹּל, שֶׁהֵן יוֹשְׁבִין לְפָנָיו וּלְמֵדִים תּוֹרָה מִפִּיו וּמְחִצָּתָן לִפְנִים מִמַּלְאֲכֵי הַשָּׁרֵת וְהֵם יִשְׁאֲלוּ לָהֶם <b>מה פעל אל<\/b>? וְזֶהוּ שֶׁנֶּאֱמַר (ישעיהו ל') \"וְהָיוּ עֵינֶיךָ רֹאוֹת אֶת מוֹרֶיךָ\". דָּ\"אַ — <b>יאמר ליעקב<\/b> אֵינוֹ לְשׁוֹן עָתִיד אֶלָּא לְשׁוֹן הֹוֶה, אֵינָן צְרִיכִין לִמְנַחֵשׁ וְקוֹסֵם, כִּי בְכָל עֵת שֶׁצָּרִיךְ לְהֵאָמֵר לְיַעֲקֹב וּלְיִשְׂרָאֵל מַה פָּעַל הַקָּבָּ\"ה וּמַה גְּזֵרוֹתָיו בַּמָּרוֹם, אֵינָן מְנַחֲשִׁים וְקוֹסְמִים אֶלָּא נֶאֱמַר לָהֶם עַל פִּי נְבִיאֵיהֶם מַה הִיא גְזֵרַת הַמָּקוֹם, אוֹ אוּרִים וְתֻמִּים מַגִּידִים לָהֶם (תנחומא); וְאֻנְקְלוֹס לֹא תִרְגֵּם כֵּן:", "rashi_en": "כי לא נחש ביעקב FOR THERE IS NO ENCHANTMENT IN JACOB — For they are worthy of blessing since there are no enchanters or diviners amongst them.<br><br>כעת יאמר ליעקב וגו׳ IN DUE TIME IT SHALL BE SAID TO JACOB etc. — Once again will there be a time as this time (כעת) when the love which God bears them will be made manifest in the sight of all, because they sit before Him and learn the Torah at His mouth, and the place assigned to them will be inward of that of the ministering angels and these will enquire of them, מה פעל אל WHAT HATH GOD WROUGHT. This is the meaning of what is said, (Isaiah 30:20) “And thine eyes shall see thy Teacher” (Midrash Tanchuma, Balak 14). — Another explanation is that יאמר ליעקב does not express what is to happen in the future but expresses what takes place in the present: They require no enchanter nor diviner, for at every time (כעת) when it is necessary that there should be told to Jacob and to Israel what the Holy One, blessed be He, hath wrought and what are His decrees on High, they do not do enchantment nor divination, but it is told to them (יאמר ליעקב) by the mouth of their prophets what is the decree of the Omnipresent (מה פעל אל), or the Urim and Thummim declare it to them. — Onkelos, however, did not translate it thus."}, {"ch": 23, "v": 24, "aliyah": 6, "heb": "הֶן־עָם֙ כְּלָבִ֣יא יָק֔וּם וְכַאֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד־יֹ֣אכַל טֶ֔רֶף וְדַם־חֲלָלִ֖ים יִשְׁתֶּֽה׃", "onk": "הָא עַמָּא כְּלֵיתָא <b>שָׁרֵי<\/b> וּכְאַרְיָא יִתְנַטָּל לָא <b>יִשְׁרֵי בְאַרְעֵיהּ<\/b> עַד <b>דְּיִקְטוֹל קְטוֹל וְנִכְסֵי עַמְמַיָּא יֵירָת<\/b>:", "onk_en": "Behold, a people that rises [<b>dwells<\/b>] like a young lion, and lifts itself up like a lion; he does not lie down [<b>dwell in his land<\/b>] until it devours its prey [<b>slaughters the kill<\/b>] and drinks the blood of its kill [<b>inherits the wealth of nations<\/b>].”", "pj": "יְחִידָאָה הוּא עַמָא הָדֵין נְיַיח וְשָׁרֵי כְּאַרְיָא בִּגְבוּרְתָּא וּכְלֵיתָא מִתְנַטְלִין לָא דַמְכִין הִינוּן עַד דִיקַטְלוּן קְטוֹל רַב בְּבַעֲלֵי דְבָבֵיהוֹן וּבִיזַת קְטוֹלַיָא יִרְתוּן", "pj_en": "This people reposeth alone, and dwelleth strong as a lion, and reareth himself as an old lion. They sleep not till with great slaughter they have slain their adversaries, and taken the spoils of the slain.", "tj": "הָא עַמָא הָאִלֵין כְּאַרְיָא שַׁרְיָין וּכְאַרְיוּתָא מִתְגַבְּרִין הֵיךְ מַה דְלֵית אַרְיָא לָא נְיַח וְלָא שְׁדִיךְ עַד זְמַן דְהוּא אָכִיל וּפָשִׁיט בְּשַר וְשָׁתֵי אִידָם כְּדֵין אִינוּן עַמָא הָאִילֵין לָא נַיְיחִין וְלָא שְׁדִיכִין עַד זְמַן דְיִקְטְלוּן בַּעֲלֵי דְבָבֵיהוֹן וְיִשְׁפְּכוּן אִידָם קְטִילֵי בַּעֲלֵי שַנְאֵיהוֹן כְּמַיָא:", "tj_en": "Behold, these people dwell as a lion, like the strong lion; as the lion resteth not, nor is quiet, until he hath taken and eaten flesh and drunk up blood, so this people will rest not, nor be in quiet, till they have slain their enemies, and have shed the blood of their slaughtered foes like water.", "rashi": "<b>הן עם כלביא יקום וגו'.<\/b> כְּשֶׁהֵן עוֹמְדִין מִשְּׁנָתָם שַׁחֲרִית, הֵן מִתְגַּבְּרִין כְּלָבִיא וְכַאֲרִי לַחֲטֹף אֶת הַמִּצְוֹת — לִלְבֹּשׁ טַלִּית, לִקְרֹא אֶת שְׁמַע וּלְהָנִיחַ תְּפִלִּין:<br><br><b>לא ישכב.<\/b> בַּלַּיְלָה עַל מִטָּתוֹ עַד שֶׁהוּא אוֹכֵל וּמְחַבֵּל כָּל מַזִּיק הַבָּא לְטָרְפוֹ, כֵּיצַד? קוֹרֵא אֶת שְׁמַע עַל מִטָּתוֹ וּמַפְקִיד רוּחוֹ בְּיַד הַמָּקוֹם, בָּא מַחֲנֶה וְגַיִס לְהַזִּיקָם, הַקָּבָּ\"ה שׁוֹמְרָם וְנִלְחָם מִלְחֲמוֹתָם וּמַפִּילָם חֲלָלִים (שם); דָּ\"אַ — <b>הן עם כלביא יקום וגו'<\/b>, כְּתַרְגּוּמוֹ:<br><br><b>ודם חללים ישתה.<\/b> נִתְנַבֵּא שֶׁאֵין מֹשֶׁה מֵת עַד שֶׁיַּפִּיל מַלְכֵי מִדְיָן חֲלָלִים וְיֵהָרֵג הוּא עִמָּהֶם, שֶׁנֶּאֱמַר (יהושע י\"ג) \"וְאֶת בִּלְעָם בֶּן בְּעוֹר הַקּוֹסֵם הָרְגוּ בְנֵי יִשְׂרָאֵל בַּחֶרֶב אֶל חַלְלֵיהֶם\" (עי' תנחומא):", "rashi_en": "הן עם כלביא יקום וגו׳ BEHOLD, THE PEOPLE RISES AS A LIONESS, etc. — When they rise from their sleep in the morning they show themselves strong as a lioness and as a lion to “snatch at” the Divine precepts (to perform them immediately) — to clothe themselves with the Tallith, to read the Shema and to lay Tephillin (cf. Midrash Tanchuma, Balak 14).<br><br>לא ישכב HE LIES NOT DOWN at night on his bed until he consumes (עד יאכל) and destroys every noxious thing which comes to prey upon him (טרף). How so? He reads the Shema at his bedside and commends his spirit into the hands of the Omnipresent (Midrash Tanchuma, Balak 14). If a camp or troop comes to injure them, the Holy One, blessed be He, protects them and fights their battles and causes them (the enemies) to fall slain (חללים).— Another explanation of הן עם כלביא יקום is as the Targum has it (“Behold the people shall dwell as a lioness and as a lion shall he raise himself; he will not dwell in his land until he hath slaughtered and he will inherit the wealth of the peoples”).<br><br>ודם חללים ישתה AND HE SHALL DRINK THE BLOOD OF THE SLAIN — He unwittingly foretold the future — that Moses would not die until he will have made the kings of Midean fall slain (חללים) and he (Balaam) will have been slain with them, — as it is said, (Joshua 13:22) “And Balaam the son of Beor, the soothsayer, did the children of Israel slay with the sword among the rest of their slain (חלליהם)\" (cf. Midrash Tanchuma, Balak 14)."}, {"ch": 23, "v": 25, "aliyah": 6, "heb": "וַיֹּ֤אמֶר בָּלָק֙ אֶל־בִּלְעָ֔ם גַּם־קֹ֖ב לֹ֣א תִקֳּבֶ֑נּוּ גַּם־בָּרֵ֖ךְ לֹ֥א תְבָרְכֶֽנּוּ׃", "onk": "וַאֲמַר בָּלָק לְבִלְעָם אַף מֵילַט לָא תְלוּטִנּוּן אַף בְּרָכָא לָא תְבָרֵכִנּוּן:", "onk_en": "Balak said to Bil’am: “Also do not curse them, also do not bless them.”", "pj": "וַאֲמַר בָּלָק לְבִלְעָם אוּף לִטָא לָא תְלוֹטִינוּן אוּף בִּרְכָא לָא תְבָרְכִינוּן", "pj_en": "And Balak said to Bileam, Neither curse them nor bless them.", "tj": "", "tj_en": "", "rashi": "<b>גם קב לא תקבנו.<\/b> גַם רִאשׁוֹן מוֹסִיף עַל גַּם הַשֵּׁנִי וְגַם הַשֵּׁנִי עַל גַּם רִאשׁוֹן, וְכֵן \"גַּם לִי גַם לָךְ לֹא יִהְיֶה\" (מלכים א ג'), וְכֵן \"גַּם בָּחוּר גַּם בְּתוּלָה\" (דברים ל\"ב):", "rashi_en": "גם קב לא תקבנו NEITHER (גם) CURSE THEM AT ALL [NOR (גם) BLESS THEM AT ALL] — The first גם adds something to the second גם and the second גם something to the first גם, similar to (1 King 3:26): “Neither mine (גם לי) nor thine (גם לך) shall it be”; and similarly (Deuteronomy 32:25): “also youths (גם בכור) also maidens (גם בתולה)” (i.e. both youths and maidens)."}, {"ch": 23, "v": 26, "aliyah": 6, "heb": "וַיַּ֣עַן בִּלְעָ֔ם וַיֹּ֖אמֶר אֶל־בָּלָ֑ק הֲלֹ֗א דִּבַּ֤רְתִּי אֵלֶ֙יךָ֙ לֵאמֹ֔ר כֹּ֛ל אֲשֶׁר־יְדַבֵּ֥ר יְהֹוָ֖ה אֹת֥וֹ אֶֽעֱשֶֽׂה׃", "onk": "וַאֲתֵב בִּלְעָם וַאֲמַר לְבָלָק הֲלָא מַלֵּלִית עִמָּךְ לְמֵימָר כֹּל דִּי יְמַלֵּל יְיָ יָתֵיהּ אֶעְבֵּד:", "onk_en": "Bil’am answered Balak and said: “Did I not tell you that all that Adonoy tells me will I do.”", "pj": "וְאָתֵיב בִּלְעָם וַאֲמַר לְבָלָק הֲלָא מִן שֵׁרוּיָא מַלֵלִית עִמָךְ לְמֵימָר כָּל דִימַלֵיל יְיָ יָתֵיהּ אֶעֱבַד", "pj_en": "But Bileam answered and said to Balak, Did I not tell thee at the beginning, Whatsoever the Lord speaketh, that must I do?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 27, "aliyah": 7, "heb": "וַיֹּ֤אמֶר בָּלָק֙ אֶל־בִּלְעָ֔ם לְכָה־נָּא֙ אֶקָּ֣חֲךָ֔ אֶל־מָק֖וֹם אַחֵ֑ר אוּלַ֤י יִישַׁר֙ בְּעֵינֵ֣י הָאֱלֹהִ֔ים וְקַבֹּ֥תוֹ לִ֖י מִשָּֽׁם׃", "onk": "וַאֲמַר בָּלָק לְבִלְעָם אִיתָא כְעַן אֲדַבְּרִנָּךְ לַאֲתַר אָחֳרָן מָאִים <b>יְהֵי רַעֲוָא מִן קֳדָם<\/b> יְיָ וּתְלוּטֵיהּ לִי מִתַּמָּן:", "onk_en": "Balak then said to Bil’am: “Come, I will take you somewhere else, perhaps God will consider it proper [<b>it will be the will before Hashem<\/b>] and you will curse them for me, from there.”", "pj": "וַאֲמַר בָּלָק לְבִלְעָם אִיתָא כְדוּן אִידַבְּרִינָךְ לַאֲתַר חוֹרָן דִלְמָא תְהֵי רַעֲוָא מִן קֳדָם יְיָ וּתְלַטְטֵיהּ בְּגִינִי מִתַּמָן", "pj_en": "And Balak said to Bileam, Come, and I will now take thee to another place, if so be it may be pleasing before the Lord, that thou mayest curse him for me from thence.", "tj": "", "tj_en": "", "rashi": "<b>וקבתו לי.<\/b> אֵין זֶה לְשׁוֹן צִוּוּי כְּמוֹ וְקָבְנוֹ, אֶלָּא לְשׁוֹן עָתִיד — אוּלַי יִישַׁר בְּעֵינָיו וְתִקָּבֶנּוּ לִי מִשָּׁם, מלדי\"רש בְּלַעַז:", "rashi_en": "וקבתי לי — This is not a command as is וקבנו (v. 13), but it is a future tense: perhaps it will seem right in His eyes that thou shalt curse them for me from there; malderas in O. F."}, {"ch": 23, "v": 28, "aliyah": 7, "heb": "וַיִּקַּ֥ח בָּלָ֖ק אֶת־בִּלְעָ֑ם רֹ֣אשׁ הַפְּע֔וֹר הַנִּשְׁקָ֖ף עַל־פְּנֵ֥י הַיְשִׁימֹֽן׃", "onk": "וּדְבַר בָּלָק יָת בִּלְעָם רֵישׁ רָמָתָא דְּמִסְתַּכְּיָא עַל אַפֵּי בֵית יְשִׁימוֹן:", "onk_en": "Balak took Bil’am to the peak of Pe’or which overlooks the Yeshimon.", "pj": "וּדְבַר בָּלָק יַת בִּלְעָם לְרֵישׁ רָמָתָא דְמַדִיקָא עַל אַנְפֵּי בֵּית יְשִׁימוֹת", "pj_en": "And Balak led Bileam to the high place of the prospect which looketh toward Beth Jeshimoth.", "tj": "", "tj_en": "", "rashi": "<b>ראש הפעור.<\/b> קוֹסֵם גָּדוֹל הָיָה בָלָק וְרָאָה שֶׁהֵן עֲתִידִין לִלְקוֹת עַל יְדֵי פְעוֹר, וְלֹא הָיָה יוֹדֵעַ בַּמֶּה, אָמַר שֶׁמָּא הַקְּלָלָה תָחוּל עֲלֵיהֶם מִשָּׁם וְכֵן כָּל הַחוֹזִים בַּכּוֹכָבִים רוֹאִים וְאֵינָם יוֹדְעִים מָה רוֹאִים (סוטה י\"ב):", "rashi_en": "ראש הפעור THE TOP OF PEOR — Balak was a great soothsayer and he foresaw that they would once be punished on account of Peor, but he knew not by what. He said: Perhaps the curse will fall upon them from there (be effective against them if pronounced there). So, too, all astrologers: they see something that will once happen but they know not exactly what they see (cf. Sotah 12b)."}, {"ch": 23, "v": 29, "aliyah": 7, "heb": "וַיֹּ֤אמֶר בִּלְעָם֙ אֶל־בָּלָ֔ק בְּנֵה־לִ֥י בָזֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְהָכֵ֥ן לִי֙ בָּזֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְשִׁבְעָ֥ה אֵילִֽם׃", "onk": "וַאֲמַר בִּלְעָם לְבָלָק בְּנֵה לִי הָכָא שַׁבְעָא מַדְבְּחִין וְאַתְקֵין לִי הָכָא שַׁבְעָא תוֹרִין וְשַׁבְעָא דִכְרִין:", "onk_en": "Bil’am said to Balak: “Build seven altars for me here and prepare for me seven bulls and seven rams.”", "pj": "וַאֲמַר בִּלְעָם לְבָלָק בְּנֵה לִי הָכָא שׁוּבְעָא אֱגוֹרִין וְעַתַּד לִי הָכָא שׁוּבְעָא תוֹרִין וְשׁוּבְעָא דִכְרִין", "pj_en": "And Bileam said to Balak, Erect here for me seven altars, and prepare me seven bullocks and seven rams.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 30, "aliyah": 7, "heb": "וַיַּ֣עַשׂ בָּלָ֔ק כַּאֲשֶׁ֖ר אָמַ֣ר בִּלְעָ֑ם וַיַּ֛עַל פָּ֥ר וָאַ֖יִל בַּמִּזְבֵּֽחַ׃", "onk": "וַעֲבַד בָּלָק כְּמָא דִי אֲמַר בִּלְעָם וְאַסֵּק תּוֹר וּדְכַר עַל כָּל מַדְבְּחָא:", "onk_en": "Balak did as Bil’am said, and he sacrificed as a burnt-offering a bull and a ram on each altar.", "pj": "וַעֲבַד בָּלָק הֵיכְמָא דְאָמַר בִּלְעָם וְאַסֵיק תּוֹר וּדְכַר עַל כָּל אֲגוֹרָא", "pj_en": "And Balak did as Bileam had said, and offered a bullock and a ram upon every altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 1, "aliyah": 7, "heb": "וַיַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּעֵינֵ֤י יְהֹוָה֙ לְבָרֵ֣ךְ אֶת־יִשְׂרָאֵ֔ל וְלֹא־הָלַ֥ךְ כְּפַֽעַם־בְּפַ֖עַם לִקְרַ֣את נְחָשִׁ֑ים וַיָּ֥שֶׁת אֶל־הַמִּדְבָּ֖ר פָּנָֽיו׃", "onk": "וַחֲזָא בִלְעָם אֲרֵי <b>תַקִּין קֳדָם<\/b> יְיָ לְבָרָכָא יָת יִשְׂרָאֵל וְלָא הֲלַךְ כִּזְמַן בִּזְמַן אֶלָּהֵן לָקֳדָמוּת נְחָשַׁיָּא וְשַׁוִּי לְמַדְבְּרָא אַפּוֹהִי:", "onk_en": "When Bil’am saw that it was favorable [<b>fitting before<\/b>] to Adonoy to bless Yisroel, he did not approach, as at each time, towards sorcery; but he set his face toward the wilderness.", "pj": "וַחֲמָא בִּלְעָם אֲרוּם שְׁפַר הֲוָה קֳדָם יְיָ לְבָרְכָא יַת יִשְרָאֵל וְלָא הֲלִיךְ זְמַן בָּתַר זְמַן לִקְדָמוּת קוּסְמַיָא וְשַׁוִי לְמַדְבְּרָא אַנְפּוֹי לְמַדְכַּר עֲלֵיהוֹן עוּבְדָא דְעֵיגְלָא דַעֲבָדוּ תַּמָן", "pj_en": "And Bileam, seeing that it was good before the Lord to bless Israel, went not, as once and again before, in quest of divinations, but set his face toward the wilderness, to recall to memory the work of the calf which they had there committed.", "tj": "וַחֲמָא בִלְעָם אֲרוּם שְׁפַר הֲוָה מִן קֳדָם יְיָ לִמְבָרְכָא יַת יִשְרָאֵל וְלָא אָזִיל הֵיךְ מַה דַהֲוָה אָזִיל בְּכָל זְמַן וּזְמַן לְמִשְׁתַּאֲלָא בִּדְכִירָא לְקָדָמוּת קְסָמַיָא אָזִיל וְשַׁוִין אַפּוֹי לְמַדְבְּרָא וַהֲוָה מַדְכַּר לְהוֹן עוּבְדָא דְעֵיגְלָא בְּעָא לְמֵילוֹט יַת יִשְרָאֵל:", "tj_en": "And Bileam saw that it was pleasing before-the Lord to bless Israel, so that he went not, as he had gone from time to time, to seek for divinations, or to provide enchantments; but went and set his face toward the wilderness to recall to memory their work of the calf, (still) being desirous to curse Israel.", "rashi": "<b>וירא בלעם כי טוב וגו'.<\/b> אָמַר אֵינִי צָרִיךְ לִבְדֹּק עוֹד בְּהַקָּבָּ\"ה, כִּי לֹא יַחְפֹּץ לְקַלְּלָם:<br><br><b>לא הלך כפעם בפעם.<\/b> כַּאֲשֶׁר עָשָׂה שְׁתֵּי פְעָמִים:<br><br><b>לקראת נחשים.<\/b> לְנַחֵשׁ אוּלַי יִקָּרֶה ה' לִקְרָתוֹ כִּרְצוֹנוֹ, אָמַר רוֹצֶה וְלֹא רוֹצֶה לְקַלְּלָם, אַזְכִּיר עֲוֹנוֹתֵיהֶם, וְהַקְּלָלָה עַל הַזְכָּרַת עֲוֹנוֹתֵיהֶם תָּחוּל:<br><br><b>וישת אל המדבר פניו.<\/b> כְּתַרְגּוּמוֹ:", "rashi_en": "וירא בלעם כי טוב וגו׳ AND BALAAM SAW THAT IT WAS GOOD, etc. He said: I do not need to put the Holy One, blessed be He, to a further test for it is evident that He does not wish to curse them.<br><br>ולא הלך כפעם בפעם HE WENT NOT, AS AT OTHER TIMES — as he had already done twice.<br><br>לקראת נחשים TO SEEK SEEK FOR ENCHANTMENTS — to practise enchantments whereby the Lord might perhaps come to meet him according to his (Balaam’s) wish. He said: Whether He wishes or does not wish to curse them, I will make mention of their sins, and the curse will fall upon them at the mention of their sins, therefore —<br><br>וישת אל המדבר פניו HE SET HIS FACE TOWARDS THE WILDERNESS — Understand this as the Targum has it (Rashi’s Targum read, as in some editions: He directed his face towards the calf that the children of Israel had made in the wilderness)."}, {"ch": 24, "v": 2, "aliyah": 7, "heb": "וַיִּשָּׂ֨א בִלְעָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ אֶת־יִשְׂרָאֵ֔ל שֹׁכֵ֖ן לִשְׁבָטָ֑יו וַתְּהִ֥י עָלָ֖יו ר֥וּחַ אֱלֹהִֽים׃", "onk": "וּזְקֵף בִּלְעָם יָת עֵנוֹהִי וַחֲזָא יָת יִשְׂרָאֵל שָׁרָן לְשִׁבְטוֹהִי וּשְׁרַת עֲלוֹהִי רוּחַ <b>נְבוּאָה מִן קֳדָם<\/b> יְיָ:", "onk_en": "Bil’am raised his eyes and saw Israel encamped according to its tribes, and the spirit of God rested upon him [<b>prophesy from before Hashem<\/b>].", "pj": "וּזְקַף בִּלְעָם יַת עֵינוֹי וַחֲמָא יַת יִשְרָאֵל שַׁרְיַין לְשִׁבְטֵיהוֹן בְּבָתֵּי מֶדְרָשֵׁיהוֹן וְלָא הֲווֹן תַּרְעֵיהוֹן מְכַוְונִין כֻּלוֹ קֳבֵיל תַּרְעֵי חַבְרֵיהוֹן וּשְׁרַת עֲלוֹי רוּחַ נְבוּאָה מִן קֳדָם יְיָ", "pj_en": "And Bileam lifted up his eyes, but beheld Israel dwelling together by their tribes in their schools, and (saw) that their doors were arranged so as not to overlook the doors of their companions: and the Spirit of prophecy from before the Lord rested upon him.", "tj": "", "tj_en": "", "rashi": "<b>וישא בלעם את עיניו.<\/b> בִּקֵּשׁ לְהַכְנִיס בָּהֶם עַיִן רָעָה, וַהֲרֵי יֵשׁ לְךָ שָׁלֹשׁ מִדּוֹתָיו — עַיִן רָעָה וְרוּחַ גְּבוֹהָה וְנֶפֶשׁ רְחָבָה הָאֲמוּרִים לְמַעְלָה:<br><br><b>שכן לשבטיו.<\/b> רָאָה כָל שֵׁבֶט וְשֵׁבֶט שׁוֹכֵן לְעַצְמוֹ וְאֵינָן מְעֹרָבִין, רָאָה שֶׁאֵין פִּתְחֵיהֶם מְכֻוָּנִין זֶה כְנֶגֶד זֶה, שֶׁלֹּא יָצִיץ לְתוֹךְ אֹהֶל חֲבֵרוֹ:<br><br><b>ותהי עליו רוח אלהים.<\/b> עָלָה בְלִבּוֹ שֶׁלֹּא יְקַלְּלֵם:", "rashi_en": "וישא בלעם את עיניו AND BALAAM LIFTED UP HIS EYES — he wished to cast the evil eye upon them. Thus you have his three characteristics — an evil eye mentioned here, and pride and greed which have been mentioned above (see Rashi on Numbers 22:13 and 18).<br><br>שכן לשבטיו DWELLING ACCORDING TO HIS TRIBES — He saw each tribe dwelling by itself not intermingled one with another; he saw that the entrances of their tents were not exactly facing each other so that one could not peer into the other's tent (Bava Batra 60a).<br><br>ותהי עליו רוח אלהים AND THE SPIRIT OF GOD WAS UPON HIM — Then he made up his mind not to curse them (i.e. he decided to comply with the will of God, רוח אלהים)."}, {"ch": 24, "v": 3, "aliyah": 7, "heb": "וַיִּשָּׂ֥א מְשָׁל֖וֹ וַיֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣וֹ בְעֹ֔ר וּנְאֻ֥ם הַגֶּ֖בֶר שְׁתֻ֥ם הָעָֽיִן׃", "onk": "וּנְטַל מַתְלֵיהּ וַאֲמַר אֵמַר בִּלְעָם בְּרֵיהּ בְּעוֹר וְאֵמַר גַּבְרָא <b>דְּשַׁפִּיר חָזֵי<\/b>:", "onk_en": "He set forth his parable, and said: “This is the declaration of Bil’am, the son of Be’or; this is the declaration of the man of the open-socketed eye [<b>who sees well<\/b>].", "pj": "וּנְטַל מְתַל נְבוּתֵיהּ וַאֲמַר אֵימַר בִּלְעָם בַּר בְּעוֹר וְאֵימַר גַבְרָא דְיַקִיר מִן אָבוּי דְרַזְיָא סְתִימַיָא מַה דְאִתְכַּסֵי מִן נְבִיָיא הֲוָה מִתְגְלֵי לֵיהּ וְעַל דְלָא הֲוָה גָזִיר נָפִיל עַל אַנְפּוֹי עַד זְמַן דְשָׁרֵי מַלְאָכָא לְקִיבְּלֵיהּ", "pj_en": "But he took up the parable of his prophecy, and said: Bileam, son of Beor, speaketh; the man speaketh who is more honourable than his father, (because) the dark mysteries hidden from the prophets have been revealed to him; and who, because he was not circumcised, fell upon his face when the angel stood over against him:", "tj": "וּנְטַל בִּמְתַל נְבִיוּתֵיהּ וַאֲמַר אֵימַר בִּלְעָם בְּרָא דִבְעוֹר אֵימַר גַבְרָא דְיַקִיר מִן אָבוֹי מַה דְאִתְכַּסֵי מִכָּל נְבִיאַיָא אִתְגְלֵי עֲלוֹי:", "tj_en": "And he took up in parable his prophecy and said: Bileam the son of Beor saith; the man saith who is more honourable than his father, for what hath been hidden from all prophets is revealed to him;", "rashi": "<b>בנו בער.<\/b> כְּמוֹ \"לְמַעְיְנוֹ מָיִם\" (תהלים קי\"ד); וּמִ\"אַ שְׁנֵיהֶם הָיוּ גְדוֹלִים מֵאֲבוֹתֵיהֶם, בָּלָק בְּנוֹ צִפּוֹר — אָבִיו בְּנוֹ הוּא בְמַלְכוּת, וּבִלְעָם גָּדוֹל מֵאָבִיו בִּנְבִיאוּת — מָנֶה בֶן פְּרָס הָיָה (סנהדרין ק\"ה; תנחומא):<br><br><b>שתם העין.<\/b> עֵינוֹ נְקוּרָה וּמוּצֵאת לַחוּץ וְחֹר שֶׁלָּהּ נִרְאֶה פָתוּחַ, וּלְשׁוֹן מִשְׁנָה הוּא, כְּדֵי שֶׁיִשְׁתֹּם וְיִסְתֹּם וְיִגֹּב (עבודה זרה ס\"ט); וְרַבּוֹתֵינוּ אָמְרוּ, לְפִי שֶׁאָמַר וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל — שֶׁהַקָּבָּ\"ה יוֹשֵׁב וּמוֹנֶה רְבִיעוֹתֵיהֶן שֶׁל יִשְׂרָאֵל, מָתַי תָּבֹא טִפָּה שֶׁנּוֹלַד הַצַּדִּיק מִמֶּנּוּ, אָמַר בְּלִבּוֹ, מִי שֶׁהוּא קָדוֹשׁ וּמְשָׁרְתָיו קְדוֹשִׁים יִסְתַּכֵּל בִּדְבָרִים הַלָּלוּ? וְעַל דָּבָר זֶה נִסְמַת עֵינוֹ שֶׁל בִּלְעָם (נדה ל\"א); וְיֵשׁ מְפָרְשִׁים <b>שתם העין<\/b> — פְּתוּחַ הָעַיִן, כְּמוֹ שֶׁתִּרְגֵּם אֻנְקְלוֹס, וְעַל שֶׁאָמַר שְׁתֻם הָעָיִן וְלֹא אָמַר שְׁתוּם הָעֵינַיִם, לָמַדְנוּ שֶׁסּוּמָא בְאַחַת מֵעֵינָיו הָיָה (סנהדרין ק\"ה):", "rashi_en": "בנו בער — The grammatical form בנו is exactly like that in (Psalms 114:8) “To a spring of (מעינו) water” (see Rashi on Numbers 23:18). But a Midrashic statement is: Both of them (Balak and Balaam) were superior to their fathers, for it states (Numbers 23:18): “Balak — his son was Zippor”, i.e. that his father (Zippor) was his son (his inferior) in respect to royalty, and Balaam was greater than his father in prophecy (because it states here, בלעם בנו בעור i.e. Balaam — his son was Beor): he was, so to speak, a Maneh, son of a Half-Maneh (Sanhedrin 105a, Midrash Tanchuma, Balak 13, cf. Taanit 28b).<br><br>שתום העין WITH THE PENETRATING EYE — his eye was bored out and had been extracted and its eye socket could be seen to be open. The word שתום used in the sense of “boring a hole” is a Mishnaic usage: sufficient time that we can bore a hole (ישתום) in the cask and stop it up, and it (the clay of which the stopper is made) can dry (Avodah Zarah 69a). And our Rabbis said, Because he had said, (Numbers 23:10) ומספר את רבע ישראל, meaning that the Holy One, blessed be He, occupies Himself with counting the issue of the marital life of the Israelites, awaiting the time when a righteous man will be born, he therefore said to himself, “Does He who is holy and whose ministers are holy direct his mind to matters such as these?” On this account Balaam’s eye was blinded (Niddah 31a). But some explain that שתום העין means “open-eyed”, just as Onkelos translated (“who can see well”). And since it says, שתום העין \"with an open eye” and it does not say, “with open eyes”, we may learn that in one of his eyes he was blind (Sanhedrin 105a)."}, {"ch": 24, "v": 4, "aliyah": 7, "heb": "נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי־אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּגְל֥וּי עֵינָֽיִם׃", "onk": "אֵמַר דִּשְׁמַ
