<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 30, "v": 11, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying,", "pj": "וידבר וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake unto Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 12, "aliyah": 1, "heb": "כִּ֣י תִשָּׂ֞א אֶת־רֹ֥אשׁ בְּנֵֽי־יִשְׂרָאֵל֮ לִפְקֻדֵיהֶם֒ וְנָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛וֹ לַיהֹוָ֖ה בִּפְקֹ֣ד אֹתָ֑ם וְלֹא־יִהְיֶ֥ה בָהֶ֛ם נֶ֖גֶף בִּפְקֹ֥ד אֹתָֽם׃", "onk": "אֲרֵי תְקַבֵּל יָת חֻשְׁבַּן בְּנֵי יִשְׂרָאֵל לְמִנְיָנֵיהוֹן וְיִתְּנוּן גְּבַר <b>פֻּרְקַן<\/b> נַפְשֵׁיהּ <b>קֳדָם<\/b> יְיָ כַּד תִּמְנֵי יָתְהוֹן וְלָא יְהֵי בְהוֹן מוֹתָא כַּד תִּמְנֵי יָתְהוֹן:", "onk_en": "“When you take the count of the B’nei Yisrael to determine their numbers, each man shall give an atonement pledge [<b>a redemption<\/b>] for his soul to [<b>before<\/b>] Adonoy, when you count them. Thus there will be no plague among them when you count them.", "pj": "אֲרוּם תְּקַבֵּל יַת חוּשְׁבַּן בְּנֵי יִשְרָאֵל לְמִנְיָינֵיהוֹן וְיִתְּנוּן גְּבַר פּוּרְקַן נַפְשֵׁיהּ קֳדָם יְיָ כַּד תִּמְנֵי יַתְהוֹן וְלָא יְהֵי בְּהוֹן נִזְקָא דְמוֹתָא כַּד תִּמְנֵי יַתְהוֹן", "pj_en": "When thou takest the sum of the sons of Israel according to their number, they shall give every man the ransom of their souls before the Lord when thou numberest them; that there may not be among them the calamity of death when thou dost number them.", "tj": "אֲרוּם תְּקַבֵּיל יַת רֵישׁ חוּשְׁבַּן סְכוּמְהוֹן דִּבְנֵי יִשְרָאֵל:", "tj_en": "When thou takest the head of the number of the sums of the sons of Israel.", "rashi": "<b>כי תשא.<\/b> לְשׁוֹן קַבָּלָה, כְּתַרְגּוּמוֹ; כְּשֶׁתַּחְפֹּץ לְקַבֵּל סְכוּם מִנְיָנָם לָדַעַת כַּמָּה הֵם, אַל תִּמְנֵם לַגֻּלְגֹּלֶת, אֶלָּא יִתְּנוּ כָּל אֶחָד מַחֲצִית הַשֶּׁקֶל וְתִמְנֶה אֶת הַשְּׁקָלִים וְתֵדַע מִנְיָנָם:<br><br><b>ולא יהיה בהם נגף.<\/b> שֶׁהַמִּנְיָן שׁוֹלֵט בּוֹ עַיִן הָרָע, וְהַדֶּבֶר בָּא עֲלֵיהֶם, כְּמוֹ שֶׁמָּצִינוּ בִימֵי דָּוִד (שמואל ב כ\"ד):", "rashi_en": "כי תשא This has the meaning of obtaining: WHEN THOU TAKEST [THE SUM], (not of “lifting up” as in Genesis 40:13); as the Targum has it, תקבל. The sense is: when you wish to obtain the sum total of their number — to know how many they are — do not take their census by their polls but each of them shall give half a shekel, and you shall count these, and so ascertain their number.<br><br>ולא יהיה בהם נגף THAT THERE BE NO CALAMITY AMONG THEM — for numbers (i. e. things that have been numbered) are subject to the influence of the “evil eye”, and therefore if you count them by their polls pestilence may befall them, as we find happened, in the days of David (II Samuel 24:10 and 15)."}, {"ch": 30, "v": 13, "aliyah": 1, "heb": "זֶ֣ה&thinsp;<b>׀<\/b> יִתְּנ֗וּ כׇּל־הָעֹבֵר֙ עַל־הַפְּקֻדִ֔ים מַחֲצִ֥ית הַשֶּׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַשֶּׁ֔קֶל מַחֲצִ֣ית הַשֶּׁ֔קֶל תְּרוּמָ֖ה לַֽיהֹוָֽה׃", "onk": "דֵּין יִתְּנוּן כָּל דְּעָבַר עַל מִנְיָנַיָּא פַּלְגּוּת <b>סִלְעָא<\/b> בְּסִלְעֵי קוּדְשָׁא עֶסְרִין <b>מָעִין סִלְעָא<\/b> פַּלְגּוּת <b>סִלְעָא<\/b> אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Everyone passing by to be counted must give this—half a shekel [<b>sela<\/b>] based on the shekel [<b>sela<\/b>] of the Holy [Sanctuary,] where a shekel [<b>sela<\/b>] is twenty geirah [<b>ma’in<\/b>]. Half of such a shekel [<b>sela<\/b>] must be given as a terumah-offering to [<b>before<\/b>] Adonoy.", "pj": "דֵּין שִׁיעוּרָא אִיתְחַמֵי לְמשֶׁה בְּטַוְורָא הֵי כְדִינְרָא דְאֵשָׁא וְהֵיכְדֵין אָמַר לֵיהּ כְּדֵין יִנָּתְנוּן כָּל מַאן דְּעָבַר עַל מִנְיָנַיָא פַּלְגוּת סִילְעָא בְּסִילְעָא דְטַבְעָא דְקוּדְשָׁא עַשְרִין מָעִין סִילְעָא פַּלְגוּת סִילְעָא אַפְרָשׁוּתָא קֳדָם יְיָ", "pj_en": "This valuation was shown to Mosheh in the mountain as with a denarius of fire, and thus spake He to him: So shall every one who passeth to the numberment give a half shekel of the coin of the sanctuary: (a half shekel is twenty manin:) the half shekel is to be the separation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>זה יתנו.<\/b> הֶרְאָה לוֹ כְּמִין מַטְבֵּעַ שֶׁל אֵשׁ וּמִשְׁקָלָהּ מַחֲצִית הַשֶּׁקֶל וְאוֹמֵר לוֹ כָּזֶה יִתְּנוּ (תלמוד ירושלמי שק' א'):<br><br><b>העבר על הפקדים.<\/b> דֶּרֶךְ הַמּוֹנִין מַעֲבִירִין אֶת הַנִּמְנִין זֶה אַחַר זֶה, וְכֵן כֹּל אֲשֶׁר יַעֲבֹר תַּחַת הַשָּׁבֶט (ויקרא כ\"ז), וְכֵן תַּעֲבֹרְנָה הַצֹּאן עַל יְדֵי מוֹנֶה (ירמיהו ל\"ג):<br><br><b>מחצית השקל בשקל הקדש.<\/b> בְּמִשְׁקַל הַשֶּׁקֶל שֶׁקָּצַבְתִּי לְךָ לִשְׁקֹל בּוֹ שִׁקְלֵי הַקֹּדֶשׁ, כְּגוֹן שְׁקָלִים הָאֲמוּרִין בְּפָרָשַׁת עֲרָכִין וּשְׂדֵה אֲחֻזָּה:<br><br><b>עשרים גרה השקל.<\/b> עַכְשָׁו פֵּרֵשׁ לְךָ כַּמָּה הוּא:<br><br><b>גרה.<\/b> לְשׁוֹן מָעָה; וְכֵן בִּשְׁמְוּאֵל (א' ב'), יָבוֹא לְהִשְׁתַּחֲוֹת לוֹ לַאֲגוֹרַת כֶּסֶף וְכִכַּר לָחֶם:<br><br><b>עשרים גרה השקל.<\/b> שֶׁהַשֶּׁקֶל הַשָּׁלֵם אַרְבָּעָה זוּזִים, וְהַזּוּז מִתְּחִלָּתוֹ חָמֵשׁ מָעוֹת, אֶלָּא בָאוּ וְהוֹסִיפוּ עָלָיו שְׁתוּת וְהֶעֱלוּהוּ לְשֵׁשׁ מָעָה כֶסֶף, וּמַחֲצִית הַשֶּׁקֶל הַזֶּה שֶׁאָמַרְתִּי לְךָ יִתְּנוּ תְּרוּמָה לַה' (בכורות ה'):", "rashi_en": "זה יתנו THIS SHALL THEY GIVE — He (God) showed him (Moses) a kind of fiery coin the weight of which was half a shekel and said to him, “Like this shall they give” (Midrash Tanchuma, Ki Tisa 9).<br><br>העבר על הפקדים [EVERY ONE] THAT PASSETH AMONG THEM THAT ARE MUSTERED — Scripture uses the expression כל העבר על הפקדים instead of merely saying כל הפקדים because it is the practice of those who count animate beings to make these pass before them one after the other, counting them as they pass. Similar are: (Leviticus 27:32) “whatever passeth (יעבר) under the rod”; (Jeremiah 33:13) “the flock shall pass again (תעברנה) under the hands of him that counteth them”.<br><br>מחצית השקל בשקל הקדש THE HALF OF A SHEKEL AFTER THE SHEKEL OF HOLINESS – i. e. after the weight of the shekel which I have appointed for you as the standard by which to weigh the shekels used for sacred purposes, as, for instance, those shekels mentioned in the section dealing with estimating things dedicated to the Sanctuary and with “fields of possession” so dedicated (Leviticus ch. 27).<br><br>עשרים גרה השקל A SHEKEL IS TWENTY GERAHS — Having stated that it must be a holy shekel it now tells you exactly how much it is.<br><br>גרה in Hebrew denotes what is called a מעה, a coin of small value, in Aramaic. And in this sense we find it in the book of Samuel (I Samuel 2:36) “[every one that is left] shall come and crouch to him for a piece of (אגורת) silver and a morsel of bread” which the Targum renders by למעה דכסף.‎<br><br>עשרים גרה השקל A SHEKEL IS TWENTY GERAHS — For a full shekel is four zuz and a zuz was originally five meahs (consequently a shekel was twenty meahs or gerahs); only that they increased it (the zuz) by one sixth and so raised its value to six meahs of silver. Now THE HALF OF THIS (the original) SHEKEL of which I have spoken to you SHALL THEY GIVE AS A HEAVE OFFERING TO THE LORD."}, {"ch": 30, "v": 14, "aliyah": 1, "heb": "כֹּ֗ל הָעֹבֵר֙ עַל־הַפְּקֻדִ֔ים מִבֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָמָ֑עְלָה יִתֵּ֖ן תְּרוּמַ֥ת יְהֹוָֽה׃", "onk": "כֹּל דְּעָבַר עַל מִנְיָנַיָּא מִבַּר עֶסְרִין שְׁנִין וּלְעֵלָּא יִתֵּן אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Everyone passing by to be counted, from [age] twenty years and older, must give a terumah-offering to [<b>before<\/b>] Adonoy.", "pj": "כָּל מַאן דְּעָבַר עַל מִנְיָינַיָא מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא יִתֵּן אַפְרָשׁוּתָא קֳדָם יְיָ", "pj_en": "Every one who passeth to the numbering, from a son of twenty years and upwards, shall give the seperation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>מבן עשרים שנה ומעלה.<\/b> לִמֶּדְךָ כָּאן שֶׁאֵין פָּחוּת מִבֶּן עֶשְׂרִים יוֹצֵא לַצָּבָא וְנִמְנֶה בִּכְלַל אֲנָשִׁים:", "rashi_en": "מבן עשרים שנה ומעלה FROM TWENTY YEARS OLD AND ABOVE — Scripture teaches you here that anyone less than twenty years of age does not go forth to the army nor is he to be counted among the “men” (of whom v. 12 speaks)."}, {"ch": 30, "v": 15, "aliyah": 1, "heb": "הֶֽעָשִׁ֣יר לֹֽא־יַרְבֶּ֗ה וְהַדַּל֙ לֹ֣א יַמְעִ֔יט מִֽמַּחֲצִ֖ית הַשָּׁ֑קֶל לָתֵת֙ אֶת־תְּרוּמַ֣ת יְהֹוָ֔ה לְכַפֵּ֖ר עַל־נַפְשֹׁתֵיכֶֽם׃", "onk": "דְּעַתִּיר לָא יַסְגֵּי וּדְמִסְכֵּן לָא יַזְעֵר מִפַּלְגּוּת <b>סִלְעָא<\/b> לְמִתַּן יָת אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ לְכַפָּרָא עַל נַפְשָׁתֵיכוֹן:", "onk_en": "The rich shall not give more, and the poor shall not give less than half a shekel [<b>sela<\/b>], when giving this terumah-offering to [<b>before<\/b>] Adonoy to atone for your souls.", "pj": "דְּעַתִּיר לָא יִסְגֵי וּדְמִסְכֵּן לָא יַזְעַר מִפַּלְגוּת סִלְעָא לְמִתַּן יַת אַפְרָשׁוּתָא קֳדָם יְיָ לְכַפָּרָא עַל נַפְשָׁתֵיכוֹן", "pj_en": "He who is rich shall not add to, and he who is poor shall not diminish from, the half shekel in giving the seperation before the Lord, to atone for your souls.", "tj": "", "tj_en": "", "rashi": "<b>לכפר על נפשתיכם.<\/b> שֶׁלֹא תִנָּגְפוּ עַל יְדֵי מִנְיָן; דָּ\"אַ לְכַפֵּר עַל נַפְשׁוֹתֵיכֶם, לְפִי שֶׁרָמַז לָהֶם כָּאן ג' תְּרוּמוֹת – שֶׁנִּכְתַּב כָּאן תְּרוּמַת ה' שָׁלֹשׁ פְּעָמִים, אַחַת תְּרוּמַת אֲדָנִים שֶׁמְּנָאָן כְּשֶׁהִתְחִילוּ בְנִדְבַת הַמִּשְׁכָּן, שֶׁנָּתְנוּ כָּל אֶחָד וְאֶחָד מַחֲצִית הַשֶּׁקֶל, וְעָלָה לִמְאַת הַכִּכָּר, שֶׁנֶּאֱמַר וְכֶסֶף פְּקוּדֵי הָעֵדָה מְאַת כִּכָּר (שמות ל\"ח), וּמֵהֶם נַעֲשׂוּ הָאֲדָנִים שֶׁנֶּאֱמַר וַיְהִי מְאַת כִּכַּר הַכֶּסֶף וְגוֹ' (שם); וְהַשֵּׁנִית אַף הִיא עַל יְדֵי מִנְיָן, שֶׁמְּנָאָן מִשֶּׁהוּקַם הַמִּשְׁכָּן, הוּא הַמִּנְיָן הָאָמוּר בִּתְחִלַּת חֻמַּשׁ הַפְּקוּדִים בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי בַּשָּׁנָה הַשֵּׁנִית (במדבר א'), וְנָתְנוּ כָּל אֶחָד מַחֲצִית הַשֶּׁקֶל, וְהֵן לִקְנוֹת מֵהֶן קָרְבְּנוֹת צִבּוּר שֶׁל כָּל שָׁנָה וְשָׁנָה, וְהֻשְׁווּ בָהֶם עֲנִיִּים וַעֲשִׁירִים, וְעַל אוֹתָהּ תְּרוּמָה נֶאֱמַר לְכַפֵּר עַל נַפְשׁוֹתֵיכֶם, שֶׁהַקָּרְבָּנוֹת לְכַפָּרָה הֵם בָּאִים; וְהַשְּׁלִישִׁית הִיא תְרוּמַת הַמִּשְׁכָּן כְּמוֹ שֶׁנֶּאֱמַר כָּל מֵרִים תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת (שמות ל\"ה), וְלֹא הָיְתָה יַד כֻּלָּם שָׁוָה בָהּ אֶלָּא אִישׁ מַה שֶּׁנְּדָבוֹ לִבּוֹ:", "rashi_en": "לכפר על נפשתיכם TO MAKE AN EXPIATION FOR YOUR SOULS — in order that you may not be liable to the plague in consequence of the census. Another explanation of לכפר על נפשתיכם is that it was really an atonement for their sins: because Scripture alludes here to three different heave offerings since it uses the expression תרומת ה׳ three times (twice in vv. 14 and 15, ‘תרומת ה, and once in vers 13, ‘תרומה לה). One mention is an allusion to the heave offering that was to be used for the making of the sockets, for he (Moses) counted them when they began to contribute towards the building of the Tabernacle, when each gave half a shekel, the total amounting to a hundred talents, as it is said, (Exodus 38:25) “and the silver of them that were numbered of the congregation was an hundred talents”, and of these the sockets were made, as it is stated, (Exodus 38:27) “And of the hundred talents of silver [were cast the sockets of the Sanctuary etc.]”. The second heave offering was also levied by way of census, for he numbered them again after the Tabernacle was erected; that is the census referred to in the beginning of the Book of Numbers: (Numbers 1:1) “[And the Lord spake unto Moses] … on the first day of the second month in the second year … [Take ye the sum of all the congregation of the children of Israel]”, and on that occasion, too, each of them gave half a shekel. These were employed in purchasing the communal sacrifices for each year. Rich and poor were made alike in regard to these half shekels; and it is with reference to this heave offering that Scripture uses here the expression לכפר על נפשתיכם, “to make expiation for your souls”, for sacrifices were brought in order to make atonement. The third heave offering was that offered for the building of the Tabernacle, as it is said, (Exodus 35:24) “Every one that did offer an offering of silver and brass…”. In this heave offering, however, they did not all participate alike, but each one brought whatever his heart prompted him to give (Talmud Yerushalmi Shekalim 1:1; cf. Rashi on Exodus 25:1)."}, {"ch": 30, "v": 16, "aliyah": 1, "heb": "וְלָקַחְתָּ֞ אֶת־כֶּ֣סֶף הַכִּפֻּרִ֗ים מֵאֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְנָתַתָּ֣ אֹת֔וֹ עַל־עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְהָיָה֩ לִבְנֵ֨י יִשְׂרָאֵ֤ל לְזִכָּרוֹן֙ לִפְנֵ֣י יְהֹוָ֔ה לְכַפֵּ֖ר עַל־נַפְשֹׁתֵיכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִסַּב יָת כְּסַף כִּפּוּרַיָּא מִן בְּנֵי יִשְׂרָאֵל וְתִתֵּן יָתֵיהּ עַל פָּלְחַן מַשְׁכַּן זִמְנָא וִיהֵי לִבְנֵי יִשְׂרָאֵל לְדָכְרָנָא קֳדָם יְיָ לְכַפָּרָא עַל נַפְשָׁתֵיכוֹן:", "onk_en": "Take this atonement money from the B’nei Yisrael and donate it for the work of the Tent of Meeting. It will be a remembrance for the B’nei Yisrael before Adonoy to atone for your souls.”", "pj": "וְתִיסַב יַת כַּסְפָּא דְכִיפּוּרַיָא מִן בְּנֵי יִשְרָאֵל וְתִתֵּן יָתֵיהּ עַל עֲבִידַת מַשְׁכַּן זִימְנָא וִיהֵי לִבְנֵי יִשְרָאֵל לְדוּכְרַן טַב קֳדָם יְיָ לְכַפָּרָא עַל נַפְשָׁתֵיכוֹן", "pj_en": "And thou shalt take the silver of the ransom from the sons of Israel, and apply it to the work of the tabernacle of ordinance; that it may be for the sons of Israel for a good memorial before the Lord, as a ransom for your souls.", "tj": "", "tj_en": "", "rashi": "<b>ונתת אתו על עבדת אהל מועד.<\/b> לָמַדְתָּ שֶׁנִּצְטַוּוּ לִמְנוֹתָם בִּתְחִלַּת נִדְבַת הַמִּשְׁכָּן, אַחַר מַעֲשֵׂה הָעֵגֶל, מִפְּנֵי שֶׁנִּכְנַס בָּהֶם מַגֵּפָה, כְּמוֹ שֶׁנֶּאֱמַר וַיִּגֹּף ה' אֶת הָעָם; מָשָׁל לְצֹאן הַחֲבִיבָה עַל בְּעָלֶיהָ שֶׁנָּפַל בָּהּ דֶּבֶר וּמִשֶּׁפָּסַק אָמַר לוֹ לָרוֹעֶה בְּבַקָּשָׁה מִמְּךָ מְנֵה אֶת צֹאנִי וְדַע כַּמָּה נוֹתְרוּ בָהֶם, לְהוֹדִיעַ שֶׁהִיא חֲבִיבָה עָלָיו; וְאִי אֶפְשָׁר לוֹמַר שֶׁהַמִּנְיָן הַזֶּה הוּא הָאָמוּר בְּחֻמַּשׁ הַפְּקוּדִים, שֶׁהֲרֵי נֶאֱמַר בּוֹ בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי וְהַמִּשְׁכָּן הוּקַם בְּאֶחָד לַחֹדֶשׁ הָרִאשׁוֹן, שֶׁנֶּאֱמַר בְּיוֹם הַחֹדֶשׁ הָרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ תָּקִים וְגוֹ' (שמות מ'), וּמֵהַמִּנְיָן הַזֶּה נַעֲשׂוּ הָאֲדָנִים – מִשְּׁקָלִים שֶׁלּוֹ – שֶׁנֶּאֱמַר וַיְהִי מְאַת כִּכַּר הַכֶּסֶף לָצֶקֶת וְגוֹ' (שם ל\"ח), הָא לָמַדְתָּ שְׁתַּיִם הָיוּ, אֶחָד בִּתְחִלַּת נִדְבָתָן אַחַר יוֹם הַכִּפּוּרִים בְּשָׁנָה רִאשׁוֹנָה, וְאַחַת בְּשָׁנָה שְׁנִיָּה בְּאִיָּר מִשֶּׁהוּקַם הַמִּשְׁכָּן. וְאִם תֹּאמַר וְכִי אֶפְשָׁר שֶׁבִּשְׁנֵיהֶם הָיוּ יִשְׂרָאֵל שָׁוִים – ו' מֵאוֹת אֶלֶף וְג' אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים – שֶׁהֲרֵי בְכֶסֶף פְּקוּדֵי הָעֵדָה נֶאֱמַר כֵּן, וּבְחֻמַּשׁ הַפְּקוּדִים אַף בּוֹ נֶאֱמַר כֵּן וַיִּהְיוּ כָּל הַפְּקוּדִים שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים (במדבר א'), וַהֲלֹא בִשְׁתֵּי שָׁנִים הָיוּ, וְאִ\"אֶ שֶׁלֹא הָיוּ בִשְׁעַת מִנְיָן הָרִאשׁוֹן בְּנֵי י\"ט שָׁנָה שֶׁלֹּא נִמְנוּ וּבַשְּׁנִיָּה נַעֲשׂוּ בְּנֵי כ'! תְּשׁוּבָה לַדָּבָר: אֵצֶל שְׁנוֹת הָאֲנָשִׁים בְּשָׁנָה אַחַת נִמְנוּ, אֲבָל לְמִנְיַן יְצִיאַת מִצְרַיִם הָיוּ שְׁתֵּי שָׁנִים, לְפִי שֶׁלִּיצִיאַת מִצְרַיִם מוֹנִין מִנִּיסָן, כְּמוֹ שֶׁשָּׁנִינוּ בְמַסֶּ' רֹאשׁ הַשָּׁנָה (דף ב'), וְנִבְנָה הַמִּשְׁכָּן בָּרִאשׁוֹנָה וְהוּקַם בַּשְּׁנִיָּה, שֶׁנִּתְחַדְּשָׁה שָׁנָה בְּאֶחָד בְּנִיסָן, אֲבָל שְׁנוֹת הָאֲנָשִׁים מְנוּיִין לְמִנְיַן שְׁנוֹת עוֹלָם, הַמַּתְחִילִין מִתִּשְׁרֵי, נִמְצְאוּ שְׁנֵי הַמִּנְיָנִים בְּשָׁנָה אַחַת – הַמִּנְיָן הָרִאשׁוֹן הָיָה בְּתִשְׁרֵי לְאַחַר יֹ\"הַכִּ שֶׁנִּתְרַצָּה הַמָּקוֹם לְיִשְׂרָאֵל לִסְלֹחַ לָהֶם וְנִצְטַוּוּ עַל הַמִּשְׁכָּן, וְהַשֵּׁנִי בְּאֶחָד בְּאִיָּר:<br><br><b>על עבדת אהל מועד.<\/b> הֵן הָאֲדָנִים שֶׁנַּעֲשׂוּ בוֹ:", "rashi_en": "ונתת אתו על עבדת אהל מועד AND THOU SHALT GIVE IT FOR THE SERVICE OF THE APPOINTED TENT — From this statement you may learn that he (Moses) was commanded to take their census when they began to contribute towards the building of the Tabernacle, after the incident of the golden calf, because the pestilence had befallen them, as it is said, (Exodus 32:35) “and the Lord plagued the people”. A parable: To what may this be compared? To a flock that is dear to its owner upon which there fell pestilence. As soon as it ceased he said to the shepherd, “I beg of you, count my sheep and ascertain how many of them are left”. He did this to show that it (the flock) was dear to him (Midrash Tanchuma, Ki Tisa 9). — It is, however, impossible to say that the census mentioned here is identical with that spoken of in the Book of Numbers (1:1), for there (in Numbers 1:1) Scripture states, “[And God spake to Moses …] on the first day of the second month … [Take ye the sum of all the congregation of the children of Israel etc.]”, whilst the Tabernacle was set up on the first day of the first month as it is said, (Exodus 40:2) “On the first day of the first month shalt thou set up [the Tabernacle etc.]”, and from this census (that mentioned in this paragraph) — from the shekels obtained by it — the sockets used for its boards were made, for it is said, (Exodus 38:27) and of the hundred talents of silver were cast [the sockets of the sanctuary]”. Consequently you learn from this that two censuses were taken, viz., one at the beginning of their contributing towards the Tabernacle, after the Day of Atonement (when Moses first commanded the people to engage in the construction of the Tabernacle; see Rashi on Exodus 33:11, last sentence), in the first year, and the other in the second year, in Iyar, after the Tabernacle had already been set up. If you ask, however: is it at all possible that on both of these occasions the number of the Israelites was exactly the same, viz., 603,550, for in the account of how the silver of those that were numbered of the congregation was used (Exodus 38:27) it is so stated, and in the Book of Numbers (1:46) exactly the same is stated, “Even all they that were numbered were six hundred thousand and three thousand and five hundred and fifty”; were not these censuses taken in two different years, and surely it is impossible that there were not at the time of the first census people nineteen years old who accordingly were not counted and who became twenty years old in the second year when the second census was taken and this must have added to the total?! The reply to this question is: As far as the years of men’s ages are concerned they were counted in the same year, but reckoning from the time of the exodus from Egypt they were two different years in which the censuses were held. For when we speak of a period beginning with the exodus from Egypt, which took place in Nisan, we calculate from Nisan, as we have learned in Treatise Rosh Hashanah 2b. Consequently the Tabernacle was being built in the first year and was erected in the second year, because a new year began on the first of Nisan following the exodus. The years of people’s ages, however, were counted according to the era of the creation of the world which begins with Tishri, consequently from this point of view both censuses took place in the same year: the first in Tishri after the Day of Atonement when the Omnipresent became reconciled with Israel to grant them His pardon and when they received the command regarding the construction of the Tabernacle, and the second on the first of Iyar, so that those who were only 19 years old after the Day of Atonement when the first census was taken, were not yet regarded as twenty in Iyar when the second census was held even though they were born between Tishri and Iyar.<br><br>על עבדת אהל מועד FOR THE SERVICE OF THE APPOINTED TENT — i. e. for the sockets that were made of it (the expiation money)."}, {"ch": 30, "v": 17, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake to Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 18, "aliyah": 1, "heb": "וְעָשִׂ֜יתָ כִּיּ֥וֹר נְחֹ֛שֶׁת וְכַנּ֥וֹ נְחֹ֖שֶׁת לְרׇחְצָ֑ה וְנָתַתָּ֣ אֹת֗וֹ בֵּֽין־אֹ֤הֶל מוֹעֵד֙ וּבֵ֣ין הַמִּזְבֵּ֔חַ וְנָתַתָּ֥ שָׁ֖מָּה מָֽיִם׃", "onk": "וְתַעְבֵּד כִּיּוֹרָא דִנְחָשָׁא וּבְסִיסֵיהּ נְחָשָׁא <b>לְקִדּוּשׁ<\/b> וְתִתֵּן יָתֵיהּ בֵּין מַשְׁכַּן זִמְנָא וּבֵין מַדְבְּחָא וְתִתֵּן תַּמָּן מַיָּא:", "onk_en": "“Make a copper wash basin and its copper base for washing [<b>sanctification<\/b>]; and place it between the Tent of Meeting and the Altar, and put water in it.", "pj": "וְתַעֲבֵיד כִּיּוֹרָא דִנְחָשָׁא וּבְסִיסֵיהּ דִּנְחָשָׁא לְקִדּוּשׁ וּתְסַדֵּר יָתֵיהּ בֵּין מַשְׁכַּן זִימְנָא וּבֵין מַדְבְּחָא וְתִתֵּן תַּמָּן מוֹי", "pj_en": "And thou shalt make a laver of brass, and its foundation of brass, for purification; and shalt set it between the tabernacle of ordinance and the altar, and put water therein.", "tj": "", "tj_en": "", "rashi": "<b>כיור.<\/b> כְּמִין דּוּד גְּדוֹלָה וְלָהּ דַּדִּים הַמְּרִיקִים בְּפִיהֶם מַיִם:<br><br><b>וכנו.<\/b> כְּתַרְגּוּמוֹ בְּסִיסֵהּ, מוֹשָׁב מְתֻקָּן לַכִּיּוֹר:<br><br><b>לרחצה.<\/b> מוּסָב עַל הַכִּיּוֹר:<br><br><b>ובין המזבח.<\/b> מִזְבַּח הָעוֹלָה, שֶׁכָּתוּב בּוֹ שֶׁהוּא לִפְנֵי פֶּתַח מִשְׁכַּן אֹהֶל מוֹעֵד, וְהָיָה הַכִּיּוֹר מָשׁוּךְ קִמְעָא, וְעוֹמֵד כְּנֶגֶד אֲוִיר שֶׁבֵּין הַמִּזְבֵּחַ וְהַמִּשְׁכָּן, וְאֵינוֹ מַפְסִיק כְּלָל בֵּינְתַיִם, מִשּׁוּם שֶׁנֶּאֱמַר וְאֵת מִזְבַּח הָעֹלָה שָׂם פֶּתַח מִשְׁכַּן אֹהֶל מוֹעֵד (שמות מ'), – כְּלוֹמַר מִזְבֵּחַ לִפְנֵי אֹהֶל מוֹעֵד וְאֵין כִּיּוֹר לִפְנֵי אֹהֶל מוֹעֵד, הָא כֵיצַד? מָשׁוּךְ קִמְעָא כְּלַפֵּי הַדָּרוֹם; כָּךְ שְׁנוּיָה בִזְבָחִים:", "rashi_en": "כיור A LAVER — like a large pot with teats which discharged water by the way of their openings.<br><br>וכנו — Understand this as the Targum renders it: בסיסה ITS BASE, i. e. a stand specially made for the laver.<br><br>לרחצה TO LAVE WITHAL — This, of course, refers to the laver and not to the base.<br><br>ובין המזבח BETWEEN [THE APPOINTED TENT AND] THE ALTAR — the altar of burnt offering of which it is written, (Exodus 40:6) that is was to be set “before the entrance of the dwelling of the appointed tent”. The laver was drawn a little to the side and stood facing the open space which was between the altar and the Tabernacle, and it did not stand between them at all because it is stated (Exodus 40:29) “and he put the altar of burnt offering by the entrance of the dwelling of the appointed tent” which implies that the altar was in front of the entrance of the appointed tent, but that the laver was not in front of the entrance of the appointed tent. How was it arranged? It was drawn a little towards the south. Thus is it stated in Treatise Zevachim 59a."}, {"ch": 30, "v": 19, "aliyah": 1, "heb": "וְרָחֲצ֛וּ אַהֲרֹ֥ן וּבָנָ֖יו מִמֶּ֑נּוּ אֶת־יְדֵיהֶ֖ם וְאֶת־רַגְלֵיהֶֽם׃", "onk": "<b>וִיקַדְּשׁוּן<\/b> אַהֲרֹן וּבְנוֹהִי <b>מִנֵּיהּ<\/b> יָת יְדֵיהוֹן וְיָת רַגְלֵיהוֹן:", "onk_en": "Aharon and his sons will wash from it [<b>sanctify<\/b>] their hands and their feet [<b>from it<\/b>].", "pj": "וְיִסְבּוּן מִנֵּיהּ בִּנְטִילָא דַכְיָא וִיקַדְשׁוּן בְּמוֹהִי אַהֲרן וּבְנוֹי יַת יְדֵיהוֹן וְיַת רִיגְלֵיהוֹן", "pj_en": "And they shall take from it for a cleansing ablution. And Aharon and his sons shall sanctify their hands and their feet with its water;", "tj": "", "tj_en": "", "rashi": "<b>את ידיהם ואת רגליהם.<\/b> בְּבַת אַחַת הָיָה מְקַדֵּשׁ יָדָיו וְרַגְלָיו; וְכָךְ שָׁנִינוּ בִזְבָחִים (דף י\"ט); כֵּיצַד קִדּוּשׁ יָדַיִם וְרַגְלַיִם? מַנִּיחַ יָדוֹ הַיְמָנִית עַל גַּבֵּי רַגְלוֹ הַיְמָנִית וְיָדוֹ הַשְּׂמָאלִית עַל גַּבֵּי רַגְלוֹ הַשְּׂמָאלִית וּמְקַדֵּשׁ:", "rashi_en": "את ידיהם ואת רגליהם THEIR HANDS AND THEIR FEET The priest washed his hands and his feet simultaneously. Thus we learn in Zevachim 19b: How was the procedure in washing hands and feet? He placed his right hand upon his right foot (knee) and his left hand upon his left foot (knee) and thus washed both simultaneously."}, {"ch": 30, "v": 20, "aliyah": 1, "heb": "בְּבֹאָ֞ם אֶל־אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ־מַ֖יִם וְלֹ֣א יָמֻ֑תוּ א֣וֹ בְגִשְׁתָּ֤ם אֶל־הַמִּזְבֵּ֙חַ֙ לְשָׁרֵ֔ת לְהַקְטִ֥יר אִשֶּׁ֖ה לַֽיהֹוָֽה׃", "onk": "בְּמֵיעַלְהוֹן לְמַשְׁכַּן זִמְנָא <b>יְקַדְּשׁוּן<\/b> מַיָּא וְלָא יְמוּתוּן אוֹ בְמִקְרָבְהוֹן לְמַדְבְּחָא לְשַׁמָּשָׁא לְאַסָּקָא <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "Before entering the Tent of Meeting they must wash [<b>sanctify<\/b>] with water and they will not die, or whenever they approach the Altar for Divine service, or to burn a fire-offering to [<b>sacrifice before<\/b>] Adonoy.", "pj": "בִּזְמַן מֵיעַלְהוֹן לְמַשְׁכַּן זִימְנָא יְקַדְּשׁוּן מוֹי וְלָא יְמוּתוּן בְּאֵשָׁא מְצַלְהֲבָא אוֹ בְּמִקְרַבְהוֹן לְמַדְבְּחָא לְשַׁמָּשָׁא לְאַסָקָא קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "at the time of their entering into the tabernacle of ordinance they shall sanctify with water, that they die not by the fiery flame ___", "tj": "", "tj_en": "", "rashi": "<b>בבאם אל אהל מועד.<\/b> לְהַקְטִיר שַׁחֲרִית וּבֵין הָעַרְבַּיִם קְטֹרֶת, אוֹ לְהַזּוֹת מִדַּם פַּר כֹּהֵן הַמָּשִׁיחַ וּשְׂעִירֵי עֲ\"זָ:<br><br><b>ולא ימתו.<\/b> הָא אִם לֹא יִרְחֲצוּ יָמוּתוּ, שֶׁבַּתּוֹרָה נֶאֶמְרוּ כְלָלוֹת, וּמִכְלַל לָאו אַתָּה שׁוֹמֵעַ הֵן:<br><br><b>אל המזבח.<\/b> הַחִיצוֹן, שֶׁאֵין כָּאן בִּיאַת אֹהֶל מוֹעֵד אֶלָּא בֶּחָצֵר:", "rashi_en": "בבאם אל אהל מועד WHEN THEY COME INTO THE APPOINTED TENT to burn incense in the morning and at evening, or to sprinkle of the blood of the bullock offered by the anointed High-Priest (Leviticus 4:5, 7) and of the he-goats offered as atonement for the sin of idolatry (all of which services were performed in the interior of the Sanctuary) (Zevachim 19b).<br><br>ולא ימתו THAT THEY DIE NOT — thus it follows that if they do not wash they will die: You may rightly draw this conclusion for in the Torah laws are sometimes stated only by implication: consequently from what is said here in the negative (that they die not) you may derive the positive (that they will die if they do not observe the law here laid down).<br><br>אל המזבח [OR WHEN THEY STEP] NEAR THE ALTAR — i. e. the outer altar, in which case there is no entering into the appointed tent but the service is performed in the court."}, {"ch": 30, "v": 21, "aliyah": 1, "heb": "וְרָחֲצ֛וּ יְדֵיהֶ֥ם וְרַגְלֵיהֶ֖ם וְלֹ֣א יָמֻ֑תוּ וְהָיְתָ֨ה לָהֶ֧ם חׇק־עוֹלָ֛ם ל֥וֹ וּלְזַרְע֖וֹ לְדֹרֹתָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וִיקַדְּשׁוּן<\/b> יְדֵיהוֹן וְרַגְלֵיהוֹן וְלָא יְמוּתוּן וּתְהֵי לְהוֹן קְיָם עָלָם לֵיהּ וְלִבְנוֹהִי לְדָרֵיהוֹן:", "onk_en": "They must wash [<b>sanctify<\/b>] their hands and their feet and they will not die. This is a perpetual statute for them, for him [Aharon] and his descendants for all their generations.”", "pj": "וִיקַדְשׁוּן יְדֵיהוֹן וְרִיגְלֵיהוֹן וְלָא יְמוּתוּן וּתְהֵי לְהוֹן קְיַים עֲלַם לֵיהּ וְלִבְנוֹי לְדָרֵיהוֹן", "pj_en": "____ and it shall be to them an everlasting statute, to him and to his sons in their generations.", "tj": "", "tj_en": "", "rashi": "<b>ולא ימתו.<\/b> לְחַיֵּב מִיתָה עַל הַמְשַׁמֵּשׁ בַּמִּזְבֵּחַ וְאֵינוֹ רְחוּץ יָדַיִם וְרַגְלַיִם, שֶׁהַמִּיתָה הָרִאשׁוֹנָה לֹא שָׁמַעְנוּ אֶלָּא עַל הַנִּכְנָס לַהֵיכָל:", "rashi_en": "ולא ימתו THAT THEY DIE NOT — This statement is intended to declare subject to the death penalty anyone who ministers at the outer altar without having washed his hands and his feet, because from the first mention of “death” (v. 20) we can only infer that one is subject to death for entering the Sanctuary under these circumstances."}, {"ch": 30, "v": 22, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying.", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake to Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 23, "aliyah": 1, "heb": "וְאַתָּ֣ה קַח־לְךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מׇר־דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְקִנְּמׇן־בֶּ֥שֶׂם מַחֲצִית֖וֹ חֲמִשִּׁ֣ים וּמָאתָ֑יִם וּקְנֵה־בֹ֖שֶׂם חֲמִשִּׁ֥ים וּמָאתָֽיִם׃", "onk": "וְאַתְּ סַב לָךְ בּוּסְמִין רֵישָׁא מֵירָא דַכְיָא <b>מַתְקַל<\/b> חֲמֵשׁ מְאָה וְקִנְּמָן בֶּשֶׂם פַּלְגּוּתֵיהּ <b>מַתְקַל<\/b> מָאתָן וְחַמְשִׁין וּקְנֵה בוּסְמָא <b>מַתְקַל<\/b> מָאתָן וְחַמְשִׁין:", "onk_en": "“You shall take the finest spices, [<b>the weight of<\/b>] five hundred [shekels] of pure myrrh, half portions of fragrant cinnamon, [consisting of] [<b>the weight of<\/b>] two hundred and fifty [shekels] each, and [<b>the weight of<\/b>] two hundred and fifty [shekels] of calamus spices.", "pj": "וְאַנְתְּ סַב לָךְ בּוּסְמִין בִּשְׁרוּיָיא מוֹר בְּחִיר מַתְקַל חֲמֵשׁ מְאָה מָנִין וְקִינְמוֹן בּוֹשֶם פַּלְגוּתֵיהּ מַתְקַל מָאתָן וְחַמְשִׁין מָנִין וּקְנֵהּ בּוּשְמָא מַתְקַל מָאתָן וְחַמְשִׁין מָנִין", "pj_en": "And thou also take to thee the first aromatics, choice myrrh, in weight five hundred minas, and sweet cinnamon of half the weight, two hundred and fifty minas,", "tj": "וְאַתְּ סַב לָךְ רֵישֵׁי בּוּסְמָנִין טָבִין מוֹר בְּחִיר תְּקַל חֲמֵשׁ מְאָה דְסַלְעִין:", "tj_en": "And thou take to thee the chief goodly spices, choice myrrh, in weight five hundred minas of shekels.", "rashi": "<b>בשמים ראש.<\/b> חֲשׁוּבִים:<br><br><b>וקנמן בשם.<\/b> לְפִי שֶׁהַקִּנָּמוֹן קְלִפַּת עֵץ הוּא, יֵשׁ שֶׁהוּא טוֹב וְיֵשׁ בּוֹ רֵיחַ טוֹב וְטַעַם, וְיֵשׁ שֶׁאֵינוֹ אֶלָּא כְּעֵץ, לְכָךְ הֻצְרַךְ לוֹמַר קִנְּמָן בֶּשֶׂם – מִן הַטּוֹב:<br><br><b>מחציתו חמשים ומאתים.<\/b> מַחֲצִית הֲבָאָתוֹ תְּהֵא חֲמִשִּׁים וּמָאתַיִם, נִמְצָא כֻלּוֹ חֲמֵשׁ מֵאוֹת, כְּמוֹ שִׁעוּר מָר דְּרוֹר, אִם כֵּן לָמָּה נֶאֱמַר בּוֹ חֲצָאִין, גְּזֵרַת הַכָּתוּב הִיא לַהֲבִיאוֹ לַחֲצָאִין, לְהַרְבּוֹת בּוֹ ב' הַכְרָעוֹת, שֶׁאֵין שׁוֹקְלִין עַיִן בְּעַיִן; וְכָךְ שְׁנוּיָה בְכָרֵתוֹת:<br><br><b>וקנה בשם.<\/b> קָנֶה שֶׁל בֹּשֶׂם; לְפִי שֶׁיֵּשׁ קָנִים שֶׁאֵינָן שֶׁל בֹּשֶׂם הֻצְרַךְ לוֹמַר קְנֵה בֹשֶׂם:<br><br><b>חמשים ומאתים.<\/b> סַךְ מִשְׁקַל כֻּלּוֹ:", "rashi_en": "בשמים ראש PRINCIPAL SPICES — i. e. excellent ones.<br><br>וקנמן בשם AND OF CINNAMON SPICE — Because cinnamon is the bark of a tree there is some of good quality, having fragrance and a pleasant taste and there is some which is merely like wood; Scripture therefore felt itself compelled to state, “Cinnamon בשם — with sweet scent”: of the good species.<br><br>מחציתו חמשים ומאתים [AND OF CINNAMON SPICE] HALF SO MUCH, EVEN TWO HUNDRED AND FIFTY [SHEKELS] — The half of what is to be brought shall be 250 shekels; consequently the whole weight of this species was 500 shekels exactly the same as that of the myrrh. But if this be so, why is it (the quantity to be brought) expressed in halves? It is the ordinance of Scripture that it should be brought in halves only, so that the quantity may be increased by two overweights, for there was no exact balancing of the scales in weighing the spices, but a little was always added. Thus it is stated in Keritot 5a.<br><br>וקנה בשם AND CALAMUS SPICE — i. e. cane of sweet spices. Because there are canes which do not bear sweet spices Scripture had to state (add the word) בֹשֶׂם‎<br><br>חמשים ומאתים TWO HUNDRED AND FIFTY was the amount of its entire weight (not of the half of it as in the case of the preceding ingredient)."}, {"ch": 30, "v": 24, "aliyah": 1, "heb": "וְקִדָּ֕ה חֲמֵ֥שׁ מֵא֖וֹת בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ וְשֶׁ֥מֶן זַ֖יִת הִֽין׃", "onk": "וּקְצִיעֲתָא <b>מַתְקַל<\/b> חֲמֵשׁ מְאָה <b>בְּסִלְעֵי<\/b> קוּדְשָׁא וּמְשַׁח זֵיתָא <b>מְלֵא<\/b> הִינָא:", "onk_en": "[Also take] [<b>the weight of<\/b>] five hundred [shekels] of cassia based on the shekel [<b>sela<\/b>] value of the Holy [Sanctuary], and a [<b>full<\/b>] hin of olive oil.", "pj": "וּקְצִיעָתָא מַתְקַל חֲמֵשׁ מְאָה מָנִין סִילְעִין בְּסִלְעֵי קוּדְשָׁא וּמְשַׁח זֵיתָא מְלֵי קִסְטָא דִסְכוּמֵיהּ תְּרֵיסַר לוּגִין לוּגָא לְכָל שִׁיבְטָא לִתְרֵיסַר שִׁבְטִין", "pj_en": "and sweet calamus in weight two hundred and fifty minas and cassia in weight five hundred minas of shekels, in the shekel of the sanctuary, and olive oil a vase full, in weight twelve logas, a loga for each tribe of the twelve tribes.", "tj": "", "tj_en": "", "rashi": "<b>וקדה.<\/b> שֵׁם שֹׁרֶשׁ עֵשֶׂב, וּבִלְשׁוֹן חֲכָמִים קְצִיעָה:<br><br><b>הין.<\/b> י\"ב לֻגִּין; וְנֶחְלְקוּ בוֹ חַכְמֵי יִשְׂרָאֵל — רַבִּי מֵאִיר אוֹמֵר בּוֹ שָׁלְקוּ אֶת הָעִקָּרִין, אָמַר לוֹ רַ' יְהוּדָה וַהֲלֹא לָסוּךְ אֶת הָעִקָּרִין אֵינוֹ סִפֵּק אֶלָּא שְׁרָאוּם בַּמַּיִם שֶׁלֹּא יִבְלְעוּ אֶת הַשֶּׁמֶן, וְאַחַר כָּךְ הֵצִיף עֲלֵיהֶם הַשֶּׁמֶן עַד שֶׁקָּלַט הָרֵיחַ, וְקִפְּחוֹ לַשֶּׁמֶן מֵעַל הָעִקָּרִין (הוריות י\"א):", "rashi_en": "וקדה AND OF CASSIA [FIVE HUNDRED SHEKEL] — קדה is the name of a root of a certain herb. In the language of our Sages it is called קציעה (cf. Onkelos).<br><br>הין ONE HIN — twelve logs. The Sages in Israel are of different opinions as to the purpose of the oil. R. Meir said: in it the roots were boiled. Whereupon R. Jehuda said to him: Surely it (the quantity of oil) was not sufficient even to smear the roots with it, but they were steeped in water so that, being saturated with it, they should not absorb the oil; the oil was then poured upon them and they were left thus until it (the oil) absorbed their scent and then they skimmed the oil off the roots (Horayot 11b; Keritot 5a)."}, {"ch": 30, "v": 25, "aliyah": 1, "heb": "וְעָשִׂ֣יתָ אֹת֗וֹ שֶׁ֚מֶן מִשְׁחַת־קֹ֔דֶשׁ רֹ֥קַח מִרְקַ֖חַת מַעֲשֵׂ֣ה רֹקֵ֑חַ שֶׁ֥מֶן מִשְׁחַת־קֹ֖דֶשׁ יִהְיֶֽה׃", "onk": "וְתַעְבֵּד יָתֵיהּ מְשַׁח רְבוּת קוּדְשָׁא בּוֹסֶם מְבַסָּם עוֹבַד בּוּסְמָנוּ מְשַׁח רְבוּת קוּדְשָׁא יְהֵא:", "onk_en": "Make it into sacred anointing oil, a blend made by a [perfume] blender. It shall be a sacred anointing oil.", "pj": "וְתַעֲבֵיד יָתֵיהּ מְשַׁח רְבוּת קוּדְשָׁא בּוֹשֶם מִתְבַּשַם עוֹבַד מִתְבַּשֵם בִּישְמָא מַמְזִיג מְשַׁח רְבוּת קוּדְשָׁא יְהֵי", "pj_en": "And thou shalt make of it a holy anointing oil, perfumed with perfume, the work of the perfumer, of compounded perfumes: a holy anointing oil shall it be.", "tj": "", "tj_en": "", "rashi": "<b>רקח מרקחת.<\/b> רֹקַח שֵׁם דָּבָר הוּא, וְהַטַּעַם מוֹכִיחַ, שֶׁהוּא לְמַעְלָה, וַהֲרֵי הוּא כְּמוֹ רֶקַח, רֶגַע; וְאֵינוֹ כְּמוֹ רֹגַע הַיָּם (ישעיהו נ\"א), וּכְמוֹ רֹקַע הָאָרֶץ (שם מלכים ב), שֶׁהַטַּעַם לְמַטָּה; וְכָל דָּבָר הַמְעֹרָב בַּחֲבֵרוֹ עַד שֶׁזֶּה קוֹפֵחַ מִזֶּה אוֹ רֵיחַ אוֹ טַעַם קָרוּי מִרְקַחַת:<br><br><b>רקח מרקחת.<\/b> רֹקַח הֶעָשׂוּי עַ\"יְ אָמָּנוּת וְתַעֲרוֹבוֹת:<br><br><b>מעשה רקח.<\/b> שֵׁם הָאֻמָּן בַּדָּבָר:", "rashi_en": "רקח מרקחת A COMPOUND COMPOUNDED — רקח is a noun and its accent proves it, for it is on the first syllable, on the ר, so that it is a noun just as are רֶקַח in (Song 8:2) “I would cause thee to drink of the mixed wine (מיין הרקח)” and רֶגַע in (Exodus 33:5) “one moment (רֶגַע אחד)”, and it is not a participle like (Isaiah 51:15) “[I am the Lord] who stireth up (רוֹגַע) the sea”, or (Isaiah 42:5) “Who spreadeth forth (רֹקַע) the earth”, where the accent is on the last syllable. Any thing (ingredient) which is mixed with another so thoroughly that one becomes impregnated with the other as regards the smell or the taste is called a מרקחת.<br><br>Thus רקח מרקחת (lit., a mixing of a mixture) means a compounding effected by skilled art and perfect mixing.<br><br>מעשה רקח THE WORK OF A COMPOUNDER — רֹקֵחַ is the name given to a workman skilled in this matter."}, {"ch": 30, "v": 26, "aliyah": 1, "heb": "וּמָשַׁחְתָּ֥ ב֖וֹ אֶת־אֹ֣הֶל מוֹעֵ֑ד וְאֵ֖ת אֲר֥וֹן הָעֵדֻֽת׃", "onk": "וּתְרַבִּי בֵיהּ יָת מַשְׁכַּן זִמְנָא וְיָת אֲרוֹנָא דְסַהֲדוּתָא:", "onk_en": "Anoint with it the Tent of Meeting, and the Ark of the Testimony,", "pj": "וּתְרַבֵּי בֵיהּ יַת מַשְׁכַּן זִימְנָא וְיַת אֲרוֹנָא דְסַהֲדוּתָא", "pj_en": "And with it anoint thou the tabernacle of ordinance, and the ark of the testimony,", "tj": "", "tj_en": "", "rashi": "<b>ומשחת בו.<\/b> כָּל הַמְּשִׁיחוֹת כְּמִין כִי, חוּץ מִשֶּׁל מְלָכִים שֶׁהֵן כְּמִין נֵזֶר (כריתות ה'):", "rashi_en": "ומשחת בו AND THOU SHALT ANOINT WITH IT — All anointings mentioned in Scriptures were made in the form of a Greek X except the anointing of kings which were made round the head like a crown (wreath) (Keritot 5b)."}, {"ch": 30, "v": 27, "aliyah": 1, "heb": "וְאֶת־הַשֻּׁלְחָן֙ וְאֶת־כׇּל־כֵּלָ֔יו וְאֶת־הַמְּנֹרָ֖ה וְאֶת־כֵּלֶ֑יהָ וְאֵ֖ת מִזְבַּ֥ח הַקְּטֹֽרֶת׃", "onk": "וְיָת פָּתוֹרָא וְיָת כָּל מָנוֹהִי וְיָת מְנַרְתָּא וְיָת מָנָהָא וְיָת מַדְבְּחָא דִקְטֹרֶת <b>בּוּסְמַיָּא<\/b>:", "onk_en": "And the Table and all its vessels, and the Menorah and its vessels, and the [<b>Spice<\/b>] Incense Altar,", "pj": "וְיַת פְּתוֹרָא וְיַת כָּל מָנוֹי וְיַת מְנַרְתָּא וְיַת מְנָהָא וְיַת מַדְבְּחָא דִקְטוֹרֶת בּוּסְמַיָא", "pj_en": "and the table and all its vessels, and the candelabrum and its vessels, and the altar of sweet incense,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 28, "aliyah": 1, "heb": "וְאֶת־מִזְבַּ֥ח הָעֹלָ֖ה וְאֶת־כׇּל־כֵּלָ֑יו וְאֶת־הַכִּיֹּ֖ר וְאֶת־כַּנּֽוֹ׃", "onk": "וְיָת מַדְבַּח דַּעֲלָתָא וְיָת כָּל מָנוֹהִי וְיָת כִּיּוֹרָא וְיָת בְּסִיסֵיהּ:", "onk_en": "And the Burnt-offering Altar and all its vessels, and the wash basin and its base.", "pj": "וְיַת מַדְבְּחָא דַעֲלָתָא וְיַת כָּל מָנוֹי וְיַת כִּיּוֹרָא וְיַת בְּסִיסֵיהּ", "pj_en": "and the altar of burnt offering and all its vessels, and the laver and its foundation,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 29, "aliyah": 1, "heb": "וְקִדַּשְׁתָּ֣ אֹתָ֔ם וְהָי֖וּ קֹ֣דֶשׁ קׇֽדָשִׁ֑ים כׇּל־הַנֹּגֵ֥עַ בָּהֶ֖ם יִקְדָּֽשׁ׃", "onk": "וּתְקַדֵּשׁ יָתְהוֹן וִיהוֹן קֹדֶשׁ קוּדְשַׁיָּא כָּל דְּיִקְרַב בְּהוֹן יִתְקַדָּשׁ:", "onk_en": "Sanctify them and they will become holy of holies. Anything that touches them will become holy.", "pj": "וּתְקַדַּשׁ יַתְהוֹן וִיהוֹן קוֹדֶשׁ קוּדְשִׁין כָּל דְּיִקְרַב בְּהוֹן מִן כַּהֲנַיָא יִתְקַדָּשׁ וּמִשְׁאַר שִׁבְטַיָא יְתוּקַד בְּאֵשָׁא מְצַלְהֲבָא קֳדָם יְיָ", "pj_en": "and consecrate them, and they shall be most holy. Every one of the priests who approacheth to them shall be sanctified; but of the rest of the tribes, (whoever toucheth them) shall be consumed by the fiery flame from before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>וקדשת אתם.<\/b> מְשִׁיחָה זוֹ מְקַדַּשְׁתָּם לִהְיוֹת קֹדֶשׁ קָדָשִׁים, וּמַה הִיא קְדֻשָּׁתָם? <b>כל הנגע<\/b> וְגוֹ': כָּל הָרָאוּי לִכְלִי שָׁרֵת, מִשֶּׁנִּכְנַס לְתוֹכוֹ, קָדוֹשׁ קְדֻשַּׁת הַגּוּף – לִפָּסֵל בְּיוֹצֵא וְלִינָה וּטְבוּל יוֹם וְאֵינוֹ נִפְדֶּה לָצֵאת לְחֻלִּין, אֲבָל דָּבָר שֶׁאֵינוֹ רָאוּי לָהֶם אֵין מְקַדְּשִׁין; וּשְׁנוּיָה הִיא מִשְׁנָה שְׁלֵמָה אֵצֶל מִזְבֵּחַ: מִתּוֹךְ שֶׁנֶּ' כָּל הַנֹּגֵעַ בַּמִּזְבֵּחַ יִקְדָּשׁ (שמות כ\"ט), שׁוֹמֵעַ אֲנִי בֵּין רָאוּי בֵּין שֶׁאֵינוֹ רָאוּי, תַּ\"לֹ כְּבָשִׂים, מַה כְּבָשִׂים רְאוּיִים אַף כָּל רָאוּי; כָּל מְשִׁיחַת מִשְׁכָּן וְכֹהֲנִים וּמְלָכִים מְתֻרְגָּם לְשׁוֹן רִבּוּי, לְפִי שֶׁאֵין צֹרֶךְ מְשִׁיחָתָן אֶלָּא לִגְדֻלָּה, כִּי כֵן יִסַּד הַמֶּלֶךְ שֶׁזֶּה חִנּוּךְ גְּדֻלָּתָן, וּשְׁאָר מְשִׁיחוֹת – כְּמוֹ רְקִיקִין מְשׁוּחִין (שם), וְרֵאשִׁית שְׁמָנִים יִמְשָׁחוּ (עמוס ו') – לְשׁוֹן אֲרַמִּית בָּהֶן כִּלְשׁוֹן עִבְרִית:", "rashi_en": "וקדשת אתם AND THOU SHALT SANCTIFY THEM — This anointing (mentioned v. 26) sanctifies them so that they become most holy. And in what consists their holiness? כל הנגע בהם וגו׳ that WHOSOEVER TOUCHETH THEM [SHALL BECOME HOLY]. — Whatever is proper for use in a particular sacred vessel becomes itself holy (more lit., becomes holy with bodily holiness) as soon as it comes into it, so that it becomes invalid as an offering under the following conditions: when after it had been placed in the vessel it had been taken (lit., had gone forth) outside the fore-court, or when it had been left the whole of the night without being placed on the altar, or when it has come into contact with a טבול יום (a person who had been unclean and has taken the ritual immersion but is awaiting sunset to be regarded as clean, as is prescribed in Leviticus 22:7). Moreover it cannot be redeemed by payment of its value to the Temple treasury, thereby to reassume its ordinary character. But whatever is not proper to them (to these vessels) they do not make holy (Zevachim 87a). A similar statement is made in an uncontroverted (Hebrew: perfect) Boraitha (Zevachim 83b) about the hallowing power of the altar: Since it is said, (Exodus 29:37) “Whatsoever toucheth the altar shall become holy”, I might infer that this applies to a thing whether it was fitting to be an offering at the time when it was brought into the Sanctuary or whether it was not fitting; Scripture therefore states immediately afterwards, (Exodus 29:38) “[Now this is that which thou shalt offer upon the altar]; two lambs”. Now how is it in the case of the lambs? They are fitting for the altar! So, also, does the preceding statement, “Whatsoever [touches the altar shall become holy]”, refer only to anything that is fitting (i. e. that was already fitting to be brought upon the altar and became disqualified only after it had been brought into the forecourt of the Sanctuary). — In all cases where the term משח, “to anoint”, is used with reference to the Tabernacle or priests or kings it is rendered by the Targum by the appropriate form of the verb רבה, “to raise to high rank”, “to distinguish”, because the anointing of them had no other purpose than to show the distinction that was being bestowed upon them. For thus did the Heavenly King ordain (Rashi uses here the words of the text, (Esther 1:9) that this should constitute their installation in their high office. In any other case, however, where משח is used, — for instance, (Exodus 29:2) “wafers [unleavened] משוחים with oil”; (Amos 6:6) “and with the chief ointments ימשחו” — the Aramaic expression for them in the Targum is the same term as the Hebrew text, viz., a form of משח; (because in these passages anointing is an end in itself, whilst in the former case it is an indication only of elevation to a distinguished position)."}, {"ch": 30, "v": 30, "aliyah": 1, "heb": "וְאֶת־אַהֲרֹ֥ן וְאֶת־בָּנָ֖יו תִּמְשָׁ֑ח וְקִדַּשְׁתָּ֥ אֹתָ֖ם לְכַהֵ֥ן לִֽי׃", "onk": "וְיָת אַהֲרֹן וְיָת בְּנוֹהִי תְּרַבִּי וּתְקַדֵּשׁ יָתְהוֹן לְשַׁמָּשָׁא <b>קֳדָמַי<\/b>:", "onk_en": "You shall also anoint Aharon and his sons, and sanctify them to serve [<b>before<\/b>] Me as kohanim.”", "pj": "וְיַת אַהֲרן וְיַת בְּנוֹי תְרַבֵּי וּתְקַדֵּשׁ יַתְהוֹן לְשַׁמָּשָׁא קֳדָמַי", "pj_en": "But Aharon and his sons anoint thou, and consecrate them to minister before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 31, "aliyah": 1, "heb": "וְאֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵאמֹ֑ר שֶׁ֠מֶן מִשְׁחַת־קֹ֨דֶשׁ יִהְיֶ֥ה זֶ֛ה לִ֖י לְדֹרֹתֵיכֶֽם׃", "onk": "וְעִם בְּנֵי יִשְׂרָאֵל תְּמַלֵּל לְמֵימָר מְשַׁח רְבוּת קוּדְשָׁא יְהֵי דֵין <b>קֳדָמַי<\/b> לְדָרֵיכוֹן:", "onk_en": "Speak to the B’nei Yisrael, saying: “This shall be sacred anointing oil to [<b>before<\/b>] Me for all your generations.", "pj": "וְעִם בְּנֵי יִשְרָאֵל תְּמַלֵּיל לְמֵימָר מְשַׁח רְבוּת קוּדְשָׁא יְהֵי דֵין קֳדָמַי לְדָרֵיכוֹן", "pj_en": "And speak thou to the sons of Israel, saying, This shall be a holy anointing oil before Me unto your generations.", "tj": "", "tj_en": "", "rashi": "<b>לדרתיכם.<\/b> מִכָּאן לָמְדוּ רַבּוֹתֵינוּ לוֹמַר שֶׁכֻּלּוֹ קַיָּם לֶעָתִיד לָבֹא:<br><br><b>זה.<\/b> בְּגִימַטְרִיָּא תְּרֵיסַר לֻגִּין הֲווּ (כריתות ה'):", "rashi_en": "לדרתיכם THROUGHOUT YOUR GENERATIONS — From here our Rabbis derived that it (the oil of anointment) was miraculously preserved in its entirety for the time to come (for the Messianic days) (Horayot 11b).<br><br>זה has the numerical value of 12, alluding to the 12 “logs” which was the measure for the oil of anointment (Horayot 11b; cf. Rashi v. 24)."}, {"ch": 30, "v": 32, "aliyah": 1, "heb": "עַל־בְּשַׂ֤ר אָדָם֙ לֹ֣א יִיסָ֔ךְ וּ֨בְמַתְכֻּנְתּ֔וֹ לֹ֥א תַעֲשׂ֖וּ כָּמֹ֑הוּ קֹ֣דֶשׁ ה֔וּא קֹ֖דֶשׁ יִהְיֶ֥ה לָכֶֽם׃", "onk": "עַל בִּסְרָא דַאֲנָשָׁא לָא יִתְנַסַּךְ <b>וּבִדְמוּתֵיהּ<\/b> לָא תַעְבְּדוּן כְּוָתֵיהּ קוּדְשָׁא הוּא קוּדְשָׁא יְהֵי לְכוֹן:", "onk_en": "It must not be poured on the flesh of any man, and its formula [<b>likeness<\/b>] must not be duplicated. It is sacred. It must be sacred to you.", "pj": "עַל בִּישְרָא דְּאֵינָשָׁא לָא יִתְמְרַק וְכִדְמוּיֵיהּ לָא תַעַבְדוּן כְּוָותֵיהּ קוּדְשָׁא הוּא קוּדְשָׁא יְהֵי לְכוֹן", "pj_en": "Upon the flesh of man it may not be poured, and the like of it you shall not make to resemble it; unto you it shall be most sacred.", "tj": "", "tj_en": "", "rashi": "<b>לא ייסך.<\/b> בִּשְׁנֵי יוֹדִי\"ן, לְשׁוֹן לֹא יִפְעַל, כְּמוֹ (דברים ה טו) לְמַעַן יִיטַב לָךְ:<br><br><b>על בשר אדם לא ייסך.<\/b> מִן הַשֶּׁמֶן הַזֶּה עַצְמוֹ:<br><br><b>ובמתכנתו לא תעשו כמהו.<\/b> בִּסְכוּם סַמָּנָיו לֹא תַּעֲשׂוּ אַחֵר כָּמוֹהוּ בְּמִשְׁקַל סַמָּנִין הַלָּלוּ לְפִי מִדַּת הִין שֶׁמֶן, אֲבָל אִם פָּחַת אוֹ רִבָּה סַמְמָנִין לְפִי מִדַּת הִין שֶׁמֶן מֻתָּר, וְאַף הֶעָשׂוּי בְּמַתְכֻּנְתּוֹ שֶׁל זֶה, אֵין הַסָּךְ מִמֶּנּוּ חַיָּב אֶלָּא הָרוֹקְחוֹ:<br><br><b>ובמתכנתו.<\/b> לְשׁוֹן חֶשְׁבּוֹן, כְּמוֹ (שמות ה ח) מַתְכֹּנֶת הַלְּבֵנִים, וְכֵן בְּמַתְכֻּנְתָּהּ שֶׁל קְטֹרֶת:", "rashi_en": "לא ייסך with two “yods” has the meaning “he shall not do something” (i. e. it is 3rd person masc. sing. Kal), similar to ייטב in (Deuteronomy 6:18) “that it may be well (ייטב) with thee”.<br><br>על בשר אדם לא ייסך UPON MAN’S FLESH SHALL IT NOT BE POURED — anything from that selfsame oil (which Moses had prepared).<br><br>ובמתכנתו לא תעשו כמהו AND ACCORDING TO ITS PROPORTION YE SHALL NOT MAKE ANY LIKE IT — In regard to the quantities of its spices ye shall not make any other oil like it — i. e. in regard to the weights of these spices in proportion to the measure of a hin of oil; but if one uses less or more of these spices in proportion to the measure of a hin of oil, it is permitted to do so. And even if it is made in the same proportions as this (the oil made by Moses) it is not the one who anoints himself with it that is punishable (for this applies only to one who anoints himself with the oil made by Moses) but he who compounds it (Keritot 5a).<br><br>ובמתכנתו is a term denoting amount, as (Exodus 5:8) “the quantity (מתכנת) of bricks”. Similar is the word מתכנת used of the incense (v. 37)."}, {"ch": 30, "v": 33, "aliyah": 1, "heb": "אִ֚ישׁ אֲשֶׁ֣ר יִרְקַ֣ח כָּמֹ֔הוּ וַאֲשֶׁ֥ר יִתֵּ֛ן מִמֶּ֖נּוּ עַל־זָ֑ר וְנִכְרַ֖ת מֵעַמָּֽיו׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "גְּבַר דִּי יְבַסַּם דִּכְוָתֵיהּ וְדִי יִתֵּן מִנֵּיהּ עַל חִלּוֹנָי וְיִשְׁתֵּצֵי מֵעַמֵּיהּ:", "onk_en": "If a person compounds a similar formula, or if he places from it upon an unauthorized person, he shall be cut off [spiritually] from his people.", "pj": "גְבַר דִּי יִמְזָג כְּוָותֵיהּ וּדְיִתֵּן מִינָהּ עַל חִילוֹנֵי דְלָא מִבְּנוֹי דְאַהֲרן וְיִשְׁתֵּיצֵי מֵעַמֵּיהּ", "pj_en": "The man who compoundeth the like of it, or putteth it upon the unconsecrated who are not of the sons of Aharon, shall be destroyed from his people.", "tj": "", "tj_en": "", "rashi": "<b>ואשר יתן ממנו.<\/b> מֵאוֹתוֹ שֶׁל מֹשֶׁה:<br><br><b>על זר.<\/b> שֶׁאֵינוֹ צֹרֶךְ כְּהֻנָּה וּמַלְכוּת:", "rashi_en": "ואשר יתן ממנו WHOSOEVER PUTTETH ANY OF IT — of that made by Moses (Keritot 5a)<br><br>על זר UPON A STRANGER — when it is not required for installing a person into the high-priesthood or kingdom (Keritot 5b)."}, {"ch": 30, "v": 34, "aliyah": 1, "heb": "וַיֹּ֩אמֶר֩ יְהֹוָ֨ה אֶל־מֹשֶׁ֜ה קַח־לְךָ֣ סַמִּ֗ים נָטָ֤ף&thinsp;<small>׀<\/small>&thinsp;וּשְׁחֵ֙לֶת֙ וְחֶלְבְּנָ֔ה סַמִּ֖ים וּלְבֹנָ֣ה זַכָּ֑ה בַּ֥ד בְּבַ֖ד יִהְיֶֽה׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה סַב לָךְ בּוּסְמִין נְטוֹפָא וְטוּפְרָא וְחֶלְבְּנֵתָא בּוּסְמִין וּלְבוּנְתָא דָכִיתָא מַתְקַל בְּמַתְקַל יְהֵי:", "onk_en": "Adonoy said to Moshe, Take for yourself spices, stacte, onycha and galbanum, spices and pure frankincense. They shall be of equal weight.", "pj": "וַאֲמַר יְיָ לְמשֶׁה סַב לָךְ בּוּסְמֵי קְטַף וּבְשַׁת וְחֶלְבָּנַיָא בּוּסְמִין בְּחִירִין דַּכְיָיתָא מַתְקַל בְּמַתְקַל יְהֵי", "pj_en": "And the Lord said to Mosheh, Take to thee spices, balsam, and onycha, and galbanum, choice spices, and pure frankincense, weight for weight shall it be.", "tj": "קְטַף וְשׁוּבְלָא מוֹרַיָיא וְחֶלְבָּנַיָיא:", "tj_en": "Balsam, spikenard-myrrh, and galbanum.  Commixed.", "rashi": "<b>נטף.<\/b> הוּא צֳרִי, וְעַל שֶׁאֵינוֹ אֶלָּא שְׂרָף הַנּוֹטֵף מֵעֲצֵי הַקְּטָף קָרוּי נָטָף, וּבְלַעַז גומ\"א, וְהַצֳּרִי קוֹרִין לוֹ טרי\"אקה:<br><br><b>ושחלת.<\/b> שֹׁרֶשׁ בֹּשֶׁם חָלָק וּמַצְהִיר כְּצִּפֹּרֶן, וּבִלְשׁוֹן הַמִּשְׁנָה קָרוּי צִפֹּרֶן, וְזֶהוּ שֶׁתִּרְגֵּם אֻנְקְלוֹס וְטוּפְרָא:<br><br><b>וחלבנה.<\/b> בֹּשֶׂם שֶׁרֵיחוֹ רַע, וְקוֹרִין לוֹ גַלְבְּנָא, וּמְנָאָהּ הַכָּתוּב בֵּין סַמָּנֵי הַקְּטֹרֶת לְלַמְּדֵנוּ שֶׁלֹּא יֵקַל בְּעֵינֵינוּ לְצָרֵף עִמָּנוּ בַּאֲגֻדַּת תַּעֲנִיּוֹתֵינוּ וּתְפִלּוֹתֵנוּ אֶת פּוֹשְׁעֵי יִשְׂרָאֵל שֶׁיִּהְיוּ נִמְנִין עִמָּנוּ:<br><br><b>סמים.<\/b> אֲחֵרִים:<br><br><b>ולבנה זכה.<\/b> מִכָּאן לָמְדוּ רַבּוֹתֵינוּ י\"א סַמָּנִין נֶאֶמְרוּ לוֹ לְמֹשֶׁה בְּסִינַי – מִעוּט סַמִּים שְׁנַיִם, נָטָף וּשְׁחֵלֶת וְחֶלְבְּנָה ג', הֲרֵי חֲמִשָּׁה, סַמִּים לְרַבּוֹת עוֹד כְּמוֹ אֵלּוּ הֲרֵי עֲשָׂרָה, וּלְבוֹנָה הֲרֵי י\"א; וְאֵלּוּ הֵן הַצֳּרִי וְהַצִּפֹּרֶן הַחֶלְבְּנָה וְהַלְּבוֹנָה מֹר וּקְצִיעָה שִׁבֹּלֶת נֵרְדְּ וְכַרְכֹּם הֲרֵי ח' – שֶׁהַשִּׁבֹּלֶת וְנֵרְדְּ אֶחָד, שֶׁהַנֵּרְדְּ דּוֹמֶה לְשִׁבֹּלֶת – הַקֹּשְׁטְ וְהַקִּלּוּפָה וְקִנָּמוֹן הֲרֵי י\"א; בֹּרִית כַּרְשִׁינָה אֵינוֹ נִקְטָר אֶלָּא בּוֹ שָׁפִין אֶת הַצִּפֹּרֶן לְלַבְּנָהּ שֶׁתְּהֵא נָאָה (כריתות ו'):<br><br><b>בד בבד יהיה.<\/b> אֵלּוּ הָאַרְבָּעָה הַנִּזְכָּרִים כָּאן יִהְיוּ שָׁוִין מִשְׁקָל בְּמִשְׁקָל – כְּמִשְׁקָלוֹ שֶׁל זֶה כָּךְ מִשְׁקָלוֹ שֶׁל זֶה – וְכֵן שָׁנִינוּ: הַצֳּרִי וְהַצִּפֹּרֶן הַחֶלְבְּנָה וְהַלְּבוֹנָה מִשְׁקַל שִׁבְעִים שִׁבְעִים מָנֶה (שם); וּלְשׁוֹן בַּד נִרְאֶה בְעֵינַי שֶׁהוּא לְשׁוֹן יָחִיד, אֶחָד בְּאֶחָד יִהְיוּ – זֶה כְּמוֹת זֶה:", "rashi_en": "נטף is balsam. Because it is merely the sap which drips from the wood of the balsam tree it is called נטף, “dripping” (Keritot 6a). In old French it is called gomme; English gum. The balm itself, however, is called thériaque (cf., however, Ramban).<br><br>ושחלת AND ONYCHA This is a root of a fragrant herb, smooth and transparent like a fingernail, In the language of the Mishna it is called צפורן, a nail (cf. Keritot 6a). This is exactly how Onkelos renders it: וטופרא, which is the Aramaic word corresponding to the Hebrew צפורן‎.<br><br>וחלבנה — This is a malodorous spice which is called galbanum. Scripture enumerates it among the spices of the incense to teach us that we should not regard as a light thing the duty of associating with ourselves when we band together for fasts and prayers Israelites who are transgressors — that they should be counted as ourselves (Keritot 6b).<br><br>סמים means other SPICES also.<br><br>ולבנה זכה AND PURE FRANKINCENSE — From here our Rabbis learned that eleven spices were mentioned to Moses on Sinai (a technical term, like הלכה למשה מסיני) as the ingredients of the incense. For the least number implied by the plural סמים is two; balsam, onycha and galbanum are three, making together five. The word סמים that follows (without stating any number) is intended to add a similar number as these already prescribed, viz., five, making ten, and frankincense makes eleven. They are the following: balm, onycha, galbanum, frankincense, myrrh, cassia, spikenard and saffron, altogether eight — for שבלת and נרד are one, it being given this compound name only because the nard resembles a שבלת, a spike, — costus, aromatic bark and cinnamon, altogether eleven. “Borith karshina” (lye obtained from a species of vetch) which is also mentioned in Keritotot 6a in connection with the ingredients of the incense was not burnt itself as incense, but the onycha was rubbed with it in order to whiten it — that it should be (look) better (Keritot 6a).<br><br>בד בבד יהיה means, these four ingredients mentioned here shall be equal, weight for weight — as the weight of one so shall be the weight of another. Thus indeed we learn (Keritot 6a): the balm, the onycha, the galbanum and the frankincense shall each have the weight of seventy manehs. The term בד seems to me to mean “a single article” (cf. בָּדָד, לְבַד) – they shall be “one equal with one”: they shall be the one the same as the other."}, {"ch": 30, "v": 35, "aliyah": 1, "heb": "וְעָשִׂ֤יתָ אֹתָהּ֙ קְטֹ֔רֶת רֹ֖קַח מַעֲשֵׂ֣ה רוֹקֵ֑חַ מְמֻלָּ֖ח טָה֥וֹר קֹֽדֶשׁ׃", "onk": "וְתַעְבֵּד יָתַהּ קְטֹרֶת <b>בּוּסְמִין<\/b> בּוֹסֶם עוֹבַד בּוּסְמָנוּ מְעָרַב דְּכֵי קוּדְשָׁא:", "onk_en": "Make it into incense [<b>spice<\/b>], a blend blended by a blender, thoroughly blended, pure and holy.", "pj": "וְתַעֲבֵיד יָתֵיהּ קְטוֹרֶת בּוּסְמָנָן בּוֹשֶם עוֹבַד מַמְזִיג מְעַרֵב דְּכֵי קוּדְשָׁא", "pj_en": "And confect therewith a fragrant incense, the work of the compounder, a pure and sacred mixture.", "tj": "", "tj_en": "", "rashi": "<b>ממלח.<\/b> כְּתַרְגּוּמוֹ מְעֹרָב, שֶׁיְּעָרֵב שְׁחִיקָתָן יָפֶה יָפֶה זֶה עִם זֶה; וְאוֹמֵר אֲנִי שֶׁדּוֹמֶה לוֹ וַיִּירְאוּ הַמַּלָּחִים (יונה א'), מַלָּחַיִךְ וְחֹבְלָיִךְ (יחזקאל כ\"ז) – עַל שֵׁם שֶׁמְּהַפְּכִין אֶת הַמַּיִם בִּמְשׁוֹטוֹת כְּשֶׁמַּנְהִיגִים אֶת הַסְּפִינָה, כְּאָדָם הַמְהַפֵּךְ בְּכַף בֵּיצִים טְרוּפוֹת לְעָרְבָן עִם הַמַּיִם, וְכָל דָּבָר שֶׁאָדָם רוֹצֶה לְעָרֵב יָפֶה יָפֶה מְהַפְּכוֹ בְּאֶצְבַּע אוֹ בְּבָזֵךְ:<br><br><b>ממלח טהור קדש.<\/b> מְמֻלָּח יִהְיֶה, וְטָהוֹר יִהְיֶה וְקֹדֶשׁ יִהְיֶה:", "rashi_en": "ממלח TEMPERED TOGETHER — Understand this as the Targum renders it: מעורב, mixed — that they should thoroughly intermix the powder of the ingredients. I think that similar in meaning to it are the nouns in (Jona 1:5) “Then the mariners (המלחים) were afraid”; (Ezekiel 27:27) “thy mariners (מלחיך) and thy pilots”, who are so called because they turn over (stir up) the water with oars when they propel the ship — like a person who stirs up beaten eggs with a spoon in order to mix them with water. Anything that a person wishes to mix up thoroughly he stirs up with his finger or with a spoon.<br><br>ממלח טהור קדש TEMPERED TOGETHER, PURE AND HOLY — i. e. tempered together shall it (the compound) be, pure shall it be, and holy shall it be."}, {"ch": 30, "v": 36, "aliyah": 1, "heb": "וְשָֽׁחַקְתָּ֣ מִמֶּ֘נָּה֮ הָדֵק֒ וְנָתַתָּ֨ה מִמֶּ֜נָּה לִפְנֵ֤י הָעֵדֻת֙ בְּאֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֛ר אִוָּעֵ֥ד לְךָ֖ שָׁ֑מָּה קֹ֥דֶשׁ קׇֽדָשִׁ֖ים תִּהְיֶ֥ה לָכֶֽם׃", "onk": "וְתִשְׁחוֹק מִנַּהּ וְתַדִּיק וְתִתֵּן מִנַּהּ קֳדָם סַהֲדוּתָא בְּמַשְׁכַּן זִמְנָא דִּי אֱזַמֵּן מֵימְרִי לָךְ תַּמָּן קֹדֶשׁ קוּדְשִׁין תְּהֵי לְכוֹן:", "onk_en": "Pulverize some of it very finely and place it before the [Ark of] Testimony in the Tent of Meeting, where I will meet [<b>prepare My Word<\/b>] with you. It shall be holy of holies to you.", "pj": "וְתִכְתּוֹשׁ מִינָהּ וְתָדִיק וְתִתֵּן מִינָהּ קֳדָם סַהֲדוּתָא בְּמַשְׁכַּן זִימְנָא דְּאֵיזַמִין מֵימְרִי לָךְ תַּמָּן קוֹדֶשׁ קוּדְשִׁין תְּהֵא לְכוֹן", "pj_en": "And beat, and make it small, and of it some shalt thou put before the testimony in the tabernacle of ordinance, where I will appoint My Word to be with thee. Most sacred shall it be to you.", "tj": "", "tj_en": "", "rashi": "<b>ונתתה ממנה וגו'.<\/b> הִיא קְטֹרֶת שֶׁבְּכָל יוֹם וָיוֹם שֶׁעַל מִזְבֵּחַ הַפְּנִימִי שֶׁהוּא בְאֹהֶל מוֹעֵד:<br><br><b>אשר אועד לך שמה.<\/b> כָּל מוֹעֲדֵי דִּבּוּר שֶׁאֶקְבַּע לְךָ, אֲנִי קוֹבְעָם לְאוֹתוֹ מָקוֹם:", "rashi_en": "ונתת ממנה וגו׳ AND THOU SHALT PUT OF IT [BEFORE THE TESTIMONY IN THE APPOINTED TENT] — This refers to the incense which was burnt daily on the inner altar that was in the tent of meeting.<br><br>אשר אועד לך שמה WHERE I WILL BE MET BY THEE — All appointments for the purpose of speaking unto you which I shall make with you I shall confine to that place (cf. Rashi on Exodus 25:22)."}, {"ch": 30, "v": 37, "aliyah": 1, "heb": "וְהַקְּטֹ֙רֶת֙ אֲשֶׁ֣ר תַּעֲשֶׂ֔ה בְּמַ֨תְכֻּנְתָּ֔הּ לֹ֥א תַעֲשׂ֖וּ לָכֶ֑ם קֹ֛דֶשׁ תִּהְיֶ֥ה לְךָ֖ לַיהֹוָֽה׃", "onk": "וּקְטֹרֶת <b>בּוּסְמִין<\/b> דִּי תַעְבֵּד <b>בִּדְמוּתָהּ<\/b> לָא תַעְבְּדוּן לְכוֹן קוּדְשָׁא תְּהֵי לָךְ <b>קֳדָם<\/b> יְיָ:", "onk_en": "The incense [<b>spice<\/b>] you are making, its formula [<b>likeness<\/b>] must not be duplicated for you[r use]. It shall be sacred to you for [<b>before<\/b>] Adonoy.", "pj": "וּקְטוֹרֶת בּוּסְמִין דְּתַעֲבֵיד בִּדְמוּיָיהּ לָא תַעַבְּדוּן לְכוֹן קוּדְשָׁא תְּהֵא לְכוֹן קֳדָם יְיָ", "pj_en": "And of the sweet incense thou shalt make, the like shall not be made among you; it shall be sacred to you before the Lord:", "tj": "", "tj_en": "", "rashi": "<b>במתכנתה.<\/b> בְּמִנְיַן סַמְמָנֶיהָ:<br><br><b>קדש תהיה לך לה'.<\/b> שֶׁלֹּא תַעֲשֶׂנָּה אֶלָּא לִשְׁמִי:", "rashi_en": "במתכנתה means, according to the quantity of spices used by Moses.<br><br>‘קדש תהיה לך לה IT SHALL BE UNTO THEE HOLINESS FOR THE LORD — This means that you must not make it except in honour of My Name."}, {"ch": 30, "v": 38, "aliyah": 1, "heb": "אִ֛ישׁ אֲשֶׁר־יַעֲשֶׂ֥ה כָמ֖וֹהָ לְהָרִ֣יחַ בָּ֑הּ וְנִכְרַ֖ת מֵעַמָּֽיו׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "גְּבַר דְיַעְבֵּד דִּכְוָתַהּ לַאֲרָחָא בַהּ וְיִשְׁתֵּצֵי מֵעַמֵּיהּ:", "onk_en": "A person who duplicates this formula to enjoy its fragrance, shall be cut off [spiritually] from his people.”", "pj": "גְּבַר דְּיַעֲבֵיד דִּכְוָותֵיהּ לְאָרָחָא בָהּ וְיִשְׁתְּצֵי מֵעַמֵּיהּ", "pj_en": "the man who maketh the like of it to smell thereto shall be destroyed from his people.", "tj": "", "tj_en": "", "rashi": "<b>להריח בה.<\/b> אֲבָל עוֹשֶׂה אַתָּה בְּמַתְכֻּנְתָּהּ מִשֶּׁלְּךָ, כְּדֵי לְמָכְרָהּ לַצִּבּוּר (כריתות ה'):", "rashi_en": "להריח בה [WHOSOEVER SHALL MAKE LIKE UNTO THAT] TO SMELL THERETO [SHALL BE CUT OFF] — but you may make some according to these quantities of your own spices for the purpose of selling it to the community (cf. Keritot 5a)."}, {"ch": 31, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying,", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord Spake with Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 2, "aliyah": 1, "heb": "רְאֵ֖ה קָרָ֣אתִֽי בְשֵׁ֑ם בְּצַלְאֵ֛ל בֶּן־אוּרִ֥י בֶן־ח֖וּר לְמַטֵּ֥ה יְהוּדָֽה׃", "onk": "חֲזֵי <b>דְרַבֵּיתִי<\/b> בְשׁוּם בְּצַלְאֵל בַּר אוּרִי בַר חוּר לְשִׁבְטָא דִיהוּדָה:", "onk_en": "“I have called [<b>exalted<\/b>] by name [designated] Betzalel, son of Uri son of Chur, of the tribe of Yehudah.", "pj": "חֲמֵי משֶׁה דְּקַרְיַית בְּשׁוּם טַב בְּצַלְאֵל בַּר אוּרִי בַּר חוּר לְשִׁבְטָא דִיהוּדָה", "pj_en": "Look, Mosheh, I have called by name the good Bezalel: bar Uri bar Hur, of the tribe of Jehudah,", "tj": "חָמֵי משֶׁה הָא רַבְיַית וְקַרְיַית בְּשֵׁם טַב בְּצַלְאֵל:", "tj_en": "See, Mosheh, behold, I have anointed and called by a good name Bezalel.", "rashi": "<b>קראתי בשם –.<\/b> לַעֲשׂוֹת מְלַאכְתִּי – אֶת בְּצַלְאֵל:", "rashi_en": "קראתי בשם I HAVE CALLED BY NAME — to accomplish My work — BEZALEL."}, {"ch": 31, "v": 3, "aliyah": 1, "heb": "וָאֲמַלֵּ֥א אֹת֖וֹ ר֣וּחַ אֱלֹהִ֑ים בְּחׇכְמָ֛ה וּבִתְבוּנָ֥ה וּבְדַ֖עַת וּבְכׇל־מְלָאכָֽה׃", "onk": "וְאַשְׁלֵמִית עִמֵּיהּ רוּחַ <b>מִן קֳדָם יְיָ<\/b> בְּחָכְמְתָא וּבְסוּכְלְתָנוּ וּבְמַדַּע וּבְכָל עִבִידָא:", "onk_en": "I have filled him with Divine spirit [<b>from before Elohim<\/b>], with wisdom, with understanding, with knowledge, and with [the skill to perform] all types of crafting,", "pj": "וְאַשְׁלֵמִית עִמֵּיהּ רוּחַ קוּדְשָׁא מִן קֳדָם יְיָ בְּחָכְמָתָא בְּסוּכְלְתָנוּ וּבְמַנְדְּעָא וּבְכָל עִיבִידְתָּא", "pj_en": "and have fulfilled him with the Spirit of holiness from before the Lord, in wisdom and in intelligence, in knowledge, and in all workmanship;", "tj": "", "tj_en": "", "rashi": "<b>חכמה.<\/b> מַה שֶּׁאָדָם שׁוֹמֵעַ מֵאֲחֵרִים וְלָמֵד:<br><br><b>תבונה.<\/b> מֵבִין דָּבָר מִלִּבּוֹ מִתּוֹךְ דְּבָרִים שֶׁלָּמַד:<br><br><b>דעת.<\/b> רוּחַ הַקֹּדֶשׁ:", "rashi_en": "חכמה WISDOM is what a person hears from others and learns (makes his own).<br><br>תבונה UNDERSTANDING is understanding a matter by one’s own intelligence deducing it from the things one has already learned.<br><br>דעת means holy inspiration."}, {"ch": 31, "v": 4, "aliyah": 1, "heb": "לַחְשֹׁ֖ב מַחֲשָׁבֹ֑ת לַעֲשׂ֛וֹת בַּזָּהָ֥ב וּבַכֶּ֖סֶף וּבַנְּחֹֽשֶׁת׃", "onk": "<b>לְאַלָּפָא אוּמַנְוָן<\/b> לְמֶעְבַּד בְּדַהֲבָא וּבְכַסְפָּא וּבִנְחָשָׁא:", "onk_en": "to devise plans [<b>teach craftsmanship<\/b>] to work in gold, in silver, and in copper,", "pj": "לְמֵיחְשַׁב בְּרַעֲיוֹנֵיהוֹן הֵיךְ לְמֶעֱבַד בְּדַהֲבָא וּבְכַסְפָּא וּבִנְחָשָׁא", "pj_en": "to think in their thoughts so as to work (perfectly) in gold, and in silver, and in brass;", "tj": "", "tj_en": "", "rashi": "<b>לחשב מחשבת.<\/b> אֲרִיגַת מַעֲשֵׂה חֹשֵׁב:", "rashi_en": "לחשב מחשבה lit., TO DEVISE DEVICES — this refers to the weaving of an artist’s work."}, {"ch": 31, "v": 5, "aliyah": 1, "heb": "וּבַחֲרֹ֥שֶׁת אֶ֛בֶן לְמַלֹּ֖את וּבַחֲרֹ֣שֶׁת עֵ֑ץ לַעֲשׂ֖וֹת בְּכׇל־מְלָאכָֽה׃", "onk": "וּבְאָמָנוּת אֶבֶן <b>טָבָא<\/b> לְאַשְׁלָמָא וּבְנַגָּרוּת אָעָא לְמֶעְבַּד בְּכָל עִבִידָא:", "onk_en": "to cut [<b>precious<\/b>] stones for setting, to carve wood, and to work in all types of crafting.", "pj": "וּבְאַגְלָפוּת מַרְגְּלִיתָא לְאַשְׁלָמָא וּבְנַגָרוֹת קִיסָא לְמֶעֱבַד כָּל עִיבִידְתָּא", "pj_en": "and in the cutting of jewels for their insetting, and in the carving of woods, to make all manner of work.", "tj": "", "tj_en": "", "rashi": "<b>ובחרשת.<\/b> לְשׁוֹן אָמָּנוּת, כְּמוֹ חָרָשׁ חָכָם (ישעיהו מ'), וְאֻנְקְלוֹס פֵּרֵשׁ, וְשִׁנָּה בְּפֵרוּשָׁן, שֶׁחָרַשׁ אֲבָנִים קָרוּי אָמָּן וְחָרַשׁ עֵץ קָרוּי נַגָּר:<br><br><b>למלאת.<\/b> לְהוֹשִׁיבָהּ בְּמִשְׁבֶּצֶת שֶׁלָּהּ בְּמִלּוּאָהּ – לַעֲשׂוֹת הַמִּשְׁבֶּצֶת לְמִדַּת מוֹשַׁב הָאֶבֶן וְעָבְיָהּ:", "rashi_en": "ובחרשת denotes artisanship generally, as (Isaiah 40:20) “a clever artisan (חרש חכם)”. Onkelos, however, more closely defines the term each time it occurs in this verse and varies the definition he gives of them: the first he renders by אמנות and the second by נגרות, because the lapidary is called in Aramaic אמן, whilst the worker in wood is called נגר, and he therefore uses the abstract forms of these nouns to specify the particular kind of artisanship here intended.<br><br>למלאת TO SET IN — i. e. to put it into its setting, so as to fill it in (למלאת) by making the setting according to the size of the bottom of the stones and its thickness."}, {"ch": 31, "v": 6, "aliyah": 1, "heb": "וַאֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗וֹ אֵ֣ת אׇהֳלִיאָ֞ב בֶּן־אֲחִֽיסָמָךְ֙ לְמַטֵּה־דָ֔ן וּבְלֵ֥ב כׇּל־חֲכַם־לֵ֖ב נָתַ֣תִּי חׇכְמָ֑ה וְעָשׂ֕וּ אֵ֖ת כׇּל־אֲשֶׁ֥ר צִוִּיתִֽךָ׃", "onk": "וַאֲנָא הָא יְהָבִית עִמֵּיהּ יָת אָהֳלִיאָב בַּר אֲחִיסָמָךְ לְשִׁבְטָא דְדָן וּבְלִבָּא כָל חַכִּימֵי לִבָּא יְהָבִית חָכְמְתָא וְיַעְבְּדוּן יָת כָל דִי פַקֵדִתָּךְ:", "onk_en": "And behold, I have appointed [to serve] with him, Oholiav, son of Achisamach of the tribe of Don. In the heart of every wise-hearted person I have placed wisdom, so they can make all that I have commanded:", "pj": "וַאֲנָא הָא מַנְיַית עִמֵּיהּ יַת אָהֳלִיאָב בַר אֲחִיסָמָךְ לְשִׁבְטָא דְדָן וּבְלִבָּא דְּכָל חַכִּימֵי לִיבָּא אוֹסִיפִית רוּחַ חוּכְמָתָא וְיַעַבְדוּן יַת כָּל מַה דְּאַפְקֵדִיתָךְ", "pj_en": "And, behold, I have appointed with him Ahaliab bar Achisamah, of the tribe of Dan; and in the heart of every one wise hearted I have added the Spirit of wisdom, that they may perform all whatever I have commanded thee.", "tj": "", "tj_en": "", "rashi": "<b>ובלב כל חכם לב וגו'.<\/b> וְעוֹד שְׁאָר חַכְמֵי לֵב יֵשׁ בָּכֶם, וְכָל אֲשֶׁר נָתַתִּי בוֹ חָכְמָה וְעָשׂוּ אֵת כָּל אֲשֶׁר צִוִּיתִיךָ:", "rashi_en": "ובלב כל חכם לב וגו׳ AND IN THE HEARTS OF ALL THAT ARE WISE HEARTED [I HAVE GIVEN WISDOM] — and there are still other wise-hearted men among you (beside Bezalel and Oholiab) and all these in whom I have given wisdom shall make all that I have commanded thee."}, {"ch": 31, "v": 7, "aliyah": 1, "heb": "אֵ֣ת&thinsp;<b>׀<\/b> אֹ֣הֶל מוֹעֵ֗ד וְאֶת־הָֽאָרֹן֙ לָֽעֵדֻ֔ת וְאֶת־הַכַּפֹּ֖רֶת אֲשֶׁ֣ר עָלָ֑יו וְאֵ֖ת כׇּל־כְּלֵ֥י הָאֹֽהֶל׃", "onk": "יָת מַשְׁכַּן זִמְנָא וְיָת אֲרוֹנָא לְסַהֲדוּתָא וְיָת כַּפֻּרְתָּא דִי עֲלוֹהִי וְיָת כָּל מָנֵי מַשְׁכְּנָא:", "onk_en": "the Tent of Meeting, the Ark for the Testimony, the [Ark] Cover that is to be placed on it, and all the vessels [furniture] of the Tent:", "pj": "יַת מַשְׁכַּן זִימְנָא וְיַת אֲרוֹנָא דְסַהֲדוּתָא וְיַת כַּפּוּרְתָּא דְעָלוֹי וְיַת כָּל מָנֵי מַשְׁכְּנָא", "pj_en": "The tabernacle of ordinance, and the ark of the testimony and the mercy seat which is over it; and all the vessels of the tabernacle;", "tj": "", "tj_en": "", "rashi": "<b>ואת הארן לעדת.<\/b> לְצֹרֶךְ לֻחוֹת הָעֵדוּת:", "rashi_en": "ואת הארן לעדת AND THE ARK FOR THE TESTIMONY — for the purpose of the Tablets of the testimony (not, “the ark to serve as the testimony”; the ל denotes “for” in the sense of “for the use of”, and the term עדת is an abbreviation of לחות העדות)."}, {"ch": 31, "v": 8, "aliyah": 1, "heb": "וְאֶת־הַשֻּׁלְחָן֙ וְאֶת־כֵּלָ֔יו וְאֶת־הַמְּנֹרָ֥ה הַטְּהֹרָ֖ה וְאֶת־כׇּל־כֵּלֶ֑יהָ וְאֵ֖ת מִזְבַּ֥ח הַקְּטֹֽרֶת׃", "onk": "וְיָת פָּתוֹרָא וְיָת מָנוֹהִי וְיָת מְנַרְתָּא דָכִיתָא וְיָת כָּל מָנָהָא וְיָת מַדְבְּחָא דִקְטוֹרֶת <b>בּוּסְמַיָא<\/b>:", "onk_en": "the Table and its vessels, The pure [gold] Menorah, and all its vessels, and the [<b>Spice<\/b>] Incense Altar,", "pj": "וְיַת פְּתוֹרָא וְיַת כָּל מָנוֹי וְיַת מְנַרְתָּא דָכִיתָא וְיַת כָּל מָנָהָא וְיַת מַדְבְּחָא דִקְטוֹרֶת בּוּסְמַיָא", "pj_en": "and the table, and all its vessels; and the altar of sweet incense,", "tj": "", "tj_en": "", "rashi": "<b>הטהרה.<\/b> עַל שֵׁם זָהָב טָהוֹר:", "rashi_en": "הטהרה THE (PURE [CANDELABRUM] — It is called טהרה because the term זהב טהר, pure gold, is used of it (cf. Exodus 25:31) (not טהרה in contrast to טמאה)."}, {"ch": 31, "v": 9, "aliyah": 1, "heb": "וְאֶת־מִזְבַּ֥ח הָעֹלָ֖ה וְאֶת־כׇּל־כֵּלָ֑יו וְאֶת־הַכִּיּ֖וֹר וְאֶת־כַּנּֽוֹ׃", "onk": "וְיָת מַדְבְּחָא דַעֲלָתָא וְיָת כָּל מָנוֹהִי וְיָת כִּיוֹרָא וְיָת בְּסִיסֵיהּ:", "onk_en": "the Burnt—offering Altar, and all its vessels, the Wash Basin and its base.", "pj": "וְיַת מַדְבְּחָא דְעָלָתָא וְיַת כָּל מָנוֹי וְיַת כִּיּוֹרָא וְיַת בְּסִיסֵיהּ", "pj_en": "and the altar of burnt offering, and all its vessels; and the laver, and its foot;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 10, "aliyah": 1, "heb": "וְאֵ֖ת בִּגְדֵ֣י הַשְּׂרָ֑ד וְאֶת־בִּגְדֵ֤י הַקֹּ֙דֶשׁ֙ לְאַהֲרֹ֣ן הַכֹּהֵ֔ן וְאֶת־בִּגְדֵ֥י בָנָ֖יו לְכַהֵֽן׃", "onk": "וְיָת לְבוּשֵׁי <b>שִׁמוּשָׁא<\/b> וְיָת לְבוּשֵׁי קוּדְשָׁא לְאַהֲרֹן כַּהֲנָא וְיָת לְבוּשֵׁי בְנוֹהִי לְשַׁמָּשָׁא:", "onk_en": "[They shall also make] garments [coverings] of crochet-work [<b>service<\/b>], as well as the sacred garments for Aharon, the kohein, and the garments for his sons to serve [as kohanim,]", "pj": "וְיַת לְבוּשֵׁי שִׁמּוּשָׁא וְיַת לְבוּשֵׁי קוּדְשָׁא לְאַהֲרן כַּהֲנָא וְיַת לְבוּשֵׁי בְנוֹי לְשַׁמָּשָׁא", "pj_en": "and the vestments for ministration, the holy vestments of Aharon the priest, and the vestments of his sons for ministry;", "tj": "", "tj_en": "", "rashi": "<b>ואת בגדי השרד.<\/b> אוֹמֵר אֲנִי – לְפִי פְּשׁוּטוֹ שֶׁל מִקְרָא – שֶׁאִי אֶפְשָׁר לוֹמַר שֶׁבְּבִגְדֵי כְהֻנָּה מְדַבֵּר, לְפִי שֶׁנֶּ' אֶצְלָם וְאֶת בִּגְדֵי הַקֹּדֶשׁ לְאַהֲרֹן הַכֹּהֵן וְאֶת בִּגְדֵי בָנָיו לְכַהֵן, אֶלָּא אֵלּוּ בִּגְדֵי הַשְּׂרָד הֵם בִּגְדֵי הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת שָׁנִי הָאֲמוּרִין בְּפָרָשַׁת מַסָּעוֹת, וְנָתְנוּ אֶל בֶּגֶד תְּכֵלֶת וּפָרְשׂוּ עָלָיו בֶּגֶד אַרְגָּמָן וּפָרְשׂוּ עֲלֵיהֶם בֶּגֶד תּוֹלַעַת שָׁנִי (במדבר ד'); וְנִרְאִין דְּבָרַי, שֶׁנֶּ' וּמִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי עָשׂוּ בִגְדֵי שְׂרָד לְשָׁרֵת בַּקֹּדֶשׁ (שמות ל\"ט), וְלֹא הֻזְכַּר שֵׁשׁ עִמָּהֶם, וְאִם בְּבִגְדֵי כְהֻנָּה מְדַבֵּר, לֹא מָצִינוּ בְאֶחָד מֵהֶם אַרְגָּמָן אוֹ תוֹלַעַת שָׁנִי בְּלֹא שֵׁשׁ:<br><br><b>בגדי השרד.<\/b> יֵשׁ מְפָרְשִׁים לְשׁוֹן עֲבוֹדָה וְשֵׁרוּת, כְּתַרְגּוּמוֹ לְבוּשֵׁי שִׁמּוּשָׁא, וְאֵין לוֹ דִּמְיוֹן בַּמִּקְרָא; וַאֲנִי אוֹמֵר שֶׁהוּא לְשׁוֹן אֲרַמִּי, כְּתַרְגּוּם שֶׁל קְלָעִים וְתַרְגּוּם שֶׁל מִכְבָּר, שֶׁהָיוּ אֲרוּגִים בְּמַחַט עֲשׂוּיִים נְקָבִים נְקָבִים לצי\"דץ בְּלַעַז:", "rashi_en": "‎ואת בגדי השרד AND THE GARMENTS OF THE SERVICE — I think — according to the plain sense of the verse — that one cannot say that Scripture is here speaking of (referring to) the priestly garments, because to them refer the next words: “and the garments of holiness for Aaron the priest, and the garments of his sons to minister as priests”. But these בגדי שרד are identical with the garments of blue purple wool, and red purple wool, and crimson wool which are mentioned in the chapter (Numbers IV.) giving an account of Israel’s encampments: (Numbers 4:12) “and they shall put them in a garment of blue purple”; (Numbers 4:13) “and spread a garment of red purple thereon”; (Numbers 4:8) “and they shall spread upon them a garment of crimson”. And indeed my opinion appears correct, because it is said, (Exodus 39:1) “And of the blue purple, and of the red purple, and of the crimson, they made garments of the service (בגדי שרד) to minister in the holiness”, and linen is not mentioned among them (these materials). Now if Scripture were speaking of the priestly garments it could not have omitted “linen”“, for we do not find in respect of even one of them (of the priestly garments) mention of red purple or crimson without linen.<br><br>בגדי השרד GARMENTS OF SERVICE — Some explain שרד to mean work and service (cf. שרת to serve), as the Targum renders it: לבושי שמושא, “garments for the service”. There is, however, no other example of it (of שרד) in Scriptures. I, however, think that it is an Aramaic expression, like the Targum of קלעים, hangings, which Onkelos renders by שרדין, and of מכבר, “grate”, which he renders by שרדא, both words denoting net-work, and they are called “garments of שרד, net-work”, because they were woven not in the ordinary way but with the needle (a kind of crochet-work), made with many holes; “lacies” in old French; English, net or mesh-work."}, {"ch": 31, "v": 11, "aliyah": 1, "heb": "וְאֵ֨ת שֶׁ֧מֶן הַמִּשְׁחָ֛ה וְאֶת־קְטֹ֥רֶת הַסַּמִּ֖ים לַקֹּ֑דֶשׁ כְּכֹ֥ל אֲשֶׁר־צִוִּיתִ֖ךָ יַעֲשֽׂוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת מִשְׁחָא דִרְבוּתָא וְיָת קְטֹרֶת בּוּסְמַיָּא לְקוּדְשָׁא כְּכֹל דִּי פַקֵּדְתָּךְ יַעְבְּדוּן:", "onk_en": "[Also] the anointing oil, and the incense of spices for the Holy [Sanctuary,] according to all that I have commanded you,” they shall make.", "pj": "וְיַת מְשַׁח רְבוּתָא וְיַת קְטוֹרֶת בּוּסְמַיָא לְקוּדְשָׁא הֵי כְּכָל מַה דְּפַקִידְתָּךְ יַעַבְדוּן", "pj_en": "and the oil of anointing; and the sweet incense for the sanctuary; even all whatever I have commanded thee, they shall make.", "tj": "", "tj_en": "", "rashi": "<b>ואת קטרת הסמים לקדש.<\/b> לְצֹרֶךְ הַקְטָרַת הַהֵיכָל שֶׁהוּא קֹדֶשׁ:", "rashi_en": "ואת קטרת הסמים לקדש AND INCENSE OF AROMATICS FOR THE SANCTUARY — i. e. for the purpose of letting it (the incense) rise in smoke in the היכל which is the “קדש” (that part of the Tabernacle or Temple in front of the קדש קדשים‎."}, {"ch": 31, "v": 12, "aliyah": 1, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר:", "onk_en": "Adonoy said to Moshe, saying,", "pj": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 13, "aliyah": 1, "heb": "וְאַתָּ֞ה דַּבֵּ֨ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ לֵאמֹ֔ר אַ֥ךְ אֶת־שַׁבְּתֹתַ֖י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤י וּבֵֽינֵיכֶם֙ לְדֹרֹ֣תֵיכֶ֔ם לָדַ֕עַת כִּ֛י אֲנִ֥י יְהֹוָ֖ה מְקַדִּשְׁכֶֽם׃", "onk": "וְאַתְּ מַלֵּל עִם בְּנֵי יִשְׂרָאֵל לְמֵימַר בְּרַם יָת <b>יוֹמֵי<\/b> שַׁבַּיָּא דִּי לִי תִּטְּרוּן אֲרֵי אַת הִיא בֵּין <b>מֵימְרִי<\/b> וּבֵינֵיכוֹן לְדָרֵיכוֹן לְמִדַּע אֲרֵי אֲנָא יְיָ מְקַדִּשְׁכוֹן:", "onk_en": "And you speak to the B’nei Yisrael, saying, You must still preserve My Shabbos [<b>days<\/b>], for it is a sign between Me [<b>My Word<\/b>] and yourselves for your generations to know that I Adonoy am making you holy.", "pj": "וְאַנְ
