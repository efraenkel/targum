ue you will not soon return unto the scabbard — as a man pours out water and it can never return to the vessel that once contained it (i. e. I will, as it were, empty out the scabbard — pour forth the sword from it, and it shall never return, but always follow you) (Sifra, Bechukotai, Chapter 6 7).<br><br>והיתה ארצכם שממה AND YOUR LAND WILL BE (REMAIN) DESOLATE — This implies that you will not soon return unto it, and on that account עריכם יהיו חריבה YOUR CITIES WILL BE WASTE, i. e. they will seem to you waste; for when a man is exiled from his house, or from his vineyard, or from his city, knowing that he is ultimately to return to it, it appears to him as though his vineyard or his house were not waste.  —Thus is it explained in Torat Cohanim (Sifra, Bechukotai, Chapter 7 1)."}, {"ch": 26, "v": 34, "aliyah": 3, "heb": "אָז֩ תִּרְצֶ֨ה הָאָ֜רֶץ אֶת־שַׁבְּתֹתֶ֗יהָ כֹּ֚ל יְמֵ֣י הׇשַּׁמָּ֔הֿ וְאַתֶּ֖ם בְּאֶ֣רֶץ אֹיְבֵיכֶ֑ם אָ֚ז תִּשְׁבַּ֣ת הָאָ֔רֶץ וְהִרְצָ֖ת אֶת־שַׁבְּתֹתֶֽיהָ׃", "onk": "בְּכֵן תַּרְעֵי אַרְעָא יָת שְׁמִטָּהָא כֹּל יוֹמִין דִּי צְדִיאַת וְאַתּוּן בְּאַרַע בַּעֲלֵי דְבָבֵיכוֹן בְּכֵן תַּשְׁמֵט אַרְעָא וְתַרְעֵי יָת שְׁמִטָּהָא:", "onk_en": "The land will then be appeased for its Shabbosos [<b>rests<\/b>] [during] all the days of its desolation while you are in the land of your enemies. Then the land will rest and be appeased for its Shabbosos [<b>rests<\/b>].", "pj": "הָא בְּכֵן תַּרְעֵי אַרְעָא יַת שְׁנֵי שְׁמִיטָהָא כָּל יוֹמִין דְהִיא צַדְיָא מִנְכוֹן וְאַתּוּן תֶּהֱווֹן מִיטַלְטְלִין בַּאֲרַע בַּעֲלֵי דְבָבֵיכוֹן בְּכֵן תִּתְנַיַיח אַרְעָא וְתִרְעֵי יַת שִׁזְבֵי שְׁמִיטָהָא", "pj_en": "Behold, then shall the land enjoy the years of its Sabbaths all the days that it is forsaken of you, and you are wanderers in the land of your enemies.", "tj": "", "tj_en": "", "rashi": "<b>אז תרצה.<\/b> תְּפַיֵּס אֶת כַּעַס הַמָּקוֹם שֶׁכָּעַס עַל שְׁמִטּוֹתֶיהָ:<br><br><b>והרצת.<\/b> לַמֶּלֶךְ <b>את שבתתיה<\/b>:", "rashi_en": "אז תרצה means: then the land shall appease the wrath of the Omnipresent who was angry because of the neglect of the Sabbatical years.<br><br>והרצת — means, it will give satisfaction to the King as regards its Sabbatical years."}, {"ch": 26, "v": 35, "aliyah": 3, "heb": "כׇּל־יְמֵ֥י הׇשַּׁמָּ֖הֿ תִּשְׁבֹּ֑ת אֵ֣ת אֲשֶׁ֧ר לֹֽא־שָׁבְתָ֛ה בְּשַׁבְּתֹתֵיכֶ֖ם בְּשִׁבְתְּכֶ֥ם עָלֶֽיהָ׃", "onk": "כָּל יוֹמִין דִּי צְדִיאַת תַּשְׁמֵט יָת דִּי לָא שְׁמֵטַת בִּשְׁמִטֵּיכוֹן כַּד הֲוֵיתוּן יָתְבִין עֲלַהּ:", "onk_en": "All the days that it lies desolate it shall have its rest—the rest it did not have on your Shabbosos [<b>rests<\/b>] when you were living upon it.", "pj": "כָּל יוֹמִין דְהִיא צַדְיָא מִנְכוֹן תִּתְנַיַיח הֵי כְּמָא דְלָא אִתְנַיְיחַת יַת שְׁנֵי שְׁמִיטֵיכוֹן כַּד הֲוֵיתוּן שַׁרְיָין עֲלָהּ", "pj_en": "All the days that it is forsaken by you it shall rest, because it was not at rest in the years of the times for repose when you were dwellers upon it.", "tj": "", "tj_en": "", "rashi": "<b>כל ימי השמה.<\/b> לְשׁוֹן הֵעָשׂוֹת, וּמֵ\"ם דָּגֵשׁ בִּמְקוֹם כֵּפֶל שְׁמָמָה:<br><br><b>את אשר לא שבתה.<\/b> שִׁבְעִים שָׁנָה שֶׁל גָּלוּת בָּבֶל הֵן הָיוּ כְּנֶגֶד שִׁבְעִים שְׁנוֹת הַשְּׁמִטָּה וְיוֹבֵל שֶׁהָיוּ בַּשָּׁנִים שֶׁהִכְעִיסוּ יִשְׂרָאֵל בְּאַרְצָם לִפְנֵי הַמָּקוֹם — אַרְבַּע מֵאוֹת וּשְׁלוֹשִׁים שָׁנָה; שְׁלוֹשׁ מֵאוֹת וְתִשְׁעִים הָיוּ שְׁנֵי עֲוֹנָם מִשֶּׁנִּכְנְסוּ לָאָרֶץ עַד שֶׁגָּלוּ עֲשֶׂרֶת הַשְּׁבָטִים, וּבְנֵי יְהוּדָה הִכְעִיסוּ לְפָנָיו אַרְבָּעִים שָׁנָה מִשֶּׁגָּלוּ עֲשֶׂרֶת הַשְּׁבָטִים עַד חָרְבוֹת יְרוּשָׁלַיִם, הוּא שֶׁנֶּאֱמַר בִּיחֶזְקֵאל \"וְאַתָּה שְׁכַב עַל צִדְּךָ הַשְּׂמָאלִי וְגוֹ', וְכִלִּיתָ אֶת אֵלֶּה וְגוֹ', וְשָׁכַבְתָּ עַל צִדְּךָ הַיְמָנִי אַרְבָּעִים יוֹם וְנָשָׂאתָ אֶת עֲוֹן בֵּית יְהוּדָה\", וּנְבוּאָה זוֹ נֶאֶמְרָה לִיחֶזְקֵאל בַּשָּׁנָה הַחֲמִשִּׁית לְגָלוּת הַמֶּלֶךְ יְהוֹיָכִין, וְעוֹד עָשׂוּ שֵׁשׁ שָׁנִים עַד גָּלוּת צִדְקִיָּהוּ, הֲרֵי אַרְבָּעִים וְשֵׁשׁ; וְאִ\"תֹּ שְׁנוֹת מְנַשֶּׁה חֲמִשִּׁים וְחָמֵשׁ הָיוּ, מְנַשֶּׁה עָשָֹה תְשׁוּבָה שְׁלוֹשִׁים וְשָׁלוֹשׁ שָׁנָה, וְכָל שְׁנוֹת רִשְׁעוֹ עֶשְֹרִים וּשְׁתַּיִם, כְּמוֹ שֶׁאָמְרוּ בְּאַגָּדַת חֵלֶק, וְשֶׁל אָמוֹן שְׁתַּיִם, וְאַחַת עֶשְֹרֵה לִיהוֹיָקִים, וּכְנֶגְדָּן לְצִדְקִיָּהוּ; צֵא וַחֲשֹׁב לְאַרְבַּע מֵאוֹת וּשְׁלוֹשִׁים וְשֵׁשׁ שָׁנָה שְׁמִטִּין וְיוֹבְלוֹת שֶׁבָּהֶם, וְהֵם שֵׁשׁ עֶשְׂרֶה לְמֵאָה — אַרְבַּע עֶשְׂרֵה שְׁמִטִּין וּשְׁנַיִם יוֹבְלוֹת, הֲרֵי לְאַרְבַּע מֵאוֹת שָׁנָה שִׁשִּׁים וְאַרְבַּע, לִשְׁלוֹשִׁים וְשֵׁשׁ שָׁנָה חָמֵשׁ שְׁמִטּוֹת, הֲרֵי שִׁבְעִים חָסֵר אַחַת, וְעוֹד שָׁנָה יְתֵרָה, שֶׁנִּכְנְסָה בַשְּׁמִטָּה הַמַּשְׁלֶמֶת לְשִׁבְעִים, וַעֲלֵיהֶם נִגְזַר שִׁבְעִים שָׁנָה שְׁלֵמִים, וְכֵן הוּא אוֹמֵר בְּדִבְרֵי הַיָמִים (דברי הימים ב' ל\"ו), עַד רָצְתָה הָאָרֶץ אֶת שַׁבְּתוֹתֶיהָ … לְמַלֹּאות שִׁבְעִים שָׁנָה (סדר עולם):", "rashi_en": "כל ימי השמה — The word השמה expresses the idea of something being done (passive infinitive; here Hophal); and the מ has a Dagesh in place of doubling that letter in the root שמם.<br><br>את אשר לא שבתה  BECAUSE IT DID NOT REST [IN YOUR SABBATHS] — The seventy years of the Babylonian exile exactly corresponded to the seventy Sabbatical and Jubilee years that were due in those years when Israel was provoking the anger of the Omnipresent  whilststill in their land, i. e. in 430 years. Three hundred and ninety were their years of sin from the time they entered the Land until the Ten Tribes went into exile. The people of the Kingdom of Judah provoked Him still another forty years, — from the exile of the Ten Tribes until the destruction of Jerusalem (in the days of king Jehoiachin; cf. 2 Kings 24:10 ff.). It is this that is mentioned in the case of Ezekiel (4:4—6): “Moreover lie thou upon thy left, [and lay the iniquity of the house of Israel upon it: according to the number of the days that thou shalt lie upon it, thou shalt bear their iniquity. For I have appointed the years of their iniquity to be unto thee a number of days, even three hundred and ninety days…]. And again, when thou hast accomplished these, thou shalt lie on thy right side, and shalt bear the iniquity of the house of Judah forty days [each day for a year have I appointed it unto thee]”. This prophecy was spoken to Ezekiel in the fifth year of king Jeoiachin’s captivity (cf. Ezekiel 1:2). They spent another six years in the Land until Zedekiah (the last king, who reigned eleven years) went into exile; thus you have altogether forty-six years. — And if you say “But this period must have covered more than forty-six years because the years of the reign of Manasseh (the son of Hezekiah during whose reign the Ten Tribes became exiled), were alone 55 years, and there followed other kings also until the destruction of the Temple!” Then I reply that Manasseh lived in a state of repentence 33 years of these and that the years of his wickedness with which alone we are concerned were only twenty-two, as it is said, (2 Kings 21:3) “For he (Manasseh)… made an Asherah, as did Ahab king of Israel”, and Ahab reigned 22 years, just as they (the Rabbis) stated (i. e. they stated that this comparison of Manasseh with Ahab shows that the latter was wicked for 22 years only) in the chapter Chelek (Sanhedrin 103a). Then we have the years of his successor, Amon, two; eleven of Jehoiakin, and a similar number of Zedekiah, the last king of Judah — altogether 46 years. Now, go and calculate for four hundred and thirty-six years the number of Sabbatical and Jubilee periods contained in them and you will find that they are sixteen for every hundred years, viz., fourteen Sabbatical periods and two Jubilee-periods; so for four hundred years there are sixty-four. For the remaining thirty-six there are five Sabbatical periods, making seventy less one. There is yet one year over (the thirty-sixth, since five Sabbatical periods give only thirty-five years) which entered into (began) the Sabbatical period and which completes seventy such periods, each terminating in a Sabbatical year. And because of them (i. e. because of the neglect of these seventy years) exactly seventy years of exile were decreed against them. Thus, too, it is said in Chronicles, (II Chronicles 36:21) “[and them that had escaped from the sword carried he away to Babylon…] until the land had enjoyed her Sabbaths [for as long as she lay desolate she kept Sabbaths] to fulfill three score and ten years” (Seder Olam)."}, {"ch": 26, "v": 36, "aliyah": 3, "heb": "וְהַנִּשְׁאָרִ֣ים בָּכֶ֔ם וְהֵבֵ֤אתִי מֹ֙רֶךְ֙ בִּלְבָבָ֔ם בְּאַרְצֹ֖ת אֹיְבֵיהֶ֑ם וְרָדַ֣ף אֹתָ֗ם ק֚וֹל עָלֶ֣ה נִדָּ֔ף וְנָס֧וּ מְנֻֽסַת־חֶ֛רֶב וְנָפְל֖וּ וְאֵ֥ין רֹדֵֽף׃", "onk": "וּדְיִשְׁתַּאֲרוּן בְּכוֹן וְאָעֵל תַּבְרָא בְּלִבְּהוֹן בְּאַרְעֲתָא דְּסַנְאֵיהוֹן וְיִרְדּוֹף יָתְהוֹן קַל טַרְפָּא דְשַׁקִּיף וְיֵעַרְקוּן כְּמֵעִירוֹק מִן קֳדָם דְּקָטְלִין בְּחַרְבָּא וְיִפְּלוּן וְלֵית דְּרָדִיף:", "onk_en": "To those who survive among you, I will send timidity [<b>brokenness<\/b>] into their hearts [as they live] in the lands of their enemies. The sound of a blown leaf [<b>beating<\/b>] will put them to flight and they will flee as though fleeing from [<b>before people who kill with<\/b>] a sword; and they will fall with no one chasing them.", "pj": "וּדְיִשְׁתַּיְירוּן בְכוֹן וְאָעֵיל תַּבְרָא בְּלִבְּהוֹן בְּאַרְעֲתָא דְסַנְאֵיהוֹן וִיהֵי רָדִיף יַתְהוֹן קַל טַרְפָא דְנָתִיר מִן אִילַן וִיעַרְקוּן הֵי כְּמַעֲרוּקֵי חַרְבָּא וְיִפְּלוּן וְלֵית דְרָדִיף", "pj_en": "And unto those of you who remain will I bring brokenness of their hearts in the land of their enemies; and the sound of a leaf falling from the tree shall put them to flight; and they shall flee as those who flee from the sword, and fall, while no man pursueth.", "tj": "", "tj_en": "", "rashi": "<b>והבאתי מרך.<\/b> פַּחַד וְרֹךְ לֵבָב; מ\"ם שֶׁל מֹרֶךְ יְסוֹד נוֹפֵל הוּא, כְּמוֹ מ\"ם שֶׁל מוֹעֵד וְשֶׁל מוֹקֵשׁ:<br><br><b>ונסו מנסת חרב.<\/b> כְּאִלּוּ רוֹדְפִים הוֹרְגִים אוֹתָם:<br><br><b>עלה נדף.<\/b> שֶׁהָרוּחַ דּוֹחֲפוֹ וּמַכֵּהוּ עַל עָלֶה אַחֵר וּמְקַשְׁקֵשׁ וּמוֹצִיא קוֹל, וְכֵן תַּרְגּוּמוֹ קַל טַרְפָּא דְשָׁקִיף, לְשׁוֹן חֲבָטָה, \"שְׁדוּפוֹת קָדִים\" (בראשית מ\"א) — שְׁקִיפָן קִדּוּם, לְשׁוֹן מַשְׁקוֹף, מְקוֹם חֲבָטַת הַדֶּלֶת, וְכֵן תַּרְגּוּמוֹ שֶׁל \"חַבּוּרָה\" (שמות כ\"א) — מַשְׁקוֹפֵי:", "rashi_en": "והבאתי מרך AND I WILL SEND A FAINTNESS [INTO THEIR HEART] —  מרך‎ means timidity and faint-heartedness. The מ is an essential letter of the noun, which, however, is omitted in the root; as is the case with the מ in the nouns מועד and ומוקש.  <br><br>ונסו מנוסת חרב AND THEY SHALL RUN AWAY AS RUNNING AWAY FROM THE SWORD — as though pursuers were about to kill them.<br><br>עלה נדף A RUSTLING LEAF — i. e. a leaf which the wind pushes along and beats it against another leaf, so that, in tapping it, it produces a sound. This, too, is its translation in the Targum: the sound of a leaf דשקיף — a term that signifies beating. The words (Genesis 41:6): שדופות קדים are rendered in the Targum by שקיפן קידום, beaten by the east wind, the first word being of the same meaning as משקוף, a lintel, that being the place against which the door beats. Similarly the Targum translation of חבורה, a wound, (Exodus 21:25), is משקופי (a spot that has been beaten)."}, {"ch": 26, "v": 37, "aliyah": 3, "heb": "וְכָשְׁל֧וּ אִישׁ־בְּאָחִ֛יו כְּמִפְּנֵי־חֶ֖רֶב וְרֹדֵ֣ף אָ֑יִן וְלֹא־תִֽהְיֶ֤ה לָכֶם֙ תְּקוּמָ֔ה לִפְנֵ֖י אֹֽיְבֵיכֶֽם׃", "onk": "וְיִתַּקְלוּן גְּבַר בְּאָחוּהִי כְּמִקָּדָם דְקָטְלִין בְּחַרְבָּא וְרָדִיף לָיִת וְלָא תְהֵי לְכוֹן תְּקוּמָה קֳדָם בַּעֲלֵי דְבָבֵיכוֹן:", "onk_en": "They will stumble over one other as though before [<b>people who kill with<\/b>] a sword when there is no pursuer, and you will have no power to stand upright before your enemies.", "pj": "וִיתַקְלוּן גְבַר בְּאָחוֹי הֵי כְּמִן קֳדָם שְׁלוּפֵי חַרְבָּא וְרָדִיף לָא אִית וְלָא תְהֵי לְכוֹן תְּיָקָא לְמֵקוּם קֳדָם בַּעֲלֵי דְבָבֵיכוֹן", "pj_en": "And they shall thrust each man his brother, as before them who draw the sword, though none pursue; and you shall have no power of resistance to stand before your adversaries.", "tj": "", "tj_en": "", "rashi": "<b>וכשלו איש באחיו.<\/b> כְּשֶׁיָּרוּצוּ לָנוּס יִכָּשְׁלוּ זֶה בָזֶה, כִּי יִבָּהֲלוּ לָרוּץ:<br><br><b>כמפני חרב.<\/b> כְּאִלּוּ בּוֹרְחִים מִלִּפְנֵי הוֹרְגִים, שֶׁיְּהֵא בִלְבָבָם פַּחַד, וְכָל שָׁעָה סְבוּרִים שֶׁאָדָם רוֹדְפָם; וּמִדְרָשׁוֹ וְכָשְׁלוּ אִישׁ בְּאָחִיו, זֶה נִכְשָׁל בַּעֲוֹנוֹ שֶׁל זֶה, שֶׁכָּל יִשְׂרָאֵל עֲרֵבִין זֶה לָזֶה (ספרא; סנהדרין כ\"ז):", "rashi_en": "וכשלו איש באחיו AND THEY SHALL STUMBLE ONE UPON ANOTHER — When they are running in order to escape they will stumble one against the other because they will be in a hurry to run away.<br><br>כמפני חרב AS IT WERE BEFORE THE SWORD — i. e. as though they were fleeing from before murderers. It means that in their heart there will be timidity, and at every moment they will think that somebody is pursuing them. A Midrashic explanation of וכשלו איש באחיו is: one will stumble by reason of the sin of the other (באחיו is taken in the sense of: on account of the other), for all Israelites are held responsible for one another (Sifra, Bechukotai, Chapter 7 5; Sanhedrin 27b)."}, {"ch": 26, "v": 38, "aliyah": 3, "heb": "וַאֲבַדְתֶּ֖ם בַּגּוֹיִ֑ם וְאָכְלָ֣ה אֶתְכֶ֔ם אֶ֖רֶץ אֹיְבֵיכֶֽם׃", "onk": "וְתֵבְדוּן בֵּינֵי עַמְמַיָּא וּתְגַמַּר יָתְכוֹן אֲרַע בַּעֲלֵי דְבָבֵיכוֹן:", "onk_en": "You will be lost among the nations and the land of your enemies will consume you.", "pj": "וְתֵיבְדוּן בֵּין עַמְמַיָא וּתְגַמַר יַתְכוֹן בְּמוֹתָנָא אֲרַע בַּעֲלֵי דְבָבֵיכוֹן", "pj_en": "And you shall perish among the nations, and be consumed with pestilence in the land of your enemies,", "tj": "", "tj_en": "", "rashi": "<b>ואבדתם בגוים.<\/b> כְּשֶׁתִּהְיוּ פְזוּרִים, תִּהְיוּ אֲבוּדִים זֶה מִזֶּה (עי' ספרא):<br><br><b>ואכלה אתכם.<\/b> אֵלּוּ הַמֵּתִים בַּגּוֹלָה:", "rashi_en": "ואבדתם בגוים AND YE SHALL BE LOST AMONG THE NATIONS — when you are scattered about among the nations you will lose sight of each other (lit., “you will be lost from one another”) (cf. Rashi on v. 33; see also Sifra, Bechukotai, Chapter 8 1).<br><br>ואכלה אתכם [AND THE LAND OF YOUR ENEMIES] SHALL EAT YOU UP — This refers to those who will die in exile (cf. Targum Jonathan on)."}, {"ch": 26, "v": 39, "aliyah": 3, "heb": "וְהַנִּשְׁאָרִ֣ים בָּכֶ֗ם יִמַּ֙קּוּ֙ בַּֽעֲוֺנָ֔ם בְּאַרְצֹ֖ת אֹיְבֵיכֶ֑ם וְאַ֛ף בַּעֲוֺנֹ֥ת אֲבֹתָ֖ם אִתָּ֥ם יִמָּֽקּוּ׃", "onk": "וּדְיִשְׁתָּאֲרוּן בְּכוֹן יִתִּמְסוּן בְּחוֹבֵיהוֹן בְּאַרְעֲתָא בַּעֲלֵי דְבָבֵיכוֹן וְאַף בְּחוֹבֵי אֲבָהַתְהוֹן בִּישַׁיָּא דַּאֲחִידִין בִּידֵיהוֹן יִתִּמְסוּן:", "onk_en": "Those of you who survive will rot away [<b>melt<\/b>] in their iniquity in the land of your enemies, and also due to the iniquities of their [<b>evil<\/b>] ancestors which are [still] with them [<b>they hold in their hands<\/b>], [they] will they rot away [<b>melt<\/b>].", "pj": "וּדְמִשְׁתַּיֵיר מִנְכוֹן יִתְיַמְסוּן בְּחוֹבֵיהוֹן בְּאַרְעֲתָא דְסַנְאֵיכוֹן וְאוּף בְּחוֹבֵי אַבְהַתְהוֹן בִּישַׁיָא דַאֲחִידִין בִּידֵיהוֹן עִמְהוֹן יִתְיַמְסוּן", "pj_en": "And those who remain of you shall fail (melt away) for their sins in the land of your enemies, and also for the evil sin of your fathers which they held fast in their hands: like them shall they melt away.", "tj": "", "tj_en": "", "rashi": "<b>בעונת אבתם אתם.<\/b> כְּשֶׁעֲווֹנוֹת אֲבוֹתָם אִתָּם — כְּשֶׁאוֹחֲזִים מַעֲשֵׂה אֲבוֹתֵיהֶם בִּידֵיהֶם (שם):<br><br><b>ימקו.<\/b> לְשׁוֹן הֲמַסָּה, כְּמוֹ יִמַּסּוּ, וְכָמוֹהוּ \"תִּמַּקְנָה בְחֹרֵיהֶן\" (זכריה י\"ד), \"נָמַקּוּ חַבּוּרֹתָי\" (תהילים ל\"ח):", "rashi_en": "בעונת אבתם אתם means if the iniquities of their fathers shall be with them, i. e. if they hold fast to (imitate) the doings of their fathers (cf. Sifra, Bechukotai, Chapter 8 2; Sanhedrin 27b).<br><br>ימקו — This is an expression denoting “melting away” and therefore means the same as ימסו, “they shall melt away”. Similar to it are (Zechariah 14:12) “[their eyes] shall melt away (תמקנה) in their holes”; (Psalms 38:6) “My wounds נמקו, melt” (i. e. run with pus)."}, {"ch": 26, "v": 40, "aliyah": 3, "heb": "וְהִתְוַדּ֤וּ אֶת־עֲוֺנָם֙ וְאֶת־עֲוֺ֣ן אֲבֹתָ֔ם בְּמַעֲלָ֖ם אֲשֶׁ֣ר מָֽעֲלוּ־בִ֑י וְאַ֕ף אֲשֶׁר־הָֽלְכ֥וּ עִמִּ֖י בְּקֶֽרִי׃", "onk": "וִיוַדּוּן יָת חוֹבֵיהוֹן וְיָת חוֹבֵי אֲבָהַתְהוֹן בְּשִׁקְרְהוֹן דְּשַׁקָּרוּ קֳדָמָי וְאַף דִּי הַלִּיכוּ קֳדָמַי בְּקַשְׁיוּ:", "onk_en": "They will [then] confess their iniquities and the iniquities of their ancestors in the unfaithfulness [<b>dishonesty<\/b>] with which they were unfaithful [<b>dishonest<\/b>] to [<b>before<\/b>] Me, and also for walking contrary to [<b>before<\/b>] Me.", "pj": "וִיוַדוּן בְּשַׁעַת אַנִיקְהוֹן יַת חוֹבֵיהוֹן וְיַת חוֹבֵי אַבְהַתְהוֹן בְּשִׁקְרֵיהוֹן דְשַׁקְרוּ בְּמֵימְרִי וְאוּף דְהַלִיכוּ עִמִי בְּעַרְאַי", "pj_en": "But (when) in the hour of their need they shall confess their sins, and the sins of their fathers, with their falseness with which they have acted falsely against My Word; and that they have acted frowardly also with Me,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 41, "aliyah": 3, "heb": "אַף־אֲנִ֗י אֵלֵ֤ךְ עִמָּם֙ בְּקֶ֔רִי וְהֵבֵאתִ֣י אֹתָ֔ם בְּאֶ֖רֶץ אֹיְבֵיהֶ֑ם אוֹ־אָ֣ז יִכָּנַ֗ע לְבָבָם֙ הֶֽעָרֵ֔ל וְאָ֖ז יִרְצ֥וּ אֶת־עֲוֺנָֽם׃", "onk": "אַף אֲנָא אֱהַךְ עִמְּהוֹן בְּקַשְׁיוּ וְאָעֵיל יָתְהוֹן בְּאַרַע בַּעֲלֵי דְבָבֵיהוֹן אוֹ בְכֵן יִתָּבַר לִבְּהוֹן טַפְשָׁא וּבְכֵן יִרְעוּן יָת חוֹבֵיהוֹן:", "onk_en": "I, too, will go contrary to them and bring them into the land of their enemies. Or perhaps then will be humbled [<b>broken<\/b>] their uncircumcised (unyielding) [<b>unwise<\/b>] heart and then their iniquities will be appeased (forgiven).", "pj": "בְּרַם אֲנָא אִידַבֵּר יַתְהוֹן בְּעַרַאי בְּעַלְמָא וְאָעֵיל יַתְהוֹן בְּגָלוּתָא בְּאַרַע בַּעֲלֵי דְבָבֵיהוֹן הָא בְּכֵן יִתְבַּר לִבְּהוֹן זְדָנָא וּבְכֵן יַרְעוּן יַת חוֹבֵיהוֹן", "pj_en": "so that I have remembered them adversely in the world, and brought them into captivity in the land of their enemies; behold, then will their proud heart have been broken, and they will make confession of their sins,", "tj": "", "tj_en": "", "rashi": "<b>והבאתי אתם.<\/b> אֲנִי בְעַצְמִי אֲבִיאֵם; זוֹ מִדָּה טוֹבָה לְיִשְׂרָאֵל, שֶׁלֹּא יִהְיוּ אוֹמְרִים, הוֹאִיל וְגָלִינוּ בֵּין הָאֻמּוֹת נַעֲשֶׂה כְמַעֲשֵׂיהֶם, אֲנִי אֵינִי מַנִּיחָם, אֶלָּא מַעֲמִיד אֲנִי אֶת נְבִיאַי וּמַחֲזִירָן לְתַחַת כְּנָפַי, שֶׁנֶּאֱמַר (יחזקאל כ\"א), \"וְהָעֹלָה עַל רוּחֲכֶם הָיוֹ לֹא תִהְיֶה וְגוֹ' חַי אָנִי … אִם לֹא בְּיָד חֲזָקָה וְגוֹ'\" (ספרא):<br><br><b>או אז יכנע.<\/b> כְּמוֹ \"אוֹ נוֹדַע כִּי שׁוֹר נַגָּח הוּא\" (שמות כ\"א) — אִם אָז יִכָּנַע; לָשׁוֹן אַחֵר אוּלַי — שֶׁמָּא אָז יִכָּנַע לְבָבָם וְגוֹ':<br><br><b>ואז ירצו את עונם.<\/b> יְכַפְּרוּ עַל עֲווֹנָם בְּיִסּוּרֵיהֶם:", "rashi_en": "והבאתי אתם AND I SHALL BRING THEM [INTO THE LAND OF THEIR ENEMIES] — I Myself shall bring them; this is a kindly measure for Israel in order that they should not say, “Since we are banished among the nations let us do like their doings”. “For”, says God “I will not suffer them to do this, but I will raise up My prophets and so bring them back under My wings, as it is said, (Ezekiel 20:30) “And that which cometh into your mind shall not be at all, — [that ye say, We will be as the heathens, as the families of the countries, to serve wood and stone]. As I live, saith the Lord God, surely with a mighty hand, and with  an  outstretched arm and with fury poured out, will “I” be king over you etc.” (Sifra, Bechukotai, Chapter 8 5).<br><br>או אז יכנע — The word או here has the same meaning as in (Exodus 21:36) או נודע כי שור נגח הוא (cf. Rashi on that verse and our Note thereon). The translation therefore is: “If then [their uncircumcised hearts] will be humbled”. Another explanation is that או means perhaps, — “perhaps then their uncircumcised hearts will be humbled”.<br><br>ואז ירצו את עונם means, and they will atone for their iniquities by the punishments they will have suffered."}, {"ch": 26, "v": 42, "aliyah": 3, "heb": "וְזָכַרְתִּ֖י אֶת־בְּרִיתִ֣י יַעֲק֑וֹב וְאַף֩ אֶת־בְּרִיתִ֨י יִצְחָ֜ק וְאַ֨ף אֶת־בְּרִיתִ֧י אַבְרָהָ֛ם אֶזְכֹּ֖ר וְהָאָ֥רֶץ אֶזְכֹּֽר׃", "onk": "וְדָכִירְנָא יָת קְיָמִי דְעִם יַעֲקוֹב וְאַף יָת קְיָמִי דְעִם יִצְחָק וְאַף יָת קְיָמִי דְעִם אַבְרָהָם אֲנָא דָכִיר וְאַרְעָא אֲנָא דָכִיר:", "onk_en": "I will [then] remember My covenant with Yaakov and also My covenant with Yitzchok and also My covenant with Avrohom, I will remember and I will remember the land.", "pj": "וְאִדְכַּר בְּרַחֲמִין יַת קְיָימָא דְקַיֵימִית עִם יַעֲקב בְּבֵית אֵל וְאוּף יַת קְיָימָא דְקַיֵימִית עִם יִצְחָק בְּטַוָור מוֹרִיָה וְאוּף יַת קְיָימָא דְקַיֵימִית עִם אַבְרָהָם בֵּינֵי פִּיסוּגַיָא אֶדְכּוֹר וְאַרְעָא דְיִשְרָאֵל אֶדְכּוֹר בְּרַחֲמִין", "pj_en": "and I will remember in mercy the covenant which I confirmed with Jakob at Bethel, and the covenant which I covenanted with Izhak at Mount Moriah, and the covenant which I covenanted with Abraham, between the divided portions, I will remember, and the land of Israel will I remember in mercy.", "tj": "וְאִידְּכַּר בְּרַחֲמִין קְיָימָא דְּקַיֵימִית עִם יַעֲקב בְּבֵית אֵל וּקְיָימָא דִי קַיֵימִית עִם יִצְחָק בְּטוּר מוֹרִיָה וקְיָימָא דִי קַיֵימִית עִם אַבְרָהָם בֵּינֵי בְּתָרַיָא אִדְּכַּר בְּרַחֲמִין וְאַרְעָא דְּיִשְרָאֵל אִדְּכַּר בְּרַחֲמִין:", "tj_en": "And I will remember in mercy the covenant which I established with Jakob at Bethel; and the covenant which I confirmed with Izhak at Mount Moriah, and the covenant I confirmed with Abraham between the divided parts. I will remember in mercy; and the land of Israel will I remember in mercy.", "rashi": "<b>וזכרתי את בריתי יעקוב.<\/b> בַּחֲמִשָּׁה מְקוֹמוֹת נִכְתַּב מָלֵא, וְאֵלִיָּהוּ חָסֵר בַּחֲמִשָּׁה מְקוֹמוֹת — יַעֲקֹב נָטַל אוֹת מִשְּׁמוֹ שֶׁל אֵלִיָּהוּ עֵרָבוֹן שֶׁיָּבֹא וִיבַשֵּׂר גְּאֻלַּת בָּנָיו:<br><br><b>וזכרתי את בריתי יעקוב.<\/b> לָמָּה נִמְנוּ אֲחוֹרַנִּית? כְּלוֹמַר, כְּדַאי הוּא יַעֲקֹב הַקָּטָן לְכָךְ, וְאִם אֵינוֹ כְדַאי, הֲרֵי יִצְחָק עִמּוֹ, וְאִם אֵינוֹ כְדַאי, הֲרֵי אַבְרָהָם עִמּוֹ שֶׁהוּא כְדַאי, וְלָמָּה לֹא נֶאֶמְרָה זְכִירָה בְיִצְחָק? אֶלָּא אֲפָרוֹ שֶׁל יִצְחָק נִרְאֶה לְפָנַי צָבוּר וּמֻנָּח עַל הַמִּזְבֵּחַ (ספרא):", "rashi_en": "וזכרתי את בריתי יעקוב THEN I WILL REMEMBER MY COVENANT WITH JACOB — In five places in Scripture it (the name יעקב) is written plene (יעקוב) and the name אליהו is written defectively in five places, to intimate that Jacob — as it were — took one letter of his (Elijah’s) name as a pledge that at some future time he should come and proclaim the good tidings of his descendants’ redemption (cf. Midrash ‎חסירות ויתירות).<br><br>‎ וזכרתי את בריתי יעקוב‎ THEN I WILL REMEMBER MY COVENANT WITH JACOB [AND ALSO MY COVENANT WITH ISAAC, AND ALSO MY COVENANT WITH ABRAHAM WILL I REMEMBER] — Why are they (the patriarchs) enumerated here in a reverse order (in contrast to e. g., Exodus 32:13, where it states:  ‎'לאברהם ליצחק ולישראל וכו‎‎‎זכור ‏)? It is to say: Jacob the youngest among the patriarchs is worthy of this that, through his merits, his children should be redeemed; if he be not sufficiently worthy, behold, the merit of Isaac is with him; if that does not suffice, behold, then there is Abraham with him who is  surely worthy enough! And why does Scripture not use the word “remember” in connection with Isaac’s name? Because this is unnecessary, for — says God, as it were — the ashes of Isaac (who according to My command to Abraham was to become a burnt offering) are ever visible before Me as though they were heaped up lying upon the altar (Sifra, Bechukotai, Chapter 8 6-7)."}, {"ch": 26, "v": 43, "aliyah": 3, "heb": "וְהָאָ֩רֶץ֩ תֵּעָזֵ֨ב מֵהֶ֜ם וְתִ֣רֶץ אֶת־שַׁבְּתֹתֶ֗יהָ בׇּהְשַׁמָּהֿ֙ מֵהֶ֔ם וְהֵ֖ם יִרְצ֣וּ אֶת־עֲוֺנָ֑ם יַ֣עַן וּבְיַ֔עַן בְּמִשְׁפָּטַ֣י מָאָ֔סוּ וְאֶת־חֻקֹּתַ֖י גָּעֲלָ֥ה נַפְשָֽׁם׃", "onk": "וְאַרְעָא תִתְרְטֵשׁ מִנְּהוֹן וְתַרְעֵי יָת שְׁמִטָּהָא בְּדִצְדִיאַת מִנְּהוֹן וְאִנּוּן יִרְעוּן יָת חוֹבֵיהוֹן לְוָטִין חֳלַף בִּרְכָן אַיְתִי עֲלֵיהוֹן בְּדִיל דִּבְדִינַי קָצוּ וְיָת קְיָמַי רְחֵקַת נַפְשְׁהוֹן:", "onk_en": "The land, being bereft of them, will be appeased for its Shabbosos [<b>rests<\/b>], during the time of its desolation from them and their iniquities will then be appeased (forgiven) [<b>I will bring upon them curses instead of blessings<\/b>] since what certainly caused [this] is that they despised My laws and their soul loathed (rejected) My statutes.", "pj": "וְאַרְעָא תִּתְרְטֵישׁ וְתִשְׁתְּבֵיק מִנְהוֹן וְתַרְעֵי יַת שׁוֹבֵי שְׁמִיטָהָא כָּל יוֹמִין דְהִיא צַדְיָא מִנְכוֹן וְהִינוּן יַרְעוּן יַת חוֹבֵיהוֹן לְוָוטִין חֲלַף בִּירְכָן יִמְטוּן עֲלֵיהוֹן מֵיכְלָא כָּל קֳבֵיל מֵיכְלָא הוּא מְטוּל דְהִינוּן בְּסִידְרֵי דִינַי קָצוּ וְיַת קְיָימֵי אוֹרַיְיתִי רְחִיקַת נַפְשֵׁיהוֹן", "pj_en": "But the land shall (first) be relinquished and forsaken you; and enjoy the repose of her remissions all the days that it shall be deserted by you. And they will receive retribution for their sins: curses instead of blessings will come upon them, measure for measure: because they shunned the orders of judgments, and their souls revolted from the covenant of My law.", "tj": "וְאַרְעָא תִשְׁבוֹק מִנְּהוֹן וְתַרְעֵי יַת שַׁבֵּי שְׁמִיטָהָא כָּל יוֹמִין דַּהֲוַת צָדּוּ מִנְּהוֹן וְאִנוּן יִמְרְקוּן יַת חוֹבֵיהוֹן מְכֵלָא חֲלַף מְכֵלָא וְסִדְרִין חֲלַף סִדְרִין יַת סְדַר דִּינַי מְאָסוּ:", "tj_en": "Yet the land shall be forsaken by you, and shall enjoy the repose of her remission (times) all the days that she is deserted of you. And they shall be broken for their sins; with measure for measure, and orders for orders, because they spurned the order of My judgments.", "rashi": "<b>יען וביען.<\/b> גְּמוּל וּבִגְמוּל אֲשֶׁר בְּמִשְׁפָּטַי מָאָסוּ (עי' ספרא):", "rashi_en": "יען וביען BECAUSE AND BECAUSE [THEY REJECTED MY ORDINANCES] — i. e. it is a retribution — and a retribution, too, that they have rejected My ordinances."}, {"ch": 26, "v": 44, "aliyah": 3, "heb": "וְאַף־גַּם־זֹ֠את בִּֽהְיוֹתָ֞ם בְּאֶ֣רֶץ אֹֽיְבֵיהֶ֗ם לֹֽא־מְאַסְתִּ֤ים וְלֹֽא־גְעַלְתִּים֙ לְכַלֹּתָ֔ם לְהָפֵ֥ר בְּרִיתִ֖י אִתָּ֑ם כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵיהֶֽם׃", "onk": "וְאַף בְּרַם דָּא בְּמֵהֱוֵיהוֹן בְּאַרַע בַּעֲלֵי דְבָבֵיהוֹן לָא אַרְטֵשִׁנּוּן וְלָא אַרְחֵקִנּוּן לְשֵׁיצָיוּתְהוֹן לְאַשְׁנָאָה קְיָמִי עִמְּהוֹן אֲרֵי אֲנָא יְיָ אֱלָהֲהוֹן:", "onk_en": "All this not withstanding, even when they are in the land of their enemies I will not despise [<b>abandon<\/b>] them and I will not loathe [<b>reject<\/b>] them to annihilate them, to break [<b>change<\/b>] My covenant with them, for I am Adonoy, their God.", "pj": "וְאוּף עַל כָּל דָא אֲרַחִים יַתְהוֹן בְּמֵימְרִי כַּד יֶהֶוְויָין גַלְיָין בְּאַרַע בַּעֲלֵי דְבָבֵיהוֹן לָא אֶמְאָסִינוּן בְּמַלְכוּתָא דְבָבֶל וְלָא יִרְחַק מֵימְרִי יַתְהוֹן בְּמַלְכוּתָא דְמָדַי לִמְשֵׁיצַיָא יַתְהוֹן בְּמַלְכוּתָא דְיָוָן לְמִפְסוֹק קְיָימִי עִמְהוֹן בְּמַלְכוּתָא דֶאֱדוֹם אֲרוּם אֲנָא הוּא יְיָ אֱלָהָכוֹן בְּיוֹמוֹי דְגוֹג", "pj_en": "Yet for all this I will have mercy upon them by My Word, when they are captives in the land of their enemies, I will not spurn them away in the kingdom of Babel; nor shall My Word abhor them. in the kingdom of Madai, to destroy them in the kingdom of Javan, or to abolish My covenant with them in the kingdom of Edom; for I am the Lord in the days of Gog.", "tj": "וּלְחוֹד בַּהֲדָא כִּי הֲוֵיתוּן שַׁרְיָן בְּאַרְעָא בַּעֲלֵי דְּבָבֵיכוֹן לָא מְאָסִית יַתְהוֹן בְּמַלְכוּתָא דְבָּבֶל וְלֹא רְחִיקִית יַתְהוֹן בְּמַלְכוּתָא דְיָוָן לְמִיפְסָא קְיָמִי עִמְהוֹן בְּמַלְכוּתָא דֶּאֱדוֹם אֲרוּם אֲנָא הוּא יְיָ אֱלָהָכוֹן בְּיוֹמֵי גּוֹג:", "tj_en": "Yet for this, when dwellers in the land of their enemies, I will not spurn them away in the kingdom of Babel, nor abhor them in the kingdom of Madai, nor destroy them in the kingdom of Javan, (Greece) to abolish My covenant with them in the kingdom of Edom; for He (will be) the Lord your God in the days of Gog.", "rashi": "<b>ואף גם זאת.<\/b> וְאַף אֲפִלּוּ אֲנִי עוֹשֶׂה עִמָּהֶם זֹאת הַפֻּרְעָנוּת אֲשֶׁר אָמַרְתִּי <b>בהיותם בארץ איביהם<\/b>, לֹא אֶמְאָסֵם לְכַלֹּתָם וּלְהָפֵר בְּרִיתִי אֲשֶׁר אִתָּם:", "rashi_en": "ואף גם זאת AND YET FOR ALL THIS — i. e., but also (אף) even though (גם) I shall execute on them this (זאת) punishment which I have mentioned when they shall be in the land of their enemies, I will not reject them to make an end of them and to make void My covenant which has thus far been with them (viz., the covenant 'כי אני ה‎‎ אלהיהם that I, the Lord, would be their God)."}, {"ch": 26, "v": 45, "aliyah": 3, "heb": "וְזָכַרְתִּ֥י לָהֶ֖ם בְּרִ֣ית רִאשֹׁנִ֑ים אֲשֶׁ֣ר הוֹצֵֽאתִי־אֹתָם֩ מֵאֶ֨רֶץ מִצְרַ֜יִם לְעֵינֵ֣י הַגּוֹיִ֗ם לִהְי֥וֹת לָהֶ֛ם לֵאלֹהִ֖ים אֲנִ֥י יְהֹוָֽה׃", "onk": "וְדָכִירְנָא לְהוֹן קְיַם קַדְמָאֵי דִּי אַפֵּקִית יָתְהוֹן מֵאַרְעָא דְמִצְרַיִם לְעֵינֵי עַמְמַיָּא לְמֵהֱוֵי לְהוֹן לֵאלָהָא אֲנָא יְיָ:", "onk_en": "I shall remember for them the covenant of their ancestors whom I brought out of the land of Egypt in sight of the nations to be a God for them, I am Adonoy.", "pj": "וּדְכִירְנָא לְהוֹן קְיַים דְקַיֵימִית עִם אֲבָהַתְהוֹן קֳדָמַי בִּזְמַן דִפְרִיקִית וְאַפֵּיקִית יַתְהוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם וְחַמְיַין כָּל עַמְמַיָא יַת כָּל גְּבוּרְתָּא דַעֲבָדִית לְהוֹן מְטוֹל לְמֶהֱוֵי לְהוֹן לֶאֱלָהָא אֲנָא יְיָ", "pj_en": "And I will remember with them the covenant which I confirmed before Me with their fathers in the time that I brought them out redeemed from the land of Mizraim; when all the nations beheld all the mighty acts which I wrought for them, that I might be their God; I, the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ברית ראשנים.<\/b> שֶׁל שְׁבָטִים (ספרא):", "rashi_en": "ברית ראשנים THE COVENANT OF THE ANCESTORS — i. e. of the twelve Tribes (cf. Sifra, Bechukotai, Chapter 8 10). "}, {"ch": 26, "v": 46, "aliyah": 3, "heb": "אֵ֠לֶּה הַֽחֻקִּ֣ים וְהַמִּשְׁפָּטִים֮ וְהַתּוֹרֹת֒ אֲשֶׁר֙ נָתַ֣ן יְהֹוָ֔ה בֵּינ֕וֹ וּבֵ֖ין בְּנֵ֣י יִשְׂרָאֵ֑ל בְּהַ֥ר סִינַ֖י בְּיַד־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אִלֵּין קְיָמַיָּא וְדִינַיָּא וְאוֹרָיָתָא דִּי יְהַב יְיָ בֵּין מֵימְרֵיהּ וּבֵין בְּנֵי יִשְׂרָאֵל בְּטוּרָא דְסִינַי בִּידָא דְמשֶׁה:", "onk_en": "These are the statutes, the laws and the teachings that Adonoy set between Himself [<b>His Word<\/b>] and between Bnei Yisroel, on Mount Sinai, through the hand of Moshe.", "pj": "אִלֵין קְיָימַיָא וְסִדְרֵי דִינַיָיא וּגְזֵירַת אוֹרַיְיתָא דִיהַב יְיָ בֵּין מֵימְרֵיהּ וּבֵין בְּנֵי יִשְרָאֵל בְּטַוְורָא דְסִינַי עַל יְדָא דְמשֶׁה", "pj_en": "These are the statutes and the orders of the judgments and decrees of the law, which the Lord appointed between His Word and the sons of Israel, in the mountain of Sinai, by the hand of Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>והתורת.<\/b> אַחַת בִּכְתָב וְאַחַת בְּעַל פֶּה, מַגִּיד שֶׁכֻּלָּם נִתְּנוּ לְמֹשֶׁה בְּסִינַי (שם):", "rashi_en": " והתורת AND THE TORAHS… [WHICH GOD GAVE… IN MOUNT SINAI BY THE HAND OF MOSES] — (The plural is used because there are two Torahs:) one in writing and one by word of mouth (the Oral Law). This verse therefore tells us that all (both) of them were given by God to Moses on Sinai (Sifra, Bechukotai, Chapter 8 10)."}, {"ch": 27, "v": 1, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 2, "aliyah": 4, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם אִ֕ישׁ כִּ֥י יַפְלִ֖א נֶ֑דֶר בְּעֶרְכְּךָ֥ נְפָשֹׁ֖ת לַֽיהֹוָֽה׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן גְּבַר אֲרֵי יַפְרֵשׁ נְדַר בְּפֻרְסַן נַפְשָׁתָא קֳדָם יְיָ:", "onk_en": "Speak to Bnei Yisroel and say to them; when a person [orally] expresses a vow pledging valuation of souls, to [<b>before<\/b>] Adonoy.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן גְבַר אֲרוּם יַפְרִישׁ פֵּירוּשׁ דְנִדְרָא בְּעִילוֹי נַפְשָׁתָא לִשְׁמָא דַיְיָ", "pj_en": "Speak with the children of Israel, and say to them: When a man willeth to set apart the separation of a vow, in the valuing of the life unto the name of the Lord,", "tj": "", "tj_en": "", "rashi": "<b>כי יפלא.<\/b> יַפְרִישׁ בְּפִיו:<br><br><b>בערכך נפשת.<\/b> לִתֵּן עֵרֶךְ נְפָשׁוֹת — לוֹמַר עֵרֶךְ דָּבָר שֶׁנַּפְשׁוֹ תְלוּיָה בוֹ עָלַי (עי' ספרא; ערכין ד'):", "rashi_en": "כי יפלא means, if he expressly states by an utterance of his mouth (cf. Rashi on Leviticus 22:21).<br><br>בערכך נפשות — he expressly states that he will give to the Sanctuary the valuation attached to a life by saying, “the payment of the valuation of such and such a thing — that, however, being something upon which its life depends — is incumbent upon me” (Sifra, Bechukotai, Section 3 6; Arakhin 4a)."}, {"ch": 27, "v": 3, "aliyah": 4, "heb": "וְהָיָ֤ה עֶרְכְּךָ֙ הַזָּכָ֔ר מִבֶּן֙ עֶשְׂרִ֣ים שָׁנָ֔ה וְעַ֖ד בֶּן־שִׁשִּׁ֣ים שָׁנָ֑ה וְהָיָ֣ה עֶרְכְּךָ֗ חֲמִשִּׁ֛ים שֶׁ֥קֶל כֶּ֖סֶף בְּשֶׁ֥קֶל הַקֹּֽדֶשׁ׃", "onk": "וִיהֵי פֻרְסָנֵיהּ דְּכוּרָא מִבַּר עֶסְרִין שְׁנִין וְעַד בַּר שִׁתִּין שְׁנִין וִיהֵי פֻרְסָנֵיהּ חַמְשִׁין סִלְעִין דִּכְסַף בְּסִלְעֵי קוּדְשָׁא:", "onk_en": "The valuation for a male shall be, from twenty years of age to sixty years of age your valuation shall be fifty holy silver <i>shekalim<\/i> [<b>selaim<\/b>].", "pj": "וִיהֵי עִלוֹיֵיהּ דְבִיר דְכַר מִן בַּר עַשְרִין שְׁנִין וְעַד בַּר שִׁתִּין שְׁנִין וִיהֵי עֲלוֹיֵיהּ חַמְשִׁין סִילְעִין דִכְסַף בְּסִלְעֵי קוּדְשָׁא", "pj_en": "then his valuation for a male from twenty years old unto sixty years, fifty shekels, in the shekel of the sanctuary, shall be his valuation:", "tj": "", "tj_en": "", "rashi": "<b>והיה ערכך וגו'.<\/b> אֵין עֵרֶךְ זֶה לְשׁוֹן דָּמִים, אֶלָּא בֵּין שֶׁהוּא יָקָר בֵּין שֶׁהוּא זוֹל, כְּפִי שָׁנָיו הוּא הָעֵרֶךְ הַקָּצוּב עָלָיו בְּפָרָשָׁה זוֹ:<br><br><b>ערכך.<\/b> כְּמוֹ עֵרֶךְ, וְכֵפֶל הַכָּפִי\"ן לֹא יָדַעְתִּי מֵאֵיזֶה לָשׁוֹן הוּא:", "rashi_en": "והיה ערכך THEN THY ערכך SHALL BE etc. — This word ערך used throughout this section has not the meaning of דמים, market-value (which varies according to the condition of the market or the condition of the person offered for sale, whilst ערך is a fixed value), but whether he be of high value or of low value, according to his age is the ערך fixed for him in  this section. <br><br>ערכך is the same as ערך (i. e. the second כ''ף is not the suffix of the second person masc. sing.). I do not know what grammatical form the doubling of the כ''ף represents."}, {"ch": 27, "v": 4, "aliyah": 4, "heb": "וְאִם־נְקֵבָ֖ה הִ֑וא וְהָיָ֥ה עֶרְכְּךָ֖ שְׁלֹשִׁ֥ים שָֽׁקֶל׃", "onk": "וְאִם נְקוּבְתָא הִיא וִיהֵי פֻרְסָנֵיהּ תְּלָתִין סִלְעִין:", "onk_en": "If it be a female, the valuation shall be thirty <i>shekalim<\/i> [<b>selaim<\/b>].", "pj": "וְאִין בְּרַת נוּקְבָא הִיא וִיהֵי עֲלוֹיֵיהּ תְּלָתִין סִלְעִין", "pj_en": "but if for a female, his valuation shall be thirty shekels.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 5, "aliyah": 4, "heb": "וְאִ֨ם מִבֶּן־חָמֵ֜שׁ שָׁנִ֗ים וְעַד֙ בֶּן־עֶשְׂרִ֣ים שָׁנָ֔ה וְהָיָ֧ה עֶרְכְּךָ֛ הַזָּכָ֖ר עֶשְׂרִ֣ים שְׁקָלִ֑ים וְלַנְּקֵבָ֖ה עֲשֶׂ֥רֶת שְׁקָלִֽים׃", "onk": "וְאִם מִבַּר חֲמֵשׁ שְׁנִין וְעַד בַּר עֶסְרִין שְׁנִין וִיהֵי פֻרְסָנֵיהּ דְּכוּרָא עֶסְרִין סִלְעִין וְלִנְקוּבְתָּא עֲסַר סִלְעִין:", "onk_en": "If from five years of age to twenty years of age the valuation for a male shall be twenty <i>shekalim<\/i> [<b>selaim<\/b>], and for a female, ten <i>shekalim<\/i> [<b>selaim<\/b>].", "pj": "וְאִין מִבַּר חֲמֵשׁ שְׁנִין וְעַד בַּר עַשְרִין שְׁנִין וִיהֵי עֲלוֹיֵיהּ דְבִיר דְכַר עַשְרִין סִלְעִין וּלְנוּקְבָא עֲשַר סִלְעִין", "pj_en": "And if it be a child from five years until twenty years, his estimation for a male shall be twenty shekels; and for a female, ten shekels.", "tj": "", "tj_en": "", "rashi": "<b>ואם מבן חמש שנים.<\/b> לֹא שֶׁיְּהֵא הַנּוֹדֵר קָטָן — שֶׁאֵין בְּדִבְרֵי קָטָן כְּלוּם — אֶלָּא גָּדוֹל שֶׁאָמַר עֵרֶךְ קָטָן זֶה שֶׁהוּא בֶן חָמֵשׁ שָׁנִים עָלַי (עי' ערכין ב'):", "rashi_en": "ואם מבן חמש שנים AND IF IT BE FROM FIVE YEARS OLD — Not that the person making the vow is a minor (from five to twenty years old), for there is no validity in the words of a minor, but it is speaking of an adult who said, “The payment of the valuation of this child” — who is five years old — “shall be incumbent upon me”."}, {"ch": 27, "v": 6, "aliyah": 4, "heb": "וְאִ֣ם מִבֶּן־חֹ֗דֶשׁ וְעַד֙ בֶּן־חָמֵ֣שׁ שָׁנִ֔ים וְהָיָ֤ה עֶרְכְּךָ֙ הַזָּכָ֔ר חֲמִשָּׁ֥ה שְׁקָלִ֖ים כָּ֑סֶף וְלַנְּקֵבָ֣ה עֶרְכְּךָ֔ שְׁלֹ֥שֶׁת שְׁקָלִ֖ים כָּֽסֶף׃", "onk": "וְאִם מִבַּר יַרְחָא וְעַד בַּר חֲמֵשׁ שְׁנִין וִיהֵי פֻרְסָנֵיהּ דְּכוּרָא חֲמֵשׁ סִלְעִין דִּכְסָף וְלִנְקוּבְתָא פֻרְסָנַהּ תְּלַת סִלְעִין דִּכְסָף:", "onk_en": "If from one month of age to five years of age the valuation of a male shall be five silver <i>shekalim<\/i> [<b>selaim<\/b>] and the valuation for a female is three silver <i>shekalim<\/i> [<b>selaim<\/b>].", "pj": "וְאִין מִבַּר יַרְחָא וְעַד בַּר חֲמֵשׁ שְׁנִין וִיהֵי עֲלוֹיֵיהּ דְבִיר דְכַר חֲמֵשׁ סִלְעִין דִכְסַף וְדִבְרַתָּא נוּקְבָא עִילוֹיֵיהּ תְּלָתָא סִלְעִין דִכְסַף", "pj_en": "But for a child of a month old until five years, his estimation for a male shall be five silver shekels; and for a female, three silver shekels.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 7, "aliyah": 4, "heb": "וְ֠אִ֠ם מִבֶּן־שִׁשִּׁ֨ים שָׁנָ֤ה וָמַ֙עְלָה֙ אִם־זָכָ֔ר וְהָיָ֣ה עֶרְכְּךָ֔ חֲמִשָּׁ֥ה עָשָׂ֖ר שָׁ֑קֶל וְלַנְּקֵבָ֖ה עֲשָׂרָ֥ה שְׁקָלִֽים׃", "onk": "וְאִם מִבַּר שִׁתִּין שְׁנִין וּלְעֵלָּא אִם דְּכוּרָא וִיהֵי פֻרְסָנֵיהּ חֲמֵשׁ עֶסְרֵי סִלְעִין וְלִנְקוּבְתָא עֲסַר סִלְעִין:", "onk_en": "If from sixty and above, if he is a male the valuation shall be fifteen <i>shekalim<\/i> [<b>selaim<\/b>] and for a female, ten <i>shekalim<\/i> [<b>selaim<\/b>].", "pj": "וְאִין מִבַּר שִׁתִּין שְׁנִין וּלְעֵילָא אִין בִּיר דְכַר וִיהֵי עֲלוֹיֵיהּ חֲמֵיסַר סִלְעִין וְלִבְרַתָּא נוּקְבָא עֲשַר סִלְעִין", "pj_en": "Moreover, for a man of sixty years and upwards, his estimation shall be fifteen shekels; and for a female, ten shekels.", "tj": "", "tj_en": "", "rashi": "<b>ואם מבן ששים שנה וגו'.<\/b> כְּשֶׁמַּגִּיעַ לִימֵי הַזִּקְנָה, הָאִשָּׁה קְרוֹבָה לְהֵחָשֵׁב כְּאִישׁ, לְפִיכָךְ הָאִישׁ פּוֹחֵת בְּהִזְדַּקְּנוֹ יוֹתֵר מִשְּׁלִישׁ בְּעֶרְכּוֹ, וְהָאִשָּׁה אֵינָהּ פוֹחֶתֶת אֶלָּא שְׁלִישׁ בְּעֶרְכָּהּ, דְּאָמְרֵי אִינְשֵׁי \"סָבָא בְּבֵיתָא, פַּחָא בְּבֵיתָא, סָבְתָא בְּבֵיתָא סִימָא בְּבֵיתָא וְסִימָנָא טָבָא בְּבֵיתָא\" (ערכין י\"ט):", "rashi_en": "ואם מבן ששים שנה AND IF IT BE FROM SIXTY YEARS OLD [AND ABOVE; IF IT BE A MALE THEN THE VALUATION SHALL BE FIFTEEN SHEKELS, AND FOR THE FEMALE TEN SHEKELS] — When one approaches old age a woman is more likely to be of the same importance as a man therefore a man decreases to beyond a third of his valuation when he becomes old (his ערך being fifty shekels and after sixty only fifteen, which is less then 17, the approximate third of 50), whilst a woman decreases only to exactly a third of her valuation (which was previously thirty shekels, and after sixty becomes ten), because people say (i. e. there is a familiar saying): “An old man in the house is a snare (a nuisance) in the house, an old woman in the house is a treasure in the house and a good omen in the house” (Arakhin 19a)."}, {"ch": 27, "v": 8, "aliyah": 4, "heb": "וְאִם־מָ֥ךְ הוּא֙ מֵֽעֶרְכֶּ֔ךָ וְהֶֽעֱמִידוֹ֙ לִפְנֵ֣י הַכֹּהֵ֔ן וְהֶעֱרִ֥יךְ אֹת֖וֹ הַכֹּהֵ֑ן עַל־פִּ֗י אֲשֶׁ֤ר תַּשִּׂיג֙ יַ֣ד הַנֹּדֵ֔ר יַעֲרִיכֶ֖נּוּ הַכֹּהֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִם מִסְכֵּן הוּא מִפֻּרְסָנֵּיהּ וִיקִימִנֵּיהּ קֳדָם כַּהֲנָא וְיִפְרוֹס יָתֵיהּ כַּהֲנָא עַל מֵימַר דִּי תַדְבֵּק יְדָא דְנוֹדֵרָא יִפְרְסִנֵּיהּ כַּהֲנָא:", "onk_en": "If he is [too] poor to pay the valuation he shall set him[self] [=he shall be presented] before the <i>kohein,<\/i> and the <i>kohein<\/i> will determine his valuation. According to the means of the one who vowed the <i>kohein<\/i> will determine his valuation.", "pj": "וְאִין מִסְכֵּן הוּא מִמֵסַת עֲלוֹיֵיהּ וְיוֹקִמִינֵיהּ קֳדָם כַּהֲנָא וְיַעֲלִינֵיהּ כַּהֲנָא כְּמֵיסַת דְתַדְבֵּיק יַד נוֹדִירָא הֵיכְדֵין יַעֲלִינֵיהּ כַּהֲנָא", "pj_en": "But if he be too poor for (such) a rate of his estimation, he shall stand before the priest; and the priest shall make an estimation for him, according to the ability of his hand, so shall the priest estimate for him.", "tj": "", "tj_en": "", "rashi": "<b>ואם מך הוא.<\/b> שֶׁאֵין יָדוֹ מַשֶּׂגֶת לִתֵּן הָעֵרֶךְ הַזֶּה.<br><br><b>והעמידו.<\/b> לַנֶּעֱרָךְ לִפְנֵי הַכֹּהֵן, וְיַעֲרִיכֶנּוּ לְפִי הַשָּׂגַת יָדוֹ שֶׁל מַעֲרִיךְ:<br><br><b>על פי אשר תשיג.<\/b> לְפִי מַה שֶּׁיֶּשׁ לוֹ יְסַדְּרֶנּוּ, וְיַשְׁאִיר לוֹ כְּדֵי חַיָּיו: מִטָּה, כַּר וְכֶסֶת, וּכְלֵי אֻמָּנוּת; אִם הָיָה חַמָּר מַשְׁאִיר לוֹ חֲמוֹרוֹ (בבא מציעא קי\"ד; ערכין כ\"ג):", "rashi_en": "ואם מך הוא BUT IF HE POOR so that his means are not sufficient to pay this valuation,<br><br>והעמידו THEN THEY SHALL PRESENT HIM — the person made the subject of a valuation, לפני הכהן BEFORE THE PRIEST, and the priest shall set a value on him according to the means of him who promised the valuation (Sifra, Bechukotai, Section 3 14).<br><br>על פי אשר תשיג ACCORDING TO HIS ABILITY — i. e. according to what he possesses shall he (the priest) assess him (the person who has promised the valuation), leaving him sufficient to live upon: a bed, mattress and cushion and tools necessary for his trade; thus, in respect to the latter, if he was an ass-driver (earning a living by carrying loads) he has to leave him his ass (Arakhin 23b)."}, {"ch": 27, "v": 9, "aliyah": 4, "heb": "וְאִ֨ם־בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֧יבוּ מִמֶּ֛נָּה קׇרְבָּ֖ן לַֽיהֹוָ֑ה כֹּל֩ אֲשֶׁ֨ר יִתֵּ֥ן מִמֶּ֛נּוּ לַיהֹוָ֖ה יִֽהְיֶה־קֹּֽדֶשׁ׃", "onk": "וְאִם בְּעִירָא דִּי יְקָרְבוּן מִנַּהּ קֻרְבָּנָא קֳדָם יְיָ כֹּל דִּי יִתֵּן מִנֵּיהּ קֳדָם יְיָ יְהֵי קוּדְשָׁא:", "onk_en": "If [it is] an animal which can be brought as an offering to [<b>before<\/b>] Adonoy, any of it that he will give to [<b>before<\/b>] Adonoy shall become sacred.", "pj": "וְאִין בְּעִירָא דִיקַרְבוּן מִינָהּ קוּרְבָּנָא קֳדָם יְיָ כָּל דְיִתֵּן מִינֵיהּ קֳדָם יְיָ יְהֵי קוּדְשָׁא", "pj_en": "And if it be an animal, of such as are offered as an oblation before the Lord, whatever he giveth of it before the Lord shall be sacred.", "tj": "", "tj_en": "", "rashi": "<b>כל אשר יתן ממנו.<\/b> אָמַר רַגְלָהּ שֶׁל זוֹ עוֹלָה, דְּבָרָיו קַיָּמִין, וְתִמָּכֵר לְצָרְכֵי עוֹלָה, וְדָמֶיהָ חֻלִּין חוּץ מִדְּמֵי אוֹתוֹ הָאֵבֶר (ספרא; ערכין ה'):", "rashi_en": "כל אשר יתן ממנו EVERYTHING THAT A MAN GIVE implies even the case when he said, “the foot of this animal shall be a burnt offering” his words have binding force). It (the animal) is therefore sold for the purpose of a burnt-offering to one who has to bring such an offering and the monies realized by its sale are חולין (non-holy) and are returned to the owner with the exception of the value of that limb (Sifra, Bechukotai, Chapter 9 1; Arakhin 5a; Temurah 11b; Chullin 69b)."}, {"ch": 27, "v": 10, "aliyah": 4, "heb": "לֹ֣א יַחֲלִיפֶ֗נּוּ וְלֹֽא־יָמִ֥יר אֹת֛וֹ ט֥וֹב בְּרָ֖ע אוֹ־רַ֣ע בְּט֑וֹב וְאִם־הָמֵ֨ר יָמִ֤יר בְּהֵמָה֙ בִּבְהֵמָ֔ה וְהָֽיָה־ה֥וּא וּתְמוּרָת֖וֹ יִֽהְיֶה־קֹּֽדֶשׁ׃", "onk": "לָא יְחַלְּפִנֵּיהּ וְלָא יְעִבַּר יָתֵיהּ טַב בְּבִישׁ אוֹ בִישׁ בְּטָב וְאִם חַלָּפָא יְחַלֵּף בְּעִירָא בִּבְעִירָא וִיהֵי הוּא וְחִלּוּפֵיהּ יְהֵי קַדִּישׁ:", "onk_en": "He shall not exchange it [with anothers animal] and he shall not change it [with his own animal] whether it be a good one for a worse one [or] a bad one for a better one. If he did exchange one animal for another animal, then both it and its replacement shall be sacred.", "pj": "לָא יְשַׁלְחְפִינֵיהּ וְלָא יִפְרַג יָתֵיהּ שְׁלִים בִּדְבֵיהּ מוּמָא וּדְבֵיהּ מוּמָא בִּשְׁלִים וְאִין מִיפְרוֹג יִפְרַג בְּעִירָא בִּבְעִירָא וִיהֵי הוּא וּפְרוֹגֵיהּ יְהֵי קוּדְשָׁא", "pj_en": "He shall not alter it nor change it, that which is perfect for that which hath blemish, or that in which there is blemish for the perfect: but if by changing he will exchange animal for animal, both that and the one that is changed shall be consecrate.", "tj": "וְלָא יִפְרַג יָתֵיה טַב בְּבִישׁ אוֹ בִישׁ בְּטַב וְאִין מְפַרְגָא יִפְרַג בְּעִיר בִּבְעִיר וִיהֵי הוּא וּפִירוּגֵּיהּ יְהֵי קַדִּישׁ:", "tj_en": "And he shall not change it, good for bad, or bad for good: but if changing he will exchange animal for animal, both that and his changed one shall be sacred.", "rashi": "<b>טוב ברע.<\/b> תָּם בְּבַעַל מוּם.<br><br><b>או רע בטוב.<\/b> וְכָל שֶׁכֵּן טוֹב בְּטוֹב וְרַע בְּרַע (עי' תמורה ט'):", "rashi_en": "טוב ברע [HE SHALL NEITHER CHANGE IT NOR EXCHANGE IT] A GOOD FOR A BAD — i. e. he shall not give in exchange a perfect animal of a non-sacred character for one devoted to the Sanctuary but having some blemish (cf. Rashi on Temurah 9a on ‎‎‎מתני' טוב ברע), <br><br>‎‎‎או רע בטוב‎ OR A BAD FOR A GOOD — It follows à fortiori that he must not give in exchange a perfect animal for another perfect one, or one with a blemish for another with a blemish (Temurah 9a)."}, {"ch": 27, "v": 11, "aliyah": 4, "heb": "וְאִם֙ כׇּל־בְּהֵמָ֣ה טְמֵאָ֔ה אֲ֠שֶׁ֠ר לֹא־יַקְרִ֧יבוּ מִמֶּ֛נָּה קׇרְבָּ֖ן לַֽיהֹוָ֑ה וְהֶֽעֱמִ֥יד אֶת־הַבְּהֵמָ֖ה לִפְנֵ֥י הַכֹּהֵֽן׃", "onk": "וְאִם כָּל בְּעִירָא מְסָאָבָא דִּי לָא יְקָרְבוּן מִנַּהּ קֻרְבָּנָא קֳדָם יְיָ וִיקִים יָת בְּעִירָא קֳדָם כַּהֲנָא:", "onk_en": "If it is any unclean (blemished) animal which cannot be offered to [<b>before<\/b>] Adonoy, he shall present the animal to the <i>kohein.<\/i>", "pj": "וְאִין כָּל בְּעִירָא מְסָאֲבָא דְלָא יִקְרְבוּן מִינָהּ קוּרְבָּנָא קֳדָם יְיָ וִיקֵם יַת בְּעִירָא קֳדָם כַּהֲנָא", "pj_en": "But if it be an unclean animal, of such as are not offered as an oblation before the Lord, he shall make the animal stand before the priest.", "tj": "וְאִין כָּל בְּעִיר מְסָאָב דְּלָא יִקְרְבוּן מִנֵיהּ קָרְבַּן לִשְׁמָא דַּיְיָ:", "tj_en": "And if it be some unclean animal as such as are not offered as an oblation to the name of the Lord,", "rashi": "<b>ואם כל בהמה טמאה.<\/b> בְּבַעֲלַת מוּם הַכָּתוּב מְדַבֵּר, שֶׁהִיא טְמֵאָה לְהַקְרָבָה, וְלִמֶּדְךָ הַכָּתוּב שֶׁאֵין קָדָשִׁים תְּמִימִים יוֹצְאִין לְחֻלִּין בְּפִדְיוֹן אֶלָּא אִם כֵּן הֻמְּמוּ (שם ל\"ג):", "rashi_en": "ואם כל בהמה טמאה AND IF IT BE ANY בהמה טמאה — Scripture is really speaking here not of an “unclean\" but of a blemished animal  which  ,is just on this account, unclean (i. e. unfit) for sacrificing, and Scripture is telling you that sacred animals which have no blemish cannot again become non-holy (more lit., go forth from the category of holy animals to that of non-holy animals) through redemption except if they become blemished (Temurah 32b; Sifra, Bechukotai, Section 4 1)."}, {"ch": 27, "v": 12, "aliyah": 4, "heb": "וְהֶעֱרִ֤יךְ הַכֹּהֵן֙ אֹתָ֔הּ בֵּ֥ין ט֖וֹב וּבֵ֣ין רָ֑ע כְּעֶרְכְּךָ֥ הַכֹּהֵ֖ן כֵּ֥ן יִהְיֶֽה׃", "onk": "וְיִפְרוֹס כַּהֲנָא יָתַהּ בֵּין טַב וּבֵין בִּישׁ כְּפֻרְסָנָא דְכַהֲנָא כֵּן יְהֵי:", "onk_en": "The <i>kohein<\/i> shall determine its value whether it is good or bad as the <i>kohein<\/i> determines its value for you, so shall it be.", "pj": "וְיַעֲלֵי כַהֲנָא יָתֵיהּ בֵּין טַב לְבֵין בִּישׁ הֵיכְמָא דְיַעֲלֵי כַּהֲנָא הֵיכְדֵין יְהֵי", "pj_en": "And the priest shall value it, whether good or bad; as the priest shall value, so shall it be.", "tj": "וִיסַדֵּר כַּהֲנָא יָתֵיהּ בֵּין טַב וּבֵּין בִישׁ כְּעִילִוֵי דְּכַהֲנָא כֵּן יֶהֱוֵי:", "tj_en": "Let the priest order it, whether good or bad; according to the priest's valuation shall it be.", "rashi": "<b>כערכך הכהן כן יהיה.<\/b> לִשְׁאָר כָּל אָדָם הַבָּא לִקְנוֹתָהּ מִיַּד הֶקְדֵּשׁ:", "rashi_en": "כערכך הכהן כן יהיה AS THE PRIEST VALUES IT, SO SHALL IT BE for any other person who comes to buy it from the Temple treasury (in contrast to the owner himself who, if he redeems it, must add a fifth to the valuation, as stated in the next verse)."}, {"ch": 27, "v": 13, "aliyah": 4, "heb": "וְאִם־גָּאֹ֖ל יִגְאָלֶ֑נָּה וְיָסַ֥ף חֲמִישִׁת֖וֹ עַל־עֶרְכֶּֽךָ׃", "onk": "וְאִם מִפְרַק יִפְרְקֻנַּהּ וְיוֹסֵף חֻמְשֵׁיהּ עַל פֻּרְסָנֵיהּ:", "onk_en": "If he will indeed redeem it he shall add on one fifth to its valuation.", "pj": "וְאִם מִפְרוֹק יִפְרְקִינֵיהּ וְיוֹסֵף חוֹמֶשׁ דְמֵיהּ עַל עַלוֹיֵיהּ", "pj_en": "But if he would redeem it, let him add a fifth of its price upon that of its valuation.", "tj": "וְיוֹסֵף חוּמְשֵׁיהּ דָּמוֹ עַל עִילַוֵּיהּ:", "tj_en": "And let him add a fifth of its price above its valuation.", "rashi": "<b>ואם גאל יגאלנה.<\/b> בַּבְּעָלִים הֶחֱמִיר הַכָּתוּב לְהוֹסִיף חֹמֶשׁ, וְכֵן בְּמַקְדִּישׁ בַּיִת, וְכֵן בְּמַקְדִּישׁ אֶת הַשָּׂדֶה, וְכֵן בְּפִדְיוֹן מַעֲשֵֹר שֵׁנִי — הַבְּעָלִים מוֹסִיפִין חֹמֶשׁ וְלֹא שְׁאָר כָּל אָדָם (שם כ\"ה):", "rashi_en": "ואם גאל יגאלנה BUT IF HE WILL AT ALL REDEEM IT [THEN HE SHALL ADD A FIFTH …] — In respect to the owner Scripture is more stringent by requiring him to pay an additional fifth. And similarly in the case of one who dedicates a house to the Sanctuary (vv. 14, 15) and so, too, in the case of one who dedicates his field (v. 19), and similarly in the case of redeeming מעשר שני, “the Second Tithe”, the owner must add a fifth to their real value when redeeming them; but no other person has to do this (Sifra, Bechukotai, Chapter 10 7; Arakhin 25a)."}, {"ch": 27, "v": 14, "aliyah": 4, "heb": "וְאִ֗ישׁ כִּֽי־יַקְדִּ֨שׁ אֶת־בֵּית֥וֹ קֹ֙דֶשׁ֙ לַֽיהֹוָ֔ה וְהֶעֱרִיכוֹ֙ הַכֹּהֵ֔ן בֵּ֥ין ט֖וֹב וּבֵ֣ין רָ֑ע כַּאֲשֶׁ֨ר יַעֲרִ֥יךְ אֹת֛וֹ הַכֹּהֵ֖ן כֵּ֥ן יָקֽוּם׃", "onk": "וּגְבַר אֲרֵי יַקְדֵּשׁ יָת בֵּיתֵיהּ קוּדְשָׁא קֳדָם יְיָ וְיִפְרְסִנֵּיהּ כַּהֲנָא בֵּין טַב וּבֵין בִּישׁ כְּמָא דִּי יִפְרוֹס יָתֵיהּ כַּהֲנָא כֵּן יְקוּם:", "onk_en": "If a man will consecrate his house as being sacred to [<b>before<\/b>] Adonoy, the <i>kohein<\/i> shall determine its value, whether it is good or bad; as the <i>kohein<\/i> determines its value, so shall it be established.", "pj": "וּגְבַר אַרוּם יִקְדַשׁ יַת בֵּיתֵיהּ קוּדְשָׁא קֳדָם יְיָ וְיַעֲלִינֵיהּ כַּהֲנָא בֵּין טַב לְבֵין בִּישׁ הֵיכְמָא דְמַעֲלֵי כַּהֲנָא הֵיכְדִין יְקוּם", "pj_en": "When a man would consecrate his house, as a consecrated thing before the Lord; the priest shall value it, whether good or bad; according as the priest shall estimate, so shall it stand.", "tj": "קוּדְשָׁא לִשְׁמָא דַּיְיָ וִיסַדֵּר כַּהֲנָא הֵיךְ מַה דִּי סְדַר יָתֵיהּ:", "tj_en": "A sanctified thing unto the name of the Lord: then the priest shall order. As the priest hath ordered it shall be.", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 15, "aliyah": 4, "heb": "וְאִ֨ם־הַמַּקְדִּ֔ישׁ יִגְאַ֖ל אֶת־בֵּית֑וֹ וְ֠יָסַ֠ף חֲמִישִׁ֧ית כֶּֽסֶף־עֶרְכְּךָ֛ עָלָ֖יו וְהָ֥יָה לֽוֹ׃", "onk": "וְאִם דְּאַקְדֵּשׁ יִפְרוֹק יָת בֵּיתֵיהּ וְיוֹסֵף חֹמֶשׁ כְּסַף פֻּרְסָנֵיהּ עֲלוֹהִי וִיהֵי לֵיהּ:", "onk_en": "If he who consecrated [his house] wishes to redeem his house, he shall add one fifth to its valuation money in addition to [the valuation], and [then] it belongs to him.", "pj": "וְאִם דֵין דְמַקְדִישׁ יִפְרוֹק יַת בֵּיתֵיהּ וְיוֹסֵף חוֹמֶשׁ כְּסַף עֲלוֹיֵיהּ עֲלוֹי וִיהֵי דִילֵיהּ", "pj_en": "And if he who hath consecrated would redeem his house, let him add a fifth of the price of its valuation thereunto, and it shall be his.", "tj": "וְאִין דִּי דְאַקְדִישׁ וגו'. חוֹמֶשׁ כְּסַף עִילַוֵּיהּ עֲלוֹי וִיהֵי דִּידֵיהּ:", "tj_en": "And if he who hath made sacred: A fifth of the price of its valuation upon it, and it shall be his.", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 16, "aliyah": 5, "heb": "וְאִ֣ם&thinsp;<b>׀<\/b> מִשְּׂדֵ֣ה אֲחֻזָּת֗וֹ יַקְדִּ֥ישׁ אִישׁ֙ לַֽיהֹוָ֔ה וְהָיָ֥ה עֶרְכְּךָ֖ לְפִ֣י זַרְע֑וֹ זֶ֚רַע חֹ֣מֶר שְׂעֹרִ֔ים בַּחֲמִשִּׁ֖ים שֶׁ֥קֶל כָּֽסֶף׃", "onk": "וְאִם מֵחֲקַל אַחֲסַנְתֵּיהּ יַקְדִּישׁ גְּבַר קָדָם יְיָ וִיהֵי פֻרְסָנֵיהּ לְפוּם זַרְעֵיהּ בַּר זְרַע כּוּר שְׂעוֹרִין בְּחַמְשִׁין סִלְעִין דִּכְסָף:", "onk_en": "If from his ancestral field a man will consecrate to [<b>before<\/b>] Adonoy its valuation shall be according to the measure of its seed; [at the rate of] one chomer [<b>kor<\/b>] of barley seed per fifty silver <i>shekalim<\/i> [<b>selaim<\/b>].", "pj": "וְאִין מִן חֲקַל אַחֲסַנְתֵּיהּ יִקְדַשׁ גְבַר קֳדָם יְיָ וִיהֵי עֲלוֹיֵיהּ כְּמִיסַת זַרְעֵיהּ אֲתַר דְמִזְרַע בֵּית כּוֹר שְעוֹרִין בְּחַמְשִׁין סַלְעִין דִכְסַף", "pj_en": "And if a man would dedicate (a portion) of the field of his inheritance before the Lord, the valuation of it shall be according to the measure of its seed: a space on which may be sown a kor (seventy-five and a half pints) of barley (shall be considered) worth fifty shekels of silver.", "tj": "וְאִין מֵחֲקַל אַחֲסַנְתֵּיהּ יַפְרִישׁ גְּבַר לִשְׁמָא דַּיְיָ וְיֶהֱוֵי עִילַוֵּיהּ לְפוּם זַרְעֵיה זְרַע חוֹמֶר דִּשְעוֹרִין:", "tj_en": "And if a man would separate (a portion) of his field of inheritance unto the Name of the Lord, its valuation shall be according to its sowing, a chomer of barley seed.", "rashi": "<b>והיה ערכך לפי זרעו.<\/b> לֹא כְּפִי שָׁוְיָהּ, אַחַת שָׂדֶה טוֹבָה וְאַחַת שָׂדֶה רָעָה פִּדְיוֹן הֶקְדֵּשָׁן שָׁוֶה — בֵּית כֹּר שְׂעוֹרִים בַּחֲמִשִּׁים שְׁקָלִים — כָּךְ גְּזֵרַת הַכָּתוּב, וְהוּא שֶׁבָּא לְגָאֳלָהּ בִּתְחִלַּת הַיּוֹבֵל. וְאִם בָּא לְגָאֳלָהּ בְאֶמְצָעוֹ, נוֹתֵן לְפִי הַחֶשְׁבּוֹן סֶלַע וּפֻנְדְּיוֹן לְשָׁנָה, לְפִי שֶׁאֵינָהּ הֶקְדֵּשׁ אֶלָּא לְמִנְיַן שְׁנוֹת הַיּוֹבֵל, שֶׁאִם נִגְאֲלָה הֲרֵי טוֹב, וְאִם לָאו הַגִּזְבָּר מוֹכְרָהּ בַּדָּמִים הַלָּלוּ לְאַחֵר, וְעוֹמֶדֶת בְּיַד הַלּוֹקֵחַ עַד הַיּוֹבֵל כִּשְׁאָר כָּל הַשָּׂדוֹת הַמְּכוּרוֹת, וּכְשֶׁהִיא יוֹצְאָה מִיָּדוֹ חוֹזֶרֶת לַכֹּהֲנִים שֶׁל אוֹתוֹ מִשְׁמָר שֶׁהַיּוֹבֵל פּוֹגֵעַ בּוֹ, וּמִתְחַלֶּקֶת בֵּינֵיהֶם, זֶהוּ הַמִּשְׁפָּט הָאָמוּר בְּמַקְדִּישׁ שָׂדֶה, וְעַכְשָׁו אֲפָרְשֶׁנּוּ עַל סֵדֶר הַמִּקְרָאוֹת:", "rashi_en": "והיה ערכך לפי זרעו  [AND IF A MAN SHALL SANCTIFY SOME OF THE FIELD OF HIS POSSESSION] THEN THE VALUATION SHALL BE ACCORDING TO THE SEED THEREOF (i. e., according to the quantity of seed that can be grown in it) — not according to its value; but whether it is a good field or a bad field the money for redeeming it from its holy state is the same: an area requiring a Khor of barley seed (the equivalent of a חמר שערים mentioned in the text) is redeemable by fifty shekels (in the case of other seed the area redeemable by this sum is different) (cf. Arakhin 14a). Such is the enactment of Scripture (God). But this is only in the case that he comes to redeem it at the beginning of the Jubilee-period, but if he comes to redeem it in the middle of it he has only to pay according to the reckoning of one Selah (shekel) and a pundion (one forty-eighth of a shekel) for each year remaining in that Jubilee-period (cf. Rashi on v. 18); because, after all, it is the property of the Temple treasury only for the number of years contained in the Jubilee-period from the time when he sold it, so that if it was redeemed by the owner at any time during this period, well and good (the Temple treasury suffered no loss), and if not, the treasurer can sell it for the very same price to another person, when it remains in the hands of the purchaser till the Jubilee just like any other field sold right out (cf. vv. 20, 21). When it leaves his possession in the Jubilee year, it does not return to the Treasury, but it passes into the possession of the priests of that “Mishmar” (shift officiating) during whose turn the Jubilee happens to fall and is divided amongst them. This, in brief, is the law concerning one who dedicates a field to the Temple Treasury; and now I shall explain it, following the order of the verses."}, {"ch": 27, "v": 17, "aliyah": 5, "heb": "אִם־מִשְּׁנַ֥ת הַיֹּבֵ֖ל יַקְדִּ֣ישׁ שָׂדֵ֑הוּ כְּעֶרְכְּךָ֖ יָקֽוּם׃", "onk": "אִם מִשַּׁתָּא דְיוֹבֵלָא יַקְדֵּשׁ חַקְלֵיהּ כְּפֻרְסָנֵיהּ יְקוּם:", "onk_en": "If immediately after the jubilee year he consecrates his field it shall be established according to its vaulation.", "pj": "אִין מִשַׁתָּא דְיוֹבֵלָא יִקְדַשׁ חַקְלָא הֵי כְּעִילוֹיֵיהּ יְקוּם", "pj_en": "If he will dedicate the ground from the year of Jubela, it shall stand according to its valuation.", "tj": "וְאִין משַׁתָּא דְּיוֹבְלָא יַפְרֵשׁ חַקְלֵיהּ כְּעִילַוֵּיהּ יְקוּם:", "tj_en": "And if he separate his field from the year of Jubela, according to its value it shall stand.", "rashi": "<b>אם משנת היבל יקדיש וגו'.<\/b> אִם מִשֶּׁעָבְרָה שְׁנַת הַיּוֹבֵל מִיָּד הִקְדִּישָׁהּ, וּבָא זֶה לְגָאֳלָהּ מִיָּד.<br><br><b>כערכך יקום.<\/b> כָּעֵרֶךְ הַזֶּה הָאָמוּר יִהְיֶה — חֲמִשִּׁים כֶּסֶף יִתֵּן:", "rashi_en": "אם משנת היבל יקדיש IF HE SANCTIFY [HIS FIELD] FROM THE YEAR OF JUBILEE — i. e. if as soon as the Jubilee-period was past he immediately dedicates it to the Temple treasury (so that the field could remain in the possession of the Sanctuary for a complete Jubilee-period), and he comes to redeem it immediately (so that the Treasury had no usufruct of the field at all).<br><br>כערכך יקום ACCORDING TO THE VALUATION IT SHALL STAND — i. e. according to that valuation above mentioned shall it be — 50 shekel shall he give [for each area requiring a Khor of barley seed]."}, {"ch": 27, "v": 18, "aliyah": 5, "heb": "וְאִם־אַחַ֣ר הַיֹּבֵל֮ יַקְדִּ֣ישׁ שָׂדֵ֒הוּ֒ וְחִשַּׁב־ל֨וֹ הַכֹּהֵ֜ן אֶת־הַכֶּ֗סֶף עַל־פִּ֤י הַשָּׁנִים֙ הַנּ֣וֹתָרֹ֔ת עַ֖ד שְׁנַ֣ת הַיֹּבֵ֑ל וְנִגְרַ֖ע מֵֽעֶרְכֶּֽךָ׃", "onk": "וְאִם בָּתַר יוֹבֵלָא יַקְדֵּשׁ חַקְלֵיהּ וִיחַשֵּׁב לֵיהּ כַּהֲנָא יָת כַּסְפָּא עַל מֵימַר שְׁנַיָּא דְּאִשְׁתָּאָרָן עַד שַׁתָּא דְיוֹבֵלָא וְיִתִּמְנַע מִפֻּרְסָנֵיהּ:", "onk_en": "If after the jubilee he consecrates his field, then the <i>kohein<\/i> shall calculate the money [due] according to the remaining years until the jubilee year, and its valuation should be reduced accordingly.", "pj": "וְאִין בָּתַר יוֹבֵלָא יַקְדִישׁ חַקְלֵיהּ וִידַיֵיק לֵיהּ כַּהֲנָא יַת סְכוּם כַּסְפָּא כְּמִיסַת שְׁנַיָיא דְמִשְׁתַּיְירָן עַד שַׁתָּא דְיוֹבֵלָא וּמְנַכֵּי לֵיהּ מִן עֲלוֹיֵיהּ", "pj_en": "But if he will dedicate his field after the year of Jubela, the priest shall compute with him the sum of the money according to the proportion of years that remain unto the next Jubela year, and shall abate it from the valuation.", "tj": "", "tj_en": "", "rashi": "<b>ואם אחר היבל יקדיש.<\/b> וְכֵן אִם הִקְדִּישָׁהּ מִשְּׁנַת הַיֹּבֵל וְנִשְׁתַּהָת בְּיַד גִּזְבָּר, וּבָא זֶה לְגָאֳלָהּ אַחַר הַיּוֹבֵל.<br><br><b>וחשב לו הכהן את הכסף על פי השנים הנותרת.<\/b> כְּפִי חֶשְׁבּוֹן; כֵּיצַד? הֲרֵי קָצַב דָּמֶיהָ שֶׁל אַרְבָּעִים וְתֵשַׁע שָׁנָה חֲמִשִּׁים שֶׁקֶל, הֲרֵי שֶׁקֶל לְכָל שָׁנָה וְשֶׁקֶל יָתֵר עַל כֻּלָּן, וְהַשֶּׁקֶל אַרְבָּעִים וּשְׁמוֹנָה פֻנְדְּיוֹן, הֲרֵי סֶלַע וּפֻנְדְּיוֹן לְשָׁנָה, אֶלָּא שֶׁחָסֵר פֻּנְדְּיוֹן אֶחָד לְכֻלָּן, וְאָמְרוּ רַבּוֹתֵינוּ שֶׁאוֹתוֹ פֻּנְדְּיוֹן קַלְבּוֹן לִפְרוֹטְרוֹט, וְהַבָּא לִגְאֹל, יִתֵּן סֶלַע וּפֻנְדְּיוֹן לְכָל שָׁנָה לַשָּׁנִים הַנּוֹתָרוֹת עַד שְׁנַת הַיּוֹבֵל (עי' ספרא; ערכין כ\"ד):<br><br><b>ונגרע מערכך.<\/b> מִנְיַן הַשָּׁנִים שֶׁמִּשְּׁנַת הַיּוֹבֵל עַד שְׁנַת הַפִּדְיוֹן:", "rashi_en": "ואם אחר היבל יקדיש BUT IF HE SANCTIFY [HIS FIELD] AFTER (i. e. some years after) THE JUBILEE, — and similarly, of course, if he dedicated it from the year of (i. e. immediately after) the Jubilee, — and in either case it remained for a time in the possession of the treasurer and then this man comes to redeem it some years after the Jubilee,<br><br>וחשב לו הכהן את הכסף על פי השנים הנותרת THEN THE PRIEST SHALL RECKON FOR HIM THE MONEY ACCORDING TO THE YEARS THAT ARE LEFT — it must be according to a reckoning. How is it to be done? You see, it (Scripture) has fixed the value of forty-nine years at fifty shekels, that is, one shekel for each year and one additional shekel for all of them (for all the years together). Now a shekel is forty-eight pundion; that gives one selah (shekel) and one pundion for each year, except that there is one pundion short for all the years (reckoning the price per year as the Torah prescribes, he pays forty-nine shekels and forty-nine pundion, equal to fifty shekels and one pundion whereas really he should pay fifty shekels, which is one pundion less than the calculation based upon the yearly rate. Our Rabbis said that that pundion is the commission for the money-changing (Bekhorot 50a), and therefore if he comes to redeem the field some years after the Jubilee, he must give a selah and a pundion for each year of those years that remain until the Jubilee year (Sifra, Bechukotai, Chapter 10 10; Arakhin 24b).<br><br>ונגרע מערכך AND THERE SHALL BE ABATED FROM THE VALUATION the number of years that have elapsed from the Jubilee year until the year when the redemption takes place."}, {"ch": 27, "v": 19, "aliyah": 5, "heb": "וְאִם־גָּאֹ֤ל יִגְאַל֙ אֶת־הַשָּׂדֶ֔ה הַמַּקְדִּ֖ישׁ אֹת֑וֹ וְ֠יָסַ֠ף חֲמִשִׁ֧ית כֶּֽסֶף־עֶרְכְּךָ֛ עָלָ֖יו וְקָ֥ם לֽוֹ׃", "onk": "וְאִם מִפְרַק יִפְרוֹק יָת חַקְלָא דְּאַקְדֵּשׁ יָתֵיהּ וְיוֹסֵף חֹמֶשׁ כְּסַף פֻּרְסָנֵיהּ עֲלוֹהִי וִיקוּם לֵיהּ:", "onk_en": "If he will [indeed] redeem the field, he who consecrated it, shall add one fifth to its monetary valuation, and it is then established as his.", "pj": "וְאִין מִפְרוֹק יִפְרוֹק יַת חַקְלָא דֵין דְאַקְדֵישׁ יָתֵיהּ וְיוֹסִיף חוֹמֶשׁ כְּסַף עֲלוֹיֵיהּ עֲלוֹי וִיקוּם לֵיהּ", "pj_en": "And if he would redeem the field that he had consecrated, let him add one fifth of the money upon its valued price, and it shall be confirmed to him.", "tj": "וְאִין מִיפְרַק יִפְרוֹק יַת חַקְלָא דֵּין דְּמַקְדִישׁ יָתֵיהּ וְיָסַף חוֹמֶשׁ סִלְעִין דִּכְסַף עִילַוֵּיהּ עֲלוֹי וְיֶהֱוֵי לֵיהּ:", "tj_en": "And if he would redeem that field which has been consecrated, let him add a fifth of the silver shekes above its estimation, and it shall be his.", "rashi": "<b>ואם גאל יגאל.<\/b> הַמַּקְדִּישׁ אוֹתוֹ, יוֹסִיף חֹמֶשׁ עַל הַקִּצְבָּה הַזֹּאת:", "rashi_en": "ואם גאל יגאל AND IF HE WILL IN ANY WAY REDEEM IT “he” means, the man who dedicated it; then he shall add a fifth part to this fixed price (not a fifth of the fifty shekels, but a fifth of the value determined by this calculation is to be added to that value)."}, {"ch": 27, "v": 20, "aliyah": 5, "heb": "וְאִם־לֹ֤א יִגְאַל֙ אֶת־הַשָּׂדֶ֔ה וְאִם־מָכַ֥ר אֶת־הַשָּׂדֶ֖ה לְאִ֣ישׁ אַחֵ֑ר לֹ֥א יִגָּאֵ֖ל עֽוֹד׃", "onk": "וְאִם לָא יִפְרוֹק יָת חַקְלָא וְאִם זַבִּין יָת חַקְלָא לִגְבַר אָחֳרָן לָא יִתְפָּרָק עוֹד", "onk_en": "If he does not redeem the field and if he sells the field to another person, it shall not longer be redeemable.", "pj": "וְאִין לָא יִפְרוֹק יַת חַקְלָא וְאִין זַבִּין יַת חַקְלָא לִגְבַר חוֹרַן לָא יִתְפְּרֵק תּוּב", "pj_en": "But if he will not redeem the field, but sell it to another man, it shall not be redeemed again:", "tj": "", "tj_en": "", "rashi": "<b>ואם לא יגאל את השדה.<\/b> הַמַּקְדִּישׁ:<br><br><b>ואם מכר.<\/b> הַגִּזְבָּר:<br><br><b>את השדה לאיש אחר לא יגאל עוד.<\/b> לָשׁוּב בְּיַד הַמַּקְדִּישׁ:", "rashi_en": "ואם לא יגאל את השדה AND IF HE WILL NOT REDEEM THE FIELD— “he” means, the man who dedicated it,<br><br>ואם מכר OR IF HE HATH SOLD — “he”: the treasurer of the Temple property has sold (Arakhin 25b),<br><br>את השדה לאיש אחר לא יגאל עוד THE FIELD TO ANOTHER MAN, IT SHALL NOT BE REDEEMED ANY MORE so as to return into the possession of him who dedicated it."}, {"ch": 27, "v": 21, "aliyah": 5, "heb": "וְהָיָ֨ה הַשָּׂדֶ֜ה בְּצֵאת֣וֹ בַיֹּבֵ֗ל קֹ֛דֶשׁ לַֽיהֹוָ֖ה כִּשְׂדֵ֣ה הַחֵ֑רֶם לַכֹּהֵ֖ן תִּהְיֶ֥ה אֲחֻזָּתֽוֹ׃", "onk": "וִיהֵי חַקְלָא בְּמִפְּקֵיהּ בְּיוֹבֵלָא קוּדְשָׁא קֳדָם יְיָ כַּחֲקַל חֶרְמָא לְכַהֲנָא תְּהֵי אַחֲסַנְתֵּיהּ:", "onk_en": "When the field is then released by the jubilee it becomes sacred to [<b>before<\/b>] Adonoy, just as a field that was consecrated, it shall belong to the <i>kohein,<\/i> [as] his possession.", "pj": "וִיהֵי חַקְלָא בְּמִפְקֵיהּ בְּיוֹבְלָא קוּדְשָׁא קֳדָם יְיָ הֵי כַחֲקַל אַפְרָשָׁא לְכַהֲנָא תְּהֵי אַחְסַנְתֵּיהּ", "pj_en": "the field, when it goeth out at the Jubela, shall be sacred before the Lord; as a field separated for the priest it shall be his inheritance.", "tj": "קוּדְשָׁא לִשְׁמָא דַּיְיָ כַּחֲקַל אַפְרָשׁוּ:", "tj_en": "It shall be a sanctified thing unto the Lord, as a field of separation.", "rashi": "<b>והיה השדה בצאתו ביבל.<\/b> מִיַּד הַלּוֹקְחוֹ מִן הַגִּזְבָּר, כְּדֶרֶךְ שְׁאָר שָׂדוֹת הַיּוֹצְאוֹת מִיַּד לוֹקְחֵיהֶם בַּיּוֹבֵל:<br><br><b>קדש לה'.<\/b> לֹא שֶׁיָּשׁוּב לְהֶקְדֵּשׁ בֶּדֶק הַבַּיִת, לְיַד הַגִּזְבָּר, אֶלָּא <b>כשדה החרם<\/b> הַנָּתוּן לַכֹּהֲנִים — שֶׁנֶּאֱמַר \"כָּל חֵרֶם בְּיִשְׂרָאֵל לְךָ יִהְיֶה\" (במדבר י\"ח) — אַף זוֹ תִּתְחַלֵּק לַכֹּהֲנִים שֶׁל אוֹתוֹ מִשְׁמָר שֶׁיּוֹם הַכִּפּוּרִים שֶׁל יוֹבֵל פּוֹגֵעַ בּוֹ (ערכין כ\"ח):", "rashi_en": "והיה השדה בצאתו ביבל BUT THE FIELD, WHEN IT GOETH OUT IN THE JUBILEE from the possession of him who purchased it from the treasurer, just as is the way with other fields in the Jubilee which also go out from the possession of those who purchase them, SHALL BE <br><br>קדש לה׳ HOLY UNTO THE LORD; — not that it shall return to the Temple treasury that provides for the Temple repair, into the treasurer’s hand, but, כשדה החרם it shall be AS A FIELD DOOMED, which has to be given to the preists, as it is said, (Numbers 18:14) “Every thing doomed (חרם) in Israel shall be thine” (i. e. Aaron’s to whom this was spoken); this field, too, shall be divided amongst the priests of that “Mishmar” during whose turn the Day of Atonement of the Jubilee-year happens to fall (Arakhin 28b)."}, {"ch": 27, "v": 22, "aliyah": 6, "heb": "וְאִם֙ אֶת־שְׂדֵ֣ה מִקְנָת֔וֹ אֲשֶׁ֕ר לֹ֖א מִשְּׂדֵ֣ה אֲחֻזָּת֑וֹ יַקְדִּ֖ישׁ לַֽיהֹוָֽה׃", "onk": "וְאִם יָת חֲקַל זְבִינוֹהִי דִּי לָא מֵחֲקַל אַחֲסַנְתֵּיהּ יַקְדֵּשׁ קֳדָם יְיָ:", "onk_en": "If it is a field that he purchased, that is not his ancestral field, [that] he consecrates to [<b>before<\/b>] Adonoy.", "pj": "וְאִין יַת חֲקִיל זְבִינוֹי דְלָא מִן חֲקִיל אַחְסַנְתֵּיהּ יַקְדִישׁ קֳדָם יְיָ", "pj_en": "And if he would consecrate before the Lord a field which he hath bought, and which is not of the land of his inheritance,", "tj": "וְאִין יַת חֲקַל זְבִינֵיה יַקְדִישׁ לִשְׁמָא דַּיְיָ:", "tj_en": "And if he would consecrate a purchased field unto the Name of the Lord,", "rashi": "<b>ואם את שדה מקנתו וגו'.<\/b> חִלּוּק יֵשׁ בֵּין שְׂדֵה מִקְנָה לִשְׂדֵה אֲחֻזָּה, שֶׁשְּׂדֵה מִקְנָה לֹא תִתְחַלֵּק לַכֹּהֲנִים בַּיּוֹבֵל, לְפִי שֶׁאֵינוֹ יָכוֹל לְהַקְדִּישָׁהּ אֶלָּא עַד הַיּוֹבֵל, שֶׁהֲרֵי בַיּוֹבֵל הָיְתָה עֲתִידָה לָצֵאת מִיָּדוֹ וְלָשׁוּב לַבְּעָלִים, לְפִיכָךְ אִם בָּא לְגָאֳלָהּ, יִגְאַל בַּדָּמִים הַלָּלוּ הַקְּצוּבִים לִשְׂדֵה אֲחֻזָּה; וְאִם לֹא יִגְאַל, וְיִמְכְּרֶנָּה גִּזְבָּר לְאַחֵר, אוֹ אִם יִגְאַל הוּא <b>בשנת היובל ישוב השדה לאשר קנהו מאתו<\/b> — אוֹתוֹ שֶׁהִקְדִּישׁ, וּפֶן תֹּאמַר \"לַאֲשֶׁר קָנָהוּ\" הַלּוֹקֵחַ הַזֶּה הָאַחֲרוֹן מֵאִתּוֹ, וְזֶהוּ הַגִּזְבָּר, לְכָךְ הֻצְרַךְ לוֹמַר <b>לאשר לו אחזת הארץ<\/b> — מִירֻשַּׁת אָבוֹת, וְזֶהוּ בְּעָלִים הָרִאשׁוֹנִים שֶׁמְּכָרוּהָ לַמַּקְדִּישׁ (ערכין כ\"ו):", "rashi_en": "ואם את שדה ‎'מקנתו וגו‎‎ BUT IF [HE SANCTIFY…] A FIELD OF HIS PURCHASE [WHICH IS NOT THE FIELD OF HIS POSSESSION, THEN etc.] — There is a difference between a “field of one’s purchase” and “a field of one’s possession” inasmuch as a “field of purchase” is not divided amongst the priests in the Jubilee (if it was sold by the treasurer and the purchaser has to return it at the Jubilee), because one has the right to dedicate it only until the Jubilee, for under any circumstances it was to go out from his possession and return to the original owner in the Jubilee; therefore if he comes to redeem it, he redeems it at the price stipulated for a “field of possession” (cf. משנה למלך on Maimonides   הל' ערכין פ\"ד הלכה כ\"ו who explains where Rashi derives it from that he has to pay the price fixed for a שדה אחוזה). And whether he does not redeem it and the treasurer sells it to another person, or whether he does redeem it, (some editions have: ואם לא יגאל; cf. Arakhin 28b) בשנת היבל ישוב השדה לאשר קנהו מאתו IN THE YEAR OF THE JUBILEE THE FIELD SHALL RETURN UNTO HIM FROM WHOM HE HATH BOUGHT IT — i. e. unto him from whom he that has dedicated it has bought it. And in order that you should not think that the words: the field shall return לאשר קנהו, mean, it shall return unto him from whom this last purchaser has bought it, — and that would be the treasurer (since he is the person from whom it was last acquired), Scripture was compelled to state לאשר לו אחזת הארץ EVEN TO HIM TO WHOM THE POSSESSION OF THE FIELD BELONGS from that which his ancestors have bequeathed to him, and this can only be the original owner who had sold it to him who sanctified it (Arakhin 26a, Arakhin 26b). "}, {"ch": 27, "v": 23, "aliyah": 6, "heb": "וְחִשַּׁב־ל֣וֹ הַכֹּהֵ֗ן אֵ֚ת מִכְסַ֣ת הָֽעֶרְכְּךָ֔ עַ֖ד שְׁנַ֣ת הַיֹּבֵ֑ל וְנָתַ֤ן אֶת־הָעֶרְכְּךָ֙ בַּיּ֣וֹם הַה֔וּא קֹ֖דֶשׁ לַיהֹוָֽה׃", "onk": "וִיחַשֶּׁב לֵיהּ כַּהֲנָא יָת מִנְיַן פֻּרְסָנֵּיהּ עַד שַׁתָּא דְיוֹבֵלָא וְיִתֵּן יָת פֻּרְסָנֵיהּ בְּיוֹמָא הַהוּא קוּדְשָׁא קֳדָם יְיָ:", "onk_en": "The <i>kohein<\/i> will calculate for him the amount of its valuation until the jubilee year, and on that day he shall give its valuation as something sacred to [<b>before<\/b>] Adonoy.", "pj": "וִידַיֵיק לֵיהּ כַּהֲנָא יַת סְכוּם דְמֵי עֲלוֹיֵיהּ עַד שַׁתָּא דְיוֹבְלָא וְיִתֵּן יַת עֲלוֹיֵיהּ בְּיוֹמָא הַהוּא קוּדְשָׁא קֳדָם יְיָ", "pj_en": "then the priest shall compute with him the amount of the price of its valuation until the year of Jubela; and he shall give its value on that day, as a consecrated thing before the Lord.", "tj": "וְיַחְשִׁיב לֵיה כַּהֲנָא יַת אַפְרָשׁוּת עִילַוֵּיהּ עַד שַׁתָּא דְּיוֹבְלָא וְיִתֵּן יַת אַפְרָשׁוּת עִילַוֵּיהּ בְּיוֹמָא הָדֵּין קוֹדֶשׁ לִשְׁמָא דַּיְיָ:", "tj_en": "Then the priest shall compute with him the value of the separation unto the year of Jubela, and he shall give the separation of the value on that day, a holy thing unto the Name of the Lord.", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 24, "aliyah": 6, "heb": "בִּשְׁנַ֤ת הַיּוֹבֵל֙ יָשׁ֣וּב הַשָּׂדֶ֔ה לַאֲשֶׁ֥ר קָנָ֖הוּ מֵאִתּ֑וֹ לַאֲשֶׁר־ל֖וֹ אֲחֻזַּ֥ת הָאָֽרֶץ׃", "onk": "בְּשַׁתָּא דְיוֹבֵלָא יְתוּב חַקְלָא לְדִזְבָּנֵיהּ מִנֵּיהּ לְדְדִילֵיהּ אַחֲסָנַת אַרְעָא:", "onk_en": "In the jubilee year the field shall revert to him from whom it was purchased; to him whose ancestral land it is.", "pj": "בְּשַׁתָּא דְיוֹבְלָא יְתוּב חַקְלָא לְמַן דְזַבְּנֵיהּ מִנֵיהּ לְמַן דִילֵיהּ אַחֲסָנַת אַרְעָא", "pj_en": "In the year of Jubela the field shall return to him from whom he bought it, to him who had the inheritance of the land.", "tj": "בְּשַׁתָּא דְּיוֹבְלָא יַחֲזוֹר חַקְלָא לְדֵין דִּזְבַן יָתֵיה מִן גַּבֵּיה לִין דְאִית לֵיה אַחֲסָנוּת אַרְעָא:", "tj_en": "At the year of Jubela the field shall revert to him from whom he had bought it, to him who had the inheritance of the land.", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 25, "aliyah": 6, "heb": "וְכׇ֨ל־עֶרְכְּךָ֔ יִהְיֶ֖ה בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה יִהְיֶ֥ה הַשָּֽׁקֶל׃", "onk": "וְכָל פֻּרְסָנֵיהּ יְהֵי בְּסִלְעֵי קוּדְשָׁא עֶסְרִין מָעִין יְהֵי סִלְעָא:", "onk_en": "All of your valuations shall be in holy <i>shekalim<\/i> [<b>selaim<\/b>]; the <i>shekel<\/i> [<b>sela<\/b>] shall be twenty <i>geirah<\/i> [<b>ma’in<\/b>].", "pj": "וְכָל עִילוֹיֵיהּ יְהֵי בְּסִלְעֵי קוּדְשָׁא עַשְרִין מָעִין הַוְיָא סִלְעָא", "pj_en": "And every valuation shall be in shekels of the sanctuary twenty mahin are a shekel.", "tj": "וְכָל עִילוֹי יֶהֱוֵי בִּסִלְעֵי קוּדְשָׁא:", "tj_en": "And every estimation shall be according to the shekels of the sanctuary.", "rashi": "<b>וכל ערכך יהיה בשקל הקדש.<\/b> כָּל עֶרְכְּךָ שֶׁכָּתוּב בּוֹ שְׁקָלִים, יִהְיֶה בְשֶׁקֶל הַקֹּדֶשׁ:<br><br><b>עשרים גרה.<\/b> עֶשְׂרִים מָעוֹת, כָּךְ הָיוּ מִתְּחִלָּה, וּלְאַחַר מִכָּאן הוֹסִיפוּ שְׁתוּת, וְאָמְרוּ רַבּוֹתֵינוּ שֵׁשׁ מָעָה כֶּסֶף דִּינָר, עֶשְׂרִים וְאַרְבַּע מָעוֹת לְסֶלַע (עי' בכורות נ'):", "rashi_en": "וכל ערכך יהיה בשקל הקדש Every valuation shall be made according to the holy shekel: i.e., every valuation regarding which shekels are written, will be made according to the holy shekel.<br><br>עשרים גרה TWENTY GERAH — twenty meahs. This was what it was originally, but later on they increased it by one sixth. Our Rabbis stated: six silver meahs make a silver denar; thus twenty-four meahs make a selah (a shekel) (cf. Rashi on Exodus 30:13), a shekel being four denars (Bekhorot 26b)."}, {"ch": 27, "v": 26, "aliyah": 6, "heb": "אַךְ־בְּכ֞וֹר אֲשֶׁר־יְבֻכַּ֤ר לַֽיהֹוָה֙ בִּבְהֵמָ֔ה לֹֽא־יַקְדִּ֥ישׁ אִ֖ישׁ אֹת֑וֹ אִם־שׁ֣וֹר אִם־שֶׂ֔ה לַֽיהֹוָ֖ה הֽוּא׃", "onk": "בְּרַם בּוּכְרָא דִּי יִתְבַּכַּר קֳדָם יְיָ בִּבְעִירָא לָא יַקְדֵּשׁ גְּבַר יָתֵיהּ אִם תּוֹר אִם אִמַּר דַּיְיָ הוּא:", "onk_en": "However, a firstling [animal] that is born first shall belong to [<b>before<\/b>] Adonoy [as a sacrifice] from among the domestic animals; a man shall not consecrate it [for any other purpose] whether it is an ox or a lamb, it belongs to Adonoy.", "pj": "בְּרַם בּוּכְרָא דְיִתְפְּרֵשׁ לִשְׁמָא דַייָ בִּבְעִירָא לֵית אֶפְשַׁר דְיַקְדִישׁ גְבַר יָתֵיהּ אִין תּוֹר אִין אִימַר לִשְׁמָא דַיְיָ דַיְיָ הוּא", "pj_en": "Moreover, the firstling among cattle which is separated to the Name of the Lord, whether ox or lamb, a man cannot separate (as a votive gift), because it (already belongeth) to the Name of the Lord.", "tj": "לְחוּד בּוּכְרָא דְּיַפְרֵישׁ קֳדָם יְיָ בִּבְעִירָא אִין תּוֹר אִין אִמָר לִשְׁמָא דַּיְיָ הוּא:", "tj_en": "But the firstling among cattle, whether ox or lamb, which is separated before the Lord, belongeth (already) to the Name of the Lord.", "rashi": "<b>לא יקדיש איש אתו.<\/b> לְשֵׁם קָרְבָּן אַחֵר, לְפִי שֶׁאֵינוֹ שֶׁלּוֹ (עי' ערכין כ\"ט):", "rashi_en": "לא יקדיש איש אתו [ONLY THE FIRSTBORN OF BEASTS…] NO MAN SHALL SANCTIFY IT for the purpose of (to become) a sacrifice of any other description, for it is not his, [being already holy to the Lord from birth] (cf. Arakhin 29a)."}, {"ch": 27, "v": 27, "aliyah": 6, "heb": "וְאִ֨ם בַּבְּהֵמָ֤ה הַטְּמֵאָה֙ וּפָדָ֣ה בְעֶרְכֶּ֔ךָ וְיָסַ֥ף חֲמִשִׁת֖וֹ עָלָ֑יו וְאִם־לֹ֥א יִגָּאֵ֖ל וְנִמְכַּ֥ר בְּעֶרְכֶּֽךָ׃", "onk": "וְאִם בִּבְעִירָא מְסָאָבָא וְיִפְרוֹק בְּפֻרְסָנֵיהּ וְיוֹסֵף חֻמְשֵׁיהּ עֲלוֹהִי וְאִם לָא יִתְפָּרַק וְיִזְדַּבַּן בְּפֻרְסָנֵיהּ:", "onk_en": "If it is of an unclean animal, he shall redeem it based on the valuation, and add a fifth to [that amount]. If it is not redeemed, it shall be sold according to the valuation.", "pj": "וְאִין בִּבְעִירָא מְסָאֲבָא וְיִפְרוֹק בְּעִילוֹיֵיהּ וְיוֹסֵף חוֹמֶשׁ דְמוֹי עֲלוֹי וְאִין לָא מִתְפְּרֵק וְיִזְדַבֵּן בִּדְמֵי עֲלוֹיֵיהּ", "pj_en": "And if it be an unclean animal, then he shall redeem it according to its valuation, and add a fifth of the price to it; but if he will not redeem it, then it shall be sold at the price of its valuation.", "tj": "וְאִין בְּעִירָא מְסָאַבָא וְיִפְרוֹק בְּעִילַוֵּיהּ וְיוֹסִיף חַמְשִׁין דְמוֹי עֲלוֹי וְאִין לָא יִתְפְּרִיק וְיִזְדַּבַּן בְּעִילַוֵּיהּ:", "tj_en": "But if it be of an unclean animal, then let him redeem it according to its valuation, and add a fifth of its price unto it. And if it be not redeemed, it shall be sold according to its value.", "rashi": "<b>ואם בבהמה הטמאה וגו'.<\/b> אֵין הַמִּקְרָא הַזֶּה מוּסָב עַל הַבְּכוֹר, שֶׁאֵין לוֹמַר בִּבְכוֹר בְּהֵמָה טְמֵאָה וּפָדָה בְּעֶרְכְּךָ, וַחֲמוֹר אֵין זֶה, שֶׁהֲרֵי אֵין פִּדְיוֹן פֶּטֶר חֲמוֹר אֶלָּא טָלֶה, וְהוּא מַתָּנָה לַכֹּהֵן, וְאֵינוֹ לְהֶקְדֵּשׁ, אֶלָּא הַכָּתוּב מוּסָב עַל הַהֶקְדֵּשׁ, שֶׁהַכָּתוּב שֶׁל מַעְלָה דִּבֵּר בְּפִדְיוֹן בְּהֵמָה טְהוֹרָה שֶׁהֻמְּמָה, וְכָאן דִּבֵּר בְּמַקְדִּישׁ בְּהֵמָה טְמֵאָה לְבֶדֶק הַבַּיִת:<br><br><b>ופדה בערכך.<\/b> כְּפִי מַה שֶּׁיַּעֲרִיכֶנָּה הַכֹּהֵן:<br><br><b>ואם לא יגאל.<\/b> עַל יְדֵי בְעָלִים:<br><br><b>ונמכר בערכך.<\/b> לַאֲחֵרִים:", "rashi_en": "ואם בבהמה טמאה AND IF IT BE OF AN UNCLEAN ANIMAL — This verse does not refer to the firstborn mentioned above (when the translation would be: and if it — the firstborn just mentioned — be בבהמה טמאה, in the category of unclean animals), because one cannot state about the firstborn of an unclean animal: ופדה בערכך “it shall be redeemed by valuation”, since of all unclean animals it is only the firstborn of the ass that has to be redeemed (see Exodus 13:13 and Rashi thereon); and an ass this firstborn spoken of here cannot be, because, you see, the redemption price of the firstborn of an ass is a lamb only, whilst here the animal in question has to be redeemed כערכך, according to a certain valuation; and besides, it (the lamb) is a gift to the priest and is not given to the Sanctuary. But the verse refers to something dedicated to the Temple treasury, being a continuation of v. 11, for that verso above spoke about the redemption of a clean animal which became blemished, and here it speaks about one who dedicates an unclean animal, the proceeds to be used for the Temple repair (Menachot 101a).<br><br>ופדה בערכך THEN HE SHALL REDEEM IT ACCORDING TO THE VALUATION — i. e. according as the priest will estimate its value.<br><br>ואם לא יגאל OR IF IT BE NOT REDEEMED by the owners,<br><br>ונמכר בערכך THEN IT SHALL BE SOLD ACCORDING TO THE VALUATION to others (Sifra, Bechukotai, Chapter 12 2)."}, {"ch": 27, "v": 28, "aliyah": 6, "heb": "אַךְ־כׇּל־חֵ֡רֶם אֲשֶׁ֣ר יַחֲרִם֩ אִ֨ישׁ לַֽיהֹוָ֜ה מִכׇּל־אֲשֶׁר־ל֗וֹ מֵאָדָ֤ם וּבְהֵמָה֙ וּמִשְּׂדֵ֣ה אֲחֻזָּת֔וֹ לֹ֥א יִמָּכֵ֖ר וְלֹ֣א יִגָּאֵ֑ל כׇּל־חֵ֕רֶם קֹֽדֶשׁ־קׇדָשִׁ֥ים ה֖וּא לַיהֹוָֽה׃", "onk": "בְּרַם כָּל חֶרְמָא דִּי יַחֲרֵם גְּבַר קֳדָם יְיָ מִכָּל דִּי לֵיהּ מֵאֲנָשָׁא וּבְעִירָא וּמֵחֲקַל אַחֲסַנְתֵּיהּ לָא יִזְדַּבַּן וְלָא יִתְפָּרָק כָּל חֶרְמָא קֹדֶשׁ קוּדְשִׁין הוּא קֳדָם יְיָ:", "onk_en": "However, any dedication that a man will dedicate to [<b>before<\/b>] Adonoy from any of his belongings be it people (slave), or animal, or of the field of his ancestral land, [none of these] can be sold or redeemed. Everything that is dedicated is most holy, unto [<b>before<\/b>] Adonoy.", "pj": "בְּרַם כָּל אַפְרָשָׁא דִי יַפְרֵישׁ גְבַר קֳדָם יְיָ מִן כָּל דְאִית לֵיהּ מֵאֱנָשָׁא וּבְעִירָא וּמֵחֲקַל אַחֲסַנְתֵּיהּ לָא יִזְדַבֵּן וְלָא יִתְפְּרֵק כָּל אַפְרָשָׁא קוֹדֶשׁ קוּדְשִׁין הוּא קֳדָם יְיָ", "pj_en": "Nevertheless, no devoted thing which a man shall separate before the Lord of anything that is his, of man, or beast, or of his inheritance, shall be sold or redeemed; every (devoted) separation is most sacred before the Lord.", "tj": "לְחוּד כָּל אַפְרָשׁוּ דִי יַפְרִישׁ גְּבַר לִשְׁמָא דַיְיָ מִן כָּל דְאִית לֵיה מִן בְּנֵי אֱנָשָׁא וּבּעִירָא כָּל אַפְרָשׁוּת קדֶשׁ קוּדְּשִׁין הוּא לִשְׁמָא דַיְיָ:", "tj_en": "Only no devoted thing that a man shall separate to the Name of the Lord of anything, that he hath of child or cattle; every separation is most sacred to the Name of the Lord.", "rashi": "<b>אך כל חרם וגו'.<\/b> נֶחְלְקוּ רַבּוֹתֵינוּ בַּדָּבָר, יֵ\"אֹ סְתָם חֲרָמִים לְהֶקְדֵּשׁ, וּמָה אֲנִי מְקַיֵּם כָּל חֵרֶם בְּיִשְׂרָאֵל לְךָ יִהְיֶה? בְּחֶרְמֵי כֹהֲנִים, שֶׁפֵּרֵשׁ וְאָמַר הֲרֵי זֶה חֵרֶם לַכֹּהֵן; וְיֵשׁ שֶׁאָמְרוּ, סְתָם חֲרָמִים לַכֹּהֵן (עי' ספרא; ערכין כ\"ח):<br><br><b>לא ימכר ולא יגאל.<\/b> אֶלָּא יִנָּתֵן לַכֹּהֵן: לְדִבְרֵי הָאוֹמֵר סְתָם חֲרָמִים לַכֹּהֲנִים, מְפֹרָשׁ מִקְרָא זֶה בִּסְתָם חֲרָמִים, וְהָאוֹמֵר סְתָם חֲרָמִים לְבֶדֶק הַבַּיִת, מְפָרֵשׁ מִקְרָא זֶה בְּחֶרְמֵי כֹהֲנִים — שֶׁהַכֹּל מוֹדִים שֶׁחֶרְמֵי כֹהֲנִים אֵין לָהֶם פִּדְיוֹן עַד שֶׁיָּבֹאוּ לְיַד כֹּהֵן וְחֶרְמֵי גָּבוֹהַּ נִפְדִּים:<br><br><b>כל חרם קדש קדשים הוא.<\/b> הָאוֹמֵר סְתָם חֲרָמִים לְבֶדֶק הַבַּיִת, מֵבִיא רְאָיָה מִכָּאן, וְהָאוֹמֵר סְתָם חֲרָמִים לַכֹּהֲנִים, מְפָרֵשׁ \"כָּל חֵרֶם קֹדֶשׁ קָדָשִׁים הוּא\" לְלַמֵּד שֶׁחֶרְמֵי כֹהֲנִים חָלִים עַל קָדְשֵׁי קָדָשִׁים וְעַל קָדָשִׁים קַלִּים, וְנוֹתֵן לַכֹּהֵן, כְּמוֹ שֶׁשָּׁנִינוּ בְמַסֶּכֶת עֲרָכִין (דף כ\"ח), אִם נֵדֶר, נוֹתֵן דְּמֵיהֶן, וְאִם נְדָבָה, נוֹתֵן אֶת טוֹבָתָהּ:<br><br><b>מאדם.<\/b> כְּגוֹן שֶׁהֶחֱרִים עֲבָדָיו וְשִׁפְחוֹתָיו הַכְּנַעֲנִים:", "rashi_en": "אך כל חרם NOTWITHSTANDING NO DOOMED THING… [SHALL BE SOLD OR REDEEMED] — Our Rabbis are of different opinions regarding this matter (i. e. regarding the explanation of the word חרם used in this section). Some say: “All things declared doomed without any statement as to their purpose”, go to the Temple treasury. And if you ask, “But how then can I expl
