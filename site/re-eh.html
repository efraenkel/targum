<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const DATA = [{"ch": 11, "v": 26, "aliyah": 1, "heb": "רְאֵ֗ה אָנֹכִ֛י נֹתֵ֥ן לִפְנֵיכֶ֖ם הַיּ֑וֹם בְּרָכָ֖ה וּקְלָלָֽה׃", "onk": "חֲזֵי דִּי אֲנָא יָהֵב קֳדָמֵיכוֹן יוֹמָא דֵין בִּרְכָן וּלְוָטִין:", "onk_en": "Look, I place before you today, a blessing and a curse.", "pj": "ראה אנכי אָמַר משֶׁה נְבִיָא חֲמוֹן דַּאֲנָא מְסַדֵּר קֳדָמֵיכוֹן יוֹמָא דֵין בִּרְכָתָא וְחִילוּפָהּ", "pj_en": "MOSHEH the prophet said: Behold, I have this day set in order before you a Blessing and its contrary:", "tj": "", "tj_en": "", "rashi": "<b>ראה אנכי … ברכה וקללה.<\/b> הָאֲמוּרוֹת בְּהַר גְּרִזִּים וּבְהַר עֵיבָל:", "rashi_en": "ראה אנכי ... ברכה וקללה BEHOLD I [SET BEFORE YOU THIS DAY] A BLESSING AND A CURSE — those which are later to be recited on Mount Gerizim and on Mount Ebal respectively (cf. v. 29)."}, {"ch": 11, "v": 27, "aliyah": 1, "heb": "אֶֽת־הַבְּרָכָ֑ה אֲשֶׁ֣ר תִּשְׁמְע֗וּ אֶל־מִצְוֺת֙ יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְכֶ֖ם הַיּֽוֹם׃", "onk": "יָת בִּרְכָן דִּי <b>תְקַבְּלוּן<\/b> לְפִקּוּדַיָּא דַּיְיָ אֱלָהֲכוֹן דִּי אֲנָא מְפַקֵּד יָתְכוֹן יוֹמָא דֵין:", "onk_en": "The blessing—that you heed [<b>obey<\/b>] the commandments of Adonoy, your God, that I am commanding you today.", "pj": "יַת בִּרְכָתָא אִין תְּקַבְּלוּן לְפִיקוּדַיָא דַיְיָ אֱלָהָכוֹן דַּאֲנָא מְפַקֵּיד לְכוֹן יוֹמָא דֵין", "pj_en": "the Blessing, if you will be obedient to the commandments of the Lord your God which I command you this day;", "tj": "", "tj_en": "", "rashi": "<b>את הברכה.<\/b> עַל מְנָת אֲשֶׁר תִּשְׁמְעוּ:", "rashi_en": "את הברכה [I SET BEFORE YOU] THE BLESSING — with the condition that you should obey (אשר תשמעו‎)."}, {"ch": 11, "v": 28, "aliyah": 1, "heb": "וְהַקְּלָלָ֗ה אִם־לֹ֤א תִשְׁמְעוּ֙ אֶל־מִצְוֺת֙ יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם וְסַרְתֶּ֣ם מִן־הַדֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְכֶ֖ם הַיּ֑וֹם לָלֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא־יְדַעְתֶּֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּלְוָטַיָּא אִם לָא תְקַבְּלוּן לְפִקּוּדַיָּא דַיְיָ אֱלָהֲכוֹן וְתִסְטוּן מִן אָרְחָא דִּי אֲנָא מְפַקֵּד יָתְכוֹן יוֹמָא דֵין לִמְהַךְ בָּתַר <b>טַעֲוַת עַמְמַיָּא<\/b> דִּי לָא יְדַעְתּוּן:", "onk_en": "And the curse—if you do not heed the commandments of Adonoy, your God, and you veer from the course which I command you this day, to follow other gods [<b>idols of the nations<\/b>] which you did not know.", "pj": "וְחִילוּפָא אִין לָא תְקַבְּלוּן לְפִיקוּדַיָא דַיְיָ אֱלָהָכוֹן וְתִטְעוּן מִן אָרְחָא דַאֲנָא מְפַקֵיד יַתְכוֹן יוֹמָא דֵין לְמִטְעֵי בָּתַר טַעֲוַות עַמְמַיָא דְלָא יְדַעְתּוּן", "pj_en": "and its contrary, if you will not obey the commandments of the Lord your God, but will go astray from the path which I have taught you this day, in turning aside after the idols of the nations whom thou hast not known.", "tj": "וְחִילוּפֵיהוֹן אִין לָא תִשְׁמְעוּן:", "tj_en": "And their contraries, if you will not hearken.", "rashi": "<b>מן הדרך אשר אנכי מצוה אתכם היום ללכת וגו'.<\/b> הָא לָמַדְתָּ כָּל הָעוֹבֵד עֲ\"זָ הֲרֵי הוּא סָר מִכָּל הַדֶּרֶךְ שֶׁנִּצְטַוּוּ יִשְׂרָאֵל, מִכָּאן אָמְרוּ הַמּוֹדֶה בַּעֲ\"זָ כְּכוֹפֵר בְּכָל הַתּוֹרָה כֻלָּהּ (ספרי):", "rashi_en": "מן הדרך אשר אנכי מצוה אתכם היום ללכת וגו׳  [IF YE DEPART] FROM THE WAY WHICH I COMMAND YOU THIS DAY, TO GO [AFTER OTHER GODS] etc. — You thus learn that he who serves idols departs from the entire path of life that Israel has been commanded. From this passage  they (the Rabbis) taught the well-known dictum that he who acknowledges the divinity of an idol is as though he denied the Torah in its entirety (Sifrei Devarim 54:4)."}, {"ch": 11, "v": 29, "aliyah": 1, "heb": "וְהָיָ֗ה כִּ֤י יְבִֽיאֲךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ אֶל־הָאָ֕רֶץ אֲשֶׁר־אַתָּ֥ה בָא־שָׁ֖מָּה לְרִשְׁתָּ֑הּ וְנָתַתָּ֤ה אֶת־הַבְּרָכָה֙ עַל־הַ֣ר גְּרִזִ֔ים וְאֶת־הַקְּלָלָ֖ה עַל־הַ֥ר עֵיבָֽל׃", "onk": "וִיהֵי אֲרֵי יְעֵלִנָּךְ יְיָ אֱלָהָךְ לְאַרְעָא דִּי אַתְּ עָלֵל תַּמָּן לְמֵירְתַהּ וְתִתֵּן יָת מְבָרְכַיָּא עַל טוּרָא דִגְּרִזִּין וְיָת מְלַטְטַיָּא עַל טוּרָא דְעֵיבָל:", "onk_en": "When Adonoy, your God, has brought you to the land that you are coming to inherit, you shall place the blessers on Mount Gerizim and the cursers on Mount Eival.", "pj": "וִיהֵי אֲרוּם יֵיעָל יַתְכוֹן יְיָ אֱלָהָכוֹן לְאַרְעָא דְאַתּוּן עָלְלִין לְתַמָּן לְמֵירְתָהּ וְתִתְּנוּן שִׁית שִׁבְטִין עַל טַוְורָא דִגְרִיזִים וְשִׁית שִׁבְטִין עַל טַוְורָא דְעֵיבָל מְבָרְכַיָא יֶהֱווֹן הָפְכִין אַפֵּיהוֹן לְקָבֵיל טַוְורָא דִגְרִיזִים וּמְלַטְטַיָא יֶהֱווֹן הָפְכִין אַפֵּיהוֹן לְקָבֵל טַוְורָא דְעֵיבָל", "pj_en": "And it shall be, when the Lord your God will have brought you to the land into which you are going, to possess it, you shall place six tribes upon the mountain of Gerizim, and six tribes on the mountain of Ebal. They who recite the blessings shall turn their faces towards Mount Gerizim, and they who recite the curses shall turn their faces towards Mount Ebal.", "tj": "", "tj_en": "", "rashi": "<b>ונתתה את הברכה.<\/b> כְּתַרְגּוּמוֹ \"יָת מְבָרְכַיָּא\" – אֶת הַמְבָרְכִים:<br><br><b>על הר גרזים.<\/b> כְּלַפֵּי הַר גְּרִזִּים הוֹפְכִין פְּנֵיהֶם וּפָתְחוּ בִּבְרָכָה – בָּרוךְ הָאִישׁ אֲשֶׁר לֹא יַעֲשֶׂה פֶסֶל וּמַסֵּכָה וְגוֹ'. כָּל הָאֲרוּרִים שֶׁבַּפָּרָשָׁה אָמְרוּ תְחִלָּה בִּלְשׁוֹן בָּרוּךְ, וְאַחַר כָּךְ הָפְכוּ פְנֵיהֶם כְּלַפֵּי הַר עֵיבָל וּפָתְחוּ בִּקְלָלָה (סוטה ל\"ג):", "rashi_en": "ונתת את הברכה THEN THOU SHALT PUT THE BLESSING [UPON MOUNT GERIZIM] — Understand this as the Targum renders it: ית מברכיא those who pronounce the blessing. <br><br>על הר גרזים means “towards Mount Gerizim”: they (the Levites) turned their faces towards it and began with a formula of blessing: “Blessed be the man that doth not make any graven or molten image etc.”. For each of the paragraphs beginning with the expression ארור as set forth in the chapter (Deuteronomy 27), they first recited in a converse form, beginning with the expression ברוך, “Blessed be etc.” and only afterwards did they turn their faces towards Mount Ebal and began to recite the corresponding curse (Sifrei Devarim 55:2; Sotah 32a; cf. Rashi on Deuteronomy 27)."}, {"ch": 11, "v": 30, "aliyah": 1, "heb": "הֲלֹא־הֵ֜מָּה בְּעֵ֣בֶר הַיַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַשֶּׁ֔מֶשׁ בְּאֶ֙רֶץ֙ הַֽכְּנַעֲנִ֔י הַיֹּשֵׁ֖ב בָּעֲרָבָ֑ה מ֚וּל הַגִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה׃", "onk": "הֲלָא אִנּוּן בְּעִבְרָא דְיַרְדְּנָא אֲחוֹרֵי אֹרַח מַעֲלָנֵי שִׁמְשָׁא בְּאַרְעָא כְּנַעֲנָאָה דְּיָתֵב בְּמֵישְׁרָא לָקֳבֵל גִּלְגְּלָא <b>בִּסְטַר<\/b> <b>מֵישְׁרֵי<\/b> מֹרֶה:", "onk_en": "Are they not across the Yardein and far beyond, along the route of the sunset? In the land of the Canaanites who dwell on the Arava Plain, opposite Gilgol, next to the [<b>at the side of<\/b>] Moreh Plain.", "pj": "הֲלָא אִינוּן יְהִיבִין מִלְהָלָא לְיוֹרְדְּנָא אֲחוֹרֵי אוֹרַח מַטְמְעָא דְשִׁמְשָׁא בְּאַרַע כְּנַעֲנָאָה דְשָׁרֵי בְּמֵישְׁרָא כֻּלּוֹ קֳבֵיל גֻּלְגְּלָא בְּסִטְרֵי חֶזְוֵי מַמְרֵא", "pj_en": "Are they not situated beyond Jordan by the way of the sunset, in the land of the Kenaanah, who dwell in the plain over against Gilgela by the side (of the place) of the vision of Mamre?", "tj": "", "tj_en": "", "rashi": "<b>הלא המה.<\/b> נָתַן בָּהֶם סִימָן:<br><br><b>אחרי.<\/b> אַחַר הַעֲבָרַת הַיַּרְדֵּן הַרְבֵּה וָהָלְאָה לְמֵרָחוֹק; וְזֶהוּ לְשׁוֹן אַחֲרֵי, כָּל מָקוֹם שֶׁנֶּאֱמַר אַחֲרֵי מֻפְלָג הוּא:<br><br><b>דרך מבוא השמש.<\/b> לְהַלָּן מִן הַיַּרְדֵּן לְצַד מַעֲרָב, וְטַעַם הַמִּקְרָא מוֹכִיחַ שֶׁהֵם שְׁנֵי דְבָרִים, שֶׁנִּנְקְדוּ בִשְׁנֵי טְעָמִים, \"אַחֲרֵי\" נָקוּד בְּפַשְׁטָא, וְ\"דֶרֶךְ\" נָקוּד בְּמַשְׁפֵּל, וְהוּא דָּגֵשׁ, וְאִם הָיָה \"אַחֲרֵי דֶרֶךְ\" דִּבּוּר אֶחָד, הָיָה נָקוּד \"אַחֲרֵי\" בִּמְשָׁרֵת, בְּשׁוֹפָר הָפוּךְ, וְ\"דֶרֶךְ\" בְּפַשְׁטָא וְרָפֶה:<br><br><b>מול הגלגל.<\/b> רָחוֹק מִן הַגִּלְגָּל:<br><br><b>אלוני מרה.<\/b> שְׁכֶם הוּא, שֶׁנֶּאֱמַר (בראשית י\"ב) עַד מְקוֹם שְׁכֶם עַד אֵלוֹן מוֹרֶה (ספרי):", "rashi_en": "הלא המה ARE THEY NOT [AT THE PASSAGE OF THE JORDAN … ]? — He gave geographical indications regarding them (the mountains).<br><br>אחרי [AT THE PASSAGE OF THE JORDAN,] AFTER — This means: behind the passage of the Jordan much further on in a distance, for that is the force of the expression אחרי, because wherever the term אחרי (in contradistinction to אחר; cf. Rashi on Genesis 15:1) is used it signifies “greatly separated” (Genesis Rabbah 44:5; cf. Sifrei Devarim 56:1; Sotah 33b).<br><br>דרך מבוא השמש [AT THE PASSAGE OF THE JORDAN, FAR DISTANT FROM IT] ON THE WAY OF THE SETTING OF THE SUN — i.e. beyond the Jordan towards the West. The accents in the verse prove that they (the word אחרי and the phrase דרך מבוא השמש) are two unconnected phrases since they bear two separate accents of a different character, viz., the word אחרי is marked by a Pashta (a disjunctive accent), and the word דרך is marked by a משפל (our Yetib), and also has a Dagesh. If, however, אחרי דרך formed one phrase, the word אחרי should be marked by a conjunctive accent, a שופר הפוך (our Mahpach) and דרך by a Pashta, while the ד of דרך would be ‘‘weak” (i.e. have no Dagesh; cf. Rashi on Joshua 7:15). <br><br>מול הגלגל means, distant from Gilgal (not near Gilgal). <br><br>אלוני מורה [BESIDE] THE TEREBINTHS OF MOREH — This is Shechem, for it states, (Genesis 12:6): “unto the place of Shechem, unto the terebinth of Moreh” (Sifrei Devarim 56:1; Sotah 33b; cf. Rashi on that verse)."}, {"ch": 11, "v": 31, "aliyah": 1, "heb": "כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת־הַיַּרְדֵּ֔ן לָבֹא֙ לָרֶ֣שֶׁת אֶת־הָאָ֔רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֵיכֶ֖ם נֹתֵ֣ן לָכֶ֑ם וִֽירִשְׁתֶּ֥ם אֹתָ֖הּ וִֽישַׁבְתֶּם־בָּֽהּ׃", "onk": "אֲרֵי אַתּוּן עָבְרִין יָת יַרְדְּנָא לְמֵעַל לְמֵירַת יָת אַרְעָא דַּיְיָ אֱלָהֲכוֹן יָהֵב לְכוֹן וְתֵירְתוּן יָתַהּ וְתֵיתְבוּן בַּהּ:", "onk_en": "For you shall pass across the Yardein to come to inherit the land that Adonoy, your God, is giving you; you will inherit it and will dwell in it.", "pj": "אֲרוּם אַתּוּן עָבְרִין יַת יוֹרְדְּנָא לְמֵיעַל לְמֵירוֹת יַת אַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן וְתֵירְתוּן יָתָהּ וְתֵיתְבוּן בָּהּ", "pj_en": "For you are to pass over Jordan to enter and possess the land which the Lord your God giveth you, and you will hold and will dwell therein.", "tj": "", "tj_en": "", "rashi": "<b>כי אתם עברים את הירדן וגו'.<\/b> נִסִּים שֶׁל יַרְדֵּן יִהְיוּ סִימָן בְּיֶדְכֶם שֶׁתָּבֹאוּ וְתִירְשׁוּ אֶת הָאָרֶץ (עי' ספרי):", "rashi_en": "כי אתם עברים את הירדן וגו׳ FOR YE SHALL PASS OVER THE JORDAN etc., — The miracles that will be wrought for you during your crossing of the Jordan shall be an omen for you that you will indeed come into and inherit the land (cf. Sifrei Devarim 57)."}, {"ch": 11, "v": 32, "aliyah": 1, "heb": "וּשְׁמַרְתֶּ֣ם לַעֲשׂ֔וֹת אֵ֥ת כׇּל־הַֽחֻקִּ֖ים וְאֶת־הַמִּשְׁפָּטִ֑ים אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִפְנֵיכֶ֖ם הַיּֽוֹם׃", "onk": "וְתִטְּרוּן לְמֶעְבַּד יָת כָּל קְיָמַיָּא וְיָת דִּינַיָּא דִּי אֲנָא יָהֵב קֳדָמֵיכוֹן יוֹמָא דֵין:", "onk_en": "You will guard to fulfill all the statutes and the laws that I am setting before you today.", "pj": "וְתִטְרוּן לְמֶעֱבַד יַת כָּל קְיָימַיָא וְיַת דִּינַיָא דִי אֲנָא יָהֵיב קֳדָמֵיכוֹן יוֹמָא דֵין", "pj_en": "Look well, therefore, that you perform all the statutes and judgments that I have set before you this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 1, "aliyah": 1, "heb": "אֵ֠לֶּה הַֽחֻקִּ֣ים וְהַמִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּן לַעֲשׂוֹת֒ בָּאָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהֹוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛יךָ לְךָ֖ לְרִשְׁתָּ֑הּ כׇּ֨ל־הַיָּמִ֔ים אֲשֶׁר־אַתֶּ֥ם חַיִּ֖ים עַל־הָאֲדָמָֽה׃", "onk": "אִלֵּין קְיָמַיָּא וְדִינַיָּא דִּי תִטְּרוּן לְמֶעְבַּד בְּאַרְעָא דִּיהַב יְיָ אֱלָהָא דַאֲבָהָתָךְ לָךְ לְמֵירְתַהּ כָּל יוֹמַיָּא דִּי אַתּוּן קַיָּמִין עַל אַרְעָא:", "onk_en": "These are the statutes and the laws that you will guard to fulfill in the land that Adonoy, God of your forefathers, has given to inherit, all the years that you are alive on the land.", "pj": "אִלֵין קְיָימַיָא וְדִינַיָיא דְתִנְטְרוּן לְמֶעֱבַד בְּאַרְעָא דִיהַב יְיָ אֱלָהָא דְאַבְהַתְכוֹן לְכוֹן לְמֵירְתָהּ כָּל יוֹמַיָא דְאַתּוּן קְיָימִין עַל אַרְעָא", "pj_en": "These are the statutes and judgments which you are to observe to do in the land which the Lord God of your fathers giveth you to inherit all the days that you live upon the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 2, "aliyah": 1, "heb": "אַבֵּ֣ד תְּ֠אַבְּד֠וּן אֶֽת־כׇּל־הַמְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ־שָׁ֣ם הַגּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖ם אֶת־אֱלֹהֵיהֶ֑ם עַל־הֶהָרִ֤ים הָֽרָמִים֙ וְעַל־הַגְּבָע֔וֹת וְתַ֖חַת כׇּל־עֵ֥ץ רַעֲנָֽן׃", "onk": "אַבָּדָא תְאַבְּדוּן יָת כָּל אַתְרַיָּא דִּי פְלָחוּ תַמָּן עַמְמַיָּא דִּי אַתּוּן יָרְתִין יָתְהוֹן יָת <b>טַעֲוָתְהוֹן<\/b> עַל טוּרַיָּא רָמַיָּא וְעַל רָמָתָא וּתְחוֹת כָּל אִילַן עַבּוֹף:", "onk_en": "You must obliterate all the places where the nations worshipped, whom you are inheriting, their gods [<b>idols<\/b>], on the high mountains, and on the hills, and under every evergreen tree.", "pj": "אַבָּדָא תְאַבְּדוּן יַת כָּל אַתְרַיָא דִי פְלָחוּ תַּמָּן עַמְמַיָא דְאַתּוּן יַרְתוּן יַתְהוֹן וְיַת טַעֲוַותְהוֹן עַל טַוְורַיָא רָמַיָא וְעַל גְּלִימָתָא וּתְחוֹת כָּל אִילַן דְּרִיוְיֵיהּ שַׁפִּיר", "pj_en": "You shall utterly destroy all the places in which the people (whose land) you will possess have worshipped their idols, upon the high mountains and hills, and under every tree of beautiful form.", "tj": "", "tj_en": "", "rashi": "<b>אבד תאבדון.<\/b> אַבֵּד וְאַחַר כָּךְ תְּאַבְּדוּן, מִכָּאן לָעוֹקֵר עֲ\"זָ שֶׁצָּרִיךְ לְשָׁרֵשׁ אַחֲרֶיהָ (עבודה זרה מ\"ה):<br><br><b>את כל המקמות אשר עבדו שם וגו'.<\/b> וּמַה תְּאַבְּדוּן מֵהֶם? אֶת אֱלֹהֵיהֶם אֲשֶׁר עַל הֶהָרִים:", "rashi_en": "אבד תאבדון YE SHALL UTTERLY DESTROY — Destroy and again destroy! (i.e. utterly destroy). From here we learn that he who eradicates an object of idol-worship must thoroughly uproot it (i.e. remove every trace of it) (Sifrei Devarim 60:1).<br><br>את כל המקמות אשר עבדו שם וגו׳ [YE SHALL UTTERLY DESTROY] ALL THE PLACES (according to Rashi: FROM ALL THE PLACES) WHEREIN [THE NATIONS …] SERVED — And what shall ye destroy from them? Their gods which are upon the mountains (Avodah Zarah 45a)."}, {"ch": 12, "v": 3, "aliyah": 1, "heb": "וְנִתַּצְתֶּ֣ם אֶת־מִזְבְּחֹתָ֗ם וְשִׁבַּרְתֶּם֙ אֶת־מַצֵּ֣בֹתָ֔ם וַאֲשֵֽׁרֵיהֶם֙ תִּשְׂרְפ֣וּן בָּאֵ֔שׁ וּפְסִילֵ֥י אֱלֹֽהֵיהֶ֖ם תְּגַדֵּע֑וּן וְאִבַּדְתֶּ֣ם אֶת־שְׁמָ֔ם מִן־הַמָּק֖וֹם הַהֽוּא׃", "onk": "וּתְתָרְעוּן יָת <b>אֱגוֹרֵיהוֹן<\/b> וּתְתַבְּרוּן יָת קָמָתְהוֹן וַאֲשֵׁרֵיהוֹן תּוֹקְדוּן בְּנוּרָא וְצַלְמֵי <b>טַעֲוָתְהוֹן<\/b> תְּקוֹצְצוּן וְתוֹבְדוּן יָת שִׁמְהוֹן מִן אַתְרָא הַהוּא:", "onk_en": "You are to break apart their altars, and you are to smash their pillars, and their asherahs are you to burn in fire, and the statues of their gods [<b>idols<\/b>] are you to cut down; and you are to obliterate their name from that place.", "pj": "וְתִסְתְּרוּן יַת אֲגוּרֵיהוֹן וְתִתְבְּרוּן יַת קָמַתְהוֹן וּמְרַחֲקַתְהוֹן תּוֹקְדוּן בְּנוּרָא וְצִילְמֵי טַעֲוַותְהוֹן תְּשַׁקְצוּן וּתְשֵׁיצִינוּן יַת שִׁמְהוֹן מִן אַתְרָא הַהוּא", "pj_en": "You shall lay their altars in ruin, break down their pillars, burn their abominations with fire, and utterly destroy the images of their gods, and abolish their names from that place.", "tj": "", "tj_en": "", "rashi": "<b>מזבח.<\/b> שֶׁל אֲבָנִים הַרְבֵּה:<br><br><b>מצבה.<\/b> שֶׁל אֶבֶן אַחַת, וְהוּא בִּימוֹס שֶׁשְּׁנוּיָה בַּמִּשְׁנָה (עבודה זרה מ\"ז): אֶבֶן שֶׁחֲצָבָהּ מִתְּחִלָּתָהּ לְבִימוֹס:<br><br><b>אשרה.<\/b> אִילָן הַנֶּעֱבָד:<br><br><b>ואבדתם את שמם.<\/b> לְכַנּוֹת לָהֶם שֵׁם לִגְנַאי, בֵּית גַּלְיָא — קוֹרִין לָהּ בֵּית כַּרְיָא, עֵין כֹּל — עֵין קוֹץ (שם ל\"ו):", "rashi_en": "מזבח consists of many stones,<br><br>מצבה of one stone only. It is the בימוס, the pedestal for idolatrous statuary, of which we learn in the Mishna (Avodah Zarah 3:7): A stone which one originally hewed for an idol’s pedestal is forbidden for use.<br><br>אשרה is a tree that had been worshipped (Avodah Zarah 47a).<br><br>ואבדתם את שמם AND DESTROY THEIR NAMES by giving them contemptuous nicknames. What they call בית גליא, “a sublime house”, you should call בית כריא, “a base house”, what they call עין כל, “the universal eye”, you call, עין קוץ “the thorn eye” (Avodah Zarah 46a)."}, {"ch": 12, "v": 4, "aliyah": 1, "heb": "לֹֽא־תַעֲשׂ֣וּן כֵּ֔ן לַיהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "לָא תַעְבְּדוּן כֵּן <b>קֳדָם<\/b> יְיָ אֱלָהֲכוֹן:", "onk_en": "Do not act this way to [<b>before<\/b>] Adonoy, your God.", "pj": "לֵיתֵיכוֹן רְשָׁאִין לְמַחְקָא כְּתַב שְׁמָא דַיְיָ אֱלָהָכוֹן", "pj_en": "Not so may you do to blot out the inscription of the Name of the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>לא תעשון כן.<\/b> לְהַקְטִיר לַשָּׁמַיִם בְּכָל מָקוֹם, כִּי אִם בַּמָּקוֹם אֲשֶׁר יִבְחַר. דָּ\"אַ — <b>ונתצתם את מזבחתם, ואבדתם את שמם, לא תעשון כן.<\/b> אַזְהָרָה לַמּוֹחֵק אֶת הַשֵּׁם וְלַנּוֹתֵץ אֶבֶן מִן הַמִּזְבֵּחַ אוֹ מִן הָעֲזָרָה (מכות כ\"ב). אָמַר רַ' יִשְׁמָעֵאל וְכִי תַעֲלֶה עַל דַּעְתְּךָ שֶׁיִּשְׂרָאֵל נוֹתְצִין אֶת הַמִּזְבְּחוֹת? אֶלָּא שֶׁלֹּא תַעֲשׂוּ כְמַעֲשֵׂיהֶם וְיִגְרְמוּ עֲוֹנוֹתֵיכֶם לְמִקְדַּשׁ אֲבוֹתֵיכֶם שֶׁיִּתְחָרֵב (ספרי):", "rashi_en": "לא תעשון כן YE SHALL NOT DO SO [UNTO THE LORD YOUR GOD] — i.e. to burn offerings to God at any place you choose (as do the idolaters, cf. v. 2), but at the place which He will choose (cf. vv. 5—6).  — Another explanation is: ונתצתם את מזבחתם … ואבדתם את שמם … לא תעשון כן YE SHALL PULL DOWN THEIR ALTARS … YE SHALL DESTROY THEIR NAMES … BUT YE SHALL NOT DO THIS [TO THE LORD YOUR GOD] — It is a prohibition addressed to one who would blot out the Name of God from any writing, or would pull out a stone from the altar or from the forecourt (cf. Sifrei Devarim 61:12; Makkot 22a). R. Ishmael said: “But can the idea enter your mind that the Israelites would pull down the altars of God?” But the meaning of לא תעשון כן is that you should not do like their doings so that your sins would cause the Sanctuary of (built by) your fathers to be laid waste (Sifrei Devarim 61:7). "}, {"ch": 12, "v": 5, "aliyah": 1, "heb": "כִּ֠י אִֽם־אֶל־הַמָּק֞וֹם אֲשֶׁר־יִבְחַ֨ר יְהֹוָ֤ה אֱלֹֽהֵיכֶם֙ מִכׇּל־שִׁבְטֵיכֶ֔ם לָשׂ֥וּם אֶת־שְׁמ֖וֹ שָׁ֑ם לְשִׁכְנ֥וֹ תִדְרְשׁ֖וּ וּבָ֥אתָ שָּֽׁמָּה׃", "onk": "אֶלָּהֵן לְאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהֲכוֹן מִכָּל שִׁבְטֵיכוֹן <b>לְאַשְׁרָאָה שְׁכִנְתֵּיהּ<\/b> תַּמָּן <b>לְבֵית שְׁכִנְתֵּיהּ<\/b> תִּתְבְּעוּן וְתֵיתוּן לְתַמָּן:", "onk_en": "Rather at the place that Adonoy, your God, chooses from all your tribes to set His Presence [<b>have His Shechinah dwell<\/b>] there, [<b>at the abode of His Shechinah<\/b>] will you seek His Presence and come there.", "pj": "אֱלָהֵן בְּאַרְעָא דְיִתְרְעֵי מֵימְרָא דַיְיָ אֱלָהָכוֹן מִן כָּל שִׁבְטֵיכוֹן לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן לְבֵית שְׁכִינְתֵּיהּ תִּתְבְּעוּן וְתֵיתוּן תַּמָּן", "pj_en": "But in the land which the Word of the Lord your God will choose out of all your tribes for His Shekinah to dwell there, unto the place of His Shekinah shall you have recourse, and come thither,", "tj": "", "tj_en": "", "rashi": "<b>לשכנו תדרשו.<\/b> זֶה מִשְׁכַּן שִׁילֹה:", "rashi_en": "לשכנו תדרשו AFTER HIS RESIDENCE SHALL YE INQUIRE — This refers to the Tabernacle at Shiloh. (Sifrei Devarim 62:3)"}, {"ch": 12, "v": 6, "aliyah": 1, "heb": "וַהֲבֵאתֶ֣ם שָׁ֗מָּה עֹלֹֽתֵיכֶם֙ וְזִבְחֵיכֶ֔ם וְאֵת֙ מַעְשְׂרֹ֣תֵיכֶ֔ם וְאֵ֖ת תְּרוּמַ֣ת יֶדְכֶ֑ם וְנִדְרֵיכֶם֙ וְנִדְבֹ֣תֵיכֶ֔ם וּבְכֹרֹ֥ת בְּקַרְכֶ֖ם וְצֹאנְכֶֽם׃", "onk": "וְתַיְתוּן לְתַמָּן עֲלָוָתֵיכוֹן וְנִכְסַת קוּדְשֵׁיכוֹן וְיָת מַעְשְׂרָתֵיכוֹן וְיָת <b>אַפְרָשׁוּת<\/b> יֶדְכוֹן וְנִדְרֵיכוֹן וְנִדְבָתֵיכוֹן וּבְכוֹרֵי תוֹרְכוֹן וְעָנְכוֹן:", "onk_en": "You are to bring there your burnt-offerings and your sacred-offerings, and your tithes and the elevation of your hands [<b>hand-offerings<\/b>], and your pledges, and your donations, and the firstborn of your cattle and your flocks.", "pj": "וְתַיְיתוּן תַּמָּן עַלְוַותְכוֹן וְנִכְסַת קוּדְשֵׁיכוֹן וְיַת מַעֲשַרְתֵּיכוֹן וְיַת אַפְרָשׁוּת יְדֵיכוֹן וְנִדְרֵיכוֹן וְנִיסְבָתֵיכוֹן וּבְכוֹרֵי תוֹרֵיכוֹן וְעָנֵיכוֹן", "pj_en": "and bring your sacrifices and consecrated oblations, your tythes, the separation of your hands, your vows, your voluntary offerings, and the firstlings of your herds and flocks.", "tj": "", "tj_en": "", "rashi": "<b>וזבחיכם.<\/b> שְׁלָמִים שֶׁל חוֹבָה:<br><br><b>מעשרתיכם.<\/b> מַעְשַׂר בְּהֵמָה וּמַעֲשֵׂר שֵׁנִי, לֶאֱכֹל לִפְנִים מִן הַחוֹמָה:<br><br><b>תרומת ידכם.<\/b> אֵלּוּ הַבִּכּוּרִים, שֶׁנֶּאֱמַר בָּהֶם (דברים כ\"ו) וְלָקַח הַכֹּהֵן הַטֶּנֶא מִיָּדֶךָ (עי' ספרי):<br><br><b>ובכרת בקרכם.<\/b> לְתִתָּם לַכֹּהֵן וְיַקְרִיבֵם שָׁם:", "rashi_en": "וזבחיהם AND YOUR SACRIFICES — Obligatory feast-offerings (cf. Sifrei Devarim 63:7)<br><br>מעשרתיכם [THERE YOU SHALL BRING] YOUR TITHES — i.e. both the tithe of the cattle and the second tithe, in order to consume them within the wall(cf. Sifrei Devarim 63:8).<br><br>תרומת ידכם THE HEAVE-OFFERING OF YOUR HAND — These are the first-fruits of which it is said, (Deuteronomy 26:4) “And the priest shall take the basket out of thine hand” (cf. Sifrei Devarim 63:9).<br><br>ובכרת בקרכם AND THE FIRSTLINGS OF YOUR HERD — in order to give them to the priest that he may offer them there."}, {"ch": 12, "v": 7, "aliyah": 1, "heb": "וַאֲכַלְתֶּם־שָׁ֗ם לִפְנֵי֙ יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם וּשְׂמַחְתֶּ֗ם בְּכֹל֙ מִשְׁלַ֣ח יֶדְכֶ֔ם אַתֶּ֖ם וּבָתֵּיכֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְךָ֖ יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וְתֵיכְלוּן תַּמָּן קֳדָם יְיָ אֱלָהֲכוֹן וְתֶחֱדוּן בְּכֹל אוֹשָׁטוּת יֶדְכוֹן אַתּוּן <b>וֶאֱנַשׁ<\/b> בָּתֵּיכוֹן דִּי בָרְכָךְ יְיָ אֱלָהָךְ:", "onk_en": "You are to eat there before Adonoy, your God, and you will be happy with the sum of your handiwork, you and [<b>the members of<\/b>] your households, as Adonoy, your God, has blessed you.", "pj": "וְתֵיכְלוּן תַּמָּן קֳדָם יְיָ אֱלָהָכוֹן וְתֵחְדוּן בְּכָל אוֹשָׁטוּת יֶדְכוֹן אַתּוּן וְאֵינַשׁ בָּתֵּיכוֹן דִּי בְּרַכְכוֹן יְיָ אֱלָהָכוֹן", "pj_en": "And you shall there eat before the Lord your God, and rejoice in all that you put your hand unto, you and your households, in which the Lord your God will have blessed you.", "tj": "", "tj_en": "", "rashi": "<b>אשר ברכך ה'.<\/b> לְפִי הַבְּרָכָה הָבֵא (ספרי):", "rashi_en": "אשר ברכך ה׳ ACCORDING AS THE LORD [YOUR GOD] HAS BLESSED YOU — in accordance with the blessing bring [the offerings of festive rejoicing] (Sifrei Devarim 64:5)."}, {"ch": 12, "v": 8, "aliyah": 1, "heb": "לֹ֣א תַעֲשׂ֔וּן כְּ֠כֹ֠ל אֲשֶׁ֨ר אֲנַ֧חְנוּ עֹשִׂ֛ים פֹּ֖ה הַיּ֑וֹם אִ֖ישׁ כׇּל־הַיָּשָׁ֥ר בְּעֵינָֽיו׃", "onk": "לָא תַעְבְּדוּן כְּכֹל דִּי אֲנַחְנָא עָבְדִין הָכָא יוֹמָא דֵין גְּבַר כָּל מָן דְּכָשָׁר <b>קֳדָמוֹהִי<\/b>:", "onk_en": "You may not do everything we do here today, each what is upright in his eyes [<b>before him<\/b>].", "pj": "לֵיתֵיכוֹן רַשָּׁאִין לְמֶעֱבַד הֵיכְמָא דַאֲנָן עָבְדִין הָכָא יוֹמָא דֵין גְּבַר כָּל דְּכָשַׁר בְּעֵינוֹי", "pj_en": "It will not be lawful for you to do (there) as we do here today, whatever any one thinks fit for himself;", "tj": "", "tj_en": "", "rashi": "<b>לא תעשון ככל אשר אנחנו עשים וגו'.<\/b> מוּסָב לְמַעְלָה עַל <b>כי אתם עברים את הירדן וגו'<\/b>, כְּשֶׁתַּעַבְרוּ אֶת הַיַּרְדֵּן מִיָּד אַתֶּם מֻתָּרִים לְהַקְרִיב בְּבָמָה כָּל י\"ד שָׁנָה שֶׁל כִּבּוּשׁ וְחִלּוּק, וּבַבָּמָה לֹא תַקְרִיבוּ כָּל מַה שֶּׁאַתֶּם מַקְרִיבִים <b>פה היום<\/b> בַּמִּשְׁכָּן, שֶׁהוּא עִמָּכֶם וְנִמְשַׁח וְהוּא כָשֵׁר לְהַקְרִיב בּוֹ חַטָּאוֹת וַאֲשָׁמוֹת נְדָרִים וּנְדָבוֹת, אֲבָל בְּבָמָה אֵין קָרֵב אֶלָּא הַנִּדָּר וְהַנִּדָּב, וְזֶהוּ <b>איש כל הישר בעיניו<\/b>, נְדָרִים וּנְדָבוֹת, שֶׁאַתֶּם מִתְנַדְּבִים עַ\"יְ שֶׁיָּשָׁר בְּעֵינֵיכֶם לַהֲבִיאָם וְלֹא עַ\"יְ חוֹבָה, אוֹתָם תַּקְרִיבוּ בַּבָּמָה (שם; זבחים קי\"ז):", "rashi_en": "לא תעשון ככל אשר אנחנו עשים וגו׳ YE SHALL NOT DO AFTER ALL [THE THINGS] THAT WE DO [HERE THIS DAY] — This refers back to what is stated above (Deuteronomy 11:31) “for ye shall pass over the Jordan etc.”, the meaning being: when ye have crossed the Jordan, you are at once permitted to offer on Bamahs, during all the fourteen years of subjugating and dividing the land amongst the tribes: but on these Bamahs you must not sacrifice all that you sacrifice “here this day”, in the Tabernacle that is with you and that has been anointed and is thus fit to offer sin and guilt offerings and vows and free-will offerings on it, whilst on a Bamah only that may be sacrificed which has been made the subject of a vow or a free-will offering. And that is the meaning of איש כל הישר בעיניו, “every man whatsoever is right in his eyes” — vows and free-will offerings which you dedicate because it is pleasing in your eyes to bring them, and not because of an obligation imposed upon you, such may you offer on Bamahs, but not sacrifices that are to be offered in consequence of an obligation (sin and guilt offerings) (Sifrei Devarim 65:4; Zevachim 117b)."}, {"ch": 12, "v": 9, "aliyah": 1, "heb": "כִּ֥י לֹא־בָאתֶ֖ם עַד־עָ֑תָּה אֶל־הַמְּנוּחָה֙ וְאֶל־הַֽנַּחֲלָ֔ה אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֥ן לָֽךְ׃", "onk": "אֲרֵי לָא אֲתֵיתוּן עַד כְּעָן <b>לְבֵית נְיָחָא<\/b> וּלְאַחֲסָנָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ:", "onk_en": "For you will not have come as yet to the peace [<b>the place of tranquility<\/b>] and to the territory that Adonoy, your God, is giving you.", "pj": "אֲרוּם לָא אָתֵיתוּן עַד כְּדוֹן לְבֵי מוּקְדְּשָׁא דְהוּא בֵּית נְיָיחָא וּלְאַחְסָנַת אַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן", "pj_en": "for you are not yet come to the Sanctuary, to the dwelling of Peace, and to the inheritance of the land which the Lord your God will give you.", "tj": "", "tj_en": "", "rashi": "<b>כי לא באתם.<\/b> כָּל אוֹתָן י\"ד שָׁנָה:<br><br><b>עד עתה.<\/b> כְּמוֹ עֲדַיִן:<br><br><b>אל המנוחה.<\/b> זוֹ שִׁילֹה:<br><br><b>נחלה.<\/b> זוֹ יְרוּשָׁלַיִם (ספרי; זבחים קי\"ט):", "rashi_en": "כי לא באתם FOR YE SHALL NOT HAVE COME [UNTO THE REST] all those fourteen years of conquering and dividing the land.<br><br>עד עתה is the same as “by that time”.<br><br>אל המנוחה [FOR YE SHALL NOT HAVE COME YET] TO THE REST — This refers to Shiloh (Sifrei Devarim 66:2),<br><br>נחלה [AND TO] THE INHERITANCE — This refers to Jerusalem (Sifrei Devarim 66:2; Zevachim 119a)."}, {"ch": 12, "v": 10, "aliyah": 1, "heb": "וַעֲבַרְתֶּם֮ אֶת־הַיַּרְדֵּן֒ וִֽישַׁבְתֶּ֣ם בָּאָ֔רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֵיכֶ֖ם מַנְחִ֣יל אֶתְכֶ֑ם וְהֵנִ֨יחַ לָכֶ֧ם מִכׇּל־אֹיְבֵיכֶ֛ם מִסָּבִ֖יב וִֽישַׁבְתֶּם־בֶּֽטַח׃", "onk": "וְתַעְבְּרוּן יָת יַרְדְּנָא וְתֵיתְבוּן בְּאַרְעָא דַּיְיָ אֱלָהֲכוֹן מַחֲסֵן יָתְכוֹן וִינִיחַ לְכוֹן מִכָּל בַּעֲלֵי <b>דְבָבֵיכוֹן<\/b> מִסְּחוֹר סְחוֹר וְתֵיתְבוּן לְרָחְצָן:", "onk_en": "When you cross the Yardein and settle in the land that Adonoy, your God, is apportioning to you, and He has granted you peace from all your enemies around, and you will live secure.", "pj": "וְתַעַבְרוּן יַת יוֹרְדְּנָא וְתֵיתְבוּן בְּאַרְעָא דַיְיָ אֱלָהָכוֹן מַחְסַן יַתְכוֹן וִינִיחַ לְכוֹן מִכָּל בַּעֲלֵי דְבָבֵיכוֹן מִן חֲזוֹר חֲזוֹר וְתִבְנוּן בֵּית מוּקְדְּשָׁא וּמִבָּתַר כְּדֵין תֵּיתְבוּן לְרוֹחֲצָן", "pj_en": "But when you have passed over Jordan and dwell in the land which the Lord your God will give you to inherit, and He hath given you repose from all your enemies round about, then shall you build the house of the Sanctuary, and afterward shall dwell securely.", "tj": "", "tj_en": "", "rashi": "<b>ועברתם את הירדן וישבתם בארץ.<\/b> שֶׁתְּחַלְּקוּהָ וִיהֵא כָל אֶחָד מַכִּיר אֶת חֶלְקוֹ וְאֶת שִׁבְתּוֹ (נ\"א – שִׁבְטוֹ):<br><br><b>והניח לכם.<\/b> לְאַחַר כִּבּוּשׁ וְחִלּוּק וּמְנוּחָה מִן הַגּוֹיִם אֲשֶׁר הִנִּיחַ ה' לְנַסּוֹת בָּם אֶת יִשְׂרָאֵל – וְאֵין זוֹ אֶלָּא בִּימֵי דָוִד – אָז:", "rashi_en": "ועברתם את הירדן וישבתם בארץ BUT WHEN YE GO OVER THE JORDAN, AND SETTLE IN THE LAND — This means, that ye shall have divided it amongst the tribes and every man knows his portion and the territory of his tribe,<br><br>והניח לכם AND WHEN HE GIVETH YOU REST — i.e., after having conquered and divided the land and having obtained rest from the nations “which the Lord left by which to prove Israel” (Judges 3:1) — which was only in the days of David (cf. Sifrei Devarim 68:3) — then,"}, {"ch": 12, "v": 11, "aliyah": 2, "heb": "וְהָיָ֣ה הַמָּק֗וֹם אֲשֶׁר־יִבְחַר֩ יְהֹוָ֨ה אֱלֹהֵיכֶ֥ם בּוֹ֙ לְשַׁכֵּ֤ן שְׁמוֹ֙ שָׁ֔ם שָׁ֣מָּה תָבִ֔יאוּ אֵ֛ת כׇּל־אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְכֶ֑ם עוֹלֹתֵיכֶ֣ם וְזִבְחֵיכֶ֗ם מַעְשְׂרֹֽתֵיכֶם֙ וּתְרֻמַ֣ת יֶדְכֶ֔ם וְכֹל֙ מִבְחַ֣ר נִדְרֵיכֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַיהֹוָֽה׃", "onk": "וִיהֵי אַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהֲכוֹן בֵּיהּ לְאַשְׁרָאָה <b>שְׁכִנְתֵּיהּ<\/b> תַּמָּן לְתַמָּן תַּיְתוּן יָת כָּל דִּי אֲנָא מְפַקֵּד יָתְכוֹן עֲלָוָתֵיכוֹן וְנִכְסַת <b>קוּדְשֵׁיכוֹן<\/b> מַעְשְׂרָתֵיכוֹן וְאַפְרָשׁוּת יֶדְכוֹן וְכֹל שְׁפַר נִדְרֵיכוֹן דִּי תִדְּרוּן <b>קֳדָם<\/b> יְיָ:", "onk_en": "Let it be that the place where Adonoy, your God, chooses to place His Presence [<b>Shechinah<\/b>] therein—it is there you shall bring all that I am commanding you: your burnt-offerings and your sacred-offerings, your tithes and your hand-offerings, and your choice promissory offerings that you pledge to [<b>before<\/b>] Adonoy.", "pj": "וִיהֵי אַתְרָא דְיִתְרְעֵי בֵּיהּ מֵימְרָא דַיְיָ לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן לְתַמָּן תַּיְיתוּן יַת כָּל קוּרְבָּנַיָא וּבִכּוּרַיָא וּמַעַשְרַיָא דַאֲנָא מְפַקֵּיד יַתְכוֹן תַּמָּן תִּקְרְבוּן עֲלָוַותְכוֹן וְנִכְסַת קוּדְשֵׁיכוֹן וְתַמָּן תֵּיכְלוּן מַעַשְרֵיכוֹן וְאַפְרָשׁוּת יְדֵיכוֹן וְכָל שְׁפַר נִדְרֵיכוֹן דְּתִידְרוּן קֳדָם יְיָ", "pj_en": "And to the place which the Word of the Lord will choose to make His Shekinah to dwell there, shall you bring all your oblations, firstlings, and tythes, which I command you; there shall you offer your sacrifices and hallowed victims, there eat your tythes and the separation of your hands, and all your goodly vows which you may have vowed before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>והיה המקום וגו'.<\/b> בְּנוּ לָכֶם בֵּית הַבְּחִירָה בִּירוּשָׁלַיִם, וְכֵן הוּא אוֹמֵר בְּדָוִד \"וַיְהִי כִּי יָשַׁב הַמֶּלֶךְ בְּבֵיתוֹ וַה' הֵנִיחַ לוֹ מִסָּבִיב מִכָּל אוֹיְבָיו וַיֹּאמֶר הַמֶּלֶךְ אֶל נָתָן הַנָּבִיא רְאֵה אָנֹכִי יוֹשֵׁב בְּבֵית אֲרָזִים, וַאֲרוֹן הָאֱלֹהִים יֹשֵׁב בְּתוֹךְ הַיְרִיעָה\" (שמואל ב ז'):<br><br><b>שמה תביאו וגו'.<\/b> לְמַעְלָה אָמוּר לְעִנְיַן שִׁילֹה וְכָאן אָמוּר לְעִנְיַן יְרוּשָׁלַיִם, וּלְכָךְ חִלְּקָם הַכָּתוּב לִתֵּן הֶתֵּר בֵּין זוֹ לְזוֹ, מִשֶּׁחָרְבָה שִׁילֹה וּבָאוּ לְנֹב וְחָרְבָה נֹב וּבָאוּ לְגִבְעוֹן הָיוּ הַבָּמוֹת מֻתָּרוֹת עַד שֶׁבָּאוּ לִירוּשָׁלַיִם (זבחים קיט):<br><br><b>מבחר נדריכם.<\/b> מְלַמֵּד שֶׁיָּבִיא מִן הַמֻּבְחָר (ספרי):", "rashi_en": "והיה המקום וגו׳ IT SHALL BE [THAT YE SHALL BRING TO] THE PLACE [WHICH THE LORD YOUR GOD SHALL CHOOSE … EVEN THITHER YE SHALL BRING ALL THAT I COMMAND YOU] — then build the “Chosen House” for yourselves in Jerusalem. And so indeed it states of David, (II Samuel 7:1, 2): “And it came to pass when the king sat in his house, and the Lord had given him rest round about from all his enemies, that the king said unto Nathan the prophet, ‘See now, I dwell in the house of cedar, but the Ark of God dwelleth within curtains …'” (Sifrei Devarim 67:3; cf. Rashi on that verse).<br><br>שמה תביאו THITHER SHALL YE BRING [ALL THAT I COMMAND YOU] — Above (v. 6) it (the same expression) is said in reference to Shiloh, but here it is said in reference to Jerusalem. It is for the following reason that Scripture divides the matter into two paragraphs: to give permission to offer on a Bamah in the intermediate period between the existence of the one sanctuary and the other; viz., that after Shiloh was destroyed and they came to Nob and erected the Tabernacle there, and then again when Nob was destroyed and they came to Gibeon, sacrificing on the Bamah was allowed until they finally came to Jerusalem (Zevachim 119a and Mishnah Zevachim 14:1).<br><br>מבחר נדריכם YOUR CHOICE VOWS — This teaches that one should bring one’s offerings from the choicest (Sifrei Devarim 68:4)."}, {"ch": 12, "v": 12, "aliyah": 2, "heb": "וּשְׂמַחְתֶּ֗ם לִפְנֵי֮ יְהֹוָ֣ה אֱלֹֽהֵיכֶם֒ אַתֶּ֗ם וּבְנֵיכֶם֙ וּבְנֹ֣תֵיכֶ֔ם וְעַבְדֵיכֶ֖ם וְאַמְהֹתֵיכֶ֑ם וְהַלֵּוִי֙ אֲשֶׁ֣ר בְּשַֽׁעֲרֵיכֶ֔ם כִּ֣י אֵ֥ין ל֛וֹ חֵ֥לֶק וְנַחֲלָ֖ה אִתְּכֶֽם׃", "onk": "וְתֶחֱדוּן קֳדָם יְיָ אֱלָהֲכוֹן אַתּוּן וּבְנֵיכוֹן וּבְנָתֵיכוֹן וְעַבְדֵיכוֹן וְאַמְהָתֵיכוֹן וְלֵוָאָה דִּי בְקִרְוֵיכוֹן אֲרֵי לֵית לֵיהּ חֳלָק וְאַחֲסָנָא עִמְּכוֹן:", "onk_en": "You are to rejoice in the presence of Adonoy, your God, you and your sons and your daughters, your male slaves and your female slaves, and the Levite who is in your cities, for he has no portion or territory with you.", "pj": "וְתֶחְדוּן קֳדָם יְיָ אֱלָהָכוֹן אַתּוּן וּבְנֵיכוֹן וּבְנָתֵיכוֹן וְעַבְדֵיכוֹן וְאַמְהַתְכוֹן וְלֵוָאֵי דִבְקִירְוֵיכוֹן אֲרוּם לֵית לֵיהּ חוּלַק וְאַחֲסָנָא עִמְכוֹן", "pj_en": "And you shall rejoice before the Lord your God, you and your sons and daughters, your servants and handmaids, and the Levite who is in your cities, for he hath no portion or inheritance with you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 13, "aliyah": 2, "heb": "הִשָּׁ֣מֶר לְךָ֔ פֶּֽן־תַּעֲלֶ֖ה עֹלֹתֶ֑יךָ בְּכׇל־מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה׃", "onk": "אִסְתַּמַּר לָךְ דִּילְמָא תַסֵּק עֲלָוָתָךְ בְּכָל אַתְרָא דִּי תֶחֱזֵי:", "onk_en": "Take heed, lest you offer up your burnt-offerings anywhere you envision as proper.", "pj": "אִסְתַּמָּרוּ לְכוֹן דִּילְמָא תַסְקוּן עֲלָוַותְכוֹן בְּכָל אַתְרָא דְאַתּוּן חַמְיָין", "pj_en": "Beware lest you offer your sacrifices in any place which thou mayest see;", "tj": "", "tj_en": "", "rashi": "<b>השמר לך.<\/b> לִתֵּן לֹא תַעֲשֶׂה עַל הַדָּבָר:<br><br><b>בכל מקום אשר תראה.<\/b> אֲשֶׁר יַעֲלֶה בְּלִבְּךָ, אֲבָל אַתָּה מַקְרִיב עַ\"פִּ נָבִיא, כְּגוֹן אֵלִיָּהוּ בְּהַר הַכַּרְמֶל (שם):", "rashi_en": "השמר לך TAKE HEED TO THYSELF [LEST THOU OFFER THY BURNT OFFERINGS IN EVERY PLACE THAT THOU SEEST] — This negative form of the positive command in v. 11, is stated in order to attach a negative command (לאו) to this matter (Sifrei Devarim 70:1).<br><br>בכל מקום אשר תראה IN EVERY PLACE THAT “THOU” SEEST — i.e., that enters thy mind, but thou mayest offer anywhere by the command of a prophet, as, for instance, Elijah did on Mount Carmel (1 Kings 18:21 ff.) (Sifrei Devarim 70:3)."}, {"ch": 12, "v": 14, "aliyah": 2, "heb": "כִּ֣י אִם־בַּמָּק֞וֹם אֲשֶׁר־יִבְחַ֤ר יְהֹוָה֙ בְּאַחַ֣ד שְׁבָטֶ֔יךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑יךָ וְשָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽךָּ׃", "onk": "אֶלָּהֵן בְּאַתְרָא דִּי יִתִּרְעֵי יְיָ בְּחַד מִן שִׁבְטָיךְ תַּמָּן תַּסֵּק עֲלָוָתָךְ וְתַמָּן תַּעְבֵּד כֹּל דִּי אֲנָא מְפַקְּדָךְ:", "onk_en": "Solely in the place that Adonoy chooses within one of your tribes, there are you to offer up your burnt-offerings, and there are you to do everything that I am commanding you.", "pj": "אֱלָהֵן לְאַתְרָא דְיִתְרְעֵי יְיָ בְּאַחֲסָנַת חַד מִן שִׁבְטֵיכוֹן תַּמָּן תִּסְקוּן עֲלָוַותְכוֹן וְתַמָּן תַּעַבְדוּן יַת כָּל מַה דַאֲנָא מְפַקֵּיד לְכוֹן", "pj_en": "but in the Place which the Lord will choose in the inheritance of one of your tribes, there shall you offer your sacrifices and do whatever I command you.", "tj": "", "tj_en": "", "rashi": "<b>באחד שבטיך.<\/b> בְּחֶלְקוֹ שֶׁל בִּנְיָמִין, וּלְמַעְלָה הוּא אוֹמֵר \"מִכָּל שִׁבְטֵיכֶם\", הָא כֵיצַד? כְּשֶׁקָּנָה דָּוִד אֶת הַגֹּרֶן מֵאֲרַוְנָה הַיְבוּסִי גָּבָה הַזָּהָב מִכָּל הַשְּׁבָטִים, וּמִכָּל מָקוֹם הַגֹּרֶן בְּחֶלְקוֹ שֶׁל בִּנְיָמִין הָיָה (שם):", "rashi_en": "באחד שבטיך [BUT IN THE PLACE WHICH THE LORD SHALL CHOOSE] IN ONE OF THY TRIBES — namely in the allotment of Benjamin (in whose territory the Temple stood). But above (v. 5) it states, “the place which the Lord … shall choose from all your tribes”? How can this be reconciled with that? In the following manner: when David bought the threshing-floor from Araunah the Jebusite (II Samuel 24:24) to build the Temple thereon, he collected money from all the tribes; however, the threshing-floor itself was situated in the territory of Benjamin (Sifrei Devarim 62:3)."}, {"ch": 12, "v": 15, "aliyah": 2, "heb": "רַק֩ בְּכׇל־אַוַּ֨ת נַפְשְׁךָ֜ תִּזְבַּ֣ח&thinsp;<b>׀<\/b> וְאָכַלְתָּ֣ בָשָׂ֗ר כְּבִרְכַּ֨ת יְהֹוָ֧ה אֱלֹהֶ֛יךָ אֲשֶׁ֥ר נָֽתַן־לְךָ֖ בְּכׇל־שְׁעָרֶ֑יךָ הַטָּמֵ֤א וְהַטָּהוֹר֙ יֹאכְלֶ֔נּוּ כַּצְּבִ֖י וְכָאַיָּֽל׃", "onk": "לְחוֹד בְּכָל רְעוּת נַפְשָׁךְ תִּכּוֹס וְתֵיכוּל בִּשְׂרָא כְּבִרְכְּתָא דַיְיָ אֱלָהָךְ דִּי יְהַב לָךְ בְּכָל קִרְוָיךְ מְסָאָבָא וְדַכְיָא יֵכְלֻנֵיהּ <b>כִּבְשַׂר<\/b> טַבְיָא וְאַיְלָא:", "onk_en": "Except with the fullness of your appetite you may slaughter and eat meat in accord with the blessing of Adonoy, your God, that He has given you in all your cities; the ritually unclean and the clean will eat it like the [<b>meat of the<\/b>] deer and the gazelle.", "pj": "לְחוֹד בְּכָל רַעֲוַות נַפְשְׁכוֹן תִּיכְסוּן וְתֵיכְלוּן בִּישְרָא הֵי כְּבִרְכָתָא דַיְיָ אֱלָהָכוֹן דִּיהַב לְכוֹן בְּכָל קִירְוֵיכוֹן דִּמְסָאֲבִין מִן לְמִיקְרַב לְקוּדְשַׁיָא וְדִדְכִין לְמִקְרַב לְקוּדְשַׁיָא כַּחֲדָא יֵיכְלוּן יָתֵיהּ כְּבִישְרֵיהּ דְּטַבְיָא וּכְאַיְלָא", "pj_en": "Nevertheless, after every wish of your soul, you may kill and eat flesh according to the blessing of the Lord your God, which He will give you in all your cities; they who are unclean so as not to be able to offer holy things, and they who are clean that they may offer holy things, may eat of it alike, as the flesh of the antelope or of the hart.", "tj": "", "tj_en": "", "rashi": "<b>רק בכל אות נפשך.<\/b> בַּמֶּה הַכָּתוּב מְדַבֵּר? אִם בִּבְשַׂר תַּאֲוָה לְהַתִּירָהּ לָהֶם בְּלֹא הַקְרָבַת אֵמוּרִים הֲרֵי אָמוּר בְּמָקוֹם אַחֵר (פסוק כ') \"כִּי יַרְחִיב ה' אֶת גְּבוּלְךָ וְגוֹ' וְאָמַרְתָּ אֹכְלָה בָשָׂר וְגוֹ'\", בַּמֶּה זֶה מְדַבֵּר? בְּקָדָשִׁים שֶׁנָּפַל בָּהֶם מוּם שֶׁיִּפָּדוּ וְיֵאָכְלוּ בְּכָל מָקוֹם, יָכוֹל יִפָּדוּ עַל מוּם עוֹבֵר? תַּ\"לֹ \"רַק\" (ספרי):<br><br><b>תזבח ואכלת.<\/b> אֵין לְךָ בָהֶם הֶתֵּר גִּזָּה וְחָלָב אֶלָּא אֲכִילָה עַל יְדֵי זְבִיחָה (בכ' ו'):<br><br><b>הטמא והטהר.<\/b> לְפִי שֶׁבָּאוּ מִכֹּחַ קָדָשִׁים שֶׁנֶּאֱמַר בָּהֶם \"וְהַבָּשָׂר אֲשֶׁר יִגַּע בְּכָל טָמֵא לֹא יֵאָכֵל\" (ויקרא ז'), הֻצְרַךְ לְהַתִּיר בּוֹ שֶׁטָּמֵא וְטָהוֹר אוֹכְלִים בִּקְעָרָה אַחַת:<br><br><b>כצבי וכאיל.<\/b> שֶׁאֵין קָרְבָּן בָּא מֵהֶם:<br><br><b>כצבי וכאיל.<\/b> לְפָטְרָן מִן הַזְּרוֹעַ וְהַלְּחָיַיִם וְהַקֵּבָה (ספרי):", "rashi_en": "רק בכל אות נפשך HOWEVER [THOU MAYEST SLAUGHTER AND EAT FLESH IN ALL THY GATES] IN EVERY LONGING OF THY SOUL — About what is Scripture here speaking? If you say that it speaks about בשר תאוה (flesh eaten for satisfying the appetite — an ordinary meal of meat and not a sacrificial meal) and that this verse is intended to permit it to them without offering the fat portions on the altar, behold, it states in another passage (v. 20) “When the Lord thy God shall enlarge thy boundary … and thou shalt say, I will eat flesh, [because thy soul longeth to eat flesh; thou mayest eat flesh in every longing of thy soul]”! About what, then, is this verse speaking? About consecrated animals which had become blemished, — that they must be redeemed and may then be eaten in anyplace (בכל שעריך). One might think that they may be redeemed and thus divested of their holy character also on account of a transitory blemish! Scripture, however, uses the expression רק (which word has a limitative force) (Sifrei Devarim 71:1).<br><br>תזבח ואכלת THOU MAYEST SLAUGHTER AND EAT [FLESH] — You have no permission to use their fleece or milk (those of consecrated animals that had become blemished), but only the eating of their flesh after ritual slaughtering is permitted (cf. Sifrei Devarim 71:2-3; Bekhorot 15b).<br><br>הטמא והטהור THE UNCLEAN AND THE CLEAN [MAY EAT THEREOF] — Because they (the consecrated animals that had become blemished) came to their present status by virtue of once having been consecrated animals, of which it is stated, (Leviticus 7:19) “And the flesh of offerings that toucheth any unclean thing shall not be eaten”, it felt it necessary explicitly to permit in their case that an unclean and a clean person may eat out of the same dish (i.e. together) (cf. Sifrei Devarim 71:7),<br><br>כצבי וכאיל AS OF THE GAZELLE AND OF THE HART of which no sacrifice is ever brought.<br><br>כצבי וכאיל AS OF THE GAZELLE, AND OF THE HART — These apparently redundant words are intended to exempt them (the פסולי המקדשין שנפדו) from the dues of “the shoulder, the two cheeks and the maw” (Deuteronomy 18:3) which are compulsory gifts to the priests in the case of non-holy (חולין) animals (Chullin 130a; Sifrei Devarim 71:9)."}, {"ch": 12, "v": 16, "aliyah": 2, "heb": "רַ֥ק הַדָּ֖ם לֹ֣א תֹאכֵ֑לוּ עַל־הָאָ֥רֶץ תִּשְׁפְּכֶ֖נּוּ כַּמָּֽיִם׃", "onk": "לְחוֹד דְּמָא לָא תֵיכְלוּן עַל אַרְעָא תִשְׁדִּנֵּיהּ כְּמַיָּא:", "onk_en": "However, you may not eat the blood; on the earth are you to spill it like water.", "pj": "לְחוֹד בְּאַדְמָא הֲווֹ זְהִירִין עַל אַרְעָא תֵּישְׁדוּנֵיהּ הֵי כְּמוֹי", "pj_en": "Only be careful to pour out the blood upon the ground like water.", "tj": "", "tj_en": "", "rashi": "<b>רק הדם לא תאכלו.<\/b> אַעַ\"פִּ שֶׁאָמַרְתִּי שֶׁאֵין לְךָ בוֹ זְרִיקַת דָּם בַּמִּזְבֵּח, לֹא תֹּאכְלֶנּוּ:<br><br><b>תשפכנו כמים.<\/b> לוֹמַר לְךָ שֶׁאֵין צָרִיךְ כִּסּוּי (ספרי; חולין פ\"ד). דָּ\"אַ — הֲרֵי הוּא כַמַּיִם לְהַכְשִׁיר אֶת הַזְּרָעִים (שם ל\"ה):", "rashi_en": "רק הדם לא תאכלו ONLY YE SHALL NOT EAT THE BLOOD — Although I have told you that there is no sprinkling of blood on the altar in its case (it being blemished and thus unfit for the altar), you shall nevertheless not eat it.<br><br>תשפכנו כמים YE SHALL POUR IT [UPON THE EARTH] AS WATER — This latter word is intended to tell you that although they are compared to these חיות, yet it (the blood) requires no covering with dust as prescribed in the case of these חיות in Leviticus 17:13 (Sifrei Devarim 71:15; Chullin 84a). Another explanation is that the word כמים is intended to suggest: It is like water in so far as to make seed (food) receptive to uncleanness just as water does (cf. Leviticus 11:38) (Sifrei Devarim 71:15; Chullin 35b)."}, {"ch": 12, "v": 17, "aliyah": 2, "heb": "לֹֽא־תוּכַ֞ל לֶאֱכֹ֣ל בִּשְׁעָרֶ֗יךָ מַעְשַׂ֤ר דְּגָֽנְךָ֙ וְתִירֹשְׁךָ֣ וְיִצְהָרֶ֔ךָ וּבְכֹרֹ֥ת בְּקָרְךָ֖ וְצֹאנֶ֑ךָ וְכׇל־נְדָרֶ֙יךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְנִדְבֹתֶ֖יךָ וּתְרוּמַ֥ת יָדֶֽךָ׃", "onk": "לֵית לָךְ רְשׁוּ לְמֵיכַל בְּקִרְוָיךְ מַעְשַׂר עִבוּרָךְ חַמְרָךְ וּמִשְׁחָךְ וּבְכוֹרֵי תוֹרָךְ וְעָנָךְ וְכָל נִדְרָךְ דִּי תִדַּר וְנִדְבָתָיךְ <b>וְאַפְרָשׁוּת<\/b> יְדָךְ:", "onk_en": "You are not permitted to eat in your cities the tithe of your grain and your wine and your olive oil, and the first-born of your cattle and your flocks, and all your pledges that you pledge, and your donations and the terumah-separation of your hand<b>-offerings<\/b>].", "pj": "לֵיתֵיכוֹן רַשָּׁאִין לְמֵיכוּל בְּקִירְוֵיכוֹן מַעַשְרֵי עִיבּוּרֵיכוֹן חַמְרֵיכוֹן וּמִשְׁחֵיכוֹן וּבִיכּוּרֵי תּוֹרֵיכוֹן וְעַנְכוֹן וְכָל נִדְרֵיכוֹן דְּתִדְרוּן וְנִסְבָתֵיכוֹן וְאַפְרָשׁוּת יְדֵיכוֹן", "pj_en": "It will not be lawful for you to eat the tenths of your corn, or wine, or oil, or the firstlings of your herd or flock, nor any of the vows that you have vowed, or freewill offerings, or the separation of your hands in your cities;", "tj": "", "tj_en": "", "rashi": "<b>לא תוכל.<\/b> בָּא הַכָּתוּב לִתֵּן לֹא תַעֲשֶׂה עַל הַדָּבָר:<br><br><b>לא תוכל.<\/b> רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה אוֹמֵר יָכוֹל אַתָּה, אֲבָל אֵינְךָ רַשַּׁאי, כַּיּוֹצֵא בוֹ (יהושע ט\"ו) \"וְאֶת הַיְבוּסִי יוֹשְׁבֵי יְרוּשָׁלַיִם לֹא יָכְלוּ בְנֵי יִשְׂרָאֵל (יְהוּדָה) לְהוֹרִישָׁם\", יְכוֹלִים הָיוּ, אֶלָּא שֶׁאֵינָן רַשָּׁאִין לְפִי שֶׁכָּרַת לָהֶם אַבְרָהָם בְּרִית כְּשֶׁלָּקַח מֵהֶם מְעָרַת הַמַּכְפֵּלָה; וְלֹא יְבוּסִים הָיוּ, אֶלָּא חִתִּיִּים הָיוּ, אֶלָּא עַל שֵׁם הָעִיר שֶׁשְּׁמָהּ יְבוּס, כָּךְ מְפֹרָשׁ בְּפִרְקֵי דְּרַבִּי אֱלִיעֶזֶר (פ' ל\"ו), וְהוּא שֶׁנֶּאֱמַר \"כִּי אִם הֱסִירְךָ הָעִוְרִים וְהַפִּסְחִים\" (שמואל ב ה') – צְלָמִים שֶׁכָּתְבוּ עֲלֵיהֶם אֶת הַשְּׁבוּעָה:<br><br><b>ובכרת בקרך.<\/b> אַזְהָרָה לַכֹּהֲנִים:<br><br><b>ותרומת ידך.<\/b> אֵלּוּ הַבִּכּוּרִים (ספרי; מכות י\"ז):", "rashi_en": "לא תוכל THOU MAYEST NOT [EAT WITHIN THY GATES THE TITHE OF THY CORN etc.] — Scripture thereby intends to attach to this matter (the eating of מעשר בכור etc. outside the walls of Jerusalem) a negative command also (the positive command being contained in v. 11).<br><br>לא תוכל THOU MAYEST NOT (lit., thou canst not) [EAT etc.] — Rabbi Joshua the son of Korcha said: You can, but you are not allowed to (i.e. לא תוכל does not mean: you are unable for some reason or another to do so, but it expresses the inability to do it because of a legal restriction). A similar case we have in (Joshua 15:63) “As to the Jebusites, the inhabitants of Jerusalem, the children of Judah could not drive them out” — they could have done so, but they were not allowed to (Sifrei Devarim 72:1); because Abraham had made a covenant with them when he bought from them the cave of Machpelah that they would be spared at the conquest of the Land. — As a matter fact they were not Jebusites but Hittites (the people mentioned in Genesis 23 at the purchase of the cave), but they were called Jebusites after the city the name of which was Jebus. Thus is it explained in the Pirkei DeRabbi Eliezer 36. And this is the meaning of what is stated, that when David was about to drive out the Jebusites, they said to him (II Samuel 5:6) “Except thou take away the blind and the lame [thou shalt not come in hither]” — by “the blind and the lame” they meant the idols (that stood at the gates) upon which they had written the oath which Abraham had taken.<br><br>ובכרת בקרך [THOU MAYEST NOT EAT WITHIN THY GATES THE TITHE OF THY CORN …] AND THE FIRSTLINGS OF THY HERD — This, in contradistinction to מעשר דגנך וכו׳, is of course a prohibition addressed to the priests (since the Israelites were not at all permitted to eat firstlings; cf. Zevachim 5:1: הבכור נאכל לכהנים והמעשר לכל אדם).<br><br>‎ ותרומת ידך AND THE HEAVE-OFFERINGS OF THY HAND — This refers to the first-fruits (cf. Deuteronomy 26:4) (Sifrei Devarim 72:9; Makkot 17a)."}, {"ch": 12, "v": 18, "aliyah": 2, "heb": "כִּ֡י אִם־לִפְנֵי֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ תֹּאכְלֶ֗נּוּ בַּמָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהֹוָ֣ה אֱלֹהֶ֘יךָ֮ בּוֹ֒ אַתָּ֨ה וּבִנְךָ֤ וּבִתֶּ֙ךָ֙ וְעַבְדְּךָ֣ וַאֲמָתֶ֔ךָ וְהַלֵּוִ֖י אֲשֶׁ֣ר בִּשְׁעָרֶ֑יךָ וְשָׂמַחְתָּ֗ לִפְנֵי֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּכֹ֖ל מִשְׁלַ֥ח יָדֶֽךָ׃", "onk": "אֶלָּהֵן קֳדָם יְיָ אֱלָהָךְ תֵּיכְלִנֵּיהּ בְּאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ בֵּיהּ אַתְּ וּבְרָךְ וּבְרַתָּךְ וְעַבְדָּךְ וְאַמְתָךְ וְלֵוָאָה דִּי בְקִרְוָיךְ וְתֶחֱדֵי קֳדָם יְיָ אֱלָהָךְ בְּכָל אוֹשָׁטוּת יְדָךְ:", "onk_en": "Rather, before Adonoy, your God, are you to eat it, in the place that Adonoy, your God, chooses—you and your son and your daughter, and your male slave and your female slave, and the Levite in your cities; and you will be happy in the presence of Adonoy, your God, with the sum of your handiwork.", "pj": "אֱלָהֵן קֳדָם יְיָ אֱלָהָכוֹן תֵּיכְלוּנֵיהּ בְּאַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן בֵּיהּ אַתּוּן וּבְנֵיכוֹן וּבְנָתֵיכוֹן וְעַבְדֵיכוֹן וְאַמְהוֹתֵיכוֹן וְלֵיוָאֵי דִבְקִירְוֵיכוֹן וְתֶחְדוּן קֳדָם יְיָ אֱלָהָכוֹן בְּכָל אוֹשָׁטוּת יְדֵיכוֹן", "pj_en": "but you shall eat it before the Lord your God, in the place which the Lord your God will choose; you, and your sons and daughters, and your handmaids, and the Levites who are in your cities; and you shall rejoice before the Lord your God, in all that thou puttest thine hand unto.", "tj": "", "tj_en": "", "rashi": "<b>לפני ה'.<\/b> לִפְנִים מִן הַחוֹמָה:<br><br><b>והלוי אשר בשעריך.<\/b> אִם אֵין לְךָ לָתֵת לוֹ מֵחֶלְקוֹ, כְּגוֹן מַעֲשֵׂר רִאשׁוֹן, תֵּן לוֹ מַעְשַׂר עָנִי, אֵין לְךָ מַעְשַׂר עָנִי, הַזְמִינֵהוּ עַל שְׁלָמֶיךָ (ספרי):", "rashi_en": "לפני ה׳ [BUT THOU MUST EAT THEM] BEFORE THE LORD — i.e. within the walls of the city of Jerusalem.<br><br>והלוי אשר בשעריך [BUT THOU MUST EAT THEM BEFORE THE LORD, THOU …] AND THE LEVITE THAT IS WITHIN THY GATES — If you have nought to give him that is due to him as his portion, as, for instance, the first tithe, give him the “tithe of the poor” (the tithe that replaces the “second tithe” in the 3rd and 6th year of the Sabbatical period); and if you have no “tithe of the poor”, invite him to your feast-offering meal (Sifrei Devarim 74:5)."}, {"ch": 12, "v": 19, "aliyah": 2, "heb": "הִשָּׁ֣מֶר לְךָ֔ פֶּֽן־תַּעֲזֹ֖ב אֶת־הַלֵּוִ֑י כׇּל־יָמֶ֖יךָ עַל־אַדְמָתֶֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִסְתַּמַּר לָךְ דִּילְמָא תִשְׁבּוֹק יָת לֵוָאֵי כָּל יוֹמָיךְ עַל אַרְעָךְ:", "onk_en": "Watch yourself, lest you forsake the Levite, all your years on your land.", "pj": "אִסְתַּמָּרוּ לְכוֹן דִּלְמָא תִּימְעָלוּן עַל לֵוָאֵי כָּל יוֹמֵיכוֹן דְּאַתּוּן שָׁרַן עַל אַרְעֲכוֹן", "pj_en": "Beware that thou aggrieve not the Levite all your days in which you dwell in your land.", "tj": "", "tj_en": "", "rashi": "<b>השמר לך.<\/b> לִתֵּן לֹא תַעֲשֶׂה עַל הַדָּבָר (ספרי):<br><br><b>על אדמתך.<\/b> אֲבָל בַּגּוֹלָה אֵינְךָ מֻזְהָר עָלָיו יוֹתֵר מֵעֲנִיֵּי יִשְׂרָאֵל (שם):", "rashi_en": "השמר לך TAKE HEED TO THYSELF [LEST THOU FORSAKE THE LEVITE] — This is intended in addition to the positive command expressed in the previous verse, to attach to it (the neglect of the Levite) a negative command, also.<br><br>על אדמתך [TAKE HEED TO THYSELF LEST THOU FORSAKE THE LEVITE] UPON THY GROUND — but in exile (outside the Holy Land) you are not admonished as regards him more than as regards the poor of the ordinary Israelites (Sifrei Devarim 74:9; Talmud Yerushalmi Horayot end)."}, {"ch": 12, "v": 20, "aliyah": 2, "heb": "כִּֽי־יַרְחִיב֩ יְהֹוָ֨ה אֱלֹהֶ֥יךָ אֶֽת־גְּבֻלְךָ֮ כַּאֲשֶׁ֣ר דִּבֶּר־לָךְ֒ וְאָמַרְתָּ֙ אֹכְלָ֣ה בָשָׂ֔ר כִּֽי־תְאַוֶּ֥ה נַפְשְׁךָ֖ לֶאֱכֹ֣ל בָּשָׂ֑ר בְּכׇל־אַוַּ֥ת נַפְשְׁךָ֖ תֹּאכַ֥ל בָּשָֽׂר׃", "onk": "אֲרֵי יַפְתֵּי יְיָ אֱלָהָךְ יָת תְּחוּמָךְ כְּמָא דִי מַלִּיל לָךְ וְתֵימַר אֵכוּל בִּשְׂרָא אֲרֵי תִתִּרְעֵי נַפְשָׁךְ לְמֵיכַל בִּשְׂרָא בְּכָל רְעוּת נַפְשָׁךְ תֵּיכוּל בִּשְׂרָא:", "onk_en": "When Adonoy, your God, expands your border as He promised you, and you say, ‘‘I would like to eat meat’’ because you have an appetite to eat meat; to the full extent of your appetite eat meat.", "pj": "אֲרוּם יַפְתֵּי יְיָ אֱלָהָכוֹן יַת תְּחוּמְכוֹן הֵיכְמָא דְמַלֵּיל לְכוֹן וְתֵימַר אֵיכוֹל בִּישְרָא אֲרוּם תֵירוּג נַפְשָׁךְ לְמֵיכוֹל בִּישְרָא בְּכָל רְגוּג נַפְשָׁךְ תֵּיכוּל בִּישְרָא", "pj_en": "When the Lord your God will have enlarged your border, as He hath said unto you; and thou sayest, I would eat flesh, because thy soul may desire to eat flesh, thou mayest eat flesh according to all thy desire.", "tj": "", "tj_en": "", "rashi": "<b>כי ירחיב וגו'.<\/b> לִמְּדָה תוֹרָה דֶּרֶךְ אֶרֶץ שֶׁלֹּא יִתְאַוֶּה אָדָם לֶאֱכֹל בָּשָׂר אֶלָּא מִתּוֹךְ רַחֲבַת יָדַיִם וְעֹשֶׁר (חולין פ\"ד):<br><br><b>כל אות נפשך וגו'.<\/b> אֲבָל בַּמִּדְבָּר נֶאֱסַר לָהֶם בְּשַׂר חֻלִּין אֶלָּא אִם כֵּן מַקְדִּישָׁהּ וּמַקְרִיבָהּ שְׁלָמִים (שם ט\"ז):", "rashi_en": "כי ירחיב וגו׳ WHEN [THE LORD THY GOD] SHALL ENLARGE [YOUR BOUNDARY … AND YOU SHALL SAY, I WILL EAT FLESH … YOU MAY EAT FLESH] — The Torah teaches the proper rule of life — that one should not desire to eat flesh unless he lives amidst abundance and wealth (cf. Sifrei Devarim 75:5; Chullin 84a; see also Rashi on Leviticus 17:13).<br><br>בכל אות נפשך וגו׳ [YOU MAY EAT FLESH] IN EVERY LONGING OF YOUR SOUL — In the wilderness, however, the flesh of a non-holy animal was forbidden to them as food, unless one first dedicated it to the altar and offered it as a peace-offering (Sifrei Devarim 75:4; Chullin 16b)."}, {"ch": 12, "v": 21, "aliyah": 2, "heb": "כִּֽי־יִרְחַ֨ק מִמְּךָ֜ הַמָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהֹוָ֣ה אֱלֹהֶ֘יךָ֮ לָשׂ֣וּם שְׁמ֣וֹ שָׁם֒ וְזָבַחְתָּ֞ מִבְּקָרְךָ֣ וּמִצֹּֽאנְךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהֹוָה֙ לְךָ֔ כַּאֲשֶׁ֖ר צִוִּיתִ֑ךָ וְאָֽכַלְתָּ֙ בִּשְׁעָרֶ֔יךָ בְּכֹ֖ל אַוַּ֥ת נַפְשֶֽׁךָ׃", "onk": "אֲרֵי יִתְרָחַק מִנָּךְ אַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ לְאַשְׁרָאָה <b>שְׁכִנְתֵּיהּ<\/b> תַּמָּן וְתִכּוֹס מִתּוֹרָךְ וּמֵעָנָךְ דִּי יְהַב יְיָ לָךְ כְּמָא דִי פַּקֵּדִתָּךְ וְתֵיכוּל בְּקִרְוָיךְ בְּכֹל רְעוּת נַפְשָׁךְ:", "onk_en": "When the place is distant from you that Adonoy, your God, chooses to set His Presence [<b>Shechinah<\/b>] there, you may slaughter some of your cattle or your flocks that Adonoy gave you, as I have commanded you; and you will eat in your cities with all your appetite.", "pj": "אֲרוּם יִתְרְחַק מִנְכוֹן אַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן וְתִכְסוּן מִן תּוֹרֵיכוֹן וּמִן עָנֵיכוֹן דִּיהַב יְיָ אֱלָהָכוֹן לְכוֹן הֵיכְמָא דְפַקֵּדִית יַתְכוֹן וְתֵיכְלוּן בְּקִירְוֵיכוֹן בְּכָל רִיגוֹג נַפְשֵׁיכוֹן", "pj_en": "But if the place which the Lord your God will have chosen that His Shekinah may dwell there be too far off, then may you eat of your herds and flocks which the Lord your God shall give you, as I have com- manded you, in your cities you may eat, according to all the desire of your soul:", "tj": "", "tj_en": "", "rashi": "<b>כי ירחק ממך המקום.<\/b> וְלֹא תוּכַל לָבֹא וְלַעֲשׂוֹת שְׁלָמִים בְּכָל יוֹם כְּמוֹ עַכְשָׁו שֶׁהַמִּשְׁכָּן הוֹלֵךְ עִמָּכֶם:<br><br><b>וזבחת … כאשר צויתך.<\/b> לָמַדְנוּ שֶׁיֵּשׁ צִוּוּי בַּזְּבִיחָה הֵיאַךְ יִשְׁחֹט, וְהֵן הִלְכוֹת שְׁחִיטָה שֶׁנֶּאֶמְרוּ לְמֹשֶׁה בְּסִינַי (שם כ\"ח):", "rashi_en": "כי ירחק ממך המקום IF THE PLACE [WHICH THE LORD THY GOD HAS CHOSEN TO PUT HIS NAME THERE] BE TOO FAR FROM THEE and thou therefore art unable to come and prepare peace-offerings at any time, as thou doest now when the Tabernacle accompanies you,<br><br>וזבחת … כאשר צויתך THEN THOU MAYEST SLAUGHTER … AS I HAVE COMMANDED THEE — This teaches us that there was already a commandment regarding the slaughtering of animals — as to how one should slaughter; it is not written in the Torah but it comprises the traditional regulations regarding the slaughter of animals that were given orally (נאמרו) to Moses on Mount Sinai (Sifrei Devarim 75:7; Chullin 28a)."}, {"ch": 12, "v": 22, "aliyah": 2, "heb": "אַ֗ךְ כַּאֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת־הַצְּבִי֙ וְאֶת־הָ֣אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑נּוּ הַטָּמֵא֙ וְהַטָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽנּוּ׃", "onk": "בְּרַם כְּמָא דִי מִתְאֲכֵל <b>בְּשַׂר<\/b> טַבְיָא וְאַיְלָא כֵּן תֵּיכְלִנֵּיהּ מְסָאָבָא וְדַכְיָא כַּחֲדָא יֵכְלִנֵּיהּ:", "onk_en": "Only, as the [<b>meat of the<\/b>] dear and the gazelle may be eaten, so may you eat it; the ritually unclean and the clean together may eat it.", "pj": "בְּרַם הֵיכְמָא דְמִתְאָכֵל בִּישְרָא דְטַבְיָא וְאַיְלָא הֵיכְדֵין תֵּיכְלוּנֵיהּ דִּמְסָאַב לְמִקְרַב לְקוּדְשַׁיָא וְדִדְכֵי לְמִקְרַב לְקוּדְשָׁא כַּחֲדָא תֵּיכְלוּן", "pj_en": "as the flesh of the antelope or hart so may you eat it; he who is unclean that he may not offer holy things, and he who is clean that he may offer them, may eat of it alike.", "tj": "דִּמְרָחֵק מִן קוּדְשַׁיָא וְדִדְכֵי מִן קוּדְשַׁיָא כַּחֲדָא תֵּיכְלוּן:", "tj_en": "He who is restrained from holy things, and he who is clean for holy things, may eat alike.", "rashi": "<b>אך כאשר יאכל את הצבי וגו'.<\/b> אֵינְךָ מֻזְהָר לְאָכְלָן בְּטָהֳרָה, אִי מַה צְּבִי וְאַיָּל חֶלְבָּן מֻתָּר אַף חֻלִּין חֶלְבָּן מֻתָּר? תַּ\"לֹ \"אַךְ\":", "rashi_en": "אך כאשר יאכל את הצבי וגו׳ BUT ONLY AS THE GAZELLE [AND THE HART] IS EATEN, [SO THOU SHALT EAT THEM] — i.e. thou art not admonished to eat them in a state of cleanness as is the case with sacrifices which you slaughter in a holy place; if, however, you will argue: How is the case with the gazelle and the hart? Their fat is permitted as food; so, too, is the fat of non-consecrated domestic animals (חולין) permitted! Then I reply: Scripture says אך (which word has a limitative force and thus indicates that חולין are not to be treated like the gazelle and the hart in every respect) (cf. Bekhorot 15a)."}, {"ch": 12, "v": 23, "aliyah": 2, "heb": "רַ֣ק חֲזַ֗ק לְבִלְתִּי֙ אֲכֹ֣ל הַדָּ֔ם כִּ֥י הַדָּ֖ם ה֣וּא הַנָּ֑פֶשׁ וְלֹא־תֹאכַ֥ל הַנֶּ֖פֶשׁ עִם־הַבָּשָֽׂר׃", "onk": "לְחוֹד תְּקֵף <b>בְּדִיל<\/b> דְּלָא לְמֵיכַל דְּמָא אֲרֵי דְמָא הוּא נַפְשָׁא וְלָא תֵיכוּל נַפְשָׁא עִם בִּשְׂרָא:", "onk_en": "Only, exercise strength in not eating [<b>in order not to eat<\/b>] the blood, for the blood is the life; and do not eat the spirit with the meat.", "pj": "לְחוֹד אִיתוֹקְפוּן בְּיִצְרֵיכוֹן מְטוּל דְּלָא לְמֵיכוּל אִידְמָא אֲרוּם אִידְמָא הוּא קִיּוּם נַפְשָׁא וְלָא תֵיכְלוּן אִידְמָא דְבֵיהּ קִיּוּם נַפְשָׁא עִם בִּישְרָא", "pj_en": "Only put a strong restraint upon your desires, that you eat no blood; for the blood is the subsistence of the life. You may not, with the flesh, eat blood, in which is the subsistence of life:", "tj": "", "tj_en": "", "rashi": "<b>רק חזק לבלתי אכל הדם.<\/b> מִמַּה שֶּׁנֶּאֱמַר חֲזַק אַתָּה לָמֵד שֶׁהָיוּ שְׁטוּפִים בַּדָּם לְאָכְלוֹ, לְפִיכָךְ הֻצְרַךְ לוֹמַר חֲזַק דִּבְרֵי רַבִּי יְהוּדָה, רַ' שִׁמְעוֹן בֶּן עֲזַאי אוֹמֵר לֹא בָא הַכָּתוּב אֶלָּא לְהַזְהִירְךָ וּלְלַמֶּדְךָ עַד כַּמָּה אַתָּה צָרִיךְ לְהִתְחַזֵּק בַּמִּצְווֹת, אִם הַדָּם שֶׁהוּא קַל לְהִשָּׁמֵר מִמֶּנּוּ שֶׁאֵין אָדָם מִתְאַוֶּה לוֹ, הֻצְרַךְ לְחַזֶּקְךָ בְאַזְהָרָתוֹ, קַ\"וָ לִשְׁאָר מִצְווֹת (עי' ספרי):<br><br><b>ולא תאכל הנפש עם הבשר.<\/b> אַזְהָרָה לְאֵבֶר מִן הַחַי (חולין ק\"ב):", "rashi_en": "רק חזק לבלתי אכל הדם ONLY BE STRONG THAT THOU EAT NOT THE BLOOD — From the fact that it states, “Be strong” (make a special effort), you may learn that they had a prediliction to blood — to the eating of it; it was therefore necessary to state, “be strong”. This is the view of R. Judah. R. Simeon, the son of Azzai, however, says: Scripture merely intends to caution you and to teach you to what great an extent you must strive to fulfil the divine commandments in general. If, as regards blood from which one can easily keep aloof since one does not long for it, it felt it necessary to insist on a strong effort on your part when forbidding it to you, how much the more is it necessary for you to make great efforts in keeping other commands [the fulfillment of which requires much moral strength] (cf. Sifrei Devarim 76:1-3).<br><br>ולא תאכל הנפש עם הבשר AND THOU MAYEST NOT EAT THE LIFE WITH THE FLESH — This is a prohibition of אבר מן החי, the eating of a limb cut from a living animal (Sifrei Devarim 76:5; Chullin 102a; cf. Rashi on Genesis 9:4)."}, {"ch": 12, "v": 24, "aliyah": 2, "heb": "לֹ֖א תֹּאכְלֶ֑נּוּ עַל־הָאָ֥רֶץ תִּשְׁפְּכֶ֖נּוּ כַּמָּֽיִם׃", "onk": "לָא תֵּיכְלִנֵּיהּ עַל אַרְעָא תִשְׁדִּנֵּיהּ כְּמַיָּא:", "onk_en": "Do not eat it; onto the earth are you to spill it like water.", "pj": "לָא תֵיכְלוּנֵיהּ עַל אַרְעָא תִשְׁדוּנֵיהּ הֵי כְמַיָּא", "pj_en": "you shall not eat it, you shall pour it out upon the ground like water:", "tj": "", "tj_en": "", "rashi": "<b>לא תאכלנו.<\/b> אַזְהָרָה לְדַם הַתַּמְצִית (כריתות ד'):", "rashi_en": "לא תאכלנו THOU SHALT NOT EAT IT — This is a prohibition against the eating of דם התמצית (the last blood oozing through the cut of a vein: תמצית from מצה “to squeeze”) (Keritot 4b)."}, {"ch": 12, "v": 25, "aliyah": 2, "heb": "לֹ֖א תֹּאכְלֶ֑נּוּ לְמַ֨עַן יִיטַ֤ב לְךָ֙ וּלְבָנֶ֣יךָ אַחֲרֶ֔יךָ כִּֽי־תַעֲשֶׂ֥ה הַיָּשָׁ֖ר בְּעֵינֵ֥י יְהֹוָֽה׃", "onk": "לָא תֵּיכְלִנֵּיהּ בְּדִיל דְּיֵיטַב לָךְ וְלִבְנָיךְ בַּתְרָךְ אֲרֵי תַעְבֵּד <b>דְּכָשָׁר<\/b> קֳדָם יְיָ:", "onk_en": "Do not eat it, so that you may enjoy beneficience, and your children after you, when you do the upright [<b>proper<\/b>] in Adonoy’s eyes.", "pj": "לָא תֵיכְלוּנֵיהּ מִן בִּגְלַל דְּיֵיטִיב לְכוֹן וְלִבְנֵיכוֹן בַּתְרֵיכוֹן אֲרוּם תַּעַבְדוּן דְּכָשַׁר קֳדָם יְיָ", "pj_en": "eat it not, that it may be well with you, and with your children after you, while you do that which is right before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לא תאכלנו.<\/b> אַזְהָרָה לְדַם הָאֵבָרִים (שם):<br><br><b>למען ייטב לך וגו'.<\/b> צֵא וּלְמַד מַתַּן שְׂכָרָן שֶׁל מִצְווֹת, אִם הַדָּם שֶׁנַּפְשׁוֹ שֶׁל אָדָם קָצָה מִמֶּנּוּ, הַפּוֹרֵשׁ מִמֶּנּוּ זוֹכֶה לוֹ וּלְבָנָיו אַחֲרָיו, קַל וָחֹמֶר לְגֶזֶל וַעֲרָיוֹת שֶׁנַּפְשׁוֹ שֶׁל אָדָם מִתְאַוָּה לָהֶם (מכות כ\"ג):", "rashi_en": "לא תאכלנו THOU SHALT NOT EAT IT — This is a prohibition against eating of the blood contained in the limbs (Keritot 4b).<br><br>למען ייטב לך וגו׳ THAT IT MAY BE WELL WITH THEE, etc. — Go and learn how great is the grant of reward for keeping the divine commandments: if in the case of blood for which the soul of man feels a loathing, he who keeps aloof from it obtains merit for himself and for his children after him, how much the more is it so in the case of robbery or forbidden sexual relations for which the soul of man may feel a longing (Makkot 23b)."}, {"ch": 12, "v": 26, "aliyah": 2, "heb": "רַ֧ק קׇֽדָשֶׁ֛יךָ אֲשֶׁר־יִהְי֥וּ לְךָ֖ וּנְדָרֶ֑יךָ תִּשָּׂ֣א וּבָ֔אתָ אֶל־הַמָּק֖וֹם אֲשֶׁר־יִבְחַ֥ר יְהֹוָֽה׃", "onk": "לְחוֹד <b>מַעְשַׂר<\/b> קוּדְשָׁיךְ דִּיהוֹן לָךְ וְנִדְרָךְ תִּטּוֹל וְתֵיתֵי לְאַתְרָא דִּי יִתִּרְעֵי יְיָ:", "onk_en": "However, your sacred offerings [<b>tithes<\/b>] that you will have, and your pledges, you are to bring when you come to the place that Adonoy chooses.", "pj": "לְחוֹד בְּעִירֵי מַעֲשַר קוּדְשֵׁיכוֹן דִּיהֲווֹן לְכוֹן וְנִדְרֵיכוֹן תֵּיעָלוּן וְתֵיתוּן לְאַתְרָא דְיִתְרְעֵי יְיָ", "pj_en": "Nevertheless, animals which are your consecrated tenths, and your votive offerings, you shall take and bring to the place which the Lord will choose;", "tj": "", "tj_en": "", "rashi": "<b>רק קדשיך.<\/b> אַעַ\"פִּ שֶׁאַתָּה מֻתָּר לִשְׁחֹט חֻלִּין, לֹא הִתַּרְתִּי לְךָ לִשְׁחֹט אֶת הַקֳּדָשִׁים וּלְאָכְלָן בִּשְׁעָרֶיךָ בְּלֹא הַקְרָבָה, אֶלָּא הֲבִיאֵם לְבֵית הַבְּחִירָה:", "rashi_en": "רק קדשיך ONLY (i.e. however) THY HOLY THINGS [… THOU SHALT BEAR AND GO UNTO THE PLACE WHICH THE LORD SHALL CHOOSE] — This means: although you are permitted to slaughter non-holy animals I do not permit you to slaughter consecrated animals and to eat them in thy gates (i.e. wherever you please) without sacrificing them on the altar, but bring them to the “House of Choice” (the Sanctuary)."}, {"ch": 12, "v": 27, "aliyah": 2, "heb": "וְעָשִׂ֤יתָ עֹלֹתֶ֙יךָ֙ הַבָּשָׂ֣ר וְהַדָּ֔ם עַל־מִזְבַּ֖ח יְהֹוָ֣ה אֱלֹהֶ֑יךָ וְדַם־זְבָחֶ֗יךָ יִשָּׁפֵךְ֙ עַל־מִזְבַּח֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ וְהַבָּשָׂ֖ר תֹּאכֵֽל׃", "onk": "וְתַעְבֵּד עֲלָוָתָךְ בִּשְׂרָא וּדְמָא עַל מַדְבְּחָא דַּיְיָ אֱלָהָךְ וְדַם <b>נִכְסַת קוּדְשָׁיךְ<\/b> יִשְׁתְּפֵךְ עַל מַדְבְּחָא דַּיְיָ אֱלָהָךְ וּבִשְׂרָא תֵּיכוּל:", "onk_en": "You are to execute your burnt-offerings—the meat and the blood—on the altar of Adonoy, your God; and the blood of your peace [<b>sacred<\/b>]-offerings will be poured on the altar of Adonoy, your God, then you will eat the meat.", "pj": "וְתַעֲבֵיד כְּהִלְכָתָא עֲלָוָותָךְ בִּסְרָא וְאַדְמָא עַל מַדְבְּחָא דַיְיָ אֱלָהָךְ וַאֲדַם שְׁאַר נִכְסַת קוּדְשָׁךְ יִשְׁתְּפֵךְ עַל מַדְבְּחָא דַיְיָ אֱלָהָךְ וּבִשְרָא אִתְכְּשָׁר לְמֵיכוֹל", "pj_en": "and thou shalt do (with them) according to the rite of thy burnt offerings, (and offer) the flesh and the blood upon the altar of the Lord thy God: the blood of the rest of thy holy oblations shall be poured out at the altar of the Lord thy God, but of the flesh it is lawful to eat.", "tj": "", "tj_en": "", "rashi": "<b>ועשית עלתיך.<\/b> אִם עוֹלוֹת הֵן, תֵּן הַבָּשָׂר וְהַדָּם עַל גַּבֵּי הַמִּזְבֵּח, וְאִם זִבְחֵי שְׁלָמִים הֵם, \"דַּם זְבָחֶיךָ יִשָּׁפֵךְ\" עַל הַמִּזְבֵּחַ תְּחִלָּה וְאַחַר כָּךְ \"וְהַבָּשָׂר תֹּאכֵל\". וְעוֹד דָּרְשׁוּ רַבּוֹתֵינוּ, \"רַק קָדָשֶׁיךָ\" בָּא לְלַמֵּד עַל הַקֳּדָשִׁים שֶׁבְּחוּצָה לָאָרֶץ, וּלְלַמֵּד עַל הַתְּמוּרוֹת וְעַל וַלְדוֹת קָדָשִׁים שֶׁיִּקְרְבוּ (ספרי; בכורות י\"ד):", "rashi_en": "ועשית עלתיך AND THOU SHALT OFFER THY BURNT OFFERINGS — i.e. if they (thy sacrifices) be burnt offerings, put the flesh as well as the blood on the altar, but if they are peace offerings, then “the blood of thy sacrifices shall be poured” first on the altar and afterwards you may eat the flesh. Furthermore did our Rabbis deduce that [the words] “thy sacrifices, however, [thou shalt bear, etc.]” are intended to teach with regard to consecrated animals that are outside the Land (abroad) as well as regards such animals that have been exchanged for other consecrated animals, and finally regarding the young of consecrated animals that [all] such must [also] be offered [in Jerusalem] (Sifrei Devarim 77:1; Bekhorot 14b)."}, {"ch": 12, "v": 28, "aliyah": 2, "heb": "שְׁמֹ֣ר וְשָׁמַעְתָּ֗ אֵ֚ת כׇּל־הַדְּבָרִ֣ים הָאֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑ךָּ לְמַ֩עַן֩ יִיטַ֨ב לְךָ֜ וּלְבָנֶ֤יךָ אַחֲרֶ֙יךָ֙ עַד־עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַטּ֣וֹב וְהַיָּשָׁ֔ר בְּעֵינֵ֖י יְהֹוָ֥ה אֱלֹהֶֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "טַר <b>וּתְקַבַּל<\/b> יָת כָּל פִּתְגָּמַיָּא הָאִלֵּין דִּי אֲנָא מְפַקְּדָךְ בְּדִיל דְּיֵיטַב לָךְ וְלִבְנָיךְ בַּתְרָךְ עַד עֳלָם אֲרֵי תַעְבֵּד <b>דְּתָקֵן וּדְכָשָׁר קֳדָם<\/b> יְיָ אֱלָהָךְ:", "onk_en": "Preserve and heed [<b>obey<\/b>] all these words that I am commanding you, in order that you have it good and your children after you forever, when you do that which is good and that which is upright [<b>correct and proper before<\/b>] in the eyes of Adonoy, your God.", "pj": "טוּרוּ וְקַבִּילוּ יַת פִּתְגָמַיָא דַאֲנָא מְפַקֵּיד לְכוֹן מִן בִּגְלַל דְּיֵיטִיב לְכוֹן וְלִבְנֵיכוֹן בַּתְרֵיכוֹן עַד עַלְמָא אֲרוּם תַּעַבְדוּן דְּתַקִּין וּדְכָשַׁר קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "Observe and obey all these words that I command you, that it may be well with you and with your children after you for ever, while you do that which is good and right before the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>שמר.<\/b> זוֹ מִשְׁנָה שֶׁאַתָּה צָרִיךְ לְשָׁמְרָהּ בְּבִטְנְךָ שֶׁלֹּא תִשְׁכַּח, כָּעִנְיָן שֶׁנֶּאֱמַר (משלי כ\"ב) \"כִּי נָעִים כִּי תִשְׁמְרֵם בְּבִטְנֶךָ\", וְאִם שָׁנִיתָ אֶפְשָׁר שֶׁתִּשְׁמַע וּתְקַיֵּם, הָא כָל שֶׁאֵינוֹ בִּכְלַל מִשְׁנָה אֵינוֹ בִּכְלַל מַעֲשֶׂה (עי' ספרי):<br><br><b>את כל הדברים.<\/b> שֶׁתְּהֵא חֲבִיבָה עָלֶיךָ מִצְוָה קַלָּה כְּמִצְוָה חֲמוּרָה (שם):<br><br><b>הטוב.<\/b> בְּעֵינֵי הַשָּׁמַיִם:<br><br><b>והישר.<\/b> בְּעֵינֵי אָדָם:", "rashi_en": "שמר KEEP [AND HEAR (understand) ALL THESE WORDS WHICH I COMMAND THEE] — This (the word שמר) implies the studying of the oral law — that you must keep it within you that it should not be forgotten, just as it is said, (Proverbs 22:18) “[And apply thy heart unto my knowledge] for it is a pleasant thing if thou keep (תשמרם) them within thee”, and only if thou learnest is it possible that thou wilt understand and fulfil the commands, but one who is not amongst those who study (lit., who is not included in learning) cannot be amongst those who act correctly (cf. Sifrei Devarim 79:3; see also Rashi on Deuteronomy 4:6). (The translation is: keep, i.e. study and retain your learning in mind: ושמעת, and then thou wilt understand how to observe the commands).<br><br>את כל הדברים [KEEP …] ALL WORDS [WHICH I COMMAND THEE] — This implies that a light precept should be as dear to you as a grave precept (Sifrei Devarim 79:4).<br><br>הטוב [THAT IT MAY GO WELL WITH THEE … WHEN THOU DOEST] WHAT IS GOOD — This refers to an action that is proper in the eyes of the Heavenly Father.<br><br>והישר AND WHAT IS RIGHT — this refers to an action that appears to be proper in the eyes of men (Sifrei Devarim 79:5)."}, {"ch": 12, "v": 29, "aliyah": 3, "heb": "כִּֽי־יַכְרִית֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ אֶת־הַגּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא־שָׁ֛מָּה לָרֶ֥שֶׁת אוֹתָ֖ם מִפָּנֶ֑יךָ וְיָרַשְׁתָּ֣ אֹתָ֔ם וְיָשַׁבְתָּ֖ בְּאַרְצָֽם׃", "onk": "אֲרֵי יְשֵׁצֵי יְיָ אֱלָהָךְ יָת עַמְמַיָּא דִּי אַתְּ עָלֵל לְתַמָּן לְתָרָכָא יָתְהוֹן מִקֳּדָמָךְ וְתֵירַת יָתְהוֹן וְתֵיתַב בְּאַרְעֲהוֹן:", "onk_en": "When Adonoy, your God, will have eliminated the nations whom you are coming there to inherit, from before you; and you inherit them and dwell in their land;", "pj": "אֲרוּם יְשֵׁיצֵי יְיָ אֱלָהָכוֹן יַת עַמְמַיָא דְאַתּוּן עַלְלִין לְתַמָּן לְתַרְכוּתְהוֹן מִן קֳדָמֵיכוֹן וְתֵירַת יַתְהוֹן וְתֵיתַב בְּאַרְעֲהוֹן", "pj_en": "When the Lord your God shall have cut off the nations among whom you go, and have expelled them from before you, and you inherit and dwell in their land,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 30, "aliyah": 3, "heb": "הִשָּׁ֣מֶר לְךָ֗ פֶּן־תִּנָּקֵשׁ֙ אַחֲרֵיהֶ֔ם אַחֲרֵ֖י הִשָּׁמְדָ֣ם מִפָּנֶ֑יךָ וּפֶן־תִּדְרֹ֨שׁ לֵאלֹֽהֵיהֶ֜ם לֵאמֹ֗ר אֵיכָ֨ה יַעַבְד֜וּ הַגּוֹיִ֤ם הָאֵ֙לֶּה֙ אֶת־אֱלֹ֣הֵיהֶ֔ם וְאֶעֱשֶׂה־כֵּ֖ן גַּם־אָֽנִי׃", "onk": "אִסְתַּמַּר לָךְ דִּילְמָא תִתָּקַל בַּתְרֵיהוֹן בָּתַר דְּיִשְׁתֵּצוּן מִקֳּדָמָךְ וְדִילְמָא תִתְבַּע <b>לְטַעֲוָתְהוֹן<\/b> לְמֵימַר אֶכְדֵּין פָּלְחִין עַמְמַיָּא הָאִלֵּין יָת <b>טַעֲוָתְהוֹן<\/b> וְאֶעְבֵּד כֵּן אַף אָנָא:", "onk_en": "Look out for yourself, lest you are torn apart along with them, after they have been annihilated before you, and lest you inquire about their gods [<b>idols<\/b>], saying, ‘‘How did these nations worship their gods, let me do so, too.’’", "pj": "אִסְתַּמָּרוּ לְכוֹן דִּלְמָא תִיתּוֹקְלוּן בָּתַר טַעֲוַותְהוֹן מִן בָּתַר דְּיִשְׁתֵּיצוּן מִן קֳדָמֵיכוֹן אוֹ דִלְמָא תִּתְבְּעוּן לְטַעֲוַותְהוֹן לְמֵימָר הֵיכְדֵין פַּלְחִין עַמְמַיָא הָאִלֵּין לְטַעֲוַותְהוֹן וְנַעֲבֵיד כְּדֵין אוּף אֲנָן", "pj_en": "beware that you stumble not after their idols when they shall have been destroyed before you, or lest you seek after their idols, saying, How did these peoples worship their gods, that we may worship as they did?", "tj": "", "tj_en": "", "rashi": "<b>פן תנקש.<\/b> אֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן מוֹקֵשׁ, וַאֲנִי אוֹמֵר שֶׁלֹּא חָשׁ לְדַקְדֵּק בַּלָּשׁוֹן, שֶׁלֹּא מָצִינוּ נוּ\"ן בִּלְשׁוֹן יוֹקֵשׁ, וַאֲפִלּוּ לַיְסוֹד הַנּוֹפֵל מִמֶּנּוּ, אֲבָל בִּלְשׁוֹן טֵרוּף וְקִשְׁקוּשׁ מָצִינוּ נוּ\"ן, \"וְאַרְכֻּבָתֵהּ דָא לְדָא נָקְשָׁן\" (דניאל ה'); וְאַף זֶה אֲנִי אוֹמֵר \"פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם\" – פֶּן תִּטָּרֵף אַחֲרֵיהֶם, לִהְיוֹת כָּרוּךְ אַחַר מַעֲשֵׂיהֶם; וְכֵן (תהילים ק\"ט) \"יְנַקֵּשׁ נוֹשֶׁה לְכָל אֲשֶׁר לוֹ\" – מְקַלֵּל אֶת הָרָשָׁע לִהְיוֹת עָלָיו נוֹשִׁים רַבִּים וְיִהְיוּ מַחֲזִירִין וּמִתְנַקְּשִׁין אַחַר מָמוֹנוֹ:<br><br><b>אחרי השמדם מפניך.<\/b> אַחַר שֶׁתִּרְאֶה שֶׁאַשְׁמִידֵם מִפָּנֶיךָ, יֵשׁ לְךָ לָתֵת לֵב מִפְּנֵי מָה נִשְׁמְדוּ אֵלּוּ, מִפְּנֵי מַעֲשִׂים מְקֻלְקָלִים שֶׁבִּידֵיהֶם, אַף אַתָּה לֹא תַעֲשֶׂה כֵן שֶׁלֹּא יָבֹאוּ אֲחֵרִים וְיַשְׁמִידוּךָ (עי' ספרי):<br><br><b>איכה יעבדו.<\/b> לְפִי שֶׁלֹּא עָנַשׁ עַל עֲבוֹדָה זָרָה אֶלָּא עַל זִבּוּחַ וְקִטּוּר וְנִסּוּךְ וְהִשְׁתַּחֲוָאָה, כְּמוֹ שֶׁכָּתוּב (שמות כ\"ב) \"בִּלְתִּי לַה' לְבַדּוֹ\" – דְּבָרִים הַנַּעֲשִׂים לַגָּבוֹהַּ, בָּא וְלִמֶּדְךָ כָאן שֶׁאִם דַּרְכָּהּ שֶׁל עֲ\"זָ לְעָבְדָהּ בְּדָבָר אַחֵר, כְּגוֹן פּוֹעֵר לִפְעוֹר וְזוֹרֵק אֶבֶן לְמַרְקוּלִיס, זוֹ הִיא עֲבוֹדָתוֹ וְחַיָּב, אֲבָל זִבּוּחַ וְקִטּוּר וְנִסּוּךְ וְהִשְׁתַּחֲוָאָה – אֲפִלּוּ שֶׁלֹּא כְדַרְכָּהּ חַיָּב (סנהדרין ס'):", "rashi_en": "פן תנקש [TAKE HEED TO THYSELF] LEST THOU BE SNARED — Onkelos renders תנקש as an expression of the same root and meaning as מוקש, a snare. But I say that he was not particular to examine carefully the expression, for we never find a נ in the term that means to snare, not even as a root letter that is sometimes omitted from it; but in the term denoting movement from place to place and knocking we do find a נ, as in (Daniel 5:6) “and his knees knocked (נקש) one against the other”. Here, too, I say that פן תנקש means lest thou run after them so that you cling to their doings. Similar is (Psalms 109:11) “Let the creditor be מנקש to all that he has” — he (the speaker) is cursing the wicked that he may have many creditors and that these may go about running after his money.<br><br>אחרי השמדם מפניך [TAKE HEED THAT THOU BE NOT SNARED] (according to Rashi, THAT THOU DO NOT RUN AFTER THEM) AFTER THAT THEY BE EXTERMINATED BEFORE THEE — The meaning is: after you see that I exterminate them from before you, you ought to pay attention to why these were exterminated — because of the depraved doings which they practiced. Consequently you should not act likewise lest others come and exterminate you (cf. Sifrei Devarim 81:3).<br><br>איכה יעבדו HOW DID [THESE NATIONS] SERVE [THEIR GODS? EVEN SO WILL I DO LIKEWISE] — Because Scripture has laid down a punishment for idolatrous worshi
