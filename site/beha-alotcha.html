ת המחנות AND FOR THE JOURNEYING OF THE CAMPS — at the time of departing on the journeys you shall blow them as a signal. Consequently you must say that they used to travel by a three-fold call: by the command of the Holy One, blessed be He, by the word of Moses (cf. Rashi on v. 18 at the end), and by the sound of the trumpets (Boraitha d’ Mlechet ha-Mishkan s. 13). <br><br>מקשה OF BEATEN WORK — from a block of silver you shall make them by hammer blows (Sifrei Bamidbar 72)."}, {"ch": 10, "v": 3, "aliyah": 4, "heb": "וְתָקְע֖וּ בָּהֵ֑ן וְנֽוֹעֲד֤וּ אֵלֶ֙יךָ֙ כׇּל־הָ֣עֵדָ֔ה אֶל־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיִתְקְעוּן בְּהֵן וְיִזְדַּמְּנוּן לְוָתָךְ כָּל כְּנִשְׁתָּא לִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "When they will blow them, the entire congregation shall present itself to you at the entrance of the Tent of Meeting.", "pj": "וְיִתְקְעוּן בְּהוֹן וְיִזְדַמְנוּן לְוָתָךְ כָּל כְּנִישְׁתָּא לִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And thou shalt blow upon them, and bring together to thee all the congregation at the door of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>ותקעו בהן.<\/b> בִּשְׁתֵּיהֶן, וְהוּא סִימָן לְמִקְרָא הָעֵדָה, שֶׁנֶּאֱמַר \"וְנוֹעֲדוּ אֵלֶיךָ כָּל הָעֵדָה אֶל פֶּתַח אֹהֶל מוֹעֵד\":", "rashi_en": "ותקעו בהן WHEN THEY BLOW WITH THEM — with both of them; and this (protracted sound, a “Tekiah” on both trumpets) is the signal for summoning the congregation, as it is said here, “then all the congregation shall assemble unto thee at the entrance of the tent of meeting”."}, {"ch": 10, "v": 4, "aliyah": 4, "heb": "וְאִם־בְּאַחַ֖ת יִתְקָ֑עוּ וְנוֹעֲד֤וּ אֵלֶ֙יךָ֙ הַנְּשִׂיאִ֔ים רָאשֵׁ֖י אַלְפֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְאִם בַּחֲדָא יִתְקְעוּן וְיִזְדַּמְּנוּן לְוָתָךְ רַבְרְבַיָּא רֵישֵׁי אַלְפַיָּא דְיִשְׂרָאֵל:", "onk_en": "But if they blow one of them, the leaders shall present themselves to you, the heads of Israel’s thousands.", "pj": "וְאִין בְּחָדָא יִתְקְעוּן וְיִזְדַמְנוּן לְוָתָךְ רַבְרְבַיָא רֵישֵׁי אַלְפַיָא דְיִשְרָאֵל", "pj_en": "If they blow upon one (only), the princes of the heads of the thousands of Israel shall assemble to thee.", "tj": "", "tj_en": "", "rashi": "<b>ואם באחת יתקעו.<\/b> הוּא סִימָן לְמִקְרָא הַנְּשִׂיאִים, שֶׁנֶּאֱמַר \"וְנוֹעֲדוּ אֵלֶיךָ הַנְּשִׂיאִים\", וְאַף הֵן יְעִידָתָן אֶל פֶּתַח אֹהֶל מוֹעֵד, וּמִגְּזֵרָה שָׁוָה הוּא בָא בְּסִפְרֵי:", "rashi_en": "ואם באחת יתקעו AND IF THEY BLOW BUT WITH ONE TRUMPET (i.e. a “Tekiah” on one trumpet) — it is a sign to summon the princes, as it is said here, “then the princes shall gather themselves unto thee”. Their meeting place, too, was at the entrance of the tent of meeting. This is derived from a ג\"ש in the Sifrei (Sifrei Bamidbar 73:1 from the use in both cases of the same expression ותקעו and יתקעו: not from ונועדו — ונועדו as erroneously stated.)"}, {"ch": 10, "v": 5, "aliyah": 4, "heb": "וּתְקַעְתֶּ֖ם תְּרוּעָ֑ה וְנָֽסְעוּ֙ הַֽמַּחֲנ֔וֹת הַחֹנִ֖ים קֵֽדְמָה׃", "onk": "וְתִתְקְעוּן <b>יַבֶּבְתָּא<\/b> וְיִטְּלוּן מַשִּׁרְיָתָא דִּשְׁרַן קִדּוּמָא:", "onk_en": "When you blow a <i>teruah<\/i> [<b>a wailing sound<\/b>]; the camps that are camped eastward shall travel.", "pj": "וְתִתְקְעוּן יַבֶּבְתָּא וְיִטְלוּן מַשִׁרְיָתָא דְשָׁרַן קִידוּמָא", "pj_en": "But when you blow an alarm, then the camps which are on the east are to go forward;", "tj": "", "tj_en": "", "rashi": "<b>ותקעתם תרועה.<\/b> סִימָן מַסַּע הַמַּחֲנוֹת תְּקִיעָה תְּרוּעָה וּתְקִיעָה, כָּךְ הוּא נִדְרָשׁ בְּסִפְרֵי מִן הַמִּקְרָאוֹת הַיְתֵרִים:", "rashi_en": "ותקעתם תרועה WHEN YE BLOW AN ALARM — The signal for the camps to set out on the journey was a Tekiah, a Teruah (a tremulous sound) and again a Tekiah. Thus is it derived in the Siphre from the apparently redundant verses (Sifrei Bamidbar 73:2; cf. Rosh Hashanah 34a)."}, {"ch": 10, "v": 6, "aliyah": 4, "heb": "וּתְקַעְתֶּ֤ם תְּרוּעָה֙ שֵׁנִ֔ית וְנָֽסְעוּ֙ הַֽמַּחֲנ֔וֹת הַחֹנִ֖ים תֵּימָ֑נָה תְּרוּעָ֥ה יִתְקְע֖וּ לְמַסְעֵיהֶֽם׃", "onk": "וְתִתְקְעוּן יַבֶּבְתָּא תִּנְיָנוּת וְיִטְּלוּן מַשִּׁרְיָתָא דִּשְׁרַן דָּרוֹמָא יַבָּבָא יִתְקְעוּן לְמַטְּלָנֵיהוֹן:", "onk_en": "If you blow a second <i>teruah,<\/i> then shall travel the camps that are camped on the south side. They shall blow a <i>teruah<\/i> for their journeys.", "pj": "וְתִתְקְעוּן יַבֶּבְתָּא תִּנְיָינוּת וְיִטְלוּן מַשִׁרְיָתָא דְשָׁרַן דָרוֹמְתָּא יַבֶּבְתָּא יִתְקְעוּן לְמַטְלָנֵיהוֹן", "pj_en": "and when they blow a second alarm, the camps on the south shall go forward; they shall blow the alarm for their journeys.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 7, "aliyah": 4, "heb": "וּבְהַקְהִ֖יל אֶת־הַקָּהָ֑ל תִּתְקְע֖וּ וְלֹ֥א תָרִֽיעוּ׃", "onk": "וּבְמִכְנַשׁ יָת קְהָלָא תִּתְקְעוּן וְלָא תְיַבְּבוּן:", "onk_en": "But when gathering the congregation, you shall blow [a blast], but not a <i>teruah.<\/i>", "pj": "וּבִזְמַן מַכְנַשׁ יַת קְהָלָא תִּתְקְעוּן וְלָא תְיַבְּבוּן", "pj_en": "And at the time of assembling the congregation you shall blow, but not an alarm.", "tj": "", "tj_en": "", "rashi": "<b>ובהקהיל את הקהל וגו'.<\/b> לְפִי שֶׁהוּא אוֹמֵר \"וְהָיוּ לְךָ לְמִקְרָא הָעֵדָה וּלְמַסַּע אֶת הַמַּחֲנוֹת\", מַה מִּקְרָא הָעֵדָה תּוֹקֵעַ בְּב' כֹּהֲנִים וּבִשְׁתֵּיהֶם — שֶׁנֶּאֱמַר \"וְתָקְעוּ בָהֵן\" וְגוֹ' — אַף מַסַּע הַמַּחֲנוֹת בִּשְׁתֵּיהֶם, יָכוֹל מַה מַּסַּע הַמַּחֲנוֹת תּוֹקֵעַ וּמֵרִיעַ וְתוֹקֵעַ, אַף מִקְרָא הָעֵדָה תּוֹקֵעַ וּמֵרִיעַ וְתוֹקֵעַ — וּמֵעַתָּה אֵין חִלּוּק בֵּין מִקְרָא הָעֵדָה לְמַסַּע אֶת הַמַּחֲנוֹת — תַּ\"ל \"וּבְהַקְהִיל אֶת הַקָּהָל\" וְגוֹ', לוֹמַר שֶׁאֵין תְּרוּעָה לְמִקְרָא הָעֵדָה, וְהוּא הַדִּין לַנְּשִׂיאִים, הֲרֵי סִימָן לִשְׁלָשְׁתָּם, מִקְרָא הָעֵדָה בִּשְׁתַּיִם וְשֶׁל נְשִֹיאִים בְּאַחַת — וְזוֹ וָזוֹ אֵין בָּהֶם תְּרוּעָה — וּמַסַּע הַמַּחֲנוֹת בִּשְׁתַּיִם עַ\"יְ תְרוּעָה וּתְקִיעָה (ספרי):", "rashi_en": "ובהקהיל את הקהל וגו׳ AND WHEN THE CONGREGATION IS TO BE GATHERED TOGETHER etc. — Because it is stated, (v. 2) “and they shall be unto thee for calling together the assembly and for the journeying of the camps”, you must reason as follows: How is it in the case of “the calling of the assembly”? A Tekiah was made by two priests and on both of them (on two trumpets), since it states, (v. 3) “when they blow with them (cf. Rashi on that verse). So, too, is the setting out of the camps to be by means of both trumpets. One might, however, also reason as follows: How is it in the case of the “journeyings of the camps”? The priest sounds a Tekiah, a Teruah, and another Tekiah (cf. Rashi on v. 5)! So, too, in the case of “calling the assembly together”, he blows a Tekiah, a Teruah and a Tekiah, so that it follows that there is no difference between the signal for “calling the assembly” and that for the “journeyings of the camps”. Scripture, however, states here: “And when the congregation is to be gathered together, etc.” to intimate that no Teruah is sounded at the calling of the assembly (ולא תריעו), and the same rule applies to calling the princes. — Thus we have a different signal for the three occasions: “the calling of the assembly” is done by both trumpets, and that of the princes by one — but neither in this nor that signal is there a Teruah, whilst “the journeying of the camps” is done by both trumpets with a Teruah, a Tekiah preceding and following it (Sifrei Bamidbar 74)."}, {"ch": 10, "v": 8, "aliyah": 4, "heb": "וּבְנֵ֤י אַהֲרֹן֙ הַכֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּחֲצֹֽצְר֑וֹת וְהָי֥וּ לָכֶ֛ם לְחֻקַּ֥ת עוֹלָ֖ם לְדֹרֹתֵיכֶֽם׃", "onk": "וּבְנֵי אַהֲרֹן כָּהֲנַיָּא יִתְקְעוּן בַּחֲצוֹצְרָתָא וִיהֶוְיָן לְכוֹן לִקְיַם עֲלָם לְדָרֵיכוֹן:", "onk_en": "The sons of Aharon, the <i>kohanim,<\/i> shall sound the trumpets. This shall be for you an everlasting statute, for all your descendants.", "pj": "וּבְנֵי אַהֲרן כַּהֲנַיָא שְׁלֵימַיָא יִתְקְעוּן בַּחֲצוֹצְרָתָא וִיהוֹן לְכוֹן לִקְיַם עֲלָם לְדָרֵיכוֹן", "pj_en": "The sons of Aharon, the priests only, shall blow with the trumpets, which shall be to you, for a perpetual statute for your generations.", "tj": "", "tj_en": "", "rashi": "<b>ובני אהרן … יתקעו.<\/b> בַּמִּקְרָאוֹת וּבַמַּסָּעוֹת הַלָּלוּ:", "rashi_en": "ובני אהרן ... יתקעו AND THE SONS OF AARON … SHALL BLOW [WITH THE TRUMPETS] at the occasions of these (above-mentioned) assemblings and journeyings."}, {"ch": 10, "v": 9, "aliyah": 4, "heb": "וְכִֽי־תָבֹ֨אוּ מִלְחָמָ֜ה בְּאַרְצְכֶ֗ם עַל־הַצַּר֙ הַצֹּרֵ֣ר אֶתְכֶ֔ם וַהֲרֵעֹתֶ֖ם בַּחֲצֹצְרֹ֑ת וְנִזְכַּרְתֶּ֗ם לִפְנֵי֙ יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם וְנוֹשַׁעְתֶּ֖ם מֵאֹיְבֵיכֶֽם׃", "onk": "וַאֲרֵי תֵעֲלוּן לְאַגָּחָא קְרָבָא בְּאַרְעֲכוֹן עַל מְעִיקֵי דִּמְעִיקִין לְכוֹן <b>וּתְיַבְּבוּן<\/b> בַּחֲצוֹצְרָתָא <b>וְיֵיעוּל דּוּכְרָנֵיכוֹן לְטָבָא<\/b> קֳדָם יְיָ אֱלָהָכוֹן וְתִתְפָּרְקוּן מִסַּנְאֵיכוֹן:", "onk_en": "If war shall come into your land against the oppresor who oppresses you and you shall blow <i>teruahs<\/i> [<b>wail<\/b>] with the trumpets and you will be remembered [<b>your remembrance will come beneficially<\/b>] before Adonoy, your God, and you will be delivered from you enemies.", "pj": "וַאֲרוּם תְּעוּלוּן לִמְסַדְרָא סִדְרֵי קְרָבָא בְּאַרְעֲכוֹן עַל מְעִיקֵי דִמְעִיקִין לְכוֹן וּתְיַבְּבוּן בַּחֲצוֹצְרָתָא וְיֵיעוּל דוּכְרַנְכוֹן לְטָבָא קֳדָם יְיָ אֱלָהָכוֹן וְתִתְפָּרְקוּן מִבַּעֲלֵי דְבָבֵיכוֹן", "pj_en": "And when you enter upon the order of the line of battle for your country, with oppressors who oppress you, then shall you blow the alarm on the trumpets, that the remembrance of you may come up for good before the Lord your God, that you may be delivered from your enemies.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 10, "aliyah": 4, "heb": "וּבְי֨וֹם שִׂמְחַתְכֶ֥ם וּֽבְמוֹעֲדֵיכֶם֮ וּבְרָאשֵׁ֣י חׇדְשֵׁיכֶם֒<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז חׇדְשֵׁכֶם֒)<\/i> וּתְקַעְתֶּ֣ם בַּחֲצֹֽצְרֹ֗ת עַ֚ל עֹלֹ֣תֵיכֶ֔ם וְעַ֖ל זִבְחֵ֣י שַׁלְמֵיכֶ֑ם וְהָי֨וּ לָכֶ֤ם לְזִכָּרוֹן֙ לִפְנֵ֣י אֱלֹֽהֵיכֶ֔ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבְיוֹם חֶדְוַתְכוֹן וּבְמוֹעֲדֵיכוֹן וּבְרֵישֵׁי יַרְחֵיכוֹן וְתִתְקְעוּן בַּחֲצוֹצְרָתָא עַל עֲלָוָתְכוֹן וְעַל נִכְסַת קוּדְשֵׁיכוֹן וִיהֶוְיָן לְכוֹן לְדוּכְרָנָא קֳדָם אֱלָהָכוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "On your joyous days and on your festivals and on the beginnings of your months you shall blow with the trumpets for your burnt-offerings and for your peace-offerings; and it shall be a remembrance for you before your God, I am Adonoy your God.", "pj": "וּבְיוֹם חֶדְוַותְכוֹן וּמוֹעֲדֵיכוֹן וּבְרֵישֵׁי יַרְחֵיכוֹן וְתִתְקְעוּן בַּחֲצוֹצְרָתָא עַל עֲלָוַותְכוֹן וְעַל נִכְסַת קוּדְשֵׁיכוֹן וִיהוֹן לְכוֹן לְדוּכְרָנָא טָבָא קֳדָם אֱלָהָכוֹן בְּרַם סַטָנָא מִתְעַרְבֵב לְקַל יַבְּבוּתְכוֹן אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "And in the day of your rejoicings, and in your solemnities, and at the beginning of your months, you shall blow with the trumpets over your burnt offerings and your consecrated victims, and they shall be for a good memorial to you before the Lord your God; for Satana shall be troubled at the sound of your jubel notes: I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>על עלתיכם.<\/b> בְּקָרְבַּן צִבּוּר הַכָּתוּב מְדַבֵּר (ערכין י\"א):<br><br><b>אני ה' אלהיכם.<\/b> מִכָּאן לָמַדְנוּ מַלְכִיּוֹת עִם זִכְרוֹנוֹת וְשׁוֹפָרוֹת, שֶׁנֶּאֱמַר \"וּתְקַעְתֶּם\" —זוֹ שׁוֹפָרוֹת, \"לְזִכָּרוֹן\" — זוֹ זִכְרוֹנוֹת, \"אֲנִי ה' אֱלֹהֵיכֶם\" — זוֹ מַלְכִיּוֹת וְכוּ' (ספרי):", "rashi_en": "על עלתיכם [YE SHALL BLOW WITH THE TRUMPETS] OVER YOUR BURNT OFFERINGS — Scripture is speaking of a communal burnt offering (cf. Sifrei Bamidbar 77; Arakhin 11b).<br><br>אני ה׳ אלהיכם I AM THE LORD YOUR GOD — From here we derive the regulation that on the New Year Festival Biblical verses referring to God’s Kingdom (מלכיות) must be recited together with such as have reference to the blowing of the Shofar (שופרות), and to Divine remembrance (זכרונות), because it states here “ותקעתם” — which is an allusion to לזכרון\"   ;שופרות\" — which is an allusion to זכרונות; and אני ה׳ אלהיכם — which is an allusion to מלכיות etc. (Sifrei Bamidbar 77; cf. Rashi on Leviticus 23:24 and Note thereon)."}, {"ch": 10, "v": 11, "aliyah": 5, "heb": "וַיְהִ֞י בַּשָּׁנָ֧ה הַשֵּׁנִ֛ית בַּחֹ֥דֶשׁ הַשֵּׁנִ֖י בְּעֶשְׂרִ֣ים בַּחֹ֑דֶשׁ נַעֲלָה֙ הֶֽעָנָ֔ן מֵעַ֖ל מִשְׁכַּ֥ן הָעֵדֻֽת׃", "onk": "וַהֲוָה בְּשַׁתָּא תִנְיֵתָא בְּיַרְחָא תִנְיָנָא בְּעַשְׂרִין לְיַרְחָא אִסְתַּלַּק עֲנָנָא מֵעִלָּוֵי מַשְׁכְּנָא דְסַהֲדוּתָא:", "onk_en": "It was in the second year, in the second month on the twentieth of the month that the Cloud rose up from above the <i>Mishkon<\/i> of the Testimony.", "pj": "וַהֲוָה בְּשַׁתָּא תִנְיֵיתָא בְּיַרְחָא תִּנְיֵיתָא הוּא יַרְחָא דְאִיָיר בְּעֶשְרִין לְיַרְחָא אִסְתַּלֵק עֲנַן יְקָרָא מֵעִילַוֵי מַשְׁכְּנָא דְסַהֲדוּתָא", "pj_en": "And it was in the second year, the second month, which is the month of Ijar, the twentieth day of the month, that the Cloud of Glory was uplifted from above the Tabernacle of Testimony;", "tj": "", "tj_en": "", "rashi": "<b>בחדש השני.<\/b> נִמְצֵאתָ אַתָּה אוֹמֵר, שְׁנֵים עָשָׂר חֹדֶשׁ חָסֵר עֲשָׂרָה יָמִים עָשׂוּ בְחוֹרֵב, שֶׁהֲרֵי בְּרֹאשׁ חֹדֶשׁ סִיוָן חָנוּ שָׁם וְלֹא נָסְעוּ עַד עֶשְׂרִים בְּאִיָּר לַשָּׁנָה הַבָּאָה:", "rashi_en": "בחדש השני [IN THE SECOND YEAR] IN THE SECOND MONTH [THE CLOUD DEPARTED] — Consequently you must say that they spent at Choreb twelve months less ten days, since on the New Moon of Sivan (the third month) they encamped there (Exodus 19:1) and did not journey until the twentieth of Eyar of the following year."}, {"ch": 10, "v": 12, "aliyah": 5, "heb": "וַיִּסְע֧וּ בְנֵֽי־יִשְׂרָאֵ֛ל לְמַסְעֵיהֶ֖ם מִמִּדְבַּ֣ר סִינָ֑י וַיִּשְׁכֹּ֥ן הֶעָנָ֖ן בְּמִדְבַּ֥ר פָּארָֽן׃", "onk": "וּנְטָלוּ בְנֵי יִשְׂרָאֵל לְמַטְּלָנֵיהוֹן מִמַּדְבְּרָא דְסִינָי וּשְׁרָא עֲנָנָא בְּמַדְבְּרָא דְפָארָן:", "onk_en": "Bnei Yisroel traveled along on their journeys, from the Sinai desert, and the Cloud came to rest in the desert of Paran.", "pj": "וּנְטָלוּ בְּנֵי יִשְרָאֵל לְמַטְלָנֵיהוֹן מִמַדְבְּרָא דְסִינַי וּשְׁרָא עֲנַן יְקָרָא בְּמַדְבְּרָא דְפָּארָן", "pj_en": "and the children of Israel went forward upon their journeys from the wilderness of Sinai, and the Cloud of Glory rested in the wilderness of Pharan.", "tj": "", "tj_en": "", "rashi": "<b>למסעיהם.<\/b> כַּמִּשְׁפָּט הַמְפֹרָשׁ לְמַסַּע דִּגְלֵיהֶם, מִי רִאשׁוֹן וּמִי אַחֲרוֹן:<br><br><b>במדבר פארן.<\/b> קִבְרוֹת הַתַּאֲוָה בְּמִדְבַּר פָּארָן הָיָה, וְשָׁם חָנוּ מִמַּסָּע זֶה:", "rashi_en": "למסעיהם means, in accordance with the regulations set forth for the journeys of their divisions — which should be the first to set out and which the last.<br><br>במדבר פראן IN THE WILDERNESS OF PARAN — The place “Kibroth-hattavah” (Numbers 12:34) was in the wilderness of Paran and there they encamped after this journey (cf. Numbers 33:16—17 with our verse and with Numbers 11:34—35)."}, {"ch": 10, "v": 13, "aliyah": 5, "heb": "וַיִּסְע֖וּ בָּרִאשֹׁנָ֑ה עַל־פִּ֥י יְהֹוָ֖ה בְּיַד־מֹשֶֽׁה׃", "onk": "וּנְטָלוּ בְּקַדְמֵיתָא עַל מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה:", "onk_en": "This was the first time that they traveled, on the order of Adonoy, through Moshe.", "pj": "וּנְטָלוּ בְּקַדְמֵיתָא עַל פּוּם מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה", "pj_en": "And they went forth at the first by the mouth of the Word of the Lord through Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 14, "aliyah": 5, "heb": "וַיִּסַּ֞ע דֶּ֣גֶל מַחֲנֵ֧ה בְנֵֽי־יְהוּדָ֛ה בָּרִאשֹׁנָ֖ה לְצִבְאֹתָ֑ם וְעַ֨ל־צְבָא֔וֹ נַחְשׁ֖וֹן בֶּן־עַמִּינָדָֽב׃", "onk": "וּנְטַל טֵקַס מַשְׁרִית בְּנֵי יְהוּדָה בְּקַדְמֵיתָא לְחֵילֵיהוֹן וְעַל חֵילֵיהּ נַחְשׁוֹן בַּר עַמִּינָדָב:", "onk_en": "Then traveled the banner of the sons of Yehudah’s camp in the forefront according to their divisions; in charge of its divisions [was] Nachshon the son of Aminadav.", "pj": "וּנְטָלוּ טֵיקַס מַשִׁרְיַית בְּנֵי יְהוּדָה לְחֵילֵיהוֹן וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי יְהוּדָה נַחְשׁוֹן בַּר עַמִינָדָב", "pj_en": "The standard of the camps of the Beni Jehudah went forward by their hosts, and the Rabba who was appointed over the host of the tribe of the Beni Jehudah was Nachshon bar Amminadab;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 15, "aliyah": 5, "heb": "וְעַ֨ל־צְבָ֔א מַטֵּ֖ה בְּנֵ֣י יִשָּׂשכָ֑ר נְתַנְאֵ֖ל בֶּן־צוּעָֽר׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי יִשָּׂשכָר נְתַנְאֵל בַּר צוּעָר:", "onk_en": "In charge of the division of the tribe of the sons of Yissachar, [was] Nesanel the son of Tzu’ar.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי יִשָשכָר נְתַנְאֵל בַּר צוּעָר", "pj_en": "the Rabba of the Beni Issakar was Nethanel bar Zuar;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 16, "aliyah": 5, "heb": "וְעַ֨ל־צְבָ֔א מַטֵּ֖ה בְּנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן־חֵלֹֽן׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי זְבוּלֻן אֱלִיאָב בַּר חֵלוֹן:", "onk_en": "In charge of the division of the tribe of the sons of Zevulun, [was] Eliav the son of Cheilon.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי זְבוּלֻן אֱלִיאָב בַּר חֵלוֹן", "pj_en": "and the Rabba of the Beni Zebulon, Eliab bar Chelon.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 17, "aliyah": 5, "heb": "וְהוּרַ֖ד הַמִּשְׁכָּ֑ן וְנָסְע֤וּ בְנֵֽי־גֵרְשׁוֹן֙ וּבְנֵ֣י מְרָרִ֔י נֹשְׂאֵ֖י הַמִּשְׁכָּֽן׃", "onk": "וּמִתְפָּרַק מַשְׁכְּנָא וְנָטְלִין בְּנֵי גֵרְשׁוֹן וּבְנֵי מְרָרִי נָטְלֵי מַשְׁכְּנָא:", "onk_en": "[Then] the <i>Mishkon<\/i> was dismantled and the sons of Gershon traveled, with the sons of Merori, those who carried the <i>Mishkon<\/i>.", "pj": "וּמִתְפְּרַק מַשְׁכְּנָא וְנַטְלִין בְּנֵי גֵרְשׁוֹן וּבְנֵי מְרָרִי נַטְלֵי מַשְׁכְּנָא", "pj_en": "And the tabernacle was taken down, and the sons of Gershon and of Merari went forward, carrying the tabernacle.", "tj": "", "tj_en": "", "rashi": "<b>והורד המשכן.<\/b> כֵּיוָן שֶׁנּוֹסֵעַ דֶּגֶל יְהוּדָה, נִכְנְסוּ אַהֲרֹן וּבָנָיו וּפָרְקוּ אֶת הַפָּרֹכֶת וְכִסּוּ בָהּ אֶת הָאָרוֹן, שֶׁנֶּאֱמַר \"וּבָא אַהֲרֹן וּבָנָיו בִּנְסֹעַ הַמַּחֲנֶה\" (במדבר ד'), וּבְנֵי גֵרְשׁוֹן וּבְנֵי מְרָרִי פוֹרְקִין הַמִּשְׁכָּן וְטוֹעֲנִין אוֹתוֹ בָּעֲגָלוֹת, וְהָאָרוֹן וּכְלֵי הַקֹּדֶשׁ שֶׁל מַשָּׂא בְנֵי קְהָת עוֹמְדִים מְכֻסִּין וּנְתוּנִין עַל הַמּוֹטוֹת עַד שֶׁנָּסַע דֶּגֶל מַחֲנֵה רְאוּבֵן, וְאַ\"כַּ \"וְנָסְעוּ הַקְּהָתִים\" (עי' תנחומא):", "rashi_en": "והורד המשכן THEN THE TABERNACLE WAS TAKEN DOWN — As soon as the division of Judah was on the point of journeying, Aaron and his sons went in (into the Tabernacle), took down the Partition Vail and covered the Ark with it, as it is said, (Numbers 4:5) “and when the camp setteth forward (i. e. is on the point of setting forward) Aaron shall come, and his sons, [and they shall take down the Partition Vail, etc.]”; the sons of Gershon and the sons of Merari then dismantled the Tabernacle, and loaded it on the waggons, and started off (so Berliner’s edition which adds ונוסעים). The Ark and the other holy vessels, the burden of the sons of Kohath (cf. Numbers 3:31), remained as they were, covered over, the latter hanging on poles, until the division of the sons of Reuben set out, and only after that did (v. 21) “the Kohathites set forward”."}, {"ch": 10, "v": 18, "aliyah": 5, "heb": "וְנָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְצִבְאֹתָ֑ם וְעַ֨ל־צְבָא֔וֹ אֱלִיצ֖וּר בֶּן־שְׁדֵיאֽוּר׃", "onk": "וּנְטַל טֵקַס מַשְׁרִית רְאוּבֵן לְחֵילֵיהוֹן וְעַל חֵילֵיהּ אֱלִיצוּר בַּר שְׁדֵיאוּר:", "onk_en": "[Then] the banner of Reuven’s camp traveled, according to their divisions. In charge of its division [was] Elitzur the son of Shdeiur.", "pj": "וּנְטַל טֵיקַס מַשִׁירְיַת רְאוּבֵן לְחֵילֵיהוֹן וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי רְאוּבֵן אֱלִיצוּר בַּר שְׁדֵיאוּר", "pj_en": "The standard of the camps of Reuben went forward by their hosts. The Rabba set over the hosts of the tribe of the Beni Reuben was Elizur bar Shedeur;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 19, "aliyah": 5, "heb": "וְעַ֨ל־צְבָ֔א מַטֵּ֖ה בְּנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן־צוּרִֽישַׁדָּֽי׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי שִׁמְעוֹן שְׁלֻמִיאֵל בַּר צוּרִישַׁדָּי:", "onk_en": "In charge of the division of the tribe of the sons of Shimon, [was] Shlumiel the son of Tzurishadai.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי שִׁמְעוֹן שְׁלֻמִיאֵל בַּר צוּרִי שַׁדָי", "pj_en": "the Rabba of the Beni Shemeon, Shelumiel bar Zurishaddai;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 20, "aliyah": 5, "heb": "וְעַל־צְבָ֖א מַטֵּ֣ה בְנֵי־גָ֑ד אֶלְיָסָ֖ף בֶּן־דְּעוּאֵֽל׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי גָד אֶלְיָסָף בַּר דְּעוּאֵל:", "onk_en": "In charge of the division of the tribe of the sons of Gad, [was] Elyasaf the son of De’uel.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי גָד אֶלְיָסָף בַּר דְעוּאֵל", "pj_en": "and the Rabba of the Beni Gad, Eljasaph bar Dehuel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 21, "aliyah": 5, "heb": "וְנָסְעוּ֙ הַקְּהָתִ֔ים נֹשְׂאֵ֖י הַמִּקְדָּ֑שׁ וְהֵקִ֥ימוּ אֶת־הַמִּשְׁכָּ֖ן עַד־בֹּאָֽם׃", "onk": "וְנָטְלִין בְּנֵי קְהָת נָטְלֵי מַקְדְּשָׁא וּמְקִימִין יָת מַשְׁכְּנָא עַד מֵיתֵיהוֹן:", "onk_en": "[Then] the Kehos family traveled, the carriers of the sacred, and they erected the <i>Mishkon<\/i> by the time of their arrival.", "pj": "וְנַטְלִין גְנִיסַת קְהָת נַטְלֵי מוּקְדְשָׁא וּמְקִימִין יַת מַשְׁכְּנָא עַד מֵיתֵיהוֹן", "pj_en": "And the family of Kehath went forward, carrying the sanctuary; and they (the men of Gershon) reared up the tabernacle against their coming.", "tj": "", "tj_en": "", "rashi": "<b>נשאי המקדש.<\/b> נוֹשְׂאֵי דְבָרִים הַמְקֻדָּשִׁים:<br><br><b>והקימו את המשכן.<\/b> בְּנֵי גֵרְשׁוֹן וּבְנֵי מְרָרִי שֶׁהָיוּ קוֹדְמִים לָהֶם מַסַּע שְׁנֵי דְגָלִים, הָיוּ מְקִימִין אֶת הַמִּשְׁכָּן כְּשֶׁהָיָה הֶעָנָן שׁוֹכֵן, וְסִימַן הַחֲנִיָּה נִרְאֶה בְּדֶגֶל מַחֲנֵה יְהוּדָה, וְהֵם חוֹנִים וַעֲדַיִן בְּנֵי קְהָת בָּאִים מֵאַחֲרֵיהֶם עִם שְׁנֵי דְגָלִים הָאַחֲרוֹנִים, הָיוּ בְנֵי גֵרְשׁוֹן וּבְנֵי מְרָרִי מְקִימִין אֶת הַמִּקְדָּשׁ; וּכְשֶׁבָּאִים בְּנֵי קְהָת מוֹצְאִים אוֹתוֹ עַל מְכוֹנוֹ, וּמַכְנִיסִין בּוֹ הָאָרוֹן וְהַשֻּׁלְחָן וְהַמְּנוֹרָה וְהַמִּזְבְּחוֹת, וְזֶהוּ מַשְׁמָעוּת הַמִּקְרָא — וְהֵקִימוּ מְקִימֵי הַמִּשְׁכָּן אוֹתוֹ <b>עד<\/b> טֶרֶם <b>באם<\/b> שֶׁל בְּנֵי קְהָת:", "rashi_en": "נשאי המקדש means, the bearers of the holy articles (not of the structure of the Sanctuary itself for this was the burden of the sons of Gershon and Merari; cf. v. 17).<br><br>והקימו את המשכן AND THEY SET UP THE TABERNACLE [BEFORE THEY CAME] — this means: The sons of Gershon and the sons of Merari who were in front of them (the Kohathites) travelling together with the two divisions, those of Judah and Reuben, set up the Tabernacle as soon as the cloud rested, and the sign for encamping became visible above the division of the camp of Judah (cf. Rashi on 9:17). Now when they encamped and whilst the sons of Kohath were coming after them with the two last divisions (Ephraim and Dan), the sons of Gershon and the sons of Merari erected the Sanctuary. When the sons of Kohath arrived, they already found it in its proper place and they put into it the Ark, the table, the candelabrum and the altars. The following therefore is what the verse implies: והקימו, and they — i.e. those who had to erect the Tabernacle — erected it, עד before באם their arrival — the arrival of the sons of Kohath."}, {"ch": 10, "v": 22, "aliyah": 5, "heb": "וְנָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה בְנֵֽי־אֶפְרַ֖יִם לְצִבְאֹתָ֑ם וְעַ֨ל־צְבָא֔וֹ אֱלִישָׁמָ֖ע בֶּן־עַמִּיהֽוּד׃", "onk": "וּנְטַל טֵקַס מַשְׁרִית בְּנֵי אֶפְרַיִם לְחֵילֵיהוֹן וְעַל חֵילֵיהּ אֱלִישָׁמָע בַּר עַמִּיהוּד:", "onk_en": "[Then] the banner of the sons of Ephraim’s camp traveled according to their divisions. In charge of its division, [was] Elishamah the son of Amihud.", "pj": "וּנְטַל טֵיקַס מַשִׁירְיַית בְּנֵי אֶפְרַיִם לְחֵילֵיהוֹן וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי אֶפְרַיִם אֱלִישָׁמָע בַּר עַמִיהוּד", "pj_en": "The standard of the camps of the Beni Ephraim went forward by their hosts: the Rabba set over the host of the tribe of Ephraim was Elishama bar Ammihud;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 23, "aliyah": 5, "heb": "וְעַ֨ל־צְבָ֔א מַטֵּ֖ה בְּנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן־פְּדָהצֽוּר׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי מְנַשֶּׁה גַּמְלִיאֵל בַּר פְּדָהצוּר:", "onk_en": "In charge of the division of the tribe of the sons of Menashe, [was] Gamliel the son of Pedahtzur.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי מְנַשֶׁה גַמְלִיאֵל בַּר פְּדָהצוּר", "pj_en": "the Rabba of that of Menasheh, Gamaliel bar Pedazur;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 24, "aliyah": 5, "heb": "וְעַ֨ל־צְבָ֔א מַטֵּ֖ה בְּנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן־גִּדְעוֹנִֽי׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי בִנְיָמִן אֲבִידָן בַּר גִּדְעוֹנִי:", "onk_en": "In charge of the division of the tribe of the sons of Binyamin, [was] Avidan the son of Gid’oni.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי בִּנְיָמִין אֲבִידָן בַּר גִדְעוֹנִי", "pj_en": "and the Rabba of Benjamin, Abidan bar Gideoni.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 25, "aliyah": 5, "heb": "וְנָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי־דָ֔ן מְאַסֵּ֥ף לְכׇל־הַֽמַּחֲנֹ֖ת לְצִבְאֹתָ֑ם וְעַ֨ל־צְבָא֔וֹ אֲחִיעֶ֖זֶר בֶּן־עַמִּישַׁדָּֽי׃", "onk": "וְנָטֵל טֵקַס מַשְׁרִית בְּנֵי דָן מַכְנֵישׁ לְכָל מַשִּׁרְיָתָא לְחֵילֵיהוֹן וְעַל חֵילֵיהּ אֲחִיעֶזֶר בַּר עַמִּישַׁדָּי:", "onk_en": "[Then] the banner of the sons of Don’s camp traveled; the gatherer for all the camps, according to their divisions. In charge of its division, [was] Achiezer the son of Amishadai.", "pj": "וּנְטַל טֵיקַס מַשִׁרְיַית בְּנֵי דָן מַכְנִישׁ לְכָל מַשִׁרְיָיתָא לְחֵילֵיהוֹן וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטֵיהּ דִבְנֵי דָן אֲחִיעֶזֶר בַּר עַמִישַׁדָי", "pj_en": "And the standard of the camps of the Beni Dan went forward, completing all the camps according to their hosts; and the Rabba set over his host was Ahiezer bar Ammishaddai;", "tj": "", "tj_en": "", "rashi": "<b>מאסף לכל המחנת.<\/b> תַּלְמוּד יְרוּשַׁלְמִי: לְפִי שֶׁהָיָה שִׁבְטוֹ שֶׁל דָּן מְרֻבֶּה בְּאֻכְלוֹסִים, הָיָה נוֹסֵעַ בָּאַחֲרוֹנָה, וְכָל מִי שֶׁהָיָה מְאַבֵּד דָּבָר הָיָה מַחֲזִירוֹ לוֹ; אִית מַאן דַּאֲמַר כְּתֵבָה הָיוּ מְהַלְּכִין, וּמַפִּיק לָהּ מִן \"כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ\", וְאִית דְּאָמְרֵי כְּקוֹרָה הָיוּ מְהַלְּכִין, וּמַפִּיק לָהּ מִן \"מְאַסֵּף לְכָל הַמַּחֲנֹת\" (תלמוד ירושלמי ערובין ה'):", "rashi_en": "מאסף לכל המחנת [THEN THE BANNER OF THE CAMP OF THE CHILDREN OF DAN SET FORWARD] WHICH WAS THE GATHERER OF ALL THE CAMPS — The Talmud Yerushalmi Eruvin 5:1 has the following statement: Because the tribe of Dan consisted of numerous troops (i. e. was more numerous than each of the other tribes, except Judah which marched on the front, cf. Chapter II), it marched in the rear so that if anyone of the other tribes lost anything, he (Dan) restored it to him. (מאסף לכל המחנת therefore means “the one who gathered in everything belonging to all the camps”.) — There is one authority that holds that they traveled in formation like a box (i.e. in a military square) and derives this from the text, (Numbers 2:17) “just as they encamp so shall they journey” , and there is another authority that maintains that they traveled in a straight line like a beam, and derives this from the statement that Dan was “the gatherer of all the camps”."}, {"ch": 10, "v": 26, "aliyah": 5, "heb": "וְעַ֨ל־צְבָ֔א מַטֵּ֖ה בְּנֵ֣י אָשֵׁ֑ר פַּגְעִיאֵ֖ל בֶּן־עׇכְרָֽן׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי אָשֵׁר פַּגְעִיאֵל בַּר עָכְרָן:", "onk_en": "In charge of the division of the tribe of the sons of Asher, [was] Pagiel the son of Ochran.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי אָשֵׁר פַּגְעִיאֵל בַּר עָכְרָן", "pj_en": "the Rabba of the tribe of Asher, Pagiel bar Achran;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 27, "aliyah": 5, "heb": "וְעַ֨ל־צְבָ֔א מַטֵּ֖ה בְּנֵ֣י נַפְתָּלִ֑י אֲחִירַ֖ע בֶּן־עֵינָֽן׃", "onk": "וְעַל חֵילָא דְּשִׁבְטָא דִּבְנֵי נַפְתָּלִי אֲחִירַע בַּר עֵינָן:", "onk_en": "In charge of the division of the tribe of the sons of Naftali, [was] Achirah the son of Einan.", "pj": "וְרַבָּא דְהַוָה מְמַנֵי עַל חֵילְוַות שִׁבְטָא דִבְנֵי נַפְתָּלִי אֲחִירַע בַּר עֵינָן", "pj_en": "and the Rabba of the Beni Naphtali, Ahira bar Enan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 28, "aliyah": 5, "heb": "אֵ֛לֶּה מַסְעֵ֥י בְנֵֽי־יִשְׂרָאֵ֖ל לְצִבְאֹתָ֑ם וַיִּסָּֽעוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין מַטְּלָנֵי בְּנֵי יִשְׂרָאֵל לְחֵילֵיהוֹן וּנְטָלוּ:", "onk_en": "These are the journeys of Bnei Yisroel according to their divisions; and they journeyed.", "pj": "אִלֵין מַטְלָנֵי בְּנֵי יִשְרָאֵל לְחֵילֵיהוֹן וְאִסְתַּלֵק עֲנַן יְקָרָא מֵעִילַוֵי מַשְׁכְּנָא וּנְטָלוּ", "pj_en": "These are the journeys of the children of Israel by their hosts; the Cloud of Glory was lifted up from above the tabernacle, and they went forward.", "tj": "", "tj_en": "", "rashi": "<b>אלה מסעי.<\/b> זֶה סֵדֶר מַסְעֵיהֶם:<br><br><b>ויסעו.<\/b> בַּיּוֹם הַהוּא נָסְעוּ:", "rashi_en": "אלה מסעי means: This is the order, of their journeyings (i.e. these words do not mean, “these are the stations”, as the introductory words of chapter Numbers 33:1, where the names of the stations are enumerated; here Scripture merely intends to state that this was the order which they had to keep when journeying).<br><br>ויסעו AND THEY JOURNEYED means, on the very same day mentioned at the beginning of the chapter did they set off."}, {"ch": 10, "v": 29, "aliyah": 5, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֗ה לְ֠חֹבָ֠ב בֶּן־רְעוּאֵ֣ל הַמִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים&thinsp;<b>׀<\/b> אֲנַ֗חְנוּ אֶל־הַמָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהֹוָ֔ה אֹת֖וֹ אֶתֵּ֣ן לָכֶ֑ם לְכָ֤ה אִתָּ֙נוּ֙ וְהֵטַ֣בְנוּ לָ֔ךְ כִּֽי־יְהֹוָ֥ה דִּבֶּר־ט֖וֹב עַל־יִשְׂרָאֵֽל׃", "onk": "וַאֲמַר משֶׁה לְחֹבָב בַּר רְעוּאֵל מִדְיָנָאָה חֲמוּהִי דְמשֶׁה נָטְלִין אֲנַחְנָא לְאַתְרָא דִּי אֲמַר יְיָ יָתֵיהּ אֶתֵּן לְכוֹן אִיתָא עִמָּנָא וְנוֹטֵיב לָךְ אֲרֵי יְיָ מַלִּיל לְאַיְתָאָה טָבָא עַל יִשְׂרָאֵל:", "onk_en": "Moshe said to Chovav the son of Reuel, the Midianite, Moshe’s father-in-law: “We are journeying to the place about which Adonoy said; ‘I will give it to you’, come along with us and we will treat you well, for Adonoy spoke of bringing good [fortune] on Israel.”", "pj": "וַאֲמַר משֶׁה לְחוֹבָב בַּר רְעוּאֵל מִדְיָנָאָה חֲמוֹי דְמשֶׁה נַטְלִין אֲנַחְנָא מִיכָּא לְאַתְרָא דַאֲמַר יְיָ יָתֵיהּ אֶתֵּן לְכוֹן אִיתָא עִמָנָא וְנוֹטִיב לָךְ אֲרוּם יְיָ מַלֵיל לְאוֹטָבָא לְגִיוֹרָא עַל יִשְרָאֵל", "pj_en": "And Mosheh said unto Hobab bar Reuel the Midianite, father-in-law of Mosheh, We are journeying from hence to the place of which the Lord hath said, I will give it to you: come with us, and we will do thee good; for the Lord hath spoken to do good unto the sojourner with Israel.", "tj": "", "tj_en": "", "rashi": "<b>חבב.<\/b> הוּא יִתְרוֹ שֶׁנֶּאֱמַר \"מִבְּנֵי חֹבָב חֹתֵן מֹשֶׁה\" (שופטים ד'), וּמַה תַּ\"ל \"וַתָּבֹאנָה אֶל רְעוּאֵל אֲבִיהֶן\"? מְלַמֵּד שֶׁהַתִּינוֹקוֹת קוֹרִין לַאֲבִי אֲבִיהֶן אַבָּא; וְשֵׁמוֹת הַרְבֵּה הָיוּ לוֹ, \"יִתְרוֹ\" עַל שֵׁם שֶׁיִּתֵּר פָּרָשָׁה אַחַת בַּתּוֹרָה, \"חוֹבָב\" עַל שֶׁחִבֵּב אֶת הַתּוֹרָה וְכוּ' (ספרי):<br><br><b>נסעים אנחנו אל המקום.<\/b> מִיָּד — עַד שְׁלֹשָׁה יָמִים אָנוּ נִכְנָסִין לָאָרֶץ, שֶׁבְּמַסָּע זֶה הָרִאשׁוֹן נָסְעוּ עַל מְנָת לִכָּנֵס לְאֶרֶץ יִשְׂרָאֵל, אֶלָּא שֶׁחָטְאוּ בְּמִתְאוֹנְנִים; וּמִפְּנֵי מָה שִׁתֵּף מֹשֶׁה עַצְמוֹ עִמָּהֶם? שֶׁעֲדַיִן לֹא נִגְזְרָה גְזֵרָה עָלָיו וּכְסָבוּר שֶׁהוּא נִכְנָס (עי' שם):", "rashi_en": "חבב is identical with Jethro, as it is said, (Judges 4:11) of the sons of Hobab, the father-in-law of Moses”. (Thus חתן משה in our verse is to be connected with חבב and not with רעואל המדיני immediately preceding). — But why then does it state (Exodus 2:18) “and they (the daughters of Jethro) came to Reuel, their father”, since he was their grandfather and not their father? It teaches us that children are in the habit of calling their grandfather by the term “father”. — He (Jethro) was called by several names: Jethro, because he added (it was through him there was added) a section to the Torah (viz., Exodus 18:21 ff.); Hobab (חֹבָב) because he loved (חֹבֵב) the Torah, etc.<br><br>נוסעים אנחנו אל המקום WE ARE JOURNEYING UNTO THE PLACE — Immediately — within three days — we shall enter the Land of Canaan. They said this, because on this first journey after leaving Sinai they really set out with a view to entering the Land of Israel, only that they sinned at the incident of “those who complained” which prevented their further progress (Numbers 11:1). — But why did Moses include himself with them in the statement “ we are journeying” to enter the land? Because the decree that he should not enter it had not yet been made regarding him, and he was yet under the belief that he would enter (cf. Sifrei Bamidbar 78:3)."}, {"ch": 10, "v": 30, "aliyah": 5, "heb": "וַיֹּ֥אמֶר אֵלָ֖יו לֹ֣א אֵלֵ֑ךְ כִּ֧י אִם־אֶל־אַרְצִ֛י וְאֶל־מוֹלַדְתִּ֖י אֵלֵֽךְ׃", "onk": "וַאֲמַר לֵיהּ לָא אֵזֵל אֶלָּהֵן לְאַרְעִי וּלְיַלָּדוּתִי אֵזֵל:", "onk_en": "He said to him “I will not go, but rather to my land and to my birthplace will I go.”", "pj": "וַאֲמַר לֵיהּ לָא אִיזֵיל אֱלָהֵין לְאַרְעִי וּלְיַלְדוּתִי אִיזֵיל", "pj_en": "But he answered him, I will not go (with you) but to my (own) land and to my kindred will I go.", "tj": "", "tj_en": "", "rashi": "<b>אל ארצי ואל מולדתי.<\/b> אִם בִּשְׁבִיל נְכָסַי, אִם בִּשְׁבִיל מִשְׁפַּחְתִּי:", "rashi_en": "אל ארצי ואל מולדתי [AND HE SAID TO HIM, I WILL NOT GO; BUT I WILL DEPART] TO MINE OWN LAND, AND TO MY KINDRED — (the Hebrew may be translated: but for my own land and for my own kindred I must go) — “I must go” whether for the sake of (אל) my property (ארצי) or for the sake of (אל) my family (cf. Sifrei Bamidbar 79)."}, {"ch": 10, "v": 31, "aliyah": 5, "heb": "וַיֹּ֕אמֶר אַל־נָ֖א תַּעֲזֹ֣ב אֹתָ֑נוּ כִּ֣י&thinsp;<b>׀<\/b> עַל־כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֙נוּ֙ בַּמִּדְבָּ֔ר וְהָיִ֥יתָ לָּ֖נוּ לְעֵינָֽיִם׃", "onk": "וַאֲמַר לָא כְעַן תִּשְׁבּוֹק יָתָנָא אֲרֵי עַל כֵּן יְדַעַתְּ כַּד הֲוֵינָא שָׁרַן בְּמַדְבְּרָא <b>וּגְבוּרַן דְּאִתְעֲבִידַן לָנָא חֲזֵיתָא בְעֵינָיִךְ<\/b>:", "onk_en": "He said to him “please do not forsake us, for, because you know of our encampment in the desert, and you will be our eyes [<b>the great things that were done for us you saw with your eyes<\/b>].", "pj": "וַאֲמַר לָא כְדוּן תִּשְׁבּוֹק יָתָנָא אֲרוּם בְּגִין כֵּן דִידַעְתְּ כַּד הֲוֵינָן שְׁרַן בְּמַדְבְּרָא לְמִידַן וְאַלִיפַת לָנָא עֵיסַק דִינָא וַהֲוָיַת חָבִיב עֲלָן כְּבָבַת עֵינָנָא", "pj_en": "But he said, Do not now leave us; for when we were encamped in the wilderness, thou knewest how to judge, and didst teach us the method (or business) of judgment, and thou art dear to us as the apple of our eyes.", "tj": "", "tj_en": "", "rashi": "<b>אל נא תעזב.<\/b> אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה, שֶׁלֹּא יֹאמְרוּ לֹא נִתְגַּיֵּר יִתְרוֹ מֵחִבָּה, סָבוּר הָיָה שֶׁיֵּשׁ לַגֵּרִים חֵלֶק בָּאָרֶץ, עַכְשָׁו שֶׁרָאָה שֶׁאֵין לָהֶם חֵלֶק, הִנִּיחָם וְהָלַךְ לוֹ (שם):<br><br><b>כי על כן ידעת חנתנו במדבר.<\/b> כִּי נָאֶה לְךָ לַעֲשׂוֹת זֹאת, עַל אֲשֶׁר יָדַעְתָּ חֲנוֹתֵנוּ בַּמִּדְבָּר וְרָאִיתָ נִסִּים וּגְבוּרוֹת שֶׁנַּעֲשׂוּ לָנוּ:<br><br><b>כי על כן ידעת.<\/b> כְּמוֹ עַל אֲשֶׁר יָדַעְתָּ, כְּמוֹ \"כִּי עַל כֵּן לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי\" (בראשית ל\"ח), \"כִּי עַל כֵּן עֲבַרְתֶּם\" (בראשית י\"ט), \"כִּי עַל כֵּן בָּאוּ\" (בראשית י\"ט), \"כִּי עַל כֵּן רָאִיתִי פָנֶיךָ\" (בראשית ל\"ג):<br><br><b>והיית לנו לעינים.<\/b> לְשׁוֹן עָבָר, כְּתַרְגּוּמוֹ; דָּ\"אַ: לְשׁוֹן עָתִיד — כָּל דָּבָר וְדָבָר שֶׁיִּתְעַלֵּם מֵעֵינֵינוּ, תִּהְיֶה מֵאִיר עֵינֵינוּ; דָּ\"אַ: שֶׁתְּהֵא חָבִיב עָלֵינוּ כְּגַלְגַּל עֵינֵינוּ, שֶׁנֶּאֱמַר (דברים י') \"וַאֲהַבְתֶּם אֶת הַגֵּר\" (ספרי):", "rashi_en": "אל נא תעזב LEAVE [US] NOT, I PRAY THEE — The word נא is an expression of entreaty. Here it means: I beg of you, not to leave usin order that people should not say, “Jethro did not become a proselyte out of pure love for the Jewish faith. He believed that the proselytes, too, would have a portion in the Land; now, however, that he saw that they will have no portion in it he has deserted them and gone his own way (Sifrei Bamidbar 80).<br><br>כי על כן ידעת FOR THOU KNOWEST OUR ENCAMPMENT IN THE WILDERNESS] — For (כי) it is fitting for you to do this, because (על כן) you have known our encampments in the wilderness and you have seen the miracles and the mighty deeds that have been wrought for us.<br><br>כי על כן ידעת — This is similar to על אשר ידעת, like (Genesis 38:26) “For (כי) she has acted rightly, because (על כן) I did not give her to Selah, my son”; (Genesis 19:8): “For (כי) this kindness please do out of respect to me, because (על כן) they have come under the shadow of my roof”; (Genesis 33:10): “For (כי) it is fitting and proper for you to accept my present, because (על כן) I have seen your face.\"<br><br>והיית לנו לעינים — The verb is in the past tense and we have to understand it just as the Targum renders it: and all the mighty deeds that have been wrought for us thou hast seen with thine own eyes. Another explanation is that it is the future tense: whatever things will be hidden from our eyes, you will enlighten our eyes about it. Still another explanation is that the passage means that you will be held in affection by us as our “very eye-balls”. as it is said, (Deuteronomy 10:19) “and ye shall love the stranger” (Sifrei Bamidbar 80)."}, {"ch": 10, "v": 32, "aliyah": 5, "heb": "וְהָיָ֖ה כִּי־תֵלֵ֣ךְ עִמָּ֑נוּ וְהָיָ֣ה&thinsp;<b>׀<\/b> הַטּ֣וֹב הַה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהֹוָ֛ה עִמָּ֖נוּ וְהֵטַ֥בְנוּ לָֽךְ׃", "onk": "וִיהֵי אֲרֵי תֵזֵל עִמָּנָא וִיהֵי טָבָא הַהוּא דִּי יוֹטִיב יְיָ עִמָּנָא וְנוֹטֵיב לָךְ:", "onk_en": "It will be, that when you go with us, it shall be that the very good which Adonoy will bestow on us we will bestow on (share with) you.", "pj": "וִיהֵי אֲרוּם תֵזִיל עִמָנָא וִיהֵי טָבָא הַהוּא דְיוֹטֵב יְיָ עִמָנָא וְנוֹטִיב לָךְ בְּפִלוּג אַרְעָא", "pj_en": "And it shall be that if thou wilt go on with us, with the good that the Lord shall benefit us will we benefit thee, in the division of the land.", "tj": "", "tj_en": "", "rashi": "<b>והיה הטוב ההוא.<\/b> מַה טּוֹבָה הֵטִיבוּ לוֹ? אָמְרוּ, כְּשֶׁהָיוּ יִשְׂרָאֵל מְחַלְּקִין אֶת הָאָרֶץ, הָיָה דֻּשְׁנָהּ שֶׁל יְרִיחוֹ ת\"ק אַמָּה עַל ת\"ק אַמָּה וְהִנִּיחוּהוּ מִלַּחֲלֹק, אָמְרוּ מִי שֶׁיִּבָּנֶה בֵּית הַמִּקְדָּשׁ בְּחֶלְקוֹ הוּא יִטְּלֶנּוּ, וּבֵין כָּךְ וּבֵין כָּךְ נְתָנוּהוּ לִבְנֵי יִתְרוֹ לְיוֹנָדָב בֶּן רֵכָב שֶׁנֶּאֱמַר \"וּבְנֵי קֵינִי חֹתֵן מֹשֶׁה עָלוּ מֵעִיר הַתְּמָרִים\" וְגוֹ' (שופטים א'):", "rashi_en": "והיה הטוב ההוא AND IT SHALL BE THAT WHAT GOODNESS [THE LORD SHALL DO UNTO US, THE SAME WILL WE DO UNTO THEE] — What good did they actually bestow upon him (i.e. when did they redeem their promise)? They (our Sages) say: When the Israelites were parcelling out the Land the most fertile part of Jericho proved to extend over an area of 500 by 500 cubits; they left it unparcelled and said: He in whose portion of land the Sanctuary will be built shall take it as a substitute for giving up the land upon which the Temple was built. In the meantime, however, they gave it to the children of Jethro — to Jonadab the son of Rechab, [as it is said, (Judges 1:16) “And the children of the Kenite, Moses’ father-in-law, went up out of the city of the palm tree” (which is identical with Jericho; cf. Deuteronomy 34:3)] (Sifrei Bamidbar 81)."}, {"ch": 10, "v": 33, "aliyah": 5, "heb": "וַיִּסְעוּ֙ מֵהַ֣ר יְהֹוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַאֲר֨וֹן בְּרִית־יְהֹוָ֜ה נֹסֵ֣עַ לִפְנֵיהֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָת֥וּר לָהֶ֖ם מְנוּחָֽה׃", "onk": "וּנְטָלוּ מִטּוּרָא <b>דְּאִתְגְּלֵי עֲלוֹהִי יְקָרָא דַיְיָ<\/b> מַהֲלַךְ תְּלָתָא יוֹמִין וַאֲרוֹן קְיָמָא דַיְיָ נָטֵל קֳדָמֵיהוֹן מַהֲלַךְ תְּלָתָא יוֹמִין לְאַתְקְנָאָה לְהוֹן אֲתַר בֵּית מֵישְׁרֵי:", "onk_en": "They traveled from the mountain of Adonoy [<b>upon which the glory of Hashem was revealed<\/b>] a journey of three days, and the Ark of the Covenant of Adonoy traveled in front of them a journey of three days, to prepare for them a place to settle.", "pj": "וּנְטָלוּ מִטוּרָא דְאִתְגְלֵי עֲלוֹי אִיקַר שְׁכִינְתָּא דַיְיָ מַהֲלַךְ תְּלָתָא יוֹמִין וַאֲרוֹן קְיָימָא דַיְיָ מְטַיֵיל קֳדָמֵיהוֹן תְּלָתִין וְשִׁית מִלִין הֲלִיךְ בְּיוֹמָא הַהוּא וְהוּא הֲוָה מִידַבֵּר קֳדָם מַשִׁרְיָיתָא דְיִשְרָאֵל מַהֲלַךְ תְּלָתָא יוֹמִין לְאַתְקָנָא לְהוֹן אֲתַר בֵּית מֵשְׁרוֹי", "pj_en": "And they went forward from the mountain where the glory of the Shekinah of the Lord had been revealed, going three days; and the Ark of the Lord's covenant went before them. Thirty and six miles it went that day; it preceded the camp of Israel, going three days, to provide for them a place to encamp in.", "tj": "", "tj_en": "", "rashi": "<b>דרך שלשת ימים.<\/b> מַהֲלַךְ שְׁלֹשֶׁת יָמִים הָלְכוּ בְיוֹם אֶחָד, שֶׁהָיָה הַקָּבָּ\"ה חָפֵץ לְהַכְנִיסָם לָאָרֶץ מִיָּד (ספרי):<br><br><b>וארון ברית ה' נסע לפניהם דרך שלשת ימים.<\/b> זֶה הָאָרוֹן הַיּוֹצֵא עִמָּהֶם לַמִּלְחָמָה וּבוֹ שִׁבְרֵי לוּחוֹת מוּנָחִים, וּמַקְדִּים לִפְנֵיהֶם דֶּרֶךְ שְׁלֹשֶׁת יָמִים, לְתַקֵּן לָהֶם מְקוֹם חֲנִיָּה (שם; תלמוד ירושלמי שקלים ו'):", "rashi_en": "דרך שלשת ימים [AND THEY DEPARTED FROM THE MOUNT OF THE LORD] THREE DAYS’ JOURNEY — A distance of three days’ journey they miraculously travelled in one day, because the Holy One, blessed be He, desired to bring them straight away into the Land (cf. Sifrei Bamidbar 82).<br><br>וארון ברית ה' נסע לפניהם דרך שלשת ימים AND THE ARK OF THE COVENANT OF THE LORD WENT BEFORE THEM IN THE THREE DAYS' JOURNEY — This was the Ark that went with them whenever they waged war and in which the broken Tablets were placed. It traveled in front of them a distance of three days’ journey to prepare for them a proper place for encampment (Sifrei Bamidbar 82; Talmud Yerushalmi Shekalim 6:1). "}, {"ch": 10, "v": 34, "aliyah": 5, "heb": "וַעֲנַ֧ן יְהֹוָ֛ה עֲלֵיהֶ֖ם יוֹמָ֑ם בְּנׇסְעָ֖ם מִן־הַֽמַּחֲנֶֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַעֲנַן <b>יְקָרָא<\/b> דַיְיָ מַטֵּיל עֲלֵיהוֹן בִּימָמָא בְּמִטַּלְהוֹן מִן מַשְׁרִיתָא:", "onk_en": "The Cloud [<b>of the glory<\/b>] of Adonoy was above them by day when they traveled from the camp.", "pj": "וַעֲנַן אִיקַר שְׁכִינְתָּא דַיְיָ מְטַלֵיל עִילַוֵיהוֹן בִּימָמָא בְּמֵטַלְהוֹן מִן מַשְׁרִיתָא", "pj_en": "And the Cloud of the Lord's Shekinah overshadowed them by day in their going out from the encampment.", "tj": "", "tj_en": "", "rashi": "<b>וענן ה' עליהם יומם.<\/b> שִׁבְעָה עֲנָנִים כְּתוּבִים בְּמַסְעֵיהֶם, אַרְבָּעָה מֵאַרְבַּע רוּחוֹת, וְאֶחָד לְמַעְלָה, וְאֶחָד לְמַטָּה, וְאֶחָד לִפְנֵיהֶם מַנְמִיךְ אֶת הַגָּבוֹהַּ וּמַגְבִּיהַּ אֶת הַנָּמוּךְ וְהוֹרֵג נְחָשִׁים וְעַקְרַבִּים (ספרי; מכילתא שמות י\"ג):<br><br><b>מן המחנה.<\/b> מִמְּקוֹם חֲנִיָּתָן:", "rashi_en": " וענן ה׳ עליהם יומם AND THE CLOUD OF THE LORD WAS UPON THEM BY DAY — Seven times is the word ענן used in the account of their journeys alluding to four clouds which screened them on all four sides, one that was above them, one beneath their feet, and one in front of them which leveled the elevations and raised the depressions, and killed all serpents and scorpions (Sifrei Bamidbar 83:1; Mekhilta; Br. d’ Melechet ha-Mishkan 14).<br><br>FROM THE CAMP — From the place where they encamped."}, {"ch": 10, "v": 35, "aliyah": 6, "heb": "<span class=\"mam-spi-invnun\">׆<\/span>&nbsp;וַיְהִ֛י בִּנְסֹ֥עַ הָאָרֹ֖ן וַיֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣ה&thinsp;<b>׀<\/b> יְהֹוָ֗ה וְיָפֻ֙צוּ֙ אֹֽיְבֶ֔יךָ וְיָנֻ֥סוּ מְשַׂנְאֶ֖יךָ מִפָּנֶֽיךָ׃", "onk": "וַהֲוָה בְּמִטַּל אֲרוֹנָא וַאֲמַר משֶׁה <b>אִתְגְּלֵי<\/b> יְיָ וְיִתְבַּדְּרוּן סַנְאָיךְ וִיעָרְקוּן בַּעֲלֵי דְבָבָךְ מִן קֳדָמָךְ:", "onk_en": "Whenever the Ark departed Moshe woud say: “Rise, [<b>reveal Yourself<\/b>] Adonoy, and may Your enemies disperse, and those who hate You flee before You.”", "pj": "וַהֲוָה כַּד הֲוָה בָּעֵי לְמֵיטַל אֲרוֹנָא הֲוָה עֲנָנָא מְקַפֵּל וְקָאִים וְלָא הֲוָה נָטִיל עַד דְמשֶׁה הֲוָה קָאֵי בִּצְלוֹ מַצְלֵי וּבָעֵי רַחֲמִין מִן קֳדָם יְיָ וְכֵן אָמַר אִתְגְלֵי כְּדוֹן מֵימְרָא דַיְיָ בִּתְקוֹף רוּגְזָךְ וְיִתְבַּדְרוּן בַּעֲלֵי דְבָבֵיהוֹן דְעַמָךְ וְלָא יֶהֱוֵי לְסַנְאֵיהוֹן רֵיגַל לְמֵיקוּם קֳדָמָךְ", "pj_en": "And it was when the ark should go forward, the Cloud gathered itself together and stood still, not going on, until Mosheh, standing in prayer, prayed and supplicated mercy from before the Lord, and thus spake: Let the Word of the Lord be now revealed in the power of Thy anger, that the adversaries of Thy people may be scattered; and let not the banner of those who hate them be uplifted before Thee.", "tj": "וַהֲוָה כַּד הֲוָה אֲרוֹנָא נָטַל הֲוָה משֶׁה קָאִים יְדוֹי בִּצְלוֹ וְאָמַר קוּם כְּעַן מֵימְרָא דַיְיָ בִּתְקוֹף חֵילָךְ וְיִתְבַּדְרוּן בַּעֲלֵי דְבָבֵיהוֹן דְעַמָךְ וִיעַרְקוּן שַנְאָךְ מִן קֳדָמָךְ:", "tj_en": "It was when the ark went forward. Mosheh stood, with hands (outstretched) in prayer, and said, Arise now, O Word of the Lord, in the power of Thy might, and let the adversaries of Thy people be scattered, and make Thine enemies flee before Thee.", "rashi": "<b>ויהי בנסע הארן.<\/b> עָשָֹה לוֹ סִימָנִיּוֹת מִלְּפָנָיו וּמִלְּאַחֲרָיו לוֹמַר שֶׁאֵין זֶה מְקוֹמוֹ, וְלָמָּה נִכְתַּב כָּאן? כְּדֵי לְהַפְסִיק בֵּין פֻּרְעָנוּת לְפֻרְעָנוּת וְכוּ', כִּדְאִיתָא בְּכָל כִּתְבֵי הַקֹּדֶשׁ (שבת קט\"ו):<br><br><b>קומה ה'.<\/b> לְפִי שֶׁהָיָה מַקְדִּים לִפְנֵיהֶם מַהֲלַךְ שְׁלֹשָׁה יָמִים, הָיָה מֹשֶׁה אוֹמֵר עֲמֹד וְהַמְתֵּן לָנוּ וְאַל תִּתְרַחֵק יוֹתֵר. תַּנְחוּמָא בְּוַיַּקְהֵל:<br><br><b>ויפצו איביך.<\/b> הַמְכֻנָּסִין:<br><br><b>וינסו משנאיך.<\/b> אֵלּוּ הָרוֹדְפִים:<br><br><b>משנאיך.<\/b> אֵלּוּ שׂוֹנְאֵי יִשְׂרָאל, שֶׁכָּל הַשּׂוֹנֵא אֶת יִשְׂרָאֵל שׂוֹנֵא אֶת מִי שֶׁאָמַר וְהָיָה הָעוֹלָם, שֶׁנֶּאֱמַר \"וּמְשַׂנְאֶיךָ נָשְׂאוּ רֹאשׁ\" (תהלים פ\"ג), וּמִי הֵם? \"עַל עַמְּךָ יַעֲרִימוּ סוֹד\":", "rashi_en": "ויהי בנסע הארן AND IT CAME TO PASS WHEN THE ARK PROCEEDED [THAT MOSES SAID etc.] — He (the Lord; cf. Shabbat 115a) made for it (for this section) dividing marks (inverted “Nuns”), in front and behind it, in order to indicate that this is not its proper place (it would more fittingly find a place in the section dealing with the march of the people in chapter Numbers II. after v. 17). But why, then, is it written here? In order to make a break between the narrative of one punishment and that of another punishment etc., as is stated in the Talmudic chapter commencing with כל כתבי (Shabbat 115b, cf. Sifrei Bamidbar 84:1). <br><br>‘קומה ה RISE UP O LORD — Because it (the Ark) was in front of them a distance of three days’ march, Moses exclaimed, “Stay and wait for us, and do not travel further away from us; this is to be found in Tanchuma 2:10:7 on Sedra ויקהל.  <br><br>ויפצו איביך [RISE UP, O LORD] AND LET THINE ENEMIES BE SCATTERED — i.e. those who massed for battle. <br><br>וינסו משנאיך AND LET THOSE THAT HATE THEE FLEE BEFORE THEE, — this refers to the pursuing enemies (those actually engaged in battle) (Sifrei Bamidbar 84:3).<br><br>משנאיך THOSE THAT HATE THEE — These are those who hate Israel, because whoever hates Israel, hates “Him who spoke and the world came into existence”, as it is said, (Psalms 83:3, 4) “[For lo, thine enemies are in an uproar] and they that hate Thee have lifted up the head” — and who are these that hate Thee? The next verse states this (v. 4): “They who have taken crafty counsel against thy people” (Sifrei Bamidbar 84:4)."}, {"ch": 10, "v": 36, "aliyah": 6, "heb": "וּבְנֻחֹ֖ה יֹאמַ֑ר שׁוּבָ֣ה יְהֹוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-invnun\">׆<\/span>&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבְמִשְׁרוֹהִי אֲמַר תּוּב יְיָ <b>שְׁרֵי בִיקָרָךְ<\/b> בְּגוֹ רִבְוַת אַלְפַיָּא דְיִשְׂרָאֵל:", "onk_en": "When it rested, he would say: “Come to rest, Adonoy, [<b>dwell in Your glory<\/b>] among the myriads and thousands of Israel.”", "pj": "וְכַד הֲוָה בָּעֵי לְמִשְׁרֵי אֲרוֹנָא הֲוָה עֲנָנָא מְקַפֵּל וְקָאִים וְלָא הֲוָה פָּרִיס עַד דְהַוָה משֶׁה קָאִים בִּצְלוֹ וּמַצְלֵי וּבָעֵי רַחֲמִין מִן קֳדָם יְיָ וְכֵן אָמַר תּוּב כְּדוֹן מֵימְרָא דַיְיָ בְּרַחֲמָךְ טַבְיָא וּדְבַר יַת עַמָךְ יִשְרָאֵל וְאַשְׁרֵי אִיקַר שְׁכִינָתָךְ בֵּינֵיהוֹן וְרַחֵם יַת רִבְוָותָא דְבֵית יַעֲקב מִנְיַן אַלְפַיָא דְיִשְרָאֵל", "pj_en": "But when the ark should rest, the Cloud gathered itself to ether and stood, but did not overspread, until Mosheh, standing in prayer, prayed and besought mercy from before the Lord, thus speaking: Return now, Thou Word of the Lord, in the goodness of Thy mercy, and lead Thy people Israel, and let the glory of Thy Shekinah dwell among them, and (Thy) mercy with the myriads of the house of Jakob, and with the multitudes of the thousands of Israel.", "tj": "וְכַד אֲרוֹנָא הֲוָה שָׁרֵי הֲוָה משֶׁה זְקֵיף יְדוֹי בִּצְלוֹ וַאֲמַר חֲזוֹר כְּעַן מֵימְרָא דַיְיָ מִן תְּקוֹף רוּגְזָךְ וְתוּב עֲלָן בְּרַחֲמָךְ טַבְיָא וּבְרִיךְ רַבְוָותָא וְאַסְגֵי אַלְפַיָא דִבְנֵי יִשְרָאֵל:", "tj_en": "But when the ark rested, Mosheh lifted his hands in prayer, and said, O Word of the Lord, turn from the strength of Thy anger, and return unto us in the goodness of Thy mercy, and bless the myriads and multiply the thousands of the children of Israel.", "rashi": "<b>שובה ה'.<\/b> מְנַחֵם תִּרְגְּמוֹ לְשׁוֹן מַרְגּוֹעַ, וְכֵן \"בְּשׁוּבָה וָנַחַת תִּוָּשֵׁעוּן\" (ישעיהו ל'):<br><br><b>רבבות אלפי ישראל.<\/b> מַגִּיד שֶׁאֵין הַשְּׁכִינָה שׁוֹרָה בְּיִשְׂרָאֵל פְּחוּתִים מִשְּׁנֵי אֲלָפִים וּשְׁתֵּי רְבָבוֹת (יבמות ס\"ד):", "rashi_en": "‘שובה ה [AND WHEN IT RESTED HE SAID] שובה O LORD — Menachem ben Seruk renders it (the word שובה) by an expression denoting “rest”. Similar is (Isaiah 30:15) “In rest (בשובה) and tranquility shall ye be saved” (cf. Ibn. Ezra).<br><br>רבבות אלפי ישראל [GIVE REST O LORD UNTO] THE MYRIADS OF THOUSANDS OF ISRAEL — This teaches us that the Shechinah does not rest upon Israel if they are less in number than twenty-two thousand (Yevamot 64a; Sifrei Bamidbar 84:5)."}, {"ch": 11, "v": 1, "aliyah": 6, "heb": "וַיְהִ֤י הָעָם֙ כְּמִתְאֹ֣נְנִ֔ים רַ֖ע בְּאׇזְנֵ֣י יְהֹוָ֑ה וַיִּשְׁמַ֤ע יְהֹוָה֙ וַיִּ֣חַר אַפּ֔וֹ וַתִּבְעַר־בָּם֙ אֵ֣שׁ יְהֹוָ֔ה וַתֹּ֖אכַל בִּקְצֵ֥ה הַֽמַּחֲנֶֽה׃", "onk": "וַהֲוָה עַמָּא כַּד מִסְתַּקְפִין בִּישׁ <b>קֳדָם<\/b> יְיָ וּשְׁמִיעַ<b> קֳדָם יְיָ<\/b> וּתְקֵף רָגְזֵיהּ וּדְלֵקַת בְּהוֹן אֶשָּׁתָא מִן <b>קֳדָם<\/b> יְיָ וְשֵׁצִיאַת בִּסְיָפֵי מַשְׁרִיתָא:", "onk_en": "The people were like complainers; [it was] wicked in the ears of [<b>before<\/b>] Adonoy. Adonoy heard [<b>before Hashem it was revealed<\/b>] and His Anger flared and the fire of [<b>from before<\/b>] Adonoy burned among them and consumed [some] of the outcasts of the camp.", "pj": "וַהֲווֹ רַשִׁיעֵי עַמָא כְּמִצְטַעֲרִין מְכַוְונִין וְהַגְיָאן בִּישׁ קֳדָם יְיָ וּשְׁמִיעַ קֳדָם יְיָ וּתְקֵיף רוּגְזֵיהּ וּדְלֵיקַת בְּהוֹן אֵישָׁא מְצַלְהֲבָא מִן קֳדָם יְיָ וְשֵׁצִיאַת מִן רַשִׁיעַיָא דְבִסְיָיפֵי מַשְׁרִיתָא דְבֵית דָן דְהַוָה פִּיסְלָא עִמְהוֹן", "pj_en": "But there were wicked men of the people, who, being discontent, devised and imagined evil before the Lord; and it was heard before the Lord, whose displeasure was moved; and a flaming fire was kindled among them from the Lord, which destroyed some of the wicked in the outskirts of the house of Dan, with whom was a graven image.", "tj": "", "tj_en": "", "rashi": "<b>ויהי העם כמתאננים.<\/b> אֵין הָעָם אֶלָּא רְשָׁעִים, וְכֵן הוּא אוֹמֵר \"מָה אֶעֱשֶׂה לָעָם הַזֶּה\" (שמות י\"ז), וְאוֹמֵר \"הָעָם הַזֶּה הָרָע\" (ירמיהו י\"ג); וּכְשֶׁהֵם כְּשֵׁרִים קְרוּאִים \"עַמִּי\", שֶׁנֶּאֱמַר \"שַׁלַּח עַמִּי\" (שמות ח׳:ט״ז), \"עַמִּי מֶה עָשִׂיתִי לְךָ\" (מיכה ו'):<br><br><b>כמתאננים.<\/b> אֵין מִתְאוֹנְנִים אֶלָּא לְשׁוֹן עֲלִילָה — מְבַקְּשִׁים עֲלִילָה הֵיאַךְ לִפְרֹשׁ מֵאַחֲרֵי הַמָּקוֹם, וְכֵן הוּא אוֹמֵר בְּשִׁמְשׁוֹן (שופטים י\"ד), \"כִּי תֹאֲנָה הוּא מְבַקֵּשׁ\" (ספרי):<br><br><b>רע באזני ה'.<\/b> תּוֹאֲנָה שֶׁהִיא רָעָה בְּאָזְנֵי ה', שֶׁמִּתְכַּוְּנִים שֶׁתָּבֹא בְּאָזְנָיו וְיַקְנִיט, אָמְרוּ: אוֹי לָנוּ, כַּמָּה לֻבַּטְנוּ בַּדֶּרֶךְ הַזֶּה, שְׁלֹשָׁה יָמִים שֶׁלֹּא נַחְנוּ מֵעִנּוּי הַדֶּרֶךְ:<br><br><b>ויחר אפו.<\/b> אֲנִי הָיִיתִי מִתְכַּוֵּן לְטוֹבַתְכֶם — שֶׁתִּכָּנְסוּ לָאָרֶץ מִיָּד:<br><br><b>בקצה המחנה.<\/b> בְּמֻּקְצִין שֶׁבָּהֶם לְשִׁפְלוּת, אֵלּוּ עֵרֶב רַב, רַבִּי שִׁמְעוֹן בֶּן מְנַסְיָא אוֹמֵר, בַּקְּצִינִים שֶׁבָּהֶם וּבַגְּדוֹלִים (עי' ספרי):", "rashi_en": "ויהי העם כמתאננים AND THE PEOPLE WERE COMPLAINING — The term העם “the people” always denotes wicked men. Similarly it states, (Exodus 17:4) “what shall I do unto this people (לעם הזה)? [yet a little and they will stone me]”, and it further states, ( 13:10) “This evil people [which refuses to hear my words]”. But when they are worthy men who are spoken of they are called עמי “My people”, as it is said, (Exodus 5:1) “Let My people go”; (Micah 6:3) “O My people, what have I done unto thee” (Sifrei Bamidbar 85).<br><br>כמתאננים — The term מתאננים denotes [people who seek] “a pretext” — they seek a pretext how to separate themselves from following the Omnipresent. Similarly is stated in the narrative of Samson, (Judges 14:4) “for he sought a pretext (תואנה) [against the Philistines]” (Sifrei Bamidbar 85).<br><br>רע באזני ה׳ means a pretext that was evil in the ears of the Lord, i.e., that they intended that it should reach His ears and that He might show annoyance. They said: “Woe unto us! How weary we have become on this journey: it is now three days that we have had no rest from the wearisomeness of the march!”<br><br>ויחר אפו AND HIS WRATH GLOWED — He said in anger: How ungrateful you are, “I meant it for your good — that you might immediately come into the land”.<br><br>בקצה המחנה [AND THE FIRE … DESTROYED THEM THAT WERE] IN THE EXTREMITY OF THE CAMP — i.e. those amongst them who were extreme in baseness — these were “the mixed multitude”. But R. Simeon the son of Manassia said: it means that the fire consumed the most distinguished and prominent ones among them (cf. Sifrei Bamidbar 85 and Rashi’s two explanations of ומקצה אחיו on Genesis 47:2)."}, {"ch": 11, "v": 2, "aliyah": 6, "heb": "וַיִּצְעַ֥ק הָעָ֖ם אֶל־מֹשֶׁ֑ה וַיִּתְפַּלֵּ֤ל מֹשֶׁה֙ אֶל־יְהֹוָ֔ה וַתִּשְׁקַ֖ע הָאֵֽשׁ׃", "onk": "וּצְוַח עַמָּא עַל משֶׁה וְצַלִּי משֶׁה קֳדָם יְיָ וְאִשְׁתַּקְּעַת אֶשָּׁתָא:", "onk_en": "The people cried out to Moshe, and Moshe prayed to Adonoy, and the fire subsided.", "pj": "וְצָוַח עַמָא עַל משֶׁה דְיִבְעֵי עֲלֵיהוֹן וְצַלֵי משֶׁה קֳדָם יְיָ וְאִשְׁתְּקָעַת אֵישָׁתָא בְּאַתְרָא", "pj_en": "And the people cried to Mosheh to pray for them; and Mosheh did pray before the Lord, and the fire was extinguished where it was.", "tj": "", "tj_en": "", "rashi": "<b>ויצעק העם אל משה.<\/b> מָשָׁל לְמֶלֶךְ בָּשָׂר וָדָם שֶׁכָּעַס עַל בְּנוֹ, וְהָלַךְ הַבֵּן אֵצֶל אוֹהֲבוֹ שֶׁל אָבִיו וְאָמַר לוֹ צֵא וּבַקֵּשׁ עָלַי מֵאַבָּא:<br><br><b>ותשקע האש.<\/b> שָׁקְעָה בִּמְקוֹמָהּ, שֶׁאִלּוּ חָזְרָה לְאַחַת הָרוּחוֹת הָיְתָה מְקַפֶּלֶת וְהוֹלֶכֶת כָּל אוֹתוֹ הָרוּחַ (ספרי):", "rashi_en": "ויצעק העם אל משה AND THE PEOPLE CRIED UNTO MOSES — A parable! This may be compared to the case of an earthly king who was angry with his son, and the son went to a friend of his father and said to him, “Go and ask forgiveness for me from father!” (Sifrei Bamidbar 86).<br><br>ותשקע האש THEN THE FIRE SANK — it sank on the very spot; because if it had turned along one of the sides of the camp it would gradually have rolled along the whole of that side (Sifrei Bamidbar 86)."}, {"ch": 11, "v": 3, "aliyah": 6, "heb": "וַיִּקְרָ֛א שֵֽׁם־הַמָּק֥וֹם הַה֖וּא תַּבְעֵרָ֑ה כִּֽי־בָעֲרָ֥ה בָ֖ם אֵ֥שׁ יְהֹוָֽה׃", "onk": "וּקְרָא שְׁמָא דְאַתְרָא הַהוּא דְּלֶקְתָּא אֲרֵי דְלֵקַת בְּהוֹן אֶשָּׁתָא מִן <b>קֳדָם<\/b> יְיָ:", "onk_en": "He called the name of that place Taveirah, for it was there that burned among them the fire of [<b>from before<\/b>] Adonoy.", "pj": "וּקְרָא שְׁמֵיהּ דְאַתְרָא הַהוּא דְלֵיקְתָּא אֲרוּם דְלֵיקַת בְּהוֹן אֵישָׁתָא מְצַלְהֲבָא מִן קֳדָם יְיָ", "pj_en": "And he called the name of that place Enkindlement, because the flaming fire had been enkindled there from before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 4, "aliyah": 6, "heb": "וְהָֽאסַפְסֻף֙ אֲשֶׁ֣ר בְּקִרְבּ֔וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַיָּשֻׁ֣בוּ וַיִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַיֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖נוּ בָּשָֽׂר׃", "onk": "וַעֲרַבְרְבִין דִּי בֵינֵיהוֹן <b>שְׁאִילוּ שְׁאֶלְתָּא<\/b> וְתָבוּ וּבְכוֹ אַף בְּנֵי יִשְׂרָאֵל וַאֲמָרוּ מַאן יֵיכְלִנָּנָא בִּסְרָא:", "onk_en": "The collection [of nationalities] among them began to have strong cravings [<b>make demands<\/b>], and Bnei Yisroel turned and began to weep; and they said “Who will feed us meat?", "pj": "וְגִיוֹרַיָא דְאִתְכְּנָשׁוּ בֵּינֵיהוֹן שְׁאִילוּ שְׁאֵילְתָּא וְתָבוּ וּבְכוּ בְּרַם בְּנֵי יִשְרָאֵל וְאָמְרוּ מַאן יֵיכְלִינָנָא בִּשְרָא", "pj_en": "And the strangers who had gathered together among them demanded with demand, and they turned and wept; and the sons of Israel said, Who will give us flesh to eat?", "tj": "", "tj_en": "", "rashi": "<b>והאספסף.<\/b> אֵלּוּ עֵרֶב רַב שֶׁנֶּאֶסְפוּ עֲלֵיהֶם בְּצֵאתָם מִמִּצְרַיִם:<br><br><b>וישבו גם בני ישראל ויבכו.<\/b> עִמָּהֶם:<br><br><b>מי יאכלנו בשר.<\/b> וְכִי לֹא הָיָה לָהֶם בָּשָׂר? וַהֲלֹא כְּבָר נֶאֱמַר \"וְגַם עֵרֶב רַב עָלָה אִתָּם וְצֹאן וּבָקָר\" וְגוֹ' (שמות י\"ב), וְאִ\"תֹּ אֲכָלוּם, וַהֲלֹא בִּכְנִיסָתָן לָאָרֶץ נֶאֱמַר \"וּמִקְנֶה רַב הָיָה לִבְנֵי רְאוּבֵן\" וְגוֹ' (במדבר ל\"ב)? אֶלָּא שֶׁמְּבַקְשִׁים עֲלִילָה (ספרי):", "rashi_en": "והאספסף AND THE THRONG — This was the mixed multitude that had gathered themselves unto them when they left Egypt (the word is from the root אסף, “to gather”) (Sifrei Bamidbar 86). — The next words of the Biblical text must be inverted to read as follows: <br><br>וישבו גם בני ישראל ויבכו AND THE CHILDREN OF ISRAEL ALSO AGAIN WEPT together with them.<br><br>מי יאכלנו בשר WHO SHALL GIVE US FLESH TO EAT? — But did they not have flesh? Has it not been already stated, (Exodus 12:38) “and a mixed multitude went up with them and flocks and herds, [even very much cattle]”?! If you say, “They had already eaten them”, then I reply, “But is it not stated at a later period, when they were about to enter the Land, (Numbers 32:1), “Now the children of Reuben had cattle in a very great multitude”? But the truth is that they were only seeking a pretext (Sifrei Bamidbar 86)."}, {"ch": 11, "v": 5, "aliyah": 6, "heb": "זָכַ֙רְנוּ֙ אֶת־הַדָּגָ֔ה אֲשֶׁר־נֹאכַ֥ל בְּמִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַקִּשֻּׁאִ֗ים וְאֵת֙ הָֽאֲבַטִּחִ֔ים וְאֶת־הֶחָצִ֥יר וְאֶת־הַבְּצָלִ֖ים וְאֶת־הַשּׁוּמִֽים׃", "onk": "דְּכִירִין אֲנַחְנָא יָת נוּנַיָּא דַּהֲוֵינָא אָכְלִין בְּמִצְרַיִם מַגָּן יָת בּוֹצִינַיָּא וְיָת אֲבַטִּיחַיָּא וּכְרָתֵי וּבוּצְלֵי וְתוּמֵי:", "onk_en": "We remember the fish which we ate in Egypt freely; the cucumbers, watermelons, leeks, onions and garlic.", "pj": "דְכִירִין אֲנַחְנָא יַת נוּנַיָא דַהֲוֵינָא אָכְלִין בְּמִצְרַיִם מַגָן בְּלָא תַפְקִידְתָּא יַת קַטְיָא וְיַת מְלַפְפוּנַיָא וְיַת קַפְלוּטַיָא וְיַת בָּצְלַיָא וְיַת תּוּמַיָא", "pj_en": "We remember the fish which we had to eat in Mizraim freely, without (being restricted by prohibitory) precept, the cucumbers and melons, the leeks, onions, and potherbs.", "tj": "מְדַכְרִין אֲנַחְנָא יַת נוּנַיָא דְהַוֵוינָן אָכְלִין בְּמִצְרַיִם מַגָן יַת קַטְיָא וְיַת מַלְפָנַיָא וְיַת כְּרַתְיָא וְיַת בָּצְלַיָא וְיַת תּוּמַיָא:", "tj_en": "We remember the fish that we ate freely in Mizraim, the cucumbers and melons, leeks, onions, and potherbs.", "rashi": "<b>אשר נאכל במצרים חנם.<\/b> אִ\"תֹּ שֶׁמִּצְרִיִּים נוֹתְנִים לָהֶם דָּגִים חִנָּם, וַהֲלֹא כְּבָר נֶאֱמַר \"וְתֶבֶן לֹא יִנָּתֵן לָכֶם\" (שמות ה'), אִם תֶּבֶן לֹא הָיוּ נוֹתְנִין לָהֶם חִנָּם, דָּגִים הָיוּ נוֹתְנִין לָהֶם חִנָּם? וּמַהוּ אוֹמֵר חִנָּם, חִנָּם מִן הַמִּצְוֹת (ספרי):<br><br><b>את הקשאים.<\/b> אָמַר רַבִּי שִׁמְעוֹן מִפְּנֵי מָה הַמָּן מִשְׁתַּנֶּה לְכָל דָּבָר חוּץ מֵאֵלּוּ? מִפְּנֵי שֶׁהֵן קָשִׁים לַמְּנִיקוֹת, אוֹמְרִים לְאִשָּׁה אַל תֹּאכְלִי שׁוּם וּבָצָל מִפְּנֵי הַתִּינוֹק, מָשָׁל לְמֶלֶךְ וְכוּ', כִּדְאִיתָא בְּסִפְרֵי:<br><br><b>הקשאים.<\/b> הֵם קוקומבר\"שׂ בְּלַעַז:<br><br><b>אבטיחים.<\/b> בודיק\"ש:<br><br><b>החציר.<\/b> כְּרֵישִׁין, פוריל\"ש (תַּרְגּוּמוֹ יָת בּוֹצִינַיָּא וְכוּ'):", "rashi_en": "אשר נאכל במצרים חנם [WE REMEMBER THE FISH] WHICH WE DID EAT IN EGYPT FOR NOTHING — If you say that they meant that the Egyptians gave them fish for nothing (without payment), then I ask, “But does it not state, (Exodus 5:18): [Go, therefore, now, and work], for there shall no straw be given you”? Now, if they did not give them straw for nothing, would they have given them fish for nothing! — What then is the force of the word חנם? It means: free from (i.e. without us having been burdened with) heavenly commands (Sifrei Bamidbar 87).<br><br>את הקשאים THE CUCUMBERS — R. Simeon said, “Why did the manna change its flavor into that of anything one wished (as the Midrash states) except into these vegetables here mentioned, the taste of which it appears not to have assumed since the people lusted for them? Because they are injurious to nursing mothers. So indeed people say to a woman: Do not eat garlic and onions on account of the baby. A parable! This may be compared to a king, etc. as it is related in the Sifrei Bamidbar 87.<br><br>הקשאים These are concombres in O. F., (English = cucumbers).<br><br>אבטיחים are boudekes in O. F. (English = melons).<br><br>החציר are leeks, porels in O. F. [The Targum renders the names of the vegetables by בוציניא etc.]."}, {"ch": 11, "v": 6, "aliyah": 6, "heb": "וְעַתָּ֛ה נַפְשֵׁ֥נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל־הַמָּ֥ן עֵינֵֽינוּ׃", "onk": "וּכְעַן נַפְשָׁנָא תָאִיבָא לֵית כָּל מִדָּעַם אֶלָּהֵן לְמַנָּא עֵינָנָא:", "onk_en": "Now our bodies are withered, there is nothing at all, but the manna before our eyes.”", "pj": "וּכְדוֹן נַפְשָׁנָא מְנַגְבָא לֵית כָּל מִדַעַם אֱלָהֵן לְמַנָא אֲנַן מִסְתַּכְיָין כְּמִסְכַּן דְמוֹדִיק מְגִיסָא מִיָדַיָא", "pj_en": "But now our life is dried up; there is not anything; we see only the manna, as the pauper who looks upon a morsel (bestowed) by the hands.", "tj": "", "tj_en": "", "rashi": "<b>אל המן עינינו.<\/b> מָן בַּשַּׁחַר, מָן בָּעֶרֶב:", "rashi_en": "אל המן עינינו OUR EYES ARE ON THIS MANNA (i. e. we see nothing but this manna) — “manna in the morning, manna in the evening!” (Sifrei Bamidbar 87) "}, {"ch": 11, "v": 7, "aliyah": 6, "heb": "וְהַמָּ֕ן כִּזְרַע־גַּ֖ד ה֑וּא וְעֵינ֖וֹ כְּעֵ֥ין הַבְּדֹֽלַח׃", "onk": "וּמַנָּא כְּבַר זְרַע גַּדָּא הוּא וְחֶזְוֵיהּ כְּחֵזוּ בְדֹלְחָא:", "onk_en": "The manna was like coriander seed and it is similiar to the appearance of crystal.", "pj": "חֲבַל עַל עַמָא דְמֵיכְלֵיהוֹן לְחֵים שְׁמַיָא וּמִתְרַעֲמִין דְמַנָא דְמוּיֵהּ כִּזְרַע כּוּסְבַּר חֲזוֹר כַּד נָחִית מִן שְׁמַיָא וְכַד הֲוָה קַדִישׁ חֵיזְוֵיהּ הֵי כְּחֵיזוּ בִּידַלְחָא", "pj_en": "Alas for the people whose food is bread from the heavens! And so murmured they, because the manna was like coriander-seed, round, when it came down from the heavens, and when it had been sanctified its appearance was as the likeness of Bedilcha.", "tj": "", "tj_en": "", "rashi": "<b>והמן כזרע גד.<\/b> מִי שֶׁאָמַר זֶה לֹא אָמַר זֶה, יִשְֹרָאֵל אוֹמְרִים \"בִּלְתִּי אֶל הַמָּן עֵינֵינוּ\" וְהַקָּבָּ\"ה הִכְתִּיב בַּתּוֹרָה \"וְהַמָּן כִּזְרַע גַּד\" וְגוֹ', כְּלוֹמַר רְאוּ בָּאֵי עוֹלָם עַל מָה מִתְלוֹנְנִים בָּנַי, וְהַמָּן כָּךְ וְכָךְ הוּא חָשׁוּב:<br><br><b>כזרע גד.<\/b> עָגֹל כְּגִידָּא — זֶרַע קוליינדר\"ו:<br><br><b>הבדלח.<\/b> שֵׁם אֶבֶן טוֹבָה קריסט\"ל:", "rashi_en": "והמן כזרע גד AND THE MANNA WAS AS CORIANDER SEED — He who said that (the previous verse) did not say this: Israel said, “our eyes are only on this manna”, but the Holy One, blessed be He had it written in the Torah, and the manna was like coriander seed” — as much as to say “See, ye people of the world, about what My sons were complaining, whilst as a matter of fact the manna is excellent in so many different ways!” (Sifrei Bamidbar 88).<br><br>כזרע גד i.e. it was round like גד, coriander-seed in O. F. <br><br>הבדלח is the name of a precious stone. BEDELLIUM. (Some editions add the O. F. קרישטל crystal)."}, {"ch": 11, "v": 8, "aliyah": 6, "heb": "שָׁ֩טוּ֩ הָעָ֨ם וְלָֽקְט֜וּ וְטָחֲנ֣וּ בָרֵחַ֗יִם א֤וֹ דָכוּ֙ בַּמְּדֹכָ֔ה וּבִשְּׁלוּ֙ בַּפָּר֔וּר וְעָשׂ֥וּ אֹת֖וֹ עֻג֑וֹת וְהָיָ֣ה טַעְמ֔וֹ כְּטַ֖עַם לְשַׁ֥ד הַשָּֽׁמֶן׃", "onk": "שַׁיְטִין עַמָּא וְלָקְטִין <b>דְּצָבֵי<\/b> טָחִין בְּרֵיחַיָּא אוֹ <b>דְצָבֵי<\/b> דָאִיךְ בַּמְּדֻכְתָּא וּמְבַשְּׁלִין לֵיהּ בְּקִדְרָא וְעָבְדִין יָתֵיהּ גְּרִיצָן וַהֲוָה טַעֲמֵיהּ כִּטְעֵם דְּלִישׁ בְּמִשְׁחָא:", "onk_en": "The people [merely] strolled about and they gathered it and [<b>if they so desired,<\/b>] they ground it with a millstone or [<b>if they so desired,<\/b>] crushed it in mortars and cooked it in pots and made cakes out of it. Its taste was like the taste of cake kneaded with oil.", "pj": "חַפְסִין רַשִׁיעֵי עַמָא וּמְלַקְטִין וְטַחְנִין בְּרֵיחוּתָא וּמַן דַהֲוָה צָבֵי הֲוָה שָׁחֵיק בְּדִיכוּתָא וּמְבַשְׁלִין לֵיהּ בְּלָאפוּסְיָא וְעַבְדִין מִנֵיהּ חֲרָרָן וְהַוֵי טַעֲמֵיהּ כְטַעַם בִּיזָא דִמְסַרְבְּלָא בְּשׁוּמְנָא", "pj_en": "And the wicked people looked about, and collected, and ground it in the mill. But he who would, bruised it in the mortar, or dressed it in the pot, or made cakes of it; and the taste of it was like the taste of cream covered with oil.", "tj": "הֲוַיַן שַׁיְיטִין עַמָא וּמְלַקְטִין וְטַחֲנִין בְּרַחֲוָותָא אוֹ אֲדַשִׁין יָתָהּ בִּמְזוֹכָתָא וְיֶהֱוְיַן מְבַשְׁלִין יָתָהּ בְּלַפֶּדְיָא וְעַבְדִין יָתָהּ עוּגִין וַהֲוָה טַעֲמֵיהּ כְּטַעַם בְּשִׁשְׁיָן בִּדְבָשׁ:", "tj_en": "And the people were scattered abroad, and collected and ground it in mills, or crushed it in the mortar, or dressed it in the pan, and made cakes of it. And the taste of it was like the taste of pastry with honey.", "rashi": "<b>שטו.<\/b> אֵין שִׁיּוּט אֶלָּא לְשׁוֹן טִיּוּל, אישבנ\"ייר — בְּלֹא עָמָל:<br><br><b>וטחנו ברחים וגו'.<\/b> לֹא יָרַד בָּרֵחַיִם וְלֹא בַקְּדֵרָה וְלֹא בַמְּדוֹכָה, אֶלָּא מִשְׁתַּנֶּה הָיָה טַעֲמוֹ לַנִּטְחָנִין וְלַנְּדוֹכִין וְלַמְבֻשָּׁלִין (ספרי):<br><br><b>בפרור.<\/b> קְדֵרָה:<br><br><b>לשד השמן.<\/b> לִחְלוּחַ שֶׁל שֶׁמֶן, כָּךְ פֵּרְשׁוֹ דּוּנָשׁ, וְדוֹמֶה לוֹ \"נֶהְפַּךְ לְשַׁדִּי בְּחַרְבֹנֵי קַיִץ\" (תהילים ל\"ב), וְהַלָּמֶ\"ד יְסוֹד, — נֶהְפַּךְ לִחְלוּחִי בְּחַרְבוֹנֵי קַיִץ. וְרַבּוֹתֵינוּ פֵרְשׁוּהוּ לְשׁוֹן שָׁדַיִם, אַךְ אֵין עִנְיַן שָׁדַיִם אֵצֶל שֶׁמֶן; וְאִאֶ\"ל לְשַׁד הַשָּׁמֶן לְשׁוֹן \"וַיִּשְׁמַן יְשֻׁרוּן\" (דברים ל\"ב), שֶׁאִם כֵּן הָיָה הַמֵּ\"ם נָקוּד קָמָץ וְטַעְמוֹ לְמַטָּה תַּחַת הַמֵּ\"ם, עַכְשָׁו שֶׁהַמֵּ\"ם נָקוּד פַּתָּח קָטָן וְהַטַּעַם תַּחַת הַשִּׁי\"ן, לְשׁוֹן שֶׁמֶן הוּא, וְהַשִּׁ\"ין הַנְּקוּדָה בְּקָמָץ גָּדוֹל וְאֵינָהּ נְקוּדָה בְּפַתָּח קָטָן מִפְּנֵי שֶׁהוּא סוֹף פָּסוּק. דָּ\"אַ: לְשַׁד לְשׁוֹן נוֹטָרִיקוֹן — לִישׁ שֶׁמֶן דְּבַשׁ, כְּעִסָּה הַנִּלּוֹשָׁה בְּשֶׁמֶן וּקְטוּפָה בִדְבַשׁ. וְתַרְגּוּם שֶׁל אֻנְקְלוֹס דִּמְתַרְגֵּם \"דְּלִישׁ בְּמִשְׁחָא\" נוֹטֶה לְפִתְרוֹנוֹ שֶׁל דּוּנָשׁ, שֶׁהָעִסָּה הַנִּלּוֹשָׁה בְשֶׁמֶן לַחְלוּחִית שֶׁמֶן יֵשׁ בָּהּ:", "rashi_en": "שטו [AND THE PEOPLE] WENT ABOUT — The term שיוט (i. e. any form of the root שוט) denotes strolling about; esbanoyer in O. F., English to walk about leisurely — they got the manna without exertion (cf. however, Yoma 75a and thereon s. v. ירד המן עליו). <br><br>וטחנו ברחים וגו׳ AND THE PEOPLE GROUND IT WITH MILL STONES [OR POUNDED IT IN THE MORTAR, AND BAKED IT IN PANS] — As a matter of fact it (the manna) never went into a mill, nor a pot, nor a mortar, but its taste changed, according to one’s desire, into that of ground or pounded or cooked grain (Sifrei Bamidbar 89).<br><br>בפרור — means [IN] A POT. <br><br>לשד השמן [AND ITS TASTE WAS AS THE TASTE OF] — לשד השמן i. e. moisture of oil. Thus did Dunash ibn Labrat explain it. Similar to it is, (Psalms 32:4) נהפך לשדי בחרבוני קיץ, where the ל in the word לשד is a root-letter, the meaning being: “my sap (לשדי) is turned by the drought of summer”. Our Rabbis (Sifrei Bamidbar 89) explained it as meaning “breasts’ (i. e. just as the suckling imbibes, so to speak, every possible flavor with the mother-milk. so the Israelites found all flavors in the manna; cf. Sifrei), but really the subject of “breasts” has nothing to do with oil. One cannot, however, in order to justify the explanation of our Rabbis say that השמן in לשד השמן has a meaning similar to (Deuteronomy 32:15) וישמן ישורון, “But Jeshurun waxed fat (וישמן)” (when the meaning would be: “And the taste of it was similar to that of a fat breast”), for then the מ ought to be punctuated with Kametz (our Tséré: הַשָּׁמֵן) and the accent ought to be on the last syllable, beneath the מ. Now, however, that the מ is punctuated with Patach Katon (our Segol) and the accent is on the ש, it can only have a sense connected with שמן “oil”. As to the ש which is punctuated with Kametz Gadol (שָׁמן) and not with Segol (since the noun “oil” is שֶׁמן,) this is so because the word is at the end of the verse (and in the pausal form שֶׁמֶן becomes שָׁמֶן).   — Another explanation is that לשד is an acrostic of ליש, “kneading”, שמן “oil”, דבש “honey”, i. e. that the manna was like “dough kneaded with oil, and smeared with honey” (קטף literally means “to tear”, and when used of dough it means “to tear a lump of dough into pieces for which purpose the kneader moistens his hands with some liquid; here with honey) (Sifrei Bamidbar 89). The rendering of Onkelos who translates the phrase by דליש במשחא, “[as the taste] of dough with oil”, inclines to the meaning given by Dunash, because dough which is kneaded with oil has in it some moisture of oil."}, {"ch": 11, "v": 9, "aliyah": 6, "heb": "וּבְרֶ֧דֶת הַטַּ֛ל עַל־הַֽמַּחֲנֶ֖ה לָ֑יְלָה יֵרֵ֥ד הַמָּ֖ן עָלָֽיו׃", "onk": "וְכַד נָחֵית טַלָּא עַל מַשְׁרִיתָא לֵילְיָא נָחֵית מַנָּא עֲלוֹהִי:", "onk_en": "When the dew would descend on the camp, at night, the manna would descend on it.", "pj": "וְכַד נָחִית טַלָא עַל מַשִׁרְיָיתָא בְּלֵילְיָא הֲוָה נָחִית מַנָא עֲלוֹי", "pj_en": "And when the dew came down on the camp by night, the manna descended upon it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 10, "aliyah": 6, "heb": "וַיִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת־הָעָ֗ם בֹּכֶה֙ לְמִשְׁפְּחֹתָ֔יו אִ֖ישׁ לְפֶ֣תַח אׇהֳל֑וֹ וַיִּֽחַר־אַ֤ף יְהֹוָה֙ מְאֹ֔ד וּבְעֵינֵ֥י מֹשֶׁ֖ה רָֽע׃", "onk": "וּשְׁמַע משֶׁה יָת עַמָּא בָּכַן לְזַרְעֲיַתְהוֹן גְּבַר בִּתְרַע מַשְׁכְּנֵיהּ וּתְקֵף רָגְזָא דַיְיָ לַחֲדָא וּבְעֵינֵי משֶׁה בִּישׁ:", "onk_en": "Moshe heard the people weep according to their families, at the door of each one’s tent. The Anger of Adonoy was greatly aroused and in Moshe’s eyes, it was evil.", "pj": "וּשְׁמַע משֶׁה יַת עַמָא בָּכֵי עַל קְרֵיבְתָּא דְמִתְאַסְרָן לְהוֹן גְבַר לִתְרַע מַשְׁכְּנֵיהּ וּתְקֵיף רוּגְזָא דַיְיָ לַחֲדָא וּבְעֵינֵי משֶׁה בִּישׁ", "pj_en": "And Mosheh heard the people lamenting with their neighbours, who had gathered every man at the gate of his tent and the displeasure of the Lord was strongly moved, and in the eyes of Mosheh it was evil;", "tj": "", "tj_en": "", "rashi": "<b>בכה למשפחתיו.<\/b> מִשְׁפָּחוֹת מִשְׁפָּחוֹת נֶאֱסָפִים וּבוֹכִים לְפַרְסֵם תַּרְעֻמְתָּן בְּגָלוּי. וְרַבּוֹתֵינוּ אָמְרוּ (יומא ע\"ה) לְמִשְׁפְּחֹתָיו, עַל עִסְקֵי מִשְׁפָּחוֹת —עַל עֲרָיוֹת הַנֶּאֱסָרוֹת לָהֶם:", "rashi_en": "בכה למשפחתיו [THEN MOSES HEARD THE PEOPLE] WEEP THROUGHOUT THEIR FAMILIES — i.e. the members of each family gathered together and wept in order to display their discontent in public. Our Rabbis, however, said that למשפחתיו means “the people wept because of family affairs” — because of the intermarriage of blood-relaltives that had been forbidden to them (Sifrei Bamidbar 90; Yoma 75a)."}, {"ch": 11, "v": 11, "aliyah": 6, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶל־יְהֹוָ֗ה לָמָ֤ה הֲרֵעֹ֙תָ֙ לְעַבְדֶּ֔ךָ וְלָ֛מָּה לֹא־מָצָ֥תִי חֵ֖ן בְּעֵינֶ֑יךָ לָשׂ֗וּם אֶת־מַשָּׂ֛א כׇּל־הָעָ֥ם הַזֶּ֖ה עָלָֽי׃", "onk": "וַאֲמַר משֶׁה קֳדָם יְיָ לְמָא אַבְאֶשְׁתָּא לְעַבְדָּךְ וּלְמָא לָא אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ לְשַׁוָּאָה יָת מְטוּל כָּל עַמָּא הָדֵין עָלָי:", "onk_en": "Moshe said to Adonoy: “Why have you dealt poorly with Your servant, and why have I not found favor in Your eyes that You place the burden of the entire people upon me?", "pj": "וַאֲמַר משֶׁה קֳדָם יְיָ לְמָא אַבְאֶשְׁתָּא לְעַבְדָךְ וּלְמָא לָא אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ לְשַׁוָאָה יַת טַרְחָא דְעַמָא הָדֵין עָלָי", "pj_en": "and Mosheh said before the Lord, Why hast Thou done ill with Thy servant, or I have not found mercy before Thee, that Thou shouldst have laid the toil of this people upon me?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 12, "aliyah": 6, "heb": "הֶאָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כׇּל־הָעָ֣ם הַזֶּ֔ה אִם־אָנֹכִ֖י יְלִדְתִּ֑יהוּ כִּֽי־תֹאמַ֨ר אֵלַ֜י שָׂאֵ֣הוּ בְחֵיקֶ֗ךָ כַּאֲשֶׁ֨ר יִשָּׂ֤א הָאֹמֵן֙ אֶת־הַיֹּנֵ֔ק עַ֚ל הָֽאֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַאֲבֹתָֽיו׃", "onk": "<b>הֲאַב אֲנָא<\/b> לְכָל עַמָּא הָדֵין אִם <b>בְּנַי אִנּוּן<\/b> דְּאָמְרֵת לִי סוֹבַרְהִי <b>בְּתָקְפָּךְ<\/b> כְּמָא דִמְסוֹבַר תֻּרְבְּיָנָא יָת יַנְקָא עַל אַרְעָא דִּי קַיֶּמְתָּא לַאֲבָהָתוֹהִי:", "onk_en": "Have I conceived [<b>am I a father to<\/b>] this entire people? have I given birth to it [<b>are they my children<\/b>] that You say to me, carry it [<b>with might<\/b>] in your lap as a nurse carries an infant, to the land which You swore to their forefathers?", "pj": "הָאֲנָא עַבְרִית וְחַשְׁחָשִׁית בִּמְעַיַי יַת כָּל עַמָא הָדֵין אִין בָּנַיי הִינוּן דְאַמַרְתְּ לִי בְּמִצְרַיִם טָעוֹן טוּרְחַנְהוֹן בְּחֵילָךְ הֵיכְמָא דְטָעַן פַּדְגוֹגָא לִמְיַנִיקָא עַד זְמַן דְיִמְטוּן לְאַרְעָא דִקְיֵימְתָּא לְאַבְהַתְהוֹן", "pj_en": "Have I made or borne all this people as from the womb? are they my children, that Thou saidst to me in Mizraim, Bear the toil of them with thy strength, as the instructor of youth beareth, until they be carried into the land which Thou hast sworn unto their fathers?", "tj": "הַאֲנָא עֲבָרִית יַת כָּל עַמָא הָאִילֵן אִין אֲנָא יְלֵידַת יַתְהוֹן אֲרוּם תֵּימַר לִי סְבוֹל יַתְהוֹן בְּחוֹבָךְ הֵיךְ מַה דִסְבַל פַּדְגוֹגָא יַת מְיַנוֹקָא עַל אַרְעָא דְקַיֵימְתָּא לְאַבְהָתוֹי:", "tj_en": "Have I made all this people, have I begotten them, that Thou hast said to me, Carry them in thy bosom, as the nurse carrieth the sucklings, unto the land which thou didst swear unto their fathers?", "rashi": "<b>כי תאמר אלי.<\/b> שֶׁאַתָּה אוֹמֵר אֵלַי שָׂאֵהוּ בְחֵיקֶךָ; וְהֵיכָן אָמַר לוֹ כֵן? \"לֵךְ נְחֵה אֶת הָעָם\" (שמות ל\"ב), וְאוֹמֵר \"וַיְצַוֵּם אֶל בְּנֵי יִשְׂרָאֵל\" (שם ו') — עַל מְנָת שֶׁיִּהְיוּ סוֹקְלִים אֶתְכֶם וּמְחָרְפִים אֶתְכֶם (ספרי):<br><br><b>על האדמה אשר נשבעת לאבתיו.<\/b> אַתָּה אוֹמֵר לִי לְשֵׂאתָם בְּחֵיקִי:", "rashi_en": "כי תאמר אלי means, [HAVE I CONCEIVED ALL THIS PEOPLE] THAT THOU SHOULDST always SAY UNTO ME, “Carry them in thy bosom!?” And where did He speak thus to him? When He said to him, (Exodus 32:34) “Go, lead the people”; and it further states, (Exodus 6:13) “[And the Lord spoke unto Moses and unto Aaron] and gave them a charge concerning the children of Israel” saying unto them: “Take charge of them even under the risk (lit., under the condition) that they may stone you or at least insult you” (Sifrei Bamidbar 91; cf. Rashi on that verse).<br><br>על האדמה אשר נשבעת לאבתיו UNTO THE LAND WHICH THOU SWAREST UNTO THEIR FATHERS hast Thou bidden me to carry them in my bosom. "}, {"ch": 11, "v": 13, "aliyah": 6, "heb": "מֵאַ֤יִן לִי֙ בָּשָׂ֔ר לָתֵ֖ת לְכׇל־הָעָ֣ם הַזֶּ֑ה כִּֽי־יִבְכּ֤וּ עָלַי֙ לֵאמֹ֔ר תְּנָה־לָּ֥נוּ בָשָׂ֖ר וְנֹאכֵֽלָה׃", "onk": "מְנַן לִי בִּסְרָא לְמֵיהַב לְכָל עַמָּא הָדֵין אֲרֵי בָּכַן עָלַי לְמֵימַר הַב לָנָא בִסְרָא וְנֵיכוּל:", "onk_en": "From where do I have meat to give to this entire people on account of which they cry to me, saying: “Give us meat and we shall eat.”", "pj": "מִינָן לִי בִּשְרָא לְמִתַּן לְכָל עַמָא הָדֵין אֲרוּם בָּכַן עָלַי לְמֵימָר הַב לָנָא בִּשְרָא וְנֵיכוּל", "pj_en": "Whence am I to find meat to give all this people? for they are cry crying to me, say saying Give us flesh that we may eat.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 14, "aliyah": 6, "heb": "לֹֽא־אוּכַ֤ל אָנֹכִי֙ לְבַדִּ֔י לָשֵׂ֖את אֶת־כׇּל־הָעָ֣ם הַזֶּ֑ה כִּ֥י כָבֵ֖ד מִמֶּֽנִּי׃", "onk": "לֵית אֲנָא יָכִיל בִּלְחוֹדִי לְסוֹבָרָא יָת כָּל עַמָּא הָדֵין אֲרֵי יַקִּיר מִנִּי:", "onk_en": "I alone can not carry this entire people, for they are too burdensome for me.", "pj": "לֵית אֲנָא יָכִיל בִּלְחוֹדִי לְמִיטְעַן לְכָל עַמָא הָדֵין אֲרוּם יַקִיר הוּא מִינִי", "pj_en": "I am not able to bear all this people, for it is too weighty for me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 15, "aliyah": 6, "heb": "וְאִם־כָּ֣כָה&thinsp;<b>׀<\/b> אַתְּ־עֹ֣שֶׂה לִּ֗י הׇרְגֵ֤נִי נָא֙ הָרֹ֔ג אִם־מָצָ֥אתִי חֵ֖ן בְּעֵינֶ֑יךָ וְאַל־אֶרְאֶ֖ה בְּרָעָתִֽי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִם כְּדֵין אַתְּ עָבֵד לִי קְטָלְנִי כְעַן קְטוֹל אִם אַשְׁכָּחִית רַחֲמִין <b>קֳדָמָךְ<\/b> וְלָא אֶחֱזֵי בְּבִישְׁתִּי:", "onk_en": "If this is the way You treat me, please kill me, if I have found favor in Your eyes [<b>before You<\/b>]; so that I will not see my evil.”", "pj": "וְאִין כִּדְנַן אַנְתְּ עָבִיד לִי דְתִשְׁבּוֹק כָּל טַרְחֵיהוֹן עָלַי קְטוֹלְנִי כְּדוֹן בְּמִיתוּתָא דְנַיְיחִין בָּהּ צַדִיקַיָיא אִין אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ וְלָא אֶחֱמֵי בְּבִישׁוּתִי", "pj_en": "But if Thou do this with me, to leave all the labour of them upon me, let me now die with the death in which the just have repose, if I have found mercy before Thee, that I may not see mine evil.", "tj": "וְלָא אֵיחֲמֵי בְּבִישַׁתְהוֹן דְעַמָךְ:", "tj_en": "That I may not see the evil of them who are Thy people.", "rashi": "<b>ואם ככה את עושה לי.<\/b> תָּשַׁשׁ כֹּחוֹ שֶׁל מֹשֶׁה כִּנְקֵבָה כְּשֶׁהֶרְאָהוּ הַקָּבָּ\"ה הַפֻּרְעָנוּת שֶׁהוּא עָתִיד לְהָבִיא עֲלֵיהֶם עַל זֹאת, אָמַר לְפָנָיו, אִם כֵּן, הָרְגֵנִי תְּחִלָּה:<br><br><b>ואל אראה ברעתי.<\/b> בְּרָעָתָם הָיָה לוֹ לִכְתֹּב, אֶלָּא שֶׁכִּנָּה הַכָּתוּב, וְזֶה אֶחָד מִתִּקּוּנֵי סוֹפְרִים בַּתּוֹרָה לְכִנּוּי וּלְתִקּוּן לָשׁוֹן:", "rashi_en": "  ואם ככה את עשה לי AND IF THOU DO THUS WITH ME [KILL ME, I PRAY THEE …] — The Hebrew word for “Thou” appears in the feminine form את instead of the masculine אתה to intimate that Moses’ strength grew weak as that of a woman when the Holy one, blessed be He, showed him the punishment which He was to bring in future upon them for this (for their sin). He, (Moses) therefore, said before Him, “If so, kill me first” (Sifrei Bamidbar 91).<br><br>ואל אראה ברעתי AND LET ME NOT SEE MY EVIL — It ought to have written (according to the Midrashic explanation above) “and let me not see their evil”, only that Scripture modified the expression (i.e. it used a euphemistic expression referring the evil to himself instead of to the whole people). This is one of the variations occurring in the Torah such as writers make for the purpose of modifying and improving the phrase (cf. Rashi on Genesis 18:22 and Midrash Tanchuma, Beshalach 16)."}, {"ch": 11, "v": 16, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה אֶסְפָה־לִּ֞י שִׁבְעִ֣ים אִישׁ֮ מִזִּקְנֵ֣י יִשְׂרָאֵל֒ אֲשֶׁ֣ר יָדַ֔עְתָּ כִּי־הֵ֛ם זִקְנֵ֥י הָעָ֖ם וְשֹׁטְרָ֑יו וְלָקַחְתָּ֤ אֹתָם֙ אֶל־אֹ֣הֶל מוֹעֵ֔ד וְהִֽתְיַצְּב֥וּ שָׁ֖ם עִמָּֽךְ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה כְּנוֹשׁ <b>קֳדָמַי<\/b> שַׁבְעִין גַּבְרָא מִסָּבֵי יִשְׂרָאֵל דִּי יְדַעַתְּ אֲרֵי אִנּוּן סָבֵי עַמָּא וְסַרְכוֹהִי וּתְדַבַּר יָתְהוֹן לְמַשְׁכַּן זִמְנָא וְיִתְעַתְּדוּן תַּמָּן עִמָּךְ:", "onk_en": "Adonoy said to Moshe: “Gather seventy men for [<b>before<\/b>] Me, from among the elders of Israel, [men] whom you know to be the people’s elders, and its officers, and you shall t
