בָכִין תְּהֵי בֵּינָן וּבֵינָךְ וְנִגְזוֹר קְיָם עִמָךְ", "pj_en": "And they answered, Seeing, we have seen, that the Word of the Lord is for thy help, and for thy righteousness' sake all good hath been to us; but when thou wentest forth from our land the wells dried up, and our trees made no fruit; then we said, We will cause him to return to us. And now let there be an oath established between us, and kindness between us and thee, and we will enter into a covenant with thee,", "tj": "", "tj_en": "", "rashi": "<b>ראו ראינו.<\/b> רָאִינוּ בְאָבִיךָ, רָאִינוּ בְךָ:<br><br><b>תהי נא אלה בינותינו וגו'.<\/b> הָאָלָה אֲשֶׁר בֵּינוֹתֵינוּ מִימֵי אָבִיךָ תְּהִי גַּם עַתָּה <b>בינינו וביניך<\/b>:", "rashi_en": "ראו ראינו WE SAW PLAINLY (literally, seeing we have seen) — We saw it in the case of your father and we see it in the case of yourself (Genesis Rabbah 64:10).<br><br>‘תהי נא אלה בינותינו וגו means LET THE OATH that has existed BETWEEN US since the days of your father CONTINUE NOW BETWEEN US AND YOU. "}, {"ch": 26, "v": 29, "aliyah": 4, "heb": "אִם־תַּעֲשֵׂ֨ה עִמָּ֜נוּ רָעָ֗ה כַּאֲשֶׁר֙ לֹ֣א נְגַֽעֲנ֔וּךָ וְכַאֲשֶׁ֨ר עָשִׂ֤ינוּ עִמְּךָ֙ רַק־ט֔וֹב וַנְּשַׁלֵּֽחֲךָ֖ בְּשָׁל֑וֹם אַתָּ֥ה עַתָּ֖ה בְּר֥וּךְ יְהֹוָֽה׃", "onk": "אִם תַּעְבֵּד עִמָּנָא בִּישָׁא כְּמָא דִּי לָא <b>אַנְזִיקְנָךְ<\/b> וּכְמָא דִי עֲבַדְנָא עִמָּךְ לְחוֹד טַב וַנְּשַׁלְּחִנָּךְ בִּשְׁלָם אַתְּ כְּעַן בְּרִיכָא דַיְיָ:", "onk_en": "that you will do us no harm, just as we did not touch [<b>injure<\/b>] you. We did nothing but good to you, and sent you away in peace. You are now the blessed one of Adonoy.", "pj": "אִם תַּעֲבֵיד עִמָנָא בִּישָׁא הֵיכְמָא דְלָא קְרִיבְנָא בָּךְ לְבִישׁ וְהֵיכְמָא דְעָבַדְנָא עִמָךְ לְחוֹד טַב וְשִׁילַחֲנָךְ פּוֹן בִּשְׁלָם אַנְתְּ כְּדוֹן בְּרִיכָה דַיְיָ", "pj_en": "lest thou do us evil. Forasmuch as we have not come nigh thee for evil, and as we have acted with thee only for good, and have indeed sent thee away in peace; thou art now blessed of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לא נגענוך.<\/b> כְּשֶׁאָמַרְנוּ לֵךְ לְךָ מֵעִמָּנוּ:<br><br><b>אתה.<\/b> גַּם אַתָּה עֲשֵׂה לָנוּ כְּמוֹ כֵן:", "rashi_en": "לא נגענוך WE HAVE NOT TOUCHED THEE when we said to you “Go from us”.<br><br>אתה THOU — thou, also, do with us in a like manner. "}, {"ch": 26, "v": 30, "aliyah": 5, "heb": "וַיַּ֤עַשׂ לָהֶם֙ מִשְׁתֶּ֔ה וַיֹּאכְל֖וּ וַיִּשְׁתּֽוּ׃", "onk": "וַעֲבַד לְהוֹן מִשְׁתְּיָא וַאֲכָלוּ וּשְׁתִיאוּ:", "onk_en": "He [Yitzchok] made a feast for them, and they ate and drank.", "pj": "וַעֲבַד לְהוֹן מִשְׁתַּיָא וַאֲכָלוּ וּשְׁתִיאוּ", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 31, "aliyah": 5, "heb": "וַיַּשְׁכִּ֣ימוּ בַבֹּ֔קֶר וַיִּשָּׁבְע֖וּ אִ֣ישׁ לְאָחִ֑יו וַיְשַׁלְּחֵ֣ם יִצְחָ֔ק וַיֵּלְכ֥וּ מֵאִתּ֖וֹ בְּשָׁלֽוֹם׃", "onk": "וְאַקְדִּימוּ בְצַפְרָא וְקַיִּימוּ גְּבַר לְאָחוּהִי וְשַׁלָּחִנּוּן יִצְחָק וַאֲזָלוּ מִלְּוָתֵיהּ בִּשְׁלָם:", "onk_en": "They got up early in the morning, and they each swore to the other. Yitzchok sent them away and they left in peace.", "pj": "וְאַקְדִימוּ בְּצַפְרָא וְקַיְמוּ גְבַר לְאָחוֹי וּפְסַג מַתְגָא דְחַמְרֵיהּ וִיהַב פִּסְגָא חָדָא לְהוֹם לְסַהֲדוּ וְצַלֵי עֲלֵיהֶם יִצְחָק וְאִתְרַוָוחוּ וְאַלְוִנוּן יִצְחָק וַאֲזָלוּ מִלְוָותֵיהּ בִּשְׁלָם", "pj_en": "And they arose in the morning, each man with his brother; and he broke off from the bridle of his ass, and gave one part to them for a testimony. And Izhak prayed for them, and they were enlarged. And Izhak accompanied them, and they went from him in peace.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 32, "aliyah": 5, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> בַּיּ֣וֹם הַה֗וּא וַיָּבֹ֙אוּ֙ עַבְדֵ֣י יִצְחָ֔ק וַיַּגִּ֣דוּ ל֔וֹ עַל־אֹד֥וֹת הַבְּאֵ֖ר אֲשֶׁ֣ר חָפָ֑רוּ וַיֹּ֥אמְרוּ ל֖וֹ מָצָ֥אנוּ מָֽיִם׃", "onk": "וַהֲוָה בְּיוֹמָא הַהוּא וַאֲתוֹ עַבְדֵי יִצְחָק וְחַוִּיאוּ לֵיהּ עַל עֵיסַק בֵּירָא דִּי חֲפָרוּ וַאֲמָרוּ לֵיהּ אַשְׁכַּחְנָא מַיָּא:", "onk_en": "On that day Yitzchok’s servants came and told him about the well they had dug; and they said to him, We have found water.", "pj": "וַהֲוָה בְּיוֹמָא הַהוּא וְאָתוֹ עַבְדֵי יִצְחָק וְתָנוּ לֵיהּ עַל עֵיסַק בֵּירָא דְחָפָסוּ וְאָמְרוּ לֵיהּ אַשְׁכַּחְנָא מוֹי", "pj_en": "And on that day the servants of Izhak came and told him concerning the well they had digged, and said to him, We have found water;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 33, "aliyah": 5, "heb": "וַיִּקְרָ֥א אֹתָ֖הּ שִׁבְעָ֑ה עַל־כֵּ֤ן שֵׁם־הָעִיר֙ בְּאֵ֣ר שֶׁ֔בַע עַ֖ד הַיּ֥וֹם הַזֶּֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּקְרָא יָתַהּ שִׁבְעָה עַל כֵּן שְׁמָא דְקַרְתָּא בֵּארָא דְשֶׁבַע (<small>נ\"א<\/small> בְּאֵר שֶׁבַע) עַד יוֹמָא הָדֵין:", "onk_en": "He named it Shiva. Therefore the city is called Beer Sheva until this very day.", "pj": "וּקְרָא יָתֵיהּ שִׁבְעָה בְּגִין כֵּן שְׁמָא דְקַרְתָּא בֵּיר שֶבַע עַד יוֹמָא הָּדֵין", "pj_en": "and he called it Sheba (the Swearing); therefore the name of the city is Beersheba unto this day.", "tj": "", "tj_en": "", "rashi": "<b>שבעה.<\/b> עַל שֵׁם הַבְּרִית:", "rashi_en": "שבעה [AND HE CALLED IT] SHIBAH (swearing), in allusion to the Covenant (cf. v.31; “And they swear” etc.)."}, {"ch": 26, "v": 34, "aliyah": 5, "heb": "וַיְהִ֤י עֵשָׂו֙ בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה וַיִּקַּ֤ח אִשָּׁה֙ אֶת־יְהוּדִ֔ית בַּת־בְּאֵרִ֖י הַֽחִתִּ֑י וְאֶת־בָּ֣שְׂמַ֔ת בַּת־אֵילֹ֖ן הַֽחִתִּֽי׃", "onk": "וַהֲוָה עֵשָׂו בַּר אַרְבְּעִין שְׁנִין וּנְסִיב אִתְּתָא יָת יְהוּדִית בַּת בְּאֵרִי חִתָּאָה וְיָת בָּשְׂמָת בַּת אֵילוֹן חִתָּאָה:", "onk_en": "Eisov was forty years old and he married Yehudis, the daughter of Be’eri, the Chittite and Bosmas, the daughter of Eylon the Chittite.", "pj": "וַהֲוָה עֵשָו בַּר אַרְבְּעִין שְׁנִין וּנְסֵיב אִיתָא יַת יְהוּדִית בְּרַת בְּאֵרִי חִיתָּאָה וְיַת בָּשְמַת בְּרַת אֵילוֹן חִיתָּאָה", "pj_en": "And Esau was the son of forty years; and he took to wife Yehudith daughter of Beari the Hittah, and Basemath daughter of Elon the Hittah.", "tj": "", "tj_en": "", "rashi": "<b>בן ארבעים שנה.<\/b> עֵשָׂו הָיָה נִמְשָׁל לַחֲזִיר, שֶׁנֶּאֱמַר יְכַרְסְמֶנָּה חֲזִיר מִיָּעַר (תהילים פ'), הַחֲזִיר הַזֶּה כְּשֶׁהוּא שׁוֹכֵב, פּוֹשֵׁט טְלָפָיו, לוֹמַר רְאוּ שֶׁאֲנִי טָהוֹר; כָּךְ אֵלּוּ גּוֹזְלִים וְחוֹמְסִים וּמַרְאִים עַצְמָם כְּשֵׁרִים; כָּל מ' שָׁנָה הָיָה עֵשָׂו צָד נָשִׁים מִתַּחַת בַּעֲלֵיהֶן וּמְעַנֶּה אוֹתָם, כְּשֶׁהָיָה בֶּן מ' אָמַר אַבָּא בֶּן מ' שָׁנָה נָשָׂא אִשָּׁה, אַף אֲנִי כֵן:", "rashi_en": "בן ארבעים שנה [AND ESAU WAS] FORTY YEARS OLD —Esau is compared to a boar, as it is said, (Psalms 80:14) “The boar from the wood doth ravage it”. The boar when it lies down stretches forth its cloven hoof as much as to say, “See, I am a clean animal” (whilst really cloven hoofs are a feature of clean animals only in conjunction with another that is lacking in the swine). In the same way these dukes of Esau rob and extort and pretend to be honorable (Genesis Rabbah 65:1). For the whole forty years Esau enticed women from their husbands and ill-treated them; when he reached the age of forty he said, “My father took a wife when he was forty and I shall do the same” (Gen. R. 65)."}, {"ch": 26, "v": 35, "aliyah": 5, "heb": "וַתִּהְיֶ֖יןָ מֹ֣רַת ר֑וּחַ לְיִצְחָ֖ק וּלְרִבְקָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וַהֲוָאָה מְסָרְבָן וּמְרַגְּזָן עַל מֵימַר<\/b> יִצְחָק וְרִבְקָה:", "onk_en": "They were rebellious of spirit to [<b>They were rebels and aggravators against the words of<\/b>] Yitzchok and Rivkah.", "pj": "וַהֲוָון מְגַחְנָן בְּפוּלְחָנָא נוּכְרָאָה וּמִתְכַּוֵינָן לְאַמְרָדָא בְּעוֹבָדֵיהוֹן בִּישַׁיָא לְיִצְחָק וּלְרִבְקָה", "pj_en": "And they bowed in strange worship, and set themselves to rebel in their evil conduct against Izhak and against Rivekah.", "tj": "וַהֲוַיַין סַרְהָבִינִין וְאַפְחַת רוּחַ בְּפוּלְחָנָא נוּכְרַיָא וְלָא הֲווֹ מְקַבְּלִין אוּלְפַן לָא מִן יִצְחָק וְלָא מִן רִבְקָה:", "tj_en": "And they were refractory, swelling in spirit with strange worship, and would not receive instruction either from Izhak or Rivekah.", "rashi": "<b>מרת רוח.<\/b> לְשׁוֹן הַמְרָאוֹת רוּחַ, כְּמוֹ מַמְרִים הֱיִיתֶם, כָּל מַעֲשֵׂיהֶן הָיוּ לְהַכְעִיס וּלְעִצָּבוֹן:<br><br><b>ליצחק ולרבקה.<\/b> שֶׁהָיוּ עוֹבְדוֹת עֲ\"זָ (בראשית רבה):", "rashi_en": "מרת רוח [AND THEY WERE] A VEXATION OF SPIRIT — the expression means opposing the spirit of a person. The first word is of the same root as (Deuteronomy 9:24), “Ye have been rebellious (ממרים)”: all their actions tended to be a grief<br><br>ליצחק ולרבקה TO ISAAC AND REBEKAH, because they worshipped idols (Genesis Rabbah 65:4). "}, {"ch": 27, "v": 1, "aliyah": 5, "heb": "וַֽיְהִי֙ כִּֽי־זָקֵ֣ן יִצְחָ֔ק וַתִּכְהֶ֥יןָ עֵינָ֖יו מֵרְאֹ֑ת וַיִּקְרָ֞א אֶת־עֵשָׂ֣ו&thinsp;<b>׀<\/b> בְּנ֣וֹ הַגָּדֹ֗ל וַיֹּ֤אמֶר אֵלָיו֙ בְּנִ֔י וַיֹּ֥אמֶר אֵלָ֖יו הִנֵּֽנִי׃", "onk": "וַהֲוָה כַּד סִיב יִצְחָק וְכָהַיָּא עֵינוֹהִי מִלְּמֵחֱזֵי וּקְרָא יָת עֵשָׂו בְּרֵיהּ רַבָּא וַאֲמַר לֵיהּ בְּרִי וַאֲמַר לֵיהּ הָא אָנָא:", "onk_en": "And when Yitzchok grew old his eyesight faded and he could not see. He called Eisov, his elder son, and said to him, My son. [Eisov] said to him, Here I am.", "pj": "וַהֲוָה כַּד סִיב יִצְחָק וְכַהֲיָין עֵינוֹי מִלְחָמֵי דְכַד כַּפְתֵיהּ אָבוֹי אִסְתַּכֵּל בְכּוּרְסֵיהּ יְקָרָא וְשַׁרְיָין מֵהַהוּא זִמְנָא עֵינוֹי לְמִכְהֵי וּקְרָא יַת עֵשָו בְּרֵיהּ רַבָּא בְּאַרְבֵּיסַר בְּנִיסָן וַאֲמַר לֵיהּ בְּרִי הָא לֵילְיָא דֵין עִילָאֵי מְשַׁבְּחִין לְמָארֵי עַלְמָא וְאוֹצְרֵי טִלִין מִתְפַּתְּחִין בֵּיהּ וְאָמַר לֵיהּ הָא נָא", "pj_en": "And it was when Izhak was old and his eyes were darkened from seeing,--because when his father was binding him he had seen the Throne of Glory, and from that time his eyes had begun to darken,--that he called Esau his elder son, on the fourteenth of Nisan, and said to him, My son, behold, this night they on high praise the Lord of the world, and the treasures of the dew are opened in it. And he said, Behold, I am.", "tj": "", "tj_en": "", "rashi": "<b>ותכהין.<\/b> בַּעֲשָׁנָן שֶׁל אֵלּוּ. דָּ\"אַ כְּשֶׁנֶּעֱקַד עַ\"גַּ הַמִּזְבֵּחַ וְהָיָה אָבִיו רוֹצֶה לְשָׁחֳטוֹ, בְּאוֹתָהּ שָׁעָה נִפְתְּחוּ הַשָּׁמַיִם וְרָאוּ מַלְאֲכֵי הַשָּׁרֵת וְהָיוּ בוֹכִים, וְיָרְדוּ דִמְעוֹתֵיהֶם וְנָפְלוּ עַל עֵינָיו, לְפִיכָךְ כָּהוּ עֵינָיו. דָּ\"אַ כְּדֵי שֶׁיִּטֹּל יַעֲקֹב אֶת הַבְּרָכוֹת:", "rashi_en": "ותכהין HIS EYES WERE DIM through the smoke raised by these women in offering incense to idols (Midrash Tanchuma, Toldot 8). Another explanation is: When Isaac was bound upon the altar and his father was about to slay him, at that very moment the heavens opened, the ministering angels saw it and wept, and their tears flowed and fell upon Isaac’s eyes which thus became dim (Genesis Rabbah 65:10). Another explanation is: They became dim just in order that Jacob might receive the blessings (Genesis Rabbah 65:8)."}, {"ch": 27, "v": 2, "aliyah": 5, "heb": "וַיֹּ֕אמֶר הִנֵּה־נָ֖א זָקַ֑נְתִּי לֹ֥א יָדַ֖עְתִּי י֥וֹם מוֹתִֽי׃", "onk": "וַאֲמַר הָא <b>כְעַן<\/b> סֵיבִית לֵית אֲנָא יְדַע יוֹמָא דְאֵימוּת:", "onk_en": "[Yitzchok] said, Behold, if you please [<b>now<\/b>], I am old. I do not know the day of my death.", "pj": "וַאֲמַר הָא כְּדוֹן סֵיבַת לֵית אֲנָא יְדַע יוֹם מוֹתִי", "pj_en": "And he said, Behold, now I am old; I know not the day of my death:", "tj": "", "tj_en": "", "rashi": "<b>לא ידעתי יום מותי.<\/b> אָמַר רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה אִם מַגִּיעַ אָדָם לְפֶרֶק אֲבוֹתָיו יִדְאַג חָמֵשׁ שָׁנִים לִפְנֵיהֶן וְחָמֵשׁ לְאַחַר כֵּן; וְיִצְחָק הָיָה בֶּן קכ\"ג, אָמַר שֶׁמָּא לְפֶרֶק אִמִּי אֲנִי מַגִּיעַ וְהִיא מֵתָה בַּת קכ\"ז וַהֲרֵינִי בֶן ה' שָׁנִים סָמוּךְ לְפִרְקָהּ; לְפִיכָךְ <b>לא ידעתי יום מותי<\/b>, שֶׁמָּא לְפֶרֶק אִמִּי, שֶׁמָּא לְפֶרֶק אַבָּא:", "rashi_en": "לא ידעתי יום מותי I KNOW NOT THE DAY OF MY DEATH — R. Joshua the son of Korcha said: When a person approaches the age at which his parents died he may well be anxious five years before and five years after. Isaac was then one hundred and twenty three years old and he said, “Perhaps I shall only reach the age of my mother who died at the age of 127 and I am now within five years of her age: therefore, I know not the day of my death —I may only reach the age of my mother or it may be the age of my father” (Genesis Rabbah 65:12). "}, {"ch": 27, "v": 3, "aliyah": 5, "heb": "וְעַתָּה֙ שָׂא־נָ֣א כֵלֶ֔יךָ תֶּלְיְךָ֖ וְקַשְׁתֶּ֑ךָ וְצֵא֙ הַשָּׂדֶ֔ה וְצ֥וּדָה לִּ֖י <span class=\"mam-kq\"><span class=\"mam-kq-k\">(צידה)<\/span> <span class=\"mam-kq-q\">[צָֽיִד]<\/span><\/span>׃", "onk": "<b>וּכְעַן<\/b> סַב כְּעַן זֵינָךְ סַיְפָךְ וְקַשְׁתָּךְ וּפוּק לְחַקְלָא וְצוּד לִי צֵידָא:", "onk_en": "Now [therefore] please [<b>now<\/b>] take your equipment, your sword and your bow, and go out to the field and trap [deer] for me.", "pj": "וּכְדוֹן סַב כְּדוֹן מָאנִי זִינָךְ בֵּית גִירַךְ וְקַשְׁתָּךְ וּפוּק לְחַקְלָא וְצוּד לִי צֵידָא", "pj_en": "but now take thy weapons, thy quiver and thy bow; and go forth into the field, and take me venison,", "tj": "", "tj_en": "", "rashi": "<b>שא נא.<\/b> לְשׁוֹן הַשְׁחָזָה, כְּאוֹתָהּ שֶׁשָּׁנִינוּ אֵין מַשְׁחִיזִין אֶת הַסַּכִּין, אֲבָל מַשִּׂיאָהּ עַל גַּבֵּי חֲבֶרְתָּהּ (ביצה כ\"ח), חַדֵּד סַכִּינְךָ וּשְׁחֹט יָפֶה, שֶׁלֹּא תַאֲכִילֵנִי נְבֵלָה (בראשית רבה):<br><br><b>תליך.<\/b> חַרְבְּךָ שֶׁדֶּרֶךְ לִתְלוֹתָהּ:<br><br><b>וצודה לי.<\/b> מִן הַהֶפְקֵר וְלֹא מִן הַגֶּזֶל:", "rashi_en": "שא נא — The word שא means sharpen, similar to what שא read in the Mishna (Beitzah 28a) “One may not sharpen the knife in the usual manner but one may sharpen it by passing it (משיאין) over another”. Isaac said to Esau, “Sharpen your knife and slaughter an animal according to the regulations so that you may not give me to eat נבלה” (i.e. the flesh of animal that is not killed according to the ritual rules) (Genesis Rabbah 65:13).<br><br>תליך means thy sword which is usually hung (at the side).<br><br>צודה לי AND HUNT FOR ME [SOME VENISON] of animals that are ownerless, but not of such as are acquired by theft (literally, by robbery). "}, {"ch": 27, "v": 4, "aliyah": 5, "heb": "וַעֲשֵׂה־לִ֨י מַטְעַמִּ֜ים כַּאֲשֶׁ֥ר אָהַ֛בְתִּי וְהָבִ֥יאָה לִּ֖י וְאֹכֵ֑לָה בַּעֲב֛וּר תְּבָרֶכְךָ֥ נַפְשִׁ֖י בְּטֶ֥רֶם אָמֽוּת׃", "onk": "וְעִבֵיד לִי תַבְשִׁילִין כְּמָא דְרְחֵימִית וְאָעֵל לִי וְאֵיכוּל בְּדִיל דִּי תְבָרֵכִנָּךְ נַפְשִׁי עַד לָא אֵימוּת:", "onk_en": "Make it into a tasty dish for me, the way I like it, and bring it to me that I may eat, so that my soul will bless you before I die.", "pj": "וְעִיבַד לִי תַּבְשִׁילִין הֵיכְמָא דְרְחֵימִית וְתֵיעוֹל לְוָתִי וְאֵיכוֹל בְּגִין דִתִבָרְכִינָךְ נַפְשִׁי עַד לָא אֵימוּת", "pj_en": "and make me food such as I love, and bring to me, and I will eat, that my sould may bless thee ere I die.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 5, "aliyah": 5, "heb": "וְרִבְקָ֣ה שֹׁמַ֔עַת בְּדַבֵּ֣ר יִצְחָ֔ק אֶל־עֵשָׂ֖ו בְּנ֑וֹ וַיֵּ֤לֶךְ עֵשָׂו֙ הַשָּׂדֶ֔ה לָצ֥וּד צַ֖יִד לְהָבִֽיא׃", "onk": "וְרִבְקָה שְׁמַעַת כַּד מַלִּיל יִצְחָק לְוַת עֵשָׂו בְּרֵיהּ וַאֲזַל עֵשָׂו לְחַקְלָא לְמֵיצַד צֵידָא לְאַיְתָאָה:", "onk_en": "Rivkah had [over]heard what Yitzchok said to his son, Eisov. Eisov went out to the field to trap [deer] to bring it [home.]", "pj": "וְרִבְקָה שָׁמְעַת בְּרוּחַ קוּדְשָׁא כַּד מַלֵיל יִצְחָק עִם עֵשָו בְּרֵיהּ וְאָזַל עֵשָו לְחַקְלָא לְמֵיצַד צֵידָא לְאַיְתֵיאָה", "pj_en": "And Rivekah heard by the Holy Spirit as Izhak spake with Esau his son. And Esau went to the field to take venison to bring it.", "tj": "", "tj_en": "", "rashi": "<b>לצוד ציד להביא.<\/b> מַהוּ לְהָבִיא? אִם לֹא יִמְצָא צַיִד יָבִיא מִן הַגֶּזֶל:", "rashi_en": "לצוד ציד להביא TO HUNT FOR VENISON IN ORDER TO BRING IT —What is the force of to bring it? It means that he intended that if he would find no venison (flesh of a wild, ownerless animal) he would bring home of the flesh of an animal acquired by theft (Genesis Rabbah 65:13). "}, {"ch": 27, "v": 6, "aliyah": 5, "heb": "וְרִבְקָה֙ אָֽמְרָ֔ה אֶל־יַעֲקֹ֥ב בְּנָ֖הּ לֵאמֹ֑ר הִנֵּ֤ה שָׁמַ֙עְתִּי֙ אֶת־אָבִ֔יךָ מְדַבֵּ֛ר אֶל־עֵשָׂ֥ו אָחִ֖יךָ לֵאמֹֽר׃", "onk": "וְרִבְקָה אֲמָרַת לְוַת יַעֲקֹב בְּרַהּ לְמֵימָר הָא שְׁמָעִית מִן אֲבוּךְ מְמַלֵּל עִם עֵשָׂו אֲחוּךְ לְמֵימָר:", "onk_en": "Rivkah said to her son Yaakov, saying, Behold, I heard your father speaking to your brother Eisov, saying,", "pj": "וְרִבְקָה אָמְרַת לְיַעֲקב בְּרָהּ לְמֵימָר הָא לֵילְיָא הָדֵין עִלָאֵי מְשַׁבְּחִין לְמָרֵי עַלְמָא וְאוֹצְרֵי טַלִין מִתְפַּתְּחִין בֵּיהּ וְשַׁמְעִית יַת אָבוּךְ מְמַלֵיל עִם עֵשָו אָחוּךְ לְמֵימָר", "pj_en": "And Rivekah spake to Jakob her son, saying, Behold, this night those on high praise the Lord of the world, and the treasures of the dew are opened in it; and I have heard thy father speaking with Esau thy brother, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 7, "aliyah": 5, "heb": "הָבִ֨יאָה לִּ֥י צַ֛יִד וַעֲשֵׂה־לִ֥י מַטְעַמִּ֖ים וְאֹכֵ֑לָה וַאֲבָרֶכְכָ֛ה לִפְנֵ֥י יְהֹוָ֖ה לִפְנֵ֥י מוֹתִֽי׃", "onk": "אֱתִי לִי צֵידָא וְעִבֵיד לִי תַבְשִׁילִין וְאֵיכוּל וֶאֱבָרֵכִנָּךְ קֳדָם יְיָ קֳדָם מוֹתִי:", "onk_en": "Bring back [deer] for me and make it into a tasty dish for me and I will eat. I will then bless you in the presence of Adonoy before I die.", "pj": "אָעֵל לִי צֵידָא וְעִיבַד לִי תַּבְשִׁילִין וְאֵיכוֹל וַאֲבָרְכִינָךְ קֳדָם יְיָ קֳדָם דְאֵמוּת", "pj_en": "Bring me venison, and make me food, and I will bless thee in the presence of the Lord before I die. And now my son", "tj": "", "tj_en": "", "rashi": "<b>לפני ה'.<\/b> בִּרְשׁוּתוֹ, שֶׁיַּסְכִּים עַל יָדִי:", "rashi_en": "'לפני ה BEFORE THE LORD — By his permission: that He should approve of what I do. "}, {"ch": 27, "v": 8, "aliyah": 5, "heb": "וְעַתָּ֥ה בְנִ֖י שְׁמַ֣ע בְּקֹלִ֑י לַאֲשֶׁ֥ר אֲנִ֖י מְצַוָּ֥ה אֹתָֽךְ׃", "onk": "וּכְעַן בְּרִי <b>קַבֵּל<\/b> מִנִּי לְמָא דִי אֲנָא מְפַקֵּד יָתָךְ:", "onk_en": "Now my son, listen to [<b>accept<\/b>] me, concerning that which I command you.", "pj": "וּכְעַן בְּרִי קַבֵּיל מִנִי לְמָא דַאֲנָא מְפַקֵיד יָתָךְ", "pj_en": "receive from me what I command thee:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 9, "aliyah": 5, "heb": "לֶךְ־נָא֙ אֶל־הַצֹּ֔אן וְקַֽח־לִ֣י מִשָּׁ֗ם שְׁנֵ֛י גְּדָיֵ֥י עִזִּ֖ים טֹבִ֑ים וְאֶֽעֱשֶׂ֨ה אֹתָ֧ם מַטְעַמִּ֛ים לְאָבִ֖יךָ כַּאֲשֶׁ֥ר אָהֵֽב׃", "onk": "אִזֵּיל <b>כְּעַן<\/b> לְוַת עָנָא וְסַב לִי מִתַּמָּן תְּרֵין גַּדְיֵי (בַר) עִזִּין טָבָן וְאֶעְבֵּד יָתְהוֹן תַּבְשִׁילִין לְאָבוּךְ כְּמָא דִי רְחֵם:", "onk_en": "Go, please [<b>now<\/b>], to the sheep and take for me from there two choice young goats, and I will make [from] them a tasty dish for your father as he likes.", "pj": "אִיזֵיל כְּדוֹן לְבֵית עָנָא וְסַב לִי מִתַּמָן תְּרֵי גְדָיֵי עִזִין שַׁמְנִין חַד לְשׁוּם פִּסְחָא וְחַד לְשׁוּם קָרְבַּן חַגָא וְאַעֲבֵיד יַתְהוֹן תַּבְשִׁילִין לְאָבוּךְ הֵיכְמָא דִי רָחִים", "pj_en": "Go now to the house of the flock, and take me from thence two fat kids of the goats; one for the pascha, and one for the oblation of the feast; and I will make of them food for thy father such as he loveth.", "tj": "", "tj_en": "", "rashi": "<b>וקח לי.<\/b> מִשֶּׁלִּי הֵם וְאֵינָם גֶּזֶל, שֶׁכָּךְ כָּתַב לָהּ יִצְחָק בִּכְתֻבָּתָהּ לִטֹּל שְׁנֵי גְּדָיֵי עִזִּים בְּכָל יוֹם (בראשית רבה):<br><br><b>שני גדיי עזים.<\/b> וְכִי שְׁנֵי גְּדָיֵי עִזִּים הָיָה מַאֲכָל שֶׁל יִצְחָק? אֶלָּא הָאֶחָד הִקְרִיב לְפִסְחוֹ וְהָאֶחָד עָשָׂה מַטְעַמִּים; בְּפִרְקֵי רַבִּי אֱלִיעֶזֶר:<br><br><b>כאשר אהב.<\/b> כִּי טַעַם הַגְּדִי כְּטַעַם הַצְּבִי:", "rashi_en": "וקח לי AND TAKE FOR ME — (The words may mean “Take that which belongs to me”) — these are mine and not the proceeds of theft. Isaac had made provision in her marriage contract that she should receive daily two kids of the goats (Genesis Rabbah 65:14).<br><br>שני גדיי עזים TWO KIDS OF THE GOATS — Did then two kids of the goats form a meal for Isaac? But the explanation is: it being Passover he offered one as his Paschal sacrifice and of the other he prepared the savoury food. So is it stated in Pirkei DeRabbi Eliezer 32).<br><br>כאשר אהב SUCH AS HE LOVETH (Genesis 27:5) — For the taste of a kid is similar to the taste of a deer. "}, {"ch": 27, "v": 10, "aliyah": 5, "heb": "וְהֵבֵאתָ֥ לְאָבִ֖יךָ וְאָכָ֑ל בַּעֲבֻ֛ר אֲשֶׁ֥ר יְבָרֶכְךָ֖ לִפְנֵ֥י מוֹתֽוֹ׃", "onk": "וְתַיְתֵי (<small>נ\"א<\/small> וְתָעֵל) לְאָבוּךְ וְיֵכוּל בְּדִיל דִּיְבָרְכִנָּךְ קֳדָם מוֹתֵיהּ:", "onk_en": "You will [then] bring it to your father to eat, in order that he will bless you before he dies.", "pj": "וְתָעִיל לְאָבוּךְ וְיֵיכוֹל בְּגִין דִי יְבָרְכִינָךְ קֳדָם מוֹתֵיהּ", "pj_en": "And thou shalt carry to thy father, and he will eat, that he may bless thee before his death.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 11, "aliyah": 5, "heb": "וַיֹּ֣אמֶר יַעֲקֹ֔ב אֶל־רִבְקָ֖ה אִמּ֑וֹ הֵ֣ן עֵשָׂ֤ו אָחִי֙ אִ֣ישׁ שָׂעִ֔ר וְאָנֹכִ֖י אִ֥ישׁ חָלָֽק׃", "onk": "וַאֲמַר יַעֲקֹב לְרִבְקָה אִמֵּיהּ הָא עֵשָׂו אָחִי גְּבַר שַׂעֲרָן וַאֲנָא גְּבַר שְׁעִיעַ:", "onk_en": "Yaakov said to Rivkah, his mother, Behold, Eisov, my brother is a hairy person and I am a smooth-skinned person.", "pj": "וְעַל דַהֲוָה יַעֲקב דָחִיל חֵיטָא דָחִיל דִלְמָא יְלַטְטִינֵיהּ אָבוֹי וַאֲמַר הָא עֵשָו אָחִי גְבַר שַעֲרָן וַאֲנָא גְבַר שְׁעִיעַ", "pj_en": "And because Jakob was afraid to sin, fearing lest his father might curse him, he said, Behold, Esau my brother is a hairy man, and I am a smooth man.", "tj": "", "tj_en": "", "rashi": "<b>איש שעיר.<\/b> בַּעַל שֵׂעָר:", "rashi_en": "איש שער means A HAIRY MAN."}, {"ch": 27, "v": 12, "aliyah": 5, "heb": "אוּלַ֤י יְמֻשֵּׁ֙נִי֙ אָבִ֔י וְהָיִ֥יתִי בְעֵינָ֖יו כִּמְתַעְתֵּ֑עַ וְהֵבֵאתִ֥י עָלַ֛י קְלָלָ֖ה וְלֹ֥א בְרָכָֽה׃", "onk": "מָאִים יְמֻשִּׁנַּנִי אַבָּא וְאֵהֵי בְעֵינוֹהִי <b>כְּמִתְלָעָב<\/b> וְאֵהֵי מַיְתֵי (<small>נ\"א<\/small> וָאֱהִי מַיְתֵי) עֲלַי <b>לְוָטִין<\/b> וְלָא <b>בִרְכָן<\/b>:", "onk_en": "Suppose my father touches me. I will be in his eyes as an impostor [<b>a mocker<\/b>]. I will bring upon myself a curse [<b>curses<\/b>]—not a blessing [<b>blessings<\/b>].", "pj": "מָאִים יְגַשִׁשִׁינַנִי אַבָּא וְאֵיהֵי דָמִי בְּעֵינוֹיֵי הֵי כִּמְגַחָךְ בֵּיהּ וְאַיְיתֵי עָלַי לְוָוטִין וְלָא בִרְכָאָן", "pj_en": "Perhaps my father will feel me, and I shall be in his eyes like one who derideth him, and bring upon me a curse and not a blessing.", "tj": "", "tj_en": "", "rashi": "<b>ימשני.<\/b> כְּמוֹ מְמַשֵּׁשׁ בַּצָּהֳרַיִם:", "rashi_en": "ימשני HE WILL FEEL ME — The word is of the same root as the verb in (Deuteronomy 28:29) “One groping (ממשש) at noon-day”. "}, {"ch": 27, "v": 13, "aliyah": 5, "heb": "וַתֹּ֤אמֶר לוֹ֙ אִמּ֔וֹ עָלַ֥י קִלְלָתְךָ֖ בְּנִ֑י אַ֛ךְ שְׁמַ֥ע בְּקֹלִ֖י וְלֵ֥ךְ קַֽח־לִֽי׃", "onk": "וַאֲמֶרֶת לֵיהּ אִמֵּיהּ <b>עֲלַי אִתְאַמַּר בִּנְבוּאָה דְּלָא יֵיתוּן לְוָטַיָּא עֲלָךְ<\/b> בְּרִי בְּרַם <b>קַבֵּל<\/b> מִנִּי וְאִזֵּיל סַב לִי:", "onk_en": "His mother said to him, Your curse shall be upon me [<b>It was said regarding me in a prophecy that curses will not come upon you<\/b>], my son; but listen to [<b>accept<\/b>] me. Go bring them to me.", "pj": "וַאֲמָרַת לֵיהּ אִמֵיהּ אִין בִּרְכַן יְבָרְכִינָךְ יֵיתוֹן עֲלָךְ וְעַל בְּנָךְ וְאִין לְוָטִין יְלַטִטִינָךְ יֵיתוּן עָלַי וְעַל נַפְשִׁי בְּרַם קַבֵּל מִנִי וַאֲזֵיל סַב לִי", "pj_en": "And she said, If with blessings he bless thee, they shall be upon thee and upon thy sons; and if with curses he should curse thee, they shall be upon me and upon my soul: therefore receive from me, and go and take for me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 14, "aliyah": 5, "heb": "וַיֵּ֙לֶךְ֙ וַיִּקַּ֔ח וַיָּבֵ֖א לְאִמּ֑וֹ וַתַּ֤עַשׂ אִמּוֹ֙ מַטְעַמִּ֔ים כַּאֲשֶׁ֖ר אָהֵ֥ב אָבִֽיו׃", "onk": "וַאֲזַל וּנְסִיב וְאַיְתִי לְאִמֵּיהּ וַעֲבָדַת אִמֵּיהּ תַּבְשִׁילִין כְּמָא דִּרְחֵם אֲבוּהִי:", "onk_en": "He went, took [them], and brought [them] to his mother. His mother make a tasty dish as his father liked.", "pj": "וַאֲזַל וּנְסֵיב וְאַיְיתֵי לְאִמֵיהּ וַעֲבָדַת אִמֵיהּ תַּבְשִׁילִין הֵיכְמָא דְרָחֵם אָבוֹי", "pj_en": "And he went and took, and brought to his mother; and his mother made food such as his father loved.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 15, "aliyah": 5, "heb": "וַתִּקַּ֣ח רִ֠בְקָ֠ה אֶת־בִּגְדֵ֨י עֵשָׂ֜ו בְּנָ֤הּ הַגָּדֹל֙ הַחֲמֻדֹ֔ת אֲשֶׁ֥ר אִתָּ֖הּ בַּבָּ֑יִת וַתַּלְבֵּ֥שׁ אֶֽת־יַעֲקֹ֖ב בְּנָ֥הּ הַקָּטָֽן׃", "onk": "וּנְסִיבַת רִבְקָה יָת לְבוּשֵׁי עֵשָׂו בְּרַהּ רַבָּא <b>דָּכְיָתָא<\/b> דִּי עִמַּהּ בְּבֵיתָא וְאַלְבִּישַׁת יָת יַעֲקֹב בְּרַהּ זְעֵירָא:", "onk_en": "Rivkah took the garments of Eisov, her elder son, [the garments] that were precious [to him] [<b>the clean ones<\/b>] that were in her keeping in the house, and put them on Yaakov, her younger son.", "pj": "וּנְסֵיבַת רִבְקָה יַת לְבוּשֵׁי עֵשָו בְּרָהּ רַבָּא מְרַגְנָן דַהֲוָה מִן אָדָם קַדְמָאֵי וְהַהוּא יוֹמָא לָא אַלְבִּשִׁינוּן עֵשָו וְאִשְׁתָּאֲרוּ גַבָּהּ בְּבֵיתָא וְאַלְבִּישַׁת יַת יַעֲקב בְּרָהּ זְעֵירָא", "pj_en": "And Rivekah took the pleasant vestments of Esau her elder son which had formerly been Adam's; but which that day Esau had not worn, but they remained with her in the house, and (with them) she dressed Jakob her younger son.", "tj": "", "tj_en": "", "rashi": "<b>החמדת.<\/b> הַנְּקִיּוֹת, כְּתַרְגּוּמוֹ דָּכְיָתָא, דָּ\"אַ שֶׁחָמַד אוֹתָן מִן נִמְרוֹד:<br><br><b>אשר אתה בבית.<\/b> וַהֲלֹא כַמָּה נָשִׁים הָיוּ לוֹ, וְהוּא מַפְקִיד אֵצֶל אִמּוֹ? אֶלָּא שֶׁהָיָה בָקִי בְמַעֲשֵׂיהֶן וְחוֹשְׁדָן:", "rashi_en": "החמדות THE COSTLY GARMENTS — the clean ones, as the Targum has it, דכיתא (clean); (cf. Rashbam). Another explanation: They are called חמדות literally, coveted ones, because he had coveted them from Nimrod (who also was a hunter; cf. Genesis 10:9) (Genesis Rabbah 65:16)<br><br>אשר אתה בבית WHICH WERE WITH HER IN THE HOUSE — But he had several wives and yet he stored them with his mother! But the reason for this was that he was acquainted with their practices and was suspicious of them (Genesis 10:9) (he feared that they might steal his clothes) (Genesis Rabbah 65:16). "}, {"ch": 27, "v": 16, "aliyah": 5, "heb": "וְאֵ֗ת עֹרֹת֙ גְּדָיֵ֣י הָֽעִזִּ֔ים הִלְבִּ֖ישָׁה עַל־יָדָ֑יו וְעַ֖ל חֶלְקַ֥ת צַוָּארָֽיו׃", "onk": "וְיָת מַשְׁכֵי גַּדְיֵי בַּר עִזֵּי אַלְבִּישַׁת עַל יְדוֹהִי וְעַל שְׁעִיעוּת צַוְרֵיהּ:", "onk_en": "The skins of the young goats she placed on his hands and the smooth part of his neck.", "pj": "וְיַת מַשְׁכֵי דִגְדָיֵי בְּנֵי עִזֵי אַלְבִּישַׁת עַל יְדוֹי וְעַל שְׁעִיעוּת צַוְורֵיהּ", "pj_en": "And the skins of the kids she laid upon his hands and the smooth parts of his neck.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 17, "aliyah": 5, "heb": "וַתִּתֵּ֧ן אֶת־הַמַּטְעַמִּ֛ים וְאֶת־הַלֶּ֖חֶם אֲשֶׁ֣ר עָשָׂ֑תָה בְּיַ֖ד יַעֲקֹ֥ב בְּנָֽהּ׃", "onk": "וִיהָבַת יָת תַּבְשִׁילַיָּא וְיָת לַחֲמָא דִּי עֲבָדַת בִּידָא דְיַעֲקֹב בְּרַהּ:", "onk_en": "She placed the tasty dish and the bread which she had made, in the hand of Yaakov, her son.", "pj": "וְסַדְרַת יַת תַּבְשִׁילַיָא וְיַת לַחְמָא דִי עֲבָדַת בְּיַד יַעֲקב בְּרָהּ", "pj_en": "And the food and the bread she had made she set in the hand of Jakob her son.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 18, "aliyah": 5, "heb": "וַיָּבֹ֥א אֶל־אָבִ֖יו וַיֹּ֣אמֶר אָבִ֑י וַיֹּ֣אמֶר הִנֶּ֔נִּי מִ֥י אַתָּ֖ה בְּנִֽי׃", "onk": "וְעַל לְוַת אֲבוּהִי וַאֲמַר אַבָּא וַאֲמַר הָא אֲנָא מָן אַתְּ בְּרִי:", "onk_en": "He came to his father and said, My father. [Yitzchok] said, Here I am. Who are you my son?", "pj": "וְאָעֵיל לְוַת אָבוֹי וַאֲמַר אַבָּא וַאֲמָר הָאָנָא מַן אַנְתְּ בְּרִי", "pj_en": "And he entered unto his father, and said, My father. And he said, Behold me: who art thou, my son?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 19, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־אָבִ֗יו אָנֹכִי֙ עֵשָׂ֣ו בְּכֹרֶ֔ךָ עָשִׂ֕יתִי כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ אֵלָ֑י קֽוּם־נָ֣א שְׁבָ֗ה וְאׇכְלָה֙ מִצֵּידִ֔י בַּעֲב֖וּר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "onk": "וַאֲמַר יַעֲקֹב לַאֲבוּהִי אֲנָא עֵשָׂו בּוּכְרָךְ עֲבָדִית כְּמָא דִי מַלֵּילְתָּא עִמִּי (<small>נ\"א<\/small> לִי) קוּם <b>כְּעַן אִסְתַּחַר<\/b> וֶאֱכוּל מִצֵּידִי בְּדִיל דִּי תְבָרֲכִנַּנִי נַפְשָׁךְ:", "onk_en": "Yaakov said to his father, It is I, Eisov your firstborn. I have done as you told me. Rise, if you please [<b>now<\/b>], sit up [<b>recline<\/b>] and eat of my trapping so that your soul will bless me.", "pj": "וַאֲמַר יַעֲקב לְאָבוֹי אֲנָא עֵשָו בּוּכְרָךְ עֲבַדְנָא הֵיכְמָא דְמַלֵילְתָּא עִמִי קוּם כְּדֵין אִסְתְּחַר וְתֵכוּל מִצִידִי בְּגִין דִתְבָרְכִינַנִי נַפְשָׁךְ", "pj_en": "And Jacob said to his father, I am Esau thy firstborn: I have done as thou spakest with me. Arise now, sit and eat of my venison, that thy soul may bless me.", "tj": "", "tj_en": "", "rashi": "<b>אנכי עשו בכורך.<\/b> אָנֹכִי הַמֵּבִיא לְךָ וְעֵשָׂו הוּא בְּכוֹרֶךָ:<br><br><b>עשיתי.<\/b> כַמָּה דְבָרִים כַּאֲשֶׁר דִּבַּרְתָּ אֵלַי:<br><br><b>שבה.<\/b> לְשׁוֹן מֵסֵב עַל הַשֻּׁלְחָן, לְכָךְ מְתֻרְגָּם אִסְתָּחַר:", "rashi_en": "אנכי עשו בכרך I AM ESAU THY FIRST-BORN — I am he that brings food to you, and Esau is your first-born.<br><br>עשיתי I HAVE DONE many things at different times כאשר דברת אלי ACCORDING AS THOU SPAKEST UNTO ME<br><br>שבה SIT — The word means to sit at the table and therefore it is translated in the Targum by אסתחר (from סחר to “go round” corresponding to the Hebrew סבב from which the term מֵסֵב to recline at, to sit round the table at a meal is derived). "}, {"ch": 27, "v": 20, "aliyah": 5, "heb": "וַיֹּ֤אמֶר יִצְחָק֙ אֶל־בְּנ֔וֹ מַה־זֶּ֛ה מִהַ֥רְתָּ לִמְצֹ֖א בְּנִ֑י וַיֹּ֕אמֶר כִּ֥י הִקְרָ֛ה יְהֹוָ֥ה אֱלֹהֶ֖יךָ לְפָנָֽי׃", "onk": "וַאֲמַר יִצְחָק לִבְרֵיהּ מָה דֵּין אוֹחֵיתָא לְאַשְׁכָּחָא בְּרִי וַאֲמַר אֲרֵי זַמִּין יְיָ אֱלָהָךְ קֳדָמָי:", "onk_en": "Yitzchok said to his son, How is it that you found it so quickly my son? He [Yaakov] said, Because Adonoy, your God, brought it about for me.", "pj": "וַאֲמַר יִצְחָק לִבְרֵיהּ מַה דֵין אוֹחִיתָא לְאַשְׁכְּחָא בְּרִי וַאֲמַר אֲרוּם זַמִין יְיָ אֱלָהָךְ קֳדָמַי", "pj_en": "And Izhak said to his son, What is this that thou hast found so soon, my son? And he said, Because the Lord thy God had prepared it before me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 21, "aliyah": 5, "heb": "וַיֹּ֤אמֶר יִצְחָק֙ אֶֽל־יַעֲקֹ֔ב גְּשָׁה־נָּ֥א וַאֲמֻֽשְׁךָ֖ בְּנִ֑י הַֽאַתָּ֥ה זֶ֛ה בְּנִ֥י עֵשָׂ֖ו אִם־לֹֽא׃", "onk": "וַאֲמַר יִצְחָק לְיַעֲקֹב קְרֵיב <b>כְּעַן<\/b> וֶאֱמֻשִּׁנָּךְ בְּרִי הַאַתְּ דֵּין בְּרִי עֵשָׂו אִם לָא:", "onk_en": "Yitzchok said to Yaakov, Come close, if you please [<b>now<\/b>], and let me touch you, my son. Are you my son Eisov or not?", "pj": "וַאֲמַר יִצְחָק לְיַעֲקב קָרֵב כְּדוֹן וַאֲמוּשִׁינָךְ בְּרִי הַאַנְתְּ דֵין בְּרִי עֵשָו אִין לָא", "pj_en": "And Izhak said to Jakob, Come near now, and I will feel thee, my son, whether thou be my son Esau or not.", "tj": "", "tj_en": "", "rashi": "<b>גשה נא ואמשך.<\/b> אָמַר יִצְחָק בְּלִבּוֹ אֵין דֶּרֶךְ עֵשָׂו לִהְיוֹת שֵׁם שָׁמַיִם שָׁגוּר בְּפִיו, וְזֶה אָמַר כִּי הִקְרָה ה' אֱלֹהֶיךָ:", "rashi_en": "גשה נא ואמשך STEP NEAR, I PRAY THEE, THAT I MAY FEEL THEE — Isaac said to himself, “It is not Esau’s way to mention the name of God so readily, and this one says, “Because the Lord thy God caused it thus to happen to me! קול יעקב (Genesis Rabbah 65:19)."}, {"ch": 27, "v": 22, "aliyah": 5, "heb": "וַיִּגַּ֧שׁ יַעֲקֹ֛ב אֶל־יִצְחָ֥ק אָבִ֖יו וַיְמֻשֵּׁ֑הוּ וַיֹּ֗אמֶר הַקֹּל֙ ק֣וֹל יַעֲקֹ֔ב וְהַיָּדַ֖יִם יְדֵ֥י עֵשָֽׂו׃", "onk": "וּקְרֵיב יַעֲקֹב לְוַת יִצְחָק אֲבוּהִי וּמָשְׁיֵהּ וַאֲמַר קָלָא קָלָא דְיַעֲקֹב וִידַיָּא יְדוֹהִי דְעֵשָׂו:", "onk_en": "Yaakov came close to Yitzchok, his father, and he [Yitzchok] touched him. He said, The voice is the voice of Yaakov, but the hands are the hands of Eisov.", "pj": "וּקְרֵיב יַעֲקב לְוַת יִצְחָק אָבוֹי וְגַשְׁשֵׁיהּ וַאֲמַר קָלָא הָדֵין קָלֵיהּ דְיַעֲקב בְּרַם מַמַשׁ יְדוֹי כִּמֵימַשׁ יְדוֹי דְעֵשָו", "pj_en": "And Jakob drew near to Izhak his father, who touched him, and said, This voice is the voice of Jakob, nevertheless the feeling of the hands is as the feeling of the hands of Esau.", "tj": "מְמוּשׁ יְדוֹי מְמוּשׁ יְדוֹי דְעֵשָו:", "tj_en": "Esau stretched out her hand, stretched out her hand.", "rashi": "<b>קול יעקב.<\/b> שֶׁמְּדַבֵּר בִּלְשׁוֹן תַּחֲנוּנִים קוּם נָא, אֲבָל עֵשָׂו קִנְטוּרְיָא דִּבֵּר יָקֻם אָבִי:", "rashi_en": "THE VOICE OF JACOB, because he speaks in an entreating strain —“Arise I pray thee.” Esau, however, spoke in a harsh strain (v. 31) “Let my father arise” (Midrash Tanchuma, Toldot 11)."}, {"ch": 27, "v": 23, "aliyah": 5, "heb": "וְלֹ֣א הִכִּיר֔וֹ כִּֽי־הָי֣וּ יָדָ֗יו כִּידֵ֛י עֵשָׂ֥ו אָחִ֖יו שְׂעִרֹ֑ת וַֽיְבָרְכֵֽהוּ׃", "onk": "וְלָא אִשְׁתְּמוֹדְעֵיהּ אֲרֵי הֲוָאָה יְדוֹהִי כִּידֵי עֵשָׂו אֲחוּהִי שְׂעִירָן (<small>נ\"א<\/small> שַׂעֲרַנְיָן) וּבָרֲכֵיהּ:", "onk_en": "He [Yitzchok] did not recognize him because his hands were like those of Eisov, his brother—they were hairy—and [thus] he blessed him.", "pj": "וְלָא אִשְׁתְּמוֹדְעֵיהּ אֲרוּם הֲוָה יְדוֹ כִּידֵי עֵשָו אָחוּי שְעַרִנְיַין וּבָרְכֵיהּ", "pj_en": "But he recognised him not, because his hands were hairy as the hands of Esau his brother, and he blessed him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 24, "aliyah": 5, "heb": "וַיֹּ֕אמֶר אַתָּ֥ה זֶ֖ה בְּנִ֣י עֵשָׂ֑ו וַיֹּ֖אמֶר אָֽנִי׃", "onk": "וַאֲמַר אַתְּ דֵּין בְּרִי עֵשָׂו וַאֲמַר <b>הָא<\/b> אֲנָא:", "onk_en": "He said, Are you indeed my son, Eisov? [Yaakov] said, [<b>Behold<\/b>] I am.", "pj": "וַאֲמַר אַנְתְּ הוּא דֵין בְּרִי עֵשָו וַאֲמַר אֲנָא", "pj_en": "And he said, But art thou my son Esau? And he said, I am.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר אני.<\/b> לֹא אָמַר אֲנִי עֵשָׂו אֶלָּא אָנִי:", "rashi_en": "ויאמר אני AND HE SAID I AM — He did not say, “I am Esau”, but “It is I”. "}, {"ch": 27, "v": 25, "aliyah": 5, "heb": "וַיֹּ֗אמֶר הַגִּ֤שָׁה לִּי֙ וְאֹֽכְלָה֙ מִצֵּ֣יד בְּנִ֔י לְמַ֥עַן תְּבָֽרֶכְךָ֖ נַפְשִׁ֑י וַיַּגֶּשׁ־לוֹ֙ וַיֹּאכַ֔ל וַיָּ֧בֵא ל֦וֹ יַ֖יִן וַיֵּֽשְׁתְּ׃", "onk": "וַאֲמַר קָרֵיב <b>קֳדָמַי<\/b> וְאֵיכוּל מִצֵּידָא דִבְרִי בְּדִיל דִּי תְבָרְכִנָּךְ נַפְשִׁי וְקָרֵיב לֵיהּ וַאֲכַל וְאַיְתִי (<small>נ\"א<\/small> וְאָעֵל) לֵיהּ חַמְרָא וּשְׁתִי:", "onk_en": "He said, Bring it close to [<b>before<\/b>] me and I will eat from my son’s trappings, so that my soul will bless you. He brought it close to him and he ate. He [then] brought him wine and he drank.", "pj": "וַאֲמַר קָרֵיב לִי וְאֵיכוֹל מִצֵידָא דִבְרִי בְּגִין תְּבָרְכִינָךְ נַפְשִׁי וְקָרֵיב לֵיהּ וְאָכַל וְלָא הֲוָה חַמְרָא גַבֵּיהּ וְאִזְדַמֵן לֵיהּ מַלְאָכָא וְאַיְיתִי מִן חַמְרָא דְאִצְטִנַע בְּעִינְבוֹיֵי מִן יוֹמֵי שֵׁירוּי עַלְמָא וְיַהֲבֵיהּ בְּיַד יַעֲקב וְיַעֲקב אַמְטֵי לֵיהּ לְאָבוּי וּשְׁתִי", "pj_en": "And he said, Draw near, and I will eat of my son's venison, that my soul may bless thee. And he approached him, and he ate; and he had no wine; but an angel prepared it for him, from the wine which had been kept in its grapes from the days of the beginning of the world; and he gave it into Jakob's hand, and Jakob brought it to his father, and he drank.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 26, "aliyah": 5, "heb": "וַיֹּ֥אמֶר אֵלָ֖יו יִצְחָ֣ק אָבִ֑יו גְּשָׁה־נָּ֥א וּשְׁקָה־לִּ֖י בְּנִֽי׃", "onk": "וַאֲמַר לֵיהּ יִצְחָק אֲבוּהִי קְרֵיב <b>כְּעַן<\/b> וּנְשַׁק לִי (<small>נ\"א<\/small> וְשַׁק לִי) בְּרִי:", "onk_en": "His father Yitzchok said to him, Come close to me [<b>now<\/b>] and kiss me, my son.", "pj": "וַאֲמַר לֵיהּ יִצְחָק אָבוּי קָרֵיב כְּדוּן וְשַׁק לִי בְּרִי", "pj_en": "And Izhak his father said, Draw near now, and kiss me, my son;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 27, "aliyah": 5, "heb": "וַיִּגַּשׁ֙ וַיִּשַּׁק־ל֔וֹ וַיָּ֛רַח אֶת־רֵ֥יחַ בְּגָדָ֖יו וַֽיְבָרְכֵ֑הוּ וַיֹּ֗אמֶר רְאֵה֙ רֵ֣יחַ בְּנִ֔י כְּרֵ֣יחַ שָׂדֶ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ יְהֹוָֽה׃", "onk": "וּקְרֵב וּנְשַׁק לֵיהּ וַאֲרַח יָת רֵיחָא דִלְבוּשׁוֹהִי וּבָרְכֵיהּ וַאֲמַר הֲווֹ (<small>נ\"א<\/small> חֲזֵי) רֵיחָא דִבְרִי כְּרֵיחָא דְחַקְלָא דִּי בָרֲכֵיהּ יְיָ:", "onk_en": "He came close and kissed him. He [Yitzchok] smelled the fragrance of his garments, and he blessed him. He said, See, my son’s fragrance is like the fragrance of a field blessed by Adonoy.", "pj": "וְקָרֵיב וּנְשֵׁיק לֵיהּ וְאָרַח יַת רֵיחָא דִלְבוּשׁוֹי וּבָרְכֵיהּ וְאָמַר חֲמוּן רֵיחָא דִבְרִי כְּרֵיחָא דִקְטוֹרֶת בּוּסְמַנְיָא דַעֲתִידָא מִתְקַרְבָא בְּטַוַור בֵּי מַקְדְשָׁא דְאִתְקְרֵי חֲקַל דִבְרִיךְ יָתֵיהּ יְיָ וְאִתְרְעֵי לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָן", "pj_en": "and Jakob drew near and kissed him. And he smelled the smell of his vestments, and blessed him, and said, See, the smell of my son is as the smell of the fragrant incense which is to be offered on the mountain of the house of the sanctuary, which shall be called a field which the Lord hath blessed, and that He hath chosen, that therein His Shekinah might dwell.", "tj": "כְּרֵיחַ קְטוֹרֶת בּוּסְמִין טָבִין דַעֲתִידִין לְמִקְרְבָא בְּטוּר בֵּית מוּקְדָשָׁא דְבָרֵךְ יָתֵיהּ חַי וְקַיָם:", "tj_en": "Like the sweet smell of fragrant incense coming from the holy temple mountain, which the Lord blessed, living and enduring.", "rashi": "<b>וירח וגו'.<\/b> וַהֲלֹא אֵין רֵיחַ רַע יוֹתֵר מִשֶּׁטֶף הָעִזִּים? אֶלָּא מְלַמֵּד שֶׁנִּכְנְסָה עִמּוֹ רֵיחַ גַּן עֵדֶן;<br><br><b>כריח שדה אשר ברכו ה'.<\/b> שֶׁנָּתַן בּוֹ רֵיחַ טוֹב וְזֶהוּ שְׂדֵה תַּפּוּחִים, כָּךְ דָּרְשׁוּ רַזִ\"לִ:", "rashi_en": "’וירח וגו AND HE SMELLED etc.— Surely there is no more offensive smell than that of washed goat-skins! But Scripture implicitly tells us that the perfume of the Garden of Eden entered the room with him (Genesis Rabbah 65:22).<br><br>כריח שדה אשר ברכו AS THE ODOUR OF A FIELD WHICH THE ETERNAL HATH BLESSED — to which God has given a pleasant perfume: it refers to a field of apple-trees. So have our Rabbis, of blessed memory, explained it (Taanit 29b). "}, {"ch": 27, "v": 28, "aliyah": 6, "heb": "וְיִֽתֶּן־לְךָ֙ הָאֱלֹהִ֔ים מִטַּל֙ הַשָּׁמַ֔יִם וּמִשְׁמַנֵּ֖י הָאָ֑רֶץ וְרֹ֥ב דָּגָ֖ן וְתִירֹֽשׁ׃", "onk": "וְיִתֶּן לָךְ יְיָ מִטַּלָּא דִשְׁמַיָּא <b>וּמִטּוּבָא<\/b> דְאַרְעָא וּסְגִיאוּת (<small>נ\"א<\/small> וְסַגְיוּת) עִיבוּר וַחֲמָר:", "onk_en": "And may God give you of the dew of heaven, and of the fatness [riches] [<b>goodness<\/b>] of the land, and abundance of grain and wine.", "pj": "וְיִתֶּן לְךָ מֵימְרָא דַיְיָ מִטוּב טַלִין דְנַחֲתִין מִן שְׁמַיָא וּמִטוּב מַבּוּעִין דְסַלְקִין וּמִרְבְּיַין צִמְחֵי אַרְעָא מִלְרַע וְסוּגְנוֹי עִבּוּר וַחֲמַר", "pj_en": "Therefore the Word of the Lord give thee of the good dews which descend from the heavens, and of the good fountains that spring up, and make the herbage of the earth to grow from beneath, and plenty of provision and wine.", "tj": "", "tj_en": "", "rashi": "<b>ויתן לך.<\/b> יִתֵּן וְיַחֲזֹר וְיִתֵּן (בראשית רבה). וּלְפִי פְשׁוּטוֹ מוּסָב לְעִנְיָן הָרִאשׁוֹן: רְאֵה רֵיחַ בְּנִי שֶׁנָּתַן לוֹ הַקָּבָּ\"ה כְּרֵיחַ שָׂדֶה וְגוֹ' וְעוֹד יִתֵּן לְךָ מִטַּל הַשָּׁמַיִם וְגוֹ':<br><br><b>מטל השמים.<\/b> כְּמַשְׁמָעוֹ; וּמִדְרְשֵׁי אַגָּדָה יֵשׁ לְהַרְבֵּה פָנִים:<br><br><b>האלהים.<\/b> מַהוּ הָאֱלֹהִים? בַּדִּין; אִם רָאוּי לְךָ יִתֵּן לְךָ וְאִם לָאו לֹא יִתֵּן לְךָ, אֲבָל לְעֵשָׂו אָמַר מִשְׁמַנֵּי הָאָרֶץ יִהְיֶה מוֹשָׁבֶךָ, בֵּין צַדִּיק בֵּין רָשָׁע יִתֵּן לְךָ; וּמִמֶּנּוּ לָמַד שְׁלֹמֹה, כְּשֶׁעָשָׂה הַבַּיִת סִדֵּר תְּפִלָּתוֹ. יִשְׂרָאֵל שֶׁהוּא בַעַל אֱמוּנָה וּמַצְדִּיק עָלָיו אֶת הַדִּין לֹא יִקְרָא עָלֶיךָ תִּגָּר, לְפִיכָךְ וְנָתַתָּ לָאִישׁ בְכָל דְּרָכָיו אֲשֶׁר תֵּדַע אֶת לְבָבוֹ (מלכים א, ח'), אֲבָל נָכְרִי מְחֻסַּר אֲמָנָה, לְפִיכָךְ אָמַר אַתָּה תִּשְׁמַע הַשָּׁמַיִם, וְעָשִׂיתָ כְּכֹל אֲשֶׁר יִקְרָא אֵלֶיךָ הַנָּכְרִי (שם), בֵּין רָאוּי בֵּין שֶׁאֵינוֹ רָאוּי תֵּן לוֹ, כְּדֵי שֶׁלֹּא יִקְרָא עָלֶיךָ תִּגָּר:", "rashi_en": "ויתן לך THEREFORE GOD GIVE THEE — May he give thee and give thee repeatedly (Genesis Rabbah 66:3). However, according to its real meaning it must be connected with the preceding statement — viz., with the words, “See, the smell of my son, which the Holy One, blessed be He, has given him is like the smell of the field etc.“ And may He also give thee of the dew of heaven<br><br>מטל השמים OF THE DEW OF HEAVEN — Take it in the ordinary sense of the words; but there are Midrashic explanations giving many different meanings<br><br>האלהים GOD [GIVE THEE]—What denotes the use here of the Divine Name אלהים which signifies God in His attribute of Justice? May He act in justice! If you are worthy of it may He give it to you, and if not, let Him not give it to you. But to Esau he said, (Genesis 27:39) “The fat places of the earth shall be thy dwelling” —whether you be righteous or wicked He will give you this. From him (Isaac) did Solomon learn when he built the Temple how to compose his prayer (having in mind a similar idea): An Israelite who is a man of faith and acknowledges that God’s judgment is just will not reproach You;—therefore (1 Kings 8:39) “Render unto every man (Israelite; 1 Kings 8:38) according to his ways whose heart thou knowest”. A stranger, however, is lacking in faith; therefore Solomon said, (1 Kings 8:43) “Hear thou in heaven … and do according to all that the stranger calleth to thee for — whether he be worthy or unworthy grant him his request in order that he may not reproach You. This explanation of האלהים is found in an old and correct text of Rashi. "}, {"ch": 27, "v": 29, "aliyah": 6, "heb": "יַֽעַבְד֣וּךָ עַמִּ֗ים <span class=\"mam-kq\"><span class=\"mam-kq-k\">(וישתחו)<\/span> <span class=\"mam-kq-q\">[וְיִֽשְׁתַּחֲו֤וּ]<\/span><\/span> לְךָ֙ לְאֻמִּ֔ים הֱוֵ֤ה גְבִיר֙ לְאַחֶ֔יךָ וְיִשְׁתַּחֲו֥וּ לְךָ֖ בְּנֵ֣י אִמֶּ֑ךָ אֹרְרֶ֣יךָ אָר֔וּר וּֽמְבָרְכֶ֖יךָ בָּרֽוּךְ׃", "onk": "יִפְלְחֻנָּךְ עַמְמִין <b>וְיִשְׁתַּעְבְּדוּן לָךְ מַלְכְּוָן<\/b> הֱוֵי רַב לְאַחָיךְ וְיִסְגְּדוּן לָךְ בְּנֵי אִמָּךְ מְלַטְטָיךְ <b>יְהוֹן<\/b> לִיטִין וּמְבָרֲכָיךְ <b>יְהוֹן<\/b> בְּרִיכִין:", "onk_en": "Peoples will serve you and nations bow to you [<b>kingdoms will be subservient to you<\/b>]. Be master over your brothers, and your mother’s sons will bow to you. Those who curse you are [<b>will be<\/b>] cursed, and those who bless you are [<b>will be<\/b>] blessed.", "pj": "יִשְׁתַּעֲבְּדוּן לָךְ אוּמַיָא כָּל בְּנוֹי דְעֵשָו וִיגַחְנוּן קוּמָךְ מַלְכְּוָותָא כָּל בְּנָהָא דִקְטוּרָה רַב וְשַׁלִיט תְּהִי עַל אָחָךְ וִיהוֹן מְקַדְמִין לְמִשְׁאַל בִּשְׁלָמָךְ בְּנֵי אִמָךְ לָיְטָךְ בְּרִי יְהוֹן לִיטִין כְּבִלְעָם בַּר בְּעוֹר וּמְבָרְכָךְ יְהוֹן בְּרִיכָן כְּמשֶׁה נָבִיא סַפְרֵיהוֹם דְיִשְרָאֵל", "pj_en": "Let peoples be subject to thee, all the sons of Esau, and kingdoms bend before thee, all the sons of Keturah; a chief and a ruler be thou over thy brethren, and let the sons of thy mother salute thee. Let them who curse thee, my son, be accursed as Bileam bar Beor; and them who bless thee be blessed as Mosheh the prophet, the scribe of Israel.", "tj": "יִפְלְחוּן קֳדָמָךְ אוּמַיָא כָּל בְּנוֹי דְאָחוּךְ וְיִשְׁתַּעַבְּדָן לָךְ כָּל מַלְכַיָא כָּל בְּנוֹי דְיִשְׁמָעֵאל הֲוֵי רַב וְשַׁלִיט עַל בְּנֵי קְטוּרָה יְהוֹן מְקַדְמִין וּשְׁאִילֵין בִּשְׁלָמָךְ כָּל בְּנוֹי דְלָבָן אֲחוּהָ דְאִמָךְ מַאן דְלַיִיט יָתָךְ יַעֲקב בְּרִי יֶהֱוֵי לַיִיט כְּבִלְעָם בֶּן בְּעוֹר וּמַאן דִּמְבָרֵךְ יָתָךְ יֶהֱוֵי בְרִיךְ כְּמשֶׁה נְבִיָיא סַפְרֵיהוֹן דְיִשְרָאֵל:", "tj_en": "Let peoples serve before thee, all the sons of Esau: all kings be subject to thee, all the sons of Ishmael: be thou a chief and a ruler over the sons of Keturah: all the sons of Laban the brother of thy mother shall come before thee and salute thee. Whoso curseth thee, Jakob, my son, shall be accursed as Bileam ben Beor; and whoso blesseth thee shall be blessed as Mosheh the prophet and scribe of Israel.", "rashi": "<b>בני אמך.<\/b> וְיַעֲקֹב אָמַר לִיהוּדָה בְּנֵי אָבִיךָ, לְפִי שֶׁהָיוּ לוֹ בָנִים מִכַּמָּה אִמָּהוֹת, וְכָאן, שֶׁלֹּא נָשָׂא אֶלָּא אִשָּׁה אַחַת, אוֹמֵר בְּנֵי אִמֶּךָ (בראשית רבה):<br><br><b>ארריך ארור ומברכיך ברוך.<\/b> וּבְבִלְעָם הוּא אוֹמֵר מְבָרְכֶיךָ בָרוּךְ וְאֹרְרֶיךָ אָרוּר? הַצַּדִּיקִים תְּחִלָּתָם יִסּוּרִים וְסוֹפָן שַׁלְוָה וְאוֹרְרֵיהֶם וּמְצָעֲרֵיהֶם קוֹדְמִים לִמְבָרְכֵיהֶם, לְפִיכָךְ יִצְחָק הִקְדִּים קִלְלַת אוֹרְרִים לְבִרְכַת מְבָרְכִים; הָרְשָׁעִים תְּחִלָּתָן שַׁלְוָה וְסוֹפָן יִסּוּרִין, לְפִיכָךְ בִּלְעָם הִקְדִּים בְּרָכָה לִקְלָלָה (בראשית רבה):", "rashi_en": "בני אמך THY MOTHER’S SONS — Jacob, however, said to Judah (49:8) “Thy father’s sons (shall bow down to thee]”, because he had sons by several wives, but here, because he (Isaac) had but one wife he said “thy mother’s sons” (Genesis Rabbah 66:4).<br><br>ארריך ארור ומברכיך ברוך THEY THAT CURSE THEE SHALL BE CURSED AND THEY THAT BLESS THEE SHALL BE BLESSED — But in the case of Balaam Scripture says (Numbers 24:9) “Blessed be everyone that blesseth thee and cursed be every one that curseth thee”. The explanation is: the righteous have sufferings first and happiness afterwards, so that in point of time those who curse and afflict them (cause them suffering) come before those who bless them (cause them happiness) — therefore Isaac, a righteous man, invokes a curse upon those who themselves curse before he invokes a blessing upon those who bless. The wicked however have happiness first and suffering afterwards; therefore Balaam, a wicked man, invokes the blessing before the curse (Genesis Rabbah 66:4). "}, {"ch": 27, "v": 30, "aliyah": 6, "heb": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלָּ֣ה יִצְחָק֮ לְבָרֵ֣ךְ אֶֽת־יַעֲקֹב֒ וַיְהִ֗י אַ֣ךְ יָצֹ֤א יָצָא֙ יַעֲקֹ֔ב מֵאֵ֥ת פְּנֵ֖י יִצְחָ֣ק אָבִ֑יו וְעֵשָׂ֣ו אָחִ֔יו בָּ֖א מִצֵּידֽוֹ׃", "onk": "וַהֲוָה כַּד שֵׁיצִי יִצְחָק לְבָרָכָא יָת יַעֲקֹב וַהֲוָה בְּרַם מִפַּק נְפַק יַעֲקֹב מִלְּוַת אַפֵּי יִצְחָק אֲבוּהִי וְעֵשָׂו אֲחוּהִי אָתָא (<small>נ\"א<\/small> עַל) מִצֵּידֵיהּ:", "onk_en": "It was when Yitzchok had finished blessing Yaakov, and Yaakov had just left the presence of Yitzchok, his father, that Eisov came back from his trapping.", "pj": "וַהֲוָה כַּד שֵׁיצֵי יִצְחָק לְבָרְכָא יַת יַעֲקב וַהֲוָה בְּרַם מֵיפַק נְפַק יַעֲקב כְּתַרְתֵּין טְפוּחִין מִלְוַת יִצְחָק אָבוֹי וְעֵשָו אָחוֹי עַל מִצֵידֵיהּ", "pj_en": "And it was when Izhak had finished blessing Jakob, and Jakob had only gone out about two handbreadths from Izhak his father, that Esau his brother came in from his hunting.", "tj": "", "tj_en": "", "rashi": "<b>יצא יצא.<\/b> זֶה יוֹצֵא וְזֶה בָא:", "rashi_en": "יצא יצא [JACOB] WAS YET SCARCE GONE OUT — this means, as one went out the other came in (Midrash Tanchuma, Toldot 11)."}, {"ch": 27, "v": 31, "aliyah": 6, "heb": "וַיַּ֤עַשׂ גַּם־הוּא֙ מַטְעַמִּ֔ים וַיָּבֵ֖א לְאָבִ֑יו וַיֹּ֣אמֶר לְאָבִ֗יו יָקֻ֤ם אָבִי֙ וְיֹאכַל֙ מִצֵּ֣יד בְּנ֔וֹ בַּעֲבֻ֖ר תְּבָרְכַ֥נִּי נַפְשֶֽׁךָ׃", "onk": "וַעֲבַד אַף הוּא תַּבְשִׁילִין וְאָעֵיל לְוַת אֲבוּהִי וַאֲמַר לַאֲבוּהִי יָקוּם אַבָּא וְיֵכוּל מִצֵּידָא דִבְרֵיהּ בְּדִיל דִּי תְבָרְכִנַּנִי נַפְשָׁךְ:", "onk_en": "He too made a tasty dish and brought it to his father. He said to his father, Let my father rise and eat of his son’s trapping, that your soul may bless me.", "pj": "וְעִכֵּיב מֵימְרָא דַיְיָ מִנֵיהּ צֵידָא דַכְיָא וְאַשְׁכַּח כַּלְבָּא חָדָא וְקַטְלֵיהּ וְעָבַד אַף הוּא מִנֵיהּ תַּבְשִׁילִין וְאַיְיתֵי לְאָבוֹי וַאֲמַר לְאָבוֹי יְקוּם אַבָּא וְיֵיכוּל מִצֵידָא דִבְרֵיהּ בְּדִיל דְיִתְבָרְכִינַנִי נַפְשָׁךְ", "pj_en": "And the Word of the Lord had impeded him from taking clean venison; but he had found a certain dog, and killed him, and made food of him, and brought to his father, and said to his father, Arise, my father, and eat of my venison, that thy soul may bless me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 32, "aliyah": 6, "heb": "וַיֹּ֥אמֶר ל֛וֹ יִצְחָ֥ק אָבִ֖יו מִי־אָ֑תָּה וַיֹּ֕אמֶר אֲנִ֛י בִּנְךָ֥ בְכֹֽרְךָ֖ עֵשָֽׂו׃", "onk": "וַאֲמַר לֵיהּ יִצְחָק אֲבוּהִי מָן אָתְּ וַאֲמַר אֲנָא בְּרָךְ בּוּכְרָךְ עֵשָׂו:", "onk_en": "Yitzchok, his father, said to him, Who are you? He said, I am your son, your firstborn, Eisov.", "pj": "וַאֲמַר לֵיהּ יִצְחָק אָבוֹי וַאֲמַר לֵיהּ מַאן אַנְתְּ וַאֲמַר אֲנָא בְּרָךְ בּוּכְרָךְ עֵשָו", "pj_en": "And Izhak his father said to him, Who art thou? And he said, I am thy firstborn, Esau.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 33, "aliyah": 6, "heb": "וַיֶּחֱרַ֨ד יִצְחָ֣ק חֲרָדָה֮ גְּדֹלָ֣ה עַד־מְאֹד֒ וַיֹּ֡אמֶר מִֽי־אֵפ֡וֹא ה֣וּא הַצָּֽד־צַ֩יִד֩ וַיָּ֨בֵא לִ֜י וָאֹכַ֥ל מִכֹּ֛ל בְּטֶ֥רֶם תָּב֖וֹא וָאֲבָרְכֵ֑הוּ גַּם־בָּר֖וּךְ יִהְיֶֽה׃", "onk": "<b>וּתְוָה יִצְחָק תִּוְהָא רַבָּא<\/b> עַד לַחֲדָא וַאֲמַר מָן הוּא דֵיכִי דְּצָד צֵידָא וְאָעֵיל לִי וַאֲכָלִית מִכֹּלָּא עַד לָא תֵיעוֹל וּבָרֵכִתֵּיהּ אַף בְּרִיךְ יְהֵי:", "onk_en": "Yitzchok was seized with a powerful trembling [<b>Yitzchok was astonished with great astonishment<\/b>]; and said, Who, then, is he who trapped [deer] and brought it to me. I ate all of it before you came, and I blessed him. He shall be blessed.", "pj": "וְאִזְדַעֲזַע יִצְחָק זַעֲזוּעַ סַגִי כְּדִי שָׁמַע יַת קָלֵיהּ דְעֵשָו וְרֵיחַ תַּבְשִׁילֵיהּ עָלַת בְּאַנְפּוֹי הֵי כְרֵיחָא דִיֵקדַת גֵיהִנָם וַאֲמַר מַאן הוּא דְכִי דְצַד צֵידָא וְאָעֵיל לִי וַאֲכָלִית מִכָּל דְאַיְיתִי עַד דְלָא עָלַת וּבְרִיכְתֵּיהּ וַאֲפִילוּ הָכִי בְּרִיךְ יְהֵי", "pj_en": "And Izhak was moved with great agitation when he heard the voice of Esau, and the smell of his food rose in his nostrils as the smell of the burning of Gehennam; and he said, Who is he who hath got venison, and come to me, and I have eaten of all which he brought me before thou camest, and I have blessed him, and he shall, too, be blessed?", "tj": "", "tj_en": "", "rashi": "<b>ויחרד.<\/b> כְּתַרְגּוּמוֹ וּתְוַהּ, לְשׁוֹן תְּמִיהָ. וּמִדְרָשׁוֹ רָאָה גֵּיהִנֹּם פְּתוּחָה מִתַּחְתָּיו:<br><br><b>מי אפוא.<\/b> לָשׁוֹן לְעַצְמוֹ מְשַׁמֵּשׁ עִם כַּמָּה דְבָרִים; אֵיפֹה – אַיֵּה פֹה, מִי הוּא וְאֵיפֹה הוּא הַצָּד צַיִד?<br><br><b>ואכל מכל.<\/b> מִכָּל טְעָמִים שֶׁבִּקַּשְׁתִּי לִטְעֹם, טָעַמְתִּי בוֹ (בראשית רבה):<br><br><b>גם ברוך יהיה.<\/b> שֶׁלֹּא תֹאמַר אִלּוּלֵי שֶׁרִמָּה יַעֲקֹב לְאָבִיו לֹא נָטַל אֶת הַבְּרָכוֹת, לְכָךְ הִסְכִּים וּבֵרְכוֹ מִדַּעְתּוֹ (בראשית רבה):", "rashi_en": "ויחרד [AND ISAAC] TREMBLED — Explain it as the Targum renders it ותוה, which means he was perplexed. The Midrashic explanation (Midrash Tanchuma, Toldot 11) is that he saw Gehinnom opening beneath him (Esau).<br><br>מי אפוא WHO THEN IS HE — The word אפוא is an independent particle having no etymological connection with any other Hebrew word and is used with many different shades of meaning Another explanation of אפוא is that it is the same as איה פה where here, — so that מי אפוא means “Who is he and where is he here that hath hunted venison”?)<br><br>ואכל מכל AND I HAVE EATEN OF ALL — all tastes that I desired to find in it I indeed found therein (Genesis Rabbah 67:2).<br><br>גם ברוך יהיה YEA, AND HE SHALL BE BLESSED — In order that you may not say “If Jacob had not deceived his father he would never have received the blessing”, he, therefore, confirmed it, blessing him now of his own free will (Genesis Rabbah 67:2). "}, {"ch": 27, "v": 34, "aliyah": 6, "heb": "כִּשְׁמֹ֤עַ עֵשָׂו֙ אֶת־דִּבְרֵ֣י אָבִ֔יו וַיִּצְעַ֣ק צְעָקָ֔ה גְּדֹלָ֥ה וּמָרָ֖ה עַד־מְאֹ֑ד וַיֹּ֣אמֶר לְאָבִ֔יו בָּרְכֵ֥נִי גַם־אָ֖נִי אָבִֽי׃", "onk": "כַּד שְׁמַע עֵשָׂו יָת פִּתְגָּמֵי אֲבוּהִי וּצְוַח צִוְחָא רַבָּא וּמְרִירָא עַד לַחֲדָא וַאֲמַר לַאֲבוּהִי בָּרֵכְנִי אַף אֲנָא (<small>נ\"א<\/small> לִי) אַבָּא:", "onk_en": "When Eisov heard his father’s words, he wailed a most loud and bitter cry, and he said to his father, Bless me too, my father.", "pj": "כַּדִי שְׁמַע עֵשָו יַת פִּתְגָמֵי אָבוֹי וְצָוַח צְוַחְתָּא רַבְּתָא וּמְרִירָתָא עַד לַחֲדָא וַאֲמַר לְאָבוֹי בְּרֵיכְנִי אוּף לִי אַבָּא", "pj_en": "When Esau heard the words of his father, he cried with a cry exceeding great and bitter, and said to his father, Bless me, me also, my father! And he said,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 35, "aliyah": 6, "heb": "וַיֹּ֕אמֶר בָּ֥א אָחִ֖יךָ בְּמִרְמָ֑ה וַיִּקַּ֖ח בִּרְכָתֶֽךָ׃", "onk": "וַאֲמַר עַל אָחוּךְ בְּ<b>חָכְמְתָא<\/b> <b>וְקַבִּיל<\/b> בִּרְכְּתָךְ:", "onk_en": "[Yitzchok] said, Your brother came with cunning [<b>wisdom<\/b>] and he took [<b>received<\/b>] your blessing.", "pj": "וַאֲמַר עַל אָחוּךְ בְּחָכְמְתָא וְקַבֵּיל מִינִי בִּרְכָתָךְ", "pj_en": "Thy brother hath come with subtilty, and hath received from me thy blessing.", "tj": "", "tj_en": "", "rashi": "<b>במרמה.<\/b> בְּחָכְמָה:", "rashi_en": "במרמה WITH SUBTLETY — with cleverness (cf. Onkelos). "}, {"ch": 27, "v": 36, "aliyah": 6, "heb": "וַיֹּ֡אמֶר הֲכִי֩ קָרָ֨א שְׁמ֜וֹ יַעֲקֹ֗ב וַֽיַּעְקְבֵ֙נִי֙ זֶ֣ה פַעֲמַ֔יִם אֶת־בְּכֹרָתִ֣י לָקָ֔ח וְהִנֵּ֥ה עַתָּ֖ה לָקַ֣ח בִּרְכָתִ֑י וַיֹּאמַ֕ר הֲלֹא־אָצַ֥לְתָּ לִּ֖י בְּרָכָֽה׃", "onk": "וַאֲמַר <b>יָאוּת קְרָא שְׁמֵיהּ יַעֲקֹב<\/b> וְחַכְּמַנִי דְּנָן תַּרְתֵּין זִמְנִין יָת בְּכֵירוּתִי <b>נְסִיב<\/b> וְהָא כְּעַן קַבִּיל בִּרְכְּתִי וַאֲמַר הֲלָא שְׁבַקְתָּ לִּי בִּרְכְּתָא:", "onk_en": "[Eisov] said, Is he not rightly called Yaakov? [<b>He is rightly called Yaakov<\/b>] He has deceived me twice; he took my birthright, and now he has taken [<b>received<\/b>] my blessing. He said, Have you not saved a blessing for me?", "pj": "וַאֲמַר בְּקוּשְׁטָא קְרָא שְׁמֵיהּ יַעֲקב וּשְׁקַר בִּי דְנַן תַּרְתֵּין זִמְנִין יַת בְּכֵירוּתִי נְסִיב וְהָא כְּדוֹן קַבֵּיל בִּרְכָתִי וַאֲמַר הֲלָא שְׁבַקְתָּא לִי בִּרְכָתָא", "pj_en": "And he said, His name is truly called Jakob; for he hath dealt treacherously with me these two times: my birthright he took, and, behold, now he hath received my blessing! And he said, Hast thou not reserved a blessing for me?", "tj": "", "tj_en": "", "rashi": "<b>הכי קרא שמו.<\/b> לְשׁוֹן תֵּמַהּ הוּא, כְּמוֹ הֲכִי אָחִי אַתָּה, שֶׁמָּא לְכָךְ נִקְרָא שְׁמוֹ יַעֲקֹב עַל שֵׁם סוֹפוֹ שֶׁהוּא עָתִיד לְעָקְבֵנִי? תַּנְחוּמָא. לָמָּה חָרַד יִצְחָק? אָמַר שֶׁמָּא עָוֹן יֵשׁ בִּי שֶׁבֵּרַכְתִּי קָטָן לִפְנֵי גָּדוֹל וְשִׁנִּיתִי סֵדֶר הַיַּחַס, הִתְחִיל עֵשָׂו מְצָעֵק וַיַּעְקְבֵנִי זֶה פַעֲמַיִם, אָמַר לוֹ אָבִיו מֶה עָשָׂה לְךָ? אָמַר לוֹ אֶת בְּכֹרָתִי לָקָח, אָמַר בְּכָךְ הָיִיתִי מֵצֵר וְחָרֵד שֶׁמָּא עָבַרְתִּי עַל שׁוּרַת הַדִּין, עַכְשָׁו לַבְּכוֹר בֵּרַכְתִּי, גַּם בָּרוּךְ יִהְיֶה:<br><br><b>ויעקבני.<\/b> כְּתַרְגּוּמוֹ וּכְמַנִי – אֲרָבַנִי; וְאָרַב – וּכְמַן. וְיֵשׁ מְתַרְגְּמִין וְחַכְּמַנִי, נִתְחַכֵּם לִי:<br><br><b>אצלת.<\/b> לְשׁוֹן הַפְרָשָׁה כְּמוֹ וַיָּאצֶל:", "rashi_en": "הכי קרא שמו IS IT BECAUSE HE HAS BEEN CALLED [JACOB]—This is a question, like (29:15) “Is it because (הכי) thou art my brother?” Perhaps that is why they have given him the name Jacob — in reference to what was to happen in the future — that he would some time or other supplant me (יעקבני)? (Tanchuma). Why did Isaac tremble? He thought: Perhaps I have sinned in blessing the younger before the elder, thus changing the order of relationship between them. But when Esau began to cry out, “for he hath supplanted me these two times”, his father asked him, “What did he do to you?” He replied, “He took away my birth-right”. Isaac thereupon said, “It was on account of this that I was grieved and trembled: perhaps I had overstepped the line of strict justice. Now, however, I have really blessed the first-born — ‘And he shall indeed be blessed’”.<br><br>ויעקבני THAT HE HATH SUPPLANTED ME — Explain it as the Targum renders it, וחכמני, which means “and he lay in wait for me.” The word (Deuteronomy 19:11) וארב “and he lies in wait” is rendered by the Targum וכמי. There are some who read in the Targum not וכמני but וחכמני which means “he showed himself clever against me” (outwitted me).<br><br>אצלת HAST THOU NOT RESERVED — the word means “separating״, “setting aside״, like (Numbers 11:25) “And he separated. "}, {"ch": 27, "v": 37, "aliyah": 6, "heb": "וַיַּ֨עַן יִצְחָ֜ק וַיֹּ֣אמֶר לְעֵשָׂ֗ו הֵ֣ן גְּבִ֞יר שַׂמְתִּ֥יו לָךְ֙ וְאֶת־כׇּל־אֶחָ֗יו נָתַ֤תִּי לוֹ֙ לַעֲבָדִ֔ים וְדָגָ֥ן וְתִירֹ֖שׁ סְמַכְתִּ֑יו וּלְכָ֣ה אֵפ֔וֹא מָ֥ה אֶֽעֱשֶׂ֖ה בְּנִֽי׃", "onk": "וַאֲתֵיב יִצְחָק וַאֲמַר לְעֵשָׂו הָא רַב שַׁוִּתֵּיהּ לָךְ (<small>נ\"א<\/small> עִלַּוָךְ) וְיָת כָּל אֲחוֹהִי יְהָבִית לֵיהּ לְעַבְדִּין וְעִיבוּר וַחֲמָר סְעִדְתֵּיהּ וְלָךְ <b>הָכָא<\/b> מָה אֶעְבֵּיד בְּרִי:", "onk_en": "Yitzchok replied and said to Eisov. Behold, I have made him your master, and all his brothers I have given him as slaves. I have sustained him with grain and wine. Where? [<b>Here.<\/b>] What can I do for you, my son?", "pj": "וְאָתֵיב יִצְחָק וַאֲמַר לְעֵשָו הָא שַׁלִיט מִינִיתֵיהּ עֲלָךְ וְיַת כָּל אָחוֹי שִׁוִיתִי קוּמוֹי לְעַבְדִין וְעִיבּוּר וַחֲמַר סְעַדְתִּיו וְאָזִיל וְתִיטְרַד מִנִי דְמַה אַעֲבֵיד לָךְ בְּרִי", "pj_en": "And Izhak answered and said to Esau, Behold, I have appointed him a ruler over thee, and all his brethren have I made to be his servants, and with provision and wine have I sustained him: and now go, leave me; for what can I do for thee, my son?", "tj": "", "tj_en": "", "rashi": "<b>הן גביר.<\/b> בְּרָכָה זוֹ שְׁבִיעִית הִיא, וְהוּא עוֹשֶׂה אוֹתָהּ רִאשׁוֹנָה? אֶלָּא אָמַר לוֹ מַה תּוֹעֶלֶת לְךָ בַּבְּרָכָה? אִם תִּקְנֶה נְכָסִים, שֶׁלּוֹ הֵם, שֶׁהֲרֵי גְּבִיר שַׂמְתִּיו לָךְ, וּמַה שֶּׁקָּנָה עֶבֶד קָנָה רַבּוֹ:<br><br><b>ולכה אפא מה אעשה.<\/b> אַיֵּה אֵיפֹא אֲבַקֵּשׁ מַה לַּעֲשׂוֹת לְךָ:", "rashi_en": "הן גביר AND BEHOLD I HAVE MADE HIM THY MASTER — This blessing is the seventh in the series of blessings which Isaac gave to Jacob (cf. w. 28. 29) and yet he (Isaac) singles it out as though it were the chief blessing? But the explanation is, he said to him (Esau): “What benefit will a blessing be to you? If you acquire property, it will belong to him, for “Behold, I have made him thy master״, and whatever a servant acquires becomes the property of his master (Genesis Rabbah 67:5).<br><br>ולכה אפוא מה אעשה בני AND WHAT SHALL I DO NOW UNTO THEE [MY SON?] — Where here (איפה) shall I look for something that I can do for you? "}, {"ch": 27, "v": 38, "aliyah": 6, "heb": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶל־אָבִ֗יו הַֽבְרָכָ֨ה אַחַ֤ת הִֽוא־לְךָ֙ אָבִ֔י בָּרְכֵ֥נִי גַם־אָ֖נִי אָבִ֑י וַיִּשָּׂ֥א עֵשָׂ֛ו קֹל֖וֹ וַיֵּֽבְךְּ׃", "onk": "וַאֲמַר עֵשָׂו לַאֲבוּהִי הֲבִרְכְּתָא חֲדָא הִיא לָךְ אַבָּא בָּרֵךְ לִי אַף אֲנָא אַבָּא וַאֲרֵים עֵשָׂו קָלֵיהּ וּבְכָא:", "onk_en": "Eisov said to his father, Do you have only one blessing, my father? Bless me too, my father, and Eisov raised his voice and wept.", "pj": "וַאֲמַר עֵשָו לְאָבוֹי הֲבִרְכָתָא חָדָא הוּא לָךְ אַבָּא בְּרֵיכְנִי אוּף לִי אַבָּא וְאָרֵים עֵשָו קָלֵיהּ וּבְכָא", "pj_en": "And Esau answered his father, Hast thou but one blessing, my father? Bless me, me also, my father. And Esau lifted up his voice and wept.", "tj": "", "tj_en": "", "rashi": "<b>הברכה אחת.<\/b> הֵ\"א זוֹ מְשַׁמֶּשֶׁת לְשׁוֹן תְּמִיהָ, כְּמוֹ הַבְּמַחֲנִים? הַשְּׁמֵנָה הִיא? הַכְּמוֹת נָבָל?", "rashi_en": "הברכה אחת HAST THOU BUT ONE BLESSING? The ה in הברכה is the interrogative prefix, as in (Num. XIII. 19, 20) “whether in camps (הבמחנים)”, “whether it is fat (השמנה)\", and (2 Sam. III. 33) “Should Abner die (הכמות) as a churl dieth”? "}, {"ch": 27, "v": 39, "aliyah": 6, "heb": "וַיַּ֛עַן יִצְחָ֥ק אָבִ֖יו וַיֹּ֣אמֶר אֵלָ֑יו הִנֵּ֞ה מִשְׁמַנֵּ֤י הָאָ֙רֶץ֙ יִהְיֶ֣ה מֽוֹשָׁבֶ֔ךָ וּמִטַּ֥ל הַשָּׁמַ֖יִם מֵעָֽל׃", "onk": "וַאֲתֵיב יִצְחָק אֲבוּהִי וַאֲמַר לֵיהּ הָא <b>מִטּוּבָא<\/b> דְאַרְעָא יְהֵא מוֹתְבָךְ וּמִטַּלָּא דִשְׁמַיָּא מִלְּעֵלָּא:", "onk_en": "Yitzchok, his father replied and said to him, Behold the fatness [richness] [<b>goodness<\/b>] of the earth shall be your dwelling, and of the dew of heaven from above.", "pj": "וְאָתֵיב יִצְחָק וַאֲמַר לְעֵשָו הָא בְּטוּב פֵּרֵי אַרְעָא יְהִי מוֹתָבָךְ וּמִטַלְיָא דִשְׁמַיָא מִלְעֵילָא", "pj_en": "And Izhak answered and said to Esau, Behold, among the good fruits of the earth shall be thy habitation, and with the dews of the heavens from above.", "tj": "", "tj_en": "", "rashi": "<b>משמני ארץ וגו'.<\/b> זוֹ אִיטָלִיאָה שֶׁל יָוָן:", "rashi_en": "משמני הארץ וגו THE FATNESS OF THE EARTH etc. — This refers to the Greek portions of Italy (Graeca Magna) (Genesis Rabbah 67:6). "}, {"ch": 27, "v": 40, "aliyah": 6, "heb": "וְעַל־חַרְבְּךָ֣ תִֽחְיֶ֔ה וְאֶת־אָחִ֖יךָ תַּעֲבֹ֑ד וְהָיָה֙ כַּאֲשֶׁ֣ר תָּרִ֔יד וּפָרַקְתָּ֥ עֻלּ֖וֹ מֵעַ֥ל צַוָּארֶֽךָ׃", "onk": "וְעַל חַרְבָּךְ תֵּיחֵי וְיָת אָחוּךְ תִּפְלָח וִיהֵי <b>כַּד יַעְבְּרוּן בְּנוֹהִי עַל פִּתְגָּמֵי אוֹרַיְתָא<\/b> וְתַעְדֵּי נִירֵיהּ מֵעַל צַוְרָךְ:", "onk_en": "You shall live by your sword, and you shall serve your brother. When you have cause to be grieved [<b>When his sons will transgress the words of the Torah<\/b>], you will throw off his yoke from your neck.", "pj": "וְעַל סַיְיפָךְ תְּהֵי רָחִיץ עָלִיל לְכָל אָתַר וּמַרְכִיךְ וְתָאִי וּלְאָחִיךְ תְּהֵי מִשְׁתַּעֲבֵּד וִיהֵי אִין רַשִׁיעִי וְתָחִית יַת בְּנוֹי מִלְמִיטַר פִּקוּדֵי אוֹרַיְיתָא בְּכֵן תְּהֵי פָּרִיק נִיר שִׁעְבּוּדֵיהּ מֵעַל צַוְורָךְ", "pj_en": "And upon thy sword shalt thou depend, entering at every place: yet thou shalt be supple and credulous, and be in subjection to thy brother; but it will be that when his sons become evil, and fall from keeping the commandments of the law, thou shalt break his yoke of servitude from off thy neck.", "tj": "וְעַל מָנֵי זְיָינָךְ תְּחִי וְקָדָם אָחוּךְ תֶּהֱוֵי מִשְׁתַּעְבֵּד וְיֶהֱוֵי כַּד יֶהֱוַון בְּנוֹי דְיַעֲקב לַעֲיַין בְּאוֹרַיְיתָא וְנַטְרֵיהּ פִּקוּדַיָא יֶהְוֶיַן מְשַׁוְיָין נִיר שִׁעֲבּוּדָא עַל צַוְורָךְ וְכַד יִמְנְעוּן גַרְמֵיהוֹן בְּנוֹי דְיַעֲקב דְלָא לְמִלְעֵי בְּאוֹרַיְיתָא וְלָא לְמִיטַר פִּקוּדַיָא הָא בְּכֵן תֶּהֱוֵי פָרִיק נִיר שִׁעְבּוּדֵיהוֹן מֵעַלִוֵי צַוָוארָךְ:", "tj_en": "And by thy weapons thou shalt live, and before thy brother be subject. And it shall be when the sons of Jakob labour in the law, and keep the commandments, they will set the yoke of subjection on thy neck; but when the sons of Jakob withdraw themselves and study not the law, nor keep the commandments, behold, then shalt thou break their yoke of subjection from off thy neck.", "rashi": "<b>ועל חרבך.<\/b> כְּמוֹ בְּחַרְבְּךָ, יֵשׁ עַל בִּמְקוֹם בְּ', כְּמוֹ עֲמַדְתֶּם עַל חַרְבְּכֶם – בְּחַרְבְּכֶם; עַל צִבְאֹתָם – בְּצִבְאֹתָם:<br><br><b>תריד.<\/b> לְשׁוֹן צַעַר כְּמוֹ אָרִיד בְּשִׂיחִי, כְּלוֹמַר, כְּשֶׁיַּעַבְרוּ יִשְׂרָאֵל עַל הַתּוֹרָה וְיִהְיֶה לְךָ פִּתְחוֹן פֶּה לְהִצְטַעֵר עַל הַבְּרָכוֹת שֶׁנָּטַל, <b>ופרקת עלו וגומר<\/b>:", "rashi_en": "ועל חרבך—The phrase is equivalent to בחרבך BY THY SWORD. The word על is sometimes used instead of the prefix ב, as (Ezekiel 33:26) “Ye stand by your sword (על חרבכם)”, which is the same as בחרבכם; (Exodus 6:26) “by their hosts (על צבאותם), which is the same as בצבאותם.<br><br>AND והיה כאשר תריד AND IT SHALL CAME TO PASS THAT WHEN THOU ROVEST ABOUT — The word תריד signifies grief, pain, as (Psalms 55:3) “I am distraught (אריד) in my complaint”. It means: when Israel will transgress the Torah and you will have reason to feel aggrieved with regard to the Blessings, ופרקת עלו וגו THEN THOU SHALT PULL HIS YOKE FROM OFF THY NECK (Genesis Rabbah 67:7). "}, {"ch": 27, "v": 41, "aliyah": 6, "heb": "וַיִּשְׂטֹ֤ם עֵשָׂו֙ אֶֽת־יַעֲקֹ֔ב עַ֨ל־הַבְּרָכָ֔ה אֲשֶׁ֥ר בֵּרְכ֖וֹ אָבִ֑יו וַיֹּ֨אמֶר עֵשָׂ֜ו בְּלִבּ֗וֹ יִקְרְבוּ֙ יְמֵי֙ אֵ֣בֶל אָבִ֔י וְאַֽהַרְגָ֖ה אֶת־יַעֲקֹ֥ב אָחִֽי׃", "onk": "וּנְטַר עֵשָׂו דְּבָבוּ לְיַעֲקֹב עַל בִּרְכְּתָא דִּי בָרְכֵיהּ אֲבוּהִי וַאֲמַר עֵשָׂו בְּלִבֵּיהּ יִקְרְבוּן יוֹמֵי אֶבְלֵי דְאַבָּא וְאֶקְטוֹל יָת יַעֲקֹב אָחִי:", "onk_en": "Eisov hated Yaakov because of the blessing with which his father blessed him, and Eisov said in his heart, The mourning days for my father are approaching. I will then kill my brother, Yaakov.", "pj": "וְנָטַר עֵשָו שְנָא בְּלִבֵּיהּ עַל יַעֲקב אָחוּי עַל סֵדֶר בִּרְכָתָא דִי בָּרְכֵיהּ אָבוֹי וַאֲמַר עֵשָו בְּלִבֵּיהּ לֵית אֲנָא עָבִיד הֵיכְמָא דְעָבַד קַיִן דְקָטַל יַת הֶבֶל בְּחַיֵי אָבוּי וְהָדָר אָבוּי וְאוֹלִיד יַת שֵׁת בְּרַם מִתְעַכֵּב אֲנָא עַד זְמַן דְיִמְטוּן יוֹמֵי אֶבְלָא דְמִיתַת אַבָּא וּבְכֵן אֲנָא קָטִיל יַת יַעֲקב אָחִי וַאֲנָא מִשְׁתַּכַּח קָטִיל וְיָרִית", "pj_en": "And Esau kept hatred in his heart against Jakob his brother, on account of the order of blessing with which his father had blessed him. And Esau said in his heart, I will not do as Kain did, who slew Habel in the life (time) of his father, for which his father begat Sheth, but will wait till the time when the days of mourning for the death of my father come, and then will I kill Jakob my brother, and will be found the killer and the heir.", "tj": "", "tj_en": "", "rashi": "<b>יקרבו ימי אבל אבי.<\/b> כְּמִשְׁמָעוֹ, שֶׁלֹּא אֲצָעֵר אֶת אַבָּא, וּמִדְרְשֵׁי אַגָּדָה לְכַמָּה פָנִים יֵשׁ:", "rashi_en": "יקרבו ימי אבל אבי THE DAYS OF MOURNING FOR MY FATHER APPROACH — Explain it according to the evident meaning of the words — (I will wait to kill him until my father is dead), that I may not cause grief to my father. There are Midrashic explanations of various kinds. "}, {"ch": 27, "v": 42, "aliyah": 6, "heb": "וַיֻּגַּ֣ד לְרִבְקָ֔ה אֶת־דִּבְרֵ֥י עֵשָׂ֖ו בְּנָ֣הּ הַגָּדֹ֑ל וַתִּשְׁלַ֞ח וַתִּקְרָ֤א לְיַעֲקֹב֙ בְּנָ֣הּ הַקָּטָ֔ן וַתֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ עֵשָׂ֣ו אָחִ֔יךָ מִתְנַחֵ֥ם לְךָ֖ לְהׇרְגֶֽךָ׃", "onk": "וְאִתְחַוָּה לְרִבְקָה יָת פִּתְגָּמֵי עֵשָׂו בְּרַהּ רַבָּא וּשְׁלָחַת וּקְרַת לְיַעֲקֹב בְּרַהּ זְעֵירָא וַאֲמֶרֶת לֵיהּ הָא עֵשָׂו אָחוּךְ <b>כְּמִן לָךְ<\/b> לְמִקְטְלָךְ:", "onk_en": "Rivkah was informed about the words of Eisov, her older son, and she sent [a messenger] to call Yaakov, her younger son, and she said to him. Behold, your brother Eisov is consoled through you [<b>lying in wait for you<\/b>], [for he intends] to kill you.", "pj": "וְאִתְחַוָה לְרִבְקָה בְּרוּחַ קוֹדֶש יַת פִּתְגָמֵי עֵשָו בְּרָהּ רַבָּה דְחָשִׁיב בְּלִבֵּיהּ לְמִקְטוֹל לְיַעֲקב וְשָׁדְרַת וְקָרְאַת לְיַעֲקב בְּרָהּ זְעֵירָא וַאֲמַרַת לֵיהּ הָא עֵשָו אָחוּךְ כָּמִין לָךְ כָּמָן וּמִתְיַעֵט עֲלָךְ לְמִקְטְלָךְ", "pj_en": "And the words of Esau her elder son, who thought in his heart to kill Jakob, were shown by the Holy Spirit to Rivekah, and she sent, and called Jakob her younger son, and said to him, Behold, Esau thy brother lieth in wait for thee, and plotteth against thee to kill thee.", "tj": "", "tj_en": "", "rashi": "<b>ויגד לרבקה.<\/b> בְּרוּחַ הַקֹּדֶשׁ הֻגַּד לָהּ מַה שֶּׁעֵשָׂו מְהַרְהֵר בְּלִבּוֹ:<br><br><b>מתנחם לך.<\/b> נִחָם עַל הָאַחְוָה לַחֲשֹׁב מַחֲשָׁבָה אַחֶרֶת לְהִתְנַכֵּר לְךָ וּלְהָרְגְּךָ. וּמִדְרַשׁ אַגָּדָה כְּבָר אַתָּה מֵת בְּעֵינָיו וְשָׁתָה עָלֶיךָ כּוֹס שֶׁל תַּנְחוּמִים. וּלְפִי פְּשׁוּטוֹ לְשׁוֹן תַּנְחוּמִים, מִתְנַחֵם הוּא עַל הַבְּרָכוֹת בַּהֲרִיגָתְךָ:", "rashi_en": "ויגד לרבקה WERE TOLD TO REBEKAH — It was told her by the Holy Spirit what Esau was thinking in his heart (Genesis Rabbah 67:9).<br><br>מתנחם לך DOTH COMFORT HIMSELF CONCERNING THEE — He regrets the brotherly relationship existing between you, harbouring thoughts other than those of brotherhood, to estrange himself from you and to kill you. The Midrashic explanation  (Genesis Rabbah 67:9) is: In his eyes you are already regarded as dead and he has drunk for you (i. e. because he regards you as dead) the cup of consolation (which it was customary for near relatives of the deceased to drink). But according to the real meaning the word signifies “comforting” — he will comfort himself for the loss of the blessings by killing you. "}, {"ch": 27, "v": 43, "aliyah": 6, "heb": "וְעַתָּ֥ה בְנִ֖י שְׁמַ֣ע בְּקֹלִ֑י וְק֧וּם בְּרַח־לְךָ֛ אֶל־לָבָ֥ן אָחִ֖י חָרָֽנָה׃", "onk": "וּכְעַן בְּרִי <b>קַבֵּל<\/b> מִנִּי וְקוּם אִזֵיל לָךְ לְוַת לָבָן אָחִי לְחָרָן:", "onk_en": "Now my son listen to [<b>accept<\/b>] me. Get up and flee to Lavan, my brother, to Charan.", "pj": "וּכְדוּן בְּרִי קַבֵּיל מִינִי קוּם עֲרוֹק לָךְ לְנַפְשָׁךְ וְאִיזֵיל לְוַת לָבָן אָחִי לְחָרָן", "pj_en": "And now, my son, hearken to me: arise, escape for thy life, and go unto Laban my brother, at Haran,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 44, "aliyah": 6, "heb": "וְיָשַׁבְתָּ֥ עִמּ֖וֹ יָמִ֣ים אֲחָדִ֑ים עַ֥ד אֲשֶׁר־תָּשׁ֖וּב חֲמַ֥ת אָחִֽיךָ׃", "onk": "וְתֵתֵיב עִמֵּיהּ יוֹמִין זְעֵירִין עַד דִּיתוּב רוּגְזָא דְאָחוּךְ:", "onk_en": "Remain with him a short time until your brother’s fury has subsided.", "pj": "וְתֵיתִיב עִמֵיהּ יוֹמִין קַלִילִין עַד דִי תִשְׁדוֹךְ רִיתְחָא דְאָחוּךְ", "pj_en": "and dwell with him a few days, until the wrath of thy brother be abated,", "tj": "עַד זְמַן דְתַחֲזוֹר כּוּלְתֵיהּ דְאָחוּךְ מִינָךְ:", "tj_en": "Until the time when the bitterness of thy brother shall be turned away from thee.", "rashi": "<b>אחדים.<\/b> מֻעָטִים:", "rashi_en": "אחדים means A FEW."}, {"ch": 27, "v": 45, "aliyah": 6, "heb": "עַד־שׁ֨וּב אַף־אָחִ֜יךָ מִמְּךָ֗ וְשָׁכַח֙ אֵ֣ת אֲשֶׁר־עָשִׂ֣יתָ לּ֔וֹ וְשָׁלַחְתִּ֖י וּלְקַחְתִּ֣יךָ מִשָּׁ֑ם לָמָ֥ה אֶשְׁכַּ֛ל גַּם־שְׁנֵיכֶ֖ם י֥וֹם אֶחָֽד׃", "onk": "עַד דִּיתוּב רוּגְזָא דְאָחוּךְ מִנָּךְ וְיִתְנְשֵׁי יָת דִּי עֲבַדְתָּ לֵיהּ וְאֶשְׁלַח וְאֶדְבְּרִנָּךְ מִתַּמָּן לְמָה אֶתְכַּל אַף תַּרְוֵיכוֹן יוֹמָא חָד:", "onk_en": "Until your brother’s rage toward you has subsided, and he has forgotten what you did to him. I will then send [for you] and bring you [back] from there. Why should I lose both of you on one day?", "pj": "עַד דְנוּחַ רוּגְזָא דְאָחוּךְ מִינָךְ וְיִתְנְשֵׁי יַת מַה דְעָבַדְתָּ לֵיהּ וַאֲשַׁדֵר וְאִידְבְּרִינָךְ מִתַּמָן לָמָה אֶתְכַּל אוּף תַּרְוֵיכוֹן יוֹמָא חָד דְאַנְתְּ מִתְקְטֵיל וְהוּא מִטְרַד הֵיכְמָא דְאִתְכְּלַת חַוָה מִן הֶבֶל דְקַטְלֵיהּ קַיִן וְאִטְרִדָן תַּרְוֵיהוֹן מִן אַפֵּי אָדָם וְחַוָה כָּל יוֹמֵי חַיֵיהוֹם דְאָדָם וְחַוָה", "pj_en": "until thy brother's anger have quieted from thee, and he have forgotten what thou hast done to him; and I will send and take thee from thence. Why should I be bereaved of you both in one day: thou being slain, and he driven forth, as Hava was bereaved of Habel, whom Kain slew, and both were removed from before Adam and Hava all the days of the life of Adam and Hava?", "tj": "", "tj_en": "", "rashi": "<b>למה אשכל.<\/b> אֶהְיֶה שַׁכּוּלָה מִשְּׁנֵיכֶם. הַקּוֹבֵר אֶת בָּנָיו קָרוּי שַׁכּוּל, וְכֵן בְּיַעֲקֹב אָמַר כַּאֲשֶׁר שָׁכֹלְתִּי שָׁכָלְתִּי:<br><br><b>גם שניכם.<\/b> אִם יָקוּם עָלֶיךָ וְאַתָּה תַּהַרְגֶנּוּ יַעַמְדוּ בָנָיו וְיַהַרְגוּךָ; וְרוּחַ הַקֹּדֶשׁ נִזְרְקָה בָהּ וְנִתְנַבְּאָה שֶׁבְּיוֹם א' יָמוּתוּ, כְּמוֹ שֶׁמְּפֹרָשׁ בְּפֶרֶק הַמְקַנֵּא לְאִשְׁתּוֹ:", "rashi_en": "למה אשכל means WHY SHOULD I BE BEREAVED משניכם OF BOTH OF YOU? — The one who buries his children is termed שכול bereaved: so we find in the case of Jacob (43:14), “If I am to be bereaved (שכלתי) let me be bereaved”.<br><br>גם שניכם OF YOU BOTH — If he attacks you and you kill him his children will rise and kill you. The Holy Spirit poured itself forth upon her and she prophesied (had a presage) that they would both die on one day just as it is stated in the Chapter המקנה לאשתו (Sotah 13a)."}, {"ch": 27, "v": 46, "aliyah": 6, "heb": "וַתֹּ֤אמֶר רִבְקָה֙ אֶל־יִצְחָ֔ק <small>קַ֣<\/small>צְתִּי בְחַיַּ֔י מִפְּנֵ֖י בְּנ֣וֹת חֵ֑ת אִם־לֹקֵ֣חַ יַ֠עֲקֹ֠ב אִשָּׁ֨ה מִבְּנֽוֹת־חֵ֤ת כָּאֵ֙לֶּה֙ מִבְּנ֣וֹת הָאָ֔רֶץ לָ֥מָּה לִּ֖י חַיִּֽים׃", "onk": "וַאֲמֶרֶת רִבְקָה לְיִצְחָק עָקִית בְּחַיַּי מִן קֳדָם בְּנַת חִתָּאָה אִם נְסִיב יַעֲקֹב אִתְּתָא מִבְּנַת חִתָּאָה כְאִלֵּין מִבְּנַת אַרְעָא לְמָה לִי חַיִּים:", "onk_en": "Rivkah said to Yitzchok, I am disgusted with my life because of the daughters of Cheis. If Yaakov marries a woman of the daughters of Cheis, like these, from the daughters of the land, what is life [worth] to me.", "pj": "וַאֲמָרַת רִבְקָה לְיִצְחָק אִיתְעָקִית בְּחַיַי מִן קֳדָם רְגוּז בְּנַת חֵת אִין נְסִיב יַעֲקב אִיתָא רְשִׁיעֲתָא מִבְּנַת חֵת כְּאִלֵין מִבְּנַתְהוֹן דְעַמָא דְאַרְעָא לָמָה לִי חַיִין", "pj_en": "And Rivekah said to Izhak, I am afflicted in my life on account of the indignity of the daughters of Heth. If Jakob take a wicked wife from the daughters of Heth, such as these of the daughters of the people of the land, what will life be to me?", "tj": "", "tj_en": "", "rashi": "<b>קצתי בחיי.<\/b> מָאַסְתִּי בְחַיַּי:", "rashi_en": "קצתי בחיי means I AM DISGUSTED WITH MY LIFE."}, {"ch": 28, "v": 1, "aliyah": 6, "heb": "וַיִּקְרָ֥א יִצְחָ֛ק אֶֽל־יַעֲקֹ֖ב וַיְבָ֣רֶךְ אֹת֑וֹ וַיְצַוֵּ֙הוּ֙ וַיֹּ֣אמֶר ל֔וֹ לֹֽא־תִקַּ֥ח אִשָּׁ֖ה מִבְּנ֥וֹת כְּנָֽעַן׃", "onk": "וּקְרָא יִצְחָק לְיַעֲקֹב וּבָרִיךְ יָתֵיהּ וּפַקְּדֵיהּ וַאֲמַר לֵיהּ לָא תִסַּב אִתְּתָא מִבְּנַת כְּנָעַן:", "onk_en": "Yitzchok called Yaakov and blessed him. He commanded him and said to him, Do not marry a woman of the daughters of Canaan.", "pj": "וּקְרָא יִצְחָק לְיַעֲקב וּבָרִיךְ יָתֵיהּ וּפַקְדֵיהּ וַאֲמַר לֵיהּ לָא תִסַב אִיתָא מִבְּנַתְהוֹם דִכְנַעֲנָאֵי", "pj_en": "And Izhak called Jakob, and blessed him, and commanded him, and said to him, Thou shalt not take a wife from the daughters of the Kenaanaee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 2, "aliyah": 6, "heb": "ק֥וּם לֵךְ֙ פַּדֶּ֣נָֽה אֲרָ֔ם בֵּ֥יתָה בְתוּאֵ֖ל אֲבִ֣י אִמֶּ֑ךָ וְקַח־לְךָ֤ מִשָּׁם֙ אִשָּׁ֔ה מִבְּנ֥וֹת לָבָ֖ן אֲחִ֥י אִמֶּֽךָ׃", "onk": "קוּם אִזֵּיל לְפַדַּן אֲרָם לְבֵית בְּתוּאֵל אֲבוּהָא דְאִמָּךְ וְסַב לָךְ מִתַּמָּן אִתְּתָא מִבְּנַת לָבָן אֲחוּהָא דְאִמָּךְ:", "onk_en": "Set out and go to Padan Aram, to the house of Besueil, your mother’s father, and marry one of the daughters of Lavan, your mother’s brother.", "pj": "קוּם אִיזֵיל לְפַדַן דַאֲרָם לְבֵית בְּתוּאֵל אָבוּהָא דְאִמָךְ וְסַב לָךְ מִתַּמָן אִיתָּא מִבְּנַת לָבָן אָחוּהָא דְאִמָךְ", "pj_en": "Arise, go to Padan of Aram, to the house of Bethuel thy mother's father, and take thee from thence a wife from the daughters of Laban mother's brother.", "tj": "", "tj_en": "", "rashi": "<b>פדנה.<\/b> כְּמוֹ לְפַדָּן:<br><br><b>ביתה בתואל.<\/b> לְבֵית בְּתוּאֵל, כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְחִלָּתָהּ הֵטִיל לָהּ הֵ\"א בְּסוֹפָהּ (יבמות י\"ג):", "rashi_en": "פדנה is the same as לפדן to Padan;<br><br>ביתה בתואל is the same as לבית בתואל to the house of Bethuel. To every word requiring a ל prefixed you may attach a ה as a suffix (Yevamot 13b)."}, {"ch": 28, "v": 3, "aliyah": 6, "heb": "וְאֵ֤ל שַׁדַּי֙ יְבָרֵ֣ךְ אֹֽתְךָ֔ וְיַפְרְךָ֖ וְיַרְבֶּ֑ךָ וְהָיִ֖יתָ לִקְהַ֥ל עַמִּֽים׃", "onk": "וְאֵל שַׁדַּי יְבָרֵךְ יָתָךְ וְיַפְּשָׁךְ וְיַסְגִּנָּךְ וּתְהֵי לְכִנְשַׁת <b>שִׁבְטִין<\/b>:", "onk_en": "May the Almighty, Shaddai, bless you, make you fruitful and multiply you. May you become an assembly of peoples [<b>tribes<\/b>].", "pj": "וְאֵל שַׁדַי יְבָרֵךְ יָתָךְ בְּנִיכְסִין סַגִיאִין וְיַפְשִׁינָךְ וְיַסְגִינָךְ לִתְלֵיסַר שִׁבְטִין וּתְהֵי זָכִי לְכִנְשַׁת דִבְנֵי סַנְהֶדְרִין דִסְכוּמְהוֹן שׁוּבְעִין כְּמִנְיָינָא עַמְמַיָא", "pj_en": "And El Shadai will bless thee with many possessions, and increase thee and multiply thee into twelve tribes, and thou shalt be worthy of the congregation of the sons of the Sanhedrin, the sum of which is seventy, according to the number of the nations.", "tj": "", "tj_en": "", "rashi": "<b>ואל שדי.<\/b> מִי שֶׁדַּי בְּבִרְכוֹתָיו לַמִּתְבָּרְכִין מִפִּיו, <b>יברך אותך<\/b>:", "rashi_en": "ואל שדי AND GOD ALMIGHTY —He who has a sufficiency of blessings שָׁדִּי for those who are blessed by Him, יברך אתך MAY HE BLESS THEE. "}, {"ch": 28, "v": 4, "aliyah": 6, "heb": "וְיִֽתֶּן־לְךָ֙ אֶת־בִּרְכַּ֣ת אַבְרָהָ֔ם לְךָ֖ וּלְזַרְעֲךָ֣ אִתָּ֑ךְ לְרִשְׁתְּךָ֙ אֶת־אֶ֣רֶץ מְגֻרֶ֔יךָ אֲשֶׁר־נָתַ֥ן אֱלֹהִ֖ים לְאַבְרָהָֽם׃", "onk": "וְיִתֶּן לָךְ יָת בִּרְכְּתָא דְאַבְרָהָם לָךְ וְלִבְנָךְ עִמָּךְ לְמֵירְתָךְ יָת אֲרַע תּוֹתָבוּתָךְ דִּי יְהַב יְיָ לְאַבְרָהָם:", "onk_en": "May He give you the blessing of Avraham, to you and to your descendants with you, that you may inherit the land of your dwelling which God gave to Avraham.", "pj": "וְיִתֶּן לָךְ יַת בִּרְכָתָא דְאַבְרָהָם לָךְ וְלִבְנָךְ עִמָךְ וְתַיְיבִינָךְ לְמֵירְתָךְ יַת אֲרַע תּוֹתָבוּתָךְ דִי יְהַב יְיָ לְאַבְרָהָם", "pj_en": "And He will give the blessing of Abraham to thee, and to thy sons with thee, and cause thee to inherit the land of thy sojourning, which he gave unto Abraham.", "tj": "", "tj_en": "", "rashi": "<b>את ברכת אברהם.<\/b> שֶׁאָמַר לוֹ וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל וְהִתְבָּרְכוּ בְזַרְעֲךָ יִהְיוּ אוֹתָן בְּרָכוֹת אֲמוּרוֹת בִּשְׁבִילְךָ – מִמְּךָ יֵצֵא אוֹתוֹ הַגּוֹי וְאוֹתוֹ הַזֶּרַע הַמְבֹרָךְ:", "rashi_en": "את ברכת אברהם THE BLESSING OF ABRAHAM, (i. e. the blessing which He gave to (Abraham) to whom He promised, (12:2) “and I will make of thee a great nation”, and (26:4) “and all the nations shall bless themselves by thy seed”: may these blessings have been said regarding you — may that great nation and that blessed seed issue from you. "}, {"ch": 28, "v": 5, "aliyah": 7, "heb": "וַיִּשְׁלַ֤ח יִצְחָק֙ אֶֽת־יַעֲקֹ֔ב וַיֵּ֖לֶךְ פַּדֶּ֣נָֽה אֲרָ֑ם אֶל־לָבָ֤ן בֶּן־בְּתוּאֵל֙ הָֽאֲרַמִּ֔י אֲחִ֣י רִבְקָ֔ה אֵ֥ם יַעֲקֹ֖ב וְעֵשָֽׂו׃", "onk": "וּשְׁלַח יִצְחָק יָת יַעֲקֹב וַאֲזַל לְפַדַּן אֲרָם לְוַת לָבָן בַּר בְּתוּאֵל אֲרַמָּאָה אֲחוּהָא דְרִבְקָה אִמֵּיהּ דְּיַעֲקֹב וְעֵשָׂו:", "onk_en": "Yitzchok sent Yaakov on his way, and he went to Paddan Aram, to Lavan, son of Besueil the Aramean, the brother of Rivkah, mother of Yaakov and Eisov.", "pj": "וְשָׁדַר יִצְחָק יַת יַעֲקב וְאָזַל לְפַדַן אֲרָם לְוַת לָבָן בַּר בְּתוּאֵל אֲרַמָאָה אָחוּהָא דְרִבְקָה אִימָא דְיַעֲקב וְעֵשָו", "pj_en": "And Izhak sent Jakob away, and he went to Padan Aram unto Laban bar Bethuel the Armaite, the brother of Rivekah the mother of Jakob and Esau.", "tj": "", "tj_en": "", "rashi": "<b>אם יעקב ועשו.<\/b> אֵינִי יוֹדֵעַ מַה מְּלַמְּדֵנוּ:", "rashi_en": "אם יעקב ועשו MOTHER OF JACOB AND ESAU — I do not know what the addition of these words is intended to tell us. "}, {"ch": 28, "v": 6, "aliyah": 7, "heb": "וַיַּ֣רְא עֵשָׂ֗ו כִּֽי־בֵרַ֣ךְ יִצְחָק֮ אֶֽת־יַעֲקֹב֒ וְשִׁלַּ֤ח אֹתוֹ֙ פַּדֶּ֣נָֽה אֲרָ֔ם לָקַֽחַת־ל֥וֹ מִשָּׁ֖ם אִשָּׁ֑ה בְּבָרְכ֣וֹ אֹת֔וֹ וַיְצַ֤ו עָלָיו֙ לֵאמֹ֔ר לֹֽא־תִקַּ֥ח אִשָּׁ֖ה מִבְּנ֥וֹת כְּנָֽעַן׃", "onk": "וַחֲזָא עֵשָׂו אֲרֵי בָרִיךְ יִצְחָק יָת יַעֲקֹב וְשַׁלַּח יָתֵיהּ לְפַדַּן אֲרָם לְמִסַּב לֵיהּ מִתַּמָּן אִתְּתָא כַּד בָּרִיךְ יָתֵיהּ וּפַקִּיד עֲלוֹהִי לְמֵימַר לָא תִסַּב אִתְּתָא מִבְּנַת כְּנָעַן:", "onk_en": "Eisov saw that Yitzchok blessed Yaakov, and sent him to Paddan Aram, to find a wife there; and as he blessed him, he commanded him saying, Do not take a wife from the daughters of Canaan.", "pj": "וַחֲמָא עֵשָו אֲרוּם בְּרִיךְ יִצְחָק יַת יַעֲקב וְשָׁדַר יָתֵיהּ לְפַדַן אֲרָם לְמֵיסַב לֵיהּ מִתַּמָן אִיתָא כַּד בְּרִיךְ יָתֵיהּ וּפַקֵיד עֲלוֹי לְמֵימָר לָא תִיסַב אִיתָא מִבְּנַתְהוֹן דִכְנַעֲנָאֵי", "pj_en": "And Esau considered that Izhak had blessed Jakob, and had sent him to Padan Aram to take to him from thence a wife, when he blessed him, and commanded him, saying, Thou shalt not take a wife of the daughters of the Kenaanites;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 7, "aliyah": 7, "heb": "וַיִּשְׁמַ֣ע יַעֲקֹ֔ב אֶל־אָבִ֖יו וְאֶל־אִמּ֑וֹ וַיֵּ֖לֶךְ פַּדֶּ֥נָֽה אֲרָֽם׃", "onk": "<b>וְקַבִּיל<\/b> יַעֲקֹב מִן אֲבוּהִי וּמִן אִמֵּיהּ וַאֲזַל לְפַדַּן אֲרָם:", "onk_en": "And Yaakov listened to [<b>accepted<\/b>] his father and mother, and went to Paddan Aram.", "pj": "וְקַבֵּיל יַעֲקב בְּמֵימַר אָבוֹי וּבְמֵימַר אִימֵהּ וַאֲזַל לְפַדַן אֲרָם", "pj_en": "and that Jakob obeyed the word of his father, and the word of his mother, and was gone to Padan Aram:", "tj": "", "tj_en": "", "rashi": "<b>וישמע יעקב.<\/b> מְחֻבָּר לָעִנְיָן שֶׁל מַעְלָה, וַיַּרְא עֵשָׂו כִּי בֵרַךְ יִצְחָק וְגוֹ' וְכִי שִׁלַּח אוֹתוֹ פַּדֶּנָה אֲרָם, וְכִי שָׁמַע יַעֲקֹב אֶל אָבִיו וְהָלַךְ פַּדֶּנָה אֲרָם, וְכִי רָעוֹת בְּנוֹת כְּנַעַן, וְהָלַךְ גַּם הוּא אֶל יִשְׁמָעֵאל:", "rashi_en": "וישמע יעקב AND THAT JACOB HEARKENED — This is to be connected with the proceeding statement, (v. 6) thus: And when Esau saw that Isaac had blessed Jacob and that he had sent him away to Padan-aram … and that Jacob had hearkened to his father and had gone to Padan-aram and that the daughters of Canaan were evil … then he also determined to take a wife from his own family and went to Ishmael. "}, {"ch": 28, "v": 8, "aliyah": 7, "heb": "וַיַּ֣רְא עֵשָׂ֔ו כִּ֥י רָע֖וֹת בְּנ֣וֹת כְּנָ֑עַן בְּעֵינֵ֖י יִצְחָ֥ק אָבִֽיו׃", "onk": "וַחֲזָא עֵשָׂו אֲרֵי בִישָׁא בְּנַת כְּנָעַן בְּעֵינֵי יִצְחָק אֲבוּהִי:", "onk_en": "Eisov [thus] realized t
