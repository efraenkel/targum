hat the daughters of Canaan were evil in the eyes of Yitzchok, his father.", "pj": "וַחֲמָא עֵשָו אֲרוּם בִּישַׁן בְּנַתְהוֹן דִכְנַעֲנָאֵי קֳדָם יִצְחָק אָבוּי", "pj_en": "and Esau considered that the daughters of Kenaan were evil before Izhak his father,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 9, "aliyah": 7, "heb": "וַיֵּ֥לֶךְ עֵשָׂ֖ו אֶל־יִשְׁמָעֵ֑אל וַיִּקַּ֡ח אֶֽת־מָחֲלַ֣ת&thinsp;<b>׀<\/b> בַּת־יִשְׁמָעֵ֨אל בֶּן־אַבְרָהָ֜ם אֲח֧וֹת נְבָי֛וֹת עַל־נָשָׁ֖יו ל֥וֹ לְאִשָּֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲזַל עֵשָׂו לְוַת יִשְׁמָעֵאל וּנְסִיב יָת מַחֲלַת בַּת יִשְׁמָעֵאל בַּר אַבְרָהָם אֲחָתֵיהּ דִּנְבָיוֹת עַל נְשׁוֹהִי לֵיהּ לְאִנְתּוּ:", "onk_en": "Eisov [then] went to Yishmael, and took Mochalas, the daughter of Yishmael, the son of Avraham and sister of Nevayos, in addition to his other wives, for a wife.", "pj": "וַאֲזַל עֵשָו לְוַת יִשְׁמָעֵאל וּנְסֵיב יַת מָחֲלַת הִיא בָּשְמַת בַּת יִשְׁמָעֵאל בַּר אַבְרָהָם אַחֲתֵיהּ דִנְבָיוֹת מִן אִמֵיהּ עַל נְשׁוֹי לֵיהּ לְאִנְתּוּ", "pj_en": "and Esau went unto Ishmael, and took to wife Mahalath, who is Besemath the daughter of Ishmael bar Abraham, the sister of Nebaioth from his mother, besides his other wives.", "tj": "", "tj_en": "", "rashi": "<b>אחות נביות.<\/b> מִמַּשְׁמָע שֶׁנֶּאֱמַר בַּת יִשְׁמָעֵאל אֵינִי יוֹדֵעַ שֶׁהִיא אֲחוֹת נְבָיוֹת? אֶלָּא לָמַדְנוּ שֶׁמֵּת יִשְׁמָעֵאל מִשֶּׁיְּעָדָהּ לְעֵשָׂו קֹדֶם נִשּׂוּאֶיהָ וְהִשִּׂיאָהּ נְבָיוֹת אָחִיהָ, וְלָמַדְנוּ שֶׁהָיָה יַעֲקֹב בְּאוֹתוֹ הַפֶּרֶק בֶּן ס\"ג שָׁנִים, שֶׁהֲרֵי יִשְׁמָעֵאל בֶּן ע\"ד שָׁנִים הָיָה כְּשֶׁנּוֹלַד יַעֲקֹב, י\"ד שָׁנָה הָיָה גָדוֹל יִשְׁמָעֵאל מִיִּצְחָק, וְיִצְחָק בֶּן ס' שָׁנָה בְּלֶדֶת אוֹתָם הֲרֵי ע\"ד, וּשְׁנוֹתָיו הָיוּ קל\"ז, שֶׁנֶּאֱמַר וְאֵלֶּה שְׁנֵי חַיֵּי יִשְׁמָעֵאל וְגוֹ', נִמְצָא יַעֲקֹב כְּשֶׁמֵּת יִשְׁמָעֵאל בֶּן ס\"ג שָׁנִים הָיָה, וְלָמַדְנוּ מִכָּאן שֶׁנִּטְמַן בְּבֵית עֵבֶר י\"ד שָׁנָה וְאַחַר כָּךְ הָלַךְ לְחָרָן, שֶׁהֲרֵי לֹא שָׁהָה בְּבֵית לָבָן לִפְנֵי לֵדָתוֹ שֶׁל יוֹסֵף אֶלָּא י\"ד שָׁנָה, שֶׁנֶּאֱמַר עֲבַדְתִּיךָ אַרְבַּע עֶשְׂרֵה שָׁנָה בִּשְׁתֵּי בְנֹתֶיךָ וְשֵׁשׁ שָׁנִים בְּצֹאנֶךָ, וּשְׂכַר הַצֹּאן מִשֶּׁנּוֹלַד יוֹסֵף הָיָה, שֶׁנֶּאֱמַר וַיְהִי כַּאֲשֶׁר יָלְדָה רָחֵל אֶת יוֹסֵף וְגוֹ'; וְיוֹסֵף בֶּן ל' שָׁנָה הָיָה כְּשֶׁמָּלַךְ, וּמִשָּׁם עַד שֶׁיָּרַד יַעֲקֹב לְמִצְרַיִם ט' שָׁנִים, ז' שֶׁל שָׂבָע וּב' שֶׁל רָעָב, וְיַעֲקֹב אָמַר לְפַרְעֹה יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה – צֵא וַחֲשֹׁב י\"ד שֶׁלִּפְנֵי לֵדַת יוֹסֵף וּשְׁלֹשִׁים שֶׁל יוֹסֵף וְתֵשַׁע מִשֶּׁמָּלַךְ עַד שֶׁבָּא יַעֲקֹב, הֲרֵי נ\"ג, וּכְשֶׁפֵּרֵשׁ מֵאָבִיו הָיָה בֶּן ס\"ג, הֲרֵי קי\"ו, וְהוּא אוֹמֵר שְׁלֹשִׁים וּמְאַת שָׁנָה, הֲרֵי חֲסֵרִים י\"ד שָׁנִים, הָא לָמַדְתָּ שֶׁאַחַר שֶׁקִּבֵּל הַבְּרָכוֹת נִטְמַן בְּבֵית עֵבֶר י\"ד שָׁנִים, אֲבָל לֹא נֶעֱנַשׁ בִּזְכוּת הַתּוֹרָה; שֶׁהֲרֵי לֹא פֵּרֵשׁ יוֹסֵף מֵאָבִיו אֶלָּא כ\"ב שָׁנָה, דְּהַיְנוּ מִי\"ז עַד ל\"ט, כְּנֶגֶד כ\"ב שֶׁפֵּרֵשׁ יַעֲקֹב מֵאָבִיו וְלֹא כִבְּדוֹ, וְהֵם כ' שָׁנִים בְּבֵית לָבָן וּשְׁתֵּי שָׁנִים שֶׁשָּׁהָה בַדֶּרֶךְ, כְּדִכְתִיב וַיִּבֶן לוֹ בָּיִת וּלְמִקְנֵהוּ עָשָׂה סֻכֹּת, וּפֵר' רַזִ\"לִ מִזֶּה הַפָּסוּק שֶׁשָּׁהָה י\"ח חֳדָשִׁים בַּדֶּרֶךְ – דְּבַיִת הֲוָה בִּימוֹת הַגְּשָׁמִים וְסֻכֹּת הֲווּ בִּימוֹת הַחַמָּה – וּלְחֶשְׁבּוֹן הַפְּסוּקִים שֶׁחָשַׁבְנוּ לְעֵיל מִשֶּׁפֵּרֵשׁ מֵאָבִיו עַד שֶׁיָּרַד לְמִצְרַיִם שֶׁהָיָה בֶּן ק\"ל שָׁנִים, שֶׁשָּׁם אָנוּ מוֹצְאִים עוֹד י\"ד שָׁנִים – אֶלָּא וַדַּאי נִטְמַן בְּבֵית עֵבֶר בַּהֲלִיכָתוֹ לְבֵית לָבָן לִלְמֹד תּוֹרָה מִמֶּנּוּ, וּבִשְׁבִיל זְכוּת הַתּוֹרָה לֹא נֶעֱנַשׁ עֲלֵיהֶם וְלֹא פֵּרֵשׁ יוֹסֵף מִמֶּנּוּ אֶלָּא כ\"ב שָׁנָה – מִדָּה כְּנֶגֶד מִדָּה – עַ\"כַּ בְּרַשִׁ\"י יָשָׁן:<br><br><b>על נשיו.<\/b> הוֹסִיף רִשְׁעָה עַל רִשְׁעָתוֹ, שֶׁלֹּא גֵרֵשׁ אֶת הָרִאשׁוֹנוֹת:", "rashi_en": "אחות נביות THE SISTER OF NEBAIOTH — By a logical inference from what is stated that she was “the daughter of Ishmael” would I not know that she was the sister of Nebaioth? But the words are added to tell us that Ishmael died after he had betrothed her to Esau and before her marriage, and that her brother Nebaioth gave her away in marriage And we may learn, also, that Jacob was at that period sixty-three years old  For Ishmael was seventy-four years old when Jacob was born — since Ishmael was fourteen years older than Isaac, and Isaac was sixty when they (Jacob and Esau) were born, making seventy-four and his (Ishmael’s) years were one hundred and thirty seven — as it is said (25:17) “And these are the years of Ishmael etc.” — consequently when Ishmael died Jacob was sixty-three years old. We learn from this that he (Jacob) concealed himself in Eber’s School for fourteen years and only after that did he proceed to Haran. For before Joseph’s birth he had stayed in Laban’s house only fourteen years, as it is said (31:41) “I served thee fourteen years for thy two daughters and six years for thy flock”, and he received the sheep as wages only after Joseph was born, for it is said (30:25) “And it came to pass when Rachel had borne Joseph etc. [that Jacob wished to leave Laban and he agreed to remain with him on condition of receiving certain sheep as wages]. Now Joseph was thirty years old when he became ruler in Egypt, and from then until the time that Jacob came down to Egypt was nine years — seven of plenty and two of famine — and Jacob then said to Pharaoh (47:9), “The days of the years of my pilgrimage are a hundred and thirty years”. Go and calculate: the fourteen years he passed with Laban before Joseph’s birth, and the thirty years of Joseph’s life before he became ruler and the nine years from when he became ruler until the time that Jacob came to Egypt make fifty three years from the time he joined Laban until the time he came to Egypt But when he parted from his father he was sixty-three years old, as shown above, so that you have 116 years as his age when he came to Egypt, on the assumption that the fifty-three years he spent with Laban etc. began immediately after he had left his father. But he (Jacob) himself said to Pharaoh, “[I am] one hundred and thirty years”. So you see that fourteen years are missing on this assumption. Thus you learn that after he had received the blessings he concealed himself in Eber’ School for fourteen years (Megillah 17a). But he received no punishment for them (these fourteen years) on account of the merit of having studied the Torah in Eber’s School during that period For Joseph was separated from his father only twenty-two years — that is, from the age of seventeen to that of thirty-nine - corresponding to the twenty-two years during which Jacob was separated from his father and could not perform the duty of honouring him (by actively attending to his needs), viz, the twenty years he spent in Laban's house and the two years he passed in travelling home - for it is written (33:17) with regard to his journey homewards, \"And Jacob built him a house and made booths for his cattle\", and our Rabbis, of blessed memory, inferred (Megillah 17a) from this verse that during his travels he passed eighteen months at Succoth, since a house means a dwelling for the rainy season, and \"booths\" means for the summer time. And this statement that the study of the Torah protects one from punishment fits in with the calculation which we made above, based upon the Sacred Text, regarding the period from when he left his father until the time when he went down to Egypt at the age of 130 years, where we found a surplus of 14 years, so that he must have been absent from his father for 36 years. But we may regard it as certain that when on his journey to Laban he concealed himself in Eber's house it was for the purpose of studying the Torah with him and that because of the merit of studying the Torah he received no punishment for them (those fourteen years) so that Joseph was separated from him only twenty-two years \"measure for measure\"(Megillah 17a). Thus far (beginning at \"But he received no punishment\") is found in an old Rashi text.<br><br>על נשיו BESIDES HIS FORMER WIVES — He added wickedness to wickedness for he did not divorce his first wives (Genesis Rabbah 67:13).  "}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
