<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "sh-lach";
const DATA = [{"ch": 13, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying;", "pj": "וידבר וּמלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "AND the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 2, "aliyah": 1, "heb": "שְׁלַח־לְךָ֣ אֲנָשִׁ֗ים וְיָתֻ֙רוּ֙ אֶת־אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁר־אֲנִ֥י נֹתֵ֖ן לִבְנֵ֣י יִשְׂרָאֵ֑ל אִ֣ישׁ אֶחָד֩ אִ֨ישׁ אֶחָ֜ד לְמַטֵּ֤ה אֲבֹתָיו֙ תִּשְׁלָ֔חוּ כֹּ֖ל נָשִׂ֥יא בָהֶֽם׃", "onk": "שְׁלַח לָךְ גֻּבְרִין וִיאַלְּלוּן יָת אַרְעָא דִכְנַעַן דִּי אֲנָא יָהֵב לִבְנֵי יִשְׂרָאֵל גַּבְרָא חַד גַּבְרָא חַד לְשִׁבְטָא דַאֲבָהָתוֹהִי תְּשַׁלְּחוּן כֹּל רַבָּא דִבְהוֹן:", "onk_en": "“Send, for yourself, men, and have them scout the Land of Cana’an, which I am giving to Bnei Yisroel; one man, one man each, for his father’s tribe you shall send them, each leader among them.”", "pj": "שְׁלַח לָךְ גוּבְרִין חַרִיפִין וִיאַלְלוּן יַת אַרְעָא דִכְנַעַן דַאֲנָא יָהֵיב לִבְנֵי יִשְרָאֵל גַבְרָא חָד גַבְרָא חָד לְשִׁבְטָא דְאַבְהָתוֹי תְּשַׁלְחוּן מִן קֳדָם כָּל אַמַרְכּוֹל דִבְהוֹן", "pj_en": "Send thou keen-sighted men who may explore the land of Kenaan, which I will give to the children of Israel; one man for each tribe of their fathers, thou shalt send from the presence of all their leaders.", "tj": "", "tj_en": "", "rashi": "<b>שלח לך אנשים.<\/b> לָמָּה נִסְמְכָה פָרָשַׁת מְרַגְּלִים לְפָרָשַׁת מִרְיָם? לְפִי שֶׁלָּקְתָה עַל עִסְקֵי דִבָּה, שֶׁדִּבְּרָה בְאָחִיהָ, וּרְשָׁעִים הַלָּלוּ רָאוּ וְלֹא לָקְחוּ מוּסָר (תנחומא):<br><br><b>שלח לך.<\/b> לְדַעְתְּךָ, אֲנִי אֵינִי מְצַוֶּה לְךָ, אִם תִּרְצֶה שְׁלַח; לְפִי שֶׁבָּאוּ יִשְׂרָאֵל וְאָמְרוּ נִשְׁלְחָה אֲנָשִׁים לְפָנֵינוּ, כְּמָה שֶׁנֶּאֱמַר \"וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם\" וְגוֹ' (דברים א'), וּמֹשֶׁה נִמְלַךְ בִּשְׁכִינָה, אָמַר, אָמַרְתִּי לָהֶם שֶׁהִיא טוֹבָה, שֶׁנֶּאֱמַר \"אַעֲלֶה אֶתְכֶם מֵעֳנִי מִצְרַיִם\" וְגוֹ' (שמות ג'), חַיֵּיהֶם שֶׁאֲנִי נוֹתֵן לָהֶם מָקוֹם לִטְעוֹת בְּדִבְרֵי מְרַגְּלִים, לְמַעַן לֹא יִירָשׁוּהָ (תנחומא):", "rashi_en": "שלח לך אנשים SEND THOU MEN — Why is the section dealing with the spies put in juxtaposition with the section dealing with Miriam’s punishment? To show the grievousness of the spies’ sin: because she (Miriam) was punished on account of the slander which she uttered against her brother, and these sinners witnessed it and yet they did not take a lesson from her (Midrash Tanchuma, Sh'lach 5).<br><br>שלח לך SEND THEE (more lit., for thyself) — i.e. according to your own judgement: I do not command you, but if you wish to do so send them. — God said this because the Israelites came to Moses and said. “We will send men before us etc.”, as it is said, (Deuteronomy 1:22): “And you approached me, all of you, [saying, We will send men, etc.]”, and Moses took counsel with the Shechinah (the Lord), whereupon He said to them, I have told them long ago that it (the land) is good, as it is said, (Exodus 3:17): “I will bring you up out of the affliction of Egypt … [unto a land flowing with milk and honey]”. By their lives! I swear that I will give them now an opportunity to fall into error through the statements of the spies, so that they should not come into possession of it (the land) (Sotah 34b; cf. also Rashi on Sotah 34b:8 מדעתך and Midrash Tanchuma, Sh'lach 5)."}, {"ch": 13, "v": 3, "aliyah": 1, "heb": "וַיִּשְׁלַ֨ח אֹתָ֥ם מֹשֶׁ֛ה מִמִּדְבַּ֥ר פָּארָ֖ן עַל־פִּ֣י יְהֹוָ֑ה כֻּלָּ֣ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי־יִשְׂרָאֵ֖ל הֵֽמָּה׃", "onk": "וּשְׁלַח יָתְהוֹן משֶׁה מִמַּדְבְּרָא דְפָארָן עַל מֵימְרָא דַיְיָ כֻּלְּהוֹן גֻּבְרִין רֵישֵׁי בְנֵי יִשְׂרָאֵל אִנּוּן:", "onk_en": "Moshe sent them from the desert of Paran by the word of Adonoy; all of them [were] men of distinction, they were the heads of Bnei Yisroel.", "pj": "וְשַׁדַר יַתְהוֹן משֶׁה מִמַדְבְּרָא דְפָארָן עַל פּוּם מֵימְרָא דַיְיָ כֻּלְהוֹן גוּבְרִין חֲרִיפִין דְמִתְמְנָן רֵישֵׁי עַל בְּנֵי יִשְרָאֵל הִינוּן", "pj_en": "And Mosheh sent them from the wilderness of Pharan, according to the mouth of the Word of the Lord; all of them acute men, who had been appointed heads over the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>על פי ה'.<\/b> בִּרְשׁוּתוֹ, שֶׁלֹּא עִכֵּב עַל יָדוֹ:<br><br><b>כלם אנשים.<\/b> כָּל אֲנָשִׁים שֶׁבַּמִּקְרָא לְשׁוֹן חֲשִׁיבוּת, וְאוֹתָהּ שָׁעָה כְּשֵׁרִים הָיוּ:", "rashi_en": "'על פי ה With His consent; i.e. that He did not prevent him from doing so. ...<br><br>כלם אנשים ALL OF THEM WERE MEN — Wherever the term אנשים, “men”, is used in Scripture it is a term denoting worthiness. These men, [though they later sinned] but at that time [when they were appointed] they were worthy men."}, {"ch": 13, "v": 4, "aliyah": 1, "heb": "וְאֵ֖לֶּה שְׁמוֹתָ֑ם לְמַטֵּ֣ה רְאוּבֵ֔ן שַׁמּ֖וּעַ בֶּן־זַכּֽוּר׃", "onk": "וְאִלֵּין שְׁמָהַתְהוֹן לְשִׁבְטָא דִרְאוּבֵן שַׁמּוּעַ בַּר זַכּוּר:", "onk_en": "These are their names; for the tribe of Reuven, Shamua the son of Zaccur.", "pj": "וְאִלֵין שְׁמָהָתָא דִתְרֵיסַר גוּבְרַיָא מְאַלְלַיָא לְשִׁבְטָא דִרְאוּבֵן עַזְגָד שַׁמוּעַ בַּר זַכּוּר", "pj_en": "And these are the names of the twelve men, the explorers: the messenger of the tribe of Reuben, Shamua bar Zakkur;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 5, "aliyah": 1, "heb": "לְמַטֵּ֣ה שִׁמְע֔וֹן שָׁפָ֖ט בֶּן־חוֹרִֽי׃", "onk": "לְשִׁבְטָא דְשִׁמְעוֹן שָׁפָט בַּר חוֹרִי:", "onk_en": "For the tribe of Shimon, Shafat the son of Chori.", "pj": "לְשִׁבְטָא דְשִׁמְעוֹן עַזְגָד שָׁפָט בַּר חוֹרִי", "pj_en": "of the tribe of Shemeon, Shaphat bar Hori;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 6, "aliyah": 1, "heb": "לְמַטֵּ֣ה יְהוּדָ֔ה כָּלֵ֖ב בֶּן־יְפֻנֶּֽה׃", "onk": "לְשִׁבְטָא דִיהוּדָה כָּלֵב בַּר יְפֻנֶּה:", "onk_en": "For the tribe of Yehudah, Caleiv the son of Yefuneh.", "pj": "לְשִׁבְטָא דִיהוּדָה עַזְגָד כָּלֵב בַּר יְפֻנֶה", "pj_en": "for Jehudah, Kaleb bar Jephunneh;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 7, "aliyah": 1, "heb": "לְמַטֵּ֣ה יִשָּׂשכָ֔ר יִגְאָ֖ל בֶּן־יוֹסֵֽף׃", "onk": "לְשִׁבְטָא דְּיִשָּׂשכָר יִגְאָל בַּר יוֹסֵף:", "onk_en": "For the tribe of Yissachar, Yigal the son of Yoseif.", "pj": "לְשִׁבְטָא דְיִשָשכָר עַזְגָד יִגְאָל בַּר יוֹסֵף", "pj_en": "for Issakar, Yiggeal bar Joseph;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 8, "aliyah": 1, "heb": "לְמַטֵּ֥ה אֶפְרָ֖יִם הוֹשֵׁ֥עַ בִּן־נֽוּן׃", "onk": "לְשִׁבְטָא דְאֶפְרַיִם הוֹשֵׁעַ בַּר נוּן:", "onk_en": "For the tribe of Ephraim, Hosheiah the son of Nun.", "pj": "לְשִׁבְטָא דְאֶפְרַיִם עַזְגָד הוֹשֵׁעַ בַּר נוּן", "pj_en": "for Ephraim, Hoshea bar Nun;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 9, "aliyah": 1, "heb": "לְמַטֵּ֣ה בִנְיָמִ֔ן פַּלְטִ֖י בֶּן־רָפֽוּא׃", "onk": "לְשִׁבְטָא דְבִנְיָמִן פַּלְטִי בַּר רָפוּא:", "onk_en": "For the tribe of Binyamin, Palti the son of Raphu.", "pj": "לְשִׁבְטָא דְבִנְיָמִין עַזְגָד פַּלְטִי בַּר רָפוּא", "pj_en": "for Benjamin, Palti bar Raphu;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 10, "aliyah": 1, "heb": "לְמַטֵּ֣ה זְבוּלֻ֔ן גַּדִּיאֵ֖ל בֶּן־סוֹדִֽי׃", "onk": "לְשִׁבְטָא דִזְבוּלֻן גַּדִּיאֵל בַּר סוֹדִי:", "onk_en": "For the tribe of Zevulun, Gadiel the son of Sodi.", "pj": "לְשִׁבְטָא דִזְבוּלֻן עַזְגָד גַדִיאֵל בַּר סוֹדִי", "pj_en": "for Zebulon, Gadiel bar Zodi;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 11, "aliyah": 1, "heb": "לְמַטֵּ֥ה יוֹסֵ֖ף לְמַטֵּ֣ה מְנַשֶּׁ֑ה גַּדִּ֖י בֶּן־סוּסִֽי׃", "onk": "לְשִׁבְטָא דְיוֹסֵף לְשִׁבְטָא דִמְנַשֶּׁה גַּדִּי בַּר סוּסִי:", "onk_en": "For the tribe of Yoseif, for the tribe of Menashe, Gadi the son of Susi.", "pj": "לְשִׁבְטָא דְיוֹסֵף לְשִׁבְטָא דִמְנַשֶׁה עַזְגָד גַדִי בַּר סוּסִי", "pj_en": "for Menasheh, Gaddi bar Susi;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 12, "aliyah": 1, "heb": "לְמַטֵּ֣ה דָ֔ן עַמִּיאֵ֖ל בֶּן־גְּמַלִּֽי׃", "onk": "לְשִׁבְטָא דְדָן עַמִּיאֵל בַּר גְּמַלִּי:", "onk_en": "For the tribe of Don, Amiel the son of Gemali.", "pj": "לְשִׁבְטָא דְדָן עַזְגָד עַמִיאֵל בַּר גְמַלִי", "pj_en": "for Dan, Ammiel bar Gemmalli;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 13, "aliyah": 1, "heb": "לְמַטֵּ֣ה אָשֵׁ֔ר סְת֖וּר בֶּן־מִיכָאֵֽל׃", "onk": "לְשִׁבְטָא דְאָשֵׁר סְתוּר בַּר מִיכָאֵל:", "onk_en": "For the tribe of Asher, Sesur the son of Michael.", "pj": "לְשִׁבְטָא דְאָשֵׁר עַזְגָד סְתוּר בַּר מִיכָאֵל", "pj_en": "for Asher, Sether bar Michael;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 14, "aliyah": 1, "heb": "לְמַטֵּ֣ה נַפְתָּלִ֔י נַחְבִּ֖י בֶּן־וׇפְסִֽי׃", "onk": "לְשִׁבְטָא דְנַפְתָּלִי נַחְבִּי בַּר וָפְסִי:", "onk_en": "For the tribe of Naftali, Nachbi the son of Vofsi.", "pj": "לְשִׁבְטָא דְנַפְתָּלִי עַזְגָד נַחְבִּי בַּר וָפְסִי", "pj_en": "for Naphtali, Nachbi bar Vaphsi;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 15, "aliyah": 1, "heb": "לְמַטֵּ֣ה גָ֔ד גְּאוּאֵ֖ל בֶּן־מָכִֽי׃", "onk": "לְשִׁבְטָא דְגָד גְּאוּאֵל בַּר מָכִי:", "onk_en": "For the tribe of Gad, Geu’el the son of Machi.", "pj": "לְשִׁבְטָא דְגָד עַזְגָד גְאוּאֵל בַּר מָכִי", "pj_en": "and for Gad, Geuel bar Machi.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 16, "aliyah": 1, "heb": "אֵ֚לֶּה שְׁמ֣וֹת הָֽאֲנָשִׁ֔ים אֲשֶׁר־שָׁלַ֥ח מֹשֶׁ֖ה לָת֣וּר אֶת־הָאָ֑רֶץ וַיִּקְרָ֥א מֹשֶׁ֛ה לְהוֹשֵׁ֥עַ בִּן־נ֖וּן יְהוֹשֻֽׁעַ׃", "onk": "אִלֵּין שְׁמָהַת גֻּבְרַיָּא דִּי שְׁלַח משֶׁה לְאַלָּלָא יָת אַרְעָא וּקְרָא משֶׁה לְהוֹשֵׁעַ בַּר נוּן יְהוֹשֻׁעַ:", "onk_en": "These are the names of the men whom Moshe sent to scout the land, and Moshe called Hosheiah the son of Nun, Yehoshua.", "pj": "אִלֵין שְׁמָהָן גוּבְרַיָא דְשָׁדַר משֶׁה לְאַלְלָא יַת אַרְעָא וּכְדִי חֲמָא משֶׁה עִנְוָותָנוּתֵיהּ קָרָא משֶׁה לְהוֹשֵׁעַ בַּר נוּן יְהוֹשֻׁעַ", "pj_en": "These are the names of the men whom Mosheh sent to explore the land; and when Mosheh saw his humility, he called Hoshea bar Nun Jehoshua.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא משה להושע וגו'.<\/b> הִתְפַּלֵּל עָלָיו יָהּ יוֹשִׁיעֲךָ מֵעֲצַת מְרַגְּלִים (סוטה ל\"ד):", "rashi_en": "ויקרא משה להושע וגו׳ AND MOSES CALLED HOSHEA [THE SON OF NUN JEHOSHUA] — By giving him this name יהושע which is a compound of יה and הושע “God may save”, he in effect prayed for him: “May God save you from the evil counsel of the spies” (Sotah 34b)."}, {"ch": 13, "v": 17, "aliyah": 1, "heb": "וַיִּשְׁלַ֤ח אֹתָם֙ מֹשֶׁ֔ה לָת֖וּר אֶת־אֶ֣רֶץ כְּנָ֑עַן וַיֹּ֣אמֶר אֲלֵהֶ֗ם עֲל֥וּ זֶה֙ בַּנֶּ֔גֶב וַעֲלִיתֶ֖ם אֶת־הָהָֽר׃", "onk": "וּשְׁלַח יָתְהוֹן משֶׁה לְאַלָּלָא יָת אַרְעָא דִכְנָעַן וַאֲמַר לְהוֹן סָקוּ דָא בִּדְרוֹמָא וְתִסְקוּן לְטוּרָא:", "onk_en": "Moshe sent them to scout the land of Cana’an and he said to them: “Go up this [way], to the south and go up to the mountain.", "pj": "וְשָׁדַר יַתְהוֹן משֶׁה לְאַלְלָא יַת אַרְעָא דִכְנָעַן וַאֲמַר לְהוֹן סָקוּ בַּהֲדֵין צִטְרָא בִּדְרוֹמָא וְתִסְקוּן לְטוּרָא", "pj_en": "And Mosheh sent them to survey the land of Kenaan, and said to them, Go up on this side by the south, and ascend the mountain,", "tj": "", "tj_en": "", "rashi": "<b>עלו זה בנגב.<\/b> הוּא הָיָה הַפְּסֹלֶת שֶׁל אֶרֶץ יִשְׂרָאֵל, שֶׁכֵּן דֶּרֶךְ הַתַּגָּרִים מַרְאִין אֶת הַפְּסֹלֶת תְּחִלָּה, וְאַ\"כַּ מַרְאִים אֶת הַשֶּׁבַח (תנחומא):", "rashi_en": "עלו זה בנגב GO UP THIS WAY SOUTHWARD — It (the South) was the worst part of the Land of Israel. He bid them spy this out first because such is the way of merchants: they show a prospective purchaser the inferior goods first, and afterwards they show the best (Midrash Tanchuma, Sh'lach 6)."}, {"ch": 13, "v": 18, "aliyah": 1, "heb": "וּרְאִיתֶ֥ם אֶת־הָאָ֖רֶץ מַה־הִ֑וא וְאֶת־הָעָם֙ הַיֹּשֵׁ֣ב עָלֶ֔יהָ הֶחָזָ֥ק הוּא֙ הֲרָפֶ֔ה הַמְעַ֥ט ה֖וּא אִם־רָֽב׃", "onk": "וְתֶחֱזוּן יָת אַרְעָא מָא הִיא וְיָת עַמָּא דְּיָתֵב עֲלַהּ הֲתַקִּיף הוּא אִם חַלָּשׁ הַזְעֵר הוּא אִם סַגִּי:", "onk_en": "See what the land is; and the people living on it; are they strong or weak, if they are few or many;", "pj": "וְתֵיחֲמוּן יַת אַרְעָא מָה הִיא וְיַת עַמָא דְיָתֵיב עֲלָהּ הֲתַקִיף הוּא אִין חֲלָשׁ הַזְעֵיר הוּא אִין סַגִי", "pj_en": "and survey the country, what it is, and the people who dwell in it; whether they be strong or weak, few or many;", "tj": "", "tj_en": "", "rashi": "<b>את הארץ מה הוא.<\/b> יֵשׁ אֶרֶץ מְגַדֶּלֶת גִּבּוֹרִים וְיֵשׁ אֶרֶץ מְגַדֶּלֶת חַלָּשִׁים, יֵשׁ מְגַדֶּלֶת אֻכְלוּסִין וְיֵשׁ מְמַעֶטֶת אֻכְלוּסִין:<br><br><b>החזק הוא הרפה.<\/b> סִימָן מָסַר לָהֶם: אִם בִּפְרָזִים יוֹשְׁבִין, חֲזָקִים הֵם, שֶׁסּוֹמְכִין עַל גְּבוּרָתָם, וְאִם בְּעָרִים בְּצוּרוֹת הֵם יוֹשְׁבִין חַלָּשִׁים הֵם (שם):", "rashi_en": "את הארץ מה הוא AND SEE THE LAND; WHAT IT IS — There are countries which rear strong people and there are countries which rear weak people; there are such as produce a large population and there are such as produce a small population (Midrash Tanchuma, Sh'lach 6).<br><br>החזק הוא הרפה WHETHER THEY ARE STRONG OR WEAK — He gave them a sign: if they live in open cities they are strong, since they evidently rely on their own strength, but if they live in fortified cities they are weak (Midrash Tanchuma, Sh'lach 6)."}, {"ch": 13, "v": 19, "aliyah": 1, "heb": "וּמָ֣ה הָאָ֗רֶץ אֲשֶׁר־הוּא֙ יֹשֵׁ֣ב בָּ֔הּ הֲטוֹבָ֥ה הִ֖וא אִם־רָעָ֑ה וּמָ֣ה הֶֽעָרִ֗ים אֲשֶׁר־הוּא֙ יוֹשֵׁ֣ב בָּהֵ֔נָּה הַבְּמַֽחֲנִ֖ים אִ֥ם בְּמִבְצָרִֽים׃", "onk": "וּמָא אַרְעָא דִּי הוּא יָתֵב בַּהּ הֲטָבָא הִיא אִם בִּישָׁא וּמָא קִרְוַיָּא דִּי הוּא יָתֵב בְּהוֹן הַבְּפַצְחִין אִם <b>בִּכְרַכִּין<\/b>:", "onk_en": "and how is the land in which they live, is it good, or bad? And how are the cities in which they reside; are they open, or are they fortified [<b>walled-in<\/b>]?", "pj": "וּמָה אַרְעָא דְהוּא יָתֵיב בָּהּ הֲטַבְתָּא הִיא אִין בִּישְׁתָּא וּמָה קִרְוַיָא דְהוּא יָתֵיב בְּהוֹן הַבִכְּרַכֵּי פַּצִיחֵי חַנְיָן אִין בְּחַקְרִין", "pj_en": "what the land is in which they dwell, whether good or bad; what cities they inhabit, whether they live in towns that are open or walled;", "tj": "", "tj_en": "", "rashi": "<b>הבמחנים.<\/b> תַּרְגּוּמוֹ \"הַבְפַצְחִין\", כְּרַכִּין פְּצוּחִין וּפְתוּחִין מֵאֵין חוֹמָה:<br><br><b>הטובה הוא.<\/b> בְּמַעְיָנוֹת וּתְהוֹמוֹת טוֹבִים וּבְרִיאִים:", "rashi_en": "הבמחנים — The Targum rendering is: “whether in open places” i.e. in cities open and exposed — without a wall.<br><br>הטובה הוא WHETHER IT IS GOOD, through possessing springs and other good and healthy supplies of water."}, {"ch": 13, "v": 20, "aliyah": 1, "heb": "וּמָ֣ה הָ֠אָ֠רֶץ הַשְּׁמֵנָ֨ה הִ֜וא אִם־רָזָ֗ה הֲיֵֽשׁ־בָּ֥הּ עֵץ֙ אִם־אַ֔יִן וְהִ֨תְחַזַּקְתֶּ֔ם וּלְקַחְתֶּ֖ם מִפְּרִ֣י הָאָ֑רֶץ וְהַ֨יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים׃", "onk": "וּמָא אַרְעָא הֲעַתִּירָא הִיא אִם מִסְכֵּנָא הֲאִית בַּהּ אִילָנִין אִם לָא וְתִתְקְפוּן וְתִסְּבוּן מֵאִבָּא דְאַרְעָא וְיוֹמַיָּא יוֹמֵי בִּכּוּרֵי עִנְּבִין:", "onk_en": "How is the land (soil) is it fat (rich) or lean (poor), does it have trees, or not? You shall strengthen yourselves, and you shall take some fruit of the land.” Those days were the days of the first ripening of the grapes.", "pj": "וּמָה שְׁבַח אַרְעָא הַשְׁמִינִין אִינוּן פִּרְיָהּ אִין פַּתְרָנִין הַאִית בָּהּ אִילָנִין דְמֵיכַל אִין לָא וְתַעַבְדוּן חֶזְקָתָא וְתִסְבּוּן מֵאִבָּא דְאַרְעָא וְיוֹמַיָא דִי אֲזָלוּ בְּעֶשְרִין וְתִשְׁעָה לְיַרְחָא דְסִיוָן יוֹמֵי דְמִן בִּכּוּרֵי עִנְבִין", "pj_en": "and what the reputation of the land, whether its productions are rich or poor, and the trees of it fruitful or not. And do valiantly, and bring back some of the fruit of the land. And the day on which they went was the nineteenth of the month of Sivan, (about) the days of the first grapes.", "tj": "וּמָה אַרְעָא הַשְׁמִינִין אִינוּן פֶּרְיָן אוֹ עֶצְיָן:", "tj_en": "And what the land is, whether the fruits of it are rich: or trees.", "rashi": "<b>היש בה עץ.<\/b> אִם יֵשׁ בָּהֶם אָדָם כָּשֵׁר שֶׁיָּגֵן עֲלֵיהֶם בִּזְכוּתוֹ (עי' בבא בתרא ט\"ו):<br><br><b>בכורי ענבים.<\/b> יָמִים שֶׁהָעֲנָבִים מִתְבַּשְּׁלִין בְּבִכּוּר:", "rashi_en": "היש בה עץ WHETHER THERE ARE TREES IN IT [OR NOT] — i.e. whether there is a righteous man amongst them who will protect them by his merits (cf. Bava Batra 15a).<br><br>בכורי ענבים — [AND THE DAYS WERE THE DAYS OF] THE FIRSTLING OF THE GRAPES — i.e. the days when the grapes were ripening at its early stage of growth."}, {"ch": 13, "v": 21, "aliyah": 2, "heb": "וַֽיַּעֲל֖וּ וַיָּתֻ֣רוּ אֶת־הָאָ֑רֶץ מִמִּדְבַּר־צִ֥ן עַד־רְחֹ֖ב לְבֹ֥א חֲמָֽת׃", "onk": "וּסְלִיקוּ וְאַלִּילוּ יָת אַרְעָא מִמַּדבְּרָא דְצִין עַד רְחוֹב לִמְטֵי חֲמָת:", "onk_en": "They went up and they scouted the land from the desert of Tzin until Rechov, at the entrance of Chamas.", "pj": "וּסְלִיקוּ וְאַלִילוּ יַת אַרְעָא מִן מַדְבְּרָא דְצִין עַד פַּלְטִיוֹת מֵעַלָךְ לְאַנְטוּכְיָא", "pj_en": "They went up, therefore, and explored the country, from the wilderness of Zin, unto the roads by which thou comest unto Antiochia.", "tj": "", "tj_en": "", "rashi": "<b>ממדבר צן עד רחב לבא חמת.<\/b> הָלְכוּ בִגְבוּלֶיהָ בְאֹרֶךְ וּבְרֹחַב כְּמִין גַּ\"ם, הָלְכוּ רוּחַ גְּבוּל דְּרוֹמִית מִמִּקְצוֹעַ מִזְרָח עַד מִקְצוֹעַ מַעֲרָב, כְּמוֹ שֶׁצִּוָּה מֹשֶׁה עֲלוּ זֶה בַנֶּגֶב — דֶּרֶךְ גְּבוּל דְּרוֹמִית מִזְרָחִית עַד הַיָּם — שֶׁהַיָּם הוּא גְבוּל מַעֲרָבִי, וּמִשָּׁם חָזְרוּ וְהָלְכוּ כָּל גְּבוּל מַעֲרָבִי עַל שְׂפַת הַיָּם עַד לְבֹא חֲמָת, שֶׁהוּא אֵצֶל הֹר הָהָר בְּמִקְצוֹעַ מַעֲרָבִית צְפוֹנִית, כְּמוֹ שֶׁמְּפֹרָשׁ בִּגְבוּלוֹת הָאָרֶץ בְּפָרָשַׁת אֵלֶּה מַסְעֵי:", "rashi_en": "ממדבר צן עד רחב לבא חמת [SO THEY WENT UP AND SEARCHED THE LAND] FROM THE DESERT OF ZIN UNTO REHOB, AS MEN COME TO HAMATH — They went along its (the Land’s) boundaries lengthwise and broadwise in the form of a gamma (the third letter of the Greek alphabet, Γ), viz., they went along the side which forms the southern boundary from its eastern corner to the western corner, just as Moses had bidden them, (v. 17) “Go up this way southwards”, i.e. the way of the south border from its eastern Point up to the Mediterranean Sea, for the Sea is the western boundary of the Land. From there they turned and went along the entire western boundary on the sea-coast up to the point whence one goes on to Hamath which is situated near Mount Hor in the North-western corner, as is set forth in the section dealing with the “boundaries of the Land” in the Sedrah אלה מסעי (Numbers 34:7—8)."}, {"ch": 13, "v": 22, "aliyah": 2, "heb": "וַיַּעֲל֣וּ בַנֶּ֘גֶב֮ וַיָּבֹ֣א עַד־חֶבְרוֹן֒ וְשָׁ֤ם אֲחִימַן֙ שֵׁשַׁ֣י וְתַלְמַ֔י יְלִידֵ֖י הָעֲנָ֑ק וְחֶבְר֗וֹן שֶׁ֤בַע שָׁנִים֙ נִבְנְתָ֔ה לִפְנֵ֖י צֹ֥עַן מִצְרָֽיִם׃", "onk": "וּסְלִיקוּ בִדְרוֹמָא וַאֲתָא עַד חֶבְרוֹן וְתַמָּן אֲחִימָן שֵׁשַׁי וְתַלְמַי בְּנֵי גִּבָּרַ<b>יָּא<\/b> וְחֶבְרוֹן שְׁבַע שְׁנִין אִתְבְּנִיאַת קֳדָם <b>טָנַס<\/b> דְּמִצְרָיִם:", "onk_en": "They went up, into the southern part [of the land] and [he] came to Chevron; and there, were Achiman, Sheshai and Talmai, the offspring of the giant[<b>s<\/b>]. [The city of] Chevron was built seven years before the city of Tzo’an [<b>Tonas<\/b>] in Egypt.", "pj": "וּסְלִיקוּ מִן צְטַר דָרוֹמָא וְאָתוֹ עַד חֶבְרוֹן וְתַמָן אֲחִימָן שֵׁשַׁי וְתַלְמַי מַרְבְּיָנֵי דַעֲנָק גִבָּרָא וְחֶבְרוֹן שְׁבַע שְׁנִין אִתְבַּנְיַת קֳדָם עַד לָא תִתְבְּנֵי טָאנֵיס דְמִצְרַיִם", "pj_en": "They went up from the side of the south and came to Hebron, where were Achiman, Sheshai, and Talmai, sons of Anak the giant Now Hebron was built seven years before Tanis in Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ויבא עד חברון.<\/b> כָּלֵב לְבַדּוֹ הָלַךְ שָׁם וְנִשְׁתַּטֵּחַ עַל קִבְרֵי אָבוֹת שֶׁלֹּא יְהֵא נִסָּת לַחֲבֵרָיו לִהְיוֹת בַּעֲצָתָם, וְכֵן הוּא אוֹמֵר (דברים א'), \"וְלוֹ אֶתֵּן אֶת הָאָרֶץ אֲשֶׁר דָּרַךְ בָּהּ\", וּכְתִיב (שופטים א') \"וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן\" (סוטה ל\"ד):<br><br><b>שבע שנים נבנתה.<\/b> אֶפְשַׁר שֶׁבָּנָה חָם אֶת חֶבְרוֹן לִכְנַעַן בְּנוֹ הַקָּטָן קֹדֶם שֶׁיִּבְנֶה אֶת צֹעַן לְמִצְרַיִם בְּנוֹ הַגָּדוֹל? אֶלָּא שֶׁהָיְתָה מְבֻנָּה בְּכָל טוּב עַל אֶחָד מִשִּׁבְעָה בְצֹעַן, וּבָא לְהוֹדִיעֲךָ שִׁבְחָהּ שֶׁל אֶרֶץ יִשְׂרָאֵל, שֶׁאֵין לְךָ טְרָשִׁין בְּאֶרֶץ יִשְׂרָאֵל יוֹתֵר מֵחֶבְרוֹן — לְפִיכָךְ הִקְצוּהָ לְקִבְרוֹת מֵתִים — וְאֵין לְךָ מְעֻלָּה בְּכָל הָאֲרָצוֹת כְּמִצְרַיִם, שֶׁנֶּאֱמַר \"כְּגַן ה' כְּאֶרֶץ מִצְרַיִם\" (בראשית י\"ג), וְצֹעַן הִיא הַמְעֻלָּה שֶׁבְּאֶרֶץ מִצְרַיִם, שֶׁשָּׁם מוֹשַׁב הַמְּלָכִים, שֶׁנֶּאֱמַר \"כִּי הָיוּ בְצֹעַן שָׂרָיו\" (ישעיהו ל'), וְהָיְתָה חֶבְרוֹן טוֹבָה מִמֶּנָּה שִׁבְעָה חֲלָקִים (סוטה ל\"ד; כתובות קי\"ב):", "rashi_en": "ויבא עד חברון [AND THEY WENT UP BY THE SOUTH] AND HE CAME UNTO HEBRON — Caleb alone went there and prostrated himself on the graves of the Patriarchs, offering prayer that he might be helped not to give way to the enticement of his colleagues and join them in their counsel. You may see that it was Caleb who went there, for so indeed it (Scripture) states, (Deuteronomy 1:36) “[Save Caleb the son of Jephunnch, he shall see it] and unto him will I give the land upon which he hath trodden!” and it is written, (Judges 1:20) “And they gave Hebron unto Caleb” (Sotah 34b) <br><br>שבע שנים נבנתה [NOW HEBRON] WAS BUILT SEVEN YEARS [BEFORE ZOAN IN EGYPT] — Is it possible that Ham (who was the father of both Canaan and Mizraim; cf. Genesis 10:6) would have built Hebron for Canaan, his younger son, before he built Zoan for Mizraim, his elder son? But the meaning is that it was furnished (lit., built up) with all excellencies seven times better than Zoan. It (Scripture), by mentioning this, means to tell you the excellency of the Land of Israel. For you have no rockier ground in the Land of Israel than Hebron, — for this reason, indeed, they set it apart for a place of burial — and there is, on the other hand, no soil in any country as good as that of Egypt, for it states, (Genesis 13:10) “like the garden of the Lord, viz., like the Land of Egypt”. Now Zoan must have been the best part in the land Egypt since the residence of the kings was there, as it is said, (Jes. 30:4) “For in Zoan were its princes”, and yet Hebron was seven times better than it (Sotah 34b; Ketuvot 112a)."}, {"ch": 13, "v": 23, "aliyah": 2, "heb": "וַיָּבֹ֜אוּ עַד־נַ֣חַל אֶשְׁכֹּ֗ל וַיִּכְרְת֨וּ מִשָּׁ֤ם זְמוֹרָה֙ וְאֶשְׁכּ֤וֹל עֲנָבִים֙ אֶחָ֔ד וַיִּשָּׂאֻ֥הוּ בַמּ֖וֹט בִּשְׁנָ֑יִם וּמִן־הָרִמֹּנִ֖ים וּמִן־הַתְּאֵנִֽים׃", "onk": "וַאֲתוֹ עַד נַחֲלָא דְאַתְכָּלָא וּקְצוֹ מִתַּמָּן עוֹבַרְתָּא וְאַתְכַּל עִנְּבִין חַד וּנְטָלוֹהִי בַאֲרִיחָא בִּתְרֵין וּמִן רִמּוֹנַיָּא וּמִן תְּאֵנַיָּא:", "onk_en": "They came until the Valley of Eshkol, and from there they cut off a branch and one cluster of grapes, and they carried it between two on a pole, [and they took] some pomegranates and some figs.", "pj": "וְאָתוּ עַד נַחְלָא דְאַתְכְּלָא וְקָצוּ מִתַּמָן עוֹבַרְתָּא וְאִתְכַּל דְעַנְבִין חַד וְסוֹבְרוֹהִי בְּאַסְלָא בִּכְּתֵיף תְּרֵין מִנְהוֹן וְכֵן מִן רוּמָנַיָא וְכֵן מִן תֵּינַיָא", "pj_en": "They came then to the stream of the grapes (or bunches, ethkala), and cut down from thence a branch with one cluster of grapes, and carried it on a staff on the shoulders of two of them, and also took they of the pomegranates and the figs.", "tj": "וַאֲתוֹ עַד נַחַל סְגוּלָה וּקְטָעוּ מִתַּמָן עוֹבָרָא וּבֵיהּ סְגוֹל דְעִנְבִין חָד וְטַעֲנוּ יָתֵיהּ בְּקוֹפָא בֵּינֵי תְּרֵין גוּבְרִין וְכֵן מִן רִמוֹנַיָא וּמִן תֵּינַיָא:", "tj_en": "And they came to the stream of the grape clusters, and cut down from thence a branch with one cluster of grapes, and carried it on a rod between two men; and also of the pomegranates and of the figs.", "rashi": "<b>זמורה.<\/b> שׂוֹכַת גֶּפֶן, וְאֶשְׁכּוֹל שֶׁל עֲנָבִים תָּלוּי בָּהּ:<br><br><b>וישאהו במוט בשנים.<\/b> מִמַּשְׁמַע שֶׁנֶּאֱמַר \"וַיִּשָּׂאֻהוּ בַמּוֹט\" אֵינִי יוֹדֵעַ שֶׁהוּא בִשְׁנַיִם? מַה תַּ\"ל \"בִּשְׁנָיִם\"? בִּשְׁנֵי מוֹטוֹת. הָא כֵיצַד? שְׁמוֹנָה נָטְלוּ אֶשְׁכּוֹל, אֶחָד נָטַל תְּאֵנָה וְאֶחָד רִמּוֹן; יְהוֹשֻׁעַ וְכָלֵב לֹא נָטְלוּ כְלוּם, לְפִי שֶׁכָּל עַצְמָם לְהוֹצִיא דִּבָּה נִתְכַּוְּנוּ — כְּשֵׁם שֶׁפִּרְיָהּ מְשֻׁנֶּה כָּךְ עַמָּהּ מְשֻׁנֶּה; וְאִם חָפֵץ אַתָּה לֵידַע כַּמָּה מַשּׂאוֹי אֶחָד מֵהֶם, צֵא וּלְמַד מֵאֲבָנִים שֶׁהֵקִימוּ בַּגִּלְגָּל — הֵרִימוּ לָהֶם אִיש אֶבֶן אַחַת מִן הַיַּרְדֵן עַל שִׁכְמוֹ וֶהֱקִימוּהָ בַּגִּלְגָּל (יהושע ד') — וּשְׁקָלוּם רַבּוֹתֵינוּ מִשְׁקַל כָּל אַחַת אַרְבָּעִים סְאָה, וּגְמִירֵי טוּנָא דְּמִידְלֵי אֱינַשׁ עַל כַּתְפֵּיהּ אֵינוֹ אֶלָּא שְׁלִישׁ מַשּׂאוֹי כַּמַּשּׂאוֹי שֶׁמְּסַיְּעִין אוֹתוֹ לְהָרִים (סוטה ל\"ד):", "rashi_en": "זמורה (lit., AND THEY CUT DOWN FROM THENCE) A BRANCH [AND ONE CLUSTER OF GRAPES] — i.e. a vine branch with a cluster of grapes hanging from it (not as the text might suggest, that they cut a branch and they cut also a cluster of grapes),<br><br>וישאהו במוט בשנים AND THEY BARE IT UPON A POLE BETWEEN TWO — From what is implied in the statement “And they bare it upon a pole”, do I not know that it was carried by two men”? why then does it add the word ‎בשנים?‎ It means, not as you assume, “by two men” but “upon two poles”. How was that done? Eight of the spies bore the cluster of grapes. Besides these, one spy took the fig and one the pomegranate, but Joshua and Caleb did not take anything (although all of them were bidden to do so; cf. v. 20), because the very essence of their (the other spies’) intention was only to bring an evil report: “Just as its fruit is extraordinary in size, so is its people extraordinary in size”. — Now if you wish to know how much was the burden of each of them, go and learn from the weight of the stones which they erected at Gilgal; for it is related (Joshua 4:5 and 20) that each man lifted by himself one stone from out of the Jordan on to his shoulder, and set it up at Gilgal; — and our Rabbis ascertained the weight of each stone to be forty Seahs, and it is an accepted fact that a load which a person can by himself lift up on to his shoulder is only the third of the load he can carry if people assist him in lifting it up (Sotah 34b).  "}, {"ch": 13, "v": 24, "aliyah": 2, "heb": "לַמָּק֣וֹם הַה֔וּא קָרָ֖א נַ֣חַל אֶשְׁכּ֑וֹל עַ֚ל אֹד֣וֹת הָֽאֶשְׁכּ֔וֹל אֲשֶׁר־כָּרְת֥וּ מִשָּׁ֖ם בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "לְאַתְרָא הַהוּא קְרָא נַחְלָא דְאַתְכָּלָא עַל עֵסַק אַתְכָּלָא דִּקְצוֹ מִתַּמָּן בְּנֵי יִשְׂרָאֵל:", "onk_en": "That place they called the Valley of Eshkol, because of the event of the cluster that Bnei Yisroel cut from there.", "pj": "לְאַתְרָא הַהוּא קָרוּ נַחְלָא דְאַתְכְּלָא עַל עֵיסַק עוֹבַרְתָּא דְקָצִיצוּ מִתַּמָן בְנֵי יִשְרָאֵל וַהֲוָה חַמְרָא נָטֵיף מִנֵיהּ כְּנַחְלָא", "pj_en": "Now that place they call the stream of the cluster, from the branch which the sons of Israel cut down there; and wine was dropping from it like a stream.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 25, "aliyah": 2, "heb": "וַיָּשֻׁ֖בוּ מִתּ֣וּר הָאָ֑רֶץ מִקֵּ֖ץ אַרְבָּעִ֥ים יֽוֹם׃", "onk": "וְתָבוּ מִלְּאַלָּלָא יָת אַרְעָא מִסּוֹף אַרְבְּעִין יוֹמִין:", "onk_en": "They returned from spying the land, at the end of forty days.", "pj": "וְתָבוּ מִלְאַלְלָא יַת אַרְעָא בִתְמַנְיָא יוֹמִין בְּיַרְחָא דְאָב מִסוֹף אַרְבְּעִין יוֹמִין", "pj_en": "And they returned from exploring the land on the eighth day of the month Ab, at the end of forty days.", "tj": "", "tj_en": "", "rashi": "<b>וישבו מתור הארץ מקץ ארבעים יום.<\/b> וַהֲלֹא אַרְבַּע מֵאוֹת פַּרְסָה עַל אַרְבַּע מֵאוֹת פַּרְסָה הִיא, וּמַהֲלַךְ אָדָם בֵּינוֹנִי עֶשֶׂר פַּרְסָאוֹת לַיּוֹם, הֲרֵי מַהֲלַךְ אַרְבָּעִים יוֹם מִן הַמִּזְרָח לַמַּעֲרָב — וְהֵם הָלְכוּ אָרְכָּהּ וְרָחְבָּהּ? אֶלָּא שֶׁגָּלוּי לִפְנֵי הַקָּבָּ\"ה שֶׁיִּגְזֹר עֲלֵיהֶם יוֹם לַשָּׁנָה, קִצֵּר לִפְנֵיהֶם אֶת הַדֶּרֶךְ (שם):", "rashi_en": "וישבו מתור הארץ מקץ ארבעים יום AND THEY RETURNED FROM THE SEARCHING OF THE LAND AT THE END OF FORTY DAYS — But surely it was four hundred Parsangs (Persian miles) by four hundred Parsangs (Megillah 3a). And the journey of an average man is ten Parsangs a day (Pesachim 94a) and consequently it was a distance of forty days from east to west alone, whilst they traveled during that period along its length and breadth! But the fact is that it was manifest before the Holy One, blessed be He, that He would make a decree against them, \"a day for a year\" (cf. Numbers 14:34), therefore He shortened the road for them (i. e. He made them cover ground rapidly) (Midrash Tanchuma, Sh'lach 8)."}, {"ch": 13, "v": 26, "aliyah": 2, "heb": "וַיֵּלְכ֡וּ וַיָּבֹ֩אוּ֩ אֶל־מֹשֶׁ֨ה וְאֶֽל־אַהֲרֹ֜ן וְאֶל־כׇּל־עֲדַ֧ת בְּנֵֽי־יִשְׂרָאֵ֛ל אֶל־מִדְבַּ֥ר פָּארָ֖ן קָדֵ֑שָׁה וַיָּשִׁ֨יבוּ אֹתָ֤ם דָּבָר֙ וְאֶת־כׇּל־הָ֣עֵדָ֔ה וַיַּרְא֖וּם אֶת־פְּרִ֥י הָאָֽרֶץ׃", "onk": "וַאֲזָלוּ וַאֲתוֹ לְוַת משֶׁה וּלְוָת אַהֲרֹן וּלְוַת כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל לְמַדְבְּרָא דְפָארָן <b>לִרְקָם<\/b> וַאֲתִיבוּ יָתְהוֹן פִּתְגָּמָא וְיָת כָּל כְּנִשְׁתָּא וְאַחֲזִיאֻנּוּן יָת אִבָּא דְאַרְעָא:", "onk_en": "They went and came to Moshe and Aharon and to the entire congregation of Bnei Yisroel [that came] to the desert of Paran, in Kadeish [<b>to Rekom<\/b>]. They brought word back to them, and to the entire congregation, and they showed them the fruit of the land.", "pj": "וַאֲזָלוּ וְאָתוּ לְוַת משֶׁה וּלְוַת אַהֲרן וּלְוַת כָּל כְּנִישְׁתָּא דְיִשְרָאֵל לְמַדְבְּרָא דְפָּארָן לִרְקַם וְאָתִיבוּ לְהוֹן פִּתְגָמָא וּלְוַת כָּל כְּנִישְׁתָּא וְחָמִיאוֹנוּן יַת אִבָּא דְאַרְעָא", "pj_en": "And they came to Mosheh and Aharon, and all the congregation of the children of Israel in the wilderness of Pharan, at Rekem, and returned them word, to them and the whole congregation, and showed them the fruit of the land.", "tj": "", "tj_en": "", "rashi": "<b>וילכו ויבאו.<\/b> מַהוּ וַיֵּלְכוּ? לְהַקִּישׁ הֲלִיכָתָן לְבִיאָתָן, מַה בִּיאָתָן בְּעֵצָה רָעָה אַף הֲלִיכָתָן בְּעֵצָה רָעָה (שם ל\"ה):<br><br><b>וישיבו אתם דבר.<\/b> אֶת מֹשֶׁה וְאֶת אַהֲרֹן:", "rashi_en": "וילכו ויבאו AND THEY WENT AND CAME [TO MOSES] — What is the force of “they went” (we have been informed that they had returned; why afterwards make any reference to their going on the journey)? It is intended to compare their “going” with their “coming\" to Moses! How was their coming to Moses? With an evil plan! So, too, was their “going” on the journey with an evil plan (i.e. that when they were travelling they had already resolved to bring back an evil report)! (Sotah 35a).<br><br>וישיבו אתם דבר AND THEY BROUGHT BACK WORD UNTO THEM — unto Moses and Aaron (for the Congregation is mentioned separately)."}, {"ch": 13, "v": 27, "aliyah": 2, "heb": "וַיְסַפְּרוּ־לוֹ֙ וַיֹּ֣אמְר֔וּ בָּ֕אנוּ אֶל־הָאָ֖רֶץ אֲשֶׁ֣ר שְׁלַחְתָּ֑נוּ וְ֠גַ֠ם זָבַ֨ת חָלָ֥ב וּדְבַ֛שׁ הִ֖וא וְזֶה־פִּרְיָֽהּ׃", "onk": "וְאִשְׁתָּעִיאוּ לֵיהּ וַאֲמָרוּ אֲתֵינָא לְאַרְעָא דִּי שְׁלַחְתָּנָא וְאַף עָבְדָא חֲלַב וּדְבַשׁ הִיא וְדֵין אִבַּהּ:", "onk_en": "They recounted to him, and they said: “We came into the land into which you sent us, and it indeed flows with milk and honey, and this is its fruit.", "pj": "וְאִשְׁתָּעִיוּ לֵיהּ וְאָמָרוּ אָתָאנָא לְאַרְעָא דְשָׁדַרְתָּנָא וְאוּף עַבְדָא חֲלַב וּדְבָשׁ הִיא וְדֵין אִבָּהּ", "pj_en": "And they recounted to him, and said: We went into the country to which thou didst send us; and it indeed produceth milk and honey, and this is the fruit of it.", "tj": "", "tj_en": "", "rashi": "<b>זבת חלב ודבש הוא.<\/b> כָּל דְּבַר שֶׁקֶר שֶׁאֵין אוֹמְרִים בּוֹ קְצָת אֱמֶת בִּתְחִלָּתוֹ, אֵין מִתְקַיֵּם בְּסוֹפוֹ:", "rashi_en": "זבת חלב ודבש [WE CAME INTO THE LAND … AND SURELY] IT FLOWETH WITH MILK AND HONEY — They stated this because no fabricated statement in which one does not say at least some true words at first can in the end be maintained (Sotah 35a)."}, {"ch": 13, "v": 28, "aliyah": 2, "heb": "אֶ֚פֶס כִּֽי־עַ֣ז הָעָ֔ם הַיֹּשֵׁ֖ב בָּאָ֑רֶץ וְהֶֽעָרִ֗ים בְּצֻר֤וֹת גְּדֹלֹת֙ מְאֹ֔ד וְגַם־יְלִדֵ֥י הָֽעֲנָ֖ק רָאִ֥ינוּ שָֽׁם׃", "onk": "לְחוֹד אֲרֵי תַקִּיף עַמָּא דְּיָתֵב בְּאַרְעָא וְקִרְוַיָּא כְּרִיכַן רַבְרְבַן לַחֲדָא וְאַף בְּנֵי גִבָּרַ<b>יָּא<\/b> חֲזֵינָא תַמָּן:", "onk_en": "However, the nation is mighty, those who inhabit the land, and the cities are greatly fortified to the utmost, and we also saw the offspring of the giant[<b>s<\/b>] over there.", "pj": "לְחוֹד אֲרוּם תַּקִיף עַמָא דְיָתֵיב בְּאַרְעָא וְקִירְוַיָא כְּרִיכִין חַנְיָין רַבְרְבָן לַחֲדָא וְאוּף מַרְבְּיָנֵי דַעֲנָק גִבָּרָא חֲמֵינָא תַמָן", "pj_en": "But the people who inhabit the country are strong, and the fortified cities they inhabit very great; and we saw also there the sons of Anak the giant.", "tj": "", "tj_en": "", "rashi": "<b>בצרות.<\/b> לְשׁוֹן חֹזֶק, וְתַרְגּוּמוֹ \"כְּרִיכַן\", לְשׁוֹן בִּירָנִיּוֹת עֲגֻלּוֹת, וּבְלָשׁוֹן אֲרַמִּי כְּרִיךְ עָגוֹל:", "rashi_en": "בצרות is an expression for strength. Its rendering in the Targum is כריכן, a term for circular fortresses, for in the Aramaic language כריך means round."}, {"ch": 13, "v": 29, "aliyah": 2, "heb": "עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּאֶ֣רֶץ הַנֶּ֑גֶב וְ֠הַֽחִתִּ֠י וְהַיְבוּסִ֤י וְהָֽאֱמֹרִי֙ יוֹשֵׁ֣ב בָּהָ֔ר וְהַֽכְּנַעֲנִי֙ יוֹשֵׁ֣ב עַל־הַיָּ֔ם וְעַ֖ל יַ֥ד הַיַּרְדֵּֽן׃", "onk": "עֲמַלְקָאָה יָתֵב בַּאֲרַע דָּרוֹמָא וְחִתָּאָה וִיבוּסָאָה וֶאֱמוֹרָאָה יָתֵב בְּטוּרָא וּכְנַעֲנָאָה יָתֵב עַל יַמָּא וְעַל כֵּיף יַרְדְּנָא:", "onk_en": "Amalek dwells in the southern part of the land, the Chiti, Yevusi and Emori dwell in the mountain and the Cana’ani dwell by the sea and next to the Yardein.”", "pj": "עֲמַלְקָאֵי יַתְבִין בְּאַרַע דָרוֹמָא וְחִתָּאֵי וִיבוּסָאֵי וֶאֱמוֹרָאֵי יַתְבִין בְּטַוְורָא וּכְנַעֲנָאֵי יַתְבִין עַל יַמָא וְעַל תְּחוּם יוֹרְדְנָא", "pj_en": "The Amalekites dwell in the south, the Hittites, Jebusites, and Amorites in the mountains; but the Kenaanites dwell by the sea, and by the bank of the Jordan.", "tj": "", "tj_en": "", "rashi": "<b>עמלק יושב וגו'.<\/b> לְפִי שֶׁנִּכְווּ בַּעֲמָלֵק כְּבָר, הִזְכִּירוּהוּ מְרַגְּלִים כְּדֵי לְיָרְאָם (תנחומא):<br><br><b>ועל יד הירדן.<\/b> יָד כְּמַשְׁמָעוֹ, אֵצֶל הַיַּרְדֵּן, וְלֹא תוּכְלוּ לַעֲבֹר:", "rashi_en": "עמלק יושב וגו׳ THE AMALEKITES ABIDE [IN THE LAND OF THE SOUTH] — Because they had already been “burnt” by Amalek, the spies mentioned him first in order to terrify them (cf. Midrash Tanchuma, Sh'lach 9).<br><br>ועל ידי הירדן AND BY THE יד OF THE JORDAN — יד means what it literally implies: beside the Jordan. They meant: the Canaanites live on the bank of the Jordan and therefore you will be unable to cross it."}, {"ch": 13, "v": 30, "aliyah": 2, "heb": "וַיַּ֧הַס כָּלֵ֛ב אֶת־הָעָ֖ם אֶל־מֹשֶׁ֑ה וַיֹּ֗אמֶר עָלֹ֤ה נַעֲלֶה֙ וְיָרַ֣שְׁנוּ אֹתָ֔הּ כִּֽי־יָכ֥וֹל נוּכַ֖ל לָֽהּ׃", "onk": "וְאַצֵּית כָּלֵב יָת עַמָּא לְמשֶׁה וַאֲמַר מֵיסַק נֵיסַק וְנִירַת יָתַהּ אֲרֵי מֵיכַל נֵיכוּל לַהּ:", "onk_en": "Caleiv silenced the people to [hear about] Moshe, and he said: “We can surely go up [to the land] and we shall possess it for we are surely able to overcome it.”", "pj": "וּשְׁתִיק כָּלֵב יַת עַמָא וְאֵיצֵתִינוּן לְוַת משֶׁה וַאֲמַר מֵיסַק נֵיסַק וְנִירַת יָתָהּ אֲרוּם מֵיכַל נֵיכוֹל לָהּ", "pj_en": "And Kaleb stilled the people, and made them listen to Mosheh, and said: Let us go up and possess it, for we are able to take it.", "tj": "וּשְׁתָק:", "tj_en": "And he stilled.", "rashi": "<b>ויהס כלב.<\/b> הִשְׁתִּיק אֶת כֻּלָּם:<br><br><b>אל משה.<\/b> לִשְׁמֹעַ מַה שֶּׁיְּדַבֵּר בְּמֹשֶׁה, צָוַח וְאָמַר \"וְכִי זוֹ בִּלְבַד עָשָׂה לָנוּ בֶן עַמְרָם?\" הַשּׁוֹמֵעַ הָיָה סָבוּר שֶׁבָּא לְסַפֵּר בִּגְנוּתוֹ, וּמִתּוֹךְ שֶׁהָיָה בְלִבָּם עַל מֹשֶׁה בִּשְׁבִיל דִּבְרֵי הַמְרַגְּלִים, שָׁתְקוּ כֻלָּם לִשְׁמֹעַ גְּנוּתוֹ, אָמַר \"וַהֲלֹא קָרַע לָנוּ אֶת הַיָּם וְהוֹרִיד לָנוּ אֶת הַמָּן וְהֵגִיז לָנוּ אֶת הַשְּׂלָו\":<br><br><b>עלה נעלה.<\/b> אֲפִלּוּ בַּשָּׁמַיִם, וְהוּא אוֹמֵר עֲשׂוּ סֻלָּמוֹת וַעֲלוּ שָׁם, נַצְלִיחַ בְּכָל דְּבָרָיו (סוטה ל\"ה):<br><br><b>ויהס.<\/b> לְשׁוֹן שְׁתִיקָה, וְכֵן \"הַס כָּל בָּשָׂר\" (זכריה ב'), \"הַס כִּי לֹא לְהַזְכִּיר\" (עמוס ו'), כֵּן דֶּרֶךְ בְּנֵי אָדָם, הָרוֹצֶה לְשַׁתֵּק אֲגֻדַּת אֲנָשִׁים אוֹמֵר \"שי\"ט\":", "rashi_en": "ויהס כלב AND CALEB STILLED [THE PEOPLE] — he caused all of them to be silent. <br><br>אל משה means he silenced them that they should hear what he was going to say about Moses. He cried aloud saying: “Is this the only thing the son of Amram has done to us?!\" — One who heard him thus speaking believed that he was about to speak to his disparagement, and because they had something in their mind against Moses through the spies’ statements, all of them kept silent to hear his disparagement. He, however, said: “Did he not divide the Red Sea for us, and bring down the Manna for us, and collect the quails for us?!” (Sotah 35a).<br><br>עלה נעלה WE CAN INDEED GO UP — even to heaven, if he were to say “Make ladders and go up there”, we should listen to him because we would be successful in all his words (in all he bids us do) (Sotah 35a).<br><br>ויהס is an expression denoting silence. Similar is, (Zechariah 2:17) “Be silent, (הס) O all flesh”; (Amos 6:10) “Be silent (הס): for we may not mention [the name of the Lord]”. So is the manner of people: he who wishes to silence a group of men says “sst” (This sibilant sound is therefore used to command silence)."}, {"ch": 13, "v": 31, "aliyah": 2, "heb": "וְהָ֨אֲנָשִׁ֜ים אֲשֶׁר־עָל֤וּ עִמּוֹ֙ אָֽמְר֔וּ לֹ֥א נוּכַ֖ל לַעֲל֣וֹת אֶל־הָעָ֑ם כִּֽי־חָזָ֥ק ה֖וּא מִמֶּֽנּוּ׃", "onk": "וְגֻבְרַיָּא דִּי סְלִיקוּ עִמֵּיהּ אֲמָרוּ לָא נֵיכוּל לְמֵיסַק לְוַת עַמָּא אֲרֵי תַקִּיף הוּא מִנָּנָא:", "onk_en": "But the men who went up with him said: “We are not able to go up against the nation, for they are more powerful than we.”", "pj": "וְגוּבְרַיָא דְסַלִיקוּ עִמֵיהּ אָמְרוּ לָא נֵיכוֹל לְמֵיסוֹק לְוַת עַמָא אֲרוּם תַּקִיף הוּא מִנָנָא", "pj_en": "But the men who had gone up with him said, We are not able to go up to the people, for they are stronger than we.", "tj": "", "tj_en": "", "rashi": "<b>חזק הוא ממנו.<\/b> כִּבְיָכוֹל כְּלַפֵּי מַעְלָה אָמְרוּ (סוטה כ\"ה):", "rashi_en": "חזק הוא ממנו [FOR] THEY ARE STRONGER ממנו — They said this, — if this were at all possible (i.e. if one may be permitted to say so of God) — with reference to the Omnipresent (ממנו, stronger than “He”, they thus uttered blasphemy) (Sotah 35a; Arakhin 15a)."}, {"ch": 13, "v": 32, "aliyah": 2, "heb": "וַיֹּצִ֜יאוּ דִּבַּ֤ת הָאָ֙רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔הּ אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר הָאָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜הּ לָת֣וּר אֹתָ֗הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֙יהָ֙ הִ֔וא וְכׇל־הָעָ֛ם אֲשֶׁר־רָאִ֥ינוּ בְתוֹכָ֖הּ אַנְשֵׁ֥י מִדּֽוֹת׃", "onk": "וְאַפִּיקוּ שׁוּם בִּישׁ עַל אַרְעָא דִּי אַלִּילוּ יָתַהּ לְוַת בְּנֵי יִשְׂרָאֵל לְמֵימָר אַרְעָא דִּי עֲבַרְנָא בַהּ לְאַלָּלָא יָתַהּ אַרְעָא <b>מְקַטְּלַת<\/b> יַתְבָהָא הִיא וְכָל עַמָּא דִּי חֲזֵינָא בְגַוָּהּ אֱנָשִׁין דְּמִשְׁחָן:", "onk_en": "They spread slander about the land that they had scouted, to Bnei Yisroel, saying: “The land through which we have passed to scout it, is a land which consumes [<b>slaughters<\/b>] its inhabitants; and every one of the people we saw in it, are men of dimensions [<b>stature<\/b>].", "pj": "וְאַפִּיקוּ טִיב בִּישׁ עַל אַרְעָא דְאַלִילוּ יָתָהּ לְוַת בְּנֵי יִשְרָאֵל לְמֵימָר אַרְעָא דְעָבַרְנוּ בָהּ לְאַלְלָא יָתָהּ אַרְעָא מְקַטְלָא יַתְבָהָא הִיא בְמַרְעִין וְכָל עַמָא דְגַוָהּ גַבְרַיָא מָרֵי מִיכְלַן בִּישִׁין", "pj_en": "And they brought out an evil report about the land which they had surveyed, to the sons of Israel, saying, The country through which we have passed to explore it is a land that killeth its inhabitants with diseases; and all the people who are in it are giants, masters of evil ways.", "tj": "", "tj_en": "", "rashi": "<b>אכלת יושביה.<\/b> בְּכָל מָקוֹם שֶׁעָבַרְנוּ מְצָאנוּם קוֹבְרֵי מֵתִים, וְהַקָּבָּ\"ה עָשָׂה לְטוֹבָה, כְּדֵי לְטָרְדָם בְּאֶבְלָם וְלֹא יִתְּנוּ לֵב לָאֵלּוּ:<br><br><b>אנשי מדות.<\/b> גְּדוֹלִים וּגְבוֹהִים, וְצָרִיךְ לָתֵת לָהֶם מִדָּה, כְּגוֹן גָּלְיָת \"גָּבְהוֹ שֵׁשׁ אַמּוֹת וָזָרֶת\" (שמואל א י\"ז), וְכֵן \"אִישׁ מָדוֹן\" (שמואל ב כ\"א), \"אִישׁ מִדָּה\" (מלכים א י\"א):", "rashi_en": "אכלת יושביה [A LAND] THAT EATETH UP THE INHABITANTS THEREOF — “In every place which we passed we found them (the inhabitants) burying their dead\". — But, as a matter of fact, the Holy One, blessed be He, did this (caused many deaths amongst them at that time, and so the Canaanites were engaged in burying their dead) for the best, in order to occupy them busily with their mourning so that they should pay no attention to these (the spies) (Sotah 35a).<br><br>אנשי מדות MEN OF GREAT STATURE (lit., of measure) — tall and high men, in speaking of whom one feels compelled to give their size, as is stated, for instance, with reference to Goliath (I Samuel 17:4): “his height was six cubits and a span” . Similar to this phrase are: (II Samuel 21:20) “a man of great stature\"; (I Chronicles 11:23) “a man of great stature."}, {"ch": 13, "v": 33, "aliyah": 2, "heb": "וְשָׁ֣ם רָאִ֗ינוּ אֶת־הַנְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן־הַנְּפִלִ֑ים וַנְּהִ֤י בְעֵינֵ֙ינוּ֙ כַּֽחֲגָבִ֔ים וְכֵ֥ן הָיִ֖ינוּ בְּעֵינֵיהֶֽם׃", "onk": "וְתַמָּן חֲזֵינָא יָת גִּבָּרַיָּא בְּנֵי <b>עֲנָק<\/b> מִן <b>גִּבָּרַיָּא<\/b> וַהֲוֵינָא בְּעֵינֵי <b>נַפְשָׁנָא<\/b> כְּקַמְצִין וְכֵן הֲוֵינָא בְּעֵינֵיהוֹן:", "onk_en": "There we saw the giants, the sons of the giant [<b>Anok<\/b>], of the Nephilim [<b>giants<\/b>], and we were like grasshoppers in our [<b>own<\/b>] eyes, and so we appeared in their eyes.”", "pj": "וְתַמָן חָמֵינָא יַת גַבְרַיָא בְנֵי עֲנָק מִגְנִיסַת גוּבְרַיָא וַהֲוֵינָא דַמְיַין בְּאַנְפֵּי נַפְשָׁתָנָא הֵי כְקַמְצָן וְהֵיכְדֵין הֲוֵינָא דַמְיַין בְּאַנְפֵּי נַפְשֵׁיהוֹן", "pj_en": "And there we saw the giants, the sons of Anak, of the race of the giants; and we appeared to ourselves to be as locusts; and so we appeared to them.", "tj": "", "tj_en": "", "rashi": "<b>הנפילים.<\/b> עֲנָקִים, מִבְּנֵי שַׁמְחָזַאי וַעֲזָאֵל שֶׁנָּפְלוּ מִן הַשָּׁמַיִם בִּימֵי דּוֹר אֱנוֹשׁ:<br><br><b>וכן היינו בעיניהם.<\/b> שָׁמַעְנוּ אוֹמְרִים זֶה לָזֶה, נְמָלִים יֵשׁ בַּכְּרָמִים כַּאֲנָשִׁים (סוטה ל\"ה):<br><br><b>ענק.<\/b> שֶׁמַּעֲנִיקִים חַמָּה בְּקוֹמָתָן (שם ל\"ד):", "rashi_en": "הנפילים (lit., the fallen ones) — Anakim who were descendants of Shemchazai and Azael who fell from heaven in the generation of Enosh (cf. Targum Jonathan on Genesis 6:4 and Rashi on Niddah 61a s. v. בני אחיה).<br><br>וכן היינו בעיניהם AND SO WE MUST HAVE BEEN IN THEIR EYES — We heard them say one to another; “There are ants in the vineyards that look like human beings (Sotah 35a). <br><br>ענק — They were thus called because it seemed as if the sun was draped around their necks (מַעֲנִיקִים) because of their height (Sotah 34b)."}, {"ch": 14, "v": 1, "aliyah": 2, "heb": "וַתִּשָּׂא֙ כׇּל־הָ֣עֵדָ֔ה וַֽיִּתְּנ֖וּ אֶת־קוֹלָ֑ם וַיִּבְכּ֥וּ הָעָ֖ם בַּלַּ֥יְלָה הַהֽוּא׃", "onk": "וַאֲרִימַת כָּל כְּנִשְׁתָּא וִיהָבוּ יָת קָלְהוֹן וּבְכוֹ עַמָּא בְּלֵילְיָא הַהוּא:", "onk_en": "The entire community arose and raised their voices; and the people wept that night.", "pj": "וַאֲרֵימַת כָּל כְּנִישְׁתָּא וִיהָבוּ יַת קָלֵיהוֹן וּבְכוֹ עַמָא בְּלֵילְיָא הַהוּא וְאִתְקְבִיעַת לְהוֹן הַהוּא לֵילְיָא לְבָכוּתָא לְדָרֵיהוֹן", "pj_en": "And all the congregation lifted up and gave forth their voice, and the people wept that night: and it was confirmed (as a punishment) that they should weep on that night in their generations.", "tj": "", "tj_en": "", "rashi": "<b>כל העדה.<\/b> סַנְהֶדְרָאוֹת (תנחומא יב):", "rashi_en": "כל העדה ALL THE CONGREGATION — This refers to the Sanhedrin (Midrash Tanchuma, Sh'lach 12; cf. Rashi on Leviticus 4:13 and Note thereon)."}, {"ch": 14, "v": 2, "aliyah": 2, "heb": "וַיִּלֹּ֙נוּ֙ עַל־מֹשֶׁ֣ה וְעַֽל־אַהֲרֹ֔ן כֹּ֖ל בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽיֹּאמְר֨וּ אֲלֵהֶ֜ם כׇּל־הָעֵדָ֗ה לוּ־מַ֙תְנוּ֙ בְּאֶ֣רֶץ מִצְרַ֔יִם א֛וֹ בַּמִּדְבָּ֥ר הַזֶּ֖ה לוּ־מָֽתְנוּ׃", "onk": "וְאִתְרַעֲמוּ עַל משֶׁה וְעַל אַהֲרֹן כֹּל בְּנֵי יִשְׂרָאֵל וַאֲמָרוּ לְהוֹן כָּל כְּנִשְׁתָּא לְוַי דְמִיתְנָא בְּאַרְעָא דְמִצְרַיִם אוֹ בְּמַדְבְּרָא הָדֵין לְוַי דְמִיתְנָא:", "onk_en": "They railed against Moshe and Aharon—all of Bnei Yisroel—and the entire congregation said to them: “Would we had died in the land of Egypt or in this desert, would that we had died.", "pj": "וְאִתְרַעֲמוּ עַל משֶׁה וְעַל אַהֲרן כָּל בְּנֵי יִשְרָאֵל וַאֲמַר לְהוֹן כָּל כְּנִישְׁתָּא לְוַאי דְמִתְנָא בְּאַרְעָא דְמִצְרַיִם אוֹ בְּמַדְבְּרָא הָדֵין לְוַאי דְמִתְנָא", "pj_en": "And all the sons of Israel murmured against Mosheh and Aharon, and said: Would that we had died in the land of Mizraim, or that we may die in this wilderness!", "tj": "", "tj_en": "", "rashi": "<b>לו מתנו.<\/b> הַלְוַאי וָמַתְנוּ:", "rashi_en": "לו מתנו means WOULD THAT WE HAD DIED."}, {"ch": 14, "v": 3, "aliyah": 2, "heb": "וְלָמָ֣ה יְ֠הֹוָ֠ה מֵבִ֨יא אֹתָ֜נוּ אֶל־הָאָ֤רֶץ הַזֹּאת֙ לִנְפֹּ֣ל בַּחֶ֔רֶב נָשֵׁ֥ינוּ וְטַפֵּ֖נוּ יִהְי֣וּ לָבַ֑ז הֲל֧וֹא ט֦וֹב לָ֖נוּ שׁ֥וּב מִצְרָֽיְמָה׃", "onk": "וּלְמָא יְיָ מָעֵל יָתָנָא לְאַרְעָא הָדָא לְמִנְפַּל בְּחַרְבָּא נְשָׁנָא וְטַפְלָנָא יְהוֹן לְבִזָּא הֲלָא טַב לָנָא דִּי נְתוּב לְמִצְרָיִם:", "onk_en": "Why does Adonoy bring us into this land to fall by the sword; our wives and infants would be as spoils; is it not better for us to return to Egypt?”", "pj": "וּלְמָא יְיָ מָעִיל יָתָנָא לְאַרְעָא הֲדָא לְמֵיפַּל בְּחַרְבָּא דִכְנַעֲנָאֵי נְשָׁנָא וְטַפְלָנָא יְהוֹן לְמֵיבַז הֲלָא טַב לָנָא דְנָתוּב לְמִצְרָיִם", "pj_en": "Why is the Lord bringing us into this land, to fall by the sword of the Kenaanaah, and our wives and little ones to become a prey? Will it not be better to return into Mizraim?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 4, "aliyah": 2, "heb": "וַיֹּאמְר֖וּ אִ֣ישׁ אֶל־אָחִ֑יו נִתְּנָ֥ה רֹ֖אשׁ וְנָשׁ֥וּבָה מִצְרָֽיְמָה׃", "onk": "וַאֲמָרוּ גְּבַר לְאָחוֹהִי נְמַנֵּי רֵישָׁא וּנְתוּב לְמִצְרָיִם:", "onk_en": "They said to each other: “Let us appoint (lit. place) a head and we will return to Egypt.”", "pj": "וַאֲמָרוּ גְבַר לְאָחוֹי נְמַנֵי עֲלָן מְלִיךְ לְרֵישׁ וְנָתוּב לְמִצְרַיִם", "pj_en": "And one man said to his brother, Let us appoint a king over us for a chief, and return to Mizraim.", "tj": "נְשַׁוֵי עֲלָן מֶלֶךְ וְנַחֲזוֹר לְמִצְרַיִם:", "tj_en": "Let us set a king over us, and go round to Mizraim.", "rashi": "<b>נתנה ראש.<\/b> כְּתַרְגוּמוֹ \"נְמַנֵּי רֵישָׁא\" — נָשִׂים עָלֵינוּ מֶלֶךְ; וְרַבּוֹתֵינוּ פֵרְשׁוּ, לְשׁוֹן עֲ\"זָ (סנהדרין ק\"ז):", "rashi_en": "נתנה ראש LET US MAKE A CAPTAIN — Understand this as the Targum does: Let us appoint a chief — i.e. let us set a king over us. But our Rabbis explain the word ראש to denote idol-worship (i.e. that they intended to turn to idolatry) (cf. Sanhedrin 107a)."}, {"ch": 14, "v": 5, "aliyah": 2, "heb": "וַיִּפֹּ֥ל מֹשֶׁ֛ה וְאַהֲרֹ֖ן עַל־פְּנֵיהֶ֑ם לִפְנֵ֕י כׇּל־קְהַ֥ל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּנְפַל משֶׁה וְאַהֲרֹן עַל אַפֵּיהוֹן קֳדָם כָּל קְהַל כְּנִשְׁתָּא דִּבְנֵי יִשְׂרָאֵל:", "onk_en": "Moshe and Aharon fell on their faces before the entire gathering of the congregation of Bnei Yisroel.", "pj": "וְאִתְרְכִינוּ משֶׁה וְאַהֲרן עַל אַפֵּיהוֹן קֳדָם כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל", "pj_en": "And Mosheh and Aharon bowed upon their faces before all the congregation of the sons of Israel;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 6, "aliyah": 2, "heb": "וִיהוֹשֻׁ֣עַ בִּן־נ֗וּן וְכָלֵב֙ בֶּן־יְפֻנֶּ֔ה מִן־הַתָּרִ֖ים אֶת־הָאָ֑רֶץ קָרְע֖וּ בִּגְדֵיהֶֽם׃", "onk": "וִיהוֹשֻׁעַ בַּר נוּן וְכָלֵב בַּר יְפֻנֶּה מִן מְאַלֲּלֵי יָת אַרְעָא בְּזָעוּ לְבוּשֵׁיהוֹן:", "onk_en": "Yehoshua the son of Nun and Caleiv the son of Yefuneh, who were among those who scouted the land, tore their clothing [in grief].", "pj": "וִיהוֹשֻׁעַ בַּר נוּן וְכָלֵב בַּר יְפֻנֶה מִן מְאַלְלֵי יַת אַרְעָא בְּזָעוּ לְבוּשֵׁיהוֹן", "pj_en": "and Jehoshua bar Nun and Kaleb bar Jephunneh of the explorers of the land rent their clothes,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 7, "aliyah": 2, "heb": "וַיֹּ֣אמְר֔וּ אֶל־כׇּל־עֲדַ֥ת בְּנֵֽי־יִשְׂרָאֵ֖ל לֵאמֹ֑ר הָאָ֗רֶץ אֲשֶׁ֨ר עָבַ֤רְנוּ בָהּ֙ לָת֣וּר אֹתָ֔הּ טוֹבָ֥ה הָאָ֖רֶץ מְאֹ֥ד מְאֹֽד׃", "onk": "וַאֲמָרוּ לְכָל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל לְמֵימָר אַרְעָא דִּי עֲבַרְנָא בַהּ לְאַלָּלָא יָתַהּ טָבָא אַרְעָא לַחֲדָא לַחֲדָא:", "onk_en": "They said to the entire congregation of Bnei Yisroel, saying: “The land through which we have passed to scout it; that land is very, very good.", "pj": "וַאֲמָרוּ לְכָל כְּנִישְׁתָּא לְמֵימָר אַרְעָא דְעָבַרְנָא בָּהּ לְאַלָלָא יָתָהּ טָבָא אַרְעָא לַחֲדָא לַחֲדָא", "pj_en": "and spake to the congregation, saying: The land we went to see is an exceedingly good land.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 8, "aliyah": 3, "heb": "אִם־חָפֵ֥ץ בָּ֙נוּ֙ יְהֹוָ֔ה וְהֵבִ֤יא אֹתָ֙נוּ֙ אֶל־הָאָ֣רֶץ הַזֹּ֔את וּנְתָנָ֖הּ לָ֑נוּ אֶ֕רֶץ אֲשֶׁר־הִ֛וא זָבַ֥ת חָלָ֖ב וּדְבָֽשׁ׃", "onk": "אִם רַעֲוָא בָנָא קֳדָם יְיָ וְיָעֵל יָתָנָא לְאַרְעָא הָדָא וְיִתְּנִנַהּ לָנָא אַרְעָא דִּי הִיא <b>עָבְדָא<\/b> חֲלַב וּדְבָשׁ:", "onk_en": "If Adonoy desires us, He will bring us into this land and give it to us, a land which flows with [<b>produces<\/b>] milk and honey.", "pj": "אִין רַעֲוָא דַיְיָ אִית בָּנָא וְאָעֵיל יָתָנָא לְאַרְעָא הָדָא וְיִתְּנִינָהּ לָנָא אַרְעָא דְהִיא עַבְדָא חֲלַב וּדְבָשׁ", "pj_en": "If the Lord hath pleasure in us, He will bring us into this land, and give it us, a land producing milk and honey.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 9, "aliyah": 3, "heb": "אַ֣ךְ בַּיהֹוָה֮ אַל־תִּמְרֹ֒דוּ֒ וְאַתֶּ֗ם אַל־תִּֽירְאוּ֙ אֶת־עַ֣ם הָאָ֔רֶץ כִּ֥י לַחְמֵ֖נוּ הֵ֑ם סָ֣ר צִלָּ֧ם מֵעֲלֵיהֶ֛ם וַֽיהֹוָ֥ה אִתָּ֖נוּ אַל־תִּירָאֻֽם׃", "onk": "בְּרַם <b>בְּמֵימְרָא<\/b> דַיְיָ לָא תִמְרְדוּן וְאַתּוּן לָא תִדְחֲלוּן מִן עַמָּא דְאַרְעָא אֲרֵי <b>בִידָנָא מְסִירִין<\/b> אִנּוּן עֲדָא <b>תָקְפְּהוֹן<\/b> מִנְּהוֹן <b>וּמֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדָּנָא<\/b> לָא תִדְחֲלוּן מִנְּהוֹן:", "onk_en": "However, do not rebel against [<b>the word of<\/b>] Adonoy and you do not be afraid of the nation of the land, for they are [as] our bread [<b>delivered into our hands<\/b>], their protection [<b>strength<\/b>] is removed from them, and [<b>the word of<\/b>] Adonoy is with [<b>supports<\/b>] us; do not be afraid of them.”", "pj": "בְּרַם בְּפִיקוּדַיָא דַיְיָ לָא תְבַטְשׁוּן וְאַתּוּן לָא תְדַחֲלוּן מִן עַמָא דְאַרְעָא אֲרוּם בִּידָנָא מְסִירִין הִינוּן תַּשׁ חֵיל גְבוּרַתְהוֹן מֵעֲלֵיהוֹן וּמֵימְרָא דַיְיָ בְּסַעֲדָנָא לָא תִדַחֲלוּן מִנְהוֹן", "pj_en": "Only do not rebel against the commandments of the Lord, and you need not fear the people of the land, for they are delivered into our hands; the strength of their power hath failed from them, but the Word of the Lord will be our helper; fear them not.", "tj": "", "tj_en": "", "rashi": "<b>אל תמרדו.<\/b> וְשׁוּב <b>ואתם אל תראו<\/b>:<br><br><b>כי לחמנו הם.<\/b> נֹאכְלֵם כַּלֶּחֶם:<br><br><b>סר צלם.<\/b> מְגִנָּם וְחָזְקָם, כְּשֵׁרִים שֶׁבָּהֶם מֵתוּ — אִיּוֹב שֶׁהָיָה מֵגֵן עֲלֵיהֶם (סוטה ל\"ה); (דָּ\"אַ, צִלּוֹ שֶׁל הַמָּקוֹם סָר עֲלֵיהֶם):", "rashi_en": "אל תמרדו [ONLY] REBEL NOT YE [AGAINST THE LORD], and consequently  ואתם אל תיראו YOU WILL NOT HAVE TO FEAR [THE PEOPLE OF THE LAND].<br><br>כי לחמנו הם FOR THEY ARE BREAD FOR US — i.e. we shall consume them as bread.<br><br>סר צלם THEIR DEFENSE (lit., shade) IS DEPARTED [FROM THEM] — i.e. their shield and their strength is departed from them: the virtuous among them are dead; one of them was Job, who had protected them by his righteousness (Sotah 35a; cf. Bava Batra 15a). [Another explanation is: the shade (protection) of the Omnipresent is departed from them]. (Cf. Psalms 121:5)."}, {"ch": 14, "v": 10, "aliyah": 3, "heb": "וַיֹּֽאמְרוּ֙ כׇּל־הָ֣עֵדָ֔ה לִרְגּ֥וֹם אֹתָ֖ם בָּאֲבָנִ֑ים וּכְב֣וֹד יְהֹוָ֗ה נִרְאָה֙ בְּאֹ֣הֶל מוֹעֵ֔ד אֶֽל־כׇּל־בְּנֵ֖י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמָרוּ כָּל כְּנִשְׁתָּא לְמִרְגַּם יָתְהוֹן בְּאַבְנַיָּא וִיקָרָא דַיְיָ אִתְגְּלִי בְּמַשְׁכַּן זִמְנָא לְכָל בְּנֵי יִשְׂרָאֵל:", "onk_en": "The entire congregation said that they should be stoned to death, when the glory of Adonoy appeared in the Tent of Meeting, to all of Bnei Yisroel.", "pj": "וַאֲמָרוּ כָּל כְּנִישְׁתָּא לְאַטָלָא יַתְהוֹן בְּאַבְנַיָא וְאִיקַר שְׁכִינְתָּא דַיְיָ אִתְגְלֵי בַּעֲנָנֵי יְקָרָא בְּמַשְׁכַּן זִמְנָא", "pj_en": "But all the congregation said they would stone them with stones. And the glorious Shekinah of the Lord was revealed in bright clouds at the tabernacle.", "tj": "", "tj_en": "", "rashi": "<b>לרגום אתם.<\/b> אֶת יְהוֹשֻׁעַ וְכָלֵב:<br><br><b>וכבוד ה'.<\/b> הֶעָנָן יָרַד שָׁם:", "rashi_en": "לרגום אתם [BUT ALL THE CONGREGATION BADE] TO OVERWHELM THEM WITH STONES — them viz., Joshua and Caleb.<br><br>וכבוד ה׳ AND THE GLORY OF THE LORD [APPEARED IN THE APPOINTED TENT] — i.e. the cloud descended there (Sotah 35a)."}, {"ch": 14, "v": 11, "aliyah": 3, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה עַד־אָ֥נָה יְנַאֲצֻ֖נִי הָעָ֣ם הַזֶּ֑ה וְעַד־אָ֙נָה֙ לֹא־יַאֲמִ֣ינוּ בִ֔י בְּכֹל֙ הָֽאֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּקִרְבּֽוֹ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עַד אֵימָתַי יְהוֹן מְרַגְּזִין <b>קֳדָמַי<\/b> עַמָּא הָדֵין וְעַד אֵימָתַי לָא יְהֵימְנוּן <b>בְּמֵימְרִי<\/b> בְּכֹל אָתַיָּא דִּי עֲבָדִית בֵּינֵיהוֹן:", "onk_en": "Adonoy said to Moshe: “Until where will this people provoke [<b>before<\/b>] Me, and how much longer will they have no faith in Me [<b>my word<\/b>], despite all the signs which I have done in their midst.", "pj": "וַאֲמַר יְיָ לְמשֶׁה עַד אֵימָתַי יְהוֹן מְרַגְזִין קֳדָמַי עַמָא הָדֵין וְעַד אֵימָתַי לָא יְהֵימְנוּן בְּמֵימְרִי לְכָל אַתְוָותָא דְעָבָדִית בֵּינֵיהוֹן", "pj_en": "And the Lord said to Mosheh, How long will this people provoke Me to anger? How long will they disbelieve in My Word, for all the signs I have wrought among them?", "tj": "", "tj_en": "", "rashi": "<b>עד אנה.<\/b> עַד הֵיכָן:<br><br><b>ינאצני.<\/b> יַרְגִּיזוּנִי:<br><br><b>בכל האתות.<\/b> בִּשְׁבִיל כָּל הַנִּסִּים שֶׁעָשִׂיתִי לָהֶם, הָיָה לָהֶם לְהַאֲמִין שֶׁהַיְכֹלֶת בְּיָדִי לְקַיֵּם הַבְטָחָתִי:", "rashi_en": "עד אנה means HOW LONG (while אנה is used of place — “where”, עד אנה denotes time - \"until when\").<br><br>ינאצני means [HOW LONG] WILL THEY PROVOKE ME TO ANGER.<br><br>בכל האתות FOR ALL THE SIGNS — This means: On account of all the signs which I have done for them they ought to have believed that I possess the ability to fulfill My promise."}, {"ch": 14, "v": 12, "aliyah": 3, "heb": "אַכֶּ֥נּוּ בַדֶּ֖בֶר וְאוֹרִשֶׁ֑נּוּ וְאֶֽעֱשֶׂה֙ אֹֽתְךָ֔ לְגוֹי־גָּד֥וֹל וְעָצ֖וּם מִמֶּֽנּוּ׃", "onk": "אֶמְחִנּוּן בְּמוֹתָא וַאֲשֵׁצִנּוּן וְאֶעְבֵּד יָתָךְ לְעַם רַב וְתַקִּיף מִנְּהוֹן:", "onk_en": "I shall smite them with the plague and annihilate them; and I shall make you into a greater and stronger people than they.”", "pj": "אֶמְחֵי יַתְהוֹן בְּמַחְתָא דְמוֹתָא וְאֵישֵׁצֵי יַתְהוֹן וְאַמְנֵי יָתָךְ לְעַם רַב וְתַקִיף מִנְהוֹן", "pj_en": "I will strike them with deadly plague and destroy them, and will appoint thee for a people greater and stronger than they.", "tj": "", "tj_en": "", "rashi": "<b>ואורישנו.<\/b> לְשׁוֹן תֵּרוּכִין, וְאִ\"תֹּ מָה אֶעֱשֶׂה לִשְׁבוּעַת אָבוֹת?<br><br><b>ואעשה אתך לגוי גדול.<\/b> שֶׁאַתָּה מִזַּרְעָם:", "rashi_en": "ואורישנו is an expression for “driving out” (here, driving out from the world, destroying). — And if you ask what I will do regarding the oath I have sworn to the Patriarchs (viz., to give the Land to their children; cf. Exodus 6:3—4), then I reply:<br><br>ואעשה אתך לגוי גדול I WILL MAKE OF THEE A GREAT NATION — [whereby My oath will be fulfilled] since you are one of their descendants (cf. Midrash Tanchuma, Sh'lach 13)."}, {"ch": 14, "v": 13, "aliyah": 3, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה אֶל־יְהֹוָ֑ה וְשָׁמְע֣וּ מִצְרַ֔יִם כִּֽי־הֶעֱלִ֧יתָ בְכֹחֲךָ֛ אֶת־הָעָ֥ם הַזֶּ֖ה מִקִּרְבּֽוֹ׃", "onk": "וַאֲמַר משֶׁה קֳדָם יְיָ וְיִשְׁמְעוּן מִצְרָאֵי אֲרֵי אַסֶּקְתָּא בְחֵילָךְ יָת עַמָּא הָדֵין מִבֵּינֵיהוֹן:", "onk_en": "Moshe said to Adonoy: “But Egypt will hear, that You, in Your might have brought up this people from among them.", "pj": "וַאֲמַר משֶׁה וְיִשְׁמְעוּן בְּנֵיהוֹן דְמִצְרָאֵי דְאִשְׁתַּנָקוּ בְּיַמָא אֲרוּם אֲסֵיקְתָּא בְּחֵילָךְ יַת עַמָא הָדֵין מִבֵּינֵיהוֹן", "pj_en": "But Mosheh said, The children of the Mizraee, whom Thou didst drown in the sea, will hear that Thou didst bring up this people from among them by Thy power,", "tj": "", "tj_en": "", "rashi": "<b>ושמעו מצרים.<\/b> וְשָׁמְעוּ אֶת אֲשֶׁר תַּהַרְגֵם:<br><br><b>כי העלית.<\/b> כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, וְהֵם רָאוּ אֶת אֲשֶׁר הֶעֱלִיתָ בְּכֹחֲךָ הַגָּדוֹל אוֹתָם מִקִּרְבָּם, וּכְשֶׁיִּשְׁמְעוּ שֶׁאַתָּה הוֹרְגָם לֹא יֹאמְרוּ שֶׁחָטְאוּ לְךָ, אֶלָּא יֹאמְרוּ שֶׁכְּנֶגְדָּם יָכֹלְתָּ לְהִלָּחֵם אֲבָל כְּנֶגֶד יוֹשְׁבֵי הָאָרֶץ לֹא יָכֹלְתָּ לְהִלָּחֵם, וְזוֹ הִיא:", "rashi_en": "ושמעו מצרים WHEN THE EGYPTIANS SHALL HEAR IT — i.e. when they hear how you are killing them, [as stated in the previous verse].<br><br>כי העלית — The word כי here is used in the sense of אשר, “that”, and the meaning is: they have seen that Thou broughtest them forth in Thy great strength from their midst, and when they hear that Thou art killing them they will not say that it is because they have sinned against Thee, but they will say that against them Thou wast able to fight, but against the in habitants of the Land of Canaan, however, Thou wast unable to fight; and this is the meaning of —"}, {"ch": 14, "v": 14, "aliyah": 3, "heb": "וְאָמְר֗וּ אֶל־יוֹשֵׁב֮ הָאָ֣רֶץ הַזֹּאת֒ שָֽׁמְעוּ֙ כִּֽי־אַתָּ֣ה יְהֹוָ֔ה בְּקֶ֖רֶב הָעָ֣ם הַזֶּ֑ה אֲשֶׁר־עַ֨יִן בְּעַ֜יִן נִרְאָ֣ה&thinsp;<b>׀<\/b> אַתָּ֣ה יְהֹוָ֗ה וַעֲנָֽנְךָ֙ עֹמֵ֣ד עֲלֵהֶ֔ם וּבְעַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִפְנֵיהֶם֙ יוֹמָ֔ם וּבְעַמּ֥וּד אֵ֖שׁ לָֽיְלָה׃", "onk": "וְיֵמְרוּן לְיָתֵב אַרְעָא הָדָא דִּשְׁמָעוּ אֲרֵי אַתְּ יְיָ <b>דִּשְׁכִנְתָּךְ שַׁרְיַת<\/b> בְּגוֹ עַמָּא הָדֵין דִּי בְעֵינֵיהוֹן <b>חֲזַן שְׁכִינַת יְקָרָא<\/b> דַיְיָ וַעֲנָנָךְ מַטֵּל עִלָּוְהוֹן וּבְעַמּוּדָא דַעֲנָנָא אַתְּ <b>מְדַבַּר<\/b> קֳדָמֵיהוֹן בִּימָמָא וּבְעַמּוּדָא דְאֶשָּׁתָא בְּלֵילְיָא:", "onk_en": "They will say concerning the inhabitants of this land, they have heard that You, Adonoy, are [<b>Your Shechinah dwells<\/b>] among this people, Who appears to them eye to eye (face to face) [<b>who have seen Your glorious Shechinah<\/b>], You, Adonoy; Your Cloud stands over them, in a Pillar of Cloud You go before [<b>lead<\/b>] them daily and in a Pillar of Fire, nightly.", "pj": "וְיֵימְרוּן בְּחֶדְוָוא לְיַתְבֵי אַרְעָא הֲדָא דְיִשְׁמְעוּ אֲרוּם אַנְתְּ הוּא יְיָ דִשְׁכִינְתָּךְ שַׁרְיָא בְּגוֹ עַמָא הָדֵין דִבְעֵינֵיהוֹן חָמוּן שְׁכִינַת יְקָרָךְ יְיָ עַל טַוְורָא דְסִינַי וְקַבִּילוּ תַמָן אוֹרַיְיתָךְ וַעֲנָנָא מַטְלוּל עִילַוֵיהוֹן דְלָא יְהַנְזְקוּן מִשְׁרָבָא וּמִטְרָא וּבְעַמוּדָא דַעֲנָנָא אַנְתְּ מְדַבֵּר קֳדָמֵיהוֹן בִּימָמָא מְטוֹל לְמַכָּכָא טַוְורַיָא וּגְלִימְתָּא וּלְמִידְלֵי מַשְׁרַיָא וּבְעַמוּדָא דְאֵישָׁתָא לְאַנְהָרָא בְּלֵילְיָא", "pj_en": "and will say with exultation to the people of this land, who have heard that Thou art the Lord, whose Shekinah dwelleth among this people, in whose eyes, O Lord, the Glory of Thy Shekinah appeared on the mountain of Sinai, and who there received Thy law; Thy Cloud hath shadowed, that neither heat nor rain might hurt them; and whom in the pillar of the Cloud Thou hast led on by day, that the mountains and hills might be brought low, and the valleys lifted up, and hast guided in the pillar of Fire by night:", "tj": "", "tj_en": "", "rashi": "<b>ואמרו אל יושב הארץ הזאת.<\/b> כְּמוֹ עַל יוֹשֵׁב הָאָרֶץ הַזֹּאת — וּמַה יֹּאמְרוּ עֲלֵיהֶם? מַה שֶּׁאָמוּר בְּסוֹף הָעִנְיָן:<br><br><b>מבלתי יכלת ה'.<\/b> בִּשְׁבִיל שֶׁשָּׁמְעוּ כִּי אַתָּה ה' שׁוֹכֵן בְּקִרְבָּם וְעַיִן בְּעַיִן אַתָּה נִרְאֶה לָהֶם, וְהַכֹּל בְּדֶרֶךְ חִבָּה וְלֹא הִכִּירוּ בְךָ שֶׁנִּתְּקָה אַהֲבָתְךָ מֵהֶם עַד הֵנָּה:", "rashi_en": "ואמרו אל יושב הארץ which is the same as על יושב הארץ THEY WILL SAY CONCERNING THE INHABITANTS OF THIS LAND — What will they say concerning them? That which is stated at the end of the paragraph, (v. 16):  <br><br>'מבלתי יכולת ה “Because the Lord was unable etc. … [he hath slaughtered them in the wilderness]”. — The connection between that verse and what preceeds is as follows: Because they have heard that Thou, O Lord, dwellest in their midst and that Thou appearest to them face to face and all this is in an affectionate manner (i.e. all this is evidence of the affection in which Thou holdest them), and until now they had not realized that Your love for them had been withdrawn. "}, {"ch": 14, "v": 15, "aliyah": 3, "heb": "וְהֵמַתָּ֛ה אֶת־הָעָ֥ם הַזֶּ֖ה כְּאִ֣ישׁ אֶחָ֑ד וְאָֽמְרוּ֙ הַגּוֹיִ֔ם אֲשֶׁר־שָׁמְע֥וּ אֶֽת־שִׁמְעֲךָ֖ לֵאמֹֽר׃", "onk": "וּתְקַטַּל יָת עַמָּא הָדֵין כְּגַבְרָא חָד וְיֵמְרוּן עַמְמַיָּא דִּי שְׁמָעוּ יָת <b>שְׁמַע גְּבֻרְתָּךְ<\/b> לְמֵימָר:", "onk_en": "If You kill this nation like a single man, the nations will say—they who have heard of Your reputation [<b>the fame of Your power<\/b>]—as follows:", "pj": "וּמִן בָּתַר כָּל נִסַיָא הָאִילֵן אַנְתְּ קָטֵיל יַת עַמָא הָדֵין כְּגַבְרָא חָד וְיֵימְרוּן עַמְמַיָא דְיִשְׁמְעוּ יַת שֵׁמַע גְבוּרְתָּךְ לְמֵימָר", "pj_en": "and after all of these miracles wilt Thou kill this people as one man? Then the nations who have heard the fame and of Thy power will speak saying:", "tj": "", "tj_en": "", "rashi": "<b>המתה את העם הזה כאיש אחד.<\/b> פִּתְאֹם, וּמִתּוֹךְ כָּךְ יֹאמְרוּ הַגּוֹיִם אֲשֶׁר שָׁמְעוּ וְגוֹ':", "rashi_en": "והמתה את העם הזה כאיש אחד IF THOU PUTTEST TO DEATH ALL THIS PEOPLE AS ONE MAN — i.e. suddenly; then, because of this the nations who have heard the fame of Thee [will say as follows]:"}, {"ch": 14, "v": 16, "aliyah": 3, "heb": "מִבִּלְתִּ֞י יְכֹ֣לֶת יְהֹוָ֗ה לְהָבִיא֙ אֶת־הָעָ֣ם הַזֶּ֔ה אֶל־הָאָ֖רֶץ אֲשֶׁר־נִשְׁבַּ֣ע לָהֶ֑ם וַיִּשְׁחָטֵ֖ם בַּמִּדְבָּֽר׃", "onk": "מִדְּלֵית יוּכְלָא קֳדָם יְיָ לְאָעָלָא יָת עַמָּא הָדֵין לְאַרְעָא דִּי קַיֵּם לְהוֹן <b>וְקַטְּלִנוּן<\/b> בְּמַדְבְּרָא:", "onk_en": "“It is because of Adonoy’s inability to bring this people into the land that He swore to them, that he slaughtered [<b>killed<\/b>] them in the desert.”", "pj": "מִן בִּגְלַל דְלָא הֲוָת יוּכְלָא מִן קֳדָם יְיָ לְאַעֲלָאָה יַת עַמָא הָדֵין לְאַרְעָא דְקַיֵים לְהוֹן וּקְטָלִינוּן בְּמַדְבְּרָא", "pj_en": "Because there was no (more) strength with the Lord to bring this people into the land which swearing He a promised to them, He hath killed them in the wilderness!", "tj": "", "tj_en": "", "rashi": "<b>מבלתי יכלת וגו'.<\/b> לְפִי שֶׁיּוֹשְׁבֵי הָאָרֶץ חֲזָקִים וְגִבּוֹרִים, וְאֵינוֹ דוֹמֶה פַרְעֹה לִשְׁלֹשִׁים וְאֶחָד מְלָכִים, זֹאת יֹאמְרוּ עַל יוֹשְׁבֵי הָאָרֶץ הַזֹּאת, מִבִּלְתִּי יְכֹלֶת — מִתּוֹךְ שֶׁלֹא הָיָה יְכֹלֶת בְּיָדוֹ לַהֲבִיאָם — שְׁחָטָם:<br><br><b>יכלת.<\/b> שֵׁם דָּבָר הוּא:", "rashi_en": "מבלתי יכלת וגו׳ BECAUSE THE LORD IS UNABLE etc., — “He is unable to bring them into the land on Canaan because the inhabitants of the land are strong and mighty; and besides, one king, Pharaoh, is not like thirty-one kings, who inhabit Canaan”. — This is what they will say concerning the inhabitants of this land (these kings): מבלתי יכלת because He had no power to bring them into the Land He hath slaughtered them (Midrash Tanchuma, Sh'lach 13).<br><br>יכלת is a noun form."}, {"ch": 14, "v": 17, "aliyah": 3, "heb": "וְעַתָּ֕ה <big>יִ<\/big>גְדַּל־נָ֖א כֹּ֣חַ אֲדֹנָ֑י כַּאֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵאמֹֽר׃", "onk": "וּכְעַן סַגִּי כְעַן חֵילָא (מִן) <b>קֳדָם יְיָ<\/b> כְּמָא דְמַלֵּילְתָּא לְמֵימָר:", "onk_en": "Now, please, let my Master’s power be enhanced [<b>before Hashem<\/b>] as You spoke, saying;", "pj": "וּכְדוּן יַסְגֵי כְדוּן חֵילָא קֳדָמָךְ יְיָ וְתִתְמְלֵי רַחֲמִין עֲלֵיהוֹן וְיָתִי תְשַׁוֵי לְעַם רַב הֵיכְמָא דְמַלֵילְתָּא לְמֵימָר", "pj_en": "And now, I beseech Thee, magnify Thy power, O Lord, and let mercies be fulfilled upon us, and appoint me for (this) great people, as Thou hast spoken, saying:", "tj": "", "tj_en": "", "rashi": "(<b>יגדל נא כח ה'.<\/b> לַעֲשׂוֹת דִּבּוּרְךָ:)<br><br><b>כאשר דברת לאמר.<\/b> וּמַהוּ הַדִּבּוּר?", "rashi_en": "('יגדל נא כח ה — LET THE STRENGTH OF MY LORD BE GREAT — by fulfilling Your statement.)<br><br>כאשר דברת לאמר ACCORDING AS THOU HAST SPOKEN, SAYING — And what is the utterance which Thou hast spoken? "}, {"ch": 14, "v": 18, "aliyah": 3, "heb": "יְהֹוָ֗ה אֶ֤רֶךְ אַפַּ֙יִם֙ וְרַב־חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָפָ֑שַׁע וְנַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל־בָּנִ֔ים עַל־שִׁלֵּשִׁ֖ים וְעַל־רִבֵּעִֽים׃", "onk": "יְיָ <b>מַרְחֵק<\/b> רְגַז וּמַסְגֵּי <b>לְמֶעְבַּד<\/b> טַבְוָן (וּקְשׁוֹט) שָׁבֵק לַעֲוָיָן <b>וְלִמְרוֹד<\/b> וּלְחוֹבִין <b>סַלַּח לִדְתַיְבִין לְאוֹרַיְתֵיהּ וּדְלָא תַיְבִין לָא מְזַכֵּי<\/b> מַסְעַר חוֹבֵי אֲבָהָן עַל בְּנִין <b>מְרָדִין<\/b> עַל דַּר תְּלִיתָאֵי וְעַל דַּר רְבִיעָאֵי:", "onk_en": "Adonoy, slow to [<b>distances<\/b>] anger and abounding in [<b>performing<\/b>] kindness, forgiving iniquity, [<b>rebellion<\/b>] and transgression; Who does not completely acquit [<b>pardoning those who return to His Torah, but to those who do not return, He does not acquit<\/b>], Who will visit the inquities of the fathers upon their [<b>rebellious<\/b>] children, to the third [generation] and to the fourth [generation.]", "pj": "יְיָ אֲרִיךְ רוּחַ וְקָרִיב רַחֲמִין שְׁרֵי לְתוּבִין וּמְכַפֵּר עַל סוּרְחָנוּן מַזְכֵּי לִדְתַיְיבִין לְאוֹרַיְיתָא וְלִדְלָא תַיְיבִין לָא מְזַכֵּי מַסְעַר חוֹבֵי אַבְהָן רַשִׁיעִין עַל בְּנִין מְרוֹדִין עַל דַר תְּלִיתָאֵי וְעַל דַר רְבִיעָאֵי", "pj_en": "The Lord is long­ suffering, and nigh in mercy, forgiving sins and covering transgressions, justifying such as return to His law though them who turn not He will not absolve, but will visit the sins of wicked fathers upon rebellious children unto the third and fourth generation.", "tj": "יְיָ אָרִיךְ רַחֲמִין וּרְחַק רְגַז וְקָרֵיב רַחֲמִין וּמַסְגֵי לְמֶעֱבַּד חֶסֶד וּקְשׁוֹט וּמְזַכַּיָא לָא מְזַכֵּי יְיָ חַיָיבַיָא בְּיוֹמָא דִינָא מַדְכַּר חוֹבֵי אַבְהָן רַשִׁיעִין עַל בְּנִין מְרָדִין:", "tj_en": "The Lord is long-suffering, far from anger, near in mercy, multiplying the exercise of goodness and truth; though the Lord will not justify sinners, but will remember, in the day of judgment, the guilt of wicked fathers upon rebellious children.", "rashi": "<b>ה' ארך אפים.<\/b> לַצַּדִּיקִים וְלָרְשָׁעִים; כְּשֶׁעָלָה מֹשֶׁה לַמָּרוֹם מְצָאוֹ לְהַקָּבָּ\"ה שֶׁהָיָה יוֹשֵׁב וְכוֹתֵב ה' אֶרֶךְ אַפַּיִם, אָמַר לוֹ, לַצַּדִּיקִים? אָמַר לוֹ הַקָּבָּ\"ה אַף לָרְשָׁעִים, אָמַר לוֹ רְשָׁעִים יֹאבֵדוּ, אָמַר לוֹ חַיֶּיךָ שֶׁתִּצְטָרֵךְ לַדָּבָר; כְּשֶׁחָטְאוּ יִשְׂרָאֵל בָּעֵגֶל וּבַמְּרַגְּלִים הִתְפַּלֵּל מֹשֶׁה לְפָנָיו בְּאֶרֶךְ אַפַּיִם, אָמַר לוֹ הַקָּבָּ\"ה וַהֲלֹא אָמַרְתָּ לִי לַצַּדִּיקִים? אָמַר לוֹ וַהֲלֹא אָמַרְתָּ לִי אַף לָרְשָׁעִים, <b>יגדל נא כח ה'<\/b> לַעֲשׂוֹת דִּבּוּרְךָ (סנהדרין קי\"א):<br><br><b>ונקה.<\/b> לַשָּׁבִים:<br><br><b>לא ינקה.<\/b> לְשֶׁאֵינָן שָׁבִים (יומא פ\"ו):", "rashi_en": "ה' אֶרֶךְ אַפַּיִם  “The Lord is long suffering” towards both the righteous and the wicked. When Moses ascended to Heaven to receive the Law he found the Holy One, blessed be He, engaged in writing: “The Lord is long-suffering”. He asked, “Surely only to the righteous?” The Holy One, blessed be He, answered him, “To the wicked also!” Whereupon Moses said: “The wicked — let them perish!” He (the Lord) replied to him: “I swear by your life that you shall eventually need this thing (the extension of My mercy also to the wicked)”. When the Israelites sinned at the incident of the Golden Calf and at that of the spies, Moses offered prayer before Him, with mention of God’s attribute of ארך אפים (of His being long suffering). The Holy One, blessed be He, then said to him: Did you not say, “Surely only to the righteous!?” Whereupon Moses replied, “But did You not tell me, ‘To the wicked also’?” Let then — Moses added — the strength of My Lord be great [even as Thou didst say] — by fulfilling Thy statement and not mine! (Sanhedrin 111a).<br><br>ונקה AND HE CLEARS those who repent,<br><br>לא ינקה BUT DOES NOT CLEAR those who do not repent (Yoma 86a; cf. Onkelos and Rashi on Exodus 34:7)."}, {"ch": 14, "v": 19, "aliyah": 3, "heb": "סְלַֽח־נָ֗א לַעֲוֺ֛ן הָעָ֥ם הַזֶּ֖ה כְּגֹ֣דֶל חַסְדֶּ֑ךָ וְכַאֲשֶׁ֤ר נָשָׂ֙אתָה֙ לָעָ֣ם הַזֶּ֔ה מִמִּצְרַ֖יִם וְעַד־הֵֽנָּה׃", "onk": "שְׁבוֹק כְּעַן לְחוֹבֵי עַמָּא הָדֵין כִּסְגִיאוּת טַבְוָתָךְ וּכְמָא דִּי שְׁבַקְתָּא לְעַמָּא הָדֵין מִמִּצְרַיִם וְעַד כְּעָן:", "onk_en": "Please forgive this people according the magnitude of Your kindness, and as You have borne this people since Egypt until this time.”", "pj": "שְׁבוֹק כְּדוֹן לְסוּרְחָנוּת עַמָא הָדֵין כִּסְגִיאוּת טֵבְוָותָךְ וְהֵיכְמָא דְשָׁרִיתָא לְעַמָא הָדֵין מִן זְמַן דִנְפָקוּ מִמִצְרַיִם וְעַד כְּדוֹן", "pj_en": "Pardon now the sin of this people according to Thy great goodness, even as Thou hast forgiven them from the time that they came out from Mizraim until now.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 20, "aliyah": 3, "heb": "וַיֹּ֣אמֶר יְהֹוָ֔ה סָלַ֖חְתִּי כִּדְבָרֶֽךָ׃", "onk": "וַאֲמַר יְיָ שְׁבָקִית כְּפִתְגָּמָךְ:", "onk_en": "Adonoy said, “I have forgiven them, just as you spoke.", "pj": "וַאֲמַר יְיָ שַׁבְקִית כְּפִתְגָמָךְ", "pj_en": "And the Lord said, I have forgiven, according to thy word.", "tj": "וַאֲמַר מֵימְרָא דַיְיָ הָא שְׁרִיתִי וּשְׁבָקִית כְּפִתְגָמָךְ:", "tj_en": "And the Word of the Lord said, Behold, I have absolved and pardoned, according to thy word.", "rashi": "<b>כדברך.<\/b> בִּשְׁבִיל מַה שֶּׁאָמַרְתָּ \"פֶּן יֹאמְרוּ מִבִּלְתִּי יְכֹלֶת ה'\":", "rashi_en": "כדברך [I HAVE FORGIVEN] ACCORDING TO THY WORD — i.e. because of what you have said, “Lest they say: ‘Because the Lord was unable, etc.’”."}, {"ch": 14, "v": 21, "aliyah": 3, "heb": "וְאוּלָ֖ם חַי־אָ֑נִי וְיִמָּלֵ֥א כְבוֹד־יְהֹוָ֖ה אֶת־כׇּל־הָאָֽרֶץ׃", "onk": "וּבְרַם קַיָּם אָנָא וּמַלְיָא יְקָרָא דַיְיָ יָת כָּל אַרְעָא:", "onk_en": "However, just as I live and the Glory of Adonoy fills the entire land;", "pj": "וּבְרַם בִּשְׁבוּעָה קַיֵים אֲנָא וּמַלְיָא יְקָרָא דַיְיָ יַת כָּל אַרְעָא", "pj_en": "Nevertheless, by oath have I sworn that the whole earth shall be filled with the glory of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ואולם.<\/b> כְּמוֹ אֲבָל זֹאת אֶעֱשֶׂה לָהֶם:<br><br><b>חי אני.<\/b> לְשׁוֹן שְׁבוּעָה, כְּשֵׁם שֶׁאֲנִי חַי וּכְבוֹדִי יִמָּלֵא א
