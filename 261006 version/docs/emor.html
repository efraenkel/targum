 an אונן (Yevamot 68b)."}, {"ch": 22, "v": 14, "aliyah": 2, "heb": "וְאִ֕ישׁ כִּֽי־יֹאכַ֥ל קֹ֖דֶשׁ בִּשְׁגָגָ֑ה וְיָסַ֤ף חֲמִֽשִׁיתוֹ֙ עָלָ֔יו וְנָתַ֥ן לַכֹּהֵ֖ן אֶת־הַקֹּֽדֶשׁ׃", "onk": "וּגְבַר אֲרֵי יֵיכוּל קוּדְשָׁא בְּשָׁלוּ וְיוֹסֵף חוּמְשֵׁיהּ עֲלוֹהִי וִיתֵּן לְכַהֲנָא יָת קוּדְשָׁא:", "onk_en": "If a man inadvertently eats of sacred-offering, he shall add a fifth, to it[s worth] and give to the <i>kohein<\/i> the holy thing.", "pj": "וּגְבַר יִשְרָאֵל אֲרוּם יֵיכוּל קוּדְשָׁא בְּשָׁלוּ וְיוֹסֵף חוֹמֶשׁ דְמוֹי עֲלוֹי וְיִתֵּן לְכַהֲנָא יַת קוּדְשָׁא", "pj_en": "And if a man of Israel eat that which is consecrated unknowingly, let him add a fifth part of its value to it, and give the (price of the) holy thing unto the priest.", "tj": "", "tj_en": "", "rashi": "<b>כי יאכל קדש.<\/b> תְּרוּמָה:<br><br><b>ונתן לכהן את הקדש.<\/b> דָּבָר הָרָאוּי לִהְיוֹת קֹדֶשׁ, שֶׁאֵינוֹ פוֹרֵעַ לוֹ מָעוֹת, אֶלָּא פֵּרוֹת שֶׁל חֻלִּין וְהֵן נַעֲשִֹין תְּרוּמָה (פסחים ל\"ב):", "rashi_en": "כי יאכל קדש AND IF [A MAN] EAT OF HOLY THINGS — the heave-offering.<br><br>ונתן לכהן את הקדש THEN SHALL HE GIVE UNTO THE PRIEST THE קדש — i. e. a thing capable of becoming קדש, thus implying that he does not pay him money but fruits of a non-sacred character (חולין), which then become תרומה (cf. Sifra, Emor, Chapter 6 5; Pesachim 32b)."}, {"ch": 22, "v": 15, "aliyah": 2, "heb": "וְלֹ֣א יְחַלְּל֔וּ אֶת־קׇדְשֵׁ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֥ת אֲשֶׁר־יָרִ֖ימוּ לַיהֹוָֽה׃", "onk": "וְלָא יְחַלּוּן יָת קוּדְשַׁיָּא דִּבְנֵי יִשְׂרָאֵל יָת דִּי יַפְרְשׁוּן <b>קֳדָם<\/b> יְיָ:", "onk_en": "They shall not profane the holy things of Bnei Yisroel that which they designated for [<b>before<\/b>] Adonoy.", "pj": "וְלָא יִפְסוּן יַת קוּדְשָׁא דִבְנֵי יִשְרָאֵל יַת דְיַפְרְשׁוּן לִשְׁמָא דַיְיָ", "pj_en": "Let them not profane the sacred things of the children of Israel which are set apart unto the Name of the Lord,", "tj": "", "tj_en": "", "rashi": "<b>ולא יחללו וגו'.<\/b> לְהַאֲכִילָם לְזָרִים:", "rashi_en": "'‎ולא יחוללו וגו‎‎ AND THEY SHALL NOT PROFANE [THE HOLY THINGS OF THE CHILDREN OF ISRAEL] — by giving them to non-priests to eat of them."}, {"ch": 22, "v": 16, "aliyah": 2, "heb": "וְהִשִּׂ֤יאוּ אוֹתָם֙ עֲוֺ֣ן אַשְׁמָ֔ה בְּאׇכְלָ֖ם אֶת־קׇדְשֵׁיהֶ֑ם כִּ֛י אֲנִ֥י יְהֹוָ֖ה מְקַדְּשָֽׁם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיקַבְּלוּן עֲלֵיהוֹן עֲוָיָן וְחוֹבִין בְּמֵיכָלְהוֹן <b>בְּסוֹאַבָא<\/b> יָת קוּדְשֵׁיהוֹן אֲרֵי אֲנָא יְיָ מְקַדִּשְׁהוֹן:", "onk_en": "They burden them[selves] with the sin of their guilt when they eat their holy things [<b>in impurity<\/b>], for I am Adonoy, Who makes them holy.", "pj": "וִיאַרְעוּן יַתְהוֹן חוֹבֵי אַשְׁמַתְהוֹן בְּמֵיכַלְהוֹן בְּסוֹאֲבָא יַת קוּדְשֵׁיהוֹן אֲרוּם אֲנָא יְיָ מְקַדִישְׁהוֹן", "pj_en": "nor let the sin of their trespass be found upon them, by eating in uncleanness their consecrated things; for I am the Lord who do sanctify them.", "tj": "", "tj_en": "", "rashi": "<b>והשיאו אותם.<\/b> אֶת עַצְמָם יִטְעֲנוּ עָוֹן <b>באכלם את קדשיהם<\/b> שֶׁהֻבְדְּלוּ לְשֵׁם תְּרוּמָה, וְקָדְשׁוּ וְנֶאֶסְרוּ עֲלֵיהֶן; וְאֻנְקְלוֹס שֶׁתִּרְגֵּם \"בְּמֵיכָלְהוֹן בְּסוֹאֲבָא\", שֶׁלֹּא לְצֹרֶךְ תִּרְגְּמוֹ כֵן:<br><br><b>והשיאו אותם.<\/b> זֶה אֶחָד מִשְּׁלוֹשָׁה אֶתִים שֶׁהָיָה רַבִּי יִשְׁמָעֵאל דּוֹרֵשׁ בַּתּוֹרָה שֶׁמְּדַבְּרִים בָּאָדָם עַצְמוֹ, וְכֵן \"בְּיוֹם מְלֹאת יְמֵי נִזְרוֹ יָבִיא אֹתוֹ\" (במדבר ו') — הוּא יָבִיא אֶת עַצְמוֹ, וְכֵן \"וַיִּקְבֹּר אֹתוֹ בַגַּי\" (דברים ל\"ד) — הוּא קָבַר אֶת עַצְמוֹ, כָּךְ נִדְרָשׁ בְּסִפְרֵי:", "rashi_en": "והשיאו אותם means, and they (the priests) would burden themselves with sin, באכלם את קדשיהם WHEN THEY (the non-priests) EAT THEIR HOLY THINGS which have been set apart for the purpose of heave-offering and have thereby become holy and forbidden to them. [Onkelos who translated באכלם את קדשיהם by “when they (the priests) eat them in their uncleanness” has translated it thus quite unnecessarily] (But cf. Rashi on Sanhedrin 90b).<br><br>והשיאו אותם — This (the word אותם) is one of the three cases of את with a pronominal suffix occurring in the Torah which R. Ishmael explained as speaking of (referring to) the person himself who is the subject of the sentence (i. e. as being reflexive and not accusative pronouns). In the same sense did he explain (Numbers 4:13) “[And this is the law of the Nazarite] when the days of his Nazaritehood are fulfilled, יביא אותו [to the entrance of the appointed tent]” as meaning: he shall bring himself (i. e. present himself) to the entrance etc. Similarly he explained (Deuteronomy 34:6)  “ויקבור אותו in the glen” as meaning: he (Moses) buried himself (i. e. he went into a cave and died there cf. Avot 5:9 and יד משה on Shemot Rabbah 10). Thus is it explained in the Sifrei Bamidbar 32 (on Numbers 6:3)."}, {"ch": 22, "v": 17, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 18, "aliyah": 3, "heb": "דַּבֵּ֨ר אֶֽל־אַהֲרֹ֜ן וְאֶל־בָּנָ֗יו וְאֶל֙ כׇּל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם אִ֣ישׁ אִישׁ֩ מִבֵּ֨ית יִשְׂרָאֵ֜ל וּמִן־הַגֵּ֣ר בְּיִשְׂרָאֵ֗ל אֲשֶׁ֨ר יַקְרִ֤יב קׇרְבָּנוֹ֙ לְכׇל־נִדְרֵיהֶם֙ וּלְכׇל־נִדְבוֹתָ֔ם אֲשֶׁר־יַקְרִ֥יבוּ לַיהֹוָ֖ה לְעֹלָֽה׃", "onk": "מַלֵּיל עִם אַהֲרֹן וְעִם בְּנוֹהִי וְעִם כָּל בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן גְּבַר גְּבַר מִבֵּית יִשָׂרָאֵל וּמִן גִּיּוֹרָא בְּיִשְׂרָאֵל דִּי יְקָרֵב קֻרְבָּנֵיהּ לְכָל נִדְרֵיהוֹן וּלְכָל נִדְבַתְהוֹן דִּי יְקָרְבוּן <b>קֳדָם<\/b> יְיָ לַעֲלָתָא:", "onk_en": "Speak to Aharon and to his sons and to all of Bnei Yisroel and say to them; any man of the House of Israel, and from the proselytes of Israel who will bring his offering for any of their vows or for any of their free-will-offerings that they will bring to [<b>before<\/b>] Adonoy, for a burnt-offering.", "pj": "מַלֵיל עִם אַהֲרן וְעִם בְּנוֹי וְעִם כָּל בְּנֵי יִשְרָאֵל גְבַר טְלֵי אוֹ גְבַר סִיב מִבֵּית גְנִיסַת יִשְרָאֵל וּמִן גִיוֹרָא דִבְיִשְרָאֵל דְיִקְרַב קוּרְבָּנֵיהּ לְכָל נִדְרֵיהוֹן וּלְכָל נְסִיבַתְהוֹן דִיקַרְבוּן קֳדָם יְיָ לְעָלָתָא", "pj_en": "Speak with Aharon and with his sons and with all the children of Israel: -A man, whether young or old, of the house of the family of Israel, or of the strangers who are in Israel, who shall offer his oblation of any of their vows, or their free will offerings which they present before the Lord for a burnt sacrifice,", "tj": "", "tj_en": "", "rashi": "<b>נדריהם.<\/b> הֲרֵי עָלַי:<br><br><b>נדבותם.<\/b> הֲרֵי זוֹ:", "rashi_en": "נדריהם THEIR VOWS — [An animal is termed נדר when an obligation is entered into by the words:] Behold, I take it upon myself [to bring a burnt-offering].<br><br>נדבותם THEIR FREE-WILL OFFERINGS — [it is a נדבה when one states:] Behold, this animal [shall be a burnt-offering] (Megillah 8a)."}, {"ch": 22, "v": 19, "aliyah": 3, "heb": "לִֽרְצֹנְכֶ֑ם תָּמִ֣ים זָכָ֔ר בַּבָּקָ֕ר בַּכְּשָׂבִ֖ים וּבָֽעִזִּֽים׃", "onk": "לְרַעֲוָא לְכוֹן שְׁלִים דְּכוּרָא בְּתוֹרֵי בְּאִמְרַיָּא וּבְעִזַּיָּא:", "onk_en": "To gain acceptance [it must be] an unblemished male of cattle, sheep or goats.", "pj": "לְרַעֲוָא לְכוֹן שְׁלִים דְכַר בְּתוֹרֵי בְּאִימְרַיָא וּבִבְנֵי עִזַיָא", "pj_en": "to be acceptable for you, it shall be perfect, a male of the bullocks, of the lamb, or of the young goats.", "tj": "", "tj_en": "", "rashi": "<b>לרצנכם.<\/b> הָבִיאוּ דָּבָר הָרָאוּי לְרַצּוֹת אֶתְכֶם לְפָנַי, שֶׁיְּהֵא לָכֶם לְרָצוֹן, אפיי\"מנט בְּלַעַז, וְאֵיזֶהוּ הָרָאוּי לְרָצוֹן?<br><br><b>תמים זכר בבקר בכבשים ובעזים.<\/b> אֲבָל בְּעוֹלַת הָעוֹף אֵין צָרִיךְ תַּמּוּת וְזַכְרוּת, וְאֵינוֹ נִפְסָל בְּמוּם אֶלָּא בְּחֶסְרוֹן אֵבֶר (ספרא):", "rashi_en": "לרצנכם — The meaning is: bring such a thing (animal) as is fitted to cause רצון, propitiation for you before Me. The word לרצנכם means: so that it may be to you for propitiation; apaisement in old French And which animal is it that is fitting to effect propitiation? <br><br>תמים זכר בבקר בכבשים ובעזים A MALE WITHOUT BLEMISH OF THE CATTLE, OF THE SHEEP, OR OF THE GOATS — but in the case of a burnt-offering that consists in a bird, the unblemished condition and the male sex are not essential, and it does not become unfit for sacrifice by reason of a mere blemish (a bodily defect), but only by reason of the loss of a limb (Sifra, Emor, Section 7 2)."}, {"ch": 22, "v": 20, "aliyah": 3, "heb": "כֹּ֛ל אֲשֶׁר־בּ֥וֹ מ֖וּם לֹ֣א תַקְרִ֑יבוּ כִּי־לֹ֥א לְרָצ֖וֹן יִהְיֶ֥ה לָכֶֽם׃", "onk": "כֹּל דִּי בֵיהּ מוּמָא לָא תְקָרְבוּן אֲרֵי לָא לְרַעֲוָא יְהֵי לְכוֹן:", "onk_en": "Anything that has a blemish on it you shall not bring, for it will not be accepted favorably for you.", "pj": "כָּל דְבֵיהּ מוּמָא לָא תְקַרְבוּן אֲרוּם לָא לְרַעֲוָא יְהֵי לְכוֹן", "pj_en": "But anything that hath a blemish you shall not offer; for that will not be acceptable from you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 21, "aliyah": 3, "heb": "וְאִ֗ישׁ כִּֽי־יַקְרִ֤יב זֶֽבַח־שְׁלָמִים֙ לַיהֹוָ֔ה לְפַלֵּא־נֶ֙דֶר֙ א֣וֹ לִנְדָבָ֔ה בַּבָּקָ֖ר א֣וֹ בַצֹּ֑אן תָּמִ֤ים יִֽהְיֶה֙ לְרָצ֔וֹן כׇּל־מ֖וּם לֹ֥א יִהְיֶה־בּֽוֹ׃", "onk": "וּגְבַר אֲרֵי יְקָרֵב נִכְסַת <b>קוּדְשַׁיָּא קֳדָם<\/b> יְיָ לְפָרָשָׁא נִדְרָא אוֹ לִנְדַבְתָּא בְּתוֹרֵי אוֹ בְעָנָא שְׁלִים יְהֵי לְרַעֲוָא כָּל מוּמָא לָא יְהֵי בֵיהּ:", "onk_en": "If a man will bring a peace[<b>sacred<\/b>]-offering to [<b>before<\/b>] Adonoy, to fulfill an articulated vow or free-will-offering of cattle or of sheep, it shall be unblemished, that it be favorably accepted. No blemish shall be in it.", "pj": "וּגְבַר אֲרוּם יִקְרַב נִכְסַת קוּדְשַׁיָא קֳדָם יְיָ לְאַפְרָשָׁא נִדְרָא אוֹ נְסֵיבְתָּא בְּתוֹרֵי אוֹ בְעָנָא שְׁלִים יְהֵי לְרַעֲוָא כָּל מוּמָא לָא יְהֵי בֵיהּ", "pj_en": "And if a man will offer a consecrated victim before the Lord to fulfil a vow, or as a free will offering, from the herd, or from the flock, it must be perfect to be acceptable; no blemish shall be in it.", "tj": "", "tj_en": "", "rashi": "<b>לפלא נדר.<\/b> לְהַפְרִישׁ בְּדִבּוּרוֹ:", "rashi_en": "לפלא נדר means, expressing it by speech (not expressing it mentally,‎ בלב)."}, {"ch": 22, "v": 22, "aliyah": 3, "heb": "עַוֶּ֩רֶת֩ א֨וֹ שָׁב֜וּר אוֹ־חָר֣וּץ אֽוֹ־יַבֶּ֗לֶת א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת לֹא־תַקְרִ֥יבוּ אֵ֖לֶּה לַיהֹוָ֑ה וְאִשֶּׁ֗ה לֹא־תִתְּנ֥וּ מֵהֶ֛ם עַל־הַמִּזְבֵּ֖חַ לַיהֹוָֽה׃", "onk": "עַוִּיר אוֹ תְבִיר אוֹ פְסִיק אוֹ יַבְּלָן אוֹ גַרְבָן אוֹ חֲזָזָן לָא תְקָרְבוּן אִלֵּין <b>קֳדָם<\/b> יְיָ <b>וְקֻרְבָּנָא<\/b> לָא תִתְּנוּן מִנְּהוֹן עַל מַדְבְּחָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "A blind, broken-limbed, cracked or wart[ed animal]; or [an animal] with scurf or scabs you shall not bring these to [<b>before<\/b>] Adonoy; and as a fire-offering [<b>an offering<\/b>] you shall not place of them on the altar of [<b>before<\/b>] Adonoy.", "pj": "דְסָמֵי אוֹ דִתְבִיר גַרְמָא אוֹ דְרִיסוֹי לַקְיַין אוֹ דְעֵינוֹי לַקְיַין דִמְעָרַב חִיוְרָא בְּאוּכְמָא אוֹ דִמְלֵי חַרְסִין יַבְשִׁין אוֹ חֲזָזִיתָא מִצְרֵיתָא לָא תְקַרְבוּן אִלֵין קֳדָם יְיָ וְקוּרְבָּנָא לָא תְקַרְבוּן מִנְהוֹן עַל מַדְבְּחָא קֳדָם יְיָ", "pj_en": "Whatever is blind, or broken-boned, or stricken in the eyelids, or whose eyes are stricken with a mixture of white and dark, or one filled with scurvy or the blotches murrain, you shall not offer before the Lord, nor present an oblation of them on the altar before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>עורת.<\/b> שֵׁם דָּבָר שֶׁל מוּם עִוָּרוֹן בְּלָשׁוֹן נְקֵבָה — שֶׁלֹּא יְהֵא בוֹ מוּם שֶׁל עִוָּרוֹן:<br><br><b>או שבור.<\/b> לֹא יִהְיֶה:<br><br><b>חרוץ.<\/b> רִיס שֶׁל עַיִן שֶׁנִּסְדַּק אוֹ שֶׁנִּפְגַּם וְכֵן שְׂפָתוֹ שֶׁנִּסְדְּקָה אוֹ נִפְגְּמָה (בכורות ל\"ח):<br><br><b>יבלת.<\/b> ורו\"אה בְּלַעַז:<br><br><b>גרב.<\/b> מִין חֲזָזִית וְכֵן יַלֶּפֶת, וּלְשׁוֹן יַלֶּפֶת כְּמוֹ וַיִּלְפֹּת שִׁמְשׁוֹן (שופטים ט\"ז), שֶׁאֲחוּזָה בוֹ עַד יוֹם מִיתָה, שֶׁאֵין לָהּ רְפוּאָה:<br><br><b>לא תקריבו.<\/b> שָׁלוֹשׁ פְּעָמִים, לְהַזְהִיר עַל הַקְדָּשָׁתָן וְעַל שְׁחִיטָתָן וְעַל זְרִיקַת דָּמָן (תמורה ו'):<br><br><b>ואשה לא תתנו.<\/b> אַזְהָרַת הַקְטָרָתָן:", "rashi_en": "‎עורת is a noun denoting the blemish of blindness (עִוָּרֹן), being, however, a feminine form of the latter. The text therefore means that there shall not be the defect of blindness in it (in the sacrifice).<br><br>או שבור nor shall it be a broken animal. <br><br>חרוץ CHAPPED — an eye-lid that is split or has a piece cut out of its edge; and similarly, its (the animal’s) lip that is split or has a piece cut out of its edge (Sifra, Emor, Section 7 12; Bekhorot 38a).<br><br>יבלת is called verrue in old French, (English = wart).<br><br>גרב is a kind of lichen and so too is ילפת. The word ילפת is connected in meaning with (Judges 16:29) “And Samson took hold (וילפת) [of the two middle pillars]”. The blemish is so called because it keeps its grasp on him (the sick person) until the day of his death, since there is no cure for it (cf. Rashi on Leviticus 21:20).<br><br>לא תקריבו YE SHALL NOT OFFER — Three times is the expression לא תקריבו used in this section (here and in v. 20 and 24), in order to lay down a separate prohibition regarding designating them (blemished animals) as sacrifices, slaughtering them and sprinkling their blood (cf. Temurah 6b).<br><br>ואשה לא תתנו YE SHALL NOT MAKE A FIRE-OFFERING [OF THEM] — This contains the prohibition of burning them on the altar (Temurah 6b)."}, {"ch": 22, "v": 23, "aliyah": 3, "heb": "וְשׁ֥וֹר וָשֶׂ֖ה שָׂר֣וּעַ וְקָל֑וּט נְדָבָה֙ תַּעֲשֶׂ֣ה אֹת֔וֹ וּלְנֵ֖דֶר לֹ֥א יֵרָצֶֽה׃", "onk": "וְתוֹר וְאִמַּר יַתִּיר <b>וְחַסִּיר<\/b> נְדַבְתָּא תַּעְבֵּד יָתֵיהּ וּלְנִדְרָא לָא יְהֵי לְרַעֲוָא:", "onk_en": "An ox or lamb with one limb larger [or smaller] than the other or with uncleft hooves [<b>one limb smaller than the other<\/b>], you shall make (offer) it as a free-will-offering [to the temple treasury] [but] for [the fulfillment of] a vow it will not be favorably accepted.", "pj": "וְתוֹר וְאִימַר יַתִּיר כּוּלְיָא אוֹ דְחָסִיר כּוּלְיָא נְסִיבָא תַעֲבֵיד יָתֵיהּ וּלְנִידְרָא לָא יְהֵי לְרַעֲוָא", "pj_en": "A bullock or a ram that hath superfluity or deficiency of the testicles, you may make a free will offering, but for a vow it will not be acceptable.", "tj": "", "tj_en": "", "rashi": "<b>שרוע.<\/b> אֵבֶר גָּדוֹל מֵחֲבֵרוֹ:<br><br><b>וקלוט.<\/b> פַּרְסוֹתָיו קְלוּטוֹת (בכורות מ'):<br><br><b>נדבה תעשה אתו.<\/b> לְבֶדֶק הַבַּיִת:<br><br><b>ולנדר.<\/b> לַמִּזְבֵּחַ:<br><br><b>לא ירצה.<\/b> אֵי זֶה הֶקְדֵּשׁ בָּא לְרַצּוֹת? הֱוֵי אוֹמֵר זֶה הֶקְדֵּשׁ הַמִּזְבֵּחַ (תמורה ז'):", "rashi_en": "שרוע is an animal that has one limb larger than its fellow-limb (Bekhorot 40a).<br><br>וקלוט is an animal which has uncloven hoofs (the sign of uncleaness; cf. Leviticus 11:4—6. It is a שור or a שה which, being a clean animal, is fitted to be sacrificed, but abnormally its hoofs are uncloven) (Bekhorot 40a).<br><br>נדבה תעשה אתו THOU MAYEST DESIGNATE IT FOR A FREE-WILL OFFERING for the purpose of repairing the breaches in the Temple from the proceeds of its sale,<br><br>ולנדר BUT AS A VOW — i. e. as an animal vowed for the altar (for sacrifice), it shall not be accepted.<br><br>לא ירצה [BUT AS A נדר] THERE SHALL NOT BE PROPITIATION — What dedicated thing is it that is intended to effect propiation? You must admit that it is something dedicated to the altar. Consequently נדר can only mean a sacrifice for the altar (Sifra, Emor, Chapter 7 6)."}, {"ch": 22, "v": 24, "aliyah": 3, "heb": "וּמָע֤וּךְ וְכָתוּת֙ וְנָת֣וּק וְכָר֔וּת לֹ֥א תַקְרִ֖יבוּ לַֽיהֹוָ֑ה וּֽבְאַרְצְכֶ֖ם לֹ֥א תַעֲשֽׂוּ׃", "onk": "וְדִי מְרִיס וְדִי רְסִיס וְדִי שְׁלִיף וְדִי גְזִיר לָא תְקָרְבוּן <b>קֳדָם<\/b> יְיָ וּבְאַרְעֲכוֹן לָא תַעְבְּדוּן:", "onk_en": "[An animal that has its testicles] crushed, mangled, torn or cut off you shall not bring to [<b>before<\/b>] Adonoy and in your land you shall not inflict these injuries.", "pj": "וּדְמָעִיךְ וּדְכָתִישִׁין פַּחֲדוֹי וְדִשְׁחִית וְדִמְרְסִיס גִדוֹי לָא תְקַרְבוּן לִשְׁמָא דַיְיָ וּבְאַרְעֲכוֹן לָא תְסַרְסוּן", "pj_en": "That which is crushed, or ruptured, or diseased, or enervated, you shall not offer to the Name of the Lord; and in your land you shall not emasculate.", "tj": "", "tj_en": "", "rashi": "<b>ומעוך וכתות ונתוק וכרות.<\/b> בַּבֵּיצִים אוֹ בַגִּיד:<br><br><b>מעוך.<\/b> בֵּיצָיו מְעוּכִין בַּיָּד:<br><br><b>כתות.<\/b> כְּתוּשִׁים יוֹתֵר מִמָּעוּךְ:<br><br><b>נתוק.<\/b> תְּלוּשִׁין בַּיָּד עַד שֶׁנִּפְסְקוּ חוּטִים שֶׁתְּלוּיִים בָּהֶן, אֲבָל נְתוּנִים הֵם בְּתוֹךְ הַכִּיס, וְהַכִּיס לֹא נִתְלַשׁ:<br><br><b>וכרות.<\/b> כְּרוּתִין בִּכְלִי וְעוֹדָן בַּכִּיס (בכורות ל\"ט):<br><br>[<b>ומעוך.<\/b> תַּרְגּוּמוֹ וְדִי מְרִיס, זֶהוּ לְשׁוֹנוֹ בַּאֲרָמִית, לְשׁוֹן כְּתִישָׁה:<br><br><b>וכתות<\/b> תַּרְגּוּמוֹ וְדִי רְסִיס, כְּמוֹ \"הַבַּיִת הַגָּדוֹל רְסִיסִים\" (עמוס ו') — בְּקִיעוֹת דַּקּוֹת, וְכֵן \"קָנֶה הַמְרֻסָּס\" (שבת פ'):]<br><br><b>ובארצכם לא תעשו.<\/b> דָּבָר זֶה לְסָרֵס שׁוּם בְּהֵמָה וְחַיָּה, וַאֲפִלּוּ טְמֵאָה, לְכָךְ נֶאֱמַר בְּאַרְצְכֶם לְרַבּוֹת כָּל אֲשֶׁר בְּאַרְצְכֶם, שֶׁאִאֶ\"לֹ לֹא נִצְטַוּוּ עַל הַסֵּרוּס אֶלָּא בָאָרֶץ, שֶׁהֲרֵי סֵרוּס חוֹבַת הַגּוּף הִיא וְכָל חוֹבַת הַגּוּף נוֹהֶגֶת בֵּין בָּאָרֶץ בֵּין בְּחוּצָה לָאָרֶץ:", "rashi_en": "ומעוך וכתות ונתוק וכרות are forbidden as sacrifices whether the mutilation be in the testicles or the membrum.<br><br>מעוך means, one whose testicles have been pressed by hand.<br><br>כתות CRUSHED — it implies more severely crushed than מעוך. <br><br>נתוק — they have been torn off by the hand, so that the threads on which they hang have snapped but they are still in the scrotum, the scrotum itself not having been torn off.<br><br>וכרות — they have been cut away by an instrument but are still in the scrotum (cf. Sifra, Emor, Chapter 7 9; Bekhorot 39b).<br><br>[ומעוך — Its translation in the Targum is, ודי מריס; this is its exact translation in Aramaic, because this Aramaic root has the meaning of pounding.<br><br>וכתות, however, is translated by the Targum ודי רסיס “and that which is smashed”, (a stronger term than מרס), similar to, Amos 6:11) “The great house shall be smitten into רסיסים‎” i. e. into small fragments; similar is the Talmudical expression (Shabbat 80b) a reed crushed to pieces (מרוסס‎‎‎‎)]. <br><br>ובארצכם לא תעשו NEITHER SHALL YE DO IN YOUR  LAND this thing — to castrate any cattle or beast even if it be unclean. That is why Scripture adds “in your land” — to include every animal that is in your land under this law (cf. Chagigah 14b and Tosafot there). For it is impossible to say that they are here commanded to abstain from mutilating animals in the Land of Israel only, (and that the word must be translated: “In your land you must not do this”, implying, but you may do it elsewhere) for surely the command regarding mutilation is a personal duty and any personal duty has to be practiced both in the Land and outside the Land (Kiddushin 36b; cf. Sifra, Emor, Chapter 7 11)."}, {"ch": 22, "v": 25, "aliyah": 3, "heb": "וּמִיַּ֣ד בֶּן־נֵכָ֗ר לֹ֥א תַקְרִ֛יבוּ אֶת־לֶ֥חֶם אֱלֹהֵיכֶ֖ם מִכׇּל־אֵ֑לֶּה כִּ֣י מׇשְׁחָתָ֤ם בָּהֶם֙ מ֣וּם בָּ֔ם לֹ֥א יֵרָצ֖וּ לָכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּמִן בַּר עַמְמִין לָא תְקָרְבוּן יָת <b>קֻרְבַּן<\/b> אֱלָהָכוֹן מִכָּל אִלֵּין אֲרֵי חִבּוּלְהוֹן בְּהוֹן מוּמָא בְהוֹן לָא לְרַעֲוָא יְהוֹן לְכוֹן:", "onk_en": "And from a strangers [gentiles] hand you shall not bring (offer) the bread [<b>offering<\/b>] of your God from any of these for they have inflicted wounds in them; they will not be favorably accepted for you.", "pj": "וּמִן יַד בַּר עַמְמִין לָא תְקַרְבוּן יַת קוּרְבַּן אֱלָהָכוֹן מִכָּל אִלֵין אֲרוּם חִבּוּלְהוֹן בְּהוֹן מוּמָא פְּסִילִין הִינוּן לָא לְרַעֲוָא יְהֵי לְכוֹן", "pj_en": "And from the hand of a son of the Gentiles you shall not offer the oblation of your God of any of these, because their corruption is in them; a blemish is in them, they are profane, they shall not be acceptable for you.", "tj": "", "tj_en": "", "rashi": "<b>ומיד בן נכר.<\/b> שֶׁהֵבִיא קָרְבָּן בְּיַד כֹּהֵן לְהַקְרִיבוֹ לַשָּׁמַיִם <b>לא תקריבו<\/b> לוֹ בַּעַל מוּם; וְאַעַ\"פִּ שֶׁלֹּא נֶאֶסְרוּ בַעֲלֵי מוּמִים לְקָרְבַּן בְּנֵי נֹחַ אֶלָּא אִ\"כֵּ מְחֻסְּרֵי אֵבֶר, זֹאת נוֹהֶגֶת בְּבָמָה שֶׁבַּשָּׂדוֹת, אֲבָל עַל הַמִּזְבֵּחַ שֶׁבַּמִּשְׁכָּן לֹא תַקְרִיבוּ, אֲבָל תְּמִימָה תְקַבְּלוּ מֵהֶם, לְכָךְ נֶאֱמַר לְמַעְלָה אִישׁ אִישׁ, לְרַבּוֹת אֶת הַגּוֹיִם שֶׁנּוֹדְרִים נְדָרִים וּנְדָבוֹת כְּיִשְׂרָאֵל (חולין י\"ג):<br><br><b>משחתם.<\/b> חִבּוּלְהוֹן:<br><br><b>לא ירצו לכם.<\/b> לְכַפֵּר עֲלֵיכֶם:", "rashi_en": "ומיד בן נכר AND FROM ANY STRANGER’S HAND who has brought a sacrifice through the agency of a priest to offer it to the Lord, לא תקריבו YOU SHALL NOT OFFER a blemished animal on his behalf. And though blemished animals are not forbidden as sacrifices of the “Sons of Noah” (the non-Israelite world) except such as lack one of their limbs (as derived from the text: Genesis 6:19; cf. Avodah Zarah 5b) — this rule applies only to animals offered to God by the “Sons of Noah” themselves on a Bamah (an altar, lit., an elevated place) in the open field, but on the altar in the Tabernacle shall you not offer blemished animals on their behalf (cf. Temurah 7a). An animal, however, that has no blemish you may accept from them as an offering on your altar. It is for this reason that Scripture says above (v. 18): איש “Any man… who offers”, in order to include in this law the heathens also — that they, too, are permitted to undertake to bring vowed animals (נדרים) and free-will offerings (נדבות) just the same as the Israelites (Chullin 13b).<br><br>משחתם THEIR CORRUPTION — Translate this as the Targum does: חבולהון, their wound (defect).<br><br>לא ירצו לכם THEY SHALL NOT BE ACCEPTED FOR YOU — i. e. to atone for you."}, {"ch": 22, "v": 26, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 27, "aliyah": 3, "heb": "שׁ֣וֹר אוֹ־כֶ֤שֶׂב אוֹ־עֵז֙ כִּ֣י יִוָּלֵ֔ד וְהָיָ֛ה שִׁבְעַ֥ת יָמִ֖ים תַּ֣חַת אִמּ֑וֹ וּמִיּ֤וֹם הַשְּׁמִינִי֙ וָהָ֔לְאָה יֵרָצֶ֕ה לְקׇרְבַּ֥ן אִשֶּׁ֖ה לַיהֹוָֽה׃", "onk": "תּוֹר אוֹ אִמָּר אוֹ עִזָּא אֲרֵי יִתְיְלִיד וִיהֵי שִׁבְעָא יוֹמִין בָּתַר אִמֵּיהּ וּמִיּוֹמָא תְמִינָאָה וּלְהַלָּא יִתִּרְעֵי לְקָרָבָא <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "An ox, lamb or goat, when it is born, shall be with its mother for seven days. From the eighth day and thereafter it may be favorably accepted as a sacrifice as a fire-offering to [<b>an offering before<\/b>] Adonoy.", "pj": "עִידַן דְתִידְכַּר לָן סִדְרֵי קוּרְבָּנֵינָן מַה דְהַוֵינָן מְקַרְבִין בְּכָל שְׁנָא וּשְׁנָא הֲווֹ קוּרְבָּנֵינָן מְכַפְּרִין עַל חוֹבֵינָן וּכְדוּ דִי גָרְמוּ חוֹבַיָא וְלֵית לָן מַה נַקְרְבָא מִן עֶדְרֵי עֲנֵינָן תּוֹרָא אִיתְבְּחַר קֳדָמוֹי בְּגִין מַדְכַּר זְכוּת סָבָא דְאָתָא מִמַדִינְחָא פַּטִיר כּוּלֵיהּ קָרֵיב לִשְׁמָךְ בַּר תּוֹרִין רַכִּיךְ שָׁמִין אִימְרָא אִיתְבְּחַר תִּנְיָין בְּגִין מַדְכַּר זַכְוָותֵיהּ דִשְיֵיהּ דְאִתְעֲקַד עַל גַבֵּי מַדְבְּחָא וּפְשַׁט צַוְארֵיהּ בְּגִין שְׁמָךְ שְׁמַיָא מָכוּ וּנְחָתוּ וַחֲמָא יִצְחָק יַת שַׁכְלוּלֵיהוֹן וְכַהֲיָין עֵינוֹי מִמְרוֹמַיָא מִן בְּגִין כְּדֵין זָכָה וְאִזְדַמַן לֵיהּ אִימְרָא תְּחוֹתוֹי לְעָלָתָא גְדִי בַּר עִזֵי אִתְבְּחַר תְּחוֹתָא בְּגִין מַדְכַּר זְכוּת שְׁלֵימָא דְעָבַד גַדְיֵי בַּר עִזֵי תַּבְשִׁילִין וְאוֹבִיל לְאָבוֹי וְזָכָה לִמְקַבְּלָא סְדַר בִּרְכָתָא בְּגִין כֵּן פָּרֵישׁ משֶׁה נְבִיָא וַאֲמַר עַמִי בְּנֵי יִשְרָאֵל תּוֹר אוֹ אִימַר אוֹ גַדְיָא אֲרוּם יִתְיְלִיד כְּאוֹרַח עַלְמָא וִיהֵי שַׁבְעָתָא יוֹמִין בָּתַר אִמֵיהּ מְטוּל דְיִשְׁתְּמוֹדַע דְלָא נָפִיל וּמִיוֹמָא תְמִינָאָה וּלְהָלְאָה יִתְרְעֵי לְקָרָבָא קוּרְבָּנָא לִשְׁמָא דַיְיָ", "pj_en": "(to the effect that): What time thou callest to our mind the order of our oblations, as they shall be offered year by year, being our expiatory offering for our sins, when on account of our sins (such sacrifices are required), and we have none to bring from our flocks of sheep, then shall a bullock be chosen before him, in memorial of the righteousness of the elder who came from the cast, the sincere one who brought the calf, fat and tender, to Thy Name. A sheep is to be chosen, secondly, in memory of the righteousness of him who was bound as a lamb on the altar, and who stretched forth his neck for Thy Name's sake, while the heavens stooped down and condescended, and Izhak beheld their foundations, and his eyes were blinded by the high things; on which account he was reckoned to be worthy that a lamb should be provided for him as a burnt offering. A kid of the goats is to be chosen likewise, in memorial of the righteousness of that perfect one who made the savoury meat of the kid, and brought it to his father, and was made worthy to receive the order of the blessing: wherefore Mosheh the prophet explaineth, saying: Sons of Israel, my people, When a bullock, or a lamb, or a kid is brought forth according, to the manner of the world, it shall be seven days after its dam, that there may be evidence that it is not imperfect; and on the eighth day and thenceforth, it is acceptable to be offered an oblation to the Name of the Lord.", "tj": "עִידַן (צ\"ל דתידכר) דְּתִתְכַּר לָן סִדְרֵי קוּרְבָּנֵינָן מַה דְּהַוֵּינָן מְקַרְבִין בְּכָל שְׁנָא וּשְׁנָא הֲווֹן קוּרְבָּנֵינָן מְכַפְּרִין עַל חוֹבֵינָן וּכְדוּ דִּי גָרְמוּ חוֹבַיָּא וְלֵית לָן מַה נִקְרְבָא מִן עֶדְרֵי עֲנֵינָן תּוֹרָא אִתְבְּחַר קֳדָמַי בְּגִין לְמַדְכְּרָא סַבְיָא מַדִּינְחָא פַּטִּיר כּוּלֵיהּ קְרַב לִשְׁמָךְ בַּר תּוֹרִין וּרְהַט לְבַקְרוּתֵיהּ וּנְסֵיב בַּר תּוֹרִין רַכּוּךְ וָעָב וִיהַב יָתֵיהּ לְרַבְיָּא וְאוֹחִי רַבְיָּא לְמִיעֲבַד יָתֵיהּ וּפַטִּירִין אָפָא וְיֵיכוֹל מַלְאָכִין וְזָכָה לְמִתְבַּשְרָא דְהָא שָרָה יָלְדָהּ לְיִצְחָק אִמְּרָא אִתְבְּחַר תִּנְיָין בְּגִין לְמִדְכְּרָא זַכְוָותֵיהּ דִּשְׁיֵיהּ דְּעָקַד גַּרְמֵיהּ עַל גַּבֵּי מַּדְבְּחָאָ וּפָשַׁט צַוָּארֵיהּ בְּגִין שְׁמָךְ שְׁמַיָא מָכוּ וּנְחָתוּ וַחֲמָא יִצְחָק יַת שַׁכְלוּלֵיהוֹן וְכַהֲיַין עֵינוֹי מִמְּרוֹמַיָּא מִן בְּגִין כְּדֵין זָכָה וְאִיזְדְּמִין לֵיהּ תַּמָן אִימַר תְּחוֹתוֹי לַעֲלָתָא וְתוּ זָכוּ תְּלִיתָאֵי גְּדִי בַּר עִזִּין לְמַדְכְּרָא זַכְוָותֵיהּ דִּתְמִימָא דְּלָבִישׁ מַשְׁכִּין גְּדָיָין וַעַבֲד תַּבְשִׁילִין וְאַיְיתִי לְאָבוֹי מִן תַּבְשִׁילוֹי וַחֲמַר אַשְׁקֵי יָתֵיהּ וְזָכָה לְמִתְקַבָּלָא סְדַר בִּרְכָתָא מִן יִצְחָק אבוּי וּלְמוֹקְמָא תְּרֵי עֲשַר שִׁבְטִין קַדִישִׁין לִשְׁמָךְ הָא בְּכֵן פָּרַשׁ משֶׁה נְבִיָא דַיְיָ וַאֲמַר עַמִּי בֵּית יִשְרָאֵל תּוֹר אוֹ גְּדִי אֲרוּם דְּאִיתְיְלִיד וִיהֵי שׁוּבְעָא יוֹמִין בָּתַר אִמֵּיהּ וּמִן יוֹמָא תְּמִינָאָה וּלְהַלָּא יְהֶוֵי כְּשַׁר לְמִקְרְבָא יָתֵיהּ קוּרְבָּנָא לִשְׁמָא דַיְיָ:", "tj_en": "In the time that thou remindest us of the order of the oblations as they are to be offered year by year; our offerings are to make atonement for our sins. But when our sins have given occasion, and we have not wherewith to bring from our flocks of sheep, a bullock is to be chosen before Me to recall to remembrance­ the elder of the east, sincere altogether, Who brought to Thy Name a calf tender and good, Which he gave to the young man, who basted to dress it, and to bake unleavened cakes; and the angels did eat, and be was accounted worthy to receive the announcement that, behold, Sarah should give birth to Izhak. A lamb is to be chosen, secondly, to call to remembrance the righteousness of the prince who suffered himself to be bound upon the alter, and stretched forth his neck for Thy Name's sake; when the heavens stooped down and condescended, and Izhak beheld their foundations, and his eyes were blinded by the high things (or, from the heights), on which account be was held worthy that a lamb should be provided in his stead for a burnt offering. A kid of the goats also is to be chosen, to call to remembrance the righteousness of that perfect one who put on the skins of the kids, and made savory meat, and brought of his viands unto his father, and gave wine to him to drink; on account of which he was held worthy to receive the orders of blessings from Izhak his father, that the twelve sacred tribes should arise to Thy Name. Behold, then, how Mosheh, the prophet of the Lord, expoundeth, and saith, Sons of Israel, my people, When a bullock, or a lamb, or a goat is brought forth, it shall be seven days after its dam; on the eighth day and thenceforth it shall be fit to be offered as an oblation to the Name of the Lord.", "rashi": "<b>כי יולד.<\/b> פְּרָט לְיוֹצֵא דֹפֶן (שם ל\"ח):", "rashi_en": "כי יולד WHEN [ANY OX etc.] IS BORN… [FROM THE EIGHTH DAY, AND THENCEFORTH, IT SHALL BE FAVOURABLY ACCEPTED AS A FIRE OFFERING…] — The expression יולד “that is born” excludes the case of an animal delivered through the abdominal wall (i. e. by Caesarian section) (Chullin 38b)."}, {"ch": 22, "v": 28, "aliyah": 3, "heb": "וְשׁ֖וֹר אוֹ־שֶׂ֑ה אֹת֣וֹ וְאֶת־בְּנ֔וֹ לֹ֥א תִשְׁחֲט֖וּ בְּי֥וֹם אֶחָֽד׃", "onk": "<b>וְתוֹרְתָּא<\/b> אוֹ <b>שֵׂיתָא לַהּ וְלִבְרַהּ<\/b> לָא תִכְּסוּן בְּיוֹמָא חָד:", "onk_en": "An ox [<b>cow<\/b>] or a [<b>female<\/b>] lamb, it and its [<b>her and her<\/b>] offspring, you shall not slaughter in one day.", "pj": "עַמִי בְּנֵי יִשְרָאֵל הֵיכְמָא דְאָבוּנָן רַחֲמָן בִּשְׁמַיָא כֵּן תֶּהֱוֹן רַחֲמָנִין בְּאַרְעָא תּוֹרָתָא אוֹ רְחֵילָא יָתָהּ וְיַת בְּרָהּ לָא תִיכְסוּן בְּיוֹמָא חָד", "pj_en": "Sons of Israel, my people, as our Father in heaven is merciful, so shall you be merciful on earth: neither cow, nor ewe, shall you sacrifice along with her young on the same day.", "tj": "", "tj_en": "", "rashi": "<b>אתו ואת בנו.<\/b> נוֹהֵג בַּנְּקֵבָה — שֶׁאָסוּר לִשְׁחֹט הָאֵם וְהַבֵּן אוֹ הַבַּת, וְאֵינוֹ נוֹהֵג בַּזְּכָרִים, וּמֻתָּר לִשְׁחֹט הָאָב וְהַבֵּן (שם ע\"ח):<br><br><b>אתו ואת בנו.<\/b> אַף בְּנוֹ וְאוֹתוֹ בְּמַשְׁמָע (שם פ\"ב):", "rashi_en": "אתו ואת בנו [AND WHETHER IT BE AN OX OR A SHEEP YE SHALL NOT SLAUGHTER] IT AND ITS YOUNG [BOTH IN ONE DAY] — This law applies only to the female parent, although Scripture uses the masculine term אתו — that it is forbidden to slaughter the dam and its male or female young in one day, but it does not apply to the male parent, and it is permissible to slaughter the father animal and its young whether male or female in one day (Chullin 78b; cf. also Onkelos).<br><br>אתו ואת בנו IT AND ITS YOUNG — The prohibition of slaughtering the young first and then it (the dam) in one day is also implied (Chullin 82a)."}, {"ch": 22, "v": 29, "aliyah": 3, "heb": "וְכִֽי־תִזְבְּח֥וּ זֶֽבַח־תּוֹדָ֖ה לַיהֹוָ֑ה לִֽרְצֹנְכֶ֖ם תִּזְבָּֽחוּ׃", "onk": "וַאֲרֵי תִכְּסוּן נִכְסַת תּוֹדְתָא <b>קֳדָם<\/b> יְיָ לְרַעֲוָא לְכוֹן תִּכְּסֻנֵּיהּ:", "onk_en": "When you sacrifice a thanks-giving-offering to [<b>before<\/b>] Adonoy, that it be favorably accepted for you you shall sacrifice it.", "pj": "וַאֲרוּם תִּכְסוּן נִכְסַת נִכְסָא לִשְׁמָא דַיְיָ לְרַעֲוָא לְכוֹן תִּכְסוּן", "pj_en": "And when you offer a sacrifice of thanksgiving to the Name of the Lord, you shall offer so as to be accepted.", "tj": "", "tj_en": "", "rashi": "<b>לרצנכם תזבחו.<\/b> תְּחִלַּת זְבִיחַתְכֶם הִזָּהֲרוּ שֶׁתְּהֵא לְרָצוֹן לָכֶם, וּמַהוּ הָרָצוֹן?<br><br><b>ביום ההוא יאכל.<\/b> לֹא בָא לְהַזְהִיר אֶלָּא שֶׁתְּהֵא שְׁחִיטָה עַל מְנָת כֵּן — אַל תִּשְׁחֲטוּהוּ עַל מְנָת לְאָכְלוֹ לְמָחָר, שֶׁאִם תַּחְשְׁבוּ בוֹ מַחֲשֶׁבֶת פְּסוּל לֹא יְהֵא לָכֶם לְרָצוֹן; דָּ\"אַ <b>לרצנכם<\/b> — לְדַעְתְּכֶם, מִכָּאן לַמִּתְעַסֵּק שֶׁפָּסוּל בִּשְׁחִיטַת קָדָשִׁים; וְאַעַ\"פִּ שֶּׁפֵּרֵט בַּנֶּאֱכָלִים לִשְׁנֵי יָמִים, חָזַר וּפֵרֵט בַּנֶּאֱכָלִין לְיוֹם אֶחָד שֶׁתְּהֵא זְבִיחָתָן עַל מְנָת לְאָכְלָן בִּזְמַנָּן:", "rashi_en": "לרצנכם תזבחו‎ ‎ [AND WHEN YE WILL SLAUGHTER A SACRIFICE OF ACKNOWLEDGEMENT UNTO THE LORD], SLAUGHTER IT SO THAT IT MAY EFFECT PROPITIATION FOR YOU — i. e. take care from the very outset of your slaughtering that it should effect acceptance for you; and wherein consists the assurance of its acceptance? <br><br>ביום ההוא יאכל in the intention that IT SHALL BE EATEN ON THE SAME DAY  — Scripture intends by these words only to express the warning that the slaughtering shall be made with this intention: — do not slaughter it with the intention of eating it on the morrow, because if you then harbour any intention which will lead to its disqualification it shall not be favourably accepted for you. Another explanation of לרצנכם is: sacrifice it wittingly (with full knowledge of what you are doing); hence we may derive that if one is “handling” the sacrifices when slaughtering them (i. e. when he does the act of שחיטה without the intention of doing this) they become invalid (Chullin 13a). And (referring again to the first explanation) though Scripture has already specifically stated this (the fact that the slaughtering must be made with the clear intention not to eat the flesh beyond the prescribed time) with regard to such offerings that may be eaten during two successive days (cf. Leviticus 7:18), it specifically states here again of those sacrifices which are permitted to be eaten on one day only that their slaughtering must take place with the clear intention to eat them within the time prescribed for them."}, {"ch": 22, "v": 30, "aliyah": 3, "heb": "בַּיּ֤וֹם הַהוּא֙ יֵאָכֵ֔ל לֹֽא־תוֹתִ֥ירוּ מִמֶּ֖נּוּ עַד־בֹּ֑קֶר אֲנִ֖י יְהֹוָֽה׃", "onk": "בְּיוֹמָא הַהוּא יִתְאֲכֵל לָא תַשְׁאֲרוּן מִנֵּיהּ עַד צַפְרָא אֲנָא יְיָ:", "onk_en": "On that day [that it is sacrificed] you should eat it; you shall leave none of it until the next morning, I am Adonoy.", "pj": "בְּיוֹמָא הַהוּא יִתְאֲכֵיל לָא תְשַׁיְירוּן מִנֵיהּ עַד צַפְרָא אֲנָא יְיָ", "pj_en": "It shall be eaten on that day, none shall remain till the morning: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ביום ההוא יאכל.<\/b> לֹא בָא לְהַזְהִיר אֶלָּא שֶׁתְּהֵא שְׁחִיטָה עַל מְנָת כֵּן, שֶׁאִם לִקְבֹּעַ לוֹ זְמַן אֲכִילָה, כְּבָר כָּתוּב וּבְשַׂר זֶבַח תּוֹדַת שְׁלָמָיו וְגוֹ' (ויקרא ז'):<br><br><b>אני ה'.<\/b> דַּע מִי גָזַר עַל הַדָּבָר וְאַל יֵקַל בְּעֵינֶיךָ:", "rashi_en": "ביום ההוא יאכל IT SHALL BE EATEN ON THE SAME DAY — Scripture only intends by these words to express the warning that the slaughtering shall be done with this in mind (Sifra, Emor, Chapter 9 2), for if it intended to fix the time for eating it they would be redundant, since it is already stated (Leviticus 7:15) “And the flesh of the sacrifice of his feast offerings for acknowledgment [shall be eaten the same day that it is offered]”.<br><br>אני ה׳ I AM THE LORD — Know Who it is that has decreed this matter, and let it, therefore, not be a light thing in your eyes!"}, {"ch": 22, "v": 31, "aliyah": 3, "heb": "וּשְׁמַרְתֶּם֙ מִצְוֺתַ֔י וַעֲשִׂיתֶ֖ם אֹתָ֑ם אֲנִ֖י יְהֹוָֽה׃", "onk": "וְתִטְּרוּן פִּקּוֹדַי וְתַעְבְּדוּן יָתְהוֹן אֲנָא יְיָ:", "onk_en": "You shall preserve My commandments and fulfill them, I am Adonoy.", "pj": "וְתִטְרוּן יַת פִּיקוּדַי וְתַעַבְדוּן יַתְהוֹן אֲנָא יְיָ דִיהַב אֲגַר טַב לְנַטְרֵי פִּקוּדַי וְאוֹרַיְיתָי", "pj_en": "And you shall observe My commandments to do them I am the Lord who give a good reward, to them who keep My commandments and My laws.", "tj": "", "tj_en": "", "rashi": "<b>ושמרתם.<\/b> זוֹ הַמִּשְׁנָה:<br><br><b>ועשיתם.<\/b> זֶה הַמַּעֲשֶׂה (ספרא):", "rashi_en": "ושמרתם — This implies the study of the commandments,<br><br>ועשיתם, the doing of them (Sifra, Emor, Chapter 9 3)."}, {"ch": 22, "v": 32, "aliyah": 3, "heb": "וְלֹ֤א תְחַלְּלוּ֙ אֶת־שֵׁ֣ם קׇדְשִׁ֔י וְנִ֨קְדַּשְׁתִּ֔י בְּת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל אֲנִ֥י יְהֹוָ֖ה מְקַדִּשְׁכֶֽם׃", "onk": "וְלָא תְחַלְּלוּן יָת שְׁמָא דְקוּדְשַׁי וְאִתְקַדַּשׁ בְּגוֹ בְּנֵי יִשְׂרָאֵל אֲנָא יְיָ מְקַדִּשְׁכוֹן:", "onk_en": "You shall not profane My holy Name; but I will be sanctified among Bnei Yisroel. I am Adonoy Who makes you holy.", "pj": "וְלָא תִפְסוּן יַת שְׁמָא דְקוּדְשִׁי וְאֶתְקַדֵשׁ בְּגוֹ בְּנֵי יִשְרָאֵל אֲנָא יְיָ מְקַדִשְׁכוֹן", "pj_en": "Nor shall you profane My Holy Name, that I may be hallowed among the children of Israel. I am the Lord who sanctify you,", "tj": "", "tj_en": "", "rashi": "<b>ולא תחללו.<\/b> לַעֲבֹר עַל דְּבָרַי מְזִידִין; מִמַּשְׁמָע שֶׁנֶּאֱמַר וְלֹא תְחַלְּלוּ מַה תַּ\"לֹ וְנִקְדַּשְׁתִּי? מְסֹר עַצְמְךָ וְקַדֵּשׁ שְׁמִי. יָכוֹל בְּיָחִיד, תַּ\"לֹ <b>בתוך בני ישראל;<\/b> וּכְשֶׁהוּא מוֹסֵר עַצְמוֹ יִמְסֹר עַצְמוֹ עַל מְנָת לָמוּת, שֶׁכָּל הַמּוֹסֵר עַצְמוֹ עַל מְנָת הַנֵּס, אֵין עוֹשִֹׁין לוֹ נֵס, שֶׁכֵּן מָצִינוּ בַחֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה שֶׁלֹּא מָסְרוּ עַצְמָן עַל מְנָת הַנֵּס, שֶׁנֶּאֱמַר (דניאל נ'), \"וְהֵן לָא יְדִיעַ לֶהֱוֵא לָךְ מַלְכָּא\" וְגוֹ', מַצִּיל וְלֹא מַצִּיל — \"יְדִיעַ לֶהֱוֵא לָךְ\" וְגו' (ספרא):", "rashi_en": "ולא תחללו YE SHALL NOT PROFANE [MY HOLY NAME], by transgressing My commands willfully. Having regard to what is implied in the statement: You shall not profane [My holy name] (viz., that it must be hallowed), what is the meaning of ונקדשתי? But, this implies a positive act of sanctification: Abandon yourself to martyrdom and hallow My name! I might think that this command applies even to the Israelite when he is alone (i. e., when no other Israelites are present when the heathen bids him transgress a Divine command)! Scripture, however, states: בתוך בני ישראל [AND I SHALL BE SANCTIFIED] AMIDST THE CHILDREN OF ISRAEL. — And when offering oneself to martyrdom, one should offer himself with the firm determination (lit., under the condition) to die if necessary, for he who abandons himself on condition (i. e. cherishing the hope) that God will not exact the sacrifice and that a miracle will happen to save him will have no miracle wrought for him; for thus we find in the case of Chananyah, Mishael and Azariah that they did not offer themselves for martyrdom expecting a miracle, as it is said (Daniel 3:17, 18) “[And God whom we serve is able to deliver us from the burning fiery furnace and He will deliver us out of thy hand, O king]. But if not, be it known unto thee that we will not serve thy gods etc. — Whether He saves us or whether he does not save, “be it known unto thee etc.” (Sifra, Emor, Chapter 9 5)"}, {"ch": 22, "v": 33, "aliyah": 3, "heb": "הַמּוֹצִ֤יא אֶתְכֶם֙ מֵאֶ֣רֶץ מִצְרַ֔יִם לִהְי֥וֹת לָכֶ֖ם לֵאלֹהִ֑ים אֲנִ֖י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "דְּאַפִּיק יָתְכוֹן מֵאַרְעָא דְמִצְרַיִם לְמֶהֱוֵי לְכוֹן לֵאלָהָא אֲנָא יְיָ:", "onk_en": "Who brought you out of the land of Egypt to be your God, I am Adonoy.", "pj": "דְהַנְפִּיק יַתְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם מְטוּל לְמֶהֱוֵי לְכוֹן לֶאֱלָהָא אֲנָא יְיָ", "pj_en": "having brought you forth redeemed from the land of Mizraim, that I may be to you Eloah: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>המוציא אתכם.<\/b> עַל מְנָת כֵּן:<br><br><b>אני ה'.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר (שם):", "rashi_en": "המוציא אתכם THAT HATH BROUGHT YOU OUT [OF THE LAND OF EGYPT] — for the sake of this (that you should hallow His name).<br><br>'אני ה‎‎ I AM THE LORD — Who is faithful in paying you your reward (Sifra, Emor, Chapter 9 6)."}, {"ch": 23, "v": 1, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 2, "aliyah": 4, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם מוֹעֲדֵ֣י יְהֹוָ֔ה אֲשֶׁר־תִּקְרְא֥וּ אֹתָ֖ם מִקְרָאֵ֣י קֹ֑דֶשׁ אֵ֥לֶּה הֵ֖ם מוֹעֲדָֽי׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׁרָאֵל וְתֵימַר לְהוֹן מוֹעֲדַיָּא דַיְיָ דִּי <b>תְעָרְעוּן<\/b> יָתְהוֹן <b>מְעָרְעֵי<\/b> קַדִּישׁ אִלֵּין אִנּוּן מוֹעֲדָי:", "onk_en": "Speak to Bnei Yisroel and say to them; the appointed times of Adonoy, which you shall proclaim [<b>cause<\/b>] them [<b>to occur<\/b>] as holy assemblies [<b>occurrences<\/b>]; these are My appointed times.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן זְמַן סִדוּרֵי מוֹעֲדַיָא דַיְיָ דִתְאַרְעוּן יַתְהוֹן מְאַרְעֵי קַדִישׁ אִלֵין הִינוּן זְמַן סִדוּרֵי מוֹעֲדָי", "pj_en": "Speak with the sons of Israel, and say to them, The orders of the time of the Festivals of the Lord, which you shall proclaim as holy convocations, these are the orders of the time of My festivals.", "tj": "", "tj_en": "", "rashi": "<b>דבר אל בני ישראל, מועדי ה'.<\/b> עֲשֵׂה מוֹעֲדוֹת שֶׁיִּהְיוּ יִשְֹרָאֵל מְלֻמָּדִין בָּהֶם, שֶׁמְּעַבְּרִים אֶת הַשָּׁנָה עַל גָּלֻיּוֹת שֶׁנֶּעֶקְרוּ מִמְּקוֹמָן לַעֲלוֹת לָרֶגֶל וַעֲדַיִן לֹא הִגִּיעוּ לִירוּשָׁלַיִם (ספרא):", "rashi_en": " 'דבר אל בני ישראל, מועדי ה‎‎ SPEAK UNTO THE CHILDREN OF ISRAEL [AND DECLARE UNTO THEM] THE APPOINTED FESTIVALS OF THE LORD — This means, Regulate the festive seasons in such a manner that all Israel should become practised in them (their observance). Hence we derive the law that they (the Sanhedrin) proclaim a leap-year (i. e. intercalate a second Adar) for the sake of those living in the diaspora who have already left their homes in order to go up for the festival but have not yet arrived in Jerusalem (Sifra, Emor, Section 9 1; cf. Sanhedrin 11a)."}, {"ch": 23, "v": 3, "aliyah": 4, "heb": "שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּבַיּ֣וֹם הַשְּׁבִיעִ֗י שַׁבַּ֤ת שַׁבָּתוֹן֙ מִקְרָא־קֹ֔דֶשׁ כׇּל־מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ שַׁבָּ֥ת הִוא֙ לַֽיהֹוָ֔ה בְּכֹ֖ל מוֹשְׁבֹֽתֵיכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "שִׁתָּא יוֹמִין תִּתְעֲבֵד עִבִידָא וּבְיוֹמָא שְׁבִיעָאָה שְׁבַת שְׁבָתָא <b>מְעָרַע<\/b> קַדִּישׁ כָּל עִבִידָא לָא תַעְבְּדוּן שַׁבְּתָא הִיא <b>קֳדָם<\/b> יְיָ בְּכֹל מוֹתְבָנֵיכוֹן:", "onk_en": "Six days shall work be performed; and on the seventh day is a <i>Shabbos<\/i> of resting, a holy assembly [<b>occurrence<\/b>]. You shall not do any work, it is a <i>Shabbos<\/i> for [<b>before<\/b>] Adonoy in all your dwelling places.", "pj": "שִׁיתָּא יוֹמִין תִּתְעֲבֵיד עִיבִידָא וּבְיוֹמָא שְׁבִיעָאָה שַׁבָּא וְנַיְיחָא מְאַרַע קַדִישׁ כָּל עִיבִידָא לָא תַעַבְּדוּן שַׁבְּתָא הוּא לַיְיָ בְּכָל אֲתַר מוֹתְבָנֵיכוֹן", "pj_en": "Six days shalt thou do work, and the seventh day (shall be) a Sabbath and a rest, a holy convocation. No manner of work may you do; it is a Sabbath to the Lord in every place of your habitations.", "tj": "", "tj_en": "", "rashi": "<b>ששת ימים.<\/b> מָה עִנְיַן שַׁבָּת אֵצֶל מוֹעֲדוֹת? לְלַמֶּדְךָ שֶׁכָּל הַמְחַלֵּל אֶת הַמּוֹעֲדוֹת מַעֲלִין עָלָיו כְּאִלּוּ חִלֵּל אֶת הַשַּׁבָּתוֹת, וְכָל הַמְקַיֵּם אֶת הַמּוֹעֲדוֹת מַעֲלִין עָלָיו כְּאִלּוּ קִיֵּם אֶת הַשַּׁבָּתוֹת (שם):", "rashi_en": "ששת ימים SIX DAYS [MAY WORK BE DONE BUT THE SEVENTH DAY IS THE SABBATH OF STRICT REST] — What relation is there between the Sabbath (the day that is invariably fixed by God as the holy day) and the festive seasons (the times of which are variable, being dependent upon the proclamation of the Sanhedrin)? But by putting both into juxtaposition Scripture intends to teach you that he who desecrates the festivals is regarded as though he had desecrated the Sabbath, and that he who keeps the festivals is regarded as though he had kept the Sabbath (Sifra, Emor, Section 9 7)."}, {"ch": 23, "v": 4, "aliyah": 4, "heb": "אֵ֚לֶּה מוֹעֲדֵ֣י יְהֹוָ֔ה מִקְרָאֵ֖י קֹ֑דֶשׁ אֲשֶׁר־תִּקְרְא֥וּ אֹתָ֖ם בְּמוֹעֲדָֽם׃", "onk": "אִלֵּין מוֹעֲדַיָּא דַיְיָ <b>מְעָרְעֵי<\/b> קַדִּישׁ דִּי <b>תְעָרְעוּן<\/b> יָתְהוֹן בְּזִמְנֵיהוֹן:", "onk_en": "These are the appointed times of Adonoy, the holy assemblies [<b>occurrences<\/b>] that you shall proclaim [<b>cause<\/b>] them [<b>to occur<\/b>] in their appointed times.", "pj": "אִלֵין זְמַנֵי סִדוּרֵי מוֹעֲדַיָא דַיְיָ מְאַרַע קַדִישׁ דִי יִתְרְעוּן יַתְהוֹן בִּזְמַנֵיהוֹן", "pj_en": "These are the times of the Festivals of the Lord, holy convocations which you shall proclaim in their times:", "tj": "", "tj_en": "", "rashi": "<b>אלה מועדי ה'.<\/b> לְמַעְלָה מְדַבֵּר בְּעִבּוּר שָׁנָה וְכָאן מְדַבֵּר בְּקִדּוּשׁ הַחֹדֶשׁ:", "rashi_en": "'אלה מועדי ה THESE ARE THE APPOINTED FESTIVALS OF THE LORD [EVEN CONVOCATIONS OF HOLINESS WHICH YE SHALL PROCLAIM] — Above (v. 2), where similar words are used, Scripture is speaking of proclaiming the year to be a leap-year, here it is speaking of the קדוש החדש, sanctification of the month (a technical expression denoting proclaiming when is the New Moon — the beginning of a month) (Sifra, Emor, Chapter 10 1)."}, {"ch": 23, "v": 5, "aliyah": 4, "heb": "בַּחֹ֣דֶשׁ הָרִאשׁ֗וֹן בְּאַרְבָּעָ֥ה עָשָׂ֛ר לַחֹ֖דֶשׁ בֵּ֣ין הָעַרְבָּ֑יִם פֶּ֖סַח לַיהֹוָֽה׃", "onk": "בְּיַרְחָא קַדְמָאָה בְּאַרְבְּעַת עַשְׂרָא לְיַרְחָא בֵּין שִׁמְשַׁיָּא פִּסְחָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "In the first month (Nisan), on the fourteenth day of the month in the afternoon, is a Pesach (offering) for [<b>before<\/b>] Adonoy.", "pj": "בְּיַרְחָא דְנִיסָן בְּאַרְבֵּיסַר לְיַרְחָא בֵּינֵי שִׁמְשְׁתָא זְמַן נִיכְסַת פִּיסְחָא לִשְׁמָא דַיְיָ", "pj_en": "In the month of Nisan, on the fourteenth day of the month, between the suns (shall be) the time for the sacrifice of the Pascha to the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>בין הערבים.<\/b> מִשֵּׁשׁ שָׁעוֹת וּלְמַעְלָה (שם):<br><br><b>פסח לה'.<\/b> הַקְרָבַת קָרְבָּן שֶׁשְּׁמוֹ פֶּסַח:", "rashi_en": "בין הערבים AT EVENTIDE — i. e. the period from six hours onwards (reckoning from six o’clock in the morning) (Sifra, Emor, Chapter 11 1; cf. Rashi on Exodus 12:6).<br><br>פסח לה׳ [AT EVENTIDE] IS THE פסח OF THE LORD — i. e. the offering of the sacrifice which bears the name פסח‎."}, {"ch": 23, "v": 6, "aliyah": 4, "heb": "וּבַחֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַחֹ֣דֶשׁ הַזֶּ֔ה חַ֥ג הַמַּצּ֖וֹת לַיהֹוָ֑ה שִׁבְעַ֥ת יָמִ֖ים מַצּ֥וֹת תֹּאכֵֽלוּ׃", "onk": "וּבְחַמְשַׁת עַשְׂרָא יוֹמָא לְיַרְחָא הָדֵין חַגָּא דְּפַטִּירַיָּא <b>קֳדָם<\/b> יְיָ שִׁבְעָא יוֹמִין <b>פַּטִּיר<\/b> תֵּיכְלוּן:", "onk_en": "On the fifteenth day of this month is the festival of <i>matzos<\/i>, for [<b>before<\/b>] Adonoy; for seven days you shall eat <i>matzos<\/i> [<b>matzoh<\/b>].", "pj": "וּבַחֲמֵיסַר יוֹמִין לְיַרְחָא הָדֵין חַגָא דְפַטִירַיָא לִשְׁמָא דַיְיָ שַׁבְעָתֵי יוֹמִין פַּטִירֵי תֵיכְלוּן", "pj_en": "And on the fifteenth day of this month the feast of unleavened cakes to the Name of the Lord. Seven days you shall eat unleavened bread.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 7, "aliyah": 4, "heb": "בַּיּוֹם֙ הָֽרִאשׁ֔וֹן מִקְרָא־קֹ֖דֶשׁ יִהְיֶ֣ה לָכֶ֑ם כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃", "onk": "בְּיוֹמָא קַדְמָאָה <b>מְעָרַע<\/b> קַדִּישׁ יִהֵי לְכוֹן כָּל עִבִידַת פָּלְחַן לָא תַעְבְּדוּן:", "onk_en": "On the first day [there] shall be a day of holy assembly [<b>occurrence<\/b>] for you; you shall not do any work of labor.", "pj": "בְּיוֹמָא קַדְמָאָה דְחַגָא מְאַרַע קַדִישׁ יְהֵי לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "On the first day of the feast a holy convocation shall be to you; ye shall do no work of labour,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 8, "aliyah": 4, "heb": "וְהִקְרַבְתֶּ֥ם אִשֶּׁ֛ה לַיהֹוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּיּ֤וֹם הַשְּׁבִיעִי֙ מִקְרָא־קֹ֔דֶשׁ כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּתְקָרְבוּן <b>קֻרְבָּנָא<\/b> קֳדָם יְיָ שִׁבְעָא יוֹמִין בְּיוֹמָא שְׁבִיעָאָה <b>מְעָרַע<\/b> קַדִּישׁ כָּל עִבִידַת פָּלְחָן לָא תַעְבְּדוּן:", "onk_en": "You shall bring a fire-offering to [<b>an offering before<\/b>] Adonoy [on each of] seven days. On the seventh day it is [a day] of holy assembly [<b>occurrence<\/b>]; you shall not do any work of labor.", "pj": "וּתְקַרְבוּן קָרְבָּנָא לִשְׁמָא דַיְיָ שִׁבְעָתֵי יוֹמִין בְּיוֹמָא שְׁבִיעָאָה דְחַגָא מְאַרַע קַדִישׁ כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "but offer the oblation to the Name of the Lord seven days; in the seventh day of the feast shall be a holy convocation; you shall do no work of labour.", "tj": "", "tj_en": "", "rashi": "<b>והקרבתם אשה וגו'.<\/b> הֵם הַמּוּסָפִין הָאֲמוּרִים בְּפָרָשַׁת פִּינְחָס, וְלָמָּה נֶאֶמְרוּ כָאן? לוֹמַר שֶׁאֵין הַמּוּסָפִין מְעַכְּבִין זֶה אֶת זֶה:<br><br><b>והקרבתם אשה לה'.<\/b> מִכָּל מָקוֹם — אִם אֵין פָּרִים הָבֵא אֵילִים, וְאִם אֵין פָּרִים וְאֵילִים הָבֵא כְבָשִׂים (שם):<br><br><b>שבעת ימים.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר שִׁבְעַת שֵׁם דָּבָר הוּא — שָׁבוּעַ שֶׁל יָמִים, שטי\"נא בְּלַעַז, וְכֵן כָּל לְשׁוֹן שְׁמוֹנַת שֵׁשֶׁת חֲמֵשֶׁת שְׁלוֹשֶׁת:<br><br><b>מלאכת עבדה.<\/b> אֲפִלּוּ מְלָאכוֹת הַחֲשׁוּבוֹת לָכֶם עֲבוֹדָה וְצֹרֶךְ — שֶׁיֵּשׁ חֶסְרוֹן כִּיס בְּבַטָּלָה שֶׁלָּהֶן — כְּגוֹן דָּבָר הָאָבֵד, כָּךְ הֵבַנְתִּי מִתֹּ\"כֹּ, דְּקָתָנֵי יָכוֹל אַף חֻלּוֹ שֶׁל מוֹעֵד יְהֵא אָסוּר בִּמְלֶאכֶת עֲבוֹדָה וְכוּ':", "rashi_en": "'והקרבתם אשה וגו‎‎ BUT YE SHALL OFFER A FIRE-OFFERING etc. — This is identical with the additional offerings due on the first day of Passover which are mentioned in the section of פנחס (Numbers 28:19). But why are these referred to here? In order to intimate that the additional offerings do not impede one another (i. e. that if a particular animal of these מוספים cannot be sacrificed, it is still lawful to bring the others) (Menachot 49a), because it states: —<br><br>‎'והקרבתם אשה לה‎ YE SHALL BRING THE FIRE-OFFERING OF THE LORD — bring  it  under any circumstances — if there are no bullocks available as prescribed, offer the prescribed rams; and if there are neither bullocks nor rams, offer the lambs (Sifra, Emor, Chapter 11 5).<br><br>שבעת ימים SEVEN DAYS — Wherever the term שבעת is used it is a noun (not a cardinal numeral), so that the words here mean a septaine of days (a period of seven days), in old French Similar is the meaning of all the expressions שמנת ,ששת ,חמשת ,שלשת. <br><br>מלאכת עבדה [YOU SHALL DO NO] SERVILE WORK — Not even such labors as are regarded by you as an obligation and a necessity, the neglect of which involves loss of money, as, for instance, a matter that may become lost (that cannot be postponed without irretrievable loss). I understand this (that the above is the meaning of מלאכת עבדה) from Torat Cohanim (on  .v  36  of this chapter), since it states there: I might think from what Scripture states (vv. 36, 37)  כָּל מְלֶאכֶת עֲבֹדָה לֹא תַעֲשׂוּ אֵלֶּה מוֹעֲדֵי‎  that‎ מלאכת עבדה is forbidden also on the intermediate days of Passover and Tabernacles (lit., the week-days of the festivals). Scripture, however, states, “it (the eighth day) is a festival and ye shall do no מלאכת עבדה” thus intimating that on a day which is not a festival such work is permitted. The intermediate days are not regarded as a festival and the rule is that דבר האבד may be attended to. Hence the very question: “may מלאכת עבדה be done on the intermediate days?”, implies that the term denotes דבר האבד. "}, {"ch": 23, "v": 9, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying,", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 10, "aliyah": 4, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם כִּֽי־תָבֹ֣אוּ אֶל־הָאָ֗רֶץ אֲשֶׁ֤ר אֲנִי֙ נֹתֵ֣ן לָכֶ֔ם וּקְצַרְתֶּ֖ם אֶת־קְצִירָ֑הּ וַהֲבֵאתֶ֥ם אֶת־עֹ֛מֶר רֵאשִׁ֥ית קְצִירְכֶ֖ם אֶל־הַכֹּהֵֽן׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲרֵי תֵעֲלוּן לְאַרְעָא דִּי אֲנָא יָהֵב לְכוֹן וְתַחְצְדוּן יָת חֲצָדַהּ וְתַיְתוּן יָת עוּמְרָא רֵישׁ חֲצָדְכוֹן לְוָת כַּהֲנָא:", "onk_en": "Speak to Bnei Yisroel and say to them; when you come into the land that I give to you and you reap its harvest, you shall bring an <i>omer<\/i> of the first fruits of your harvest to the <i>kohein<\/i>.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֲרוּם תְעָלוּן לְאַרְעָא דַאֲנָא יָהֵיב לְכוֹן וְתַחְצְדוּן יַת חַצְדָא וְתַיְיתוּן יַת עוּמְרָא שֵׁירוּי חֲצַדְכוֹן לְוַת כַּהֲנָא", "pj_en": "Speak with the sons of Israel, and say to them: When you have entered into the land which I give you, and you reap the harvest, you shall bring the sheaf of the first fruits of your harvest unto the priest;", "tj": "", "tj_en": "", "rashi": "<b>ראשית קצירכם.<\/b> שֶׁתְּהֵא רִאשׁוֹנָה לַקָּצִיר (ספרא):<br><br><b>עמר.<\/b> עֲשִׂירִית הָאֵיפָה כָּךְ הָיְתָה שְׁמָהּ, כְּמוֹ וַיָּמֹדּוּ בָעֹמֶר (שמות ט\"ז):", "rashi_en": "ראשית קצירכם THE FIRST FRUITS OF YOUR HARVEST — This means that it (the Omer) shall be the first thing to be harvested (cf. Sifra, Emor, Section 10 3). <br><br>עמר — The tenth part of an Epha; this was its name (i. e. עמר has not the meaning of a sheaf here as is the meaning of the word e. g., in Deuteronomy 24:19: ושכחת עמר — but it denotes a certain measure), as we find (Exodus 12:18) “And they did measure it with the Omer”."}, {"ch": 23, "v": 11, "aliyah": 4, "heb": "וְהֵנִ֧יף אֶת־הָעֹ֛מֶר לִפְנֵ֥י יְהֹוָ֖ה לִֽרְצֹנְכֶ֑ם מִֽמׇּחֳרַת֙ הַשַּׁבָּ֔ת יְנִיפֶ֖נּוּ הַכֹּהֵֽן׃", "onk": "<b>וִירִים<\/b> יָת עוּמְרָא קֳדָם יְיָ לְרַעֲוָא לְכוֹן מִבָּתַר יוֹמָא טָבָא <b>יְרִימִנֵּיהּ<\/b> כַּהֲנָא:", "onk_en": "He shall wave [<b>lift up<\/b>] the <i>omer<\/i> before Adonoy that it be favorably accepted for you. On the day after the day of rest (Pesach), the <i>kohein<\/i> shall wave [<b>lift<\/b>] it [<b>up<\/b>].", "pj": "וִירֵים יַת עוּמְרָא קֳדָם יְיָ לְרַעֲוָא לְכוֹן מִבָּתַר יוֹמָא טָבָא קַמָאָה דְפִסְחָא יְרִימְנֵיהּ כַּהֲנָא", "pj_en": "and he shall uplift the sheaf before the Lord to be accepted for you. After the first festal day of Pascha (or, the day after the feast-day of Pascha)", "tj": "", "tj_en": "", "rashi": "<b>והניף.<\/b> כָּל תְּנוּפָה מוֹלִיךְ וּמֵבִיא מַעֲלֶה וּמוֹרִיד, מוֹלִיךְ וּמֵבִיא לַעֲצֹר רוּחוֹת רָעוֹת, מַעֲלֶה וּמוֹרִיד לַעֲצֹר טְלָלִים רָעִים (מנחות ס\"ב):<br><br><b>לרצנכם.<\/b> אִם תַּקְרִיבוּ כְּמִשְׁפָּט זֶה יִהְיֶה לְרָצוֹן לָכֶם:<br><br><b>ממחרת השבת.<\/b> מִמָּחֳרַת יוֹם טוֹב הָרִאשׁוֹן שֶׁל פֶּסַח, שֶׁאִם אַתָּה אוֹמֵר שַׁבַּת בְּרֵאשִׁית אֵי אַתָּה יוֹדֵעַ אֵיזֶהוּ (ספרא; מנחות ס\"ו):", "rashi_en": "והניף AND HE SHALL WAVE [THE OMER] — Every form of the root נוף used in connection with sacrifices signifies that one moves the latter about both horizontally (מוליך ומביא) and upwards and downwards (מעלה ומוריד); he moves it about horizontally to prevent (i. e. the act was symbolical of preventing) destructive winds, he moves it about upwards and downwards to keep away injurious dews (cf. Rashi on Exodus 29:24) (Menachot 62a).<br><br>לרצנכם TO BE ACCEPTED FOR YOU — If you offer it according to this precept it shall effect favourable acceptance for you.<br><br>ממחרת השבת ON THE MORROW AFTER THE DAY OF REST [THE PRIEST SHALL WAVE IT] — This must mean on the morrow of the first day of the Passover festival (on the 16th of Nisan); for if you say that it means on the morrow of the weekly Sabbath (i. e. on a Sunday) you do not know which particular Sabbath Scripture is referring to (Menachot 66a)."}, {"ch": 23, "v": 12, "aliyah": 4, "heb": "וַעֲשִׂיתֶ֕ם בְּי֥וֹם הֲנִֽיפְכֶ֖ם אֶת־הָעֹ֑מֶר כֶּ֣בֶשׂ תָּמִ֧ים בֶּן־שְׁנָת֛וֹ לְעֹלָ֖ה לַיהֹוָֽה׃", "onk": "וְתַעְבְּדוּן בְּיוֹמָא <b>דַאֲרָמוּתְכוֹן<\/b> יָת עוּמְרָא אִמַּר שְׁלִים בַּר שַׁתֵּיהּ לַעֲלָתָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "You shall prepare, on the day when you wave [<b>lift<\/b>] the <i>omer<\/i>, an unblemished, male, yearling lamb as a burnt-offering, to [<b>before<\/b>] Adonoy.", "pj": "וְתַעַבְדוּן בְּיוֹם אֲרָמוּתְכוֹן יַת עוּמְרָא אִימַר שְׁלִים בַּר שַׁתֵּיהּ לְעָלָתָא לִשְׁמָא דַיְיָ", "pj_en": "on the day on which you elevate the sheaf, you shall make (the sacrifice of a lamb of the year, unblemished a burnt offering unto the Name of the Lord:", "tj": "", "tj_en": "", "rashi": "<b>ועשיתם … כבש.<\/b> חוֹבָה לָעֹמֶר הוּא בָא:", "rashi_en": "ועשיתם... כבש AND YE SHALL OFFER… A LAMB — This came (was brought) as an obligatory sacrifice in connection with the Omer."}, {"ch": 23, "v": 13, "aliyah": 4, "heb": "וּמִנְחָתוֹ֩ שְׁנֵ֨י עֶשְׂרֹנִ֜ים סֹ֣לֶת בְּלוּלָ֥ה בַשֶּׁ֛מֶן אִשֶּׁ֥ה לַיהֹוָ֖ה רֵ֣יחַ נִיחֹ֑חַ וְנִסְכֹּ֥ה יַ֖יִן רְבִיעִ֥ת הַהִֽין׃", "onk": "וּמִנְחָתֵיהּ תְּרֵין עֶשְׁרוֹנִין סֻלְתָּא דְּפִילָא בִמְשַׁח <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b> וְנִסְכֵּיהּ חַמְרָא רַבְעוּת הִינָא:", "onk_en": "Its meal-offering is two tenths of flour mixed with [olive] oil as a fire-offering to [<b>an offering before<\/b>] Adonoy of pleasing fragrance [<b>to be accepted with favor<\/b>]. Its wine-offering is one fourth of a <i>hin<\/i>.", "pj": "וּמִנְחָתֵיהּ תְּרֵין עֶשְרוֹנִין סְמִידָא פְּתִיכָא בִּמְשַׁח זֵיתָא קוּרְבָּנָא לִשְׁמָא דַיְיָ מְטוֹל לְאִתְקַבָּלָא בְּרַעֲוָא וְנִיסוּכֵיהּ חֲמַר עִינְבֵי רַבְעוּת הִינָא", "pj_en": "and its mincha, two tenths of flour, mingled with olive oil, for an oblation to the Name of the Lord, to be received with acceptance; and its libation, wine of grapes, the fourth of a hin.", "tj": "", "tj_en": "", "rashi": "<b>ומנחתו.<\/b> מִנְחַת נְסָכָיו:<br><br><b>שני עשרנים.<\/b> כְּפוּלָה הָיְתָה:<br><br><b>ונסכו יין רביעת ההין.<\/b> אַעַ\"פִּ שֶׁמִּנְחָתוֹ כְפוּלָה אֵין נְסָכָיו כְּפוּלִים:", "rashi_en": "ומנחתו AND THE MEAL OFFERING THEREOF — i. e. the usual meal-offering that was brought together with its drink-offering,<br><br>שני עשרנים TWO TENTHS DEALS OF FLOUR — It was double as much as was usually required with a lamb (cf. Numbers ch. 28).<br><br>ונסכו רביעית ההין AND THE DRINK OFFERING THEREOF OF WINE SHALL BE THE FOURTH PART OF HIN — Although its meal-offering was twice as much as usual its drink-offering was not double (Menachot 89b)."}, {"ch": 23, "v": 14, "aliyah": 4, "heb": "וְלֶ֩חֶם֩ וְקָלִ֨י וְכַרְמֶ֜ל לֹ֣א תֹֽאכְל֗וּ עַד־עֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה עַ֚ד הֲבִ֣יאֲכֶ֔ם אֶת־קׇרְבַּ֖ן אֱלֹהֵיכֶ֑ם חֻקַּ֤ת עוֹלָם֙ לְדֹרֹ֣תֵיכֶ֔ם בְּכֹ֖ל מֹשְׁבֹֽתֵיכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּלְחֵם וּקְלִי <b>וּפֵרוּכָן<\/b> לָא תֵיכְלוּן עַד כְּרַן יוֹמָא הָדֵין עַד אַיְתוֹאֵיכוֹן יָת קֻרְבָּן אֱלָהָכוֹן קְיַם עָלָם לְדָרֵיכוֹן בְּכֹל מוֹתְבָנֵיכוֹן:", "onk_en": "Bread, parched grain or tender [<b>ground<\/b>] grain you shall not eat until this very day, until you bring the offering of your God; it is an everlasting statute for all your generations in all your dwelling places.", "pj": "וּלְחֵם וּקְלִי וּפֵירוּכִין חַדְתִּין לָא תֵיכְלוּן עַד בִּכְרַן יוֹמָא הָדֵין עַד זְמַן אִיתוֹיֵיכוֹן יַת קָרְבַּן אֱלָהָכוֹן קְיַם עֲלָם לְדָרֵיכוֹן בְּכָל מוֹתְבָנֵיכוֹן", "pj_en": "But neither bread nor parched corn (of the ripe harvest) nor new ears may you eat until this day, until the time of your bringing the oblation of your God: an everlasting statute unto your generations in all your dwellings.", "tj": "", "tj_en": "", "rashi": "<b>וקלי.<\/b> קֶמַח עָשׂוּי מִכַּרְמֶל רַךְ שֶׁמְּיַבְּשִׁין אוֹתוֹ בַּתַּנּוּר:<br><br><b>וכרמל.<\/b> הֵן קְלָיוֹת, שֶׁקּוֹרִין גרניי\"ליש:<br><br><b>בכל משבתיכם.<\/b> נֶחְלְקוּ בוֹ חַכְמֵי יִשְֹרָאֵל, יֵשׁ שֶׁלָּמְדוּ מִכָּאן שֶׁהֶחָדָשׁ נוֹהֵג בְּחוּצָה לָאָרֶץ, וְיֵ\"אֹ לֹא בָא אֶלָּא לְלַמֵּד שֶׁלֹּא נִצְטַוּוּ עַל הֶחָדָשׁ אֶלָּא לְאַחַר יְרֻשָּׁה וִישִׁיבָה, מִשֶּׁכִּבְּשׁוּ וְחִלְּקוּ (קידושין ל\"ז):", "rashi_en": "וקלי means flour made out of tender ears (כרמל); this is called קלוי because they dry them in the oven and so become scorched.<br><br>וכרמל — these are ears themselves which are called grenailles in old French (Menachot 66a, b).<br><br>בכל משבתיכם IN ALL YOUR HABITATIONS — The Sages differ in their opinions regarding this (the meaning of these words). Some learn from here (taking the words בכל משבתיכם in the sense \"wherever you may live\") that the law concerning the new crop applies also outside the Land of Israel; others, hold that it (the phrase) denotes “in all your settlements” and is only intended to teach that they did not become subject to the command concerning the new crop until after the land had become their inheritance and place of settlement (ישיבה) i. e. after they had subjugated the land and had parcelled it out amongst the tribes (Kiddushin 37a)."}, {"ch": 23, "v": 15, "aliyah": 4, "heb": "וּסְפַרְתֶּ֤ם לָכֶם֙ מִמׇּחֳרַ֣ת הַשַּׁבָּ֔ת מִיּוֹם֙ הֲבִ֣יאֲכֶ֔ם אֶת־עֹ֖מֶר הַתְּנוּפָ֑ה שֶׁ֥בַע שַׁבָּת֖וֹת תְּמִימֹ֥ת תִּהְיֶֽינָה׃", "onk": "וְתִמְנוּן לְכוֹן מִבָּתַר יוֹמָא טָבָא מִיּוֹם אַיְתוֹאֵיכוֹן יָת עוּמְרָא דַאֲרָמוּתָא שִׁבְעָא שָׁבוּעִין שַׁלְמִין יְהֶוְיָן:", "onk_en": "You shall count for yourselves, from the day after the day of rest (Pesach) from the day on which you will bring the <i>omer<\/i> waveuplifted-offering, seven complete weeks they shall be,", "pj": "וְתִימְנוּן לְכוֹן מִבָּתַר יוֹמָא טָבָא קַמָאָה דְפִסְחָא מִן יוֹם אִיתוֹיֵיכוֹן יַת עוּמְרָא דַאֲרָמוּתָא שְׁבַע שְׁבוּעִין שַׁלְמִין יֶהֶוְויַן", "pj_en": "And number to you after the first feast day of Pascha, from the day when you brought the sheaf for the elevation, seven weeks; complete they shall be.", "tj": "", "tj_en": "", "rashi": "<b>ממחרת השבת.<\/b> מִמָּחֳרַת יוֹם טוֹב:<br><br><b>תמימת תהיינה.<\/b> מְלַמֵּד שֶׁמַּתְחִיל וּמוֹנֶה מִבָּעֶרֶב, שֶׁאִם לֹא כֵן אֵינָן תְּמִימוֹת (ספרא; מנחות ס\"ו):", "rashi_en": "ממחרת השבת FROM THE MORROW AFTER THE DAY OF REST — i. e. from the morrow after the first day of the Passover festival (Menachot 65b).<br><br>תמימת תהיינה [SEVEN WEEKS] SHALL BE COMPLETE — This teaches that one has to begin counting in the evening, for otherwise they would not be complete (Menachot 66a)."}, {"ch": 23, "v": 16, "aliyah": 4, "heb": "עַ֣ד מִֽמׇּחֳרַ֤ת הַשַּׁבָּת֙ הַשְּׁבִיעִ֔ת תִּסְפְּר֖וּ חֲמִשִּׁ֣ים י֑וֹם וְהִקְרַבְתֶּ֛ם מִנְחָ֥ה חֲדָשָׁ֖ה לַיהֹוָֽה׃", "onk": "עַד מִבָּתַר שְׁבוּעֲתָא שְׁבִיעֵתָא תִּמְנוּן חַמְשִׁין יוֹמִין וּתְקָרְבוּן מִנְחָתָא חֲדַתָּא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Until the day after the seventh week, you shall count fifty days, and you shall bring a new meal-offering to [<b>before<\/b>] Adonoy.", "pj": "עַד מִבָּתַר שְׁבוּעָתָא שְׁבִיעָאָה תִּימְנוּן חַמְשִׁין יוֹמִין וּתְקַרְבוּן מִנְחָתָא דִלְחֵים חֲדַת לִשְׁמֵיהּ דַיְיָ", "pj_en": "Until the day after the seventh week you shall number fifty days, and shall offer a mincha of the new bread unto the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>השבת השביעת.<\/b> כְּתַרְגּוּמוֹ שְׁבוּעֲתָא שְׁבִיעֵתָא:<br><br><b>עד ממחרת השבת השביעת תספרו.<\/b> וְלֹא עַד בִּכְלָל, וְהֵן אַרְבָּעִים וְתִשְׁעָה יוֹם:<br><br><b>חמשים יום והקרבתם מנחה חדשה לה'.<\/b> בַּיּוֹם הַחֲמִשִּׁים תַּקְרִיבוּהָ, וְאוֹמֵר אֲנִי זֶה מִדְרָשׁוֹ, אֲבָל פְּשׁוּטוֹ עַד מִמָּחֳרַת הַשַּׁבָּת הַשְּׁבִיעִת שֶׁהוּא יוֹם חֲמִשִּׁים תִּסְפְּרוּ, וּמִקְרָא מְסֹרָס הוּא:<br><br><b>מנחה חדשה.<\/b> הִיא הַמִּנְחָה הָרִאשׁוֹנָה שֶׁהוּבְאָה מִן הֶחָדָשׁ, וְאִ\"תֹּ הֲרֵי קָרְבָה מִנְחַת הָעֹמֶר אֵינָהּ כִּשְׁאָר כָּל הַמְּנָחוֹת, שֶׁהִיא בָאָה מִן הַשְּׂעוֹרִים (מנחות פ\"ד):", "rashi_en": "השבת השביעת — Translate this as the Targum does שבועתא שביעתא THE SEVENTH WEEK.<br><br>עד ממחרת השבת השביעת תספרו EVEN UNTIL THE MORROW AFTER THE SEVENTH WEEK SHALL YE NUMBER — until, but not including the day until which you count: thus there are 49 days (the seven complete weeks spoken of in the preceding verse).<br><br>'חמשים יום והקרבתם מנחה חדשה לה‎… FIFTY DAYS — AND YE SHALL OFFER A NEW OBLATION UNTO THE LORD — i. e. on the fiftieth day ye shall offer it. This, I say, is a Midrashic explanation, but the literal sense is: “Even unto the morrow of the seventh week which is the fiftieth day shall ye number”: the text has its phrases inverted.<br><br>מנחה חדשה A NEW MEAL OFFERING — It was the first meal-offering that was offered from the new crop. And if you ask, “But surely the meal-offering of the Omer has already been offered on the 16th of Nisan”?! Then I reply: It (the Omer) was not like all the other meal-offerings — which, with one exception (cf. Numbers 5:15), were all brought of wheat — since it was brought of barley and therefore it is not taken into account (cf. Menachot 84b)."}, {"ch": 23, "v": 17, "aliyah": 4, "heb": "מִמּוֹשְׁבֹ֨תֵיכֶ֜ם תָּבִ֣יאּוּ&thinsp;<b>׀<\/b> לֶ֣חֶם תְּנוּפָ֗ה שְׁ֚תַּיִם שְׁנֵ֣י עֶשְׂרֹנִ֔ים סֹ֣לֶת תִּהְיֶ֔ינָה חָמֵ֖ץ תֵּאָפֶ֑ינָה בִּכּוּרִ֖ים לַֽיהֹוָֽה׃", "onk": "מִמּוֹתְבָנֵיכוֹן תַּיְתוּן לְחֵם <b>אֲרָמוּתָא<\/b> תַּרְתֵּין (גְּרִיצַן) תְּרֵין עֶשְׁרוֹנִין סֻלְתָּא יְהֶוְיָן חֲמִיעַ יִתְאַפְיָן בִּכּוּרִין <b>קֳדָם<\/b> יְיָ:", "onk_en": "From [the land of] your dwelling places you shall bring two bread wave[<b>uplifted<\/b>]-offerings; of two tenths of flour they shall be. You shall bake them leavened, as first-fruit-offering to [<b>before<\/b>] Adonoy.", "pj": "מֵאֲתַר מוֹתְבָנֵיכוֹן תַּיְיתוּן לְחֵם אֲרָמוּתָא תַּרְתֵּין גְרִיצִין תְּרֵין עֶשְרוֹנִין סְמִידָא יְהַוְויָין חָמִיעַ יִתְאַפְיָן בִּיכּוּרִין לִשְׁמָא דַיְיָ", "pj_en": "From the place of your dwellings you are to bring the bread for the elevation; two cakes of two-tenths of flour, which must be baked with leaven, as first fruits unto the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ממושבתיכם.<\/b> וְלֹא מִחוּצָה לָאָרֶץ (ספרא):<br><br><b>לחם תנופה.<\/b> לֶחֶם תְּרוּמָה, הַמּוּרָם לְשֵׁם גָּבוֹהַּ, וְזוֹ הִיא הַמִּנְחָה הַחֲדָשָׁה הָאֲמוּרָה לְמַעְלָה:<br><br><b>בכורים.<\/b> רִאשׁוֹנָה לְכָל הַמְּנָחוֹת, אַף לְמִנְחַת קְנָאוֹת הַבָּאָה מִן שְׂעוֹרִים לֹא תִּקְרַב מִן הֶחָדָשׁ קֹדֶם לִשְׁתֵּי הַלֶּחֶם (שם):", "rashi_en": "מושבתיכם [YE SHALL BRING] OUT OF YOUR HABITATIONS [TWO WAVE LOAVES] — but not from outside the Land of Canaan (Sifra, Emor, Chapter 13 1; Menachot 83b).<br><br>לחם תנופה WAVE LOAVES — i. e. heave loaves that have been heaved in honour of the Lord. It is these which constitute the “new meal-offering” mentioned above (v. 16).<br><br>בכורים [THEY ARE] THE FIRSTLINGS — the first of all meal-offerings offered, the first even in relation to the “meal-offering of jealousy” (cf. Numbers 5:15) which was brought of barley; even that must not be offered of the new crop previous to the two loaves, although a barley offering had already been brought, viz., the Omer which was offered on Passover (Menachot 84b)."}, {"ch": 23, "v": 18, "aliyah": 4, "heb": "וְהִקְרַבְתֶּ֣ם עַל־הַלֶּ֗חֶם שִׁבְעַ֨ת כְּבָשִׂ֤ים תְּמִימִם֙ בְּנֵ֣י שָׁנָ֔ה וּפַ֧ר בֶּן־בָּקָ֛ר אֶחָ֖ד וְאֵילִ֣ם שְׁנָ֑יִם יִהְי֤וּ עֹלָה֙ לַֽיהֹוָ֔ה וּמִנְחָתָם֙ וְנִסְכֵּיהֶ֔ם אִשֵּׁ֥ה רֵֽיחַ־נִיחֹ֖חַ לַיהֹוָֽה׃", "onk": "וּתְקָרְבוּן עַל לַחְמָא שִׁבְעָא אִמְּרִין שַׁלְמִין בְּנֵי שְׁנָא וְתוֹר בַּר תּוֹרֵי חַד וְדִכְרִין תְּרֵין יְהוֹן עֲלָתָא <b>קֳדָם<\/b> יְיָ וּמִנְחָתְהוֹן וְנִסְכֵּיהוֹן קֻרְבַּן <b>דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "You shall bring, along with the bread, seven unblemished, yearling lambs, one young bullock and two rams; they shall be a burnt-offering to [<b>before<\/b>] Adonoy with their meal-offerings and wine-offerings, a fire-offering of pleasing fragrance to [<b>an offering which is accepted with favor before<\/b>] Adonoy.", "pj": "וּתְקַרְבוּן עַל לַחְמָא הַהוּא שַׁבְעָא אִימְרִין שַׁלְמִין בְּנֵי שָׁנָה וְתוֹר בַּר תּוֹרִין דְלָא עֵירוּבִין חַד לְחַטָאתָא וּתְרֵין אִמְרִין בְּנֵי שָׁנָה לְנִכְסַת קוּדְשַׁיָא", "pj_en": "And with that bread you are to offer seven lambs of the year, unblemished, and a young bullock without mixture (of colour), the one for a sin offering, and two lambs of the year for a sanctified oblation.", "tj": "", "tj_en": "", "rashi": "<b>על הלחם.<\/b> בִּגְלַל הַלֶּחֶם, חוֹבָה לַלֶּחֶם (ספרא; מנחות מ\"ה):<br><br><b>ומנחתם ונסכיהם.<\/b> כְּמִשְׁפַּט מִנְחָה וּנְסָכִים הַמְפֹרָשִׁים בְּכָל בְּהֵמָה בְּפָרָשַׁת נְסָכִים, שְׁלוֹשָׁה עֶשְׂרוֹנִים לַפָּר וּשְׁנֵי עֶשְׂרוֹנִים לָאַיִל וְעִשָּׂרוֹן לַכֶּבֶשׂ, זוֹ הִיא הַמִּנְחָה, וְהַנְּסָכִים חֲצִי הַהִין לַפָּר וּשְׁלִישִׁית הַהִין לָאַיִל וּרְבִיעִית הַהִין לַכֶּבֶשׂ:", "rashi_en": "על הלחם means, on account of the bread — as an obligation connected with the bread (Sifra, Emor, Chapter 13 4; Menachot 45b).<br><br>ומנחתם ונסכיהם WITH THEIR MEAL OFFERINGS AND THEIR DRINK OFFERINGS — according to the law of the meal offerings and the drink offerings which are distinctly set forth with reference to all animal sacrifices in the chapter dealing with drink offerings: (Numbers 28:12—14) “three tenth deals of flour for one bullock, two tenth deals of flour for one ram, and one tenth deal of flour for one lamb”: — this is the meal-offering. The drink-offerings were: “half a hin of wine for a bullock, the third part of a hin of wine for a ram, and the fourth part of a hin of wine for a lamb”."}, {"ch": 23, "v": 19, "aliyah": 4, "heb": "וַעֲשִׂיתֶ֛ם שְׂעִיר־עִזִּ֥ים אֶחָ֖ד לְחַטָּ֑את וּשְׁנֵ֧י כְבָשִׂ֛ים בְּנֵ֥י שָׁנָ֖ה לְזֶ֥בַח שְׁלָמִֽים׃", "onk": "וְתַעְבְּדוּן צְפִיר בַּר עִזֵּי חַד לְחַטָּאתָא וּתְרֵין אִמְּרִין בְּנֵי שְׁנָא לְנִכְסַת <b>קוּדְשַׁיָּא<\/b>:", "onk_en": "You shall prepare one he-goat as a sin-offering and two yearling lambs as peace[<b>sacred<\/b>]-offerings.", "pj": "וְתַעַבְּדוּן צְפִיר בַּר עִיזֵי דְלָא עֵירוּבִין חַד לְחַטָאתָא וּתְרֵין אִמְרִין בְּנֵי שָׁנָה לְנִכְסַת קוּדְשַׁיָא", "pj_en": "And you shall make (a sacrifice) of a young goat without mixture, the one for a sin offering and two lambs of the year for a sanctified oblation.", "tj": "", "tj_en": "", "rashi": "<b>ועשיתם שעיר עזים.<\/b> יָכוֹל שִׁבְעַת הַכְּבָשִׂים וְהַשָּׂעִיר הָאֲמוּרִים כָּאן הֵם ז' הַכְּבָשִׂים וְהַשָּׂעִיר הָאֲמוּרִים בְּחֻמַּשׁ הַפְּקוּדִים, כְּשֶׁאַתָּה מַגִּיעַ אֵצֶל פָּרִים וְאֵילִים אֵינָן הֵם, אֱמֹר מֵעַתָּה אֵלּוּ לְעַצְמָן וְאֵלּוּ לְעַצְמָן — אֵלּוּ קָרְבוּ בִּגְלַל הַלֶּחֶם וְאֵלּוּ לַמּוּסָפִין (שם):", "rashi_en": "ועשיתם שעיר עזים THEN YE SHALL SACRIFICE ONE KID OF THE GOATS — I might think that the seven lambs (cf. v. 18) and the goat mentioned here are identical with the seven lambs and one goat mentioned in the Book of Numbers (28:27—30). — This is, however, not the case, for when you come to the bullocks and the rams you will find that they are not identical (here, v. 18. we have one bullock and two rams, whilst there you have two bullocks and one ram). Consequently you must admit that these (the lambs and the goats mentioned here) form a group for themselves and the others form a group for themselves: these were offered on account of the loaves and the others as additional offerings for the day (Sifra, Emor, Chapter 13 6; Menachot 45b)."}, {"ch": 23, "v": 20, "aliyah": 4, "heb": "וְהֵנִ֣יף הַכֹּהֵ֣ן&thinsp;<small>׀<\/small>&thinsp;אֹתָ֡ם עַל֩ לֶ֨חֶם הַבִּכֻּרִ֤ים תְּנוּפָה֙ לִפְנֵ֣י יְהֹוָ֔ה עַל־שְׁנֵ֖י כְּבָשִׂ֑ים קֹ֛דֶשׁ יִהְי֥וּ לַיהֹוָ֖ה לַכֹּהֵֽן׃", "onk": "<b>וִירִים<\/b> כַּהֲנָא יָתְהוֹן עַל לְחֵם בִּכּוּרַיָּא <b>אֲרָמוּתָא<\/b> קֳדָם יְיָ עַל תְּרֵין אִמְּרִין קוּדְשָׁא יְהוֹן <b>קֳדָם<\/b> יְיָ לְכַהֲנָא:", "onk_en": "The <i>kohein<\/i> shall wave [<b>lift<\/b>] them [<b>up<\/b>] along with the bread of the first-fruit-offering as a wave-offering [<b>an uplifted-offering<\/b>] before Adonoy with the two lambs; they shall be holy for [<b>before<\/b>] Adonoy, for the <i>kohein<\/i>.", "pj": "וִירֵים כַּהֲנָא יַתְהוֹן עַל לַחְמָא דְבִכּוּרַיָא אֲרָמָא קֳדָם יְיָ עַל תְּרֵין אִמְרִין קוּדְשָׁא יְהוֹן לִשְׁמָא דַיְיָ לְכַהֲנָא", "pj_en": "And the priest shall uplift them with the bread of the first fruits, an elevation before the Lord, with the two lambs; they shall be holy to the Name of the Lord, and shall be for the priest.", "tj": "", "tj_en": "", "rashi": "<b>והניף הכהן אתם, תנופה.<\/b> מְלַמֵּד שֶׁטְּעוּנִין תְּנוּפָה חַיִּים, יָכוֹל כֻּלָּם, תַּ\"לֹ \"עַל שְׁנֵי כְבָשִֹים\" (עי' מנחות ס\"ב):<br><br><b>קדש יהיו.<\/b> לְפִי שֶׁשַּׁלְמֵי יָחִיד קָדָשִׁים קַלִּים, הֻזְקַק לוֹמַר בְּשַׁלְמֵי צִבּוּר שֶׁהֵן קָדְשֵׁי קָדָשִׁים:", "rashi_en": "והניף הכהן אתם... תנופה AND THE PRIEST SHALL WAVE THEM [WITH THE BREAD OF THE FIRSTLINGS] FOR A WAVE OFFERING — This teaches us that they (the offerings) require the waving whilst they are still living. One might think that all of them (the seven lambs mentioned in v. 18) have to be waved! It, however, states על שני כבשים “[and the priests shall wave them… upon the two lambs]” (cf. Menachot 62a).<br><br>קדש יהיו THEY SHALL BE HOLY [TO THE LORD FOR THE PRIEST] — Because festival-offerings offered by a private person are holy only in a minor degree, Scripture was compelled to state of the festival-offerings of the community that they are holy in the highest degree."}, {"ch": 23, "v": 21, "aliyah": 4, "heb": "וּקְרָאתֶ֞ם בְּעֶ֣צֶם&thinsp;<b>׀<\/b> הַיּ֣וֹם הַזֶּ֗ה מִֽקְרָא־קֹ֙דֶשׁ֙ יִהְיֶ֣ה לָכֶ֔ם כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֥ת עוֹלָ֛ם בְּכׇל־מוֹשְׁבֹ֥תֵיכֶ֖ם לְדֹרֹֽתֵיכֶֽם׃", "onk": "<b>וּתְעָרְעוּן<\/b> בִּכְרַן יוֹמָא הָדֵין <b>מְעָרַע<\/b> קַדִּישׁ יְהֵי לְכוֹן כָּל עִבִידַת פָּלְחָן לָא תַעְבְּדוּן קְיַם עָלָם בְּכָל מוֹתְבָנֵיכוֹן לְדָרֵיכוֹן:", "onk_en": "You shall proclaim [<b>cause to occur<\/b>] on this very day; it shall be a [day of] holy assembly [<b>occurrence<\/b>] for you you shall not do any work of labor. It is an everlasting statute in all your dwelling places throughout your generations.", "pj": "וּתְעַרְעוּן חַיִין וְקַיָימִין חַי בִּזְמַן בִּכְרַן יוֹמָא הָדֵין מְעָרַע קַדִישׁ יְהֵי לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְּדוּן קְיַם עֲלָם בְּכָל מוֹתְבָנֵיכוֹן לְדָרֵיכוֹן", "pj_en": "And you shall proclaim with life and strength that self-same day, that at the time of that day there shall be to you a holy convocation: you shall do no work of labour: it is an everlasting statute in all your dwelling for your generations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 22, "aliyah": 4, "heb": "וּֽבְקֻצְרְכֶ֞ם אֶת־קְצִ֣יר אַרְצְכֶ֗ם לֹֽא־תְכַלֶּ֞ה פְּאַ֤ת שָֽׂדְךָ֙ בְּקֻצְרֶ֔ךָ וְלֶ֥קֶט קְצִירְךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽעָנִ֤י וְלַגֵּר֙ תַּעֲזֹ֣ב אֹתָ֔ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבְמֶחֱצָדְכוֹן יָת חֲצָדָא דְאַרְעֲכוֹן לָא תְשֵׁיצֵי פָּאתָא דְחַקְלָךְ בְּמֶחֱצָדָךְ וּלְקָטָא דַחֲצָדָךְ לָא תְלַקֵּט לְעַנְיֵי וּלְגִיּוֹרֵי תִּשְׁבּוֹק יָתְהוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "When you reap the harvest of your land, you shall not cut completely the corner of your field when you reap. You shall not gather the gleaning of your harvest. You shall leave them for the poor and the proselyte, I am Adonoy, your God.", "pj": "וּבִזְמַן מֵחַצְדְכוֹן יַת חֲצַד אַרְעֲכוֹן לָא תְסַיְיפוּן אוּמָנָא חֲדָא דְאִית בְּחַקְלָךְ בְּחַצְדָךְ וּלְקָטָא דְחַצְדָךְ לָא תְלַקֵט לַעֲנִיֵי וּלְגִיוֹרֵי תִּשְׁבּוֹק יַתְהוֹן אֲנָא הוּא יְיָ אֳלָהָכוֹן", "pj_en": "And when you reap the harvest of the ground, you shall not finish one corner that is in thy field at thy reaping nor shalt thou gather the gleanings of thy harvest, but leave them for the poor and the strangers: I am the Lord thy God.", "tj": "", "tj_en": "", "rashi": "<b>ובקצרכם.<\/b> חָזַר וְשָׁנָה, לַעֲבֹר עֲלֵיהֶם בִּשְׁנֵי לָאוין; אָמַר ר' אַבְדִּימֵי בְּרַבִּי יוֹסֵף, מָה רָאָה הַכָּתוּב לִתְּנָהּ בְאֶמְצַע הָרְגָלִים — פֶּסַח וַעֲצֶרֶת מִכָּאן וְרֹאשׁ הַשָּׁנָה וְיוֹם הַכִּפּוּרִים וְחַג מִכָּאן — ? לְלַמֶּדְךָ שֶׁכָּל הַנּוֹתֵן לֶקֶט שִׁכְחָה וּפֵאָה לֶעָנִי כָּרָאוּי, מַעֲלִין עָלָיו כְּאִלּוּ בָּנָה בֵּית הַמִּקְדָּשׁ וְהִקְרִיב קָרְבְּנוֹתָיו בְּתוֹכוֹ (ספרא):<br><br><b>תעזב.<\/b> הַנַּח לִפְנֵיהֶם וְהֵם יִלְקְטוּ, וְאֵין לְךָ לְסַיֵּעַ לְאֶחָד מֵהֶם (פאה פ\"ה):<br><br><b>אני ה' אלהיכם.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר:", "rashi_en": "ובקצרכם AND WHEN YE REAP [THE HARVEST OF YOUR LAND, THOU SHALT NOT MAKE CLEAR RIDDANCE OF THE CORNER OF THE FIELD] — Scripture repeats the prohibition here (although it has already been mentioned above, 19:9) in order to make one who transgresses this law infringe two negative commands. R. Abdima the son of R. Joseph said: What reason had Scripture to place it (the law concerning the corner of the field) amidst those regarding the festival-sacrifices — those of Passover and Pentecost on this side of it, and those of the New Year, Day of Atonement and “the Feast” (Tabernacles) following on that side of it? To teach you that he who leaves the gleanings, the forgotten sheaf and the corner of the field to the poor as it ought to be, is regarded as though he had built the Temple and offered his sacrifices therein (cf. Sifra, Emor, Chapter 13 11).<br><br>תעזב THOU SHALT LEAVE [THEM UNTO THE POOR] — leave these in front of them and they shall gather: you are not allowed to assist one of them to the injury of another poor man (Sifra, Kedoshim, Chapter 3 5; Mishnah Peah 5:6).<br><br>אני ה' אלהיכם I AM THE LORD YOUR GOD, Who am faithful to pay you your reward."}, {"ch": 23, "v": 23, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 24, "aliyah": 5, "heb": "דַּבֵּ֛ר אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר בַּחֹ֨דֶשׁ הַשְּׁבִיעִ֜י בְּאֶחָ֣ד לַחֹ֗דֶשׁ יִהְיֶ֤ה לָכֶם֙ שַׁבָּת֔וֹן זִכְר֥וֹן תְּרוּעָ֖ה מִקְרָא־קֹֽדֶשׁ׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל לְמֵימָר בְּיַרְחָא שְׁבִיעָאָה בְּחַד לְיַרְחָא יְהֵי לְכוֹן נְיָחָא דּוּכְרַן <b>יַבָּבָא מְעָרַע<\/b> קַדִּישׁ:", "onk_en": "Speak to Bnei Yisroel, saying; in the seventh month, on the first of the month, shall be for you a [day of] rest. A remembrance of the sounding [<b>crying<\/b>] [of the <i>shofor<\/i>], a holy assembly [<b>occurrence<\/b>].", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל לְמֵימָר בְּתִשְׁרֵי דְהוּא יַרְחָא שְׁבִיעָאָה יְהֵי לְכוֹן יוֹמָא טָבָא דוּכְרַן יַבָּבָא מְאָרַע קַדִישׁ", "pj_en": "Speak with the children of Israel, saying: In Tishri, which is the seven month, shall be to you a festival of seven days, a memorial of trumpets, a holy convocation.", "tj": "", "tj_en": "", "rashi": "<b>זכרון תרועה.<\/b> זִכְרוֹן פְּסוּקֵי זִכְרוֹנוֹת וּפְסוּקֵי שׁוֹפָרוֹת (ספרא: ראש השנה ל\"ב) לִזְכֹּר לָכֶם עֲקֵדַת יִצְחָק שֶׁקָּרַב תַּחְתָּיו אַיִל:", "rashi_en": "זכרון תרועה [THERE SHALL BE UNTO YOU] A זכרון OF SOUNDING THE CORNET — a mention (זכרון) of Biblical verses which speak of the Divine remembrance and Biblical verses which have reference to the blowing of the Shofar (a ram’s horn) on the occasion of important historical events (Sifra; Rosh Hashanah 32a) that I may recall to memory (זכרון) for you the offering (lit., the “Binding”) of Isaac in whose stead a ram was offered (cf. Rosh Hashanah 16a) having been caught by its horn (שופר‎)."}, {"ch": 23, "v": 25, "aliyah": 5, "heb": "כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְהִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל עִבִידַת פָּלְחָנָא לָא תַעְבְּדוּן וּתְקָרְבוּן <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "You shall not do any work of labor and you shall bring a fire-offering to [<b>an offering before<\/b>] Adonoy.", "pj": "כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן וּתְקַרְבוּן קוּרְבָּנָא קֳדָם יְיָ לִשְׁמָא דַיְיָ", "pj_en": "No work of labour may you do, but offer an oblation before the Lord unto the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>והקרבתם אשה.<\/b> הַמּוּסָפִין הָאֲמוּרִין בְּחֻמַּשׁ הַפְּקוּדִים:", "rashi_en": "אשה‎ והקרבתם‎ AND YE SHALL OFFER A FIRE OFFERING — i. e. the additional offerings prescribed in the Book of Numbers (29:2 ff.)."}, {"ch": 23, "v": 26, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 27, "aliyah": 5, "heb": "אַ֡ךְ בֶּעָשׂ֣וֹר לַחֹ֩דֶשׁ֩ הַשְּׁבִיעִ֨י הַזֶּ֜ה י֧וֹם הַכִּפֻּרִ֣ים ה֗וּא מִֽקְרָא־קֹ֙דֶשׁ֙ יִהְיֶ֣ה לָכֶ֔ם וְעִנִּיתֶ֖ם אֶת־נַפְשֹׁתֵיכֶ֑ם וְהִקְרַבְתֶּ֥ם אִשֶּׁ֖ה לַיהֹוָֽה׃", "onk": "בְּרַם בְּעַשְׂרָא לְיַרְחָא שְׁבִיעָאָה הָדֵין יוֹמָא דְכִפּוּרַיָּא הוּא <b>מְעָרַע<\/b> קַדִּישׁ יְהֵי לְכוֹן וּתְעַנּוּן יָת נַפְשָׁתֵיכוֹן וּתְקָרְבוּן <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "Indeed, on the tenth day of this seventh month is a day of atonement. It shall be for you a [day of] holy assembly [<b>occurrence<\/b>] and you shall afflict yourselves an
