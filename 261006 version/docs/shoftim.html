n": "or make (magical) knots and bindings of serpents and scorpions or any kind of reptile, or who consult the oba, the bones of the dead or the bone Jadua, or who inquire of the manes.", "tj": "וַחֲבּוּרֵי חֲבוּרָא בִּישִׁין וְאַסְרֵי חֵיוָן וְעַקְרַבִּין וְכָל מִינֵי רַחֲשִׁין וּשְׁאָלֵי אוֹבָא וּמַסְקֵי זְכוּרִין וּתְבָעַן אוּלְפַן מִן מֵיתַיָא:", "tj_en": "Or any who use, (magical) knots, or are binders of snakes, scorpions, or any kinds of reptiles, or are consulters of oba, or who bring up the manes, or seek to learn from the dead.", "rashi": "<b>וחבר חבר.<\/b> שֶׁמְּצָרֵף נְחָשִׁים אוֹ עַקְרַבִּים אוֹ שְׁאָר חַיּוֹת לְמָקוֹם אֶחָד:<br><br><b>ושאל אוב.<\/b> זֶה מְכַשְּׁפוּת שֶׁשְּׁמוֹ פִּיתוֹם וּמְדַבֵּר מִשִּׁחְיוֹ וּמַעֲלֶה אֶת הַמֵּת בְּבֵית הַשֶּׁחִי שֶׁלּוֹ:<br><br><b>וידעני.<\/b> מַכְנִיס עֶצֶם חַיָּה שֶׁשְּׁמָהּ יַדּוּעַ לְתוֹךְ פִּיו וּמְדַבֵּר הָעֶצֶם עַל יְדֵי מְכַשְּׁפוּת (שם):<br><br><b>ודרש אל המתים.<\/b> כְּגוֹן הַמַּעֲלֶה בְזַכְרוּתוֹ וְהַנִּשְׁאָל בְּגֻלְגֹּלֶת (שם):", "rashi_en": "וחבר חבר OR A CHARMER — One who charms snakes or scorpions or other creatures into one spot (חבר = “an assembly”) (Sifrei Devarim 172:1).<br><br>ושאל אוב OR A CONSULTER OF THE SPIRIT אוב — This is a kind of sorcery brought about by a spirit whose name is פיתום (in Greek: πύξον) who speaks out of his (the charmer’s) arm-pit, having raised a corpse beneath his arm-pit (Sifrei Devarim 172:2).<br><br>וידעני is one who puts a bone of an animal, the name of which is יִדּוֹעַ, into his mouth and the bone speaks by way of sorcery (Sanhedrin 65a; cf. Rashi on Leviticus 19:31 and Note thereon).<br><br>ודרש אל המתים OR A NECROMANCER — as, for instance, one who raises a corpse, placing it on his genitals, or who consults a skull (Sifrei Devarim 172:4; cf. Sanhedrin 65b)."}, {"ch": 18, "v": 12, "aliyah": 4, "heb": "כִּֽי־תוֹעֲבַ֥ת יְהֹוָ֖ה כׇּל־עֹ֣שֵׂה אֵ֑לֶּה וּבִגְלַל֙ הַתּוֹעֵבֹ֣ת הָאֵ֔לֶּה יְהֹוָ֣ה אֱלֹהֶ֔יךָ מוֹרִ֥ישׁ אוֹתָ֖ם מִפָּנֶֽיךָ׃", "onk": "אֲרֵי <b>מְרָחָק<\/b> יְיָ כָּל דְּיַעְבֵּד אִלֵּין וּבְדִיל תּוֹעֲבָתָא הָאִלֵּין יְיָ אֱלָהָךְ מְתָרַךְ יָתְהוֹן מִקֳּדָמָךְ:", "onk_en": "For Adonoy’s abomination is [<b>distances<\/b>] anyone perpetrating this and because of these abominations, Adonoy, your God, is expelling them from before you.", "pj": "אֲרוּם מְרַחֵק קֳדָם יְיָ כָּל עֲבֵיד אִלֵין וּמְטוֹל תּוֹעֵיבְתָּא הָאִילֵין יְיָ אֱלָהָכוֹן מְתָרֵיכֵיהוֹן מִן קֳדָמֵיכוֹן", "pj_en": "For every one who doeth these is an abomination before the Lord; and because of these abominations the Lord driveth them out before you.", "tj": "", "tj_en": "", "rashi": "<b>כל עשה אלה.<\/b> עֹשֶׂה כָּל אֵלֶּה לֹא נֶאֱמַר, אֶלָּא כָל עֹשֵׂה אֵלֶּה, אֲפִלּוּ אַחַת מֵהֶן (ספרי):", "rashi_en": "כל אלה עשה [FOR] ALL THAT DO THESE THINGS [ARE AN ABOMINATION UNTO THE LORD] — it does not say, “he who does all these things”, but “all who do these things” — who do even only one of them (Sifrei Devarim 173:1; cf. Makkot 24a)."}, {"ch": 18, "v": 13, "aliyah": 4, "heb": "תָּמִ֣ים תִּֽהְיֶ֔ה עִ֖ם יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "שְׁלִים תְּהֵי <b>בְּדַחַלְתָּא<\/b> דַּיְיָ אֱלָהָךְ:", "onk_en": "Walk in perfect trust with [<b>in the fear of<\/b>] Adonoy, your God.", "pj": "שַׁלְמִין תְּהוֹן בְּדַחַלְתָּא דַיְיָ אֱלָהָכוֹן", "pj_en": "Ye shall be perfect in the fear of the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>תמים תהיה עם ה' אלהיך.<\/b> הִתְהַלֵּךְ עִמּוֹ בִתְמִימוּת, וּתְצַפֶּה לוֹ, וְלֹא תַחֲקֹר אַחַר הָעֲתִידוֹת, אֶלָּא כָּל מַה שֶּׁיָּבֹא עָלֶיךָ קַבֵּל בִּתְמִימוּת וְאָז תִּהְיֶה עִמּוֹ וּלְחֶלְקוֹ:", "rashi_en": "תמים תהיה עם ה' אלהיך THOU SHALT BE PERFECT WITH THE LORD THY GOD — walk before him whole-heartedly, put thy hope in Him and do not attempt to investigate the future, but whatever it may be that comes upon thee accept it whole-heartedly, and then thou shalt be with Him and become His portion (Sifrei Devarim 173:3)."}, {"ch": 18, "v": 14, "aliyah": 5, "heb": "כִּ֣י&thinsp;<b>׀<\/b> הַגּוֹיִ֣ם הָאֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔ם אֶל־מְעֹנְנִ֥ים וְאֶל־קֹסְמִ֖ים יִשְׁמָ֑עוּ וְאַתָּ֕ה לֹ֣א כֵ֔ן נָ֥תַן לְךָ֖ יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "אֲרֵי עַמְמַיָּא הָאִלֵּין דִּי אַתְּ יָרֵת יָתְהוֹן מִן מְעָנְנַיָּא וּמִן קַסָּמַיָּא שָׁמְעִין וְאַתְּ לָא כֵן יְהַב לָךְ יְיָ אֱלָהָךְ:", "onk_en": "Although these nations whom you are inheriting heed augurers and sorcerers, but as to you—Adonoy, your God, has not given you their status.", "pj": "אֲרוּם עַמְמַיָא הָאִלֵין דְּאַתּוּן עֲתִידִין לְמֵירוֹת יַתְהוֹן לְחַרוֹרֵי עֵינָא וּלְקִיסוּמֵי קוּסְמַיָא צַיְיתוּן וְאַתּוּן לָא כְוַותְהוֹן אֱלָהֵן כַּהֲנַיָא שַׁיְילוּן אוּרַיָא וְתוּמַיָא וְנָבִיָא תְרִיצַיָא יְהַב לְכוֹן יְיָ אֱלָהָכוֹן", "pj_en": "For these nations which thou art about to dispossess have listened to inspectors of serpents and enchanters. But you are not to be like them the priests shall inquire by Urim and Thummim and a Right Prophet will the Lord your God give you;", "tj": "לַחֲרוֹרֵי עֵינֵיהּ וּלְקִסְמֵי קוּסְמַיָא יִשְׁמְעוּן:", "tj_en": "To inspectors of serpents and to users of enchantments have they hearkened.", "rashi": "<b>לא כן נתן לך ה' אלהיך.<\/b> לִשְׁמֹעַ אֶל מְעוֹנְנִים וְאֶל קוֹסְמִים, שֶׁהֲרֵי הִשְׁרָה שְׁכִינָה עַל הַנְּבִיאִים וְאוּרִים וְתֻמִּים:", "rashi_en": "לא כן נתן לך ה' אלהיך BUT NOT SO HATH THE LORD THY GOD SUFFERED THEE [TO DO] — i.e. to hearken unto מעוננים and קוסמים, for you see, He has made His Divine Presence dwell upon the prophets and upon the “Urim and Thummim” (and these will, if necessary, inform thee of what God has in store for thee)."}, {"ch": 18, "v": 15, "aliyah": 5, "heb": "נָבִ֨יא מִקִּרְבְּךָ֤ מֵאַחֶ֙יךָ֙ כָּמֹ֔נִי יָקִ֥ים לְךָ֖ יְהֹוָ֣ה אֱלֹהֶ֑יךָ אֵלָ֖יו תִּשְׁמָעֽוּן׃", "onk": "נְבִיָּא מִבֵּינָךְ מֵאַחָיךְ כְּוָתִי יְקִים לָךְ יְיָ אֱלָהָךְ מִנֵּיהּ תְּקַבְּלוּן:", "onk_en": "A prophet from your midst, of your brethren, like me, will Adonoy, your God, establish for you; heed him.", "pj": "נְבִיָא מִבֵּינֵיכוֹן מִן אֲחוּכוֹן דְּדָמֵי לִי בְּרוּחַ קוּדְשָׁא יְקִים לְכוֹן יְיָ אֱלָהָכוֹן מִנֵּיהּ תְקַבְּלוּן", "pj_en": "a Prophet from among you of your brethren like unto me, with the Holy Spirit will the Lord your God raise up unto you; to Him shall you be obedient.", "tj": "", "tj_en": "", "rashi": "<b>מקרבך מאחיך כמני.<\/b> כְּמוֹ שֶׁאֲנִי מִקִּרְבְּךָ מֵאַחֶיךָ, <b>יקים לך<\/b> תַּחְתַּי, וְכֵן מִנָּבִיא לְנָבִיא:", "rashi_en": "מקרבך מאחיך כמני [THE LORD THY GOD WILL RAISE UP UNTO THEE A PROPHET] FROM THE MIDST OF THEE, OF THY BRETHREN, LIKE UNTO ME — This means: One who is as I am, from your midst, of your brethren, יקים לך WILL HE RAISE UP UNTO THEE in my stead, and so likewise from prophet to prophet throughout all ages."}, {"ch": 18, "v": 16, "aliyah": 5, "heb": "כְּכֹ֨ל אֲשֶׁר־שָׁאַ֜לְתָּ מֵעִ֨ם יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ בְּחֹרֵ֔ב בְּי֥וֹם הַקָּהָ֖ל לֵאמֹ֑ר לֹ֣א אֹסֵ֗ף לִשְׁמֹ֙עַ֙ אֶת־קוֹל֙ יְהֹוָ֣ה אֱלֹהָ֔י וְאֶת־הָאֵ֨שׁ הַגְּדֹלָ֥ה הַזֹּ֛את לֹֽא־אֶרְאֶ֥ה ע֖וֹד וְלֹ֥א אָמֽוּת׃", "onk": "כְּכֹל דִּי שְׁאֶלְתָּא <b>מִקֳּדָם<\/b> יְיָ אֱלָהָךְ בְּחֹרֵב בְּיוֹמָא דִקְהָלָא לְמֵימָר לָא אוֹסֵף לְמִשְׁמַע יָת קָל <b>מֵימְרָא<\/b> דַיְיָ אֱלָהַי וְיָת אֶשָּׁתָא רַבְּתָא הָדָא לָא אֶחֱזֵי עוֹד וְלָא אֵמוּת:", "onk_en": "Exactly as you requested from [<b>before<\/b>] Adonoy, your God, at Choreiv, on the day of assembly, saying, ‘‘Let me not continue to hear the voice [<b>the word<\/b>] of Adonoy, my God, and this great fire let me not see any more as that I will not die.’’", "pj": "כְּכל דְּשַׁיִּילְתּוּן מִן קֳדָם יְיָ אֱלָהָכוֹן בְּחוֹרֵב בְּיוֹמָא דְאִתְכַּנָּשׁוּ שִׁבְטַיָא לִמְקַבְּלָא אוֹרַיְיתָא לְמֵימָר לָא נוֹסִיף לְמִשְׁמַע יַת קַל דִּיבּוּרָא מִן קֳדָם יְיָ אֱלָהָנָא וְיַת אֵישָׁתָא רַבְּתָא הֲדָא לָא נֶחֱמֵי תּוּב דְּלָא נְמוּת", "pj_en": "According to all that you begged before the Lord your God in Horeb on the day of the assembling of the tribes to receive the law, saying, Let us not again hear the Great Voice {of the Word - Dibbura} from before the Lord our God, nor behold again that great fire, lest we die:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 17, "aliyah": 5, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֵלָ֑י הֵיטִ֖יבוּ אֲשֶׁ֥ר דִּבֵּֽרוּ׃", "onk": "וַאֲמַר יְיָ לִי אוֹטִיבוּ דִּי מַלִּילוּ:", "onk_en": "Adonoy said to me, ‘‘What they said is excellent.", "pj": "וַאֲמַר יְיָ לִי אַתְקִינָן מַה דְּמַלֵּילָן", "pj_en": "and the Lord said to me, That which they have spoken is right;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 18, "aliyah": 5, "heb": "נָבִ֨יא אָקִ֥ים לָהֶ֛ם מִקֶּ֥רֶב אֲחֵיהֶ֖ם כָּמ֑וֹךָ וְנָתַתִּ֤י דְבָרַי֙ בְּפִ֔יו וְדִבֶּ֣ר אֲלֵיהֶ֔ם אֵ֖ת כׇּל־אֲשֶׁ֥ר אֲצַוֶּֽנּוּ׃", "onk": "נְבִיָּא אֲקִים לְהוֹן מִגּוֹ אֲחֵיהוֹן כְּוָתָךְ וְאֶתֵּן פִּתְגָּמֵי <b>נְבוּאָתִי<\/b> בְּפוּמֵיהּ וִימַלֵּל עִמְּהוֹן יָת כָּל דִּי אֲפַקְּדִנֵּיהּ:", "onk_en": "A prophet will I establish for them from among their brethren like you, and I will place My words [<b>of prophecy<\/b>] in his mouth and he will tell them everything that I command him.", "pj": "נְבִיָא אָקִים לְהוֹן מִבֵּינֵי אֲחוּהוֹן דְּרוּחַ קוּדְשָׁא בֵּיהּ כְּוָותָךְ וְאֶתֵּן פִּתְגָמֵי נְבוּאָתִי בְּפוּמֵיהּ וִימַלֵּיל עִמְהוֹן יַת כָּל דְּאִיפְקְדִינֵיהּ", "pj_en": "I will raise up unto them a Prophet from, among their brethren in whom shall be the Holy Spirit, as in thee; and I will put My Word of prophecy in his mouth, and he shall speak with them whatsoever I command him;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 19, "aliyah": 5, "heb": "וְהָיָ֗ה הָאִישׁ֙ אֲשֶׁ֤ר לֹֽא־יִשְׁמַע֙ אֶל־דְּבָרַ֔י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּשְׁמִ֑י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵעִמּֽוֹ׃", "onk": "וִיהֵי גַּבְרָא דִּי לָא יְקַבֵּל לְפִתְגָּמַי דִּי יְמַלֵּל בִּשְׁמִי <b>מֵימְרִי<\/b> יִתְבַּע מִנֵּיהּ:", "onk_en": "Now, the man who does not heed My words that he speaks in My Name; I [<b>My word<\/b>] will demand from him.", "pj": "וִיהֵי גַבְרָא דְלָא יִתְקַבֵּל פִּתְגָמֵי נְבוּאָתִי דִימַלֵּיל בִּשְׁמִי מֵימְרִי יִפְרַע מִנֵּיהּ", "pj_en": "and the man who will not hearken to the words of My prophecy which shall be spoken in My Name, My Word shall take vengeance upon him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 20, "aliyah": 5, "heb": "אַ֣ךְ הַנָּבִ֡יא אֲשֶׁ֣ר יָזִיד֩ לְדַבֵּ֨ר דָּבָ֜ר בִּשְׁמִ֗י אֵ֣ת אֲשֶׁ֤ר לֹֽא־צִוִּיתִיו֙ לְדַבֵּ֔ר וַאֲשֶׁ֣ר יְדַבֵּ֔ר בְּשֵׁ֖ם אֱלֹהִ֣ים אֲחֵרִ֑ים וּמֵ֖ת הַנָּבִ֥יא הַהֽוּא׃", "onk": "בְּרַם נְבִיָּא דִּי יַרְשַׁע לְמַלָּלָא פִתְגָּמָא בִּשְׁמִי יָת דִּי לָא פַקֵּדִתֵּיהּ לְמַלָּלָא וְדִי יְמַלֵּל בְּשׁוּם <b>טַעֲוַת עַמְמַיָּא<\/b> וְיִתְקְטֵל נְבִיָּא הַהוּא:", "onk_en": "But the prophet who will malevolently make a statement in My Name, something that I did not instruct him to say, or which he says in the name of foreign gods [<b>idols of the nations<\/b>], that prophet must die.", "pj": "בְּרַם נְבִי שִׁקְרָא דְיִרְשַׁע לְמַלָלָא פִּתְגָמָא בִּשְׁמִי יַת דְּלָא פַקִידְתֵּיהּ לְמַלָּלָא וְדִי יְמַלֵּל בְּשׁוּם טַעֲוַות עַמְמַיָא וְיִתְקְטֵיל נְבִיָא הַהוּא בְּסַיְיפָא", "pj_en": "But the false prophet who doeth wickedly in speaking a thing in My Name, when I have not commanded him to speak, or who shall speak in the name of the gods of the Gentiles., that prophet shall be slain with the sword.", "tj": "", "tj_en": "", "rashi": "<b>אשר לא צויתיו לדבר.<\/b> אֲבָל צִוִּיתִיו לַחֲבֵרוֹ:<br><br><b>ואשר ידבר בשם אלהים אחרים.<\/b> אֲפִלּוּ כִוֵּן אֶת הַהֲלָכָה לֶאֱסֹר אֶת הָאָסוּר וּלְהַתִּיר אֶת הַמֻּתָּר (סנהדרין פ\"ט):<br><br><b>ומת.<\/b> בְּחֶנֶק. ג' מִיתָתָן בִּידֵי אָדָם – הַמִּתְנַבֵּא מַה שֶּׁלֹּא שָׁמַע, וּמַה שֶּׁלֹּא נֶאֱמַר לוֹ וְנֶאֱמַר לַחֲבֵרוֹ, וְהַמִּתְנַבֵּא בְּשֵׁם עֲ\"זָ. אֲבָל הַכּוֹבֵשׁ אֶת נְבוּאָתוֹ וְהָעוֹבֵר עַל דִּבְרֵי נָבִיא וְהָעוֹבֵר עַל דִּבְרֵי עַצְמוֹ – מִיתָתָן בִּידֵי שָׁמַיִם, שֶׁנֶּאֱמַר (פסוק י\"ט) אָנֹכִי אֶדְרֹשׁ מֵעִמּוֹ (סנהדרין פ\"ט):", "rashi_en": "אשר לא צויתיו לדבר [BUT THE PROPHET WHO SHALL PRESUME TO SPEAK A WORD …] WHICH I HAVE NOT COMMANDED HIM TO SPEAK — but which I may have commanded his fellow-prophet to speak (Sanhedrin 89a),<br><br>ואשר ידבר בשם אלהים אחרים OR THAT SHALL SPEAK IN THE NAME OF OTHER GODS — even though he be in exact agreement with the Halacha, — that he forbids what is forbidden, or permits what is permitted, [but does so in the name of other gods] (Sanhedrin 89a),<br><br>ומת HE SHALL DIE — by strangulation. — There are three false prophets who must be put to death by man (by the court): one who prophesies something which he has not heard (was not commanded to prophesy); one who prophesies something that was not spoken unto him but was spoken unto his fellow-prophet, and finally one who prophesies in the name of an idol. But he who suppresses his prophecy (does not utter it as commanded to do), and he who transgresses the words of a prophet, or, being himself a prophet, transgresses his own words — their death is by the Heavenly Judge, for it is said, (v. 19) “I” will require it from him” (Sanhedrin 89a)."}, {"ch": 18, "v": 21, "aliyah": 5, "heb": "וְכִ֥י תֹאמַ֖ר בִּלְבָבֶ֑ךָ אֵיכָה֙ נֵדַ֣ע אֶת־הַדָּבָ֔ר אֲשֶׁ֥ר לֹא־דִבְּר֖וֹ יְהֹוָֽה׃", "onk": "וַאֲרֵי תֵימַר בְּלִבָּךְ אֶכְדֵּין נִדַּע יָת פִּתְגָּמָא דִּי לָא מַלְּלֵיהּ יְיָ:", "onk_en": "If you should say to yourself, ‘‘How can we know [which is] the statement that Adonoy did not speak?’’", "pj": "וַאֲרוּם תֵּימְרוּן בְּרַעֲיוֹנֵיכוֹן הֵיכְדֵין נֵידַע יַת פִּתְגָּמָא דְלָא מַלְלֵיהּ יְיָ", "pj_en": "And if thou shalt say in your thoughts, How shall we know the word which the Lord hath not spoken?", "tj": "", "tj_en": "", "rashi": "<b>וכי תאמר בלבבך.<\/b> עֲתִידִין אַתֶּם לוֹמַר כְּשֶׁיָּבֹא חֲנַנְיָה בֶּן עַזּוּר וּמִתְנַבֵּא \"הִנֵּה כְלֵי בֵית ה' מוּשָׁבִים מִבָּבֶלָה עַתָּה מְהֵרָה\" (ירמיהו כ\"ז), וְיִרְמְיָהוּ עוֹמֵד וְצוֹוֵחַ \"אֶל הָעַמֻּדִים וְעַל הַיָּם וְעַל יֶתֶר הַכֵּלִים\" שֶׁלֹּא גָּלוּ עִם יְכָנְיָה, \"בָּבֶלָה יוּבָאוּ\" עִם גָּלוּת צִדְקִיָּהוּ (שם):", "rashi_en": "וכי תאמר בלבבך AND IF THOU SAY IN THINE HEART [HOW SHALL WE KNOW THE WORD WHICH THE LORD HATH NOT SPOKEN]? — you will once ask this — when Hananiah the son of Azur (the false prophet) comes and prophesies (Jeremiah 27:16) “Behold, the vessels of the Lord’s house will now shortly be brought again from Babylon”, whilst Jeremiah (the true prophet) stands and proclaims (Jeremiah 27:19—22) “concerning the pillars, and concerning the laver, and concerning the bases, and concerning the residue of the vessels [which remain in this city which Nebuchadnezzar king of Babylon took not,…]” which did not go into exile to Babylon with Jeconiah, king of Judah, “they shall be carried to Babylon [and there they shall remain]” together with Zedekiah when he will go into exile (Sifrei Devarim 178:2)."}, {"ch": 18, "v": 22, "aliyah": 5, "heb": "אֲשֶׁר֩ יְדַבֵּ֨ר הַנָּבִ֜יא בְּשֵׁ֣ם יְהֹוָ֗ה וְלֹֽא־יִהְיֶ֤ה הַדָּבָר֙ וְלֹ֣א יָבֹ֔א ה֣וּא הַדָּבָ֔ר אֲשֶׁ֥ר לֹא־דִבְּר֖וֹ יְהֹוָ֑ה בְּזָדוֹן֙ דִּבְּר֣וֹ הַנָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽנּוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דִּי יְמַלֵּל נְבִיָּא בִּשְׁמָא דַיְיָ וְלָא יְהֵי פִתְגָּמָא וְלָא יִתְקַיַּם הוּא פִתְגָּמָא דִּי לָא מַלְּלֵיהּ יְיָ בִּרְשַׁע מַלְּלֵיהּ נְבִיָּא לָא תִדְחַל מִנֵּיהּ:", "onk_en": "Should the prophet speak in Adonoy’s Name, and the matter does not happen and is not fulfilled, that is the statement that Adonoy did not speak. The prophet spoke it malevolently; do not fear him.", "pj": "מַה דִּימַלֵּיל נְבִי שִׁקְרָא בִּשְׁמָא דַיְיָ וְלָא יֵיתֵי פִּתְגָּמָא וְלָא יִתְקַיֵּים הוּא פִּתְגָּמָא דְּלָא מַלְלֵיהּ יְיָ בִּזְדָנוּתָא מַלְלֵיהּ נְבִי שִׁקְרָא לָא תִדַחֲלוּן מִנֵּיהּ", "pj_en": "When a false prophet speaketh in the Name of the Lord, and the thing doth not come to pass, or be not confirmed, it is a word which the Lord hath not spoken; the false prophet spake it in presumption; fear him not.", "tj": "", "tj_en": "", "rashi": "<b>אשר ידבר הנביא.<\/b> וְיֹאמַר דָּבָר זֶה עָתִיד לָבֹא עֲלֵיכֶם וְתִרְאוּ שֶׁלֹּא יָבֹא, <b>הוא הדבר אשר לא דברו ה'<\/b> וַהֲרֹג אוֹתוֹ. וְאִם תֹּאמַר זוֹ בְמִתְנַבֵּא עַל הָעֲתִידוֹת, הֲרֵי שֶׁבָּא וְאָמַר עֲשׂוּ כָךְ וְכָךְ וּמִפִּי הַקָּבָּ\"ה אֲנִי אוֹמֵר? כְּבָר נִצְטַוּוּ שֶׁאִם בָּא לְהַדִּיחֲךָ מֵאַחַת מִכָּל הַמִּצְווֹת לֹא תִשְׁמַע לוֹ (דברים י\"ג) אֶלָּא אִם כֵּן מֻמְחֶה הוּא לְךָ שֶׁהוּא צַדִּיק גָּמוּר, כְּגוֹן אֵלִיָּהוּ בְהַר הַכַּרְמֶל שֶׁהִקְרִיב בְּבָמָה בִּשְׁעַת אִסּוּר הַבָּמוֹת, כְּדֵי לִגְדֹּר אֶת יִשְׂרָאֵל, הַכֹּל לְפִי צֹרֶךְ שָׁעָה וּסְיָג הַפִּרְצָה, לְכָךְ נֶאֱמַר (פסוק ט\"ו) אֵלָיו תִּשְׁמָעוּן (סנהדרין פ\"ט):<br><br><b>לא תגור ממנו.<\/b> לֹא תִמְנַע עַצְמְךָ מִלְּלַמֵּד עָלָיו חוֹבָה (ספרי), וְלֹא תִירָא לֵעָנֵשׁ עָלָיו:", "rashi_en": "אשר ידבר הנביא WHEN THE PROPHET SPEAKETH [IN THE NAME OF THE LORD] and says, “This thing will once happen to you”, and you will see that it did not happen, הוא הדבר אשר לא דברו ה׳ THAT IS THE THING WHICH THE LORD HATH NOT SPOKEN — and, therefore, slay him. If, however, you say, “But this refers to one who will prophesy about the future. But suppose one comes and says, ‘Do so and so, and I say this by the command of the Holy One blessed be He’? How, then, can we know whether God has spoken this or not?” The reply is: As regards such a case they have already been commanded that if one comes to thrust thee away from one of the divine commandments, לא תשמע לו “then thou shalt not hearken unto him” (Deuteronomy 13:12), unless you are certain that he is a perfectly righteous man, as, for instance. Elijah at the incident on Mount Carmel, who offered sacrifices on a Bamah (an improvised altar) at a time when offering on Bamoth was forbidden, but who did so in order to fence Israel in against idolatry. Thus all depends on the needs of the time and the necessity of taking preventive measures (סיג) against a breach. With reference to such a case it states, (v. 15) “unto him ye shall hearken” (Sanhedrin 89b; Yevamot 90b).<br><br>לא תגור ממנו THOU SHALT NOT BE AFRAID OF HIM — i.e. do not refrain from advocating his guilt (Sifrei Devarim 178:3) and do not fear that you may incur punishment on his account (because you have contributed to his death)."}, {"ch": 19, "v": 1, "aliyah": 5, "heb": "כִּֽי־יַכְרִ֞ית יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ אֶת־הַגּוֹיִ֔ם אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ אֶת־אַרְצָ֑ם וִֽירִשְׁתָּ֕ם וְיָשַׁבְתָּ֥ בְעָרֵיהֶ֖ם וּבְבָתֵּיהֶֽם׃", "onk": "אֲרֵי יְשֵׁצֵי יְיָ אֱלָהָךְ יָת עַמְמַיָּא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ יָת אַרְעֲהוֹן וְתֵירְתִנּוּן וְתֵיתֵב בְּקִרְוֵיהוֹן וּבְבָתֵּיהוֹן:", "onk_en": "When Adonoy, your God, annihilates the nations whose land Adonoy, your God is giving you; and you inherit them and live in their cities and in their houses;", "pj": "אֲרוּם יְשֵׁיצֵי יְיָ אֱלָהָכוֹן יַת עַמְמַיָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן יַת אַרְעֲהוֹן וְתֵירְתִינוּן וְתֵיתְבוּן בְּקִירְוֵיהוֹן וּבְבָתֵּיהוֹן", "pj_en": "When the Lord your God shall have destroyed the nations whose land the Lord your God giveth you, and you possess them, and dwell in their cities and houses,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 2, "aliyah": 5, "heb": "שָׁל֥וֹשׁ עָרִ֖ים תַּבְדִּ֣יל לָ֑ךְ בְּת֣וֹךְ אַרְצְךָ֔ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ לְרִשְׁתָּֽהּ׃", "onk": "תְּלַת קִרְוִין תַּפְרַשׁ לָךְ בְּגוֹ אַרְעָךְ דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ לְמֵירְתַהּ:", "onk_en": "Separate three cities for yourself, within your land that Adonoy, your God, is giving you to inherit.", "pj": "תְּלַת קִרְוִין תִּפְרְשׁוּן לְכוֹן בְּגוֹ אַרְעֲכוֹן דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן לְמֵירְתָהּ", "pj_en": "three cities shall you set apart within your land which the Lord your God giveth you to inherit.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 3, "aliyah": 5, "heb": "תָּכִ֣ין לְךָ֮ הַדֶּ֒רֶךְ֒ וְשִׁלַּשְׁתָּ֙ אֶת־גְּב֣וּל אַרְצְךָ֔ אֲשֶׁ֥ר יַנְחִֽילְךָ֖ יְהֹוָ֣ה אֱלֹהֶ֑יךָ וְהָיָ֕ה לָנ֥וּס שָׁ֖מָּה כׇּל־רֹצֵֽחַ׃", "onk": "תְּתַקֵּן לָךְ אָרְחָא וּתְתַלַּת יָת תְּחוּם אַרְעָךְ דִּי יַחְסְנִנָּךְ יְיָ אֱלָהָךְ וִיהֵי לְמֵעִירוֹק תַּמָּן כָּל קָטוֹלָא:", "onk_en": "Ready the route for yourself and divide the borders of your land into three sections that Adonoy, your God, will allot you; this will serve for any murderer to flee there.", "pj": "תְּכַוְונוּן לְכוֹן אָרְחָא וּתְתַלְתוּן יַת תְּחוּם אַרְעֲכוֹן דִּיחַסְנְכוֹן יְיָ אֱלָהָכוֹן וִיהֵי לְמַעֲרוֹק לְתַמָּן כָּל קָטוֹלָא", "pj_en": "You shall prepare a high road, and divide your limit which the Lord your God bestoweth upon you, that any manslayer may flee thither.", "tj": "", "tj_en": "", "rashi": "<b>תכין לך הדרך.<\/b> \"מִקְלָט\", \"מִקְלָט\" הָיָה כָתוּב עַל פָּרָשַׁת דְּרָכִים (מכות י'):<br><br><b>ושלשת את גבול ארצך.<\/b> שֶׁיְּהֵא מִתְּחִלַּת הַגְּבוּל עַד הָעִיר הָרִאשׁוֹנָה שֶׁל עָרֵי מִקְלָט כְּשִׁעוּר מַהֲלָךְ שֶׁיֵּשׁ מִמֶּנָּה עַד הַשְּׁנִיָּה וְכֵן מִשְּׁנִיָּה לַשְּׁלִישִׁית וְכֵן מִן הַשְּׁלִישִׁית עַד הַגְּבוּל הַשֵּׁנִי שֶׁל אֶרֶץ יִשְׂרָאֵל (שם ט'):", "rashi_en": "תכין לך הדרך THOU SHALT PREPARE THEE A WAY — “Refuge!” \"Refuge!\" was inscribed at each crossroad (to point the way to the nearest city of refuge) (Makkot 10b).<br><br>ושלשת את גבול ארצך AND THOU SHALT DIVIDE THE TERRITORY OF THY LAND … INTO THREE PARTS — so that from the point where the boundary begins unto the first city of refuge there should be the same length of journey as there is from it to the second city; and that there should be the same distance from the second to the third and from the third to the other (opposite) boundary of the Land of Israel (Makkot 9b)."}, {"ch": 19, "v": 4, "aliyah": 5, "heb": "וְזֶה֙ דְּבַ֣ר הָרֹצֵ֔חַ אֲשֶׁר־יָנ֥וּס שָׁ֖מָּה וָחָ֑י אֲשֶׁ֨ר יַכֶּ֤ה אֶת־רֵעֵ֙הוּ֙ בִּבְלִי־דַ֔עַת וְה֛וּא לֹא־שֹׂנֵ֥א ל֖וֹ מִתְּמֹ֥ל שִׁלְשֹֽׁם׃", "onk": "וְדֵין פִּתְגַּם קָטוֹלָא דְּיֵעִרוֹק תַּמָּן וְיִתְקַיַּם דִּי יִקְטוֹל יָת חַבְרֵיהּ בְּלָא מַנְדְּעֵיהּ וְהוּא לָא סָנֵי לֵיהּ מֵאִתְמַלֵּי וּמִדְּקָמוֹהִי:", "onk_en": "And this is the matter of the murderer who may flee there to survive: whoever smites his peer without intent, and he had not been his enemy yesterday [or] the day before;", "pj": "וְדֵין הִילְכַת קָטוֹלָא דְיַעֲרוֹק לְתַמָּן וְיֵיחֵי דְּיִקְטוֹל יַת אָחֵיהּ בְּלָא מִתְכַוִין לֵיהּ וְהוּא לָא נְטַר לֵיהּ סְנָא מֵאִתְמְלֵי וּמִדְקֳדָמוֹי", "pj_en": "And this is the regulation for the manslayer who fleeth thither that he may live: Whoever shall have killed his brother without intention, he not having kept enmity against him yesterday, or the day before,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 5, "aliyah": 5, "heb": "וַאֲשֶׁר֩ יָבֹ֨א אֶת־רֵעֵ֥הוּ בַיַּ֘עַר֮ לַחְטֹ֣ב עֵצִים֒ וְנִדְּחָ֨ה יָד֤וֹ בַגַּרְזֶן֙ לִכְרֹ֣ת הָעֵ֔ץ וְנָשַׁ֤ל הַבַּרְזֶל֙ מִן־הָעֵ֔ץ וּמָצָ֥א אֶת־רֵעֵ֖הוּ וָמֵ֑ת ה֗וּא יָנ֛וּס אֶל־אַחַ֥ת הֶעָרִים־הָאֵ֖לֶּה וָחָֽי׃", "onk": "וְדִי יֵעוּל עִם חַבְרֵיהּ בְּחֻרְשָׁא לְמִקַּץ אָעִין וְתִתְמְרֵג יְדֵיהּ בְּפַרְזְלָא לְמִקַּץ אָעִין וְיִשְׁתְּלֵף פַּרְזְלָא מִן אָעָא וְיַשְׁכַּח יָת חַבְרֵיהּ וִימוּת הוּא יֵעִרוֹק לַחֲדָא <b>מִן<\/b> קִרְוַיָּא הָאִלֵּין וְיִתְקַיַּם:", "onk_en": "And whoever comes with his peer into the woods to chop trees, and as his hand swung the axe downward to cut the wood the iron flew off the wooden handle and encounters his peer and he dies; he is to flee to one of these cities to survive.", "pj": "וּמַאן דְּעָלֵיל עִם חַבְרֵיהּ בְּחֻרְשָׁא לְמִקְטַע קִיסִין וְתִדְחַף אִידֵיהּ בְּסִיקוֹרְיָא לְמִקְטַע קִיסָא וְיִשְׁמוֹט פַּרְזְלָא מִן קַתָּא וְיַשְׁכַּח יַת חַבְרֵיהּ וִימוּת הוּא יַעֲרוֹק לַחֲדָא מִן קִירְוַיָא מְזַמְנַיָיא הָאִלֵּין וְיֵיחֵי", "pj_en": "(as for example) if any one goeth with his neighbour into the thicket to cut wood, and he driveth his hand with the axe to cut wood, and the iron flieth apart from the haft and lighteth on his neighbour that be die, he may flee to one of those appointed cities, and. save his life.", "tj": "וּדְיֵיעוּל עִם חַבְרֵיהּ בְּחוּרְשָׁא לְמִקְטוֹעַ קֵיסִין וְיִתְקוֹף בָּהּ בְּסִיקוֹרָא לְמִקְטַע קֵיסִין וְיַשְׁמֵיט פּוּרְזַל מִן קֵיסָא וִיעָרַע יַת חַבְרֵיהּ וִימוּת הוּא יַעֲרוֹק לַחֲדָא מִן קוּרְיָיתָא הָאִלֵּין וִיחֵי:", "tj_en": "He who may go with his neighbour into the thicket to cut wood, and exerting himself with the axe to cut the wood, the iron separate from the handle, and fall upon his neighbour that he die, he may flee into one of those cities and live.", "rashi": "<b>ונדחה ידו.<\/b> כְּשֶׁבָּא לְהַפִּיל הַגַּרְזֶן עַל הָעֵץ, וְתַרְגּוּמוֹ \"וְתִתְמְרֵיג יְדֵיהּ\", לְשׁוֹן וְנִשְׁמְטָה יָדוֹ לְהַפִּיל מַכַּת הַגַּרְזֶן עַל הָעֵץ, \"כִּי שָׁמְטוּ הַבָּקָר\" (שמואל ב ו') תִּרְגֵּם יוֹנָתָן \"אֲרֵי מַרְגוּהִי תּוֹרַיָּא\":<br><br><b>ונשל הברזל מן העץ.<\/b> יֵשׁ מֵרַבּוֹתֵינוּ אוֹמְרִים נִשְׁמַט הַבַּרְזֶל מִקַּתּוֹ, וְיֵש מֵהֶם אוֹמְרִים שֶׁיִּשַּׁל הַבַּרְזֶל חֲתִיכָה מִן הָעֵץ הַמִּתְבַּקֵּעַ וְהִיא נִתְּזָה וְהָרְגָה (מכות ז'):", "rashi_en": "ונדחה ידו AND HIS HAND MOVED (SLIPPED) when he was about to let the axe fall upon the tree. The Targum rendering is ותתמריג ידה, the meaning being, “his hand moved itself to let the stroke of the axe fall upon the tree”. The words (II Samuel 6:6) כי שמטו הבקר are rendered in Targum Jonathan on by: ארי מרגוהי תוריא “for the oxen moved it (the Ark)”<br><br>ונשל הברזל מן העץ — Some of our Rabbis say that this means that the iron (axe) flew off from its handle (העץ); but some of them say that it means that the iron made a splinter of wood fall off from the tree which was being chopped, and it sprang off and killed him (according to this explanation the word העץ in both cases refers to the tree) (Makkot 7b)."}, {"ch": 19, "v": 6, "aliyah": 5, "heb": "פֶּן־יִרְדֹּף֩ גֹּאֵ֨ל הַדָּ֜ם אַחֲרֵ֣י הָרֹצֵ֗חַ כִּי־יֵחַם֮ לְבָבוֹ֒ וְהִשִּׂיג֛וֹ כִּֽי־יִרְבֶּ֥ה הַדֶּ֖רֶךְ וְהִכָּ֣הוּ נָ֑פֶשׁ וְלוֹ֙ אֵ֣ין מִשְׁפַּט־מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖וֹ מִתְּמ֥וֹל שִׁלְשֽׁוֹם׃", "onk": "דִּילְמָא יִרְדּוֹף גָּאֵל דְּמָא בָּתַר קָטוֹלָא אֲרֵי יֵחַם לִבֵּיהּ וְיַדְבְּקִנֵּיהּ אֲרֵי תִסְגֵּי אָרְחָא וְיִקְטְלִנֵּיהּ נְפַשׁ וְלֵיהּ לֵית חוֹבַת <b>דִּין דִּקְטוֹל<\/b> אֲרֵי לָא סָנֵי הוּא לֵיהּ מִתְּמַלִּי וּמִדְּקָמוֹהִי:", "onk_en": "Lest the blood-redeemer pursue the murderer when his heart grows heated, and he catches up with him over the length of the road and he smite him dead when he has no [<b>judgment of a<\/b>] death sentence because he had not been his enemy yesterday [or] the day before.", "pj": "דִּלְמָא יִרְדוֹף תְּבַע אַדְמָא בָּתַר קָטוֹלָא אֲרוּם יִרְתַח עֲלוֹי לִבֵּיהּ בְּעַקְתֵיהּ וְיִדְבְּקֵיהּ אֲרוּם תַּסְגֵי אָרְחָא וְיִקְטְלִינֵיהּ נְפָשׁ וְלֵיהּ לָא אִית חוֹבַת דִּין דִּקְטוֹל אֲרוּם לָא סָנֵי הוּא לֵיהּ מֵאִתְמְלֵי וּמִדְקֳדָמוֹי", "pj_en": "Lest the avenger of blood follow after him his heart boiling within him on account of his grief, and apprehend him, if the way be long, and take his life, though he is not guilty of the judgment of death, because he had not enmity against him in time past.", "tj": "אֲרוּם יִרְתַא לִבֵּיהּ וִיאָרַע:", "tj_en": "Because his heart is boiling and be meeteth.", "rashi": "<b>פן ירדף גאל הדם.<\/b> לְכָךְ אֲנִי אוֹמֵר לְהָכִין לְךָ דֶּרֶךְ וְעָרֵי מִקְלָט רַבִּים:", "rashi_en": "פן ירדף גאל הדם LEST THE AVENGER OF THE BLOOD PURSUE [THE SLAYER] — therefore I tell you to prepare the way for you and [to prepare] many cities of refuge."}, {"ch": 19, "v": 7, "aliyah": 5, "heb": "עַל־כֵּ֛ן אָנֹכִ֥י מְצַוְּךָ֖ לֵאמֹ֑ר שָׁלֹ֥שׁ עָרִ֖ים תַּבְדִּ֥יל לָֽךְ׃", "onk": "עַל כֵּן אֲנָא מְפַקְּדָךְ לְמֵימָר תְּלַת קִרְוִין תַּפְרֵשׁ לָךְ:", "onk_en": "Therefore am I commanding you the following: three cities shall you separate for yourself.", "pj": "בְּגִין כֵּן אֲנָא מְפַקֵּיד לְכוֹן יוֹמָא דֵין תְּלַת קִירְוִין תִּפְרְשׁוּן לְכוֹן", "pj_en": "Therefore I command you today that you set apart for you three cities.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 8, "aliyah": 5, "heb": "וְאִם־יַרְחִ֞יב יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ אֶת־גְּבֻ֣לְךָ֔ כַּאֲשֶׁ֥ר נִשְׁבַּ֖ע לַאֲבֹתֶ֑יךָ וְנָ֤תַן לְךָ֙ אֶת־כׇּל־הָאָ֔רֶץ אֲשֶׁ֥ר דִּבֶּ֖ר לָתֵ֥ת לַאֲבֹתֶֽיךָ׃", "onk": "וְאִם יַפְתֵּי יְיָ אֱלָהָךְ יָת תְּחוּמָךְ כְּמָא דִי קַיִּים לַאֲבָהָתָךְ וְיִתֶּן לָךְ יָת כָּל אַרְעָא דִּי מַלִּיל לְמִתַּן לַאֲבָהָתָךְ:", "onk_en": "And when Adonoy, your God, expands your boundary, in accordance with His oath to your forefathers, and He give you the entire land that He promised to give to your forefathers,", "pj": "וְאִין יַפְתֵּי יְיָ אֱלָהָכוֹן יַת תְּחוּמְכוֹן הֵיכְמָא דְקַיֵּים לְאַבְהַתְכוֹן וְיִתֵּן לְכוֹן יַת כָּל אַרְעָא דְקַיֵּים לְמִתַּן לְאַבְהַתְכוֹן", "pj_en": "And if the Lord your God enlarge your border, as He hath sworn to your fathers, and give you all the land which He Hath sworn to your fathers to give,", "tj": "", "tj_en": "", "rashi": "<b>ואם ירחיב … כאשר נשבע.<\/b> לָתֵת לְךָ אֶרֶץ קֵינִי וּקְנִזִּי וְקַדְמוֹנִי:", "rashi_en": "ואם ירחיב … כאשר נשבע AND IF [THE LORD THY GOD] ENLARGE [THY TERRITORY], AS HE HATH SWORN [UNTO THY FATHERS] to give thee the land of the Kenite, the Kenizzite and the Kadmonite (Sifrei Devarim 184:3)."}, {"ch": 19, "v": 9, "aliyah": 5, "heb": "כִּֽי־תִשְׁמֹר֩ אֶת־כׇּל־הַמִּצְוָ֨ה הַזֹּ֜את לַעֲשֹׂתָ֗הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּךָ֮ הַיּוֹם֒ לְאַהֲבָ֞ה אֶת־יְהֹוָ֧ה אֱלֹהֶ֛יךָ וְלָלֶ֥כֶת בִּדְרָכָ֖יו כׇּל־הַיָּמִ֑ים וְיָסַפְתָּ֨ לְךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַשָּׁלֹ֥שׁ הָאֵֽלֶּה׃", "onk": "אֲרֵי תִטַּר יָת כָּל תַּפְקֶדְתָּא הָדָא לְמֶעְבְּדַהּ דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין לְמִרְחַם יָת יְיָ אֱלָהָךְ וְלִמְהַךְ בְּאָרְחָן <b>דְּתַקְּנָן קֳדָמוֹהִי<\/b> כָּל יוֹמַיָּא וְתוֹסֵף לָךְ עוֹד תְּלַת קִרְוִין עַל תְּלַת אִלֵּין:", "onk_en": "When you will be guarding this entire <i>mitzvah<\/i> to fulfill it, that I am commanding you today, to love Adonoy, your God, and to go in His ways [<b>that are proper before Him<\/b>] for all time; then you shall add three more cities to these three.", "pj": "אֲרוּם תִּנְטְרוּן יַת כָּל תַּפְקֵידְתָּא הֲדָא לְמֶעֱבְדָהּ דַּאֲנָא מְפַקְדְּכוֹן יוֹמָא דֵין לְמִרְחַם יַת יְיָ אֱלָהָכוֹן וְלִמְהַךְ בְּאָרְחַן דְּתַקְנָן קֳדָמוֹי כָּל יוֹמַיָא וְתוֹסְפוּן לְכוֹן תּוּב תְּלַת קִירְוִין עַל תְּלַת אִילֵין", "pj_en": "then shall you keep all this commandment which today I command you to do, that thou mayest love the Lord thy God, and walk in the ways which are right before Him all days; and you shall add yet three cities to those three;", "tj": "", "tj_en": "", "rashi": "<b>ויספת לך עוד שלש.<\/b> הֲרֵי תֵשַׁע, שָׁלוֹשׁ שֶׁבְּעֵבֶר הַיַּרְדֵּן וְשָׁלוֹשׁ שֶׁבְּאֶרֶץ כְּנַעַן וְשָׁלוֹשׁ לֶעָתִיד לָבֹא (ספרי):", "rashi_en": "ויספת לך עוד שלש THEN THOU SHALT ADD THREE [CITIES] MORE FOR THEE — Thus you have nine altogether: the three on the east side of the Jordan, the three in the land of Canaan and three more in the future to come when God will enlarge thy territory (Sifrei Devarim 185:1)."}, {"ch": 19, "v": 10, "aliyah": 5, "heb": "וְלֹ֤א יִשָּׁפֵךְ֙ דָּ֣ם נָקִ֔י בְּקֶ֣רֶב אַרְצְךָ֔ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ נַחֲלָ֑ה וְהָיָ֥ה עָלֶ֖יךָ דָּמִֽים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלָא יִשְׁתְּפֵךְ דָּם זַכַּי בְּגוֹ אַרְעָךְ דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא וִיהֵי עֲלָךְ <b>חוֹבַת דִּין דִּקְטוֹל<\/b>:", "onk_en": "And let innocent blood not be shed within your land that Adonoy, your God, is giving you as territory, [otherwise] you will bear liability for the blood [<b>the judgment of a death sentence<\/b>].", "pj": "וְלָא יִתְשַׁד אֲדַם זַכַּאי בְּאַרְעֲכוֹן דַּיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן אַחְסָנָא וִיהֵי עֲלֵיכוֹן חוֹבַת דִּין קָטוֹלָא", "pj_en": "that innocent blood may not be shed in your land which the Lord your God giveth you to inherit, and the guilt of the judgment of death may not be upon you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 11, "aliyah": 5, "heb": "וְכִֽי־יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְרֵעֵ֔הוּ וְאָ֤רַב לוֹ֙ וְקָ֣ם עָלָ֔יו וְהִכָּ֥הוּ נֶ֖פֶשׁ וָמֵ֑ת וְנָ֕ס אֶל־אַחַ֖ת הֶעָרִ֥ים הָאֵֽל׃", "onk": "וַאֲרֵי יְהֵי גְבַר סָנֵי לְחַבְרֵיהּ וְיִכְמַן לֵיהּ וִיקוּם עֲלוֹהִי וְיִמְחִנֵּיהּ נְפַשׁ וִימוּת וְיֵעִרוֹק לַחֲדָא מִן קִרְוַיָּא הָאִלֵּין:", "onk_en": "If there is a man who hates his neighbor, and will ambush him, arising against him and smiting him dead, and he will flee to one of these cities;", "pj": "וַאֲרוּם יְהֵי גְּבַר סָנֵי לְחַבְרֵיהּ וְיִכְמוֹן עֲלֵיהּ בְּטוּמְרָא וִיקוּם עֲלוֹי וְיִקְטְלִינֵיהּ נְפָשׁ וִימוּת וְיַעֲרוֹק לַחֲדָא מִן קִרְוַיָא הָאִלֵּין", "pj_en": "But if a man with enmity against his neighbour shall lay wait for him in secret, to destroy his life, and he die, then should he flee into one of those cities,", "tj": "", "tj_en": "", "rashi": "<b>וכי יהיה איש שנא לרעהו.<\/b> עַל יְדֵי שִׂנְאָתוֹ הוּא בָא לִידֵי <b>וארב לו<\/b>, מִכָּאן אָמְרוּ עָבַר אָדָם עַל מִצְוָה קַלָּה, סוֹפוֹ לַעֲבֹר עַל מִצְוָה חֲמוּרָה, לְפִי שֶׁעָבַר עַל לֹא תִשְׂנָא (ויקרא י\"ט), סוֹפוֹ לָבֹא לִידֵי שְׁפִיכוּת דָּמִים, לְכָךְ נֶאֱמַר \"וְכִי יִהְיֶה אִישׁ שֹׂנֵא לְרֵעֵהוּ וְגוֹ'\", שֶׁהָיָה לוֹ לִכְתֹּב וְכִי יָקוּם אִישׁ וְאָרַב לְרֵעֵהוּ וְהִכָּהוּ נָפֶשׁ (ספרי):", "rashi_en": "וכי יהיה איש שנא לרעהו BUT IF A MAN HATE HIS FELLOW [AND LIE IN WAIT FOR HIM] — It is through his hatred that he comes to such a point as to “lie in wait for him”. From here they (the Rabbis) derived their statement: If a man transgresses a light command he will in the end transgress a weighty command; — because he transgressed the command (Leviticus 19:17) “Thou shalt not hate thy brother in thine heart”, he will in the end come to such a point as to shed blood. It is for this reason that it is stated here, apparently redundantly, “but if a man hate his fellow [and lie in wait for him]”, for it ought to have written only: “But if a man rise up and lie in wait for his fellow and smite him mortally” (Sifrei Devarim 186:2)."}, {"ch": 19, "v": 12, "aliyah": 5, "heb": "וְשָֽׁלְחוּ֙ זִקְנֵ֣י עִיר֔וֹ וְלָקְח֥וּ אֹת֖וֹ מִשָּׁ֑ם וְנָתְנ֣וּ אֹת֗וֹ בְּיַ֛ד גֹּאֵ֥ל הַדָּ֖ם וָמֵֽת׃", "onk": "וִישַׁלְּחוּן סָבֵי קַרְתֵּיהּ וְיִדְבְּרוּן יָתֵיהּ מִתַּמָּן וְיִתְּנוּן יָתֵיהּ בְּיַד גָּאֵל דְּמָא וִימוּת:", "onk_en": "The elders of his city will send for and take him from there, and will hand him over to the blood-redeemer, and he will be executed.", "pj": "וִישַׁדְרוּן חַכִּימִין קַרְתֵּיהּ וִידַבְּרוּן יָתֵיהּ מִתַּמָּן וְיִמְסְרוּן יָתֵיהּ בְּיַד תְּבַע אַדְמָא וְיִתְקְטֵל", "pj_en": "the sages of his cities shall send and take him thence, and give him up into the hand of the pursuer for blood, and he shall be put to death.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 13, "aliyah": 5, "heb": "לֹא־תָח֥וֹס עֵֽינְךָ֖ עָלָ֑יו וּבִֽעַרְתָּ֧ דַֽם־הַנָּקִ֛י מִיִּשְׂרָאֵ֖ל וְט֥וֹב לָֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תְחוּס עֵינָךְ עֲלוֹהִי וּתְפַלֵּי אַשְׁדִּי דָם זַכַּי מִיִּשְׂרָאֵל וְיֵיטַב לָךְ:", "onk_en": "Do not view him with compassion. You are to eliminate the [shedding of] innocent blood from Yisroel, and you will have it good.", "pj": "לָא תֵיחוּס עֵינֵיכוֹן עֲלוֹי וּתְפַלּוּן שַׁדְיֵי דַם זַכַּאי מִיִּשְרָאֵל וְיֵיטִיב לְכוֹן", "pj_en": "Your eye shall not spare him, but you shall put away shedders of innocent blood from Israel, that it may be well with you.", "tj": "", "tj_en": "", "rashi": "<b>לא תחוס עינך.<\/b> שֶׁלֹּא תֹאמַר הָרִאשׁוֹן כְּבָר נֶהֱרַג, לָמָּה אָנוּ הוֹרְגִים אֶת זֶה וְנִמְצְאוּ שְׁנֵי יִשְׂרְאֵלִים הֲרוּגִים? (שם):", "rashi_en": "לא תחוס עינך THINE EYE SHALL NOT PITY [HIM] — i.e. that thou shall not say, The first (the one) person has already been killed, why should we kill this also, so that two Israelites will be killed? (Sifrei Devarim 187:7)."}, {"ch": 19, "v": 14, "aliyah": 6, "heb": "לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּנַחֲלָֽתְךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּאָ֕רֶץ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ לְרִשְׁתָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תַשְׁנֵי תְּחוּמָא דְחַבְרָךְ דִּי <b>תְחִימוּ<\/b> קַדְמָאֵי בְּאַחֲסַנְתָּךְ דִּי תַחְסֵן בְּאַרְעָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ לְמֵירְתַהּ:", "onk_en": "Do not move back the boundary of your neighbor that the first [settlers] determine [<b>bounded<\/b>] in your territory that you will inherit in the land that Adonoy, your God, is giving you to inherit.", "pj": "לָא תְשַׁנּוּן תְּחוּם חֲבֵירֵיכוֹן דְּאִתְחִימוּ קַמָּאֵי בְּאַחְסַנְתְּכוֹן דְּתַחְסְנוּן בְּאַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן לְמֵירְתָהּ", "pj_en": "You shall not remove the boundary mark of your neighbours which the predecessors did set for the limit in your possession of inheritance in the land which the Lord your God giveth you to inherit.", "tj": "", "tj_en": "", "rashi": "<b>לא תסיג גבול.<\/b> לְשׁוֹן \"נָסֹגוּ אָחוֹר\" (ישעיהו מ\"ב), שֶׁמַּחֲזִיר סִימַן חֲלֻקַּת הַקַּרְקַע לְאָחוֹר לְתוֹךְ שְׂדֵה חֲבֵרוֹ לְמַעַן הַרְחִיב אֶת שֶׁלּוֹ; וַהֲלֹא כְבָר נֶאֱמַר \"לֹא תִגְזֹל\" (ויקרא י\"ט), מַה תַּלְמוּד לוֹמַר לֹא תַסִּיג? לִמֵּד עַל הָעוֹקֵר תְּחוּם חֲבֵרוֹ שֶׁעוֹבֵר בִּשְׁנֵי לָאוִין. יָכוֹל אַף בְּחוּץ לָאָרֶץ? תַּ\"לֹ <b>בנחלתך אשר תנחל וגו'<\/b>, בְּאֶרֶץ יִשְׂרָאֵל עוֹבֵר בִּשְׁנֵי לָאוִין, וּבְחוּצָה לָאָרֶץ אֵינוֹ עוֹבֵר אֶלָּא מִשּׁוּם לֹא תִגְזֹל (ספרי):", "rashi_en": "לא תסיג גבול THOU SHALT NOT REMOVE [THY FELLOW-MAN’S] LANDMARK — תסיג is of the same meaning as (Isaiah 42:17) “they are turned back (נסגו אחור)”. The meaning is, that one moves the mark that shows the division of the land (i.e. the division between two adjoining fields) backwards into the field of his neighbour in order thereby to enlarge his own. — But does it not already state. (Leviticus 19:13) “Thou shalt not rob”, why, then, is it also commanded “Thou shalt not remove the landmark”? It teaches that one who obliterates his neighbour’s border line transgresses two negative commands (לא תגזול and לא תסיג). One might think that this is the case also if one does so outside the Land of Israel! Scripture, however, states, “in thine inheritance which thou shalt inherit [in the land]”;— thus in the Land of Israel one who does this transgresses two negative commands, whilst outside the Land he transgresses only the command of לא תגזול (Sifrei Devarim 188:1-2)."}, {"ch": 19, "v": 15, "aliyah": 6, "heb": "לֹֽא־יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּאִ֗ישׁ לְכׇל־עָוֺן֙ וּלְכׇל־חַטָּ֔את בְּכׇל־חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל־פִּ֣י&thinsp;<b>׀<\/b> שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל־פִּ֥י שְׁלֹשָֽׁה־עֵדִ֖ים יָק֥וּם דָּבָֽר׃", "onk": "לָא יְקוּם סָהִיד חַד בִּגְבַר לְכָל עַוָּיָן וּלְכָל חוֹבִין בְּכָל חֵט דִּי יֶחְטָא עַל מֵימַר תְּרֵין סָהֲדִין אוֹ עַל מֵימַר תְּלָתָא סָהֲדִין יִתְקַיַּם פִּתְגָּמָא:", "onk_en": "One witness may not arise against a man about any sin or for any transgression or transgression that he transgresses; by the word of two witnesses or by the word of three witnesses let a matter be established.", "pj": "לָא יִתְקַיֵּים סַהֲדוּ דְּחַד בִּגְבַר לְכָל סָרְחָן נְפָשׁ וּלְכָל חוֹב מָמוֹן וּלְכָל חֵט דְּיֶחֱטֵי בְּרַם עַל מֵימְרָא דַיְיָ לְמִתְפַּרְעָא עַל טוּמְרַיָא עַל מַיָא סָהִיד חָד יוֹמֵי לְמִכְפּוֹר יַת מַה דְּמַסְהִיד עֲלוֹי וְעַל מֵימַר תְּרֵין סַהֲדִין אוֹ תְּלָתָא סַהֲדִין יִתְקַיֵּים פִּתְגָּמָא", "pj_en": "The testimony of one (witness) shall not be valid against a man for any crime (regarding the taking) of life, or guilt concerning money, or any sin with which one may be charged with sinning; but, by the Word of the Lord, (to insure) retribution upon secret crimes, (while) one witness may swear to deny what hath been attested against him, the sentence shall be confirmed upon the mouth of two witnesses, or of three.", "tj": "", "tj_en": "", "rashi": "<b>עד אחד.<\/b> זֶה בָנָה אָב – כָּל עֵד שֶׁבַּתּוֹרָה שְׁנַיִם אֶלָּא אִם כֵּן פֵּרֵט לְךָ בוֹ אֶחָד (סנהדרין ל'):<br><br><b>לכל עון ולכל חטאת.<\/b> לִהְיוֹת חֲבֵרוֹ נֶעֱנָשׁ עַל עֵדוּתוֹ, לֹא עֹנֶשׁ גּוּף וְלֹא עֹנֶשׁ מָמוֹן, אֲבָל קָם הוּא לִשְׁבוּעָה; אָמַר לַחֲבֵרוֹ תֵּן לִי מָנֶה שֶׁהִלְוִיתִיךָ, אָמַר לוֹ אֵין לְךָ בְיָדִי כְּלוּם וְעֵד אֶחָד מְעִידוֹ שֶׁיֵּשׁ לוֹ, חַיָּב לִשָּׁבַע לוֹ (שבועות מ'):<br><br><b>על פי שני עדים.<\/b> וְלֹא שֶׁיִּכְתְּבוּ עֵדוּתָם בְּאִגֶּרֶת וְיִשְׁלְחוּ לְבֵית דִּין, וְלֹא שֶׁיַּעֲמֹד תֻּרְגְּמָן בֵּין הָעֵדִים וּבֵין הַדַּיָּנִים (ספרי):", "rashi_en": "עד אחד ONE WITNESS [SHALL NOT RISE UP AGAINST A MAN FOR ANY INIQUITY] — This is the classic passage from which the general principle is derived that wherever the term “witness” (עד) occurs in the Torah, it means two witnesses, unless it specifically mentions in connection with it the word אחד (Sanhedrin 30a).<br><br>לכל עון ולכל חטאת [ONE WITNESS SHALL NOT RISE UP AGAINST A PERSON] FOR ANY INIQUITY OR ANY SIN — i.e. that his fellow man should be punished on account of his evidence either by bodily punishment or by a monetary punishment; but he may rise up against his fellow men to compel him to take an oath. If, for instance, one says to his fellow, “Return me the maneh which I lent you”, and he replies “I have nothing of yours in my possession”, and one witness testifies that he has, he (the defendant) must take an oath to satisfy him (Shevuot 40a; cf. Sifrei Devarim 188:9).<br><br>על פי שני עדים [AT THE MOUTH OF TWO WITNESSES ... SHALL THE MATTER BE ESTABLISHED] — at their mouth, but not that they may write their evidence down in a letter and send it to the court, nor that an interpreter stand between the witnesses and the judges (Sifrei Devarim 188:10)."}, {"ch": 19, "v": 16, "aliyah": 6, "heb": "כִּֽי־יָק֥וּם עֵד־חָמָ֖ס בְּאִ֑ישׁ לַעֲנ֥וֹת בּ֖וֹ סָרָֽה׃", "onk": "אֲרֵי יְקוּם סָהִיד שְׁקַר בִּגְבָר <b>לְאַסְהָדָא<\/b> בֵיהּ סַטְיָא:", "onk_en": "If false witnesses arise against a man and bear fallacious testimony [<b>with perversity<\/b>] against him;", "pj": "אֲרוּם יְקוּמוּן סַהֲדִין שִׁיקְרִין בְּבַר נַשׁ לְאַסְהָדָא בֵּיהּ סַטְיָא", "pj_en": "When false witnesses stand up against a man to testify wrong things against him,", "tj": "", "tj_en": "", "rashi": "<b>לענות בו סרה.<\/b> דָּבָר שֶׁאֵינוֹ, שֶׁהוּסַר הָעֵד הַזֶּה מִכָּל הָעֵדוּת הַזֹּאת. כֵּיצַד? שֶׁאָמְרוּ לָהֶם וַהֲלֹא עִמָּנוּ הֱיִיתֶם אוֹתוֹ הַיּוֹם בְּמָקוֹם פְּלוֹנִי (מכות ה'):", "rashi_en": "לענות בו סרה [IF A WITNESS FOR VIOLENCE RISE UP AGAINST A MAN] TO TESTIFY AGAINST HIM סרה — i.e. a thing which does not exist at all; this term is used because this witness is far removed (הוסר) from having anything to do with this testimony. How is this? (Give an example of such a case)?! That two other witnesses say, “But were you not with us on that day (when you say you saw the defendant committing this crime) in such and such a place (different from that where the alleged crime, according to you, has taken place)?!” (Makkot 5a)."}, {"ch": 19, "v": 17, "aliyah": 6, "heb": "וְעָמְד֧וּ שְׁנֵֽי־הָאֲנָשִׁ֛ים אֲשֶׁר־לָהֶ֥ם הָרִ֖יב לִפְנֵ֣י יְהֹוָ֑ה לִפְנֵ֤י הַכֹּֽהֲנִים֙ וְהַשֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר יִהְי֖וּ בַּיָּמִ֥ים הָהֵֽם׃", "onk": "וִיקוּמוּן תְּרֵין גֻּבְרִין דִּי לְהוֹן דִּינָא קֳדָם יְיָ קֳדָם כָּהֲנַיָּא וְדַיָּנַיָּא דִּי יְהוֹן בְּיוֹמַיָּא הָאִנּוּן:", "onk_en": "The two men shall stand, who are involved in the dispute, before Adonoy, before the <i>kohanim<\/i> and the judges who are in those days.", "pj": "וִיקוּמוּן תְּרֵין גּוּבְרִין דִּלְהוֹן תִּיגְרָא קֳדָם יְיָ קֳדָם כַּהֲנַיָא דַיָינַיָא דִיהוֹן בְּיוֹמַיָא הָאִינוּן", "pj_en": "then the two men between whom lies the subject of contention shall stand in the presence of the Lord, before the priests and judges who will be in those days:", "tj": "", "tj_en": "", "rashi": "<b>ועמדו שני האנשים.<\/b> בְּעֵדִים הַכָּתוּב מְדַבֵּר וְלִמֵּד שֶׁאֵין עֵדוּת בְּנָשִׁים, וְלִמֵּד שֶׁצְּרִיכִין לְהָעִיד עֵדוּתָן מֵעוֹמֵד (שבועות ל'):<br><br><b>אשר להם הריב.<\/b> אֵלּוּ בַעֲלֵי הַדִּין:<br><br><b>לפני ה'.<\/b> יִהְיֶה דּוֹמֶה לָהֶם כְּאִלּוּ עוֹמְדִין לִפְנֵי הַמָּקוֹם, שֶׁנֶּאֱמַר (תהילים פ\"ב) בְּקֶרֶב אֱלֹהִים יִשְׁפֹּט (סנהדרין ו'):<br><br><b>אשר יהיו בימים ההם.<\/b> יִפְתָּח בְּדוֹרוֹ כִּשְׁמוּאֵל בְּדוֹרוֹ, צָרִיךְ אַתָּה לִנְהֹג בּוֹ כָּבוֹד:", "rashi_en": "ועמדו שני האנשים THEN BOTH THE MEN ... SHALL STAND [BEFORE THE LORD] — Scripture here is referring to the witnesses, and teaches firstly that no evidence is valid when given by women, and teaches secondly that they (the witnesses) must submit their testimony while standing (Shevuot 30a; cf. Sifrei Devarim 190:1-3).<br><br>אשר להם הריב BETWEEN WHOM THE STRIFE IS — this refers to the contestants (Sanhedrin 19a).<br><br>'לפני ה BEFORE THE LORD — It should seem to them as though they are standing before the Omnipresent God, for it is said, (Psalms 82:1) “He (God) judges amongst the judges” (cf. Sifrei Devarim 190:5; Sanhedrin 6b).<br><br>אשר יהיו בימים ההם [AND THEY ... SHALL STAND BEFORE ... THE JUDGES] WHO SHALL BE IN THOSE DAYS — The apparently redundant words “who shall be in those days” suggest: Jephthah in his generation must be regarded as was Samuel in his generation: you must treat him with respect (Rosh Hashanah 25b; cf. Rashi on Deuteronomy 17:9 and Deuteronomy 26:3)."}, {"ch": 19, "v": 18, "aliyah": 6, "heb": "וְדָרְשׁ֥וּ הַשֹּׁפְטִ֖ים הֵיטֵ֑ב וְהִנֵּ֤ה עֵֽד־שֶׁ֙קֶר֙ הָעֵ֔ד שֶׁ֖קֶר עָנָ֥ה בְאָחִֽיו׃", "onk": "וְיִתְבְּעוּן דַּיָּנַיָּא יָאוּת וְהָא סָהִיד שְׁקַר סָהֲדָא שִׁקְרָא אַסְהַד בַּאֲחוֹהִי:", "onk_en": "When the judges shall investigate thoroughly and behold, the witness testified falsely, they testified falsely against their brother;", "pj": "וְיִתְבְּעוּן דַּיָינַיָא לְסַהֲדִין דְּמַזְמִין יַתְהוֹן טָבְאוּת וְהָא סַהֲדוּ דִשְׁקַר בְּפוּם סַהֲדִין שִׁיקְרָא אַסְהִידוּ בַּאֲחוּהוֹן", "pj_en": "and the judges shall question the witnesses of their times fairly; and, behold, false testimony is in the mouth of the witnesses; they have borne false witness against their brother.", "tj": "", "tj_en": "", "rashi": "<b>ודרשו השפטים היטב.<\/b> עַל פִּי הַמְזִמִּין אוֹתָם, שֶׁבּוֹדְקִים וְחוֹקְרִים אֶת הַבָּאִים לַהֲזִימָם בִּדְרִישָׁה וַחֲקִירָה:<br><br><b>והנה עד שקר העד.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר עֵד — בִּשְׁנַיִם הַכָּתוּב מְדַבֵּר:", "rashi_en": "ודרשו השפטים היטב AND THE JUDGES SHALL DILIGENTLY ENQUIRE concerning the statement of those who assert them (the first witnesses) to be “plotting witnesses”, in that they investigate and crossexamine those who assert them to be “plotting witnesses” by diligent enquiry and scrutiny.<br><br>והנה עד שקר העד AND, BEHOLD, IF THE WITNESS BE A FALSE WITNESS — Wherever עד is written, [except if the numeral אחד, “one” is added (cf. Rashi on v. 15)], Scripture is speaking of two witnesses (Sanhedrin 30a)."}, {"ch": 19, "v": 19, "aliyah": 6, "heb": "וַעֲשִׂ֣יתֶם ל֔וֹ כַּאֲשֶׁ֥ר זָמַ֖ם לַעֲשׂ֣וֹת לְאָחִ֑יו וּבִֽעַרְתָּ֥ הָרָ֖ע מִקִּרְבֶּֽךָ׃", "onk": "וְתַעְבְּדוּן לֵיהּ כְּמָא דִי חַשִּׁיב לְמֶעְבַּד לַאֲחוֹהִי וּתְפַלֵּי <b>עָבֵד<\/b> דְּבִישׁ מִבֵּינָךְ:", "onk_en": "You are to do to [each of] them as he conspired to do to his brother, and eliminate the evil [<b>doers<\/b>] from among you;", "pj": "וְתַעַבְדוּן לְהוֹן הֵיכְמָא דַחֲשִׁיבוּ לְמֶעֱבַד לַאֲחוּהוֹן וּתְפַלוּן עַבְדֵי דְבִישׁ מִבֵּינֵיכוֹן", "pj_en": "And so shall you do unto them as they had devised to do against their brother, and you shall put down the doers of evil from among you.", "tj": "", "tj_en": "", "rashi": "<b>כאשר זמם.<\/b> וְלֹא כַאֲשֶׁר עָשָׂה, מִכָּאן אָמְרוּ הָרְגוּ אֵין נֶהֱרָגִין (מכות ה'):<br><br><b>לעשות לאחיו.<\/b> מַה תַּלְמוּד לוֹמַר <b>לאחיו<\/b>? לִמֵּד עַל זוֹמְמֵי בַת כֹּהֵן נְשׂוּאָה שֶׁאֵינָן בִּשְׂרֵפָה אֶלָּא כְּמִיתַת הַבּוֹעֵל שֶׁהִיא בְחֶנֶק, שֶׁנֶּאֱמַר (ויקרא כ\"א) \"הִיא בָאֵשׁ תִּשָּׂרֵף\" – הִיא וְלֹא בוֹעֲלָהּ, לְכָךְ נֶאֱמַר כָּאן <b>לאחיו<\/b>, כַּאֲשֶׁר זָמַם לַעֲשׂוֹת לְאָחִיו, וְלֹא כַּאֲשֶׁר זָמַם לַעֲשׂוֹת לַאֲחוֹתוֹ, אֲבָל בְּכָל שְׁאָר מִיתוֹת הִשְׁוָה הַכָּתוּב אִשָּׁה לְאִישׁ וְזוֹמְמֵי אִשָּׁה נֶהֱרָגִין כְּזוֹמְמֵי אִישׁ, כְּגוֹן שֶׁהֱעִידוּהָ שֶׁהָרְגָה אֶת הַנֶּפֶשׁ, שֶׁחִלְּלָה אֶת הַשַּׁבָּת, נֶהֱרָגִין בְּמִיתָתָהּ, שֶׁלֹּא מִעֵט כָּאן אֲחוֹתוֹ אֶלָּא בְמָקוֹם שֶׁיֵּשׁ לְקַיֵּם בָּהֶן הֲזַמָּה כְּמִיתַת הַבּוֹעֵל (ספרי; סנהדרין צ'):", "rashi_en": "כאשר זמם [THEN SHALL YE DO UNTO HIM] AS HE HAD INTENDED TO HAVE DONE [UNTO HIS BROTHER] — as he had intended to do, but not as he has done! Hence they (the Rabbis) stated that if they (the false witnesses) have already killed (i.e. if by their evidence the defendant has already been executed) they are not put to death (Makkot 5b).<br><br>לעשות לאחיו [THEN SHALL YE DO UNTO HIM AS HE HAD INTENDED] TO HAVE DONE TO HIS BROTHER — What is the force of לאחיו? Would it not have sufficed to state כאשר זמם לעשות? But it teaches in regard to witnesses who have been proved to have “plotted” against a married daughter of a priest by an accusation of adultery, that they are not to be punished with burning (as would have been the punishment of the accused woman, if she had been found guilty), but with the death penalty to which the alleged adulterer would have been subject, which is strangulation. For it is said of such a woman, (Leviticus 21:9) “she shall be burnt to death” — ‘‘she”, but not her paramour (he is not burnt but strangled) — therefore it states here לאחיו, “unto his brother” — ‘‘[ye shall do unto him] as he had intended to have done to his brother” but not as he had intended to have done to his sister. This case, however, is an exception, but with regard to any other death penalties Scripture puts women on the same level with men, and consequently those who are proved to have “plotted” against a woman are made to suffer the same death penalty as those who are proved to have “plotted” against a man. For instance, they have testified against her that she killed a person, or that she desecrated the Sabbath, then they are made to suffer the death she would have suffered, for Scripture excludes here by the word אחיו the “plotting” witnesses from the death penalty of the sister (i.e. which the woman would have suffered) only because it is a case where the law regarding plotting witnesses can be applied to them by letting them suffer the death-penalty of the paramour (Sifrei Devarim 190:14; Sanhedrin 90a)."}, {"ch": 19, "v": 20, "aliyah": 6, "heb": "וְהַנִּשְׁאָרִ֖ים יִשְׁמְע֣וּ וְיִרָ֑אוּ וְלֹֽא־יֹסִ֨פוּ לַעֲשׂ֜וֹת ע֗וֹד כַּדָּבָ֥ר הָרָ֛ע הַזֶּ֖ה בְּקִרְבֶּֽךָ׃", "onk": "וּדְיִשְׁתָּאֲרוּן יִשְׁמְעוּן וְיִדְחֲלוּן וְלָא יוֹסְפוּן לְמֶעְבַּד עוֹד כְּפִתְגָּמָא בִישָׁא הָדֵין בֵּינָךְ:", "onk_en": "And the remainder will hear and be fearful, and they will not repeat this evil thing among you.", "pj": "וְרַשִׁיעַיָא דְמִשְׁתַּיְירִין יִשְׁמְעוּן וִידַחֲלוּן וְלָא יוֹסְפוּן לְמֶעֱבַד תּוּב כְּפִתְגָמָא בִּישָׁא הָדֵין בֵּינֵיכוֹן", "pj_en": "And the wicked who remain will hear and be afraid, and not add to repeat an evil thing like this among you.", "tj": "", "tj_en": "", "rashi": "<b>ישמעו ויראו.<\/b> מִכָּאן שֶׁצְּרִיכִין הַכְרָזָה – אִישׁ פְּלוֹנִי וּפְלוֹנִי נֶהֱרָגִין עַל שֶׁהוּזַמּוּ בְּבֵית דִּין (סנהדרין פ\"ט):", "rashi_en": "ישמעו ויראו [AND THOSE WHO REMAIN] SHALL HEAR AND FEAR — From here we derive the law that a public announcement is required: “The men named so-and-so are to be executed because they have been convicted by the court as “plotting witnesses” (Sanhedrin 89a)."}, {"ch": 19, "v": 21, "aliyah": 6, "heb": "וְלֹ֥א תָח֖וֹס עֵינֶ֑ךָ נֶ֣פֶשׁ בְּנֶ֗פֶשׁ עַ֤יִן בְּעַ֙יִן֙ שֵׁ֣ן בְּשֵׁ֔ן יָ֥ד בְּיָ֖ד רֶ֥גֶל בְּרָֽגֶל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְלָא תְחוּס עֵינָךְ נַפְשָׁא חֳלַף נַפְשָׁא עֵינָא חֳלַף עֵינָא שִׁנָּא חֳלַף שִׁנָּא יְדָא חֳלַף יְדָא רַגְלָא חֳלַף רַגְלָא:", "onk_en": "You are not to have compassion: life for life, eye for eye, tooth for tooth, hand for hand, foot for foot.", "pj": "וְלָא תֵיחוֹס עֵינֵיכוֹן נַפְשָׁא חֲלוּפֵי נַפְשָׁא דְמֵי עֵינָא חוּלַף עֵינָא דְמֵי שִׁינָא חוּלַף שִׁינָא דְמֵי יְדָא חוּלַף יְדָא דְמֵי רִיגְלָא חוּלַף רִיגְלָא", "pj_en": "Your eye shall not spare; life for life, the value of an eye for an eye, the value of a tooth for a tooth, the value of a hand for a hand, the value of a foot for a foot.", "tj": "", "tj_en": "", "rashi": "<b>עין בעין.<\/b> מָמוֹן, וְכֵן שֵׁן בְּשֵׁן וְגוֹ' (ספרי; בבא קמא פ\"ד):", "rashi_en": "עין בעין EYE FOR EYE — i.e. monetary compensation; similarly also “tooth for tooth” etc. (Sifrei Devarim 190:16; Bava Kamma 84a; cf. also Rashi on Exodus 21:24)."}, {"ch": 20, "v": 1, "aliyah": 6, "heb": "כִּֽי־תֵצֵ֨א לַמִּלְחָמָ֜ה עַל־אֹיְבֶ֗ךָ וְֽרָאִ֜יתָ ס֤וּס וָרֶ֙כֶב֙ עַ֚ם רַ֣ב מִמְּךָ֔ לֹ֥א תִירָ֖א מֵהֶ֑ם כִּֽי־יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ עִמָּ֔ךְ הַמַּֽעַלְךָ֖ מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "אֲרֵי תִפּוֹק <b>לַאֲגָחָא<\/b> <b>קְרָבָא<\/b> עַל בַּעֲלֵי דְבָבָךְ וְתֶחֱזֵי סוּסָוָן וּרְתִכִּין עַם סַגִּי מִנָּךְ לָא תִדְחַל מִנְּהוֹן אֲרֵי יְיָ אֱלָהָךְ <b>מֵימְרֵיהּ בְּסַעְדָּךְ<\/b> דְּאַסְּקָךְ מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "When you go to [<b>wage<\/b>] war against your enemy, and you see horse and chariot, people who outnumber you; do not be afraid of them, for [<b>the word of<\/b>] Adonoy, your God, is with you [<b>will aid you<\/b>], He Who brought you up from the land of Egypt.", "pj": "אֲרוּם תִּפְקוּן לְסִדְרֵי קְרָבָא עַל בַּעֲלֵי דְבָבֵיכוֹן וְתֵיחְמוּן סוּסְוָן וְאַרְתְּכִין עַמִּין גֵּיוְתָנִין וְטֵירוּנִין אַלִּימִין מִנְכוֹן לָא תִדַחֲלוּן מִנְהוֹן אֲרוּם כֻּלְהוֹן חֲשִׁיבִין כְּסוּסְיָא חַד וְכִרְתֵיכָא חַד קֳדָם יְיָ אֱלָהָכוֹן דְּמֵימְרֵיהּ בְּסַעַדְכוֹן דְּאַפְקְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרָיִם", "pj_en": "When you go forth to battle against your enemies, and see horses and chariots, and peoples proud, overbearing, and stronger than you, fear them not; for all of them are accounted as a single horse and a single chariot before the Lord your God, whose Word will be your Helper; for He brought you free out of the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>כי תצא למלחמה.<\/b> סָמַךְ הַכָּתוּב יְצִיאַת מִלְחָמָה לְכָאן, לוֹמַר לְךָ שֶׁאֵין מְחֻסַּר אֵבֶר יוֹצֵא לַמִּלְחָמָה (עי' ספרי); דָּבָר אַחֵר, לוֹמַר לְךָ אִם עָשִׂיתָ מִשְׁפַּט צֶדֶק, אַתָּה מֻבְטָח שֶׁאִם תֵּצֵא לַמִּלְחָמָה אַתָּה נוֹצֵחַ, וְכֵן דָוִד הוּא אוֹמֵר (תהילים קי\"ט) עָשִׂיתִי מִשְׁפָּט וָצֶדֶק בַּל תַּנִּיחֵנִי לְעוֹשְׁקָי (תנחומא):<br><br><b>על איבך.<\/b> יִהְיוּ בְּעֵינֶיךָ כְּאוֹיְבִים, אַל תְּרַחֵם עֲלֵיהֶם כִּי לֹא יְרַחֲמוּ עָלֶיךָ:<br><br><b>סוס ורכב.<\/b> בְּעֵינַי כֻּלָּם כְּסוּס אֶחָד, וְכֵן הוּא אוֹמֵר (שופטים ו') וְהִכִּיתָ אֶת מִדְיָן כְּאִישׁ אֶחָד, וְכֵן הוּא אוֹמֵר (שמות ט\"ו) כִּי בָא סוּס פַּרְעֹה (עי' ספרי):<br><br><b>עם רב ממך.<\/b> בְּעֵינֶיךָ הוּא רַב, אֲבָל בְּעֵינַי אֵינוֹ רַב (שם):", "rashi_en": "כי תצא למלחמה WHEN THOU GOEST OUT TO WAR — Scripture places the going out to war in juxtaposition to this section here (to עין בעין וכו׳) in order to tell you that no person lacking a limb goes out to war (cf. Sifrei Devarim 190:17). Another explanation of why these two sections are put in juxtaposition to each other: it is to tell you that if you execute just judgment you may be confident that if you go to war you will be victorious. Similarly does David say, (Psalms 119:121) “I have done judgement and justice; Thou wilt not leave me to my oppressors” (Midrash Tanchuma, Shoftim 15).<br><br>על איבך AGAINST THINE ENEMIES — Let them be in thine eyes as enemies: have no pity upon them, for they will have no pity upon thee (Midrash Tanchuma, Shoftim 15).<br><br>סוס ורכב [WHEN THOU GOEST TO WAR ... AND SEEST] HORSES AND CHARIOTS (lit., horse and chariot) — in Mine eyes they are all as only one horse (i.e. they do not count). Similarly it states, (Judges 6:16) “[Surely “I” will be with thee,] and thou shalt smite the Midianites as one man”. And similarly it states, (Exodus 15:19) “For the horse (not the horses) of Pharaoh came [into the sea]” (Midrash Tanchuma, Shoftim 16; cf. Sifrei Devarim 190:21).<br><br>עם רב ממך [WHEN THOU GOEST OUT TO WAR … AND SEEST] PEOPLE MORE THAN THOU (or, as it may be translated: PEOPLE, NUMEROUS FROM THY POINT OF VIEW) — in thine eyes they may appear to be numerous but in Mine eyes they are not numerous (Midrash Tanchuma, Shoftim 16)."}, {"ch": 20, "v": 2, "aliyah": 6, "heb": "וְהָיָ֕ה כְּקָֽרׇבְכֶ֖ם אֶל־הַמִּלְחָמָ֑ה וְנִגַּ֥שׁ הַכֹּהֵ֖ן וְדִבֶּ֥ר אֶל־הָעָֽם׃", "onk": "וִיהֵי כְּמִקְרָבְכוֹן <b>לַאֲגָחָא קְרָבָא<\/b> וְיִתְקְרִיב כַּהֲנָא וִימַלֵּל עִם עַמָּא:", "onk_en": "Now, as you [<b>come<\/b>] near the battle [<b>to wage war<\/b>], the <i>kohein<\/i> shall approach and speak to the people.", "pj": "וִיהֵי בִּזְמַן דְּאַתּוּן קָרֵיבִין לְאַגָּחָא קְרָבָא וְיִתְקָרֵב כַּהֲנָא וִימַלֵּל עִם עַמָּא", "pj_en": "And at the time that you draw nigh to do battle, the priest shall approach and speak with the people,", "tj": "", "tj_en": "", "rashi": "<b>כקרבכם אל המלחמה.<\/b> סָמוּךְ לְצֵאתְכֶם מִן הַסְּפָר – מִגְּבוּל אַרְצְכֶם:<br><br><b>ונגש הכהן.<\/b> הַמָּשׁוּחַ לְכָךְ, וְהוּא הַנִּקְרָא \"מְשׁוּחַ מִלְחָמָה\":<br><br><b>ודבר אל העם.<\/b> בִּלְשׁוֹן הַקֹּדֶשׁ (סוטה מ\"ב):", "rashi_en": "כקרבכם אל המלחמה [IT SHALL BE] WHEN YE COME NIGH UNTO THE BATTLE, [THAT THE PRIEST … SHALL SPEAK] — i.e. when ye are on the point of leaving the ספר — the boundary of your land (Sifrei Devarim 191).<br><br>ונגש הכהן AND “THE” PRIEST SHALL STEP NIGH [AND SPEAK] “the” priest means, he who has been anointed for that purpose; it is the one who is termed in the Talmud משוח מלחמה, “the priest anointed for war” (Sotah 42a).<br><br>ודבר אל העם AND HE SHALL SPEAK UNTO THE PEOPLE — in the Holy Language (Sotah 42a)."}, {"ch": 20, "v": 3, "aliyah": 6, "heb": "וְאָמַ֤ר אֲלֵהֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַיּ֛וֹם לַמִּלְחָמָ֖ה עַל־אֹיְבֵיכֶ֑ם אַל־יֵרַ֣ךְ לְבַבְכֶ֗ם אַל־תִּֽירְא֧וּ וְאַֽל־תַּחְפְּז֛וּ וְאַל־תַּֽעַרְצ֖וּ מִפְּנֵיהֶֽם׃", "onk": "וְיֵימַר לְהוֹן שְׁמַע יִשְׂרָאֵל אַתּוּן קְרִיבִין יוֹמָא דֵין <b>לַאֲגָחָא קְרָבָא<\/b> עַל בַּעֲלֵי דְבָבֵיכוֹן לָא יְזוּעַ לִבְּכוֹן לָא תִדְחֲלוּן וְלָא תְתְבַּהֲתוּן וְלָא <b>תִתָּבְרוּן<\/b> מִקֳּדָמֵיהוֹן:", "onk_en": "He will say to them, ‘‘Hear, Yisroel! You are setting out today to battle [<b>to wage war<\/b>] against your enemies. Do not be faint hearted; or intimidated and do not panic, and do not be crushed [<b>broken<\/b>] before them;", "pj": "וְיֵימַר לְהוֹן שְׁמָעוּ יִשְרָאֵל אַתּוּן מִתְקַרְבִין יוֹמָא דֵין לְסִדְרֵי קְרָבָא עַל בַּעֲלֵי דְבָבֵיכוֹן לָא יְזוּחַ לִבְּכוֹן לָא תְדַחֲלוּן וְלָא תִרְתְּחוּן וְלָא תִתְרְעוּן מִן קֳדָמֵיהוֹן", "pj_en": "and say to them, Hear, Israel, you draw near this day to fight against your adversaries; let not your heart be moved, be not afraid, tremble not, nor be broken down before them:", "tj": "", "tj_en": "", "rashi": "<b>שמע ישראל.<\/b> אֲפִלּוּ אֵין בָּכֶם זְכוּת אֶלָּא קְרִיאַת שְׁמַע בִּלְבַד, כְּדַאי אַתֶּם שֶׁיּוֹשִׁיעַ אֶתְכֶם:<br><br><b>על איביכם.<\/b> אֵין אֵלּוּ אַחֵיכֶם, שֶׁאִם תִּפְּלוּ בְיָדָם אֵינָם מְרַחֲמִים עֲלֵיכֶם, אֵין זוֹ כְּמִלְחֶמֶת יְהוּדָה עִם יִשְׂרָאֵל שֶׁנֶּאֱמַר (דברי הימים ב' כ\"ח ט\"ו) \"וַיָּקֻמוּ הָאֲנָשִׁים אֲשֶׁר נִקְּבוּ בְשֵׁמוֹת וַיַּחֲזִיקוּ בַשִּׁבְיָה וְכָל מַעֲרֻמֵּיהֶם הִלְבִּישׁוּ מִן הַשָּׁלָל וַיַּלְבִּישׁוּם וַיַּנְעִילוּם וַיַּאֲכִילוּם וַיַּשְׁקוּם וַיְסֻכוּם וַיְנַהֲלוּם בַּחֲמֹרִים לְכָל כּוֹשֵׁל וַיְבִיאוּם יְרֵחוֹ עִיר הַתְּמָרִים אֵצֶל אֲחֵיהֶם וַיָּשׁוּבוּ שֹׁמְרוֹן\", אֶלָּא עַל אוֹיְבֵיכֶם אַתֶּם הוֹלְכִים, לְפִיכָךְ הִתְחַזְּקוּ לַמִּלְחָמָה (ספרי; סוטה מ\"ב):<br><br><b>אל ירך לבבכם אל תיראו ואל תחפזו ואל תערצו.<\/b> אַרְבַּע אַזְהָרוֹת כְּנֶגֶד אַרְבָּעָה דְבָרִים שֶׁמַּלְכֵי הָאֻמּוֹת עוֹשִׂים, מְגִיפִין בִּתְרִיסֵיהֶם כְּדֵי לְהַקִּישָׁן זֶה לָזֶה כְּדֵי לְהַשְׁמִיעַ קוֹל שֶׁיַּחְפְּזוּ אֵלּוּ שֶׁכְּנֶגְדָן וְיָנוּסוּ, וְרוֹמְסִים בְּסוּסֵיהֶם וּמַצְהִילִין אוֹתָם לְהַשְׁמִיעַ קוֹל שַׁעֲטַת פַּרְסוֹת סוּסֵיהֶם, וְצוֹוְחִין בְּקוֹלָם, וְתוֹקְעִין בַּשּׁוֹפָרוֹת וּמִינֵי מַשְׁמִיעֵי קוֹל:<br><br><b>אל ירך לבבכם.<\/b> מִצַּהֲלַת סוּסִים:<br><br><b>אל תיראו.<\/b> מֵהֲגָפַת הַתְּרִיסִין:<br><br><b>ואל תחפזו.<\/b> מִקּוֹל הַקְּרָנוֹת:<br><br><b>ואל תערצו.<\/b> מִקּוֹל הַצְּוָחָה (שם):", "rashi_en": "שמע ישראל [AND HE SHALL SAY UNTO THEM] HEAR O ISRAEL — Even though you have no other merit than the fulfilment of the command of “Reading the Shema” you would deserve that He should help you (Sotah 42a).<br><br>על איבכם [YE APPROACH THIS DAY UNTO WAR] AGAINST YOUR ENEMIES — By these apparently redundant words the priest says, as it were: Remember that these are not your brethren, and if you will fall into their hands they will have no pity on you; — it is not like the war of Judah against Israel of which it states, (II Chronicles 28:15) “And the men which were expressed by name rose up, and took the captives, and with the spoil clothed all that were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them upon asses, and brought them to Jericho, the city of the palm trees, to their brethren: they returned to Samaria” — it is your enemies against whom you march, therefore show yourselves strong for the battle (Sifrei Devarim 192:2; Sotah 42a).<br><br>אל ירך לבבכם אל תיראו ואל תחפזו ואל תערצו LET NOT YOUR HEARTS FAINT; FEAR NOT, AND HURRY NOT PRECIPITATELY, NEITHER BE TERRIFIED BECAUSE OF THEM — These are four admonitions corresponding to four things which the kings of the nations do in battle: they bring their shields close together in order to strike them one against the other and thereby make a loud noise so that their opponents should flee precipitately; they trample the ground heavily with their horses — and make them neigh — in order to make a noise through the beating of their horses’ hoofs; they themselves shout aloud and blow trumpets and other noisy instruments.<br><br>אל ירך לבבכם LET NOT YOUR HEARTS FAINT — through the neighing of the horses,<br><br>אל תיראו FEAR NOT from the noise made by the clashing of the shields,<br><br>ואל תחפזו AND HURRY NOT PRECIPITATELY at the sounds of the trumpets,<br><br>ואל תערצו NEITHER BE TERRIFIED by the noise of the shouting (Sifrei Devarim 192:3; Sotah 42)."}, {"ch": 20, "v": 4, "aliyah": 6, "heb": "כִּ֚י יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם הַהֹלֵ֖ךְ עִמָּכֶ֑ם לְהִלָּחֵ֥ם לָכֶ֛ם עִם־אֹיְבֵיכֶ֖ם לְהוֹשִׁ֥יעַ אֶתְכֶֽם׃", "onk": "אֲרֵי יְיָ אֱלָהֲכוֹן דִּמְדַבַּר <b>קֳדָמֵיכוֹן לַאֲגָחָא<\/b> לְכוֹן <b>קְרָב<\/b> עִם בַּעֲלֵי דְבָבֵיכוֹן לְמִפְרַק יָתְכוֹן:", "onk_en": "Because Adonoy, your God, marches with you [<b>before you<\/b>] to do battle [<b>wage war<\/b>] for you with your enemies to save you.’’", "pj": "אֲרוּם יְיָ אֱלָהָכוֹן שְׁכִינְתֵּיהּ מַדְבָּרָא קֳדָמֵיכוֹן לְאַגָחָא מְטוּלְכוֹן עִם בַּעֲלֵי דְבָבֵיכוֹן לְמִפְרוֹק יַתְכוֹן", "pj_en": "for the Shekinah of the Lord your God goeth before you to fight for you against your enemies, and to save you.", "tj": "", "tj_en": "", "rashi": "<b>כי ה' אלהיכם וגו'.<\/b> הֵם בָּאִים בְּנִצְחוֹנוֹ שֶׁל בָּשָׂר וָדָם וְאַתֶּם בָּאִים בְּנִצְחוֹנוֹ שֶׁל מָקוֹם. פְּלִשְׁתִּים בָּאוּ בְנִצְחוֹנוֹ שֶׁל גָּלְיָת, מֶה הָיָה סוֹפוֹ? נָפַל וְנָפְלוּ עִמּוֹ:<br><br><b>ההלך עמכם.<\/b> זֶה מַחֲנֵה הָאָרוֹן (סוטה מ\"ב):", "rashi_en": "כי ה׳ אלהיכם וגו׳ FOR THE LORD YOUR GOD [IS HE WHO GOETH WITH YOU] — They come to war relying on the conquering strength of human beings (lit., flesh and blood) but you come relying on the strength of the Omnipresent God! The Philistines once came to war relying on the strength of Goliath — what was his end? He fell and they fell with him (Sotah 42a).<br><br>ההלך עמכם [FOR THE LORD THY GOD] GOETH WITH THEE — this refers to the camp of the Holy Ark (the camp that has the Holy Ark in its midst, i.e. the camp of the Levites) (Sotah 42a)."}, {"ch": 20, "v": 5, "aliyah": 6, "heb": "וְדִבְּר֣וּ הַשֹּֽׁטְרִים֮ אֶל־הָעָ֣ם לֵאמֹר֒ מִֽי־הָאִ֞ישׁ אֲשֶׁ֨ר בָּנָ֤ה בַֽיִת־חָדָשׁ֙ וְלֹ֣א חֲנָכ֔וֹ יֵלֵ֖ךְ וְיָשֹׁ֣ב לְבֵית֑וֹ פֶּן־יָמוּת֙ בַּמִּלְחָמָ֔ה וְאִ֥ישׁ אַחֵ֖ר יַחְנְכֶֽנּוּ׃", "onk": "וִימַלְּלוּן סָרְכַיָּא קֳדָם עַמָּא לְמֵימַר מָן גַּבְרָא דִּי בְנָא בֵיתָא חַדְתָּא וְלָא חָנְכֵיהּ יְהַךְ וִיתוּב לְבֵיתֵיהּ דִּילְמָא יְמוּת <b>בַּאֲגָחָא קְרָבָא<\/b> וּגְבַר אָחֳרָן יַחְנְכִנֵּיהּ:", "onk_en": "The officers will address the people as follows, ‘‘Whichever man has built a new house and did not inaugurate it as a dwelling, let him go and return home lest he die in battle [<b>while waging war<\/b>] and another man will inaugurate it.", "pj": "וִימַלְלוּן סַרְכַיָא עִם עַמָּא לְמֵימָר מַאן גַּבְרָא דִי בְנָא בֵיתָא חַדְתָּא וְלָא קָבַע בֵּיהּ מְזוּזְתָּא לְשַׁכְלָלוּתֵהּ יְהַךְ וִיתוּב לְבֵיתֵיהּ דִּלְמָא יִגְרוֹם לֵיהּ חוֹבָא וְיִתְקְטֵיל בִּקְרָבָא וּגְבַר חוֹרַן יְשַׁכְלְלִינֵיהּ", "pj_en": "And the officers shall speak with the people, saying: Who is the man who hath builded a new house, and hath not set fast its door-posts to complete it? let him go and return to his house, lest through sin he be slain in the battle, and another man complete it.", "tj": "", "tj_en": "", "rashi": "<b>ולא חנכו.<\/b> וְלֹא דָּר בּוֹ, חִנּוּךְ לְשׁוֹן הַתְחָלָה:<br><br><b>ואיש אחר יחנכנו.<\/b> וְדָבָר שֶׁל עָגְמַת נֶפֶשׁ הוּא זֶה:", "rashi_en": "ולא חנכו [WHAT MAN IS THERE THAT HATH BUILT A NEW HOUSE] AND HATH NOT DEDICATED IT — i.e. has not yet dwelt in it. The term חנך denotes beginning a thing (here, it means beginning to live in it; cf. Rashi on Genesis 14:14).<br><br>ואיש אחר יחנכנו [LEST HE DIE IN THE WAR] AND ANOTHER MAN DEDICATE IT — which is a matter that causes grief of mind."}, {"ch": 20, "v": 6, "aliyah": 6, "heb": "וּמִֽי־הָאִ֞ישׁ אֲשֶׁר־נָטַ֥ע כֶּ֙רֶם֙ וְלֹ֣א חִלְּל֔וֹ יֵלֵ֖ךְ וְיָשֹׁ֣ב לְבֵית֑וֹ פֶּן־יָמוּת֙ בַּמִּלְחָמָ֔ה וְאִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽנּוּ׃", "onk": "וּמָן גַּבְרָא דִּי נְצִיב כַּרְמָא וְלָא אַחֲלֵיהּ יְהַךְ וִיתוּב לְבֵיתֵיהּ דִּילְמָא יְמוּת <b>בַּאֲגָחָא קְרָבָא<\/b> וּגְבַר אָחֳרָן יְחַלִּנֵּיהּ:", "onk_en": "And whichever man has planted a vineyard and did not redeem it[s fruit,] let him go and return home, lest he die in battle [<b>while waging war<\/b>] and another man redeem it.", "pj": "וּמַאן גַּבְרָא דִּי נְצַב כַּרְמָא וְלָא פַרְקֵיהּ מִן כַּהֲנָא וְאַחֲלֵיהּ יְהַךְ וִיתוּב לְבֵיתֵיהּ דִּלְמָא יִגְרוֹם לֵיהּ חוֹבָא דְלָא פָּרְקֵיהּ וְיִתְקְטֵיל בִּקְרָבָא וּגְבַר חוֹרַן יַחְלִינֵיהּ", "pj_en": "Or, what man hath planted a vineyard, and hath not redeemed it from the priest to make it common? let him go and return to his house, lest sin be the occasion of his not redeeming it, but he be slain in the battle, and another make it common.", "tj": "וְלָא יִפְרַג יָתֵיהּ:", "tj_en": "And hath not redeemed it", "rashi": "<b>ולא חללו.<\/b> לֹא פְּדָאוֹ בַשָּׁנָה הָרְבִיעִית, שֶׁהַפֵּרוֹת טְעוּנִין לְאָכְלָן בִּירוּשָׁלַיִם אוֹ לְחַלְּלָן בְּדָמִים וְלֶאֱכֹל הַדָּמִים בִּירוּשָׁלַיִם:", "rashi_en": "ולא חללו [AND WHAT MAN IS THERE THAT HATH PLANTED A VINEYARD] AND HATH YET NOT EATEN OF IT — לא חללו means, has not yet redeemed it in the fourth year of its growth, for the fruits had either to be eaten in Jerusalem or to be given a non-holy character (חולין), by exchanging them for money and the money’s worth to be consumed in Jerusalem (The phrase therefore means no more than: who hath not eaten of it)."}, {"ch": 20, "v": 7, "aliyah": 6, "heb": "וּמִֽי־הָאִ֞ישׁ אֲשֶׁר־אֵרַ֤שׂ אִשָּׁה֙ וְלֹ֣א לְקָחָ֔הּ יֵלֵ֖ךְ וְיָשֹׁ֣ב לְבֵית֑וֹ פֶּן־יָמוּת֙ בַּמִּלְחָמָ֔ה וְאִ֥ישׁ אַחֵ֖ר יִקָּחֶֽנָּה׃", "onk": "וּמָן גַּבְרָא דִּי אֵרַס אִתְּתָא וְלָא נָסְבַהּ יְהַךְ וִיתוּב לְבֵיתֵיהּ דִּילְמָא יְמוּת <b>בַּאֲגָחָא קְרָבָא<\/b> וּגְבַר אָחֳרָן יִסְּבִנַּהּ:", "onk_en": "And whichever man has betrothed a woman and not married her, let him go and return home, lest he die in battle [<b>while waging war<\/b>] and another man marry her.’’", "pj": "וּמַאן גַּבְרָא דְקָדִשׁ אִתְּתָא וְלָא נַסְבָהּ יְהַךְ וִיתוּב לְבֵיתֵיהּ דְּלָא יִגְרוֹם לֵיהּ חוֹבָא דְלָא חָדֵי בְּאִנְתְּתֵיהּ וְיִתְקְטֵיל בִּקְרָבָא וּגְבַר חוֹרַן יַסְבִינָהּ", "pj_en": "And what man hath betrothed a wife, but not taken her? let him go and return to his house, lest sin prevent him from rejoicing with his wife and he be slain in the battle, and another take her.", "tj": "", "tj_en": "", "rashi": "<b>פן ימות במלחמה.<\/b> יָשׁוּב פֶּן יָמוּת, שֶׁאִם לֹא יִשְׁמַע לְדִבְרֵי הַכֹּהֵן כְּדַאי הוּא שֶׁיָּמוּת (ספרי):", "rashi_en": "פן ימות במלחמה [LET HIM GO AND RETURN] LEST HE DIE IN THE WAR — The meaning is: let him return so that he not die, for if he will not hearken to the words of the priests he deserves death (Sifrei Devarim 194:5)."}, {"ch": 20, "v": 8, "aliyah": 6, "heb": "וְיָסְפ֣וּ הַשֹּׁטְרִים֮ לְדַבֵּ֣ר אֶל־הָעָם֒ וְאָמְר֗וּ מִי־הָאִ֤ישׁ הַיָּרֵא֙ וְרַ֣ךְ הַלֵּבָ֔ב יֵלֵ֖ךְ וְיָשֹׁ֣ב לְבֵית֑וֹ וְלֹ֥א יִמַּ֛ס אֶת־לְבַ֥ב אֶחָ֖יו כִּלְבָבֽוֹ׃", "onk": "וְיוֹסְפוּן סָרְכַיָּא לְמַלָּלָא עִם עַמָּא וְיֵימְרוּן מָן גַּבְרָא דְדָחֵל <b>וּתְבִיר<\/b> לִבָּא יְהַךְ וִיתוּב לְבֵיתֵיהּ וְלָא <b>יִתְּבַר יָת לִבָּא<\/b> דַאֲחוֹהִי כְּלִבֵּיהּ:", "onk_en": "The officers will further address the people and say. ‘‘Whoever is afraid or faint [<b>broken<\/b>] hearted, let him go and return home, and let him not destroy the resolve [<b>break the heart<\/b>] of his brothers like his own resolve.’’", "pj": "וְיוֹסְפוּן סַרְכַיָא לְמַלָלָא עִם עַמָּא וְיֵימְרוּן מַאן הוּא גַבְרָא דְדָחֵיל מֵחוֹבֵי וְלִבֵּיהּ תְּבִיר יְהַךְ וִיתוּב לְבֵיתֵיהּ דִּלְמָא יְקַבְּלוּן אָחוֹי בְּחוֹבוֹי וְיִתְבַּר לִבְּהוֹן הֵיךְ לִבֵּיהּ", "pj_en": "Yet more shall the officers speak to the people, and say, Who is the man who is afraid on account of his sin and whose heart is broken? let him go and return to his house, that his brethren be not implicated in his sins, and their heart be broken like his.", "tj": "", "tj_en": "", "rashi": "<b>ויספו השטרים.<\/b> לָמָּה נֶאֱמַר כָּאן <b>ויספו<\/b>? מוֹסִיפִין זֶה עַל דִּבְרֵי הַכֹּהֵן, שֶׁהַכֹּהֵן מְדַבֵּר וּמַשְׁמִיעַ מִן <b>שמע ישראל<\/b> עַד <b>להושיע אתכם<\/b>, וּמִי הָאִישׁ וְשֵׁנִי וּשְׁלִישִׁי כֹּהֵן מְדַבֵּר וְשׁוֹטֵר מַשְׁמִיעַ, וְזֶה שׁוֹטֵר מְדַבֵּר וְשׁוֹטֵר מַשְׁמִיעַ (סוטה מ\"ג):<br><br><b>הירא ורך הלבב.<\/b> רַבִּי עֲקִיבָא אוֹמֵר כְּמַשְׁמָעוֹ, שֶׁאֵינוֹ יָכוֹל לַעֲמֹד בְּקִשְׁרֵי הַמִּלְחָמָה וְלִרְאוֹת חֶרֶב שְׁלוּפָה; רַבִּי יוֹסֵי הַגְּלִילִי אוֹמֵר הַיָּרֵא מֵעֲבֵרוֹת שֶׁבְּיָדוֹ, וּלְכָךְ תָּלְתָה לוֹ תוֹרָה לַחֲזֹר עַל בַּיִת וְכֶרֶם וְאִשָּׁה, לְכַסּוֹת עַל הַחוֹזְרִים בִּשְׁבִיל עֲבֵרוֹת שֶׁבְּיָדָם שֶׁלֹּא יָבִינוּ שֶׁהֵם בַּעֲלֵי עֲבֵרָה, וְהָרוֹאֵהוּ חוֹזֵר אוֹמֵר שֶׁמָּא בָּנָה בַיִת אוֹ נָטַע כֶּרֶם אוֹ אֵרַשׂ אִשָּׁה (סוטה מ\"ד):", "rashi_en": "ויספו השטרים AND THE BAILIFFS [SHALL SPEAK] FURTHER [UNTO THE PEOPLE] — Why does it here state: they shall speak further unto the people? The meaning is that they added this to the words of the priest, for the priest spoke and proclaimed from שמע ישראל (v. 3) to להושיע אתכם (end of 5:4), whilst the paragraphs beginning with מי האיש (v. 5) and with the second מי האיש (v. 6) and with the third מי האיש (v. 7) the priest said quietly and the officers proclaimed. This paragraph, the officers spoke and proclaimed, so that Scripture rightly introduces this last part by the word ויספו השוטרים (Sotah 43a).<br><br>הירא ורך הלבב [WHAT MAN IS THERE] WHO IS FEARFUL AND FAINT-HEARTED — Rabbi Akiba said, Take these words as what they literally imply; they mean that he cannot stand in the dense ranks of battle and look on a naked sword. Rabbi Jose, the Galilean, said that it means one who is afraid of the sins he has committed, and therefore Scripture gave him the opportunity of attributing his return home to his house, his vineyard, or his wife, in order to veil the motives of those who really returned because of the sins they had committed, so that people should not know they were great sinners, and whoever saw a person returning would say, “Perhaps he has built a house, or planted a vineyard or betrothed a wife” (Sotah 44a)."}, {"ch": 20, "v": 9, "aliyah": 6, "heb": "וְהָיָ֛ה כְּכַלֹּ֥ת הַשֹּׁטְרִ֖ים לְדַבֵּ֣ר אֶל־הָעָ֑ם וּפָ֥קְד֛וּ שָׂרֵ֥י צְבָא֖וֹת בְּרֹ֥אשׁ הָעָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיהֵי כַּד יְשֵׁצוּן סָרְכַיָּא לְמַלָּלָא עִם עַמָּא וִימַנּוּן רַבָּנֵי <b>חֵילָא<\/b> בְּרֵישׁ עַמָּא:", "onk_en": "When the officers finish addressing the people; they will appoint army commanders at the head of the people.", "pj": "וִיהֵי כַּד פַּסְקִין סַרְכַיָא לְמַלָּלָא עִם עַמָּא וְיִמְנוּן רַבְרְבָנֵי חֵילִין בְּרֵישׁ עַמָּא", "pj_en": "And when the officers shall have finished to speak with the people, they shall appoint the captains of the host at the head of the people.", "tj": "", "tj_en": "", "rashi": "<b>שרי צבאות.<\/b> שֶׁמַּעֲמִידִין זַקָּפִין מִלִּפְנֵיהֶם וּמִלְּאַחֲרֵיהֶם וְכַשִּׁילִין שֶׁל בַּרְזֶל בִּידֵיהֶם וְכָל מִי שֶׁרוֹצֶה לַחֲזֹר הָרְשׁוּת בְּיָדוֹ לְקַפֵּחַ אֶת שׁוֹקָיו; זַקָּפִין – בְּנֵי אָדָם עוֹמְדִין בִּקְצֵה הַמַּעֲרָכָה לִזְקֹף אֶת הַנּוֹפְלִים וּלְחַזְּקָם בִּדְבָרִים, שׁוּבוּ אֶל הַמִּלְחָמָה וְלֹא תָנוּסוּ, שֶׁתְּחִלַּת נְפִילָה נִיסָה (ספרי; סוטה מ\"ד):", "rashi_en": "שרי צבאות [THEY SHALL APPOINT] OFFICERS OF THE HOSTS — This means that they shall place guards (זוקפין from זקף “to stand erect”) in front of and behind them (the troops), with iron axes in their hands, and if anybody attempted to desert he (the guard) was empowered to chop off his legs. זוקפין are men who stood in the wings of the battle-line to raise (זקף) those who fall and to strengthen them by encouraging words: “Go back to the battle and do not flee, for flight is the first step to defeat” (Sifrei Devarim 198; Sotah 44)."}, {"ch": 20, "v": 10, "aliyah": 7, "heb": "כִּֽי־תִקְרַ֣ב אֶל־עִ֔יר לְהִלָּחֵ֖ם עָלֶ֑יהָ וְקָרָ֥אתָ אֵלֶ֖יהָ לְשָׁלֽוֹם׃", "onk": "אֲרֵי תִקְרַב לְקַרְתָּא לַאֲגָחָא (קְרָבָא) עֲלַהּ וְתִקְרֵי לַהּ <b>מִלִּין<\/b> דִּשְׁלָם:", "onk_en": "When you near a city to do battle against it, you are to offer it [<b>words of<\/b>] peace.", "pj": "אֲרוּם תִּקְרְבוּן לְקַרְתָּא לְסַדְרָא עֲלָהּ סִדְרֵי קְרָבָא וּתְשַׁדְּרוּן לְוָותָהּ פּוּלִין לְמִקְרֵי לָהּ לִשְׁלָם", "pj_en": "When you come nigh to a city to make war against it, then you shall send to it certain to invite it to peace;", "tj": "", "tj_en": "", "rashi": "<b>כי תקרב אל עיר.<\/b> בְּמִלְחֶמֶת הָרְשׁוּת הַכָּתוּב מְדַבֵּר, כְּמוֹ שֶׁמְּפֹרָשׁ בָּעִנְיָן \"כֵּן תַּעֲשֶׂה לְכָל הֶעָרִים הָרְחֹקֹת וְגוֹ'\" (ספרי):", "rashi_en": "כי תקרב אל עיר WHEN THOU APPROACHEST UNTO A CITY [TO FIGHT AGAINST IT] — Scripture is speaking of a war which is not obligatory upon them (as was the war against the seven nations of Canaan, referred to in v. 16), as it is distinctly stated in this section (v. 15) “Thus thou shalt do unto all the cities which are very far [from thee]” etc. (Sifrei Devarim 199:1)."}, {"ch": 20, "v": 11, "aliyah": 7, "heb": "וְהָיָה֙ אִם־שָׁל֣וֹם תַּֽעַנְךָ֔ וּפָתְחָ֖ה לָ֑ךְ וְהָיָ֞ה כׇּל־הָעָ֣ם הַנִּמְצָא־בָ֗הּ יִהְי֥וּ לְךָ֛ לָמַ֖ס וַעֲבָדֽוּךָ׃", "onk": "וִיהֵי אִם שְׁלַם תַּעֲנִנָּךְ וְתִפְתַּח לָךְ וִיהֵי כָּל עַמָּא דְיִשְׁתְּכַח בַּהּ יְהוֹן לָךְ מַסְּקֵי <b>מִסִּין<\/b> וְיִפְלְחֻנָּךְ:", "onk_en": "Should it respond, ‘‘Peace!’’ and open for you, then all the people found in it will become your payers of tribute, and your servants.", "pj": "וִיהֵי אִין מִלִּין דִּשְׁלָם תְּתִיב לְכוֹן וְתִפְתַּח לְכוֹן פּוּלְוָותָהּ וִיהֵי כָּל עַמָּא דְּמִשְׁתַּכַּח בָּהּ יְהוֹן לְמִסְקֵי מִיסִין וְיִפְלְחוּנְכוֹן", "pj_en": "and if they answer you with words of peace, and open their gates to you, all the people whom you find therein shall be tributaries, and serve you.", "tj": "וְיֶהֱוֵי אִין מִילִין דִּשְׁלָם תַּעֲנֵי לָךְ וְתִפְתּוֹחַ לְכוֹן פִּילְוָותָא וִיהֵי כָּל עַמָּא דְמִשְׁתַּכְּחִין:", "tj_en": "And if it answer thee with words of peace, and open the gates to you, all the people whom you find.", "rashi": "<b>כל העם הנמצא בה.<\/b> אֲפִלּוּ אַתָּה מוֹצֵא בָהּ מִשִּׁבְעָה אֻמּוֹת שֶׁנִּצְטַוִּיתָ לְהַחֲרִימָם, אַתָּה רַשַּׁאי לְקַיְּמָם (שם):<br><br><b>למס ועבדוך.<\/b> עַד שֶׁיְּקַבְּלוּ עֲלֵיהֶם מִסִּים וְשִׁעְבּוּד (שם):", "rashi_en": "כל העם הנמצא בה ALL THE PEOPLE THAT IS FOUND THEREIN [SHALL BE TRIBUTARIES] — all: even if you find in it persons belonging to the seven nations which you have been commanded to exterminate, you are allowed to keep them alive (Sifrei Devarim 200:2).<br><br>למס ועבדוך [ALL THE PEOPLE … SHALL BE] TRIBUTARIES [UNTO THEE], AND THEY SHALL SERVE THEE — You must not accept their surrender until they take upon themselves both the payment of tribute and servitude (one alone is not sufficient) (Sifrei Devarim 200:3)."}, {"ch": 20, "v": 12, "aliyah": 7, "heb": "וְאִם־לֹ֤א תַשְׁלִים֙ עִמָּ֔ךְ וְעָשְׂתָ֥ה עִמְּךָ֖ מִלְחָמָ֑ה וְצַרְתָּ֖ עָלֶֽיהָ׃", "onk": "וְאִם לָא תַשְׁלֵם עִמָּךְ וְתַעְבֵּד עִמָּךְ קְרָב וּתְצוּר עֲלַהּ:", "onk_en": "And if it does not settle for peace with you but engages in war against you, you shall lay siege to it.", "pj": "וְאִין לָא תַשְׁלִים עִמְכוֹן וְתַעֲבֵיד עִמְכוֹן קְרָבָא וְתֵקְפוּן עֲלָהּ", "pj_en": "But if they will not make peace, but war, with you, then you shall beleaguer it.", "tj": "", "tj_en": "", "rashi": "<b>ואם לא תשלים עמך ועשתה עמך מלחמה.<\/b> הַכָּתוּב מְבַשֶּׂרְךָ שֶׁאִם לֹא תַשְׁלִים עִמְּךָ סוֹפָהּ לְהִלָּחֵם בְּךָ אִם תַּנִּיחֶנָּה וְתֵלֵךְ (שם):<br><br><b>וצרת עליה.<\/b> אַף לְהַרְעִיבָהּ וּלְהַצְמִיאָהּ וְלַהֲמִיתָהּ מִיתַת תַּחֲלוּאִים (שם):", "rashi_en": "ואם לא תשלים עמך ועשתה עמך מלחמה — Scripture tells you that if it does not make peace with you it will in the end make war against you (attack you) — if you leave it alone and go away (Sifrei Devarim 200:4). (The translation therefore is: AND IF IT WILL MAKE NO PEACE WITH THEE. IT WILL WAR AGAINST THEE).<br><br>וצרת עליה THEN THOU SHALT BESIEGE IT — This implies that you are entitled even to starve it out, to make it suffer thirst and to kill it (the inhabitants) by mortal diseases (Sifrei Devarim 200:5)."}, {"ch": 20, "v": 13, "aliyah": 7, "heb": "וּנְתָנָ֛הּ יְהֹוָ֥ה אֱלֹהֶ֖יךָ בְּיָדֶ֑ךָ וְהִכִּיתָ֥ אֶת־כׇּל־זְכוּרָ֖הּ לְפִי־חָֽרֶב׃", "onk": "וְיִמְסְרִנַּהּ יְיָ אֱלָהָךְ בִּידָךְ וְתִמְחֵי יָת כָּל דְּכוּרַהּ לְפִתְגַּם דְּחָרֶב:", "onk_en": "Adonoy, your God, will deliver it into your hand, and you will smite all its males by the sword.", "pj": "וְיִמְסְרִינָהּ יְיָ אֱלָהָכוֹן בִּידֵיכוֹן וְתִמְחֵי יַת כָּל דְּכוּרָהּ לְפִתְגָם דְּחָרֶב", "pj_en": "And when the Lord your God will have delivered it into your hand, then may you smite every male thereof with the edge of the sword.", "tj": "", "tj_en": "", "rashi": "<b>ונתנה ה' אלהיך בידך.<\/b> אִם עָשִׂיתָ כָּל הָאָמוּר בָּעִנְיָן, סוֹף שֶׁה' נוֹתְנָהּ בְּיָדֶךָ (שם):", "rashi_en": "ונתנה ה' אלהיך בידך means THEN THE LORD THY GOD WILL GIVE IT INTO THY HANDS — if you have done all that is prescribed in this section the Lord will in the end give it into your hands (Sifrei Devarim 200:6)."}, {"ch": 20, "v": 14, "aliyah": 7, "heb": "רַ֣ק הַ֠נָּשִׁ֠ים וְהַטַּ֨ף וְהַבְּהֵמָ֜ה וְכֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָעִ֛יר כׇּל־שְׁלָלָ֖הּ תָּבֹ֣ז לָ֑ךְ וְאָֽכַלְתָּ֙ אֶת־שְׁלַ֣ל אֹיְבֶ֔יךָ אֲשֶׁ֥ר נָתַ֛ן יְהֹוָ֥ה אֱלֹהֶ֖יךָ לָֽךְ׃", "onk": "לְחוֹד נְשַׁיָּא וְטַפְלָא וּבְעִירָא וְכֹל דִּי יְהֵי בְקַרְתָּא כָּל עֲדָאַהּ תֵּבוֹז לָךְ וְתֵיכוּל יָת עֲדָאָה דְסָנְאָךְ דִּי יְהַב יְיָ אֱלָהָךְ לָךְ:", "onk_en": "However, the women and the children, and the animals, and everything that will be in the city—all its booty—are you to plunder for yourself; you will eat the booty of your enemies that Adonoy, your God, gave you.", "pj": "לְחוֹד נְשַׁיָא וְטַפְלָא וּבְעִירָא וְכָל דִּיהֵי בְקַרְתָּא כָּל עֲדָאָהּ תִּיבְזוּן לְכוֹן וְתֵיכְלוּן יַת עֲדֵי סַנְאֵיכוֹן דִּיהַב יְיָ אֱלָהָכוֹן לְכוֹן", "pj_en": "But the women, children, and cattle, and whatever is in the city, even all the spoil, you shall seize, and eat the spoil of your enemies which the Lord your God giveth you.", "tj": "", "tj_en": "", "rashi": "<b>והטף.<\/b> אַף טַף שֶׁל זְכָרִים, וּמָה אֲנִי מְקַיֵּם \"וְהִכִּיתָ אֶת כָל זְכוּרָהּ\"? בַּגְּדוֹלִים (שם):", "rashi_en": "והטף AND THE LITTLE ONES [… SHALT THOU TAKE UNTO THYSELF] — the male children, too. But how am I to understand (v. 13) “and thou shalt smite every male thereof”? As referring to the male adults (Sifrei Devarim 200:7)."}, {"ch": 20, "v": 15, "aliyah": 7, "heb": "כֵּ֤ן תַּעֲשֶׂה֙ לְכׇל־הֶ֣עָרִ֔ים הָרְחֹקֹ֥ת מִמְּךָ֖ מְאֹ֑ד אֲשֶׁ֛ר לֹא־מֵעָרֵ֥י הַגּֽוֹיִם־הָאֵ֖לֶּה הֵֽנָּה׃", "onk": "כֵּן תַּעְבֵּד לְכָל קִרְוַיָּא דִּי רְחִיקִין מִנָּךְ לַחֲדָא דִּי לָא מִקִּרְוֵי עַמְמַיָּא הָאִלֵּין אִנּוּן:", "onk_en": "So will you do to all the cities, that are very distant from you, that are not among the cities of these nations.", "pj": "הֵיכְנָא תַּעַבְדוּן לְכָל קִירְוַיָא דִרְחִיקִין מִנְכוֹן לַחֲדָא דְּלָא מִקִרְוֵי שִׁבְעָתֵי עַמְמַיָא הָאִלֵּין הִינוּן",
