ֹן אֲרֵי תַקִּיף וְחֵמַתְהוֹן אֲרֵי קַשְׁיָא אֲפַלְּגִנּוּן בְּיַעֲקֹב וְאֵבַדָּרִנּוּן בְּיִשְׂרָאֵל:", "onk_en": "Cursed be their anger for it is powerful, and their fury for it is cruel. I will divid them throughout Yaakov and scatter them throughout [the land of] Israel.", "pj": "אֲמַר יַעֲקב לוּט הֲוָה כְּרַכָּא דִשְׁכֶם כַּד עָלוּן לְגַוָהּ לִמְחַרְבָהּ בְּרוּגְזֵיהוֹן דְתַּקִיף וְחֵמַתְהוֹן עַל יוֹסֵף אֲרוּם קַשְׁיָא אָמַר יַעֲקב אִין שַׁרְיַין הִינוּן תְּרֵיהוֹן כַּחֲדָא לֵית מְלִיךְ וְשׁוּלְטַן דִיקוּם קָדָמֵיהוֹן אַפְלִיג אַחְסָנַת בְּנוֹי דְשִׁמְעוֹן לִתְּרֵין חוּלְקִין חוּלַק חַד יִפּוֹק לֵיהּ מִגוֹ אַחְסָנַת בְּנֵי יְהוּדָה וְחוּלַק חַד בֵּינֵי שְׁאַר שִׁבְטַיָא דְיַעֲקב וַאֲבַדַר שִׁבְטָא דְלֵוִי בְּגוֹ כֻלְהוֹן שִׁבְטַיָא דְיִשְרָאֵל", "pj_en": "And Jakob said, Accursed was the town of Shekem, when they entered within it to destroy it in their violent wrath; and their hatred against Joseph, for it was relentless. If, said Jakob, they dwell together, no king nor ruler may stand before them. Therefore will I divide the inheritance of the sons of Shimeon into two portions; one part shall come to them out of the inheritance of the sons of Jehuda, and one part from among the rest of the tribes of Jakob; and the tribe of Levi I will disperse among all the tribes of Israel.", "tj": "לִיט הֲוָה כְּרַכָּא דִשְׁכֶם דַעֲלוּ לְגַוָהּ שִׁמְעוֹן וְלֵוִי לִמְחַרְבָהּ בְּרוּגְזֵיהוֹן אֲרוּם תַּקִיף הֲוָה וּבַחֲמַתְהוֹן אַרוּם קַשְׁיָא הֲוָת: אָמַר אֲבוּנָן יַעֲקב אִין שַׁרְיָן הִינוּן כַּחֲדָא לֵית אוּמָא וּמַלְכוּ יָכְלָא לְמֵיקַם מִן קָמֵיהוֹן אַפְלִיג יַת שִׁבְטָא דְשִׁמְעוֹן סַבָּרִין מַלְפֵי אוֹרַיְתָא בִּכְנִשְׁתָּא דְיַעֲקב וְאִיבַדַר יַת שִׁבְטָא דְלֵוִי בְּבָתֵּי מֶדְרָשַׁיָא דִבְנֵי יִשְרָאֵל:", "tj_en": "Accursed was the town of Shekem when Shimeon and Levi entered to destroy it in their wrath, for it was strong, and in their anger, for it was cruel. And Jakob our father said, If these remain together, no people or kingdom can stand before them. I will divide the tribe of Shimeon, that they may become preachers and teachers of the law in the congregation of Jakob; and I will disperse the tribe of Levi in the houses of instruction for the sons of Israel", "rashi": "<b>ארור אפם כי עז.<\/b> אֲפִלּוּ בִּשְׁעַת תּוֹכֵחָה לֹא קִלֵּל אֶלָּא אַפָּם, וְזֶהוּ שֶׁאָמַר בִּלְעָם מָה אֶקֹּב לֹא קַבֹּה אֵל (במדבר כ\"ג):<br><br><b>אחלקם ביעקב.<\/b> אַפְרִידֵם זֶה מִזֶּה שֶׁלֹּא יְהֵא לֵוִי בְּמִנְיַן הַשְּׁבָטִים, וַהֲרֵי הֵם חֲלוּקִים. דָּבָר אַחֵר אֵין לְךָ עֲנִיִּים וְסוֹפְרִים וּמְלַמְּדֵי תִינוֹקוֹת אֶלָּא מִשִּׁמְעוֹן, כְּדֵי שֶׁיִּהְיוּ נְפוֹצִים, וְשִׁבְטוֹ שֶׁל לֵוִי עֲשָׂאוֹ מְחַזֵּר עַל הַגְּרָנוֹת לַתְּרוּמוֹת וְלַמַּעַשְׂרוֹת, נָתַן לוֹ תְּפוּצָתוֹ דֶּרֶךְ כָּבוֹד:", "rashi_en": "ארור אפם כי עז CURSED BE TIIEIR WRATH, FOR IT IS POWERFUL — Even when he was reproving them he did not curse them but their anger. That is what Balaam said: (Numbers 23:8) “How can I curse them since אל hath not cursed them?” (Genesis Rabbah 99:6)<br><br>אחלקם ביעקב I WILL DIVIDE THEM IN JACOB — I shall separate them from each other inasmuch as Levi shall not be numbered among the tribes (cf. Numbers 26:62) and  thus they (Simeon and Levi) will be divided (cf. Genesis Rabbah 98:5). Another interpretation is: both of these tribes will be dispersed in Israel, and this happened, for you will find that the very poor — the Scribes and elementary teachers — were all of the tribe of Simeon, and this was so in order that this tribe should be dispersed, since such poor people must wander from city to city to eke out a livelihood. As for the tribe of Levi, He made them travel round from one threshing floor to another to collect their heave offerings and tithes; thus He caused them also to be “scattered” but in a more respectable manner (Genesis Rabbah 99:6). "}, {"ch": 49, "v": 8, "aliyah": 4, "heb": "יְהוּדָ֗ה אַתָּה֙ יוֹד֣וּךָ אַחֶ֔יךָ יָדְךָ֖ בְּעֹ֣רֶף אֹיְבֶ֑יךָ יִשְׁתַּחֲו֥וּ לְךָ֖ בְּנֵ֥י אָבִֽיךָ׃", "onk": "יְהוּדָה אַתְּ אוֹדֵיתָא וְלָא בְהֵיתְתָא בָּךְ יוֹדוּן אַחָיךְ יְדָךְ תִּתְקֵף עַל בַּעֲלֵי דְבָבָךְ יִתְבַּדְּרוּן סַנְאָךְ יְהוֹן מְחַזְּרִין קְדַל קֳדָמָךְ וִיהוֹן מְקַדְּמִין לְמִשְׁאַל בִּשְׁלָמָךְ בְּנֵי אָבוּךְ:", "onk_en": "Yehudah, your brothers will praise you [<b>you confessed, and you were not ashamed. Your brothers will acknowledge you.<\/b>] Your hand will be on the neck of [<b>overpower<\/b>] your enemies. [<b>Your haters will be dispersed. They will turn the back of their necks to you.<\/b>] Your father’s sons will prostrate themselves to you [<b>greet you first<\/b>].", "pj": "יְהוּדָה אַנְתְּ אוֹדֵיתָא עַל עוּבְדָא דְתָמָר בְּגִין כֵּן לָךְ יְהוֹדוּן אֲחָךְ וְיִתְקְרוּן יְהוּדָאִין עַל שְׁמָךְ יְדָךְ יִתְפַּרְעוּן לָךְ מִבַּעֲלֵי דְבָבָךְ לְמִפְתַק גִירִין לְהוֹן כַּד יְחַזְרוּן קְדַל קֳדָמָךְ וִיהוֹן מַקְדִימִין לְמִישְׁאַל בִּשְׁלָמָךְ בְּנַי אֲבוּךְ", "pj_en": "Jehuda, thou didst make confession in the matter of Tamar: therefore shall thy brethren confess thee, and shall be called Jehudain from thy name. Thy hand shall avenge thee of thy adversaries, in throwing arrows upon them when they turn their backs before thee; and the sons of thy fathers shall come before thee with salutations.", "tj": "יְהוּדָה לָךְ יוֹדוּן כָּל אֲחָךְ וְעַל שְׁמָךְ יִתְקְרוּן כָּל יְהוּדָאֵי יְדָךְ יִתְפָּרְעוּן לָךְ מִבַּעְלֵי דְבָבָךְ יֶהֱוַון מְקַדְמִין וְשַׁאֲלִין בִּשְׁלָמָךְ כָּל בְּנוֹי דְאָבוּךְ:", "tj_en": "JEHUDA, thee shall all thy brethren praise, and from thy name shall all be called Jehudaee; thy hand shall avenge thee of thy adversaries; all the sons of thy father shall come before thee with salutation.", "rashi": "<b>יהודה אתה יודוך אחיך.<\/b> לְפִי שֶׁהוֹכִיחַ אֶת הָרִאשׁוֹנִים בְּקִנְטוּרִים, הִתְחִיל יְהוּדָה נָסוֹג לַאֲחוֹרָיו, (שֶׁלֹּא יוֹכִיחֶנּוּ עַל מַעֲשֵׂה תָמָר) וּקְרָאוֹ יַעֲקֹב בְּדִבְרֵי רִצּוּי, יְהוּדָה לֹא אַתָּה כְמוֹתָם (בראשית רבה):<br><br><b>ידך בערף איביך.<\/b> בִּימֵי דָּוִד – וְאֹיְבַי תַּתָּה לִּי עֹרֶף (שמואל ב כ\"ב):<br><br><b>בני אביך.<\/b> עַל שֵׁם שֶׁהָיוּ מִנָּשִׁים הַרְבֵּה, לֹא אָמַר בְּנֵי אִמֶּךָ כְּדֶרֶךְ שֶׁאָמַר יִצְחָק:", "rashi_en": "יהודה אתה יודוך אחיך THOU JUDAH, THY BRETHREN SHALL PRAISE THEE — Because he rebuked the first three tribes in harsh terms Judah began to move away that he (Jacob) should not censure him for the incident with Tamar; Jacob therefore recalled him with words that would soothe him: Judah, you are not like these! — you your brethren may indeed praise (Genesis Rabbah 99:5).<br><br>ידך בערף איביך THY HAND IS ON THE NECK OF THINE ENEMIES — a prophecy fulfilled in the days of David, a descendant of Judah, who said (2 Samuel 22:41) “Thou hast also made mine enemies turn their back unto me” (Genesis Rabbah 99:8). (The Hebrew may signify, “Thou hast given me my enemies’ necks”)<br><br>בני אביך THY FATHER’S CHILDREN — Because they were born of different wives he did not say “thy mother’s children” as Isaac said (Genesis Rabbah 99:8). (He meant: all thy brothers will bow down to thee. Had he said “thy mother’s children”, he would have included only Judah’s brothers who were born of the same mother as himself.) "}, {"ch": 49, "v": 9, "aliyah": 4, "heb": "גּ֤וּר אַרְיֵה֙ יְהוּדָ֔ה מִטֶּ֖רֶף בְּנִ֣י עָלִ֑יתָ כָּרַ֨ע רָבַ֧ץ כְּאַרְיֵ֛ה וּכְלָבִ֖יא מִ֥י יְקִימֶֽנּוּ׃", "onk": "שִׁלְטוֹן יְהֵי בְשֵׁרוּיָא וּבְסוֹפָא יִתְרַבָּא מַלְכָּא מִדְּבֵית יְהוּדָה אֲרֵי מִדִּין קַטְלָא בְּרִי נַפְשָׁךְ סְלֶקְתָּא יְנוּחַ יִשְׁרֵי בִתְקוֹף כְּאַרְיָא וּכְלֵיתָא וְלֵית מַלְכוּ דִתְזַעְזְעִנֵּיהּ:", "onk_en": "Yehudah is like a young lion. [<b>He will be a ruler at the beginning, and at the end, a king will be anointed from the house of Yehudah.<\/b>] You have risen above plunder my son. [<b>For from the judgment of death, my son, you removed yourself.<\/b>] He crouches, rests like a lion, [<b>He will rest and dwell in strength like a lion.<\/b>] like an awesome lion, who will rouse him? [<b>there is no kingdom that can make him tremble.<\/b>]", "pj": "מְדַמֵי אֲנָא לָךְ יְהוּדָה בְּרִי לְגוּר בַּר אַרְיְוָן דְמִין קְטוּלֵיהּ דְיוֹסֵף בְּרִי סְלִיקְתָּא נַפְשָׁךְ וּמִדִינָא דְתָּמָר תְּהֵי מְשֵׁזִיב נְיָיח וְשָׁרִי בִּתְקוֹף הֵי כְּאַרְיָא וְהֵי כְלֵיתָא דְכַד נַח מִן יְקִימִינֵיהּ", "pj_en": "I will liken thee, my son Jehuda, to a whelp, the young of a lion; for from the killing of Joseph my son thou didst uplift thy soul, and from the judgment of Tamar thou wast free. He dwelleth quietly and in strength, as a lion; and as an old lion when he reposeth, who may stir him up?", "tj": "מְדַמֵי אֲנָא לָךְ בְּרִי יְהוּדָה לְגוּר בַּר אַרְיְוָן מִן קַטְלוֹי דְיוֹסֵף אַתְּ הֲוֵיתָא מְשֵׁזִיב מִן דִינָא דְתָמָר בְּרִי אַתְּ הֲוֵיתָא זַכַּאי נִיחַ וּשְׁרֵי בְּגוֹ קְרָבָא הֵיךְ אַרְיָא וְהֵיךְ אַרְיְוָתָא וְלֵית אוּמָה וּמַלְכוּ דְתֵקִים לְקוֹבְלָךְ:", "tj_en": "I will liken thee, my son Jehuda, to a whelp the son of a lion: from the slaying of Joseph thou wast free, from the judgment of Tamar thou, my son, wast acquitted. He remaineth tranquil in the midst of war, as the lion and as the lioness; nor is there people or kingdom that can stand against thee.", "rashi": "<b>גור אריה.<\/b> עַל דָּוִד נִתְנַבֵּא – בַּתְּחִלָּה גּוּר בִּהְיוֹת שָׁאוּל מֶלֶךְ עָלֵינוּ אַתָּה הָיִיתָ הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל (שמואל ב ה') – וּלְבַסּוֹף אַרְיֵה, כְּשֶׁהִמְלִיכוּהוּ עֲלֵיהֶם, וְזֶהוּ שֶׁתִּרְגֵּם אֻנְקְלוֹס שִׁלְטוֹן יְהֵא בְּשֵׁרוּיָא – בִּתְחִלָּתוֹ:<br><br><b>מטרף.<\/b> מִמַּה שֶּׁחֲשַׁדְתִּיךָ בְּטָרֹף טֹרַף יוֹסֵף חַיָּה רָעָה אֲכָלָתְהוּ – וְזֶהוּ יְהוּדָה שֶׁנִּמְשַׁל לְאַרְיֵה –<br><br><b>בני עלית.<\/b> סִלַּקְתָּ אֶת עַצְמְךָ וְאָמַרְתָּ מַה בֶּצַע וְגוֹ', וְכֵן בַּהֲרִיגַת תָּמָר שֶׁהוֹדָה, צָדְקָה מִמֶּנִּי, לְפִיכָךְ <b>כרע רבץ<\/b> וְגוֹ', בִּימֵי שְׁלֹמֹה אִישׁ תַּחַת גַּפְנוֹ וְגוֹ' (מלכים א ה'):", "rashi_en": "גור אריה A YOUNG LION — He prophesied this with reference to David who, when he began his military career, was but as a whelp — as it states, (2 Samuel 5:2) “when Saul was king over us it was thou that didst lead out and bring in Israel” — but who later on became as a lion when they made him king over themselves. That is what Onkelos means by translating it “A ruler he shall he בשרויא” — at the beginning<br><br>מטרף FROM THE PREY (literally, tearing) — From the deed of which I suspected you when I said (Genesis 37:33) “Joseph is torn in pieces, an evil beast hath devoured him” — and by that Judah was meant who was likened to a lion — <br><br>בני עלית THOU WENTEST UP, O MY SON — from that murderous deed you withdrew saying, (Genesis. 5:26) “what profit is it if we slay our brother”, and similarly did he act when Tamar was condemned to death, for he said “She is righteous: mine is the blame” (cf. Rashi on Genesis 38:26), therefore as a reward כרע רבץ HE STOOPED DOWN, HE CROUCHED etc. — as we are told of the days of Solomon (1 Kings 5:5) “[Israel dwelt safely] every man under his vine etc.” (Genesis Rabbah 99:8). "}, {"ch": 49, "v": 10, "aliyah": 4, "heb": "לֹֽא־יָס֥וּר שֵׁ֙בֶט֙ מִֽיהוּדָ֔ה וּמְחֹקֵ֖ק מִבֵּ֣ין רַגְלָ֑יו עַ֚ד כִּֽי־יָבֹ֣א <span class=\"mam-kq-trivial\">שִׁילֹ֔ה<\/span> וְל֖וֹ יִקְּהַ֥ת עַמִּֽים׃", "onk": "לָא יַעֲדֵי עָבֵד שָׁלְטַן מִדְּבֵית יְהוּדָה וְסַפְרָא מִבְּנֵי בְנוֹהִי עַד עָלְמָא עַד דְּיֵיתֵי מְשִׁיחָא דְּדִילֵיהּ הִיא מַלְכוּתָא וְלֵיהּ יִשְׁתַּמְּעוּן עַמְמַיָּא:", "onk_en": "The rod [<b>of the ruler<\/b>] will not depart from [<b>the house of<\/b>] Yehudah, nor a law-enforcer from between his feet [<b>nor a scribe from his children’s children forever<\/b>], until Shiloh Comes [<b>the Moshiach will come, for his is the kingship<\/b>], and to him shall be an assembly of nations [<b>nations will listen<\/b>].", "pj": "לָא פַּסְקִין מַלְכִין וְשַׁלִיטִין מִדְבֵית יְהוּדָה וְסַפְרִין מֵאַלְפֵי אוֹרַיְיתָא מִזַרְעֵיהּ עַד זְמַן דִי יֵיתֵי מַלְכָּא מְשִׁיחָא זְעֵיר בְּנוֹי וּבְדִילֵיהּ יִתְיַמְסוּן עַמְמַיָא", "pj_en": "Kings shall not cease, nor rulers, from the house of Jehuda, nor sapherim teaching the law from his seed, till the time that the King the Meshiha, shall come, the youngest of his sons; and on account of him shall the peoples flow together.", "tj": "לָא פַסְקִין מַלְכִין מִדְבֵית יְהוּדָה אַף לָא סַבָּרִין מַלְפֵי אוֹרַיְיתָא מִבְּנֵי בְּנוֹי עַד זְמַן דְיֵיתֵי מַלְכָּא מְשִׁיחָא דְדִידֵיהּ הוּא מַלְכוּתָא וְלֵיהּ עֲתִידִין דְיִשְׁתַּעֲבְּדוּן כָּל מַלְכוּתָא דְאַרְעָא:", "tj_en": "Kings shall not cease from the house of Jehuda, nor sapherim teaching the law from his children's children, until the time that the King Meshiha shall come, whose is the kingdom, and to whom all the kingdoms of the earth shall be obedient.", "rashi": "<b>לא יסור שבט מיהודה.<\/b> מִדָּוִד וָאֵילָךְ, אֵלּוּ רָאשֵׁי גָּלֻיּוֹת שֶׁבְּבָבֶל, שֶׁרוֹדִים אֶת הָעָם בַּשֵּׁבֶט שֶׁמְּמֻנִּים עַל פִּי הַמַּלְכוּת (בראשית רבה):<br><br><b>ומחקק מבין רגליו.<\/b> הַתַּלְמִידִים, אֵלּוּ נְשִׂיאֵי אֶרֶץ יִשְׂרָאֵל:<br><br><b>עד כי יבא שילה.<\/b> מֶלֶךְ הַמָּשִׁיחַ שֶׁהַמְּלוּכָה שֶׁלּוֹ, וְכֵן תִּרְגְּמוֹ אֻנְקְלוֹס. וּמִדְרַשׁ אַגָּדָה שִׁילוֹ – שַׁי לוֹ, שֶׁנֶּאֱמַר, יֹבִילוּ שַׁי לַמּוֹרָא (תהילים ע\"ו):<br><br><b>ולו יקהת עמים.<\/b> אֲסֵפַת הָעַמִּים, שֶׁהַיּוֹ\"ד עִקָּר הִיא בַּיְסוֹד, כְּמוֹ יִפְעָתֶךָ (יחזקאל כ\"ח), וּפְעָמִים שֶׁנּוֹפֶלֶת מִמֶּנּוּ, וְכַמָּה אוֹתִיּוֹת מְשַׁמְּשׁוֹת בְּלָשׁוֹן זֶה, וְהֵם נִקְרָאִים עִקָּר נוֹפֵל; כְּגוֹן נוּ\"ן שֶׁל נוֹגֵף וְשֶׁל נוֹשֵׁךְ, וְאָלֶ\"ף שֶׁבִּוְאַחֲוָתִי בְּאָזְנֵיכֶם (איוב י\"ג), וְשֶׁבְּאִבְחַת חָרֶב (יחזקאל כ\"א), וְאָסוּךְ שָׁמֶן (מלכים ב ד'), אַף זֶה יִקְּהַת עַמִּים אֲסֵפַת עַמִּים, שֶׁנֶּאֱמַר אֵלָיו גּוֹיִם יִדְרֹשׁוּ (ישעיהו י\"א). וְדוֹמֶה לוֹ עַיִן תִּלְעַג לְאָב וְתָבֻז לִיקְּהַת אֵם (משלי ל'), לְקִבּוּץ קְמָטִים שֶׁבְּפָנֶיהָ מִפְּנֵי זִקְנָתָהּ; וּבַתַּלְמוּד דְּיָתְבֵי וּמַקְהוּ אַקְהָתָא בְּשׁוּקֵי דִּנְהַרְדְּעָא בְּמַסֶּכֶת יְבָמוֹת; וְיָכוֹל הָיָה לוֹמַר, קְהִיַּת עַמִּים:", "rashi_en": "לא יסור שבט מיהודה THE SCEPTRE SHALL NOT DEPART FROM JUDAH — Even after the house of David ceases to reign. For this refers to the Chiefs of the Exile in Babylon who ruled over the people with the rod (שבט) having been appointed by the government (Sanhedrin 5a; Horayot 11b).<br><br>ומחוקק מבין רגליו AND THE LAWGIVER FROM BETWEEN HIS FEET — This refers to the scholars of the Torah: the Princes of the Land of Israel (as Hillel and his descendants who were Heads of Schools only and had no political power) (Sanhedrin 5a; Horayot 11b).<br><br>עד כי יבא שילה means until the King Messiah will come, whose will be the kingdom (Genesis Rabbah 99:8). Thus too does Onkelos render it. A Midrashic interpretation is: שילה is the same as שי לו, a present unto him, as it is said, (Psalms 76:12) “Let them bring (שי) presents unto him that is to be feared.”<br><br>ולו יקהת עמים means AND UNTO HIM [SHALL BE] AN ASSEMBLAGE OF PEOPLES. יקהת is a noun from the root יקה and is not a verbal form although it has the appearance of one, for the י is one of the root-letters as it is in the word יפעתך (Ezekiel 21:20) “thy brightness” from root יפע, only that it is sometimes omitted. There are many root-letters that are subject to this rule and are known as עיקר נופל (root-letters that may be omitted) as, for example, the נ of נוגף and of נושך and the א of אחותי in (Job 13:17) ואחותי באזניכם (where the root is חוה) “and let my declaration be in your ears”, and the אבחת of א in the phrase (Ezekiel 21:20) אבחת חרב “the point of the sword”, or the א in אסוך in the phrase (2 Kings 4:2) (אסוך שמן) (root סוך) “a pot of oil”. So, too, here, ויקהת a noun (from a root יָקַה to assemble, as שמחה the construct of which is שמחת from שמח) — an assembly of nations. And so it is actually said with reference to the Messiah, (Isaiah 11:10) “Unto him shall the nations seek”. Of similar meaning is the word יקהת in (Proverbs 30:17) “the eye that mocketh at his father, and despiseth ליקהת אם i.e. despiseth “the gathering of wrinkles in the mother’s face” (due to old age). In the Talmud we find a similar meaning of the root .יקה: “they sat and gathered assemblies (ומקהו אקהתא) in the streets of Nehardea” (Tr. Yevamot 110b). It could have also said קהיית instead of יקהת.  "}, {"ch": 49, "v": 11, "aliyah": 4, "heb": "אֹסְרִ֤י לַגֶּ֙פֶן֙ <span class=\"mam-kq-trivial\">עִירֹ֔ה<\/span> וְלַשֹּׂרֵקָ֖ה בְּנִ֣י אֲתֹנ֑וֹ כִּבֵּ֤ס בַּיַּ֙יִן֙ לְבֻשׁ֔וֹ וּבְדַם־עֲנָבִ֖ים <span class=\"mam-kq-trivial\">סוּתֹֽה<\/span>׃", "onk": "יַסְחַר יִשְׂרָאֵל לְקַרְתֵּיהּ עַמָּא יִבְנוּן הֵיכְלֵיהּ יְהוֹן צַדִּיקַיָּא סְחוֹר סְחוֹר לֵיהּ וְעָבְדֵי אוֹרַיְתָא בְּאוּלְפַן עִמֵּיהּ יְהֵי אַרְגְּוָן טַב לְבוּשׁוֹהִי כְּסוּתֵיהּ מֵילָא מֵילָא צְבַע זְהוֹרִי וְצִבְעוֹנִין:", "onk_en": "He loads his young donkey with grapes of a vine, and his she-donkey’s foal with a vine-branch. [<b>He will bring Israel from all around to his city, the nation who will build his Temple. / The righteous will congregate around the Moshiach, and those who engage in Torah will study with him.<\/b>] He washes his clothes in wine, [<b>May his garments be of fine purple cloth,<\/b>] and his cloak in the blood of grapes [<b>and his clothes of fine wool colored in scarlet and other colors<\/b>].", "pj": "מַה יָאִי מַלְכָּא מְשִׁיחָא דְעָתִיד לְמֵיקוּם מִדְבֵית יְהוּדָה אָסַר חַרְצוֹי וְנָחִית וּמְסַדֵר סִדְרֵי קְרָבָא בַּעֲלֵי דְבָבוֹי וּמִקְטַל מַלְכִין עִם שׁוּלְטָנֵיהוֹן וְלֵית מְלִיךְ וְשׁוּלְטַן דִיקוּם קֳדָמוֹי מְסַמֵק טַוְורַיָא מִן אֲדַם קְטִילֵיהוֹן לְבוּשׁוֹי מְעַגְעָגִין בְּאַדְמָא מְדַמָא לְעַצוּר דְעִנְבִין", "pj_en": "How beauteous is the King, the Meshiha who will arise from the house of Jehuda! He hath girded his loins, and descended, and arrayed the battle against his adversaries, Slaying kings with their rulers; neither is there any king or ruler who shall stand before him. The mountains become red with the blood of their slain; his garments, dipped in blood, are like the outpressed juice of grapes.", "tj": "מַה יָאִי הוּא מַלְכָּא מְשִׁיחָא דְעָתִיד לְמֵיקַם מִדְבֵית יְהוּדָה אָסַר חַרְצוֹי וְנָפִיק לִקְרָבָא לְקָבֵיל שַנְאוֹי וּמִתְקַטְלִין מַלְכִין עִם שִׁלְטוֹנִין מְסַמֵק נַהֲרַיָא מִדַם קְטָלֵיהוֹן וּמְחַוֵר גוּלְמָתֵיהּ מִן תְּרַב גִבָּרֵיהוֹן לְבוּשׁוֹי מְעַגְעָגִין בְּאִידְמָא וְהוּא מְדַמֵי לִרְפוּס עִינְבִין:", "tj_en": "How beauteous is the King Meshiha, who is to arise from the house of Jehuda. Binding his loins, and going forth to war against them that hate him, he will slay kings with princes, and make the rivers red with the blood of their slain, and his hills white with the fat of their mighty ones; his garments will be dipped in blood, and he himself be like the juice of the winepress.", "rashi": "<b>אסרי לגפן עירה.<\/b> נִתְנַבֵּא עַל אֶרֶץ יְהוּדָה שֶׁתְּהֵא מוֹשֶׁכֶת יַיִן כְּמַעְיָן; אִישׁ יְהוּדָה יֶאֱסֹר לַגֶּפֶן עַיִר אֶחָד וְיִטְעָנֶנּוּ מִגֶּפֶן אַחַת, וּמִשֹּׂרֵק אֶחָד בֶּן אָתוֹן אֶחָד:<br><br><b>שרקה.<\/b> זְמוֹרָה אֲרֻכָּה, קוריירא בְּלַעַז:<br><br><b>כבס ביין.<\/b> כָּל זֶה לְשׁוֹן רִבּוּי יַיִן:<br><br><b>סותה.<\/b> לְשׁוֹן מִין בֶּגֶד הוּא, וְאֵין לוֹ דִּמְיוֹן בַּמִּקְרָא:<br><br><b>אסרי.<\/b> כְּמוֹ אוֹסֵר, דֻּגְמַת מְקִימִי מֵעָפָר דָּל (תהילים קי\"ג), הַיֹּשְׁבִי בַּשָּׁמָיִם (שם קכ\"ג), וְכֵן בְּנִי אֲתֹנוֹ כְּעִנְיָן זֶה. וְאֻנְקְלוֹס תִּרְגֵּם בְּמֶלֶךְ הַמָּשִׁיחַ: גֶּפֶן – הֵם יִשְׂרָאֵל; עִירֹה – זוֹ יְרוּשָׁלַיִם; שֹׂרֵקָה – יִשְׂרָאֵל, וְאָנֹכִי נְטַעְתִּיךְ שׂוֹרֵק – (ירמיהו ב'):<br><br><b>בני אתנו.<\/b> יִבְנוּן הֵיכְלֵהּ, לְשׁוֹן שַׁעַר הָאִיתוֹן בְּסֵפֶר יְחֶזְקֵאל (יחזקאל מ'). וְעוֹד תִּרְגְּמוּ בְּפָנִים אֲחֵרִים: גֶּפֶן אֵלּוּ צַדִּיקִים; בְּנִי אֲתֹנוֹ – עָבְדֵי אוֹרַיְתָא בְּאוּלְפַן, עַל שֵׁם רֹכְבֵי אֲתֹנוֹת צְחֹרוֹת:<br><br><b>כבס ביין.<\/b> יְהֵא אַרְגְּוָן טַב שֶׁצִּבּוּעוֹ דּוֹמֶה לְיַיִן, וְצִבְעוֹנִין הוּא לְשׁוֹן סוּתֹה, שֶׁהָאִשָּׁה לוֹבַשְׁתָּן וּמְסִיתָה בָּהֶן אֶת הַזָּכָר לִתֵּן עֵינָיו בָּהּ; וְאַף רַבּוֹתֵינוּ פֵּרְשׁוּ בַתַּלְמוּד לְשׁוֹן הֲסָתַת שִׁכְרוּת בְּמַסֶּכֶת כְּתֻבּוֹת (דף קי\"א). וְעַל הַיַּיִן שֶׁמָּא תֹאמַר אֵינוֹ מַרְוֶה, תַּלְמוּד לוֹמַר סוּתֹה:", "rashi_en": "אסרי לגפן עירה BINDING UNTO THE VINE HIS FOAL — He (Jacob) prophesied of the land of Judah that it would run with wine like a fountain: the vines will be so productive that a man of Judah will bind to a vine one foal and he will fully load it with the grapes of only one vine, and from the produce of only one branch he would load one ass’s colt.<br><br>שרקה means a long branch; corière in old French<br><br>כבס ביין HE WASHED IN WINE — all these phrases indicate abundance of wine.<br><br>סותה denotes a kind of vesture, but there is no other example of the word in Scripture.<br><br>אסרי is the same as אוסר (i.e. the yod is redundant). Similar forms are: (Psalms 113:7) “who raiseth (מקימי instead of מקים) the poor out of the dust”, (Psalms 5:1) “that art enthroned” (היושבי instead of היושב) in the heavens”. In the same way is בני אתנו (instead of בן אתנו) to be explained. Onkelos translates v.11 as having reference to King Messiah: גפן “the vine” symbolizes “Israel” (cf. Psalms 80:9): “Thou didst pluck up a vine out of Egypt”); עירה (taken as עיר city with the ה suffix instead of ו, like סותה instead of סותו in thin verse) means Jerusalem; שורקה alludes to Israel as the prophet exclaims (Jeremiah 2:21) “Yet, I had planted thee a noble vine (שורק)\".<br><br>בני אתנו Onkelos translates by: they will build His Temple (איתנו), connecting this word with the expression שער האיתן “The gate of the entrance” of the Temple mentioned in the book of Ezekiel (Ezekiel 40:15). He further renders it in another manner, namely: גפן the vine represents the righteous; בני אתנו he paraphrases by: who occupy themselves with the Torah by teaching it” — with an allusion to the idea expressed in (Judges 5:10) “Ye that ride on white asses (אתונות)” (cf. Eruvin 54b, where this is referred to the scholars who ride from city to city and from district to district to teach the Law, thus making the explanation of the Torah shining-white as is the light at noon-day; cf. also the Targum on this verse).<br><br>The words כבס ביין he renders by “their garments will be of fine purple” — resembling wine in colour. The word צבעונין “coloured garments” in the Targum is the rendering of סותה — for a woman attires herself in these to entice men to take notice of her (so that the word denotes a garment that attracts notice to its wearer, being a noun formed from the root סות, to entice or allure). Our Rabbis, too, explained this word (סותה) in the Talmud (Ketubot 111b) in the sense of allurement — the allurement of intoxication: they say, “And as for the wine in question, perhaps you will say that it cannot intoxicate — remember that Scripture says of it סותה “its allurement” (i.e. it has an allurement so that people drink more and more of it). "}, {"ch": 49, "v": 12, "aliyah": 4, "heb": "חַכְלִילִ֥י עֵינַ֖יִם מִיָּ֑יִן וּלְבֶן־שִׁנַּ֖יִם מֵחָלָֽב׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "יְסַמְּקוּן טוּרוֹהִי בְּכַרְמוֹהִי יְטוּפוּן נַעֲווֹהִי בַּחֲמָר יְחַוְּרָן בִּקְעֲתֵיהּ בְּעִיבוּר וּבְעֶדְרֵי עָנָא:", "onk_en": "His eyes are red from wine, [<b>His mountains will become red with his vineyards, / His winepresses will be flowing with wine,<\/b>] and his teeth are white [from an abundance of] milk [<b>His valleys will appear white from the abundance of grain and sheep<\/b>].", "pj": "מַה יָאִין הִינוּן עֵינוֹי דְמַלְכָּא מְשִׁיחָא כְּחַמְרָא זַכִּיכָא מִן לְמֵיחְמֵי גִילוּי עִירְיַין וְשַׁדְיוּת אֲדַם זַכַּאי וְשִׁינוֹי נַקְיַין מִן חַלְבָּא דְלָא לְמֵיכַל חֲטוֹף וַאֲנוּסָא וּכְדֵין יִסְמְקוּן טַוְורוֹי וּמַעֲצַרְתֵּיהּ מִן חַמְרָא וְגוּלְמָתוֹי יְחַוְורַן מִן עֲלַלְתָּא וּמִן דִירִין דְעָאן", "pj_en": "How beautiful are the eyes of the king Meshiha, as the pure wine! He cannot look upon what is unclean, nor on the shedding of the blood of the innocent; and his teeth, purer than milk, cannot eat that which is stolen or torn; and therefore his mountains are red with wine, and his hills white with corn, and with the cotes of flocks.", "tj": "מַה יָאִין אִנוּן עֵינוֹי דְמַלְכָּא מְשִׁיחָא לְמֵיחֲמֵי מִן חַמְרָא זַכִּיכָא מִלְמֵחְמֵי בְּהֵין גִילוּי עֲרָיוֹת וּשְׁפִיכוּת דַם זַכַּיי שִׁינוֹי בַּקְיַין כַּהֲלָכָה מִמֵיכַל בְּהֵין חֲמָסִין וְגָזְלִין יִסְמְקוּן טוּרוֹי מִן גוּפְנֵי מַעֲצַרְתֵּיהּ מִן חַמְרֵיהּ יְחַוְורוּן גוּלְמָתֵיהּ מִן סִיגוּי עִבּוּר וְעִדְרִין דְעָן:", "tj_en": "More beautiful are the eyes of the king Meshiha to behold than pure wine; they will not look upon that which is unclean, or the shedding of the blood of the innocent. His teeth are employed according to the precept rather than in eating the things of violence and rapine; his mountains shall be red with vines, and his presses with his wine, and his hills be white with much corn and with flocks of sheep.", "rashi": "<b>חכלילי.<\/b> לְשׁוֹן אֹדֶם, כְּתַרְגּוּמוֹ, וְכֵן לְמִי חַכְלִלוּת עֵינָיִם (משלי כ\"ג), שֶׁכֵּן דֶּרֶךְ שׁוֹתֵי יַיִן עֵינֵיהֶם מַאְדִּימִין:<br><br><b>מחלב.<\/b> מֵרֹב חָלָב, שֶׁיְּהֵא בְּאַרְצוֹ מִרְעֶה טוֹב לְעֶדְרֵי צֹאן; וְכֵן פֵּרוּשׁ הַמִּקְרָא: אֲדֹם עֵינַיִם יְהֵא מֵרֹב יַיִן וּלְבֶן שִׁנַּיִם יְהֵא מֵרֹב חָלָב. וּלְפִי תַרְגּוּמוֹ עֵינַיִם לְשׁוֹן הָרִים, שֶׁמִּשָּׁם צוֹפִים לְמֵרָחוֹק, וְעוֹד תִּרְגְּמוֹ בְּפָנִים אֲחֵרִים, לְשׁוֹן מַעְיָנוֹת וְקִלּוּחַ הַיְקָבִים, נַעֲווֹהִי – יְקָבִים שֶׁלּוֹ, וְלָשׁוֹן אֲרַמִּי הוּא בְּמַסֶּכֶת עֲ\"זָ (דף ע\"ד), נַעֲוָא אַרְתְּחוֹ יְחַוְּרָן בִּקְעָתֵהּ – תַּרְגּוּם שִׁנַּיִם, לְשׁוֹן שִׁנֵּי הַסְּלָעִים:", "rashi_en": "חכלילי [HIS EYES] ARE RED — חכלילי denotes redness, as the Targum renders it: they shall become red. Similar is (Proverbs 23:29) “who hath redness (חכלילות) of eyes?” Redness of eyes is associated with wine because that is what usually happens to those who drink much wine — their eyes become red.<br><br>מחלב [AND THE WHITENESS OF HIS TEETH IS] FROM MILK— because of abundance of milk, for there will be in his land good pasture for herds of flock. The verse is therefore to be explained as follows: There will be redness of eyes because of abundance of wine and there will be whiteness of teeth because of abundance of milk (the ם of of מיין and מחלב is not the מ comparativum: “His eyes shall be redder than wine etc.”). According to the Targum עינים means mountains which are called thus because from thence as a point of observation one can see afar off (i.e. it translates by “the mountains are red with wine”). He (Onkelos) further translates the verse in a different way, taking עינים in the sense of fountains and continuous flow of the wine-press.  The word נעווהי which Onkelos uses signifies his wine-presses. It is an Aramaic word that occurs in (Avodah Zarah 74b): “as for a tank (נעוא), cleanse it with hot water”. (The translation of the Targum is therefore: “His vats will stream with wine”.) The words יחורון בקעתה his valleys (the places wore mountains are, as it wore, cloven, בקע) are the Targum of [לבן] שנים, taking the second word in the sense of שני הסלעים rocky crags (cf. 1 Samuel 14:4 and Rashi on פי החירות Exodus 14:2 — where פִי = שִׁנַּיִם — and the reference there to the valley between the rocks). "}, {"ch": 49, "v": 13, "aliyah": 4, "heb": "זְבוּלֻ֕ן לְח֥וֹף יַמִּ֖ים יִשְׁכֹּ֑ן וְהוּא֙ לְח֣וֹף אֳנִיֹּ֔ת וְיַרְכָת֖וֹ עַל־צִידֹֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "זְבוּלֻן עַל סְפַר יַמְמַיָּא יִשְׁרֵי וְהוּא יְכַבֵּשׁ מְחוֹזִין בִּסְפִינַן וְטוּב יַמָּא יֵיכוּל וּתְחוּמֵיהּ יְהֵי מָטֵי עַל צִידוֹן:", "onk_en": "Zevulun will settle on seashores, he will be a harbor for ships [<b>conquer the borders with ships<\/b>]; [<b>he will consume the best of the sea<\/b>] his border will reach to Sidon.", "pj": "זְבוּלֻן עַל סַפְרֵי יַמָא יִשְׁרֵי וְהוּא יְהֵא שַׁלִיט בִּמְחוּזִין וּמְכַבֵּשׁ הֲפַרְכֵי יַמָא בִּסְפִינְתָּא וּתְחוּמֵיהּ יַמְטֵי עַד צִידוֹן", "pj_en": "Zebulon shall dwell upon the banks of the sea, and have dominion over the havens; he will surmount the breakers of the sea with ships and his border will extend unto Zidon.", "tj": "", "tj_en": "", "rashi": "<b>לחוף ימים.<\/b> עַל חוֹף יַמִּים תִּהְיֶה אַרְצוֹ (יבמות מ\"ה); חוֹף, כְּתַרְגּוּמוֹ סְפָר, מרק\"א בְּלַעַז, וְהוּא יִהְיֶה מָצוּי תָּדִיר עַל חוֹף אֳנִיּוֹת בִּמְקוֹם הַנָּמֵל, שֶׁאֳנִיּוֹת מְבִיאוֹת שָׁם פְּרַקְמַטְיָא, שֶׁהָיָה זְבוּלֻן עוֹסֵק בִּפְרַקְמַטְיָא וּמַמְצִיא מָזוֹן לְשֵׁבֶט יִשָּׂשכָר, וְהֵם עוֹסְקִים בַּתּוֹרָה. הוּא שֶׁאָמַר מֹשֶׁה שְׂמַח זְבוּלֻן בְּצֵאתֶךָ וְיִשָּׂשכָר בְּאֹהָלֶיךָ (דברים ל\"ג), זְבוּלֻן יוֹצֵא בִּפְרַקְמַטְיָא, וְיִשָּׂשכָר עוֹסֵק בַּתּוֹרָה בְּאֹהָלִים:<br><br><b>וירכתו על צידן.<\/b> סוֹף גְּבוּלוֹ יְהֵא סָמוּךְ לְצִידֹן: <b>ירכתו.<\/b> סוֹפוֹ, כְּמוֹ וּלְיַרְכְּתֵי הַמִּשְׁכָּן:", "rashi_en": "לחוף ימים TOWARDS THE COASTS OF THE SEAS — (לחוף is the same as על חוף): by the shore of the seas will be his land. הוף means “border” as Onkelos has it; old French marche; English border. [והוא לחוף אניות] means he will constantly be at the haven of ships — the port — whither the ships bring merchandise. For Zebulun was engaged in business and provided food for the tribe of Issachar whilst these engaged in the study of the Torah. It is to this that Moses alludes, (Deuteronomy 33:18) “Rejoice Zebulun in thy going out. and Issachar in thy tents”, — Zebulun goes forth to trade and Issachar studies the Torah in the tents (Midrash Tanchuma, Vayechi 11; cf. Rashi on Genesis ישב אהלים 25:27)<br><br>וירכתו על צידן AND HIS BORDER SHALL BE UNTO ZIDON — the end of his territory will extend close up to Zidon. ירכתו means his end, as (Exodus 26:22) ולירכתי המשכן “and for the ends of the Tabernacle”. "}, {"ch": 49, "v": 14, "aliyah": 4, "heb": "יִשָּׂשכָ֖ר חֲמֹ֣ר גָּ֑רֶם רֹבֵ֖ץ בֵּ֥ין הַֽמִּשְׁפְּתָֽיִם׃", "onk": "יִשָּׂשׂכָר עַתִּיר בְּנִכְסִין וְאַחֲסַנְתֵּיהּ בֵּין תְּחוּמַיָּא:", "onk_en": "Yissachar is a bony donkey [<b>rich in property<\/b>], crouching [<b>and his inheritance is<\/b>] between the borders.", "pj": "יִשָשׁכָר חֲמִיר בְּאוֹרַיְיתָא וְשֵׁבֶט תַּקִיף יְדַע כַּווֹנֵי בְּזִימְנַיָא וְהוּא מַרְבַּע בֵּינֵי תְּחוּמֵי אָחוֹי", "pj_en": "Issakar is an ass in the law; a strong tribe, knowing the order of the times; and he lieth down between the limits of his brethren.", "tj": "יִשָשׁכָר שִׁבְטָא תַּקִיף וּתְחוּמֵיהּ יֶהֱוֵי מְמַצַע בֵּינֵי תְּרֵין תְּחוּמַיָא:", "tj_en": "ISSAKAR is a strong tribe, and his limits shall be in the midst between two boundaries.", "rashi": "<b>יששכר חמר גרם.<\/b> חֲמוֹר בַּעַל עֲצָמוֹת, סוֹבֵל עֹל תּוֹרָה, כַּחֲמוֹר חָזָק שֶׁמַּטְעִינִין אוֹתוֹ מַשּׂאוֹי כָבֵד:<br><br><b>רובץ בין המשפתים.<\/b> כַּחֲמוֹר הַמְהַלֵּךְ בַּיּוֹם וּבַלַּיְלָה, וְאֵין לוֹ לִינָה בַּבַּיִת, וּכְשֶׁהוּא רוֹצֶה לָנוּחַ, רוֹבֵץ בֵּין הַתְּחוּמִין, בִּתְחוּמֵי הָעֲיָרוֹת שֶׁמּוֹלִיךְ שָׁם פְּרַקְמַטְיָא:", "rashi_en": "יששכר חמר גרם means ISSACHAR IS A BONY ASS — he bears the yoke of the Torah (i.e. obligations) like a strong ass upon which may be placed a heavy load (Genesis Rabbah 99:9).<br><br>רבץ בין המשפתים CROUCHING BETWEEN THE FOLDS — Like an ass that travels day and night and has no permanent stable of its own, so that when it wishes to rest it croucheth down between the borders — i.e. at the bounds of the cities whither it is earring merchandise ."}, {"ch": 49, "v": 15, "aliyah": 4, "heb": "וַיַּ֤רְא מְנֻחָה֙ כִּ֣י ט֔וֹב וְאֶת־הָאָ֖רֶץ כִּ֣י נָעֵ֑מָה וַיֵּ֤ט שִׁכְמוֹ֙ לִסְבֹּ֔ל וַיְהִ֖י לְמַס־עֹבֵֽד׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲזָא חוּלָקָא אֲרֵי טַב וְיָת אַרְעָא אֲרֵי מְעַבְּדָא פֵירִין וִיכַבֵּשׁ מָחוֹזֵי עַמְמַיָּא וִישֵׁיצֵי יָת דַּיָּרֵיהוֹן וּדְאִשְׁתַּאֲרוּן בְּהוֹן יְהוֹן לֵיהּ פַּלְחִין וּמַסְּקֵי מַסִּין:", "onk_en": "He saw that rest [<b>his portion<\/b>] is good, and that the land is pleasant [<b>produces fruit<\/b>]; he bent his shoulder to bear the burden [<b>and he will conquer territories of peoples and destroy their inhabitants<\/b>]; and became a servant to pay the tribute [<b>and those that remain will become workers to him and bring taxes<\/b>].", "pj": "וַחֲמָא נַיְיחָא דְעַלְמָא דְאָתֵי אֲרוּם טָב וְחוּלְקָא דְאַרְעָא דְיִשְרָאֵל אֲרוּם בְּסִימָא הוּא בְגִין כֵּן אַרְכִין כַּתְפֵיהּ לְמִלְעֵי בְּאוֹרַיְיתָא וַהֲווֹ לֵיהּ אָחוֹי מַסְקֵי דוֹרוֹנִין", "pj_en": "And he saw the rest of the world to come that it is good, and the portion of the land of Israel that it is pleasant; therefore bowed he his shoulders to labour in the law, and unto him shall come his brethren bearing presents.", "tj": "וַחֲזָא בֵּית מַקְדְשָׁא דְאִתְקְרֵי מְנוּחָה אֲרוּם טַב הוּא וְיַת אַרְעָא אֲרוּם שְׁמֵינִין אִינוּן פֵּירֵיהּ וְאַרְכַן כַּתְפֵיהּ לְמִלְעֵי בְּאוֹרַיְיתָא וַהֲוָן לֵיהּ כָּל אָחוֹי מַסְקֵי מִיסִין:", "tj_en": "And he saw the house of the sanctuary, which is called Quietness, that it is good, and the land that its fruits are rich; and bared his shoulders to labour in the law, and to him shall be all his brethren bringing tribute.", "rashi": "<b>וירא מנחה כי טוב.<\/b> רָאָה לְחֶלְקוֹ אֶרֶץ מְבֹרֶכֶת וְטוֹבָה לְהוֹצִיא פֵרוֹת:<br><br><b>ויט שכמו לסבול<\/b> עֹל תּוֹרָה:<br><br><b>ויהי.<\/b> לְכָל אֶחָיו יִשְׂרָאֵל:<br><br><b>למס עובד.<\/b> לִפְסֹק לָהֶם הוֹרָאוֹת שֶׁל תּוֹרָה וְסִדְרֵי עִבּוּרִין, שֶׁנֶּאֱמַר וּמִבְּנֵי יִשָּׂשכָר יוֹדְעֵי בִינָה לַעִתִּים לָדַעַת מַה יַּעֲשֶׂה יִשְׂרָאֵל רָאשֵׁיהֶם מָאתַיִם (דברי הימים א י\"ב), מָאתַיִם רָאשֵׁי סַנְהֶדְרָאוֹת הֶעֱמִיד וְכָל אֲחֵיהֶם עַל פִּיהֶם:<br><br><b>ויט שכמו.<\/b> הִשְׁפִּיל שִׁכְמוֹ, כְּמוֹ וַיֵּט שָׁמַיִם (שמואל ב כ\"ב), הַטּוּ אָזְנְכֶם (תהילים ע\"ח). וְאֻנְקְלוֹס תִּרְגְּמוֹ בְּפָנִים אֲחֵרִים, <b>ויט שכמו לסבול<\/b> מִלְחָמוֹת וְלִכְבֹּשׁ מְחוֹזוֹת, שֶׁהֵם יוֹשְׁבִים עַל הַסְּפָר, <b>ויהי<\/b> הָאוֹיֵב כָּבוּשׁ תַּחְתָּיו <b>למס עובד<\/b>:", "rashi_en": "וירא מנחה כי טוב AND HE SAW THAT REPOSE WAS GOOD — He chose (ראה) as his portion a land that was blessed and well-fitted to produce fruits (cf. Onkelos; so that he need not engage overmuch in business.<br><br>ויט שכמו  לסבול AND HE INCLINED THE SHOULDER TO RECEIVE THE BURDEN namely the burden of tracking the Torah.<br><br>ויהי AND BECAME unto all Israel his brethren.<br><br>למס עובד A SERVANT UNTO TRIBUTE — deciding for them points of Law and the rules with regard to the fixing of leap-years, as it is said (1 Chronicles 12:32) “And of the children of Issachar, men that had understanding of the times, to know what Israel ought to do; the heads of them were two hundred” — two hundred heads of the Sanhedrin he provided — “and all their brethren were at their commandment” (Genesis Rabbah 99:10).<br><br>ויט שכמו AND HE INCLINED HIS SHOULDER — he lowered his shoulder; similar are, (2 Samuel 22:10) “He bowed (ויט) the heavens” and (Psalms 78:1) “Incline (הטו) your ear”. Onkelos, however, explains it differently: HE BOWED HIS SHOULDER to wage wars and to conquer new districts — for he (Issachar) dwelt on the marches — AND the enemy BECAME subject to him AS A SERVANT TO PAY TRIBUTE. "}, {"ch": 49, "v": 16, "aliyah": 4, "heb": "דָּ֖ן יָדִ֣ין עַמּ֑וֹ כְּאַחַ֖ד שִׁבְטֵ֥י יִשְׂרָאֵֽל׃", "onk": "מִדְּבֵית דָּן יִתְבְּחַר וִיקוּם גַּבְרָא בְּיוֹמוֹהִי יִתְפְּרֵק עַמֵּיהּ וּבִשְׁנוֹהִי יְנוּחוּן כַּחֲדָא שִׁבְטַיָּא דְיִשְׂרָאֵל:", "onk_en": "Dan will avenge his people [<b>From the house of Dan a man will be chosen and will arise, in his day his people will be delivered<\/b>], as one of the tribes of Israel [<b>and in his years the tribes of Israel will rest together<\/b>].", "pj": "מִדְבֵית דָן עָתִיד דְיֵיקוּם גַבְרָא דְיָדוֹן יַת עַמֵיהּ דִינִין דִקְשׁוֹט כַּחֲדָא יִשְׁתַּמְעוּן לֵיהּ שִׁבְטַיָא דְיִשְרָאֵל", "pj_en": "From the house of Dan there is to arise a man who will judge his people with the judgment of truth. All the tribes of Israel will hearken to him together.", "tj": "", "tj_en": "", "rashi": "<b>דן ידין עמו.<\/b> יִנְקֹם נִקְמַת עַמּוֹ מִפְּלִשְׁתִּים כְּמוֹ כִּי יָדִין ה' עַמּוֹ (דברים ל\"ב):<br><br><b>כאחד שבטי ישראל.<\/b> כָּל יִשְׂרָאֵל יִהְיוּ כְּאֶחָד עִמּוֹ, וְאֶת כֻּלָּם יָדִין, וְעַל שִׁמְשׁוֹן נִבָּא נְבוּאָה זוֹ; וְעוֹד יֵשׁ לְפָרֵשׁ <b>כאחד שבטי ישראל<\/b>, כַּמְיֻחָד שֶׁבַּשְּׁבָטִים, הוּא דָּוִד, שֶׁבָּא מִיהוּדָה:", "rashi_en": "דן ידין עמו means DAN WILL TAKE VENGEANCE FOR HIS PEOPLE from the Philistines, the phrase having the same meaning as in (Deuteronomy 32:30) “For the Lord will avenge (ידין) his people”.<br><br>כאחד שבטי ישראל means ALL THE TRIBES OF ISRAEL WILL BE AT ONE with him and he will take vengeance for all of them. This prophecy alludes to Samson (Genesis Rabbah 99:11). One might also explain כאחד שבטי ישראל thus: “[Dan will take vengeance for his people as did] the most distinguished tribe (המיוחד) among the tribes of Israel” — alluding to David who was of the tribe of Judah (Genesis Rabbah 99:11)."}, {"ch": 49, "v": 17, "aliyah": 4, "heb": "יְהִי־דָן֙ נָחָ֣שׁ עֲלֵי־דֶ֔רֶךְ שְׁפִיפֹ֖ן עֲלֵי־אֹ֑רַח הַנֹּשֵׁךְ֙ עִקְּבֵי־ס֔וּס וַיִּפֹּ֥ל רֹכְב֖וֹ אָחֽוֹר׃", "onk": "יְהֵי גַבְרָא דְּיִתְבְּחַר וִיקוּם מִדְּבֵית דָּן אֵימְתֵיהּ תִּתְרְמֵי עַל עַמְמַיָּא וּמְחָתֵיהּ תִּתְקֵף בִּפְלִשְׁתָּאֵי כְּחִיוֵי חוּרְמָן יִשְׁרֵי עַל אָרְחָא וּכְפִתְנָא יִכְמוֹן עַל שְׁבִילָא יְקַטֵּל גִּבָּרֵי מַשִּׁרְיַת פְּלִשְׁתָּאֵי פָּרָשִׁין עִם רַגְלָאִין יְעַקֵּר סוּסָוָן וּרְתִכִּין וִימַגֵּר רוֹכְבֵיהוֹן לַאֲחוֹרָא:", "onk_en": "Dan will be a serpent on the road, [<b>The man that will be chosen and will arise from the house of Dan û his terror will fall upon the peoples, and his smiting will be strong against the Pelishtim. Like a viper he will lie on the way,<\/b>] a viper on the path [<b>and like an old snake he will ambush on the path<\/b>], that bites the horse’s heel [<b>He will kill the mighty of the camp of the Plishtim / the horsemen with the infantry / He will uproot the horses and chariots<\/b>] so that the rider falls backward [<b>and he will cause their riders to fall backward<\/b>].", "pj": "יְהֵי גַבְרָא דְיִתְבְּחַר וִיקוּם מִדְבֵית דָן מְדַמֵי לְחוּרְמָנָא דִרְבִיעַ עַל פַּרְשַׁת אוֹרְחָא וּלְרֵישֵׁיהּ חִיוְיַין דִכְמִין עַל שְׁבִילָא דִנְכֵית סוּסְיָא בְּעִיקְבֵיהּ וְנָצִיל מִן אֵימָתֵיהּ רְכָבֵיהּ מִתְפַּרְקִיד לַאֲחוֹרֵיהּ הֵיכְדֵין יַקְטִיל שִׁמְשׁוֹן בַּר מָנוֹחַ יַת כָּל גִבָּרֵי פְּלִשְׁתָּאֵי לְפַרְשְׁיָא וּלְרַגְלָאֵי וְיֶעֱקַר סוּסְוַתְהוֹן וּמְמַגֵר דְבָבֵהוֹן לַאֲחוֹרָא", "pj_en": "A chosen man shall arise from the house of Dan, like the basilisk which lieth at the dividing of the way, and the serpent's head which lurketh by the way, that biteth the horse in his heel, and the master from his terror is thrown backward. Even thus will Shimshon bar Manovach slay all the heroes of Philistia, the horsemen and the foot; he will hamstring their horses and hurl their riders backwards.", "tj": "יֶהֱוֵי פְּרוֹקָא דַעֲתִיד לְמֵיקָם יִתְקֵף וְיִתְגָאֶה עַל כָּל מַלְכְּוָותָא וְהוּא יֶהֱוֵי מְדַמֵי לְחִיוְיָא דִרְבִיעַ בְּאוֹרְחָא וּלְחוּרְמָנָא דִכְמִין בְּפָרָשַׁת אוֹרְחֲתָא דִמְחָא לְסוּסָא בְּעִיקְבֵיהּ וּמִן אֵימָתֵיהּ מִסְתַּבֵר רוֹכְבֵיהּ לְאִיתְהָפִיךְ לַאֲחוֹרֵיהּ וְהוּא שִׁמְשׁוֹן בַּר מָנוֹחַ דְאֵימְתֵיהּ עַל בַּעֲלֵי דְבָבוֹי וּדְחַלְתֵּיהּ עַל שַנְאוֹי וּמַקְטִיל מַלְכִין עִם שִׁלְטוֹנִין:", "tj_en": "(Of DAN) He will be the deliverer who is to arise, strong will he be and elevated above all kingdoms. And be will be like the serpent that lieth in the way, and the basilisk which lurketh at the dividing of the road, which striketh the horse in his heel, and thinketh by the terror of him to throw his rider backward. He is Shimshon bar Manovach (Sampson), who will be a terror upon his adversaries, and a fear upon them that hate him, and who will slay kings with princes.", "rashi": "<b>שפיפן.<\/b> הוּא נָחָשׁ; וְאוֹמֵר אֲנִי שֶׁקָּרוּי כֵּן עַל שֵׁם שֶׁהוּא נוֹשֵׁף, כְּמוֹ וְאַתָּה תְּשׁוּפֶנּוּ עָקֵב (בראשית ג'):<br><br><b>הנשך עקבי סוס.<\/b> כָּךְ דַּרְכּוֹ שֶׁל נָחָשׁ, וְדִמָּהוּ לְנָחָשׁ הַנּוֹשֵׁךְ עִקְּבֵי סוּס, <b>ויפל רכבו אחור<\/b> – שֶׁלֹּא נָגַע בּוֹ. וְדֻגְמָתוֹ מָצִינוּ בְּשִׁמְשׁוֹן: וַיִּלְפֹּת שִׁמְשׁוֹן אֶת שְׁנֵי עַמּוּדֵי הַתָּוֶךְ וְגוֹמֵר (שופטים ט\"ז) – וְשֶׁעַל הַגַּג מֵתוּ; וְאֻנְקְלוֹס תִּרְגֵּם כְּחִוֵּי חוּרְמָן, שֵׁם מִין נָחָשׁ, שֶׁאֵין רְפוּאָה לִנְשִׁיכָתוֹ, וְהוּא צִפְעוֹנִי, וְקָרוּי חוּרְמָן עַל שֵׁם שֶׁעוֹשֶׂה הַכֹּל חֵרֶם; וּכְפִיתְנָא – כְּמוֹ פֶתֶן, יִכְמוֹן – יֶאֱרֹב:", "rashi_en": "שפיפן is another name for a נחש. I am of opinion that it is thus called because it hisses (נושף) when biting. Similarly we have, (Genesis 3:15) “and thou shalt bite (תשיפנו) at their heel” (cf. Rashi thereon).<br><br>הנשך עקבי סוס THAT BITETH THE HORSE’S HEELS — this is the manner of the serpent. Scripture compares him to a serpent that bites the horse’s heels ויפל רכבו אחור THAT HIS RIDER FALLETH BACKWARD without it (the serpent) having touched him at all. We find the analogy to this in the case of Samson with reference to whom this prophecy was made (Judges 16:29): “And Samson took fast hold of the two middle pillars etc.” — and those on the roof died though not directly attacked. Onkelos translates נחש by כחיוי חורמן, like the serpent “Churman”, which is the name of a kind of serpent the bite of which is incurable. It is the serpent which in Hebrew is called צפעוני. It is called a חורמן because it destroys (חרם) everything. The word וכפיתנא in the Targum means “and like a פתן” (like an asp). יכמון in the Targum means יארוב “he lies in wait”."}, {"ch": 49, "v": 18, "aliyah": 4, "heb": "לִישׁוּעָֽתְךָ֖ קִוִּ֥יתִי יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לְפוּרְקָנָךְ סַבָּרִית יְיָ:", "onk_en": "For your deliverance, I wait, Adonoy.", "pj": "אֲמַר יַעֲקב כַּד חָמָא יַת גִדְעוֹן בַּר יוֹאָשׁ וְיַת שִׁמְשׁוֹן בַּר מָנוֹחַ דְקַיְימִין לִפְרוֹקִין לָא לְפוּרְקָנֵיהּ דְגִדְעוֹן אֲנָא מַסְכֵּי וְלָא לְפוּרְקָנֵיהּ דְשִׁמְשׁוֹן אֲנָא מוֹדִיק דְפוּרְקַנְהוֹן פּוּרְקַן דְשַׁעְתָּא אֱלָהֵין לְפוּרְקָנָךְ סָכִית וְאוֹדִיקִית יְיָ דְפוּרְקָנָךְ פּוּרְקַן עַלְמִין", "pj_en": "When Jakob saw Gideon bar Joash and Shimshon bar Manovach, who were established to be deliverers, he said, I expect not the salvation of Gideon, nor look I for the salvation of Shimshon; for their salvation will be the salvation of an hour; but for Thy salvation have I waited, and will look for, O Lord; for Thy salvation is the salvation of eternity.", "tj": "אָמַר אֲבוּנָן יַעֲקב לָא לְפוּרְקָנֵיהּ דְגִדְעוֹן בַּר יוֹאָשׁ סַכְיַית נַפְשִׁי דְהוּא שָׁעָה וְלָא לְפוּרְקָנֵיהּ דְשִׁמְשׁוֹן דְהוּא פּוּרְקַן עֲבִיר אֶלָא לְפוּרְקָנָא דְאַמֵרַת בְּמֵימְרָךְ לְמֵיתֵי לְעַמָךְ בְּנֵי יִשְרָאֵל לֵיהּ לְפוּרְקָנָךְ סַכְיַית נַפְשִׁי:", "tj_en": "Our father Jakob said, My soul hath not waited for the redemption of Gideon bar Joash which is for an hour, nor for the redemption of Shimshon which is a creature redemption, but for the Redemption which Thou hast said in Thy Word shall come for Thy people the sons of Israel, for this Thy Redemption my soul hath waited.", "rashi": "<b>לישועתך קויתי ה'.<\/b> נִתְנַבֵּא שֶׁיְּנַקְּרוּ פְּלִשְׁתִּים אֶת עֵינָיו, וְסוֹפוֹ לוֹמַר זָכְרֵנִי נָא וְחַזְּקֵנִי נָא אַךְ הַפַּעַם וְגוֹ' (שופטים ט\"ז):", "rashi_en": "'לישועתך קויתי ה I HOPE FOR THY AID, O ETERNAL — He prophesied that the Philistines would put out his (Samson’s) eyes, and that he would have to say (Judges 16:28) “Remember me, I pray Thee, and strengthen me, I pray Thee, only this once etc.” "}, {"ch": 49, "v": 19, "aliyah": 5, "heb": "גָּ֖ד גְּד֣וּד יְגוּדֶ֑נּוּ וְה֖וּא יָגֻ֥ד עָקֵֽב׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "מִדְּבֵית גָּד מַשִּׁרְיַת מְזַיְּנִין כַּד יַעַבְרוּן יָת יַרְדְּנָא קֳדָם אֲחֵיהוֹן לִקְרָבָא וּבְנִכְסִין סַגִּיאִין יְתוּבוּן לְאַרְעֲהוֹן:", "onk_en": "[<b>From the house of<\/b>] Gad will be an assailing [<b>armed<\/b>] troop[<b>s will pass over the Jordan before their brothers to war<\/b>]; he will be a troop at their heels [<b>and they will return to their land with much property<\/b>].", "pj": "שִׁבְטָא דְגָד יַעַבְרוּן מְזַיְינִין עִם שְׁאָר שִׁבְטַיָיא יַת נַחֲלֵי אַרְנוֹנָא וְהִינוּן יִכְבְּשׁוּן קֳדָמֵיהוֹן יַת עַמוּדַיָיא דְאַרְעָא וְהִינוּן יְהַדְרוּן מְזַיְינִין בְּסוֹפָא בְּנִכְסִין סַגִיאִין וְיִשְׁרוּן בְּשַׁלְיוּתָא לְהָלְאָה עִיבַר יוֹרְדְנָא דִכְדֵין אִתְרְעוּן וַהֲוָת לְהוֹן וְאִתְקַבְּלוּ אַחְסַנְתְּהוֹן", "pj_en": "The tribe of Gad with the rest of the tribes will, armed, pass over the streams of Arnona and subdue before them the pillars of the earth, and armed will they return into their limits with much substance and dwell in peace beyond the passage of Jardena; for so will they choose, and it shall be to them to receive their inheritance.", "tj": "מִדְבֵית גָד יִפְקוּן מְשִׁירְיַן מִטַכְסִין זְיָנִין וְאִינוּן יַעַבְרוּן יַת יִשְרָאֵל יַת יַרְדְנָא וְאִינוּן יַחְסְנוּן יַתְהוֹן יַת אַרְעָא דִכְנָעַן וּבָתַר כֵּן יַחְזְרוּן בִּשְׁלָם לְמַשְׁכְּנֵהוֹן:", "tj_en": "From the house of GAD will go forth hosts arrayed in arms. They will bring Israel over Jardena put them in possession of the land of Kenaan, and afterwards return in peace to their tabernacles.", "rashi": "<b>גד גדוד יגודנו.<\/b> כֻּלָּם לְשׁוֹן גְּדוּד הֵם, וְכָךְ חִבְּרוֹ מְנַחֵם; וְאִם תֹּאמַר, אֵין גְּדוּד בְּלֹא שְׁנֵי דַּלְתִי\"ן, יֵשׁ לוֹמַר גְּדוּד שֵׁם דָּבָר צָרִיךְ שְׁנֵי דַּלְתִי\"ן, שֶׁכֵּן דֶּרֶךְ תֵּבָה בַּת שְׁתֵּי אוֹתִיּוֹת לִכְפֹּל בְּסוֹפָהּ, וְאֵין יְסוֹדָהּ אֶלָּא שְׁתֵּי אוֹתִיּוֹת, וְכֵן אָמַר כַּצִּפּוֹר לָנוּד (משלי כ\"ו), מִגִּזְרַת שָׂבַעְתִּי נְדֻדִים (איוב ז'), שָׁם נָפַל שָׁדוּד (שופטים ה'), מִגִּזְרַת יָשׁוּד צָהֳרָיִם (תהלים צ\"א), אַף יָגֻד, יְגוּדֶנּוּ וּגְדוּד מִגִּזְרָה אַחַת הֵם; וּכְשֶׁהוּא מְדַבֵּר בִּלְשׁון יִפְעֹל אֵינוֹ כָפוּל, כְּמוֹ יָגוּד, יָנוּד, יָרוּם, יָשׁוּד, יָשׁוּב, וּכְשֶׁהוּא מִתְפַּעֵל אוֹ מַפְעִיל אֲחֵרִים הוּא כָפוּל, כְּמוֹ יִתְגּוֹדֵד, יִתְרוֹמֵם, יִתְבּוֹלֵל, יִתְעוֹדֵד; וּבִלְשׁוֹן מַפְעִיל, יָתוֹם וְאַלְמָנָה יְעוֹדֵד (תהילים קמ\"ו), לְשׁוֹבֵב יַעֲקֹב אֵלָיו (ישעיה מ\"ט), מְשֹׁבֵב נְתִיבוֹת (שם נ\"ח), יְגוּדֶנּוּ הָאָמוּר כָּאן אֵינוֹ לְשׁוֹן שֶׁיִּפְעֲלוּהוּ אֲחֵרִים, אֶלָּא כְּמוֹ יָגוּד הֵימֶנּוּ, כְּמוֹ בָּנַי יְצָאֻנִי (ירמיהו י') – יָצְאוּ מִמֶּנִּי. <b>גד גדוד יגודנו<\/b>, גְּדוּדִים יָגוֹדּוּ הֵימֶנּוּ שֶׁיַּעַבְרוּ הַיַּרְדֵּן עִם אֲחֵיהֶם לַמִּלְחָמָה כָּל חָלוּץ עַד שֶׁנִּכְבְּשָׁה הָאָרֶץ:<br><br><b>והוא יגוד עקב.<\/b> כָּל גְּדוּדָיו יָשׁוּבוּ עַל עֲקֵבָם לְנַחֲלָתָם שֶׁלָּקְחוּ בְּעֵבֶר הַיַּרְדֵּן, וְלֹא יִפָּקֵד מֵהֶם אִישׁ:<br><br><b>עקב.<\/b> בְּדַרְכָּן וּבִמְסִלּוֹתָם שֶׁהָלְכוּ, יָשׁוּבוּ, כְּמוֹ וְעִקְּבוֹתֶיךָ לֹא נֹדָעוּ (תהילים ע\"ז), וְכֵן בְּעִקְבֵי הַצֹּאן (שיר א'), בִּלְשׁוֹן לַעַז טרצי\"אם:", "rashi_en": "גד גדוד יגודנו GAD, AN ASSAILING TROOP SHALL ASSAIL HIM — all the words in this verse which have, the letters גד are connected in meaning with the word גדוד and so also did Menachem ben Seruk classify them. Should you say, however, that גדוד has always two ד’s and these words have only one, the answer is: The word גדוד is a noun and therefore requires two ד’s, for it is the way of a biliteral root to have the second letter doubled when used as a noun; the root proper, however, consists only of two letters. Thus it says, (Proverbs 26:2) כצפור לנוד “the wandering sparrow”, (לנוד a verb, infinitive) of the same derivation as נדודים in (Job 7:4) “I am full of גדודים wanderings” (a noun); (Judges 5:27) ‘‘there he fell down (שדוד) dead”, a noun in meaning, which is of the same derivation as the verb in (Psalms 41:6) “that wasteth (ישוד) at moon-day”. So, also, יגודנו ,יגוד and גדוד have the same derivation. When, also, one uses such biliteral roots in the future tense Kal, it (the second letter) is not doubled. For example:  יגוד he will troop, ינוד he will wander, ירום he will be high, ישוד he will devastate, ישוב he will come back. When, however, such a root is used in a reflexive sense (Hithpael) or in a causative-transitive sense the second letter is doubled Examples are: יתעודד ,יתרומם ,יתבולל ,יתגודד. Examples of the causative-transitive sense are: (Psalms 146:9) “He strengtheneth (יעודד) the fatherless and the widow”; (Isaiah 49:5) “To bring Jacob back (לשובב) to Him”; (Isaiah 48:12) “The restorer (משובב) of paths”. The form יגודנו which is used here has not the force that others will make him do something (i.e. it has not this causative-transitive sense with the direct accusative suffix נוּ) but it means “a troop will troop out from him”, exactly the same as (Jeremiah 10:20) בני יצאוני which means “my children have gone forth from me”, (as we might say “have left me”). (Cf. Rashi on Genesis דברו לשלום 37:4, and on תמלאמו Exodus 15:9.). גד גדוד יגודנו accordingly means, “troops will troop out of him” signifying that they (the Gadites) will cross the Jordan with their brethren, all armed, and remain with them until the land will have been conquered.<br><br>והוא יגד עקב means all his troops will return in their own tracks back to their territory which they will receive on the other side of the Jordan and not one of them will be missing.<br><br>עקב This means: By the same roads and paths upon which they had traveled shall they return. The word עקב has the same meaning as in (Psalms 128:20) “And thy foot-steps (עקבותיך) were not known”; (Song of Songs 1:8) “by the footsteps (עקבות) of the flock”. In old French traces; English, tracks."}, {"ch": 49, "v": 20, "aliyah": 5, "heb": "מֵאָשֵׁ֖ר שְׁמֵנָ֣ה לַחְמ֑וֹ וְה֥וּא יִתֵּ֖ן מַֽעֲדַנֵּי־מֶֽלֶךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דְּאָשֵׁר טָבָא אַרְעֵיהּ וְהוּא מְרַבְיָא בְּתַפְנוּקֵי מַלְכִין:", "onk_en": "From Asher will come oily food [<b>The land of Asher is good<\/b>], he will provide [<b>it produces<\/b>] delicacies for the king.", "pj": "טוֹבוֹי דְאָשֵׁר מִן שְׁמֵינִין הִינוּן פֵּירוֹי אַרְעֲיָא מַרְבְּיָת בּוּשְמִין וְעִיקְרֵי סַמָנִין", "pj_en": "Happy is Asher whose fruitage is plenteous, and whose land aboundeth in balsams and costly perfumes.", "tj": "טוֹבוֹי דְאָשֵׁר מַה שְׁמֵינָה הִיא אַרְעָא וְאַרְעֵיהּ תֶהֱוֵי מַסְפִּיקָא תַּפְנוּקֵי מַלְכַיָא דִבְנֵי יִשְרָאֵל:", "tj_en": "Of happy ASHER how fertile is the land! His land shall satisfy with dainties the kings of the sons of Israel.", "rashi": "<b>מאשר שמנה לחמו.<\/b> מַאֲכָל הַבָּא מֵחֶלְקוֹ שֶׁל אָשֵׁר יְהֵא שָׁמֵן, שֶׁיִּהְיוּ זֵיתִים מְרֻבִּים בְּחֶלְקוֹ וְהוּא מוֹשֵׁךְ שֶׁמֶן כְּמַעְיָן; וְכֵן בֵּרְכוֹ מֹשֶׁה וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ, כְּמוֹ שֶׁשָּׁנִינוּ בִמְנָחוֹת (דף פ\"ה) פַּעַם אַחַת הֻצְרְכוּ אַנְשֵׁי לוּדְקִיָּא לְשֶׁמֶן וְכוּ':", "rashi_en": "מאשר שמנה לחמו OUT OF ASHER COMETH HIS FAT BREAD —The food that will come from the territory of Asher will be fat, for there will be numerous olive-trees in his territory so that it will flow with oil like a fountain. Moses blessed him in a like manner: (Deuteronomy 33:24) “and he will dip his foot in oil”. So we learn in  the Treatise of Menachot 85b: once the people of Laodicia were in need of oil. Their agent was able to obtain the very large quantity they required only at a city in Asher, having failed at Jerusalem and other cities. "}, {"ch": 49, "v": 21, "aliyah": 5, "heb": "נַפְתָּלִ֖י אַיָּלָ֣ה שְׁלֻחָ֑ה הַנֹּתֵ֖ן אִמְרֵי־שָֽׁפֶר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "נַפְתָּלִי בְּאַרַע טָבָא יִתְרְמֵי עַדְבֵיהּ וְאַחֲסַנְתֵּיהּ תְּהֵי מְעַבְּדָא פֵירִין יְהוֹן מוֹדַן וּמְבָרְכִין עֲלֵיהוֹן:", "onk_en": "Naftali is a gazelle-like messenger, [<b>The lot of Naftali will fall on a good land. His inheritance will yield fruit,<\/b>] he delivers pleasant Sayings [<b>they will give thanks and blessings over them<\/b>].", "pj": "נַפְתָּלִי עַזְגַד קָלִיל דָמֵי לְאַיְילָא דְרָהִיט עַל שִׁינֵי טוּרַיָיא מְבַשֵר בְּשׁוּרַן טָבָן הוּא בִּשַר דְעַד כְּדוֹן יוֹסֵף קַיֵים וְהוּא אִזְדַרַז וַאֲזַל לְמִצְרַיִם וְאַיְיתִי אוֹנִיתָא דַחֲקִיל כְּפִילְתָּא דְלֵית בָּהּ לְעֵשָו חוּלְקָא וְכַד הֲוָה פָּתַח פּוּמֵיהּ בִּכְנִשְׁתָּא דְיִשְרָאֵל לִמְשַׁבְּחָא מִבְחַר מִכָּל לִשְׁנַיָא", "pj_en": "Naphatali is a swift messenger, like a hind that runneth on the tops of the mountains, bringing good tidings: he it was who announced that Joseph was living; he it was who hasteneth to go into Mizraim, and bring the contract of the double field in which Esau had no portion; and when he shall open his mouth in the congregation of Israel to give praise, he shall be the chosen of all tongues.", "tj": "נַפְתָּלִי עַזְגַד דְקַלִיל לְמִיבְשַר בְּשׁוּרָן טָבָן וְהוּא בִּשַר לַאֲבוּנָן יַעֲקב מִן שֵׁירוּיָא דְהוּא עַד כְּדוֹן יוֹסֵף בְּחַיִין וְהוּא נָחִית לְמִצְרַיִם בְּשָׁעָא זְעֵירָא וְאַיְיתֵי אוֹנִיתָא דְחַקְלָא כְּפִיל מִן פְּלָטִין דְיוֹסֵף וּכְשֶׁהוּא פָּתַח פּוּמֵיהּ בִּכְנִישְׁתָּא דְיַעֲקב לִישָׁנֵיהּ חָלֵי כְדוּבְשָׁא:", "tj_en": "NAPHTALI is a swift messenger declaring good tidings. He first declared to our father Jakob that Joseph was yet in life, and he went down to Mizraim in a little time, and brought the contract of the Double Field from the palace of Joseph. And when he openeth his mouth in the congregation of Jakob, his tongue is sweet as honey.", "rashi": "<b>אילה שלחה.<\/b> זוֹ בִקְעַת גִּינוֹסַר שֶׁהִיא קַלָּה לְבַשֵּׁל פֵּרוֹתֶיהָ כְּאַיָּלָה זוֹ שֶׁהִיא קַלָּה לָרוּץ. אַיָּלָה שְׁלֻחָה – אַיָּלָה מְשֻׁלַּחַת לָרוּץ:<br><br><b>הנתן אמרי שפר.<\/b> כְּתַרְגּוּמוֹ. דָּ\"אַ עַל מִלְחֶמֶת סִיסְרָא נִתְנַבֵּא – וְלָקַחְתָּ עִמְּךָ עֲשֶׂרֶת אֲלָפִים אִישׁ מִבְּנֵי נַפְתָּלִי וְגוֹ' (שופטים ד'), וְהָלְכוּ שָׁם בִּזְרִיזוּת, וְכֵן נֶאֱמַר שָׁם לְשׁוֹן שִׁלּוּחַ בָּעֵמֶק שֻׁלַּח בְּרַגְלָיו:<br><br><b>הנתן אמרי שפר.<\/b> עַל יָדָם שָׁרוּ דְּבוֹרָה וּבָרָק שִׁירָה. וְרַבּוֹתֵינוּ דְּרָשׁוּהוּ עַל יוֹם קְבוּרַת יַעֲקֹב כְּשֶׁעִרְעֵר עֵשָׂו עַל הַמְּעָרָה, בְּמַסֶּכֶת סוֹטָה (דף י\"ג); וְתַרְגּוּמוֹ יִתְרְמֵי עַדְבֵהּ – יִפֹּל חֶבְלוֹ, וְהוּא יוֹדֶה עַל חֶלְקוֹ אֲמָרִים נָאִים וְשֶׁבַח:", "rashi_en": "אילה שלחה is symbolical of the valley of Gennesareth which ripens its fruits very quickly, just as a hind runs rapidly (Genesis Rabbah 99:12). אילה שלחה means A HIND LET LOOSE that it may run where it pleases.<br><br>הנותן אמרי שפר Understand this as the Targum does: They (the people of Naphtali) will give thanks to and will praise God for them (for the fruits). Another explanation of the verse is: He prophesied about the war with Sisera, with regard to which Scripture says, (Judges 4:6) “and take with thee ten thousand men of the children of Naphtali etc.” — and they marched thither most rapidly. There, too, is the expression שלח used: (v.15) “into the valley they rushed (שלח) at his feet”.<br><br>הנתן אמרי שפר HE GIVETH SAYINGS OF PLEASANTNESS — Due to them (to the ten thousand men of Naphtali) Deborah and Barak sang the song of praise (Judges ch. 5). Our Teachers explained the verse as an allusion to what happened on the day when Jacob was buried, when Esau claimed the cave of Machpelah. They were compelled to delay the burial whilst Naphtali ran rapidly back to Egypt and brought the title-deed of the cave etc. as is related in Treatise Sotah 13a. The words in the Targum יתרמי עדביה mean “his lot shall fall”, so that the second half of the verse would mean according to the Targum, “he will give thanks for his lot with pleasing words and with praise”."}, {"ch": 49, "v": 22, "aliyah": 5, "heb": "בֵּ֤ן פֹּרָת֙ יוֹסֵ֔ף בֵּ֥ן פֹּרָ֖ת עֲלֵי־עָ֑יִן בָּנ֕וֹת צָעֲדָ֖ה עֲלֵי־שֽׁוּר׃", "onk": "בְּרִי דְיִסְגֵּי יוֹסֵף בְּרִי דְיִתְבָּרַךְ כְּגֹפֶן דִּנְצֵיב עַל עֵינָא דְמַיָּא תְּרֵין שִׁבְטִין יִפְּקוּן מִבְּנוֹהִי יְקַבְּלוּן חוּלָקָא וְאַחֲסַנְתָּא:", "onk_en": "A fruitful son is Yoseif, [<b>Yoseif is a son who will increase,<\/b>] a fruitful son at the well [source] [<b>a son who will be blessed like a vine planted by a spring of water<\/b>]. Daughters tread on the wall. [<b>Two tribes will emerge from his sons, they will receive a portion and an inheritance.<\/b>]", "pj": "בְּרִי דְרָבִית יוֹסֵף בְּרִי דְרָבִית וּתְקֵיפַת וְסוֹף הֲוָה עֲלָךְ לְמִתְקַף דְכַבְּשַׁת יִצְרָךְ בְּעוּבְדָא דְרִבּוֹנְתָּךְ וּבְעוּבְדָא דְאָחָךְ מְדַמֵי אֲנָא לָךְ לְגוּפָן שְׁתִילָא עַל מַבּוּעִין דְמַיִין דִשְׁלָחָת שׁוּרְשָׁהָא וְתַבְרַת שִׁינֵי כֵיפַיָא וּבְעוּבְרָתָהָא כַּבְשַׁת כָּל אִילָנֵי סַרְקָא כֵּן כָּבַשְׁתָּא יוֹסֵף בְּרִי בְּחָכְמָתָךְ וּבְעוֹבָדָךְ טַבְיָא כָּל חָרְשֵׁי מִצְרָאֵי וְכַד הֲווֹ מְקַלְסִין קֳדָמָךְ הֲווֹ בְּנַתְהוֹן דְשִׁלְטוֹנַיָא מְהַלְכַן עַל טוּרַיָיא וְשַׁדְיָין לְקַמָךְ שִׁירִין וְקַטְלָאִין דְדַהֲבָא מִן בִּגְלַל דְתִתְּלֵי עֵינָךְ בָּהֵן וְלָא תָלִיתָא עֵינָךְ בַּחֲדָא מִנְהוֹן לְמִתְחַיְיבָא בְּהוֹן לְיוֹם דִינָא רַבָּא", "pj_en": "Joseph, my son, thou hast become great; Joseph, my son, thou hast become great and mighty; the end (determined) on thee was (that thou shouldst) be mighty, because thou didst subdue thy inclination in the matter of thy mistress, and in the work of thy brethren. Thee will I liken to a vine planted by fountains of water, which sendeth forth her roots, and overrunneth the ridges of stone, and covereth by her branches all unfruitful trees; even so didst thou my son Joseph subject by thy wisdom and thy good works all the magicians of Mizraim; and when, celebrating thy praises, the daughters of princes walking on the high places cast before thee bracelets and chains of gold, that thou shouldst lift up thine eyes upon them, thine eyes thou wouldst not lift up on one of them, to become guilty in the great day of judgment.", "tj": "בְּרִי דִרְבִיתָא יוֹסֵף בְּרִי דִרְבִיתָא וְתַקִיף וְתִתְחֲמִי לָךְ לְמַתְקֵף מְדַמֵי אֲנָא יוֹסֵף בְּרִי לְגוּפְנָא שְׁתִילָא עַל מַבּוּעִין דְמַיָין דִשְׁלָחַת שׁוֹרְשֵׁיהּ לִתְחוּמַיָא וּפַטִית שִׁינֵי כָּל כִּיפַיָא שְׁלָחַת לִמְרוֹמַיָא וּכְבִישַׁת כָּל אִילָנַיָא כֵּן כַּבְשַׁת יוֹסֵף בְּרִי בְּחוּכְמָתָךְ יַת כָּל חֲרָשֵׁיהוֹן דְמִצְרָאֵי וְיַת כָּל חַכִּימֵיהוֹן דַהֲווּ בְּזִימְנָא דְאַרְכִּיבוּ יָתָךְ בְּאַרְתִּיכָא תִּנְיָנָא דַהֲוָה לְפַרְעה וַהֲווֹ מַכְרִיזִין קֳדָמָךְ וְאָמְרִין דֵין הוּא אָבוֹי דְמַלְכָּא יְחֵי וְיִתְקַיֵים אַבָּא דְמַלְכָּא דְרַב בְּחוּכְמָתָא וּזְעֵיר בִּשְׁנַיָא וַהֲווֹ בְּנַתְהוֹן דְמַלְכַיָא וּבְנָתֵיהוֹן דְשִׁלְטוֹנַיָא מְרַקְדַן עֲלָךְ עַל כַּוַויָא וּמְצִיתָן עֲלָךְ מִן חֲרַכַּיָא וַהֲווֹ מְזַרְקַן קֳדָמָךְ שִׁירִין עִזְקִין קָטִילִין מָנִיכִין וְכָל מָנֵי דְהַב סְבִירִין דְאַתְּ תָּלֵי עֵינָךְ וּמִסְתַּכֵּל בַּחֲדָא מִנְהוֹן חַס לָךְ יוֹסֵף בְּרִי דְלָא תְלִיתָא עֵינָךְ בַחֲדָא מִנְהוֹן וַהֲווֹן בְּנָתֵיהוֹן דְמַלְכַיָא וּבְנָתֵיהוֹן דְשִׁלְטוֹנַיָא אָמְרִין אִלֵין לְאִלֵין דֵין הוּא גַבְרָא חֲסִידָא יוֹסֵף דְלָא הָלַךְ בָּתַר חֵיזוֹ עֵינוֹ וְלָא בָּתַר הִירְהוּר לִבֵּיהּ אֲרוּם חֵיזוּ עֵינוֹי וְהִרְהוֹר לִבֵּיהּ מוֹבְדִין בַּר נְשָׁא מִגוֹ עַלְמָא בְּגִין כְּדוּן יְקוּם מִינָךְ תְּרֵין שִׁבְטַיָא מְנַשֶׁה וְאֶפְרַיִם וִיקַבְּלוּן חוּלַק וְאַחְסָנָא עִם אֲחֵיהוֹן בְּפִילוּג אַרְעָא:", "tj_en": "My son who hast become great, JOSEPH, my son, who hast become great, and waxed mighty, that thou wouldst become mighty was foreseen. Thee, Joseph, my son, will I liken to a vine planted by fountains of water, which sendeth her roots into the depth and striketh the ridges of the rocks, uplifting herself on high and surmounting all the trees. So hast thou, 0 Joseph my son, risen by thy wisdom above all magicians of Mizraim, and all the wise men who were there, what time thou didst ride in the second chariot of Pharoh, and they proclaimed before thee and said, This is the father of the king, Long live the, father of the king Great in wisdom, though few in years. And the daughters of kings and of princes danced before thee at the windows, and beheld thee from the balconies, and scattered before thee bracelets rings collars, necklaces, and all ornaments of gold, in hope thou wouldst uplift thine eyes and regard one of them. But thou my son Joseph wast far from lifting thine eyes on any one of them, though the daughters of kings and of princes spake one to another, This is the holy man Joseph, who walks not after the sight of his eyes nor after the imagination of his heart; because the sight of the eyes and the imagination of his heart make the son of woman to perish from the world. Therefore will arise from thee the two tribes MENASHEH and  EPHRAIM, who shall receive portion and inheritance with their brethren in the dividing of the land.", "rashi": "<b>בן פרת.<\/b> בֶּן חֵן, וְהוּא לְשׁוֹן אֲרַמִּי, אַפִּרְיָן נַמְטְיֵהּ לְרַבִּי שִׁמְעוֹן, בְּסוֹף בָּבָא מְצִיעָא (דף קי\"ט):<br><br><b>בן פרת עלי עין.<\/b> חִנּוֹ נָטוּי עַל הָעַיִן הָרוֹאָה אוֹתוֹ:<br><br><b>בנת צעדה עלי שור.<\/b> בְּנוֹת מִצְרַיִם הָיוּ צוֹעֲדוֹת (עַל הַחוֹמָה) לְהִסְתַּכֵּל בְּיָפְיוֹ, בָּנוֹת הַרְבֵּה, צָעֲדָה כָּל אַחַת וְאַחַת, בְּמָקוֹם שֶׁתּוּכַל לִרְאוֹתוֹ מִשָּׁם:<br><br><b>עלי שור.<\/b> עַל רְאִיָּתוֹ, כְּמוֹ אֲשׁוּרֶנּוּ וְלֹא קָרוֹב (במדבר כ\"ד), וּמִ\"אַ יֵשׁ רַבִּים, וְזֶה נוֹטֶה לְיִשּׁוּב הַמִּקְרָא. פֹּרָת תָּי\"ו שֶׁבּוֹ הוּא תִּקּוּן הַלָּשׁוֹן, כְּמוֹ עַל דִּבְרַת בְּנֵי הָאָדָם (קהלת ג'):<br><br><b>שור.<\/b> כְּמוֹ לָשׁוּר:<br><br><b>עלי שור.<\/b> בִּשְׁבִיל לָשׁוּר, וְתַרְגּוּם שֶׁל אֻנְקְלוֹס, בָּנוֹת צָעֲדָה עֲלֵי שׁוּר תְּרֵין שִׁבְטִין יִפְּקוּן מִבְּנוֹהִי וְכוּ' וְכָתַב בָּנוֹת עַל שֵׁם בְּנוֹת מְנַשֶּׁה, בְּנוֹת צְלָפְחָד, שֶׁנָּטְלוּ חֵלֶק בִּשְׁנֵי עֶבְרֵי הַיַּרְדֵּן, בְּרִי דְּיִסְגֵּי יוֹסֵף, פֹּרָת לְשׁוֹן פִּרְיָה וּרְבִיָּה; וְיֵשׁ מִ\"אַ בּוֹ הַמִּתְיַשְּׁבִים עַל הַלָּשׁוֹן, בְּשָׁעָה שֶׁבָּא עֵשָׂו לִקְרַאת יַעֲקֹב, בְּכֻלָּן קָדְמוּ הָאִמָּהוֹת לָלֶכֶת לִפְנֵי בְּנֵיהֶם לְהִשְׁתַּחֲווֹת, וּבְרָחֵל כְּתִיב נִגַּשׁ יוֹסֵף וְרָחֵל וַיִּשְׁתַּחֲווּ, אָמַר יוֹסֵף רָשָׁע הַזֶּה עֵינוֹ רָמָה, שֶׁמָּא יִתֵּן עֵינָיו בְּאִמִּי, יָצָא לְפָנֶיהָ וְשִׁרְבֵּב קוֹמָתוֹ לְכַסּוֹתָהּ, וְהוּא שֶׁבֵּרְכוֹ אָבִיו בֵּן פֹּרָת – הִגְדַּלְתָּ עַצְמְךָ יוֹסֵף עֲלֵי עַיִן שֶׁל עֵשָׂו, לְפִיכָךְ זָכִיתָ לִגְדֻלָּה:<br><br><b>בנות צעדה עלי שור.<\/b> לְהִסְתַּכֵּל בְּךָ בְּצֵאתְךָ עַל מִצְרַיִם, וְעוֹד דְּרָשׁוּהוּ לְעִנְיָן שֶׁלֹּא יִשְׁלֹט בְּזַרְעוֹ עַיִן הָרָע; וְאַף כְּשֶׁבֵּרֵךְ מְנַשֶּׁה וְאֶפְרַיִם בֵּרְכָם כַּדָּגִים, שֶׁאֵין עַיִן הָרָע שׁוֹלֶטֶת בָּהֶם:", "rashi_en": "בן פרת means a graceful son. It is an expression used in Aramaic: אפרין נמטיה “Let us treat gracefully (literally, let us make a triumphal procession for) R. Simeon”, and may be found at the end of Bava Metzia 119a. <br><br>בן פרת עלי עין means his gracefulness attacks the eye that looks at him.<br><br>בנות צעדה עלי שור DAUGHTERS TREAD ON THE WALL — The daughters of Egypt used to climb up to gaze at his beauty בנות is plural — many daughters, whilst צעדה is singular, but the words should be translated thus: many daughters climbed, each of them to any place from which she could best obtain a glimpse of him.<br><br>עלי שור means for the purpose of looking at him, similar to (Numbers 24:17) I behold him (אשורנו) but not nigh”. There are many Midrashic explanations but this inclines nearest to the literal sense of the verse  פרת — The ת in this word is added for elegance of style (i.e. it is not a sign of the feminine), as the ת in דברת which is instead of דבר in (Ecclesiastes 3:18) “It is because of (על דברת) the sons of men”.<br><br>שור is an infinitive the same as לשור, to look.<br><br>עלי שור consequently means in order to look (i.e. עלי, a poetical form of על, means “for the purpose of”). The translation of Onkelos of בנות צעדה עלי שור is: two tribes will come out of his sons etc., and according to this Scripture writes בנות (though one would expect בנים) with reference to the women of Manasseh — the daughters of Zelophehad — who received a portion of land on both sides of the Jordan (Midrash Tanchuma, Pinchas 9). And in accordance with this paraphrase the Targum translated the preceding words בן פרת by ברי דיסגי יוסף, Joseph is a son who shall increase and become, two tribes connecting פרת with the expression [פריה [ורביה “fruitfulness and increase”. There are Midrashim (Genesis Rabbah 78:9) that fit in with the text: When Esau came to meet Jacob all the other matriarchs walked in front of their children to prostrate themselves but of Rachel it states (33:7) “[and afterwards] came Joseph near and Rachel (i.e. Joseph before Rachel) and they bowed down”. Joseph said, “This wicked man has a haughty look (is bold and impudent) he may set his fancy upon my mother”. He therefore stepped in front of her, drawing himself up to his full height, in order to hide her from Esau’s eyes. It was in reference to this that his father when blessing him called him a בן פורת, a son who grew in size: You, Joseph, stretched yourself to a great height to protect your mother against Esau’s glance, therefore you deserved to become great. (This has reference to the distinguished position he attained in Egypt.).<br><br>In accordance with this Midrash the words בנות צעדה עלי שור mean they climbed up to get a good view of you when you went forth in the procession as Viceroy over Egypt. They (the Rabbis) gave a further interpretation of it, taking עלי עין as עוּלֵי עין ,“raised above the eye”, in the sense that the Evil Eye would have no effect on his children (Berakhot 20a). So, too, when he blessed Manasseh and Ephraim he blessed them, praying that they should become as fishes on which the Evil Eye has no effect."}, {"ch": 49, "v": 23, "aliyah": 5, "heb": "וַֽיְמָרְרֻ֖הוּ וָרֹ֑בּוּ וַֽיִּשְׂטְמֻ֖הוּ בַּעֲלֵ֥י חִצִּֽים׃", "onk": "וְאִתְמַרְרוּ יָתֵיהּ וְנַקְּמוֹהִי וְאָעִיקוּ לֵיהּ גֻּבְרִין גִּבָּרִין בַּעֲלֵי פַלְגּוֹתָא:", "onk_en": "They made him bitter and quarreled with him [<b>they avenged themselves on him<\/b>]. Expert bowmen with hatred made him their target. [<b>Mighty men, those who have half, afflicted him.<\/b>]", "pj": "וּמַמְרִירוּ לֵיהּ וְנָצוּ לֵיהּ כָּל חַרְשֵׁי מִצְרָאֵי וְאוּף אָכְלוּ קוּרְצוֹי קֳדָם פַּרְעה סַבָּרִין לְמַחְתָּא יָתֵיהּ מִן יְקָרֵיהּ אָמְרִין עֲלוֹי לִישַׁן תְּלִיתָאֵי דְקָשֵׁי הֵי כְגִירִין", "pj_en": "And all the magicians of Mizraim were bitter and angry against him, and brought accusations against him before Pharoh, expecting to bring him down from his honour They spake against him with the slanderous tongue which is severe as arrows.", "tj": "אֲמָרוּ לְקוּבְלֵיהּ וְלָא יָכְלוּ לֵיהּ כָּל חֲרָשֵׁיהוֹן דְמִצְרַיִם וְכָל חַכִּימִין אָמְרוּ בִּישְׁתֵיהּ קֳדָם רִיבּוֹנֵיהּ אָכְלוּ קֻרְצוֹהִי קֳדָם פַּרְעה מַלְכָּא דְמִצְרַיִם מִן בִּגְלַל לְמִנְחַתָּא יָתֵיהּ מִן יְקָרֵיהּ אָמְרוֹ עֲלוֹי לִישַׁן תְּלִיתָאֵי בְּפַלְטְרִין דְפַרְעה דַהֲוָה קָשֵׁי עֲלוֹי הֵיךְ גִירַיָא:", "tj_en": "The magicians of Mizraim and all the wise men spake against him, but could not prevail over him; they spake evil of him before his lord, they accused him before Pharoh king of Mizraim, to bring him down from his dignity; they spake against him in the palace of Pharoh with a slanderous tongue severe as arrows.", "rashi": "<b>וימררהו ורבו.<\/b> וַיְמָרְרוּהוּ אֶחָיו, וַיְמָרְרוּהוּ פּוֹטִיפַר וְאִשְׁתּוֹ, לְאָסְרוֹ; לְשׁוֹן וַיְמָרְרוּ אֶת חַיֵּיהֶם:<br><br><b>ורבו.<\/b> נַעֲשׂוּ לוֹ אֶחָיו אַנְשֵׁי רִיב. וְאֵין הַלָּשׁוֹן הַזֶּה לְשׁוֹן פָּעֲלוּ, שֶׁאִם כֵּן הָיָה לוֹ לִנָּקֵד \"וָרָבוּ\", כְּמוֹ הֵמָּה מֵי מְרִיבָה אֲשֶׁר רָבוּ וְגוֹ' (במדבר כ'), וְאַף אִם לְשׁוֹן רְבִיַּת חִצִּים הוּא כָּךְ הָיָה לוֹ לִנָּקֵד; אֵינוֹ אֶלָּא לְשׁוֹן פּוֹעֲלוּ, כְּמוֹ שֹׁמּוּ שָׁמַיִם (ירמיהו ב'), שֶׁהוּא לְשׁוֹן הוּשַׁמּוּ; וְכֵן רוֹמּוּ מְּעַט, שֶׁהוּא לְשׁוֹן הוּרְמוּ, אֶלָּא שֶׁלְּשׁוֹן הוּרְמוּ וְהוּשַׁמּוּ עַל יְדֵי אֲחֵרִים, וּלְשׁוֹן שֹׁמּוּ, רֹמּוּ, רֹבּוּ מֵאֵלֵיהֶם הוּא – מְשׁוֹמְמִים אֶת עַצְמָם, נִתְרוֹמְמוּ מֵעַצְמָם, נַעֲשׂוּ אַנְשֵׁי רִיב, וְכֵן דֹּמּוּ יֹשְׁבֵי אִי, כְּמוֹ נִדְמוּ, וְכֵן תִּרְגֵּם אֻנְקְלוֹס, וְנַקְמוֹהִי:<br><br><b>בעלי חצים.<\/b> שֶׁלְּשׁוֹנָם כַּחֵץ, וְתַרְגּוּמוֹ לְשׁוֹן וַתְּהִי הַמֶּחֱצָה, אוֹתָן שֶׁהָיוּ רְאוּיִים לַחֲלֹק עִמּוֹ נַחֲלָה:", "rashi_en": "וימררהו ורבו AND THEY EMBITTERED HIM — His brothers dealt bitterly with him; Potiphar and his wife dealt bitterly with him, putting him into the dungeon. וימררהו is the same metaphor as וימררו 'וגו in (Exodus 1:14) “They made their lives bitter (וימררו )” (Genesis Rabbah 98:19).<br><br>ורבו means his brothers became his adversaries (literally, men of strife). This verb is not a Kal form meaning they strove (with him) for were it so it should have been punctuated וְרָבוּ (from the root ריב), as in (Numbers 20:13) “These are the waters of Meribah, where the children of Israel strove (רָבוּ)”. And even if its meaning were “shooting arrows” (from the root רבה) it would have been punctuated in exactly the same way. It really has a passive force like (Jeremiah 2:12) שֹׁׁמּוּ שמים “Be astonished, O ye heavens” which is as much as הושמו; and likewise (Job 24:24) “They are exalted (רֹמּוּ) for a little while” which has the same meaning as הורמו except that הורמו and הושמו mean they are made to be exalted and astonished by others, whilst שמו and רמו and רבו denote that the actions arise out of the persons themselves: they make themselves to be astonished, they are exalted of their own accord, רבו means they became men of strife. A similar form is (Isaiah 23:2) “Be still (דֹּמּוּ) ye inhabitants of the isle” where דמו has the same meaning as the Nipal of נִדְמוּ ,דום. In this sense does Onkelos also translate it: ונקמהו “and they avenged themselves on him”.<br><br>בעלי חצים THE ARCHERS (literally, men who have arrows) — they were so called because their tongues were as arrows (Genesis Rabbah 98:19) (cf. Psalms 120:4). Onkelos translates it (חצים) by פלגותא taking it to be of the same root as המחצה in (Numbers 31:36) “And the half (המחצה) was” thus he takes בעלי חצים to mean “those who were destined to share with him the inheritance”. "}, {"ch": 49, "v": 24, "aliyah": 5, "heb": "וַתֵּ֤שֶׁב בְּאֵיתָן֙ קַשְׁתּ֔וֹ וַיָּפֹ֖זּוּ זְרֹעֵ֣י יָדָ֑יו מִידֵי֙ אֲבִ֣יר יַעֲקֹ֔ב מִשָּׁ֥ם רֹעֶ֖ה אֶ֥בֶן יִשְׂרָאֵֽל׃", "onk": "וְתָבַת בְּהוֹן נְבִיאוּתֵיהּ עַל דְּקַיַּם אוֹרַיְתָא בְּסִתְרָא וְשַׁוִּי בְתוּקְפָא רוֹחֲצָנֵיהּ בְּכֵן יִתְרְמָא דְהַב עַל דְּרָעוֹהִי וְאַחֲסִין מַלְכוּתָא וּתְקֵיף דָּא הֲוַת לֵיהּ מִן קֳדָם אֵל תַּקִּיפָא דְיַעֲקֹב דִּי בְמֵימְרֵיהּ זַן אֲבָהָן וּבְנִין זַרְעָא דְיִשְׂרָאֵל:", "onk_en": "His bow remained in strength, [<b>His prophecy was fulfilled in them, because he secretly kept the Torah. He placed his trust in the Almighty,<\/b>] his arms were bedecked with gold, [<b>therefore, gold was placed on his arms / and he inherited kingship and power.<\/b>] by the hand of Mighty One of Yaakov [<b>This was for him from before the Mighty God of Yaakov<\/b>]; from there he became the shepherd [the provider], [<b>who by His Word sustained<\/b>] the stone of Israel [<b>the fathers and sons of the seed of Israel<\/b>].", "pj": "וְהַדְרַת לִמְתַב לְקַדְמוּתָא תְּקוֹף אֵיבָרֵיהּ דְלָא לִמְשַׁמְשָׁא עִם רִבּוֹנְתֵּיהּ וְאִתְבַּדְרוּ יְדוֹי מִן הִרְהוּרָא זַרְעָא וּכְבַשׁ יִצְרֵיהּ מִן אוּלְפַן תְּקֵיף דְקִבֵּיל מִן יַעֲקב וּמִתַּמָן זַכָּא לְמֶהֱוֵי פַּרְנָסָא וּלְאִיתְחַבְּרָא בִּגְלוֹף שְׁמָהָן עַל אַבְנַיָא דְיִשְרָאֵל", "pj_en": "But he returned to abide in his early strength, and would not yield himself unto sin, and subdued his inclinations by the strong discipline he had received from Jakob, and thence became worthy of being a ruler, and of being joined in the engraving of the names upon the stones of Israel.", "tj": "וְאַשְׁרֵי תּוֹקְפָא רוֹחֲצָנֵיהּ בִּשְׁנֵי יְדוֹי וְדַרְעוֹי וּבְעָא רַחֲמִין מִן תַּקִיפָא דְאָבוֹי דְיַעֲקב דְמִתְּחוֹת אֶדְרַע גְבוּרְתֵּיהּ מְדַבְּרִין וְאַתְיַין שִׁבְטַיָא דְיִשְרָאֵל:", "tj_en": "But the strength of his confidence remained in both his hands and his arms, and he sought mercy from the strength of his father Jakob, under the arms of whose power the tribes of Israel are led, and do come.", "rashi": "<b>ותשב באיתן קשתו.<\/b> נִתְיַשְּׁבָה בְּחֹזֶק:<br><br><b>קשתו.<\/b> חָזְקוֹ:<br><br><b>ויפזו זרעי ידיו.<\/b> זוֹ הִיא נְתִינַת טַבַּעַת עַל יָדוֹ, לְשׁוֹן זָהָב מוּפָז, זֹאת הָיְתָה לוֹ מִידֵי הַקָּבָּ\"ה שֶׁהוּא אֲבִיר יַעֲקֹב, וּמִשָּׁם עָלָה לִהְיוֹת רֹעֶה אֶבֶן יִשְׂרָאֵל – עִקָּרָן שֶׁל יִשְׂרָאֵל, לְשׁוֹן הָאֶבֶן הָרֹאשָׁה, לְשׁוֹן מַלְכוּת; וְאֻנְקְלוֹס אַף הוּא כָךְ תִּרְגְּמוֹ <b>ותשב<\/b> – וְתָבַת בְּהוֹן נְבִיאוּתֵהּ, הַחֲלוֹמוֹת אֲשֶׁר חָלַם לָהֶם – עַל דְּקַיֵּם אוֹרַיְתָא בְּסִתְרָא, תּוֹסֶפֶת הוּא, וְלֹא מִלָּשׁוֹן עִבְרִי שֶׁבַּמִּקְרָא, – וְשַׁוִּי תוּקְפָא רוֹחֲצָנֵהּ תַּרְגּוּם שֶׁל בְּאֵיתָן קַשְׁתּוֹ, וְכָךְ לְשׁוֹן הַתַּרְגּוּם עַל הָעִבְרִי: וַתֵּשֶׁב נְבוּאָתוֹ בִּשְׁבִיל שֶׁאֵיתָנוֹ שֶׁל הַקָּבָּ\"ה הָיְתָה לוֹ לְקֶשֶׁת וּלְמִבְטָח, בְּכֵן יִתְרְמָא דְּהַב עַל דְּרָעוֹהִי – לְכָךְ וַיָּפֹזּוּ זְרֹעֵי יָדָיו, לְשׁוֹן פָּז:<br><br><b>אבן ישראל.<\/b> לְשׁוֹן נוֹטָרִיקוֹן אָב וּבֵן, אֲבָהָן וּבְנִין – יַעֲקֹב וּבָנָיו. וְרַבּוֹתֵינוּ דָרְשׁוּ וַתֵּשֶׁב בְּאֵיתָן קַשְׁתּוֹ עַל כְּבִישַׁת יִצְרוֹ בְּאֵשֶׁת אֲדֹנָיו, וְקוֹרְאוֹ קֶשֶׁת, עַל שֵׁם שֶׁהַזֶּרַע יוֹרֶה כַּחֵץ:<br><br><b>ויפזו זרעי ידיו.<\/b> כְּמוֹ וַיָּפוֹצוּ, שֶׁיָּצָא הַזֶּרַע מִבֵּין אֶצְבְּעוֹת יָדָיו:<br><br><b>מידי אביר יעקב.<\/b> שֶׁנִרְאֲתָה לוֹ דְמוּת דְּיוֹקְנוֹ שֶׁל אָבִיו וְכוּ', כִּדְאִיתָא בְּסוֹטָה (דף ל\"ו, ב'):", "rashi_en": "ותשב באיתן קשתו means his power (i.e. his rule as viceroy) was strongly (באיתן) established. <br><br>קשתו means his power.<br><br>ויפזו זרעי ידיו — This refers to the placing of the king’s signet-ring on his hand, יפזו being connected in meaning with the expression (1 Kings 10:18) זהב מופז “the finest gold”, so that the translation would be “his hands were made golden”. This happened to him from the hands of (i.e. through the instrumentality of) the Holy One, blessed be He, who is the Mighty One (אביר) of Jacob. From here (from his position as Viceroy) he rose to become the Feeder of the Foundation Stone of the Israelites, i.e. of the Originator of the tribes of Israel (Jacob). The word אבן, stone, has here the same sense as in (Zechariah 4:7) אבן הראשה, “the chief stone”, where it denotes high position. Onkelos also translates it in this manner: His translation of the verse is as follows: ותשב he translates by “and the prophecy returned upon (was fulfilled in) them (the brethren) i.e. the prophecy contained in the dreams which he dreamed regarding them was fulfilled, “because he observed the Law in secret” — this is an addition made by Onkelos, having no words in the Hebrew text to correspond to it. “And he put in “The Might his trust” is the translation of the Hebrew words באיתן קשתו. The following is how the wording of the Targum fits in with the Hebrew text: “His prophecy was fulfilled (וַתָּשָׁב) because the might (איתן) of the Holy One, blessed be He, served him as his bow (קשתו) and trusty weapon; therefore gold was placed on his arms” — the last words being the Targum of לכך] ויפזו זרועי ידיו], taking ויפזו as connected in meaning with פז, fine gold. <br><br>אבן ישראל Onkelos takes אבן as an abbreviation of אב ובן and therefore renders it by אבהן ובנין the fathers and children meaning Jacob and his sons. And our rabbis expounded, AND HE BROUGHT BACK HIS BOW WITH STRENGTH, as being about the suppressing of his impulse with the wife of his master. And it calls it a bow, because the seed shoots out like an arrow.<br><br>ויפזו זרעי ידיו AND HIS FOREARMS WERE GILDED (<i>VAYAFOZU<\/i>) — (is read) like, 'and they were spread' (<i>vayafotsu<\/i>), since his seed went out from between the fingers of his hands. <br><br>מידי אביר יעקב FROM THE HANDS OF THE STRENGTH OF JACOB — As an image of the replica of his father was shown to him, etc., as it is found in Sotah 36b."}, {"ch": 49, "v": 25, "aliyah": 5, "heb": "מֵאֵ֨ל אָבִ֜יךָ וְיַעְזְרֶ֗ךָּ וְאֵ֤ת שַׁדַּי֙ וִיבָ֣רְכֶ֔ךָּ בִּרְכֹ֤ת שָׁמַ֙יִם֙ מֵעָ֔ל בִּרְכֹ֥ת תְּה֖וֹם רֹבֶ֣צֶת תָּ֑חַת בִּרְכֹ֥ת שָׁדַ֖יִם וָרָֽחַם׃", "onk": "מֵימַר אֱלָהָא דְאָבוּךְ יְהֵי בְסַעְדָּךְ וְיָת שַׁדַּי וִיבָרְכִנָּךְ בִּרְכַן דְּנַחֲתָן מִטַּלָּא דִשְׁמַיָּא מִלְּעֵלָּא בִּרְכַן דְּנַגְדַּן מִמַּעֲמַקֵּי אַרְעָא מִלְּרָע בִּרְכְּתָא דְאָבוּךְ וּדְאִמָּךְ:", "onk_en": "From the Almighty [<b>The Word of the God<\/b>] of your father and He will help you [<b>will be your support<\/b>], and Shaddai Who will bless you with the blessings of [<b>that descend from the dew of the<\/b>] heaven from above, blessings [<b>that flow<\/b>] of [<b>from<\/b>] the depths [<b>of the earth<\/b>] that lie below, blessings of seed and womb [<b>your father and your mother<\/b>].", "pj": "מִמֵימַר אֱלָהָא דְאָבוּךְ יְהֵי סִיוּעָךְ וּמִן דְמִתְקְרֵי שַׁדַי יְבָרְכִינָךְ בִּרְכַן דְנַחְתַן מִטַלָא דִשְׁמַיָא מִלְעֵילָא וּמִטוֹב בִּרְכַן מַבּוּעֵי תְהוֹמָא דְסַלְקָן וּמְכַסְיַן צָמְחִין מִלְרַע בְּרִיכִין יְהֶוְיַין חַדְיָיא דְיָנַקְתָּא מִנְהֶן וּמֵעַיָיא דִרְבָעַת בְּהוֹן", "pj_en": "From the Word of the Lord shall be thy help; and He who is called the All--Sufficient shall bless thee with the blessings which descend with the dew of heaven from above, and with the good blessing of the fountains of the deep which ascend and clothe the herbage from beneath. The breasts are blessed at which thou wast suckled, and the womb in which thou didst lie.", "tj": "בִּירְכַן חַדְיַין דְיָנְקַת מִנְהוֹן וּמְעַיָא דִי רְבַעַת בְּהוֹן:", "tj_en": "Blessed are the breasts that suckled thee, and the womb in which thou didst lie.", "rashi": "<b>מאל אביך.<\/b> הָיְתָה לְךָ זֹאת וְהוּא יַעְזְרֶךָּ:<br><br><b>ואת שדי.<\/b> וְעִם הַקָּבָּ\"ה הָיָה לִבְּךָ כְּשֶׁלֹּא שָׁמַעְתָ לְדִבְרֵי אֲדוֹנָתְךָ, וְהוּא יְבָרְכֶךָּ:<br><br><b>ברכת שדים ורחם.<\/b> בִּרְכָתָא דְּאַבָּא וּדְאִמָּא, כְּלוֹמַר, יִתְבָּרְכוּ הַמּוֹלִידִים וְהַיּוֹלְדוֹת, שֶׁיִּהְיוּ הַזְּכָרִים מַזְרִיעִין טִפָּה הָרְאוּיָה לְהֵרָיוֹן, וְהַנְּקֵבוֹת לֹא יְשַׁכְּלוּ אֶת רֶחֶם שֶׁלָּהֶן לְהַפִּיל עֻבָּרֵיהֶן:<br><br><b>שדים.<\/b> יָרֹה יִיָּרֶה מְתַּרְגְּמִינַן אִשְׁתְּדָאָה יִשְׁתְּדִי, אַף שָׁדַיִם כָּאן עַל שֵׁם שֶׁהַזֶּרַע יוֹרֶה כַּחֵץ:", "rashi_en": "מאל אביך means FROM THE GOD OF THY FATHER did this happen to you AND HE WILL HELP YOU also in the future (Genesis Rabbah 87:7).<br><br>ואת שדי means AND WITH THE ALMIGHTY was your heart when you did not hearken to the words of your mistress AND therefore HE WILL BLESS YOU.<br><br>ברכת שדים ורחם Onkelos renders this by: blessings for father(s) and mother(s) i.e. may the men and the women be blessed in that they may not prove sterile and barren.<br><br>שדים BREASTS (<i>SHADAYIM<\/i>) — \"He will surely be cast down\" (Exodus 19:13), we translate (in Onkelos) as  <i>eeshtedaah yishtedi<\/i>. Also <i>shadayim<\/i> here is [to be understood that way,] because the seed shoots out like an arrow. "}, {"ch": 49, "v": 26, "aliyah": 5, "heb": "בִּרְכֹ֣ת אָבִ֗יךָ גָּֽבְרוּ֙ עַל־בִּרְכֹ֣ת הוֹרַ֔י עַֽד־תַּאֲוַ֖ת גִּבְעֹ֣ת עוֹלָ֑ם תִּֽהְיֶ֙יןָ֙ לְרֹ֣אשׁ יוֹסֵ֔ף וּלְקׇדְקֹ֖ד נְזִ֥יר אֶחָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "בִּרְכְּתָא דְאָבוּךְ יִתּוֹסְפָן עַל בִּרְכְּתָא דִילִי בָּרִיכוּ אֲבָהָתַי דַּחֲמִידוּ לְהֶן רַבְרְבַיָּא דְּמִן עָלְמָא יֶהֶוְיַן כָּל אִלֵּין לְרֵישָׁא דְיוֹסֵף וּלְגַבְרָא פָּרִישָׁא דַאֲחוֹהִי:", "onk_en": "The blessings that [<b>of<\/b>] your father [received] are stronger than [<b>will be in addition to<\/b>] the blessings [<b>with which<\/b>] my forebears [received] [<b>blessed me<\/b>] even to the boundaries of the eternal hills [<b>for which the righteous of the earth longed<\/b>]; they [<b>all these<\/b>] shall be on Yoseif’s head, on the crown of him who is a Nazirite among his brothers [<b>and on the man who was separated from his brothers<\/b>].", "pj": "בִּרְכָתָא דְאָבוּךְ יִתּוֹסְפַן עַל בִּרְכָתָא דִבְרִיכַן יָתִי אַבְהָתוֹי אַבְרָהָם וְיִצְחָק דַחֲמִידוּ לְהֵין רַבְרְבָנֵי עַלְמָא יִשְׁמָעֵאל וְעֵשָו וְכָל בְּנָהָא דִקְטוּרָא יִתְכַּנְשַׁן כָּל אִלֵין בִּרְכָתָא וְיִתְעַבְדָן כְּלִיל דִרְבוּ לְרֵישׁ יוֹסֵף וּלְקָדְקָדֵיהּ דְגַבְרָא דַהֲוָה רַב וְשַׁלִיט בְּמִצְרַיִם וְזָהִיר בִּיקָרָא דְאָחוֹי", "pj_en": "The blessings of thy father be added to the blessings wherewith my fathers Abraham and Izhak have blessed me, and which the princes of the world Ishmael and Esau and all the sons of Keturah have desired: let all these blessings be united, and form a diadem of majesty for the head of Joseph, and for the brow of the man who became chief and ruler in Mizraim, and the brightness of the glory of his brethren.", "tj": "בִּרְכָתָא דְאָבוּךְ יִתּוֹסְפָן עֲלָךְ עַל בִּרְכָתָא דְבָרִיכוּ יָתָךְ אַבְהָתָךְ אַבְרָהָם וְיִצְחָק מְתוּלִין לְטוּרַיָא וּמִן בִּרְכָתָא אַרְבַּעְתִּי אַמְהָתָא דִמְתִילִין כְּגוֹלַמְתָּא שָרָה רִבְקָה רָחֵל וְלֵאָה יֵיתוֹן כָּל בִּרְכָתָא אִלֵין וְיִתְעַבְּדוּן כְּלִיל דְרָבוּי עַל רֵישָׁא דְיוֹסֵף וּלְקָדְקָדָא דְגַבְרָא דַהֲוָה רַב וְשַׁלִיט בְּאַרְעָא דְמִצְרַיִם וְזָהִיר בִּיקָרֵיהוֹן דְאָחוֹי:", "tj_en": "The blessing of thy father be added up
