sumed its inhabitants, which is Zoar, went forth, and set the array of battle against them in the valley of the gardens;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 9, "aliyah": 4, "heb": "אֵ֣ת כְּדׇרְלָעֹ֜מֶר מֶ֣לֶךְ עֵילָ֗ם וְתִדְעָל֙ מֶ֣לֶךְ גּוֹיִ֔ם וְאַמְרָפֶל֙ מֶ֣לֶךְ שִׁנְעָ֔ר וְאַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר אַרְבָּעָ֥ה מְלָכִ֖ים אֶת־הַחֲמִשָּֽׁה׃", "onk": "עִם כְּדָרְלָעֹמֶר מַלְכָּא דְעֵילָם וְתִדְעָל מַלְכָּא <b>דְעַמְמִין<\/b> וְאַמְרָפֶל מַלְכָּא <b>דְבָבֶל<\/b> וְאַרְיוֹךְ מַלְכָּא דְאֶלָּסָר אַרְבְּעָה מַלְכִין לָקֳבֵיל חַמְשָׁא:", "onk_en": "Against Kedorlaomer, king of Eilam, Sidal, king of Goyim [<i>king of peoples<\/i>], Amraphel, king of Shinar [<i>Babylon<\/i>], and Aryoch, king of Elasar; [there were] four kings against the five.", "pj": "עִם כְּדָרְלָעוֹמֶר מַלְכָּא דְעֵילָם וְתִידְעָל מַלְכָּא דְעַמְמַיָא מִשְׁתַּמְעִין לֵיהּ וְאַמְרָפֶל מַלְכָּא דְפוּנְטוֹס וְאַרְיוֹךְ מַלְכָּא דִתְלָסַר אַרְבַּעַת מַלְכִין סַדָרוּ קְרָבָא לִקְבֵיל חַמְשָׁא", "pj_en": "with Kedarlaomer king of Elam, and Thidal king of the nations obedient to him, and Amraphel king of Pontos, and Ariok king of Thelasar; four kings arrayed in battle against five.", "tj": "וְאַמְרָפֶל מַלְכָּא דְפִנְטוֹס וְאַרְיוֹךְ מַלְכָּא דְאֶלָסָר אַרְבַּע מַלְכִין לְקָבֵיל חַמְשָׁא סִידְרוּ סִדְרֵי קְרָבָא:", "tj_en": "And Amraphel king of Pontos, and Ariok king of Elasar: four kings against five spread out the array of war.", "rashi": "<b>ארבעה מלכים וגו'.<\/b> וְאַף עַל פִּי כֵן נִצְּחוּ הַמֻּעָטִים, לְהוֹדִיעֲךָ שֶׁגִּבּוֹרִים הָיוּ, וְאַף עַל פִּי כֵן לֹא נִמְנַע אַבְרָהָם מִלִּרְדֹּף אַחֲרֵיהֶם:", "rashi_en": "'ארבעה מלכים וגו FOUR KINGS [AGAINST THE FIVE]— and yet the fewer were victorious; this statement is expressly made to tell you how powerful they were, and yet Abraham did not refrain from pursuing them. "}, {"ch": 14, "v": 10, "aliyah": 4, "heb": "וְעֵ֣מֶק הַשִּׂדִּ֗ים בֶּֽאֱרֹ֤ת בֶּאֱרֹת֙ חֵמָ֔ר וַיָּנֻ֛סוּ מֶֽלֶךְ־סְדֹ֥ם וַעֲמֹרָ֖ה וַיִּפְּלוּ־שָׁ֑מָּה וְהַנִּשְׁאָרִ֖ים הֶ֥רָה נָּֽסוּ׃", "onk": "<b>וּמֵישַׁר חַקְלַיָּא<\/b> בֵּירִין <b>בֵּירִין מַסְקַן חֵימָרָא<\/b> וַעֲרָקוּ מַלְכָּא דִסְדוֹם וַעֲמוֹרָה וּנְפָלוּ תַמָּן וּדְאִשְׁתָּאָרוּ לְטוּרָא עֲרָקוּ:", "onk_en": "The Valley of Siddim [<i>The plain of the fields<\/i>] was [full of] mortar pits [<i>pits from which they raise up mortar<\/i>]; [and when] the Kings of Sedom and Amorah fled they fell there [into the pits], while the remainder fled to the mountains.", "pj": "וּמֵישַׁר פַרְדְסַיָא בֵּירִין בֵּירִין מַלְיָן חִימְרָן וַעֲרָקוּ מַלְכָּא דִסְדוֹם וַעֲמוֹרָה וּנְפָלוּ תַמָן וְדִשְׁתַּאֲרוּ לְטַוְורֵיהּ עָרָקוּ", "pj_en": "And the valley of the gardens had many pits filled with bitumen: and the kings of Sedom and Amora fled away, and fell there; and they who were left fled to the mountains.", "tj": "וּמֵישַׁר פַרְדְסַיָא בֵּירְוָון בֵּירְוָון מַלְיָא חֵמָר:", "tj_en": "The valley of the gardens was full of pits of bitumen:", "rashi": "<b>בארת בארת חמר.<\/b> בְּאֵרוֹת הַרְבֵּה הָיוּ שָׁם, שֶׁנּוֹטְלִין מִשָּׁם אֲדָמָה לְטִיט שֶׁל בִּנְיָן. וּמִדְרַש אַגָּדָה שֶׁהָיָה הַטִּיט מֻגְבָּל בָּהֶם, וְנַעֲשָׂה נֵס לְמֶלֶךְ סְדוֹם שֶׁיָּצָא מִשָּׁם, לְפִי שֶׁהָיוּ בָאֻמּוֹת מִקְצָתָן שֶׁלֹּא הָיוּ מַאֲמִינִין שֶׁנִּצַּל אַבְרָהָם מֵאוּר כַּשְׂדִּים מִכִּבְשַׁן הָאֵשׁ, וְכֵיוָן שֶׁיָּצָא זֶה מִן הַחֵמָר, הֶאֱמִינוּ בְאַבְרָם לְמַפְרֵעַ:<br><br><b>הרה נסו.<\/b> לְהָר נָסוּ, הֶרָה, כְּמוֹ לְהָר; כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְחִלָּתָהּ, הֵטִיל לָהּ הֵ\"א בְּסוֹפָהּ. וְיֵשׁ חִלּוּק בֵּין הֶרָה לְהָהָרָה, שֶׁהֵ\"א שֶׁבְּסוֹף הַתֵּבָה עוֹמֶדֶת בִּמְקוֹם לָמֶ\"ד שֶׁבְּרֹאשָׁהּ, אֲבָל אֵינָהּ עוֹמֶדֶת בִּמְקוֹם לָמֶ\"ד וּנְקוּדָה פַּתָּח תַּחְתֶּיהָ, וַהֲרֵי הֶרָה כְּמוֹ לְהַר אוֹ כְּמוֹ אֶל הַר, וְאֵינוֹ מְפָרֵשׁ לְאֵיזֶה הַר, אֶלָּא שֶׁכָּל אֶחָד נָס בַּאֲשֶׁר מָצָא הַר תְּחִלָּה, וּכְשֶׁהוּא נוֹתֵן הֵ\"א בְרֹאשָׁהּ לִכְתֹּב הָהָרָה אוֹ הַמִּדְבָּרָה, פִּתְרוֹנוֹ כְּמוֹ אֶל הָהָר אוֹ כְמוֹ לְהָהָר, וּמַשְׁמַע לְאוֹתוֹ הַר הַיָּדוּעַ וּמְפֹרָשׁ בַּפָּרָשָׁה:", "rashi_en": "בארת בארת חמר FULL OF BITUMEN PITS — There were many pits there from which they took earth as clay for building purposes. The Midrashic explanation is that the clay was closely kneaded together in them (was very sticky) so that it was only because a miracle was performed for the king of Sodom that he escaped from them. For amongst those nations there were some who did not believe that Abraham had been delivered from Ur-Kasdim — from the fiery furnace — but as soon as this one escaped from the slime they corrected their past disbelief regarding what had happened to Abraham (literally, they believed retrospectively in Abraham) (Genesis Rabbah 42:7). <br><br>הרה נסו means THEY FLED TO A MOUNTAIN. The word הרה is the same as לְהַר. When a word requires a ל as a prefix one may put instead a ה as a suffix. There is a difference between הֶרָה and הָהָרָה, for the ה at the end takes the place of a לְ (with Shewa) prefixed (another version has: for the ה at the end does not take the place of a prefixed ל with Patach which would mean to “the”) so that הֶרָה is equal to לְהַר or to אֶל הַר to “a” mountain, without explaining which mountain — so that the meaning here is that each person fled to the first mountain he came across. When, however, a ה is prefixed to a word having this ה suffix so that it reads e. g., הָהרה or הַמדברה, it is the same as אל הָהר or לְהָהר (to “the” mount) signifying that mount which is well-known and has been definitely mentioned in the passage."}, {"ch": 14, "v": 11, "aliyah": 4, "heb": "וַ֠יִּקְח֠וּ אֶת־כׇּל־רְכֻ֨שׁ סְדֹ֧ם וַעֲמֹרָ֛ה וְאֶת־כׇּל־אׇכְלָ֖ם וַיֵּלֵֽכוּ׃", "onk": "<b>וּשְׁבוֹ<\/b> יָת כָּל קִנְיָנָא דִסְדוֹם וַעֲמוֹרָה וְיָת כָּל מֵיכָלְהוֹן וַאֲזָלוּ:", "onk_en": "They took [<i>captured<\/i>] all the wealth of Sedom and Amorah and all their provisions and they went on their way.", "pj": "וּנְסֵיבוּ יַת כָּל קִנְיָינָא דִסְדוֹם וַעֲמוֹרָה וְיַת כָּל מְזוֹנֵיהוֹן וַאֲזָלוּ", "pj_en": "And they took all the property of Sedom and Amora, and all their food, and went.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 12, "aliyah": 4, "heb": "וַיִּקְח֨וּ אֶת־ל֧וֹט וְאֶת־רְכֻשׁ֛וֹ בֶּן־אֲחִ֥י אַבְרָ֖ם וַיֵּלֵ֑כוּ וְה֥וּא יֹשֵׁ֖ב בִּסְדֹֽם׃", "onk": "<b>וּשְׁבוֹ<\/b> יָת לוֹט וְיָת קִנְיָנֵיהּ בַּר אֲחוּהִי דְאַבְרָם וַאֲזָלוּ וְהוּא יָתֵב בִּסְדוֹם:", "onk_en": "They took [<i>captured<\/i>] Lot and his wealth. [Lot was] Avram’s nephew. Then they went on their way. He had been living in Sedom.", "pj": "וּשְׁבוֹ יַת לוֹט וְיַת קִנְיָנֵיהּ בַּר אָחוֹי דְאַבְרָם וַאֲזָלוּ וְהוּא יָתֵיב בִּסְדוֹם", "pj_en": "And they made captive Lot the son of Abram's brother, and his property, and went. And he had dwelt in Sedom.", "tj": "", "tj_en": "", "rashi": "<b>והוא ישב בסדום.<\/b> מִי גָרַם לוֹ זֹאת? יְשִׁיבָתוֹ בִסְדוֹם:", "rashi_en": "והוא ישב בסדם FOR HE DWELT IN SODOM — What made this happen to him? The fact that he was dwelling in Sodom (Genesis Rabbah 42:7). "}, {"ch": 14, "v": 13, "aliyah": 4, "heb": "וַיָּבֹא֙ הַפָּלִ֔יט וַיַּגֵּ֖ד לְאַבְרָ֣ם הָעִבְרִ֑י וְהוּא֩ שֹׁכֵ֨ן בְּאֵֽלֹנֵ֜י מַמְרֵ֣א הָאֱמֹרִ֗י אֲחִ֤י אֶשְׁכֹּל֙ וַאֲחִ֣י עָנֵ֔ר וְהֵ֖ם בַּעֲלֵ֥י בְרִית־אַבְרָֽם׃", "onk": "וַאֲתָא מְשֵׁיזָבָא וְחַוִּי לְאַבְרָם עִבְרָאָה וְהוּא שָׁרֵי בְּמֵישְׁרֵי מַמְרֵא אֱמוֹרָאָה אֲחוּהִי דְאֶשְׁכּוֹל וַאֲחוּהִי דְעָנֵר וְאִנּוּן אֱנָשֵׁי קְיָמֵיהּ דְּאַבְרָם:", "onk_en": "The one who had escaped came and told Avram the Ivri, who was living in the Plains of Mamrei the Emorite, the brother of Eshkol and Aneir. They were Avram’s allies.", "pj": "וְאָתָא עוֹג דְאִישְׁתֵּזֵיב מִן גוּבְרַיָא דְמִיתוּ בְּטוּבְעָנָא וּרְכַב עִילוֹי תֵיבוּתָא וַהֲוָה גְנָנָא עַל רֵישֵׁיהּ וַהֲוָה מִתְפַּרְנֵס מִן מְזוֹנוֹי דְנחַ וְלָא בִּזְכוּתֵיהּ אִשְׁתֵּזִיב אֱלָהֵין דְיֶחֱמוּן דַיְירֵי עַלְמָא גְבוּרְתָּא דַיְיָ וְיֵימְרוּן הֲלָא גִיבָּרַיָא דַהֲווֹ מִלְקַדְמִין מָרְדוּ בְּמָארֵי עַלְמָא וְשֵׁיצֵיאוּנוּן מִן אַרְעָא וְכַד אַגְחוּ מַלְכַיָא הָאִילֵן הֲוֵהּ עוֹג עִמְהוֹן אָמַר בְּלִבֵּיהּ אֵיזֵיל וְאַחֲוֵי לְאַבְרָם עַל עֵיסַק לוֹט דְאִשְׁתְּבֵי וְיֵתֵי לְשֵׁיזְבוּתֵיהּ מִן יַדְהוֹן דְמַלְכַיָא וְיִתְמְסַר בִּידֵיהוֹן עָאֵל אָתָא בְּמֵיעֲלֵי יוֹמָא דְפִסְחָא אַשְכְּחֵיהּ דַהֲוָה עָבִיד גְרִיצִין פַּטִירָן בְּכֵן חַוִי לְאַבְרָם עִיבְרָא וְהוּא הֲוָה שָׁרֵי בְּחֶזְוֵי מַמְרֵא אֱמוֹרָאָה אָחוֹי דְאֶשְׁכּוֹל וְאָחוֹי דְעָנֵר וְהִינוּן הֲווֹ מָארֵי קַיְימֵיהּ דְאַבְרָם", "pj_en": "And Og came, who had been spared from the giants that died in the deluge, and had ridden protected upon the top of the ark, and sustained with food by Noah; not being spared through high righteousness, but that the inhabitants of the world might see the power of the Lord, and say, Were there not giants who in the first times rebelled against the Lord of the world, and perished from the earth? But when these kings made war, behold, Og, who was with them, said in his heart, I will go and show Abram concerning Lot, who is led captive, that he may come and deliver him from the hands of the kings into whose hands he has been delivered. And he arose and came, upon the eve of the day of the Pascha, and found him making the unleavened cakes. Then showed he to Abram the Hebrew, who dwelt in the valleys of Mamre Amoraah, brother of Eshkol and brother of Aner, who were men of covenant with Abram.", "tj": "", "tj_en": "", "rashi": "<b>ויבא הפליט.<\/b> לְפִי פְשׁוּטוֹ זֶה עוֹג, שֶׁפָּלַט מִן הַמִּלְחָמָה, וְהוּא שֶׁכָּתוּב כִּי רַק עוֹג נִשְׁאַר מִיֶּתֶר הָרְפָאִים (דבר' ג') וְזֶהוּ נִשְׁאַר, שֶׁלֹּא הֲרָגוּהוּ אַמְרָפֶל וַחֲבֵרָיו כְּשֶׁהִכּוּ הָרְפָאִים בְּעַשְׁתְּרוֹת קַרְנַיִם, תַּנְחוּמָא וּמִדְרַשׁ בְּ\"רַ זֶה עוֹג, שֶׁפָּלַט מִדּוֹר הַמַּבּוּל; וְזֶהוּ מִיֶּתֶר הָרְפָאִים, שֶׁנֶּאֱמַר הַנְּפִלִים הָיוּ בָאָרֶץ וְגוֹ' (לְעֵיל ו') וּמִתְכַּוֵּן שֶׁיֵּהָרֵג אַבְרָם וְיִשָּׂא אֶת שָׂרָה:<br><br><b>העברי.<\/b> שֶׁבָּא מֵעֵבֶר הַנָּהָר (בראשית רבה):<br><br><b>בעלי ברית אברם.<\/b> שֶׁכָּרְתוּ עִמּוֹ בְּרִית:", "rashi_en": "ויבא הפליט AND THERE CAME THE ONE WHO ESCAPED — According to the real meaning this was Og who had escaped from the battle with the Rephaim (see Genesis 5:5) and it is to this that the text refers (Deuteronomy 3:11) “For only Og king of Bashan was left of the remnant of the Rephaim”, and this is what is meant by נשאר “left”, for Amraphel and his allies did not kill him when they smote the Rephaim in Ashteroth Karnaim. So is the statement in the Tanchuma 4:6:25 (Chukat). But according to the Midrash Genesis Rabbah (Genesis Rabbah 42:8) it refers to Og in allusion to him as the only one of the generation of the Flood who escaped that catastrophe, and this is what is meant (Deuteronomy 3:11) “of the remnant of the Rephaim”, for it is said. (Genesis 6:4) “The Nephilim (= Rephaim cf. Genesis Rabbah 26) were in the earth etc.” His intention in telling Abraham that his nephew was captured was that Abraham should wage war against the kings and that he should be killed so that he, himself, might marry Sarah.<br><br>העברי THE HEBREW — the one who came from the other side (עבר) of the River (Euphrates) (Genesis Rabbah 42:8).<br><br>בעלי ברית אברם CONFEDERATE WITH ABRAM (literally, owners of a covenant with Abram) — They had entered into a covenant with him. Other versions of Rashi have: another explanation is, they advised him to circumcise himself (to keep the [ברית] covenant), as is explained in another place (cf. Rashi on Genesis 18:1). "}, {"ch": 14, "v": 14, "aliyah": 4, "heb": "וַיִּשְׁמַ֣ע אַבְרָ֔ם כִּ֥י נִשְׁבָּ֖ה אָחִ֑יו וַיָּ֨רֶק אֶת־חֲנִיכָ֜יו יְלִידֵ֣י בֵית֗וֹ שְׁמֹנָ֤ה עָשָׂר֙ וּשְׁלֹ֣שׁ מֵא֔וֹת וַיִּרְדֹּ֖ף עַד־דָּֽן׃", "onk": "וּשְׁמַע אַבְרָם אֲרֵי אִשְׁתְּבִי אֲחוּהִי וְזָרֵיז יָת <b>עוּלֵמוֹהִי<\/b> יְלִידֵי בֵיתֵיהּ תְּלָת מְאָה וְתַמְנֵי עֲסַר וּרְדַף עַד דָּן:", "onk_en": "When Avram heard that his kinsman was taken captive, he armed his trained servants [<i>lads<\/i>] who were born in his household, three hundred and eighteen [men], and he pursued [them] until Dan.", "pj": "וְכַד שְׁמַע אַבְרָם אֲרוּם אִשְׁתְּבִי אָחוּי וְזַיַין יַת עוּלֵימוֹי דְחָנִיךְ לִקְרָבָא מַרְבְּיָינֵי בֵּיתֵיהּ וְלָא צְבוּ לִמְהַלְכָה עִימֵיהּ וּבָחַר מִנְהוֹן יַת אֱלִיעֶזֶר בַּר נִמְרוֹד דַהֲוָה מְתִיל בִּגְבוּרְתֵּיהּ כְּכֻלְהוֹן תְּלַת מְאָה וְתַמְנֵסַר וּרְדַף עַד דָן", "pj_en": "And when Abram heard that his brother was made captive, he armed his young men who were trained for war, grown up in his house; but they willed not to go with him. And he chose from them Eliezer the son of Nimrod, who was equal in strength to all the three hundred and eighteen; and he pursued unto Dan.", "tj": "מַרְבִּיצֵי בֵּיתֵיהּ תְמַנֵי עַשְרֵי וּתְלַת מְאָה וּרְדַף בַּתְרֵיהוֹן עַד דָן דְקִיסְרִיוֹן:", "tj_en": "Domestics (marbitsi, down-liers) of his house, eighteen and three hundred, and pursued after them unto Dan of Kisarion.", "rashi": "<b>וירק.<\/b> כְּתַרְגּוּמוֹ וְזָרִיז, וְכֵן וַהֲרִיקֹתִי אַחֲרֵיכֶם חָרֶב (ויקרא כ\"ו) – אֶזְדַּיֵּן בְּחַרְבִּי עֲלֵיכֶם, וְכֵן אָרִיק חַרְבִּי (שמות ט\"ו), וְכֵן וְהָרֵק חֲנִית וּסְגֹר (תה' ל\"ה):<br><br><b>חניכיו.<\/b> חנכו כְּתִיב (ס\"אֲ קְרֵי), זֶה אֱלִיעֶזֶר שֶׁחִנְּכוֹ לְמִצְוֹת וְהוּא לְשׁוֹן הַתְחָלַת כְּנִיסַת הָאָדָם אוֹ כְלִי לָאֻמָּנוּת שֶׁהוּא עָתִיד לַעֲמֹד בָּהּ, וְכֵן חֲנֹךְ לַנַּעַר (משלי כ\"ב), חֲנֻכַּת הַמִּזְבֵּחַ (במד' ז'), חֲנֻכַּת הַבַּיִת (תה' ל') ובלע\"ז קוֹרִין לוֹ אינצ\"נייר:<br><br><b>שמנה עשר וגו'.<\/b> רַבּוֹתֵינוּ אָמְרוּ אֱלִיעֶזֶר לְבַדּוֹ הָיָה (נדרים ל\"ב), וְהוּא מִנְיַן גִּימַטְרִיָּא שֶׁל שְׁמוֹ:<br><br><b>עד דן.<\/b> שָׁם תָּשַׁשׁ כֹּחוֹ, שֶׁרָאָה שֶׁעֲתִידִין בָּנָיו לְהַעֲמִיד שָׁם עֵגֶל (סנה' צ\"ו):", "rashi_en": "וירק Its meaning is as the Targum takes it: “he girded”. Similar are (Leviticus 24:33) “And I will gird myself (והריקותי) with the sword against you\", and (Exodus 15:9)  “I will gird on (אריק) my sword”, and (Psalms 35:3) “Gird thyself (הרק) with the spear and battle axe”.<br><br>חניכיו HIS TRAINED SERVANTS — The word is written without a י (after the כ) so it may be read חניכו “his trained one”, referring to Eliezer whom he had trained to the observance of religious duties. The word חנך signifies introducing a person or a thing, for the first time, to some particular occupation in which it is intended that he should remain (i. e. to dedicate or devote to some particular purpose). It has a similar sense in (Proverbs 22:6) “Train up (חנוך) a child”, and in (Numbers 7:84) חנוכת המזבח “the dedication of the altar”, and (Psalms 30:1) “The dedication (חנוכת) of the house” In old French enseigner; English: to teach, instruct.<br><br>'שמנה עשר וגו THREE HUNDRED AND EIGHTEEN — Our Rabbis said, “It was Eliezer alone whom he armed and it (318) is the numerical value of his name” (Nedarim 32a).<br><br>עד דן AS FAR AS DAN — There his strength failed him for he saw prophetically that at some future time his descendants would there erect a calf (Sanhedrin 96a)."}, {"ch": 14, "v": 15, "aliyah": 4, "heb": "וַיֵּחָלֵ֨ק עֲלֵיהֶ֧ם&thinsp;<small>׀<\/small>&thinsp;לַ֛יְלָה ה֥וּא וַעֲבָדָ֖יו וַיַּכֵּ֑ם וַֽיִּרְדְּפֵם֙ עַד־חוֹבָ֔ה אֲשֶׁ֥ר מִשְּׂמֹ֖אל לְדַמָּֽשֶׂק׃", "onk": "וְאִתְפְּלֵג עֲלֵיהוֹן לֵילְיָא הוּא וְעַבְדוֹהִי וּמְחוֹנוּן וּרְדָפִנּוּן עַד חוֹבָה דִּי <b>מִצִּפּוּנָא<\/b> לְדַמָּשֶׂק:", "onk_en": "He divided [his men] against them at night, he and his servants and he attacked them. He pursued them until Chovah, which is to the left [<i>north<\/i>] of Damascus.", "pj": "וְאִתְפְּלֵיג לְהוֹם לֵילְיָא בְּאָרְחָא פַלְגוּתָא אַגְחָן עִם מַלְכַיָא וּפַלְגוּתָא אַצְטִינְיָיא לְמִימְחֵי בּוּכְרַיָא בְּמִצְרַיִם וְקָם אִיהוּ וְעַבְדוֹי וּמְחִינוּן וּרְדָפִינוּן מַה דְאִשְׁתְּאַר מִנְהוֹן עַד דְאִידְכַּר חוֹבָא דְעָתִיד לְמֶהֱוֵי בְּדָן דְמִצִיפּוּנָא לְדַרְמָשֶק", "pj_en": "And he divided them at night in the way; a part were to engage with the kings, and a part were hidden to smite the firstborn of Egypt. And he arose, he and his servants, and smote them, and pursued them which remained of them unto (the place) of the memorial of sin which was to be in Dan, from the north of Darmesek.", "tj": "וּרְדָפִינוּן עַד עַוְותָא דְמִצָפוֹן לְדַמֶשֶק:", "tj_en": "And he pursued them unto Havetha, which is from the north of Darmesek.", "rashi": "<b>ויחלק עליהם.<\/b> לְפִי פְשׁוּטוֹ סָרֵס הַמִּקְרָא \"וַיֵּחָלֵק הוּא וַעֲבָדָיו עֲלֵיהֶם לַיְלָה\" כְּדֶּרֶך הָרוֹדְפִים שֶׁמִּתְפַּלְּגִים אַחַר הַנִּרְדָּפִים, כְּשֶׁבּוֹרְחִין זֶה לְכָאן וְזֶה לְכָאן:<br><br><b>לילה.<\/b> כְּלוֹמַר אַחַר שֶׁחָשְׁכָה לֹא נִמְנַע מִלְּרָדְפָם. וּמִדְרַשׁ אַגָּדָה שֶׁנֶּחֱלַק הַלַּיְלָה, וּבְחֶצְיוֹ הָרִאשׁוֹן נַעֲשָׂה לוֹ נֵס, וְחֶצְיוֹ הַשֵּׁנִי נִשְׁמַר וּבָא לוֹ לַחֲצוֹת לַיְלָה שֶׁל מִצְרַיִם:<br><br><b>עד חובה.<\/b> אֵין מָקוֹם שֶׁשְּׁמוֹ חוֹבָה, וְדָן קוֹרֵא חוֹבָה, עַל שֵׁם עֲבוֹדָה זָרָה שֶׁעֲתִידָה לִהְיוֹת שָׁם:", "rashi_en": "ויחלק עליהם AND HE DIVIDED HIMSELF AGAINST THEM — In accordance with its plain sense you must invert the order of the words of the verse: “And he divided himself, he and his servants, against them, at night”, as is the manner of those who pursue their enemies — they divide themselves up to follow after those of whom they are in pursuit when these flee in different directions.<br><br>לילה BY NIGHT, meaning, even after it became dark they did not give up pursuing them. According to the Midrashic explanation, it was the night that was divided): during its first half a miracle was wrought for him, and the second half was kept in reserve for the miracle of the midnight in Egypt (Genesis Rabbah 43:3).<br><br>עד חובה UNTO HOBAH — There is no place bearing the name Hobah, but the city Dan is called Hobah (guilty city) on account of the idolatry which would once be practised there (Midrash Tanchuma, Lech Lecha 13)."}, {"ch": 14, "v": 16, "aliyah": 4, "heb": "וַיָּ֕שֶׁב אֵ֖ת כׇּל־הָרְכֻ֑שׁ וְגַם֩ אֶת־ל֨וֹט אָחִ֤יו וּרְכֻשׁוֹ֙ הֵשִׁ֔יב וְגַ֥ם אֶת־הַנָּשִׁ֖ים וְאֶת־הָעָֽם׃", "onk": "וַאֲתֵב יָת כָּל קִנְיָנָא וְאַף יָת לוֹט <b>בַּר אֲחוּהִי<\/b> וְקִנְיָנֵיהּ אֲתֵיב וְאַף יָת נְשַׁיָּא וְיָת עַמָּא:", "onk_en": "He brought back all the property. His kinsman [<i>His brother’s son<\/i>] Lot and his possessions he also brought back, as well as the women and the people.", "pj": "וְאָתֵיב יַת כָּל קִנְיָינָא וְאוּף יַת לוֹט אָחוֹי וְקִנְיָנֵיהּ אָתֵיב וְאוּף יַת נְשַׁיָא וְיַת עַמָא", "pj_en": "And he brought back all the substance, and also Lot his brother and his substance he brought back, and also the women and the people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 17, "aliyah": 4, "heb": "וַיֵּצֵ֣א מֶֽלֶךְ־סְדֹם֮ לִקְרָאתוֹ֒ אַחֲרֵ֣י שׁוּב֗וֹ מֵֽהַכּוֹת֙ אֶת־כְּדׇרְלָעֹ֔מֶר וְאֶת־הַמְּלָכִ֖ים אֲשֶׁ֣ר אִתּ֑וֹ אֶל־עֵ֣מֶק שָׁוֵ֔ה ה֖וּא עֵ֥מֶק הַמֶּֽלֶךְ׃", "onk": "וּנְפַק מַלְכָּא דִסְדוֹם לְקַדָּמוּתֵיהּ בָּתַר דְּתָב מִלְּמִמְחֵי יָת כְּדָרְלָעוֹמֶר וְיָת מַלְכַיָּא דִּי עִמֵּיהּ <b>לְמֵישַׁר מַפְנָא הוּא אֲתַר בֵּית רֵיסָא דְמַלְכָּא<\/b>:", "onk_en": "The King of Sedom went out to meet him after his return from defeating Kedorlaomer and the kings that were with him, to the Valley of Shaveh which is the King’s Valley [<i>to the barren plain, which is the place of the racetrack of the king<\/i>].", "pj": "וּנְפַק מַלְכָּא דִסְדוֹם לְקָדָמוּתֵיהּ בָּתַר דְתַב מִלְמִמְחֵי יַת כְּדָרְלָעוֹמֶר וְיַת מַלְכַיָא דְעִימֵיהּ לְמֵישַׁר מְפַנָא הוּא בֵּית רֵיסָא דְמַלְכָּא", "pj_en": "And the king of Sedom came forth, after that he returned from destroying Kedarlaomer and the kings who were with him, to meet him at the plain of Mephana, which was the king's race-course.", "tj": "וְיַת מַלְכַיָא דְעִימֵיהּ לְמֵישַׁר דַחֲזוֹזָא הוּא בֵּית מֵישְׁרָא דְמַלְכָּא:", "tj_en": "And the kings who were with him, at the plain of vision which was the house of the king's plain.", "rashi": "<b>עמק שוה.<\/b> כָּךְ שְׁמוֹ, כְּתַרְגּוּמוֹ לְמֵישַׁר מְפַנָּא – פָּנוּי מֵאִילָנוֹת וּמִכָּל מִכְשׁוֹל:<br><br><b>עמק המלך.<\/b> בֵּית רֵיסָא דְמַלְכָּא בֵּית רִיס א' שֶׁהוּא שְׁלֹשִׁים קָנִים, שֶׁהָיָה מְיֻחָד לַמֶּלֶךְ לְצַחֵק שָׁם. וּמִדְרַשׁ אַגָּדָה עֵמֶק, שֶׁהֻשְׁווּ שָׁם כָּל הָאֻמּוֹת וְהִמְלִיכוּ אֶת אַבְרָהָם עֲלֵיהֶם לִנְשִׂיא אֱלֹהִים וּלְקָצִין:", "rashi_en": "עמק שוה THE VALLEY OF SHAVEH— So was its name; but the Targum translates it, “to the empty plain” — clear of trees and all impediments.<br><br>עמק המלך THE KINGS VALE Onkelos translates it by the king’s race-course: a hippodrome that was thirty “kona” (measuring rods) and was set apart for the king’s sport. The Midrashic explanation is that it was the valley where all the nations unanimously agreed (הושוו) in appointing Abraham as prince and leader over them (Genesis Rabbah 43:5). "}, {"ch": 14, "v": 18, "aliyah": 4, "heb": "וּמַלְכִּי־צֶ֙דֶק֙ מֶ֣לֶךְ שָׁלֵ֔ם הוֹצִ֖יא לֶ֣חֶם וָיָ֑יִן וְה֥וּא כֹהֵ֖ן לְאֵ֥ל עֶלְיֽוֹן׃", "onk": "וּמַלְכִּי צֶדֶק מַלְכָּא <b>דִירוּשְׁלֶם<\/b> אַפֵּיק לְחֵם וַחֲמָר וְהוּא <b>מְשַׁמֵּשׁ<\/b> קֳדָם אֵל עִלָּאָה:", "onk_en": "Malki Zedek, king of Shaleim [<i>Yerushalayim<\/i>], brought out bread and wine. He was a Kohein of [<i>He was serving before<\/i>] the Most High Almighty.", "pj": "וּמַלְכָּא צַדִיקָא הוּא שֵׁם בַּר נחַ מַלְכָּא דִירוּשְׁלֶם נָפַק לִקְדָמוּת אַבְרָם וְאַפֵּיק לֵיהּ לֶחֶם וַחֲמַר בְּהַהוּא זִימְנָא הֲוָה מְשַׁמֵשׁ קָדָם אֱלָהָא עִילָאָה", "pj_en": "And Malka Zadika, who was Shem bar Noah, the king of Yerushalem, came forth to meet Abram, and brought forth to him bread and wine; and in that time he ministered before Eloha Ilaha.", "tj": "וּמַלְכִּי צֶדֶק מַלְכָּא דִירוּשְׁלֶם הוּא שֵׁם רַבָּא הֲוָה כָּהִין עִילָאָה:", "tj_en": "And Malki Zedek, king of Yerushalem, who was Shem, who was the great priest of the Most High.", "rashi": "<b>ומלכי צדק.<\/b> מִ\"אַ הוּא שֵׁם בֶן נֹחַ (נדרים ל\"ב):<br><br><b>לחם ויין.<\/b> כָּךְ עוֹשִׂים לִיגִיעֵי מִלְחָמָה, וְהֶרְאָה לוֹ שֶׁאֵין בְּלִבּוֹ עָלָיו עַל שֶׁהָרַג אֶת בָּנָיו. ומִ\"אַ רָמַז לוֹ עַל הַמְּנָחוֹת וְעַל הַנְּסָכִים שֶׁיַּקְרִיבוּ שָׁם בָּנָיו:", "rashi_en": "ומלכי צדק AND MELCHIZEDEK — A Midrashic explanation is that he is identical with Shem, son of Noah (Nedarim 32b).<br><br>לחם ויין BREAD AND WINE — Thus is done for those wearied through battle. He showed him (Abraham) that he bore him no malice for killing his descendants. The Midrashic explanation is that he (Melchizedek) thereby gave an intimation to him (Abraham) of the meal-offerings and libations which his descendants would offer there (in Salem which is Jeru-salem) (Genesis Rabbah 43:6)."}, {"ch": 14, "v": 19, "aliyah": 4, "heb": "וַֽיְבָרְכֵ֖הוּ וַיֹּאמַ֑ר בָּר֤וּךְ אַבְרָם֙ לְאֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָאָֽרֶץ׃", "onk": "וּבָרְכֵיהּ וַאֲמָר בְּרִיךְ אַבְרָם לְאֵל עִלָּאָה דִּקִנְיָנֵיהּ שְׁמַיָּא וְאַרְעָא:", "onk_en": "He blessed him and said: Blessed be Avram to the Most High, Almighty Possessor of heaven and earth.", "pj": "וּבָרְכֵיהּ וַאֲמַר בְּרִיךְ אַבְרָם מִן יְיָ אֱלָהָא עִילָאָה דִבְגִין צַדִיקַיָא קְנָא שְׁמַיָא וְאַרְעָא", "pj_en": "And he blessed him, and said, Blessed be Abram of the Lord God Most High, who for the righteous possesseth the heavens and the earth.", "tj": "", "tj_en": "", "rashi": "<b>קנה שמים וארץ.<\/b> כְּמוֹ עֹשֵׂה שָׁמַיִם וָאָרֶץ (תה' קל\"ד); עַל יְדֵי עֲשִׂיָּתָן קְנָאָן לִהְיוֹת שֶׁלּוֹ:", "rashi_en": "קנה שמים וארץ MAKER, or POSSESSOR OF HEAVEN AND EARTH — similar to (Psalms 134:3) עשה שמים וארץ “Maker of heaven and earth”: through His having made them He acquired them as His possession. "}, {"ch": 14, "v": 20, "aliyah": 4, "heb": "וּבָרוּךְ֙ אֵ֣ל עֶלְי֔וֹן אֲשֶׁר־מִגֵּ֥ן צָרֶ֖יךָ בְּיָדֶ֑ךָ וַיִּתֶּן־ל֥וֹ מַעֲשֵׂ֖ר מִכֹּֽל׃", "onk": "וּבְרִיךְ אֵל עִלָּאָה דִּמְסַר סָנְאָךְ בִּידָךְ וִיהַב לֵיהּ חַד מִן עַסְרָא מִכֹּלָּא:", "onk_en": "And blessed be the Most High Almighty Who has delivered your enemies into your hand. [Avram] gave him a tenth of everything.", "pj": "וּבְרִיךְ אֱלָהָא עִילָאָה דְעָבַד סַנְאָךְ כִּתְרֵיסָא דִמְקַבֵּל מַחְתָּא וִיהַב לֵיהּ חַד מִן עַסְרָא מִכָּל מַה דְאָתֵיב", "pj_en": "And blessed be Eloha Ilaha, who hath made thine enemies as a shield which receiveth a blow. And he gave to him one of ten, of all which he brought back.", "tj": "", "tj_en": "", "rashi": "<b>אשר מגן.<\/b> אֲשֶׁר הִסְגִּיר, וְכֵן אֲמַגֶּנְךָ יִשְׂרָאֵל (הושע י\"א):<br><br><b>ויתן לו.<\/b> אַבְרָהָם <b>מעשר מכל<\/b> אֲשֶׁר לוֹ, לְפִי שֶׁהָיָה כֹהֵן:", "rashi_en": "אשר מגן WHO HATH DELIVERED [THY ENEMIES INTO THY HANDS] — מגן means who has handed over or surrendered, as (Hosea 11:8) “How shall I give thee over, (אמגנך) Israel”<br><br>ויתן לו AND HE — Abraham — GAVE HIM מעשר מכל A TITHE OF EVERYTHING that he had, because he was a priest. "}, {"ch": 14, "v": 21, "aliyah": 5, "heb": "וַיֹּ֥אמֶר מֶֽלֶךְ־סְדֹ֖ם אֶל־אַבְרָ֑ם תֶּן־לִ֣י הַנֶּ֔פֶשׁ וְהָרְכֻ֖שׁ קַֽח־לָֽךְ׃", "onk": "וַאֲמַר מַלְכָּא דִסְדוֹם לְאַבְרָם הַב לִי נַפְשָׁתָא וְקִנְיָנָא דְּבַר (<small>נ\"א<\/small> סַב) לָךְ:", "onk_en": "The King of Sedom said to Avram: Give me the people, and take the possessions for yourself.", "pj": "וַאֲמַר מַלְכָּא דִסְדוֹם לְאַבְרָם הַב לִי נַפְשַׁת אֵינָשָׁא דְעַמִי דַאֲתֵיבְתָּא וְקִנְיָינָא דְבַר לָךְ", "pj_en": "And the king of Sedom said to Abram, Give me the souls of the men of my people whom thou hast brought back, and the substance take to thyself.", "tj": "וּסְגוּלָה דְבַר לָךְ:", "tj_en": "And the treasure take to thee.", "rashi": "<b>תן לי הנפש.<\/b> מִן הַשְּׁבִי שֶׁלִּי שֶׁהִצַּלְתָּ, הַחֲזֵר לִי הַגּוּפִים לְבַדָּם:", "rashi_en": "תן לי הנפש GIVE ME THE PERSONS — Of that which was captured of mine and which you have rescued give me back the people only."}, {"ch": 14, "v": 22, "aliyah": 5, "heb": "וַיֹּ֥אמֶר אַבְרָ֖ם אֶל־מֶ֣לֶךְ סְדֹ֑ם הֲרִמֹ֨תִי יָדִ֤י אֶל־יְהֹוָה֙ אֵ֣ל עֶלְי֔וֹן קֹנֵ֖ה שָׁמַ֥יִם וָאָֽרֶץ׃", "onk": "וַאֲמַר אַבְרָם לְמַלְכָּא דִסְדוֹם אֲרֵימִית יְדַי <b>בִּצְלוֹ קֳדָם<\/b> יְיָ <b>קֳדָם<\/b> אֵל עִלָּאָה דִּקִנְיָנֵיהּ שְׁמַיָּא וְאַרְעָא:", "onk_en": "Avram said to the King of Sedom: I have lifted my hand [<i>in prayer<\/i>] to [<i>before<\/i>] Adonoy [<i>before<\/i>] the Most High Almighty, Possessor of heaven and earth.", "pj": "וַאֲמַר אַבְרָם לְמַלְכָּא דִסְדוֹם אֲרֵימִית יָדִי בִּשְׁבוּעָה קֳדָם יְיָ אֱלָהָא עִילָאָה דִבְגִין צַדִיקַיָא קָנָא בְּקִנְיָינֵיהּ שְׁמַיָא וְאַרְעָא", "pj_en": "And Abram said to the king of Sedom, I have uplifted my hands in an oath before the Lord God the Most High, who for the just possesseth his possession of the heavens and the earth,", "tj": "", "tj_en": "", "rashi": "<b>הרימתי ידי.<\/b> לְשׁוֹן שְׁבוּעָה, מֵרִים אֲנִי אֶת יָדִי לְאֵל עֶלְיוֹן, וְכֵן בִּי נִשְׁבַּעְתִּי (בר' כ\"ב), נִשְׁבַּע אֲנִי, וְכֵן נָתַתִּי כֶּסֶף הַשָּׂדֶה קַח מִמֶּנִּי (שם כ\"ג), נוֹתֵן אֲנִי לְךָ כֶּסֶף הַשָּׂדֶה, קָחֵהוּ מִמֶּנִּי:", "rashi_en": "הרמתי ידי I HAVE LIFTED UP MY HAND — An expression signifying an oath: I lift up my hand to the Most High God (not, I have lifted up). Similarly, (Genesis 22:16) בי נשבעתי which means “By myself do I swear” and similarly, (Genesis 23:13) נתתי כסף השדה קח ממני which means “I give the price of the field, take it from me”.) "}, {"ch": 14, "v": 23, "aliyah": 5, "heb": "אִם־מִחוּט֙ וְעַ֣ד שְׂרֽוֹךְ־נַ֔עַל וְאִם־אֶקַּ֖ח מִכׇּל־אֲשֶׁר־לָ֑ךְ וְלֹ֣א תֹאמַ֔ר אֲנִ֖י הֶעֱשַׁ֥רְתִּי אֶת־אַבְרָֽם׃", "onk": "אִם מִחוּטָא וְעַד עַרְקַת מְסָנָא וְאִם אֶסַּב מִכָּל דִּי לָךְ וְלָא תֵימַר אֲנָא אַעְתָּרִית יָת אַבְרָם:", "onk_en": "Neither a thread nor a shoelace! And I will not take anything of yours, so you will not [be able] to say, I have made Avram wealthy.", "pj": "אִין מִן חוּטָא וְעַד סַנְדְלַת רְצוּעָה אִין אֶסַב מִכָּל דִי לָךְ וְלָא תְהֵי מִתְרַבְרַב לְמֵימָר אֲנָא אַעֲתָרִית מִן דִידִי יַת אַבְרָם", "pj_en": "if from a thread to the latchet of a sandal I receive any thing of all that is thine; lest thou magnify thyself in saying, I have enriched Abram from mine own.", "tj": "אִם מֵחוּטָא וְעַד רְצוּעָה דְסַנְדְלָא אִם אֶסַב מִכָּל דִילָךְ וְלָא תֶהֱוֵי מִתְרַבְרַב וַאֲמַר אֲנָא עֲתָרִית יַת אַבְרָם:", "tj_en": "If from a thread to the latchet of a sandal I receive of all that is thing: that thou magnify not thyself and say, I have enriched Abram.", "rashi": "<b>אם מחוט ועד שרוך נעל.<\/b> אַעֲכֵּב לְעַצְמִי מִן הַשְּׁבִי:<br><br><b>ואם אקח מכל אשר לך.<\/b> וְאִם תֹּאמַר לָתֵת לִי שָׂכָר מִבֵּית גְּנָזֶיךָ, לֹא אֶקַּח:<br><br><b>ולא תאמר וגו'.<\/b> שֶׁהַקָּדוֹשׁ בָּרוּךְ הוּא הִבְטִיחַנִי לְעַשְּׁרֵנִי, שֶׁנֶּאֱמַר וַאֲבָרֶכְךָ וְגוֹ':", "rashi_en": "אם מחוט ועד שרוך נעל NOT ANYTHING FROM A THREAD EVEN TO A SANDAL TIE shall I retain for myself from the spoil.<br><br>ואם אקח מכל אשר לך NOR ANYTHING THAT IS THINE WILL I TAKE — And if you say that you will reward me from your own treasures I will still not accept anything<br><br>'ולא תאמר וגו SO THAT THOU SHOULDST NOT SAY etc. — For the Holy One, blessed be He, has promised to give me riches, as it is said, (Genesis 12:2) “And I will bless thee” (see Rashi on this passage, where the blessing is explained to consist in ממון “wealth”). "}, {"ch": 14, "v": 24, "aliyah": 5, "heb": "בִּלְעָדַ֗י רַ֚ק אֲשֶׁ֣ר אָֽכְל֣וּ הַנְּעָרִ֔ים וְחֵ֙לֶק֙ הָֽאֲנָשִׁ֔ים אֲשֶׁ֥ר הָלְכ֖וּ אִתִּ֑י עָנֵר֙ אֶשְׁכֹּ֣ל וּמַמְרֵ֔א הֵ֖ם יִקְח֥וּ חֶלְקָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לְחוֹד (<small>נ\"א<\/small> בַּר) מִדִּאֲכָלוּ עוּלֵמַיָּא וְחוּלַק גֻּבְרַיָּא דִּי אֲזָלוּ עִמִּי עָנֵר אֶשְׁכֹּל וּמַמְרֵא אִנּוּן יְקַבְּלוּן חֲלָקְהוֹן:", "onk_en": "I am excluding myself; only what the lads have eaten, and the portion of the men who went with me, Aneir, Eshkol and Mamrei, they may take their portion.", "pj": "הֲלָא לֵית לִי רְשׁוּ בְכּוֹלָא אַרְעָא דְבַר מִנִי אָכְלוּ עוּלֵימַיָא וְחוֹלַק גוּבְרַיָא דַאֲזָלוּ עִמִי עָנֵר אֶשְׁכּוֹל וּמַמְרֵא אַף הִינוּן יִסְבּוּן חוּלְקֵיהוֹן", "pj_en": "Have I not power over all the spoil?--Apart from what the young men have eaten, and the portion of the men who went with me, Aner, Eshkol, and Mamre, they also receiving their portion.", "tj": "", "tj_en": "", "rashi": "<b>הנערים.<\/b> עֲבָדַי אֲשֶׁר הָלְכוּ אִתִּי וְעוֹד עָנֵר אֶשְׁכֹּל וּמַמְרֵא וְגוֹ'; אַף עַל פִּי שֶׁעֲבָדַי נִכְנְסוּ לַמִּלְחָמָה, שֶׁנֶּאֱמַר הוּא וַעֲבָדָיו וַיַּכֵּם, וְעָנֵר וַחֲבֵרָיו יָשְׁבוּ עַל הַכֵּלִים לִשְׁמֹר, אֲפִלּוּ הָכִי הֵם יִקְחוּ חֶלְקָם. וּמִמֶּנּוּ לָמַד דָּוִד, שֶׁאָמַר כְּחֵלֶק הַיֹּרֵד בַּמִּלְחָמָה וּכְחֵלֶק הַיֹּשֵׁב עַל הַכֵּלִים יַחְדָּו יַחֲלֹקוּ (שמואל א ל'), וּלְכָךְ נֶאֱמַר וַיְהִי מֵהַיּוֹם הַהוּא וָמָעְלָה וַיְשִׂמֶהָ לְחֹק וּלְמִשְׁפָּט (שם), וְלֹא נֶאֱמַר וָהָלְאָה, לְפִי שֶׁכְּבָר נִתַּן הַחֹק בִּימֵי אַבְרָם:", "rashi_en": "הנערים THE LADS — My servants who went with me. Then, again, the others ANER, ESHCOL AND MAMRE [THEY MAY TAKE THEIR PORTION ] — Although my servants took part in the battle as it is said (Genesis 14:15) “he and his servants and smote them” — whilst Aner and his friends remained with the baggage to guard it yet they may take their share. From him (Abraham) David took a lesson when he said, (1 Samuel 30:24) “But as his part is that goeth down to the battle, so shall his part be that tarrieth by the stuff: they shall share alike”; therefore it goes on to say (1 Samuel 30:25), “And this had been so from that day — ומעלה — and had been so from former times: therefore he (David) made it a statute and an ordinance” — it does not state והלאה “and henceforward”, for the statute had already been ordained) in the days of Abram (Genesis Rabbah 43:9)."}, {"ch": 15, "v": 1, "aliyah": 5, "heb": "אַחַ֣ר&thinsp;<b>׀<\/b> הַדְּבָרִ֣ים הָאֵ֗לֶּה הָיָ֤ה דְבַר־יְהֹוָה֙ אֶל־אַבְרָ֔ם בַּֽמַּחֲזֶ֖ה לֵאמֹ֑ר אַל־תִּירָ֣א אַבְרָ֗ם אָנֹכִי֙ מָגֵ֣ן לָ֔ךְ שְׂכָרְךָ֖ הַרְבֵּ֥ה מְאֹֽד׃", "onk": "בָּתַר פִּתְגָּמַיָּא הָאִלֵּין הֲוָה פִּתְגָּמָא דַיְיָ עִם אַבְרָם בִּנְבוּאָה לְמֵימָר לָא תִדְחַל אַבְרָם <b>מֵימְרִי תְּקוֹף לָךְ<\/b> אַגְרָךְ סַגִּי לַחֲדָא:", "onk_en": "After these events, the word of Adonoy came to Avram in a vision, saying: Fear not Avram, I am your shield [<i>My Word is your strength<\/i>], your reward is very great.", "pj": "בָּתַר פִּתְגָמַיָא הָאִילֵין מִן דְאִתְכַּנְשׁוּ מַלְכַיָא וּנְפָלוּ קוֹמֵי אַבְרָם וְקַטָלוּ אַרְבָּעָה מַלְכִין וַאֲהֲדַר תְּשַׁע מַשִׁירְיַין חָשַׁב אַבְרָם בְּלִבֵּיהּ וַאֲמַר וַוי כְּעַן לִי דִלְמָא אִתְקַבָּלַת אֲגָר מִצְווֹתַי בְּעַלְמָא הָדֵין וְלֵית לִי חוּלַק בְעַלְמָא דְאָתֵי אוֹ דִלְמָא יֵיזְלוּן אֲחֵיהוֹן וּקְרִיבֵהוֹן דְאִילֵין קְטִילַיָא וְיִצְטַרְפוּן בְּלִגְיוֹנִין וְיֵתוּן עָלַי אוֹ דִלְמָא בְּזִמְנָא הַהוּא אִשְׁתַּכַּח עִמִי אֲגַר זַכְוָון קְלִילִין וּנְפָלוּ קֳדָמַי וּבְזִמְנָא תִּנְיָינָא לָא מִשְׁתַּכַּח עִמִי אַגְרָא וְיִתְחַל בִּי שׁוּם שְׁמַיָא וּבְכֵן הֲוָה פִּתְגָמָא דַיְיָ עִם אַבְרָם בְּחֵיזְוָונָא לְמֵימַר לָא תִדְחַל דְאַף עַל גַב גִיבָּרֵיהוֹן מִצְטַרְפִין בְּלִגְיוֹנִין וְאַתְיָין עֲלָךְ מֵימְרִי תְּרִים לָךְ וְאַף עַל גַב דְאִינוּן נַפְלִין קוּמָךְ בְּעַלְמָא הָדֵין אֲגַר עוֹבְדָךְ טַבְיָא נְטִיר וּמְתַקֵן קֳדָמַי לְעַלְמָא דְאָתֵי סַגִי לַחֲדָא", "pj_en": "After these words, when the kings had gathered together, and had fallen before Abram; and four kings had been slain, and nine hosts brought back, Abram reasoned in his heart, and said, Woe to me, because I have received the reward of my appointments in this world, and have no portion in the world to come. Or peradventure the brethren and friends of those who have been slain will combine in legions and come against me; or that at that time there was found with me the reward of a little righteousness, so that they fell before me; but the second time reward may not be found with me, and by me the name of the Heavens may be profaned. Thereupon was the word (pithgama) of the Lord with Abram in a vision, saying, Fear not; for if these men should gather together in legions and come against thee, My Word (Memra) will be thy shield: and also if these fall before thee in this world, the reward of thy good works shall be kept, and be prepared before Me in the world to come, great exceedingly.", "tj": "מִן בָּתַר פִּתְגָמַיָא הָאִילֵין מִן דְאִתְכַּנְשׁוּ כָּל מַלְכַיָא דְאַרְעָא וְשִׁלְטוֹנֵי מְדִינָתָא וּסְדָרוּ קְרָבָא לְקָבֵיל אַבְרָם צַדִיקָא וּנְפָלוּ קָדָמוֹי וּקְטֵל מִנְהוֹן אַרְבְּעָא מַלְכִין וַחֲזַר תְּשַׁע מַשִׁירְיַין חָשַׁב אַבְרָם צַדִיקָא בְּלִיבֵּיהּ וַאֲמַר וַוי כְּעַן עָלַי דִלְמָא דְאִתְקַבָּלַת אֲגָר מִצְוָתָא בְּעַלְמָא הָדֵין וְלֵית לִי חוּלַק בְּעַלְמָא דְאָתֵי אוֹ דִלְמָא דְיִזְלוּן אֲחֵיהוֹן וְקָרִיבֵיהוֹן דִקְטִילַיָא הָאִילֵין דִנְפָלוּ צ\"ל קֳדָמוֹי וְיֶהֱוָן בִּכְּרַכֵּיהוֹן וּבִמְדִינַתְהוֹן וְיִצְרְפוּ עִמְהוֹן לִגְיוֹנִין סַגְיָין וְיֵיתוּן עָלַי אוֹ דִלְמָא הֲווֹ בִּידִי מִצְוָון קַלִילִין בְזִימְנָא קָדָמַיָא דִנְפָלוּ קָדָמוֹי וְאִתְקַיְימוּ עָלַי אוֹ דִלְמָא אִשְׁתְּכַּח לִי זְכוֹי בְּזִמְנָא קָדָמַיָא דִנְפָלוּ קָדָמוֹי אוֹ דִלְמָא דִי לָא יִשְׁתְּכַּח לִי בְּזִמְנָא תִּינְיָנַיָא וְיִתְחַלֵל בִּי שׁוּם שְׁמַיָא בְּגִין כְּדֵין הֲוָה פִּתְגַם נְבוּאָה מִן קֳדָם יְיָ עַל אַבְרָם צַדִיקָא לְמֵימַר לָא תִידְחַל אַבְרָם אַף עַל גַב דְאִינוּן מִתְכַּנְשִׁין וְאַתְיַין עֲלָךְ לִגְיוֹנִין סַגְיָן מֵימְרִי פְּרַס תְּרֵיס לָךְ בְּעַלְמָא הָדֵין וּמָגֵן עֲלָךְ כָּל יוֹמָא לְעַלְמָא דְאָתֵי וְאַף עַל גַב דִמְסָרִית בַּעֲלֵי דְבָבָךְ קָדָמָךְ בְּעַלְמָא הָדֵין אֲגָר עוֹבָדָךְ טַבְיָא מְתַקְנִין לָךְ קָדָמוֹי לְעַלְמָא דְאָתִי:", "tj_en": "After these words, when all the kings of the lands, and the sultans of the provinces, had gathered together, and had made war against Abram the Just, and had fallen before him, and he had slain of them four kings, and had brought back nine hosts, did Abram the Just reason in his heart, and say, Woe, now, to me, because I have received the reward ordained in the present world, and have no portion in the world to come. Or peradventure the brethren and kindred of the slain who have fallen before me, who are in their cities and provinces, will combine in great legions, and come against me; or peradventure there were in my hand a few commandments in the former times, so that they fell before me when they had risen up against me; or it may be that righteousness was found in me at the former times, that they fell before me, but at the second time it may not be found, and the Heavenly Name will be profaned in me. Then was the word of prophecy from the Lord unto Abram the Righteous, saying, Fear not, Abram, though they should gather together and come against thee with many legions, My Word shall be thy reward and thy shield in this world, and a protector over thee all the days of the world to come. And though I deliver up thy adversaries before thee in this world, the reward of thy good works is prepared for thee also before Me in the world to come.", "rashi": "<b>אחר הדברים האלה.<\/b> כָּל מָקוֹם שֶׁנֶאֱמַר אַחַר – סָמוּךְ, אַחֲרֵי – מֻפְלָג (בראשית רבה). אַחַר הַדְּבָרִים הָאֵלֶּה אַחַר שֶׁנַּעֲשָׂה לוֹ נֵס זֶה, שֶׁהָרַג אֶת הַמְּלָכִים וְהָיָה דוֹאֵג וְאוֹמֵר, שֶׁמָּא קִבַּלְתִּי שָׂכָר עַל כָּל צִדְקוֹתַי, לְכָךְ אָמַר לוֹ הַמָּקוֹם אַל תִּירָא אַבְרָם אָנֹכִי מָגֵן לָךְ, מִן הָעֹנֶשׁ, שֶׁלֹּא תֵּעָנֵשׁ עַל כָּל אוֹתָן נְפָשׁוֹת שֶׁהָרַגְתָּ; וּמַה שֶּׁאַתָּה דוֹאֵג עַל קִבּוּל שְׂכָרְךָ, שְׂכָרְךָ הַרְבֵּה מְאֹד (בראשית רבה):", "rashi_en": "אחר הדברים האלה — Wherever the term אחר is used it signifies immediately after the preceding event; whilst אחרי signifies a long time afterwards. אחר הדברים האלה AFTER THESE THINGS means: after this miracle has been wrought for him in that he slew the kings and he was in great anxiety, saying, “Perhaps I have already received, in this God-given victory reward for all my good deeds” — therefore the Omnipresent said to him, אל תירא אברם אנכי מגן לך FEAR NOT ABRAM, I AM THY SHIELD against punishment: for you shall not be punished on account of all these people whom you have slain. And as for your being anxious regarding the receipt of any further reward, know that שכרך הרבה מאד THY REWARD WILL BE EXCEEDING GREAT (Genesis Rabbah 44:5). "}, {"ch": 15, "v": 2, "aliyah": 5, "heb": "וַיֹּ֣אמֶר אַבְרָ֗ם אֲדֹנָ֤י יֱהֹוִה֙ מַה־תִּתֶּן־לִ֔י וְאָנֹכִ֖י הוֹלֵ֣ךְ עֲרִירִ֑י וּבֶן־מֶ֣שֶׁק בֵּיתִ֔י ה֖וּא דַּמֶּ֥שֶׂק אֱלִיעֶֽזֶר׃", "onk": "וַאֲמַר אַבְרָם יְיָ אֱלֹּהִים מַה תִּתֶּן לִי וַאֲנָא אָזֵיל בְּלָא וְלָד <b>וּבַר פַּרְנָסָא הָדֵין דִּבְבֵיתִי<\/b> הוּא דַּמַּשְׂקָאָה אֱלִיעֶזֶר:", "onk_en": "Avram said: My Master, God, what will You give me since I continue to be childless, and the manager of my household [<i>this supplier who is in my house<\/i>] is Eliezer of Damascus.", "pj": "וַאֲמַר אַבְרָם יְיָ אֱלהִים סַגְיָן בִּרְכוֹתָא יְהַבְתְּ לִי וְסַגִין אִית קֳדָמָךְ לְמִתַּן לִי בְּרַם מַה הַנְיָיא אִית לִי דַאֲנָא עָבִיר מִן עַלְמָא בְּלָא בְנִין וֶאֱלִיעֶזֶר בַּר פַּרְנָסַת בֵּיתִי דְעַל יְדוֹי אִתְעֲבִידוּ לִי נִיסִין בְּדַרְמָשֶק מִסְכֵּי לְמֵירַת יָתִי", "pj_en": "And Abram said, Lord God, great blessings hast Thou given me, and great (are they which it is) before Thee to give me: nevertheless, what profit is to me, when I pass from the world without children, and Eliezer the manager (bar pharnasath, the son of sustenance) of my house, by whose hands signs were wrought for (or to) me in Darmasek, expects to be my heir?", "tj": "וַאֲמַר אַבְרָם בְּבָעוּ קֳדָמָךְ רַחֲמִין יְיָ אֱלהִים סַגְיָן בִּירְכַן יְהַבְתְּ לִי וְסַגְיָן אִית קֳדָמָךְ לְמִתַּן בְּרַם מַה הַנְיָיא אִית לִי דַאֲנָא אָזִיל מִגוֹ עַלְמָא בְּלָא בְּנִין וֶאֱלִיעֶזֶר בַּר בֵּיתִי דְעַל יְדוֹי אִתְעֲבִיד לִי נִיסִין בְּדַמֶשֶק וְהוּא סְבַר בִּגְרָמֵיהּ לְמֵירַת יָתִי:", "tj_en": "And Abram said, Before Thee I supplicate mercy, O Lord God. Manifold blessings Thou hast given me, and many hast Thou before Thee still to give: nevertheless, what profit have I who go from the world childless, and Eliezer, the son of my house, by whose hands signs were wrought for me in Damasek, expecteth in himself to be my heir?", "rashi": "<b>הולך ערירי.<\/b> מְנַחֵם בֶּן סָרוּק פֵּרְשׁוֹ לְשׁוֹן יוֹרֵשׁ, וְחָבֵר לוֹ עֵר וְעֹנֶה (מלאכי ב'), עֲרִירִי, בְלֹא יוֹרֵשׁ, כַּאֲשֶׁר תֹּאמַר וּבְכָל תְּבוּאָתִי תְשָׁרֵשׁ (איוב ל\"א), תְּעַקֵּר שָׁרָשֶׁיהָ, כָּךְ לְשׁוֹן עֲרִירִי חֲסַר בָּנִים, ובלע\"ז דישאנפנטיש. וְלִי נִרְאֶה עֵר וְעֹנֶה מִגִּזְרַת וְלִבִּי עֵר (שיר השירים ה'), וַעֲרִירִי לְשׁוֹן חֻרְבָּן, וְכֵן עָרוּ עָרוּ (תה' קל\"ז), וְכֵן עָרוֹת יְסוֹד (חבקוק ג'), וְכֵן עַרְעֵר תִּתְעַרְעָר (ירמ' נ\"א), וְכֵן כִּי אַרְזָה עֵרָה (צפניה ב'):<br><br><b>ובן משק ביתי.<\/b> כְּתַרְגּוּמוֹ, שֶׁכָּל בֵּיתִי נִזּוֹן עַל פִּיו, כְּמוֹ וְעַל פִּיךָ יִשַּׁק (בר' מלכים א), אַפּוֹטְרוֹפּוֹס שֶׁלִּי, וְאִלּוּ הָיָה לִי בֵן, הָיָה בְנִי מְמֻנֶּה עַל שֶׁלִּי:<br><br><b>דמשק.<\/b> לְפִי הַתַּרְגּוּם מִדַּמֶּשֶׂק הָיָה, וּלְפִי מִ\"אַ שֶׁרָדַף הַמְּלָכִים עַד דַּמֶּשֶׂק. וּבַתַּלְמוּד דָרְשׁוּ נוֹטָרִיקוֹן דּוֹלֶה וּמַשְׁקֶה מִתּוֹרַת רַבּוֹ לַאֲחֵרִים:", "rashi_en": "הולך ערירי I GO CHILDLESS — Menachem ben Seruk explained it (ערירי) as meaning heir, and another example of it is (Malachi 2:12) ער ועונה “son and grandsonערירי — (״ then would mean “without child or heir” being an example of a word that has two opposite meanings, just as you say (Job 31:12) “and it would תשרש all my increase” — meaning it would tear up its roots, and the same word might also mean to take root. So, too, the meaning of ערירי is “without a child” although ער means “a child”. old French désenfanté; English childless. It, however, seems to me that the word ער in ער ועונה is of the same derivation as the same word in (Song 5:2). ולבי ער “and my heart awaketh”, whereas ערירי has the meaning of destroyed (a childless person being “demolished” so far as his memory in future generations is concerned; cf. Rashi on Genesis 16:2). Similarly (Psalms 137:7) ערו ערו “Rase it, rase it”; (Habakkuk 3:13) ערות יסוד “destroying the foundation”, and (Jeremiah 51:58) ערער תתערער “shall be utterly destroyed” and (Zephaniah 2:14) כי ארזה ערה “for the cedar-work thereof shall be destroyed”.<br><br>ובן משק ביתי AND THE STEWARD OF MY HOUSE — Explain it as the Targum has it, “the man of my household”, meaning the man by whose orders all my household is fed. Similarly, (Genesis 41:40) “And according to thy word shall all my people be fed (ישק)” — so that it signifies my administrator.<br><br>If, however, I had a son, my son would be in charge of my affairs. דמשק OF DAMASCUS — According to the Targum he was of Damascus, but according to the Midrashic explanation (Genesis Rabbah 44:9) he bore this designation because he had pursued the kings as far as Damascus. In the Talmud (Yoma 28b) they explained it as an abbreviation of דולה ומשקה “One who drew up and gave to drink to others of the edifying waters of instruction given by his Teacher. "}, {"ch": 15, "v": 3, "aliyah": 5, "heb": "וַיֹּ֣אמֶר אַבְרָ֔ם הֵ֣ן לִ֔י לֹ֥א נָתַ֖תָּה זָ֑רַע וְהִנֵּ֥ה בֶן־בֵּיתִ֖י יוֹרֵ֥שׁ אֹתִֽי׃", "onk": "וַאֲמַר אַבְרָם הָא לִי לָא יְהַבְתְּ וְלָד וְהָא בַר בֵּיתִי יָרִית יָתִי:", "onk_en": "And Avram said: Behold, You have not given me children, and thus one of my household will be my heir.", "pj": "וַאֲמַר אַבְרָם הָא לִי לָא יְהַבְתְּ בַּר וְהָא בַּר פַּרְנָסַת בֵּיתִי יָרִית יָתִי", "pj_en": "And Abram said, Behold, to me Thou hast not given a son; and, behold, the manager of my house will be my heir.", "tj": "", "tj_en": "", "rashi": "<b>הן לי לא נתת זרע.<\/b> וּמַה תּוֹעֶלֶת בְּכָל אֲשֶׁר תִּתֵּן לִי?", "rashi_en": "הן לי לא נתתה זרע BEHOLD, TO ME THOU HAST GIVEN NO CHILD —What use, then, is all else that thou givest me? "}, {"ch": 15, "v": 4, "aliyah": 5, "heb": "וְהִנֵּ֨ה דְבַר־יְהֹוָ֤ה אֵלָיו֙ לֵאמֹ֔ר לֹ֥א יִֽירָשְׁךָ֖ זֶ֑ה כִּי־אִם֙ אֲשֶׁ֣ר יֵצֵ֣א מִמֵּעֶ֔יךָ ה֖וּא יִֽירָשֶֽׁךָ׃", "onk": "וְהָא פִּתְגָּמָא דַּיְיָ עִמֵּיהּ לְמֵימַר לָא יִרְתִנָּךְ דֵּין אֱלָהֵין <b>בַּר דְּתוֹלִיד<\/b> הוּא יִרְתִנָּךְ:", "onk_en": "Suddenly the word of Adonoy came to him, saying: That one will not be your heir; only he that will come from within your body [<i>a son that you will beget<\/i>] will be your heir.", "pj": "וְהָא פִּתְגָמָא מִן קֳדָם יְיָ לֵיהּ לְמֵימַר לָא יַרְתִינָךְ דֵין אֱלָהֵין בַּר דְתוֹלִיד הוּא יַרְתִינָךְ", "pj_en": "And, behold, a word from before the Lord was to him, saying, He shall not be thine heir; but a son whom thou wilt beget shall be thy heir.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 5, "aliyah": 5, "heb": "וַיּוֹצֵ֨א אֹת֜וֹ הַח֗וּצָה וַיֹּ֙אמֶר֙ הַבֶּט־נָ֣א הַשָּׁמַ֗יְמָה וּסְפֹר֙ הַכּ֣וֹכָבִ֔ים אִם־תּוּכַ֖ל לִסְפֹּ֣ר אֹתָ֑ם וַיֹּ֣אמֶר ל֔וֹ כֹּ֥ה יִהְיֶ֖ה זַרְעֶֽךָ׃", "onk": "וְאַפֵּיק יָתֵיהּ לְבָרָא וַאֲמַר אִסְתְּכִי כְּעַן לִשְׁמַיָּא וּמְנֵי כּוֹכְבַיָּא אִם תִּכּוֹל לְמִמְנֵי יָתְהוֹן וַאֲמַר לֵיהּ כְּדֵין יְהוֹן בְּנָךְ:", "onk_en": "He [then] took him outside and said: Look towards the heavens and count the stars if you are able to count them. He then said to him: So [numerous] will your descendants be.", "pj": "וְאַפֵּיק יָתֵיהּ לְבָרָא וַאֲמַר אִסְתַּכֵּל כְּדוֹן לִשְׁמַיָא וּמְנֵי כּוֹכְבַיָא אִין תֵּיכוֹל לְמִמְנֵי יַתְהוֹן וְאָמַר לֵיהּ כְּדֵין יְהוֹן בְּנָךְ", "pj_en": "And He brought him forth without, and said, Look up now to the heavens, and number the stars, if thou art able to number them: and he said, So will be thy sons.", "tj": "", "tj_en": "", "rashi": "<b>ויוצא אתו החוצה.<\/b> לְפִי פְּשׁוּטוֹ הוֹצִיאוֹ מֵאָהֳלוֹ לַחוּץ לִרְאוֹת הַכּוֹכָבִים, וּלְפִי מִדְרָשׁוֹ אָמַר לוֹ צֵא מֵאִצְטַגְנִינוּת שֶׁלְּךָ שֶׁרָאִיתָ בַּמַּזָּלוֹת שֶׁאֵינְךָ עָתִיד לְהַעֲמִיד בֵּן, אַבְרָם אֵין לוֹ בֵן, אֲבָל אַבְרָהָם יֵשׁ לוֹ בֵן, שָׂרַי לֹא תֵלֵד, אֲבָל שָׂרָה תֵלֵד; אֲנִי קוֹרֵא לָכֶם שֵׁם אַחֵר וְיִשְׁתַּנֶּה הַמַּזָּל. דָּ\"אַ הוֹצִיאוֹ מֵחֲלָלוֹ שֶׁל עוֹלָם וְהִגְבִּיהוֹ לְמַעְלָה מִן הַכּוֹכָבִים, וְזֶהוּ לְשׁוֹן הַבָּטָה מִלְמַעְלָה לְמַטָּה:", "rashi_en": "ויוצא אתו החוצה AND HE BROUGHT HIM FORTH OUTSIDE — Its real meaning is: He brought him outside his tent so that he could look at the stars. Its Midrashic explanation is: Go forth from (give up) your astrological speculations — that you have seen by the planets that you will not raise a son; Abram indeed may have no son but Abraham will have a son: Sarai may not bear a child but Sarah will bear. I will give you other names, and your destiny (מזל planet, luck) will be changed. Another explanation: He brought him forth from the terrestrial sphere, elevating him above the stars, and this is why He uses the term הבט ‘‘look”, when He said “look at the heavens” — for this word signifies looking from above downward (Genesis Rabbah 44:12). "}, {"ch": 15, "v": 6, "aliyah": 5, "heb": "וְהֶאֱמִ֖ן בַּֽיהֹוָ֑ה וַיַּחְשְׁבֶ֥הָ לּ֖וֹ צְדָקָֽה׃", "onk": "וְהֵימִין <b>בְּמֵימְרָא<\/b> דַיְיָ וְחָשְׁבַהּ לֵיהּ לְזָכוּ:", "onk_en": "He believed in [<i>the Word of<\/i>] Adonoy, and this He accounted to him for righteousness.", "pj": "וַהֲוַת לֵיהּ הֵימְנוּתָא בְּמֵימְרָא דַיְיָ וְחַשְׁבָהּ לֵיהּ לִזְכוּ דְלָא אַטַח לְקַמֵיהּ בְּמִילִין", "pj_en": "And he believed in the Lord, and had faith in the (Memra) Word of the Lord, and He reckoned it to him for righteousness (lizeku), because he parleyed not before him with words.", "tj": "", "tj_en": "", "rashi": "<b>והאמין בה'.<\/b> לֹא שָׁאַל לוֹ אוֹת עַל זֹאת; אֲבָל עַל יְרֻשַּׁת הָאָרֶץ שָׁאַל לוֹ אוֹת וְאָמַר לוֹ בַּמָּה אֵדַע.<br><br><b>ויחשבה לו צדקה.<\/b> הַקָּבָּ\"ה חֲשָׁבָהּ לאַבְרָם לִזְכוּת וְלִצְדָקָה עַל הַאֲמָנָה שֶׁהֶאֱמִין בּוֹ. דָּבָר אַחֵר בַּמָּה אֵדַע, לֹא שָׁאַל לוֹ אוֹת אֶלָּא אָמַר לְפָנָיו, הוֹדִיעֵנִי בְּאֵיזֶה זְכוּת יִתְקַיְּמוּ בָּהּ, אָמַר לוֹ הַקָּבָּ\"ה, בִּזְכוּת הַקָּרְבָּנוֹת:", "rashi_en": "'והאמין בה AND HE BELIEVED IN THE LORD — He did not ask Him for a sign regarding this; but in respect to the promise that he would possess the land he asked for a sign, inquiring of God, במה אדע “By what sign shall I know [that I shall possess it?]” (Genesis 15:8).<br><br>ויחשבה לו צדקה AND HE ACCOUNTED IT UNTO HIM FOR RIGHTEOUSNESS — The Holy One, blessed be He, accounted it unto Abraham as a merit, because of the faith with which he had trusted in Him. Another explanation of במה אדע is: he did not, by these words, ask for a sign regarding this promise that he would possess the land, but he said to Him, “Tell me by what merit they (my descendants) will remain in it (the land).” God answered him, through the merit of the sacrifices (Taanit 27b). "}, {"ch": 15, "v": 7, "aliyah": 6, "heb": "וַיֹּ֖אמֶר אֵלָ֑יו אֲנִ֣י יְהֹוָ֗ה אֲשֶׁ֤ר הוֹצֵאתִ֙יךָ֙ מֵא֣וּר כַּשְׂדִּ֔ים לָ֧תֶת לְךָ֛ אֶת־הָאָ֥רֶץ הַזֹּ֖את לְרִשְׁתָּֽהּ׃", "onk": "וַאֲמַר לֵיהּ אֲנָא יְיָ דִּאַפֵּקְתָּךְ מֵאוּרָא דְכַשְׂדָּאֵי לְמִּתַּן לָךְ יָת אַרְעָא הָדָא לְמֵירְתַהּ:", "onk_en": "He said to him: I am Adonoy who brought you out of Ur Kasdim, to give to you this land as an inheritance.", "pj": "וַאֲמַר לֵיהּ אֲנָא יְיָ דְאַפֵיקְתָּךְ מֵאַתּוּן נוּרָא דְכַשְדָאֵי לְמִתַּן לָךְ יַת אַרְעָא הֲדָא לְמֵירְתָהּ", "pj_en": "And He said to him, I am the Lord who brought thee out of the fiery furnace of the Kasdai, to give thee this land to inherit.", "tj": "וַאֲמַר לֵיהּ אֲנָא יְיָ דְאַפְקִית יָתָךְ מֵאַתּוּן נוּרֵהוֹן מֵאוּר דְכַשְדָאֵי:", "tj_en": "And He said to him, I am the Lord who brought thee out of the fiery furance from Ur of the Kasdai.", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 8, "aliyah": 6, "heb": "וַיֹּאמַ֑ר אֲדֹנָ֣י יֱהֹוִ֔ה בַּמָּ֥ה אֵדַ֖ע כִּ֥י אִֽירָשֶֽׁנָּה׃", "onk": "וַאֲמָר יְיָ אֱלֹּהִים בְּמָה אִדַּע אֲרֵי אֵרְתִינַהּ:", "onk_en": "And he said: My Master, God, how will I know that I will inherit it?", "pj": "וַאֲמַר יְיָ אֱלֹהִים בְּמָה אִינְדַע אֲרוּם אִירְתִינֵהּ", "pj_en": "And he said, Lord God, by what may I know that I shall be the heir of it?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 9, "aliyah": 6, "heb": "וַיֹּ֣אמֶר אֵלָ֗יו קְחָ֥ה לִי֙ עֶגְלָ֣ה מְשֻׁלֶּ֔שֶׁת וְעֵ֥ז מְשֻׁלֶּ֖שֶׁת וְאַ֣יִל מְשֻׁלָּ֑שׁ וְתֹ֖ר וְגוֹזָֽל׃", "onk": "וַאֲמַר לֵיהּ <b>קָרֵב קֳדָמַי<\/b> עֶגְלִין תְּלָתָא וְעִזִּין תְּלָתָא וְדִכְרִין תְּלָת וְשַׁפְנִינָא וּבַר יוֹנָא:", "onk_en": "He said to him: Bring Me [<i>Sacrifice before Me<\/i>] three heifers, three goats and three rams, a dove, and a young pigeon.", "pj": "וַאֲמַר לֵיהּ סַב לִי תִּקְרוּבְתִּין וּקְרֵיב קֳדָמָי עֶגְלָא בְּרַת תְּלַת שְׁנִין וּבְרַחָא בַּר תְּלַת שְׁנִין וְעִיזָא בְּרַת תְּלַת שְׁנִין וְשַׁפְנִינָא וְתַּסִילָא בַּר יוֹן", "pj_en": "And He said, Bring Me oblations, and offer before Me an heifer of three years, and a goat of three years, a ram of three years, and a dove, and the young of a pigeon.", "tj": "וְשׁוֹפָנִין וּבַר יוֹן:", "tj_en": "And a turtle and young pigeon.", "rashi": "<b>עגלה משלשת.<\/b> שְׁלשָׁה עֲגָלִים; רֶמֶז לִשְׁלֹשָׁה פָרִים, פַּר יוֹם הַכִּפּוּרִים וּפַר הֶעְלֵם דָּבָר שֶׁל צִבּוּר וְעֶגְלָה עֲרוּפָה:<br><br><b>ועז משלשת.<\/b> רֶמֶז לְשָׂעִיר הַנַּעֲשֶׂה בִּפְנִים וּשְׂעִירֵי מוּסָפִין שֶׁל מוֹעֵד וּשְׂעִיר חַטַּאת יָחִיד:<br><br><b>ואיל משלש.<\/b> אֲשַׁם וַדַּאי וְאָשָׁם תָּלוּי וְכִבְשָׂה שֶׁל חַטַּאת יָחִיד:<br><br><b>ותור וגוזל.<\/b> תּוֹר וּבֶן יוֹנָה (בראשית רבה):", "rashi_en": "עגלה משלשת means THREE HEIFERS: symbolical of three sacrifices of bullocks, viz., the bullock offered on the Day of Atonement, the bullock offered when the correct interpretation of a precept was unknown (העלם) to leaders of the nation (see Leviticus 4:13), and the heifer whose neck had to be broken (see Deuteronomy 21:4) (Genesis Rabbah 44:14).<br><br>ועז משולשת THREE GOATS — symbolical of the goat the blood of which was sprinkled in the Holy of Holies, of the goats of the additional sacrifices on Festivals, and of the goat brought as a sin-offering by an individual (Genesis Rabbah 44:14). <br><br>ואיל משולש AND THREE RAMS—symbolical of the trespass offering brought by a man who knows for certain that he has committed certain offences, the offering brought by a man who is in doubt whether he has committed such offence, and the ewe brought by an individual as a sin-offering.<br><br>ותור וגוזל means A TURTLE DOVE AND A YOUNG PIGEON (Genesis Rabbah 44:14)."}, {"ch": 15, "v": 10, "aliyah": 6, "heb": "וַיִּֽקַּֽח־ל֣וֹ אֶת־כׇּל־אֵ֗לֶּה וַיְבַתֵּ֤ר אֹתָם֙ בַּתָּ֔וֶךְ וַיִּתֵּ֥ן אִישׁ־בִּתְר֖וֹ לִקְרַ֣את רֵעֵ֑הוּ וְאֶת־הַצִּפֹּ֖ר לֹ֥א בָתָֽר׃", "onk": "<b>וְקָרֵב קֳדָמוֹהִי<\/b> יָת כָּל אִלֵּין <b>וּפַלִּיג יָתְהוֹן בְּשָׁוֶה<\/b> וִיהַב פַּלְגַיָּא פִּלּוּג לָקֳבֵל חַבְרֵיהּ וְיָת עוֹפָא לָא פַלִּיג:", "onk_en": "He brought [<i>sacrificed<\/i>] all these to [<i>before<\/i>] Him; he split them in the middle [<i>into two equal parts<\/i>], and placed each piece opposite the other. The bird, however, he did not split.", "pj": "וְקָרִיב קוֹמוֹי יַת כָּל אִילֵן וּפְסַג יַתְהוֹן בִּמְצִיעָא וְסָדַר פַּסְגָא דְחַד כָּל קְבֵיל חַבְרֵיהּ וְיַת עוֹפָא לָא פָּסָג", "pj_en": "And he brought all these before Him, and divided them in the midst, and set in order every division over against its fellow; but the fowl he divided not.", "tj": "וּקְרֵיב קֳדָמוֹי יַת כָּל אִילֵין וּפְסַג יַתְהוֹן לְפַסְגִין וְשַׁוִי גְבַר פַּסְגֵיהּ לְקָדָמוֹת חַבְרֵיהּ וְיַת עוֹפָא לָא פָסַג:", "tj_en": "And He brought before him all these, and divided them into divisions, and set one part over against its fellow; but the fowl He divided not.", "rashi": "<b>ויבתר אתם.<\/b> חָלַק כָּל אֶחָד לִשְׁנֵי חֲלָקִים; וְאֵין הַמִּקְרָא יוֹצֵא מִידֵי פְשׁוּטוֹ, לְפִי שֶׁהָיָה כוֹרֵת בְּרִית עִמּוֹ לִשְׁמֹר הַבְטָחָתוֹ לְהוֹרִיש לְבָנָיו אֶת הָאָרֶץ כְּדִכְתִיב בַּיּוֹם הַהוּא כָּרַת ה' אֶת אַבְרָם בְּרִית לֵאמֹר וְגוֹמֵר, וְדֶרֶך כּוֹרְתֵי בְרִית לְחַלֵּק בְּהֵמָה וְלַעֲבֹר בֵּין בְּתָרֶיהָ, כְּמַה שֶּׁנֶּאֱמַר לְהַלָּן הָעֹבְרִים בֵּין בִּתְרֵי הָעֵגֶל (ירמיה ל\"ד), אַף כָּאן תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הוּא שְׁלוּחוֹ שֶׁל שְׁכִינָה, שֶׁהוּא אֵשׁ.<br><br><b>ואת הצפור לא בתר.<\/b> לְפִי שֶׁהָאֻמּוֹת נִמְשְׁלוּ לְפָרִים וְאֵילִים וּשְֹעִירִים, שֶׁנֶּאֱמַר סְבָבוּנִי פָּרִים רַבִּים וְגוֹ' (תהל' כ\"ב), וְאוֹמֵר הָאַיִל אֲשֶׁר רָאִיתָ בַּעַל הַקְּרָנָיִם מַלְכֵי מָדַי וּפָרָס (דניאל ח'), וְאוֹמֵר וְהַצָּפִיר הַשָּׂעִיר מֶלֶךְ יָוָן (שם), וְיִשְֹרָאֵל נִמְשְׁלוּ לִבְנֵי יוֹנָה, שֶׁנֶּאֱמַר יוֹנָתִי בְּחַגְוֵי הַסֶּלַע (שיר השירים ב'), לְפִיכָךְ בִּתֵּר הַבְּהֵמוֹת, רֶמֶז שֶׁיִּהְיוּ הָאֻמּוֹת כָּלִים וְהוֹלְכִים, <b>ואת הצפור לא בתר<\/b>, רֶמֶז שֶׁיִּהְיוּ יִשְֹרָאֵל קַיָּמִין לְעוֹלָם:", "rashi_en": "ויבתר אתם AND HE SPLIT THEM — He divided each into two portions. This verse does not lose its literal meaning although there are various Midrashic explanations of it. Since He was making a covenant with him to keep His promise to give the land as an inheritance to his children — as it is written (Genesis 15:18), “In that day the Lord made a covenant with Abram, saying …” — and as it was the custom for parties to a covenant to divide an animal and to pass between its parts, as it is said elsewhere (Jeremiah 34:19) “who passed between the parts of the calf”, so also here the smoking furnace and the flaming torch which passed between the pieces (Genesis 15:17) were representative of the Divine Shechinah which is spoken of as fire.<br><br>ואת הצפור לא בתר BUT THE BIRDS SPLIT HE NOT — Because other nations are compared to bulls, rams and goats, as it is said (Psalms 22:13) “Many bulls have encompassed me”, and it says, (Daniel 8:20) “The ram which thou sawest having two horns, they are the kings of Media and Persia” and it further says, (Daniel 8:21) “And the rough he-goat is the king of Greece” — and Israel is compared to young doves, as it is written, (Song 2:14) ‘‘O my dove that art in the clefts of the rock” — he therefore divided the animals indicating that other nations will gradually perish, ואת הצפור לא בתר but “the birds split he not”, suggesting thereby that Israel will live forever (Pirkei D'Rabbi Eliezer 28). "}, {"ch": 15, "v": 11, "aliyah": 6, "heb": "וַיֵּ֥רֶד הָעַ֖יִט עַל־הַפְּגָרִ֑ים וַיַּשֵּׁ֥ב אֹתָ֖ם אַבְרָֽם׃", "onk": "וּנְחַת עוֹפָא עַל פַּגְלַיָּא וְאַפְרַח יָתְהוֹן אַבְרָם:", "onk_en": "Birds of prey [vultures] descended upon the carcasses, but Avram drove them away.", "pj": "וּנְחָתוּ אוּמַיָא ע\"א הִינוּן מְדַמְיָין לְעוֹפָא מְסָאֲבָא לְמִיבְזַז נִכְסֵיהוֹן דְיִשְרָאֵל וַהֲוַת זְכוּתֵיהּ דְאַבְרָם מְגַנָא עֲלֵיהוֹן", "pj_en": "And there came down idolatrous peoples which are like to unclean birds, to steal away the sacrifices of Israel; but the righteousness of Abram was a shield over them.", "tj": "וְכַד נְחַת טְיָיסָא לָא הֲוָה קְרַב לְפַּסְגַיָא וְהָדֵין טְיָיסָא הוּא עוֹפָא מְסַאֲבָא וְהָדֵין עוֹפָא מְסַאֲבָא אִילֵין אִינוּן מַלְכְּוָותָא דְאַרְעָא ע\"א וִיהֵי כַד יֶהֱוָיָן עַיְצִין עֵיצִן בִּישִׁין עַל בְּנֵי יִשְׁרָאֵל זְכוּתֵיהּ דְאַבְרָהָם צַדִיקַיָא מְבַטְלָא יַתְהוֹן:", "tj_en": "And when the birds descended, they came not nigh the divisions: those birds are unclean fowl, and those unclean fowl are the kingdoms of the earth which are worshippers of idols, and which counsel evil counsels against the sons of Israel; but the integrity of the righteous Abram hindered them.", "rashi": "<b>העיט.<\/b> הוּא עוֹף, עַל שֵׁם שֶׁהוּא עָט וְשׁוֹאֵף אֶל הַנְּבֵלוֹת לָטוּשׂ עֲלֵי אֹכֶל, כְּמוֹ וַתַּעַט אֶל הַשָּׁלָל (שמואל א ט\"ו):<br><br><b>על הפגרים.<\/b> עַל הַבְּתָרִים. הַפְּגָרִים מְתַרְגְּמִינָן פַּגְלַיָּא, אֶלָּא מִתּוֹךְ שֶׁהֻרְגְּלוּ לְתַרְגֵּם \"איש בִּתְרוֹ\" וִיהַב פַּלְגַּיָּא, נִתְחַלֵּף לָהֶם תֵּבַת פַּגְלַיָּא לְפַלְגַּיָּא, וְתִרְגְּמוּ הַפְּגָרִים פַּלְגַּיָּא; וְכָל הַמְתַרְגֵּם כֵּן טוֹעֶה, לְפִי שֶׁאֵין לְהַקִּיש בְּתָרִים לִפְגָרִים, שֶׁבְּתָרִים תַּרְגּוּמוֹ פַּלְגַּיָּא, וּפְגָרִים תַּרְגּוּמוֹ פַּגְלַיָּא, לְשׁוֹן פִּגּוּל, כְּמוֹ פִּגּוּל הוּא (ויקרא ז') לְ' פֶּגֶר:<br><br><b>וישב.<\/b> לְשׁוֹן נְשִׁיבָה וְהַפְרָחָה, כְּמוֹ יַשֵּׁב רוּחוֹ (תה' קמ\"ז), רֶמֶז שֶׁיָּבֹא דָוִד בֶּן יִשַּׁי לְכַלּוֹתָם, וְאֵין מַנִּיחִין אוֹתוֹ מִן הַשָּׁמַיִם עַד שֶׁיָּבֹא מֶלֶךְ הַמָּשִׁיחַ:", "rashi_en": "העיט THE BIRD OF PREY— It is a bird so called because it swoops down (עט) greedily upon dead bodies, darting quickly upon its food. Similarly we have the verbal form (1 Samuel 15:19) “And thou didst pounce down (ותעט) upon the spoil”.<br><br>על הפגרים UPON THE CARCASSES i.e. the pieces of the carcasses. — The word הפגרים we should translate in the Targum by פגל) פגליא being the same as פגר); since, however, people were familiar with the Targum’s translation of the words איש בתרו (in Genesis 5:10) ‘‘each piece” by פלגיא (the halves), the word פגליא here was mistakenly changed by them into פלגיא and so they gave the Targum of פגרים (carcasses) by פלגיא (halves). But whoever renders it thus in the Targum is wrong for there is no comparison (similarity in meaning) between בתרים and פגרים; for the Targum of בתרים is פלגיא (“parts”, from פלג “to divide”,) whilst the Targum of פגרים is פגליא, which has the sense of פגול, something; abhorrent, as (Leviticus 7:18) פגול הוא “it shall be an abhorred thing”, similar in sense to פגר a carcass.<br><br>וישב [AND ABRAM] SCARED THEM AWAY — The word means “blowing upon a thing and making a thing fly away”, similar to (Psalms 147:18) יַשֵּׁב רוחו “He causeth His wind to blow”. It is a symbol that David, the son of Jesse, will wish to destroy them (the nations), but that he will not be permitted by God to do so until king Messiah comes (Pirkei D'Rabbi Eliezer 28). "}, {"ch": 15, "v": 12, "aliyah": 6, "heb": "וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ לָב֔וֹא וְתַרְדֵּמָ֖ה נָפְלָ֣ה עַל־אַבְרָ֑ם וְהִנֵּ֥ה אֵימָ֛ה חֲשֵׁכָ֥ה גְדֹלָ֖ה נֹפֶ֥לֶת עָלָֽיו׃", "onk": "וַהֲוָה שִׁמְשָׁא לְמֵיעַל וְשִׁנְתָא נְפָלַת עַל אַבְרָם וְהָא אֵימָה קְבַל סַגִּי נְפָלַת עֲלוֹהִי:", "onk_en": "As the sun was setting, a deep sleep fell upon Avram; and behold, a dread of deep darkness fell upon him.", "pj": "וַהֲוָה שִׁמְשָׁא קָרִיבָא לְמִיטְמוֹעַ וְשִׁינְתָא עֲמִיקְתָא מִתְרַמְיַית עַל אַבְרָם וְהָא אַרְבַּע מַלְכְּוָון קַיְימִין לְמִשַׁעֲבְּדָא יַת בְּנוֹי אֵימְתָא דָא הוּא בָּבֶל קַבָּלָא דָא הוּא מָדַי סַגִיאָה דָא הוּא יָוָן נָפְלָה דָא הוּא פָרָס דַעֲתִידָא לְמֵיפַּל וְלֵית לֵיהּ זְקִיפָא וּמִתַּמָן עֲתִידִין לְמֵיסַק עַמָא בֵּית יִשְרָאֵל", "pj_en": "And when the sun was nearing to set, a deep sleep was thrown upon Abram: and, behold, four kingdoms arose to enslave his children: Terror, which is Bavel; Darkness, which is Madai; Greatness, which is Javan; Decline, which is Pheras, which is to fall, and to have no uplifting, and from whence it is to be that the children of Israel will come up.", "tj": "וַהֲוָת שִׁמְשָׁא אָזְלָא לְמִטְמָעָא וְשֵׁנָא עֲמִיקָא בְּסִימָא נָפְלַת עַל אַבְרָם וְהָא אַבְרָם חָזֵי אַרְבַּעְתֵּי מַלְכְּוָותָא דְעַתִידִין לְמֵיקָם לְמִשַׁעְבְּדָא בִּבְנוֹי אֵימָה חֲשֵׁכָה גְדוֹלָה נוֹפֶלֶת עָלָיו אֵימָה דְהָא הוּא בָּבֶל חֲשֵׁיכָה דְהָא הוּא מָדַי גְדוֹלָה דְהָא הוּא יָוָן נוֹפֶלֶת דְהָא הוּא מַלְכְּוָותָא דְפַּרְסַיָא דַעֲתִידָא לְמַפָּלָא וְלָא תֶהֱוֵי לָהּ תְּקוּמָה לְעַלְמֵי עַלְמִין:", "tj_en": "And when the sun was going to set, a sleep profound and sweet fell upon Abram. And, behold, Abram saw four kingdoms which should arise to bring his sons into subjection (and) Terror; the Greatness of Darkness Fell upon him: Terror, that is Bavel; Darkness, that is Media; Greatness, that is Greece; Fell, that is Edom, (Rome) that fourth kingdom which is to Fall, and never to rise again for ever and ever.", "rashi": "<b>והנה אימה וגו'.<\/b> רֶמֶז לְצָרוֹת וְחשֶׁךְ שֶׁל גָּלִיּוֹת:", "rashi_en": "'והנה אימה וגו AND, LO, AN HORROR etc. — This is symbolic of the woes and the gloom of the Jews in Exile (Genesis Rabbah 44:17). "}, {"ch": 15, "v": 13, "aliyah": 6, "heb": "וַיֹּ֣אמֶר לְאַבְרָ֗ם יָדֹ֨עַ תֵּדַ֜ע כִּי־גֵ֣ר&thinsp;<b>׀<\/b> יִהְיֶ֣ה זַרְעֲךָ֗ בְּאֶ֙רֶץ֙ לֹ֣א לָהֶ֔ם וַעֲבָד֖וּם וְעִנּ֣וּ אֹתָ֑ם אַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃", "onk": "וַאֲמַר לְאַבְרָם מִדַּע תִּדַּע אֲרֵי דַיָּרִין יְהוֹן בְּנָךְ בְּאַרְעָא דְלָא דִילְהוֹן וְיִפְלְחוּן בְּהוֹן וִיעַנּוּן יָתְהוֹן אַרְבַּע מְאָה שְׁנִין:", "onk_en": "And He [Adonoy] said to Avram: Know for sure that your descendants will be foreigners in a land that is not theirs. They will enslave them and oppress them [for] four hundred years.", "pj": "וַאֲמַר לְאַבְרָם מִנְדַע תִּנְדַע אֲרוּם דַיְירִין יְהוֹן בְּנָךְ בְּאַרְעָא דְלָא דִלְהוֹן חֲלַף דְלָא הֵימְנַת וִישַׁעֲבְּדוּן בְּהוֹן וִיסַגְפוּן יַתְהוֹן אַרְבַּע מְאָה שְׁנִין", "pj_en": "And he said to Abram, Knowing, thou must know, that thy sons shall dwell in a land not their own, because thou hast not believed, and they will subjugate and afflict them four hundred years;", "tj": "", "tj_en": "", "rashi": "<b>כי גר יהיה זרעך.<\/b> מִשֶּׁנּוֹלַד יִצְחָק עַד שֶׁיָּצְאוּ יִשְֹרָאֵל מִמִּצְרַיִם אַרְבַּע מֵאוֹת שָׁנָה כֵּיצַד? יִצְחָק בֶּן שִׁשִּׁים שָׁנָה כְּשֶׁנּוֹלַד יַעֲקֹב, וְיַעֲקֹב כְּשֶׁיָּרַד לְמִצְרַיִם אָמַר יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה, הֲרֵי ק\"צ, וּבְמִצְרַיִם הָיוּ מָאתַיִם וְעֶשֶׂר כְּמִנְיַן רְד\"וּ, הֲרֵי אַרְבַּע מֵאוֹת שָׁנָה. וְאִם תֹּאמַר בְּמִצְרַיִם הָיוּ אַרְבַּע מֵאוֹת, הֲרֵי קְהָת מִיּוֹרְדֵי מִצְרַיִם הָיָה, צֵא וַחֲשֹׁב שְׁנוֹתָיו שֶׁל קְהָת וְשֶׁל עַמְרָם וּשְׁמוֹנִים שֶׁל משֶׁה שֶׁהָיָה כְּשֶׁיֶָּצְאוּ יִשְֹרָאֵל מִמִּצְרַיִם, אֵין אַתָּה מוֹצֵא אֶלָּא שְׁלֹשׁ מֵאוֹת וַחֲמִשִּׁים, וְאַתָּה צָרִיךְ לְהוֹצִיא מֵהֶן כָּל הַשָּׁנִים שֶׁחַי קְהָת אַחַר לֵדַת עַמְרָם וְשֶׁחַי עַמְרָם אַחַר לֵדַת משֶׁה:<br><br><b>בארץ לא להם.<\/b> לֹא נֶאֱמַר בְּאֶרֶץ מִצְרַיִם, אֶלָּא לֹא לָהֶם – וּמִשֶּׁנּוֹלַד יִצְחָק וַיָּגָר אַבְרָהָם וְגוֹ' (בר' כ\"א), וּבְיִצְחָק גּוּר בָּאָרֶץ הַזֹאת (שם כ\"ו), וְיַעֲקֹב גָּר בְּאֶרֶץ חָם (תה' ק\"ה), לָגוּר בָּאָרֶץ בָּאנוּ (בר' מ\"ז):", "rashi_en": "כי גר יהיה זרעך THAT THY SEED SHALL BE A STRANGER — From the birth of Isaac until Israel left Egypt was a period of 400 years. How so? Isaac was 60 years old when Jacob was born, and Jacob when he went down to Egypt himself stated, (Genesis 47:9) “The days of the years of my sojournings are a hundred and thirty years”, making together 190 years. In Egypt they were 210 years — corresponding to the numerical value of the word רדו (see Rashi in Genesis 42:2) — making altogether 400 years. If, however, you say that they were in Egypt 400 years — well, Kohath was one of those who went down to Egypt with Jacob; go and add up the years of Kohath (130), those of Amram (137), and the 80 years that Moses was old when Israel left Egypt, and you only have about 350, and you really have to deduct all the years that Kohath lived after Amram was born, and those that Amram lived after the birth of Moses (Megillah 9a).<br><br>בארץ לא להם IN A LAND THAT IS NOT THEIRS — It does not say here in the land of Egypt but in a land that is not theirs; for soon after Isaac was born it states, (Genesis 21:34) “And Abraham sojourned (ויגר) [in the land of the Philistines]”; in regard to Isaac it is said, (Genesis 26:3) “Sojourn (גור) in this land (Canaan)”, and of Jacob Scripture states, (Psalms 105:23) “Jacob sojourned (גר) in the land of Ham”, whilst of his sons it is said, (Genesis 47:4) “To sojourn (לגור) in the land (of Egypt) have we come”. "}, {"ch": 15, "v": 14, "aliyah": 6, "heb": "וְגַ֧ם אֶת־הַגּ֛וֹי אֲשֶׁ֥ר יַעֲבֹ֖דוּ דָּ֣ן אָנֹ֑כִי וְאַחֲרֵי־כֵ֥ן יֵצְא֖וּ בִּרְכֻ֥שׁ גָּדֽוֹל׃", "onk": "וְאַף יָת עַמָּא דִּיִפְלְחוּן בְּהוֹן דָּיִין אֲנָא וּבָתַר כֵּן יִפְקוּן בְּקִנְיָנָא סַגִּי:", "onk_en": "But also that nation whom they will serve I will judge; afterwards they will leave with great wealth.", "pj": "וְאוּף יַת עַמָא דְיִפְלְחוּן לְהוֹם דַיָין אֲנָא בְּמָאתָן וְחַמְשִׁין מָחָן וּמִן בָּתַר כֵּן יִפְקוּן לְחֵירוּתָא בְּנִכְסִין סַגִיאִין", "pj_en": "and also that the people whom they shall serve I will judge with two hundred and fifty plagues, and afterwards they shall go forth into liberty with great riches.", "tj": "", "tj_en": "", "rashi": "<b>וגם את הגוי.<\/b> וְגַם לְרַבּוֹת ד' מַלְכֻיּוֹת, שֶׁאַף הֵן כָּלִים עַל שֶׁשִּׁעְבְּדוּ אֶת יִשְׂרָאֵל:<br><br><b>דן אנכי.<\/b> בְּעֶשֶׂר מַכּוֹת:<br><br><b>ברכש גדול.<\/b> בְּמָמוֹן גָּדוֹל, כְּמוֹ שֶׁנֶּאֱמַר וַיְנַצְּלוּ אֶת מִצְרָיִם (שמות י\"ב):", "rashi_en": "וגם את הגוי AND ALSO THAT NATION — The word וגם and also—(that nation also will I judge)—suggests that other nations will be judged as well: it is used here to include the four Monarchies (of the book of Daniel) who also will perish because they enslaved Israel (Genesis Rabbah 44:19).<br><br>דן אנכי I WILL JUDGE with ten plagues (Genesis Rabbah 44:20).<br><br>ברכוש גדול WITH GREAT SUBSTANCE — with great wealth, as it is said, (Exodus 12:36) “And they despoiled the Egyptians.”"}, {"ch": 15, "v": 15, "aliyah": 6, "heb": "וְאַתָּ֛ה תָּב֥וֹא אֶל־אֲבֹתֶ֖יךָ בְּשָׁל֑וֹם תִּקָּבֵ֖ר בְּשֵׂיבָ֥ה טוֹבָֽה׃", "onk": "וְאַתְּ תֵּיעוֹל לְוַת אֲבָהָתָךְ בִּשְׁלָם תִּתְקְבַר בְּסֵיבוּ טָבָא:", "onk_en": "You will join your fathers in peace; you will be buried at a good old age.", "pj": "וְאַתְּ תִּתְכְּנֵשׁ לְוַת אַבְהָתָךְ בִּשְׁלָם תָּנוּחַ נַפְשָׁךְ וְתִתְקְבֵר בְּסֵבוּ טָבָא", "pj_en": "And thou shalt be gathered to thy fathers, thy soul shall rest in peace, and thou shalt be buried in a good old age.", "tj": "", "tj_en": "", "rashi": "<b>ואתה תבוא.<\/b> וְלֹא תִרְאֶה כָּל אֵלֶה:<br><br><b>אל אבותיך.<\/b> אָבִיו עוֹבֵד עֲ\"זָ וְהוּא מְבַשְּׂרוֹ שֶׁיָּבֹא אֵלָיו? לִמֶּדְךָ שֶׁעָשָׂה תֶּרַח תְּשׁוּבָה:<br><br><b>תקבר בשיבה טובה.<\/b> בִּשְּׂרוֹ שֶׁיַּעֲשֶׂה יִשְׁמָעֵאל תְּשׁוּבָה בְּיָמָיו, וְלֹא יֵצֵא עֵשָׂו לְתַרְבּוּת רָעָה בְּיָמָיו; וּלְפִיכָךְ מֵת ה' שָׁנִים קֹדֶם זְמַנּוֹ, וּבוֹ בַיּוֹם מָרַד עֵשָׂו:", "rashi_en": "ואתה תבוא BUT THOU SHALT COME etc. Thou shalt not behold all this.<br><br>אל אבותיך UNTO THY FATHERS — His father was an idolator and yet it (the text) announced to him that he (Abraham) would go to him! But this teaches you that Terah repented of his evil ways (Genesis Rabbah 30:4).<br><br>תקבר בשיבה טובה THOU SHALT BE BURIED IN A GOOD OLD AGE — He announced to him that Ishmael would repent during his (Abraham’s) life-time (Genesis Rabbah 38:12). Esau, too, did, not become degenerate during Abraham’s life-time. It was just for this reason (in order that he might not witness Esau’s evil conduct) that Abraham died five years before his proper time, for the very day when he died Esau rebelled against God (Genesis Rabbah 63:12)."}, {"ch": 15, "v": 16, "aliyah": 6, "heb": "וְד֥וֹר רְבִיעִ֖י יָשׁ֣וּבוּ הֵ֑נָּה כִּ֧י לֹא־שָׁלֵ֛ם עֲוֺ֥ן הָאֱמֹרִ֖י עַד־הֵֽנָּה׃", "onk": "וְדָרָא רְבִיעָאָה יְתוּבוּן הָכָא אֲרֵי לָא שְׁלִים חוֹבָא דֶּאֱמוֹרָאָה עַד <b>כְּעָן<\/b>:", "onk_en": "The fourth generation will return here, for the sin of the Emorites will not be complete until then [<i>now<\/i>].", "pj": "וְדָרָא רְבִיעָאָה דִבְנָךְ יְתוּבוּן הָכָא לְמֵירְתָא אֲרוּם לָא שְׁלִים חוֹבָא דְאֱמוֹרָאֵי (עַד) כְּדוֹן", "pj_en": "And in the fourth generation of thy sons they will return hither to inherit; because the guilt of the Amoraah is not yet complete.", "tj": "", "tj_en": "", "rashi": "<b>ודור רביעי.<\/b> לְאַחַר שֶׁיִּגְלוּ לְמִצְרַיִם יִהְיוּ שָׁם ג' דּוֹרוֹת, וְהָרְבִיעִי יָשׁוּבוּ לָאָרֶץ הַזֹּאת, לְפִי שֶׁבְּאֶרֶץ כְּנַעַן הָיָה מְדַבֵּר עִמּוֹ, וְכָרַת בְּרִית זוֹ, כְּדִכְתִיב: לָתֶת לְךָ אֶת הָאָרֶץ הַזֹּאת לְרִשְׁתָּהּ. וְכֵן הָיָה: יַעֲקֹב יָרַד לְמִצְרַיִם, צֵא וַחֲשֹׁב דּוֹרוֹתָיו: יְהוּדָה, פֶּרֶץ, וְחֶצְרוֹן, וְכָלֵב בֶּן חֶצְרוֹן מִבָּאֵי הָאָרֶץ הָיָה:<br><br><b>כי לא שלם עון האמרי.<\/b> לִהְיוֹת מִשְׁתַּלֵּחַ מֵאַרְצוֹ עַד אוֹתוֹ זְמַן, שֶׁאֵין הַקָּבָּ\"ה נִפְרָע מֵאֻמָּה עַד שֶׁתִּתְמַלֵּא סְאָתָהּ, שֶׁנֶּאֱמַר בְּסַאסְּאָה בְּשַׁלְחָהּ תְּרִיבֶנָּה (יש' כ\"ז):", "rashi_en": "ודור רביעי BUT A FOURTH GENERATION — i.e. after they go into exile in Egypt they will be there three generations, and the fourth will return to this land (הֵנָה hither). For He was then speaking to him in the land of Canaan and it was there that He made this covenant, as it is written (v.7) “to give thee this land to inherit it”. Thus it really was: Jacob went down to Egypt. Go and count up his generations: Judah, Perez, Hezron— and Caleb (whose father Jephuneh is identified with Hezron, see Sotah 11b) was amongst those who entered the land of Canaan.<br><br>כי לא שלם עון האמורי FOR THE INIQUITY OF THE AMORITE IS NOT YET FULL enough that he should be driven out of his land until that time, for the Holy One, blessed be He, does not exact punishment from any nation until its measure is full, as it is said, (Isaiah 27:8) “In her full measure wilt thou contend with her when thou sendest her away” (Sotah 9a). "}, {"ch": 15, "v": 17, "aliyah": 6, "heb": "וַיְהִ֤י הַשֶּׁ֙מֶשׁ֙ בָּ֔אָה וַעֲלָטָ֖ה הָיָ֑ה וְהִנֵּ֨ה תַנּ֤וּר עָשָׁן֙ וְלַפִּ֣יד אֵ֔שׁ אֲשֶׁ֣ר עָבַ֔ר בֵּ֖ין הַגְּזָרִ֥ים הָאֵֽלֶּה׃", "onk": "וַהֲוָה שִׁמְשָׁא עַלַּת וְקַבְלָא הֲוָה וְהָא תַנּוּר דִתְנַן וּבְעוּר דְּאֶשָּׁתָא דִּי עֲדָא בֵּין פַּלְגַיָּא הָאִלֵּין:", "onk_en": "The sun set and it became very dark; and behold, a smoking furnace and a flaming torch had passed between these pieces.", "pj": "וַהֲוָה שִׁמְשָׁא טְמָעָא וְחוּמְטָא הֲוַת וְהָא חָמָא אַבְרָם גֵיהִנָם מַסִיק תְּנָנָא וְגוֹמְרִין דְאֵשָׁא וּמַבְעִיר שְׁבִיבִין דְנוּר לְמֵידַן בֵּיהּ רַשִׁעַיָא וְהָא עָבַר בֵּין פַּסְגַיָא הָאִילֵן", "pj_en": "And when the sun had set there was darkness. And, behold, Abram saw Gehinnam ascending, smoke with flaming coals and burning flakes of fire, werewith the wicked are to be judged. And, behold, He passed between those divisions.", "tj": "וְהָא שִׁמְשָׁא אַזְלָא לְמִטְמְעָא וּקְבָלָא הֲוָה וְהָא אַבְרָם חָזֵי עַד דִי סַפְסְלִין אִיסְתַּדְרוּ וְכוּרְסְוָון רְמִיוּ וְהָא גֵהִנָם דְאִתְעַתְּדָא לְרַשִׁיעַיָא לְעַלְמָא דְאָתֵי כְּתַנוּרָא מַפְקָן שְׁבִיבִין דְנוּר וְשַׁלְהֵבִין דְאֵשָׁא דִבְגַוָהּ נָפְלוּ רְשִׁיעַיָא עַל דְמָרְדוּ בְּאוֹרַיְתָא בְּחַיֵיהוֹן וְצַדִיקַיָא דְנָטְרוּ יָתָהּ מִן עַקְתָא יִשְׁתֵּזְבוּן כָּל כְּדֵין יִתְחֲזֵי לְאַבְרָם כַּד הֲוָה עָבַר בֵּינֵי פַּסְגַיָא הָאִילֵין:", "tj_en": "And, behold, the sun went to set, and there was darkness, and Abram beheld till the seats were arrayed and the thrones set forth. And lo, Gehinam, which was prepared for the wicked in the world to come, enveloped in burning flakes and flames of fire, into which the wicked had fallen when in their lives they rebelled against the law, while the just who had kept it had been delivered from affliction. And all were seen by Abram while He passed between those divisions.", "rashi": "<b>ויהי השמש באה.<\/b> כְּמוֹ וַיְהִי הֵם מְרִיקִים שַׂקֵּיהֶם (בראשית מ\"ב), וַיְהִי הֵם קֹבְרִים אִישׁ (מלכים ב י\"ג), כְּלוֹמַר, וַיְהִי דָּבָר זֶה:<br><br><b>השמש באה.<\/b> שָׁקְעָה:<br><br><b>ועלטה היה.<\/b> חָשַׁךְ הַיּוֹם:<br><br><b>והנה תנור עשן וגו'.<\/b> רָמַז לוֹ שֶׁיִּפְּלוּ הַמַּלְכֻיּוֹת בַּגֵּיהִנֹּם:<br><br><b>באה.<\/b> טַעֲמוֹ לְמַעְלָה, לְכָךְ הוּא מְבֹאָר שֶׁבָּא כְבָר. וְאִם הָיָה טַעֲמוֹ לְמַטָּה, בָּאָלֶ\"ף, הָיָה מְבֹאָר כְּשֶׁהִיא שׁוֹקַעַת; וְאִ\"אֶ לוֹמַר כֵּן, שֶׁהֲרֵי כְבָר כְּתִיב וַיְהִי הַשֶּׁמֶשׁ לָבוֹא, וְהַעֲבָרַת תַּנּוּר עָשָׁן לְאַחַר מִכָּאן הָיְתָה, נִמְצָא שֶׁכְּבָר שָׁקְעָה; וְזֶה חִלּוּק בְּכָל תֵּבָה לְשׁוֹן נְקֵבָה שֶׁיְּסוֹדָהּ שְׁתֵּי אוֹתִיּוֹת, כְּמוֹ בָּא, קָם, שָׁב: כְּשֶׁהַטַּעַם לְמַעְלָה, לְשׁוֹן עָבַר הוּא, כְּגוֹן זֶה, וּכְגוֹן וְרָחֵל בָּאָה, קָמָה אֲלֻמָּתִי, הִנֵּה שָׁבָה יְבִמְתֵּךְ, וּכְשֶׁהַטַּעַם לְמַטָּה הוּא לְשׁוֹן הוֹוֶה, דָּבָר שֶׁנַּעֲשֶׂה עַכְשָׁו וְהוֹלֵךְ, כְּמוֹ בָּאָה עִם הַצֹּאן, בָּעֶרֶב הִיא בָאָה וּבַבֹּקֶר הִיא שָׁבָה:", "rashi_en": "ויהי השמש באה AND IT CAME TO PASS, WHEN THE SUN WENT DOWN —Similar syntactical constructions are (42:35) ויהי הם מריקים שקיהם “And it came to pass when they were emptying their sacks”, and (2 Kings 13:21) ויהי הם קוברים איש “and it came to pass when they were burying a man” — as much as to say, and this thing happened (i. e. after ויהי supply the words דבר זה: “And this thing happened: the sun set etc.”)<br><br>השמש באה THE SUN CAME — i.e. set. <br><br>ועלטה היה THERE WAS THICK DARKNESS — darkness during the day-time<br><br>'והנה תנור עשן וגו BEHOLD A SMOKING FURNACE — He foreshadowed to him that these Monarchies would descend into Gehinom (Pirkei DeRabbi Eliezer 28).<br><br>באה IT (SHE) CAME — The accent is on the first syllable, consequently it must signify that it (the sun) had already set. If, however, the accent were on the last syllable, on the א, it would signify that there was darkness whilst it was setting (i. e. the former is a perfect, the latter a participle). It is impossible to explain it thus here (that it means the sun was setting) because it has already been stated (v. 12) “And it came to pass that when the sun was setting”, and the passing of the smoking furnace took place after this — consequently the sun had set already when it passed. This is the difference in the case of every word (verb), feminine gender, whose root has two letters, as בא ,קם ,שב: when the accent is on the first syllable, it is the perfect tense, as is this word באה here, and like (19:9) “And Rachel (באה) came”; (37:7) “And my sheaf קמה arose”; (Ruth 1:15) “Behold, thy sister-in-law (שבה) has gone back”; but when the accent is on the last syllable it is a present tense (participle), denoting an action being done now and continuing to be done, as for instance, (29:6) “She is coming (באה) with the sheep”; (Ester 2:14) “In the evening she used to come (באה) and in the morning (שבה) she used to return”."}, {"ch": 15, "v": 18, "aliyah": 6, "heb": "בַּיּ֣וֹם הַה֗וּא כָּרַ֧ת יְהֹוָ֛ה אֶת־אַבְרָ֖ם בְּרִ֣ית לֵאמֹ֑ר לְזַרְעֲךָ֗ נָתַ֙תִּי֙ אֶת־הָאָ֣רֶץ הַזֹּ֔את מִנְּהַ֣ר מִצְרַ֔יִם עַד־הַנָּהָ֥ר הַגָּדֹ֖ל נְהַר־פְּרָֽת׃", "onk": "בְּיוֹמָא הַהוּא גְּזַר יְיָ עִם אַבְרָם קְיָם לְמֵימָר לִבְנָךְ יְהָבִית יָת אַרְעָא הָדָא מִן נַהֲרָא דְמִצְרַיִם וְעַד נַהֲרָא רַבָּא נַהֲרָא פְרָת:", "onk_en": "On that day Adonoy made a covenant with Avram, saying: To your descendants I have given this land, from the river of Egypt as far as the great river, the Euphrates.", "pj": "בְּיוֹמָא הַהוּא גָזַר יְיָ עִם אַבְרָם קְיַים דְלָא לְמֵידַן בֵּיהּ בְּנוֹי וּלְמִפְרוֹקִינוּן מִן מַלְכוּתָא לְמֵימַר לִבְנָךְ אֶתֵּן יַת אַרְעָא הָדָא מִנִילוֹס דְמִצְרַיִם עַד נַהֲרָא רַבָּא נַהֲרָא פְּרָת", "pj_en": "In that day the Lord ordained a covenant with Abram, that He would not judge therein his sons, but would deliver them from the kingdom, saying, To thy sons will I give this land, from Nilos of Mizraim unto the great river, the river Pherath,", "tj": "", "tj_en": "", "rashi": "<b>לזרעך נתתי.<\/b> אֲמִירָתוֹ שֶׁל הַקָּבָּ\"ה כְּאִלוּ הִיא עֲשׂוּיָה:<br><br><b>הנהר הגדול.<\/b> לְפִי שֶׁהוּא דָבוּק לְאֶרֶץ יִשְׂרָאֵל קוֹרְאֵהוּ גָּדוֹל, אַעַ\"פִּ שֶׁהוּא מְאֻחָר בְּאַרְבָּעָה נְהָרוֹת הַיּוֹצְאִים מֵעֵדֶן, שֶׁנֶּאֱמַר וְהַנָּהָר הָרְבִיעִי הוּא פְרָת. מָשָׁל הֶדְיוֹט: עֶבֶד מֶלֶךְ מֶלֶךְ, הִדָּבֵק לַשַּׁחֲוָר וְיִשְׁתַּחֲווּ לְךָ (בראשית רבה):", "rashi_en": "לזרעך נתתי UNTO THY SEED HAVE I GIVEN — The promise of the Holy One, blessed be He, is as an accomplished fact. (Consequently the perfect tense is here used) (Genesis Rabbah 44:22).<br><br>הנהר הגדול THE GREAT RIVER—Because it is associated with (mentioned in connection with; see Rashi on Deuteronomy 1:7) the land of Israel, Scripture calls it “great” although it is the last mentioned of the four rivers that went out of Eden — as it is said (Genesis 2:14). And the fourth river is the Euphrates”. There is a popular proverb: “A king’s servant is a king; attach yourself to a captain and people will bow down to you” (Genesis Rabbah 16:3). "}, {"ch": 15, "v": 19, "aliyah": 6, "heb": "אֶת־הַקֵּינִי֙ וְאֶת־הַקְּנִזִּ֔י וְאֵ֖ת הַקַּדְמֹנִֽי׃", "onk": "יָת <b>שַׁלְמָאֵי<\/b> וְיָת קְנִזָּאֵי וְיָת קַדְמוֹנָאֵי:", "onk_en": "[The lands of] the Kenites [<i>Shalmites<\/i>], Kenizites, Kadmonites,", "pj": "יַת שַׁלְמַיָא וְיַת קְנִיזָאָה וְיַת קַדְמוֹנָאָה", "pj_en": "the Shalmia, and the Kenizah, and Kadmonaah, and the", "tj": "וְיַת כָּל בְּנֵי מַדִינְחָא:", "tj_en": "And all the sons of the East.", "rashi": "<b>את הקני.<\/b> עֶשֶׂר אֻמּוֹת יֵשׁ כָּאן וְלֹא נָתַן לָהֶם אֶלָּא שִׁבְעָה גוֹיִם, וְהַשְּׁלשָׁה אֱדוֹם וּמוֹאָב וְעַמּוֹן, וְהֵם קֵינִי, קְנִזִּי, וְקַדְּמוֹנִי עֲתִידִים לִהְיוֹת יְרֻשָּׁה לֶעָתִיד (בראשית רבה), שֶׁנֶּאֱמַר: אֱדוֹם וּמוֹאָב מִשְׁלוֹחַ יָדָם וּבְנֵי עַמּוֹן מִשְׁמַעְתָּם (ישעיה י\"א):", "rashi_en": "<b>The Kenites.<\/b> Ten nations are listed here, [yet] He gave to them only [the land] of Seven Nations. The three [whose lands were not given], Edom, Moav, and Ammon which are [referred to here as]: Keini, Knizi, and Kadmoni are destined to be possessed in the future, as it is said: “They will overpower Edom and Moav and the Ammonites will obey them.” "}, {"ch": 15, "v": 20, "aliyah": 6, "heb": "וְאֶת־הַחִתִּ֥י וְאֶת־הַפְּרִזִּ֖י וְאֶת־הָרְפָאִֽים׃", "onk": "וְיָת חִתָּאֵי וְיָת פְּרִזָּאֵי וְיָת <b>גִּבָּרָאֵי<\/b>:", "onk_en": "The Chittites, Perizites, the Refa’im [<i>the mighty ones<\/i>],", "pj": "וְיַת חִתָּאֵי וְיַת פְּרִיזָאֵי וְיַת גוּבָּרָאֵי", "pj_en": "Hittaee, and the Pherizaee, and Gibaraee, and the", "tj": "", "tj_en": "", "rashi": "<b>ואת הרפאים.<\/b> אֶרֶץ עוֹג, שֶׁנֶּאֱמַר בָּהּ: הַהוּא יִקָּרֵא אֶרֶץ רְפָאִים (דברים ג'):", "rashi_en": "ואת הרפאים AND THE REPHAIM — the land Og King of Bashan, of which it said, (Deuteronomy 3:13) “All that (Bashan) is called the land of the Rephaim”."}, {"ch": 15, "v": 21, "aliyah": 6, "heb": "וְאֶת־הָֽאֱמֹרִי֙ וְאֶת־הַֽכְּנַעֲנִ֔י וְאֶת־הַגִּרְגָּשִׁ֖י וְאֶת־הַיְבוּסִֽי׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיָת אֱמוֹרָאֵי וְיָת כְּנַעֲנָאֵי וְיָת גִּרְגָּשָׁאֵי וְיָת יְבוּסָאֵי:", "onk_en": "The Emorites, Canaanites Girgashites and Yevusites.", "pj": "וְיַת אֱמוֹרָאֵי וְיַת כְּנַעֲנָאֵי וְיַת גִרְגָשָׁאֵי וְיַת יְבוּסָאֵי", "pj_en": "Emoraee, and the Kinaanaee, and the Girgeshaee, and the Jebusaee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 1, "aliyah": 6, "heb": "וְשָׂרַי֙ אֵ֣שֶׁת אַבְרָ֔ם לֹ֥א יָלְדָ֖ה ל֑וֹ וְלָ֛הּ שִׁפְחָ֥ה מִצְרִ֖ית וּשְׁמָ֥הּ הָגָֽר׃", "onk": "וְשָׂרַי אִתַּת אַבְרָם לָא יְלִידַת לֵיהּ וְלַהּ אַמְתָא מִצְרֵיתָא וּשְׁמַהּ הָגָר:", "onk_en": "Avram’s wife Sarai had not borne him children. She had an Egyptian handmaid whose name was Hagar.", "pj": "וְשָרַי אִתַּת אַבְרָם לָא יְלִידַת לֵיהּ וְלָהּ אַמְתָא מִצְרֵיתָא וּשְׁמָהּ הָגָר בְּרַת פַּרְעה דְיַהֲבָהּ לֵיהּ לְאַמְהוּ בִּזְמַן דְנָסְבָהּ וְאִתְכַּתַּשׁ בְּמֵימַר מִן קֳדָם יְיָ", "pj_en": "But Sara, the wife of Abram, had not borne to him. But he had a handmaid, a Mizreitha, and her name was Hagar, a daughter of Pharoh, whom he gave to him as a handmaid at the time that he received her, being struck by the Word from before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>שׁפחה מצרית.<\/b> בַּת פַּרְעֹה הָיְתָה, כְּשֶׁרָאָה נִסִּים שֶׁנַּעֲשׂוּ לְשָׂרָה אָמַר: מוּטָב שֶׁתְּהֵא בִתִּי שִׁפְחָה בְּבַיִת זֶה וְלֹא גְבִירָה בְּבַיִת אַחֵר:", "rashi_en": "שפחה מצרית A HANDMAID, AN EGYPTIAN — She was a daughter of Pharaoh; when he
