ּוּשְׁרָנֵיהּ תְּלָתָא סַלַיָא תְּלָתֵי שַׁעֲבּוּדַיָא הִינוּן דַעֲתִידִין לְבֵית יִשְרָאֵל לְמִשְׁתַּעֲבְּדָא וְאַנְתְּ רַב נַחֲתּוֹמֵי תְּקַבֵּיל אֲגַר בִּישׁ עַל חֶלְמָךְ בִּישׁ דְחָלַמְתָּ דְפָשַׁר לֵיהּ יוֹסֵף יַת מַה דִשְׁפַר בְּעֵינוֹי וַאֲמַר לֵיהּ דֵין לָךְ פּוּשְׁרָנֵיהּ תְּלָתָא סַלַיָא תְּלַת יוֹמִין הִינוּן לְקַטְלָךְ", "pj_en": "Joseph answered and said, This is its interpretation. The three baskets are the three enslavements with which the house of Israel are to be enslaved. But thou, the chief of the bakers, wilt receive an evil award, by the dream which thou hast dreamed. And Joseph explained it, as it was proper in his eyes and said to him: This is its interpretation to thyself. The three baskets are three days until thy death.", "tj": "וַאֲמַר לֵיהּ תְּלַת סַלַיָא אִינוּן תְּלָתָא שִׁיעֲבּוּדַיָא תַּקִיפַיָא דַעֲתִידִין מֵעַרְעָא לְבֵית יִשְרָאֵל בְּאַרְעָא דְמִצְרַיִם בְּטִינַיָא וּבְלִיבְנַיָא וּבְכָל פּוּלְחָנָא דְאַפֵּי בָּרָא עָתִיד פַּרְעה מַלְכָּא דְמִצְרָיִם לְמֶהֱוֵי גְזַר גְזִירִין בִּישָׁן עַל יִשְרָאֵל וּרְמֵי בְנֵיהוֹן בְּנַהֲרָא בְּרַם פַרְעה יוֹבִיד וְחֵילוּתֵיהּ יִשְׁתֵּיצוּן וּבְנֵי יִשְׁרָאֵל יִפְקוּן פְּרִיקִין בְּרֵישׁ גְלֵי. וְאַתְּ רַב נַחְתּוֹמָא תְּקַבֵּל פּוּרְעָנוּת דִי חֲלֵימִית חֵילְמָא בִּישָׁא הָדֵין וּפִתְרוֹנֵי דְחֵילְמָא לָא הֲוָה יוֹסֵף יְדִיעַ לֵיהּ וּמִן בָּתַר כֵּן פָּתַר לֵיהּ יוֹסֵף הֵיךְ מַה שְׁפַר בְּאַפּוֹי וַאֲמַר לֵיהּ יוֹסֵף דֵין הוּא פִּתְרוֹנֵיהּ דְחֵילְמָא תְּלַת סַלַיָא תְּלַת יוֹמִין אִינוּן:", "tj_en": "And he said to him, The three baskets are the three heavy enslavements which are to happen to the house of Israel in the land of Mizriam in clay and in bricks, and in all work on the face of the field. It will be that Pharoh kin, of Mizriam will decree evil decrees against Israel and throw their children into the river. Neverthless Pharoh will perish, and his host be destroyed, but the sons of Israel will go forth redeemed with uncovered head. And thou, the chief of the bakers wilt receive punishment; for this dream which thou bast dreamed is evil. But the interpretation of the dream Joseph did not (at once) make known to him; but afterwards Joseph expounded it, When it pleased him. And Joseph said to him, This is the interpretation of the dream. The three baskets are three days.", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 19, "aliyah": 7, "heb": "בְּע֣וֹד&thinsp;<b>׀<\/b> שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֨א פַרְעֹ֤ה אֶת־רֹֽאשְׁךָ֙ מֵֽעָלֶ֔יךָ וְתָלָ֥ה אוֹתְךָ֖ עַל־עֵ֑ץ וְאָכַ֥ל הָע֛וֹף אֶת־בְּשָׂרְךָ֖ מֵעָלֶֽיךָ׃", "onk": "<b>בְּסוֹף<\/b> תְּלָתָא יוֹמִין <b>יַעְדִּי<\/b> פַרְעֹה יָת רֵישָׁךְ מִנָּךְ וְיִצְלוֹב יָתָךְ עַל צְלִיבָא וְיֵכוּל עוֹפָא יָת בִּשְׂרָךְ מִנָּךְ:", "onk_en": "In another [<b>At the end of<\/b>] three days, Pharaoh will lift [<b>remove<\/b>] your head from off you. He will hang you on a tree, and the bird will eat your flesh from off you.", "pj": "בְּסוֹף תְּלָתָא יוֹמִין יַעֲדִי פַּרְעה בְּסַיְיפָא יַת רֵישָׁךְ מֵעִילוֹי גוּפָךְ וְיִצְלוֹב יָתָךְ עַל קֵיסָא וְיֵיכוּל עוֹפָא יַת בִּישְרָךְ מִינָךְ", "pj_en": "At the end of three days, Pharoh with the sword will take away thy head from thy body, and will hang thee upon a gibbet, and the birds will cut thy flesh from thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 20, "aliyah": 7, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> בַּיּ֣וֹם הַשְּׁלִישִׁ֗י י֚וֹם הֻלֶּ֣דֶת אֶת־פַּרְעֹ֔ה וַיַּ֥עַשׂ מִשְׁתֶּ֖ה לְכׇל־עֲבָדָ֑יו וַיִּשָּׂ֞א אֶת־רֹ֣אשׁ&thinsp;<b>׀<\/b> שַׂ֣ר הַמַּשְׁקִ֗ים וְאֶת־רֹ֛אשׁ שַׂ֥ר הָאֹפִ֖ים בְּת֥וֹךְ עֲבָדָֽיו׃", "onk": "וַהֲוָה בְּיוֹמָא תְלִיתָאָה יוֹמָא בֵּית וַלְדָא דְפַרְעֹה וַעֲבַד מִשְׁתְּיָא לְכָל עַבְדּוֹהִי <b>וְאִדְכַּר<\/b> יָת רֵישׁ רַב שָׁקֵי וְיָת רֵישׁ רַב נַחְתּוֹמֵי בְּגוֹ עַבְדּוֹהִי:", "onk_en": "It was on the third day, which was Pharaoh’s birthday, that he [Pharaoh] made a feast for all his servants. He lifted [<b>remembered<\/b>] the head of the chief butler, and the head of the chief baker among his servants.", "pj": "וַהֲוָה בְּיוֹם תְּלִיתָאֵי יוֹם גְנוּסָא דְפַרְעה וְעָבַד שֵׁירוּ לְכָל עַבְדוֹי וְרוֹמַם יַת רֵישׁ רַב מְזוֹגַיָא וְיַת רֵישׁ רַב נַחְתּוֹמַיָא בְּגוֹ עַבְדוֹי", "pj_en": "And it was on the third day, the nativity of Pharoh that he made a feast to all his servants. And he lifted up the head of the chief butler, and the head of the chief baker, in the midst of his servants.", "tj": "", "tj_en": "", "rashi": "<b>יום הלדת את פרעה.<\/b> יוֹם לֵידָתוֹ, וְקוֹרִין לוֹ יוֹם גֵּינוּסְיָא. וּלְשׁוֹן הֻלֶּדֶת, לְפִי שֶׁאֵין הַוָּלָד נוֹצָר אֶלָּא עַל יְדֵי אֲחֵרִים, שֶׁהַחַיָּה מְיַלֶּדֶת אֶת הָאִשָּׁה, וְעַל כֵּן הַחַיָּה נִקְרֵאת מְיַלֶּדֶת, וְכֵן וּמוֹלְדוֹתַיִךְ בְּיוֹם הוּלֶּדֶת אוֹתָךְ (יחזקאל ט\"ז) וְכֵן אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע (ויקרא י\"ג), שֶׁכִּבּוּסוֹ עַל יְדֵי אֲחֵרִים:<br><br><b>וישא את ראש וגו'.<\/b> מְנָאָם עִם שְׁאָר עֲבָדָיו, שֶׁהָיָה מוֹנֶה הַמְּשָׁרְתִים שֶׁיְּשָׁרְתוּ לוֹ בִּסְעוּדָתוֹ וְזָכַר אֶת אֵלּוּ בְתוֹכָם, כְּמוֹ שְׂאוּ אֶת רֹאשׁ (במדבר א'), לְשׁוֹן מִנְיָן:", "rashi_en": "יום הלדת את פרעה HIS (PHARAOH’S) BIRTHDAY. It is called (Avodah Zarah 10a) “The birthday festival”. The causative passive form (הלדת) is used because the infant is born only by the assistance of others, for the midwife delivers the woman. On this account a midwife is called מילדת a Piel form “one who brings to birth”. This passive form occurs similarly (Ezekiel 16:4) “And as for thy nativity, in the day thou wast born (הולדת אתך)”. A similar passive form is used in (Leviticus 13:55) “after the plague (הכבס) is washed away”, because the washing is done by others).<br><br>‘וישא את ראש וגו means he counted them amongst his other servants — because he counted those who might serve him at his feast — and he remembered these amongst them. The phrase is similar to (Numbers 1.2) “שא את ראש” which signifies counting. "}, {"ch": 40, "v": 21, "aliyah": 7, "heb": "וַיָּ֛שֶׁב אֶת־שַׂ֥ר הַמַּשְׁקִ֖ים עַל־מַשְׁקֵ֑הוּ וַיִּתֵּ֥ן הַכּ֖וֹס עַל־כַּ֥ף פַּרְעֹֽה׃", "onk": "וַאֲתֵיב יָת רַב שָׁקֵי עַל שַׁקְיוּתֵיהּ וִיהַב יָת כַּסָּא עַל יְדָא דְפַרְעֹה:", "onk_en": "He restored the chief butler to his position, and he presented the cup into Pharaoh’s hand.", "pj": "וְאָתֵיב יַת רַב מְזוֹגֵיהּ עַל מַזְגֵיהּ דְאִשְׁתַּכַּח דְלָא הֲוָה בְּעֵיטָא הַהוּא וִיהַב כַּסָא עַל יְדָא דְפַרְעה", "pj_en": "And he restored the chief butler to his butlership, because he found he had not been in that counsel. And he gave the cup into Pharoh's hand.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 22, "aliyah": 7, "heb": "וְאֵ֛ת שַׂ֥ר הָאֹפִ֖ים תָּלָ֑ה כַּאֲשֶׁ֥ר פָּתַ֛ר לָהֶ֖ם יוֹסֵֽף׃", "onk": "וְיָת רַב נַחְתּוֹמֵי צְלָב כְּמָא דִּי פָשַׁר לְהוֹן יוֹסֵף:", "onk_en": "The chief baker, he hung, just as Yoseif had interpreted to them.", "pj": "וְיַת רַב נַחְתּוֹמֵי צְלָב דְיָעַט לְמִקְטְלֵיהּ הֵיכְמָא דְפָשַׁר לְהוֹם יוֹסֵף", "pj_en": "But the chief baker he hanged, because he had taken counsel to kill him, even as Joseph had expounded to them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 23, "aliyah": 7, "heb": "וְלֹֽא־זָכַ֧ר שַֽׂר־הַמַּשְׁקִ֛ים אֶת־יוֹסֵ֖ף וַיִּשְׁכָּחֵֽהוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלָא דְכִיר רַב שָׁקֵי יָת יוֹסֵף וְאַנְשְׁיֵהּ:", "onk_en": "[However] the chief butler did not remember Yoseif, but forgot him.", "pj": "וּבְגִין דְשָׁבַק יוֹסֵף חִסְדָא דִלְעֵיל וְאִתְרָחִיץ בְּרַב מְזוֹגַיָא בִּבְשַר עָבִיד בְּגִין כֵּן לָא אִידְכַּר רַב מְזוֹגַיָא יַת יוֹסֵף וְאַנְשְׁיֵיהּ עַד זְמַן דִי מָטָא קִיצָא מִן קֳדָם יְיָ לְמִתְפַּרְקָא", "pj_en": "But because, Joseph had withdrawn from the mercy that is above, and had put his confidence in the chief butler, he waited on the flesh. Therefore the chief butler did not remember Joseph, but forgat him, until from the Lord came the time of the end that he should be released.", "tj": "שְׁבַק יוֹסֵף חִסְדָא דִלְעֵיל בְּחִסְדָא דִלְרַע וְחִסְדָא דְלָוֵוי יָתֵיהּ מִבַּיְיתֵיהּ דְאָבוֹי וְאִתְרְחַץ בְּרַב מְזוֹגַיָיא בִּבְשַר עָבִיד וּבְשַר טָעַם כַּסָא דְמוֹתָא וְלָא אִידְכַּר כְּתָבָא דְכָתִיב וּמְפָרַשׁ לִיט יֶהֱוֵי גַבְרָא דִי יִתְרָחִיץ בְּבִישְרָא וִישַׁוֵי בִּישְרָא רַחֲצוֹהִי וּבְרִיךְ יֶהֱוֵי גַבְרָא דִי יִתְרָחֵיץ בְּשֵׁם מֵימְרֵיהּ דַיְיָ וִיהֵי מֵימְרֵיהּ דַיְיָ רוֹחֲצָנֵיהּ. מִן בְּגִין כֵּן לָא אִדְכַּר רַב מְזוֹגַיָא יַת יוֹסֵף וְאַנְשֵׁי יָתֵיהּ עַד זְמַן דִמְטָא קִצֵיהּ לְמִתְפַּרְקָא:", "tj_en": "Joseph left the mercy above, and the mercy beneath, and the mercy which accompanied him from his father's house, and put his confidence in the chief butler: he trusted in the flesh, and the flesh be tasted of, even the cup of death. Neither did he remember the scripture where it is written expressly, Cursed shall be the man who trusteth in the flesh, and setteth the flesh as his confidence. Blessed shall be the man who trusteth in the Name of the Word of the Lord, and whose confidence is the Word of the Lord. Therefore the chief butler did not remember Joseph, but forgat him, until the time of the end came that he should be released.", "rashi": "<b>ולא זכר שר המשקים.<\/b> בּוֹ בַיּוֹם:<br><br><b>וישכחהו.<\/b> לְאַחַר מִכָּאן. מִפְּנֵי שֶׁתָּלָה בוֹ יוֹסֵף לְזָכְרוֹ, הֻזְקַק לִהְיוֹת אָסוּר שְׁתֵּי שָׁנִים, שֶׁנֶּאֱמַר אַשְׁרֵי הַגֶּבֶר אֲשֶׁר שָׂם ה' מִבְטַחוֹ וְלֹא פָנָה אֶל רְהָבִים (תהילים מ') – וְלֹא בָטַח עַל מִצְרִים, הַקְּרוּיִים רַהַב:", "rashi_en": "ולא זכר שר המשקים AND THE CHIEF OF THE BUTLERS DID NOT REMEMBER HIM on that day, <br><br>וישכחהו AND HE FORGOT HIM afterwards. Because Joseph had placed his trust in him that he should remember him he was doomed to remain in prison for two years. So it is said (Psalms 40:5) “Happy is the man who maketh the Lord his trust and turneth not to (רהבים) the arrogant” — i.e. doth not trust in the Egyptians who are called arrogant (Genesis Rabbah 89:3 cf. Isaiah 30:7)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

  b.dataset.aliyah = i;

}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
