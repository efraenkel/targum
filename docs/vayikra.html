y in the form of a Greek X (cf. Rashi on Exodus 29:7 and Note thereon) and that the rest of the oil was consumed separately by the priests (Menachot 75a; cf. Sifra, Vayikra Dibbura d'Nedavah, Chapter 11 6). — Why is the word בשמן used twice in this verse (it would have sufficed to state:  חלות מצות בלולות בשמן ורקיקי מצות משוחים בו)? In order to permit for use with the meal-offering the “second grade of oil” and the “third grade of oil” which comes out of the olives) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 11 6), and to teach that “the first oil” is required only for the candelabrum of which it is stated, (Exodus 27:20) “clear [olive oil for the light]”. — We read in Treatise Menachoth 76a: All the meal-offerings that were baked before the “fistful” was taken from them and at which the קמיצה could therefore be performed only by first breaking them into pieces — each of them had to be offered of ten cakes, and that at which “wafers” are prescribed was offered of ten wafers."}, {"ch": 2, "v": 5, "aliyah": 2, "heb": "וְאִם־מִנְחָ֥ה עַל־הַֽמַּחֲבַ֖ת קׇרְבָּנֶ֑ךָ סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן מַצָּ֥ה תִהְיֶֽה׃", "onk": "וְאִם מִנְחָתָא עַל מַסְרֵיתָא קֻרְבָּנָךְ סוּלְתָּא דְּפִילָא בִמְשַׁח פַּטִּיר תְּהֵי:", "onk_en": "If your offering is a pan-baked meal offering, it shall be of fine flour mixed with oil; it shall be [unleavened] matzoh.", "pj": "וְאִין מִנְחָתָא עַל מַסְרִיתָא קוּרְבָּנָךְ סְמִידָא פְּתִיכָא בִּמְשַׁח פַּטִיר תְהֵי", "pj_en": "And if thy oblation of a mincha be from the pan, it shall be of flour mingled with oil, unleavened shall it be.", "tj": "וַעֲרִיכֵי פַּטִּיר:", "tj_en": "And wafers unleavened.", "rashi": "<b>ואם מנחה על המחבת.<\/b> שֶׁאָמַר הֲרֵי עָלַי מִנְחַת מַחֲבַת; וּכְלִי הוּא שֶׁהָיָה בַּמִּקְדָּשׁ, שֶׁאוֹפִין בּוֹ מִנְחָה זוֹ עַל הָאוּר בְּשֶׁמֶן, וְהַכְּלִי אֵינוֹ עָמֹק אֶלָּא צָף, וּמַעֲשֵׂי הַמִּנְחָה שֶׁבְּתוֹכוֹ קָשִׁין, שֶׁמִּתּוֹךְ שֶׁהִיא צָפָה, הָאוּר שׂוֹרֵף אֶת הַשֶּׁמֶן. וְכֻלָּן טְעוּנוֹת שָׁלוֹשׁ מַתְּנוֹת שֶׁמֶן — יְצִיקָה וּבְלִילָה וּמַתַּן שֶׁמֶן בִּכְלִי קֹדֶם לַעֲשִֹיָּתָן (שם ע\"ד):<br><br><b>סלת בלולה בשמן.<\/b> מְלַמֵּד שֶׁבּוֹלְלָן בְּעוֹדָן סֹלֶת (מנחות ע\"ד):", "rashi_en": "ואם מנחה על המחבת   AND IF AN OBLATION BAKEN IN THE PAN [BE THY OFFERING], in that one said, “I take upon myself the obligation to bring a meal-offering baken in the pan” (cf. Rashi on previous. verse and Note thereon). This (the מחבת) was a vessel employed in the Temple in which they baked this particular meal-offering on the open fire in oil. The vessel was not deep but flat; therefore the meal-offering made in it was hard, for just because it (the מחבת) was flat the fire burnt the oil. (Menachot 63a). — All of them (i.e. both the meal-offerings prepared in a vessel) require a three-fold use of oil — pouring upon them after they ware prepared, mingling with their dough, and placing of oil in the vessel prior to preparing them (Menachot 74b; cf. Sifra, Vayikra Dibbura d'Nedavah, Chapter 12 1).<br><br>סלת בלולה בשמן FLOUR MINGLED WITH OIL — This teaches us that he mingles them together when they (the cakes) are yet flour (are not yet baked, and not, as might be assumed, when the dough is already formed into cakes, as is the case with לחמי תודה. the cakes of the sacrifice of acknowledgment, Leviticus 7:12, where Scripture prescribes חלות בלולת בשמן, “Cakes” mingled with oil; cf. Sifra, Vayikra Dibbura d'Nedavah, Chapter 12 2)."}, {"ch": 2, "v": 6, "aliyah": 2, "heb": "פָּת֤וֹת אֹתָהּ֙ פִּתִּ֔ים וְיָצַקְתָּ֥ עָלֶ֖יהָ שָׁ֑מֶן מִנְחָ֖ה הִֽוא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּצַע יָתָהּ בִּיצוּעִין וּתְרִיק עֲלָהּ מִשְׁחָא מִנְחָתָא הִיא:", "onk_en": "Break it into pieces and pour oil on it; it is a meal-offering.", "pj": "רַסִיק יָתָהּ רִיסוּקִין וְתָרִיק עֲלָהּ מִשְׁחָא מִנְחָתָא הִיא", "pj_en": "He shall break it in pieces, and pour oil thereupon. It is a mincha.", "tj": "וּתְרַסֵּיק יָתֵהּ רִיסוּקִין וּתְרֵיק עֲלָהּ מִשְׁחָא:", "tj_en": "And he shall break it in pieces, and pour oil thereon.", "rashi": "<b>פתות אתה פתים.<\/b> לְרַבּוֹת כָּל הַמְּנָחוֹת הַנֶּאֱפוֹת קֹדֶם קְמִיצָה לִפְתִיתָה (שם ע\"ה):<br><br><b>ויצקת עליה שמן מנחה הוא.<\/b> לְרַבּוֹת כָּל הַמְּנָחוֹת לִיצִיקָה; יָכוֹל אַף מִנְחָה מַאֲפֵה תַּנּוּר כֵּן, תַּ\"ל עָלֶיהָ; אוֹצִיא אֶת הַחַלּוֹת וְלֹא אוֹצִיא אֶת הָרְקִיקִין, תַּ\"ל הִוא (שם):", "rashi_en": "פתות אתה פתים — THOU SHALT SUNDER IT INTO MORSELS — This is stated to include all meal-offerings that are baked before the קמיצה (i. e. all mentioned here with the exception of מנחת סלת; cf. לחם משנה on Maim. הל' מעשה קרבנות פי״ג ה\"י) in the law of breaking into pieces (Sifra, Vayikra Dibbura d'Nedavah, Chapter 12 5; Menachot 75a).<br><br>ויצקת עליה שמן מנחה הוא AND THOU SHALT POUR OIL THEREON: IT IS A MEAL OFFERING — This is intended to include all meal-offerings (with the exception of one; cf. Rashi below) in the law of pouring oil upon them after the מנחה is prepared. One might think the meal-offering baken in an oven (v. 4) should also be treated thus, Scripture, however, states עליה, “[thou shalt pour oil] upon it”, but not upon that baken in the oven. But perhaps I should exclude only The cakes of the מנחת מאפה תנור and not also the wafers of which that מנחה may consist! Scripture, however, states היא, — “it is a meal-offering” using this limitative word to the exclusion of wafers too (Sifra, Vayikra Dibbura d'Nedavah, Chapter 12 6; Menachot 75a)."}, {"ch": 2, "v": 7, "aliyah": 3, "heb": "וְאִם־מִנְחַ֥ת מַרְחֶ֖שֶׁת קׇרְבָּנֶ֑ךָ סֹ֥לֶת בַּשֶּׁ֖מֶן תֵּעָשֶֽׂה׃", "onk": "וְאִם מִנְחָתָא <b>דְרַדְתָּא<\/b> קֻרְבָּנָךְ סוּלְתָּא בִמְשַׁח תִּתְעֲבֵד:", "onk_en": "If your offering is a deep-pan [<b>which appears as if it has been ploughed out<\/b>] meal offering, you shall make it with fine flour and oil.", "pj": "וְאִין מִנְחַת מַרְתְּחָא קָרְבָּנָךְ סְמִידָא רְתַח בִּמְשַׁח תִּתְעֲבֵיד", "pj_en": "And if thy oblation be a mincha from the gridiron, it shall be made of flour broiled with oil.", "tj": "", "tj_en": "", "rashi": "<b>מרחשת.<\/b> כְּלִי הוּא שֶׁהָיָה בַּמִּקְדָּשׁ, עָמֹק, וּמִתּוֹךְ שֶׁהִיא עֲמֻקָּה, שַׁמְנָהּ צָבוּר וְאֵין הָאוּר שׂוֹרְפוֹ, לְפִיכָךְ מַעֲשֵׂי מִנְחָה הָעֲשׂוּיִין לְתוֹכָהּ רוֹחֲשִׁין; כָּל דָּבָר רַךְ עַל יְדֵי מַשְׁקֶה נִרְאֶה כְּרוֹחֵשׁ וּמְנַעֲנֵעַ (ספרא):", "rashi_en": "מרחשת [AND IF THOU BRING A MEAL OFFERING PREPARED IN A] מרחשת — This was a vessel used in the Temple, a deep one, and because it was deep the oil in it was heaped up (of considerable depth) and the fire did not burn it, and therefore the meal-offering made in it was, as it were, creeping). Every thing that is soft (elastic) because of the liquid contained in it appears as though it were creeping and moving (Sifra, Vayikra Dibbura d'Nedavah, Chapter 12 7; Menachot 63a)."}, {"ch": 2, "v": 8, "aliyah": 3, "heb": "וְהֵבֵאתָ֣ אֶת־הַמִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵאֵ֖לֶּה לַיהֹוָ֑ה וְהִקְרִיבָהּ֙ אֶל־הַכֹּהֵ֔ן וְהִגִּישָׁ֖הּ אֶל־הַמִּזְבֵּֽחַ׃", "onk": "וְתַיְתֵי יָת מִנְחָתָא דִּי יִתְעֲבֵד מֵאִלֵּין <b>קֳדָם<\/b> יְיָ וִיקַרְבִינָה לְוָת כַּהֲנָא וִיקַרְבִנַּהּ לְמַדְבְּחָא:", "onk_en": "You shall bring the meal-offering that will be made in any of the aforementioned ways to [<b>before<\/b>] Adonoy. He shall bring it to the <i>kohein<\/i> and he will present it to the altar.", "pj": "וּתְהַנְעֵל יַת מִנְחָתָא דְתִתְעֲבֵד מִן סְמִידָא וּמִשְׁחָא הָאִלֵין לְקָדָם יְיָ וִיקַרְבִינֵהּ גַבְרָא דְמַיְיתִי יָתָהּ לְוַת כַּהֲנָא וְכַהֲנָא יַמְטִינֵיהּ לְמַדְבְּחָא", "pj_en": "And the mincha which hath been made with the flour and the oil thou shalt bring in before the Lord, and the man who bringeth it shall present it to the priest, and the priest shall take it to the altar.", "tj": "", "tj_en": "", "rashi": "<b>אשר יעשה מאלה.<\/b> מֵאֶחָד מִן הַמִּינִים הַלָּלוּ:<br><br><b>והקריבה.<\/b> בְּעָלֶיהָ <b>אל הכהן<\/b>:<br><br><b>והגישה.<\/b> הַכֹּהֵן:<br><br><b>והגישה אל המזבח.<\/b> מַגִּישָׁהּ לְקֶרֶן דְּרוֹמִית מַעֲרָבִית שֶׁל מִזְבֵּחַ (זבחים ס\"ג):", "rashi_en": "אשר יעשה מאלה [AND THOU SHALT BRING THE MEAL OFFERING] THAT IS MADE OF THESE THINGS — i. e. of one of these kinds (the meal offerings mentioned) UNTO THE LORD,<br><br>והקריבה AND HE SHALL OFFER IT — the owner shall offer it אל הכהן UNTO THE PRIEST,<br><br>והגישה AND HE SHALL BRING IT NIGH — the kohen [shall bring it close],<br><br>והגישה … .אל המזבח AND HE SHALL BRING IT NIGH UNTO THE ALTAR — He (the priest) brings it nigh unto to the south-west corner of the altar (cf. Zevachim 63b)."}, {"ch": 2, "v": 9, "aliyah": 3, "heb": "וְהֵרִ֨ים הַכֹּהֵ֤ן מִן־הַמִּנְחָה֙ אֶת־אַזְכָּ֣רָתָ֔הּ וְהִקְטִ֖יר הַמִּזְבֵּ֑חָה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַיהֹוָֽה׃", "onk": "וְיַפְרֵישׁ כַּהֲנָא מִן מִנְחָתָא יָת אַדְכַּרְתָּה וְיַסֵּק לְמַדְבְּחָא <b>קֻרְבַּן דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "The <i>kohein<\/i> shall separate from the meal-offering its memorial portion and burn it on the altar, a fire-offering [<b>an offering<\/b>] of pleasing fragrance to [<b>which is accepted with favor before<\/b>] Adonoy.", "pj": "וְיַפְרֵישׁ כַּהֲנָא מִן מִנְחָתָא יַת שְׁבַח אַדְכַּרְתָּהּ וְיַסֵיק לְמַדְבְּחָא קוּרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "And the priest shall separate from the mincha a memorial of praise, and burn it at the altar, an oblation to be accepted with grace before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>את אזכרתה.<\/b> הִיא הַקֹּמֶץ:", "rashi_en": "את אזכרתה ITS MEMORIAL PORTION — this is the “fistful” (קמץ) (cf. Rashi on v. 2)."}, {"ch": 2, "v": 10, "aliyah": 3, "heb": "וְהַנּוֹתֶ֙רֶת֙ מִן־הַמִּנְחָ֔ה לְאַהֲרֹ֖ן וּלְבָנָ֑יו קֹ֥דֶשׁ קׇֽדָשִׁ֖ים מֵאִשֵּׁ֥י יְהֹוָֽה׃", "onk": "וּדְאִשְׁתָּאַר מִן מִנְחָתָא לְאַהֲרֹן וְלִבְנוֹהִי קוֹדֶשׁ קוּדְשִׁין מִ<b>קֻּרְבָּנַיָּא<\/b> דַיְיָ:", "onk_en": "Whatever remains of the meal-offering belongs to Aharon and his sons; [it is] holy of holies [most holy] of the fire-offering [<b>offerings<\/b>] of Adonoy.", "pj": "וּמַה דְמִשְׁתַּיֵיר מִן מִנְחָתָא יְהֵי לְאַהֲרן וְלִבְנוֹי קוֹדֶשׁ קוּדְשִׁין מִקָרְבְּנַיָא דַיְיָ", "pj_en": "And what remaineth of the mincha shall be for Aharon and his sons, it is most holy among the oblations of the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 11, "aliyah": 3, "heb": "כׇּל־הַמִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֙יבוּ֙ לַיהֹוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כׇל־שְׂאֹר֙ וְכׇל־דְּבַ֔שׁ לֹֽא־תַקְטִ֧ירוּ מִמֶּ֛נּוּ אִשֶּׁ֖ה לַֽיהֹוָֽה׃", "onk": "כָּל מִנְחָתָא דִּי תְקָרְבוּן <b>קֳדָם<\/b> יְיָ לָא תִתְעֲבֵד חֲמִיעַ אֲרֵי כָל חֲמִיר וְכָל דְּבַשׁ לָא תַסְּקוּן מִנֵּיהּ <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "All meal-offerings that you bring to [<b>before<\/b>] Adonoy are not to be made leavened, because all sourdough and all honey you shall not burn from them a fire-offering to [<b>an offering before<\/b>] Adonoy.", "pj": "כָּל מִנְחָתָא דִי תְקַרְבוּן קֳדָם יְיָ לָא תִתְעֲבֵיד חָמִיעַ אֲרוּם כָּל חֲמִיר וְכָל דְבַשׁ לָא תְקַרְבוּן מִינֵיהּ קָרְבָּנָא קֳדָם יְיָ", "pj_en": "But no mincha which thou offerest to the Lord shalt thou make with leaven; for neither leaven nor honey mayest thou offer as an oblation before the Lord.", "tj": "אֲרוּם כָּל דִּמְחַמָּע וְכָל דְּחָלִי:", "tj_en": "", "rashi": "<b>וכל דבש.<\/b> כָּל מְתִיקַת פְּרִי קְרוּיָה דְּבַשׁ:", "rashi_en": "וכל דבש [YE SHALL NOT CAUSE TO ASCEND IN FUMES] ANY HONEY – Any sweet juice of a fruit is called “honey”)."}, {"ch": 2, "v": 12, "aliyah": 3, "heb": "קׇרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖ם לַיהֹוָ֑ה וְאֶל־הַמִּזְבֵּ֥חַ לֹא־יַעֲל֖וּ לְרֵ֥יחַ נִיחֹֽחַ׃", "onk": "קֻרְבַּן קַדְמַי תְּקָרְבוּן יָתְהוֹן <b>קֳדָם<\/b> יְיָ וּלְמַדְבְּחָא לָא יִתַּסְּקוּן <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b>:", "onk_en": "You shall bring them as a first [fruit-]offering to [<b>before<\/b>] Adonoy but they shall not go up [be placed atop] the altar as a pleasing fragrance [<b>to be accepted with favor<\/b>].", "pj": "קָרְבַּן שֵׁירוּייָא תְּקַרְבוּן יַתְהוֹן קֳדָם יְיָ דִלְחֵים בִּיכּוּרַיָא חֲמִיר מִתְקָרֵיב וְתַמְרֵי בִּזְמַן בִּכּוּרֵי אִבָּא עִם דוּבְשֵׁיהּ מִתְקָרֵיב וְיֵיכְלוּן יַתְהוֹן כַּהֲנַיָא בְּרַם לְמַדְבְּחָא לָא יִתַּסְקוּן לְאִתְקַבָּלָא בְּרַעֲוָא", "pj_en": "When thou offerest an oblation of first fruits before the Lord, the bread of the first fruits thou mayest bring leavened, and the dates in the season of first fruits, and the fruit with its honey thou mayest bring, and the priest may eat them; but they shall not burn them at the altar as an oblation to be received with favour.", "tj": "", "tj_en": "", "rashi": "<b>קרבן ראשית תקריבו אתם.<\/b> מַה יֵּשׁ לְךָ לְהָבִיא מִן הַשְּׂאוֹר וּמִן הַדְּבַשׁ? קָרְבַּן רֵאשִׁית — שְׁתֵּי הַלֶּחֶם שֶׁל עֲצֶרֶת הַבָּאִים מִן הַשְּׂאוֹר, שֶׁנֶּאֱמַר חָמֵץ תֵּאָפֶינָה (ויקרא כ\"ג), וּבִכּוּרִים מִן הַדְּבַשׁ, כְּמוֹ בִּכּוּרֵי תְּאֵנִים וּתְמָרִים (מנחות נ\"ח):", "rashi_en": "קרבן ראשית תקריבו אתם YE MAY OFFER THEM AS AN OFFERING OF THE FIRST FRUITS — But what is it that you have to offer of leaven and of honey? The offering of the first fruits, viz., the “two loaves’’ of the Feast of Weeks” that were brought of leavened dough, — as it is said, (Leviticus 23:16, 17) “[and ye shall offer a new meal-offering unto the Lord . . . two loaves] they shall be baken leavened”. — and the first ripe fruits were brought of species that contain sweet juices (דבש), such as the firstlings of figs and dates (Menachot 58a)."}, {"ch": 2, "v": 13, "aliyah": 3, "heb": "וְכׇל־קׇרְבַּ֣ן מִנְחָתְךָ֮ בַּמֶּ֣לַח תִּמְלָח֒ וְלֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔יךָ מֵעַ֖ל מִנְחָתֶ֑ךָ עַ֥ל כׇּל־קׇרְבָּנְךָ֖ תַּקְרִ֥יב מֶֽלַח׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְכָל קֻרְבַּן מִנְחָתָךְ בְּמִלְחָא תִמְלַח וְלָא תְבַטֵּל מְלַח קְיַם אֱלָהָךְ מֵעַל מִנְחָתָךְ עַל כָּל קֻרְבָּנָךְ תְּקָרֵב מִלְחָא:", "onk_en": "You shall salt all your meal-offerings with salt and you shall not omit salt, the covenant of your God from [being placed] upon your meal-offerings. You shall bring salt on every one of your offerings.", "pj": "וְכָל קוּרְבַּן מִנְחָתָךְ בְּמִלְחָא תִמְלָח וְלָא תִבַטֵל מְלַח קְיַים אֳלָהָךְ מֵעִילַוֵי מִנְחָתָךְ מְטוֹל דְעֶשְרִין וְאַרְבְּעָא מוֹהֲבָתָא דְכַהֲנַיָא אִתְגְזָרוּ בִּקְיַים מִלְחָא בְּגִין כֵּן עַל כָּל קָרְבָּנָךְ תַּקְרִיב מִלְחָא", "pj_en": "And every oblation of thy mincha thou shalt salt with salt; thou shalt not withhold the salt of the covenant of thy God from thy mincha, because the twenty and four gifts of the priests are appointed with a covenant of salt; therefore salt shalt thou offer with all thy oblations.", "tj": "", "tj_en": "", "rashi": "<b>מלח ברית.<\/b> שֶׁהַבְּרִית כְּרוּתָה לַמֶּלַח מִשֵּׁשֶׁת יְמֵי בְּרֵאשִׁית, שֶׁהֻבְטְחוּ הַמַּיִם הַתַּחְתּוֹנִים לִקָּרֵב בַּמִּזְבֵּחַ בַּמֶּלַח וְנִסּוּךְ הַמַּיִם בֶּחָג:<br><br><b>על כל קרבנך.<\/b> עַל עוֹלַת בְּהֵמָה וָעוֹף וְאֵמוּרֵי כָּל הַקָּדָשִׁים כֻּלָּן (מנחות כ'):", "rashi_en": "מלח ברית [NEITHER SHALT THOU SUFFER] THE SALT OF THE COVENANT [… TO BE LACKING FROM MY MEAL OFFERING], because a covenant was established with the salt as far back as the six days of Creation when the lower waters (those of the oceans) received an assurance that they would be offered on the altar in the form of salt and also as water in the ceremony of “the libation of water” on the Feast of Tabernacles).‎<br><br>על כל קרבנך‎ UPON ALL THY OFFERINGS [THOU SHALT OFFER SALT] — upon burnt-offerings of cattle and fowls and upon the fat-portions of all sacrifices in general (Menachot 20a)."}, {"ch": 2, "v": 14, "aliyah": 3, "heb": "וְאִם־תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַיהֹוָ֑ה אָבִ֞יב קָל֤וּי בָּאֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽיךָ׃", "onk": "וְאִם תְּקָרֵב מִנְחַת בִּכּוּרִין <b>קֳדָם<\/b> יְיָ אָבִיב קְלֵי בְנוּר פֵּירוֹכָן <b>רַכִּיכָן<\/b> תְּקָרֵיב יָת מִנְחַת בִּכּוּרָךְ:", "onk_en": "When you bring a meal-offering of first grains to [<b>before<\/b>] Adonoy, of newly ripened crops, roasted over fire, ground [full and moist] [<b>soft<\/b>] kernels, you shall bring your first grain meal-offering.", "pj": "וְאִין תְּקָרֵב מִנְחַת בִּכּוּרִין קֳדָם יְיָ מְהַבְהַב קָלִי בְּנוּרָא קֶמַח קָלִי וּפֵירוּכִין תִּקְרַב יַת מִנְחַת בִּיכּוּרַיִךְ", "pj_en": "And if thou wilt present a mincha of first fruits before the Lord, (ears of wheat) roasted by fire, roasted flour and meal of barley shalt thou offer as a mincha of thy first fruits.", "tj": "", "tj_en": "", "rashi": "<b>ואם תקריב.<\/b> הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן כִּי, שֶׁהֲרֵי אֵין זֶה רְשׁוּת, שֶׁהֲרֵי בְּמִנְחַת הָעֹמֶר הַכָּתוּב מְדַבֵּר שֶׁהִיא חוֹבָה, וְכֵן וְאִם יִהְיֶה הַיֹּבֵל וְגוֹ' (במדבר ל\"ו):<br><br><b>מנחת בכורים.<\/b> בְּמִנְחַת הָעֹמֶר הַכָּתוּב מְדַבֵּר שֶׁהִיא בָּאָה אָבִיב — בִּשְׁעַת בִּשּׁוּל הַתְּבוּאָה, וּמִן הַשְּׂעוֹרִים הִיא בָּאָה, נֶאֱמַר כָּאן אָבִיב וְנֶאֱמַר לְהַלָּן (שמות ט'), הַשְּׂעֹרָה אָבִיב:<br><br><b>קלוי באש.<\/b> שֶׁמְּיַבְּשִׁין אוֹתָהּ עַל הָאוּר בְּאַבּוּב שֶׁל קַלָּאִים, שֶׁאִלּוּלֵי כֵן אֵינָהּ נִטְחֶנֶת בָּרֵחַיִם, לְפִי שֶׁהִיא לַחָה:<br><br><b>גרש כרמל.<\/b> גְּרוּסָה בְּעוֹדָהּ לַחָה:<br><br><b>גרש.<\/b> גֶּרֶשׂ לְשׁוֹן שְׁבִירָה וּטְחִינָה, גּוֹרְסָהּ בְּרֵחַיִם שֶׁל גָּרוֹסוֹת, כְּמוֹ וַיַּגְרֵס בֶּחָצָץ (איכה ג'), וְכֵן גָּרְסָה נַפְשִׁי (תהילים קי\"ט):<br><br><b>כרמל.<\/b> בְּעוֹד הַכַּר מָלֵא, שֶׁהַתְּבוּאָה לַחָה וּמְלֵאָה בְּקַשִּׁין שֶׁלָּהּ, וְעַל כֵּן נִקְרָאִים הַמְּלִילוֹת כַּרְמֶל, וְכֵן כַּרְמֶל בְּצִקְלוֹנוֹ (מלכים ב ד'):", "rashi_en": "ואם תקריב AND IF (according to Rashi, AND “WHEN”) THOU OFFER [A MEAL-OFFERING OF FIRST FRUITS] — אם here has the meaning of כי, “when”, for this (the offering of the מנחת בכורים) is not optional, since Scripture is speaking of the meal-offering of the “Omer” which is obligatory. Similar is אם in the phrase (Numbers 36:4) ואם יהיה היובל which means: “when the jubilee will be”, not: “if the jubilee will be”, since it is bound to come (cf. Sifra, Vayikra Dibbura d'Nedavah, Section 13 2; see also Rashi on Exodus 20:22).<br><br>מנחת בכורים THE MEAL-OFFERING OF FIRSTFRUITS — Scripture is speaking here of the meal-offering of the “Omer” (Leviticus 23:10) which is brought when the grain is in the green ears  ,(אביב), i.e.. at the time of the ripening of the grain, and which was brought of barley, for it states here “אביב”, and there, too, (Exodus 9:31) it slates “for the barley was in the ears (אביב)” (Sifra, Vayikra Dibbura d'Nedavah, Section 13 4; Menachot 68b).<br><br>קלוי באש PARCHED BY THE FIRE  It is thus described because they roast it on the fire in the “tube of the grain-parchers (אביב של קלאים)”, for unless it was treated thus it could not be ground in the mill because it was fresh, as the term אביב green, fresh suggests (cf. Rashi on Exodus 9:31).<br><br>גרש כרמל means broken (גרוש) whilst it was yet fresh (כרמל). <br><br>גרש is an expression for breaking and grinding. — He ground it in a grit-mill. — גרש has the same meaning as the verb in (Lamentations 3:16) “and He hath broken (ויגרס) [my teeth] with gravel-stones”; and similarly (Psalms 119:20) “My soul is broken (גרסה). <br><br>כרמל — i. e., broken whilst the husk (כר) is yet full (מלא) (according to this כרמל is a word compounded of כר and מל) — when the crop is yet fresh and full in its stalks; for this reason the fresh ears are called כרמל. Similar is, (2 Kings 4:42) “and full ears of corn (כרמל) in the husk thereof”."}, {"ch": 2, "v": 15, "aliyah": 3, "heb": "וְנָתַתָּ֤ עָלֶ֙יהָ֙ שֶׁ֔מֶן וְשַׂמְתָּ֥ עָלֶ֖יהָ לְבֹנָ֑ה מִנְחָ֖ה הִֽוא׃", "onk": "וְתִתֵּן עֲלַהּ מִשְׁחָא וּתְשַׁוֵּי עֲלַהּ לְבוֹנְתָּא מִנְחָתָא הִיא:", "onk_en": "You shall put oil on it and place frankincense upon it; it is a meal-offering.", "pj": "וְתִתֵּן עֲלָהּ מְשַׁח זֵיתָא וְתַשְׁוֵי עֲלָהּ לְבוֹנְתָא מִנְחָתָא הִיא", "pj_en": "And thou shalt put olive oil upon it, and lay frankincense thereon; it is a mincha.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 16, "aliyah": 3, "heb": "וְהִקְטִ֨יר הַכֹּהֵ֜ן אֶת־אַזְכָּרָתָ֗הּ מִגִּרְשָׂהּ֙ וּמִשַּׁמְנָ֔הּ עַ֖ל כׇּל־לְבֹנָתָ֑הּ אִשֶּׁ֖ה לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַסֵּק כַּהֲנָא יָת אִדְכַּרְתַּהּ מִפֵּרוּכַהּ וּמִמִּשְׁחַהּ עַל כָּל לְבוֹנְתָּהּ <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "The <i>kohein<\/i> shall burn its memorial portion of its ground flour and of its oil and all of its frankincense; [it is] a fire-offering to [<b>an offering before<\/b>] Adonoy.", "pj": "וְיַסֵיק כַּהֲנָא יַת שְׁבַח אַדְכַּרְתָּהּ מִן פֵּירוּכְיָיא וּמִטוּב מִשְׁחָא עַל כָּל לְבוֹנְתָּהּ קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "And the priest shall burn its memorial of praise from the meal and from the best of the oil, with all the frankincense, an oblation before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 1, "aliyah": 4, "heb": "וְאִם־זֶ֥בַח שְׁלָמִ֖ים קׇרְבָּנ֑וֹ אִ֤ם מִן־הַבָּקָר֙ ה֣וּא מַקְרִ֔יב אִם־זָכָר֙ אִם־נְקֵבָ֔ה תָּמִ֥ים יַקְרִיבֶ֖נּוּ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְאִם נִכְסַת <b>קוּדְשַׁיָּא<\/b> קֻרְבָּנֵיהּ אִם מִן תּוֹרֵי הוּא מְקָרֵב אִם דְּכַר אִם נוּקְבָא שְׁלִים יְקָרְבִינֵיהּ קֳדָם יְיָ:", "onk_en": "If his offering is a peace [<b>sacred<\/b>]-offering; if his offering is of cattle [whether] male or female; he shall bring it unblemished before Adonoy.", "pj": "וְאִין נִכְסַת קוּדְשַׁיָא קוּרְבָּנֵיהּ אִין מִן תּוֹרֵי הוּא מַקְרִיב אִין דְכַר אִין נוּקְבָא שְׁלִים יְקַרְבִינֵיהּ", "pj_en": "And if his oblation be of the sanctified victims, if from thy cattle he offer, whether male or female, he shall offer it perfect.", "tj": "", "tj_en": "", "rashi": "<b>שלמים.<\/b> שֶׁמְּטִילִים שָׁלוֹם בָּעוֹלָם; דָּ\"אַ: שְׁלָמִים שֶׁיֵּשׁ בָּהֶם שָׁלוֹם לַמִּזְבֵּחַ וְלַכֹּהֲנִים וְלַבְּעָלִים (ספרא):", "rashi_en": "שלמים PEACE-OFFERINGS — They are so called because they bring peace (שלום) into the world. Another explanation is: they are called שלמים because through them there is “peace” (harmony and lack of envy) to the altar, to the priests and to the owners (since all these receive a portion) (cf. Rashi on Exodus 29:22 and our Note thereon; see also Sifra, Vayikra Dibbura d'Nedavah, Chapter 16 2)."}, {"ch": 3, "v": 2, "aliyah": 4, "heb": "וְסָמַ֤ךְ יָדוֹ֙ עַל־רֹ֣אשׁ קׇרְבָּנ֔וֹ וּשְׁחָט֕וֹ פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְזָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַכֹּהֲנִ֧ים אֶת־הַדָּ֛ם עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְיִסְמוֹךְ יְדֵיהּ עַל רֵישׁ קֻרְבָּנֵיהּ וְיִכְּסִנֵּיהּ בִּתְרַע מַשְׁכַּן זִמְנָא וְיִזְרְקוּן בְּנֵי אַהֲרֹן כָּהֲנַיָּא יָת דְּמָא עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He shall lay his hand on the head of his offering and slaughter it at the entrance of the Tent of Meeting. The sons of Aharon, the <i>kohanim,<\/i> will sprinkle the blood all around the altar.", "pj": "וְיִסְמוֹךְ יַת יְמִינֵיהּ בְּתוּקְפָא עַל רֵישׁ קוּרְבָּנֵיהּ וְיַכְסִינֵיהּ טַבְּחָא בִּתְרַע מַשְׁכַּן זִמְנָא וְיִדְרְקוּן בְּנֵי אַהֲרן כַּהֲנַיָא יַת אַדְמָא עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And he shall lay his right hand firmly on the head of his oblation, and the slayer shall kill it at the door of the tabernacle of ordinance, and the priests the sons of Aharon shall sprinkle the blood upon the altar round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 3, "aliyah": 4, "heb": "וְהִקְרִיב֙ מִזֶּ֣בַח הַשְּׁלָמִ֔ים אִשֶּׁ֖ה לַיהֹוָ֑ה אֶת־הַחֵ֙לֶב֙ הַֽמְכַסֶּ֣ה אֶת־הַקֶּ֔רֶב וְאֵת֙ כׇּל־הַחֵ֔לֶב אֲשֶׁ֖ר עַל־הַקֶּֽרֶב׃", "onk": "וִיקָרֵב מִנִּכְסַת קוּדְשַׁיָּא <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ יָת תַּרְבָּא דְּחָפֵי יָת גַּוָּא וְיָת כָּל תַּרְבָּא דִּי עַל גַּוָּא:", "onk_en": "He shall bring from the peace[<b>sacred<\/b>]-offering, as a fire-offering to [<b>an offering before<\/b>] Adonoy, the fat covering the innards, and all the fat on the innards.", "pj": "וִיקָרֵיב מִנִכְסַת קוּדְשַׁיָא קוּרְבָּנָא קֳדָם יְיָ יַת פְּרִיסוּתָא דְתַרְבָּא דְחָפֵי יַת כְּרֵיסָא וְיַת כָּל תַּרְבָּא דְעַל כְּרֵיסָא", "pj_en": "And of the sanctified victim, his oblation before the Lord, he shall offer the covering of fat which covereth the inwards, even all the fat which is upon the inwards.", "tj": "", "tj_en": "", "rashi": "<b>ואת כל החלב וגו'.<\/b> לְהָבִיא חֵלֶב שֶׁעַל הַקֵּבָה דִּבְרֵי רַבִּי יִשְׁמָעֵאל, רַבִּי עֲקִיבָא אוֹמֵר לְהָבִיא חֵלֶב שֶׁעַל הַדַּקִּין (שם):", "rashi_en": "‎'ואת כל החלב וגו [AND HE SHALL OFFER … ALL THE FAT THAT COVERETH THE INWARDS] AND ALL THE FAT [THAT IS UPON THE INWARDS] — These apparently redundant words are intended to include in the command the fat also that lies upon the maw. This is the opinion of Rabbi Ishmael; Rabbi Akiba holds that they are intended to include only the fat that is on the gut (Sifra, Vayikra Dibbura d'Nedavah, Section 14 6; cf. Chullin 49b)."}, {"ch": 3, "v": 4, "aliyah": 4, "heb": "וְאֵת֙ שְׁתֵּ֣י הַכְּלָיֹ֔ת וְאֶת־הַחֵ֙לֶב֙ אֲשֶׁ֣ר עֲלֵהֶ֔ן אֲשֶׁ֖ר עַל־הַכְּסָלִ֑ים וְאֶת־הַיֹּתֶ֙רֶת֙ עַל־הַכָּבֵ֔ד עַל־הַכְּלָי֖וֹת יְסִירֶֽנָּה׃", "onk": "וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבָּא דִי עֲלֵיהֶן דִּי עַל גִּסְסַיָּא וְיָת חַצְרָא דְּעַל כַּבְדָא עַל כָּלְיֵתָא יַעֲדִּנָּהּ:", "onk_en": "The two kidneys and the fat on them that are on the flanks. The lobe on the liver, he shall remove together with the kidneys.", "pj": "וְיַת תַּרְתֵּין כּוּלְיַין וְיַת תַּרְבָּא דְעָלֵיהוֹן דְעַל כַּפְלֵי וְיַת חַצְרָא דְעַל כַּבְדָא דְעַל כּוּלְיָתָא יַעֲדִינָהּ", "pj_en": "And the two kidneys, and the fat which is upon them, that is, upon the folding and the caul that is upon the liver with the kidneys, he shall remove.", "tj": "", "tj_en": "", "rashi": "<b>הכסלים.<\/b> פלנק\"ש בְּלַעַז; שֶׁהַחֵלֶב שֶׁעַל הַכְּלָיוֹת כְּשֶׁהַבְּהֵמָה חַיָּה הוּא בְּגֹבַהּ הַכְּסָלִים מִלְּמַטָּה, וְזֶה הַחֵלֶב שֶׁתַּחַת הַמָּתְנַיִם — שֶׁקּוֹרִין בְּלַעַז לונבי\"לוש — לֹבֶן הַנִּרְאֶה לְמַעְלָה בְּגֹבַהּ הַכְּסָלִים, וּבְתַחְתִּיתוֹ הַבָּשָֹר חוֹפֵהוּ:<br><br><b>היתרת.<\/b> הוּא דֹּפֶן הַמָּסָךְ שֶׁקּוֹרִין איברי\"ש, וּבְלָשׁוֹן אֲרַמִּי חִצְרָא דְּכַבְדָּא:<br><br><b>על הכבד.<\/b> שֶׁיִּטֹּל מִן הַכָּבֵד עִמָּהּ מְעַט, וּבְמָקוֹם אַחֵר הוּא אוֹמֵר וְאֶת הַיֹּתֶרֶת מִן הַכָּבֵד (ויקרא ט'):<br><br><b>על הכבד על הכליות.<\/b> לְבַד מִן הַכָּבֵד וּלְבַד מִן הַכְּלָיוֹת יְסִירֶנָּה לְזוֹ:", "rashi_en": "הכסלים — Flancs in O. F. — It speaks of the fat which is on (על) the kidneys being also on (על) the flanks because the fat that is upon the kidneys is, when the animal is living, on the uppermost part of the flanks, and they (the kidneys) are in a downward position. This is the fat which is under the loins — what are called lombles in O. F.; it is that white fat which is visible upon the upper part of the flanks, but on their lower part the flesh covers it, (and this latter portion of the fat is therefore not upon but under the flanks).<br><br>היותרת is the protecting wall (membrane) over the liver which is called abris in O. F. In the Aramaic language it is called חצרא דכבדא the lobe of the liver.<br><br>על הכבד — This must mean that he shall take a little of the liver with it, for in another place it distinctly states, (Leviticus 9:10) “and the יותרת מן הכבד [he caused to ascend in fumes]” (Sifra, Vayikra Dibbura d'Nedavah, Section 14 8).<br><br>על הכבד על הכליות — means, besides the part of the liver and besides the kidneys shall he remove this (the יותרת‎)."}, {"ch": 3, "v": 5, "aliyah": 4, "heb": "וְהִקְטִ֨ירוּ אֹת֤וֹ בְנֵֽי־אַהֲרֹן֙ הַמִּזְבֵּ֔חָה עַל־הָ֣עֹלָ֔ה אֲשֶׁ֥ר עַל־הָעֵצִ֖ים אֲשֶׁ֣ר עַל־הָאֵ֑שׁ אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַֽיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַסְקוּן יָתֵיהּ בְּנֵי אַהֲרֹן לְמַדְבְּחָא עַל עֲלָתָא דִּי עַל אָעַיָּא דִּי עַל אֶשָּׁתָא <b>קֻרְבַּן דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "The sons of Aharon shall burn it on the altar along with the burnt-offering that is on the logs which are on the fire; a fire-offering of pleasing fragrance to [<b>an offering which is accepted with favor before<\/b>] Adonoy.", "pj": "וְיִסְקוּן יָתֵיהּ בְּנֵי אַהֲרן לְמַדְבְּחָא עַל עֲלָתָא דְעַל קֵיסִין דְעַל אֵישָׁתָא קָרְבַּן דְמִתְקַבֵּיל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "And the sons of Aharon shall offer it on the altar with the sacrifice that is on the wood which is upon the fire, an oblation to be received with favour before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>על העלה.<\/b> מִלְּבַד הָעוֹלָה; לִמְּדָנוּ שֶׁתִּקְדֹּם עוֹלַת תָּמִיד לְכָל קָרְבָּן עַל הַמַּעֲרָכָה (זבחים פ\"ט):", "rashi_en": "העולה ‎‎על‎ means [HE SHALL BURN IT] BESIDES THE BURNT OFFERING. Scripture thus teaches us that the continual burnt-offering should be placed on the wood-pile before any other sacrifice (cf. Zevachim 89a; Tosafot on Zevachim 89a 1.1. כל התדיר and Rashi on Exodus 6:5)."}, {"ch": 3, "v": 6, "aliyah": 4, "heb": "וְאִם־מִן־הַצֹּ֧אן קׇרְבָּנ֛וֹ לְזֶ֥בַח שְׁלָמִ֖ים לַיהֹוָ֑ה זָכָר֙ א֣וֹ נְקֵבָ֔ה תָּמִ֖ים יַקְרִיבֶֽנּוּ׃", "onk": "וְאִם מִן עָנָא קֻרְבָּנֵיהּ לְנִכְסַת <b>קוּדְשַׁיָּא קֳדָם<\/b> יְיָ דְּכַר אוֹ נֻקְבָּא שְׁלִים יְקָרְבִנֵּיהּ:", "onk_en": "If his offering is of sheep as a peace[<b>sacred<\/b>]-offering to [<b>before<\/b>] Adonoy, he shall bring an unblemished male or female.", "pj": "וְאִין מִן עָנָא קוּרְבָּנֵיהּ לְנִכְסַת קוּדְשַׁיָא קֳדָם יְיָ דְכַר אוֹ נוּקְבָא שְׁלִים יְקַרְבִינֵיהּ", "pj_en": "And if his oblation of a consecrated offering before the Lord be from the flock, whether male or female, his oblation shall be perfect.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 7, "aliyah": 4, "heb": "אִם־כֶּ֥שֶׂב הֽוּא־מַקְרִ֖יב אֶת־קׇרְבָּנ֑וֹ וְהִקְרִ֥יב אֹת֖וֹ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "אִם אִימָר הוּא מְקָרֵב יָת קֻרְבָּנֵיהּ וִיקָרֵיב יָתֵיהּ קֳדָם יְיָ:", "onk_en": "If he is bringing a lamb as his offering, he shall bring it before Adonoy.", "pj": "אִין אִימַר הוּא מַקְרִיב יַת קוּרְבָּנֵיהּ וְיַקְרִיב יָתֵיהּ קֳדָם יְיָ", "pj_en": "If he present a lamb for his oblation, he shall bring it before the Lord;", "tj": "", "tj_en": "", "rashi": "<b>אם כשב.<\/b> לְפִי שֶׁיֵּשׁ בְּאֵמוּרֵי הַכֶּשֶׂב מַה שֶּׁאֵין בְּאֵמוּרֵי הָעֵז, שֶׁהַכֶּשֶׂב אַלְיָתוֹ קְרֵבָה, לְכָךְ נֶחְלְקוּ לִשְׁתֵּי פָּרָשִׁיּוֹת (ספרא):", "rashi_en": "אם כשב IF [HE OFFER] A LAMB — Because there is amongst the fat-portions of the lamb something which is not amongst the fat-portions of the goat, — for of the lamb the fat-tail (אליה) is offered, — therefore they (the law regarding the lamb and that regarding the goat) have been divided into two separate paragraphs (whilst in the case of the free-will עולה they are contained in one paragraph, Leviticus 1:10—13, since there is no difference in the laws regarding these two animals) (cf. Sifra, Vayikra Dibbura d'Nedavah, Chapter 18 4)."}, {"ch": 3, "v": 8, "aliyah": 4, "heb": "וְסָמַ֤ךְ אֶת־יָדוֹ֙ עַל־רֹ֣אשׁ קׇרְבָּנ֔וֹ וְשָׁחַ֣ט אֹת֔וֹ לִפְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠זָרְק֠וּ בְּנֵ֨י אַהֲרֹ֧ן אֶת־דָּמ֛וֹ עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְיִסְמוֹךְ יָת יְדֵיהּ עַל רֵישׁ קֻרְבָּנֵיהּ וְיִכּוֹס יָתֵיהּ קֳדָם מַשְׁכַּן זִמְנָא וְיִזְרְקוּן בְּנֵי אַהֲרֹן יָת דְּמֵיהּ עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He shall lay his hand on the head of his offering and slaughter it at the entrance of the Tent of Meeting. The sons of Aharon, the <i>kohanim<\/i> will sprinkle its blood all around the altar.", "pj": "וְיִסְמוֹךְ בְּתוּקְפָא יַד יְמִינֵיהּ עַל רֵישׁ קוּרְבָּנֵיהּ וְיִכּוֹס יָתֵיהּ טַבְּחָא קֳדָם מַשְׁכַּן זִימְנָא וְיִדְרְקוּן בְּנֵי אַהֲרן יַת אַדְמֵיהּ עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "and lay his right hand firmly on the head of his oblation, and the slayer shall kill it before the tabernacle of ordinance, and the sons of Aharon shall sprinkle its blood upon the altar round about.", "tj": "", "tj_en": "", "rashi": "<b>וזרקו.<\/b> שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע; וְעַל יְדֵי הַכְּלִי הוּא זוֹרֵק, וְאֵינוֹ נוֹתֵן בָּאֶצְבַּע אֶלָּא חַטָּאת (זבחים נ\"ה):", "rashi_en": "וזרקו AND [AARON'S SONS] SHALL DASH THE BLOOD THEREOF [ROUND ABOUT] — two applications of the blood are necessary so as to constitute four (cf. Rashi on Leviticus 1:5). He (the priest) dashes the blood with a vessel (Zevachim 55a); it is only the blood of the sin-offering that he applies with his finger (Zevachim 53a)."}, {"ch": 3, "v": 9, "aliyah": 4, "heb": "וְהִקְרִ֨יב מִזֶּ֣בַח הַשְּׁלָמִים֮ אִשֶּׁ֣ה לַיהֹוָה֒ חֶלְבּוֹ֙ הָאַלְיָ֣ה תְמִימָ֔ה לְעֻמַּ֥ת הֶעָצֶ֖ה יְסִירֶ֑נָּה וְאֶת־הַחֵ֙לֶב֙ הַֽמְכַסֶּ֣ה אֶת־הַקֶּ֔רֶב וְאֵת֙ כׇּל־הַחֵ֔לֶב אֲשֶׁ֖ר עַל־הַקֶּֽרֶב׃", "onk": "וִיקָרֵב מִנִּכְסַת <b>קוּדְשַׁיָּא קֻרְבָּנָא קֳדָם<\/b> יְיָ תַּרְבֵּיהּ אֲלִיתָא שְׁלִימְתָּא לָקֳבֵל שְׁזַרְתָּא יֶעְדִנַּהּ וְיָת תַּרְְבָּא דְּחָפֵי יָת גַּוָּא וְיָת כָּל תַּרְבָּא דִּי עַל גַּוָּא:", "onk_en": "He shall bring of the peace[<b>sacred<\/b>]-offering as a fire-offering to [<b>an offering before<\/b>] Adonoy, its fat; the entire tail; he shall remove it right near the back-bone. The fat covering the innards, and all the fat on the innards.", "pj": "וְיַקְרֵב מִנִכְסַת קוּדְשַׁיָא קָרְבָּנָא קֳדָם יְיָ טוּב שׁוּמְנֵיהּ אֱלִיתָא שְׁלִימְתָּא כָּל קְבֵיל דְקִיתָא יַעֲבֵיד יָתֵיהּ וְיַת פְרֵיסוּתָא דְתַרְבָּא דְחָפֵי יַת כְּרֵיסָא וְיַת כָּל תַּרְבָּא דְעַל כְּרֵיסָא", "pj_en": "And of the offering of his consecrated oblation he shall offer the best of its fat,, and remove the whole of the tail, close to the spine, the covering of fat which covereth the inwards, even all the fat that is upon the inwards.", "tj": "תַּרְבָּא וּנְיָעָא שְׁלֵימָה לֳקָבֵיל עֵיצַיָא יַעֲבֵיד יָתֵיהּ וְיַת תְּרַב דַּחֲפֵי עַל כְּרֵיסָא:", "tj_en": "And the fat and the entire breast to the chine he shall remove, and the fat which covereth the inwards.", "rashi": "<b>חלבו.<\/b> הַמֻּבְחָר שֶׁבּוֹ, וּמַהוּ? זֶה הָאַלְיָה תְּמִימָה:<br><br><b>לעמת העצה.<\/b> לְמַעְלָה מִן הַכְּלָיוֹת הַיּוֹעֲצוֹת:", "rashi_en": "חלבו means: the choicest part in it; and what is this? The whole fat-tail.<br><br>לעמת הָעֶצָה — i. e. above the kidneys which give counsel (עֵצָה) (cf. Rashi on Exodus 29:22 and Note thereon)."}, {"ch": 3, "v": 10, "aliyah": 4, "heb": "וְאֵת֙ שְׁתֵּ֣י הַכְּלָיֹ֔ת וְאֶת־הַחֵ֙לֶב֙ אֲשֶׁ֣ר עֲלֵהֶ֔ן אֲשֶׁ֖ר עַל־הַכְּסָלִ֑ים וְאֶת־הַיֹּתֶ֙רֶת֙ עַל־הַכָּבֵ֔ד עַל־הַכְּלָיֹ֖ת יְסִירֶֽנָּה׃", "onk": "וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבָּא דִּי עֲלֵיהֶן דִּי עַל גִּסְסַיָּא וְיָת חַצְרָא דְּעַל כַּבְדָּא עַל כָּלְיֵתָא יֶעְדִּנַּהּ:", "onk_en": "The two kidneys and the fat on them that are on the flanks. The lobe on the liver he shall remove together with the kidneys.", "pj": "וְיַת תַּרְתֵּין כּוּלְיַין וְיַת תַּרְבָּא דַעֲלֵיהוֹן דְעַל כַּפְלֵי וְיַת חַצְרָא דְעַל כַּבְדָא עַל כּוּלְיָיתָא יַעֲדִינָהּ", "pj_en": "And the two kidneys and the fat which is upon them, upon the foldings, and the caul that is over the liver, together with the kidneys, he shall take away.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 11, "aliyah": 4, "heb": "וְהִקְטִיר֥וֹ הַכֹּהֵ֖ן הַמִּזְבֵּ֑חָה לֶ֥חֶם אִשֶּׁ֖ה לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַסְּקִנֵּיהּ כַּהֲנָא לְמַדְבְּחָא לְחֵם <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "The <i>kohein<\/i> shall burn it on the altar; it is the food of the fire-offering of [<b>offering before<\/b>] Adonoy.", "pj": "וְיַסְקִינֵיהּ כַּהֲנָא לְמַדְבְּחָא לְחֵם קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "And the priest shall sacrifice it at the altar, the meat of an oblation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לחם אשה לה'.<\/b> לַחְמוֹ שֶׁל אֵשׁ לְשֵׁם גָּבוֹהַּ:<br><br><b>לחם.<\/b> לְשׁוֹן מַאֲכָל, וְכֵן נַשְׁחִיתָה עֵץ בְּלַחְמוֹ (ירמיהו י\"א), עֲבַד לְחֶם רַב (דניאל ה'), לִשְֹחוֹק עֹשִֹׁים לֶחֶם (קהלת י'):", "rashi_en": "'לחם אשה לה‎ means: it is the food of the fire in honour of the Lord. (The translation is not: it is food, a fire offering unto the Lord; לחם is construct, and the words must be translated as Rashi does). <br><br>לחם is a general expression for food. Similar is, (Jeremiah 11:19) “let us destroy the tree with the fruit thereof (בלחמו)”; (Daniel 5:1) “[Belshazzar] made a great banquet (לחם)”; (Ecclesiastes 10:19) “It is for laughter that a banquet (לחם) is made”."}, {"ch": 3, "v": 12, "aliyah": 4, "heb": "וְאִ֥ם עֵ֖ז קׇרְבָּנ֑וֹ וְהִקְרִיב֖וֹ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְאִם מִן בְּנֵי עִזַּיָּא קֻרְבָּנֵיהּ וִיקָרְבִנֵּיהּ קֳדָם יְיָ:", "onk_en": "If his offering is a goat, he shall bring it before Adonoy.", "pj": "וְאִין מִן בְּנֵי עִיזָא קוּרְבָּנֵיהּ וְיַקְרִיבִינֵיהּ קֳדָם יְיָ", "pj_en": "And if his oblation be from the young goats, he shall bring it before the Lord,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 13, "aliyah": 4, "heb": "וְסָמַ֤ךְ אֶת־יָדוֹ֙ עַל־רֹאשׁ֔וֹ וְשָׁחַ֣ט אֹת֔וֹ לִפְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ֠זָרְק֠וּ בְּנֵ֨י אַהֲרֹ֧ן אֶת־דָּמ֛וֹ עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְיִסְמוֹךְ יָת יְדֵיהּ עַל רֵישֵׁיהּ וְיִכּוֹס יָתֵיהּ קֳדָם מַשְׁכַּן זִמְנָא וְיִזְרְקוּן בְּנֵי אַהֲרֹן יָת דְּמֵיהּ עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He shall lay his hand on its head and slaughter it in front of the Tent of Meeting. The sons of Aharon will sprinkle its blood all around the altar.", "pj": "וְיִסְמוֹךְ יַד יְמִינֵיהּ עַל רֵישֵׁיהּ וְיִכּוֹס יָתֵיהּ טַבְּחָא קֳדָם מַשְׁכַּן זִמְנָא וְיִדְרְקוּן בְּנֵי אַהֲרן יַת אַדְמֵיהּ עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "and lay his right hand upon its head, and the slayer shall kill it before the tabernacle of ordinance, and the sons of Aharon shall sprinkle its, blood upon the altar round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 14, "aliyah": 4, "heb": "וְהִקְרִ֤יב מִמֶּ֙נּוּ֙ קׇרְבָּנ֔וֹ אִשֶּׁ֖ה לַֽיהֹוָ֑ה אֶת־הַחֵ֙לֶב֙ הַֽמְכַסֶּ֣ה אֶת־הַקֶּ֔רֶב וְאֵת֙ כׇּל־הַחֵ֔לֶב אֲשֶׁ֖ר עַל־הַקֶּֽרֶב׃", "onk": "וִיקָרֵב מִנֵּיהּ קֻרְבָּנֵיהּ <b>קֻרְבָּן קֳדָם<\/b> יְיָ יָת תַּרְבָּא דְּחָפֵי יָת גַּוָּא וְיָת כָּל תַּרְבָּא דִּי עַל גַּוָּא:", "onk_en": "He shall bring from his offering as a fire-offering to [<b>an offering before<\/b>] Adonoy, the fat covering the innards, and all the fat on the innards,", "pj": "וִיקָרֵיב מִינֵיהּ קוּרְבָּנֵיהּ קוּרְבָּנָא קֳדָם יְיָ יַת פְּרֵיסוּתָא דְתַרְבָּא דְחָפֵי יַת כְּרֵיסָא וְיַת כָּל תַּרְבָּא דְעַל כְּרֵיסָא", "pj_en": "And of his oblation before the Lord he shall offer the covering of fat which covereth the inwards, even all the fat that is upon the inwards.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 15, "aliyah": 4, "heb": "וְאֵת֙ שְׁתֵּ֣י הַכְּלָיֹ֔ת וְאֶת־הַחֵ֙לֶב֙ אֲשֶׁ֣ר עֲלֵהֶ֔ן אֲשֶׁ֖ר עַל־הַכְּסָלִ֑ים וְאֶת־הַיֹּתֶ֙רֶת֙ עַל־הַכָּבֵ֔ד עַל־הַכְּלָיֹ֖ת יְסִירֶֽנָּה׃", "onk": "וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבָּא דִּי עֲלֵיהֶן דִּי עַל גִּסְסַיָּא וְיָת חַצְרָא דִּי עַל כַּבְדָא עַל כָּלְיֵתָא יֶעְדִּנַּהּ:", "onk_en": "the two kidneys and the fat on them that are on the flanks. The lobe on the liver he shall remove together with the kidneys.", "pj": "וְיַת תַּרְתֵּין כּוּלְיַין וְיַת תַּרְבָּא דַעֲלֵיהוֹן דְעַל כַּפְלֵי וְיַת חַצְרָא דְעַל כַּבְדָא דְעַל כּוּלְיְיתָא יַעֲדִינָהּ", "pj_en": "And the two kidneys and the fat which is upon them (and) on the foldings, and the caul which is over the liver, along with the kidneys, he shall take away.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 16, "aliyah": 4, "heb": "וְהִקְטִירָ֥ם הַכֹּהֵ֖ן הַמִּזְבֵּ֑חָה לֶ֤חֶם אִשֶּׁה֙ לְרֵ֣יחַ נִיחֹ֔חַ כׇּל־חֵ֖לֶב לַיהֹוָֽה׃", "onk": "וְיַסְּקִנּוּן כַּהֲנָא לְמַדְבְּחָא לְחֵם <b>קֻרְבָּנָא לְאִתְקַבָּלָא בְרַעֲוָא<\/b> כָּל תַּרְבָּא <b>קֳדָם<\/b> יְיָ:", "onk_en": "He shall burn them on the altar, the food of the fire-offering for a pleasing fragrance [<b>offering to be accepted with favor<\/b>]; all fat [belongs] to [<b>before<\/b>] Adonoy.", "pj": "וְיַסְקִינוּן כַּהֲנָא לְמַדְבְּחָא לְחֵם קוּרְבָּנָא לְאִתְקַבָּלָא בְּרַעֲוָא כָּל תְּרֵיב קֳדָם יְיָ", "pj_en": "And the priest shall sacrifice them at the altar, the meat of an oblation to be received with favour. All the fat (shall be offered) before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 17, "aliyah": 4, "heb": "חֻקַּ֤ת עוֹלָם֙ לְדֹרֹ֣תֵיכֶ֔ם בְּכֹ֖ל מוֹשְׁבֹֽתֵיכֶ֑ם כׇּל־חֵ֥לֶב וְכׇל־דָּ֖ם לֹ֥א תֹאכֵֽלוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "קְיָם עָלָם לְדָרָתֵיכוֹן בְּכֹל מוֹתְבָנֵיכוֹן כָּל תַּרְבָּא וְכָל דְּמָא לָא תֵיכְלוּן:", "onk_en": "As an everlasting statute for all your descendants in all of your dwelling places; you may not eat any fat, nor any blood.", "pj": "קְיַם עֲלָם לְדָרֵיכוֹן בְּכָל מוֹתְבָנֵיכוֹן כָּל תְּרֵיב וְכָל אֲדַם לָא תֵיכְלוּן עַל גַבֵּי מַדְבְּחָא יִתְקְרֵיב לִשְׁמָא דַיְיָ", "pj_en": "It is an everlasting statute unto all your generations, that neither the fat nor the blood shall be eaten in any of your dwellings, but upon the back of the altar it shall be sacrificed unto the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>חקת עולם.<\/b> יָפֶה מְפֹרָשׁ בְּתוֹרַת כֹּהֲנִים כָּל הַפָּסוּק הַזֶּה:", "rashi_en": "חקת עולם This whole verse is well expounded in Torath Cohanim (Sifra, Vayikra Dibbura d'Nedavah, Chapter 20 6-8)."}, {"ch": 4, "v": 1, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 2, "aliyah": 5, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֣י יִשְׂרָאֵל֮ לֵאמֹר֒ נֶ֗פֶשׁ כִּֽי־תֶחֱטָ֤א בִשְׁגָגָה֙ מִכֹּל֙ מִצְוֺ֣ת יְהֹוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְעָשָׂ֕ה מֵאַחַ֖ת מֵהֵֽנָּה׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל לְמֵימָר אֱנַשׁ אֲרֵי יֵחוֹב בְּשָׁלוּ מִכָּל פִּקּוּדַיָּא דַיְיָ דִּי לָא <b>כַשְׁרִין<\/b> לְאִתְעֲבָדָא וְיַעְבֵּד מִן חַד מִנְּהוֹן:", "onk_en": "Speak to Bnei Yisroel, saying; if a person unwittingly transgresses any commandment of Adonoy which should [<b>is<\/b>] not [<b>fitting to<\/b>] be done and commits one of these sins.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל לְמֵימַר בַּר נַשׁ אֲרוּם יֵיחוֹב בְּשָׁלוּ מִכָּל פִּקוּדַיָא דַיְיָ דְלָא כַשְׁרִין לְאִתְעֲבָדָא וְיַעֲבֵד מִן חַד מִנְהוֹן", "pj_en": "Speak with the sons of Israel, saying: When a man hath sinned inadvertently against any of the commandments of the Lord (in doing) what ought not to be done, and he hath done it against any one of them:", "tj": "", "tj_en": "", "rashi": "<b>מכל מצות ה'.<\/b> פֵּרְשׁוּ רַבּוֹתֵינוּ אֵין חַטָּאת בָּאָה אֶלָּא עַל דָּבָר שֶׁזְּדוֹנוֹ לָאו וְכָרֵת (ספרא):<br><br><b>מאחת מהנה.<\/b> מִמִּקְּצָת אַחַת מֵהֶן, כְּגוֹן הַכּוֹתֵב בְּשַׁבָּת שם מִשִּׁמְעוֹן, נח מִנָּחוֹר, דן מִדָּנִיֵּאל (שם):", "rashi_en": "'מכל מצות ה [IF A SOUL SIN IN ERROR] AGAINST ANY OF THE COMMANDMENTS OF THE LORD — Our Rabbis explained (Sifra, Vayikra Dibbura d'Chovah, Section 7; Shabbat 69a) that a sin-offering (of which this chapter speaks) is brought only for such a thing the wilful committal of which is forbidden by a לאו (a negative command) and is subject to the penalty of excision).<br><br>מאחת מהנה — The prefix in מאחת, being the partitive מ, suggests: even if one infringes only a part of one of them. as, for instance, if one writes on Sabbath the two letters שם of the name שמעון having intended to write the whole word, or the letters נח of the word נחור, or דן of  דניאל (Sifra, Vayikra Dibbura d'Chovah, Chapter 1 4; Shabbat 103b)."}, {"ch": 4, "v": 3, "aliyah": 5, "heb": "אִ֣ם הַכֹּהֵ֧ן הַמָּשִׁ֛יחַ יֶחֱטָ֖א לְאַשְׁמַ֣ת הָעָ֑ם וְהִקְרִ֡יב עַ֣ל חַטָּאתוֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן־בָּקָ֥ר תָּמִ֛ים לַיהֹוָ֖ה לְחַטָּֽאת׃", "onk": "אִם כַּהֲנָא <b>רַבָּא<\/b> יֵחוֹב לְחוֹבַת עַמָּא וִיקָרֵב עַל חוֹבְתֵיהּ דִּי חָב תּוֹר בַּר תּוֹרֵי שְׁלִים <b>קֳדָם<\/b> יְיָ לְחַטָּאתָא:", "onk_en": "If the anointed <i>kohein<\/i> [<b>gadol<\/b>] should sin to bring guilt on the people, he shall bring for his sin which he committed a young, unblemished bullock to [<b>before<\/b>] Adonoy, as a sin-offering.", "pj": "אִין כַּהֲנָא רַבָּא דְמִתְרַבֵּי בְּמִשְׁחָא יֵיחוּב בְּמִקְרְבֵיהּ קָרְבַּן חוֹבַת עַמָא דְלָא כְּהִילְכְתֵיהּ וְיִקְרַב בְּגִין חוֹבְתֵיהּ תּוֹר בַּר תּוֹרֵי שְׁלִים קֳדָם יְיָ לְחַטָאתָא", "pj_en": "if the high priest who is consecrated with oil hath sinned,-as when he hath offered a sin offering for the people not according to the rite, he shall bring for his sin a young bullock unblemished before the Lord for a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>אם הכהן המשיח יחטא לאשמת העם.<\/b> מִדְרָשׁוֹ: אֵינוֹ חַיָּב אֶלָּא בְּהֶעְלֵם דָּבָר עִם שִׁגְגַת מַעֲשֶֹה, כְּמוֹ שֶׁנֶּאֱמַר לְאַשְׁמַת הָעָם וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל וְעָשׂוּ (שם); וּפְשׁוּטוֹ לְפִי אַגָּדָה: כְּשֶׁכֹּהֵן גָּדוֹל חוֹטֵא, אַשְׁמַת הָעָם הוּא זֶה, שֶׁהֵן תְּלוּיִין בּוֹ לְכַפֵּר עֲלֵיהֶם וּלְהִתְפַּלֵּל בַּעֲדָם, וְנַעֲשֶׂה מְקֻלְקָל:<br><br><b>פר.<\/b> יָכוֹל זָקֵן, תַּלְמוּד לוֹמַר בֶּן, אִי בֶּן יָכוֹל קָטָן, תַּלְמוּד לוֹמַר פַּר, הָא כֵּיצַד? זֶה פַּר בֶּן שָׁלוֹשׁ (שם):", "rashi_en": "אם הכהן המשיח יחטא לאשמת העם IF THE PRIEST THAT IS ANOINTED DO SIN לאשמת העם — The Halachic explanation is that he is liable to bring a sin-offering only when there was ignorance of the real matter (of the law in question; i. e. after having considered the case in question he came to a wrong decision) together with a mistaken action (i. e. where he erred in a Halachic decision and as a result of this error acted against the true law), just as it is stated with reference to the guilt of the whole people): (v. 13) “[And if the whole congregation of Israel err] and the thing be hid from the eyes of the assembly and they have done [somewhat against the commandments of the Lord]\" (Sifra, Vayikra Dibbura d'Chovah, Chapter 2 1; Horayot 7a; Rashi on v. 13). Its literal sense is according to the Agadic explanation: When the High-priest sins this is the guilt of the people (i. e. it results in the people remaining under a load of guilt), because they are dependent on him to effect atonement for them and to pray on their behalf, and now he himself has become degenerate and can thus not expiate for them, wherefor they remain under guilt.<br><br>פר A BULLOCK — One might think that it may be an old one! Scripture, however, adds בן, a young animal. If, then, it must be בן, a young one, I might think a very young animal is fitted too (this being also implied in the term בן)! Scripture, however, states פר! How is this to be reconciled? By explaining פר בן  בקר to be a bullock of three years (which is neither too old nor too young) (Sifra, Vayikra Dibbura d'Chovah, Chapter 3 1; cf. Rashi on Leviticus 9:7 and Note thereon)."}, {"ch": 4, "v": 4, "aliyah": 5, "heb": "וְהֵבִ֣יא אֶת־הַפָּ֗ר אֶל־פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִפְנֵ֣י יְהֹוָ֑ה וְסָמַ֤ךְ אֶת־יָדוֹ֙ עַל־רֹ֣אשׁ הַפָּ֔ר וְשָׁחַ֥ט אֶת־הַפָּ֖ר לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְיַיְתִי יָת תּוֹרָא לִתְרַע מַשְׁכַּן זִמְנָא לָקֳדָם יְיָ וְיִסְמוֹךְ יָת יְדֵיהּ עַל רֵישׁ תּוֹרָא וְיִכּוֹס יָת תּוֹרָא קָדֳם יְיָ:", "onk_en": "He shall bring the bullock to the entrance of the Tent of Meeting before Adonoy. He shall lay his hand on the head of the bullock and slaughter the bullock before Adonoy.", "pj": "וְיֵיעוֹל יַת תּוֹרָא לִתְרַע מַשְׁכַּן זִימְנָא לִקֳדָם יְיָ וְיִסְמוֹךְ יַד יְמִינֵיהּ עַל רֵישׁ תּוֹרָא וְיִכּוֹס טַבְּחָא יַת תּוֹרָא קֳדָם יְיָ", "pj_en": "He shall bring in the bullock to the gate of the tabernacle of ordinance, to the presence of the Lord, and lay his right hand upon the head of the bullock, and the slayer shall kill the bullock before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 5, "aliyah": 5, "heb": "וְלָקַ֛ח הַכֹּהֵ֥ן הַמָּשִׁ֖יחַ מִדַּ֣ם הַפָּ֑ר וְהֵבִ֥יא אֹת֖וֹ אֶל־אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיִסַּב כַּהֲנָא <b>רַבָּא<\/b> מִדְּמָא דְתוֹרָא וְיָעֵל יָתֵיהּ לְמַשְׁכַּן זִמְנָא:", "onk_en": "The anointed <i>kohein<\/i> [<b>gadol<\/b>] shall take some of the bullocks blood and bring it inside the Tent of Meeting.", "pj": "וְיִסַב כַּהֲנָא רַבָּא דְמִתְרַבֵּי בְּמִשְׁחָא מִדְמָא דְתוֹרָא וִיהַנְעַל יָתֵיהּ לְמַשְׁכַּן זִמְנָא", "pj_en": "And the high priest who is anointed with oil shall take of the blood of the bullock, and carry it into the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "<b>אל אהל מועד.<\/b> לַמִּשְׁכָּן, וּבְבֵית עוֹלָמִים לַהֵיכָל:", "rashi_en": "אל אהל מועד‎  [AND THE PRIEST … SHALL BRING IT] TO THE APPOINTED TENT — to the Tabernacle — and, later, in the House of Eternity (the Temple at Jerusalem), into the Heichal (cf. Rashi on Exodus 29:43)."}, {"ch": 4, "v": 6, "aliyah": 5, "heb": "וְטָבַ֧ל הַכֹּהֵ֛ן אֶת־אֶצְבָּע֖וֹ בַּדָּ֑ם וְהִזָּ֨ה מִן־הַדָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִפְנֵ֣י יְהֹוָ֔ה אֶת־פְּנֵ֖י פָּרֹ֥כֶת הַקֹּֽדֶשׁ׃", "onk": "וְיִטְבּוֹל כַּהֲנָא יָת אֶצְבְּעֵיהּ בִּדְמָא וְיַדִּי מִן דְּמָא שְׁבַע זִמְנִין קֳדָם יְיָ קֳדָם פָּרוּכְתָּא דְקוּדְשָׁא:", "onk_en": "The <i>kohein<\/i> shall dip his finger into the blood and he shall sprinkle from the blood seven times, before Adonoy, in front of the Holy Curtain.", "pj": "וִיטַמַשׁ כַּהֲנָא יַת אִצְבְּעֵיהּ בְּאַדְמָא וְיַדֵי מִן אַדְמָא שְׁבַע זִמְנִין קֳדָם יְיָ קְבֵיל פַּרְגוֹדָא דְקוּדְשָׁא", "pj_en": "and the priest shall dip his fingers in the blood, and sprinkle the blood seven times in the presence of the Lord before the veil of the sanctuary.", "tj": "וְיִצְבּוֹעַ כַּהֲנָא אֶצְבָּעֵיהּ מִן אִידְמָא וִיֲדֵי שׁוּבְעָא זִמְנִין:", "tj_en": "And the priest shall dip his fingers, and sprinkle some of the blood seven times.", "rashi": "<b>את פני פרכת הקדש.<\/b> כְּנֶגֶד מְקוֹם קְדֻשָּׁתָהּ — מְכֻוָּן כְּנֶגֶד בֵּין הַבַּדִּים, וְלֹא הָיוּ נוֹגְעִים דָּמִים בַּפָּרֹכֶת, וְאִם נָגְעוּ נָגְעוּ:", "rashi_en": "את פני פרכת הקדש [AND THE PRIEST SHALL … SPRINKLE OF THE BLOOD …] BEFORE THE PARTITION VAIL OF THE קדש — i.e. before that spot where it is exceedingly holy — exactly in front of the space between the staves of the Ark (Sifra, Vayikra Dibbura d'Chovah, Section 3 10). The blood did not touch the Partition Vail (since he was standing some distance off), but if it happened to touch it, then it touched it, (and it did not invalidate the ceremony) (Yoma 57a)."}, {"ch": 4, "v": 7, "aliyah": 5, "heb": "וְנָתַן֩ הַכֹּהֵ֨ן מִן־הַדָּ֜ם עַל־קַ֠רְנ֠וֹת מִזְבַּ֨ח קְטֹ֤רֶת הַסַּמִּים֙ לִפְנֵ֣י יְהֹוָ֔ה אֲשֶׁ֖ר בְּאֹ֣הֶל מוֹעֵ֑ד וְאֵ֣ת&thinsp;<b>׀<\/b> כׇּל־דַּ֣ם הַפָּ֗ר יִשְׁפֹּךְ֙ אֶל־יְסוֹד֙ מִזְבַּ֣ח הָעֹלָ֔ה אֲשֶׁר־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיִתֵּן כַּהֲנָא מִן דְּמָא עַל קַרְנַת מַדְבַּח דִקְטוֹרֶת בּוּסְמַיָא קֳדָם יְיָ דִּי בְּמַשְׁכַּן זִמְנָא וְיָת כָּל דְּמָא דְתוֹרָא יֵשׁוּד לִיסוֹדָא דְּמַדְבְּחָא דַעֲלָתָא דִּי בִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "The <i>kohein<\/i> shall put from the blood atop the corners of the spice-burning altar before Adonoy, which is inside the Tent of Meeting. He shall spill all the [remaining] bullocks blood into the base of the altar of the burnt-offering, which is at the entrance of the Tent of Meeting.", "pj": "וְיִתֵּן כַּהֲנָא מִן אַדְמָא עַל קַרְנַת מַדְבְּחָא דִקְטוֹרֶת בּוּסְמַיָא דִקְדָם יְיָ דִבְּמַשְׁכַּן זִמְנָא וְיַת כָּל אַדְמָא דְתוֹרָא יֵישׁוֹד לִיסוֹדָא דְמַדְבְּחָא דְעָלָתָא דְבִתְרַע מַשְׁכַּן זִימְנָא", "pj_en": "And the priest shall put some of the blood upon the horns of the altar of sweet incense that is before the Lord in the tabernacle of ordinance, and all the rest of the blood of the bullock he shall pour out at the foundation of the altar of burnt sacrifice which is at the gate of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>ואת כל דם.<\/b> שְׁיָרֵי הַדָּם (זבחים כ\"ה):", "rashi_en": "ואת כל דם AND ALL THE BLOOD — i. e. all the remainder of the blood (since part of it had already been sprinkled) (Zevachim 25a)."}, {"ch": 4, "v": 8, "aliyah": 5, "heb": "וְאֶת־כׇּל־חֵ֛לֶב פַּ֥ר הַֽחַטָּ֖את יָרִ֣ים מִמֶּ֑נּוּ אֶת־הַחֵ֙לֶב֙ הַֽמְכַסֶּ֣ה עַל־הַקֶּ֔רֶב וְאֵת֙ כׇּל־הַחֵ֔לֶב אֲשֶׁ֖ר עַל־הַקֶּֽרֶב׃", "onk": "וְיָת כָּל תְּרַב תּוֹרָא דְחַטָּאתָא יַפְרֵשׁ מִנֵּיהּ יָת תַּרְבָּא דְּחָפֵי עַל גַּוָּא וְיָת כָּל תַּרְבָּא דִּי עַל גַּוָּא:", "onk_en": "All the fat of the sin-offering bullock he shall separate from it; the fat covering the innards, all the fat on the innards,", "pj": "וְיַת כָּל תְּרֵיב תּוֹרָא דְחַטָאתָא יַפְרֵישׁ מִנֵיהּ יַת פְּרִיסוּתָא דְתַרְבָּא דְחָפֵי יַת כְּרֵיסָא וְיַת כָּל תַּרְבָּא דְעַל כְּרֵיסָא", "pj_en": "And all the fat of the bullock of the sin offering he shall separate from him, the covering of fat which covereth the inwards, even all the fat which is upon the inwards.", "tj": "", "tj_en": "", "rashi": "<b>ואת כל חלב פר.<\/b> חֶלְבּוֹ הָיָה לוֹ לוֹמַר, מַה תַּלְמוּד לוֹמַר פַּר? לְרַבּוֹת פַּר שֶׁל יוֹם הַכִּפּוּרִים לִכְלָיוֹת וְלַחֲלָבִים וְיוֹתֶרֶת (ספרא):<br><br><b>החטאת.<\/b> לְהָבִיא שְֹעִירֵי עֲ\"זָ לִכְלָיוֹת וְלַחֲלָבִים וּלְיוֹתֶרֶת (שם):<br><br><b>ירים ממנו.<\/b> מִן הַמְחֻבָּר — שֶׁלֹּא יְנַתְּחֶנּוּ קֹדֶם הֲסָרַת חֶלְבּוֹ, תּוֹרַת כֹּהֲנִים:", "rashi_en": "ואת כל חלב פר [AND HE SHALL TAKE UP …] ALL THE FAT OF THE BULLOCK — It ought to have said “its fat” (since the פר has just been mentioned); why does it state expressly “the fat of a bullock [of a sin-offering]” (i.e. any bullock brought as a sin-offering)? In order to include also the bullock of the Day of Atonement in respect to the burning of the kidneys, the fat portions and the lobe (Sifra, Vayikra Dibbura d'Chovah, Chapter 4 1).<br><br>החטאת — [THE FAT OF THE BULLOCK OF] THE SIN OFFERING (implying, the fat of the bullock because it is a sin-offering) consequently serves to include the goats brought as a sin-offering for idolatry (Numbers 15:24) in respect to the burning of the kidneys, the fat portions and the lobe of the liver (Sifra, Vayikra Dibbura d'Chovah, Chapter 4 1; cf. Note on the previous passage).<br><br>ירים ממנו AND HE SHALL TAKE FROM IT [ALL THE FAT] — from. “it”, i. e. from the bullock — consequently he must take it (the fat) whilst it is still connected with it (the animal), — that he must not dismember it before removing the fat from it. Thus is it explained in Torath Cohanim (Sifra, Vayikra Dibbura d'Chovah, Chapter 4 1)."}, {"ch": 4, "v": 9, "aliyah": 5, "heb": "וְאֵת֙ שְׁתֵּ֣י הַכְּלָיֹ֔ת וְאֶת־הַחֵ֙לֶב֙ אֲשֶׁ֣ר עֲלֵיהֶ֔ן אֲשֶׁ֖ר עַל־הַכְּסָלִ֑ים וְאֶת־הַיֹּתֶ֙רֶת֙ עַל־הַכָּבֵ֔ד עַל־הַכְּלָי֖וֹת יְסִירֶֽנָּה׃", "onk": "וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבָּא דִּי עֲלֵיהוֹן דִּי עַל גִּסְסַיָּא וְיָת חִצְרָא דְּעַל כַּבְדָא עַל כָּלְיֵתָא יֶעְדִּנַּהּ:", "onk_en": "the two kidneys and the fat on them that are on the flanks. The lobe on the liver, he shall remove together with the kidneys,", "pj": "וְיַת תַּרְתֵּין כּוּלְיַין וְיַת תַּרְבָּא דַעֲלֵיהוֹן דְעַל כַּפְלֵי וְיַת חַצְרָא דְעַל כַּבְדָא עַל כּוּלְיְיתָא יַעְדִינָהּ", "pj_en": "And the two kidneys, and the fat which is upon them, upon the folding, and the caul that is upon the liver, with the kidneys, he shall remove.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 10, "aliyah": 5, "heb": "כַּאֲשֶׁ֣ר יוּרַ֔ם מִשּׁ֖וֹר זֶ֣בַח הַשְּׁלָמִ֑ים וְהִקְטִירָם֙ הַכֹּהֵ֔ן עַ֖ל מִזְבַּ֥ח הָעֹלָֽה׃", "onk": "כְּמָא דִי מִתַּפְרַשׁ מִתּוֹר נִכְסַת <b>קוּדְשַׁיָּא<\/b> וְיַסֵּקִנּוּן כַּהֲנָא עַל מַדְבְּחָא דַעֲלָתָא:", "onk_en": "in the same manner as they were separated from the ox of the peace[<b>sacred<\/b>]-offering. The <i>kohein<\/i> shall burn them on the altar of the burnt-offering.", "pj": "הֵיכְמָא דְמִתְפְּרֵשׁ מִתּוֹר נִכְסַת קוּדְשַׁיָא הֵיכְדֵין יִתְפַּרְשׁוּן מִן אִימְרָא וּמִן עִיזָא וִיסַקְיוּ כַּהֲנָא עַל מַדְבְּחָא דְעָלָתָא", "pj_en": "As it was separated from the bullock of the consecrated sacrifice, so shall (these things) be separated from the lambs and from the goats, and the priest shall burn them upon the altar of burnt offering.", "tj": "", "tj_en": "", "rashi": "<b>כאשר יורם.<\/b> מֵאוֹתָן אֵמוּרִין הַמְפֹרָשִׁין בְּשׁוֹר זֶבַח הַשְּׁלָמִים; וְכִי מַה פֵּרֵשׁ בְּזֶבַח הַשְּׁלָמִים שֶׁלֹא פֵּרֵשׁ כָּאן? אֶלָּא לְהַקִּישׁוֹ לִשְׁלָמִים, מַה שְּׁלָמִים לִשְׁמָן אַף זֶה לִשְׁמוֹ, וּמָה שְׁלָמִים שָׁלוֹם לָעוֹלָם, אַף זֶה שָׁלוֹם לָעוֹלָם; וּבִשְׁחִיטַת קֳדָשִׁים מַצְרִיכוֹ לִלְמֹד הֵימֶנּוּ שֶׁאֵין לְמֵדִין לָמֵד מִן הַלָּמֵד בָּקֳדָשִׁים, בְּפֶרֶק אֵיזֶהוּ מְקוֹמָן (זבחים מ\"ט):<br><br><b>על הכבד על הכליות. על ראשו ועל כרעיו.<\/b> כֻּלָּן לְשׁוֹן תּוֹסֶפֶת הֵן, כְּמוֹ מִלְּבַד:", "rashi_en": "כאשר יורם AS IT WAS TAKEN [FROM THE OX OF THE SACRIFICE OF THE PEACE OFFERINGS] — i. e. from those fat portions which are specified in the case of an ox brought as a sacrifice of peace-offerings. But what is specified in the case of a sacrifice of peace-offerings that is not specified here? Nothing at all! (Cf. Leviticus 3:3—4 with here.) What then is the force of the words כאשר יורם? But they are intended to declare it analogous to the peace-offerings: What is the case with שלמים? They must be burnt as such! So, too, must this be burnt as such!) And again what is the case with שלמים? They are intended to promote peace for the world! So, too, is this intended to promote peace for the world (Sifra, Vayikra Dibbura d'Chovah, Chapter 4 2). In the Treatise on “the Slaughtering of Sacrifices” it (the passage 'כאשר יורם וכו‎) is stated to be necessary to deduce from it the rule that in the case of sacrifices we can derive no law from a law which is itself only derived from a text, and is not explicitly stated in Scripture. This is to be found in the chapter beginning with the words איזהו מקומן (Zevachim 49b).<br><br>על הכבד על הכליות. על ראשו ועל כרעיו — All these words (על) are an expression denoting an addition — they meat: as much as “besides”."}, {"ch": 4, "v": 11, "aliyah": 5, "heb": "וְאֶת־ע֤וֹר הַפָּר֙ וְאֶת־כׇּל־בְּשָׂר֔וֹ עַל־רֹאשׁ֖וֹ וְעַל־כְּרָעָ֑יו וְקִרְבּ֖וֹ וּפִרְשֽׁוֹ׃", "onk": "וְיָת מְשַׁךְ תּוֹרָא וְיָת כָּל בִּסְרֵיהּ עַל רֵישֵׁיהּ וְעַל כְּרָעוֹהִי וְגַוֵּיהּ וְאוּכְלֵיהּ:", "onk_en": "The bullocks skin, all its flesh with its head and feet, its innards and its waste [that is in its intestines].", "pj": "וְיַת כָּל מְשַׁךְ תּוֹרָא וְיַת בִּישְרֵיהּ עַל רֵישֵׁיהּ וְעַל רִיגְלוֹי וְעַל בְּנֵי גַוֵּיהּ וְרַעֲיֵהּ", "pj_en": "And all the skin of the bullock, and his flesh with his head and with his legs, and his inward parts and his dung,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 12, "aliyah": 5, "heb": "וְהוֹצִ֣יא אֶת־כׇּל־הַ֠פָּ֠ר אֶל־מִח֨וּץ לַֽמַּחֲנֶ֜ה אֶל־מָק֤וֹם טָהוֹר֙ אֶל־שֶׁ֣פֶךְ הַדֶּ֔שֶׁן וְשָׂרַ֥ף אֹת֛וֹ עַל־עֵצִ֖ים בָּאֵ֑שׁ עַל־שֶׁ֥פֶךְ הַדֶּ֖שֶׁן יִשָּׂרֵֽף׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַפֵּק יָת כָּל תּוֹרָא מִבָּרָא לְמַשְׁרִיתָא <b>לַאֲתַר<\/b> דְּכֵי לַאֲתַר בֵּית מֵישַׁד קִטְמָא וְיוֹקִיד יָתֵיהּ עַל אָעַיָּא בְּאֶשָּׁתָא <b>עַל אֲתַר<\/b> בֵּית מֵישַׁד קִטְמָא יִתּוֹקָד:", "onk_en": "He shall take out the entire bullock beyond the encampment, to a pure [undefiled] place, [<b>to the place<\/b>] where the ashes are thrown and burn it on logs, in a fire. It shall be burned [<b>at the place<\/b>] where the ashes are thrown.", "pj": "וְיִפּוֹק יַת כָּל תּוֹרָא לַאֲתַר דְכֵי לְמִבָּרָא לְמַשְׁרִיתָא לַאֲתַר בֵּית מֵישַׁד קִיטְמָא וְיוֹקֵד יָתֵיהּ עַל קִיסִין בְּנוּרָא עַל אֲתַר בֵּית מֵישַׁד קִיטְמָא יְתוֹקַד", "pj_en": "the whole of the bullock he shall carry forth into a clean place without the camp, to a place where the cinders are poured out, and shall burn him with wood in the fire, at the place where cinders are poured out shall be be burned.", "tj": "", "tj_en": "", "rashi": "<b>אל מקום טהור.<\/b> לְפִי שֶׁיֵּשׁ מִחוּץ לָעִיר מָקוֹם מוּכָן לְטֻמְאָה — לְהַשְׁלִיךְ אֲבָנִים מְנֻגָּעוֹת וּלְבֵית הַקְּבָרוֹת — הֻצְרַךְ לוֹמַר מִחוּץ לַמַּחֲנֶה זֶה — שֶׁהוּא חוּץ לָעִיר — שֶׁיְּהֵא הַמָּקוֹם טָהוֹר:<br><br><b>מחוץ למחנה.<\/b> חוּץ לְשָׁלוֹשׁ מַחֲנוֹת; וּבֵית עוֹלָמִים חוּץ לָעִיר, כְּמוֹ שֶׁפֵּרְשׁוּהוּ רַבּוֹתֵינוּ בְּמַסֶּכֶת יוֹמָא (דף ס\"ח) וּבְסַנְהֶדְרִין (דף מ\"ב):<br><br><b>אל שפך הדשן.<\/b> מָקוֹם שֶׁשּׁוֹפְכִין בּוֹ הַדֶּשֶׁן הַמְסֻלָּק מִן הַמִּזְבֵּחַ, כְּמוֹ שֶׁנֶּאֱמַר וְהוֹצִיא אֶת הַדֶּשֶׁן אֶל מִחוּץ לַמַּחֲנֶה (ויקרא ו'):<br><br><b>על שפך הדשן ישרף.<\/b> שֶׁאֵין תַּלְמוּד לוֹמַר, אֶלָּא לְלַמֵּד שֶׁאֲפִלּוּ אֵין שָׁם דֶּשֶׁן (ספרא):", "rashi_en": "אל מקום טהור [EVEN THE WHOLE BULLOCK SHALL HE BRING FORTH WITHOUT THE CAMP] UNTO A CLEAN PLACE — Because there was outside the city (Jerusalem) a place intended for depositing unclean things viz., to cast there the plague-stricken stones (cf. Leviticus 14:45) and to serve as a place of burial, Scripture was compelled to state regarding this term “without the camp” — which in the case of Jerusalem, is identical with: “without the city” — that the place where it was to be burnt shall be a clean one.<br><br>מחוץ למחנה WITHOUT THE CAMP — i. e. without the three camps (מחנה שכינה, מחנה לויה ומחנה ישראל) ; and, in the case of the “House of Eternity” (the Temple), it was to be brought forth without the city, just as our Rabbis have explained it in Treatise Yoma 68a and in Treatise Sanhedrin 42b.<br><br>אל שפך הדשן means: to the place where the ashes that were removed from the altar were cast, as it is said (Leviticus 6:4) “and he shall bring out the ashes without the camp”.<br><br>על שפך הדשן UPON THE PLACE FOR SHEDDING THE ASHES [SHALL IT BE BURNT] — This is something which need not have been stated (since it says immediately before, that it shall be brought forth to this spot), but it is intended to teach that even if at the time there happen to be no ashes there, the bullock shall nevertheless be burnt there (Sifra, Vayikra Dibbura d'Chovah, Chapter 5 5; Pesachim 75b)."}, {"ch": 4, "v": 13, "aliyah": 5, "heb": "וְאִ֨ם כׇּל־עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְנֶעְלַ֣ם דָּבָ֔ר מֵעֵינֵ֖י הַקָּהָ֑ל וְ֠עָשׂ֠וּ אַחַ֨ת מִכׇּל־מִצְוֺ֧ת יְהֹוָ֛ה אֲשֶׁ֥ר לֹא־תֵעָשֶׂ֖ינָה וְאָשֵֽׁמוּ׃", "onk": "וְאִם כָּל כְּנִשְׁתָּא דְיִשְׂרָאֵל יִשְׁתְּלוּן וִיהֵי מְכַסָּא פִתְגָּמָא מֵעֵינֵי קְהָלָא וְיַעְבְּדוּן חָד מִכָּל פִּקּוּדַיָּא דַיְיָ דִּי לָא <b>כָשְׁרִין<\/b> לְאִתְעֲבָדָא וִיחוֹבוּן:", "onk_en": "If the entire congregation of Yisroel erred and the matter [that error] was concealed from the eyes of the community, and they did [transgress] one of the commandments of Adonoy that should [<b>is<\/b>] not [<b>fitting to<\/b>] be done, they incur guilt.", "pj": "וְאִין כָּל כְּנִישְׁתָּא דְיִשְרָאֵל יִשְׁתְּלוּן וְיִתְכַּסֵי פִּתְגַם מִן מֵחְמֵי קְהָלָא וְיַעֲבְדוּן בְּשָׁלוּ מִן חַד מִן כָּל פִּקוּדַיָא דַיְיָ דְלָא כַשְׁרִין לְאִתְעֲבָדָא וְיִתְחַיְיבוּן", "pj_en": "And if the whole congregation of Israel have erred, and the thing hath been hidden from the sight of the congregation in doing inadvertently against one of the commandments of the Lord what was not right to be done, and (thus) have sinned;", "tj": "", "tj_en": "", "rashi": "<b>עדת ישראל.<\/b> אֵלּוּ סַנְהֶדְרִין (שם):<br><br><b>ונעלם דבר.<\/b> טָעוּ לְהוֹרוֹת בְּאַחַת מִכָּל כָּרֵתוֹת שֶׁבַּתּוֹרָה שֶׁהוּא מֻתָּר (הוריות ח'):<br><br><b>הקהל ועשו.<\/b> שֶׁעָשׂוּ צִבּוּר עַל פִּיהֶם:", "rashi_en": "עדת ישראל [AND IF THE WHOLE] CONGREGATION OF ISRAEL [ERR] — This is the Great Sanhedrin (Sifra, Vayikra Dibbura d'Chovah, Section 4 2; cf. Horayot 4b).<br><br>ונעלם דבר AND A THING (a matter of law) WAS HID [FROM THE EYES OF THE ASSEMBLY] — i. e. they (the Synhedrion) erred, deciding in respect to one of all those acts for which excision is, according to tradition), implicitly mentioned in the Torah that it is permissible (Horayot 8a).<br><br>הקהל ועשו — [AND THE THING BE HID FROM THE EYES OF] THE ASSEMBLY AND THEY HAVE DONE — It means that the assembly did according to their (the Sanhedrin’s) decision (cf. Horayot 2a)."}, {"ch": 4, "v": 14, "aliyah": 5, "heb": "וְנֽוֹדְעָה֙ הַֽחַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑יהָ וְהִקְרִ֨יבוּ הַקָּהָ֜ל פַּ֤ר בֶּן־בָּקָר֙ לְחַטָּ֔את וְהֵבִ֣יאוּ אֹת֔וֹ לִפְנֵ֖י אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְתִתְיְדַע חוֹבְתָא דִּי חָבוּ עֲלַהּ וִיקַרְבוּן קְהָלָא תּוֹר בַּר תּוֹרֵי לְחַטָּאתָא וְיַיְתוּן יָתֵיהּ לָקֳדָם מַשְׁכַּן זִמְנָא:", "onk_en": "[When] they realize the sin which they committed, the community shall bring a young bullock as a sin-offering and they shall bring it to the front of the Tent of Meeting.", "pj": "וְתִשְׁתְּמוֹדַע לְהוֹן חוֹבָתָא דְאִתְחַיְיבוּן עֲלָהּ וִיקַרְבוּן קְהָלָא תּוֹר בַּר תּוֹרֵי לְחַטָאתָא וְיַיְתוּן יָתֵיהּ לִקְדָם מַשְׁכַּן זִימְנָא", "pj_en": "and the sin which they have sinned be made known to them; the congregation shall offer a young bullock as a sin offering, and shall bring him before the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 15, "aliyah": 5, "heb": "וְ֠סָמְכ֠וּ זִקְנֵ֨י הָעֵדָ֧ה אֶת־יְדֵיהֶ֛ם עַל־רֹ֥אשׁ הַפָּ֖ר לִפְנֵ֣י יְהֹוָ֑ה וְשָׁחַ֥ט אֶת־הַפָּ֖ר לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְיִסְמְכוּן סָבֵי כְנִשְׁתָּא יָת יְדֵיהוֹן עַל רֵישׁ תּוֹרָא קֳדָם יְיָ וְיִכּוֹס יָת תּוֹרָא קֳדָם יְיָ:", "onk_en": "The elders of the congregation shall lay their hands on the head of the bullock, before Adonoy and he shall slaughter the bullock before Adonoy.", "pj": "וְיִסְמְכוּן תְּרֵיסַר סָבֵי כְנִישְׁתָּא דְמִתְמַנִין אֲמַרְכוּלִין עַל תְּרֵיסַר שִׁבְטַיָא יַת יְדֵיהוֹן בְּתוּקְפָא עַל רֵישׁ תּוֹרָא וְיִכּוֹס טַבְּחָא יַת תּוֹרָא קֳדָם יְיָ", "pj_en": "And twelve of the elders of the congregation, the counsellors (amarkelin) appointed over the twelve tribes, shall lay their hands firmly upon the head of the bullock, and the slayer shall kill the bullock before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 16, "aliyah": 5, "heb": "וְהֵבִ֛יא הַכֹּהֵ֥ן הַמָּשִׁ֖יחַ מִדַּ֣ם הַפָּ֑ר אֶל־אֹ֖הֶל מוֹעֵֽד׃", "onk": "וְיָעֵל כַּהֲנָא <b>רַבָּא<\/b> מִן דְּמָא דְתוֹרָא לְמַשְׁכַּן זִמְנָא:", "onk_en": "The anointed <i>kohein<\/i> [<b>gadol<\/b>] shall bring some of the bullocks blood inside the Tent of Meeting.", "pj": "וְיֵיעוּל כַּהֲנָא רַבָּא מִן אַדְמָא דְתוֹרָא לְמַשְׁכַּן זִימְנָא", "pj_en": "And the high priest shall carry some of the blood of the bullock into the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 17, "aliyah": 5, "heb": "וְטָבַ֧ל הַכֹּהֵ֛ן אֶצְבָּע֖וֹ מִן־הַדָּ֑ם וְהִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִפְנֵ֣י יְהֹוָ֔ה אֵ֖ת פְּנֵ֥י הַפָּרֹֽכֶת׃", "onk": "וְיִטְבּוֹל כַּהֲנָא אִצְבְּעֵיהּ מִן דְּמָא וְיַדִּי שְׁבַע זִמְנִין קֳדָם יְיָ קֳדָם פָּרֻכְתָּא:", "onk_en": "The <i>kohein<\/i> shall dip his finger into some of the blood and sprinkle [it] seven times before Adonoy, in front of the curtain.", "pj": "וְיִטְמוֹשׁ כַּהֲנָא אֶצְבָּעֵיהּ מִן אַדְמָא וְיַדֵי מִנֵיהּ שְׁבַע זִמְנִין קֳדָם יְיָ קֳדָם פַּרְגוֹדָא", "pj_en": "And the priest shall dip his finger into the blood, and sprinkle some thereof seven times in the presence of the Lord before the veil;", "tj": "", "tj_en": "", "rashi": "<b>את פני הפרכת.<\/b> וּלְמַעְלָה הוּא אוֹמֵר אֶת פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ מָשָׁל לְמֶלֶךְ שֶׁסָּרְחָה עָלָיו מְדִינָה, אִם מִעוּטָהּ סָרְחָה, פָּמַלְיָא שֶׁלּוֹ מִתְקַיֶּמֶת וְאִם כֻּלָּהּ סָרְחָה, אֵין פָּמַלְיָא שֶׁלּוֹ מִתְקַיֶּמֶת, אַף כָּאן, כְּשֶׁחָטָא כֹּהֵן מָשִׁיחַ עֲדַיִן שֵׁם קְדֻשַּׁת הַמָּקוֹם עַל הַמִּקְדָּשׁ, מִשֶּׁחָטְאוּ כֻּלָּם, חַס וְשָׁלוֹם נִסְתַּלְּקָה הַקְּדֻשָּׁה (זבחים מ\"א):", "rashi_en": "את פני הפרכת [AND THE PRIEST SPRINKLE IT …] BEFORE THE PARTITION VAIL — But above (v. 6) Scripture states את פני פרכת הקדש? A parable! This may be compared to the case of a king against whom the country revolted. If it is only a minority of it that revolts his council (familia) still exists, but if the whole country revolts his council no longer exists. So, also, here: When the anointed priest alone sinned, the appelation of sanctity that is attached to the place still remains on the Sanctuary, but as soon as all of them have sinned the holiness, God forbid, disappears (Zevachim 41b)."}, {"ch": 4, "v": 18, "aliyah": 5, "heb": "וּמִן־הַדָּ֞ם יִתֵּ֣ן&thinsp;<b>׀<\/b> עַל־קַרְנֹ֣ת הַמִּזְבֵּ֗חַ אֲשֶׁר֙ לִפְנֵ֣י יְהֹוָ֔ה אֲשֶׁ֖ר בְּאֹ֣הֶל מוֹעֵ֑ד וְאֵ֣ת כׇּל־הַדָּ֗ם יִשְׁפֹּךְ֙ אֶל־יְסוֹד֙ מִזְבַּ֣ח הָעֹלָ֔ה אֲשֶׁר־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וּמִן דְּמָא יִתֵּן עַל קַרְנַת מַדְבְּחָא דִּי קֳדָם יְיָ דִּי בְּמַשְׁכַּן זִמְנָא וְיָת כָּל דְּמָא יֵשׁוֹד לִיסוֹדָא דְּמַדְבְּחָא דַעֲלָתָא דִּי בִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "He shall put some of the blood atop the corners of the altar which is before Adonoy, inside the Tent of Meeting. He shall spill all the [remaining] blood into the base of the altar of the burnt-offering, which is at the entrance of the Tent of Meeting.", "pj": "וּמִן אַדְמָא יִתֵּן עַל קַרְנַת מַדְבְּחָא דִקְדָם יְיָ דִבְמַשְׁכַּן זִימְנָא וְיַת כָּל אַדְמָא יֵישׁוֹד לִיסוֹדָא דְמַדְבַּח עֲלָתָא דְבִתְרַע מַשְׁכַּן זִימְנָא", "pj_en": "and he shall put some of the blood upon the horns of the altar that is before the Lord within the tabernacle of ordinance, and all the (residue of the) blood he shall pour out at the foundation of the altar of burnt offering which is at the door of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>יסוד מזבח העלה אשר פתח אהל מועד.<\/b> זֶה יְסוֹד מַעֲרָבִי שֶׁהוּא כְּנֶגֶד הַפֶּתַח (שם נ\"א):", "rashi_en": "יסוד מזבח העלה אשר פתח אהל מועד [AND HE SHALL POUR OUT ALL THE BLOOD AT] THE BASE OF THE ALTAR OF THE BURNT-OFFERING WHICH IS AT THE ENTRANCE OF THE APPOINTED TENT — this is the base on the west side, for it was that which was opposite to the entrance of the tent (cf. Zevachim 51a)."}, {"ch": 4, "v": 19, "aliyah": 5, "heb": "וְאֵ֥ת כׇּל־חֶלְבּ֖וֹ יָרִ֣ים מִמֶּ֑נּוּ וְהִקְטִ֖יר הַמִּזְבֵּֽחָה׃", "onk": "וְיָת כָּל תַּרְבֵּיהּ יַפְרֵשׁ מִנֵּיהּ וְיַסֵּק לְמַדְבְּחָא:", "onk_en": "He shall remove all its fat from it and burn it on the altar.", "pj": "וְיַת כָּל תַּרְבֵּיהּ יַפְרֵישׁ מִנֵיהּ וְיַסֵק לְמַדְבְּחָא", "pj_en": "And all the fat he shall separate from him, and burn at the altar.", "tj": "", "tj_en": "", "rashi": "<b>ואת כל חלבו ירים.<\/b> אַף עַל פִּי שֶׁלֹּא פֵּרֵשׁ כָּאן יוֹתֶרֶת וּשְׁתֵּי כְּלָיוֹת, לְמֵדִין הֵם מִוְּעָשָׂה לַפָּר כַּאֲשֶׁר עָשָׂה וְגוֹ' וּמִפְּנֵי מָה לֹא נִתְפָּרְשׁוּ בּוֹ? תָּנָא דְּבֵי רַבִּי יִשְׁמָעֵאל מָשָׁל לְמֶלֶךְ שֶׁזָּעַם עַל אוֹהֲבוֹ וּמִעֵט בְּסִרְחוֹנוֹ מִפְּנֵי חִבָּתוֹ (שם מ\"א):", "rashi_en": "ואת כל חלבו ירים AND HE SHALL TAKE ALL HIS FAT — Although it does not expressly mention here the lobe of the liver and the two kidneys as portions that were to be taken (as it does in the case of the anointed priest’s sin-offering, v. 9) they may be derived from the statement (v. 20) “And he shall do with the bullock as he did [with the bullock of the sin-offering]”. But why are they not expressly mentioned? It was taught in the School of R. Ishmael: A parable! This may be compared to the case of a king who was angry with his friend and abridged the account of his offence because of the affection he bore him (Zevachim 41b). (Similarly Scripture does not give in detail all the rites that have to be carried out when the whole of the nation sins.)"}, {"ch": 4, "v": 20, "aliyah": 5, "heb": "וְעָשָׂ֣ה לַפָּ֔ר כַּאֲשֶׁ֤ר עָשָׂה֙ לְפַ֣ר הַֽחַטָּ֔את כֵּ֖ן יַעֲשֶׂה־לּ֑וֹ וְכִפֶּ֧ר עֲלֵהֶ֛ם הַכֹּהֵ֖ן וְנִסְלַ֥ח לָהֶֽם׃", "onk": "וְיַעְבֵּד לְתוֹרָא כְּמָא דִי עֲבַד לְתוֹרָא דְחַטָּאתָא כֵּן יַעְבֵּד לֵיהּ וִיכַפֵּר עֲלֵיהוֹן כַּהֲנָא וְיִשְׁתְּבֵק לְהוֹן:", "onk_en": "He shall do to the bullock [the same] as he did to the sin-offering bullock, so he shall do to it. The <i>kohein<\/i> will atone for them and they will be pardoned.", "pj": "וְיַעֲבֵיד לְתוֹרָא הֵיכְמָא דְעָבַד לְתוֹרָא דְחַטָאתָא דְכַהֲנָא רַבָּא הֵיכְדֵין יַעֲבֵיד לֵיהּ וִיכַפֵּר עֲלֵיהוֹן כַּהֲנָא וְיִשְׁתְּבֵיק לְהוֹן", "pj_en": "And he shall do with the bullock as he did with the bullock for the sin of the high priest, so shall he do with him. And the priest shall atone for them, and it shall be forgiven them.", "tj": "", "tj_en": "", "rashi": "<b>ועשה לפר<\/b> זֶה <b>כאשר עשה לפר החטאת.<\/b> כְּמוֹ שֶׁמְּפֹרָשׁ בְּפַר כֹּהֵן מָשִׁיחַ — לְהָבִיא יוֹתֶרֶת וּשְׁתֵּי כְּלָיוֹת שֶׁפֵּרֵשׁ שָׁם, מַה שֶּׁלֹא פֵּרֵשׁ כָּאן, וְלִכְפֹּל בְּמִצְוַת הָעֲבוֹדוֹת, לְלַמֵּד שֶׁאִם חִסֵּר אַחַת מִכָּל הַמַּתָּנוֹת פָּסוּל; לְפִי שֶׁמָּצִינוּ בַּנִּתָּנִין עַל הַמִּזְבֵּחַ הַחִיצוֹן שֶׁנְּתָנָן בְּמַתָּנָה אַחַת כִּפֵּר, הֻצְרַךְ לוֹמַר כָּאן שֶׁמַּתָּנָה אַחַת מֵהֶן מְעַכֶּבֶת (שם ל\"ט):", "rashi_en": "ועשה לפר AND HE SHALL DO WITH THE BULLOCK — with this bullock —כאשר עשה לפר החטאת AS HE DID WITH THE BULLOCK FOR A SIN-OFFERING – i. e. as is expressly set forth in the case of the bullock of the anointed priest. This statement thus serves to bring under the command of offering the fat portions the lobe of  the liver and the two kidneys which are not expressly mentioned there but which are not expressly mentioned here; and it serves also to repeat the command referring to these rites, teaching thereby that if he (the anointed priest) omitted one of all the applications of the blood it (the sacrifice) becomes invalid (Sifra, Vayikra Dibbura d'Chovah, Chapter 6 5). Since we find in regard to blood which had to be placed on the outer altar, that if he places it there by one application alone he nevertheless effected atonement (cf. Mish. Zevachim 4:1), Scripture was compelled to intimate here that the omission of one application impedes the validity of the rite (Zevachim 39a)."}, {"ch": 4, "v": 21, "aliyah": 5, "heb": "וְהוֹצִ֣יא אֶת־הַפָּ֗ר אֶל־מִחוּץ֙ לַֽמַּחֲנֶ֔ה וְשָׂרַ֣ף אֹת֔וֹ כַּאֲשֶׁ֣ר שָׂרַ֔ף אֵ֖ת הַפָּ֣ר הָרִאשׁ֑וֹן חַטַּ֥את הַקָּהָ֖ל הֽוּא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַפֵּק יָת תּוֹרָא לְמִבָּרָא לְמַשְׁרִיתָא וְאוֹקִיד יָתֵיהּ כְּמָא דִי אוֹקִיד יָת תּוֹרָא קַדְמָאָה חַטַּאת קְהָלָא הוּא:", "onk_en": "He shall take the bullock outside, beyond the encampment, and burn it in the same manner as he burned the first bullock; it is a communal sin-offering.", "pj": "וְיִפּוֹק יַת תּוֹרָא לְמִבָּרָא לְמַשְׁרִיתָא וְיוֹקֵד יָתֵיהּ הֵיכְמָא דְאוֹקֵד יַת תּוֹרָא קַדְמָאָה דְכַהֲנָא רַבָּא מִטוּל דְיִשְׁתְּבוֹק חוֹבִין דְיִשְרָאֵל בֵּיהּ וּבְרַם חַטָאת קְהָלָא הוּא", "pj_en": "And the bullock shall be carried forth without the camp and be burned, as the former bullock of the high priest was burned, that through it the sin of Israel may be forgiven. It is a sin offering for the congregation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 22, "aliyah": 5, "heb": "אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְעָשָׂ֡ה אַחַ֣ת מִכׇּל־מִצְוֺת֩ יְהֹוָ֨ה אֱלֹהָ֜יו אֲשֶׁ֧ר לֹא־תֵעָשֶׂ֛ינָה בִּשְׁגָגָ֖ה וְאָשֵֽׁם׃", "onk": "אִם רַבָּא יֵחוֹב וְיַעְבֵּד חַד מִכָּל פִּקּוּדַיָּא דַיְיָ אֱלָהֵיהּ דִּי לָא <b>כַשְׁרִין<\/b> לְאִתְעֲבָדָא בְּשָׁלוּ וְיֵחוֹב:", "onk_en": "If a leader sins, [who] transgresses one of the commandments of Adonoy, his God, that should [<b>is<\/b>] not [<b>fitting to<\/b>] be done, [if he transgressed] unwittingly and incurs guilt.", "pj": "בְּזִימְנָא דְרַבָּא בְּעַמָא יֵיחוֹב וְיַעֲבֵיד חַד מִן כָּל פִּקוּדַיָא דַיְיָ אֱלָהֵיהּ דְלָא כַשְׁרִין לְאִתְעֲבָדָא בְּשָׁלוּ וְיִתְחַיֵיב", "pj_en": "At what time the ruler of his people shall have sinned, and done against any of the commandments of the Lord his God that which ought not to have been done, and he hath sinned through ignorance;", "tj": "", "tj_en": "", "rashi": "<b>אשר נשיא יחטא.<\/b> לְשׁוֹן אַשְׁרֵי — אַשְׁרֵי הַדּוֹר שֶׁהַנָּשִׂיא שֶׁלּוֹ נוֹתֵן לֵב לְהָבִיא כַּפָּרָה עַל שִׁגְגָתוֹ, קַל וָחֹמֶר שֶׁמִּתְחָרֵט עַל זְדוֹנוֹתָיו (ספרא):", "rashi_en": "אשר נשיא יחטא — The word אשר is connected in meaning with ‎‎‏אשרי “happy”. Happy is the generation whose prince (king) takes care to bring an atonement sacrifice even for an inadvertent act of his; how much the more certain is it that he will do penance for his wilful sins (Sifra, Vayikra Dibbura d'Chovah, Section 5 1; Horayot 10b)"}, {"ch": 4, "v": 23, "aliyah": 5, "heb": "אֽוֹ־הוֹדַ֤ע אֵלָיו֙ חַטָּאת֔וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑הּ וְהֵבִ֧יא אֶת־קׇרְבָּנ֛וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים׃", "onk": "אוֹ אִתְיְדַע לֵיהּ חוֹבְתֵיהּ דִּי חַב בַּהּ וְיַיְתִי יָת קֻרְבָּנֵיהּ צְפִיר בַּר עִזִּין דְּכַר שְׁלִים:", "onk_en": "Or, [if his sin] becomes known to him—[that] which he committed. He shall bring as his offering an unblemished, male goat.", "pj": "אוֹ אִשְׁתְּמוֹדַע לֵיהּ חוֹבְתֵיהּ דְחַב וְיַיְתֵי קוּרְבָּנֵיהּ צְפִיר בַּר עִזֵי דְכַר שְׁלִים", "pj_en": "if his sin that he hath sinned be made known to him, he shall bring for his oblation a kid of the goats, a male, unblemished;", "tj": "", "tj_en": "", "rashi": "<b>או הודע.<\/b> כְּמוֹ אִם הוֹדַע הַדָּבָר; הַרְבֵּה אוֹ יֵשׁ שֶׁמְּשַׁמְּשִׁין בִּלְשׁוֹן אִם, וְאִם בִּמְקוֹם אוֹ, וְכֵן אוֹ נוֹדַע כִּי שׁוֹר נַגָּח הוּא (שמות כ\"א):<br><br><b>הודע אליו.<\/b> כְּשֶׁחָטָא הָיָה סָבוּר שֶׁהוּא הֶתֵּר, וּלְאַחַר מִכָּאן נוֹדַע לוֹ שֶׁאִסּוּר הָיָה:", "rashi_en": "או הודע is the same as “IF” (אם‎) [THE THING] WAS MADE KNOWN TO HIM — There are many passages where או is used in the sense of אם, and again where אם stands in the place of או. A similar instance is: (Exodus 21:36) “או נודע כי שור נגח הוא”, which means “if it was known that the ox was wont to thrust” (cf., however, Rashi on that verse and our Note thereon).<br><br>הודע אליו IT WAS MADE KNOWN TO HIM — when he committed the sin he was under the belief that it was something permissible, afterwards it became known to him that it was a forbidden thing."}, {"ch": 4, "v": 24, "aliyah": 5, "heb": "וְסָמַ֤ךְ יָדוֹ֙ עַל־רֹ֣אשׁ הַשָּׂעִ֔יר וְשָׁחַ֣ט אֹת֗וֹ בִּמְק֛וֹם אֲשֶׁר־יִשְׁחַ֥ט אֶת־הָעֹלָ֖ה לִפְנֵ֣י יְהֹוָ֑ה חַטָּ֖את הֽוּא׃", "onk": "וְיִסְמוֹךְ יְדֵיהּ עַל רֵישָׁא דִצְפִירָא וְיִכּוֹס יָתֵיהּ בַּאֲתַר דְּיִכּוֹס יָת עֲלָתָא לָקֳדָם יְיָ חַטָּאתָא הוּא:", "onk_en": "He shall lay his hand on the goats head and slaughter it in the place where the burnt-offering is slaughtered, before Adonoy; it is a sin-offering.", "pj": "וְיִסְמוֹךְ בְּתוּקְפָּא יַד יְמִינֵיהּ עַל רֵישׁ צְפִירָא וְיִכּוֹס יָתֵיהּ טַבְּחָא בַּאֲתַר דְיִכּוֹס יַת עֲלָתָא קֳדָם יְיָ חַטָאתָא הוּא", "pj_en": "and he shall lay his right hand firmly upon the head of the goat, and the slayer shall kill him at the place of the sacrifice of the burnt offering before the Lord. It is a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>במקום אשר ישחט את העלה.<\/b> בַּצָּפוֹן שֶׁהוּא מְפֹרָשׁ בָּעוֹלָה:<br><br><b>חטאת הוא.<\/b> לִשְׁמוֹ כָּשֵׁר, שֶׁלֹּא לִשְׁמוֹ פָּסוּל (ספרא):", "rashi_en": "במקום אשר ישחט את העלה [AND HE SHALL SLAUGHTER IT] IN THE PLACE WHERE THEY SLAUGHTER THE BURNT-OFFERING — on the north side of the altar which is expressly mentioned in the case of the burnt-offering (Leviticus 1:11) (Sifra, Vayikra Dibbura d'Chovah, Chapter 8 5).<br><br>חטאת הוא IT IS [TO BE] A SIN-OFFERING — Consequently, if he slaughtered it for the purpose of (i. e. having in mind that it is) a sin-offering it is valid, but if it is not done for this purpose (i. e. that the officiating priest had another sacrifice in mind) it is invalid (Sifra, Vayikra Dibbura d'Chovah, Chapter 8 6; Zevachim 10b; cf. also Rashi and Zevachim 5b)."}, {"ch": 4, "v": 25, "aliyah": 5, "heb": "וְלָקַ֨ח הַכֹּהֵ֜ן מִדַּ֤ם הַֽחַטָּאת֙ בְּאֶצְבָּע֔וֹ וְנָתַ֕ן עַל־קַרְנֹ֖ת מִזְבַּ֣ח הָעֹלָ֑ה וְאֶת־דָּמ֣וֹ יִשְׁפֹּ֔ךְ אֶל־יְס֖וֹד מִזְבַּ֥ח הָעֹלָֽה׃", "onk": "וְיִסַּב כַּהֲנָא מִדְּמָא דְחַטָּאתָא בְּאֶצְבְּעֵיהּ וְיִתֵּן עַל קַרְנַת מַדְבְּחָא דַעֲלָתָא וְיָת דְּמֵיהּ יֵשׁוֹד לִיסוֹדָא דְמַדְבְּחָא דַעֲלָתָא:", "onk_en": "The <i>kohein<\/i> shall take some blood of the sin-offering with his finger and put it atop the corners of the altar of the burnt-offering. He shall spill its [remaining] blood into the base of the altar of the burnt-offering.", "pj": "וְיִסַב כַּהֲנָא מִן אַדְמָא דְחַטָאתָא בְּאֶצְבְּעֵיהּ וְיִתֵּן עַל קַרְנַת מַדְבְּחָא דַעֲלָתָא וְיַת אַדְמֵיהּ יֵישׁוֹד לִיסוֹדָא דְמַדְבְּחָא דַעֲלָתָא", "pj_en": "And the priest shall take of the blood of the sin offering upon his finger, and put it on the horns of the altar of burnt sacrifice, shall pour out the blood at the foundation of the altar of burnt sacrifice.", "tj": "", "tj_en": "", "rashi": "<b>ואת דמו.<\/b> שְׁיָרֵי הַדָּם:", "rashi_en": "ואת דמו [AND HE SHALL POUR OUT] THE BLOOD — i. e. the remainder of the blood (cf. Rashi on v. 7)."}, {"ch": 4, "v": 26, "aliyah": 5, "heb": "וְאֶת־כׇּל־חֶלְבּוֹ֙ יַקְטִ֣יר הַמִּזְבֵּ֔חָה כְּחֵ֖לֶב זֶ֣בַח הַשְּׁלָמִ֑ים וְכִפֶּ֨ר עָלָ֧יו הַכֹּהֵ֛ן מֵחַטָּאת֖וֹ וְנִסְלַ֥ח לֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת כָּל תַּרְבֵּיהּ יַסֵּק לְמַדְבְּחָא כִּתְרַב נִכְסַת <b>קוּדְשַׁיָּא<\/b> וִיכַפֵּר עֲלוֹהִי כַּהֲנָא מֵחוֹבְתֵיהּ וְיִשְׁתְּבֵק לֵיהּ:", "onk_en": "He shall burn all its fat on the altar as [he burned] the fat of the peace[<b>sacred<\/
