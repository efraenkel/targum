<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;

}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;

    --he: #efe6d4; --he-bg: #221e14;

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }

.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }

.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 47, "v": 28, "aliyah": 1, "heb": "וַיְחִ֤י יַעֲקֹב֙ בְּאֶ֣רֶץ מִצְרַ֔יִם שְׁבַ֥ע עֶשְׂרֵ֖ה שָׁנָ֑ה וַיְהִ֤י יְמֵֽי־יַעֲקֹב֙ שְׁנֵ֣י חַיָּ֔יו שֶׁ֣בַע שָׁנִ֔ים וְאַרְבָּעִ֥ים וּמְאַ֖ת שָׁנָֽה׃", "onk": "וַחֲיָא יַעֲקֹב בְּאַרְעָא דְמִצְרַיִם שְׁבַע עֶשְׂרֵי שְׁנִין וַהֲווֹ יוֹמֵי יַעֲקֹב שְׁנֵי חַיּוֹהִי מְאָה וְאַרְבְּעִין וּשְׁבַע שְׁנִין:", "onk_en": "Yaakov lived in the land of Egypt seventeen years. The days of Yaakov, the years of his life were one hundred and forty seven years.", "pj": "ויחי וַחֲיָא יַעֲקב בְּאַרְעָא דְמִצְרַיִם שֶׁבְסְרֵי שְׁנִין וַהֲווֹ יוֹמֵי יַעֲקב סְכוּם יוֹמֵי חֲיוֹי מְאָה וְאַרְבְּעִין וּשְׁבַע שְׁנִין", "pj_en": "And Jakob lived in the land of Mizraim seventeen years. And the sum of the days of Jakob, of the days of his life, was a hundred and forty and seven years.", "tj": "", "tj_en": "", "rashi": "<b>ויחי יעקב.<\/b> לָמָּה פָּרָשָׁה זוֹ סְתוּמָה? לְפִי שֶׁכֵּיוָן שֶׁנִּפְטַר יַעֲקֹב אָבִינוּ נִסְתְּמוּ עֵינֵיהֶם וְלִבָּם שֶׁל יִשְׂרָאֵל מִצָּרַת הַשִּׁעְבּוּד, שֶׁהִתְחִילוּ לְשַׁעְבְּדָם; דָּבָר אַחֵר: שֶׁבִּקֵּשׁ לְגַלּוֹת אֶת הַקֵּץ לְבָנָיו, וְנִסְתַּם מִמֶּנּוּ. בִּבְ\"רַ:", "rashi_en": "ויחי יעקב AND JACOB LIVED — Why is this section (Sidra) totally closed? Because, comprising as it does an account of the death of Jacob, as soon as our father Jacob departed this life the hearts and eyes of Israel were closed (their eyes became dim and their hearts troubled) because of the misery of the bondage which they then began to impose upon them. Another reason is: because he (Jacob) wished to reveal to his sons the date of the End of Days (i.e. when Israel’s exile would finally end; cf. Rashi on Genesis 49:1), but the vision was closed (concealed) from him (Genesis Rabbah 96:1). "}, {"ch": 47, "v": 29, "aliyah": 1, "heb": "וַיִּקְרְב֣וּ יְמֵֽי־יִשְׂרָאֵל֮ לָמוּת֒ וַיִּקְרָ֣א&thinsp;<b>׀<\/b> לִבְנ֣וֹ לְיוֹסֵ֗ף וַיֹּ֤אמֶר לוֹ֙ אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ שִֽׂים־נָ֥א יָדְךָ֖ תַּ֣חַת יְרֵכִ֑י וְעָשִׂ֤יתָ עִמָּדִי֙ חֶ֣סֶד וֶאֱמֶ֔ת אַל־נָ֥א תִקְבְּרֵ֖נִי בְּמִצְרָֽיִם׃", "onk": "וּקְרִיבוּ יוֹמֵי יִשְׂרָאֵל לִמְמַת וּקְרָא לִבְרֵיהּ לְיוֹסֵף וַאֲמַר לֵיהּ אִם <b>כְּעַן<\/b> אַשְׁכָּחִית רַחֲמִין בְּעֵינָיךְ שַׁוִּי כְעַן יְדָךְ תְּחוֹת יַרְכִּי וְתַעְבֵּד עִמִּי <b>טִיבוּ<\/b> וּקְשׁוֹט לָא <b>כְעַן<\/b> תִּקְבְּרִנַּנִי בְּמִצְרָיִם:", "onk_en": "The days of Yisrael’s death drew near, and he called for his son Yoseif, and said to him, If I have found favor in your eyes, please [<b>now<\/b>], place your hand under my thigh; that you will deal kindly [<b>with goodness<\/b>] and truthfully with me. Please [<b>Now<\/b>], do not bury me in Egypt.", "pj": "וּקְרִיבוּ יוֹמֵי יִשְרָאֵל לִמְמַת וּקְרָא לִבְרֵיהּ לְיוֹסֵף וַאֲמַר לֵיהּ אִין כְּדוֹן אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ שַׁוִי כְּדוֹן אִידָךְ בִּגְזֵירַת מְהוּלְתִּי וְתַעֲבֵיד כְּדוּן עִמִי טִיבוּ וּקְשׁוֹט לָא כְדוֹן תִּקְבְּרִינַנִי בְּמִצְרָיִם", "pj_en": "And the days of Israel drew near to die. And he called to his son, to Joseph, and said to him, If now I have found favour before thee, put thy hand on the place of my circumcision, and deal with me in goodness and truth, That thou wilt not bury me in Mizraim,", "tj": "", "tj_en": "", "rashi": "<b>ויקרבו ימי ישראל למות.<\/b> כָּל מִי שֶׁנֶּאֱמְרָה בּוֹ קְרִיבָה לָמוּת, לֹא הִגִּיעַ לִימֵי אֲבוֹתָיו (יִצְחָק חָיָה ק\"פ, וְיַעֲקֹב קמ\"ז, בְּדָוִד נֶאֱמַר קְרִיבָה, אָבִיו חָיָה פ' שָׁנִים וְהוּא חָיָה ע'):<br><br><b>ויקרא לבנו ליוסף.<\/b> לְמִי שֶׁהָיָה יְכֹלֶת בְּיָדוֹ לַעֲשׂוֹת:<br><br><b>שים נא ידך.<\/b> וְהִשָּׁבַע:<br><br><b>חסד ואמת.<\/b> חֶסֶד שֶׁעוֹשִׂין עִם הַמֵּתִים הוּא חֶסֶד שֶׁל אֱמֶת, שֶׁאֵינוֹ מְצַפֶּה לְתַשְׁלוּם גְּמוּל:<br><br><b>אל נא תקברני במצרים.<\/b> סוֹפָהּ לִהְיוֹת עֲפָרָהּ כִּנִּים, וּמְרַחֲשִׁין תַּחַת גּוּפִי, וְשֶׁאֵין מֵתֵי חוּצָה לָאָרֶץ חַיִּים אֶלָּא בְּצַעַר גִּלְגּוּל מְחִלּוֹת, וְשֶׁלֹּא יַעֲשׂוּנִי מִצְרַיִם עֲבוֹדָה זָרָה:", "rashi_en": "ויקרבו ימי ישראל למות AND WHEN THE DAYS OF ISRAEL S DEATH APPROACHED — Everyone of whom it is stated that his days drew near to die did not attain to the age of his fathers (Genesis Rabbah 76:3). Some editions add: Isaac lived 180 years, whereas Jacob lived only 147. Similarly it is said in the case of David, “his days drew near” and he lived 70 years, whereas his father reached the age of eighty.<br><br>ויקרא לבנו ליוסף AND HE CALLED HIS SON JOSEPH — he called that one who had the power in his hands to do what he was about to ask (Genesis Rabbah 96:3).<br><br>שים נא ידך PUT, I PRAY THEE, THY HAND — and take an oath.<br><br>חסד ואמת MERCY AND TRUTH — The mercy shown to the dead is “mercy of truth” (true, disinterested kindness) since one cannot hope for any reward (Genesis Rabbah 96:5).<br><br>אל נא תקברני במצרים BURY ME NOT, I PRAY THEE, IN EGYPT — Because its soil will ultimately become lice which would swarm beneath my body. Further, those who die outside the Land of Israel will not live again at the Resurrection except after the pain caused by the body rolling through underground-passages until it reaches the Holy Land) And another reason is that the Egyptians should not make me (my corpse or my tomb) the object of idolatrous worship (Genesis Rabbah 76:3). "}, {"ch": 47, "v": 30, "aliyah": 1, "heb": "וְשָֽׁכַבְתִּי֙ עִם־אֲבֹתַ֔י וּנְשָׂאתַ֙נִי֙ מִמִּצְרַ֔יִם וּקְבַרְתַּ֖נִי בִּקְבֻרָתָ֑ם וַיֹּאמַ֕ר אָנֹכִ֖י אֶֽעֱשֶׂ֥ה כִדְבָרֶֽךָ׃", "onk": "וְאִשְׁכּוּב עִם אֲבָהָתַי וְתִטְּלִנַּנִי מִמִּצְרַיִם וְתִקְבְּרִנַּנִי בִּקְבֻרְתְּהוֹן וַאֲמַר אֲנָא אֶעְבֵּד כְּפִתְגָּמָךְ:", "onk_en": "For I will lie with my fathers. Carry me out of Egypt, and bury me in their grave. He [Yoseif said], I will do as you say.", "pj": "וְאֶשְׁכּוֹב עִם אַבְהָתַי וְתִטְלִינַנִי מִמִצְרַיִם וְתִקְבְּרִינַנִי בִּקְבוּרְתְּהוֹן וּמִן בִּגְלַל דְהוּא בְּרֵיהּ לָא שַׁוִי יְדֵיהּ אֱלָהֵן אָמַר אֲנָא אַעְבֵיד כְּפִתְגָמָךְ", "pj_en": "that I may sleep with my fathers, and thou mayest carry me from Mizraim, and bury me in their sepulchre. But because he was his son he did not (so) put his hand; but said, I will do according to thy word.", "tj": "", "tj_en": "", "rashi": "<b>ושכבתי עם אבותי.<\/b> וָי\"ו זוֹ מְחֻבָּר לְמַעְלָה לִתְחִלַּת הַמִּקְרָא – שִׂים נָא יָדְךָ תַּחַת יְרֵכִי וְהִשָּׁבַע לִי – וַאֲנִי סוֹפִי לִשְׁכַּב עִם אֲבוֹתַי, וְאַתָּה תִּשָּׂאֵנִי מִמִּצְרַיִם. וְאֵין לוֹמַר, וְשָׁכַבְתִּי עִם אֲבוֹתַי – הַשְׁכִּיבֵנִי עִם אֲבוֹתַי בַּמְּעָרָה, שֶׁהֲרֵי כְּתִיב אַחֲרָיו, וּנְשָׂאתַנִי מִמִּצְרַיִם וּקְבַרְתַּנִי בִּקְבֻרָתָם; וְעוֹד, מָצִינוּ בְּכָל מָקוֹם לְשׁוֹן שְׁכִיבָה עִם אֲבוֹתָיו הִיא הַגְּוִיעָה וְלֹא הַקְּבוּרָה, כְּמוֹ: וַיִּשְׁכַּב דָּוִד עִם אֲבֹתָיו, וְאַחַר כָּךְ וַיִּקָּבֵר בְּעִיר דָּוִד (מלכים א ב'):", "rashi_en": "ושכבתי עם אבתי BUT I WILL LIE WITH MY FATHERS — This ו of ושכבתי is the connecting link with the beginning of the verse above: Put thy hand beneath my thigh and swear unto me that you will not bury me in Egypt. For I must ultimately lie with my fathers (i.e. die as all my fathers have died) and you shall carry me out of Egypt. One cannot say that “I will lie with my fathers” means “make me lie with my fathers in the cave” (i.e. bury me), for immediately after this it is written “And thou shalt carry me out of Egypt and bury me in their burying place”. Further we find that wherever the term “lying with one’s fathers” is used it denotes dying and not burial. For instance, (1 Kings 2:10) “and David lay with his fathers”, and afterwards it states “and he was buried in the city of David”. "}, {"ch": 47, "v": 31, "aliyah": 1, "heb": "וַיֹּ֗אמֶר הִשָּֽׁבְעָה֙ לִ֔י וַיִּשָּׁבַ֖ע ל֑וֹ וַיִּשְׁתַּ֥חוּ יִשְׂרָאֵ֖ל עַל־רֹ֥אשׁ הַמִּטָּֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר קַיַּם לִי וְקַיִּים לֵיהּ וּסְגִיד יִשְׂרָאֵל עַל רֵישׁ עַרְסָא:", "onk_en": "He [Yaakov] said, Swear to me, and he swore to him. Yisrael prostrated himself at the head of the bed.", "pj": "וַאֲמַר קַיֵים לִי וְקַיֵים לֵיהּ מִן יַד אִתְגְלֵי עֲלוֹי יְקַר שְׁכִינְתָּא דַיְיָ וּסְגִיד יִשְרָאֵל עַל רֵישׁ דַרְגְשָׁא", "pj_en": "And he said, Swear tome: and he sware to him. And immediately the Glory of the Shekina of the Lord was revealed to him, and Israel worshipped upon the pillow of the bed.", "tj": "וְשַׁבַּח יִשְרָאֵל עַל רֵישׁ דַרְגוּשָׁה:", "tj_en": "And Israel praised upon the head of the couch.", "rashi": "<b>וישתחו ישראל.<\/b> תַּעֲלָא בְּעִידָּנֵיהּ סְגִיד לֵיהּ:<br><br><b>על ראש המטה.<\/b> הָפַךְ עַצְמוֹ לְצַד הַשְּׁכִינָה. מִכָּאן אָמְרוּ שֶׁהַשְּׁכִינָה לְמַעְלָה מֵרַאֲשׁוֹתָיו שֶׁל חוֹלֶה (שבת י\"ב, נדרים מ'); דָּ\"אַ עַל רֹאשׁ הַמִּטָּה – עַל שֶׁהָיְתָה מִטָּתוֹ שְׁלֵמָה וְלֹא הָיָה בָהּ רֶשַׁע, שֶׁהֲרֵי יוֹסֵף מֶלֶךְ הוּא, וְעוֹד שֶׁנִּשְׁבָּה לְבֵין הַגּוֹיִם, וַהֲרֵי הוּא עוֹמֵד בְּצִדְקוֹ:", "rashi_en": "וישתחו ישראל AND ISRAEL PROSTRATED HIMSELF — The proverb says: Though the lion is king “when the fox has his time, bow to him” (Megillah 16b).<br><br>על ראש המטה UPON THE BED’S HEAD — He turned towards the Divine Presence (the Shechinah) (Midrash Tanchuma, Vayechi 3). They (the Rabbis) inferred from this that the Shechinah is above the pillow of a sick person (Shabbat 12b). Another interpretation of על ראש המטה He bowed himself in thanks FOR HIM WHO WAS THE CHIEF (ראש) OF HIS CHILDREN — in thanks because his children were heart-whole with God, and none of them was wicked, for even Joseph who was a king and moreover had been a captive amongst heathen peoples yet maintained his righteousness (Sifré ואתחנן 31)."}, {"ch": 48, "v": 1, "aliyah": 1, "heb": "וַיְהִ֗י אַחֲרֵי֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וַיֹּ֣אמֶר לְיוֹסֵ֔ף הִנֵּ֥ה אָבִ֖יךָ חֹלֶ֑ה וַיִּקַּ֞ח אֶת־שְׁנֵ֤י בָנָיו֙ עִמּ֔וֹ אֶת־מְנַשֶּׁ֖ה וְאֶת־אֶפְרָֽיִם׃", "onk": "וַהֲוָה בָּתַר פִּתְגָּמַיָּא הָאִלֵּין וַאֲמַר לְיוֹסֵף הָא אֲבוּךְ <b>שְׁכִיב<\/b> מְרָע וּדְבַר יָת תְּרֵין בְּנוֹהִי עִמֵּיהּ יָת מְנַשֶּׁה וְיָת אֶפְרָיִם:", "onk_en": "After these events, someone said to Yoseif, Behold your father is [<b>lying<\/b>] ill. He took his two sons with him, Menasheh and Ephraim.", "pj": "וַהֲוָה בָּתַר פִּתְגָמַיָא הָאִלֵין וְאִיתְאַמַר לְיוֹסֵף לְמֵימַר אָבוּךְ שְׁכִיב מְרַע וּדְבַר יַת תְּרֵין בְּנוֹי עִמֵיהּ יַת מְנַשֶׁה וְיַת אֶפְרָיִם", "pj_en": "And after these things it was told Joseph, Behold, thy father is lying ill. And he took his two sons with him., Menasheh and Ephraim.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ליוסף.<\/b> אֶחָד מִן הַמַּגִּידִים, וַהֲרֵי זֶה מִקְרָא קָצָר; וְיֵ\"אֹ, אֶפְרַיִם הָיָה רָגִיל לִפְנֵי יַעֲקֹב בְּתַלְמוּד, וּכְשֶׁחָלָה יַעֲקֹב בְּאֶרֶץ גֹּשֶׁן, הָלַךְ אֶפְרַיִם אֵצֶל אָבִיו לְמִצְרַיִם לְהַגִּיד לוֹ:<br><br><b>ויקח את שני בניו עמו.<\/b> כְּדֵי שֶׁיְּבָרְכֵם יַעֲקֹב לִפְנֵי מוֹתוֹ:", "rashi_en": "ויאמר ליוסף literally, HE SAID TO JOSEPH — “he” means one of the messengers: it is an elliptical phrase. Some say, that Ephraim was regularly with Jacob for study and when Jacob became ill in the land of Goshen Ephraim went to his father in Egypt and reported it to him (Tanchuma 1:12:6). <br><br>ויקח את שני בניו עמו AND HE TOOK HIS TWO SONS WITH HIM — so that Jacob would bless them before his death."}, {"ch": 48, "v": 2, "aliyah": 1, "heb": "וַיַּגֵּ֣ד לְיַעֲקֹ֔ב וַיֹּ֕אמֶר הִנֵּ֛ה בִּנְךָ֥ יוֹסֵ֖ף בָּ֣א אֵלֶ֑יךָ וַיִּתְחַזֵּק֙ יִשְׂרָאֵ֔ל וַיֵּ֖שֶׁב עַל־הַמִּטָּֽה׃", "onk": "וְחַוִּי לְיַעֲקֹב וַאֲמַר הָא בְּרָךְ יוֹסֵף אֲתָא לְוָתָךְ וְאַתְקַף יִשְׂרָאֵל וִיתֵיב עַל עַרְסָא:", "onk_en": "It was told to Yaakov, saying, Behold, your son, Yoseif, has come to you. Yisrael gathered his strength and sat up in bed.", "pj": "וְתַנִיאוּ לְיַעֲקב לְמֵימַר הָא בְּרָךְ יוֹסֵף אָתֵי לְוָתָךְ וְאִתְקֵף יִשְרָאֵל וִיתֵיב עַל דַרְגְשָׁא", "pj_en": "And it was announced to Jakob, saying, Behold, thy son Joseph hath come to thee: and Israel strengthened himself, and sat upon the bed.", "tj": "", "tj_en": "", "rashi": "<b>ויגד.<\/b> הַמַּגִּיד לְיַעֲקֹב, וְלֹא פֵּרֵשׁ מִי; וְהַרְבֵּה מִקְרָאוֹת קִצְרֵי לָשׁוֹן:<br><br><b>ויתחזק ישראל.<\/b> אָמַר, אַף עַל פִּי שֶׁהוּא בְּנִי, מֶלֶךְ הוּא, אֶחֱלֹק לוֹ כָּבוֹד; מִכָּאן שֶׁחוֹלְקִין כָּבוֹד לַמַּלְכוּת, וְכֵן מֹשֶׁה חָלַק כָּבוֹד לַמַּלְכוּת – וְיָרְדוּ כָל עֲבָדֶיךָ אֵלֶּה אֵלַי (שמות י\"א); וְכֵן אֵלִיָּהוּ, וַיְשַׁנֵּס מָתְנָיו וְגוֹ' (מלכים א י\"ח):", "rashi_en": "ויגד literally, AND HE TOLD — “he” means the messenger whoever it was — TO JACOB. It does not state plainly who told it; there are many such elliptical verses<br><br>ויתחזק ישראל AND ISRAEL STRENGTHENED HIMSELF — he said, “Although he is my son, he is a king, and I will do honour to him” (Midrash Tanchuma, Bo 6). From this we may infer that we must show honour to a person of royal rank (Cf. Menachot 98a). Similarly, Moses showed honour to the king when he said, (Exodus 11:8) “And all these, thy servants, shall come down to me” (which was only a polite way of saying. “Thou, thyself, wilt be forced to come down to me”); so, too, did Elijah: (1 Kings 18:46) “and he girded up his loins [and ran before Ahab] etc.”  (Midrash Tanchuma, Bo 7)"}, {"ch": 48, "v": 3, "aliyah": 1, "heb": "וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־יוֹסֵ֔ף אֵ֥ל שַׁדַּ֛י נִרְאָֽה־אֵלַ֥י בְּל֖וּז בְּאֶ֣רֶץ כְּנָ֑עַן וַיְבָ֖רֶךְ אֹתִֽי׃", "onk": "וַאֲמַר יַעֲקֹב לְיוֹסֵף אֵל שַׁדַּי <b>אִתְגְּלִי<\/b> לִי בְלוּז בְּאַרְעָא דִכְנָעַן וּבָרִיךְ יָתִי:", "onk_en": "Yaakov said to Yoseif, Almighty Shaddai appeared [<b>became revealed<\/b>] to me in Luz, in the land of Canaan, and He blessed me.", "pj": "וַאֲמַר יַעֲקב לְיוֹסֵף אֵל שַׁדַי אִתְגְלִי לִי בְּלוּז בְּאַרְעָא דִכְנָעַן וּבְרִיךְ יָתִי", "pj_en": "And Jakob said to Joseph: El Shadai revealed Himself to me at Luz, in the land of Kenaan, and blessed me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 48, "v": 4, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֵלַ֗י הִנְנִ֤י מַפְרְךָ֙ וְהִרְבִּיתִ֔ךָ וּנְתַתִּ֖יךָ לִקְהַ֣ל עַמִּ֑ים וְנָ֨תַתִּ֜י אֶת־הָאָ֧רֶץ הַזֹּ֛את לְזַרְעֲךָ֥ אַחֲרֶ֖יךָ אֲחֻזַּ֥ת עוֹלָֽם׃", "onk": "וַאֲמַר לִי הָא אֲנָא מַפֵּישׁ לָךְ וְאַסְגִּנָּךְ וְאֶתְּנִנָּךְ לְכִנְשַׁת <b>שִׁבְטִין<\/b> וָאֶתֵּן יָת אַרְעָא הָדָא לִבְנָךְ בַּתְרָךְ אַחֲסָנַת עֲלָם:", "onk_en": "He said to me, Behold, I will make you fruitful and numerous, and I will make you into an assembly of nations [<b>tribes<\/b>]. I will give this land to your descendants after you for an everlasting possession.", "pj": "וַאֲמַר לִי הָא נָא מַפִּישׁ לָךְ וּמַסְגִי לָךְ וְאִיתְּנִינָךְ לְכִנְשַׁת שִׁבְטִין וְאֶתֵּן יַת אַרְעָא הָדָא לִבְרָךְ בַּתְרָךְ אַחְסָנַת עֲלָם", "pj_en": "And He said to me, Behold, I will increase thee and multiply thee, and make thee an assemblage of tribes, and will give this land to thy sons after thee for an everlasting inheritance.", "tj": "", "tj_en": "", "rashi": "<b>ונתתיך לקהל עמים.<\/b> בִּשְּׂרַנִי שֶׁעֲתִידִים לָצֵאת מִמֶּנִּי עוֹד קָהָל וְעַמִּים, וְאַף עַל פִּי שֶׁאָמַר לִי גּוֹי וּקְהַל גּוֹיִם, גּוֹי אָמַר לִי עַל בִּנְיָמִין; קְהַל גּוֹיִם – הֲרֵי שְׁנַיִם לְבַד מִבִּנְיָמִין, וְשׁוּב לֹא נוֹלַד לִי בֵּן, לִמְּדַנִי שֶׁעָתִיד אֶחָד מִשְּׁבָטַי לְהֵחָלֵק, וְעַתָּה אוֹתָהּ מַתָּנָה אֲנִי נוֹתֵן לְךָ:", "rashi_en": "ונתתיך לקהל עמים AND I WILL MAKE OF THEE AN ASSEMBLY OF PEOPLES — He announced to me that there were yet to issue from me an assembly of peoples (i.e. at least two more tribes). Now, it is true that He then said to me, (Genesis 35:11) “A nation and an assembly of nations [shall be of thee]”, but when He said “a nation” He intended it to refer to Benjamin who was not yet born, and this promise of “a nation” has been fulfilled by the birth of Benjamin, and for that reason I do not mention it now. “An assembly of nations [shall be of thee]”, however, presupposes that two more would descend from me besides Benjamin. Consequently, since no other son besides Benjamin was born to me, He was really telling me that one of my tribes (i.e. the tribe formed by one of my sons) would be divided so as to constitute at least two tribes, thus giving that son more importance, and that privilege I confer upon you (Genesis Rabbah 82:4; Pesikta Rabbati 3)."}, {"ch": 48, "v": 5, "aliyah": 1, "heb": "וְעַתָּ֡ה שְׁנֵֽי־בָנֶ֩יךָ֩ הַנּוֹלָדִ֨ים לְךָ֜ בְּאֶ֣רֶץ מִצְרַ֗יִם עַד־בֹּאִ֥י אֵלֶ֛יךָ מִצְרַ֖יְמָה לִי־הֵ֑ם אֶפְרַ֙יִם֙ וּמְנַשֶּׁ֔ה כִּרְאוּבֵ֥ן וְשִׁמְע֖וֹן יִֽהְיוּ־לִֽי׃", "onk": "וּכְעַן תְּרֵין בְּנָךְ דְּאִתְיְלִידוּ לָךְ בְּאַרְעָא דְמִצְרַיִם עַד מֵיתִי לְוָתָךְ לְמִצְרַיִם דִּילִי אִנּוּן אֶפְרַיִם וּמְנַשֶּׁה כִּרְאוּבֵן וְשִׁמְעוֹן יְהוֹן קֳדָמָי:", "onk_en": "And now your two sons, who were born to you in the land of Egypt before I came to you to Egypt, are mine. Ephraim and Menasheh, like Reuvein and Shimon, shall be mine [<b>before me<\/b>].", "pj": "וּכְדוֹן תְּרֵין בְּנָךְ דְאִתְיְלִידוּ לָךְ בְּאַרְעָא דְמִצְרַיִם עַד דְאָתִית לְוָתָךְ לְמִצְרַיִם דִילִי אִינוּן אֶפְרַיִם וּמְנַשֶׁה כִּרְאוּבֵן וְשִׁמְעוֹן מִתְחַשְׁבִין לִי", "pj_en": "And now, thy two sons who have been born to thee in the land of Mizraim before I came to thee into Mizraim are mine; Ephraim and Menasheh as Reuben and Shimeon shall be reckoned unto me.", "tj": "", "tj_en": "", "rashi": "<b>הנולדים לך, עד באי אליך.<\/b> לִפְנֵי בּוֹאִי אֵלֶיךָ, כְּלוֹמַר, שֶׁנּוֹלְדוּ מִשֶּׁפֵּרַשְׁתָּ מִמֶּנִּי עַד שֶׁבָּאתִי אֶצְלְךָ:<br><br><b>לי הם.<\/b> בְּחֶשְׁבּוֹן שְׁאָר בָּנַי הֵם, לִטֹּל חֵלֶק בָּאָרֶץ אִישׁ כְּנֶגְדּוֹ:", "rashi_en": "הנולדים לך עד באי אליך literally, WHO WERE BORN TO THEE . . . UNTIL I CAME TO THEE, i.e. before I came to thee. It signifies as much as: WHO WERE BORN from the time when you left me UNTIL THE TIME WHEN I CAME TO YOU. לי הם THEY SHALL BE MINE — they shall be counted amongst my other sons, to receive a portion in the Land each for himself (i.e. each to have his own territory exactly as each of my other sons has). <br><br>לי הם THEY SHALL BE MINE — they shall be counted amongst my other sons, to receive a portion in the Land each for himself (i.e. each to have his own territory exactly as each of my other sons has)."}, {"ch": 48, "v": 6, "aliyah": 1, "heb": "וּמוֹלַדְתְּךָ֛ אֲשֶׁר־הוֹלַ֥דְתָּ אַחֲרֵיהֶ֖ם לְךָ֣ יִהְי֑וּ עַ֣ל שֵׁ֧ם אֲחֵיהֶ֛ם יִקָּרְא֖וּ בְּנַחֲלָתָֽם׃", "onk": "וּבְנָךְ דִּי תוֹלִיד בַּתְרֵיהוֹן דִּילָךְ יְהוֹן עַל שׁוּם אֲחוּהוֹן יִתְקְרוּן בְּאַחֲסַנְתְּהוֹן:", "onk_en": "But your progeny that will be born after them shall be yours. They shall be called by their brother’s name with regard to their inheritance.", "pj": "וּבְנָךְ דִי תוֹלִיד בַּתְרֵיהוֹן דִילָךְ יְהוֹן עַל שׁוּם אֲחֵיהוֹן יִתְקְרוּן בְּאַחְסַנְתְּהוֹן", "pj_en": "And thy children whom thou mayest beget after them shall be thine; by the name of their brethren shall they be called in their inheritance.", "tj": "", "tj_en": "", "rashi": "<b>ומולדתך וגו'.<\/b> אִם תּוֹלִיד עוֹד, לֹא יִהְיוּ בְּמִנְיַן בָּנַי, אֶלָּא בְּתוֹךְ שִׁבְטֵי אֶפְרַיִם וּמְנַשֶּׁה יִהְיוּ נִכְלָלִים, וְלֹא יְהֵא לָהֶם שֵׁם בַּשְּׁבָטִים לְעִנְיַן הַנַּחֲלָה; וְאַף עַל פִּי שֶׁנֶּחְלְקָה הָאָרֶץ לְמִנְיַן גֻּלְגְּלוֹתָם, כְּדִכְתִיב לָרַב תַּרְבֶּה נַחֲלָתוֹ (במדבר כ\"ו), וְכָל אִישׁ וְאִישׁ נָטַל בְּשָׁוֶה חוּץ מִן הַבְּכוֹרוֹת, מִכָּל מָקוֹם לֹא נִקְרְאוּ שְׁבָטִים אֶלָּא אֵלּוּ, (לְהַטִּיל גּוֹרַל הָאָרֶץ לְמִנְיַן שְׁמוֹת הַשְּׁבָטִים וְנָשִׂיא לְכָל שֵׁבֶט וָשֵׁבֶט וּדְגָלִים לָזֶה וְלָזֶה):", "rashi_en": "Although the Land was divided according to the number of heads — as it is written, (Numbers 26:54) “To the more numerous thou shalt give a larger inheritance” — and each person had an equal share except those who were first-born sons (and these received a double share), yet only these of Joseph’s sons bore the name of “tribe” when it became a matter of casting lots for the partition of the land according to the number of the tribes (cf. Numbers 26:55), and of appointing princes to the various tribes and of assigning banners to each of them. "}, {"ch": 48, "v": 7, "aliyah": 1, "heb": "וַאֲנִ֣י&thinsp;<b>׀<\/b> בְּבֹאִ֣י מִפַּדָּ֗ן מֵ֩תָה֩ עָלַ֨י רָחֵ֜ל בְּאֶ֤רֶץ כְּנַ֙עַן֙ בַּדֶּ֔רֶךְ בְּע֥וֹד כִּבְרַת־אֶ֖רֶץ לָבֹ֣א אֶפְרָ֑תָה וָאֶקְבְּרֶ֤הָ שָּׁם֙ בְּדֶ֣רֶךְ אֶפְרָ֔ת הִ֖וא בֵּ֥ית לָֽחֶם׃", "onk": "וַאֲנָא בְּמֵיתִי מִפַּדָּן מֵיתַת עֲלַי רָחֵל בְּאַרְעָא דִכְנַעַן בְּאָרְחָא בְּעוֹד כְּרוּבָא דְאַרְעָא לְמֵיעַל לְאֶפְרָת וּקְבָרִתַּהּ תַּמָּן בְּאֹרַח אֶפְרָת הִיא בֵּית לָחֶם:", "onk_en": "And I, when I came from Padan, Rochel died unto me in the land of Canaan, on the road, when there was yet a stretch of land, before coming to Ephros. I buried her there on the road to Ephros, which is Beis Lechem.", "pj": "וַאֲנָא דְבָּעִיתִי מִינָךְ לְמִקְבְּרִי עִם אַבְהָתַי מִיתַת עָלַי רָחֵל בִּתְכֵּיף בְּאַרְעָא דִכְנָעַן בְּאוֹרְחָא בְּעוֹד סוֹגְעֵי אַרְעָא לְמֵיעוּל לְאֶפְרָת וְלָא יְכֵילִית לְסוֹבְרוּתָהּ לְמִקְבְּרָהּ בִּמְעָרַת כְּפֵילְתָּא וּקְבַרְתָּהּ תַּמָן בְּאוֹרַח אֶפְרָת הִיא בֵּית לָחֶם", "pj_en": "And I beseech thee to bury me with my fathers. Rahel died by me suddenly in the land of Kenaan, while there was yet much ground to come to Ephrath; nor could I carry her to bury her in the Double Cave, but I buried her there, in the way of Ephrath which is Bethlechem.", "tj": "", "tj_en": "", "rashi": "<b>ואני בבאי מפדן וגו'.<\/b> וְאַעַ\"פִּ שֶׁאֲנִי מַטְרִיחַ עָלֶיךָ לְהוֹלִיכֵנִי לְהִקָּבֵר בְּאֶרֶץ כְּנַעַן, וְלֹא כָךְ עָשִׂיתִי לְאִמְּךָ, שֶׁהֲרֵי מֵתָה סָמוּךְ לְבֵית לֶחֶם:<br><br><b>כברת ארץ.<\/b> מִדַּת אֶרֶץ, וְהֵם אַלְפַּיִם אַמָּה כְּמִדַּת תְּחוּם שַׁבָּת, כְּדִבְרֵי רַבִּי מֹשֶׁה הַדַּרְשָׁן – וְלֹא תֹאמַר שֶׁעִכְּבוּ עָלַי גְּשָׁמִים מִלְּהוֹלִיכָהּ וּלְקָבְרָהּ בְּחֶבְרוֹן, עֵת הַגָּרִיד הָיָה, שֶׁהָאָרֶץ חֲלוּלָה וּמְנֻקֶּבֶת כִּכְבָרָה:<br><br><b>אקברה שם.<\/b> וְלֹא הוֹלַכְתִּיהָ אֲפִלּוּ לְבֵית לֶחֶם לְהַכְנִיסָהּ לָאָרֶץ, וְיָדַעְתִּי שֶׁיֵּשׁ בְּלִבְּךָ עָלַי; אֲבָל דַּע לְךָ שֶׁעַל פִּי הַדִּבּוּר קְבַרְתִּיהָ שָׁם, שֶׁתְּהֵא לְעֶזְרָה לְבָנֶיהָ כְּשֶׁיַּגְלֶה אוֹתָם נְבוּזַרְאֲדָן, וְהָיוּ עוֹבְרִים דֶּרֶךְ שָׁם, יוֹצֵאת רָחֵל עַל קִבְרָהּ וּבוֹכָה וּמְבַקֶּשֶׁת עֲלֵיהֶם רַחֲמִים, שֶׁנֶּאֱמַר קוֹל בְּרָמָה נִשְׁמָע וְגוֹ' וְהַקָּבָּ\"ה מְשִׁיבָהּ יֵשׁ שָׂכָר לִפְעֻלָּתֵךְ נְאֻם ה' וְשָׁבוּ בָנִים לִגְבוּלָם (ירמיהו ל\"א). וְאֻנְקְלוֹס תִּרְגֵּם כְּרוּב אַרְעָא – כְּדֵי שִׁעוּר חֲרִישַׁת יוֹם; וְאוֹמֵר אֲנִי, שֶׁהָיָה לָהֶם קֶצֶב שֶׁהָיוּ קוֹרִין אוֹתוֹ כְּדֵי מַחֲרֵשָׁה אַחַת, קורדיי\"א בְּלַעַז, כִּדְאָמְרִינַן כָּרֵיב וְתָנֵי; כְּמָה דְּמַסִּיק תַּעֲלָא מִבֵּי כַּרְבָּא:", "rashi_en": "'ואני בבאי מפדן וגו AND AS FOR ME, WHEN I CAME FROM PADAN etc. — “And although I trouble you to take me for burial into the land of Canaan and I did not do this for your mother (i.e., I did not take the trouble to bury her in a place other than that in which she died, which was by the road-side) which I might easily have done since she died quite close to Bethlehem”.<br><br>כברת ארץ is a measure of land equal to 2000 cubits which is the extent of a Sabbath day’s journey. This is according to the statement of R. Moses the Expositor. — “Do not imagine that it was the rains which prevented me from bringing her to Hebron for burial. It was the dry season when the ground is riddled and full of holes like a sieve (כברה).<br><br>ואקברה שם AND I BURIED HER THERE and did not carry her even the short distance to Bethlehem to bring her into a city. I know that in your heart you feel some resentment against me. Know, however, that I buried her there by the command of God”. And the future proved that God had commanded him to do this in order that she might help her children when Nebuzaradan would take them into captivity. For when they were passing along that road Rachel came forth from her grave and stood by her tomb weeping and beseeching mercy for them, as it is said, (Jeremiah 31:15) “A voice is heard in Rama, [the sound of weeping … Rachel weeping for her children]”, and the Holy One, blessed be He, replied to her (v. 16) “There is a reward for thy work, says the Lord etc. (v. 17) for thy children will return to their own border”. Onkelos translated it (כברת ארץ) by כרוב ארעא which is a full measure of one day’s ploughing. I am of opinion that they had a definite measure which they called “one full furrow”; old French cordié. So we say, (Bava Metzia 107a) “He ploughs (כריב) and ploughs again”, and (Yoma 43b) “as much earth as a fox carries on its feet from a ploughed field (בי כרבא).”"}, {"ch": 48, "v": 8, "aliyah": 1, "heb": "וַיַּ֥רְא יִשְׂרָאֵ֖ל אֶת־בְּנֵ֣י יוֹסֵ֑ף וַיֹּ֖אמֶר מִי־אֵֽלֶּה׃", "onk": "וַחֲזָא יִשְׂרָאֵל יָת בְּנֵי יוֹסֵף וַאֲמַר מַן אִלֵּין:", "onk_en": "Yisrael saw Yoseif’s sons, and he said, Who are these?", "pj": "וַחֲמָא יִשְרָאֵל יַת בְּנוֹי דְיוֹסֵף וַאֲמַר מִן מַאן אִתְיְלִידוּ לָךְ אִלֵין", "pj_en": "And Israel looked at the sons of Joseph and said, From whom are these born to thee?", "tj": "", "tj_en": "", "rashi": "<b>וירא ישראל את בני יוסף.<\/b> בִּקֵּשׁ לְבָרְכָם וְנִסְתַּלְּקָה שְׁכִינָה מִמֶּנּוּ, לְפִי שֶׁעָתִיד יָרָבְעָם וְאַחְאָב לָצֵאת מֵאֶפְרַיִם וְיֵהוּא וּבָנָיו מִמְּנַשֶּׁה:<br><br><b>ויאמר מי אלה.<\/b> מֵהֵיכָן יָצְאוּ אֵלּוּ, שֶׁאֵינָן רְאוּיִין לִבְרָכָה:", "rashi_en": "וירא ישראל את בני יוסף  AND ISRAEL SAW JOSEPH’S SONS — he wished to bless them but the Divine Presence departed from him because he saw that from Ephraim would be born the wicked kings Jeroboam and Ahab, and from Manasseh Jehu and his sous (Midrash Tanchuma, Vayechi 6).<br><br>ויאמר מי אלה AND HE SAID “WHO ARE THESE?” — Whence come these who are unfitted for blessing?"}, {"ch": 48, "v": 9, "aliyah": 1, "heb": "וַיֹּ֤אמֶר יוֹסֵף֙ אֶל־אָבִ֔יו בָּנַ֣י הֵ֔ם אֲשֶׁר־נָֽתַן־לִ֥י אֱלֹהִ֖ים בָּזֶ֑ה וַיֹּאמַ֕ר קָֽחֶם־נָ֥א אֵלַ֖י וַאֲבָרְכֵֽם׃", "onk": "וַאֲמַר יוֹסֵף לַאֲבוּהִי בְּנַי אִנּוּן דִּיהַב לִי יְיָ <b>הָכָא<\/b> וַאֲמַר <b>קָרֵבִנּוּן כְּעַן<\/b> לְוָתִי וְאֵבָרֵכִנּוּן:", "onk_en": "Yoseif said to his father, These are my sons, whom Elohim has given me in this [place] [<b>here<\/b>]. He [Yaakov] said, Please Take [<b>Now bring<\/b>] them [<b>near<\/b>] to me, and I will bless them.", "pj": "וַאֲמַר יוֹסֵף לְאָבוּי בְּנַיי הִינוּן דִיהַב לִי מֵימְרָא דַיְיָ כְּדֵין כְּתָבָא דְעָלֵיהּ נְסֵיבִית יַת אָסְנַת בְּרַת דִינָה בְּרַתָּךְ לְאִינְתּוּ וַאֲמַר קָרֵבִינוֹן כְּדוֹן לְוָתִי וְאֵיבָרִיכִינוּן", "pj_en": "And Joseph answered his father, They are my sons which the Word of the Lord gave me according to this writing, according to which I took Asenath the daughter of Dinah thy daughter to be my wife. And he said, Bring them now near to me, and I will bless them.", "tj": "", "tj_en": "", "rashi": "<b>בזה.<\/b> הֶרְאָה לוֹ שְׁטָר אֵרוּסִין וּשְׁטָר כְּתֻבָּה, וּבִקֵּשׁ יוֹסֵף רַחֲמִים עַל הַדָּבָר, וְנָחָה עָלָיו רוּחַ הַקֹּדֶשׁ:<br><br><b>ויאמר קחם נא אלי ואברכם.<\/b> זֶהוּ שֶׁאָמַר הַכָּתוּב וְאָנֹכִי תִרְגַּלְתִּי לְאֶפְרַיִם קָחָם עַל זְרוֹעֹתָיו (הושע י\"א) – תִּרְגַּלְתִּי רוּחִי בְּיַעֲקֹב בִּשְׁבִיל אֶפְרַיִם עַד שֶׁלְּקָחָן עַל זְרוֹעוֹתָיו:", "rashi_en": "בָּזֶה IN THIS PLACE (literally, by this, or by means of this) — He showed him the contract of betrothal and the contract of marriage (evidence that their mother had adopted the faith of Israel, and that his and her offspring were of their faith) and Joseph prayed to God about the matter and the Holy Spirit again rested upon him (Jacob) (Midrash Tanchuma, Vayechi 6).<br><br>ויאמר קחם נא אלי ואברכם AND HE SAID, BRING THEM, I PRAY THEE, UNTO ME, AND I WILL BLESS THEM — It is to this that the text alludes, (Hosea 11:3) “And I, תרגלתי לאפרים taking them (קחם) upon his arms”, meaning, I made My Spirit once again a familiar thing (תרגלתי) in Jacob for Ephraim’s sake until he took them (him and Manasseh) upon his arms (cf. Midrash Tanchuma, Vayechi 6)."}, {"ch": 48, "v": 10, "aliyah": 2, "heb": "וְעֵינֵ֤י יִשְׂרָאֵל֙ כָּבְד֣וּ מִזֹּ֔קֶן לֹ֥א יוּכַ֖ל לִרְא֑וֹת וַיַּגֵּ֤שׁ אֹתָם֙ אֵלָ֔יו וַיִּשַּׁ֥ק לָהֶ֖ם וַיְחַבֵּ֥ק לָהֶֽם׃", "onk": "וְעֵינֵי יִשְׂרָאֵל יְקָרָן מִסֵּיבוּ לָא יִכּוּל לְמֶחֱזֵי וְקָרִיב יָתְהוֹן לְוָתֵיהּ וְנַשִּׁיק לְהוֹן וְגַפִּיף לְהוֹן:", "onk_en": "Yisrael’s eyes were heavy with age, and he could not see. He [Yoseif] brought them near to him, and he kissed them and hugged them.", "pj": "וְעֵינֵי יִשְרָאֵל יְקָרָן מִן סֵיבוּ וְלָא יָכִיל לְמֵיחְמֵי וּקְרִיב יַתְהוֹן לְוָתֵיהּ וּנְשַׁק לְהוֹן וְגַפֵיף לְהוֹן", "pj_en": "But Israel's eyes were heavy from age, and he could not see. And he brought them to him, and he kissed them and embraced them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 48, "v": 11, "aliyah": 2, "heb": "וַיֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל־יוֹסֵ֔ף רְאֹ֥ה פָנֶ֖יךָ לֹ֣א פִלָּ֑לְתִּי וְהִנֵּ֨ה הֶרְאָ֥ה אֹתִ֛י אֱלֹהִ֖ים גַּ֥ם אֶת־זַרְעֶֽךָ׃", "onk": "וַאֲמַר יִשְׂרָאֵל לְיוֹסֵף לְמֶחֱזֵי אַפָּיךְ לָא סְבָרִית וְהָא אַחֲזִי יָתִי יְיָ אַף יָת בְּנָךְ:", "onk_en": "Yisrael said to Yoseif, I have never thought to see your face, and behold Elohim has even allowed me to see your offspring.", "pj": "וַאֲמַר יִשְרָאֵל לְיוֹסֵף מֵיחְמֵי סְבַר אַפָּךְ לָא חֲשִׁיבִית וְהָא אַחְמֵי יָתִי יְיָ אוּף יַת בְּנָךְ", "pj_en": "And Israel said to Joseph, To see thy face I had not reckoned, but, behold, the Lord hath also showed me thy sons.", "tj": "", "tj_en": "", "rashi": "<b>לא פללתי.<\/b> לֹא מְלָאַנִי לִבִּי לַחֲשֹׁב מַחֲשָׁבָה שֶׁאֶרְאֶה פָנֶיךָ עוֹד. <b>פללתי<\/b> לְשׁוֹן מַחֲשָׁבָה, כְּמוֹ הָבִיאִי עֵצָה עֲשׂוּ פְלִילָה (ישעיהו ט\"ז ג'):", "rashi_en": "לא פללתי I HAD NOT CONTEMPLATED — I had never dared to cherish the thought that I would again see your face. פללתי is an expression for thinking, like the noun in (Isaiah 16:3) “Give counsel, carry out the thought (פלילה)”. "}, {"ch": 48, "v": 12, "aliyah": 2, "heb": "וַיּוֹצֵ֥א יוֹסֵ֛ף אֹתָ֖ם מֵעִ֣ם בִּרְכָּ֑יו וַיִּשְׁתַּ֥חוּ לְאַפָּ֖יו אָֽרְצָה׃", "onk": "וְאַפֵּיק יוֹסֵף יָתְהוֹן מִן <b>קֳדָמוֹהִי<\/b> וּסְגִיד עַל אַפּוֹהִי עַל אַרְעָא:", "onk_en": "Yoseif brought them out from between his knees [<b>before him<\/b>], and he prostrated himself with his face to the ground.", "pj": "וְאַפֵּיק יוֹסֵף יַתְהוֹן מִלְוַת רְכוּבוֹי וּסְגִיד עַל אַפּוֹי עַל אַרְעָא", "pj_en": "And Joseph brought them out from (between) his knees, and worshipped on his face upon the ground.", "tj": "", "tj_en": "", "rashi": "<b>ויוצא יוסף אתם.<\/b> לְאַחַר שֶׁנְּשָׁקָם הוֹצִיאָם יוֹסֵף מֵעִם בִּרְכָּיו, כְּדֵי לְיַשְּׁבָם זֶה לַיָּמִין וְזֶה לַשְּׂמֹאל לִסְמֹךְ יָדָיו עֲלֵיהֶם וּלְבָרְכָם:<br><br><b>וישתחו לאפיו.<\/b> כְּשֶׁחָזַר לַאֲחוֹרָיו מִלִּפְנֵי אָבִיו:", "rashi_en": "ויוצא יוסף אתם AND JOSEPH BROUGHT THEM OUT — After he (Jacob) had kissed them, Joseph brought them out from between his knees in order to place them one at the right and the other on the left in order that Jacob might thus lay his hands upon them and bless them<br><br>וישתחו לאפיו AND HE PROSTRATED HIMSELF BEFORE HIS FACE — after he had stepped backwards from before his father. "}, {"ch": 48, "v": 13, "aliyah": 2, "heb": "וַיִּקַּ֣ח יוֹסֵף֮ אֶת־שְׁנֵיהֶם֒ אֶת־אֶפְרַ֤יִם בִּֽימִינוֹ֙ מִשְּׂמֹ֣אל יִשְׂרָאֵ֔ל וְאֶת־מְנַשֶּׁ֥ה בִשְׂמֹאל֖וֹ מִימִ֣ין יִשְׂרָאֵ֑ל וַיַּגֵּ֖שׁ אֵלָֽיו׃", "onk": "וּדְבַר יוֹסֵף יָת תַּרְוֵיהוֹן יָת אֶפְרַיִם בִּימִינֵיהּ מִסְּמָאלָא דְיִשְׂרָאֵל וְיָת מְנַשֶּׁה בִסְּמָאלֵיהּ מִימִינָא דְיִשְׂרָאֵל וְקָרֵיב לְוָתֵיהּ:", "onk_en": "Yoseif took the two [of them]—Ephraim in his right [hand], toward Yisrael’s left, and Menasheh in his left, toward Yisrael’s right—and he brought them near to him.", "pj": "וּדְבַר יוֹסֵף יַת תַּרְוֵיהוֹם יַת אֶפְרַיִם מִן צְטַר יְמִינֵיהּ דְהוּא שְמָאלֵיהּ דְיִשְרָאֵל וְיַת מְנַשֶׁה מִן צְטַר שְמָאלֵיהּ דְהוּא יְמִינָא דְיִשְרָאֵל וּקְרֵיב לְוָותֵיהּ", "pj_en": "And Joseph took both of them, Ephraim on his right side, which was Israel's left, and Menasheh on his left side, which was Israel's right, and brought them to him.", "tj": "", "tj_en": "", "rashi": "<b>את אפרים בימינו משמאל ישראל.<\/b> הַבָּא לִקְרַאת חֲבֵרוֹ, יְמִינוֹ כְּנֶגֶד שְׂמֹאל חֲבֵרוֹ, וְכֵיוָן שֶׁהוּא הַבְּכוֹר, מְיֻמָּן לִבְרָכָה:", "rashi_en": "את אפרים בימינו משמאל ישראל EPHRAIM ON HIS RIGHT HAND TOWARDS ISRAEL’S LEFT — If one is moving towards another person his right hand is opposite the other’s left. Now since he (Manasseh) was the first-born he was marked out for the blessing and should have been placed at Jacob’s right hand. "}, {"ch": 48, "v": 14, "aliyah": 2, "heb": "וַיִּשְׁלַח֩ יִשְׂרָאֵ֨ל אֶת־יְמִינ֜וֹ וַיָּ֨שֶׁת עַל־רֹ֤אשׁ אֶפְרַ֙יִם֙ וְה֣וּא הַצָּעִ֔יר וְאֶת־שְׂמֹאל֖וֹ עַל־רֹ֣אשׁ מְנַשֶּׁ֑ה שִׂכֵּל֙ אֶת־יָדָ֔יו כִּ֥י מְנַשֶּׁ֖ה הַבְּכֽוֹר׃", "onk": "וְאוֹשִׁיט יִשְׂרָאֵל יָת יְמִינֵיהּ וְשַׁוִּי עַל רֵישָׁא דְאֶפְרַיִם וְהוּא זְעֵירָא וְיָת סְמָאלֵיהּ עַל רֵישָׁא דִמְנַשֶּׁה אַחְכִּימִנּוּן לִידוֹהִי אֲרֵי מְנַשֶּׁה בּוּכְרָא:", "onk_en": "Yisrael stretched out his right [hand] and placed it on the head of Ephraim, [although] he was the younger, and his left [hand] on the head of Menasheh. He deliberately placed his hands so, even though Menasheh was the firstborn.", "pj": "וְאוֹשִׁיט יִשְרָאֵל יַת יְמִינֵיהּ וְשַׁוִי עַל רֵישָׁא דְאֶפְרַיִם וְהוּא זְעֵירָא וְיַת שְמָאלֵיהּ עַל רֵישָׁא דִמְנַשֶׁה פְּרַג יַת יְדוֹי אֲרוּם מְנַשֶׁה בּוּכְרָא", "pj_en": "And Israel stretched out his right hand and laid it upon the head of Ephraim, though he was the younger; and his left hand upon the head of Menasheh, altering his hands, for Menasheh was the firstborn.", "tj": "פְּרַג יַת יְדוֹי:", "tj_en": "He altered his hands.", "rashi": "<b>שכל את ידיו.<\/b> כְּתַרְגּוּמוֹ, אַחְכִּימִינוּן – בְּהַשְׂכֵּל וְחָכְמָה הִשְׂכִּיל אֶת יָדָיו לְכָךְ וּמִדַּעַת, כִּי יוֹדֵעַ הָיָה כִּי מְנַשֶּׁה הַבְּכוֹר וְאַעַ\"פִּ כֵן לֹא שָׁת יְמִינוֹ עָלָיו:", "rashi_en": "שכל את ידיו PLACING HIS HANDS DESIGNEDLY — Understand this as the Targum renders it: אחכמינון he put wisdom into them (viz., into his hands), meaning designedly and wisely he moved his hands for this purpose, intelligently and with full knowledge, for he knew that Manasseh was the first-born and yet he did not place his right hand upon him. "}, {"ch": 48, "v": 15, "aliyah": 2, "heb": "וַיְבָ֥רֶךְ אֶת־יוֹסֵ֖ף וַיֹּאמַ֑ר הָֽאֱלֹהִ֡ים אֲשֶׁר֩ הִתְהַלְּכ֨וּ אֲבֹתַ֤י לְפָנָיו֙ אַבְרָהָ֣ם וְיִצְחָ֔ק הָֽאֱלֹהִים֙ הָרֹעֶ֣ה אֹתִ֔י מֵעוֹדִ֖י עַד־הַיּ֥וֹם הַזֶּֽה׃", "onk": "וּבָרִיךְ יָת יוֹסֵף וַאֲמָר יְיָ דִּי <b>פְלָחוּ<\/b> אֲבָהָתַי קֳדָמוֹהִי אַבְרָהָם וְיִצְחָק יְיָ <b>דְּזַן<\/b> יָתִי מִדְּאִיתָנִי עַד יוֹמָא הָדֵין:", "onk_en": "He blessed Yoseif and said, Elohim before whom my fathers walked [<b>served<\/b>], Avraham, and Yitzchok, Elohim who was my shepherd [<b>sustainer<\/b>] from my inception until this day—", "pj": "וּבְרִיךְ יַת יוֹסֵף וַאֲמַר יְיָ דִי פְלָחוּ אַבְהָתַי קֳדָמוֹי אַבְרָהָם וְיִצְחָק יְיָ דְאֵיזַן יָתִי מִדְאִיתְנִי עַד יוֹמָא הָדֵין", "pj_en": "And he blessed Joseph, and said: The Lord, before whom my fathers Abraham and Izhak, did serve; the Lord who hath fed me since I have been unto this day,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 48, "v": 16, "aliyah": 2, "heb": "הַמַּלְאָךְ֩ הַגֹּאֵ֨ל אֹתִ֜י מִכׇּל־רָ֗ע יְבָרֵךְ֮ אֶת־הַנְּעָרִים֒ וְיִקָּרֵ֤א בָהֶם֙ שְׁמִ֔י וְשֵׁ֥ם אֲבֹתַ֖י אַבְרָהָ֣ם וְיִצְחָ֑ק וְיִדְגּ֥וּ לָרֹ֖ב בְּקֶ֥רֶב הָאָֽרֶץ׃", "onk": "מַלְאָכָא דִּי פְרַק יָתִי מִכָּל בִּישָׁא יְבָרֵךְ יָת עוּלֵימַיָּא וְיִתְקְרֵי בְהוֹן שְׁמִי וְשׁוּם אֲבָהָתַי אַבְרָהָם וְיִצְחָק וּכְנוּנֵי <b>יַמָּא<\/b> יִסְגּוּן <b>בְּגוֹ בְנֵי אֱנָשָׁא עַל<\/b> אַרְעָא:", "onk_en": "The Angel who redeemed me from all evil, should bless the lads, and let my name be called on them, together with the name of my fathers, Avraham and Yitzchok. May they be like fish [<b>of the sea<\/b>], multiplying within [<b>amongst people upon<\/b>] the land.", "pj": "יְהֵי רַעֲוָא קֳדָמָךְ דְמַלְאָכָא דְזַמִינְתָּא לִי לְמִפְרַק יָתִי מִכָּל בִּישָׁא יְבָרֵךְ יַת טַלְיָיא וְיִתְקְרִי בְהוֹן שְׁמִי וְשׁוּם אַבְהָתַי אַבְרָהָם וְיִצְחָק וְהֵיכְמָא דְכַוְורֵי יַמָא סַגִי מִסְתְּגֵי בְמַיָא כְּדֵין בְּנוֹי דְיוֹסֵף יִתְקְפוּן לִסְגֵי בְּגוֹ אַרְעָא", "pj_en": "be pleased that the angel whom thou didst ordain for me, to redeem me from all evil, may bless the children; and let my name be called upon them, and the names of my fathers Abrabam and Izhak. And as the fishes of the sea in multiplying are multiplied in the sea, so may the children of Joseph be multiplied abundantly in the midst of the earth.", "tj": "", "tj_en": "", "rashi": "<b>המלאך הגאל אתי.<\/b> מַלְאָךְ הָרָגִיל לְהִשְׁתַּלֵּחַ אֵלַי בְּצָרָתִי; כָּעִנְיָן שֶׁנֶּאֱמַר וַיֹּאמֶר אֵלַי מַלְאַךְ הָאֱלֹהִים בַּחֲלוֹם יַעֲקֹב וְגוֹ' אָנֹכִי הָאֵל בֵּית אֵל (בראשית ל\"א):<br><br><b>יברך את הנערים.<\/b> מְנַשֶּׁה וְאֶפְרַיִם:<br><br><b>וידגו.<\/b> כַּדָּגִים הַלָּלוּ שֶׁפָּרִים וְרָבִים וְאֵין עַיִן הָרָע שׁוֹלֶטֶת בָּהֶם:", "rashi_en": "המלאך הגאל אתי THE ANGEL REDEEMING ME — The angel who was usually sent to me in my trouble, as it is said, (Genesis 31:11) “And the angel of God said unto me in the dream: Jacob etc. … (Genesis 31:13), I am the God of Beth-el.”<br><br>יברך את הנערים SHALL BLESS THE LADS — viz, Manasseh and Ephraim.<br><br>וידגו AND LET THEM INCREASE — like fishes (דגים) which are fruitful and which multiply and which the evil eye cannot effect (Berakhot 20a). "}, {"ch": 48, "v": 17, "aliyah": 3, "heb": "וַיַּ֣רְא יוֹסֵ֗ף כִּי־יָשִׁ֨ית אָבִ֧יו יַד־יְמִינ֛וֹ עַל־רֹ֥אשׁ אֶפְרַ֖יִם וַיֵּ֣רַע בְּעֵינָ֑יו וַיִּתְמֹ֣ךְ יַד־אָבִ֗יו לְהָסִ֥יר אֹתָ֛הּ מֵעַ֥ל רֹאשׁ־אֶפְרַ֖יִם עַל־רֹ֥אשׁ מְנַשֶּֽׁה׃", "onk": "וַחֲזָא יוֹסֵף אֲרֵי שַׁוִּי אָבוּהִי יַד יְמִינֵיהּ עַל רֵישָׁא דְאֶפְרַיִם וּבְאֵישׁ בְּעֵינוֹהִי וּסְעֵד יְדָא דְאָבוּהִי לְאַעֲדָאָה יָתַהּ מֵעַל רֵישָׁא דְאֶפְרַיִם לְאַנָּחוּתַהּ עַל רֵישָׁא דִמְנַשֶּׁה:", "onk_en": "Yoseif saw that his father placed his right hand on Ephraim’s head, and it was bad in his eyes. He held up his fathers hand, to remove it from Ephraim’s head [and to place it] on Menasheh’s head.", "pj": "וַחֲמָא יוֹסֵף אֲרוּם מְשַׁוִי אָבוּי יַת יַד יְמִינֵיהּ עַל רֵישָׁא דְאֶפְרָיִם וּבְאִישׁ קֳדָמוֹי וְסַעֲדָא לְיָדָא דְאָבוּי לְאַעְדָאָה יָתָהּ מֵעַל רֵישָׁא דְאֶפְרָיִם לְאַנְחוּתֵיהּ עַל רֵישָׁא דִמְנַשֶׁה", "pj_en": "And Joseph saw that his father placed his right hand upon Ephraim's head; and it was evil before him, and he uplifted his father's hand to remove it from off the head of Ephraim, that it might rest on the head of Menasheh.", "tj": "", "tj_en": "", "rashi": "<b>ויתמך יד אביו.<\/b> הֵרִימָהּ מֵעַל רֹאשׁ בְּנוֹ וּתְמָכָהּ בְּיָדוֹ:", "rashi_en": "ויתמך יד אביו; HE HELD UP HIS FATHER’S HAND — He lifted it up from his son’s head and upheld it in his hand to remove it etc. "}, {"ch": 48, "v": 18, "aliyah": 3, "heb": "וַיֹּ֧אמֶר יוֹסֵ֛ף אֶל־אָבִ֖יו לֹא־כֵ֣ן אָבִ֑י כִּי־זֶ֣ה הַבְּכֹ֔ר שִׂ֥ים יְמִינְךָ֖ עַל־רֹאשֽׁוֹ׃", "onk": "וַאֲמַר יוֹסֵף לְאָבוּהִי לָא כֵן אַבָּא אֲרֵי דֵין בּוּכְרָא שַׁו יְמִינָךְ עַל רֵישֵׁיהּ:", "onk_en": "Yoseif said to his father, Not so, my father, for this one is the firstborn, place your right hand on his head.", "pj": "וַאֲמַר יוֹסֵף לְאָבוּי לָא כְדֵין אַבָּא אֲרוּם דֵין בּוּכְרָא שַׁוִי יַד יְמִינָךְ עַל רֵישֵׁיהּ", "pj_en": "And Joseph said to his father, Not so, my father, for this is the firstborn; lay thy right hand on his head.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 48, "v": 19, "aliyah": 3, "heb": "וַיְמָאֵ֣ן אָבִ֗יו וַיֹּ֙אמֶר֙ יָדַ֤עְתִּֽי בְנִי֙ יָדַ֔עְתִּי גַּם־ה֥וּא יִֽהְיֶה־לְּעָ֖ם וְגַם־ה֣וּא יִגְדָּ֑ל וְאוּלָ֗ם אָחִ֤יו הַקָּטֹן֙ יִגְדַּ֣ל מִמֶּ֔נּוּ וְזַרְע֖וֹ יִהְיֶ֥ה מְלֹֽא־הַגּוֹיִֽם׃", "onk": "וְסָרֵיב אָבוּהִי וַאֲמַר יְדַעְנָא בְרִי יְדַעְנָא אַף הוּא יְהֵי לְעַמָּא וְאַף הוּא יִסְגֵּי וּבְרַם אָחוּהִי זְעִירָא יִסְגֵּי מִנֵּיהּ וּבְנוֹהִי יְהוֹן <b>שַׁלִּיטִין<\/b> בְּעַמְמַיָּא:", "onk_en": "His father refused, and he said, I know my son, I know. He too will become a people, he too will become great; however his younger brother will be greater than he, and [the fame] of his descendants will fill [<b>rule<\/b>] the nations.", "pj": "וְסָרֵב אָבוּי וַאֲמַר יָדַעְנָא בְּרִי יָדַעְנָא דְהוּא בּוּכְרָא אוּף חֲכִּימְנָא דְאוּף הוּא יְהֵי לְעַם רַב וְאוּף הוּא יִסְגֵי וּבְרַם אָחוֹי קַלִילָא יַסְגֵי יַתִּיר מִנֵיהּ וּבְנוֹי יְהוֹן סַגִיאִין בְּעַמְמַיָא", "pj_en": "But his father was not willing, and said, I know, my son, I know that he is the firstborn, and also that he will be a great people, and will also be multiplied; yet will his younger brother be greater than he, and his sons be greater among the nations.", "tj": "", "tj_en": "", "rashi": "<b>ידעתי בני ידעתי.<\/b> שֶׁהוּא הַבְּכוֹר:<br><br><b>גם הוא יהיה לעם וגם הוא יגדל.<\/b> שֶׁעָתִיד גִּדְעוֹן לָצֵאת מִמֶּנּוּ, שֶׁהַקָּבָּ\"ה עוֹשֶׂה נֵס עַל יָדוֹ:<br><br><b>ואולם אחיו הקטן יגדל ממנו.<\/b> שֶׁעָתִיד יְהוֹשֻׁעַ לָצֵאת מִמֶּנּוּ, שֶׁיַּנְחִיל אֶת הָאָרֶץ וִילַמֵּד תּוֹרָה לְיִשְׂרָאֵל:<br><br><b>וזרעו יהיה מלא הגוים.<\/b> כָּל הָעוֹלָם יִתְמַלֵּא בְּצֵאת שָׁמְעוֹ וּשְׁמוֹ כְּשֶׁיַּעֲמִיד חַמָּה בְּגִבְעוֹן וְיָרֵחַ בְּעֵמֶק אַיָּלוֹן:", "rashi_en": "ידעתי בני ידעתי I KNOW IT, MY SON, I KNOW that he is the first-born.<br><br>גם הוא יהיה לעם וגם הוא יגדל HE ALSO SHALL BECOME A PEOPLE, AND HE ALSO SHALL BE GREAT, for of him will be born Gideon through whom the Holy One, blessed be He, will perform a miracle (See Midrash Tanchuma, Vayechi 6).<br><br>ואולם אחיו הקטן יגדל ממנו BUT TRULY HIS YOUNGER BROTHER SHALL BE GREATER THAN HE — for of him will be born Joshua who will make Israel inherit the land of Canaan and will instruct them in the Torah (Midrash Tanchuma, Vayechi 6).<br><br>וזרעו יהיה מלא הגוים AND HIS SEED SHALL BECOME A MULTITUDE OF NATIONS (more lit, shall fill the nations) — the fame and renown of his seed, Joshua, will spread abroad and fill the whole world when he will make the sun stand still upon Gibeon and the moon in the valley of Aijalon (Avodah Zarah 25a)."}, {"ch": 48, "v": 20, "aliyah": 3, "heb": "וַיְבָ֨רְכֵ֜ם בַּיּ֣וֹם הַהוּא֮ לֵאמוֹר֒ בְּךָ֗ יְבָרֵ֤ךְ יִשְׂרָאֵל֙ לֵאמֹ֔ר יְשִֽׂמְךָ֣ אֱלֹהִ֔ים כְּאֶפְרַ֖יִם וְכִמְנַשֶּׁ֑ה וַיָּ֥שֶׂם אֶת־אֶפְרַ֖יִם לִפְנֵ֥י מְנַשֶּֽׁה׃", "onk": "וּבְרֵיכִנּוּן בְּיוֹמָא הַהוּא לְמֵימַר בָּךְ יְבָרֵךְ יִשְׂרָאֵל לְמֵימַר יְשַׁוִּינָךְ יְיָ כְּאֶפְרַיִם וְכִמְנַשֶּׁה וְשַׁוֵּי יָת אֶפְרַיִם קֳדָם מְנַשֶּׁה:", "onk_en": "He blessed them on that day saying: Through you shall [the People of] Israel bless saying; May Elohim make you as Ephraim and Menasheh. He placed Ephraim ahead of Menasheh.", "pj": "וּבָרֵיכִינוּן בְּיוֹמָא הַהוּא לְמֵימַר בָּךְ יוֹסֵף בְּרִי יְבָרְכוּן בֵּית יִשְרָאֵל יַת יְנוּקָא בְּיוֹמָא דִמְהוּלְתָּא לְמֵימָר יְשַׁוִינָךְ יְיָ כְּאֶפְרַיִם וְכִמְנַשֶׁה וּבְמִנְיַן שִׁבְטַיָא יִתְמַנֵי רַבָּא דְאֶפְרַיִם קֳדָם רַבָּא דִמְנַשֶׁה וּמַנֵי יַת אֶפְרַיִם דִיהֵי קֳדָם מְנַשֶׁה", "pj_en": "And he blessed them in that day, saying, In thee, Joseph my son, shall the house of Israel bless their infants in the day of their circumcision, saying, The Lord set thee as Ephraim and as Menasheh. And in the numbering of the tribes the prince of Ephraim shall be numbered before the prince of Menasheh. And he appointed that Ephraim should be before Menasheh.", "tj": "", "tj_en": "", "rashi": "<b>בך יברך ישראל.<\/b> הַבָּא לְבָרֵךְ אֶת בָּנָיו יְבָרְכֵם בְּבִרְכָתָם וְיֹאמַר אִישׁ לִבְנוֹ יְשִׂימְךָ אֱלֹהִים כְּאֶפְרַיִם וְכִמְנַשֶּׁה:<br><br><b>וישם את אפרים.<\/b> בְּבִרְכָתוֹ לִפְנֵי מְנַשֶּׁה, לְהַקְדִּימוֹ בִּדְגָלִים וּבַחֲנֻכַּת הַנְּשִׂיאִים:", "rashi_en": "בך יברך ישראל IN THEE SHALL ISRAEL BLESS — When one wishes to bless his sons he will bless them by reciting the formula with which they were blessed — a man will say to his son, “God make thee as Ephraim and as Manasseh.”<br><br>וישם את אפרים AND HE PUT EPHRAIM etc. — i.e. in the blessing he bestowed upon them he put Ephraim’s name before that of Manasseh, so giving him precedence over his brother when the Israelites encamped and marched beneath their banners in the wilderness (cf. Numbers 2:18 and Numbers 10:22), and when at the dedication of the altar by the princes of the tribes each brought his gifts (cf. Numbers 7:48 Numbers 7:54). (see Genesis Rabbah 97:5). "}, {"ch": 48, "v": 21, "aliyah": 3, "heb": "וַיֹּ֤אמֶר יִשְׂרָאֵל֙ אֶל־יוֹסֵ֔ף הִנֵּ֥ה אָנֹכִ֖י מֵ֑ת וְהָיָ֤ה אֱלֹהִים֙ עִמָּכֶ֔ם וְהֵשִׁ֣יב אֶתְכֶ֔ם אֶל־אֶ֖רֶץ אֲבֹתֵיכֶֽם׃", "onk": "וַאֲמַר יִשְׂרָאֵל לְיוֹסֵף הָא אֲנָא מָאִית וִיהֵי <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדֵּכוֹן<\/b> וְיָתֵיב יָתְכוֹן לְאַרְעָא דַּאֲבָהַתְכוֹן:", "onk_en": "Yisrael said to Yoseif, Behold I am dying. [<b>The Word of<\/b>] Elohim will be with you [<b>your support<\/b>], and He will bring you back to the land of your fathers.", "pj": "וַאֲמַר יִשְרָאֵל לְיוֹסֵף הָא אֲנָא מָטָא סוֹפִי לִמְמָת וִיהֵי מֵימְרָא דַיְיָ בְּסַעֲדְכוֹן וִיתֵיב יַתְכוֹן לְאַרְעָא דַאֲבָהַתְכוֹן", "pj_en": "And Israel said to Joseph, Behold, my end cometh to die. But the Word of the Lord shall be your Helper, and restore you to the land of your fathers;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 48, "v": 22, "aliyah": 3, "heb": "וַאֲנִ֞י נָתַ֧תִּֽי לְךָ֛ שְׁכֶ֥ם אַחַ֖ד עַל־אַחֶ֑יךָ אֲשֶׁ֤ר לָקַ֙חְתִּי֙ מִיַּ֣ד הָֽאֱמֹרִ֔י בְּחַרְבִּ֖י וּבְקַשְׁתִּֽי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲנָא יְהָבִית לָךְ חוּלַק חַד יַתִּיר עַל אַחָיךְ דִּי נְסֵיבִית מִידָא דֶאֱמוֹרָאָה <b>בִּצְלוֹתִי<\/b> <b>וּבְבָעוּתִי<\/b>:", "onk_en": "I have given you one share more than your brothers, which I took from the hand of the Amorite with my sword [<b>prayer<\/b>] and with my bow [<b>plea<\/b>].", "pj": "וַאֲנָא הָא יְהָבִית לָךְ יַת קַרְתָּא דִשְׁכֶם חוּלַק חָד לְמַתָּנָא יַתִּיר עַל אָחָךְ דִי נְסֵיבִית מִידֵיהוֹן דֶאֱמוֹרָאֵי בְּעִידָן דִי עַלְתוֹן לְגַוָוהּ וְקָמִית וְסַיְיעִית יַתְכוֹן בְּסַיְיפִי וּבְקַשְׁתִּי", "pj_en": "and I, behold, I have given to thee the city of Shekem, one portion for a gift above thy brethren, which I took from the hand of the Amoraee at the time that you went into the midst of it, and I arose and helped you with my sword and with my bow.", "tj": "וַאֲנָא הָא יְהָבִית לָךְ חוּלַק חַד יַתִּיר עַל אֲחָךְ לְבוּשֵׁיהּ דְאָדָם קַדְמָאָה נְסִיב יָתֵיהּ אַבְרָהָם אָבוּי דְאַבָּא מִן יְדוֹי דְנִמְרוֹד רַשִׁיעָא וִיהַב יָתֵיהּ לְיִצְחָק אַבָּא וְיִצְחָק אַבָּא יְהַב יָתֵיהּ לְעֵשָו וַאֲנָא נְסָבִית יָתֵיהּ מִן יְדוֹי דְעֵשָו אָחִי לָא בְּחַרְבִּי וְלָא בְּקַשְׁתִּי אֱלָהֵין בִּזְכוּתִי וּבְעוֹבָדֵי טַבְיָא:", "tj_en": "And I, behold, I have given thee one portion. Above thy brethren, the robe of the first Adam. Abraham the father of my father took it from the hands of Nimrod the Wicked, and gave it to Izhak my father; and Izhak my father gave it to Esau, and I took it from the hands of Esau my brother, not with my sword nor with my bow, but through my righteousness and my good works.", "rashi": "<b>ואני נתתי לך.<\/b> לְפִי שֶׁאַתָּה טוֹרֵחַ לְהִתְעַסֵּק בִּקְבוּרָתִי, וְגַם אֲנִי נָתַתִּי לְךָ נַחֲלָה שֶׁתִּקָּבֵר בָּהּ, וְאֵי זוֹ? זוֹ שְׁכֶם, שֶׁנֶּאֱמַר, וְאֶת עַצְמוֹת יוֹסֵף אֲשֶׁר הֶעֱלוּ מִמִּצְרַיִם קָבְרוּ בִשְׁכֶם (יהושע כ\"ד):<br><br><b>שכם אחד על אחיך.<\/b> שְׁכֶם מַמָּשׁ, הִיא תִּהְיֶה לְךָ חֵלֶק אֶחָד יְתֵרָה עַל אַחֶיךָ:<br><br><b>בחרבי ובקשתי.<\/b> כְּשֶׁהָרְגוּ שִׁמְעוֹן וְלֵוִי אֶת אַנְשֵׁי שְׁכֶם נִתְכַּנְּסוּ כָּל סְבִיבוֹתֵיהֶם לְהִזְדַּוֵּג לָהֶם, וְחָגַר יַעֲקֹב כְּלֵי מִלְחָמָה כְּנֶגְדָּן; דָּבָר אַחֵר שְׁכֶם אַחַד הוּא הַבְּכוֹרָה, שֶׁיִּטְּלוּ בָנָיו שְׁנֵי חֲלָקִים, וּשְׁכֶם לְשׁוֹן חֵלֶק הוּא, וְהַרְבֵּה יֵשׁ לוֹ דּוֹמִים בַּמִּקְרָא כִּי תְּשִׁיתֵמוֹ שֶׁכֶם (תהילים כ\"א) – תָּשִׁית שׂוֹנְאַי לְפָנַי לַחֲלָקִים; אֲחַלְּקָה שְׁכֶם (שם ס'), דֶּרֶךְ יְרַצְּחוּ שֶׁכְמָה (הושע ו') – אִישׁ חֶלְקוֹ; לְעָבְדוֹ שְׁכֶם אֶחָד (צפניה ג'):<br><br><b>אשר לקחתי מיד האמרי.<\/b> מִיַּד עֵשָׂו, שֶׁעָשָׂה מַעֲשֵׂה אֱמוֹרִי. דָּבָר אַחֵר שֶׁהָיָה צָד אָבִיו בְּאִמְרֵי פִיו:<br><br><b>בחרבי ובקשתי.<\/b> הִיא חָכְמָתוֹ וּתְפִלָּתוֹ:", "rashi_en": "ואני נתתי לך MOREOVER I HAVE GIVEN TO THEE — Because you will take the trouble to engage in my burial “I” give you an inheritance in which you will be buried. And which was this? Shechem, as it is said, (Joshua 24:32) “And the bones of Joseph which the children of Israel brought up out of Egypt, buried they in Shechem”.<br><br>שכם אחד על אחיך Jacob meant by the word שכם the actual city of Shechem and said: this shall be to you one portion additional to what you will receive together with your brothers.<br><br>בחרבי ובקשתי WITH MY SWORD AND WITH MY BOW — When Simeon and Levi slew the inhabitants of Shechem all the surrounding nations gathered together to join in battle against them and Jacob girded on his weapons to war against them (cf. Genesis Rabbah 80:10) Another explanation of this verse: שכם אחד ONE PORTION [ABOVE THY BRETHREN] — this refers to the birthright (Genesis Rabbah 97:6): that Joseph’s children should receive two portions when Canaan would be divided amongst the tribes (cf. Deuteronomy 60:17; Joseph therefore was to be regarded as the first-born). The word שכם signifies portion. “For thou wilt make them שכם” i.e. thou wilt place my enemies before me in portions (thou wilt scatter them before me); (Deuteronomy 60:8) “I will divide שכם the portion”; (Hosea 6:9) “on the way they murder שכמה” i.e. each man kills someone as his own portion; (Zephaniah 3:9) “to serve him as though they were all but one portion (שכם)” i.e. to serve him unitedly.<br><br>אשר לקחתי מיד האמרי WHICH I TOOK OUT OF THE HAND OF THE AMORITE—out of the hand of Esau whose deeds were like those of an Amorite (Genesis Rabbah 97:6). Another interpretation of אמורי in reference to Esau is: he used to ensnare his father by the words (אמרי) of his mouth (cf. Rashi on Genesis 25:7).<br><br>בחרבי ובקשתי that is, by means of his spiritual weapons: his wisdom and his prayer (“בַּקָשָׁתִי” cf. The Targumim and Bava Batra 123a)."}, {"ch": 49, "v": 1, "aliyah": 4, "heb": "וַיִּקְרָ֥א יַעֲקֹ֖ב אֶל־בָּנָ֑יו וַיֹּ֗אמֶר הֵאָֽסְפוּ֙ וְאַגִּ֣ידָה לָכֶ֔ם אֵ֛ת אֲשֶׁר־יִקְרָ֥א אֶתְכֶ֖ם בְּאַחֲרִ֥ית הַיָּמִֽים׃", "onk": "וּקְרָא יַעֲקֹב לִבְנוֹהִי וַאֲמַר אִתְכַּנָּשׁוּ וַאֲחַוֵּי לְכוֹן יָת דִּי יְעַרַע יָתְכוֹן בְּסוֹף יוֹמַיָּא:", "onk_en": "Yaakov called for his sons and said, Gather around and I will tell you what will happen to you in latter days.", "pj": "וּקְרָא יַעֲקב לִבְנוֹי וַאֲמַר לְהוֹם אִדַכּוּ מִסוֹאֲבוּתָא וְאֲחַוִי לְכוֹן רַזְיָיא סְתִימַיָא קִיצַיָיא גְנִיזַיָא וּמַתַּן אַגְרְהוֹן דְצַדִיקַיָיא וּפוּרְעָנוּתְהוֹן דִרְשִׁיעַיָא וּטְלָנֵיתָא דְעֵדֶן מָה הִיא כַּחֲדָא מִתְכַּנְשִׁין תְּרֵיסַר שִׁבְטֵי יִשְרָאֵל מַקְפִין דַרְגְשָׁא דְדַהֲבָא דִרְבִיעַ עֲלָהּ מִן דְאִיתְגְלֵי אִיקָר שְׁכִינְתָּא דַיְיָ קִיצָא דְעָתִיד מַלְכָּא מְשִׁיחָא לְמֵיתֵי אִיתְכְּסֵי מִינֵיהּ וּבְכֵן אָמַר אִיתוּ וְאִיתְנֵי לְכוֹן מַה דְיֶאֱרַע יַתְכוֹן בְּסוֹף יוֹמַיָא", "pj_en": "And Jakob called his sons and said to them, Purify yourselves from uncleanness, and I will show you the hidden mysteries, the ends concealed, the recompense of reward for the righteous, the retribution of the wicked, and the bower of Eden, what it is. And the twelve tribes of Israel gathered themselves together around the golden bed whereon he reclined, and where was revealed to him the Shekina of the Lord, (though) the end for which the king Meshiha is to come had been concealed from him. Then said he, Come, and I will declare to you what shall befall you at the end of the days.", "tj": "וּקְרָא אָבוּנָן יַעֲקב לִבְנוֹי וַאֲמַר לְהוֹן אִתְכְּנִישׁוּ וְאַתְנִי לְכוֹן קִיצָא גְנִיזָא רַזְיָא טְמִירַיָא וּמִיתַּן אַגְרַיָא דְצַדִיקַיָא וּפוּרְעֲנוּתְהוֹן דְרַשִׁיעַיָא וּטְלָיוּתֵיהּ דְעֵדֶן מַה הוּא כַּחֲדָא אִתְכַּנָשׁוּ תְּרֵי עֲשַרְתֵּי שִׁבְטַיָא דְיַעֲקב וּמַקְפִין לְדַרְגְשָׁא דְדַהֲבָא דַהֲוָה אָבוּנָן יַעֲקב רְבִיעַ בְּגַוָהּ בַּעֲיָין דִי יְתַנִי לְהוֹן קֵץ בִּרְכָתָא וְנֶחֱמָתָא מִן דִי אִיתְגְלֵי לֵיהּ רָזָא אִתְכַסֵי מִנֵיהּ מִן דִי אַפְתַּח לֵיהּ תַּרְעָא אִיטְרַד מִנֵיהּ חֲזַר אֲבוּנָן יַעֲקב וּבְרִיךְ לִבְנוֹי גְבַר כְּעוֹבָדוֹי טַבְיָא בְּרִיךְ יַתְהוֹן: מִן דְאִתְכַּנְשׁוּ תְּרֵי עֲשַרְתֵּי שִׁבְטוֹי דְיַעֲקב וְאַקִיפוּ דַרְגְשָׁא דְדַהֲבָא דַהֲוָה אֲבוּנָן יַעֲקב רְבִיעַ בְּגַוָהּ סָבְרִין דְהוּא גְלֵי לְהוֹן סְדָרֵי בִּרְכָתָא וְנֶחֱמָתָא וְאִתְכְסִי מִינֵיהּ: עָנָא אֲבוּנָן יַעֲקב וַאֲמַר לְהוֹן אַבְרָהָם אָבוֹי דְאַבָּא קָם מִינֵיהּ פִּיסוּל יִשְׁמָעֵאל וְכָל בְּנֵי קְטוּרָה וְיִצְחָק אַבָּא קָם מִינֵיהּ פִּיסוּל עֵשָו אָחִי וַאֲנָא דָחִיל דְלָא יְהֵי בֵּינֵיכוֹן גְבַר לִבֵּיהּ פְּלִיג עַל אָחוֹי לְמֵיזַל לְמִפְלַח קָדָם טַעֲוָון אוֹחֲרַנְיָין עַנְיַן תְּרֵי עֲשַרְתֵּי שִׁבְטוֹי דְיַעֲקב כּוּלְהוֹן כַּחֲדָא וְאָמְרִין שְׁמַע מִינָן יִשְרָאֵל אָבוּנָן יְיָ אֱלָהָנָא יְיָ חַד עָנִי יַעֲקב אֲבוּנָן וְאָמַר יְהֵא שְׁמֵיהּ רַבָּא מְבָרֵךְ לְעָלְמֵי עַלְמִין:", "tj_en": "And our father Jakob called his sons, and said to them, Gather together, and I will teach yon the concealed end, the secret mysteries, the recompense of reward for the just, and the punishment of the wicked, and the blessedness of Eden, what it is. And the twelve tribes of Jakob assembled and surrounded the golden bed whereon our father Jakob lay, desiring that he should teach them (at the) end in benediction and consolation. Then was revealed to him the secret that had been hidden from him, and then was opened the door which had been shut to him. Our father Jakob turned therefore and blessed his sons, every man according to his good did he bless him. When the twelve tribes of Jakob were assembled, and surrounded the golden bed whereon our father Jakob lay, they expected that he would make known to them the order of blessing and consolation: but they were hidden from him. Our father Jakob answered and said to them: From Abraham my father’s father arose the profane Ishmael and all the sons of Keturah; and from Izhak my father arose the profane Esau, my brother; and I am afraid lest there should be among you a man whose heart is separated from his brethren to go and worship before strange idols. The twelve tribes of Jakob answered all together, and said, HEAR US, ISRAEL OUR FATHER! THE LORD OUR GOD IS ONE LORD! And Jakob our father answered, and said, May His Great Name be blessed for ever and ever!", "rashi": "<b>ואגידה לכם.<\/b> בִּקֵּשׁ לְגַלּוֹת אֶת הַקֵּץ וְנִסְתַּלְּקָה מִמֶּנּוּ שְׁכִינָה וְהִתְחִיל אוֹמֵר דְּבָרִים אַחֵרִים:", "rashi_en": "ואגידה לכם THAT I MAY TELL YOU — He wished to reveal to them the end of Israel’s exile but the Shechinah departed from him and he began to speak of other things (Genesis Rabbah 98:2). "}, {"ch": 49, "v": 2, "aliyah": 4, "heb": "הִקָּבְצ֥וּ וְשִׁמְע֖וּ בְּנֵ֣י יַעֲקֹ֑ב וְשִׁמְע֖וּ אֶל־יִשְׂרָאֵ֥ל אֲבִיכֶֽם׃", "onk": "אִתְכַּנָּשׁוּ וּשְׁמָעוּ בְּנֵי יַעֲקֹב וְקַבִּילוּ אוּלְפַן מִן יִשְׂרָאֵל אֲבוּכוֹן:", "onk_en": "Come together and listen, sons of Yaakov; listen to [<b>accept chastisement from<\/b>] Yisrael, your father.", "pj": "אִתְכְּנָשׁוּ וְשִׁמְעוּ בְּנֵי יַעֲקב וְקַבִּילוּ אוּלְפַן מִן יִשְרָאֵל אֲבוּכוֹן", "pj_en": "Gather yourselves together and hear, ye sons of Jakob, and receive instruction from Israel your father.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 49, "v": 3, "aliyah": 4, "heb": "רְאוּבֵן֙ בְּכֹ֣רִי אַ֔תָּה כֹּחִ֖י וְרֵאשִׁ֣ית אוֹנִ֑י יֶ֥תֶר שְׂאֵ֖ת וְיֶ֥תֶר עָֽז׃", "onk": "רְאוּבֵן בּוּכְרִי אַתְּ חֵילִי וְרֵישׁ תָּקְפִּי לָךְ הֲוָה חָזֵי לְמִסַּב תְּלָתָא חוּלָקִין בְּכֵירוּתָא כְּהֻנְתָּא וּמַלְכוּתָא:", "onk_en": "Reuvein, you are my firstborn, you are my strength, and the beginning of my manhood [<b>power<\/b>]; superior in rank and superior in power [<b>it would have been right for you to take three portions—the birthright, the priesthood, and the kingship<\/b>].", "pj": "רְאוּבֵן בּוּכְרִי אַנְתְּ רֵישׁ חֵיל שִׁימוּשִׁי וְשֵׁירוּי קִרְיוּת הִרְהוּרִי חָמֵי הֲוֵי לָךְ בְּכוֹרוֹתָא וּרְבוּת כְּהוּנְתָּא וּמַלְכוּתָא וְעַל דִי חַטְיַית בְּרִי אִתְיְהִיבַת בְּכֵירוּתָא לְיוֹסֵף וּמַלְכוּתָא לִיהוּדָה וּכְהוּנְתָּא לְלֵוִי", "pj_en": "Reuben thou art my firstborn, the beginning of the strength of my generation, and the chief event of my thoughts To thee belonged the birthright, and the high priesthood, and the kingdom: but because thou hast sinned, my son, the birthright is given to Joseph, and the, kingdom to Jehuda, and the priesthood to Levi.", "tj": "רְאוּבֵן בּוּכְרִי אַתְּ חֵילִי וְשֵׁירוּי צְעָרִי חָמֵי הֲוָה לָךְ רְאוּבֵן בְּרִי לְמֵיסַב תְּלָתָא חוּלְקִין יַתִּיר עַל אָחָךְ בְּכוֹרוּתָא כְּהוּנְתָּא מַלְכוּתָא וְעַל דְחַטְיַית רְאוּבֵן בְּרִי אִיתְיְהִיבַת בְּכוֹרוּתָא לְיוֹסֵף וּמַלְכוּתָא לִיהוּדָה וּכְהוּנְתָּא רַבְּתָא לְשִׁבְטָא לֵוִי:", "tj_en": "REUBEN, my firstborn art thou, my strength, and the beginning of my sorrow. To thee my son Reuben would it have pertained to receive three portions above thy brethren, birthright, priesthood, kingdom: but because thou hast sinned, Reuben, my son, the birthright is given unto Joseph, the kingdom to Jehuda, and the high priesthood to the tribe of Levi.", "rashi": "<b>וראשית אוני.<\/b> הִיא טִפָּה רִאשׁוֹנָה, שֶׁלֹּא רָאָה קֶרִי מִיָּמָיו (בראשית רבה):<br><br><b>אוני.<\/b> כּוֹחִי, כְּמוֹ מָצָאתִי אוֹן לִי (הושע י\"ב), מֵרֹב אוֹנִים, וּלְאֵין אוֹנִים (ישעיהו מ'):<br><br><b>יתר שאת.<\/b> רָאוּי הָיִיתָ לִהְיוֹת יֶתֶר עַל אַחֶיךָ בִכְהֻנָּה, לְשׁוֹן נְשִׂיאוּת כַּפַּיִם:<br><br><b>ויתר עז.<\/b> בְּמַלְכוּת, כְּמוֹ: וְיִתֶּן עֹז לְמַלְכּוֹ (שמואל א ב'), וּמִי גָּרַם לְךָ לְהַפְסִיד כָּל אֵלֶּה?", "rashi_en": "וראשית אוני THE BEGINNING OF MY VIGOR — That is the first drop [of semen], as he had not experienced a seminal emission from all of his days [until that time] (Genesis Rabbah 98:4).<br><br>אוני means MY VIGOR, as (Hosea 12:9) “I have gained me (און) strength”; (Isaiah 40:26) “by the greatness of His (אונים) might”; (Isaiah 5:29) “and to him that hath no (אונים) might Ho increaseth strength”.<br><br>יתר שאת SUPERIORITY IN DIGNITY — Since you were the first-born it was proper that you should be superior to your brothers by being endowed with the priesthood. This term שאת “lifting up” alludes to the נשיאות כפים the raising of the hands when the priests pronounce the benediction (cf. Onkelos).<br><br>ויתר עז SUPERIORITY IN POWER — meaning in royal rank, as is meant by עז in (1 Samuel 2:10) “And he will give strength (עז) unto His king”. And what caused you to lose all these?"}, {"ch": 49, "v": 4, "aliyah": 4, "heb": "פַּ֤חַז כַּמַּ֙יִם֙ אַל־תּוֹתַ֔ר כִּ֥י עָלִ֖יתָ מִשְׁכְּבֵ֣י אָבִ֑יךָ אָ֥ז חִלַּ֖לְתָּ יְצוּעִ֥י עָלָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "עַל דַּאֲזַלְתָּא לָקֳבֵל אַפָּיךְ הָא כְמַיָּא בְּרַם לָא אַהֲנֵיתָא חוֹלָק יַתִּיר לָא תִסָּב אֲרֵי סְלֶקְתָּא בֵּית מִשְׁכְּבֵי אָבוּךְ בְּכֵן אֲחֶלְתָּא לְשִׁוּוּיִי בְּרִי סְלֶקְתָּא:", "onk_en": "Unstable as water, you shall no longer be superior, [<b>However, because you went towards your anger like flowing water, you will not benefit, you will not receive an additional portion,<\/b>] for you have gone up [<b>to the place of<\/b>] your father’s bed. You profaned He Who went up on my couch[<b>, my son, you went up<\/b>].", "pj": "מְדַמִינָא לָךְ לְגִינָא קַלִילָא דְעָלוּן לְגַוָוהּ נַחֲלִין מוֹחִין מִתְגַבְּרִין וְלָא יְכִילַת לְמִסוֹבְלָא יְהוֹן וְאִסְתְּחִיפַת כֵּן אִיתְרָעַת רְאוּבֵן בְּרִי דִי חַטְיַת לָא תוֹסִיף וְעַל דִי חַטְיַת יִשְׁתְּבֵיק לָךְ אֲרוּם אִתְחַשֵׁב לָךְ כְּאִילוּ עָלְתָה לְאִיתָא דְשַׁמֵשׁ עִמָהּ אָבוּךְ בְּעִידַן דְבַלְבֵּילְתָּא שִׁווּיִי דִסְלֵיקַת עֲלָהּ", "pj_en": "I will liken thee to a little garden in the midst of which there enter torrents swift and strong, which it cannot bear, but is overwhelmed. Be repentant then, Reuben my son, for thou hast sinned, and add not; that wherein thou hast sinned it may be forgiven thee; for it is reckoned to thee as if thou wentest in to have to do with the wife of thy father at the time that thou didst confound my bed upon which thou wentest up.", "tj": "מְדַמֵי אֲנָא לָךְ בְּרִי רְאוּבֵן לְגַנָא זְעֵירָא דְעָלוּן לְגַוָוהּ נַחֲלִין שַׁטְפִין דְלָא יְכִלַת לְסוֹבְרָא יַתְהוֹן וְאִתְרְעַת מִן קֳדָמֵיהוֹן כֵּן אִתְרְעַת רְאוּבֵן בְּרִי בְּעוֹבָדָךְ טַבְיָא דְחַטְיַית לָא תוֹסִיף לְמֵיחְטִי וְעַל דְחַטְיַית יִשְׁתְּבֵק לָךְ:", "tj_en": "I will liken thee, my son Reuben, to a little garden into the midst of which there enter rapid torrents, which it cannot bear, but is carried away before them. Be repentant then, my son Reuben, with good works, for thou hast sinned; and sin no more, that that which thou hast sinned may be forgiven thee.", "rashi": "<b>פחז כמים.<\/b> הַפַּחַז וְהַבֶּהָלָה אֲשֶׁר מִהַרְתָּ לְהַרְאוֹת כַּעַסְךָ כַּמַּיִם הַלָּלוּ הַמְמַהֲרִים לִמְרוּצָתָם, לְכָךְ<br><br><b>אל תותר.<\/b> אַל תַּרְבֶּה לִטֹּל כָּל הַיְתֵרוֹת הַלָּלוּ שֶׁהָיוּ רְאוּיוֹת לְךָ, וּמַהוּ הַפַּחַז אֲשֶׁר פָּחַזְתָּ? <b>כי עלית משכבי אביך<\/b>:<br><br><b>אז חללת.<\/b> אוֹתוֹ שֶׁעָלָה עַל יְצוּעִי – וְהִיא שְׁכִינָה שֶׁהָיָה דַרְכָּהּ לִהְיוֹת עוֹלָה עַל יְצוּעִי:<br><br><b>פחז<\/b> שֵׁם דָּבָר הוּא, לְפִיכָךְ טַעֲמוֹ לְמַעְלָה, וְכֻלּוֹ נָקוּד פַּתָּח, וְאִלּוּ הָיָה לְשׁוֹן עָבָר, הָיָה נָקוּד חֶצְיוֹ קָמָץ וְחֶצְיוֹ פַּתָּח וְטַעְמוֹ לְמַטָּה:<br><br><b>יצועי.<\/b> לְשׁוֹן מִשְׁכָּב, עַל שֵׁם שֶׁמַּצִּיעִים אוֹתוֹ עַל יְדֵי לְבָדִין וּסְדִינִין; וְהַרְבֵּה דּוֹמִים לוֹ אִם אֶעֱלֶה עַל עֶרֶשׂ יְצוּעָי (תהילים קל\"ב); אִם זְכַרְתִּיךָ עַל יְצוּעָי (שם ס\"ג):", "rashi_en": "פחז כמים The impetuosity and the precipitance with which you so hastily showed your wrath, just like water that rushes headlong in its course — therefore <br><br>אל תותר THOU SHALT NOT BE SUPERIOR— you will not receive all these many prerogatives that were proper to you. And what was this impetuosity which you displayed? <br><br>כי עלית משכבי אביך, אז חללת BECAUSE THOU WENTEST UP TO THY FATHER S PLACE OF REPOSE; THEN PROFANEDST THOU Him Who hovered over my couch — the Name of the Shechina that used to abide above my couch (Shabbat 55b and Rashi there).<br><br>פַּחַז is a noun (a segolate noun like נַחַל) and has its accent therefore on the first syllable, and the entire word (both syllables) is punctuated with Patach, for were it the past tense of a verb, half of it (the first syllable) would have been punctuated with Kametz and the other half with Patach, and its accent would have been on the last syllable.<br><br>יצועי denotes a couch, because it is spread (root יצע) with mattresses and sheets; it occurs in this sense frequently in Scripture: (Psalms 132:3) “Nor go up into the bed that is spread for me (ערש יצועי)” ; (Psalms 63:7) “When I remember thee upon my (יצועי) couch”. "}, {"ch": 49, "v": 5, "aliyah": 4, "heb": "שִׁמְע֥וֹן וְלֵוִ֖י אַחִ֑ים כְּלֵ֥י חָמָ֖ס מְכֵרֹתֵיהֶֽם׃", "onk": "שִׁמְעוֹן וְלֵוִי אַחִין גַּבְרִין גִּבָּרִין בְּאַרַע תּוֹתָבוּתְהוֹן עֲבָדוּ גְבוּרָא:", "onk_en": "Shimon and Levi are brothers[<b>, mighty men<\/b>]. Instruments of violence are their wares. [<b>In the land of their residence they did mighty deeds.<\/b>]", "pj": "שִׁמְעוֹן וְלֵוִי אָחִין תְּלָאמִין מָאנֵי זַיְינָא שְׁנִינָא לְמַחְטוֹב הוּא אִשְׁתְּמוֹדְעוּתְהוֹן", "pj_en": "Shimeon and Levi are brothers of the womb; their thoughts are of sharp weapons for rapine.", "tj": "שִׁמְעוֹן וְלֵוִי אַחִין תַּלְמִין גִבָּרִין מָרֵי זְיָינָא שְׁנִינָא עֲבָדוּ קְרַב מִן טַלְיוּתְהוֹן בְּאַרְעָא בַּעֲלֵי דְבָבֵיהוֹן עֲבָדוּ נִיצְחַנֵי קְרָבֵיהוֹן:", "tj_en": "Shimeon and Levi are brothers of the womb, men who are masters of sharp weapons; they made war from their youth; in the land of their adversary they wrought out the triumphs of war.", "rashi": "<b>שמעון ולוי אחים.<\/b> בְּעֵצָה אַחַת עַל שְׁכֶם וְעַל יוֹסֵף; וַיֹּאמְרוּ אִישׁ אֶל אָחִיו, וְעַתָּה לְכוּ וְנַהַרְגֵהוּ, מִי הֵם? אִ\"תֹּ רְאוּבֵן אוֹ יְהוּדָה, הֲרֵי לֹא הִסְכִּימוּ בַּהֲרִיגָתוֹ; אִ\"תֹּ בְּנֵי הַשְּׁפָחוֹת, הֲרֵי לֹא הָיְתָה שִׂנְאָתָן שְׁלֵמָה, שֶׁנֶּאֱמַר וְהוּא נַעַר אֶת בְּנֵי בִלְהָה וְאֶת בְּנֵי זִלְפָּה וְגוֹ', יִשָּׂשכָר וּזְבוּלֻן לֹא הָיוּ מְדַבְּרִים בִּפְנֵי אֲחֵיהֶם הַגְּדוֹלִים מֵהֶם; עַל כָּרְחֲךָ שִׁמְעוֹן וְלֵוִי הֵם שֶׁקְּרָאָם אֲבִיהֶם אַחִים:<br><br><b>כלי חמס.<\/b> אֻמָּנוּת זוֹ שֶׁל רְצִיחָה, חָמָס הוּא בִידֵיהֶם – מִבִּרְכַּת עֵשָׂו הִיא זוֹ, אֻמָּנוּת שֶׁלּוֹ הִיא – וְאַתֶּם חֲמַסְתֶּם אוֹתָהּ הֵימֶנּוּ:<br><br><b>מכרתיהם.<\/b> לְשׁוֹן כְּלֵי זַיִן, הַסַּיִף בִּלְשׁוֹן יְוָנִי מכי\"ר, תַּנְחוּמָא. דָּבָר אַחֵר מְכֵרֹתֵיהֶם – בְּאֶרֶץ מְגוּרָתָם נָהֲגוּ עַצְמָן בִּכְלֵי חָמָס, כְּמוֹ מְכֹרֹתַיִךְ וּמֹלְדֹתַיִךְ (יחזקאל טז), וְזֶהוּ תַרְגּוּם שֶׁל אֻנְקְלוֹס:", "rashi_en": "שמעון ולוי אחים SIMEON AND LEVI WERE BRETHREN in the plot against Shechem and against Joseph. Scripture states, (Genesis 37:19—20) “And they said one to another… (literally, one to his brother) come now therefore and let us slay him” (Midrash Tanchuma, Vayechi 9). Now, who were these? Should you say Reuben or Judah was one of them — but they were not consenting parties to slaying him (cf. Genesis 37:21, Genesis 37:22 and Genesis 37:26). Should you say they were the sons of the handmaids (Dan, Naphtali, Gad or Asher) — their hatred of Joseph was not so perfect a hatred that they would wish to kill him for it is said, (Genesis 37:2) “whilst a lad he used to be with the sons of Bilhah and with the sons of Zilpah etc.” Issachar and Zebulun would certainly not have spoken thus in the presence of their elder brothers. Consequently one must needs say that they were Simeon and Levi whom their father called “brethren” (Midrash Tanchuma, Vayechi 9).<br><br>כלי חמס INSTRUMENTS OF VIOLENCE (חמס may mean something that has been usurped from another) — This business of murdering is חמס, not rightly theirs; it is part of the blessing conferred upon Esau; it is his business and you have usurped (חמסתם) it from him (Midrash Tanchuma, Vayechi 9).<br><br>מכרתיהם denotes weapons. In the Greek language the word for a sword is μάχαιρα (Midrash Tanchuma, Vayechi 9). Another interpretation of מכרתיהם is: (taking מכרתיהם as מגרתיהם their sojournings with an interchange of כ and ג) in the land of their sojournings they got into the habit of using weapons of violence, מכרתיהם being of the same root as (Ezekiel 16:3) “Thine habitation (מכרתיך) and thy nativity [is in the land of the Canaanite].” This is how Onkelos renders it."}, {"ch": 49, "v": 6, "aliyah": 4, "heb": "בְּסֹדָם֙ אַל־תָּבֹ֣א נַפְשִׁ֔י בִּקְהָלָ֖ם אַל־תֵּחַ֣ד כְּבֹדִ֑י כִּ֤י בְאַפָּם֙ הָ֣רְגוּ אִ֔ישׁ וּבִרְצֹנָ֖ם עִקְּרוּ־שֽׁוֹר׃", "onk": "בְּרָזְהוֹן לָא הֲוַת נַפְשִׁי בְּאִתְכַּנְּשֵׁהוֹן לִמְהַךְ לָא נְחָתִית מִן יְקָרִי אֲרֵי בְרָגְזְהוֹן קְטָלוּ קְטוֹל וּבִרְעוּתְהוֹן תַּרָעוּ שׁוּר סַנְאָה:", "onk_en": "My soul will not enter [<b>was not in<\/b>] their secret council, let my honor not be identified with their assembly [<b>when they gathered to go to war against Shechem I did not descend from my honor and join them<\/b>]. For in their anger they killed a [<b>”dead”<\/b>] man, and through their willfulness they maimed an ox [<b>demolished the enemy’s wall<\/b>].", "pj": "בְּעִטַתְהוֹן לָא אִתְרְעִיַית נַפְשִׁי וּבְמִכְנַשְׁהוֹן לִשְׁכֶם לְמֵחַרְבָהּ לָא אִתְיַחַד יְקָרָא אֲרוּם בְּרוּגְזֵיהוֹן קָטְלוּ מַלְכָּא וּשׁוּלְטָנֵיהּ וּבִרְעוּתְהוֹן פָּכְרוּ שׁוּר בַּעֲלֵי דְבָבֵיהוֹן", "pj_en": "In their counsel my soul hath not had pleasure, and in their gathering against Shekem. to destroy it mine honour was not united; for in their anger they slew the prince and his ruler, and in their ill will they demolished the wall of their adversary.", "tj": "בַּעֲצַתְהוֹן לָא אִתְרְעֲייַת נַפְשִׁי וּבִכְנִישְׁתְּהוֹן לִכְרַכָּא דִשְׁכֶם לִמְחַרְבָּא יָתֵיהּ לָא חָסוּ עַל יְקָרִי אֲרוּם בְּרוּגְזֵיהוֹן קָטִילוּ מַלְכִּין עִם שִׁלְטוֹנִין וּבִרְעוּתְהוֹן זְבִינוּ יוֹסֵף אֲחֵיהוֹן דִמְתִיל לְתוֹרָא:", "tj_en": "In their counsels my soul found no pleasure; and in their gathering together at the city of Shekem to destroy it, they were not favourable to my honour; for in their anger they slew kings with princes, and in their wilfulness they sold Joseph their brother, who is compared to the ox.", "rashi": "<b>בסדם אל תבא נפשי.<\/b> זֶה מַעֲשֵׂה זִמְרִי, כְּשֶׁנִּתְקַבְּצוּ שִׁבְטוֹ שֶׁל שִׁמְעוֹן לְהָבִיא אֶת הַמִּדְיָנִית לִפְנֵי מֹשֶׁה וְאָמְרוּ לוֹ, זוֹ אֲסוּרָה אוֹ מֻתֶּרֶת? אִם תֹּאמַר אֲסוּרָה, בַּת יִתְרוֹ מִי הִתִּירָהּ לָךְ? – אַל יִזָּכֵר שְׁמִי בַּדָּבָר, זִמְרִי בֶּן סָלוּא נְשִׂיא בֵית אָב לַשִּׁמְעוֹנִי וְלֹא כָּתַב בֶּן יַעֲקֹב:<br><br><b>בקהלם.<\/b> כְּשֶׁיַּקְהִיל קֹרַח, שֶׁהוּא מִשִּׁבְטוֹ שֶׁל לֵוִי, אֶת כָּל הָעֵדָה עַל מֹשֶׁה וְעַל אַהֲרֹן,<br><br><b>אל תחד כבודי.<\/b> שָׁם, אַל יִתְיַחֵד עִמָּהֶם שְׁמִי, שֶׁנֶּאֱמַר קֹרַח בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי, וְלֹא נֶאֱמַר בֶּן יַעֲקֹב; אֲבָל בְּדִבְרֵי הַיָּמִים, כְּשֶׁנִּתְיַחֲסוּ בְּנֵי קֹרַח עַל הַדּוּכָן, נֶאֱמַר בֶּן קֹרַח בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי בֶּן יִשְׂרָאֵל (דברי הימים א ו'):<br><br><b>אל תחד כבודי.<\/b> כָּבוֹד לְשׁוֹן זָכָר הוּא, וְעַל כָּרְחֲךָ אַתָּה צָרִיךְ לְפָרֵשׁ כִּמְדַבֵּר אֶל הַכָּבוֹד וְאוֹמֵר אַתָּה, כְבוֹדִי אַל תִּתְיַחֵד עִמָּהֶם כְּמוֹ לֹא תֵחַד אִתָּם בִּקְבוּרָה (ישעיה י\"ד):<br><br><b>כי באפם הרגו איש.<\/b> אֵלּוּ חֲמוֹר וְאַנְשֵׁי שְׁכֶם, וְאֵינָן חֲשׁוּבִין כֻּלָּם אֶלָּא כְאִישׁ אֶחָד; וְכֵן הוּא אוֹמֵר בְּגִדְעוֹן, וְהִכִּיתָ אֶת מִדְיָן כְּאִישׁ אֶחָד (שופטים ו') וְכֵן בְּמִצְרַיִם סוּס וְרֹכְבוֹ רָמָה בַיָּם, זֶהוּ מִדְרָשׁוֹ. וּפְשׁוּטוֹ, אֲנָשִׁים הַרְבֵּה קוֹרֵא אִישׁ – כָּל אֶחָד לְעַצְמוֹ, בְּאַפָּם הָרְגוּ כָל אִישׁ שֶׁכָּעֲסוּ עָלָיו, וְכֵן וַיִּלְמַד לִטְרָף טֶרֶף אָדָם אָכָל (יחזקאל י\"ט):<br><br><b>וברצנם עקרו שור.<\/b> רָצוּ לַעֲקֹר אֶת יוֹסֵף שֶׁנִּקְרָא שׁוֹר, שֶׁנֶּאֱמַר בְּכוֹר שׁוֹרוֹ הָדָר לוֹ (דברים ל\"ג). עִקְּרוּ אשרי\"טיר בְּלַעַז, לְשׁוֹן אֶת סוּסֵיהֶם תְּעַקֵּר (יהושע י\"א):", "rashi_en": "בסדם אל תבא נפשי O MY SOUL, COME NOT THOU INTO THEIR SECRET DELIBERATION (סוד may have the sense of plot) — this has reference to the story of Zimri, (Numbers 25:6-15) when the tribe of Simeon assembled and brought the Midianitish woman before Moses, saying, “Is this woman forbidden or permitted to be taken as a wife? If you say she is forbidden, who made the daughter of Jethro permissible to you in marriage” (See Sanhedrin 82b) — let not my name be mentioned in connection with that event! Indeed, it is said (Numbers 25:14) “Zimri, the son of Zalu, a prince of a father’s house among the Simeonites” — but Scripture does not state “a son of Jacob”.<br><br>בקהלם UNTO THEIR ASSEMBLY — when Korah of the tribe of Levi will assemble the entire congregation against Moses and Aaron —<br><br>אל תחד כבודי MY GLORY BE NOT THOU UNITED — let my name not be associated there with them! (Genesis Rabbah 98:5) And so it was, for it is said (Numbers 16:1) “Korah, the son of Izhar, the son of Kohath. the son of Levi” — but it does not say “the son of Jacob”. In Chronicles, however, (1 Chronicles 6:22,23), where the genealogy of Korah is traced in connection with the “Duchan” (properly, the platform — the place on which the Levites were stationed for the service of song in the Temple) it is said, “the son of Korah, the son of Izhar, the son of Kohath, the son of Levi, the son of Israel (Genesis Rabbah 98:5). <br><br>אל תחד כבדי MY GLORY BE NOT THOU UNITED — כבוד is masculine and therefore you must needs explain the phrase as though he were addressing himself to “the glory” saying, “thou, my glory, be not united with them!” תחד is exactly the same grammatical form (2nd masc. sing. and not 3rd fem. sing.) as (Isaiah 14:20) “Thou shall not be united (אל תחד) with them in burial”<br><br>כי באפם הרגו איש FOR IN THEIR WRATH THEY SLEW A MAN — This refers to Hamor and the people of Shechem, and they are spoken of as איש “one” man because they were all regarded as of no more account than one man when it was a matter of attacking them. It likewise states in the history of Gideon, (Judges 6:16) “And thou shalt smite the Midianites as one man”, and similarly concerning Egypt, (Exodus 15:1) “The horse (singular) and its rider (singular) hath he thrown into the sea” (i.e. the whole army as though it consisted of but one horse and its rider). This is a Midrashic interpretation (Genesis Rabbah 99:6). The plain meaning of the use of the singular form is: a group of men is called “a man” having in mind each one separately, so that the meaning is: they slew every man with whom they were angry. Similar is (Ezekiel 19:3) “and he learned to catch the prey, he devoured (אדם) a man” (which is the same as בני אדם “men”)<br><br>וברצונם עקרו שור AND IN THEIR SELFWILL THEY LAMED AN OX — they desired to exterminate Joseph who is called שור, as it is said, (Deuteronomy 33:17) “His firstling bullock (שורו) (Joseph), majesty is his”. עקרו means in old French essarter. It has the same meaning as in (Joshua 11:6) “Thou shalt hamstring (תעקר) their horses”. "}, {"ch": 49, "v": 7, "aliyah": 4, "heb": "אָר֤וּר אַפָּם֙ כִּ֣י עָ֔ז וְעֶבְרָתָ֖ם כִּ֣י קָשָׁ֑תָה אֲחַלְּקֵ֣ם בְּיַעֲקֹ֔ב וַאֲפִיצֵ֖ם בְּיִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לִיט רָגְזְהו
