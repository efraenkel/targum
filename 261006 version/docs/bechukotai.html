<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "bechukotai";
const DATA = [{"ch": 26, "v": 3, "aliyah": 1, "heb": "אִם־בְּחֻקֹּתַ֖י תֵּלֵ֑כוּ וְאֶת־מִצְוֺתַ֣י תִּשְׁמְר֔וּ וַעֲשִׂיתֶ֖ם אֹתָֽם׃", "onk": "אִם בִּקְיָמַי תְּהָכוּן וְיָת פִּקּוֹדַי תִּטְּרוּן וְתַעְבְּדוּן יָתְהוֹן:", "onk_en": "If you follow My statutes and keep My commandments and you will fulfill them,", "pj": "אם בחקתי אִין בִּקְיָימֵי אוֹרַיְיתִי תַּהֲכוּן וְיַת סִדְרֵי דִינַי תִּנְטְרוּן וְתַעְבְּדוּן יַתְהוֹן", "pj_en": "If you will go forward in the statutes of My law, and keep the orders of My judgments, and perform them,", "tj": "", "tj_en": "", "rashi": "<b>אם בחקתי תלכו.<\/b> יָכוֹל זֶה קִיּוּם הַמִּצְווֹת, כְּשֶׁהוּא אוֹמֵר וְאֶת מִצְוֹתַי תִּשְׁמְרוּ וַעֲשִיתֶם אֹתָם הֲרֵי קִיּוּם הַמִּצְווֹת אָמוּר, הָא מָה אֲנִי מְקַיֵּם אִם בְּחֻקֹּתַי תֵּלֵכוּ? שֶׁתִּהְיוּ עֲמֵלִים בַּתּוֹרָה (ספרא):<br><br><b>ואת מצותי תשמרו.<\/b> הֱווּ עֲמֵלִים בַּתּוֹרָה עַל מְנָת לִשְׁמֹר וּלְקַיֵּם, כְּמוֹ שֶׁנֶּאֱמַר \"וּלְמַדְתֶּם אֹתָם וּשְׁמַרְתֶּם לַעֲשֹׂתָם\" (דברים ה'):", "rashi_en": "אם בחקתי תלכו IF YE WALK IN MY ORDINANCES — One might think that this denotes the fulfilment of the commandments; but when Scripture states “and ye shall keep My commandments and do them”, it is plain that in this passage there is mentioned the “fulfilment of the commands”. How then must I explain אם בחקתי תלכו? As an admonition that you should study the Torah laboriously (Sifra, Bechukotai, Section 1 1-2)<br><br>ואת מצותי תשמרו AND TAKE HEED OF MY COMMANDMENTS — Study the Torah laboriously with the intention to take heed and to fulfil its teachings, as it is said, (Deuteronomy 5:1) “and ye shall learn them and take heed to do them\"."}, {"ch": 26, "v": 4, "aliyah": 1, "heb": "וְנָתַתִּ֥י גִשְׁמֵיכֶ֖ם בְּעִתָּ֑ם וְנָתְנָ֤ה הָאָ֙רֶץ֙ יְבוּלָ֔הּ וְעֵ֥ץ הַשָּׂדֶ֖ה יִתֵּ֥ן פִּרְיֽוֹ׃", "onk": "וְאֶתֵּן מַטְרֵיכוֹן בְּעִדָּנְהוֹן וְתִתֵּן אַרְעָא עֲלַלְתָּא וְאִילַן חַקְלָא יִתֵּן אִבֵּיהּ:", "onk_en": "I will provide your rains in their proper time. The earth shall give forth its produce and the tree of the field shall give forth its produce.", "pj": "וְאֶתֵּן מִטְרַיָא דְאַרְעֲכוֹן בְּעִידַנְכוֹן בַּכִּיר וְלָקִישׁ וְתִתֵּן אַרְעָא פֵּירֵי עֲלַלְתָּהּ וְאִילַן דְאַנְפֵּי בָרָא יַצְלַח בְּפֵירוֹי", "pj_en": "then will I give you the rains for your lands in your seasons, the early and the late, and the land shall yield the fruits of increase, and the tree on the face of the field shall be prosperous in its fruit.", "tj": "", "tj_en": "", "rashi": "<b>בעתם.<\/b> בְּשָׁעָה שֶׁאֵין דֶּרֶךְ בְּנֵי אָדָם לָצֵאת, כְּגוֹן בְּלֵילֵי שַׁבָּתוֹת (ספרא; תענית כ\"ג):<br><br><b>ועץ השדה.<\/b> הֵן אִילָנֵי סְרָק, וַעֲתִידִין לַעֲשׂוֹת פֵּרוֹת (ספרא):", "rashi_en": "בעתם [THEN I WILL GIVE YOU RAIN] IN ITS SEASON — i. e. at times when the rain is “seasonable”, at such moments when people do not usually go out on journeys, as, for instance, in the nights preceding the Sabbaths (Friday nights) (Sifra, Bechukotai, Chapter 1 1; cf. Taanit 23a).<br><br>ועץ השדה AND THE TREES OF THE FIELD [SHALL YIELD THEIR FRUIT] — This refers to the wild trees; and even these will bear fruits in future (Sifra, Bechukotai, Chapter 1 6)."}, {"ch": 26, "v": 5, "aliyah": 1, "heb": "וְהִשִּׂ֨יג לָכֶ֥ם דַּ֙יִשׁ֙ אֶת־בָּצִ֔יר וּבָצִ֖יר יַשִּׂ֣יג אֶת־זָ֑רַע וַאֲכַלְתֶּ֤ם לַחְמְכֶם֙ לָשֹׂ֔בַע וִֽישַׁבְתֶּ֥ם לָבֶ֖טַח בְּאַרְצְכֶֽם׃", "onk": "וִיעָרַע לְכוֹן דְּיָשָׁא יָת קְטָפָא וּקְטָפָא יְעָרַע לְאַפּוֹקֵי בַר זַרְעָא וְתֵיכְלוּן לַחְמְכוֹן לְמִשְׂבַּע וְתֵיתְבוּן לְרָחְצָן בְּאַרְעֲכוֹן:", "onk_en": "[Because of the abundant produce] threshing will overtake the grape harvest and the grape harvest overtake the [time to] plant, and you will eat your bread to satiation and you will live securely in your land.", "pj": "וְיֶאֱרַע לְכוֹן דַרְכָא יַת קִטְפָא וְקִטְפָא יֶאֱרַע אַפְקוּת בַּר זַרְעָא וְתֵיכְלוּן לַחְמֵיכוֹן וְתִשְבְּעוּן וְתֵתְבוּן לְרוֹחֲצָן בְּאַרְעֲכוֹן", "pj_en": "And with you the threshing shall reach to the vintage, and the vintage unto the springing of the seed, and you shall eat your bread and be satisfied, and dwell securely in your land.", "tj": "", "tj_en": "", "rashi": "<b>והשיג לכם דיש את בציר.<\/b> שֶׁיְּהֵא הַדַּיִשׁ מְרֻבֶּה, וְאַתֶּם עֲסוּקִים בּוֹ עַד הַבָּצִיר, וּבַבָּצִיר תַּעַסְקוּ עַד שְׁעַת הַזֶּרַע (ספרא):<br><br><b>ואכלתם לחמכם לשבע.<\/b> אוֹכֵל קִמְעָא וְהוּא מִתְבָּרֵךְ בְּמֵעָיו:", "rashi_en": "והשיג לכם דיש את בציר AND YOUR THRESHING SHALL REACH UNTO THE VINTAGE — This means that there will be plenty of threshing-work so that you will be busy with it till the vintage, and with the vintage you will be busy till the time of sowing (Sifra, Bechukotai, Chapter 1 7).<br><br>ואכלתם לחמכם לשבע AND YE SHALL EAT YOUR BREAD TO THE FULL — This means, one will eat only a little and it will become blessed in his bowels (will fully satisfy him) (Sifra, Bechukotai, Chapter 1 7; cf. Rashi on Leviticus 25:19)."}, {"ch": 26, "v": 6, "aliyah": 2, "heb": "וְנָתַתִּ֤י שָׁלוֹם֙ בָּאָ֔רֶץ וּשְׁכַבְתֶּ֖ם וְאֵ֣ין מַחֲרִ֑יד וְהִשְׁבַּתִּ֞י חַיָּ֤ה רָעָה֙ מִן־הָאָ֔רֶץ וְחֶ֖רֶב לֹא־תַעֲבֹ֥ר בְּאַרְצְכֶֽם׃", "onk": "וְאֶתֵּן שְׁלָמָא בְּאַרְעָא וְתִשְׁרוּן וְלֵית דְּמָנִיד וֶאֱבַטֵּל חַיְתָא בִשְׁתָּא מִן אַרְעָא וּדְקָטְלִין בְּחַרְבָּא לָא יְעִדּוּן בְּאַרְעֲכוֹן:", "onk_en": "I will grant peace in the land; you will lie down (sleep) [<b>rest<\/b>] without disturbance (fear). I will banish [<b>nullify<\/b>] evil beasts from the land, and no [<b>people who kill with a<\/b>] sword shall pass through your land.", "pj": "וְאֶתֵּן שְׁלָמָא בְּאַרְעָא דְיִשְרָאֵל וְתִשְׁרוּן וְלֵית דְמָנִיד וְאֶבְטוֹל רְשׁוּת חֵיוַת בְּרָא מִן אַרְעָא דְיִשְרָאֵל וּשְׁלוּפֵי חֶרֶב לָא יְעִידוּן בְּאַרְעֲכוֹן", "pj_en": "And I will give peace in the land of Israel, that you may repose, and there be none to disturb; and I will make the power of the wild beast to cease from the land of Israel, and the unsheather of the sword shall not pass through your land.", "tj": "", "tj_en": "", "rashi": "<b>ונתתי שלום.<\/b> שֶׁמָּא תֹאמְרוּ, הֲרֵי מַאֲכָל וַהֲרֵי מִשְׁתֶּה, אִם אֵין שָׁלוֹם אֵין כְּלוּם, תַּ\"לֹ אַחַר כָּל זֹאת \"וְנָתַתִּי שָׁלוֹם בָּאָרֶץ\"; מִכָּאן שֶׁהַשָּׁלוֹם שָׁקוּל כְּנֶגֶד הַכֹּל, וְכֵן הוּא אוֹמֵר (ישעיה מ\"ה) \"עוֹשֶׂה שָׁלוֹם וּבוֹרֵא אֶת הַכֹּל\":<br><br><b>וחרב לא תעבר בארצכם.<\/b> אֵצָ\"לֹ שֶׁלֹּא יָבֹאוּ לַמִּלְחָמָה, אֶלָּא אֲפִלּוּ לַעֲבֹר דֶּרֶךְ אַרְצְכֶם מִמְּדִינָה לִמְדִינָה (ספרא):", "rashi_en": "ונתתי שלום AND I WILL GIVE PEACE [IN THE  [LAND— Perhaps  you will say, “Well, there is food and there is drink; but if there is no peace, then all this is nothing!” Scripture therefore states after all these promises “I will give peace in the land”. Hence we may learn that peace counterbalances everything. In a similar sense it states: “Who makest peace and createst all things\" (Sifra, Bechukotai, Chapter 1 8).<br><br>וחרב לא תעבור בארצכם NEITHER SHALL THE SWORD PASS THROUGH YOUR LAND — Surely it is unnecessary to say that they (enemies) will not enter your land to wage war (since this is implied in ‎‎בארץ ‎‎‎‎‎ונתתי שלום). But this means that they will not enter even to pass by way of your land [on their march from one country to another to wage war] (Sifra, Bechukotai, Chapter 2 3)."}, {"ch": 26, "v": 7, "aliyah": 2, "heb": "וּרְדַפְתֶּ֖ם אֶת־אֹיְבֵיכֶ֑ם וְנָפְל֥וּ לִפְנֵיכֶ֖ם לֶחָֽרֶב׃", "onk": "וְתִרְדְּפוּן יָת בַּעֲלֵי דְבָבֵיכוֹן וְיִפְּלוּן קֳדָמֵיכוֹן לְחַרְבָּא:", "onk_en": "You will pursue your enemies and they will fall before you by the sword.", "pj": "וְתִרְדְפוּן יַת בַּעֲלֵי דְבָבֵיכוֹן וְיִפְּלוּן קָדָמֵיכוֹן תְּבִירֵי חָרֶב", "pj_en": "And you shall chase your adversaries, and they will fall before you broken with the sword.", "tj": "", "tj_en": "", "rashi": "<b>לפניכם לחרב.<\/b> אִישׁ בְּחֶרֶב רֵעֵהוּ (שם):", "rashi_en": "לפניכם לחרב [AND YE SHALL PURSUE YOUR ENEMIES AND THEY SHALL FALL] BEFORE YOU BY THE SWORD — one by the sword of the other (Sifra, Bechukotai, Chapter 2 3)."}, {"ch": 26, "v": 8, "aliyah": 2, "heb": "וְרָדְפ֨וּ מִכֶּ֤ם חֲמִשָּׁה֙ מֵאָ֔ה וּמֵאָ֥ה מִכֶּ֖ם רְבָבָ֣ה יִרְדֹּ֑פוּ וְנָפְל֧וּ אֹיְבֵיכֶ֛ם לִפְנֵיכֶ֖ם לֶחָֽרֶב׃", "onk": "וְיִרְדְּפוּן מִנְּכוֹן חַמְשָׁא מְאָה וּמְאָה מִנְּכוֹן לְרִבּוֹתָא יֵעִירְקוּן וְיִפְּלוּן בַּעֲלֵי דְבָבֵיכוֹן קֳדָמֵיכוֹן לְחַרְבָּא:", "onk_en": "Five of you will pursue one hundred and one hundred of you will pursue ten thousand, and your enemies will fall before you by the sword.", "pj": "וְיִרְדְפוּן מִנְכוֹן חַמְשָׁא לְמָאתָא וּמָאתָא מִנְכוֹן לְרִבְבוּתָא יַעֲרִיקוּן וְיִפְּלוּן בַּעֲלֵי דְבָבֵיכוֹן קֳדָמֵיכוֹן תְּבִירֵי חֶרֶב", "pj_en": "And five of you will chase a hundred, and a hundred of you put a myriad to flight, and your adversaries shall fall before you, broken with the sword.", "tj": "", "tj_en": "", "rashi": "<b>ורדפו מכם.<\/b> מִן הַחַלָּשִׁים שֶׁבָּכֶם וְלֹא מִן הַגִּבּוֹרִים שֶׁבָּכֶם (שם):<br><br><b>חמשה מאה ומאה מכם רבבה.<\/b> וְכִי כָךְ הוּא הַחֶשְׁבּוֹן? וַהֲלֹא לֹא הָיָה צָרִיךְ לוֹמַר אֶלָּא מֵאָה מִכֶּם שְׁנֵי אֲלָפִים יִרְדֹּפוּ, אֶלָּא אֵינוֹ דּוֹמֶה מֻעֲטִין הָעוֹשִׂים אֶת הַתּוֹרָה לִמְרֻבִּין הָעוֹשִׂין אֶת הַתּוֹרָה (שם):<br><br><b>ונפלו איביכם וגו'.<\/b> שֶׁיִּהְיוּ נוֹפְלִין לִפְנֵיכֶם שֶׁלֹּא כְדֶרֶךְ הָאָרֶץ (שם):", "rashi_en": "ורדפו מכם [AND FIVE] OF YOU SHALL PURSUE [A HUNDRED] — five of the weakest among you — and not alone of the most robust among you (Sifra, Bechukotai, Chapter 2 4).<br><br>‎חמישה מאה ומאה מכם רבבה FIVE [OF YOU SHALL PURSUE] A HUNDRED AND A HUNDRED… TEN THOUSAND — But is this the right proportion? Surely it should have stated only “and a hundred of you shall pursue two thousand (and not ten thousand)!? But the explanation is: a few who fulfill the commandments of the Torah cannot compare with the many who fulfill the commandments of the Torah (i. e. the greater the group of those loyal to the Torah, the greater is the morale and, under God’s blessing, the physical strength of each individual belonging to the group) (Sifra, Bechukotai, Chapter 2 4).<br><br>'ונפלו איביכם וגו AND YOUR ENEMIES SHALL FALL etc . — The repetition of this promise already expressed in v. 7 suggests that they will fall before you in a supernatural way (lit., not in the way of the world) (Sifra, Bechukotai, Chapter 2 4)."}, {"ch": 26, "v": 9, "aliyah": 2, "heb": "וּפָנִ֣יתִי אֲלֵיכֶ֔ם וְהִפְרֵיתִ֣י אֶתְכֶ֔ם וְהִרְבֵּיתִ֖י אֶתְכֶ֑ם וַהֲקִימֹתִ֥י אֶת־בְּרִיתִ֖י אִתְּכֶֽם׃", "onk": "וְאֶתְפְּנִי בְמֵימְרִי לְאוֹטָבָא לְכוֹן וְאַפֵּשׁ יָתְכוֹן וְאַסְגֵּי יָתְכוֹן וַאֲקֵם יָת קְיָמִי עִמְּכוֹן:", "onk_en": "I will turn [<b>with My Word to do good<\/b>] to you and make you fruitful and multiply you, and establish My covenant with you.", "pj": "וְאִתְפְּנֵי מִן אֲגַר עַמְמַיָא לִמְשַׁלְמָא לְכוֹן אֲגַר עוֹבָדֵיכוֹן טַבְיָא וְאִיתְקוֹף יַתְכוֹן וְאַסְגֵי יַתְכוֹן וְאָקִים יַת קָיָימַי עִמְכוֹן", "pj_en": "For I will turn from the wages of the Gentiles, to fulfil to you the recompense of your good works, and I will strengthen you, and multiply you, and establish My covenant with you.", "tj": "", "tj_en": "", "rashi": "<b>ופניתי אליכם.<\/b> אֶפְנֶה מִכָּל עֲסָקַי לְשַׁלֵּם שְׂכַרְכֶם. מָשָׁל לְמָה הַדָּבָר דּוֹמֶה? לְמֶלֶךְ שֶׁשָּׂכַר פּוֹעֲלִים וְכוּ', כִּדְאִיתָא בְּתֹ\"כֹּ:<br><br><b>והפריתי אתכם.<\/b> בִּפְרִיָּה וּרְבִיָּה:<br><br><b>והרביתי אתכם.<\/b> בְּקוֹמָה זְקוּפָה (ספרא):<br><br><b>והקימתי את בריתי אתכם.<\/b> בְּרִית חֲדָשָׁה, לֹא כַבְּרִית הָרִאשׁוֹנָה שֶׁהֵפַרְתֶּם אוֹתָהּ אֶלָּא בְּרִית חֲדָשָׁה שֶׁלֹּא תּוּפַר, שֶׁנֶּאֱמַר (ירמיהו ל\"א) \"וְכָרַתִּי אֶת בֵּית יִשְׂרָאֵל וְאֶת בֵּית יְהוּדָה בְּרִית חֲדָשָׁה לֹא כַבְּרִית וְגוֹ'\" (ספרא):", "rashi_en": "ופניתי אליכם AND I WILL TURN UNTO YOU — This means, I will turn away from all My business in order to pay you your reward. A parable! To what may this be compared? To a king who hired labourers etc., just as is explained in Torath Cohanim (Sifra, Bechukotai, Chapter 2 5).<br><br>והפריתי אתכם AND I SHALL MAKE YOU FRUITFUL — This, of course, means:in פריה ורביה in reproductive power (i. e. in numbers), but — <br><br>והרביתי אתכם (which may denote: “I will make you large”) means in height (lit., erect stature) (Sifra, Bechukotai, Chapter 2 5).<br><br>והקמתי את בריתי אתכם AND I WILL ESTABLISH MY COVENANT WITH YOU — a new covenant; not like that covenant which you broke by  worshipping  the golden calf), as it said, (Jeremiah 31:31-32): “[Behold, the days come, saith the Lord that] I will make a new covenant with the house of Israel, and with the house of Judah. Not according to the covenant [that I made with their fathers,… which My covenant they broke, but… I will put My law in their inward parts, and write it in their hearts]” (Sifra, Bechukotai, Chapter 2 5)."}, {"ch": 26, "v": 10, "aliyah": 3, "heb": "וַאֲכַלְתֶּ֥ם יָשָׁ֖ן נוֹשָׁ֑ן וְיָשָׁ֕ן מִפְּנֵ֥י חָדָ֖שׁ תּוֹצִֽיאוּ׃", "onk": "וְתֵיכְלוּן עַתִּיקָא דְּעַתִּיק וְעַתִּיקָא מִן קֳדָם חֲדַתָּא תְּפַנּוּן:", "onk_en": "You will eat the old [store] long kept and the old [store] you will have to clear out because of the new.", "pj": "וְתֵיכְלוּן עַתִּיקָא דִמְעַתֵּק וְלָא תְסַלְמִנְטוֹן וּבְרַם עַתִּיקָא מִן קָדָם עִיבּוּרָא חַדְתָּא תִּפְנוּן מִן אוֹצִירֵיכוֹן", "pj_en": "And you shall eat the old that is old without having the corn-worm, and the old from before the new produce shall ye turn out of your barns.", "tj": "", "tj_en": "", "rashi": "<b>ואכלתם ישן נושן.<\/b> הַפֵּרוֹת יִהְיוּ מִשְׁתַּמְרִין וְטוֹבִים לְהִתְיַשֵּׁן, שֶׁיְּהֵא יָשָׁן הַנּוֹשָׁן שֶׁל שָׁלוֹשׁ שָׁנִים יָפֶה לֶאֱכֹל מִשֶּׁל אֶשְׁתָּקַד (בבא בתרא צ\"א):<br><br><b>וישן מפני חדש תוציאו.<\/b> שֶׁיִּהְיוּ הַגְּרָנוֹת מְלֵאוֹת חָדָשׁ וְהָאוֹצָרוֹת מְלֵאוֹת יָשָׁן, וּצְרִיכִים אַתֶּם לְפַנּוֹת הָאוֹצָרוֹת לְמָקוֹם אַחֵר, לָתֵת הֶחָדָשׁ לְתוֹכָן (שם):", "rashi_en": "ואכלתם ישן נושן AND YE SHALL EAT STORE OF FORMER YEARS (lit., ye shall eat old that has become old) — This involves a promise that the fruits (grain) will be fit to keep the whole year and will even be of such good quality as to become old, so that the old grain that has grown old, that which is in its third year, will be better for food than that of the last year (Sifra, Bechukotai, Chapter 3 1; cf. Bava Batra 91b).<br><br>וישן מפני חדש תוציאו AND YE SHALL CLEAR OUT THAT OF THE FORMER YEARS BECAUSE OF THE NEW — because the threshing floors in the fields will be full of new grain while the granaries are still full of the old, so that you will have to clear the granaries out into another place in order to place the new fruit in them (for this requires a dry place to preserve them, while the old fruit has already become dry and may therefore be removed from the granaries) (Bava Batra 91b)"}, {"ch": 26, "v": 11, "aliyah": 3, "heb": "וְנָתַתִּ֥י מִשְׁכָּנִ֖י בְּתוֹכְכֶ֑ם וְלֹֽא־תִגְעַ֥ל נַפְשִׁ֖י אֶתְכֶֽם׃", "onk": "וְאֶתֵּן מַשְׁכְּנִּי בֵּינֵיכוֹן וְלָא יְרַחֵק מֵימְרִי יָתְכוֹן:", "onk_en": "I will set My Sanctuary among you and My spirit [<b>Word<\/b>] will not loathe (reject) you.", "pj": "וְאֶתֵּן שְׁכִינַת יְקָרִי בֵּינֵיכוֹן וְלָא יְרַחֵק מֵימְרִי יַתְכוֹן", "pj_en": "And I will set the Shekinah of My Glory among you, and my Word shall not abhor you,", "tj": "", "tj_en": "", "rashi": "<b>ונתתי משכני.<\/b> זֶה בֵּית הַמִּקְדָּשׁ (ספרא: עירובין ב'):<br><br><b>ולא תגעל נפשי.<\/b> אֵין רוּחִי קָצָה בָכֶם; כָּל גְּעִילָה לְשׁוֹן פְּלִיטַת דָּבָר הַבָּלוּעַ בְּדָבָר, כְּמוֹ \"כִּי שָׁם נִגְעַל מָגֵן גִּבּוֹרִים\" (שמואל ב א') — לֹא קִבֵּל הַמְּשִׁיחָה, שֶׁמּוֹשְׁחִין מָגֵן שֶׁל עוֹר בְּחֵלֶב מְבֻשָּׁל כְּדֵי לְהַחֲלִיק מֵעָלָיו מַכַּת חֵץ אוֹ חֲנִית, שֶׁלֹּא יִקֹּב הָעוֹר:", "rashi_en": "ונתתי משכני AND I WILL SET MY DWELLING [AMONGST YOU] — This means the Temple at Jerusalem (Sifra, Bechukotai, Chapter 3 2; Eruvin 2a).<br><br>ולא תגעל נפשי אתכם This means AND MY SPIRIT SHALL NOT LOATHE YOU. The root געל wherever it occurs denotes the casting out (as though spewing) or something that has been absorbed in another substance. In a similar sense the verb is used in (II Samuel 1:21) “For there the shield of the mighty was נגעל, [the shield of Saul, as though it had never been anointed with oil]”, i. e. it did not show itself receptive to being anointed, but ejected, as it were, the oily substance with which it had been smeared; for they used to smear leather shields with boiled fat in order to make the blow of the arrow or the spear glide off, so that it should not penetrate the leather. (Thus, when two things have been in the closest association, the term געל may be used of that which finally discards the other. It spews it out, as it were, it is sick of it, loathes it.)"}, {"ch": 26, "v": 12, "aliyah": 3, "heb": "וְהִתְהַלַּכְתִּי֙ בְּת֣וֹכְכֶ֔ם וְהָיִ֥יתִי לָכֶ֖ם לֵֽאלֹהִ֑ים וְאַתֶּ֖ם תִּהְיוּ־לִ֥י לְעָֽם׃", "onk": "וְאַשְׁרֵי שְׁכִינְתִּי בֵּינֵיכוֹן וְאֶהֱוֵי לְכוֹן לֶאֱלָהּ וְאַתּוּן תְּהוֹן קֳדָמַי לְעָם:", "onk_en": "I will walk [<b>rest My Shechina<\/b>] among you and I will be a God for you, and you will be My [<b>before Me for a<\/b>] people.", "pj": "וְאַשְׁרֵי אִיקַר שְׁכִינְתִּי בֵּינֵיכוֹן וִיהֵי מֵימְרִי לְכוֹן לֶאֱלָהָא פְּרוֹק וְאַתּוּן תְּהוֹן לִשְׁמִי לְאוּמָא קַדִישַׁיָא", "pj_en": "but the Glory of My Shekinah shall dwell among you, and My Word shall be to you for a redeeming God, and you shall be unto My Name for a holy people.", "tj": "", "tj_en": "", "rashi": "<b>והתהלכתי בתוככם.<\/b> אֲטַיֵּל עִמָּכֶם בְּגַן עֵדֶן כְּאֶחָד מִכֶּם, וְלֹא תִהְיוּ מִזְדַּעְזְעִים מִמֶּנִּי, יָכוֹל לֹא תִירְאוּ מִמֶּנִּי, תַּ\"לֹ \"וְהָיִיתִי לָכֶם לֵאלֹהִים\" (ספרא):", "rashi_en": "והתהלכתי בתוככם AND I WILL WALK AMONG YOU — I will, as it were, walk with you in the Garden of Eden as though I were one of yourselves and you will not be frightened of Me. One might think that this implies: you will not fear (reverence) Me! Scripture however states, “but I will be your God” (Sifra, Bechukotai, Chapter 3 3-4)."}, {"ch": 26, "v": 13, "aliyah": 3, "heb": "אֲנִ֞י יְהֹוָ֣ה אֱלֹֽהֵיכֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְכֶם֙ מֵאֶ֣רֶץ מִצְרַ֔יִם מִֽהְיֹ֥ת לָהֶ֖ם עֲבָדִ֑ים וָאֶשְׁבֹּר֙ מֹטֹ֣ת עֻלְּכֶ֔ם וָאוֹלֵ֥ךְ אֶתְכֶ֖ם קֽוֹמְמִיּֽוּת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲנָא יְיָ אֱלָהָכוֹן דִּי אַפֵּקִית יָתְכוֹן מֵאַרְעָא דְמִצְרַיִם מִלְּמֶהֱוֵי לְהוֹן עַבְדִּין וְתַבָּרִית נִיר עַמְמַיָּא מִנְּכוֹן וְדַבָּרִית יָתְכוֹן לְחֵרוּתָא:", "onk_en": "I am Adonoy your God who brought you out of the land of Egypt from where you were slaves, and I broke the bars of your yoke [<b>of the peoples from you<\/b>] and led you forth standing upright [<b>to freedom<\/b>].", "pj": "אֲנָא יְיָ אֱלָהָכוֹן דְאַפֵּיקִית יַתְכוֹן פְּרִיקִין מִן אַרְעָא דְמִצְרַיִם לְמֶהֱוֵי לְהוֹן מְשַׁעְבְּדִין וּתְבָרִית נִיר שִׁעֲבּוּדְהוֹן מֵעִלַוֵיכוֹן וּדְבָרִית יַתְכוֹן מִבֵּינֵיהוֹן בְּנֵי חוֹרֵי וְהַלְכִית יַתְכוֹן בְּקוֹמָא זְקוּפָא", "pj_en": "I am the Lord your God, who brought you out redeemed from the land of Mizraim, that you should not be bondmen to them, and brake the yoke of their bondage from off you, and brought you out from among them, the children of liberty, and led you forth with an erect stature.", "tj": "", "tj_en": "", "rashi": "<b>אני ה' אלהיכם.<\/b> כְּדַאי אֲנִי שֶׁתַּאֲמִינוּ בִי שֶׁאֲנִי יָכוֹל לַעֲשׂוֹת כָּל אֵלֶּה, שֶׁהֲרֵי הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם וְעָשִׂיתִי לָכֶם נִסִּים גְּדוֹלִים:<br><br><b>מטת.<\/b> כְּמִין יָתֵד בִּשְׁנֵי רָאשֵׁי הָעֹל הַמְעַכְּבִים הַמּוֹסֵרָה שֶׁלֹּא תֵצֵא מֵרֹאשׁ הַשּׁוֹר וְיַתִּיר הַקֶּשֶׁר, כְּמוֹ \"עֲשֵֹה לְךָ מוֹסֵרוֹת וּמֹטוֹת\" (ירמיהו כ\"ז), קבילייא בְּלַעַז:<br><br><b>קוממיות.<\/b> בְּקוֹמָה זְקוּפָה (ספרא):", "rashi_en": "אני ה׳ אלהיכם I AM THE LORD YOUR GOD [WHO BROUGHT YOU FORTH FROM THE LAND OF EGYPT] — I deserve that you should put your trust in Me that I am able to do all these things, for, behold, I brought you forth from the land of Egypt and have wrought great miracles for you (Sifra, Bechukotai, Chapter 3 4). <br><br>מטות are a kind of peg inserted in both ends of the yoke which hold back the strap from slipping off the head of the ox whereby the knot might become undone. Similar is (Jeremiah 27:2). “Make thee strips and poles (מטות)”; cheville, in old French, English pins. <br><br>קוממיות means erect in stature (in contrast to the bent position of a person who is under a yoke) (Sifra, Bechukotai, Chapter 3 7)."}, {"ch": 26, "v": 14, "aliyah": 3, "heb": "וְאִם־לֹ֥א תִשְׁמְע֖וּ לִ֑י וְלֹ֣א תַעֲשׂ֔וּ אֵ֥ת כׇּל־הַמִּצְוֺ֖ת הָאֵֽלֶּה׃", "onk": "וְאִם לָא תְקַבְּלוּן לְמֵימְרִי וְלָא תַעְבְּדוּן יָת כָּל פִּקּוּדַיָּא הָאִלֵּין:", "onk_en": "And if you will not listen to Me [<b>accept My Word<\/b>] and you will not fulfill all of these commandments.", "pj": "וְאִם לָא תִיצְבוּן לְמִשְׁמַע לְאוּלְפַן מֵאַלְפֵי אוֹרַיְיתָא וְלָא תַעַבְדוּן מִן רְעוּתֵיכוֹן יַת כָּל פִּיקוּדַיָא הָאִילֵן", "pj_en": "But if you will be unwilling to hear the instructions of the doctrine of My law, and to perform all these precepts with your free choice;", "tj": "", "tj_en": "", "rashi": "<b>ואם לא תשמעו לי.<\/b> לִהְיוֹת עֲמֵלִים בַּתּוֹרָה, לָדַעַת מִדְרַשׁ חֲכָמִים. יָכוֹל לְקִיּוּם הַמִּצְווֹת? כְּשֶׁהוּא אוֹמֵר וְלֹא תַעֲשׂוּ וְגוֹ' הֲרֵי קִיּוּם מִצְווֹת אָמוּר, הָא מָה אֲנִי מְקַיֵּם וְאִם לֹא תִשְׁמְעוּ לִי? לִהְיוֹת עֲמֵלִים בַּתּוֹרָה, וּמַה תַּ\"לֹ לִי? אֵין לִי אֶלָּא זֶה הַמַּכִּיר אֶת רִבּוֹנוֹ וּמְכַוֵּן לִמְרֹד בּוֹ, וְכֵן בְּנִמְרוֹד \"גִּבּוֹר צַיִד לִפְנֵי ה'\" (בראשית י'), שֶׁמַּכִּירוֹ וּמִתְכַּוֵּן לִמְרֹד בּוֹ, וְכֵן בְּאַנְשֵׁי סְדוֹם \"רָעִים וְחַטָּאִים לַה' מְאֹד\" (שם י\"ג), מַכִּירִים אֶת רִבּוֹנָם וּמִתְכַּוְּנִים לִמְרֹד בּוֹ (ספרא):<br><br><b>ולא תעשו.<\/b> מִשֶּׁלֹּא תִלְמְדוּ לֹא תַעֲשׂוּ, הֲרֵי שְׁתֵּי עֲבֵרוֹת:", "rashi_en": "ואם לא תשמעו לי BUT IF YE WILL NOT HEARKEN UNTO ME to study the Torah laboriously in order to fathom the textual interpretation of the Sages…, I also will do this unto you, etc. One might think that this refers to the fulfillment of the commandments! When, however, Scripture states immediately afterwards: “and ye will not do [all my commandments]”, it is evident that the fulfilment of the commandments is mentioned there! How, then, must I explain לא תשמעו לי? Obviously as meaning: “But if you will not hearken unto Me to study the Torah industriously” as I bid you do when I said אם בחקתי תלכו (cf. Rashi on v. 3). And what is the force of the word לי? (To express this idea would it not have sufficed to state: ואם לא תשמעו?) It implies that your disobedience is directed לי against Me. The word לי is used only in the case of such a one who knows his Master and yet of set purpose rebels against Him (i. e. the entire chapter containing these threats of punishment is addressed only to such a person, not to one who sins against God unwittingly). Similarly in reference to Nimrod: (Genesis 10:9) “a mighty hunter before (לפני) the Lord” which means that he knew Him and yet of set purpose rebelled against him. Similarly in reference to the men of Sodom: (Genesis 13:13) “[But the men of Sodom were] evil and sinful against the Lord ('לה‎) exceedingly” — they knew their Master and yet of set purpose rebelled against him (Sifra, Bechukotai, Section 2 1-2; cf. Rashi on those two verses).<br><br>ולא תעשו AND YOU WILL NOT DO — Because you will not learn you will not practice the commandments: thus you have two separate sins mentioned here (Sifra, Bechukotai, Section 2 3)."}, {"ch": 26, "v": 15, "aliyah": 3, "heb": "וְאִם־בְּחֻקֹּתַ֣י תִּמְאָ֔סוּ וְאִ֥ם אֶת־מִשְׁפָּטַ֖י תִּגְעַ֣ל נַפְשְׁכֶ֑ם לְבִלְתִּ֤י עֲשׂוֹת֙ אֶת־כׇּל־מִצְוֺתַ֔י לְהַפְרְכֶ֖ם אֶת־בְּרִיתִֽי׃", "onk": "וְאִם בִּקְיָמַי תְּקוֹצוּן וְאִם יָת דִּינַי תְּרַחֵק נַפְשְׁכוֹן בְּדִיל דְּלָא לְמֶעְבַּד יָת כָּל פִּקּוֹדַי לְאַשְׁנָיוּתְכוֹן יָת קְיָמִי:", "onk_en": "If you despise My statutes and your souls loathe [<b>reject<\/b>] My laws so as not to fulfill all My commandments, thereby breaking [<b>changing<\/b>] My convenant.", "pj": "וְאִין בִּקְיָמֵי אוֹרַיְיתִי תְקוּצוּן וְאִין יַת סִדְרֵי דִינֵי תַּרְחִיק נַפְשָׁתֵיכוֹן בְּדִיל דְלָא לְמֶעְבַּד יַת כָּל פִּקוּדַי וְסוֹפְכוֹן לִמְבַטְלָא יַת קְיָימַי", "pj_en": "and if you despise My statutes, and hate in your soul the orders of My judgments, to do not all My precepts, but your purpose be to abolish My covenant;", "tj": "", "tj_en": "", "rashi": "<b>ואם בחקתי תמאסו.<\/b> מוֹאֵס בַּאֲחֵרִים הָעוֹשִׂים:<br><br><b>משפטי תגעל נפשכם.<\/b> שׂוֹנֵא הַחֲכָמִים:<br><br><b>לבלתי עשות.<\/b> מוֹנֵעַ אֶת אֲחֵרִים מֵעֲשׂוֹת:<br><br><b>את כל מצותי.<\/b> כּוֹפֵר שֶׁלֹּא צִוִּיתִים, לְכָךְ נֶאֱמַר \"אֶת כָּל מִצְוֹתַי\" וְלֹא נֶאֱמַר \"אֶת כָּל הַמִּצְוֹת\":<br><br><b>להפרכם את בריתי.<\/b> כּוֹפֵר בָּעִקָּר; הֲרֵי שֶׁבַע עֲבֵרוֹת, הָרִאשׁוֹנָה גוֹרֶרֶת הַשְּׁנִיָּה, וְכֵן עַד הַשְּׁבִיעִית, וְאֵלּוּ הֵן: לֹא לָמַד, וְלֹא עָשָׂה, מוֹאֵס בַּאֲחֵרִים הָעוֹשִׂים, שׂוֹנֵא אֶת הַחֲכָמִים, מוֹנֵעַ אֶת הָאֲחֵרִים, כּוֹפֵר בַּמִּצְווֹת, כּוֹפֵר בָּעִקָּר:", "rashi_en": "ואם בחקתי תמאסו   AND IF YE WILL SCORN MY ORDINANCES — scorn those who practise them.<br><br>משפטי תגעל נפשם [IF] YOUR SOUL LOTH MY JUDGMENTS — This implies hating the Sages.<br><br>לבלתי עשות (lit., that my commandments should not be done) — this therefore implies that one prevents others from practising them. (That they themselves do not do them has already been stated in v. 14).<br><br>את כל מצותי ALL MY COMMANDMENTS — This refers to him who denies the Divine origin of the commandments, asserting that I have not commanded them. It is for this reason that Scripture states, “all My commands” and does not state, as in v. 14, \"all these commands”.<br><br>להפרכם את בריתי TO MAKE VOID MY COVENANT — denying the great principle of the existence of God (Sifra, Bechukotai, Section 2 3). — Thus you have here seven sins the first of which brings the second in its train and so on to the seventh. And these are: he has not studied and therefore has not practised the commandments; consequently he scorns others who do practise them, hates the Sages, prevents others from practising, denies the Divine origin of the commandments, and finally denies the existence of God."}, {"ch": 26, "v": 16, "aliyah": 3, "heb": "אַף־אֲנִ֞י אֶֽעֱשֶׂה־זֹּ֣את לָכֶ֗ם וְהִפְקַדְתִּ֨י עֲלֵיכֶ֤ם בֶּֽהָלָה֙ אֶת־הַשַּׁחֶ֣פֶת וְאֶת־הַקַּדַּ֔חַת מְכַלּ֥וֹת עֵינַ֖יִם וּמְדִיבֹ֣ת נָ֑פֶשׁ וּזְרַעְתֶּ֤ם לָרִיק֙ זַרְעֲכֶ֔ם וַאֲכָלֻ֖הוּ אֹיְבֵיכֶֽם׃", "onk": "אַף אֲנָא אֶעְבַּד דָּא לְכוֹן וְאַסְעַר עֲלֵיכוֹן בַּהֶלְתָּא יָת שַׁחֶפְתָּא וְיָת קַדַּחְתָּא מְחַשְּׁכָן עַיְנִין וּמַפְּחַן נְפָשׁ וְתִזְרְעוּן לְרֵיקָנוּן זַרְעֲכוֹן וְיֵיכְלֻנֵּיהּ בַּעֲלֵי דְבָבֵיכוֹן:", "onk_en": "Then I will do the same with you. I will impose terror upon you, [which causes] swelling and fever that consume [<b>darken<\/b>] the eyes and fill the soul with grief. You will plant [your seeds] in vain because your enemies will consume [your crops.]", "pj": "לְחוֹד אֲנָא אַעֲבֵּיד דָא לְכוֹן וְאַגְרֵי עֲלֵיכוֹן מַחַת מוֹתְנָהָא יַת שְׁחִיפוּתָא וְיַת קַדְחוּתָא מְכַלְיָא עַיְינִין וּמְסַייְפָא נְפָשׁ וְתִזְרְעוּן לְרֵיקָנוּ זַרְעֲכוֹן דְלָא יַצְמַח וְכַתַּיָיא יֵיכְלוּן יַתְהוֹן בַּעֲלֵי דְבָבֵיכוֹן", "pj_en": "this also will I do to you: I will draw out against you the smiting pestilence, the flame and the fever, to consume your eyes, and to exhaust life; and ye shall sow your seed in vain, for it shall not spring up, and that which groweth of itself shall your enemies devour.", "tj": "", "tj_en": "", "rashi": "<b>והפקדתי עליכם.<\/b> וְצִוִּיתִי עֲלֵיכֶם:<br><br><b>השחפת.<\/b> חֹלִי שֶׁמְּשַׁחֵף אֶת הַבָּשָׂר, אנפו\"ליש בלעז, דּוֹמֶה לְנָפוּחַ שֶׁהוּקַלָּה נְפִיחָתוֹ וּמַרְאִית פָּנָיו זְעוּפָה:<br><br><b>הקדחת.<\/b> חֹלִי שֶׁמַּקְדִּיחַ אֶת הַגּוּף וּמְחַמְּמוֹ וּמַבְעִירוֹ, כְּמוֹ \"כִּי אֵשׁ קָדְחָה בְאַפִּי\" (דברים ל\"ב):<br><br><b>מכלות עינים ומדיבת נפש.<\/b> הָעֵינַיִם צוֹפוֹת וְכָלוֹת לִרְאוֹת שֶׁיֵּקַל וְיֵרָפֵא, וְסוֹף שֶׁלֹּא יֵרָפֵא, וְיִדְאֲבוּ הַנְּפָשׁוֹת שֶׁל מִשְׁפַּחְתּוֹ בְּמוֹתוֹ; כָּל תַּאֲוָה שֶׁאֵינָהּ בָּאָה וְתוֹחֶלֶת מְמֻשָּׁכָה קְרוּיָה כִלְיוֹן עֵינַיִם:<br><br><b>וזרעתם לריק.<\/b> תִּזְרְעוּ וְלֹא תִצְמַח, וְאִם תִּצְמַח <b>ואכלהו איביכם<\/b>:", "rashi_en": "והפקדתי עליכם means, I will order upon you the following calamities. <br><br>שחפת  CONSUMPTION — A disease which swells the flesh, ampoules in old French; it resembles a thing that has been distended, the distension of which has become reduced — and the appearance of his (the sick man’s) face is thin and woebegone. <br><br>קדחת is a disease which inflames the body, makes it hot and burning (feverish). It is similar in meaning to the verb in, (Deuteronomy 32:22) “For a fire burns (קדחה) in My nostril”.<br><br>מכלות עינים ומדיבת נפש THAT THE EYES PINE AND CAUSE SORROW TO THE SOUL — The eyes look expectantly and pine to see that he (the sick) should be relieved and healed, and in the end it turns out that he is not healed, and the souls of his family grieve when he dies. Any desire that does not come to fulfilment and any hope deferred is termed כליון עינים, “pining of the eyes”.<br><br>וזרעתם לריק AND YE SHALL SOW [YOUR SEED] IN VAIN — ye shall sow your seed but it shall not grow — and if it does grow, ואכלוהו איביכם YOUR ENEMIES  SHALL EAT IT."}, {"ch": 26, "v": 17, "aliyah": 3, "heb": "וְנָתַתִּ֤י פָנַי֙ בָּכֶ֔ם וְנִגַּפְתֶּ֖ם לִפְנֵ֣י אֹיְבֵיכֶ֑ם וְרָד֤וּ בָכֶם֙ שֹֽׂנְאֵיכֶ֔ם וְנַסְתֶּ֖ם וְאֵין־רֹדֵ֥ף אֶתְכֶֽם׃", "onk": "וְאֶתֵּן רוּגְזִי בְּכוֹן וְתִתַּבְּרוּן קֳדָם בַּעֲלֵי דְבָבֵיכוֹן וְיִרְדּוּן בְּכוֹן סַנְאֵכוֹן וְתֵעִירְקוּן וְלֵית דְּרָדִיף יָתְכוֹן:", "onk_en": "I will set my face [<b>anger<\/b>] against you and you will be defeated [<b>smitten<\/b>] before your enemies; your foes will rule over you and you will flee [even] when no one is pursuing you.", "pj": "וְאֶתֵּן פְּנִיוּתָא לְמֶעֱסוֹק בְּכוֹן וְתִיתְבְּרוּן קֳדָם בַּעֲלֵי דְבָבֵיכוֹן וְיִרְדוֹן בְּכוֹן סַנְאֵיכוֹן וּתְעַרְקוּן וְלֵית דְרָדִיף יַתְכוֹן", "pj_en": "And I will appoint a reverse to your affairs, and you shall be broken before your foes, and they who hate you shall rule over you; and you will flee when no one pursueth you.", "tj": "", "tj_en": "", "rashi": "<b>ונתתי פני.<\/b> פְּנַאי שֶׁלִּי — פּוֹנֶה אֲנִי מִכָּל עֲסָקַי לְהָרַע לָכֶם:<br><br><b>ורדו בכם שנאיכם.<\/b> כְּמַשְׁמָעוֹ, יִשְׁלְטוּ בָכֶם: אַגָּדַת תֹּ\"כֹּ מִפָּרָשָׁה זוֹ:<br><br><b>אף אני אעשה זאת.<\/b> אֵינִי מְדַבֵּר אֶלָּא בְּאַף, וְכֵן \"אַף אֲנִי אֵלֵךְ עִמָּכֶם בְּקֶרִי\" (פסוק מ\"א):<br><br><b>והפקדתי עליכם.<\/b> שֶׁיִּהְיוּ הַמַּכּוֹת פּוֹקְדוֹת אֶתְכֶם מִזוֹ לְזוֹ, עַד שֶׁהָרִאשׁוֹנָה פְקוּדָה אֶצְלְכֶם, אָבִיא אַחֶרֶת וְאֶסְמְכֶנָּה לָהּ:<br><br><b>בהלה.<\/b> מַכָּה הַמְבַהֶלֶת אֶת הַבְּרִיּוֹת, וְאֵי זוֹ? זוֹ מַכַּת מוֹתָן:<br><br><b>את השחפת.<\/b> יֵשׁ לְךָ אָדָם שֶׁהוּא חוֹלֶה וּמֻטָּל בַּמִּטָּה אֲבָל בְּשָׂרוֹ שָׁמוּר עָלָיו, תַּ\"לֹ \"שַׁחֶפֶת\", שֶׁהוּא נִשְׁחָף, אוֹ עִתִּים שֶׁהוּא נִשְׁחָף אֲבָל נֹחַ וְאֵינוֹ מַקְדִּיחַ, תַּ\"לֹ \"וְאֶת הַקַּדַּחַת\", מְלַמֵּד שֶׁהוּא מַקְדִּיחַ, אוֹ עִתִּים שֶׁהוּא מַקְדִּיחַ אֲבָל סָבוּר הוּא בְעַצְמוֹ שֶׁיִּחְיֶה, תַּ\"לֹ \"מְכַלּוֹת עֵינַיִם\", אוֹ הוּא אֵינוֹ סָבוּר בְּעַצְמוֹ שֶׁיִּחְיֶה, אֲבָל אֲחֵרִים סְבוּרִים שֶׁיִּחְיֶה, תַּ\"לֹ \"וּמְדִיבֹת נָפֶשׁ\":<br><br><b>וזרעתם לריק זרעכם.<\/b> זוֹרְעָהּ וְאֵינָהּ מַצְמַחַת, וּמֵעַתָּה מָה אוֹיְבֵיכֶם בָּאִים וְאוֹכְלִים? תַּ\"לֹ \"וַאֲכָלֻהוּ אֹיְבֵיכֶם\", הָא כֵיצַד? זוֹרְעָהּ שָׁנָה רִאשׁוֹנָה וְאֵינָהּ מַצְמַחַת, שָׁנָה שְׁנִיָּה מַצְמַחַת, וְאוֹיְבִים בָּאִים וּמוֹצְאִים תְּבוּאָה לִימֵי הַמָּצוֹר, וְשֶׁבִּפְנִים מֵתִים בָּרָעָב, שֶׁלֹּא לִקְּטוּ תְּבוּאָה אֶשְׁתָּקַד; דָּ\"אַ: \"וּזְרַעְתֶּם לָרִיק זַרְעֲכֶם\", כְּנֶגֶד הַבָּנִים וְהַבָּנוֹת הַכָּתוּב מְדַבֵּר, שֶׁאַתָּה עָמֵל בָּהֶם וּמְגַדְּלָן, וְהַחֵטְא בָּא וּמְכַלֶּה אוֹתָם, שֶׁנֶּאֱמַר \"אֲשֶׁר טִפַּחְתִּי וְרִבִּיתִי אֹיְבִי כִלָּם\" (איכה ב'):<br><br><b>ונתתי פני בכם.<\/b> כְּמוֹ שֶׁנֶּאֱמַר בַּטּוֹבָה \"וּפָנִיתִי אֲלֵיכֶם\", כָּךְ נֶאֱמַר בָּרָעָה \"וְנָתַתִּי פָנַי\"; מָשְׁלוּ מָשָׁל, לְמֶלֶךְ שֶׁאָמַר לַעֲבָדָיו, פּוֹנֶה אֲנִי מִכָּל עֲסָקַי וְעוֹסֵק אֲנִי עִמָּכֶם לְרָעָה:<br><br><b>ונגפתם לפני איביכם.<\/b> שֶׁיְּהֵא הַמָּוֶת הוֹרֵג אֶתְכֶם מִבִּפְנִים, וּבַעֲלֵי דְבָבֵיכוֹן מַקִּיפִין אֶתְכֶם מִבַּחוּץ:<br><br><b>ורדו בכם שנאיכם.<\/b> שֶׁאֵינִי מַעֲמִיד שׂוֹנְאִים אֶלָּא מִכֶּם וּבָכֶם, שֶׁבְּשָׁעָה שֶׁאֻמּוֹת הָעוֹלָם עוֹמְדִים עַל יִשְׂרָאֵל, אֵינָם מְבַקְּשִׁים אֶלָּא מַה שֶּׁבַּגָּלוּי, שֶׁנֶאֱמַר \"וְהָיָה אִם זָרַע יִשְׂרָאֵל וְעָלָה מִדְיָן וַעֲמָלֵק וּבְנֵי קֶדֶם וְגוֹ' וַיַּחֲנוּ עֲלֵיהֶם וַיַּשְׁחִיתוּ אֶת יְבוּל הָאָרֶץ\" (שופטים ו'), אֲבָל בְּשָׁעָה שֶׁאֲעֲמִיד עֲלֵיכֶם מִכֶּם וּבָכֶם, הֵם מְחַפְּשִׂים אַחַר הַמַּטְמוֹנִיּוֹת שֶׁלָּכֶם, וְכֵן הוּא אוֹמֵר \"וַאֲשֶׁר אָכְלוּ שְׁאֵר עַמִּי וְעוֹרָם מֵעֲלֵיהֶם הִפְשִׁיטוּ וְגוֹ'\" (מיכה ג'):<br><br><b>ונסתם.<\/b> מִפְּנֵי אֵימָה:<br><br><b>ואין רדף אתכם.<\/b> מִבְּלִי כֹחַ (ספרא):", "rashi_en": "ונתתי פני AND I WILL SET  פני [AGAINST YOU] — i. e. פנאי שלי, My leisure, — I will turn away from all My other affairs in order to do you evil (cf. Rashi on Leviticus 17:20).<br><br>ורדו בכם שנאיכם — These words mean exactly what they imply: THEY THAT HATE YOU SHALL RULE OVER YOU. — The Agadic explanation of the Torat Cohanim (Sifra, Bechukotai, Chapter 4 1-5) on this section is as follows:<br><br>אף אני אעשה זאת — I speak to you only with the expression אף. Similarly it states, (v. 41) “So, too, (אף) I will walk contrary unto them”. <br><br>והפקדתי עליכם I WILL ORDER UPON YOU denotes that the calamities will come upon you from one to another — while the first will still be on visit to you (will afflict you) I will bring another and add it to that.<br><br>בהלה is a plague  that causes terror upon people. And what is that? It is an epidemic plague of pestilence.<br><br>את השחפת THE CONSUMPTION — You may have a person that is sick and even confined to his bed, but his flesh is in a well-preserved state; therefore Scripture states, “I will visit you with שחפת” — that he will waste away. Or there are times that he may be wasting away but is calm and without fever, Scripture therefore states, “I will visit you with… קדחת” — that he will be in a fever. Or there are times that he may be in a fever but still cherishes the belief that he will recover (and therefore is easy in mind), Scripture therefore states, “I will visit you… with fever that shall make the eyes pine”. Or there may be the last stage when he cherishes no belief that he will recover, but others (his relatives) cherish the belief that he will recover, Scripture therefore states, “I will visit you with… fever… that shall cause sorrow of soul (utter despair).<br><br>וזרעתם לריק זרעכם — One shall sow it (the soil) but it shall not grow grain. Well, then, what does it mean when it states that your enemies will come and eat?. How is this possible? But the explanation is: One shall sow it (the soil) the first year and it will not yield; the next year, however, it will yield, and then the enemies will come and will find grain for the time of siege, whilst those within the beleaguered city will die of famine because they will have gathered no grain the year before. Another explanation of וזרעתם לריק זרעכם is: Scripture  is speaking in reference to your sons and daughters — you will rear them only after much toil but sin, the enemy, will come and destroy them, as it is said, (i. e. a similar thought is expressed in the text) (Lamentations 2:22) “those that I have swaddled and brought up mine enemy hath consumed”.<br><br>ונתתי פני בכם — Even as it is stated in the case of the promise of good (v. 9), “I will turn (ופניתי) unto you” so is it stated also with regard to the threat of evil “I will set My face (פני) against you”. They (the Sages) illustrated this by a parable: it may be compared to the case of a king who said to his subjects, “I will turn away from all My other affairs and will devote myself to you alone — for evil”.<br><br>ונגפתם לפני איביכם — (This may signify: and ye shall be plagued in the presence of your enemies) — it means that death (pestilence — נגף) will kill you within the city whilst your enemies are besieging you outside (cf. the first Agadic comment on ‎וזרעתם לריק ).<br><br>‎ ורדו בכם שנאיכם — ‎(בכם is taken to signify: those who are amongst you) — this means that I will raise up haters of you only out of your own people and in your own midst. Internal enemies (שונאים) are a greater curse than external enemies (אויבים) for when the nations of the world rise against Israel they seek only what lies in the open, as it is said, (Judges 6:3, 4) “And so it was, when Israel had sown, that the Midianites came up, and the Amalekites, and the children of the east,… and they encamped against them, and destroyed the increase of the land”; but when I raise up against you those of your own people and in your own midst they search also after your hidden treasures. And thus it states, (Micah 3:1—3) “[Hear, O heads of Jacob, and ye princes of the house of Israel…] who also eat the flesh of my people and flay their skin from off them etc.” <br><br>ונסתם AND YE SHALL RUN AWAY — from sheer panic,<br><br>ואין רדף אתכם WHEN NONE PURSUETH YOU, since there is no strength in them to do so."}, {"ch": 26, "v": 18, "aliyah": 3, "heb": "וְאִ֨ם־עַד־אֵ֔לֶּה לֹ֥א תִשְׁמְע֖וּ לִ֑י וְיָסַפְתִּי֙ לְיַסְּרָ֣ה אֶתְכֶ֔ם שֶׁ֖בַע עַל־חַטֹּאתֵיכֶֽם׃", "onk": "וְאִם עַד אִלֵּין לָא תְקַבְּלוּן לְמֵימְרִי וְאוֹסֵף לְמִרְדֵּי יָתכוֹן שְׁבַע עַל חוֹבֵיכוֹן:", "onk_en": "If after these [catastrophes] you still do not listen to Me [<b>accept My Word<\/b>], then I will increase your punishment sevenfold, as your sins.", "pj": "וְאִין בָּתַר אִלֵין מַרְדְוָותָא לָא תִצְבּוּן לְמִשְׁמַע לְאוּלְפַן אוֹרַיְיתִי וְאוֹסֵף לְמִירְדֵי יַתְכוֹן שְׁבַע מָאחָאתָא עַל שְׁבַע עֲבֵירָן דִי חַטִיתוּן קֳדָמָי", "pj_en": "And if after these chastisements ye be not willing to obey the doctrines of My law, I will add to punish you with seven plagues, for the seven transgressions with which ye have sinned before Me.", "tj": "", "tj_en": "", "rashi": "<b>ואם עד אלה.<\/b> וְאִם בְּעוֹד אֵלֶּה <b>לא תשמעו<\/b>:<br><br><b>ויספתי.<\/b> עוֹד יִסּוּרִין אַחֵרִים:<br><br><b>שבע על חטאתיכם.<\/b> שֶׁבַע פֻּרְעָנֻיּוֹת עַל שֶׁבַע עֲבֵרוֹת הָאֲמוּרוֹת לְמַעְלָה:", "rashi_en": "ואם עד אלה means AND IF, WHILE THESE ARE YET with you,לא תשמעו YOU WILL NOT HEARKEN,<br><br>ויספתי — This together with ליסרה means, THEN I WILL ADD still other afflictions,<br><br>שבע על חטאתיכם SEVEN punishments FOR THE seven SINS which were mentioned above (Sifra, Bechukotai, Chapter 5 1)."}, {"ch": 26, "v": 19, "aliyah": 3, "heb": "וְשָׁבַרְתִּ֖י אֶת־גְּא֣וֹן עֻזְּכֶ֑ם וְנָתַתִּ֤י אֶת־שְׁמֵיכֶם֙ כַּבַּרְזֶ֔ל וְאֶֽת־אַרְצְכֶ֖ם כַּנְּחֻשָֽׁה׃", "onk": "וְאֶתְבַּר יָת יְקַר תָּקְפְּכוֹן וְאֶתֵּן יָת שְׁמַיָּא דִי עִלָּוֵיכוֹן תַּקִּיפִין כְּפַרְזְלָא מִלַּאֲחָתָא מִטְרָא וְאַרְעָא דִתְחוֹתֵיכוֹן חֲסִינָא כִנְחָשָׁא מִלְּמֶעְבַּד פֵּירִין:", "onk_en": "I will break the pride [<b>glory<\/b>] of your power. I will make your [<b>the<\/b>] heavens [<b>which are above you<\/b>] like [<b>as strong as<\/b>] iron [<b>to bring no rain down<\/b>] and your [<b>the<\/b>] land [<b>which is beneath you<\/b>] like [<b>as powerful as<\/b>] copper [<b>producing no fruit<\/b>].", "pj": "וְאִיתְבַּר יַת אִיקַר תְּקוֹף מִקְדָשֵׁיכוֹן וְאֶתֵּן יַת שְׁמַיָא דְעִילַוֵיכוֹן בְּרִידַן הֵי כְפַרְזְלָא דְלָא מְזִיעַ מִן דְלָא לְמַחְתָא לְכוֹן טַלִין וּמִיטְרִין וְאַרְעָא דִתְחוֹתֵיכוֹן הֵי כִנְחָשָׁא דִמְזִיעַ לְמוֹבְדָא פֵּירָהָא", "pj_en": "And I will break down the glory of the strength of your sanctuary, and will make the heavens above you obdurate as iron, to yield no moisture, nor send you dew or rain, and the ground beneath you to be like brass to put forth (only) to destroy its fruit.", "tj": "", "tj_en": "", "rashi": "<b>ושברתי את גאון עזכם.<\/b> זֶה בֵּית הַמִּקְדָּשׁ, וְכֵן הוּא אוֹמֵר \"הִנְנִי מְחַלֵּל אֶת מִקְדָּשִׁי גְּאוֹן עֻזְּכֶם\" (יחזקאל כ\"ד):<br><br><b>ונתתי את שמיכם כברזל ואת ארצכם כנחשה.<\/b> זוֹ קָשָׁה מִשֶּׁל מֹשֶׁה, שֶׁשָּׁם הוּא אוֹמֵר \"וְהָיוּ שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ נְחֹשֶׁת וְגו'\" (דברים כ\"ח), שֶׁיִּהְיוּ הַשָּׁמַיִם מַזִּיעִין כְּדֶרֶךְ שֶׁהַנְּחֹשֶׁת מַזִּיעָה, וְהָאָרֶץ אֵינָהּ מַזִּיעָה כְּדֶרֶךְ שֶׁאֵין הַבַּרְזֶל מַזִּיעַ, וְהִיא מְשַׁמֶּרֶת פֵּרוֹתֶיהָ, אֲבָל כָּאן הַשָּׁמַיִם לֹא יִהְיוּ מַזִּיעִין כְּדֶרֶךְ שֶׁאֵין הַבַּרְזֶל מַזִּיעַ, וִיהֵא חֹרֶב בָּעוֹלָם, וְהָאָרֶץ תְּהֵא מַזִּיעָה כְּדֶרֶךְ שֶׁהַנְּחֹשֶׁת מַזִּיעָה, וְהִיא מְאַבֶּדֶת פֵּרוֹתֶיהָ (ספרא):", "rashi_en": "ושברתי את גאון עזכם AND I WILL BREAK THE EXCELLENCY OF YOUR STRENGTH — This is a reference to the Temple; for thus does it state, (Ezekiel 24:21) “Behold I will profane my sanctuary, the excellency of your strength”.<br><br>ונתתי את שמיכם כברזל ואת ארצכם כנחשה AND I WILL MAKE YOUR HEAVEN AS IRON AND YOUR EARTH AS COPPER — This threat is even severer than that of Moses, because there it says, (Deuteronomy 28:23) “And thy heaven that is over thy head shall be copper, [and the earth that is under thee shall be iron]” which implies that the heaven will at least exude moisture (will give some humidity) just as the copper exudes moisture, whilst the earth will not exude just as iron does not exude, and so it will keep its fruit in good condition, since it will not be too humid. Here, however, Scripture threatens that the heaven will not exude moisture, just as iron does not exude, and there will therefore be draught in the world, whilst the earth will exude (be too humid) just as copper sweats, and it will consequently make its fruits perish (Sifra, Bechukotai, Chapter 5 3)."}, {"ch": 26, "v": 20, "aliyah": 3, "heb": "וְתַ֥ם לָרִ֖יק כֹּחֲכֶ֑ם וְלֹֽא־תִתֵּ֤ן אַרְצְכֶם֙ אֶת־יְבוּלָ֔הּ וְעֵ֣ץ הָאָ֔רֶץ לֹ֥א יִתֵּ֖ן פִּרְיֽוֹ׃", "onk": "וִיסוּפוּן לְרֵיקָנוּ חֵילֵיכוֹן וְלָא תִתֵּן אַרְעֲכוֹן יָת עֲלַלְתַּהּ וְאִילַן אַרְעָא לָא יִתֵּן אִבֵּיהּ:", "onk_en": "Your strength will be exhausted in vain. Your land will not yield its produce and the tree[s] of the land will not give forth its produce.", "pj": "וִיסוּף לְרֵיקָנוּ חֵילֵיכוֹן וְלָא תִתֵּן אַרְעֲכוֹן יַת מַה דְאַתּוּן מַעֲלִין לְגַוָוהּ וְאִילַן דְאַנְפֵּי בָרָא יְקַלַח פֵּירוֹי", "pj_en": "And your strength shall be consumed in vain, for your land shall not yield what you bestow upon it, and the tree upon the face of the field shall drop its fruit.", "tj": "", "tj_en": "", "rashi": "<b>ותם לריק כחכם.<\/b> הֲרֵי אָדָם שֶׁלֹּא עָמַל, שֶׁלֹּא חָרַשׁ, שֶׁלֹּא זָרַע, שֶׁלֹּא נִכֵּשׁ, שֶׁלֹּא כִּסֵּחַ, שֶׁלֹּא עָדַר, וּבִשְׁעַת הַקָּצִיר בָּא שִׁדָּפוֹן וּמַלְקֶה אוֹתוֹ, אֵין בְּכָךְ כְּלוּם, אֲבָל אָדָם שֶׁעָמַל וְחָרַשׁ וְזָרַע וְנִכֵּשׁ וְכִסֵּחַ וְעָדַר וּבָא שִׁדָּפוֹן וּמַלְקֶה אוֹתוֹ, הֲרֵי שִׁנָּיו שֶׁל זֶה קֵהוֹת:<br><br><b>ולא תתן ארצכם את יבולה.<\/b> אַף מַה שֶּׁאַתָּה מוֹבִיל לָהּ בִּשְׁעַת הַזֶּרַע (ספרא):<br><br><b>ועץ הארץ.<\/b> אֲפִלּוּ מִן הָאָרֶץ יְהֵא לָקוּי, שֶׁלֹּא יַחֲנִיט פֵּרוֹתָיו בִּשְׁעַת הַחֲנָטָה (שם):<br><br><b>לא יתן.<\/b> מְשַׁמֵּשׁ לְמַעְלָה וּלְמַטָּה, אָעֵץ וְאַפְּרִי:<br><br><b>לא יתן פריו.<\/b> כְּשֶׁהוּא מַפְרֶה מַשִּׁיר פֵּרוֹתָיו, הֲרֵי שְׁתֵּי קְלָלוֹת, וְיֵשׁ כָּאן שֶׁבַע פֻּרְעָנֻיּוֹת (ספרא):", "rashi_en": "ותם לריק כחכם AND YOUR STRENGTH SHALL BE SPENT IN VAIN — Behold, if a man does not toil in his field — neither tills, nor sows, nor weeds it, nor clears away the thorns, nor hoes it, and then at harvest time blight comes and strikes it (the field, i. e. destroys that which sprung up of itself), surely it does not matter much (he does not take it to heart). But if a man has toiled — he has ploughed, sown, weeded, cleared away the thorns and hoed it, and then blight comes and strikes it, surely then the teeth of that man become blunt! (a figurative expression for becoming speechless, terror-stricken) (Sifra, Bechukotai, Chapter 5 4).<br><br>ולא תתן ארצכם את יבולה — This means, the earth shall not yield even as much as you brought to it at sowing-time (יבולה as passive participle with suffix of יבל “to bring”, may denote: that which is brought to it) (Sifra, Bechukotai, Chapter 5 4).<br><br>ועץ הארץ AND THE TREE OF THE GROUND [SHALL NOT YIELD] — This implies that even from the very earth a curse will rest upon it — that it will not bring its fruits to development at the time when they should develop (Sifra, Bechukotai, Chapter 5 4).<br><br>לא יתן serves as the verb with what precedes and with what follows — with “tree” and with “fruit”. Thus we obtain a second sense —<br><br>לא יתן פריו IT WILL NOT GIVE ITS FRUIT — when it does produce fruit, it will cast its fruits (Sifra, Bechukotai, Chapter 5 4). This gives two curses, and so you have here seven punishments in all."}, {"ch": 26, "v": 21, "aliyah": 3, "heb": "וְאִם־תֵּֽלְכ֤וּ עִמִּי֙ קֶ֔רִי וְלֹ֥א תֹאב֖וּ לִשְׁמֹ֣עַֽ לִ֑י וְיָסַפְתִּ֤י עֲלֵיכֶם֙ מַכָּ֔ה שֶׁ֖בַע כְּחַטֹּאתֵיכֶֽם׃", "onk": "וְאִם תְּהָכוּן קֳדָמַי בְּקַשְׁיוּ וְלָא תֵיבוּן לְקַבָּלָא לְמֵימְרִי וְאוֹסֵף לֶאֱתָאָה עֲלֵיכוֹן מָחָא שְׁבַע כְּחוֹבֵיכוֹן:", "onk_en": "If you walk contrary to [<b>before<\/b>] Me and have no desire to listen to Me [<b>accept My Word<\/b>], I will increase [<b>to bring<\/b>] the blows upon you sevenfold, as your sins.", "pj": "וְאִין תַּהֲכוּן עִמִי בְּעַרְאַי וְלָא תִצְבּוּן לְמִשְׁמַע לְאוּלְפַן אוֹרַיְיתִי וְאוֹסִיף לְאַיְיתָאָה עֲלֵיכוֹן שִׁבְעָתָא מְחָא עַל שְׁבַע עֲבֵירָן דִי חֲטֵיתוּן קֳדָמָי", "pj_en": "And if you still walk perversely with Me, and will not hearken to the doctrine of My law, I will add to bring upon you (yet) seven plagues, for the seven transgressions with which ye have sinned before Me;", "tj": "", "tj_en": "", "rashi": "<b>ואם תלכו עמי קרי.<\/b> רַבּוֹתֵינוּ אָמְרוּ עֲרַאי, בְּמִקְרֶה, שֶׁאֵינוֹ אֶלָּא לִפְרָקִים, כֵּן תֵּלְכוּ עֲרַאי בְּמִצְווֹת; וּמְנַחֵם פֵּרֵשׁ לְשׁוֹן מְנִיעָה, וְכֵן \"הֹקַר רַגְלְךָ\" (משלי כ\"ה), וְכֵן \"יְקַר רוּחַ\" (שם י\"ז), וְקָרוֹב לָשׁוֹן זֶה לְתַרְגּוּמוֹ שֶׁל אֻנְקְלוֹס, לְשׁוֹן קֹשִׁי, שֶׁמַּקְשִׁין לִבָּם לִמָּנַע מֵהִתְקָרֵב אֵלַי:<br><br><b>שבע כחטאתיכם.<\/b> שֶׁבַע פֻּרְעָנֻיּוֹת אֲחֵרִים, בְּמִסְפַּר שֶׁבַע כְּחַטֹּאתֵיכֶם (ספרא):", "rashi_en": "ואם תלכו עמי קרי — Our Rabbis said (Sifra, Bechukotai, Chapter 5 5): this word signifies “irregularly”, “by chance” (מקרה), which is a thing that happens only occasionally; thus this means: if you will follow the commandments irregularly. Menachem explains it as an expression for “refraining”. Similar is, (Proverbs 25:17) “Refrain (הוקר) thy foot [from thy neighbour’s house]”; (Proverbs 17:27) “of a refraining (יקר) spirit”. This meaning approximates to the translation given by Onkelos which is a term denoting “stubbornness” (קושי) — that they harden their hearts so as to refrain from coming near unto Me. <br><br>שבע כחטאתיכם SEVEN ACCORDING TO YOUR SINS — i. e. seven other punishments. These words mean: I will bring upon you more plagues (ויספתי עליכם מכה) in number, seven, corresponding to your sins (Sifra, Bechukotai, Chapter 5 5)."}, {"ch": 26, "v": 22, "aliyah": 3, "heb": "וְהִשְׁלַחְתִּ֨י בָכֶ֜ם אֶת־חַיַּ֤ת הַשָּׂדֶה֙ וְשִׁכְּלָ֣ה אֶתְכֶ֔ם וְהִכְרִ֙יתָה֙ אֶת־בְּהֶמְתְּכֶ֔ם וְהִמְעִ֖יטָה אֶתְכֶ֑ם וְנָשַׁ֖מּוּ דַּרְכֵיכֶֽם׃", "onk": "וֶאֱגָרֵי בְכוֹן יָת חֵוַת בָּרָא וּתְתַכֵּל יָתְכוֹן וּתְשֵׁיצֵי יָת בְּעִירְכוֹן וְתַזְעֵר יָתְכוֹן וִיצַדְיָן אוֹרְחָתְכוֹן:", "onk_en": "I will send [<b>incite<\/b>] among you wild animals of the field and they will make you bereft of children, destroy your cattle, reduce your [population] and make your roads into wasteland.", "pj": "וְאַגְרֵי בְּכוֹן רְשׁוּת חֵיוַת בָּרָא וְתִתְכַּל יַתְכוֹן וּתְשֵׁיצֵי יַת בְּעִירֵיכוֹן מִבָּרָא וְתַזְעֵיר יַתְכוֹן מִלְגֵיו וְיִצְדַיַן אוֹרְחַתְכוֹן", "pj_en": "and I will send against you the strength of the wild beast, to make you childless, and to destroy your cattle without, and to diminish you within, and your highways shall be desolate.", "tj": "", "tj_en": "", "rashi": "<b>והשלחתי.<\/b> לְשׁוֹן גֵּרוּי:<br><br><b>ושכלה אתכם.<\/b> אֵין לִי אֶלָּא חַיָּה מְשַׁכֶּלֶת שֶׁדַּרְכָּהּ בְּכָךְ, בְּהֵמָה שֶׁאֵין דַּרְכָּהּ בְּכָךְ מִנַּיִן? תַּ\"לֹ \"וְשֶׁן בְּהֵמֹת אֲשַׁלַּח בָּם\" (דברים ל\"ב), הֲרֵי שְׁתַּיִם. וּמִנַּיִן שֶׁתְּהֵא מְמִיתָה בִנְשִׁיכָתָהּ? תַּ\"לֹ \"עִם חֲמַת זֹחֲלֵי עָפָר\" (שם), מָה אֵלּוּ נוֹשְׁכִין וּמְמִיתִין אַף אֵלּוּ נוֹשְׁכִין וּמְמִיתִין, כְּבָר הָיוּ שָׁנִים בְּאֶרֶץ יִשְׂרָאֵל חֲמוֹר נוֹשֵׁךְ וּמֵמִית, עָרוֹד נוֹשֵׁךְ וּמֵמִית:<br><br><b>ושכלה אתכם.<\/b> אֵלּוּ הַקְּטַנִּים:<br><br><b>והכריתה את בהמתכם.<\/b> מִבַּחוּץ:<br><br><b>והמעיטה אתכם.<\/b> מִבִּפְנִים:<br><br><b>ונשמו דרכיכם.<\/b> שְׁבִילִים גְּדוֹלִים וּשְׁבִילִים קְטַנִּים; הֲרֵי שֶׁבַע פֻּרְעָנֻיּוֹת: שֵׁן בְּהֵמָה, וְשֵׁן חַיָּה, חֲמַת זוֹחֲלֵי עָפָר, וְשִׁכְּלָה, וְהִכְרִיתָה, וְהִמְעִיטָה, וְנָשַׁמּוּ:", "rashi_en": "והשלחתי is an expression for “inciting”.<br><br>ושכלה אתכם [I WILL INCITE THE WILD ANIMALS AGAINST YOU] WHICH WILL ROB YOU OF YOUR CHILDREN — I find here mention only of wild animals robbing them of their children, i. e. of animals whose nature consists in this (to attack human beings); whence do we know that cattle whose nature is not thus will also rob them of their children? Because it states in a similar series of threats (Deuteronomy 32:24) “I will also incite (אשלח) the teeth of cattle (בהמות) against them”. — Thus you have two of the seven calamities mentioned above (the attacks of wild beasts and of cattle). And whence do we know that it (the cattle) will kill by its bite? Because Scripture states immediately afterwards, “with the poison of serpents of the dust\". How is it in the case of these (the serpents)? They bite and kill by their bite! So, too, will those (the cattle) bite and thus kill. There were indeed such years in the Land of Israel when both a tame ass bit someone and caused his death and the wild ass bit and caused death (Sifra, Bechukotai, Chapter 5 6).<br><br>ושכלה אתכם AND THEY WILL ROB YOU OF YOUR CHILDREN — This means your little children.<br><br>והכריתה את בהמתכם AND THEY WILL DESTROY YOUR CATTLE — those being outside in the fields (and so unable to escape the attacks of wild beasts),<br><br>והמעיטה אתכם AND REDUCE YOUR NUMBERS — you being inside in the houses (reduce your numbers and not destroy entirely, for some of you will be able to escape).<br><br>ונשמו דרכיכם AND YOUR ROADS SHALL BE DESOLATE — both the highways and the by-paths (דרכיכם plural!) (Sifra, Bechukotai, Chapter 5 7). — Here again you have seven punishments: 1) the teeth of domestic animals, 2) the teeth of wild animals, 3) the venom of the crawling things of the dust, 4) and they will bereave , 5) utterly destroy, 6) and diminish, 7) and [your roads] will become desolate. "}, {"ch": 26, "v": 23, "aliyah": 3, "heb": "וְאִ֨ם־בְּאֵ֔לֶּה לֹ֥א תִוָּסְר֖וּ לִ֑י וַהֲלַכְתֶּ֥ם עִמִּ֖י קֶֽרִי׃", "onk": "וְאִם בְּאִלֵּין לָא תִתְרְדוּן לְמֵימְרִי וּתְהָכוּן קֳדָמַי בְּקַשְׁיוּ:", "onk_en": "If after these [catastrophes] you have not been disciplined [to listen] to Me [<b>My Word<\/b>], and walk contrary to [<b>before<\/b>] Me,", "pj": "וְאִין בְּאִילֵין מַרְדְוָותָא לָא תִתְרְדוּן קֳדָמַי וְתַהֲכוּן קֳדָמַי בְּעַרְאֵי", "pj_en": "And if by these chastisements ye will not be corrected before Me, but will walk before Me perversely,", "tj": "", "tj_en": "", "rashi": "<b>לא תוסרו לי.<\/b> לָשׁוּב אֵלַי:", "rashi_en": "‎‏ לא תוסרו לי‏AND IF YOU WILL NOT BE CHASTISED — so that you should return unto Me."}, {"ch": 26, "v": 24, "aliyah": 3, "heb": "וְהָלַכְתִּ֧י אַף־אֲנִ֛י עִמָּכֶ֖ם בְּקֶ֑רִי וְהִכֵּיתִ֤י אֶתְכֶם֙ גַּם־אָ֔נִי שֶׁ֖בַע עַל־חַטֹּאתֵיכֶֽם׃", "onk": "וְאֵהַךְ אַף אֲנָא עִמְּכוֹן בְּקַשְׁיוּ וְאַלְקֵי יָתְכוֹן אַף אֲנָא שְׁבַע עַל חוֹבֵיכוֹן:", "onk_en": "[Then] I, too, will walk contrary to you; and I shall also smite you seven fold, for your sins.", "pj": "וְאִידַבֵּר אוּף אֲנָא יַתְכוֹן בְּעַרְאַי בְּעַלְמָא וְאֶמְחֵי יַתְכוֹן לְחוֹד אֲנָא שְׁבַע מָחָן עַל שְׁבַע עֲבֵירָן דִי חֲטִיתוּן קֳדָמָי", "pj_en": "I will Myself also remember you adversely in the world, and will destroy you, even I, with seven plagues, for seven transgressions with which ye have sinned before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 25, "aliyah": 3, "heb": "וְהֵבֵאתִ֨י עֲלֵיכֶ֜ם חֶ֗רֶב נֹקֶ֙מֶת֙ נְקַם־בְּרִ֔ית וְנֶאֱסַפְתֶּ֖ם אֶל־עָרֵיכֶ֑ם וְשִׁלַּ֤חְתִּי דֶ֙בֶר֙ בְּת֣וֹכְכֶ֔ם וְנִתַּתֶּ֖ם בְּיַד־אוֹיֵֽב׃", "onk": "וְאַיְתִי עֲלֵיכוֹן דְּקָטְלִין בְּחַרְבָּא וְיִתְפָּרְעוּן מִנְּכוֹן פֻּרְעֲנוּתָא עַל דַּעֲבַרְתּוּן עַל פִּתְגָּמֵי אוֹרַיְתָא וְתִתְכַּנְּשׁוּן לְקִרְוֵיכוֹן וֶאֱגָרֵי מוֹתָנָא בֵּינֵיכוֹן וְתִתְמַסְּרוּן בִּידָא דְסָנְאָה:", "onk_en": "I will bring [<b>people who kill with a sword<\/b>] an avenging sword upon you avenging the covenant [<b>and they will avenge from you a vengeance for transgressing the words of the Torah<\/b>] You will be huddled [in your cities]. I will send [<b>incite<\/b>] pestilence among you and you will be given into the hand of the enemy.", "pj": "וְאַיְיתֵי עֲלֵיכוֹן עָם שְׁלוּפֵי חֶרֶב לְמִתְפְּרַע מִנְכוֹן עַל דִבְטַלְתּוּן יַת קֳיָימַי וְתִתְכַּנְשׁוּן מִן צְיָירָא לְקוּרְיֵיכוֹן וְאִיגְרֵי מוֹתָנָא בֵּינֵיכוֹן וְתִתְמַסְרוּן כַּד מִיתִין בְּיַד סַנְאֵיכוֹן", "pj_en": "And I will bring against you a people unsheathing the sword to take vengenance upon you, for that you will have abolished My covenant; and when you are gathered together from the wilderness into your cities, I will send the pestilence among you, or deliver you to die by the hand of your adversaries.", "tj": "", "tj_en": "", "rashi": "<b>נקם ברית.<\/b> יֵשׁ נָקָם שֶׁאֵינוֹ בַּבְּרִית, כְּדֶרֶךְ שְׁאָר נְקָמוֹת, וְזֶהוּ סִמּוּי עֵינָיו שֶׁל צִדְקִיָּהוּ (ספרא). דָּ\"אַ: <b>נקם ברית<\/b> נִקְמַת בְּרִיתִי אֲשֶׁר עֲבַרְתֶּם. כָּל הֲבָאַת חֶרֶב שֶׁבַּמִּקְרָא הִיא מִלְחֶמֶת חֲיָלוֹת אוֹיְבִים:<br><br><b>ונאספתם.<\/b> מִן הַחוּץ אֶל תּוֹךְ הֶעָרִים מִפְּנֵי הַמָּצוֹר (שם):<br><br><b>ושלחתי דבר בתוככם.<\/b> עַ\"יְ הַדֶּבֶר <b>ונתתם ביד<\/b> הָאוֹיְבִים הַצָּרִים עֲלֵיכֶם, לְפִי שֶׁאֵין מְלִינִים אֶת הַמֵּת בִּירוּשָׁלַיִם, וּכְשֶׁהֵם מוֹצִיאִים אֶת הַמֵּת לְקָבְרוֹ נִתָּנִין בְּיַד אוֹיֵב (שם):", "rashi_en": "נקם ברית [AND I WILL BRING UPON YOU A SWORD AVENGING] THE VENGEANCE OF THE COVENANT — Scripture speaks of “the vengeance of the covenant” because there is vengeance which is not mentioned in “The Covenant” (i. e. in this chapter of Scripture) being in the manner of other acts of vengeance (i. e. like the barbarous acts of revenge that are customary among other peoples, but which are not threatened in the Torah), and such a one was the blinding of the eyes of king Zedekiah (Sifra, Bechukotai, Chapter 6 1; cf. 2 Kings 25:7). Another explanation of נקם ברית  is that it means vengeance for My covenant which you have transgressed. Wherever “bringing of the sword” is mentioned in Scripture it signifies a war waged by the enemies’ armies.<br><br>ונאספתם AND YE SHALL GATHER YOURSELVES from outside (from the open country) WITHIN YOUR CITIES on account of the state of siege (Sifra, Bechukotai, Chapter 6 1).<br><br>ושלחתי דבר בתוככם AND I WILL SEND THE PESTILENCE AMONG YOU, and through the pestilence it will happen, ונתתם ביד THAT YOU WILL BE GIVEN INTO THE HAND of the enemies who besiege you. This is because no corpse was permitted to remain in Jerusalem over night, and therefore when they would carry the corpse out of the city to bury it they would be given (they would fall) into the hands of their enemies (Sifra, Bechukotai, Chapter 6 1)."}, {"ch": 26, "v": 26, "aliyah": 3, "heb": "בְּשִׁבְרִ֣י לָכֶם֮ מַטֵּה־לֶ֒חֶם֒ וְ֠אָפ֠וּ עֶ֣שֶׂר נָשִׁ֤ים לַחְמְכֶם֙ בְּתַנּ֣וּר אֶחָ֔ד וְהֵשִׁ֥יבוּ לַחְמְכֶ֖ם בַּמִּשְׁקָ֑ל וַאֲכַלְתֶּ֖ם וְלֹ֥א תִשְׂבָּֽעוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בִּדְאִתְּבַר לְכוֹן סָעִיד מֵיכְלָא וְיָפְיָן עֲסַר נְשִׁין לַחְמְכוֹן בְּתַנּוּרָא חַד וִיתִיבוּן לַחְמְכוֹן בְּמַתְקְלָא וְתוֹכְלוּן וְלָא תִשְׂבְּעוּן:", "onk_en": "When I break the staff of your bread [<b>food<\/b>], ten women will bake your bread in one oven and they will return your bread by weight. You will eat but you will not be satiated.", "pj": "כַּד אֶתְבּוֹר לְכוֹן חוֹטָר כָּל סַעֲדֵי מְזוֹנָא וְיֵיאַפְיַין עֲשַר נְשִׁין לַחְמֵיכוֹן בְּתַנוּרָא חַד מִדְהוּא זְעֵיר וּמְדַדְיָן וּמְפַלְגָן לְכוֹן כַּד מִינְפַל בְּמַתְקָלָא וְתֵיכְלוּן וְלָא תִשְבְּעוּן", "pj_en": "And when I shall have broken for you the staff of all the subsistence of food, then ten women may bake your bread in one oven on account of its scarcity, and measure and divide it to you diminished in weight, and you will eat and not be satisfied.", "tj": "", "tj_en": "", "rashi": "<b>מטה לחם.<\/b> לְשׁוֹן מִשְׁעָן, כְּמוֹ מַטֵּה עֹז (ירמיהו מ\"ח):<br><br><b>בשברי לכם מטה לחם.<\/b> אֶשְׁבֹּר לָכֶם כָּל מִסְעַד אֹכֶל, וְהֵם חִצֵּי רָעָב (יחזקאל ה'):<br><br><b>ואפו עשר נשים לחמכם בתנור אחד.<\/b> מֵחֹסֶר עֵצִים (ספרא):<br><br><b>והשיבו לחמכם במשקל.<\/b> שֶׁתְּהֵא הַתְּבוּאָה נִרְקֶבֶת וְנַעֲשֵׂית פַּת נְפֹלֶת, וּמִשְׁתַּבֶּרֶת בַּתַּנּוּר, וְהֵן יוֹשְׁבוֹת וְשׁוֹקְלוֹת אֶת הַשְּׁבָרִים לְחַלְּקָם בֵּינֵיהֶם (שם):<br><br><b>ואכלתם ולא תשבעו.<\/b> זֶהוּ מְאֵרָה בְּתוֹךְ הַמֵּעַיִם בַּלֶּחֶם, הֲרֵי שֶׁבַע פֻּרְעָנֻיּוֹת: חֶרֶב, מָצוֹר, דֶּבֶר, שֶׁבֶר מַטֵּה לֶחֶם, חֹסֶר עֵצִים, פַּת נְפֹלֶת, מְאֵרָה בַמֵּעַיִם; וְנִתַּתֶּם אֵינָהּ מִן הַמִּנְיָן, הִיא הַחֶרֶב:", "rashi_en": "מטה לחם THE STAFF OF YOUR BREAD:  מַטֵּה — This expression denotes [a source of] “support”, similar to “staff (מַטֵּה) of strength” (Jeremiah 48:17). <br><br>בשברי לכם מטה לחם WHEN I  BREAK THE STAFF OF YOUR BREAD — This implies: “I will break for you every support of food”. These are the “arrows of famine” alluded to by Ezekiel (5:16), for he continues with exactly the same words: “and I will break your staff of bread” (cf. Sifra, Bechukotai, Chapter 6 2).<br><br>בתנור אחד [TEN WOMEN SHALL BREAK YOUR BREAD] IN ONE OVEN — on account of scarcity of wood (fuel) (Sifra, Bechukotai, Chapter 6 2).<br><br>והשיבו לחמכם במשקל AND THEY SHALL DELIVER YOUR OWN BREAD AGAIN BY WEIGHT, because the grain will rot and the bread will become פת נפולת (crumbly bread) and break into pieces in the oven, so that they (the women) will deliberately weigh the pieces in order to divide them between themselves (Sifra, Bechukotai, Chapter 6 2).<br><br>ואכלתם ולא תשבעו AND YE SHALL EAT AND NOT BE SATISFIED — This is a special curse that will take effect on the bread already in their stomach (Sifra, Bechukotai, Chapter 6 2; cf. Rashi on v. 5). Thus you have seven punishments (alluded to in v. 24): (1) the attacking armies, (2) the siege, (3) the plague, (4) the destruction of food supply, (5) a lack of wood, (6) crumbly bread and (7) a curse in the intestines. "}, {"ch": 26, "v": 27, "aliyah": 3, "heb": "וְאִ֨ם־בְּזֹ֔את לֹ֥א תִשְׁמְע֖וּ לִ֑י וַהֲלַכְתֶּ֥ם עִמִּ֖י בְּקֶֽרִי׃", "onk": "וְאִם בְּדָא לָא תְקַבְּלוּן לְמֵימְרִי וּתְהָכוּן קֳדָמַי בְּקַשְׁיוּ:", "onk_en": "If [in spite] of this you [still] will not listen to Me [<b>accept My Word<\/b>], and you will walk contrary to [<b>before<\/b>] Me,", "pj": "וְאִין בַּהֲדָא תּוֹכַחְתָּא לָא תִשְׁמְעוּן לְאוּלְפַן אוֹרַייְתִי וּתְהַלְכוּן קֳדָמַי בְּעַרְאַי", "pj_en": "But if by no one correction ye will hearken to the instruction of My law, but will walk perversely before Me,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 28, "aliyah": 3, "heb": "וְהָלַכְתִּ֥י עִמָּכֶ֖ם בַּחֲמַת־קֶ֑רִי וְיִסַּרְתִּ֤י אֶתְכֶם֙ אַף־אָ֔נִי שֶׁ֖בַע עַל־חַטֹּאתֵיכֶֽם׃", "onk": "וְאֵהַךְ עִמְּכוֹן בִּתְקוֹף רְגָז וְאִרְדֵּי יָתְכוֹן אַף אֲנָא שְׁבַע עַל חוֹבֵיכוֹן:", "onk_en": "I will walk contrary to you in fury, and indeed I too shall punish you sevenfold, for your sins.", "pj": "וְאִידַבֵּר אוּף אֲנָא יַתְכוֹן בְּעַרְאַי בְּעַלְמָא וְאִירְדֵי יַתְכוֹן לְחוֹד אֲנָא שְׁבַע מְחָן עַל שְׁבַע עֲבֵירָן דִי חֲטֵיתוּן קֳדָמָי", "pj_en": "I will also remember you adversely in the world, and will chastise you, even I, with seven plagues, for the seven transgressions with which ye have sinned before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 29, "aliyah": 3, "heb": "וַאֲכַלְתֶּ֖ם בְּשַׂ֣ר בְּנֵיכֶ֑ם וּבְשַׂ֥ר בְּנֹתֵיכֶ֖ם תֹּאכֵֽלוּ׃", "onk": "וְתֵיכְלוּן בְּשַׂר בְּנֵיכוֹן וּבְשַׁר בְּנָתֵיכוֹן תֵּיכְלוּן:", "onk_en": "You will eat the flesh of your sons and you will eat the flesh of your daughters.", "pj": "וְתֵיכְלוּן בְּשַר בְּנֵיכוֹן וּבְשַר בְּנָתֵיכוֹן אָמַר משֶׁה נְבִיָא כַּמָה קַשְׁיָין הִינוּן חוֹבַיָא וּמָה מְרִירִין אִינוּן חַטְיָיאֵי דִי גָרְמוּ לְאַבְהָתָא לְמֵיכַל בְּשַר בְּנֵיהוֹן וּבְנָתֵיהוֹן עַל דְלָא נָטְרוּ מִצְוָתָא דְאוֹרַייְתָא", "pj_en": "And ye shall eat the flesh of your sons, and the flesh of your daughters. Mosheh the prophet hath said, How heavy will have been the guilt, and how bitter those sins, that caused our fathers to eat the flesh of their sons, and the flesh of their daughters, because they kept not the commandments of the law!", "tj": "אֵי מָה בִּשִׁין אִינוּן חוֹבַיָא וּמָה מְרִירִין אִינוּן חֲטַיָיא דְּגָרְמוּ לְאַבָהָתן בִּיְרוּשָׁלַיִם לְמֵיכַל בְּשַר בְּנֵיהוֹן וּבְנָתֵיהוֹן:", "tj_en": "How evil that guilt, and bow bitter those sins, which caused our fathers in Jerusalem to eat the flesh of their sons and their daughters!", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 30, "aliyah": 3, "heb": "וְהִשְׁמַדְתִּ֞י אֶת־בָּמֹֽתֵיכֶ֗ם וְהִכְרַתִּי֙ אֶת־חַמָּ֣נֵיכֶ֔ם וְנָֽתַתִּי֙ אֶת־פִּגְרֵיכֶ֔ם עַל־פִּגְרֵ֖י גִּלּוּלֵיכֶ֑ם וְגָעֲלָ֥ה נַפְשִׁ֖י אֶתְכֶֽם׃", "onk": "וֶאֱשֵׁיצֵי יָת בָּמָתֵיכוֹן וֶאֱקַצֵּץ יָת חֲנִיסְנְסֵיכוֹן וְאֶתֵּן יָת פִּגְרֵיכוֹן עַל פִּגּוּר טַעֲוָתְכוֹן וִירַחֵק מֵימְרִי יָתְכוֹן:", "onk_en": "I will destroy your high places and I will smash your sun images. I will set your corpses upon the carcasses (remains) of your [<b>false<\/b>] idols, and My soul [<b>word<\/b>] will loathe [<b>reject<\/b>] you.", "pj": "וְאֵישֵׁיצֵי יַת בָּמוֹתֵיכוֹן וְאִפְכַר יַת מְנַחֲשֵׁיכוֹן וּקְסָמֵיכוֹן וְאֶשַׁוֵי יַת פִּגְרֵיכוֹן רְמָאִין עַל פִּגְרֵי טַעֲוָותֵיכוֹן וְתִירְחֵק מֵימְרִי יַתְכוֹן", "pj_en": "And I will destroy your high places, and overthrow your diviners and your enchanters, and your carcases will I cast away with the carcases of your idols, and My Word shall abhor you.", "tj": "", "tj_en": "", "rashi": "<b>במתיכם.<\/b> מִגְדָּלִים וּבִירָנִיּוֹת:<br><br><b>חמניכם.<\/b> מִין עֲ\"זָ שֶׁמַּעֲמִידִין עַל הַגַּגּוֹת, וְעַל שֵׁם שֶׁמַּעֲמִידִין בַּחַמָּה, קְרוּיִין חַמָּנִים (ספרא ויקרא י\"ט):<br><br><b>ונתתי את פגריכם.<\/b> תְּפוּחֵי רָעָב הָיוּ, וּמוֹצִיאִים יִרְאָתָם מֵחֵיקָם וּמְנַשְּׁקִים אוֹתָם, וּכְרֵיסָן נִבְקַעַת וְנוֹפֵל עָלֶיהָ (ספרא; סנהדרין ס\"ג):<br><br><b>וגעלה נפשי אתכם.<\/b> זֶה סִלּוּק שְׁכִינָה (ספרא):", "rashi_en": "במתיכם YOUR HIGH PLACES — towers and castles.<br><br>חמניכם SUN IMAGES — a kind of idols which they used to set on their roofs; and because they were placed in the sun (חמה) they are called “sun images” (חמנים) (Sifra, Kedoshim, Section 1 11).<br><br>ונתתי את פגריכם AND I WILL CAST YOUR CARCASSES [UPON THE CARCASSES OF YOUR IDOLS]  —[This actually happened, for it is related (Sifra, Bechukotai, Chapter 6 4; Sanhedrin 63b) that] people were once swollen from starvation during a siege, and yet they took their idols from their bosom and kissed them, and whilst they were so doing each person’s belly burst open and he fell to the ground upon it (the idol).<br><br>וגעלה נפשי אתכם AND MY SOUL SHALL LOATHE YOU — This refers to the departure of the Shechinah from their midst (Sifra, Bechukotai, Chapter 6 4)."}, {"ch": 26, "v": 31, "aliyah": 3, "heb": "וְנָתַתִּ֤י אֶת־עָֽרֵיכֶם֙ חׇרְבָּ֔ה וַהֲשִׁמּוֹתִ֖י אֶת־מִקְדְּשֵׁיכֶ֑ם וְלֹ֣א אָרִ֔יחַ בְּרֵ֖יחַ נִיחֹֽחֲכֶֽם׃", "onk": "וְאֶתֵּן יָת קִרְוֵיכוֹן צָדָא וְאֶצְדֵּי יָת מַקְדְּשֵׁיכוֹן וְלָא אֲקַבֵּל בְּרַעֲוָא קֻרְבַּן כְּנִשָּׁתְכוֹן:", "onk_en": "I will turn your cities into ruins and bring your Sanctuaries into desolation. I will no longer scent (accept favorably) the fragrance of your offerings [<b>the offering of your gatherings<\/b>].", "pj": "וְאֶתֵּן יַת קוּרְיֵיכוֹן צַדְיָין וַאֲשַׁעְמֵם יַת מוּקְדָשֵׁיכוֹן וְלָא אֲקַבֵּל בְּרַעֲוָא רֵיחַ קוּרְבָּנֵיכוֹן", "pj_en": "And I will make your cities desert places, and desolate your sanctuary; nor will I receive with acceptance the odour of your oblations.", "tj": "", "tj_en": "", "rashi": "<b>ונתתי את עריכם חרבה.<\/b> יָכוֹל מֵאָדָם, כְּשֶׁהוּא אוֹמֵר וַהֲשִׁמֹּתִי אֲנִי אֶת הָאָרֶץ הֲרֵי אָדָם אָמוּר, הָא מָה אֲנִי מְקַיֵּם חָרְבָּה? מֵעוֹבֵר וָשָׁב:<br><br><b>והשמותי את מקדשיכם.<\/b> יָכוֹל מִן הַקָּרְבָּנוֹת, כְּשֶׁהוּא אוֹמֵר וְלֹא אָרִיחַ הֲרֵי קָרְבָּנוֹת אֲמוּרִים, הָא מָה אֲנִי מְקַיֵּם וַהֲשִׁמּוֹתִי אֶת מִקְדְּשֵׁיכֶם? מִן הַגְּדוּדִיּוֹת — שַׁיָּרוֹת שֶׁל יִשְׂרָאֵל שֶׁהָיוּ מִתְקַדְּשׁוֹת וְנוֹעָדוֹת לָבֹא שָׁם; הֲרֵי שֶׁבַע פֻּרְעָנֻיּוֹת: אֲכִילַת בְּשַׂר בָּנִים וּבָנוֹת וְהַשְׁמָדַת בָּמוֹת הֲרֵי שְׁתַּיִם — כְּרִיתוּת חַמָּנִים אֵין כָּאן פֻּרְעָנוּת, אֶלָּא עַ\"יְ הַשְׁמָדַת הַבִּירָנִיּוֹת יִפְּלוּ הַחַמָּנִים שֶׁבְּרָאשֵׁי הַגַּגּוֹת וְיִכָּרְתוּ — וְנָתַתִּי אֶת פִּגְרֵיכֶם וְגוֹ' הֲרֵי שָׁלוֹשׁ, סִלּוּק שְׁכִינָה אַרְבַּע, חֻרְבַּן עָרִים, שִׁמְמוֹן מִקְדָּשׁ מִן הַגְּדוּדִיּוֹת, וְלֹא אָרִיחַ קָרְבָּנוֹת, הֲרֵי שֶׁבַע:", "rashi_en": "ונתתי את עריכם חרבה AND I WILL MAKE YOUR CITIES WASTE — I might think that this means that they will be so waste that there will be no human being there (no inhabitants)! But when Scripture states (v. 32) “I will bring the land into desolation” its becoming desolate of human beings is expressed there. How, then, must I explain the words \"[and I will make your cities] waste”? That there will not even be occasional passers to and fro — no occasional visitors (cf. Sifra, Bechukotai, Section 1 4).<br><br>והשמותי את מקדשיכם AND I WILL BRING YOUR SANCTUARIES UNTO DESOLATION — I might think that this means they will be desolate of sacrifices! But when Scripture states, “and I will not smell [your pleasing odors]”, their being desolate of sacrifices is expressed there! How then must I explain והשמותי את מקדשיכם? As referring to their being abandoned by the bands of pilgrims — by the caravans of Israelites which used to prepare and to band together in order to pilgrim there (Sifra, Bechukotai, Section 1 4). Thus again you have seven punishments: the eating of the flesh of their sons and daughters, the destruction of the high places, these make two. — The cutting off of the sun-images, however, is not reckoned as a separate punishment, for that statement means that through the destruction of the high places the sun-images which were placed on the top of the roofs would fall and so be destroyed. — “I will cast your carcasses etc.”, three; the departure of the Shechinah, four; the laying waste of the cities, the desertion of the Sanctuary by the pilgrim bands and “I shall not smell the pleasing odor of the sacrifices” — make altogether seven."}, {"ch": 26, "v": 32, "aliyah": 3, "heb": "וַהֲשִׁמֹּתִ֥י אֲנִ֖י אֶת־הָאָ֑רֶץ וְשָֽׁמְמ֤וּ עָלֶ֙יהָ֙ אֹֽיְבֵיכֶ֔ם הַיֹּשְׁבִ֖ים בָּֽהּ׃", "onk": "וְאֶצְדֵּי אֲנָא יָת אַרְעָא וִיצָרְיוּן עֲלַהּ בַּעֲלֵי דְבָבֵיכוֹן דְּיָתְבוּן בַּהּ:", "onk_en": "I will make the land [so] desolate that your enemies who live on it will be astonished.", "pj": "וְאַצְדֵי לְחוֹד אֲנָא יַת אַרְעָא דְלָא יְהֵי עֲלָהּ נְיַיח רוּחָא וְיִצְדוּן הֵיכְדֵין עֲלָהּ סַנְאֵיכוֹן דְשַׁרְיָין בָּהּ", "pj_en": "And I, even I, will lay your country waste, that the spirit of quietness may not be upon it; so that your enemies who will dwell in it shall be confounded.", "tj": "", "tj_en": "", "rashi": "<b>והשמתי אני את הארץ.<\/b> זוֹ מִדָּה טוֹבָה לְיִשְׂרָאֵל, שֶׁלֹּא יִמְצְאוּ הָאוֹיְבִים נַחַת רוּחַ בְּאַרְצָם, שֶׁתְּהֵא שׁוֹמֵמָה מִיּוֹשְׁבֶיהָ (ספרא):", "rashi_en": "והשמתי אני את הארץ AND I WILL BRING THE LAND INTO DESOLATION [AND YOUR ENEMIES WHO ABIDE IN IT SHALL BE DESOLATE UPON IT] — This was a kindly measure for Israel that the enemies would find no satisfaction in their (the Israelites') land and so it would   become desolate of its inhabitants (of the enemies also, and Israel might again easily take possession of it) (Sifra, Bechukotai, Chapter 6 5)."}, {"ch": 26, "v": 33, "aliyah": 3, "heb": "וְאֶתְכֶם֙ אֱזָרֶ֣ה בַגּוֹיִ֔ם וַהֲרִיקֹתִ֥י אַחֲרֵיכֶ֖ם חָ֑רֶב וְהָיְתָ֤ה אַרְצְכֶם֙ שְׁמָמָ֔ה וְעָרֵיכֶ֖ם יִהְי֥וּ חׇרְבָּֽה׃", "onk": "וְיָתְכוֹן אֲבַדַּר בֵּינֵי עַמְמַיָּא וֶאֱגָרֵי בַתְרֵיכוֹן דְּקָטְלִין בְּחַרְבָּא וּתְהֵי אַרְעֲכוֹן צָדְיָא וְקִרְוֵיכוֹן יְהוֹן חָרְבָּא:", "onk_en": "I will scatter you among the nations and unsheath [<b>incite people who kill with<\/b>] the sword after you. Your land will be desolate and your cities will be in ruins.", "pj": "וְיַתְכוֹן אַדְרֵי בֵּינֵי עַמְמַיָא וְאַגְרֵי בַּתְרֵיכוֹן עַם שְׁלוּפֵי חֶרֶב וּתְהֵי אַרְעֲכוֹן צַדְיָיא וְקוּרְיֵיכוֹן יֶהֶוְויָין צַדִיאָן", "pj_en": "And you will I disperse among the nations; for I will stir up against you a people who draw the sword, and your country shall be devastated, and your cities be solitary.", "tj": "", "tj_en": "", "rashi": "<b>ואתכם אזרה בגוים.<\/b> זוֹ מִדָּה קָשָׁה, שֶׁבְּשָׁעָה שֶׁבְּנֵי הַמְּדִינָה גּוֹלִים לְמָקוֹם אֶחָד, רוֹאִים זֶה אֶת זֶה וּמִתְנַחֲמִין, וְיִשְׂרָאֵל נִזְרוּ כְבַמְּזָרֶה — כְּאָדָם הַזּוֹרֶה שְׂעוֹרִים בְּנָפָה וְאֵין אַחַת מֵהֶן דְּבוּקָה בַחֲבֶרְתָּהּ (שם):<br><br><b>והריקתי.<\/b> כְּשֶׁשּׁוֹלֵף הַחֶרֶב מִתְרוֹקֵן הַנָּדָן; וּמִדְרָשׁוֹ חֶרֶב הַנִּשְׁמֶטֶת אַחֲרֵיכֶם אֵינָהּ חוֹזֶרֶת מַהֵר, כְּאָדָם שֶׁמֵּרִיק אֶת הַמַּיִם וְאֵין סוֹפָן לַחֲזֹר (ספרא):<br><br><b>והיתה ארצכם שממה.<\/b> שֶׁלֹּא תְמַהֲרוּ לָשׁוּב לְתוֹכָהּ, וּמִתּוֹךְ כָּךְ עָרֵיכֶם יִהְיוּ חָרְבָּה — נִרְאוֹת לָכֶם חֲרֵבוֹת, שֶׁבְּשָׁעָה שֶׁאָדָם גּוֹלֶה מִבֵּיתוֹ וּמִכַּרְמוֹ וּמֵעִירוֹ וְסוֹפוֹ לַחֲזֹר, כְּאִלּוּ אֵין כַּרְמוֹ וּבֵיתוֹ חֲרֵבִים, כָּךְ שְׁנוּיָה בְּתֹ\"כֹּ:", "rashi_en": "ואתכם אזרה בגוים AND I WILL SCATTER YOU AMONG THE NATIONS — This again was a harsh measure; because when the inhabitants of a country go into exile in one and the same place they have the opportunity to see each other and so find consolation for their bad lot. Israel, however, was scattered as though by a winnowing fan — as when a man winnows barley with a fan — when not even one grain of them adheres to the other (not even two grains remain in the same place; cf. Jeremiah 25:7) (Sifra, Bechukotai, Chapter 6 6).<br><br>והריקתי — (lit., I shall empty out) — This term may be used for drawing the sword because when one draws the sword the scabbard becomes empty (cf. Rashi on Ex 15:9). A Midrashic explanation (referring the word והריקתי to the sword itself not to the scabbard) is the sword once drawn to purs
