<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 44, "v": 18, "aliyah": 1, "heb": "וַיִּגַּ֨שׁ אֵלָ֜יו יְהוּדָ֗ה וַיֹּ֘אמֶר֮ בִּ֣י אֲדֹנִי֒ יְדַבֶּר־נָ֨א עַבְדְּךָ֤ דָבָר֙ בְּאׇזְנֵ֣י אֲדֹנִ֔י וְאַל־יִ֥חַר אַפְּךָ֖ בְּעַבְדֶּ֑ךָ כִּ֥י כָמ֖וֹךָ כְּפַרְעֹֽה׃", "onk": "וּקְרֵב לְוָתֵיהּ יְהוּדָה וַאֲמַר בְּבָעוּ רִבּוֹנִי יְמַלֶּל <b>כְּעַן<\/b> עַבְדָךְ פִּתְגָּמָא <b>קֳדָם<\/b> רִבּוֹנִי וְלָא יִתְקֵף רוּגְזָךְ בְּעַבְדָךְ אֲרֵי כְפַרְעֹה כֶּן אָתְּ:", "onk_en": "Yehudah approached him [Yoseif] and said, Please my master, let your servant speak [<b>now<\/b>] a word in my master’s ears [<b>before my master<\/b>], and do not be angry with your servant; for you are equal to Pharaoh.", "pj": "ויגש וּקְרֵיב לְוָתֵיהּ יְהוּדָה וַאֲמַר בְּמָטוּ רִיבּוֹנִי יְמַלֵל בְּמָטוּ עַבְדָךְ פִּתְגָמָא בְּמִשְׁמָעֵיהּ דְרִבּוֹנִי וְלָא יִתְקֵיף רוּגְזָךְ בְּעַבְדָךְ אֲרוּם מִן שַׁעְתָּא דְאָתִינָן לְוָותָךְ הֲוָת אָמַר לָן מִן קֳדָם יְיָ אֲנָא דָחִיל וּכְדוּן חָזְרוּן דִינָיִךְ לְמֶהֱוֵי מְדַמְיָין לְרִיבָּנוֹי דְפַרְעה", "pj_en": "And Jehuda came near to him and said, In imploring my lord, let thy servant, I implore, speak a word in the hearing of my lord, and let not thy anger grow strong against thy servant; for at the hour that we came to thee thou didst say to us, I fear before the Lord; and now thy judgments are rendered like (the judgments) of a prince of Pharoh.", "tj": "וּקְרֵיב לְוָתֵיהּ יְהוּדָה וַאֲמַר בְּבָעוּ מִינָךְ רִיבּוֹנִי יְמַלֵל כְּעַן עַבְדָךְ פִּתְגָם בְּמִישְׁמָעֵיהּ דְרִבּוֹנִי וְלָא יִתְקֵף רוּגְזָךְ בְּעַבְדָךְ הֲלָא מִן זִימְנָא קַדְמַיָא דְנַחְתָנָן לְוָותָךְ לְמִצְרַיִם הֲוֵיתָא אָמַר לָן מִן קֳדָם יְיָ אֲנָא דָחִיל וּכְדוֹ חָזְרוּ דִינָךְ לְמֶהֱוֵי מְדַמְיַין לְרִיבָּנוֹי דְפַרְעֹה רַבָּךְ דְאַתְּ יֵימֵי בֵּיהּ אֲרוּם יַקִיר אֲנָא כְּוָותָךְ וְאַבָּא יַקִיר כְּוַות פַּרְעה רַבָּךְ דְאַתְּ יֵימֵי בֵּיהּ הֲלָא אֲנָא מִשְׁתְּבַּע בְּחַיֵי רֵישֵׁיהּ דְאַבָּא וְלֵית אֲנָא מְשַׁקֵר דְאִין שָׁלִיף אֲנָא חַרְבִּי מִן גוֹ תֵּיקָא לֵית אֲנָא מַחֲזִיר יָתָהּ לְתֵּיקָא עַד זְמַן דְנִימְלֵי כָּל אַרְעָא דְמִצְרַיִם קְטוּלִין לֵית אֲנָא מַחֲזִיר יָתָהּ לְתֵיקָא עַד זְמַן דְנַעֲבֵיד כָּל אַרְעָא דְמִצְרַיִם צָדוּן מִן דִייוּר מִינָךְ קֳדָמוֹי אֲנָא מִישְׁרֵי וּמִפַּרְעה רַבָּךְ אֲנָא מַחֲסִיל עַל מְנַת מִיעֲבַד עַל כּוֹרְחֵיהּ דְאַבָּא אוֹ דִילְמָא דְלָא אִשְׁתְּמָע לָךְ וְלָא אַתְנִי לָךְ מַה דַעֲבָדוּ תְּרֵין אָחוֹי שִׁמְעוֹן וְלֵוִי דְעָלוּ לִכְּרַכָּא דִשְׁכֶם דַהֲוָה יָתֵיב בְּשַׁלְוָה וּקְטָלוּ כָּל דְכוּרָא לְפִתְגָם דְחָרֶב עַל יְדֵי דִסְאִיבוּ לְדִינָה אֲחַתְהוֹן דְלָא הַוְיָא מִתְמַנְיָא בְּשִׁבְטַיָא וְלָא מְקַבְּלָא חוּלְקָא וְאַחֲסָנָא עִמָן בְּפִילוּג אַרְעָא עַל חַד כַּמָה וְכַמָה דְבִנְיָמִין אָחוּנָן מִתְמְנֵי עִמָן בְּשִׁיבְטַיָא וּמְקַבֵּיל חוּלַק וְאַחֲסָנָא עִמָן בְּפִילוּג אַרְעָא וַאֲנָא דַחֲיָלֵי קָשֵׁי מִדִידְהוֹן דְעַרָבִית לְטַלְיָא מִן יְדוֹי דְאַבָּא וַאֲמָרִית לֵיהּ אִין לָא אַיְיתִית יָתֵיהּ לְוָותָךְ וְאַקִימִית יָתֵיהּ קֳדָמָךְ נֶהֱוֵי חָטֵי לָךְ וּמַרְחִיק מִן שְׁאִילַת שְׁלָמָךְ כָּל יוֹמַיָא אוֹ דִילְמָא דְלָא אִשְׁתְּמַע לָךְ וְלָא אֲתַנֵי לָךְ אֲרוּם מַלְכִּין וְשִׁלְטוֹנִין אֲנַן כְּוָותָךְ בְּאַרְעָא דִכְנָעַן:", "tj_en": "And Jehuda came near him, and said, In beseeching thee, my lord, let thy servant now speak a word in the hearing of my lord, and let not thy anger be strong against thy servant; for at the first time we came down to thee into Mizraim didst thou not tell us, I fear before the Lord? And now thy judgments are returned like the judgments of Pharoh thy lord, by whom thou adjurest. Yet I am honourable as thou art, and my father is honourable as Pharoh thy lord is, by whom thou dost adjure. Can I not swear by the life of the head of my father, and not lie? For if I draw my sword from within its sheath, I would not return it till I had filled all the land of Mizraim with the slain; to its sheath I would not return it, till I had made all Mizraim desolate of inhabitants, beginning with thyself, and ending with Pharoh thy lord, were it not against the will of my father. Or, hath it not been heard by thee, or not told thee, what my two brothers Shimeon and Levi did, who went up against the town of Shekem, while they were dwelling in security, and killed every male by the edge of the sword, because they bad corrupted Dinah our sister, who hath not been numbered in the tribes, nor hath portion or inheritance with us in the dividing of the land? By how much more then (shall it be done) for Benjamin our brother, who is numbered with us among the tribes, and who hath portion and inheritance with us in the dividing of the land ? And in force is more unyielding than theirs, because I have become the sponsor for the youth at the hands of my father, saying, If I bring him not to thee, and set him before thee, I will be guilty with thee and be removed from thy salutation all the days. Hast thou not beard, or hath it not been told thee, that in the land of Kenaan we are kings and princes, as thou art ?", "rashi": "<b>ויגש אליו וגומר … דבר באזני אדני.<\/b> יִכָּנְסוּ דְּבָרַי בְּאָזְנֶיךָ:<br><br><b>ואל יחר אפך.<\/b> מִכָּאן אַתָּה לָמֵד שֶׁדִּבֵּר אֵלָיו קָשׁוֹת:<br><br><b>כי כמוך כפרעה.<\/b> חָשׁוּב אַתָּה בְעֵינַי כְּמֶלֶךְ, זֶהוּ פְשׁוּטוֹ. וּמִדְרָשׁוֹ סוֹפְךָ לִלְקוֹת עָלָיו בְּצָרַעַת כְּמוֹ שֶׁלָּקָה פַרְעֹה עַל יְדֵי זְקֵנָתִי שָׂרָה עַל לַיְלָה אַחַת שֶׁעִכְּבָהּ (בראשית רבה). דָּבָר אַחֵר מַה פַּרְעֹה גוֹזֵר וְאֵינוֹ מְקַיֵּם, מַבְטִיחַ וְאֵינוֹ עוֹשֶׂה, אַף אַתָּה כֵן; וְכִי זוֹ הִיא שִׂימַת עַיִן שֶׁאָמַרְתָּ לָשׂוּם עֵינְךָ עָלָיו? דָּבָר אַחֵר, כִּי כָּמוֹךָ כְּפַרְעֹה, אִם תַּקְנִיטֵנִי אֶהֱרֹג אוֹתְךָ וְאֶת אֲדוֹנֶךָ (בראשית רבה):", "rashi_en": "ויגש אליו וגו' . . . דבר באזני אדני THEN JUDAH CAME NEAR TO HIM etc. [LET THY SERVANT SPEAK] A WORD IN MY LORD S EARS etc. May my words penetrate into your ears (Genesis Rabbah 93:6). <br><br>ואל יחר אפך AND LET NOT THY WRATH GLOW — From these words you may infer that he spoke to him in harsh terms.<br><br>כי כמוך כפרעה FOR THOU ART EVEN AS PHARAOH — In my sight you are as important as the king. This is the literal meaning, but a Midrashic explanation is: You will ultimately be stricken with leprosy for detaining Benjamin even as your ancestor Pharaoh was stricken because he detained my ancestress Sarah one night. Another explanation is: you are as unreliable as Pharaoh — just as Pharaoh issues decrees and does not carry them out, makes promises and does not fulfil them, so also do you. Is this what you meant by “setting your eyes” upon him when you said (Genesis 44:21) “Bring him down and I will set mine eyes upon him”? Still another interpretation of כי כמוך כפרעה FOR THOU SHALT BECOME EVEN AS PHARAOH: if you provoke me I will slay you and your master (Genesis Rabbah 93:6). "}, {"ch": 44, "v": 19, "aliyah": 1, "heb": "אֲדֹנִ֣י שָׁאַ֔ל אֶת־עֲבָדָ֖יו לֵאמֹ֑ר הֲיֵשׁ־לָכֶ֥ם אָ֖ב אוֹ־אָֽח׃", "onk": "רִבּוֹנִי שְׁאִיל יָת עַבְדוֹהִי לְמֵימָר הַאִית לְכוֹן אַבָּא אוֹ אָחָא:", "onk_en": "My master asked his servants, saying, Do you have a father or brother?", "pj": "רִבּוֹנִי שְׁאֵיל יַת עַבְדוֹי לְמֵימַר הַאִית לְכוֹן אַבָּא אוֹ אָחָא", "pj_en": "My lord asked his servants, saying, Have you a father or a brother?", "tj": "כַּד חֲמָא יוֹסֵף הַבְהֲבָא וְיַקִידָא דִסְלִיקַת גְבוּרְתֵּיהּ דִיהוּדָה אָחוֹי וְנַפְקִין שְעַרְתֵּיהּ דְלִבֵּיהּ וּבְזָעוּ לְבוּשֵׁיהּ בֵּיהּ בְּשַׁעְתָּא רָמַז יוֹסֵף לִמְנַשֶׁה בּוּכְרֵיהּ וְרָפַס בִּמְסָאנֵיהּ וְרַעֲדַת כָּל פְּלָטִין דְיוֹסֵף בֵּיהּ בְּשַׁעְתָּא אָמַר יְהוּדָה אִילוּלֵי דַהֲוָה עֲלָע מִן בֵּית אַבָּא לָא הֲוָה כָּשַׁר לְמִתְעַבְדָא כֵּן בִּכְדֵין שָׁרֵי יְהוּדָה מַרְכִּיךְ בְּמִילוֹי וַאֲמַר רִבּוֹנִי שְׁאִיל יַת עַבְדוֹי לְמֵימַר הֲאִית לְכוֹן אָב אוֹ אָח:", "tj_en": "When Joseph, the beloved and honourable, saw that the strength of Jehuda his brother bad risen up, and that the thoughts of his heart came forth, and that they rent their garments, in that hour beckoned Joseph to Menasheh his first-born, and stamped with his shoe; and all Joseph's palace trembled. In that hour Jehuda said, If it bad not been on the side of the house of my father, it would not have been done so. Then began Jehuda to be milder in his words, and he said, My lord asked his servants, saying, Have you a father, or a brother ?", "rashi": "<b>שאל את עבדיו.<\/b> מִתְּחִלָּה בַעֲלִילָה בָאתָ עָלֵינוּ, לָמָּה הָיָה לְךָ לִשְׁאֹל כָּל אֵלֶּה? בִּתְּךָ הָיִינוּ מְבַקְּשִׁים? אוֹ אֲחוֹתֵנוּ אַתָּה מְבַקֵּשׁ? וְאַף עַל פִּי כֵן", "rashi_en": "אדני שאל את עבדיו MY LORD ASKED HIS SERVANTS — From the beginning you came with a pretext against us. What need had you to ask us all these questions? Were we asking for your daughter in marriage or were you asking for our sister? And yet "}, {"ch": 44, "v": 20, "aliyah": 1, "heb": "וַנֹּ֙אמֶר֙ אֶל־אֲדֹנִ֔י יֶשׁ־לָ֙נוּ֙ אָ֣ב זָקֵ֔ן וְיֶ֥לֶד זְקֻנִ֖ים קָטָ֑ן וְאָחִ֣יו מֵ֔ת וַיִּוָּתֵ֨ר ה֧וּא לְבַדּ֛וֹ לְאִמּ֖וֹ וְאָבִ֥יו אֲהֵבֽוֹ׃", "onk": "וַאֲמַרְנָא לְרִבּוֹנִי אִית לָנָא אַבָּא סָבָא וּבַר סִיבְתִין זְעֵיר וְאָחוּהִי מִית וְאִשְׁתָּאַר הוּא בִּלְחוֹדוֹהִי לְאִמֵּהּ וַאֲבוּהִי רְחִים לֵהּ:", "onk_en": "We said to my master, We have a father who is old, and a young child of his old age. His brother is dead, and he alone survives of his mother, and his father loves him.", "pj": "וַאֲמַרְנָא לְרִיבּוֹנִי אִית לָן אַבָּא סָבָא וּבַר סִיבְתִּין קָלִיל וְאָחוֹי מִית וְאִשְׁתְּאַר הוּא בִּלְחוֹדוֹי מִן אִמֵיהּ וְאָבוֹי בְּגִין כֵּן רָחֵים לֵיהּ", "pj_en": "And we told my lord, We have an aged father, and a son of his old age, a little one, whose brother is dead, and he only remains of his mother; and his father on that account loveth him.", "tj": "", "tj_en": "", "rashi": "<b>ונאמר אל אדוני<\/b>, לֹא כִחַדְנוּ מִמְּךָ דָּבָר (בראשית רבה):<br><br><b>ואחיו מת.<\/b> מִפְּנֵי הַיִּרְאָה הָיָה מוֹצִיא דְּבַר שֶׁקֶר מִפִּיו, אָמַר אִם אוֹמַר לוֹ שֶׁהוּא קַיָּם, יֹאמַר הֲבִיאוּהוּ אֶצְלִי:<br><br><b>לבדו לאמו.<\/b> מֵאוֹתוֹ הָאֵם אֵין לוֹ עוֹד אָח:", "rashi_en": "ונאמר אל אדני WE SAID TO MY LORD — we kept nothing back from you (Genesis Rabbah 93:8).<br><br>ואחיו מת AND HIS BROTHER IS DEAD — He uttered this untruth out of fear. He thought: if I tell him that he is alive he may say “Bring him to me”.<br><br>לבדו לאמו [HE] ALONE [IS LEFT] OF HIS MOTHER — of that mother he has no other brother. "}, {"ch": 44, "v": 21, "aliyah": 1, "heb": "וַתֹּ֙אמֶר֙ אֶל־עֲבָדֶ֔יךָ הוֹרִדֻ֖הוּ אֵלָ֑י וְאָשִׂ֥ימָה עֵינִ֖י עָלָֽיו׃", "onk": "וַאֲמַרְתָּ לְעַבְדָיךְ אֲחִיתוֹהִי לְוָתִי וֶאֱשַׁוֵּי עֵינִי עֲלוֹהִי:", "onk_en": "You said to your servants, Bring him down to me, that I may set my eyes on him.", "pj": "וַאֲמַרְתְּ לְעַבְדָךְ אַחְתוֹהִי לְוָתִי וַאֲשַׁוֵי עֵינוֹי לְטַבְתָא עֲלוֹי", "pj_en": "And thou saidst to thy servants, Bring him down to me, and I will set mine eyes on him for good.", "tj": "מָחוּס עֵינִי עֲלוֹי:", "tj_en": "Mine eyes shall be gracious upon him.", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 22, "aliyah": 1, "heb": "וַנֹּ֙אמֶר֙ אֶל־אֲדֹנִ֔י לֹא־יוּכַ֥ל הַנַּ֖עַר לַעֲזֹ֣ב אֶת־אָבִ֑יו וְעָזַ֥ב אֶת־אָבִ֖יו וָמֵֽת׃", "onk": "וַאֲמַרְנָא לְרִבּוֹנִי לָא יִכּוּל עוּלֵימָא לְמִשְׁבַּק יָת אֲבוּהִי וְאִם יִשְׁבּוֹק יָת אֲבוּהִי וּמִית:", "onk_en": "We said to my master, the lad cannot leave his father, for if he left his father, he would die.", "pj": "וַאֲמַרְנָא לְרִבּוֹנִי לֵית אֶפְשַׁר לְטַלְיָא לְמִשְׁבּוֹק יַת אָבוֹי דְאִין שָׁבִיק יַת אָבוֹי מַיִית הוּא", "pj_en": "But we told my lord, The youth cannot leave his father: for if he leave his father, he will die.", "tj": "", "tj_en": "", "rashi": "<b>ועזב את אביו ומת.<\/b> אִם יַעֲזֹב אֶת אָבִיו, דּוֹאֲגִים אָנוּ שֶׁמָּא יָמוּת בַּדֶּרֶךְ, שֶׁהֲרֵי אִמּוֹ בַּדֶּרֶךְ מֵתָה:", "rashi_en": "ועזב את אביו ומת FOR IF HE SHOULD LEAVE HIS FATHER, HE WOULD DIE — If he leaves his father we shall be in anxiety lest he die on the journey, because indeed his mother died during a journey. "}, {"ch": 44, "v": 23, "aliyah": 1, "heb": "וַתֹּ֙אמֶר֙ אֶל־עֲבָדֶ֔יךָ אִם־לֹ֥א יֵרֵ֛ד אֲחִיכֶ֥ם הַקָּטֹ֖ן אִתְּכֶ֑ם לֹ֥א תֹסִפ֖וּן לִרְא֥וֹת פָּנָֽי׃", "onk": "וַאֲמַרְתָּ לְעַבְדָיךְ אִם לָא יֵחוֹת אֲחוּכוֹן זְעֵירָא עִמְּכוֹן לָא תוֹסְפוּן לְמֶחֱזֵי אַפָּי:", "onk_en": "You [then] said to your servants, If your youngest brother does not come down with you, you shall not see my face again.", "pj": "וַאֲמַרְתְּ לְעַבְדָךְ אִין לָא יֵיחוּת אֲחוּכוֹן זְעֵירָא עִמְכוֹן לָא תוֹסְפוּן לְמֵיחְמֵי סְבַר אַפָּי", "pj_en": "Yet thou saidst to thy servants, If you bring not your youngest brother down, you shall not again see my face.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 24, "aliyah": 1, "heb": "וַֽיְהִי֙ כִּ֣י עָלִ֔ינוּ אֶֽל־עַבְדְּךָ֖ אָבִ֑י וַנַּ֨גֶּד־ל֔וֹ אֵ֖ת דִּבְרֵ֥י אֲדֹנִֽי׃", "onk": "וַהֲוָה כַּד סְלֵיקְנָא לְעַבְדָךְ אַבָּא וְחַוֵּינָא לֵיהּ יָת פִּתְגָּמֵי רִבּוֹנִי:", "onk_en": "When we went to your servant, my father, we told him of my master’s words.", "pj": "וַהֲוָה כַּד סְלִיקְנָא לְעַבְדָךְ אַבָּא וּתְנֵינָא לֵיהּ יַת פִּתְגָמֵי רִבּוֹנִי", "pj_en": "And it was when we went up to thy servant our father, we related to him my lord's words.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 25, "aliyah": 1, "heb": "וַיֹּ֖אמֶר אָבִ֑ינוּ שֻׁ֖בוּ שִׁבְרוּ־לָ֥נוּ מְעַט־אֹֽכֶל׃", "onk": "וַאֲמַר אָבוּנָא תּוּבוּ זְבוּנוּ לָנָא זְעֵיר <b>עִיבוּרָא<\/b>:", "onk_en": "Our father said, Go back and buy us a little food [<b>grain<\/b>].", "pj": "וַאֲמַר אָבוּנָא תּוּבוּ זְבוּנוּ לָנָא קָלִיל עִיבּוּרָא", "pj_en": "And our father said to us, Return, and buy us a little corn.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 26, "aliyah": 1, "heb": "וַנֹּ֕אמֶר לֹ֥א נוּכַ֖ל לָרֶ֑דֶת אִם־יֵשׁ֩ אָחִ֨ינוּ הַקָּטֹ֤ן אִתָּ֙נוּ֙ וְיָרַ֔דְנוּ כִּי־לֹ֣א נוּכַ֗ל לִרְאוֹת֙ פְּנֵ֣י הָאִ֔ישׁ וְאָחִ֥ינוּ הַקָּטֹ֖ן אֵינֶ֥נּוּ אִתָּֽנוּ׃", "onk": "וַאֲמַרְנָא לָא נִכּוּל לְמֵיחָת אִם אִית אָחוּנָא זְעֵירָא עִמָּנָא וְנֵחוֹת אֲרֵי לָא נִכּוּל לְמֶחֱזֵי אַפֵּי גַבְרָא וְאָחוּנָא זְעֵירָא לֵיתוֹהִי עִמָּנָא:", "onk_en": "We said, We cannot go down. If our youngest brother is with us, we will go down, for we cannot see the man’s face, unless our youngest brother is with us.", "pj": "וַאֲמַרְנָא לֵית אֶפְשַׁר לָנָא לְמֵיחוֹת אִין אִית אָחוּנָא זְעֵירָא עִמָנָא וְנֵיחוּת אֲרוּם לֵית אֶפְשַׁר לָנָא לְמֵיחְמֵי סְבַר אַפֵּי גַבְרָא וְאָחוּנָא זְעֵירָא לֵיתוֹי עִמָנָא", "pj_en": "But we told him, We cannot go down if our youngest brother be not with us when we go down, for we shall not be able to see the man's face, unless our youngest brother be with us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 27, "aliyah": 1, "heb": "וַיֹּ֛אמֶר עַבְדְּךָ֥ אָבִ֖י אֵלֵ֑ינוּ אַתֶּ֣ם יְדַעְתֶּ֔ם כִּ֥י שְׁנַ֖יִם יָֽלְדָה־לִּ֥י אִשְׁתִּֽי׃", "onk": "וַאֲמַר עַבְדָךְ אַבָּא לָנָא אַתּוּן יְדַעְתּוּן אֲרֵי תְרֵין יְלִידַת לִי אִתְּתִי:", "onk_en": "Your servant, my father said to us, You know that my wife [Rochel] bore me two sons.", "pj": "וַאֲמַר עַבְדָךְ אַבָּא לָנָא אַתּוּן יְדַעְתּוּן אֲרוּם תְּרֵין בְּנִין יְלֵידַת לִי אִנְתְּתִי", "pj_en": "And thy servant our father said to us, You know that my wife bare me two sons.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 28, "aliyah": 1, "heb": "וַיֵּצֵ֤א הָֽאֶחָד֙ מֵֽאִתִּ֔י וָאֹמַ֕ר אַ֖ךְ טָרֹ֣ף טֹרָ֑ף וְלֹ֥א רְאִיתִ֖יו עַד־הֵֽנָּה׃", "onk": "וּנְפַק חַד מִלְּוָתִי וַאֲמָרִית בְּרַם <b>מִקְטַל קְטִיל<\/b> וְלָא חֲזִתֵּיהּ עַד כְּעָן:", "onk_en": "One has [already] left me, and I said, surely he is torn to pieces [<b>dead<\/b>]. I have not see him until now.", "pj": "וְנָפַק חַד מִלְוָתִי וַאֲמָרִית בְּרַם מִיקְטַל קְטִיל וְלָא חֲמִיתֵיהּ עַד כְּדוֹן", "pj_en": "One went forth from me, and I said, Surely he is dead, and I have not beheld him since;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 29, "aliyah": 1, "heb": "וּלְקַחְתֶּ֧ם גַּם־אֶת־זֶ֛ה מֵעִ֥ם פָּנַ֖י וְקָרָ֣הוּ אָס֑וֹן וְהֽוֹרַדְתֶּ֧ם אֶת־שֵׂיבָתִ֛י בְּרָעָ֖ה שְׁאֹֽלָה׃", "onk": "וְתַדְבְּרוּן אַף יָת דֵּין מִן קֳדָמַי וִיעַרְעִנֵּיהּ <b>מוֹתָא<\/b> וְתַחֲתוּן יָת שִׂבְתִי בְּבִישְׁתָא לִשְׁאוֹל:", "onk_en": "If you take this one also away from me, and misfortune [<b>death<\/b>] befall him, you will bring my white head down to the grave in evil.", "pj": "וְתִדְבְּרוּן אוּף יַת דֵין מִן קֳדָמַי וִיאַרְעִינֵיהּ מוֹתָא וְתִחְתוּן יַת סֵיבְתִּי בְּדָווֹי לְבֵי קְבוּרְתָּא", "pj_en": "and you will now take this other from before me; and if death happen to him, you will bring down mine age with mourning to the house of the grave.", "tj": "", "tj_en": "", "rashi": "<b>וקרהו אסון.<\/b> שֶׁהַשָּׂטָן מְקַטְרֵג בִּשְׁעַת הַסַּכָּנָה (בראשית רבה):<br><br><b>והורדתם את שיבתי וגו'.<\/b> עַכְשָׁו כְּשֶׁהוּא אֶצְלִי, אֲנִי מִתְנַחֵם בּוֹ עַל אִמּוֹ וְעַל אָחִיו, וְאִם יָמוּת זֶה, דּוֹמֶה עָלַי שֶׁשְּׁלָשְׁתָּן מֵתוּ בְּיוֹם אֶחָד:", "rashi_en": "וקרהו אסון AND MISCHIEF BEFALL HIM — For Satan brings charges against men in the hour of danger (Genesis Rabbah 91.9). <br><br>'והורדתם את שיבתי וגו YE SHALL BRING DOWN MY GRAY HAIRS etc. — Whilst Benjamin is beside me I find comfort in him for the loss of his mother and his brother, so that if he dies it will seem to me as though the three of them died in the same day. "}, {"ch": 44, "v": 30, "aliyah": 1, "heb": "וְעַתָּ֗ה כְּבֹאִי֙ אֶל־עַבְדְּךָ֣ אָבִ֔י וְהַנַּ֖עַר אֵינֶ֣נּוּ אִתָּ֑נוּ וְנַפְשׁ֖וֹ קְשׁוּרָ֥ה בְנַפְשֽׁוֹ׃", "onk": "וּכְעַן כְּמֵיתִי לְוַת עַבְדָךְ אַבָּא וְעוּלֵימָא לֵיתוֹהִי עִמָּנָא וְנַפְשֵׁיהּ <b>חֲבִיבָא לֵהּ כְּנַפְשֵׁיהּ<\/b>:", "onk_en": "And now, when I come to your servant, my father, and the lad is not with us; his soul is bound up with the lad’s [<b>as beloved to him as his own<\/b>] soul.", "pj": "וּכְעַן בְּמֵיתִי לְוַת עַבְדָךְ אַבָּא וְטַלְיָא לֵיתוֹהִי עִמָנָא וְנַפְשֵׁיהּ חֲבִיבָא לֵיהּ כְּנַפְשֵׁיהּ", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 31, "aliyah": 2, "heb": "וְהָיָ֗ה כִּרְאוֹת֛וֹ כִּי־אֵ֥ין הַנַּ֖עַר וָמֵ֑ת וְהוֹרִ֨ידוּ עֲבָדֶ֜יךָ אֶת־שֵׂיבַ֨ת עַבְדְּךָ֥ אָבִ֛ינוּ בְּיָג֖וֹן שְׁאֹֽלָה׃", "onk": "וִיהֵי כַּד יֶחֱזֵי אֲרֵי לֵית עוּלֵימָא וּמִית וְיַחֲתוּן עַבְדָיךְ יָת שִׂיבַת עַבְדָךְ אָבוּנָא בְּדָווֹנָא לִשְׁאוֹל:", "onk_en": "When he sees that the lad is not [with us], he will die. Your servants will have brought down the white head of your servant, our father, to the grave in sorrow.", "pj": "וִיהֵי כַּד יֶחֱזֵי אֲרֵי לֵית טַלְיָא וִימוּת וְיֵחְתוּן עַבְדָךְ יַת סֵיבַת עַבְדָךְ אָבוּנָא בְּדָווֹי לְבֵי קְבוּרְתָּא", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>והיה כראותו כי אין הנער ומת.<\/b> אָבִיו מִצָּרָתוֹ:", "rashi_en": "והיה כראותו כי אין הנער ומת IT SHALL COME TO PASS WHEN HE SEETH THAT THE LAD IS NOT WITH US, THAT HE WILL DIE, i.e. his father will die of grief."}, {"ch": 44, "v": 32, "aliyah": 2, "heb": "כִּ֤י עַבְדְּךָ֙ עָרַ֣ב אֶת־הַנַּ֔עַר מֵעִ֥ם אָבִ֖י לֵאמֹ֑ר אִם־לֹ֤א אֲבִיאֶ֙נּוּ֙ אֵלֶ֔יךָ וְחָטָ֥אתִי לְאָבִ֖י כׇּל־הַיָּמִֽים׃", "onk": "אַרֵי עַבְדָךְ מְעָרַב בְּעוּלֵימָא מִן אַבָּא לְמֵימָר אִם לָא אַיְתִנֵּיהּ לְוָתָךְ <b>וָאֱהִי חָטֵי<\/b> לְאַבָּא כָּל יוֹמַיָּא:", "onk_en": "For your servant became surety for the lad, to my father, saying, If I do not bring him to you, I will have sinned [<b>be a sinner<\/b>] to my father for all time.", "pj": "אֲרוּם עַבְדָךְ מְעָרַב בְּטַלְיָא מִן אַבָּא לְמֵימַר אִין לָא אַיְיתִינֵיהּ לְוָתָךְ וְנִתְחַיֵיב קֳדָם אַבָּא כָּל יוֹמַיָא", "pj_en": "Therefore thy servant became surety for the youth with my father, saying, If I restore him not to thee, let me be guilty before my father all the days.", "tj": "", "tj_en": "", "rashi": "<b>כי עבדך ערב את הנער.<\/b> וְאִם תֹּאמַר, לָמָּה אֲנִי נִכְנָס לַתִּגָּר יוֹתֵר מִשְּׁאָר אַחַי? הֵם כֻּלָּם מִבַּחוּץ וַאֲנִי נִתְקַשַּׁרְתִּי בְקֶשֶׁר חָזָק לִהְיוֹת מְנֻדֶּה בב' עוֹלָמוֹת:", "rashi_en": "כי עבדך ערב את הנער FOR THY SERVANT BECAME SURETY FOR THE LAD — Should you ask why I enter into the contest (champion his cause) more strongly than my other brothers — then I tell you: I have more to lose; they all stand outside the matter (are less concerned with it than I am), but I have placed myself under a firm bond to be an outcast in both worlds. "}, {"ch": 44, "v": 33, "aliyah": 2, "heb": "וְעַתָּ֗ה יֵֽשֶׁב־נָ֤א עַבְדְּךָ֙ תַּ֣חַת הַנַּ֔עַר עֶ֖בֶד לַֽאדֹנִ֑י וְהַנַּ֖עַר יַ֥עַל עִם־אֶחָֽיו׃", "onk": "<b>וּכְעַן<\/b> יֵתֶב <b>כְּעַן<\/b> עַבְדָךְ תְּחוֹת עוּלֵימָא עַבְדָא לְרִבּוֹנִי וְעוּלֵימָא יִסַּק עִם אֲחוּהִי:", "onk_en": "And now, let your servant [<b>now<\/b>] remain as a slave to my master instead of the lad. Let the lad go up with his brothers.", "pj": "וּכְדֵין יִתֵיב בְּבָעוּ עַבְדָךְ חוֹלַף טַלְיָא עַבְדָא לְרִיבּוֹנִי וְטַלְיָא יִסַק עִם אָחוֹהִי", "pj_en": "And now let thy servant remain, I beseech thee, as the slave of my lord, instead of the young man; and let the young man go up with his brothers.", "tj": "", "tj_en": "", "rashi": "<b>ישב נא עבדך וגו'.<\/b> לְכָל דָּבָר אֲנִי מְעֻלֶּה מִמֶּנּוּ, לִגְבוּרָה וּלְמִלְחָמָה וּלְשַׁמֵּשׁ (בראשית רבה):", "rashi_en": "'ישב נא עבדך וגו LET THY SERVANT ABIDE etc. — For all purposes I am superior to him in strength — whether for battle or for service as a slave."}, {"ch": 44, "v": 34, "aliyah": 2, "heb": "כִּי־אֵיךְ֙ אֶֽעֱלֶ֣ה אֶל־אָבִ֔י וְהַנַּ֖עַר אֵינֶ֣נּוּ אִתִּ֑י פֶּ֚ן אֶרְאֶ֣ה בָרָ֔ע אֲשֶׁ֥ר יִמְצָ֖א אֶת־אָבִֽי׃", "onk": "אֲרֵי אֶכְדֵּין אֶסַּק לְוַת אַבָּא וְעוּלֵימָא לֵיתוֹהִי עִמִּי דִּלְמָא אֶחֱזֵי בְּבִישׁוּ דִּי יִשְׁתְּכַח יָת אַבָּא:", "onk_en": "For how shall I go up to my father when the lad is not with me; lest I see the evil that would befall my father.", "pj": "אֲרוּם הֵיכְדֵין אֶסַק לְוַת אַבָּא וְטַלְיָא לֵיתוֹי עִמִי דִלְמָא אֶחֱמֵי בְּבִישְׁתָּא דְתִבְרַז יַת אַבָּא", "pj_en": "For how can I go up to my father, and the young man be not with us lest I behold the evil that will strike my father through!", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 1, "aliyah": 2, "heb": "וְלֹֽא־יָכֹ֨ל יוֹסֵ֜ף לְהִתְאַפֵּ֗ק לְכֹ֤ל הַנִּצָּבִים֙ עָלָ֔יו וַיִּקְרָ֕א הוֹצִ֥יאוּ כׇל־אִ֖ישׁ מֵעָלָ֑י וְלֹא־עָ֤מַד אִישׁ֙ אִתּ֔וֹ בְּהִתְוַדַּ֥ע יוֹסֵ֖ף אֶל־אֶחָֽיו׃", "onk": "וְלָא יְכִיל יוֹסֵף לְאִתְחַסָּנָא לְכֹל דְּקָיְמִין עִלָּו‍ֹהִי וּקְרָא אַפִּיקוּ כָל אֱנַשׁ מֵעִלָּוָי וְלָא קָם אֱנַשׁ עִמֵּיהּ כַּד אִתְיְדַע יוֹסֵף לְוַת אֲחוֹהִי:", "onk_en": "Yoseif could not contain his emotions in the presence of all who stood before him, and he cried out Let everyone leave my presence. No man remained with him, when Yoseif made himself known to his brothers.", "pj": "וְלָא יָכִיל יוֹסֵף לִמְסוֹבְרָא דְלָא לְמִבְכֵּי מִן בִּגְלַל כָּל מִין דְקַיְימִין קֳדָמוֹי וַאֲמַר הַנְפִּיקוּ כָּל אֵינַשׁ מִן קֳדָמַי וְלָא קָם אֵינַשׁ עִמֵיהּ כַּד אִשְׁתְּמוֹדַע יוֹסֵף לְאָחוֹי", "pj_en": "And Joseph could not endure not to (be able to) weep, on account of all who stood before him. And he said, Let every man go out from me: and no one stood with him, while Joseph made himself known to his brothers.", "tj": "", "tj_en": "", "rashi": "<b>ולא יכל יוסף להתאפק לכל הנצבים.<\/b> לֹא הָיָה יָכוֹל לִסְבֹּל שֶׁיִּהְיוּ מִצְרִים נִצָּבִים עָלָיו וְשׁוֹמְעִין שֶׁאֶחָיו מִתְבַּיְּשִׁין בְּהִוָּדְעוֹ לָהֶם:", "rashi_en": "ולא יכל יוסף להתאפק לכל הנצבים AND JOSEPH COULD NOT REFRAIN HIMSELF BEFORE ALL THEM THAT STOOD — He could not bear that the Egyptians should stand by him witnessing how his brothers would be put to shame when he made himself known to them. "}, {"ch": 45, "v": 2, "aliyah": 2, "heb": "וַיִּתֵּ֥ן אֶת־קֹל֖וֹ בִּבְכִ֑י וַיִּשְׁמְע֣וּ מִצְרַ֔יִם וַיִּשְׁמַ֖ע בֵּ֥ית פַּרְעֹֽה׃", "onk": "וִיהַב יָת קָלֵיהּ בִּבְכִיתָא וּשְׁמָעוּ מִצְרַיִם וּשְׁמַע <b>אֱנַשׁ<\/b> בֵּית פַּרְעֹה:", "onk_en": "He wept aloud, and the Egyptians heard about it, and the [<b>people of the<\/b>] house of Pharaoh [also] heard.", "pj": "וַאֲרֵים יַת קָלֵיהּ בִּבְכוּתָא וּשְׁמָעוּ מִצְרָאֵי וּשְׁמַע אֵינַשׁ בֵּית פַּרְעה", "pj_en": "And he lifted up his voice with weeping; and the Mizraee heard, and a man of the house of Pharoh heard.", "tj": "", "tj_en": "", "rashi": "<b>וישמע בית פרעה.<\/b> בֵּיתוֹ שֶׁל פַּרְעֹה, כְּלוֹמַר, עֲבָדָיו וּבְנֵי בֵיתוֹ, וְאֵין זֶה לְשׁוֹן בַּיִת מַמָּשׁ, אֶלָּא כְמוֹ בֵּית יִשְׂרָאֵל, בֵּית יְהוּדָה, מישנ\"דה בְּלַעַז:", "rashi_en": "וישמע בית פרעה AND THE HOUSE OF PHARAOH HEARD IT — The house of Pharaoh means his servants and the members of his household. בית here does not mean an actual house (so that the words would mean “and one heard it in the house of Pharaoh; cf. 5:16), but it is similar to (1 Kings 12:21) בית ישראל “the house of Israel”, or בית יהודה the house of Judah”, meaning the people of Judah. old French maisniede English all the inmates of a house. "}, {"ch": 45, "v": 3, "aliyah": 2, "heb": "וַיֹּ֨אמֶר יוֹסֵ֤ף אֶל־אֶחָיו֙ אֲנִ֣י יוֹסֵ֔ף הַע֥וֹד אָבִ֖י חָ֑י וְלֹֽא־יָכְל֤וּ אֶחָיו֙ לַעֲנ֣וֹת אֹת֔וֹ כִּ֥י נִבְהֲל֖וּ מִפָּנָֽיו׃", "onk": "וַאֲמַר יוֹסֵף לַאֲחוֹהִי אֲנָא יוֹסֵף הַעַד כְּעַן אַבָּא קַיָּם וְלָא יָכִילוּ אֲחוֹהִי לַאֲתָבָא יָתֵיהּ פִּתְגָּם אֲרֵי אִתְבְּהִילוּ מִן קֳדָמוֹהִי:", "onk_en": "Yoseif said to his brothers, I am Yoseif, is my father still alive? His brothers could not answer [<b>a word to<\/b>] him for they were shocked at his presence.", "pj": "וַאֲמַר יוֹסֵף לְאָחוֹי אֲנָא הוּא יוֹסֵף הַעוֹד כְּדוֹן אַבָּא קַיֵים וְלָא יָכִילוּ אָחוֹי לְאַתָבָא לֵיהּ פִּתְגַם אֲרוּם אִתְבְּהִילוּ מִן קֳדָמוֹי", "pj_en": "And Joseph said to his brothers, I am Joseph ! Is my father yet alive ? But his brothers could not answer him a word; for they were troubled before him.", "tj": "", "tj_en": "", "rashi": "<b>נבהלו מפניו.<\/b> מִפְּנֵי הַבּוּשָׁה:", "rashi_en": "נבהלו מפניו [FOR] THEY WERE AMAZED AT HIS PRESENCE — out of shame. "}, {"ch": 45, "v": 4, "aliyah": 2, "heb": "וַיֹּ֨אמֶר יוֹסֵ֧ף אֶל־אֶחָ֛יו גְּשׁוּ־נָ֥א אֵלַ֖י וַיִּגָּ֑שׁוּ וַיֹּ֗אמֶר אֲנִי֙ יוֹסֵ֣ף אֲחִיכֶ֔ם אֲשֶׁר־מְכַרְתֶּ֥ם אֹתִ֖י מִצְרָֽיְמָה׃", "onk": "וַאֲמַר יוֹסֵף לַאֲחוֹהִי קְרִיבוּ כְעַן לְוָתִי וּקְרִיבוּ וַאֲמַר אֲנָא יוֹסֵף אֲחוּכוֹן דִּי זַבִּנְתּוּן יָתִי לְמִצְרָיִם:", "onk_en": "[Then] Yoseif said to his brothers, Please [<b>Now<\/b>] come close to me. They came close [to him] and he said, I am Yoseif your brother, whom you sold into Egypt.", "pj": "וַאֲמַר יוֹסֵף לְאָחוֹי קְרִיבוּ בְּבָעוּ לְוָתִי וְחָמוּן גְזֵירַת מְהוּלְתִּי וּקְרִיבוּ וַאֲמַר אֲנָא יוֹסֵף אֲחוּכוֹן דִי זַבִּינְתּוּן יָתִי לְמִצְרָיִם", "pj_en": "And Joseph said to his brothers, Come near, I pray, and examine me. And they came near. And he said to them, I am Joseph your brother, whom you sold into Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>גשו נא אלי.<\/b> רָאָה אוֹתָם נְסוֹגִים לְאָחוֹר, אָמַר עַכְשָׁו אַחַי נִכְלָמִים, קָרָא לָהֶם בְּלָשׁוֹן רַכָּה וְתַחֲנוּנִים, וְהֶרְאָה לָהֶם שֶׁהוּא מָהוּל (בראשית רבה):", "rashi_en": "גשו נא אלי STEP NEAR TO ME, I PRAY YOU — He saw that they recoiled and he said to himself “Now my brothers feel ashamed”. He therefore called to them and showed them that he was circumcised. (Genesis Rabbah 93:10). "}, {"ch": 45, "v": 5, "aliyah": 2, "heb": "וְעַתָּ֣ה&thinsp;<b>׀<\/b> אַל־תֵּעָ֣צְב֗וּ וְאַל־יִ֙חַר֙ בְּעֵ֣ינֵיכֶ֔ם כִּֽי־מְכַרְתֶּ֥ם אֹתִ֖י הֵ֑נָּה כִּ֣י לְמִֽחְיָ֔ה שְׁלָחַ֥נִי אֱלֹהִ֖ים לִפְנֵיכֶֽם׃", "onk": "וּכְעַן לָא תִתְּנְסוּן וְלָא יִתְקָף בְּעֵינֵיכוֹן אֲרֵי זַבִּנְתּוּן יָתִי הָכָא אֲרֵי לְקַיָּמָא שַׁלְּחַנִי יְיָ קֳדָמֵיכוֹן:", "onk_en": "Now do not worry, and do not be angry with yourselves that you sold me here; for it was to preserve life that Elohim sent me [here] before you.", "pj": "וּכְדוּן לָא תִתְנַסְסוּן וְלָא יִתְקוֹף בְּעֵינֵיכוֹן אֲרוּם זַבִּינְתּוּן יָתִי הַלְכָא אֲרוּם לְקַיְימָא יַתְכוֹן שַׁדְרַנִי יְיָ קֳדָמֵיכוֹן", "pj_en": "Now, therefore, be not grieved, nor consider it a hard thing that you sold me hither; for the Lord sent me hither before you to preserve you.", "tj": "", "tj_en": "", "rashi": "<b>למחיה.<\/b> לִהְיוֹת לָכֶם לְמִחְיָה:", "rashi_en": "למחיה FOR THE PRESERVATION OF LIFE — i.e. that I may be to you for a preservation of life. "}, {"ch": 45, "v": 6, "aliyah": 2, "heb": "כִּי־זֶ֛ה שְׁנָתַ֥יִם הָרָעָ֖ב בְּקֶ֣רֶב הָאָ֑רֶץ וְעוֹד֙ חָמֵ֣שׁ שָׁנִ֔ים אֲשֶׁ֥ר אֵין־חָרִ֖ישׁ וְקָצִֽיר׃", "onk": "אֲרֵי דְנַן תַּרְתֵּין שְׁנִין כַּפְנָא בְּגוֹ אַרְעָא וְעוֹד חָמֵשׁ שְׁנִין דִּי לֵית <b>זְרוֹעָא<\/b> וַחֲצָדָא:", "onk_en": "For it is [now] two years that there has been famine in the land; and for another five years there will be no plowing [<b>sowing<\/b>] or harvest.", "pj": "אֲרוּם דֵין תַּרְתֵּין שְׁנִין כַּפְנָא בְּגוֹ אַרְעָא וְעוֹד חֲמֵשׁ שְׁנִין דְלָא רַדְיַין וְלָא חַצְדִין", "pj_en": "For these two years hath the famine been in the midst of the land, and there are yet five years in which there will be neither ploughing nor harvest.", "tj": "", "tj_en": "", "rashi": "<b>כי זה שנתים הרעב.<\/b> עָבְרוּ מִשְּׁנֵי הָרָעָב:", "rashi_en": "כי זה שנתים הרעב means FOR THESE TWO YEARS OF FAMINE have passed of the years of famine that are to come in the land. "}, {"ch": 45, "v": 7, "aliyah": 2, "heb": "וַיִּשְׁלָחֵ֤נִי אֱלֹהִים֙ לִפְנֵיכֶ֔ם לָשׂ֥וּם לָכֶ֛ם שְׁאֵרִ֖ית בָּאָ֑רֶץ וּלְהַחֲי֣וֹת לָכֶ֔ם לִפְלֵיטָ֖ה גְּדֹלָֽה׃", "onk": "וְשַׁלְּחַנִי יְיָ קֳדָמֵיכוֹן לְשַׁוָּאָה לְכוֹן שְׁאָרָא בְּאַרְעָא וּלְקַיָּמָא לְכוֹן לְשֵׁיזָבָא רַבָּא:", "onk_en": "Elohim sent me [here] before you to insure your survival in the land, and to keep you alive for a great deliverance.", "pj": "וְשַׁדְרַנִי יְיָ קֳדָמֵיכוֹן לְשַׁוָאָה לְכוֹן שִׁיוֹרָא בְּאַרְעָא וּלְקַיְימָא לְכוֹן לְשֵׁיזְבָא רַבָּא", "pj_en": "But the Lord sent me before you to set you a remnant in the land, and to preserve you by a great deliverance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 8, "aliyah": 3, "heb": "וְעַתָּ֗ה לֹֽא־אַתֶּ֞ם שְׁלַחְתֶּ֤ם אֹתִי֙ הֵ֔נָּה כִּ֖י הָאֱלֹהִ֑ים וַיְשִׂימֵ֨נִֽי לְאָ֜ב לְפַרְעֹ֗ה וּלְאָדוֹן֙ לְכׇל־בֵּית֔וֹ וּמֹשֵׁ֖ל בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וּכְעַן לָא אַתּוּן שְׁלַחְתּוּן יָתִי הָכָא אֶלָּהֵן <b>מִן קֳדָם<\/b> יְיָ וְשַׁוְּיַנִי לְאַבָּא לְפַרְעֹה וּלְרִבּוֹן לְכָל <b>אֱנַשׁ<\/b> בֵּיתֵיהּ וְשַׁלִּיט בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "Now [then] it was not you that sent me here, but [<b>it was from before<\/b>] Elohim; and He has made me as a father to Pharaoh, and master of all [<b>the people of<\/b>] his house, and ruler over all the land of Egypt.", "pj": "וּכְדוֹן לָא אַתּוּן שְׁדַרְתּוּן יָתִי הַלְכָא אֱלָהֵן מִן קֳדָם יְיָ אִסְתַּקֵף פִּתְגָמָא וְשַׁוְיַינִי לְרַב לְפַרְעה וּלְרַב עַל כָּל בֵּיתֵיהּ וְשַׁלִיט בְּכָל אַרְעָא דְמִצְרָיִם", "pj_en": "And now, it was not you who sent me hither, but it was from before the Lord that the thing was occasioned, that He might set me for a prince unto Pharoh, a chief over his house, and a ruler in all the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>לאב.<\/b> לְחָבֵר וּלְפַטְרוֹן:", "rashi_en": "לאב A FATHER — he made me his colleague and he bestowed on me the dignity of “Father of the king.” "}, {"ch": 45, "v": 9, "aliyah": 3, "heb": "מַהֲרוּ֮ וַעֲל֣וּ אֶל־אָבִי֒ וַאֲמַרְתֶּ֣ם אֵלָ֗יו כֹּ֤ה אָמַר֙ בִּנְךָ֣ יוֹסֵ֔ף שָׂמַ֧נִי אֱלֹהִ֛ים לְאָד֖וֹן לְכׇל־מִצְרָ֑יִם רְדָ֥ה אֵלַ֖י אַֽל־תַּעֲמֹֽד׃", "onk": "אוֹחוּ וּסְקוֹ לְוַת אַבָּא וְתֵימְרוּן לֵיהּ כִּדְנַן אֲמַר בְּרָךְ יוֹסֵף שַׁוְּיַנִי יְיָ לְרִבּוֹן לְכָל מִצְרָיִם חוּת לְוָתִי לָא תִתְעַכָּב:", "onk_en": "Hurry, go up to my father and tell him: this is what your son, Yoseif, says, Elohim has made me master of all Egypt. Come down to me, do not delay.", "pj": "אוֹחוּ וּסְקוּ לְוַת אַבָּא וְתֵימְרוּן לֵיהּ כִּדְנַן אָמַר בְּרָךְ יוֹסֵף שַׁוְויַינִי יְיָ לְרַב לְכָל מִצְרָאֵי חוֹת לְוָתִי לָא תִתְעַכָּב", "pj_en": "Make haste, and go up to my father, and say to him, Thus saith thy son Joseph, The Lord hath set me for a chief over all the Mizraee; come down to me, delay not,", "tj": "", "tj_en": "", "rashi": "<b>ועלו אל אבי.<\/b> אֶרֶץ יִשְׂרָאֵל גְּבוֹהָה מִכָּל הָאֲרָצוֹת:", "rashi_en": "ועלו אל אבי AND GO UP TO MY FATHER — he said “go up” because the land of Israel is situated higher than all the neighbouring countries (Kiddushin 69a). "}, {"ch": 45, "v": 10, "aliyah": 3, "heb": "וְיָשַׁבְתָּ֣ בְאֶֽרֶץ־גֹּ֗שֶׁן וְהָיִ֤יתָ קָרוֹב֙ אֵלַ֔י אַתָּ֕ה וּבָנֶ֖יךָ וּבְנֵ֣י בָנֶ֑יךָ וְצֹאנְךָ֥ וּבְקָרְךָ֖ וְכׇל־אֲשֶׁר־לָֽךְ׃", "onk": "וְתֵתֵיב בְּאַרְעָא דְגשֶׁן וּתְהֵי קָרִיב לִי אַתְּ וּבְנָךְ וּבְנֵי בְנָךְ וְעָנָךְ וְתוֹרָךְ וְכָל דִּי לָךְ:", "onk_en": "You will dwell in the land of Goshen, and you will be close to me—you, your children, your grandchildren, your sheep, your cattle and all that you own.", "pj": "וְתִתֵּיב בְּאַרְעָא דְגשֶׁן וּתְהֵי קָרִיב לְוָתִי אַנְתְּ וּבְנָךְ וּבְנֵי בְנָךְ וְעָנָךְ וְתוֹרָךְ וְכָל דִילָךְ", "pj_en": "and thou shalt dwell in the land of Goshen, and be near me, thou, and thy sons, and thy sons' children, thy sheep, thy oxen, and all that thou hast.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 11, "aliyah": 3, "heb": "וְכִלְכַּלְתִּ֤י אֹֽתְךָ֙ שָׁ֔ם כִּי־ע֛וֹד חָמֵ֥שׁ שָׁנִ֖ים רָעָ֑ב פֶּן־תִּוָּרֵ֛שׁ אַתָּ֥ה וּבֵֽיתְךָ֖ וְכׇל־אֲשֶׁר־לָֽךְ׃", "onk": "וְאֵזוּן יָתָךְ תַּמָּן אֲרֵי עוֹד חֲמֵשׁ שְׁנִין כַּפְנָא דִּלְמָא תִתְמַסְכַּן אַתְּ <b>וֶאֱנַשׁ<\/b> בֵּיתָךְ וְכָל דִּי לָךְ:", "onk_en": "I will provide for you there, since there will be another five years of famine; lest you become impoverished together with [<b>the people of<\/b>] your household and all that is yours.", "pj": "וְאֵיזוֹן יָתָךְ תַּמָן אֲרוּם עַד כְּדוֹן חָמֵשׁ שְׁנִין כַּפְנָא דִילְמָא תִתְמַסְכַּן אַנְתְּ וֶאֱנַשׁ בֵּיתָךְ וְכָל דִילָךְ", "pj_en": "And I will sustain you there, for there are yet five years of famine, lest thou and the men of thy house, and all that thou hast be wasted away.", "tj": "", "tj_en": "", "rashi": "<b>פן תורש.<\/b> דִּלְמָא תִּתְמַסְכַּן, לְשׁוֹן מוֹרִישׁ וּמַעֲשִׁיר:", "rashi_en": "פן תורש — The Targum renders this by דלמא תתמסכן LEST THOU BE IMPOVERISHED, for the verb is of the same root as we find in (1 Samuel 2:7) “The Lord maketh poor (מוריש) and maketh rich”. "}, {"ch": 45, "v": 12, "aliyah": 3, "heb": "וְהִנֵּ֤ה עֵֽינֵיכֶם֙ רֹא֔וֹת וְעֵינֵ֖י אָחִ֣י בִנְיָמִ֑ין כִּי־פִ֖י הַֽמְדַבֵּ֥ר אֲלֵיכֶֽם׃", "onk": "וְהָא עֵינֵיכוֹן חֲזָן וְעֵינֵי אָחִי בִנְיָמִין אֲרֵי <b>בְלִישָׁנְכוֹן<\/b> אֲנָא מְמַלֵּל עִמְּכוֹן:", "onk_en": "Behold, your eyes see it along with my brother Binyomin’s eyes, that I speak to you with my own mouth [<b>in your language<\/b>].", "pj": "וְהָא עֵינֵיכוֹן חַמְיָין וְעֵינֵי אָחִי בִּנְיָמִין אֲרוּם פּוּמִי בְּלִישַׁן בֵּית קוּדְשָׁא מְמַלֵל עִמְכוֹן", "pj_en": "And, behold, your eyes see, and the eyes of my brother Benjamin, that my mouth speaketh with you in the language of the house of holiness.", "tj": "", "tj_en": "", "rashi": "<b>והנה עיניכם ראות.<\/b> בִּכְבוֹדִי, וְשֶׁאֲנִי אֲחִיכֶם שֶׁאֲנִי מָהוּל כָּכֶם, וְעוֹד, <b>כי פי המדבר אליכם<\/b> בִּלְשׁוֹן הַקֹּדֶשׁ (בראשית רבה):<br><br><b>ועיני אחי בנימין.<\/b> הִשְׁוָה אֶת כֻּלָּם יַחַד לוֹמַר, שֶׁכְּשֵׁם שֶׁאֵין לִי שִׂנְאָה עַל בִּנְיָמִין אָחִי, שֶׁהֲרֵי לֹא הָיָה בִמְכִירָתִי, כָּךְ אֵין בְּלִבִּי שִׂנְאָה עֲלֵיכֶם:", "rashi_en": "והנה עיניכם ראות AND, BEHOLD, YOUR EYES SEE my glory, and that I am your brother, and further כי פי המדבר אליכם THAT IT IS MY MOUTH THAT SPEAKETH TO YOU in the Holy Language) (Genesis Rabbah 93:10).<br><br>ועיני אחי בנימין [YOUR EYES] AND THE EYES OF MY BROTHER BENJAMIN — he mentions them separately and alike to imply: just as I harbour no hatred against Benjamin, my brother, for he was no party to selling me, so is my heart free from hatred against you (Megillah 16b). "}, {"ch": 45, "v": 13, "aliyah": 3, "heb": "וְהִגַּדְתֶּ֣ם לְאָבִ֗י אֶת־כׇּל־כְּבוֹדִי֙ בְּמִצְרַ֔יִם וְאֵ֖ת כׇּל־אֲשֶׁ֣ר רְאִיתֶ֑ם וּמִֽהַרְתֶּ֛ם וְהוֹרַדְתֶּ֥ם אֶת־אָבִ֖י הֵֽנָּה׃", "onk": "וּתְחַוּוּן לְאַבָּא יָת כָּל יְקָרִי בְּמִצְרַיִם וְיָת כָּל דִּי חֲזֵיתוּן וְתוֹחוּן וְתַחֲתוּן יָת אַבָּא הָכָא:", "onk_en": "Tell my father of all my honor in Egypt, and all that you saw. Hurry and bring my father down here.", "pj": "וּתְחַווּן לְאַבָּא יַת כָּל אִיקַר דְאִית לִי בְּמִצְרַיִם וְיַת כָּל רְבוּתִי דְחַמִיתוּן וְתוֹחְתוּן יַת אַבָּא הַלְכָא", "pj_en": "And you must show my father all the honour I have in Mizraim, and all my greatness which you see, and hasten my father hither.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 14, "aliyah": 3, "heb": "וַיִּפֹּ֛ל עַל־צַוְּארֵ֥י בִנְיָֽמִן־אָחִ֖יו וַיֵּ֑בְךְּ וּבִ֨נְיָמִ֔ן בָּכָ֖ה עַל־צַוָּארָֽיו׃", "onk": "וּנְפַל עַל צַוְּארֵי בִנְיָמִן אֲחוּהִי וּבְכָא וּבִנְיָמִן בְּכָא עַל צַוְּארֵיהּ:", "onk_en": "He [then] fell upon his brother Binyomin’s neck and wept, and Binyomin wept upon his neck.", "pj": "וְאִתְרְכִין עַל פְּרִיקַת צַוְורוֹי דְבִנְיָמִין אָחוֹי וּבְכָא דְעָתִיד בֵּית מוּקְדְשָׁא לְמֶהֱוֵי מִתְבְּנֵי בְּחוּלְקֵיהּ דְבִנְיָמִין וְעָתִיד לְמֶחְרוֹב תַּרְתֵּין זִמְנִין וּבִנְיָמִין בָּכָא עַל פְּרִיקַת צַוְורֵיהּ דְיוֹסֵף דְחָמָא מַשְׁכְּנָא דְשִׁילֹה דְעָתִיד לְמֶהֱוֵי בְּחוּלְקֵיהּ דְיוֹסֵף וְעָתִיד לְמֶחֱרָב", "pj_en": "And he bowed himself upon his brother Benjamin's neck, and wept; because it would be that the house of holiness should be builded in the portion of Benjamin, and be twice destroyed: and Benjamin wept upon Joseph's neck, because he saw that the tabernacle of Shiloh would be in the portion of Joseph and be destroyed.", "tj": "", "tj_en": "", "rashi": "<b>ויפל על צוארי בנימין אחיו ויבך.<\/b> עַל שְׁנֵי מִקְדָּשׁוֹת שֶׁעֲתִידִין לִהְיוֹת בְּחֶלְקוֹ שֶׁל בִּנְיָמִין וְסוֹפָן לֵחָרֵב:<br><br><b>ובנימין בכה על צואריו.<\/b> עַל מִשְׁכַּן שִׁילֹה שֶׁעָתִיד לִהְיוֹת בְּחֶלְקוֹ שֶׁל יוֹסֵף וְסוֹפוֹ לֵחָרֵב (שם):", "rashi_en": "ויפל על צוארי בנימן אחיו ויבך AND HE FELL UPON HIS BROTHER BENJAMIN’S NECK AND WEPT — for the Temples which were to be in Benjamin’s territory and which would ultimately be laid in ruins (Genesis Rabbah 93:12).<br><br>ובנימין בכה על צואריו AND BENJAMIN WEPT ON HIS NECK — for the Tabernacle of Shiloh which was to be in Joseph’s territory and which would ultimately be laid in ruins (Genesis Rabbah 93:12)."}, {"ch": 45, "v": 15, "aliyah": 3, "heb": "וַיְנַשֵּׁ֥ק לְכׇל־אֶחָ֖יו וַיֵּ֣בְךְּ עֲלֵהֶ֑ם וְאַ֣חֲרֵי כֵ֔ן דִּבְּר֥וּ אֶחָ֖יו אִתּֽוֹ׃", "onk": "וּנְשַׁק לְכָל אֲחוֹהִי וּבְכָא עֲלֵיהוֹן וּבָתַר כֵּן מַלִּילוּ אֲחוֹהִי עִמֵּיהּ:", "onk_en": "He kissed all his brothers and wept upon [their necks]. After that his brothers spoke with him.", "pj": "וּנְשֵׁיק לְכָל אָחוֹי וּבְכָא עֲלֵיהוֹן דְחָמָא דְמִשְׁתַּעַבְּדִין לְבֵינֵי עַמְמַיָא וּמִן בָּתַר כְּדֵין מַלִילוּ אָחוֹי עִמֵיהּ", "pj_en": "And he kissed all his brethren, and wept over them, because he saw that the sons of his people would be brought into bondage. And afterward his brethren discoursed with him.", "tj": "", "tj_en": "", "rashi": "<b>ואחרי כן.<\/b> מֵאַחַר שֶׁרָאוּהוּ בוֹכֶה וְלִבּוֹ שָׁלֵם עִמָּהֶם <b>דברו אחיו אתו<\/b> שֶׁמִּתְּחִלָּה הָיוּ בוֹשִׁים מִמֶּנּוּ:", "rashi_en": "ואחרי כן AND AFTER THAT — after they saw that he wept and realized that he was peaceably inclined towards them, דברו אחיו אתו HIS BRETHREN SPAKE WITH HIM — For at first they felt abashed before him. "}, {"ch": 45, "v": 16, "aliyah": 3, "heb": "וְהַקֹּ֣ל נִשְׁמַ֗ע בֵּ֤ית פַּרְעֹה֙ לֵאמֹ֔ר בָּ֖אוּ אֲחֵ֣י יוֹסֵ֑ף וַיִּיטַב֙ בְּעֵינֵ֣י פַרְעֹ֔ה וּבְעֵינֵ֖י עֲבָדָֽיו׃", "onk": "וְקָלָא אִשְׁתְּמַע לְבֵית פַּרְעֹה לְמֵימַר עַלּוּ אֲחֵי יוֹסֵף וּשְׁפַר בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עַבְדּוֹהִי:", "onk_en": "The news was heard in Pharaoh’s house that Yoseif’s brothers had come. This was good [news] in the eyes of Pharaoh and in the eyes of his servants.", "pj": "וְקָלָא אִשְׁתְּמַע בֵּית מַלְכוּתָא דְפַרְעה לְמֵימַר אָתוֹ אֲחֵי יוֹסֵף וּשְׁפַר פִּתְגָמָא בְּעֵינֵי פַּרְעה וּבְעֵינֵי עַבְדוֹי", "pj_en": "And a voice was heard in the royal house of Pharoh, saying, The brothers of Joseph are come. And the thing was pleasing in the eyes of Pharoh, and in the eyes of his servants.", "tj": "", "tj_en": "", "rashi": "<b>והקל נשמע בית פרעה.<\/b> כְּמוֹ בְּבֵית פַּרְעֹה, וְזֶהוּ לְשׁוֹן בַּיִת מַמָּשׁ:", "rashi_en": "והקל נשמע בית פרעה AND THE FAME THEREOF WAS HEARD IN PHARAOH’S HOUSE — It is the same as בבית, in the house of Pharaoh and here it denotes the actual house (cp. 45:2). "}, {"ch": 45, "v": 17, "aliyah": 3, "heb": "וַיֹּ֤אמֶר פַּרְעֹה֙ אֶל־יוֹסֵ֔ף אֱמֹ֥ר אֶל־אַחֶ֖יךָ זֹ֣את עֲשׂ֑וּ טַֽעֲנוּ֙ אֶת־בְּעִ֣ירְכֶ֔ם וּלְכוּ־בֹ֖אוּ אַ֥רְצָה כְּנָֽעַן׃", "onk": "וַאֲמַר פַּרְעֹה לְיוֹסֵף אֱמַר לְאַחָיךְ דָּא עִיבִידוּ טְעוּנוּ יָת בְּעִירְכוֹן וֶאֱזִילוּ <b>אוֹבִילוּ<\/b> לְאַרְעָא דִכְנָעַן:", "onk_en": "Pharaoh said to Yoseif, Tell your brothers to do this: load up your beasts, and go and enter [<b>bring to<\/b>] the land of Canaan.", "pj": "וַאֲמַר פַּרְעה לְיוֹסֵף אֵימַר לְאָחָךְ דָא עִיבִידוּ טְעִינוּ יַת בְּעִירְכוֹן וְטַיְילוּ אוֹבִילוּ לְאַרְעָא דִכְנָעַן", "pj_en": "And he said to Joseph, Tell thy brethren, Do this. Lade your beasts, and go, carry into the land of Kenaan;", "tj": "", "tj_en": "", "rashi": "<b>טענו את בעירכם.<\/b> תְּבוּאָה:", "rashi_en": "טענו את בעירכם LADE YOUR BEASTS — with grain. "}, {"ch": 45, "v": 18, "aliyah": 3, "heb": "וּקְח֧וּ אֶת־אֲבִיכֶ֛ם וְאֶת־בָּתֵּיכֶ֖ם וּבֹ֣אוּ אֵלָ֑י וְאֶתְּנָ֣ה לָכֶ֗ם אֶת־טוּב֙ אֶ֣רֶץ מִצְרַ֔יִם וְאִכְל֖וּ אֶת־חֵ֥לֶב הָאָֽרֶץ׃", "onk": "וּדְבָרוּ יָת אֲבוּכוֹן וְיָת <b>אֱנַשׁ<\/b> בָּתֵּיכוֹן וְעוּלוּ לְוָתִי וְאֶתֵּן לְכוֹן יָת טוּב אַרְעָא דְמִצְרַיִם וְתֵיכְלוּן יָת טוּבָא דְאַרְעָא:", "onk_en": "Bring your father and [<b>the people of<\/b>] your households and come to me; and I will give you the best of the land of Egypt. You will eat of the fat of the land.", "pj": "וּדְבָרוּ יַת אֲבוּכוֹן וְיַת אֵינַשׁ בָּתֵּיכוֹן וְאַיְיתוּ לְוָתִי וְאֵיתַּן לְכוֹן יַת שְׁפַר אֲרַג אַרְעָא דְמִצְרַיִם וְתֵיכְלוּן יַת שַׁמְנוּנִיתָא דְאַרְעָא", "pj_en": "and take your father and the men of your house, and come to me, and I will give you the best of what is desirable in the land of Mizraim, and you shall eat the fat of the land.", "tj": "", "tj_en": "", "rashi": "<b>את טוב ארץ מצרים.<\/b> אֶרֶץ גֹּשֶׁן, נִבָּא וְאֵינוֹ יוֹדֵעַ מַה נִּבָּא, סוֹפָם לַעֲשׂוֹתָהּ כִּמְצוּלָה שֶׁאֵין בָּהּ דָּגִים:<br><br><b>חלב הארץ.<\/b> כָּל חֵלֶב לְשׁוֹן מֵיטַב הוּא:", "rashi_en": "את טוב אוץ מצרים THE BEST OF THE LAND OF EGYPT — viz., the district of Goshen. He prophesied without knowing what he was prophesying when he said “I shall give you the best of the land of Egypt”, for ultimately they were to make it like the depths of the sea in which there are no fish (i.e. that they would carry away the best of the land when they would leave Egypt) (Berakhot 9b).<br><br>חלב הארץ THE FAT OF THE LAND — The word חלב always denotes the best part of a thing. "}, {"ch": 45, "v": 19, "aliyah": 4, "heb": "וְאַתָּ֥ה צֻוֵּ֖יתָה זֹ֣את עֲשׂ֑וּ קְחוּ־לָכֶם֩ מֵאֶ֨רֶץ מִצְרַ֜יִם עֲגָל֗וֹת לְטַפְּכֶם֙ וְלִנְשֵׁיכֶ֔ם וּנְשָׂאתֶ֥ם אֶת־אֲבִיכֶ֖ם וּבָאתֶֽם׃", "onk": "וְאַתְּ מְפַקָּדָא דָּא עִיבִידוּ סִיבוּ לְכוֹן מֵאַרְעָא דְמִצְרַיִם עֶגְלָן לְטַפְלֵיכוֹן וְלִנְשֵׁיכוֹן וְתִטְּלוּן יָת אֲבוּכוֹן וְתֵיתוּן:", "onk_en": "Now you are commanded [to order (your) brothers to] do the following: Take wagons from the land of Egypt for your little ones and for your wives. Bring your father and come.", "pj": "וְאַנְתְּ יוֹסֵף מְפַקֵיד בְּאִיקַר אַבָּךְ בְּגִין כֵּן אֵימַר לְאָחָךְ דָא עִיבִידוּ סִיבוּ לְכוֹן מֵאַרְעָא דְמִצְרַיִם סְדָנֵי דְמִינַגְדָן בְּתוֹרְתֵּי לְסוֹבָרָא בְּהוֹן יַת טַפְלֵיכוֹן וְיַת נְשֵׁיכוֹן וְתִיטְלוּן יַת אֲבוּכוֹן וְתֵיתוּן", "pj_en": "And thou Joseph shalt appoint for the honour of thy father: therefore tell thy brethren, Do this. Take with you from the land of Mizraim waggons drawn by oxen, in which to carry your children and your wives, and bring your father, and come.", "tj": "", "tj_en": "", "rashi": "<b>ואתה צויתה.<\/b> מִפִּי, לוֹמַר לָהֶם:<br><br><b>זאת עשו.<\/b> כָּךְ אֱמֹר לָהֶם, שֶׁבִּרְשׁוּתִי הוּא:", "rashi_en": "ואתה צויתה NOW THOU ART COMMANDED — supply the words by me (lit, by my mouth) to say unto them<br><br>זאת עשו THIS DO YE — Thus tell them: that it is done with my permission. "}, {"ch": 45, "v": 20, "aliyah": 4, "heb": "וְעֵ֣ינְכֶ֔ם אַל־תָּחֹ֖ס עַל־כְּלֵיכֶ֑ם כִּי־ט֛וּב כׇּל־אֶ֥רֶץ מִצְרַ֖יִם לָכֶ֥ם הֽוּא׃", "onk": "וְעֵינְכוֹן לָא תְחוּס עַל מָנֵיכוֹן אֲרֵי טַב כָּל אַרְעָא דְמִצְרַיִם דִּלְכוֹן הוּא:", "onk_en": "Do not be concerned with your belongings, for the best of Egypt is yours,", "pj": "וְעֵינֵיכוֹן לָא תֵיחוֹס עַל מָנֵיכוֹן אֲרוּם שְׁפַר אֲרַג כָּל אַרְעָא דְמִצְרַיִם דִילְכוֹן הוּא", "pj_en": "And your eyes must not look wistfully on your utensils: for the best of what is desirable in all the land of Mizraim is yours.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 21, "aliyah": 4, "heb": "וַיַּֽעֲשׂוּ־כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַיִּתֵּ֨ן לָהֶ֥ם יוֹסֵ֛ף עֲגָל֖וֹת עַל־פִּ֣י פַרְעֹ֑ה וַיִּתֵּ֥ן לָהֶ֛ם צֵדָ֖ה לַדָּֽרֶךְ׃", "onk": "וַעֲבָדוּ כֵן בְּנֵי יִשְׂרָאֵל וִיהַב לְהוֹן יוֹסֵף עֶגְלָן עַל מֵימַר פַּרְעֹה וִיהַב לְהוֹן זְוָדִין לְאָרְחָא:", "onk_en": "The sons of Yisrael did so. Yoseif gave them wagons by order of Pharaoh, and he gave them provisions for the journey.", "pj": "וַעֲבָדוּ כֵּן בְּנֵי יִשְרָאֵל וִיהַב לְהוֹם יוֹסֵף סְדָנֵי עַל מֵימְרָא דְפַרְעה וִיהַב לְהוֹן זְוָודִין לְאָרְחָא", "pj_en": "And the sons of Israel did so. And Joseph gave them waggons according to the word of Pharoh, and he furnished them with provision for the way.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 22, "aliyah": 4, "heb": "לְכֻלָּ֥ם נָתַ֛ן לָאִ֖ישׁ חֲלִפ֣וֹת שְׂמָלֹ֑ת וּלְבִנְיָמִ֤ן נָתַן֙ שְׁלֹ֣שׁ מֵא֣וֹת כֶּ֔סֶף וְחָמֵ֖שׁ חֲלִפֹ֥ת שְׂמָלֹֽת׃", "onk": "לְכָלְּהוֹן יְהַב לִגְבַר אִצְטְלַוָּן דִּלְבוּשָׁא וּלְבִנְיָמִן יְהַב תְּלָת מְאָה <b>סִלְעִין דִּ<\/b>כְסַף וַחֲמֵשׁ אִצְטְלַוָּן דִּלְבוּשִׁין:", "onk_en": "To each of them, he gave a change of clothing. To Binyomin he gave three hundred [<b>selaim of<\/b>] silver pieces and five changes of clothing.", "pj": "לְכֻלְהוֹן יְהַב לְגַבְרָא אִסְטְלוֹי דִלְבוּשׁ וּלְבִנְיָמִין יְהַב תְּלַת מְאָה סַלְעִין דִכְסַף וַחֲמֵשׁ אִיסְטוֹלֵי דִלְבוּשִׁין", "pj_en": "And to each of them he gave vestments and apparel; but to Benjamin he gave three hundred shekels of silver, and five vestments for apparel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 23, "aliyah": 4, "heb": "וּלְאָבִ֞יו שָׁלַ֤ח כְּזֹאת֙ עֲשָׂרָ֣ה חֲמֹרִ֔ים נֹשְׂאִ֖ים מִטּ֣וּב מִצְרָ֑יִם וְעֶ֣שֶׂר אֲתֹנֹ֡ת נֹֽ֠שְׂאֹ֠ת בָּ֣ר וָלֶ֧חֶם וּמָז֛וֹן לְאָבִ֖יו לַדָּֽרֶךְ׃", "onk": "וְלַאֲבוּהִי שְׁלַח כְּדָא עַסְרָא חֲמָרִין טְעִינִין מִטּוּבָא דְמִצְרָיִם וַעֲסַר אַתְנָן טְעִינָן <b>עִיבוּר<\/b> וּלְחֵם וּזְוָדִין לַאֲבוּהִי לְאָרְחָא:", "onk_en": "To his father he sent the following: Ten male donkeys loaded with the best of Egypt, and ten female donkeys loaded with grain, bread, and food [<b>provisions<\/b>] for his father for the journey.", "pj": "וּלְאָבוֹי שָׁדַר דוֹרוֹן כְּדֵין עַשְרָא חֲמָרִין טְעִינִין חַמְרָא וּמִטוּבָא דְמִצְרַיִם וְעֶשֶר אַתְנָן טְעִינָן עִיבּוּר וּלְחֵם וּזְוָודִין לְאָבוֹי לְאָרְחָא", "pj_en": "And these presents he sent to his father; ten asses laden with wine and the good things of Mizraim, and ten she asses laden with corn and bread, and provisions for his father's journey.", "tj": "", "tj_en": "", "rashi": "<b>שלח כזאת.<\/b> כַּחֶשְׁבּוֹן הַזֶּה, וּמַהוּ הַחֶשְׁבּוֹן? <b>עשרה חמרים וגו'<\/b>:<br><br><b>מטוב מצרים.<\/b> מָצִינוּ בַתַּלְמוּד שֶׁשָּׁלַח לוֹ יַיִן יָשָׁן שֶׁדַּעַת זְקֵנִים נוֹחָה הֵימֶנּוּ, וּמִדְרַשׁ אַגָּדָה גְּרִיסִין שֶׁל פּוּל:<br><br><b>בר ולחם.<\/b> כְּתַרְגּוּמוֹ:<br><br><b>ומזון.<\/b> לִפְתָּן:", "rashi_en": "שלח כזאת HE SENT AFTER THIS MANNER — according to this amount. And what was the amount? עשרה חמרים וגו׳ ten asses etc (i.e. as much as ten asses could carry).<br><br>מטוב מצרים OF THE BEST THINGS OF EGYPT — We find it stated in the Talmud (Megillah 16b) that he sent him old wine which old people like very much. The Midrash states that he sent him split beans. (Genesis Rabbah 94:2).<br><br>בר ולחם CORN AND BREAD — understand this as the Targum renders it.<br><br>ומזון means things that are eaten together with bread. "}, {"ch": 45, "v": 24, "aliyah": 4, "heb": "וַיְשַׁלַּ֥ח אֶת־אֶחָ֖יו וַיֵּלֵ֑כוּ וַיֹּ֣אמֶר אֲלֵהֶ֔ם אַֽל־תִּרְגְּז֖וּ בַּדָּֽרֶךְ׃", "onk": "וְשַׁלַּח יָת אֲחוֹהִי וַאֲזָלוּ וַאֲמַר לְהוֹן לָא <b>תִתְנַצּוּן<\/b> בְּאָרְחָא:", "onk_en": "He sent his brothers off and they went. He said to them, Do not be troubled [<b>argue<\/b>] along the way.", "pj": "וְשָׁדַר יַת אָחוֹי וְעַיְילוּ וַאֲמַר לְהוֹם לָא תִתְנְצוּן עַל עֵיסַק זַבִּנְתִּי דִלְמָא יִרְגְזוּן בְּכוֹן עָבְרֵי אוֹרְחָא", "pj_en": "And he dismissed his brothers to go, and said to them, Do not contend about my having been sold, lest you quarrel in passing along the way.", "tj": "", "tj_en": "", "rashi": "<b>אל תרגזו בדרך.<\/b> אַל תִּתְעַסְּקוּ בִּדְבַר הֲלָכָה שֶׁלֹּא תִרְגַּז עֲלֵיכֶם הַדֶּרֶךְ, דָּ\"אַ אַל תַּפְסִיעוּ פְסִיעָה גַסָּה וְהִכָּנְסוּ בַחַמָּה לָעִיר; וּלְפִי פְשׁוּטוֹ שֶׁל מִקְרָא יֵשׁ לוֹמַר, לְפִי שֶׁהָיוּ נִכְלָמִים, הָיָה דוֹאֵג, שֶׁמָּא יָרִיבוּ בַדֶּרֶךְ עַל דְּבַר מְכִירָתוֹ, לְהִתְוַכֵּחַ זֶה עִם זֶה וְלוֹמַר עַל יָדְךָ נִמְכַּר, אַתָּה סִפַּרְתָּ לָשׁוֹן הָרָע עָלָיו, וְגָרַמְתָּ לָנוּ לִשְׂנֹאתוֹ:", "rashi_en": "אל תרגזו בדרך BE NOT AGITATED BY THE WAY — Do not busy yourselves with Halachic discussions lest the road become unsteady for you (i.e. lest you lose your way). Another explanation is: Do not take very long steps and enter the town where you will stay over night while the sun is still shining (Taanit 10b). According to the plain sense of the verse, however, it must be explained thus: Because they felt ashamed he feared that they might quarrel on the way about his having been sold, arguing one with another. One would say: “It was through you he was sold”. Another: “It was you who made slanderous statements about him and caused us to hate him”. "}, {"ch": 45, "v": 25, "aliyah": 4, "heb": "וַֽיַּעֲל֖וּ מִמִּצְרָ֑יִם וַיָּבֹ֙אוּ֙ אֶ֣רֶץ כְּנַ֔עַן אֶֽל־יַעֲקֹ֖ב אֲבִיהֶֽם׃", "onk": "וּסְלִיקוּ מִמִּצְרָיִם וַאֲתוֹ לְאַרְעָא דִכְנַעַן לְוַת יַעֲקֹב אֲבוּהוֹן:", "onk_en": "They went up from Egypt, and they came to the land of Canaan, to their father Yaakov.", "pj": "וּסְלִיקוּ מִמִצְרַיִם וְאָתוֹ לְאַרְעָא דִכְנָעַן לְוַת יַעֲקב אֲבוּהוֹן", "pj_en": "And they went up from Mizraim, and came to the land of Kenaan unto Jakob their father.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 45, "v": 26, "aliyah": 4, "heb": "וַיַּגִּ֨דוּ ל֜וֹ לֵאמֹ֗ר ע֚וֹד יוֹסֵ֣ף חַ֔י וְכִֽי־ה֥וּא מֹשֵׁ֖ל בְּכׇל־אֶ֣רֶץ מִצְרָ֑יִם וַיָּ֣פׇג לִבּ֔וֹ כִּ֥י לֹא־הֶאֱמִ֖ין לָהֶֽם׃", "onk": "וְחַוִּיאוּ לֵיהּ לְמֵימַר עוֹד כְּעַן יוֹסֵף קַיָּם וַאֲרֵי הוּא שַׁלִּיט בְּכָל אַרְעָא דְמִצְרָיִם <b>וַהֲווֹ מִלַּיָּא פָּיְגָן עַל לִבֵּיהּ<\/b> אֲרֵי לָא הֵימִין לְהוֹן:", "onk_en": "They told him saying, Yoseif is still alive, and he is ruler of all the land of Egypt. His [Yaakov’s] heart stood still [<b>The words created uncertainty in his heart<\/b>], for he could not believe them.", "pj": "וְתַנִיאוּ לֵיהּ לְמֵימָר עַד כְּדוֹן יוֹסֵף קַיֵים וַאֲרוּם הוּא שַׁלִיט בְּכָל אַרְעָא דְמִצְרַיִם וּפְלֵיג לִבֵּיהּ אֲרוּם לָא הֵימִין לְהוֹם", "pj_en": "And they declared to him, saying, Joseph is yet alive, and is ruler over all the land of Mizraim. But his heart was divided, because he did not believe them.", "tj": "וְאֵפְלַג לִבֵּיהּ:", "tj_en": "And his heart was divided.", "rashi": "<b>וכי הוא משל.<\/b> וַאֲשֶׁר הוּא מוֹשֵׁל:<br><br><b>ויפג לבו.<\/b> נֶחֱלַף לִבּוֹ וְהָלַךְ מִלְּהַאֲמִין, לֹא הָיָה לִבּוֹ פוֹנֶה אֶל הַדְּבָרִים, לְשׁוֹן מְפִיגִין טַעֲמָן בִּלְשׁוֹן מִשְׁנָה וּכְמוֹ מֵאֵין הֲפֻגוֹת (איכה ג'), וְרֵיחוֹ לֹא נָמָר (ירמיהו מ\"ח), מְתַּרְגְּמִינַן וְרֵיחֵיהּ לָא פָג:", "rashi_en": "וכי הוא משל — the word וכי is used here in the sense of אשר “that”: AND THAT HE WAS RULER.<br><br>ויפג לבו AND JACOB’S HEART CONTINUED COLD — his heart passed away (נחלף) and ceased to believe — his heart took no notice of their words. The word ויפג has the same meaning as (Beitzah 14a) “all spices let their taste pass away (מפיגין)” (i.e. lose their taste) in Mishnaic Hebrew. Similar is (Lamentations 3:49) “without (הפגות) intermission”. The words (Jeremiah 48:11) “and his scent is not changed (נמר)” is rendered in the Targum by “and his scent has not את כל דברי יוסף."}, {"ch": 45, "v": 27, "aliyah": 4, "heb": "וַיְדַבְּר֣וּ אֵלָ֗יו אֵ֣ת כׇּל־דִּבְרֵ֤י יוֹסֵף֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֲלֵהֶ֔ם וַיַּרְא֙ אֶת־הָ֣עֲגָל֔וֹת אֲשֶׁר־שָׁלַ֥ח יוֹסֵ֖ף לָשֵׂ֣את אֹת֑וֹ וַתְּחִ֕י ר֖וּחַ יַעֲקֹ֥ב אֲבִיהֶֽם׃", "onk": "וּמַלִּילוּ עִמֵּיהּ יָת כָּל פִּתְגָּמֵי יוֹסֵף דִּי מַלִּיל עִמְּהוֹן וַחֲזָא יָת עֲגַלָּתָא דִּשְׁלַח יוֹסֵף לְמִטַּל יָתֵיהּ וּשְׁרַת רוּחַ <b>נְבוּאָה לְוַת<\/b> יַעֲקֹב אֲבוּהוֹן:", "onk_en": "They told him all the words of Yoseif which he had spoken to them, and he saw the wagons that Yoseif had sent to carry him. [Then] the spirit of [<b>prophecy rested upon<\/b>] their father Yaakov was revived.", "pj": "וּמַלִילוּ עִמֵיהּ יַת כָּל פִּתְגָמֵי יוֹסֵף דְמַלֵיל עִמְהוֹן וַחֲמָא יַת סְדָנַיָיא דְשָׁדַר יוֹסֵף לְמִיטוּל יָתֵיהּ וּשְׁרַת רוּחַ נְבוּאָה דְאִיסְתַּלְקַת מִנֵיהּ בְּעִידַן דְזַבִּינוּ יַת יוֹסֵף וְתָבַת עֲלוֹי יַעֲקב אֲבוּהוֹן", "pj_en": "And they told him all the words of Joseph which he had spoken to them. And when he saw the waggons which Joseph had sent to bring him, the Spirit of Prophecy which had gone up from him at the time that Joseph was sold, returning, rested upon Jakob their father.", "tj": "", "tj_en": "", "rashi": "<b>את כל דברי יוסף.<\/b> סִימָן מָסַר לָהֶם בַּמֶּה הָיָה עוֹסֵק כְּשֶׁפֵּרֵשׁ מִמֶּנּוּ – בְּפָרָשַׁת עֶגְלָה עֲרוּפָה, זֶהוּ שֶׁנֶּאֱמַר <b>וירא את העגלות אשר שלח יוסף<\/b>, וְלֹא נֶאֱמַר אֲשֶׁר שָׁלַח פַּרְעֹה:<br><br><b>ותחי רוח יעקב.<\/b> שָׁרְתָה עָלָיו שְׁכִינָה, שֶׁפֵּרְשָׁה מִמֶּנּוּ:", "rashi_en": ".(פג ALL THE WORDS OF JOSEPH — As evidence that it was Joseph who was sending this message he had informed them of the religious subject he had been studying with his father at the time when he left him, viz., the section of the Heifer (עגלה) that had its neck broken (Deuteronomy 21:6). It is to this that Scripture refers in the words “And he saw (i.e comprehended the meaning of) the עגלות (here to be taken in sense of Heifer) which Joseph had sent — and it does not state “which Pharaoh had sent” (as one would expect if עגלות meant wagons) (Genesis Rabbah 94:3).<br><br>ותחי רוח יעקב THE SPIRIT OF JACOB [THEIR FATHER] REVIVED — The Shechinah that had departed from him, rested again upon him (cf. Onkelos). "}, {"ch": 45, "v": 28, "aliyah": 5, "heb": "וַיֹּ֙אמֶר֙ יִשְׂרָאֵ֔ל רַ֛ב עוֹד־יוֹסֵ֥ף בְּנִ֖י חָ֑י אֵֽלְכָ֥ה וְאֶרְאֶ֖נּוּ בְּטֶ֥רֶם אָמֽוּת׃", "onk": "וַאֲמַר יִשְׂרָאֵל <b>סַגִּי לִי חֶדְוָא<\/b> עַד כְּעַן יוֹסֵף בְּרִי קַיָּם אֱזֵיל וְאֶחֱזִנֵּיהּ עַד לָא אֵמוּת:", "onk_en": "Yisrael said, It is too much [<b>There is great joy for me<\/b>]! My son Yoseif still lives. I will go and see him before I die.", "pj": "וַאֲמַר יִשְרָאֵל סַגְיָן טַבְוָון עָבַד עִמִי יְיָ שֵׁיזְבַנִי מִן יְדוֹי דְעֵשָו וּמִן יְדוֹי דְלָבָן וּמִן יְדוֹי דִכְנַעֲנָאֵי דִרְדָפוּ בַּתְרַאי וְסַגְיָין נַחֲמָן חָמַת וְסָכִיתִי לְמֶחֱמֵי וּלְדָא לָא סָכִית דְעַד כְּדוֹן יוֹסֵף בְּרִי קַיֵים אִיזֵל כְּדוֹן וְאַחֲמִינֵיהּ קֳדָם דְאֵמִית", "pj_en": "And Israel said, Many benefits hath the Lord wrought for me; He delivered me from the hand of Esau and from the hand of Laban, and from the hands of the Kenaanites who pursued me; and many consolations have I seen and have expected to see; but this I had not expected, that Joseph my son should yet be alive. I will go now, and behold him before I die.", "tj": "וַאֲמַר יִשְרָאֵל סַגְיָין טָבָן וְנַחֲמָן סַכְיִית לְמֶחֱמֵי וְהָדָא לָא סָכִית דְהָא עַד כְּדוֹן יוֹסֵף בְּחַיָין נֵיזִיל וְנִיחֲמֵי יָתֵהּ עַד לָא נָמוּת:", "tj_en": "And Israel said, Many benefits and consolations I had hoped to see; but this I had not expected, that, behold, Joseph my son should be yet alive. I will go and see him before I die.", "rashi": "<b>רב.<\/b> רַב לִי עוֹד שִׂמְחָה וְחֶדְוָה הוֹאִיל וְעוֹד יוֹסֵף בְּנִי חַי:", "rashi_en": "רב ENOUGH or MUCH — Much joy and pleasure is still in store for me, since my son Joseph is yet alive."}, {"ch": 46, "v": 1, "aliyah": 5, "heb": "וַיִּסַּ֤ע יִשְׂרָאֵל֙ וְכׇל־אֲשֶׁר־ל֔וֹ וַיָּבֹ֖א בְּאֵ֣רָה שָּׁ֑בַע וַיִּזְבַּ֣ח זְבָחִ֔ים לֵאלֹהֵ֖י אָבִ֥יו יִצְחָֽק׃", "onk": "וּנְטַל יִשְׂרָאֵל וְכָל דִּי לֵיהּ וַאֲתָא לִבְאֵר שָׁבַע וּדְבַח דִּבְחִין לֵאלָהֵהּ אֲבוּהִי יִצְחָק:", "onk_en": "Yisrael journeyed with all that he possessed, and he came to Beer Sheva. He offered sacrifices [there] to the God of his father Yitzchok.", "pj": "וּנְטַל יִשְרָאֵל וְכָל דִילֵיהּ וְאָתָא לִבְאֵר שָׁבַע וְדַבַּח דִבְחִין לֵאלָהָא דְאָבוּי יִצְחָק", "pj_en": "And Israel journeyed with all that he had, and came to Beersheba, and offered sacrifices to the God of his father Izhak.", "tj": "", "tj_en": "", "rashi": "<b>בארה שבע.<\/b> כְּמוֹ לִבְאֵר שֶׁבַע; הֵ\"א בְּסוֹף תֵּבָה בִּמְקוֹם לָמֶ\"ד בִּתְּחִלָּתָהּ:<br><br><b>לאלהי אביו יצחק.<\/b> חַיָּב אָדָם בִּכְבוֹד אָבִיו יוֹתֵר מִבִּכְבוֹד זְקֵנוֹ, לְפִיכָךְ תָּלָה בְּיִצְחָק וְלֹא בְאַבְרָהָם:", "rashi_en": "The suffix ה replaces the prefix ל locale (Yevamot 13b).<br><br>לאלהי אביו יצחק TO THE GOD OF HIS FATHER, ISAAC — The duty of honouring one’s father is more imperative than that of honouring one’s grandfather (Genesis Rabbah 94:5); therefore the sacrifices are associated with the name of Isaac and not with that of Abraham."}, {"ch": 46, "v": 2, "aliyah": 5, "heb": "וַיֹּ֨אמֶר אֱלֹהִ֤ים&thinsp;<small>׀<\/small>&thinsp;לְיִשְׂרָאֵל֙ בְּמַרְאֹ֣ת הַלַּ֔יְלָה וַיֹּ֖אמֶר יַעֲקֹ֣ב&thinsp;<small>׀<\/small>&thinsp;יַעֲקֹ֑ב וַיֹּ֖אמֶר הִנֵּֽנִי׃", "onk": "וַאֲמַר יְיָ לְיִשְׂרָאֵל בְּחֶזְוֵי דְלֵילְיָא וַאֲמַר יַעֲקֹב יַעֲקֹב וַאֲמַר הָא אֲנָא:", "onk_en": "Elohim said to Yisrael in a night vision, and He said, Yaakov, Yaakov. And he said, Here I am.", "pj": "וַאֲמַר יְיָ לְיִשְרָאֵל בִּנְבוּאָה בְּלֵילְיָא וַאֲמַר יַעֲקב יַעֲקב וַאֲמַר הָא נָא", "pj_en": "And the Lord spake to Israel in a prophecy of the night, and said, Jakob! and he said, Behold me.", "tj": "", "tj_en": "", "rashi": "<b>יעקב יעקב.<\/b> לְשׁוֹן חִבָּה:", "rashi_en": "יעקב יעקב JACOB, JACOB — The repetition of the name is a mark of affection (Sifra, Vayikra Dibbura d'Nedavah, Chapter 1 12). "}, {"ch": 46, "v": 3, "aliyah": 5, "heb": "וַיֹּ֕אמֶר אָנֹכִ֥י הָאֵ֖ל אֱלֹהֵ֣י אָבִ֑יךָ אַל־תִּירָא֙ מֵרְדָ֣ה מִצְרַ֔יְמָה כִּֽי־לְג֥וֹי גָּד֖וֹל אֲשִֽׂימְךָ֥ שָֽׁם׃", "onk": "וַאֲמַר אֲנָא אֵל אֱלָהָא דְאָבוּךְ לָא תִדְחַל מִלְּמֵיחַת לְמִצְרַיִם אֲרֵי לְעַם סַגִּי אֲשַׁוִּנָּךְ תַּמָּן:", "onk_en": "He said I am the Almighty, God of your father. Do not be afraid to do down to Egypt, for there I will make you into a great nation.", "pj": "וַאֲמַר אֲנָא הוּא אֵל אֱלָהֵיהּ דְאָבוּךְ לָא תִדְחַל מִלְמֵיחוֹת לְמִצְרַיִם עַל עֵיסַק שִׁעֲבּוּדָא דִי פְּסָקִית עִם אַבְרָהָם אֲרוּם לְעַם סַגִי אֲשַׁוִינָךְ תַּמָן", "pj_en": "And He said, I am God, the God of thy father; fear not to go down into Mizraim on account of the servitude I have decreed with Abraham: for a great people will I make thee there.", "tj": "", "tj_en": "", "rashi": "<b>אל תירא מרדה מצרימה.<\/b> לְפִי שֶׁהָיָה מֵצֵר עַל שֶׁנִּזְקָק לָצֵאת לְחוּצָה לָאָרֶץ:", "rashi_en": "אל תירא מרדה מצרימה FEAR NOT TO GO DOWN TO EGYPT — God said this to him because he was grieved that he was compelled to leave the Land of Israel (Pirkei DeRabbi Eliezer 39). "}, {"ch": 46, "v": 4, "aliyah": 5, "heb": "אָנֹכִ֗י אֵרֵ֤ד עִמְּךָ֙ מִצְרַ֔יְמָה וְאָנֹכִ֖י אַֽעַלְךָ֣ גַם־עָלֹ֑ה וְיוֹסֵ֕ף יָשִׁ֥ית יָד֖וֹ עַל־עֵינֶֽיךָ׃", "onk": "אֲנָא אֵחוֹת עִמָּךְ לְמִצְרַיִם וַאֲנָא אַסֵּקִנָּךְ אַף אַסָּקָא וְיוֹסֵף יְשַׁוֵּי יְדוֹהִי עַל עֵינָיךְ:", "onk_en": "I will go down with you to Egypt, and I will also surely bring you up again. Yoseif shall place his hand upon your eyes.", "pj": "אֲנָא הוּא דִבְמֵימְרִי אֵיחוֹת עִמָךְ לְמִצְרַיִם וְאֵיחְמֵי סִיגוּפֵיהוֹן דִבְנָךְ וּמֵימְרִי יַעֲלִינָךְ תַּמָן אוּף אַפִּיק יַת בְּנָךְ מִתַּמָן וּבְרַם יוֹסֵף יְשַׁוֵי יְדֵיהּ עַל עֵינָךְ", "pj_en": "I am He who in My Word will go down with thee into Mizraim; I will regard the affliction of thy children, and My Word shall bring thee up from thence, and cause thy children to come up; but Joseph shall lay his hand upon thine eyes.", "tj": "", "tj_en": "", "rashi": "<b>ואנכי אעלך.<\/b> הִבְטִיחוֹ לִהְיוֹת נִקְבָּר בָּאָרֶץ:", "rashi_en": "ואנכי אעלך AND I MYSELF WILL ALSO SURELY BRING THEE UP AGAIN — Here He promised him that he would be buried in the Holy Land (Talmud Yerushalmi Sotah 1:10). "}, {"ch": 46, "v": 5, "aliyah": 5, "heb": "וַיָּ֥קׇם יַעֲקֹ֖ב מִבְּאֵ֣ר שָׁ֑בַע וַיִּשְׂא֨וּ בְנֵֽי־יִשְׂרָאֵ֜ל אֶת־יַעֲקֹ֣ב אֲבִיהֶ֗ם וְאֶת־טַפָּם֙ וְאֶת־נְשֵׁיהֶ֔ם בָּעֲגָל֕וֹת אֲשֶׁר־שָׁלַ֥ח פַּרְעֹ֖ה לָשֵׂ֥את אֹתֽוֹ׃", "onk": "וְקָם יַעֲקֹב מִבְּאֵרָא דְשָׁבַע וּנְטָלוּ בְנֵי יִשְׂרָאֵל יָת יַעֲקֹב אֲבוּהוֹן וְיָת טַפְלְהוֹן וְיָת נְשֵׁיהוֹן בַּעֲגַלְתָּא דִּי שְׁלַח פַּרְעֹה לְמִטַּל יָתֵיהּ:", "onk_en": "Yaakov rose up from Beer Sheva. The sons of Yisrael transported their father Yaakov, their children, their wives in the wagons that Pharaoh had sent to carry him.", "pj": "וְקָם יַעֲקב מִבֵּירָא דְשָׁבַע וּנְטָלוּ בְּנֵי יִשְרָאֵל יַת יַעֲקב אֲבוּהוֹן וְיַת טַפְלְהוֹן וְיַת נְשֵׁיהוֹן בִּסְדָנֵי דְשָׁדַר פַּרְעה לְמֵיטַל יָתֵיהּ", "pj_en": "And Jakob arose from Beer de Sheba; and the sons of Israel journeyed, with Jakob their father, their little ones, and their wives, in the waggons which Pharoh had sent to carry him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 6, "aliyah": 5, "heb": "וַיִּקְח֣וּ אֶת־מִקְנֵיהֶ֗ם וְאֶת־רְכוּשָׁם֙ אֲשֶׁ֤ר רָֽכְשׁוּ֙ בְּאֶ֣רֶץ כְּנַ֔עַן וַיָּבֹ֖אוּ מִצְרָ֑יְמָה יַעֲקֹ֖ב וְכׇל־זַרְע֥וֹ אִתּֽוֹ׃", "onk": "וּדְבָרוּ יָת גֵּיתֵיהוֹן וְיָת קִנְיָנְהוֹן דִּי קְנוֹ בְּאַרְעָא דִכְנַעַן וַאֲתוֹ לְמִצְרָיִם יַעֲקֹב וְכָל בְּנוֹהִי עִמֵּיהּ:", "onk_en": "They took their livestock and their possessions that they had acquired in the land of Canaan, and they came to Egypt; Yaakov and all his descendants with him.", "pj": "וְדַבְּרוּ יַת קִנְיָנֵיהוֹן וְיַת נִכְסֵיהוֹן דִי קָנוּ בְּאַרְעָא דִכְנָעַן וְאָתוֹ לְמִצְרַיִם יַעֲקב וְכָל בְּנוֹי עִמֵיהּ", "pj_en": "They took their possessions and the substance which they had gotten in the land of Kenaan, and came into Mizraim, Jakob and all his sons with him,", "tj": "", "tj_en": "", "rashi": "<b>אשר רכשו בארץ כנען.<\/b> אֲבָל מַה שֶּׁרָכַשׁ בְּפַדַּן אֲרָם נָתַן הַכֹּל לְעֵשָׂו בִּשְׁבִיל חֶלְקוֹ בִּמְעָרַת הַמַּכְפֵּלָה; אָמַר נִכְסֵי חוּצָה לָאָרֶץ אֵינָן כְּדַאי לִי, וְזֶהוּ אֲשֶׁר כָּרִיתִי לִי, הֶעֱמִיד לוֹ צִבּוּרִין שֶׁל זָהָב וָכֶסֶף כְּמִין כְּרִי וְאָמַר לוֹ טֹל אֶת אֵלּוּ:", "rashi_en": "אשר רכשו בארץ כנען WHICH THEY HAD GOTTEN IN THE LAND OF CANAAN — But all that he had gotten in Padan-aram he gave to Esau in payment for his share in the Cave of Machpelah. He said, “The possessions I obtained outside the land are of no value to me”. It is to this that the words refer (Genesis 50:5) “[Bury me in my burying-place] which כריתי” I obtained for myself by means of a כרי. He placed before him (Esau) piles of gold and silver like a heap (כרי) of corn and said to him, “Take these in exchange for your share in the Cave of Machpelah” (Midrash Tanchuma, Vayechi 6)."}, {"ch": 46, "v": 7, "aliyah": 5, "heb": "בָּנָ֞יו וּבְנֵ֤י בָנָיו֙ אִתּ֔וֹ בְּנֹתָ֛יו וּבְנ֥וֹת בָּנָ֖יו וְכׇל־זַרְע֑וֹ הֵבִ֥יא אִתּ֖וֹ מִצְרָֽיְמָה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּנוֹהִי וּבְנֵי בְנוֹהִי עִמֵּיהּ בְּנָתֵיהּ וּבְנַת בְּנוֹהִי וְכָל זַרְעֵיהּ אָעֵיל עִמֵּיהּ לְמִצְרָיִם:", "onk_en": "His sons and grandsons were with him. His daughters and his granddaughters, and all his descendants he brought with him to Egypt.", "pj": "בְּנוֹי וּבְנֵי בְנוֹי עִמֵיהּ בְּנָתֵיהּ וּבְנַת בְּנוֹי וְכָל זַרְעֵיהּ אַיְיתֵי עִמֵיהּ לְמִצְרָיִם", "pj_en": "his sons and his sons' children with him, his daughters, and the daughters of his sons; and all his seed came with him to Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ובנות בניו.<\/b> סֶרַח בַּת אָשֵׁר וְיוֹכֶבֶד בַּת לֵוִי:", "rashi_en": "ובנות בניו HIS SON’S DAUGHTERS — these were Serah, the daughter of Asher, and Jochebed, the daughter of Levi. "}, {"ch": 46, "v": 8, "aliyah": 5, "heb": "וְאֵ֨לֶּה שְׁמ֧וֹת בְּנֵֽי־יִשְׂרָאֵ֛ל הַבָּאִ֥ים מִצְרַ֖יְמָה יַעֲקֹ֣ב וּבָנָ֑יו בְּכֹ֥ר יַעֲקֹ֖ב רְאוּבֵֽן׃", "onk": "וְאִלֵּין שְׁמָהַת בְּנֵי יִשְׂרָאֵל דְּעַלּוּ לְמִצְרַיִם יַעֲקֹב וּבְנוֹהִי בּוּכְרָא דְיַעֲקֹב רְאוּבֵן:", "onk_en": "These are the names of the sons of Yisrael who were coming to Egypt, Yaakov and his sons. The firstborn of Yaakov was Reuvein.", "pj": "וְאִלֵין שְׁמָהַת בְּנֵי יִשְרָאֵל דְעָלוּ לְמִצְרַיִם יַעֲקב וּבְנוֹי בּוּכְרָא דְיַעֲקב רְאוּבֵן", "pj_en": "These are the names of the sons of Israel who came into Mizraim. Jakob and his sons. The firstborn of Jakob, Reuben.", "tj": "", "tj_en": "", "rashi": "<b>הבאים מצרימה.<\/b> עַל שֵׁם הַשָּׁעָה קוֹרֵא לָהֶם הַכָּתוּב בָּאִים, וְאֵין לִתְמֹהַּ עַל אֲשֶׁר לֹא כָתַב אֲשֶׁר בָּאוּ:", "rashi_en": "הבאים מצרימה WHO CAME INTO EGYPT — Relative to that time when they were going to Egypt Scripture calls them “those who were coming” to Egypt (the participle) and one, therefore, need not be surprised that it does not state אשר באו “who came” (the perfect tense). "}, {"ch": 46, "v": 9, "aliyah": 5, "heb": "וּבְנֵ֖י רְאוּבֵ֑ן חֲנ֥וֹךְ וּפַלּ֖וּא וְחֶצְרֹ֥ן וְכַרְמִֽי׃", "onk": "וּבְנֵי רְאוּבֵן חֲנוֹךְ וּפַלּוּא וְחֶצְרֹן וְכַרְמִי:", "onk_en": "The sons of Reuvein [were]: Chanoch, Phallu, Chetzron and Carmi.", "pj": "וּבְנוֹי דִרְאוּבֵן חֲנוֹךְ וּפַלוּא וְחֶצְרוֹן וְכַרְמִי", "pj_en": "And the sons of Reuben, Hanok and Phallu Hetsron and Karmi.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 10, "aliyah": 5, "heb": "וּבְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֧ל וְיָמִ֛ין וְאֹ֖הַד וְיָכִ֣ין וְצֹ֑חַר וְשָׁא֖וּל בֶּן־הַֽכְּנַעֲנִֽית׃", "onk": "וּבְנֵי שִׁמְעוֹן יְמוּאֵל וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר וְשָׁאוּל בַּר כְּנַעֲנֵיתָא:", "onk_en": "The sons, of Shimon [were]: Yemueil, Yamin, Ohad, Yachin, Tzochar and Shaul, the son of the Canaanite woman.", "pj": "וּבְנוֹי דְשִׁמְעוֹן יְמוּאֵל וְיָמִין וְאוֹהַד וְיָכִין וְצוֹחַר וְשָׁאוּל הוּא זִמְרִי דְעָבַד עוֹבְדָא דִכְנַעֲנָאֵי בְּשִׁטִים", "pj_en": "The sons of Shimeon, Jemuel and Jamin, Ochad, Jakin, Sochar and Shaul: he is Zimri, who made the work of the Kenaanites in Shittim.", "tj": "", "tj_en": "", "rashi": "<b>בן הכנענית.<\/b> בֶּן דִּינָה שֶׁנִּבְעֲלָה לִכְנַעֲנִי; כְשֶׁהָרְגוּ אֶת שְׁכֶם לֹא הָיְתָה דִּינָה רוֹצָה לָצֵאת עַד שֶׁנִּשְׁבַּע לָהּ שִׁמְעוֹן שֶׁיִּשָּׂאֶנָּה (בראשית רבה):", "rashi_en": "בן הכנענית THE SON OF THE CANAANITISH WOMAN — means the son of Dinah, who had been associated with a Canaanite (Shechem). When they (her brothers) had killed Shechem, Dinah refused to leave the city until Simeon swore to her that he would marry her and regard the child she was about to bear as his own (cf. Genesis Rabbah 80:11).  "}, {"ch": 46, "v": 11, "aliyah": 5, "heb": "וּבְנֵ֖י לֵוִ֑י גֵּרְשׁ֕וֹן קְהָ֖ת וּמְרָרִֽי׃", "onk": "וּבְנֵי לֵוִי גֵּרְשׁוֹן קְהָת וּמְרָרִי:", "onk_en": "The sons of Leivi [were] Gershon, Kehas and Merari.", "pj": "וּבְנוֹי דְלֵוִי גֵרְשׁוֹן וּקְהָת וּמְרָרִי", "pj_en": "And the sons of Levi, Gershon, Kehath and Merari.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 12, "aliyah": 5, "heb": "וּבְנֵ֣י יְהוּדָ֗ה עֵ֧ר וְאוֹנָ֛ן וְשֵׁלָ֖ה וָפֶ֣רֶץ וָזָ֑רַח וַיָּ֨מׇת עֵ֤ר וְאוֹנָן֙ בְּאֶ֣רֶץ כְּנַ֔עַן וַיִּהְי֥וּ בְנֵי־פֶ֖רֶץ חֶצְרֹ֥ן וְחָמֽוּל׃", "onk": "וּבְנֵי יְהוּדָה עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח וּמִית עֵר וְאוֹנָן בְּאַרְעָא דִכְנַעַן וַהֲווֹ בְנֵי פֶרֶץ חֶצְרֹן וְחָמוּל:", "onk_en": "The sons of Yehudah [were]: Eir, Onan, Sheiloh, Peretz and Zorach. Eir and Onan died in the land of Canaan. The sons of Peretz were Chetzron and Chamul.", "pj": "וּבְנוֹי דִיהוּדָה עֵר וְאוֹנָן וְשֵׁלָה וָפֶרֶץ וָזָרַח וּמִית עֵר וְאוֹנָן עַל עֵיסַק עוֹבַדְהוֹן בִּישַׁיָיא בְּאַרְעָא דִכְנָעַן וְשֵׁלָה וְזֶרַח לָא אוֹלִידוּ בְּנִין בְּאַרְעָא דִכְנָעַן וַהֲווֹ בְנֵי פֶרֶץ דְנַחְתוּ לְמִצְרַיִם חֶצְרוֹן וְחָמוּל", "pj_en": "The sons of Jehuda, Er, Onan, Shelah, Pherets, and Zarach. But Er and Onan died, on account of their evil work in the land of Kenaan; and Shelah and Zarach had no children in the land of Kenaan; but the sons of Pherets who went down to Mizraim were Hetsron and Chamul.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 13, "aliyah": 5, "heb": "וּבְנֵ֖י יִשָּׂשכָ֑ר תּוֹלָ֥ע וּפֻוָ֖ה וְי֥וֹב וְשִׁמְרֹֽן׃", "onk": "וּבְנֵי יִשָּׂשׂכָר תּוֹלָע וּפֻוָּה וְיוֹב וְשִׁמְרוֹן:", "onk_en": "The sons of Yissachar [were]: Tolah, Phuvah, Yov and Shimron.", "pj": "וּבְנוֹי דְיִשָשׁכָר חַכִּימִין וּמָרֵי חוּשְׁבְּנָא וְשׁוּמְהוֹן תּוֹלָע וּפֻוָה וְיוֹב וְשִׁמְרוֹן", "pj_en": "The sons of Issakar, sages, and masters of reasoning, their names were Tola, Phua, Job, and Shimron.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 14, "aliyah": 5, "heb": "וּבְנֵ֖י זְבֻל֑וּן סֶ֥רֶד וְאֵל֖וֹן וְיַחְלְאֵֽל׃", "onk": "וּבְנֵי זְבֻלוּן סֶרֶד וְאֵלוֹן וְיַחְלְאֵל:", "onk_en": "The sons of Zevulun [were]: Sered, Eilon and Yachle’eil.", "pj": "וּבְנוֹי דִזְבוּלוּן תַּגְרִין מָרֵי פְּרַקְמַטְיָא מְפַרְנְסִין יַת אֲחוּהוֹן בְּנֵי יִשָשׁכָר וּמְקַבְּלִין אֲגַר כְּוַתְהוֹן וְשׁוּמְהוֹן סֶרֶד וְאֵילוֹן וְיַחְלְאֵל", "pj_en": "The sons of Zebulon, merchants, masters of commerce nourishing their brethren, the sons of Issakar, and receiving a reward like theirs; and their names were Sered, Elon, and Jahleel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 15, "aliyah": 5, "heb": "אֵ֣לֶּה&thinsp;<b>׀<\/b> בְּנֵ֣י לֵאָ֗ה אֲשֶׁ֨ר יָֽלְדָ֤ה לְיַעֲקֹב֙ בְּפַדַּ֣ן אֲרָ֔ם וְאֵ֖ת דִּינָ֣ה בִתּ֑וֹ כׇּל־נֶ֧פֶשׁ בָּנָ֛יו וּבְנוֹתָ֖יו שְׁלֹשִׁ֥ים וְשָׁלֹֽשׁ׃", "onk": "אִלֵּין בְּנֵי לֵאָה דִּיְלִידַת לְיַעֲקֹב בְּפַדַּן אֲרָם וְיָת דִּינָה בְרַתֵּהּ כָּל נֶפֶשׁ בְּנוֹהִי וּבְנָתֵיהּ תְּלָתִין וּתְלָת:", "onk_en": "These are the sons of Leah that she bore to Yaakov in Padan Aram, along with his daughter Deenah. All the souls of his sons and daughters were thirty-three.", "pj": "אִלֵין בְּנֵי לֵאָה דִילֵידַת לְיַעֲקב בְּפַדַן דַאֲרַם וְיַת דִינָה בְרַתֵּיהּ כָּל נַפְשַׁת בְּנוֹי וּבְרַתֵּיהּ תְּלָתִין וּתְלַת", "pj_en": "These are the sons of Leah, whom she bare unto Jakob in. Padan Aram, with Dinah his daughter; all the souls of his sons and his daughter; thirty and three.", "tj": "", "tj_en": "", "rashi": "<b>אלה בני לאה, ואת דינה בתו.<\/b> הַזְּכָרִים תָּלָה בְלֵאָה וְהַנְּקֵבוֹת תָּלָה בְיַעֲקֹב, לְלַמֶּדְךָ, אִשָּׁה מַזְרַעַת תְּחִלָּה יוֹלֶדֶת זָכָר, אִישׁ מַזְרִיעַ תְּחִלָּה יוֹלֶדֶת נְקֵבָה:<br><br><b>שלשים ושלש.<\/b> וּבִפְרָטָן אִי אַתָּה מוֹצֵא אֶלָּא שְׁלֹשִׁים וּשְׁנַיִם, אֶלָּא זוֹ יוֹכֶבֶד שֶׁנּוֹלְדָה בֵין הַחוֹמוֹת בִּכְנִיסָתָן לָעִיר, שֶׁנֶּאֱמַר אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם – לֵדָתָהּ בְּמִצְרַיִם וְאֵין הוֹרָתָהּ בְּמִצְרַיִם:", "rashi_en": "אלה בני לאה ואת דינה בתו THESE ARE THE SONS OF LEAH WITH HIS DAUGHTER DINAH. — Scripture associates the men with the name of Leah and the women with that of Jacob for the reason given the Talmud (Niddah 31a).<br><br>שלשים ושלש THIRTY THREE — But in the enumeration above you will find only thirty-two. The one whose name is omitted is Jochebed who was born “between the walls” just as they entered the border city, as it is said (Numbers 26:59) “Jochebed, the daughter of Levi, whom her mother bore to Levi in Egypt — she was born in Egypt, but she was not conceived in Egypt (Bava Batra 123)."}, {"ch": 46, "v": 16, "aliyah": 5, "heb": "וּבְנֵ֣י גָ֔ד צִפְי֥וֹן וְחַגִּ֖י שׁוּנִ֣י וְאֶצְבֹּ֑ן עֵרִ֥י וַֽאֲרוֹדִ֖י וְאַרְאֵלִֽי׃", "onk": "וּבְנֵי גָד צִפְיוֹן וְחַגִּי שׁוּנִי וְאֶצְבּוֹן עֵרִי וַאֲרוֹדִי וְאַרְאֵלִי:", "onk_en": "The sons of Gad [were]: Tzifyon, Chagi, Shuni, Etzbon, Eiri, Arodi, and Areili.", "pj": "וּבְנוֹי דְגָד צִפְיוֹן וְחַגִי שׁוּנִי וְאֶצְבּוֹן עֵרִי וַאֲרוֹדִי וְאַרְאֵלִי", "pj_en": "And the children of Gad, Sephon, Haggi, Suni, Ezbon, Eri, Arodi, and Areli.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 17, "aliyah": 5, "heb": "וּבְנֵ֣י אָשֵׁ֗ר יִמְנָ֧ה וְיִשְׁוָ֛ה וְיִשְׁוִ֥י וּבְרִיעָ֖ה וְשֶׂ֣רַח אֲחֹתָ֑ם וּבְנֵ֣י בְרִיעָ֔ה חֶ֖בֶר וּמַלְכִּיאֵֽל׃", "onk": "וּבְנֵי אָשֵׁר יִמְנָה וְיִשְׁוָה וְיִשְׁוִי וּבְרִיעָה וְשֶׂרַח אֲחַתְהוֹן וּבְנֵי בְרִיעָה חֶבֶר וּמַלְכִּיאֵל:", "onk_en": "The sons of Asher [were]: Yimnah, Yishvah, Yishvi, and Beriah, an
