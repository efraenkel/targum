d their sister, Serach. The sons of Beriah [were]: Chever and Malki’eil.", "pj": "וּבְנוֹי דְאָשֵׁר יִמְנָה וְיִשְׁוָה וְיִשְׁוִי וּבְרִיעָה וְשֶרַח אֲחַתְהוֹן דְאִידְבָּרִית כַּד הִיא קְיָימָא לְגִינוּנִיתָא עַל דְבַשְרַת לְיַעֲקב דְיוֹסֵף קַיֵים הִיא שִׁיזִיבַת לְיַתְבֵי אָבֵל מִדִין קְטוֹל בְּיוֹמֵי יוֹאָב וּבְנוֹי דִבְרִיעָה דְנַחֲתוּ לְמִצְרַיִם חֶבֶר וּמַלְכִּיאֵל", "pj_en": "The children of Asher, Yimna, Yishvah, Yishvi, Beriah and Serach their sister, who was carried away while alive into the Garden (of Eden), because she had announced to Jakob that Joseph still lived. It was she who saved the inhabitants of (the city) Abel from the judgment of death, in the days of Joab. The sons of Beriah who went down into Mizraim were Heber and Malkiel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 18, "aliyah": 5, "heb": "אֵ֚לֶּה בְּנֵ֣י זִלְפָּ֔ה אֲשֶׁר־נָתַ֥ן לָבָ֖ן לְלֵאָ֣ה בִתּ֑וֹ וַתֵּ֤לֶד אֶת־אֵ֙לֶּה֙ לְיַעֲקֹ֔ב שֵׁ֥שׁ עֶשְׂרֵ֖ה נָֽפֶשׁ׃", "onk": "אִלֵּין בְּנֵי זִלְפָּה דִּיהַב לָבָן לְלֵאָה בְרַתֵּיהּ וִילִידַת יָת אִלֵּין לְיַעֲקֹב שִׁית עֶשְׂרֵי נַפְשָׁא:", "onk_en": "These are the sons of Zilpah, whom Lavan gave to his daughter, Leah. She bore these to Yaakov, sixteen souls.", "pj": "אִלֵין בְּנֵי זִלְפָּה דִיהַב לָבָן לְלֵאָה בְּרַתֵּיהּ וִילֵידַת יַת אִילֵין לְיַעֲקב שִׁיתְּסַר נַפְשִׁין", "pj_en": "These are the children of Zilpha, whom Laban gave to Leah his daughter, and she bare them to Jakob; sixteen souls.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 19, "aliyah": 5, "heb": "בְּנֵ֤י רָחֵל֙ אֵ֣שֶׁת יַעֲקֹ֔ב יוֹסֵ֖ף וּבִנְיָמִֽן׃", "onk": "בְּנֵי רָחֵל אִתַּת יַעֲקֹב יוֹסֵף וּבִנְיָמִן:", "onk_en": "The sons of Rochel, Yaakov’s wife [were]: Yoseif and Binyomin.", "pj": "בְּנוֹי רָחֵל אִיתַּת יַעֲקב יוֹסֵף וּבִנְיָמִין", "pj_en": "The sons of Rahel, wife of Jakob, Joseph and Benjamin.", "tj": "", "tj_en": "", "rashi": "<b>בני רחל אשת יעקב.<\/b> וּבְכֻלָּן לֹא נֶאֱמַר בָּהֶן אֵשֶׁת, אֶלָּא שֶׁהָיְתָה עִקָּרוֹ שֶׁל בַּיִת:", "rashi_en": "בני רחל אשת יעקב THE SONS OF RACHEL, JACOB’S WIFE — In the case of all the other wives of Jacob the term אשת “wife” is not mentioned. But the reason is because she was the chief mistress of the household (Genesis Rabbah 73:1). "}, {"ch": 46, "v": 20, "aliyah": 5, "heb": "וַיִּוָּלֵ֣ד לְיוֹסֵף֮ בְּאֶ֣רֶץ מִצְרַ֒יִם֒ אֲשֶׁ֤ר יָֽלְדָה־לּוֹ֙ אָֽסְנַ֔ת בַּת־פּ֥וֹטִי פֶ֖רַע<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן פּֽוֹטִיפֶ֖רַע בתיבה אחת)<\/i> כֹּהֵ֣ן אֹ֑ן אֶת־מְנַשֶּׁ֖ה וְאֶת־אֶפְרָֽיִם׃", "onk": "וְאִתְיְלִידוּ לְיוֹסֵף בְּאַרְעָא דְמִצְרַיִם דִּילִידַת לֵהּ אָסְנַת בַּת פּוֹטִי פֶרַע רַבָּא דְאוֹן יָת מְנַשֶּׁה וְיָת אֶפְרָיִם:", "onk_en": "In the land of Egypt, [sons] were born to Yoseif, which were born to him by Osnas, daughter of Poti Phera, priest [<b>chief<\/b>] of On; [they were] Menasheh and Ephraim.", "pj": "וְאִתְיְלִיד לְיוֹסֵף בְּנִין בְּאַרְעָא דְמִצְרַיִם דִילֵידַת לֵיהּ אָסְנַת בַּת דִינָה וְרָבַת בְּבֵית פּוֹטִיפֶרַע רַבָּא דְטָנִיס יַת מְנַשֶׁה וְיַת אֶפְרָיִם", "pj_en": "And to Joseph were born two sons in the land of Mizraim, whom Asenath the daughter of Dinah, educated in the house of Potiphera prince of Tanis, bare, Menasheh and Ephraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 21, "aliyah": 5, "heb": "וּבְנֵ֣י בִנְיָמִ֗ן בֶּ֤לַע וָבֶ֙כֶר֙ וְאַשְׁבֵּ֔ל גֵּרָ֥א וְנַעֲמָ֖ן אֵחִ֣י וָרֹ֑אשׁ מֻפִּ֥ים וְחֻפִּ֖ים וָאָֽרְדְּ׃", "onk": "וּבְנֵי בִנְיָמִן בֶּלַע וָבֶכֶר וְאַשְׁבֵּל גֵּרָא וְנַעֲמָן אֵחִי וָרֹאשׁ מֻפִּים וְחֻפִּים וָאָרְדְּ:", "onk_en": "The sons of Binyomin [were]: Bela, Becher, Ashbeil, Geiroh, Naamon, Eichi, Rosh, Muppim, Chuppim and Ard.", "pj": "וּבְנוֹי דְבִנְיָמִין עַשְרָא וּשׁוּמְהוֹן עַל פְּרִישׁוּתָא דְיוֹסֵף אָחוֹי. בֶּלַע, דְאִתְבְּלַע מִנֵיהּ. וָבֶכֶר, דְהוּא בּוּכְרָא דְאִמֵיהּ. וְאַשְׁבֵּל, דְהַלִיךְ בְּשִׁבְיָיתָא. גֵרָא, דְאִיתְגַר בְּאַרְעָא נוּכְרָאָה. וְנַעֲמָן, דַהֲוָה נָעִים וְיַקִיר. אֵחִי, דְהוּא אָחוֹי בַּר אִימֵיהּ. וָראשׁ, דַהֲוָה רֵישׁ בְּבֵית אָבוֹי. מֻפִּים, דְאִזְדַבֵּן בְּמוֹף. חֻפִּים, דְבִזְמַן דְאִתְפָּרֵשׁ מִינֵיהּ הֲוָה בַּר תַּמְנֵיסַר שְׁנִין וְחָזִי לְכֵילָת הִילוּלָא. וָאָרְד, דְנָחַת לְמִצְרָיִם", "pj_en": "The sons of Benjamin, ten; and their names, according to the interpretation of Joseph his brother: Bela, who was swallowed up from him; Beker, who was the chosen of his mother; Eshbal, who went into captivity; Gera, who became a sojourner in a foreign land; Naaman, who was pleasant and honourable; Achi, who had a (twin) brother, the son of his mother; Rosh, who was a chief in his father's house; Muppim, who was sold into Muph; Chuppim, because at the time that he was separated from him he was the son of eighteen years and was eligible for marriage (Chupha, thalamus nuptialis); and Ared, who descended into Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 22, "aliyah": 5, "heb": "אֵ֚לֶּה בְּנֵ֣י רָחֵ֔ל אֲשֶׁ֥ר יֻלַּ֖ד לְיַעֲקֹ֑ב כׇּל־נֶ֖פֶשׁ אַרְבָּעָ֥ה עָשָֽׂר׃", "onk": "אִלֵּין בְּנֵי רָחֵל דְּאִתְיְלִידוּ לְיַעֲקֹב כָּל נַפְשָׁא אַרְבְּעָה עֲשָׂר:", "onk_en": "These are the sons of Rochel that she bore to Yaakov. All the souls were fourteen.", "pj": "אִלֵין בְּנֵי רָחֵל דְאִיתְיְלִידוּ לְיַעֲקב כָּל נַפְשָׁתָא אַרְבֵּסְרֵי", "pj_en": "These are the children of Rahel who were born unto Jakob, all the souls fourteen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 23, "aliyah": 5, "heb": "וּבְנֵי־דָ֖ן חֻשִֽׁים׃", "onk": "וּבְנֵי דָן חֻשִׁים:", "onk_en": "The sons of Don [were] Chushim.", "pj": "וּבְנוֹי דְדָן זְרִיזִין וְאַמְפּוּרִין וְלֵית סְכוּם לְמִנְיָנֵיהוֹם", "pj_en": "The sons of Dan, able men (or armed) and merchants, of whose numbers there is no end (or sum).", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 24, "aliyah": 5, "heb": "וּבְנֵ֖י נַפְתָּלִ֑י יַחְצְאֵ֥ל וְגוּנִ֖י וְיֵ֥צֶר וְשִׁלֵּֽם׃", "onk": "וּבְנֵי נַפְתָּלִי יַחְצְאֵל וְגוּנִי וְיֵצֶר וְשִׁלֵּם:", "onk_en": "The sons of Naftali were: Yachtze’eil, Guni, Yeitzer and Shileim.", "pj": "וּבְנוֹי דְנַפְתָּלִי יַחְצְאֵל וְגוּנִי וְיֵצֶר וְשִׁלֵם", "pj_en": "And the sons of Naphtali, Jakzeel, Guni, Jetser, and Shillem.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 25, "aliyah": 5, "heb": "אֵ֚לֶּה בְּנֵ֣י בִלְהָ֔ה אֲשֶׁר־נָתַ֥ן לָבָ֖ן לְרָחֵ֣ל בִּתּ֑וֹ וַתֵּ֧לֶד אֶת־אֵ֛לֶּה לְיַעֲקֹ֖ב כׇּל־נֶ֥פֶשׁ שִׁבְעָֽה׃", "onk": "אִלֵּין בְּנֵי בִלְהָה דִּיהַב לָבָן לְרָחֵל בְּרַתֵּיהּ וִילִידַת יָת אִלֵּין לְיַעֲקֹב כָּל נַפְשָׁא שִׁבְעָא:", "onk_en": "These are the sons of Bilhah whom Lavan gave to his daughter Rochel. She bore these to Yaakov, seven souls in all.", "pj": "אִלֵין בְּנֵי בִלְהָה דִיהַב לָבָן לְרָחֵל בְּרַתֵּיהּ וִילֵידַת יַת אִלֵין לְיַעֲקב כָּל נַפְשָׁתָא שׁוּבְעָא", "pj_en": "These are the sons of Bilhah whom Laban gave to Rahel his daughter; and she bare them unto Jakob, all the souls seven.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 26, "aliyah": 5, "heb": "כׇּל־הַ֠נֶּ֠פֶשׁ הַבָּאָ֨ה לְיַעֲקֹ֤ב מִצְרַ֙יְמָה֙ יֹצְאֵ֣י יְרֵכ֔וֹ מִלְּבַ֖ד נְשֵׁ֣י בְנֵי־יַעֲקֹ֑ב כׇּל־נֶ֖פֶשׁ שִׁשִּׁ֥ים וָשֵֽׁשׁ׃", "onk": "כָּל נַפְשָׁא דְּעַלָּא לְיַעֲקֹב לְמִצְרַיִם נָפְקֵי יַרְכֵּיהּ בַּר מִנְּשֵׁי בְנֵי יַעֲקֹב כָּל נַפְשָׁתָא שִׁתִּין וְשִׁית:", "onk_en": "All the souls coming with Yaakov to Egypt, who came out of his loins, not counting the wives of Yaakov’s sons, all the souls totaled sixty-six.", "pj": "כָּל נַפְשָׁתָא דְעָלָא עִם יַעֲקב לְמִצְרַיִם נַפְקֵי יַרְכֵיהּ בַּר מִנְשֵׁי דִבְנֵי יַעֲקב כָּל נַפְשָׁתָא שִׁיתִּין וְשִׁית", "pj_en": "All the souls which went into Mizraim with Jakob which had come forth from his thigh; besides the wives of Jakob's sons, all the souls were sixty and six.", "tj": "", "tj_en": "", "rashi": "<b>כל הנפש הבאה ליעקב.<\/b> שֶׁיָּצְאוּ מֵאֶרֶץ כְּנַעַן לָבֹא לְמִצְרַיִם; וְאֵין \"הַבָּאָה\" זוֹ לְשׁוֹן עָבָר אֶלָּא לְשׁוֹן הוֹוֶה, כְּמוֹ בָּעֶרֶב הִיא בָאָה (אסתר ב' ד'), וּכְמוֹ וְהִנֵּה רָחֵל בִּתּוֹ בָּאָה עִם הַצֹּאן (בראשית כ\"ט), לְפִיכָךְ טַעְמוֹ לְמַטָּה בָּאָלֶ\"ף, לְפִי שֶׁכְּשֶׁיָּצְאוּ לָבֹא מֵאֶרֶץ כְּנַעַן לֹא הָיוּ אֶלָּא שִׁשִּׁים וָשֵׁשׁ, וְהַשֵּׁנִי, כָּל הַנֶּפֶשׁ לְבֵית יַעֲקֹב הַבָּאָה מִצְרַיְמָה שִׁבְעִים – הוּא לְשׁוֹן עָבָר, לְפִיכָךְ טַעְמוֹ לְמַעְלָה בַּבֵּי\"ת, לְפִי שֶׁמִּשֶּׁבָּאוּ שָׁם הָיוּ שִׁבְעִים, שֶׁמָּצְאוּ שָׁם יוֹסֵף וּשְׁנֵי בָנָיו, וְנִתּוֹסְפָה לָהֶם יוֹכֶבֶד בֵּין הַחוֹמוֹת. וּלְדִבְרֵי הָאוֹמֵר תְּאוֹמוֹת נוֹלְדוּ עִם הַשְּׁבָטִים, צְרִיכִים אָנוּ לוֹמַר שֶׁמֵּתוּ לִפְנֵי יְרִידָתָן לְמִצְרַיִם, שֶׁהֲרֵי לֹא נִמְנוּ כָאן; מָצָאתִי בְּוַיִּקְרָא רַבָּה, עֵשָׂו שֵׁשׁ נְפָשׁוֹת הָיוּ לוֹ, וְהַכָּתוּב קוֹרֵא אוֹתָן נַפְשׁוֹת בֵּיתוֹ, לְשׁוֹן רַבִּים, לְפִי שֶׁהָיוּ עוֹבְדִין לֶאֱלֹהוּת הַרְבֵּה; יַעֲקֹב שִׁבְעִים הָיוּ לוֹ, וְהַכָּתוּב קוֹרֵא אוֹתָן נֶפֶשׁ, לְפִי שֶׁהָיָה עוֹבְדִים לְאֵל אֶחָד:", "rashi_en": "כל הנפש הבאה ליעקב EVERY SOUL THAT WAS COMING WITH JACOB — every soul that left Canaan to go to Egypt The word הבאה, here, is not a perfect tense, but a participle with a relative present sense — just as (Ester 2:4) “In the evening she (באה) was coming” and (Genesis 29:7) “and, behold, Rachel his daughter is coming (באה)” and therefore the accent is on the last syllable, on the א, because when they left, coming from the land of Canaan, they were only sixty-six. But at the second mention of this word (Genesis 46:27) — “every soul of the house of Jacob, which came (הבאה) into Egypt were seventy” — it is a perfect tense and therefore it is accented on the last but one syllable, on the ב. The reason is, that when they came there, they were seventy, for they found Joseph and his two sons there, and Jochebed was added to their number “between the walls”. According to the view of the Rabbi (i. e. R. Jehudah, cf. Genesis Rabbah 84) who stated that with each of Jacob’s sons a twin-sister was born, we must say that these died before they (Jacob and his family) went down to Egypt, because they are not enumerated here. In Vayikra Rabbah 4:6 I found the following: When he left Canaan (cf. Genesis 36:6) Esau’s family consisted of only six (himself and his five sons), and Scripture calls them “the souls of his house” (in the plural) and this is because they worshipped many gods (each serving a different god and having as it were, a different soul or religious feeling). But the family of Jacob when he came to Egypt consisted of seventy and Scripture calls them “soul”, in the singular, because they all served One God. "}, {"ch": 46, "v": 27, "aliyah": 5, "heb": "וּבְנֵ֥י יוֹסֵ֛ף אֲשֶׁר־יֻלַּד־ל֥וֹ בְמִצְרַ֖יִם נֶ֣פֶשׁ שְׁנָ֑יִם כׇּל־הַנֶּ֧פֶשׁ לְבֵֽית־יַעֲקֹ֛ב הַבָּ֥אָה מִצְרַ֖יְמָה שִׁבְעִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבְנֵי יוֹסֵף דִּי אִתְיְלִידוּ לֵיהּ בְּמִצְרַיִם נַפְשָׁתָא תְרֵין כָּל נַפְשָׁתָא לְבֵית יַעֲקֹב דְּעַלּוּ לְמִצְרַיִם שִׁבְעִין:", "onk_en": "The sons of Yoseif who were born to him in Egypt were [another] two souls. All the souls of the house of Yaakov that came to Egypt were seventy.", "pj": "וּבְנוֹי דְיוֹסֵף דְאִתְיְלִידוּ לֵיהּ בְּמִצְרַיִם נַפְשָׁתָא תְּרֵין וְיוֹסֵף דַהֲוָה בְמִצְרַיִם וְיוֹכֶבֶד בְּרַת לֵוִי דְאִתְיְלִידַת בְּמִעַלְהוֹן לְמִצְרַיִם בֵּינֵי טוּרַיָא סְכוּם כָּל נַפְשָׁתָא לְבֵית יַעֲקב דְעָלָא לְמִצְרַיִם שׁוּבְעִין", "pj_en": "But the sons of Joseph who were born to him in Mizraim were two souls; and Joseph who was in Mizraim, and Jokebed the daughter of Levi, who was born among the hills in their journey to Mizraim, the sum of all the souls of the house of Jakob who came into Mizraim, seventy.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 28, "aliyah": 6, "heb": "וְאֶת־יְהוּדָ֞ה שָׁלַ֤ח לְפָנָיו֙ אֶל־יוֹסֵ֔ף לְהוֹרֹ֥ת לְפָנָ֖יו גֹּ֑שְׁנָה וַיָּבֹ֖אוּ אַ֥רְצָה גֹּֽשֶׁן׃", "onk": "וְיָת יְהוּדָה שְׁלַח קֳדָמוֹהִי לְוַת יוֹסֵף <b>לְפַנָּאָה קֳדָמוֹהִי<\/b> לְגשֶׁן וַאֲתוֹ לְאַרְעָא דְגשֶׁן:", "onk_en": "He [Yaakov] sent Yehudah ahead of him to Yoseif, so that he might direct him to [<b>clear a place before him in<\/b>] Goshen. They then came to the land of Goshen.", "pj": "וְיַת יְהוּדָה שָׁדַר קֳדָמוֹי לְוַת יוֹסֵף לִמְחַוְיָא קֳדָמוֹי אָרְחָא וּלְמִכְבְּשָׁא יַת עַמוּדַיָא דְאַרְעָא וּלְאָתַקְנָא קֳדָמוֹי בֵּית מֵישְׁרוֹי בְגוֹשְנָא וְאָתוֹ לְאַרְעָא דְגשֶׁן", "pj_en": "And he sent Jehuda before him to Joseph to indicate the way before him, to subdue the pillars of the earth, and to provide him a house of dwelling in Goshena. And they came to the land of Goshen.", "tj": "לְאַתְקָנָא לֵיהּ אָתַר בֵּית מֵישְׁרוֹי לְגוֹשְׁנָא:", "tj_en": "To prepare him a place of habitation in Goshena.", "rashi": "<b>להורת לפניו.<\/b> כְּתַרְגּוּמוֹ, לְפַנּוֹת לוֹ מָקוֹם, וּלְהוֹרוֹת הֵיאַךְ יִתְיַשֵּׁב בָּהּ:<br><br><b>לפניו.<\/b> קֹדֶם שֶׁיַּגִּיַע לְשָׁם. וּמִדְרַשׁ אַגָּדָה לְהוֹרוֹת לְפָנָיו – לְתַקֵּן לוֹ בֵּית תַּלְמוּד שֶׁמִּשָּׁם תֵּצֵא הוֹרָאָה:", "rashi_en": "להורת לפניו TO DIRECT HIM — Render this as the Targum does: to prepare a place for him and to show him how he should settle in it.<br><br>לפניו BEFORE HIM — means before he should arrive there. A Midrashic comment is: להורת לפניו (in the sense of, “that there might be teaching before him”) — to establish for him a House of Study from which Teaching (הוראה or תורה) might go forth (Genesis Rabbah 95:3). "}, {"ch": 46, "v": 29, "aliyah": 6, "heb": "וַיֶּאְסֹ֤ר יוֹסֵף֙ מֶרְכַּבְתּ֔וֹ וַיַּ֛עַל לִקְרַֽאת־יִשְׂרָאֵ֥ל אָבִ֖יו גֹּ֑שְׁנָה וַיֵּרָ֣א אֵלָ֗יו וַיִּפֹּל֙ עַל־צַוָּארָ֔יו וַיֵּ֥בְךְּ עַל־צַוָּארָ֖יו עֽוֹד׃", "onk": "וְטַקִּיס יוֹסֵף רְתִכּוֹהִי וּסְלֵיק לְקַדָּמוּת יִשְׂרָאֵל אֲבוּהִי לְגשֶׁן וְאִתְגְּלִי לֵיהּ וּנְפַל עַל צַוְּרֵיהּ וּבְכָא עַל צַוְּרֵיהּ עוֹד:", "onk_en": "Yoseif harnessed his chariot, and went up to greet his father, Yisrael in Goshen. [When] he appeared before him, he fell on his neck, and wept on his neck for a long time.", "pj": "וְטַקֵיס יוֹסֵף אַרְתִּיכֵיהּ וְסַלִיק לִקְדָמוּת יִשְרָאֵל אָבוּי לְגשֶׁן וְקָדָם דְאִשְׁתְּמוֹדְעֵיהּ אָבוֹי סְגַד לֵיהּ וְאִתְחַיֵיב לְמִיהֱוֵי שְׁנוֹי קְטִיעַן וּתְהָא וְאִתְחַמֵי לֵיהּ וּרְכִן עַל פְּרִיקַת צַוְורֵיהּ וּבְכָא עַל צַוְורֵיהּ תּוּב עַל דִסְגַד לֵיהּ", "pj_en": "And Joseph made ready his chariot, and went up to meet Israel his father in Goshen; and his father, before he recognised him, worshipped him, and thus became liable to be shortened (or cut off) in his years. And he wondered, and beheld him, and fell upon his neck, and wept still upon his neck, because he had worshipped him.", "tj": "", "tj_en": "", "rashi": "<b>ויאסר יוסף מרכבתו.<\/b> הוּא עַצְמוֹ אָסַר אֶת הַסּוּסִים לַמֶּרְכָּבָה לְהִזְדָּרֵז לִכְבוֹד אָבִיו:<br><br><b>וירא אליו.<\/b> יוֹסֵף נִרְאָה אֶל אָבִיו:<br><br><b>ויבך על צואריו עוד.<\/b> לְשׁוֹן הַרְבּוֹת בְּכִיָּה, וְכֵן כִּי לֹא עַל אִישׁ יָשִׂים עוֹד (איוב ל\"ד), לְשׁוֹן רִבּוּי הוּא – אֵינוֹ שָׂם עָלָיו עֲלִילוֹת נוֹסָפוֹת עַל חֲטָאָיו; אַף כָּאן הִרְבָּה וְהוֹסִיף בִּבְכִי יוֹתֵר עַל הָרָגִיל; אֲבָל יַעֲקֹב לֹא נָפַל עַל צַוְּארֵי יוֹסֵף וְלֹא נְשָׁקוֹ, וְאָמְרוּ רַבּוֹתֵינוּ, שֶׁהָיָה קוֹרֵא אֶת שְׁמַע:", "rashi_en": "ויאסר יוסף מרכבתו AND JOSEPH MADE READY (literally, bound, harnessed) HIS CHARIOT — He himself harnessed the horses to the chariot being eager to show honour to his father (Genesis Rabbah 95:8; Mechilta to בשלח).<br><br>וירא אליו  AND HE APPEARED BEFORE HIM — Joseph appeared before his father.<br><br>ויבך על צואריו עוד AND WEPT ON HIS NECK A GOOD WHILE — The phrase ויבך עוד signifies weeping copiously. So, too, עוד has the same meaning in (Job 34:23) “For He doth not place upon a man עוד” — which means something more than is proper: God does not place on him accusations additional to his sins (the sins he has really committed) Here, also, he wept greatly and continuously — more than is usual. Jacob, however, did not fall upon Joseph’s neck nor did he kiss him. Our Rabbis say: the reason was that he was reciting the Shema (renewing his allegiance to God immediately on settling in a new land). "}, {"ch": 46, "v": 30, "aliyah": 6, "heb": "וַיֹּ֧אמֶר יִשְׂרָאֵ֛ל אֶל־יוֹסֵ֖ף אָמ֣וּתָה הַפָּ֑עַם אַחֲרֵי֙ רְאוֹתִ֣י אֶת־פָּנֶ֔יךָ כִּ֥י עוֹדְךָ֖ חָֽי׃", "onk": "וַאֲמַר יִשְׂרָאֵל לְיוֹסֵף <b>אִלּוּ אֲנָא מָיִת זִמְנָא הָדָא מְנַחֵם אֲנָא<\/b> בָּתַר דַּחֲזֵיתִי יָת אַפָּיךְ אֲרֵי עַד כְּעַן אַתְּ קַיָּם:", "onk_en": "Yisrael said to Yoseif, Now I can [<b>If I were to<\/b>] die [<b>now I will have been consoled<\/b>]; after I have seen your face that you are alive.", "pj": "וַאֲמַר יִשְרָאֵל לְיוֹסֵף אִין מַיְיתָנָא בַּהֲדָא זִמְנָא מִתְנַחֵם אֲנָא דִי בְמֵיתוּתָא דְמַיְיתִין בָּהּ צַדִיקַיָא אֲנָא מַיִית בָּתַר דְחָמִית סְבַר אַפָּךְ אֲרוּם עַד כְּדוֹן אַנְתְּ קַיָים", "pj_en": "And Israel said to Joseph, If at this time I die, I am Comforted: for with the death that the righteous die shall I die, after seeing thy face, because thou art yet alive.", "tj": "", "tj_en": "", "rashi": "<b>אמותה הפעם.<\/b> פְּשׁוּטוֹ כְתַרְגּוּמוֹ. וּמִדְרָשׁוֹ סָבוּר הָיִיתִי לָמוּת שְׁתֵּי מִיתוֹת, בָּעוֹלָם הַזֶּה וְלָעוֹלָם הַבָּא, שֶׁנִּסְתַּלְּקָה מִמֶּנִּי שְׁכִינָה, וְהָיִיתִי אוֹמֵר שֶׁיִּתְבָּעֵנִי הַקָּבָּ\"ה מִיתָתְךָ, עַכְשָׁו שֶׁעוֹדְךָ חַי, לֹא אָמוּת אֶלָּא פַעַם אַחַת:", "rashi_en": "אמותה הפעם NOW, I WILL FAIN DIE — It's literal meaning is as the Targum renders it. A Midrashic explanation is (being based upon the literal translation. “I will die this once”): I had thought that I would die two deaths, in this world and also in the world to come, because the Divine Presence departed from me and I therefore thought that God would hold me responsible for your death. Now, since you are alive I will die only once, in this world (Midrash Tanchuma, Vayigash 9)."}, {"ch": 46, "v": 31, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יוֹסֵ֤ף אֶל־אֶחָיו֙ וְאֶל־בֵּ֣ית אָבִ֔יו אֶעֱלֶ֖ה וְאַגִּ֣ידָה לְפַרְעֹ֑ה וְאֹֽמְרָ֣ה אֵלָ֔יו אַחַ֧י וּבֵית־אָבִ֛י אֲשֶׁ֥ר בְּאֶֽרֶץ־כְּנַ֖עַן בָּ֥אוּ אֵלָֽי׃", "onk": "וַאֲמַר יוֹסֵף לַאֲחוֹהִי וּלְבֵית אֲבוּהִי אֶסַּק וְאֵחַוֵּי לְפַרְעֹה וְאֵימַר לֵיהּ אַחַי וּבֵית אַבָּא דִּי בְאַרְעָא דִכְנַעַן עַלּוּ לְוָתִי:", "onk_en": "Yoseif said to his brothers and to his father’s household, I will go up and tell Pharaoh. I will say to him, My brothers and my father’s household, who were in the land of Canaan, have come to me.", "pj": "וַאֲמַר יוֹסֵף לְאָחוֹי וּלְבֵית אָבוֹי אִיסַק וְאַתְנֵי לְפַרְעה וְאֵימַר לֵיהּ אַחַי וּבֵית אַבָּא דִבְאַרְעָא דִכְנָעַן אָתוֹ לְוָתִי", "pj_en": "And Joseph said to his brethren and his father's house, I will go up and tell Pharoh, and say to him, My brethren and my father's house from the land of Kenaan have come to me.", "tj": "", "tj_en": "", "rashi": "<b>ואמרה אליו אחי וגו'.<\/b> וְעוֹד אֹמַר לוֹ, <b>והאנשים רועי צאן וגו'<\/b>:", "rashi_en": "'ואמרה אליו אחי וגו AND I WILL SAY TO HIM— “MY BRETHREN … have come unto me” and further I will say to him, והאנשים רעי צאן 'וגו AND THE MEN ARE SHEPHERDS etc. "}, {"ch": 46, "v": 32, "aliyah": 6, "heb": "וְהָאֲנָשִׁים֙ רֹ֣עֵי צֹ֔אן כִּֽי־אַנְשֵׁ֥י מִקְנֶ֖ה הָי֑וּ וְצֹאנָ֧ם וּבְקָרָ֛ם וְכׇל־אֲשֶׁ֥ר לָהֶ֖ם הֵבִֽיאוּ׃", "onk": "וְגֻבְרַיָּא רָעֵי עָנָא אֲרֵי גֻבְרֵי מָרֵי גֵיתֵי הֲווֹ וְעָנְהוֹן וְתוֹרְהוֹן וְכָל דִּי לְהוֹן אַיְתִיאוּ:", "onk_en": "The men are shepherds, for they are owners of livestock. Their sheep, their cattle, and all their possessions, they have brought [with them.]", "pj": "וְגוּבְרַיָא רַעֲיָין דְעָאָן אֲרוּם גוּבְרֵי מָרֵי גֵיתֵי הֲווֹ וְעַנְהוֹן וְתוֹרֵיהוֹן וְכָל דִילְהוֹן אַיְיתִיאוּ", "pj_en": "The men are pastors of sheep; for they are men, the masters of flocks; and their sheep and oxen and all which they have, they have brought.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 33, "aliyah": 6, "heb": "וְהָיָ֕ה כִּֽי־יִקְרָ֥א לָכֶ֖ם פַּרְעֹ֑ה וְאָמַ֖ר מַה־מַּעֲשֵׂיכֶֽם׃", "onk": "וִיהֵי אֲרֵי יִקְרֵי לְכוֹן פַּרְעֹה וְיֵימַר מָה עוֹבָדֵיכוֹן:", "onk_en": "And when Pharaoh calls you, and says, What is your occupation,", "pj": "וִיהֵי אֲרוּם יִקְרֵי לְכוֹם פַּרְעה וְיֵימַר תָּנוּן לִי מַה עוֹבָדֵיכוֹן", "pj_en": "And it must be, when Pharoh calleth you, and saith, Tell me, what is your work?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 46, "v": 34, "aliyah": 6, "heb": "וַאֲמַרְתֶּ֗ם אַנְשֵׁ֨י מִקְנֶ֜ה הָי֤וּ עֲבָדֶ֙יךָ֙ מִנְּעוּרֵ֣ינוּ וְעַד־עַ֔תָּה גַּם־אֲנַ֖חְנוּ גַּם־אֲבֹתֵ֑ינוּ בַּעֲב֗וּר תֵּשְׁבוּ֙ בְּאֶ֣רֶץ גֹּ֔שֶׁן כִּֽי־תוֹעֲבַ֥ת מִצְרַ֖יִם כׇּל־רֹ֥עֵה צֹֽאן׃", "onk": "וְתֵימְרוּן גֻּבְרֵי מָרֵי גֵיתֵי הֲווֹ עַבְדָּיךְ מֵעוּלֵמָנָא וְעַד כְּעַן אַף אֲנַחְנָא אַף אֲבְהָתָנָא בְּדִיל דִּי תֵיתְבוּן בְּאַרְעָא דְגשֶׁן <b>אֲרֵי מְרַחֲקִין מִצְרָאֵי כָּל רָעֵי עָנָא<\/b>:", "onk_en": "You should say, Your servants have been livestock owners from our youth until now, we and our fathers; so that you will be able to settle in the land of Goshen, since every shepherd is abhorrent to Egypt [<b>the Egyptians make distant all shepherds<\/b>].", "pj": "וְתֵימְרוּן מָרֵי גֵיתֵי הֲווֹ עַבְדָךְ מִטַלְיוּתָנָא וְעַד כְּדוּן בְּגִין דְתֵיתְבוּן בְּאַרְעָא דְגשֶׁן אֲרוּם מְרַחְקִין מִצְרָאֵי כָּל רָעֵי עָנָא", "pj_en": "you must say, Thy servants have been masters of flocks from our youth until now: that you may dwell in the land of Goshen; because the Mizraee reject all shepherds.", "tj": "", "tj_en": "", "rashi": "<b>בעבור תשבו בארץ גשן.<\/b> וְהִיא צְרִיכָה לָכֶם שֶׁהִיא אֶרֶץ מִרְעֶה, וּכְשֶׁתֹּאמְרוּ לוֹ שֶׁאֵין אַתֶּם בְּקִיאִין בִּמְלָאכָה אַחֶרֶת, יַרְחִיקְכֶם מֵעָלָיו וְיוֹשִׁיבְכֶם שָׁם:<br><br><b>כי תועבת מצרים כל רועה צאן.<\/b> לְפִי שֶׁהֵם לָהֶם אֱלֹהוּת:", "rashi_en": "בעבור תשבו בארץ גשן IN ORDER THAT YE MAY ABIDE IN THE LAND OF GOSHEN — and this is the land that you require, for it is a land of pasture. If you tell him that you are inexperienced in other work he will send you far away from him and settle you there.<br><br>כי תועבת מצרים כל רעה צאן FOR EVERY SHEPHERD IS AN ABOMINATION TO THE EGYPTIANS — because they (sheep) are regarded by them as deities."}, {"ch": 47, "v": 1, "aliyah": 6, "heb": "וַיָּבֹ֣א יוֹסֵף֮ וַיַּגֵּ֣ד לְפַרְעֹה֒ וַיֹּ֗אמֶר אָבִ֨י וְאַחַ֜י וְצֹאנָ֤ם וּבְקָרָם֙ וְכׇל־אֲשֶׁ֣ר לָהֶ֔ם בָּ֖אוּ מֵאֶ֣רֶץ כְּנָ֑עַן וְהִנָּ֖ם בְּאֶ֥רֶץ גֹּֽשֶׁן׃", "onk": "וַאֲתָא יוֹסֵף וְחַוִּי לְפַרְעֹה וַאֲמַר אַבָּא וְאַחַי וְעָנְהוֹן וְתוֹרְהוֹן וְכָל דִּי לְהוֹן אֲתוֹ מֵאַרְעָא דִכְנָעַן וְהָא אִנּוּן בְּאַרְעָא דְגשֶׁן:", "onk_en": "Yoseif came and told Pharaoh, and he said, My father, and my brothers, their sheep, their cattle, and all their possessions, have come from the land of Canaan, and they are now in the land of Goshen.", "pj": "וְאָתָא יוֹסֵף וְתַנֵי לְפַרְעה וַאֲמַר אַבָּא וְאַחַי וְעַנְהוֹן וְתוֹרֵיהוֹן וְכָל דִלְהוֹן אָתוֹ מֵאַרְעָא דִכְנָעַן וְהָא אִינוּן בְּאַרְעָא דְגשֶׁן", "pj_en": "And Joseph came and informed Pharoh, and said, My father and my brethren, with their sheep all oxen and all that they have, are come from the land of Kenaan, and, behold, they are in the land of Goshen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 47, "v": 2, "aliyah": 6, "heb": "וּמִקְצֵ֣ה אֶחָ֔יו לָקַ֖ח חֲמִשָּׁ֣ה אֲנָשִׁ֑ים וַיַּצִּגֵ֖ם לִפְנֵ֥י פַרְעֹֽה׃", "onk": "וּמִקְצַת מִן אֲחוֹהִי דְּבַר חַמְשָׁא גֻבְרִין וַאֲקֵימִנּוּן קֳדָם פַּרְעֹה:", "onk_en": "From among his brothers, he took five men, and he presented them to Pharaoh.", "pj": "וּמִקְצַת אָחוֹי דַבֵּר חֲמְשָׁא גוּבְרִין זְבֻלוּן דָן וְנַפְתָּלִי גָד וְאָשֵׁר וַאֲקֵימִינוּן קֳדָם פַּרְעה", "pj_en": "And from the extreme of his brethren he took five men, Zebulon, Dan, Naphtali, Gad, and Asher, and resented them before Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>ומקצה אחיו.<\/b> מִן הַפְּחוּתִים שֶׁבָּהֶם לִגְבוּרָה, שֶׁאֵין נִרְאִים גִּבּוֹרִים, שֶׁאִם יִרְאֶה אוֹתָם גִּבּוֹרִים יַעֲשֶׂה אוֹתָם אַנְשֵׁי מִלְחַמְתּוֹ, וְאֵלֶּה הֵם: רְאוּבֵן, שִׁמְעוֹן, לֵוִי, יִשָּׂשכָר וּבִנְיָמִין – אוֹתָן שֶׁלֹּא כָּפַל מֹשֶׁה שְׁמוֹתָם כְּשֶׁבֵּרְכָן; אֲבָל שְׁמוֹת הַגִּבּוֹרִים כָּפַל וְזֹאת לִיהוּדָה שְׁמַע ה' קוֹל יְהוּדָה; וּלְגָד אָמַר בָּרוּךְ מַרְחִיב גָּד; וּלְנַפְתָּלִי אָמַר נַפְתָּלִי, וּלְדָן אָמַר דָּן, וְכֵן לִזְבוּלוּן, וְכֵן לְאָשֵׁר; זֶהוּ לְשׁוֹן בְּ\"רַ, שֶׁהִיא אַגָּדַת אֶרֶץ יִשְׂרָאֵל. אֲבָל בְּתַלְמוּד בַּבְלִית שֶׁלָּנוּ (בבא קמא צ\"ב) מָצִינוּ, שֶׁאוֹתָן שֶׁכָּפַל מֹשֶׁה שְׁמוֹתָן הֵם הַחַלָּשִׁים, וְאוֹתָן הֵבִיא לִפְנֵי פַרְעֹה, וִיהוּדָה שֶׁהֻכְפַּל שְׁמוֹ לֹא הֻכְפַּל מִשּׁוּם חַלָּשׁוּת, אֶלָּא טַעַם יֵשׁ בַּדָּבָר, כִּדְאִיתָא בְּבָ\"קַ וּבְבָרַיְתָא דְּסִפְרֵי שָׁנִינוּ בָהּ בִּוְזֹאת הַבְּרָכָה, כְּמוֹ תַּלְמוּד שֶׁלָּנוּ:", "rashi_en": "ומקצה אחיו SOME OF HIS BRETHREN — Some of the inferior ones amongst them as to strength — of those who did not look robust. For should Pharaoh find them to be robust men he might press them for military service. The weaker brethren were as follows: Reuben, Simeon, Levi, Issachar and Benjamin, and it was they whose names Moses did not repeat when he blessed them. But the names of the strong ones he mentioned twice: (Deuteronomy 33:7) “And this is for Judah ... hear, Eternal, the voice of Judah”; (Deuteronomy 33:20) “And of Gad he said, Blessed he lie that extendeth Gad”; (Deuteronomy 33:25) “And of Naphtali he said, Naphtali ...” (Deuteronomy 33:22). “And of Dan he said Dan . . .”, and in like manner he repeated the names of Zebulun (Deuteronomy 33:18) and of Asher (Deuteronomy 33:24). This is the version of Genesis Rabbah 95:4 which is a Palestinian Agada. But in our Babylonian Talmud we find that those whose names Moses mentioned twice were the weaker of the brethren and it was these whom he (Joseph) brought before Pharaoh. But six are enumerated above as having their names mentioned twice and he brought only five before Pharaoh. The explanation is that it is true that Judah’s name is mentioned twice, but it is mentioned twice not because he was one of the weaker brethren, but there is another reason for this, as is stated in Bava Kamma 92a. In the Baraitha of Siphre on וזאת הברכה we have the same version as in our Babylonian Talmud. "}, {"ch": 47, "v": 3, "aliyah": 6, "heb": "וַיֹּ֧אמֶר פַּרְעֹ֛ה אֶל־אֶחָ֖יו מַה־מַּעֲשֵׂיכֶ֑ם וַיֹּאמְר֣וּ אֶל־פַּרְעֹ֗ה רֹעֵ֥ה צֹאן֙ עֲבָדֶ֔יךָ גַּם־אֲנַ֖חְנוּ גַּם־אֲבוֹתֵֽינוּ׃", "onk": "וַאֲמַר פַּרְעֹה לַאֲחוֹהִי מָה עוֹבָדֵיכוֹן וַאֲמָרוּ לְפַרְעֹה רָעֵי עָנָא עַבְדָּיךְ אַף אֲנַחְנָא אַף אֲבְהָתָנָא:", "onk_en": "Pharaoh said to his brothers, What is your occupation? They said to Pharaoh, Your servants are shepherds, we and our fathers.", "pj": "וַאֲמַר פַּרְעה לְאָחוֹי דְיוֹסֵף מַה עוֹבָדֵיכוֹן וַאֲמָרוּ לְפַרְעה רָעֵי עָנָא הֲווֹ עַבְדָךְ אוּף אֲנָן אוּף אֲבָהָתָן", "pj_en": "And Pharoh said to Joseph's brethren, What is your work?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 47, "v": 4, "aliyah": 6, "heb": "וַיֹּאמְר֣וּ אֶל־פַּרְעֹ֗ה לָג֣וּר בָּאָ֘רֶץ֮ בָּ֒אנוּ֒ כִּי־אֵ֣ין מִרְעֶ֗ה לַצֹּאן֙ אֲשֶׁ֣ר לַעֲבָדֶ֔יךָ כִּֽי־כָבֵ֥ד הָרָעָ֖ב בְּאֶ֣רֶץ כְּנָ֑עַן וְעַתָּ֛ה יֵֽשְׁבוּ־נָ֥א עֲבָדֶ֖יךָ בְּאֶ֥רֶץ גֹּֽשֶׁן׃", "onk": "וַאֲמָרוּ לְוַת פַּרְעֹה לְאִתּוֹתָבָא בְאַרְעָא אֲתֵינָא אֲרֵי לֵית רַעֲיָא לְעָנָא דִּי לְעַבְדָּיךְ אֲרֵי תַקִּיף כַּפְנָא בְּאַרְעָא דִכְנָעַן וּכְעַן יֵתְבוּן <b>כְּעַן<\/b> עַבְדָּיךְ בְּאַרְעָא דְגשֶׁן:", "onk_en": "They said to Pharaoh, We have come to live in the land temporarily, since there is no pasture for your servant’s flocks, because the famine is severe in the land of Canaan. Now then, please let your servants [<b>now<\/b>] settle in the land of Goshen.", "pj": "וַאֲמָרוּ לְפַרְעה לְאִיתוֹתָבָא בְּאַרְעָא אָתֵינָא אֲרוּם לֵית אַתַר בֵּית רַעֲיָא לְעָנָא דִלְעַבְדָךְ אֲרוּם תְּקֵיף כַּפְנָא בְּאַרְעָא דִכְנָעַן וּכְדוּן יֵתְבוּן כְּעַן עַבְדָךְ בְּאַרְעָא דְגשֶׁן", "pj_en": "And they said to Pharoh, Thy servants are pastors of sheep, both we and our fathers. And they said to Pharoh, To dwell in the land are we come, because there is no place of pasture for thy servants' sheep, for the famine hath prevailed in the land of Kenaan; let thy servants therefore now dwell in the land of Goshen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 47, "v": 5, "aliyah": 6, "heb": "וַיֹּ֣אמֶר פַּרְעֹ֔ה אֶל־יוֹסֵ֖ף לֵאמֹ֑ר אָבִ֥יךָ וְאַחֶ֖יךָ בָּ֥אוּ אֵלֶֽיךָ׃", "onk": "וַאֲמַר פַּרְעֹה לְיוֹסֵף לְמֵימָר אֲבוּךְ וְאַחָיךְ אֲתוֹ לְוָתָךְ:", "onk_en": "Pharaoh said to Yoseif, Your father and your brothers have come to you.", "pj": "וַאֲמַר פַּרְעה לְיוֹסֵף לְמֵימַר אָבוּךְ וְאָחָךְ אָתוֹ לְוָותָךְ", "pj_en": "And Pharoh spake to Joseph, saying, Thy father and thy brethren have come to thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 47, "v": 6, "aliyah": 6, "heb": "אֶ֤רֶץ מִצְרַ֙יִם֙ לְפָנֶ֣יךָ הִ֔וא בְּמֵיטַ֣ב הָאָ֔רֶץ הוֹשֵׁ֥ב אֶת־אָבִ֖יךָ וְאֶת־אַחֶ֑יךָ יֵשְׁבוּ֙ בְּאֶ֣רֶץ גֹּ֔שֶׁן וְאִם־יָדַ֗עְתָּ וְיֶשׁ־בָּם֙ אַנְשֵׁי־חַ֔יִל וְשַׂמְתָּ֛ם שָׂרֵ֥י מִקְנֶ֖ה עַל־אֲשֶׁר־לִֽי׃", "onk": "אַרְעָא דְמִצְרַיִם קֳדָמָךְ הִיא בִּדְשַׁפִּיר בְּאַרְעָא אוֹתֵיב יָת אֲבוּךְ וְיָת אַחָיךְ יֵתְבוּן בְּאַרְעָא דְגשֶׁן וְאִם יָדַעְתְּ וְאִית בְּהוֹן גֻּבְרִין דְּחֵילָא וּתְמַנִּנּוּן רַבָּנֵי גֵיתֵי עַל דִּי לִי:", "onk_en": "The land of Egypt is before you. In the best of the land, settle your father and your brothers. Let them settle in the land of Goshen. If you know of capable men among them, appoint them livestock officers over my [herds.]", "pj": "אַרְעָא דְמִצְרַיִם קֳדָמָךְ הוּא בְּבֵית שְׁפַר אַרְעָא אוֹתִיב יַת אַבָּךְ וְיַת אָחָךְ יֵתְבוּן בְּאַרְעָא דְגשֶׁן וְאִין חַכִּימְתָּא דְאִית בְּהוֹם גוּבְרִין דְחֵילָא וּתְמַנִינוּן רַבָּנֵי גֵיתֵי עַל דִידִי", "pj_en": "The land of Mizraim is before thee. In the fairest part of the land make thy father and thy brethren to dwell: let them dwell in the land of Goshen. And if thou know any among them men of ability, appoint them masters over my flocks.", "tj": "", "tj_en": "", "rashi": "<b>אנשי חיל.<\/b> בְּקִיאִין בְּאֻמָּנוּתָן לִרְעוֹת צֹאן:<br><br><b>על אשר לי.<\/b> עַל צֹאן שֶׁלִּי:", "rashi_en": "אנשי חיל MEN OF ACTIVITY — skilled in their occupation of tending sheep.<br><br>על אשר לי OVER THAT WHICH IS MINE — over my sheep."}, {"ch": 47, "v": 7, "aliyah": 6, "heb": "וַיָּבֵ֤א יוֹסֵף֙ אֶת־יַֽעֲקֹ֣ב אָבִ֔יו וַיַּֽעֲמִדֵ֖הוּ לִפְנֵ֣י פַרְעֹ֑ה וַיְבָ֥רֶךְ יַעֲקֹ֖ב אֶת־פַּרְעֹֽה׃", "onk": "וְאַיְתִי יוֹסֵף יָת יַעֲקֹב אֲבוּהִי וַאֲקִימִנֵּיהּ קֳדָם פַּרְעֹה וּבָרִיךְ יַעֲקֹב יָת פַּרְעֹה:", "onk_en": "Yoseif [then] brought in Yaakov, his father, and presented him to Pharaoh; and Yaakov blessed Pharaoh.", "pj": "וְאַיְיתֵי יוֹסֵף יַת יַעֲקב אָבוּי וַאֲקִימֵיהּ קֳדָם פַּרְעה וּבְרִיךְ יַעֲקב יַת פַּרְעה וַאֲמַר יְהֵי רַעֲוָא דְיִתְמְלוּן מוֹי דְנִילוּס וְיַעֲדֵי כַּפְנָא מִן עַלְמָא בְּיוֹמָךְ", "pj_en": "And Joseph brought Jakob his father, and presented him before Pharoh. And Jakob blessed Pharoh, and said, May it please the Almighty that the waters of Nilos may be replenished, and may the famine pass away from the world in thy days!", "tj": "", "tj_en": "", "rashi": "<b>ויברך יעקב.<\/b> הִיא שְׁאִילַת שָׁלוֹם כְּדֶרֶךְ כָּל הַנִּרְאִים לִפְנֵי הַמְּלָכִים לִפְרָקִים, שלו\"איר בְּלַעַז:", "rashi_en": "ויברך יעקב AND JACOB BLESSED — this was the greeting of peace, as is usual in the case of all who are granted an interview with kings at long intervals; saluer in old French "}, {"ch": 47, "v": 8, "aliyah": 6, "heb": "וַיֹּ֥אמֶר פַּרְעֹ֖ה אֶֽל־יַעֲקֹ֑ב כַּמָּ֕ה יְמֵ֖י שְׁנֵ֥י חַיֶּֽיךָ׃", "onk": "וַאֲמַר פַּרְעֹה לְיַעֲקֹב כַּמָּה יוֹמֵי שְׁנֵי חַיָּךְ:", "onk_en": "Pharaoh said to Yaakov, How many are the years of your life?", "pj": "וַאֲמַר פַּרְעה לְיַעֲקב כַּמָה אִינוּן יוֹמֵי שְׁנֵי חַיָיךְ", "pj_en": "And Pharoh said to Jakob, How many are the days of the years of thy life?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 47, "v": 9, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־פַּרְעֹ֔ה יְמֵי֙ שְׁנֵ֣י מְגוּרַ֔י שְׁלֹשִׁ֥ים וּמְאַ֖ת שָׁנָ֑ה מְעַ֣ט וְרָעִ֗ים הָיוּ֙ יְמֵי֙ שְׁנֵ֣י חַיַּ֔י וְלֹ֣א הִשִּׂ֗יגוּ אֶת־יְמֵי֙ שְׁנֵי֙ חַיֵּ֣י אֲבֹתַ֔י בִּימֵ֖י מְגוּרֵיהֶֽם׃", "onk": "וַאֲמַר יַעֲקֹב לְפַרְעֹה יוֹמֵי שְׁנֵי תוֹתָבוּתַי מְאָה וּתְלָתִין שְׁנִין זְעֵירִין וּבִישִׁין הֲווֹ יוֹמֵי שְׁנֵי חַיַּי וְלָא אַדְבִּיקוּ יָת יוֹמֵי שְׁנֵי חַיֵּי אֲבָהָתַי בְּיוֹמֵי תּוֹתָבוּתְהוֹן:", "onk_en": "Yaakov said to Pharaoh, The years of my temporary residence are one hundred and thirty years. Few and troublesome have been the days of my life. I have not attained the years of my father’s lives, in the days of their temporary residence.", "pj": "וַאֲמַר יַעֲקב לְפַרְעה יוֹמֵי שְׁנֵי תּוֹתָבוּתַיי מְאָה וּתְלָתִין שְׁנִין קַלִילִין וּבִישִׁין הֲווֹ יוֹמֵי שְׁנֵי חַיַי דְמִן טַלְיוּתִי עֲרָקִית מִן קֳדָם עֵשָו אָחִי וְאִיתוֹתָבִית בְּאַרְעָא דְלָא דִידִי וּכְדוּן בְּעִידָן סֵיבְתִּי נַחְתִית לְאִיתּוֹתָבָא הָכָא וְלָא אַדְבִּיקוּ יוֹמֵי יַת יוֹמֵי שְׁנֵי חַיֵי אַבְהָתִי בְּיוֹמֵי תּוֹתָבוּתְהוֹן", "pj_en": "And Jakob answered Pharoh, The days of the years of my pilgrimage are an hundred and thirty years. Few and evil have been the days of the years of my life; for in my youth I fled before Esau my brother, and sojourned in a land not my own; and now in the time of my old age have I come down to sojourn here. And my days have not reached the days of the years of the life of my fathers in the days of their pilgrimage.", "tj": "", "tj_en": "", "rashi": "<b>שני מגורי.<\/b> יְמֵי גֵרוּתִי; כָּל יָמַי הָיִיתִי גֵּר בָּאָרֶץ:<br><br><b>ולא השיגו.<\/b> בְּטוֹבָה:", "rashi_en": "שני מגורי — means the days of my being a stranger. All my days I have been a stranger in other peoples’ lands.<br><br>ולא השיגו AND THEY HAVE NOT ATTAINED so far as happiness is concerned. "}, {"ch": 47, "v": 10, "aliyah": 6, "heb": "וַיְבָ֥רֶךְ יַעֲקֹ֖ב אֶת־פַּרְעֹ֑ה וַיֵּצֵ֖א מִלִּפְנֵ֥י פַרְעֹֽה׃", "onk": "וּבָרִיךְ יַעֲקֹב יָת פַּרְעֹה וּנְפַק מִן קֳדָם פַּרְעֹה:", "onk_en": "Yaakov blessed Pharaoh, and left Pharaoh’s presence.", "pj": "וּבְרִיךְ יַעֲקב יַת פַּרְעה וּנְפַק מִן קֳדָם פַּרְעה", "pj_en": "And Jakob blessed Pharoh, and went out from before Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>ויברך יעקב.<\/b> כְּדֶרֶךְ כָּל הַנִּפְטָרִים מִלִּפְנֵי שָׂרִים מְבָרְכִים אוֹתָם וְנוֹטְלִים רְשׁוּת, וּמַה בְּרָכָה בֵּרְכוֹ? שֶׁיַּעֲלֶה נִילוּס לְרַגְלָיו, לְפִי שֶׁאֵין מִצְרַיִם שׁוֹתָה מֵי גְשָׁמִים אֶלָּא נִילוּס עוֹלֶה וּמַשְׁקֶה, וּמִבִּרְכָתוֹ שֶׁל יַעֲקֹב וָאֵילָךְ הָיָה פַרְעֹה בָא אֶל נִילוּס וְהוּא עוֹלֶה לִקְרָאתוֹ וּמַשְׁקֶה אֶת הָאָרֶץ (תַּנְחוּמָא):", "rashi_en": "ויברך יעקב AND JACOB BLESSED [PHARAOH] — i.e. he gave him the salutation of peace as is usual for all who take their leave of princes — they salute them and depart. A Midrash however understands this more literally and asks, “What was the blessing with which he blessed him? That the waters of the Nile might rise at his approach Because Egypt does not drink (is not irrigated by) rain-water, but the waters of the Nile rise and irrigate it. And from the time when Jacob blessed him and henceforth, whenever Pharaoh came to the Nile it rose at his coming, overflowed its banks and watered the land. Thus it is stated in Tanchuma Yashan 4:2:26 to נשא."}, {"ch": 47, "v": 11, "aliyah": 7, "heb": "וַיּוֹשֵׁ֣ב יוֹסֵף֮ אֶת־אָבִ֣יו וְאֶת־אֶחָיו֒ וַיִּתֵּ֨ן לָהֶ֤ם אֲחֻזָּה֙ בְּאֶ֣רֶץ מִצְרַ֔יִם בְּמֵיטַ֥ב הָאָ֖רֶץ בְּאֶ֣רֶץ רַעְמְסֵ֑ס כַּאֲשֶׁ֖ר צִוָּ֥ה פַרְעֹֽה׃", "onk": "וְאוֹתֵיב יוֹסֵף יָת אֲבוּהִי וְיָת אֲחוֹהִי וִיהַב לְהוֹן אַחֲסָנָא בְּאַרְעָא דְמִצְרַיִם בִּדְשַׁפִּיר בְּאַרְעָא בְּאַרְעָא דְרַעְמְּסֵס כְּמָא דִי פַקִּיד פַּרְעֹה:", "onk_en": "Yoseif settled his father and his brothers, and gave them a possession in the land of Egypt, in the best part of the land, in the land of Ramseis, as Pharaoh had ordered.", "pj": "וְאוֹתִיב יוֹסֵף יַת אָבוֹי וְיַת אָחוֹי וִיהַב לְהוֹן אַחְסָנָא בְּאַרְעָא דְמִצְרַיִם בְּבֵית שְׁפַר אַרְעָא בְּאַרְעָא דְפִילוּסִין הֵיכְמָא דְפַקֵיד פַּרְעה", "pj_en": "And Joseph brought his father and brethren to dwell, and gave them a possession in the land of Mizraim, in a goodly part of the country, in the country of Pilusin, as Pharoh had commanded.", "tj": "וּפִלוּסִם:", "tj_en": "Pelusim.", "rashi": "<b>רעמסס.<\/b> מֵאֶרֶץ גֹּשֶׁן הִיא:", "rashi_en": "רעמסס RAMESES — This is part the land of Goshen. "}, {"ch": 47, "v": 12, "aliyah": 7, "heb": "וַיְכַלְכֵּ֤ל יוֹסֵף֙ אֶת־אָבִ֣יו וְאֶת־אֶחָ֔יו וְאֵ֖ת כׇּל־בֵּ֣ית אָבִ֑יו לֶ֖חֶם לְפִ֥י הַטָּֽף׃", "onk": "וְזָן יוֹסֵף יָת אֲבוּהִי וְיָת אֲחוֹהִי וְיָת כָּל בֵּית אֲבוּהִי לַחְמָא לְפוּם טַפְלָא:", "onk_en": "Yoseif provided his father, his brothers, and all his father’s household with bread according to [the needs of] the children.", "pj": "וְזָן יוֹסֵף יַת אָבוּהִי וְיַת אָחוֹי וְיַת כָּל בֵּית אָבוֹי לַחְמָא לְפוּם דְמִצְטָרֵךְ לְטַפְלַיָיא", "pj_en": "And Joseph sustained his father and his brethren and all his father's house with bread, according to the need of their families.", "tj": "", "tj_en": "", "rashi": "<b>לפי הטף.<\/b> לְפִי הַצָּרִיךְ לְכָל בְּנֵי בֵיתָם:", "rashi_en": "לפי הטף ACCORDING TO THEIR LITTLE ONES — according to the requirements of all their household."}, {"ch": 47, "v": 13, "aliyah": 7, "heb": "וְלֶ֤חֶם אֵין֙ בְּכׇל־הָאָ֔רֶץ כִּֽי־כָבֵ֥ד הָרָעָ֖ב מְאֹ֑ד וַתֵּ֜לַהּ אֶ֤רֶץ מִצְרַ֙יִם֙ וְאֶ֣רֶץ כְּנַ֔עַן מִפְּנֵ֖י הָרָעָֽב׃", "onk": "וְלַחְמָא לֵית בְּכָל אַרְעָא אֲרֵי תַקִּיף כַּפְנָא לַחֲדָא וְאִשְׁתַּלְהֵי <b>עַמָּא<\/b> דְאַרְעָא דְמִצְרַיִם וְעַמָּא דְאַרְעָא דִכְנַעַן מִן קֳדָם כַּפְנָא:", "onk_en": "There was no bread in all the land, for the famine was very severe. The [<b>the people of the<\/b>] land of Egypt, and Canaan were worn out because of the famine.", "pj": "וְלַחְמָא לֵית בְּכָל אַרְעָא אַרוּם תַּקִיף כַּפְנָא לַחֲדָא וְאִשְׁתַּלְהוֹן דַיְירֵי אַרְעָא דְמִצְרַיִם וְדַיְירֵי אַרְעָא דִכְנָעַן מִן קֳדָם כַּפְנָא", "pj_en": "But there was no bread (grown) in all the land, because the famine prevailed greatly, and the inhabitants of the land of Mizraim failed, and the dwellers in the land of Kenaan, in presence of the famine.", "tj": "", "tj_en": "", "rashi": "<b>ולחם אין בכל הארץ.<\/b> חוֹזֵר לָעִנְיָן הָרִאשׁוֹן – לִתְחִלַּת שְׁנֵי הָרָעָב:<br><br><b>ותלה.<\/b> כְּמוֹ וַתִּלְאֶה, לְשׁוֹן עֲיֵפוּת, כְּתַרְגּוּמוֹ; וְדוֹמֶה לוֹ כְּמִתְלַהְלֵהַּ הַיֹּרֶה זִקִּים (משלי כ\"ו):", "rashi_en": "ולחם אין בכל הארץ AND THERE WAS NO BREAD IN ALL THE LAND — Scripture reverts now to the original subject, viz, to the account of the beginning of the years of famine.<br><br>ותלה AND FAINTED — This is the same as ותלאה, it means to be wearied, as the Targum renders it. Another example of the root is (Proverbs 26:18) “Like one fatigued who casteth fire-brands”. "}, {"ch": 47, "v": 14, "aliyah": 7, "heb": "וַיְלַקֵּ֣ט יוֹסֵ֗ף אֶת־כׇּל־הַכֶּ֙סֶף֙ הַנִּמְצָ֤א בְאֶֽרֶץ־מִצְרַ֙יִם֙ וּבְאֶ֣רֶץ כְּנַ֔עַן בַּשֶּׁ֖בֶר אֲשֶׁר־הֵ֣ם שֹׁבְרִ֑ים וַיָּבֵ֥א יוֹסֵ֛ף אֶת־הַכֶּ֖סֶף בֵּ֥יתָה פַרְעֹֽה׃", "onk": "וְלַקִּיט יוֹסֵף יָת כָּל כַּסְפָּא דְּאִשְׁתְּכַח בְּאַרְעָא דְמִצְרַיִם וּבְאַרְעָא דִכְנַעַן בְּעִיבוּרָא דִּי אִנּוּן זָבְנִין וְאַיְתֵי יוֹסֵף יָת כַּסְפָּא לְבֵית פַּרְעֹה:", "onk_en": "Yoseif gathered up all the money that was to be found in the land of Egypt, and in the land of Canaan, through the purchases [<b>grain<\/b>] they made. Yoseif brought the money to the house of Pharaoh.", "pj": "וּלְקֵיט יוֹסֵף יַת כָּל כַּסְפָּא דְאִישְׁתַּכַּח בְּאַרְעָא דְמִצְרַיִם וּבְאַרְעָא דִכְנָעַן בְּעִיבּוּרָא דְהִינוּן זַבְּנִין וְאַיְיתֵי יוֹסֵף יַת כַּסְפָּא בְּבֵית הִיפְתֵּיקָא דְפַרְעה", "pj_en": "And Joseph collected all the money which was found in the land of Mizraim, and in the land of Kenaan, for the corn which he sold to them; and Joseph brought the money into the treasure--house of Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>בשבר אשר הם שברים.<\/b> נוֹתְנִין לוֹ אֶת הַכֶּסֶף:", "rashi_en": "בשבר אשר הם שוברים FOR THE CORN WHICH THEY BOUGHT — they gave him the money."}, {"ch": 47, "v": 15, "aliyah": 7, "heb": "וַיִּתֹּ֣ם הַכֶּ֗סֶף מֵאֶ֣רֶץ מִצְרַ֘יִם֮ וּמֵאֶ֣רֶץ כְּנַ֒עַן֒ וַיָּבֹ֩אוּ֩ כׇל־מִצְרַ֨יִם אֶל־יוֹסֵ֤ף לֵאמֹר֙ הָֽבָה־לָּ֣נוּ לֶ֔חֶם וְלָ֥מָּה נָמ֖וּת נֶגְדֶּ֑ךָ כִּ֥י אָפֵ֖ס כָּֽסֶף׃", "onk": "וּשְׁלִים כַּסְפָּא מֵאַרְעָא דְמִצְרַיִם וּמֵאַרְעָא דִכְנַעַן וַאֲתוֹ כָל מִצְרָאֵי לְוַת יוֹסֵף לְמֵימַר הַב לָנָא לַחְמָא וּלְמָה נְמוּת לְקִבְלָךְ אֲרֵי שְׁלִים כַּסְפָּא:", "onk_en": "When the money was used up in the land of Egypt, and in the land of Canaan, all [the people of] Egypt came to Yoseif, saying, Give us bread; why should we die in your presence, [just] because there is no money?", "pj": "וּשְׁלִים כַּסְפָּא מֵאַרְעָא דְמִצְרַיִם וּמֵאַרְעָא דִכְנָעַן וְאָתוּ מִצְרָאֵי לְוַת יוֹסֵף לְמֵימָר הַב לָנָא לַחֲמָא וּלְמָא נְמוּת כָּל קִבְלָךְ אֲרוּם שְׁלִים כַּסְפָּא", "pj_en": "And the money was finished from the land of Mizraim, and from the land of Kenaan; and the Mizraee came to Joseph, saying, Give us bread; why should we die before thee? for all our money is finished.", "tj": "וַחֲסִיל:", "tj_en": "And hath failed.", "rashi": "<b>אפס.<\/b> כְּתַרְגּוּמוֹ שְׁלִים:", "rashi_en": "אפס — Render this as the Targum does: שלים IS AT AN END."}, {"ch": 47, "v": 16, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יוֹסֵף֙ הָב֣וּ מִקְנֵיכֶ֔ם וְאֶתְּנָ֥ה לָכֶ֖ם בְּמִקְנֵיכֶ֑ם אִם־אָפֵ֖ס כָּֽסֶף׃", "onk": "וַאֲמַר יוֹסֵף הָבוּ גֵיתֵיכוֹן וְאֶתֵּן לְכוֹן בְּגֵיתֵיכוֹן אִם שְׁלִים כַּסְפָּא:", "onk_en": "Yoseif said, Bring your livestock, and I will give you [food] [in exchange] for your livestock if there is no more money.", "pj": "וַאֲמַר יוֹסֵף הָבוּ גֵיתֵיכוֹן וְאֶתֵּן לְכוֹן מָזוֹן בְּגֵיתֵיכוֹן אִין פְּסַד כַּסְפָּא", "pj_en": "And Joseph said, Give your flocks, and for your flocks I will give you provisions, if the money be consumed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 47, "v": 17, "aliyah": 7, "heb": "וַיָּבִ֣יאוּ אֶת־מִקְנֵיהֶם֮ אֶל־יוֹסֵף֒ וַיִּתֵּ֣ן לָהֶם֩ יוֹסֵ֨ף לֶ֜חֶם בַּסּוּסִ֗ים וּבְמִקְנֵ֥ה הַצֹּ֛אן וּבְמִקְנֵ֥ה הַבָּקָ֖ר וּבַחֲמֹרִ֑ים וַיְנַהֲלֵ֤ם בַּלֶּ֙חֶם֙ בְּכׇל־מִקְנֵהֶ֔ם בַּשָּׁנָ֖ה הַהִֽוא׃", "onk": "וְאַיְתִיּוּ יָת גֵּיתֵיהוֹן לְוַת יוֹסֵף וִיהַב לְהוֹן יוֹסֵף לַחְמָא בְּסוּסָוָתָא וּבְגֵיתֵי עָנָא וּבְגֵיתֵי תוֹרִין וּבַחֲמָרִין <b>וְזָנִנּוּן<\/b> בְּלַחְמָא בְּכָל גֵּיתֵיהוֹן בְּשַׁתָּא הַהִיא:", "onk_en": "They brought their livestock to Yoseif, and Yoseif gave them bread [in exchange] for their horses, their flocks of sheep, their herds of cattle and their donkeys. He tended [<b>sustained<\/b>] them with bread in exchange for all their livestock, in that year.", "pj": "וְאַיְיתִיוּ יַת גֵיתֵיהוֹן לְיוֹסֵף וִיהַב לְהוֹן יוֹסֵף לַחֲמָא בְּסוּסְוָון וּבְגֵיתֵי עָנָא וּבְגֵיתֵי תּוֹרֵי וּבַחְמָרָא וְזָנִינוּן בְּלַחְמָא בְּכָל גֵיתֵיהוֹן בְּשַׁתָּא הַהוּא", "pj_en": "And they brought their cattle to Joseph, and Joseph gave them bread for their horses, and for the flocks of sheep, the oxen, and the asses; and he sustained them with bread for all their flocks for that year", "tj": "", "tj_en": "", "rashi": "<b>וינהלם.<\/b> כְּמוֹ וַיְנַהֲגֵם, וְדוֹמֶה לוֹ אֵין מְנַהֵל לָהּ (ישעיהו נ\"א), עַל מֵי מְנֻחוֹת יְנַהֲלֵנִי (תהילים כ\"ג):", "rashi_en": "וינהלם — is the same as וינהגם AND HE GUIDED, LED THEM. Similar in meaning are (Isaiah 51:18) “There is none (מנהל) to lead her”, and (Psalms 23) “he guideth me (ינהלני) beside the still waters.” "}, {"ch": 47, "v": 18, "aliyah": 7, "heb": "וַתִּתֹּם֮ הַשָּׁנָ֣ה הַהִוא֒ וַיָּבֹ֨אוּ אֵלָ֜יו בַּשָּׁנָ֣ה הַשֵּׁנִ֗ית וַיֹּ֤אמְרוּ לוֹ֙ לֹֽא־נְכַחֵ֣ד מֵֽאֲדֹנִ֔י כִּ֚י אִם־תַּ֣ם הַכֶּ֔סֶף וּמִקְנֵ֥ה הַבְּהֵמָ֖ה אֶל־אֲדֹנִ֑י לֹ֤א נִשְׁאַר֙ לִפְנֵ֣י אֲדֹנִ֔י בִּלְתִּ֥י אִם־גְּוִיָּתֵ֖נוּ וְאַדְמָתֵֽנוּ׃", "onk": "וּשְׁלִימַת שַׁתָּא הַהִיא וַאֲתוֹ לְוָתֵיהּ בְּשַׁתָּא תִנְיֵתָא וַאֲמָרוּ לֵיהּ לָא נְכַסֵּי מִן רִבּוֹנִי אֶלָּהֵין שְׁלִים כַּסְפָּא וְגֵיתֵי בְעִירָא לְוַת רִבּוֹנִי לָא אִשְׁתָּאַר קֳדָם רִבּוֹנִי אֶלָּהֵין גְּוִיָּתָנָא וְאַרְעָנָא:", "onk_en": "That year came to an end. They came to him in the second year, and they said to him, We are holding nothing back from my master, for the money is used up, and the herds of cattle belong to my master. There is nothing left before my master except our bodies and our land.", "pj": "וּשְׁלִימַת שַׁתָּא הַהוּא וְאָתוּ כָּל מִצְרָאֵי לְוָתֵיהּ בְּשַׁתָּא תִנְיֵיתָא וַאֲמָרוּ לֵיהּ לָא נְכַסֵי מִן רִבּוֹנִי אֲרוּם אִין שְׁלִים כַּסְפָּא וְגֵיתֵי בְּעִירָא לְרִבּוֹנִי לָא אִשְׁתַּיָיר לָנָא קֳדָם רִבּוֹנִי אֱלָהֵן גוּפְנִין וְאַרְעָן", "pj_en": "And that year being ended, all the Mizraee came to him, in the second year, and said to him, We will not hide it from my lord, that the money is finished and my lord hath the flocks of cattle: there is nothing left us before my lord except our bodies, and our land.", "tj": "", "tj_en": "", "rashi": "<b>בשנה השנית.<\/b> לִשְׁנֵי הָרָעָב:<br><br><b>כי אם תם הכסף וגו'.<\/b> כִּי אֲשֶׁר תַּם הַכֶּסֶף וְהַמִּקְנֶה וּבָא הַכֹּל אֶל יַד אֲדוֹנִי:<br><br><b>בלתי אם גויתנו.<\/b> כְּמוֹ אִם לֹא גְּוִיָּתֵנוּ:", "rashi_en": "בשנה השנית IN THE SECOND YEAR — of the famine.<br><br>'כי אם תם הכסף וגו is the same as כי אשר תם הכסף and the meaning is: but (כי) it is a fact that (אשר) the money and the herds of cattle are exhausted, and everything has now come into my lord's hands.<br><br>בלתי אם גויתנו is the same as [NOTHING REMAINS] IF IT BE NOT OUR BODIES. "}, {"ch": 47, "v": 19, "aliyah": 7, "heb": "לָ֧מָּה נָמ֣וּת לְעֵינֶ֗יךָ גַּם־אֲנַ֙חְנוּ֙ גַּ֣ם אַדְמָתֵ֔נוּ קְנֵֽה־אֹתָ֥נוּ וְאֶת־אַדְמָתֵ֖נוּ בַּלָּ֑חֶם וְנִֽהְיֶ֞ה אֲנַ֤חְנוּ וְאַדְמָתֵ֙נוּ֙ עֲבָדִ֣ים לְפַרְעֹ֔ה וְתֶן־זֶ֗רַע וְנִֽחְיֶה֙ וְלֹ֣א נָמ֔וּת וְהָאֲדָמָ֖ה לֹ֥א תֵשָֽׁם׃", "onk": "לְמָה נְמוּת לְעֵינָיךְ אַף אֲנַחְנָא אַף אַרְעָתָנָא קְנֵי יָתָנָא וְיָת אַרְעָתָנָא בְּלַחְמָא וּנְהֵי אֲנַחְנָא וְאַרְעָתָנָא עַבְדִּין לְפַרְעֹה וְהַב בַּר זַרְעָא וְנֵיחֵי וְלָא נְמוּת וְאַרְעָא <b>לָא תְבוּר<\/b>:", "onk_en": "Why should we die before your eyes, both we and our land? Buy us and our land [in exchange] for bread. We and our land will become slaves to Pharaoh. Give us seed grain, let us live and not die, and let the land not become desolate [<b>uncultivated<\/b>].", "pj": "לְמָא נְמוּת וְעֵינָךְ חָמָן אוּף אֲנָן אוּף אַרְעָן קְנֵי יָתָן וְיַת אַרְעָן בְּלַחְמָא וּנְהִי אֲנַן וְאַרְעָן עַבְדִין לְפַרְעה וְהַב בַּר זַרְעָא וְנֵיחֵי וְלָא נְמוּת וְאַרַע לָא תִשְׁתּוֹמֵם", "pj_en": "Why should we die and thine eye seeing (it), both we and our land also? Buy us, and our land, for bread, and we and our land will be servants of Pharoh, and give the seed of corn, that we may live and not die, and the land be not desolated.", "tj": "", "tj_en": "", "rashi": "<b>ותן זרע.<\/b> לִזְרֹעַ הָאֲדָמָה; וְאַף עַל פִּי שֶׁאָמַר יוֹסֵף וְעוֹד חָמֵשׁ שָׁנִים אֲשֶׁר אֵין חָרִישׁ וְקָצִיר, מִכֵּיוָן שֶׁבָּא יַעֲקֹב לְמִצְרַיִם בָּאָה בְרָכָה לְרַגְלָיו וְהִתְחִיל לִזְרֹעַ, וְכָלָה הָרָעָב, וְכֵן שָׁנִינוּ בְּתוֹסֶפְתָּא דְּסוֹטָה:<br><br><b>לא תשם.<\/b> לֹא תְהֵא שְׁמָמָה; לָא תְבוּר – לְשׁוֹן שְׂדֵה בּוּר, שֶׁאֵינוֹ חָרוּשׁ:", "rashi_en": "ותן זרע GIVE US SEED — to sow in the ground. Although Joseph had said (Genesis 45:6) “And there are yet five years when there will be no plowing and sowing”, as soon as Jacob came to Egypt a blessing came with his arrival: they began to sow and the famine came to an end. Thus do we read in the Tosefta of Sotah (Tosefta Sotah 10:3).<br><br>לא תשם means it shall not be desolate. The Targum renders it by לא תבור shall not be uncultivated, which has the same meaning as (Mishnah Peah 2:1) שדה בור an uncultivated field — one which is not ploughed."}, {"ch": 47, "v": 20, "aliyah": 7, "heb": "וַיִּ֨קֶן יוֹסֵ֜ף אֶת־כׇּל־אַדְמַ֤ת מִצְרַ֙יִם֙ לְפַרְעֹ֔ה כִּֽי־מָכְר֤וּ מִצְרַ֙יִם֙ אִ֣ישׁ שָׂדֵ֔הוּ כִּֽי־חָזַ֥ק עֲלֵהֶ֖ם הָרָעָ֑ב וַתְּהִ֥י הָאָ֖רֶץ לְפַרְעֹֽה׃", "onk": "וּקְנָא יוֹסֵף יָת כָּל אַרְעָא דְמִצְרַיִם לְפַרְעֹה אֲרֵי זַבִּינוּ מִצְרַיִם גְּבַר חַקְלֵיהּ אֲרֵי תְקֵיף עֲלֵיהוֹן כַּפְנָא וַהֲוַת אַרְעָא לְפַרְעֹה:", "onk_en": "Yoseif bought all the land of Egypt for Pharaoh, for every Egyptian sold his field, because the famine was severe upon them. Thus the land became Pharaoh’s [property.]", "pj": "וּקְנָא יוֹסֵף יַת כָּל אַרְעָא דְמִצְרָאֵי לְפַרְעה אֲרוּם זַבִּינוּ מִצְרָאֵי גְבַר חַקְלֵיהּ אֲרוּם תַּקִיף עֲלֵיהוֹן כַּפְנָא וַהֲוַת אַרְעָא חֲלִיטָא לְפַרְעה", "pj_en": "And Joseph bought all the land of Mizraim for Pharoh; for the Mizraee sold every man his portion, because the famine prevailed over them, and the land became the property of Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>ותהי הארץ לפרעה.<\/b> קְנוּיָה לוֹ:", "rashi_en": "ותהי הארץ לפרעה SO THE LAND BECAME PHARAOH’S — possessed by him. "}, {"ch": 47, "v": 21, "aliyah": 7, "heb": "וְאֶ֨ת־הָעָ֔ם הֶעֱבִ֥יר אֹת֖וֹ לֶעָרִ֑ים מִקְצֵ֥ה גְבוּל־מִצְרַ֖יִם וְעַד־קָצֵֽהוּ׃", "onk": "וְיָת עַמָּא אַעְבַּר יָתֵיהּ <b>מִקְּרֵי לִקְרֵי<\/b> מִסְּיָפֵי תְּחוּם מִצְרַיִם וְעַד סוֹפֵיהּ:", "onk_en": "He [Yoseif] then transferred the people to cities [<b>from city to city<\/b>], from one end of the border of Egypt to the other.", "pj": "וְיַת עַמָא דִמְדִינָתָא אַעֲבַר יַתְהוֹן לְקוּרְיְתָא וְעַמָא דְקוּרְיְתָא אַעֲבַר לִמְדִינְתָּא מִן בִּגְלַל אָחוֹי דְיוֹסֵף דְלָא יִתְקְרוּן גַלְוִילָאֵי בְּגִין כֵּן טַלְטְלִינוּן מִסֵיפֵיהּ תְּחוּם מִצְרַיִם עַד סוֹפֵיהּ", "pj_en": "And the people of a province he removed to a city, and the people of the city he removed to a province, for the sake of the brethren of Joseph, that they might not be called wanderers: therefore he made them migrate from one end of Mizraim to the other.", "tj": "וְיַת עַמָא דַהֲוָן שָׁרוּן בִּמְדִינָתָא אַעֲבֵר בְּקִרְיְיתָא וְיַת עַמָא דַהֲוָון שְׁרִין בְּקִרְיְיתָא אַעֲבֵר בִּמְדִינְתָּא דְלָא יֶהֱוָון מוֹנִין לִבְנוֹי דְיַעֲקב וְאָמְרִין לְהוֹן אַכְסְנֵי גִילוּלָאֵי:", "tj_en": "And the people who were dwelling in the province he removed into the city; and the people who dwelt in the city he removed into the province, that they might not deride the sons of Jakob, and call them Galilean (wandering) guests.", "rashi": "<b>ואת העם העביר.<\/b> יוֹסֵף מֵעִיר לְעִיר לְזִכָּרוֹן, שֶׁאֵין לָהֶם עוֹד חֵלֶק בָּאָרֶץ, וְהוֹשִׁיב שֶׁל עִיר זוֹ בַחֲבֶרְתָּהּ, וְלֹא הֻצְרַךְ הַכָּתוּב לִכְתֹּב זֹאת אֶלָּא לְהוֹדִיעֲךָ שִׁבְחוֹ שֶׁל יוֹסֵף שֶׁנִּתְכַּוֵּן לְהָסִיר חֶרְפָּה מֵעַל אֶחָיו, שֶׁלֹא יִהְיוּ קוֹרִין אוֹתָם גּוֹלִים (חולין ס'):<br><br><b>מקצה גבול מצרים וגו'.<\/b> כֵּן עָשָׂה לְכָל הֶעָרִים אֲשֶׁר בְּמַלְכוּת מִצְרַיִם, מִקְצֵה גְבוּלָהּ וְעַד קְצֵה גְבוּלָהּ:", "rashi_en": "ואת העם העביר AND AS FOR THE PEOPLE HE CAUSED THEM TO PASS — Joseph caused them to pass from one city to another city that they might be reminded that they now had no claim to the land. He settled the people of one city in another. There was no need for Scripture to state this except for the purpose of telling you something to Joseph’s credit — that he intended thereby to remove a reproach from his brothers because, since the Egyptians were themselves strangers in the various cities where they then dwelt, they could not call them (Joseph’s brethren) strangers (Chullin 60b).<br><br>'מקצה גבול מצרים וגו means thus did he to all the cities of the realm of Egypt FROM ONE EXTREMITY OF THE BOUNDARIES OF EGYPT EVEN TO THE OTHER EXTREMITY THEREOF). "}, {"ch": 47, "v": 22, "aliyah": 7, "heb": "רַ֛ק אַדְמַ֥ת הַכֹּהֲנִ֖ים לֹ֣א קָנָ֑ה כִּי֩ חֹ֨ק לַכֹּהֲנִ֜ים מֵאֵ֣ת פַּרְעֹ֗ה וְאָֽכְל֤וּ אֶת־חֻקָּם֙ אֲשֶׁ֨ר נָתַ֤ן לָהֶם֙ פַּרְעֹ֔ה עַל־כֵּ֕ן לֹ֥א מָכְר֖וּ אֶת־אַדְמָתָֽם׃", "onk": "לְחוֹד אַרְעָא דְכֻמָּרַיָּא לָא זַבִּין אֲרֵי חֳלָקָא לְכֻמָּרַיָּא מִלְּוַת פַּרְעֹה וְאָכְלִין יָת חֳלָקְהוֹן דִּיהַב לְהוֹן פַּרְעֹה עַל כֵּן לָא זַבִּינוּ יָת אַרְעֲהוֹן:", "onk_en": "But the land of the priests he did not buy, because the priests had an allotment from Pharaoh. They ate the allotment that Pharaoh gave them, and therefore they did not sell their land.", "pj": "לְחוֹד אַרְעָא דְכוּמְרְנַיָא לָא זַבָּן מִן בִּגְלַל דְחָמוּן לֵיהּ זְכוּתָא בִּזְמַן דִבְעָא רִבּוֹנֵיהּ לְמִקְטְלֵיהּ וְשֵׁיזְבוּהִי מִן דִין קְטוֹל וּבְרַם אֲרוּם חוּלְקָא אָמַר לְמִיתְיַהֲבָא לְהוֹם מִלְוַות פַּרְעה וְאָכְלִין יַת חוּלַקְהוֹן דִיהַב לְהוֹן פַּרְעה בְּגִין כֵּן לָא זַבִּינוּ יַת אַרְעֲהוֹן", "pj_en": "Only the land of the priests he bought not because they had considered him innocent at the time when his master was seeking to put him to death, and they had delivered him from the judgment of death: and besides he had said that a portion should be given them from Pharoh. So they ate the portion which Pharoh gave them, and sold not their land.", "tj": "", "tj_en": "", "rashi": "<b>הכהנים.<\/b> הַכּוּמָרִים, כָּל לְשׁוֹן כֹּהֵן מְשָׁרֵת לֶאֱלֹהוּת הוּא, חוּץ מֵאוֹתָן שֶׁהֵם לְשׁוֹן גְּדֻלָּה, כְּמוֹ כֹּהֵן מִדְיָן, כֹּהֵן אוֹן:<br><br><b>חק לכהנים.<\/b> חֹק כָּךְ וְכָךְ לֶחֶם לַיּוֹם:", "rashi_en": "הכהנים mean THE PRIESTS. The term כהן always means one who ministers to Deity except in those cases where it denotes one of high rank, e.g. (Exodus 2:16) “Jethro the chief of (כהן) Midian” and (Genesis 41:45) “the chief of (כהן) On”).<br><br>חק לכהנים [FOR] THE PRIESTS HAD A PORTION — an assigned portion of a definite quantity of bread daily.  "}, {"ch": 47, "v": 23, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יוֹסֵף֙ אֶל־הָעָ֔ם הֵן֩ קָנִ֨יתִי אֶתְכֶ֥ם הַיּ֛וֹם וְאֶת־אַדְמַתְכֶ֖ם לְפַרְעֹ֑ה הֵֽא־לָכֶ֣ם זֶ֔רַע וּזְרַעְתֶּ֖ם אֶת־הָאֲדָמָֽה׃", "onk": "וַאֲמַר יוֹסֵף לְעַמָּא הָא זְבֵנִית יָתְכוֹן יוֹמָא דֵין וְיָת אַרְעֲכוֹן לְפַרְעֹה הֵא לְכוֹן בַּר זַרְעָא וְתִזְרְעוּן יָת אַרְעָא:", "onk_en": "Yoseif said to the people, Behold, I have today purchased you and your lands for Pharaoh. Here is seed, plant [it in] the soil.", "pj": "וַאֲמַר יוֹסֵף לְעַמָא הָא קָנִיתִי יַתְכוֹן יוֹמָא דֵין וְיַת אַרְעֲכוֹן לְפַרְעה הָא לְכוֹן בַּר זַרְעָא וְתִזְרְעוּן יַת אַרְעָא", "pj_en": "And Joseph said to the people, Behold, I have this day bought you and your land for Pharoh: behold, (I give) you seed corn to sow the land;", "tj": "", "tj_en": "", "rashi": "<b>הא.<\/b> כְּמוֹ הִנֵּה, כְּמוֹ וְגַם אֲנִי הֵא דַּרְכֵּךְ בְּרֹאשׁ נָתַתִּי (יחזקאל ט\"ז):", "rashi_en": "הא means the same as הנה “behold”, as (Ezekiel 16:43) “I also lo, (הא) will recompense thy way upon thine head”. "}, {"ch": 47, "v": 24, "aliyah": 7, "heb": "וְהָיָה֙ בַּתְּבוּאֹ֔ת וּנְתַתֶּ֥ם חֲמִישִׁ֖ית לְפַרְעֹ֑ה וְאַרְבַּ֣ע הַיָּדֹ֡ת יִהְיֶ֣ה לָכֶם֩ לְזֶ֨רַע הַשָּׂדֶ֧ה וּֽלְאׇכְלְכֶ֛ם וְלַאֲשֶׁ֥ר בְּבָתֵּיכֶ֖ם וְלֶאֱכֹ֥ל לְטַפְּכֶֽם׃", "onk": "וִיהֵי <b>בְּאָעוֹלֵי עֲלַלְתָּא<\/b> וְתִתְּנוּן חַד מִן חַמְשָׁא לְפַרְעֹה וְאַרְבַּע חֳלָקִין יְהֵא לְכוֹן לְבַר זְרַע חַקְלָא וּלְמֵיכַלְכוֹן וְלֶאֱנַשׁ בְּבָתֵּיכוֹן וּלְמֵיכַל לְטַפְלְכוֹן:", "onk_en": "When it produces [<b>the produce is gathered<\/b>] you must give a fifth to Pharaoh. Four parts shall be yours for seed for your fields and for your food, and for those [<b>the people<\/b>] of your households, and for food for your little ones.", "pj": "וִיהֵי בְאִישׁוּנֵיהּ בְּמִכְנוֹש עֲלַלְתָּא וְתִתְּנוּן חוּמְשָׁא לְפַּרְעה וְאַרְבַּע חוּלְקִין יְהֵי לְכוֹן לְבַר זַרְעָא דְאַרְעָא וּלְמֵיכְלֵיכוֹן וּלְפַרְנוּס בָּתֵּיכוֹן וּלְמֵיכוּל לְטַפְלְכוֹן", "pj_en": "and at the time of the ingathering of your produce you shall give the fifth part to Pharoh, and four parts shall be yours, for the seeding of your land, and for food and for provision for your houses and little ones.", "tj": "", "tj_en": "", "rashi": "<b>לזרע השדה.<\/b> שֶׁבְּכָל שָׁנָה:<br><br><b>ולאשר בבתיכם.<\/b> וְלֶאֱכֹל הָעֲבָדִים וְהַשְּׁפָחוֹת אֲשֶׁר בְּבָתֵּיכֶם:<br><br><b>לטפכם.<\/b> בָּנִים קְטַנִּים:", "rashi_en": "לזרע השדה FOR SEED OF THE FIELD — for sowing every year),<br><br>ולאשר בבתיכם AND FOR THEM OF YOUR HOUSEHOLDS — means and as food for the servants and maidservants that are in your houses,<br><br>טפכם means your young children. "}, {"ch": 47, "v": 25, "aliyah": 7, "heb": "וַיֹּאמְר֖וּ הֶחֱיִתָ֑נוּ נִמְצָא־חֵן֙ בְּעֵינֵ֣י אֲדֹנִ֔י וְהָיִ֥ינוּ עֲבָדִ֖ים לְפַרְעֹֽה׃", "onk": "וַאֲמָרוּ קַיִּמְתָּנָא נַשְׁכַּח רַחֲמִין בְּעֵינֵי רִבּוֹנִי וּנְהֵי עַבְדִּין לְפַרְעֹה:", "onk_en": "They said, You have saved our lives. May we find favor in the eyes of my master, and we will be slaves to Pharaoh.", "pj": "וַאֲמָרוּ קִיַימְתָּנָא נִשְׁכַּח רַחֲמִין בְּעֵינֵי רִבּוֹנִי וּנְהֵי עַבְדִין לְפַרְעה", "pj_en": "And they said, Thou hast preserved us: let us find favour in the eyes of my lord, and we will be Pharoh's servants.", "tj": "", "tj_en": "", "rashi": "<b>נמצא חן.<\/b> לַעֲשׂוֹת לָנוּ זֹאת כְּמוֹ שֶׁאָמַרְתָּ:<br><br><b>והיינו עבדים לפרעה.<\/b> לְהַעֲלוֹת לוֹ הַמַּס הַזֶּה בְּכָל שָׁנָה:", "rashi_en": "נמצא חן LET US FIND FAVOUR — [IN THE EYES OF MY LORD] in that you should do for us as you have said.<br><br>והיינו עבדים לפרעה AND WE SHALL BE PHARAOH’S SERVANTS, paying him this tax annually."}, {"ch": 47, "v": 26, "aliyah": 7, "heb": "וַיָּ֣שֶׂם אֹתָ֣הּ יוֹסֵ֡ף לְחֹק֩ עַד־הַיּ֨וֹם הַזֶּ֜ה עַל־אַדְמַ֥ת מִצְרַ֛יִם לְפַרְעֹ֖ה לַחֹ֑מֶשׁ רַ֞ק אַדְמַ֤ת הַכֹּֽהֲנִים֙ לְבַדָּ֔ם לֹ֥א הָיְתָ֖ה לְפַרְעֹֽה׃", "onk": "וְשַׁוִּי יָתַהּ יוֹסֵף לִגְזֵרָא עַד יוֹמָא הָדֵין עַל אַרְעָא דְמִצְרַיִם דִּיהוֹן <b>יָהֲבִין חַד מִן חַמְשָׁא<\/b> לְפַרְעֹה לְחוֹד אַרְעָא דְכֻמָּרַיָּא בִּלְחוֹדֵהוֹן לָא הֲוַת לְפַרְעֹה:", "onk_en": "Yoseif enacted a statute over the land of Egypt to this day, that a fifth belongs [<b>they should give a fifth<\/b>] to Pharaoh. Except the land of the priests alone, did not belong to Pharaoh.", "pj": "וְשַׁוִי יוֹסֵף לִגְזֵירָא עַד יוֹמָא הָדֵין עַל אַרְעָא דְמִצְרַיִם לְפַרְעה לְמֵיתַב חוּמְשָׁא מִן עֲלַלְתָּא לְחוֹד אַרְעָא דְכוּמְרַנְיָא בִּלְחוֹדֵיהוֹן לָא הֲוָת לְפַרְעה", "pj_en": "And Joseph established it a law unto this day over the land of Mizraim to take to Pharoh a fifth part of the produce, except only the land of the priests which was not Pharoh's.", "tj": "", "tj_en": "", "rashi": "<b>לחק.<\/b> שֶׁלֹּא יַעֲבֹר:", "rashi_en": "לחק AS A STATUTE — without repeal. "}, {"ch": 47, "v": 27, "aliyah": 7, "heb": "וַיֵּ֧שֶׁב יִשְׂרָאֵ֛ל בְּאֶ֥רֶץ מִצְרַ֖יִם בְּאֶ֣רֶץ גֹּ֑שֶׁן וַיֵּאָחֲז֣וּ בָ֔הּ וַיִּפְר֥וּ וַיִּרְבּ֖וּ מְאֹֽד׃", "onk": "וִיתֵיב יִשְׂרָאֵל בְּאַרְעָא דְמִצְרַיִם בְּאַרְעָא דְגשֶׁן וְאַחֲסִינוּ בַהּ וּנְפִישׁוּ וּסְגִיאוּ לַחֲדָא:", "onk_en": "Yisrael lived in the land of Egypt, in the land of Goshen. They acquired property there. They were fruitful and [their population] increased greatly.", "pj": "וִיתֵיב יִשְרָאֵל בְּאַרְעָא דְמִצְרַיִם וּבְנוֹ לְהוֹן בָּתֵּי מֶדְרָשִׁין וּפַלְטִין בְּאַרְעָא דְגשֶׁן וְאַחְסִינוּ בָהּ אַחְסָנַת חַקְלִין וּכְרָמִין וּנְפִישׁוּ וּסְגִיאוּ לַחֲדָא", "pj_en": "And Israel dwelt in the land of Mizraim, and they built there schools and mansions in the land of Goshen, and inherited therein fields and vineyards; and they increased and multiplied greatly.", "tj": "", "tj_en": "", "rashi": "<b>וישב ישראל בארץ מצרים.<\/b> וְהֵיכָן? בְּאֶרֶץ גֹּשֶׁן שֶׁהִיא מֵאֶרֶץ מִצְרַיִם:<br><br>(<b>ויאחזו בה.<\/b> לְשׁוֹן אֲחֻזָּה):", "rashi_en": "וישב ישראל בארץ מצרים AND ISRAEL ABODE IN THE LAND OF EGYPT — and where in the land of Egypt? בארץ גשן IN THE LAND OF GOSHEN which is a part of the land Egypt.<br><br>ויאחזו בה means THEY ACQUIRED POSSESSIONS."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
