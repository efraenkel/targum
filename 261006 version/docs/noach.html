.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const SLUG = "noach";
const DATA = [{"ch": 6, "v": 9, "aliyah": 1, "heb": "אֵ֚לֶּה תּוֹלְדֹ֣ת נֹ֔חַ נֹ֗חַ אִ֥ישׁ צַדִּ֛יק תָּמִ֥ים הָיָ֖ה בְּדֹֽרֹתָ֑יו אֶת־הָֽאֱלֹהִ֖ים הִֽתְהַלֶּךְ־נֹֽחַ׃", "onk": "אִלֵּין תּוּלְדַת נֹחַ נֹחַ גְּבַר זַכַּאי שְׁלִים הֲוָה בְּדָרוֹהִי בְּ<b>דַחַלְתָּא דַ<\/b>יְיָ הַלִּיךְ נֹחַ:", "onk_en": "These are the progeny of Noach. Noach was a righteous man, flawless in his generations; Noach walked with [<b>the fear of<\/b>] Elohim.", "pj": "אלה תּוֹלְדוֹת נח אִלֵין יְחוּסִין דִגְנִיסַת נחַ נחַ הֲוָה גְבַר זַכְּאַי שְׁלִים בְּעוֹבְדִין טָבִין הֲוָה בְּדָרוֹהִי בְּדַחַלְתָּא דַיְיָ הֲלִיךְ נחַ", "pj_en": "These are the genealogies of the race of Noah. Noah was a just man, complete in good works in his generation, (and) in the fear of the Lord walked Noah.", "tj": "", "tj_en": "", "rashi": "<b>אלה תולדת נח נח איש צדיק.<\/b> הוֹאִיל וְהִזְכִּירוֹ סִפֵּר בְּשִׁבְחוֹ, שֶׁנֶּאֱמַר זֵכֶר צַדִּיק לִבְרָכָה (משלי י'). דָּבָר אַחֵר לִמֶּדְךָ שֶׁעִקַּר תּוֹלְדוֹתֵיהֶם שֶׁל צַדִּיקִים מַעֲשִׂים טוֹבִים:<br><br><b>בדרותיו.<\/b> יֵשׁ מֵרַבּוֹתֵינוּ דּוֹרְשִׁים אוֹתוֹ לְשֶׁבַח, כָּל שֶׁכֵּן אִלּוּ הָיָה בְדוֹר צַדִּיקִים הָיָה צַדִּיק יוֹתֵר; וְיֵשׁ שֶׁדּוֹרְשִׁים אוֹתוֹ לִגְנַאי, לְפִי דוֹרוֹ הָיָה צַדִּיק וְאִלּוּ הָיָה בְדוֹרוֹ שֶׁל אַבְרָהָם לֹא הָיָה נֶחְשָׁב לִכְלוּם (סנה' ק\"ח):<br><br><b>את האלהים התהלך נח.<\/b> וּבְאַבְרָהָם הוּא אוֹמֵר אֲשֶׁר הִתְהַלַּכְתִּי לְפָנָיו? (ברא' כ\"ד), נֹחַ הָיָה צָרִיךְ סַעַד לְתָמְכוֹ, אֲבָל אַבְרָהָם הָיָה מִתְחַזֵּק וּמְהַלֵּךְ בְצִדְקוֹ מֵאֵלָיו:<br><br><b>התהלך.<\/b> לְשׁוֹן עָבָר, וְזֶהוּ שִׁמּוּשׁוֹ שֶׁל לָשׁוֹן, בְּלָשׁוֹן כָּבֵד מְשַׁמֶּשֶׁת לְהַבָּא וּלְשֶׁעָבַר בְּלָשׁוֹן א', קוּם הִתְהַלֵּךְ (שם י\"ג) לְהַבָּא, הִתְהַלֶּךְ נֹחַ לְשֶׁעָבַר; הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ (שמואל א' י\"ב) לְהַבָּא, וּבָא וְהִתְפַּלֵּל אֶל הַבַּיִת הַזֶּה (מ\"א ח') לְשׁוֹן עָבָר, אֶלָּא שֶׁהַוָּי\"ו שֶׁבְּרֹאשׁוֹ הֲפָכוֹ לְהַבָּא:", "rashi_en": "אלה תולדת נח נח איש צדיק THESE ARE THE PROGENY OF NOAH: NOAH WAS A RIGHTEOUS MAN — Since the text mentions him it sings his praise, in accordance with what is said, (Proverbs 10:7) “The mention of the righteous shall be for a blessing.” Another explanation is: since after stating “These are the progeny of Noah”, it does not at once mention the names of his children but declares that he “was a righteous man”, Scripture thereby teaches you that the real progeny of righteous people are their good deeds (Genesis Rabbah 30:6).<br><br>בדורותיו IN HIS GENERATIONS — Some of our Rabbis explain it (this word) to his credit: he was righteous even in his generation; it follows that had he lived in a generation of righteous people he would have been even more righteous owing to the force of good example. Others, however, explain it to his discredit: in comparison with his own generation he was accounted righteous, but had he lived in the generation of Abraham he would have been accounted as of no importance (cf. Sanhedrin 108a).<br><br>את האלהים התהלך נח NOAH WALKED WITH GOD — In the case of Abraham Scripture says, (Genesis 24:40) ‘‘[God] before whom I walked”; Noah needed God’s support to uphold him in righteousness, Abraham drew his moral strength from himself and walked in his righteousness by his own effort (Genesis Rabbah 30:10).<br><br>התהלך HE WALKED — This word is in the past tense. The following is the usage of this verbal form: in the “heavy” (כבד) conjugation one grammatical form is used both as future (i. e. the imperative, since the imperative calls for on action to be done in the future relative to the time when the command is given) and as past tense e. g., (13:17) קום התהלך “arise walk” is future (i. e. imperative); התהלך נח “Noah walked” (in this passage) is past; (1 Samuel 12:19) התפלל בעד עבדיך “Pray for thy servants” is future (i. e. imperative) and (1 Kings 8:42) ובא והתפלל אל הבית הזה “When he shall come and shall pray toward this house” is past, only that the ו at the beginning of the word changes the tense into the future (it is Vav conversive)."}, {"ch": 6, "v": 10, "aliyah": 1, "heb": "וַיּ֥וֹלֶד נֹ֖חַ שְׁלֹשָׁ֣ה בָנִ֑ים אֶת־שֵׁ֖ם אֶת־חָ֥ם וְאֶת־יָֽפֶת׃", "onk": "וְאוֹלִיד נֹחַ תְּלָתָא בְנִין יָת שֵׁם יָת חָם וְיָת יָפֶת:", "onk_en": "Noach fathered three sons, Sheim, Cham and Yafes.", "pj": "וְאוֹלִיד נחַ תְּלָתָא בְּנִין יַת שֵׁם יַת חָם וְיַת יָפֶת", "pj_en": "And Noah begat three sons, Shem, Cham, and Japheth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 11, "aliyah": 1, "heb": "וַתִּשָּׁחֵ֥ת הָאָ֖רֶץ לִפְנֵ֣י הָֽאֱלֹהִ֑ים וַתִּמָּלֵ֥א הָאָ֖רֶץ חָמָֽס׃", "onk": "וְאִתְחַבָּלַת אַרְעָא קֳדָם יְיָ וְאִתְמְלִיאַת אַרְעָא חֲטוֹפִין:", "onk_en": "The earth was corrupt before Elohim, and the earth was filled with violent crime.", "pj": "וְאִתְחַבָּלַת אַרְעָא בְּגִין דַיְירָהָא דְסָטוּ מִן אָרְחָן דְתַקְנָן קֳדָם יְיָ וְאִיתְמְלִיאַת אַרְעָא חֲטוּפִין", "pj_en": "And the earth was corrupted through the inhabitants thereof, who had declined from the ways of righteousness before the Lord; and the earth was filled with rapine.", "tj": "וְאִיתְמְלִיאַת אַרְעָא חוֹמְסִין וְגוֹזָלִין:", "tj_en": "And the earth was filled with violences and frauds.", "rashi": "<b>ותשחת.<\/b> לְשׁוֹן עֶרְוָה וַעֲ\"זָ (סנה' נ\"ז) כְּמוֹ פֶּן תַּשְׁחִתוּן (דב' ד'), כִּי הִשְׁחִית כָּל בָּשָׂר וְגוֹ':<br><br><b>ותמלא הארץ חמס.<\/b> גֶּזֶל:", "rashi_en": "ותשחת [THE EARTH] WAS CORRUPT — It means lewdness and idolatry, as (Deuteronomy 4:16) פן תשחיתון “lest ye deal corruptly” (the following words show that this refers to idolatry) and as ‘כי השחית כל בשר וגו “for all flesh had corrupted etc.” (in next verse of this chapter where Rashi states that this has reference to lewdness) (Sanhedrin 57a).<br><br>ותמלא הארץ חמס AND THE EARTH WAS FILLED WITH VIOLENCE — means robbery. "}, {"ch": 6, "v": 12, "aliyah": 1, "heb": "וַיַּ֧רְא אֱלֹהִ֛ים אֶת־הָאָ֖רֶץ וְהִנֵּ֣ה נִשְׁחָ֑תָה כִּֽי־הִשְׁחִ֧ית כׇּל־בָּשָׂ֛ר אֶת־דַּרְכּ֖וֹ עַל־הָאָֽרֶץ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲזָא יְיָ יָת אַרְעָא וְהָא אִתְחַבָּלַת אֲרֵי חַבִּילוּ כָּל בִּשְׂרָא <b>אֱנַשׁ<\/b> יָת אָרְחֵהּ עַל אַרְעָא:", "onk_en": "Elohim saw the earth and beheld that it was corrupt, for all flesh [<b>of man<\/b>] had corrupted its way on the earth.", "pj": "וַחֲמָא יְיָ יַת אַרְעָא וְהָא אִתְחַבָּלַת אֲרוּם חַבִּילוּ כָּל בִּשְרָא כָּל חַד וְחַד יַת אוֹרְחֵיהּ עַל אַרְעָא", "pj_en": "And the Lord beheld the earth; and, lo, it was corrupt; for all flesh had every one corrupted his way upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>כי השחית כל בשר.<\/b> אֲפִלּוּ בְהֵמָה חַיָּה וָעוֹף נִזְקָקִין לְשֶׁאֵינָן מִינָן:", "rashi_en": "כי השחית כל בשר FOR ALL FLESH HAD CORRUPTED — even cattle, beasts and fowl did not consort with their own species (Genesis Rabbah 28:8). "}, {"ch": 6, "v": 13, "aliyah": 1, "heb": "וַיֹּ֨אמֶר אֱלֹהִ֜ים לְנֹ֗חַ קֵ֤ץ כׇּל־בָּשָׂר֙ בָּ֣א לְפָנַ֔י כִּֽי־מָלְאָ֥ה הָאָ֛רֶץ חָמָ֖ס מִפְּנֵיהֶ֑ם וְהִנְנִ֥י מַשְׁחִיתָ֖ם אֶת־הָאָֽרֶץ׃", "onk": "וַאֲמַר יְיָ לְנֹחַ קִצָּא דְכָל בִּשְׂרָא עַלַּת לִקֳדָמַי אֲרֵי אִתְמְלִיאַת אַרְעָא חֲטוֹפִין מִן קֳדָם <b>עוֹבָדֵיהוֹן בִּישַׁיָּא<\/b> וְהָא אֲנָא מְחַבֶּלְהוֹן עִם אַרְעָא:", "onk_en": "Elohim said to Noach, The end of all flesh has come before Me. For the earth is filled with violent crime because of them [<b>their evil deeds<\/b>], and so, I will destroy them with the earth.", "pj": "וַאֲמַר יְיָ לְנחַ סוֹפָא דְכָל בִּשְרָא מָטָא מִן קֳדָמַי אֲרוּם אִתְמְלִיאַת אַרְעָא חֲטוּפִין מִן עוֹבְדֵיהוֹן בִּישַׁיָא וְהָא אֲנָא מְחַבֵּלְהוֹן עִם אַרְעָא", "pj_en": "And the Lord said to Noah, The end of all flesh cometh before Me, because the earth is filled with rapine by their evil works; and, behold, I will destroy them with the earth.", "tj": "", "tj_en": "", "rashi": "<b>קץ כל בשר.<\/b> כָּל מָקוֹם שֶׁאַתָּה מוֹצֵא זְנוּת וַעֲ\"זָ אַנְדְּרוֹלוֹמוּסְיָא בָּאָה לְעוֹלָם וְהוֹרֶגֶת טוֹבִים וְרָעִים.<br><br><b>כי מלאה הארץ חמס.<\/b> לֹא נֶחְתַּם גְּזַר דִּינָם אֶלָּא עַל הַגֶּזֶל (סנה' ק\"ח):<br><br><b>את הארץ.<\/b> כְּמוֹ מִן הָאָרֶץ, וְדוֹמֶה לוֹ כְּצֵאתִי אֶת הָעִיר (שמ' ט'), מִן הָעִיר; חָלָה אֶת רַגְלָיו (מ\"א ט\"ו), מִן רַגְלָיו. דָּ\"אַ אֶת הָאָרֶץ – עִם הָאָרֶץ, שֶׁאַף ג' טְפָחִים שֶׁל עֹמֶק הַמַּחֲרֵשָׁה נִמֹּחוּ וְנִטַּשְׁטְשׁוּ:", "rashi_en": "קץ כל בשר THE END OF ALL FLESH — Wherever you find lewdness and idolatry, punishment of an indiscriminate character comes upon the world killing good and bad alike (Genesis Rabbah 26:5).<br><br>כי מלאה הארץ חמס FOR THE EARTH IS FILLED WITH VIOLENCE — Their fate was sealed only on account of their sin of robbery (Sanhedrin 108a).<br><br>את הארץ [I WILL DESTROY THEM] WITH THE EARTH — It is similar to מן הארץ \"from the earth”; other examples of this use of את are: (Exodus 9:29) בצאתי ‘‘when I go forth” את העיר which means מן העיר “from the city” and (1 Kings 15:23) חלה ‘‘he suffered” את רגליו which means מן רגליו ‘‘from his feet”. Another explanation of את הארץ is: “together with the earth” — for the earth was blotted out and washed away to the depth of a furrow of three handbreadths (Genesis Rabbah 31:7). "}, {"ch": 6, "v": 14, "aliyah": 1, "heb": "עֲשֵׂ֤ה לְךָ֙ תֵּבַ֣ת עֲצֵי־גֹ֔פֶר קִנִּ֖ים תַּֽעֲשֶׂ֣ה אֶת־הַתֵּבָ֑ה וְכָֽפַרְתָּ֥ אֹתָ֛הּ מִבַּ֥יִת וּמִח֖וּץ בַּכֹּֽפֶר׃", "onk": "עִיבֵד לָךְ תֵּבוֹתָא דְאָעִין דְּקַדְרוֹם מְדוֹרִין תַּעְבֵּד יָת תֵּבוֹתָא וְתֶחְפֵּי יָתַהּ מִגָּו וּמִבָּרָא בְּכָפְרָא:", "onk_en": "Make for yourself an ark of cedar wood. Make the ark into compartments and caulk the inside and outside with tar.", "pj": "עִיבַד לָךְ תֵיבוֹתָא דְקִיסִין קַדְרוּנִין מְאָה וְחַמְשִׁין קוֹלִין תַּעֲבֵיד לְתֵיבוּתָא בִּשְמָאלָהּ וּתְלָתִין וְשִׁית בְּפוּתְיָהּ וַעֲשָרָה בָּתִּין בִּמְצִיעָא לְאַצְנְעָא בְּהוֹן מְזוֹנָא וַחֲמֵשׁ אַפוּטְנִיוּתָא בִּימִינָא וַחֲמֵשׁ בִּשְמָאלָהּ וְתֵשׁוּעַ יָתָהּ מִן גֵיו וּמִבָּרָא בְּחֵימְרָא", "pj_en": "Make thee an ark of the wood of cedars; a hundred and fifty cells shalt thou make to the ark in its left side, and thirty and six in its breadth; and ten cabins in the midst, to lay up in them provision; and five repositories on the right, and five on the left; and thou shalt protect it within and without a pitch.", "tj": "תֵּיבוּתָא דְאָעִין דְקַדְרִינוּן:", "tj_en": "", "rashi": "<b>עשה לך תבת.<\/b> הַרְבֵּה רֶוַח וְהַצָּלָה לְפָנָיו, וְלָמָּה הִטְרִיחוֹ בְּבִנְיָן זֶה? כְּדֵי שֶׁיִּרְאוּהוּ אַנְשֵׁי דוֹר הַמַּבּוּל עוֹסֵק בָּהּ ק\"כ שָׁנָה, וְשׁוֹאֲלִין אוֹתוֹ מַה זֹּאת לְךָ, וְהוּא אוֹמֵר לָהֶם עָתִיד הַקָּבָּ\"ה לְהָבִיא מַבּוּל לָעוֹלָם, אוּלַי יָשׁוּבוּ:<br><br><b>עצי גופר.<\/b> כָּךְ שְׁמוֹ. וְלָמָּה מִמִּין זֶה? עַל שֵׁם גָּפְרִית שֶׁנִּגְזַר עֲלֵיהֶם לִמָּחוֹת בּוֹ:<br><br><b>קנים.<\/b> מְדוֹרִים מְדוֹרִים לְכָל בְּהֵמָה וְחַיָּה:<br><br><b>בכפר.<\/b> זֶפֶת בְלָשׁוֹן אֲרַמִּי, וּמָצִינוּ בַּתַּלְמוּד כּוּפְרָא בְּתֵבָתוֹ שֶׁל משֶׁה, עַל יְדֵי שֶׁהָיוּ הַמַּיִם תָּשִׁים דַּיָּהּ בְּחֹמֶר מִבִּפְנִים וְזֶפֶת מִבַּחוּץ; וְעוֹד, כְּדֵי שֶׁלֹּא יָרִיחַ אוֹתוֹ צַדִּיק רֵיחַ רַע שֶׁל זֶפֶת, אֲבָל כָּאן מִפְּנֵי חֹזֶק הַמַּיִם זִפְּתָהּ מִבַּיִת וּמִחוּץ:", "rashi_en": "עשה לך תבת MAKE THEE AN ARK — There are numerous ways by which God could have saved Noah; why, then, did he burden him with this construction of the Ark? So that the men of the generation of the Flood might see him employed on it for 120 years and might ask him, “What do you need this for”? and so that he might answer them, “The Holy One, blessed be He, is about to bring a flood upon the world” — perhaps they might repent (literally, return to God) (Sanhedrin 108b). <br><br>עצי גופר GOPHER WOOD — Thus is its name. Why of this species (גפר)? Because of the (גפרית) “sulphur” by which it was decreed that they were to be blotted out.<br><br>קנים ROOMS — Separate cabins for each kind of cattle and beast.<br><br>בכפר WITH כפר — This is an Aramaic term for the Hebrew זפת “pitch’’, and in the Talmud (Shabbat 67a) we find the noun כופרא “pitch”. In the case of the ark (cradle) in which Moses was placed, since the waters were not rapid it sufficed that it should be daubed with slime inside and with pitch outside; and a further reason for this was that this righteous person (Moses) should not smell the bad odour of the pitch (Sotah 12a). Here, however, because of the rough waters he had to cover it with pitch inside as well as outside. "}, {"ch": 6, "v": 15, "aliyah": 1, "heb": "וְזֶ֕ה אֲשֶׁ֥ר תַּֽעֲשֶׂ֖ה אֹתָ֑הּ שְׁלֹ֧שׁ מֵא֣וֹת אַמָּ֗ה אֹ֚רֶךְ הַתֵּבָ֔ה חֲמִשִּׁ֤ים אַמָּה֙ רׇחְבָּ֔הּ וּשְׁלֹשִׁ֥ים אַמָּ֖ה קוֹמָתָֽהּ׃", "onk": "וְדֵין דִתַעֲבֵּד יָתַהּ תְּלָת מְאָה אַמִּין אוּרְכָּא דְתֵבוֹתָא חַמְשִׁין אַמִּין פְּתָיַהּ וּתְלָתִין אַמִּין רוּמַהּ:", "onk_en": "This is how you should make it; the ark’s length shall be three hundred <i>amos<\/i>, its width fifty <i>amos<\/i>, and its height thirty <i>amos<\/i>.", "pj": "", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 16, "aliyah": 1, "heb": "צֹ֣הַר&thinsp;<b>׀<\/b> תַּעֲשֶׂ֣ה לַתֵּבָ֗ה וְאֶל־אַמָּה֙ תְּכַלֶּ֣נָּה מִלְמַ֔עְלָה וּפֶ֥תַח הַתֵּבָ֖ה בְּצִדָּ֣הּ תָּשִׂ֑ים תַּחְתִּיִּ֛ם שְׁנִיִּ֥ם וּשְׁלִשִׁ֖ים תַּֽעֲשֶֽׂהָ׃", "onk": "<b>נֵהוֹר<\/b> תַּעְבֵּיד לְתֵבוֹתָא וּלְאַמְתָא תְּשַׁכְלְלִנַּהּ מִלְּעֵלָּא וְתַרְעָא דְתֵבוֹתָא בְּסִטְרַהּ תְּשַׁוִּי מְדוֹרִין אַרָעִין תִּנְיָנִין וּתְלִיתָאִין תַּעְבְּדִנַּהּ:", "onk_en": "Make a skylight [<b>light<\/b>] for the ark, and finish it to one <i>amoh<\/i> at the top. Place the opening of the ark in its side. Make a lower deck, a second and a third deck.", "pj": "אִיזֵל לְפִישׁוֹן וְסַב מִתַּמָן יוֹהֲרָא וְתִשְׁוִנֵיהּ בְּתֵיבוּתָא לְאַנְהָרָא לְכוֹן וּלְגַרְמִידָא תְשֵׁצִינֵיהּ מִלְעֵיל וְתַרְעָא דְתֵיבוּתָא בְּצִטְרָא תְשַׁוֵי מְדוֹרִין תַּתָּאִין תִּנְיָנִין וּתְלִיתָאִין תַּעַבְדִינֵהּ", "pj_en": "Go thou unto Phison, and take from thence a precious stone, and fix it in the ark to illuminate you: with the measure of a cubit (or span) shalt thou complete it above. And a door shalt thou set in the side of the ark; and with dwelling-places, inferior, second, and third, shalt thou make it.", "tj": "", "tj_en": "", "rashi": "<b>צהר.<\/b> יֵ\"אֹ חַלּוֹן וְיֵ\"אֹ אֶבֶן טוֹבָה הַמְּאִירָה לָהֶם (ב\"ר שם):<br><br><b>ואל אמה תכלנה מלמעלה.<\/b> כִּסּוּיָהּ מְשֻׁפָּע וְעוֹלֶה עַד שֶׁהוּא קָצָר מִלְמַעְלָה וְעוֹמֵד עַל אַמָּה כְּדֵי שֶׁיָּזוּבוּ הַמַּיִם לְמַטָּה מִכָּאן וּמִכָּאן:<br><br><b>בצדה תשים.<\/b> שֶׁלֹּא יִפְּלוּ הַגְּשָׁמִים בָּהּ:<br><br><b>תחתים שנים ושלשים.<\/b> ג' עֲלִיוֹת זוֹ עַל גַּב זוֹ, עֶלְיוֹנִים לָאָדָם, אֶמְצָעִים לְמָדוֹֹר, תַּחְתִּיִּים לְזֶבֶל (שם):", "rashi_en": "צהר A LIGHT — Some say this was a window; others say that it was a precious stone that gave light to them (Genesis Rabbah 31:11).<br><br>ואל אמה תכלנה מלמעלה AND TO A CUBIT SHALT THOU FINISH IT UPWARD — Its covering (roof) slanted upwards so that it narrowed at the top to a cubit, in order that the water should run off on both sides.<br><br>בצדה תשים THOU SHALT SET [THE DOOR] IN THE SIDE THEREOF — in order that the rain might not penetrate.<br><br>תחתים שנים ושלישים WITH LOWER, SECOND AND THIRD STORIES — Three stories one above the other: the top rooms for the human beings, the middle ones as cabins for the cattle, and the bottom was for the refuse (Sanhedrin 108b)."}, {"ch": 6, "v": 17, "aliyah": 1, "heb": "וַאֲנִ֗י הִנְנִי֩ מֵבִ֨יא אֶת־הַמַּבּ֥וּל מַ֙יִם֙ עַל־הָאָ֔רֶץ לְשַׁחֵ֣ת כׇּל־בָּשָׂ֗ר אֲשֶׁר־בּוֹ֙ ר֣וּחַ חַיִּ֔ים מִתַּ֖חַת הַשָּׁמָ֑יִם כֹּ֥ל אֲשֶׁר־בָּאָ֖רֶץ יִגְוָֽע׃", "onk": "וַאֲנָא הָא אֲנָא מַיְתֵי יָת טוֹפָנָא מַיָּא עַל אַרְעָא לְחַבָּלָא כָּל בִּשְׂרָא דִּי בֵיהּ רוּחָא דְחַיֵּי מִתְּחוֹת שְׁמַיָּא כֹּל דִּי בְאַרְעָא יְמוּת:", "onk_en": "Behold I am bringing the flood waters on the earth, to destroy all flesh in which there is the breath of life, from under the heavens. Everything that is on the land will perish.", "pj": "וַאֲנָא הָאֲנָא מַיְתֵי יַת טוּבְעָנָא מַיָא עַל אַרְעָא לְמִכְלָא כָּל בִּשְרָא דְבֵיהּ רוּחָא דְחַיֵי מִן תְּחוֹת שְׁמַיָא כָּל דִבְאַרְעָא יִתְנְגַד", "pj_en": "And I, behold, I bring a flood of waters upon the earth to swallow up all flesh which hath in it the spirit of life from under the heavens: whatever is upon the earth shall be swept away.", "tj": "", "tj_en": "", "rashi": "<b>ואני הנני מביא.<\/b> הִנְנִי מוּכָן לְהַסְכִּים עִם אוֹתָם שֶׁזֵּרְזוּנִי וְאָמְרוּ לְפָנַי כְּבָר מָה אֱנוֹשׁ כִּי תִזְכְּרֶנּוּ (תה' ח'):<br><br><b>מבול.<\/b> שֶׁבִּלָּה אֶת הַכֹּל, שֶׁבִּלְבֵּל אֶת הַכֹּל, שֶׁהוֹבִיל אֶת הַכֹּל מִן הַגָּבוֹהַּ לַנָּמוּךְ; וְזֶהוּ לְשׁוֹן אֻנְקְלוֹס שֶׁתִּרְגֵּם טוֹפָנָא, שֶׁהֵצִיף אֶת הַכֹּל, וֶהֱבִיאָהּ לְבָבֶל שֶׁהִיא עֲמֻקָּה, לְכָךְ נִקְרֵאת שִׁנְעָר, שֶׁנִּנְעֲרוּ שָׁם כָּל מֵתֵי מַבּוּל:", "rashi_en": "ואני הנני מביא AND I, BEHOLD, I DO BRING — God says, “Now I am prepared to agree with those angels who cautioned Me and long ago said to Me (when I was about to create man), (Psalms 8:5) “What is man that thou art mindful of him” (Genesis Rabbah 31:12).<br><br>מבול A FLOOD — so called because it ruined (בלה) everything; because it cast everything into confusion (בלל), and because it brought (הוביל from root יבל) everything down from the heights to a lower level. And this last explanation underlies the translation of Onkelos who translates it by טופנא (Ar. טוף = Heb. צוף) because the Flood caused everything to float about and brought it (the Ark) to Babel which is a low-lying district. That is the reason why it (Babylon) is called, also, Shinar (שנער): because all those who died through the Flood were shaken out (ננערו) into it (Shabbat 113b). "}, {"ch": 6, "v": 18, "aliyah": 1, "heb": "וַהֲקִמֹתִ֥י אֶת־בְּרִיתִ֖י אִתָּ֑ךְ וּבָאתָ֙ אֶל־הַתֵּבָ֔ה אַתָּ֕ה וּבָנֶ֛יךָ וְאִשְׁתְּךָ֥ וּנְשֵֽׁי־בָנֶ֖יךָ אִתָּֽךְ׃", "onk": "וְאָקֵם יָת קְיָמִי עִמָּךְ וְתֵעוֹל לְתֵבוֹתָא אַתְּ וּבְנָךְ וְאִתְּתָךְ וּנְשֵׁי בְנָךְ עִמָּךְ:", "onk_en": "I established My covenant with you. You shall go into the ark, you, your sons, your wife and your son’s wives, with you.", "pj": "וְאָקִים יַת קְיָימִי עִמָךְ וְתֵיעוֹל לְתֵיבוּתָא אַנְתְּ וּבְנָךְ וְאִנְתְּתָךְ וּנְשֵׁי בְנָךְ עִמָּךְ", "pj_en": "But I will establish my covenant with thee; and thou shalt go into the ark, thou, and thy sons, and thy wife, and the wives of thy sons with thee.", "tj": "", "tj_en": "", "rashi": "<b>והקמתי את בריתי.<\/b> בְּרִית הָיָה צָרִיךְ עַל הַפֵּרוֹת שֶׁלֹּא יִרְקְבוּ וִיעַפְּשׁוּ וְשֶׁלֹּא יַהַרְגוּהוּ רְשָׁעִים שֶׁבַּדּוֹר (ב\"ר):<br><br><b>אתה ובניך ואשתך.<\/b> הָאֲנָשִׁים לְבַד וְהַנָּשִׁים לְבַד; מִכָּאן שֶׁנֶּאֱסְרוּ בְּתַשְׁמִישׁ הַמִּטָּה: (שם):", "rashi_en": "והקמתי את בריתי BUT I WILL ESTABLISH MY COVENANT — A covenant was necessary for the sake of the fruits that they should not rot or decay; and also that the wicked people of that generation should not kill him (Genesis Rabbah 31:12)<br><br>אתה ובניך ואשתך THOU, AND THY SONS AND THY WIFE — Males separately and females separately. From this one may infer that they were not permitted to live together in the Ark as man and wife (Sanhedrin 108b). "}, {"ch": 6, "v": 19, "aliyah": 1, "heb": "וּמִכׇּל־הָ֠חַ֠י מִֽכׇּל־בָּשָׂ֞ר שְׁנַ֧יִם מִכֹּ֛ל תָּבִ֥יא אֶל־הַתֵּבָ֖ה לְהַחֲיֹ֣ת אִתָּ֑ךְ זָכָ֥ר וּנְקֵבָ֖ה יִֽהְיֽוּ׃", "onk": "וּמִכָּל דְּחַי מִכָּל בִּשְׂרָא תְּרֵין מִכֹּלָא תָּעֵיל לְתֵבוֹתָא לְקַיָּמָא עִמָּךְ דְּכַר וְנָקְבָּא יְהוֹן:", "onk_en": "From all living things, from all flesh, two of each shall you bring to the ark, to keep them alive with you. They shall be male and female.", "pj": "וּמִן כָּל דְחַי מִכָּל בִּשְרָא תְּרֵין מִכּוֹלָא תֵּיעוּל לְתֵיבוּתָא לְקַיְימָא עִמָךְ דְכַר וְנוּקְבָא יְהוֹן", "pj_en": "And of all that liveth of all flesh, two of every (kind) shall go into the ark, to be preserved alive with thee: male and female shall they be.", "tj": "", "tj_en": "", "rashi": "<b>ומכל החי.<\/b> אֲפִלּוּ שֵׁדִים (ב\"ר):<br><br><b>שנים מכל.<\/b> מִן הַפָּחוּת שֶׁבָּהֶם לֹא פָּחוֹת מִשְּׁנַיִם, אֶחָד זָכָר וְאֶחָד נְקֵבָה:", "rashi_en": "ומכל החי AND OF EVERY LIVING THING — Even of demons (Genesis Rabbah 31:13).<br><br>שנים מכל TWO OF EVERY SORT — Even of the least numerous amongst them there were not less than two—one male, the other female."}, {"ch": 6, "v": 20, "aliyah": 1, "heb": "מֵהָע֣וֹף לְמִינֵ֗הוּ וּמִן־הַבְּהֵמָה֙ לְמִינָ֔הּ מִכֹּ֛ל רֶ֥מֶשׂ הָֽאֲדָמָ֖ה לְמִינֵ֑הוּ שְׁנַ֧יִם מִכֹּ֛ל יָבֹ֥אוּ אֵלֶ֖יךָ לְהַֽחֲיֽוֹת׃", "onk": "מֵעוֹפָא לִזְנוֹהִי וּמִן בְּעִירָא לִזְנַהּ וּמִכֹּל רִחֲשָׁא דְאַרְעָא לִזְנוֹהִי תְּרֵין מִכֹּלָּא יַעֲלוּן לְוָתָךְ לְקַיָּמָא:", "onk_en": "From the birds of their kind, from the animals of their kind, from every creeping thing of the earth of its kind, two of each will come to you to be kept alive.", "pj": "מֵעוֹפָא לִזְנֵיהּ וּמִבְּעִירָה לִזְנֵיהּ וּמִכָּל רִיחֲשָׁא דְאַרְעָא לִזְנֵיהּ תְּרֵין מִכּוֹלָא יַעֲלוּן לְוָותָךְ עַל יַד מַלְאָכָא דְאָחַד וּמֵיעַל יַתְהוֹן לָךְ לְקַיְימָא", "pj_en": "Of the fowl after its kind, and of all cattle after its kind, and of every reptile of the earth after its kind, two of every (sort) shall enter to thee by the hand of the angel, who will take and cause them to enter to thee, to be preserved.", "tj": "", "tj_en": "", "rashi": "<b>מהעוף למינהו.<\/b> אוֹתָן שֶׁדָּבְקוּ בְמִינֵיהֶם וְלֹא הִשְׁחִיתוּ דַרְכָּם, וּמֵאֵלֵיהֶם בָּאוּ, וְכֹל שֶׁהַתֵּבָה קוֹלַטְתּוֹ הִכְנִיס (ב\"ר):", "rashi_en": "מהעוף למינהו OF THE FOWLS AFTER THEIR KIND— those that had kept to their own species and had not corrupted their way (taking the words to mean, “of the fowls that had kept to their own kind”). All these came of their own accord, but only those which the Ark was allowing to pass in did Noah permit to enter (Sanhedrin 108b). "}, {"ch": 6, "v": 21, "aliyah": 1, "heb": "וְאַתָּ֣ה קַח־לְךָ֗ מִכׇּל־מַֽאֲכָל֙ אֲשֶׁ֣ר יֵֽאָכֵ֔ל וְאָסַפְתָּ֖ אֵלֶ֑יךָ וְהָיָ֥ה לְךָ֛ וְלָהֶ֖ם לְאׇכְלָֽה׃", "onk": "וְאַתְּ סַב לָךְ מִכָּל מֵיכַל דִּמִתְאֲכֵל וְתִכְנוֹשׁ לְוָתָךְ וִיהֵי לָךְ וּלְהוֹן לְמֵיכָל:", "onk_en": "You shall take for yourself from all [the] foods that are eaten, and gather it to yourself, and it will be food for you and for them.", "pj": "וְאַתְּ סַב לָךְ מִכָּל מֵיכַל דְמִיתְאָכִיל וִיהֵי לָךְ וּלְהוֹן לְמֵיכָל", "pj_en": "And thou, take to thee of all food that is eaten, and let it be to thee and to them for food.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 22, "aliyah": 1, "heb": "וַיַּ֖עַשׂ נֹ֑חַ כְּ֠כֹ֠ל אֲשֶׁ֨ר צִוָּ֥ה אֹת֛וֹ אֱלֹהִ֖ים כֵּ֥ן עָשָֽׂה׃", "onk": "וַעֲבַד נֹח כְּכֹל דִּי פַקֵּיד יָתֵיהּ יְיָ כֵּן עֲבָד:", "onk_en": "Noach did so. All that he was commanded by Elohim, he did.", "pj": "וַעֲבַד נחַ כְּכָל דְפַקְדֵיהּ יְיָ", "pj_en": "And Noah did according to all that the Lord had instructed him.", "tj": "", "tj_en": "", "rashi": "<b>ויעש נח.<\/b> זֶה בִּנְיַן הַתֵּבָה:", "rashi_en": "ויעש נח THUS DID NOAH — This refers to the building of the Ark (Genesis Rabbah 31:14)."}, {"ch": 7, "v": 1, "aliyah": 2, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ לְנֹ֔חַ בֹּֽא־אַתָּ֥ה וְכׇל־בֵּיתְךָ֖ אֶל־הַתֵּבָ֑ה כִּֽי־אֹתְךָ֥ רָאִ֛יתִי צַדִּ֥יק לְפָנַ֖י בַּדּ֥וֹר הַזֶּֽה׃", "onk": "וַאֲמַר יְיָ לְנֹחַ עוּל אַתְּ וְכָל אֱנַשׁ בֵּיתָךְ לְתֵבוֹתָא אֲרֵי יָתָךְ חֲזֵיתִי זַכַּאי קֳדָמַי בְּדָרָא הָדֵין:", "onk_en": "Adonoy said to Noach, Come into the ark, you and your household, for I have seen that you are righteous before Me, in this generation.", "pj": "וַאֲמַר יְיָ לְנחַ עוֹל אַנְתְּ וְכָל אֵינַשׁ בֵּיתָךְ לְתֵבוּתָא אֲרוּם יָתָךְ חֲמִיתִי זַכַּאי קֳדָמַי בְּדָרָא הָדֵין", "pj_en": "And the Lord said to Noah, Enter, thou, and every one of thy house, into the ark; for thee have I seen righteous before me in this generation.", "tj": "", "tj_en": "", "rashi": "<b>ראיתי צדיק.<\/b> וְלֹא נֶאֱמַר צַדִּיק תָּמִים, מִכָּאן שֶׁאוֹמְרִים מִקְצַת שִׁבְחוֹ שֶׁל אָדָם בְּפָנָיו וְכֻלּוֹ שֶׁלֹּא בְּפָנָיו (ב\"ר):", "rashi_en": "ראיתי צדיק [THEE] HAVE I SEEN RIGHTEOUS — It does not say “righteous and wholehearted” (as it does at the beginning of the Sedrah); hence we may infer that only a part of a man’s good qualities should be enumerated in his presence (since here God is speaking to Noah and calls him only “righteous”), but that in his absence the whole of his good qualities may be told (since when the Torah speaks about him in the earlier passage it calls him “righteous and wholehearted”) (Eruvin 18b). "}, {"ch": 7, "v": 2, "aliyah": 2, "heb": "מִכֹּ֣ל&thinsp;<b>׀<\/b> הַבְּהֵמָ֣ה הַטְּהוֹרָ֗ה תִּֽקַּח־לְךָ֛ שִׁבְעָ֥ה שִׁבְעָ֖ה אִ֣ישׁ וְאִשְׁתּ֑וֹ וּמִן־הַבְּהֵמָ֡ה אֲ֠שֶׁ֠ר לֹ֣א טְהֹרָ֥ה הִ֛וא שְׁנַ֖יִם אִ֥ישׁ וְאִשְׁתּֽוֹ׃", "onk": "מִכֹּל בְּעִירָא דַכְיָא תִּסַּב לָךְ שַׁבְעָא שַׁבְעָא דְּכַר <b>וְנָקְבָּא<\/b> וּמִן בְּעִירָא דִּלָא (אִיתָהָא) דַכְיָא הִיא תְּרֵין דְּכַר <b>וְנָקְבָּא<\/b>:", "onk_en": "Of every [ritually] clean animal, take to yourself seven pairs, male and its mate [<b>female<\/b>]. Of every animal that is not clean, [take] two, the male and its mate [<b>female<\/b>].", "pj": "מִכָּל בְּעִירָא דַכְיָא תִּסַב לָךְ שׁוּבְעָא שׁוּבְעָא דְכַר וְנוּקְבָא וּמִן בְּעִירָא דְלֵיתֵיהּ דַכְיָא תְּרֵין דְכַר וְנוּקְבָא", "pj_en": "Of all clean cattle take thou seven by seven, male and female, and of all cattle not clean, two (and two), male and female.", "tj": "", "tj_en": "", "rashi": "<b>הטהורה.<\/b> הָעֲתִידָה לִהְיוֹת טְהוֹרָה לְיִשְׂרָאֵל; לָמַדְנוּ שֶׁלָּמַד נֹחַ תּוֹרָה (שם פ' כ\"ו):<br><br><b>שבעה שבעה.<\/b> כְּדֵי שֶׁיַּקְרִיב מֵהֶם קָרְבָּן בְּצֵאתוֹ:", "rashi_en": "הטהורה CLEAN—It means those cattle which will in future be permitted to Israel as clean; we thus learn that Noah studied the Torah.<br><br>שבעה שבעה SEVEN AND SEVEN — so many, in order that he might offer some of them as a sacrifice when leaving the Ark (Genesis Rabbah 34:9). "}, {"ch": 7, "v": 3, "aliyah": 2, "heb": "גַּ֣ם מֵע֧וֹף הַשָּׁמַ֛יִם שִׁבְעָ֥ה שִׁבְעָ֖ה זָכָ֣ר וּנְקֵבָ֑ה לְחַיּ֥וֹת זֶ֖רַע עַל־פְּנֵ֥י כׇל־הָאָֽרֶץ׃", "onk": "אַף מֵעוֹפָא דִשְׁמַיָּא שַׁבְעָא שַׁבְעָא דְּכַר וְנָקְבָּא לְקַיָּמָא זַרְעָא עַל אַפֵּי כָל אַרְעָא:", "onk_en": "Also of the birds of the heaven, [take] seven pairs, male and female; to keep seed alive upon the face of the earth.", "pj": "בְּרַם מִן צִפְּרֵי שְׁמַיָא שׁוּבְעָא שׁוּבְעָא דְכַר וְנֻקְבָא לְקַיָימָא מִנְהוֹן זַרְעָא עַל אַרְעָא", "pj_en": "But of birds of the heaven, seven by seven, male and female, to preserve from them seed upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>גם מעוף השמים וגו'.<\/b> בִּטְהוֹרִים הַכָּתוּב מְדַבֵּר, וְלָמַד סָתוּם מִן הַמְפֹרָשׁ:", "rashi_en": "‘גס מעוף השמים וגו OF FOWLS ALSO OF THE AIR — Scripture here means “clean” birds just as the animals in verse 2 are stated to be clean, for what is not explicitly stated may be learned by analogy from what is explicitly stated. "}, {"ch": 7, "v": 4, "aliyah": 2, "heb": "כִּי֩ לְיָמִ֨ים ע֜וֹד שִׁבְעָ֗ה אָֽנֹכִי֙ מַמְטִ֣יר עַל־הָאָ֔רֶץ אַרְבָּעִ֣ים י֔וֹם וְאַרְבָּעִ֖ים לָ֑יְלָה וּמָחִ֗יתִי אֶֽת־כׇּל־הַיְקוּם֙ אֲשֶׁ֣ר עָשִׂ֔יתִי מֵעַ֖ל פְּנֵ֥י הָֽאֲדָמָֽה׃", "onk": "אֲרֵי <b>לִזְמַן<\/b> יוֹמִין עוֹד שַׁבְעָא אֲנָא <b>מָחֵת<\/b> מִטְרָא עַל אַרְעָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן וְאֶמְחֵי יָת כָּל יְקוּמָא דִי עַבְדַת מֵעַל אַפֵּי אַרְעָא:", "onk_en": "Because in another [<b>at the completion of another<\/b>] seven days I will bring rain [<b>I will cause rain to descend<\/b>] on the earth [and it will rain] forty days and forty nights, and I will obliterate every living substance that I have made, from the face of the earth.", "pj": "אֲרוּם הָא אֲנָא יָהִיב לְכוֹן אַרְכָּא שׁוּבְעָא יוֹמִין אִין יְתוּבוּן יִשְׁתְּבַק לְהוֹן וְאִין לָא יְתוּבוּן לִזְמַן יוֹמִין תּוּב שׁוּבְעָא אֲנָא מָחִית מִטְרָא עַל אַרְעָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילְוָן וְאֵישֵׁיצֵי יַת כָּל גְוִיַת אֵינַשׁ וּבְעִיר מִן אַרְעָא", "pj_en": "For, behold, I give you space of seven days; if they will be converted, it shall be forgiven them; but if they will not be converted, after a time of days yet seven, I will cause rain to come down upon the earth forty days and forty nights, and will destroy all bodies of man and of beast upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>כי לימים עוד שבעה.<\/b> אֵלּוּ ז' יְמֵי אֶבְלוֹ שֶׁל מְתוּשֶׁלַח הַצַּדִּיק שֶׁחָס הַקָּבָּ\"ה עַל כְּבוֹדוֹ וְעִכֵּב אֶת הַפֻּרְעָנוּת. צֵא וַחֲשֹׁב שְׁנוֹתָיו שֶׁל מְתוּשֶׁלַח וְתִמְצָא שֶׁהֵם כָּלִים בִּשְנַת ת\"ר שָׁנָה לְחַיֵּי נֹחַ (סנה' ק\"ח):<br><br><b>כי לימים עוד.<\/b> מַהוּ עוֹד? זְמַן אַחַר זְמַן זֶה נוֹסָף עַל ק\"כ שָׁנָה:<br><br><b>ארבעים יום.<\/b> כְּנֶגֶד יְצִירַת הַוָּלָד, שֶׁקִּלְקְלוּ לְהַטְרִיחַ לְיוֹצְרָם לָצוּר צוּרַת מַמְזֵרִים:", "rashi_en": "כי לימים עוד שבעה FOR YET SEVEN DAYS — These are the seven days of mourning for the righteous man Methuselah for whose honour the Holy One, blessed be He, had regard, and therefore postponed punishment. Go and calculate the years of Methuselah and you will find that they came to an end (i. e. he died) in the six hundredth year of Noah’s life (which coincided with the date of the Flood) (Sanhedrin 108b).<br><br>כי לימים עוד FOR YET [SEVEN] DAYS — What is meant by עוד \"yet\", \"more\"? A further period of time: this period (seven days) additional to the 120 years of respite that was promised (Sanhedrin 108b).<br><br>ארבעים יום FORTY DAYS — corresponding to the period of a child’s formation, for by their sinning they had troubled their Creator to form embryos of illegitimate children (Genesis Rabbah 32:5). "}, {"ch": 7, "v": 5, "aliyah": 2, "heb": "וַיַּ֖עַשׂ נֹ֑חַ כְּכֹ֥ל אֲשֶׁר־צִוָּ֖הוּ יְהֹוָֽה׃", "onk": "וַעֲבַד נֹחַ כְּכֹל דִּי פַקְּדֵיהּ יְיָ:", "onk_en": "Noach did all that Adonoy commanded him.", "pj": "וְעָבַד נחַ כְּכָל דְפַקְדֵיהּ יְיָ", "pj_en": "And Noah did according to all that the Lord had commanded him.", "tj": "", "tj_en": "", "rashi": "<b>ויעש נח.<\/b> זֶה בִיאָתוֹ לַתֵּבָה:", "rashi_en": "ויעש נח AND NOAH DID — This refers to his coming to the Ark. "}, {"ch": 7, "v": 6, "aliyah": 2, "heb": "וְנֹ֕חַ בֶּן־שֵׁ֥שׁ מֵא֖וֹת שָׁנָ֑ה וְהַמַּבּ֣וּל הָיָ֔ה מַ֖יִם עַל־הָאָֽרֶץ׃", "onk": "וְנֹחַ בַּר שִׁתְּ מְאָה שְׁנִין וְטוֹפָנָא הֲוָה מַיָּא עַל אַרְעָא:", "onk_en": "Noach was six hundred years old when the flood waters were on the earth.", "pj": "וְנחַ בַּר שִׁית מְאָה שְׁנִין וְטוּבְעָנָא הֲוָה מַיָא עַל אַרְעָא", "pj_en": "And Noah was the son of six hundred years when the deluge of waters was upon the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 7, "aliyah": 2, "heb": "וַיָּ֣בֹא נֹ֗חַ וּ֠בָנָ֠יו וְאִשְׁתּ֧וֹ וּנְשֵֽׁי־בָנָ֛יו אִתּ֖וֹ אֶל־הַתֵּבָ֑ה מִפְּנֵ֖י מֵ֥י הַמַּבּֽוּל׃", "onk": "וְעָאל נֹחַ וּבְנוֹהִי וְאִתְּתֵיהּ וּנְשֵׁי בְנוֹהִי עִמֵּיהּ לְתֵבוֹתָא מִן קֳדָם מֵי טוֹפָנָא:", "onk_en": "Noach went in, and his sons, his wife, and his son’s wives, with him, into the ark, because of the waters of the Flood.", "pj": "וְעַל נחַ וּבְנוֹהִי וְאִינְתְּתֵיהּ וּנְשֵׁי בְנוֹי עִמֵיהּ לְתֵיבוּתָא מִן קֳדָם מוֹי דְטוּבְעָנָא", "pj_en": "And Noah entered, with his sons and his wife and the wives of his sons with him, into the ark, from before the waters of the deluge.", "tj": "", "tj_en": "", "rashi": "<b>נח ובניו.<\/b> הָאֲנָשִׁים לְבַד וְהַנָּשִׁים לְבַד, לְפִי שֶׁנֶּאֱסְרוּ בְּתַשְׁמִישׁ הַמִּטָּה מִפְּנֵי שֶׁהָעוֹלָם שָׁרוּי בְּצַעַר:<br><br><b>מפני מי המבול.<\/b> אַף נֹחַ מִקְּטַנֵּי אֲמָנָה הָיָה, מַאֲמִין וְאֵינוֹ מַאֲמִין שֶׁיָבֹא הַמַּבּוּל, וְלֹא נִכְנַס לַתֵּבָה עַד שֶׁדְּחָקוּהוּ הַמַּיִם:", "rashi_en": "נח ובניו NOAH AND HIS SONS — The men separately and the women separately, because they were forbidden to live together as man and wife since the world was living in a state of distress<br><br>מפני מי המבול BECAUSE OF THE WATERS OF THE FLOOD — (מפני properly means ‘‘from before”) — Noah, also, was of those people who are wanting in faith: he believed and he did not believe that the Flood would come, and he would not enter the Ark until the waters forced him to do so (Genesis Rabbah 32:6)."}, {"ch": 7, "v": 8, "aliyah": 2, "heb": "מִן־הַבְּהֵמָה֙ הַטְּהוֹרָ֔ה וּמִ֨ן־הַבְּהֵמָ֔ה אֲשֶׁ֥ר אֵינֶ֖נָּה טְהֹרָ֑ה וּמִ֨ן־הָע֔וֹף וְכֹ֥ל אֲשֶׁר־רֹמֵ֖שׂ עַל־הָֽאֲדָמָֽה׃", "onk": "מִן בְּעִירָא דַּכְיָא וּמִן בְּעִירָא דִּי לֵיתָהָא דַּכְיָא וּמִן עוֹפָא וְכֹל דִּי רָחֵשׁ עַל אַרְעָא:", "onk_en": "Of the [ritually] clean animals, and the animals that are not [ritually] clean, of the birds, and of every thing that creeps on the earth.", "pj": "מִן בְּעִירָא דַכְיָא וּמִן בְּעִירָא דְלֵיתָא דַכְיָא וּמִן עוֹפָא וְכָל דְרָחִישׁ עַל אַרְעָא", "pj_en": "Of all cattle clean, and of cattle unclean, of birds, and of whatever creepeth upon the earth,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 9, "aliyah": 2, "heb": "שְׁנַ֨יִם שְׁנַ֜יִם בָּ֧אוּ אֶל־נֹ֛חַ אֶל־הַתֵּבָ֖ה זָכָ֣ר וּנְקֵבָ֑ה כַּֽאֲשֶׁ֛ר צִוָּ֥ה אֱלֹהִ֖ים אֶת־נֹֽחַ׃", "onk": "תְּרֵין תְּרֵין עַלּוּ לְוַת נֹחַ לְתֵבוֹתָא דְּכַר וְנָקְבָּא כְּמָא דִי פַקֵּיד יְיָ יָת נֹחַ:", "onk_en": "Two by two they came to Noach into the ark, male and female, as Elohim had commanded Noach.", "pj": "תְּרֵין תְּרֵין עָאלוּ לְנחַ לְתֵבוּתָא דְכַר וְנוּקְבָא הֵיכְמָא דְפַקֵיד יְיָ יַת נחַ", "pj_en": "two and two they entered unto Noah into the ark, male and female, as the Lord had instructed Noah.", "tj": "", "tj_en": "", "rashi": "<b>שנים שנים.<\/b> כֻּלָם הֻשְׁווּ בְּמִנְיָן זֶה – מִן הַפָּחוּת הָיוּ שְׁנַיִם:<br><br><b>באו אל נח.<\/b> מֵאֵלֵיהֶן:", "rashi_en": "שנים שנים TWO AND TWO —In this number they were all equal — the least number was two.<br><br>באו אל נח THEY CAME TO NOAH — of their own accord (Genesis Rabbah 32). "}, {"ch": 7, "v": 10, "aliyah": 2, "heb": "וַיְהִ֖י לְשִׁבְעַ֣ת הַיָּמִ֑ים וּמֵ֣י הַמַּבּ֔וּל הָי֖וּ עַל־הָאָֽרֶץ׃", "onk": "וַהֲוָה <b>לִזְמַן<\/b> שִׁבְעַת יוֹמִין וּמֵי טוֹפָנָא הֲווֹ עַל אַרְעָא:", "onk_en": "Seven [<b>complete<\/b>] days had passed, and the flood waters were on the earth.", "pj": "וַהֲוָה לִזְמַן שׁוּבְעָא יוֹמִין מִן בָּתַר דִשְׁלִים אוּבְלֵיהּ דִמְתוּשֶׁלַח חֲמָא יְיָ וְהָא לָא תָּבָן בְּנֵי נְשָׁא וּמוֹי דְטוּבְעָנָא הֲווֹ נַחְתִין רְתִיחִין מִן שְׁמַיָא עִילוֹי אַרְעָא", "pj_en": "And it was at the time of seven days after the conclusion of the mourning for Methushelach, that the Lord beheld, and, lo, the sons of men had not turned. And the waters of the deluge came down hotly from the heavens upon the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 11, "aliyah": 2, "heb": "בִּשְׁנַ֨ת שֵׁשׁ־מֵא֤וֹת שָׁנָה֙ לְחַיֵּי־נֹ֔חַ בַּחֹ֙דֶשׁ֙ הַשֵּׁנִ֔י בְּשִׁבְעָֽה־עָשָׂ֥ר י֖וֹם לַחֹ֑דֶשׁ בַּיּ֣וֹם הַזֶּ֗ה נִבְקְעוּ֙ כׇּֽל־מַעְיְנֹת֙<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז מַעְיְנוֹת֙)<\/i> תְּה֣וֹם רַבָּ֔ה וַאֲרֻבֹּ֥ת הַשָּׁמַ֖יִם נִפְתָּֽחוּ׃", "onk": "בִּשְׁנַת שִׁתְּ מְאָה שְׁנִין לְחַיֵּי נֹחַ בְּיַרְחָא תִּנְיָנָא בְּשִׁבְעַת עַשְׂרָא יוֹמָא לְיַרְחָא בְּיוֹמָא הָדֵין אִתְבְּזָעוּ כָּל מַבּוּעֵי תְּהוֹמָא רַבָּא וְכַוֵּי שְׁמַיָּא אִתְפַּתָּחוּ:", "onk_en": "In the six hundredth year of Noach’s life, in the second month, on the seventeenth day of the month, on that day, all the wellsprings of the great deep, burst open, and the windows of the heavens were opened.", "pj": "בִּשְׁנַת שִׁית מְאָה שְׁנִין לְחַיֵי נחַ בְּיַרְחָא תִנְיָינָא הוּא יְרַח מַרְחֶשְׁוָן דְעַד כְּדוֹן לָא הֲווֹ מִתְמַנָן יַרְחַיָא אֱלָהֵן מִתִּשְׁרֵי דַהֲוָה רֵישׁ שַׁתָּא לְשִׁכְלוֹל עַלְמָא בְּשֶׁבְסְרֵי יוֹמִין לְיַרְחָא בְּיוֹמָא הָדֵין אִתְבְּזָעוּ כָּל מַבּוּעֵי תְהוֹמָא רַבָּא וַהֲווֹן בְּנֵי גוּבְרַיָא מְשַׁוְויָן תַּמָן בְּנֵיהוֹן וּסְתָּמִין יַתְהוֹן וּבָתַר הָכִי חֲרַכֵּי שְׁמַיָא אִתְפַּתָּחוּ", "pj_en": "In the six-hundredth year of the life of Noah, in the second month, which was the month of Marchesvan, for hitherto the months had been numbered from Tishri which was the beginning of the year at the completion of the world, in the seventeenth day of the month, in that day were all the fountains of the great deep broken up. And the giants were gathered there together with their sons and perturbed them, and afterwards the windows of heaven were opened.", "tj": "וַחֲרַכֵּי שְׁמַיָא אִתְפַּתָּחוּ:", "tj_en": "And the windows of heaven were opened.", "rashi": "<b>בחודש השני.<\/b> רַבִּי אֱלִיעֶזֶר אוֹמֵר זֶה מַרְחֶשְׁוָן; רַבִּי יְהוֹשֻׁעַ אוֹמֵר זֶה אִיָּר (ר\"ה י\"א):<br><br><b>נבקעו.<\/b> לְהוֹצִיא מֵימֵיהֶן:<br><br><b>תהום רבה.<\/b> מִדָּה כְנֶגֶד מִדָּה, הֵם חָטְאוּ בְּרַבָּה רָעַת הָאָדָם וְלָקוּ בִּתְהוֹם רַבָּה:", "rashi_en": "בחדש  השני IN THE SECOND MONTH — Rabbi Eliezer said, “This is the month Marcheshvan”; Rabbi Joshua said, “This is the month Eyar (Rosh Hashanah 11b).<br><br>נבקעו WERE BROKEN UP — so that they might give forth their waters.<br><br>תהום רבה THE GREAT DEEP — Measure for measure: they had sinned with רבה רעת האדם “great was the evil of man” (i. e. their sin is described by the word רבה “great”) and they were therefore punished by תהום רבה “the great deep” (i.e. the expression “great’’ is used of the instrument by which they were punished for their great sin) (Sanhedrin 108a). "}, {"ch": 7, "v": 12, "aliyah": 2, "heb": "וַיְהִ֥י הַגֶּ֖שֶׁם עַל־הָאָ֑רֶץ אַרְבָּעִ֣ים י֔וֹם וְאַרְבָּעִ֖ים לָֽיְלָה׃", "onk": "וַהֲוָה מִטְרָא <b>נָחַת<\/b> עַל אַרְעָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן:", "onk_en": "There was rain [<b>descending<\/b>] on the earth forty days and forty nights.", "pj": "וַהֲוָה מִטְרָא נָחִית עַל אַרְעָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילַוָן", "pj_en": "And the rain came down upon the earth forty days and forty nights.", "tj": "", "tj_en": "", "rashi": "<b>ויהי הגשם על הארץ.<\/b> וּלְהַלָּן הוּא אוֹמֵר וַיְהִי הַמַּבּוּל? אֶלָּא כְּשֶׁהוֹרִידָן הוֹרִידָן בְּרַחֲמִים, שֶׁאִם יַחְזְרוּ יִהְיוּ גִּשְׁמֵי בְרָכָה; כְּשֶׁלֹּא חָזְרוּ הָיוּ לְמַבּוּל:<br><br><b>ארבעים יום וגו'.<\/b> אֵין יוֹם רִאשׁוֹן מִן הַמִּנְיָן, לְפִי שֶׁאֵין לֵילוֹ עִמּוֹ שֶׁהֲרֵי כְתִיב בַּיּוֹם הַזֶּה נִבְקְעוּ כָּל מַעְיְנֹת, נִמְצְאוּ אַרְבָּעִים יוֹם כָּלִים בְּכ\"ח בְּכִסְלֵו לְרַבִּי אֱלִיעֱזֶר, שֶׁהַחֳדָשִׁים נִמְנִין כְּסִדְרָן אֶחָד מָלֵא וְאֶחָד חָסֵר, הֲרֵי י\"ב מִמַּרְחֶשְׁוָן וְכ\"ח מִכִּסְלֵו:", "rashi_en": "ויהי הגשם על הארץ AND THE RAIN WAS UPON THE EARTH — But later on (v. 17) it says. “And the Flood was upon the earth”! But the explanation is this: when He poured down the water at first He made it fall in mercy (gently), in order that if the people would repent, it might prove a rain of blessing; but when they did not repent it became a destructive flood (Genesis Rabbah 31:12) .<br><br>‘ארבעים יום וגו FORTY DAYS AND [FORTY NIGHTS] — The first day is not included in this number, because its night (i.e. the night that preceded it, since according to Jewish reckoning a “day” comprises night-time and the following day-time) was not included with it — for it is written (v. 11) “On the same day (i. e. day-time) were all the fountains of the great deep broken up”. (Consequently the forty days ended, according to R. Eliezer, on the 28th day of Kislev (Rosh Hashanah 11b). as the months are counted as regular months, one full (of 30 days) and the next defective (of 29 days), so we have, 12 days of Marcheshvan and 28 days of Kislev. "}, {"ch": 7, "v": 13, "aliyah": 2, "heb": "בְּעֶ֨צֶם הַיּ֤וֹם הַזֶּה֙ בָּ֣א נֹ֔חַ וְשֵׁם־וְחָ֥ם וָיֶ֖פֶת בְּנֵי־נֹ֑חַ וְאֵ֣שֶׁת נֹ֗חַ וּשְׁלֹ֧שֶׁת נְשֵֽׁי־בָנָ֛יו אִתָּ֖ם אֶל־הַתֵּבָֽה׃", "onk": "בִּכְרַן יוֹמָא הָדֵין עָל נֹחַ וְשֵׁם וְחָם וָיֶפֶת בְּנֵי נֹחַ וְאִתַּת נֹחַ וּתְלָתָא נְשֵׁי בְנוֹהִי עִמְּהוֹן לְתֵבוֹתָא:", "onk_en": "On that very day, Noach came along with Sheim, Cham, and Yafes, the sons of Noach; Noach’s wife and the three wives of his sons, with them, into the ark.", "pj": "בִּכְרַן יוֹמָא הָדֵין עַל נחַ שֵׁם וְחָם וְיָפֶת בְּנֵי נחַ וְאִתַּת נחַ וּתְלַת נְשֵׁי בְּנוֹהִי עִמֵיהּ לְתֵיבוּתָא", "pj_en": "In that same day entered Noah, and Shem, and Cham, and Yapheth, the sons of Noah, and the wife of Noah, and the three wives of his sons with him, into the ark:", "tj": "", "tj_en": "", "rashi": "<b>בעצם היום הזה.<\/b> לִמֶּדְךָ הַכָּתוּב שֶׁהָיוּ בְנֵי דוֹרוֹ אוֹמְרִים אִלּוּ אָנוּ רוֹאִים אוֹתוֹ נִכְנָס לַתֵּבָה, אָנוּ שׁוֹבְרִין אוֹתָהּ וְהוֹרְגִין אוֹתוֹ, אָמַר הַקָּבָּ\"ה אֲנִי מַכְנִיסוֹ לְעֵינֵי כֻלָּם וְנִרְאֶה דְבַר מִי יָקוּם:", "rashi_en": "בעצם היום הזה IN THE SELFSAME DAY — Scripture teaches you that the people of his generation said: “If we see him enter the Ark we will smash it up and kill him”. The Holy One, blessed be He, thereupon said, ‘‘I will let him enter before the eyes of everyone and we shall see whose word prevails” (Genesis Rabbah 32:8). "}, {"ch": 7, "v": 14, "aliyah": 2, "heb": "הֵ֜מָּה וְכׇל־הַֽחַיָּ֣ה לְמִינָ֗הּ וְכׇל־הַבְּהֵמָה֙ לְמִינָ֔הּ וְכׇל־הָרֶ֛מֶשׂ הָרֹמֵ֥שׂ עַל־הָאָ֖רֶץ לְמִינֵ֑הוּ וְכׇל־הָע֣וֹף לְמִינֵ֔הוּ כֹּ֖ל צִפּ֥וֹר כׇּל־כָּנָֽף׃", "onk": "אִנּוּן וְכָל חַיְתָא לִזְנַהּ וְכָל בְּעִירָא לִזְנַהּ וְכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא לִזְנוֹהִי וְכָל עוֹפָא לִזְנוֹהִי כֹּל צִפַּר <b>כָּל דְּפָרָח<\/b>:", "onk_en": "They, and every beast of its kind, and every animal of its kind, and every creeping thing that creeps on the earth of its kind; and every flying creature of its kind, every bird, every winged creature [<b>every one that flies<\/b>].", "pj": "הִינוּן וְכָל חַיְיתָא לִזְנָהָא וְכָל בְּעִירָא לִזְנָהָא וְכָל רִיחֲשָׁא דִרְחִישׁ עַל אַרְעָא לִזְנֵיהּ כָּל עוֹפָא לִזְנֵיהּ כָּל צִפּוֹר כָּל דְפָרָח", "pj_en": "they, and every animal after his kind, and all cattle after their kind, and every reptile that creepeth upon the earth after his kind, and every fowl after its kind, every bird which flieth.", "tj": "", "tj_en": "", "rashi": "<b>צפור כל כנף.<\/b> דָבוּק הוּא, צִפּוֹר שֶׁל כָּל מִין כָּנָף, לְרַבּוֹת חֲגָבִים (כָּנָף לְשׁוֹן נוֹצָה, כְּמוֹ וְשִׁסַּע אֹתוֹ בִכְנָפָיו, שֶׁאֲפִלּוּ נוֹצָתָהּ עוֹלָה, אַף כָּאן צִפּוֹר כָּל מִין מַרְאִית נוֹצָה):", "rashi_en": "צפור כל כנף [EVERY] BIRD OF EVERY KIND — The word צפור is in the construct state, viz.. birds of every kind of wing, thus including locusts (Chullin 139b). The word כנף means “wingfeather”, as (Leviticus 1:17) “He shall rend it by the wings thereof”, for even its feathers were offered as a sacrifice. Also here, the meaning is, birds with any kind of semblance of wing. "}, {"ch": 7, "v": 15, "aliyah": 2, "heb": "וַיָּבֹ֥אוּ אֶל־נֹ֖חַ אֶל־הַתֵּבָ֑ה שְׁנַ֤יִם שְׁנַ֙יִם֙ מִכׇּל־הַבָּשָׂ֔ר אֲשֶׁר־בּ֖וֹ ר֥וּחַ חַיִּֽים׃", "onk": "וְעַלּוּ <b>עִם<\/b> נֹחַ לְתֵבוֹתָא תְּרֵין תְּרֵין מִכָּל בִּשְׂרָא דִי בֵיהּ רוּחָא דְחַיֵי:", "onk_en": "They came to [<b>with<\/b>] Noach, to the ark, two by two of all the flesh in which there was a breath of life.", "pj": "וְעָלוּ לְוַת נחַ לְתֵיבוּתָא תְּרֵין תְּרֵין מִכָּל בִּישְרָא דְבֵיהּ רוּחָא דְחַיֵי", "pj_en": "And they entered to Noah into the ark, two and two of all flesh in which was the breath of life.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 16, "aliyah": 2, "heb": "וְהַבָּאִ֗ים זָכָ֨ר וּנְקֵבָ֤ה מִכׇּל־בָּשָׂר֙ בָּ֔אוּ כַּֽאֲשֶׁ֛ר צִוָּ֥ה אֹת֖וֹ אֱלֹהִ֑ים וַיִּסְגֹּ֥ר יְהֹוָ֖ה בַּֽעֲדֽוֹ׃", "onk": "וְעָלַיָּא דְּכַר וְנָקְבָּא מִכָּל בִּשְׂרָא עַלּוּ כְּמָא דִי פַקֵּיד יָתֵיהּ יְיָ <b>וַאֲגֵן יְיָ<\/b> (בְּמֵימְרֵיהּ) <b>עֲלוֹהִי<\/b>:", "onk_en": "Those that came were male and female, of all flesh they came, as Elohim had commanded him. Adonoy then [protectively] shut him in [the ark.] [<b>Adonoy protected him.<\/b>]", "pj": "וְעָלַיָא דְכַר וְנוּקְבָא מִן כָּל בִּשְרָא אָעְלוּ הֵיכְמָא דְפַקֵיד יָתֵיהּ יְיָ וְאַגִין מֵימְרָא דַיְיָ יַת תַּרְעָא דְתֵיבוּתָא בְּאַנְפֵּיהּ", "pj_en": "And they coming entered, male and female, of all flesh unto him, as the Lord had instructed him; and the Word of the Lord covered over the door of the ark upon the face thereof.", "tj": "וְחַס מֵימְרֵיהּ דַיְיָ עֲלוֹהִי:", "tj_en": "And the Word of the Lord was merciful upon him.", "rashi": "<b>ויסגור ה' בעדו.<\/b> הֵגֵן עָלָיו שֶׁלֹּא יִשְׁבְּרוּהָ, הִקִּיף הַתֵּבָה דֻּבִּים וַאֲרָיוֹת וְהָיוּ הוֹרְגִים בָּהֶם; וּפְשׁוּטוֹ שֶׁל מִקְרָא סָגַר כְּנֶגֶדוֹ מִן הַמַּיִם, וְכֵן כָּל בְּעַד שֶׁבַּמִּקְרָא לְשׁוֹן כְּנֶגֶד הוּא, בְּעַד כָּל רֶחֶם (בראשית כ׳:י״ח), בַּעֲדֵךְ וּבְעַד בָּנַיִךְ (מ\"ב ד'), עוֹר בְּעַד עוֹר (איוב ב'), מָגֵן בַּעֲדִי (תהלים ג'), הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ (שמואל א' י\"ב) – כְּנֶגֶד עֲבָדֶיךָ:", "rashi_en": "ויסגור ה' בעדו AND THE LORD SHUT HIM IN — He protected him so that they could not smash up the Ark (cf. 5:13): He surrounded the Ark (thus enclosing it סגר) with bears and lions which killed some of them (Genesis Rabbah 32:8). But the literal meaning of the text is: He shut the door in front of him against the waters. Similarly, wherever בעד occurs in the Scriptures it means כנגד in front of. E. g., (20:18) “The lord had made a closure in front of (בעד) every womb”; (2 Kings 4:4) “Close the door in front of thyself (בעדך) and in front of (ובעד) thy sons”; (Job 2:4) ‘‘skin in front of (as a protection for) (בעד) skin”; (Psalms 3:4) “a shield in front of me ובעדי”: (1 Samuel 12:19) “Pray (בעד) thy servants” which means כנגד in front of (i. e. on behalf of, as a protection for) thy servants. "}, {"ch": 7, "v": 17, "aliyah": 3, "heb": "וַֽיְהִ֧י הַמַּבּ֛וּל אַרְבָּעִ֥ים י֖וֹם עַל־הָאָ֑רֶץ וַיִּרְבּ֣וּ הַמַּ֗יִם וַיִּשְׂאוּ֙ אֶת־הַתֵּבָ֔ה וַתָּ֖רׇם מֵעַ֥ל הָאָֽרֶץ׃", "onk": "וַהֲוָה טוֹפָנָא אַרְבְּעִין יוֹמִין עַל אַרְעָא וּסְגִיאוּ מַיָּא וּנְטָלוּ יָת תֵּבוֹתָא וְאִתָּרָמַת מֵעַל אַרְעָא:", "onk_en": "There was a Flood on the earth for forty days. The waters increased and lifted the ark, and it rose [high] above the earth.", "pj": "וַהֲוָה טוּבְעָנָא אַרְבְּעִין יְמָמִין עַל אַרְעָא וּסְגִיאוּ מַיָא וּנְטָלוּ יַת תֵּיבוּתָא וְאִיתְרָמַת מֵעַל אַרְעָא", "pj_en": "And there was a flood forty days upon the earth, and the waters were multiplied and bare up the ark, and it was lifted from the earth.", "tj": "", "tj_en": "", "rashi": "<b>ותרם מעל הארץ.<\/b> מְשֻׁקַּעַת הָיְתָה בַּמַּיִם י\"א אַמָּה כִסְפִינָה טְעוּנָה הַמְשֻׁקַּעַת מִקְצָתָהּ בַּמַּיִם; וּמִקְרָאוֹת שֶׁלְּפָנֵינוּ יוֹכִיחוּ:", "rashi_en": "ותרם מעל הארץ AND IT WAS LIFTED UP ABOVE THE EARTH — It was eleven cubits deep in the water like a laden ship that has part of it sunk in the waters (Genesis Rabbah 32:9); the following verses prove that this is the meaning. "}, {"ch": 7, "v": 18, "aliyah": 3, "heb": "וַיִּגְבְּר֥וּ הַמַּ֛יִם וַיִּרְבּ֥וּ מְאֹ֖ד עַל־הָאָ֑רֶץ וַתֵּ֥לֶךְ הַתֵּבָ֖ה עַל־פְּנֵ֥י הַמָּֽיִם׃", "onk": "וּתְקִיפוּ מַיָּא וּסְגִיאוּ לַחֲדָא עַל אַרְעָא וּמְהַלְּכָא תֵבוֹתָא עַל אַפֵּי מַיָּא:", "onk_en": "The waters were powerful and increased greatly over the earth, and the ark moved on the surface of the waters.", "pj": "וְתַקִיפוּ מַיָא וּסְגִיאוּ לַחֲדָא עַל אַרְעָא וַהֲוַת תֵּיבוּתָא מְהַלְכָא סַחֲיָא עַל אַפֵּי מַיָא", "pj_en": "And the waters waxed mighty and increased greatly upon the earth, and the ark went floating upon the face of the waters.", "tj": "", "tj_en": "", "rashi": "<b>ויגברו.<\/b> מֵאֵלֵיהֶן:", "rashi_en": "ויגברו [AND THE WATERS] PREVAILED — by themselves (without any external aid). "}, {"ch": 7, "v": 19, "aliyah": 3, "heb": "וְהַמַּ֗יִם גָּ֥בְר֛וּ מְאֹ֥ד מְאֹ֖ד עַל־הָאָ֑רֶץ וַיְכֻסּ֗וּ כׇּל־הֶֽהָרִים֙ הַגְּבֹהִ֔ים אֲשֶׁר־תַּ֖חַת כׇּל־הַשָּׁמָֽיִם׃", "onk": "וּמַיָּא תְּקִיפוּ לַחֲדָא לַחֲדָא עַל אַרְעָא וְאִתְחֲפִיאוּ כָּל טוּרַיָּא רָמַיָּא דִּי תְחוֹת כָּל שְׁמַיָּא:", "onk_en": "The waters were very powerful over the earth, and they covered all the high mountains which were under all the heavens.", "pj": "וּמַיָא תַקִיפוּ לַחֲדָא עַל אַרְעָא וְאִתְחַפִיאוּ כָּל טוּרַיָא רָמַיָא דִתְּחוֹת כָּל שְׁמַיָא", "pj_en": "And the waters prevailed greatly upon the earth, and all the high hills which were under the heavens were covered:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 20, "aliyah": 3, "heb": "חֲמֵ֨שׁ עֶשְׂרֵ֤ה אַמָּה֙ מִלְמַ֔עְלָה גָּבְר֖וּ הַמָּ֑יִם וַיְכֻסּ֖וּ הֶהָרִֽים׃", "onk": "חֲמֵשׁ עַשְׂרֵה אַמִּין מִלְעֵלָּא תְּקִיפוּ מַיָּא וְאִתְחֲפִיאוּ טוּרַיָא:", "onk_en": "Fifteen <i>amohs<\/i> above them [the mountains] did the waters prevail and they covered the mountains.", "pj": "חֲמִיסְרֵי גַרְמִידִין מִלְעֵיל תָּקְפוּ מַיָא וְאִתְחַפִּיאוּ טוּרַיָא", "pj_en": "fifteen cubits higher did the waters prevail, and the mountains were covered.", "tj": "", "tj_en": "", "rashi": "<b>חמש עשרה אמה מלמעלה.<\/b> לְמַעְלָה שֶׁל גֹּבַהּ כָּל הֶהָרִים, לְאַחַר שֶׁהֻשְׁווּ הַמַּיִם לְרָאשֵׁי הֶהָרִים:", "rashi_en": "חמש עשרה אמה מלמעלה FIFTEEN CUBITS ABOVE —above the summits of all the mountains when once the waters reached the level of the mountains (Yoma 76a). "}, {"ch": 7, "v": 21, "aliyah": 3, "heb": "וַיִּגְוַ֞ע כׇּל־בָּשָׂ֣ר&thinsp;<b>׀<\/b> הָרֹמֵ֣שׂ עַל־הָאָ֗רֶץ בָּע֤וֹף וּבַבְּהֵמָה֙ וּבַ֣חַיָּ֔ה וּבְכׇל־הַשֶּׁ֖רֶץ הַשֹּׁרֵ֣ץ עַל־הָאָ֑רֶץ וְכֹ֖ל הָאָדָֽם׃", "onk": "וּמִית כָּל בִּשְׂרָא דְּרָחֵשׁ עַל אַרְעָא בְּעוֹפָא וּבִבְעִירָא וּבְחַיְתָא וּבְכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא וְכֹל אֱנָשָׁא:", "onk_en": "All flesh that moved on the earth perished; birds, animals, beasts, and all creeping creatures that creep on the earth and every man.", "pj": "וְאִתְחַמְסִי כָּל בִּשְרָא דִרְחֵישׁ עַל אַרְעָא בְּעוֹפָא וּבִבְעִירָא וּבְחַיְתָא וּבְכָל רִיחֲשָׁא דְרָחֵישׁ עַל אַרְעָא וְכָל בְּנֵי נְשָׁא", "pj_en": "And all flesh expired which moveth upon the earth; of fowl, and of cattle, and of wild beasts, and every moving thing that moveth upon the earth, and all the sons of men,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 22, "aliyah": 3, "heb": "כֹּ֡ל אֲשֶׁר֩ נִשְׁמַת־ר֨וּחַ חַיִּ֜ים בְּאַפָּ֗יו מִכֹּ֛ל אֲשֶׁ֥ר בֶּחָֽרָבָ֖ה מֵֽתוּ׃", "onk": "כֹּל דִּי נִשְׁמְתָא רוּחָא דְּחַיִּין בְּאַנְפוֹהִי מִכֹּל דִּי בְּיַבֶּשְׁתָּא מִיתוּ:", "onk_en": "All that has a breath of the spirit of life—everything on dry land—died.", "pj": "כָּל דְנִשְׁמַת רוּחַ חַיִין בְּאַנְפּוֹי מִכָּל דְיַבֶּשְׁתָּא מִיתוּ", "pj_en": "--every thing in whose nostrils was the breath of life, of all on the dry land, died.", "tj": "", "tj_en": "", "rashi": "<b>נשמת רוח חיים.<\/b> נְשָׁמָה שֶׁל רוּחַ חַיִּים:<br><br><b>אשר בחרבה.<\/b> וְלֹא דָגִים שֶׁבַּיָּם (סנה' ק\"ח):", "rashi_en": "נשמת רוח חיים means the breathing of the breath of life.<br><br>אשר בחרבה WHATSOEVER WAS IN THE DRY LAND [DIED] — and not the fish in the sea (Sanhedrin 108a)."}, {"ch": 7, "v": 23, "aliyah": 3, "heb": "וַיִּ֜מַח אֶֽת־כׇּל־הַיְק֣וּם&thinsp;<b>׀<\/b> אֲשֶׁ֣ר&thinsp;<b>׀<\/b> עַל־פְּנֵ֣י הָֽאֲדָמָ֗ה מֵאָדָ֤ם עַד־בְּהֵמָה֙ עַד־רֶ֙מֶשׂ֙ וְעַד־ע֣וֹף הַשָּׁמַ֔יִם וַיִּמָּח֖וּ מִן־הָאָ֑רֶץ וַיִּשָּׁ֧אֶר אַךְ־נֹ֛חַ וַֽאֲשֶׁ֥ר אִתּ֖וֹ בַּתֵּבָֽה׃", "onk": "וּמְחָא יָת כָּל יְקוּמָא דִּי עַל אַפֵּי אַרְעָא מֵאֱנָשָׁא עַד בְּעִירָא עַד רִחֲשָׁא וְעַד עוֹפָא דִשְׁמַיָּא וְאִתְמְחִיאוּ מִן אַרְעָא וְאִשְׁתָּאַר בְּרַם נֹחַ וְדִי עִמֵּיהּ בְּתֵבוֹתָא:", "onk_en": "[He] obliterated every being that was on the surface of the ground; from man to animals, to creeping creatures, and to the birds of the heaven. They were obliterated from the earth. Only Noach and those with him in the ark survived.", "pj": "וְשֵׁיצֵי יַת כָּל גְוִויַית אֵינַשׁ וּבְעִיר דְעַל אַנְפֵּי אַרְעָא מֵאֵינָשָׁא עַד בְּעִירָא עַד רִיחֲשָׁא וְעַד עוֹפָא דְפָרַח בְּאַוֵיר שְׁמַיָא וְאִשְׁתֵּיצֵי מִן אַרְעָא וְאִשְׁתְּאַר בְּרַם נחַ וּדְעִמֵיהּ בְּתֵיבוּתָא", "pj_en": "And all the bodies of men and of beasts upon the face of the earth, from man to cattle, to creeping thing, and to the fowl which wingeth in the air of heaven, perished from the earth; and Noah only was left, and they who were with him in the ark.", "tj": "", "tj_en": "", "rashi": "<b>וימח.<\/b> לְשׁוֹן וַיִּפְעַל הוּא וְאֵינוֹ לָשׁוֹן וַיִפָּעֵל, וְהוּא מִגִּזְרַת וַיִּפֶן וַיִּבֶן כָּל תֵּבָה שֶׁסּוֹפָהּ הֵ\"א, כְּגוֹן בָּנָה, מָחָה, קָנָה, כְּשֶׁהוּא נוֹתֵן וָי\"ו יוֹ\"ד בְּרֹאשָׁהּ, נָקוּד בְּחִירִק תַּחַת הַיּוֹ\"ד:<br><br><b>אך נח.<\/b> לְבַד נֹחַ, זֶהוּ פְּשׁוּטוֹ; וּמִ\"אַ גוֹנֵחַ וְכוֹהֶה דָם מִטֹּרַח הַבְּהֵמוֹת וְהַחַיּוֹת. וְיֵ\"אֹ שֶׁאִחֵר מְזוֹנוֹת לָאֲרִי וְהִכִּישׁוֹ, וְעָלָיו נֶאֱמַר הֵן צַדִּיק בָּאָרֶץ יְשֻׁלָּם (משלי יא):", "rashi_en": "וימח AND HE BLOTTED OUT — The word וימח is a Kal form and not a Niphal, and it is of the same grammatical form as ויפן and ויבן Every verb whose last root letter is ה, such as בנה, מחה, קנה when י and ו are perfixed, has Chireq as its vowel beneath the yod.<br><br>אך נח means NOAH ONLY. This is its real meaning. But the Midrashic explanation is (Midrash Tanchuma, Noach 9) that he was coughing and spitting blood because of the trouble he had with the cattle and beasts (אך is taken as a מיעוט limitation, meaning to say that something is defective); others say, that he was once late in bringing food to a lion, so it struck him. Regarding him may the words be applied (Proverbs 11:31), “Behold, even the righteous is paid (for his evil deeds) in this world’’."}, {"ch": 7, "v": 24, "aliyah": 3, "heb": "וַיִּגְבְּר֥וּ הַמַּ֖יִם עַל־הָאָ֑רֶץ חֲמִשִּׁ֥ים וּמְאַ֖ת יֽוֹם׃", "onk": "וּתְקִיפוּ מַיָּא עַל אַרְעָא מְאָה וְחַמְשִׁין יוֹמִין:", "onk_en": "The waters were powerful over the earth for one hundred and fifty days.", "pj": "וּתְקִיפוּ מַיָא עַל אַרְעָא מְאָה וְחַמְשִׁין יוֹמִין", "pj_en": "And the waters prevailed upon the earth a hundred and fifty days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 1, "aliyah": 3, "heb": "וַיִּזְכֹּ֤ר אֱלֹהִים֙ אֶת־נֹ֔חַ וְאֵ֤ת כׇּל־הַֽחַיָּה֙ וְאֶת־כׇּל־הַבְּהֵמָ֔ה אֲשֶׁ֥ר אִתּ֖וֹ בַּתֵּבָ֑ה וַיַּעֲבֵ֨ר אֱלֹהִ֥ים ר֙וּחַ֙ עַל־הָאָ֔רֶץ וַיָּשֹׁ֖כּוּ הַמָּֽיִם׃", "onk": "וּדְכִיר יְיָ יָת נֹחַ וְיָת כָּל חַיְתָא וְיָת כָּל בְּעִירָא דִּי עִמֵּיהּ בְּתֵבוֹתָא וְאַעְבַּר יְיָ רוּחָא עַל אַרְעָא וְנָחוּ מַיָּא:", "onk_en": "Elohim remembered Noach, and all the beasts and all the animals that were with him in the ark. Elohim caused a wind to blow over the earth and the water subsided.", "pj": "וּדְכִיר יְיָ בְּמֵימְרֵיהּ יַת נחַ וְיַת כָּל חַיְתָא וְיַת כָּל בְּעִירָא דְעִמֵיהּ בְּתֵיבוּתָא וְאַעֲבֵר יְיָ רוּחַ רַחֲמִין עַל אַרְעָא וְאִשְׁתַּדְכוּ מַיָא", "pj_en": "And the Lord in His Word remembered Noah, and all the animals and the cattle which were with him in the ark; and the Lord caused the wind of mercies to pass over the earth, and the waters were dried.", "tj": "וְאִדְכַּר בְּרַחֲמוֹי טָבָא דְאִית עִמֵיהּ יַת נחַ וְאַעֲבֵר יְיָ רוּחָא דְרַחֲמִין:", "tj_en": "And He remembered in His mercies the good that was with Noah. And the Lord caused the wind of mercies.", "rashi": "<b>ויזכור אלהים.<\/b> זֶה הַשֵּׁם מִדַּת הַדִּין הוּא, וְנֶהֶפְכָה לְמִדַּת רַחֲמִים עַל יְדֵי תְפִלַּת הַצַּדִּיקִים; וְרִשְׁעָתָן שֶׁל רְשָׁעִים הוֹפֶכֶת מִדַּת רַחֲמִים לְמִדַּת הַדִּין, שֶׁנֶאֱמַר וַיַּרְא ה' כִּי רַבָּה רָעַת הָאָדָם, וַיֹּאמֶר ה' אֶמְחֶה, (ברא' ו') וְהוּא שֵׁם מִדַּת רַחֲמִים:<br><br><b>ויזכור אלהים את נח וגו'.<\/b> מַה זָּכַר לָהֶם לַבְּהֵמוֹת? זְכוּת, שֶׁלֹּא הִשְׁחִיתוּ דַרְכָּם קֹדֶם לָכֵן וְשֶׁלֹּא שִׁמְּשׁוּ בַּתֵּבָה:<br><br><b>ויעבר אלהים רוח.<\/b> רוּחַ תַּנְחוּמִין וַהֲנָחָה עָבְרָה לְפָנָיו:<br><br><b>על הארץ.<\/b> עַל עִסְקֵי הָאָרֶץ:<br><br><b>וישכו.<\/b> כְּמוֹ כְּשֹׁךְ חֲמַת הַמֶּלֶךְ (אסתר ב') לְשׁוֹן הַנָּחַת חֵמָה:", "rashi_en": "ויזכור אלהים AND GOD REMEMBERED— This Divine Name really signifies the God of Strict Justice but it is transformed into Divine Mercy through the prayers of the righteous, whilst the evil practised by wicked people transforms Divine Mercy into Strict Justice, as it is said (Genesis 6:5) “And the Lord ('ה) saw that the wickedness of man was great” and (Genesis 5:7) “And the Lord ('ה) said, “I will blot out etc.”— yet in these passages the Name ('ה) is מדת רחמים, that signifying Divine Mercy (Genesis Rabbah 33:3).<br><br>‘ויזכור אלהים את נח וגו AND GOD REMEMBERED NOAH etc. — What did He remember regarding the cattle? The merit that no perversion of their way had been seen amongst them previously to the Flood, and that they lived apart in the Ark.<br><br>ויעבר אלהים רוח AND GOD MADE A WIND (or SPIRIT) TO PASS — A spirit of consolation and relief passed before Him.<br><br>על הארץ OVER THE EARTH — Because of what was happening on earth.<br><br>וישכו AND THE WATERS ASSUAGED — The word occurs again (Esther 2:1), “when the wrath of the king was assuaged (כשוך)”, and it means there abatement of anger. "}, {"ch": 8, "v": 2, "aliyah": 3, "heb": "וַיִּסָּֽכְרוּ֙ מַעְיְנֹ֣ת תְּה֔וֹם וַֽאֲרֻבֹּ֖ת הַשָּׁמָ֑יִם וַיִּכָּלֵ֥א הַגֶּ֖שֶׁם מִן־הַשָּׁמָֽיִם׃", "onk": "וְאִסְתְּכָרוּ מַבּוּעֵי תְהוֹמָא וְכַוֵּי שְׁמַיָּא וְאִתְכְּלִי מִטְרָא מִן שְׁמַיָּא:", "onk_en": "The wellsprings of the deep were closed, and [so were] the windows of the heavens, and the downpour from the heavens was withheld.", "pj": "וְאִסְתַּגְרוּ מַבּוּעֵי תְּהוֹמָא וַחֲרַכֵּי שְׁמַיָא וְאִתְמְנַע מִטְרָא מִלְמֵיחַת מִן שְׁמַיָא", "pj_en": "And the fountains of the deep were shut up, and the windows of heaven, and the rain was forbidden to descend from heaven.", "tj": "", "tj_en": "", "rashi": "<b>ויסכרו מעינות.<\/b> כְּשֶׁנִּפְתְּחוּ כְּתִיב כָּל מַעְיְנֹת; וְכָאן אֵין כְּתִיב כָּל, לְפִי שֶׁנִּשְׁתַּיְּרוּ מֵהֶם אוֹתָן שֶׁיֵּשׁ בָּהֶם צֹרֶךְ לָעוֹלָם, כְּגוֹן חַמֵּי טְבֵרְיָא וְכַיוֹצֵא בָהֶן:<br><br><b>ויכלא.<\/b> וַיִמָּנַע כְּמוֹ לֹא תִכְלָא רַחֲמֶיךָ (תהלים מ'), לֹא יִכְלֶה מִמְּךָ (ברא' כג):", "rashi_en": "ויסכרו מעינות AND THE FOUNTAINS … WERE STOPPED –– When they were opened, it was stated that all fountains were opened (7:11), whilst here the word all is omitted: the reason is that such of them as were essential to the world were left unstopped, such as the hot springs of Tiberias and their like (Sanhedrin 108a).<br><br>ויכלא means was restrained. withheld, as (Psalms 40:12) “Thou wilt not withhold (תכלא) thy mercies” and (Genesis 23:6) “None of us will withhold (יכלה) from thee.’’ "}, {"ch": 8, "v": 3, "aliyah": 3, "heb": "וַיָּשֻׁ֧בוּ הַמַּ֛יִם מֵעַ֥ל הָאָ֖רֶץ הָל֣וֹךְ וָשׁ֑וֹב וַיַּחְסְר֣וּ הַמַּ֔יִם מִקְצֵ֕ה חֲמִשִּׁ֥ים וּמְאַ֖ת יֽוֹם׃", "onk": "וְתָבוּ מַיָּא מֵעַל אַרְעָא אָזְלִין וְתָיְבִין וַחֲסָרוּ מַיָּא מִסּוֹף מְאָה וְחַמְשִׁין יוֹמִין:", "onk_en": "The water receded from the earth continually, and the waters diminished at the end of one hundred and fifty days.", "pj": "וּתְאִיבוּ מַיָא מֵעֲלוֹי אַרְעָא אָזְלִין וְתַיְיבִין וְחָסְרוּ מַיָא מִסוֹף מְאָה וְחַמְשִׁין יוֹמִין", "pj_en": "And the waters returned from being on the earth, going and returning. And the waters were minished at the end of a hundred and fifty days.", "tj": "", "tj_en": "", "rashi": "<b>מקצה חמשים ומאת יום.<\/b> הִתְחִילוּ לַחֲסֹר וְהוּא אֶחָד בְּסִיוָן. כֵּיצַד? בְּכ\"ז בְּכִסְלֵו פָּסְקוּ הַגְּשָׁמִים, הֲרֵי ג' מִכִּסְלֵו וְכ\"ט מִטֵּבֵת הֲרֵי ל\"ב, וּשְׁבָט וַאֲדָר וְנִיסָן וְאִיָּר קי\"ח, הֲרֵי ק\"נ:", "rashi_en": "מקצה חמשים ומאת יום AFTER THE END OF ONE HUNDRED AND FIFTY DAYS they began to decrease: that was on the first day of Sivan. How so? The rains ceased to fall on the twenty-seventh day of Kislev — you have three days left in Kislev, and the 29 days of Tebeth make 32, and Shebat, Adar, Nisan and Eyar have together 118, making altogether 150. "}, {"ch": 8, "v": 4, "aliyah": 3, "heb": "וַתָּ֤נַח הַתֵּבָה֙ בַּחֹ֣דֶשׁ הַשְּׁבִיעִ֔י בְּשִׁבְעָה־עָשָׂ֥ר י֖וֹם לַחֹ֑דֶשׁ עַ֖ל הָרֵ֥י אֲרָרָֽט׃", "onk": "וְנָחַת תֵּבוֹתָא בְּיַרְחָא שְׁבִיעָאָה בְּשִׁבְעַת עֲשַׂר יוֹמָא לְיַרְחָא עַל טוּרֵי <b>קַרְדּוּ<\/b>:", "onk_en": "The ark rested in the seventh month, on the seventeenth day of the month, upon the mountains of Ararat [<b>Kardu<\/b>].", "pj": "וּנְחַת תֵּיבוּתָא בְּיַרְחָא שְׁבִיעָאָה הוּא יַרְחָא דְנִיסָן בְּשֶׁבְסְרֵי יוֹמִין לְיַרְחָא עַל טַוְורֵי דְקַדְרוֹן שׁוּם טַוְורָא חַד קַרְדַנְיָא וְשׁוּם טַוְורָא חַד אַרְמִינְיָא וְתַּמָן מִתְבַּנְיָא קַרְתָּא דְאַרְמַנְיָא בְּאַרְעָא מַדִינְחָא", "pj_en": "And the ark rested in the seventh month, which is the month of Nisan, in the seventeenth day of the month, upon the mountains of Qadron; the name of the one mountain is Qardania, and the name of the other mountain Irmenia; and there was builded the city of Armenia in the land of the east.", "tj": "", "tj_en": "", "rashi": "<b>בחדש השביעי.<\/b> סִיוָן, וְהוּא שְׁבִיעִי לְכִסְלֵו שֶׁבּוֹ פָּסְקוּ הַגְּשָׁמִים:<br><br><b>בשבעה עשר יום.<\/b> מִכָּאן אַתָּה לָמֵד שֶׁהָיְתָה הַתֵּבָה מְשֻׁקַּעַת בַּמַּיִם י\"א אַמָּה, שֶׁהֲרֵי כְתִיב בָּעֲשִׂירִי בְּאֶחָד לַחֹדֶשׁ נִרְאוּ רָאשֵׁי הֶהָרִים, זֶה אָב, שֶׁהִיא עֲשִׂירִי לְמַרְחֶשְׁוָן לִירִידַת גְּשָׁמִים, וְהֵם הָיוּ גְבוֹהִים עַל הֶהָרִים חֲמֵשׁ עֶשְׂרֵה אַמָּה, וְחָסְרוּ מִיּוֹם אֶחָד בְּסִיוָן עַד אֶחָד בְּאָב חֲמֵשׁ עֶשְׂרֵה אַמָּה לְשִּׁשִּׁים יוֹם, הֲרֵי אַמָּה לְד' יָמִים, נִמְצָא, שֶׁבְּי\"ו בְּסִיוָן לֹא חָסְרוּ אֶלָּא ד' אַמּוֹת וְנָחָה הַתֵּבָה לְיוֹם הַמָּחֳרָת; לָמַדְתָּ, שֶׁהָיְתָה מְשֻׁקַּעַת י\"א אַמָּה בַמַּיִם שֶׁעַל רָאשֵׁי הֶהָרִים:", "rashi_en": "בחדש השביעי IN THE SEVENTH MONTH — viz., Sivan, which is the seventh from Kislev in which the rains stopped falling.<br><br>בשבעה עשר יום ON THE SEVENTEENTH DAY — From here you may infer that the Ark was submerged in the water to a depth of eleven cubits. For it is written (next verse) “In the tenth month on the first day of the month the tops of the mountains were seen” and this was Ab which is the tenth month after Cheshvan — after the rain began to fall. Now the waters were 15 cubits high above the mountains so that they subsided from the first of Sivan to the first of Ab 15 cubits for those 60 intervening days, which is one cubit each four days. Consequently by the sixteenth of Sivan they had subsided only 4 cubits, and since the Ark rested on Ararat on the next day, you may learn that it was submerged eleven cubits in the waters which were then still above the mountain tops (Genesis Rabbah 33:7). "}, {"ch": 8, "v": 5, "aliyah": 3, "heb": "וְהַמַּ֗יִם הָיוּ֙ הָל֣וֹךְ וְחָס֔וֹר עַ֖ד הַחֹ֣דֶשׁ הָֽעֲשִׂירִ֑י בָּֽעֲשִׂירִי֙ בְּאֶחָ֣ד לַחֹ֔דֶשׁ נִרְא֖וּ רָאשֵׁ֥י הֶֽהָרִֽים׃", "onk": "וּמַיָּא הֲווֹ אָזְלִין וְחָסְרִין עַד יַרְחָא עֲשִׂירָאָה בַּעֲשִׂירָאָה בְּחַד לְיַרְחָא אִתְחֲזִיאוּ רֵישֵׁי טוּרַיָּא:", "onk_en": "The waters continued to diminish until the tenth month. In the tenth [month], on the first of the month, the mountaintops became visible.", "pj": "וּמַיָא הֲווֹ אָזְלִין וְחַסְרִין עַד יָרַח עֲשִירִיִי יֶרַח תַּמוּז בְּתַמוּז בְּחַד לְיַרְחָא אִתְחֲמִיאוּ רֵישֵׁי טוּרַיָא", "pj_en": "And the waters went and diminished until the tenth month, the month Tammuz. In Tammuz, in the first of the month, the heads of the mountains were seen.", "tj": "", "tj_en": "", "rashi": "<b>בעשירי נראו ראשי ההרים.<\/b> זֶה אָב, שֶׁהוּא עֲשִׂירִי לְמַרְחֶשְׁוָן שֶׁהִתְחִיל הַגֶּשֶׁם. וְאִם תֹּאמַר הוּא אֱלוּל, וַעֲשִׂירִי לְכִסְלֵו שֶׁפָּסַק הַגֶּשֶׁם, כְּשֵׁם שֶׁאַתָּה אוֹמֵר בַּחֹדֶשׁ הַשְּׁבִיעִי סִיוָן, וְהוּא שְׁבִיעִי לַהַפְסָקָה – אִי אֶפְשָׁר לוֹמַר כֵּן, עַל כָּרְחֲךָ שְׁבִיעִי אִי אַתָּה מוֹנֶה אֶלָּא לַהַפְסָקָה, שֶׁהֲרֵי לֹא כָלוּ אַרְבָּעִים יוֹם שֶׁל יְרִידַת גְּשָׁמִים, וּמֵאָה וַחֲמִשִּׁים שֶׁל תִּגְבֹּרֶת הַמַּיִם עַד אֶחָד בְּסִיוָן; וְאִם אַתָּה אוֹמֵר שְׁבִיעִי לַיְרִידָה, אֵין זֶה סִיוָן, וְהָעֲשִׂירִי אִי אֶפְשָׁר לִמְנוֹת אֶלָּא לַיְרִידָה, שֶׁאִם אַתָּה אוֹמֵר לַהַפְסָקָה וְהוּא אֱלוּל, אִי אַתָּה מוֹצֵא בָּרִאשׁוֹן בְּאֶחָד לַחֹדֶשׁ חָרְבוּ הַמַּיִם מֵעַל הָאָרֶץ; שֶׁהֲרֵי מִקֵּץ אַרְבָּעִים יוֹם מִשֶׁנִּרְאוּ רָאשֵׁי הֶהָרִים שִׁלַּח אֶת הָעוֹרֵב וְכ\"א יוֹם הוֹחִיל בִּשְׁלִיחוּת הַיּוֹנָה, הֲרֵי שִׁשִּׁים יוֹם מִשֶּׁנִּרְאוּ רָאשֵׁי הֶהָרִים עַד שֶׁחָרְבוּ פְנֵי הָאֲדָמָה. וְאִם תֹּאמַר בֶּאֱלוּל נִרְאוּ, נִמְצָא שֶׁחָרְבוּ בְּמַרְחֶשְׁוָן וְהוּא קוֹרֵא אוֹתוֹ רִאשׁוֹן, וְאֵין זֶה אֶלָּא תִּשְׁרֵי, שֶׁהוּא רִאשׁוֹן לִבְרִיאַת עוֹלָם, וְלְרַבִּי יְהוֹשֻׁעַ הוּא נִיסָן:", "rashi_en": "בעשירי וגו' נראו ראשי ההרים IN THE TENTH MONTH … WERE THE TOPS OF THE MOUNTAINS SEEN —This was Ab which is the tenth from Marcheshvan when the rain began. If, however, you say that it means Elul, the tenth month from Kislev in which the rain stopped, just as you said (see Rashi on verse 4) that “in the seventh month” means Sivan which was the seventh month after the rain stopped, then I reply that it is impossible to argue so. For you must needs admit that the “seventh” month when the Ark rested can only be counted from the time when the rain stopped, since the 40 days during which the rain fell and the 150 days during which the waters prevailed did not terminate until the first day of Sivan, and if you say that it means the seventh after the rain began to fall, this would not be Sivan. The “tenth month”, however, when the tops of the mountains became visible cannot possibly be counted except from the time the rain began to fall, for if you say that it must be calculated from the time when it stopped, which would be Elul, you would not then find that “in the first month, on the first day of the month the waters dried up from off the earth” (Genesis 8:13). For it was only at the end of 40 days after the tops of the mountains were visible that he sent forth the raven (Genesis 8:6), and he waited periods amounting altogether to 21 days during which he was sending forth the dove, making altogether 60 days from when the tops of the mountains became visible until when the face of the earth became dry; if, therefore, you say that it was in Elul that they were seen, it would follow that the earth became dry in Marcheshvan (60 days after Elul). But it (Scripture) calls it (the month when the waters were dried up; Genesis 8:13) the first month, and that can only be Tishri which is the first month reckoning according to the creation of the world — or according to R. Joshua, it would be Nisan (Genesis Rabbah 30:6). "}, {"ch": 8, "v": 6, "aliyah": 3, "heb": "וַיְהִ֕י מִקֵּ֖ץ אַרְבָּעִ֣ים י֑וֹם וַיִּפְתַּ֣ח נֹ֔חַ אֶת־חַלּ֥וֹן הַתֵּבָ֖ה אֲשֶׁ֥ר עָשָֽׂה׃", "onk": "וַהֲוָה מִסּוֹף אַרְבְּעִין יוֹמִין וּפְתַח נֹחַ יָת כַּוַּת תֵּבוֹתָא דִּי עֲבָד:", "onk_en": "At the end of forty days, Noach opened the window of the ark which he had made.", "pj": "וַהֲוָה מִסוֹף אַרְבְּעִין יוֹמִין וּפְתַח נחַ יַת כַּוַות תֵּיבוּתָא דְעָבַד", "pj_en": "And it was at the end of forty days, and Noah opened the aperture of the ark which he had made.", "tj": "", "tj_en": "", "rashi": "<b>מקץ ארבעים יום.<\/b> מִשֶּׁנִּרְאוּ רָאשֵׁי הֶהָרִים:<br><br><b>את חלון התבה אשר עשה.<\/b> לְצֹהַר, וְלֹא זֶה פֶּתַח הַתֵּבָה הֶעָשׂוּי לְבִיאָה וִיצִיאָה:", "rashi_en": "מקץ ארבעים יום AT THE END OF FORTY DAYS from when the tops of the mountains were seen.<br><br>את חלון התבה אשר עשה THE WINDOW OF THE ARK WHICH HE HAD MADE — for the light; it does not mean the door of the Ark intended for entry and exit. "}, {"ch": 8, "v": 7, "aliyah": 3, "heb": "וַיְשַׁלַּ֖ח אֶת־הָֽעֹרֵ֑ב וַיֵּצֵ֤א יָצוֹא֙ וָשׁ֔וֹב עַד־יְבֹ֥שֶׁת הַמַּ֖יִם מֵעַ֥ל הָאָֽרֶץ׃", "onk": "וְשַׁלַּח יָת עָרְבָּא וּנְפַק מִפַּק וְתַיִב עַד דְּיַבִּישׁוּ מַיָּא מֵעַל אַרְעָא:", "onk_en": "He sent out the raven, and it went out, going to and fro until the water on the land dried up.", "pj": "וְשָׁדַר יַת עוֹרְבָא וּנְפַק מֵיפַק וְתָאֵיב עַד דִיבִיאִישׁוּ מַיָא מֵעִילוֹי אַרְעָא", "pj_en": "And he sent out a raven; and it went forth, going forth and returning, until the waters had dried from the earth.", "tj": "", "tj_en": "", "rashi": "<b>יצוא ושוב.<\/b> הוֹלֵךְ וּמַקִּיף סְבִיבוֹת הַתֵּבָה, וְלֹא הָלַךְ בִּשְׁלִיחוּתוֹ, שֶׁהָיָה חוֹשְׁדוֹ עַל בַּת זוּגוֹ, כְּמוֹ שֶׁשָּׁנִינוּ בְּאַגָּדַת חֵלֶק (סנה' ק\"ח):<br><br><b>עד יבשת המים.<\/b> פְּשׁוּטוֹ כְּמַשְׁמָעוֹ. אֲבָל מִדְרַשׁ אַגָּדָה מוּכָן הָיָה הָעוֹרֵב לִשְׁלִיחוּת אַחֶרֶת בַּעֲצִירַת גְּשָׁמִים בִּימֵי אֵלִיָּהוּ, שֶׁנֶּאֱמַר וְהָעֹרְבִים מְבִאִים לוֹ לֶחֶם וּבָשָׂר (מ\"א י\"ז):", "rashi_en": "יצא ושוב WENT FORTH TO AND FRO — It (the raven) flew in circles round and round the Ark and did not go on its errand for it suspected that he (Noah) intended to injure its mate, just as we learn in the Agada of Chelek (Sanhedrin 108b).<br><br>עד יבשת המים UNTIL THE WATERS WERE DRIED UP—The real sense of the verse is what it plainly implies (until the waters of the Flood were dried up); but the Midrashic explanation (Genesis Rabbah 33:5) is: The raven went to and fro in the world being kept in readiness for another errand during the time when the rain was withheld and the waters dried up in the days of Elijah, as it is said, (1 Kings 17:6) “And the ravens brought him bread and flesh”. "}, {"ch": 8, "v": 8, "aliyah": 3, "heb": "וַיְשַׁלַּ֥ח אֶת־הַיּוֹנָ֖ה מֵאִתּ֑וֹ לִרְאוֹת֙ הֲקַ֣לּוּ הַמַּ֔יִם מֵעַ֖ל פְּנֵ֥י הָֽאֲדָמָֽה׃", "onk": "וְשַׁלַּח יָת יוֹנָה מִלְּוָתֵיהּ לְמֶחֱזֵי הֲקַלִּיאוּ מַיָּא מֵעַל אַפֵּי אַרְעָא:", "onk_en": "He [then] sent the dove to see if the water had subsided from the surface of the ground.", "pj": "וְשַׁדַר יַת יוֹנְתָא דְבַּיְיתָא מִלְוָותֵיהּ לְמֶחֱמֵי אִין אִתְקוֹלָלוּ מַיָא מֵעִילוֹי אַנְפָּא אַרְעָא", "pj_en": "And he sent forth a house-dove from being with him, to see whether the waters were lightened from off the faces of the earth.", "tj": "", "tj_en": "", "rashi": "<b>וישלח את היונה.<\/b> לְסוֹף ז' יָמִים שֶׁהֲרֵי כְתִיב וַיָּחֶל עוֹד ז' יָמִים אֲחֵרִים, מִכְּלַל זֶה אַתָּה לָמֵד שֶׁאַף בָּרִאשׁוֹנָה הוֹחִיל ז' יָמִים:<br><br><b>וישלח.<\/b> אֵין זֶה לְשׁוֹן שְׁלִיחוּת אֶלָּא לְשׁוֹן שִׁלּוּח, שִׁלְּחָהּ לָלֶכֶת לְדַרְכָּה, וּבְזוֹ יִרְאֶה אִם קַלּוּ הַמַּיִם, שֶׁאִם תִּמְצָא מָנוֹחַ לֹא תָשׁוּב אֵלָיו:", "rashi_en": "וישלח את היונה AND HE SENT FORTH A DOVE at the end of seven days, for it is written, (Genesis 8:10) “And he stayed yet other seven days” — from this statement you may infer that after the first occasion, also, he waited seven days.<br><br>וישלח And HE SENT FORTH — This does not mean merely “sending on an errand”, but “sending away”, “letting go” — he freed her to go where she liked, and thus he could see whether the waters abated, because if she could find a resting place she would not return to him."}, {"ch": 8, "v": 9, "aliyah": 3, "heb": "וְלֹֽא־מָצְאָה֩ הַיּוֹנָ֨ה מָנ֜וֹחַ לְכַף־רַגְלָ֗הּ וַתָּ֤שׇׁב אֵלָיו֙ אֶל־הַתֵּבָ֔ה כִּי־מַ֖יִם עַל־פְּנֵ֣י כׇל־הָאָ֑רֶץ וַיִּשְׁלַ֤ח יָדוֹ֙ וַיִּקָּחֶ֔הָ וַיָּבֵ֥א אֹתָ֛הּ אֵלָ֖יו אֶל־הַתֵּבָֽה׃", "onk": "וְלָא אַשְׁכַּחַת יוֹנָה מְנַח לְפַרְסַת רַגְלַהּ וְתָבַת לְוָתֵיהּ לְתֵבוֹתָא אֲרֵי מַיָּא עַל אַפֵּי כָל אַרְעָא וְאוֹשִׁיט יְדֵיהּ וְנָסְבַהּ וְאָעֵיל יָתַהּ לְוָתֵיהּ לְתֵבוֹתָא:", "onk_en": "The dove found no [place to] rest her foot. She returned to him into the ark, for the water was upon the surface of the whole earth. He put out his hand and took her and brought her to him, into the ark.", "pj": "וְלָא אַשְׁכַּחַת יוֹנְתָא נַיְיחָא לְפַרְסַת רִיגְלָהּ וְתָבַת לְוָתֵיהּ לְתֵיבוּתָא וְאוֹדָעַת אֲרוּם מוֹי עַל אַנְפֵּי כָּל אַרְעָא וְאוֹשִׁיט יְדֵיהּ וּנְסֵיבְתָּהּ וְאָעֵיל יָתָהּ לְוָתֵיהּ לְתֵיבוּתָא", "pj_en": "And the dove found no rest for the sole of the foot, and returned unto him to the ark; and he knew that the waters were (yet) upon the face of all the earth. And he reached out his hand, and took and brought her unto him into the ark.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 10, "aliyah": 3, "heb": "וַיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַיֹּ֛סֶף שַׁלַּ֥ח אֶת־הַיּוֹנָ֖ה מִן־הַתֵּבָֽה׃", "onk": "וְאוֹרִיךְ עוֹד שַׁבְעָא יוֹמִין אָחֳרָנִין וְאוֹסֵיף שַׁלַּח יָת יוֹנָה מִן תֵּבוֹתָא:", "onk_en": "He waited another seven days, and once again sent the dove out of the ark.", "pj": "וְאוֹרִיךְ תּוּב שׁוּבְעָא יוֹמִין וְאוֹסִיף לְשַׁדְרָא יַת יוֹנָתָא מִן תֵּיבָתָא", "pj_en": "And he prolonged (waited) yet seven days, and again he sent the dove from the ark.", "tj": "וּשְׁרֵי לְמִימְנֵיּ:", "tj_en": "And he began to number, and again he sent the dove from the ark.", "rashi": "<b>ויחל.<\/b> לְשׁוֹן הַמְתָּנָה, וְכֵן לִי שָׁמְעוּ וְיִחֵלּוּ (איוב כ\"ט), וְהַרְבֵּה יֵשׁ בַּמִּקְרָא:", "rashi_en": "ויחל AND HE STAYED — The word means waiting, as (Job 29:21) “Unto me they gave ear and waited (ויחלו)”, and it occurs frequently in the Scriptures. "}, {"ch": 8, "v": 11, "aliyah": 3, "heb": "וַתָּבֹ֨א אֵלָ֤יו הַיּוֹנָה֙ לְעֵ֣ת עֶ֔רֶב וְהִנֵּ֥ה עֲלֵה־זַ֖יִת טָרָ֣ף בְּפִ֑יהָ וַיֵּ֣דַע נֹ֔חַ כִּי־קַ֥לּוּ הַמַּ֖יִם מֵעַ֥ל הָאָֽרֶץ׃", "onk": "וַאֲתַת לְוָתֵיהּ יוֹנָה לְעִדַּן רַמְשָׁא וְהָא טְרַף זֵיתָא תְּבִיר <b>נָחִית<\/b> בְּפוּמַהּ וִידַע נֹחַ אֲרֵי קַלִּיאוּ מַיָא מֵעַל אַרְעָא:", "onk_en": "The dove came to him toward evening, and behold, [<b>lying<\/b>] in her mouth was a torn off olive leaf. Noach knew then that the water had subsided from the earth.", "pj": "וְאָתַת לְוָתֵיהּ יוֹנָתָא לְעִדוּנָא רַמְשָׁא וְהָא טַרְפָא דְזֵיתָא לָקִיט תִּבִיר וּמְחִית בְּפוּמָהּ דִנְסַבְתֵּיהּ מִן טַוָור מִישְׁחָא וִידַע נחַ אֲרוּם אִיתְקוֹלָלוּ מַיָא מֵעִילוֹי אַרְעָא", "pj_en": "And the dove came to him at the evening time, and, behold, a leaf of olive gathered, broken off, she brought in her mouth, and which she had taken from the Mount of the Meshiha. And Noah understood that the waters had lightened from being on the earth.", "tj": "", "tj_en": "", "rashi": "<b>טרף בפיה.<\/b> אוֹמֵר אֲנִי שֶׁזָּכָר הָיָה, לְכֵן קוֹרְאוֹ פְעָמִים לְשׁוֹן זָכָר וּפְעָמִים לְשׁוֹן נְקֵבָה, לְפִי שֶׁכָּל יוֹנָה שֶׁבַּמִּקְרָא לְשׁוֹן נְקֵבָה, כְּמוֹ כְּיוֹנִים עַל אֲפִיקֵי מָיִם רֹחֲצוֹת (שיר ה'), כְּיוֹנֵי הַגֵּאָיוֹת כֻּלָּם הֹמוֹת (יחז' ז') וּכְמוֹ כְּיוֹנָה פוֹתָה (הושע ז'):<br><br><b>טרף.<\/b> חָטַף. וּמִדְרַשׁ אַגָּדָה (עיר' י\"ח) לְשׁוֹן מָזוֹן; וְדָרְשׁוּ בְּפִיהָ לְשׁוֹן מַאֲמָר, אָמְרָה יִהְיוּ מְזוֹנוֹתַי מְרוֹרִין כְּזַיִת בְּיָדוֹ שֶׁל הַקָּבָּ\"ה וְלֹא מְתוּקִין כִּדְבַשׁ בִּידֵי בָשָׂר וָדָם:", "rashi_en": "טרף בפיה PLUCKED IN HER MOUTH — I am of opinion that it (the dove) was a male and that therefore it (the text) speaks of it sometimes as masculine and sometimes as feminine, because really wherever יונה “dove” occurs in the Scriptures it is spoken of as feminine, as (Song 5:12) “[His eyes] are like those of doves beside the water brooks. that are washing themselves (רוחצות fem.) in milk”; (Ezekiel 7:16) “Like the doves of the valleys, all of them moaning\" and as (Hosea 7:11) “Like a silly (פותה fem.) dove”<br><br>טרף means IT HAD PLUCKED OFF — The Midrashic explanation takes it as meaning “food”, and interprets בפיה as “speaking” — viz., she said. “Rather that my food be bitter as an olive but from the hand of God, than as sweet as honey and from the hand of mortal men” (Eruvin 18b; Genesis Rabbah 33). "}, {"ch": 8, "v": 12, "aliyah": 3, "heb": "וַיִּיָּ֣חֶל ע֔וֹד שִׁבְעַ֥ת יָמִ֖ים אֲחֵרִ֑ים וַיְשַׁלַּח֙ אֶת־הַיּוֹנָ֔ה וְלֹֽא־יָסְפָ֥ה שׁוּב־אֵלָ֖יו עֽוֹד׃", "onk": "וְאוֹרִיךְ עוֹד שַׁבְעָה יוֹמִין אָחֳרָנִין וְשַׁלַּח יָת יוֹנָה וְלָא אוֹסֵיפַת לְמִתּוּב לְוָתֵיהּ עוֹד:", "onk_en": "He waited yet another seven days and sent out the dove; it did not return to him again.", "pj": "וְאוֹרִיךְ תּוּב שׁוּבְעָא יוֹמִין וְאוֹסִיף לְשַׁדְרָא יַת יוֹנָתָא וְלָא אוֹסִיפַת לְמֵיתַב לְוָתֵיהּ תּוּב", "pj_en": "And he prolonged yet seven days, and added to send forth the dove; but she added not to return to him again.", "tj": "", "tj_en": "", "rashi": "<b>וייחל.<\/b> הוּא לְשׁוֹן וַיָּחֶל, אֶלָּא שֶׁזֶּה לְשׁוֹן וַיִּפְעַל וְזֶה לְשׁוֹן וַיִּתְפַּעֵל, וַיָּחֶל – וַיַּמְתֵּן; וַיִּיָּחֶל – וַיִּתְמַתֵּן:", "rashi_en": "וייחל AND HE STAYED — This has the same meaning as ויחל (Genesis 8:10), only that the latter is the Kal, whereas the word here is the Hithpael: ויחל means “he waited” וייחל “he had patience”. "}, {"ch": 8, "v": 13, "aliyah": 3, "heb": "וַ֠יְהִ֠י בְּאַחַ֨ת וְשֵׁשׁ־מֵא֜וֹת שָׁנָ֗ה בָּֽרִאשׁוֹן֙ בְּאֶחָ֣ד לַחֹ֔דֶשׁ חָֽרְב֥וּ הַמַּ֖יִם מֵעַ֣ל הָאָ֑רֶץ וַיָּ֤סַר נֹ֙חַ֙ אֶת־מִכְסֵ֣ה הַתֵּבָ֔ה וַיַּ֕רְא וְהִנֵּ֥ה חָֽרְב֖וּ פְּנֵ֥י הָֽאֲדָמָֽה׃", "onk": "וַהֲוָה בְּשִׁתְּ מְאָה וְחַד שְׁנִין בְּקַדְמָאָה בְּחַד לְיַרְחָא נְגוּבוּ מַיָּא מֵעַל אַרְעָא וְאַעְדִּי נֹחַ יָת חוֹפָאָה דְּתֵבוֹתָא וַחֲזָא וְהָא נְגוּבוּ אַפֵּי אַרְעָא:", "onk_en": "It was in the six hundredth and first year, in the first [month], on the first of the month, that the water on earth [began] to dry. Noach removed the covering of the ark. He looked and behold the surface of the ground had dried.", "pj": "וַהֲוָה בְּשִׁית מְאָה וַחֲדָא שְׁנִין בְּתִּשְׁרִי בְּחַד לְיַרְחָא בְּרֵישׁ שַׁתָּא נְגוּבוּ מַיָא מֵעַל אַרְעָא וְאַעֲדֵי נחַ יַת חוֹפָאָה דְתֵיבוּתָא וַחֲמָא וְהָא נִגוּבוּ אַפֵּי אַרְעָא", "pj_en": "And it was in the six hundred and first year, in Tishri, in the first of the month, in the beginning of the year, that the waters were dried from upon the earth. And Noah removed the covering of the ark, and saw the faces of the ground to be dried.", "tj": "", "tj_en": "", "rashi": "<b>בראשון.<\/b> לְרַבִּי אֱלִיעֶזֶר הוּא תִּשְׁרֵי וּלְרַבִּי יְהוֹשֻׁעַ הוּא נִיסָן (ר\"ה י\"א):<br><br><b>חרבו.<\/b> נַעֲשָׂה כְמִין טִיט, שֶׁקָּרְמוּ פָנֶיהָ שֶׁל מַעְלָה:", "rashi_en": "בראשׂון IN THE FIRST MONTH — According to R. Eliezer this would be Tishri, and according to R. Joshua Nisan (Rosh Hashanah 11b).<br><br>חרבו [THE WATERS] DRIED UP — It (the earth) had become like clay, for now its surface had become somewhat hardened."}, {"ch": 8, "v": 14, "aliyah": 3, "heb": "וּבַחֹ֙דֶשׁ֙ הַשֵּׁנִ֔י בְּשִׁבְעָ֧ה וְעֶשְׂרִ֛ים י֖וֹם לַחֹ֑דֶשׁ יָבְשָׁ֖ה הָאָֽרֶץ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבְיַרְחָא תִּנְיָנָא בְּעַשְׂרִין וְשַׁבְעָא יוֹמָא לְיַרְחָא יַבִּישַׁת אַרְעָא:", "onk_en": "In the second month, on the twenty seventh day of the month, the earth was [completely] dry.", "pj": "וּבְיֶרַח מַרְחֶשְׁוָן בְּעַשְרִין וְשׁוּבְעָה יוֹמִין לְיַרְחָא אִיתְיַבְּשַׁת אַרְעָא", "pj_en": "And in the month Marchesvan, in the twenty-seventh day of the month, the earth was dry.", "tj": "", "tj_en": "", "rashi": "<b>בשבעה ועשרים.<\/b> יְרִידָתָן בַּחֹדֶשׁ הַשֵּׁנִי בְי\"ז בַּחֹדֶשׁ, אֵלּוּ י\"א יָמִים שֶׁהַחַמָּה יְתֵרָה עַל הַלְּבָנָה, שֶׁמִּשְׁפַּט דוֹר הַמַּבּוּל שָׁנָה תְמִימָה הָיָה:<br><br><b>יבשה.<\/b> נַעֲשָׂה גָּרִיד כְּהִלְכָתָהּ:", "rashi_en": "בשבעה ועשרים ON THE TWENTY-SEVENTH [OF THE MONTH] —The rain had begun to fall in the second month on the seventeenth day (Genesis 7:11): the ten days are those by which the solar year exceeds the lunar year; for the punishment of the generation of the Flood lasted a full (i.e. a solar) year (Genesis Rabbah 33:17).<br><br>יבשה WAS [THE EARTH] DRIED — It became hard as is its normal condition. "}, {"ch": 8, "v": 15, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר אֱלֹהִ֖ים אֶל־נֹ֥חַ לֵאמֹֽר׃", "onk": "וּמַלֵּיל יְיָ <b>עִם<\/b> נֹחַ לְמֵימָר:", "onk_en": "Elohim spoke to [<b>with<\/b>] Noach, saying,", "pj": "וּמַלֵיל יְיָ עִם נחַ לְמֵימָר", "pj_en": "And the Lord spake with Noah, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 16, "aliyah": 4, "heb": "צֵ֖א מִן־הַתֵּבָ֑ה אַתָּ֕ה וְאִשְׁתְּךָ֛ וּבָנֶ֥יךָ וּנְשֵֽׁי־בָנֶ֖יךָ אִתָּֽךְ׃", "onk": "פּוּק מִן תֵּבוֹתָא אַתּ
