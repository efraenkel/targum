o you.", "tj": "", "tj_en": "", "rashi": "<b>עד כה.<\/b> כְּלוֹמַר דֶּרֶךְ מֻעָט לַמָּקוֹם אֲשֶׁר לְפָנֵינוּ. וּמִ\"אַ אֶרְאֶה הֵיכָן הוּא מַה שֶּׁאָמַר לִי הַמָּקוֹם כֹּה יִהְיֶה זַרְעֶךָ:<br><br><b>ונשובה.<\/b> נִתְנַבֵּא שֶׁיָּשׁוּבוּ שְׁנֵיהֶם:", "rashi_en": "עד כה YONDER — meaning a short distance: to the place in front of us. The Midrashic explanation (based upon the meaning of כה “thus”) is: I will see where will be (i.e. what will happen to) the promise which God made to me, (Genesis 15:5) “Thus (כה) shall thy seed be” (Genesis Rabbah 56:2). <br><br>ונשובה AND WE WILL COME BACK — He prophesied that they would both return (Midrash Tanchuma, Vayera 22)."}, {"ch": 22, "v": 6, "aliyah": 7, "heb": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־עֲצֵ֣י הָעֹלָ֗ה וַיָּ֙שֶׂם֙ עַל־יִצְחָ֣ק בְּנ֔וֹ וַיִּקַּ֣ח בְּיָד֔וֹ אֶת־הָאֵ֖שׁ וְאֶת־הַֽמַּאֲכֶ֑לֶת וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃", "onk": "וּנְסֵיב אַבְרָהָם יָת אָעֵי דַעֲלָתָא וְשַׁוִּי עַל יִצְחָק בְּרֵיהּ וּנְסֵיב בִּידֵיהּ יָת אֶשָּׁתָא וְיָת סַכִּינָא וַאֲזָלוּ תַרְוֵיהוֹן בַּתְרָא (כַּחֲדָא):", "onk_en": "Avraham took the wood of the burnt-offering and placed it on his son Yitzchok. In his hand he took the fire and the knife, and they both went together.", "pj": "וּנְסֵיב אַבְרָהָם יַת קִיסֵי דְעָלָתָא וְשַׁוִי עִילוֹ יִצְחָק בְּרֵיהּ וּנְסִיב בִּידֵיהּ יַת אֵישָׁתָא וְיַת סַכִּינָא וְאָזָלוּ תַּרְוֵויהוֹם כַּחֲדָא", "pj_en": "And Abraham took the wood of the offering and laid it upon Izhak his son, and in his hand he took the fire and the knife; and they went both of them together.", "tj": "", "tj_en": "", "rashi": "<b>המאכלת.<\/b> סַכִּין, עַל שֵׁם שֶׁאוֹכֶלֶת אֶת הַבָּשָׂר, כְּמָה דְתֵימָא וְחַרְבִּי תֹּאכַל בָּשָׂר (דברים ל\"ב), וְשֶׁמַּכְשֶׁרֶת בָּשָׂר לַאֲכִילָה. דָּ\"אַ זֹאת נִקְרֵאת מַאֲכֶלֶת עַל שֵׁם שֶׁיִּשְׂרָאֵל אוֹכְלִים מַתַּן שְׂכָרָהּ:<br><br><b>וילכו שניהם יחדו.<\/b> אַבְרָהָם שֶׁהָיָה יוֹדֵעַ שֶׁהוֹלֵךְ לִשְׁחֹט אֶת בְּנוֹ הָיָה הוֹלֵךְ בְּרָצוֹן וְשִׂמְחָה כְּיִצְחָק, שֶׁלֹּא הָיָה מַרְגִּישׁ בַּדָּבָר:", "rashi_en": "המאכלת — means a knife. It is called מאכלת from אכל to eat, because it devours the meat, — just as you say, (Deuteronomy 32:42 “And my sword shall devour (תאכל) flesh”— or because it makes animal flesh fit for eating (מאכלת) (by killing the animal; because while the animal is living its flesh is unfit for eating). Another explanation: זאת נקראת This knife is called מאכלת (and the term is never used of an ordinary knife) because Israel still eats of the reward given for it (Genesis Rabbah 56:3).<br><br>וילכו שניהם יחדיו AND THEY WENT BOTH OF THEM TOGETHER — Abraham who was aware that he was going to slay his son walked along with the same willingness and joy as Isaac who had no idea of the matter. "}, {"ch": 22, "v": 7, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יִצְחָ֜ק אֶל־אַבְרָהָ֤ם אָבִיו֙ וַיֹּ֣אמֶר אָבִ֔י וַיֹּ֖אמֶר הִנֶּ֣נִּֽי בְנִ֑י וַיֹּ֗אמֶר הִנֵּ֤ה הָאֵשׁ֙ וְהָ֣עֵצִ֔ים וְאַיֵּ֥ה הַשֶּׂ֖ה לְעֹלָֽה׃", "onk": "וַאֲמַר יִצְחָק לְאַבְרָהָם אֲבוּהִי וַאֲמַר אַבָּא וַאֲמַר הָא אֲנָא בְרִי וַאֲמַר הָא אֶשָּׁתָא וְאָעַיָּא וְאָן אִימְרָא לַעֲלָתָא:", "onk_en": "Yitzchok spoke to Avraham, his father, and said, Father, and he [Avraham] said, Here I am, my son. He said, Here are the fire and the wood, but where is the lamb for the burnt-offering?", "pj": "וַאֲמַר יִצְחָק לְאַבְרָהָם אָבוֹי וַאֲמַר אַבָּא וַאֲמַר הָא נָא וְאָמַר אֶשְׁתָּא וְקִיסִין וְהָאן אִמְרָא לְעָלָתָא", "pj_en": "And Izhak spake to Abraham his father and said, My Father! And he said, I am. And he said, Behold the fire and the wood: where is the lamb for the offering?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 8, "aliyah": 7, "heb": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם אֱלֹהִ֞ים יִרְאֶה־לּ֥וֹ הַשֶּׂ֛ה לְעֹלָ֖ה בְּנִ֑י וַיֵּלְכ֥וּ שְׁנֵיהֶ֖ם יַחְדָּֽו׃", "onk": "וַאֲמַר אַבְרָהָם <b>קֳדָם יְיָ גְּלֵי לֵיהּ אִימְרָא<\/b> לַעֲלָתָא בְּרִי וַאֲזָלוּ תַרְוֵיהוֹן כַּחֲדָא:", "onk_en": "Avraham said, Elohim will show the lamb [<b>the lamb is revealed before Elohim<\/b>] for a burnt-offering, my son. And the two of them went together.", "pj": "וַאֲמַר אַבְרָהָם יְיָ יִבְחַר לֵיהּ אִמְרָא לְעָלָתָא וַאֲזָלוּ תַּרְוֵיהוֹן בְּלֵב שְׁלִים כַּחֲדָא", "pj_en": "And Abraham said, The Lord will choose for Himself a lamb for the offering. And they went both of them in heart entirely as one.", "tj": "וַאֲמַר אַבְרָהָם מֵימְרֵיהּ דַיְיָ יִזְדַמֵן לִי אִימְרָא וְאִין לָא אַתְּ הוּא לְעָלָתָא בְּרִי וְהַלִיכָן תַּרְוֵויהוֹן כַּחֲדָא בְּלֵב שֶׁפִי:", "tj_en": "And Abraham said, The Word of the Lord will prepare for me a lamb; and if not, then thou art the offering, my son! And they went both of them together with a contrite heart.", "rashi": "<b>יראה לו השה.<\/b> כְּלוֹמַר יִרְאֶה וְיִבְחַר לוֹ הַשֶּׂה, וְאִם אֵין שֶׂה, <b>לעולה בני.<\/b> וְאַף עַל פִּי שֶׁהֵבִין יִצְחָק שֶׁהוּא הוֹלֵךְ לְהִשָּׁחֵט,<br><br><b>וילכו שניהם יחדו.<\/b> בְּלֵב שָׁוֶה:", "rashi_en": "יראה לו השה — this means as much as: He will look out for and choose a lamb for Himself, and if there will be no lamb for a burnt offering, then, בני MY SON will be the offering. Although Isaac then understood that he was travelling on to be slain, yet.<br><br>וילכו שניהם יחדיו THEY WENT BOTH OF THEM TOGETHER — with the same ready heart (Genesis Rabbah 56:4). "}, {"ch": 22, "v": 9, "aliyah": 7, "heb": "וַיָּבֹ֗אוּ אֶֽל־הַמָּקוֹם֮ אֲשֶׁ֣ר אָֽמַר־ל֣וֹ הָאֱלֹהִים֒ וַיִּ֨בֶן שָׁ֤ם אַבְרָהָם֙ אֶת־הַמִּזְבֵּ֔חַ וַֽיַּעֲרֹ֖ךְ אֶת־הָעֵצִ֑ים וַֽיַּעֲקֹד֙ אֶת־יִצְחָ֣ק בְּנ֔וֹ וַיָּ֤שֶׂם אֹתוֹ֙ עַל־הַמִּזְבֵּ֔חַ מִמַּ֖עַל לָעֵצִֽים׃", "onk": "וְאָתוּ לְאַתְרָא דִּי אֲמַר לֵיהּ יְיָ וּבְנָא תַמָּן אַבְרָהָם יָת מַדְבְּחָא וְסַדַּר יָת אָעַיָּא וַעֲקַד יָת יִצְחָק בְּרֵיהּ וְשַׁוִּי יָתֵיהּ עַל מַדְבְּחָא עֵיל מִן אָעַיָּא:", "onk_en": "They came to the place that Elohim had designated to him. Avraham built the altar there, and arranged the wood. He bound his son Yitzchok, and placed him on the altar, on top of the wood.", "pj": "וְאָתוּ לְאַתְרָא דְאָמַר לֵיהּ יְיָ וּבְנָא תַמָן אַבְרָהָם יַת מַדְבְּחָא דִבְנָא אָדָם וְאִיתְפְּכַר בְּמוֹי דְטוּבְעָנָא וְתַב נח וּבַנְיֵיה וְאִתְפְּכַר בְּדָרָא דְפַלְגוּתָא וְסָדַר עִילוֹי יַת קִיסַיָא וְכָפַת יַת יִצְחָק בְּרֵיה וְשַׁוֵי יָתֵיהּ עַל מַדְבְּחָא לְעֵיל מִן קִיסִין", "pj_en": "And they came to the place of which the Lord had told him. And Abraham builded there the altar which Adam had built, which had been destroyed by the waters of the deluge, which Noah has again builded, and which had been destroyed in the age of divisions; and he set the wood in order upon it, and bound Izhak his son, and laid him on the altar upon the wood.", "tj": "", "tj_en": "", "rashi": "<b>ויעקד.<\/b> יָדָיו וְרַגְלָיו מֵאֲחוֹרָיו; הַיָּדַיִם וְרַגְלַיִם בְּיַחַד הִיא עֲקִידָה (שבת נ\"ד), וְהוּא לְשׁוֹן עֲקֻדִּים, שֶׁהָיוּ קַרְסוּלֵיהֶם לְבָנִים, מָקוֹם שֶׁעוֹקְדִין אוֹתָן בּוֹ הָיָה נִכָּר:", "rashi_en": "ויעקד AND HE BOUND his hands and feet behind him. Hands and feet tied together is what is meant by עקידה “binding”. It is associated in meaning with עקודים in (Genesis 30:35) “[she-goats] that were streaked” — whose ankles were streaked white so that the place where they are bound could be plainly seen. "}, {"ch": 22, "v": 10, "aliyah": 7, "heb": "וַיִּשְׁלַ֤ח אַבְרָהָם֙ אֶת־יָד֔וֹ וַיִּקַּ֖ח אֶת־הַֽמַּאֲכֶ֑לֶת לִשְׁחֹ֖ט אֶת־בְּנֽוֹ׃", "onk": "וְאוֹשֵׁיט אַבְרָהָם יָת יְדֵיהּ וּנְסֵיב יָת סַכִּינָא לְמֵיכַס יָת בְּרֵיהּ:", "onk_en": "Avraham extended his hand and took the knife to slaughter his son.", "pj": "וְאוֹשִׁיט אַבְרָהָם יַת יְדֵיה וּנְסֵיב יַת סַכִּינָא לְמֵיכַס יַת בְּרֵיהּ עָנֵי וַאֲמַר יִצְחָק לְאָבוֹי כְּפוֹת יָתִי יָאוֹת דְלָא אֲפַרְכֵיס מִן צַעֲרָא דְנַפְשִׁי וְנִדְחֵי לְגוֹבָא דְחַבְּלָא וְיִשְׁתַּכַּח פְּסוּלָא בְּקָרְבָּנָךְ עֵינוֹי דְאַבְרָהָם מִסְתַּכְּלָן בְּעֵינוֹי דְיִצְחָק וְעֵינוֹי דְיִצְחָק מִסְתַּכְּלַן לְמַלְאֲכֵי מְרוֹמָא יִצְחָק הֲוָה חָמֵי יַתְהוֹם וְאַבְרָהָם לָא חָמֵי יַתְהוֹם עָנְיַן מַלְאֲכֵי מְרוֹמָא אִיתוּן חָמוּן כְּדֵין יְחִידָאִין דְאִית בְּעַלְמָא חַד נְכַס וְחַד מִתְנְכֵס דְנָכַס לָא מְעַכֵּיב וּדְמִתְנְכֵיס פָּשִׁיט צַוְורֵהּ", "pj_en": "And Abraham stretched out his hand, and took the knife to slay his son. And Izhak answered and said to his father, Bind me properly (aright), lest I tremble from the affliction of my soul, and be cast into the pit of destruction, and there be found profaneness in thy offering. (Now) the eyes of Abraham looked on the eyes of Izhak; but the eyes of Izhak looked towards the angels on high, (and) Izhak beheld them, but Abraham saw them not. And the angels answered on high, Come, behold how these solitary ones who are in the world kill the one the other; he who slayeth delays not; he who is to be slain reacheth forth his neck.", "tj": "וּפְשַׁט אַבְרָהָם יַת יְדֵיהּ וּנְסִיב יַת סַכִּינָא לְמֵיכוֹס יַת יִצְחָק בְּרֵיהּ עָנֵי יִצְחָק וַאֲמַר לְאַבְרָהָם אָבוֹי אַבָּא כְּפוֹת יָתִי יָאוּת דְלָא בְּשַׁעַת צְעָרִי אֲפַרְכֵס וְאַעֶרְבְּבָה יָתָךְ וְיִשְׁתַּכַּח קוּרְבָּנָךְ פְּסִיל וְאִידָחִי לְגוֹבָא דְחַבְּלָה לְעַלְמָא דְאָתִי עֵינוֹי דְאַבְרָהָם הֲוֹו מְשׁוֹטְטִין בְּעֵינוֹי דְיִצְחָק וְעֵינוֹי דְיִצְחָק הֲוֹו מְשׁוֹטְטִין בְּמַלְאֲכֵי מְרוֹמָא יִצְחָק הֲוָה חָמֵי יַתְהוֹן אַבְרָהָם לָא חָמֵי יַתְהוֹן בֵּיהּ בְּשַׁעְתָּא נְפָקוּ מַלְאֲכֵי מְרוֹמָא וְאָמְרִין אִלֵין לְאִלֵין אָתוּן חָמוּן תְּרֵין צַדִיקִין יְחִידָאִין בְּגוֹ עַלְמָא חַד נְכֵס וְחַד מִתְנְכֵס דִנְכֵס לָא מְעַכֵּב וּדְמִתְנְכֵס פָּשַׁט צַוְורֵיהּ:", "tj_en": "And Abraham stretched out his hand, and took the knife to slay Izhak his son. Izhak answered and said to Abraham his father, My father, bind my hands rightly, lest in the hour of my affliction I tremble and confuse thee, and thy offering be found profane, and I be cast into the pit of destruction in the world to come. (Now) the eyes of Abraham reached unto the eyes of Izhak; but the eyes of Izhak reaching to the angels on high. And Izhak beheld them, but Abraham saw them not. In that hour came forth the angels on high, and said, these to these, Come, behold two righteous ones alone in the midst of the world: the one slayeth, the other is slain. He who slayeth deferreth not, and he who is to be slain stretcheth out his neck.", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 11, "aliyah": 7, "heb": "וַיִּקְרָ֨א אֵלָ֜יו מַלְאַ֤ךְ יְהֹוָה֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֖אמֶר אַבְרָהָ֣ם&thinsp;<small>׀<\/small>&thinsp;אַבְרָהָ֑ם וַיֹּ֖אמֶר הִנֵּֽנִי׃", "onk": "וּקְרָא לֵיהּ מַלְאָכָא דַיְיָ מִן שְׁמַיָּא וַאֲמַר אַבְרָהָם אַבְרָהָם וַאֲמַר הָא אֲנָא:", "onk_en": "An angel of Adonoy called to him from heaven and said, Avraham, Avraham! and he said, Here I am.", "pj": "וּקְרָא לֵיהּ מַלְאָכָא דַיְיָ מִן שְׁמַיָא וַאֲמַר לֵיהּ אַבְרָהָם אַבְרָהָם וַאֲמַר הָא נָא", "pj_en": "And the Angel of the Lord called to him from the heavens, and said to him, Abraham! Abraham! And he said, Behold me.", "tj": "וַאֲמַר אַבְרָהָם אַבְרָהָם עָנִי אַבְרָהָם בִּלְשַׁן בֵּית קוּדְשָׁא וַאֲמַר הִנֵנִי:", "tj_en": "And He said, Abraham! Abraham! And Abraham answered in the language of the sanctuary, and said, Behold me.", "rashi": "<b>אברהם אברהם.<\/b> לְשׁוֹן חִבָּה הוּא, שֶׁכּוֹפֵל אֶת שְׁמוֹ:", "rashi_en": "אברהם אברהם ABRAHAM, ABRAHAM — The repetition of his name is an expression of affection (Genesis Rabbah 56:7). "}, {"ch": 22, "v": 12, "aliyah": 7, "heb": "וַיֹּ֗אמֶר אַל־תִּשְׁלַ֤ח יָֽדְךָ֙ אֶל־הַנַּ֔עַר וְאַל־תַּ֥עַשׂ ל֖וֹ מְא֑וּמָה כִּ֣י&thinsp;<b>׀<\/b> עַתָּ֣ה יָדַ֗עְתִּי כִּֽי־יְרֵ֤א אֱלֹהִים֙ אַ֔תָּה וְלֹ֥א חָשַׂ֛כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידְךָ֖ מִמֶּֽנִּי׃", "onk": "וַאֲמַר לָא תוֹשֵׁיט יְדָךְ לְעוּלֵימָא וְלָא תַעְבֵּד לֵיהּ מִדָּעָם אֲרֵי כְּעַן יְדַעְנָא (<small>נ\"י<\/small> יְדָעִית) אֲרֵי דַחֲלָא דַיְיָ אַתְּ וְלָא מְנַעְתָּ יָת בְּרָךְ יָת יְחִידָךְ מִנִּי:", "onk_en": "He [God] said, Do not touch the lad, nor do anything to [harm] him; for now I know that you are one who fears Elohim and have not withheld your son, your only one, from Me.", "pj": "וַאֲמַר אַל תּוֹשִׁיט יְדָךְ לְטַלְיָא וְלָא תַעֲבֵּיד לֵיהּ מִדַעַם בִּישׁ אֲרוּם כְּדוֹן גְלֵי קֳדָמַי אֲרוּם דַחֲלָא דַיְיָ אַנְתְּ וְלָא עֲכִּבְתָּא יַת בְּרָךְ יַת יְחִידָךְ מֶנִי", "pj_en": "And He said, Stretch not out thy hand upon the young man, neither do him any evil; for now it is manifest before Me that thou fearest the Lord; neither hast thou withheld thy son the only begotten from Me.", "tj": "", "tj_en": "", "rashi": "<b>אל תשלח.<\/b> לִשְׁחֹט; אָמַר לוֹ אִם כֵּן לְחִנָּם בָּאתִי לְכָאן, אֶעֱשֶׂה בּוֹ חַבָּלָה וְאוֹצִיא מִמֶּנוּ מְעַט דָּם, אָמַר לוֹ <b>אל תעש לו מאומה<\/b> – אַל תַּעַשׂ בּוֹ מוּם:<br><br><b>כי עתה ידעתי.<\/b> אָמַר רַבִּי אַבָּא, אָמַר לוֹ אַבְרָהָם אֲפָרֵשׁ לְפָנֶיךָ אֶת שִׂיחָתִי, אֶתְמוֹל אָמַרְתָּ לִי כִּי בְיִצְחָק יִקָּרֵא לְךָ זָרַע, וְחָזַרְתָּ וְאָמַרְתָּ קַח נָא אֶת בִּנְךָ, עַכְשָׁו אַתָּה אוֹמֵר אַל תִּשְׁלַח יָדְךָ אֶל הַנַּעַר? אָמַר לוֹ הַקָּבָּ\"ה, לֹא אֲחַלֵּל בְּרִיתִי וּמוֹצָא שְׂפָתַי לֹא אֲשַׁנֶּה (תהילים פ\"ט); כְּשֶׁאָמַרְתִּי לְךָ \"קַח\", מוֹצָא שְׂפָתַי לֹא אֲשַׁנֶּה – לֹא אָמַרְתִּי לְךָ שְׁחָטֵהוּ אֶלָּא הַעֲלֵהוּ, אַסַּקְתֵּיהּ, אַחְתֵּיהּ.<br><br><b>כי עתה ידעתי.<\/b> מֵעַתָּה יֵשׁ לִי מַה לְּהָשִׁיב לַשָּׂטָן וְלָאֻמּוֹת הַתְּמֵהִים מַה הִיא חִבָּתִי אֶצְלְךָ; יֵשׁ לִי פִּתְחוֹן פֶּה עַכְשָׁו, שֶׁרוֹאִים כִּי יְרֵא אֱלֹהִים אַתָּה:", "rashi_en": "אל תשלח LAY NOT THINE HAND [UPON THE LAD] to slay him. Then he (Abraham) said to God, “If this be so, I have come here for nothing; let me at least inflict a wound on him and draw some blood from him”. God replied, “Neither do thou anything (מאומה) to him” — inflict no blemish (מום) on him (Genesis Rabbah 56:7).<br><br>כי עתה ידעתי FOR NOW I KNOW—R. Aba said: Abraham said to God, “I will lay my complaint before you. Yesterday (on an earlier occasion) you told me, (Genesis 21:12) “In Isaac shall seed be called to thee”, and then again you said, (Genesis 21:2) “Take now thy son”. Now you tell me, “Lay not thy hand upon the lad”! The Holy One, blessed be He, said to him, in the words of Psalms 89:35, “My covenant will I not profane, nor alter that which is gone out of My lips”. When I told you, “Take thy son”, I was not altering that which went out from My lips, namely, My promise that you would have descendants through Isaac. I did not tell you “Slay him” but bring him up to the mountain. You have brought him up — take him down again” (Genesis Rabbah 56:8).<br><br>כי עתה ידעתי FOR NOW I KNOW — From now I have a reply to give to Satan and to the nations who wonder at the love I bear you: I have an opening of the mouth (i.e. I have an excuse, a reason to give them) now that they see that you are a God-fearing man (Genesis Rabbah 56:7). "}, {"ch": 22, "v": 13, "aliyah": 7, "heb": "וַיִּשָּׂ֨א אַבְרָהָ֜ם אֶת־עֵינָ֗יו וַיַּרְא֙ וְהִנֵּה־אַ֔יִל אַחַ֕ר נֶאֱחַ֥ז בַּסְּבַ֖ךְ בְּקַרְנָ֑יו וַיֵּ֤לֶךְ אַבְרָהָם֙ וַיִּקַּ֣ח אֶת־הָאַ֔יִל וַיַּעֲלֵ֥הוּ לְעֹלָ֖ה תַּ֥חַת בְּנֽוֹ׃", "onk": "וּזְקַף אַבְרָהָם יָת עֵינוֹהִי <b>בָּתַר אִלֵּין<\/b> וַחֲזָא וְהָא דִכְרָא בָּתַר אֲחִיד בְּאִילָנָא בְּקַרְנוֹהִי וַאֲזַל אַבְרָהָם וּנְסֵיב יָת דִּכְרָא וְאַסְקֵיהּ לַעֲלָתָא חֲלַף בְּרֵיהּ:", "onk_en": "Avraham looked up [<b>afterwards<\/b>] and beheld a ram after it had been caught in the thicket by its horns. Avraham went and took the ram and sacrificed it as a burnt-offering instead of his son.", "pj": "וּזְקִף אַבְרָהָם יַת עֵינוֹי וַחֲזָא וְהָא דִכְרָא חַד דְאִתְבְּרֵי בֵּנֵי שַׁמְשְׁתָא דְשִׁכְלוּל עַלְמָא אָחִיד בַּחֲרִישׁוּתָא דְאִילָנָא בְּקַרְנוֹי וְאָזֵל אַבְרָהָם וּנְסֵיב יָתֵיהּ וְאַסֵיקְהִי לְעָלָתָא חֲלַף בְּרֵיהּ", "pj_en": "And Abraham lifted up his eyes and saw, and, behold, a certain ram which had been created between the evenings of the foundation of the world, was held in the entanglement of a tree by his horns. And Abraham went and took him, and offered him an offering instead of his son.", "tj": "", "tj_en": "", "rashi": "<b>והנה איל.<\/b> מוּכָן הָיָה לְכָךְ מִשֵּׁשֶׁת יְמֵי בְרֵאשִׁית:<br><br><b>אחר.<\/b> אַחֲרֵי שֶׁאָמַר לוֹ הַמַּלְאָךְ אַל תִּשְׁלַח יָדְךָ, רָאָהוּ כְּשֶׁהוּא נֶאֱחָז, וְהוּא שֶׁמְּתַרְגְּמִינָן וּזְקַף אַבְרָהָם יַת עֵינוֹהִי בָּתַר אִלֵּין:<br><br><b>בסבך.<\/b> אִילָן:<br><br><b>בקרניו.<\/b> שֶׁהָיָה רָץ אֵצֶל אַבְרָהָם, וְהַשָּׂטָן סוֹבְכוֹ וּמְעַרְבְּבוֹ בָאִילָנוֹת:<br><br><b>תחת בנו.<\/b> מֵאַחַר שֶׁכָּתוּב וַיַּעֲלֵהוּ לְעֹלָה, לֹא חָסֵר הַמִּקְרָא כְּלוּם, מַהוּ תַּחַת בְּנוֹ? עַל כָּל עֲבוֹדָה שֶׁעָשָׂה מִמֶּנּוּ הָיָה מִתְפַּלֵּל וְאוֹמֵר יְהִי רָצוֹן שֶׁתְּהֵא זוֹ כְּאִלּוּ הִיא עֲשׂוּיָה בִּבְנִי, כְּאִלּוּ בְּנִי שָׁחוּט, כְּאִלּוּ דָּמוֹ זָרוּק, כְּאִלּוּ הוּא מֻפְשָׁט, כְּאִלּוּ הוּא נִקְטָר וְנַעֲשֶׂה דֶּשֶׁן:", "rashi_en": "והנה איל BEHOLD, A RAM — It was predestined for that purpose from the six days of Creation (Avot 5:5; Midrash Tanchuma, Vayera 23).<br><br>אחר AFTER the angel had said to him “Lay not thy hand upon the lad” he saw it being caught in the thicket. And that is what we mean when we translate it in the Targum by “And Abraham lifted up his eyes after these (i.e. after these words)”. Other versions of Rashi have: according to the Midrashic explanation, after means after all the words of the angel and the Shechinah, and after all the arguments of Abraham.<br><br>בסבך IN A THICKET— a tree.<br><br>בקרניו BY ITS HORNS — because it was running towards Abraham, but Satan caused it to be caught and entangled among the trees (Pirkei DeRabbi Eliezer 31).<br><br>תחת בנו IN THE STEAD OF HIS SON — Since it is written, “He offered it up for a burnt offering”, surely nothing is missing in the text; what then is the force of “in the stead of his son”? At every sacrificial act he performed on it he prayed saying, “May it be Thy will that this act may be regarded as having been done to my son — as though my son is being slain; as though his blood is being sprinkled; as though his skin were being flayed; as though he is being burnt and is being reduced to ashes” (Genesis Rabbah 56:9). "}, {"ch": 22, "v": 14, "aliyah": 7, "heb": "וַיִּקְרָ֧א אַבְרָהָ֛ם שֵֽׁם־הַמָּק֥וֹם הַה֖וּא יְהֹוָ֣ה&thinsp;<small>׀<\/small>&thinsp;יִרְאֶ֑ה אֲשֶׁר֙ יֵאָמֵ֣ר הַיּ֔וֹם בְּהַ֥ר יְהֹוָ֖ה יֵרָאֶֽה׃", "onk": "<b>וּפְלַח וְצַלִּי אַבְרָהָם תַּמָּן בְּאַתְרָא הַהוּא וַאֲמַר קֳדָם יְיָ הָכָא יְהוֹן פַּלְחַן דָּרַיָּא בְּכֵן יִתְאַמַּר בְּיוֹמָא הָדֵין בְּטוּרָא הָדֵין אַבְרָהָם קֳדָם יְיָ פְּלָח<\/b>:", "onk_en": "Avraham called the name of that place, Adonoy will see; as it is said [to] this day, On Adonoy’s mountain, He will be seen. [<b>Avraham worshiped and prayed there in that place, and he said before Adonoy, “Here will generations worship”. Therefore, as it is said [to] this day, “On this mountain Avraham worshiped before Adonoy”.<\/b>]", "pj": "וְאוֹדִי וְצַלִי אַבְרָהָם תַּמָן בְּאַתְרָא הַהוּא וְאָמַר בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ יְיָ גְלֵי קָדָמָךְ דְלָא הֲוָה בִּלְבָבִי עוּמְקָא וּפָנִיתִי לְמֶעֱבַד גִזְרָתָךְ בְּחֶדְוָא כְּדֵין כַּד יְהוֹן בְּנוֹי דְיִצְחָק בְּרִי עַלְיַין לְשַׁעַת אֲנִיקֵי תֶהֱוֵי מִידְכַּר לְהוֹם וְעָנֵי יַתְהוֹם וּפָרִיק יַתְהוֹם וַעֲתִידִין אִינוּן כָּל דָרַיָא קַיְימִין לְמֶהֱוֵי אָמְרִין בְּטַוְורָא הָדֵין כָּפַת אַבְרָהָם יַת יִצְחָק בְּרֵיהּ וְתַמָן אִתְגַלְיַת עִילוֹי שְׁכִינְתָּא דַיְיָ", "pj_en": "And Abraham gave thanks and prayed there, in that place, and said, I pray through the mercies that are before Thee, O Lord, before whom it is manifest that it was not in the depth of my heart to turn away from doing Thy decree with joy, that when the children of Izhak my son shall offer in the hour of affliction, this may be a memorial for them; and Thou mayest hear them and deliver them, and that all generations to come may say, In this mountain Abraham bound Izhak his son, and there the Shekina of the Lord was revealed unto him.", "tj": "וּפְלַח וְצַלֵי אַבְרָהָם בְּשֵׁם מֵימְרֵיהּ דַיְיָ וַאֲמַר אַתְּ הוּא יְיָ דְחָמֵי וְלָא מִתְחַמֵי בְּבָעוּ רַחֲמִין מִן קֳדָמָךְ יְיָ כּוֹלָא גְלֵי וִידִיעַ קֳדָמָךְ דְלָא הֲוָה בְּלִבִּי פַּלְגוּ בְּזִימְנָא דְאַמֵרַת לִי לְמִקְרָבָא יַת יִצְחָק בְּרִי לְמָעְבַד יָתֵיהּ עָפָר וּקְטָם קֳדָמָךְ אֶלָא מִן יַד אַקְדִימִית בְּצַפְרָא וַעֲבָדִית יַת מֵימְרָךְ בְּחַדְוָוא וְקַיֵימִית מֵימְרָךְ וּכְדוּן בְּבָעוּ רַחֲמִין מִן קֳדָמָךְ יְיָ אֱלֹהִים כַּד יְהֶוְיַין בְּנוֹי דְיִצְחָק עַלְלִין לְשַׁעַת אַנַנְקִי תֶּהֱוֵי מִדְכַּר לְהוֹן עֲקֵידָתֵיהּ דְיִצְחָק אֲבוּהוֹן וּשְׁרֵי וּשְׁבִיק לְחוֹבֵיהוֹן וּפְרוֹק יַתְהוֹן מִן כָּל אַנַנְקִי דְעַתִידִין דָרַיָא לְמֵיקַם מִן בַּתְרֵיהּ לְמֶהֱוֵי אָמְרִין בְּטוּר בֵּית מִקְדְשֵׁיהּ דַיְיָ קָרִיב אַבְרָהָם יַת יִצְחָק בְּרֵיהּ וּבְּטוּרָא הָדֵין הוּא בֵּית מַקְדְשָׁא אִיתְגְלִית עֲלוֹי יְקַר שְׁכִינְתָּא דַיְיָ:", "tj_en": "And Abrahm prayed in the name of the Word of the Lord, and said, Thou art the Lord who seest, and art not seen. I pray for mercy before Thee, O Lord. It is wholly manifest and known before Thee that in my heart there was no dividing, in the time that Thou didst command me to offer Izhak my son, and to make him dust and ashes before Thee; but that forthwith I arose in the morning and performed Thy word with joy, and I have fulfilled Thy word. And now I pray for mercies before Thee, O Lord God, that when the children of Izhak offer in the hour of need, the binding of Izhak their father Thou mayest remember on their behalf, and remit and forgive their sins, and deliver them out of all need. That the generations who are to arise after him may say, In the mountain of the house of the sanctuary of the Lord did Abraham offer Izhak his son, and in this mountain of the house of the sanctuary was revealed unto him the glory of the Shekinah of the Lord.", "rashi": "<b>ה' יראה.<\/b> פְּשׁוּטוֹ כְּתַרְגּוּמוֹ, ה' יִבְחַר וְיִרְאֶה לוֹ אֶת הַמָּקוֹם הַזֶּה לְהַשְׁרוֹת בּוֹ שְׁכִינָתוֹ וּלְהַקְרִיב כָּאן קָרְבָּנוֹת:<br><br><b>אשר יאמר היום.<\/b> שֶׁיֹּאמְרוּ לִימֵי הַדּוֹרוֹת עָלָיו בְּהַר זֶה יֵרָאֶה הַקָּבָּ\"ה לְעַמּוֹ:<br><br><b>היום.<\/b> הַיָּמִים הָעֲתִידִין, כְּמוֹ עַד הַיּוֹם הַזֶּה שֶׁבְּכָל הַמִּקְרָא, שֶׁכָּל הַדּוֹרוֹת הַבָּאִים הַקּוֹרְאִים אֶת הַמִּקְרָא הַזֶּה אוֹמְרִים עַד הַיּוֹם הַזֶּה עַל הַיוֹם שֶׁעוֹמְדִים בּוֹ. וּמִ\"אַ ה' יִרְאֶה עֲקֵדָה זוֹ לִסְלֹחַ לְיִשְׂרָאֵל בְּכָל שָׁנָה וּלְהַצִּילָם מִן הַפֻּרְעָנוּת, כְּדֵי שֶׁיֵּאָמֵר הַיּוֹם הַזֶּה – בְּכָל הַדּוֹרוֹת הַבָּאִים – בְּהַר ה' יֵרָאֶה אֶפְרוֹ שֶׁל יִצְחָק צָבוּר וְעוֹמֵד לְכַפָּרָה:", "rashi_en": "'ה יראה Its real meaning is as the Targum renders it: The Lord will choose and select for Himself this place to make His Shechinah reside in it and for sacrifices to be offered there. <br><br>אשר יאמר היום AS IT IS SAID TO THIS DAY — In the generations to come people will say of it,” On this mountain the Holy One, blessed be He, shows Himself to His people.” <br><br>היום THIS DAY — the future days, with the same meaning as עד היום הזה “even until this day” wherever it occurs in the entire Scriptures: that all future generations who read this passage will refer the phrase “even unto this day” to the day in which they live. The Midrashic explanation is: May God see this Binding of Isaac every year to forgive Israel and to save them from punishment, so that it may be said “in this day” — in all future generations — “there are seen in the mountain of the Lord” the ashes of Isaac heaped up as it were and serving as a means of atonement (Midrash Tanchuma, Vayera 23)."}, {"ch": 22, "v": 15, "aliyah": 7, "heb": "וַיִּקְרָ֛א מַלְאַ֥ךְ יְהֹוָ֖ה אֶל־אַבְרָהָ֑ם שֵׁנִ֖ית מִן־הַשָּׁמָֽיִם׃", "onk": "וּקְרָא מַלְאָכָא דַיְיָ לְאַבְרָהָם תִּנְיָנוּת מִן שְׁמַיָּא:", "onk_en": "An angel of Adonoy called to Avraham, a second time, from heaven.", "pj": "וּקְרָא מַלְאָכָא דַיְיָ לְאַבְרָהָם תִּנְיָינוּת מִן שְׁמַיָא", "pj_en": "And the Angel of the Lord called to Abraham the second time from the heavens,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 16, "aliyah": 7, "heb": "וַיֹּ֕אמֶר בִּ֥י נִשְׁבַּ֖עְתִּי נְאֻם־יְהֹוָ֑ה כִּ֗י יַ֚עַן אֲשֶׁ֤ר עָשִׂ֙יתָ֙ אֶת־הַדָּבָ֣ר הַזֶּ֔ה וְלֹ֥א חָשַׂ֖כְתָּ אֶת־בִּנְךָ֥ אֶת־יְחִידֶֽךָ׃", "onk": "וַאֲמַר בְּמֵימְרֵי קַיֵּמִית אֲמַר יְיָ אֲרֵי חֲלַף דִּי עֲבַדְתָּא יָת פִּתְגָּמָא הָדֵין וְלָא מְנַעְתָּא יָת בְּרָךְ יָת יְחִידָךְ:", "onk_en": "And said, I have sworn by Myself [<b>My Word<\/b>], declares Adonoy, that because you performed this deed, and did not withhold your only son.", "pj": "וְאָמַר בְּמֵימְרִי קַיֵימִית אָמַר יְיָ חוֹלַף דְעָבַדְתְּ יַת פִּתְגָמָא הָדֵין וְלָא מָנַעְתְּ יַת בְּרָךְ יַת יְחִידָךְ", "pj_en": "and said, By My Word have I sworn, saith the Lord, forasmuch as thou hast done this thing, and hast not withheld thy son, thy only begotten,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 17, "aliyah": 7, "heb": "כִּֽי־בָרֵ֣ךְ אֲבָרֶכְךָ֗ וְהַרְבָּ֨ה אַרְבֶּ֤ה אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְכַח֕וֹל אֲשֶׁ֖ר עַל־שְׂפַ֣ת הַיָּ֑ם וְיִרַ֣שׁ זַרְעֲךָ֔ אֵ֖ת שַׁ֥עַר אֹיְבָֽיו׃", "onk": "אֲרֵי בָרָכָא אֲבָרְכִנָּךְ וְאַסְגָּאָה אַסְגֵּי יָת בְּנָךְ כְּכוֹכְבֵי שְׁמַיָּא וּכְחָלָא דִּי עַל כֵּיף יַמָּא וְיִרְתוּן בְּנָךְ יָת <b>קִרְוֵי<\/b> סַנְאֵיהוֹן:", "onk_en": "I will greatly bless you and make your descendants as numerous as the stars of the sky and like the sand on the seashore. Your descendants will inherit the gate [<b>cities<\/b>] of their enemies.", "pj": "אֲרוּם בְּרָכָא אֵיבָרְכִינָךְ וְאַסְגָא אַסְגֵי יַת בְּנָךְ כְּכוֹכְבֵי שְׁמַיָא וִיהֵי כְּחָלָא דְעַל כֵּיף יַמָא וְיֵירְתוּן בְּנָךְ יַת קִרְוֵי קוּמִי סַנְאֵיהוֹן", "pj_en": "that in blessing I will bless thee, and in multiplying I will multiply thy sons as the stars of the heavens, and they shall be as the sand which is upon the shore of the sea, and thy sons shall inherit the cities before their enemies.", "tj": "", "tj_en": "", "rashi": "<b>ברך אברכך.<\/b> אַחַת לָאָב וְאַחַת לַבֵּן:<br><br><b>והרבה ארבה.<\/b> אַחַת לָאָב וְאַחַת לַבֵּן:", "rashi_en": "ברך אברכך I WILL SURELY BLESS THEE — The double use of the term “bless” is intended to signify a blessing for the father and a blessing for the son (Genesis Rabbah 56:11).<br><br>והרבה ארבה AND I WILL GREATLY MULTIPLY— once for the father, and once for the son (Genesis Rabbah 56:11). "}, {"ch": 22, "v": 18, "aliyah": 7, "heb": "וְהִתְבָּרְכ֣וּ בְזַרְעֲךָ֔ כֹּ֖ל גּוֹיֵ֣י הָאָ֑רֶץ עֵ֕קֶב אֲשֶׁ֥ר שָׁמַ֖עְתָּ בְּקֹלִֽי׃", "onk": "וְיִתְבָּרְכוּן <b>בְּדִיל<\/b> בְּנָךְ כֹּל עַמְמַיָּא דְאַרְעָא חֲלַף דִּי קַבֵּלְתָּא <b>לְמֵימְרִי<\/b>:", "onk_en": "Through [<b>Because of<\/b>] your children, will be blessed all the nations of the world, because you heeded My voice [<b>Word<\/b>].", "pj": "וְיִתְבָּרְכוּן בְּגִין זַכְוַות בְּנָךְ כָּל עַמְמֵי אַרְעָא חוֹלַף דְקַבֵּלְתָּא בְּמֵימְרִי", "pj_en": "And all the peoples of the earth shall be blessed through the righteousness of thy son, because thou hast obeyed My word.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 19, "aliyah": 7, "heb": "וַיָּ֤שׇׁב אַבְרָהָם֙ אֶל־נְעָרָ֔יו וַיָּקֻ֛מוּ וַיֵּלְכ֥וּ יַחְדָּ֖ו אֶל־בְּאֵ֣ר שָׁ֑בַע וַיֵּ֥שֶׁב אַבְרָהָ֖ם בִּבְאֵ֥ר שָֽׁבַע׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתַב אַבְרָהָם לְוַת עוּלֵימוֹהִי וְקָמוּ וַאֲזָלוּ כַּחֲדָא לִבְאֵר שָׁבַע וִיתֵיב אַבְרָהָם בִּבְאֵר שָׁבַע:", "onk_en": "Avraham returned to his assistants, and they rose and went together to Beer Sheva. Avraham dwelt in Beer Sheva.", "pj": "וּדְבָרוּ מַלְאֲכֵי מְרוֹמָא יַת יִצְחָק וְאוֹבִלוֹהִי לְבֵי מֶדְרָשָׁא דְשֵׁם רַבָּא וַהֲוָה תַּמָן תְּלַת שְׁנִין וּבְהַהוּא יוֹמָא תַב אַבְרָהָם לְוַת עוּלֵמוֹי וְקָמוּ וַאֲזָלוּ כַּחֲדָא לְבֵירָא דְשָׁבַע וְיָתֵיב אַבְרָהָם בְּבֵירָא דְשָׁבַע", "pj_en": "And the angels on high took Izhak and brought him into the school (medresha) of Shem the Great; and he was there three years. And in the same day Abraham returned to his young men; and they arose and went together to the Well of the Seven, and Abraham dwelt at Beira-desheva.", "tj": "", "tj_en": "", "rashi": "<b>וישב אברהם בבאר שבע.<\/b> לֹא יְשִׁיבָה מַמָּשׁ, שֶׁהֲרֵי בְּחֶבְרוֹן הָיָה יוֹשֵׁב, י\"ב שָׁנִים לִפְנֵי עֲקֵדָתוֹ שֶׁל יִצְחָק יָצָא מִבְּאֵר שֶׁבַע וְהָלַךְ לוֹ לְחֶבְרוֹן, כְּמוֹ שֶׁנֶּאֱמַר וַיָּגָר אַבְרָהָם בְּאֶרֶץ פְּלִשְׁתִּים יָמִים רַבִּים, מְרֻבִּים מִשֶּׁל חֶבְרוֹן הָרִאשׁוֹנִים, וְהֵם כ\"ו שָׁנָה, כְּמוֹ שֶׁפֵּרַשְׁנוּ לְמַעְלָה:", "rashi_en": "וישב אברהם בבאר שבע AND ABRAHAM DWELT AT BEER-SHEBA — This does not mean really dwelling there but merely staying there on his way home, because he was, as a matter of fact, living at Hebron. Twelve years before the Binding of Isaac he had left Beer-Sheba and had gone to Hebron, as it is said, (21:34) ‘‘And Abraham sojourned in the land of the Philistines many days”, i.e. exceeding in number the earlier days when he had resided at Hebron — altogether 26 years, as we have explained above (21:34). "}, {"ch": 22, "v": 20, "aliyah": 7, "heb": "וַיְהִ֗י אַחֲרֵי֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וַיֻּגַּ֥ד לְאַבְרָהָ֖ם לֵאמֹ֑ר הִ֠נֵּ֠ה יָלְדָ֨ה מִלְכָּ֥ה גַם־הִ֛וא בָּנִ֖ים לְנָח֥וֹר אָחִֽיךָ׃", "onk": "וַהֲוָה בָּתַר פִּתְגָּמַיָּא הָאִלֵּין וְאִתְחֲוָא לְאַבְרָהָם לְמֵימָר הָא יְלֵידַת מִלְכָּה אַף הִיא בְּנִין לְנָחוֹר אָחוּךְ:", "onk_en": "After these words, it was told to Avraham, saying, Behold, Milkah has also born children to Nachor, your brother.", "pj": "וַהֲוָה בָּתַר פִּתְגָמַיָא הָאִילֵין מִן בָּתַר דְכָפַת אַבְרָהָם יַת יִצְחָק וַאֲזַל סִטְנָא וְתַנִי לְוַת שָרָה דְאַבְרָהָם נְכַס יַת יִצְחָק וְקָמַת שָרָה וּפַגְנַת וְאַשְׁתַּנְקַת וּמִיתַת מִן אֲנִיקָא וְאָתָא אַבְרָהָם וּבַת בְּאָרְחָא וְתַנְיָא לְאַבְרָהָם לְמֵימַר הָא יְלִידַת מִלְכָּה אוּף הִיא אִתְרְוָוחַת בִּזְכוּת דְאַחְתָהּ לְמֵילַד בְּנִין לְנָחוֹר אָחוּךְ", "pj_en": "And it was after these things, after Abraham had bound Izhak, that Satana came and told unto Sarah that Abraham had killed Izhak. And Sarah arose, and cried out, and was strangled, and died from agony. But Abraham had come, and was resting in the way. And it was told Abraham, saying, Behold, Milcha also hath borne; she hath enlargement, through the righteousness of her sister, for bring forth sons unto Nachor thy brother:", "tj": "", "tj_en": "", "rashi": "<b>אחרי הדברים האלה ויגד וגו'.<\/b> בְּשׁוּבוֹ מֵהַר הַמּוֹרִיָה הָיָה אַבְרָהָם מְהַרְהֵר וְאוֹמֵר אִלּוּ הָיָה בְנִי שָׁחוּט כְּבָר, הָיָה הוֹלֵךְ בְּלֹא בָנִים, הָיָה לִי לְהַשִּׂיאוֹ אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכּוֹל וּמַמְרֵא, בִּשְּׂרוֹ הַקָּבָּ\"ה שֶׁנּוֹלְדָה רִבְקָה בַת זוּגוֹ, וְזֶהוּ <b>הדברים האלה<\/b>, הִרְהוּרֵי דְּבָרִים שֶׁהָיוּ עַל יְדֵי עֲקֵדָה:<br><br><b>גם היא.<\/b> אַף הִיא הִשְׁוָת מִשְׁפְּחוֹתֶיהָ לְמִשְׁפְּחוֹת אַבְרָהָם י\"ב, מָה אַבְרָהָם י\"ב שְׁבָטִים שֶׁיָּצְאוּ מִיַּעֲקֹב, ח' בְּנֵי הַגְּבִירוֹת וד' בְּנֵי שְׁפָחוֹת, אַף אֵלּוּ ח' בְּנֵי גְּבִירוֹת וְד' בְּנֵי פִּילֶגֶשׁ:", "rashi_en": "אחרי הדברים האלה AFTER THESE THINGS [IT WAS TOLD ABRAHAM] etc. — When he returned from Mount Moriah Abraham was pondering and he said, “If my son had really been slain, he would have died without children! I must marry him to one of the daughters of Aner or Eshcol or Mamre”. The Holy One, blessed be He, therefore had the announcement made to him that Rebecca, the one fit to be his (Isaac’s) consort, had been born. This is what is meant by “after these things or words” — namely, “after the words” that expressed the thoughts aroused by the Binding of Isaac (Genesis Rabbah 57:3).<br><br>גם היא SHE ALSO — She also had a number of families equal in all respects to those which Abraham was to have — namely, twelve, and just as in the case of Abraham, of the twelve tribes born of Jacob) eight were the children of the principal wives and four those of the hand-maids, so here, also, eight were sons of the principal wife and four were sons of the concubine (Genesis Rabbah 57:3). "}, {"ch": 22, "v": 21, "aliyah": 7, "heb": "אֶת־ע֥וּץ בְּכֹר֖וֹ וְאֶת־בּ֣וּז אָחִ֑יו וְאֶת־קְמוּאֵ֖ל אֲבִ֥י אֲרָֽם׃", "onk": "יָת עוּץ בּוּכְרֵיהּ וְיָת בּוּז אָחוּהִי וְיָת קְמוּאֵל אֲבוּהִי דַאֲרָם:", "onk_en": "Utz, his first born, Buz his brother, and Kemueil, the father of Aram.", "pj": "יַת עוּץ בּוּכְרֵיהּ וְיַת בּוּז אָחוֹי וְיַת קְמוּאֵל רַב קְסוּמַיָא דְאַרְמָאֵי", "pj_en": "Uts, his firstborn, and Booz, his brother, and Kemuel, master of the Aramean magicians, and", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 22, "aliyah": 7, "heb": "וְאֶת־כֶּ֣שֶׂד וְאֶת־חֲז֔וֹ וְאֶת־פִּלְדָּ֖שׁ וְאֶת־יִדְלָ֑ף וְאֵ֖ת בְּתוּאֵֽל׃", "onk": "וְיָת כֶּשֶׂד וְיָת חֲזוֹ וְיָת פִּלְדָּשׁ וְיָת יִדְלָף וְיָת בְּתוּאֵל:", "onk_en": "[Also] Kesed, Chazo, Pildash, Yidlaf and Besueil.", "pj": "וְיַת כֶּשֶד וְיַת חֲזוֹ וְיַת פִּלְדָשׁ וְיַת יִדְלָף וְיַת בְּתוּאֵל", "pj_en": "Keshed, and Chazo, and Pildash, and Jidlaph, and Bethuel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 23, "aliyah": 7, "heb": "וּבְתוּאֵ֖ל יָלַ֣ד אֶת־רִבְקָ֑ה שְׁמֹנָ֥ה אֵ֙לֶּה֙ יָלְדָ֣ה מִלְכָּ֔ה לְנָח֖וֹר אֲחִ֥י אַבְרָהָֽם׃", "onk": "וּבְתוּאֵל אוֹלִיד יָת רִבְקָה תְּמַנְיָא אִלֵּין יְלֵידַת מִלְכָּה לְנָחוֹר אֲחוּהִי דְאַבְרָהָם:", "onk_en": "Besueil fathered Rivkah. These eight, Milkah bore to Nachor, the brother of Avraham.", "pj": "וּבְתוּאֵל אוֹלִיד יַת רִבְקָה תְּמַנְיָא אִלֵין יְלִידַת מִלְכָּה לְנָחוֹר אָחוֹי דְאַבְרָהָם", "pj_en": "And Bethuel begat Rivekeh. These eight bare Milcha to Nacor the brother of Abraham.", "tj": "", "tj_en": "", "rashi": "<b>ובתואל ילד את רבקה.<\/b> כָּל הַיִּחוּסִין הַלָּלוּ לֹא נִכְתְּבוּ אֶלָּא בִּשְׁבִיל פָּסוּק זֶה:", "rashi_en": "ובתואל ילד את רבקה AND BETHUEL BEGAT REBECCA — The entire genealogical record is given only for the sake of this verse (i. e. to lead up to this verse)."}, {"ch": 22, "v": 24, "aliyah": 7, "heb": "וּפִֽילַגְשׁ֖וֹ וּשְׁמָ֣הּ רְאוּמָ֑ה וַתֵּ֤לֶד גַּם־הִוא֙ אֶת־טֶ֣בַח וְאֶת־גַּ֔חַם וְאֶת־תַּ֖חַשׁ וְאֶֽת־מַעֲכָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְחֵנָתֵיהּ וּשְׁמַהּ רְאוּמָה וִילֵידַת אַף הִיא יָת טֶבַח וְיָת גַּחַם וְיָת תַּחַשׁ וְיָת מַעֲכָה:", "onk_en": "His concubine was named Re’umah. She also gave birth to Tevach, Gacham, Tachash and Ma’achoh.", "pj": "וּפִלַקְתֵּיהּ וּשְׁמָהּ רְאוּמָה וִילֵידַת אוּף הִיא יַת טֶבַח וְיַת גַחַם וְיַת תַּחַשׁ וְיַת מַעֲכָה", "pj_en": "And his concubine, whose name was Rëuma, she also bare Tebach, and Gacham, and Tachash, and Maacha.", "tj": "וּפְלַקְתֵּיהּ וּשְׁמָהּ:", "tj_en": "And his concubine...and her name...", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
