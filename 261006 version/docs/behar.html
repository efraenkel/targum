 "tj_en": "But a field in the suburbs of their cities shall not be sold, because a possession.", "rashi": "<b>ושדה מגרש עריהם לא ימכר.<\/b> מֶכֶר גִּזְבָּר, שֶׁאִם הִקְדִּישׁ בֶּן לֵוִי אֶת שָׂדֵהוּ וְלֹא גְאָלָהּ וּמְכָרָהּ גִּזְבָּר, אֵינָהּ יוֹצְאָה לַכֹּהֲנִים בַּיּוֹבֵל כְּמוֹ שֶׁנֶּאֱמַר בְּיִשְׂרָאֵל וְאִם מָכַר אֶת הַשָּׂדֶה לְאִישׁ אַחֵר לֹא יִגָּאֵל עוֹד (ויקרא כ\"ז), אֲבָל בֶּן לֵוִי גּוֹאֵל לְעוֹלָם:", "rashi_en": "ושדה מגרש עריהם לא ימכר AND THE FIELDS OF THE SUBURBS OF THEIR CITIES MAY NOT BE SOLD — This means: they may not be sold as an absolute sale by the treasurer of the Temple property — that if a Levite dedicated his field to the Temple and has not redeemed it, and the treasurer then sold it to someone it does not pass into the possession of the priests in the Jubilee as is the case with the property of an Israelite of whom it is stated (Leviticus 27:16—20) “[and if a man shall sanctify unto the Lord some part of a field… and if he will not redeem the field,] and he (the treasurer; see Rashi on that verse) has sold it to another man, it shall not be redeemed any more, [but the field when it goes out in the Jubilee, shall be… the priests]” — the Levite, however, may redeem it at any time (even after the Jubilee and also when the treasurer has sold it to another man) (Sifra, Behar, Chapter 6 9)."}, {"ch": 25, "v": 35, "aliyah": 5, "heb": "וְכִֽי־יָמ֣וּךְ אָחִ֔יךָ וּמָ֥טָה יָד֖וֹ עִמָּ֑ךְ וְהֶֽחֱזַ֣קְתָּ בּ֔וֹ גֵּ֧ר וְתוֹשָׁ֛ב וָחַ֖י עִמָּֽךְ׃", "onk": "וַאֲרֵי יִתְמַסְכַּן אָחוּךְ וּתְמוּט יְדֵיהּ עִמָּךְ וְתַתְקֵף בֵּיהּ דַּיַּר וְתוֹתָב וִיחֵי עִמָּךְ:", "onk_en": "If your brother becomes impoverished and his hand (assets) become shaky among you, you must support him, [so too] the proselyte [<b>foreign resident<\/b>] and the sojourner, [so] that he shall live with you.", "pj": "וַאֲרוּם יִתְמַסְכַּן אָחוּךְ וּתְמוּט יְדֵיהּ עִמָךְ וְתַתְקִיף בֵּיהּ וּתְהַנְיֵיהּ יִדוֹר וְתוֹתָב וְיִתְפַּרְנֵס עִמָךְ", "pj_en": "And if thy brother hath become poor, and his hand wavereth with thee, then thou shalt strengthen and do him good, as a guest and a sojourner he shall be nourished with thee.", "tj": "", "tj_en": "", "rashi": "<b>והחזקת בו.<\/b> אַל תַּנִּיחֵהוּ שֶׁיֵּרֵד וְיִפֹּל וְיִהְיֶה קָשֶׁה לַהֲקִימוֹ, אֶלָּא חַזְּקֵהוּ מִשְּׁעַת מוֹטַת הַיָּד; לְמָה זֶה דוֹמֶה? לְמַשּׂאוֹי שֶׁעַל הַחֲמוֹר, עוֹדֵהוּ עַל הַחֲמוֹר אֶחָד תּוֹפֵס בּוֹ וּמַעֲמִידוֹ, נָפַל לָאָרֶץ, חֲמִשָּׁה אֵין מַעֲמִידִין אוֹתוֹ:<br><br><b>גר ותושב.<\/b> אַף אִם הוּא גֵּר אוֹ תוֹשָׁב; וְאֵיזֶהוּ תוֹשָׁב? כָּל שֶׁקִּבֵּל עָלָיו שֶׁלֹּא לַעֲבֹד עֲ\"זָ וְאוֹכֵל נְבֵלוֹת (עי' ספרא):", "rashi_en": "והחזקת בו THOU SHALT RELIEVE HIM — Do not leave him by himself so that he comes down in the world until he finally falls altogether when it will be difficult to give him a lift, but uphold him from the very moment of the failure of his means. To  what may this (the differences between whether you assist him at once or whether you wait with your help till he has come down in the world) be compared? To an excessive load on the back of an ass. So long as it is still on the ass’s back, one person is enough to take hold of it (the load) and to keep it (the ass) up, as soon as it has fallen to the ground not even five persons are able to set it on its legs (Sifra, Behar, Section 5 1).<br><br>גר ותושב means, even though he be a stranger or a sojourner. And what is a תושב? One who has undertaken not to worship idols (i. e. one who has been converted to the fundamental tenet of Judaism) but eats carrion (does not care for the other commandments of the Torah) (Sifra, Behar, Section 5 1)."}, {"ch": 25, "v": 36, "aliyah": 5, "heb": "אַל־תִּקַּ֤ח מֵֽאִתּוֹ֙ נֶ֣שֶׁךְ וְתַרְבִּ֔ית וְיָרֵ֖אתָ מֵֽאֱלֹהֶ֑יךָ וְחֵ֥י אָחִ֖יךָ עִמָּֽךְ׃", "onk": "לָא תִסַּב מִנֵּיהּ חִבּוּלְיָא וְרִבִּיתָא וְתִדְחַל מֵאֱלָהָךְ וִיחֵי אָחוּךְ עִמָּךְ:", "onk_en": "You shall not take from him interest or usury and you shall fear your God, and your brother shall live with you.", "pj": "עַמִי בֵּית יִשְרָאֵל לָא תִיסְבוּן מִנֵיהּ לָא שַׁעֲרִין וְלָא רִיבְיַין וְתִדְחַל מֵאֱלָהָךְ וְיִתְפַּרְנֵס אָחוּךְ עִמָךְ", "pj_en": "My people of the house of Israel you shall not take usuries or remunerations (in his case) but thou shalt fear thy God, and let thy brother have nourishment with thee.", "tj": "", "tj_en": "", "rashi": "<b>נשך ותרבית.<\/b> חַד שַׁוִּינְהוּ רַבָּנָן, וְלַעֲבֹר עָלָיו בִּשְׁנֵי לָאוִין (בבא מציעא ס'):<br><br><b>ויראת מאלהיך.<\/b> לְפִי שֶׁדַּעְתּוֹ שֶׁל אָדָם נִמְשֶׁכֶת אַחַר הָרִבִּית, וְקָשֶׁה לִפְרֹשׁ הֵימֶנּוּ, וּמוֹרֶה לְעַצְמוֹ הֶתֵּר בִּשְׁבִיל מְעוֹתָיו שֶׁהָיוּ בְטֵלוֹת אֶצְלוֹ, הֻצְרַךְ לוֹמַר וְיָרֵאתָ מֵּאֱלֹהֶיךָ, אוֹ הַתּוֹלֶה מְעוֹתָיו בְּגוֹי כְּדֵי לְהַלְווֹתָם לְיִשְֹרָאֵל בְּרִבִּית, הֲרֵי זֶה דָבָר הַמָּסוּר לְלִבּוֹ שֶׁל אָדָם וּמַחֲשַׁבְתּוֹ, לְכָךְ הֻצְרַךְ לוֹמַר וְיָרֵאתָ מֵּאֱלֹהֶיךָ (שם ס\"א):", "rashi_en": "נשך ותרבית [TAKE THOU NOT] INTEREST [OF HIM] OR INCREASE  — The Rabbis regard them (these two things) as one, but Scripture uses two different words for the same offence in order to prescribe that he who infringes the law, is thereby transgressing two negative commands (Bava Metzia 60b).<br><br>ויראת מאלהיך BUT BE AFRAID OF THY GOD — Because man’s thoughts are greatly attracted by the idea of taking interest and it comes difficult to him to keep aloof from it, so that he tries to persuade himself that it is a legitimate act (lit., he decides for himself that it is a permissible matter) on account of the fact that his money will otherwise remain unemployed, Scripture was compelled to state: “But be afraid of thy God!\" Or take another case: If one pretends that his money belongs to a non-Jew in order to be able to lend it to an Israelite in an ostensibly legitimate way. This is given only to his heart and thoughts to know the real circumstances of the case; Scripture therefore was compelled to state “But be afraid of thy God!” (Bava Metzia 61b)."}, {"ch": 25, "v": 37, "aliyah": 5, "heb": "אֶ֨ת־כַּסְפְּךָ֔ לֹֽא־תִתֵּ֥ן ל֖וֹ בְּנֶ֑שֶׁךְ וּבְמַרְבִּ֖ית לֹא־תִתֵּ֥ן אׇכְלֶֽךָ׃", "onk": "יָת כַּסְפָּךְ לָא תִתֵּן לֵיהּ בְּחִבּוּלְיָא וּבְרִבִּיתָא לָא תִתֵּן מֵיכְלָךְ:", "onk_en": "You must not give (lend) him your money with interest, and usuriously you must not advance him your food.", "pj": "עַמִי בְּנֵי יִשְרָאֵל יַת כַּסְפֵּיכוֹן לָא תִתְּנוּן לֵיהּ בְּשַׁעַרְיָין וּבְרִיבְיָין לָא תִתְּנוּן עִבוּרֵיכוֹן", "pj_en": "My people of the house of Israel, you shall not lend him for usury, nor give him your provisions for increase.", "tj": "יַת כַּסְפָּךְ לָא תִיתֵּן בְּשִׁיעוּרִין וּבְרַבְיָן לָא תִיתֵּן מְזוֹנָךְ:", "tj_en": "Thy money thou shalt not lend him for usuries, nor give thy food for increase.", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 38, "aliyah": 5, "heb": "אֲנִ֗י יְהֹוָה֙ אֱלֹ֣הֵיכֶ֔ם אֲשֶׁר־הוֹצֵ֥אתִי אֶתְכֶ֖ם מֵאֶ֣רֶץ מִצְרָ֑יִם לָתֵ֤ת לָכֶם֙ אֶת־אֶ֣רֶץ כְּנַ֔עַן לִהְי֥וֹת לָכֶ֖ם לֵאלֹהִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲנָא יְיָ אֱלָהָכוֹן דִּי אַפֵּקִית יָתְכוֹן מֵאַרְעָא דְמִצְרָיִם לְמִתַּן לְכוֹן יָת אַרְעָא דִכְנַעַן לְמֶהֱוֵי לְכוֹן לֶאֱלָהּ:", "onk_en": "I am Adonoy your God who brought you out from the land of Egypt to give you the land of Canaan, to be a God for you.", "pj": "אֲנָא הוּא יְיָ אֱלָהָכוֹן דִי פְרִיקִית וַאֲפֵיקִית יַתְכוֹן פְרִיקִין מִן אַרְעָא דְמִצְרַיִם מְטוֹל לְמִתַּן לְכוֹן יַת אַרְעָא דִכְנַעַן לְמֶהֱוֵי לְכוֹן לֶאֱלָהָא", "pj_en": "I am the Lord your God, who redeemed and brought you out redeemed from the land of Mizraim, to give unto you the land of Kenaan, and to be unto you Eloha.", "tj": "", "tj_en": "", "rashi": "<b>אשר הוצאתי וגו'.<\/b> וְהִבְחַנְתִּי בֵין בְּכוֹר לְשֶׁאֵינוֹ בְכוֹר, אַף אֲנִי יוֹדֵעַ וְנִפְרָע מִן הַמַּלְוֶה מָעוֹת לְיִשְׂרָאֵל בְּרִבִּית וְאוֹמֵר שֶׁל גּוֹי הֵם; דָּ\"אַ: אֲשֶׁר הוֹצֵאתִי אֶתְכֶם מֵאֶרֶץ מִצְרַיִם עַל מְנָת שֶׁתְּקַבְּלוּ עֲלֵיכֶם מִצְוֹתַי, וַאֲפִלּוּ הֵן כְּבֵדוֹת עֲלֵיכֶם:<br><br><b>לתת לכם את ארץ כנען.<\/b> בִּשְׂכַר שֶׁתְּקַבְּלוּ מִצְוֹתַי:<br><br><b>להיות לכם לאלהים.<\/b> שֶׁכָּל הַדָּר בְּאֶרֶץ יִשְׂרָאֵל אֲנִי לוֹ לֵאלֹהִים וְכָל הַיּוֹצֵא מִמֶּנָּה כְּעוֹבֵד עַ\"זָ (ספרא; כתובות ק\"י):", "rashi_en": "'אשר הוצאתי וגו‎‎ [I AM THE LORD YOUR GOD] WHO BROUGHT YOU FORTH [FROM THE LAND OF EGYPT] and distinguished between those who were firstborn and those who were not firstborn (a matter which is hidden from human cognizance), I also know the true facts of this matter and I will exact punishment from him who lends money to an Israelite saying that it belongs to a non-Jew (Bava Metzia 61b; cf. Rashi on Leviticus 19:36). Another explanation is: I am the Lord your God Who brought you forth from  the land of Egypt on condition that you take upon yourselves the fulfillment of My commands although they be hard for you (cf. Sifra, Behar, Section 5 3) <br><br>לתת לכם את ארץ כנען TO GIVE YOU THE LAND OF CANAAN as a reward for your taking upon yourselves to fulfill My commandments.<br><br>להיות לכם לאלהים TO BE YOUR GOD  —Because to him who dwells in the land of Israel I am God; while he who leaves it may be regarded as though he were an idolator (Sifra, Behar, Section 5 4; Ketubot 110b)."}, {"ch": 25, "v": 39, "aliyah": 6, "heb": "וְכִֽי־יָמ֥וּךְ אָחִ֛יךָ עִמָּ֖ךְ וְנִמְכַּר־לָ֑ךְ לֹא־תַעֲבֹ֥ד בּ֖וֹ עֲבֹ֥דַת עָֽבֶד׃", "onk": "וַאֲרֵי יִתְמַסְכַּן אָחוּךְ עִמָּךְ וְיִזְדַּבַּן לָךְ לָא תִפְלַח בֵּיהּ פָּלְחַן עַבְדִּין:", "onk_en": "If your brother becomes impoverished and is sold to you, you must not work him like a slave [<b>slaves<\/b>].", "pj": "וַאֲרוּם יִתְמַסְכֵּן אָחוּךְ עִמָךְ וְיִזְדַבֵּן לָךְ לָא תִפְלַח בֵּיהּ הֵי כְּנִימוּסֵי פוּלְחָנוּת עַבְדַיָא", "pj_en": "If thy brother with thee shall have become poor, and have sold himself unto thee, thou shalt not make him serve according to the laws of the service of bondmen", "tj": "", "tj_en": "", "rashi": "<b>עבדת עבד.<\/b> עֲבוֹדָה שֶׁל גְּנַאי שֶׁיְּהֵא נִכָּר בָּהּ כְּעֶבֶד, שֶׁלֹּא יוֹלִיךְ כֵּלָיו אַחֲרָיו לְבֵית הַמֶּרְחָץ וְלֹא יַנְעִיל לוֹ מִנְעָלָיו (עי' ספרא):", "rashi_en": "עבדת עבד [THOU SHALT NOT COMPEL HIM] TO SERVE AS A BOND-SERVANT — i. e. thou shalt not make him do degrading work by which he is recognised as a slave — this might come out that he shall not, for instance, carry his (the master’s) clothes after him to the public baths nor help him on with his boots (cf. Sifra, Behar, Chapter 7 2)."}, {"ch": 25, "v": 40, "aliyah": 6, "heb": "כְּשָׂכִ֥יר כְּתוֹשָׁ֖ב יִהְיֶ֣ה עִמָּ֑ךְ עַד־שְׁנַ֥ת הַיֹּבֵ֖ל יַעֲבֹ֥ד עִמָּֽךְ׃", "onk": "כַּאֲגִירָא כְתוֹתָבָא יְהֵי עִמָּךְ עַד שַׁתָּא דְיוֹבֵלָא יִפְלַח עִמָּךְ:", "onk_en": "Like a hired hand or resident [worker] shall he be with you He shall serve you until the jubilee year.", "pj": "הֵי כְּאַגִירָא הֵי כְּתוֹתָבָא יְהֵי עִמָךְ עַד שַׁתָּא דְיוֹבְלָא יִפְלַח עִמָךְ", "pj_en": "but as a hired man and as a sojourner shall he serve with thee, until the year of Jubela shall he serve thee.", "tj": "", "tj_en": "", "rashi": "<b>כשכיר כתושב.<\/b> עֲבוֹדַת קַרְקַע וּמְלֶאכֶת אֻמָּנוּת כִּשְׁאָר שְׂכִירִים הִתְנַהֵג בּוֹ:<br><br><b>עד שנת היבל.<\/b> אִם פָּגַע בּוֹ יוֹבֵל לִפְנֵי שֵׁשׁ שָׁנִים הַיּוֹבֵל מוֹצִיאוֹ:", "rashi_en": "כשכיר כתושב BUT AS A HIRED SERVANT AND AS A SOJOURNER HE SHALL BE UNTO THEE]  —Employ him on field-labour or on a handicraft; Treat him as you do any hired servant.<br><br>עד שנת היבל [HE SHALL SERVE THEE] UNTIL THE YEAR OF THE JUBILEE — This implies that if the Jubilee happens to come (lit., happens to meet him) before the six years of his servitude are at an end, it frees him."}, {"ch": 25, "v": 41, "aliyah": 6, "heb": "וְיָצָא֙ מֵֽעִמָּ֔ךְ ה֖וּא וּבָנָ֣יו עִמּ֑וֹ וְשָׁב֙ אֶל־מִשְׁפַּחְתּ֔וֹ וְאֶל־אֲחֻזַּ֥ת אֲבֹתָ֖יו יָשֽׁוּב׃", "onk": "וְיִפּוֹק מֵעִמָּךְ הוּא וּבְנוֹהִי עִמֵּיהּ וִיתוּב לְזַרְעִיתֵיהּ וּלְאַחֲסָנַת אֲבָהָתוֹהִי יְתוּב:", "onk_en": "Then he and his children shall depart from you and return to his own family. He shall return to his ancestral estate.", "pj": "וְיִפּוֹק לְבַר חוֹרִין מֵעִמָךְ הוּא וּבְנוֹי עִמֵיהּ וִיתֵיב לִגְנִיסָתֵיהּ וּלְאַחֲסָנַת אַבְהָתוֹי יְתוּב", "pj_en": "Then shall he go out from thee at liberty, he and his children with him, and return to his family, and to the heritage of his fathers shall he return.", "tj": "", "tj_en": "", "rashi": "<b>הוא ובניו עמו.<\/b> אָמַר רַ' שִׁמְעוֹן אִם הוּא נִמְכַּר, בָּנָיו מִי מְכָרָן? אֶלָּא מִכָּאן שֶׁרַבּוֹ חַיָּב בִּמְזוֹנוֹת בָּנָיו (קידושין כ\"ב):<br><br><b>ואל אחזת אבתיו.<\/b> אֶל כְּבוֹד אֲבוֹתָיו, וְאֵין לְזַלְזְלוֹ בְּכָךְ (ספרא; מכילתא י\"ג):<br><br><b>אחזת.<\/b> חֲזָקַת:", "rashi_en": "הוא ובניו עמו [AND HE SHALL GO AWAY FROM THEE] BOTH HE AND HIS CHILDREN WITH HIM — Rabbi Simeon asked: If he sold himself who sold his children that Scripture has to state they shall leave the master together with him? But we may learn from this that the master is bound to provide his (the servant’s) children with food (Kiddushin 22a; cf. Rashi on Exodus 21:3) although they are not his slaves.<br><br>ואל אחזת אבתיו AND UNTO THE POSSESSION OF HIS FATHERS [SHALL HE RETURN] — This means, he shall  return to the dignity held by his ancestors and people shall not hold him in low esteem because of this (because he had previously been a slave); <br><br>אחזת thus means as much as חזקת “the status of” (Makkot 13a)."}, {"ch": 25, "v": 42, "aliyah": 6, "heb": "כִּֽי־עֲבָדַ֣י הֵ֔ם אֲשֶׁר־הוֹצֵ֥אתִי אֹתָ֖ם מֵאֶ֣רֶץ מִצְרָ֑יִם לֹ֥א יִמָּכְר֖וּ מִמְכֶּ֥רֶת עָֽבֶד׃", "onk": "אֲרֵי עַבְדַּי אִנּוּן דִּי אַפֵּקִית יָתְהוֹן מֵאַרְעָא דְמִצְרָיִם לָא יִזְדַּבְּנוּן זְבוּן עַבְדִּין:", "onk_en": "For they are My servants, whom I brought out from the land of Egypt, they shall not be sold [in the market] as slaves.", "pj": "אֲרוּם עֲבָדַי הִינוּן דְהַנְפֵּיקִית יַתְהוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם לָא יִזְדַבְּנוּן הֵי כְנִימוּסֵי זְבִין עַבְדַיָא", "pj_en": "For they are My servants whom I brought forth redeemed from the land of Mizraim; they shall not be sold according to the laws of the sale of bondmen.", "tj": "", "tj_en": "", "rashi": "<b>כי עבדי הם.<\/b> שְׁטָרִי קוֹדֵם (ספרא):<br><br><b>לא ימכרו ממכרת עבד.<\/b> בְּהַכְרָזָה — \"כָּאן יֵשׁ עֶבֶד לִמְכֹּר\" וְלֹא יַעֲמִידֶנּוּ עַל אֶבֶן הַלֶּקַח (ספרא):", "rashi_en": "כי עבדי הם FOR THEY ARE MY SERVANTS — My document (deed of purchase) is of an earlier date ( Sifra, Behar, Section 6 1).<br><br>לא ימכרו ממכרת עבד THEY SHALL NOT BE SOLD AS THOUGH BY THE SALE OF A BONDSMAN — by public announcement: “Here is a slave to be sold!” Nor shall one make him stand on the auction-stone (Sifra, Behar, Section 6 1). "}, {"ch": 25, "v": 43, "aliyah": 6, "heb": "לֹא־תִרְדֶּ֥ה ב֖וֹ בְּפָ֑רֶךְ וְיָרֵ֖אתָ מֵאֱלֹהֶֽיךָ׃", "onk": "לָא תִפְלַח בֵּיהּ בְּקַשְׁיוּ וְתִדְחַל מֵאֱלָהָךְ:", "onk_en": "You must not rule over him [<b>make him work<\/b>] to crush him and you shall fear your God.", "pj": "לָא תִשְׁתַּעְבְּדוּן בֵּיהּ בְּקַשְׁיוּ וְתִדְחַל מֵאֱלָהָךְ", "pj_en": "Neither may you make him serve with rigour, but thou shalt fear the Lord thy God.", "tj": "", "tj_en": "", "rashi": "<b>לא תרדה בו בפרך.<\/b> מְלָאכָה שֶׁלֹּא לְצֹרֶךְ, כְּדֵי לְעַנּוֹתוֹ, אַל תֹּאמַר לוֹ, הָחֵם לִי אֶת הַכּוֹס הַזֶּה וְהוּא אֵינוֹ צָרִיךְ, עֲדֹר תַּחַת הַגֶּפֶן עַד שֶׁאָבֹא; שֶׁמָּא תֹאמַר אֵין מַכִּיר בַּדָּבָר אִם לְצֹרֶךְ אִם לָאו, וְאוֹמֵר אֲנִי לוֹ שֶׁהוּא לְצֹרֶךְ, הֲרֵי הַדָּבָר הַזֶּה מָסוּר לְלִבּוֹ, לְכָךְ נֶאֱמַר \"וְיָרֵאתָ\" (שם):", "rashi_en": "  לא תרדה בו בפרך THOU SHALT NOT RULE OVER HIM WITH RIGOUR — i. e. do not force him to do some useless work with the sole purpose of vexing him. Do not e.g. say to him, “Warm me this cup of drink\" when this is  unnecessary; nor: “Hoe beneath this vine tree until I come\" whilst he does not know when you may be expected to come back. Perhaps you will say, “No one knows the fact — whether it is necessary or not, so I will tell him that it is necessary”! — the thing is thus entrusted to his (the master’s) heart only, therefore Scripture states, “but be afraid of thy God!” (Sifra, Behar, Section 6 2; see Rashi on Leviticus 19:32)."}, {"ch": 25, "v": 44, "aliyah": 6, "heb": "וְעַבְדְּךָ֥ וַאֲמָתְךָ֖ אֲשֶׁ֣ר יִהְיוּ־לָ֑ךְ מֵאֵ֣ת הַגּוֹיִ֗ם אֲשֶׁר֙ סְבִיבֹ֣תֵיכֶ֔ם מֵהֶ֥ם תִּקְנ֖וּ עֶ֥בֶד וְאָמָֽה׃", "onk": "וְעַבְדָּךְ וְאַמְתָךְ דִּי יְהוֹן לָךְ מִן עַמְמַיָּא דִּי בְסַחֲרָנֵיכוֹן מִנְּהוֹן תִּקְנוּן עַבְדִּין וְאַמְהָן:", "onk_en": "Your slaves and maidservants that you shall possess from the nations that surround you, from them you may purchase slaves and maidservants.", "pj": "בְּרַם עַבְדֵיכוֹן וְאַמְהָתֵיכוֹן דִיהוֹן לְכוֹן מִן אַמְהַתְכוֹן דְמִן עַמְמַיָא דִי בְּחַזְרָנוּתֵיכוֹן מִנְהוֹן תְּזַבְּנוּן עַבְדִין וְאַמְהָן", "pj_en": "But your bondmen and your handmaids which you may have, of the handmaids of the Gentiles, of them you may purchase bondmen and handmaids.", "tj": "", "tj_en": "", "rashi": "<b>ועבדך ואמתך אשר יהיו לך.<\/b> אִם תֹּאמַר אִם כֵּן בְּמָה אֶשְׁתַּמֵּשׁ? בַּעֲבָדַי אֵינִי מוֹשֵׁל, בָּאֻמּוֹת אֵינִי נוֹחֵל, שֶׁהֲרֵי הִזְהַרְתַּנִי לֹא תְחַיֶּה כָּל נְשָׁמָה, אֶלָּא מִי יְשַׁמְּשֵׁנִי?<br><br><b>מאת הגוים.<\/b> הֵם יִהְיוּ לְךָ לַעֲבָדִים (שם):<br><br><b>אשר סביבתיכם.<\/b> וְלֹא שֶׁבְּתוֹךְ גְּבוּל אַרְצְכֶם, שֶׁהֲרֵי בָהֶם אָמַרְתִּי לֹא תְחַיֶּה כָּל נְשָׁמָה:", "rashi_en": "ועבדך ואמתך אשר יהיו לך BUT THY MAN-SERVANT AND THY MAID-SERVANT WHO MAY BE THINE [SHALL BE OF THE NATIONS THAT ARE ROUND ABOUT YOU] — If you should say, “But if this be so (that I must treat my Jewish servant with so much regard), by whom shall I be served? Over my Jewish servants I have no power; of the Canaanite people I cannot possess any for You have warned me, (Deuteronomy XX 16) “Thou shalt keep alive any soul\"! Who  then shall serve me?” Then I reply — <br><br>מאת הגוים OF THE OTHER NATIONS — they may be servants to you.<br><br>אשר סביבתיכם [THE NATIONS] WHO ARE ROUND ABOUT YOU — not, however, those who live within the boundaries of your land; for with regard to them I have indeed told you, “Thou shalt keep alive no soul” (Sifra, Behar, Section 6 3)."}, {"ch": 25, "v": 45, "aliyah": 6, "heb": "וְ֠גַ֠ם מִבְּנֵ֨י הַתּוֹשָׁבִ֜ים הַגָּרִ֤ים עִמָּכֶם֙ מֵהֶ֣ם תִּקְנ֔וּ וּמִמִּשְׁפַּחְתָּם֙ אֲשֶׁ֣ר עִמָּכֶ֔ם אֲשֶׁ֥ר הוֹלִ֖ידוּ בְּאַרְצְכֶ֑ם וְהָי֥וּ לָכֶ֖ם לַֽאֲחֻזָּֽה׃", "onk": "וְאַף מִבְּנֵי תוֹתָבַיָּא עָרְלַיָּא דְּדָיְרִין עִמְּכוֹן מִנְּהוֹן תִּקְנוּן וּמִזַּרְעִיתְהוֹן דְּעִמְּכוֹן דִּי אִתְיְלִידוּ בְּאַרְעֲכוֹן וִיהוֹן לְכוֹן לְאַחֲסָנָא:", "onk_en": "Also, from the children of the [<b>uncircumcised<\/b>] sojourners who reside with you from them you may purchase [slaves], and from their families that live among you that were born in your land. [All these] shall be your permanent possession.", "pj": "וְאוּף מִבְּנֵי תּוּתְבַיָא עֲרֵלַיָא דְדַיְירִין עִמְכוֹן מִנְהוֹן תְּזַבְּנוּן וּמִן יִחוּסֵיהוֹן דְעִמְכוֹן דְאִתְיְלִידוּ בְּאַרְעֲכוֹן וְלָא מִן כְּנַעֲנָאֵי וִיהוֹן לְכוֹן לְאַחֲסָנָא", "pj_en": "Moreover, of the children of the uncircumcised strangers who sojourn among you, of them you may buy, and of their families that are with you, which they have begotten in your land; but not from the Kenaanaee; and they shall be yours for possession.", "tj": "", "tj_en": "", "rashi": "<b>וגם מבני התושבים.<\/b> שֶׁבָּאוּ מִסְּבִיבוֹתֵיכֶם לִשָּׂא נָשִׁים בְּאַרְצְכֶם, וְיָלְדוּ לָהֶם, הַבֵּן הוֹלֵךְ אַחַר הָאָב, וְאֵינוֹ בִּכְלַל לֹא תְחַיֶּה, אֶלָּא אַתָּה מֻתָּר לִקְנוֹתוֹ כְּעֶבֶד (קידושין כ\"ז):<br><br><b>מהם תקנו.<\/b> אוֹתָם תִּקְנוּ:", "rashi_en": "‎ וגם מבני התושבים MORE-OVER FROM AMONGST THE TOLERATED STRANGERS who came from the lands round about you in order to marry Canaanite women in your land and these bear them children; then the child follows the father in respect of nationality, and thus, not being regarded as a Canaanite, is not included in this command, “Thou shalt not keep alive any soul”, but you may purchase him as a servant (cf. Sifra, Behar, Section 6 4; Kiddushin 67b).<br><br>מהם תקנו means THEM MAY YE BUY."}, {"ch": 25, "v": 46, "aliyah": 6, "heb": "וְהִתְנַחַלְתֶּ֨ם אֹתָ֜ם לִבְנֵיכֶ֤ם אַחֲרֵיכֶם֙ לָרֶ֣שֶׁת אֲחֻזָּ֔ה לְעֹלָ֖ם בָּהֶ֣ם תַּעֲבֹ֑דוּ וּבְאַ֨חֵיכֶ֤ם בְּנֵֽי־יִשְׂרָאֵל֙ אִ֣ישׁ בְּאָחִ֔יו לֹא־תִרְדֶּ֥ה ב֖וֹ בְּפָֽרֶךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתַחְסְנוּן יָתְהוֹן לִבְנֵיכוֹן בַּתְרֵיכוֹן לִירוּתַת אַחֲסָנָא לְעָלָם בְּהוֹן תִּפְלְחוּן וּבְאַחֵיכוֹן בְּנֵי יִשְׂרָאֵל גְּבַר בַּאֲחוּהִי לָא תִפְלַח בֵּיהּ בְּקַשְׁיוּ:", "onk_en": "You shall will them as inheritance to your children after you as hereditary property; you shall keep them in servitude permanently. However regarding your bretheren, Bnei Yisroel, man over his brother, you must not rule over him [<b>make him work<\/b>] to crush him.", "pj": "וְתַחְסְנוּן יַתְהוֹן לִבְנֵיכוֹן בַּתְרֵיכוֹן לִירוּתַת אַחֲסָנָא לַעֲלַם בְּהוֹן תִּפְלְחוּן וּבְאֲחוּכוֹן בְּנֵי יִשְרָאֵל גְבַר בְּחַבְרֵיהּ לָא תְשַׁעֲבְּדוּן בְּהוֹן בְּקַשְׁיוּ", "pj_en": "And you may leave them to your children after you, to inherit as a perpetual possession; them you shall make to serve: but of your brethren of the sons of Israel no man (may enslave) his fellow; them shall you not make to serve with rigour.", "tj": "", "tj_en": "", "rashi": "<b>והתנחלתם אתם לבניכם.<\/b> הַחֲזִיקוּ בָהֶם לְנַחֲלָה לְצֹרֶךְ בְּנֵיכֶם אַחֲרֵיכֶם; וְלֹא יִתָּכֵן לְפָרֵשׁ הַנְחִילוּם לִבְנֵיכֶם, שֶׁאִם כֵּן הָיָה לוֹ לִכְתֹּב \"וְהִנְחַלְתֶּם\" אוֹתָם לִבְנֵיכֶם, וְהִתְנַחַלְתֶּם כְּמוֹ וְהִתְחַזַּקְתֶּם:<br><br><b>איש באחיו.<\/b> לְהָבִיא נָשִׂיא בְעַמָּיו וּמֶלֶךְ בִּמְשָׁרְתָיו שֶׁלֹּא לִרְדּוֹת בְּפָרֶךְ:", "rashi_en": "והתנחלתם אתם לבניכם means, you may hold them as your possession, לבניכם אחריכם, for the benefit of your children after you. It would not, however, be correct to give the word והתנחלתם the meaning: “leave them as an inheritance to your children”, for if this were intended it should have written: והנחלתם אותם לבניכם (the Hiphil), but והתנחלתם (which is the Hithpael form) is equivalent to והתחזקתם “you may hold them as your possession”.<br><br>איש באחיו ONE OVER ANOTHER — These apparently redundant words (for the text might have run: ובאחיכם בני ישראל לא תרדו בפרך) are intended to include in the prohibition that the prince must not rule with rigour over his people nor the king over his subjects."}, {"ch": 25, "v": 47, "aliyah": 7, "heb": "וְכִ֣י תַשִּׂ֗יג יַ֣ד גֵּ֤ר וְתוֹשָׁב֙ עִמָּ֔ךְ וּמָ֥ךְ אָחִ֖יךָ עִמּ֑וֹ וְנִמְכַּ֗ר לְגֵ֤ר תּוֹשָׁב֙ עִמָּ֔ךְ א֥וֹ לְעֵ֖קֶר מִשְׁפַּ֥חַת גֵּֽר׃", "onk": "וַאֲרֵי תַדְבֵּק יַד עָרֵל וְתוֹתָב עִמָּךְ וְיִתְמַסְכַּן אָחוּךְ עִמֵּיהּ וְיִזְדַּבַּן לְעָרֵל תּוֹתָב עִמָּךְ אוֹ לְאַרְמַי זַרְעִית גִּיּוֹרָא:", "onk_en": "If a foreigner [<b>an uncircumcised one<\/b>] or resident acquires means while your brother becomes impoverished by him, and is sold to a [<b>an uncircumcised<\/b>] resident foreigner who resides with you or to the offspring [<b>a non-Jew<\/b>] of a foreign [<b>proselyte<\/b>] family.", "pj": "וַאֲרוּם תְּאַרַע יַד עָרֵל וְתּוֹתַב דְעִמָךְ וְיִתְמַסְכֵּן אָחוּךְ עִמֵיהּ וְיִזְדַבֵּן לְעָרֵל תּוֹתָב דְעִמָךְ אוֹ לִשְׁרִישׁ פּוּלְחָנָא נוּכְרָאָה לִמְשַׁמְשָׁא לָהּ וּלְפַלְחָהָא דְמִזַרְעִית גִיוֹרָא", "pj_en": "And if the hand of the uncircumcised sojourner with you wax strong, and thy brother with him become poor, and sell himself to the uncircumcised stranger who is with thee, or to the stock of a strange religion, to serve him or to worship with him who is of the generation of strangers;", "tj": "", "tj_en": "", "rashi": "<b>יד גר ותושב.<\/b> גֵּר וְהוּא תוֹשָׁב, כְּתַרְגּוּמוֹ עָרֵל תוֹתָב, וְסוֹפוֹ מוֹכִיח — וְנִמְכַּר \"לְגֵר תּוֹשָׁב\":<br><br><b>וכי תשיג יד גר ותושב עמך.<\/b> מִי גָּרַם לוֹ שֶׁיַּעֲשִׁיר? דִּבּוּקוֹ עִמְּךָ.<br><br><b>ומך אחיך עמו.<\/b> מִי גָּרַם לוֹ שֶׁיָּמוּךְ? דִּבּוּקוֹ עִמּוֹ, עַל יְדֵי שֶׁלָּמַד מִמַּעֲשָׂיו:<br><br><b>משפחת גר.<\/b> זֶה הַגּוֹי, כְּשֶׁהוּא אוֹמֵר לְעֵקֶר, זֶה הַנִּמְכָּר לְעֲ\"זַ עַצְמָהּ, לִהְיוֹת לָהּ שַׁמָּשׁ, וְלֹא לֶאֱלֹהוּת אֶלָּא לַחֲטֹב עֵצִים וְלִשְׁאֹב מַיִם (ספרא; בבא קמא קי\"ג):", "rashi_en": "יד גר ותושב [AND IF] A גר ותושב WAX RICH — This means a stranger, he being at the same time a sojourner with thee, as the Targum renders it: ערל תותב an uncircumcised sojourner (the phrase is hendiadys). The end of the verse proves this, for it states: “and he sells himself unto a strange sojourner” (גר תושב, without the copulative ו before the second word). <br><br>וכי תשיג יד גר ותושב עמך AND IF A STRANGE SOJOURNER WAX RICH BY THEE — The last word suggests: What was the cause that he has waxen rich? His close connection with thee (עמך) (Sifra, Behar, Chapter 8 1).<br><br>ומך אחיך עמו AND THY BROTHER WAX POOR BY HIM — Here again the last word suggests: What was the cause that he has waxen poor? His intimacy with him (Sifra, Behar, Chapter 8 1), — because of the fact that he learned evil from his (the stranger’s) evil doings. <br><br>משפחת גר — itself denotes a heathen; since, however, Scripture adds the word לעקר “to the stock of the heathen’s family” it thereby refers to one who sells himself to the idol itself — to be its servant; not to worship it as a deity, but e. g., to chop wood or to draw water which are to be used in connection with this idol worship (cf. Sifra, Behar, Chapter 8 1; Bava Kamma 113b; Arakhin 30b; Kiddushin 20a)."}, {"ch": 25, "v": 48, "aliyah": 7, "heb": "אַחֲרֵ֣י נִמְכַּ֔ר גְּאֻלָּ֖ה תִּהְיֶה־לּ֑וֹ אֶחָ֥ד מֵאֶחָ֖יו יִגְאָלֶֽנּוּ׃", "onk": "בָּתַר דְּיִזְדַּבַּן פֻּרְקָנָא תְּהֵי לֵיהּ חַד מֵאֲחוֹהִי יִפְרְקִנֵּיהּ:", "onk_en": "After he is sold redemption shall be his, one of his bretheren shall redeem him.", "pj": "בָּתַר דְיִשְׁתְּמוֹדַע לְכוֹן דְיִזְדַבֵּן מִן יַד פּוּרְקָנָא יְהֵי לֵיהּ חַד מִן אָחוֹי יִפְרְקִינֵיהּ", "pj_en": "when it is known to you that he hath been sold, forthwith redemption shall, be his; one of his brethren shall redeem him;", "tj": "", "tj_en": "", "rashi": "<b>גאלה תהיה לו.<\/b> מִיָּד, אַל תַּנִּיחֵהוּ שֶׁיִּטָּמַע:", "rashi_en": "גאלה תהיה לו means HE SHALL BE REDEEMED at once — do not allow him totally to sink his identity among the heathens (Sifra, Behar, Chapter 8 1; Kiddushin 20b)."}, {"ch": 25, "v": 49, "aliyah": 7, "heb": "אוֹ־דֹד֞וֹ א֤וֹ בֶן־דֹּדוֹ֙ יִגְאָלֶ֔נּוּ אֽוֹ־מִשְּׁאֵ֧ר בְּשָׂר֛וֹ מִמִּשְׁפַּחְתּ֖וֹ יִגְאָלֶ֑נּוּ אֽוֹ־הִשִּׂ֥יגָה יָד֖וֹ וְנִגְאָֽל׃", "onk": "אוֹ אַח אֲבוּהִי אוֹ בַר אַח אֲבוּהִי יִפְרְקִנֵּיהּ אוֹ מִקָּרִיב בִּשְׂרֵיהּ מִזַּרְעִיתֵיהּ יִפְרְקִנֵּיהּ אוֹ דְתַדְבֵּק יְדֵיהּ וְיִתְפָּרָק:", "onk_en": "Either his uncle [<b>father’s brother<\/b>] or his uncles son [<b>the son of his father’s brother<\/b>] (cousin) shall redeem him or the closest (other) family relative shall redeem him. If he obtains sufficient means of his own he may be redeemed [on his own.]", "pj": "אוֹ אַחְבוֹי אוֹ בַּר אַחְבוֹי יִפְרְקִינֵיהּ אוֹ מִקָרִיב בִּישְרֵיהּ מִזַרְעִיתֵיהּ יִפְרְקִינֵיהּ אוֹ תְּאַרַע יְדֵיהּ אוֹ יְדָא דְצִבּוּרָא וְיִתְפָּרִיק", "pj_en": "either the brother of his father or the son of his father's brother may redeem him; or a kinsman of the flesh of his family may redeem him; or by his own hand being made strong, or by the hand of the congregation, he may be redeemed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 50, "aliyah": 7, "heb": "וְחִשַּׁב֙ עִם־קֹנֵ֔הוּ מִשְּׁנַת֙ הִמָּ֣כְרוֹ ל֔וֹ עַ֖ד שְׁנַ֣ת הַיֹּבֵ֑ל וְהָיָ֞ה כֶּ֤סֶף מִמְכָּרוֹ֙ בְּמִסְפַּ֣ר שָׁנִ֔ים כִּימֵ֥י שָׂכִ֖יר יִהְיֶ֥ה עִמּֽוֹ׃", "onk": "וִיחַשֵּׁב עִם זָבְנֵיהּ מִשַּׁתָּא דְּאִזְדַּבַּן לֵיהּ עַד שַׁתָּא דְיוֹבֵלָא וִיהֵי כְּסַף זְבִינוֹהִי בְּמִנְיַן שְׁנַיָא כְּיוֹמֵי אֲגִירָא יְהֵי עִמֵּיהּ:", "onk_en": "He shall reckon with the one who bought him. [According to the number of years] from the year which he was sold to him until the jubilee year. His purchase price shall be [proportional] to the number of years; at the rate of the days of a hired hand it shall be [considered as he worked] with him.", "pj": "וִידַיֵיק עִם עַרְלָאָה דְזַבְּנֵיהּ מִשַׁתָּא דְיִזְדַבֵּן לֵיהּ עַד שַׁתָּא דְיוֹבְלָא וִיהֵי כְסַף זַבִּינוֹ כְּמִנְיַן שְׁנַיָא הֵי כְיוֹמֵי אֲגִירָא יְהֵי עִמֵיהּ", "pj_en": "And he shall account with the uncircumcised person who had bought him, from the year that he was sold until the year of Jubela, and the price of his repurchase shall be according to the number of the years; according to the days of an hireling shall it be with him.", "tj": "", "tj_en": "", "rashi": "<b>עד שנת היבל.<\/b> שֶׁהֲרֵי כָל עַצְמוֹ לֹא קְנָאוֹ אֶלָּא לְעָבְדוֹ עַד הַיּוֹבֵל, שֶׁהֲרֵי בַיּוֹבֵל יֵצֵא, כְּמוֹ שֶׁנֶּאֱמַר לְמַטָּה וְיָצָא בִּשְׁנַת הַיֹּבֵל; וּבְגוֹי שֶׁתַּחַת יָדְךָ הַכָּתוּב מְדַבֵּר (ספרא; קידושין ט\"ז), וְאַעַפִּ\"כֵ לֹא תָבֹא עָלָיו בַּעֲקִיפִין מִפְּנֵי חִלּוּל הַשֵּׁם (בבא קמא קי\"ג), אֶלָּא כְּשֶׁבָּא לִגָּאֵל, יְדַקְדֵּק בַּחֶשְׁבּוֹן, לְפִי הַמַּגִּיעַ בְּכָל שָׁנָה וְשָׁנָה יְנַכֶּה לוֹ הַגּוֹי מִן דָּמָיו, אִם הָיוּ עֶשְׂרִים שָׁנָה מִשֶּׁנִמְכַּר עַד הַיּוֹבֵל, וּקְנָאוֹ בְּעֶשְׂרִים מָנֶה, נִמְצָא שֶׁקָּנָה הַגּוֹי עֲבוֹדַת שָׁנָה בְּמָנֶה, וְאִם שָׁהָה זֶה אֶצְלוֹ חָמֵשׁ שָׁנִים, וּבָא לִגָּאֵל, יְנַכֶּה לוֹ חֲמִשָּׁה מָנִים, וְיִתֵּן לוֹ הָעֶבֶד ט\"ו מָנִים, וְזֶהוּ <b>והיה כסף ממכרו במספר שנים<\/b>:<br><br><b>כימי שכיר יהיה עמו<\/b> — חֶשְׁבּוֹן הַמַּגִּיעַ לְכָל שָׁנָה וְשָׁנָה יַחֲשֹׁב, כְּאִלּוּ נִשְׂכַּר עִמּוֹ כָּל שָׁנָה בְּמָנֶה, וִינַכֶּה לוֹ:", "rashi_en": "עד שנת היובל [AND HE SHALL RECKON WITH HIM…] UNTO THE YEAR OF THE JUBILEE — for after all, essentially he has bought him only to work for him till the Jubilee, for surely you must admit in the Jubilee he is to go free, as Scripture states later ,on (v. 54) “[and if he be  not redeemed in these ways], then he  shall go out in the year of the Jubilee”. And, of course, Scripture is speaking here of a heathen who is under your control (i. e. who has to submit to your jurisdiction, for otherwise Scripture could not dictate to him) (Sifra, Behar, Chapter 9 3; Kiddushin 16a). But nevertheless you must not practise crooked ways against him because this would result in a desecration of the Name of the Lord (Bava Kamma 113a), but when he wishes to be redeemed he must be exact in his calculation — only just as much as is due each year shall the heathen allow him as a deduction from the purchase-money: (i. e. the Jew cannot demand a larger deduction); if e. g., there were twenty years from the date when he was sold till the Jubilee and he has bought him for  twenty manehs — and consequently the heathen has purchased the labour of each year for one maneh — if he (the Jewish servant) stayed with him five years and then wishes to be redeemed, he (the master) has to allow him only a deduction of five manehs from the purchase-money, so that the servant must repay him fifteen manehs. This is the meaning of: והיה כסף ממכרו במספר שנים; AND THE PRICE OF HIS SALE SHALL BE CALCULATED AS HAVING BEEN ACCORDING TO THE NUMBER OF YEARS;<br><br>כימי שכיר יהיה עמו  AS AT THE RATE OF THE DAYS OF AN HIRED SERVANT SHALL HE HAVE BEEN WITH HIM — i. e. he shall calculate the amount due for each year as though he had hired himself out with him e. g., at one maneh per year and that amount only he (the master) has to allow him."}, {"ch": 25, "v": 51, "aliyah": 7, "heb": "אִם־ע֥וֹד רַבּ֖וֹת בַּשָּׁנִ֑ים לְפִיהֶן֙ יָשִׁ֣יב גְּאֻלָּת֔וֹ מִכֶּ֖סֶף מִקְנָתֽוֹ׃", "onk": "אִם עוֹד סְגִיּוּת בִּשְׁנַיָּא לְפוּמְהֵן יָתֵיב פֻּרְקָנֵיהּ מִכְּסַף זְבִינוֹהִי:", "onk_en": "If there are yet many years [until the jubilee] accordingly shall he return his redemption money from his purchase price.", "pj": "אִין עַד כְּדוּן אִית סַגִי בִּשְׁנַיָא לְפוּם סְמוּכְהוֹן יָתִיב פּוּרְקָנֵיהּ מִכְּסַף זְבִינוֹי", "pj_en": "If yet there be many years, according to their number he shall give for his redemption of the money that he was bought for.", "tj": "", "tj_en": "", "rashi": "<b>אם עוד רבות בשנים.<\/b> עַד הַיּוֹבֵל:<br><br><b>לפיהן.<\/b> הַכֹּל כְּמוֹ שֶׁפֵּרַשְׁתִּי:", "rashi_en": "אם עוד רבות בשנים IF THERE BE YET MANY YEARS until the Jubilee. <br><br>לפיהן ACCORDING TO THEM [HE SHALL RESTORE THE PRICE OF HIS REDEMPTION] — all exactly as I have explained above."}, {"ch": 25, "v": 52, "aliyah": 7, "heb": "וְאִם־מְעַ֞ט נִשְׁאַ֧ר בַּשָּׁנִ֛ים עַד־שְׁנַ֥ת הַיֹּבֵ֖ל וְחִשַּׁב־ל֑וֹ כְּפִ֣י שָׁנָ֔יו יָשִׁ֖יב אֶת־גְּאֻלָּתֽוֹ׃", "onk": "וְאִם זְעֵר יִשְׁתָּאַר בִּשְׁנַיָּא עַד שַׁתָּא דְיוֹבֵלָא וִיחַשֵּׁב לֵיהּ כְּפוּם שְׁנוֹהִי יָתֵב יָת פֻּרְקָנֵיהּ:", "onk_en": "If there remain but a few years until the jubilee year, he shall make a [similar] calculation, based on the number of years he shall return his redemption money [to the purchaser.]", "pj": "וְאִם קָלִיל יִשְׁתַּיְירוּן בִּשְׁנַיָא עַד שַׁתָּא דְיוֹבְלָא וִיחַשֵׁב לֵיהּ כְּפוּם סְכוּם שְׁנוֹי יָתֵיב יַת פּוּרְקָנֵיהּ", "pj_en": "But if few years remain till the year of Jubela, he shall compute with him, and according to the amount of the years give for his redemption.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 53, "aliyah": 7, "heb": "כִּשְׂכִ֥יר שָׁנָ֛ה בְּשָׁנָ֖ה יִהְיֶ֣ה עִמּ֑וֹ לֹֽא־יִרְדֶּ֥נּֽוּ בְּפֶ֖רֶךְ לְעֵינֶֽיךָ׃", "onk": "כַּאֲגִיר שְׁנָא בִּשְׁנָא יְהֵי עִמֵּיהּ לָא יִפְלַח בֵּיהּ בְּקַשְׁיוּ לְעֵינָיךְ:", "onk_en": "As a hired hand [working] on a yearly basis shall he be considered with him; he shall not rule over him [<b>make him work<\/b>] to crush him before your eyes.", "pj": "הֵי כְּאָגִיר שְׁנָא בִּשְׁנָא יְהֵי עִמֵיהּ לָא יְשַׁעְבֵּיד בֵּיהּ בְּקַשְׁיוּ וְאַנְתְּ חָמֵי לֵיהּ", "pj_en": "As a hireling by the year shall he be with him, and his master shall not make him to serve with rigour while thou see it.", "tj": "", "tj_en": "", "rashi": "<b>לא ירדנו בפרך לעיניך.<\/b> כְּלוֹמַר וְאַתָּה רוֹאֶה (ספרא):", "rashi_en": "לא ירדנו בפרך לעיניך HE SHALL NOT RULE WITH RIGOUR OVER HIM IN THY EYES — that is to say, you looking on unconcernedly (Sifra, Behar, Chapter 8 9; cf. Targum Jonathan on)."}, {"ch": 25, "v": 54, "aliyah": 7, "heb": "וְאִם־לֹ֥א יִגָּאֵ֖ל בְּאֵ֑לֶּה וְיָצָא֙ בִּשְׁנַ֣ת הַיֹּבֵ֔ל ה֖וּא וּבָנָ֥יו עִמּֽוֹ׃", "onk": "וְאִם לָא יִתְפָּרַק בְּאִלֵּין וְיִפּוֹק בְּשַׁתָּא דְיוֹבֵלָא הוּא וּבְנוֹהִי עִמֵּיהּ:", "onk_en": "If he is not redeemed through these means he then goes out in the jubilee year, he, along with his children.", "pj": "וְאִין לָא יִתְפְּרַק בְּאִילֵין שְׁנַיָא וְיִפּוֹק בַר חוֹרִין בְּשַׁתָּא דְיוֹבְלָא הוּא וּבְנוֹי עִמֵיהּ", "pj_en": "But if he be not redeemed within those years, he shall go out free at the year of Jubela, he and his children with him.", "tj": "", "tj_en": "", "rashi": "<b>ואם לא יגאל באלה.<\/b> בְּאֵלֶּה הוּא נִגְאָל וְאֵינוֹ נִגְאָל בְּשֵׁשׁ (קידושין ט\"ו):<br><br><b>הוא ובניו עמו.<\/b> הַגּוֹי חַיָּב בִּמְזוֹנוֹת בָּנָיו:", "rashi_en": "ואם לא יגאל באלה AND IF HE BE NOT REDEEMED BY THESE — by these (his relatives) he may be redeemed, but he cannot be redeemed through the termination of the six-years-period of servitude as in the case of a Hebrew servant of a Hebrew master (Kiddushin 15b).<br><br>הוא ובניו עמו [HE SHALL GO OUT…] BOTH HE, AND HIS CHILDREN WITH HIM — the hèathen who acquires a Hebrew servant is bound to provide his children also with food just as is the Israelite master (cf. Rashi v. 41)."}, {"ch": 25, "v": 55, "aliyah": 7, "heb": "כִּֽי־לִ֤י בְנֵֽי־יִשְׂרָאֵל֙ עֲבָדִ֔ים עֲבָדַ֣י הֵ֔ם אֲשֶׁר־הוֹצֵ֥אתִי אוֹתָ֖ם מֵאֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "אֲרֵי דִילִי בְנֵי יִשְׂרָאֵל עַבְדִּין עַבְדַּי אִנּוּן דִּי אֲפֵּיקִית יָתְהוֹן מֵאַרְעָא דְמִצְרָיִם אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "For, Bnei Yisroel are My servants. They are My servants whom I have brought out of the land of Egypt, I am Adonoy, your God.", "pj": "אֲרוּם דִילִי הִינוּן בְּנֵי יִשְרָאֵל מִשְׁתַּעְבְּדוּן לְאוֹרַיְיתָא עַבְדַי הִינוּן דְאַפֵּיקִית יַתְהוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "For the sons of Israel are Mine, to obey My laws; servants are they whom I brought out redeemed from the land of Mizraim. I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>כי לי בני ישראל עבדים.<\/b> שְׁטָרִי קוֹדֵם:<br><br><b>אני ה' אלהיכם.<\/b> כָּל הַמְשַׁעְבְּדָן מִלְּמַטָּה כְּאִלּוּ מְשַׁעְבְּדוֹ מִלְמַעְלָה (ספרא):", "rashi_en": "כי לי מי ישראל עבדים  FOR UNTO ME THE CHILDREN OF ISRAEL ARE SERVANTS — My document (deed of purchase) is of an earlier date (cf. Rashi on v. 42).<br><br>אני ה׳ אלהיכם I AM THE LORD YOUR GOD — Whosoever enslaves thee (the Israelites) on earth enslaves, as it were, Him in Heaven (Sifra, Behar, Chapter 9 4)."}, {"ch": 26, "v": 1, "aliyah": 7, "heb": "לֹֽא־תַעֲשׂ֨וּ לָכֶ֜ם אֱלִילִ֗ם וּפֶ֤סֶל וּמַצֵּבָה֙ לֹֽא־תָקִ֣ימוּ לָכֶ֔ם וְאֶ֣בֶן מַשְׂכִּ֗ית לֹ֤א תִתְּנוּ֙ בְּאַרְצְכֶ֔ם לְהִֽשְׁתַּחֲוֺ֖ת עָלֶ֑יהָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "לָא תַעְבְּדוּן לְכוֹן טַעֲוָן וְצֶלֶם וְקָמָא לָא תְקִימוּן לְכוֹן וְאֶבֶן סָגְדָא לָא תִתְּנוּן בְּאַרְעֲכוֹן לְמִסְגֻּד עֲלַהּ אֲרֵי אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "You shall not make [<b>false<\/b>] idols for yourselves and graven images and memorial stones you shall not raise up for youselves, and a prostration stone you shall not set in your land upon which to prostrate oneself, for I am Adonoy, your God.", "pj": "לָא תַעַבְדוּן לְכוֹן טַעֲוָן וְצִילְמִין וְקַמְתִּין מְטוֹל סְגוֹדָא לָא תְקוּמוּן לְכוֹן וְאֶבֶן מְצַיָיר לָא תִתְּנוּן בְּאַרְעֲכוֹן לְמִגְחַן עֲלָהּ בְּרַם סַטְיוּ חָקִיק בְּצִיוּרִין וּדְיוֹקְנִין תְשַׁווּן בְּאַרְעִית מַקְדָשֵׁיכוֹן וְלָא לְמִסְגוֹד לָהּ אֲרוּם אֲנָא יְיָ אֱלָהָכוֹן", "pj_en": "You shall not make to you idols or images, nor erect for you statues to worship, neither a figured stone shall ye place in your land to bow yourselves toward it. Nevertheless a pavement sculptured with imagery you may set on the spot of your sanctuary, but not to worship it: I am the Lord your God.", "tj": "וְאֶבֶן דִּטְעוּ:", "tj_en": "Nor a stone for an idol.", "rashi": "<b>לא תעשו לכם אלילים.<\/b> כְּנֶגֶד זֶה הַנִּמְכָּר לְגוֹי, שֶׁלֹּא יֹאמַר הוֹאִיל וְרַבִּי מְגַלֶּה עֲרָיוֹת, אַף אֲנִי כְּמוֹתוֹ, הוֹאִיל וְרַבִּי עוֹבֵד עָ\"זָ, אַף אֲנִי כְּמוֹתוֹ, הוֹאִיל וְרַבִּי מְחַלֵּל שַׁבָּת, אַף אֲנִי כְּמוֹתוֹ, לְכָךְ נֶאֶמְרוּ מִקְרָאוֹת הַלָּלוּ; וְאַף הַפָּרָשִׁיּוֹת הַלָּלוּ נֶאֶמְרוּ עַל הַסֵּדֶר: בַּתְּחִלָּה הִזְהִיר עַל הַשְּׁבִיעִית, וְאִם חָמַד מָמוֹן וְנֶחְשַׁד עַל הַשְּׁבִיעִית, סוֹפוֹ לִמְכֹּר מִטַּלְטְלָיו, לְכָךְ סָמַךְ לָהּ וְכִי תִמְכְּרוּ מִמְכָּר — (מַה כְּתִיב בֵּיהּ? אוֹ קָנֹה מִיַּד עֲמִיתֶךָ — דָּבָר הַנִּקְנֶה מִיָּד לְיָד) — לֹא חָזַר בּוֹ, סוֹף מוֹכֵר אֲחֻזָּתוֹ, לֹא חָזַר בּוֹ, סוֹף מוֹכֵר אֶת בֵּיתוֹ, לֹא חָזַר בּוֹ, סוֹף לֹוֶה בְרִבִּית — כָּל אֵלּוּ הָאַחֲרוֹנוֹת קָשׁוֹת מִן הָרִאשׁוֹנוֹת — לֹא חָזַר בּוֹ, סוֹף מוֹכֵר אֶת עַצְמוֹ, לֹא חָזַר בּוֹ, לֹא דַיּוֹ לְיִשְׂרָאֵל אֶלָּא אֲפִלּוּ לְגוֹי:<br><br><b>ואבן משכית.<\/b> לְשׁוֹן כִּסּוּי, כְּמוֹ \"וְשַׂכֹּתִי כַפִּי\" (שמות ל\"ג), שֶׁמְּכַסִּין הַקַּרְקַע בְּרִצְפַּת אֲבָנִים:<br><br><b>להשתחות עליה.<\/b> אֲפִלּוּ לַשָּׁמַיִם, לְפִי שֶׁהִשְׁתַּחֲוָאָה בְּפִשּׁוּט יָדַיִם וְרַגְלַיִם הִיא וְאָסְרָה תוֹרָה לַעֲשׂוֹת כֵּן חוּץ מִן הַמִּקְדָּשׁ (מגילה כ\"ב):", "rashi_en": "לא תעשו לכם אלילם YE SHALL MAKE YOU NO IDOLS This command is repeated here with reference to one who has sold himself as a slave to a non-Jew in order that he should not say \"Since my master is a libertine I will be like him; since my master worships idols, I will be like him; since my master desecrates the Sabbath, I will be like hin\", on this account have these verses (v. 1 and v. 2) been stated. Indeed all these sections (these of the whole Sedrah) are stated in the sequence in which the incidents to which they refer actually occur. First Scripture warns the people about the seventh year's produce (not to do trade in them). If, however, one is covetous of money and brings himself under the constant suspicion of trading in the seventh-year fruits, he will at some time have to sell his movable property on account of his destitution. It is for this reason that Scripture put in juxtaposition to it (the“And when you make a sale [to your fellow-Jew]” (25:14)  “or make a purchase from the hand…,” something that is transferred from hand to hand). If he still does not repent, he will eventually have to sell his inheritance (25:25). If he even then does not repent, he will eventually have to sell his home, and if even then, he does not repent, he will eventually have to borrow money with interest (verses 25:35-38). Now, the later the scenario in this passage, the more severe it is [i.e., first he sells his belongings, then his property, then his home and then even borrowing with interest which is more severe than selling one’s property; (Nachalath Ya’akov) thus, the passage continues accordingly, for] if he still does not repent, he will eventually have to sell himself [to his fellow Jew as a servant] (verses 25:39-46); and [finally,] if he has still not repented, not enough that he had to be sold to his fellow Jew - but he will [be forced to sell himself] even to a non-Jew! (Kiddushin 20a)<br><br>ואבן משכית (a kind of mosaic pavement) — The word משכית is an expression denoting “covering”, similar to the verb in (Exodus 33:22) “I will cover thee (ושכותי) with my hand”. Such a mosaic is so called because people cover the ground with a pavement of stones<br><br>להשתחות עליה TO PROSTRATE YOURSELVES UPON IT, not even to the Lord, since prostration involves stretching forth of hands and feet (the highest form of adoration) and Scripture forbids doing so outside the Temple (Megillah 22b)"}, {"ch": 26, "v": 2, "aliyah": 7, "heb": "אֶת־שַׁבְּתֹתַ֣י תִּשְׁמֹ֔רוּ וּמִקְדָּשִׁ֖י תִּירָ֑אוּ אֲנִ֖י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "יָת יוֹמֵי שַׁבַּיָּא דִילִי תִטְּרוּן וּלְבֵית מַקְדְּשִׁי תְּהוֹן דָּחֲלִין אֲנָא יְיָ:", "onk_en": "You shall keep [<b>the days of<\/b>] My Shabbosos and you shall fear (revere) [<b>the House of<\/b>] My Sanctuary, I am Adonoy.", "pj": "יַת יוֹמֵי שַׁבַּיָא דִילִי תִטְרוּן וּלְבֵית מוּקְדְשִׁי תְּהוֹן אָזְלִין בִּדְחַלְתִּי אֲנָא יְיָ", "pj_en": "The days of My Sabbaths you shall keep, and walk to the house of My sanctuary in My fear; I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>אני ה'.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר:", "rashi_en": "‎'אני ה‎ I AM THE LORD, Who am faithful to pay you your reward."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
