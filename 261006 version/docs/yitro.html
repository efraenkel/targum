 also believe for ever in the words of the prophecy of thee, My servant Mosheh. And Mosheh delivered the words of the people in prayer before the Lord.", "rashi": "<b>בעב הענן.<\/b> בְּמַעֲבֵה הֶעָנָן וְזֶהוּ עֲרָפֶל:<br><br><b>וגם בך.<\/b> גַּם בַּנְּבִיאִים הַבָּאִים אַחֲרֶיךָ (מכילתא):<br><br><b>ויגד משה את דברי וגו'.<\/b> בְּיוֹם הַמָּחֳרָת, שֶׁהוּא רְבִיעִי לַחֹדֶשׁ:<br><br><b>את דברי העם וגו'.<\/b> תְּשׁוּבָה עַל דָּבָר זֶה; שָׁמַעְתִּי מֵהֶם שֶׁרְצוֹנָם לִשְׁמֹעַ מִמְּךָ, אֵינוֹ דּוֹמֶה הַשּׁוֹמֵעַ מִפִּי שָׁלִיחַ לַשּׁוֹמֵעַ מִפִּי הַמֶּלֶךְ, רְצוֹנֵנוּ לִרְאוֹת אֶת מַלְכֵּנוּ (מכילתא):", "rashi_en": "בעב הענן signifies in the thickness of the cloud, and this is the ערפל, the thick darkness mentioned in Exodus 20:18 “And Moses stepped near unto the thick darkness where God was” (Mekhilta).<br><br>וגם בך AND IN THEE ALSO [WILL THEY BELIEVE] — The word “also” implies that they will believe also in the prophets who will come after thee (Mekhilta).<br><br>ויגד משה את דברי וגו׳ AND MOSES TOLD THE WORDS OF [THE PEOPLE UNTO THE LORD] on the following day which was the fourth of the month.<br><br>את דברי העם וגו׳ THE WORDS OF THE PEOPLE etc. — He said to God: “I have heard from them a reply to this statement — that their desire is to hear the commandments from You and not from me. One who hears from the mouth of a messenger is not the same (in the same position) as one who hears directly from the mouth of the King himself. It is our wish to see our King (cf. Mekhilta)."}, {"ch": 19, "v": 10, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יְהֹוָ֤ה אֶל־מֹשֶׁה֙ לֵ֣ךְ אֶל־הָעָ֔ם וְקִדַּשְׁתָּ֥ם הַיּ֖וֹם וּמָחָ֑ר וְכִבְּס֖וּ שִׂמְלֹתָֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אִזֵיל לְוָת עַמָא וּתְזַמְנִנוּן יוֹמָא דֵין וּמְחָר וִיחַוְרוּן לְבוּשֵׁיהוֹן:", "onk_en": "Adonoy said to Moshe, “Go to the people, and sanctify [prepare] them today and tomorrow, and let them cleanse their clothing.", "pj": "וַאֲמַר יְיָ לְמשֶׁה בְּיוֹמָא רְבִיעַאָה אִיזֵיל לְוַת עַמָּא וְתִזְמְנִינוּן יוֹמָא דֵין וְיוֹם מָחְרָא וִיחַוְורוּן לְבוּשֵׁיהוֹן", "pj_en": "And the Lord said to Mosheh on the fourth day, Go unto the people, and prepare them today and tomorrow; let them wash their raiment,", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אל משה. <\/b>אם כן שמזקיקין לְדַבֵּר עמם, לך אל העם: <br><br><b>וקדשתם.<\/b> וְזִמַּנְתָּם, שֶׁיָּכִינוּ עַצְמָם הַיּוֹם וּמָחָר:", "rashi_en": "<b>Adonoy said to Moshe.<\/b> If that be so — that they make it necessary to speak to them [directly] — go to the people —<br><br>וקדשתם means AND THOU SHALT PREPARE THEM; i. e. tell them that they shall prepare themselves to-day and to-morrow (Mekhilta; cf. Onkelos)."}, {"ch": 19, "v": 11, "aliyah": 5, "heb": "וְהָי֥וּ נְכֹנִ֖ים לַיּ֣וֹם הַשְּׁלִישִׁ֑י כִּ֣י&thinsp;<b>׀<\/b> בַּיּ֣וֹם הַשְּׁלִשִׁ֗י יֵרֵ֧ד יְהֹוָ֛ה לְעֵינֵ֥י כׇל־הָעָ֖ם עַל־הַ֥ר סִינָֽי׃", "onk": "וִיהוֹן זְמִינִין לְיוֹמָא תְלִיתָאָה אֲרֵי בְּיוֹמָא תְלִיתָאָה <b>יִתְגְלִי<\/b> יְיָ לְעֵינֵי כָל עַמָא עַל טוּרָא דְסִינָי:", "onk_en": "Let them be ready for the third day, for on the third day, Adonoy will descend [<b>become revealed<\/b>] on Mount Sinai in the sight of all the people.", "pj": "וִיהוֹן זְמִינִין לְיוֹמָא תְּלִיתָאָה אֲרוּם בְּיוֹמָא תְּלִיתָאָה יִתְגְּלֵי יְיָ לְעֵינֵי כָל עַמָּא עַל טוּרָא דְסִינָי", "pj_en": "and be prepared On the third day; for on the third day the Lord will reveal Himself to the eyes of all the people, upon the Mount of Sinai.", "tj": "", "tj_en": "", "rashi": "<b>והיו נכנים.<\/b> מֻבְדָּלִים מֵאִשָּׁה (שבת פ\"ז):<br><br><b>ליום השלישי.<\/b> שֶׁהוּא שִׁשָּׁה בַחֹדֶשׁ, וּבַחֲמִישִׁי בָּנָה מֹשֶׁה אֶת הַמִּזְבֵּחַ תַּחַת הָהָר וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה – כָּל הָעִנְיָן הָאָמוּר בְּפָרָשַׁת וְאֵלֶּה הַמִּשְׁפָּטִים – וְאֵין מֻקְדָּם וּמְאֻחָר בַּתּוֹרָה:<br><br><b>לעיני כל העם.<\/b> מְלַמֵּד שֶׁלֹּא הָיָה בָהֶם סוּמָא, שֶׁנִּתְרַפְּאוּ כֻלָּם (מכילתא):", "rashi_en": "והיו נכנים AND LET THEM BE PREPARED — separated from their wives (Mekhilta; cf. Rashi on Shabbat 87a).<br><br>ליום השלישי AGAINST THE THIRD DAY, which is the sixth of the month. On the fifth Moses built the altar under the mountain and the twelve monuments — the whole narrative as is stated later on in the Sidra ואלה המשפטים (Exodus 24:4), for there is neither “earlier” nor “later” (there is no chronological order) in the Torah (Mekhilta-2).<br><br>לעיני כל העם BEFORE THE EYES (in the sight) OF ALL THE PEOPLE — This tells us that there was not a blind person amongst them — that they had all been healed of their blindness (Mekhilta)."}, {"ch": 19, "v": 12, "aliyah": 5, "heb": "וְהִגְבַּלְתָּ֤ אֶת־הָעָם֙ סָבִ֣יב לֵאמֹ֔ר הִשָּׁמְר֥וּ לָכֶ֛ם עֲל֥וֹת בָּהָ֖ר וּנְגֹ֣עַ בְּקָצֵ֑הוּ כׇּל־הַנֹּגֵ֥עַ בָּהָ֖ר מ֥וֹת יוּמָֽת׃", "onk": "וּתְתַחֵם יָת עַמָא סְחוֹר סְחוֹר לְמֵימַר אִסְתַּמָרוּ לְכוֹן מִלְמִסַק בְּטוּרָא וּלְמִקְרַב בְּסוֹפֵהּ כָּל דְיִקְרַב בְּטוּרָא אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Set bounds for the people around [the mountain], saying [to them], ‘Be careful not to go up the mountain, or [even] to touch its edge. Whoever touches the mountain will be put to death.", "pj": "וְתַתְחֵם יַת עַמָּא וִיקוּמוּן חֲזוֹר חֲזוֹר לְטוּרָא לְמֵימָר הֲווֹ זְהִירִין מִלְמֵיסַק בְּהַר וּלְמִקְרַב בְּסַיְיפֵיהּ כָּל דְּיִקְרַב בְּטַוְורָא אִתְקְטָלָא יִתְקְטֵיל", "pj_en": "And thou shalt set limits for the people that they may stand round about the mountain, and shalt say, Beware that you ascend not the mount, nor come near its confines; whoever cometh nigh the mount will be surely put to death.", "tj": "", "tj_en": "", "rashi": "<b>והגבלת.<\/b> קְבַע לָהֶם תְּחוּמִין לְסִימָן, שֶׁלֹּא יִקְרְבוּ מִן הַגְּבוּל וָהָלְאָה:<br><br><b>לאמר.<\/b> הַגְּבוּל אוֹמֵר לָהֶם הִשָּׁמְרוּ מֵעֲלוֹת מִכָּאן וּלְהָלְאָה, וְאַתָּה הַזְהִירֵם עַל כָּךְ:<br><br><b>ונגע בקצהו.<\/b> אֲפִלּוּ בְקָצֵהוּ:", "rashi_en": "והגבלת AND THOU SHALT SET BOUNDS — set boundary marks for them as a sign that they should not approach the mountain from the boundary and beyond.<br><br>לאמר SAYING — The boundary says to them, “Take care not to ascend from here and further on” and you, too, admonish them regarding this.<br><br>ונגע בקצהו OR TOUCH THE EXTREMITY THEREOF — i. e. even the extremity thereof."}, {"ch": 19, "v": 13, "aliyah": 5, "heb": "לֹא־תִגַּ֨ע בּ֜וֹ יָ֗ד כִּֽי־סָק֤וֹל יִסָּקֵל֙ אוֹ־יָרֹ֣ה יִיָּרֶ֔ה אִם־בְּהֵמָ֥ה אִם־אִ֖ישׁ לֹ֣א יִחְיֶ֑ה בִּמְשֹׁךְ֙ הַיֹּבֵ֔ל הֵ֖מָּה יַעֲל֥וּ בָהָֽר׃", "onk": "לָא תִקְרַב בֵּהּ יְדָא אֲרֵי אִתְרְגָמָא יִתְרְגֵם אוֹ אִשְׁתְּדָאָה יִשְׁתְּדִי אִם בְּעִירָא אִם אֱנָשָׁא לָא יִתְקַיָם בְּמֵיגַד שׁוֹפָרָא אִנוּן מְרָשָׁן לְמִסַק בְּטוּרָא:", "onk_en": "Do not touch him [with your] hand, for he will be stoned or cast down. Neither man or beast will be allowed to live. When the [ram’s] horn is sounded with a long blast, they will [then] be permitted to go up on the mountain.”", "pj": "לָא תִקְרַב בֵּיהּ יְדָא אֲרוּם יִתְרְגָמָא יִתְרְגֵם בְּאַבְנָא בַרְדָא אוֹ גִירִין דְּאֵשָׁא יִדְרְקוּן בֵּיהּ אִין בְּעִירָא אִין אֵינָשָׁא לָא יִתְקַיֵּים בְּרַם בְּמֵיגַד קַל שׁוֹפְרָא הִינוּן מַרְשַׁן לְמֵיסַק בְּטַוְורָא", "pj_en": "Touch it not with the hand; for he will be stoned with hailstone, or be pierced with arrows of fire; whether beast or man, he will not live. But when the voice of the trumpet is heard, they may go up (forwards) towards the mount.", "tj": "לָא תִקְרַב בֵּיהּ יַד אֱנַשׁ אֲרוּם מִתְרְגָמָא יִתְרְגֵם אוֹ גִירֵי דְאֵשָׁא יִתְקַשְׁתּוּן בֵּיהּ אִי בְּעִיר אִי גְבַר לָא יְחֵי בְּמִתְקְעָה דְשִׁיפּוּרָא אִינוּן יִסְקוּן לְטוּרָא:", "tj_en": "No man shall touch it with the hand; for stoned he will be stoned, or fiery arrows will flee against him; whether beast or man, he will not live. When the trumpet soundeth, they may go up toward the mountain.", "rashi": "<b>ירה יירה.<\/b> מִכָּאן לַנִּסְקָלִין שֶׁהֵם נִדְחִין לְמַטָּה מִבֵּית הַסְּקִילָה שֶׁהָיָה גָּבוֹהַּ שְׁתֵּי קוֹמוֹת (סנהדרין מ\"ה):<br><br><b>יירה.<\/b> יֻשְׁלַךְ לְמַטָּה לָאָרֶץ, כְּמוֹ \"יָרָה בַיָּם\":<br><br><b>במשך היבל.<\/b> כְּשֶׁיִּמְשֹׁךְ הַיּוֹבֵל קוֹל אָרֹךְ, הוּא סִימָן סִלּוּק שְׁכִינָה וְהַפְסָקַת הַקּוֹל, וְכֵיוָן שֶׁאֶסְתַּלֵּק, הֵם רַשָּׁאִין לַעֲלוֹת:<br><br><b>היבל.<\/b> הוּא שׁוֹפָר שֶׁל אַיִל, שֶׁכֵּן בַּעֲרַבְיָא קוֹרִין לְדִכְרָא יוּבְלָא, וְשׁוֹפָר שֶׁל אַיִל שֶׁל יִצְחָק הָיָה (פרקי דרבי אליעזר ל\"א):", "rashi_en": "ירה יירה HE SHALL SURELY BE CAST DOWN — From this we derive the law regarding those who are sentenced to be stoned that they have to be thrown down from the place of stoning, which was a spot of the height of twice a man’s stature (Sanhedrin 45a).<br><br>יירה means HE SHALL BE THROWN BELOW to the ground, the word being similar to, (Exodus 15:4) “He hath cast down (ירה) into the sea”.<br><br>במשך היבל WHEN THE RAM’S HORN SOUNDETH LONG — when the ram’s horn draws out a long sound that is a sign of the departure of the Shechina and that the Divine voice is about to cease, and as soon as “I” shall depart they shall be permitted to ascend [i. e. המה יעלו בהר is not obligatory, signifying, “they shall go up”, but it is permissive] (Mekhilta).<br><br>היבל — This denotes a ram’s horn, for so do they term, a ram in Arabia — יובלא (corresponding to the Hebrew יובל) (Rosh Hashanah 26a). The horn used here was that of Isaac’s ram (Pirkei DeRabbi Eliezer 31)."}, {"ch": 19, "v": 14, "aliyah": 5, "heb": "וַיֵּ֧רֶד מֹשֶׁ֛ה מִן־הָהָ֖ר אֶל־הָעָ֑ם וַיְקַדֵּשׁ֙ אֶת־הָעָ֔ם וַֽיְכַבְּס֖וּ שִׂמְלֹתָֽם׃", "onk": "וּנְחַת משֶׁה מִן טוּרָא לְוָת עַמָא וְזַמִין יָת עַמָא <b>וְחַוָרוּ<\/b> לְבוּשֵׁיהוֹן:", "onk_en": "Moshe went down from the mountain to the people. He sanctified the people, and they immersed [<b>washed<\/b>] [themselves and] their clothing.", "pj": "וּנְחַת משֶׁה בְּיוֹמָא הַהוּא לְוַת עַמָּא וְזַמִּין יַת עַמָּא וְחַוָּרוּ לְבוּשֵׁיהוֹן", "pj_en": "And Mosheh went down that day to the people, and prepared the people, and they blanched their clothes.", "tj": "", "tj_en": "", "rashi": "<b>מן ההר אל העם.<\/b> מְלַמֵּד שֶׁלֹּא הָיָה מֹשֶׁה פוֹנֶה לַעֲסָקָיו, אֶלָּא מִן הָהָר – אֶל הָעָם (מכילתא):", "rashi_en": "מן ההר אל העם [AND MOSES WENT DOWN] FROM THE MOUNTAIN UNTO THE PEOPLE —This tells us that Moses did not betake himself first to his personal concerns but went direct from the mountain to the people (Mekhilta)."}, {"ch": 19, "v": 15, "aliyah": 5, "heb": "וַיֹּ֙אמֶר֙ אֶל־הָעָ֔ם הֱי֥וּ נְכֹנִ֖ים לִשְׁלֹ֣שֶׁת יָמִ֑ים אַֽל־תִּגְּשׁ֖וּ אֶל־אִשָּֽׁה׃", "onk": "וַאֲמַר לְעַמָא הֱווֹ זְמִינִין לִתְלָתָא יוֹמִין לָא תִקְרְבוּן לְצַד אִתְּתָא:", "onk_en": "He said to the people, “Be ready by the end of three days. Do not come near a woman.", "pj": "וַאֲמַר לְעַמָּא הֲווֹ זְמִינִין לִתְלָתֵי יוֹמִין לָא תִקְרְבוּן לְתַשְׁמִישׁ דְעָרִיס", "pj_en": "And he said to the people, Be ready for the third day; abstain from the marriage-bed.", "tj": "וַאֲמַר לְעַמָּא הֲווֹ מְזַמְנִין לִתְלָתָא יוֹמִין לָא תִקְרְבוּן לְתַשְׁמִישׁ דְּעַרְסָא:", "tj_en": "And he said to the people, Be ready for the third day; abstain from the marriage-bed.", "rashi": "<b>היו נכנים לשלשת ימים.<\/b> לְסוֹף ג' יָמִים, הוּא יוֹם רְבִיעִי, שֶׁהוֹסִיף מֹשֶׁה יוֹם אֶחָד מִדַּעְתּוֹ כְּדִבְרֵי רַבִּי יוֹסֵי, וּלְדִבְרֵי הָאוֹמֵר בְּשִׁשָּׁה בַחֹדֶשׁ נִתְּנוּ עֲשֶׂרֶת הַדִּבְּרוֹת, לֹא הוֹסִיף מֹשֶׁה כְלוּם, וְלִשְׁלֹשֶׁת יָמִים כְּמוֹ לַיּוֹם הַשְּׁלִישִׁי:<br><br><b>אל תגשו אל אשה.<\/b> כָּל ג' יָמִים הַלָּלוּ, כְּדֵי שֶׁיִּהְיוּ הַנָּשִׁים טוֹבְלוֹת לַיּוֹם הַשְּׁלִישִׁי וְתִהְיֶינָה טְהוֹרוֹת לְקַבֵּל תּוֹרָה, שֶׁאִם יְשַׁמְּשׁוּ תּוֹךְ ג' יָמִים שֶׁמָּא תִפְלֹט הָאִשָּׁה שִׁכְבַת זֶרַע לְאַחַר טְבִילָתָהּ וְתַחֲזֹר וְתִטַּמֵּא, אֲבָל מִשֶּׁשָּׁהֲתָה ג' יָמִים, כְּבָר הַזֶּרַע מַסְרִיחַ וְאֵינוֹ רָאוּי לְהַזְרִיעַ, וְטָהוֹר מִלְּטַמֵּא אֶת הַפּוֹלֶטֶת (שבת פ\"ו):", "rashi_en": "היו נכנים לשלשת ימים means be ready by the end of three days, that is, by the fourth day — for Moses added a day of his own accord to the time appointed by God. This is the opinion of Rabbi José. But according to the opinion of him who says that the Ten Commandments were given on the sixth of the month Moses did not add anything, and the words לשלשת ימים do not signify after three days but mean the same as ליום השלישי (v. 11), i. e. by three days (cf. Shabbat 86b-87a).<br><br>אל תגשו אל אשה DO NOT GO NEAR A WOMAN during the whole of these three days, this was in order that the women may immerse themselves on the third day and be pure to receive the Torah. If they have relations within the three days, the woman could [involuntarily] expel semen after her immersion and become unclean again. After three days have elapsed, however, the semen has already become putrid and is no longer capable of fertilization, so it is pure from contaminating the woman who expels it. (cf. Shabbat 86a)"}, {"ch": 19, "v": 16, "aliyah": 5, "heb": "וַיְהִי֩ בַיּ֨וֹם הַשְּׁלִישִׁ֜י בִּֽהְיֹ֣ת הַבֹּ֗קֶר וַיְהִי֩ קֹלֹ֨ת וּבְרָקִ֜ים וְעָנָ֤ן כָּבֵד֙ עַל־הָהָ֔ר וְקֹ֥ל שֹׁפָ֖ר חָזָ֣ק מְאֹ֑ד וַיֶּחֱרַ֥ד כׇּל־הָעָ֖ם אֲשֶׁ֥ר בַּֽמַּחֲנֶֽה׃", "onk": "וַהֲוָה בְיוֹמָא תְלִיתָאָה בְּמֶהֱוֵי צַפְרָא וַהֲוָה קָלִין וּבַרְקִין וַעֲנָנָא תַקִיף עַל טוּרָא וְקַל שׁוֹפָרָא תַּקִיף לַחֲדָא וְזָע כָּל עַמָא דִי בְמַשְׁרִיתָא:", "onk_en": "It was on the third day, in the morning, that there was thunder and lightning. A heavy cloud was on the mountain, and there was a very loud sound of the shofar. All the people in the camp trembled.", "pj": "וַהֲוָה בְּיוֹמָא תְּלִיתָאָה בְּשִׁיתָּא בְּיַרְחָא בְּעִידוֹנֵי צַפְרָא וַהֲוָה קָלִין דִּרְעֵים וּבְרָקִים וַעֲנָנָא תַּקִּיף קְטִיר עַל טַוְורָא וְקַל שׁוֹפָרָא תַקִּיף לַחֲדָא וְזַע כָּל עַמָּא דִי בְּמַשְׁרִיתָא", "pj_en": "And it was on the third day, on the sixth of the month, in the time of the morning, that on the mountain there were voices of thunders, and lightnings, and mighty clouds of smoke, and a voice of a trumpet exceeding loud; and all the people in the camp trembled.", "tj": "", "tj_en": "", "rashi": "<b>בהית הבקר.<\/b> מְלַמֵּד שֶׁהִקְדִּים עַל יָדָם, מַה שֶּׁאֵין דֶּרֶךְ בָּשָׂר וָדָם לַעֲשׂוֹת כֵּן – שֶיְּהֵא הָרַב מַמְתִּין לַתַּלְמִיד; וְכֵן מָצִינוּ \"קוּם צֵא אֶל הַבִּקְעָה, וָאָקוּם וָאֵצֵא אֶל הַבִּקְעָה וְהִנֵּה שָׁם כְּבוֹד ה' עֹמֵד\" (יחזקאל ג'):", "rashi_en": "בהיות הבקר lit., WHEN IT WAS BEING MORNING — This phrase tells us that He was there before them at the place of the Divine Revelation, something which it is not customary for human beings to do — that the teacher should await the arrival of his disciple. A similar instance we find in Scripture (Ezekiel 3:22, 23): “[God said unto me]. Arise, go forth into the plain, [and I will there speak with thee]. Then I arose, and went forth into the plain; and, behold the glory of the Lord stood there already” (Midrash Tanchuma, Ki Tisa 15; cf. Nedarim 8a)."}, {"ch": 19, "v": 17, "aliyah": 5, "heb": "וַיּוֹצֵ֨א מֹשֶׁ֧ה אֶת־הָעָ֛ם לִקְרַ֥את הָֽאֱלֹהִ֖ים מִן־הַֽמַּחֲנֶ֑ה וַיִּֽתְיַצְּב֖וּ בְּתַחְתִּ֥ית הָהָֽר׃", "onk": "וְאַפֵּיק משֶׁה יָת עַמָא לְקַדָמוּת <b>מֵימְרָא<\/b> דַיְיָ מִן מַשְׁרִיתָא וְאִתְעַתָּדוּ בְּשִׁפּוֹלֵי טוּרָא:", "onk_en": "Moshe brought the people toward [the Divine Presence of] [<b>the Word of<\/b>] God, [leading them] out of the camp. They stood at the foot of the mountain.", "pj": "וְאַנְפֵּיק משֶׁה יַת עַמָּא לִקְדָמוּת שְׁכִינְתָּא דַיְיָ מִן מַשְׁרִיתָא וּמִן יַד תָּלִישׁ מָארֵי עַלְמָא יַת טַוְורָא וְזַקְפֵיהּ בְּאַוִירָא וַהֲוָה זַיֵיג הֵי כְּאִסְפַּקְלַרְיָא וְאִתְעַתָּדוּ תְּחוֹתֵי טַוְורָא", "pj_en": "And Mosheh brought forth the people from the camp to meet the glorious Presence of the Lord; and suddenly the Lord of the world uprooted the mountain, and lifted it in the air, and it became luminous as a beacon, and they stood beneath the mountain.", "tj": "", "tj_en": "", "rashi": "<b>לקראת האלהים.<\/b> מַגִּיד שֶׁהַשְּׁכִינָה יָצְאָה לִקְרָאתָם כְּחָתָן הַיּוֹצֵא לִקְרַאת כַּלָּה, וְזֶהוּ שֶׁאָמַר ה' מִסִּינַי בָּא (דברים ל\"ג), וְלֹא נֶאֱמַר לְסִינַי בָּא (מכילתא):<br><br><b>בתחתית ההר.<\/b> לְפִי פְשׁוּטוֹ בְּרַגְלֵי הָהָר; וּמִדְרָשׁוֹ שֶׁנִּתְלַשׁ הָהָר מִמְּקוֹמוֹ וְנִכְפָּה עֲלֵיהֶם כְּגִיגִית (שבת פ\"ח):", "rashi_en": "לקראת האלהים [AND MOSES BROUGHT FORTH THE PEOPLE …] TO MEET GOD — This (the word לקראת, “to meet”, which is used when two persons are approaching one another) tells us that the Shechina was going forth to meet them, as a bridegroom who goes forth to meet his bride. This is what Scripture means when it says, (Deuteronomy 33:2) “The Lord came from Sinai”, and it is not said, “[The Lord came to Sinai” (Mekhilta).<br><br>בתחתית ההר AT THE NETHER PART OF THE MOUNTAIN — According to its literal meaning this signifies “at the foot of the mountain”. But a Midrashic explanation is, that the mountain was plucked up from its place and was arched over them as a cask, so that they were standing בתחתית beneath (under) the mountain itself (Mekhilta; Shabbat 88a)."}, {"ch": 19, "v": 18, "aliyah": 5, "heb": "וְהַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔וֹ מִ֠פְּנֵ֠י אֲשֶׁ֨ר יָרַ֥ד עָלָ֛יו יְהֹוָ֖ה בָּאֵ֑שׁ וַיַּ֤עַל עֲשָׁנוֹ֙ כְּעֶ֣שֶׁן הַכִּבְשָׁ֔ן וַיֶּחֱרַ֥ד כׇּל־הָהָ֖ר מְאֹֽד׃", "onk": "וְטוּרָא דְסִינַי תָּנַן כֻּלֵהּ מִן קֳדָם <b>דְאִתְגְלִי<\/b> עֲלוֹהִי יְיָ בְּאֶשָׁתָא וּסְלִיק תְּנָנֵהּ כִּתְנָנָא דְאַתּוּנָא וְזָע כָּל טוּרָא לַחֲדָא:", "onk_en": "The entire Mount Sinai was enveloped with smoke, for Adonoy had descended [<b>become revealed<\/b>] upon it in fire. Its smoke rose like the smoke of a [lime] furnace and the entire mountain trembled violently.", "pj": "וְטַוְורָא דְסִינַי תָנֵין כּוּלֵיהּ מִן בִּגְלַל דְּאַרְכִין לֵיהּ שְׁמַיָא וְאִתְגְּלֵי עֲלוֹי בְּאֵישָׁא מְצַלְהֲבָא וְסָלֵיק קוּטְרֵיהּ הֵי כְקוּטְרָא דְאַתּוּנָא וְזַע כָּל טַוְורָא לַחֲדָא", "pj_en": "And all the mount of Sinai was in flame; for the heavens had overspread it, and He was revealed over it in flaming fire, and the smoke went up as the smoke of a furnace, and all the mountain quaked greatly.", "tj": "וְטוּרָא דְסִינַי עָטַר כּוּלֵיהּ מִן קֳדָם דְּאִתְגְּלֵי עֲלוֹי יְקַר שְׁכִינְתָּא דַיְיָ בְּשַׁלְהֵיבָא דְאֶשְׁתָּא:", "tj_en": "And all mount Sinai sent up smoke, because the glory of the Shekinah of the Lord was revealed upon it in flame of fire.", "rashi": "<b>עשן כלו.<\/b> אֵין עָשַׁן זֶה שֵׁם דָּבָר, שֶׁהֲרֵי נָקוּד הַשִּׁי\"ן פַּתָּח, אֶלָּא לְשׁוֹן פָּעַל כְּמוֹ אָמַר, שָׁמַר, שָׁמַע, לְכָךְ תַּרְגּוּמוֹ תְּנַן כֻּלֵּהּ, וְלֹא תִרְגֵּם תְּנָנָא, וְכָל עָשָׁן שֶׁבַּמִּקְרָא נְקוּדִים קָמָץ מִפְּנֵי שֶׁהֵם שֵׁם דָּבָר:<br><br><b>הכבשן.<\/b> שֶׁל סִיד; יָכוֹל כְּכִבְשָׁן זֶה וְלֹא יוֹתֵר, תַּ\"לֹ בּוֹעֵר בָּאֵשׁ עַד לֵב הַשָּׁמַיִם (דברים ד'), וּמַה תַּ\"לֹ כִּבְשָׁן? לְשַׂבֵּר אֶת הָאֹזֶן מַה שֶּׁהִיא יְכוֹלָה לִשְׁמֹעַ – נוֹתֵן לַבְּרִיּוֹת סִימָן הַנִּכָּר לָהֶם; כַּיּוֹצֵא בּוֹ כְּאַרְיֵה יִשְׁאָג (הושע י\"א), וְכִי מִי נָתַן כֹּחַ בָּאֲרִי אֶלָּא הוּא? וְהַכָּתוּב מוֹשְׁלוֹ כְּאַרְיֵה, אֶלָּא אָנוּ מְכַנִּין וּמְדַמִּין אוֹתוֹ לִבְרִיּוֹתָיו כְּדֵי לְשַׂבֵּר אֶת הָאֹזֶן מַה שֶּׁיְּכוֹלָה לִשְׁמֹעַ; כַּיּוֹצֵא בוֹ וְקוֹלוֹ כְּקוֹל מַיִם רַבִּים (יחזקאל מ\"ג), וְכִי מִי נָתַן קוֹל לַמַּיִם אֶלָּא הוּא? וְאַתָּה מְכַנֶּה אוֹתוֹ, לְדַמּוֹתוֹ לִבְרִיּוֹתָיו – כְּדֵי לְשַׂבֵּר אֶת הָאֹזֶן (מכילתא):", "rashi_en": "עשן כלו WAS ALTOGETHER ON A SMOKE — This word עָשַׁן is not a noun, because the ש is punctuated with Patach, but it has the meaning of “it was doing something”, similar to and אָמַר and שָׁמַר and שָׁמַע. On this account, its translation in the Targum is תָּנֵן כֻּלֵּהּ “it was altogether giving forth smoke” (תָּנֵן is a verb corresponding with the Hebrew עָשַׁן). and it does not translate it by תְּנָנָא (a noun denoting smoke, corresponding to Hebrew עָשָׁן). But wherever else the word עשן occurs in Scripture it is punctuated with Kametz because it is a noun.<br><br>הכבשן A FURNACE of lime (i. e. in which lime is burnt and which emits vast quantities of smoke). One might think that the mountain emitted smoke only like such a furnace and not to a greater degree! Scripture therefore states in another passage, (Deuteronomy 4:11) “[And the mountain] burned with fire unto the very midst of the heavens”. Then what reason is there for stating that it smoked only like a furnace? This is said in order to make intelligible to the human ear as much as it can understand: Scripture gives human beings an example (a comparison) which is well-known to them. A similar case is, (Hosea 11:10) “As a lion does He (God) roar”. But who gave the lion power if not He, and yet Scripture compares him only to a lion! But the reason is that we describe Him by comparing Him to His creatures in order to make intelligible to the human ear as much as it can understand. A similar example is: (Ezekiel 43:2) “And His voice was like the sound of many waters”. But who gave the waters a thunderous sound except He, and yet you describe Him by comparing Him to His handiwork — it is to make it intelligible to the human ear (Mekhilta)."}, {"ch": 19, "v": 19, "aliyah": 5, "heb": "וַֽיְהִי֙ ק֣וֹל הַשֹּׁפָ֔ר הוֹלֵ֖ךְ וְחָזֵ֣ק מְאֹ֑ד מֹשֶׁ֣ה יְדַבֵּ֔ר וְהָאֱלֹהִ֖ים יַעֲנֶ֥נּוּ בְקֽוֹל׃", "onk": "וַהֲוָה קַל שׁוֹפָרָא אָזֵל וְתָקֵף לַחֲדָא משֶׁה מְמַלֵל וּמִן <b>קֳדָם<\/b> יְיָ מִתְעֲנֵי לֵהּ בְקָל:", "onk_en": "The sound of the shofar grew louder and louder. Moshe spoke and [<b>from before<\/b>] God responded to him [<b>he was answered<\/b>] with [His] voice.", "pj": "וְהַוָּה קַל שׁוֹפָרָא אָזִיל וְתַקִּיף לַחֲדָא משֶׁה הֲוָה מְמַלֵּיל וּמִן קֳדָם יְיָ הֲוָה מִתְעַנֵי בְקַל נָעִים וּמְשַׁבַּח וּנְעִימָתָא מַלְיָא", "pj_en": "And the voice of the trumpet went forth, and grew stronger: (then) Mosheh spake, and was answered from before the Lord with a gracious and majestic voice, and with pleasant and gracious words.", "tj": "", "tj_en": "", "rashi": "<b>הולך וחזק מאד.<\/b> מִנְהַג הֶדְיוֹט כָּל זְמַן שֶׁהוּא מַאֲרִיךְ לִתְקֹעַ קוֹלוֹ מַחֲלִישׁ וְכוֹהֶה, אֲבָל כָּאן הוֹלֵךְ וְחָזֵק מְאֹד, וְלָמָּה כָּךְ מִתְּחִלָּה? לְשַׂבֵּר אָזְנֵיהֶם מַה שֶּׁיְּכוֹלִין לִשְׁמֹעַ:<br><br><b>משה ידבר.<\/b> כְּשֶׁהָיָה מֹשֶׁה מְדַבֵּר וּמַשְׁמִיעַ הַדִּבְּרוֹת לְיִשְׂרָאֵל – שֶׁהֲרֵי לֹא שָׁמְעוּ מִפִּי הַגְּבוּרָה אֶלָּא אָנֹכִי וְלֹא יִהְיֶה לְךָ – וְהַקָּבָּ\"ה מְסַיְּעוֹ לָתֵת בּוֹ כֹחַ לִהְיוֹת קוֹלוֹ מַגְבִּיר וְנִשְׁמָע (שם):<br><br><b>יעננו בקול.<\/b> יַעֲנֶנּוּ עַל דְּבַר הַקּוֹל, כְּמוֹ אֲשֶׁר יַעֲנֶה בָאֵשׁ (מלכים א י\"ח) – עַל דְּבַר הָאֵשׁ, לְהוֹרִידוֹ:", "rashi_en": "הולך וחזק מאד WAXED LOUDER AND LOUDER — The manner of an ordinary person is that the longer he continues to blow a trumpet the sound he produces becomes weaker and fainter; but in this instance it went on getting stronger. And why was it thus (i. e. not so loud) at first? To make their ears receptive to as much as they were able to hear (Mekhilta).<br><br>משה ידבר MOSES SPAKE — When Moses was speaking and proclaiming the Commandments to Israel — for they heard from the Almighty’s mouth only the Commandments אנכי and לא יהיה לך, whilst the others were promulgated by Moses — then the Holy One, blessed be He, assisted him by giving him strength so that his voice might be powerful and so become audible (Mekhilta).<br><br>יעננו בקול signifies He answered him in respect to (ב) the voice, just as (1 Kings 18:24) “He that answereth באש” — “in respect to the fire” — i. e. by causing fire to descend. (So here: God answered Moses’ petition that his voice might become audible to the vast concourse of people)."}, {"ch": 19, "v": 20, "aliyah": 6, "heb": "וַיֵּ֧רֶד יְהֹוָ֛ה עַל־הַ֥ר סִינַ֖י אֶל־רֹ֣אשׁ הָהָ֑ר וַיִּקְרָ֨א יְהֹוָ֧ה לְמֹשֶׁ֛ה אֶל־רֹ֥אשׁ הָהָ֖ר וַיַּ֥עַל מֹשֶֽׁה׃", "onk": "<b>וְאִתְגְלִי<\/b> יְיָ עַל טוּרָא דְסִינַי לְרֵישׁ טוּרָא וּקְרָא יְיָ לְמשֶׁה לְרֵישׁ טוּרָא וּסְלִיק משֶׁה:", "onk_en": "Adonoy descended [<b>became revealed<\/b>] on Mount Sinai, to the top of the mountain, and Adonoy called to Moshe to come up to the top of the mountain, and Moshe went up.", "pj": "וְאִתְגְּלֵי יְיָ עַל טַוְורָא דְסִינַי עַל רֵישׁ טַוְורָא וּקְרָא יְיָ לְמשֶׁה לְרֵישׁ טַוְורָא וּסְלֵיק משֶׁה", "pj_en": "And the Lord revealed Himself on mount Sinai upon the summit of the mountain, and the Lord called unto Mosheh from the summit of the mount, and Mosheh went up.", "tj": "", "tj_en": "", "rashi": "<b>וירד ה' על הר סיני.<\/b> יָכוֹל יָרַד עָלָיו מַמָּשׁ, תַּ\"לֹ כִּי מִן הַשָּׁמַיִם דִּבַּרְתִּי עִמָּכֶם (שמות כ'), מְלַמֵּד שֶׁהִרְכִּין שָׁמַיִם הָעֶלְיוֹנִים וְהַתַּחְתּוֹנִים וְהִצִּיעָן עַל גַּבֵּי הָהָר כְּמַצָּע עַל הַמִּטָּה וְיָרַד כִּסֵּא הַכָּבוֹד עֲלֵיהֶם (מכילתא):", "rashi_en": "וירד ה׳ על הר סיני AND THE LORD CAME DOWN UPON MOUNT SINAI — One might think, then, that He actually came down upon it! Therefore it states, (Exodus 20:19) “Ye have seen that I have spoken to you from heaven”. These two texts together teach us that He bent down the upper and lower heavens and spread them out over the top of the mountain like a bed-spread over a bed and the throne of Glory descended upon it (Mekhilta)."}, {"ch": 19, "v": 21, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּעָ֑ם פֶּן־יֶהֶרְס֤וּ אֶל־יְהֹוָה֙ לִרְא֔וֹת וְנָפַ֥ל מִמֶּ֖נּוּ רָֽב׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה חוּת אַסְהֵיד בְּעַמָא דִילְמָא יְפַגְרוּן <b>קֳדָם<\/b> יְיָ לְמֶחֱזֵי וְיִפֵּל מִנְהוֹן סַגִי:", "onk_en": "Adonoy said to Moshe, “Go down and warn the people lest they break through [the boundary] toward [<b>before<\/b>] [the Presence of] Adonoy in order to see; and many [of them] will die.", "pj": "וַאֲמַר יְיָ לְמשֶׁה חוּת אַסְהִיד בְּעַמָּא דִּלְמָא יְכַוְּונוּן קֳדָם יְיָ לְאִסְתַּכְּלָא וְיַפִּיל מִנְהוֹן רַב דִּבְהוֹן", "pj_en": "And the Lord said to Mosheh, Descend, and warn the people, lest they come directly before the Lord to gaze, and many of them fall.", "tj": "וְיִפּוֹל מִנְהוֹן אוֹכְלוּסִין סַגְיָין:", "tj_en": "", "rashi": "<b>העד בעם.<\/b> הַתְרֵה בָהֶם שֶׁלֹּא לַעֲלוֹת בָּהָר:<br><br><b>פן יהרסו וגו'.<\/b> שֶׁלֹּא יֶהֶרְסוּ אֶת מַצָּבָם, עַל יְדֵי שֶׁתַּאֲוָתָם אֶל ה', לִרְאוֹת, וְיִקְרְבוּ לְצַד הָהָר:<br><br><b>ונפל ממנו רב.<\/b> כָּל מַה שֶּׁיִּפֹּל מֵהֶם, וַאֲפִלּוּ הוּא יְחִידִי, חָשׁוּב לְפָנַי רָב (שם):<br><br><b>פן יהרסו.<\/b> כָּל הֲרִיסָה מַפְרֶדֶת אֲסִיפַת הַבִּנְיָן, אַף הַנִּפְרָדִין מִמַּצַּב אֲנָשִׁים הוֹרְסִים אֶת הַמַּצָּב:", "rashi_en": "העד בעם signifies, WARN THEM not to ascend the mountain.<br><br>פן יהרסו lit., LEST THEY BREAK DOWN — warn them that they shall not break down their post because that their longing is אל ה׳ TO THE LORD לראות TO SEE Him and they therefore would approach nearer towards the mountain,<br><br>ונפל ממנו רב AND MANY OF THEM FALL — whatever of them it may be that falls, even though it be a single person only, will be regarded by Me as רב, many (cf. Mekhilta).<br><br>פן יהרסו — The term הרס, “breaking down”, always denotes the separation of the collection of parts that constitute the edifice. Similarly those who depart from the position which people have taken up break down that position."}, {"ch": 19, "v": 22, "aliyah": 6, "heb": "וְגַ֧ם הַכֹּהֲנִ֛ים הַנִּגָּשִׁ֥ים אֶל־יְהֹוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן־יִפְרֹ֥ץ בָּהֶ֖ם יְהֹוָֽה׃", "onk": "וְאַף כָּהֲנַיָא דִקְרִיבִין <b>לְשַׁמָשָׁא קֳדָם<\/b> יְיָ יִתְקַדְשׁוּן דִילְמָא <b>יִקְטוֹל<\/b> בְּהוֹן יְיָ:", "onk_en": "Even the kohanim who [usually] come near to [<b>serve before<\/b>] Adonoy’s Presence, must be sanctified, lest Adonoy send destruction among [<b>kill<\/b>] them.”", "pj": "וְאוּף כַּהֲנַיָא דִּקְרִיבִין לְשַׁמְשָׁא קֳדָם יְיָ יִתְקַדְּשׁוּן דִּלְמָא יִקְטוֹל בְּהוֹן יְיָ", "pj_en": "The priests, also, who approach to minister before the Lord, must be sanctified, lest the Lord destroy them.", "tj": "", "tj_en": "", "rashi": "<b>וגם הכהנים.<\/b> אַף הַבְּכוֹרוֹת שֶׁהָעֲבוֹדָה בָהֶם (זבחים קט\"ו):<br><br><b>הנגשים אל ה'.<\/b> לְהַקְרִיב קָרְבָּנוֹת, אַף הֵם לֹא יִסְמְכוּ עַל חֲשִׁיבוּתָם לַעֲלוֹת:<br><br><b>יתקדשו.<\/b> יִהְיוּ מְזֻמָּנִים לְהִתְיַצֵּב עַל עָמְדָּן:<br><br><b>פן יפרץ.<\/b> לְשׁוֹן פִּרְצָה; יַהֲרֹג בָּהֶם וְיַעֲשֶׂה בָהֶם פִּרְצָה:", "rashi_en": "וגם הכהנים AND THE PRIESTS ALSO — the first born sons also, through whom the sacrificial service was carried out (Zevachim 115b),<br><br>‘הנגשים אל ה WHO MAY DRAW NIGH UNTO THE LORD to offer sacrifices — let them also not rely upon their rank and ascend the mountain, but<br><br>יתקדשו LET THEM BE PREPARED to remain at their post,<br><br>פן יפרץ LEST [THE LORD] BURST FORTH — The word פרץ is of the same root and meaning as פרצה “a breach”; the sense is: He may slay some of them and thus cause a breach in their ranks."}, {"ch": 19, "v": 23, "aliyah": 6, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ אֶל־יְהֹוָ֔ה לֹא־יוּכַ֣ל הָעָ֔ם לַעֲלֹ֖ת אֶל־הַ֣ר סִינָ֑י כִּֽי־אַתָּ֞ה הַעֵדֹ֤תָה בָּ֙נוּ֙ לֵאמֹ֔ר הַגְבֵּ֥ל אֶת־הָהָ֖ר וְקִדַּשְׁתּֽוֹ׃", "onk": "וַאֲמַר משֶׁה <b>קֳדָם<\/b> יְיָ לָא יִכּוֹל עַמָא לְמִסַק לְטוּרָא דְסִינַי אֲרֵי אַתְּ אַסְהֵדְתָּ בָּנָא לְמֵימַר תַּחִים יָת טוּרָא וְקַדֵשְׁהִי:", "onk_en": "Moshe said to [<b>before<\/b>] Adonoy, “The people can not go up to Mount Sinai, for You have warned us saying, ‘Set a boundary around the mountain and sanctify it.’”", "pj": "וַאֲמַר משֶׁה קֳדָם יְיָ לָא יִכְלוּן עַמָּא לְמֵיסַק לְטַוְורָא דְסִינַי אֲרוּם אַנְתְּ אַסְהֵידְתָּא בָּנָא לְמֵימָר תָּחִים יַת טַוְורָא וְקַדְשׁוֹהִי", "pj_en": "And Mosheh said before the Lord, The people cannot come up to mount Sinai, because Thou didst instruct us, saying, Make limits to the mount, and sanctify it.", "tj": "", "tj_en": "", "rashi": "<b>לא יוכל העם.<\/b> אֵינִי צָרִיךְ לְהָעִיד בָּהֶם, שֶׁהֲרֵי מֻתְרִים וְעוֹמְדִין הֵם הַיּוֹם שְׁלֹשֶׁת יָמִים, וְלֹא יוּכְלוּ לַעֲלוֹת שֶׁאֵין לָהֶם רְשׁוּת:", "rashi_en": "לא יוכל העם THE PEOPLE CANNOT [COME UP TO MOUNT SINAI] — There is no need for me to warn them, for they have been standing under such a warning these three days, and they cannot go up for they have no permission so to do."}, {"ch": 19, "v": 24, "aliyah": 6, "heb": "וַיֹּ֨אמֶר אֵלָ֤יו יְהֹוָה֙ לֶךְ־רֵ֔ד וְעָלִ֥יתָ אַתָּ֖ה וְאַהֲרֹ֣ן עִמָּ֑ךְ וְהַכֹּהֲנִ֣ים וְהָעָ֗ם אַל־יֶֽהֶרְס֛וּ לַעֲלֹ֥ת אֶל־יְהֹוָ֖ה פֶּן־יִפְרׇץ־בָּֽם׃", "onk": "וַאֲמַר לֵהּ יְיָ אִזֵיל חוּת וְתִסַק אַתְּ וְאַהֲרֹן עִמָךְ וְכָהֲנַיָא וְעַמָא לָא יְפַגְרוּן לְמִסַק לִ<b>קֳדָם<\/b> יְיָ דִילְמָא <b>יִקְטוֹל<\/b> בְּהוֹן:", "onk_en": "Adonoy said to him, “Go down. You will then come up [again], along with Aharon. The kohanim and the people, [however,] must not break through to go up toward [<b>before<\/b>] [the Presence of] Adonoy, lest He send destruction among [<b>kill<\/b>] them.”", "pj": "וַאֲמַר לֵיהּ יְיָ אִיזֵל חוֹת וְתִיסַק אַנְתְּ וְאַהֲרן עִמָּךְ וְכַהֲנַיָא וְעַמָּא לָא יְכַוְונוּן לְמִיסוּק לְמִסְתַּכְּלָא קֳדָם יְיָ דִּילְמָא יִקְטוֹל בְּהוֹן", "pj_en": "And the Lord said to him, Go down, and then ascend, thou and Aharon with thee; but let not the, priests or the people directly come up to gaze before the Lord, lest He slay them.", "tj": "", "tj_en": "", "rashi": "<b>לך רד.<\/b> וְהָעֵד בָּהֶם שֵׁנִית, שֶׁמְּזָרְזִין אֶת הָאָדָם קֹדֶם מַעֲשֶׂה וְחוֹזְרִין וּמְזָרְזִין אוֹתוֹ בִּשְׁעַת מַעֲשֶׂה (מכילתא):<br><br><b>ועלית אתה ואהרן עמך והכהנים.<\/b> יָכוֹל אַף הֵם עִמְּךָ, תַּ\"לֹ וְעָלִיתָ אַתָּה, אֱמֹר מֵעַתָּה, אַתָּה מְחִצָּה לְעַצְמְךָ, וְאַהֲרֹן מְחִצָּה לְעַצְמוֹ, וְהַכֹּהֲנִים מְחִצָּה לְעַצְמָם – מֹשֶׁה נִגַּשׁ יוֹתֵר מֵאַהֲרֹן, וְאַהֲרֹן יוֹתֵר מִן הַכֹּהֲנִים, וְהָעָם כָּל עִקָּר אַל יֶהֶרְסוּ אֶת מַצָּבָם לַעֲלוֹת אֶל ה' (שם):<br><br><b>פן יפרץ בם.<\/b> אַעַ\"פִּ שֶׁהוּא נָקוּד חֲטַף קָמָץ אֵינוֹ זָז מִגְּזֵרָתוֹ, כָּךְ דֶּרֶךְ כָּל תֵּבָה שֶׁנְּקֻדָּתָהּ מְלָאפוּם, כְּשֶׁהִיא סְמוּכָה בָאָה בְּמַקָּף, מִשְׁתַּנֶּה הַנִּקּוּד לַחֲטַף קָמָץ:", "rashi_en": "לך רד GO, GO DOWN and warn them a second time. God said this, because the rule is that one admonishes a person before an action is to be done and then one again admonishes him at the very moment when the action is to be done (cf. (Mekhilta).<br><br>ועלית אתה ואהרן עמך והכהנים AND THOU SHALT COME UP, THOU AND AARON WITH THEE AND THE PRIESTS — One might think that they (the priests) shall also be with thee! Therefore it states “and thou shalt come up”. Consequently you must now admit that this is what God spake to him: thou hast a designated place for thyself, and Aaron a designated place for himself and they a designated place for themselves — Moses approached closer than Aaron and Aaron closer than the priests — but let the people under no circumstances break down their position to go up to the Lord (Mekhilta).<br><br>פן יפרץ בם LEST HE BURST FORTH UPON THEM — Although it (the word יִפְרָץ) is punctuated with a Chataf Kametz (our Kamets Chataf — short Kametz), it has not departed from its normal grammatical form, for thus is the way of every word which has the vowel Melopum (our חולם) in its hit syllable, that being a closed syllable: when it comes with a Makkef (a hyphen) after it the vowelling is changed to a Chataf Kametz (our short Kametz)."}, {"ch": 19, "v": 25, "aliyah": 6, "heb": "וַיֵּ֥רֶד מֹשֶׁ֖ה אֶל־הָעָ֑ם וַיֹּ֖אמֶר אֲלֵהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּנְחַת משֶׁה לְעַמָא וַאֲמַר לְהוֹן:", "onk_en": "Moshe went down to the people, and he said [this] to them.", "pj": "וּנְחַת משֶׁה מִן טַוְורָא לְוַת עַמָּא וַאֲמַר לְהוֹן קְרִיבוּ קַבִּילוּ אוֹרַיְיתָא עִם עֲשַרְתֵּי דִבְּרַיָא", "pj_en": "And Mosheh went down from the mountain to the people, and said to them, Draw nigh and hear the Law with Ten Words.", "tj": "וּנְחַת משֶׁה מִן טוּרָא לְעַמָּא וַאֲמַר לְהוֹן קְרִיבוּ וְקַבִּילוּ עֲשַרְתִּי דִּבְּרַיָא:", "tj_en": "And Mosheh went down from the mountain to the people, and said to them, Draw nigh and receive the Ten Words.", "rashi": "<b>ויאמר אלהם.<\/b> הַתְרָאָה זוֹ:", "rashi_en": "ויאמר אליהם AND HE SPOKE UNTO THEM this warning."}, {"ch": 20, "v": 1, "aliyah": 6, "heb": "וַיְדַבֵּ֣ר אֱלֹהִ֔ים אֵ֛ת כׇּל־הַדְּבָרִ֥ים הָאֵ֖לֶּה לֵאמֹֽר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּמַלִיל יְיָ יָת כָּל פִּתְגָמַיָא הָאִלֵין לְמֵימָר:", "onk_en": "Elohim spoke all these words, saying:", "pj": "וּמַלֵּיל יְיָ יַת כָּל דִּבְּרַיָא הָאִילֵין לְמֵימָר", "pj_en": "And the Lord spake all these words, saying:", "tj": "וּמַלֵּיל מֵימְרָא דַיְיָ כָּל שְׁבַח דִּבְּרַיָא הָאִילֵין לְמֵימָר:", "tj_en": "And the Word of the Lord spake all the excellency of these words saying:", "rashi": "<b>וידבר אלהים.<\/b> אֵין אֱלֹהִים אֶלָּא דַּיָּן; לְפִי שֶׁיֵּשׁ פָּרָשִׁיּוֹת בַּתּוֹרָה שֶׁאִם עֲשָׂאָן אָדָם מְקַבֵּל שָׂכָר, וְאִם לָאו אֵינוֹ מְקַבֵּל עֲלֵיהֶם פֻּרְעָנוּת, יָכוֹל אַף עֲשֶׂרֶת הַדִּבְּרוֹת כֵּן, תַּ\"לֹ וַיְדַבֵּר אֱלֹהִים – דַּיָּן לִפָּרַע (מכילתא):<br><br><b>את כל הדברים האלה.<\/b> מְלַמֵּד שֶׁאָמַר הַקָּבָּ\"ה עֲשֶׂרֶת הַדִּבְּרוֹת בְּדִבּוּר אֶחָד, מַה שֶּׁאִי אֶפְשָׁר לְאָדָם לוֹמַר כֵּן, אִם כֵּן מַה תַּ\"לֹ עוֹד אָנֹכִי וְלֹא יִהְיֶה לְךָ? שֶׁחָזַר וּפֵרֵשׁ עַל כָּל דִּבּוּר וְדִבּוּר בִּפְנֵי עַצְמוֹ (שם):<br><br><b>לאמר.<\/b> מְלַמֵּד שֶׁהָיוּ עוֹנִין עַל הֵן הֵן וְעַל לָאו לָאו (שם):", "rashi_en": "וידבר אלהים AND GOD SPAKE — The word אלהים is a term for a judge. Since there are chapters in the Torah of such a character that if a person observes the commands contained therein he will receive a reward and if he never observes them at all) he will not receive punishment on their account, one might think that the Ten Commandments are also of such a character (that no punishment will follow upon the infringement of them); therefore Scripture expressly states, “God spake” — God Who is Judge, exacting punishment (Mekhilta).<br><br>את כל הדברים האלה ALL THESE WORDS — This statement (that God spake all these words) tells us that the Holy One, blessed be He, said all these words in one utterance, something that is impossible to a human being to do — to speak in this manner. Now if this be so, why does Scripture again say the first two Commandments, אנכי and לא יהיה לך? But the explanation is that He repeated and expressly uttered each of these two commandments by itself (Mekhilta).<br><br>לאמר lit., TO SAY — This expression teaches us that they answered to that which required the reply “Yea” (אנכי) by “Yea” and to that which required the reply “Nay” (לא יהיה) by “Nay” (Mekhilta)."}, {"ch": 20, "v": 2, "aliyah": 6, "heb": "אָֽנֹכִ֖י֙ יְהֹוָ֣ה אֱלֹהֶ֑֔יךָ אֲשֶׁ֧ר הוֹצֵאתִ֛יךָ מֵאֶ֥רֶץ מִצְרַ֖יִם מִבֵּ֣֥ית עֲבָדִ֑͏ֽים׃", "onk": "אֲנָא יְיָ אֱלָהָךְ דִי אַפֵּיקְתָּךְ מֵאַרְעָא דְמִצְרַיִם מִבֵּית <b>עַבְדוּתָא<\/b>:", "onk_en": "I am Adonoy, your God, Who brought you out of the land of Egypt, from the house of slaves [<b>slavery<\/b>].", "pj": "דְּבִירָא קַדְמָאָה כַּד הֲוָה נָפִיק מִן פּוּם קוּדְשָׁא יְהֵי שְׁמֵיהּ מְבָרֵךְ הֵי כְזִיקִין וְהֵי כְבַרְקִין וְהֵי כְשַׁלְהוֹבְיָין לַמְפַּד דִּינוּר מִן יְמִנֵיהּ וְלַמְפַּד דְּאֵישָׁא מִן שְמָאלֵיהּ פָּרַח וְטַיֵּיס בְּאַוִיר שְׁמַיָא וְחָזַר וּמִתְחַמֵּי עַל מַשִּׁירְיַתְהוֹן דְּיִשְרָאֵל וְחָזַר וּמִתְחֲקֵק עַל לוּחֵי קְיָימָא דַהֲווֹן יְהִיבִין בְּכַף יְדוֹי דְמשֶׁה וּמִתְהֲפִיךְ בְּהוֹן מִן סְטַר לִסְטָר וּבְכֵן צָוַוח וְאָמַר עַמִּי בְּנֵי יִשְרָאֵל אֲנָא הוּא אֱלָהָכוֹן דִּי פְּרָקִית וְאַפֵּיקִית יַתְכוֹן פְּרִיקִין מִן אַרְעָא דְּמִצְרָאֵי מִבֵּית שִׁעְבוּד עַבְדַיָּא", "pj_en": "The first word, as it came forth from the mouth of the Holy One, whose Name be blessed, was like storms, and lightnings, and flames of fire, with a burning light on His right hand and on His left. It winged its way through the air of the heavens, and was made manifest unto the camp of Israel, and returned, and was engraven on the tables of the covenant that were given by the hand of Mosheh, and were turned in them from side to side: and then called He, and said: Sons of Israel My people, I am the Lord your God, who brought you out free from the land of Mizraim, from the house of the bondage of slaves.", "tj": "", "tj_en": "", "rashi": "<b>אשר הוצאתיך מארץ מצרים.<\/b> כְּדַאי הִיא הַהוֹצָאָה שֶׁתִּהְיוּ מְשֻׁעְבָּדִים לִי; דָּ\"אַ, לְפִי שֶׁנִּגְלָה בַיָּם כְּגִבּוֹר מִלְחָמָה וְנִגְלָה כָּאן כְּזָקֵן מָלֵא רַחֲמִים, – שֶׁנֶּאֱמַר וְתַחַת רַגְלָיו כְּמַעֲשֵׂה לִבְנַת הַסַּפִּיר (שמות כ\"ד), זוֹ הָיְתָה לְפָנָיו בִּשְׁעַת הַשִּׁעְבּוּד, וּכְעֶצֶם הַשָּׁמַיִם, מִשֶּׁנִּגְאֲלוּ – הוֹאִיל וַאֲנִי מִשְׁתַּנֶּה בְמַרְאוֹת, אַל תֹּאמְרוּ שְׁתֵּי רָשׁוּיוֹת הֵן, אָנֹכִי הוּא אֲשֶׁר הוֹצֵאתִיךָ מִמִּצְרַיִם וְעַל הַיָּם. דָּ\"אַ לְפִי שֶׁהָיוּ שוֹמְעִין קוֹלוֹת הַרְבֵּה, שֶׁנֶּאֱמַר אֶת הַקּוֹלֹת – קוֹלוֹת בָּאִין מֵאַרְבַּע רוּחוֹת וּמִן הַשָּׁמַיִם וּמִן הָאָרֶץ – אַל תֹּאמְרוּ רָשׁוּיוֹת הַרְבֵּה הֵן; וְלָמָה אָמַר לְשׁוֹן יָחִיד אֱלֹהֶיךָ? לִתֵּן פִּתְחוֹן פֶּה לְמֹשֶׁה לְלַמֵּד סָנֵגוֹרְיָא בְּמַעֲשֵׂה הָעֵגֶל, וְזֶה שֶׁאָמַר לָמָה ה' יֶחֱרֶה אַפְּךָ בְּעַמֶּךָ – לֹא לָהֶם צִוִּיתָ לֹא יִהְיֶה לָכֶם אֱלֹהִים אֲחֵרִים אֶלָּא לִי לְבַדִּי (שמות רבה):<br><br><b>מבית עבדים.<\/b> מִבֵּית פַּרְעֹה שֶׁהֱיִיתֶם עֲבָדִים לוֹ, אוֹ אֵינוֹ אוֹמֵר אֶלָּא מִבֵּית עֲבָדִים שֶׁהָיוּ עֲבָדִים לַעֲבָדִים? תַּ\"לֹ וַיִּפְדְּךָ מִבֵּית עֲבָדִים מִיַּד פַּרְעֹה מֶלֶךְ מִצְרָיִם (דברים ז'), אֱמֹר מֵעַתָּה עֲבָדִים לַמֶּלֶךְ הָיוּ וְלֹא עֲבָדִים לַעֲבָדִים (מכילתא):", "rashi_en": "אשר הוצאתיך מארץ מצרים WHO HAVE BROUGHT THEE OUT OF THE LAND OF EGYPT — That act of bringing you out is alone of sufficient importance that you should subject yourselves to Me. Another explanation: because He had revealed Himself to them at the Red Sea as a mighty man of war and here He revealed Himself as a grey-beard filled with compassion, as it is stated in connection with the Giving of the Law, (Exodus 24:10) “and there was under His feet as it were a brick-work of sapphire”, which is explained to mean that this (the brick-work) was before Him at the time of their bondage; “and there was as the essence of heaven” (i. e. joy and gladness) when they had been delivered (cf. Rashi on Exodus 24:10), thus the Divine Glory changed according to circumstances, — therefore He stated here: Since I change, appearing in various forms, do not say, “There are two divine Beings”; it is I Who brought you forth from Egypt and Who appeared to you at the Sea (cf. Mekhilta). Another explanation: because they then heard many voices, as it is said (v. 15) “the people heard the voices (הקלות)” — voices coming from the four cardinal points and from the heavens and from the earth — therefore God said to them, “Do not say there are many Deities”. — Why did God say in the singular אלהיך, “Thy God”, (as though speaking to one person alone)? To afford Moses an opportunity to speak in defence of Israel at the incident of the golden calf. This, is exactly what he did say, (Exodus 32:11) “Wherefore, O Lord, doth Thy wrath glow against Thy people”, for not to them didst Thou give the command, “There shall be to thee no other gods” but to me alone! (Exodus Rabbah 43:5)<br><br>מבית עבדים OUT OF THE HOUSE OF SLAVES — This means, from the house of Pharaoh where ye were slaves to him. Or perhaps it only says “from the house of slaves” in the sense of a house belonging to slaves to that the words imply that they were slaves to slaves (a most abject form of slavery)! But elsewhere it states, (Deuteronomy 7:8) “He redeemed thee from the house of slaves, from the hand of Pharaoh, king of Egypt”, so that you must now admit that they were slaves of the king and not slaves to slaves and the meaning is: from the house where you were slaves (Mekhilta)."}, {"ch": 20, "v": 3, "aliyah": 6, "heb": "לֹֽ֣א־יִהְיֶ֥͏ֽה־לְךָ֛֩ אֱלֹהִ֥֨ים אֲחֵרִ֖֜ים עַל־פָּנָֽ͏ַ֗י׃", "onk": "לָא יְהֵי לָךְ אֱלָהּ אָחֳרָן <b>בַּר מִנִי<\/b>:", "onk_en": "You must not have any other gods before My Presence [<b>besides Me<\/b>].", "pj": "דְּבִירָא תִּנְיָנָא כַּד הֲוָה נָפִיק מִן פּוּם קוּדְשָׁא יְהֵי שְׁמֵיהּ מְבָרֵךְ הֵי כְּזִיקִין וְהֵי כְבַרְקִין וְהֵי כְּשַׁלְהוֹבִין דִּינוּר לַמְפַּד דִּינוּר מִן יְמִינֵיהּ וְלַמְפַּד דְּאֵישָׁא מִן שְמָאלֵיהּ פָּרַח וְטַיֵּיס בְּאַוִיר שְׁמַיָא חָזַר וּמִתְחַמֵּי עַל מַשִׁירְיַתְהוֹן דְּיִשְרָאֵל וְחָזַר וּמִתְחַקֵּק עַל לוּחֵי קְיָימָא וּמִתְהַפִּיךְ בְּהוֹן מִן סְטַר לִסְטַר וּבְכֵן הֲוָה צָוַוח וְאָמַר עַמִּי בֵּית יִשְרָאֵל לָא יֶהֱוֵי לָךְ אֱלָהָא אוֹחֲרָן בַּר מִינִי", "pj_en": "The second word which came forth from the mouth of the Holy One, whose name be blessed, was like storms, and lightnings, and flames of fire. A burning light was on His right hand and on His left and was borne through the air of the heavens, returned, and was made manifest unto the camp of Israel; it returned, and was engraven on the tables of the covenant, and was turned in them from side to side. Then called He, and said, House of Israel, My people, Thou shalt have no other God beside Me.", "tj": "", "tj_en": "", "rashi": "<b>לא יהיה לך.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּ' לֹא תַעֲשֶׂה לְךָ, אֵין לִי אֶלָּא שֶׁלֹּא יַעֲשֶׂה, הֶעָשׂוּי כְּבָר מִנַּיִן שֶׁלֹּא יְקַיֵּם? תַּ\"לֹ לֹא יִהְיֶה לְךָ (שם):<br><br><b>אלהים אחרים.<\/b> שֶׁאֵינָן אֱלוֹהוּת אֶלָּא אֲחֵרִים עֲשָׂאוּם אֱלֹהִים עֲלֵיהֶם, וְלֹא יִתָּכֵן לְפָרֵשׁ אֱלֹהִים אֲחֵרִים זוּלָתִי, שֶׁגְּנַאי כְּלַפֵּי מַעְלָה לִקְרֹאותָם אֱלוֹהוּת אֶצְלוֹ. דָּ\"אַ אֱלֹהִים אֲחֵרִים, שֶׁהֵם אֲחֵרִים לְעוֹבְדֵיהֶם – צוֹעֲקִים אֲלֵיהֶם וְאֵינָן עוֹנִין אוֹתָם, וְדוֹמֶה כְּאִלּוּ הוּא אַחֵר שֶׁאֵינוֹ מַכִּירוֹ מֵעוֹלָם:<br><br><b>על פני.<\/b> כָּל זְמַן שֶׁאֲנִי קַיָּם, שֶׁלֹּא תֹאמַר לֹא נִצְטַוּוּ עַל עֲ\"זָ אֶלָּא אוֹתוֹ הַדּוֹר (מכילתא):", "rashi_en": "לא יהיה לך THERE SHALL NOT BE UNTO THEE [OTHER GODS] — Why is this said? Does not the preceding verse state: I — and no other — shall be thy God? But since it states immediately after this, “Thou shalt not make unto thee [any graven image etc.]” I might say that I have only a prohibition that one may not make such gods; whence could I know that one may not retain an idol that has already been made? Perhaps there is no such law! Therefore it states here: “there shall not be unto thee” (thou shalt not have other gods) (Mekhilta.)<br><br>אלהים אחרים OTHER GODS — which are not gods, but others have made them gods over themselves. It would not be correct to explain this to mean “gods other than Me”, for it would be blasphemy of the Most High God to term them gods together with Him (cf. Mekhilta). Another explanation of אלהים אחרים : they are so called because they are other (i. e. strange) to those who worship them; these cry to them but they do not answer them, and it is just as though it (the god) is another (a stranger) to him (to the worshipper), one who has never known him at all (Mekhilta).<br><br>על פני BEFORE ME — i. e. so long as I exist; and these apparently superfluous words are added in order that you may not say that no one received any command against idolatry except that generation which went forth from Egypt (Mekhilta)."}, {"ch": 20, "v": 4, "aliyah": 6, "heb": "לֹֽ֣א־תַעֲשֶֽׂ֨ה־לְךָ֥֣ פֶ֣֙סֶל֙&thinsp;<small>׀<\/small>&thinsp;וְכׇל־תְּמוּנָ֔֡ה אֲשֶׁ֤֣ר בַּשָּׁמַ֣֙יִם֙&thinsp;<small>׀<\/small>&thinsp;מִמַּ֔֡עַל וַֽאֲשֶׁ֥ר֩ בָּאָ֖֨רֶץ מִתָּ֑͏ַ֜חַת וַאֲשֶׁ֥ר בַּמַּ֖֣יִם&thinsp;<b>׀<\/b> מִתַּ֥֣חַת לָאָֽ֗רֶץ׃", "onk": "לָא תַעְבֵּד לָךְ צְלֵם וְכָל דְמוּת דִי בִשְׁמַיָא מִלְעֵלָא וְדִי בְאַרְעָא מִלְרָע וְדִי בְמַיָא מִלְרַע לְאַרְעָא:", "onk_en": "You must not make for yourself any carved image, or picture of anything that is in the heaven above, or on the earth below, or in the water below the earth.", "pj": "לָא תַעַבְדוּן לְכוֹן צְלַם וְצוּרָא וְכָל דְּמוֹי דְּבִשְׁמַיָא מִלְּעֵיל וְדִי בְאַרְעָא מִלְּרַע וְדִי בְמַיָא מִלְּרַע לְאַרְעָא", "pj_en": "You shall not make to yourselves image or figure, or any similitude of what is in the heavens above, or on the earth beneath, or in the waters under the earth.", "tj": "", "tj_en": "", "rashi": "<b>פסל.<\/b> עַל שֵׁם שֶׁנִּפְסָל:<br><br><b>וכל תמונה.<\/b> תְּמוּנַת דָּבָר <b>אשר בשמים<\/b>:", "rashi_en": "פסל A GRAVEN IMAGE — it is so called because it is chiselled out (the root פסל has this meaning).<br><br>וכל תמונה lit., OR ANY LIKENESS i. e. the likeness of any thing אשר בשמים THAT IS IN THE HEAVENS."}, {"ch": 20, "v": 5, "aliyah": 6, "heb": "לֹֽא־תִשְׁתַּחֲוֶ֥֣ה לָהֶ֖ם֮ וְלֹ֣א תׇעׇבְדֵ֑ם֒ כִּ֣י אָֽנֹכִ֞י יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵ֠ד עֲוֺ֨ן אָבֹ֧ת עַל־בָּנִ֛ים עַל־שִׁלֵּשִׁ֥ים וְעַל־רִבֵּעִ֖ים לְשֹׂנְאָֽ֑י׃", "onk": "לָא תִסְגֻד לְהוֹן וְלָא תִפְלְחִנוּן אֲרֵי אֲנָא יְיָ אֱלָהָךְ אֵל קַנָא מַסְעַר חוֹבֵי אֲבָהָן עַל בְּנִין <b>מָרָדִין<\/b> עַל דַר תְּלִיתַי וְעַל דַר רְבִיעַי לְשָׂנְאָי <b>כַּד מְשַׁלְמִין בְּנַיָא לְמֶחֱטֵי בָּתַר אֲבָהָתְהוֹן<\/b>:", "onk_en": "You must not prostrate yourself to them, and you must not worship them. For I, Adonoy your God, am a jealous Almighty. I am cognizant of the sins of fathers for [their] [<b>rebellious<\/b>] children, to the third and fourth [generations] of My enemies [<b>when the children complete the sinning after their fathers<\/b>].", "pj": "לָא תִסְגְּדוּן לְהוֹן וְלָא תִפְלְחוּן קֳדָמֵיהוֹן אֲרוּם אֲנָא יְיָ אֱלָהָכוֹן אֱלָהּ קַנָאַן וּפוּרְעַן וּמִתְפְּרַע בְּקִינָאָה מַדְכַּר חוֹבֵי אַבְהַת רַשִׁיעַן עַל בְּנִין מְרָדִין עַל דַּר תְּלִיתָאֵי וְעַל דַּר רְבִיעָאֵי לְשׁוֹנְאָי", "pj_en": "You shall not bow down to them, or worship before them; for I the Lord your God am a jealous God and an avenger, punishing with vengeance, recording the guilt of wicked fathers upon rebellious children unto the third and unto the fourth generation of them who hate Me;", "tj": "", "tj_en": "", "rashi": "<b>אל קנא.<\/b> מְקַנֵּא לִפָּרַע וְאֵינוֹ עוֹבֵר עַל מִדָּתוֹ לִמְחֹל עַל עֲבוֹדַת אֱלִילִים; כָּל לְשׁוֹן קַנָּא אנפרי\"מנט בְּלַעַז – נוֹתֵן לֵב לִפָּרַע:<br><br><b>לשנאי.<\/b> כְּתַרְגּוּמוֹ, כְּשֶׁאוֹחֲזִין מַעֲשֵׂה אֲבוֹתֵיהֶם בִּידֵיהֶם.", "rashi_en": "אל קנא A JEALOUS GOD — He is jealous to exact punishment, and does not pass over His rights by pardoning idolatry (Mekhilta). Wherever: the expression קנא occurs it signifies in old French emportement, English zeal, — determining to exact punishment.<br><br>לשנאי OF THEM THAT HATE ME — This must be explained in the same sense as the Targum takes it: when they retain in their hands (follow the example of) the evil doings of their ancestors (Sanhedrin 27b);"}, {"ch": 20, "v": 6, "aliyah": 6, "heb": "וְעֹ֥֤שֶׂה חֶ֖֙סֶד֙ לַאֲלָפִ֑֔ים לְאֹהֲבַ֖י וּלְשֹׁמְרֵ֥י מִצְוֺתָֽי׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעָבֵד טִיבוּ לְאַלְפֵי דָרִין לְרַחֲמַי וּלְנָטְרֵי פִקוֹדָי:", "onk_en": "But I do [acts of] loving kindness [<b>goodness<\/b>] for thousands [of generations] to those who love Me and preserve My commandments.", "pj": "וּנְטִיר חֶסֶד וְטִיבוּ לְאַלְפִין דָרִין לְרַחֲמַי צַדִּיקַיָא וּלְנַטְרֵי פִּיקוּדָי וְאוֹרַיְיתָי", "pj_en": "but keeping mercy and goodness for thousands of generations of the righteous who love Me, and who keep My commandments and My laws.", "tj": "", "tj_en": "", "rashi": "<b>נוֹצֵר חֶסֶד.<\/b> שֶׁאָדָם עוֹשֶׂה, לְשַׁלֵּם שָׂכָר עַד לְאַלְפַּיִם דּוֹר, נִמְצֵאת מִדָּה טוֹבָה יְתֵרָה עַל מִדַּת פֻּרְעָנִיּוֹת אַחַת עַל חָמֵשׁ מֵאוֹת, שֶׁזּוֹ לְאַרְבָּעָה דּוֹרוֹת, וְזוֹ לַאֲלָפִים <small>(תוספתא סוטה ד, א)<\/small>: ", "rashi_en": "and He keeps (stores up) the mercy which a person does to give a reward for it to the thousand generations of that person’s descendants. It follows, therefore, that the measure of good (reward) is greater than the measure of punishment in the proportion of one to five hundred, for the former is threatened only to four generations whilst the latter is bestowed upon thousands (two thousands at least) (Tosefta Sotah 4:1; see Rashi on Exodus 34:7)."}, {"ch": 20, "v": 7, "aliyah": 6, "heb": "לֹ֥א תִשָּׂ֛א אֶת־שֵֽׁם־יְהֹוָ֥ה אֱלֹהֶ֖יךָ לַשָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהֹוָ֔ה אֵ֛ת אֲשֶׁר־יִשָּׂ֥א אֶת־שְׁמ֖וֹ לַשָּֽׁוְא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא <b>תֵימֵי בִּ<\/b>שְׁמָא דַיְיָ אֱלָהָךְ לְמַגָנָא אֲרֵי לָא יִזַכֵּי יְיָ יָת <b>דִיֵימֵי בִ<\/b>שְׁמֵהּ לְשִׁקְרָא:", "onk_en": "Do not take [<b>swear in<\/b>] the Name of Adonoy, your God in vain. For Adonoy will not acquit the one who takes [<b>swears in<\/b>] His Name in vain [<b>falsely<\/b>].", "pj": "עַמִּי בֵּית יִשְרָאֵל לָא יִשְׁתְּבַּע חַד מִנְכוֹן בְּשׁוּם מֵימְרָא דַיְיָ אֱלָהָכוֹן עַל מַגָּן אֲרוּם לָא מִזַכֵּי יְיָ בְּיוֹם דִּינָא רַבָּא יַת כָּל מַאן דְּמִשְׁתְּבַע בִּשְׁמֵיהּ עַל מַגָּן", "pj_en": "My people of the house of Israel, Let no one of you swear by the name of the Word of the Lord your God in vain; for in the day of the great judgment the Lord will not hold guiltless any one who sweareth by His name in vain.", "tj": "", "tj_en": "", "rashi": "<b>לשוא.<\/b> חִנָּם, לַהֶבֶל, וְאֵיזֶהוּ שְׁבוּעַת שָׁוְא? נִשְׁבַּע לְשַׁנּוֹת אֶת הַיָּדוּעַ – עַל עַמּוּד שֶׁל אֶבֶן שֶׁהוּא שֶׁל זָהָב (שבועות כ\"ט):", "rashi_en": "לשוא IN VAIN — for no valid reason, idly. What is a שבועת שוא, an oath taken for no valid reason? If one takes an oath declaring something, the nature of which is evident, to be different from what it is: e. g., swearing about a stone pillar that it is of gold (Shevuot 29a)."}, {"ch": 20, "v": 8, "aliyah": 6, "heb": "זָכ֛וֹר֩ אֶת־י֥֨וֹם הַשַּׁבָּ֖֜ת לְקַדְּשֽׁ֗וֹ׃", "onk": "הֲוֵי דְכִיר יָת יוֹמָא דְשַׁבְּתָא לְקַדָשׁוּתֵהּ:", "onk_en": "Remember the Shabbos day to sanctify it.", "pj": "עַמִּי בֵּית יִשְרָאֵל הֲווֹן דְּכִירִין יוֹמָא דְשַׁבַּתָּא לְמַקְדְּשָׁא יָתֵיהּ", "pj_en": "My people of the house of Israel, Remember the day of Shabbatha, to sanctify it.", "tj": "", "tj_en": "", "rashi": "<b>זכור.<\/b> זָכוֹר וְשָׁמוֹר בְּדִבּוּר אֶחָד נֶאֶמְרוּ, וְכֵן מְחַלְלֶיהָ מוֹת יוּמָת (שמות ל\"א), וּבְיוֹם הַשַּׁבָּת שְׁנֵי כְבָשִׂים (במדבר כ\"ח); וְכֵן לֹא תִלְבַּשׁ שַׁעַטְנֵז, גְּדִלִים תַּעֲשֶׂה לָּךְ (דברים כ\"ב); וְכֵן עֶרְוַת אֵשֶׁת אָחִיךָ (ויקרא י\"ח), יְבָמָהּ יָבֹא עָלֶיהָ (דברים כ\"ה); הוּא שֶׁנֶּאֱמַר אַחַת דִּבֶּר אֱלֹהִים שְׁתַּיִם זוּ שָׁמָעְתִּי (תהילים ס\"ב): <b>זכור.<\/b> לְשׁוֹן פָּעוֹל הוּא, כְּמוֹ אָכוֹל וְשָׁתוֹ (ישעיהו כ\"ב), הָלוֹךְ וּבָכֹה (שמואל ב ג'), וְכֵן פִּתְרוֹנוֹ: תְּנוּ לֵב לִזְכֹּר תָּמִיד אֶת יוֹם הַשַּׁבָּת, שֶׁאִם נִזְדַּמֵּן לְךָ חֵפֶץ יָפֶה תְּהֵא מַזְמִינוֹ לְשַׁבָּת (מכילתא):", "rashi_en": "זכור — This word REMEMBER which opens this commandment here and שמור “observe” which opens it in Deuteronomy (5:12) were spoken in one utterance. Similar is, (Exodus 31:14) “Everyone that profaneth it (the Sabbath) shall surely be put to death”, which apparently is in contradiction with (Numbers 28:9) “And on the Sabbath day [ye shall offer] two lambs”, a command necessitating actions which, if done for any other purposes on the Sabbath, would involve a profanation of that day. Similar is, (Deuteronomy 22:11) “Thou shalt not wear a garment of two kinds, [as of woollen and linen together]” and (Deuteronomy 22:12) “Thou shalt make thee tassels”, for the performance of which command wool and linen may be employed in combination. Similar is, (Leviticus 18:16) “The nakedness of thy brother’s wife” (the prohibition of marriage with her), and (Deuteronomy 25:5) “her husband’s brother shall come unto her” (he shall marry her). — This is the meaning of what is said (Psalms 62:12) “One thing did God speak, these two things did we hear” (Mekhilta). זכור — This word expresses the verbal action without any reference to a particular time (the infinitive), similar to, (Isaiah 22:13) אכול ושתו “to eat and to drink”; (II Samuel 3:16) הלוך ובכה “to go and to weep”; and the following is its meaning: take care to remember always the Sabbath day — that if, for example, you come across a nice article of food during the week, put it by for the Sabbath (Beitzah 16a)."}, {"ch": 20, "v": 9, "aliyah": 6, "heb": "שֵׁ֤֣שֶׁת יָמִ֣ים֙ תַּֽעֲבֹ֔ד֮ וְעָשִׂ֖֣יתָ כׇּֿל־מְלַאכְתֶּֽךָ֒׃", "onk": "שִׁתָּא יוֹמִין תִּפְלָח וְתַעְבֵּד כָּל עִבִדְתָּךְ:", "onk_en": "You may work six days, and do all your work.", "pj": "שִׁיתָּא יוֹמִין תִּפְלְחוּן וְתַעַבְדוּן כָּל עֲבִדְתֵּיכוֹן", "pj_en": "Six days you shall labour, and do all your service:", "tj": "", "tj_en": "", "rashi": "<b>ועשית כל מלאכתך.<\/b> כְּשֶׁתָּבֹא שַׁבָּת יְהֵא בְעֵינֶיךָ כְּאִלּוּ כָּל מְלַאכְתְּךָ עֲשׂוּיָה, שֶׁלֹּא תְהַרְהֵר אַחַר מְלָאכָה (שם):", "rashi_en": "ועשית כל מלאכתך [SIX DAYS SHALT THOU LABOUR] AND DO ALL THY WORK — When the Sabbath comes it should be in thy eyes as though all thy work were done (completed), so that thou shouldst not think at all about work (Mekhilta)."}, {"ch": 20, "v": 10, "aliyah": 6, "heb": "וְי֨וֹם֙ הַשְּׁבִיעִ֔֜י שַׁבָּ֖֣ת&thinsp;<b>׀<\/b> לַיהֹוָ֣ה אֱלֹהֶ֑֗יךָ לֹֽ֣א־תַעֲשֶׂ֣֨ה כׇל־מְלָאכָ֜֡ה אַתָּ֣ה&thinsp;<b>׀<\/b> וּבִנְךָ֣͏ֽ־וּ֠בִתֶּ֗ךָ עַבְדְּךָ֤֨ וַאֲמָֽתְךָ֜֙ וּבְהֶמְתֶּ֔֗ךָ וְגֵרְךָ֖֙ אֲשֶׁ֥֣ר בִּשְׁעָרֶֽ֔יךָ׃", "onk": "וְיוֹמָא שְׁבִיעָאָה שַׁבְּתָא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ לָא תַעְבֵּד כָּל עִבִדְתָּא אַתְּ וּבְרָךְ וּבְרַתָּךְ עַבְדָךְ וְאַמְתָךְ וּבְעִירָךְ וְגִיוֹרָךְ דִי בְקִרְוָךְ:", "onk_en": "But the seventh day is Shabbos to [<b>before<\/b>] Adonoy, your God. You must not do any manner of work—you, your son, your daughter, your slave, your maid, your animal, and the foreigner within your gates.", "pj": "וְיוֹמָא שְׁבִיעָאָה שַׁבָּת וְנַיַּיח קֳדָם יְיָ אֱלָהָכוֹן לָא תַעְבְדוּן כָּל עִבִידְתָּא אַתּוּן וּבְנֵיכוֹן וּבְנָתֵיכוֹן וְעַבְדֵיכוֹן וְאַמְהוֹתֵיכוֹן וְגִיּוֹרֵיכוֹן בְּקִירְוֵיכוֹן", "pj_en": "but the seventh day is (for) rest and quietude before the Lord your God: you shall not perform any work, you, and your sons, and your daughters, and your servants, and your handmaids, and your sojourners who are in your cities.", "tj": "", "tj_en": "", "rashi": "<b>אתה ובנך ובתך.<\/b> אֵלּוּ קְטַנִּים; אוֹ אֵינוֹ אֶלָּא גְּדוֹלִים? אָמַרְתָּ, הֲרֵי כְּבָר מֻזְהָרִים הֵם, אֶלָּא לֹא בָא אֶלָּא לְהַזְהִיר גְּדוֹלִים עַל שְׁבִיתַת הַקְּטַנִּים; וְזֶהוּ שֶׁשָּׁנִינוּ (שבת קכ\"א), קָטָן שֶׁבָּא לְכַבּוֹת אֵין שׁוֹמְעִין לוֹ מִפְּנֵי שֶׁשְּׁבִיתָתוֹ עָלֶיךָ:", "rashi_en": "אתה ובנך ובתך THOU AND THY SON AND THY DAUGHTER — these latter mean the young children. Or perhaps this is not so, but it means your adult children? But you must admit that these have already been placed under this prohibition (by the word “Thou”, because the performance of this command is obligatory upon all adults to whom it was addressed). Therefore these words must be intended only to admonish the adults (implied in the term “Thou”) about the Sabbath rest of their young children (to impose upon the parents the obligation of enforcing the Sabbath rest upon them) (Mekhilta). This is the meaning of what we have learnt in a Mishna, (Shabbat 16:6) “A minor who is about to extinguish a fire — we do not listen to him (do not permit him to do this), because his observance of the Sabbath is a duty imposed upon you”."}, {"ch": 20, "v": 11, "aliyah": 6, "heb": "כִּ֣י שֵֽׁשֶׁת־יָמִים֩ עָשָׂ֨ה יְהֹוָ֜ה אֶת־הַשָּׁמַ֣יִם וְאֶת־הָאָ֗רֶץ אֶת־הַיָּם֙ וְאֶת־כׇּל־אֲשֶׁר־בָּ֔ם וַיָּ֖נַח בַּיּ֣וֹם הַשְּׁבִיעִ֑י עַל־כֵּ֗ן בֵּרַ֧ךְ יְהֹוָ֛ה אֶת־י֥וֹם הַשַּׁבָּ֖ת וַֽיְקַדְּשֵֽׁהוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי שִׁתָּא יוֹמִין עֲבַד יְיָ יָת שְׁמַיָא וְיָת אַרְעָא יָת יַמָא וְיָת כָּל דִי בְהוֹן וְנָח בְּיוֹמָא שְׁבִיעָאָה עַל כֵּן בָּרִיךְ יְיָ יָת יוֹמָא דְשַׁבְּתָא וְקַדְשֵׁהּ:", "onk_en": "For in six days Adonoy made the heaven and the earth, the sea and all that is in them, and He rested on the seventh day. Therefore Adonoy blessed the Shabbos and made it holy.", "pj": "אֲרוּם בְּשִׁתָּא יוֹמִין בָּרָא יְיָ יַת שְׁמַיָא וְיַת אַרְעָא יַת יַמָא וְיַת כָּל מַה דְּאִית בְּהוֹן וְנַח בְּיוֹמָא שְׁבִיעָאָה בְּגִין כֵּן בְּרִיךְ יְיָ יַת יוֹמָא דְשַׁבְּתָא וְקַדִּישׁ יָתֵיהּ", "pj_en": "For in six days the Lord created the heavens, and the earth, and the sea, and whatever is therein, and rested on the seventh day: therefore the Lord hath blessed the day of Shabbatha and sanctified it.", "tj": "", "tj_en": "", "rashi": "<b>וינח ביום השביעי.<\/b> כִּבְיָכוֹל הִכְתִּיב בְּעַצְמוֹ מְנוּחָה, לְלַמֵּד הֵימֶנּוּ קַל וָחֹמֶר לָאָדָם שֶׁמְּלַאכְתּוֹ בְעָמָל וִיגִיעָה שֶׁיִּהְיֶה נָח בְּשַׁבָּת (מכילתא):<br><br><b>ברך, ויקדשהו.<\/b> בֵּרְכוֹ בַמָּן – לְכָפְלוֹ בַּשִּׁשִּׁי לֶחֶם מִשְׁנֶה, וְקִדְּשׁוֹ בַמָּן – שֶׁלֹּא הָיָה יוֹרֵד בּוֹ (מכילתא):", "rashi_en": "וינח ביום השביעי AND HE RESTED ON THE SEVENTH DAY — If one may say so, He recorded rest about Himself (recorded that He rested) to teach from this an inference à fortiori as regards a human being whose work is performed only by labour and toil — that he should rest on the Sabbath day (Mekhilta).<br><br>ברך… ויקדשהו HE BLESSED … AND SANCTIFIED IT — He blessed it through the Manna by giving a double portion on the sixth day — “double bread”; and He sanctified it through the Manna in that on it none fell (Mekhilta; cf. Rashi on Genesis 2:3)."}, {"ch": 20, "v": 12, "aliyah": 6, "heb": "כַּבֵּ֥ד אֶת־אָבִ֖יךָ וְאֶת־אִמֶּ֑ךָ לְמַ֙עַן֙ יַאֲרִכ֣וּן יָמֶ֔יךָ עַ֚ל הָאֲדָמָ֔ה אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֥ן לָֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יַקַר יָת אָבוּךְ וְיָת אִמָךְ בְּדִיל דְיוֹרְכוּן יוֹמָיךְ עַל אַרְעָא דַיְיָ אֱלָהָךְ יָהֵב לָךְ:", "onk_en": "Honor your father and your mother so that your days may be lengthened upon the land that Adonoy, your God, is giving you.", "pj": "עַמִּי בֵּית יִשְרָאֵל הֲווֹ זְהִירִין גְּבַר בִּיקָרָא דְאָבוּהִי וּבִיקָרָא דְאִמֵיהּ מִן בִּגְלַל דְּיִסְגוּן יוֹמֵיכוֹן עַל אַרְעָא דַיְיָ אֱלָהָכוֹן יָהִיב לְכוֹן", "pj_en": "My people, the house of Israel, Let every man be instructed in the honour of his father and in the honour of his mother: that your days may be multiplied upon the land which the Lord your God giveth you.", "tj": "", "tj_en": "", "rashi": "<b>למען יארכון ימיך.<\/b> אִם תְּכַבֵּד יַאֲרִיכוּן וְאִם לָאו יִקְצְרוּן, שֶׁדִּבְרֵי תוֹרָה נוֹטָרִיקוֹן הֵם נִדְרָשִׁים – מִכְּלַל הֵן לָאו וּמִכְּלַל לָאו הֵן (מכילתא):", "rashi_en": "למען יארכון ימיך THAT THY DAYS MAY BE LONG — If thou honourest them they will be long, and if not, they will be shortened — for the words of the Torah may be explained as concise statements: from what is included in a positive statement we may infer the negative and from what is included in a negative statement we may infer the positive (Mekhilta)."}, {"ch": 20, "v": 13, "aliyah": 6, "heb": "לֹ֥֖א תִּֿרְצָ֖͏ֽח׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;לֹ֣֖א תִּֿנְאָ֑͏ֽף׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;לֹ֣֖א תִּֿגְנֹֽ֔ב׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;לֹֽא־תַעֲנֶ֥ה בְרֵעֲךָ֖ עֵ֥ד שָֽׁקֶר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תִקְטוֹל נְפָשׁ לָא תְגוּף לָא תִגְנוּב לָא תַסְהֵד בְּחַבְרָךְ <b>סָהֲדוּתָא<\/b> דְשִׁקְרָא:", "onk_en": "Do not commit murder. Do not commit adultery. Do not steal [by kidnapping human beings]. Do not testify as a false witness [<b>testimony<\/b>] against your neighbor.", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווּן קְטוֹלִין לָא חַבְרִין וְלָא שׁוּתְּפִין עִם קְטוֹלִין וְלָא יִתְחָמֵי בִּכְנִשְׁתְּהוֹן דְּיִשְרָאֵל עִם קְטוֹלִין וְלָא יְקוּמוּן בְּנֵיכוֹן מִן בַּתְרֵיכוֹן וְיִלְפוּן לְחוֹד הִינוּן לְמֶהֱוֵי עִם קְטוֹלִין אֲרוּם בְּחוֹבֵי קְטוֹלַיָא חַרְבָּא נָפִיק עַל עַלְמָא: לא תנאף עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווּן גִּיּוּרִין לָא חַבְרִין וְלָא שׁוּתָּפִין עִם גִּיּוּרִין וְלָא יִתְחָמֵי בִּכְנִשְׁתְּהוֹן דְּיִשְרָאֵל עִם גִּיּוּרִין דְּלָא יְקוּמוּן בְּנֵיכוֹן מִן בַּתְרֵיכוֹן וְיִלְפוּן לְחוֹד הִינוּן לְמֶהֱוֵי עִם גִּיּוּרִין אֲרוּם בְּחוֹבֵי גִיּוּרָא מוֹתָא נָפִיק עַל עַלְמָא: לא תגנוב עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווּן גַּנָּבִין לָא חַבְרִין וְלָא שׁוּתָּפִין עִם גַּנָּבִין וְלָא יִתְחָמֵי בִּכְנִשְׁתְּהוֹן דְּיִשְרָאֵל עִם גַּנָּבִין דְּלָא יְקוּמוּן בְּנֵיכוֹן מִן בַּתְרֵיכוֹן וְיִלְפוּן לְחוֹד הִינוּן לְמֶהֱוֵי עִם גַּנָּבִין אֲרוּם בְּחוֹבֵי גַנָבַיָא כַּפְנָא נָפִיק עַל עַלְמָא: לא תענה עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווּן מְסַהֲדִין בְּחַבְרֵיכוֹן סַהֲדֵי שִׁיקְרָא לָא חַבְרִין וְלָא שׁוּתָּפִין עִם מְסַהְדִין סַהֲדֵי שִׁקְרָא וְלָא יִתְחָמֵי בִּכְנִשְׁתְּהוֹן דְּיִשְרָאֵל עִם מְסַהֲדִין סַהֲדֵי שִׁיקְרָא דְלָא יְקוּמוּן בְּנֵיכוֹן בַּתְרֵיכוֹן וְיִלְפוּן לְחוֹד הִינוּן לְמֶהֱוֵי עִם מְסַהֲדִין סַהֲדֵי שִׁיקְרָא אֲרוּם בְּחוֹבֵי סַהֲדֵי שִׁיקְרָא עֲנָנָן סַלְקִין וּמִטְרָא לָא נָחִית וּבְצוֹרָתָא אַתְיָא עַל עַלְמָא", "pj_en": "My people, the sons of Israel, You. shall not be murderers; you shall not be companions of or partakers with murderers: in the congregations of Israel there shall not be seen a murderous people; neither shall your sons rise up after you and teach one another to take part with murderers: for on account of the guilt of murder the sword cometh forth upon the world: My people of the house of Israel, Be ye not adulterers, nor companions nor partakers with adulterers: nor in the congregations of Israel shall there be seen an adulterous people, that your sons may not arise after you to teach one another to have part with adulterers: for through the guilt of adultery death cometh forth upon the world: Sons of Israel My people, Ye shall not be thieves, nor companions nor partakers with thieves: there shall not be seen in the congregations of Israel a thievish people; that your sons may not arise after you to teach one another to have part with thieves: for on account of the guilt of theft famine cometh forth upon the world: Sons of Israel My people, Ye shall not testify against your neighbours a testimony of falsehood, nor be companions or partakers with those who bear false witness nor shall there be seen in the congregations of Israel a people who testify a testimony of falsehood; neither shall your sons arise after you to teach one another to have part with those who testify falsehood: for because of the guilt of false testimony the clouds go up and the rain cometh not down, and dryness cometh upon the world.", "tj": "", "tj_en": "", "rashi": "<b>לא תנאף.<\/b> אֵין נִאוּף אֶלָּא בְאֵשֶׁת אִישׁ, שֶׁנֶּאֱמַר מוֹת יוּמַת הַנּוֹאֵף וְהַנּוֹאָפֶת (ויקרא כ'), וְאוֹמֵר הָאִשָּׁה הַמְנָאֶפֶת תַּחַת אִישָׁהּ תִּקַּח אֶת זָרִים (יחזקאל ט\"ז):<br><br><b>לא תגנב.<\/b> בְּגוֹנֵב נְפָשׁוֹת הַכָּתוּב מְדַבֵּר, לֹא תִּגְנֹבוּ (ויקרא י\"ט), בְּגוֹנֵב מָמוֹן; אוֹ אֵינוֹ אֶלָּא זֶה בְגוֹנֵב מָמוֹן וּלְהַלָּן בְּגוֹנֵב נְפָשׁוֹת? אָמַרְתָּ דָּבָר לָמֵד מֵעִנְיָנוֹ – מַה לֹא תִרְצָח, לֹא תִנְאָף, מְדַבֵּר בְּדָבָר שֶׁחַיָּבִין עָלָיו מִיתַת בֵּית דִּין, אַף לֹא תִגְנֹב דָּבָר שֶׁחַיָּב עָלָיו מִיתַת בֵּית דִּין (סנהדרין פ\"ו):", "rashi_en": "לא תנאף THOU SHALT NOT COMMIT ADULTERY — The term ניאוף, “adultery”, is technically only applicable to the case of a married woman, as it is said, (Leviticus 20:10) […the wife of his neighbour], the נואף and the נואפת shall surely be put to death”, and it further states, (Ezekiel 16:32) “The woman that comitteth adultery, that taketh strangers instead of her husband”.<br><br>לא תגנוב THOU SHALT NOT STEAL — Scripture here is speaking about a case of one who steals human beings, whilst the command (Leviticus 19:11) “Ye shall not steal” speaks about a case of one who steals money (another person’s property in general). Or perhaps this is not so, but this speaks about the case of one who steals money and the other about the case of one who steals human beings! You must, however, admit that the rule applies: a statement must be explained from its context. How is it in regard to, “Thou shalt not murder” and “Thou shalt not commit adultery”? Each, speaks of a matter for which one becomes liable to death by sentence of the court; similarly, “Thou shalt not steal”, must speak of a matter for which one becomes liable to death by sentence of the court, and this is not so in the case of theft of money but only in that of kidnapping (Sanhedrin 86a; cf.Mekhilta)."}, {"ch": 20, "v": 14, "aliyah": 6, "heb": "לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑ךָ&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;לֹֽא־תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗ךָ וְעַבְדּ֤וֹ וַאֲמָתוֹ֙ וְשׁוֹר֣וֹ וַחֲמֹר֔וֹ וְכֹ֖ל אֲשֶׁ֥ר לְרֵעֶֽךָ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא תַחְמֵד בֵּית חַבְרָךְ לָא תַחְמֵד אִתַּת חַבְרָךְ וְעַבְדֵהּ וְאַמְתֵהּ וְתוֹרֵהּ וַחֲמָרֵהּ וְכֹל דִי לְחַבְרָךְ:", "onk_en": "Do not covet your neighbor’s house. Do not covet your neighbor’s wife, his slave, his maid, his ox, his donkey, or anything else that belongs to your neighbor.", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווּן חֲמִידִין לָא חַבְרִין וְלָא שׁוּתָּפִין עִם חֲמִידִין וְלָא יִתְחֲמוּן בִּכְנִשְׁתְּהוֹן דְּיִשְרָאֵל עִם חֲמוּדִין דְּלָא יְקוּמוּן בְּנֵיכוֹן מִן בַּתְרֵיכוֹן וְיִלְפוּן לְחוֹד הִינוּן לְמֶהֱוֵי עִם חֲמוּדִין וְלָא יַחְמִיד חַד מִנְכוֹן יַת אִנְתְּתֵיהּ דְּחַבְרֵיהּ וְלָא לְעַבְדֵיהּ וְלָא לְאַמְתֵיהּ וְלָא לְתוֹרֵיהּ וְלָא לְחַמְרֵיהּ וְלָא לְכָל מַאן דְּאִית לְחַבְרֵיהּ אֲרוּם בְחוֹבֵי חִמּוּדַיָא מַלְכוּתָא מִתְגַרְיָא בְּנִכְסֵיהוֹן דִּבְנֵי נְשָׁא וּלְמֵיסַב יַתְהוֹן וְעַתִּירֵי נִכְסִין מִתְמַסְכְּנִין וְגָלוּתָא אַתְיָא עַל עַלְמָא", "pj_en": "Sons of Israel My people, Ye shall not be covetous companions or partakers with the covetous: nor shall there be seen in the congregations of Israel a covetous people; that your sons may not arise after you to teach one another to have part with the covetous: neither shall any among you covet the wife of his neighbour, nor his servant, nor his handmaid, nor his ox, nor his ass nor anything that belongeth to his neighbour; because through the guilt of covetousness the government breaketh in upon the possessions of men to take them, and the wealthy are made poor, and slavery cometh upon the world.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 15, "aliyah": 7, "heb": "וְכׇל־הָעָם֩ רֹאִ֨ים אֶת־הַקּוֹלֹ֜ת וְאֶת־הַלַּפִּידִ֗ם וְאֵת֙ ק֣וֹל הַשֹּׁפָ֔ר וְאֶת־הָהָ֖ר עָשֵׁ֑ן וַיַּ֤רְא הָעָם֙ וַיָּנֻ֔עוּ וַיַּֽעַמְד֖וּ מֵֽרָחֹֽק׃", "onk": "וְכָל עַמָא חָזָן יָת קָלַיָא וְיָת בָּעוֹרַיָא וְיָת קַל שׁוֹפָרָא וְיָת טוּרָא תָּנֵן וַחֲזָא עַמָא וְזָעוּ וְקָמוּ מֵרָחִיק:", "onk_en": "All the people saw the sounds, the flames, the sound of the shofar, and the mountain emitting smoke. The people saw [all this] and they trembled, and stood far off.", "pj": "וְכָל עַמָּא חַמְיַין יַת קָלַיָיא הֵיךְ הֲווֹ מִתְהַפְּכִין בְּשָׁמְעֲהוֹן דְּכָל חַד וְחַד וְהֵיךְ הֲווֹ נַפְקִין מִן גּוֹ בְּעוּרַיָא וְיַת קַל שׁוֹפְרָא הֵיךְ הֲוָה מְחֵי מֵיתַיָא וְיַת טוּרָא תָּנֵין וְחָמוּן כָּל עַמָּא וּרְתָעַן וְקָמוּ תְּרֵיסַר מִילִין מֵרָחִיק", "pj_en": "And all the people saw the thunders, and were turned back, every one as he heard them coming forth from the midst of the lights, and the voice of the trumpet as it will raise the dead, and the mountain smoking; and all the people saw and drew back, and stood twelve miles off.", "tj": "וְכָל עַמָּא הֲווּ חָמִין יַת קָלַיָא וְיַת לַפִּידַיָא וְיַת קָלָא דְשִׁיפּוּרָא וְיַת טוּרָא עַטִיר וְחַמְיָין עַמָּא וְזָעוּ וְקָמוּ לְהוֹן מֵרָחוֹק:", "tj_en": "And all the people saw the thunders and the lights, and the sound of the trumpet, and the mountain smoking; and the people saw and trembled, and stood afar off.", "rashi": "<b>וכל העם ראים.<\/b> מְלַמֵּד שֶׁלֹּא הָיָה בָהֶם אֶחָד סוּמָא, וּמִנַּיִן שֶׁלֹּא הָיָה בָהֶם אִלֵּם? תַּ\"לֹ וַיַּעֲנוּ כָל הָעָם, וּמִנַּיִן שֶׁלֹּא הָיָה בָהֶם חֵרֵשׁ? תַּ\"לֹ נַעֲשֶׂה וְנִשְׁמָע (מכילתא):<br><br><b>ראים את הקולת.<\/b> רוֹאִין אֶת הַנִּשְׁמָע, שֶׁאִי אֶפְשָׁר לִרְאוֹת בְּמָקוֹם אַחֵר:<br><br><b>את הקולת.<\/b> הַיּוֹצְאִין מִפִּי הַגְּבוּרָה:<br><br><b>וינעו.<\/b> אֵין נוּעַ אֶלָּא זִיעַ:<br><br><b>ויעמדו מרחק.<\/b> הָיוּ נִרְתָּעִין לַאֲחוֹרֵיהֶם שְׁנֵים עָשָׂר מִיל, כְּאֹרֶךְ מַחֲנֵיהֶם, וּמַלְאֲכֵי הַשָּׁרֵת בָּאִין וּמְסַיְּעִין אוֹתָן לְהַחֲזִירָם, שֶׁנֶּאֱמַר (תהילים ס\"ח) מַלְאֲכֵי צְבָאוֹת יִדֹּדוּן יִדֹּדוּן (שבת פ\"ח):", "rashi_en": "וכל העם ראים AND ALL THE PEOPLE SAW — This statement teaches us that there was not a blind person amongst them. And whence may we learn that there was not a dumb person amongst them? Because it states (Exodus 19:8) “And all the people answered”. And whence may we learn that there was not a deaf person amongst them? Because it states (Exodus 24:7) “We will do and we will hear” (Mekhilta).<br><br>ראים את הקולת [THEY] SAW THE SOUNDS — they saw that which should be heard (Mekhilta) — something which is impossible to see on any other occasion.<br><br>את הקולת THE SOUNDS which issued from the mouth of the Almighty.<br><br>וינעו THEY MOVED — The root נוע denotes trembling (Mekhilta).<br><br>ויעמדו מרחק AND THEY STOOD AFAR OFF — they moved back startled twelve miles, a distance equal to the length of their camp, and ministering angels came and assisted them — to bring them back, as it is said, (Psalms 68:13) “The angels of the God of Hosts made them move on, move on” (Shabbat 88b)."}, {"ch": 20, "v": 16, "aliyah": 7, "heb": "וַיֹּֽאמְרוּ֙ אֶל־מֹשֶׁ֔ה דַּבֵּר־אַתָּ֥ה עִמָּ֖נוּ וְנִשְׁמָ֑עָה וְאַל־יְדַבֵּ֥ר עִמָּ֛נוּ אֱלֹהִ֖ים פֶּן־נָמֽוּת׃", "onk": "וַאֲמָרוּ לְמשֶׁה מַלֵל אַתְּ עִמָנָא <b>וּנְקַבֵּל וְלָא יִתְמַלֵל עִמָנָא מִן קֳדָם<\/b> יְיָ דִילְמָא נְמוּת:", "onk_en": "They said to Moshe, “You speak to us and we will listen [<b>obey<\/b>]. Let [<b>it not be spoken to us from before<\/b>] Elohim not speak with us [anymore] lest we die.”", "pj": "וַאֲמָרוּ לְמשֶׁה מַלֵּיל אַנְתְּ עִמָּנָא וּנְקַבֵּיל וְלָא יִתְמַלֵּל עִמָּנָא תּוּב מִן קֳדָם יְיָ דִלְמָא נְמוּת", "pj_en": "And they said to Mosheh, Speak thou with us, and we can hear; but let it not be spoken with us any more from before the Lord, lest we die.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 17, "aliyah": 7, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֣ה אֶל־הָעָם֮ אַל־תִּירָ֒אוּ֒ כִּ֗י לְבַֽעֲבוּר֙ נַסּ֣וֹת אֶתְכֶ֔ם בָּ֖א הָאֱלֹהִ֑ים וּבַעֲב֗וּר תִּהְיֶ֧ה יִרְאָת֛וֹ עַל־פְּנֵיכֶ֖ם לְבִלְתִּ֥י תֶחֱטָֽאוּ׃", "onk": "וַאֲמַר משֶׁה לְעַמָא לָא תִדְחֲלוּן אֲרֵי בְּדִיל <b>לְנַסָאָה<\/b> יָתְכוֹן <b>אִתְגְלִי לְכוֹן יְקָרָא דַ<\/b>יְיָ וּבְדִיל דִתְהֵי דַחַלְתֵּהּ עַל אַפֵּיכוֹן בְּדִיל דְלָא תְחוּבוּן:", "onk_en": "Moshe said to the people, “Do not be afraid. It was to exalt [<b>test<\/b>] you that [<b>the Glory of<\/b>] Elohim [<b>became revealed to you<\/b>] came [in this manner], so that the fear of Him be on your faces that you not sin.”", "pj": "וַאֲמַר משֶׁה לְעַמָּא לָא תְדַחֲלוּן אֲרוּם מִן בִּגְלַל לְנַסָּיוּתְכוֹן אִתְגְּלֵי לְכוֹן יְקָרָא דַיְיָ וּמִן בִּגְלַל דְּתֶהֱוֵי דַחַלְתֵּיהּ עַל אַפֵּיכוֹן בְּגִין דְּלָא תְחוּבוּן", "pj_en": "And Mosheh said to the people, Fear not; for the glory of the Lord is revealed to try you, whether His fear is before your faces, that ye may not sin.", "tj": "", "tj_en": "", "rashi": "<b>לבעבור נסות אתכם.<\/b> לְגַדֵּל אֶתְכֶם בָּעוֹלָם, שֶׁיֵּצֵא לָכֶם שֵׁם בָּאֻמּוֹת שֶׁהוּא בִּכְבוֹדוֹ נִגְלָה עֲלֵיכֶם:<br><br><b>נסות.<\/b> לְשׁוֹן הֲרָמָה וּגְדֻלָּה, כְּמוֹ הָרִימוּ נֵס (ישעיהו ס\"ב), אָרִים נִסִּי (שם מ\"ט), כַנֵּס עַל הַגִּבְעָה (שם ל') – שֶׁהוּא זָקוּף:<br><br><b>ובעבור תהיה יראתו.<\/b> עַל יְדֵי שֶׁרְאִיתֶם אוֹתוֹ יָראוּי וּמְאֻיָּם, תֵּדְעוּ כִּי אֵין זוּלָתוֹ וְתִירְאוּ מִפָּנָיו:", "rashi_en": "לבעבור נסות אתכם signifies, in order to exalt you in the world (Mekhilta) — that you may obtain a great name amongst the nations because He has revealed Himself to you in His Glory.<br><br>נסות has the sense of exalting and greatness, of similar meaning and root to, (Isaiah 62:10) “Lift up an ensign (נס)”; (Isaiah 49:22) “I will lift up my standard (נסי)”; (Isaiah 30:17) “as an ensign (כנס) on a hill” — and an ensign is called נס because it is something raised on high.<br><br>ובעבור תהיה יראתו AND THAT HIS FEAR MAY BE [BEFORE YOUR FACES] — Through the fact that you see that He is feared and dreaded you will know that there is none beside Him and you will therefore fear Him and not sin."}, {"ch": 20, "v": 18, "aliyah": 7, "heb": "וַיַּעֲמֹ֥ד הָעָ֖ם מֵרָחֹ֑ק וּמֹשֶׁה֙ נִגַּ֣שׁ אֶל־הָֽעֲרָפֶ֔ל אֲשֶׁר־שָׁ֖ם הָאֱלֹהִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְקָם עַמָא מֵרָחִיק וּמשֶׁה קָרֵב לְצַד אַמִיטְתָא דִתַמָן <b>יְקָרָא דַ<\/b>יְיָ:", "onk_en": "The people stood far off. Moshe drew near to the dense cloud where [<b>the Glory of<\/b>] [the Divine Presence of] God was.", "pj": "וְקָם עַמָּא תְּרֵיסַר מִילִין מֵרָחִיק וּמשֶׁה קָרֵיב לְצֵית אַמִיטְתָא דְתַּמָּן יְקַר שְׁכִינְתָּא דַיְיָ", "pj_en": "And the people stood twelve miles off; but Mosheh drew near to the height of the darkness where was the glory of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>נגש אל הערפל.<\/b> לִפְנִים מִשָּׁלֹשׁ מְחִצּוֹת: חֹשֶׁךְ, עָנָן, וַעֲרָפֶל; שֶׁנֶּאֱמַר וְהָהָר בֹּעֵר בָּאֵשׁ עַד לֵב הַשָּׁמַיִם חֹשֶׁךְ עָנָן וַעֲרָפֶל (דברים ד'); עֲרָפֶל הוּא עַב הֶעָנָן שֶׁאָמַר לוֹ הִנֵּה אָנֹכִי בָּא אֵלֶיךָ בְּעַב הֶעָנָן (שמות י\"ט):", "rashi_en": "נגש אל הערפל [AND MOSES] STEPPED NEAR TO THE THICK CLOUD — within the three divisions — darkness, cloud and thick cloud (Mekhilta), as it is said, (Deuteronomy 4:11) “And the mountain burned with fire unto the midst of the heaven, with darkness, clouds and dark clouds”. The ערפל is the עב הענן of which God spoke to him when He said, (19:9) “Behold I come unto thee in a thick cloud (עב הענן)” (cf. Rashi on that verse)."}, {"ch": 20, "v": 19, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל־בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן־הַשָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּכֶֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה כִּדְנַן תֵּימַר לִבְנֵי יִשְׂרָאֵל אַתּוּן חֲזִיתּוּן אֲרֵי מִן שְׁמַיָא מַלֵילִית עִמְכוֹן:", "onk_en": "Adonoy said to Moshe, “This is what you must say to the Bnei Yisrael. ‘You have seen that I have spoken to you from heaven.", "pj": "וַאֲמַר יְיָ לְמשֶׁה כִּדְנָא תֵימַר לִבְנֵי יִשְרָאֵל אַתּוּן חֲמִיתּוּן אֲרוּם מִן שְׁמַיָא מַלֵּילִית עִמְכוֹן", "pj_en": "And the Lord said to Mosheh, Speak thus to the sons of Israel: You have seen that from the heavens I have spoken with you;", "tj": "", "tj_en": "", "rashi": "<b>כה תאמר.<\/b> בַּלָּשׁוֹן הַזֶּה:<br><br><b>אתם ראיתם.<\/b> יֵשׁ הֶפְרֵשׁ בֵּין מַה שֶּׁאָדָם רוֹאֶה לְמַה שֶּׁאֲחֵרִים מְשִׂיחִין לוֹ, שֶׁמַּה שֶּׁאֲחֵרִים מְשִׂיחִין לוֹ פְּעָמִים שֶׁלִּבּוֹ חָלוּק מִלְּהַאֲמִין (מכילתא):<br><br><b>כי מן השמים דברתי.<\/b> וְכָתוּב אֶחָד אוֹמֵר וַיֵּרֶד ה' עַל הַר סִינַי (שמות י\"ט), בָּא הַכָּתוּב הַשְּׁלִישִׁי וְהִכְרִיעַ בֵּינֵיהֶם – מִן הַשָּׁמַיִם הִשְׁמִיעֲךָ אֶת קוֹלוֹ לְיַסְּרֶךָּ וְעַל הָאָרֶץ הֶרְאֲךָ אֶת אִשּׁוֹ הַגְּדוֹלָה (דברים ד'), כְּבוֹדוֹ בַּשָּׁמַיִם וְאִשּׁוֹ וּגְבוּרָתוֹ עַל הָאָרֶץ; דָּ\"אַ: הִרְכִּין שָׁמַיִם וּשְׁמֵי הַשָּׁמַיִם וְהִצִּיעָן עַל הָהָר, וְכֵן הוּא אוֹמֵר וַיֵּט שָׁמַיִם וַיֵּרַד (תהילים י\"ח):", "rashi_en": "כה תאמר THUS THOU SHALT SAY — in this (the Holy) language (Mekhilta).<br><br>אתם ראיתם YE HAVE SEEN — There is a difference between what a person himself sees and what others relate to him, for what others relate to him sometimes his heart is divided in its opinion so that he does not believe (Mekhilta).<br><br>כי מן השמים דברתי THAT I HAVE SPOKEN [TO YOU] FROM HEAVEN — But another verse states, (Exodus 19:20) “And the Lord came down upon mount Sinai”, and thus the two verses appear to be contradictory! There now comes a third verse and harmonises them: (Deuteronomy 4:36) “Out of heaven He made thee hear His voice that He might instruct thee; and upon the earth He showed thee His great fire” — His glory was in the heavens but His fire and His power were upon the earth. Another explanation: He bent down the heavens and the heavens of heavens, and spread them out upon the mountain; similarly it states, (Psalms 18:10) “He bowed the heavens and came down” (Mekhilta) ."}, {"ch": 20, "v": 20, "aliyah": 7, "heb": "לֹ֥א תַעֲשׂ֖וּן אִתִּ֑י אֱלֹ֤הֵי כֶ֙סֶף֙ וֵאלֹהֵ֣י זָהָ֔ב לֹ֥א תַעֲשׂ֖וּ לָכֶֽם׃", "onk": "לָא תַעְבְּדוּן <b>קֳדָמָי<\/b> דַחֲלָן דִכְסַף וְדַחֲלָן דִדְהַב לָא תַעְבְּדוּן לְכוֹן:", "onk_en": "Do not make[an image of anything that is] with [<b>before<\/b>] Me, gods of silver or gods of gold you must not make for yourselves.", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תַעַבְדוּן לְמִסְגוֹד דְּמוּת שִׁמְשָׁא וְסִיהֲרָא וְכוֹכְבַיָא וּמַזְלַיָא וּמַלְאָכַיָא דִמְשַׁמְשִׁין קֳדָמוֹי דַּחֲלָן דִּכְסַף וְדַחֲלָן דִּדְהַב לָא תַעַבְדוּן לְכוֹן", "pj_en": "sons of Israel, My people, you shall not make, that you may worship, the likeness of the sun or the moon or the stars, or the planets, or the angels who minister before Me; idols of silver, nor idols of gold, ye shall not make to you.", "tj": "", "tj_en": "", "rashi": "<b>לא תעשון אתי.<\/b> לֹא תַעֲשׂוּן דְּמוּת שַׁמָּשַׁי הַמְשַׁמְּשִׁים לְפָנַי בַּמָּרוֹם (מכילתא):<br><br><b>אלהי כסף.<\/b> בָּא לְהַזְהִיר עַל הַכְּרוּבִים שֶׁאַתָּה עוֹשֶׂה לַעֲמֹד אִתִּי, שֶׁלֹּא יִהְיוּ שֶׁל כֶּסֶף, שֶׁאִם שִׁנִּיתֶם לַעֲשׂוֹתָם שֶׁל כֶּסֶף הֲרֵי הֵן לְפָנַי כֶּאֱלוֹהוּת:<br><br><b>ואלהי זהב.<\/b> בָּא לְהַזְהִיר שֶׁלֹּא יוֹסִיף עַל שְׁנַיִם, שֶׁאִם עָשִׂיתָ אַרְבָּעָה הֲרֵי הֵן לְפָנַי כֵּאלֹהֵי זָהָב (מכילתא):<br><br><b>לא תעשו לכם.<\/b> לֹא תֹאמַר הֲרֵינִי עוֹשֶׂה כְרוּבִים בְּבָתֵּי כְנֵסִיּוֹת וּבְבָתֵּי מִדְרָשׁוֹת כְּדֶרֶךְ שֶׁאֲנִי עוֹשֶׂה בְּבֵית עוֹלָמִים, לְכָךְ נֶאֱמַר לֹא תַעֲשׂוּ לָכֶם (שם):", "rashi_en": "לא תעשון אתי YE SHALL NOT MAKE WITH ME — Ye shall not make an image of My ministers that minister before Me in the heights (Mekhilta).<br><br>אלהי כסף GODS OF SILVER — This statement is intended to lay down a prohibition regarding the Cherubim which you will make to stand with Me — that they shall not be made of silver, for if you make any alteration in them by making them of silver and not of gold they will be before me (regarded by Me) as idols.<br><br>ואלהי זהב AND GODS OF GOLD — This statement is intended to lay down a prohibition that one may not add to the number of two Cherubim which are prescribed: for if you make four they will be regarded by Me as gods of gold (Mekhilta).<br><br>לא תעשו לכם YE SHALL NOT MAKE FOR YOURSELVES — Ye shall not say: Behold I will make Cherubim in the Synagogues and the Houses of Study of the same kind as I make in the House of Eternity (a term for the Temple at Jerusalem); on this account it states: “ye shall not make for yourselves” (Mekhilta)."}, {"ch": 20, "v": 21, "aliyah": 7, "heb": "מִזְבַּ֣ח אֲדָמָה֮ תַּעֲשֶׂה־לִּי֒ וְזָבַחְתָּ֣ עָלָ֗יו אֶת־עֹלֹתֶ֙יךָ֙ וְאֶת־שְׁלָמֶ֔יךָ אֶת־צֹֽאנְךָ֖ וְאֶת־בְּקָרֶ֑ךָ בְּכׇל־הַמָּקוֹם֙ אֲשֶׁ֣ר אַזְכִּ֣יר אֶת־שְׁמִ֔י אָב֥וֹא אֵלֶ֖יךָ וּבֵרַכְתִּֽיךָ׃", "onk": "מַדְבַּח אַדְמְתָא תַּעְבֵּד <b>קֳדָמַי<\/b> וּתְהֵי דַבָּח עֲלוֹהִי י
