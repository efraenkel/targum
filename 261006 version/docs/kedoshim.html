<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "kedoshim";
const DATA = [{"ch": 19, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 2, "aliyah": 1, "heb": "דַּבֵּ֞ר אֶל־כׇּל־עֲדַ֧ת בְּנֵי־יִשְׂרָאֵ֛ל וְאָמַרְתָּ֥ אֲלֵהֶ֖ם קְדֹשִׁ֣ים תִּהְי֑וּ כִּ֣י קָד֔וֹשׁ אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "מַלֵּל עִם כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן קַדִּישִׁין תְּהוֹן אֲרֵי קַדִּישׁ אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "Speak to the entire congregation [of] Bnei Yisroel and say to them: You shall be holy, for I, Adonoy, your God, am holy.", "pj": "מַלֵיל עִם כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל וְתֵימַר לְהוֹן קַדִישִׁין תְּהוֹן אֲרוּם קַדִישׁ אֲנָא יְיָ אֳלָהָכוֹן", "pj_en": "Speak with the whole congregation of the sons of Israel, and say to them: Ye, shall be holy, for I the Lord your God am Holy.", "tj": "", "tj_en": "", "rashi": "<b>דבר אל כל עדת בני ישראל.<\/b> מְלַמֵּד שֶׁנֶּאֶמְרָה פָרָשָׁה זוֹ בְּהַקְהֵל מִפְּנֵי שֶׁרֹב גּוּפֵי תוֹרָה תְלוּיִּין בָּהּ (ספרא):<br><br><b>קדשים תהיו.<\/b> הֱווּ פְרוּשִׁים מִן הָעֲרָיוֹת וּמִן הָעֲבֵרָה, שֶׁכָּל מָקוֹם שֶׁאַתָּה מוֹצֵא גֶדֶר עֶרְוָה אַתָּה מוֹצֵא קְדֻשָּׁה, אִשָּׁה זֹנָה וַחֲלָלָה וְגוֹ' אֲנִי ה' מְקַדִּשְׁכֶם (ויקרא כ\"א), וְלֹא יְחַלֵּל זַרְעוֹ, אֲנִי ה' מְקַדְּשׁוֹ (שם), קְדֹשִׁים יִהְיוּ, אִשָּׁה זֹנָה וַחֲלָלָה (שם):", "rashi_en": "דבר אל כל עדת בני ישראל SPEAK UNTO ALL THE CONGREGATION OF THE CHILDREN OF ISRAEL — This (the addition of the words כל עדת) teaches us that this section was proclaimed in full assembly because most of the fundamental teachings of the Torah are dependent on it (contained in it) (Sifra, Kedoshim, Section 1 1; Vayikra Rabbah 24:5).<br><br>קדשים תהיו YE SHALL BE HOLY — This means, keep aloof from the forbidden sexual relations just mentioned and from sinful thoughts. [It is evident that this is the meaning of קדשים תהיו because] wherever you find in the Torah a command to fence yourself in against such relations you also find mention of “holiness\". Examples are: (Leviticus 21:7) “[They shall not take] a wife that is a harlot, or a profane etc.\", and in the next verse \"for I, the Lord, who sanctifieth you, [am holy]\"; (Leviticus 21:15) “Neither shall he profane his seed (by the forbidden unions mentioned in the preceding verses) for I the Lord do sanctify him\"; (Leviticus 21:6) \"They shall be holy… followed by (v. 7) \"[they shall not take] a wife that is a harlot or a profane\" (cf. Vayikra Rabbah 24:4-6)."}, {"ch": 19, "v": 3, "aliyah": 1, "heb": "אִ֣ישׁ אִמּ֤וֹ וְאָבִיו֙ תִּירָ֔אוּ וְאֶת־שַׁבְּתֹתַ֖י תִּשְׁמֹ֑רוּ אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "גְּבַר מִן אִמֵּיהּ וּמִן אֲבוּהִי תְּהוֹן דָּחֲלִין וְיָת <b>יוֹמֵי<\/b> שַׁבַּיָּא דִילִי תִּטְרוּן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "A man—you shall fear his mother and father and keep [<b>the days of<\/b>] My Sabbaths, I am Adonoy, your God.", "pj": "גְבַר מִן אִימֵיהּ וּמִן אָבוֹי תֶּהֱווֹן דַחֲלִין וְיַת יוֹמֵי שַׁבַּיָא דִילִי תִנְטְרוּן אֲנָא יְיָ אֳלָהָכוֹן", "pj_en": "Let every man revere his mother and his father, and keep the days of My Sabbaths: I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>איש אמו ואביו תיראו.<\/b> כָּל אֶחָד מִכֶּם תִּירְאוּ אָבִיו וְאִמּוֹ, זֶהוּ פְשׁוּטוֹ; וּמִדְרָשׁוֹ: אֵין לִי אֶלָּא אִישׁ, אִשָּׁה מִנַּיִן? כְּשֶׁהוּא אוֹמֵר תִּירָאוּ הֲרֵי כָאן שְׁנַיִם, אִם כֵּן לָמָּה נֶאֱמַר אִישׁ? שֶׁהָאִישׁ סֵפֶק בְּיָדוֹ לַעֲשׂוֹת אֲבָל אִשָּׁה רְשׁוּת אֲחֵרִים עָלֶיהָ (ספרא; קידושין ל'):<br><br><b>אמו ואביו תיראו.<\/b> כָּאן הִקְדִּים אֵם לָאָב, לְפִי שֶׁגָּלוּי לְפָנָיו שֶׁהַבֵּן יָרֵא אֶת אָבִיו יוֹתֵר מֵאִמּוֹ, וּבַכָּבוֹד הִקְדִּים אָב לָאֵם, לְפִי שֶׁגָּלוּי לְפָנָיו שֶׁהַבֵּן מְכַבֵּד אֶת אִמּוֹ יוֹתֵר מֵאָבִיו, מִפְּנֵי שֶׁמְּשַׁדַּלְתּוֹ בִדְבָרִים (שם):<br><br><b>ואת שבתתי תשמרו.<\/b> סָמַךְ שַׁבָּת לְמוֹרָא אָב, לוֹמַר אַף עַל פִּי שֶׁהִזְהַרְתִּיךָ עַל מוֹרָא אָב, אִם יֹאמַר לְךָ חַלֵּל אֶת הַשַּׁבָּת, אַל תִּשְׁמַע לוֹ, וְכֵן בִּשְׁאָר כָּל הַמִּצְווֹת (בבא מציעא ל\"ב):<br><br><b>אני ה' אלהיכם.<\/b> אַתָּה וְאָבִיךָ חַיָּבִים בִּכְבוֹדִי, לְפִיכָךְ לֹא תִשְׁמַע לוֹ לְבַטֵּל אֶת דְּבָרַי. אֵיזֶהוּ מוֹרָא? לֹא יֵשֵׁב בִּמְקוֹמוֹ וְלֹא יְדַבֵּר בִּמְקוֹמוֹ וְלֹא יִסְתֹּר אֶת דְּבָרָיו, וְאֵיזֶהוּ כָבוֹד? מַאֲכִיל וּמַשְׁקֶה, מַלְבִּישׁ וּמַנְעִיל, מַכְנִיס וּמוֹצִיא (קידושין ל\"א):", "rashi_en": "איש אמו ואביו תראו means, EVERYONE OF YOU SHALL FEAR HIS MOTHER AND HIS FATHER; this is the literal sense. The Halachic explanation of the verse, however, is as follows: Since Scripture says איש I have here only the law that a man must fear his father and his mother, whence do I know that this applies also to a woman? Because Scripture states תיראו (in the plural), it is evident therefore that it speaks here of two (man and woman). But if this be so (that Scripture means to include a woman also) why does it use the term איש, a man? Because it is the man who has the means to do it, whilst the woman is under the control of others (what she does is dependent upon her husband’s consent)(Sifra, Kedoshim, Section 1 3; Kiddushin 30b).<br><br>אמו ואביו תיראו EVERYBODY OF YOU SHALL FEAR HIS MOTHER AND HIS FATHER — Here Scripture mentions the mother before the father because it is manifest to Him that the child fears the father more than the mother and therefore by mentioning the mother first Scripture stresses the duty of fearing her. In the case of honoring one's parents, however, Scripture mentions the father before the mother because it is manifest to Him that the child honors the mother more than the father because she endeavors to win him over by kindly words. Therefore by mentioning the father first Scripture emphasizes the duty of honoring him (Kiddushin 30b - Kiddushin 31a).<br><br>ואת שבתתי תשמרו AND MY SABBATHS SHALL YE KEEP — Scripture places the commandment of observing the Sabbath immediately after that of fearing one’s father in order to suggest the following: “Although I admonish you regarding the fear due to your father, yet if he bids you: \"Desecrate the Sabbath\", do not listen to him” — and the same is the case with any of the other commandments. This, it is evident, is the meaning since Scripture adds  —<br><br>אני ה' אלהיכם  “I am the Lord your God\" (the plural) — both you and your father are equally bound to honour Me! Do not therefore obey him if it results in making My words of no effect (Sifra, Kedoshim, Section 1 10; Bava Metzia 32a). — What is implied in  the term מורא? That one should not sit in his (the father's) seat, nor speak in his stead (i. e. when he is expected to speak), nor contradict his words. And what is implied in the term כבוד? That the child gives the parents to eat and to drink, provides them with clothes and shoes, leads them into the room and out if they are infirm (Kiddushin 31b)."}, {"ch": 19, "v": 4, "aliyah": 1, "heb": "אַל־תִּפְנוּ֙ אֶל־הָ֣אֱלִילִ֔ם וֵֽאלֹהֵי֙ מַסֵּכָ֔ה לֹ֥א תַעֲשׂ֖וּ לָכֶ֑ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "לָא תִתְפְּנוּן בָּתַר <b>טַעֲוָן<\/b> וְדַחֲלָן דְּמַתְּכָא לָא תַעְבְּדוּן לְכוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "Do not turn to the [<b>false<\/b>] idols and do not make molten gods for yourselves, I am Adonoy, your God.", "pj": "לָא תִסְטוּן לְפוּלְחַן טַעֲוָון וְדַחֲלָן דְמַתְּכָא לָא תַעַבְדוּן לְכוֹן אֲנָא יְיָ אֳלָהָכוֹן", "pj_en": "Go not astray after the worship of idols, nor make gods for yourselves that are molten: I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>אל תפנו אל האלילם.<\/b> לְעָבְדָם; אֱלִילִים לְשׁוֹן אַל — כְּלֹא הוּא חָשׁוּב:<br><br><b>ואלהי מסכה.<\/b> תְּחִלָּתָן אֱלִילִים הֵם, וְאִם אַתָּה פוֹנֶה אַחֲרֵיהֶם סוֹפְךָ עוֹשֶׂה אוֹתָם אֱלוֹהוֹת (ספרא):<br><br><b>לא תעשו לכם.<\/b> לֹא תַעֲשׂוּ לַאֲחֵרִים וְלֹא אֲחֵרִים לָכֶם; וְאִם תֹּאמַר לֹא תַעֲשׂוּ לְעַצְמְכֶם אֲבָל אֲחֵרִים עוֹשִׂין לָכֶם, הֲרֵי כְבָר נֶאֱמַר לֹא יִהְיֶה לְךָ (שמות כ') — לֹא שֶׁלְּךָ וְלֹא שֶׁל אֲחֵרִים:", "rashi_en": "אל תפנו אל האלילים TURN YE NOT UNTO THE IDOLS — to worship them (Sifra, Kedoshim, Section 1 10). The word אלילים, idols, is connected with “not“ (אל) — it is regarded of “none\" import.<br><br>ואלהי מסכה [NOR MAKE TO YOURSELVES] MOLTEN GODS - In the beginning they may appear as “nought\" (אלילים) but if you turn unto them you will in the end make them gods (Sifra, Kedoshim, Section 1 11). The translation therefore is: do not turn unto these “non-entities\", so that you may not in the end make them into molten gods for yourselves.<br><br>לא תעשו לכם implies: do not you make molten gods for others nor let others make such for you. Should you, however, say that לא תעשו לכם implies only “you shall not make them for yourselves\" but others may make them for you, then I reply: But Scripture has already stated (Exodus 20:3) “Thou shalt have [no other gods]” — neither your own idol nor one which is the idol of (made by) others (Sifra, Kedoshim, Section 1 12)."}, {"ch": 19, "v": 5, "aliyah": 1, "heb": "וְכִ֧י תִזְבְּח֛וּ זֶ֥בַח שְׁלָמִ֖ים לַיהֹוָ֑ה לִֽרְצֹנְכֶ֖ם תִּזְבָּחֻֽהוּ׃", "onk": "וַאֲרֵי תִכְּסוּן נִכְסַת <b>קוּדְשַׁיָּא קֳדָם<\/b> יְיָ לְרַעֲוָא לְכוֹן תִּכְּסֻנֵּיהּ:", "onk_en": "When you slaughter a peace[<b>sacred<\/b>]-offering to [<b>before<\/b>] Adonoy, you shall slaughter it to be acceptable for you.", "pj": "וַאֲרוּם תִּיכְסוּן נִכְסַת קוּדְשַׁיָא קֳדָם יְיָ לְרַעֲוָא לְכוֹן תֵּיכְסוּנֵיהּ", "pj_en": "And when you sacrifice the consecrated victims before the Lord, you shall make the sacrifice acceptable.", "tj": "", "tj_en": "", "rashi": "<b>וכי תזבחו וגו'.<\/b> לֹא נֶאֶמְרָה פָרָשָׁה זוֹ אֶלָּא לְלַמֵּד, שֶׁלֹּא תְהֵא זְבִיחָתָן אֶלָּא עַל מְנָת לֵאָכֵל בְּתוֹךְ הַזְּמַן הַזֶּה, שֶׁאִם לִקְבֹּעַ לָהֶם זְמַן אֲכִילָה, הֲרֵי כְבָר נֶאֱמַר (ויקרא ז') וְאִם נֶדֶר אוֹ נְדָבָה זֶבַח קָרְבָּנוֹ וְגוֹ' (ספרא):<br><br><b>לרצנכם תזבחהו.<\/b> תְּחִלַּת זְבִיחָתוֹ תְּהֵא עַל מְנָת נַחַת רוּחַ — שֶׁיְּהֵא לָכֶם לְרָצוֹן, שֶׁאִם תְּחַשְּׁבוּ עָלָיו מַחֲשֶׁבֶת פְּסוּל לֹא יֵרָצֶה עֲלֵיכֶם לְפָנַי:<br><br><b>לרצנכם.<\/b> אפיי\"צימנטו, זֶהוּ לְפִי פְשׁוּטוֹ; וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן לַמִּתְעַסֵּק בַּקֳּדָשִׁים שֶׁפָּסוּל, שֶׁצָּרִיךְ שֶׁיִּתְכַּוֵּן לִשְׁחֹט (זבחים מ\"ז; חולין י\"ג):", "rashi_en": "'וכי תזבחו וגו‎‎ AND IF YE SACRIFICE [A SACRIFICE OF PEACE OFFERINGS UNTO THE LORD, YE SHALL SACRIFICE IT TO BE ACCEPTABLE TO YOU] — This section is said only for the purpose of teaching us that their (the peace offerings’) slaughtering must not take place except with the intention that they should be eaten within this time (the time prescribed v. 6); for if its purpose were to fix the time for eating them it would be redundant, since it is already said (Leviticus 7:16) “But if the sacrifice of his offering be a vow, or a free-will offering [it shall be eaten the same day… and on the morrow” (Sifra, Kedoshim, Chapter 1 1).<br><br>לרצנכם תזבחהו YE SHALL SACRIFICE IT TO BE ACCEPTABLE FOR YOU — This means, from the very beginning the slaughtering shall be done with the intention to give Me satisfaction (i. e. to sacrifice it in a manner that is satisfactory to Me) so that it shall effect favour for you (לרצנכם). For if you have in connection with it (with the slaughtering) any intention which will invalidate it (the sacrifice) it shall effect no favour for you before Me.<br><br>לרצנכם  thus means as much as apaisement in O. F., — “favourable acceptance”. This is the literal meaning of the verse. Our Rabbis, however, (taking the word in its primary sense of will, “intention”) learned from here as regards one who is handling (מתעסק) a sacrifice (קדשים) (when he does the act of Shechitah without the intention of doing this) that it becomes invalid, because it is required that he should intend to slaughter it (Zevachim 47a; Chullin 13a)."}, {"ch": 19, "v": 6, "aliyah": 1, "heb": "בְּי֧וֹם זִבְחֲכֶ֛ם יֵאָכֵ֖ל וּמִֽמׇּחֳרָ֑ת וְהַנּוֹתָר֙ עַד־י֣וֹם הַשְּׁלִישִׁ֔י בָּאֵ֖שׁ יִשָּׂרֵֽף׃", "onk": "בְּיוֹמָא דְיִתְנְכֵס יִתְאֲכֵל וּבְיוֹמָא דְבַתְרוֹהִי וּדְאִשְׁתָּאַר עַד יוֹמָא תְלִיתָאָה בְּנוּרָא יִתּוֹקָד:", "onk_en": "On the day that it is slaughtered it may be eaten and on the next day. Whatever is left over by the third day shall be burned in fire.", "pj": "בְּיוֹמָא דְיִתְנְכֵס יִתְאֲכֵיל וּבְיוֹמָא חוֹרַן וּמַה דְמִשְׁתַּיֵיר עַד יוֹמָא תְּלִיתָאָה בְּנוּרָא יִתּוֹקָד", "pj_en": "On the day that it is sacrificed you may eat of it, and on the day following; but what remaineth on the third day shall be burned with fire.", "tj": "", "tj_en": "", "rashi": "<b>ביום זבחכם יאכל.<\/b> כְּשֶׁתִּזְבְּחוּהוּ תִּשְׁחֲטוּהוּ עַל מְנָת זְמַן זֶה שֶׁקָּבַעְתִּי לָכֶם כְּבָר:", "rashi_en": "ביום זבחכם יאכל ON THE DAY YE SACRIFICE IT [SHALL IT BE EATEN] — This means, when ye slaughter it (וכי תזבחו) slaughter it (תשחטהו =תזבחהו) having in mind the period which I have already fixed for you as that within which it must be eaten (that which is mentioned already Leviticus 7:16)."}, {"ch": 19, "v": 7, "aliyah": 1, "heb": "וְאִ֛ם הֵאָכֹ֥ל יֵאָכֵ֖ל בַּיּ֣וֹם הַשְּׁלִישִׁ֑י פִּגּ֥וּל ה֖וּא לֹ֥א יֵרָצֶֽה׃", "onk": "וְאִם אִתְאֲכָלָא יִתְאֲכֵל בְּיוֹמָא תְלִיתָאָה <b>מְרָחָק<\/b> הוּא לָא יְהֵי לְרַעֲוָא:", "onk_en": "And if it should be eaten at all on the third day it is an abomination [<b>a rejection<\/b>], it will not be favorably accepted.", "pj": "וְאִין אִיתְאַכְלָא יִתְאֲכֵיל בְּיוֹמָא תְּלִיתָאָה פְּסִיל הוּא לָא יֶהֱוֵי לְרַעֲוָא", "pj_en": "But if it be indeed eaten on the third day, it is profaned, and shall not be accepted.", "tj": "", "tj_en": "", "rashi": "<b>ואם האכל יאכל וגו'.<\/b> אִם אֵינוֹ עִנְיָן לְחוּץ לִזְמַנּוֹ, שֶׁהֲרֵי כְבָר נֶאֱמַר וְאִם הֵאָכֹל יֵאָכֵל מִבְּשַׂר זֶבַח שְׁלָמָיו וְגוֹ' (ויקרא ז'), תְּנֵהוּ עִנְיָן לְחוּץ לִמְקוֹמוֹ; יָכוֹל יִהְיוּ חַיָּבִין כָּרֵת עַל אֲכִילָתוֹ, תַּ\"לֹ וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ עֲוֹנָהּ תִּשָּׂא, \"מִמֶּנּוּ\" וְלֹא מֵחֲבֵרוֹ, יָצָא הַנִּשְׁחָט בְּמַחֲשֶׁבֶת חוּץ לִמְקוֹמוֹ (זבחים כ\"ח):<br><br><b>פגול.<\/b> מְתֹעָב, כְּמוֹ וּמְרַק פִּגֻּלִים כְּלֵיהֶם (ישעיהו ס\"ה):", "rashi_en": "ואם האכל ‎'יאכל וגו‎‎‎ AND IF IT SHOULD BE EATEN AT ALL [ON THE THIRD DAY] etc. — If it (this verse) has no bearing on a sacrifice at the slaughtering of which there was the intention to eat its flesh beyond its (the prescribed) time, since it has already been stated, (Leviticus 7:18) “And if any of the flesh of the sacrifice is to be eaten (i. e. is intended to be eaten) at all [on the third day, it shall not be accepted]\" — then give it an application to a sacrifice at the slaughtering of which there was the intention of eating its flesh outside the prescribed place (e. g. in the case of a festival offering — outside the walls of Jerusalem) (Sifra, Kedoshim, Chapter 1 4). One might think that people are liable to excision for the eating of it (of such a sacrifice), Scripture therefore states in the case of the former (the חוץ לזמנו sacrifice) (Leviticus 7:18) “And the soul that eateth of it (ממנו) shall bear its iniquity\"; i. e. the soul that eateth of it, but not of the one similar to it (the חוץ למקומו sacrifice) shall bear its iniquity. This excludes therefore from the penalty of excision the case of a sacrifice which has been slaughtered with the intention that it should be eaten outside the prescribed place (Zevachim 28a). <br><br>פגול means abominable; similar is (Isaiah 65:4) \"and broth of abominable things (פגולים) is in their vessels\"."}, {"ch": 19, "v": 8, "aliyah": 1, "heb": "וְאֹֽכְלָיו֙ עֲוֺנ֣וֹ יִשָּׂ֔א כִּֽי־אֶת־קֹ֥דֶשׁ יְהֹוָ֖ה חִלֵּ֑ל וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵעַמֶּֽיהָ׃", "onk": "וּדְיֵיכְלִנֵּיהּ חוֹבֵיהּ יְקַבֵּל אֲרֵי יָת קוּדְשָׁא דַיְיָ אַחֵל וְיִשְׁתֵּיצֵי אֲנָשָׁא הַהוּא מְעַמֵּיהּ:", "onk_en": "Whoever eats from it shall bear his iniquity, for the sacred [things] of Adonoy he has defiled. That [persons] soul shall be cut off from its people.", "pj": "וּדְיֵיכְלִינֵיהּ חוֹבֵיהּ יְקַבֵּיל אֲרוּם יַת קוּדְשָׁא דַיְיָ אָפִיס וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא מִגוֹ עַמֵיהּ", "pj_en": "And he who eateth it shall receive (the penalty of) his sin; for he hath profaned the holy of the Lord, and that man shall be destroyed from among his people.", "tj": "", "tj_en": "", "rashi": "<b>ואכליו עונו ישא.<\/b> בְּנוֹתָר גָּמוּר הַכָּתוּב מְדַבֵּר, וְאֵינוֹ עָנוּשׁ כָּרֵת עַל הַנִּשְׁחָט חוּץ לִמְקוֹמוֹ, שֶׁכְּבָר מִעֲטוֹ הַכָּתוּב, וְזֶה בְּנוֹתָר גָּמוּר מְדַבֵּר, וּבְמַסֶּכֶת כָּרֵתוֹת (דף ה'), לְמָדוּהוּ מִגְּזֵרָה שָׁוָה:", "rashi_en": "ואכליו עונו ישא THEREFORE EVERYONE THAT EATETH IT SHALL BEAR HIS INIQUITY — Scripture is speaking here of flesh actually left unburnt on the third day (so that this verse must be connected with v. 6, and not with v. 7) since one is not liable to excision for eating that which was slaughtered with the intention to eat its flesh outside the prescribed place (of which v. 7 is speaking), because Scripture has already excluded such a case from the penalty of excision (cf. Rashi v. 7). This verse must therefore be speaking of actual נותר. In Treatise Keritot 5a they (our Rabbis) derived it (the fact that v. 8 refers back to נותר in 5:6) from a verbal analogy."}, {"ch": 19, "v": 9, "aliyah": 1, "heb": "וּֽבְקֻצְרְכֶם֙ אֶת־קְצִ֣יר אַרְצְכֶ֔ם לֹ֧א תְכַלֶּ֛ה פְּאַ֥ת שָׂדְךָ֖ לִקְצֹ֑ר וְלֶ֥קֶט קְצִֽירְךָ֖ לֹ֥א תְלַקֵּֽט׃", "onk": "וּבְמֶחְצָדְכוֹן יָת חֲצָדָא דְאַרְעֲכוֹן לָא תְשֵׁיצֵי פָּאתָא דְחַקְלָךְ לְמֶחְצָד וּלְקָטָא דַחֲצָדָךְ לָא תְלַקֵּט:", "onk_en": "When you will reap the harvest of your land, you shall not completely reap a corner of your field, and the gleanings of your harvest you shall not gather.", "pj": "וּבִזְמַן מַחֲצַדְכוֹן יַת חֲצָדָא דְאַרְעֲכוֹן לָא תְסַיְיפוּן אוּמָנָא חֲדָא דְאִית בְּחַקְלָךְ (ונ\"ל שצ\"ל למחצוד) לְמָחְזוֹר וְלִקְטָא דְחַצְדָךְ לָא תְלַקֵט", "pj_en": "And in the time that you reap the harvest of your land you shall not finish one corner that is in the circuit of thy field, and the (full) ingathering of thy harvest thou shalt not collect.", "tj": "וּבַחֲצַדְכוֹן יַת חֲצַד אַרְעֲכוֹן לָא תְשֵׁיצוּן אוֹמַן אוֹחֲרַיָא דְאִית בְּחַקְלֵיכוֹן לְמֵחֲצוֹד וְלָקַט חֲצַדְכוֹן לָא תְלַקְטוּן:", "tj_en": "And when you reap the harvest of your land, thou shalt not altogether finish gathering what is in your fields, and the (full) collection of your harvest you shall not gather in;", "rashi": "<b>לא תכלה פאת שדך.<\/b> שֶׁיַּנִּיחַ פֵּאָה בְסוֹף שָׂדֵהוּ (עי' ספרא):<br><br><b>ולקט קצירך.<\/b> שִׁבֳּלִים הַנּוֹשְׁרִים בִּשְׁעַת קְצִירָה, אַחַת אוֹ שְׁתַּיִם, אֲבָל שָׁלוֹשׁ אֵינָן לֶקֶט (פאה פ\"ו):", "rashi_en": "לא תכלה פאת שדך THOU SHALT NOT WHOLLY REAP THE CORNER OF THY FIELD — This means that one must leave פאה (an uncut portion) at the extremity of one's field (cf. Sifra, Kedoshim, Chapter 1 9; Mishna Peah 1:2; Shabbat 23a).<br><br>ולקט קצירך [NEITHER SHALT THOU COLLECT] THE GLEANINGS OF THY HARVEST — Gleanings are ears that drop from the hand of the harvester during the reaping — one or two at a time, but three do not come under the category of לקט (Mishna Peah 6:5; Sanhedrin 99a)."}, {"ch": 19, "v": 10, "aliyah": 1, "heb": "וְכַרְמְךָ֙ לֹ֣א תְעוֹלֵ֔ל וּפֶ֥רֶט כַּרְמְךָ֖ לֹ֣א תְלַקֵּ֑ט לֶֽעָנִ֤י וְלַגֵּר֙ תַּעֲזֹ֣ב אֹתָ֔ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "וְכַרְמָךְ לָא תְעָלֵל וְנִתְרָא דְכַרְמָךְ לָא תְלַקֵּט לְעַנְיֵי וּלְגִיּוֹרֵי תִּשְׁבּוֹק יָתְהוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "You shall not glean your vineyard, and the fallen grapes of your vineyard, you shall not gather. For the poor and the proselyte you shall leave them, I am Adonoy, your God.", "pj": "וּכְרָמֵיכוֹן לָא תְבַעֲרוּן טוֹטְלְוַתְהוֹן וְנִתְרָא דְכַרְמָךְ לָא תְלַקֵט לַעֲנִיֵי וּלְגִיוֹרֵי תִּשְׁבּוֹק יַתְהוֹן בְּחִבּוּרֵיהוֹן אֲנָא הוּא יְיָ אֳלָהָכוֹן", "pj_en": "Neither mayest thou shake out thy vines; (the whole of) their bunches, and the remnant of thy vines thou shalt not gather: thou shalt leave them for the poor and for the strangers at the time of their collection: I am the Lord your God.", "tj": "וְכַרְמֵיכוֹן לָא תְבַעֲרוּן טוֹטְלָוַתְהוֹן וּפֶרֶט כַּרְמֵיכוֹן לָאתִלְקוֹטוּן:", "tj_en": "neither shake your vines of all their clusters, nor collect the fallen grapes of your vines.", "rashi": "<b>לא תעולל.<\/b> לֹא תִטֹּל עוֹלֵלוֹת שֶׁבָּהּ, וְהֵן נִכָּרוֹת; אֵיזֶהוּ עוֹלֵלוֹת? כֹּל שֶׁאֵין לוֹ לֹא כָתֵף וְלֹא נָטֵף (ספרא):<br><br><b>ופרט כרמך.<\/b> גַּרְגְּרֵי עֲנָבִים הַנּוֹשְׁרִים בִּשְׁעַת בְּצִירָה:<br><br><b>אני ה' אלהיכם.<\/b> דַּיָּן לִפָּרַע; וְאֵינִי גוֹבֶה מִכֶּם אֶלָּא נְפָשׁוֹת, שֶׁנֶּאֱמַר אַל תִּגְזָל דָּל וְגוֹ' כִּי ה' יָרִיב רִיבָם וְגוֹ' (משלי כ\"ב):", "rashi_en": "לא תעולל AND THOU SHALT NOT GLEAN [THY VINE YARD] — (עלל is a verb connected with the noun עולל \"young, tender, not developed\"; cf. Samuel 15:3: עולל ויונק) thus לא תעולל means, thou shalt not take the tender grapes of it. They can be recognized as such from the description given in Mishna Peah 7:4 (cf. also Sifra, Kedoshim, Chapter 3 3) where it is stated: What are עוללות? Clusters which have neither כתף, “arms\" nor נטף, \"drippings\".<br><br>ופרט כרמך [NEITHER SHALT THOU COLLECT] THE FALLEN GRAPES OF THY VINE YARD — i. e. the single berries of the grapes which fall to the ground during the grape gathering.<br><br>אני ה'‏‎‎‎‎‎ אלהיכם I AM THE LORD YOUR GOD — the Judge Who am certain to punish if necessary and Who for the neglect of these duties will exact from you nothing less than your souls, as it is said (Proverbs 22:22, 23) \"Rob not the poor… for the Lord will plead their cause, [and spoil the soul of those that spoiled them]\" (Sifra, Kedoshim, Chapter 3 7)."}, {"ch": 19, "v": 11, "aliyah": 1, "heb": "לֹ֖א תִּגְנֹ֑בוּ וְלֹא־תְכַחֲשׁ֥וּ וְלֹֽא־תְשַׁקְּר֖וּ אִ֥ישׁ בַּעֲמִיתֽוֹ׃", "onk": "לָא תִּגְנְבוּן וְלָא תְכַדְּבוּן וְלָא תְשַׁקְּרוּן אֱנַשׁ בְּחַבְרֵיהּ:", "onk_en": "You shall not steal. You shall not deny [a rightful claim] and each one of you shall not lie to each other.", "pj": "עַמִי בְּנֵי יִשְרָאֵל לָא תֶהֱווֹן גַנָבִין וְלָא תְכַפְּרוּן וְלָא תְשַׁקְרוּן אֵינַשׁ בְּחַבְרֵיהּ", "pj_en": "Sons of Israel, My people, you shall not steal, nor prevaricate, nor do fraudulently one man with his neighbour.", "tj": "", "tj_en": "", "rashi": "<b>לא תגנבו.<\/b> אַזְהָרָה לְגוֹנֵב מָמוֹן, אֲבָל לֹא תִגְנֹב שֶׁבַּעֲשֶׂרֶת הַדִּבְּרוֹת אַזְהָרָה לְגוֹנֵב נְפָשׁוֹת, דָּבָר הַלָּמֵד מֵעִנְיָנוֹ — דָּבָר שֶׁחַיָּבִין עָלָיו מִיתַת בֵּית דִּין:<br><br><b>ולא תכחשו.<\/b> לְפִי שֶׁנֶּאֱמַר (ויקרא ה'), וְכִחֶשׁ בָּהּ מְשַׁלֵּם קֶרֶן וְחֹמֶשׁ, לָמַדְנוּ עֹנֶשׁ, אַזְהָרָה מִנַּיִן? תַּ\"לֹ וְלֹא תְכַחֲשׁוּ:<br><br><b>ולא תשקרו.<\/b> לְפִי שֶׁנֶּאֱמַר (שם), וְנִשְׁבַּע עַל שָׁקֶר יְשַׁלֵּם קֶרֶן וְחֹמֶשׁ, לָמַדְנוּ עֹנֶשׁ, אַזְהָרָה מִנַּיִן? תַּ\"ל וְלֹא תְשַׁקְּרוּ:<br><br><b>לא תגנבו ולא תכחשו ולא תשקרו ולא תשבעו.<\/b> אִם גָּנַבְתָּ סוֹפְךָ לְכַחֵשׁ, סוֹפְךָ לְשַׁקֵּר, סוֹפְךָ לִשָּׁבַע לַשֶּׁקֶר:", "rashi_en": "לא תגנבו YE SHALL NOT STEAL — This is a warning addressed to him who steals money (the property of his fellow-man), but the law “Thou shalt not steal\" which is contained in the Ten Commandments is a warning addressed to him who steals a human being. For this it what is learnt from the context, because it must be a matter for which one becomes liable to death by sentence of the court, (since the preceding laws in the Ten Commandments are of this character, which is the case with kidnapping and not with theft of money; cf. Rashi on Exodus 19:14) (Mekhilta 20:13:3; Sanhedrin 86a).<br><br>ולא תכחשו NEITHER SHALL YE DEAL FALSELY [WITH ONE ANOTHER] — Since Scripture has stated (Leviticus 5:21, 22) \"[If a man sin… and deny unto his neighbour a charge, or a deposit… or has found that which was lost] and denieth it (וכחש בה)\", that he shall pay the principal and add a fifth part more thereto, we have there mention only of the punishment he incurs; whence do we derive the prohibition (i.e. where is it forbidden)? From Scripture's statement here “neither shall ye deal falsely\" (The Hebrew here is תכחשו, the same term as is used in the verse quoted — וכחש בה) (Sifra, Kedoshim, Section 2 3; Bava Kamma 105b).<br><br>ולא תשקרו NEITHER SHALL YE LIE [ONE TO ANOTHER] — Since Scripture has stated (V.  22) “[If a soul sin… and deny unto his neighbour a charge or a deposit…] and sweareth falsely (לשקר)\" that he shall pay the principal and shall add the fifth part more thereto, we have there mention only of the punishment he incurs; whence do we derive the prohibition to lie? From Scripture's statement here “ye shall not lie one to another”.<br><br>לא תגנבו ולא תכחשו ולא תשקרו ולא תשבעו YE SHALL NOT STEAL, NEITHER DEAL FALSELY, NEITHER LIE, NEITHER SWEAR [ONE TO ANOTHER] - If you steal you will in the end come to deny it, then you will lie (in order to back up your first denial), and ultimately you will swear falsely (Sifra, Kedoshim, Section 2 5)."}, {"ch": 19, "v": 12, "aliyah": 1, "heb": "וְלֹֽא־תִשָּׁבְע֥וּ בִשְׁמִ֖י לַשָּׁ֑קֶר וְחִלַּלְתָּ֛ אֶת־שֵׁ֥ם אֱלֹהֶ֖יךָ אֲנִ֥י יְהֹוָֽה׃", "onk": "וְלָא תִשָּׁבְעוּן בִּשְׁמִי לְשִׁקְרָא וְתַחֵל יָת שְׁמָא דֶאֱלָהָךְ אֲנָא יְיָ:", "onk_en": "You shall not swear falsely by My Name profaning the Name of your God, I am Adonoy.", "pj": "עַמִי בְּנֵי יִשְרָאֵל לָא יִשְׁתְּבַּע חַד מִנְכוֹן בִּשְׁמִי לְשִׁיקְרָא לְאַפְסָא יַת שְׁמָא דֶאֱלָהָךְ אֲנָא יְיָ", "pj_en": "Sons of Israel, My people, let no one of you swear by My Name in vain, to profane the Name of thy God: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ולא תשבעו בשמי.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר לֹא תִשָּׂא אֶת שֵׁם ה' אֱלֹהֶיךָ לַשָּׁוְא (שמות כ'), יָכוֹל לֹא יְהֵא חַיָּב אֶלָּא עַל שֵׁם הַמְיֻחָד, מִנַּיִן לְרַבּוֹת כָּל הַכִּנּוּיִין? תַּ\"ל וְלֹא תִשָּׁבְעוּ בִשְׁמִי לַשָּׁקֶר — כָּל שֵׁם שֶׁיֵּשׁ לִי (ספרא):", "rashi_en": "ולא תשבעו בשמי AND YE SHALL NOT SWEAR BY MY NAME [TO A LIE] -  Why is this stated at all (how does the particular form of words used  here tell us more than is contained in the Third Commandment)? Since it is said (Exodus 20:7) “Thou shalt not take the name of the Lord (‎'ה) thy God in vain”, I might have inferred that one is not liable except he swore by the \"Proper Name” of the Lord (שם המיוחד). Whence do I know that all names that are descriptive of God's attributes (Adonay, Rachum, Chanun etc.) are included in this prohibition? Because Scripture states “ye shall not swear by My Name to a lie\", thus implying by any Name I have (Sifra, Kedoshim, Section 2 6)."}, {"ch": 19, "v": 13, "aliyah": 1, "heb": "לֹֽא־תַעֲשֹׁ֥ק אֶת־רֵֽעֲךָ֖ וְלֹ֣א תִגְזֹ֑ל לֹֽא־תָלִ֞ין פְּעֻלַּ֥ת שָׂכִ֛יר אִתְּךָ֖ עַד־בֹּֽקֶר׃", "onk": "לָא תַעֲשׁוֹק יָת חַבְרָךְ וְלָא <b>תְאַנֵּס<\/b> לָא <b>תְבִית<\/b> אַגְרָא דַאֲגִירָא לְוָתָךְ עַד צַפְרָא:", "onk_en": "You shall not withhold the wages of your fellow [Jew] and you shall not rob [<b>oppress<\/b>]. It shall not remain overnight, [<b>You shall not withhold<\/b>] the wages of a day-laborer, keeping it in your possession until morning.", "pj": "לָא תִטְלוּם יַת חַבְרָךְ וְלָא תָנִיס וְלָא תְבִית סוּטְרָא דְאַגִירָא לִמְעַכְּבָא גַבָּךְ עַד צַפְרָא", "pj_en": "Thou shalt not be oppressive (hard) upon thy neighbour, nor take away by force, nor let the hire of the hireling be remaining all night at thy side until the morning.", "tj": "", "tj_en": "", "rashi": "<b>לא תעשק.<\/b> זֶה הַכּוֹבֵשׁ שְׂכַר שָׂכִיר (בבא מציעא ס\"א):<br><br><b>לא תלין.<\/b> לְשׁוֹן נְקֵבָה, מוּסָב עַל הַפְּעוּלָה:<br><br><b>עד בקר.<\/b> בִּשְׂכִיר יוֹם הַכָּתוּב מְדַבֵּר, שֶׁיְּצִיאָתוֹ מִשֶּׁשָּׁקְעָה חַמָּה, לְפִיכָךְ זְמַן גִּבּוּי שְׂכָרוֹ כָּל הַלָּיְלָה, וּבְמָקוֹם אַחֵר הוּא אוֹמֵר וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ (דברים כ\"ד), מְדַבֵּר בִּשְֹכִיר לַיְלָה, שֶׁהַשְׁלָמַת פְּעֻלָּתוֹ מִשֶּׁיַּעֲלֶה עַמּוּד הַשַּׁחַר, לְפִיכָךְ זְמַן גִּבּוּי שְׂכָרוֹ כָּל הַיּוֹם, לְפִי שֶׁנָּתְנָה תוֹרָה זְמַן לְבַעַל הַבַּיִת עוֹנָה לְבַקֵּשׁ מָעוֹת (בבא מציעא ק\"י):", "rashi_en": "לא תעשק THOU SHALT NOT WRONG [THY FELLOW-MAN] — This refers to one who withholds the wages of a hired servant (Sifra, Kedoshim, Section 2 9; Bava Metzia 61a).<br><br>לא תלין The word תלין is feminine gender and refers to the wages.<br><br>עד בקר UNTIL THE MORNING — Scripture speaks here of  a person hired for day-work (שכיר יום) whose departure from work is at sunset. The time for drawing his wages is therefore the whole night (and the law is not infringed provided he pays it before the moment of day break). In another passage (Deuteronomy 24:14) it states, \"the sun shall not go down upon it (the man's wages)”. There, however, it is speaking of one hired for night-work (שכיר לילה) the end of whose period of work is at day break, therefore the time for drawing his wages is the whole day (but it must be done before sunset). The reason why he has the whole night or whole day to pay the wages is because the Torah gives the employer the time of one \"Ona\" (one half of the astronomical day; cf. for the meaning of the word Niddah 65b) to endeavour to obtain the money he requires for paying the wages (Bava Metzia 110b)."}, {"ch": 19, "v": 14, "aliyah": 1, "heb": "לֹא־תְקַלֵּ֣ל חֵרֵ֔שׁ וְלִפְנֵ֣י עִוֵּ֔ר לֹ֥א תִתֵּ֖ן מִכְשֹׁ֑ל וְיָרֵ֥אתָ מֵּאֱלֹהֶ֖יךָ אֲנִ֥י יְהֹוָֽה׃", "onk": "לָא תְלוּט <b>דְּלָא שָׁמַע<\/b> וְקֳדָם <b>דְּלָא חָזֵי<\/b> לָא תְשִׂים תַּקְלָא וְתִדְחַל מֵאֱלָהָךְ אֲנָא יְיָ:", "onk_en": "You shall not curse a deaf person [<b>who can not hear<\/b>] and before a blind person [<b>who can not see<\/b>] you shall not place a stumbling-block; you shall fear your God, I am Adonoy.", "pj": "לָא תְלוּטוּן מַן דְלָא שְׁמַע וּקֳדָם סוּמַיָא לָא תְשַׁווּן תּוֹקְלָא וְתִדְחַל מֵאֱלָהָךְ אֲנָא יְיָ", "pj_en": "Thou shalt not curse one who heareth not, nor set a stumbling-block before the blind, but shalt fear thy God: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לא תקלל חרש.<\/b> אֵין לִי אֶלָּא חֵרֵשׁ, מִנַּיִן לְרַבּוֹת כָּל אָדָם? תַּ\"ל בְּעַמְּךָ לֹא תָאֹר (שמות כ\"ב), אִם כֵּן לָמָּה נֶאֱמַר חֵרֵשׁ? מַה חֵרֵשׁ מְיֻחָד שֶׁהוּא בַחַיִּים, אַף כָּל שֶׁהוּא בַחַיִּים, יָצָא הַמֵּת שֶׁאֵינוֹ בַחַיִּים (ספרא):<br><br><b>ולפני עור לא תתן מכשול.<\/b> לִפְנֵי הַסּוּמָא בְדָבָר לֹא תִתֵּן עֵצָה שֶׁאֵינָהּ הוֹגֶנֶת לוֹ, אַל תֹּאמַר מְכֹר שָׂדְךָ וְקַח לְךָ חֲמוֹר, וְאַתָּה עוֹקֵף עָלָיו וְנוֹטְלָהּ הֵימֶנּוּ (שם):<br><br><b>ויראת מאלהיך.<\/b> לְפִי שֶׁהַדָּבָר הַזֶּה אֵינוֹ מָסוּר לַבְּרִיּוֹת לֵידַע אִם דַּעְתּוֹ שֶׁל זֶה לְטוֹבָה אוֹ לְרָעָה, וְיָכוֹל לְהִשָּׁמֵט וְלוֹמַר לְטוֹבָה נִתְכַּוַּנְתִּי, לְפִיכָךְ נֶאֱמַר בּוֹ וְיָרֵאתָ מֵּאֱלֹהֶיךָ הַמַּכִּיר מַחְשְׁבוֹתֶיךָ; וְכֵן כָּל דָּבָר הַמָּסוּר לְלִבּוֹ שֶׁל אָדָם הָעוֹשֵׂהוּ וְאֵין שְׁאָר הַבְּרִיּוֹת מַכִּירוֹת בּוֹ, נֶאֱמַר בּוֹ וְיָרֵאתָ מֵּאֱלֹהֶיךָ:", "rashi_en": "לא תקלל חרש THOU SHALT NOT CURSE THE DEAF — I have here only the law that one must not curse the deaf: whence do I know that any person is included in this prohibition and that the meaning is, Thou shalt not curse even the deaf? Because Scripture states (Exodus 22:27) \"Thou shalt not curse בעמך, anyone among thy people\". But if this be so why does Scripture say חרש and does not use some more general expression? It does so in order to offer an analogy: What is the case with the חרש? He is one who cannot hear your curse and therefore cannot feel aggrieved, but he has the characteristic of being a living person! The same applies to all living, thus excluding a dead person, who though he cannot hear and feel aggrieved, is not living (Sifra, Kedoshim, Section 2 13; cf. also Sanhedrin 66a).<br><br>ולפני עור לא תתן מכשל THOU SHALT NOT PUT A STUMBLING BLOCK BEFORE THE BLIND — This implies: \"Give not a person who is \"blind\" in a matter an advice which is improper for him. Do not say to him: \"Sell your field and buy from the proceeds of the sale an ass\", the fact being that you are endeavouring to circumvent him and to take it (the field) from him (Sifra, Kedoshim, Section 2 14).<br><br>ויראת מאלהיך BUT THOU SHALT BE AFRAID OF THY GOD — Because in this case it is not given to human beings to know whether the intention of this man (the offender) was for the advantage or the disadvantage of the person whom he advised, and he thus might be able to evade the responsibility  by saying: \"I meant it for the best\", Scripture therefore states with reference to him: \"But thou shall be afraid of thy God\" Who is cognizant of thy secret thoughts. Similarly in all actions where it is given only to the heart of him who does it to know the motive that prompts him and where other people have no insight into it, Scripture states, \"But be afraid of thy God!\" (Sifra, Kedoshim, Section 2 14; Bava Metzia 58b)."}, {"ch": 19, "v": 15, "aliyah": 2, "heb": "לֹא־תַעֲשׂ֥וּ עָ֙וֶל֙ בַּמִּשְׁפָּ֔ט לֹא־תִשָּׂ֣א פְנֵי־דָ֔ל וְלֹ֥א תֶהְדַּ֖ר פְּנֵ֣י גָד֑וֹל בְּצֶ֖דֶק תִּשְׁפֹּ֥ט עֲמִיתֶֽךָ׃", "onk": "לָא תַעְבְּדוּן <b>שְׁקַר<\/b> בְּדִינָא לָא תִסַּב אַפֵּי מַסְכֵּנָא וְלָא תֶהְדַּר אַפֵּי רַבָּא <b>בְּקוּשְׁטָא<\/b> תְּדִינֵיהּ לְחַבְרָךְ:", "onk_en": "You shall not commit injustice [<b>lie<\/b>] in judgement, you shall not favor a poor man and you shall not show honor to a powerful man. With righteousness [<b>truth<\/b>] shall you judge your fellow [Jew].", "pj": "לָא תַעַבְדוּן שְׁקַר בְּסֵדֶר דִינָא לָא תִסְבּוּן אַפִּין לְמַסְכְּנָא וְלָא תְיַיקְרוּן אַפֵּי רַבָּא בְּקוּשְׁטָא תְדוּנוּן חַבְרֵיכוֹן", "pj_en": "Thou shalt not act falsely in the order of judgment ment neither accept the face of the poor, nor honour the face of the great but in truthfulness shalt thou judge thy neighbour.", "tj": "", "tj_en": "", "rashi": "<b>לא תעשו עול במשפט.<\/b> מְלַמֵּד שֶׁהַדַּיָּן הַמְקַלְקֵּל אֶת הַדִּין קָרוּי עַוָּל, שָׂנוּי וּמְשֻׁקָּץ, חֵרֶם וְתוֹעֵבָה, שֶׁהָעָוֶל קָרוּי תּוֹעֵבָה, שֶׁנֶּאֱמַר כִּי תוֹעֲבַת ה' וְגוֹ' כֹּל עֹשֵׂה עָוֶל (דברים כ\"ה), וְהַתּוֹעֵבָה קְרוּיָה חֵרֶם וְשֶׁקֶץ שֶׁנֶּאֱמַר וְלֹא תָבִיא תוֹעֵבָה אֶל בֵּיתֶךָ וְהָיִיתָ חֵרֶם כָּמֹהוּ שַׁקֵּץ תְּשַׁקְּצֶנּוּ וְגוֹ' (שם ז'):<br><br><b>לא תשא פני דל.<\/b> שֶׁלֹּא תֹאמַר עָנִי הוּא זֶה, וְהֶעָשִׁיר חַיָּב לְפַרְנְסוֹ, אֲזַכֶּנּוּ בַדִּין וְנִמְצָא מִתְפַּרְנֵס בִּנְקִיּוּת (ספרא):<br><br><b>ולא תהדר פני גדול.<\/b> שֶׁלֹּא תֹאמַר עָשִׁיר הוּא זֶה, בֶּן גְּדוֹלִים הוּא זֶה, הֵיאַךְ אֲבַיְּשֶׁנּוּ וְאֶרְאֶה בְּבָשְׁתּוֹ? עֹנֶשׁ יֵשׁ בַּדָּבָר לְכָךְ נֶאֱמַר וְלֹא תֶהְדַּר פְּנֵי גָדוֹל:<br><br><b>בצדק תשפט עמיתך.<\/b> כְּמַשְׁמָעוֹ; דָּ\"אַ: הֱוֵי דָן אֶת חֲבֵרְךָ לְכַף זְכוּת (שבועות ל'):", "rashi_en": "לא תעשו עול במשפט YE SHALL NOT DO INJUSTICE IN JUDGMENT — This teaches us that the judge who perverts judgment is called an \"unjust person\" (עַוָּל), hateful and detested, doomed to destruction, and an abomination. He is rightly called thus for the unjust person (עַוָּל) is called by Scripture \"abomination\", as it is said (Deuteronomy 25:16) \"For all that do [such things] all that do injustice (עַוָּל=עֹשֵׂה עָוֶל) are an abomination (תועבה) unto the Lord thy God”. The abomination (תועבה), on its part, is called by Scripture חרם and שקץ, as it is said (Deuteronomy 7:26) \"Neither shalt thou bring an abomination (תועבה) into thine house, lest thou be a doomed thing (חרם) like it; but thou shall regard it as שקץ. <br><br>לא תשא פני דל THOU SHALT NOT RESPECT THE PERSON OF THE INDIGENT — i. e. thou shalt not say, \"This is a poor man, and the rich man has in any case the duty of supporting him; I will find in favor of him (the poor man) and he will consequently obtain some support in a respectable fashion (Sifra, Kedoshim, Chapter 4 2).<br><br>ולא תהדר פני גדול NOR HONOR THE PERSON OF THE MIGHTY — thou shalt not say, “This is a rich man, or, this man is of noble descent (lit., the son of great people) how can I possibly put him to shame and be witness to his shame? There is punishment for such a thing!” It is for this reason that Scripture states, \"thou shalt not honor the person of the mighty” (Sifra, Kedoshim, Chapter 4 3).<br><br>בצדק תשפט עמיתך IN RIGHTEOUSNESS SHALT THOU JUDGE THY COMPANION — Take this as the words imply (i.e. take the word צדק as what it usually implies: strict right). Another explanation is: Judge thy fellow man with an inclination in his favour (Sifra, Kedoshim, Chapter 4 4; Shevuot 30a)."}, {"ch": 19, "v": 16, "aliyah": 2, "heb": "לֹא־תֵלֵ֤ךְ רָכִיל֙ בְּעַמֶּ֔יךָ לֹ֥א תַעֲמֹ֖ד עַל־דַּ֣ם רֵעֶ֑ךָ<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בכתר ארם צובה היה כתוב רֵעֶ֑יךָ)<\/i> אֲנִ֖י יְהֹוָֽה׃", "onk": "לָא <b>תֵיכוּל קוּרְצִין<\/b> בְּעַמָּךְ לָא תְקוּם עַל דְּמָא דְחַבְרָךְ אֲנָא יְיָ:", "onk_en": "Do not be a tale-bearer [<b>’eat and wink’<\/b>] among your people. You shall not stand idly by [when] the blood (life) of your fellow [is in danger]. I am Adonoy.", "pj": "לָא תֶהֱווֹן אָזְלִין בָּתַר לִישַׁן תְּלִיתָאֵי דְהוּא קְשֵׁי הֵי כְּחַרְבָּא דִקְטַל מִן תְּרֵין חוּרְפוֹי לְמֵיכוּל קוּרְצִין לִמְעִיקָא לְבַר עַמָךְ לָא תִמְנַע זְכוּ דְחַבְרָךְ לְמִסְהֲדָא עֲלוֹי בְּדִינָא אֲנָא יְיָ", "pj_en": "Thou shalt not go after the slanderous tongue, which is cruel as a sword that killeth with its two edges in uttering false accusations to afflict thy people. Thou shalt not hinder the acquittal of thy neighbour in witnessing against him in the judgment: I am the Lord.", "tj": "עַמִּי בֵּית יִשְרָאֵל לָא תֶהֱווּן בָּתַר לִישְׁנָא תְּלִיתַיָא עַל חַבְרֵיכוֹן וְלָא תִשְׁתּוֹק אִידְמָא דְחַבְרָךְ בִּזְמַן דְאַתְּ יָדַע קְשׁוֹט בְּדִינָא כְּדֵין אָמַר יְיָ:", "tj_en": "My people of the house of Israel, follow not the slanderous tongue against your neighbour, nor be silent about thy neighbour's blood, what time in the judgment thou knowest the truth: so speaketh the Lord.", "rashi": "<b>לא תלך רכיל.<\/b> אֲנִי אוֹמֵר עַל שֵׁם שֶׁכָּל מְשַׁלְּחֵי מְדָנִים וּמְסַפְּרֵי לָשׁוֹן הָרַע הוֹלְכִים בְּבָתֵּי רֵעֵיהֶם לְרַגֵּל מַה יִּרְאוּ רָע, אוֹ מַה יִּשְׁמְעוּ רָע, לְסַפֵּר בַּשּׁוּק, נִקְרָאִים הוֹלְכֵי רָכִיל — הוֹלְכֵי רְגִילָה, אשפיי\"מנט בְּלַעַז. וּרְאָיָה לִדְבָרַי, שֶׁלֹּא מָצִינוּ רְכִילוּת שֶׁאֵין כָּתוּב בִּלְשׁוֹן הֲלִיכָה, לֹא תֵלֵךְ רָכִיל, הֹלְכֵי רָכִיל נְחֹשֶׁת וּבַרְזֶל (ירמיהו ו'), וּשְׁאָר לָשׁוֹן הָרַע אֵין כָּתוּב בּוֹ הֲלִיכָה, מְלָשְׁנִי בַסֵּתֶר רֵעֵהוּ (תהילים ק\"א), לָשׁוֹן רְמִיָּה (שם ק\"כ), לָשׁוֹן מְדַבֶּרֶת גְּדֹלוֹת (שם י\"ב); לְכָךְ אֲנִי אוֹמֵר שֶׁהַלָּשׁוֹן הוֹלֵךְ וּמְרַגֵּל, שֶׁהַכַּ\"ף נֶחֱלֶפֶת בְּגִימֶ\"ל, שֶׁכָּל הָאוֹתִיּוֹת שֶׁמּוֹצָאֵיהֶם מִמָּקוֹם אֶחָד מִתְחַלְּפוֹת זוֹ בָזוֹ, בֵּי\"ת בְּפֵ\"א וְגִימֶ\"ל בְּכַ\"ף וְקוֹ\"ף, וְנוּ\"ן בְּלָמֶ\"ד, וְזַיִ\"ן בְּצָדִ\"י, וְכֵן וַיְרַגֵּל בְּעַבְדְּךָ (שמואל ב י\"ט) — רִגֵּל בְּמִרְמָה לֵאמֹר עָלַי רָעָה, וְכֵן לֹא רָגַל עַל לְשֹׁנוֹ (תהילים ט\"ו), וְכֵן רוֹכֵל — הַסּוֹחֵר וּמְרַגֵּל אַחַר כָּל סְחוֹרָה, וְכֵן הַמּוֹכֵר בְּשָׂמִים לְהִתְקַשֵּׁט בָּהֶם הַנָּשִׁים, עַל שֵׁם שֶׁמְּחַזֵּר תָּמִיד בָּעֲיָרוֹת, נִקְרָא רוֹכֵל לְשׁוֹן רוֹגֵל; לָא תֵיכוּל קוּרְצִין כְּמוֹ וַאֲכַלוּ קַרְצֵיהוֹן דִּי יְהוּדָיֵא (דניאל ג׳:ח׳), אָכַל בֵּיהּ קוּרְצָא בֵּי מַלְכָּא (ברכות נ\"ח:); נִרְאֶה בְעֵינַי שֶׁהָיָה מִשְׁפָּטָם לֶאֱכֹל בְּבֵית הַמְקַבֵּל דִּבְרֵיהֶם שׁוּם הַלְעָטָה, וְהוּא גְמַר חִזּוּק שֶׁדְּבָרָיו מְקֻיָּמִים וְיַעֲמִידֵם עַל הָאֱמֶת, וְאוֹתָהּ הַלְעָטָה נִקְרֵאת אֲכִילַת קוּרְצִין, לְשׁוֹן קוֹרֵץ בְּעֵינָיו (משלי ו'), שֶׁכֵּן דֶּרֶךְ כָּל הוֹלְכֵי רָכִיל לִקְרֹץ בְּעֵינֵיהֶם וְלִרְמֹז דִּבְרֵי רְכִילוּתָן, שֶׁלֹּא יָבִינוּ שְׁאָר הַשּׁוֹמְעִים:<br><br><b>לא תעמד על דם רעך.<\/b> לִרְאוֹת בְּמִיתָתוֹ וְאַתָּה יָכוֹל לְהַצִּילוֹ, כְּגוֹן טוֹבֵעַ בַּנָּהָר וְחַיָּה אוֹ לִיסְטִים בָּאִים עָלָיו (סנהדרין ע\"ג):<br><br><b>אני ה'.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר, וְנֶאֱמָן לִפָּרַע:", "rashi_en": "לא תלך רכיל THOU SHALT NOT GO ABOUT AS A TALE BEARER — I say that because all those who sow discord between people and all who speak slander go into their friends' houses in order to spy out what evil they can see there, or what evil they can hear there so that they may tell it in the streets —they  are called  הולכי רכיל which it the same as הולכי רגילה, \"people who go about spying\"; espiement in O. F. A proof of my statement is the fact that we do not find anywhere the term רגיל used in Scripture except in connection with the expression הלך \"to go\". Examples are: the phrase here, לא תלך רכיל; (Jeremiah 6:28) \"[They are all] walking as spies: they are brass and iron\". But as for any other expressions for “slander”, the verb הלך is not used with them. Examples are (Psalms 101:5) \"whoso privily slandereth his neighbour”; (Psalms 120:2) \"false tongue\"; (Psalms 12:4) \"the tongue that speaketh proud things (slander)\". For this reason I say that this expression (הולך רכיל) means \"going about ומרגל, and spying out” (רגל = רכל), because the כ may interchange with ,ג since all letters the pronounciation of which are of the same place in the organs of speech may interchange with each other e. g., בי\"ת with גימ\"ל ,פ\"א with כ\"ף or with נו\"ן ;קו\"ף with זי\"ן ;למ\"ד with צד\"י. And in a similar sense we have, (II Samuel 19:28) \"He spied against thy servant [to my lord]” which implies, \"he spied me out with subtly in order to speak evil about me to my lord״ (and thus וירגל comes to mean \"to slander”). Similar is (Psalms 15:8): לא רגל על לשונו which means, \"he has not spied out in order to have evil on his tongue”. Similarly the רוכל, the trader, is one who goes round and searches for (spies out) all kinds of merchandise, and so also the seller of perfumes which women use to make themselves nice, because he constantly goes about in the villages, he is called רוכל, which has the same meaning as רוגל. And its translation in the Targum לא תיכול קורצין, has the same meaning as (Daniel 3:8) \"and they slandered (אכלו קורציהון) the Jews”; and as (Berakhot 58a) \"he slandered him (אכל ביה קורצא בי מלכא) to the king”. It seems to me that people had the custom to eat a little snack in the house of him who listened to their slanderous words, and this served as the final confirmation that his (the slanderer's) statements were well founded and that he would maintain the truth of them. This \"snack” was called אכילת קורצין, the word קורצא being connected in meaning with the root קרץ in (Proverbs 6:13) \"He winketh (קורץ) with his eyes”, for it is the manner of all who go about slandering to wink with their eyes and to suggest their slanderous statements by innuendos in order that others who happen to hear them should not understand them.<br><br>לא תעמד על דם רעך NEITHER SHALT THOU STAND AGAINST THE BLOOD OF THY FELLOW — witnessing his death, you being able to rescue him: if, for instance, he is drowning in the river or if a wild beast or a robber is attacking him (Sifra, Kedoshim, Chapter 4 8; Sanhedrin 73a).<br><br>‎'אני ה‎‎ I AM THE LORD — Who am faithful in paying reward to those who obey My commandments and Who am certain to punish those who transgress them."}, {"ch": 19, "v": 17, "aliyah": 2, "heb": "לֹֽא־תִשְׂנָ֥א אֶת־אָחִ֖יךָ בִּלְבָבֶ֑ךָ הוֹכֵ֤חַ תּוֹכִ֙יחַ֙ אֶת־עֲמִיתֶ֔ךָ וְלֹא־תִשָּׂ֥א עָלָ֖יו חֵֽטְא׃", "onk": "לָא תִשְׂנֵי יָת אֲחוּךְ בְּלִבָּךְ אוֹכָחָא תוֹכַח יָת חַבְרָךְ וְלָא תְקַבֵּל עַל דִּי לֵיהּ חוֹבָא:", "onk_en": "You shall not hate your brother in your heart; You shall certainly rebuke your friend; [but] you shall not bear a sin on his account.", "pj": "לָא תְמַלְלוּן שְׁעִיעַיָא בְּפוּמְכוֹן לְמִיסְנֵי יַת אֲחוּכוֹן בְּלִיבְּכוֹן אוֹכָחָא תּוֹכָחוֹן יַת חַבְרֵיכוֹן בְּרַם אִין מִיבְהִית לָא תְקַבְּלוּן מְטוּלְתֵּיהּ חוֹבָא", "pj_en": "Speak not bland words with your lips, having hatred to your brother in your hearts; but reproving you shall reprove your neighbour; and though it make you ashamed, you shall not contract sin in account of him.", "tj": "", "tj_en": "", "rashi": "<b>ולא תשא עליו חטא.<\/b> לֹא תַלְבִּין אֶת פָּנָיו בָּרַבִּים (עי' ספרא):", "rashi_en": "ולא תשא עליו חטא [THOU SHALT IN ANY WISE REBUKE THY COMPANION] AND NOT BEAR A SIN ON ACCOUNT OF HIM — i. e. though rebuking him thou shalt not expose him to shame (lit., make his face grow pale) in public, in which case you will bear sin on account of him (cf. Sifra, Kedoshim, Chapter 4 8; Arakhin 16b)."}, {"ch": 19, "v": 18, "aliyah": 2, "heb": "לֹֽא־תִקֹּ֤ם וְלֹֽא־תִטֹּר֙ אֶת־בְּנֵ֣י עַמֶּ֔ךָ וְאָֽהַבְתָּ֥ לְרֵעֲךָ֖ כָּמ֑וֹךָ אֲנִ֖י יְהֹוָֽה׃", "onk": "לָא תִקּוֹם וְלָא תִטַּר דְּבָבוּ לִבְנֵי עַמָּךְ וּתְרַחֵם לְחַבְרָךְ כְּוָתָךְ אֲנָא יְיָ:", "onk_en": "You shall not take revenge or bear a grudge against the children of your people. You shall love your fellow [Jew] as yourself, I am Adonoy.", "pj": "לָא תֶהֱווֹן נַקְמִין וְלָא נַטְרִין דְבָבוּ לִבְנֵי עַמָךְ וּתְרַחֲמֵי לְחַבְרָךְ דְמַן אַנְתְּ סַנֵי לָךְ לָא תַעֲבֵיד לֵיהּ אֲנָא יְיָ", "pj_en": "Be not revengeful, nor cherish animosity against the children of thy people; but thou shalt love thy neighbour himself, as that though there be (cause of) hatred with thee thou mayest not do (evil) to him: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לא תקם.<\/b> אָמַר לוֹ הַשְׁאִילֵנִי מַגָּלְךָ, אָמַר לוֹ לָאו, לְמָחָר אָמַר לוֹ הַשְׁאִילֵנִי קַרְדֻּמְּךָ, אָמַר לוֹ אֵינִי מַשְׁאִילְךָ כְּדֶרֶךְ שֶׁלֹּא הִשְׁאַלְתַּנִי, זוֹ הִיא נְקִימָה; וְאֵיזוֹ הִיא נְטִירָה? אָמַר לוֹ הַשְׁאִילֵנִי אֶת קַרְדֻּמְּךָ, אָמַר לוֹ לָאו, לְמָחָר אָמַר לוֹ הַשְׁאִילֵנִי מַגָּלְךָ, אָמַר לוֹ הֵא לְךָ, אֵינִי כְמוֹתְךָ שֶׁלֹּא הִשְׁאַלְתַּנִי, זוֹ הִיא נְטִירָה, שֶׁנּוֹטֵר הָאֵיבָה בְּלִבּוֹ, אַעַ\"פִּי שֶׁאֵינוֹ נוֹקֵם (ספרא; יומא כ\"ג):<br><br><b>ואהבת לרעך כמוך.<\/b> אָמַר רַבִּי עֲקִיבָא זֶה כְּלָל גָּדוֹל בַּתּוֹרָה (ספרא):", "rashi_en": "לא תקם THOU SHALT NOT AVENGE — If one says to another “Lend me your sickle\", and he replies, “No!\", and the next day he (the latter) says to him (the former), “Lend me your hatchet”, and he retorts, “I am not going to lend it to you, just as you refused to lend me your sickle״ — this is avenging. And what is “bearing a grudge”? If one says to another, “Lend me your hatchet”, and he replies “No!” and on the next day he says to him “Lend me your sickle”, and he replies: “Here it is; I am not like you, because you would not lend me” — this is called “bearing a grudge (נטירה)” because he retains (נוטר) enmity in his heart although he does not actually avenge himself (Sifra, Kedoshim, Chapter 4 10-11; Yoma 23a).<br><br>ואהבת לרעך כמוך THOU SHALT LOVE THY FELLOW MAN AS THYSELF  —Rabbi Akiba said: “This is a fundamental principle of the Torah” (Sifra, Kedoshim, Chapter 4 12;  Talmud Yerushalmi Nedarim 9:3)."}, {"ch": 19, "v": 19, "aliyah": 2, "heb": "אֶֽת־חֻקֹּתַי֮ תִּשְׁמֹ֒רוּ֒ בְּהֶמְתְּךָ֙ לֹא־תַרְבִּ֣יעַ כִּלְאַ֔יִם שָׂדְךָ֖ לֹא־תִזְרַ֣ע כִּלְאָ֑יִם וּבֶ֤גֶד כִּלְאַ֙יִם֙ שַֽׁעַטְנֵ֔ז לֹ֥א יַעֲלֶ֖ה עָלֶֽיךָ׃", "onk": "יָת קְיָמַי תִּטְּרוּן בְּעִירָךְ לָא תַרְכֵּב עֵרוּבִין חַקְלָךְ לָא תִזְרַע עֵרוּבִין וּלְבוּשׁ עֵרוּבִין שַׁעַטְנֵזָא לָא יִסַּק עֲלָךְ:", "onk_en": "Keep My statutes; Do not cross-breed your animals with different species. Do not sow your field with a mixture of different seeds. A garment that contains <i>shatnez<\/i> [a forbidden mixture of linen and wool] you shall not wear.", "pj": "יַת קְיָמַי תִּטְרוּן בְּעִירָךְ לָא תַרְבְּעִינֵיהּ עִירְבוּבִין חַקְלָךְ לָא תִזְרַע עִירְבוּבִין לְבוּשׁ עִירְבוּבִין כִּלְאֵי עֲמַר וְכִיתַּן לָא יִסוֹק עֲלָךְ", "pj_en": "You shall keep My statutes. Thy cattle shall not be made to gender with various kinds, neither sow thy field with mixed seeds, nor put upon thee a garment of divers materials, (as) wool and linen.", "tj": "", "tj_en": "", "rashi": "<b>את חקתי תשמרו.<\/b> וְאֵלּוּ הֵן: בְּהֶמְתְּךָ לֹא תַרְבִּיעַ כִּלְאַיִם וְגוֹ'; חֻקִּים — אֵלּוּ גְזֵרַת מֶלֶךְ שֶׁאֵין טַעַם לַדָּבָר:<br><br><b>ובגד כלאים.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר \"לֹא תִלְבַּשׁ שַׁעַטְנֵז צֶמֶר וּפִשְׁתִּים יַחְדָּו\" (דברים כ\"ב), יָכוֹל לֹא יִלְבַּשׁ גִּזֵּי צֶמֶר וַאֲנִיצֵי פִשְׁתָּן, תַּ\"ל \"בֶּגֶד\", מִנַּיִן לְרַבּוֹת הַלְּבָדִים? תַּ\"לֹ \"שַׁעַטְנֵז\" — דָּבָר שֶׁהוּא שׁוּעַ טָווּי וְנוּז. וְאוֹמֵר אֲנִי נוּז לְשׁוֹן דָּבָר הַנִּמְלָל וְשָׁזוּר זֶה עִם זֶה לְחַבְּרוֹ, טישט\"יר בְּלַעַז, כְּמוֹ \"חַזְיָין לִנְזָאֵי דְאִית בְּהוֹן\" (מועד קטן י\"ב), שֶׁאָנוּ מְפָרְשִׁין לְשׁוֹן כִּמּוּשׁ, פליש\"טרא, וּלְשׁוֹן שַׁעַטְנֵז פֵּרֵשׁ מְנַחֵם מַחְבֶּרֶת צֶמֶר וּפִשְׁתִּים:", "rashi_en": "חקתי תשמרו ‎את YE SHALL KEEP MY ORDINANCES — These are they: “Thou shalt not cause two kinds of thy cattle to gender etc.”, (and the other ordinances laid down in this verse), for by the term חוקים are meant those enactments of the King for which no reason is given and those that precede are not of this character.<br><br>ובגד כלאים NEITHER SHALL A GARMENT MINGLED OF LINEN AND WOOLLEN [COME UPON THEE] — Why is this st‎atement made (how does the particular form of words used here tell us some point of law which is not contained in Deuteronomy 22:21 which bears upon the same subject)? Because Scripture states there “Thou shalt not wear שעטנז, wool and linen together” I might think that one must not wear in combination wool (i. e. wool as it comes from the shearing) and combed flax! Scripture therefore states here “a garment (i. e. something made of a cloth) [mingled of woollen and linen shall not come upon thee]”, thus excluding loose pieces of wool and flax in combination, which do not form a בגד. Whence do we know that this prohibition extends to felt-stuff (which though not being really בגד, since the material is not worked up into cloth, is, however, made of wool and linen pressed into one material)? Because Scripture states in Deuteronomy “שעטנז shall not come upon thee” which means a material that is calendered (pressed, שוע), or woven (טוי) or twisted (נוז) together — (שעטנז is taken to be an abbreviation of these words) (Sifra, Kedoshim, Chapter 4 18). I say that נוז is an expression for material which is dried by rubbing between the fingers in order to extend it into threads, these being then twined together so that it forms a coherent web. This is called tistre in O. F. (cf. Rashi on Gittin 59a s. v. דבר הנמלל ונמתח). Similar is the expression to be found in the Talmud (Moed Katan 12b): חזין לגזאי דאית בהון, “The sesame-plant may be plucked on חולו של מועד because it is fit for use on account of the נזאי, the dried-up kernels which it contains” — which word, viz., נזאי, we explain to mean as much as “withering”, flestre in O. F.. Menachem explains שעטנו to denote a combination of wool and linen."}, {"ch": 19, "v": 20, "aliyah": 2, "heb": "וְ֠אִ֠ישׁ כִּֽי־יִשְׁכַּ֨ב אֶת־אִשָּׁ֜ה שִׁכְבַת־זֶ֗רַע וְהִ֤וא שִׁפְחָה֙ נֶחֱרֶ֣פֶת לְאִ֔ישׁ וְהׇפְדֵּה֙ לֹ֣א נִפְדָּ֔תָה א֥וֹ חֻפְשָׁ֖הֿ לֹ֣א נִתַּן־לָ֑הּ בִּקֹּ֧רֶת תִּהְיֶ֛ה לֹ֥א יוּמְת֖וּ כִּי־לֹ֥א חֻפָּֽשָׁה׃", "onk": "וּגְבַר אֲרֵי יִשְׁכּוּב עִם אִתְּתָא שִׁכְבַת זַרְעָא וְהִיא אַמְתָא אֲחִידָא לִגְבַר וְאִתְפְּרָקָא לָא אִתְפְּרִיקַת <b>בְּכַסְפָּא<\/b> אוֹ חֵרוּתָא לָא אִתְיְהִיבַת לַהּ <b>בִּשְׁטָר<\/b> בִּקֻּרְתָּא תְהֵי לָא יוּמְתוּן אֲרֵי לָא אִתְחָרָרַת:", "onk_en": "If a man lies with a woman in a conjugal manner, and she is a maid-servant designated for a [specific] man and she has certainly not been redeemed [<b>with money<\/b>], or her freedom was not given to her [<b>through a document<\/b>]; there shall be an investigation they shall not be put to death, for her freedom was not given to her.", "pj": "וּגְבַר אֲרוּם יִשְׁכּוֹב עִם אִיתָא תַּשְׁמִישׁ זַרְעָא וְהִיא אַמְתָא וְחָרָתָא מִתְאַרְסָא לִגְבַר חָרֵי וּמִתְפַּרְקָא כוֹלָא עַד כְּדוֹן לָא אִיתְפְּרִיקָאַת בְּכַסְפָּא אוֹ שְׁטַר שִׁיחְרוּרָהּ לָא אִיתְיְהֵיב לָהּ פִּשְׁפּוּשׁ יֶהֱוֵי בְּדִינָהּ לְמִילְקֵי הוּא מְחַיְיבָא וְלָא [הִיא] (הֲוָה) בְּרַם סֵדֶר קְטוֹלִין לֵית הִינוּן חֲשִׁיבִין אֲרוּם לָא אִיתְחָרָת כּוֹלָא", "pj_en": "And if a man lie carnally with a woman, and she be an (Israelitish) handmaid (about to be) made free, and betrothed to a free man, but her redemption not altogether completed by (the payment of) the money, or the written instrument of liberation not having been given to her, let inquisition be made for judgment: she is liable to be chastised, but he is not. But it shall not be considered a matter of putting to death, because she was not altogether free. (Deut. xxii. 22-24.)", "tj": "מָרְדוּ אִינוּן חַיָּיבִין:", "tj_en": "They have rebelled, they are guilty.", "rashi": "<b>נחרפת לאיש.<\/b> מְיֻעֶדֶת וּמְיֻחֶדֶת לְאִישׁ, וְאֵינִי יוֹדֵעַ לוֹ דִמְיוֹן בַּמִּקְרָא; וּבְשִׁפְחָה כְנַעֲנִית חֶצְיָהּ שִׁפְחָה וְחֶצְיָהּ בַּת חֹרִין הַמְאֹרֶסֶת לְעֶבֶד עִבְרִי שֶׁמֻּתָּר בְּשִׁפְחָה הַכָּתוּב מְדַבֵּר:<br><br><b>והפדה לא נפדתה.<\/b> פְּדוּיָה וְאֵינָהּ פְּדוּיָה, וּסְתָם פִּדְיוֹן בְּכֶסֶף:<br><br><b>או חפשה.<\/b> בִּשְׁטָר (ספרא):<br><br><b>בקרת תהיה.<\/b> הִיא לוֹקָה וְלֹא הוּא, יֵשׁ עַל בֵּית דִּין לְבַקֵּר אֶת הַדָּבָר שֶׁלֹּא לְחַיְּבָהּ מִיתָה <b>כי לא חפשה<\/b> וְאֵין קִדּוּשֶׁיהָ קִדּוּשִׁין גְּמוּרִין: וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן (מכות כ\"ב), שֶׁמִּי שֶׁהוּא בְמַלְקוּת תְּהֵא בִקְרִיאָה — שֶׁהַדַּיָּנִים הַמַּלְקִין קוֹרִין עַל הַלּוֹקֶה \"אִם לֹא תִשְׁמֹר לַעֲשׂוֹת וְגוֹ' וְהִפְלָא ה' אֶת מַכֹּתְךָ וְגוֹ'\" (דברים כ\"ח):<br><br><b>כי לא חפשה.<\/b> לְפִיכָךְ אֵין חַיָּב עָלֶיהָ מִיתָה, שֶׁאֵין קִדּוּשֶׁיהָ קִדּוּשִׁין, הָא אִם חֻפְּשָׁה קִדּוּשֶׁיהָ קִדּוּשִׁין וְחַיָּב מִיתָה (ספרא):", "rashi_en": "נחרפת לאיש [AND WHOSOEVER LIETH CARNALLY WITH A WOMAN THAT IS A HANDMAID] GIVEN OVER TO A MAN — נחרפת signifies: destined and designated to a man. I do not know of any similar use of it (the root חרף) in Scripture. — And it is of a Canaanitish handmaid who is partly a שפחה and partly a free-woman and who is betrothed to a Hebrew servant who is permitted to marry a שפחה, that Scripture is here speaking (Sifra, Kedoshim, Chapter 5 2; Keritot 11a).<br><br>והפדה לא נפדתה means, she is redeemed (הפדה) and not redeemed (לא נפדתה) (i. c. she is partly redeemed, but not fully redeemed; cf. Keritot 11a). An expression derived from the verb פדה, unless it be more closely defined, means redemption by money.<br><br>או חפשה NOR FREEDOM [WAS GIVEN HER] through a document of release (שטר שחרור) (Sifra, Kedoshim, Chapter 5 3).<br><br>בקרת תהיה INVESTIGATION SHALL BE MADE CONCERNING HER — she shall be punished with lashes but not he. It is for the court to investigate the  matter (to discover that she is really not free) so that they should not make her liable to death (which would be the punishment of a free woman who committed adultery), כי לא חפשה BECAUSE SHE WAS NOT FREE and her marriage with the Hebrew slave was no marriage. Our Rabbis, however, (taking the word בקרת as though it were בקריאת “by reading”) learned from here that whoever is subject to lashes (the מלקות punishment) shall be subject to the recitation (קריאה) of Biblical verses — that the judges who pronounce the sentence of lashes shall recite, whilst standing by him who is lashed the verses (Deuteronomy 28:58, 59): \"If thou wilt not observe to do [all the words of the law] etc… Then the Lord will distinguish thy plagues (מכותך which also implies thy \"lashes\") etc.\" (cf. Keritot 11a) <br><br>כי לא חופשה BECAUSE SHE WAS NOT FREE therefore he, also, is not liable to death because of her, since her marriage was no marriage. It follows therefore that if she were free her marriage would have been a marriage and he would be liable to the death penalty (Sifra, Kedoshim, Chapter 5 5)."}, {"ch": 19, "v": 21, "aliyah": 2, "heb": "וְהֵבִ֤יא אֶת־אֲשָׁמוֹ֙ לַֽיהֹוָ֔ה אֶל־פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד אֵ֖יל אָשָֽׁם׃", "onk": "וְיַיְתִי יָת אַשְׁמֵיהּ <b>קֳדָם<\/b> יְיָ לִתְרַע מַשְׁכַּן זִמְנָא דְּכַר לַאֲשָׁמָא:", "onk_en": "He shall bring his guilt-offering to [<b>before<\/b>] Adonoy, to the entrance of the Tent of Meeting, a guilt-offering-ram.", "pj": "וְיַיְתִי גְבַר דְשַׁמֵשׁ עִמָהּ וְלָא הִיא יַת קָרְבַּן אֲשָׁמֵיהּ לִתְרַע מַשְׁכַּן זִמְנָא דִכְרָא לַאֲשָׁמָא", "pj_en": "And the man who lay with her must bring his trespass offering to the door of the tabernacle of ordinance, a ram for a trespass offering.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 22, "aliyah": 2, "heb": "וְכִפֶּר֩ עָלָ֨יו הַכֹּהֵ֜ן בְּאֵ֤יל הָֽאָשָׁם֙ לִפְנֵ֣י יְהֹוָ֔ה עַל־חַטָּאת֖וֹ אֲשֶׁ֣ר חָטָ֑א וְנִסְלַ֣ח ל֔וֹ מֵחַטָּאת֖וֹ אֲשֶׁ֥ר חָטָֽא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיכַפֵּר עֲלוֹהִי כַהֲנָא בְּדִכְרָא דַאֲשָׁמָא קֳדָם יְיָ עַל חוֹבְתֵיהּ דִּי חָב וְיִשְׁתְּבֵק לֵיהּ מֵחוֹבְתֵיהּ דִּי חָב:", "onk_en": "The <i>kohein<\/i> shall atone for him with the guilt-offering-ram before Adonoy for the sin which he committed and he will be forgiven for the sin which he committed.", "pj": "וִיכַפֵּר עֲלוֹי כַּהֲנָא בְּדִכְרָא דַאֲשָׁמָא קֳדָם יְיָ מְטוֹל חוֹבָתֵיהּ דְחַב וְיִשְׁתְּבֵיק לֵיהּ מֵחוֹבְתֵיהּ דְחָב", "pj_en": "And the priest shall make atonement with the ram of his trespass offering before the Lord, for his sin that he hath sinned; and the sin that he hath sinned shall be forgiven.", "tj": "", "tj_en": "", "rashi": "<b>ונסלח לו מחטאתו אשר חטא.<\/b> לְרַבּוֹת אֶת הַמֵּזִיד כַּשּׁוֹגֵג (ספרא):", "rashi_en": "ונסלח לו מחטאתו אשר חטא AND THE SIN WHICH HE HATH SINNED SHALL BE FORGIVEN HIM — [The words מחטאתו אשר חטא appear to be redundant after the statement על חטאתו אשר חטא immediately preceding them, but they are intended] to include the willful sinner just as well as him who acts unintentionally amongst those who must bring this offering (Sifra, Kedoshim, Chapter 5 7; Keritot 9a)."}, {"ch": 19, "v": 23, "aliyah": 3, "heb": "וְכִי־תָבֹ֣אוּ אֶל־הָאָ֗רֶץ וּנְטַעְתֶּם֙ כׇּל־עֵ֣ץ מַאֲכָ֔ל וַעֲרַלְתֶּ֥ם עׇרְלָת֖וֹ אֶת־פִּרְי֑וֹ שָׁלֹ֣שׁ שָׁנִ֗ים יִהְיֶ֥ה לָכֶ֛ם עֲרֵלִ֖ים לֹ֥א יֵאָכֵֽל׃", "onk": "וַאֲרֵי תֵעֲלוּן לְאַרְעָא וְתִצְּבוּן כָּל אִלַּן דְּמֵיכַל <b>וּתְרַחֲקוּן<\/b> רָחָקָא יָת אִבֵּיהּ תְּלַת שְׁנִין יְהֵי לְכוֹן <b>מְרָחָק<\/b> <b>לַאֲבָדָא<\/b> לָא יִתְאֲכֵל:", "onk_en": "When you will enter the land and you will plant any food-bearing tree, you shall regard its fruit as closed off [<b>separated<\/b>]. [For] three years it shall be closed off [<b>separated<\/b>] to you [<b>to be destroyed<\/b>], it shall not be eaten.", "pj": "וַאֲרוּם תֵּיעָלוּן לְאַרְעָא וְתִינְצְבוּן כָּל אִילַן דְמֵיכְלָא וְתִגְזְרוּן גִזְרָא יַת אִינְבֵּיהּ תְּלַת שְׁנִין יְהֵי לְכוֹן מְרָחַק לְאַבָּדָא לָא יִתְאָכֵל", "pj_en": "And when you have come into the land, and have planted any tree that may be eaten of, you shall verily circumcise the fruit of it; three years shall it be to you for rejection, to be destroyed; it shall not be eaten.", "tj": "", "tj_en": "", "rashi": "<b>וערלתם ערלתו.<\/b> וַאֲטַמְתֶּם אֲטִימָתוֹ — יְהֵא אָטוּם וְנִסְתָּם מִלֵּהָנוֹת מִמֶּנּוּ:<br><br><b>שלש שנים יהיה לכם ערלים.<\/b> מֵאֵימָתַי מוֹנֶה לוֹ? מִשְּׁעַת נְטִיעָתוֹ; יָכוֹל אִם הִצְנִיעוֹ, לְאַחַר שָׁלוֹשׁ שָׁנִים יְהֵא מֻתָּר, תַּ\"ל יִהְיֶה — בַּהֲוָיָתוֹ יְהֵא (ספרא):", "rashi_en": "וערלתם ערלתו את פריו meant lit., ye shall close its closing (regard it as enclosed): the meaning being that it shall be, as it were, closed up and barred so that no benefit may be derived from it.<br><br>שלש שנים יהיה לכם ערלים THREE YEARS IT SHALL BE AS UNCIRCUMCISED UNTO YOU — From when does one count its three years? From the time of its (the tree's) being planted (Sifra, Kedoshim, Section 3 3). One might think that if one has laid it (the fruit) by during these three years it shall become permitted for use after the three years, Scripture therefore states, יהיה which implies it shall remain in its former state of being (forbidden as it was during the entire three years)."}, {"ch": 19, "v": 24, "aliyah": 3, "heb": "וּבַשָּׁנָה֙ הָרְבִיעִ֔ת יִהְיֶ֖ה כׇּל־פִּרְי֑וֹ קֹ֥דֶשׁ הִלּוּלִ֖ים לַיהֹוָֽה׃", "onk": "וּבְשַׁתָּא רְבִיעֵתָא יְהֵי כָּל אִבֵּיהּ קֹדֶשׁ תֻּשְׁבְּחָן <b>קֳדָם<\/b> יְיָ:", "onk_en": "On the fourth year, all of its fruit shall be holy [upon which to say] praise[s to] [<b>before<\/b>] Adonoy.", "pj": "וּבְשַׁתָּא רְבִיעָתָא יְהֵי כָּל אִינְבֵּיהּ קוּדְשֵׁי תוּשְׁבְּחָן קֳדָם יְיָ מִתְפְּרַק מִן כַּהֲנָא", "pj_en": "And in the fourth year all the fruit of it shall be consecrated, (a token of) praise before the Lord delivered for the priest (or, to be redeemed from the priest).", "tj": "", "tj_en": "", "rashi": "<b>יהיה כל פריו קדש.<\/b> כְּמַעֲשֵׂר שֵׁנִי שֶׁכָּתוּב בּוֹ וְכָל מַעְשַׂר הָאָרֶץ וְגוֹ' קֹדֶשׁ לַה' (ויקרא כ\"ז), מַה מַּעֲשֵׂר שֵׁנִי אֵינוֹ נֶאֱכָל חוּץ לְחוֹמוֹת יְרוּשָׁלַיִם אֶלָּא בְּפִדְיוֹן, אַף זֶה כֵּן, וְדָבָר זֶה <b>הלולים לה'<\/b> הוּא, שֶׁנּוֹשְׂאוֹ שָׁם לְשַׁבֵּחַ וּלְהַלֵּל לַשָּׁמַיִם (עי' ברכות ל\"ה):", "rashi_en": "יהיה כל פריו קדש [BUT IN THE FOURTH YEAR] THE FRUIT THEREOF SHALL BE HOLY, in the same way as the \"second tithe\" with reference to which, too, it is stated (Leviticus 27:30) \"And all the tithe of the land… [belongeth to the Lord]; it is holy (קדש) unto the Lord\". Now what is the law regarding the “second tithe\"? It must not be eaten outside the walls of Jerusalem except after redemption! The same is the case with this (the fruit in the fourth year). And this very thing הלולים לה׳, is A PRAISE OF THE LORD, for he takes it there (to Jerusalem) to praise and to laud God in Heaven, as he does with the second tithe (cf. Berakhot 35a)."}, {"ch": 19, "v": 25, "aliyah": 3, "heb": "וּבַשָּׁנָ֣ה הַחֲמִישִׁ֗ת תֹּֽאכְלוּ֙ אֶת־פִּרְי֔וֹ לְהוֹסִ֥יף לָכֶ֖ם תְּבוּאָת֑וֹ אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "וּבְשַׁתָּא חֲמִשֵּׁתָא תֵּיכְלוּן יָת אִבֵּיהּ לְאוֹסָפָא לְכוֹן עֲלַלְתֵּיהּ אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "On the fifth year, you may eat its fruit, so that it will increase its produce for you, I am Adonoy, your God.", "pj": "וּבְשַׁתָּא חֲמִישָׁתָא תֵּיכְלוּן יַת אִנְבֵּיהּ מְטוּל דְיוֹסְפוּן לְכוֹן מִן שְׁמַיָא עֲלַלְתָּא אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "But in the fifth year thou mayst eat the fruit of it; for produce will be increased to you from the heavens: I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>להוסיף לכם תבואתו.<\/b> הַמִּצְוָה הַזֹּאת שֶׁתִּשְׁמְרוּ, תִּהְיֶה לְהוֹסִיף לָכֶם תְּבוּאָתוֹ, שֶׁבִּשְׂכָרָהּ אֲנִי מְבָרֵךְ לָכֶם פֵּרוֹת הַנְּטִיעָה; הָיָה רַבִּי עֲקִיבָא אוֹמֵר דִּבְּרָה תוֹרָה כְּנֶגֶד יֵצֶר הָרָע, שֶׁלֹּא יֹאמַר אָדָם הֲרֵי אַרְבַּע שָׁנִים אֲנִי מִצְטַעֵר בּוֹ חִנָּם לְפִיכָךְ נֶאֱמַר לְהוֹסִיף לָכֶם תְּבוּאָתוֹ (ספרא):<br><br><b>אני ה'.<\/b> אֲנִי ה' הַמַּבְטִיחַ עַל כָּךְ וְנֶאֱמָן לִשְׁמֹר הַבְטָחָתִי:", "rashi_en": "להוסיף לכם תבואתה [AND IN THE FIFTH YEAR SHALL YE EAT THE FRUIT THEREOF] THAT IT MAY YIELD UNTO YOU ITS INCREASE — This command (of ערלה and נטע רבעי, fruit of the fourth year) which you observe will result in its giving you its produce in larger quantities. Because as a reward for it (for the fulfilment of My command) I shall bless for you the fruit of the plantation. R. Akiba used to say: “The Torah says this because it has man’s evil inclination in mind: that one should not say, \"Behold, for four years I must take trouble with it for nothing!\" Scripture therefore states that the result of your obedience will be that it will give you its produce in larger quantities (Sifra, Kedoshim, Section 3 9). <br><br>'אני ה‎‎‎ means, it is I, the Lord, Who gives you a promise about this (that your obedience to Me will bring a blessing on your harvest) and Who am faithful to keep My promise."}, {"ch": 19, "v": 26, "aliyah": 3, "heb": "לֹ֥א תֹאכְל֖וּ עַל־הַדָּ֑ם לֹ֥א תְנַחֲשׁ֖וּ וְלֹ֥א תְעוֹנֵֽנוּ׃", "onk": "לָא תֵיכְלוּן עַל דְּמָא לָא תְנַחֲשׁוּן וְלָא תְעוֹנוּן:", "onk_en": "You shall not eat [sacred offerings] [before] the blood [is sprinkled on the altar]. You shall not act on the basis of omens nor act on the basis of auspicious times.", "pj": "לָא תֵיכְלוּן מִבְּשַר כָּל נִכְסְתָא עַד דְאַדְמָא קְיַם בְּמִזְרְקַיָא לָא תֶהֱווֹן נַטְרֵי נַחְשִׁין וְלָא (ס\"א אֲחוֹדֵי עַיְינִין עיין דברים י\"ח פסוק ט\"ז בת\"י) אֲחוֹרֵי סַנְהֶדְרִין עַיְינִין", "pj_en": "You shall not eat the flesh of any sacrifice while the blood remaineth in the veins. You shall not be observers of auguries, after the sanhedrin of the speculators.", "tj": "", "tj_en": "", "rashi": "<b>לא תאכלו על הדם.<\/b> לְהַרְבֵּה פָנִים נִדְרָשׁ בְּסַנְהֶדְרִין (דף ס\"ג): אַזְהָרָה שֶׁלֹּא יֹאכַל מִבְּשַֹר קָדָשִׁים לִפְנֵי זְרִיקַת דָּמִים, וְאַזְהָרָה לָאוֹכֵל מִבֶּהֱמַת חֻלִּין טֶרֶם שֶׁתֵּצֵא נַפְשָׁהּ, וְעוֹד הַרְבֵּה:<br><br><b>לא תנחשו.<\/b> כְּגוֹן אֵלּוּ הַמְנַחֲשִׁין בְּחֻלְדָּה וּבְעוֹפוֹת, פִּתּוֹ נָפְלָה מִפִּיו, צְבִי הִפְסִיקוֹ בַדֶּרֶךְ (ספרא):<br><br><b>ולא תעוננו.<\/b> לְשׁוֹן עוֹנוֹת וְשָׁעוֹת, שֶׁאוֹמֵר יוֹם פְּלוֹנִי יָפֶה לְהַתְחִיל מְלָאכָה, שָׁעָה פְלוֹנִית קָשָׁה לָצֵאת (סנהדרין ס\"ה):", "rashi_en": "לא תאכלו על הדם YE SHALL NOT EAT ANYTHING על הדם — This text is interpreted in many different ways in Treatise Sanhedrin 63a: It is taken as a prohibition of eating the flesh of the sacrifices before their blood has been sprinkled; and as a prohibition addressed to him who eats of the flesh of a non-consecrated animal (חולין) before life has entirely left it; and many other interpretations are there given.<br><br>לא תנחשו YE SHALL NOT DIVINE — as do those who draw prognostications from the cry of a weasel or the twittering of birds (Sifra, Kedoshim, Chapter 6 2; Sanhedrin 66a), or from the fact that the bread falls from his mouth or that a stag crosses his path (Sanhedrin 65b).<br><br>ולא תעוננו The verb is connected in meaning with “period\" (עונה) and “hours\"; thus a מעונן is one who says: “This or that day is auspicious for beginning a work, this or that hour is inauspicious for starting on a journey (Sanhedrin 66a)."}, {"ch": 19, "v": 27, "aliyah": 3, "heb": "לֹ֣א תַקִּ֔פוּ פְּאַ֖ת רֹאשְׁכֶ֑ם וְלֹ֣א תַשְׁחִ֔ית אֵ֖ת פְּאַ֥ת זְקָנֶֽךָ׃", "onk": "לָא תַקְּפוּן פָּאתָא דְרֵישְׁכוֹן וְלָא תְחַבֵּל יָת פָּאתָא דְדִקְנָךְ:", "onk_en": "Do not round the corners of [the hair on] your heads and you shall not destroy [by shaving] the edges of your beard.", "pj": "לָא תַקְפֵי צִדְעֵי רֵישֵׁיכוֹן וְלָא תִגְלְבוּן יַת שׁוּמַת דִיקְנֵיכוֹן", "pj_en": "You shall not round off the (hair on) the sides of your heads, nor shave the corners of your beards.", "tj": "", "tj_en": "", "rashi": "<b>לא תקפו פאת ראשכם.<\/b> זֶה הַמַּשְׁוֶה צְדָעָיו לַאֲחוֹרֵי אָזְנוֹ וּלְפַדַּחְתּוֹ, וְנִמְצָא הֶקֵּף רֹאשׁוֹ עָגֹל סָבִיב, שֶׁעַל אֲחוֹרֵי אָזְנָיו עִקְּרֵי שְׂעָרוֹ לְמַעְלָה מִצְּדָעָיו הַרְבֵּה:<br><br><b>פאת זקנך.<\/b> סוֹף הַזָּקָן וּגְבוּלָיו (מכות כ'), וְהֵן חָמֵשׁ — שְׁתַּיִם בְּכָל לֶחִי וָלֶחִי, לְמַעְלָה אֵצֶל הָרֹאשׁ שֶׁהוּא רָחָב, וְיֵשׁ בּוֹ שְׁתֵּי פֵאוֹת, וְאַחַת לְמַטָּה בְּסַנְטֵרוֹ — מְקוֹם חִבּוּר שְׁנֵי הַלְּחָיַיִם יַחַד (שבועות נ'):", "rashi_en": "לא תקיפו פאת ראשכם YE SHALL NOT ROUND THE CORNERS OF YOUR HEAD — This refers to one who makes his temples exactly like (as hairless as) the back of his ears and his forehead (cf. Rashi on Makkot 20b, ד״ה המשוה צדעיו) by removing the hair on his temples, so that the lower edge of the hair that surrounds his head (i. e. his skull, because we are not concerned with ‎hair at the back of the neck) forms a complete circle, since above the back of his ears the roots of his hair are situated much higher than his temples (and it is thus only the temples which prevent an uninterrupted circular line going round his skull). (Cf. Makkot 20b).<br><br>פאת זקנך [NEITHER SHALT THOU MAR] THE CORNERS OF THY BEARD — i. e. the tip of the beard and its sides, these making together five corners: two on each cheek, above near the head (the temples) — where it (the cheek) is broad and has therefore two corners (thus four on the two sides) and one at the bottom, on the chin, on that spot where is the junction of the two cheeks (Shevuot 3a; cf. also Sifra, Kedoshim, Chapter 6 3; Makkot 20a and Rashi on Shevuot 3a: ועל הזקן ‎‎‏ (ד\"ה"}, {"ch": 19, "v": 28, "aliyah": 3, "heb": "וְשֶׂ֣רֶט לָנֶ֗פֶשׁ לֹ֤א תִתְּנוּ֙ בִּבְשַׂרְכֶ֔ם וּכְתֹ֣בֶת קַֽעֲקַ֔ע לֹ֥א תִתְּנ֖וּ בָּכֶ֑ם אֲנִ֖י יְהֹוָֽה׃", "onk": "וְחִבּוּל עַל מִית לָא תִתְּנוּן בְּבִסְרְיכוֹן וְרוּשְׁמִין חֲרִיתִין לָא תִתְּנוּן בְּכוֹן אֲנָא יְיָ:", "onk_en": "Gashes for the dead do not make in your skin. Do not put tattoo marks on yourselves, I am Adonoy.", "pj": "וְשׁוֹרְטַת חִיבוּל עַל נְפַשׁ דְמִית לָא תִתְּנוּן בִּבְשַרְכוֹן וּכְתַב חָקִיק לִרְשַׁם חָרִית צִיוּרָא לָא תִתְּנוּן בְּכוֹן אֲנָא יְיָ", "pj_en": "And a corrupting incision for the soul of the dead thou shalt not make in thy flesh, neither set upon yourselves an inscription by the incutting of any figurated sign: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ושרט לנפש.<\/b> כֵּן דַּרְכָּן שֶׁל אֱמוֹרִיִּים לִהְיוֹת מְשָׂרְטִין בְּשָֹרָם כְּשֶׁמֵּת לָהֶם מֵת:<br><br><b>וכתבת קעקע.<\/b> כְּתָב מְחֻקֶּה וְשָׁקוּעַ שֶׁאֵינוֹ נִמְחָק לְעוֹלָם שֶׁמְּקַעְקְעוֹ בְּמַחַט וְהוּא מַשְׁחִיר לְעוֹלָם:<br><br><b>קעקע.<\/b> לְשׁוֹן וְהוֹקַע אוֹתָם (במדבר כ\"ה), וְהוֹקַעְנוּם (שמואל ב כ\"א), תּוֹחֲבִין עֵץ בָּאָרֶץ וְתוֹלִין אוֹתָם עֲלֵיהֶם, וְנִמְצְאוּ מְחֻקִּין וּתְחוּבִין בַּקַּרְקַע, פורפו\"ינט בְּלַעַז:", "rashi_en": "‎ ‎‎‎‎ושרט לנפש‏‎ ‎[YE SHALL NOT MAKE] ANY CUTTINGS [IN YOUR FLESH] FOR THE DEAD — This was the practice of the Amorites (a general term for heathens) to make cuttings in their flesh when someone belonging to them died. <br><br>וכתבת קעקע [NOR SHALL YE IMPRESS] ANY WRITING BY ETCHING [UPON YOU] — i. e. a writing engraved (more lit., dug into) and sunk into the flesh and which can never be erased because it is pricked in with a needle and remains black forever.<br><br>קעקע (root יקע) is an expression connected in sense with והוקע in (Numbers 25:4) “and hang them (והוקע אותם)\" and with (II Samuel 21:6) \"and we will hang them (הוקענום)\". They drove poles into the ground and hanged them upon these — consequently they themselves, as the poles, were, so to speak, dug in and inserted in the ground; pourpoint in O. F."}, {"ch": 19, "v": 29, "aliyah": 3, "heb": "אַל־תְּחַלֵּ֥ל אֶֽת־בִּתְּךָ֖ לְהַזְנוֹתָ֑הּ וְלֹא־תִזְנֶ֣ה הָאָ֔רֶץ וּמָלְאָ֥ה הָאָ֖רֶץ זִמָּֽה׃", "onk": "לָא תַחֵל יָת בְּרַתָּךְ <b>לְאַטְעֲיוּתַהּ<\/b> וְלָא תִטְעֵי אַרְעָא וְתִתְמְלֵי אַרְעָא <b>עֵצַת חִטְאִין<\/b>:", "onk_en": "You shall not defile your daughter by causing her to engage in harlotry [<b>err<\/b>] lest the land be turned astray, and the land be filled with lewdness [<b>a sinful plan<\/b>].", "pj": "לָא תִפְסוּן יַת בְּנָתֵיכוֹן לְמִסְבָא יַתְהוֹן לִזְנוּ וְלָא תִשְׁהוּן לְמִסְבָא בְּנָתֵיכוֹן לְגוּבְרִין סְמוּךְ לְפִירְקֵיהוֹן דְלָא יְטַעֲוַון בִּזְנוּ בָּתַר עַמְמֵי אַרְעָא וְתִיתְמְלֵי אַרְעָא זְנוּ", "pj_en": "You shall not profane your daughters to give them up to fornication: neither delay to gi
