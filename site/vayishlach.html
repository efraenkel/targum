תָּה צָרִיךְ, וְזֶהוּ לְנֶגְדֶּךָ – בְּשָׁוֶה לְךָ:", "rashi_en": "נסעה is an imperative like שִׁמְעָה and שִׁלָחָה which are equivalent to שְׁמַע \"hearken!” and שְׁלֵח “send!” Similarly here,  נִסְעָה is equivalent to נְסַע “travel on!”, where the נ is a root-letter of the word and not the prefix of the future in which case the word would mean “let us travel on”, similar to the following word ונלכה “and let us go”. The Targum also takes it in this sense, rendering it: “Travel on and let us go\". Thus Esau said to Jacob, “Travel thou on from here and let us go etc.<br><br>ואלכה לננדך means AND I WILL GO SIDE BY SIDE WITH THEE — I will do you this favour: that I will take a longer time on my journey by going slowly as is necessary for you. This is the meaning of לנגדך — alongside of you. "}, {"ch": 33, "v": 13, "aliyah": 4, "heb": "וַיֹּ֣אמֶר אֵלָ֗יו אֲדֹנִ֤י יֹדֵ֙עַ֙ כִּֽי־הַיְלָדִ֣ים רַכִּ֔ים וְהַצֹּ֥אן וְהַבָּקָ֖ר עָל֣וֹת עָלָ֑י וּדְפָקוּם֙ י֣וֹם אֶחָ֔ד וָמֵ֖תוּ כׇּל־הַצֹּֽאן׃", "onk": "וַאֲמַר לֵיהּ רִבּוֹנִי יְדַע אֲרֵי יָנְקַיָּא רַכִּיכִין וְעָנָא וְתוֹרֵי מֵינִקְתָּא עָלָי וּדְחוֹקִנּוּן יוֹמָא חַד וִימוּתוּן כָּל עָנָא:", "onk_en": "He [Yaakov] said to him, My master knows that the children are delicate, and that the sheep and cattle with me are nursing. If they are driven hard for [even] one day, all the sheep will die.", "pj": "וַאֲמַר לֵיהּ רִבּוֹנִי יְדַע אֲרוּם טַלְיָיא חַטְיָן וְעָנָא וְתוֹרֵי דְמֵיַינְקַן עָלַי וְאִין דְחִיקְנָא לְהוֹם יוֹמָא חַד וִימוּתוּן כָּל עָנָא", "pj_en": "And he said to him, My lord knoweth that the children are tender, and the flocks and kine giving milk are with me; and if I overdrive them one day, all the flock may die.", "tj": "אֲרוּם טַלְיָיא חַטְיָין:", "tj_en": "That the children are tender.", "rashi": "<b>עלות עלי.<\/b> הַצֹּאן וְהַבָּקָר, שֶׁהֵן עָלוֹת, מֻטָּלוֹת עָלַי לְנַהֲלָן לְאַט:<br><br><b>עלות.<\/b> מְגַדְּלוֹת עוֹלְלֵיהֶן, לְשׁוֹן עוֹלֵל וְיוֹנֵק (איכה ב'), עוּל יָמִים (ישעיהו ס\"ה), וּשְׁתֵּי פָרוֹת עָלוֹת (שמואל א ו') וּבְלַעַז אנפנטיי\"ש:<br><br><b>ודפקום יום אחד.<\/b> לְיַגְּעָם בַּדֶּרֶךְ בִּמְרוּצָה <b>ומתו כל הצאן<\/b>:<br><br><b>ודפקום.<\/b> כְּמוֹ קוֹל דּוֹדִי דּוֹפֵק (שיר השירים), נוֹקֵשׁ בַּדֶּלֶת:", "rashi_en": "עלות עלי WITH YOUNG ARE WITH ME — The sheep and the oxen which are giving suck constitute a charge upon me (עלי) to drive them slowly.<br><br>עלות means bringing up their young. Words of the same root are found in (Lamentations 2:11) “young children (עולל) and the sucklings”: (IsaiahLXV.20) “an infant (עול) of days”: (1 Samuel 6:7) “and two milch kine (עלות)”. old French enfantées.<br><br>ודפקום יום אחד AND IF MEN SHOULD OVERDRIVE THEM, wearying them on the journey by making them run, מתו כל הצאן ALL THE FLOCKS WILL DIE. <br><br>ודפקום has the same meaning as in (Song. 5:2) “Hark, my beloved knocketh (דופק)” — knocks at the door — so that it means to beat the animals in order that they may travel quickly. "}, {"ch": 33, "v": 14, "aliyah": 4, "heb": "יַעֲבׇר־נָ֥א אֲדֹנִ֖י לִפְנֵ֣י עַבְדּ֑וֹ וַאֲנִ֞י אֶֽתְנָהֲלָ֣ה לְאִטִּ֗י לְרֶ֨גֶל הַמְּלָאכָ֤ה אֲשֶׁר־לְפָנַי֙ וּלְרֶ֣גֶל הַיְלָדִ֔ים עַ֛ד אֲשֶׁר־אָבֹ֥א אֶל־אֲדֹנִ֖י שֵׂעִֽירָה׃", "onk": "יְעִבַּר <b>כְּעַן<\/b> רִבּוֹנִי קֳדָם עַבְדֵּיהּ וַאֲנָא אֱדַבֵּר בְּנִיחַ לְרֶגֶל עוֹבַדְתָּא דִי קֳדָמַי וּלְרֶגֶל יָנְקַיָּא עַד דִּי אֵעוֹל לְוַת רִבּוֹנִי לְשֵׂעִיר:", "onk_en": "Please [<b>Now<\/b>] my master, go on ahead of your servant. I will lead on gently, in my slow pace, according to the pace of the work that is before me, and according to the pace of the children, until I come to my master in Seir.", "pj": "יְעִיבַּר בְּבָעוּ רִבּוֹנִי וִיטַיֵיל קֳדָם עַבְדֵיהּ וַאֲנָא אִידְבַּר בִּנְיָיחָא לְבִלְחוֹדוֹי לְרֶגֶל עִיבִדְתָּא דְאִית קֳדָמָי וּלְרֶגֶל אוּלְפַן טַלְיָא עַד זְמַן דְאֵיתֵי לְוַת רִיבּוֹנִי לְגַבְלָא", "pj_en": "Let me beseech my lord to pass over and journey before thy servant, and I will lead oil quietly alone, according to the foot of the work which is before me, and according to the foot of the instruction of the children; until the time that I come to my lord at Gabla.", "tj": "", "tj_en": "", "rashi": "<b>יעבר נא אדני.<\/b> אַל נָא תַאֲרִיךְ יְמֵי הֲלִיכָתְךָ, עֲבֹר כְּפִי דַּרְכְּךָ וְאַף אִם תִּתְרַחֵק:<br><br><b>אתנהלה.<\/b> אֶתְנַהֵל, הֵ\"א יְתֵירָה, כְּמוֹ אֵרְדָה, אֶשְׁמְעָה:<br><br><b>לאטי.<\/b> לְאַט שֶׁלִּי, לְשׁוֹן נַחַת, הַהוֹלְכִים לְאַט, לְאַט לִי לַנַּעַר (שמואל ב י\"ח). לְאִטִּי הַלָּמֶ\"ד מִן הַיְסוֹד, וְאֵינָהּ מְשַׁמֶּשֶׁת – אֶתְנַהֵל נַחַת שֶׁלִּי:<br><br><b>לרגל המלאכה.<\/b> לְפִי צֹרֶךְ הֲלִיכַת רַגְלֵי הַמְּלָאכָה הַמֻּטֶּלֶת עָלַי לְהוֹלִיךְ:<br><br><b>ולרגל הילדים.<\/b> לְפִי רַגְלֵיהֶם שֶׁהֵם יְכוֹלִים לֵילֵךְ:<br><br><b>עד אשר אבא אל אדני שעירה.<\/b> הִרְחִיב לוֹ הַדֶּרֶךְ, שֶׁלֹּא הָיָה דַעְתּוֹ לָלֶכֶת אֶלָּא עַד סֻכּוֹת; אָמַר אִם דַּעְתּוֹ לַעֲשׂוֹת לִי רָעָה, יַמְתִּין עַד בּוֹאִי אֶצְלוֹ, וְהוּא לֹא הָלַךְ; וְאֵימָתַי יֵלֵךְ? בִּימֵי הַמָּשִׁיחַ (בראשית רבה), שֶׁנֶּאֱמַר וְעָלוּ מוֹשִׁעִים בְּהַר צִיּוֹן לִשְׁפֹּט אֶת הַר עֵשָׂו (עובדיה א'); וּמִ\"אַ יֵשׁ לְפָרָשָׁה זוֹ רַבִּים:", "rashi_en": "יעבר נא אדני LET MY LORD, I PRAY THEE, PASS — do not prolong the time of your journey: pass on at your usual speed even though you thereby get far away from me.<br><br>אתנהלה is the same as אתנהל I WILL LEAD ON. The ה at the end of the word is redundant as in (8:21) ארדה “I will go down”, and in (Psalms 85:9) אשמעה “I will hear”.<br><br>לאטי SLOWLY — the word means “my slowness\", לאט having the meaning of ease, gentleness. Examples are: (Isaiah 8:6) “that go (לאט) softly”; (2 Samuel 18:6) “Deal (לאט) gently for my sake with the young man.” In לאטי the ל is a root-letter and not a prefix, so that the meaning is, “I will lead on at my slow rate”.<br><br>לרגל המלאכה ACCORDING TO THE PACE OF THE DROVE — according to the requirements made by the pace of the feet of the cattle which is incumbent on me to drive.<br><br>ולרגל הילדים AND ACCORDING TO THE PACE OF THE CHILDREN — according to the speed (רגל) which they are able to keep up.<br><br>עד אשר אבא אל אדני שעירה UNTIL I COME UNTO MY LORD UNTO SEIR — He mentioned a much longer journey, for he really intended to go only as far as Succoth (Avodah Zarah 25b). He said, “If he means to do me harm let him wait to do so until I reach his abode at Seir.” Therefore he did not go to Seir. But when will he go? In the days of the Messiah, as it is said (Obadiah 1:21) “And saviours shall go up on Mount Zion to judge the mount of Esau”. There are many Midrashic explanations of this section. "}, {"ch": 33, "v": 15, "aliyah": 4, "heb": "וַיֹּ֣אמֶר עֵשָׂ֔ו אַצִּֽיגָה־נָּ֣א עִמְּךָ֔ מִן־הָעָ֖ם אֲשֶׁ֣ר אִתִּ֑י וַיֹּ֙אמֶר֙ לָ֣מָּה זֶּ֔ה אֶמְצָא־חֵ֖ן בְּעֵינֵ֥י אֲדֹנִֽי׃", "onk": "וַאֲמַר עֵשָׂו אֶשְׁבּוֹק כְּעַן עִמָּךְ מִן עַמָּא דִּעִמִּי וַאֲמַר לְמָא דְנַן אַשְׁכַּח רַחֲמִין בְּעֵינֵי רִבּוֹנִי:", "onk_en": "Eisov said, Let me leave [<b>now<\/b>] with you some of the people that are with me. He [Yaakov] said, What for? Let me find favor in the eyes of my master.", "pj": "וַאֲמַר עֵשָו אֶשְׁבּוֹק כְּדוּן עִמָךְ מִן פּוֹלְמוּסִין דְעִמִי וַאֲמַר לְמָא דְנַן אַשְׁכַּח רַחֲמִין קֳדָם רִבּוֹנִי", "pj_en": "And Esau said, Let me now leave with thee some of the soldiers who are with me. But he said, Why this? Let me find favour before thee, my lord.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר למה זה.<\/b> תַעֲשֶׂה לִי טוֹבָה זוֹ שֶׁאֵינִי צָרִיךְ לָהּ:<br><br><b>אמצא חן בעיני אדני.<\/b> וְלֹא תְשַׁלֵּם לִי עַתָּה שׁוּם גְּמוּל:", "rashi_en": "ויאמר למה זה means AND HE SAID, WHY IS IT— that thou shouldst do me a favour which I do not need?”<br><br>אמצא חן בעיני אדני LET ME FIND FAVOUR IN THE EYES OF MY LORD and do not give me any recompense at present for the gifts I have made you."}, {"ch": 33, "v": 16, "aliyah": 4, "heb": "וַיָּ֩שׇׁב֩ בַּיּ֨וֹם הַה֥וּא עֵשָׂ֛ו לְדַרְכּ֖וֹ שֵׂעִֽירָה׃", "onk": "וְתָב בְּיוֹמָא הַהוּא עֵשָׂו לְאָרְחֵיהּ לְשֵׂעִיר:", "onk_en": "On that day Eisov returned on his way—going to Seir.", "pj": "וְאִתְעֲבֵיד נִיסָא לְיַעֲקב וְתַב בְּיוֹמָא הַהוּא עֵשָו לְאָרְחֵיהּ לְגַבְלָא", "pj_en": "And a miracle was wrought for Jakob, and that day Esau returned on his way to Gabla.", "tj": "", "tj_en": "", "rashi": "<b>וישב ביום ההוא עשו לדרכו.<\/b> עֵשָׂו לְבַדּוֹ, וְד' מֵאוֹת אִישׁ שֶׁהָלְכוּ עִמּוֹ נִשְׁמְטוּ מֵאֶצְלוֹ אֶחָד אֶחָד, וְהֵיכָן פָּרַע לָהֶם הַקָּבָּ\"ה? בִּימֵי דָוִד, שֶׁנֶּאֱמַר כִּי אִם אַרְבַּע מֵאוֹת אִישׁ נַעַר אֲשֶׁר רָכְבוּ עַל הַגְּמַלִּים (שמואל א ל') (בראשית רבה):", "rashi_en": "וישב ביום ההוא עשו לדרכו SO ESAU RETURNED THAT DAY ON HIS WAY — Esau alone returned, but the four hundred men who had accompanied him slipped away from him one by one. When did the Holy One, blessed be He, reward them for this? In the days of David, as it is said (1 Samuel 30:17) (in reference to an attack which he made upon the Amalekites, descendants of Esau) “[and there escaped not a man of them] save four hundred young men who rode upon camels” (Genesis Rabbah 78:15). "}, {"ch": 33, "v": 17, "aliyah": 4, "heb": "וְיַעֲקֹב֙ נָסַ֣ע סֻכֹּ֔תָה וַיִּ֥בֶן ל֖וֹ בָּ֑יִת וּלְמִקְנֵ֙הוּ֙ עָשָׂ֣ה סֻכֹּ֔ת עַל־כֵּ֛ן קָרָ֥א שֵׁם־הַמָּק֖וֹם סֻכּֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיַעֲקֹב נְטַל לְסֻכּוֹת וּבְנָא לֵיהּ בֵּיתָא וְלִבְעִירֵיהּ עֲבַד מְטַלָּן עַל כֵּן קְרָא שְׁמָא דְאַתְרָא סֻכּוֹת:", "onk_en": "Yaakov traveled to Sukkos and built himself a house, and for his livestock he made shelters. He therefore named the place Sukkos.", "pj": "וְיַעֲקב נָטַל לְסוּכּוֹת וְאִיתְעַכֵּב תַּמָן תְּרֵיסַר יַרְחֵי שַׁתָּא וּבְנָא לֵיהּ בֵּי מֶדְרָשָׁא וּלְגֵיתוֹי עָבַד מַטְלָן בְּגִין כֵּן קָרָא שְׁמָא דְאַתְרָא סוּכּוֹת", "pj_en": "And Jakob journeyed to Succoth, and sojourned there the twelve months of the year; and he builded in it a midrasha, and for his flocks he made booths; therefore he called the name of the place Succoth.", "tj": "", "tj_en": "", "rashi": "<b>ויבן לו בית.<\/b> שָׁהָה שָׁם י\"ח חֹדֶשׁ, קַיִץ וְחֹרֶף וְקַיִץ (מגילה י\"ז), סֻכּוֹת – קַיִץ; בַּיִת – חֹרֶף, סֻכּוֹת – קַיִץ:", "rashi_en": "ויבן לו בית AND HE BUILT FOR HIMSELF A HOUSE — He stayed there eighteen months — summer, winter and summer again (Megillah 17a); for the first mention of Succoth (booths which are erected for the cattle) points to the summer (when booths are necessary for the cattle), the mention of building a house to the winter, and the second mention of booths to the next summer. "}, {"ch": 33, "v": 18, "aliyah": 4, "heb": "וַיָּבֹא֩ יַעֲקֹ֨ב שָׁלֵ֜ם עִ֣יר שְׁכֶ֗ם אֲשֶׁר֙ בְּאֶ֣רֶץ כְּנַ֔עַן בְּבֹא֖וֹ מִפַּדַּ֣ן אֲרָ֑ם וַיִּ֖חַן אֶת־פְּנֵ֥י הָעִֽיר׃", "onk": "וַאֲתָא יַעֲקֹב שְׁלִים קַרְתָּא דִשְׁכֶם דִּי בְּאַרְעָא דִכְנָעַן בְּמֵיתֵיהּ מִפַּדַּן דַּאֲרָם וּשְׁרָא לָקֳבֵל (אַפֵּי) קַרְתָּא:", "onk_en": "Yaakov arrived safely at the city of Shechem, which is in the Land of Canaan, when he came from Padan Aram. He encamped before the city.", "pj": "וְאָתָא יַעֲקב שָׁלֵם בְּכָל דִילֵיהּ לְקַרְתָּא דִשְׁכֶם דִי בְאַרְעָא דִכְנָעַן בְּמֵיתֵיהּ מִפַּדַן אֲרָם וּשְׁרָא לְקָבֵיל קַרְתָּא", "pj_en": "Then came Jakob in peace with all that he had to the city of Shekem, in the land of Kenaan, in his Coming from Padan Aram; and he dwelt near the city,", "tj": "", "tj_en": "", "rashi": "<b>שלם.<\/b> שָׁלֵם בְּגוּפוֹ, שֶׁנִּתְרַפֵּא מִצָּלַעְתּוֹ; שָׁלֵם בְּמָמוֹנוֹ, שֶׁלֹּא חָסַר כְּלוּם מִכָּל אוֹתוֹ דּוֹרוֹן; שָׁלֵם בְּתוֹרָתוֹ, שֶׁלֹּא שָׁכַח תַּלְמוּדוֹ בְּבֵית לָבָן (שבת ל\"ג):<br><br><b>עיר שכם.<\/b> כְּמוֹ לְעִיר, וְכָמוֹהוּ עַד בּוֹאָנָה בֵּית לָחֶם (רות א'):<br><br><b>בבאו מפדן ארם.<\/b> כְּאָדָם הָאוֹמֵר לַחֲבֵרוֹ יָצָא פְּלוֹנִי מִבֵּין שִׁנֵּי אֲרָיוֹת וּבָא שָׁלֵם, אַף כָּאן וַיָּבֹא שָׁלֵם מִפַּדַּן אֲרָם, מִלָּבָן וּמֵעֵשָׂו שֶׁנִזְדַּוְּגוּ לוֹ בַּדֶּרֶךְ:", "rashi_en": "שלם SAFELY (literally, whole, perfect, unimpaired) — unimpaired in body (health) because he was cured of his lameness; whole as regards his possessions for he was not short of anything even though he had given that gift (for his remaining cattle soon bore other young; cf. Rashi on Genesis 30:43); and perfect in his knowledge of the Torah for whilst he was in Laban’s house he had not forgotten what he had before learned (Shabbat 33b).<br><br>עיר שכם — the word עיר is equivalent to לעיר to the city of. Similarly we have (Ruth 1:19) “until they came בית לחם” — “to Bethlehem\".<br><br>בבאו מפדן ארם WHEN HE CAME FROM PADAN-ARAM — This is stated here in the same way as a person says to his neighbour, “that man there has come from between the teeth of the lion and has returned unhurt”. Similarly here: he came whole from Padan-aram — from Laban and from Esau who had come to attack him on his journey. "}, {"ch": 33, "v": 19, "aliyah": 4, "heb": "וַיִּ֜קֶן אֶת־חֶלְקַ֣ת הַשָּׂדֶ֗ה אֲשֶׁ֤ר נָֽטָה־שָׁם֙ אׇהֳל֔וֹ מִיַּ֥ד בְּנֵֽי־חֲמ֖וֹר אֲבִ֣י שְׁכֶ֑ם בְּמֵאָ֖ה קְשִׂיטָֽה׃", "onk": "וּזְבַן יָת <b>אַחֲסָנַת<\/b> חַקְלָא דִּי פְרַס תַּמָּן מַשְׁכְּנֵיהּ מִידָא דִבְנֵי חֲמוֹר אֲבוּהִי דִשְׁכֶם בְּמֵאָה <b>חוּרְפָן<\/b>:", "onk_en": "He bought the part [<b>possession<\/b>] of the field where he had spread his tent, from the sons of Chamor, father of Shechem, for one hundred kesitahs [<b>sheep<\/b>].", "pj": "וּזְבַן יַת אַחֲסָנַת חֲקַל דִפְרַס תַּמָן מַשְׁכְּנֵיהּ מִן יַד בְּנֵי חֲמוֹר אָבוּי דִשְׁכֶם בְּמֵאָה מַרְגַלְיָין", "pj_en": "and bought the possession of a field where lie spread his tent from the hand of the sons of Hamor father of Shekem, for a hundred pearls.", "tj": "מַרְגַלְיָן:", "tj_en": "", "rashi": "<b>קשיטה.<\/b> מָעָה. אָרַ\"עֲ כְּשֶׁהָלַכְתִּי לִכְרַכֵּי הַיָּם הָיוּ קוֹרִין לְמָעָה קְשִׂיטָה (וְתַרְגּוּמוֹ חוּרְפָן – טוֹבִים, חֲרִיפִים בְּכָל מָקוֹם, כְּגוֹן עוֹבֵר לַסּוֹחֵר):", "rashi_en": "קשיטה is a Meah (a certain coin) — Rabbi Akiba said, “When I visited the coast-towns I found that they called a Meah a Kesittah (Rosh Hashanah 26a). In the Targum it is rendered by חורפן good ones, current everywhere: the same idea as (23:16) “current with the merchant. "}, {"ch": 33, "v": 20, "aliyah": 4, "heb": "וַיַּצֶּב־שָׁ֖ם מִזְבֵּ֑חַ וַיִּ֨קְרָא־ל֔וֹ אֵ֖ל אֱלֹהֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲקֵם תַּמָּן מַדְבְּחָא <b>וּפְלַח עֲלוֹהִי קֳדָם<\/b> אֵל אֱלָהָא <b>דְ<\/b>יִשְׂרָאֵל:", "onk_en": "He erected an altar there and called it [<b>worshiped upon it before<\/b>] the Almighty is [<b>the<\/b>] God of Yisrael.", "pj": "וְאָקִים תַּמָן מַדְבְּחָא וְתַמָן יְהַב מַעְשְרַיָא דְאַפְרֵישׁ מִן כָּל דִילֵיהּ קֳדָם אֵל אֱלָהָא דְיִשְרָאֵל", "pj_en": "And he raised there an altar, and there he gave the tithes which he had set apart of all that he had before God, the God of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא לו אל אלהי ישראל.<\/b> לֹא שֶׁהַמִּזְבֵּחַ קָרוּי אֱלֹהֵי יִשְׂרָאֵל אֶלָּא עַל שֵׁם שֶׁהָיָה הַקָּבָּ\"ה עִמּוֹ וְהִצִּילוֹ קָרָא שֵׁם הַמִּזְבֵּחַ עַל שֵׁם הַנֵּס, לִהְיוֹת שִׁבְחוֹ שֶׁל מָקוֹם נִזְכָּר בִּקְרִיאַת הַשֵּׁם, כְּלוֹמַר מִי שֶׁהוּא אֵל, הוּא הַקָּבָּ\"ה, הוּא לֵאלֹהִים לִי, שֶׁשְּׁמִי יִשְׂרָאֵל. וְכֵן מָצִינוּ בְּמֹשֶׁה וַיִּקְרָא שְׁמוֹ ה' נִסִּי (שמות י\"ז), לֹא שֶׁהַמִּזְבֵּחַ קָרוּי ה', אֶלָּא עַל שֵׁם הַנֵּס קָרָא שֵׁם הַמִּזְבֵּחַ לְהַזְכִּיר שִׁבְחוֹ שֶׁל הַקָּדוֹשׁ בָּרוּךְ הוּא, ה' הוּא נִסִּי. וְרַבּוֹתֵנוּ דָּרְשׁוּ שֶׁהַקָּבָּ\"ה קְרָאוֹ לְיַעֲקֹב אֵל (מגילה י\"ח); וְדִבְרֵי תוֹרָה כְּפַטִּישׁ יְפֹצֵץ סָלַע (ע' שבת פ\"ח) – מִתְחַלְּקִים לְכַמָּה טְעָמִים, וַאֲנִי לְיַשֵּׁב פְּשׁוּטוֹ שֶׁל מִקְרָא בָּאתִי:", "rashi_en": "ויקרא לו אל אלהי ישראל AND HE CALLED IT EL-ELOHE ISRAEL — It does not mean that the altar was named “The God of Israel” thus bearing a Divine Name, but because the Holy One blessed be He, had been with him and delivered him he called the name of the altar by a term that had an allusion to the miracle, so that the praise of God might be mentioned when people called it by its name. Thus it would mean: He who is El, God — viz, the Holy One, blessed be He — is the God of me whose name is Israel. We find something similar in the case of Moses (Exodus 17:15): “And he called its (the altar’s) name Adonai-Nissi. Not that the altar was called by the Divine Name Adonai, but he named the altar thus, to mention the praise of the Holy One, blessed be He: “The Lord — He is my banner!\" Our Rabbis, of blessed memory, expounded it thus: that the Holy One, blessed be He, called Jacob by the name El. The verse therefore should be translated “and the God of Israel called him (Jacob) El” (Megillah 18a). And in reference to all these different explanations it may be said that the words of the Torah — just as a hammer splits the rock into many different pieces (Shabbat 88b) — may be given many different explanations. I however make it my aim to give the plain sense of Scripture."}, {"ch": 34, "v": 1, "aliyah": 5, "heb": "וַתֵּצֵ֤א דִינָה֙ בַּת־לֵאָ֔ה אֲשֶׁ֥ר יָלְדָ֖ה לְיַעֲקֹ֑ב לִרְא֖וֹת בִּבְנ֥וֹת הָאָֽרֶץ׃", "onk": "וּנְפָקַת דִּינָה בַּת לֵאָה דִּי יְלִידַת לְיַעֲקֹב לְמֶחֱזֵי בִּבְנַת אַרְעָא:", "onk_en": "Deenah went out, the daughter of Leah, whom she had borne to Yaakov, to see [visit] the local girls.", "pj": "וּנְפָקַת דִינָה בְּרַת לֵאָה דִי יְלִידַת לְיַעֲקב לְמֵיחְמֵי בְּנִימוּס בְּנַת עַמֵי אַרְעָא", "pj_en": "And Dinah the daughter of Leah whom she bare to Jakob, went forth to see the manners of the daughters of the people of the land.", "tj": "", "tj_en": "", "rashi": "<b>בת לאה.<\/b> וְלֹא בַת יַעֲקֹב? אֶלָּא עַל שֵׁם יְצִיאָתָהּ נִקְרֵאת בַּת לֵאָה, שֶׁאַף הִיא יַצְאָנִית הָיְתָה (בראשית רבה), שֶׁנֶּאֱמַר וַתֵּצֶא לֵאָה לִקְרָאתוֹ (וְעָלֶיהָ מָשְׁלוּ הַמָּשָׁל כְּאִמָּהּ כְּבִתָּהּ):", "rashi_en": "בת לאה THE DAUGHTER OF LEAH — so Scripture calls her. Why not the daughter of Jacob? But just because she “went out” she is called Leah’s daughter, since she, too, was fond “of going out” (Genesis Rabbah 80:1), as it is said (30:16) “and Leah went out to meet him”. With an allusion to her they formulated the proverb: “Like mother, like daughter”. "}, {"ch": 34, "v": 2, "aliyah": 5, "heb": "וַיַּ֨רְא אֹתָ֜הּ שְׁכֶ֧ם בֶּן־חֲמ֛וֹר הַֽחִוִּ֖י נְשִׂ֣יא הָאָ֑רֶץ וַיִּקַּ֥ח אֹתָ֛הּ וַיִּשְׁכַּ֥ב אֹתָ֖הּ וַיְעַנֶּֽהָ׃", "onk": "וַחֲזָא יָתַהּ שְׁכֶם בַּר חֲמוֹר חִיוָאָה רַבָּא דְאַרְעָא וּדְבַר יָתַהּ וּשְׁכִיב יָתַהּ וְעַנְיַהּ:", "onk_en": "She was seen by Shechem, son of Chamor, the Chivite, who was the prince of the land. He took her, was with her, and mistreated her.", "pj": "וַחֲמָא יָתָהּ שְׁכֶם בַּר חֲמוֹר חִיוָאָה רַבָּא דְאַרְעָא וּדְבַר יָתָהּ בְּאָנוּסָה וּשְׁכִיב עִמָהּ וְסַגְפָהּ", "pj_en": "And Shekem, the son of Hamor the Hivite, prince of the land, saw her, and took her by force, and lay with her and afflicted her.", "tj": "", "tj_en": "", "rashi": "<b>וישכב אתה.<\/b> כְּדַרְכָּהּ:<br><br><b>ויענה.<\/b> שֶׁלֹּא כְדַרְכָּהּ (בראשית רבה):", "rashi_en": " וישכב אתה AND HE LAID WITH HER — naturally (vaginally).<br><br>ויענה AND HE AFFLICTED HER — unnaturally (anally) (Genesis Rabbah 80:1)."}, {"ch": 34, "v": 3, "aliyah": 5, "heb": "וַתִּדְבַּ֣ק נַפְשׁ֔וֹ בְּדִינָ֖ה בַּֽת־יַעֲקֹ֑ב וַיֶּֽאֱהַב֙ אֶת־הַֽנַּעֲרָ֔ וַיְדַבֵּ֖ר עַל־לֵ֥ב הַֽנַּעֲרָֽ׃", "onk": "<b>וְאִתְרְעִיאַת<\/b> נַפְשֵׁיהּ בְּדִינָה בַּת יַעֲקֹב וּרְחֵים יָת עוּלֶמְתָּא וּמַלִיל עַל לִבָּא דְעוּלֶמְתָּא:", "onk_en": "He became deeply attached to [<b>He desired<\/b>] Deenah, the daughter of Yaakov, and he loved the girl. He spoke to the girl’s heart.", "pj": "וְאִתְרְעִיַית נַפְשֵׁיהּ בְּדִינָה בְּרַת יַעֲקב וּרְחַם יַת רִיבָא וּמַלֵיל פִּיוּסִין עַל לִבָּא דְרִיבָא", "pj_en": "And his soul delighted in Dinah the daughter of Jakob; and he loved the girl, and spake kindly to the heart of the girl.", "tj": "", "tj_en": "", "rashi": "<b>על לב הנערה.<\/b> דְּבָרִים הַמִּתְיַשְּׁבִים עַל הַלֵּב; רְאִי, אָבִיךְ בְּחֶלְקַת שָׂדֶה קְטַנָּה כַּמָּה מָמוֹן בִּזְבֵּז, אֲנִי אַשִּׂיאֵךְ וְתִקְנֶה הָעִיר וְכָל שְׂדוֹתֶיהָ:", "rashi_en": "על לב הנערה [AND SPAKE] LOVINGLY TO THE DAMSEL (literally, he spoke to the heart of the maiden) words that would appeal to her heart: See how much money your father has lavished for a small plot of field. I will marry you and you will then possess the city and all its fields (Genesis Rabbah 80:7). "}, {"ch": 34, "v": 4, "aliyah": 5, "heb": "וַיֹּ֣אמֶר שְׁכֶ֔ם אֶל־חֲמ֥וֹר אָבִ֖יו לֵאמֹ֑ר קַֽח־לִ֛י אֶת־הַיַּלְדָּ֥ה הַזֹּ֖את לְאִשָּֽׁה׃", "onk": "וַאֲמַר שְׁכֶם לַחֲמוֹר אֲבוּהִי לְמֵימָר סַב לִי יָת עוּלֶמְתָּא הָדָא לְאִנְתּוּ:", "onk_en": "Shechem spoke to his father Chamor, saying, Take this young girl for me as a wife.", "pj": "וַאֲמַר שְׁכֶם לַחֲמוֹר אָבוֹי לְמֵימָר סַב לִי יַת טַלְיְתָא הָדָא לְאִנְתּוּ", "pj_en": "And Shekem spake to Hamor his father, saying, Take for me this damsel to wife.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 5, "aliyah": 5, "heb": "וְיַעֲקֹ֣ב שָׁמַ֗ע כִּ֤י טִמֵּא֙ אֶת־דִּינָ֣ה בִתּ֔וֹ וּבָנָ֛יו הָי֥וּ אֶת־מִקְנֵ֖הוּ בַּשָּׂדֶ֑ה וְהֶחֱרִ֥שׁ יַעֲקֹ֖ב עַד־בֹּאָֽם׃", "onk": "וְיַעֲקֹב שְׁמַע אֲרֵי סָאֵיב יָת דִּינָה בְרַתֵּיהּ וּבְנוֹהִי הֲווֹ עִם גֵיתוֹהִי בְּחַקְלָא וְשָׁתִיק יַעֲקֹב עַד מֵיתֵיהוֹן:", "onk_en": "Yaakov heard that he had defiled his daughter, Deenah, [while] his sons were with the livestock in the fields. Yaakov remained silent until they returned.", "pj": "וְיַעֲקב שְׁמַע אֲרוּם סָאִיב יַת דִינָה בְּרַתֵּיהּ וּבְנוֹי הֲווֹ עִם גֵיתוֹי בְּחַקְלָא וּשְׁתִיק יַעֲקב עַד מֵיתֵיהוֹן", "pj_en": "But Jakob had heard that he had polluted Dinah his daughter, And his sons were with the flocks in the field, and Jakob was silent until they came.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 6, "aliyah": 5, "heb": "וַיֵּצֵ֛א חֲמ֥וֹר אֲבִֽי־שְׁכֶ֖ם אֶֽל־יַעֲקֹ֑ב לְדַבֵּ֖ר אִתּֽוֹ׃", "onk": "וּנְפַק חֲמוֹר אֲבוּהִי דִשְׁכֶם לְוַת יַעֲקֹב לְמַלָּלָא עִמֵּיהּ:", "onk_en": "Chamor, father of Shechem, went out to Yaakov to speak with him.", "pj": "וּנְפַק חֲמוֹר אָבוֹי דִשְׁכֶם לְוַת יַעֲקב לְמַלָלָא עִמֵיהּ", "pj_en": "And Hamor the father of Shekem came forth to Jakob to speak with him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 7, "aliyah": 5, "heb": "וּבְנֵ֨י יַעֲקֹ֜ב בָּ֤אוּ מִן־הַשָּׂדֶה֙ כְּשׇׁמְעָ֔ם וַיִּֽתְעַצְּבוּ֙ הָֽאֲנָשִׁ֔ים וַיִּ֥חַר לָהֶ֖ם מְאֹ֑ד כִּֽי־נְבָלָ֞ה עָשָׂ֣ה בְיִשְׂרָאֵ֗ל לִשְׁכַּב֙ אֶת־בַּֽת־יַעֲקֹ֔ב וְכֵ֖ן לֹ֥א יֵעָשֶֽׂה׃", "onk": "וּבְנֵי יַעֲקֹב עַלּוּ מִן חַקְלָא כַּד שְׁמָעוּ וְאִתְנְסִיסוּ גֻּבְרַיָּא וּתְקֵיף לְהוֹן לַחֲדָא אֲרֵי קְלָנָא עֲבַד בְּיִשְׂרָאֵל לְמִשְׁכַּב עִם בַּת יַעֲקֹב וְכֵן <b>לָא כָשַׁר לְאִתְעֲבָדָא<\/b>:", "onk_en": "The sons of Yaakov returned from the field when they heard [what had happened]. The men grieved and were very angry, for he [Shechem] had committed an outrage against Yisrael to lie with a daughter of Yaakov. Such a thing should not be done [<b>It is not fitting for such a think to have been done<\/b>].", "pj": "וּבְנוֹי דְיַעֲקב עָלוּ מִן חַקְלָא כְּדִי שָׁמְעַן וְאִתְנְסִיסוּ גוּבְרַיָא וּתְקֵיף לְהוֹם לַחֲדָא אֲרוּם קְלָנָא עָבַד שְׁכֶם בְּיִשְרָאֵל לְמִשְכּוֹב עִם בְּרַת יַעֲקב וְכֵן לָא הֲוָה כַּשְׁרָא לְאִתְעוֹבָדָא", "pj_en": "And the sons of Jakob had come up from the field when they heard. And the men were indignant, and very violently moved, because Shekem had wrought dishonour in Israel in lying with the daughter of Jakob; for so it was not right to have been done.", "tj": "", "tj_en": "", "rashi": "<b>וכן לא יעשה.<\/b> לְעַנּוֹת אֶת הַבְּתוּלוֹת, שֶׁהָאֻמּוֹת גָּדְרוּ עַצְמָן מִן הָעֲרָיוֹת עַל יְדֵי הַמַּבּוּל (בראשית רבה):", "rashi_en": "וכן לא יעשה AND THUS IT OUGHT NOT TO BE DONE — viz., to do violence to a maiden, for even the heathens have trained themselves (literally, have fenced themselves round) against unchastity as a consequence of the Flood which had come upon the world as a punishment for this sin (Genesis Rabbah 80:6). "}, {"ch": 34, "v": 8, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר חֲמ֖וֹר אִתָּ֣ם לֵאמֹ֑ר שְׁכֶ֣ם בְּנִ֗י חָֽשְׁקָ֤ה נַפְשׁוֹ֙ בְּבִתְּכֶ֔ם תְּנ֨וּ נָ֥א אֹתָ֛הּ ל֖וֹ לְאִשָּֽׁה׃", "onk": "וּמַלִּיל חֲמוֹר עִמְּהוֹן לְמֵימָר שְׁכֶם בְּרִי אִתְרְעִיאַת נַפְשֵׁיהּ בִּבְרַתְּכוֹן הָבוּ <b>כְעַן<\/b> יָתַהּ לֵיהּ לְאִנְתּוּ:", "onk_en": "Chamor spoke with them saying, My son, Shechem, desires your daughter. Please [<b>Now<\/b>] grant her to him for a wife.", "pj": "וּמַלֵיל עִמְהוֹן חֲמוֹר לְמֵימָר שְׁכֶם בְּרִי רְעִיַית נַפְשֵׁיהּ בִּבְרַתֵּיכוֹן הָבוּ בְּבָעוּ יָתָהּ לֵיהּ לְאִנְתּוּ", "pj_en": "And Hamor spake with them, saying, The soul of Shekem my son delighteth in your daughter: give her, I pray, to him to wife;", "tj": "", "tj_en": "", "rashi": "<b>חשקה.<\/b> חָפְצָה:", "rashi_en": "חשקה means desires."}, {"ch": 34, "v": 9, "aliyah": 5, "heb": "וְהִֽתְחַתְּנ֖וּ אֹתָ֑נוּ בְּנֹֽתֵיכֶם֙ תִּתְּנוּ־לָ֔נוּ וְאֶת־בְּנֹתֵ֖ינוּ תִּקְח֥וּ לָכֶֽם׃", "onk": "וְתִתְחַתְּנוּן בָּנָא בְּנָתֵיכוֹן תִּתְּנוּן לָנָא וְיָת בְּנָתָנָא תִּסְּבוּן לְכוֹן:", "onk_en": "Intermarry with us. Give us your daughters, and take our daughters for yourselves.", "pj": "וְתִתְעַרְבוּן בְּחִיתּוּנָא עִמָנָא בְּנַתְכוֹן תִּתְּנוּן לָנָא וְיַת בְּנָתָנָא תִּסְבוּן לְכוֹן", "pj_en": "and conjoin yourselves by marriage with us. Give your daughters to us, and take our daughters to you;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 10, "aliyah": 5, "heb": "וְאִתָּ֖נוּ תֵּשֵׁ֑בוּ וְהָאָ֙רֶץ֙ תִּהְיֶ֣ה לִפְנֵיכֶ֔ם שְׁבוּ֙ וּסְחָר֔וּהָ וְהֵֽאָחֲז֖וּ בָּֽהּ׃", "onk": "וְעִמָּנָא תֵּתְבוּן וְאַרְעָא תְּהֵי קֳדָמֵיכוֹן תִּיבוּ <b>וְעִבִידוּ<\/b> בַהּ סְחוֹרְתָא וְאַחֲסִינוּ בַּהּ:", "onk_en": "You will [then] live with us and the land will be open to you. Live and [<b>do<\/b>] trade in [<b>with<\/b>] it and possess it.", "pj": "וְעִמָנָא תְּתוּבוּן וְאַרְעָא תְּהִי קֳדָמֵיכוֹן בִּדְנִיחָא לְכוֹן תִּיבוּ וְעִבִידוּ בָהּ פְרַקְמַטְיָא וְאַחְסִינוּ בָהּ", "pj_en": "and dwell with us, and the land shall be before you, to dwell where you please and do business in it and possess it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 11, "aliyah": 5, "heb": "וַיֹּ֤אמֶר שְׁכֶם֙ אֶל־אָבִ֣יהָ וְאֶל־אַחֶ֔יהָ אֶמְצָא־חֵ֖ן בְּעֵינֵיכֶ֑ם וַאֲשֶׁ֥ר תֹּאמְר֛וּ אֵלַ֖י אֶתֵּֽן׃", "onk": "וַאֲמַר שְׁכֶם לַאֲבוּהָא וּלְאַחָהָא אַשְׁכַּח רַחֲמִין בְּעֵינֵיכוֹן וְדִי תֵימְרוּן לִי אֶתֵּן:", "onk_en": "Shechem said to her father and her brothers, Let me find favor in your eyes and what ever you say [ask of me], I will give.", "pj": "וַאֲמַר שְׁכֶם לְאָבוּהָא וּלְאָחָהָא אַשְׁכַּח רַחֲמִין בְּעֵינֵיכוֹן וּדְתֵימְרוּן לִי אִתֵּין", "pj_en": "And Shekem said to her father and to her brethren, Let me find grace in your sight, and what you shall tell me I will give.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 12, "aliyah": 5, "heb": "הַרְבּ֨וּ עָלַ֤י מְאֹד֙ מֹ֣הַר וּמַתָּ֔ן וְאֶ֨תְּנָ֔ה כַּאֲשֶׁ֥ר תֹּאמְר֖וּ אֵלָ֑י וּתְנוּ־לִ֥י אֶת־הַֽנַּעֲרָ֖ לְאִשָּֽׁה׃", "onk": "אַסְגּוֹ עֲלַי לַחֲדָא מוֹהֲרִין וּמַתְּנָן וְאֶתֵּן כְּמָא דִי תֵימְרוּן לִי וְהָבוּ לִי יָת עוּלֶמְתָּא לְאִנְתּוּ:", "onk_en": "Increase greatly the amount I must pay for the bridal dowry and gifts. I will give whatever you say, but give me the girl for a wife.", "pj": "אַסְגוּ עָלַי לַחֲדָא מוֹהֲרָא וּמַתְּנָא וְאִיתֵּין הֵיכְמָא דְתֵימְרוּן לִי וִיהָבוּ לִי יַת רִיבָא לְאִנְתּוּ", "pj_en": "Multiply upon me greatly dowry and gift, and I will give as you shall tell me; only give me the damsel to wife.", "tj": "פּוֹרַן כְּתוּבָּתָא:", "tj_en": "Dotation and marriage portion.", "rashi": "<b>מהר.<\/b> כְּתֻבָּה:", "rashi_en": "מהר DOWRY, refers to the Ketuba (the sum settled by the husband on his wife as set forth in the Ketuba — the marriage contract (Genesis Rabbah 80:7)."}, {"ch": 34, "v": 13, "aliyah": 5, "heb": "וַיַּעֲנ֨וּ בְנֵֽי־יַעֲקֹ֜ב אֶת־שְׁכֶ֨ם וְאֶת־חֲמ֥וֹר אָבִ֛יו בְּמִרְמָ֖ה וַיְדַבֵּ֑רוּ אֲשֶׁ֣ר טִמֵּ֔א אֵ֖ת דִּינָ֥ה אֲחֹתָֽם׃", "onk": "וַאֲתִיבוּ בְנֵי יַעֲקֹב יָת שְׁכֶם וְיָת חֲמוֹר אֲבוּהִי <b>בְּחָכְמָתָא<\/b> וּמַלִּילוּ דִּי סָאֵב יָת דִּינָה אֲחָתְהוֹן:", "onk_en": "The sons of Yaakov answered Shechem, and his father Chamor, with guile [<b>cleverness<\/b>], when they spoke; because he had defiled their sister, Deenah.", "pj": "וְאָתִיבוּ בְּנֵי יַעֲקב יַת שְׁכֶם וְיַת חֲמוֹר אָבוּי בְּחוּכְמָא וּמַלִילוּ בְּגִין דְסָאִיב יַת דִינָה אֲחַתְהוֹן", "pj_en": "But the sons of Jakob answered Shekem. and Hamor his father with subtilty, and so spake, because he had polluted Dinah their sister,", "tj": "", "tj_en": "", "rashi": "<b>במרמה.<\/b> בְּחָכְמָה:<br><br><b>אשר טמא.<\/b> הַכָּתוּב אוֹמֵר שֶׁלֹּא הָיְתָה רְמִיָּה, שֶׁהֲרֵי טִמֵּא אֶת דִּינָה אֲחֹתָם (בראשית רבה):", "rashi_en": "במרמה WITH GUILE — cleverly<br><br>אשר טמא BECAUSE HE HAD DEFILED — Scripture (the Sacred Historian) says that there was no deception (מרמה) in this because he had defiled Dinah their sister (Genesis Rabbah 80:8). "}, {"ch": 34, "v": 14, "aliyah": 5, "heb": "וַיֹּאמְר֣וּ אֲלֵיהֶ֗ם לֹ֤א נוּכַל֙ לַעֲשׂוֹת֙ הַדָּבָ֣ר הַזֶּ֔ה לָתֵת֙ אֶת־אֲחֹתֵ֔נוּ לְאִ֖ישׁ אֲשֶׁר־ל֣וֹ עׇרְלָ֑ה כִּֽי־חֶרְפָּ֥ה הִ֖וא לָֽנוּ׃", "onk": "וַאֲמָרוּ לְהוֹן לָא נִכּוּל לְמֶעְבַּד פִּתְגָּמָא הָדֵין לְמִתַּן יָת אֲחָתָנָא לִגְבַר דִּי לֵיהּ עָרְלְתָא אֲרֵי חִסּוּדָא הִיא לָנָא:", "onk_en": "They said to them, We cannot do such a thing—to give our sister [in marriage] to an uncircumcised man, for that is a disgrace to us.", "pj": "וַאֲמָרוּ לְהוֹם לָא נֵיכוֹל לְמֶעֱבַד יַת פִּתְגָמָא הָדֵין לְמִתַּן יַת אַחֲתָנָא לִגְבַר דִילֵיהּ עוּרְלְתָא אֲרוּם גְנוּתָא הוּא לָנָא", "pj_en": "and said to them, We cannot do this thing, to give our sister to a man who is uncircumcised, because that would be a disgrace to us.", "tj": "", "tj_en": "", "rashi": "<b>חרפה הוא.<\/b> שֶׁמֶץ פְּסוּל הוּא אֶצְלֵנוּ; הַבָּא לְחָרֵף חֲבֵרוֹ הוּא אוֹמֵר לוֹ עָרֵל אַתָּה אוֹ בֶּן עָרֵל. חֶרְפָּה בְּכָל מָקוֹם גִּדּוּף:", "rashi_en": "חרפה הוא THAT WERE A DISGRACE — Amongst us it is somewhat of a blot on our pedigree, for if one wishes to revile another, he says to him: “You are an uncircumcised person”, or “the son of an uncircumcised person”. The word חרפה always means “reviling”. "}, {"ch": 34, "v": 15, "aliyah": 5, "heb": "אַךְ־בְּזֹ֖את נֵא֣וֹת לָכֶ֑ם אִ֚ם תִּהְי֣וּ כָמֹ֔נוּ לְהִמֹּ֥ל לָכֶ֖ם כׇּל־זָכָֽר׃", "onk": "בְּרַם בְּדָא נִתְפֵּס לְכוֹן אִם תֶּהֱווֹן כְּוָתָנָא לְמִגְזַר לְכוֹן כָּל דְּכוּרָא:", "onk_en": "This is the only way we will consent to you: if you will be like us, circumcising all your males.", "pj": "בְּרַם בְּדָא נִתְפַּיֵיס לְכוֹן אִין תֶּהֱווֹן כְּוָתָנָא לְמִגְזַר לְכוֹן כָּל דְכוּרָא", "pj_en": "But in this we will accede to you, if you will be as we are by circumcising every male.", "tj": "", "tj_en": "", "rashi": "<b>נאות לכם.<\/b> נִתְרַצֶּה לָכֶם, לְשׁוֹן וַיֵּאֹתוּ (מלכים ב י\"ב):<br><br><b>להמול.<\/b> לִהְיוֹת נִמּוֹל. אֵינוֹ לְשׁוֹן לִפְעֹל אֶלָּא לְשׁוֹן לְהִפָּעֵל:", "rashi_en": "נאות לכם means WE WILL CONSENT UNTO YOU: it has the same meaning as (2 Kings 12:9) ויאותו “and they consented”.<br><br>להמול means TO BE CIRCUMCISED — It is not an active infinitive (Kal), but a passive infinitive (Niphal). "}, {"ch": 34, "v": 16, "aliyah": 5, "heb": "וְנָתַ֤נּוּ אֶת־בְּנֹתֵ֙ינוּ֙ לָכֶ֔ם וְאֶת־בְּנֹתֵיכֶ֖ם נִֽקַּֽח־לָ֑נוּ וְיָשַׁ֣בְנוּ אִתְּכֶ֔ם וְהָיִ֖ינוּ לְעַ֥ם אֶחָֽד׃", "onk": "וְנִתֵּן יָת בְּנָתָנָא לְכוֹן וְיָת בְּנָתֵיכוֹן נִסַּב לָנָא וְנִתּוּב עִמְּכוֹן וְנֵהֵי לְעַמָּא חָד:", "onk_en": "[Then] we will give our daughters to you, and we will take your daughters for ourselves. We will live together with you, and we will become one people.", "pj": "וְנִיתַּן יַת בְּנָתָנָא לְכוֹן וְיַת בְּנָתֵיכוֹן נִיסַב לָנָא וְנִיתַב עִמְכוֹן וּנְהֵי לְעַמָא חָד", "pj_en": "And we will give our daughters to you, and will take your daughters to us, and dwell with you, and be one people.", "tj": "", "tj_en": "", "rashi": "<b>ונתנו.<\/b> נוּ\"ן שְׁנִיָּה מֻדְגֶּשֶׁת לְפִי שֶׁהִיא מְשַׁמֶּשֶׁת בִּמְקוֹם שְׁתֵּי נוּנִי\"ן, וְנָתַנְנוּ:<br><br><b>ואת בנתיכם נקח לנו.<\/b> אַתָּה מוֹצֵא בַּתְּנַאי שֶׁאָמַר חֲמוֹר לְיַעֲקֹב וּבִתְשׁוּבַת בְּנֵי יַעֲקֹב לַחֲמוֹר, שֶׁתָּלוּ הַחֲשִׁיבוּת בִּבְנֵי יַעֲקֹב לִקַּח בְּנוֹת שְׁכֶם אֶת שֶׁיִּבְחֲרוּ לָהֶם, וּבְנוֹתֵיהֶם יִתְּנוּ לָהֶם לְפִי דַעְתָּם, דִּכְתִיב וְנָתַנּוּ אֶת בְּנֹתֵינוּ – לְפִי דַעְתֵּנוּ, וְאֶת בְּנֹתֵיכֶם נִקַּח לָנוּ – כְּכָל אֲשֶׁר נַחְפֹּץ; וּכְשֶׁדִּבְּרוּ חֲמוֹר וּשְׁכֶם בְּנוֹ אֶל יוֹשְׁבֵי עִירָם הָפְכוּ הַדְּבָרִים, אֶת בְּנֹתָם נִקַּח לָנוּ לְנָשִׁים וְאֶת בְּנֹתֵינוּ נִתֵּן לָהֶם, כְּדֵי לְרַצּוֹתָם שֶׁיֵּאוֹתוּ לְהִמּוֹל:", "rashi_en": "וְנָתַנּוּ THEN WILL WE GIVE — The second נ has a Dagesh because it serves the purpose of two -נs - וְנָתַנְנוּ (cf. Rashi on Genesis חנני 33:11).<br><br>ואת בנותיכם נקח לנו AND WE WILL TAKE YOUR DAUGHTERS TO US — You will find that in the proposition which Hamor made to Jacob (Genesis 34:9) and in the reply of Jacob’s sons to Hamor (in this verse) they (both parties to the proposition) regarded the sons of Jacob as being the more important — that they should take of the daughters of Shechem whomsoever they would select for themselves and that they should give their daughters to them (the men of Shechem) as they (Jacob’s sons) would think fit, as it is written, “and we will give our daughters’’ — as we think fit — “and we will take your daughters unto us” — whomsoever we please. When, however, Hamor and his son spoke to the inhabitants of their city (v. 21) they reversed the matter, saying, “their daughters we will take to us for wives, and our daughters we will give unto them\", instead of saying “they will give their daughters to us, and they will take our daughters to themselves\", in order to induce them to consent to be circumcised. "}, {"ch": 34, "v": 17, "aliyah": 5, "heb": "וְאִם־לֹ֧א תִשְׁמְע֛וּ אֵלֵ֖ינוּ לְהִמּ֑וֹל וְלָקַ֥חְנוּ אֶת־בִּתֵּ֖נוּ וְהָלָֽכְנוּ׃", "onk": "וְאִם לָא <b>תְקַבְּלוּן<\/b> מִנָּנָא לְמִגְזָר וּנְדַבֵּר יָת בְּרַתָּנָא וְנֵזֵיל:", "onk_en": "But if you do not listen to [<b>obey<\/b>] us to be circumcised, we will take our daughter and go.", "pj": "וְאִין לָא תְקַבְּלוּן מִנָנָא לְמִגְזַר וְנִסַב בְּתוֹקְפָא יַת בְּרַתָּנָא וְנֵזֵיל", "pj_en": "But if you will not hearken to us to be circumcised, we will take our daughter by force and will go.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 18, "aliyah": 5, "heb": "וַיִּֽיטְב֥וּ דִבְרֵיהֶ֖ם בְּעֵינֵ֣י חֲמ֑וֹר וּבְעֵינֵ֖י שְׁכֶ֥ם בֶּן־חֲמֽוֹר׃", "onk": "וּשְׁפָרוּ פִתְגָּמֵיהוֹן בְּעֵינֵי חֲמוֹר וּבְעֵינֵי שְׁכֶם בַּר חֲמוֹר:", "onk_en": "Their words were agreeable in the eyes of Chamor, and in the eyes of Shechem, the son of Chamor.", "pj": "וּשְׁפָרוּ פִּתְגָמֵיהוֹן בְּעֵינֵי חֲמוֹר וּבְעֵינֵי שְׁכֶם בַּר חֲמוֹר", "pj_en": "And their words were pleasing in the eyes of Hamor, and in the eyes of Shekem, the son of Hamor.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 19, "aliyah": 5, "heb": "וְלֹֽא־אֵחַ֤ר הַנַּ֙עַר֙ לַעֲשׂ֣וֹת הַדָּבָ֔ר כִּ֥י חָפֵ֖ץ בְּבַֽת־יַעֲקֹ֑ב וְה֣וּא נִכְבָּ֔ד מִכֹּ֖ל בֵּ֥ית אָבִֽיו׃", "onk": "וְלָא אוֹחַר עוּלֵימָא לְמֶעְבַּד פִּתְגָּמָא אֲרֵי אִתְרְעִי בְּבַת יַעֲקֹב וְהוּא יַקִּיר מִכֹּל בֵּית אֲבוּהִי:", "onk_en": "The young man did not delay doing the thing, because he desired the daughter of Yaakov. He was the most honored person in his father’s house.", "pj": "וְלָא אִתְעַכֵּב רַבְיָא לְמֶעֱבַד פִּתְגָמָא אֲרוּם צָבִי בִּבְרַת יַעֲקב וְהוּא יַקִיר מִכּל בֵּיתָא דְאָבוֹי", "pj_en": "And the young man delayed not to do the thing; because he wished for the daughter of Jakob; and he was more honourable than all his father's house.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 20, "aliyah": 5, "heb": "וַיָּבֹ֥א חֲמ֛וֹר וּשְׁכֶ֥ם בְּנ֖וֹ אֶל־שַׁ֣עַר עִירָ֑ם וַֽיְדַבְּר֛וּ אֶל־אַנְשֵׁ֥י עִירָ֖ם לֵאמֹֽר׃", "onk": "וַאֲתָא חֲמוֹר וּשְׁכֶם בְּרֵיהּ לִתְרַע קַרְתְּהוֹן וּמַלִּילוּ עִם אֲנָשֵׁי קַרְתְּהוֹן לְמֵימָר:", "onk_en": "Chamor and his son, Shechem came to the gate of their city, and they spoke to the men of their city saying,", "pj": "וְאָתָא חֲמוֹר וּשְׁכֶם בְּרֵיהּ לִתְרַע קַרְתֵּיהוֹן וּמַלִילוּ עִם אִינְשֵׁי תְּרַע קַרְתֵּיהוֹן לְמֵימָר", "pj_en": "And Hamor and Shekem his son came to the gate of their city, and spake with the men of the gate of their city, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 21, "aliyah": 5, "heb": "הָאֲנָשִׁ֨ים הָאֵ֜לֶּה שְֽׁלֵמִ֧ים הֵ֣ם אִתָּ֗נוּ וְיֵשְׁב֤וּ בָאָ֙רֶץ֙ וְיִסְחֲר֣וּ אֹתָ֔הּ וְהָאָ֛רֶץ הִנֵּ֥ה רַֽחֲבַת־יָדַ֖יִם לִפְנֵיהֶ֑ם אֶת־בְּנֹתָם֙ נִקַּֽח־לָ֣נוּ לְנָשִׁ֔ים וְאֶת־בְּנֹתֵ֖ינוּ נִתֵּ֥ן לָהֶֽם׃", "onk": "גֻּבְרַיָּא הָאִלֵּין שָׁלְמִין אִנּוּן עִמָּנָא וִיתִיבוּן בְּאַרְעָא <b>וְיַעְבְּדוּן<\/b> בַּהּ סְחוֹרְתָא וְאַרְעָא הָא פְתָיוּת יְדִין קֳדָמֵיהוֹן יָת בְּנָתֵיהוֹן נִסַּב לָנָא לִנְשִׁין וְיָת בְּנָתָנָא נִתֵּן לְהוֹן:", "onk_en": "These men are completely at peace with us. Let them live in the land and [<b>do<\/b>] trade in [<b>with<\/b>] it. The land has ample room to be open to them. We will take their daughters for wives, and we will give them our daughters.", "pj": "גוּבְרַיָא הָאִלֵין שַׁלְמִין אִינוּן עִמָנָא וְיֵתְבוּן בְּאַרְעָא וְיַעַבְדוּן בָּהּ פְּרַקְמַטְיָא וְאַרְעָא הָא פַּתְיַית תְּחוּמִין קֳדָמֵיהוֹן יַת בְּנָתֵיהוֹן נִיסַב לָנָא לִנְשִׁין וְיַת בְּנָתָנָא נִיתֵּין לְהוֹם", "pj_en": "These men are friendly with us; and they may dwell in the land and do business in it; and the land, behold, it is broad (in) limits before them; let us take their daughters to us for wives, and give our daughters to them.", "tj": "", "tj_en": "", "rashi": "<b>שלמים.<\/b> בְּשָׁלוֹם וּבְלֵב שָׁלֵם:<br><br><b>והארץ הנה רחבת ידים.<\/b> כְּאָדָם שֶׁיָּדוֹ רְחָבָה וּוַתְרָנִית; כְּלוֹמַר, אַל תַּפְסִידוּ כְּלוּם – פְּרַקְמַטְיָא הַרְבֵּה בָּאָה לְכָאן וְאֵין לָהּ קוֹנִים:", "rashi_en": "שלמים means peaceable and whole hearted.<br><br>והארץ הנה רחבת ידים FOR THE LAND, BEHOLD, IT IS LARGE ENOUGH (literally, wide-handed) — the metaphor is that of a man whose hand is large and generous, and the idea is: “You will lose nothing if they dwell and trade in the land, for much merchandise is brought here and there are no buyers for it”."}, {"ch": 34, "v": 22, "aliyah": 5, "heb": "אַךְ־בְּ֠זֹ֠את יֵאֹ֨תוּ לָ֤נוּ הָאֲנָשִׁים֙ לָשֶׁ֣בֶת אִתָּ֔נוּ לִהְי֖וֹת לְעַ֣ם אֶחָ֑ד בְּהִמּ֥וֹל לָ֙נוּ֙ כׇּל־זָכָ֔ר כַּאֲשֶׁ֖ר הֵ֥ם נִמֹּלִֽים׃", "onk": "בְּרַם בְּדָא יִתָּפְסוּן לָנָא גוּבְרַיָּא לְמִתַּב עִמָּנָא לְמֵהֲוֵי לְעַמָּא חַד לְמִגְזַר לָנָא כָּל דְּכוּרָא כְּמָא דִּי אִנּוּן גְּזִירִין:", "onk_en": "But only on these terms will the men consent to live with us, to become one people: every male among us must be circumcised, just as they are circumcised.", "pj": "בְּרַם בְּדָא יִתְפַּיְיסוּן לָנָא גוּבְרַיָא לְמֵיתַב עִמָנָא לְמֶהֱוֵי לְעַם חַד בְּמִגְזוֹר לָנָא כָּל דְכוּרָא הֵיכְמָא דְאִינוּן גָזְרִין", "pj_en": "But in this only will the men accede to us, to dwell with us, and to be one people, by every male of us being circumcised as they are.", "tj": "", "tj_en": "", "rashi": "<b>בהמול.<\/b> בִּהְיוֹת נִמּוֹל:", "rashi_en": "בהמול means by every male of us being circumcised (infinitive Niphal)."}, {"ch": 34, "v": 23, "aliyah": 5, "heb": "מִקְנֵהֶ֤ם וְקִנְיָנָם֙ וְכׇל־בְּהֶמְתָּ֔ם הֲל֥וֹא לָ֖נוּ הֵ֑ם אַ֚ךְ נֵא֣וֹתָה לָהֶ֔ם וְיֵשְׁב֖וּ אִתָּֽנוּ׃", "onk": "גֵּיתֵיהוֹן וְקִנְיָנְהוֹן וְכָל בְּעִירְהוֹן הֲלָא דִּילָנָא אִנּוּן בְּרַם נִתְפֵּס לְהוֹן וִיתִיבוּן עִמָּנָא:", "onk_en": "Their livestock, their possessions and all their cattle, will it not be ours? Only let us consent to them, and they will live with us.", "pj": "גֵיתֵיהוֹן וְנִכְסֵיהוֹן וְכָל בְּעִירֵיהוֹם הֲלָא דִי לָנָא אִינוּן בְּרַם נִתְפַּיֵיס לְהוֹם וְיֵיתְבוּן עִמָנָא", "pj_en": "Their flocks, and their substance, and all their cattle, will they not be ours? Only let us consent to them, and they will dwell with us.", "tj": "", "tj_en": "", "rashi": "<b>אך נאותה להם.<\/b> לְדָבָר זֶה, וְעַל יְדֵי כֵן יֵשְׁבוּ אִתָּנוּ:", "rashi_en": "אך נאותה להם LET US CONSENT UNTO THEM in this matter, and because of this they will dwell with us."}, {"ch": 34, "v": 24, "aliyah": 5, "heb": "וַיִּשְׁמְע֤וּ אֶל־חֲמוֹר֙ וְאֶל־שְׁכֶ֣ם בְּנ֔וֹ כׇּל־יֹצְאֵ֖י שַׁ֣עַר עִיר֑וֹ וַיִּמֹּ֙לוּ֙ כׇּל־זָכָ֔ר כׇּל־יֹצְאֵ֖י שַׁ֥עַר עִירֽוֹ׃", "onk": "<b>וְקַבִּילוּ<\/b> מִן חֲמוֹר וּמִן שְׁכֶם בְּרֵיהּ כָּל נָפְקֵי תְּרַע קַרְתֵּיהּ וּגְזָרוּ כָּל דְּכוּרָא כָּל נָפְקֵי תְּרַע קַרְתֵּיהּ:", "onk_en": "They listened to [<b>obeyed<\/b>] Chamor, and to his son, Shechem—all those who passed through the gate of his city. Every male was circumcised—all who passed through the gate of his city.", "pj": "וְקַבִּילוּ מִן חֲמוֹר וּמִן שְׁכֶם בְּרֵיהּ כָּל נַפְקֵי תְּרַע קַרְתֵּיהּ וּגְזָרוּ כָּל דְכוּרָא כָּל נַפְקֵי תְּרַע קַרְתֵּיהּ", "pj_en": "And all they who came out of the gate of his city received from Hamor and from Shekem, his son; and they circumcised every male, all who came out of the gate of the city.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 25, "aliyah": 5, "heb": "וַיְהִי֩ בַיּ֨וֹם הַשְּׁלִישִׁ֜י בִּֽהְיוֹתָ֣ם כֹּֽאֲבִ֗ים וַיִּקְח֣וּ שְׁנֵֽי־בְנֵי־יַ֠עֲקֹ֠ב שִׁמְע֨וֹן וְלֵוִ֜י אֲחֵ֤י דִינָה֙ אִ֣ישׁ חַרְבּ֔וֹ וַיָּבֹ֥אוּ עַל־הָעִ֖יר בֶּ֑טַח וַיַּֽהַרְג֖וּ כׇּל־זָכָֽר׃", "onk": "וַהֲוָה בְיוֹמָא תְלִיתָאָה <b>כַּד תְּקִיפוּ עֲלֵיהוֹן כֵּאבֵיהוֹן<\/b> וּנְסִיבוּ תְרֵין בְּנֵי יַעֲקֹב שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה גְּבַר חַרְבֵּיהּ וְעַלּוּ עַל קַרְתָּא <b>דְּיָתְבוּן לְרָחֲצָן<\/b> וּקְטָלוּ כָּל דְּכוּרָא:", "onk_en": "On the third day when they were in pain [<b>their pain was strong upon them<\/b>], two of Yaakov’s sons, Shimon and Leivi, brothers of Deenah, each took his sword. They approached the city with confidence [<b>whose inhabitants dwell in security<\/b>], and killed every male.", "pj": "וַהֲוָה בְּיוֹמָא תְלִיתָאָה כַּד הֲווֹ מִתְמַקְמְקִין מִן כֵּיב גוּזְרַתְהוֹם וּנְסִיבוּ תְּרֵין מִבְּנוֹי דְיַעֲקב שִׁמְעוֹן וְלֵוִי אֲחֵי דִינָה גְבַר סַיְיפֵיהּ וְעָלוּ עַל קַרְתָּא דַהֲוָה יַתְבָא לְרוֹחְצַן וּקְטָלוּ כָּל דְכוּרָא", "pj_en": "And it was on the third day, when they were weak from the pain of their circumcision, two of the sons of Jakob, Shimeon and Levi, the brothers of Dinah, took each man his sword, and came upon the city, which was dwelling securely and killed every male.", "tj": "", "tj_en": "", "rashi": "<b>שני בני יעקב.<\/b> בָּנָיו הָיוּ, וְאַעַ\"פִּ כֵן נָהֲגוּ עַצְמָן שִׁמְעוֹן וְלֵוִי כִּשְׁאָר אֲנָשִׁים שֶׁאֵינָם בָּנָיו, שֶׁלֹּא נָטְלוּ עֵצָה הֵימֶנּוּ (בראשית רבה):<br><br><b>אחי דינה.<\/b> לְפִי שֶׁמָּסְרוּ עַצְמָן עָלֶיהָ נִקְרְאוּ אַחֶיהָ:<br><br><b>בטח.<\/b> שֶׁהָיוּ כוֹאֲבִים וּמִ\"אַ בְּטוּחִים הָיוּ עַל כֹּחוֹ שֶׁל זָקֵן (בראשית רבה):", "rashi_en": "שני בני יעקב TWO OF THE SONS OF JACOB — They were his sons (the sons of Jacob, a wise and clever man), but they acted as any man named Simeon and Levi would do — as other people would do who were not his sons — for they did not take counsel with him (Genesis Rabbah 80:10).<br><br>אחי דינה DINAH’S BROTHERS — because they risked their lives for her they are designated as her brothers (Genesis Rabbah 80:10)<br><br>בטח IN SECURITY — because they (the men of Shechom) were ill. The Midrashic explanation, taking בטח in the sense of confident, is: that they relied upon the strength (i.e. the merits) of the old man (Jacob) (Genesis Rabbah 80:10). "}, {"ch": 34, "v": 26, "aliyah": 5, "heb": "וְאֶת־חֲמוֹר֙ וְאֶת־שְׁכֶ֣ם בְּנ֔וֹ הָרְג֖וּ לְפִי־חָ֑רֶב וַיִּקְח֧וּ אֶת־דִּינָ֛ה מִבֵּ֥ית שְׁכֶ֖ם וַיֵּצֵֽאוּ׃", "onk": "וְיָת חֲמוֹר וְיָת שְׁכֶם בְּרֵיהּ קְטָלוּ לְפִתְגַּם דְּחָרֶב וּדְבָרוּ יָת דִּינָה מִבֵּית שְׁכֶם וּנְפָקוּ:", "onk_en": "They killed Chamor and his son Shechem at the point of the sword. They took Deenah from the house of Shechem and they left.", "pj": "וְיַת חֲמוֹר וְיַת שְׁכֶם בְּרֵיהּ קְטָלוּ לְפִתְגַם דְחָרֶב וּדְבָרוּ יַת דִינָה מִבֵּית שְׁכֶם וּנְפָקוּ", "pj_en": "And Hamor and Shekem his son they killed with the edge of the sword; and they took Dinah from the house of Shekem, and went forth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 27, "aliyah": 5, "heb": "בְּנֵ֣י יַעֲקֹ֗ב בָּ֚אוּ עַל־הַ֣חֲלָלִ֔ים וַיָּבֹ֖זּוּ הָעִ֑יר אֲשֶׁ֥ר טִמְּא֖וּ אֲחוֹתָֽם׃", "onk": "בְּנֵי יַעֲקֹב עַלוּ <b>לְחַלָּצָא קָטִילַיָּא<\/b> וּבְזוֹ קַרְתָּא דִּי סָאִיבוּ אֲחָתְהוֹן:", "onk_en": "The sons of Yaakov came upon the corpses [<b>to strip the corpses<\/b>], and they plundered the city that had defiled their sister.", "pj": "מוֹתַר בְּנוֹי דְיַעֲקב עָלוּ לְחַלָצָא קְטוֹלַיָא וּבָזוּ יַת קַרְתָּא דִסְאִיבוּ בְּגַוָוהּ אֲחַתְהוֹן", "pj_en": "And the rest of the sons of Jakob came to the spoil of the slain, and they sacked the city because they had polluted their sister in the midst of it.", "tj": "", "tj_en": "", "rashi": "<b>על החללים.<\/b> לְפַשֵּׁט הַחֲלָלִים:", "rashi_en": "על החללים UPON THE SLAIN — to strip the slain. "}, {"ch": 34, "v": 28, "aliyah": 5, "heb": "אֶת־צֹאנָ֥ם וְאֶת־בְּקָרָ֖ם וְאֶת־חֲמֹרֵיהֶ֑ם וְאֵ֧ת אֲשֶׁר־בָּעִ֛יר וְאֶת־אֲשֶׁ֥ר בַּשָּׂדֶ֖ה לָקָֽחוּ׃", "onk": "יָת עָנְהוֹן וְיָת תּוֹרְהוֹן וְיָת חֲמָרֵיהוֹן וְיָת דִּי בְקַרְתָּא וְיָת דִּי בְחַקְלָא <b>בְּזוֹ<\/b> (<small>ס\"א<\/small> דְבָרוּ):", "onk_en": "Their sheep, their cattle, their donkeys, whatever was in the city and whatever was in the field—they took [<b>plundered<\/b>].", "pj": "וְיַת עַנְהוֹם וְיַת תּוֹרֵיהוֹם וְיַת חֲמָרֵיהוֹם וְיַת דִבְקַרְתָּא וְיַת דִבְחַקְלָא בָּזוּ", "pj_en": "Their flocks, and oxen, and asses, and whatever was in the city or in the field they spoiled;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 29, "aliyah": 5, "heb": "וְאֶת־כׇּל־חֵילָ֤ם וְאֶת־כׇּל־טַפָּם֙ וְאֶת־נְשֵׁיהֶ֔ם שָׁב֖וּ וַיָּבֹ֑זּוּ וְאֵ֖ת כׇּל־אֲשֶׁ֥ר בַּבָּֽיִת׃", "onk": "וְיָת כָּל נִכְסֵיהוֹן וְיָת כָּל טַפְלְהוֹן וְיָת נְשֵׁיהוֹן שְׁבוֹ וּבְזוֹ וְיָת כָּל דִּי בְבֵיתָא:", "onk_en": "All their wealth, all their children, and their wives—they took captive, and plundered—including everything in the houses.", "pj": "וְיַת כָּל נִכְסֵיהוֹן וְיַת כָּל טַפְלֵיהוֹן וְיַת נְשֵׁיהוֹם שְׁבוּ וּבָזוּ וְיַת כָּל דִבְבֵיתָא", "pj_en": "and all their wealth and all their little ones they took and spoiled, and all that was in the houses.", "tj": "", "tj_en": "", "rashi": "<b>חילם.<\/b> מָמוֹנָם וְכֵן עָשָׂה לִי אֶת הַחַיִל הַזֶּה (דברים ח'), וְיִשְׂרָאֵל עֹשֶׂה חָיִל (במדבר כ\"ד), וְעָזְבוּ לַאֲחֵרִים חֵילָם (תהילים מ\"ט):<br><br><b>שבו.<\/b> לְשׁוֹן שְׁבִיָּה, לְפִיכָךְ טַעֲמוֹ מִלְּרָע:", "rashi_en": "חילם means THEIR WEALTH. Examples are: (Deuteronomy 8:17) “hath gotten me this (חיל) wealth”; (Numbers 19:18) “and Israel acquireth (חיל) wealth”; (Psalms 49:11) “and they leave (חילם) their wealth to others”.<br><br>שבו has the meaning of taking captive (i.e. it is the Kal. perfect, 3rd pl. of the root שבה and means “they took captive”), and therefore it is accented on the last syllable (whereas שָׁבוּ, accented on the first syllable, is the same form of the verb שוב and means “they returned”). "}, {"ch": 34, "v": 30, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יַעֲקֹ֜ב אֶל־שִׁמְע֣וֹן וְאֶל־לֵוִי֮ עֲכַרְתֶּ֣ם אֹתִי֒ לְהַבְאִישֵׁ֙נִי֙ בְּיֹשֵׁ֣ב הָאָ֔רֶץ בַּֽכְּנַעֲנִ֖י וּבַפְּרִזִּ֑י וַאֲנִי֙ מְתֵ֣י מִסְפָּ֔ר וְנֶאֶסְפ֤וּ עָלַי֙ וְהִכּ֔וּנִי וְנִשְׁמַדְתִּ֖י אֲנִ֥י וּבֵיתִֽי׃", "onk": "וַאֲמַר יַעֲקֹב לְשִׁמְעוֹן וּלְלֵוִי עֲכַרְתּוּן יָתִי <b>לְמִתַּן דְּבָבוּ בֵּינָנָא וּ<\/b>בֵין יָתְבֵי אַרְעָא בִּכְנַעֲנָאָה וּבַפְּרִזָּאָה וַאֲנָא עַם דְּמִנְיַן וְיִתְכַּנְּשׁוּן עֲלַי וְיִמְחִנּוּנִי וְאֶשְׁתֵּצֵי אֲנָא וֶאֱנַשׁ בֵּיתִי:", "onk_en": "Yaakov said to Shimon and Leivi, You have made trouble for me, making me obnoxious to [<b>putting hatred between us and<\/b>] the inhabitants of the land, the Canaanites and the Perizzites. [Since] I am few in number, they will gather together and attack me. I and my house [family] will be destroyed.", "pj": "וַאֲמַר יַעֲקב לְשִׁמְעוֹן וּלְלֵוִי עֲכַרְתּוּן יָתִי לְמִפְקָא שְׁמִי בִּישׁ בְּיַתְבֵי אַרְעָא בִּכְנַעֲנָאָה וּבִפְרִיזָאֵי וַאֲנָא עַם דְמִנְיַן וְיִתְכַּנְשׁוּן עָלָי וְיִמְחוּנַנִי וְאִישְׁתְּצֵי אֲנָא וְאֵינַשׁ בֵּיתִי", "pj_en": "And Jakob said to Shimeon and Levi, You have made my name to go forth as evil among the inhabitants of the land, among the Kenaanites and Phezerites. And I am a people of (small) number, and they will gather together against me, and destroy me and the men of my house.", "tj": "", "tj_en": "", "rashi": "<b>עכרתם.<\/b> לְשׁוֹן מַיִם עֲכוּרִים, אֵין דַּעְתִּי צְלוּלָה עַכְשָׁו (ברכות כ\"ה). וְאַגָּדָה, צְלוּלָה הָיְתָה הֶחָבִית וַעֲכַרְתֶּם אוֹתָהּ (בראשית רבה) – מָסֹרֶת הָיְתָה בְּיַד כְּנַעֲנִים שֶׁיִּפְּלוּ בְּיַד בְּנֵי יַעֲקֹב, אֶלָּא שֶׁהָיוּ אוֹמְרִים עַד אֲשֶׁר תִּפְרֶה וְנָחַלְתָּ אֶת הָאָרֶץ (שמות כ\"ג), לְפִיכָךְ הָיוּ שׁוֹתְקִין:<br><br><b>מתי מספר.<\/b> אֲנָשִׁים מוּעָטִים:", "rashi_en": "עכרתם YE HAVE TROUBLED ME — This has the same meaning as (Berakhot 25b) “troubled (עכורים) waters” (i.e. waters that are disturbed, not clear). He meant “Now my mind will never be clear (without worry)”. There is an Agada, (Genesis Rabbah 80:12) “He said: the wine in the cask was clear but you have troubled it”. The Canaanites had a tradition that they would fall by the hands of the sons of Jacob, but they thought that this would happen only when the condition was fulfilled as expressed in the verse (Exodus 23:30) “when thou shalt in-crease, then shalt thou inherit the land”; consequently they had been silent until now (i.e. they had not attacked them).<br><br>מתי מספר means A FEW MEN."}, {"ch": 34, "v": 31, "aliyah": 5, "heb": "וַיֹּאמְר֑וּ הַכְזוֹנָ֕ה יַעֲשֶׂ֖ה אֶת־אֲחוֹתֵֽנוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמָרוּ הַכְנָפְקַת בָּרָא <b>יִתְעֲבֵד<\/b> (<small>נ\"א<\/small> יַעְבֵּד יָת) לַאֲחָתָנָא:", "onk_en": "They said, Should he make our sister [<b>be treated<\/b>] into a harlot [<b>like one who goes outside<\/b>]?", "pj": "עַנְיָן שִׁמְעוֹן וְלֵוִי לָא יָאִי לְמֶהֱוֵי מִתְאַמַר בִּכְנִישְׁתֵּהוֹן דְיִשְרָאֵל עַרְלָאִין סְאִיבוּ לִבְתוּלְתָּא וּפַלְחֵי צַלְמִין טָנִיפוּ לִבְרַתֵּיהּ דְיַעֲקב אֱלָהֵין כְּדֵין יָאֵי לְמֶהֱוֵי מִתְאַמַר עַרְלָאִין אִתְקְטִילוּ בְּגִין בְּתוּלְתָּא וּפַלְחֵי צַלְמִין בְּגִין בְּרַתֵּיהּ דְיַעֲקב וְלָא יֶהֱוֵי שְׁכֶם בַּר חֲמוֹר מְלַגְלֵג בְּמִילֵיהּ עֲלָנָא וּכְאִיתָא מְטַעֲיָיא נַפְקַת בְּרָה דְלֵית לָהּ תְּבוֹעַ יַעֲבֵיד יַת אַחֲתַן אִין לָא עֲבַדְנָא יַת פִּתְגָמָא הָדֵין", "pj_en": "And Shimeon and Levi answered, It would not have been fit to be said in the congregations of Israel that the uncircumcised polluted the virgin, and the worshippers of idols debased the daughter of Jakob: but it is fit that it should be said, The uncircumcised were slain on account of the virgin, and the worshippers of idols on account of the daughter of Jakob. Shekem bar Hamor will not (now) deride us with his words; for as a whorish woman and an outcast who hath no avenger would he have made our sister, if we had not done this thing.", "tj": "עַנְיָין תְּרֵין בְּנוֹי דְיַעֲקב כַּחֲדָא וְאָמְרִין לְיִשְרָאֵל אֲבוּהוֹן לָא יָאִי הוּא דִיהֲוֵי מִתְאַמַר בִּכְנִישְׁתְּהוֹן דְיִשְרָאֵל וּבְבֵית מֶדְרָשֵׁיהוֹן עָרְלִין סְאִיבוּ בְּתוּלָה וּפַלְחֵי צַלְמִין בְּרַתֵּיהּ דְיַעֲקב בְּרַם יָאִי הוּא דְיֶהֱוֵי מִתְאַמַר בִּכְנִשְׁתֵּיהוֹן דְיִשְרָאֵל וּבְבֵית מֶדְרָשֵׁיהוֹן עַרְלִין אִיתְקְטִילוּ עַל עִיסַק בְּתוּלָה פִּלְחֵי צַלְמִין עַל דִסְאִיבוּ לְדִינָה בַּת יַעֲקב דְלָא יֶהֱוֵי שְׁכֶם בַּר חֲמוֹר מִתְגָאֵי בְּלִבֵּיהּ וַאֲמַר כְּאִיתָּא דְלֵית לָהּ אֱנַשׁ תְּבַע עוּלְבָּנָה כֵּן יִתְעֲבֵיד לְדִינָה בַּת יַעֲקב וְאָמְרִין כְּאִיתָּא זָנֵי וְנַפְקַת בָּרָא מַחְשַׁב יַת אֲחָתָן:", "tj_en": "The two sons of Jakob answered together, and said to Israel their father, It would not be fit to be said in the congregations of Israel, in their house of instruction, that the uncircumcised polluted the virgin, and the worshippers of idols the daughter of Jakob; but it is fit that it be said in the congregations of Israel and in their house of instruction, that the uncircumcised were put to death for the sake of the virgin, and the worshippers of idols because they had defiled Dinah the daughter of Jakob. And Shekem bar Hamor will not boast in his heart and say, As a woman who hath no man to avenge her injury, so hath Dinah the daughter of Jakob been made. And they said, As an impure woman and an outcast would he have accounted our sister.", "rashi": "<b>הכזונה.<\/b> הֶפְקֵר:<br><br><b>את אחותנו.<\/b> יָת אֲחָתָנָא:", "rashi_en": "הכזונה implies as one unprotected.<br><br>אחותנו The Targum renders it as an accusative — ית אחתנא “our sister”,) so that the meaning is: Should one (be permitted to) make our sister become as a woman who has no-one to protect her (Genesis Rabbah 80:12)."}, {"ch": 35, "v": 1, "aliyah": 5, "heb": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶֽל־יַעֲקֹ֔ב ק֛וּם עֲלֵ֥ה בֵֽית־אֵ֖ל וְשֶׁב־שָׁ֑ם וַעֲשֵׂה־שָׁ֣ם מִזְבֵּ֔חַ לָאֵל֙ הַנִּרְאֶ֣ה אֵלֶ֔יךָ בְּבׇ֨רְחֲךָ֔ מִפְּנֵ֖י עֵשָׂ֥ו אָחִֽיךָ׃", "onk": "וַאֲמַר יְיָ לְיַעֲקֹב קוּם סַק לְבֵית אֵל וְתִיב תַּמָּן וְעִבֵד תַּמָּן מַדְבְּחָא לֵאלָהָא <b>דְּאִתְגְּלִי<\/b> לָךְ בְּמֵעִרְקָךְ מִן קֳדָם עֵשָׂו אָחוּךְ:", "onk_en": "Elohim said to Yaakov, Arise, go up to Beis Eil and live there; make an altar there to the Almighty Who appeared [<b>became revealed<\/b>] to you when you were fleeing from your brother Eisov.", "pj": "וַאֲמַר יְיָ לְיַעֲקב קוּם סוּק לְבֵית אֵל וְתִיב תַּמָן וְעָבַד תַּמָן מַדְבְּחָא לֶאֱלָהָא דְאִיתְגְלֵי לָךְ בְּמֵעַרְקָךְ מִן קֳדָם עֵשָו אָחוּךְ", "pj_en": "And the Lord said to Jakob, Arise, go up to Bethel and dwell there, and make there an altar unto Eloha, who revealed Himself to thee in thy flight from before Esau thy brother.", "tj": "", "tj_en": "", "rashi": "<b>קום עלה.<\/b> לְפִי שֶׁאֵחַרְתָּ בַּדֶּרֶךְ נֶעֱנַשְׁתָּ וּבָא לְךָ זֹאת מִבִּתְּךָ (תנחומא):", "rashi_en": "קום עלה ARISE: GO UP [TO BETHEL] — Because you have delayed to fulfil your vow to sacrifice to me at Bethel you have been punished by this trouble of your daughter coming upon you (Genesis Rabbah 81:2). "}, {"ch": 35, "v": 2, "aliyah": 5, "heb": "וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־בֵּית֔וֹ וְאֶ֖ל כׇּל־אֲשֶׁ֣ר עִמּ֑וֹ הָסִ֜רוּ אֶת־אֱלֹהֵ֤י הַנֵּכָר֙ אֲשֶׁ֣ר בְּתֹכְכֶ֔ם וְהִֽטַּהֲר֔וּ וְהַחֲלִ֖יפוּ שִׂמְלֹתֵיכֶֽם׃", "onk": "וַאֲמַר יַעֲקֹב לֶאֱנַשׁ בֵּיתֵיהּ וּלְכֹל דִּי עִמֵּיהּ אַעְדוּ יָת <b>טַעֲוַת עַמְמַיָּא<\/b> דִּי בֵינֵיכוֹן וְאִדַּכּוּ וְשַׁנּוּ כְּסוּתְכוֹן:", "onk_en": "Yaakov [then] said to his household, and to everyone that was with him, Get rid of the foreign gods [<b>false gods of the nations<\/b>] in your midst. Purify yourselves and change your garments.", "pj": "וַאֲמַר יַעֲקב לְאִנְשֵׁי בַּיְיתֵיהּ וּלְכל דְעִימֵיהּ עִטְרוּן יַת טַעֲוַת עַמְמַיָא דְבֵינֵיכוֹן דִדְבַרְתּוּן מִבֵּית טַעֲוַות שְׁכֶם וְאִידְכּוּ מִסוֹאֲבוֹת קְטוֹלַיָא דִקְרַבְתּוּן בְּהוֹן וְשַׁנוּ כְּסוּתְכוֹן", "pj_en": "And Jakob said to the men of his house, and to all who were with him, Put away the idols of the peoples which are among you which you took from the temple* of Shekem, and purify you from the uncleannesses of the slain whom you have and change your raiment.", "tj": "", "tj_en": "", "rashi": "<b>הנכר.<\/b> שֶׁיֵּשׁ בְּיֶדְכֶם מִשָּׁלָל שֶׁל שְׁכֶם:<br><br><b>והטהרו.<\/b> מֵעֲ\"זָ:<br><br><b>והחליפו שמלתיכם.<\/b> שֶׁמָּא יֵשׁ בְּיֶדְכֶם כְּסוּת שֶׁל עֲ\"זָ:", "rashi_en": "הנכר [PUT AWAY] THE STRANGE [GODS] —which you have in your possession from the spoil of Shechem.<br><br>ותטהרו AND PURIFY YOURSELVES of idol-worship.<br><br>והחליפו שמלותיכם AND CHANGE YOUR GARMENTS — lest you have in your possession a vestment that has been employed in idolatrous worship (Genesis Rabbah 81:3). "}, {"ch": 35, "v": 3, "aliyah": 5, "heb": "וְנָק֥וּמָה וְנַעֲלֶ֖ה בֵּֽית־אֵ֑ל וְאֶֽעֱשֶׂה־שָּׁ֣ם מִזְבֵּ֗חַ לָאֵ֞ל הָעֹנֶ֤ה אֹתִי֙ בְּי֣וֹם צָֽרָתִ֔י וַֽיְהִי֙ עִמָּדִ֔י בַּדֶּ֖רֶךְ אֲשֶׁ֥ר הָלָֽכְתִּי׃", "onk": "וְנֵקוֹם וְנִסַּק לְבֵית אֵל וְאֶעְבֵּד תַּמָּן מַדְבְּחָא לֵאלָהָא <b>דְּקַבֵּל צְלוֹתִי<\/b> בְּיוֹמָא דְעַקְתִי וַהֲוָה <b>מֵימְרֵיהּ בְּסַעְדִּי<\/b> בְּאָרְחָא דִּי אֲזָלִית:", "onk_en": "Let us arise and go up to Beis Eil. There I will make an altar to the Almighty, Who answered me [<b>accepted my prayer<\/b>] in the day of my distress, and Who was with me [<b>whose Word was my support<\/b>] along the way I traveled.", "pj": "וְנֵקוּם וְנִסַק לְבֵית אֵל וְאַעֲבִיד תַּמָן מַדְבְּחָא לֶאֱלָהָא דְקַבֵּל צְלוּתִי בְּיוֹמָא דְעַקְתִי וַהֲוָה מֵימְרֵיהּ בְּסַעֲדִי בְּאָרְחָא דְאָזְלִית", "pj_en": "And we will arise and go up to Bethel, and I will make there an altar unto Eloha, who heard my prayer in the day when I was afflicted, and whose Word was my helper in the way that I went.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 4, "aliyah": 5, "heb": "וַיִּתְּנ֣וּ אֶֽל־יַעֲקֹ֗ב אֵ֣ת כׇּל־אֱלֹהֵ֤י הַנֵּכָר֙ אֲשֶׁ֣ר בְּיָדָ֔ם וְאֶת־הַנְּזָמִ֖ים אֲשֶׁ֣ר בְּאׇזְנֵיהֶ֑ם וַיִּטְמֹ֤ן אֹתָם֙ יַעֲקֹ֔ב תַּ֥חַת הָאֵלָ֖ה אֲשֶׁ֥ר עִם־שְׁכֶֽם׃", "onk": "וִיהָבוּ לְיַעֲקֹב יָת כָּל <b>טַעֲוַת עַמְמַיָּא<\/b> דִי בִידֵיהוֹן וְיָת קָדָשַׁיָּא דִּי בְאוּדְנֵיהוֹן וְטַמַּר יָתְהוֹן יַעֲקֹב תְּחוֹת בָּטְמָא דִּי עִם שְׁכֶם:", "onk_en": "They gave Yaakov all the foreign gods [<b>false gods of the nations<\/b>] that were in their hands, and [also] the rings in their ears. Yaakov buried them under the oak [tree] which was near Shechem.", "pj": "וּמְסָרוּ בְּיַד יַעֲקב יַת כָּל טַעֲוַת עַמְמַיָא דְבִידֵיהוֹן דְדַבָּרוּ מִן טַעֲוַות שְׁכֶם וְיַת קָדָשַׁיָא דַהֲווֹ בְּאוּדְנֵיהוֹן דְיַתְבֵי קַרְתָּא דִשְׁכֶם דַהֲוָה צַיָיר בְּהוֹן דְמוּת פּוּסְלֵיהּ וְטָמַר יַתְהוֹן יַעֲקב תְּחוֹת בּוּטְמָא דִסְמִיכָא לְקַרְתָּא דִשְׁכֶם", "pj_en": "And they delivered into Jakob's hand all the idols of the people which were in their hands which they had taken from the temple of Shekem, and the jewels that had been in the ears of the inhabitants of the city of Shekem, in which was portrayed the likeness of their images; and Jakob hid them under the terebinth that was near to the city of Shekem.", "tj": "", "tj_en": "", "rashi": "<b>האלה.<\/b> מִין אִילַן סְרָק:<br><br><b>עם שכם.<\/b> אֵצֶל שְׁכֶם:", "rashi_en": "האלה THE TEREBINTH — a kind of tree that bears no fruit.<br><br>עם שכם means by Shechem."}, {"ch": 35, "v": 5, "aliyah": 5, "heb": "וַיִּסָּ֑עוּ וַיְהִ֣י&thinsp;<b>׀<\/b> חִתַּ֣ת אֱלֹהִ֗ים עַל־הֶֽעָרִים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵיהֶ֔ם וְלֹ֣א רָֽדְפ֔וּ אַחֲרֵ֖י בְּנֵ֥י יַעֲקֹֽב׃", "onk": "וּנְטָלוּ וַהֲוַת דַּחֲלָא דַיְיָ עַל <b>עַמְמַיָּא דִּי בְּ<\/b>קִרְוֵי סַחֲרָנֵיהוֹן וְלָא רְדָפוּ בָּתַר בְּנֵי יַעֲקֹב:", "onk_en": "They began their journey. The terror of Elohim was upon the [<b>people who were in the<\/b>] cities that were around them, and they did not pursue the sons of Yaakov.", "pj": "וּנְטָלוּ מִתַּמָן מוֹדִים וּמַצְלָן קֳדָם יְיָ וַהֲוָה רְתִיתָא מִן קֳדָם יְיָ עַל עַמְמַיָא דִבְקִרְוֵי חוּזְרָנֵיהוֹם וְלָא רָדָפוּ בָּתַר בְּנֵי יַעֲקב", "pj_en": "And they journeyed from thence, offering praise and prayer before the Lord. And there was a tremor from before the Lord upon the people of the cities round about them, and they pursued not after the sons of Jakob.", "tj": "", "tj_en": "", "rashi": "<b>חתת.<\/b> פַּחַד:", "rashi_en": "חתת means terror. "}, {"ch": 35, "v": 6, "aliyah": 5, "heb": "וַיָּבֹ֨א יַעֲקֹ֜ב ל֗וּזָה אֲשֶׁר֙ בְּאֶ֣רֶץ כְּנַ֔עַן הִ֖וא בֵּֽית־אֵ֑ל ה֖וּא וְכׇל־הָעָ֥ם אֲשֶׁר־עִמּֽוֹ׃", "onk": "וַאֲתָא יַעֲקֹב לְלוּז דִּי בְּאַרְעָא דִכְנַעַן הִיא בֵּית אֵל הוּא וְכָל עַמָּא דִּי עִמֵּיהּ:", "onk_en": "Yaakov came to Luz, which was in the land of Canaan—that is, to Beis Eil—he and all the people that were with him.", "pj": "וְאָתָא יַעֲקב לְלוּז בְּאַרְעָא דִכְנָעַן הוּא בֵית אֵל הוּא וְכָל עַמָא דְעִמֵיהּ", "pj_en": "And Jakob came to Luz in the land of Kenaan, which is Bethel, he and all the people who were with him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 7, "aliyah": 5, "heb": "וַיִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ וַיִּקְרָא֙ לַמָּק֔וֹם אֵ֖ל בֵּֽית־אֵ֑ל כִּ֣י שָׁ֗ם נִגְל֤וּ אֵלָיו֙ הָֽאֱלֹהִ֔ים בְּבׇרְח֖וֹ מִפְּנֵ֥י אָחִֽיו׃", "onk": "וּבְנָא תַמָּן מַדְבְּחָא וּקְרָא לְאַתְרָא אֵל בֵּית אֵל אֲרֵי תַמָּן אִתְגְּלִי לֵיהּ יְיָ בְּמֵעִרְקֵיהּ מִן קֳדָם אָחוּהִי:", "onk_en": "There he built an altar, and he called the place Eil Beis Eil, for there Elohim was revealed to him when he was fleeing from his brother.", "pj": "וּבְנָא תַמָן מַדְבְּחָא וּקְרָא לְאַתְרָא הַהוּא אֵל דְאַשְׁרֵי שְׁכִינְתֵּיהּ בְּבֵית אֵל אֲרוּם תַּמָן אִתְגְלִיאוּ לֵיהּ מַלְאָכַיָא דַיְיָ בְּמֵעַרְקֵיהּ מִן קֳדָם עֵשָו אָחוֹי", "pj_en": "And he builded there an altar, and named that place, To God, who made His Shekinah to dwell in Bethel, because there had been revealed to him the angels of the Lord, in his flight from before Esau his brother.", "tj": "", "tj_en": "", "rashi": "<b>אל בית אל.<\/b> הַקָּבָּ\"ה בְּבֵית אֵל, גִּלּוּי שְׁכִינָתוֹ בְּבֵית אֵל. יֵשׁ תֵּבָה חֲסֵרָה בֵּי\"ת הַמְשַׁמֶּשֶׁת בְּרֹאשָׁהּ, כְּמוֹ הִנֵּה הוּא בֵּית מָכִיר בֶּן עַמִּיאֵל (שמואל ב ט') – כְּמוֹ בְּבֵית מָכִיר; בֵּית אָבִיךְ (בראשית ל״ח:י״א) – כְּמוֹ בְּבֵית אָבִיךְ:<br><br><b>נגלו אליו האלהים.<\/b> בִּמְקוֹמוֹת הַרְבֵּה יֵשׁ שֵׁם אֱלֹהוּת וְאַדְנוּת בִּלְשׁוֹן רַבִּים, כְּמוֹ אֲדֹנֵי יוֹסֵף (שם ל\"ט), אִם בְּעָלָיו עִמּוֹ (שמות כ'), וְלֹא נֶאֱמַר בַּעֲלוֹ, וְכֵן אֱלֹהוּת שֶׁהוּא לְשׁוֹן שׁוֹפֵט וּמָרוּת נִזְכָּר בִּלְשׁוֹן רַבִּים, אֲבָל אֶחָד מִכָּל שְׁאָר הַשֵּׁמוֹת לֹא תִמְצָא בִּלְשׁוֹן רַבִּים:", "rashi_en": "אל בית אל EL-BETH-EL — the Holy One, blessed be He, is in Beth-El; i.e. His Divine Presence has revealed itself in Bethel. Sometimes the prefix ב “in” is omitted from a word: e.g., (2 Samuel 9:4) “Behold, he is (בית) in the house of Muchir, the son of Ammiel”, which is the same as בבית in the house of Machir; (24:13) בית אביך is the same as בבית אביך ,‘in the house of thy father”.<br><br>נגלו אליו האלהים GOD WAS REVEALED UNTO Him — In many passages terms denoting Divine Power and Lordship are used in the plural e. g., (39:20) “Joseph’s master (אֲדֹנֵי)” (construct plural), and (Exodus 22:14) “If its owner (בעליו) be with it”, where it does not say בַּעֲלוֹ (the singular form). Similarly, forms of אלהים denoting Judge or Authority are expressed in the plural, but you will find none other of the Divine Names in the plural. "}, {"ch": 35, "v": 8, "aliyah": 5, "heb": "וַתָּ֤מׇת דְּבֹרָה֙ מֵינֶ֣קֶת רִבְקָ֔ה וַתִּקָּבֵ֛ר מִתַּ֥חַת לְבֵֽית־אֵ֖ל תַּ֣חַת הָֽאַלּ֑וֹן וַיִּקְרָ֥א שְׁמ֖וֹ אַלּ֥וֹן בָּכֽוּת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמִיתַת דְּבוֹרָה מֵנִקְתָּא דְרִבְקָה וְאִתְקְבָרַת מִלְּרַע לְבֵית אֵל <b>בְּשִׁפּוֹלֵי מֵישְׁרָא<\/b> וּקְרָא שְׁמֵיהּ <b>מֵישַׁר בָּכִיתָא<\/b>:", "onk_en": "Devorah, Rivkah’s nurse, died, and she was buried below Beis Eil, under Allon [<b>on the lower plain<\/b>]. He named it Allon of Weeping [<b>Plain of the Weeping<\/b>].", "pj": "וּמִיתַת דְבוֹרָה פִּידְגוּגְתָא דְרִבְקָה וְאִתְקְבָרַת מִן לְרַע לְבֵית אֵל בְּשִׁיפּוּלֵי מֵישְׁרָא וּבְרַם תַּמָן אִתְבַּשַר יַעֲקב עַל מִיתַת רִבְקָה אִימֵיהּ וּקְרָא שְׁמֵיהּ אוֹחֲרָן בִּכְיוּתָא", "pj_en": "And Deborah, the nurse of Rivekah, died, and was buried below Bethel, in the field of the plain. And there it was told Jakob concerning the death of Rivekah his mother; and he called the name of it, The other weeping.", "tj": "וּמִיתַת דְבוֹרָה מַרְבְּיָיתָא דְרִבְקָה וְאִתְקְבָרַת מִלְרַע לְבֵית אֵל תְּחוֹת בְּלוּטָה וּקְרָא שְׁמֵיהּ בְּלוֹט בְּכוּתָא:", "tj_en": "And Deborah the nurse of Rivekah died, and was buried below Beth El under an oak: and he called the name of it, The Oak of Weeping.", "rashi": "<b>ותמת דבורה.<\/b> מָה עִנְיַן דְּבוֹרָה בְּבֵית יַעֲקֹב? אֶלָּא לְפִי שֶׁאָמְרָה רִבְקָה לְיַעֲקֹב וְשָׁלַחְתִּי וּלְקַחְתִּיךָ מִשָּׁם, שָׁלְחָה דְבוֹרָה אֶצְלוֹ לְפַדַּן אֲרָם לָצֵאת מִשָּׁם, וּמֵתָה בַדֶּרֶךְ; מִדִּבְרֵי רַבִּי מֹשֶׁה הַדַּרְשָׁן לְמַדְתִּיהָ:<br><br><b>מתחת לבית אל.<\/b> הָעִיר יוֹשֶׁבֶת בָּהָר וְנִקְבְּרָה בְּרַגְלֵי הָהָר:<br><br><b>תחת האלון.<\/b> בְּשִׁפּוּלֵי מֵישְׁרָא, שֶׁהָיָה מִישׁוֹר מִלְמַעְלָה בְּשִׁפּוּעַ הָהָר וְהַקְּבוּרָה מִלְּמַטָּה, וּמִישׁוֹר שֶׁל בֵּית אֵל הָיוּ קוֹרִין לוֹ אַלּוֹן. וְאַגָּדָה, נִתְבַּשֵּׂר שָׁם בְּאֵבֶל שֵׁנִי, שֶׁהֻגַּד לוֹ עַל אִמּוֹ שֶׁמֵּתָה (בראשית רבה), וְאַלּוֹן בִּלְשׁוֹן יְוָנִי אַחֵר, וּלְפִי שֶׁהֶעֱלִימוּ אֶת יוֹם מוֹתָהּ שֶׁלֹּא יְקַלְּלוּ הַבְּרִיּוֹת כֶּרֶס שֶׁיָּצָא מִמֶּנּוּ עֵשָׂו, אַף הַכָּתוּב לֹא פִרְסְמָהּ:", "rashi_en": "ותמת דבורה AND DEBORAH DIED — How came Deborah to be in Jacob’s house? But the explanation is: because Rebékah had promised Jacob (Gen. 27:45) “then I will send and fetch thee from thence”, she sent Deborah to him to Padan-aram to tell him to leave that place, and she died on the return journey I learnt this from a comment of R. Moses Ha-darshan.<br><br>מתחת לבית אל BELOW BETHEL — The city was situated on a mountain and she was buried at the foot of the mountain.<br><br>תחת האלון UNDER THE OAK — The Targum renders it by “on the lower part of the plain” because there was some level ground above on the slope of the hill and her grave was beneath this. The plain of Bethel bore the name of Allon (cf. Rashi on Genesis 14:6). An Agada (Genesis Rabbah 81:5) states that he there received news of another mourning for he was informed that his mother had died. — In Greek allon means “another”. — Because the time of her death was kept secret in order that people might not curse the mother who gave birth to Esau, Scripture also does not make open mention of her death (Midrash Tanchuma, Ki Teitzei 4)."}, {"ch": 35, "v": 9, "aliyah": 5, "heb": "וַיֵּרָ֨א אֱלֹהִ֤ים אֶֽל־יַעֲקֹב֙ ע֔וֹד בְּבֹא֖וֹ מִפַּדַּ֣ן אֲרָ֑ם וַיְבָ֖רֶךְ אֹתֽוֹ׃", "onk": "<b>וְאִתְגְּלִי<\/b> יְיָ לְיַעֲקֹב עוֹד בְּמֵיתוֹהִי מִפַּדַּן אֲרָם וּבָרִיךְ יָתֵיהּ:", "onk_en": "Elohim again appeared [<b>became revealed<\/b>] to Yaakov when he came from Padan Aram, and He blessed him.", "pj": "וְאִיתְגְלֵי יְיָ לְיַעֲקב תּוּב בְּמֵיתוֹהִי מִפַּדַן דַאֲרָם וּבְרִיךְ יְיָ בְּשׁוּם מֵימְרֵיהּ בָּתַר דְמִיתַת אִמֵיהּ", "pj_en": "And the Lord revealed Himself to Jakob again on his return from Padan of Aram, and the Lord blessed him by the name of His Word, after the death of his mother.", "tj": "אֱלָהָא דְעַלְמָא יְהֵי שְׁמֵיהּ מְבָרֵךְ לְעָלְמֵי עַלְמָא אַלִיפַת יָתָן פִּיקוּדִין יָאִין וְקַיָימִין שַׁפִּירִין אַלִיפַת יָתָן בִּרְכַת חֲתָנָא מִן אָדָם וְזוֹגֵיהּ דְכֵן כָּתְבָא מְפָרַשׁ וּבְרִיךְ יַתְהוֹן מֵימְרֵיהּ דַיְיָ וַאֲמַר לְהוֹן מֵימְרֵיהּ דַיְיָ תְּקוּפוּ וּסְגוֹן וּמְלוֹן יַת אַרְעָא וּכְבוּשׁוּ יָתָהּ. אַלִיפַת יָתָן לִמְבַקְרָא יַת בִּישַׁיָיא מִן אָבוּנָן אַבְרָהָם צַדִיקָא כַּד אִתְגַלֵית עֲלוֹי בְּמֵישְׁרֵי חֲזוֹזָא וּפַקִידַת יָתֵיהּ לְמִיגְזַר עוּרְלָתֵיהּ וִיתֵיב לֵיהּ בִּתְרַע מַשְׁכְּנֵיהּ כְּמֵיחוֹם יוֹמָא דְכֵן כָּתְבָא מְפָרַש וַאֲמַר וְאִתְגְלֵי עֲלוֹי מֵימְרֵיהּ דַיְיָ בְּמֵישְׁרֵיהּ חֲזוֹזָא. וְעוֹד אַלִיפַת לָן לִמְבָרְכָא יַת אֲבֵילַיָא מִן אָבוּנָן יַעֲקב צַדִיקַיָא כַּד אִתְגְלִית עֲלוֹי בְּמַיְיתֵיהּ מִן פַּדַן דַאֲרָם כַּד אַרְעִית לִדְבוֹרָה מַרְבְּיָיתָהּ דְרִבְקָה אִמֵיהּ אוֹרְחָא דְעַלְמָא וּמִיתַת עֲלוֹי רָחֵל בְּאוֹרְחָא וִיתֵיב לֵיהּ יַעֲקב אֲבוּנָן צָוַח וּמְיַלֵיל לָהּ וּמִסְפַּד וּבָכֵי. וְאַנְתְּ רִבּוֹן כָּל עָלְמַיָא יְיָ בִּמְכִילַת רַחֲמִיךְ טַבְיָא אִיתְגְלֵיתָא עֲלוֹי וּנְחִימַת יָתֵיהּ וּבִרְכַת אֲבֵילַיָא בָּרְכַת יָתֵיהּ עַל אִמֵיהּ בְּגִין כְּדֵין כָּתְבָא מְפָרַשׁ וַאֲמַר וְאִתְגְלֵי מֵימְרֵיהּ דַיְיָ עַל יַעֲקב זְמַן תִּנְיָנוּת בְּמַיְיתֵיה מִפַּדַן אֲרָם וּבְרִיךְ יָתֵיהּ:", "tj_en": "The God of eternity, whose name be Blessed for ever and ever, hath taught us precepts which are beautiful and statutes that are comely: He hath taught us the blessing of matrimony from Adam and his bride, as the scripture expoundeth And the Word of the Lord blessed them, and the Word of the Lord said to them, Be strong and multiply, and fill the earth, and subdue it. He hath taught us to visit the afflicted, from our father Abraham the Righteous, when He revealed Himself to him in the plain of Vision, and gave him the precept of circumcision, and made him to sit in the door of his tent in the heat of the day; as the scripture expoundeth and saith, And the Word of the Lord revealed Himself to him in the plain of Vision. And again He hath taught us to bless those who mourn, from our father Jakob the Righteous: for He revealed Himself to him on his coming from Padan of Aram, when the way of the world had happened to Deborah, the nurse of Rivekah his mother, and Rahel died by him in the way, and Jakob our father sat weeping and bewailing her, and mourning and crying. Then wast Thou, 0 Lord of all worlds, in the perfection of Thy free mercies revealed to him, and didst comfort him, and blessing the mourners didst bless him concerning his mother, even as the scripture expoundeth and saith, The Word of the Lord revealed Himself unto Jakob the second time on his coming from Padan Aram, and blessed him.", "rashi": "<b>עוד.<\/b> פַּעַם שֵׁנִי בַּמָּקוֹם הַזֶּה, אֶחָד בְּלֶכְתּוֹ וְאֶחָד בְּשׁוּבוֹ:<br><br><b>ויברך אתו.<\/b> בִּרְכַּת אֲבֵלִים (בראשית רבה):", "rashi_en": "עוד AGAIN — the second time at this spot: once when he set out on his journey, once when he returned.<br><br>ויברך אתו AND HE BLESSED HIM. — He gave him the blessing of consolation addressed to mourners (Genesis Rabbah 81:5; cp. Rashi on Genesis 25:11). "}, {"ch": 35, "v": 10, "aliyah": 5, "heb": "וַיֹּֽאמֶר־ל֥וֹ אֱלֹהִ֖ים שִׁמְךָ֣ יַעֲקֹ֑ב לֹֽא־יִקָּרֵא֩ שִׁמְךָ֨ ע֜וֹד יַעֲקֹ֗ב כִּ֤י אִם־יִשְׂרָאֵל֙ יִהְיֶ֣ה שְׁמֶ֔ךָ וַיִּקְרָ֥א אֶת־שְׁמ֖וֹ יִשְׂרָאֵֽל׃", "onk": "וַאֲמַר לֵיהּ יְיָ שְׁמָךְ יַעֲקֹב לָא יִתְקְרֵי שְׁמָךְ עוֹד יַעֲקֹב אֶלָּהֵין יִשְׂרָאֵל יְהֵא שְׁמָךְ וּקְרָא יָת שְׁמֵיהּ יִשְׂרָאֵל:", "onk_en": "Elohim said to him. Your name is Yaakov. No longer will your name be Yaakov, but Yisrael will be your name; and He named him Yisrael.", "pj": "וַאֲמַר לֵיהּ יְיָ עַד כְּדוּן הֲוָה שְׁמָךְ יַעֲקב לָא יִתְקְרֵי שְׁמָךְ תּוּב יַעֲקב אֱלָהֵן יִשְרָאֵל יְהֵי שְׁמָךְ וּקְרָא יַת שְׁמֵיהּ יִשְרָאֵל", "pj_en": "And the Lord said to him, Heretofore was thy name Jakob: thy name shall be no more called Jakob, but Israel shall be thy name.", "tj": "", "tj_en": "", "rashi": "<b>לא יקרא שמך עוד יעקב.<\/b> לְשׁוֹן אָדָם הַבָּא בְּמַאֲרָב וְעָקְבָּה, אֶלָּא לְשׁוֹן שַׂר וְנָגִיד:", "rashi_en": "לא יקרא שמך עוד יעקב THY NAME SHALL NOT BE CALLED ANY MORE JACOB— which means a man who comes as a lurker and trickster, but it shall be Israel (ישראל), which signifies Prince and Chief. "}, {"ch": 35, "v": 11, "aliyah": 5, "heb": "וַיֹּ֩אמֶר֩ ל֨וֹ אֱלֹהִ֜ים אֲנִ֨י אֵ֤ל שַׁדַּי֙ פְּרֵ֣ה וּרְבֵ֔ה גּ֛וֹי וּקְהַ֥ל גּוֹיִ֖ם יִהְיֶ֣ה מִמֶּ֑ךָּ וּמְלָכִ֖ים מֵחֲלָצֶ֥יךָ יֵצֵֽאוּ׃", "onk": "וַאֲמַר לֵיהּ יְיָ אֲנָא אֵל שַׁדַּי פּוּשׁ וּסְגֵי עַם <b>וְכִנְשַׁת שִׁבְטִין<\/b> יְהֵא מִנָּךְ וּמַלְכִין <b>דְּשַׁלִּיטִין בְּעַמְמַיָּא<\/b> <b>מִנָּךְ יִפְּקוּן<\/b>:", "onk_en": "Elohim said to him, I am Almighty Shaddai. Be fruitful and increase, a nation and a community of nations [<b>an assembly of tribes<\/b>] will come from you, and kings [<b>who rule over nations<\/b>] will come out of your loins [<b>descend from you<\/b>].", "pj": "וַאֲמַר לֵיהּ יְיָ אֲנָא אֵל שַׁדַי פּוּשׁ וּסְגִי עַם קַדִישׁ וְכִינְשַׁן נְבִיאִין וְכַהֲנִין יְהוֹן מִבְּנָךְ דְאוֹלֵידְתָּא וּתְרֵין מַלְכִין תּוּב מִינָךְ יִפְקוּן", "pj_en": "And the Lord said to him, I am El Shadai: spread forth and multiply; a holy people, and a congregation of prophets and priests, shall be from thy sons whom thou hast begotten, and two kings shall yet from thee go forth.", "tj": "", "tj_en": "", "rashi": "<b>אני אל שדי.<\/b> שֶׁאֲנִי כְדַי לְבָרֵךְ, שֶׁהַבְּרָכוֹת שֶׁלִּי:<br><br><b>פרה ורבה.<\/b> עַל שֵׁם שֶׁעֲדַיִן לֹא נוֹלַד בִּנְיָמִין, וְאַף עַל פִּי שֶׁכְּבָר נִתְעַבְּרָה מִמֶּנּוּ:<br><br><b>גוי.<\/b> בִּנְיָמִין:<br><br><b>גוים.<\/b> מְנַשֶּׁה וְאֶפְרַיִם, שֶׁעֲתִידִים לָצֵאת מִיּוֹסֵף, וְהֵם בְּמִנְיַן הַשְּׁבָטִים (בראשית רבה):<br><br><b>ומלכים.<\/b> שָׁאוּל וְאִישׁ בֹּשֶׁת, שֶׁהָיוּ מִשֵּׁבֶט בִּנְיָמִין (בראשית רבה), שֶׁעֲדַיִן לֹא נוֹלְדוּ (וּפָסוּק זֶה דְּרָשׁוֹ אַבְנֵר כְּשֶׁהִמְלִיךְ אִישׁ בֹּשֶׁת, וְאַף הַשְּׁבָטִים דְּרָשׁוּהוּ וְקֵרְבוּ בִּנְיָמִין, דִּכְתִיב אִישׁ מִמֶּנּוּ לֹא יִתֵּן אֶת בִּתּוֹ לְבִנְיָמִן לְאִשָּׁה (שופטים כ\"א), וְחָזְרוּ וְאָמְרוּ אִלְמָלֵא הָיָה עוֹלֶה מִן הַשְּׁבָטִים לֹא הָיָה הַקָּבָּ\"ה אוֹמֵר לְיַעֲקֹב וּמְלָכִים מֵחֲלָצֶיךָ יֵצֵאוּ:<br><br><b>גוי וקהל גוים.<\/b> שֶׁגּוֹיִם עֲתִידִים בָּנָיו לְהֵעָשׂוֹת כְּמִנְיַן הַגּוֹיִם, שֶׁהֵם ע' אֻמּוֹת, וְכֵן כָּל הַסַּנְהֶדְרִין שִׁבְעִים; דָּבָר אַחֵר שֶׁעֲתִידִים בָּנָיו לְהַקְרִיב בִּשְׁעַת אִסּוּר בָּמוֹת כַּגּוֹיִם בִּימֵי אֵלִיָּהוּ):", "rashi_en": "אני אל שדי I AM GOD, ALMIGHTY, for I have the power to bless because the blessings are Mine. <br><br>פרה ורבה BE FRUITFUL AND MULTIPLY — God said this in allusion to the fact that Benjamin was not yet born although she (Rachel) was soon to give birth to him (Genesis Rabbah 82:4). <br><br>גוי A NATION — referring to Benjamin. (Genesis Rabbah 82:4)<br><br>גוים NATIONS — referring to Manasseh and Ephraim who would come from Joseph — and these actually were counted as tribes.<br><br>ומלכים AND KINGS — referring to Saul and Ishbosheth who were of the tribe of Benjamin and these were not yet born. This verse Abner explained in this sense when he made Ishbosheth king, and the tribes of Israel also explained it thus and therefore became friendly again with the tribe of Benjamin. For so it is written (Judges 21:1) “They said there shall not any of us give his daughter unto Benjamin to wife”. Afterwards they retracted this, saying, “If, indeed, he was not to be counted among the tribes), the Holy One, blessed be He would not have said to Jacob in reference to Benjamin and kings shall come out of thy loins” (and since there have not yet been kings of the tribe of Benjamin that tribe must not be exterminated). Genesis Rabbah 82:4<br><br>גוי וקהל גוים “A NATION AND AN ASSEMBLAGE OF NATIONS” — this means that his sons are destined to become nations the same in number as the nations (of the ancient world) which was seventy. So, too, the whole Sanhedrin consisted of seventy. Another explanation is that it signifies that his children will sacrifice on high places at a time when this practice is forbidden, as other nations always did — this refers to the days of Elijah (Genesis Rabbah 82:5). From “This verse” is found in an old text of Rashi.)"}, {"ch": 35, "v": 12, "aliyah": 6, "heb": "וְאֶת־הָאָ֗רֶץ אֲשֶׁ֥ר נָתַ֛תִּי לְאַבְרָהָ֥ם וּלְיִצְחָ֖ק לְךָ֣ אֶתְּנֶ֑נָּה וּֽלְזַרְעֲךָ֥ אַחֲרֶ֖יךָ אֶתֵּ֥ן אֶת־הָאָֽרֶץ׃", "onk": "וְיָת אַרְעָא דִּי יְהָבִית לְאַבְרָהָם וּלְיִצְחָק לָךְ אֶתְּנִנַהּ וְלִבְנָךְ בַּתְרָךְ אֶתֵּן יָת אַרְעָא:", "onk_en": "The land that I gave to Avraham and Yitzchok, I will give to you; and to your offspring after you I will give the land.", "pj": "וְיַת אַרְעָא דִיהָבִית לְאַבְרָהָם לְיִצְחָק לָךְ אִיתְּנִינָהּ וְלִבְנָךְ בַּתְרָךְ אֶתֵּן יַת אַרְעָא", "pj_en": "And the land which I gave to Abraham and to Izhak will I give unto thee, and to thy son, after thee will I give the land.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 13, "aliyah": 6, "heb": "וַיַּ֥עַל מֵעָלָ֖יו אֱלֹהִ֑ים בַּמָּק֖וֹם אֲשֶׁר־דִּבֶּ֥ר אִתּֽוֹ׃", "onk": "וְאִסְתַּלַּק מֵעִלָּו‍ֹהִי <b>יְקָרָא<\/b> דַיְיָ בְּאַתְרָא דִּי מַלִּיל עִמֵּיהּ:", "onk_en": "[<b>The Glory of<\/b>] Elohim ascended from him at the place where He had spoken to him.", "pj": "וְאִסְתְּלֵק מֵעִילוֹי שְׁכִינְתָּא דַיְיָ בְּאַתְרָא דְמַלֵיל עִמֵיהּ", "pj_en": "And the Shekinah of the Lord ascended from him in the place where He had spoken with him", "tj": "", "tj_en": "", "rashi": "<b>במקום אשר דבר אתו.<\/b> אֵינִי יוֹדֵעַ מַה מְּלַמְּדֵנוּ:", "rashi_en": "במקום אשר דבר אתו AT THE PLACE WHERE HE SPAKE WITH HIM — I do not know what this is intended to tell us. "}, {"ch": 35, "v": 14, "aliyah": 6, "heb": "וַיַּצֵּ֨ב יַעֲקֹ֜ב מַצֵּבָ֗ה בַּמָּק֛וֹם אֲשֶׁר־דִּבֶּ֥ר אִתּ֖וֹ מַצֶּ֣בֶת אָ֑בֶן וַיַּסֵּ֤ךְ עָלֶ֙יהָ֙ נֶ֔סֶךְ וַיִּצֹ֥ק עָלֶ֖יהָ שָֽׁמֶן׃", "onk": "וַאֲקֵים יַעֲקֹב קַמְתָא בְּאַתְרָא דִּי מַלִּיל עִמֵּיהּ קָמַת אַבְנָא וְאַסִּיךְ עֲלַהּ <b>נִסּוּכִין<\/b> וַאֲרִיק עֲלַהּ מִשְׁחָא:", "onk_en": "Yaakov set up a monument in the place where He had spoken to him, it was a monument of [a single] stone. He poured a libation [<b>libations<\/b>] on it, and he [also] poured oil on it.", "pj": "וְאָקִים תַּמָן קָמָא בְּאַתְרָא דְמַלֵיל עִמֵיהּ קָמָא דְאַבְנָא וּנְסִיךְ עֲלָהּ נִיסוּךְ חֲמַר נְסוּךְ מוֹי אֲרוּם כְּדֵין עֲתִידִין לְמֶעֱבַד בְּחַגָא דִמְטָלַיָא וְאָרֵיק עֲלָהּ מְשַׁח זֵיתָא", "pj_en": "And Jakob erected there a pillar of stone in the place where He had spoken with him, a pillar of stone; and he outpoured upon it a libation of wine, and a libation of water, because thus it was to be done at the feast of Tabernacles; and he poured oil of olives thereupon.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 15, "aliyah": 6, "heb": "וַיִּקְרָ֨א יַעֲקֹ֜ב אֶת־שֵׁ֣ם הַמָּק֗וֹם אֲשֶׁר֩ דִּבֶּ֨ר אִתּ֥וֹ שָׁ֛ם אֱלֹהִ֖ים בֵּֽית־אֵֽל׃", "onk": "וּקְרָא יַעֲקֹב יָת שְׁמָא דְאַתְרָא דִּי מַלִּיל עִמֵּיהּ תַּמָּן יְיָ בֵּית אֵל:", "onk_en": "Yaakov named the place where Elohim had spoken to him; Beis Eil, [the House of the Almighty].", "pj": "וּקְרָא יַעֲקב יַת שְׁמֵיהּ דְאַתְרָא דְמַלֵיל עִימֵיהּ תַּמָן יְיָ בֵּית אֵל", "pj_en": "And Jakob called the name of the place where the Lord had spoken with him Beth El.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 16, "aliyah": 6, "heb": "וַיִּסְעוּ֙ מִבֵּ֣ית אֵ֔ל וַֽיְהִי־ע֥וֹד כִּבְרַת־הָאָ֖רֶץ לָב֣וֹא אֶפְרָ֑תָה וַתֵּ֥לֶד רָחֵ֖ל וַתְּקַ֥שׁ בְּלִדְתָּֽהּ׃", "onk": "וּנְטָלוּ מִבֵּית אֵל וַהֲוָה עוֹד כְּרוּבַת אַרְעָא לְמֵיעַל לְאֶפְרָת וִילִידַת רָחֵל וְקַשִּׁיאַת בְּמֵילְדַהּ:", "onk_en": "They journeyed on from Beis Eil, and there was yet a stretch of land before [they would reach] Ephros when Rochel began to give birth. Her labor was very difficult.", "pj": "וּנְטָלוּ מִבֵּית אֵל וַהֲוָה תּוּב סוֹגְעֵי אַשְׁווֹן עֲלַלְתָּא דְאַרְעָא בְּמֵיתֵיהּ לְאֶפְרָת וִילֵידַת רָחֵל וְקַשְׁיַית בְּמֵילְדָהּ", "pj_en": "And they proceeded from Beth El; and there was yet much space of provision land in the coming to Ephrath and Rahel travailed, and had hard labour in her birth.", "tj": "וַהֲוָה אִישׁוֹן כְּרוּב אַרְעָא לְמֵיעַל לְאֶפְרָת וִילֵידַת רָחֵל וְאִתְקְשִׁיאַת בְּמֵילְדָה:", "tj_en": "And there was a space, as much ground, to come unto Ephrath; and Rahel travailed, and had hard labour in her birth.", "rashi": "<b>כברת הארץ.<\/b> מְנַחֵם פֵּרֵשׁ לְשׁוֹן כַּבִּיר, רִבּוּי, מַהֲלָךְ רַב. וְאַגָּדָה, בִּזְמַן שֶׁהָאָרֶץ חֲלוּלָה וּמְנֻקֶּבֶת כִּכְבָרָה (בראשית רבה), שֶׁהַנִּיר מָצוּי, הַסְּתָו עָבַר וְהַשָּׁרָב עֲדַיִן לֹא בָא (שם ז), וְאֵין זֶה פְּשׁוּטוֹ שֶׁל מִקְרָא, שֶׁהֲרֵי בְּנַעֲמָן מָצִינוּ וַיֵּלֶךְ מֵאִתּוֹ כִּבְרַת אָרֶץ (מלכים ב ה'). וְאוֹמֵר אֲנִי שֶׁהוּא שֵׁם מִדַּת קַרְקַע, כְּמוֹ מַהֲלַךְ פַּרְסָה אוֹ יוֹתֵר, כְּמוֹ שֶׁאַתָּה אוֹמֵר צֶמֶד כֶּרֶם (ישעיהו ה'), חֶלְקַת הַשָּׂדֶה (בראשית ל\"ג), כָּךְ בְּמַהֲלַךְ אָדָם נוֹתֵן שֵׁם מִדָּה כִּבְרַת אֶרֶץ:", "rashi_en": "כברת הארץ A KIBRATH OF LAND — Menachem ben Seruk explains the word כברת to have the meaning of כביר “much” and that the phrase means a great distance. A Midrashic explanation is: at the time when the ground was full of holes and was riddled like a sieve (כברה) (cf. Rashi on Genesis 48:7) — when there was plenty of ploughed ground; the winter was passed, but the dry season had not yet come. This, however, cannot be the literal sense of the verse, for in the case of Naaman we find (2 Kings 5:19) “So he departed from him כברת ארץ” (which cannot possibly have this meaning). I think that it is a name for a measure of land, the distance of a Parsa or more, just as you say (Isaiah 5:10) “acres (צמדי) of vineyard” and (33:19) “the parcel (חלקת) of field”: In the same way in reference to a man’s journey Scripture mentions the name of a measure — viz., a כברת ארץ, a כברה of land. "}, {"ch": 35, "v": 17, "aliyah": 6, "heb": "וַיְהִ֥י בְהַקְשֹׁתָ֖הּ בְּלִדְתָּ֑הּ וַתֹּ֨אמֶר לָ֤הּ הַמְיַלֶּ֙דֶת֙ אַל־תִּ֣ירְאִ֔י כִּֽי־גַם־זֶ֥ה לָ֖ךְ בֵּֽן׃", "onk": "וַהֲוָה בְּקַשְׁיוּתַהּ בְּמֵילְדַהּ וַאֲמֶרֶת לַהּ חָיְתָא לָא תִדְחֲלִי אֲרֵי אַף דֵּין לִיךְ בָּר:", "onk_en": "When her labor was at its most difficult stage, the midwife said to her, Do not fear, for this one will also be a son for you.", "pj": "וַהֲוָה בְּקַשְׁיוּתָהּ בְּמֵילְדָהּ וַאֲמָרַת לָהּ חַיְיתָא לָא תִדְחָלִין אֲרוּם אוּף דֵין לִיךְ בַּר דְכַר", "pj_en": "And it was in the hardness of her travail that the midwife said to her, Fear not, for this also is to thee a male child.
