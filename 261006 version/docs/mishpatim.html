rashi": "<b>כמהר הבתולת.<\/b> שֶׁהוּא קָצוּב חֲמִשִּׁים כֶּסֶף אֵצֶל הַתּוֹפֵס אֶת הַבְּתוּלָה וְשׁוֹכֵב עִמָּהּ בְּאֹנֶס, שֶׁנֶּאֱמַר וְנָתַן הָאִישׁ הַשֹּׁכֵב עִמָּהּ לַאֲבִי הַנַּעֲרָה חֲמִשִּׁים כָּסֶף (דברים כ\"ב):", "rashi_en": "כמהר הבתולת AS THE MARRIAGE PRICE OF THE VIRGINS — which is limited to fifty shekels in the case of one who outrages a virgin, for it is said, (Deuteronomy 22:29) “Then the man that lay with her shall give unto the damsel’s father fifty shekels of silver” (Mekhilta; Ketubot 10a)."}, {"ch": 22, "v": 17, "aliyah": 3, "heb": "מְכַשֵּׁפָ֖ה לֹ֥א תְחַיֶּֽה׃", "onk": "חָרָשָׁא לָא תָחֵי:", "onk_en": "You shall not allow a witch to live.", "pj": "עַמִּי בְנֵי יִשְרָאֵל כָּל עֲבִיד חַרְשִׁיּוּתָא לָא תְקַיְימוּן", "pj_en": "Sons of My people Israel, whosoever practiseth witchcraft you shall not suffer to live.", "tj": "", "tj_en": "", "rashi": "<b>מכשפה לא תחיה.<\/b> אֶלָּא תּוּמַת בְּבֵית דִּין; וְאֶחָד זְכָרִים וְאֶחָד נְקֵבוֹת, אֶלָּא שֶׁדִּבֵּר הַכָּתוּב בַּהוֹוֶה, שֶׁהַנָּשִׁים מְצוּיוֹת מְכַשֵּׁפוֹת (סנהדרין ס\"ז):", "rashi_en": "מכשפה לא תחיה THOU SHALT NOT SUFFER A WITCH TO LIVE — This does not mean that you may kill her but she shall be put to death by the court. Both men and women who practise witchcraft are included in this law but in using the feminine term מכשפה Scripture speaks of what is usually the case; for it is women who mostly practise witchcraft (Sanhedrin 67a)."}, {"ch": 22, "v": 18, "aliyah": 3, "heb": "כׇּל־שֹׁכֵ֥ב עִם־בְּהֵמָ֖ה מ֥וֹת יוּמָֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל דְיִשְׁכּוּב עִם בְּעִירָא אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Whoever lies with an animal must be put to death.", "pj": "כָּל דְּיִשְׁכּוּב עִם בְּעִירָא בְאַטְלוּת אַבְנִין יִתְקַטְלוּן", "pj_en": "Whosoever lieth with a beast shall be stoned to death.", "tj": "", "tj_en": "", "rashi": "<b>כל שכב עם בהמה מות יומת.<\/b> בִּסְקִילָה, רוֹבֵעַ כַּנִּרְבַּעַת, שֶׁכָּתוּב בָּהֶם דְּמֵיהֶם בָּם (ויקרא כ'):", "rashi_en": "כל שכב עם בהמה מות יומת — All who have carnal connection with beasts, whether men or women, shall surely be put to death — by stoning, for it states of such, (Leviticus 20:16) “their blood is upon them” (cf. Rashi on Exodus 21:17) (Mekhilta)]."}, {"ch": 22, "v": 19, "aliyah": 3, "heb": "זֹבֵ֥חַ לָאֱלֹהִ֖ים יׇֽחֳרָ֑ם בִּלְתִּ֥י לַיהֹוָ֖ה לְבַדּֽוֹ׃", "onk": "דְדַבַּח <b>לְטַעְוַת עַמְמַיָא<\/b> יִתְקְטֵל אֶלָהֵן <b>לִשְׁמָא דַ<\/b>יְיָ בִּלְחוֹדוֹהִי:", "onk_en": "Whoever slaughters to a god [<b>false gods of the peoples<\/b>] must be condemned [to die]. [Sacrifices may be offered] to [<b>the Name of<\/b>] Adonoy alone.", "pj": "כָּל מַאן דְּדַבַּח לְטַעֲוַות עַמְמַיָא יִתְקְטֵל בְּסַיְיפָא וְנִכְסוֹי יִתְגַמְרוּן בְּגִין כֵּן לָא תְהוֹן פַּלְחִין אֱלָהֵן לִשְׁמָא דַיְיָ בִּלְחוֹדוֹי", "pj_en": "Whosoever sacrificeth to the idols of the Gentiles shall be slain with the sword, and his goods be destroyed; for ye shall worship only the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לאלהים.<\/b> לַעֲ\"זָ; אִלּוּ הָיָה נָקוּד לֵאלֹהִים, הָיָה צָרִיךְ לְפָרֵשׁ וְלִכְתֹּב \"אֲחֵרִים\", עַכְשָׁו שֶׁאָמַר לָאֱלֹהִים, אֵין צָרִיךְ לְפָרֵשׁ אֲחֵרִים, שֶׁכָּל לָמֶ\"ד וּבֵי\"ת הַמְשַׁמֶּשֶׁת בְּרֹאשׁ הַתֵּבָה אִם נְקוּדָה בַּחֲטָף, כְּגוֹן לְמֶלֶךְ, לְמִדְבָּר, לְעִיר, צָרִיךְ לְפָרֵשׁ לְאֵיזֶה מֶלֶךְ, לְאֵיזֶה מִדְבָּר, לְאֵיזֶה עִיר, וְכֵן לִמְלָכִים וְלִרְגָלִים צָרִיךְ לְפָרֵשׁ לְאֵיזֶה, וְאִם אֵינוֹ מְפָרֵשׁ, כָּל מְלָכִים בְּמַשְׁמָע, כֵן לֵאלֹהִים כָּל אֱלֹהִים בְּמַשְׁמָע – אֲפִלּוּ קֹדֶשׁ, אֲבָל כְּשֶׁהִיא נְקוּדָה פַּתָּח, כְּמוֹ לַמֶּלֶךְ, לַמִּדְבָּר, לָעִיר, נוֹדַע בְּאֵיזֶה מֶלֶךְ מְדַבֵּר, וְכֵן לָעִיר נוֹדַע בְּאֵיזֶה עִיר מְדַבֵּר, וְכֵן לָאֱלֹהִים – לְאוֹתָן שֶׁהֻזְהַרְתֶּם עֲלֵיהֶם בְּמָקוֹם אַחֵר; כַּיּוֹצֵא בוֹ אֵין כָּמוֹךָ בָאֱלֹהִים, לְפִי שֶׁלֹּא פֵּרֵשׁ, הֻצְרַךְ לִנָּקֵד פַּתָּח:<br><br><b>יחרם.<\/b> יוּמַת; לָמָּה נֶאֱמַר יָחֳרָם וַהֲלֹא כְבָר נֶאֶמְרָה בוֹ מִיתָה בְמָקוֹם אַחֵר וְהוֹצֵאתָ אֶת הָאִישׁ הַהוּא אוֹ אֶת הָאִשָּׁה הַהִוא וְגוֹ' (דברים י\"ז)? אֶלָּא לְפִי שֶׁלֹּא פֵּרֵשׁ עַל אֵיזוֹ עֲבוֹדָה חַיָּב מִיתָה – שֶׁלֹּא תֹאמַר כָּל עֲבוֹדוֹת בְּמִיתָה – בָּא וּפֵרֵשׁ לְךָ כָּאן \"זֹבֵחַ\" לָאֱלֹהִים, לוֹמַר לְךָ, מַה זְּבִיחָה עֲבוֹדָה הַנַּעֲשֵׂית בִּפְנִים לַשָּׁמַיִם, אַף אֲנִי מְרַבֶּה הַמַּקְטִיר וְהַמְנַסֵּךְ שֶׁהֵם עֲבוֹדוֹת בִּפְנִים, וְחַיָּבִים עֲלֵיהֶם לְכָל עֲ\"זָ בֵּין שֶׁדַּרְכָּהּ לְעָבְדָהּ בְּכָךְ, בֵּין שֶׁאֵין דַּרְכָּהּ לְעָבְדָהּ בְּכָךְ. אֲבָל שְׁאָר עֲבוֹדוֹת, כְּגוֹן הַמְכַבֵּד וְהַמְרַבֵּץ וְהַמְגַפֵּף וְהַמְנַשֵּׁק אֵינוֹ בְּמִיתָה:", "rashi_en": "לָאֱלֹהִים means TO IDOLS — If the word (a noun) were punctuated לֵאלֹהִים, with Tzéré under the first ל it would be necessary to define it more closely by adding the adjective אחרים = strange (gods — idols); now, however, that it says לָאֱלֹהִים it is not necessary to define it more closely by adding the word אחרים. For wherever ל or ב are prefixed to a word if it (the prefix) be punctuated with Chataph (שוא), as e. g., לְמֶלֶךְ a king, לְמִדְבָּר, to a desert, לָעִיר, to a city, it must be explained to which king, to which desert, to which city. The same is the case if the ל or ב has a Chirik instead of a Sheva which happens when they are placed before a word beginning with Sheva, as e .g., in לִמְלָכִים for kings, לִרְגָלִים, for festivals, (quoted from Mishnah Rosh Hashanah 1:1) it is necessary to state for which kings or festivals, and if he does not state this, all kings and festivals are implied by these words. Similarly here: the word לַאלֹהִים “to gods”, would imply “all gods”, including even Him of Whom the term אלהים is used in a holy sense (i. e. the Most High God). When, however, it (the prefix) is vowelled with Patach (or Kametz if the following letter cannot take Dagesh), as לַמֶּלֶךְ and לַמִּדְבָּר and לָעִיר it is quite plain which king one is speaking of, and similarly in the case of לָעִיר “to the city”, it is quite plain of which city one is speaking. In the same way, לָאֱלֹהִים, to the gods, means to those gods which in another passage you have been forbidden to worship. A similar instance is, (Psalms 86:8) אין כמוך בָאֱלֹהִים, “there is none like unto Thee among the gods” — because he did not more closely define it by the addition of some word like אחרים, it was necessary for him to vowel the ל with Patach (Kametz).<br><br>יחרם means SHALL BE PUT TO DEATH — Why is this verse with its predicate יחרם said at all? Was not the death penalty for him (the idolator) stated in another passage: (Deuteronomy 17:5) “Thou shalt bring forth that man or that woman [who have done that evil thing … and stone them]”? But the reason is: because Scripture does not specify there for what form of worship he (the idolator) is liable to death and it merely states, “and hath gone and served other gods” — now, in order that you might not say that any kind of worship offered to idols is punishable with death, Scripture comes and definitely tells you here: “one who sacrificeth unto any god [shall surely be put to death]”, to teach you that all kinds of worship which have a certain characteristic of “sacrifice” are meant here. What is this characteristic of sacrifice? It is an act of worship performed in honour of the Lord in the “Interior” (i. e. in the Temple)! So I mean to include as punishable by death anyone offering incense and libation since these are also acts of worship performed in the Temple, and that one is liable for these acts if he performed them in honour of any idol, whether this be the usual way of worshipping it or whether this be not the usual way of worshipping it. But other forms of adoration which are shown to some idols but which are not peculiar to the worship of the idol which one happens to be worshipping, — if, e. g., one sweeps the place before the idol in its honour, or one lays the dust in front of it by sprinkling water there, or one embraces or kisses it, — are not punishable by death (cf. Sanhedrin 60b)."}, {"ch": 22, "v": 20, "aliyah": 3, "heb": "וְגֵ֥ר לֹא־תוֹנֶ֖ה וְלֹ֣א תִלְחָצֶ֑נּוּ כִּֽי־גֵרִ֥ים הֱיִיתֶ֖ם בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְגִיוֹרָא לָא תוֹנוּן וְלָא תְעִיקוּן לֵהּ אֲרֵי דַיָרִין הֱוֵיתוּן בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "You must not abuse or oppress a stranger, for you were strangers in the land of Egypt.", "pj": "וְגִיּוֹרָא לָא תְקַנְטוּן בְּמִילִין וְלָא תְעִיקוּן לְמִיסַב לֵיהּ נִכְסוֹי עַמִּי בְנֵי יִשְרָאֵל הֲווֹ דְכִירִין אֲרוּם דַּיְירִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרָיִם", "pj_en": "And the stranger you shall not vex with words, nor distress him by taking his goods: Remember, sons of Israel, My people, that you were strangers in the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>וגר לא תונה.<\/b> אוֹנָאַת דְּבָרִים, קונטרארי\"ר בְּלַעַז, כְּמוֹ וְהַאֲכַלְתִּי אֶת מוֹנַיִךְ אֶת בְּשָׂרָם (ישעיהו מ\"ט):<br><br><b>ולא תלחצנו.<\/b> בִּגְזֵלַת מָמוֹן:<br><br><b>כי גרים הייתם.<\/b> אִם הוֹנִיתוֹ, אַף הוּא יָכוֹל לְהוֹנוֹתְךָ וְלוֹמַר לְךָ, אַף אַתָּה מִגֵּרִים בָּאתָ, \"מוּם שֶׁבְּךָ אַל תֹּאמַר לַחֲבֵרְךָ\"; כָּל לְשׁוֹן גֵּר אָדָם שֶׁלֹּא נוֹלַד בְּאוֹתָהּ מְדִינָה, אֶלָּא בָּא מִמְּדִינָה אַחֶרֶת לָגוּר שָׁם:", "rashi_en": "וגר לא תונה — means, do not vex him with words (referring to the fact that he is a stranger); contrarier in old French Similar is, (Isaiah 49:26) “And I will feed them that vex thee (מוניך) with their own flesh”.<br><br>ולא תלחצנו NOR OPPRESS HIM — by robbing him of money (Mekhilta).<br><br>כי גרים הייתם FOR YE WERE STRANGERS — If you vex him he can vex you also by saying to you: “You also descend from strangers”. Do not reproach thy fellow-man for a fault which is also thine (Mekhilta). Wherever גר occurs in Scriptures it signifies a person who has not been born in that land (where he is living) but has come from another country to sojourn there."}, {"ch": 22, "v": 21, "aliyah": 3, "heb": "כׇּל־אַלְמָנָ֥ה וְיָת֖וֹם לֹ֥א תְעַנּֽוּן׃", "onk": "כָּל אַרְמְלָא וְיִתָּם לָא תְעַנוּן:", "onk_en": "You must not mistreat any widow or orphan.", "pj": "כָּל אַרְמְלָא וְיָתוֹם לָא תְסַגְפוּן", "pj_en": "You shall not impoverish the widow or the orphan.", "tj": "", "tj_en": "", "rashi": "<b>כל אלמנה ויתום לא תענון.<\/b> הוּא הַדִּין לְכָל אָדָם, אֶלָּא שֶׁדִּבֵּר הַכָּתוּב בַּהוֹוֶה, לְפִי שֶׁהֵם תְּשׁוּשֵׁי כֹחַ וְדָבָר מָצוּי לְעַנּוֹתָם (מכילתא):", "rashi_en": "כל אלמנה ויתום לא תענון YOU SHALL NOT AFFLICT ANY WIDOW, OR FATHERLESS CHILD — That is also the law regarding any person, but Scripture is speaking of what usually happens and therefore mentions these in particular, for they are feeble in defensive power (i. e. they have no one to protect them) and it is a frequent occurrence for people to afflict them (Mekhilta)."}, {"ch": 22, "v": 22, "aliyah": 3, "heb": "אִם־עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑וֹ כִּ֣י אִם־צָעֹ֤ק יִצְעַק֙ אֵלַ֔י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽוֹ׃", "onk": "אִם עַנָאָה תְעַנֵי יָתֵהּ אֲרֵי אִם מִקְבַל יִקְבֵל <b>קֳדָמַי קַבָּלָא אֱקַבֵּל<\/b> קְבִלְתֵּהּ:", "onk_en": "If you do mistreat him [them], when he cries out to [<b>before<\/b>] Me, I will indeed hear [<b>obey<\/b>] his cry.", "pj": "אִין סַגָּפָא תְסַגֵּף יָתֵיהּ אִזְדַהֲרוּן לְכוֹן אֲרוּם אִין יְקוּם וְיִצְוַוח עֲלֵיכוֹן בִּצְלוֹי קֳדָמַי שְׁמַע אֲנָא בְּקַל צְלוֹתֵיהּ וּפָרַע לֵיהּ", "pj_en": "If thou impoverish her, beware; for if they rise up and cry against you in prayer before Me, I will hear the voice of their prayer, and will avenge them,", "tj": "", "tj_en": "", "rashi": "<b>אם ענה תענה אתו.<\/b> הֲרֵי זֶה מִקְרָא קָצָר, גָּזַם וְלֹא פֵּרֵשׁ עָנְשׁוֹ, כְּמוֹ לָכֵן כָּל הֹרֵג קַיִן (בראשית ד'), גָּזַם וְלֹא פֵּרֵשׁ עָנְשׁוֹ, אַף כָּאן אִם עַנֵּה תְעַנֵּה אוֹתוֹ לְשׁוֹן גִּזּוּם, כְּלוֹמַר סוֹפְךָ לִטֹּל אֶת שֶׁלְּךָ לָמָּה? כִּי אִם צָעֹק יִצְעַק אֵלַי וְגוֹ':", "rashi_en": "אם ענה תענה אתו IF THOU AFFLICT THEM IN ANY WISE — This is an elliptical phrase — the text threatens but breaks off and does not specify immediately the punishment which will fall upon those who do this. We have the same in, (Genesis 4:15) “Therefore whosoever slayeth Cain …” it threatens but does not specify the punishment. So, here, too: “If thou afflict them in any wise”, — this is a threat, as much as to say: “in the end you will get your deserts!” Why are you certain to get them? “Because (כי) if (אם) they cry at all unto Me, I will surely hear their cry”."}, {"ch": 22, "v": 23, "aliyah": 3, "heb": "וְחָרָ֣ה אַפִּ֔י וְהָרַגְתִּ֥י אֶתְכֶ֖ם בֶּחָ֑רֶב וְהָי֤וּ נְשֵׁיכֶם֙ אַלְמָנ֔וֹת וּבְנֵיכֶ֖ם יְתֹמִֽים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיִתְקֵף רוּגְזִי וְאֶקְטוֹל יָתְכוֹן בְּחַרְבָּא וִיהֶוְיָן נְשֵׁיכוֹן אַרְמְלִין וּבְנֵיכוֹן יַתְמִין:", "onk_en": "Then I will cause My anger to flare, and I will kill you by the sword. Your wives will become widows and your children will be orphans.", "pj": "וְיִתְקַף רוּגְזִי וְאֶקְטוֹל יַתְכוֹן בְּחַרְבָּא דְמוֹתָא וִיהוֹן נְשֵׁיכוֹן אַרְמְלָן וּבְנֵיכוֹן יַתְמִין", "pj_en": "and My anger will be kindled, and I will slay you with the sword, and your wives shall be widows, and your children be orphans.", "tj": "", "tj_en": "", "rashi": "<b>והיו נשיכם אלמנות.<\/b> מִמַּשְׁמָע שֶׁנֶּאֱמַר וְהָרַגְתִּי אֶתְכֶם אֵינִי יוֹדֵעַ שֶׁנְּשֵׁיכֶם אַלְמָנוֹת וּבְנֵיכֶם יְתוֹמִים? אֶלָּא הֲרֵי זוֹ קְלָלָה אַחֶרֶת, שֶׁיִּהְיוּ הַנָּשִׁים צְרוּרוֹת כְּאַלְמָנוֹת חַיּוֹת, שֶׁלֹּא יִהְיוּ עֵדִים לְמִיתַת בַּעְלֵיהֶן וְתִהְיֶינָה אֲסוּרוֹת לְהִנָּשֵׂא, וְהַבָּנִים יִהְיוּ יְתוֹמִים, שֶׁלֹּא יַנִּיחוּם בֵּית דִּין לֵירֵד לְנִכְסֵי אֲבִיהֶם, לְפִי שֶׁאֵין יוֹדְעִים אִם מֵתוּ אִם נִשְׁבּוּ (בבא מציעא ל\"ח):", "rashi_en": "והיו נשיכם אלמנות AND YOUR WIVES SHALL BE WIDOWS [AND YOUR CHILDREN FATHERLESS] — From what is implied in the words, “I will kill you with the sword” do I not know that “your wives shall be widows and your children orphans”? But the explanation of the latter words is not that implied by your question; it is quite a different curse: that the wives will be “fettered” for life — “as living widows” (Rashi is imitating a Biblical phrase, II Samuel 20:3, used in a somewhat similar sense) — that there will be no witnesses who can testify to the death of their husbands, and so they will be forbidden to re-marry. In which case the children will be destitute orphans, for the court will not allow them to take possession of the chattels of their fathers, since they do not know whether they have died or have only been taken captives (Mekhilta; Bava Metzia 38b)."}, {"ch": 22, "v": 24, "aliyah": 3, "heb": "אִם־כֶּ֣סֶף&thinsp;<b>׀<\/b> תַּלְוֶ֣ה אֶת־עַמִּ֗י אֶת־הֶֽעָנִי֙ עִמָּ֔ךְ לֹא־תִהְיֶ֥ה ל֖וֹ כְּנֹשֶׁ֑ה לֹֽא־תְשִׂימ֥וּן עָלָ֖יו נֶֽשֶׁךְ׃", "onk": "אִם כַּסְפָּא תּוֹזֵף בְּעַמִי לְעַנְיָא דִי עִמָךְ לָא תְהֵי לֵהּ כְּרַשְׁיָא לָא תְשַׁוּוֹן עֲלוֹהִי <b>חִבּוּלְיָא<\/b>:", "onk_en": "When you lend money to My people, to the poor person who is with [among] you, do not act toward him as a [demanding] creditor. Do not place the burden of interest [<b>an injury<\/b>] upon him.", "pj": "אִין כַּסְפָּא תּוֹזִיף לְעַמִּי יַת עַנְיָיא דְעִמָּךְ לָא תְהֵי לֵיהּ הֵי כְּרַשְׁיָא לָא תְשַׁוּוּן דְּלֶהֱוֵי עֲלוֹי סַהֲדִין וּמִידִי עַרְבְנוּתָא לָא עַל שְׁעָרִין וְלָא רִיבְיָין", "pj_en": "If thou lend money to (one of) My people, to (one of) the humble of My people, thou shalt not be to him as an usurer, neither lay it upon him that there shall be witnesses against him, or that he give pledges, or equivalents, or usury.", "tj": "אִם כַּסְפָּא תּוּזְפוּן לְעַמִּי יַת מַסְכֵּינָא דְעִימְכוֹן לָא תְהַוֵון לֵיהּ מָרֵי חוֹב דָּחִיק לָא תְשַׁווּן עֲלוֹי לָא שָׁעֲרִין וְלָא רַבְיָיא:", "tj_en": "If thou lend money to My people, to the poor of your people, you shall not be to him an oppressive creditor, or lay upon him either equivalents or usury.", "rashi": "<b>אם כסף תלוה את עמי.<\/b> רַבִּי יִשְׁמָעֵאל אוֹמֵר כָּל אִם וְאִם שֶׁבַּתּוֹרָה רְשׁוּת חוּץ מִשְּׁלֹשָׁה, וְזֶה אֶחָד מֵהֶן (מכילתא):<br><br><b>את עמי.<\/b> עַמִּי וְגוֹי עַמִּי קוֹדֵם, עָנִי וְעָשִׁיר עָנִי קוֹדֵם, עֲנִיֶּיךָ וַעֲנִיֵּי עִירְךָ עֲנִיֶּיךָ קוֹדְמִין, עֲנִיֵּי עִירְךָ וַעֲנִיֵּי עִיר אַחֶרֶת עֲנִיֵּי עִירְךָ קוֹדְמִין; וְזֶה מַשְׁמָעוֹ: אִם כֶּסֶף תַּלְוֶה – אֶת עַמִּי תַּלְוֵהוּ וְלֹא לְגוֹי, וּלְאֵיזֶה מֵעַמִּי? אֶת הֶעָנִי, וּלְאֵיזֶה עָנִי? לְאוֹתוֹ שֶׁעִמָּךְ. (דָּ\"אַ, אֶת עַמִּי, שֶׁלֹּא תִנְהַג בּוֹ בִּזָּיוֹן בְּהַלְוָאָה שֶׁהוּא עַמִּי:<br><br><b>את העני עמך.<\/b> הֱוֵי מִסְתַּכֵּל בְּעַצְמְךָ כְּאִלּוּ אַתָּה עָנִי:<br><br><b>לא תהיה לו כנשה.<\/b> לֹא תִתְבָּעֶנּוּ בְּחָזְקָה. אִם אַתָּה יוֹדֵעַ שֶׁאֵין לוֹ, אַל תְּהִי דּוֹמֶה עָלָיו כְּאִלּוּ הִלְוִיתוֹ אֶלָּא כְאִלּוּ לֹא הִלְוִיתוֹ, כְּלוֹמַר לֹא תַכְלִימֵהוּ:<br><br><b>נשך.<\/b> רִבִּית, שֶׁהוּא כִנְשִׁיכַת נָחָשׁ שֶׁנוֹשֵׁךְ חַבּוּרָה קְטַנָּה בְּרַגְלוֹ וְאֵינוֹ מַרְגִּישׁ, וּפִתְאֹם הוּא מְבַטְבֵּט וְנוֹפֵחַ עַד קָדְקֳדוֹ, כָּךְ רִבִּית אֵינוֹ מַרְגִּישׁ וְאֵינוֹ נִכָּר עַד שֶׁהָרִבִּית עוֹלָה וּמְחַסְּרוֹ מָמוֹן הַרְבֵּה (תנחומא):", "rashi_en": "אם כסף תלוה את עמי IF THOU LEND MONEY TO ANY OF MY PEOPLE — R. Yishmael said: wherever אם occurs in Scripture it is used of an act the performance of which is optional, except in three instances, of which this is one (Mekhilta; cf. Rashi on Exodus 20:22 - the translation therefore is: “When thou lendeth etc.”).<br><br>את עמי TO ANY OF MY PEOPLE — If thou hast to choose between lending money to My people and a heathen, My people come first; if between a poor man and one who is better off, the poor man comes first; if between thine own poor (poor relatives) and other poor of thy city, thine own poor come first; if between the poor of thine own city and the poor of another city, the poor of thine own city come first (Mekhilta; Bava Metzia 71a). And this is how the above explanation is implied in the text: “If thou lend money” — את עמי “lend it to My people”, and not to a heathen; and to which one of My people? את העני, to the poor; and to which poor? עמך to him that is with thee (i. e. who is with thee in relationship and is with thee in thy city). [Another explanation of את עמי is: Thou shalt not treat him disrespectfully when lending him money, for he is עמי — though in need he is still “My people”!<br><br>את העני עמך Look at thyself as though thou art the poor man (Midrash Tanchuma 6:15)].<br><br>לא תהיה לו כנשה THOU SHALT NOT BE UNTO HIM AS AN EXACTOR — you shall not demand the debt of him forcibly. The comparative כ of כנשה suggests thou shalt not be like a נשה: if you know that he has no money do not appear in your attitude towards him as though you had lent him, but as though you had not lent him — it means as much as, do not humble him.<br><br>נשך is what is called in Rabbinical Hebrew רבית (from רבה to increase). It is called נשך “biting”, because it resembles the bite of a snake: it bites, inflicting a small wound in a person’s foot which he does not feel at first, but all at once it swells and distends the whole body up to the top of his head. So it is with interest: at first one does not feel the drain it makes on him and it remains unnoticed until the interest mounts up and suddenly makes the person lose a big fortune (Exodus Rabbah 31:6)."}, {"ch": 22, "v": 25, "aliyah": 3, "heb": "אִם־חָבֹ֥ל תַּחְבֹּ֖ל שַׂלְמַ֣ת רֵעֶ֑ךָ עַד־בֹּ֥א הַשֶּׁ֖מֶשׁ תְּשִׁיבֶ֥נּוּ לֽוֹ׃", "onk": "אִם מַשְׁכּוֹנָא תִסַב כְּסוּתָא דְחַבְרָךְ עַד מֵעַל שִׁמְשָׁא תְּתִיבִנֵהּ לֵהּ:", "onk_en": "If you take your neighbor’s garment as security, you must return it to him till sunset;", "pj": "אִין מְמַשְׁכְּנָא תְמַשְׁכַּן כְּסוּתָא דְחַבְרָךְ עַד לָא יִטְמוֹעַ שִׁמְשָׁא תְּתָבִינֵיהּ לֵיהּ", "pj_en": "If thou take (at all) for a pledge the garment of thy neighbour, thou shalt restore it to him before sunset;", "tj": "", "tj_en": "", "rashi": "<b>אם חבל תחבל.<\/b> כָּל לְשׁוֹן חֲבָלָה אֵינוֹ מַשְׁכּוֹן בִּשְׁעַת הַלְוָאָה, אֶלָּא שֶׁמְּמַשְׁכְּנִין אֶת הַלֹּוֶה כְּשֶׁמַּגִּיעַ הַזְּמַן וְאֵינוֹ פוֹרֵעַ; (חָבֹל תַּחְבֹּל – כְּפֹל לְךָ בַּחֲבָלָה עַד כַּמָּה פְעָמִים; אָמַר הַקָּבָּ\"ה כַּמָּה אַתָּה חַיָּב לִי, וַהֲרֵי נַפְשְׁךָ עוֹלָה אֶצְלִי כָּל אֶמֶשׁ וָאֶמֶשׁ וְנוֹתֶנֶת דִּין וּמִתְחַיֶּבֶת לְפָנַי וַאֲנִי מַחֲזִירָהּ לְךָ, אַף אַתָּה טֹל וְהָשֵׁב טֹל וְהָשֵׁב):<br><br><b>עד בא השמש תשיבנו לו.<\/b> כָּל הַיּוֹם תְּשִׁיבֶנּוּ לוֹ עַד בֹּא הַשֶּׁמֶשׁ, וּכְבֹא הַשֶּׁמֶשׁ תַּחֲזֹר וְתִטְּלֶנּוּ עַד שֶׁיָּבֹא בֹּקֶר שֶׁל מָחָר; וּבִכְסוּת יוֹם הַכָּתוּב מְדַבֵּר, שֶׁאֵין צָרִיךְ לָהּ בַּלַּיְלָה (מכילתא, בבא מציעא קי\"ד):", "rashi_en": "אם חבל תחבל IF THOU TAKE TO PLEDGE — The root חבל never signifies “taking a pledge” at the time when the loan is transacted, but it means taking the goods of the debtor when the date of payment arrives and he does not pay (Bava Metzia 114b). [חבל תחבל — Scripture bids you take the pledge repeatedly — even many times (that is, repeatedly to defer the time of payment). The Holy One, blessed be He, says as it were: “How much do you owe Me! See, your soul ascends night by night to Me and renders account of its doing and so becomes My debtor, and should be kept as a pledge; and yet I return it to you every morning. Thus, too, you should do: take the pledge and restore it, take it again and again restore it!”) (Midrash Tanchuma, Mishpatim 16)].<br><br>עד בא השמש תשיבנו לו RESTORE IT UNTO HIM TILL THE GOING DOWN OF THE SUN — Restore it unto him for the whole day until the sun-set, and at night-fall you may take it again till the day-break of the next morning. Scripture speaks here of garment which is worn during the day and which is not required during the night (Bava Metzia 114b)."}, {"ch": 22, "v": 26, "aliyah": 3, "heb": "כִּ֣י הִ֤וא <span class=\"mam-kq-trivial\">כְסוּתֹה֙<\/span> לְבַדָּ֔הּ הִ֥וא שִׂמְלָת֖וֹ לְעֹר֑וֹ בַּמֶּ֣ה יִשְׁכָּ֔ב וְהָיָה֙ כִּֽי־יִצְעַ֣ק אֵלַ֔י וְשָׁמַעְתִּ֖י כִּֽי־חַנּ֥וּן אָֽנִי׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי הִיא כְסוּתֵהּ בִּלְחוֹדַהּ הִיא תוֹתְבֵהּ לְמַשְׁכֵּיהּ בְּמָא יִשְׁכּוּב וִיהֵי אֲרֵי יִקְבֵל <b>קֳדָמַי וֶאֱקַבֵּל<\/b> קְבִלְתֵּהּ אֲרֵי חַנָנָא אֲנָא:", "onk_en": "For this alone is his covering, the garment [to cover] his skin. With what shall he lie down [to sleep]? If it happens that he cries out to [<b>before<\/b>] Me, I will hear [<b>obey<\/b>] [his cry] for I am gracious.", "pj": "אֲרוּם הִיא טָלֵית דְּמִתְכַּסֵּי בָהּ בִּלְחוֹדָהּ הִיא תּוֹתְבֵיהּ דְּנַפְלָא לְמוֹשְׁכֵיהּ וְאִין תִּיסַב מַצַּע עַרְסֵיהּ בַּמֶּה יִשְׁכּוּב וִיהֵי אִין יִקְבּוֹל קֳדָמַי וַאֲקַבֵּיל צְלוֹתֵיהּ אֲרוּם אֱלָהָא חֲנָנָא אֲנָא", "pj_en": "for it may be his taleth which alone covereth him; (or) it is his only garment in which he rests, which falleth upon his skin; and if thou take the coverlet of the bed whereon he lies, and he be heard before Me, I will hearken to his prayer; for I am Eloah the Merciful.", "tj": "", "tj_en": "", "rashi": "<b>כי הוא כסותה.<\/b> זוֹ טַלִּית:<br><br><b>שמלתו.<\/b> זֶה חָלוּק:<br><br><b>במה ישכב.<\/b> לְרַבּוֹת אֶת הַמַּצָּע (מכילתא):", "rashi_en": "כי הוא כסותה FOR THAT IS HIS RAIMENT — i. e. his upper garment;<br><br>שמלתו means HIS SHIRT (the שמלה for the skin);<br><br>במה ישכב WHEREIN SHALL HE LIE DOWN — These words are used to include amongst the articles which must be returned to him during the day the couch and its coverings on which he rests during day-time (Mekhilta)."}, {"ch": 22, "v": 27, "aliyah": 4, "heb": "אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְנָשִׂ֥יא בְעַמְּךָ֖ לֹ֥א תָאֹֽר׃", "onk": "דַיָנָא לָא תְקִיל וְרַבָּא בְעַמָךְ לָא תְלוּט:", "onk_en": "Do not curse judges. Do not curse a leader of your people.", "pj": "עַמִּי בְנֵי יִשְרָאֵל דַּיָּינֵיכוֹן לָא תְקִילִין וְרַבָּנִין דִּמִתְמַנִין נְגוֹדִין בְּעַמָּךְ לָא תְלוּטִין", "pj_en": "Sons of Israel My people, ye shall not revile your judges, nor curse the rabbans who are appointed rulers among thy people.", "tj": "", "tj_en": "", "rashi": "<b>אלהים לא תקלל.<\/b> הֲרֵי זוֹ אַזְהָרָה לְבִרְכַּת הַשֵּׁם וְאַזְהָרָה לְקִלְלַת דַּיָּן (סנהדרין ס\"ו):", "rashi_en": "אלהים לא תקלל THOU SHALT NOT EXECRATE GOD — Here you have the prohibition of blasphemy (the penalty being stated in Leviticus 24:16) and the prohibition of cursing a judge (who is also termed אלהים, cf. Exodus 22:7) (cf. (Mekhilta and Sanhedrin 66a)."}, {"ch": 22, "v": 28, "aliyah": 4, "heb": "מְלֵאָתְךָ֥ וְדִמְעֲךָ֖ לֹ֣א תְאַחֵ֑ר בְּכ֥וֹר בָּנֶ֖יךָ תִּתֶּן־לִֽי׃", "onk": "בִּכּוּרָךְ וְדִמְעָךְ לָא תְאַחֵר בּוּכְרָא דִבְנָיךְ <b>תַּפְרֵשׁ<\/b> קֳדָמָי:", "onk_en": "[Your offering of] the fullness [of your newly ripened produce] and of your terumah-offering’s you must not delay. The first-born of your sons, you shall give to [<b>separate before<\/b>] Me.", "pj": "בִּכּוּרֵי פֵּירָךְ וּבִכּוּרֵי חֲמַר נַעֲוָוךְ לָא תַשְׁהֵי עַל זִמָנֵיהוֹן מִן לְאַסְקוּתְהוֹן לַאֲתַר שְׁכִינְתִּי בּוּכְרֵי דִבְרָךְ תַּפְרֵישׁ קֳדָמַי", "pj_en": "The firsts of thy fruits, and the firsts of thy wine-press, thou shalt not delay to bring up in their time to the place of My habitation. The firstlings of thy males thou shalt separate before Me.", "tj": "", "tj_en": "", "rashi": "<b>מלאתך.<\/b> חוֹבָה הַמֻּטֶּלֶת עָלֶיךָ כְּשֶׁתִּתְמַלֵּא תְבוּאָתְךָ לְהִתְבַּשֵּׁל, וְהֵם בִּכּוּרִים:<br><br><b>ודמעך.<\/b> הַתְּרוּמָה – וְאֵינִי יוֹדֵעַ מַהוּ לְשׁוֹן דֶּמַע.<br><br><b>לא תאחר.<\/b> לֹא תְשַׁנֶּה סֵדֶר הַפְרָשָׁתָן לְאַחֵר אֶת הַמֻּקְדָּם וּלְהַקְדִּים אֶת הַמְאֻחָר, שֶׁלֹּא יַקְדִּים תְּרוּמָה לְבִכּוּרִים וּמַעֲשֵׂר לִתְרוּמָה (מכילתא):<br><br><b>בכור בניך תתן לי.<\/b> לִפְדּוֹתוֹ בְחָמֵשׁ סְלָעִים מִן הַכֹּהֵן; וַהֲלֹא כְּבָר צִוָּה עָלָיו בְּמָקוֹם אַחֵר? אֶלָּא כְּדֵי לִסְמֹךְ לוֹ כֵּן תַּעֲשֶׂה לְשֹׁרְךָ – מַה בְּכוֹר אָדָם לְאַחַר שְׁלֹשִׁים יוֹם פּוֹדֵהוּ, שֶׁנֶּאֱמַר וּפְדוּיָו מִבֶּן חֹדֶשׁ תִּפְדֶה (במדבר י\"ח), אַף בְּכוֹר בְּהֵמָה דַּקָּה מְטַפֵּל בּוֹ שְׁלֹשִׁים יוֹם וְאַחַ\"כָּ נוֹתְנוֹ לַכֹּהֵן (בכורות כ\"ו):", "rashi_en": "מלאתך [THOU SHALT NOT DELAY TO OFFER FROM] THY FULLNESS — The duty which falls upon you as soon as your crop becomes fully ripened: this refers to the first fruits (בכורים).<br><br>ודמעך means THE HEAVE OFFERING, — thus do our Rabbis explain it (cf. Mekhilta), but I do not know what the expression דמע means (i. e. I do not know how it comes to have the meaning of (תרומה).<br><br>לא תאחר THOU SHALT NOT DELAY — i. e. thou shalt not alter the prescribed sequence of separating them from the crops, setting aside last what should be first and setting aside first what should be last — i. e. that one should not set aside the heave-offering before the first fruit nor the tithe before the heave-offering (Mekhilta).<br><br>בכור בניך תתן לי THE FIRST BORN OF THY SONS SHALT THOU GIVE UNTO ME — by redeeming him from the priest by the payment of five Sela’im. Scripture, it is true, has already given an ordinance concerning him (the firstborn) in another passage (Numbers 18:16), but it is stated here again in order to bring it into juxtaposition with the next verse: “Likewise shalt thou do with that of thine ox”, and to illustrate the latter command by the former. How is it in the case of a human being? He (the father) redeems it after thirty days, for it is said, (Numbers 18:16) “and those that are to be redeemed, from a month old shalt thou redeem”! So, too, has the owner of small cattle to look after it for 30 days and only afterwards must he give it to the priest (cf. Mekhilta and Bekhorot 26b)."}, {"ch": 22, "v": 29, "aliyah": 4, "heb": "כֵּֽן־תַּעֲשֶׂ֥ה לְשֹׁרְךָ֖ לְצֹאנֶ֑ךָ שִׁבְעַ֤ת יָמִים֙ יִהְיֶ֣ה עִם־אִמּ֔וֹ בַּיּ֥וֹם הַשְּׁמִינִ֖י תִּתְּנוֹ־לִֽי׃", "onk": "כֵּן תַּעְבֵּד לְתוֹרָךְ לְעָנָךְ שִׁבְעָא יוֹמִין יְהֵי עִם אִמֵהּ בְּיוֹמָא תְמִינָאָה <b>תִּפְרְשִׁנֵהּ<\/b> קֳדָמָי:", "onk_en": "You must do likewise with your oxen and with your sheep. Seven days it shall remain with its mother. On the eighth day you must give it to [<b>separate it before<\/b>] Me.", "pj": "הֵיכְדֵין תַּעֲבֵד לְבוּכְרֵי תוֹרָךְ וְעָנָךְ שַׁבְעָא יוֹמִין יְהֵי יֵינִיק בָּתַר אִימֵיהּ וּבְיוֹמָא תְּמִינָאָה תַּפְרִישִׁינֵיהּ קֳדָמַי", "pj_en": "So shalt thou do with the firstlings of thy oxen and sheep; seven days it shall be suckled by its mother, and on the eighth day thou shalt separate it before Me.", "tj": "", "tj_en": "", "rashi": "<b>שבעת ימים יהיה עם אמו.<\/b> זוֹ אַזְהָרָה לַכֹּהֵן, שֶׁאִם בָּא לְמַהֵר אֶת קָרְבָּנוֹ לֹא יְמַהֵר קֹדֶם שְׁמֹנָה, לְפִי שֶׁהוּא מְחֻסַּר זְמַן:<br><br><b>ביום השמיני תתנו לי.<\/b> יָכוֹל יְהֵא חוֹבָה לְבוֹ בַיּוֹם, נֶאֱמַר כָּאן שְׁמִינִי וְנֶאֱמַר לְהַלָּן וּמִיּוֹם הַשְּׁמִינִי וָהָלְאָה יֵרָצֶה (ויקרא כ\"ב), מַה שְּׁמִינִי הָאָמוּר לְהַלָּן לְהַכְשִׁיר מִשְּׁמִינִי וּלְהַלָּן, אַף שְׁמִינִי הָאָמוּר כָּאן לְהַכְשִׁיר מִשְּׁמִינִי וּלְהַלָּן; וְכֵן מַשְׁמָעוֹ: וּבַיּוֹם הַשְּׁמִינִי אַתָּה רַשַּׁאי לִתְּנוֹ לִי (מכילתא):", "rashi_en": "שבעת ימים יהיה עם אמו SEVEN DAYS IT SHALL BE WITH ITS DAM — This is an admonition for the priest (for the Israelite himself does not sacrifice the firstborn animal) that if he wishes to bring his offering of this at an earlier date (i.e. in the case of the Israelite having given it to him before the thirtieth or fiftieth day) he is not allowed to offer it before it is eight days old because it is then “short in time” (i. e. too young for sacrifice; cf. Leviticus 22:27).<br><br>ביום השמיני תתנו לי ON THE EIGHTH DAY THOU SHALT GIVE IT ME — One might think that it is obligatory to offer it on that day! Scripture, however, uses here the words “eighth day” and uses them again later on, (Leviticus 22:27) “and from the eighth day and henceforth it shall be favourably accepted”, in order to suggest an analogy. Now what is the meaning of the “eighth day” mentioned in the latter passage? It intends to declare the first-born fit for sacrifice from the eighth day and henceforth (i. e. it is intended to fix the earliest possible time on which it may be sacrificed). This, too, in the purpose of the word שמיני used here: to declare it fit for sacrifice from the eighth day and henceforth. The text therefore implies: “on the eighth day thou mayest give it to Me” (and not “thou shalt give it to Me”) (Mekhilta)."}, {"ch": 22, "v": 30, "aliyah": 4, "heb": "וְאַנְשֵׁי־קֹ֖דֶשׁ תִּהְי֣וּן לִ֑י וּבָשָׂ֨ר בַּשָּׂדֶ֤ה טְרֵפָה֙ לֹ֣א תֹאכֵ֔לוּ לַכֶּ֖לֶב תַּשְׁלִכ֥וּן אֹתֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וֶאֱנָשִׁין קַדִישִׁין תְּהוֹן <b>קֳדָמָי<\/b> וּבְשַׂר תְּלִישׁ <b>מִן חֵיוָא חַיְתָא<\/b> לָא תֵיכְלוּן לְכַלְבָּא תִּרְמוּן יָתֵהּ:", "onk_en": "You shall be men of holiness to [<b>before<\/b>] Me, and you must not eat flesh that was torn off in the field [<b>from a living animal<\/b>]. Throw it to the dog.", "pj": "וְאַנְשִׁין קַדִּישִׁין טְעָמִין חוּלִין בִּדְכוּתָא תְּהוֹן קֳדָמַי בְּרַם בְּשַר תְּלִישׁ מִן חֵיוָותָא חַיָיא לָא תֵיכְלוּן לְכַלְבָּא תֵירְמוּן יָתֵיהּ בְּסִיטְרֵיהּ", "pj_en": "And holy men, tasting unconsecrated things innocently, shall you be before Me; but flesh torn by wild beasts alive you may not eat, but throw it to the dog as his portion.", "tj": "", "tj_en": "", "rashi": "<b>ואנשי קדש תהיון לי.<\/b> אִם אַתֶּם קְדוֹשִׁים וּפְרוּשִׁים מִשִּׁקּוּצֵי נְבֵלוֹת וּטְרֵפוֹת הֲרֵי אַתֶּם שֶׁלִּי וְאִם לָאו אֵינְכֶם שֶׁלִּי:<br><br><b>ובשר בשדה טרפה.<\/b> אַף בַּבַּיִת כֵּן, אֶלָּא שֶׁדִּבֵּר הַכָּתוּב בַּהוֹוֶה – מָקוֹם שֶׁדֶּרֶךְ בְּהֵמוֹת לִטָּרֵף; וְכֵן כִּי בַשָּׂדֶה מְצָאָהּ (דברים כ\"ב), וְכֵן אֲשֶׁר לֹא יִהְיֶה טָהוֹר מִקְּרֵה לָיְלָה (שם כ\"ג), הוּא הַדִּין לְמִקְרֵה יוֹם, אֶלָּא שֶׁדִּבֵּר הַכָּתוּב בַּהוֹוֶה. וּבְשַׂר דִּתְלִישׁ מִן חֵיוָא חַיָּא, בָּשָׂר שֶׁנִּתְלַשׁ עַ\"יְ טְרֵפַת זְאֵב אוֹ אֲרִי מִן חַיָּה כְשֵׁרָה אוֹ מִבְּהֵמָה כְשֵׁרָה בְּחַיֶּיהָ:<br><br><b>לכלב תשלכון אתו.<\/b> אַף הַגּוֹי כַּכֶּלֶב; אוֹ אֵינוֹ אֶלָּא כֶּלֶב כְּמַשְׁמָעוֹ? תַּ\"לֹ בִּנְבֵלָה אוֹ מָכֹר לְנָכְרִי (שם י\"ד), קַ\"וָ לִטְרֵפָה שֶׁמֻּתֶּרֶת בְּכָל הֲנָאוֹת. אִם כֵּן מַה תַּ\"לֹ לַכֶּלֶב? לְלַמֶּדְךָ שֶׁהַכֶּלֶב נִכְבָּד מִמֶּנּוּ, וְלִמֶּדְךָ הַכָּתוּב שֶׁאֵין הַקָּבָּ\"ה מְקַפֵּחַ שְׂכַר כָּל בְּרִיָּה, שֶׁנֶּאֱמַר וּלְכָל בְּנֵי יִשְׂרָאֵל לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ (שמות י\"א), אָמַר הַקָּבָּ\"ה תְּנוּ לוֹ שְׂכָרוֹ (מכילתא):", "rashi_en": "ואנשי קדש תהיון לי AND YE SHALL BE MEN OF HOLINESS UNTO ME — If you will be holy and keep yourselves aloof from the loathsomeness of carrion and Trefa you are Mine, if not you are not Mine (cf. Mekhilta).<br><br>ובשר בשדה טרפה [NEITHER SHALL YE EAT] ANY FLESH THAT IS TORN IN THE FIELD – The same holds good in case the animal has been torn in the house, only that Scripture speaks of what usually happens mentioning the field because it is the place where it is usual for cattle to be torn. A similar instance is, (Deuteronomy 22:27) “for he found her in the field”, but the same law would apply if he found her elsewhere. Another example is, (Deuteronomy 23:11) “Any man that is unclean by reason of uncleanliness that chanceth him by night”; the same law, however, applies to an uncleanliness that happens by day, but night is mentioned because Scripture speaks of what usually happens (Mekhilta). The Targum renders ובשר בשדה טרפה by ובשר תליש מן חיוא חיא “flesh that is torn off from a living animal”, i. e. flesh that has been torn off through a laceration caused by a wolf or a lion, from a living beast which is permitted to be eaten (e. g., a stag), or from cattle permitted to be eaten.<br><br>לכלב תשלכון אתו YE SHALL CAST IT TO THE DOGS — You may give it to a heathen as well as to the dog. Or, perhaps this is not so, but כלב is to be taken literally? Scripture, however, states with regard to carrion, (Deuteronomy 14:21) “Thou shalt give it to a stranger or sell it unto an alien”, from which it follows by a conclusion à fortiori that you may derive whatever benefit you like from the Trefa (and so you also may give it to heathen). But if this be so, what is the force of Scripture expressly saying “to the dog”? It is to teach you that the dog is to be given preference in this respect and Scripture tells you at the same time that God does not withhold the reward due to any of His creatures. The dog is entitled to reward because it is stated, (Exodus 11:7) “But against the children of Israel shall not a dog move its tongue”, and this happened. The Holy One, blessed be He, said: Give it the reward it deserves (Mekhilta)."}, {"ch": 23, "v": 1, "aliyah": 4, "heb": "לֹ֥א תִשָּׂ֖א שֵׁ֣מַע שָׁ֑וְא אַל־תָּ֤שֶׁת יָֽדְךָ֙ עִם־רָשָׁ֔ע לִהְיֹ֖ת עֵ֥ד חָמָֽס׃", "onk": "לָא תְקַבֵּל שְׁמַע דִשְׁקָר לָא תְשַׁוִי יְדָךְ עִם חַיָבָא לְמֶהֱוֵי <b>לֵהּ<\/b> סָהִיד שְׁקָר:", "onk_en": "Do not accept a false report. Do not join hands with a wicked man to be a corrupt [false] witness [<b>for him<\/b>].", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תְקַבְּלוּן מִילֵי שִׁיקְרָא מִגַּבְרָא דְּיֵיכוּל קוֹרְצִין בְּחַבְרֵיהּ קֳדָמָךְ וְלָא תְשַׁוֵּי יְדָךְ עִם רַשִׁיעָא דִיהֵי סָהִיד שְׁקָר", "pj_en": "Sons of Israel My people, take not up lying words from a man who accuseth his neighbour before thee, nor put thine hand with the wicked to become a false witness.", "tj": "", "tj_en": "", "rashi": "<b>לא תשא שמע שוא.<\/b> כְּתַרְגּוּמוֹ, לָא תְקַבֵּל שְׁמַע דִשְׁקָר, אַזְהָרָה לִמְקַבֵּל לָשׁוֹן הָרָע וְלַדַּיָּן שֶׁלֹּא יִשְׁמַע דִּבְרֵי בַעַל דִּין עַד שֶׁיָּבֹא בַּעַל דִּין חֲבֵרוֹ (שם):<br><br><b>אל תשת ידך עם רשע.<\/b> הַטּוֹעֵן אֶת חֲבֵרוֹ תְּבִיעַת שֶׁקֶר, שֶׁתַּבְטִיחֵהוּ לִהְיוֹת לוֹ עֵד חָמָס:", "rashi_en": "לא תשא שמע שוא THOU SHALT NOT HEAR A FALSE REPORT — Take it as the Targum renders it: thou shalt not accept (listen to) a false report. This is a prohibition addressed to one who is about to accept a slanderous statement, and it is addressed also to a judge — that he should not hear the pleadings of one party to a suit before the other appears (Mekhilta; Sanhedrin 7b).<br><br>אל תשת ידך עם רשע SET NOT THINE HAND WITH THE WICKED — with him who makes a false claim against his fellow-man: that you promise him to give evidence for him that will result in wrong being done (להיות עד חמס).‎"}, {"ch": 23, "v": 2, "aliyah": 4, "heb": "לֹֽא־תִהְיֶ֥ה אַחֲרֵֽי־רַבִּ֖ים לְרָעֹ֑ת וְלֹא־תַעֲנֶ֣ה עַל־רִ֗ב לִנְטֹ֛ת אַחֲרֵ֥י רַבִּ֖ים לְהַטֹּֽת׃", "onk": "לָא תְהֵי בָּתַר סַגִיאִין לְאַבְאָשָׁא <b>וְלָא תִתְמְנַע מִלְאַלָפָא מָא דִבְעֵינָךְ עַל דִינָא<\/b> בָּתַר סַגִיאֵי שְׁלַם דִינָא:", "onk_en": "Do not follow the majority to do evil. Do not respond with your opinion in a dispute [merely] to lean [toward one side] [<b>(Do not) refrain from teaching what is proper in your eyes regarding a judgment<\/b>]. It must be decided by the majority.", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווֹן בָּתַר סַגִּיאִין לְמַבְאֲשָׁא אֱלָהֵן לִמְטַיְיבָא וְלָא יִתְמְנַע חַד מִנְכוֹן לְמַלְפָא זְכוּ עַל חַבְרֵיהּ בְּדִינָא לְמֵימַר הָא בָּתַר סַגִּיאֵי דִינָא סָטֵי", "pj_en": "Sons of Israel My people, you shall not go after the many to do evil, but to do good; and no one among you shall restrain himself from affirming justly concerning his neighbour in the judgment, by saying, Behold, the judgment sides with the many.", "tj": "", "tj_en": "Sons of Israel My people, you shall not go after the multitude to do evil, but to do good; and no one of you shall restrain himself from setting forth the just cause of his neighbour in the judgment, nor say in your heart, The judgment sides with the many.", "rashi": "<b>לא תהיה אחרי רבים לרעת.<\/b> יֵשׁ בְּמִקְרָא זֶה מִדְרְשֵׁי חַכְמֵי יִשְׂרָאֵל, אֲבָל אֵין לְשׁוֹן הַמִּקְרָא מְיֻשָּׁב בָּהֶן עַל אָפְנָיו. מִכָּאן דָּרְשׁוּ שֶׁאֵין מַטִּין לְחוֹבָה בְּהַכְרָעַת דַּיָּן אֶחָד, וְסוֹף הַמִּקְרָא דָּרְשׁוּ <b>אחרי רבים להטת<\/b>, שֶׁאִם יֵשׁ שְׁנַיִם מְחַיְּבִין יוֹתֵר עַל הַמְזַכִּין הַטֵּה הַדִּין עַל פִּיהֶם לְחוֹבָה – וּבְדִינֵי נְפָשׁוֹת הַכָּתוּב מְדַבֵּר – וְאֶמְצַע הַמִּקְרָא דָּרְשׁוּ <b>לא תענה על רב<\/b> – עַל רַב, שֶׁאֵין חוֹלְקִין עַל מֻפְלָא שֶׁבְּבֵית דִּין, לְפִיכָךְ מַתְחִילִין בְּדִינֵי נְפָשׁוֹת מִן הַצַּד – לַקְּטַנִּים שֶׁבָּהֶם שׁוֹאֲלִין תְּחִלָּה שֶׁיֹּאמְרוּ אֶת דַּעְתָּם – וּלְפִי דִּבְרֵי רַבּוֹתֵינוּ כָּךְ פִּתְרוֹן הַמִּקְרָא: <b>לא תהיה אחרי רבים לרעת.<\/b> לְחַיֵּב מִיתָה בִּשְׁבִיל דַּיָּן אֶחָד שֶׁיִּרְבּוּ מְחַיְּבִין עַל הַמְזַכִּין, וְלֹא תַעֲנֶה עַל הָרַב לִנְטוֹת מִדְּבָרָיו – וּלְפִי שֶׁהוּא חָסֵר יוֹ\"ד דָּרְשׁוּ בוֹ כֵּן – <b>אחרי רבים להטת<\/b>, יֵשׁ רַבִּים שֶׁאַתָּה נוֹטֶה אַחֲרֵיהֶם, וְאֵימָתַי? בִּזְמַן שֶׁהֵן שְׁנַיִם הַמַּכְרִיעִין בַּמְחַיְּבִין יוֹתֵר מִן הַמְזַכִּין; וּמִמַּשְׁמָע שֶׁנֶּאֱמַר <b>לא תהיה אחרי רבים לרעת<\/b> שׁוֹמֵעַ אֲנִי אֲבָל הֱיֵה עִמָּהֶם לְטוֹבָה, מִכָּאן אָמְרוּ דִּינֵי נְפָשׁוֹת מַטִּין עַל פִּי אֶחָד לִזְכוּת וְעַל פִּי שְׁנַיִם לְחוֹבָה. וְאֻנְקְלוֹס תִּרְגֵּם לָא תִתְמְנַע מִלְּאַלָּפָא מָה דְמִתְבְּעֵי לָךְ (דִבְעֵינָךְ) עַל דִּינָא, וּלְשׁוֹן הָעִבְרִי לְפִי הַתַּרְגּוּם כָּךְ הוּא נִדְרָשׁ: <b>לא תענה על רב לנטת.<\/b> אִם יִשְׁאָלוּךָ דָּבָר לַמִּשְׁפָּט לֹא תַעֲנֶה לִנְטוֹת לְצַד אֶחָד וּלְסַלֵּק עַצְמְךָ מִן הָרִיב, אֶלָּא הֱוֵי דָן אוֹתוֹ לַאֲמִתּוֹ.<br><br>וַאֲנִי אוֹמֵר לְיַשְּׁבוֹ עַל אָפְנָיו כִּפְשׁוּטוֹ כָךְ פִּתְרוֹנוֹ: <b>לא תהיה אחרי רבים לרעת.<\/b> אִם רָאִיתָ רְשָׁעִים מַטִּין מִשְׁפָּט, לֹא תֹאמַר, הוֹאִיל וְרַבִּים הֵם הִנְנִי נוֹטֶה אַחֲרֵיהֶם:<br><br><b>ולא תענה על רב לנטת וגו'.<\/b> וְאִם יִשְׁאָלְךָ הַנִּדּוֹן עַל אוֹתוֹ הַמִּשְׁפָּט, אַל תַּעֲנֶנּוּ עַל הָרִיב דָּבָר הַנּוֹטֶה אַחֲרֵי אוֹתָן רַבִּים לְהַטּוֹת אֶת הַמִּשְׁפָּט מֵאֲמִתּוֹ, אֶלָּא אֱמֹר אֶת הַמִּשְׁפָּט כַּאֲשֶׁר הוּא וְקוֹלָר יְהֵא תָלוּי בְּצַוַּאר הָרַבִּים (סנהדרין ז'):", "rashi_en": "לא תהיה אחרי רבים לרעת THOU SHALT NOT FOLLOW THE MANY FOR EVIL — There are Halachic interpretations of this verse given by the Sages of Israel but the wording of the text does not fit in well with them. They derive from here that we must not decide a person’s guilt by a preponderance of one judge. And the end of the verse they explained thus: אחרי רבים להטות — but if the judges who declare the defendant guilty are two more than those who declare him innocent, then decide the matter as they declare — that he is guilty (Sanhedrin 2a). — The verse, they point out, speaks of capital cases. — The middle passage לא תענה על רב, they explained as though it were written על רַב, “thou shalt not speak against the chief of the judges, meaning that one should not give an opinion different from that given by the מופלא of the court (the most eminent among the judges, because this is disrespectful to the Presiding-judge). In consequence of this rule we begin to take the view of those in the side-benches first — we ask the youngest judges to express their opinion first (so that they may not be able to vote against the view expressed by the מופלא). Therefore the exegesis of the verse according to the words of our Rabbis is as follows: “thou shalt not follow a bare majority for evil” — to sentence a man to death on account of the one judge by whom those who condemn him are more in number than those who acquit him; “and thou shalt not speak against the chief inclining away” from his opinion. — They explained this latter phrase thus, because the word which is usually written רִיב is here written without and therefore may be read, אחרי רבים להטות — ;רַב, there is, however, a majority to whose view thou must incline. When is this the case? When there are two who preponderate amongst those who vote for condemnation over and above those who vote for acquittal. For from what is implied in, “thou shalt not follow a bare majority for evil”, I may infer: but thou shall follow it for good. Hence they (the Rabbis) said (i. e. they established the general rule): In capital cases we may decide by a majority of one for acquittal, but only by a majority of at least two to condemn. Onkelos translates the second phrase by: Do not refrain from teaching when you are being asked your opinion in a legal matter. The Hebrew text is to be explained according to the Targum as follows: לא תענה על רב לנטת If you are being asked your opinion in a legal matter do not give your answer just to incline to one particular side and so to withdraw yourself from the dispute, but decide the matter as truth requires. Such are the expositions that have been offered of this verse.<br><br>But I think that if one wishes to explain the verse so that every thing should fit in properly, its exegesis must be as follows: לא תהיה אחרי רבים לרעת, If you see wicked men wresting judgment do not say: since they are many I will incline after them;<br><br>ולא תענה על רב לנטת וגו׳, and if the defendant asks you about that judgment do not give him as a reply concerning the dispute any statement which will incline after that majority, thereby wresting judgment from the truth, but pronounce the decision just as it should be and let the collar hang around the neck of the majority (i. e. if you be outvoted let them bear the responsibility)."}, {"ch": 23, "v": 3, "aliyah": 4, "heb": "וְדָ֕ל לֹ֥א תֶהְדַּ֖ר בְּרִיבֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעַל מִסְכֵּינָא לָא תְרַחֵם <b>בְּדִינֵהּ<\/b>:", "onk_en": "Do not show favor [even] to the poor in his dispute [<b>judgment<\/b>].", "pj": "וּמִסְכְּנָא דְאִתְחַיֵּיב בְּדִינֵיהּ לָא תִיסַב לֵיהּ אַפִּין לִמְרַחֲמָא עֲלוֹי אֲרוּם לֵית מִיסַב אַפִּין בְּדִינָא", "pj_en": "And to the poor man who is guilty in his cause, thou shalt not be partial in having compassion upon him; for there must not be respect of persons in judgment.", "tj": "", "tj_en": "", "rashi": "<b>לא תהדר.<\/b> לֹא תַחֲלֹק לוֹ כָבוֹד לְזַכּוֹתוֹ בַדִּין וְלומַר דַּל הוּא אֲזַכֶּנּוּ וַאֲכַבְּדֶנּוּ:", "rashi_en": "לא תהדר NEITHER SHALT THOU COUNTENANCE [THE INDIGENT IN HIS QUARREL] — You shall not pay regard to him by finding in his favour in the law suit, saying, “He is a poor man; I will find in his favour, and thus show him some measure of respect.”"}, {"ch": 23, "v": 4, "aliyah": 4, "heb": "כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְךָ֛ א֥וֹ חֲמֹר֖וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖נּוּ לֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי תִפְגַע תּוֹרָא דְסָנְאָךְ אוֹ חֲמָרֵהּ דְטָעֵי אָתָבָא תְּתִיבִנֵהּ לֵהּ:", "onk_en": "If you come across your enemy’s ox or his donkey going astray, bring it back to him.", "pj": "אִין תֶּאֱרַע תּוֹרָא דְסַנְאָךְ דְּאַתְּ סָנֵי לֵיהּ עַל חוֹבָתָא דְאַנְתְּ יְדַע בֵּיהּ בִּלְחוֹדָךְ אוֹ חַמְרָא דְטָעֵי מִן אָרְחָא אָתָבָא תִתְבִינֵיהּ לֵיהּ", "pj_en": "If thou meet the ox of thine enemy whom thou dislikest on account of the wickedness which thou only knowest is in him, or an ass that wandereth from the way, thou shalt surely bring it to him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 5, "aliyah": 4, "heb": "כִּֽי־תִרְאֶ֞ה חֲמ֣וֹר שֹׂנַאֲךָ֗ רֹבֵץ֙ תַּ֣חַת מַשָּׂא֔וֹ וְחָדַלְתָּ֖ מֵעֲזֹ֣ב ל֑וֹ עָזֹ֥ב תַּעֲזֹ֖ב עִמּֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי תֶחֱזֵי חֲמָרָא דְסָנְאָךְ רְבִיעַ תְּחוֹת טוֹעֲנֵיהּ <b>וְתִתִּמְנַע מִלְמִשְׁבַּק לֵהּ<\/b> מִשְׁבַּק <b>תִּשְׁבּוֹק מָא דִבְלִבָּךְ עֲלוֹהִי וּתְפָרֵק עִמֵהּ<\/b>:", "onk_en": "If you see the donkey of your enemy lying under its burden, and you might not want to help him [<b>stop yourself from abandoning him<\/b>], [but you should] [<b>[you should]<\/b>] make every effort to help him [<b>abandon what is in you heart against him and unload with him<\/b>] .", "pj": "אִין תֶּחֱמֵי חַמְרָא דְסַנְאָךְ דְּאַנְתְּ סָנֵי לֵיהּ עַל חוֹבָתָא דְאַנְתְּ יְדַע בֵּיהּ בִּלְחוֹדָךְ רְבִיעַ תְּחוֹת טוֹנֵיהּ וְתִמְנוֹעַ לְנַפְשָׁךְ מִלְמִקְרוֹב לֵיהּ מִשְׁבּוֹק תִּשְׁבּוֹק בְּהַהִיא שַׁעְתָּא יַת סָנָא דִבְלִבָּךְ עֲלוֹי וְתִפְרוֹק וְתִטְעוֹן עִמֵּיהּ", "pj_en": "If thou seest the ass of thy enemy whom thou dislikest on account of the wickedness which thou only knowest to be in him, lying under his burden, and thou wouldst refrain thyself from going near him, thou shalt relinquish at once the dislike of thy heart against (thy enemy), and release and take care of the ass (or, charge thyself with him).", "tj": "", "tj_en": "", "rashi": "<b>כי תראה חמור שנאך וגו'.<\/b> הֲרֵי כִי מְשַׁמֵּשׁ לְשׁוֹן דִּלְמָא, שֶׁהוּא מֵאַרְבַּע לְשׁוֹנוֹת שֶׁל שִׁמּוּשֵׁי כִי, וְכֹה פִּתְרוֹנוֹ: שֶׁמָּא תִרְאֶה חֲמוֹרוֹ רֹבֵץ תַּחַת מַשָּׂאוֹ <b>וחדלת מעזב לו<\/b>, בִּתְמִיהָ:<br><br><b>עזב תעזב עמו.<\/b> עֲזִיבָה זוֹ לְשׁוֹן עֶזְרָה, וְכֵן עָצוּר וְעָזוּב (דברים ל\"ב), וְכֵן וַיַּעַזְבוּ יְרוּשָׁלַיִם עַד הַחוֹמָה (נחמיה ג') – מִלְּאוּהָ עָפָר לַעֲזֹר וּלְסַיֵּעַ אֶת חֹזֶק הַחוֹמָה. כַּיּוֹצֵא בוֹ כִּי תֹאמַר בִּלְבָבְךָ רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי וְגוֹ' (דברים ז'), שֶׁמָּא תֹּאמַר כֵּן, בִּתְמִיהָ? לֹא תִירָא מֵהֶם. וּמִדְרָשׁוֹ כָּךְ דָּרְשׁוּ רַבּוֹתֵינוּ: כִּי תִרְאֶה וְחָדַלְתָּ, פְּעָמִים שֶׁאַתָּה חוֹדֵל, וּפְעָמִים שֶׁאַתָּה עוֹזֵר, הָא כֵיצַד? זָקֵן וְאֵינוֹ לְפִי כְּבוֹדוֹ וְחָדַלְתָּ, אוֹ בֶהֱמַת גוֹי וּמַשָּׂאוֹ שֶׁל יִשְׂרָאֵל וְחָדַלְתָּ (מכילתא):<br><br><b>עזב תעזב עמו.<\/b> לְפָרֵק הַמַּשָּׂא; מִלְּמִשְׁקַל לֵיהּ – מִלִּטֹּל מַשָּׂאוֹ מִמֶּנּוּ:", "rashi_en": "כי תראה חמור שנאך וגו׳ IF THOU SEE THE ASS OF HIM THAT HATETH THEE etc. — כי here has the meaning of “possibly”, “perhaps”, which is one of the four meanings which the word כי serves to express. The sense of the verse is accordingly the following: Can you possibly see his ass crouching beneath his burden and forbear to help him? (The Hebrew word בתמיה in Rashi means “Say this in the intonation of a question”, and is nothing more than our question mark).<br><br>עזב תעזב עמו — The root עזב has here the meaning of “helping”. It has a similar meaning in, (Deuteronomy 32:36) “assisted and helped (עזוב)”. Similar also is, (Nehemiah 3:8) “ויעזבו Jerusalem up to the wall” — i. e. they filled it up with earth in order to help and to support the strength of the wall. A similar use of כי is, (Deuteronomy 7:17, 18) כי תאמר בלבבך רבים הגוים האלה וגו׳ which means “Canst thou possibly (כי) speak thus? לא תירא מהם, Do not be afraid of them and speak thus”. Our Rabbis expounded it in a Halachic sense as follows: … כי תראה וחדלת “If thou seest etc. …וחדלת” — there are occasions when you may forbear and there are occasions when you must help. How so? If it is an old man who sees the ass in this condition and it is not compatible with his dignity to intervene, then וחדלת “thou mayest forbear” holds good; or if the animal belongs to a heathen and its burden to an Israelite then, also, וחדלת may be applied (cf. Mekhilta).<br><br>עזב תעזב עמו THOU SHALT SURELY HELP HIM — to unload the burden (Mekhilta). Onkelos also translates it in this sense: מלמשקל ליה which means, [Thou shalt not keep back] from taking the load from off it."}, {"ch": 23, "v": 6, "aliyah": 5, "heb": "לֹ֥א תַטֶּ֛ה מִשְׁפַּ֥ט אֶבְיֹנְךָ֖ בְּרִיבֽוֹ׃", "onk": "לָא תַצְלֵי דִין מִסְכֵּינָךְ בְּדִינֵהּ:", "onk_en": "Do not bend justice [even] for your needy in his dispute.", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תַצְלוּן דִּין מִסְכֵּינָא בְּדִינֵיהּ", "pj_en": "Sons of Israel My people, ye shall not warp the judgment of the poor in his cause.", "tj": "", "tj_en": "", "rashi": "<b>אבינך.<\/b> לְשׁוֹן אוֹבֶה, שֶׁהוּא מְדֻלְדָּל וְתָאֵב לְכָל טוֹבָה:", "rashi_en": "אבינך — from the root אבה “to long for”, “to desire” — one who is poverty-stricken and longs for all the good things which he lacks."}, {"ch": 23, "v": 7, "aliyah": 5, "heb": "מִדְּבַר־שֶׁ֖קֶר תִּרְחָ֑ק וְנָקִ֤י וְצַדִּיק֙ אַֽל־תַּהֲרֹ֔ג כִּ֥י לֹא־אַצְדִּ֖יק רָשָֽׁע׃", "onk": "מִפִּתְגָמָא דְשִׁקְרָא הֱוֵי רָחִיק <b>וְדִזְכֵי וְדִי נְפַק (דְכֵי) מִן דִינָא<\/b> לָא תִקְטוֹל אֲרֵי לָא אֱזַכֵּי חַיָבָא:", "onk_en": "Keep far away from anything false. Do not kill an [<b>one who is<\/b>] innocent [<b>or one who goes out innocent from judgment<\/b>] righteous man, for I will not acquit a wicked person.", "pj": "מִפִּתְגַם שִׁיקְרָא הֲוֵי רָחִיק וְדִי נְפַק זַכְּאַי מִבֵּי דִינָךְ וְאַשְׁכָּחוּ לֵיהּ חוֹבָתֵיהּ וְדִי נְפַק חַיָּיב וְאַשְׁכָּחוּ לֵיהּ זְכוּ לָא תִקְטֵיל אֲרוּם לָא הֲוֵינָא מְזַכֵּי לֵיהּ אִין הוּא חַיָּיבָא", "pj_en": "From a false matter keep distant. And when one hath gone forth from thy house of justice acquitted, and they (afterwards) find out his guilt; or one hath been brought out condemned, and they (afterward) find out his innocence,-­thou shalt not put him to death; for I will not hold (the former) innocent, nor the latter guilty.", "tj": "", "tj_en": "", "rashi": "<b>ונקי וצדיק אל תהרג.<\/b> מִנַּיִן לַיּוֹצֵא מִבֵּית דִּין חַיָּב וְאָמַר אֶחָד יֵשׁ לִי לְלַמֵּד עָלָיו זְכוּת שֶׁמַּחֲזִירִין אוֹתוֹ? תַּ\"לֹ וְנָקִי אַל תַּהֲרֹג, וְאַעַ\"פִּ שֶׁאֵינוֹ צַדִּיק, שֶׁלֹּא נִצְטַדֵּק בְּבֵית דִּין, מִכָּל מָקוֹם נָקִי הוּא מִדִּין מִיתָה שֶׁהֲרֵי יֵשׁ לְךָ לְזַכּוֹתוֹ. וּמִנַּיִן לַיּוֹצֵא מִבֵּית דִּין זַכַּאי וְאָמַר אֶחָד יֵשׁ לִי לְלַמֵּד עָלָיו חוֹבָה שֶׁאֵין מַחֲזִירִין אוֹתוֹ לְבֵית דִּין? תַּ\"לֹ וְצַדִּיק אַל תַּהֲרֹג, וְזֶה צַדִּיק הוּא שֶׁנִּצְטַדֵּק בְּבֵית דִּין (סנהדרין ל\"ג):<br><br><b>כי לא אצדיק רשע.<\/b> אֵין עָלֶיךָ לְהַחֲזִירוֹ, כִּי אֲנִי לֹא אַצְדִּיקֶנּוּ בְדִינִי, אִם יָצָא מִיָּדְךָ זַכַּאי יֵשׁ לִי שְׁלוּחִים הַרְבֵּה לַהֲמִיתוֹ בַמִּיתָה שֶׁנִּתְחַיֵּב בָּהּ (מכילתא):", "rashi_en": "ונקי וצדיק אל תהרג AND THE GUILTLESS AND RIGHTEOUS SLAY THOU NOT — Whence may we infer that in the case that one who left the court after being found guilty and one says, “I have something to plead in his favour”, he has to be brought back in order that the court may listen to this? From what Scripture states, “and the נקי thou shalt not slay”. Although he is not a צדיק — for he has not been acquitted by the court — he is however “free” (נקי) from the death penalty, for it is your duty to plead — as far as possible — in his favour. And whence may we infer, on the other hand, that in the case of one who left the court after having been acquitted and one says, “I have something to say against him” he is not to be brought back that the judges may hear this? From what Scripture states: “and the צדיק slay thou not” — and this man is a צדיק since he has been acquitted by the court (Sanhedrin 33b).<br><br>כי לא אצדיק רשע FOR “I” WILL NOT JUSTIFY THE WICKED — It is not your duty, in the latter case, to bring the man back to the court, for if he is really guilty, “I” will not acquit him in My court. Altough he has left your hands as innocent “I” have many agents (many means) to inflict upon him the death to which he has made himself liable (Mekhilta)."}, {"ch": 23, "v": 8, "aliyah": 5, "heb": "וְשֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַשֹּׁ֙חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽיסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃", "onk": "וְשׁוֹחֲדָא לָא תְקַבֵּל אֲרֵי שׁוֹחֲדָא מְעַוֵר <b>עֵינֵי חַכִּימִין<\/b> וּמְקַלְקֵל פִּתְגָמִין תְּרִיצִין:", "onk_en": "Do not accept bribery, for bribery blinds the clear-sighted [<b>eyes of the wise<\/b>], and perverts the words of justice.", "pj": "וְשׁוֹחֲדָא לָא תְקַבֵּיל אֲרוּם שׁוֹחֲדָא מְסַמֵּי עֵינוֹי נַסְבוֹי וּמְטַלְטֵל חַכִּימַיָא מִמוֹתְבָנֵיהוֹן וּמְקַלְקֵל פִּתְגָּמִין תְּרִיצִין דְּמִכְתָּבִין בְּאוֹרַיְיתָא וּמְעַרְבֵב מִילֵי זַכָּאִין בְּפוּמְהוֹן בְּשַׁעַת דִּינָא", "pj_en": "And thou mayest not receive a bribe; for a bribe blindeth their eyes who have taken it, and casteth down the wise from their seats, and perverteth the right words which are written in the law, and confoundeth the words that are in the mouth of the innocent in the hour of judgment.", "tj": "", "tj_en": "", "rashi": "<b>ושחד לא תקח.<\/b> אֲפִלּוּ לִשְׁפֹּט אֱמֶת, וְכָל שֶׁכֵּן כְּדֵי לְהַטּוֹת אֶת הַדִּין, שֶׁהֲרֵי לְהַטּוֹת אֶת הַדִּין נֶאֱמַר כְּבָר (דברים ט\"ז) לֹא תַטֶּה מִשְׁפָּט (כתובות ק\"ה):<br><br><b>יעור פקחים.<\/b> אֲפִלּוּ חָכָם בַּתּוֹרָה וְנוֹטֵל שֹׁחַד סוֹף שֶׁתִּטָּרֵף דַּעְתּוֹ עָלָיו וְיִשְׁתַּכַּח תַּלְמוּדוֹ וְיִכְהֶה מְאוֹר עֵינָיו (שם):<br><br><b>ויסלף.<\/b> כְּתַרְגּוּמוֹ וּמְקַלְקֵל:<br><br><b>דברי צדיקים.<\/b> דְּבָרִים הַמְצֻדָּקִים, מִשְׁפְּטֵי אֱמֶת, וְכֵן תַּרְגּוּמוֹ פִּתְגָמִין תְּרִיצִין – יְשָׁרִים:", "rashi_en": "ושחד לא תקח AND THOU SHALT TAKE NO GIFT, even if you mean to give a true judgment in favour of the giver, and it is a matter of course that you must not accept one to wrest judgment, and therefore there is no need for Scripture to forbid this, for with regard to wresting judgment, whether you take a bribe or not, it is distinctly stated, (Deuteronomy 16:19) “Thou shalt not wrest judgment” (Ketubot 105a).<br><br>יעור פקחים [FOR THE BRIBE] BLINDETH THE OPEN-EYED — Even if he be well-versed in the Torah and takes a bribe, in the end his mind will become confused, what he has learnt will be forgotten, and the light of his eyes will become dim (Mekhilta; Ketubot 105a).<br><br>ויסלף — render it as the Targum does: ויקלקל “makes bad”, “perverts”. ...<br><br>דברי צדיקים means, the words which have been described by the term “righteous”, viz., the judgments of truth uttered on Sinai. Thus, too, does the Targum take it: words that are תריצין, upright."}, {"ch": 23, "v": 9, "aliyah": 5, "heb": "וְגֵ֖ר לֹ֣א תִלְחָ֑ץ וְאַתֶּ֗ם יְדַעְתֶּם֙ אֶת־נֶ֣פֶשׁ הַגֵּ֔ר כִּֽי־גֵרִ֥ים הֱיִיתֶ֖ם בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְגִיוֹרָא לָא תְעִיקוּן וְאַתּוּן יְדַעְתּוּן יָת נַפְשָׁא דְגִיוֹרָא אֲרֵי דַיָרִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "Do not oppress a stranger. You [should] know the soul [feelings] of the stranger, for you were strangers in the land of Egypt.", "pj": "וּלְגִיּוּרָא לָא תְעִיקוּן וְאַתּוּן חַכִּימְתּוּן יַת אֲנִיק נְפַשׁ גִּיּוֹרָא אֲרוּם דַּיְירִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרָיִם", "pj_en": "Thou shalt not oppress the stranger; for ye know the sigh of a stranger's soul; because ye were sojourners in the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>וגר לא תלחץ.<\/b> בְּהַרְבֵּה מְקוֹמוֹת הִזְהִירָה תּוֹרָה עַל הַגֵּר מִפְּנֵי שֶׁסּוּרוֹ רָע (בבא מציעא נ\"ט):<br><br><b>את נפש הגר.<\/b> כַּמָּה קָשֶׁה לוֹ כְּשֶׁלּוֹחֲצִים אוֹתוֹ:", "rashi_en": "וגר לא תלחץ AND THOU SHALT NOT OPPRESS THE STRANGER — In numerous passages (36 in number) does the Torah offer a caution about the ill-treatment of the stranger, because his original character is bad (Bava Metzia 59b).<br><br>אח נפש הגר [FOR YE KNOW] THE SOUL OF A STRANGER — how hard it is for him when people oppress him."}, {"ch": 23, "v": 10, "aliyah": 5, "heb": "וְשֵׁ֥שׁ שָׁנִ֖ים תִּזְרַ֣ע אֶת־אַרְצֶ֑ךָ וְאָסַפְתָּ֖ אֶת־תְּבוּאָתָֽהּ׃", "onk": "וְשִׁית שְׁנִין תִּזְרַע יָת אַרְעָךְ וְתִכְנוֹשׁ יָת עֲלַלְתַּהּ:", "onk_en": "You may sow your land for six years, and gather its crops.", "pj": "וְשִׁית שְׁנִין תִּדְרַע יַת אַרְעָךְ וְתִכְנוֹשׁ יַת עֲלַלְתָּא", "pj_en": "Six years thou shalt sow thy land, and gather the produce;", "tj": "", "tj_en": "", "rashi": "<b>ואספת את תבואתה.<\/b> לְשׁוֹן הַכְנָסָה לַבַּיִת, כְּמוֹ וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ (דברים כ\"ב):", "rashi_en": "ואספת את תבואתה AND SHALT GATHER IN THE INCREASE THEREOF — אסף is a term denoting “bringing into the house”, like, (Deuteronomy 22:2) “thou shalt gather it (ואספתו) into thine house” (cf. Rashi on Genesis 49:29)."}, {"ch": 23, "v": 11, "aliyah": 5, "heb": "וְהַשְּׁבִיעִ֞ת תִּשְׁמְטֶ֣נָּה וּנְטַשְׁתָּ֗הּ וְאָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔ךָ וְיִתְרָ֕ם תֹּאכַ֖ל חַיַּ֣ת הַשָּׂדֶ֑ה כֵּֽן־תַּעֲשֶׂ֥ה לְכַרְמְךָ֖ לְזֵיתֶֽךָ׃", "onk": "וּשְׁבִעֵתָא תַּשְׁמְטִנַהּ וְתַרְטְשִׁנַהּ וְיֵיכְלוּן מִסְכְּנֵי עַמָךְ וּשְׁאָרְהוֹן תֵּיכוּל חֵיוַת בָּרָא כֵּן תַּעְבֵּד לְכַרְמָךְ לְזֵיתָךְ:", "onk_en": "But on the seventh [year] you must let it rest, and abandon it [by not eating its produce], and let the needy among your people eat it. What they leave over, the beasts of the field can eat. Do the same with your vineyard and your olive [trees].", "pj": "וּשְׁבִיעִיתָא תִּשְׁמְטִינָא מִפּוּלְחָנָא וְתַפְקַר פֵּירָהָא וְיֵיכְלוּן מִסְכֵּינֵי עַמָּא וְשִׁיּוּרְהוֹן תֵּיכוּל חֵיוַת בָּרָא כְּדֵין תַּעֲבֵיד לְכַרְמָךְ לְזֵיתָךְ", "pj_en": "but the seventh year thou shalt exempt it from labour, and give up the fruit of it to be eaten by the poor of My people; and what they leave shall be eaten by the beasts of the field. And in like manner shalt thou do with thy vine and olive grounds.", "tj": "", "tj_en": "", "rashi": "<b>תשמטנה.<\/b> מֵעֲבוֹדָה:<br><br><b>ונטשתה.<\/b> מֵאֲכִילָה אַחַר זְמַן הַבִּעוּר. דָּ\"אַ, תִּשְׁמְטֶנָּה – מֵעֲבוֹדָה גְמוּרָה, כְּגוֹן חֲרִישָׁה וּזְרִיעָה, וּנְטַשְׁתָּהּ – מִלְּזַבֵּל וּמִלְּקַשְׁקֵשׁ (סוכה מ\"ד):<br><br><b>ויתרם תאכל חית השדה.<\/b> לְהַקִּישׁ מַאֲכַל אֶבְיוֹן לְמַאֲכַל חַיָּה, מַה חַיָּה אוֹכֶלֶת בְּלֹא מַעֲשֵׂר, אַף אֶבְיוֹנִים אוֹכְלִים בְלֹא מַעֲשֵׂר; מִכָּאן אָמְרוּ אֵין מַעֲשֵׂר בַּשְּׁבִיעִית (מכילתא):<br><br><b>כן תעשה לכרמך.<\/b> וּתְחִלַּת הַמִּקְרָא מְדַבֵּר בִּשְׂדֵה הַלָּבָן, כְּמוֹ שֶׁאָמוּר לְמַעְלָה הֵימֶנּוּ תִּזְרַע אֶת אַרְצֶךָ:", "rashi_en": "תשמטנה THOU SHALT LET IT REST — by not tilling it (Mekhilta),<br><br>ונטשתה AND THOU SHALT ABANDON IT — by not eating of its produce (Mekhilta) after “the time of removal” of the produce has arrived. Another explanation is: תשמטנה THOU SHALT LET IT REST, from what is real work, as, for example, ploughing and sowing, ונטשתה AND LEAVE IT ALONE — not even to manure and to hoe it.<br><br>ויתרם תאכל חית השדה AND WHAT THEY LEAVE THE BEASTS OF THE FIELD (the wild animals) SHALL EAT — This cannot be a command that the wild animals shall eat it, viz., that you shall permit them to eat it. No such command is necessary since you have no control over wild animals; it intends by juxtaposition with the preceding words to place in the same category (more lit., to compare) the food of the poor with that of the beast. For how is it in the case of the wild animal? It eats food without the tithe having been separated from it! So too, the poor may in the seventh year eat food without the tithe having been separated from it. From this juxtaposition they (the Rabbis) derived the rule that the law of tithe is not to be observed in the seventh year (Mekhilta).<br><br>כך תעשה לכרמך IN LIKE MANNER THOU SHALT DO WITH THY VINEYARD — The first member of the verse, however, speaks of a “white field” (i. e. a bright, shadeless field — a grain field or a vegetable field — in contrast to a שדה אילן which casts shade), as it is said above, (v. 10) “thou shalt sow thy land”."}, {"ch": 23, "v": 12, "aliyah": 5, "heb": "שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔יךָ וּבַיּ֥וֹם הַשְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְךָ֙ וַחֲמֹרֶ֔ךָ וְיִנָּפֵ֥שׁ בֶּן־אֲמָתְךָ֖ וְהַגֵּֽר׃", "onk": "שִׁתָּא יוֹמִין תַּעְבֵּד עוֹבָדָיךְ וּבְיוֹמָא שְׁבִיעָאָה תָּנוּחַ בְּדִיל דִינוּחַ תּוֹרָךְ וְחַמָרָךְ וְיִשְּׁקוֹט בַּר אַמְתָךְ וְגִיוֹרָא:", "onk_en": "You may do your work six days, but on the seventh day you must cease; so that your ox and your donkey may rest, and the son of your female slave may be refreshed, and [also] the stranger.", "pj": "שִׁיתָּא יוֹמִין תַּעֲבֵד עוּבְדָךְ וּבְיוֹמָא שְׁבִיעָאָה תִּנּוּחַ מִן בִּגְלַל דִּינוּחוּן תּוֹרָךְ וְחַמְרָךְ וְיִשְׁקוֹט בַּר אַמְתָךְ עַרְלָאָה וְגִיּוֹרָא", "pj_en": "Six days do thy work, and on the seventh day repose, that thy ox and thy ass may rest, and that the uncircumcised son of thy handmaid, and the stranger, may rest.", "tj": "", "tj_en": "", "rashi": "<b>וביום השביעי תשבת.<\/b> אַף בַּשָּׁנָה הַשְּׁבִיעִית לֹא תֵעָקֵר שַׁבַּת בְּרֵאשִׁית מִמְּקוֹמָהּ, שֶׁלֹּא תֹאמַר, הוֹאִיל וְכָל הַשָּׁנָה קְרוּיָה שַׁבָּת לֹא תִנְהַג בָּהּ שַׁבַּת בְּרֵאשִׁית (שם):<br><br><b>למען ינוח שורך וחמרך.<\/b> תֵּן לוֹ נִיחַ, לְהַתִּיר שֶׁיְּהֵא תוֹלֵשׁ וְאוֹכֵל עֲשָׂבִים מִן הַקַּרְקַע; אוֹ אֵינוֹ אֶלָּא יַחְבְּשֶׁנּוּ בְּתוֹךְ הַבַּיִת? אָמַרְתָּ אֵין זֶה נִיחַ אֶלָּא צַעַר:<br><br><b>בן אמתך.<\/b> בְּעֶבֶד עָרֵל הַכָּתוּב מְדַבֵּר:<br><br><b>והגר.<\/b> גֵּר תּוֹשָׁב:", "rashi_en": "וביום השביעי תשבת [SIX DAYS SHALT THOU DO THY WORK] AND ON THE SEVENTH DAY THOU SHALT LEAVE OFF — Even in the Sabbatical year you shall not abrogate the weekly Sabbath: you shall not say, “Since the whole year bears the name of ‘Sabbath’, the weekly Sabbath need not to be observed” (Mekhilta).<br><br>למען ינוח שורך means, give it (the animal) some satisfaction (ניח) by permitting it to pull up and eat grass from the ground as it pleases. Or, perhaps, this is not the meaning but it means that is must rest: that one must tie it up in its stall so that it does no work in the field! You will, however, admit this is no satisfaction but a source of annoyance (Mekhilta).<br><br>בן אמתך THE SON OF THY HANDMAID — Scripture speaks of an uncircumcised Canaanitish servant; (that the circumcised servant should rest is already mentioned in Deuteronomy 5:14: עבדך ואמתך כמוך) (cf. Mekhilta).<br><br>והגר means a גר תושב, a proselyte settler (one who renounces idolatry and thus acquires limited citizenship in Palestine)."}, {"ch": 23, "v": 13, "aliyah": 5, "heb": "וּבְכֹ֛ל אֲשֶׁר־אָמַ֥רְתִּי אֲלֵיכֶ֖ם תִּשָּׁמֵ֑רוּ וְשֵׁ֨ם אֱלֹהִ֤ים אֲחֵרִים֙ לֹ֣א תַזְכִּ֔ירוּ לֹ֥א יִשָּׁמַ֖ע עַל־פִּֽיךָ׃", "onk": "וּבְכֹל דִי אֲמָרִית לְכוֹן תִּסְתַּמְרוּן וְשׁוּם <b>טַעֲוַת עַמְמַיָא<\/b> לָא תִדְכְּרוּן לָא יִשְׁתְּמַע עַל פּוּמְכוֹן:", "onk_en": "Preserve everything that I have said to you. Do not mention the name of other [<b>false<\/b>] gods [<b>of the peoples<\/b>]. You must not cause it to be heard through your mouth.", "pj": "וּבְכָל פִּקּוּדַיָא דְאָמְרִית לְכוֹן תִּסְתַּמְּרוּן וְשׁוּם טַעֲוַות עַמְמַיָא לָא תִדְכְּרוּן לָא יִשְׁתְּמַע עַל פּוּמְכוֹן", "pj_en": "And of all the precepts that I have spoken to you, be carefull; and the names of the idols of the Gentiles remember not, nor let them be heard upon your lips.", "tj": "", "tj_en": "", "rashi": "<b>ובכל אשר אמרתי אליכם תשמרו.<\/b> לַעֲשׂוֹת כָּל מִצְוַת עֲשֵׂה בְּאַזְהָרָה, שֶׁכָּל שְׁמִירָה שֶׁבַּתּוֹרָה אַזְהָרָה הִיא בִּמְקוֹם לָאו (מנחות ל\"ו):<br><br><b>לא תזכירו.<\/b> שֶׁלֹּא יֹאמַר לוֹ שְׁמֹר לִי בְּצַד עֲ\"זָ פְּלוֹנִית, אוֹ תַעֲמֹד עִמִּי בְּיוֹם עֲ\"זָ פְּלוֹנִית; דָּ\"אַ — וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם תִּשָּׁמֵרוּ וְשֵׁם אֱלֹהִים אֲחֵרִים לֹא תַזְכִּירוּ, לְלַמֶּדְךָ שֶׁשְּׁקוּלָה עֲ\"זָ כְּנֶגֶד כָּל הַמִּצְווֹת כֻּלָּן (הוריות ח'), וְהַנִּזְהָר בָּהּ כְּשׁוֹמֵר אֶת כֻּלָּן:<br><br><b>לא ישמע<\/b> מִן הַגוֹי <b>על פיך.<\/b> שֶׁלֹּא תַעֲשֶׂה שֻׁתָּפוּת עִם גוֹי וְיִשָּׁבַע לְךָ בַּעֲ\"זָ שֶׁלּוֹ נִמְצֵאתָ שֶׁאַתָּה גּוֹרֵם שֶׁיִּזָּכֵר עַל יָדְךָ (סנהדרין ס\"ז):", "rashi_en": "ובכל אשר אמרתי אליכם תשמרו AND IN ALL THAT I HAVE SAID TO YOU TAKE HEED — This statement is intended to bring every positive command (מצות עשה) also under the category of a prohibition (לאו); for wherever the term שמר, “take heed”, is used in the Torah it is an admonition in the place of (having the force of) a prohibition (cf. Yalkut Shimoni on Torah 355).<br><br>לא תזכירו MAKE NO MENTION [OF THE NAME OF OTHER GODS] — This means that one must not say to another: “Wait for me near such-and-such an idol”, or, “Stay with me on the festival of such-an-such an idol’” (mentioning its name) (cf. Mekhilta; Sanhedrin 63b). Another explanation of verse 13 is: the juxtaposition of “Be heedful in respect of everything that I have spoken to you” with “and the names of other gods ye shall not mention” is intended to teach you that the practise of idol-worship is of equal heinousness as though one had infringed every command (cf. Horayot 8a); and that one who avoids it may be regarded as though he had observed every one of them (cf. Chullin 5a).<br><br>לא ישמע IT SHALL NOT BE HEARD from a heathen, THROUGH THINE AGENCY — i. e. you shall make no business partnership with a heathen through which it might happen that he will take an oath by the name of his god, for consequently you will have brought it about that it has been mentioned through your agency (cf. Sanhedrin 63b)."}, {"ch": 23, "v": 14, "aliyah": 5, "heb": "שָׁלֹ֣שׁ רְגָלִ֔ים תָּחֹ֥ג לִ֖י בַּשָּׁנָֽה׃", "onk": "תְּלַת זִמְנִין תֵּחוֹג <b>קֳדָמַי<\/b> בְּשַׁתָּא:", "onk_en": "Three times a year you are to celebrate with [<b>before<\/b>] Me.", "pj": "תְּלָתָא זִמְנִין תְּחַגּוּן קֳדָמַי בְּשַׁתָּא", "pj_en": "Three times in the year thou shalt keep festival before Me.", "tj": "", "tj_en": "", "rashi": "<b>רגלים.<\/b> פְּעָמִים; וְכֵן כִּי הִכִּיתַנִי זֶה שָׁלֹשׁ רְגָלִים (במדבר כ\"ב):", "rashi_en": "רגלים means TIMES. Similar is, (Numbers 22:28) “that thou hast smitten me these three times (רגלים‎)”."}, {"ch": 23, "v": 15, "aliyah": 5, "heb": "אֶת־חַ֣ג הַמַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽאֲשֶׁ֣ר צִוִּיתִ֗ךָ לְמוֹעֵד֙ חֹ֣דֶשׁ הָֽאָבִ֔יב כִּי־ב֖וֹ יָצָ֣אתָ מִמִּצְרָ֑יִם וְלֹא־יֵרָא֥וּ פָנַ֖י רֵיקָֽם׃", "onk": "יָת חַגָא דְפַטִירַיָא תִּטַר שִׁבְעָא יוֹמִין תֵּיכוּל פַּטִירָא כְּמָא דִפַקֵידִתָּךְ לִזְמַן יַרְחָא דַאֲבִיבָא אֲרֵי בֵהּ נְפַקְתָּ מִמִצְרָיִם וְלָא יִתְחֲזוּן <b>קֳדָמַי<\/b> רֵיקָנוּן:", "onk_en": "You must keep the festival of Matzos. You must eat matzos for seven days, as I have commanded you. [This festival must be celebrated] at the appointed time, during the month when the grain is ripened, for in it [at this time] you went out of Egypt. Do not appear before My Presence [<b>Me<\/b>] empty-handed.", "pj": "יַת חַגָּא דְפַטִירַיָיא תִּנְטוֹר שׁוּבְעָא יוֹמִין תֵּיכוֹל פַּטִּירָא הֵיכְמָא דְפַקֵידְתָּךְ לִזְמַן יַרְחָא דְאַבִּיבָא אֲרוּם בֵּיהּ נְפַקְתְּ מִמִּצְרַיִם וְלָא יִתְחַמּוּן קֳדָמַי רֵיקָנִין", "pj_en": "The feast of unleavened cakes thou shalt keep. Seven days thou art to eat unleavened bread, as I have instructed thee, in the time of the month of Abiba, because in it thou camest forth from Mizraim; and you shall not appear before Me empty.", "tj": "", "tj_en": "", "rashi": "<b>חדש האביב.<\/b> שֶׁהַתְּבוּאָה מִתְמַלֵּאת בּוֹ בְּאִבֶּיהָ. אָבִיב לְשׁוֹן אָב, בְּכוֹר וְרִאשׁוֹן לְבַשֵּׁל פֵּרוֹת:<br><br><b>ולא יראו פני ריקם.<\/b> כְּשֶׁתָּבֹאוּ לִרְאוֹת פָּנַי בָּרְגָלִים, הָבִיאוּ לִי עוֹלוֹת (מכילתא):", "rashi_en": "חודש האביב THE MONTH OF אביב — it is the month when the grain becomes full in its ripe state (באביה). The word אביב is connected with אַב which signifies maturity, and being the first of the fruit to ripen (cf. Rashi on Exodus 9:31).<br><br>ולא יראו פני ריקם AND NONE SHALL APPEAR BEFORE MY FACE EMPTY — When you come to appear before My face on the festivals, bring Me burnt-offerings (Mekhilta; Chagigah 7a)."}, {"ch": 23, "v": 16, "aliyah": 5, "heb": "וְחַ֤ג הַקָּצִיר֙ בִּכּוּרֵ֣י מַעֲשֶׂ֔יךָ אֲשֶׁ֥ר תִּזְרַ֖ע בַּשָּׂדֶ֑ה וְחַ֤ג הָֽאָסִף֙ בְּצֵ֣את הַשָּׁנָ֔ה בְּאׇסְפְּךָ֥ אֶֽת־מַעֲשֶׂ֖יךָ מִן־הַשָּׂדֶֽה׃", "onk": "וְחַגָא דַחֲצָדָא בִּכּוּרֵי עוֹבָדָיךְ דִי תִזְרַע בְּחַקְלָא וְחַגָא דִכְנָשָׁא בְּמִפְּקָא דְשַׁתָּא בְּמִכְנְשָׁךְ יָת עוֹבָדָיךְ מִן חַקְלָא:", "onk_en": "[You must also keep] the Festival of Harvest, [with bringing bikurim] the first fruits of your labor, which you planted in the field; [also] the Festival of Ingathering, at the close of the year, when you gather in [the fruits of] your labor from the field.", "pj": "וְחַגָא דְחַצְדָא בִּכּוּרֵי עוּבְדָךְ דְּתִזְרַע בְּחַקְלָא וְחַגָא דִּכְנָשָׁא בְּמִפְקָא דְשַׁתָּא בְּמִכְנְשָׁךְ יַת עוּבְדָךְ מִן חַקְלָא", "pj_en": "And the feast of the harvest first-fruits of the work thou didst sow in the field; and the feast of gathering, at the end of the year, when thou hast gathered in thy work from the field.", "tj": "", "tj_en": "", "rashi": "<b>וחג הקציר.<\/b> הוּא חַג שָׁבוּעוֹת:<br><br><b>בכורי מעשיך.<\/b> שֶׁהוּא זְמַן הֲבָאַת בִּכּוּרִים, שֶׁשְּׁתֵי הַלֶּחֶם הַבָּאִין בַּעֲצֶרֶת הָיוּ מַתִּירִין הֶחָדָשׁ לַמְּנָחוֹת וּלְהָבִיא בִכּוּרִים לַמִּקְדָּשׁ, שֶׁנֶּאֱמַר וּבְיוֹם הַבִּכּוּרִים וְגוֹ' (במדבר כ\"ח):<br><br><b>וחג האסף.<\/b> הוּא חַג הַסֻּכּוֹת:<br><br><b>באספך את מעשיך.<\/b> שֶׁכָּל יְמוֹת הַחַמָּה הַתְּבוּאָה מִתְיַבֶּשֶׁת בַּשָּׂדוֹת, וּבֶחָג אוֹסְפִים אוֹתָהּ אֶל הַבַּיִת מִפְּנֵי הַגְּשָׁמִים:", "rashi_en": "וחג הקציר AND THE FESTIVAL OF HARVEST — this is the Feast of Weeks,<br><br>בכורי מעשיך which is the time for bringing the first-fruits, for the offering of the two loaves that were brought on the Feast of Weeks made it permissible for the first time during the year to use the new harvest of wheat for the meal offerings (Menachot 68b), and to bring the first fruits into the Temple, (Mishnah Bikkurim 1:3) for it is said, (Numbers 28:26) “And on the day of the first fruits etc., [בשבעתיכם on your weeks etc.]” (cf. Rashi on that verse).<br><br>וחג האסף AND THE FESTIVAL OF THE INGATHERING — that is the Feast of Tabernacles.<br><br>באספך את מעשיך WHEN THOU HAST GATHERED IN THY LABOURS — For during the whole summer-time the fruits are drying in the fields and about the Festival (הָחָג is a Talmudical term for the Feast of Tabernacles) they are gathered into the barns on account of the rain that is then due."}, {"ch": 23, "v": 17, "aliyah": 5, "heb": "שָׁלֹ֥שׁ פְּעָמִ֖ים בַּשָּׁנָ֑ה יֵרָאֶה֙ כׇּל־זְכ֣וּרְךָ֔ אֶל־פְּנֵ֖י הָאָדֹ֥ן&thinsp;<small>׀<\/small>&thinsp;יְהֹוָֽה׃", "onk": "תְּלַת זִמְנִין בְּשַׁתָּא יִתְחֲזוּן כָּל דְכוּרָךְ קֳדָם רִבּוֹן <b>עָלְמָא<\/b> יְיָ:", "onk_en": "Three times a year, every male among you must appear before the Presence of the Master [<b>of the world<\/b>], Adonoy.", "pj": "תְּלָתָא זִמְנִין בְּשַׁתָּא יִתְחַמּוּן כָּל דְּכוּרָךְ קֳדָם רִבּוֹן עַלְמָא יְיָ", "pj_en": "Three times in the year shall all thy males appear before the Lord the Ruler of the world.", "tj": "", "tj_en": "", "rashi": "<b>שלש פעמים וגו'.<\/b> לְפִי שֶׁהָעִנְיָן מְדַבֵּר בַּשְּׁבִיעִית, הֻצְרַךְ לוֹמַר שֶׁלֹּא יִסְתָּרְסוּ רְגָלִים מִמְּקוֹמָן:<br><br><b>כל זכורך.<\/b> הַזְּכָרִים שֶׁבְּךָ:", "rashi_en": "שלש פעמים וגו׳ THREE TIMES etc. — Because this section speaks mainly of the Sabbatical year, it was necessary to state that the sequence of the festivals should not be disturbed even in this year of agricultural rest (Mekhilta; cf. Rashi on v. 12).<br><br>כל זכורך means all the male population among you."}, {"ch": 23, "v": 18, "aliyah": 5, "heb": "לֹֽא־תִזְבַּ֥ח עַל־חָמֵ֖ץ דַּם־זִבְחִ֑י וְלֹֽא־יָלִ֥ין חֵֽלֶב־חַגִּ֖י עַד־בֹּֽקֶר׃", "onk": "לָא תִכּוֹס עַל חֲמִיעַ דַם פִּסְחִי וְלָא יְבִיתוּן <b>בַּר מִן מַדְבְּחָא תַּרְבֵּי<\/b> נִכְסַת <b>חַגָא<\/b> עַד צַפְרָא:", "onk_en": "You must not sacrifice—while chometz is present—My [Pesach] sacrifice. You must not allow to remain overnight [<b>off the Altar<\/b>]—the fat[<b>s<\/b>] of My [<b>the<\/b>] festival-offering—until morning.", "pj": "עַמִּי בְנֵי יִשְרָאֵל לָא תֵכְסוּן כַּד דְּחָמִיעַ בְּבָתֵּיכוֹן דָּם נִכְסַת פִּיסְחִי וְלָא יְבִית בַּר מִן מַדְבְּחָא תַּרְבֵּי נִכְסַת פִּסְחִי עַד צַפְרָא לָא מִן בִּשְרָא דְתֵיכְלוּן בְּרַמְשָׁא", "pj_en": "Sons of Israel My people, while there is leaven in your houses you may not immolate the bloody sacrifice of My Pascha; nor shall the fat of the sacrifice of My Pascha remain without the altar until morning, nor of the flesh that you eat in the evening.", "tj": "", "tj_en": "", "rashi": "<b>לא תזבח על חמץ וגו'.<\/b> לֹא תִשְׁחַט אֶת הַפֶּסַח בְּי\"ד בְּנִיסָן עַד שֶׁתְּבַעֵר הֶחָמֵץ (מכילתא):<br><br><b>ולא ילין חלב חגי<\/b> חוּץ לַמִּזְבֵּחַ:<br><br><b>עד בקר.<\/b> יָכוֹל אַף עַל הַמַּעֲרָכָה יִפָּסֵל בְּלִינָה, תַּ\"לֹ עַל מוֹקְדָה עַל הַמִּזְבֵּחַ כָּל הַלַּיְלָה (ויקרא ו'):<br><br><b>ולא ילין.<\/b> אֵין לִינָה אֶלָּא בְעַמּוּד הַשַּׁחַר, שֶׁנֶּאֱמַר עַד בֹּקֶר, אֲבָל כָּל הַלַּיְלָה יָכוֹל לְהַעֲלוֹתוֹ מִן הָרִצְפָּה לַמִּזְבֵּחַ (מגילה כ'):", "rashi_en": "לא תזבח על חמץ וגו׳ means, you shall not sacrifice the Passover-lamb on the fourteenth day of Nisan before you have removed the leavened bread from your house (Mekhilta). (This verse is to be connected with v. 15).<br><br>ולא ילין חלב חגי NEITHER SHALL THE FAT OF MY SACRIFICE REMAIN away from the altar (cf. the Targum).<br><br>UNTIL MORNING. One might think, however, that the meaning is, that it shall not remain overnight on the altar and that the sacrifice would therefore become invalid even through the fat remaining overnight on the “wood-pile” of the altar! Scripture, however, states, (Leviticus 6:2) “[This is the law of the burnt-offering; it is that which may go up] on the fire-place of the altar all the night, [any time until the morning]”(Mekhilta), —<br><br>Therefore the statement ולא ילין means, that this law of leaving the fat away from the altar overnight is infringed only if it has not been placed on the altar by the dawn of the morning, for it says, “[neither shall the fat remain] until morning”, but any time during the whole night one may lift it up from the pavement on to the altar (cf. Megillah 20b)."}, {"ch": 23, "v": 19, "aliyah": 5, "heb": "רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְךָ֔ תָּבִ֕יא בֵּ֖ית יְהֹוָ֣ה אֱלֹהֶ֑יךָ לֹֽא־תְבַשֵּׁ֥ל גְּדִ֖י בַּחֲלֵ֥ב אִמּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "רֵישׁ בִּכּוּרֵי אַרְעָךְ תַּיְתִי לְבֵית <b>מִקְדְשָׁא<\/b> דַיְיָ אֱלָהָךְ לָא <b>תֵיכְלוּן בְּשַׂר בַּחֲלָב<\/b>:", "onk_en": "The beginning of the first fruits of your land must be brought to the House of [<b>the Sanctuary of<\/b>] Adonoy, your God. You must not cook a young animal in the milk of its mother [<b>eat meat with milk<\/b>].", "pj": "שֵׁירוּי בִּיכוּרֵי פֵּירֵי אַרְעָךְ תַּיְתֵי לְבֵית מַקְדְּשָׁא דַיְיָ אֱלָהָךְ עַמִּי בֵּית יִשְרָאֵל לֵית אַתּוּן רְשָׁאִין לָא לִמְבַשְׁלָא וְלָא לְמֵיכוּל בְּשַר וַחֲלַב מְעַרְבִין כַּחֲדָא דְלָא יִתְקַף רוּגְזִי וְאִיבְשֵׁיל עִיבּוּרֵיכוֹן דְּגָנָא וְקַשָׁא תְּרֵיהוֹן כַּחֲדָא", "pj_en": "The first of the choice fruits of thy ground thou shalt bring to the sanctuary of the Lord thy God. My people of the house of Israel, you are not permitted to dress or to eat of flesh and milk mingled together, lest I be greatly displeased; and I prepare you the wheat and the straw together for your food.", "tj": "", "tj_en": "", "rashi": "<b>ראשית בכורי אדמתך.<\/b> אַף הַשְּׁבִיעִית חַיֶּבֶת בְּבִכּוּרִים, לְכָךְ נֶאֱמַר אַף כָּאן בִּכּוּרֵי אַדְמָתְךָ. כֵּיצַד? אָדָם נִכְנָס לְתוֹךְ שָׂדֵהוּ, רוֹאֶה תְּאֵנָה שֶׁבִּכְּרָה, כּוֹרֵךְ עָלֶיהָ גְּמִי לְסִימָן וּמַקְדִּישָׁהּ, וְאֵין בִּכּוּרִים אֶלָּא בְּשִׁבְעַת הַמִּינִין הָאֲמוּרִין בַּמִּקְרָא – אֶרֶץ חִטָּה וּשְׂעֹרָה וְגוֹ' (בכורים פ\"א):<br><br><b>לא תבשל גדי.<\/b> אַף עֵגֶל וְכֶבֶשׂ בִּכְלַל גְּדִי, שֶׁאֵין גְּדִי אֶלָּא לְשׁוֹן וָלָד רַךְ, מִמַּה שֶּׁאַתָּה מוֹצֵא בְּכַמָּה מְקוֹמוֹת בַּתּוֹרָה שֶׁכָּתוּב גְּדִי וְהֻצְרַךְ לְפָרֵשׁ אַחֲרָיו עִזִּים, כְּגוֹן אָנֹכִי אֲשַׁלַּח גְּדִי עִזִּים (בראשית ל\"ח), אֶת גְּדִי הָעִזִּים (שם), שְׁנֵי גְּדָיֵי עִזִּים (שם כ\"ז), לְלַמֶּדְךָ שֶׁכָּל מָקוֹם שֶׁנֶּאֱמַר גְּדִי סְתָם אַף עֵגֶל וְכֶבֶשׂ בְּמַשְׁמָע. וּבְג' מְקוֹמוֹת נִכְתַּב בַּתּוֹרָה, אֶחָד לְאִסּוּר אֲכִילָה, וְאֶחָד לְאִסּוּר הֲנָאָה, וְאֶחָד לְאִסּוּר בִּשּׁוּל (מכילתא, חולין קט\"ו):", "rashi_en": "ראשית בכורי אדמתך THE FIRST OF THE FIRST-FRUITS OF THY GROUND [THOU SHALT BRING etc.] — Even in the seventh year the offering of the first fruits is obligatory in some cases, therefore here also (where Scripture mainly deals with the laws of the Sabbatical year) it is stated: “the first of the first-fruits of thy land [shalt thou bring, etc.]”. How was the procedure at the setting apart of the first fruits? A man goes into his field and sees a fig which was the first to ripen; he ties a piece of reed-grass round it to distinguish it and so marks its sacred character (Mishnah Bikkurim 3:1). The law of the first fruits applies only to the seven kinds of produce that are mentioned in Scripture: (Deuteronomy 8:8) “a land of wheat and barley etc.”, for which Palestine is praised in that verse (Mishnah Bikkurim 3:1).<br><br>לא תבשל גדי THOU SHALT NOT COOK A KID — A calf and a lamb also are comprehended under the term גדי, for גדי means nothing more than a young tender animal, as you may gather from the fact that you will find in several passages in the Torah that the term גדי is used and that the writer felt it necessary specially to explain it by adding after it the word עזים, as, e. g., (Genesis 38:17) “I will send forth a גדי of the goats”; (Genesis 38: 20) “the גדי of the goats”; (Genesis 27:9) “two kids of the goats (גדיי עזים)”. This fact serves to show you that wherever גדי is mentioned without further description the term implies also a calf and a lamb. — In three different passages the law לא תבשל גדי is written: once for the purpose of prohibiting the eating of meat-food with milk-food, once to prohibit us from deriving any other benefit (besides eating) from such mixture, and once to prohibit the boiling of meat with milk (Mekhilta; Chullin 115b)."}, {"ch": 23, "v": 20, "aliyah": 6, "heb": "הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְפָנֶ֔יךָ לִשְׁמׇרְךָ֖ בַּדָּ֑רֶךְ וְלַהֲבִ֣יאֲךָ֔ אֶל־הַמָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי׃", "onk": "הָא אֲנָא שָׁלַח מַלְאָכָא קֳדָמָךְ לְמִטְרָךְ בְּאָרְחָא וּלְאָעֳלוּתָךְ לְאַתְרָא דִאַתְקֵנִית:", "onk_en": "Behold, I will send an angel before you, to guard you on the way, and to bring you to the place that I have prepared.", "pj": "הָא אֲנָא מְשַׁגֵּר מַלְאָכָא קֳדָמָךְ לְמִטְרָךְ בְּאָרְחָא וּלְאַעֲלוּתָךְ לַאֲתַר שְׁכִינְתִּי דְאִיתְקֵינִית", "pj_en": "Behold, I will send an Angel before thee, to keep thee in the way, and to bring thee in to the place of My habitation which I have prepared.", "tj": "", "tj_en": "", "rashi": "<b>הנה אנכי שלח מלאך.<\/b> כָּאן נִתְבַּשְּׂרוּ שֶׁעֲתִידִין לַחֲטֹא, וּשְׁכִינָה אוֹמֶרֶת לָהֶם כִּי לֹא אֶעֱלֶה בְּקִרְבְּךָ (שמות ל\"ג):<br><br><b>אשר הכנתי.<\/b> אֲשֶׁר זִמַּנְתִּי לָתֵת לָכֶם, זֶהוּ פְּשׁוּטוֹ; וּמִדְרָשׁוֹ <b>אל המקום אשר הכנתי<\/b> כְּבָר מְקוֹמִי כְּנֶגְדּוֹ, וְזֶה אֶחָד מִן הַמִּקְרָאוֹת שֶׁאוֹמְרִים שֶׁבֵּית הַמִּקְדָּשׁ שֶׁל מַעְלָה מְכֻוָּן כְּנֶגֶד שֶׁל מַטָּה (תנחומא):", "rashi_en": "הנה אנכי שלח מלאך BEHOLD, I SEND A MESSENGER [BEFORE THEE] — Here they were informed that they would once sin and that the Divine Majesty would have to tell them, (Exodus 33:3) “for ‘I’ will not go up among thee” (cf. Exodus Rabbah 32:3).<br><br>אשר הכנתי means, WHICH I HAVE PREPARED in order to give unto you. This is the literal meaning of the verse. The Midrash (taking the word as connected in meaning with the term כִּוֵן “to put a thing in a line with” or “to make it correspond with” another thing) explains אל המקום אשר הכנתי to signify “to the place opposite to which I have long since established the seat of my Glory” (“the place” therefore denotes the Temple; cf. Rashi on Exodus 15:17). This is, according to the Midrash, one of the verses which implicitly state that the Temple in Heaven is situated exactly opposite (מְכֻוָּן) that on the earth (Midrash Tanchuma, Mishpatim 18)"}, {"ch": 23, "v": 21, "aliyah": 6, "heb": "הִשָּׁ֧מֶר מִפָּנָ֛יו וּשְׁמַ֥ע בְּקֹל֖וֹ אַל־תַּמֵּ֣ר בּ֑וֹ כִּ֣י לֹ֤א יִשָּׂא֙ לְפִשְׁעֲכֶ֔ם כִּ֥י שְׁמִ֖י בְּקִרְבּֽוֹ׃", "onk": "אִסְתַּמַּר מִן קֳדָמוֹ
