 יָתְהוֹן לָא תִגְזַר לְהוֹן קְיָם וְלָא <b>תְרַחַם<\/b> עֲלֵיהוֹן:", "onk_en": "Adonoy, your God, will defeat them before you, and you will smite them. You must surely annihilate them. Do not make a treaty with them, and do not favor [<b>show mercy on<\/b>] them.", "pj": "וְיִמְסְרִינוּן יְיָ אֱלָהָכוֹן קֳדָמֵיכוֹן וְתִמְחִינוּן גַּמָרָא תְּגַמְרוּן יַתְהוֹן בְּשַׁמַתָּא דַיְיָ לָא תִגְזְרוּן לְהוֹן קְיָים וְלָא תְרַחֲמוּן עֲלֵיהוֹן", "pj_en": "and the Lord your God will deliver them up before you, then shall you blot them out and utterly consume them by the curse of the Lord. You shall strike no covenant with them, nor have pity upon them.", "tj": "", "tj_en": "", "rashi": "<b>ולא תחנם.<\/b> לֹא תִתֵּן לָהֶם חֵן, אָסוּר לוֹ לָאָדָם לוֹמַר \"כַּמָּה נָאֶה גוֹי זֶה\". דָּבָר אַחֵר, לֹא תִּתֵּן לָהֶם חֲנִיָּה בָּאָרֶץ (עבודה זרה כ'):", "rashi_en": "ולא תחנם means, THOU SHALT NOT ASCRIBE GRACE (חן) TO THEM: it is forbidden to a person to say “How beautiful is this heathen”. Another explanation: thou shalt not grant them a חניה, an encampment (a settlement) in the land (Avodah Zarah 20a)."}, {"ch": 7, "v": 3, "aliyah": 7, "heb": "וְלֹ֥א תִתְחַתֵּ֖ן בָּ֑ם בִּתְּךָ֙ לֹא־תִתֵּ֣ן לִבְנ֔וֹ וּבִתּ֖וֹ לֹא־תִקַּ֥ח לִבְנֶֽךָ׃", "onk": "וְלָא תִתְחַתַּן בְּהוֹן בְּרַתָּךְ לָא תִתֵּן לִבְרֵיהּ וּבְרַתֵּיהּ לָא תִסַּב לִבְרָךְ:", "onk_en": "Do not marry them; do not give your daughter to his son, nor take his daughter for your son.", "pj": "לָא תִתְחַתְּנוּן בְּהוֹן בְּנָתֵיכוֹן לָא תִתְּנוּן לִבְנֵיהוֹן וּבְנָתֵיהוֹן לָא תִסְבוּן לִבְנֵיכוֹן דְּכָל מַאן דְּמִתְחַתֵּן בְּהוֹן כְּמִתְחַתֵּן בְּטַעֲוַותְהוֹן", "pj_en": "You shall not intermarry with them; your daughters you shall not give to their sons, nor take their daughters for your sons; for whosoever marrieth with them is as if he made marriage with their idols.", "tj": "לָא תִתְעַרְבוּן:", "tj_en": "You shall not be commixed with them.", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 4, "aliyah": 7, "heb": "כִּֽי־יָסִ֤יר אֶת־בִּנְךָ֙ מֵֽאַחֲרַ֔י וְעָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְחָרָ֤ה אַף־יְהֹוָה֙ בָּכֶ֔ם וְהִשְׁמִידְךָ֖ מַהֵֽר׃", "onk": "אֲרֵי יַטְעֲיַן יָת בְּרָךְ מִבָּתַר <b>פָּלְחָנִי<\/b> וְיִפְלְחוּן <b>לְטַעֲוַת עַמְמַיָּא<\/b> וְיִתְקֵף רָגְזָא דַיְיָ בְּכוֹן וִישֵׁצָךְ בִּפְרִיעַ:", "onk_en": "For he will turn your son away from Me [<b>My service<\/b>] and they will serve other gods [<b>idols of the nations<\/b>]; and Adonoy’s anger will be aroused against you and He will destroy you swiftly.", "pj": "אֲרוּם יַטְעֲיָין בְּנָתֵיהוֹן יַת בְּנֵיכוֹן מִן בָּתַר פּוּלְחָנִי וְיִפְלְחוּן לְטַעֲוַת עַמְמַיָא וְיִתְקוֹף רוּגְזָא דַיְיָ בְּכוֹן וִישֵׁצִינְכוֹן בְּסַרְהוּבַיָא", "pj_en": "For their daughters will lead your sons away from My worship to serve the idols of the Gentiles; so will the anger of the Lord be kindled against you, and He will destroy you suddenly.", "tj": "", "tj_en": "", "rashi": "<b>כי יסיר את בנך מאחרי.<\/b> בְּנוֹ שֶׁל גוֹי כְּשֶׁיִּשָּׂא אֶת בִּתְּךָ יָסִיר אֶת בִּנְךָ אֲשֶׁר תֵּלֵד לוֹ בִתְּךָ מֵאַחֲרַי, לִמְּדָנוּ שֶׁבֶּן בִּתְּךָ הַבָּא מִן הַגּוֹי קָרוּי בִּנְךָ, אֲבָל בֶּן בִּנְךָ הַבָּא מִן הַגּוֹיָה אֵינוֹ קָרוּי בִּנְךָ אֶלָּא בְּנָהּ, שֶׁהֲרֵי לֹא נֶאֱמַר עַל בִּתּוֹ לֹא תִקַּח כִּי תָסִיר אֶת בִּנְךָ מֵאַחֲרַי:", "rashi_en": "כי יסיר את בנך מאחרי FOR HE WILL TURN AWAY THY SON FROM FOLLOWING ME — i.e., the son of the heathen when he marries thy daughter, will turn away thy son (grandson) whom thy daughter will bear unto him from following Me. This teaches us, that thy daughter's son who is born of a heathen is termed thy son, but thy son’s son, who is born of a heathen woman, is not termed thy son, but her son, for, you see, in regard to the statement: “his daughter thou shalt not take [to thy son]\" it does not add “For she will turn away thy son (grandson) from following Me\" (Yevamot 23a)."}, {"ch": 7, "v": 5, "aliyah": 7, "heb": "כִּֽי־אִם־כֹּ֤ה תַעֲשׂוּ֙ לָהֶ֔ם מִזְבְּחֹתֵיהֶ֣ם תִּתֹּ֔צוּ וּמַצֵּבֹתָ֖ם תְּשַׁבֵּ֑רוּ וַאֲשֵֽׁירֵהֶם֙ תְּגַדֵּע֔וּן וּפְסִילֵיהֶ֖ם תִּשְׂרְפ֥וּן בָּאֵֽשׁ׃", "onk": "אֲרֵי אִם כְּדֵין תַּעְבְּדוּן לְהוֹן אֱגוֹרֵיהוֹן תְּתָרְעוּן וְקָמָתְהוֹן תְּתַבְּרוּן וַאֲשֵׁרֵיהוֹן תְּקוֹצְצוּן וְצַלְמֵי <b>טַעֲוָתְהוֹן<\/b> תּוֹקְדוּן בְּנוּרָא:", "onk_en": "Rather, thus shall you do to them: raze their altars and smash their monuments, cut down their worship-trees and burn their statues [<b>idols<\/b>] in fire.", "pj": "אֲרוּם אִין כְּדֵין תַּעַבְדוּן לְהוֹן אִיגוֹרֵיהוֹן תִּסְתְּרוּן וְקָמַתְהוֹן תְּתַבְּרוּן וְאִילָנֵי סִיגְדֵיהוֹן תְּקַצְצוּן וְצַלְמֵי טַעֲוַותְהוֹן תּוּקְדוּן בְּנוּרָא", "pj_en": "But this shall you do to them: you shall destroy their altars, break their statues in pieces, cut down their groves for worship, and burn the images of their idols with fire.", "tj": "", "tj_en": "", "rashi": "<b>מזבחתיהם.<\/b> שֶׁל בִּנְיָן:<br><br><b>ומצבתם.<\/b> אֶבֶן אַחַת:<br><br><b>ואשירהם.<\/b> אִילָנוֹת שֶׁעוֹבְדִין אוֹתָן:<br><br><b>ופסיליהם.<\/b> צְלָמִים:", "rashi_en": "מזבחתיהם — a מזבח is something built up of several stones,<br><br>ומצבתם — alludes to a single stone (cf. Rashi on Deuteronomy 12:3).<br><br>ואשירהם — Trees which they worship (Avodah Zarah 48a).<br><br>ופסליהם — These are images."}, {"ch": 7, "v": 6, "aliyah": 7, "heb": "כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַיהֹוָ֖ה אֱלֹהֶ֑יךָ בְּךָ֞ בָּחַ֣ר&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ לִהְי֥וֹת לוֹ֙ לְעַ֣ם סְגֻלָּ֔ה מִכֹּל֙ הָֽעַמִּ֔ים אֲשֶׁ֖ר עַל־פְּנֵ֥י הָאֲדָמָֽה׃", "onk": "אֲרֵי עַם קַדִּישׁ אַתְּ קֳדָם יְיָ אֱלָהָךְ בָּךְ אִתִּרְעֵי יְיָ אֱלָהָךְ לְמֶהֱוֵי לֵיהּ לְעַם חַבִּיב מִכֹּל עַמְמַיָּא דִּי עַל אַפֵּי אַרְעָא:", "onk_en": "For you are a holy people to Adonoy, your God; Adonoy, your God, chose you to be for Him a treasured people from all the peoples that are on the face of the earth.", "pj": "אֲרוּם עַמָּא קַדִּישָׁא אַתּוּן קֳדָם יְיָ אֱלָהָכוֹן וּבְכוֹן אִתְרְעֵי יְיָ אֱלָהָכוֹן מְטוֹל לְמֶהֱוֵי לֵיהּ לְעַם חָבִיב מִן כֻּלְהוֹן עַמְמַיָא דְעַל אַנְפֵּי אַרְעָא", "pj_en": "For you shall be a holy people before the Lord your God, as the Lord your God hath taken pleasure in you, that you may be a people more beloved before Him than all the peoples who are on the face of the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 7, "aliyah": 7, "heb": "לֹ֣א מֵֽרֻבְּכֶ֞ם מִכׇּל־הָֽעַמִּ֗ים חָשַׁ֧ק יְהֹוָ֛ה בָּכֶ֖ם וַיִּבְחַ֣ר בָּכֶ֑ם כִּֽי־אַתֶּ֥ם הַמְעַ֖ט מִכׇּל־הָעַמִּֽים׃", "onk": "לָא מִדְּסַגִּיאִין אַתּוּן מִכָּל עַמְמַיָּא צָבֵי יְיָ בְּכוֹן וְאִתִּרְעֵי בְכוֹן אֲרֵי אַתּוּן זְעֵרִין מִכָּל עַמְמַיָּא:", "onk_en": "Not because of the multitude your population beyond all peoples did Adonoy desire you and choose you; for you are the least of all the peoples.", "pj": "לָא מִן בִּגְלַל דְּאַתּוּן גֵּיוְתָנִין מִן כֻּלְהוֹן אוּמַיָא צָבֵי יְיָ בְּכוֹן וְאִתְרְעֵי בְּכוֹן אֱלָהֵן דְּאַתּוּן מַכִּיכֵי רוּחָא וְעִנְוְותָנִין מִכָּל עַמְמַיָא", "pj_en": "Not because you were more excellent than all other peoples hath the Lord had pleasure in you and chosen you, but because you were poor in spirit, and more humble than all the nations.", "tj": "", "tj_en": "", "rashi": "<b>לא מרבכם.<\/b> כִּפְשׁוּטוֹ; וּמִדְרָשׁוֹ לְפִי שֶׁאֵין אַתֶּם מַגְדִּילִים עַצְמְכֶם כְּשֶׁאֲנִי מַשְׁפִּיעַ לָכֶם טוֹבָה, לְפִיכָךְ <b>חשק … בכם<\/b><br><br><b>כי אתם המעט<\/b> – הַמְמַעֲטִין עַצְמְכֶם, כְּגוֹן אַבְרָהָם שֶׁאָמַר (בראשית י\"ח) \"וְאָנֹכִי עָפָר וָאֵפֶר\", וּכְגוֹן מֹשֶׁה וְאַהֲרֹן שֶׁאָמְרוּ (שמות ט\"ז) \"וְנַחְנוּ מָה\", לֹא כִנְבוּכַדְנֶאצַּר שֶׁאָמַר (ישעיהו י\"ד) \"אֶדַּמֶּה לְעֶלְיוֹן\", וְסַנְחֵרִיב (שם ל\"ו) שֶׁאָמַר \"מִי בְּכָל אֱלֹהֵי הָאֲרָצוֹת\", וְחִירָם שֶׁאָמַר (י\"ח כ\"ח) \"אֵל אָנִי מוֹשַׁב אֱלֹהִים יָשַׁבְתִּי\" (חולין פ\"ט):<br><br><b>כי אתם המעט.<\/b> הֲרֵי כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן דְּהָא:", "rashi_en": "לא מרבכם NOT ON ACCOUNT OF YOUR BEING [MORE] NUMEROUS — This is to he understood according to its plain sense. But its Midrashic explanation (taking לא מרבכם in the sense of “not because you are great\") is: Because you do not regard yourselves as great when I shower good, upon you, therefore חשק … בכם DID [THE LORD] DELIGHT IN YOU<br><br>כי אתם המעט FOR YOU ARE LITTLE — you regard yourselves as small, as, e.g., Abraham did who said, (Genesis 18:27) “For I am dust and ashes\", and as, e.g., Moses and Aaron did who said, (Exodus 16:7) “And we, what are we?\". Not as Nebuchadnezzar who said, (Isaiah 14:14) “I will be like the Most High\", and Sennacherib who said, (Isaiah 36:20) “Who are they among all the gods of these countries [that have delivered their countries out of my hand?]\", and Hiram who said, (Er. 28:2), “I am a god, I sit in the seat of God\" (Chullin 89a).<br><br>כי אתם המעט — Here you have the word כי used in the sense of “because\"."}, {"ch": 7, "v": 8, "aliyah": 7, "heb": "כִּי֩ מֵאַהֲבַ֨ת יְהֹוָ֜ה אֶתְכֶ֗ם וּמִשׇּׁמְר֤וֹ אֶת־הַשְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַאֲבֹ֣תֵיכֶ֔ם הוֹצִ֧יא יְהֹוָ֛ה אֶתְכֶ֖ם בְּיָ֣ד חֲזָקָ֑ה וַֽיִּפְדְּךָ֙ מִבֵּ֣ית עֲבָדִ֔ים מִיַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ־מִצְרָֽיִם׃", "onk": "אֲרֵי מִדְּרַחַם יְיָ יָתְכוֹן וּמִדִּנְטַר יָת קְיָמָא דִּי קַיִּים לַאֲבָהָתְכוֹן אַפֵּיק יְיָ יָתְכוֹן בִּידָא תַקִּיפָא וּפָרְקָךְ מִבֵּית עַבְדוּתָא מִידָא דְפַרְעֹה מַלְכָּא דְמִצְרָיִם:", "onk_en": "Rather, out of Adonoy’s love for you and out of His keeping the oath that He swore to your forefathers did Adonoy take you out with a strong hand, and did He redeem you from the house of slavery, from the hand of Pharaoh, king of Egypt.", "pj": "אֲרוּם מִן בִּגְלַל דְּרָחִים יְיָ יַתְכוֹן וּמִן דְּנָטִיר יַת קְיָימָא דְקַיֵּים לְאַבְהַתְכוֹן אַפֵּיק יַתְכוֹן פְּרִיקִין בִּידָא תַּקִּיפְתָּא וּפְרִקְכוֹן מִבֵּית שִׁעֲבּוּד עַבְדַיָא מִן יְדָא דְפַרְעה מַלְכָּא דְמִצְרָיִם", "pj_en": "Therefore, because the Lord had mercy on you, and would keep the covenant He had sworn with your fathers, He led you out free with a mighty hand, and redeemed you from the house of the affliction of slaves, from the hand of Pharoh king of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>כי מאהבת ה'.<\/b> הֲרֵי כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא – <b>לא מרבכם חשק ה' בכם<\/b>, אֶלָּא <b>מאהבת ה' אתכם<\/b>:<br><br><b>ומשמרו את השבעה.<\/b> מֵחֲמַת שָׁמְרוֹ אֶת הַשְּׁבוּעָה:", "rashi_en": "כי מאהבת — Here, however, you have the word כי used in the sense of “but\": NOT ON ACCOUNT THAT YE WERE MORE NUMEROUS … DID GOD DELIGHT IN YOU … BUT ON ACCOUNT OF THE LORD'S LOVE TO YOU.<br><br>ומשמרו את השבועה means, on account of His keeping the oath."}, {"ch": 7, "v": 9, "aliyah": 7, "heb": "וְיָ֣דַעְתָּ֔ כִּֽי־יְהֹוָ֥ה אֱלֹהֶ֖יךָ ה֣וּא הָֽאֱלֹהִ֑ים הָאֵל֙ הַֽנֶּאֱמָ֔ן שֹׁמֵ֧ר הַבְּרִ֣ית וְהַחֶ֗סֶד לְאֹהֲבָ֛יו וּלְשֹׁמְרֵ֥י <span class=\"mam-kq-trivial\">מִצְוֺתָ֖ו<\/span> לְאֶ֥לֶף דּֽוֹר׃", "onk": "וְתִדַּע אֲרֵי יְיָ אֱלָהָךְ הוּא אֱלֹּהִים אֱלָהָא מְהֵימְנָא נָטֵר קְיָמָא וְחִסְדָּא לְרַחֲמוֹהִי וּלְנָטְרֵי פִקּוֹדוֹהִי לְאַלְפֵי דָרִין:", "onk_en": "You will know that Adonoy, your God, is <i>the<\/i> God, the trusted Almighty, who keeps the covenant and the kindliness for those who love Him and for those who keep His commandments, for a thousand generations.", "pj": "וְתִנְדְּעוּן אֲרוּם יְיָ אֱלָהָכוֹן הוּא דַיָינָא תַקִּיפָא וּמְהֵימְנָא נְטִיר קְיָימָא וְטִיבוּ לְרַחֲמוֹי צַדִּיקַיָא וּלְנַטְרֵי פִּיקוּדוֹי לְאַלְפֵי דָרִין", "pj_en": "Know therefore that the Lord your God is a Judge, strong and faithful, keeping covenant and mercy with them who love Him and keep His commandments unto a thousand generations,", "tj": "", "tj_en": "", "rashi": "<b>לאלף דור.<\/b> וּלְהַלָּן (דברים ה') הוּא אוֹמֵר \"לַאֲלָפִים\". כָּאן שֶׁהוּא סָמוּךְ אֵצֶל לְשֹׁמְרֵי מִצְוֹתָיו, הוּא אוֹמֵר <b>לאלף<\/b>, וּלְהַלָּן שֶׁהוּא סָמוּךְ אֵצֶל לְאֹהֲבַי, הוּא אוֹמֵר לַאֲלָפִים (סוטה ל\"א):<br><br><b>לאהביו.<\/b> אֵלּוּ הָעוֹשִׂין מֵאַהֲבָה:<br><br><b>ולשמרי מצותיו.<\/b> אֵלּוּ הָעוֹשִׂין מִיִּרְאָה:", "rashi_en": "לאלף דור TO A THOUSAND GENERATIONS — But elsewhere (5:10) it states: to thousands of generations! The explanation is: Here where it is connected with (refers to) \"those who keep His commandments\" it states that God's grace is extended to a thousand generations; but there where it is associated with \"those who love Him\" it states that it is extended to thousands of generations (Sotah 31a); <br><br>לאהביו are those who do the commandments out of love.<br><br>ולשמרי מצותיו are those who do them out of fear."}, {"ch": 7, "v": 10, "aliyah": 7, "heb": "וּמְשַׁלֵּ֧ם לְשֹׂנְאָ֛יו אֶל־פָּנָ֖יו לְהַאֲבִיד֑וֹ לֹ֤א יְאַחֵר֙ לְשֹׂ֣נְא֔וֹ אֶל־פָּנָ֖יו יְשַׁלֶּם־לֽוֹ׃", "onk": "וּמְשַׁלֵּם לְסָנְאוֹהִי <b>טָבָן דִּי אִנּוּן עָבְדִין קֳדָמוֹהִי בְּחַיֵּיהוֹן<\/b> לְאוֹבָדֵיהוֹן לָא מְאַחַר <b>עֹבַד טָב<\/b> לְסָנְאוֹהִי <b>טַבְוָן דִּי אִנּוּן עָבְדִין קֳדָמוֹהִי בְּחַיֵּיהוֹן<\/b> מְשַׁלֵּם <b>לְהוֹן<\/b>:", "onk_en": "And He pays His enemy [<b>for the good that they have done before Him<\/b>] to his face [<b>in their lifetime<\/b>] to destroy him. He does not delay [<b>to do good<\/b>] for His enemy [<b>for the good that they have done before Him<\/b>]—to his face [<b>in their lifetime<\/b>] does He pay him [<b>them<\/b>].", "pj": "וּמְשַׁלֵּם לְסַנְאוֹי אֲגַר עוֹבָדֵיהוֹן טַבְיָא בְּעַלְמָא הָדֵין מִן בִּגְלַל דִּמְשֵׁיצְיָא יַתְהוֹן בְּעַלְמָא דְּאָתֵי וְלָא מַשְׁהֵי לְסַנְאוֹי אֶלָא עַד דְּהִינוּן בְּחַיִּין בְּעַלְמָא הָדֵין מְשַׁלֵּם לְהוֹן גּוּמְלֵיהוֹן", "pj_en": "and who repayeth to them who hate Him the reward of their good works in this world, to destroy them (for their evil works) in the world to come; neither delayeth He (to reward) His enemies, but while they are alive in this world He payeth them their recompense.", "tj": "וּמְשַׁלֵּם לְשַנְאוֹי אֲגַר מִצְוַן קְלִילִין דְּאִית בִּידֵיהוֹן בְּעַלְמָא הָדֵין מִן בִּגְלַל לְמֵישֵׁיצְיָא יַתְהוֹן לְעַלְמָא דְאָתִי וְלָא מַשְׁהֵי לִמְשַׁלְמָא לְשַנְאוֹי אֲגַר מִצְוָון קְלִילִין דְּאִית בִּידֵיהוֹן בְּעַלְמָא הָדֵין:", "tj_en": "And he repayeth them who hate Him for their little deeds of good which are in their hands in this world, to destroy them in the world to come; nor doth He delay to render to them that hate Him the reward of the slight works that are in their hands in this world.", "rashi": "<b>ומשלם לשנאיו אל פניו.<\/b> בְּחַיָּיו מְשַׁלֵּם לוֹ גְמוּלוֹ הַטּוֹב, כְּדֵי לְהַאֲבִידוֹ מִן הָעוֹלָם הַבָּא:", "rashi_en": "ומשלם לשנאיו אל פניו AND HE REPAYETH THEM THAT HATE HIM TO THEIR FACE [IN ORDER TO MAKE THEM PERISH] — i.e. during their lifetime (cf. Rashi on Genesis 11:28 s. v. על פני) he repayeth them their good recompense, in order to banish them from the future world (cf. Onkelos)."}, {"ch": 7, "v": 11, "aliyah": 7, "heb": "וְשָׁמַרְתָּ֨ אֶת־הַמִּצְוָ֜ה וְאֶת־הַֽחֻקִּ֣ים וְאֶת־הַמִּשְׁפָּטִ֗ים אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּךָ֛ הַיּ֖וֹם לַעֲשׂוֹתָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִטַּר יָת תַּפְקֶדְתָּא וְיָת קְיָמַיָּא וְיָת דִּינַיָּא דִי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין לְמֶעְבָּדְהוֹן:", "onk_en": "You are to guard the commandments and the statutes and the laws that I am commanding you today, to fulfill.", "pj": "וְתִנְטְרוּן יַת תַּפְקֵידְתָּא וְיַת קְיָמַיָא וְיַת דִּינַיָא דַּאֲנָא מְפַקֵּיד יַתְכוֹן לְמֶעֱבַדְהוֹן", "pj_en": "Observe therefore the mandates, the statutes, and judgments which I command you, to perform them.", "tj": "", "tj_en": "", "rashi": "<b>היום לעשותם.<\/b> וּלְמָחָר, לָעוֹלָם הַבָּא, לִטֹּל שְׂכָרָם (עירובין כ\"ב):", "rashi_en": "היום לעשותם [WHICH I COMMANDED THEE] TO-DAY TO DO THEM — to do them to-day, but only in the time to come — in the future world — to receive the reward for them (Eruvin 22a)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
