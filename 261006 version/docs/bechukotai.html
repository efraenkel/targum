ain the text addressed to Aaron (Numbers 18:14) “every חרם in Israel shall be thine” (i. e. the priest’s)? Then I reply that I explain it to refer to חרמים expressly made for priests, i. e. that the donor expressly said, “this shall be a doomed thing for the priests” (so that it is not a סתם חרם). Others, however, say, that all things declared doomed without any statement as to their purpose go to the priests (in accordance with Numbers 18:14) (Arakhin 28b).<br><br>לא ימכר ולא יגאל IT SHALL NOT BE SOLD NOR REDEEMED but shall be given to the priest. Now, according to him who holds that “doomed things not specially assigned” go to the priests, this verse must be explained as referring to such “unassigned doomed things”. He, however, who holds that “unassigned doomed things” go for the Temple repair, explains this verse as referring to such “doomed things” that were expressly declared to be for the priests, since all agree that such doomed things intended for the priests cannot be redeemed before they came into the possession of the priest (when the priest may do whatever he likes with them, because they are חולין; Scripture is thus right in stating 'לא ימכר וכו‎), whilst doomed things intended for the Most High (i. e. for the Sanctuary) are redeemable (Arakhin 29b).<br><br>כל חרם קדש קדשים הוא EVERY DOOMED THING IS MOST HOLY — He who holds that “unassigned doomed things” go to the Temple repair produces evidence from here that his assertion is correct, whilst he who holds that “unassigned doomed things” go to the priests explains the words: 'כל חרם קדש קדשים הוא לה as meaning: every doomed thing of that which is most holy (חרם is construct!) shall be the Lord’s and as intended to teach that חרמים made for the priests are applicable to objects holy in the highest degree (e. g. if one says, \"This burnt-offering shall be doomed to the priests”) and to subjects holy in a minor degree (e. g. a firstborn animal) and he gives its value to the priest, as we learn in Treatise Arakhin 28b: If it is a נדר (cf. for this term Leviticus 22:18) he pays the full value of it, and if it is a נדבה (Leviticus 22:18) he only pays the value of the gratification he might have of it.<br><br>מאדם [NO DOOMED THING…] OF MAN […SHALL BE SOLD OR REDEEMED] — for instance, in the case that he has declared as חרם his Canaanite man-servants or maid-servants (Arakhin 28a)."}, {"ch": 27, "v": 29, "aliyah": 7, "heb": "כׇּל־חֵ֗רֶם אֲשֶׁ֧ר יׇחֳרַ֛ם מִן־הָאָדָ֖ם לֹ֣א יִפָּדֶ֑ה מ֖וֹת יוּמָֽת׃", "onk": "כָּל חֶרְמָא דִּי יִתַּחְרַם מִן אֱנָשָׁא לָא יִתְפָּרָק אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Any dedication that a man will dedicate, regarding a man [due to be put to death] cannot be redeemed, he shall surely be put to death.", "pj": "כָּל אַפְרָשָׁא דִי יִתְפְּרַשׁ מִן אֵינָשָׁא לָא יִתְפְּרֵק בְּכַסְפָּא אֱלָהִין בְּעִלְוַון וּבְנִכְסַת קוּדְשִׁין וּבְמִבְעֵי רַחֲמִין קֳדָם יְיָ מְטוּל דְדֵין קְטוֹל מִתְחַיֵיב", "pj_en": "Every separation which shall be separated of man shall not be redeemed with money, but with burnt offerings, and with sanctified victims, and with supplication for mercy before the Lord, because such are to be put to death.", "tj": "כָּל אַפְרָשׁוּ דְּאַפְרֵשׁ מִן בְּנֵי אֱנָשָׁא לָא תִתְפְּרֵק מִתְקְטָלָא יִתְקְטֵיל:", "tj_en": "Every one of the children of men set apart (or devoted) shall not be redeemed; dying, he shall be put to death.", "rashi": "<b>כל חרם אשר יחרם וגו'.<\/b> הַיּוֹצֵא לֵהָרֵג וְאָמַר אֶחָד עֶרְכּוֹ עָלַי, לֹא אָמַר כְּלוּם (ספרא; ערכין ו'):<br><br><b>מות יומת.<\/b> הֲרֵי הוֹלֵךְ לָמוּת, לְפִיכָךְ לֹא יִפָּדֶה — אֵין לוֹ לֹא דָמִים וְלֹא עֵרֶךְ:", "rashi_en": "'כל חרם אשר יחרם וגו‎ NONE DOOMED WHO SHALL BE DOOMED OF MAN, [SHALL  BE RELEASED] — This means, if a person is going to be executed and someone says, “I take upon myself to pay his ערך” he has said nothing (his vow is of none effect) (Arakhin 6b).<br><br>מות יומת, you see, he is going to be put to death, and he therefore cannot be redeemed, — he has neither a market-value (דמים) nor an ‎ערך.‎"}, {"ch": 27, "v": 30, "aliyah": 7, "heb": "וְכׇל־מַעְשַׂ֨ר הָאָ֜רֶץ מִזֶּ֤רַע הָאָ֙רֶץ֙ מִפְּרִ֣י הָעֵ֔ץ לַיהֹוָ֖ה ה֑וּא קֹ֖דֶשׁ לַֽיהֹוָֽה׃", "onk": "וְכָל מַעְשְׂרָא דְאַרְעָא מִזַּרְעָא דְאַרְעָא מִפֵּרֵי אִילָנָא דַּיְיָ הוּא קוּדְשָׁא קֳדָם יְיָ:", "onk_en": "All tithings of the land; whether of the seeds [crops] of the land or of the fruit of the tree, belongs to Adonoy, it is sacred to [<b>before<\/b>] Adonoy.", "pj": "וְכָל מַעַשְרָא דְאַרְעָא מִזַרְעָא דְאַרְעָא וּמִפֵּירֵי אִילָנָא דַיְיָ הוּא קוֹדֶשׁ קוּדְשִׁין הוּא קֳדָם יְיָ", "pj_en": "And all the tythe of the land, of the seed of the ground, or the fruits of the tree, is the Lord's, and is most sacred before the Lord.", "tj": "לִשְׁמָא דַיְיָ הִיא קוּדְשָׁא לִשְׁמָא דַיְיָ:", "tj_en": "It pertaineth to the Name of the Lord; it is holy unto the Name of the Lord.", "rashi": "<b>וכל מעשר הארץ.<\/b> בְּמַעֲשֵׂר שֵׁנִי הַכָּתוּב מְדַבֵּר:<br><br><b>מזרע הארץ.<\/b> דָּגָן:<br><br><b>מפרי העץ.<\/b> תִּירוֹשׁ וְיִצְהָר:<br><br><b>לה' הוא.<\/b> קְנָאוֹ הַשֵּׁם. וּמִשֻּׁלְחָנוֹ צִוָּה לְךָ לַעֲלוֹת וְלֶאֱכֹל בִּירוּשָׁלַיִם, כְּמוֹ שֶׁנֶּאֱמַר (דברים י\"ד), וְאָכַלְתָּ לִפְנֵי ה' אֱלֹהֶיךָ, מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְגוֹ' (עי' קידושין נ\"ד):", "rashi_en": "‎ ‎וכל מעשר הארץ AND ANY TITHE OF THE LAND… [BELONGETH TO THE LORD] — Scripture is speaking here of the “second tithe”.<br><br>מזרע הארץ OF THE SEED OF THE EARTH — i. e. of grain,<br><br>מפרי העץ OF THE FRUIT OF THE TREE — i. e. wine and oil,<br><br>לה' הוא BELONGETH TO THE LORD — the Lord has acquired it (it is His possession) and it is from His table that He bids you to carry up (להעלות = לעלות) and to eat in Jerusalem (Kiddushin 53b), as it is said, (Deuteronomy 14:23) “And thou shalt eat before the Lord, thy God,… the tithe of thy corn, of thy wine, etc.”."}, {"ch": 27, "v": 31, "aliyah": 7, "heb": "וְאִם־גָּאֹ֥ל יִגְאַ֛ל אִ֖ישׁ מִמַּֽעַשְׂר֑וֹ חֲמִשִׁית֖וֹ יֹסֵ֥ף עָלָֽיו׃", "onk": "וְאִם מִפְרַק יִפְרוֹק גְּבַר מִמַּעַשְׂרֵיהּ חֻמְשֵׁיהּ יוֹסֵף עֲלוֹהִי:", "onk_en": "If a man wishes to redeem of his tithe, he shall add a fifth to [the amount].", "pj": "וְאִין מִפְרוֹק יִפְרוֹק גְבַר מִמַעַשְרֵיהּ חוֹמֶשׁ דְמוֹי יוֹסֵף עֲלוֹי", "pj_en": "But if a man will redeem any (part) of his tythes, he shall add a fifth part of its value thereunto.", "tj": "וְאֵין מִפְרוֹק יִפְרוֹק גְּבַר מִן מַעַשְרֵיהּ חוֹמֶשׁ דְּמוֹי יוֹסֵף עֲלוֹי:", "tj_en": "But if a man will redeem any portion of his tythe, let him add upon, it a fifth part of its price;", "rashi": "<b>ממעשרו.<\/b> וְלֹא מִמַּעְשַׂר חֲבֵרוֹ — הַפּוֹדֶה מַעֲשֵׂר שֶׁל חֲבֵרוֹ אֵין מוֹסִיף חֹמֶשׁ, וּמַה הִיא גְאֻלָּתוֹ? יִפְדֶנּוּ כְּדֵי לְהַתִּירוֹ בַאֲכִילָה בְכָל מָקוֹם, וְהַמָּעוֹת יַעֲלֶה וְיֹאכַל בִירוּשָׁלַיִם, כְּמוֹ שֶׁנֶּאֱמַר (דברים י\"ד), וְנָתַתָּה בַּכָּסֶף וְגוֹ' (עי' קידושין כ\"ד):", "rashi_en": "ממעשרו [AND IF A MAN WILL REDEEM] OUGHT OF HIS TITHES [HE SHALL ADD THERETO ITS FIFTH] — of his tithes, but not of the tithes of his fellow: if he redeems the tithe of his fellow he need not add its fifth (Kiddushin 24a). Wherein consists the redemption of the “second tithe” (since it is permitted as food to the owner)? He redeems it in so far as he makes it permissible for food at any place (which is not the case if he does not redeem it) and the redemption-money he brings up to Jerusalem, buys eatables and eats them there as it is said, (Deuteronomy 14:25, 26) “Then thou shalt put into money… [and thou shalt lay out that money… for cattle, for sheep etc.]”."}, {"ch": 27, "v": 32, "aliyah": 7, "heb": "וְכׇל־מַעְשַׂ֤ר בָּקָר֙ וָצֹ֔אן כֹּ֥ל אֲשֶׁר־יַעֲבֹ֖ר תַּ֣חַת הַשָּׁ֑בֶט הָֽעֲשִׂירִ֕י יִֽהְיֶה־קֹּ֖דֶשׁ לַֽיהֹוָֽה׃", "onk": "וְכָל מַעֲשַׂר תּוֹרִין וְעָן כֹּל דְּיֵעִבַּר תְּחוֹת חֻטְרָא עֲשִׂירָאָה יְהֵי קַדִּישׁ קֳדָם יְיָ:", "onk_en": "All tithes of cattle and sheep, anything that passes under the rod, the tenth one shall be sacred to [<b>before<\/b>] Adonoy.", "pj": "וְכָל מַעַשְרָא דְתוֹרֵי וְעָנֵי כָּל דְחַלְפוּן תְּחוֹת שַׁרְבִיטָא עֲשִירָאָה יְהֵי קוּדְשָׁא קֳדָם יְיָ", "pj_en": "And every tythe of oxen and sheep, whatever passeth under the (tything) rod, the tenth shall be consecrated before the Lord.", "tj": "וְכָל מַעֲשְרָא דְּתּוֹרָא וּדְעָנָא כָּל דִּיעִבַר תְּחוֹת שַׁרְבִיטָא עֲשִירָאָה יֶהֱוֵי קוּדְשָׁא לִשְׁמָא דַיְיָ:", "tj_en": "and every tythe of ox and sheep, whatever passeth under the rod, a tenth shall be holy Unto the Name of the Lord.", "rashi": "<b>תחת השבט.<\/b> כְּשֶׁבָּא לְעַשְּׂרָן, מוֹצִיאָן בַּפֶּתַח זֶה אַחַר זֶה, וְהָעֲשִֹירִי מַכֶּה בְּשֵׁבֶט צְבוּעָה בְסִקְרָא, לִהְיוֹת נִכָּר שֶׁהוּא מַעֲשֵׂר, כֵּן עוֹשֶׂה לִטְלָאִים וְלַעֲגָלִים שֶׁל כָּל שָׁנָה וְשָׁנָה (בכו' נ\"ח):<br><br><b>יהיה קדש.<\/b> לִקְרַב לַמִּזְבֵּחַ דָּמוֹ וְאֵמוּרָיו, וְהַבָּשָׂר נֶאֱכָל לַבְּעָלִים, שֶׁהֲרֵי לֹא נִמְנָה עִם שְׁאָר מַתְּנוֹת כְּהֻנָה, וְלֹא מָצִינוּ שֶׁיְּהֵא נָתוּן בְּשָׂרוֹ לַכֹּהֲנִים:", "rashi_en": "תחת השבט [WHATEVER PASSES] UNDER THE ROD — When he is about to tithe them (the cattle), he passes them through a door one after the other and the tenth he strikes with a rod smeared with red dye so that it should afterwards be recognised as being one of the tithe. Thus he does to the young sheep and to the calves of each separate year (Bekhorot 58b).<br><br>יהיה קדש [THE TENTH] SHALL BE HOLY [UNTO THE LORD] — inasmuch as its blood and its fat portions have to be burnt on the altar; the flesh, however, may be eaten by the owner, for we do not find it enumerated among “the gifts of the priests” (Numbers ch. 18), nor do we find in the Torah elsewhere that its flesh should be given to the priests."}, {"ch": 27, "v": 33, "aliyah": 7, "heb": "לֹ֧א יְבַקֵּ֛ר בֵּֽין־ט֥וֹב לָרַ֖ע וְלֹ֣א יְמִירֶ֑נּוּ וְאִם־הָמֵ֣ר יְמִירֶ֔נּוּ וְהָֽיָה־ה֧וּא וּתְמוּרָת֛וֹ יִֽהְיֶה־קֹּ֖דֶשׁ לֹ֥א יִגָּאֵֽל׃", "onk": "לָא יְבַקַּר בֵּין טַב לְבִישׁ וְלָא יְחַלְּפִנֵּיהּ וְאִם חַלָּפָא יְחַלְּפִנֵּיהּ וִיהֵי הוּא וְחִלּוּפֵיהּ יְהֵי קוּדְשָׁא לָא יִתְפָּרָק:", "onk_en": "He shall not make a distinction between better or worse [animals] and he shall not exchange it. If he exchanges one for another, then [both] it and its replacement shall be sacred and it cannot be redeemed.", "pj": "לָא יְפַשְׁפֵשׁ בֵּין טַב לְבִישׁ וְלָא יְפַרְגִינֵיהּ וְאִין מִפְרוֹג יְפַרְגִינֵיהּ וִיהֵי הוּא וּפֵירוּגֵיהּ יְהֵי קוּדְשָׁא לָא יִתְפְּרוֹק", "pj_en": "He shall not scrutinize between the good and the bad, nor exchange it; but if changing he will exchange it, both it and that for which it is changed shall be sacred, and not be redeemed.", "tj": "לָא יְפַשְׁפֵּשׁ בֵּין טַב לְבִּישׁ וְלָא יַפְרֵג יָתֵיה וְאִם פְּרָגָא יִפְרַג יָתֵיה וּיֶהֱוֵי הוּא וּפֵּירוּגֵיה יֶהֱוֵי קוּדְּשָׁא וְלָא יִתְפְּרֵג:", "tj_en": "He shall not scrutinize between good and bad, nor exchange it; but if he will change it, then shall both it and that for which it is changed be sacred, and not be redeemed.", "rashi": "<b>לא יבקר וגו'.<\/b> לְפִי שֶׁנֶּאֱמַר \"וְכֹל מִבְחַר נִדְרֵיכֶם\" (דברים י\"ב), יָכוֹל יְהֵא בוֹרֵר וּמוֹצִיא אֶת הַיָּפֶה, תַּ\"לֹ \"לֹא יְבַקֵּר בֵּין טוֹב לָרַע\" — בֵּין תָּם בֵּין בַּעַל מוּם חָלָה עָלָיו קְדֻשָּׁה — וְלֹא שֶׁיִּקְרַב בַּעַל מוּם, אֶלָּא יֵאָכֵל בְּתוֹרַת מַעֲשֵׂר וְאָסוּר לִגָּזֵז וְלֵעָבֵד (עי' בכורות י\"ד):", "rashi_en": "לא ‎'יבקר וגו‎ HE SHALL NOT SEEK OUT, [WHETHER IT BE GOOD OR BAD — Since it is stated, (.Deut 12:11) “[thither shall ye bring…] all your choice vows” I might think he shall select and take out the choicest! Scripture therefore states here, “he shall not seek out whether it be good or bad”  —whether it be perfect in limb or whether it have a blemish the sanctity attached to the tithe applies to it; not, however, in the sense that being blemished it may be offered, but it must be eaten under the observance of the regulations relating to the tithe, and must neither be shorn of its wool nor be employed in work (cf. Bekhorot 14b)."}, {"ch": 27, "v": 34, "aliyah": 7, "heb": "אֵ֣לֶּה הַמִּצְוֺ֗ת אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֶת־מֹשֶׁ֖ה אֶל־בְּנֵ֣י יִשְׂרָאֵ֑ל בְּהַ֖ר סִינָֽי׃", "onk": "אִלֵּין פִּקּוֹדַיָּא דִּי פַקִּיד יְיָ יָת משֶׁה לְוָת בְּנֵי יִשְׂרָאֵל בְּטוּרָא דְּסִינָי:", "onk_en": "These are the commandments which Adonoy commanded Moshe for Bnei Yisroel on Mount Sinai. <b>Chazak<\/b>", "pj": "אִילִין פִּקוּדַיָא דְפַקֵיד יְיָ יַת משֶׁה וְלֵית אֶפְשַׁר לְחַדְתָּא בְּהוֹן מִדַעַם וּפַקֵדִינוּן מְטוֹל לְאַחְוָואוּתְהוֹן לְוַת בְּנֵי יִשְרָאֵל בְּטוּרָא דְסִינַי", "pj_en": "These are the precepts which the Lord prescribed unto Mosheh, and of which not one must be trifled with (or, innovated upon); and He prescribed them to be shown Unto the children of Israel at Mount Sinai.", "tj": "אִלֵין פִּקוּדַיָּא:", "tj_en": "These are the Commandments.", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let theme = null;

document.getElementById('themeBtn').addEventListener('click', () => {

});

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
