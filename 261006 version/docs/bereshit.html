nbsp;", "onk": "וְתָרִךְ יָת אָדָם וְאַשְׁרֵי מִלְּקַדְמִין לְגִינְתָא דְעֵדֶן יָת כְּרוּבַיָּא וְיָת שְׁנַן חַרְבָּא דְּמִתְהַפְּכָא לְמִיטַר יָת אוֹרַח אִילַן חַיָּיא:", "onk_en": "He banished the man [from the Garden] and at the east of [<b>before<\/b>] the Garden of Eden He stationed the Cherubim and the flame of the rotating sword, to guard the way to the Tree of Life.", "pj": "וּטְרַד יַת אָדָם מִן דְאַשְׁרֵי יְקַר שְׁכִינְתֵּיהּ מַן לְקַדְמִין בֵּין תְּרֵין כְּרוּבַיָא קֳדָם עַד לָא בְּרָא עַלְמָא בְּרָא אוֹרַיְיתָא וְאַתְקִין גִינְתָא דְעֵדֶן לְצַדִיקַיָיא דִיֵיכְלוֹן וְיִתְפַּנְקוּן מִן פֵּירֵי אִילָנָא עַל דִי פְּלָחוּ בְּחַיֵיהוֹן בְּאוּלְפַן אוֹרַיְיתָא בְּעַלְמָא הָדֵין וְקַיְימוּ פִּקוּדַיָא אַתְקִין גֵיהִנָם לְרַשִׁיעַיָיא דִמְתִילָא לְחַרְבָּא שְׁנִינָא אָכְלָה מִתְּרֵין סִטְרִין אַתְקִין בְּגַווָהּ זִיקוּקוּן דִינוּר וְגוּמְרִין דְאֵשָׁתָא לְמִידַן בְּהוֹן לְרַשִׁיעַיָיא דְמָרְדוּ בְּחַיֵיהוֹן בְּאוּלְפַן אוֹרַיְיתָא טַבְתָא הוּא אוֹרַיְיתָא לְפַלְחָהּ מִן פֵּירֵי אִילַן חַיָיא דְאַתְקְנָהָא מֵימַר דַיְיָ לְנַטוֹרְהָא דִיהֵי קְיָים וּמְטַיֵיל בִּשְׁבִילֵי אָרְחָא דְחַיֵי לְעַלְמָא דְאָתֵי", "pj_en": "And He drave out the man from thence where He had made to dwell the glory of His Shekina at the first between the two Kerubaia. Before He had created the world, He created the law; He prepared the garden of Eden for the righteous, that they might eat and delight themselves with the fruit of the tree; because they would have practised in their lives the doctrine of the law in this world, and have maintained the commandments: (but) he prepared Gehinnam for the wicked, which is like the sharp, consuming sword of two edges; in the midst of it He hath prepared flakes of fire and burning coals for the judgment of the wicked who rebelled in their life against the doctrine of the law. To serve the law is better than (to eat of) the fruit of the tree of life, (the law) which the Word of the Lord prepared, that man in keeping it might continue, and walk in the paths of the way of life in the world to come.", "tj": "וּטְרַד יַת אָדָם וְאַשְׁרֵי יְקַר שְׁכִינְתֵּיהּ מִן לְקַדְמִין מִמַדְנַח לְגִנְתָא דְעֵדֶן מֵעִילַוֵי תְּרֵין כְּרוֹבַיָא קֳדָם עַד לָא נִבְרָא עַלְמָא תְּרֵין אַלְפִין שְׁנִין בָּרָא אוֹרַיְיתָא וְאַתְקִין גֵיהִנָם וְגִנְתָא דְעֵדֶן אַתְקִין גִנְתָא דְעֵדֶן לְצַדִיקַיָא דְיֵיכְלוּן וְיִתְפַּנְקוּן מִן פֵּירֵי אִילָנָא עַל דְנַטְרוּ מִצְוָותָא דְאוֹרַיְיתָא בְּעַלְמָא הָדֵין אַתְקֵן גֵיהִנָם לְרַשִׁיעַיָא דְהוּא מְדַמְיָא לְחַרְבָּא שִׁנוּנָא אָכְלָה מִתְּרֵין סִטְרָהּ אַתְקֵן בְּגַוָהּ זִיקוּקִין דְנוּרָא וְגוּמְרִין מְבַעֲרָן לְרַשִׁיעַיָא לְהִתְפָּרַע מִנְהוֹן לְעַלְמָא דְאָתֵי עַל דְלָא נְטָרוּ מִצְוָותָא דְאוֹרַיְיתָא בְּעַלְמָא הָדֵין אֲרוּם אִילַן דְחַיָיא הוּא אוֹרַיְיתָא כָּל דְנָטַר לָהּ בְּעַלְמָא הָדֵין הֱוֵי חַי וְקַיָים בְּאִילָנָא דְחַיֵי טָבָא הוּא אוֹרַיְיתָא לְפַלְחָהּ בְּעַלְמָא הָדֵין הֵיךְ פְּרִי אִילַן דְחַיֵי לְעַלְמָא דְאָתֵי:", "tj_en": "And He cast out Adam, and made the glory of His Shekina to dwell at the front of the east of the garden of Eden, above the two Kerubaia. Two thousand years before He had created the world, He created the law, and prepared Gehinnam and the Garden of Eden. He prepared the garden of Eden for the righteous, that they should eat, and delight themselves with the fruit of the tree, because they had kept the commandments of the law in this world. For the wicked He prepared Gehinnam, which is like the sharp, consuming sword with two edges. He prepared in the depth of it flakes of fire and burning coals for the wicked, for their punishment for ever in the world to come, who have not kept the commandment of the law in this world. For the law is the tree of life; whoever keepeth it in this life liveth and subsisteth as the tree of life. The law is good to keep in this world, as the fruit of the tree of life in the world that cometh.", "rashi": "<b>מקדם לגן עדן.<\/b> בְּמִזְרָחוֹ שֶׁל גַּן עֵדֶן חוּץ לַגַּן:<br><br><b>את הכרובים.<\/b> מַלְאֲכֵי חַבָּלָה:<br><br><b>החרב המתהפכת.<\/b> וְלָהּ לַהַט לְאַיֵּם עָלָיו מִלִּכָּנֵס עוֹד לַגַּן תַּרְגּוּם לַהַט שְׁנַן, כְּמוֹ שָׁלַף שְׁנָנָא וּבִלְשׁוֹן לַעַז לא\"מא וּמִדְרְשֵׁי אַגָּדָה יֵשׁ, וַאֲנִי אֵינִי בָא אֶלָּא לִפְשׁוּטוֹ:", "rashi_en": "מקדם לגן עדן AT THE EAST OF THE GARDEN OF EDEN — Not in the eastern part of the Garden but eastward of the garden of Eden and outside the garden.<br><br>את הכרבים THE CHERUBIM — Angels of destruction (Exodus Rabbah 9:11).<br><br>החרב המתהפכת THE SWORD TURNING ITSELF — It was a revolving sword and consequently had a להט, a flashing flame for the purpose of frightening him so that he should not enter again into the garden. The Targum of להט, however, is שנן, like (Sanhedrin 82a) שלף שננא he drew his blade; old French lame. There are Agadic Midrashim, but I come only to explain it according to its plain sense."}, {"ch": 4, "v": 1, "aliyah": 4, "heb": "וְהָ֣אָדָ֔ם יָדַ֖ע אֶת־חַוָּ֣ה אִשְׁתּ֑וֹ וַתַּ֙הַר֙ וַתֵּ֣לֶד אֶת־קַ֔יִן וַתֹּ֕אמֶר קָנִ֥יתִי אִ֖ישׁ אֶת־יְהֹוָֽה׃", "onk": "וְאָדָם יְדַע יָת חַוָּה אִתְּתֵהּ וְעַדִּיאַת וִילִידַת יָת קַיִן וַאֲמֶרֶת קָנִיתִי גַּבְרָא (מִן) <b>קֳדָם<\/b> יְיָ:", "onk_en": "The man knew his wife, Chavah. She conceived and she gave birth to Kayin, and she said, I have obtained a man with [<b>the help of<\/b>] Adonoy.", "pj": "וְאָדָם יְדַע יַת חַוָה אִיתְּתֵיהּ דַהֲוָה חֲמֵידַת לְמַלְאָכָא וְאַעֲדִיאַת וִילֵידַת יַת קַיִן וַאֲמָרַת קָנִיתִי לְגַבְרָא יַת מַלְאָכָא דַיְיָ", "pj_en": "And Adam knew Hava his wife, who had desired the Angel; and she conceived, and bare Kain; and she said, I have acquired a man, the Angel of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>והאדם ידע.<\/b> כְּבָר קֹדֶם הָעִנְיָן שֶׁל מַעְלָה, קֹדֶם שֶׁחָטָא וְנִטְרַד מִגַּן עֵדֶן, וְכֵן הַהֵרָיוֹן וְהַלֵּדָה, שֶׁאִם כָּתַב וַיֵּדַע אָדָם, נִשְׁמָע שֶׁלְּאַחַר שֶׁנִּטְרַד הָיוּ לוֹ בָנִים:<br><br><b>קין.<\/b> עַל שֵׁם קָנִיתִי:<br><br><b>את ה'.<\/b> כְּמוֹ עִם ה', כְּשֶׁבָּרָא אוֹתִי וְאֶת אִישִׁי, הוּא לְבַדּוֹ בְּרָאָנוּ אֲבָל בָּזֶה שֻׁתָּפִים אָנוּ עִמּוֹ (נדה ל\"א):<br><br><b>את קין את אחיו את הבל.<\/b> ג' אֶתִים רִבּוּיִים הֵם, מְלַמֵּד, שֶׁתְּאוֹמָה נוֹלְדָה עִם קַיִן, וְעִם הֶבֶל נוֹלְדוּ שְׁתַּיִם, לְכָךְ נֶאֱמַר וַתֹּסֶף (בראשית רבה):", "rashi_en": "(1) והאדם ידע AND THE MAN KNEW already before the events related above took place — before he sinned and was driven out of the Garden of Eden. So, also, the conception and birth of Cain took place before this. Had it been written, וידע אדם it would imply that after he was driven out children were born to him (Genesis Rabbah 22:2).<br><br>קין — She called him so with reference to her use of the word.<br><br>ה‘ — ;את קניתי is like ‘עם ה “with the Lord”; she meant to say: when He created me and my husband He created us by Himself, but in the case of this one we are copartners with Him (cf. Niddah 31a).<br><br>את קין… את אחיו את הבל —The threefold ‘את’ signify extension of the scope of the text, teaching that a twin sister was born with Cain, and that with Abel two were born; consequently the text states ותוסף “and she bore more’’ than the previous time (Genesis Rabbah 22:3)."}, {"ch": 4, "v": 2, "aliyah": 4, "heb": "וַתֹּ֣סֶף לָלֶ֔דֶת אֶת־אָחִ֖יו אֶת־הָ֑בֶל וַֽיְהִי־הֶ֙בֶל֙ רֹ֣עֵה צֹ֔אן וְקַ֕יִן הָיָ֖ה עֹבֵ֥ד אֲדָמָֽה׃", "onk": "וְאוֹסִיפַת לְמֵילַד יָת אֲחוֹהִי יָת הָבֶל וַהֲוָה הֶבֶל רָעֵי עָנָא וְקַיִן הֲוָה פָלַח בְּאַרְעָא:", "onk_en": "She gave birth again, to his brother Hevel. Hevel became a shepherd, but Kayin was a worker of the soil.", "pj": "וְאוֹסִיפַת לְמֵילַד מִן בַּעֲלָהּ אָדָם יַת תְּיוּמָתֵיהּ וְיַת הֶבֶל וַהֲוָה הֶבֶל רָעֵי עָנָא וְקַיִן הֲוָה גְבַר פְּלַח בְאַרְעָא", "pj_en": "And she added to bear from her husband Adam his twin, even Habel. And Habel was a shepherd of the flock, but Kain was a man working in the earth.", "tj": "", "tj_en": "", "rashi": "<b>רעה צאן.<\/b> לְפִי שֶׁנִּתְקַלְּלָה הָאֲדָמָה פֵּרֵשׁ לוֹ מֵעֲבוֹדָתָהּ:", "rashi_en": "רעה צאן A FEEDER OF FLOCKS — Because the earth had been cursed he refrained from cultivating it. "}, {"ch": 4, "v": 3, "aliyah": 4, "heb": "וַֽיְהִ֖י מִקֵּ֣ץ יָמִ֑ים וַיָּבֵ֨א קַ֜יִן מִפְּרִ֧י הָֽאֲדָמָ֛ה מִנְחָ֖ה לַֽיהֹוָֽה׃", "onk": "וַהֲוָה מִסּוֹף יוֹמִין וְאַיְתִי קַיִן מֵאִבָּא דְאַרְעָא תִּקְרוּבְתָּא קֳדָם יְיָ:", "onk_en": "In the course of time, Kayin brought some fruit of the soil as an offering to Adonoy.", "pj": "וַהֲוָה מִסוֹף יוֹמַיָא וּבְאַרְבֵּסַר בְּנִיסָן וְאַיְיתֵי קַיִן מֵאִיבָּא דְאַרְעָא מִזְדְרַע כּוּתְנָא קָרְבַּן בִּכּוּרַיָא קֳדָם יְיָ", "pj_en": "And it was at the end of days, on the fourteenth of Nisan, that Kain brought of the produce of the earth, the seed of cotton (or line), an oblation of first things before the Lord;", "tj": "", "tj_en": "", "rashi": "<b>מפרי האדמה.<\/b> מִן הַגָּרוּעַ, וְיֵשׁ אַגָּדָה שֶׁאוֹמֶרֶת זֶרַע פִּשְׁתָּן הָיָה:", "rashi_en": "מפרי האדמה OF THE FRUIT OF THE GROUND —of the worst fruits (Genesis Rabbah 22:5); there is an Agada which says that it was linseed (Midrash Tanchuma, Bereshit 9)."}, {"ch": 4, "v": 4, "aliyah": 4, "heb": "וְהֶ֨בֶל הֵבִ֥יא גַם־ה֛וּא מִבְּכֹר֥וֹת צֹאנ֖וֹ וּמֵֽחֶלְבֵהֶ֑ן וַיִּ֣שַׁע יְהֹוָ֔ה אֶל־הֶ֖בֶל וְאֶל־מִנְחָתֽוֹ׃", "onk": "וְהֶבֶל אַיְתִי אַף הוּא מִבַּכִּירֵי עָנֵהּ וּמִשַׁמִּנְהוֹן <b>וַהֲוַת רַעֲוָא מִן קֳדָם יְיָ<\/b> בְּהֶבֶל וּבְּקוּרְבָּנֵהּ:", "onk_en": "Hevel also brought from the firstborn of his flock, from the best thereof. [<b>There was favor before Adonoy<\/b>] Adonoy paid regard to Hevel and to his offering.", "pj": "וְהֶבֶל אַיְיתִי אַף הוּא מִבַּכִּירֵי עָנָא וּמִפַּטִימֵהוֹן וַהֲוָה רַעֲוָא קֳדָם יְיָ וּסְבַר אַפִּין בְּהֶבֶל וּבְקָרְבָּנֵיהּ", "pj_en": "and Habel brought of the firstlings of the flock, and of their fat; and it was pleasing before the Lord, and He gave (His) countenance to Habel and to his oblation;", "tj": "", "tj_en": "", "rashi": "<b>וישע.<\/b> וַיִּפֶן, וְכֵן וְאֶל מִנְחָתוֹ לֹא שָׁעָה – לֹא פָנָה, וְכֵן וְלֹא יִשְׁעֶה (ישעיהו י\"ז) – לֹא יִפְנֶה, וְכֵן שְׁעֵה מֵעָלָיו (איוב י\"ד) פְּנֵה מֵעָלָיו:<br><br><b>וישע.<\/b> יָרְדָה אֵשׁ וְלִחֲכָה מִנְחָתוֹ:", "rashi_en": "וישע AND HE HAD REGARD— and He turned to; similarly in the next verse “He had no respect for his offering” means, “He did not turn to it.” Similarly, (Isaiah 17:8) ולא ישעה אל המזבחות which means “And he shall not turn towards the altars”; so also (Job 14:6) שעה מעליו “turn away from him” — disregard him.<br><br>וישע AND HE HAD REGARD — Fire descended from heaven and consumed his offering. "}, {"ch": 4, "v": 5, "aliyah": 4, "heb": "וְאֶל־קַ֥יִן וְאֶל־מִנְחָת֖וֹ לֹ֣א שָׁעָ֑ה וַיִּ֤חַר לְקַ֙יִן֙ מְאֹ֔ד וַֽיִּפְּל֖וּ פָּנָֽיו׃", "onk": "וּבְּקַיִן וּבְּקוּרְבָּנֵהּ <b>לָא הֲוַת רַעֲוָא<\/b> וּתְקֵף לְקַיִן לַחֲדָא וְאִתְכְּבִישׁוּ אַפּוֹהִי:", "onk_en": "But to Kayin and his offering He paid no regard [<b>there was no favor<\/b>]. Kayin became very angry and depressed.", "pj": "וּלְקַיִן וּלְקָרְבָּנֵיהּ לָא סְבַר אַפִּין וּתְקֵיף לְקַיִן לַחֲדָא וְאִתְכְּבִישׁוּ אִקוּנִין דְאַפּוֹהִי", "pj_en": "but to Kain and to his oblation He gave no countenance. And Kain was angered greatly, and the features of his face were downcast.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 6, "aliyah": 4, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־קָ֑יִן לָ֚מָּה חָ֣רָה לָ֔ךְ וְלָ֖מָּה נָפְל֥וּ פָנֶֽיךָ׃", "onk": "וַאֲמַר יְיָ לְקָיִן לְמָא תְּקִיף לָךְ וּלְמָא אִתְכְּבִישׁוּ אַפָּיךְ:", "onk_en": "Adonoy said to Kayin, Why are you angry? Why are you depressed?", "pj": "וַאֲמַר יְיָ לְקַיִן לָמָה תַּקִיף לָךְ וְלָמָה אִתְכְּבִישׁוּ אִיקוּנִין דְאַנְפָּךְ", "pj_en": "And the Lord said to Kain, Why hast thou anger, and why are the features of thy face downcast?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 7, "aliyah": 4, "heb": "הֲל֤וֹא אִם־תֵּיטִיב֙ שְׂאֵ֔ת וְאִם֙ לֹ֣א תֵיטִ֔יב לַפֶּ֖תַח חַטָּ֣את רֹבֵ֑ץ וְאֵלֶ֙יךָ֙ תְּשׁ֣וּקָת֔וֹ וְאַתָּ֖ה תִּמְשׇׁל־בּֽוֹ׃", "onk": "הֲלָא אִם תּוֹטִיב <b>עוֹבָדָךְ<\/b> יִשְׁתְּבֵק <b>לָךְ<\/b> וְאִם לָא תּוֹטִיב <b>עוֹבָדָךְ לְיוֹם דִּינָא חֶטְאָךְ נְטִיר דִיעֲתִיד לְאִתְפָּרְעָא מִנָּךְ אִם לָא תְתוּב וְאִם תְּתוּב יִשְׁתְּבֵק לָךְ<\/b>:", "onk_en": "Is this not so—if you improve [<b>your actions<\/b>], there is forgiveness [<b>for you<\/b>], but if you do not improve [<b>your actions<\/b>], sin rests at the opening [<b>your sin will be kept for the Day of Judgement<\/b>]. Its desire is unto you, but you can dominate it. [<b>For in the future, it will be exacted from you if you do not repent. And if you repent, there is forgiveness.<\/b>]", "pj": "הֲלָא אִם תֵּיטִיב עוֹבָדָךְ יִשְׁתְּבֵיק לָךְ חוֹבָךְ וְאִין לָא תֵיטִיב עוֹבָדָךְ בְּעַלְמָא הָדֵין לְיוֹם דִינָא רַבָּא חֶטְאָךְ נְטִיר וְעַל תַּרְעֵי לִבָּךְ חֶטְאָה רְבִיעַ וּבִידָךְ מְסָרִית רְשׁוּתֵיהּ דְּיִצְרָא בִּישָׁא וּלְוָותָךְ יְהֵי מַתְוַיֵהּ וְאַנְתְּ תְּהֵי שַׁלִיט בֵּיהּ בֵּין לְמִזְכֵּי בֵּין לְמֶחְטֵי", "pj_en": "If thou doest thy work well, will not thy guilt be forgiven thee? But if thou doest not thy work well in this world, thy sin is retained unto the day of the great judgment, and at the doors of thy heart lieth thy sin. And into thy hand have I delivered the power over evil passion, and unto thee shall be the inclination thereof, that thou mayest have authority over it to become righteous, or to sin.", "tj": "הֲלָא אִין תֵּיטִיב עוֹבָדָךְ בְּעַלְמָא הָדֵין יִשְׁתְּרֵי וְיִשְׁתְּבֵיק לָךְ לְעַלְמָא דְאָתֵי וְאִין לָא תֵיטִיב עוֹבָדָךְ בְּעַלְמָא הָדֵין לְיוֹם דִינָא רַבָּא חֶטְאָךְ נְטִיר וְעַל תְּרַע לִבָּא רְבִיעַ בְּרַם בִּידָךְ מְסָרִית רְשׁוּתֵיהּ דְיִצְרָא בִישָׁא וְאַתְּ תֶּהֱוֵי שַׁלִיט בֵּיהּ בֵּין לְמִזְכֵּי בֵּין לְמֶחֱטֵי:", "tj_en": "If thou makest thy work good in this world, will it not be forgiven and remitted thee in the world to come? But if thou doest not make thy work good in this world, thy sin is retained unto the day of the great judgment; and at the door of thy heart it lieth. Yet into thy hand have I delivered power over evil passion, and to thee may be dominion over it, to become righteous or to sin.", "rashi": "<b>הלא אם תיטיב.<\/b> כְּתַרְגּוּמוֹ פֵּרוּשׁוֹ:<br><br><b>לפתח חטאת רובץ.<\/b> לְפֶתַח קִבְרְךָ חֶטְאֲךָ שָׁמוּר:<br><br><b>ואליך תשוקתו.<\/b> שֶׁל חַטָּאת הוּא יֵצֶר הָרָע, תָּמִיד שׁוֹקֵק וּמִתְאַוֶּה לְהַכְשִׁילְךָ:<br><br><b>ואתה תמשל בו.<\/b> אִם תִּרְצֶה תִּתְגַּבֵּר עָלָיו:", "rashi_en": "הלא אם תטיב IF THOU MENDEST — Its meaning is as the Targum gives it: “if thou wilt improve thy doings, thou shalt be forgiven”.<br><br>לפתח חטאת רובץ SIN CROUCHETH AT THE ENTRANCE — Right up to the door of your grave (until your death) your sin will be preserved.<br><br>ואליך תשוקתו AND UNTO THEE IS ITS LONGING — The longing of sin; it refers to the evil inclination. This is continually longing and desiring to make you sin.<br><br>ואתה תמשול בו NEVERTHELESS THOU MAYEST RULE OVER IT — If you desire to, you can gain the victory over it (Kiddushin 30b). "}, {"ch": 4, "v": 8, "aliyah": 4, "heb": "וַיֹּ֥אמֶר קַ֖יִן אֶל־הֶ֣בֶל אָחִ֑יו וַֽיְהִי֙ בִּהְיוֹתָ֣ם בַּשָּׂדֶ֔ה וַיָּ֥קׇם קַ֛יִן אֶל־הֶ֥בֶל אָחִ֖יו וַיַּהַרְגֵֽהוּ׃", "onk": "וַאֲמַר קַיִן לְהֶבֶל אַחוֹהִי וַהֲוָה בְּמֶהֱוֵיהוֹן בְּחַקְלָא וְקָם קַיִן עַל הֶבֶל אַחוֹהִי וְקַטְלֵהּ:", "onk_en": "Kayin said [something] to his brother Hevel, and it happened when they were in the field, that Kayin rose up against his brother, Hevel, and killed him.", "pj": "וַאֲמַר קַיִן לְוַת הֶבֶל אָחוּהִי אִיתָא וְנִפּוּק תַּרְוֵינָן לְבָרָא וַהֲוָה כַּד נְפָקּוּ תַּרְוֵיהוֹן לְבָרָא עָנֵי קַיִן וַאֲמַר לְהֶבֶל מִסְתַּכֵּל אֲנָא דִבְּרַחֲמִין אִתְבְּרִי עַלְמָא אֲבָל לא בְּפֵירֵי עוֹבָדִין טָבִין הוּא מִדְבַּר וּמְתוּב אַפִּין אִית בְּדִינָא מִן בִּגְלַל מַה אִתְקַבֵּל קֳרְבָּנָךְ וְקָרְבָּנִי מִנִי לָא אִתְקַבֵּל בְּרַעֲוָא עָנֵי הֶבֶל וְאָמַר לְקַיִן בְּרַחֲמִין אִיתְבְּרִי עַלְמָא וּבְפֵירֵי עוֹבָדִין טָבִין הוּא מַדְבַּר וּמֵיסַב אַפִּין לֵית בְּדִינָא וְעַל דַהֲווּ פֵירֵיהּ עוּבָדַיי טָבִין מִדִידָךְ וּקְדָמִין לְדִידָךְ אִתְקַבֵּל בְּרַעֲוָא קָרְבָּנִי עָנֵי קַיִן וַאֲמַר לַהֶבֶל לֵית דִין וְלֵית דַיָין וְלֵית עֲלָם אָחְרָן וְלֵית לְמִיתַּן אֲגַר טַב לְצַדִיקַיָא וְלֵית לְמִפְרָעָא מִן רַשִׁיעַיָא עָנֵי הֶבֶל וְאָמַר לְקַיִן אִית דִין וְאִית דַיָין וְאִית עָלָם אָחְרָן וְאִית לְמִתַּן אֲגַר טַב לְצַדִיקַיָא וְאִית לְמִתְפְּרַע מִן רַשִׁיעַיָא וְעַל עֵיסַק פִּתְגָמַיָא הָאִלֵין הֲווּ מִתְנַצְיַין עַל אַנְפֵּי בָּרָא וְקָם קַיִן עַל הֶבֶל אֲחוֹהִי וְטָבַע אַבְנָא בְּמִצְחֵיהּ וְקַטְלֵיהּ", "pj_en": "And Kain said to Habel his brother, Come, and let us two go forth into the field. And it was that when they two had gone forth into the field, Kain answered and said to Habel, I perceive that the world was created in goodness, but it is not governed (or conducted) according to the fruit of good works, for there is respect to persons in judgment; therefore it is that thy offering was accepted, and mine not accepted with good will. Habel answered and said to Kain, In goodness was the world created, and according to the fruit of good works is it governed; and there is no respect of persons in judgment; but because the fruits of my works were better than thine, my oblation, before thine, hath been accepted with good will. Kain answered and said to Habel, There is neither judgment nor Judge, nor another world; nor will good reward be given to the righteous, nor vengeance be taken of the wicked. And Habel answered and said to Kain, There is a judgment, and there is a Judge; and there is another world, and a good reward given to the righteous, and vengeance taken of the wicked. And because of these words they had contention upon the face of the field; and Kain arose against Habel his brother, and drave a stone into his forehead, and killed him.", "tj": "וַאֲמַר קַיִן לְהֶבֶל אָחוּי אִיתָא וְנִפּוּק לְאַפֵּי בָרָא וַהֲוָה כַּד נְפָקוּ תַּרְוֵיהוֹן לְאַפֵּי בָרָא עָנֵי קַיִן וַאֲמַר לְהֶבֶל אָחוּי לֵית דִין וְלֵית דַיָין וְלֵית עֲלָם אוֹחֲרָן וְלָא לְמִתַּן אֲגָר טַב לְצַדִיקַיָא וְלָא לְאִתְפְּרַע מִן רַשִׁיעַיָא וְלָא בְּרַחֲמִין אִיתְבְּרִי עַלְמָא וְלָא בְּרַחֲמִין הוּא מַדְבֵּר מִן בִּגְלַל מַה אִיתְקַבֵּל קוּרְבָּנָךְ מִינָךְ בִּרְעוּ וּמִנִי לָא אִתְקַבֵּל בְּרַעֲוָא עָנֵי הֶבֶל וַאֲמַר לְקַיִן אִית דִין וְאִית דַיָין וְאִית עֲלָם אוֹחֲרָן וְאִית תַּמָן אֲגַר טַב לְצַדִיקַיָיא וּלְאִיתְפְּרַע מֵרַשִׁיעַיָא וּבְרַחֲמִין אִיתְבְּרִי עַלְמָא וּבְרַחֲמִין הוּא מַדְבֵּר בְּרַם בְּפֵירֵי עוֹבָדִין טָבִין הוּא מַדְבֵּר עַל דְהַוָון עוֹבָדַיי תַּקְנִין מִן דִידָךְ אִיתְקַבֵּל קָרְבָּנִי מִנִי בְּרַעֲוָא וּמִינָךְ לָא אִתְקַבֵּל בְּרַעֲוָא וַהֲווֹ תַרְוֵיהוֹן מְנַצִין בְּאַפֵּי בָרָא וְקָם קַיִן עַל הֶבֶל אָחוֹי וְקָטֵל יָתֵיהּ:", "tj_en": "And Kain said to Habel his brother, Come, and let us go forth upon the face of the field. And it was when they had gone out upon the face of the field, Kain answered and said to Habel his brother, There is neither judgment nor Judge, nor another world; neither is a good reward given to the righteous, nor will vengeance be taken of the wicked. Nor was the world created in goodness, nor in goodness is it conducted. Therefore it is that thy oblation was accepted with good will, and mine not accepted with good will. Habel answered and said to Kain, There is a judgment, and there is a Judge: there is another world, and a good reward is given to the righteous, and vengeance taken of the wicked. And in goodness was the world created, and in goodness is it conducted. But according to the fruit of good works is it conducted. Because my works were better ordered than thine, my offering was accepted with good will, and thine was not accepted with good will. And as they two disputed on the face of the field, Kain arose against Habel his brother, and killed him.", "rashi": "<b>ויאמר קין אל הבל.<\/b> נִכְנַס עִמּוֹ בְּדִבְרֵי רִיב וּמַצָּה לְהִתְעוֹלֵל עָלָיו לְהָרְגוֹ. וְיֵשׁ בָּזֶה מִדְרְשֵׁי אַגָּדָה, אַךְ זֶה יִשּׁוּבוֹ שֶׁל מִקְרָא:", "rashi_en": "ויאמר קין אל הבל AND CAIN SPAKE TO ABEL — He began an argument, striving and contending with him, to seek a pretext to kill him. There are Midrashic explanations of these words, but this is the plain sense of the text. "}, {"ch": 4, "v": 9, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־קַ֔יִן אֵ֖י הֶ֣בֶל אָחִ֑יךָ וַיֹּ֙אמֶר֙ לֹ֣א יָדַ֔עְתִּי הֲשֹׁמֵ֥ר אָחִ֖י אָנֹֽכִי׃", "onk": "וַאֲמַר יְיָ לְקַיִן אָן הֶבֶל אָחוּךְ וַאֲמַר לָא יָדַעֲנָא הֲנָטֵר אָחִי אֲנָא:", "onk_en": "Adonoy then said to Kayin, Where is your brother, Hevel? [Kayin] said, I know not, am I my brother’s keeper?", "pj": "וַאֲמַר יְיָ לְקַיִן אָן הֶבֶל אָחוּךְ וַאֲמַר לָא יָדַעֲנָא דִלְמָא נְטִיר אָחִי אֲנָא", "pj_en": "And the Lord said to Kain, Where is Habel thy brother? And he said, I know not; am I the keeper of my brother?", "tj": "", "tj_en": "", "rashi": "<b>אי הבל אחיך.<\/b> לְכָּנֵס עִמּוֹ בְּדִבְרֵי נַחַת, אוּלַי יָשׁוּב וְיֹאמַר: אֲנִי הֲרַגְתִּיו וְחָטָאתִי לְךָ:<br><br><b>לא ידעתי.<\/b> נַעֲשָׂה כְּגוֹנֵב דַּעַת הָעֶלְיוֹנָה:<br><br><b>השומר אחי.<\/b> לְשׁוֹן תֵּמַהּ הוּא, וְכֵן כָּל הֵ\"א הַנְּקוּדָה בַּחֲטַף פַּתָּח:", "rashi_en": "איה הבל אחיך WHERE IS ABEL THY BROTHER — thus entering into a friendly conversation with him: perhaps he might repent and say, “I have killed him, and sinned against You” (Genesis Rabbah 19:11).<br><br>לא ידעתי I KNOW NOT — He became a deceiver of the Most High (i. e. he persuaded himself that he could deceive Him) (Numbers Rabbah 20:6).<br><br>השומר אחי אנכי AM I MY BROTHER’S KEEPER — This is a question. Similarly, wherever ‘ה has a חטף פתח it introduces a question. "}, {"ch": 4, "v": 10, "aliyah": 4, "heb": "וַיֹּ֖אמֶר מֶ֣ה עָשִׂ֑יתָ ק֚וֹל דְּמֵ֣י אָחִ֔יךָ צֹעֲקִ֥ים אֵלַ֖י מִן־הָֽאֲדָמָֽה׃", "onk": "וַאֲמַר מֶה עֲבַדְתָּא קַל <b>דַם זַרְעִין דִעֲתִידִין לְמֵפַק מִן אָחוּךְ<\/b> קַבְלִין <b>קֳדָמַי<\/b> מִן אַרְעָא:", "onk_en": "He said [to Kayin], What have you done? The voice of your brother’s blood [<b>the blood of the descendants that were destined to come from your brother<\/b>] cries out to [<b>before<\/b>] Me from the ground.", "pj": "וַאֲמַר מָה עָבַדְתְּ קַל דְמֵי קְטִילַת אָחוּךְ דְאִתְבְּלָעוּ בְּגַרְגִישְׁתָּא צְוָחִין קֳדָמַי מִן אַרְעָא", "pj_en": "And He said, What hast thou done? The voice of the bloods of the murder of thy brother which are swallowed up in the sod, crieth before Me from the earth.", "tj": "קַל אַדְמֵיהוֹן דְאוֹכְלוֹסִין צַדִיקַיָא דַהֲווֹן עֲתִידִין לְמֵיקַם מִן הֶבֶל אָחוּךְ:", "tj_en": "The voice of the blood of the multitude of the righteous who were to arise from Habel thy brother.", "rashi": "<b>דמי אחיך.<\/b> דָּמוֹ וְדַם זַרְעִיּוֹתָיו. דָּבָר אַחֵר, שֶׁעָשָׂה בוֹ פְּצָעִים הַרְבֵּה, שֶׁלֹּא הָיָה יוֹדֵעַ מֵהֵיכָן נַפְשׁוֹ יוֹצְאָה (סנהדרין ל\"ז):", "rashi_en": "דמי אחיך THY BROTHERS BLOOD — דמי is plural — bloods” — his blood and the blood of his possible descendants (Genesis Rabbah 22:9). Another explanation of why the plural is used: he inflicted upon him many wounds, because he knew not whence his soul would depart (i. e. which blow would prove fatal) (Sanhedrin 37b). "}, {"ch": 4, "v": 11, "aliyah": 4, "heb": "וְעַתָּ֖ה אָר֣וּר אָ֑תָּה מִן־הָֽאֲדָמָה֙ אֲשֶׁ֣ר פָּצְתָ֣ה אֶת־פִּ֔יהָ לָקַ֛חַת אֶת־דְּמֵ֥י אָחִ֖יךָ מִיָּדֶֽךָ׃", "onk": "וּכְעַן לִיט אָתְּ מִן אַרְעָא דִּפְתָחַת יָת פּוּמַהּ וְקַבִּילַת יָת דְּמֵהּ דְּאָחוּךְ מִן יְדָךְ:", "onk_en": "Now you are cursed from the ground that had to open its mouth to accept your brother’s blood from your hand.", "pj": "וּכְעַן חֲלַף דִקְטַלְתֵּיהּ לַיִיט אַתְּ מִן אַרְעָא דִפְתָחַת יַת פּוּמָהּ וְקַבִּילַת יַת דְמֵי דְאָחוּךְ מִן יְדָךְ", "pj_en": "And now because thou hast killed him, thou art cursed from the earth, which hath opened the mouth, and received the bloods of thy brother from thy hand.", "tj": "", "tj_en": "", "rashi": "<b>ארור אתה מן האדמה.<\/b> יוֹתֵר מִמַּה שֶּׁנִּתְקַלְּלָה הִיא כְּבָר בַּעֲוֹנָהּ, וְגַם בָּזוֹ הוֹסִיפָה לַחֲטֹא,<br><br><b>אשר פצתה את פיה לקחת את דמי אחיך וגו'.<\/b> וְהִנְּנִי מוֹסִיף לָהּ קְלָלָה אֶצְלְךָ, לֹא תֹסֵף תֵּת כֹּחָהּ:", "rashi_en": "ארור אתה מן האדמה CURSED BE THOU FROM THE GROUND or, MORE THAN THE GROUND — More than the ground has already been cursed on account of its sin (cf. Rashi on Genesis 1:11): in this, too, it has again sinned<br><br>אשר פצתה את פיה לקחת את דמי אחיך IN THAT IT HATH OPENED ITS MOUTH TO TAKE THY BROTHER’S BLOOD: therefore do I impose upon it an additional curse regarding you—“it shall not henceforth yield unto thee its strength”."}, {"ch": 4, "v": 12, "aliyah": 4, "heb": "כִּ֤י תַֽעֲבֹד֙ אֶת־הָ֣אֲדָמָ֔ה לֹֽא־תֹסֵ֥ף תֵּת־כֹּחָ֖הּ לָ֑ךְ נָ֥ע וָנָ֖ד תִּֽהְיֶ֥ה בָאָֽרֶץ׃", "onk": "אֲרֵי תִפְלַח בְאַרְעָא לָא תוֹסִיף לְמִתַּן חֵילַהּ לָךְ מִטַלְטֵל וְגָלֵי תְּהֵא בְאַרְעָא:", "onk_en": "When you work the ground, it will no longer give you of its strength. You will be unsettled, and a wanderer on the earth.", "pj": "אֲרוּם תִּפְלַח יַת אַרְעָא לָא תוֹסִיף לְמִתַּן חִיל פֵּירָהָא לָךְ מְטַלְטֵל וְגָלֵי תְּהֵי בְּאַרְעָא", "pj_en": "When thou tillest the earth, it shall not add to give strength to its fruits for thee. A wanderer and an exile shalt thou be in the earth.", "tj": "", "tj_en": "", "rashi": "<b>נע ונד.<\/b> אֵין לְךָ רְשׁוּת לָדוּר בְּמָקוֹם אֶחָד:", "rashi_en": "נע ונד A VAGABOND AND A WANDERER — You shall not be permitted to dwell in one place. "}, {"ch": 4, "v": 13, "aliyah": 4, "heb": "וַיֹּ֥אמֶר קַ֖יִן אֶל־יְהֹוָ֑ה גָּד֥וֹל עֲוֺנִ֖י מִנְּשֹֽׂא<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז מִנְּשֽׂוֹא)<\/i>׃", "onk": "וַאֲמַר קַיִן קֳדָם יְיָ סַגִּי חוֹבִי מִלְּמִשְׁבָּק:", "onk_en": "Kayin said to Adonoy, My sin is too great to bear.", "pj": "וַאֲמַר קַיִן קֳדָם יְיָ סַגִי תַּקִיף מְרוֹדִי מִלְסוֹבְלָא בְּרַם יוּכְלָא קוּמָךְ לְמִסְבְּלֵיהּ יָתֵיהּ", "pj_en": "And Kain said before the Lord, More heavy is my rebellion than can be borne (away). Yet is there power before Thee to forgive it.", "tj": "וַאֲמַר קַיִן קֳדָם יְיָ סַגִין אִנוּן חוֹבוֹיֵי לְמִסְבּוֹל בְּרַם אִית יוּכְלָא קֳדָמָךְ לְמִשְׁרֵי וּלְמִשְׁבַּק לִי:", "tj_en": "And Kain said before the Lord, My sins are greater than can be borne. Nevertheless there is power before Thee to absolve and forgive me.", "rashi": "<b>עוני מנשוא.<\/b> בִּתְמִיהָ, אַתָּה טוֹעֵן עֶלְיוֹנִים וְתַחְתּוֹנִים, וַעֲוֹנִי אִי אֶפְשָׁר לִטְעֹן? (בראשית רבה)", "rashi_en": "גדול עוני מנשוא MY PUNISHMENT IS GREATER THAN I CAN BEAR (literally, my sin is greater than what can be borne) — This is a question: You bear the worlds above and below. and is it impossible for You to bear my sin? (Genesis Rabbah 22:11). "}, {"ch": 4, "v": 14, "aliyah": 4, "heb": "הֵן֩ גֵּרַ֨שְׁתָּ אֹתִ֜י הַיּ֗וֹם מֵעַל֙ פְּנֵ֣י הָֽאֲדָמָ֔ה וּמִפָּנֶ֖יךָ אֶסָּתֵ֑ר וְהָיִ֜יתִי נָ֤ע וָנָד֙ בָּאָ֔רֶץ וְהָיָ֥ה כׇל־מֹצְאִ֖י יַֽהַרְגֵֽנִי׃", "onk": "הָא תָרִיכְתָּא יָתִי יוֹמָא דֵּין מֵעַל אַפֵּי אַרְעָא <b>וּמִן קֳדָמָךְ לֵית אֶפְשָׁר לְאִטַּמָּרָא<\/b> וָאֱהִי מְטַלְטֵל וְגָלֵי בְּאַרְעָא וִיהֵי כָל דְּיִשְׁכְּחִנַנִי יִקְטְלִינַנִי:", "onk_en": "Behold, today You have banished me from the face of the earth, and from Your face I am to be hidden [<b>from before You it is impossible to be hidden<\/b>]. I am to be unsettled and a wanderer on the earth; whoever finds me, will kill me.", "pj": "הָא טָרַדְתָּא יָתִי יוֹמָא דֵין מֵעַל אַנְפֵּי אַרְעָא מִן קָדָמָךְ הַאֶפְשַׁר דְאִיטְמַר וְאִין אֶהִי מְטַלְטֵל וְגָלִי בְּאַרְעָא כָּל זַכְיַי דְיִשְׁכְּחִנַנִי יִקְטְלִינַנִי", "pj_en": "Behold, Thou hast cast me forth today from the face of the earth, and from before Thee is it possible to be hidden? And because I am a wanderer and an exile in the earth, any just one who findeth me will kill me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 15, "aliyah": 4, "heb": "וַיֹּ֧אמֶר ל֣וֹ יְהֹוָ֗ה לָכֵן֙ כׇּל־הֹרֵ֣ג קַ֔יִן שִׁבְעָתַ֖יִם יֻקָּ֑ם וַיָּ֨שֶׂם יְהֹוָ֤ה לְקַ֙יִן֙ א֔וֹת לְבִלְתִּ֥י הַכּוֹת־אֹת֖וֹ כׇּל־מֹצְאֽוֹ׃", "onk": "וַאֲמַר לֵהּ יְיָ בְּכֵן כָּל קָטִיל קַיִן <b>לְשַׁבְעָא דָּרִין<\/b> יִתְפְּרַע מִנֵּהּ וְשַׁוִּי יְיָ לְקַיִן אָתָא בְּדִיל דְּלָא לְמִקְטַל יָתֵהּ כָּל דִיִשְׁכְּחֻנֵהּ:", "onk_en": "Adonoy said to him, Therefore, whoever kills Kayin, [<b>after seven generations<\/b>] revenge will be taken on him [Kayin] sevenfold. Adonoy placed a mark on Kayin, so that whoever would find him would not kill him.", "pj": "וַאֲמַר לֵיהּ יְיָ הָא בְּכֵן כָּל דְקָטִיל קַיִן לְשִׁבְעָא דָרִין יִתְפְּרַע מִנֵיהּ וְרָשַׁם יְיָ עַל אַפֵּי דְקַיִן אָתָא מִן שְׁמָא רַבָּא וְיַקִירָא בְּגִין דְלָא לְמִקְטוֹל יָתֵיהּ כָּל דְיִשְׁכְּחוּנֵיהּ בְּאִסְתַּכְּלוּתֵיהּ בֵּיהּ", "pj_en": "And the Lord said to him, Behold now, any one who killeth Kain, unto seven generations vengeance shall be taken of him. And the Lord sealed upon the face of Kain the mark of the Name great and honourable, that any one who might find him should not kill him when he saw it upon him.", "tj": "", "tj_en": "", "rashi": "<b>לכן כל הורג קין.<\/b> זֶה אֶחָד מִן הַמִּקְרָאוֹת שֶׁקִּצְּרוּ דִּבְרֵיהֶם וְרָמְזוּ וְלֹא פֵרְשׁוּ, לָכֵן כָּל הֹרֵג קַיִן לְשׁוֹן גְּעָרָה, כֹּה יֵעָשֶׂה לוֹ, כָּךְ וְכָךְ עָנְשׁוֹ וְלֹא פֵּרֵשׁ עָנְשׁוֹ:<br><br><b>שבעתים יקם.<\/b> אֵינִי רוֹצֶה לְהִנָּקֵם מִקַּיִן עַכְשָׁו, לְסוֹף שִׁבְעָה דוֹרוֹת אֲנִי נוֹקֵם נִקְמָתִי מִמֶּנּוּ, שֶׁיַּעֲמֹד לֶמֶךְ מִבְּנֵי בָּנָיו וְיַהַרְגֵהוּ, וְסוֹף הַמִּקְרָא שֶׁאָמַר שִׁבְעָתַיִם יֻקָּם, וְהִיא נִקְמַת הֶבֶל מִקַּיִן, לִמְּדָנוּ שֶׁתְּחִלַּת מִקְרָא לְשׁוֹן גְּעָרָה הִיא, שֶׁלֹּא תְהֵא בְרִיָּה מַזִּיקַתּוּ, וְכַיּוֹצֵא בוֹ וַיֹּאמֶר דָּוִד כָּל מַכֵּה יְבֻסִי וְיִגַּע בַּצִּנּוֹר (שמואל ב ה'), וְלֹא פֵּרֵשׁ מַה יֵּעָשֶׂה לוֹ, אֲבָל דִּבֵּר הַכָּתוּב בְּרֶמֶז כָּל מַכֵּה יְבֻסִי וְיִגַּע בַּצִּנּוֹר וְיִקְרַב אֶל הַשַּׁעַר וְיִכְבְּשֶׁנּוּ וְאֶת הָעִוְרִים וגו', וְגַם אוֹתָם יַכֶּה עַל אֲשֶׁר אָמְרוּ הָעִוֵּר וְהַפִּסֵּחַ לֹא יָבֹא דָוִד אֶל תּוֹךְ הַבַּיִת – הַמַּכֶּה אֶת אֵלּוּ אֲנִי אֶעֱשֶׂנּוּ רֹאשׁ וְשַׂר, כָּאן קִצֵּר דְּבָרָיו, וּבְדִבְרֵי הַיָּמִים פֵּרֵשׁ יִהְיֶה לְרֹאשׁ וּלְשָׂר:<br><br><b>וישם ה' לקין אות.<\/b> חָקַק לוֹ אוֹת מִשְּׁמוֹ בְּמִצְחוֹ. ס\"א דָּבָר אַחֵר, כָּל מוֹצְאִי יַהַרְגֵנִי, הַבְּהֵמוֹת וְהַחַיּוֹת, אֲבָל בְּנֵי אָדָם עֲדַיִן לֹא הָיוּ שֶׁיִּירָא מֵהֶם, רַק אָבִיו וְאִמּוֹ, וּמֵהֶם לֹא הָיָה יָרֵא שֶׁיַּהַרְגוּהוּ, אֶלָּא אָמַר עַד עַכְשָׁו הָיָה פַּחְדָּתִי עַל כָּל הַחַיּוֹת כְּמֹ\"שֶׁ וּמוֹרַאֲכֶם וְגוֹ', וְעַכְשָׁו בִּשְׁבִיל עָוֹן זֶה לֹא יִירְאוּ מִמֶּנִּי הַחַיּוֹת וְיַהַרְגוּנִי, מִיָּד וַיָּשֶׂם ה' לְקַיִן אוֹת – הֶחֱזִיר אֶת מוֹרָאוֹ עַל הַחַיּוֹת:", "rashi_en": "לכן כל הרג קין VERILY, WHOSOEVER SLAYETH CAIN — This is one of the verses where the construction is elliptical (literally, which abbreviate their statements), which give only a suggestion and do not fully explain. “Verily, whosoever slayeth Cain” express a threat, suggesting the consequence — “thus shall be done to him”, “thus and thus shall be his punishment”, without explicitly explaining what the punishment would be.<br><br>שבעתים יקם VENGEANCE SHALL BE TAKEN SEVENFOLD — God says, I do not wish to take vengeance on Cain now, but at the end of seven generations I will execute my vengeance upon him, that Lamech, one of his descendants, will arise and slay him. The end of this verse which states, “vengeance shall be taken in the seventh generation” — which is the vengeance taken on Cain for Abel — teaches us that the first part of the verse is a threat made in order that no creature might injure him. A similar elliptical expression is the following: (2 Samuel 5:8) “And David said, whosoever smiteth the Jebusites and getteth up to the gutter” — but it does not explicitly state what would be done to that person. Scripture, however, here speaks by a suggestion only, meaning, whosoever smiteth the Jebusites and getteth up to the gutter and approacheth the gate and conquereth it and the blind etc. … slaying also them (the blind and the lame) because they said, “there are the blind and the lame: David cannot come into the house” — he who smiteth these, I shall make him chief and captain. Here (in the Book of Samuel) it abridges the narrative, but in Chronicles (1 Chronicles 11:6) it explicitly states, “he shall become chief and captain.”<br><br>וישם ה' לקין אות AND THE LORD SET A SIGN FOR CAIN — He inscribed on his forehead a letter of His Divine Name (Pirkei DeRabbi Eliezer 21). Other editions of Rashi add the following: another interpretation of “Whoever will find me will slay me”: this refers to cattle and beasts, since there were then no human beings in the world of whom he might be afraid except his father and mother, and, of course, he did not fear that they would slay him. He, therefore, said, “Until now the fear of me was upon all animals — as it is written”, (Genesis 9:2) “And the fear of you shall be upon all beasts of the field” etc. — now, however, because of my sin the animals will no longer fear me and will kill me. God immediately set a sign for Cain, viz., he again made the animals be in fear of him. "}, {"ch": 4, "v": 16, "aliyah": 4, "heb": "וַיֵּ֥צֵא קַ֖יִן מִלִּפְנֵ֣י יְהֹוָ֑ה וַיֵּ֥שֶׁב בְּאֶֽרֶץ־נ֖וֹד קִדְמַת־עֵֽדֶן׃", "onk": "וּנְפַק קַיִן מִן קֳדָם יְיָ וִיתֵיב <b>בְּאַרְעָא גָּלֵי וּמִטַּלְטַל דַּהֲוָה עֲבִידָא עֲלוֹהִי מִלְּקַדְמִין דְּגִינְתָא דְעֵדֶן<\/b>:", "onk_en": "Kayin exited from the Presence of Adonoy and settled in the land of Nod [<b>in the land of exile and wandering<\/b>], east of Eden [<b>which was made for him before the Garden of Eden<\/b>].", "pj": "וּנְפַק קַיִן מִן קֳדָם יְיָ וִיתֵיב בְּאַרְעָא טִלְטוֹל גָלוּתֵיהּ דַהֲוַת עֲבִידָא עֲלוֹהִי מִלְקַדְמִין בְּגִינוּנִיתָא דְעֵדֶן", "pj_en": "And Kain went out from before the Lord, and dwelt in the land of the wandering of his exile, which had been made for him from before, as the garden of Eden.", "tj": "וּנְפַק קַיִן מִן קֳדָם יְיָ וִיתֵיב בְּאַרְעָא גְלֵי וּמְטַלְטֵל מִן מִדְנַח לְגִינְתָא דְעֵדֶן וַהֲוָה קֳדָם עַד לָא קְטַל קַיִן לְהֶבֶל אָחוֹי הֲוָת אַרְעָא מִרְבַּיָא לֵיהּ פֵּרִין כְּפֵירֵי גִינְתָא דְעֵדֶן מִן דְחָטָא וּקְטַל לְאָחוֹי חָזְרַת לְמַסְקָא כּוּבִין וְדַרְדְרֵין:", "tj_en": "And Kain went out from before the Lord, and dwelt in the land of exile and wandering, eastward of the garden of Eden. And it had been before Kain slew Habel his brother that the earth multiplied fruits, as the fruits of the garden of Eden; (but) from (the time that) he sinned and killed his brother, it changed, to produce thorns and thistles.", "rashi": "<b>ויצא קין.<\/b> יָצָא בְהַכְנָעָה כְּגוֹנֵב דַּעַת הָעֶלְיוֹנָה:<br><br><b>בארץ נוד.<\/b> בָּאֶרֶץ שֶׁכָּל הַגּוֹלִים נָדִים שָׁם:<br><br><b>קדמת עדן.<\/b> שָׁם גָּלָה אָבִיו כְּשֶׁגֹּרַשׁ מִגַּן עֵדֶן, שֶׁנֶּאֱמַר וַיַּשְׁכֵּן מִקֶּדֶם לְגַן עֵדֶן אֶת שְׁמִירַת דֶּרֶךְ מְבוֹא הַגָּן, שֶׁיֵּשׁ לִלְמֹד שֶׁהָיָה אָדָם שָׁם, וּמָצִינוּ רוּחַ מִזְרָחִית קוֹלֶטֶת בְּכָל מָקוֹם אֶת הָרוֹצְחִים שֶׁנֶּאֱמַר אָז יַבְדִּיל מֹשֶׁה וְגוֹמֵר, מִזְרְחָה שָׁמֶשׁ (דברים ד'), דָּבָר אַחֵר בְּאֶרֶץ נוֹד, כָּל מָקוֹם שֶׁהוֹלֵךְ הָיְתָה הָאָרֶץ מִזְדַּעְזְעָה תַּחְתָּיו, וְהַבְּרִיּוֹת אוֹמְרִים סוּרוּ מֵעָלָיו, זֶהוּ שֶׁהָרַג אֶת אָחִיו:", "rashi_en": "ויצא קין AND CAIN WENT AWAY — He went away in pretended humility as though he would deceive the Most High (Genesis Rabbah 22:13).<br><br>בארץ נוד IN THE LAND OF NOD — In the land where all exiles wander about.<br><br>קדמת עדן ON THE EAST OF EDEN — Thereto his father went into exile when he was driven out from the Garden of Eden. as it is said, (3:24) “And He placed in the east of the Garden of Eden” a watch on the road that leads to the entrance of the Garden, from which one may infer that Adam was there (in the East) (Genesis Rabbah 21:9). Indeed, we find, also, that the Eastern quarter always forms a place of refuge for murderers, as it is said, (Deuteronomy 4:41) “Then Moses set aside three cities of refuge towards the place of sun-rise [that a murderer might flee thither].” Another explanation of בארץ נוד IN THE LAND OF NOD — (taking נוד in the sense of “movement”) — wherever he went the earth quaked beneath him, and people said, “Turn away from him: this is the man who killed his brother” (Midrash Tanchuma, Bereshit 9)."}, {"ch": 4, "v": 17, "aliyah": 4, "heb": "וַיֵּ֤דַע קַ֙יִן֙ אֶת־אִשְׁתּ֔וֹ וַתַּ֖הַר וַתֵּ֣לֶד אֶת־חֲנ֑וֹךְ וַֽיְהִי֙ בֹּ֣נֶה עִ֔יר וַיִּקְרָא֙ שֵׁ֣ם הָעִ֔יר כְּשֵׁ֖ם בְּנ֥וֹ חֲנֽוֹךְ׃", "onk": "וִידַע קַיִן יָת אִתְּתֵהּ וְעַדִּיאַת וִילֵידַת יָת חֲנוֹךְ וַהֲוָה בָּנֵי קַרְתָּא וּקְרָא שְׁמָא דְקַרְתָּא כְּשׁוּם בְּרֵהּ חֲנוֹךְ:", "onk_en": "Kayin knew his wife, and she conceived and gave birth to Chanoch. [Kayin] was building a city, and he named the city after his son Chanoch.", "pj": "וִידַע קַיִן יַת אִנְתְּתֵיהּ וְאַעֲדִיאַת וִילֵדַת יַת חֲנוֹךְ וַהֲוָה בָּנֵי קַרְתָּא וּקְרָא שׁוּם קַרְתָּא כְּשׁוּם בְּרֵיהּ חֲנוֹךְ", "pj_en": "And Kain knew his wife, and she conceived and bare Hanok; and he builded a city, and called the name of the city after the name of his son, Hanok.", "tj": "", "tj_en": "", "rashi": "<b>ויהי קין בונה עיר ויקרא שם העיר<\/b> לְזֵכֶר בְּנוֹ חֲנוֹךְ:", "rashi_en": "ויהי AND HE WAS— Cain was, not Enoch — בונה עיר BUILDING A CITY ויקרא שם העיר AND HE CALLED THE NAME OF THE CITY (named the city) as a memorial of his son — חנוך."}, {"ch": 4, "v": 18, "aliyah": 4, "heb": "וַיִּוָּלֵ֤ד לַֽחֲנוֹךְ֙ אֶת־עִירָ֔ד וְעִירָ֕ד יָלַ֖ד אֶת־מְחֽוּיָאֵ֑ל וּמְחִיָּיאֵ֗ל יָלַד֙ אֶת־מְת֣וּשָׁאֵ֔ל וּמְתוּשָׁאֵ֖ל יָלַ֥ד אֶת־לָֽמֶךְ׃", "onk": "וְאִתְיְלִיד לַחֲנוֹךְ יָת עִירָד וְעִירָד אוֹלִיד יָת מְחוּיָאֵל וּמְחִיָּיאֵל אוֹלִיד יָת מְתוּשָׁאֵל וּמְתוּשָׁאֵל אוֹלִיד יָת לָמֶךְ:", "onk_en": "To Chanoch was born Irad. Irad had a son Mechuyael, Mechuyael had a son Mesushael, and Mesushael, had a son Lemech.", "pj": "וְאִיתְיְלִיד לַחֲנוֹךְ יַת עִירָד וְעִירָד אוֹלִיד יַת מְחוּיָאֵל וּמְחִיָיאֵל אוֹלִיד יַת מְתוּשָׁאֵל וּמְתוּשָׁאֵל אוֹלִיד יַת לָמֶךְ", "pj_en": "And there was born unto Hanok Irad, and Irad begat Mechujael, and Mechujael begat Methushael, and Methushael begat Lemek.", "tj": "", "tj_en": "", "rashi": "<b>ועירד ילד.<\/b> יֵשׁ מָקוֹם שֶׁהוּא אוֹמֵר בְּזָכָר הוֹלִיד וְיֵשׁ מָקוֹם שֶׁהוּא אוֹמֵר יָלַד, שֶׁהַלֵּדָה מְשַׁמֶּשֶׁת שְׁתֵּי לְשׁוֹנוֹת, לֵדַת הָאִשָּׁה ניש\"טרא בְּלַעַז וּזְרִיעַת תּוֹלְדוֹת הָאִישׁ אינזי\"ראר בְּלַעַז. כְּשֶׁהוּא אוֹמֵר הוֹלִיד בִּלְשׁוֹן הִפְעִיל, מְדַבֵּר בְּלֵדַת הָאִשָּׁה – פְּלוֹנִי הוֹלִיד אֶת אִשְׁתּוֹ בֵּן אוֹ בַת, כְּשֶׁהוּא אוֹמֵר יָלַד, מְדַבֵּר בִּזְרִיעַת הָאִישׁ:", "rashi_en": ".חנוך AND IRAD BEGET — There are passages where it says of the male הוליד, and there are places where it says ילד, because this root ילד is used in two senses: in reference to a woman giving birth to a child through the agency of a male old French naitre; English to give birth to and the act of begetting by a man old French engendrer; English engender, beget. When it says הוליד, [in the Hiphil form] it speaks of the man in his relation to the act of giving birth by the woman — this or that man caused his wife to give birth to a son or daughter; when it says ילד it refers to the act of begetting by the man himself. "}, {"ch": 4, "v": 19, "aliyah": 5, "heb": "וַיִּֽקַּֽח־ל֥וֹ לֶ֖מֶךְ שְׁתֵּ֣י נָשִׁ֑ים שֵׁ֤ם הָֽאַחַת֙ עָדָ֔ה וְשֵׁ֥ם הַשֵּׁנִ֖ית צִלָּֽה׃", "onk": "וּנְסִיב לֵהּ לֶמֶךְ תַּרְתֵּין נְשִׁין שׁוּם חֲדָא עָדָה וְשׁוּם תִּנְיֵתָא צִלָּה:", "onk_en": "Lemech married two women, the first was named Adah, and the name of the second was Tzillah.", "pj": "וּנְסֵיב לֵיהּ לֶמֶךְ תַּרְתֵּין נְשִׁין שׁוּם חֲדָא עָדָה וְשׁוּם תִּנְיֵתָא צִלָה", "pj_en": "And Lemek took to him two wives; the name of the first, Ada, and the name of the second, Zillah.", "tj": "", "tj_en": "", "rashi": "<b>ויקח לו למך.<\/b> לֹא הָיָה לוֹ לְפָרֵשׁ כָּל זֶה, אֶלָּא לְלַמְּדֵנוּ מִסּוֹף הָעִנְיָן, שֶׁקִּיֵּם הַקָּבָּ\"ה הַבְטָחָתוֹ שֶׁאָמַר שִׁבְעָתַיִם יֻקַּם קָיִן, עָמַד לֶמֶךְ לְאַחַר שֶׁהוֹלִיד בָּנִים וְעָשָׂה דּוֹר שְׁבִיעִי וְהָרַג אֶת קַיִן, זֶהוּ שֶׁאָמַר כִּי אִישׁ הָרַגְתִּי לְפִצְעִי וְגוֹמֵר:<br><br><b>שתי נשים.<\/b> כָּךְ הָיָה דַּרְכָּן שֶׁל דּוֹר הַמַּבּוּל אַחַת לִפְרִיָּה וּרְבִיָּה וְאַחַת לְתַשְׁמִישׁ, זוֹ שֶׁהִיא לְתַשְׁמִישׁ מַשְׁקָהּ כּוֹס שֶׁל עִקָּרִין כְּדֵי שֶׁתֵּעָקֵר וּמְקֻשֶּׁטֶת כְּכַלָּה וּמַאֲכִילָהּ מַעֲדַנִּים, וַחֲבֶרְתָּהּ נְזוּפָה וַאֲבֵלָה כְּאַלְמָנָה, וְזֶהוּ שֶׁפֵּרֵשׁ אִיּוֹב רֹעֶה עֲקָרָה לֹא תֵלֵד וְאַלְמָנָה לֹא יְיֵטִיב (איוב כ\"ד), כְּמוֹ שֶׁמְּפֹרָשׁ בְּאַגָּדַת חֵלֶק (וּבִבְ\"רַ):<br><br><b>עדה.<\/b> הִיא שֶׁל פְּרִיָּה וּרְבִיָּה עַל שֵׁם שֶׁמְּגֻנָּה עָלָיו וּמוּסֶרֶת מֵאֶצְלוֹ, עָדָה תַּרְגּוּם שֶׁל סוּרָה:<br><br><b>צלה.<\/b> הִיא שֶׁל תַּשְׁמִישׁ, עַל שֵׁם שֶׁיּוֹשֶׁבֶת תָּמִיד בְּצִלּוֹ, דִּבְרֵי אַגָּדָה הֵם בִּבְ\"רַ:", "rashi_en": "ויקח לו למך AND LAMECH TOOK UNTO HIMSELF — It would not have been necessary to state all this in detail except to inform us by the conclusion of the narrative that the Holy One, blessed be He, kept the promise He made when He said, שבעתים יקם קין “vengeance shall be taken of Cain after seven generations״; for Lamech arose after he had begotten children and had raised the seventh generation and killed Cain. It is to this that the statement refers: כי איש הרגתי לפצעי וגו “for I have slain a man to my wounding etc.” (v. 23).<br><br>שתי נשים TWO WIVES — This was the custom of the generation that lived before the time of the Flood; they had two wives, one for child-bearing, the other for frivolous companionship and charm; the latter was given a cup of some drug to drink in order that she might become barren, and was dressed up like a bride and fed with the best food, whilst her fellow-wife was left without her husband’s companionship and ever mourned like a widow. Job expressly mentions this (Job 24:21). “He is a companion to (or, he feedeth) the barren that beareth not, and does not good to the widow”, as it is explained in the Agada of Pereq Chelek (see also Genesis Rabbah 23:2).<br><br>עדה ADAH — She was the wife intended for propagation, and she was so named because she was repulsive to him and was kept aloof from him [other versions read “from his table “] for עדה is the Aramaic word for סורה kept aloof.”<br><br>צלה ZILLAH — She was the one for companionship alone, and she was so named because she always abided in his shadow (צל means “shadow”). Thus is the statement of the Agada in Genesis Rabbah 23:2). "}, {"ch": 4, "v": 20, "aliyah": 5, "heb": "וַתֵּ֥לֶד עָדָ֖ה אֶת־יָבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י יֹשֵׁ֥ב אֹ֖הֶל וּמִקְנֶֽה׃", "onk": "וִילֵידַת עָדָה יָת יָבָל הוּא הֲוָה רַבְּהוֹן דְּיָתְבֵי מַשְׁכְּנִין וּמָרֵי בְעִיר:", "onk_en": "Adah gave birth to Yaval. He was the father [<b>master<\/b>] of those who live in tents, and breed cattle.", "pj": "וִילֵידַת עָדָה יַת יָבָל הוּא הֲוָה רַב בְּהוֹן דְכָל יַתְבֵי מַשְׁכְּנִין וּמָארֵי בְּעִיר", "pj_en": "And Ada bare Javal; he was the chief (rab) of all those who dwell in tents, and are masters of cattle.", "tj": "", "tj_en": "", "rashi": "<b>אבי ישב אהל ומקנה.<\/b> הוּא הָיָה הָרִאשׁוֹן לְרוֹעֵי בְהֵמוֹת בַּמִּדְבָּרוֹת, יוֹשֵׁב אֹהָלִים חֹדֶשׁ כָּאן וְחֹדֶשׁ כָּאן בִּשְׁבִיל מִרְעֵה צֹאנוֹ, וּכְשֶׁכָּלֶה הַמִּרְעֶה בְּמָקוֹם זֶה הוֹלֵךְ וְתוֹקֵעַ אָהֳלוֹ בְּמָקוֹם אַחֵר. וּמִדְרַשׁ אַגָּדָה בּוֹנֶה בָתִּים לַעֲ\"זָ, כְּמָה דְּאַתְּ אָמַר סֵמֶל הַקִּנְאָה הַמַּקְנֶה (יחזקאל ח'), וְכֵן אָחִיו תּוֹפֵשׂ כִּנּוֹר וְעוּגָב לְזַמֵּר לַעֲ\"זָ:", "rashi_en": "אבי יושב אהל ומקנה THE FATHER OF SUCH AS ABIDE IN TENTS AND OF SUCH THAT HAVE CATTLE — He was the first of those who pastured cattle, and he dwelt in tents, a month here and a month there, on account of the pasture necessary for his sheep; for when the grass was finished in one place he went away and pitched his tent in another place. There is a Midrashic statement (Genesis Rabbah 23:3) that he built temples for idol worship, (for ומקנה may be read ומקנה –– provoking jealousy), just as you say, (Ezekiel 8:3) \"the image of jealousy which provoketh God to jealousy\" (המקנה); similarly his brother handled the harp and guitar to make music for idol worship. "}, {"ch": 4, "v": 21, "aliyah": 5, "heb": "וְשֵׁ֥ם אָחִ֖יו יוּבָ֑ל ה֣וּא הָיָ֔ה אֲבִ֕י כׇּל־תֹּפֵ֥שׂ כִּנּ֖וֹר וְעוּגָֽב׃", "onk": "וְשׁוּם אֲחוֹהִי יוּבָל הוּא הֲוָה <b>רַבְּהוֹן<\/b> דְּכָל דִּמְנַגֵּן עַל פּוּם נִבְלָא <b>יָדְעֵי זְמַר כִּנּוֹרָא<\/b> וְאַבּוּבָא:", "onk_en": "His brother’s name was Yuval. He was the father [<b>master<\/b>] of all who handle [play] the harp and [<b>who know the song of the lute and the<\/b>] flute.", "pj": "וְשׁוּם אַחוֹהִי יוּבָל הוּא הֲוָה רַב בְּהוֹן דְכָל דִמְמַנִין לְזִמְרָא בְּכִנוֹרָא וַאֲבוּבָא", "pj_en": "And the name of his brother (was) Juval: he was chief (rab) of all those who take part in song with the lyre and the pipe.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 22, "aliyah": 5, "heb": "וְצִלָּ֣ה גַם־הִ֗וא יָֽלְדָה֙ אֶת־תּ֣וּבַל קַ֔יִן לֹטֵ֕שׁ כׇּל־חֹרֵ֥שׁ נְחֹ֖שֶׁת וּבַרְזֶ֑ל וַֽאֲח֥וֹת תּֽוּבַל־קַ֖יִן נַֽעֲמָֽה׃", "onk": "וְצִלָּה אַף הִיא יְלֵידַת יָת תּוּבַל קַיִן <b>רַבְּהוֹן דְכָל דְּיָדְעֵי עִיבִידַת נְחָשָׁא וּפַרְזְלָא<\/b> וַאֲחָתֵהּ דְתוּבַל קַיִן נַעֲמָה:", "onk_en": "Tzillah also gave birth to Tuval Kayin, who sharpened everything which cuts copper and iron [<b>who was the master of all who know the craft of copper and iron<\/b>]. The sister of Tuval Kayin was Naamah.", "pj": "וְצִלָה אַף הִיא יְלֵידַת יַת תּוּבָל קַיִן רַב לְכָל אוּמַן דִידַע בַּעֲבִידַת נְחָשָׁא וּפַרְזְלָא וְאַחְתֵיהּ דְתוּבַל קַיִן נַעֲמָה הִיא הֲוַת מָרַת קִינִין וְזִמְרִין", "pj_en": "And Zillah bare also Tuvalkain, the chief (rab) of all artificers who know the workmanship of brass and iron. And the sister of Tuvalkain was Naama; she was mistress of elegies and songs.", "tj": "", "tj_en": "", "rashi": "<b>תובל קין.<\/b> תּוֹבֵל אֻמָּנֻתוֹ שֶׁל קַיִן, תּוּבָל לְשׁוֹן תַּבְלִין, תִּבֵּל וְהִתְקִין אֻמָּנוּתוֹ שֶׁל קַיִן לַעֲשׂוֹת כְּלֵי זַיִן לָרוֹצְחִים:<br><br><b>לטש כל חרש נחשת וברזל.<\/b> מְחַדֵּד אֻמָּנוּת נְחֹשֶׁת וּבַרְזֶל כְּמוֹ יִלְטֹשׁ עֵינָיו לִי (איוב ט\"ז). חוֹרֵשׁ אֵינוֹ לְשׁוֹן פֹּעֶל אֶלָּא לְשׁוֹן פּוֹעֵל, שֶׁהֲרֵי נָקוּד קָמָץ קָטָן וְטַעְמוֹ לְמַטָּה, כְּלוֹמַר, מְחַדֵּד וּמְצַחְצֵחַ כָּל כְּלֵי אֻמָּנוּת נְחֹשֶׁת וּבַרְזֶל:<br><br><b>נעמה.<\/b> הִיא אִשְׁתּוֹ שֶׁל נֹחַ:", "rashi_en": "תובל קין TUBAL-CAIN — He refined Cain’s handicraft. The word תובל is connected in meaning with תבלין (spices which give a refined and improved taste to food); he refined and improved the work of Cain by providing weapons for murderers (Genesis Rabbah 23:3).<br><br>לטש כל חרש נחשת וברזל THE FORGER OF EVERY CUTTING INSTRUMENT OF BRASS AND IRON — He sharpened tools used in brass and iron work; לוטש has the some meaning as (Job 16:9) ילטוש “He sharpeneth his eye upon me.” The word  חרש is not of the form פעל (a noun like אֹכֶל, אֹהֶל etc.), but of the form פועל (a participle), for it has the vowel קמץ קטן (what we term צירה) and its accent is on the last syllabic (whereas the noun form has the accent on the first syllable, and the second has a Segol, like קדש), and the meaning is that he sharpened and polished all cutting implements (כל חרש) used in work of brass and iron.<br><br>נעמה NAAMAH — She was Noah’s wife (Genesis Rabbah 23:3)."}, {"ch": 4, "v": 23, "aliyah": 6, "heb": "וַיֹּ֨אמֶר לֶ֜מֶךְ לְנָשָׁ֗יו עָדָ֤ה וְצִלָּה֙ שְׁמַ֣עַן קוֹלִ֔י נְשֵׁ֣י לֶ֔מֶךְ הַאְזֵ֖נָּה אִמְרָתִ֑י כִּ֣י אִ֤ישׁ הָרַ֙גְתִּי֙ לְפִצְעִ֔י וְיֶ֖לֶד לְחַבֻּרָתִֽי׃", "onk": "וַאֲמַר לֶמֶךְ לִנְשׁוֹהִי עָדָה וְצִלָּה שִׁמְעַן קָלִי נְשֵׁי לֶמֶךְ אֲצֵיתָא לְמֵמְרִי <b>לָא גַּבְרָא קְטָלִית דִּבְדִילֵהּ אֲנָא סָבִיל חוֹבִין וְאַף לָא עוּלֵימָא חַבָּלִית דִּבְדִילֵהּ יִשְׁתֵּיצֵי זַרְעִי<\/b>:", "onk_en": "Lemech said to his wives, Adah and Tzillah, hear my voice, wives of Lemech listen to my speech; have I have killed a man by my own wounding and a child by my own hurting? [<b>I did not kill a man, that on his account I should bear the sin, and I did not even wound a child, that on his account my seed should be cut off<\/b>].", "pj": "וַאֲמַר לֶמֶךְ לִנְשׁוֹי עָדָה וְצִלָה קַבִּילִין קוֹלִי נְשִׁי לֶמֶךְ אַצִיתַן לְמֵימְרִי אֲרוּם לָא גַבְרָא קְטָלִית דְנִתְקַטִלָא תְּחוֹתוֹהִי אוּף לָא עוּלֵימָא חֲבִילִית דִבְגִינֵיהּ יְהוֹבְדוּן זַרְעִי", "pj_en": "And Lemek said to his wives Ada and Zillah, Hear my voice, wives of Lemek, hearken to my words: for I have not killed a man, that I should be slain for him; neither have I destroyed a young man, on whose account my children should perish.", "tj": "", "tj_en": "", "rashi": "<b>שמען קולי.<\/b> שֶׁהָיוּ פּוֹרְשׁוֹת מִמֶּנּוּ מִתַּשְׁמִישׁ, לְפִי שֶׁהָרַג אֶת קַיִן וְאֶת תּוּבַל קַיִן בְּנוֹ, שֶׁהָיָה לֶמֶךְ סוּמָא וְתוּבַל קַיִן מוֹשְׁכוֹ, וְרָאָה אֶת קַיִן וְנִדְמָה לוֹ כְּחַיָּה וְאָמַר לְאָבִיו לִמְשֹׁךְ בַּקֶּשֶׁת וַהֲרָגוֹ, וְכֵיוָן שֶׁיָּדַע שֶׁהוּא קַיִן זְקֵנוֹ הִכָּה כַּף אֶל כַּף וְסָפַק אֶת בְּנוֹ בֵינֵיהֶם וַהֲרָגוֹ, וְהָיוּ נָשָׁיו פּוֹרְשׁוֹת מִמֶּנּוּ וְהוּא מְפַיְּסָן:<br><br><b>שמען קולי.<\/b> לְהִשָּׁמַע לִי לְתַשְׁמִישׁ, וְכִי אִישׁ אֲשֶׁר הָרַגְתִּי לְפִצְעִי הוּא נֶהֱרַג, וְכִי אֲנִי פְצַעְתִּיו מֵזִיד שֶׁיְּהֵא הַפֶּצַע קָרוּי עַל שְׁמִי? וְיֶלֶד אֲשֶׁר הָרַגְתִּי, לְחַבֻּרָתִי נֶהֱרַג? כְּלוֹמַר, עַל יְדֵי חַבֻּרָתִי? בִּתְמִיהָ, וַהֲלֹא שׁוֹגֵג אֲנִי וְלֹא מֵזִיד, לֹא זֶהוּ פִּצְעִי וְלֹא זֶהוּ חַבֻּרָתִי:<br><br><b>פצע.<\/b> מַכַּת חֶרֶב אוֹ חֵץ מקא\"דורה בְּלַעַז:", "rashi_en": "שמען קולי HEAR MY VOICE — For his wives separated from him because he had killed Cain and Tubal-Cain, his own son. Lamech was blind and Tubal-Cain used to lead him. The latter saw Cain and thought him to be an animal. He therefore told his father to draw the bow, and thus Lamech killed him. As soon as he learned that it was his forefather Cain, he smote his hands together, struck his son between them and so killed him too. His wives thereupon separated from him, and he endeavoured to appease them, <br><br>saying שמען קולי “Hear my voice”— obey me and return to me: for the man I slew — was he slain by my wounding? i. e. did I wound him with premeditation, that the wound should be called by my name (i. e. attributed to me); and the child that I slew — was it slain by my blow? (i. e. by a blow directed intentionally by me?) [Rashi here inserts the word בתמיה which he uses frequently to direct that the preceding words should be read as a question.] Did I not act inadvertently and not with premeditation? This was not my wound, nor was this my blow!<br><br>פצע wound, is the stroke inflicted by a sword or arrow (old French macheure). "}, {"ch": 4, "v": 24, "aliyah": 6, "heb": "כִּ֥י שִׁבְעָתַ֖יִם יֻקַּם־קָ֑יִן וְלֶ֖מֶךְ שִׁבְעִ֥ים וְשִׁבְעָֽה׃", "onk": "אֲרֵי <b>שַׁבְעָא דָּרִין אִיתְלִאוּ לְקָיִן<\/b> הֲלָא לְלֶמֶךְ בְּרֵהּ <b>שַׁבְעִין וְשַׁבְעָא<\/b>:", "onk_en": "If Kayin shall be avenged sevenfold [<b>If Kayin’s punishment shall be suspended for seven generations<\/b>], then for Lemech, his son, it shall be seventy-seven fold [<b>for seventy-seven generations<\/b>].", "pj": "אֲרוּם קַיִן דְחַב וְתַב בִּתְיוּבְתָּא עַד שׁוּבְעָא דָרִין אִתְלִיוּ לֵיהּ וְלֶמֶךְ בַּר בְּרֵיהּ דְלָא חַב דִינָא הוּא דְיִתְלֵי לֵיהּ עַד שׁוּבְעִין וְשַׁבְעָא", "pj_en": "For Kain who sinned and was converted by repentance (had protection) unto seven generations extended to him: and to Lemek, the son of his son, who hath not sinned, it is just that it shall be extended unto seventy and seven.", "tj": "", "tj_en": "", "rashi": "<b>כי שבעתים יקם קין.<\/b> קַיִן שֶׁהָרַג מֵזִיד נִתְלָה לוֹ עַד שִׁבְעָה דוֹרוֹת, אֲנִי שֶׁהָרַגְתִּי שׁוֹגֵג לֹא כָּל שֶׁכֵּן שֶׁיִּתָּלֶה לִי שְׁבִיעִיּוֹת הַרְבֵּה:<br><br><b>שבעים ושבעה.<\/b> לְשׁוֹן רִבּוּי שְׁבִיעִיּוֹת אָחַז לוֹ, כָּךְ דָּרַשׁ רַבִּי תַּנְחוּמָא. וּמִדְרַשׁ בְּרֵאשִׁית רַבָּה לֹא הָרַג לֶמֶךְ כְּלוּם, וְנָשָׁיו פּוֹרְשׁוֹת מִמֶּנּוּ מִשֶּׁקִיְּמוּ פְּרִיָה וּרְבִיָּה, לְפִי שֶׁנִּגְזְרָה גְּזֵרָה לְכַלּוֹת זַרְעוֹ שֶׁל קַיִן לְאַחַר שִׁבְעָה דוֹרוֹת, אָמְרוּ מָה אָנוּ יוֹלְדוֹת לַבֶּהָלָה? לְמָחָר הַמַּבּוּל בָּא וְשׁוֹטֵף אֶת הַכֹּל וְהוּא אוֹמֵר לָהֶן וְכִי אִישׁ הָרַגְתִּי לְפִצְעִי? וְכִי אֲנִי הָרַגְתִּי אֶת הֶבֶל, שֶׁהָיָה אִישׁ בְּקוֹמָה וְיֶלֶד בַּשָּׁנִים, שֶׁיְּהֵא זַרְעִי כָּלֶה בְּאוֹתוֹ עָוֹן? וּמַה קַּיִן שֶׁהָרַג נִתְלָה לוֹ שִׁבְעָה דוֹרוֹת, אֲנִי שֶׁלֹּא הָרַגְתִּי, לֹא כָּ\"שֶׁ שֶׁיִּתָּלוּ לִי שְׁבִיעִיּוֹת הַרְבֵּה? וְזֶהוּ קַל וָחֹמֶר שֶׁל שְׁטוּת, אִם כֵּן אֵין הַקָּבָּ\"ה גּוֹבֶה אֶת חוֹבוֹ וּמְקַיֵּם אֶת דְּבָרוֹ:", "rashi_en": "כי שבעתים יקם קין IF CAIN SHALL BE AVENGED SEVENFOLD — (according to Rashi, as previously explained, it signifies “If vengeance shall be taken on Cain after seven generations”). If in the case of Cain who killed with premeditation the punishment was suspended for him until the seventh generation, in the case of myself who slew inadvertently does it not necessarily follow that it should be suspended for me until many seven generations?<br><br>שבעים ושבעה SEVENTY AND SEVEN — He uses a term that denotes many periods of seven generations. Thus did R. Tanchuma 1:1:11 explain this passage; but the Midrash Rabbah (Genesis Rabbah 23:4) does not mention that Lamech slew anyone at all, and only states that his wives had lived apart from him after they had born children, because God’s decree had been issued that Cain’s descendants should be exterminated after seven generations. They said, “Why should we bear children only to be destroyed? Soon the Flood will come and will sweep everyone away!” Lamech then said unto them, “Did ‘I’ slay a man ‘לפצע for my wounding” (i.e. that I should be wounded — punished)? Did “I” slay Abel who was a man in height but a child in years, that my descendants should be exterminated on account of this sin (the sin of Cain who killed Abel)? If Cain who did kill had his punishment suspended until the seventh generation, I who have not killed — does it not necessarily follow that my punishment) should be suspended for many seven generations? This, however, is an absurd argument a fortiori, for if so, the Holy One, blessed be He, could never exact his debt nor fulfil his word. "}, {"ch": 4, "v": 25, "aliyah": 6, "heb": "וַיֵּ֨דַע אָדָ֥ם עוֹד֙ אֶת־אִשְׁתּ֔וֹ וַתֵּ֣לֶד בֵּ֔ן וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ שֵׁ֑ת כִּ֣י שָֽׁת־לִ֤י אֱלֹהִים֙ זֶ֣רַע אַחֵ֔ר תַּ֣חַת הֶ֔בֶל כִּ֥י הֲרָג֖וֹ קָֽיִן׃", "onk": "וִידַע אָדָם עוֹד יָת אִתְּתֵהּ וִילֵידַת בַּר וּקְרַת יָת שְׁמֵהּ שֵׁת אֲרֵי אַמָרַת יְהַב לִי יְיָ בַּר אוֹחֲרָן חֲלַף הֶבֶל דִּקַטְלֵהּ קָיִן:", "onk_en": "Adam knew his wife again, and she gave birth to a son, and named him Sheis, Because Elohim has granted me another offspring in place of Hevel, for Kayin had killed him.", "pj": "וִידַע אָדָם תּוּב יַת אִנְתְּתֵיהּ לְסוֹף מְאָה וּתְלָתִין שְׁנִין דְאִתְקְטֵיל הֶבֶל וִילֵידַת בַּר וּקְרַת יַת שְׁמֵיהּ שֵׁת אֲרוּם אֲמַרַת יְהַב לִי יְיָ בַּר אוֹחֲרָן חֲלַף הֶבֶל דְקַטְלֵיהּ קַיִן", "pj_en": "And Adam knew his wife again, at the end of a hundred and thirty years after Habel had been slain; and she bare a son, and called his name Sheth; for she said, The Lord hath given me another son instead of Habel whom Kain slew.", "tj": "", "tj_en": "", "rashi": "<b>וידע אדם וְגוֹ'.<\/b> בָּא לוֹ לֶמֶךְ אֵצֶל אָדָם הָרִאשׁוֹן וְקָבַל עַל נָשָׁיו, אָמַר לָהֶם: וְכִי עֲלֵיכֶם לְדַקְדֵּק עַל גְּזֵרָתוֹ שֶׁל מָקוֹם? אַתֶּם עֲשׂוּ מִצְוַתְכֶם וְהוּא יַעֲשֶׂה אֶת שֶׁלּוֹ. אָמְרוּ לוֹ: קְשֹׁט עַצְמְךָ תְּחִלָּה, וַהֲלֹא פָּרַשְׁתָּ מֵאִשְׁתְּךָ זֶה מֵאָה וּשְׁלֹשִׁים שָׁנָה מִשֶּׁנִּקְנְסָה מִיתָה עַל יָדְךָ: מִיָּד וַיֵּדַע אָדָם וְגוֹמֵר. וּמַהוּ עוֹד, לְלַמֵּד שֶׁנִּתּוֹסְפָה לוֹ תַאֲוָה עַל תַּאֲוָתוֹ (בראשית רבה):", "rashi_en": "וידע אדם AND ADAM KNEW — Lamech came to Adam Harishon, complaining about his wives. He (Adam) said to them: “Is it for you to be overparticular regarding God’s decrees? You do your duty, and He will do His!” They replied to him: “First correct yourself: have you not lived apart from your wife these 130 years, ever since, through you, death was decreed as a punishment?” At once ‘וידע אדם עוד וגו “Adam knew his wife עוד ” — What signifies the word עוד? It is used here to teach that his love for her was now greater than before (Genesis Rabbah 23:4-5). "}, {"ch": 4, "v": 26, "aliyah": 6, "heb": "וּלְשֵׁ֤ת גַּם־הוּא֙ יֻלַּד־בֵּ֔ן וַיִּקְרָ֥א אֶת־שְׁמ֖וֹ אֱנ֑וֹשׁ אָ֣ז הוּחַ֔ל לִקְרֹ֖א בְּשֵׁ֥ם יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּלְשֵׁת אַף הוּא אִתְיְלִיד בַּר וּקְרָא יָת שְׁמֵהּ אֱנוֹשׁ בְּכֵן בְּיוֹמוֹהִי <b>חָלוּ בְנֵי אֱנָשָׁא מִלְּצַלָּאָה<\/b> בִּשְׁמָא דַּיְיָ:", "onk_en": "To Sheis also was born a son, and he named him Enosh. Then men began to call [idols] [<b>men stopped praying<\/b>] by the name Adonoy.", "pj": "וּלְשֵׁת אַף הוּא אִתְיִלֵיד בַּר וּקְרָא יַת שְׁמֵיהּ אֱנוֹשׁ הוּא דָרָא דְמִיוֹמוֹהִי שְׁרִיאוּ לְמִטְעֵי וַעֲבָדוּ לְהוֹן טַעֲוָון וּמְכַנִין לְטַעֲוַותְהוֹן בְּשׁוּם מֵימְרָא דַיְיָ", "pj_en": "And to Sheth also was born a son, and he called his name Enosh. That was the generation in whose days they began to err, and to make themselves idols, and surnamed their idols by the name of the Word of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>אז הוחל.<\/b> לְשׁוֹן חֻלִּין, לִקְרֹא אֶת שְׁמוֹת הָאָדָם וְאֶת שְׁמוֹת הָעֲצַבִּים בִּשְׁמוֹ שֶׁל הַקָּבָּ\"ה לַעֲשׂוֹתָן עֲ\"זָ וְלִקְרוֹתָן אֱלֹהוּת:", "rashi_en": "אז הוחל THEN IT WAS BEGUN [TO CALL etc.] — The word הוחל must be connected in meaning with חולין “profane matters “) viz, calling the names of men and the names of idols after the name of the Holy One, blessed be He — making them the objects of idolatrous worship and calling them Deities (Genesis Rabbah 23:7)."}, {"ch": 5, "v": 1, "aliyah": 6, "heb": "זֶ֣ה סֵ֔פֶר<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן <big>סֵ֔<\/big>פֶר בסמ״ך גדולה)<\/i> תּוֹלְדֹ֖ת אָדָ֑ם בְּי֗וֹם בְּרֹ֤א אֱלֹהִים֙ אָדָ֔ם בִּדְמ֥וּת אֱלֹהִ֖ים עָשָׂ֥ה אֹתֽוֹ׃", "onk": "דֵּין סְפַר תּוּלְדַת אָדָם בְּיוֹמָא דִּבְרָא יְיָ אָדָם בִּדְמוּת אֱלֹהִים עָבַד יָתֵהּ:", "onk_en": "This is the book of the generations of man. On the day Elohim created man. He made him in the likeness of Elohim.", "pj": "דֵין סֵפֶר יֵיחוּס תּוֹלְדַת אָדָם בְּיוֹמָא דִבְּרָא יְיָ אָדָם בִּדְיוּקְנָא דַיְיָ עֲבִידְתֵּיהּ", "pj_en": "This is the book of the genealogy of Man. In the day that the Lord created man, in the likeness of the Lord He made him.", "tj": "", "tj_en": "", "rashi": "<b>זה ספר תולדות אדם.<\/b> זוֹ הִיא סְפִירַת תּוֹלְדוֹת אָדָם, וּמִדְרְשֵׁי אַגָּדָה יֵשׁ רַבִּים:<br><br><b>ביום ברא וגו'. <\/b> מַגִּיד שֶׁבַּיּוֹם שֶׁנִּבְרָא הוֹלִיד:", "rashi_en": "זה ספר תולדות אדם THIS IS THE BOOK OF THE GENERATIONS OF ADAM — This is the record (or, enumeration) of the generations of Adam. There are however, many Midrashic observations on this verse<br><br>‘ביום ברא וגו IN THE DAY THAT [GOD] CREATED etc. — This states that on the day when he was created he begot progeny (Genesis Rabbah 24:7). "}, {"ch": 5, "v": 2, "aliyah": 6, "heb": "זָכָ֥ר וּנְקֵבָ֖ה בְּרָאָ֑ם וַיְבָ֣רֶךְ אֹתָ֗ם וַיִּקְרָ֤א אֶת־שְׁמָם֙ אָדָ֔ם בְּי֖וֹם הִבָּֽרְאָֽם׃", "onk": "דְּכַר וְנוּקְבָא בְּרָאנוּן וּבָרִיךְ יָתְהוֹן וּקְרָא יָת שְׁמָהוֹן אָדָם בְּיוֹמָא דְאִתְבְּרִיאוּ:", "onk_en": "Male and female He created them. He blessed them and named them man [Adam] on the day that they were created.", "pj": "דְכַר וְנוּקְבָא בְּרָאנוּן וּבְרִיךְ יַתְהוֹן בְּשׁוּם מֵימְרֵיהּ וּקְרָא יַת שׁוּמְהוֹן אָדָם בְּיוֹמָא דְאִיתְבְּרִיאוּ", "pj_en": "Male and female He created them, and blessed them in the name of His Word; and He called their name Man in the day they were created.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 3, "aliyah": 6, "heb": "וַיְחִ֣י אָדָ֗ם שְׁלֹשִׁ֤ים וּמְאַת֙ שָׁנָ֔ה וַיּ֥וֹלֶד בִּדְמוּת֖וֹ כְּצַלְמ֑וֹ וַיִּקְרָ֥א אֶת־שְׁמ֖וֹ שֵֽׁת׃", "onk": "וַחֲיָא אָדָם מְאָה וּתְלָתִין שְׁנִין וְאוֹלִיד בִּדְמוּתֵהּ דְּדָמֵי לֵהּ וּקְרָא יָת שְׁמֵהּ שֵׁת:", "onk_en": "Adam lived a hundred and thirty years, and he had a son in his likeness, as his image, and he named him Sheis.", "pj": "וַחֲיָא אָדָם מְאָה וּתְלָתִין שְׁנִין וְאוֹלִיד יַת שֵׁת דְדָמֵי לְאִקוּנֵיהּ וְלִדְמוּתֵיהּ אֲרוּם מִן קַדְמַת דְנָא אוֹלֵידַת חַוָה יַת קַיִן דְלָא דָמֵי לֵיהּ וְהֶבֶל אִתְקְטֵיל עַל יְדוֹי וְקַיִן אִטְרַד וְלָא אִתְיַיחְסוּ זַרְעִיתֵיהּ בְּסֵפֶר יֵיחוּס אָדָם וּבָתַר כֵּן אוֹלִיד יַת דְדָמֵי לֵיהּ וּקְרָא יַת שְׁמֵיהּ שֵׁת", "pj_en": "And Adam lived a hundred and thirty years, and begat Sheth, who had the likeness of his image and of his similitude: for before had Hava born Kain, who was not like to him; and Habel was killed by his hand. And Kain was cast out; neither is his seed genealogized in the book of the genealogy of Adam. But afterwards there was born one like him, and he called his name Sheth.", "tj": "", "tj_en": "", "rashi": "<b>שלשים ומאת שנה.<\/b> עַד כָּאן פָּרַשׁ מִן הָאִשָּׁה (בראשית רבה):", "rashi_en": "שלשים ומאת שנה A HUNDRED AND THIRTY YEARS — Until then he lived apart from his wife (Genesis Rabbah 24:6). "}, {"ch": 5, "v": 4, "aliyah": 6, "heb": "וַיִּֽהְי֣וּ יְמֵי־אָדָ֗ם אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־שֵׁ֔ת שְׁמֹנֶ֥ה מֵאֹ֖ת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַהֲווֹ יוֹמֵי אָדָם בָּתַר דְּאוֹלִיד יָת שֵׁת תַּמְנֵי מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "The days of Adam after he had Sheis were eight hundred years, and he had sons and daughters.", "pj": "וַהֲווֹ יוֹמֵי אָדָם בָּתַר דְאוֹלִיד יַת שֵׁת תַּמְנֵי מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And the days of Adam after he begat Sheth were eight hundred years, and he begat sons and daughters.", "tj": "תַּמְנֵי מְאָה שְׁנִין וּבְהוֹן בִּשְׁנַיָא הֲוָה מוֹלִיד בְּנִין וּבְנָן:", "tj_en": "Eight hundred years; and in those years he begat sons and daughters.", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 5, "aliyah": 6, "heb": "וַיִּֽהְי֞וּ כׇּל־יְמֵ֤י אָדָם֙ אֲשֶׁר־חַ֔י תְּשַׁ֤ע מֵאוֹת֙ שָׁנָ֔ה וּשְׁלֹשִׁ֖ים שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי אָדָם דַחֲיָא תְּשַׁע מְאָה וּתְלָתִין שְׁנִין וּמִית:", "onk_en": "All the days that Adam lived were nine hundred and thirty years, and he died.", "pj": "", "pj_en": "", "tj": "וּמִית וְאִתְכְּנִישׁ מִן גוֹ עַלְמָא:", "tj_en": "And he died, and was gathered from the midst of the world.", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 6, "aliyah": 6, "heb": "וַֽיְחִי־שֵׁ֕ת חָמֵ֥שׁ שָׁנִ֖ים וּמְאַ֣ת שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־אֱנֽוֹשׁ׃", "onk": "וַחֲיָא שֵׁת מְאָה וַחֲמֵשׁ שְׁנִין וְאוֹלִיד יָת אֱנוֹשׁ:", "onk_en": "Sheis lived a hundred and five years and he had a son, Enosh.", "pj": "", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 7, "aliyah": 6, "heb": "וַֽיְחִי־שֵׁ֗ת אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־אֱנ֔וֹשׁ שֶׁ֣בַע שָׁנִ֔ים וּשְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַחֲיָא שֵׁת בָּתַר דְּאוֹלִיד יָת אֱנוֹשׁ תַּמְנֵי מְאָה וּשְׁבַע שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Enosh, Sheis lived eight hundred and seven years, and he had sons and daughters.", "pj": "", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 8, "aliyah": 6, "heb": "וַיִּֽהְיוּ֙ כׇּל־יְמֵי־שֵׁ֔ת שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה וּתְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי שֵׁת תְּשַׁע מְאָה וְתַרְתֵּי עַשְׂרֵי שְׁנִין וּמִית:", "onk_en": "All the days of Sheis were nine hundred and twelve years, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי שֵׁת תְּשַׁע מְאָה וְתַרְתֵּי סְרֵי שְׁנִין וּמִית", "pj_en": "And all the days of Sheth were nine hundred and twelve years, and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 9, "aliyah": 6, "heb": "וַיְחִ֥י אֱנ֖וֹשׁ תִּשְׁעִ֣ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־קֵינָֽן׃", "onk": "וַחֲיָא אֱנוֹשׁ תִּשְׁעִין שְׁנִין וְאוֹלִיד יָת קֵינָן:", "onk_en": "Enosh lived ninety years and he had a son, Keinan.", "pj": "וַחֲיָא אֱנוֹשׁ תִּשְׁעִין שְׁנִין וְאוֹלִיד יַת קֵינָן", "pj_en": "And Enosh lived ninety years, and begat Kenan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 10, "aliyah": 6, "heb": "וַיְחִ֣י אֱנ֗וֹשׁ אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־קֵינָ֔ן חֲמֵ֤שׁ עֶשְׂרֵה֙ שָׁנָ֔ה וּשְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַחֲיָא אֱנוֹשׁ בָּתַר דְאוֹלִיד יָת קֵינָן תַּמְנֵי מְאָה וַחֲמֵשׁ עַשְׂרֵי שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Keinan, Enosh lived eight hundred and fifteen years, and he had sons and daughters.", "pj": "וַחֲיָא אֱנוֹשׁ בָּתַר דְאוֹלִיד יַת קֵינָן תַּמְנֵי מְאָה וַחֲמֵיסַר שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Enosh lived after he had begotten Kenan eight hundred and fifteen years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 11, "aliyah": 6, "heb": "וַיִּֽהְיוּ֙ כׇּל־יְמֵ֣י אֱנ֔וֹשׁ חָמֵ֣שׁ שָׁנִ֔ים וּתְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי אֱנוֹשׁ תְּשַׁע מְאָה וַחֲמֵשׁ שְׁנִין וּמִית:", "onk_en": "All the days of Enosh were nine hundred and five years, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי אֱנוֹשׁ תְּשַׁע מְאָה וַחַמֵש שְׁנִין וּמִית", "pj_en": "And all the days of Enosh were nine hundred and five years; and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 12, "aliyah": 6, "heb": "וַיְחִ֥י קֵינָ֖ן שִׁבְעִ֣ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־מַֽהֲלַלְאֵֽל׃", "onk": "וַחֲיָא קֵינָן שַׁבְעִין שְׁנִין וְאוֹלִיד יָת מַהֲלַלְאֵל:", "onk_en": "Keinan lived seventy years and he had a son, Mahalaleil.", "pj": "וַחֲיָא קֵינָן שׁוּבְעִין שְׁנִין וְאוֹלִיד יַת מַהֲלַלְאֵל", "pj_en": "And Kenan lived seventy years and begat Mahalalel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 13, "aliyah": 6, "heb": "וַיְחִ֣י קֵינָ֗ן אַחֲרֵי֙ הוֹלִיד֣וֹ אֶת־מַֽהֲלַלְאֵ֔ל אַרְבָּעִ֣ים שָׁנָ֔ה וּשְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַחֲיָא קֵינָן בָּתַר דְּאוֹלִיד יָת מַהֲלַלְאֵל תַּמְנֵי מְאָה וְאַרְבְּעִין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Mahalaleil, Keinan lived eight hundred and forty years, and he had sons and daughters.", "pj": "וַחֲיָא קֵינָן בָּתַר דְאוֹלִיד יַת מַהֲלַלְאֵל תְּמָנֵי מְאָה וְאַרְבְּעִין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Kenan lived after he had begotten Mahalalel eight hundred and forty years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 14, "aliyah": 6, "heb": "וַיִּֽהְיוּ֙ כׇּל־יְמֵ֣י קֵינָ֔ן עֶ֣שֶׂר שָׁנִ֔ים וּתְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי קֵינָן תְּשַׁע מְאָה וַעֲשַׂר שְׁנִין וּמִית:", "onk_en": "All the days of Keinan were nine hundred and ten years, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי קֵינָן תְּשַׁע מְאָה וְעֶשֶר שְׁנִין וּמִית", "pj_en": "And all the days of Kenan were nine hundred and ten years; and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 15, "aliyah": 6, "heb": "וַיְחִ֣י מַֽהֲלַלְאֵ֔ל חָמֵ֥שׁ שָׁנִ֖ים וְשִׁשִּׁ֣ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־יָֽרֶד׃", "onk": "וַחֲיָא מַהֲלַלְאֵל שִׁתִּין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד יָת יָרֶד:", "onk_en": "Mahalaleil lived sixty-five years and he had a son, Yered.", "pj": "וַחֲיָא מַהֲלַלְאֵל שִׁתִּין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד יַת יֶרֶד", "pj_en": "And Mahalalel lived sixty-five years, and begat Jared.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 16, "aliyah": 6, "heb": "וַיְחִ֣י מַֽהֲלַלְאֵ֗ל אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־יֶ֔רֶד שְׁלֹשִׁ֣ים שָׁנָ֔ה וּשְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַחֲיָא מַהֲלַלְאֵל בָּתַר דְּאוֹלִיד יָת יֶרֶד תַּמְנֵי מְאָה וּתְלָתִין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Yered, Mahalaleil lived eight hundred and thirty years, and he had sons and daughters.", "pj": "וַחֲיָא מַהֲלַלְאֵל בָּתַר דְאוֹלִיד יַת יֶרֶד תְּמָנֵי מְאָה וּתְלָתִין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Mahalalel lived after he had begotten Jared eight hundred and thirty years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 17, "aliyah": 6, "heb": "וַיִּהְיוּ֙ כׇּל־יְמֵ֣י מַהֲלַלְאֵ֔ל חָמֵ֤שׁ וְתִשְׁעִים֙ שָׁנָ֔ה וּשְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי מַהֲלַלְאֵל תַּמְנֵי מְאָה וְתִשְׁעִין וַחֲמֵשׁ שְׁנִין וּמִית:", "onk_en": "All the days of Mahalaleil were eight hundred and ninety-five years, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי מַהֲלַלְאֵל תְּמָנֵי מְאָה וְתִשְׁעִין וַחֲמֵשׁ שְׁנִין וּמִית", "pj_en": "And all the days of Mahalalel were eight hundred and ninety-five years; and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 18, "aliyah": 6, "heb": "וַֽיְחִי־יֶ֕רֶד שְׁתַּ֧יִם וְשִׁשִּׁ֛ים שָׁנָ֖ה וּמְאַ֣ת שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־חֲנֽוֹךְ׃", "onk": "וַחֲיָא יֶרֶד מְאָה וְשִׁתִּין וְתַרְתֵּין שְׁנִין וְאוֹלִיד יָת חֲנוֹךְ:", "onk_en": "Yered lived one hundred and sixty-two years and he had a son, Chanoch.", "pj": "וְחַיָא יֶרֶד מְאָה וְשִׁיתִּין וְתַרְתֵּין שְׁנִין וְאוֹלִיד יַת חֲנוֹךְ", "pj_en": "And Jared lived a hundred and sixty-two years, and begat Hanok.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 19, "aliyah": 6, "heb": "וַֽיְחִי־יֶ֗רֶד אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־חֲנ֔וֹךְ שְׁמֹנֶ֥ה מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַחֲיָא יֶרֶד בָּתַר דְּאוֹלִיד יָת חֲנוֹךְ תַּמְנֵי מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Chanoch, Yered lived eight hundred years and he had sons and daughters.", "pj": "וַחֲיָא יֶרֶד בָּתַר דְאוֹלִיד יַת חֲנוֹךְ תְּמָנֵי מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Jared lived after he had begotten Hanok eight hundred years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 20, "aliyah": 6, "heb": "וַיִּֽהְיוּ֙ כׇּל־יְמֵי־יֶ֔רֶד שְׁתַּ֤יִם וְשִׁשִּׁים֙ שָׁנָ֔ה וּתְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי יֶרֶד תְּשַׁע מְאָה וְשִׁתִּין וְתַרְתֵּין שְׁנִין וּמִית:", "onk_en": "All the days of Yered were nine hundred sixty-two years, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי יֶרֶד תְּשַׁע מְאָה וְשִׁיתִּין וְתַרְתֵּין שְׁנִין וּמִית", "pj_en": "And all the days of Jared were nine hundred and sixty-two years; and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 21, "aliyah": 6, "heb": "וַיְחִ֣י חֲנ֔וֹךְ חָמֵ֥שׁ וְשִׁשִּׁ֖ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־מְתוּשָֽׁלַח׃", "onk": "וַחֲיָא חֲנוֹךְ שִׁתִּין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד יָת מְתוּשָׁלַח:", "onk_en": "Chanoch lived sixty-five years and he had a son, Mesushelach.", "pj": "וַחֲיָא חֲנוֹךְ שִׁיתִּין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד יַת מְתוּשָׁלַח", "pj_en": "And Hanok lived sixty-five years, and begat Methushelach.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 22, "aliyah": 6, "heb": "וַיִּתְהַלֵּ֨ךְ חֲנ֜וֹךְ אֶת־הָֽאֱלֹהִ֗ים אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־מְתוּשֶׁ֔לַח שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וְהַלִּיךְ חֲנוֹךְ <b>בְּדַחַלְתָּא דַּ<\/b>יְיָ בָּתַר דְּאוֹלִיד יָת מְתוּשֶׁלַח תְּלַת מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "Chanoch walked with [<b>the fear of<\/b>] Elohim, after he had Mesushelach, [for] three hundred years, and he had sons and daughters.", "pj": "וּפְלַח חֲנוֹךְ בִּקְשׁוֹט קֳדָם יְיָ בָּתַר דְאוֹלִיד יַת מְתוּשֶׁלַח תְּלַת מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Hanok worshipped in truth before the Lord after he had begotten Methushelach three hundred years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 23, "aliyah": 6, "heb": "וַיְהִ֖י כׇּל־יְמֵ֣י חֲנ֑וֹךְ חָמֵ֤שׁ וְשִׁשִּׁים֙ שָׁנָ֔ה וּשְׁלֹ֥שׁ מֵא֖וֹת שָׁנָֽה׃", "onk": "וַהֲוָה כָּל יוֹמֵי חֲנוֹךְ תְּלַת מְאָה וְשִׁתִּין וַחֲמֵשׁ שְׁנִין:", "onk_en": "All the days of Chanoch were three hundred and sixty-five years.", "pj": "וַהֲווֹ כָּל יוֹמֵי חֲנוֹךְ עִם דַיְירֵי אַרְעָא תְּלַת מְאָה וְשִׁיתִּין וַחֲמֵשׁ שְׁנִין", "pj_en": "And all the days of Hanok with the sojourners of the earth were three hundred and sixty-five years.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 24, "aliyah": 6, "heb": "וַיִּתְהַלֵּ֥ךְ חֲנ֖וֹךְ אֶת־הָֽאֱלֹהִ֑ים וְאֵינֶ֕נּוּ כִּֽי־לָקַ֥ח אֹת֖וֹ אֱלֹהִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְהַלִּיךְ חֲנוֹךְ <b>בְּדַחַלְתָּא דַּ<\/b>יְיָ וְלַיְתוֹהִי אֲרֵי (לָא) <b>אֲמֵית יָתֵהּ<\/b> יְיָ:", "onk_en": "Chanoch walked with [<b>the fear of<\/b>] Elohim, and he was no longer [there] for Elohim took him [<b>put him to death<\/b>].", "pj": "וּפְלַח חֲנוֹךְ בְּקוּשְׁטָא קֳדָם יְיָ וְהָא לֵיתוֹהִי עִם דַיְירֵי אַרְעָא אֲרוּם אִתְנְגִיד וְסַלִיק לִרְקִיעָא בְּמֵימַר קָדָם יְיָ וּקְרָא שְׁמֵיהּ מִיטַטְרוֹן סַפְרָא רַבָּא", "pj_en": "And Hanok served in the truth before the Lord; and, behold, he was not with the sojourners of the earth; for he was withdrawn, and he ascended to the firmament by the Word before the Lord, and his name was called Metatron the Great Saphra.", "tj": "וּפְלַח חֲנוֹךְ בְּקוּשְׁטָא קֳדָם יְיָ וְהָא לֵית הוּא אֲרוּם אִיתְנְגִיד בְּמֵימַר מִן קֳדָם יְיָ:", "tj_en": "And Hanok served in the truth before the Lord; and, behold, he was not; for he was withdrawn by the Word from before the Lord.", "rashi": "<b>ויתהלך חנוך.<\/b> צַדִּיק הָיָה וְקַל בְּדַעְתּוֹ לָשׁוּב לְהַרְשִׁיעַ, לְפִיכָךְ מִהֵר הַקָּבָּ\"ה וְסִלְּקוֹ וֶהֱמִיתוֹ קֹדֶם זְמַנּוֹ, וְזֶהוּ שֶׁשִּׁנָּה הַכָּתוּב בְּמִיתָתוֹ לִכְתֹּב וְאֵינֶנּוּ בָּעוֹלָם – לְמַלְּאוֹת שְׁנוֹתָיו ‏(בראשית רבה):<br><br><b>כי לקח אותו.<\/b> לִפְנֵי זְמַנּוֹ, כְּמוֹ הִנְנִי לֹקֵחַ מִמְּךָ אֶת מַחְמַד עֵינֶיךָ (יחזקאל כ\"ד):", "rashi_en": "ויתהלך חנוך AND ENOCH WALKED [WITH GOD] — He was a righteous man, but his mind was easily induced) to turn from his righteous ways and to become wicked. The Holy One, blessed be He, therefore took him away quickly and made him die before his full time. This is why Scripture uses a different expression when referring to his death by writing ואיננו “and he was not”, meaning, he was not in the world to complete the number of his years. <br><br>כי לקח אותו FOR GOD TOOK HIM — before his time; a similar meaning of לקח “to take” we find in (Ezekiel 24:16), “I take away from thee the desire of thine eyes [by a plague]”. "}, {"ch": 5, "v": 25, "aliyah": 7, "heb": "וַיְחִ֣י מְתוּשֶׁ֔לַח שֶׁ֧בַע וּשְׁמֹנִ֛ים שָׁנָ֖ה וּמְאַ֣ת שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־לָֽמֶךְ׃", "onk": "וַחֲיָא מְתוּשֶׁלַח מְאָה וְתַמְנִין וּשְׁבַע שְׁנִין וְאוֹלִיד יָת לָמֶךְ:", "onk_en": "Mesushelach lived one hundred and eighty-seven years and he had a son Lemech.", "pj": "וַחֲיָא מְתוּשֶׁלַח מְאָה וּתְמָנִין וּשְׁבַע שְׁנִין וְאוֹלִיד יַת לָמֶךְ", "pj_en": "And Methushelach lived a hundred and eighty-seven years, and begat Lemek.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 26, "aliyah": 7, "heb": "וַיְחִ֣י מְתוּשֶׁ֗לַח אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־לֶ֔מֶךְ שְׁתַּ֤יִם וּשְׁמוֹנִים֙ שָׁנָ֔ה וּשְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַחֲיָא מְתוּשֶׁלַח בָּתַר דְּאוֹלִיד יָת לֶמֶךְ שְׁבַע מְאָה וְתַמְנִין וְתַרְתֵּין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Lemech, Mesushelach lived seven hundred and eighty-two years, and he had sons and daughters.", "pj": "וַחֲיָא מְתוּשֶׁלַח בָּתַר דְאוֹלִיד יַת לֶמֶךְ שְׁבַע מְאָה וּתְמָנִין וְתַרְתֵּין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Methushelach lived after he had begotten Lemek seven hundred and eighty-two years, and begat sons and daughters.", "tj": "וַחֲיָא מְתוּשֶׁלַח בָּתַר דְאוֹלִיד יַת לָמֶךְ:", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 27, "aliyah": 7, "heb": "וַיִּהְיוּ֙ כׇּל־יְמֵ֣י מְתוּשֶׁ֔לַח תֵּ֤שַׁע וְשִׁשִּׁים֙ שָׁנָ֔ה וּתְשַׁ֥ע מֵא֖וֹת שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי מְתוּשֶׁלַח תְּשַׁע מְאָה וְשִׁתִּין וּתְשַׁע שְׁנִין וּמִית:", "onk_en": "All the days of Mesushelach were nine hundred and sixty-nine, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי מְתוּשֶׁלַח תְּשַׁע מְאָה וְשִׁיתִּין וּתְשַׁע שְׁנִין וּמִית", "pj_en": "And all the days of Methushelach were nine hundred and sixty and nine years; and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 28, "aliyah": 7, "heb": "וַֽיְחִי־לֶ֕מֶךְ שְׁתַּ֧יִם וּשְׁמֹנִ֛ים שָׁנָ֖ה וּמְאַ֣ת שָׁנָ֑ה וַיּ֖וֹלֶד בֵּֽן׃", "onk": "וַחֲיָא לֶמֶךְ מְאָה וְתַמְנִין וְתַרְתֵּין שְׁנִין וְאוֹלִיד בָּר:", "onk_en": "Lemech lived one hundred and eighty-two years and had a son.", "pj": "וַחֲיָא לֶמֶךְ מְאָה וּתְמָנִין וְתַרְתֵּין שְׁנִין וְאוֹלִיד בָּר", "pj_en": "And Lemek lived a hundred and eighty-two years, and begat a son;", "tj": "", "tj_en": "", "rashi": "<b>ויולד בן.<\/b> שֶׁמִּמֶּנּוּ נִבְנָה הָעוֹלָם (בראשית רבה):", "rashi_en": "ויולד בן AND HE BEGOT A SON (בן “son”, connected with the root בנה ‘‘to build”) — from whom the world was built up (peopled) (Tanchuma 1:1:11)"}, {"ch": 5, "v": 29, "aliyah": 7, "heb": "וַיִּקְרָ֧א אֶת־שְׁמ֛וֹ נֹ֖חַ לֵאמֹ֑ר זֶ֞֠ה יְנַחֲמֵ֤נוּ מִֽמַּעֲשֵׂ֙נוּ֙ וּמֵעִצְּב֣וֹן יָדֵ֔ינוּ מִן־הָ֣אֲדָמָ֔ה אֲשֶׁ֥ר אֵֽרְרָ֖הּ יְהֹוָֽה׃", "onk": "וּקְרָא יָת שְׁמֵהּ נֹחַ לְמֵימָר דֵּין יְנַחֲמִנָּנָא מֵעוֹבָדָנָא <b>וּמִלֵּאוּת<\/b> יְדָנָא מִן אַרְעָא דִּי לַטְטַהּ יְיָ:", "onk_en": "He named his son Noach, saying, This one will bring us rest from our work and the anguish [<b>toil<\/b>] of our hands, from the soil which Adonoy has cursed.", "pj": "וּקְרָא יַת שְׁמֵיהּ נחַ לְמֵימָר דֵין יְנַחֲמִינָנָא מִפּוּלְחָנָא דְלָא מַצְלְחָא וּמִלֵיעוֹת יְדָנָא מִן אַרְעָא דִלִטָא יְיָ בְּגִין חוֹבֵי בְּנֵי אֱנָשָׁא", "pj_en": "and he called his name Noah, (Consolation,) saying, This shall console us for our works that are not prosperous, and for the labour of our hands with the earth which the Lord hath cursed on account of the guilt of the sons of men.", "tj": "", "tj_en": "", "rashi": "<b>זה ינחמנו.<\/b> יָנַח מִמֶּנּוּ אֶת עִצְּבוֹן יָדֵינוּ. עַד שֶׁלֹּא בָא נֹחַ לֹא הָיָה לָהֶם כְּלֵי מַחֲרֵשָׁה וְהוּא הֵכִין לָהֶם וְהָיְתָה הָאָרֶץ מוֹצִיאָה קוֹצִים וְדַרְדַּרִים כְּשֶׁזּוֹרְעִים חִטִּים, מִקִּלְלָתוֹ שֶׁל אָדָם הָרִאשׁוֹן, וּבִימֵי נֹחַ נָחָה, וְזֶהוּ יְנַחֲמֵנוּ, וְאִם לֹא תְפָרְשֵׁהוּ כָּךְ אֵין טַעַם הַלָּשׁוֹן נוֹפֵל עַל הַשֵּׁם וְאַתָּה צָרִיךְ לִקְרוֹת שְׁמוֹ מְנַחֵם:", "rashi_en": "זה ינחמנו THIS WILL COMFORT US — He will ease from off us (ינחמנו) the toil of our hands. For until Noah came people had no agricultural instruments and he prepared such for them. The earth had brought forth thorns and thistles when they sowed wheat in consequence of the curse imposed upon Adam Harishon: in the days of Noah, however, this ceased (Tanchuma 1:1:11). This is what is meant by the word ינחמנו (viz., ינח מנו). If, however, you do not explain it in this manner, but from the root נחם “to comfort”, then the meaning you give to this expression (connecting it with the idea of “comfort”) will have no application to the name נח, and you would have to call him מנחם “Comforter”. "}, {"ch": 5, "v": 30, "aliyah": 7, "heb": "וַֽיְחִי־לֶ֗מֶךְ אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־נֹ֔חַ חָמֵ֤שׁ וְתִשְׁעִים֙ שָׁנָ֔ה וַחֲמֵ֥שׁ מֵאֹ֖ת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃", "onk": "וַחֲיָא לֶמֶךְ בָּתַר דְּאוֹלִיד יָת נֹחַ חֲמֵשׁ מְאָה וְתִשְׁעִין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Noach, Lemech lived five hundred and ninety-five years, and he had sons and daughters.", "pj": "וַחֲיָא לֶמֶךְ בָּתַר דְאוֹלִיד יַת נחַ חֲמֵשׁ מְאָה וְתִשְׁעִין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Lemek lived after he had begotten Noah five hundred and ninety and five years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 31, "aliyah": 7, "heb": "וַֽיְהִי֙ כׇּל־יְמֵי־לֶ֔מֶךְ שֶׁ֤בַע וְשִׁבְעִים֙ שָׁנָ֔ה וּשְׁבַ֥ע מֵא֖וֹת שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲווֹ כָּל יוֹמֵי לֶמֶךְ שְׁבַע מְאָה וְשַׁבְעִין וּשְׁבַע שְׁנִין וּמִית:", "onk_en": "All the days of Lemech were seven hu
