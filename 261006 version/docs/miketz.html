א בַּיָּא (יבמות צ\"ז:, סנהדרין ס\"ד.):<br><br><b>ירד ירדנו.<\/b> יְרִידָה הִיא לָנוּ, רְגִילִים הָיִינוּ לְפַרְנֵס אֲחֵרִים, עַכְשָׁו אָנוּ צְרִיכִים לְךָ (בראשית רבה):", "rashi_en": "בי אדני O, MY LORD — The word בי is an expression of entreaty (בעיא) and supplication. In Aramaic we have בייא בייא “woe, woe!” (Yoma 69b).<br><br>ירד ירדנו WE CAME INDEED DOWN — This is a “come down” (degradation) for us. We have been accustomed to give food to others and now we are dependent upon you (Genesis Rabbah 92:4). "}, {"ch": 43, "v": 21, "aliyah": 6, "heb": "וַיְהִ֞י כִּי־בָ֣אנוּ אֶל־הַמָּל֗וֹן וַֽנִּפְתְּחָה֙ אֶת־אַמְתְּחֹתֵ֔ינוּ וְהִנֵּ֤ה כֶֽסֶף־אִישׁ֙ בְּפִ֣י אַמְתַּחְתּ֔וֹ כַּסְפֵּ֖נוּ בְּמִשְׁקָל֑וֹ וַנָּ֥שֶׁב אֹת֖וֹ בְּיָדֵֽנוּ׃", "onk": "וַהֲוָה כַּד אֲתֵינָא לְבֵית מְבָתָא וּפְתַחְנָא יָת טוֹעֲנָנָא וְהָא כְסַף גְּבַר בְּפוּם טוֹעֲנֵיהּ כַּסְפָּנָא בְּמַתְקְלֵיהּ וַאֲתֵיבְנָא יָתֵיהּ בִּידָנָא:", "onk_en": "When we came to the inn and opened our bags, behold each man’s money was in the opening of his bag. It was our own money in its full weight. We have brought it back in our hand.", "pj": "וַהֲוָה כַּד מַטִינָא לְבֵית מִבְתוֹתָא וּפְתַחְנָא יַת טוֹנָנָא וְהָא כְּסַף גְבַר בְּפוּם טוֹנֵיהּ כַּסְפָּנָא בְּמִתְקְלֵיהּ וְאָתֵיבְנָא יָתֵיהּ בִּידָנָא", "pj_en": "But it was when we had come to our place of lodging, that we opened our sacks, and, behold, the money of a man was in the mouth of his sack: but we have brought it back in our hand.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 22, "aliyah": 6, "heb": "וְכֶ֧סֶף אַחֵ֛ר הוֹרַ֥דְנוּ בְיָדֵ֖נוּ לִשְׁבׇּר־אֹ֑כֶל לֹ֣א יָדַ֔עְנוּ מִי־שָׂ֥ם כַּסְפֵּ֖נוּ בְּאַמְתְּחֹתֵֽינוּ׃", "onk": "וְכַסְפָּא אָחֳרָנָא אוֹחִיתְנָא בִידָנָא לְמִזְבַּן <b>עִיבוּרָא<\/b> לָא יְדַעְנָא מָן שַׁוִּי כַסְפָּנָא בְּטוֹעֲנָנָא:", "onk_en": "We have [also] brought other money in our hand to buy food [<b>grain<\/b>]. We do not know who put the money in our bags.", "pj": "וְכַסְפָּא חוֹרָנָא אָחִיתְנָא בִּידָנָא לְמִזְבּוֹן עִיבּוּרָא לָא יָדַעְנָא מַן שַׁוֵי כַסְפָּנָא בְּטוֹנָנָא", "pj_en": "And other money have we brought down in hand to buy corn. We know not who put the money in our sacks.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 23, "aliyah": 6, "heb": "וַיֹּ֩אמֶר֩ שָׁל֨וֹם לָכֶ֜ם אַל־תִּירָ֗אוּ אֱלֹ֨הֵיכֶ֜ם וֵֽאלֹהֵ֤י אֲבִיכֶם֙ נָתַ֨ן לָכֶ֤ם מַטְמוֹן֙ בְּאַמְתְּחֹ֣תֵיכֶ֔ם כַּסְפְּכֶ֖ם בָּ֣א אֵלָ֑י וַיּוֹצֵ֥א אֲלֵהֶ֖ם אֶת־שִׁמְעֽוֹן׃", "onk": "וַאֲמַר שְׁלַם לְכוֹן לָא תִדְחֲלוּן אֱלָהֲכוֹן וֶאֱלָהָא דַאֲבוּכוֹן יְהַב לְכוֹן סִימָא בְּטוֹעֲנֵיכוֹן כַּסְפְּכוֹן אֲתָא לְוָתִי וְאַפֵּיק לְוָתְהוֹן יָת שִׁמְעוֹן:", "onk_en": "He [the man] said, Peace be with you, do not fear. Your God, and the God of your fathers, has given you a hidden gift in your bags. Your money has come to me. He then brought Shimon out to them.", "pj": "וַאֲמַר שְׁלָם לְכוֹן מִן רִבּוֹנִי לָא תִידַחֲלוּן אֱלָהֵיכוֹן וֵאלָהָא דַאֲבוּכוֹן יְהַב לְכוֹן סִימָא בְּטוֹנֵיכוֹן כַּסְפֵּיכוֹן אָתָא לְוָתִי וְאַפֵּיק לְוַותְהוֹן יַת שִׁמְעוֹן", "pj_en": "And he said, Peace to you; be not afraid of my lord. Your God and the God of your fathers gave you treasure in your sacks: your money came to me. And he brought out Shimeon to them.", "tj": "", "tj_en": "", "rashi": "<b>אלהיכם.<\/b> בִּזְכוּתְכֶם, וְאִם אֵין זְכוּתְכֶם כְּדַאי, <b>ואלהי אביכם<\/b>, בִּזְכוּת אֲבִיכֶם <b>נתן לכם מטמון<\/b>:", "rashi_en": "אלהיכם YOUR GOD — your God because of your own merits: and if your own merits do not suffice, then ואלהי אביכם THE GOD OF YOUR FATHER — because of your father’s merits HE HAS GIVEN YOU A TREASURE (Genesis Rabbah 92:4). "}, {"ch": 43, "v": 24, "aliyah": 6, "heb": "וַיָּבֵ֥א הָאִ֛ישׁ אֶת־הָאֲנָשִׁ֖ים בֵּ֣יתָה יוֹסֵ֑ף וַיִּתֶּן־מַ֙יִם֙ וַיִּרְחֲצ֣וּ רַגְלֵיהֶ֔ם וַיִּתֵּ֥ן מִסְפּ֖וֹא לַחֲמֹֽרֵיהֶֽם׃", "onk": "וְאָעֵיל גַּבְרָא יָת גֻּבְרַיָּא לְבֵית יוֹסֵף וִיהַב מַיָּא וְאַסְחוֹ רִגְלֵיהוֹן וִיהַב כִּסְּתָא לַחֲמָרֵיהוֹן:", "onk_en": "The man brought the men into the house of Yoseif. He gave them water and they washed their feet. He had feed given to their donkeys.", "pj": "וְאָעֵיל גַבְרָא יַת גוּבְרַיָא לְבֵית יוֹסֵף וִיהַב מוֹי וּשְׁזִיגוּ רַגְלֵיהוֹן וִיהַב אַסְפַּסְתָּא לַחֲמוֹרֵיהוֹן", "pj_en": "The man brought the men into Joseph's house, and gave them water, and they washed their feet; and he gave them provender for their asses.", "tj": "", "tj_en": "", "rashi": "<b>ויבא האיש.<\/b> הֲבָאָה אַחַר הֲבָאָה, לְפִי שֶׁהָיוּ דוֹחֲפִים אוֹתוֹ לַחוּץ עַד שֶׁדִּבְּרוּ אֵלָיו פֶּתַח הַבַּיִת; וּמִשֶּׁאָמַר לָהֶם שָׁלוֹם לָכֶם, נִמְשְׁכוּ וּבָאוּ אַחֲרָיו:", "rashi_en": "ויבא האיש AND THE MAN BROUGHT [THE MEN] — There is here a mention of bringing in after bringing in has been mentioned in Genesis 43:17, because then they hustled him outside so that they spoke to him at the door of the house (cf. Genesis 43:18 and Genesis 43:19 where they said אנחנו מובאים “we are being brought”), but as soon as he said to them “Peace be with you” they followed and went after him, into the house (Genesis Rabbah 92:4)."}, {"ch": 43, "v": 25, "aliyah": 6, "heb": "וַיָּכִ֙ינוּ֙ אֶת־הַמִּנְחָ֔ה עַד־בּ֥וֹא יוֹסֵ֖ף בַּֽצׇּהֳרָ֑יִם כִּ֣י שָֽׁמְע֔וּ כִּי־שָׁ֖ם יֹ֥אכְלוּ לָֽחֶם׃", "onk": "וְאַתְקִינוּ יָת תִּקְרֻבְתָּא עַד דְּעַל יוֹסֵף <b>בְּשֵׁירוּתָא<\/b> אֲרֵי שְׁמָעוּ אֲרֵי תַמָּן יֵיכְלוּן לַחְמָא:", "onk_en": "They prepared their offering [to be ready] when Yoseif came at noon [<b>to the morning meal<\/b>], for they had heard that they would eat there.", "pj": "וְאַתְקִינִין יַת דוֹרוֹנָא עַד מֵיעַל יוֹסֵף בְשֵׁרוּתָא דְטִיהֲרָא אֲרוּם שָׁמְעוּ מִנֵיהּ אֲרוּם תַּמָן יִסְעֲדוּן לַחֲמָא", "pj_en": "And they made ready the present against the entrance of Joseph at the noon-day feast; for they had heard from him that they were to eat bread there.", "tj": "", "tj_en": "", "rashi": "<b>ויכינו.<\/b> הִזְמִינוּ, עִטְּרוּהָ בְּכֵלִים נָאִים:", "rashi_en": "ויכינו means AND THEY MADE READY — they laid it out ornately in fine vessels."}, {"ch": 43, "v": 26, "aliyah": 6, "heb": "וַיָּבֹ֤א יוֹסֵף֙ הַבַּ֔יְתָה וַיָּבִ֥יאּוּ ל֛וֹ אֶת־הַמִּנְחָ֥ה אֲשֶׁר־בְּיָדָ֖ם הַבָּ֑יְתָה וַיִּשְׁתַּחֲווּ־ל֖וֹ אָֽרְצָה׃", "onk": "וְעַל יוֹסֵף לְבֵיתָא וְאַיְתִיאוּ לֵיהּ יָת תִּקְרֻבְתָּא דִּי בִידֵיהוֹן לְבַיְתָא וּסְגִידוּ לֵיהּ לְאַרְעָא:", "onk_en": "Yoseif came to the house, and they brought the offering that was in their hand, to him in the house. They prostrated themselves on the ground to him.", "pj": "וְעַל יוֹסֵף לְבֵיתָא וְאָעִילוּ לֵיהּ יַת דוֹרוֹנָא דִי בִידֵיהוֹן לְבֵיתָא וּסְגִידוּ לֵיהּ עַל אַרְעָא", "pj_en": "And Joseph entered the house, and they offered to him the present which was in their hands for the house; and bowed before him upon the ground.", "tj": "", "tj_en": "", "rashi": "<b>הביתה.<\/b> מִפְּרוֹזְדּוֹר לִטְרַקְלִין:", "rashi_en": "הביתה [THEY BROUGHT THE PRESENT] INTO THE HOUSE — from the outer hall into the reception hall."}, {"ch": 43, "v": 27, "aliyah": 6, "heb": "וַיִּשְׁאַ֤ל לָהֶם֙ לְשָׁל֔וֹם וַיֹּ֗אמֶר הֲשָׁל֛וֹם אֲבִיכֶ֥ם הַזָּקֵ֖ן אֲשֶׁ֣ר אֲמַרְתֶּ֑ם הַעוֹדֶ֖נּוּ חָֽי׃", "onk": "וּשְׁאֵיל לְהוֹן לִשְׁלַם וַאֲמַר הַשְׁלַם אֲבוּכוֹן סָבָא דִּי אֲמַרְתּוּן הַעַד כְּעַן קַיָּם:", "onk_en": "He inquired about their welfare, and said, Is your old father at peace, the one about whom you spoke? Is he still alive?", "pj": "וּשְׁאֵיל לְהוֹם לִשְׁלָם וַאֲמַר הַשְׁלָם לַאֲבוּכוֹן סָבָא דַאֲמַרְתּוּן לִי הַעוֹד כְּדוֹן קַיָים", "pj_en": "And Joseph saluted them, and said, Is it well with your father, the old man of whom you told me? Is he still alive?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 28, "aliyah": 6, "heb": "וַיֹּאמְר֗וּ שָׁל֛וֹם לְעַבְדְּךָ֥ לְאָבִ֖ינוּ עוֹדֶ֣נּוּ חָ֑י וַֽיִּקְּד֖וּ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(וישתחו)<\/span> <span class=\"mam-kq-q\">[וַיִּֽשְׁתַּחֲוֽוּ]<\/span><\/span>׃", "onk": "וַאֲמָרוּ שְׁלַם לְעַבְדָּךְ לְאָבוּנָא עַד כְּעַן קַיָּם וּכְרָעוּ וּסְגִידוּ:", "onk_en": "They said, Your servant, our father is at peace. He is still alive. They bowed their heads and prostrated themselves.", "pj": "וַאֲמָרוּ שְׁלַם לְעַבְדָךְ לְאָבוּנָא עַד כְּדוֹן הוּא קַיֵים וְגַחֲנוּ וּסְגִידוּ", "pj_en": "They answered, It is well with thy servant our father; he is yet alive. And they bowed and made obeisance.", "tj": "", "tj_en": "", "rashi": "<b>ויקדו וישתחוו.<\/b> עַל שְׁאִלַת שָׁלוֹם קִידָה – כְּפִיפַת קָדְקֹד; הִשְׁתַּחֲוָאָה – מִשְׁתַּטֵּחַ לָאָרֶץ:", "rashi_en": "ויקדו וישתחו AND THEY BOWED THE HEAD AND PROSTRATED THEMSELVES — in recognition of his enquiry regarding their welfare. The root קדד denotes bowing the head: the verb שחה in the Hiphil denotes prostration upon the ground (Megillah 22b). "}, {"ch": 43, "v": 29, "aliyah": 6, "heb": "וַיִּשָּׂ֣א עֵינָ֗יו וַיַּ֞רְא אֶת־בִּנְיָמִ֣ין אָחִיו֮ בֶּן־אִמּוֹ֒ וַיֹּ֗אמֶר הֲזֶה֙ אֲחִיכֶ֣ם הַקָּטֹ֔ן אֲשֶׁ֥ר אֲמַרְתֶּ֖ם אֵלָ֑י וַיֹּאמַ֕ר אֱלֹהִ֥ים יׇחְנְךָ֖ בְּנִֽי׃", "onk": "וּזְקַף עֵינוֹהִי וַחֲזָא יָת בִּנְיָמִין אֲחוּהִי בַּר אִמֵּיהּ וַאֲמַר הָדֵין אֲחוּכוֹן זְעֵירָא דִּי אֲמַרְתּוּן לִי וַאֲמַר <b>מִן קֳדָם יְיָ יִתְרַחַם עֲלָךְ<\/b> בְּרִי:", "onk_en": "He raised his eyes and saw his brother Binyamin, his mother’s son, and said, Is this your youngest brother of whom you spoke to me? He [then] said, Elohim be gracious to you [<b>Graciousness from before Elohim be upon you<\/b>] my son.", "pj": "וּזְקַף יַת עֵינוֹי וַחֲמָא יַת בִּנְיָמִין אָחוֹי בַּר אִמֵיהּ וַאֲמַר הָדֵין אֲחוּכוֹן זְעֵירָא דַאֲמַרְתּוּן לִי וַאֲמַר מִן קֳדָם יְיָ יִתְרַחֵם עֲלָךְ בְּרִי", "pj_en": "And he lifted up his eyes and saw Benjamin his brother, the son of his mother, and said, Is this your youngest brother of whom you told me? And he said, Mercy from the Lord be upon thee, my son!", "tj": "", "tj_en": "", "rashi": "<b>אלהים יחנך בני.<\/b> בִּשְׁאָר שְׁבָטִים שָׁמַעְנוּ חֲנִינָה אֲשֶׁר חָנַן אֱלֹהִים אֶת עַבְדֶּךָ (בראשית ל\"ג), וּבִנְיָמִין עֲדַיִן לֹא נוֹלַד, לְכָךְ בֵּרְכוֹ יוֹסֵף בַּחֲנִינָה:", "rashi_en": "אלהים יחנך בני GOD BE GRACIOUS UNTO THEE, MY SON — With regard of the other sons of Jacob we have heard the expression “grace” used — viz., (33:5) “[The children] whom God hath graciously given (חנן) to thy servant”. But Benjamin had not then been born and therefore was not included amongst the children of whom Jacob used this term; on this account Joseph used the term “grace” in blessing him (Genesis Rabbah 92:5). "}, {"ch": 43, "v": 30, "aliyah": 7, "heb": "וַיְמַהֵ֣ר יוֹסֵ֗ף כִּֽי־נִכְמְר֤וּ רַחֲמָיו֙ אֶל־אָחִ֔יו וַיְבַקֵּ֖שׁ לִבְכּ֑וֹת וַיָּבֹ֥א הַחַ֖דְרָה וַיֵּ֥בְךְּ שָֽׁמָּה׃", "onk": "וְאוֹחִי יוֹסֵף אֲרֵי אִתְגּוֹלְלוּ רַחֲמוֹהִי עַל אֲחוּהִי וּבְעָא לְמִבְכֵּי וְעַל לְאִדְרוֹן בֵּית <b>מִשְׁכְּבָא<\/b> וּבְכָא תַמָּן:", "onk_en": "Yoseif hurried [to go out] because his compassion was aroused toward his brother, and he wanted to weep. He went into [his] [<b>bed<\/b>]room and wept there.", "pj": "וְאוֹחִי יוֹסֵף אֲרוּם רָחְשׁוּ רַחֲמוֹי עַל אָחוֹי וּבְעָא לְמִבְכֵּי וְעַל לְקִיטוֹנָא דְבֵי מְדַמְכָא וּבְכָא תַמָן", "pj_en": "And Joseph made haste, for his compassions were moved upon his brother, and he sought to weep, and he went into the chamber the house of sleep, and wept there.", "tj": "לְקִיטוּנָה:", "tj_en": "Into the chamber", "rashi": "<b>כי נכמרו רחמיו.<\/b> שְׁאָלוֹ יֵשׁ לְךָ אָח מֵאֵם? אָמַר לוֹ אָח הָיָה לִי, וְאֵינִי יוֹדֵעַ הֵיכָן הוּא; יֵשׁ לְךָ בָנִים? אָמַר לוֹ יֵשׁ לִי י', אָמַר לוֹ מַה שְּׁמָם? אָמַר לוֹ בֶּלַע וָבֶכֶר וְגוֹ'; אָמַר מַה טִּיבָן שֶׁל שֵׁמוֹת הַלָּלוּ? אָמַר לוֹ כֻּלָּם עַל שֵׁם אָחִי וְהַצָּרוֹת אֲשֶׁר מְצָאוּהוּ, בֶּלַע שֶׁנִּבְלַע בֵּין הָאֻמּוֹת, בֶּכֶר שֶׁהָיָה בְּכוֹר לְאִמִּי, אַשְׁבְּאֵל שֶׁשְּׁבָאוֹ אֵל, גֵּרָא שֶׁגָּר בְּאַכְסַנְיָא, וְנַעֲמָן שֶׁהָיָה נָעִים בְּיוֹתֵר, אֵחִי וָרֹאשׁ – אָחִי הָיָה וְרֹאשִׁי הָיָה, מֻפִּים – מִפִּי אָבִי לָמַד, וְחֻפִּים – שֶׁלֹּא רָאָה חֻפָּתִי וְלֹא רָאִיתִי אֲנִי חֻפָּתוֹ, וָאָרְדְּ – שֶׁיָּרַד לְבֵין הָאֻמּוֹת, כִּדְאִיתָא בְּמַסֶּכֶת סוֹטָה, מִיָּד נִכְמְרוּ רַחֲמָיו:<br><br><b>נכמרו.<\/b> נִתְחַמְּמוּ, וּבִלְשׁוֹן מִשְׁנָה עַל הַכֹּמֶר שֶׁל זֵתִים, וּבְלָשׁוֹן אֲרַמִּי בְּמִכְמַר בִּשְׂרָא; וּבַמִּקְרָא עוֹרֵנוּ כְּתַנּוּר נִכְמָרוּ (איכה ה'), נִתְחַמְּמוּ וְנִקְמְטוּ קְמָטִים קְמָטִים מִפְּנֵי זַלְעֲפוֹת רָעָב; כֵּן דֶּרֶךְ כָּל עוֹר כְּשֶׁמְּחַמְּמִין אוֹתוֹ נִקְמָט וְנִכְוָץ:", "rashi_en": "כי נכמרו רחמיו FOR HIS COMPASSION WAS EXCITED — He asked him, “Have you a brother of the same mother as yourself?” — He replied, “I had a brother but I know not where he is”. — “Have you sons?” He replied, “I have ten”. Joseph asked him, “And what are their names?” Benjamin replied, “Bela, Becher etc.” (cf. 46:21). Joseph then enquired, “What are the ideas underlying these names?” He replied, “They all have some reference to my brother and the troubles that have befallen him. I called them Bela (בלע) because he disappeared (נבלע) amongst alien nations; Becher (בכר) because he was the firstborn (בכור) of his mother; Ashbel (אשבאל) because God sent him into captivity (שבאו אל), Gera (גרא) because he had to live (גר) in a foreign country; Naaman (נעמן) because he was exceedingly pleasant (נעים); Ahi (אחי) and Rosh (ראש) because he was my brother (אח) and my superior (ראש) ; Muppim (מופים) because he learned from the mouth (מפי) of my father; Huppim (חופים) because he did not witness my marriage (חופה —marriage canopy) and I did not witness his marriage; and Ard (ארד) because he went down (ירד) amongst the nations” — just as it related in Treatise Sotah 36b. When he heard all this immediately his affection was enkindled.<br><br>נכמרו means WAS ENKINDLED, BECAME HOT — In Mishnaic Hebrew we have (Bava Metzia 74a) “upon (כומר) a mass of heated olives”; in Aramaic (Pesachim 58a) “because of the (מכמר) drying up (through heat of the weather) of the meat”. And in Biblical Hebrew we have (Lamentations 5:10) “Our skin is hot (נכמרו) as though by an oven” — i.e. it became hot and full of wrinkles “because of the burning heat of the famine”, for it is the nature of any skin to wrinkle and shrink together when it becomes hot. "}, {"ch": 43, "v": 31, "aliyah": 7, "heb": "וַיִּרְחַ֥ץ פָּנָ֖יו וַיֵּצֵ֑א וַיִּ֨תְאַפַּ֔ק וַיֹּ֖אמֶר שִׂ֥ימוּ לָֽחֶם׃", "onk": "וְאַסְחֵי אַפּוֹהִי וּנְפָק וְאִתְחַסִּין וַאֲמַר שַׁוִּיאוּ לַחְמָא:", "onk_en": "He washed his face and came out. He composed himself, and said, Serve bread.", "pj": "וְשָׁזַג אַפּוֹי מִן דִמְעוֹן וּנְפַק וְאִזְדְרַז וַאֲמַר שַׁווּ לַחְמָא", "pj_en": "And he washed his face from tears, and came forth, and hastened and said, Set bread.", "tj": "וְשִׁזְגֵי:", "tj_en": "And he washed", "rashi": "<b>ויתאפק.<\/b> נִתְאַמֵּץ; וְהוּא לְשׁוֹן אֲפִיקֵי מָגִנִּים (איוב מ\"א), חֹזֶק, וְכֵן וּמְזִיחַ אֲפִיקִים רִפָּה (שם י\"ב):", "rashi_en": "ויתאפק AND HE REFRAINED HIMSELF — He made a strong effort. The root in this sense occurs in (Job 41:7) אפיקי “the strong parts of the shields”. Similar also is (Job 12:21) “And He looseth the belt of the (אפיקים) strong”. "}, {"ch": 43, "v": 32, "aliyah": 7, "heb": "וַיָּשִׂ֥ימוּ ל֛וֹ לְבַדּ֖וֹ וְלָהֶ֣ם לְבַדָּ֑ם וְלַמִּצְרִ֞ים הָאֹכְלִ֤ים אִתּוֹ֙ לְבַדָּ֔ם כִּי֩ לֹ֨א יוּכְל֜וּן הַמִּצְרִ֗ים לֶאֱכֹ֤ל אֶת־הָֽעִבְרִים֙ לֶ֔חֶם כִּי־תוֹעֵבָ֥ה הִ֖וא לְמִצְרָֽיִם׃", "onk": "וְשַׁוִּיאוּ לֵיהּ בִּלְחוֹדוֹהִי וּלְהוֹן בִּלְחוֹדֵיהוֹן וּלְמִצְרָאֵי דְּאָכְלִין עִמֵּיהּ בִּלְחוֹדֵיהוֹן אֲרֵי לָא יָכְלִין מִצְרָאֵי לְמֵיכַל עִם עִבְרָאֵי לַחְמָא אֲרֵי <b>בְעִירָא<\/b> דְּמִצְרָאֵי <b>דָחֲלִין לֵיהּ עִבְרָאֵי אָכְלִין<\/b>:", "onk_en": "They set [a place] for him by himself, and for them by themselves, and for the Egyptians who ate with him by themselves, since the Egyptians could not eat food with the Hebrews, because it was loathsome to the [<b>the animal that the<\/b>] Egyptians [<b>worship, the Hebrews eat<\/b>].", "pj": "וְשַׁוִיוּ לֵיהּ בִּלְחוֹדוֹי וּלְהוֹן בִּלְחוֹדֵיהוֹן וּלְמִצְרָאֵי דְאָכְלִין עִמֵיהּ בִּלְחוֹדֵיהוֹן אֲרוּם לָא כַשְׁרִין מִצְרָאֵי לְמֵיכוֹל עִם יְהוּדָאֵי לַחְמָא אֲרוּם בְּעִירָא דְמִצְרָאֵי דַחְלִין לֵיהּ יְהוּדָאֵי אָכְלִין", "pj_en": "And they set for him by himself, and for them by themselves, and for the Mizraee who ate with him by themselves; for it was not proper for the Mizraee to eat bread with the Yehudaee, because the animals which the Mizraee worshipped the Yehudaee ate.", "tj": "", "tj_en": "", "rashi": "<b>כי תועבה הוא.<\/b> דָּבָר שָׂנְאוּי הוּא לַמִּצְרִים לֶאֱכֹל אֶת הָעִבְרִים, וְאֻנְקְלוֹס נָתַן טַעַם לַדָּבָר:", "rashi_en": "כי תועבה היא FOR THAT IS AN ABOMINATION — it is a hateful thing to the Egyptians to eat together with the Hebrews. Onkelos states a reason for this. "}, {"ch": 43, "v": 33, "aliyah": 7, "heb": "וַיֵּשְׁב֣וּ לְפָנָ֔יו הַבְּכֹר֙ כִּבְכֹ֣רָת֔וֹ וְהַצָּעִ֖יר כִּצְעִרָת֑וֹ וַיִּתְמְה֥וּ הָאֲנָשִׁ֖ים אִ֥ישׁ אֶל־רֵעֵֽהוּ׃", "onk": "<b>וְאַסְחָרוּ<\/b> קֳדָמוֹהִי רַבָּא כְּרַבְיוּתֵיהּ וּזְעֵירָא כִּזְעֵרוּתֵיהּ וּתְמָהוּ גֻבְרַיָּא גְּבַר לְחַבְרֵיהּ:", "onk_en": "They were seated [<b>reclined<\/b>] before him, the first born [the oldest] according to his birthright, and the youngest according to his youth. The men looked at each other in astonishment.", "pj": "וְאַחְזָרוּ קֳדָמוֹי רַבָּא כְּהִלְכַת רַבָּנוֹתֵיהּ וּזְעֵירָא כְּהִלְכַת זְעֵירוֹתֵיהּ וַהֲוָה נָקִיט כַּסָא דְכַסְפָּא בִּידֵיהּ וּמְקַשְׁקֵשׁ כִּמְנַחֵשׁ בְּנָהָא דְלֵאָה סָדַר מִצִיטְרָא חָדָא וּבְנָהָא דְזִלְפָּה מִצִיטְרָא חָדָא וּבְנָהָא דְבִלְהָה מִצִיטְרָא חָדָא וּבִנְיָמִין בַּר רָחֵל סָדַר לְצִיטְרֵיהּ וְתַמְהוּ גוּבְרַיָא אֵינַשׁ בְּחַבְרֵיהּ", "pj_en": "And they sat around him, the greatest according to his majority, and the less according to his minority. For he had taken the silver cup in his hand, and, sounding as if divining he had set in order the sons of Leah on one side, and the sons of Zilpha on the other side, and the sons of Bilhah on another side, and Benjamin the son of Rahel he ordered by the side of himself. And the men wondered each at the other.", "tj": "", "tj_en": "", "rashi": "<b>הבכור כבכרתו.<\/b> מַכֶּה בַּגָּבִיעַ וְקוֹרֵא רְאוּבֵן, שִׁמְעוֹן, לֵוִי, יְהוּדָה, יִשָּׂשכָר, וּזְבוּלֻן, בְּנֵי אֵם אַחַת, הָסֵבּוּ כַּסֵּדֶר הַזֶּה, שֶׁהִיא סֵדֶר תּוֹלְדוֹתֵיכֶם, וְכֵן כֻּלָּם. כֵּיוָן שֶׁהִגִּיעַ לְבִנְיָמִין, אָמַר זֶה אֵין לוֹ אֵם וַאֲנִי אֵין לִי אֵם, יֵשֵׁב אֶצְלִי:", "rashi_en": "הבכור כבכרתו THE FIRST-BORN ACCORDING TO HIS BIRTHRIGHT — He struck the goblet and called aloud: Reuben, Simeon, Levi, Judah, Issachar and Zebulon, sons of one mother, take your seats at the table in this order which is the order in which you were born — and similarly in the case of them all. When he reached Benjamin’s name he said, “This one has no mother and I have no mother — let him sit beside me” (Genesis Rabbah 92:5)."}, {"ch": 43, "v": 34, "aliyah": 7, "heb": "וַיִּשָּׂ֨א מַשְׂאֹ֜ת מֵאֵ֣ת פָּנָיו֮ אֲלֵהֶם֒ וַתֵּ֜רֶב מַשְׂאַ֧ת בִּנְיָמִ֛ן מִמַּשְׂאֹ֥ת כֻּלָּ֖ם חָמֵ֣שׁ יָד֑וֹת וַיִּשְׁתּ֥וּ וַֽיִּשְׁכְּר֖וּ עִמּֽוֹ׃", "onk": "וּנְטַל חֳלָקִין מִן קֳדָמוֹהִי לָ<b>קֳדָמֵי<\/b>הוֹן וּסְגִי חֲלָקָא דְבִנְיָמִן מֵחֳלָקֵי דְכָלְּהוֹן חַמְשָׁא חֳלָקִין וּשְׁתִיאוּ וּרְוִיאוּ עִמֵּיהּ:", "onk_en": "He had portions carried from before him to [<b>before<\/b>] them. Binyomin’s portions was greater than all of their’s—five times as much. They drank with him and became intoxicated.", "pj": "וּנְטַל חוּלְקִין מֵעַל פְּתוֹרֵיהּ וְשַׁדְרִינוּן מִן קֳדָמוֹי לִקְדָמֵיהוֹן וּסְגָא חוּלְקָא דְבִנְיָמִין מִן חוּלְקֵי כֻּלְהוֹן חַמְשָׁא חוּלְקִין חוּלַק חַד חוּלְקֵיהּ וְחוּלַק חַד מִן דִילֵיהּ וְחוּלַק חַד מִן אִנְתְּתֵיהּ וּתְרֵין חוּלְקִין מִן תְּרֵין בְּנוֹי וּשְׁתִיוּ וּרְוִיוּ עִמֵיהּ דְמִן יוֹמָא דְאִיתְפְּרָשׁוּ מִנֵיהּ לָא שָׁתוּ חַמְרָא לָא הוּא וְלָא הִינוּן עַד יוֹמָא הַהוּא", "pj_en": "And he sent portions from his table, and they set them forth from him before them. But Benjamin's portion was larger than the portions of any of them; five portions: one was his own portion one portion from himself, one from his wife, and two portions from his two sons. And they drank and were drunken with him; for from the day when they were separated from him they had not drunk wine, neither he nor they, until that day.", "tj": "", "tj_en": "", "rashi": "<b>משאת.<\/b> מָנוֹת:<br><br><b>חמש ידות.<\/b> חֶלְקוֹ עִם אֶחָיו, וּמַשְׂאַת יוֹסֵף וְאָסְנַת וּמְנַשֶּׁה וְאֶפְרַיִם:<br><br><b>וישכרו עמו.<\/b> וּמִיּוֹם שֶׁמְּכָרוּהוּ לֹא שָׁתוּ יַיִן וְלֹא הוּא שָׁתָה יַיִן, וְאוֹתוֹ הַיּוֹם שָׁתוּ (בראשית רבה):", "rashi_en": "משאת means PORTIONS OF FOOD.<br><br>חמש ידות FIVE TIMES — His own portion that was due to him alike with his brothers and additional portions given to him by Joseph, Asenath, Manasseh and Ephraim (Genesis Rabbah 92.5).<br><br>וישכרו עמו AND THEY DRANK WITH HIM — but from the day they sold him they had not drunk wine nor had he drunk wine. That day, however, they drank wine (Genesis Rabbah 92:5)."}, {"ch": 44, "v": 1, "aliyah": 7, "heb": "וַיְצַ֞ו אֶת־אֲשֶׁ֣ר עַל־בֵּיתוֹ֮ לֵאמֹר֒ מַלֵּ֞א אֶת־אַמְתְּחֹ֤ת הָֽאֲנָשִׁים֙ אֹ֔כֶל כַּאֲשֶׁ֥ר יוּכְל֖וּן שְׂאֵ֑ת וְשִׂ֥ים כֶּֽסֶף־אִ֖ישׁ בְּפִ֥י אַמְתַּחְתּֽוֹ׃", "onk": "וּפַקֵּיד יָת דִּי מְמַנָּא עַל בֵּיתֵיהּ לְמֵימַר מְלֵי יָת טוֹעֲנֵי גֻבְרַיָּא <b>עִיבוּרָא<\/b> כְּמָה דִי יָכְלִין לְמַטְּלֵי וְשַׁוִּי כְּסַף גְּבַר בְּפוּם טוֹעֲנֵיהּ:", "onk_en": "He commanded the one in charge of his house, saying, Fill the men’s bags with as much food [<b>grain<\/b>] as they can carry, and place each man’s money in the opening of his bag.", "pj": "וּפְקֵיד יַת מְנַשֶׁה דִמְמַנָא אַפִּיטְרוֹפּוֹס עַל בֵּיתֵיהּ לְמֵימָר מְלֵי יַת דִיסְקְיֵי גוּבְרַיָיא עִיבּוּרָא הֵיכְמָא דְאִינוּן יָכְלִין לְסוֹבְרָא וְשַׁוֵי כְּסַף גְבַר בְּפוּם טוֹנֵיהּ", "pj_en": "And he commanded Menasheh whom he had appointed intendant of his house, saying, Fill the men's sacks with corn, as much as they can carry, and put each man's money in the mouth of his bag.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 2, "aliyah": 7, "heb": "וְאֶת־גְּבִיעִ֞י גְּבִ֣יעַ הַכֶּ֗סֶף תָּשִׂים֙ בְּפִי֙ אַמְתַּ֣חַת הַקָּטֹ֔ן וְאֵ֖ת כֶּ֣סֶף שִׁבְר֑וֹ וַיַּ֕עַשׂ כִּדְבַ֥ר יוֹסֵ֖ף אֲשֶׁ֥ר דִּבֵּֽר׃", "onk": "וְיָת קַלִּידִי קַלִּידָא דְכַסְפָּא תְּשַׁוֵּי בְּפוּם טוֹעֲנָא דִזְעֵירָא וְיָת כְּסַף זְבִינוֹהִי וַעֲבַד כְּפִתְגָּמָא דְיוֹסֵף דִּי מַלִּיל:", "onk_en": "And my goblet, the silver goblet, put in the opening of the youngest one’s bag, together with the money for his purchase of food. He acted according to the word Yoseif had spoken.", "pj": "וְיַת אוֹגְבִינִי אוֹגְבִין דְכַסְפָּא שַׁוֵי בְּפוּם טוֹנָא דִזְעֵירָא וְיַת כְּסַף זַבִּינוֹי וְעָבַד כְּפִתְגָמָא דְיוֹסֵף דְמַלֵיל", "pj_en": "And put my cup, the silver cup, in the mouth of the sack of the youngest, and his purchase money. And he did according to the word which Joseph had spoken.", "tj": "", "tj_en": "", "rashi": "<b>גביעי.<\/b> כּוֹס אָרֹךְ, וְקוֹרִין לוֹ מדיר\"נש בְּלַעַז:", "rashi_en": "גביעי MY CUP — a long goblet called maderin in old French."}, {"ch": 44, "v": 3, "aliyah": 7, "heb": "הַבֹּ֖קֶר א֑וֹר וְהָאֲנָשִׁ֣ים שֻׁלְּח֔וּ הֵ֖מָּה וַחֲמֹרֵיהֶֽם׃", "onk": "צַפְרָא נְהָר וְגֻבְרַיָּא אִתְפַּטָּרוּ אִנּוּן וַחֲמָרֵיהוֹן:", "onk_en": "With the morning light, the men were sent [on their way] together with their donkeys.", "pj": "צַפְרָא נְהִיר וְגַבְרַיָא אִיתְפַּטָרוּ הִינוּן וַחֲמָרֵיהוֹן", "pj_en": "The morning lightened, and the men were sent away, they and their asses.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 4, "aliyah": 7, "heb": "הֵ֠ם יָֽצְא֣וּ אֶת־הָעִיר֮ לֹ֣א הִרְחִ֒יקוּ֒ וְיוֹסֵ֤ף אָמַר֙ לַֽאֲשֶׁ֣ר עַל־בֵּית֔וֹ ק֥וּם רְדֹ֖ף אַחֲרֵ֣י הָֽאֲנָשִׁ֑ים וְהִשַּׂגְתָּם֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם לָ֛מָּה שִׁלַּמְתֶּ֥ם רָעָ֖ה תַּ֥חַת טוֹבָֽה׃", "onk": "אִנּוּן נְפָקוּ מִן קַרְתָּא לָא אַרְחִיקוּ וְיוֹסֵף אֲמַר לְדִי מְמַנָּא עַל בֵּיתֵיהּ קוּם רְדַף בָּתַר גֻּבְרַיָּא וְתַדְבְּקִנּוּן וְתֵימַר לְהוֹן לְמָה אַשְׁלֶמְתּוּן בִּישָׁא חֳלָף טַבְתָא:", "onk_en": "They had just left the city, they had not gone far, when Yoseif said to the one in charge of his house, Get up, pursue the men, and when you catch up with them, say to them, Why did you repay good with evil.", "pj": "הִינוּן נְפָקוּ מִן קַרְתָּא לָא אַרְחִיקוּ וְיוֹסֵף אָמַר לִמְנַשֶׁה דִי מְמַנָא אַפִּיטְרוֹפּוֹס עַל בֵּיתֵיהּ קוּם רְדַף בָּתַר גוּבְרַיָא וְתַדְבִּיקִינוּן וְתֵמַר לְהוֹם לְמָה שְׁלֵימְתּוּן בִּישְׁתָּא חוֹלַף טַבְתָא", "pj_en": "They had not gone far from city, when Joseph said to Measheh whom he had appointed the intendant of his house, Arise, follow after the men, overtake them and say to them, Why have ye returned evil for good ?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 5, "aliyah": 7, "heb": "הֲל֣וֹא זֶ֗ה אֲשֶׁ֨ר יִשְׁתֶּ֤ה אֲדֹנִי֙ בּ֔וֹ וְה֕וּא נַחֵ֥שׁ יְנַחֵ֖שׁ בּ֑וֹ הֲרֵעֹתֶ֖ם אֲשֶׁ֥ר עֲשִׂיתֶֽם׃", "onk": "הֲלָא דֵין דְּשָׁתֵי רִבּוֹנִי בֵּיהּ וְהוּא <b>בָּדָקָא מְבָדֵק<\/b> בֵּיהּ אַבְאֶשְׁתּוּן דִּי עֲבַדְתּוּן:", "onk_en": "Why, this is [the goblet] from which my master drinks. He uses it for divination [<b>investigating<\/b>]. You have acted badly in what you have done.", "pj": "הֲלָא דֵין דַהֲוָה שָׁתֵי רִבּוֹנִי בֵּיהּ וְהוּא מְטַיְירָא הֲוָה מְטַיֵיר בֵּיהּ אַבְאֵשְׁתּוּן מַה דַעֲבַדְתּוּן", "pj_en": "Is it not that from which my lord drinketh, and by which divining he divineth? That which you have done is evil.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 6, "aliyah": 7, "heb": "וַֽיַּשִּׂגֵ֑ם וַיְדַבֵּ֣ר אֲלֵהֶ֔ם אֶת־הַדְּבָרִ֖ים הָאֵֽלֶּה׃", "onk": "וְאַדְבֵּיקִנּוּן וּמַלִּיל עִמְּהוֹן יָת פִּתְגָּמַיָּא הָאִלֵּין:", "onk_en": "He caught up with them, and spoke these exact words to them.", "pj": "וְאַדְבִּיקִינוּן וּמַלֵיל עִמְהוֹן יַת כָּל פִּתְגָמַיָא הָאִילֵין", "pj_en": "And he overtook them, and spake with them all these words.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 7, "aliyah": 7, "heb": "וַיֹּאמְר֣וּ אֵלָ֔יו לָ֚מָּה יְדַבֵּ֣ר אֲדֹנִ֔י כַּדְּבָרִ֖ים הָאֵ֑לֶּה חָלִ֙ילָה֙ לַעֲבָדֶ֔יךָ מֵעֲשׂ֖וֹת כַּדָּבָ֥ר הַזֶּֽה׃", "onk": "וַאֲמָרוּ לֵיהּ לְמָה יְמַלֵּל רִבּוֹנִי כְּפִתְגָּמַיָּא הָאִלֵּין <b>חַס לְעַבְדָיךְ מִלְּמֶעְבַּד<\/b> כְּפִתְגָּמָא הָדֵין:", "onk_en": "They said to him, Why does my master speak such words? It would be degrading for your servants to do [<b>May your servants be spared from doing<\/b>] such a thing.", "pj": "וַאֲמָרוּ לֵיהּ לְמָא יְמַלֵיל רִבּוֹנִי כְּפִתְגָמַיָא הָאִילֵין חַס לְעַבְדָךְ מִלְמֶעֱבַד כְּפִתְגָמַיָא הָדֵין", "pj_en": "They said to him, Why does my lord speak words like these ? Far be it from thy servants to do such a thing.", "tj": "", "tj_en": "", "rashi": "<b>חלילה לעבדיך.<\/b> חֻלִּין הוּא לָנוּ, לְשׁוֹן גְּנַאי, וְתַרְגוּם חַס לְעַבְדָּיךְ – חַס מֵאֵת הַקָּדוֹשׁ בָּרוּךְ הוּא יְהִי עָלֵינוּ מֵעֲשׂוֹת זֹאת, וְהַרְבֵּה יֵשׁ בַּתַּלְמוּד \"חַס וְשָׁלוֹם\":", "rashi_en": "חלילה לעבדיך FAR BE IT FROM TIIY SERVANTS — It is a degradation (חולין a profane thing) — this is an expression denoting a shameful act. The Targum חס לעבדיך “a sparing to thy servants!” signifies “May there be a sparing from God upon us that we should not do this thing” The expression חס ושלום occurs often in the Talmud in this sense — Forbearance and peace! "}, {"ch": 44, "v": 8, "aliyah": 7, "heb": "הֵ֣ן כֶּ֗סֶף אֲשֶׁ֤ר מָצָ֙אנוּ֙ בְּפִ֣י אַמְתְּחֹתֵ֔ינוּ הֱשִׁיבֹ֥נוּ אֵלֶ֖יךָ מֵאֶ֣רֶץ כְּנָ֑עַן וְאֵ֗יךְ נִגְנֹב֙ מִבֵּ֣ית אֲדֹנֶ֔יךָ כֶּ֖סֶף א֥וֹ זָהָֽב׃", "onk": "הָא כַסְפָּא דִּי אַשְׁכַּחְנָא בְּפוּם טוֹעֲנָנָא אֲתֵיבְנוֹהִי לָךְ מֵאַרְעָא דִכְנָעַן וְאֶכְדֵּין נִגְנוּב מִבֵּית רִבּוֹנָךְ כַּסְפָּא אוֹ דַהֲבָא (<b>מָנִין<\/b> דִּכְסַף אוֹ <b>מָנִין<\/b> דִּדְהָב):", "onk_en": "Behold the money that we found in the opening of our bags, we brought back to you from the land of Canaan. How then could we have stolen silver [<b>vessels<\/b>] or gold [<b>vessels<\/b>] from your master’s house?", "pj": "הָא כַסְפָּא דְאַשְׁכַּחְנָא בְּפוּם טוֹנָנָא אָתִיבְנֵיהּ לָךְ מֵאַרְעָא דִכְנָעַן וְהֵיכְדֵין נִיגְנוֹב מִבֵּית רִבּוֹנָךְ מָנִין דִכְסַף אוֹ מָנִין דִדְהָב", "pj_en": "Behold, the money which we found in the mouth of our bags we brought to thee again from the land of Kenaan; how then should we steal from thy lord's house vessels of silver, or vessels of gold?", "tj": "", "tj_en": "", "rashi": "<b>הן כסף אשר מצאנו.<\/b> זֶה אֶחָד מֵעֲשָׂרָה קַל וָחֹמֶר הָאֲמוּרִים בַּתּוֹרָה, וְכֻלָּן מְנוּיִין בִּבְ\"רַ:", "rashi_en": "הן כסף אשר מצאנו BEHOLD THE MONEY WHICH WE FOUND — This is one of the ten inferences from minor to major mentioned in the Bible. They are all enumerated in Genesis Rabbah (Genesis Rabbah 92:7). "}, {"ch": 44, "v": 9, "aliyah": 7, "heb": "אֲשֶׁ֨ר יִמָּצֵ֥א אִתּ֛וֹ מֵעֲבָדֶ֖יךָ וָמֵ֑ת וְגַם־אֲנַ֕חְנוּ נִֽהְיֶ֥ה לַֽאדֹנִ֖י לַעֲבָדִֽים׃", "onk": "דִּי יִשְׁתְּכַח עִמֵּיהּ מֵעַבְדָיךְ וּמִית וְאַף אֲנַחְנָא נְהֵי לְרִבּוֹנִי לְעַבְדִּין:", "onk_en": "He among your servants with whom it is found, he shall die. We will also be servants to my master.", "pj": "דִי יִשְׁתְּכַח עִמֵיהּ מֵעַבְדָךְ יְהִי חַיָיב קְטוֹל וְאוּף אֲנַן נְהִי לְרִבּוֹנִי לְעַבְדִין", "pj_en": "With whomsoever of thy servants it shall be found, let him be guilty of death, and we also will be slaves of thy lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 10, "aliyah": 7, "heb": "וַיֹּ֕אמֶר גַּם־עַתָּ֥ה כְדִבְרֵיכֶ֖ם כֶּן־ה֑וּא אֲשֶׁ֨ר יִמָּצֵ֤א אִתּוֹ֙ יִהְיֶה־לִּ֣י עָ֔בֶד וְאַתֶּ֖ם תִּהְי֥וּ נְקִיִּֽם׃", "onk": "וַאֲמַר אַף כְּעַן כְּפִתְגָּמֵיכוֹן כֶּן הוּא דִּי יִשְׁתְּכַח עִמֵּיהּ יְהֵי לִי עַבְדָּא וְאַתּוּן תְּהוֹן זַכָּאִין:", "onk_en": "And he said, Your words are now also correct. The one with whom it is found, he shall be my slave, and you shall be guiltless.", "pj": "וַאֲמַר אוּף כְּדֵין הֵי כְּפִתְגָמֵיכוֹן כֵּן יְהִי דְיִשְׁתַּכַּח עִמֵיהּ יְהִי לִי עַבְדָא וְאַתּוּן תְּהוֹן זַכָּאִין", "pj_en": "And he said, According to your words let it be. With whomsoever it is found he shall be my slave, but you shall be innocent.", "tj": "", "tj_en": "", "rashi": "<b>גם עתה כדבריכם.<\/b> אַף זוֹ מִן הַדִּין אֱמֶת כְּדִבְרֵיכֶם כֵּן הוּא, שֶׁכֻּלְּכֶם חַיָּבִין בַּדָּבָר – י' שֶׁנִּמְצֵאת גְּנֵבָה בְּיַד א' מֵהֶם כֻּלָּם נִתְפָּשִׂים, אֲבָל אֲנִי אֶעֱשֶׂה לָכֶם לִפְנִים מִשּׁוּרַת הַדִּין, אֲשֶׁר יִמָּצֵא אִתּוֹ יִהְיֶה לִּי עָבֶד:", "rashi_en": "גם עתה כדבריכם IT WERE RIGHT TO BE ACCORDING TO YOUR WORDS — Indeed, this is only right: in very truth it should be according to your words since you are all guilty in this matter. Because when there are ten men and stolen property is found in possession of one of them, all of them are involved in the theft. I, however, shall deal with you within the line of strict justice (i.e. more equitably) and only אשר ימצא אתו יהיה לי עבד HE WITH WHOM IT IS FOUND SHALL BE MY BONDMAN (Genesis Rabbah 92:8). "}, {"ch": 44, "v": 11, "aliyah": 7, "heb": "וַֽיְמַהֲר֗וּ וַיּוֹרִ֛דוּ אִ֥ישׁ אֶת־אַמְתַּחְתּ֖וֹ אָ֑רְצָה וַֽיִּפְתְּח֖וּ אִ֥ישׁ אַמְתַּחְתּֽוֹ׃", "onk": "וְאוֹחִיאוּ וּנְחִיתוּ (<small>ס\"א<\/small> וְאַחִיתוּ) גְּבַר יָת טוֹעֲנֵיהּ לְאַרְעָא וּפְתָחוּ גְּבַר טוֹעֲנֵיהּ:", "onk_en": "They hurried, and each man lowered his bag to the ground, and each man opened his bag.", "pj": "וְאוֹחִיאוּ וְאָחִיתוּ גְבַר טוֹנֵיהּ לְאַרְעָא וּפְתָחוּ גְבַר טוֹנֵיהּ", "pj_en": "And they made haste, and brought down each man his sack upon the ground, and every man opened his sack.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 44, "v": 12, "aliyah": 7, "heb": "וַיְחַפֵּ֕שׂ בַּגָּד֣וֹל הֵחֵ֔ל וּבַקָּטֹ֖ן כִּלָּ֑ה וַיִּמָּצֵא֙ הַגָּבִ֔יעַ בְּאַמְתַּ֖חַת בִּנְיָמִֽן׃", "onk": "וּבְלַשׁ בְּרַבָּא שָׁרִי וּבִזְעֵירָא שֵׁצִי וְאִשְׁתְּכַח קַלִּידָא בְּטוֹעֲנָא דְּבִנְיָמִן:", "onk_en": "He searched, beginning with the oldest, and ending with the youngest. The goblet was found in Binyomin’s bag.", "pj": "וּפִשְׁפֵּשׁ בִּרְאוּבֵן שָׁרֵי וּבְבִנְיָמִין פָּסַק וְאִשְׁתַּכַּח אוֹגְבִין בְּטוֹנָא דְבִנְיָמִין", "pj_en": "And he searched beginning with Reuben, and ending with Benjamin. And the cup was found in Benjamin's sack.", "tj": "וּפִּשְׁפֵּשׁ:", "tj_en": "", "rashi": "<b>בגדול החל.<\/b> שֶׁלֹּא יַרְגִּישׁוּ שֶׁהָיָה יוֹדֵעַ הֵיכָן הוּא:", "rashi_en": "בגדול החל AT THE ELDEST HE BEGAN — so that they should not perceive that he knew where it was (Genesis Rabbah 92.8). "}, {"ch": 44, "v": 13, "aliyah": 7, "heb": "וַֽיִּקְרְע֖וּ שִׂמְלֹתָ֑ם וַֽיַּעֲמֹס֙ אִ֣ישׁ עַל־חֲמֹר֔וֹ וַיָּשֻׁ֖בוּ הָעִֽירָה׃", "onk": "וּבְזָעוּ לְבוּשֵׁיהוֹן וּרְמוֹ גְּבַר עַל חֲמָרֵיהּ וְתָבוּ לְקַרְתָּא:", "onk_en": "They tore their garments [in grief]. Each man loaded his donkey, and they returned to the city.", "pj": "וּבְזָעוּ לְבוּשֵׁיהוֹן וְאִתְיְהַב לְהוֹן כּחַ גְבוּרְתָּא וְטָעֲנוּ גְבַר עַל חַמְרֵיהּ וְתָבוּ לְקַרְתָּא", "pj_en": "And they rent their clothes; but the strength of fortitude was given to them; and they laded every man his ass, and returned to the city.", "tj": "", "tj_en": "", "rashi": "<b>ויעמס איש על חמרו.<\/b> בַּעֲלֵי זְרוֹעַ הָיוּ, וְלֹא הֻצְרְכוּ לְסַיֵּעַ זֶה אֶת זֶה לִטְעֹן:<br><br><b>וישובו העירה.<\/b> מֶטְרוֹפּוֹלִין הָיְתָה, וְהוּא אוֹמֵר הָעִירָה, הָעִיר כָּל שֶׁהוּא אֶלָּא שֶׁלֹּא הָיְתָה חֲשׁוּבָה בְעֵינֵיהֶם אֶלָּא כְעִיר בֵּינוֹנִית שֶׁל י' בְּנֵי אָדָם לְעִנְיַן הַמִּלְחָמָה:", "rashi_en": "ויעמוס איש על חמרו THEY LADED EVERY MAN HIS ASS — They were stalwart men and did not require the assistance of each other in loading (Genesis Rabbah 92:8).<br><br>וישבו העירה AND THEY RETURNED TO THE CITY — It was the metropolis and yet Scripture says העירה — an ordinary city! But this is because in their eyes it was regarded as a very medium-sized city of only ten inhabitants if it became a matter of waging war against it (Genesis Rabbah 92:8). "}, {"ch": 44, "v": 14, "aliyah": 7, "heb": "וַיָּבֹ֨א יְהוּדָ֤ה וְאֶחָיו֙ בֵּ֣יתָה יוֹסֵ֔ף וְה֖וּא עוֹדֶ֣נּוּ שָׁ֑ם וַיִּפְּל֥וּ לְפָנָ֖יו אָֽרְצָה׃", "onk": "וְעַל יְהוּדָה וַאֲחוֹהִי לְבֵית יוֹסֵף וְהוּא עַד כְּעַן תַּמָּן וּנְפָלוּ קֳדָמוֹהִי לְאַרְעָא:", "onk_en": "Yehudah and his brothers came to Yoseif’s house. He was still there, and they fell to the ground before him.", "pj": "וְעַל יְהוּדָה וְאָחוֹהִי לְבֵית יוֹסֵף וְהוּא עוֹד כְּדוֹן תַּמָן וְנָפָלוּ קֳדָמוֹי עַל אַרְעָא", "pj_en": "And Jehuda and his brethren entered into Joseph's house. He was yet there; and they fell before him on the ground.", "tj": "", "tj_en": "", "rashi": "<b>עודנו שם.<\/b> שֶׁהָיָה מַמְתִּין לָהֶם:", "rashi_en": "עודנו שם HE WAS YET THERE — for he was waiting for them."}, {"ch": 44, "v": 15, "aliyah": 7, "heb": "וַיֹּ֤אמֶר לָהֶם֙ יוֹסֵ֔ף מָֽה־הַמַּעֲשֶׂ֥ה הַזֶּ֖ה אֲשֶׁ֣ר עֲשִׂיתֶ֑ם הֲל֣וֹא יְדַעְתֶּ֔ם כִּֽי־נַחֵ֧שׁ יְנַחֵ֛שׁ אִ֖ישׁ אֲשֶׁ֥ר כָּמֹֽנִי׃", "onk": "וַאֲמַר לְהוֹן יוֹסֵף מָה עוֹבָדָא הָדֵין דִּי עֲבַדְתּוּן הֲלָא יְדַעְתּוּן אֲרֵי <b>בָדָקָא מְבָדֵק<\/b> גַּבְרָא דִּי כְוָתִי:", "onk_en": "Yoseif said to them, What is this deed that you have done? Do you not know that a man like me is an expert diviner [<b>investigator<\/b>]?", "pj": "וַאֲמַר לְהוֹם יוֹסֵף מַה עוּבְדָא הָדֵין דַעֲבַדְתּוּן הֲלָא יְדַעְתּוּן אֲרוּם מְטַיְירָא יְטַיֵיר גְבַר דִכְוָותִי", "pj_en": "And Joseph said to them, What deed is this that you have done ? Could you not know that a man like me divining can divine?", "tj": "וְהוּא מְטַיְירֵיהּ מְטַיֵיר בֵּיהּ:", "tj_en": "By which divining he divineth", "rashi": "<b>הלא ידעתם כי נחש ינחש וגו'.<\/b> הֲלֹא יְדַעְתֶּם כִּי אִישׁ חָשׁוּב כָּמוֹנִי יוֹדֵעַ לְנַחֵשׁ וְלָדַעַת מִדַּעַת וּמִסְּבָרָא וּבִינָה, כִּי אַתֶּם גְּנַבְתֶּם הַגָּבִיעַ:", "rashi_en": "'הלא ידעתם כי נחש ינחש וגו KNOW YE NOT THAT SUCH A MAN AS I CAN CERTAINLY DIVINE? — Are you not aware that so distinguished a person as I am knows how to divine, and (even though you have robbed me of the goblet by which I divine) to discover by my own intelligence and common sense or by logical deduction that it was you who stole the goblet! "}, {"ch": 44, "v": 16, "aliyah": 7, "heb": "וַיֹּ֣אמֶר יְהוּדָ֗ה מַה־נֹּאמַר֙ לַֽאדֹנִ֔י מַה־נְּדַבֵּ֖ר וּמַה־נִּצְטַדָּ֑ק הָאֱלֹהִ֗ים מָצָא֙ אֶת־עֲוֺ֣ן עֲבָדֶ֔יךָ הִנֶּ֤נּוּ עֲבָדִים֙ לַֽאדֹנִ֔י גַּם־אֲנַ֕חְנוּ גַּ֛ם אֲשֶׁר־נִמְצָ֥א הַגָּבִ֖יעַ בְּיָדֽוֹ׃", "onk": "וַאֲמַר יְהוּדָה מַה נֵּימַר לְרִבּוֹנִי מַה נְּמַלֵּל וּמַה נִּזְכֵּי <b>מִן קֳדָם<\/b> יְיָ <b>אִשְׁתְּכַח<\/b> יָת חוֹבָא בְעַבְדָּיךְ הָא אֲנַחְנָא עַבְדִּין לְרִבּוֹנִי אַף אֲנַחְנָא אַף דְּאִשְׁתְּכַח קַלִּידָא בִּידֵיהּ:", "onk_en": "Yehudah said, What shall we say to my master? What can we speak? How can we justify ourselves? [<b>From before<\/b>] God [<b>the iniquity of your servants<\/b>] has [<b>been<\/b>] found the iniquity of your servants. Let us be slaves to my master, both we, and the one in whose hand the goblet was found.", "pj": "וַאֲמַר יְהוּדָה מַה נֵימַר לְרִבּוֹנִי עַל כַּסְפָּא קַדְמָאָה וּמַה נְמַלֵל עַל כַּסְפָּא בַּתְרָאָה וּמַה נִזְדַכֵּי עַל אוֹגְבִין מִן קֳדָם יְיָ אִשְׁתְּכַח חוֹבָא עַל עַבְדָךְ הָא אֲנַחְנָא עַבְדִין לְרִבּוֹנִי אוּף אֲנַן אוּף מַאן דְאִשְׁתַּכַּח כַּלִידָא בִּידֵיהּ", "pj_en": "And Jehuda said to him What shall we say to my lord concerning the former money, and what concerning the latter money ? and how shall we be acquitted concerning the cup ? From before the Lord there is sin found upon thy servants. Behold, we are my lord's servants, and he in whose hand the chalice hath been found.", "tj": "", "tj_en": "", "rashi": "<b>האלהים מצא.<\/b> יוֹדְעִים אָנוּ שֶׁלֹּא סָרַחְנוּ, אֲבָל מֵאֵת הַמָּקוֹם נִהְיְתָה לְהָבִיא לָנוּ זֹאת, מָצָא בַּעַל חוֹב מָקוֹם לִגְבּוֹת שְׁטַר חוֹבוֹ:<br><br><b>מה נצטדק.<\/b> לְשׁוֹן צֶדֶק, וְכֵן כָּל תֵּבָה שֶׁתְּחִלַּת יְסוֹדָהּ צָדִ\"י וְהִיא בָּאָה לְדַבֵּר בִּלְשׁוֹן מִתְפָּעֵל אוֹ נִתְפָּעֵל, נוֹתֵן טֵי\"ת בִּמְקוֹם תָּי\"ו, וְאֵינוֹ נוֹתְנָהּ לִפְנֵי אוֹת רִאשׁוֹנָה שֶׁל יְסוֹד הַתֵּבָה אֶלָּא בְאֶמְצַע אוֹתִיּוֹת הָעִקָּר, כְּגוֹן נִצְטַדָּק מִגִּזְרַת צדק, וְיִצְטַבַּע מִגִּזְרַת צבע, וַיִּצְטַיָּרוּ מִגִּזְרַת וְצִיר אֱמוּנִים, הִצְטַיַּדְנוּ מִגִּזְרַת צֵדָה לַדֶּרֶךְ. וְתֵבָה שֶׁתְּחִלָּתָהּ סָמֶ\"ךְ אוֹ שִׁי\"ן, כְּשֶׁהִיא מִתְפָּעֶלֶת, הַתָּי\"ו מַפְרֶדֶת אֶת אוֹתִיּוֹת הָעִקָּר, כְּגוֹן וְיִסְתַּבֵּל הֶחָגָב (קהלת י\"ב), מִגִּזְרַת סבל; מִשְׂתַּכַּל הֲוֵית בְּקַרְנַיָּא (דניאל ז'), וְיִשְׁתַּמֵּר חֻקּוֹת עָמְרִי (מיכה ו') מִגִּזְרַת שמר; וְסָר מֵרָע מִשְׁתּוֹלֵל (ישעיהו נ\"ט), מִגִּזְרַת מוֹלִיךְ יוֹעֲצִים שׁוֹלָל (איוב י\"ב), מִסְתּוֹלֵל בְּעַמִּי (שמות ט\"ו), מִגִּזְרַת דֶּרֶךְ לֹא סְלוּלָה (ירמיהו י\"ח):", "rashi_en": "האלהים מצא GOD HATH FOUND OUT — We know that we have done no wrong, but it has been brought about by the Holy One, blessed be He, that this should come upon us. The Creditor has found an opportunity to collect His debt (Genesis Rabbah 92:9).<br><br>מה נצטדק How shall we justify ourselves? — This is a verbal form of צדק. In the same way every root whose first letter is צ when used in the Hithpael or Nithpael takes a ט instead of the ת of the prefix. This, however, is not placed before the first radical letter, but between the first two letters of the root. For example: נצטדק of the root צדק; (Daniel 4:13) “and let it be wet (ויצטבע)” of the root צבע to steep; Joshua 9:4) “and made as if they had been ambassadors (ויצטירו)”, of the same root as ציר in (Proverbs 13:17), ציר אמונים a faithful ambassador”; (Joshua 9:12) “we took our provision (הצטידנו)” of the same root as צדה in (Genesis 45:21) צדה לדרך “provision for the way”. And in the same way, with a root whose first letter is ס or ש, when it is used in the Hithpael, the ת of the prefix separate (i.e. is placed between) the first two letters of the root. For example: (Ecclesiastes 12:5) “and the grasshopper shall drag itself along heavily (ויסתבל)” from the root סבל “to carry a load”; (Daniel 7:8) “I considered (משתכל הוית) the horns”, from the root שכל to reflect on: (Micah 6:16) “for the statutes of Omri are kept (ישתמרו)” from the root שמר to keep; (Isaiah 59:15) “And he that departeth from evil (משתולל) is regarded as a fool”, from the same root as שולל in (Job 12:17) “He leadeth counsellors away (שולל) as though they were fools”; (Exodus 9:17) “Thou treadest down (מסתולל) my people”, from the same root as סלולה in (Jeremiah 18:15) “a way not trodden down (סלולה).”"}, {"ch": 44, "v": 17, "aliyah": 7, "heb": "וַיֹּ֕אמֶר חָלִ֣ילָה לִּ֔י מֵעֲשׂ֖וֹת זֹ֑את הָאִ֡ישׁ אֲשֶׁר֩ נִמְצָ֨א הַגָּבִ֜יעַ בְּיָד֗וֹ ה֚וּא יִהְיֶה־לִּ֣י עָ֔בֶד וְאַתֶּ֕ם עֲל֥וּ לְשָׁל֖וֹם אֶל־אֲבִיכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמַר <b>חַס לִי<\/b> מִלְּמֶעְבַּד דָּא גַּבְרָא דִּי יִשְׁתְּכַח קַלִּידָא בִּידֵיהּ הוּא יְהֵי לִי עַבְדָּא וְאַתּוּן סְקוֹ לִשְׁלַם לְוַת אֲבוּכוֹן:", "onk_en": "He [Yoseif] said [to them], It would be degrading for me to do [<b>May I be spared from doing<\/b>] such a thing. The man in whose hand the goblet was found, he shall be my slave, and [the rest of] you go up in peace to your father.", "pj": "וַאֲמַר חַס לִי מִלְמֶעֱבַד דָא גַבְרָא דְאִשְׁתְּכַח כַּלִידָא בִּידֵיהּ הוּא יְהֵי לִי עַבְדָא וְאַתּוּן סוּקוּ לִשְׁלַם לְוַת אֲבוּכוֹן", "pj_en": "But he said, Far be it from me to do thus; the man in whose hand the chalice hath been found shall be my slave; but you, go up in peace to your father.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
