saw the miracles which had been performed for Sarah’s take he said, “It is better for my daughter to be a handmaid in this man’s house than be mistress in another man’s house” (Genesis Rabbah 45:1). "}, {"ch": 16, "v": 2, "aliyah": 6, "heb": "וַתֹּ֨אמֶר שָׂרַ֜י אֶל־אַבְרָ֗ם הִנֵּה־נָ֞א עֲצָרַ֤נִי יְהֹוָה֙ מִלֶּ֔דֶת בֹּא־נָא֙ אֶל־שִׁפְחָתִ֔י אוּלַ֥י אִבָּנֶ֖ה מִמֶּ֑נָּה וַיִּשְׁמַ֥ע אַבְרָ֖ם לְק֥וֹל שָׂרָֽי׃", "onk": "וַאֲמַרַת שָׂרַי לְאַבְרָם הָא כְּעַן מַנְעַנִי יְיָ מִלְּמֵילַד עוּל <b>כְּעַן<\/b> לְוַת אַמְתִי מָאִם אִתְבְּנֵי מִנַּהּ וְקַבִּיל אַבְרָם לְמֵימַר שָׂרָי:", "onk_en": "Sarai said to Avram: See now, Adonoy has restrained me from having children; pray [<i>now<\/i>], come to my handmaid perhaps I will be built-up through her. Avram hearkened to the voice of Sarai.", "pj": "וַאֲמָרַת שָרַי לְאַבְרָם הָא כְּדֵין מְנָעֲנִי יְיָ מִלְמֵלַד עוּל לְוַת אַמְתִי וְאַחְרְרִינָהּ מָאִים אִיתְבְּנֵי מִינָהּ וְקַבֵּל אַבְרָם לְמֵימַר שָרָי", "pj_en": "And Sara said to Abram, Behold, now, the Lord hath restrained me from bearing, go to my handmaid and set her free; perhaps I may be builded by her. And Abram hearkened to the word of Sara.", "tj": "", "tj_en": "", "rashi": "<b>אולי אבנה ממנה.<\/b> לִמֵּד עַל מִי שֶׁאֵין לוֹ בָּנִים שֶׁאֵינוֹ בָנוּי אֶלָּא הָרוּס:<br><br><b>אבנה ממנה.<\/b> בִּזְכוּת שֶׁאַכְנִיס צָרָתִי לְתוֹךְ בֵּיתִי:<br><br><b>לקול שרי.<\/b> לְרוּחַ הַקֹּדֶשׁ שֶׁבָּהּ (בראשית רבה):", "rashi_en": "אולי אבנה ממנה IT MAY BE THAT I SHALL BE BUILDED UP THROUGH HER — This statement of Sarah teaches that a person who has no children is not firmly established (literally, built up: his name and future are not perpetuated) but is unstable (lit, demolished) (Genesis Rabbah 45:2).<br><br>אבנה ממנה I SHALL BE BUILDED UP THROUGH HER— through the merit that I admit her as a rival into my house.<br><br>לקול שרי TO THE VOICE OF SARAI— to the Holy (prophetic) Spirit that was in her (Genesis Rabbah 45:2). "}, {"ch": 16, "v": 3, "aliyah": 6, "heb": "וַתִּקַּ֞ח שָׂרַ֣י אֵֽשֶׁת־אַבְרָ֗ם אֶת־הָגָ֤ר הַמִּצְרִית֙ שִׁפְחָתָ֔הּ מִקֵּץ֙ עֶ֣שֶׂר שָׁנִ֔ים לְשֶׁ֥בֶת אַבְרָ֖ם בְּאֶ֣רֶץ כְּנָ֑עַן וַתִּתֵּ֥ן אֹתָ֛הּ לְאַבְרָ֥ם אִישָׁ֖הּ ל֥וֹ לְאִשָּֽׁה׃", "onk": "וּדְבָרַת שָׂרַי אִתַּת אַבְרָם יָת הָגָר מִצְרֵיתָא אַמְתַהּ מִסּוֹף עֲשַׂר שְׁנִין לְמִתַּב אַבְרָם בְּאַרְעָא דִּכְנָעַן וִיהָבַת יָתַהּ לְאַבְרָם בַּעְלַהּ לֵיהּ לְאִנְתּוּ:", "onk_en": "Sarai, the wife of Avram took Hagar the Egyptian, her handmaid, at the end of ten years that Avram had lived in the Land of Canaan and gave her to Avram her husband to be his wife.", "pj": "וְדַבָּרַת שָרַי אִתַּת אַבְרָם יַת הָגָר מִצְרֵיתָא אַמְתָהּ מִסוֹף עֶשֶר שְׁנִין לְמֵיתַב אַבְרָם בְּאַרְעָא דִכְנָעַן וַחֲרַרְתָּא וְיַהֲבָא יָתָהּ לְאַבְרָם בַּעֲלָהּ לֵיהּ לְאִנְתּוּ", "pj_en": "And Sara the wife of Abram took Hagar the Mizreitha handmaid, when Abram had dwelt ten years in the land of Kenaan, and set her free, and gave her to Abram her husband to wife.", "tj": "", "tj_en": "", "rashi": "<b>ותקח שרי.<\/b> לְקָחַתָּהּ בִּדְבָרִים, אַשְׁרַיִךְ שֶׁזָּכִית לִדָּבֵק בְּגוּף קָדוֹשׁ כָּזֶה (בראשית רבה):<br><br><b>מקץ עשר שנים.<\/b> מוֹעֵד הַקָּבוּעַ לְאִשָּׁה שֶׁשָּׁהֲתָה עֶשֶׂר שָׁנִים וְלֹא יָלְדָה לְבַעֲלָהּ, חַיָּב לִשָֹּא אַחֶרֶת:<br><br><b>לשבת אברם וגו'.<\/b> מַגִּיד שֶׁאֵין יְשִׁיבַת חוּצָה לָאָרֶץ עוֹלָה לוֹ מִן הַמִּנְיָן (יב' ס\"ד), לְפִי שֶׁלֹּא נֶאֱמַר לוֹ וְאֶעֶשְׂךָ לְגוֹי גָּדוֹל, עַד שֶׁיָּבֹא לְאֶרֶץ יִשְֹרָאֵל:", "rashi_en": "ותקח שרי AND (SARAI TOOK [HAGAR] — She took (won her over) by kindly speech saying, “Happy are you in that you will be privileged to consort with so holy a person as this” (Genesis Rabbah 45:3). <br><br>מקץ עשר שנים AFTER [ABRAM HAD DWELT] TEN YEARS — the period appointed for a woman who has lived with her husband for ten years without having borne children to him when he is bound to take another.<br><br>'לשבת אברם וגו [TEN YEARS] AFTER ABRAHAM HAD DWELT IN THE LAND OF CANAAN — As Abraham had been married to Sarah before he entered Canaan this statement virtually informs us that the period he dwelt outside the land was not to be included in the number of these ten years (Yevamot 64a), for the promise, “And I will make of thee a great nation” was made to him with the intention of being fulfilled only after he had come into the land of Israel. "}, {"ch": 16, "v": 4, "aliyah": 6, "heb": "וַיָּבֹ֥א אֶל־הָגָ֖ר וַתַּ֑הַר וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה וַתֵּקַ֥ל גְּבִרְתָּ֖הּ בְּעֵינֶֽיהָ׃", "onk": "וְעַל לְוַת הָגָר וְעַדִּיאַת וַחֲזַת אֲרֵי עַדִּיאַת וּקְלַת רִבָּנְתַּהּ בְּעֵינָהַהּ:", "onk_en": "He came to Hagar and she conceived. When she realized that she was pregnant, her mistress became slighted in her eyes.", "pj": "וְעָאל לְוַת הָגָר וְאַעֲדִיאַת וַחֲמַת אֲרוּם אַעֲדִיאַת וְזִלְזִלַת אֵיקַר רִבּוֹנְתָּהָא בְעֵינָהָא", "pj_en": "And he went unto Hagar, and she conceived; and she saw that she had conceived, and the honour of her mistress was despised in her eyes.", "tj": "", "tj_en": "", "rashi": "<b>ויבא אל הגר ותהר.<\/b> מִבִּיאָה רִאשׁוֹנָה (בראשית רבה):<br><br><b>ותקל גברתה בעיניה.<\/b> אָמְרָה שָׂרַי זוֹ אֵין סִתְרָהּ כִּגְלוּיָהּ מַרְאָה עַצְמָהּ כְּאִלּוּ הִיא צַדֶּקֶת וְאֵינָהּ צַדֶּקֶת, שֶׁלֹּא זָכְתָה לְהֵרָיוֹן כָּל הַשָּׁנִים הַלָּלוּ, וַאֲנִי נִתְעַבַּרְתִּי מִבִּיאָה רִאשׁוֹנָה (בראשית רבה):", "rashi_en": "ויבא אל הגר ותהר AND HE CAME UNTO HAGAR AND SHE CONCEIVED from the first union (Genesis Rabbah 45:4). <br><br>ותקל גברתה בעיניה HER MISTRESS WAS SLIGHTED IN HER EYES — She said, “As regards this woman Sarai, her conduct in private can certainly not be like that in public: she pretends to be a righteous woman, but she cannot really be righteous since all these years she has not been privileged to have children, whilst I have had that blessing from the first union” (Genesis Rabbah 45:4). "}, {"ch": 16, "v": 5, "aliyah": 6, "heb": "וַתֹּ֨אמֶר שָׂרַ֣י אֶל־אַבְרָם֮ חֲמָסִ֣י עָלֶ֒יךָ֒ אָנֹכִ֗י נָתַ֤תִּי שִׁפְחָתִי֙ בְּחֵיקֶ֔ךָ וַתֵּ֙רֶא֙ כִּ֣י הָרָ֔תָה וָאֵקַ֖ל בְּעֵינֶ֑יהָ יִשְׁפֹּ֥ט יְהֹוָ֖ה בֵּינִ֥י וּבֵינֶֽיׄךָ׃", "onk": "וַאֲמַרַת שָׂרַי לְאַבְרָם <b>דִּין לִי עֲלָךְ<\/b> אֲנָא יְהָבִית אַמְתִי לָךְ וַחֲזַת אֲרֵי עַדִּיאַת וּקְלֵית בְּעֵינָהַהּ יְדִין יְיָ בֵּינִי וּבֵינָךְ:", "onk_en": "Sarai said to Avram: The insult against me is your fault [<i>I have a judgment against you<\/i>]. I gave my maid to you and when she saw that she had conceived, I became slighted in her eyes. Let Adonoy judge between me and you.", "pj": "וַאֲמַרַת שָרַי לְאַבְרָם כָּל עוּלְבָּנִי מִינָךְ דַהֲוִינָא רְחִיצָא דְתֶעֱבַּד דִינִי דַאֲנָא שַׁבְקִית אֲרַע וּבֵית אַבָּא וְעָלִית עִמָךְ לְאַרַע נוּכְרֵיתָא וּכְדוֹן בְּגִין דְלָא הֲוֵינָא יַלְדָא חֲרָרִית אַמְתִי וִיהַבְתָּהּ לְמִשְׁכּוֹב בְּעִיטְפָךְ וַחֲמַת אֲרוּם עַבְרִית וְיִתְבַּז אִיקְרִי בְּאַנְפָּהָא וּכְדוּן יִתְגְלֵי קֳדָם יְיָ עוּלְבָּנִי וְיִפְרוֹס שְׁלָמֵיהּ בֵּינִי וּבֵינָךְ וְתִתְמְלֵי אַרְעָא מִינָן וְלָא נִצְטַרָךְ לִבְנָהָא דְהָגָר בְּרַת פַּרְעה בַּר נִמְרוֹד דְטַלְקָךְ לְאַתּוּנָא דְנוּרָא", "pj_en": "And Sara said to Abram, All my affliction is from thee. Being secure that thou wouldst do me justice, I left the land and house of my father, and came up with thee to a foreign land; and forasmuch as I was not able to become a mother, I set free my handmaid, and gave her to lie in thy bosom; and she seeth that she had conceived, and mine honour is despised before her. But now is my affliction manifest before the Lord, who will spread peace between me and thee, and the land shall be replenished from us, nor shall we need the help of the progeny of Hagar the daughter of Pharoh bar Nimrod, who threw thee into the furnace of fire.", "tj": "וַאֲמַרַת שָרַי לְאַבְרָם דִינִי וְעוּלְבָּנִי מְסָרִין בִּידָךְ שְׁבָקִית אַרְעִי וּבֵית תּוֹלַדְתִּי וּבֵיתֵיהּ דְאַבָּא וַאֲתֵית לִי עִמָךְ בְּהֵמָנוּת שְׁמַיָא עַיְילִית עִמָךְ קֳדָם פַּרְעה מַלְכָּא דְמִצְרַיִם וְקָדָם אַבִימֶלֶךְ מַלְכָּא דִפְלִישְׁתָּאֵי וַאֲמָרַת עֲלָךְ אֲחִי הוּא מִן בִּגְלַל דְלָא יִקְטְלוּן יָתָךְ וּכְדוֹן חַמִית דְלָא הֲוֵינָא מְעַבְּרָא נְסִיבִית הָגָר מִצְרֵיתָא אַמְתִי וִיהָבִית יָתָהּ לָךְ לְאִנְתּוּ וַאֲמָרִית הִיא תְלִיד וַאֲנָא אֵירַבֵּי מַה דְיַלְדָא דְאִתְבָּנֵי לְחוֹד מִינָהּ וַחֲמַת אֲרוּם עַבְּרַת וּבְזַיַית וְזָלַת יְקָרִי בְּאַפָּהּ וּכְדוּן יִתְגְלֵי יְיָ וִידוּן בֵּינִי וּבֵינָךְ וְיִתְמְלֵי רַחֲמִין עֲלַי וַעֲלָךְ וְיַפְרֵישׁ שְׁלָמֵיהּ בֵּינִי לְבֵינָךְ וְיִתְמְלֵי עַלְמָא מִינִי וּמִינָךְ וְלָא נִצְרוֹךְ לִבְנָהּ דְהָגָר מִצְרֵיתָא אַמְהָתָא דְהִיא מִן בְּנֵיהוֹן דְעַמְמַיָא דְזָרְקוּ יָתָךְ לְאַתּוּן נוּרֵיהוֹן דְכַשְדָאִין:", "tj_en": "And Sara said, My judgment and my affliction are delivered into thine hand. I left the house of my birth, and the house of my father, and came with thee in the faith of the Heavens. I have gone in with thee before kings; before Pharoh King of Mizraim, and before Avimelek king of the Philistaee; and I have said of thee, he is my brother, so that they might not kill thee. And when I saw that I was not made fruitful, I took Hagar the Mizreitha, my handmaid, and gave her to thee to wife, and said, She shall bring forth, and I will bring up whom she may bear, that I may be builded, be it only from her. But now seeing that she hath conceived, my honour is contemned and despised in her sight. Now may the Lord appear, and judge between me and thee, and fulfil mercies upon me and thee, and spread His peace between me and thee, and replenish the world from me and from thee, that we may not heed the son of Hagar the Mizreitha handmaid, who is of the children of the people who cast thee into the burning furnace of the Kasdin.", "rashi": "<b>חמסי עליך.<\/b> חָמָס הֶעָשׂוּי לִי, עָלֶיךָ אֲנִי מֵטִיל הָעֹנֶשׁ; כְּשֶׁהִתְפַּלַּלְתָּ לְהַקָּבָּ\"ה מַה תִּתֶּן לִי וְאָנֹכִי הוֹלֵךְ עֲרִירִי, לֹא הִתְפַּלַּלְתָּ אֶלָּא עָלֶיךָ, וְהָיָה לְךָ לְהִתְפַּלֵּל עַל שְׁנֵינוּ, וְהָיִיתִי אֲנִי נִפְקֶדֶת עִמְּךָ, וְעוֹד דְּבָרֶיךָ אַתָּה חוֹמֵס מִמֶּנִי, שֶׁאַתָּה שׁוֹמֵעַ בִּזְיוֹנִי וְשׁוֹתֵק (בראשית רבה):<br><br><b>אנכי נתתי שפחתי וגו' ביני וביניך.<\/b> כָּל בֵּינֶיךָ שֶׁבַּמִּקְרָא חָסֵר, וְזֶה מָלֵא, קְרִי בֵיהּ וּבָנַיִךְ, שֶׁהִכְנִיסָה עַיִן הָרָע בְּעִבּוּרָהּ שֶׁל הָגָר וְהִפִּילָה עֻבָּרָהּ; הוּא שֶׁהַמַּלְאָךְ אוֹמֵר לְהָגָר הִנָּךְ הָרָה, וְהֲלֹא כְבָר הָרְתָה, וְהוּא מְבַשֵּׁר לָהּ שֶׁתַּהַר? אֶלָּא מְלַמֵּד שֶׁהִפִּילָה הֵרָיוֹן הָרִאשׁוֹן:", "rashi_en": "חמסי עליך MY WRONG BE UPON THEE — The wrong done to me (חמסי)— the punishment for it I call down on you (עליך). “When you prayed to the Holy One, blessed be He, (15:2) ‘what wilt Thou give me, seeing that I go childless’, you prayed only on behalf of yourself whereas you should have prayed on behalf of both of us — then would I have been borne in mind (by God) together with you” (i.e. when you had the gift of a child it would have been “my” child also — not that of a strange woman). Besides this, you deprive me (חומס) of your protecting words since you hear how I am despised and yet you keep silent (Genesis Rabbah 45:5).<br><br>'אנכי נתתי שפחתי וגו ביני וביניך I HAVE GIVEN MY HANDMAID etc… [MAY THE LORD JUDGE] BETWEEN ME AND THEE — Wherever this word “between thee” (masc.) occurs in Scripture it is written defective (i.e. without the second yod) whilst here it is written plene, therefore read it as וּבֵינָיִךְ (the fem form that corresponds to ביניך in our text — as though Sarah turned to Hagar saying “May God judge between me and thee”). Thus she cast the evil eye on Hagar so that she miscarried on this occasion. This explains what the angel said to Hagar, (16:11) הנך הרה “behold, thou wilt conceive”; but had she not already conceived and yet he announces to her that she would conceive? This therefore informs us that she miscarried in this, her first conception (cf. verse 11) (Genesis Rabbah 45:5). "}, {"ch": 16, "v": 6, "aliyah": 6, "heb": "וַיֹּ֨אמֶר אַבְרָ֜ם אֶל־שָׂרַ֗י הִנֵּ֤ה שִׁפְחָתֵךְ֙ בְּיָדֵ֔ךְ עֲשִׂי־לָ֖הּ הַטּ֣וֹב בְּעֵינָ֑יִךְ וַתְּעַנֶּ֣הָ שָׂרַ֔י וַתִּבְרַ֖ח מִפָּנֶֽיהָ׃", "onk": "וַאֲמַר אַבְרָם לְשָׂרַי הָא אַמְתִיךְ בִּידִיךְ עִבִידִי לַהּ כִּדְתַקִּין בְּעֵינָיְכִי וְעַנִיתַהּ שָׂרַי וְעָרְקַת מִקֳּדָמָהַהּ:", "onk_en": "Avram said to Sarai: [The fate of] your maid is in your hands, do with her as you see fit. Sarai dealt harshly with her, and she [Hagar] ran away from her.", "pj": "וַאֲמַר אַבְרָם לְשָרַי הָא אַמְתִיךְ בִּרְשׁוּתִיךְ עֲבִידִי לָהּ דְתַקִין בְּעֵיְנָיכִי וְסַגְפָתָא שָרַי וְעַרְקַת מִן קָדָמָהָא", "pj_en": "And Abram said to Sara, Behold, thy handmaid is under thy authority: do to her what is right in thine eyes. And Sara afflicted her, and she escaped from before her.", "tj": "", "tj_en": "", "rashi": "<b>ותענה שׁרי.<\/b> הָיְתָה מְשַׁעְבֶּדֶת בָּהּ בְּקֹשִׁי (בראשית רבה):", "rashi_en": "ותענה שרי AND SARAI AFFLICTED HER — She compelled her to work hard (Genesis Rabbah 45:6). "}, {"ch": 16, "v": 7, "aliyah": 6, "heb": "וַֽיִּמְצָאָ֞הּ מַלְאַ֧ךְ יְהֹוָ֛ה עַל־עֵ֥ין הַמַּ֖יִם בַּמִּדְבָּ֑ר עַל־הָעַ֖יִן בְּדֶ֥רֶךְ שֽׁוּר׃", "onk": "וְאַשְׁכְּחַהּ מַלְאָכָא דַיְיָ עַל עֵינָא דְמַיָּא בְּמַדְבְּרָא עַל עֵינָא בְּאָרְחָא <b>דְחַגְרָא<\/b>:", "onk_en": "An angel of Adonoy found her by a spring of water in the desert, at the spring on the road to Shur [<i>Chagar<\/i>].", "pj": "וְאַשְׁכְּחָהּ מַלְאָכָא דַיְיָ עַל עֵינָא דְמַיָא בְּמַדְבְּרָא עַל עֵינָא דִבְאוֹרַח חַגְרָא", "pj_en": "And the Angel of the Lord found her at the fountain of waters in the desert; at the fountain of waters which is in the way to Chagra.", "tj": "שׁוֹר חֲלוּצָה:", "tj_en": "Chalitza.", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 8, "aliyah": 6, "heb": "וַיֹּאמַ֗ר הָגָ֞ר שִׁפְחַ֥ת שָׂרַ֛י אֵֽי־מִזֶּ֥ה בָ֖את וְאָ֣נָה תֵלֵ֑כִי וַתֹּ֕אמֶר מִפְּנֵי֙ שָׂרַ֣י גְּבִרְתִּ֔י אָנֹכִ֖י בֹּרַֽחַת׃", "onk": "וַאֲמַר הָגָר אַמְתָא דְשָׂרַי מְנָן אַתְּ אָתְיָא וּלְאָן אַתְּ אָזְלָא וַאֲמַרַת מִן קֳדָם שָׂרַי רִבָּנְתִּי אֲנָא עָרְקָא (<small>נ\"י<\/small> עֲרָקַת):", "onk_en": "And he said: Hagar, handmaid of Sarai, from where have you come and where are you going? She said: I am running away from my mistress, Sarai.", "pj": "וַאֲמַר הָגָר אַמְתָא דְשָרַי מִן הָאן אַנְתְּ אַתְיָא וּלְאָן תֵיזְלִין וַאֲמָרַת מִן קֳדָם שָרַי רִיבּוֹנְתִּי אֲנָא עֲרָקַת", "pj_en": "And He said, Hagar, handmaid of Sara, whence comest thou, and whither does thou go? And she said, From before Sara my mistress I have escaped.", "tj": "", "tj_en": "", "rashi": "<b>מזה באת.<\/b> מֵהֵיכָן בָּאת? יוֹדֵע הָיָה, אֶלָּא לִתֵּן לָהּ פֶּתַח לִכָּנֵס עִמָּהּ בִּדְבָרִים. וּלְשׁוֹן אֵי מִזֶּה: אַיֵּה הַמָּקוֹם שֶׁתֹּאמַר עָלָיו מִזֶּה אֲנִי בָאָה?", "rashi_en": "אי מזה באת WHENCE CAMEST THOU? — He knew it, but he asked this in order to give her a starting-point so that he might converse with her. The expression אי מזה is to be explained thus: Where is (אי) that place of which thou canst say, “From this (מזה) have I come”. "}, {"ch": 16, "v": 9, "aliyah": 6, "heb": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהֹוָ֔ה שׁ֖וּבִי אֶל־גְּבִרְתֵּ֑ךְ וְהִתְעַנִּ֖י תַּ֥חַת יָדֶֽיהָ׃", "onk": "וַאֲמַר לַהּ מַלְאֲכָא דַיְיָ תּוּבִי לְוַת רִבּוֹנְתִּךְ וְאִשְׁתַּעְבְּדִי תְּחוֹת יְדָהָא:", "onk_en": "The angel of Adonoy said to her: Return to your mistress and submit yourself to her.", "pj": "וַאֲמַר לָהּ מַלְאָכָא דַיְיָ תּוּבִי לְוַת רִבּוֹנְתִּיךְ וְאִתְכַּנְעוּ תְּחוֹת יְדָהָא", "pj_en": "And the Angel of the Lord said to her, Return to thy mistress, and be subject under her hand.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר לה מלאך וגו'.<\/b> עַל כָּל אֲמִירָה הָיָה שָׁלוּחַ לָהּ מַלְאָךְ אַחֵר, לְכָךְ נֶאֱמַר מַלְאָךְ בְּכָל אֲמִירָה וַאֲמִירָה:", "rashi_en": "'ויאמר לה מלאך ה' וגו AND THE ANGEL OF THE LORD SAID UNTO HER etc. (see also Genesis 16:10 &amp; Genesis 16:11). For each statement (in these three verses) a different angel was sent to her, and this explains why in reference to each statement the phrase is used, “and an angel said to her” (Genesis Rabbah 45:7). "}, {"ch": 16, "v": 10, "aliyah": 6, "heb": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהֹוָ֔ה הַרְבָּ֥ה אַרְבֶּ֖ה אֶת־זַרְעֵ֑ךְ וְלֹ֥א יִסָּפֵ֖ר מֵרֹֽב׃", "onk": "וַאֲמַר לַהּ מַלְאֲכָא דַיְיָ אַסְגָּאָה אַסְגֵּי יָת בְּנָיְכִי וְלָא יִתִּמְנוּן מִסְּגֵי:", "onk_en": "The angel of Adonoy said to her: I will greatly multiply your descendants that they can not be counted because of their great number.", "pj": "וַאֲמַר לָהּ מַלְאָכָא דַיְיָ אַסְגָאָה אַסְגֵי יַת בְּנָיְיכִי וְלָא יִתְמְנוּן מִסְגֵי", "pj_en": "And the Angel of the Lord said to her, Multiplying I will multiply thy sons, and they shall not be numbered for multitude.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 11, "aliyah": 6, "heb": "וַיֹּ֤אמֶר לָהּ֙ מַלְאַ֣ךְ יְהֹוָ֔ה הִנָּ֥ךְ הָרָ֖ה וְיֹלַ֣דְתְּ בֵּ֑ן וְקָרָ֤את שְׁמוֹ֙ יִשְׁמָעֵ֔אל כִּֽי־שָׁמַ֥ע יְהֹוָ֖ה אֶל־עׇנְיֵֽךְ׃", "onk": "וַאֲמַר לַהּ מַלְאֲכָא דַיְיָ הָא אַתְּ מְעַדְיָא וְתֵלְדִין בָּר וְתִקְרִין שְׁמֵיהּ יִשְׁמָעֵאל אֲרֵי קַבִּיל יְיָ צְלוֹתִיךְ:", "onk_en": "The angel of Adonoy said to her: Behold you will conceive, and give birth to a son. You shall name him Yishmael, for Adonoy has heard [<i>accepted<\/i>] your prayer.", "pj": "וַאֲמַר לָהּ מַלְאָכָא דַיְיָ הָא אַנְתְּ מְעָבְּרָא וְתֵלְדִין בַּר וְתַקְרִין יַת שְׁמֵיהּ יִשְׁמָעֵאל אֲרוּם גְלֵי קָדָם יְיָ סִיגוּפַיִךְ", "pj_en": "And the Angel of the Lord said to her, Behold, thou art with child, and thou wilt bear a son, and thou shalt call his name Ishmael, because thy affliction is revealed before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>הנך הרה.<\/b> כְּשֶׁתָּשׁוּבִי תַּהֲרִי, כְּמוֹ הִנָּךְ הָרָה דְאֵשֶׁת מָנוֹחַ:<br><br><b>וילדת בן.<\/b> כְּמוֹ וְיוֹלֶדֶת, וְדוֹמֶה לוֹ יֹשַׁבְתְּ בַּלְּבָנוֹן מְקֻנַּנְתְּי בָּאֲרָזִים (ירמיה כ\"ב):<br><br><b>וקראת שמו.<\/b> צִוּוּי הוּא, כְּמוֹ שֶׁאוֹמֵר לְזָכָר וְקָרָאתָ אֶת שְׁמוֹ יִצְחָק (בר' י\"ז):", "rashi_en": "הנך הרה BEHOLD THOU WILT BE WITH CHILD — when you return you will conceive, just as the same phrase הנך הרה (Judges 13:7) spoken of the wife of Manoah (where it certainly appears to be thou wilt conceive in the future).<br><br>וְיֹלַדְתְּ בן AND THOU SHALT BEAR A SON — The word appears to be grammatically a combination of the perfect tense וְיָלַדְתְּ and the participle וְיֹלֶדֶת but it is similar in sense to וְיֹלֶדֶת (the participle); so, also, (Jeremiah 22:23) “O thou that dwellest יֹשַׁבְתְּ) in Lebanon, and art nestled (מְקֻנַּנְתְּ) in the cedars.”<br><br>וקראת שמו AND THOU SHALT CALL — This is a command, just as one would say to a man (וְקָרָאתָ), as (Genesis 17:19) “And thou shalt call his name Isaac”."}, {"ch": 16, "v": 12, "aliyah": 6, "heb": "וְה֤וּא יִהְיֶה֙ פֶּ֣רֶא אָדָ֔ם יָד֣וֹ בַכֹּ֔ל וְיַ֥ד כֹּ֖ל בּ֑וֹ וְעַל־פְּנֵ֥י כׇל־אֶחָ֖יו יִשְׁכֹּֽן׃", "onk": "וְהוּא יְהֵא <b>מָרוֹד בֶּאֱנָשָׁא הוּא יְהֵא צְרִיךְ לְכֹלָּא וִידָא דִבְנֵי אֲנָשָׁא יְהוֹן צְרִיכִין לֵיהּ<\/b> וְעַל אַפֵּי כָל אֲחוֹהִי יִשְׁרֵי:", "onk_en": "He will be a wild, uncivilized man [<i>rebel against people<\/i>]. His hand [will be] against everyone [<i>He will need everyone<\/i>] and everyone’s hand will be against him [<i>and everyone’s hand will need him<\/i>]; and in the presence of all his brothers he will dwell.", "pj": "וְאִיהוּ יֶהֱוֵי מְדַמֵי לַעֲרוֹד בִּבְנֵי נְשָׁא יְדוֹי יִתְפַּרְעוּן מִן בַּעֲלֵי דְבָבוֹי וִידֵי דְבַּעֲלֵי דְבָבוֹי יְתוֹשְׁטוּן לְאַבְאָשָׁא בֵּיהּ וְעַל אַנְפֵּי כָּל אָחוֹי יִתְעַרְבֵּב וְיִשְׁרֵי", "pj_en": "And he shall be like the wild ass among men: his hands shall take vengeance of his adversaries, and the hands of his adversaries be put forth to do him evil; and in the presence of all his brethren shall he be commingled, (yitharbeb, Arabized,) and shall dwell.", "tj": "", "tj_en": "", "rashi": "<b>פרא אדם.<\/b> אוֹהֵב מִדְבָּרוֹת לָצוּד חַיּוֹת, כְּמוֹ שֶׁכָּתוּב וַיֵּשֶׁב בַּמִּדְבָּר וַיְהִי רֹבֶה קַשָּׁת (בראשית כ\"א):<br><br><b>ידו בכל.<\/b> לִסְטִים:<br><br><b>ויד כל בו.<\/b> הַכֹּל שׂוֹנְאִין אוֹתוֹ וּמִתְגָּרִין בּוֹ:<br><br><b>ועל פני כל אחיו ישכון.<\/b> שֶׁיִּהְיֶה זַרְעוֹ גָּדוֹל (בראשית רבה):", "rashi_en": "פרא אדם A WILD MAN — One who loves the open spaces to hunt wild animals, as it is written of him (Genesis 21:20) “And he dwelt in the wilderness and became an archer.”<br><br>ידו בכל HIS HAND SHALL BE AGAINST EVERY ONE — a highwayman.<br><br>ויד כל בו AND EVERYONE’S HAND AGAINST HIM — everyone will hate him and attack him.<br><br>ועל פני כל אחיו ישכון AND HE SHALL DWELL IN THE PRESENCE OF ALL HIS BRETHREN — his descendants will be numerous, (so that his territory must extend over that which his brethren have; cf. Genesis 25:18)."}, {"ch": 16, "v": 13, "aliyah": 6, "heb": "וַתִּקְרָ֤א שֵׁם־יְהֹוָה֙ הַדֹּבֵ֣ר אֵלֶ֔יהָ אַתָּ֖ה אֵ֣ל רֳאִ֑י כִּ֣י אָֽמְרָ֗ה הֲגַ֥ם הֲלֹ֛ם רָאִ֖יתִי אַחֲרֵ֥י רֹאִֽי׃", "onk": "<b>וְצַלִּיאַת<\/b> בִּשְׁמָא דַיְיָ דְּמִתְמַלֵּל עִמַּהּ <b>אֲמַרַת<\/b> אַתְּ הוּא אֱלָהָא דְחָזֵי <b>כֹלָּא אֲרֵי אֲמַרַת <\/b>הַבְרַם הָכָא (<small>נ\"י<\/small> הַאַף אֲנָא) <b>שָׁרֵתִי חָזְיָא בָּתַר דְּאִתְגְּלִי לִי<\/b>:", "onk_en": "She called [<i>She prayed in<\/i>] the Name Adonoy Who had spoken to her: [<i>She said<\/i>] You are Almighty Who sees [<i>everything<\/i>], for she said: Have I also seen here [a vestige] after my having seen? [<i>Have I also began to see here [a vestige] after it was revealed to me?<\/i>]", "pj": "וְאוֹדִיאַת קֳדָם יְיָ דְמֵימְרֵיהּ מִתְמַלֵל לָהּ וְכֵן אָמְרַת אַנְתְּ הוּא חַי וְקַיָים דְחָמֵי וְלָא מִתְחָמֵי אֲרוּם אַמְרַת הָא בְּרַם הָכָא אִתְגְלִיאַת יְקַר שְכִינְתָּא דַיְיָ בָּתַר חֶזְיָא", "pj_en": "And she gave thanks before the Lord whose Word spake to her, and thus said, Thou art He who livest and art eternal; who seest, but art not seen! for she said, For, behold, here is revealed the glory of the Shekina of the Lord after a vision.", "tj": "וְאוֹדַיָית הָגָר וְצָלְיַית בְּשֵׁם מֵימְרֵיהּ דַיְיָ דְאִתְגְלֵי עֲלָהּ אָמְרָה בְּרִיךְ אַתְּ הוּא אֱלָהָא קְיָים כָּל עָלְמַיָא דִי חָמִית בְּצַעֲרִי אֲרוּם אָמְרַת דָא לְחוֹד עָלַי אִתְגְלַיתָא הֵיךְ בָּתַר דְאִתְגַלֵיתָא עַל שָרַי רִבּוֹנְתִּי:", "tj_en": "And Hagar gave thanks, and prayed in the Name of the Word of the Lord, who had been manifested to her, saying, Blessed be Thou, Eloha, the Living One of all Ages, who hast looked upon my affliction. For she said, Behold, Thou art manifested also unto me, even as Thou wast manifested to Sara my mistress.", "rashi": "<b>אתה אל ראי.<\/b> נָקוּד חֲטַף קָמָץ, מִפְּנֵי שֶׁהוּא שֵׁם דָּבָר, אֱלוֹהַּ הָרְאִיָּה, שֶׁרוֹאֶה בְעֶלְבּוֹן שֶׁל עֲלוּבִין:<br><br><b>הגם הלם.<\/b> לְשׁוֹן תֵּמַהּ; וְכִי סְבוּרָה הָיִיתִי שֶׁאַף הֲלוֹם בַּמִּדְבָּרוֹת רָאִיתִי שְׁלוּחוֹ שֶׁל מָקוֹם אַחֲרֵי רֹאִי אוֹתָם בְּבֵיתוֹ שֶׁל אַבְרָהָם שֶׁשָּׁם הָיִיתִי רְגִילָה לִרְאוֹת מַלְאָכִים? וְתֵדַע שֶׁהָיְתָה רְגִילָה לִרְאוֹתָם, שֶׁהֲרֵי מָנוֹחַ רָאָה אֶת הַמַּלְאָךְ פַּעַם אַחַת וְאָמַר מוֹת נָמוּת (שופ' י\"ג), וְזוֹ רָאֲתָה ד' זֶה אַחַר זֶה וְלֹא חָרְדָה:", "rashi_en": "אתה אל ראי THOU ART A GOD OF SEEING — The word is punctuated with a Chataph Kametz because it is a noun, and the meaning is “a God of seeing” — One who sees the humiliation to which people are subjected by others (Genesis Rabbah 45:10)<br><br>הגם הלום HAVE I ALSO [SEEN] HERE — This is an exclamation of surprise: “could I have ever imagined that here also — in the wilderness — I would see the messengers of the Omnipresent after I have seen them in Abraham’s house, where I saw them regularly!” You may know that she used to see them there regularly from this: That Manoah saw the angel only once and exclaimed, (Judges 13:22) “We shall surely die”, and she saw angels four times, one after the other, and she showed no fear (Genesis Rabbah 45:7). "}, {"ch": 16, "v": 14, "aliyah": 6, "heb": "עַל־כֵּן֙ קָרָ֣א לַבְּאֵ֔ר בְּאֵ֥ר לַחַ֖י רֹאִ֑י הִנֵּ֥ה בֵין־קָדֵ֖שׁ וּבֵ֥ין בָּֽרֶד׃", "onk": "עַל כֵּן קְרָא לִבְאֵרָא <b>בְּאֵרָא דְמַלְאַךְ קַיָּמָא אִתַּחֲזִי עֲלַהּ<\/b> הָא (הִיא) בֵּין רְקָם וּבֵין <b>חַגְרָא<\/b>:", "onk_en": "Therefore the well was called: Be’er Lachai Ro’i [<i>the well at which a living angel appeared<\/i>]; it is between Kadeish [<i>Rekem<\/i>] and Bared [<i>Chagar<\/i>].", "pj": "בְּגִין כֵּן קָרָא לְבֵירָא בֵּירָא דְאִתְגְלֵי עֲלָהּ חַי וְקַיָם וְהָא הִיא יְהִיבָא בֵּין רְקַם וּבֵין חֲלוּצָה", "pj_en": "Wherefore she called the well, The Well at which the Living and Eternal One was revealed; and, behold, it is situate between Rekam and Chalutsa.", "tj": "", "tj_en": "", "rashi": "<b>באר לחי.<\/b> כְּתַרְגּוּמוֹ:", "rashi_en": "באר לחי ראי As the Targum takes it: the well at which the living angel had appeared to her."}, {"ch": 16, "v": 15, "aliyah": 6, "heb": "וַתֵּ֧לֶד הָגָ֛ר לְאַבְרָ֖ם בֵּ֑ן וַיִּקְרָ֨א אַבְרָ֧ם שֶׁם־בְּנ֛וֹ אֲשֶׁר־יָלְדָ֥ה הָגָ֖ר יִשְׁמָעֵֽאל׃", "onk": "וִילִידַת הָגָר לְאַבְרָם בָּר וּקְרָא אַבְרָם שׁוּם בְּרֵיהּ דִּילִידַת הָגָר יִשְׁמָעֵאל:", "onk_en": "Hagar bore Avram a son and Avram named his son, that Hagar bore him, Yishmael.", "pj": "וִילֵידַת הָגָר לְאַבְרָם בַּר וּקְרָא אַבְרָם שׁוּם בְּרֵיהּ דִלֵידַת הָגָר יִשְׁמָעֵאל", "pj_en": "And Hagar bare Abram a son, and Abram called the name of his son whom Hagar bare, Ishmael.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא אברם שם וגו'.<\/b> אַעַ\"פִּ שֶׁלֹּא שָׁמַע אַבְרָם דִּבְרֵי הַמַּלְאָךְ שֶׁאָמַר וְקָרָאת שְׁמוֹ יִשְׁמָעֵאל, שָׁרְתָה רוּחַ הַקֹּדֶשׁ עָלָיו וּקְרָאוֹ יִשְׁמָעֵאל:", "rashi_en": "'ויקרא אברם שם וגו AND ABRAM CALLED THE NAME [OF HIS SON] etc. — Although Abram had not heard the words of the angel when he said to Hagar “and thou shalt call his name Ishmael”, yet the Holy Spirit rested upon him and he called him Ishmael."}, {"ch": 16, "v": 16, "aliyah": 6, "heb": "וְאַבְרָ֕ם בֶּן־שְׁמֹנִ֥ים שָׁנָ֖ה וְשֵׁ֣שׁ שָׁנִ֑ים בְּלֶֽדֶת־הָגָ֥ר אֶת־יִשְׁמָעֵ֖אל לְאַבְרָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַבְרָם בַּר תְּמָנָן וְשִׁתְּ שְׁנִין כַּד יְלִידַת הָגָר יָת יִשְׁמָעֵאל לְאַבְרָם:", "onk_en": "Avram was eighty-six years old when Hagar bore Yishmael to Avram.", "pj": "וְאַבְרָם בַּר תַּמְנָן וְשִׁית שְׁנִין כַּד יְלֵידַת הָגָר יַת יִשְׁמָעֵאל לְאַבְרָם", "pj_en": "And Abram was the son of eighty-six years when Hagar bare Ishmael to Abram.", "tj": "", "tj_en": "", "rashi": "<b>ואברם בן שמונים וגו'.<\/b> לְשִׁבְחוֹ שֶׁל יִשְׁמָעֵאל נִכְתַּב, לְהוֹדִיעַ שֶׁהָיָה בֶּן י\"ג שָׁנָה כְּשֶׁנִּמּוֹל וְלֹא עִכֵּב:", "rashi_en": "'ואברם בן שמנים שנה וגו AND ABRAM WAS FOURSCORE AND SIX YEARS OLD etc. — This is written to Ishmael’s credit, pointing out that he was thirteen years old when he was circumcised (see Genesis 17:25) and yet he raised no objection."}, {"ch": 17, "v": 1, "aliyah": 6, "heb": "וַיְהִ֣י אַבְרָ֔ם בֶּן־תִּשְׁעִ֥ים שָׁנָ֖ה וְתֵ֣שַׁע שָׁנִ֑ים וַיֵּרָ֨א יְהֹוָ֜ה אֶל־אַבְרָ֗ם וַיֹּ֤אמֶר אֵלָיו֙ אֲנִי־אֵ֣ל שַׁדַּ֔י הִתְהַלֵּ֥ךְ לְפָנַ֖י וֶהְיֵ֥ה תָמִֽים׃", "onk": "וַהֲוָה אַבְרָם בַּר תִּשְׁעִין וּתְשַׁע שְׁנִין <b>וְאִתְגְּלִי<\/b> יְיָ לְאַבְרָם וַאֲמַר לֵיהּ אֲנָא אֵל שַׁדַּי <b>פְּלַח<\/b> קֳדָמַי וֶהֱוֵי שְׁלִים:", "onk_en": "When Avram was ninety-nine years old, Adonoy appeared [<i>became revealed<\/i>] to Avram and said to him: I am Almighty Shaddai, walk [<i>worship<\/i>] before Me and be perfect.", "pj": "וַהֲוָה אַבְרָם בַּר תִּשְׁעִין וּתְשַׁע שְׁנִין וְאִתְגְלֵי יְיָ לְאַבְרָם וַאֲמַר לֵיהּ אֲנָא אֵל שַׁדַי פְּלַח קֳדָמַי וֶהֱוֵי שְׁלִים בְּבִשְרָךְ", "pj_en": "And Abram was the son of ninety and nine years, and the Lord appeared to Abram, and said to him, I am El Shadai; serve before Me and be perfect (shelim) in thy flesh.", "tj": "", "tj_en": "", "rashi": "<b>שׁדי.<\/b> אֲנִי הוּא שֶׁיֵּשׁ דַּי בֶּאֱלֹהוּתִי לְכָל בְּרִיָּה, לְפִיכָךְ הִתְהַלֵּךְ לְפָנַי וְאֶהְיֶה לְךָ לֶאֱלוֹהַּ ולְפַטְרוֹן; וְכֵן כָּל מָקוֹם שֶׁהוּא בַּמִּקְרָא פֵּרוּשׁוֹ כָּךְ: דַּי שֶׁלּוֹ, וְהַכֹּל לְפִי הָעִנְיָן:<br><br><b>התהלך לפני.<\/b> כְּתַרְגּוּמוֹ פְּלַח קֳדָמַי, הִדַּבֵּק בַּעֲבוֹדָתִי:<br><br><b>והיה תמים.<\/b> אַף זֶה צִוּוּי אַחַר צִוּוּי, הֱיֵה שָׁלֵם בְּכָל נִסְיוֹנוֹתַי; וּלְפִי מִדְרָשׁוֹ הִתְהַלֵּךְ לְפָנַי בְּמִצְוַת מִילָה, וּבַדָּבָר הַזֶּה תִהְיֶה תָּמִים, שֶׁכָּל זְמַן שֶׁהָעָרְלָה בְךָ אַתָּה בַּעַל מוּם לְפָנַי. דָּבָר אַחֵר וֶהְיֵה תָמִים, (עַכְשָׁו אַתָּה חָסֵר ה' אֵבָרִים, ב' עֵינַיִם, ב' אָזְנַיִם, וְרֹאשׁ הַגְּוִיָּה) שֶׁאוֹסִיף לְךָ אוֹת עַל שִׁמְךָ, וְיִהְיוּ מִנְיַן אוֹתִיּוֹתֶיךָ רמ\"ח כְּמִנְיַן אֵבָרֶיךָ:", "rashi_en": "אני אל שדי I AM GOD ALMIGHTY — I am He whose (ש) Godship suffices (די) for every creature (Genesis Rabbah 46:3), therefore, ‘‘walk before Me”, and I will be your God and Protector. Similarly, wherever in the Scriptures this Divine Name שדי occurs, it signifies the idea of His sufficiency — but it all depends upon the context as to what the “sufficiency” refers to.<br><br>התהלך לפני WALK BEFORE ME — as the Targum takes it: worship before Me — cleave to My service.<br><br>והיה תמים AND BE PERFECT — This, too, is a command following upon the previous command: be whole-hearted in all the trials I impose upon you. According to the Midrash (Genesis Rabbah 46:4), however, it means: walk before Me by observing the precept of circumcision and through this you will become perfect, for so long as you are uncircumcised I regard you as having a blemish. Another explanation of היה תמים BE THOU PERFECT — at present you lack the power of controlling morally five organs, viz., two eyes, two ears and the membrum. Therefore will I add a letter (i. e. the letter 'ה the numerical value of which is five) to your name (אברם which equals 243) so that the total of the letters of your name (אברהם) will become 248, corresponding to the number of limbs of your body (cf. Nedarim 32b)."}, {"ch": 17, "v": 2, "aliyah": 6, "heb": "וְאֶתְּנָ֥ה בְרִיתִ֖י בֵּינִ֣י וּבֵינֶ֑ךָ וְאַרְבֶּ֥ה אוֹתְךָ֖ בִּמְאֹ֥ד מְאֹֽד׃", "onk": "וְאֶתֵּן קְיָמִי בֵּין <b>מֵימְרִי<\/b> וּבֵינָךְ וְאַסְגֵּי יָתָךְ לַחֲדָא לַחֲדָא:", "onk_en": "I will give My covenant between Me [<i>My Word<\/i>] and you, and I will multiply you[r descendants] exceedingly.", "pj": "וְאֶתֵּן קְיָימִי בֵּין מֵימְרִי וּבֵינָךְ וְאַסְגֵי יָתָךְ לַחֲדָא לַחֲדָא", "pj_en": "And I will set My covenant between My Word and thee, and will multiply thee very greatly.", "tj": "", "tj_en": "", "rashi": "<b>ואתנה בריתי.<\/b> בְּרִית שֶׁל אַהֲבָה וּבְרִית הָאָרֶץ לְהוֹרִישָׁהּ לְךָ עַל יְדֵי מִצְוָה זוֹ:", "rashi_en": "ואתנה בריתי AND I WILL MAKE MY COVENANT — a covenant of love and a covenant regarding the land — to give it to you as an inheritance through your observance of this precept. "}, {"ch": 17, "v": 3, "aliyah": 6, "heb": "וַיִּפֹּ֥ל אַבְרָ֖ם עַל־פָּנָ֑יו וַיְדַבֵּ֥ר אִתּ֛וֹ אֱלֹהִ֖ים לֵאמֹֽר׃", "onk": "וּנְפַל אַבְרָם עַל אַפּוֹהִי וּמַלֵּיל עִמֵּיהּ יְיָ לְמֵימָר:", "onk_en": "Avram fell on his face. Elohim spoke with him, saying:", "pj": "וְעַל דְלָא הֲוָה אַבְרָם גְזִיר לָא הֲוָה יָכִיל לְמֵיקַם וְנָפַל עַל אַנְפּוֹי וּמַלֵיל עִמֵיהּ יְיָ לְמֵימַר", "pj_en": "And because Abram was not circumcised, he was not able to stand, but he bowed himself upon his face; and the Lord spake with him, saying,", "tj": "", "tj_en": "", "rashi": "<b>ויפל אברם על פניו.<\/b> מִמּוֹרָא הַשְּׁכִינָה; שֶׁעַד שֶׁלֹּא מָל לֹא הָיָה בוֹ כֹחַ לַעֲמֹד וְרוּח הַקֹּדֶשׁ נִצֶּבֶת עָלָיו, וְזֶהוּ שֶׁנֶּאֱמַר בְּבִלְעָם נֹפֵל וּגְלוּי עֵינָיִם, בִּבְרַיְתָא דְרַבִּי אֱלִיעֶזֶר:", "rashi_en": "ויפל אברם על פניו AND ABRAM FELL UPON HIS FACE through fear of the Shechinah, because before he was circumcised he did not have the strength to stand on his feet whilst the Holy Spirit stood over him; and it is to this that what is stated in the case of the heathen Balaam refers, (Numbers 24:4) “fallen down, yet with open eyes”. This is to be found in Baraitha of R. Eliezer (Pirkei DeRabbi Eliezer 29)."}, {"ch": 17, "v": 4, "aliyah": 6, "heb": "אֲנִ֕י הִנֵּ֥ה בְרִיתִ֖י אִתָּ֑ךְ וְהָיִ֕יתָ לְאַ֖ב הֲמ֥וֹן גּוֹיִֽם׃", "onk": "אֲנָא הָא (גְזַר <small>בנ\"י איננו<\/small>) קְיָמִי עִמָּךְ וּתְהֵי לְאַב סַגִּי עַמְמִין:", "onk_en": "As for Me, here is My covenant with you; you shall be the father of a multitude of nations.", "pj": "אֲנָא הָא גְזַר קְיָימִי עִמָךְ וּתְהִי לְאַב סַגִי עַמְמִין", "pj_en": "Behold, I have confirmed (or divided) my covenant with thee; and thou shalt be the father of many peoples.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 5, "aliyah": 6, "heb": "וְלֹא־יִקָּרֵ֥א ע֛וֹד אֶת־שִׁמְךָ֖ אַבְרָ֑ם וְהָיָ֤ה שִׁמְךָ֙ אַבְרָהָ֔ם כִּ֛י אַב־הֲמ֥וֹן גּוֹיִ֖ם נְתַתִּֽיךָ׃", "onk": "וְלָא יִתְקְרֵי עוֹד יָת שְׁמָךְ אַבְרָם וִיהֵי שְׁמָךְ אַבְרָהָם אֲרֵי אַב סַגִּי עַמְמִין יְהָבִתָּךְ:", "onk_en": "No longer shall your name be called Avram, but your name shall be Avraham, for the father of a multitude of nations I have appointed you.", "pj": "וְלָא יִתְקְרֵי תּוּב יַת שְׁמָךְ אַבְרָם וִיהֵי שְׁמָךְ אַבְרָהָם אֲרוּם לְאַב סַגִי סוֹגְעֵי עַמְמִין מַנִיתָךְ", "pj_en": "And thy name shall be no more called Abram, but Abraham shall be thy name, because to be the father of a great multitude of peoples have I appointed thee.", "tj": "", "tj_en": "", "rashi": "<b>כי אב המון גוים.<\/b> לְשׁוֹן נוֹטָרִיקוֹן שֶׁל שְׁמוֹ; וְרֵי\"ש שֶׁהָיְתָה בוֹ בַּתְּחִלָּה, שֶׁלֹּא הָיָה אָב אֶלָּא לַאֲרָם שֶׁהוּא מְקוֹמוֹ וְעַכְשָׁו אָב לְכָל הָעוֹלָם, לֹא זָזָה מִמְּקוֹמָהּ, שֶׁאַף יוֹ\"ד שֶׁל שָׂרַי נִתְרָעֲמָה עַל הַשְּׁכִינָה עַד שֶׁנִּתּוֹסְפָה לִיהוֹשֻׁעַ, שֶׁנֶּאֱמַר וַיִּקְרָא מֹשֶׁה לְהוֹשֵׁעַ בִּן נוּן יְהוֹשֻׁעַ (במדבר י\"ג):", "rashi_en": "כי אב המון גוים FOR A FATHER OF A MULTIDUDE OF NATIONS — An acrostic on his name [אב (ר) הם]. But the ר which was previously in his name — denoting that he was the father (chieftain) only of אב (א) רם] ארם] which was his native country (cf. Genesis 21:7 with verse Genesis 21:10 of the same chapter), whilst now he became father of the entire world — nevertheless was not taken out of his name. For we find also, that the 'י in Sarai’s name continued to complain to God that it had been removed from her name when this was changed to Sarah, until it was placed as an additional letter into the name יהושע, as it is said, (Numbers 13:16) “And Moses called Hoshea (הושע) the son of Nun, Joshua (יהושע)” (Genesis Rabbah 47:1). "}, {"ch": 17, "v": 6, "aliyah": 6, "heb": "וְהִפְרֵתִ֤י אֹֽתְךָ֙ בִּמְאֹ֣ד מְאֹ֔ד וּנְתַתִּ֖יךָ לְגוֹיִ֑ם וּמְלָכִ֖ים מִמְּךָ֥ יֵצֵֽאוּ׃", "onk": "וְאַפֵּישׁ יָתָךְ לַחֲדָא לַחֲדָא וְאֶתְּנִנָּךְ <b>לְכִנְשִׁין<\/b> וּמַלְכִין <b>דְּשַׁלִּיטִין בְּעַמְמַיָּא<\/b> מִנָּךְ יִפְקוּן:", "onk_en": "I will make you exceedingly fruitful and I will make you into nations [<i>assemblies<\/i>]; and kings [<i>who rule over nations<\/i>] will descend from you.", "pj": "וְאַפֵּישׁ יָתָךְ לַחֲדָא לַחֲדָא וְאֶתְּנִינָךְ לְכִינְשִׁין וּמַלְכִין שַׁלִיטִין בְּעַמְמַיָא מִנָךְ יִפְקוּן", "pj_en": "And I will make thee exceeding fruitful, and will set thee for congregations; and kings ruling over peoples shall come forth from thee.", "tj": "", "tj_en": "", "rashi": "<b>ונתתיך לגוים.<\/b> יִשְׂרָאֵל וֶאֱדוֹם, שֶׁהֲרֵי יִשְׁמָעֵאל כְּבָר הָיָה לוֹ, וְלֹא הָיָה מְבַשְּׂרוֹ עָלָיו:", "rashi_en": "ונתתיך לגוים AND I WILL MAKE NATIONS OF THEE — Israel and Edom only are intended here for Ishmael was already born to him and He could not, therefore, have been making any announcement concerning him."}, {"ch": 17, "v": 7, "aliyah": 7, "heb": "וַהֲקִמֹתִ֨י אֶת־בְּרִיתִ֜י בֵּינִ֣י וּבֵינֶ֗ךָ וּבֵ֨ין זַרְעֲךָ֧ אַחֲרֶ֛יךָ לְדֹרֹתָ֖ם לִבְרִ֣ית עוֹלָ֑ם לִהְי֤וֹת לְךָ֙ לֵֽאלֹהִ֔ים וּֽלְזַרְעֲךָ֖ אַחֲרֶֽיךָ׃", "onk": "וַאֲקֵים יָת קְיָמִי בֵּין <b>מֵימְרִי<\/b> וּבֵינָךְ וּבֵין בְּנָךְ בַּתְרָךְ לְדָרֵיהוֹן לִקְיָם עָלָם לְמֵהֲוֵי לָךְ לֵאלָהָא וְלִבְנָךְ בַּתְרָךְ:", "onk_en": "I will sustain My covenant between Me [<i>My Word<\/i>] and you, and between your descendants after you throughout their generations as an eternal covenant, to be a God to you, and to your descendants after you.", "pj": "וַאֲקַיֵם יַת קְיָמִי בֵּין מֵימְרִי וּבֵינָךְ וּבֵין בְּנָךְ בַּתְרָךְ לְדָרֵיהוֹן לִקְיַים עֲלָם לְמֶהֱוֵי לָךְ לֶאֱלָהָא וְלִבְנָךְ בַּתְרָךְ", "pj_en": "And I have established My covenant between My Word and thee, and thy sons after thee in their generations, for an everlasting covenant, to be a God to thee and to thy sons after thee.", "tj": "", "tj_en": "", "rashi": "<b>והקמתי את בריתי.<\/b> וּמַה הִיא הַבְּרִית? לִהְיוֹת לְךָ לֵאלֹהִים:", "rashi_en": "והקמתי את בריתי AND I WILL ESTABLISH MY COVENANT — And what is this Covenant? להיות לך לאלהים TO BE A GOD UNTO THEE."}, {"ch": 17, "v": 8, "aliyah": 7, "heb": "וְנָתַתִּ֣י לְ֠ךָ֠ וּלְזַרְעֲךָ֨ אַחֲרֶ֜יךָ אֵ֣ת&thinsp;<b>׀<\/b> אֶ֣רֶץ מְגֻרֶ֗יךָ אֵ֚ת כׇּל־אֶ֣רֶץ כְּנַ֔עַן לַאֲחֻזַּ֖ת עוֹלָ֑ם וְהָיִ֥יתִי לָהֶ֖ם לֵאלֹהִֽים׃", "onk": "וְאֶתֵּן לָךְ וְלִבְנָךְ בַּתְרָךְ יָת אַרְעָא תּוֹתָבוּתָךְ יָת כָּל אַרְעָא דִכְנַעַן לְאַחֲסָנַת עָלָם וְאֶהֱוֵי לְהוֹן לֵאלָהָא:", "onk_en": "I will give to you, and to your descendants after you, the land of your temporary residence, all the land of Canaan as an eternal possession, and I will be a God to them.", "pj": "וְאֶתֵּן לָךְ וְלִבְנָךְ בַּתְרָךְ יַת אֲרַע תּוֹתָבוּתָךְ יַת כָּל אַרְעָא דִכְנָעַן לְאַחֲסָנַת עֲלָם וֶאֶהֱוֵי לְהוֹן לֶאֱלָהָא", "pj_en": "And I will give to thee and to thy sons after thee the land of thy habitation, all the land of Kenaan, for an everlasting possession: and I will be to them Eloha.", "tj": "", "tj_en": "", "rashi": "<b>לאחזת עולם.<\/b> וְשָׁם אֶהְיֶה לָכֶם לֵאלֹהִים, אֲבָל הַדָּר בְּחוּצָה לָאָרֶץ דּוֹמֶה כְמִי שֶׁאֵין לוֹ אֱלוֹהַּ:", "rashi_en": "לאחזת עולם FOR AN EVERLASTING POSSESSION — and there I will be your God; but whoever resides outside the land is as if he has no God (Ketubot 110b). "}, {"ch": 17, "v": 9, "aliyah": 7, "heb": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־אַבְרָהָ֔ם וְאַתָּ֖ה אֶת־בְּרִיתִ֣י תִשְׁמֹ֑ר אַתָּ֛ה וְזַרְעֲךָ֥ אַֽחֲרֶ֖יךָ לְדֹרֹתָֽם׃", "onk": "וַאֲמַר יְיָ לְאַבְרָהָם וְאַתְּ יָת קְיָמִי תִטָּר אַתְּ וּבְנָךְ בַּתְרָךְ לְדָרֵיהוֹן:", "onk_en": "Elohim said to Avraham: And as for you, you must preserve My covenant, you and your descendants after you throughout their generations.", "pj": "וַאֲמַר יְיָ לְאַבְרָהָם וְאַנְתְּ יַת קְיָימִי תִּיטוֹר אַנְתְּ וּבְנָךְ בַּתְרָךְ לְדָרֵיהוֹן", "pj_en": "And the Lord said to Abraham, And thou shalt observe my covenant, thou and thy sons after thee in their generations.", "tj": "", "tj_en": "", "rashi": "<b>ואתה.<\/b> וָי\"ו זוֹ מוֹסִיף עַל עִנְיָן רִאשׁוֹן, אֲנִי הִנֵּה בְרִיתִי אִתָּךְ, וְאַתָּה הֱוֵי זָהִיר לְשָׁמְרוֹ, וּמַה הִיא שְׁמִירָתוֹ? זֹאת בְּרִיתִי אֲשֶׁר תִּשְׁמְרוּ הִמּוֹל לָכֶם וְגוֹ':", "rashi_en": "ואתה AND AS FOR THEE — This ו (of ואתה) connects this verse with the preceding matter (v. Gensis 17:4, thus setting ואתה of here in contrast with the ואני of there): “As for Me, behold My covenant is with thee” — “and as for thee, thou shalt be careful to keep it”. And what constitutes the “keeping” of it? THIS IS MY COVENANT WHICH YE SHALL KEEP… EVERY MALE AMONGST YOU [SHALL BE CIRCUMCISED]."}, {"ch": 17, "v": 10, "aliyah": 7, "heb": "זֹ֣את בְּרִיתִ֞י אֲשֶׁ֣ר תִּשְׁמְר֗וּ בֵּינִי֙ וּבֵ֣ינֵיכֶ֔ם וּבֵ֥ין זַרְעֲךָ֖ אַחֲרֶ֑יךָ הִמּ֥וֹל לָכֶ֖ם כׇּל־זָכָֽר׃", "onk": "דָּא קְיָמִי דִּי תִטְּרוּן בֵּין <b>מֵימְרִי<\/b> וּבֵינֵיכוֹן וּבֵין בְּנָךְ בַּתְרָךְ מִגְזַר לְכוֹן כָּל דְּכוּרָא:", "onk_en": "This is My covenant which you must preserve between Me [<i>My Word<\/i>] and you, and your descendants after you: every male among you shall be circumcised.", "pj": "דָא קְיָימִי דְתִטְרוּן בֵּין מֵימְרִי וּבֵינֵיכוֹן וּבֵין בְּנָךְ בַּתְרָךְ מִגְזַר לְכוֹן כָּל דְכוּרָא אִין לֵית לֵיהּ אַבָּא לְמִגְזְרֵיהּ", "pj_en": "This is My covenant, that you shall observe between My Word and you, and your sons after you:--Every male of you being circumcised, though he have not a father to circumcise him.", "tj": "", "tj_en": "", "rashi": "<b>ביני וביניכם וגו'.<\/b> אוֹתָם שֶׁל עַכְשָׁו:<br><br><b>ובין זרעך אחריך.<\/b> הָעֲתִידִין לְהִוָּלֵד:<br><br><b>המול.<\/b> כְּמוֹ לְהִמּוֹל, כְּמוֹ שֶׁאַתָּה אוֹמֵר עֲשׂוֹת, כְּמוֹ לַעֲשׂוֹת:", "rashi_en": "'ביני וביניכם וגו BETWEEN ME AND YOU — “you” is plural and refers to all those belonging to Abraham who were then alive.<br><br>ובין זרעך אחריך AND THY SEED AFTER THEE — those who are yet to be born.<br><br>המול is an infinitive equal to לְהִמּוֹל just as you may say עַשׂוֹת in place of לעשות (i.e. the infinitive may be with or without ל prefixed)."}, {"ch": 17, "v": 11, "aliyah": 7, "heb": "וּנְמַלְתֶּ֕ם אֵ֖ת בְּשַׂ֣ר עׇרְלַתְכֶ֑ם וְהָיָה֙ לְא֣וֹת בְּרִ֔ית בֵּינִ֖י וּבֵינֵיכֶֽם׃", "onk": "וְתִגְזְרוּן יָת בִּשְׂרָא דְעָרְלָתְכוֹן וּתְהֵי (<small>נ\"י<\/small> וּתְהֵא) לְאָת קְיָם בֵּין <b>מֵימְרִי<\/b> וּבֵינֵיכוֹן:", "onk_en": "You shall circumcise the flesh of your foreskin. This shall be the sign of the covenant between Me [<i>My Word<\/i>] and you.", "pj": "וְתִגְזְרוּן יַת בִּשְרָא דְעוּרְלַתְכוֹן וִיהֵי לְאָת קְיָם בֵּין מֵימְרִי וּבֵינֵיכוֹן", "pj_en": "And you shall circumcise the flesh of your foreskin, as a sign of the covenant between My Word and you.", "tj": "", "tj_en": "", "rashi": "<b>ונמלתם.<\/b> כְּמוֹ וּמַלְתֶּם, וְהַנּוּ\"ן בּוֹ יְתֵרָה לִיסוֹד הַנּוֹפֵל בּוֹ לִפְרָקִים, כְּגוֹן נ' שֶׁל נוֹשֵׁךְ ונ' שֶׁל נוֹשֵׂא, וּנְמַלְתֶּם, כְּמוֹ וּנְשָׂאתֶם; אֲבָל יִמּוֹל לְשׁוֹן יִפָּעֵל, כְּמוֹ יֵעָשֶׂה, יֵאָכֵל:", "rashi_en": "ונמלתם AND YE SHALL CIRCUMCISE — This word, in spite of the נ in it, is not Niphal but the same as ומלתם and the נ in it is an addition to the root, which only sometimes appears in it, as, for example, the נ of נושך and of ונמלתם ;(נושא is Kal like ונשאתם “and ye shall carry” (Genesis 45:19), but יִמּוֹל (Genesis 17:12 and Genesis 17:13) is a Niphal form — “shall be circumcised” — like יֵעָשֶׂה “it shall be done”, and יֵאָכֵל “it shall be eaten”."}, {"ch": 17, "v": 12, "aliyah": 7, "heb": "וּבֶן־שְׁמֹנַ֣ת יָמִ֗ים יִמּ֥וֹל לָכֶ֛ם כׇּל־זָכָ֖ר לְדֹרֹתֵיכֶ֑ם יְלִ֣יד בָּ֔יִת וּמִקְנַת־כֶּ֙סֶף֙ מִכֹּ֣ל בֶּן־נֵכָ֔ר אֲשֶׁ֛ר לֹ֥א מִֽזַּרְעֲךָ֖ הֽוּא׃", "onk": "וּבַר תְּמַנְיָא יוֹמִין יִתְגְּזַר (<small>נ\"י<\/small> יִגְזַר) לְכוֹן כָּל דְּכוּרָא לְדָרָתֵיכוֹן יְלִידֵי בֵיתָא וּזְבִינֵי כַסְפָּא מִכֹּל בַּר עַמְמִין דְּלָא מִבְּנָךְ הוּא:", "onk_en": "At the age of eight days every male among you must be circumcised, throughout your generations; he that is a house-born [slave] or one that was bought with money from any stranger who is not your descendant.", "pj": "וּבַר תְּמַנְיָא יוֹמִין יִגְזוֹר לְכוֹן כָּל דְכוּרָא לְדָרֵיכוֹן מַרְבְּיָינֵי בָּתֵּיכוֹן וּזְבִינֵי כַּסְפֵּיכוֹן מִן כָּל בַּר עַמְמִין דְלָא מִבְּנָךְ הוּא", "pj_en": "And the son of eight days shall be circumcised among you, every male in your generations; from him who is brought up in your house, or bought with your silver, unto every son of the peoples who is not of you.", "tj": "", "tj_en": "", "rashi": "<b>יליד בית.<\/b> שֶׁיְּלָדַתּוּ הַשִּׁפְחָה בַּבַּיִת:<br><br><b>מקנת כסף.<\/b> שֶׁקְּנָאוֹ מִשֶּׁנּוֹלַד:", "rashi_en": "יליד בית HE THAT IS BORN IN THE HOUSE — one to whom a handmaid gave birth in the house.<br><br>מקנת כסף HE THAT IS BOUGHT WITH THY MONEY — one whom a person bought after his birth."}, {"ch": 17, "v": 13, "aliyah": 7, "heb": "הִמּ֧וֹל&thinsp;<small>׀<\/small>&thinsp;יִמּ֛וֹל יְלִ֥יד בֵּֽיתְךָ֖ וּמִקְנַ֣ת כַּסְפֶּ֑ךָ וְהָיְתָ֧ה בְרִיתִ֛י בִּבְשַׂרְכֶ֖ם לִבְרִ֥ית עוֹלָֽם׃", "onk": "אִתְגַּזָּרָא יִתְגַּזְּרוּן (<small>נ\"י<\/small> מִגְזַר יִגְזַר) יְלִיד בֵּיתָךְ וּזְבִין כַּסְפָּךְ וּתְהֵי קְיָמִי בְּבִשְׂרֵיכוֹן לִקְיָם עָלָם:", "onk_en": "Your house-born slaves must be circumcised, and also those bought with your money. This shall be My covenant in your flesh as an eternal covenant.", "pj": "מַאן דְהוּא גְזִיר יִגְזַר מַרְבְּיָינֵי בָּתֵּיכוֹן וּזְבִינֵי כַּסְפֵּיכוֹן וּתְהִי קְיָמִי בְּבִשְרֵיכוֹן לִקְיָם עֲלָם", "pj_en": "He who is circumcised shall circumcise him who is brought up among you, or bought with your silver; and it shall be My covenant in your flesh for a covenant for ever.", "tj": "", "tj_en": "", "rashi": "<b>המול ימול יליד ביתך.<\/b> כָּאן כָּפַל עָלָיו וְלֹא אָמַר לִשְׁמוֹנָה יָמִים לְלַמֶּדְךָ שֶׁיֵּשׁ יְלִיד בַּיִת נִמּוֹל לְאַחַר שְׁמוֹנָה יָמִים (<small>ס\"א<\/small> לְאֶחָד) כְּמוֹ שֶׁמְּפֹרָשׁ בְּמַסֶּכֶת שַׁבָּת (דף קל\"ה ב'):", "rashi_en": "המול ימול יליד ביתך HE THAT IS BORN IN THY HOUSE MUST NEEDS BE CIRCUMCISED — Here the statement that one born in the house must be circumcised is repeated but it does not say “after eight days” as in 5:12, thus teaching you that there are some cases of those “born in the house” who have to be circumcised on the first day of birth, as is explained in Treatise Sabbath (Shabbat 135b)."}, {"ch": 17, "v": 14, "aliyah": 7, "heb": "וְעָרֵ֣ל&thinsp;<b>׀<\/b> זָכָ֗ר אֲשֶׁ֤ר לֹֽא־יִמּוֹל֙ אֶת־בְּשַׂ֣ר עׇרְלָת֔וֹ וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵעַמֶּ֑יהָ אֶת־בְּרִיתִ֖י הֵפַֽר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעָרֵל דְּכוּרָא דִּי לָא יִגְזַר יָת בְּשַׂר עָרְלָתֵיהּ וְיִשְׁתֵּיצֵי <b>אֱנָשָׁא<\/b> הַהִיא מְעַמֵּיהּ יָת קְיָמִי <b>אַשְׁנִי<\/b>:", "onk_en": "An uncircumcised male, who will not circumcise his foreskin, that soul [<i>man<\/i>] shall be cut off from its people; he has broken [<i>changed<\/i>] My covenant.", "pj": "וְעַרְלָאָה דְכוּרָאָה דְלָא יִגְזַר יַת בִּשְרָא דְעוּרְלָתֵיהּ וְאִין לֵית לֵיהּ מַאן דְיִגְזַר וְיִשְׁתְּצֵי בַּר נְשָׁא הַהוּא מֵעַמֵיהּ יַת קְיָימֵי אַשְׁנִי", "pj_en": "And the uncircumcised male who is not circumcised in the flesh of his foreskin, unless he have some one to circumcise him, that man shall be cut off from his people; he hath made My covenant to pass away.", "tj": "", "tj_en": "", "rashi": "<b>וערל זכר.<\/b> כָּאן לִמֵּד שֶׁהַמִּילָה בְּאוֹתוֹ מָקוֹם שֶׁהוּא נִכָּר בֵּין זָכָר לִנְקֵבָה (בראשית רבה):<br><br><b>אשר לא ימול.<\/b> מִשֶּׁיַּגִּיעַ לִכְלַל עֳנָשִׁין וְנִכְרְתָה; אֲבָל אָבִיו אֵין עָנוּשׁ עָלָיו כָּרֵת, אֲבָל עוֹבֵר בַּעֲשֵׂה:<br><br><b>ונכרתה הנפש.<\/b> הוֹלֵךְ עֲרִירִי וּמֵת קֹדֶם זְמַנּוֹ (שבת כ\"ד):", "rashi_en": "וערל זכר AND THE UNCIRCUMCISED MALE — This phrase teaches that circumcision must be at that place where the distinction between male and female is evident (Genesis Rabbah 46:13).<br><br>אשר לא ימול HE WHO DOES NOT CIRCUMCISE HIMSELF) as soon as he reaches the age when he is legally liable to punishment, ונכרתה THEN HE SHALL BE CUT OFF — his father, however, who did not have him circumcised is not punished on his account with כרת (excision, “being cut off from his people”), but is merely transgressing an עשה “a positive commandment” (for which the punishment is flagellation).<br><br>ונכרתה הנפש THAT SOUL SHALL BE CUT OFF — i. e. he shall depart hence childless and shall suffer an untimely death."}, {"ch": 17, "v": 15, "aliyah": 7, "heb": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־אַבְרָהָ֔ם שָׂרַ֣י אִשְׁתְּךָ֔ לֹא־תִקְרָ֥א אֶת־שְׁמָ֖הּ שָׂרָ֑י כִּ֥י שָׂרָ֖ה שְׁמָֽהּ׃", "onk": "וַאֲמַר יְיָ לְאַבְרָהָם שָׂרַי אִתְּתָךְ לָא תִקְרֵי יָת שְׁמַהּ שָׂרָי אֲרֵי שָׂרָה שְׁמַהּ:", "onk_en": "And Elohim said to Avraham [As for] Sarai your wife, do not call her by the name Sarai, for Sarah is her name.", "pj": "וַאֲמַר יְיָ לְאַבְרָהָם שָרַי אִנְתְּתָךְ לָא תְהִי קָרֵי יַת שְׁמָהּ שָרַי אֲרוּם שָרָה שְׁמָהּ", "pj_en": "And the Lord said to Abraham, The name of Sara thy wife shall be no more called Sara; for Sarah shall be her name.", "tj": "", "tj_en": "", "rashi": "<b>לא תקרא את שמה שרי.<\/b> דְּמַשְׁמַע שָׂרַי, לִי וְלֹא לְאַחֵרִים, <b>כי שרה<\/b> סְתָם שְׁמָהּ, שֶׁתְּהֵא שָׂרָה עַל כֹּל (ברכות י\"ג):", "rashi_en": "לא תקרא את שמה שרי THOU SHALT NOT CALL HER NAME SARAI which means “my princess”— a princess to me and not to others — BUT SARAH, in a more general sense, SHALL BE HER NAME: she shall be princess over all (Berakhot 13a)."}, {"ch": 17, "v": 16, "aliyah": 7, "heb": "וּבֵרַכְתִּ֣י אֹתָ֔הּ וְגַ֨ם נָתַ֧תִּי מִמֶּ֛נָּה לְךָ֖ בֵּ֑ן וּבֵֽרַכְתִּ֙יהָ֙ וְהָֽיְתָ֣ה לְגוֹיִ֔ם מַלְכֵ֥י עַמִּ֖ים מִמֶּ֥נָּה יִהְיֽוּ׃", "onk": "וֶאֱבָרֵךְ יָתַהּ וְאַף אֶתֵּן מִנַּהּ לָךְ בָּר וֶאֱבָרֲכִנַּהּ וּתְהֵי <b>לְכִנְשִׁין<\/b> מַלְכִין <b>דְּשַׁלִּיטִין בְּעַמְמַיָּא<\/b> מִנַּהּ יְהוֹן:", "onk_en": "I will bless her, and I will also give you a son through her. I will bless her, and she will be [a mother] of nations [<i>assemblies<\/i>], kings of peoples [<i>who rule over nations<\/i>] will descend from her.", "pj": "וַאֲבָרֵךְ יָתָהּ בְּגוּפָהּ וְאַף אֶתֵּן מִנָהּ לָךְ בַּר וַאֲבָרְכִינָהּ בֵּיהּ וּתְהִי לְכִנְשִׁין וּמַלְכִין שַׁלִיטִין בְּעַמְמַיָא מִינָהּ יְהוֹן", "pj_en": "And I will bless in her body, and will also give from her a son to thee, and I will bless, him, and he shall be for assemblies, and kings ruling over nations shall be from her.", "tj": "", "tj_en": "", "rashi": "<b>וברכתי אותה.<\/b> וּמַה הִיא הַבְּרָכָה? שֶׁחָזְרָה לְנַעֲרוּתָהּ, שֶׁנֶּאֱמַר הָיְתָה לִּי עֶדְנָה (בר' י\"ח):<br><br><b>וברכתיה.<\/b> בַּהֲנָקַת שָׁדַיִם כְּשֶׁנִּצְרְכָה לְכָךְ בְּיוֹם מִשְׁתֶּה שֶׁל יִצְחָק, שֶׁהָיוּ מְרַנְּנִין עֲלֵיהֶם שֶׁהֵבִיאוּ אֲסוּפִי מִן הַשּׁוּק וְאוֹמְרִים בְּנֵנוּ הוּא, וְהֵבִיאָה כָל אַחַת בְּנָה עִמָּהּ וּמֵנִקְתָּהּ לֹא הֵבִיאָה, וְהִיא הֵנִיקָה אֶת כֻּלָּם; הוּא שֶׁנֶּאֱמַר הֵינִיקָה בָנִים שָׂרָה, בְּ\"ר רְמָזוֹ בְּמִקְצָת:", "rashi_en": "וברבתי אותה AND I WILL BLESS HER — And in what did the blessing consist? In that she resumed her youthfulness, as it is said, (Genesis 18:12) “shall I have the pleasure of youth again?” (Genesis Rabbah 47:2)<br><br>וברכתיה AND I WILL BLESS HER with teeming breasts. And this happened when she really needed this on the day of Isaac’s feast. For people were speaking spitefully about them, that they had adopted a foundling from the street saying, “This is our son.” Every one, therefore, brought her child with her, but did not bring the wet-nurse and she (Sarah) suckled all of them. To this refers that which is said (Genesis 21:7) “Sarah has given suck to children”. In Genesis Rabbah 47:2 this is alluded to in part. "}, {"ch": 17, "v": 17, "aliyah": 7, "heb": "וַיִּפֹּ֧ל אַבְרָהָ֛ם עַל־פָּנָ֖יו וַיִּצְחָ֑ק וַיֹּ֣אמֶר בְּלִבּ֗וֹ הַלְּבֶ֤ן מֵאָֽה־שָׁנָה֙ יִוָּלֵ֔ד וְאִ֨ם־שָׂרָ֔ה הֲבַת־תִּשְׁעִ֥ים שָׁנָ֖ה תֵּלֵֽד׃", "onk": "וּנְפַל אַבְרָהָם עַל אַפּוֹהִי <b>וַחֲדִי<\/b> וַאֲמַר בְּלִבֵּיהּ הַלְבַר מְאָה שְׁנִין יְהֵי וְלַד וְאִם שָׂרָה הֲבַת תִּשְׁעִין שְׁנִין תְּלִיד:", "onk_en": "Avraham fell on his face and laughed [<i>rejoiced<\/i>]. He said in his heart: Can a hundred year old man have children? Shall Sarah, who is ninety years old give birth?", "pj": "וּנְפַל אַבְרָהָם עַל אַנְפּוֹי וְתָמַהּ וַאֲמַר בְּלִבֵּיהּ הַלְבָר מְאָה שְׁנִין יְהִי וָולָד וְאִין שָרָי הַבְּרַת תִּשְׁעִין שְׁנִין תּוֹלִיד", "pj_en": "And Abraham fell on his face, and wondered, and said in his heart, Shall the son of a hundred years have progeny, and Sarah, the daughter of ninety years, bear a child?", "tj": "וְאִתְרְכִין אַבְרָהָם עַל אַפּוֹי וְתָמָה:", "tj_en": "And Abraham bowed upon his face, and wondered.", "rashi": "<b>ויפל אברהם על פניו ויצחק.<\/b> זֶה תִּ\"אֻ, לְשׁוֹן שִׂמְחָה, וַחֲדִי, וְשֶׁל שָׂרָה לְשׁוֹן מָחוֹךְ; לָמַדְתָּ שֶׁאַבְרָהָם הֶאֱמִין וְשָׂמַח וְשָׂרָה לֹא הֶאֱמִינָה וְלִגְלְגָה, וְזֶהוּ שֶׁהִקְפִּיד הַקָּבָּ\"ה עַל שָׂרָה וְלֹא הִקְפִּיד עַל אַבְרָהָם:<br><br><b>הלבן.<\/b> יֵשׁ תְּמִיהוֹת שֶׁהֵן קַיָּמוֹת, כְּמוֹ הֲנִגְלֹה נִגְלֵיתִי? (שמואל א ב'), הֲרֹאֶה אַתָּה (יח' ח'), אַף זוֹ הִיא קַיֶּמֶת; וְכָךְ אָמַר בְּלִבּוֹ, הֲנַעֲשָׂה חֶסֶד זֶה לְאַחֵר, מַה שֶּׁהַקָּבָּ\"ה עוֹשֶׂה לִי?<br><br><b>ואם שרה הבת תשעים שנה.<\/b> הָיְתָה כְדַאי לֵילֵד; וְאַף עַל פִּי שֶׁדּוֹרוֹת הָרִאשׁוֹנִים הָיוּ מוֹלִידִין בְּנֵי ת\"ק שָׁנָה, בִּימֵי אַבְרָהָם נִתְמָעֲטוּ הַשָּׁנִים כְּבָר וּבָא תַּשּׁוּת כֹּחַ לָעוֹלָם, צֵא וּלְמַד מֵעֲשָׂרָה דּוֹרוֹת שֶׁמִּנֹּחַ וְעַד אַבְרָהָם, שֶׁמִּהֲרוּ תּוֹלְדוֹתֵיהֶן בְּנֵי ס' וּבְנֵי ע':", "rashi_en": "ויפל אברהם על פניו ויצחק AND ABRAHAM FELL UPON HIS FACE AND LAUGHED — This word ויצחק Onkelos translates by וחדי which signifies joy (“and he rejoiced’’) but the similar verb in the case of Sarah (ותצחק Genesis 18:12) he translates as meaning laughter. From this you may understand that Abraham had faith and rejoiced, and that Sarah had no faith and sneered, and that is why God was angry with Sarah (when she laughed) but was not angry with Abraham.<br><br>הלבן SHALL A CHILD BE BORN TO ONE WHO IS A HUNDRED YEARS OLD? — There are some questions expressing astonishment which do not imply a doubt but rather affirm the certainty that the circumstance referred to has happened or will happen, as (1 Samuel 2:2) “Did I reveal myself [unto thy father’s house?]” (Of course, I did) and (Ezekiel 8:6) “Seest thou what they do?” (You, of course, have seen it). This question, too, affirms the certainty that it is possible for God to cause Abraham, at the age of hundred, to beget a son and this is in effect what he said to himself: Would there be done to another man one hundred years old this favour that the Holy One, blessed be He, is doing to me”? (Rashi means that the words must be translated, “would a child be born to any other person who is a hundred years old?”).<br><br>ואם שרה הבת תשעים שנה OR SHALL SARAH, WHO IS NINETY YEARS OLD be worthy to bear a son? Although the previous generations used to beget at the age of five hundred years, yet in Abraham’s days the length of life had already become shorter and a diminution of strength had come upon people. Go and learn this from the ten generations from Noah to Abraham who begot their children at the then early age of sixty or seventy."}, {"ch": 17, "v": 18, "aliyah": 7, "heb": "וַיֹּ֥אמֶר אַבְרָהָ֖ם אֶל־הָֽאֱלֹהִ֑ים ל֥וּ יִשְׁמָעֵ֖אל יִחְיֶ֥ה לְפָנֶֽיךָ׃", "onk": "וַאֲמַר אַבְרָהָם <b>קֳדָם<\/b> יְיָ לְוַי יִשְׁמָעֵאל יִתְקַיָּם קֳדָמָךְ:", "onk_en": "And Avraham said to [<i>before<\/i>] Elohim: May it be granted that Yishmael live before You.", "pj": "וַאֲמַר אַבְרָהָם קֳדָם יְיָ הַלְוַאי יִשְמָעֵאל יִתְקַיֵים וְיִפְלַח קוּמָךְ", "pj_en": "And Abraham said before the Lord, May not Ishmael be established, and serve before Thee?", "tj": "", "tj_en": "", "rashi": "<b>לו ישמעאל יחיה.<\/b> הַלְוַאי שֶׁיִּחְיֶה יִשְׁמָעֵאל; אֵינִי כְדַאי לְקַבֵּל מַתַּן שָׂכָָר כָּזֶה:<br><br><b>יחיה לפניך.<\/b> יִחְיֶה בְיִרְאָתֶךָ, כְּמוֹ הִתְהַלֵּךְ לְפָנַי – פְּלַח קֳדָמַי:", "rashi_en": "לו ישמעאל יחיה means O THAT ISHMAEL MIGHT LIVE: I am unworthy to receive such a reward!<br><br>יחיה לפניך LIVE BEFORE THEE — live in reverence of thee; similar in sense is Genesis 17:1, התהלך לפני, which Onkelos renders by “worship Me”. "}, {"ch": 17, "v": 19, "aliyah": 7, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֗ים אֲבָל֙ שָׂרָ֣ה אִשְׁתְּךָ֗ יֹלֶ֤דֶת לְךָ֙ בֵּ֔ן וְקָרָ֥אתָ אֶת־שְׁמ֖וֹ יִצְחָ֑ק וַהֲקִמֹתִ֨י אֶת־בְּרִיתִ֥י אִתּ֛וֹ לִבְרִ֥ית עוֹלָ֖ם לְזַרְע֥וֹ אַחֲרָֽיו׃", "onk": "וַאֲמַר יְיָ בְּקוּשְׁטָא שָׂרָה אִתְּתָךְ תְּלִיד לָךְ בָּר וְתִקְרֵי יָת שְׁמֵיהּ יִצְחָק וַאֲקֵים יָת קְיָמִי עִמֵּיהּ לִקְיָם עָלָם לִבְנוֹהִי בַתְרוֹהִי:", "onk_en": "Elohim said: Indeed, your wife Sarah will bear you a son, and you will name him Yitzchok. I will establish My covenant with him as an eternal covenant to his descendants after him.", "pj": "וַאֲמַר יְיָ בְּקוּשְׁטָא שָרָה אִנְתְּתָךְ תְּלִיד לָךְ בַּר וְתִקְרֵי יַת שְׁמֵיהּ יִצְחָק וְאָקִים יַת קְיָימִי עִמֵיהּ לִקְיַים עֲלָם לִבְנוֹי בַתְרוֹי", "pj_en": "And the Lord said, In truth Sarah thy wife shall bear thee a son, and thou shalt call his name Izhak; and with him I will confirm My covenant for an everlasting covenant to his sons after him.", "tj": "", "tj_en": "", "rashi": "<b>אבל.<\/b> לְשׁוֹן אֲמִתַּת דְּבָרִים, וְכֵן אֲבָל אֲשֵׁמִים אֲנַחְנוּ (בראשית מ\"ב), אֲבָל בֵּן אֵין לָהּ (מלכים ב ד'):<br><br><b>וקראת את שמו יצחק.<\/b> עַל שֵׁם הַצְּחוֹק, וְיֵ\"אֹ עַל שֵׁם הָעֲשָׂרָה נִסְיוֹנוֹת וצ' שָׁנָה שֶׁל שָׂרָה וח' יָמִים שֶׁנִּמּוֹל, וק' שָׁנָה שֶׁל אַבְרָהָם:<br><br><b>והקימתי את בריתי אתו.<\/b> לָמָּה נֶאֱמַר, כְּבָר כְּתִיב וְאַתָּה אֶת בְּרִיתִי תִשְׁמֹר אַתָּה וְזַרְעֲךָ וְגוֹ'? אֶלָּא לְפִי שֶׁאוֹמֵר וַהֲקִמוֹתִי וְגוֹ', יָכוֹל בְּנֵי יִשְׁמָעֵאל וּבְנֵי קְטוּרָה בִּכְלַל הַקִּיּוּם, תַּ\"לֹ וַהֲקִמֹתִי אֶת בְּרִיתִי אִתּוֹ – וְלֹא עִם אֲחֵרִים: <b>ואת בריתי אקים את יצחק.<\/b> לָמָּה נֶאֱמַר? אֶלָּא לִמֵּד שֶׁהָיָה קָדוֹשׁ מִבֶּטֶן. דָּ\"אַ אָמַר רַ' אַבָּא, מִכָּאן לָמַד קַ\"וָ בֶּן הַגְּבִירָה מִבֶּן הָאָמָה; כְּתִיב הִנֵּה בֵּרַכְתִּי אֹתוֹ וְהִפְרֵיתִי אֹתוֹ וְהִרְבֵּיתִי אֹתוֹ, זֶה יִשְׁמָעֵאל, וְקַ\"וָ וְאֶת בְּרִיתִי אָקִים אֶת יִצְחָק:<br><br><b>ואת בריתי.<\/b> בְּרִית הַמִּילָה תְּהֵא מְסוּרָה לְזַרְעוֹ שֶׁל יִצְחָק:", "rashi_en": "אבל VERILY — This word implies confirmation of a statement, just as (Genesis 42:21) “Verily (אבל) we are guilty”, and (2 Kings 4:14) “Verily (אבל) she has no son”.<br><br>וקראת את שמו יצחק AND THOU SHALL CALL HIS NAME ISAAC — with reference to his laughter. Some say the name has reference to the ten (י) trials, the ninety (צ) years of Sarah’s age, the eight (ח) days of the circumcision and the hundred (ק) years of Abraham’s age (Genesis Rabbah 53:7).<br><br>והקמתי את בריתי AND I WILL ESTABLISH MY COVENANT WITH HIM — Why is this stated? Is it not already written (Genesis 17:9) “as for thee, thou shalt keep My Covenant, thou and thy seed etc.”? But since is said, (Genesis 17:7) and I will establish My Covenant between Me and thee and thy seed after thee in their generations”, it might be inferred that the children of Ishmael and the children of Keturah (who are all descendants of Abraham) are included in this promise of the establishment of the Covenant, therefore it states here (Genesis 17:19) “And I will establish My Covenant with him (Isaac), not with the others” (cf. Sanhedrin 59b). If so, why is there a repetition of the statement that the covenant will be established with Isaac in the words (Genesis 17:21) ואת בריתי אקים את יצחק “but My Covenant will I establish with Isaac”? But it is repeated in order to add the words אשר תלד so as to teach that he was holy from his birth (Shabbat 137b). Another explanation of why 5:21 is repeated is: R. Aba said, “from here Scripture draws a logical conclusion regarding the son of the Mistress (Sarah) from what is said regarding the son of the handmaid (Hagar): It is written (Genesis 17:20) “Behold I have blessed him and will make him fruitful”, and this refers to Ishmael: Surely then, it follows logically that “I must establish my covenant (of blessing) with Isaac also!” (Genesis Rabbah 47:5).<br><br>את בריתי [I WILL ESTABLISH] MY COVENANT — The Covenant of circumcision shall be transmitted only to the descendants of Isaac."}, {"ch": 17, "v": 20, "aliyah": 7, "heb": "וּֽלְיִשְׁמָעֵאל֮ שְׁמַעְתִּ֒יךָ֒ הִנֵּ֣ה&thinsp;<b>׀<\/b> בֵּרַ֣כְתִּי אֹת֗וֹ וְהִפְרֵיתִ֥י אֹת֛וֹ וְהִרְבֵּיתִ֥י אֹת֖וֹ בִּמְאֹ֣ד מְאֹ֑ד שְׁנֵים־עָשָׂ֤ר נְשִׂיאִם֙ יוֹלִ֔יד וּנְתַתִּ֖יו לְג֥וֹי גָּדֽוֹל׃", "onk": "וְעַל יִשְׁמָעֵאל <b>קַבֵּלִית צְלוֹתָךְ<\/b> הָא בָּרֵכִית יָתֵיהּ וְאַפֵּשׁ יָתֵיהּ וְאַסְגֵּי יָתֵיהּ לַחֲדָא לַחֲדָא תְּרֵין עֲשַׂר רַבְרְבַיָּא יְלִיד וְאֶתְּנִנֵּיהּ לְעַם סַגִּי:", "onk_en": "And as for Yishmael, I have heard you [<i>I have accepted your prayer<\/i>]. I have blessed him, and I will make him fruitful, and will increase him exceedingly. He will become the father of twelve princes, and I will make him into a great nation.", "pj": "וְעַל יִשְׁמָעֵאל קַבִּילִית צְלוֹתִיךְ הָא בְרָכִית יָתֵיהּ וְאַפֵּישׁ יָתֵיהּ לַחֲדָה וְאַסְגֵי יָתֵיהּ לַחֲדָא לַחֲדָא תְּרֵיסַר רַבְרְבִין יוֹלִיד וְאִתְּנִינֵיהּ לְעַם סַגִי", "pj_en": "And concerning Ishmael I have heard thy prayer. Behold, I have blessed him; and I will spread him abroad, and multiply him very greatly. Twelve princes shall he beget, and I will give him to be a great people.", "tj": "", "tj_en": "", "rashi": "<b>שנים עשר נשיאים.<\/b> כַּעֲנָנִים יִכְלוּ; כְּמוֹ נְשִׂיאִים וְרוּחַ (משלי כ\"ה):", "rashi_en": "שנים עשר נשיאים TWELVE PRINCES — like clouds shall they vanish, the word נשיאים being explained here as the same word in (Proverbs 25:14) נשיאים ורוח “Clouds and wind” "}, {"ch": 17, "v": 21, "aliyah": 7, "heb": "וְאֶת־בְּרִיתִ֖י אָקִ֣ים אֶת־יִצְחָ֑ק אֲשֶׁר֩ תֵּלֵ֨ד לְךָ֤ שָׂרָה֙ לַמּוֹעֵ֣ד הַזֶּ֔ה בַּשָּׁנָ֖ה הָאַחֶֽרֶת׃", "onk": "וְיָת קְיָמִי אָקִים עִם יִצְחָק דִּי תְלִיד לָךְ שָׂרָה לְזִמְנָא הָדֵין בְּשַׁתָּא אָחֳרַנְתָּא:", "onk_en": "But I will establish My covenant with Yitzchok, who Sarah will bear to you at this time next year.", "pj": "וְיַת קְיָימִי אֲקַיֵים עִם יִצְחָק דְתוֹלִיד לָךְ שָרָה בְזִמְנָא הָדֵין בְּשַׁתָּא אוֹחֲרַנְתָּא", "pj_en": "But My covenant will I establish with Izhak, whom Sarah shall bear to thee at this time in the year after.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 22, "aliyah": 7, "heb": "וַיְכַ֖ל לְדַבֵּ֣ר אִתּ֑וֹ וַיַּ֣עַל אֱלֹהִ֔ים מֵעַ֖ל אַבְרָהָֽם׃", "onk": "וְשֵׁיצֵי לְמַלָּלָא עִמֵּיהּ וְאִסְתַּלַּק <b>יְקָרָא<\/b> דַיְיָ מֵעִלָּווֹהִי דְּאַבְרָהָם:", "onk_en": "And when He finished speaking with him, [<i>the Glory of<\/i>] Elohim ascended from Avraham.", "pj": "וּפְסִיק מִלְמַלָלָא עִמֵיהּ וְאִסְתַּלֵק יְקָרָא דַיְיָ מֵעִלוֹי אַבְרָהָם", "pj_en": "And He ceased speaking with him; and the Glory of the Lord ascended from Abraham.", "tj": "", "tj_en": "", "rashi": "<b>מעל אברהם.<\/b> לְשׁוֹן נְקִיָּה הוּא כְּלַפֵּי שְׁכִינָה, וְלָמַדְנוּ שֶׁהַצַּדִּיקִים מֶרְכַּבְתּוֹ שֶׁל מָקוֹם (בראשית רבה):", "rashi_en": "מעל אברהם [GOD WENT UP] FROM ABRAHAM — This is a more fitting expression to use of God, and we learn from it that the righteous are the Chariot of the Omnipresent God (Genesis Rabbah 47:6). "}, {"ch": 17, "v": 23, "aliyah": 7, "heb": "וַיִּקַּ֨ח אַבְרָהָ֜ם אֶת־יִשְׁמָעֵ֣אל בְּנ֗וֹ וְאֵ֨ת כׇּל־יְלִידֵ֤י בֵיתוֹ֙ וְאֵת֙ כׇּל־מִקְנַ֣ת כַּסְפּ֔וֹ כׇּל־זָכָ֕ר בְּאַנְשֵׁ֖י בֵּ֣ית אַבְרָהָ֑ם וַיָּ֜מׇל אֶת־בְּשַׂ֣ר עׇרְלָתָ֗ם בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה כַּאֲשֶׁ֛ר דִּבֶּ֥ר אִתּ֖וֹ אֱלֹהִֽים׃", "onk": "וּדְבַר אַבְרָהָם יָת יִשְׁמָעֵאל בְּרֵיהּ וְיָת כָּל יְלִידֵי בֵיתֵיהּ וְיָת כָּל זְבִינֵי כַסְפֵּיהּ כָּל דְּכוּרָא בַּאֲנָשֵׁי בֵּית אַבְרָהָם וּגְזַר יָת בִּשְׂרָא דְעָרְלָתְהוֹן בִּכְרַן יוֹמָא הָדֵין כְּמָא דִּי מַלִּיל עִמֵּיהּ יְיָ:", "onk_en": "Avraham took his son, Yishmael, and all those that were born in his household, and all that he had bought with his money, every male member of Avraham’s household, and he circumcised the flesh of their foreskin on that very day as Elohim had said to him.", "pj": "וּדְבַר אַבְרָהָם יַת יִשְׁמָעֵאל בְּרֵיהּ וְיַת כָּל מַרְבְּיָינֵי בֵיתֵיהּ וְיַת כָּל זְבִינֵי כַּסְפֵּיהּ כָּל דְכוּרָא בְּאֵינָשָׁא בֵּיתָא דְאַבְרָהָם וּגְזַר יַת בִּשְרָא דְעוּרְלַתְהוֹן בִּכְרַן יוֹמָא הָדֵין כְּמָה דְמַלֵיל עִמֵיהּ יְיָ", "pj_en": "And Abraham took Ishmael his son, and all brought up in his house, and all bought with money, every male among the household people of Abraham, and he circumcised the flesh of their foreskin in the same day in which the Lord spake with him.", "tj": "", "tj_en": "", "rashi": "<b>בעצם היום.<\/b> בּוֹ בַּיּוֹם שֶׁנִּצְטַוָּה, בַּיּוֹם וְלֹא בַּלַּיְלָה; לֹא נִתְיָרֵא לֹא מִן הַגּוֹיִם וְלֹא מִן הַלֵּצָנִים, וְשֶׁלֹּא יִהְיוּ אוֹיְבָיו וּבְנֵי דּוֹרוֹ אוֹמְרִים אִלּוּ רְאִינוּהוּ לֹא הִנַּחְנוּהוּ לָמוּל וּלְקַיֵּם מִצְוָתוֹ שֶׁל מָקוֹם:<br><br><b>וימל.<\/b> לְשׁוֹן וַיִּפְעַל:", "rashi_en": "בעצם היום IN THE SELFSAME DAY — on the very day when he received the command of circumcision: by day and not by night — he was afraid neither of the heathens nor of the cynics. And he did it in broad daylight in order that his enemies and other people should not say, “If we had seen him we would never have allowed him to practise circumcision and carry out the commandment of the Omnipresent (Genesis Rabbah 47:9).<br><br>וימל AND HE CURCUMCISED — This is a Kal form (active). "}, {"ch": 17, "v": 24, "aliyah": 7, "heb": "וְאַ֨בְרָהָ֔ם בֶּן־תִּשְׁעִ֥ים וָתֵ֖שַׁע שָׁנָ֑ה בְּהִמֹּל֖וֹ בְּשַׂ֥ר עׇרְלָתֽוֹ׃", "onk": "וְאַבְרָהָם בַּר תִּשְׁעִין וּתְשַׁע שְׁנִין כַּד גְּזַר בִּשְׂרָא דְעָרְלְתֵיהּ:", "onk_en": "Avraham was ninety-nine years old when he was circumcised in the flesh of his foreskin.", "pj": "וְאַבְרָהָם בַּר תִּשְׁעִין וְתֵשַׁע שְׁנִין כַּד גְזַר בִּשְרָא דְעוּרְלָתֵיהּ", "pj_en": "And Abraham was the son of ninety and nine years when he circumcised the flesh of his foreskin.", "tj": "", "tj_en": "", "rashi": "<b>בהמולו.<\/b> בְּהִפָּעֲלוֹ, כְּמוֹ בְּהִבָּרְאָם (בראשית ב'):", "rashi_en": "בהמלו WHEN HE WAS CIRCUMCISED — a Niphal form (passive), like (Genesis 2:4) בהבראם “when they were created”."}, {"ch": 17, "v": 25, "aliyah": 7, "heb": "וְיִשְׁמָעֵ֣אל בְּנ֔וֹ בֶּן־שְׁלֹ֥שׁ עֶשְׂרֵ֖ה שָׁנָ֑ה בְּהִ֨מֹּל֔וֹ אֵ֖ת בְּשַׂ֥ר עׇרְלָתֽוֹ׃", "onk": "וְיִשְׁמָעֵאל בְּרֵיהּ בַּר תְּלָת עַשְׂרֵי שְׁנִין כַּד גְּזַר יָת בִּשְׂרָא דְעָרְלְתֵיהּ:", "onk_en": "And his son Yishmael was thirteen years old when he circumcised the flesh of his foreskin.", "pj": "וְיִשְׁמָעֵאל בְּרֵיהּ בַּר תְּלַת עַשְרֵי שְׁנִין כַּד גְזַר יַת בִּשְרָא דְעוּרְלָתֵיהּ", "pj_en": "And Ishmael his son was thirteen years old when he circumcised the foreskin of his flesh.", "tj": "", "tj_en": "", "rashi": "<b>בהמולו את בשר ערלתו.<\/b> בְּאַבְרָהָם לֹא נֶאֱמַר \"אֵת\", לְפִי שֶׁלֹּא הָיָה חָסֵר אֶלָּא חִתּוּךְ בָּשָׂר, שֶׁכְּבָר נִתְמָעֵךְ עַל יְדֵי תַשְׁמִישׁ; אֲבָל יִשְׁמָעֵאל שֶׁהָיָה יֶלֶד, הֻזְקַק לַחְתֹּךְ עָרְלָה וְלִפְרֹעַ הַמִּילָה, לְכָךְ נֶאֱמַר בּוֹ \"אֵת\" (בראשית רבה):", "rashi_en": "בהמולו את בשר ערלתו WHEN HE HAD THE FLESH OF HIS FORESKIN CIRCUMCISED — With Avraham, [the word], <i>et<\/i> is not stated [as it is here with Yishmael], because the only thing he was missing was the cutting of the flesh, as [his foreskin] was already flattened through sexual relations. But Yishmael - who was only a child - was required to cut his foreskin and open [and push back] the circumcision. Hence about him, <i>et<\/i> is stated. (Genesis Rabbah 47:8)"}, {"ch": 17, "v": 26, "aliyah": 7, "heb": "בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה נִמּ֖וֹל אַבְרָהָ֑ם וְיִשְׁמָעֵ֖אל בְּנֽוֹ׃", "onk": "בִּכְרַן יוֹמָא הָדֵין אִתְגְּזַר (<small>נ\"י<\/small> גְּזַר) אַבְרָהָם וְיִשְׁמָעֵאל בְּרֵיהּ:", "onk_en": "On that very day Avraham and his son Yishmael were circumcised.", "pj": "בִּכְרַן יוֹמָא הָדֵין בְּאַרְבְּעַת עֲשַר שְׁנִין גְזַר אַבְרָהָם וְיִשְׁמָעֵאל בְּרֵיהּ", "pj_en": "In the same day, in the fourteenth year, was Abraham circumcised, and Ishmael his son.", "tj": "", "tj_en": "", "rashi": "<b>בעצם היום הזה.<\/b> שֶׁמָּלְאוּ לְאַבְרָהָם צ\"ט שָׁנָה וּלְיִשְׁמָעֵאל י\"ג שָׁנִים <b>נמול אברהם וישמעאל בנו<\/b>:", "rashi_en": "בעצם היום הזה ON THE SELFSAME DAY when Abraham completed his ninety-ninth year and Ishmael his thirteenth year נמול אברהם וישמעאל בנו WAS ABRAHAM CIRCUMCISED AND ISHMAEL HIS SON."}, {"ch": 17, "v": 27, "aliyah": 7, "heb": "וְכׇל־אַנְשֵׁ֤י בֵיתוֹ֙ יְלִ֣יד בָּ֔יִת וּמִקְנַת־כֶּ֖סֶף מֵאֵ֣ת בֶּן־נֵכָ֑ר נִמֹּ֖לוּ אִתּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְכָל אֱנָשֵׁי בֵיתֵיהּ יְלִידֵי בֵיתָא וּזְבִינֵי כַסְפָּא מִן בַּר עַמְמִין אִתְגְּזָרוּ (<small>נ\"י<\/small> גְּזָרוּ) עִמֵּיהּ:", "onk_en": "All the men of his household, those born in his household, and bought with money from a stranger, were circumcised with him.", "pj": "וְכָל אִנְשֵׁי בֵיתֵהּ מַרְבְּיָינֵי בֵּיתָא וּזְבִינֵי כַּסְפָּא מִן בַּר עַמְמִין אִתְגְזָרוּ עִמֵיהּ", "pj_en": "And every man of his house, the house-trained, and the purchased with money of the sons of the people, was circumcised with him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
