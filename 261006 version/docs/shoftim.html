 "pj_en": "Thus shall you do to all cities that are remote from you, which are not of the cities of these seven nations;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 16, "aliyah": 7, "heb": "רַ֗ק מֵעָרֵ֤י הָֽעַמִּים֙ הָאֵ֔לֶּה אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כׇּל־נְשָׁמָֽה׃", "onk": "לְחוֹד מִקִּרְוֵי עַמְמַיָּא הָאִלֵּין דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא לָא תְקַיַּם כָּל נִשְׁמָתָא:", "onk_en": "However, from the cities of these peoples that Adonoy, your God, is giving you as inheritance, you are not to leave any person alive.", "pj": "לְחוֹד מִקִּרְוֵי עַמְמַיָא הָאִילֵן דַּיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן אַחֲסָנָא לָא תְקַיְימוּן כָּל נִשְׁמָא", "pj_en": "but of the cities of these peoples, which the Lord your God giveth you to inherit, ye shall not spare alive any breathing thing:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 17, "aliyah": 7, "heb": "כִּֽי־הַחֲרֵ֣ם תַּחֲרִימֵ֗ם הַחִתִּ֤י וְהָאֱמֹרִי֙ הַכְּנַעֲנִ֣י וְהַפְּרִזִּ֔י הַחִוִּ֖י וְהַיְבוּסִ֑י כַּאֲשֶׁ֥ר צִוְּךָ֖ יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "אֲרֵי גַמָּרָא תְגַמְּרִנּוּן חִתָּאֵי וֶאֱמֹרָאֵי כְּנַעֲנָאֵי וּפְרִזָּאֵי חִוָּאֵי וִיבוּסָאֵי כְּמָא דִי פַקְּדָךְ יְיָ אֱלָהָךְ:", "onk_en": "Rather annihilate are you to annihilate them: the Chittites and the Emorites, the Canaanites and the Perizites, the Chivites and the Yevusites; as Adonoy, your God, commanded you.", "pj": "אֲרוּם גַּמְרָא תְגַמְרִינוּן חִתָּאֵי וֶאֱמוֹרָאֵי כְּנַעֲנָאֵי וּפְרִיזָאֵי וְחִיוָואֵי וִיבוּסָאֵי הֵיכְמָא דְפַקֵּידְכוֹן יְיָ אֱלָהָכוֹן", "pj_en": "for destroying ye shall destroy them, Hittites, Amorites, Kenaanites, Pherizites, Hivites, and Jebusites, as the Lord your God hath commanded you;", "tj": "", "tj_en": "", "rashi": "<b>כאשר צוך.<\/b> לְרַבּוֹת אֶת הַגִּרְגָּשִׁי (שם):", "rashi_en": "כאשר צוך [BUT THOU SHALT DOOM THEM TO DESTRUCTION: THE HITTITES, … AND THE JEBUSITES,] AS [THE LORD THY GOD] HATH COMMANDED THEE — The words: “as God hath commanded thee” are intended to include the Girgashites (the seventh nation that is not mentioned here) (Sifrei Devarim 201:4)."}, {"ch": 20, "v": 18, "aliyah": 7, "heb": "לְמַ֗עַן אֲשֶׁ֨ר לֹֽא־יְלַמְּד֤וּ אֶתְכֶם֙ לַעֲשׂ֔וֹת כְּכֹל֙ תּֽוֹעֲבֹתָ֔ם אֲשֶׁ֥ר עָשׂ֖וּ לֵאלֹֽהֵיהֶ֑ם וַחֲטָאתֶ֖ם לַיהֹוָ֥ה אֱלֹהֵיכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּדִיל דִּי לָא יַלְּפוּן יָתְכוֹן לְמֶעְבַּד כְּכָל תּוֹעֲבָתְהוֹן דִּי עֲבָדוּ <b>לְטַעֲוָתְהוֹן<\/b> וּתְחוֹבוּן <b>קֳדָם<\/b> יְיָ אֱלָהֲכוֹן:", "onk_en": "In order that they do not teach you to do any of their abominations that they did for their gods [<b>idols<\/b>], and you will sin to [<b>before<\/b>] Adonoy, your God.", "pj": "מִן בִּגְלַל דְּלָא יַלְפוּן יַתְכוֹן לְמֶעֱבַד כְּכָל מְרַחֲקַתְהוֹן דְּעָבָדוּ לְטַעֲוַותְהוֹן וּתְחוֹבוּן קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "that they may not teach you to do after their abominations with which they have served their idols, and you sin before the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>למען אשר לא ילמדו.<\/b> הָא אִם עָשׂוּ תְשׁוּבָה וּמִתְגַיְּרִין אַתָּה רַשַּׁאי לְקַבְּלָם (שם):", "rashi_en": "למען אשר לא ילמדו [BUT THOU SHALT DOOM THEM TO DESTRUCTION …] THAT THEY TEACH YOU NOT TO DO [AFTER THEIR ABOMINATIONS] — Consequently if they repent of their abominations and wish to become proselytes you are allowed to accept them as such (Sifrei Devarim 202:1)."}, {"ch": 20, "v": 19, "aliyah": 7, "heb": "כִּֽי־תָצ֣וּר אֶל־עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽהִלָּחֵ֧ם עָלֶ֣יהָ לְתׇפְשָׂ֗הּ לֹֽא־תַשְׁחִ֤ית אֶת־עֵצָהּ֙ לִנְדֹּ֤חַ עָלָיו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣נּוּ תֹאכֵ֔ל וְאֹת֖וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽאָדָם֙ עֵ֣ץ הַשָּׂדֶ֔ה לָבֹ֥א מִפָּנֶ֖יךָ בַּמָּצֽוֹר׃", "onk": "אֲרֵי תְצוּר לְקַרְתָּא יוֹמִין סַגִּיאִין לַאֲגָחָא עֲלַהּ לְמִכְבְּשַׁהּ לָא תְחַבַּל יָת אִילָנַהּ לַאֲרָמָא עֲלוֹהִי גַּרְזְנָא אֲרֵי מִנֵּיהּ תֵּיכוּל וְיָתֵיהּ לָא תְקוּץ אֲרֵי <b>לָא<\/b> כַאֲנָשָׁא אִילַן חַקְלָא לְמֵיעַל מִקֳּדָמָךְ בִּצְיָרָא:", "onk_en": "If you besiege a city many days to wage war against it, to capture it, do not harm [any of] its trees by chopping it with an ax, because you eat from it you are not to cut it down; For, is [<b>not<\/b>] the tree in the field a man to join the besieged to escape you?", "pj": "אֲרוּם תַּקְפוּן עַל קַרְתָּא כָּל יוֹמֵי שִׁבְעֲתָא לְאַגָּחָא קְרָבָא עֲלָהּ לְמִכְבְּשָׁהּ בְּשַׁבַּתָּא לָא תְחַבְּלוּן יַת אִילָנַיָהָא לְמֵישְׁדָא עֲלוֹי מָן דְּפַרְזְלָא אֲרוּם מִפֵּירוֹי תֵיכְלוּן וְיָתֵיהּ לָא תְקוּצוּן אֲרוּם לָא בְּבַר נַשׁ אִילָן דְּאַנְפֵּי בָרָא לִמְטַמְרָא מִקָּמֵיכוֹן בִּצְיָירָא", "pj_en": "When you beleaguer a city all the seven days to war against it, to subdue it on the Sabbath, you shall not destroy the trees thereof by bringing against them (an instrument of) iron; that you may eat its fruit, cut it not down; for a tree on the face of the field is not as a man to be hidden (put out of sight) before you in the siege.", "tj": "", "tj_en": "", "rashi": "<b>ימים.<\/b> שְׁנַיִם:<br><br><b>רבים.<\/b> שְׁלוֹשָׁה, מִכָּאן אָמְרוּ אֵין צָרִין עַל עַיָּרוֹת שֶׁל גּוֹיִם פָּחוֹת מִשְּׁלוֹשָׁה יָמִים קֹדֶם לַשַּׁבָּת, וְלִמֵּד שֶׁפּוֹתֵחַ בְּשָׁלוֹם שְׁנַיִם אוֹ שְׁלוֹשָׁה יָמִים, וְכֵן הוּא אוֹמֵר (שמואל ב א') וַיֵּשֶׁב דָּוִד בְּצִקְלָג יָמִים שְׁנָיִם (ספרי); וּבְמִלְחֶמֶת הָרְשׁוּת הַכָּתוּב מְדַבֵּר:<br><br><b>כי האדם עץ השדה.<\/b> הֲרֵי כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן דִּלְמָא, שֶׁמָּא הָאָדָם עֵץ הַשָּׂדֶה לְהִכָּנֵס בְּתוֹךְ הַמָּצוֹר מִפָּנֶיךָ לְהִתְיַסֵּר בְּיִסּוּרֵי רָעָב וְצָמָא כְּאַנְשֵׁי הָעִיר? לָמָּה תַּשְׁחִיתֶנּוּ?:", "rashi_en": "ימים [WHEN THOU SHALT BESIEGE A CITY] ימים DAYS — The plural implies at least two days,<br><br>רבים MANY must imply at least three days (cf. Rashi on Leviticus 15:25). From here they (the Rabbis) derived the law that the siege of a heathen city must not be commenced less than three days before the Sabbath, and it (this verse) teaches you that the opening up (the invitation to make) peace (v. 10) must be repeated two or three days, for so it states, (II Samuel 1:1) “And David abode two days (ימים שנים) in Ziklag” (Sifrei Devarim 200:4; Shabbat 19a). And Scripture is speaking here of a war which is not obligatory upon them (Sifrei Devarim 200:1).<br><br>כי האדם עץ השדה FOR IS THE TREE OF THE FIELD A MAN [THAT IT SHOULD BE BESIEGED BY THEE]? — כי has here the meaning of “possibly”, “perhaps” (cf. Rashi on Exodus 23:5) — is the tree of the field perhaps a man who is able to withdraw within the besieged city from before you, that it should be chastised by the suffering of famine and thirst like the inhabitants of the city? Why should you destroy it?"}, {"ch": 20, "v": 20, "aliyah": 7, "heb": "רַ֞ק עֵ֣ץ אֲשֶׁר־תֵּדַ֗ע כִּֽי־לֹא־עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥וֹ תַשְׁחִ֖ית וְכָרָ֑תָּ וּבָנִ֣יתָ מָצ֗וֹר עַל־הָעִיר֙ אֲשֶׁר־הִ֨וא עֹשָׂ֧ה עִמְּךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לְחוֹד אִילָן דְּתִדַּע אֲרֵי לָא אִילַן דְּמַאֲכָל הוּא יָתֵיהּ תְּחַבַּל וּתְקוּץ וְתִבְנֵי <b>כַרְקוֹמִין<\/b> עַל קַרְתָּא דִּי הִיא עָבְדָא עִמָּךְ קְרָבָא עַד דְּתִכְבְּשַׁהּ:", "onk_en": "Only a tree that you know that it is not a fruit tree may you harm or cut down; and you will build battlements [<b>fortifications<\/b>] against the city that is waging war against you until it is conquered.", "pj": "לְחוֹד אִילָן דְּתִנְדְּעוּן אֲרוּם לָא אִילָן עֲבִיד פֵּירֵי מֵיכַל הוּא יָתֵיהּ תְּחַבְּלוּן וְתִקְטְעוּן וְתִבְנוּן קַרְקוּמִין עַל קַרְתָּא מַרְדָא דְּעַבְדָא עִמְכוֹן קְרָבָא עַד דְתִכְבְּשׁוּנָהּ", "pj_en": "But the tree that you know to be a tree not making fruit to eat, that you may destroy and cut down. And you shall raise bulwarks against the city which maketh war with you, until you have subdued it.", "tj": "", "tj_en": "", "rashi": "<b>עד רדתה.<\/b> לְשׁוֹן רִדּוּי, שֶׁתְּהֵא כְּפוּפָה לְךָ:", "rashi_en": "עד רדתה [AND THOU SHALT BUILD BULWARKS AGAINST THE CITY …] UNTIL רדתה — This (the word רדתה) means “subduing”, [and the meaning is, thou shalt besiege it until] it becomes submissive."}, {"ch": 21, "v": 1, "aliyah": 7, "heb": "כִּי־יִמָּצֵ֣א חָלָ֗ל בָּאֲדָמָה֙ אֲשֶׁר֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ נֹתֵ֤ן לְךָ֙ לְרִשְׁתָּ֔הּ נֹפֵ֖ל בַּשָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽהוּ׃", "onk": "אֲרֵי יִשְׁתְּכַח קְטִילָא בְּאַרְעָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ לְמֵירְתַהּ רָמֵי בְּחַקְלָא לָא אִתְיְדַע מַן קָטְלֵיהּ:", "onk_en": "If a corpse is found in the land that Adonoy, your God, is giving you to inherit, fallen in the field, it is not known who smote him.", "pj": "אֲרוּם יִשְׁתַּכַּח קְטִילָא בְּאַרְעָא דְלָא טָמִיעַ בְּאוּגְרָא בְּאַרְעָא דַּיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן לְמֵרְתָהּ רְמֵי וְלָא צְלוּב בְּקִיסָא בְּחַקְלָא וְלָא טָאִיף עַל אַנְפֵּי מַיָא לָא אִשְׁתְּמוֹדַע מַאן קַטְלֵיהּ", "pj_en": "If a male be found slain upon the ground, unburied, in the land which the Lord your God giveth you to inherit, lying down, and not hanged on a tree in the field, nor floating on the face of the water; and it be not known who did kill him:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 2, "aliyah": 7, "heb": "וְיָצְא֥וּ זְקֵנֶ֖יךָ וְשֹׁפְטֶ֑יךָ וּמָדְדוּ֙ אֶל־הֶ֣עָרִ֔ים אֲשֶׁ֖ר סְבִיבֹ֥ת הֶחָלָֽל׃", "onk": "וְיִפְּקוּן סָבָיךְ וְדַיָּנָיךְ וְיִמְשְׁחוּן לְקִרְוַיָּא דִּי סַחֲרָנוּת קְטִילָא:", "onk_en": "Your elders shall go out—and your judges—and measure in the direction of the cities around the corpse.", "pj": "וְיִפְקוּן מִבֵּי דִינָא רַבָּא תְּרֵין מִן חַכִּימֵיךְ וּתְלַת מִן דַּיָינָךְ וְיִמְשְׁחוּן מֵאַרְבַּע טְרִיגוֹנִין יַת קִרְוַיָא דִּי בְּחַזְרָנוֹת קְטִילָא", "pj_en": "then two of the sages shall proceed from the chief court of judgment, and three of thy judges, and shall measure to the surrounding cities which lie on the four quarters from the (spot where) the dead man (is found);", "tj": "", "tj_en": "", "rashi": "<b>ויצאו זקניך.<\/b> מְיֻחָדִים שֶׁבִּזְקֵנֶיךָ, אֵלּוּ סַנְהֶדְרֵי גְדוֹלָה (סוטה מ\"ד):<br><br><b>ומדדו.<\/b> מִמָּקוֹם שֶׁהֶחָלָל שׁוֹכֵב:<br><br><b>אל הערים אשר סביבת החלל.<\/b> לְכָל צַד וְצַד לֵידַע אֵי זוֹ קְרוֹבָה:", "rashi_en": "ויצאו זקניך THEN THE ELDERS [AND THE JUDGES] SHALL GO FORTH — i.e. the distinguished amongst thy elders, these are the Great Sanhedrin (Sotah 44b).<br><br>ומדדו AND THEY SHALL MEASURE — from the place where the corpse lies,<br><br>אל הערים אשר סביבת החלל UNTO THE CITIES WHICH ARE ROUND ABOUT HIM THAT IS SLAIN — in every direction, in order to ascertain which is the nearest."}, {"ch": 21, "v": 3, "aliyah": 7, "heb": "וְהָיָ֣ה הָעִ֔יר הַקְּרֹבָ֖ה אֶל־הֶחָלָ֑ל וְלָֽקְח֡וּ זִקְנֵי֩ הָעִ֨יר הַהִ֜וא עֶגְלַ֣ת בָּקָ֗ר אֲשֶׁ֤ר לֹֽא־עֻבַּד֙ בָּ֔הּ אֲשֶׁ֥ר לֹא־מָשְׁכָ֖ה בְּעֹֽל׃", "onk": "וּתְהֵי קַרְתָּא דִּקָרִיבָא לִקְטִילָא וְיִדְבְּרוּן סָבֵי קַרְתָּא הַהִיא עֶגְלַת תּוֹרֵי דִּי לָא אִתְפְּלַח בַּהּ דִּי לָא נְגִידַת בְּנִיר:", "onk_en": "Now, the city nearest the corpse—the elders of that city are to take a calf-heifer that has not been worked, that has not drawn [with] a yoke.", "pj": "וִיהֵי קַרְתָּא דְקָרִיבָא לְקָטִילָא מִתְחַשְׁדָא נַסְבֵי דִינָא רַבָּא מַפְטְרִין וְיִסְבוּן חַכִּימֵי סָבֵי קַרְתָּא הַהִיא עֶגְלַת בְּרַת תּוֹרִין דְּלָא עֵירוֹבִין בְּרַת שַׁתָּא דְּלָא אִתְפְּלַח בָּהּ וְלָא נַגְדַת בְּנִיר", "pj_en": "and the city which is nearest to the dead man, being the suspected one, let the chief court of justice take means for absolution (or disculpation). Let the sages, the elders of that city, take an heifer from the herd, not commixed, an heifer of the year, which hath not been wrought with nor hath drawn in the yoke:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 4, "aliyah": 7, "heb": "וְהוֹרִ֡דוּ זִקְנֵי֩ הָעִ֨יר הַהִ֤וא אֶת־הָֽעֶגְלָה֙ אֶל־נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא־יֵעָבֵ֥ד בּ֖וֹ וְלֹ֣א יִזָּרֵ֑עַ וְעָֽרְפוּ־שָׁ֥ם אֶת־הָעֶגְלָ֖ה בַּנָּֽחַל׃", "onk": "וְיֶחֱתוּן סָבֵי קַרְתָּא הַהִיא יָת עֲגַלְתָּא לְנַחֲלָא בַיָּר דִּי לָא אִתְפְּלַח בֵּיהּ וְלָא יִזְדְּרַע וְיִנְקְפוּן תַּמָּן יָת עֲגַלְתָּא בְּנַחֲלָא:", "onk_en": "The elders of that city will take down the calf to a stony valley that is not to be tilled and not to be seeded, and they shall decapitate the calf in that valley.", "pj": "וְיִחְתוּן חַכִּימֵי קַרְתָּא הַהוּא יַת עִיגְלְתָא לַחֲקַל בַּיַיר דְּלָא יִתְעֲבֵיד בֵּיהּ פּוּלְחַן אֲרַע וְלָא יִזְדְּרַע וְיִנְקְפוּן תַּמָּן יַת עֶגְלָתָא בְּקוֹפִיץ מִבַּתְרָהָא בִּמְצַע חַקְלָא", "pj_en": "and the sages of that city shall bring the heifer down into an uncultivated field, where the ground hath not been tilled by work, nor sowed; and let them there behead the heifer from behind her with an axe (or knife, dolch) in the midst of the field.", "tj": "", "tj_en": "", "rashi": "<b>אל נחל איתן.<\/b> קָשֶׁה, שֶׁלֹּא נֶעֱבַד:<br><br><b>וערפו.<\/b> קוֹצֵץ עָרְפָּהּ בְּקוֹפִיץ; אָמַר הַקָּבָּ\"ה תָּבֹא עֶגְלָה בַת שְׁנָתָהּ שֶׁלֹּא עָשְׂתָה פֵרוֹת וְתֵעָרֵף בְּמָקוֹם שֶׁאֵינוֹ עוֹשֶׂה פֵרוֹת, לְכַפֵּר עַל הֲרִיגָתוֹ שֶׁל זֶה שֶׁלֹּא הִנִּיחוּהוּ לַעֲשׂוֹת פֵּרוֹת (סוטה מ\"ו):", "rashi_en": "אל נחל איתן UNTO A VALLEY WHICH IS איתן — which is hard; i.e. one that has never been tilled (Sifrei Devarim 207:2; Sotah 45b).<br><br>וערפו AND THEY SHALL STRIKE OFF [THE HEIFER’S] NECK — i.e. one breaks its neck with a hatchet. The Holy One, blessed be He, says, as it were, Let a heifer which is only one year old and which therefore has brought forth no fruits (no offspring) have its neck broken at a spot (the untilled valley) which has not brought forth fruits, to expiate for the murder of him whom they did not permit further to beget children (Sotah 46a)."}, {"ch": 21, "v": 5, "aliyah": 7, "heb": "וְנִגְּשׁ֣וּ הַכֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗ם בָּחַ֞ר יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ לְשָׁ֣רְת֔וֹ וּלְבָרֵ֖ךְ בְּשֵׁ֣ם יְהֹוָ֑ה וְעַל־פִּיהֶ֥ם יִהְיֶ֖ה כׇּל־רִ֥יב וְכׇל־נָֽגַע׃", "onk": "וְיִתְקָרְבוּן כָּהֲנַיָּא בְּנֵי לֵוִי אֲרֵי בְהוֹן יִתִּרְעֵי יְיָ אֱלָהָךְ לְשַׁמָּשׁוּתֵיהּ וּלְבָרָכָא בִּשְׁמָא דַיְיָ וְעַל מֵימְרֵהוֹן יְהֵי כָּל <b>דִּין<\/b> וְכָל מַכְתַּשׁ סְגִירוּ:", "onk_en": "The <i>kohanim,<\/i> descendants of Levi, will approach; because them did Adonoy, your God, choose to serve Him and to bless in Adonoy’s Name; and they will decide every dispute [<b>law<\/b>] and every <i>nega.<\/i>", "pj": "וִיקַרְבוּן כַּהֲנַיָא בְּנֵי לֵוִי אֲרוּם בְּהוֹן אִתְרְעֵי מֵימְרָא דַיְיָ אֱלָהָכוֹן לְשַׁמָשׁוּתֵיהּ וּלְבָרָכָא יַת יִשְרָאֵל בִּשְׁמֵיהּ וְעַל מֵימַר פּוּמְהוֹן יְהִי מִתְדָן כָּל דִּין וְכָל מַכְתַּשׁ צוֹרְעָא לְמִסְגוֹר וּלְמַחְלוֹט", "pj_en": "And the priests the sons of Levi shall draw near; for the Lord your God hath chosen them to minister to Him, and to bless Israel in His Name, and according to their words to resolve every judgment, and in any plague of leprosy to shut up, and pronounce concerning it;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 6, "aliyah": 7, "heb": "וְכֹ֗ל זִקְנֵי֙ הָעִ֣יר הַהִ֔וא הַקְּרֹבִ֖ים אֶל־הֶחָלָ֑ל יִרְחֲצוּ֙ אֶת־יְדֵיהֶ֔ם עַל־הָעֶגְלָ֖ה הָעֲרוּפָ֥ה בַנָּֽחַל׃", "onk": "וְכֹל סָבֵי קַרְתָּא הַהִיא דִּקְרִיבִין <b>לִקְטִילָא<\/b> יַסְחוּן יָת יְדֵיהוֹן עַל עֲגַלְתָּא דִּנְקֶפְתָּא בְנַחֲלָא:", "onk_en": "And all the elders of that city, those near the corpse, will wash their hands over the calf beheaded in that valley.", "pj": "וְכָל חַכִּימֵי קַרְתָּא הַהוּא דְקָרִיבִין לְקָטִילָה יְשַׁזְגוּן יַת יְדֵיהוֹן עַל עֶגְלְתָא דִנְקִיפָא בְּחַקְלָא", "pj_en": "and all the elders of the city lying nearest to the dead man shall wash their hands over the heifer which hath been cut off in the field,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 7, "aliyah": 7, "heb": "וְעָנ֖וּ וְאָמְר֑וּ יָדֵ֗ינוּ לֹ֤א <span class=\"mam-kq\"><span class=\"mam-kq-k\">(שפכה)<\/span> <span class=\"mam-kq-q\">[שָֽׁפְכוּ֙]<\/span><\/span> אֶת־הַדָּ֣ם הַזֶּ֔ה וְעֵינֵ֖ינוּ לֹ֥א רָאֽוּ׃", "onk": "<b>וִיתִיבוּן<\/b> וְיֵימְרוּן יְדָנָא לָא אַשְׁדּוֹ יָת דְּמָא הָדֵין וְעֵינָנָא לָא חֲזָאָה:", "onk_en": "They will [<b>answer<\/b>] loudly declare, ‘‘Our hands have not spilled this blood and our eyes did not see.’’", "pj": "וִיתִיבוּן וְיֵימְרוּן גְלֵי קֳדָם יְיָ דְלָא אָתָא לִידֵינָן וּפַטְרִינֵיה מַן דְשַׁדָא יַת אִידְמָא הָדֵין וְעֵינָנָא לָא חָמוּן", "pj_en": "and shall answer and say: It is manifest before the Lord that this hath not come by our hands, nor have we absolved him who shed this blood, nor have our eyes beheld.", "tj": "וְעֵינָן לָא חֲמוֹן דְּמַן דֵּין דִּישְׁפָךְ יָתֵיהּ:", "tj_en": "Nor have our eyes seen who it is who hath shed it.", "rashi": "<b>ידינו לא שפכה.<\/b> וְכִי עָלְתָה עַל לֵב שֶׁזִּקְנֵי בֵית דִּין שׁוֹפְכֵי דָמִים הֵם? אֶלָּא לֹא רְאִינוּהוּ וּפְטַרְנוּהוּ בְּלֹא מְזוֹנוֹת וּבְלֹא לְוָיָה (סוטה מ\"ה). הַכֹּהֲנִים אוֹמְרִים <b>כפר לעמך ישראל<\/b>:", "rashi_en": "ידינו לא שפכה [AND THEY SHALL ANSWER AND SAY,] OUR HANDS HAVE NOT SHED [THIS BLOOD] — But would it enter anyone’s mind that the elders of the court are suspect of blood-shedding?! But the meaning of the declaration is: We never saw him and knowingly let him depart without food or escort (if we had seen him we would not have let him depart without these) (Sifrei Devarim 210:2; Sotah 45b). The priests thereupon say (next verse):  כפר לעמך ישראל FORGIVE UNTO THY PEOPLE ISRAEL."}, {"ch": 21, "v": 8, "aliyah": 7, "heb": "כַּפֵּר֩ לְעַמְּךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר־פָּדִ֙יתָ֙ יְהֹוָ֔ה וְאַל־תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּקֶ֖רֶב עַמְּךָ֣ יִשְׂרָאֵ֑ל וְנִכַּפֵּ֥ר לָהֶ֖ם הַדָּֽם׃", "onk": "כָּהֲנַיָּא יֵימְרוּן כַּפַּר לְעַמָּךְ יִשְׂרָאֵל דִּי פְרַקְתָּא יְיָ וְלָא תִתֵּן <b>חוֹבַת<\/b> דַּם זַכַּי בְּגוֹ עַמָּךְ יִשְׂרָאֵל וְיִתְכַּפַּר לְהוֹן עַל דְּמָא:", "onk_en": "[The <i>kohanim<\/i> will say,] ‘‘Forgive Your people Yisroel, whom You, Adonoy, have redeemed; and do not allow [<b>the responsibility of<\/b>] innocent blood [liability] within Your people Yisroel.’’ The blood shall thus be atoned for in their behalf.", "pj": "כַּהֲנַיָא יֵימְרוּן כַּפֵּר לְעַמָךְ יִשְרָאֵל דִּפְרַקְתָּא יְיָ וְלָא תְשַׁוֵי חוֹבַת אֲדַם זַכְּאַי בְּגוֹ עַמָּךְ יִשְרָאֵל וּגְלֵי מַן קַטְלֵיהּ וְיִתְכַּפֵּר לְהוֹן עַל דְּמָא וּמִן יַד נַפְקִין נְחִיל דְּמוֹרָנִין מִגוֹ פָּרָתָא דְעֶגְלְתָא נַגְדִין וְאָזְלִין עַד אַתְרָא דְקָטוֹלָא תַמָּן וְסַלְקִין עֲלוֹי וְאַחֲדִין בֵּי דִינָא יָתֵיהּ וְדַיְינִין יָתֵיהּ", "pj_en": "And the priests shall say: Let there be expiation for thy people Israel, whom Thou, O Lord, hast redeemed, and lay not the guilt of innocent blood upon Thy people Israel; but let him who hath done the murder be revealed. And they shall be expiated concerning the blood; but straightway there will come forth a swarm of worms from the excrement of the heifer, and spread abroad, and move to. the place where the murderer is, and crawl over him: and the magistrates shall take him, and judge him.", "tj": "", "tj_en": "", "rashi": "<b>ונכפר להם הדם.<\/b> הַכָּתוּב מְבַשְּׂרָם, שֶׁמִּשֶּׁעָשׂוּ כֵן יְכֻפַּר לָהֶם הֶעָוֹן (שם):", "rashi_en": "ונכפר להם הדם AND THE BLOOD SHALL BE PARDONED THEM — Scripture announces to them that when they have done this (the ceremony prescribed) their sin will be forgiven (Sotah 46a)."}, {"ch": 21, "v": 9, "aliyah": 7, "heb": "וְאַתָּ֗ה תְּבַעֵ֛ר הַדָּ֥ם הַנָּקִ֖י מִקִּרְבֶּ֑ךָ כִּֽי־תַעֲשֶׂ֥ה הַיָּשָׁ֖ר בְּעֵינֵ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַתְּ תְּפַלֵּי <b>אַשְׁדִּי<\/b> דַם זַכַּי מִבֵּינָךְ אֲרֵי תַעְבֵּד <b>דְּכָשָׁר<\/b> קֳדָם יְיָ:", "onk_en": "Still, you must eradicate the [liability for] [<b>shedding<\/b>] innocent blood from within you, when you do what is upright [<b>proper<\/b>] in Adonoy’s eyes.", "pj": "וְאַתּוּן בֵּית יִשְרָאֵל תְּפַלוּן מִשְׁדֵי דַם זַכַּאי מִבֵּינֵיכוֹן אֲרוּם תַּעַבְדוּן דְכָשַׁר קֳדָם יְיָ", "pj_en": "So shall you, O house of Israel, put away from among you whosoever sheddeth innocent blood, that you may do what is right before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ואתה תבער.<\/b> מַגִּיד שֶׁאִם נִמְצָא הַהוֹרֵג אַחַר שֶׁנִּתְעָרְפָה הָעֶגְלָה הֲרֵי זֶה יֵהָרֵג וְהוּא <b>הישר בעיני ה'<\/b> (סוטה מ\"ז; כתובות ל\"ז):", "rashi_en": "ואתה תבער BUT THOU SHALT PUT AWAY [THE GUILT OF INNOCENT BLOOD FROM AMONG YOU] — This teaches that if the murderer is found after the heifer’s neck was broken he must nevertheless be put to death, — and this is what Scripture describes as הישר בעיני ה׳ RIGHT IN THE EYES OF THE LORD (cf. Sotah 47b; Ketubot 37b and Tosafot on Ketubot 37b:16.1 ואח\"כ נמצא ההורג)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
