ן גְּבַר לְזַרְעֲיַתְהוֹן עַל בֵּית אֲבָהָתוֹהִי:", "onk_en": "Bnei Yisroel did all which Adonoy commanded Moshe, so they camped according to their [various] banners and so they traveled, each man with his family according to his fathers’ house.", "pj": "וַעֲבָדוּ בְנֵי יִשְרָאֵל כְּכָל מַה דְפַקֵיד יְיָ יַת משֶׁה הֵיכְדֵין שָׁרָן לְטִיקְסֵיהוֹן וְהֵיכְדֵין נַטְלִין גְבַר לְזַרְעִיתֵיהּ לְבֵית אֲבָהָתוֹי", "pj_en": "And the sons of Israel did according to all that the Lord commanded Mosheh; so did they encamp by their standards, and so went they forward, every man with his family by the house of his fathers.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 1, "aliyah": 4, "heb": "וְאֵ֛לֶּה תּוֹלְדֹ֥ת אַהֲרֹ֖ן וּמֹשֶׁ֑ה בְּי֗וֹם דִּבֶּ֧ר יְהֹוָ֛ה אֶת־מֹשֶׁ֖ה בְּהַ֥ר סִינָֽי׃", "onk": "וְאִלֵּין תּוּלְדַת אַהֲרֹן וּמשֶׁה בְּיוֹמָא דְּמַלִּיל יְיָ עִם משֶׁה בְּטוּרָא דְסִינָי:", "onk_en": "These are the descendants of Aharon and Moshe on the day that Adonoy spoke to Moshe on Mount Sinai.", "pj": "וְאִלֵין יִחוּסֵי אַהֲרן וּמשֶׁה דְאִתְיְחָסוּ בְּיוֹמָא דְמַלֵיל יְיָ עִם משֶׁה בְּטוּרָא דְסִינָי", "pj_en": "These are the generations of Aharon and Mosheb, who were genealogized in the day that the Lord spake with Mosheh in the mountain of Sinai.", "tj": "", "tj_en": "", "rashi": "<b>ואלה תולדת אהרן ומשה.<\/b> וְאֵינוֹ מַזְכִּיר אֶלָּא בְנֵי אַהֲרֹן וְנִקְרְאוּ תוֹלְדוֹת מֹשֶׁה, לְפִי שֶׁלִּמְּדָן תּוֹרָה, מְלַמֵּד שֶׁכָּל הַמְלַמֵּד אֶת בֶּן חֲבֵרוֹ תּוֹרָה מַעֲלֶה עָלָיו הַכָּתוּב כְּאִלּוּ יְלָדוֹ (סנהדרין י\"ט):<br><br><b>ביום דבר ה' את משה.<\/b> נַעֲשׂוּ אֵלּוּ הַתּוֹלָדוֹת שֶׁלּוֹ, שֶׁלִּמְּדָן מַה שֶּׁלָּמַד מִפִּי הַגְּבוּרָה:", "rashi_en": "ואלה תולדת אהרן ומשה AND THESE ARE THE OFFSPRING OF AARON AND MOSES — But it mentions only the sons of Aaron! But they also are called the sons of Moses because he taught them the Torah. This tells us that whoever teaches the Torah to the son of his fellow man Scripture regards it to him as though he had begotten him (Sanhedrin 19b).<br><br>ביום דבר ה׳ את משה IN THE DAY THAT THE LORD SPAKE TO MOSES did these children (these of Aaron) become his (Moses’) children, because then for the first time he taught them what he heard from the Almighty."}, {"ch": 3, "v": 2, "aliyah": 4, "heb": "וְאֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי־אַהֲרֹ֖ן הַבְּכֹ֣ר&thinsp;<small>׀<\/small>&thinsp;נָדָ֑ב וַאֲבִיה֕וּא אֶלְעָזָ֖ר וְאִיתָמָֽר׃", "onk": "וְאִלֵּין שְׁמָהַת בְּנֵי אַהֲרֹן בּוּכְרָא נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר:", "onk_en": "These are the names of Aharon’s sons; the firstborn, Nadav, and Avihu, Elazar and Isamar.", "pj": "וְאִלֵין שְׁמָהַת בְּנֵי אַהֲרן בּוּכְרָא נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 3, "aliyah": 4, "heb": "אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַכֹּהֲנִ֖ים הַמְּשֻׁחִ֑ים אֲשֶׁר־מִלֵּ֥א יָדָ֖ם לְכַהֵֽן׃", "onk": "אִלֵּין שְׁמָהַת בְּנֵי אַהֲרֹן כָּהֲנַיָּא דְּאִתְרַבִּיאוּ דִּי אִתְקָרַב קֻרְבַּנְהוֹן לְשַׁמָּשָׁא:", "onk_en": "These are the names of Aharon’s sons, the anointed <i>kohanim,<\/i> whose hands are occupied with bringing offerings, to serve [God].", "pj": "וְאִלֵין שְׁמָהַת בְּנֵי אַהֲרן כַּהֲנַיָא תַּלְמִידַיָא דְמשֶׁה רַבְּהוֹן דְיִשְרָאֵל וְאִתְקַרְיָן עַל שְׁמֵיהּ בְּיוֹמָא דְאִיתְרַבִּיאוּ מְטוּל דְאִיתְקָרֵיב קָרְבָּנֵיהוֹן לְשַׁמָשָׁא", "pj_en": "And these are the names of the Beni Aharon the priests, the disciples of Moses, the Rabbi of Israel; and they were called by his name in the day that they were anointed to minister in offering their oblations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 4, "aliyah": 4, "heb": "וַיָּ֣מׇת נָדָ֣ב וַאֲבִיה֣וּא לִפְנֵ֣י יְהֹוָ֡ה בְּֽהַקְרִבָם֩ אֵ֨שׁ זָרָ֜ה לִפְנֵ֤י יְהֹוָה֙ בְּמִדְבַּ֣ר סִינַ֔י וּבָנִ֖ים לֹא־הָי֣וּ לָהֶ֑ם וַיְכַהֵ֤ן אֶלְעָזָר֙ וְאִ֣יתָמָ֔ר עַל־פְּנֵ֖י אַהֲרֹ֥ן אֲבִיהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמִית נָדָב וַאֲבִיהוּא קֳדָם יְיָ בְּקָרוֹבֵיהוֹן אֶשָּׁתָא נוּכְרֵיתָא קֳדָם יְיָ בְּמַדְבְּרָא דְסִינַי וּבְנִין לָא הֲווֹ לְהוֹן וְשַׁמֵּשׁ אֶלְעָזָר וְאִיתָמָר עַל אַפֵּי אַהֲרֹן אֲבוּהוֹן:", "onk_en": "Nadav and Avihu died in the presence of Adonoy, when they offered a strange fire-offering before Adonoy, in the Sinai desert, and they had no sons. [However] Elazar and Isamar served in the presence of their father Aharon.", "pj": "וּמִית נָדָב וַאֲבִיהוּא קֳדָם יְיָ בְאֵישָׁתָא מְצַלְהֲבָא בִּזְמַן קְרוֹבֵיהוֹן אֵישָׁתָא נוּכְרֵיתָא מִן חַפְיָן וּבְנִין לָא הֲווֹ לְהוֹן וְשַׁמֵשׁ אֶלְעָזָר וְאִיתָמָר עַל אַפֵּי אַהֲרן אֲבוּהוֹן", "pj_en": "But Nadab and Abihu died by the flaming fire at the time of their offering the strange fire from their own tents; and they had no children. And Elazar and Ithamar ministered before Aharon their father.", "tj": "", "tj_en": "", "rashi": "<b>על פני אהרן.<\/b> בְּחַיָּיו:", "rashi_en": "על פני אהרן [AND ELEAZAR AND ITHAMAR MINISTERED] BEFORE THE FACE OF AARON — i.e. during his lifetime (cf. Rashi on Genesis 11:28)."}, {"ch": 3, "v": 5, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 6, "aliyah": 4, "heb": "הַקְרֵב֙ אֶת־מַטֵּ֣ה לֵוִ֔י וְהַעֲמַדְתָּ֣ אֹת֔וֹ לִפְנֵ֖י אַהֲרֹ֣ן הַכֹּהֵ֑ן וְשֵׁרְת֖וּ אֹתֽוֹ׃", "onk": "קָרֵב יָת שִׁבְטָא דְלֵוִי וּתְקֵים יָתֵיהּ קֳדָם אַהֲרֹן כַּהֲנָא וִישַׁמְּשׁוּן יָתֵיהּ:", "onk_en": "Bring the tribe of Levi near and have it stand before Aharon the <i>kohein,<\/i> and they shall serve him.", "pj": "קְרַב יַת שִׁבְטָא דְלֵוִי וּתְקֵים יָתֵיהּ קֳדָם אַהֲרן כַּהֲנָא וִישַׁמְשׁוּן יָתֵיהּ", "pj_en": "Bring the tribe of Levi near, and appoint them before Aharon the priest to minister with him, (or, to do him service;)", "tj": "", "tj_en": "", "rashi": "<b>ושרתו אתו.<\/b> וּמַהוּ הַשֵּׁרוּת?<br><br><b>ושמרו את משמרתו.<\/b> לְפִי שֶׁשְּׁמִירַת הַמִּקְדָּשׁ עָלָיו שֶׁלֹּא יִקְרַב זָר, כְּמוֹ שֶׁנֶּאֱמַר \"אַתָּה וּבָנֶיךָ וּבֵית אָבִיךָ אִתָּךְ תִּשְׂאוּ אֶת עֲוֹן הַמִּקְדָּשׁ\" (במדבר י\"ח), וְהַלְוִיִּם הַלָּלוּ מְסַיְּעִין אוֹתָם, זוֹ הִיא הַשֵּׁרוּת:", "rashi_en": "ושרתו אתו [BRING THE TRIBE OF LEVI … BEFORE AARON] THAT THEY MINISTER UNTO HIM — And wherein consists their ministering?<br><br>ושמרו את משמרתו THAT THEY SHALL KEEP HIS CHARGE — Because the care of the Sanctuary, viz., that no stranger should approach it, was committed to his charge, as it is said, (Numbers 18:1) \"Thou and thy sons, and thy father’s house with thee, shall bear the iniquity of the sanctuary”, (which Rashi explains to have reference to the iniquity committed by a “stranger” in approaching the holy things), and these Levites aided them — this therefore, was their ministering [alluded to here]."}, {"ch": 3, "v": 7, "aliyah": 4, "heb": "וְשָׁמְר֣וּ אֶת־מִשְׁמַרְתּ֗וֹ וְאֶת־מִשְׁמֶ֙רֶת֙ כׇּל־הָ֣עֵדָ֔ה לִפְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַעֲבֹ֖ד אֶת־עֲבֹדַ֥ת הַמִּשְׁכָּֽן׃", "onk": "וְיִטְּרוּן יָת מַטַּרְתֵּיהּ וְיָת מַטְּרַת כָּל כְּנִשְׁתָּא קֳדָם מַשְׁכַּן זִמְנָא לְמִפְלַח יָת פָּלְחַן מַשְׁכְּנָא:", "onk_en": "They shall take care to preserve his guardianship and the guardianship of the entire congregation before the Tent of Meeting, to serve in the service of the <i>Mishkon.<\/i>", "pj": "וְיִתְפַּלְגוּן לְעֶשְרִין וְאַרְבַּע חוּלְקִין וְיִטְרוּן יַת מַטַרְתֵּיהּ וְיַת מַטְרַת כָּל כְּנִישְׁתָּא לִקֳדָם מַשְׁכַּן זִמְנָא לְמִפְלַח יַת פּוּלְחַן מַשְׁכְּנָא", "pj_en": "and let them be divided into twenty and four parties, and they shall keep his charge, and the charge of all the congregation before the tabernacle of ordinance, to perform the work of the tabernacle;", "tj": "", "tj_en": "", "rashi": "<b>ושמרו את משמרתו.<\/b> כָּל מִנּוּי שֶׁהָאָדָם מְמֻנֶּה עָלָיו וּמֻטָּל עָלָיו לַעֲשׂוֹתוֹ קָרוּי מִשְׁמֶרֶת בְּכָל הַמִּקְרָא וּבִלְשׁוֹן הַמִּשְׁנָה, כְּמוֹ שֶׁאָמוּר בְּבִגְתָן וָתֶרֶשׁ \"וַהֲלֹא אֵין מִשְׁמַרְתִּי וּמִשְׁמַרְתְּךָ שָׁוָה\" (מגילה י\"ג), וְכֵן מִשְׁמְרוֹת כְהֻנָּה וּלְוִיָּה:", "rashi_en": "ושמרו את משמרתו AND THEY SHALL KEEP HIS CHARGE — Any post to which a person is appointed and the duties of which he is bound to carry out is everywhere in Scripture and in the Mishnaic idiom called משמרת, an office, a charge. For example, it is stated in the story of Bigthan and Teresh that when they were conspiring against Ahasuerus one said to the other (Megillah 13b): \"But surely my official duty (משמרתי) is not the same as your official duty (משמרתך) and therefore we can never meet to put our plans into execution!\" Similar, also, is its use in the phrase ,משמרות כהונה ולויה “shifts for duty of priests and Levites”."}, {"ch": 3, "v": 8, "aliyah": 4, "heb": "וְשָׁמְר֗וּ אֶֽת־כׇּל־כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְאֶת־מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַעֲבֹ֖ד אֶת־עֲבֹדַ֥ת הַמִּשְׁכָּֽן׃", "onk": "וְיִטְּרוּן יָת כָּל מָאנֵי מַשְׁכַּן זִמְנָא וְיָת מַטְּרַת בְּנֵי יִשְׂרָאֵל לְמִפְלַח יָת פָּלְחַן מַשְׁכְּנָא:", "onk_en": "They shall guard all the utensils of the Tent of Meeting and the watch of Bnei Yisroel to serve in the service of the <i>Mishkon.<\/i>", "pj": "וְיִטְרוּן יַת כָּל מָאנֵי מַשְׁכַּן זִמְנָא וְיַת מַטְרַת בְּנֵי יִשְרָאֵל לְמִפְלַח יַת פּוּלְחַן מַשְׁכְּנָא", "pj_en": "and they shall have charge of all the vessels of the tabernacle of ordinance, and the charge of the sons of Israel to do the service of the tabernacle.", "tj": "", "tj_en": "", "rashi": "<b>ואת משמרת בני ישראל.<\/b> שֶׁכֻּלָּן הָיוּ זְקוּקִין לְצָרְכֵי הַמִּקְדָּשׁ, אֶלָּא שֶׁהַלְוִיִּם בָּאִים תַּחְתֵּיהֶם בִּשְׁלִיחוּתָם, לְפִיכָךְ לוֹקְחִים מֵהֶם הַמַּעַשְׂרוֹת בִּשְׂכָרָן, שֶׁנֶּאֱמַר \"כִּי שָׂכָר הוּא לָכֶם חֵלֶף עֲבֹדַתְכֶם\" (במדבר י\"ח):", "rashi_en": "ואת משמרת בני ישראל [AND THEY SHALL KEEP ALL THE VESSELS OF THE TENT OF MEETING] AND THE CHARGE OF THE CHILDREN OF ISRAEL — It is called “the charge of the children of Israel” because all of them (all the Israelites) were really bound to care for the needs of the Sanctuary, only that the Levites took their places as representing them. For this reason they (the Levites) received from them the tithes as a reward, as it is said, (Numbers 18:31) “for it (the tithe) is your hire in exchange for your service”."}, {"ch": 3, "v": 9, "aliyah": 4, "heb": "וְנָתַתָּה֙ אֶת־הַלְוִיִּ֔ם לְאַהֲרֹ֖ן וּלְבָנָ֑יו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֙מָּה֙ ל֔וֹ מֵאֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְתִתֵּן יָת לֵוָאֵי לְאַהֲרֹן וְלִבְנוֹהִי מְסִירִין <b>יְהִיבִין<\/b> אִנּוּן לֵיהּ מִן בְּנֵי יִשְׂרָאֵל:", "onk_en": "You shall place the Levites in the charge of Aharon and his sons; they are presented [<b>and given<\/b>] to him from [among] Bnei Yisroel.", "pj": "וְתִתֵּן יַת לֵיוָאֵי לְאַהֲרן וְלִבְנוֹי מַתָּנָה הִינוּן יְהִיבִין וּמְסִירִין לֵיהּ מִלְוַת בְּנֵי יִשְרָאֵל", "pj_en": "And I have given the Levites unto Aharon and his sons; a gift are they given and delivered to him from among the sons of Israel;", "tj": "", "tj_en": "", "rashi": "<b>נתונם המה לו.<\/b> לְעֶזְרָה:<br><br><b>מאת בני ישראל.<\/b> כְּמוֹ מִתּוֹךְ בְּנֵי יִשׂרָאֵל, כְּלוֹמַר מִשְּׁאָר כָּל הָעֵדָה נִבְדְּלוּ לְכָךְ בִּגְזֵרַת הַמָּקוֹם וְהוּא נְתָנָם לוֹ, שֶׁנֶּאֱמַר \"וָאֶתְּנָה אֶת הַלְוִיִּם נְתֻנִים\" וְגוֹ' (במדבר ח'):", "rashi_en": "נתונים המה לו THEY ARE GIVEN UNTO HIM as a help.<br><br>מאת בני ישראל has the same meaning as FROM AMONG THE MIDST OF (מתוך) THE CHILDREN OF ISRAEL, that is to say, they have been set aside from among the rest of the congregation for this purpose by a decree of the Omnipresent, and it is He who gave them (the Levites) to him, as it is said (Numbers 8:19) “And “I” have given the Levites as a gift [to Aaron]”."}, {"ch": 3, "v": 10, "aliyah": 4, "heb": "וְאֶת־אַהֲרֹ֤ן וְאֶת־בָּנָיו֙ תִּפְקֹ֔ד וְשָׁמְר֖וּ אֶת־כְּהֻנָּתָ֑ם וְהַזָּ֥ר הַקָּרֵ֖ב יוּמָֽת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת אַהֲרֹן וְיָת בְּנוֹהִי תְּמַנֵּי וְיִטְּרוּן יָת כְּהֻנַּתְהוֹן וְחִלּוֹנַי דְּיִקְרַב יִתְקְטָל:", "onk_en": "You shall appoint Aharon and his sons and they shall guard their priesthood, and an outsider (non-<i>kohein<\/i>) who comes near shall be put to death.", "pj": "וְיַת אַהֲרן וְיַת בְּנוֹי תְמַנֵי וְיִטְרוּן יַת כְּהוּנַתְהוֹן וְחִילוֹנֵי דְיִקְרַב יִתְקְטֵל בְּאֵישָׁא מְצַלְהֲבָא קֳדָם יְיָ", "pj_en": "and number thou Aharon and his sons, that they may keep their priesthood; and the stranger who cometh near shall be slain by the flame from. before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ואת אהרן ואת בניו תפקד.<\/b> לְשׁוֹן פְּקִידוּת, וְאֵינוֹ לְשׁוֹן מִנְיָן:<br><br><b>ושמרו את כהנתם.<\/b> קַבָּלַת דָּמִים וּזְרִיקָה וְהַקְטָרָה וַעֲבוֹדוֹת הַמְּסוּרוֹת לַכֹּהֲנִים:", "rashi_en": "ואת אהרן ואת בניו תפקד AND THOU SHALT CHARGE AARON AND HIS SONS — The word תפקד is an expression for “appointing” and not an expression for “counting” (although it is Kal, and usually “appointing” is expressed by the Hiphil of the verb; cf. Rashi on Numbers 1:50).<br><br>ושמרו את כהנתם AND THEY SHALL KEEP THEIR PRIESTS OFFICE — the receiving of the blood in holy vessels, the sprinkling of it, the burning of the fat and the other rites which are entrusted to the priests’ charge."}, {"ch": 3, "v": 11, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 12, "aliyah": 4, "heb": "וַאֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת־הַלְוִיִּ֗ם מִתּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כׇּל־בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִבְּנֵ֣י יִשְׂרָאֵ֑ל וְהָ֥יוּ לִ֖י הַלְוִיִּֽם׃", "onk": "וַאֲנָא הָא קָרֵבִית יָת לֵוָאֵי מִגּוֹ בְּנֵי יִשְׂרָאֵל חֲלַף כָּל בּוּכְרָא פָּתַח וַלְדָּא מִבְּנֵי יִשְׂרָאֵל וִיהוֹן <b>מְשַׁמְּשִׁין קֳדָמַי<\/b> לֵוָאֵי:", "onk_en": "Behold! I have taken the Levites from among Bnei Yisroel instead of all the firstborn who have opened the womb, among Bnei Yisroel, and [therefore] the Levites shall be Mine [<b>serve before Me<\/b>].", "pj": "וַאֲנָא הָא קָרֵיבִית יַת לֵיוָאֵי מִגוֹ בְּנֵי יִשְרָאֵל חֲלַף כָּל בּוּכְרַיָא פְּתַח וַלְדָא מִבְּנֵי יִשְרָאֵל וִיהוֹן מְשַׁמְשִׁין קֳדָמַי לֵיוָאֵי", "pj_en": "And I, behold, I have brought nigh the Levites from among the sons of Israel, instead of all the first-born who open the womb among the sons of Israel; and the Levites shall minister before Me.", "tj": "", "tj_en": "", "rashi": "<b>ואני הנה לקחתי.<\/b> וַאֲנִי מֵהֵיכָן זָכִיתִי בָהֶן <b>מתוך בני ישראל<\/b> שֶׁיִּהְיוּ יִשְׂרָאֵל שׂוֹכְרִין אוֹתָן לְשֵׁרוּת שֶׁלִּי? עַ\"יְ הַבְּכוֹרוֹת זָכִיתִי בָהֶם וּלְקַחְתִּים תְּמוּרָתָם. לְפִי שֶׁהָיְתָה הָעֲבוֹדָה בַּבְּכוֹרוֹת, וּכְשֶׁחָטְאוּ בָעֵגֶל נִפְסְלוּ, וְהַלְוִיִּם שֶׁלֹּא עָבְדוּ עֲ\"זָ נִבְחֲרוּ תַחְתֵּיהֶם (עי' זבחים קי\"ב):", "rashi_en": "ואני הנה לקחתי AND I, BEHOLD I HAVE TAKEN [THE LEVITES FROM AMONG THE CHILDREN OF ISRAEL] — This means: And I — whence do “I” claim the right on them from among the children of Israel, that the Israelites should have to hire them (cf. Rashi on v. 8) for My service? It is through the firstborn — to whom I surely have a title — that I have a claim on them (the Levites) and so I take them in their (the firstborns’) stead. For originally the service (the priestly functions) was performed by the firstborn, but when they (the Israelites and among them their firstborn too) sinned by worshipping the golden calf they became disqualified, and the Levites who had not worshipped the idol were chosen in their stead (cf. Zevachim 112b)."}, {"ch": 3, "v": 13, "aliyah": 4, "heb": "כִּ֣י לִי֮ כׇּל־בְּכוֹר֒ בְּיוֹם֩ הַכֹּתִ֨י כׇל־בְּכ֜וֹר בְּאֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤י כׇל־בְּכוֹר֙ בְּיִשְׂרָאֵ֔ל מֵאָדָ֖ם עַד־בְּהֵמָ֑ה לִ֥י יִהְי֖וּ אֲנִ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי דִילִי כָּל בּוּכְרָא בְּיוֹמָא דִקְטָלִית כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם אַקְדֵּשִׁית <b>קֳדָמַי<\/b> כָּל בּוּכְרָא בְּיִשְׂרָאֵל מֵאֱנָשָׁא עַד בְּעִירָא דִּילִי יְהוֹן אֲנָא יְיָ:", "onk_en": "For all the firstborn are Mine, since on the day I smote all the firstborn in the land of Egypt I sanctified to [<b>before<\/b>] Me all the firstborn of Bnei Yisroel from man to beast; they shall be Mine, I am Adonoy.", "pj": "אֲרוּם דִילִי כָּל בּוּכְרָא בִּבְנֵי יִשְרָאֵל בְּיוֹמָא דִקְטָלִית כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם אַקְדֵישִׁית קֳדָמַי כָּל בּוּכְרָא בְּיִשְרָאֵל מֵאֵינָשָׁא עַד בְּעִירָא דִילִי יְהוֹן אֲנָא יְיָ", "pj_en": "For every first-born among the sons of Israel is Mine, from the day when. I slew every first-born in the land of Mizraim; I have sanctified before Me every first-born in Israel; from man to animal, they are Mine: I am the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 14, "aliyah": 5, "heb": "וַיְדַבֵּ֤ר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה בְּמִדְבַּ֥ר סִינַ֖י לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בְּמַדְבְּרָא דְסִינַי לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe in the Sinai desert, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה בְּמַדְבְּרָא דְסִינַי לְמֵימָר", "pj_en": "And the Lord spake with Mosheh in the wilderness of Sinai, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 15, "aliyah": 5, "heb": "פְּקֹד֙ אֶת־בְּנֵ֣י לֵוִ֔י לְבֵ֥ית אֲבֹתָ֖ם לְמִשְׁפְּחֹתָ֑ם כׇּל־זָכָ֛ר מִבֶּן־חֹ֥דֶשׁ וָמַ֖עְלָה תִּפְקְדֵֽם׃", "onk": "מְנֵי יָת בְּנֵי לֵוִי לְבֵית אֲבָהַתְהוֹן לְזַרְעֲיַתְהוֹן כָּל דְּכוּרָא מִבַּר יַרְחָא וּלְעֵלָּא תִּמְנִנּוּן:", "onk_en": "Count the sons of Levi according to their fathers’ houses according to their families. All males from the age of one month and above, you shall count them.", "pj": "מַנֵי יַת בְּנֵי לֵוִי לְבֵית אַבְהַתְהוֹן לִגְנִיסַתְהוֹן כָּל דְכוּרָא מִבַּר יַרְחָא וּלְעֵילָא תִמְנִינוּן", "pj_en": "Number the sons of Levi according to the house of their fathers and their families; every male from a month old and upward shalt thou number them.", "tj": "", "tj_en": "", "rashi": "<b>מבן חדש ומעלה.<\/b> מִשֶּׁיָּצָא מִכְּלַל נְפָלִים הוּא נִמְנֶה לִקָּרֵא שׁוֹמֵר מִשְׁמֶרֶת הַקֹּדֶשׁ; אָ\"רַ יְהוּדָה בְּרַבִּי שָׁלוֹם לָמוּד הוּא אוֹתוֹ הַשֵּׁבֶט לִהְיוֹת נִמְנֶה מִן הַבֶּטֶן, שֶׁנֶּאֱמַר \"אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם\" (במדבר כ״ו:נ״ט), — עִם כְּנִיסָתָהּ בְּפֶתַח מִצְרַיִם יָלְדָה אוֹתָהּ וְנִמְנֵית בְּשִׁבְעִים נֶפֶשׁ, שֶׁכְּשֶׁאַתָּה מוֹנֶה חֶשְׁבּוֹנָם לֹא תִמְצָאֵם אֶלָּא שִׁבְעִים חָסֵר אֶחָד, וְהִיא הִשְׁלִימָה אֶת הַמִּנְיָן (תנחומא):", "rashi_en": "מבן חדש ומעלה [NUMBER THE CHILDREN OF LEVI … EVERY MALE] FROM A MONTH OLD AND ONWARDS — As soon as it passed the age of a non-viable child (a full month was regarded as the utmost time such a child can live) it can be counted to come under the term “keeper of the holy charge”. — R. Judah the son of R. Shalom said: It is quite the usual thing with this tribe to be included in a census from their very birth, for it is said, (Numbers XXVI 59) “[And the name of Amram’s wife was Jochebed, the daughter of Levi], whom her mother bore to Levi in Egypt” — which is explained to mean that she bore her just as she entered the gates of the border-city of Egypt and yet she is counted among the seventy souls which came down with Jacob into Egypt (cf. Genesis 46:27 and Rashi thereon), because if you count their number (as set forth in Genesis 46:8—27) you will find that they were one short of seventy, and it was she whose name is not mentioned there who made up the number seventy (cf. Midrash Tanchuma, Bamidbar 16)."}, {"ch": 3, "v": 16, "aliyah": 5, "heb": "וַיִּפְקֹ֥ד אֹתָ֛ם מֹשֶׁ֖ה עַל־פִּ֣י יְהֹוָ֑ה כַּאֲשֶׁ֖ר צֻוָּֽה׃", "onk": "וּמְנָא יָתְהוֹן משֶׁה עַל מֵימְרָא דַיְיָ כְּמָא דְּאִתְפַּקָּד:", "onk_en": "Moshe counted them according to the word of Adonoy, just as he was commanded.", "pj": "וּמְנָא יַתְהוֹן משֶׁה עַל פּוּם מֵימְרָא דַיְיָ הֵיכְמָא דְאִתְפָּקֵד", "pj_en": "Moses therefore numbered them according to the mouth of the Word of the Lord, as he had been commanded.", "tj": "", "tj_en": "", "rashi": "<b>על פי ה'.<\/b> אָמַר מֹשֶׁה לִפְנֵי הַקָּבָּ\"ה, הֵיאַךְ אֲנִי נִכְנָס לְתוֹךְ אָהֳלֵיהֶם לָדַעַת מִנְיַן יוֹנְקֵיהֶם? אָמַר לוֹ הַקָּבָּ\"ה, עֲשֵׂה אַתָּה שֶׁלְּךְ וַאֲנִי אֶעֱשֶׂה שֶׁלִּי, הָלַךְ מֹשֶׁה וְעָמַד עַל פֶּתַח הָאֹהֶל וְהַשְּׁכִינָה מַקְדֶּמֶת לְפָנָיו, וּבַת קוֹל יוֹצְאָה מִן הָאֹהֶל וְאוֹמֶרֶת כָּךְ וָכָךְ תִּינוֹקוֹת יֵשׁ בְּאֹהֶל זֶה, לְכָךְ נֶאֱמַר עַל פִּי ה':", "rashi_en": "על פי ה׳ [AND MOSES NUMBERED THEM] ACCORDING TO THE WORD OF THE LORD — Moses said to the Holy One, blessed be He, “How can I enter their tents to ascertain the number of their babes?!” Thereupon the Holy One, blessed be He, replied to him, “You do your share and I will do Mine!’ Moses accordingly went and stationed himself at the entrance of each tent, the Shechinah having gone there beforehand, and a divine voice issued from the tent, saying, “So-and-so many babes are in this tent”. It is on this account that it states, “[and Moses numbered them] according to the word (by the mouth) of the Lord” (Numbers Rabbah 3 9)."}, {"ch": 3, "v": 17, "aliyah": 5, "heb": "וַיִּֽהְיוּ־אֵ֥לֶּה בְנֵֽי־לֵוִ֖י בִּשְׁמֹתָ֑ם גֵּרְשׁ֕וֹן וּקְהָ֖ת וּמְרָרִֽי׃", "onk": "וַהֲווֹ אִלֵּין בְּנֵי לֵוִי בִּשְׁמָהַתְהוֹן גֵּרְשׁוֹן וּקְהָת וּמְרָרִי:", "onk_en": "These were sons of Levi according to their names, Gershon, Kehos and Merori.", "pj": "וַהֲווֹ אִילֵין בְּנֵי לֵוִי בִּשְׁמָהַתְהוֹן גֵרְשׁוֹן וּקְהָת וּמְרָרִי", "pj_en": "And these were the sons of Levi by their names: Gershon, Kehath, and Merari.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 18, "aliyah": 5, "heb": "וְאֵ֛לֶּה שְׁמ֥וֹת בְּֽנֵי־גֵרְשׁ֖וֹן לְמִשְׁפְּחֹתָ֑ם לִבְנִ֖י וְשִׁמְעִֽי׃", "onk": "וְאִלֵּין שְׁמָהַת בְּנֵי גֵרְשׁוֹן לְזַרְעֲיַתְהוֹן לִבְנִי וְשִׁמְעִי:", "onk_en": "These are the names of Gershon’s sons according to their families; Livni and Shim’i.", "pj": "וְאִילֵין שְׁמָהַת בְּנֵי גֵרְשׁוֹן לִגְנִיסַתְהוֹן לִבְנִי וְשִׁמְעִי", "pj_en": "And these are the names of the Beni Gershon, according to their families, Libni and Shemei.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 19, "aliyah": 5, "heb": "וּבְנֵ֥י קְהָ֖ת לְמִשְׁפְּחֹתָ֑ם עַמְרָ֣ם וְיִצְהָ֔ר חֶבְר֖וֹן וְעֻזִּיאֵֽל׃", "onk": "וּבְנֵי קְהָת לְזַרְעֲיַתְהוֹן עַמְרָם וְיִצְהָר חֶבְרוֹן וְעֻזִּיאֵל:", "onk_en": "The sons of Kehos, according to their families were; Amram, Yitzhar Chevron and Uziel.", "pj": "וּבְנוֹי דִקְהָת לִגְנִיסַתְהוֹן עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִיאֵל", "pj_en": "And the Beni Kehath by their families, Amram, Jizhar, Hebron, and Uzziel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 20, "aliyah": 5, "heb": "וּבְנֵ֧י מְרָרִ֛י לְמִשְׁפְּחֹתָ֖ם מַחְלִ֣י וּמוּשִׁ֑י אֵ֥לֶּה הֵ֛ם מִשְׁפְּחֹ֥ת הַלֵּוִ֖י לְבֵ֥ית אֲבֹתָֽם׃", "onk": "וּבְנֵי מְרָרִי לְזַרְעֲיַתְהוֹן מַחְלִי וּמוּשִׁי אִלֵּין אִנּוּן זַרְעֲיַת לֵוָאֵי לְבֵית אֲבָהַתְהוֹן:", "onk_en": "The sons of Merori, according to their families were; Machli and Mushi. These are the families of Levi according to their fathers’ houses.", "pj": "וּבְנוֹי דִמְרָרִי לִגְנִיסַתְהוֹן מַחְלִי וּמוּשִׁי אִלֵין אִינוּן גְנִיסַת לֵיוָאֵי לְבֵית אַבְהַתְהוֹן", "pj_en": "And the Beni Merari by their families, Machli, and Mushi: these are the families of the Levites after the house of their fathers.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 21, "aliyah": 5, "heb": "לְגֵ֣רְשׁ֔וֹן מִשְׁפַּ֙חַת֙ הַלִּבְנִ֔י וּמִשְׁפַּ֖חַת הַשִּׁמְעִ֑י אֵ֣לֶּה הֵ֔ם מִשְׁפְּחֹ֖ת הַגֵּרְשֻׁנִּֽי׃", "onk": "לְגֵרְשׁוֹן זַרְעִית לִבְנִי וְזַרְעִית שִׁמְעִי אִלֵּין אִנּוּן זַרְעֲיַת גֵּרְשׁוֹן:", "onk_en": "Of Gershon, the family of Livni and the family of Shim’i. These are the families of the Gershonites.", "pj": "לְגֵרְשׁוֹן גְנִיסַת לִבְנִי וּגְנִיסַת שִׁמְעִי אִילֵין הִינוּן גְנִיסַת גֵרְשׁוֹן", "pj_en": "Of Gershon, the family of Libni, and the family of Shemei; these are the families of Gershon.", "tj": "", "tj_en": "", "rashi": "<b>לגרשון משפחת הלבני.<\/b> כְּלוֹמַר, לְגֵרְשׁוֹן הָיוּ הַפְּקוּדִים מִשְׁפַּחַת הַלִּבְנִי וּמִשְׁפַּחַת הַשִּׁמְעִי — פְּקוּדֵיהֶם כָּךְ וְכָךְ:", "rashi_en": "לגרשון משפחת הלבני OF GERSHON, THE FAMILY OF THE LIBNITES — that is to say: Of Gershon, those who were numbered were the family of the Libnites and the family of the Shimites; and the section concludes with the statement (v. 22) “those who were numbered of them were so-and-so many”."}, {"ch": 3, "v": 22, "aliyah": 5, "heb": "פְּקֻדֵיהֶם֙ בְּמִסְפַּ֣ר כׇּל־זָכָ֔ר מִבֶּן־חֹ֖דֶשׁ וָמָ֑עְלָה פְּקֻ֣דֵיהֶ֔ם שִׁבְעַ֥ת אֲלָפִ֖ים וַחֲמֵ֥שׁ מֵאֽוֹת׃", "onk": "מִנְיָנֵיהוֹן בְּמִנְיַן כָּל דְּכוּרָא מִבַּר יַרְחָא וּלְעֵלָּא מִנְיָנֵיהוֹן שַׁבְעָא אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "Their numbers, in a count of every male of one month and above; their numbers are seven thousand five hundred.", "pj": "סְכוּמְהוֹן בְּמִנְיַן כָּל דְכוּרָא מִבַּר יַרְחָא וּלְעֵילָא סְכוּמְהוֹן שִׁבְעָתֵי אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "The sum of them, by the numbers of all the males from a month old and upward, seven thousand five hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 23, "aliyah": 5, "heb": "מִשְׁפְּחֹ֖ת הַגֵּרְשֻׁנִּ֑י אַחֲרֵ֧י הַמִּשְׁכָּ֛ן יַחֲנ֖וּ יָֽמָּה׃", "onk": "זַרְעֲיַת גֵּרְשׁוֹן אֲחוֹרֵי מַשְׁכְּנָא יִשְׁרוּן מַעַרְבָא:", "onk_en": "The families of the Gershonites shall camp behind the <i>Mishkon<\/i> on the west side.", "pj": "תַּרְתֵּין גְנִיסְתָּא דִי נְפָקוּ מִגֵרְשׁוֹן בָּתַר מַשְׁכְּנָא יִשְׁרוּן מַעַרְבָא", "pj_en": "The two families who spring from Gershon shall encamp after the tabernacle westward;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 24, "aliyah": 5, "heb": "וּנְשִׂ֥יא בֵֽית־אָ֖ב לַגֵּרְשֻׁנִּ֑י אֶלְיָסָ֖ף בֶּן־לָאֵֽל׃", "onk": "וְרַב בֵּית אַבָּא לְבֵית גֵּרְשׁוֹן אֶלְיָסָף בַּר לָאֵל:", "onk_en": "The leader of the household of the Gershonites is Elyasaf the son of Lael.", "pj": "וְרַב בֵּית אַבָּא דַהֲוָה מִתְמַנֵי עַל תַּרְתֵּין גְנִיסְתָּא דְגֵרְשׁוֹן אֶלְיָסָף בַּר לָאֵל", "pj_en": "and the Rab of the house of the fathers set over the two families shall be Eljasaph bar Lael.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 25, "aliyah": 5, "heb": "וּמִשְׁמֶ֤רֶת בְּנֵֽי־גֵרְשׁוֹן֙ בְּאֹ֣הֶל מוֹעֵ֔ד הַמִּשְׁכָּ֖ן וְהָאֹ֑הֶל מִכְסֵ֕הוּ וּמָסַ֕ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וּמַטְּרַת בְּנֵי גֵרְשׁוֹן בְּמַשְׁכַּן זִמְנָא מַשְׁכְּנָא וּפְרָסָא חוֹפָאֵיהּ וּפְרָסָא דִּתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "The guardianship of the sons of Gershon in the Tent of Meeting [was]; the <i>Mishkon<\/i> and the Tent, its cover and the Curtain for the entrance of the Tent of Meeting,", "pj": "וּמַטְרַת בְּנֵי גֵרְשׁוֹן בְּמַשְׁכַּן זִימְנָא מַשְׁכְּנָא וּפְרָסָא חוֹפָאָה וּפְרָסָא דְבִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And the charge of the Beni Gershon in the tabernacle of ordinance shall be the tent, and the covering that overspreadeth, and the hanging of the door of the tabernacle of ordinance,", "tj": "", "tj_en": "", "rashi": "<b>המשכן.<\/b> יְרִיעוֹת הַתַּחְתּוֹנוֹת:<br><br><b>והאהל.<\/b> יְרִיעוֹת עִזִּים הָעֲשׂוּיוֹת לְגַג:<br><br><b>מכסהו.<\/b> עוֹרוֹת אֵילִים וּתְחָשִׁים:<br><br><b>ומסך פתח.<\/b> הוּא הַוִּילוֹן:", "rashi_en": "המשכן THE DWELLING — i.e. the lower curtains (those which were spread immediately over the boards of the Tabernacle).<br><br>והאהל AND THE TENT (the word has not its usual meaning of “tent”; cf. Rashi on Exodus 26:7—12) — i.e. the curtains of goats’ hair that were made as a roofing (to cover the lower curtains).<br><br>מכסהו THE COVERING THEREOF — the covering made of rams’ skins and tachash skins (cf. Rashi on Exodus 35:11).<br><br>ומסך פתח AND THE SCREEN FOR THE ENTRANCE — i.e. the Veil (cf. Rashi on Exodus 35:12)."}, {"ch": 3, "v": 26, "aliyah": 5, "heb": "וְקַלְעֵ֣י הֶֽחָצֵ֗ר וְאֶת־מָסַךְ֙ פֶּ֣תַח הֶֽחָצֵ֔ר אֲשֶׁ֧ר עַל־הַמִּשְׁכָּ֛ן וְעַל־הַמִּזְבֵּ֖חַ סָבִ֑יב וְאֵת֙ מֵֽיתָרָ֔יו לְכֹ֖ל עֲבֹדָתֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּסְרָדֵי דְדַרְתָּא וְיָת פְּרָסָא דִּתְרַע דַּרְתָּא דִּי עַל מַשְׁכְּנָא וְעַל מַדְבְּחָא סְחוֹר סְחוֹר וְיָת אַטּוּנוֹהִי לְכֹל <b>פּוּלְחָנֵיהּ<\/b>:", "onk_en": "The hanging Curtains of the courtyard and the Curtain at the entrance of the courtyard which is around the <i>Mishkon<\/i> and Altar, and its ropes, for all of the work involving these things [<b>its service<\/b>].", "pj": "וִילַוַות דָרְתָּא וְיַת פְּרָסָא דְבִתְרַע דָרְתָּא דְעַל מַשְׁכְּנָא וְעַל מַדְבְּחָא חֲזוֹר חֲזוֹר וְיַת אֲטוֹנוֹי לְכָל פּוּלְחָנֵיהּ", "pj_en": "and the curtains of the court, and the hanging which is at the gate of the court by the tabernacle, and the altar round about, and the cords of it, for all the service thereof.", "tj": "", "tj_en": "", "rashi": "<b>ואת מיתריו.<\/b> שֶׁל הַמִשְׁכָּן וְהָאֹהֶל, וְלֹא שֶׁל חָצֵר:", "rashi_en": "ואת מיתריו AND THE CORDS OF IT — This means: those of “the dwelling” (the lower curtains) and of “the tent” (the upper curtains), and not those of the enclosure (חצר) mentioned in this verse [although some of these are stated in Numbers 4:26 to be in charge of the Gershonites]."}, {"ch": 3, "v": 27, "aliyah": 5, "heb": "וְלִקְהָ֗ת מִשְׁפַּ֤חַת הַֽעַמְרָמִי֙ וּמִשְׁפַּ֣חַת הַיִּצְהָרִ֔י וּמִשְׁפַּ֙חַת֙ הַֽחֶבְרֹנִ֔י וּמִשְׁפַּ֖חַת הָעׇזִּֽיאֵלִ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת הַקְּהָתִֽי׃", "onk": "וְלִקְהָת זַרְעִית עַמְרָם וְזַרְעִית יִצְהָר וְזַרְעִית חֶבְרוֹן וְזַרְעִית עֻזִּיאֵל אִלֵּין אִנּוּן זַרְעֲיַת קְהָת:", "onk_en": "Of Kehos, was the family of Amram, the family of Yitzhar, the family of Chevron and the family of Uziel, these are the families of the Kehosites.", "pj": "וְלִקְהָת גְנִיסְתָּא דְעַמְרָם וּגְנִיסְתָּא דְיִצְהָר וּגְנִיסְתָּא דְחֶבְרוֹן וּגְנִיסְתָּא דְעֻזִיאֵל אִלֵין הִינוּן גְנִיסַת קְהָת", "pj_en": "Of Kehath was the family of Amram, and the family of Izbar, and of Hebron, and Uzziel: these are the families of Kehath,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 28, "aliyah": 5, "heb": "בְּמִסְפַּר֙ כׇּל־זָכָ֔ר מִבֶּן־חֹ֖דֶשׁ וָמָ֑עְלָה שְׁמֹנַ֤ת אֲלָפִים֙ וְשֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַקֹּֽדֶשׁ׃", "onk": "בְּמִנְיַן כָּל דְּכוּרָא מִבַּר יַרְחָא וּלְעֵלָּא תְּמַנְיָא אַלְפִין וְשִׁית מְאָה נָטְרֵי מַטַּרְתָּא דְקוּדְשָׁא:", "onk_en": "The number of every male from one month and above is eight thousand six hundred. [They were] the guardians of the sacred vessels.", "pj": "בְּמִנְיַן כָּל דְכוּרָא מִבַּר יַרְחָא וּלְעֵילָא תְּמַנְיָא אַלְפִין וְשִׁית מְאָה נַטְרֵי מַטַרְתָּא דְקוּדְשָׁא", "pj_en": "the numbers eight thousand six hundred, keeping the charge of the sanctuary.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 29, "aliyah": 5, "heb": "מִשְׁפְּחֹ֥ת בְּנֵי־קְהָ֖ת יַחֲנ֑וּ עַ֛ל יֶ֥רֶךְ הַמִּשְׁכָּ֖ן תֵּימָֽנָה׃", "onk": "זַרְעֲיַת בְּנֵי קְהָת יִשְׁרוּן עַל צִדָּא דְמַשְׁכְּנָא דָּרוֹמָא:", "onk_en": "The families of the children of Kehos shall camp on the south side of the <i>Mishkon.<\/i>", "pj": "אַרְבַּעַת גְנִיסְתָּא דִי נְפָקוּ מִקְהָת יִשְׁרוּן עַל צִידָא דְמַשְׁכְּנָא דְרוֹמָא", "pj_en": "The four families that spring from Kehath shall encamp by the south side of the tabernacle;", "tj": "", "tj_en": "", "rashi": "<b>משפחת בני קהת יחנו … תימנה.<\/b> וּסְמוּכִין לָהֶם דֶּגֶל רְאוּבֵן הַחוֹנִים תֵּימָנָה — אוֹי לָרָשָׁע אוֹי לִשְׁכֵנוֹ, לְכָךְ לָקוּ מֵהֶם דָּתָן וַאֲבִירָם וּמָאתַיִם וַחֲמִשִּׁים אִישׁ עִם קֹרַח וַעֲדָתוֹ, שֶׁנִּמְשְׁכוּ עִמָּהֶם בְּמַחֲלָקְתָּם (תנחומא):", "rashi_en": "משפחת בני קהת יוחנו … תימנה THE FAMILY OF THE SONS OF KOHATH SHALL ENCAMP … SOUTHWARD — and next to them was the division of Reuben who, too, were encamped in the South (cf. Numbers 2:10) — “Woe to the wicked, woe to his neighbour!” It was on this account (on account of the friendship caused by this proximity) that some of them (the Reubenites) — Dathan and Abiram and 250 men (who were also mostly Reubenites, cf. Rashi on Numbers 16:1) — were punished together with Korah and his congregation, (cf. Numbers 16:32 ff.), because they were dragged into the quarrel with them (cf. Midrash Tanchuma, Vayera 12)."}, {"ch": 3, "v": 30, "aliyah": 5, "heb": "וּנְשִׂ֥יא בֵֽית־אָ֖ב לְמִשְׁפְּחֹ֣ת הַקְּהָתִ֑י אֱלִיצָפָ֖ן בֶּן־עֻזִּיאֵֽל׃", "onk": "וְרַב בֵּית אַבָּא לְזַרְעֲיַת קְהָת אֱלִיצָפָן בַּר עֻזִּיאֵל:", "onk_en": "The leader of the household of the families of the Kehosites, is Elitzafan the son of Uziel.", "pj": "וְרַב בֵּית אַבָּא דַהֲוָה מִתְמַנֵי עַל גְנִיסַת קְהָת אֱלִיצָפָן בַּר עֻזִיאֵל", "pj_en": "the Rab shall be Elizaphan bar Uzziel,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 31, "aliyah": 5, "heb": "וּמִשְׁמַרְתָּ֗ם הָאָרֹ֤ן וְהַשֻּׁלְחָן֙ וְהַמְּנֹרָ֣ה וְהַֽמִּזְבְּחֹ֔ת וּכְלֵ֣י הַקֹּ֔דֶשׁ אֲשֶׁ֥ר יְשָׁרְת֖וּ בָּהֶ֑ם וְהַ֨מָּסָ֔ךְ וְכֹ֖ל עֲבֹדָתֽוֹ׃", "onk": "וּמַטַּרְתְּהוֹן אֲרוֹנָא וּפָתוֹרָא וּמְנַרְתָּא וּמַדְבְּחָא וּמָנֵי קוּדְשָׁא דִּי יְשַׁמְּשׁוּן בְּהוֹן וּפְרָסָא וְכֹל פָּלְחָנֵיהּ:", "onk_en": "Their guardianship is the Ark, the Table, the Menorah, the Altars and the sacred utensils with which they serve. And the Curtain, and all of the work involving these things.", "pj": "וּמְטַרְתְּהוֹן אֲרוֹנָא וּפְתוֹרָא וּמְנַרְתָּא וּמַדְבְּחַיָא וּמָאנֵי קוּדְשָׁא דִישַׁמְשׁוּן בְּהוֹן וּפְרָסָא וְכָל פּוּלְחָנֵיהּ", "pj_en": "and their charge, the ark, the table, the candelabrum, the altars, the vessels of the sanctuary wherewith they minister, and the veil, and that which pertaineth to its service.", "tj": "", "tj_en": "", "rashi": "<b>והמסך.<\/b> הִיא הַפָּרֹכֶת, שֶׁאַף הִיא קְרוּיָה פָּרֹכֶת הַמָּסָךְ:", "rashi_en": "והמסך AND THE SCREEN — i.e. the Partition Veil, for it, too, (cf. Rashi on v. 25) is called מסך in the phrase (Exodus 40:21): פרכת המסך. "}, {"ch": 3, "v": 32, "aliyah": 5, "heb": "וּנְשִׂיא֙ נְשִׂיאֵ֣י הַלֵּוִ֔י אֶלְעָזָ֖ר בֶּן־אַהֲרֹ֣ן הַכֹּהֵ֑ן פְּקֻדַּ֕ת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַקֹּֽדֶשׁ׃", "onk": "וַאֲמַרְכְּלָא דִּמְמַנָּא עַל רַבְרְבֵי לֵוָאֵי אֶלְעָזָר בַּר אַהֲרֹן כַּהֲנָא דְּמִתְּחוֹת יְדוֹהִי מְמַנָּן נָטְרֵי מַטְּרַת קוּדְשָׁא:", "onk_en": "The leader of the leaders of Levi shall be Elazar, the son of Aharon, the <i>kohein<\/i> [who is] in charge of the appointment of the guardians to safeguard the holy [Sanctuary].", "pj": "וַאֲמַרְכּוֹל דִמְמַנֵי עַל רַבְרְבֵי לֵיוָאֵי אֶלְעָזָר בַּר אַהֲרן כַּהֲנָא הוּא הֲוָה שָׁאִיל בְּאוּרַיָיא וְתוּמַיָא מִתְּחוֹת יְדוֹי מְמַנָן נַטְרֵי מַטְרַת קוּדְשָׁא", "pj_en": "And the Amarkol set over the chiefs of the Levites shall be Elazar bar Aharon the priest, who inquireth by Uraya and Thumaya; and under his hand shall they be appointed who keep the charge of the sanctuary.", "tj": "", "tj_en": "", "rashi": "<b>ונשיא נשיאי הלוי.<\/b> מְמֻנֶּה עַל כֻּלָּם, וְעַל מַה הִיא נְשִׂיאוּתוֹ —<br><br><b>פקדת שמרי משמרת<\/b> — עַל יָדוֹ הִיא פְּקֻדַּת כֻּלָּם:", "rashi_en": "ונשיא נשיאי הלוי AND [ELAZAR THE SON OF AARON THE PRIEST WAS] THE PRINCE OVER THE PRINCES OF THE LEVITES — i.e. he was appointed over all of them. And in regard to what was his overship?<br><br>פקדת שמרי משמרת THE OVERSIGHT OF THEM THAT KEEP THE CHARGE [OF THE SANCTUARY] — i.e. by him was the appointment of all of these."}, {"ch": 3, "v": 33, "aliyah": 5, "heb": "לִמְרָרִ֕י מִשְׁפַּ֙חַת֙ הַמַּחְלִ֔י וּמִשְׁפַּ֖חַת הַמּוּשִׁ֑י אֵ֥לֶּה הֵ֖ם מִשְׁפְּחֹ֥ת מְרָרִֽי׃", "onk": "לִמְרָרִי זַרְעִית מַחְלִי וְזַרְעִית מוּשִׁי אִלֵּין אִנּוּן זַרְעֲיַת מְרָרִי:", "onk_en": "Of Merori, was the family of Machli and the family and Mushi; these are the families of the Merorites.", "pj": "לִמְרָרִי גְנִיסְתָּא דְמַחְלִי וּגְנִיסְתָּא דְמוּשִׁי אִלֵין הִינוּן גְנִיסַת מְרָרִי", "pj_en": "Of Merari, the families of Machli and Mushi, ___", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 34, "aliyah": 5, "heb": "וּפְקֻדֵיהֶם֙ בְּמִסְפַּ֣ר כׇּל־זָכָ֔ר מִבֶּן־חֹ֖דֶשׁ וָמָ֑עְלָה שֵׁ֥שֶׁת אֲלָפִ֖ים וּמָאתָֽיִם׃", "onk": "וּמִנְיָנֵיהוֹן בְּמִנְיַן כָּל דְּכוּרָא מִבַּר יַרְחָא וּלְעֵלָּא שִׁתָּא אַלְפִין וּמָאתָן:", "onk_en": "Their numbers, in a count of every male of one month and above, is six thousand two hundred.", "pj": "סְכוּמְהוֹן בְּמִנְיַן כָּל דְכוּרָא מִבַּר יַרְחָא וּלְעֵילָא שִׁיתָּא אַלְפִין וּמָאתָן", "pj_en": "___ their number six thousand two hundred,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 35, "aliyah": 5, "heb": "וּנְשִׂ֤יא בֵֽית־אָב֙ לְמִשְׁפְּחֹ֣ת מְרָרִ֔י צוּרִיאֵ֖ל בֶּן־אֲבִיחָ֑יִל עַ֣ל יֶ֧רֶךְ הַמִּשְׁכָּ֛ן יַחֲנ֖וּ צָפֹֽנָה׃", "onk": "וְרַב בֵּית אַבָּא לְזַרְעֲיַת מְרָרִי צוּרִיאֵל בַּר אֲבִיחָיִל עַל צִדָּא דְמַשְׁכְּנָא יִשְׁרוּן צִפּוּנָא:", "onk_en": "The leader of the household of the families of the Merorites is Tzuriel the son of Avichail, they shall camp on the north side of the <i>Mishkon.<\/i>", "pj": "וְרַב בֵּית אַבָּא דַהֲוָה מִתְמַנֵי עַל גְנִיסַת מְרָרִי צוּרִיאֵל בַּר אֲבִיחָיִל עַל צִידָא דְמַשְׁכְּנָא יִשְׁרוּן צָפוֹנָא", "pj_en": "and the Rab Zeruel bar Abichael: they shall encamp by the tabernacle northward;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 36, "aliyah": 5, "heb": "וּפְקֻדַּ֣ת מִשְׁמֶ֘רֶת֮ בְּנֵ֣י מְרָרִי֒ קַרְשֵׁי֙ הַמִּשְׁכָּ֔ן וּבְרִיחָ֖יו וְעַמֻּדָ֣יו וַאֲדָנָ֑יו וְכׇ֨ל־כֵּלָ֔יו וְכֹ֖ל עֲבֹדָתֽוֹ׃", "onk": "וְדִי מְסִיר לְמַטְּרַת בְּנֵי מְרָרִי דַּפֵּי מַשְׁכְּנָא וְעַבְרוֹהִי וְעַמּוּדוֹהִי וְסַמְכוֹהִי וְכָל מָנוֹהִי וְכֹל <b>פּוּלְחָנֵיהּ<\/b>:", "onk_en": "The appointed task of the guardianship of the sons of Merori shall be the beams of the <i>Mishkon,<\/i> its bars, pillars and sockets; all of its utensils, and all of the work involving these things [<b>its service<\/b>].", "pj": "וְדִמְסִיר לְמִנְטַר בְּנֵי מְרָרִי לוּחֵי מַשְׁכְּנָא וְנַגְרוֹי וַעֲמוּדוֹי וְחוֹמְרוֹי וְכָל פּוּלְחָנֵיהּ", "pj_en": "and that delivered to their charge shall be the boards of the tabernacle, its bars, pillars, and sockets, and all (that pertains to) the service thereof.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 37, "aliyah": 5, "heb": "וְעַמֻּדֵ֧י הֶחָצֵ֛ר סָבִ֖יב וְאַדְנֵיהֶ֑ם וִיתֵדֹתָ֖ם וּמֵֽיתְרֵיהֶֽם׃", "onk": "וְעַמּוּדֵי דְדַרְתָּא סְחוֹר סְחוֹר וְסַמְכֵיהוֹן וְסִכֵּיהוֹן וְאַטּוּנֵיהוֹן:", "onk_en": "Also the pillars of the surrounding courtyard and their sockets, pegs and ropes.", "pj": "וְעַמוּדֵי דְדַרְתָּא חֲזוֹר חֲזוֹר וְחוּמְרֵיהוֹן וְסִיכֵיהוֹן וּמַתְחֵיהוֹן", "pj_en": "The pillars of the court also round about, their sockets, pins, and cords.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 38, "aliyah": 5, "heb": "וְהַחֹנִ֣ים לִפְנֵ֣י הַמִּשְׁכָּ֡ן קֵ֣דְמָה לִפְנֵי֩ אֹֽהֶל־מוֹעֵ֨ד&thinsp;<small>׀<\/small>&thinsp;מִזְרָ֜חָה מֹשֶׁ֣ה&thinsp;<b>׀<\/b> וְאַהֲרֹ֣ן וּבָנָ֗יו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַמִּקְדָּ֔שׁ לְמִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְהַזָּ֥ר הַקָּרֵ֖ב יוּמָֽת׃", "onk": "וְדִי שְׁרַן קֳדָם מַשְׁכְּנָא קִדּוּמָא קֳדָם מַשְׁכַּן זִמְנָא מַדִּינְחָא משֶׁה וְאַהֲרֹן וּבְנוֹהִי נָטְרִין מַטְּרַת מַקְדְּשָׁא לְמַטְּרַת בְּנֵי יִשְׂרָאֵל וְחִלּוֹנַי דְּיִקְרַב יִתְקְטָל:", "onk_en": "Those who camped in front of the <i>Mishkon<\/i> in the forefront, in front of the Tent of Meeting on the east side [are]; Moshe, Aharon and his sons, guardians of the guardianship of the Sanctuary to guard on behalf of Bnei Yisroel. Any outsider (non-<i>kohein<\/i>) who comes near, shall be put to death.", "pj": "וְדִישְׁרַן קֳדָם מַשְׁכַּן זִמְנָא מַדִינְחָא משֶׁה וְאַהֲרן וּבְנוֹי נַטְרִין מַטְרַת מַקְדְשָׁא לְמַטְרַת בְּנֵי יִשְרָאֵל וְחִילוֹנֵי דְיִקְרַב יִתְקְטֵיל בְּאֵשָׁא מְצַלְהֲבָא מִן קֳדָם יְיָ", "pj_en": "But they who encamp before the tabernacle of ordinance eastward (shall be) Mosheh and Aharon, and his sons; keeping charge of the sanctuary and of Israel; and the stranger who draweth near shall be slain by flaming fire from before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>משה ואהרן ובניו.<\/b> וּסְמוּכִין לָהֶם דֶּגֶל מַחֲנֵה יְהוּדָה, וְהַחוֹנִים עָלָיו יִשָּׂשכָר וּזְבוּלֻן — טוֹב לַצַּדִיק טוֹב לִשְׁכֵנוֹ, לְפִי שֶׁהָיוּ שְׁכֵנָיו שֶׁל מֹשֶׁה שֶׁהָיָה עוֹסֵק בַּתּוֹרָה, נַעֲשׂוּ גְדוֹלִים בַּתּוֹרָה, שֶׁנֶּאֱמַר \"יְהוּדָה מְחֹקְקִי\" (תהלים ס, ט), \"וּמִבְּנֵי יִשָּׂשכָר יוֹדְעֵי בִינָה וְגוֹ' מָאתַיִם\" (דהי\"א י\"ב) — רָאשֵׁי סַנְהֶדְרָאוֹת, \"וּמִזְּבוּלֻן מֹשְׁכִים בְּשֵׁבֶט סֹפֵר\" (שופטים ה, יד) (תנחומא):", "rashi_en": "משה ואהרן ובניו [BUT THOSE THAT ENCAMP BEFORE THE DWELLING … SHALL BE] MOSES, AND AARON AND HIS SONS — and adjacent to him was the standard of the camp of Judah, and next to the latter were encamped Issachar and Zebulun — “Well is it with the righteous, well with his neighbour!” Because they (the sons of Judah, Issachar and Zebulun) were the neighbours of Moses who occupied himself with the Torah, they themselves became eminent scholars in the Law, as it is said, (Psalms 60:9) “Judah is my lawgiver”; (I Chronicles 12:32) “and of the children of Issachar which were men that had understanding of the times to know what Israel had to do [the heads of them were two hundred]” — i.e., two hundred heads of the Sanhedrin; and (Judges 5:14) “and out of Zebulun came those that handle the pen of the writer” (Midrash Tanchuma, Bamidbar 12)."}, {"ch": 3, "v": 39, "aliyah": 5, "heb": "כׇּל־פְּקוּדֵ֨י הַלְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄאַׄהֲׄרֹ֛ׄןׄ עַל־פִּ֥י יְהֹוָ֖ה לְמִשְׁפְּחֹתָ֑ם כׇּל־זָכָר֙ מִבֶּן־חֹ֣דֶשׁ וָמַ֔עְלָה שְׁנַ֥יִם וְעֶשְׂרִ֖ים אָֽלֶף׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל מִנְיָנֵי לֵוָאֵי דִּי מְנָא משֶׁה וְאַהֲרֹן עַל מֵימְרָא דַיְיָ לְזַרְעֲיַתְהוֹן כָּל דְּכוּרָא מִבַּר יַרְחָא וּלְעֵלָּא עַשְׂרִין וּתְרֵין אַלְפִין:", "onk_en": "The number of all the Levites whom Moshe and Aharon counted at the word of Adonoy according to their families; every male from one month and above was twenty-two thousand.", "pj": "כָּל סְכוּמֵי מִנְיָנֵי לֵיוָאֵי דִי מְנָא משֶׁה וְאַהֲרן עַל פּוּם מֵימְרָא דַיְיָ לִגְנִיסַתְהוֹן כָּל דְכוּרָא מִבַּר יַרְחָא וּלְעֵילָא עַשְרִין וּתְרֵין אַלְפִין", "pj_en": "The sum of the Levites whom Mosheh and Aharon numbered by the mouth of the Word of the Lord was twenty-two thousand.", "tj": "", "tj_en": "", "rashi": "<b>אשר פקד משה ואהרן.<\/b> נָקוּד עַל וְאַהֲרֹן, לוֹמַר שֶׁלֹּא הָיָה בְּמִנְיַן הַלְוִיִּם (בכורות ד'):<br><br><b>שנים ועשרים אלף.<\/b> וּבִפְרָטָן אַתָּה מוֹצֵא שְׁלֹשׁ מֵאוֹת יְתֵרִים — בְּנֵי גֵּרְשׁוֹן שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת, בְּנֵי קְהָת שְׁמוֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת, בְּנֵי מְרָרִי שֵׁשֶׁת אֲלָפִים וּמָאתָיִם; וְלָמָּה לֹא כְלָלָן עִם הַשְּׁאָר וְיִפְדּוּ אֶת הַבְּכוֹרוֹת וְלֹא יִהְיוּ זְקוּקִים הַשְּׁלֹשָׁה וְשִׁבְעִים וּמָאתַיִם בְּכוֹרוֹת הָעוֹדְפִים עַל הַמִּנְיָן לְפִדְיוֹן? אָמְרוּ רַבּוֹתֵינוּ בְמַסֶּכֶת בְּכוֹרוֹת (דף ה'), אוֹתָן שְׁלֹשׁ מֵאוֹת לְוִיִּם בְּכוֹרוֹת הָיוּ, וְדַיָּם שֶׁיַּפְקִיעוּ עַצְמָם מִן הַפִּדְיוֹן:", "rashi_en": "אשר פקד משה ואהרן [ALL THAT WERE NUMBERED OF THE LEVITES] WHOM MOSES AND AARON NUMBERED — There are dots on the word Aaron to indicate that he was not among the number of the Levites (Bekhorot 4a; Sifrei Bamidbar 69:2 on Numbers 9:10). <br><br>שנים ועשרים אלף [ALL THE MALES FROM A MONTH OLD AND UPWARDS WERE] TWENTY AND TWO THOUSAND — But in the enumeration of them given above you will find three hundred more — the sons of Gershon 7500 (v. 22). the sons of Kohath 8600 (v. 28), the sons of Merari 6200 (v. 34), making 22,300! Why, then, did Scripture not include them in the sum total together with the others, when they, too, might have redeemed the firstborn of the Israelites (i.e., when each of the 300 might also have served the purpose of replacing a firstborn Israelite, as did the other 22,000; cf. v. 41), and thus the 273 firstborn Israelites who were in excess of the sum total of the Levites as given by Scripture, (the sum total of the firstborn having been 22,273, whilst the Levites, as summed up by Scripture, were only 22,000) would not have required redemption at all (cf. vv. 46—48)!? To this our Rabbis gave the reply in Treatise Bekhorot 5a: those three hundred Levites in question were themselves firstborn, and it was quite sufficient for them to do one thing — that they should free themselves from the necessity of ransom."}, {"ch": 3, "v": 40, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה פְּקֹ֨ד כׇּל־בְּכֹ֤ר זָכָר֙ לִבְנֵ֣י יִשְׂרָאֵ֔ל מִבֶּן־חֹ֖דֶשׁ וָמָ֑עְלָה וְשָׂ֕א אֵ֖ת מִסְפַּ֥ר שְׁמֹתָֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה מְנֵי כָּל בּוּכְרַיָּא דִכְרַיָּא לִבְנֵי יִשְׂרָאֵל מִבַּר יַרְחָא וּלְעֵלָּא וְקַבֵּל יָת מִנְיַן שְׁמָהַתְהוֹן:", "onk_en": "Adonoy said to Moshe: Count every male firstborn of Bnei Yisroel from the age of one month and above and take the number of their names.", "pj": "וַאֲמַר יְיָ לְמשֶׁה מְנֵי כָּל בּוּכְרַיָא דוּכְרַיָא מִבְּנֵי יִשְרָאֵל מִבַּר יַרְחָא וּלְעֵילָא וְקַבֵּיל יַת סְכוּם מִנְיַין שְׁמָהַתְהוֹן", "pj_en": "And the Lord said unto Mosheh, Number all the first-bon males among the sons of Israel, from a month old and upward, and take the number of their names.", "tj": "", "tj_en": "", "rashi": "<b>פקד כל בכר זכר מבן חדש ומעלה.<\/b> מִשֶּׁיָּצָא מִכְּלַל סְפֵק נְפָלִים:", "rashi_en": "פקד כל בכר זכר … מבן חדש ומעלה NUMBER ALL THE FIRSTBORN OF THE MALES [OF THE CHILDREN OF ISRAEL] FROM A MONTH OLD AND UPWARDS — as soon as he (the firstborn) has passed the age when it might possibly prove non-viable (Numbers Rabbah 4:3; cf. Rashi on v. 15)."}, {"ch": 3, "v": 41, "aliyah": 6, "heb": "וְלָקַחְתָּ֨ אֶת־הַלְוִיִּ֥ם לִי֙ אֲנִ֣י יְהֹוָ֔ה תַּ֥חַת כׇּל־בְּכֹ֖ר בִּבְנֵ֣י יִשְׂרָאֵ֑ל וְאֵת֙ בֶּהֱמַ֣ת הַלְוִיִּ֔ם תַּ֣חַת כׇּל־בְּכ֔וֹר בְּבֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּתְקָרֵב יָת לֵוָאֵי <b>קֳדָמַי<\/b> אֲנָא יְיָ חֲלַף כָּל בּוּכְרָא בִּבְנֵי יִשְׂרָאֵל וְיָת בְּעִירָא דְלֵוָאֵי חֲלַף כָּל בּוּכְרָא בִּבְעִירָא דִּבְנֵי יִשְׂרָאֵל:", "onk_en": "You shall take the Levites for [<b>before<\/b>] Me, I, [who am] Adonoy, instead of every firstborn of Bnei Yisroel; and the animals of the Levites instead of every firstborn among the animals of Bnei Yisroel.", "pj": "וּתְקַרֵב יַת לֵיוָאֵי קֳדָמַי אֲנָא יְיָ חֲלַף כָּל בּוּכְרַיָא בִּבְנֵי יִשְרָאֵל וְיַת כָּל בְּעִירָא דְלֵיוָאֵי חֲלַף כָּל בּוּכְרָא בִּבְעִירָא דִבְנֵי יִשְרָאֵל", "pj_en": "And bring near the Levites before me--I am the Lord--instead of all the firstborn among the sons of Israel, and all the cattle of the Levites instead of all the firstling cattle of the children of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 42, "aliyah": 6, "heb": "וַיִּפְקֹ֣ד מֹשֶׁ֔ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֹת֑וֹ אֶֽת־כׇּל־בְּכ֖וֹר בִּבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּמְנָא משֶׁה כְּמָא דִי פַּקִיד יְיָ יָתֵיהּ יָת כָּל בּוּכְרָא בִּבְנֵי יִשְׂרָאֵל:", "onk_en": "Moshe counted just as Adonoy commanded him to, every firstborn of Bnei Yisroel.", "pj": "וּמְנָא משֶׁה הֵיכְמָא דְפַקֵיד יְיָ יָתֵיהּ יַת כָּל בּוּכְרַיָא בִּבְנֵי יִשְרָאֵל", "pj_en": "And Mosheh numbered, as the Lord commanded him,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 43, "aliyah": 6, "heb": "וַיְהִי֩ כׇל־בְּכ֨וֹר זָכָ֜ר בְּמִסְפַּ֥ר שֵׁמֹ֛ת מִבֶּן־חֹ֥דֶשׁ וָמַ֖עְלָה לִפְקֻדֵיהֶ֑ם שְׁנַ֤יִם וְעֶשְׂרִים֙ אֶ֔לֶף שְׁלֹשָׁ֥ה וְשִׁבְעִ֖ים וּמָאתָֽיִם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲווֹ כָל בּוּכְרַיָּא דִכְרַיָּא בְּמִנְיַן שְׁמָהָן מִבַּר יַרְחָא וּלְעֵלָּא לְמִנְיָנֵיהוֹן עַשְׂרִין וּתְרֵין אַלְפִין מָאתָן וְשַׁבְעִין וּתְלָתָא:", "onk_en": "Every male firstborn according to the number of names of one month and above according to their numbers, was twenty-two thousand two hundred and seventy-three.", "pj": "וַהֲווֹן כָּל בּוּכְרַיָא דוּכְרַיָא בִּסְכוּם מִנְיַין שְׁמָהָן מִבַּר יַרְחָא וּלְעֵילָא לִסְכוּם מִנְיָינֵיהוֹן עַשְרִין וּתְרֵין אַלְפִין וּמָאתָן וְשַׁבְעִין וּתְלָתָא", "pj_en": "all the firstborn of the sons of Israel: the sum of their number was twenty-two thousand two hundred and seventy-three.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 44, "aliyah": 6, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 45, "aliyah": 6, "heb": "קַ֣ח אֶת־הַלְוִיִּ֗ם תַּ֤חַת כׇּל־בְּכוֹר֙ בִּבְנֵ֣י יִשְׂרָאֵ֔ל וְאֶת־בֶּהֱמַ֥ת הַלְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑ם וְהָיוּ־לִ֥י הַלְוִיִּ֖ם אֲנִ֥י יְהֹוָֽה׃", "onk": "קָרֵב יָת לֵוָאֵי חֲלַף כָּל בּוּכְרָא בִּבְנֵי יִשְׂרָאֵל וְיָת בְּעִירָא דְלֵוָאֵי חֲלַף בְּעִירְהוֹן וִיהוֹן <b>מְשַׁמְּשִׁין קֳדָמַי<\/b> לֵוָאֵי אֲנָא יְיָ:", "onk_en": "Take the Levites instead of every firstborn of Bnei Yisroel, and the animals of the Levites instead of their animals, and the Levites shall [<b>serve before Me<\/b>] be Mine, I am Adonoy.", "pj": "קָרֵיב יַת לֵיוָאֵי חֲלַף כָּל בּוּכְרָא בִּבְנֵי יִשְרָאֵל וְיַת בְּעִירָא לֵיוָאֵי חֲלַף בְּעִירֵיהוֹן וִיהוֹן מְשַׁמְשִׁין קֳדָמָי לֵיוָאֵי אֲנָא יְיָ", "pj_en": "Bring near the Levites instead of every first-born among Israel, and the cattle of the Levites instead of their cattle, that the Levites may minister before me: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ואת בהמת הלוים וגו'.<\/b> לֹא פָדוּ בְהֵמוֹת הַלְוִיִּם אֶת בְּכוֹרֵי בְהֵמָה טְהוֹרָה שֶׁל יִשְׂרָאֵל אֶלָּא אֶת פִּטְרֵי חֲמוֹרֵיהֶם, וְשֶׂה אֶחָד שֶׁל בֶּן לֵוִי פָּטַר כַּמָּה פִטְרֵי חֲמוֹרִים שֶׁל יִשְׂרָאֵל. תֵּדַע, שֶׁהֲרֵי מָנָה הָעוֹדְפִים בָּאָדָם וְלֹא מָנָה הָעוֹדְפִים בַּבְּהֵמָה (שם ד'):", "rashi_en": "ואת בהמת הלוים וגו׳ AND [THOU SHALT TAKE] THE BEASTS OF THE LEVITES [INSTEAD OF ALL THE FIRSTBORN AMONG THE BEASTS OF THE CHILDREN OF ISRAEL] — The beasts of the Levites did not redeem the firstborn of the clean beasts belonging to the Israelites, but only the first offsprings of their asses (cf. Bekhorot 4a). One lamb of the Levites (it must be remembered that for the redemption of פטר חמור a lamb is prescribed; cf. Exodus 13:13) could, however, release several first offsprings of asses belonging to Israelites. You may know that this is so, for it (Scripture) mentions the number of firstborn Israelites in excess of the number of Levites in the case of human beings, but mentions no number of firstborn animals belonging to the Israelites as being in excess over the lambs of the Levites, [although there were undoubtedly many more firstborn asses of the Israelites than ordinary lambs of the Levites] (cf. Bekhorot 4b)."}, {"ch": 3, "v": 46, "aliyah": 6, "heb": "וְאֵת֙ פְּדוּיֵ֣י הַשְּׁלֹשָׁ֔ה וְהַשִּׁבְעִ֖ים וְהַמָּאתָ֑יִם הָעֹֽדְפִים֙ עַל־הַלְוִיִּ֔ם מִבְּכ֖וֹר בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְיָת פֻּרְקַן מָאתָן וְשַׁבְעִין וּתְלָתָא דְּיַתִּירִין עַל לֵוָאֵי מִבּוּכְרַיָּא דִּבְנֵי יִשְׂרָאֵל:", "onk_en": "And the redemption of the two hundred and seventy-three that are in excess of the number of Levites from the firstborns of Bnei Yisroel.", "pj": "וְיַת פִּרְקוֹנֵי מָאתָן וְשׁוּבְעִין וּתְלָתָא מַה דְאִשְׁתְּיָירוּ עַל לֵיוָאֵי מִבּוּכְרַיָא דִבְנֵי יִשְרָאֵל", "pj_en": "And for the redemption of the two hundred and seventy and three of the first-born of the Beni Israel, who are more (than the number of) the Levites,", "tj": "", "tj_en": "", "rashi": "<b>ואת פדויי השלשה וגו'.<\/b> וְאֶת הַבְּכוֹרוֹת הַצְּרִיכִין לְהִפָּדוֹת בָּהֶם, אֵלּוּ שְׁלֹשָׁה וְשִׁבְעִים וּמָאתַיִם הָעֹדְפִים בָּהֶם יְתֵרִים עַל הַלְוִיִּם, מֵהֶם תִּקַּח <b>חמשת שקלים לגלגלת;<\/b> כָּךְ הָיְתָה מְכִירָתוֹ שֶׁל יוֹסֵף, עֶשְׂרִים כֶּסֶף, שֶׁהָיָה בְּכוֹרָהּ שֶׁל רָחֵל (ב\"ר פ\"ד):", "rashi_en": "ואת פדויי השלשה וגו׳ AND AS FOR THOSE THAT ARE TO BE REDEEMED [OF THE TWO HUNDRED THREESCORE AND THIRTEEN etc.]… [THOU SHALT TAKE…] — This means, “and as for those firstborn who are yet to be redeemed among them (the Israelites), viz., the 273 who were in excess among them, being more than the 22,000 Levites,  of them thou shalt take חמשת שקלים לגלגלת FIVE SHEKELS BY THE POLL, such, viz., twenty pieces of silver, was the selling price of Joseph who was Rachel’s firstborn. (Jerusalem Talmud Shekalim 2:4; Genesis Rabbah 84:18)."}, {"ch": 3, "v": 47, "aliyah": 6, "heb": "וְלָקַחְתָּ֗ חֲמֵ֧שֶׁת חֲמֵ֛שֶׁת שְׁקָלִ֖ים לַגֻּלְגֹּ֑לֶת בְּשֶׁ֤קֶל הַקֹּ֙דֶשׁ֙ תִּקָּ֔ח עֶשְׂרִ֥ים גֵּרָ֖ה הַשָּֽׁקֶל׃", "onk": "וְתִסַּב חָמֵשׁ חָמֵשׁ סִלְעִין לְגֻלְגַּלְתָּא בְּסִלְעֵי קוּדְשָׁא תִּסַּב עַשְׂרִין מָעִין סִלְעָא:", "onk_en": "You shall take five <i>shekolim<\/i> apiece from each individual; you shall take it in holy <i>shekolim<\/i> at twenty <i>gerah<\/i> for each <i>shekel.<\/i>", "pj": "וְתִסַב חַמְשָׁא חַמְשָׁא סַלְעִין לְגוּלְגַלְתָּא בְּסִלְעֵי קוּדְשָׁא תִּסַב עַשְרִין מָעִין סִלְעָא", "pj_en": "thou shalt take of each five shekels by poll, in the shekel of the sanctuary shalt thou take, twenty mahin to the shekel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 48, "aliyah": 6, "heb": "וְנָתַתָּ֣ה הַכֶּ֔סֶף לְאַהֲרֹ֖ן וּלְבָנָ֑יו פְּדוּיֵ֕י הָעֹדְפִ֖ים בָּהֶֽם׃", "onk": "וְתִתֵּן כַּסְפָּא לְאַהֲרֹן וְלִבְנוֹהִי פֻּרְקַן דְּיַתִּירִין בְּהוֹן:", "onk_en": "You shall give the money to Aharon and to his sons as a redemption for those whose numbers are in excess [of the Levites.]", "pj": "וְתִתֵּן כַּסְפָּא לְאַהֲרן וְלִבְנוֹי פִּרְקוֹנֵי מַה דְמִשְׁתַּיְירָן בְּהוֹן", "pj_en": "And thou shalt give the Shekel unto Aharon, and to his sons, as the redemption of them who are more than they.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 49, "aliyah": 6, "heb": "וַיִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַפִּדְי֑וֹם מֵאֵת֙ הָעֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַלְוִיִּֽם׃", "onk": "וּנְסֵיב משֶׁה יָת כְּסַף פֻּרְקַנְהוֹן מִן דְּיַתִּירִין עַל פְּרִיקֵי לֵוָאֵי:", "onk_en": "Moshe took the redemption money from those whose numbers were in excess of those who were redeemed through the Levites.", "pj": "וּנְסֵב משֶׁה יַת פּוּרְקַנְהוֹן מִן מַה דִמְיַיתְרִין עַל פִּרְקוֹנֵי לֵיוָאֵי", "pj_en": "And Mosheh took the redemption (money) of them who were above those who were released by the Levites,", "tj": "", "tj_en": "", "rashi": "<b>העדפים על פדויי הלוים.<\/b> עַל אוֹתָן שֶׁפָּדוּ הַלְוִיִּם בְּגוּפָן:", "rashi_en": "העדפים על פדויי הלוים THE OVERPLUS THAT WERE MORE THAN THOSE REDEEMED BY THE LEVITES means, that were more than those whom the Levites redeemed by their own person."}, {"ch": 3, "v": 50, "aliyah": 6, "heb": "מֵאֵ֗ת בְּכ֛וֹר בְּנֵ֥י יִשְׂרָאֵ֖ל לָקַ֣ח אֶת־הַכָּ֑סֶף חֲמִשָּׁ֨ה וְשִׁשִּׁ֜ים וּשְׁלֹ֥שׁ מֵא֛וֹת וָאֶ֖לֶף בְּשֶׁ֥קֶל הַקֹּֽדֶשׁ׃", "onk": "מִן בּוּכְרַיָּא דִּבְנֵי יִשְׂרָאֵל נְסִיב יָת כַּסְפָּא אֲלַף וּתְלַת מְאָה וְשִׁתִּין וְחָמֵשׁ סִלְעִין בְּסִלְעֵי קוּדְשָׁא:", "onk_en": "From the firstborn of Bnei Yisroel, he took the money. One thousand three hundred sixty-five, in holy <i>shekel.<\/i>", "pj": "מִלְוַת בּוּכְרַיָא דִבְנֵי יִשְרָאֵל נְסִיב יַת כַּסְפָּא אֶלֶף וּתְלַת מְאָה וְשִׁתִּין וְחָמֵשׁ סַלְעִין בְּסִלְעֵי קוּדְשָׁא", "pj_en": "___ one thousand three hundred and sixty-five shekels;", "tj": "", "tj_en": "", "rashi": "<b>חמשה וששים ושלש מאות ואלף.<\/b> כָּךְ סְכוּם הַחֶשְׁבּוֹן: חֲמֵשֶׁת שְׁקָלִים לַגֻּלְגֹּלֶת — לְמָאתַיִם בְּכוֹרוֹת אֶלֶף שֶׁקֶל, לְשִׁבְעִים בְּכוֹרוֹת שְׁלֹשׁ מֵאוֹת וַחֲמִשִּׁים שֶׁקֶל, וְשָׁלֹשׁ בְּכוֹרוֹת חֲמִשָּׁה עָשָׂר שֶׁקֶל; אָמַר, כֵּיצַד אֶעֱשֶׂה? בְּכוֹר שֶׁאֹמַר לוֹ תֵּן חֲמֵשֶׁת שְׁקָלִים, יֹאמַר לִי \"אֲנִי מִפְּדוּיֵי הַלְוִיִּם\". מֶה עָשָׂה? הֵבִיא שְׁנַיִם וְעֶשְׂרִים אֶלֶף פְּתָקִין וְכָתַב עֲלֵיהֶם \"בֶּן לֵוִי\" וּמָאתַיִם וְשִׁבְעִים וּשְׁלֹשָׁה פְּתָקִין כָּתַב עֲלֵיהֶן \"חֲמֵשֶׁת שְׁקָלִים\", בְּלָלָן וּנְתָנָן בַּקַּלְפִּי, אָמַר לָהֶם, בּוֹאוּ וּטְלוּ פִתְקֵיכֶם לְפִי הַגּוֹרָל (סנהדרין י\"ז):", "rashi_en": "חמשה וששים ושלש מאות ואלף A THOUSAND THREE HUNDRED AND THREESCORE AND FIVE — This is the total sum: five shekels per head for two hundred firstborn if one thousand shekels; for seventy firstborn is three hundred and fifty shekels, and three firstborn give fifteen shekels, — thus altogether 1,365. — He, (Moses) said, “How shall I proceed? Any firstborn to whom I will say, “Give five shekels’ will answer me, ‘I am one of those redeemed by the Levites’!” What, then, did he do? He brought 22,000 tablets and inscribed them with the words “A son of Levi”, and 273 tablets, and wrote upon them the words “Five shekels”. These he mixed up, putting them into an urn. He said to them, “Come and draw your tablets and decide the matter by lot” (Sanhedrin 17a)."}, {"ch": 3, "v": 51, "aliyah": 6, "heb": "וַיִּתֵּ֨ן מֹשֶׁ֜ה אֶת־כֶּ֧סֶף הַפְּדֻיִ֛ם לְאַהֲרֹ֥ן וּלְבָנָ֖יו עַל־פִּ֣י יְהֹוָ֑ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיהַב משֶׁה יָת כְּסַף פְּרִיקַיָּא לְאַהֲרֹן וְלִבְנוֹהִי עַל מֵימְרָא דַיְיָ כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe gave the money of those who were redeemed to Aharon and to his sons according to the word of Adonoy, just as Adonoy commanded to Moshe.", "pj": "וִיהַב משֶׁה יַת כְּסַף פִּרְקוֹנָא לְאַהֲרן וְלִבְנוֹי עַל פּוּם מֵימְרָא דַיְיָ הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "and Mosheh gave the redemption silver to Aharon, and to his sons, according to the mouth of the Word of the Lord, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 1, "aliyah": 7, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 2, "aliyah": 7, "heb": "נָשֹׂ֗א אֶת־רֹאשׁ֙ בְּנֵ֣י קְהָ֔ת מִתּ֖וֹךְ בְּנֵ֣י לֵוִ֑י לְמִשְׁפְּחֹתָ֖ם לְבֵ֥ית אֲבֹתָֽם׃", "onk": "קַבִּילוּ יָת חֻשְׁבַּן בְּנֵי קְהָת מִגּוֹ בְּנֵי לֵוִי לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן:", "onk_en": "Take the count of the sons of Kehos from among the sons of Levi according to their families according to the house of their fathers.", "pj": "קַבִּילוּ יַת חוּשְׁבַּן בְּנֵי קְהָת מִגוֹ בְנֵי לֵוִי לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן", "pj_en": "Take the account of the sons of Kehath from among the Beni Levi,", "tj": "", "tj_en": "", "rashi": "<b>נשא את ראש וגו'.<\/b> מְנֵה מֵהֶם אֶת הָרְאוּיִין לַעֲבוֹדַת מַשָּׂא, וְהֵם מִבֶּן שְׁלֹשִׁים וְעַד בֶּן חֲמִשִּׁים שָׁנָה, וְהַפָּחוּת מִשְּׁלֹשִׁים לֹא נִתְמַלֵּא כֹחוֹ, מִכָּאן אָמְרוּ (אבות פ\"ה) \"בֶּן שְׁלֹשִׁים לַכֹּחַ\", וְהַיּוֹתֵר עַל בֶּן חֲמִשִּׁים כֹּחוֹ מַכְחִישׁ מֵעַתָּה:", "rashi_en": "נשא את ראש וגו׳ TAKE THE SUM OF [THE SONS OF KOHATH] — Count those that are fit among them for the service of carrying, and these are the men from thirty to fifty years, for a person less than thirty has not yet attained his full strength, — hence they (the Rabbis) said (Avot 5:21) “a man of thirty has reached the age when he enters into full strength”, — as for one who is older than fifty, his strength gradually diminishes from then."}, {"ch": 4, "v": 3, "aliyah": 7, "heb": "מִבֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָמַ֔עְלָה וְעַ֖ד בֶּן־חֲמִשִּׁ֣ים שָׁנָ֑ה כׇּל־בָּא֙ לַצָּבָ֔א לַעֲשׂ֥וֹת מְלָאכָ֖ה בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵלָּא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְּאָתֵי לְחֵילָא לְמֶעְבַּד עִבִדְתָּא בְּמַשְׁכַּן זִמְנָא:", "onk_en": "From thirty years and above until fifty years, all who enter into the division to perform service in the Tent of Meeting.", "pj": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵילָא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְאָתֵי לְחֵילָא לְמֶעֱבַד עִבִידְתָּא בְּמַשְׁכַּן זִימְנָא", "pj_en": "from thirty years and upwards to fifty years, every one who cometh by the band to do the work in the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 4, "aliyah": 7, "heb": "זֹ֛את עֲבֹדַ֥ת בְּנֵי־קְהָ֖ת בְּאֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַקֳּדָשִֽׁים׃", "onk": "דֵּין פּוּלְחַן בְּנֵי קְהָת בְּמַשְׁכַּן זִמְנָא קֹדֶשׁ קוּדְשַׁיָּא:", "onk_en": "This is the service of the sons of Kehos in the Tent of Meeting, the Holy of Holies.", "pj": "דָא פּוּלְחָנַת בְּנֵי קְהָת בְּמַשְׁכַּן זִמְנָא קוֹדֶשׁ קוּדְשַׁיָא", "pj_en": "This is the service of the Beni Kehath, in the tabernacle of ordinance (with) the most holy things.", "tj": "", "tj_en": "", "rashi": "<b>קדש הקדשים.<\/b> הַמְקֻדָּשׁ שֶׁבְּכֻלָּן – הָאָרוֹן וְהַשֻּׁלְחָן וְהַמְּנוֹרָה וְהַמִּזְבְּחוֹת וְהַפָּרֹכֶת וּכְלֵי שָׁרֵת:", "rashi_en": "קדש הקדשים [THIS SHALL BE THE SERVICE OF THE SONS OF KOHATH] THE קדש הקדשים — i.e., whatever is most holy of them all: the Ark, the table, the candelabrum, the altars, the Partition Veil and the vessels of service."}, {"ch": 4, "v": 5, "aliyah": 7, "heb": "וּבָ֨א אַהֲרֹ֤ן וּבָנָיו֙ בִּנְסֹ֣עַ הַֽמַּחֲנֶ֔ה וְהוֹרִ֕דוּ אֵ֖ת פָּרֹ֣כֶת הַמָּסָ֑ךְ וְכִ֨סּוּ־בָ֔הּ אֵ֖ת אֲרֹ֥ן הָעֵדֻֽת׃", "onk": "וְיֵעוֹל אַהֲרֹן וּבְנוֹהִי בְּמִטַּל מַשְׁרִיתָא וִיפָרְקוּן יָת פָּרֻכְתָּא דִפְרָסָא וִיכַסּוּן בַּהּ יָת אֲרוֹנָא דְסַהֲדוּתָא:", "onk_en": "Aharon and his sons shall enter when the camp is about to travel, and take down the screening curtain and, with it they shall cover the Ark of the Testimony.", "pj": "וְעָלֵיל אַהֲרן וּבְנוֹי בִּזְמַן מֵיטַל מַשְׁרִיתָא וְיִפְרְקוּן יַת פַּרְגוֹדָא דִפְרָסָא וִיכַסוּן יַת אֲרוֹנָא דְסַהֲדוּתָא", "pj_en": "But whenever the camp is to be removed, Aharon and his sons shall enter, and unloose the veil that is spread, and cover up the Ark of the Testimony,", "tj": "", "tj_en": "", "rashi": "<b>ובא אהרן ובניו וגו'.<\/b> יַכְנִיסוּ כָל כְּלִי וּכְלִי לְנַרְתֵּקוֹ הַמְפֹרָשׁ לוֹ בְּפָרָשָׁה זוֹ, וְלֹא יִצְטָרְכוּ הַלְוִיִּם בְּנֵי קְהָת אֶלָּא לָשֵׂאת:<br><br><b>בנסע המחנה.<\/b> כְּשֶׁהֶעָנָן מִסְתַּלֵּק, הֵן יוֹדְעִין שֶׁיִּסְּעוּ:", "rashi_en": "ובא אהרן ובניו וגו׳ AND [WHEN THE CAMP SETTETH FORWARD,] AARON SHALL COME, AND HIS SONS, etc. — They shall put every object into its wrapping that is prescribed for it in this section, so that the sons of Kohath should have nothing to do except to carry them.<br><br>בנסוע המחנה WHEN THE CAMP SETTETH FORWARD — When the cloud departed they knew that they were to set out on the journey (see Rashi on Numbers 1:51, and Note thereon)."}, {"ch": 4, "v": 6, "aliyah": 7, "heb": "וְנָתְנ֣וּ עָלָ֗יו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּפָרְשׂ֧וּ בֶֽגֶד־כְּלִ֛יל תְּכֵ֖לֶת מִלְמָ֑עְלָה וְשָׂמ֖וּ בַּדָּֽיו׃", "onk": "וְיִתְּנוּן עֲלוֹהִי חוֹפָאָה דִּמְשַׁךְ סַסְגּוֹנָא וְיִפְרְסוּן לְבוּשׁ גְּמִיר תִּכְלָא מִלְעֵלָּא וִישַׁוּוּן אֲרִיחוֹהִי:", "onk_en": "They shall place upon it a covering of <i>tachash<\/i> [<b>multi-colored<\/b>]-hide and spread an entirely blue woolen cloth on top of it, and put its [carrying] poles [in place].", "pj": "וְיִתְּנוּן עֲלוֹי חוֹפָאָה דִמְשַׁךְ סַסְגוֹנָא וְיִפְרְשׁוּן לְבוּשׁ שְׁזִיר עֲלוֹי מִלְעֵילָא וְיִשְׁווּן אֲרִיחוֹי", "pj_en": "and put over it the covering of hyacinthine skin, and overspread it with a wrapper of twined work, and inset its staves.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 7, "aliyah": 7, "heb": "וְעַ֣ל&thinsp;<b>׀<\/b> שֻׁלְחַ֣ן הַפָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵ֒לֶת֒ וְנָתְנ֣וּ עָ֠לָ֠יו אֶת־הַקְּעָרֹ֤ת וְאֶת־הַכַּפֹּת֙ וְאֶת־הַמְּנַקִּיֹּ֔ת וְאֵ֖ת קְשׂ֣וֹת הַנָּ֑סֶךְ וְלֶ֥חֶם הַתָּמִ֖יד עָלָ֥יו יִהְיֶֽה׃", "onk": "וְעַל <b>פָּתוֹרָא דִלְחֵם אַפַּיָּא<\/b> יִפְרְסוּן לְבוּשׁ תִּכְלָא וְיִתְּנוּן עֲלוֹהִי יָת מָגִיסַיָּא וְיָת בָּזִיכַיָּא וְיָת מְכִילָתָא וְיָת קַסְווֹת נִסּוּכָא וּלְחֵם <b>תְּדִירָא<\/b> עֲלוֹהִי יְהֵי:", "onk_en": "On the Show Table [<b>table of the show bread<\/b>] they shall spread a blue woolen cloth and they shall place upon it the molds, spoons, rods and the covering props, and the continual bread shall be upon it [<b>continually<\/b>].", "pj": "וְעַל פְּתוֹר לְחֵם אַפַּיָא יִפְרְסוּן לְבוּשׁ דְתִכְלָא וְיִתְּנוּן עֲלוֹי יַת פִילַוָותָא וְיַת בָּזִיכַיָא וְיַת מְנַקִיָתָא וְיַת קַסְווֹת נִיסוּכָא וּלְחֵם תְּדִירָא עֲלוֹי יְהֵי", "pj_en": "And over the table of the presence bread they shall spread a wrapper of purple, and set upon it the vials, and the spoons, and the vases, and the libation cups; but the bread shall be upon it evermore.", "tj": "יַת פַּיְילוּתָא:", "tj_en": "Vials.", "rashi": "<b>קערת וכפת וקשות ומנקית.<\/b> כְּבָר פֵּרַשְׁתִּי בִּמְלֶאכֶת הַמִּשְׁכָּן:<br><br><b>הנסך.<\/b> הַכִּסּוּי, לְשׁוֹן מָסָךְ, כְּדִכְתִיב \"אֲשֶׁר יֻסַּךְ בָּהֵן\" (שמות כ\"ה):", "rashi_en": "קערת וכפת וקשות ומנקיות — I have already described these in the chapter dealing with the work of the Tabernacle (Exodus XXV).<br><br>הנסך means, “covering”, — having the same meaning as מסך, the screen, — as it is written, (Exodus 25:29) “the covers by which they shall be covered (יסך)” (cf. Rashi on that verse and the Note thereon)."}, {"ch": 4, "v": 8, "aliyah": 7, "heb": "וּפָרְשׂ֣וּ עֲלֵיהֶ֗ם בֶּ֚גֶד תּוֹלַ֣עַת שָׁנִ֔י וְכִסּ֣וּ אֹת֔וֹ בְּמִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְשָׂמ֖וּ אֶת־בַּדָּֽיו׃", "onk": "וְיִפְרְסוּן עֲלֵיהוֹן לְבוּשׁ צְבַע זְהוֹרִי וִיכַסּוּן יָתֵיהּ בְּחוֹפָאָה דִּמְשַׁךְ סַסְגּוֹנָא וִישַׁוּוּן יָת אֲרִיחוֹהִי:", "onk_en": "They shall spread upon them a cloth of crimson thread and they shall cover it with a covering of <i>tachash<\/i> [<b>multi-colored<\/b>]-hide and put its [carrying] poles [in place].", "pj": "וְיִפְרְשׁוּן עֲלוֹי לְבוּשׁ צְבַע זְהוֹרִי וִיכַסוּן יָתֵיהּ בְּחוֹפָאָה דִמְשַׁךְ סַסְגוֹנָא וִישַׁווּן יַת אֲרִיחוֹהִי", "pj_en": "And they shall spread upon it a wrapper of scarlet, and cover it with a covering of hyacinthine skin, and inset its staves.", "tj": "", "tj_en": "Snuffers.", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 9, "aliyah": 7, "heb": "וְלָקְח֣וּ&thinsp;<b>׀<\/b> בֶּ֣גֶד תְּכֵ֗לֶת וְכִסּ֞וּ אֶת־מְנֹרַ֤ת הַמָּאוֹר֙ וְאֶת־נֵ֣רֹתֶ֔יהָ וְאֶת־מַלְקָחֶ֖יהָ וְאֶת־מַחְתֹּתֶ֑יהָ וְאֵת֙ כׇּל־כְּלֵ֣י שַׁמְנָ֔הּ אֲשֶׁ֥ר יְשָׁרְתוּ־לָ֖הּ בָּהֶֽם׃", "onk": "וְיִסְּבוּן לְבוּשׁ תִּכְלָא וִיכַסּוּן יָת מְנַרְתָּא דְאַנְהוֹרֵי וְיָת בּוֹצִינָהָא וְיָת צִבְתָהָא וְיָת מַחְתְּיתָהָא וְיָת כָּל מָנֵי מִשְׁחָא דִּי יְשַׁמְּשׁוּן לֵיהּ בְּהוֹן:", "onk_en": "They shall take a blue woolen cloth and they shall cover the Menorah that illuminates and its lamps, its tongs and its scoops and all of its oil vessels; those with which you use to perform its service.", "pj": "וְיִסְבוּן לְבוּשׁ דְתִכְלָא וִיכַסוּן יַת מְנַרְתָּא דְאַנְהוֹרֵי וְיַת בּוֹצִינָהָא וְיַת מַלְקְטַיָא וְיַת מַחְתְּיָתָא וְיַת כָּל מָאנֵי שִׁמוּשָׁא דִישַׁמְשׁוּן לָהּ בְּהוֹן", "pj_en": "And they shall take a purple wrapper, and cover the candelabrum that lighteth, and its lamps, its tongs, its snuff-dishes, and all the vessels of service by which they attend it.", "tj": "", "tj_en": "", "rashi": "<b>מלקחיה.<\/b> כְּמִין צְבַת שֶׁמּוֹשֵׁךְ בָּהּ אֶת הַפְּתִילָה לְכָל צַד שֶׁיִּרְצֶה:<br><br><b>מחתתיה.<\/b> כְּמִין כַּף קְטַנָּה, וְשׁוּלֶיהָ פְשׁוּטִין וְלֹא סְגַלְגַּלִּים, וְאֵין לָהּ מְחִצָּה לְפָנֶיהָ אֶלָּא מִצִּדֶּיהָ, וְחוֹתֶה בָהּ אֶת דֶּשֶׁן הַנֵּרוֹת כְּשֶׁמְּטִיבָן:<br><br><b>נרתיה.<\/b> לוצי\"ש בְּלַעַז, שֶׁנּוֹתְנִים בָּהֶן הַשֶּׁמֶן וְהַפְּתִילוֹת:", "rashi_en": "מלקחיה — a kind of tongs whereby one draws the wick in any direction one wishes.<br><br>מחתתיה — a kind of small ladle, the bottom of which was flat, not rounded (concave), and it had no wall in front (no piece projecting upwards) but only at its sides; and he (the priest) raked into it the ashes of the lamps when he cleansed them out (cf. Rashi on Exodus 25:28).<br><br>נרתיה ITS LAMPS — luces in O. F., the receptacles into which people put the oil and the wicks (not the lights as the word sometimes means; see e. g. Exodus 40:4)."}, {"ch": 4, "v": 10, "aliyah": 7, "heb": "וְנָתְנ֤וּ אֹתָהּ֙ וְאֶת־כׇּל־כֵּלֶ֔יהָ אֶל־מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְנָתְנ֖וּ עַל־הַמּֽוֹט׃", "onk": "וְיִתְּנוּן יָתַהּ וְיָת כָּל מָנָהָא לְחוֹפָאָה דִּמְשַׁךְ סַסְגּוֹנָא וְיִתְּנוּן עַל אֲרִיחָא:", "onk_en": "They shall put it and all of its utensils into the covering of the <i>tachash [<b>multi-colored<\/b>]<\/i>-hide and put it on the carrying frame.", "pj": "וְיִתְּנוּן יָתָהּ וְיַת כָּל מְנָהָא לְחוֹפָאָה דִמְשַׁךְ סַסְגוֹנָא וְיִתְּנוּן עַל אַסְלָא", "pj_en": "And they shall put it and all its vessels in a covering of hyacinthine skin, and place it upon a rest.", "tj": "", "tj_en": "Upon a beam.", "rashi": "<b>אל מכסה עור תחש.<\/b> כְּמִין מַרְצוּף:", "rashi_en": "אל מכסה עור תחש [AND THEY SHALL PUT IT, AND ALL THE VESSELS] WITHIN A COVERING OF TACHASH SKINS — This was a kind of packing bag."}, {"ch": 4, "v": 11, "aliyah": 7, "heb": "וְעַ֣ל&thinsp;<b>׀<\/b> מִזְבַּ֣ח הַזָּהָ֗ב יִפְרְשׂוּ֙ בֶּ֣גֶד תְּכֵ֔לֶת וְכִסּ֣וּ אֹת֔וֹ בְּמִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְשָׂמ֖וּ אֶת־בַּדָּֽיו׃", "onk": "וְעַל מַדְבְּחָא דְדַהֲבָא יִפְרְסוּן לְבוּשׁ תִּכְלָא וִיכַסּוּן יָתֵיהּ בְּחוֹפָאָה דִּמְשַׁךְ סַסְגּוֹנָא וִישַׁוּוּן יָת אֲרִיחוֹהִי:", "onk_en": "On top of the golden Altar they shall spread a blue woolen cloth and they shall cover it with a covering of <i>tachash [<b>multi-colored<\/b>]<\/i>-hide, and put its [carrying] poles in place.", "pj": "וְעַל מַדְבְּחָא דְדַהֲבָא יִפְרְסוּן לְבוּשׁ תִּכְלָא וִיכַסוּן יָתֵיהּ בְּחוֹפָאָה דִמְשַׁךְ סַסְגוֹנָא וִישַׁווּן יַת אֲרִיחוֹי", "pj_en": "And upon the golden altar they shall spread a purple vest, and cover it with a covering of hyacinthine skin, and inset its staves. And they shall take all the vessels, of the service with which they minister in the sanctuary, and wrap them in a covering of hyacinthine skins,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 12, "aliyah": 7, "heb": "וְלָקְחוּ֩ אֶת־כׇּל־כְּלֵ֨י הַשָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ־בָ֣ם בַּקֹּ֗דֶשׁ וְנָֽתְנוּ֙ אֶל־בֶּ֣גֶד תְּכֵ֔לֶת וְכִסּ֣וּ אוֹתָ֔ם בְּמִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְנָתְנ֖וּ עַל־הַמּֽוֹט׃", "onk": "וְיִסְּבוּן יָת כָּל מָנֵי שִׁמּוּשָׁא דִּי יְשַׁמְּשׁוּן בְּהוֹן בְּקוּדְשָׁא וְיִתְּנוּן לִלְבוּשׁ תִּכְלָא וִיכַסּוּן יָתְהוֹן בְּחוֹפָאָה דִּמְשַׁךְ סַסְגּוֹנָא וְיִתְּנוּן עַל אֲרִיחָא:", "onk_en": "They shall take all the service utensils with which they serve in the Sanctuary and they shall put them inside a blue woolen cloth, and they shall cover them with a covering of <i>tachash [<b>multi-colored<\/b>]<\/i>-hide, and put it on the carrying frame.", "pj": "וְיִסְבוּן יַת כָּל מָאנֵי שִׁמוּשָׁא דִי יְשַׁמְשׁוּן בְּהוֹן בְּקוּדְשָׁא וְיִתְּנוּן לִלְבוּשׁ דְתִכְלָא וִיכַסוּן יַתְהוֹן בְּחוֹפָאָה דִמְשַׁךְ סַסְגוֹנָא וְיִתְּנוּן עַל קוֹפָא", "pj_en": "and place it upon a beam.", "tj": "", "tj_en": "", "rashi": "<b>את כל כלי השרת אשר ישרתו בם בקדש.<\/b> בְּתוֹךְ הַמִּשְׁכָּן שֶׁהוּא קֹדֶשׁ, וְהֵן כְּלֵי הַקְּטֹרֶת שֶׁמְּשָׁרְתִין בָּהֶם בְּמִּזְבֵּחַ הַפְּנִימִי:", "rashi_en": "את כל כלי השרת אשר ישרתו בם בקדש [AND THEY SHALL TAKE] ALL THE VESSELS OF MINISTRY, WHEREWITH THEY MINISTER IN THE HOLY PLACE — i.e. in the Tabernacle which is called holy; these were the vessels for the incense with which they performed the ministry at the inner altar."}, {"ch": 4, "v": 13, "aliyah": 7, "heb": "וְדִשְּׁנ֖וּ אֶת־הַמִּזְבֵּ֑חַ וּפָרְשׂ֣וּ עָלָ֔יו בֶּ֖גֶד אַרְגָּמָֽן׃", "onk": "וְיִסְּפוּן יָת קִטְמָא דְמַדְבְּחָא וְיִפְרְסוּן עֲלוֹהִי לְבוּשׁ אַרְגְּוָן:", "onk_en": "They shall remove the ashes from [atop] the Altar and they shall spread upon it a cloth of purple [wool].", "pj": "וִידַרְדוּן יַת מַדְבְּחָא וְיִפְרְסוּן עֲלוֹי לְבוּשׁ אַרְגְוָון", "pj_en": "And they shall remove the cinders from the altar, and overspread it with a covering of crimson.", "tj": "וִידַרְדוּן יַת מַדְבְּחָא:", "tj_en": "And they shall take away from the altar", "rashi": "<b>ודשנו את המזבח.<\/b> מִזְבַּח הַנְּחֹשֶׁת:<br><br><b>ודשנו.<\/b> יִטְּלוּ אֶת הַדֶּשֶׁן מֵעָלָיו:<br><br><b>ופרשו עליו בגד ארגמן.<\/b> וְאֵשׁ שֶׁיָּרְדָה מִן הַשָּׁמַיִם רְבוּצָה תַּחַת הַבֶּגֶד כַּאֲרִי בִּשְׁעַת הַמַּסָּעוֹת, וְאֵינָהּ שׂוֹרַפְתּוֹ, שֶׁהָיוּ כוֹפִין עָלֶיהָ פְּסַכְתֵּר שֶׁל נְחֹשֶׁת (יומא כ\"א):", "rashi_en": "ודשנו את המזבח AND THEY SHALL TAKE AWAY THE ASHES FROM THE ALTAR — from the brazen altar. <br><br>ודשנו means, they shall remove the ashes from off it (cf. Rashi on Exodus 27:3).<br><br>ופרשו עליו בגד ארגמן AND THEY SHALL SPREAD A GARMENT OF RED PURPLE THEREON — But the fire that descended from heaven on the altar (cf. Rashi on Leviticus 1:7) lay beneath the garment in the form of a lion during the journeyings; it did not, however, burn it because they inverted a large vessel of copper over it (cf. Yoma 21b). "}, {"ch": 4, "v": 14, "aliyah": 7, "heb": "וְנָתְנ֣וּ עָ֠לָ֠יו אֶֽת־כׇּל־כֵּלָ֞יו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣יו בָּהֶ֗ם אֶת־הַמַּחְתֹּ֤ת אֶת־הַמִּזְלָגֹת֙ וְאֶת־הַיָּעִ֣ים וְאֶת־הַמִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַמִּזְבֵּ֑חַ וּפָרְשׂ֣וּ עָלָ֗יו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְשָׂמ֥וּ בַדָּֽיו׃", "onk": "וְיִתְּנוּן עֲלוֹהִי יָת כָּל מָנוֹהִי דִּי יְשַׁמְּשׁוּן עֲלוֹהִי בְהוֹן יָת מַחְתְּיָתָא וְיָת צִנּוֹרְיָתָא וְיָת מַגְרוֹפְיָתָא וְיָת מִזְרְקַיָּא כֹּל מָנֵי מַדְבְּחָא וְיִפְרְסוּן עֲלוֹהִי חוֹפָאָה דִּמְשַׁךְ סַסְגּוֹנָא וִישַׁווּן אֲרִיחוֹהִי:", "onk_en": "They shall put upon it all of its utensils which they use in service, those that are used on the Altar-top; the firepans, forks, scoops and sprinklers, all the utensils of the Altar. They shall spread upon it a covering of <i>tachash [<b>multi-colored<\/b>]<\/i>-hide, and put its [carrying] poles in place.", "pj": "וְיִתְּנוּן עֲלוֹי יַת כָּל מָנוֹי דִישַׁמְשׁוּן עֲלוֹי בְּהוֹן יַת מַחְתְּיָיתָא וְיַת מַשִׁלְיָיתָא וְיַת מַגְרוֹפְיָיתָא וְיַת מִזְרְקַיָא כָּל מָאנֵי מַדְבְּחָא וְיִפְרְסוּן עֲלוֹי חוֹפָאָה דִמְשַׁךְ סַסְגוֹנָא וִישַׁווּן אֲרִיחוֹי", "pj_en": "and put upon it all its vessels with which it is served, the cinder-holders, flesh-hooks, prongs, and basins, even all the vessels of the altar, and spread upon it a covering of hyacinthine skin, and inset its staves.", "tj": "", "tj_en": "", "rashi": "<b>מחתת.<\/b> שֶׁבָּהֶם חוֹתִין גֶּחָלִים לִתְרוּמַת הַדֶּשֶׁן, הָעֲשׂוּיָה כְּמִין מַחֲבַת שֶׁאֵין לָהּ אֶלָּא שָׁלֹשׁ מְחִצּוֹת, וּמִלְּפָנֶיהָ שׁוֹאֶבֶת אֶת הַגְּחָלִים:<br><br><b>מזלגת.<\/b> צִנּוֹרִיּוֹת שֶׁל נְחֹשֶׁת שֶׁבָּהֶן מַכִּין בָּאֵבָרִים שֶׁעַל הַמִּזְבֵּחַ לְהָפְכָן, כְּדֵי שֶׁיִּתְעַכְּלוּ יָפֶה וּמַהֵר:<br><br><b>יעים.<\/b> הֵם מַגְרֵפוֹת, וּבְלַעַז וודי\"ל, וְהֵן שֶׁל נְחֹשֶׁת, וּבָהֶן מְכַבְּדִין אֶת הַדֶּשֶׁן מֵעַל הַמִּזְבֵּחַ:", "rashi_en": "מחתת THE CENSERS into which the coals were raked for the purpose of the ceremony of תרומת הדשן, removing a pan of ashes from the copper altar (cf. Rashi on Leviticus 6:4), and which were formed like a pan which has only three walls (none in front) and with the front of it draws in the coals.<br><br>מזלגת — copper hooks (cf. Rashi on Exodus 27:3) which they stuck forcibly into the limbs that were on the altar in order to turn them over so that they might become thoroughly and quickly consumed.<br><br>יעים are shovels; in O. F. vedil. They were of copper and with them they cleared the ashes from off the altar."}, {"ch": 4, "v": 15, "aliyah": 7, "heb": "וְכִלָּ֣ה אַֽהֲרֹן־וּ֠בָנָ֠יו לְכַסֹּ֨ת אֶת־הַקֹּ֜דֶשׁ וְאֶת־כׇּל־כְּלֵ֣י הַקֹּ֘דֶשׁ֮ בִּנְסֹ֣עַ הַֽמַּחֲנֶה֒ וְאַחֲרֵי־כֵ֗ן יָבֹ֤אוּ בְנֵי־קְהָת֙ לָשֵׂ֔את וְלֹֽא־יִגְּע֥וּ אֶל־הַקֹּ֖דֶשׁ וָמֵ֑תוּ אֵ֛לֶּה מַשָּׂ֥א בְנֵֽי־קְהָ֖ת בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "וִישֵׁיצֵי אַהֲרֹן וּבְנוֹהִי לְכַסָּאָה יָת קוּדְשָׁא וְיָת כָּל מָנֵי קוּדְשָׁא בְּמִטַּל מַשְׁרִיתָא וּבָתַר כֵּן יֵעֲלוּן בְּנֵי קְהָת לְמִטַּל וְלָא יִקְרְבוּן לְקוּדְשָׁא וְלָא יְמוּתוּן אִלֵּין מַטּוּל בְּנֵי קְהָת בְּמַשְׁכַּן זִמְנָא:", "onk_en": "Aharon and his sons shall complete the covering of the Sanctuary and all of the holy utensils whenever the camp is about to travel, and after that, the sons of Kehos shall come to carry [these items], and they shall not touch the Holy [objects] and they will [not] die. These are what the sons of Kehos must carry for the Tent of Meeting.", "pj": "וְיִפְסוֹק אַהֲרן וּבְנוֹי לְכַסָאָה יַת קוּדְשָׁא וְיַת כָּל מָאנֵי קוּדְשָׁא בִּזְמַן מֵיטַל מַשְׁרִיתָא וּמִן בָּתַר כְּדֵין יֵיעָלוּן בְּנֵי קְהָת לִמְסוֹבָרָא וְלָא יִקְרְבוּן לְקוּדְשָׁא דְלָא יְמוּתוּן בְּאֵשָׁא מְצַלְהֲבָא דֵין מַטוֹל בְּנֵי קְהָת בְּמַשְׁכַּן זִמְנָא", "pj_en": "And after Aharon and his sons have completed to cover the sanctuary, and all the vessels thereof, when the camp is to go forward, then the sons of Kehath may enter in to carry: but they shall not touch any holy thing, lest they die by the flaming fire. This is the burden of the sons of Kehath in the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>לכסת את הקדש.<\/b> הָאָרוֹן וְהַמִּזְבֵּחַ:<br><br><b>ואת כל כלי הקדש.<\/b> הַמְּנוֹרָה וּכְלֵי שָׁרֵת:<br><br><b>ומתו.<\/b> שֶׁאִם יִגְּעוּ — חַיָּבִין מִיתָה בִידֵי שָׁמַיִם:", "rashi_en": "לכסת את הקדש [AND AARON AND HIS SONS FINISHED] COVERING THE HOLY THINGS — the Ark and the altar,<br><br>ואת כל כלי הקדש AND ALL THE VESSELS OF THE SANCTUARY — the candelabrum and the vessels for service,<br><br>ומתו [SO THAT THEY SHALL NOT TOUCH ANY THING OF HOLINESS] LEST THEY DIE — because if they do touch they become liable to death by Heaven."}, {"ch": 4, "v": 16, "aliyah": 7, "heb": "וּפְקֻדַּ֞ת אֶלְעָזָ֣ר&thinsp;<b>׀<\/b> בֶּן־אַהֲרֹ֣ן הַכֹּהֵ֗ן שֶׁ֤מֶן הַמָּאוֹר֙ וּקְטֹ֣רֶת הַסַּמִּ֔ים וּמִנְחַ֥ת הַתָּמִ֖יד וְשֶׁ֣מֶן הַמִּשְׁחָ֑ה פְּקֻדַּ֗ת כׇּל־הַמִּשְׁכָּן֙ וְכׇל־אֲשֶׁר־בּ֔וֹ בְּקֹ֖דֶשׁ וּבְכֵלָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וְדִי מְסִיר<\/b> לְאֶלְעָזָר בַּר אַהֲרֹן כַּהֲנָא מִשְׁחָא דְאַנְהָרוּתָא וּקְטֹרֶת בּוּסְמַיָּא וּמִנְחָתָא תְדִירָא וּמִשְׁחָא דִרְבוּתָא מַטְרַת כָּל מַשְׁכְּנָא וְכָל דִּי בֵיהּ בְּקוּדְשָׁא וּבְמָנוֹהִי:", "onk_en": "Encharged [<b>given<\/b>] to Elazar, the son of Aharon the <i>kohein,<\/i> is the oil for illumination, the incense of spices the continual [daily] meal-offering and the anointing oil; the charge of the entire <i>Mishkon<\/i> and all of its contents in the Sanctuary, and its utensils.", "pj": "וְדִמְסִיר לְאֶלְעָזָר בַּר אַהֲרן כַּהֲנָא מִשְׁחָא דְאַנְהָרוּתָא וּקְטוֹרֶת בּוּסְמַיָא וּמִנְחָה דִתְדִירָא וּמִשְׁחָא דִרְבוּתָא מַטְרַת כָּל מַשְׁכְּנָא וְכָל דְבֵיהּ בְּקוּדְשָׁא וּבְמָנוֹי", "pj_en": "And that delivered to Elazar bar Aharon the priest shall be the oil for the light, the aromatic incense, the perpetual mincha, the oil of anointing, and the custody of all the tabernacle, and whatever is in it in the sanctuary and its vessels.", "tj": "", "tj_en": "", "rashi": "<b>ופקדת אלעזר.<\/b> שֶׁהוּא מְמֻנֶּה עֲלֵיהֶם לָשֵֹאת אוֹתָם, שֶׁמֶן וּקְטֹרֶת וְשֶׁמֶן הַמִּשְׁחָה, <b>ומנחת התמיד<\/b> — עָלָיו מֻטָּל לְצַוּוֹת וּלְזָרֵז וּלְהַקְרִיב בְּעֵת חֲנִיָּתָן (תלמוד ירושלמי שבת פ\"י):<br><br><b>פקדת כל המשכן.<\/b> וְעוֹד הָיָה מְמֻנֶּה עַל מַשָּׂא בְנֵי קְהָת, לְצַוּוֹת אִישׁ עַל עֲבוֹדָתוֹ וְעַל מַשָּׂאוֹ, וְהוּא <b>המשכן וכל אשר בו<\/b>, כָּל הַסְּדוּרִים לְמַעְלָה בְּפָרָשָׁה זוֹ, אֲבָל מַשָּׂא בְנֵי גֵרְשׁוֹן וּמְרָרִי שֶׁאֵינָהּ מִקֹּדֶשׁ הַקֳּדָשִׁים עַ\"פִּ אִיתָמָר הָיָה, כְּמוֹ שֶׁכָּתוּב בְּפָרָשַׁת נָשֹׂא:", "rashi_en": "ופקדת אלעזר AND THE CHARGE OF ELEAZAR … [WERE THE OIL FOR THE LIGHT, AND THE INCENSE OF AROMATICS, AND THE CONTINUAL MEAL OFFERING, AND THE ANOINTING OIL] — This means: the charge of Eleazar who was appointed over them to carry them were the oil, and the incense and the anointing oil. As regards the continual meal-offering mentioned here, upon him lay the charge to give orders and to urge on that it should be offered at the time when they encamped.<br><br>פקדת כל המשכן means: and further he was appointed over the burden of the sons of Kohath, i.e., to give each man orders regarding his service and his burden, which was the Tabernacle and all that was therein — all the articles set forth above in this section. The burden of the sons of Gershon and of the sons of Merari, however, which did not appertain to things of most holy character, was carried out by order of Ithamar, as is set forth in the section commencing with the word נשא (vv. 21—34)."}, {"ch": 4, "v": 17, "aliyah": 7, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 18, "aliyah": 7, "heb": "אַל־תַּכְרִ֕יתוּ אֶת־שֵׁ֖בֶט מִשְׁפְּחֹ֣ת הַקְּהָתִ֑י מִתּ֖וֹךְ הַלְוִיִּֽם׃", "onk": "לָא תְשֵׁיצוּן יָת שִׁבְטָא זַרְעֲיַת קְהָת מִגּוֹ לֵו
