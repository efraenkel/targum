 one of those cities, and be spared alive.", "tj": "דִּי יִקְטוֹל יַת חַבְרֵיהּ בִּתְכּוֹף דְּלָא יְדַע וְהוּא לָא הֲוָה סָנֵי לֵיהּ מִדְאֶתְמוֹל וּלְאַדְקָדָמוֹי:", "tj_en": "Who had slain his neighbour unawares, but had not entertained enmity toward him yesterday or before.", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 43, "aliyah": 3, "heb": "אֶת־בֶּ֧צֶר בַּמִּדְבָּ֛ר בְּאֶ֥רֶץ הַמִּישֹׁ֖ר לָרֽאוּבֵנִ֑י וְאֶת־רָאמֹ֤ת בַּגִּלְעָד֙ לַגָּדִ֔י וְאֶת־גּוֹלָ֥ן בַּבָּשָׁ֖ן לַֽמְנַשִּֽׁי׃", "onk": "יָת בֶּצֶר בְּמַדְבְּרָא בְּאַרְעָא מֵישְׁרָא <b>לְשִׁבְטָא<\/b> דִרְאוּבֵן וְיָת רָאמוֹת בַּגִּלְעָד <b>לְשִׁבְטָא<\/b> דְגָד וְיָת גּוֹלָן בְּמַתְנָן <b>לְשִׁבְטָא<\/b> דִמְנַשֶּׁה:", "onk_en": "Betzer in the wilderness in the plains [<b>of the tribe<\/b>] of the Reuvenites, Romos in the Gil’od [<b>of the tribe<\/b>] of the Gaddites, and Golon in the Boshon [<b>of the tribe<\/b>] of the Menashians.", "pj": "יַת כְּוָתִירִין בְּמַדְבְּרָא בְּאַרַע מִישְׁרָא לְשֵׁבֶט רְאוּבֵן וְיַת רָמָתָא בְגִלְעָד לְשֵׁבֶט גָּד וְיַת דַּבְרָא בְּמַתְנָן לְשֵׁבֶט מְנַשֶּׁה", "pj_en": "Kevatirin the wilderness, in the plain country, for the tribe of Reuben, and Ramatha in Gilead for the tribe of Gad, and Dabera in Mathnan for the tribe of Menasheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 44, "aliyah": 3, "heb": "וְזֹ֖את הַתּוֹרָ֑ה אֲשֶׁר־שָׂ֣ם מֹשֶׁ֔ה לִפְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְדָא אוֹרַיְתָא דִּי <b>סַדַּר<\/b> משֶׁה קֳדָם בְּנֵי יִשְׂרָאֵל:", "onk_en": "And this is the Torah that Moshe set [<b>in order<\/b>] before Bnei Yisroel.", "pj": "וְדָא אַחְוָיַת אוֹרַיְיתָא דִי סַדֵּר משֶׁה קֳדָם בְּנֵי יִשְרָאֵל", "pj_en": "This is the declaration of the law which Mosheh set in order before the sons of Israel", "tj": "וְדָא אֲחוּיַית אוֹרַיְיתָא דְשַׁוֵי משֶׁה קֳדָם בְּנֵי יִשְרָאֵל:", "tj_en": "This is the declaration of the law which Mosheh set before the sons of Israel.", "rashi": "<b>וזאת התורה.<\/b> זוֹ שֶׁהוּא עָתִיד לְסַדֵּר אַחַר פָּרָשָׁה זוֹ:", "rashi_en": "וזאת התורה AND THIS IS THE LAW — this which he was about to set forth after this chapter."}, {"ch": 4, "v": 45, "aliyah": 3, "heb": "אֵ֚לֶּה הָֽעֵדֹ֔ת וְהַֽחֻקִּ֖ים וְהַמִּשְׁפָּטִ֑ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל בְּצֵאתָ֖ם מִמִּצְרָֽיִם׃", "onk": "אִלֵּין סָהֶדְוָתָא וּקְיָמַיָּא וְדִינַיָּא דִּי מַלִּיל משֶׁה עִם בְּנֵי יִשְׂרָאֵל בְּמִפָּקְהוֹן מִמִּצְרָיִם:", "onk_en": "These are the testimonies and the statutes and the laws that Moshe addressed to Bnei Yisroel when they came out of Egypt.", "pj": "אִלֵין סָהִידְוָותָא וּקְיָמַיָא וְדִינַיָא דְמַלֵיל משֶׁה עִם בְּנֵי יִשְרָאֵל בִּזְמַן מִפַּקְהוֹן מִמִּצְרָיִם", "pj_en": "and the statutes and judgments which Mosheh spake with the sons of Israel at the time when they had come out of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>אלה העדת, אשר דבר.<\/b> הֵם הֵם אֲשֶׁר דִּבֵּר בְּצֵאתָם מִמִּצְרַיִם, חָזַר וּשְׁנָאָהּ לָהֶם בְּעַרְבוֹת מוֹאָב:", "rashi_en": "אלה העדות … אשר דבר THESE ARE THE TESTIMONIES … WHICH [MOSES] SPAKE — Those are the very same testimonies which he spoke when they came forth from Egypt; and he again repeated it (this law) to them in the plains of Moab."}, {"ch": 4, "v": 46, "aliyah": 3, "heb": "בְּעֵ֨בֶר הַיַּרְדֵּ֜ן בַּגַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּאֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽאֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּחֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּבְנֵ֣י יִשְׂרָאֵ֔ל בְּצֵאתָ֖ם מִמִּצְרָֽיִם׃", "onk": "בְּעִבְרָא דְיַרְדְּנָא בְּחֵילָתָא לָקֳבֵל בֵּית פְּעוֹר בְּאַרְעָא דְּסִיחֹן מַלְכָּא דֶאֱמֹרָאָה דִּי יָתֵב בְּחֶשְׁבּוֹן דִּי מְחָא משֶׁה וּבְנֵי יִשְׂרָאֵל בְּמִפָּקְהוֹן מִמִּצְרָיִם:", "onk_en": "Across the Yardein, in the valley facing Beis Peor, in the land of Sichon, King of the Emorites, who lived in Cheshbon, whom Moshe and Bnei Yisrael smote when they came out of Egypt.", "pj": "וּתְנָנוּן משֶׁה בְּעִבְרָא דְיוֹרְדְּנָא בְּחֵילְתָא לְקָבֵיל בֵּית פְּעוֹר בְּאַרַע סִיחוֹן מַלְכָּא דֶאֱמוֹרָאֵי דְיָתֵיב בְּחוּשְׁבְּנָא דִמְחָא משֶׁה וּבְנֵי יִשְרָאֵל בְּמִפַּקְהוֹן מִמִּצְרָיִם", "pj_en": "And Mosheh delivered them beyond Jordan over against Beth Peor, in the land of Sihon king of the Amoraee, who dwelt in Heshbon, whom Mosheb and the sons of Israel smote when the had come out of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 47, "aliyah": 3, "heb": "וַיִּֽירְשׁ֨וּ אֶת־אַרְצ֜וֹ וְאֶת־אֶ֣רֶץ&thinsp;<b>׀<\/b> ע֣וֹג מֶֽלֶךְ־הַבָּשָׁ֗ן שְׁנֵי֙ מַלְכֵ֣י הָֽאֱמֹרִ֔י אֲשֶׁ֖ר בְּעֵ֣בֶר הַיַּרְדֵּ֑ן מִזְרַ֖ח שָֽׁמֶשׁ׃", "onk": "וִירִיתוּ יָת אַרְעֵיהּ וְיָת אַרְעָא דְּעוֹג מַלְכָּא <b>דְמַתְנָן<\/b> תְּרֵין מַלְכֵי אֱמֹרָאָה דִּי בְּעִבְרָא דְיַרְדְּנָא מִדְנַח שִׁמְשָׁא:", "onk_en": "They inherited his land and the land of Og, King of the Boshon [<b>Masnan<\/b>]—the two Emorite kings who were across the Yardein, where the sun rises.", "pj": "וְיָרִיתוּ יַת אַרְעֵיהּ וְיַת אַרְעָא דְעוֹג מַלְכָּא דְמַתְנָן תְּרֵין מַלְכֵי אֱמוֹרָאָה דִבְעִיבְרָא דְיוֹרְדְּנָא מַדְנַח שִׁמְשָׁא", "pj_en": "And they took possession of his land and the land of Og, king of Mathnan, the two kings of the Amoraee, who were beyond the Jordan, eastward,", "tj": "", "tj_en": "", "rashi": "<b>אשר בעבר הירדן.<\/b> שֶׁהוּא בַּמִּזְרָח, שֶׁהָעֵבֶר הַשֵּׁנִי הָיָה בַּמַּעֲרָב:", "rashi_en": "אשר בעבר הירדן WHO WERE BEYOND THE JORDAN  —  On the east side of Jordan, because the other side was on the west. [This means on the side opposite the western side.]"}, {"ch": 4, "v": 48, "aliyah": 3, "heb": "מֵעֲרֹעֵ֞ר אֲשֶׁ֨ר עַל־שְׂפַת־נַ֧חַל אַרְנֹ֛ן וְעַד־הַ֥ר שִׂיאֹ֖ן ה֥וּא חֶרְמֽוֹן׃", "onk": "מֵעֲרֹעֵר דִּי עַל כֵּיף נַחֲלָא דְאַרְנֹן וְעַד טוּרָא דְשִׂיאֹן הוּא חֶרְמוֹן:", "onk_en": "From Aroer, which is on the bank of Wadi Arnon, up to Mount Sion which is Chermon.", "pj": "מֵעֲרוֹעֵר דְּעַל גֵּיף נַחֲלֵי אַרְנוֹן וְעַד טַוְורָא דְסִיאוֹן הוּא טַוָור תַּלְגָא", "pj_en": "from Aroer on the bank of the river Arnon to the mountain of Saion, which is the Snowy Mount;", "tj": "מִן לְחָיַית דְּאִית עַל גַּב נַחַל אַרְנוֹנָא וְעַד טוּרָא דְמַסְרֵי פֵּירוֹי הוּא טוּר תַּלְגָא:", "tj_en": "From Lechaiath, on the side of the river Arnona, unto the mountain whose fruits are delivered, which is the Snowy Mount;", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 49, "aliyah": 3, "heb": "וְכׇל־הָ֨עֲרָבָ֜ה עֵ֤בֶר הַיַּרְדֵּן֙ מִזְרָ֔חָה וְעַ֖ד יָ֣ם הָעֲרָבָ֑ה תַּ֖חַת אַשְׁדֹּ֥ת הַפִּסְגָּֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְכָל מֵישְׁרָא עִבְרָא דְיַרְדְּנָא לְמָדִינְחָא וְעַד יַמָּא דְמֵישְׁרָא תְּחוֹת מַשְׁפַּךְ מְרָמָתָא:", "onk_en": "And the entire Arava across the Yardein to the east, to Arava Lake, beneath the slopes of the Pisgah.", "pj": "וְכָל מֵישְׁרָא עִיבְרָא דְיוֹרְדְּנָא מַדִּינְחָא וְעַד יַמָא דְמֵישְׁרָא תְּחוֹת מַשְׁפַּךְ מְרָמָתָא", "pj_en": "and all the plain beyond Jordan, eastward, unto the sea that is in the plain under the spring of the heights.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 1, "aliyah": 4, "heb": "וַיִּקְרָ֣א מֹשֶׁה֮ אֶל־כׇּל־יִשְׂרָאֵל֒ וַיֹּ֣אמֶר אֲלֵהֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת־הַחֻקִּ֣ים וְאֶת־הַמִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּאׇזְנֵיכֶ֖ם הַיּ֑וֹם וּלְמַדְתֶּ֣ם אֹתָ֔ם וּשְׁמַרְתֶּ֖ם לַעֲשֹׂתָֽם׃", "onk": "וּקְרָא משֶׁה לְכָל יִשְׂרָאֵל וַאֲמַר לְהוֹן שְׁמַע יִשְׂרָאֵל יָת קְיָמַיָּא וְיָת דִּינַיָּא דִּי אֲנָא מְמַלֵּל קֳדָמֵיכוֹן יוֹמָא דֵין וְתַלְּפוּן יָתְהוֹן וְתִטְּרוּן לְמֶעְבָּדְהוֹן:", "onk_en": "Moshe called all of Yisroel and said to them, ‘‘Hear, Yisroel, the statutes and the laws that I am relating in your presence today, for you are to study them and to be careful to fulfill them.", "pj": "וּקְרָא משֶׁה לְכָל יִשְרָאֵל וַאֲמַר לְהוֹן שְׁמָעוּ יִשְרָאֵל יַת קְיָמַיָא וְיַת דִּינַיָא דַאֲנָא מְמַלֵיל קֳדָמֵיכוֹן יוֹמָא דֵין וְתִילְפוּן יַתְהוֹן וְתִינְטְרוּן לְמֶעֱבַדְהוֹן", "pj_en": "And Mosheh called all Israel, and said to them: Hear, Israel, the statutes and judgments that I speak before you this day, to learn them, and observe to per- form them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 2, "aliyah": 4, "heb": "יְהֹוָ֣ה אֱלֹהֵ֗ינוּ כָּרַ֥ת עִמָּ֛נוּ בְּרִ֖ית בְּחֹרֵֽב׃", "onk": "יְיָ אֱלָהָנָא גְזַר עִמָּנָא קְיָם בְּחֹרֵב:", "onk_en": "Adonoy, our God, made a covenant with us at Choreiv.", "pj": "יְיָ אֱלָהָנָא גְּזַר עִמָנָא קְיָים בְּחוֹרֵב", "pj_en": "The Lord our God confirmed a covenant with us in Horeb:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 3, "aliyah": 4, "heb": "לֹ֣א אֶת־אֲבֹתֵ֔ינוּ כָּרַ֥ת יְהֹוָ֖ה אֶת־הַבְּרִ֣ית הַזֹּ֑את כִּ֣י אִתָּ֔נוּ אֲנַ֨חְנוּ אֵ֥לֶּה פֹ֛ה הַיּ֖וֹם כֻּלָּ֥נוּ חַיִּֽים׃", "onk": "לָא עִם אֲבָהָתָנָא גְּזַר יְיָ יָת קְיָמָא הָדָא אֶלָּהֵן עִמָּנָא אֲנַחְנָא אִלֵּין הָכָא יוֹמָא דֵין כֻּלָּנָא קַיָּמִין:", "onk_en": "Not [only] with our fathers did Adonoy make this covenant, but with us, we who are here today, all of us alive.", "pj": "לָא עִם אַבְהָתָנָא גְזַר יְיָ יַת קְיָימָא הָדֵין אֱלָהֵן עִמָנָא אֲנַחְנָא אִלֵין הָכָא יוֹמָא דֵין כּוּלָנָא חַיִּין וְקַיָּימִין", "pj_en": "not with our fathers did the Lord confirm this covenant, but with us, who are all of us here this day alive and abiding.", "tj": "", "tj_en": "", "rashi": "<b>לא את אבתינו<\/b> בִּלְבַד <b>כרת ה' וגו'. כי אתנו וגו'<\/b>:", "rashi_en": "לא את אבתינו NOT WITH OUR FATHERS — i.e. not with them alone, כרת ה׳ וגו׳ DID THE LORD MAKE [THIS COVENANT], כי אתנו BUT WITH US etc.\n"}, {"ch": 5, "v": 4, "aliyah": 4, "heb": "פָּנִ֣ים&thinsp;<b>׀<\/b> בְּפָנִ֗ים דִּבֶּ֨ר יְהֹוָ֧ה עִמָּכֶ֛ם בָּהָ֖ר מִתּ֥וֹךְ הָאֵֽשׁ׃", "onk": "<b>מַמְלָל<\/b> עִם <b>מַמְלָל<\/b> מַלִּיל יְיָ עִמְּכוֹן בְּטוּרָא מִגּוֹ אֶשָּׁתָא:", "onk_en": "Face [<b>speech<\/b>] to face [<b>speech<\/b>] Adonoy spoke with you at the mountain from within the fire.", "pj": "מַמְלֵיל קֳבֵיל מַמְלֵיל מַלֵיל יְיָ עִמְכוֹן בְּטַוְורָא מִגוֹ אֵשָׁתָא", "pj_en": "Word to word did the Lord speak with you at the mountain from the midst of the fire.", "tj": "", "tj_en": "", "rashi": "<b>פנים בפנים.<\/b> אָ\"רַ בֶרֶכְיָה: כָּךְ אָמַר מֹשֶׁה, אַל תֹּאמְרוּ אֲנִי מַטְעֶה אֶתְכֶם עַל לֹא דָבָר, כְּדֶרֶךְ שֶׁהַסַּרְסוּר עוֹשֶׂה בֵּין הַמּוֹכֵר לַלּוֹקֵחַ, הֲרֵי הַמּוֹכֵר עַצְמוֹ מְדַבֵּר עִמָּכֶם (פסיקתא רבתי):", "rashi_en": "  פנים בפנים FACE TO FACE — R. Berechia said: Thus did Moses, in effect, say: Do not think that I am misleading you with something which does not exist at all, as an agent does acting between the vendor and the purchaser; behold, the seller Himself is speaking to you (God who transmitted the Torah to you) (cf. Pesikta Rabbati 21: Pesachim Rabbah פ' י' הדברות קמייתא‎)."}, {"ch": 5, "v": 5, "aliyah": 4, "heb": "אָ֠נֹכִ֠י עֹמֵ֨ד בֵּין־יְהֹוָ֤ה וּבֵֽינֵיכֶם֙ בָּעֵ֣ת הַהִ֔וא לְהַגִּ֥יד לָכֶ֖ם אֶת־דְּבַ֣ר יְהֹוָ֑ה כִּ֤י יְרֵאתֶם֙ מִפְּנֵ֣י הָאֵ֔שׁ וְלֹֽא־עֲלִיתֶ֥ם בָּהָ֖ר לֵאמֹֽר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲנָא הֲוֵיתִי קָאֵם בֵּין <b>מֵימְרָא<\/b> דַיְיָ וּבֵינֵיכוֹן בְּעִדָּנָא הַהִיא לְחַוָּאָה לְכוֹן יָת פִּתְגָּמָא דַיְיָ אֲרֵי דְחֶלְתּוּן <b>מִקֳּדָם<\/b> אֶשָּׁתָא וְלָא סְלֶקְתּוּן בְּטוּרָא לְמֵימָר:", "onk_en": "I was standing between [<b>the word of<\/b>] Adonoy and you at that time, to tell you Adonoy’s word, because you were afraid of [<b>before<\/b>] the fire and did not go up on the mountain, saying:", "pj": "אֲנָא הֲוֵית קָאֵים בֵּין מֵימְרָא דַיְיָ וּבֵינֵיכוֹן בְּעִידָנָא הַהוּא לְמִתְנַיָא לְכוֹן יַת פִּתְגָמַיָא דַיְיָ אֲרוּם דְּחֵלְתּוּן מִן קֳדָם קַל מֵימְרָא דַיְיָ דְּמִשְׁתַּמַע מִגוֹ אֵישָׁתָא וְלָא סְלֵיקְתּוּן בְּטוּרָא כַּד אָמַר", "pj_en": "I stood between the Word of the Lord and you at that time, to declare to you the word of the Lord, because you were afraid before the voice of the Word of the Lord, which you heard from the midst of the fire; neither did you go up to the mountain while He said:", "tj": "", "tj_en": "", "rashi": "<b>לאמר.<\/b> מוּסָב עַל <b>דבר ה' עמכם בהר מתוך האש, לאמר אנכי ה' וגו' ואנכי עומד בין ה' וביניכם<\/b>:", "rashi_en": "לאמר SAYING — This is to be connected with (v. 4), דבר ה' עמכם בהר מתוך האש “[face to face] the Lord spake with you in the mount out of the midst of the fire”, — לאמר, אנכי וגו׳, saying. “I am the Lord, etc.\", ואנכי עמד בין ה׳ וביניכם WHILST I STOOD BETWEEN THE LORD AND YOU."}, {"ch": 5, "v": 6, "aliyah": 4, "heb": "אָֽנֹכִ֖י֙ יְהֹוָ֣ה אֱלֹהֶ֑֔יךָ אֲשֶׁ֧ר הוֹצֵאתִ֛יךָ מֵאֶ֥רֶץ מִצְרַ֖יִם מִבֵּ֣֥ית עֲבָדִ֑͏ֽים׃", "onk": "אֲנָא יְיָ אֱלָהָךְ דִּי אַפֵּקְתָּךְ מֵאַרְעָא דְמִצְרַיִם מִבֵּית עַבְדּוּתָא:", "onk_en": "‘‘I am Adonoy, your God, Who took you out of the land of Egypt, the house of slavery.", "pj": "עַמִּי בְּנֵי יִשְרָאֵל אֲנָא הוּא יְיָ אֱלָהָכוֹן דִּי פְרָקִית וְאַפֵּיקִית יַתְכוֹן פְּרִיקִין מִן אַרְעָא דְמִצְרָאֵי מִבֵּית שִׁעֲבּוּד עַבְדַיָא", "pj_en": "Sons of Israel, My people, I am the Lord your God, who made and led you out free from the land of Mizraim, from the house of the bondage of slaves.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 7, "aliyah": 4, "heb": "לֹ֣א־יִהְיֶ֥͏ֽה־לְךָ֛֩ אֱלֹהִ֥֨ים אֲחֵרִ֖֜ים עַל־פָּנָֽ͏ַ֗י׃", "onk": "לָא יְהֵא לָךְ אֱלָהָא אָחֳרָן <b>בַּר מִנִּי<\/b>:", "onk_en": "You will not have any other gods in My Presence [<b>except for Me<\/b>].", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא יֶהֱוֵי לְכוֹן אֱלָהָא אוֹחֲרָן בַּר מִינִי", "pj_en": "Sons of Israel, My people, no other god shall you have beside Me.", "tj": "", "tj_en": "", "rashi": "<b>על פני.<\/b> בְּכָל מָקוֹם אֲשֶׁר אֲנִי שָׁם, וְזֶהוּ כָּל הָעוֹלָם. דָּ\"אַ — כָּל זְמַן שֶׁאֲנִי קַיָּם. עֲשֶׂרֶת הַדִּבְּרוֹת כְּבָר פֵּרַשְׁתִּים:", "rashi_en": "על פני BEFORE ME — i.e. in any place where I am, and that is the entire world. Another explanation: so long as I exist (i.e. always) (Mekhilta). — The Ten Commandments — I have already explained them (Exodus 20:1-14)."}, {"ch": 5, "v": 8, "aliyah": 4, "heb": "לֹֽ֣א־תַעֲשֶֽׂ֨ה־לְךָ֥֣ פֶ֣֙סֶל֙&thinsp;<small>׀<\/small>&thinsp;כׇּל־תְּמוּנָ֔֡ה אֲשֶׁ֤֣ר בַּשָּׁמַ֣֙יִם֙&thinsp;<small>׀<\/small>&thinsp;מִמַּ֔֡עַל וַאֲשֶׁ֥ר֩ בָּאָ֖֨רֶץ מִתָּ֑͏ַ֜חַת וַאֲשֶׁ֥ר בַּמַּ֖֣יִם&thinsp;<b>׀<\/b> מִתַּ֥֣חַת לָאָֽ֗רֶץ׃", "onk": "לָא תַעְבֵּד לָךְ צֶלֶם כָּל דְּמוּת דִּי בִשְׁמַיָּא מִלְּעֵלָּא וְדִי בְאַרְעָא מִלְּרָע וְדִי בְמַיָּא מִלְּרַע לְאַרְעָא:", "onk_en": "Do not make for yourself a statue of any representation that is in the skies above or that is on the earth below, or that is in the water beneath the earth.", "pj": "וְלָא תַעַבְדוּן לְכוֹן צְלַם וְכָל דְּמוּ דְבִשְׁמַיָא מִלְעֵיל וְדִי בְאַרְעָא מִלְרַע וְדִי בְמַיָא מִלְרַע לְאַרְעָא", "pj_en": "You shall not make to you an image or the likeness of anything which is in the heavens above, or in the earth below, or in the waters under the earth:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 9, "aliyah": 4, "heb": "לֹא־תִשְׁתַּחֲוֶ֥֣ה לָהֶ֖ם֮ וְלֹ֣א תׇעׇבְדֵ֑ם֒ כִּ֣י אָנֹכִ֞י יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵ֠ד עֲוֺ֨ן אָב֧וֹת עַל־בָּנִ֛ים וְעַל־שִׁלֵּשִׁ֥ים וְעַל־רִבֵּעִ֖ים לְשֹׂנְאָֽ֑י׃", "onk": "לָא תִסְגּוּד לְהוֹן וְלָא תִפְלְחִנּוּן אֲרֵי אֲנָא יְיָ אֱלָהָךְ אֵל קַנָּא מַסְעַר חוֹבֵי אֲבָהָן עַל בְּנִין <b>מְרָדִין<\/b> עַל דַּר תְּלִיתַי וְעַל דַּר רְבִיעַי לְשַׂנְאָי <b>כַּד מְשַׁלְּמִין בְּנַיָּא לְמֶחֱטֵי בָּתַר אֲבָהָתְהוֹן<\/b>:", "onk_en": "Do not bow to them, and do not serve them, for I am Adonoy, your God, jealous Almighty, Who reckons the sin of parents for [<b>rebellious<\/b>] children and for the third generation and for the fourth generation of My enemies, [<b>when the children continue to sin after the fashion of their fathers,<\/b>]", "pj": "לָא תִסְגְּדוּן לְהוֹן וְלָא תִפְלְחוּן קֳדָמֵיהוֹן אֲרוּם אֲנָא הוּא יְיָ אֱלָהָכוֹן אֱלָהּ קַנְאָן וּפוּרְעָן וּמִתְפְּרַע בְּקִנְאָה מַדְכַּר חוֹבֵי אַבְהָן רַשִׁיעָן עַל בְּנִין מְרוֹדִין עַל דַּר תְּלִיתָאֵי וְעַל דַּר רְבִיעָאֵי לְסַנְאַי כַּד מְשַׁלְמִין בְּנַיָא לְמֶחֱטֵי בָּתַר אַבְהַתְהוֹן", "pj_en": "thou shalt not worship them or do service before them; for I am the Lord your God, a jealous and avenging God, taking vengeance in jealousy; remembering the sins of wicked fathers upon rebellious children to the third generation and to the fourth of them that hate Me, when the children complete to sin after their fathers;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 10, "aliyah": 4, "heb": "וְעֹ֥֤שֶׂה חֶ֖֙סֶד֙ לַֽאֲלָפִ֑֔ים לְאֹהֲבַ֖י וּלְשֹׁמְרֵ֥י <span class=\"mam-kq\"><span class=\"mam-kq-k\">(מצותו)<\/span> <span class=\"mam-kq-q\">[מִצְוֺתָֽי]<\/span><\/span>׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעָבֵד טֵיבוּ לְאַלְפֵי דָרִין לְרַחֲמַי וּלְנָטְרֵי פִקּוֹדָי:", "onk_en": "and performs kindliness for thousands [of generations] for those who love Me and for those who guard My commandments.", "pj": "וּנְטִיר חֶסֶד וְטִיבוּ לְאַלְפֵי דָרִין לְרַחֲמֵי צַדִּיקַיָא וּלְנַטְרֵי פִּקוּדַי וְאוֹרַיְיתָי", "pj_en": "but keeping mercy and bounty for a thousand generations of the righteous who love Me and keep My mandates and My laws.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 11, "aliyah": 4, "heb": "לֹ֥א תִשָּׂ֛א אֶת־שֵֽׁם־יְהֹוָ֥ה אֱלֹהֶ֖יךָ לַשָּׁ֑וְא כִּ֣י לֹ֤א יְנַקֶּה֙ יְהֹוָ֔ה אֵ֛ת אֲשֶׁר־יִשָּׂ֥א אֶת־שְׁמ֖וֹ לַשָּֽׁוְא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תֵימֵי יָת שְׁמָא דַיְיָ אֱלָהָךְ לְמַגָּנָא אֲרֵי לָא יְזַכֵּי יְיָ יָת דִּי יֵמֵי בִשְׁמֵיהּ <b>לְשִׁקְרָא<\/b>:", "onk_en": "Do not swear using the Name of Adonoy, your God, in vain; for Adonoy will not hold innocent whoever swears by His Name in vain [<b>in a lie<\/b>].", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא יִשְׁתְּבַּע חָד מִנְכוֹן בְּשׁוּם מֵימְרֵיהּ דַיְיָ אֱלָהָכוֹן עַל מַגַן אֲרוּם לָא מְזַכֵּי יְיָ בְּיוֹם דִינָא רַבָּא יַת כָּל מַאן דְּמִשְׁתְּבַּע בִּשְׁמֵיהּ עַל מַגָן", "pj_en": "Sons of Israel, My people, no one of you shall swear by the Name of the Word of the Lord your God in vain: for the Lord, in the day of the great judgment, will not acquit any one who shall swear by His Name in vain.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 12, "aliyah": 4, "heb": "שָׁמ֛֣וֹר אֶת־י֥וֹם֩ הַשַּׁבָּ֖֨ת לְקַדְּשׁ֑֜וֹ כַּאֲשֶׁ֥ר צִוְּךָ֖֣&thinsp;<b>׀<\/b> יְהֹוָ֥֣ה אֱלֹהֶֽ֗יךָ׃", "onk": "טַר יָת יוֹמָא דְשַׁבְּתָא לְקַדָּשׁוּתֵיהּ כְּמָא דִי פַקְדָּךְ יְיָ אֱלָהָךְ:", "onk_en": "Preserve the day of Shabbos to sanctify it, as Adonoy, your God, commanded you.", "pj": "עַמִי בְּנֵי יִשְרָאֵל הֲווֹ נַטְרִין יַת יוֹמָא דְשַׁבְּתָא לִמְקַדְשָׁא יָתֵיהּ הֵיכְמָא דְפַקֵּיד יַתְכוֹן יְיָ אֱלָהָכוֹן", "pj_en": "Sons of Israel, My people, observe the day of Sabbath, to sanctify it according to all that the Lord your God hath commanded.", "tj": "", "tj_en": "", "rashi": "<b>שמור.<\/b> וּבָרִאשׁוֹנוֹת הוּא אוֹמֵר \"זָכוֹר\", שְׁנֵיהֶם בְּדִבּוּר אֶחָד וּבְתֵבָה אַחַת נֶאֶמְרוּ, וּבִשְׁמִיעָה אַחַת נִשְׁמְעוּ (מכילתא):<br><br><b>כאשר צוך.<\/b> קֹדֶם מַתַּן תּוֹרָה בְּמָרָה (שבת פ\"ז):", "rashi_en": "שמור OBSERVE [THE SABBATH DAY] — But in the former Ten Commandments (i.e. where they were first promulgated, in Exodus XX.), it states, “Remember [the Sabbath day]\"! The explanation is: Both of them (זכור and שמור) were spoken in one utterance and as one word, and were heard in one hearing (i.e. were heard simultaneously) (Mekhilta).<br><br>כאשר צוך [OBSERVE THE SABBATH DAY TO SANCTIFY IT] AS [THE LORD THY GOD] COMMANDED THEE before the giving of the Law, at Marah (Shabbat 87b)."}, {"ch": 5, "v": 13, "aliyah": 4, "heb": "שֵׁ֤֣שֶׁת יָמִ֣ים֙ תַּֽעֲבֹ֔ד֮ וְעָשִׂ֖֣יתָ כׇּֿל־מְלַאכְתֶּֽךָ֒׃", "onk": "שִׁתָּא יוֹמִין תִּפְלָח וְתַעְבֵּד כָּל עִבִדְתָּךְ:", "onk_en": "Six days will you work and perform all your labor,", "pj": "שִׁתָּא יוֹמִין תִּפְלְחוּן וְתַעַבְדוּן כָּל עִיבִידְתְּכוֹן", "pj_en": "Six days you shall labour and do all your work,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 14, "aliyah": 4, "heb": "וְי֨וֹם֙ הַשְּׁבִיעִ֔֜י שַׁבָּ֖֣ת&thinsp;<b>׀<\/b> לַיהֹוָ֣ה אֱלֹהֶ֑֗יךָ לֹ֣א תַעֲשֶׂ֣ה כׇל־מְלָאכָ֡ה אַתָּ֣ה וּבִנְךָֽ־וּבִתֶּ֣ךָ וְעַבְדְּךָֽ־וַ֠אֲמָתֶ֠ךָ וְשׁוֹרְךָ֨ וַחֲמֹֽרְךָ֜ וְכׇל־בְּהֶמְתֶּ֗ךָ וְגֵֽרְךָ֙ אֲשֶׁ֣ר בִּשְׁעָרֶ֔יךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּךָ֥ וַאֲמָתְךָ֖ כָּמֽ֑וֹךָ׃", "onk": "וְיוֹמָא שְׁבִיעָאָה שַׁבְּתָא קֳדָם יְיָ אֱלָהָךְ לָא תַעְבֵּד כָּל עִבִידָא אַתְּ וּבְרָךְ וּבְרַתָּךְ וְעַבְדָּךְ וְאַמְתָךְ וְתוֹרָךְ וַחֲמָרָךְ וְכָל בְּעִירָךְ וְגִיּוֹרָךְ דִּי <b>בְקִרְוָךְ<\/b> בְּדִיל דִּי יְנוּחַ עַבְדָּךְ וְאַמְתָךְ כְּוָתָךְ:", "onk_en": "but the seventh day, Shabbos for Adonoy, your God, do not perform any labor—you, your son and your daughter, your male slave and your female slave, your ox and your donkey and all your animals, and the non-Jew who dwells in your cities [<b>midst<\/b>]—in order that your male slave will rest—and your female slave—like you.", "pj": "וְיוֹמָא שְׁבִיעָאָה שַׁב וְנַיַיח קֳדָם יְיָ אֱלָהָכוֹן לָא תַעַבְדוּן כָּל עִיבִידְתָּא אַתּוּן וּבְנֵיכוֹן וּבְנָתֵיכוֹן וְעַבְדֵיכוֹן וְאַמְהָתֵיכוֹן וְתוֹרֵיכוֹן וְחַמְרֵיכוֹן וְכָל בְּעִירֵיכוֹן וְגִיוֹרֵיכוֹן דִּי בְקִרְוֵיכוֹן מִן בִּגְלַל דִּינוּחוּן עַבְדֵיכוֹן וְאַמְהָתֵיכוֹן כְּוַותְכוֹן", "pj_en": "but the seventh day (shall be for) rest and quiet before the Lord your God; ye shall do no work, neither you, nor your sons, nor your daughters, nor your servants, nor your handmaids, nor your oxen, your asses, nor any of your cattle, nor your sojourners who are among you; that your servants and handmaids may have repose as well as you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 15, "aliyah": 4, "heb": "וְזָכַרְתָּ֗֞ כִּ֣י־עֶ֤֥בֶד הָיִ֣֙יתָ֙&thinsp;<b>׀<\/b> בְּאֶ֣רֶץ מִצְרַ֔֗יִם וַיֹּצִ֨אֲךָ֜֩ יְהֹוָ֤֨ה אֱלֹהֶ֤֙יךָ֙ מִשָּׁ֔ם֙ בְּיָ֥֤ד חֲזָקָ֖ה֙ וּבִזְרֹ֣עַ נְטוּיָ֑֔ה עַל־כֵּ֗ן צִוְּךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לַעֲשׂ֖וֹת אֶת־י֥וֹם הַשַּׁבָּֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִדְכַּר אֲרֵי עַבְדָּא הַוֵיתָא בְּאַרְעָא דְמִצְרַיִם וְאַפְּקָךְ יְיָ אֱלָהָךְ מִתַּמָּן בִּידָא תַקִּיפָא וּבִדְרָעָא מְרָמָא עַל כֵּן פַּקְּדָךְ יְיָ אֱלָהָךְ לְמֶעְבַּד יָת יוֹמָא דְשַׁבְּתָא:", "onk_en": "Remember that you were a slave in the land of Egypt, and Adonoy, your God, took you out of there with a strong hand and an extended arm. That is why Adonoy, your God, commanded you to celebrate the Shabbos day.", "pj": "וְתֶהֱווֹן דְּכִירִין אֲרוּם מְשַׁעְבְּדוּן הֲוֵיתוּן בְּאַרְעָא דְמִצְרָיִם וּפְרַק וְאַפֵּיק יְיָ אֱלָהָכוֹן יַתְכוֹן מִתַּמָּן בִּידָא תַּקִּיפָא וּבִדְרַע מְרַמַּם בְּגִין כֵּן פַּקְדָךְ יְיָ אֱלָהָךְ לְמֶעֱבַד יַת יוֹמָא דְשַׁבְּתָא", "pj_en": "And remember that you were servants in the land of Mizraim, and that the Lord your God delivered and led you out with a strong hand and uplifted arm; therefore the Lord thy God hath commanded thee to keep the Sabbath day.", "tj": "", "tj_en": "", "rashi": "<b>וזכרת כי עבד היית וגו'.<\/b> עַל מְנָת כֵּן פְּדָאֲךָ שֶׁתִּהְיֶה לוֹ עֶבֶד וְתִשְׁמֹר מִצְווֹתָיו:", "rashi_en": "וזכרת כי עבד היית וגו׳ AND THOU SHALT REMEMBER THAT THOU WAST A SLAVE [IN THE LAND OF EGYPT … AND THE LORD BROUGHT THEE FORTH FROM THERE … THEREFORE HE COMMANDS THEE TO KEEP THE SABBATH DAY] — On that condition He freed you — that you should be a servant to Him and observe His commandments."}, {"ch": 5, "v": 16, "aliyah": 4, "heb": "כַּבֵּ֤ד אֶת־אָבִ֙יךָ֙ וְאֶת־אִמֶּ֔ךָ כַּאֲשֶׁ֥ר צִוְּךָ֖ יְהֹוָ֣ה אֱלֹהֶ֑יךָ לְמַ֣עַן&thinsp;<b>׀<\/b> יַאֲרִיכֻ֣ן יָמֶ֗יךָ וּלְמַ֙עַן֙ יִ֣יטַב לָ֔ךְ עַ֚ל הָֽאֲדָמָ֔ה אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֥ן לָֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יַקַּר יָת אֲבוּךְ וְיָת אִמָּךְ כְּמָא דִי פַקְּדָךְ יְיָ אֱלָהָךְ בְּדִיל דְּיוֹרְכוּן יוֹמָיךְ וּבְדִיל דְּיוֹטֶב לָךְ עַל אַרְעָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ:", "onk_en": "Honor your father and your mother in the way Adonoy, your God, commanded you; in order that you live long and in order that you have it good on the land that Adonoy, your God, is giving you.", "pj": "עַמִי בְּנֵי יִשְרָאֵל הֲווֹ זְהִירִין גְּבַר בְּאִיקָרָא דְאָבוֹי וּבְאִיקָרָא דְאִימֵיהּ הֵיכְמָא דְפַקִידְכוֹן יְיָ אֱלָהָכוֹן מִן בִּגְלַל דְּיוֹרְכוּן יְמֵיכוֹן וּמִן בִּגְלַל דְּיֵיטַב לְכוֹן עַל אַרְעָא דַיְיָ אֱלָהָכוֹן יָהִיב לְכוֹן", "pj_en": "Sons of Israel, My people, be every one mindful of the honour of his father and his mother, as the Lord your God hath commanded you, that your days may be proIonged, and it may be well with you in the land which the Lord your God giveth you.", "tj": "", "tj_en": "", "rashi": "<b>כאשר צוך.<\/b> אַף עַל כִּבּוּד אָב וָאֵם נִצְטַוּוּ בְמָרָה שֶׁנֶּאֱמַר (שמות ט\"ו) שָׁם שָׂם לוֹ חֹק וּמִשְׁפָּט (סנהדרין נ\"ו):", "rashi_en": "כאשר צוך [HONOUR THY FATHER AND THY MOTHER] AS THE LORD THY GOD HATH COMMANDED THEE — Also regarding honouring parents they received command at Marah, as it is said, (Exodus 15:25) “There He appointed for them a statute and a judgement” (cf. Rashi on that passage and Note p. 243) (Sanhedrin 56b)."}, {"ch": 5, "v": 17, "aliyah": 4, "heb": "לֹ֥֖א תִּֿרְצָ֖͏ֽח׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְלֹ֣֖א תִּֿנְאָ֑͏ֽף׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְלֹ֣֖א תִּֿגְנֹֽ֔ב׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְלֹֽא־תַעֲנֶ֥ה בְרֵֽעֲךָ֖ עֵ֥ד שָֽׁוְא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תִקְטוֹל <b>נְפָשׁ<\/b>. וְלָא תְגוּף. וְלָא תִגְנוֹב. וְלָא תַסְהֵד בְּחַבְרָךְ סַהֲדוּתָא דְשִׁקְרָא:", "onk_en": "Do not murder [<b>a person<\/b>]. Do not commit adultery. And do not kidnap. And do not testify against your neighbor in vain.", "pj": "עַמִי בְּנֵי יִשְרָאֵל לָא תֶהֱווֹן קָטוֹלִין לָא חַבְרִין וְלָא שׁוּתָּפִין עִם קָטוֹלִין וְלָא יִתְחָמֵי בִּכְנִישַׁתְהוֹן דְּיִשְרָאֵל עִם קָטוֹלִין דְּלָא יְקוּמוּן בְּנֵיכוֹן מִן בַּתְרֵיכוֹן וְיֵלְפוּן לְהוֹן הִינוּן לְמֶהֱוֵי עִם קָטוֹלִין אֲרוּם בְּחוֹבֵי קָטוֹלַיָא חַרְבָּא נָפִיק עַל עַלְמָא עַמִי בְּנֵי יִשְרָאֵל לָא תֶהֱווֹן גִּיּוֹרִין לָא חַבְרִין וְלָא שׁוּתָּפִין עִם גִּיּוֹרִין וְלָא יִתְחָמֵי בִּכְנִישַׁתְהוֹן דְּיִשְרָאֵל עִם גִּיּוֹרִין דְּלָא יְקוּמוּן בְּנֵיכוֹן מִן בַּתְרֵיכוֹן וְיֵלְפוּן לְהוֹן הִינוּן לְמֶהֱוֵי עִם גִּיּוֹרִין אֲרוּם בְּחוֹבֵי גִיוֹרָא מוֹתָא נָפִיק עַל עַלְמָא עַמִי בְּנֵי יִשְרָאֵל לָא תֶהֱווֹן גַּנָּבִין לָא חַבְרִין וְלָא שׁוּתָּפִין עִם גַּנָּבִין וְלָא יִתְחָמֵי בִּכְנִישַׁתְהוֹן דְּיִשְרָאֵל עִם גַּנָּבִין אֲרוּם בְּחוֹבֵי גַנָבַיָא כַּפְנָא נָפִיק עַל עַלְמָא עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווֹן מְסַהֲדִין סַהֲדֵי דְשִׁיקְרָא לָא חַבְרִין וְלָא שׁוּתָּפִין עִם מְסַהֲדֵי סַהֲדֵי דְשִׁיקְרָא וְלָא יִתְחָמֵי בִּכְנִישַׁתְהוֹן דְּיִשְרָאֵל עִם מְסַהֲדִין סַהֲדֵי דְשִׁקְרָא אֲרוּם בְּחוֹבֵי מְסַהֲדֵי שִׁקְרָא עֲנָנִין סַלְקִין וּמִטְרָא לָא נָחִית וּבַצוֹרְתָא אָתֵי עַל עַלְמָא", "pj_en": "Sons of Israel, My people, you shall not murder, nor be companions or participators with those who do murder, nor shall there be seen in the congregations of Israel (those who have part) with murderers; that your children may not arise after you, and teach their own to have part with murderers; for because of the guilt of murder the sword cometh forth upon the world. Sons of Israel, My people, you shall not be adulterers, nor companions of, or have part with, adulterers; neither shall there be seen in the congregations of Israel (those who have part) with adulterers, and that your children may not arise after you, and teach theirs also to be with adulterers; for through the guilt of adulteries the plague cometh forth upon the world. Sons of Israel, My people, you shall not be thieves, nor be companions nor have fellowship with thieves, nor shall there be seen in the congregations of Israel (those who have part)with theives; for because of the guilt of robberies famine cometh forth on the world. Sons of Isreal, My people, you shall not bear false witness, nor be companions or have fellowship with the bearers of false testimony; neither shall there be seen in the congregations of Isreal those who (have part) with false witnesses; for because of the guilt of false witnesses the clouds arise, but the rain does not come down, and dearth cometh on the world.", "tj": "", "tj_en": "", "rashi": "<b>ולא תנאף.<\/b> אֵין לְשׁוֹן נִאוּף אֶלָּא בְאֵשֶׁת אִישׁ:", "rashi_en": "ולא תנאף AND THOU SHALT NOT COMMIT ADULTERY — The term ניאוף, “adultery”, is technically only applicable in the case of a married woman."}, {"ch": 5, "v": 18, "aliyah": 4, "heb": "וְלֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑ךָ&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְלֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗ךָ שָׂדֵ֜הוּ וְעַבְדּ֤וֹ וַאֲמָתוֹ֙ שׁוֹר֣וֹ וַחֲמֹר֔וֹ וְכֹ֖ל אֲשֶׁ֥ר לְרֵעֶֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְלָא תַחְמֵד אִתַּת חַבְרָךְ וְלָא תֵרוֹג בֵּית חַבְרָךְ חַקְלֵיהּ וְעַבְדֵּיהּ וְאַמְתֵיהּ תּוֹרֵיהּ וַחֲמָרֵיהּ וְכֹל דִּי לְחַבְרָךְ:", "onk_en": "And do not covet your neighbor’s wife. And do not desire your neighbor’s house, his field, or his male slave or his female slave, his ox or his donkey, or anything else that belongs to your neighbor.’’", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תֶהֱווֹן חֲמוּדִין לָא חַבְרִין וְלָא שׁוּתָּפִין עִם חֲמוּדִין וְלָא יִתְחָמֵי בִּכְנִישַׁתְהוֹן דְּיִשְרָאֵל עִם חֲמוּדִין דְּלָא יְקוּמוּן בְּנֵיכוֹן מִן בַּתְרֵיכוֹן וְיֵלְפוּן לְהוֹן אִינוּן לְמֶהֱוֵי עִם חֲמוּדִין וְלָא יֵירוֹג חָד מִנְכוֹן יַת אִנְתְּתֵיהּ דְּחַבְרֵיהּ וְלָא יֵירוֹג חַד מִנְכוֹן יַת בֵּיתֵיהּ דְּחַבְרֵיהּ וְלָא חַקְלֵיהּ וְלָא עַבְדֵיהּ וְלָא אַמְתֵיהּ וְלָא תּוֹרֵיהּ וְלָא חַמְרֵיהּ וְלָא כָּל מַאן דְּאִית לְחַבְרֵיהּ אֲרוּם בְּחוֹבֵי חֲמוּדַיָא מַלְכוּתָא מִתְגַרְיָא בְּנִכְסֵיהוֹן דִּבְנֵי נְשָׁא לְמֵסַב יַתְהוֹן וְגָלוּתָא אַתְיָא עַל עַלְמָא", "pj_en": "Sons of Israel, My people, you shall not be covetous, nor be companions or have fellowship with the covetous; neither shall there be seen in the congregations of Israel any who (have part) with the covetous; that your children may not arise after you, and teach their own to be with the covetous. Nor let any one of you desire his neighbour’s wife, nor his field, nor his servant, nor his handmaid, nor his ox, nor his ass, nor anything that belongeth to his neighbour; for because of the guilt of covetousness the government (malkutha) seizeth upon men’s property to take it away, and bondage cometh on the world.", "tj": "", "tj_en": "", "rashi": "<b>ולא תתאוה.<\/b> וְלָא תֵרוֹג, אַף הוּא לְשׁוֹן חֶמְדָּה, כְּמוֹ נֶחְמָד לְמַרְאֶה (בראשית ב') דִּמְתַרְגְּמִינָן דִּמְרַגַּג לְמִחְזֵי:", "rashi_en": "ולא תתאוה — The Targum renders this by ולא תירוג which, too, is an expression denoting “desiring” (חמד the word used in the preceding part of this verse), just as (Genesis 2:9) “נחמד to the eyes”, we render in the Targum by “desirable (רגג) to behold”."}, {"ch": 5, "v": 19, "aliyah": 5, "heb": "אֶֽת־הַדְּבָרִ֣ים הָאֵ֡לֶּה דִּבֶּר֩ יְהֹוָ֨ה אֶל־כׇּל־קְהַלְכֶ֜ם בָּהָ֗ר מִתּ֤וֹךְ הָאֵשׁ֙ הֶֽעָנָ֣ן וְהָֽעֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְלֹ֣א יָסָ֑ף וַֽיִּכְתְּבֵ֗ם עַל־שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽיִּתְּנֵ֖ם אֵלָֽי׃", "onk": "יָת פִּתְגָּמַיָּא הָאִלֵּין מַלִּיל יְיָ עִם כָּל קְהָלְכוֹן בְּטוּרָא מִגּוֹ אֶשָּׁתָא עֲנָנָא וַאֲמִיטְתָא קָל רַב וְלָא פְסַק וּכְתָבִנּוּן עַל תְּרֵין לוּחֵי אַבְנַיָּא וִיהָבִנּוּן לִי:", "onk_en": "These words did Adonoy address to your entire assemblage at the mountain from within the fire, the cloud, and the thick cloud—a voice great and without cessation. He wrote them on two tablets of stone, and He gave them to me.", "pj": "יַת פִּתְגָמַיָא הָאִלֵין מַלֵיל יְיָ עִם כָּל קְהַלְכוֹן בְּטַוְורָא מִגּוֹ אֵישָׁתָא עֲנָנָא וַאֲמִיטְתָא קַל רַב דְּלָא פָּסִיק וַהֲוָה קַל דְּבִירָא מִתְכְּתֵיב עַל תְּרֵין לוּחֵי מַרְמִירִין וִיהָבִינוּן לִי", "pj_en": "These words spake the Lord with all your congregation at the mount, from the midst of the fiery cloud and tempest, with a great voice which was not limited; and the voice of the Word {Dibbera} was written upon two tables of marble, and He gave them unto me.", "tj": "", "tj_en": "", "rashi": "<b>ולא יסף.<\/b> מְתַרְגְּמִינָן \"וְלָא פָּסִיק\" (וּלְפִי שֶׁמִּדַּת בָּשָׂר וָדָם אֵינָן יָכוֹלִין לְדַבֵּר כָּל דְּבְרֵיהֶם בִּנְשִׁימָה אַחַת וּמִדַּת הַקָּבָּ\"ה אֵינוֹ כֵן — לֹא הָיָה פוֹסֵק, וּמִשֶּׁלֹּא הָיָה פוֹסֵק לֹא הָיָה מוֹסִיף) כִּי קוֹלוֹ חָזָק וְקַיָּם לְעוֹלָם (סנהדרין י\"ז); דָּ\"אַ — <b>ולא יסף<\/b> לֹא הוֹסִיף לְהֵרָאוֹת בְּאוֹתוֹ פֻּמְבִּי:", "rashi_en": "ולא יסף — We render this in the Targum by ולא פסק “and He did not cease”, — [Because it is characteristic of human beings that they are unable to utter all their words in one breath (but must make pauses) and it is characteristic of the Holy One, blessed be He, that this is not so, therefore He did not pause, and since He did not pause, He did not have to resume], — for His voice is strong and goes on continuously (Sanhedrin 17a).  Another explanation of ולא יסף: He did not again ever reveal himself with such publicity."}, {"ch": 5, "v": 20, "aliyah": 5, "heb": "וַיְהִ֗י כְּשׇׁמְעֲכֶ֤ם אֶת־הַקּוֹל֙ מִתּ֣וֹךְ הַחֹ֔שֶׁךְ וְהָהָ֖ר בֹּעֵ֣ר בָּאֵ֑שׁ וַתִּקְרְב֣וּן אֵלַ֔י כׇּל־רָאשֵׁ֥י שִׁבְטֵיכֶ֖ם וְזִקְנֵיכֶֽם׃", "onk": "וַהֲוָה כַּד שְׁמַעֲכוֹן יָת קָלָא מִגּוֹ חֲשׁוֹכָא וְטוּרָא בָּעֵר בְּאֶשָּׁתָא וְקָרֶבְתּוּן לְוָתִי כָּל רֵישֵׁי שִׁבְטֵיכוֹן וְסָבֵיכוֹן:", "onk_en": "When you heard the voice from within the darkness, as the mountain burned with fire, you approached me—all the leaders of your tribes and your elders.", "pj": "וַהֲוָה כֵּיוַן דִּשְׁמַעְתּוּן יַת קַל דִּבְרָא מִגּוֹ חֲשׁוֹכָא וְטַוְורָא דָלִיק בְּאֵישָׁתָא וְקָרֵיבְתּוּן לְוָתִי כָּל רֵישֵׁי שִׁבְטֵיכוֹן וְחַכִּימֵיכוֹן", "pj_en": "But when you had heard the voice of the Word {Dibbera} from the midst of the darkness, the mountain burning with fire, the chiefs of your tribes and your sages drew nigh to me,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 21, "aliyah": 5, "heb": "וַתֹּאמְר֗וּ הֵ֣ן הֶרְאָ֜נוּ יְהֹוָ֤ה אֱלֹהֵ֙ינוּ֙ אֶת־כְּבֹד֣וֹ וְאֶת־גׇּדְל֔וֹ וְאֶת־קֹל֥וֹ שָׁמַ֖עְנוּ מִתּ֣וֹךְ הָאֵ֑שׁ הַיּ֤וֹם הַזֶּה֙ רָאִ֔ינוּ כִּֽי־יְדַבֵּ֧ר אֱלֹהִ֛ים אֶת־הָֽאָדָ֖ם וָחָֽי׃", "onk": "וַאֲמַרְתּוּן הָא אַחְזְיָנָא יְיָ אֱלָהָנָא יָת יְקָרֵיהּ וְיָת רְבוּתֵיהּ וְיָת קָל <b>מֵימְרֵיהּ<\/b> שְׁמַעְנָא מִגּוֹ אֶשָּׁתָא יוֹמָא הָדֵין חֲזֵינָא אֲרֵי יְמַלֵּל יְיָ עִם אֲנָשָׁא וְיִתְקַיָּם:", "onk_en": "You said, ‘‘Look! Adonoy, our God, showed us His glory and His greatness, and His voice [<b>of His word<\/b>] we heard from within the fire; today we saw that God can address man and he will survive.", "pj": "וַאֲמַרְתּוּן הָא אַחֲמֵי יָתוּן מֵימְרָא דַיְיָ אֱלָהָנָא יַת שְׁכִינַת יְקָרֵיהּ וְיַת רְבוּת תּוּשְׁבַּחְתֵּיהּ וְיַת קַל מֵימְרֵיהּ שְׁמַעְנָא מִגוֹ אֵישָׁתָא יוֹמָא הָדֵין חָמֵינָא אֲרוּם מְמַלֵל יְיָ עִם בַּר נַשׁ דְּרוּחַ קַדִּישָׁא בֵּיהּ וּמִתְקַיֵּים", "pj_en": "and said, Behold, the Word of the Lord our God hath showed us His glorious Shekinah, and the greatness of His excellency, (tushbachteih, His magnificence,) and the voice of His Word have we heard out of the midst of the fire. This day have we seen that the Lord speaketh with a man in whom is the Holy Spirit, and he remaineth alive.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 22, "aliyah": 5, "heb": "וְעַתָּה֙ לָ֣מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔נוּ הָאֵ֥שׁ הַגְּדֹלָ֖ה הַזֹּ֑את אִם־יֹסְפִ֣ים&thinsp;<b>׀<\/b> אֲנַ֗חְנוּ לִ֠שְׁמֹ֠עַ אֶת־ק֨וֹל יְהֹוָ֧ה אֱלֹהֵ֛ינוּ ע֖וֹד וָמָֽתְנוּ׃", "onk": "וּכְעַן לְמָא נְמוּת אֲרֵי תֵיכְלִנָּנָא אֶשָּׁתָא רַבְּתָא הָדָא אִם מוֹסְפִין אֲנַחְנָא לְמִשְׁמַע יָת קָל <b>מֵימְרָא<\/b> דַיְיָ אֱלָהָנָא עוֹד וּמָיְתִין אֲנַחְנָא:", "onk_en": "Now, why should we die when this great fire will consume us? If we continue to hear the [<b>word of His<\/b>] voice of Adonoy, our God, any longer we will die.", "pj": "וּכְדוֹן לְמָא נְמוּת אֲרוּם תֵּיכְלִינָנָא אֵישָׁתָא רַבְּתָא הָדֵין אִין מוֹסִיפִין אֲנַחְנָא לְמִשְׁמַע יַת קַל מֵימְרָא דַיְיָ אֱלָהָנָא תּוּב וּמַיְיתִין אֲנַחְנָא", "pj_en": "But now why should we die? For this great fire will devour us; if we again hear the voice of the Word of the Lord our God, we shall die.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 23, "aliyah": 5, "heb": "כִּ֣י מִ֣י כׇל־בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִתּוֹךְ־הָאֵ֛שׁ כָּמֹ֖נוּ וַיֶּֽחִי׃", "onk": "אֲרֵי מָן כָּל בִּשְׂרָא דִי שְׁמַע קָל <b>מֵימְרָא<\/b> דַיְיָ קַיָּמָא מְמַלֵּל מִגּוֹ אֶשָּׁתָא כְּוָתָנָא וְאִתְקַיָּם:", "onk_en": "For who of all flesh has heard the voice of the [<b>word of the<\/b>] living God speaking from within the fire like us, and survived?", "pj": "אֲרוּם הֵי דֵין כָּל בַּר בִּישְרָא דְשָׁמַע קַל מֵימְרָא דֶאֱלָהָא קַיֵּים מְמַלֵּיל מִגּוֹ אֵישָׁתָא כְּוָותָנָא וְאִתְקַיֵּים", "pj_en": "For who, of all the offspring of flesh, hath heard the voice of the Word of the Living God speaking from amid the fire as we, and hath lived?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 24, "aliyah": 5, "heb": "קְרַ֤ב אַתָּה֙ וּֽשְׁמָ֔ע אֵ֛ת כׇּל־אֲשֶׁ֥ר יֹאמַ֖ר יְהֹוָ֣ה אֱלֹהֵ֑ינוּ וְאַ֣תְּ&thinsp;<b>׀<\/b> תְּדַבֵּ֣ר אֵלֵ֗ינוּ אֵת֩ כׇּל־אֲשֶׁ֨ר יְדַבֵּ֜ר יְהֹוָ֧ה אֱלֹהֵ֛ינוּ אֵלֶ֖יךָ וְשָׁמַ֥עְנוּ וְעָשִֽׂינוּ׃", "onk": "קְרַב אַתְּ וּשְׁמַע יָת כָּל דִּי יֵימַר יְיָ אֱלָהָנָא וְאַתְּ תְּמַלֵּל עִמָּנָא יָת כָּל דִּי מַלֵּל יְיָ אֱלָהָנָא עִמָּךְ וּנְקַבֵּל וְנַעְבֵּד:", "onk_en": "Approach—yourself—and listen to everything that Adonoy, our God, says; and you will tell us everything that Adonoy, our God, tells you and we will accept and fulfill.", "pj": "קְרֵיב אַתְּ וְתִשְׁמַע יַת כָּל מַה דְּיֵימַר יְיָ אֱלָהָנָא וְאַנְתְּ תְּמַלֵּיל עִמָּנָא יַת כָּל דִּימַלֵיל יְיָ אֱלָהָנָא לָךְ וּנְקַבֵּיל וְנַעֲבֵיד", "pj_en": "Go thou nigh, and hear all that the Lord our God shall say, and speak thou with us all that the Lord our God will say to thee, and we will hearken and will do.", "tj": "", "tj_en": "", "rashi": "<b>ואת תדבר אלינו.<\/b> הִתַּשְׁתֶּם אֶת כֹּחִי כַּנְּקֵבָה, שֶׁנִּצְטַעַרְתִּי עֲלֵיכֶם וְרִפִּיתֶם אֶת יָדִי כִּי רָאִיתִי שֶׁאֵינְכֶם חֲרֵדִים לְהִתְקָרֵב אֵלָיו מֵאַהֲבָה, וְכִי לֹא הָיָה יָפֶה לָכֶם לִלְמֹד מִפִּי הַגְּבוּרָה וְלֹא לִלְמֹד מִמֶּנִּי?:", "rashi_en": "ואת תדבר אלינו AND SPEAK THOU (את the feminine form of the pronoun) TO US — you weakened my strength as that of a woman, (cf. Rashi on Numbers 11:15), for I was distressed because of you (because of your words) and you weakened my hands, since I saw that you were not anxious to approach Him out of love. Indeed, was it not better for you to learn from the mouth of the Almighty God, and not to learn from me?!"}, {"ch": 5, "v": 25, "aliyah": 5, "heb": "וַיִּשְׁמַ֤ע יְהֹוָה֙ אֶת־ק֣וֹל דִּבְרֵיכֶ֔ם בְּדַבֶּרְכֶ֖ם אֵלָ֑י וַיֹּ֨אמֶר יְהֹוָ֜ה אֵלַ֗י שָׁ֠מַ֠עְתִּי אֶת־ק֨וֹל דִּבְרֵ֜י הָעָ֤ם הַזֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔יךָ הֵיטִ֖יבוּ כׇּל־אֲשֶׁ֥ר דִּבֵּֽרוּ׃", "onk": "וּשְׁמִיעַ <b>קֳדָם<\/b> יְיָ יָת קָל פִּתְגָּמֵיכוֹן בְּמַלָּלוּתְכוֹן עִמִּי וַאֲמַר יְיָ לִי שְׁמִיעַ <b>קֳדָמַי<\/b> יָת קָל פִּתְגָּמֵי עַמָּא הָדֵין דִּי מַלִּילוּ עִמָּךְ <b>אַתְקִינוּ<\/b> כָּל דִּי מַלִּילוּ:", "onk_en": "[<b>Before<\/b>] Adonoy [<b>was<\/b>] heard the intent of your words when you spoke to me; and Adonoy said to me, ‘‘[<b>Before Me<\/b>] I have heard the intent of this people’s words that they spoke to you—everything they said is excellent[<b>correct<\/b>].", "pj": "וּשְׁמַע קֳדָם יְיָ יַת קַל פִּתְגָמֵיכוֹן בְּמַלָּלוּתְכוֹן עִמִּי וַאֲמַר יְיָ לִי שְׁמִיעַ קֳדָמַי יַת קַל פִּתְגָמֵי עַמָא הָדֵין דְּמַלִילוּ עִמָךְ אוֹטִיבוּ כָּל מַה דִּי מַלִּילוּ", "pj_en": "And the voice of your words was heard before the Lord when you spake with me, and the Lord said to me, All the words of this people which they have spoken with thee are heard before Me; all that they have said is good.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 26, "aliyah": 5, "heb": "מִֽי־יִתֵּ֡ן וְהָיָה֩ לְבָבָ֨ם זֶ֜ה לָהֶ֗ם לְיִרְאָ֥ה אֹתִ֛י וְלִשְׁמֹ֥ר אֶת־כׇּל־מִצְוֺתַ֖י כׇּל־הַיָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָהֶ֛ם וְלִבְנֵיהֶ֖ם לְעֹלָֽם׃", "onk": "לְוַי דִּי יְהֵי <b>לִבָּא הָדֵין<\/b> לְהוֹן לְמִדְחַל קֳדָמַי וּלְמִטַּר יָת כָּל פִּקּוּדַי כָּל יוֹמַיָּא בְּדִיל דְּיֵיטַב לְהוֹן וְלִבְנֵיהוֹן לְעָלָם:", "onk_en": "I wish they would retain their present attitude to fear Me and to preserve all My commandments always; so that they and their children benefit forever.", "pj": "לְוַאי דִיהֵי יִצְרָא דְלִבְּהוֹן שְׁלִים בִּרְעוּת דֵּין לְהוֹן לְמִדְחַל מִן קֳדָמַי לְמִנְטוֹר יַת כָּל פִּקּוּדַי כָּל יוֹמַיָא מִן בִּגְלַל דְּיוֹטִיב לְהוֹן וְלִבְנֵיהוֹן לְעַלָם", "pj_en": "O that the disposition of their heart were perfect as this willingness is to fear Me and to keep all My commandments all days, that it may be well with them and with their children for ever!", "tj": "אַלְוַוי מִי יִתֵּן יֶהֱוֵי לִבָּא טָבָא הָדֵין לְהוֹן:", "tj_en": "O that they may have this good heart!", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 27, "aliyah": 5, "heb": "לֵ֖ךְ אֱמֹ֣ר לָהֶ֑ם שׁ֥וּבוּ לָכֶ֖ם לְאׇהֳלֵיכֶֽם׃", "onk": "אִזֵּל אֱמַר לְהוֹן תּוּבוּ לְכוֹן לְמַשְׁכְּנֵיכוֹן:", "onk_en": "Go say to them, ‘Return for yourselves to your tents.’", "pj": "אִיזֵל אֵימַר לְהוֹן שָׁרֵי לְכוֹן לְאִזְדַוְוגָא עִם נְשֵׁיכוֹן דְּאִתְפַּרַשְׁתּוּן דְּנַן תְּלָתָא יוֹמִין", "pj_en": "{Go, say to them: he has permitted you to join with your wives since you have been separated three days.}", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 28, "aliyah": 5, "heb": "וְאַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִי֒ וַאֲדַבְּרָ֣ה אֵלֶ֗יךָ אֵ֧ת כׇּל־הַמִּצְוָ֛ה וְהַחֻקִּ֥ים וְהַמִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑ם וְעָשׂ֣וּ בָאָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָהֶ֖ם לְרִשְׁתָּֽהּ׃", "onk": "וְאַתְּ הָכָא קִים <b>קֳדָמַי<\/b> וֶאֱמַלֵּל עִמָּךְ יָת כָּל תַּפְקֶדְתָּא וּקְיָמַיָּא וְדִינַיָּא דִי תַלְּפוּן וְיַעְבְּדוּן בְּאַרְעָא דִּי אֲנָא יָהֵב לְהוֹן לְמֵירְתַהּ:", "onk_en": "You, however, remain here with [<b>before<\/b>] Me, and I will tell you all the <i>mitzvohs<\/i> and the statutes and the laws that you will teach them; and they will fulfill [them] in the land that I am giving them to inherit.’’", "pj": "וְאַנְתְּ פְּרַשׁ מִן אִנְתְּתָךְ מְטוּל דִּבְסִדְרֵי דִלְעֵיל אַנְתְּ קָאֵי לְגַבִּי וַאֲמַלֵל עִמָךְ יַת תַּפְקִידַיָא וּקְיָמַיָא וְדִינַיָא דְּתַלְפִין יַתְהוֹן וְיַעַבְדוּן בְּאַרְעָא דַאֲנָא יָהִיב לְהוֹן לְמֵירְתָהּ", "pj_en": "Now therefore be separate from thy wife, that with the orders above thou mayest stand before Me, and I will speak with thee the commandments, statutes, and judgments, which thou shalt teach them to perform in the land that I give you to inherit.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 29, "aliyah": 5, "heb": "וּשְׁמַרְתֶּ֣ם לַעֲשׂ֔וֹת כַּאֲשֶׁ֥ר צִוָּ֛ה יְהֹוָ֥ה אֱלֹהֵיכֶ֖ם אֶתְכֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּשְׂמֹֽאל׃", "onk": "וְתִטְּרוּן לְמֶעְבַּד כְּמָא דִי פַקִּיד יְיָ אֱלָהֲכוֹן יָתְכוֹן לָא תִסְטוּן יַמִּינָא וּשְׂמָאלָא:", "onk_en": "You will be careful to fulfill as Adonoy, your God, has commanded you; do not deviate right or left.", "pj": "וּכְדוֹן טוּרוּ לְמֶעֱבַד הֵיכְמָא דְפַקֵּיד יְיָ אֱלָהָכוֹן יַתְכוֹן לָא תִסְטוּן לְיַמִינָא וְלִשְמָאלָא", "pj_en": "And now observe to do as the Lord your God hath commanded you; decline not to the right hand or to the left.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 30, "aliyah": 5, "heb": "בְּכׇל־הַדֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהֹוָ֧ה אֱלֹהֵיכֶ֛ם אֶתְכֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּן֙ וְט֣וֹב לָכֶ֔ם וְהַאֲרַכְתֶּ֣ם יָמִ֔ים בָּאָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּן׃", "onk": "בְּכָל אָרְחָא דִּי פַקִּיד יְיָ אֱלָהֲכוֹן יָתְכוֹן תְּהָכוּן בְּדִיל דְּתֵיחוּן וְיֵיטַב לְכוֹן וְתוֹרְכוּן יוֹמִין בְּאַרְעָא דִּי תֵירְתוּן:", "onk_en": "Along the entire way that Adonoy, your God, commanded you, shall you go; in order that you live and enjoy good, and you live long in the land that you are inheriting.", "pj": "בְּכָל אָרְחָא דְפַקֵּיד יְיָ אֱלָהָכוֹן יַתְכוֹן תְּהָכוּן מִן בִּגְלַל דְּתֵיחוּן וְיוֹטִיב לְכוֹן וְתוֹרְכוּן יוֹמִין בְּאַרְעָא דְתֵירְתוּן", "pj_en": "Walk in all the way which the Lord your God commandeth you, that you may live and do well, and lengthen out days in the land you shall inherit.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 1, "aliyah": 5, "heb": "וְזֹ֣את הַמִּצְוָ֗ה הַֽחֻקִּים֙ וְהַמִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהֹוָ֥ה אֱלֹהֵיכֶ֖ם לְלַמֵּ֣ד אֶתְכֶ֑ם לַעֲשׂ֣וֹת בָּאָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "וְדָא תַפְקֶדְתָּא קְיָמַיָּא וְדִינַיָּא דִּי פַקִּיד יְיָ אֱלָהֲכוֹן לְאַלָּפָא יָתְכוֹן לְמֶעְבַּד בְּאַרְעָא דִּי אַתּוּן עָבְרִין תַּמָּן לְמֵירְתַהּ:", "onk_en": "This is the <i>mitzvah,<\/i> the statutes and the laws that Adonoy, your God, commanded to teach you to fulfill in the land that you are crossing over there to inherit.", "pj": "וְדָא אַחְוָויַת תַּפְקֵידְתָּא קְיָימַיָא וְדִינַיָיא דְפַקֵּיד יְיָ אֱלָהָכוֹן לְמֵילְפָא יַתְכוֹן לְמֶעֱבַד בְּאַרְעָא דְאַתּוּן עָבְרִין לְתַמָּן לְמֵירְתָהּ", "pj_en": "And this is the declaration of the commandments, the statutes, and the judgments which the Lord your God hath commanded (me) to teach you to perform in the land to which you pass over to inherit;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 2, "aliyah": 5, "heb": "לְמַ֨עַן תִּירָ֜א אֶת־יְהֹוָ֣ה אֱלֹהֶ֗יךָ לִ֠שְׁמֹ֠ר אֶת־כׇּל־חֻקֹּתָ֣יו וּמִצְוֺתָיו֮ אֲשֶׁ֣ר אָנֹכִ֣י מְצַוֶּ֒ךָ֒ אַתָּה֙ וּבִנְךָ֣ וּבֶן־בִּנְךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑יךָ וּלְמַ֖עַן יַאֲרִכֻ֥ן יָמֶֽיךָ׃", "onk": "בְּדִיל דְּתִדְחַל <b>קֳדָם<\/b> יְיָ אֱלָהָךְ לְמִטַּר יָת כָּל קְיָמוֹהִי וּפִקּוּדוֹהִי דִּי אֲנָא מְפַקְּדָךְ אַתְּ וּבְרָךְ וּבַר בְּרָךְ כָּל יוֹמֵי חַיָּיךְ וּבְדִיל דְּיוֹרְכוּן יוֹמָיךְ:", "onk_en": "In order that you will fear [<b>before<\/b>] Adonoy, your God, to preserve all His statutes and commandments that I am commanding you—you and your son and your grandson—all the days of your life, and in order that you live long.", "pj": "מִן בִּגְלַל דְּתִדְחַל קֳדָם יְיָ אֱלָהָךְ לְמִנְטַר כָּל קְיָימוֹהִי וּפִיקוּדוֹהִי דַאֲנָא מְפַקֵיד לָךְ אַנְתְּ וּבְרָךְ וּבַר בְּרָךְ כָּל יוֹמֵי חַיָּיךְ וּמִן בִּגְלַל דְּיוֹרְכוּן יוֹמָךְ", "pj_en": "that thou mayest fear the Lord thy God, and keep all His statutes and precepts which I command thee; thou, thy son, and the son of thy son, all the days of thy life; and that thou mayest prolong thy days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 3, "aliyah": 5, "heb": "וְשָׁמַעְתָּ֤ יִשְׂרָאֵל֙ וְשָׁמַרְתָּ֣ לַעֲשׂ֔וֹת אֲשֶׁר֙ יִיטַ֣ב לְךָ֔ וַאֲשֶׁ֥ר תִּרְבּ֖וּן מְאֹ֑ד כַּאֲשֶׁר֩ דִּבֶּ֨ר יְהֹוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֙יךָ֙ לָ֔ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָֽשׁ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּתְקַבֵּל יִשְׂרָאֵל וְתִטַּר לְמֶעְבַּד דִּי יֵיטַב לָךְ וְדִי תִסְגּוּן לַחֲדָא כְּמָא דִי מַלִּיל יְיָ אֱלָהָא דַאֲבָהָתָךְ לָךְ אַרְעָא עָבְדָא חֲלַב וּדְבָשׁ:", "onk_en": "You will heed, Yisroel, and you will be careful to fulfill, so that you will benefit and so that you will multiply exceedingly, as Adonoy, God of your forefathers, spoke about you—a land flowing milk and honey.", "pj": "וּתְקַבֵּיל יִשְרָאֵל וְתִנְטוֹר לְמֶעֱבַד מְטוּל דְּיוֹטֵב לָךְ וְתִסְגוּן לַחֲדָא הֵיכְמָא דְמַלֵיל יְיָ אֱלָהָא דְאַבְהָתָךְ לָךְ אֲרַע דְּפֵירָהָא שְׁמֵינִין כַּחֲלָב וְחַלְיָין כִּדְבָשׁ", "pj_en": "Hearken then, Israel, to keep and to do, that it may be well with thee, and you may increase greatly, as the Lord God of thy fathers hath spoken to thee, (that) He will give thee a land whose fruits are rich as milk, and sweet as honey.", "tj": "אַרְעָא עַבְדָא פֵּירִין טַבְיָין נְקִיָין כַּחֲלָבָא וַחֲלַיָן וּטְעִימָן כְּדוּבְשָׁא:", "tj_en": "A land producing good fruits, pure as milk, sweet and tasty as honey.", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 4, "aliyah": 6, "heb": "שְׁמַ֖<big>ע<\/big> יִשְׂרָאֵ֑ל יְהֹוָ֥ה אֱלֹהֵ֖ינוּ יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;אֶחָֽ<big>ד<\/big>׃", "onk": "שְׁמַע יִשְׂרָאֵל יְיָ אֱלָהָנָא יְיָ חָד:", "onk_en": "Listen, Yisroel! Adonoy is our God, Adonoy is one.", "pj": "וַהֲוָה כֵּיוַן דְּמָטָא זִימְנֵיהּ דְּיַעֲקב אָבוּנָן לְמִתְכַּנְשָׁא מִגּוֹ עַלְמָא הֲוָה מִסְתְּפֵי דִלְמָא אִית בִּבְנוֹי פְּסוּלָא קָרָא יַתְהוֹן וְשַׁיְילִינוּן דִּלְמָא אִית בְּלִבְּכוֹן עַקְמָנוּתָא אָתִיבוּ כֻּלְהוֹן כַּחֲדָא וַאֲמָרוּ לֵיהּ שְׁמַע יִשְרָאֵל אָבוּנָן יְיָ אֱלָהָנָא יְיָ חָד עָנֵי יַעֲקב וַאֲמַר בְּרִיךְ שׁוּם יְקָרֵיהּ לְעָלְמֵי עַלְמִין", "pj_en": "It was, when the time came that our father Jakob should be gathered out of the world, he was anxious lest there might be an idolater among his sons. He called them, and questioned them, Is there such perversity in your hearts? They answered, all of them together, and said to him: HEAR, ISRAEL OUR FATHER: THE LORD OUR GOD IS ONE LORD! Jakob made response, and said, Blessed be His Glorious Name for ever and ever.", "tj": "כֵּיוַן דִּימְטָא קִיצָא דַּאֲבוּנָן יַעֲקב לְמִסְתַּלְקָא מִגּוֹ עַלְמָא קְרָא לִתְרֵי עֲשַר שִׁבְטַיָא בְנוֹי וְאָקִים יַתְהוֹן חֲזוֹר חֲזוֹר לְדַרְגְּשָׁא עֲנֵי אֲבוּנָן יַעֲקב וַאֲמַר לְהוֹן דִּילְמָא לְטַעֲוָותָא דְהַוֵּי תֶּרַח אָבוֹי דְאַבְרָהָם פְּלַח אַתּוּן פַּלְחִין דִּילְמָא לְטַעֲוָותָא דַּהֲוָה לָבָן אָחוּי דַאֲמָהָא פְּלַח אַתּוּן פַּלְחִין אוֹ לֵאלָהָא דְיַעֲקב אַתּוּן פַּלְחִין עַנְיַין תְּרֵי עֲשַר שִׁבְטַיָא כַּחֲדָא בְּלֵב שְׁלֵימָה וַאֲמַר שְׁמַע כְּעַן יִשְרָאֵל אֲבוּנָן יְיָ אֱלָהָנָא יְיָ חָד עָנֵי יַעֲקב וַאֲמַר יְהֵי שְׁמֵיהּ רַבָּא מְבָרֵךְ לַעֲלָם:", "tj_en": "When the end had come to our father Jakob, that he should be taken up from the world, he called the twelve tribes, his sons, and gathered them round his couch. Then Jakob our father rose up, and said to them, Do you worship any idol that Terah the father of Abraham worshipped? Do you worship any idol that Laban (the brother of his mother) worshipped? Or worship you the God of Jakob? The twelve tribes answered together, with fulness of heart, and said, Hear now, Israel our father: The Lord our God is one Lord. Jakob responded and said, May His Great Name be blessed for ever!", "rashi": "<b>ה' אלהינו ה' אחד.<\/b> ה' שֶׁהוּא אֱלֹהֵינוּ עַתָּה, וְלֹא אֱלֹהֵי הָאֻמּוֹת, הוּא עָתִיד לִהְיוֹת ה' אֶחָד, שֶׁנֶּאֱמַר (צפניה ג') כִּי אָז אֶהְפֹּךְ אֶל עַמִּים שָׂפָה בְרוּרָה לִקְרֹא כֻלָּם בְּשֵׁם ה', וְנֶאֱמַר (זכריה י\"ד) בַּיּוֹם הַהוּא יִהְיֶה ה' אֶחָד וּשְׁמוֹ אֶחָד (ע' ספרי):", "rashi_en": "ה׳ אלהינו ה' אחד means, The Lord who is now our God and not the God of the other peoples of the world, He will at some future time be the One (sole) ה׳, as it is said, (Zephaniah 3:9) “For then I will turn to the peoples a pure language that they may all call upon the name of the Lord\", and it is further said, (Zechariah 14:9) “In that day shall the Lord be One (אחד) and His name One\" (cf. Sifrei Devarim 31:10)."}, {"ch": 6, "v": 5, "aliyah": 6, "heb": "וְאָ֣הַבְתָּ֔ אֵ֖ת יְהֹוָ֣ה אֱלֹהֶ֑יךָ בְּכׇל־לְבָבְךָ֥ וּבְכׇל־נַפְשְׁךָ֖ וּבְכׇל־מְאֹדֶֽךָ׃", "onk": "וְתִרְחַם יָת יְיָ אֱלָהָךְ בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ וּבְכָל <b>נִכְסָךְ<\/b>:", "onk_en": "You are to love Adonoy, your God, with all your heart, with all your soul, and with all your possessions.", "pj": "אָמַר משֶׁה נְבִיָא לְעַמָּא בֵּית יִשְרָאֵל אִיזִילוּ בָּתַר פּוּלְחָנָא קְשִׁיטָא דְאַבְהַתְכוֹן וּתְרַחֲמוּן יַת יְיָ אֱלָהָכוֹן בִּתְרֵי יִצְרֵי לִבְּכוֹן וַאֲפִילוּ נְסִיב יַת נַפְשְׁכוֹן וּבְכָל מָמוֹנְכוֹן", "pj_en": "Mosheh the prophet said to the people of the house of Israel, Follow after the true worship of your fathers, that you may love the Lord your God with each disposition of your hearts, and also that He may accept your souls, and the (dedicated) service of all your wealth;", "tj": "", "tj_en": "", "rashi": "<b>ואהבת.<\/b> עֲשֵׂה דְּבָרָיו מֵאַהֲבָה, אֵינוֹ דוֹמֶה הָעוֹשֶׂה מֵאַהֲבָה לָעוֹשֶׂה מִיִּרְאָה, הָעוֹשֶׂה אֵצֶל רַבּוֹ מִיִּרְאָה, כְּשֶׁהוּא מַטְרִיחַ עָלָיו מַנִּיחוֹ וְהוֹלֵךְ לוֹ (שם):<br><br><b>בכל לבבך.<\/b> בִּשְׁנֵי יְצָרֶיךָ (ספרי; ברכות נ\"ד); דָּבָר אַחֵר <b>בכל לבבך<\/b> שֶׁלֹּא יִהְיֶה לִבְּךָ חָלוּק עַל הַמָּקוֹם (ספרי):<br><br><b>ובכל נפשך.<\/b> אֲפִלּוּ הוּא נוֹטֵל אֶת נַפְשְׁךָ (ספרי; ברכות נ\"ד):<br><br><b>ובכל מאדך.<\/b> בְּכָל מָמוֹנְךָ, יֵשׁ לְךָ אָדָם שֶׁמָּמוֹנוֹ חָבִיב עָלָיו מִגּוּפוֹ (בראשית נ\"ז), לְכָךְ נֶאֱמַר בְּכָל מְאֹדֶךָ. דָּ\"אַ — <b>ובכל מאדך<\/b> בְּכָל מִדָּה וּמִדָּה שֶׁמּוֹדֵד לְךָ, בֵּין בְּמִדָּה טוֹבָה בֵּין בְּמִדַּת פֻּרְעָנוּת, וְכֵן דָּוִד הוּא אוֹמֵר (תהלים קט\"ז) כּוֹס יְשׁוּעוֹת אֶשָּׂא צָרָה וְיָגוֹן אֶמְצָא וְגוֹ' (ע' ספרי):", "rashi_en": "ואהבת AND THOU SHALT LOVE [THE LORD] — Fulfil His commands out of love, for one who acts out of love is not like him (is on a higher plane than one) who acts out of fear. He who serves his master out of fear, if he (the master) troubles him overmuch, leaves him and goes away (Sifrei Devarim 32:1).<br><br>בכל לבבך [THOU SHALT LOVE THE LORD] WITH ALL THY HEART — The form of the noun with two ב instead of the usual form לבך suggests: Love Him with thy two inclinations (the יצר הטוב and the יצר הרע) (Sifrei Devarim 32:3; Berakhot 54a). Another explanation of בכל לבבך, with all thy heart, is that thy heart should not be at variance (i.e. divided, not whole) with the Omnipresent God (Sifrei Devarim 32:4).<br><br>ובכל נפשך AND WITH ALL THY SOUL — even though He take thy soul (even though you have to suffer martyrdom to show your love of God) (Sifrei Devarim 32:5; Berakhot 54a, Berakhot 61b).<br><br>ובכל מאדך AND WITH ALL THY MIGHT, i.e. with all thy property. You have people whose property is dearer to them than their bodies (life), and it is on this account that there is added, “and with all thy property\" (Sifrei Devarim 32:6).  — Another explanation of ובכל מאדך is: — Thou shalt love Him whatever measure (מדה) it may be that He metes out to thee, whether it be the measure of good or the measure of calamity. Thus also did David say, (Psalms 116:13 and 3) \"If I lift up the cup of salvation, [I will call upon the name of the Lord]; If I find trouble and sorrow, [I will call upon the name of the Lord]”."}, {"ch": 6, "v": 6, "aliyah": 6, "heb": "וְהָי֞וּ הַדְּבָרִ֣ים הָאֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּךָ֛ הַיּ֖וֹם עַל־לְבָבֶֽךָ׃", "onk": "וִיהוֹן פִּתְגָּמַיָּא הָאִלֵּין דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין עַל לִבָּךְ:", "onk_en": "And these words that I command you today shall be upon your heart.", "pj": "וִיהוֹן פִּתְגָמַיָא הָאִלֵין דַּאֲנָא מְפַקֵיד יַתְכוֹן יוֹמָא דֵין כְּתִיבִין עַל לוּחַ לִבְּכוֹן", "pj_en": "and let these words which I command you this day be written upon the tables of your hearts.", "tj": "", "tj_en": "", "rashi": "<b>והיו הדברים האלה.<\/b> וּמַהוּ הָאַהֲבָה? <b>והיו הדברים האלה<\/b>, שֶׁמִּתּוֹךְ כָּךְ אַתָּה מַכִּיר בְּהַקָּבָּ\"ה וּמְדַּבֵּק בִּדְרָכָיו (ספרי):<br><br><b>אשר אנכי מצוך היום.<\/b> לֹא יִהְיוּ בְּעֵינֶיךָ כִדְיוּטְגְּמָא יְשָׁנָה שֶׁאֵין אָדָם סוֹפְנָהּ, אֶלָּא כַּחֲדָשָׁה שֶׁהַכֹּל רָצִין לִקְרָאתָהּ; דְּיוּטְגְּמָא – מִצְוַת הַמֶּלֶךְ הַבָּאָה בְּמִכְתָּב (ספרי):", "rashi_en": "— What is the “love” that is here commanded? The next verse tells us: והיו הדברים האלה THESE WORDS [WHICH I COMMAND THEE] SHALL BE [UPON THINE HEART] — for thereby thou wilt arrive at a recognition of the Holy One, blessed be He, and wilt cleave to His ways (Sifrei Devarim 33:1).<br><br>אשר אנכי מצוך היום [THESE WORDS] WHICH I COMMAND THEE THIS DAY — this day— they should not be in thine eyes as an antiquated דיוטגמא which no one minds, but as one newly given which everyone gladly welcomes (Sifrei Devarim 33:2; cf. our first Note on p. 248 in the Silbermann edition of Exodus). — The word דיוטגמא in this Midrash signifies: a royal command committed to writing."}, {"ch": 6, "v": 7, "aliyah": 6, "heb": "וְשִׁנַּנְתָּ֣ם לְבָנֶ֔יךָ וְדִבַּרְתָּ֖ בָּ֑ם בְּשִׁבְתְּךָ֤ בְּבֵיתֶ֙ךָ֙ וּבְלֶכְתְּךָ֣ בַדֶּ֔רֶךְ וּֽבְשׇׁכְבְּךָ֖ וּבְקוּמֶֽךָ׃", "onk": "וּתְתָנִנּוּן לִבְנָיךְ וּתְמַלֵּל בְּהוֹן בְּמִתְּבָךְ בְּבֵיתָךְ וּבִמְהָכָךְ בְּאָרְחָא וּבְמִשְׁכְּבָךְ וּבִמְקִימָךְ:", "onk_en": "You are to teach them to your children and you are to discuss them, when you sit at home, and when you journey on the road, and when you go to sleep, and when you rise.", "pj": "וְתִגְמְרִינוּן לִבְנָךְ וְתֶהֶוְיַין הַנְיַין בְּהוֹן בְּמוֹתְבֵיכוֹן בְּבָתֵּיכוֹן בִּזְמַן מֵיעַסוּקְכוֹן בְּחִיתוּנְכוֹן וּבְמֵיהֲכוֹן בְּאוֹרְחֲכוֹן וּבְפַנְיָא סְמִיךְ לְמִשְׁכָּבֵיכוֹן וּבְצַפְרָא סְמִיךְ לְמִקְמֵיכוֹן", "pj_en": "And thou shalt unfold them to thy children, and meditate upon them when thou art sitting in your houses, at the time when you are occupied in secret chambers, or in journeying by the way; at evening when you lie down, and at morn when you arise.", "tj": "", "tj_en": "", "rashi": "<b>ושננתם.<\/b> לְשׁוֹן חִדּוּד הוּא, שֶׁיִּהְיוּ מְחֻדָּדִים בְּפִיךָ, שֶׁאִם יִשְׁאָלְךָ אָדָם דָּבָר לֹא תְהֵא צָרִיךְ לְגַמְגֵּם בּוֹ אֶלָּא אֱמֹר לוֹ מִיָּד (ספרי; קידושין ל'):<br><br><b>לבניך.<\/b> אֵלּוּ הַתַּלְמִידִים, מָצִינוּ בְּכָל מָקוֹם שֶׁהַתַּלְמִידִים קְרוּייִם בָּנִים, שֶׁנֶּאֱמַר (דברים י\"ד) בָּנִים אַתֶּם לַה' אֱלֹהֵיכֶם, וְאוֹמֵר (מלכים ב ב') בְּנֵי הַנְּבִיאִים אֲשֶׁר בֵּית אֵל, וְכֵן בְּחִזְקִיָּהוּ, שֶׁלִּמֵּד תּוֹרָה לְכָל יִשְׂרָאֵל, וּקְרָאָם בָּנִים שֶׁנֶּאֱמַר (דברי הימים ב' כ\"ט) בָּנַי עַתָּה אַל תִּשָּׁלוּ. וּכְשֵׁם שֶׁהַתַּלְמִידִים קְרוּיִים בָּנִים (שֶׁנֶּאֱמַר בָּנִים אַתֶּם לַה' אֱלֹהֵיכֶם) כָּךְ הָרַב קָרוּי אָב, שֶׁנֶּאֱמַר (מלכים ב ב') אָבִי אָבִי רֶכֶב יִשְׂרָאֵל וְגוֹ' (ספרי):<br><br><b>ודברת בם.<\/b> שֶׁלֹּא יְהֵא עִקַּר דִּבּוּרְךָ אֶלָּא בָּם – עֲשֵׂם עִקָּר וְאַל תַּעֲשֵׂם טָפֵל (שם):<br><br><b>ובשכבך.<\/b> יָכוֹל אֲפִלּוּ שָׁכַב בַּחֲצִי הַיּוֹם, תַּ\"ל <b>ובקומך<\/b>, יָכוֹל אֲפִלּוּ עָמַד בַּחֲצִי הַלַּיְלָה, תַּ\"ל <b>בשבתך בביתך ובלכתך בדרך<\/b> – דֶּרֶךְ אֶרֶץ דִּבְּרָה תוֹרָה, זְמַן שְׁכִיבָה וּזְמַן קִימָה (שם):", "rashi_en": "ושננתם AND THOU SHALT TEACH THEM DILIGENTLY — This word expresses the idea of being sharply impressed, the meaning being, that they should be impressed (familiar) in thy mouth, so that if a person asks you anything concerning them, you will not need to stammer (hesitate) about it, but tell him forthwith (Sifrei Devarim 34:1; Kiddushin 30a)<br><br>לבניך [AND THOU SHALT TEACH THEM DILIGENTLY] UNTO THY CHILDREN — These are the disciples. Everywhere do we find that disciples are termed בנים, as it is said, (Deuteronomy 14:1) “Ye are children (בנים) of the Lord your God”; and it says, (2 Kings 2:3), “The sons of (בני) the prophets who were in Bethel”. So. too, do we find in the case of Hezekiah that he taught Torah to all Israel and termed them בנים, as it is said, (II Chronicles 29:11), “My sons (בני) be not now negligent\". And even as disciples are termed בנים, “children\", so the teacher is termed אב, \"father\", as it is said, (2 Kings 2:12) that Elisha referred to his teacher Elijah by the words, \"My father, my father, the chariot of Israel, etc.\" (Sifrei Devarim 34:4).<br><br>ודברת בם AND THOU SHALT SPEAK OF THEM — i.e. that your principal topic of conversation should be only about them: make them the principal, and do not make them of secondary importance (Sifrei Devarim 34:6).<br><br>ובשכבך AND WHEN THOU LIEST DOWN — One might think that this means: even if one lies down (retires to bed) in the middle of the day, and that ובקומך AND WHEN THOU RISEST UP means: even if you rise up in the middle of the night! It, however, states בשבתך בביתך ובלכתך בדרך WHEN THOU SITTEST IN THY HOUSE AND WHEN THOU WALKEST BY THE WAY: The Torah is thus speaking of the usual way of living, and this therefore means, the usual time of lying down and the usual time of rising up (cf. Sifrei Devarim 36:9)."}, {"ch": 6, "v": 8, "aliyah": 6, "heb": "וּקְשַׁרְתָּ֥ם לְא֖וֹת עַל־יָדֶ֑ךָ וְהָי֥וּ לְטֹטָפֹ֖ת בֵּ֥ין עֵינֶֽיךָ׃", "onk": "וְתִקְטְרִנּוּן לְאָת עַל יְדָךְ וִיהוֹן <b>לִתְפִלִּין<\/b> בֵּין עֵינָיךְ:", "onk_en": "You are to tie them as a sign on your arm and they are to be <i>totafos<\/i> [<b>tefillin<\/b>] between your eyes.", "pj": "וְתִקְטוּרִינוּן לְאָתִין כְּתִיבִין עַל יְדָךְ דִּשְמָאלָא וִיהֲווֹן לִתְפִילִין עַל מוֹקְדָךְ כֻּלּוֹ קָבֵיל עַל עֵינָךְ", "pj_en": "And you shall bind them as written signs upon thy left hand, and they shall be for tephillin upon thy forehead over thine eyes.", "tj": "", "tj_en": "", "rashi": "<b>וקשרתם לאות על ידך.<\/b> אֵלּוּ תְּפִלִּין שֶׁבַּזְּרוֹעַ:<br><br><b>והיו לטטפת בין עיניך.<\/b> אֵלּוּ תְּפִלִּין שֶׁבָּרֹאשׁ, וְעַל שֵׁם מִנְיַן פָּרָשִׁיּוֹתֵיהֶם נִקְרְאוּ טֹטָפוֹת, טט בְּכַתְפִּי שְׁתַּיִם פת בְּאַפְרִיקֵי שְׁתַּיִם (סנהדרין ד'):", "rashi_en": "וקשרתם AND THOU SHALT BIND THEM [ … UPON THY HAND] — These are the Tephillin that are placed on the arm,<br><br>לטטפות בין עיניך AND THEY SHALL BE FOR FRONTLETS BETWEEN THINE EYES — these are the Tephillin that are placed upon the head. It is in reference to the number of the Scriptural sections contained in them that they are termed טטפת, for טט denotes \"two\" in Katpi and פת in Afriki denotes \"two\" (Sanhedrin 4b; cf. Rashi on Exodus 13:16)."}, {"ch": 6, "v": 9, "aliyah": 6, "heb": "וּכְתַבְתָּ֛ם עַל־מְזֻז֥וֹת בֵּיתֶ֖ךָ וּבִשְׁעָרֶֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִכְתְּבִנּוּן עַל מְזוּזְיָן <b>וְתִקְבְּעִנּוּן בְּסִפֵּי<\/b> בֵיתָךְ וּבְתַרְעָיךְ:", "onk_en": "You are to write them on the doorposts [<b>and affix them to the lintels<\/b>] of your house, and on your gateposts.", "pj": "וְתִכְתּוֹבִינִין עַל מְזוּזְיַין וְתִקְבְּעִינוּן בְּתוֹלְתָא לְקָבֵיל תַּקֵּי עַל סֵיפֵי בֵּיתָךְ וּבְתַרְעָךְ מִימִינָא בְּמֵעֲלָךְ", "pj_en": "And thou shalt write them upon the pillars, and affix them in three places, against the cupboard, upon the posts of thy house, and on the right hand of thy gate, in thy going out.", "tj": "", "tj_en": "", "rashi": "<b>מזזות ביתך.<\/b> מזזת כְּתִיב, שֶׁאֵין צָרִיךְ אֶלָּא אַחַת:<br><br><b>ובשעריך.<\/b> לְרַבּוֹת שַׁעֲרֵי חֲצֵרוֹת וְשַׁעֲרֵי מְדִינוֹת וְשַׁעֲרֵי עֲיָרוֹת (יומא י\"א):", "rashi_en": "מזזות ביתך THE DOORPOSTS OF THY HOUSE — The word is written מזזת, to indicate that it is necessary to fix only one מזוזה to a door (cf. Menachot 34a).<br><br>ובשעריך AND UPON THY GATES — the plural is used to include also the gates of courts and the gates of provinces and the gates of cities [in the requirement of mezuzah] (Yoma 11a)."}, {"ch": 6, "v": 10, "aliyah": 6, "heb": "וְהָיָ֞ה כִּ֥י יְבִיאֲךָ֣&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ אֶל־הָאָ֜רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע לַאֲבֹתֶ֛יךָ לְאַבְרָהָ֛ם לְיִצְחָ֥ק וּֽלְיַעֲקֹ֖ב לָ֣תֶת לָ֑ךְ עָרִ֛ים גְּדֹלֹ֥ת וְטֹבֹ֖ת אֲשֶׁ֥ר לֹא־בָנִֽיתָ׃", "onk": "וִיהֵי אֲרֵי יָעֵלִנָּךְ יְיָ אֱלָהָךְ לְאַרְעָא דִּי קַיִּים לַאֲבָהָתָךְ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב לְמִתַּן לָךְ קִרְוִין רַבְרְבָן וְטָבָן דִּי לָא בְנֵיתָא:", "onk_en": "When Adonoy your God will have brought you to the land that He swore to your forefathers—to Avrohom, to Yitzchok, and to Yaakov—to give you: great and good cities that you did not build.", "pj": "וִיהֵי אֲרוּם יָעֵלִינָךְ יְיָ אֱלָהָךְ לְאַרַע דְּקַיֵּים לְאַבְהָתָךְ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב לְמִתַּן לָךְ קִירְוִין רַבְרְבִין וְטָבָן דְּלָא אִשְׁתַּלְהִית לְמִבְנֵי", "pj_en": "And when the Lord thy God hath brought thee into the land which he promised to Abraham, Izhak, and Jakob, thy fathers, to give thee cities great and goodly which thou didst not toil in building,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 11, "aliyah": 6, "heb": "וּבָ֨תִּ֜ים מְלֵאִ֣ים כׇּל־טוּב֮ אֲשֶׁ֣ר לֹא־מִלֵּ֒אתָ֒ וּבֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא־חָצַ֔בְתָּ כְּרָמִ֥ים וְזֵיתִ֖ים אֲשֶׁ֣ר לֹא־נָטָ֑עְתָּ וְאָכַלְתָּ֖ וְשָׂבָֽעְתָּ׃", "onk": "וּבָתִּין מְלָן כָּל טוּב דִּי לָא מַלֵּיתָא וְגֻבִּין פְּסִילָן דִּי לָא פְסַלְתָּא כַּרְמִין וְזֵיתִין דִּי לָא נְצֶבְתָּא וְתֵיכוּל וְתִשְׂבָּע:", "onk_en": "And houses full of all bounty that you did not fill, and hewn cisterns that you did not hew, vineyards and olive stands that you did not plant; and you will eat and be full.", "pj": "וּבָתִּין דְּמַלְיָין כָּל טוּבָא דְּלָא עָסַקְתָּ לְמִימְלֵי וּבֵירִין פְּסִילָן דְּלָא לָעִית לְמִפְסַל כַּרְמִין וְזֵיתִין דְּלָא טָרַחְתְּ לְמִינְצַב וְתֵיכוֹל וְתִיסְבּוֹעַ", "pj_en": "houses also, filled with all good, which thou wast not occupied in filling, and hewn cisterns in hewing which thou didst not labour, vineyards and olives with planting which thou wast not wearied; and when thou hast eaten. and art satisfied,", "tj": "", "tj_en": "", "rashi": "<b>חצובים.<\/b> לְפִי שֶׁהוּא מְקוֹם טְרָשִׁין וּסְלָעִים נוֹפֵל בּוֹ לְשׁוֹן חֲצִיבָה:", "rashi_en": "חצובים [CISTERNS] HEWN OUT — Because it (Palestine) was a country of stony ground and rocks, the term \"hewn\" is applicable here."}, {"ch": 6, "v": 12, "aliyah": 6, "heb": "הִשָּׁ֣מֶר לְךָ֔ פֶּן־תִּשְׁכַּ֖ח אֶת־יְהֹוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲךָ֛ מֵאֶ֥רֶץ מִצְרַ֖יִם מִבֵּ֥ית עֲבָדִֽים׃", "onk": "אִסְתַּמַּר לָךְ דִּילְמָא תִנְשֵׁי יָת (דַּחַלְתָּא דַ)יְיָ דִּי אַפְּקָךְ מֵאַרְעָא דְמִצְרַיִם מִבֵּית עַבְדוּתָא:", "onk_en": "Look out for yourself, lest you forget Adonoy, Who took you out of the land of Egypt, from the house of slavery.", "pj": "אִסְתַּמָּרוּ לְכוֹן דִּלְמָא תִתְנְשׁוּן דַּחַלְתָּא דַיְיָ אֱלָהָכוֹן דִּפְרַק וְאַפֵּיק יַתְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם מִן בֵּית שִׁעֲבּוּד עַבְדַיָא", "pj_en": "beware lest you forget the fear of the Lord your God, who delivered and led you out free from the land of Mizraim, from the house of the affliction of slaves;", "tj": "", "tj_en": "", "rashi": "<b>מבית עבדים.<\/b> כְּתַרְגּוּמוֹ מִבֵּית עַבְדוּתָא – מִמָּקוֹם שֶׁהֱיִיתֶם שָׁם עֲבָדִים:", "rashi_en": "מבית עבדים — Understand this as the Targum does: from the house of slavery, i.e. a place where ye were slaves (not from the house that belonged to slaves; cf. Rashi on Exodus 20:2)."}, {"ch": 6, "v": 13, "aliyah": 6, "heb": "אֶת־יְהֹוָ֧ה אֱלֹהֶ֛יךָ תִּירָ֖א וְאֹת֣וֹ תַעֲבֹ֑ד וּבִשְׁמ֖וֹ תִּשָּׁבֵֽעַ׃", "onk": "יָת יְיָ אֱלָהָךְ תִּדְחַל <b>וְקָדָמוֹהִי<\/b> תִּפְלָח וּבִשְׁמֵיהּ תְּקַיַּם:", "onk_en": "Fear Adonoy, your God, and serve [<b>before<\/b>] Him, and swear by His name.", "pj": "מִן קֳדָם יְיָ אֱלָהָכוֹן תֶּהֱווֹן דַּחֲלִין וּקְדָמוֹי תִּפְלְחוּן וּבְשׁוּם מֵימְרֵי יְיָ בִּקְשׁוֹט תּוּמוּן", "pj_en": "but fear the Lord your God, and worship before Him, and swear by the Name of the Word of the Lord in truth.", "tj": "", "tj_en": "", "rashi": "<b>ובשמו תשבע.<\/b> אִם יֵשׁ בְּךָ כָּל הַמִּדּוֹת הַלָּלוּ, שֶׁאַתָּה יָרֵא אֶת שְׁמוֹ וְעוֹבֵד אוֹתוֹ, אָז בִּשְׁמוֹ תִּשָּׁבֵעַ, שֶׁמִּתּוֹךְ שֶׁאַתָּה יָרֵא אֶת שְׁמוֹ תְּהֵא זָהִיר בִּשְׁבוּעָתְךָ, וְאִם לָאו — לֹא תִשָּׁבֵעַ:", "rashi_en": "ובשמו תשבע AND THOU SHALT SWEAR BY HIS NAME — If thou hast all the characteristics mentioned here, i.e. that thou reverest His name and servest Him, then thou mayest take an oath by mention of His name, for just because thou reverest His name, thou wilt be cautious with thy oath; but if not, thou shalt not so swear."}, {"ch": 6, "v": 14, "aliyah": 6, "heb": "לֹ֣א תֵֽלְכ֔וּן אַחֲרֵ֖י אֱלֹהִ֣ים אֲחֵרִ֑ים מֵאֱלֹהֵי֙ הָֽעַמִּ֔ים אֲשֶׁ֖ר סְבִיבוֹתֵיכֶֽם׃", "onk": "לָא תְהָכוּן בָּתַר <b>טַעֲוַת עַמְמַיָּא מִטַּעֲוַת<\/b> <b>עַמְמַיָּא<\/b> דִּי בְסַחֲרָנֵיכוֹן:", "onk_en": "Do not follow other gods [<b>idols of the nations<\/b>], from the gods [<b>idols<\/b>] of the peoples around you.", "pj": "לָא תַהֲכוּן בָּתַר טַעֲוַות עַמְמַיָא מִנַּחֲלַת עַמְמַיָא דִּבְחִזְרָנֵיכוֹן", "pj_en": "You shall not go after the idols of the Gentiles, the idols of the peoples who are round about you:", "tj": "", "tj_en": "", "rashi": "<b>מאלהי העמים אשר סביבותיכם.<\/b> הוּא הַדִּין לָרְחוֹקִים, אֶלָּא לְפִי שֶׁאַתָּה רוֹאֶה אֶת סְבִיבוֹתֶיךָ תּוֹעִים אַחֲרֵיהֶם, הֻצְרַךְ לְהַזְהִיר עֲלֵיהֶם בְּיוֹתֵר:", "rashi_en": "מאלהי העמים אשר סביבותיכם OF THE GODS OF THE PEOPLE WHO ARE AROUND YOU — The same prohibition applies respecting the gods of those peoples who are distant from you; but, just because you see those who are around you going astray after them, it felt the necessity specially to warn your about them."}, {"ch": 6, "v": 15, "aliyah": 6, "heb": "כִּ֣י אֵ֥ל קַנָּ֛א יְהֹוָ֥ה אֱלֹהֶ֖יךָ בְּקִרְבֶּ֑ךָ פֶּן־יֶ֠חֱרֶ֠ה אַף־יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ בָּ֔ךְ וְהִשְׁמִ֣ידְךָ֔ מֵעַ֖ל פְּנֵ֥י הָאֲדָמָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי אֵל קַנָּא יְיָ אֱלָהָךְ <b>שְׁכִנְתֵּיהּ<\/b> בֵּינָךְ דִּילְמָא יִתְקֵף רָגְזָא דַיְיָ אֱלָהָךְ בָּךְ וִישֵׁצָךְ מֵעַל אַפֵּי אַרְעָא:", "onk_en": "For a jealous Almighty is Adonoy, your God, [<b>His Shechinah is<\/b>] within you; lest there be aroused the anger of Adonoy, your God, against you and He destroy you from upon the surface of the land.", "pj": "אֲרוּם אֱלָהָא קַנְאָן וּפוּרְעָן יְיָ אֱלָהָכוֹן שְׁכִינְתֵּיהּ שַׁרְיָא בֵּינֵיכוֹן דִּלְמָא יִתְקוֹף רוּגְזָא דַיְיָ אֱלָהָכוֹן בְּכוֹן וִישֵׁיצִינוּךְ בְּסַרְהוֹבַיָא מֵעִילַוֵי אַפֵּי אַרְעָא", "pj_en": "for the Lord our God is a jealous God, and an Avenger, whose Shekinah dwelleth in the midst of you; lest the anger of the Lord your God be kindled against you, and He quickly destroy you from the face of the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 16, "aliyah": 6, "heb": "לֹ֣א תְנַסּ֔וּ אֶת־יְהֹוָ֖ה אֱלֹהֵיכֶ֑ם כַּאֲשֶׁ֥ר נִסִּיתֶ֖ם בַּמַּסָּֽה׃", "onk": "לָא תְנַסּוּן קֳדָם יְיָ אֱלָהֲכוֹן כְּמָא דִי נַסֵּתוּן בְּנִסֵּיתָא:", "onk_en": "Do not test Adonoy, your God, as you tested at Massoh.", "pj": "עַמִּי בְּנֵי יִשְרָאֵל הֲווֹ זְהִירִין דְּלָא תְנַסּוּן יַת יְיָ אֱלָהָכוֹן הֵיכְמָא דְנַסִּיתוּן בְּעִישַרְתֵּי נִסְיוֹנִין", "pj_en": "Sons of Israel, my people, be warned not to tempt the Lord your God as you tempted Him in the ten temptations;", "tj": "", "tj_en": "", "rashi": "<b>במסה.<\/b> כְּשֶׁיָּצְאוּ מִמִּצְרַיִם שֶׁנִּסּוּהוּ בַמַּיִם, שֶׁנֶּאֱמַר הֲיֵשׁ ה' בְּקִרְבֵּנוּ (שמות י\"ז):", "rashi_en": "במסה IN MASSAH, when they went forth from Egypt: that they put Him to the test in respect to water, as it is said, (Exodus 17:7) that they asked, “Is the Lord amongst us or not?\"."}, {"ch": 6, "v": 17, "aliyah": 6, "heb": "שָׁמ֣וֹר תִּשְׁמְר֔וּן אֶת־מִצְוֺ֖ת יְהֹוָ֣ה אֱלֹהֵיכֶ֑ם וְעֵדֹתָ֥יו וְחֻקָּ֖יו אֲשֶׁ֥ר צִוָּֽךְ׃", "onk": "מִטַּר תִּטְּרוּן יָת פִּקּוּדַיָּא דַּיְיָ אֱלָהֲכוֹן וּסְהֶדְוָתֵיהּ וּקְיָמוֹהִי דִּי פַקְדָּךְ:", "onk_en": "Carefully guard the commandments of Adonoy, your God, and His testimonies and His statutes that He commanded you.", "pj": "מִינְטוֹר תִּנְטְרוּן יַת פִּקּוּדַיָא דַיְיָ אֱלָהָכוֹן וּסְהִידְוָותֵיהּ וּקְיָימוֹי דְפַקֵּיד לְכוֹן", "pj_en": "keeping keep the commandments of the Lord your God, and His testimonies and statutes which He hath commanded you;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 18, "aliyah": 6, "heb": "וְעָשִׂ֛יתָ הַיָּשָׁ֥ר וְהַטּ֖וֹב בְּעֵינֵ֣י יְהֹוָ֑ה לְמַ֙עַן֙ יִ֣יטַב לָ֔ךְ וּבָ֗אתָ וְיָֽרַשְׁתָּ֙ אֶת־הָאָ֣רֶץ הַטֹּבָ֔ה אֲשֶׁר־נִשְׁבַּ֥ע יְהֹוָ֖ה לַאֲבֹתֶֽיךָ׃", "onk": "וְתַעְבֵּד דְּכָשַׁר <b>וּדְתַקֵן<\/b> קֳדָם יְיָ בְּדִיל דְּיֵיטַב לָךְ וְתֵעוּל וְתֵירַת יָת אַרְעָא טַבְתָא דִּי קַיִּים יְיָ לַאֲבָהָתָךְ:", "onk_en": "Perform the upright and the good [<b>correct<\/b>] in Adonoy’s eyes, in order that you benefit and arrive in, and inherit the good land that Adonoy swore to your forefathers.", "pj": "וְתַעֲבֵיד דְּתַקִּין וּדְכָשַׁר קֳדָם יְיָ מִן בִּגְלַל דְּיוֹטִיב לְכוֹן וְתֵיעֲלוּן וְתֵירְתוּן יַת אַרְעָא טַבְתָּא דְקַיִים יְיָ לַאֲבָהַתְכוֹן", "pj_en": "and do what is good and right before the Lord, that it may be well with you, and ye may go in, and possess by inheritance the good land which the Lord covenanted to your fathers;", "tj": "", "tj_en": "", "rashi": "<b>הישר והטוב.<\/b> זוֹ פְשָׁרָה לִפְנִים מִשּׁוּרַת הַדִּין:", "rashi_en": "הישר והטוב [AND THOU SHALT DO] THAT WHICH IS RIGHT AND GOOD [IN THE EYES OF THE LORD] — This refers to a compromise, acting beyond the strict demands of the law (cf. Rashi on Bava Metzia 108a)."}, {"ch": 6, "v": 19, "aliyah": 6, "heb": "לַהֲדֹ֥ף אֶת־כׇּל־אֹיְבֶ֖יךָ מִפָּנֶ֑יךָ כַּאֲשֶׁ֖ר דִּבֶּ֥ר יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>לְמִתְּבַר<\/b> יָת כָּל בַּעֲלֵי דְבָבָךְ מִקֳּדָמָךְ כְּמָא דִי מַלִּיל יְיָ:", "onk_en": "To smash [<b>break<\/b>] all your enemies before you, as Adonoy declared.", "pj": "לְמִדְחֵי יַת כָּל בַּעֲלֵי דְבָבָךְ מִן קֳדָמָךְ הֵיכְמָא דְמַלֵּיל יְיָ", "pj_en": "that He may drive out all thy enemies before thee, as the Lord hath said.", "tj": "", "tj_en": "", "rashi": "<b>כאשר דבר.<\/b> וְהֵיכָן דִּבֵּר? \"וְהַמֹּתִי אֶת כָּל הָעָם וְגוֹ'\" (שמות כ\"ג):", "rashi_en": "כאשר דבר [TO THRUST OUT ALL THINE ENEMIES] AS [THE LORD] HATH SAID — And where did He promise this? When He said, (Exodus 23:27) “And I will confound all the peoples, etc.\" (Mekhilta)."}, {"ch": 6, "v": 20, "aliyah": 6, "heb": "כִּֽי־יִשְׁאָלְךָ֥ בִנְךָ֛ מָחָ֖ר לֵאמֹ֑ר מָ֣ה הָעֵדֹ֗ת וְהַֽחֻקִּים֙ וְהַמִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהֹוָ֥ה אֱלֹהֵ֖ינוּ אֶתְכֶֽם׃", "onk": "אֲרֵי יִשְׁאֲלִנָּךְ בְּרָךְ מְחָר לְמֵימָר מָא סָהֶדְוָתָא וּקְיָמַיָּא וְדִינַיָּא דִּי פַקִּיד יְיָ אֱלָהָנָא יָתְכוֹן:", "onk_en": "When your son asks you tomorrow, saying, ‘‘What are the testimonies and the statues and the laws that Adonoy, our God, commanded you?’’", "pj": "אֲרוּם יְשַׁיְילִינָךְ בְּרָךְ מְחַר לְמֵימָר מַה סְהִידְוָותָא וּקְיָימַיָא וְדִינַיָא דְפַקֵּיד יְיָ אֱלָהָנָא יַתְכוֹן", "pj_en": "When thy son, in time to come, shall ask thee, saying, What are the testimonies, statutes, and judgments which the Lord our God hath commanded you?", "tj": "", "tj_en": "", "rashi": "<b>כי ישאלך בנך מחר.<\/b> יֵשׁ מָחָר שֶׁהוּא אַחַר זְמַן:", "rashi_en": "כי ישאלך בנך מחר WHEN THY SON ASKETH THEE — There is a usage of the word מחר that refers to a day that only comes after the lapse of some time (and this is so here, i.e. it here means “in time to come\", not \"to-morrow”) (Mekhilta)."}, {"ch": 6, "v": 21, "aliyah": 6, "heb": "וְאָמַרְתָּ֣ לְבִנְךָ֔ עֲבָדִ֛ים הָיִ֥ינוּ לְפַרְעֹ֖ה בְּמִצְרָ֑יִם וַיֹּצִיאֵ֧נוּ יְהֹוָ֛ה מִמִּצְרַ֖יִם בְּיָ֥ד חֲזָקָֽה׃", "onk": "וְתֵימַר לִבְנָךְ עַבְדִין הֲוֵינָא לְפַרְעֹה בְּמִצְרָיִם וְאַפְּקָנָא יְיָ מִמִּצְרַיִם בִּידָא תַקִּיפָא:", "onk_en": "You will tell your son, ‘‘We were slaves to Pharaoh in Egypt, and Adonoy took us out of Egypt with a strong hand.", "pj": "וְתֵימְרוּן לִבְנֵיכוֹן מְשַׁעְבְּדִין הֲוֵינָן לְפַרְעה בְּמִצְרָיִם וְאַפֵּיקָנָא מֵימְרָא דַיְיָ מִמִּצְרַיִם בִּידָא תַּקִיפְתָּא", "pj_en": "then shall you say to your sons, We were servants to Pharoh in Mizraim,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 22, "aliyah": 6, "heb": "וַיִּתֵּ֣ן יְהֹוָ֡ה אוֹתֹ֣ת וּ֠מֹפְתִ֠ים גְּדֹלִ֨ים וְרָעִ֧ים&thinsp;<small>׀<\/small>&thinsp;בְּמִצְרַ֛יִם בְּפַרְעֹ֥ה וּבְכׇל־בֵּית֖וֹ לְעֵינֵֽינוּ׃", "onk": "וִיהַב יְיָ אָתִין וּמוֹפְתִין רַבְרְבִין וּבִישִׁין בְּמִצְרַיִם בְּפַרְעֹה וּבְכָל אֱנַשׁ בֵּיתֵיהּ לְעֵינָנָא:", "onk_en": "And Adonoy set signs and wonders [that were] great and harmful, upon Egypt, upon Pharaoh, and upon his entire household as we watched.", "pj": "וְגָרֵי מֵימְרָא דַיְיָ אָתִין וְתִימְהִין רַבְרְבִין וּמַכְתָּשִׁין בִּישִׁין בְּמִצְרַיִם וּבְפַרְעה וּבְכָל אֵינַשׁ בַּיְיתֵיהּ וַהֲוֵינָא חַמְיָין בְּעֵינָנָא", "pj_en": "and the Word of the Lord brought us out of Mizraim with a mighty hand; and the Word of the Lord wrought signs, great wonders, and sore plagues on Mizraim and on Pharoh and all the men of his house, which our eyes beheld;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 23, "aliyah": 6, "heb": "וְאוֹתָ֖נוּ הוֹצִ֣יא מִשָּׁ֑ם לְמַ֙עַן֙ הָבִ֣יא אֹתָ֔נוּ לָ֤תֶת לָ֙נוּ֙ אֶת־הָאָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַאֲבֹתֵֽינוּ׃", "onk": "וְיָתָנָא אַפֵּק מִתַּמָּן בְּדִיל לְאַעֲלָא יָתָנָא לְמִתַּן לָנָא יָת אַרְעָא דִּי קַיִּים לַאֲבָהָתָנָא:", "onk_en": "And us He took out of there, in order to bring us into, and to give us the land He swore to our forefathers.", "pj": "וְיָתָנָא אַפֵּיק פְּרִיקִין מִן בִּגְלַל לְאַעֲלָא יָתָנָא לְמִתַּן לָנָא יַת אַרְעָא דְקַיֵּים לְאַבְהָתָן", "pj_en": "but us He led forth free to bring us in and give us the land which He sware to our fathers.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 24, "aliyah": 6, "heb": "וַיְצַוֵּ֣נוּ יְהֹוָ֗ה לַעֲשׂוֹת֙ אֶת־כׇּל־הַחֻקִּ֣ים הָאֵ֔לֶּה לְיִרְאָ֖ה אֶת־יְהֹוָ֣ה אֱלֹהֵ֑ינוּ לְט֥וֹב לָ֙נוּ֙ כׇּל־הַיָּמִ֔ים לְחַיֹּתֵ֖נוּ כְּהַיּ֥וֹם הַזֶּֽה׃", "onk": "וּפַקְּדָנָא יְיָ לְמֶעְבַּד יָת כָּל קְיָמַיָּא הָאִלֵּין לְמִדְחַל יָת יְיָ אֱלָהָנָא לְטַב לָנָא כָּל יוֹמַיָּא לְקַיָּמוּתָנָא כְּיוֹמָא הָדֵין:", "onk_en": "Adonoy commanded us to perform all these statutes to [show that we] fear Adonoy, our God; to benefit us for all time, to keep us alive like this day.", "pj": "וּפַקֵּיד עֲלָנָא יְיָ לְמֶעֱבַד יַת כָּל קְיָמַיָא הָאִילֵין לְמִדְחַל מִן קֳדָם יְיָ אֱלָהָנָא לְטַב לָנָא כָּל יוֹמַיָא לְקַיָּימוּתָנָא כִּזְמַן יוֹמָא הָדֵין", "pj_en": "And the Lord commanded us to perform all these statutes, that we may fear the Lord our God for good to us in all days, that He may preserve us alive as at the time of this day;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 25, "aliyah": 6, "heb": "וּצְדָקָ֖ה תִּֽהְיֶה־לָּ֑נוּ כִּֽי־נִשְׁמֹ֨ר לַעֲשׂ֜וֹת אֶת־כׇּל־הַמִּצְוָ֣ה הַזֹּ֗את לִפְנֵ֛י יְהֹוָ֥ה אֱלֹהֵ֖ינוּ כַּאֲשֶׁ֥ר צִוָּֽנוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וְזָכוּתָא<\/b> תְּהֵיא לָנָא אֲרֵי נִטַּר לְמֶעְבַּד יָת כָּל תַּפְקֶדְתָּא הָדָא קֳדָם יְיָ אֱלָהָנָא כְּמָא דִי פַקְּדָנָא:", "onk_en": "And it will be to our credit [<b>merit<\/b>] if we are careful to fulfill this entire <i>mitzvah<\/i> before Adonoy, our God, as He commanded us.", "pj": "וּזְכוּ יְהֵא נְטִיר לָנָא לְעַלְמָא דְאָתֵי אֲרוּם נִנְטוֹר לְמֶעֱבַד יַת כָּל תַּפְקֵידְתָּא הָדָא קֳדָם יְיָ אֱלָהָנָא הֵיכְמָא דְפַקֵדְנָא", "pj_en": "and (the reward of) righteousness will be reserved for us in the world to come, if we keep all these commandments to perform them before the Lord our God, as He hath commanded us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 1, "aliyah": 7, "heb": "כִּ֤י יְבִֽיאֲךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ אֶל־הָאָ֕רֶץ אֲשֶׁר־אַתָּ֥ה בָא־שָׁ֖מָּה לְרִשְׁתָּ֑הּ וְנָשַׁ֣ל גּֽוֹיִם־רַבִּ֣ים&thinsp;<small>׀<\/small>&thinsp;מִפָּנֶ֡יךָ הַֽחִתִּי֩ וְהַגִּרְגָּשִׁ֨י וְהָאֱמֹרִ֜י וְהַכְּנַעֲנִ֣י וְהַפְּרִזִּ֗י וְהַֽחִוִּי֙ וְהַיְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַעֲצוּמִ֖ים מִמֶּֽךָּ׃", "onk": "אֲרֵי יְעֵלִנָּךְ יְיָ אֱלָהָךְ לְאַרְעָא דִּי אַתְּ עָלֵל לְתַמָּן לְמֵירְתַהּ וִיתָרֵךְ עַמְמִין סַגִּיאִין מִן קֳדָמָךְ חִתָּאֵי וְגִרְגָּשָׁאֵי וֶאֱמֹרָאֵי וּכְנַעֲנָאֵי וּפְרִזָּאֵי וְחִוָּאֵי וִיבוּסָאֵי שִׁבְעָא עַמְמִין סַגִּיאִין וְתַקִּיפִין מִנָּךְ:", "onk_en": "When Adonoy, your God, brings you into the land that you are coming there to inherit, He will cast out many nations from before you—the Chittites, the Girgashites and the Emorites, the Canaanites and the Perizites, the Chivites and the Yevusites—seven nations more numerous and more powerful than you.", "pj": "אֲרוּם יַעֲלִינָךְ יְיָ אֱלָהָךְ לְאַרְעָא דְאַתְּ עָלֵיל לְתַמָּן לְמֵירְתָהּ וְיִגְלֵי עַמְמִין סַגִּיאִין מִן קֳדָמָךְ חִתָּאֵי וְגִרְגְּשָׁאֵי וְאֵימוֹרָאֵי וּכְנַעֲנָאֵי וּפְרִיזָאֵי וְחִיוָאֵי וִיבוּסָאֵי שִׁבְעָתֵי עַמְמִין סַגִּיאִין וְתַקִּיפִין מִינָךְ", "pj_en": "When the Lord thy God shall bring thee into the land to which thou wilt come to possess it, and He will make many peoples to go out from before thee, the Hittites, Girgashites, Amorites, Kenaanites, Perizites, Hivites, and Jebusites, seven nations more numerous and strong than thou.,", "tj": "", "tj_en": "", "rashi": "<b>ונשל.<\/b> לְשׁוֹן הַשְׁלָכָה וְהַתָּזָה, וְכֵן \"וְנָשַׁל הַבַּרְזֶל\" (דברים י\"ט):", "rashi_en": "ונשל This is an expression denoting casting away, and throwing to a distance, and similar is, (Deuteronomy 19:5) “and the iron flies off\" (ונשל)."}, {"ch": 7, "v": 2, "aliyah": 7, "heb": "וּנְתָנָ֞ם יְהֹוָ֧ה אֱלֹהֶ֛יךָ לְפָנֶ֖יךָ וְהִכִּיתָ֑ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔ם לֹא־תִכְרֹ֥ת לָהֶ֛ם בְּרִ֖ית וְלֹ֥א תְחׇנֵּֽם׃", "onk": "וְיִמְסְרִנּוּן יְיָ אֱלָהָךְ קֳדָמָךְ וְתִמְחִנּוּן גַּמָּרָא תְגַמַּר
