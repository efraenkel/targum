<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;

  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 35, "v": 1, "aliyah": 1, "heb": "וַיַּקְהֵ֣ל מֹשֶׁ֗ה אֶֽת־כׇּל־עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וַיֹּ֣אמֶר אֲלֵהֶ֑ם אֵ֚לֶּה הַדְּבָרִ֔ים אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה לַעֲשֹׂ֥ת אֹתָֽם׃", "onk": "וְאַכְנֵשׁ משֶׁה יָת כָּל כְּנִשְׁתָּא דִּבְנֵי יִשְׂרָאֵל וַאֲמַר לְהוֹן אִלֵּין פִּתְגָּמַיָּא דִּי פַקֵּד יְיָ לְמֶעְבַּד יָתְהוֹן:", "onk_en": "Moshe assembled the entire congregation of the B’nei Yisrael, and said to them, “These are the words that Adonoy has commanded you to do.", "pj": "ויקהל וּכְנַשׁ משֶׁה יַת כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל וַאֲמַר לְהוֹן אִלֵּין פִּתְגָמַיָא דְפַקֵיד יְיָ לְמֶעֱבַּד יַתְהוֹן", "pj_en": "And Mosheh gathered together all the congregation of the sons of Israel, and said to them: These are the things which the Lord hath commanded to be done.", "tj": "", "tj_en": "", "rashi": "<b>ויקהל משה.<\/b> לְמָחֳרַת יוֹם הַכִּפּוּרִים כְּשֶׁיָּרַד מִן הָהָר, וְהוּא לְשׁוֹן הִפְעִיל, שֶׁאֵינוֹ אוֹסֵף אֲנָשִׁים בְּיָּדַיִם, אֶלָּא הֵן נֶאֱסָפִין עַל פִּי דִּבּוּרוֹ, וְתַרְגּוּמוֹ וְאַכְנֵישׁ:", "rashi_en": "ויקהל משה AND MOSES ASSEMBLED [ALL THE CONGREGATION OF THE CHILDREN OF ISRAEL] — on the morrow after the Day of Atonement when he came down from the mountain. It (the word ויקהל) is used in the verbal form that expresses the idea of causing a thing to be done, because one does not actually assemble people with one’s hands, but they are assembled by his command. The Targum therefore should be ואכניש (not וכנש as some editions have)."}, {"ch": 35, "v": 2, "aliyah": 1, "heb": "שֵׁ֣שֶׁת יָמִים֮ תֵּעָשֶׂ֣ה מְלָאכָה֒ וּבַיּ֣וֹם הַשְּׁבִיעִ֗י יִהְיֶ֨ה לָכֶ֥ם קֹ֛דֶשׁ שַׁבַּ֥ת שַׁבָּת֖וֹן לַיהֹוָ֑ה כׇּל־הָעֹשֶׂ֥ה ב֛וֹ מְלָאכָ֖ה יוּמָֽת׃", "onk": "שִׁתָּא יוֹמִין תִּתְעֲבֵד עִבִדְתָּא וּבְיוֹמָא שְׁבִיעָאָה יְהֵי לְכוֹן קוּדְשָׁא שַׁבָּא שַׁבְּתָא <b>קֳדָם<\/b> יְיָ כָּל דְּיַעְבֵּד בֵּיהּ עִבִדְתָּא יִתְקְטֵל:", "onk_en": "Work may be done six days, but the seventh day must be holy to you, it is a Shabbos of Shabbos to [<b>before<\/b>] Adonoy. Whoever does work on it shall be put to death.", "pj": "שִׁיתָּא יוֹמִין תִּתְעֲבֵיד עִיבִידְתָּא וּבְיוֹמָא שְׁבִיעָאָה יְהֵי לְכוֹן קוּדְשָׁא שַׁבְּתָא נְיָיחָא קֳדָם יְיָ כָּל דְּיַעֲבֵיד עִיבִידְתָּא בְּיוֹמָא דְשַׁבַּתָּא אִתְקְטָלָא יִתְקְטֵיל בְּמַטְלִית אַבְנִין", "pj_en": "Six days thou shalt do work, and on the seventh day there shall be to you the holy Sabbath of repose before the Lord. Whoever doeth work on the Sabbath day, dying he shall die by the casting of stones.", "tj": "", "tj_en": "", "rashi": "<b>ששת ימים.<\/b> הִקְדִּים לָהֶם אַזְהָרַת שַׁבָּת לְצִוּוּי מְלֶאכֶת הַמִּשְׁכָּן, לוֹמַר שֶׁאֵינוֹ דוֹחֶה אֶת הַשַּׁבָּת (מכילתא):", "rashi_en": "ששת ימים SIX DAYS [MAY WORK BE DONE] — He intentionally mentioned to them the prohibition in reference to the Sabbath before the command about the building of the Tabernacle in order to intimate that it does not set aside (supersede) the Sabbath (cf. Mekhilta)."}, {"ch": 35, "v": 3, "aliyah": 1, "heb": "לֹא־תְבַעֲר֣וּ אֵ֔שׁ בְּכֹ֖ל מֹשְׁבֹֽתֵיכֶ֑ם בְּי֖וֹם הַשַּׁבָּֽת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא תְבַעֲרוּן אֶשָּׁתָא בְּכֹל מוֹתְבָנֵיכוֹן בְּיוֹמָא דְּשַׁבְּתָא:", "onk_en": "You must not kindle a fire in all your dwelling places on the day of Shabbos.”", "pj": "עַמִּי בְּנֵי יִשְרָאֵל לָא תְבַעֲרוּן אֵישָׁתָא בְּכָל אֲתַר מוֹתְבָנֵיכוֹן בְּיוֹמָא דְשַׁבַּתָּא", "pj_en": "My people of the sons of Israel, ye shall not kindle a fire in any place of your habitations on the day of the Sabbath.", "tj": "לָא תְבַעֲרוּן אֵשָׁתָא בְּכָל אָתַר בֵּית מְדוֹרֵיכוֹן בְּיוֹמָא דְשַׁבַּתָּא:", "tj_en": "Ye shall not kindle a fire in any place of the house of your dwelling on the Sabbath day.", "rashi": "<b>לא תבערו אש.<\/b> יֵשׁ מֵרַבּוֹתֵינוּ אוֹמְרִים הַבְעָרָה לְלָאו יָצָאת, וְיֵשׁ אוֹמְרִים לְחַלֵּק יָצָאת (שבת ע'):", "rashi_en": "לא תבערו אש YE SHALL NOT KINDLE A FIRE [THROUGHOUT YOUR HABITATIONS ON THEE SABBATH DAY] — There are some of our Rabbis who say that the law about kindling fire is singled out (more lit., goes forth from the general proposition; i. e. it is specially mentioned here although it is included in לא תעשה כל מלאכה, the law prohibiting all work on Sabbath) in order to constitute it a mere negative command (thus indicating that, like all other negative commands, its infringement is punishable by lashes but does not make the offender liable to death as does the doing of other work on Sabbath). Others, however, say that it was singled out in order to separate the various kinds of work comprised in the term כל מלאכה (thus indicating that each transgression of the Sabbath law is to be atoned for separately if several of them have been committed at the same time and under the same circumstances) (cf. Shabbat 70a; Yevamot 6b; Sanhedrin 35b; cf. also Pesachim 5b)."}, {"ch": 35, "v": 4, "aliyah": 1, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה אֶל־כׇּל־עֲדַ֥ת בְּנֵֽי־יִשְׂרָאֵ֖ל לֵאמֹ֑ר זֶ֣ה הַדָּבָ֔ר אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה לֵאמֹֽר׃", "onk": "וַאֲמַר משֶׁה לְכָל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל לְמֵימָר דֵּין פִּתְגָּמָא דִּי פַקֵּד יְיָ לְמֵימָר:", "onk_en": "Moshe said to the entire congregation of the B’nei Yisrael, saying, “This is the word that Adonoy has commanded:", "pj": "וַאֲמַר משֶׁה לְכָל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל לְמֵימַר דֵּין פִּתְגָּמָא דְפַקֵּיד יְיָ לְמֵימָר", "pj_en": "And Mosheh spake to all the assembly of the children of Israel, saying, This is the word which the Lord hath commanded, saying,", "tj": "", "tj_en": "", "rashi": "<b>זה הדבר אשר צוה ה'.<\/b> לִי <b>לאמר<\/b> לָכֶם:", "rashi_en": "זה הדבר אשד צוה ה׳ THIS IS THE THING WHICH THE LORD COMMANDED me, לאמר TO TELL you."}, {"ch": 35, "v": 5, "aliyah": 1, "heb": "קְח֨וּ מֵֽאִתְּכֶ֤ם תְּרוּמָה֙ לַֽיהֹוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔וֹ יְבִיאֶ֕הָ אֵ֖ת תְּרוּמַ֣ת יְהֹוָ֑ה זָהָ֥ב וָכֶ֖סֶף וּנְחֹֽשֶׁת׃", "onk": "סָבוּ מִנְּכוֹן אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ כֹּל דְּיִתְרְעֵי לִבֵּיהּ יַיְתֵי יָת אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ דַּהֲבָא וְכַסְפָּא וּנְחָשָׁא:", "onk_en": "Take [collect] from among yourselves a terumah-offering to [<b>before<\/b>] Adonoy. Every man who is generous of heart shall bring a terumah-offering to [<b>before<\/b>] Adonoy: gold, silver and copper,", "pj": "סָבוּ מִנְכוֹן אַפְרָשׁוּתָא קֳדָם יְיָ כָּל מַאן דְּאִתְרְעֵי לִבֵּיהּ יַיְתֵי יַת אַפְרָשׁוּתָא דַיְיָ דַהֲבָא וְכַסְפָּא וּנְחָשָׁא", "pj_en": "Take of you a separation before the Lord: whosoever is moved in his heart, let him present the separation for the Lord; gold, or silver, or brass,", "tj": "", "tj_en": "", "rashi": "<b>נדיב לבו.<\/b> עַל שֵׁם שֶׁלִּבּוֹ נוֹדְבוֹ, קָרוּי נְדִיב לֵב. כְּבָר פֵּרַשְׁתִּי נִדְבַת הַמִּשְׁכָּן וּמְלַאכְתּוֹ בִּמְקוֹם צַוָּאתָן:", "rashi_en": "נדיב לבו [WHOSOEVER] IS OF A WILLING HEART — Because his heart prompts one to generosity, he is called נדיב לב, one who is prompted to generosity by the heart. I have already explained the various materials which formed the contribution towards the Tabernacle and the work done for it in the passages where the commands about them were given."}, {"ch": 35, "v": 6, "aliyah": 1, "heb": "וּתְכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֥שׁ וְעִזִּֽים׃", "onk": "וְתִכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ וּמְעַזֵּי:", "onk_en": "And greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, fine linen, and goat’s hair,", "pj": "וְתִכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ וּמֵעַזֵּי", "pj_en": "or hyacinth, or purple, or scarlet, or fine linen, or goats' hair,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 7, "aliyah": 1, "heb": "וְעֹרֹ֨ת אֵילִ֧ם מְאׇדָּמִ֛ים וְעֹרֹ֥ת תְּחָשִׁ֖ים וַעֲצֵ֥י שִׁטִּֽים׃", "onk": "וּמַשְׁכֵי דְדִכְרֵי מְסַמְּקֵי וּמַשְׁכֵי <b>דְסַסְגוֹנָא<\/b> וְאָעֵי שִׁטִּין:", "onk_en": "and red-[dyed] rams’ skins, tachash [<b>multicolored<\/b>] skins, and accacia wood,", "pj": "וּמַשְׁכֵי דְדִיכְרֵי מְסַמְקֵי וּמַשְׁכֵי דְסַסְגוֹנָא וְקֵיסֵי דְשִׁיטָא", "pj_en": "or rams' skins dyed red, or skins of seals, (purple skins), and woods of sitta;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 8, "aliyah": 1, "heb": "וְשֶׁ֖מֶן לַמָּא֑וֹר וּבְשָׂמִים֙ לְשֶׁ֣מֶן הַמִּשְׁחָ֔ה וְלִקְטֹ֖רֶת הַסַּמִּֽים׃", "onk": "וּמִשְׁחָא לְאַנְהָרוּתָא וּבוּסְמַיָּא לִמְשַׁח רְבוּתָא וְלִקְטֹרֶת בּוּסְמַיָּא:", "onk_en": "and oil for the light, spices for annointing oil, and for the incense of aromatic spices,", "pj": "וּמִשְׁחָא לְאַנְהָרוּתָא וּבוּשְמַיָא לִמְשַׁח רְבוּתָא וְלִקְטוֹרֶת בּוּסְמַיָא", "pj_en": "or oil for the lights, aromatics for the anointing oil, and sweet incense;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 9, "aliyah": 1, "heb": "וְאַ֨בְנֵי־שֹׁ֔הַם וְאַבְנֵ֖י מִלֻּאִ֑ים לָאֵפ֖וֹד וְלַחֹֽשֶׁן׃", "onk": "וְאַבְנֵי בוּרְלָא וְאַבְנֵי אַשְׁלָמוּתָא לְשַׁקָּעָא בְאֵפוֹדָא וּבְחוּשְׁנָא:", "onk_en": "and onyx stones, and stones for setting into the ephod and the breastplate.", "pj": "מַרְגַלְיַין דְּבוּרְלִין הִינוּן וּמַרְגַּלְיַין דְּאַשְׁלָמוּתָא לִמְשַׁקְעָא בְּאֵפוֹדָא וּבְחוּשְׁנָא", "pj_en": "the onyx stones, and stones for completing the enchasement of the ephoda and the breastplate.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 10, "aliyah": 1, "heb": "וְכׇל־חֲכַם־לֵ֖ב בָּכֶ֑ם יָבֹ֣אוּ וְיַעֲשׂ֔וּ אֵ֛ת כׇּל־אֲשֶׁ֥ר צִוָּ֖ה יְהֹוָֽה׃", "onk": "וְכָל חַכִּימֵי לִבָּא בְּכוֹן יֵיתוּן וְיַעַבְדוּן יָת כָּל דִּי פַקֵּד יְיָ:", "onk_en": "All those who are wise in heart among you shall come and make all that Adonoy has commanded.", "pj": "וְכָל חַכִּימֵי לִבָּא דִבְכוֹן יֵיתוּן וְיַעַבְּדוּן יַת דְּפַקֵּיד יְיָ", "pj_en": "And let all the wise-hearted among you give and make all that the Lord hath commanded:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 11, "aliyah": 1, "heb": "אֶ֨ת־הַמִּשְׁכָּ֔ן אֶֽת־אׇהֳל֖וֹ וְאֶת־מִכְסֵ֑הוּ אֶת־קְרָסָיו֙ וְאֶת־קְרָשָׁ֔יו אֶת־בְּרִיחָ֕ו אֶת־עַמֻּדָ֖יו וְאֶת־אֲדָנָֽיו׃", "onk": "יָת מַשְׁכְּנָא יָת פְּרָסֵיהּ וְיָת חוֹפָאֵיהּ יָת פּוּרְפוֹהִי וְיָת דַּפּוֹהִי יָת עַבְרוֹהִי יָת עַמּוּדוֹהִי וְיָת סַמְכוֹהִי:", "onk_en": "The mishkon, its tent and its cover, its clasps, and its planks, its bars, its pillars and its sockets.", "pj": "יַת מַשְׁכְּנָא יַת פְּרָסֵיהּ וְיַת חוֹפָאָה דִילֵיהּ יַת פּוּרְפוֹי וְיַת לוּחוֹי יַת נַגְרוֹי וְיַת עַמּוּדוֹי וְיַת חוֹמְרוֹי", "pj_en": "The tabernacle, its tent, and its covering, its hasps, and its boards, its bars, and its pillars, and its bases.", "tj": "יַת מַשְׁכְּנָא יַת מַשְׁכְּנֵיהּ וְיַת חֲפוּיֵיהּ יַת פוּרְפּוֹי וְיַת לְוָוחוֹי יַת נַגְרוֹי יַת עַמּוּדוֹי וְיַת חוֹמְרוֹי:", "tj_en": "The tabernacle, and its tent, and its covering, its hasps, and boards, and its bars, its pillars, and its bases.", "rashi": "<b>את המשכן.<\/b> יְרִיעוֹת הַתַּחְתּוֹנוֹת הַנִּרְאוֹת בְּתוֹכוֹ קְרוּיִים מִשְׁכָּן:<br><br><b>את אהלו.<\/b> הִיא אֹהֶל יְרִיעוֹת עִזִּים, הֶעָשׂוּי לְגַג:<br><br><b>ואת מכסהו.<\/b> מִכְסֵה עוֹרוֹת אֵילִים וְהַתְּחָשִׁים:", "rashi_en": "את המשכן THE TABERNACLE — The lower curtains which were visible within the building are called משכן.<br><br>את אהלו ITS TENT — this is the covering of goats’ skins which was made to serve as a roofing.<br><br>ואת מכסהו AND ITS COVERING — the covering of rams’ skins and tachash skins."}, {"ch": 35, "v": 12, "aliyah": 1, "heb": "אֶת־הָאָרֹ֥ן וְאֶת־בַּדָּ֖יו אֶת־הַכַּפֹּ֑רֶת וְאֵ֖ת פָּרֹ֥כֶת הַמָּסָֽךְ׃", "onk": "יָת אֲרוֹנָא וְיָת אֲרִיחוֹהִי יָת כַּפֻּרְתָּא וְיָת פָּרֻכְתָּא דִפְרָסָא:", "onk_en": "The ark and its poles, its cover and the partition screen.", "pj": "יַת אֲרוֹנָא וְיַת אֲרִיחוֹי וְיַת כַּפּוּרְתָּא וְיַת פַּרְגוֹדָא דִפְרָסָא", "pj_en": "The ark, with its staves, and the mercy seat, and the veil for the covering;", "tj": "", "tj_en": "", "rashi": "<b>ואת פרכת המסך.<\/b> פָּרֹכֶת הַמְּחִיצָה; כָּל דָּבָר הַמֵּגֵן, בֵּין מִלְמַעְלָה בֵּין מִכְּנֶגֶד, קָרוּי מָסָךְ וּסְכָךְ, וְכֵן סַכְתָּ בַעֲדוֹ (איוב א'), הִנְנִי סָךְ אֶת דַּרְכֵּךְ (הושע ב'):", "rashi_en": "ואת פרכת המסך means THE CURTAIN OF (that serves for) PARTITIONING — Everything that screens an object, whether it hangs above or in front of it is called מָסָךְ or סְכַךְ. Of similar meaning are: (Job 1:10) “[Hast Thou not] put a partition in front of him?” (שכת = סכת); (Hosea 2:8) “Behold I will partition off (סך = שך) thy way [with thorns]”."}, {"ch": 35, "v": 13, "aliyah": 1, "heb": "אֶת־הַשֻּׁלְחָ֥ן וְאֶת־בַּדָּ֖יו וְאֶת־כׇּל־כֵּלָ֑יו וְאֵ֖ת לֶ֥חֶם הַפָּנִֽים׃", "onk": "יָת פָּתוֹרָא וְיָת אֲרִיחוֹהִי וְיָת כָּל מָנוֹהִי וְיָת לְחֵם אַפַּיָּא:", "onk_en": "The table and its poles, and all its vessels, and the show breads.", "pj": "יַת פָּתוֹרָא וְיַת אֲרִיחוֹי וְיַת כָּל מָנוֹי וְיַת לְחֵם דְּאַפַּיָא", "pj_en": "and the table, and its staves, and all its vessels, and the bread for the Presence;", "tj": "", "tj_en": "", "rashi": "<b>לחם הפנים.<\/b> כְּבָר פֵּרַשְׁתִּי, עַל שֵׁם שֶׁהָיוּ לוֹ פָּנִים לְכָאן וּלְכָאן, שֶׁהוּא עָשׂוּי כְּמִין תֵּבָה פְרוּצָה:", "rashi_en": "לחם הפנים THE SHOW BREAD — I have already explained (Exodus 25:29) that it was so called because it had two faces turning in this direction and in that, because it was made like a case open on two sides."}, {"ch": 35, "v": 14, "aliyah": 1, "heb": "וְאֶת־מְנֹרַ֧ת הַמָּא֛וֹר וְאֶת־כֵּלֶ֖יהָ וְאֶת־נֵרֹתֶ֑יהָ וְאֵ֖ת שֶׁ֥מֶן הַמָּאֽוֹר׃", "onk": "וְיָת מְנַרְתָּא דְאַנְהוֹרֵי וְיָת מָנָהָא וְיָת בּוֹצִינָהָא וְיָת מִשְׁחָא דְאַנְהָרוּתָא:", "onk_en": "The menorah for light, and its vessels, and its lamps and the oil for the light.", "pj": "וְיַת מְנַרְתָּא דְאַנְהוֹרֵי וְיַת מָנָהָא וְיַת בּוֹצִינָהָא וְיַת מִשְׁחָא דְאַנְהָרוּתָא", "pj_en": "and the candelabrum for illumination, with the lamps, and the oil for the light;", "tj": "", "tj_en": "", "rashi": "<b>ואת כליה.<\/b> מֶלְקָחַיִם וּמַחְתּוֹת:<br><br><b>נרתיה.<\/b> לוצי\"יש בְּלַעַז, בָּזִיכִים שֶׁהַשֶּׁמֶן וְהַפְּתִילוֹת נְתוּנִין בָּהֶן:<br><br><b>ואת שמן המאור.<\/b> אַף הוּא צָרִיךְ חַכְמֵי לֵב, שֶׁהוּא מְשֻׁנֶּה מִשְּׁאָר שְׁמָנִים, כְּמוֹ שֶׁמְּפֹרָשׁ בִּמְנָחוֹת (דף פ\"ו), מְגַרְגְּרוֹ בְרֹאשׁ הַזַּיִת, וְהוּא כָּתִית וְזַךְ:", "rashi_en": "ואת כליה AND ITS VESSELS — the tongs and snuff-dishes.<br><br>נרתיה ITS LAMPS — luces in old French — bowls into which the oil and the wicks were placed.<br><br>ואת שמן המאר AND THE OIL ALSO FOR THE LIGHT — This also required wise-hearted men for preparing it (and therefore Scripture mentions it also after its statement v. 10 “And every wise hearted man … shall make…”), for it was different from other oils, as it is explained in Menachot 86a: he lets it (the olive) ripen on the top of the olive-tree etc. and thus it (the oil) is “beaten and yet clear” as Scripture prescribes (Exodus 27:20)."}, {"ch": 35, "v": 15, "aliyah": 1, "heb": "וְאֶת־מִזְבַּ֤ח הַקְּטֹ֙רֶת֙ וְאֶת־בַּדָּ֔יו וְאֵת֙ שֶׁ֣מֶן הַמִּשְׁחָ֔ה וְאֵ֖ת קְטֹ֣רֶת הַסַּמִּ֑ים וְאֶת־מָסַ֥ךְ הַפֶּ֖תַח לְפֶ֥תַח הַמִּשְׁכָּֽן׃", "onk": "וְיָת מַדְבְּחָא דִקְטֹרֶת <b>בּוּסְמַיָּא<\/b> וְיָת אֲרִיחוֹהִי וְיָת מִשְׁחָא דִרְבוּתָא וְיָת קְטֹרֶת בּוּסְמַיָּא וְיָת פְּרָסָא דְתַרְעָא לִתְרַע מַשְׁכְּנָא:", "onk_en": "The incense [<b>spices<\/b>] altar, and its poles, and the annointing oil, and the incense of aromatic spices, and the screen for the entrance, at the entrance of the mishkon.", "pj": "וְיַת מַדְבְּחָא דִקְטוֹרֶת בּוּסְמַיָא וְיַת אֲרִיחוֹי וְיַת מִישְׁחָא דִרְבוּתָא וְיַת קְטוֹרֶת בּוּסְמַיָא וְיַת פָּרָסָא דְתַרְעָא לִתְרַע מַשְׁכַּן זִימְנָא", "pj_en": "and the altar of sweet incense, and its staves, and the anointing oil, and the sweet incense, and the curtain for the door of the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "<b>מסך הפתח.<\/b> וִילוֹן שֶׁלִּפְנֵי הַמִּזְרָח, שֶׁלֹּא הָיוּ שָׁם קְרָשִׁים וְלֹא יְרִיעוֹת:", "rashi_en": "מסך הפתח THE SCREEN FOR THE ENTRANCE — the curtain that was in front of the east side of the Tabernacle, for there were neither boards nor curtains there."}, {"ch": 35, "v": 16, "aliyah": 1, "heb": "אֵ֣ת&thinsp;<b>׀<\/b> מִזְבַּ֣ח הָעֹלָ֗ה וְאֶת־מִכְבַּ֤ר הַנְּחֹ֙שֶׁת֙ אֲשֶׁר־ל֔וֹ אֶת־בַּדָּ֖יו וְאֶת־כׇּל־כֵּלָ֑יו אֶת־הַכִּיֹּ֖ר וְאֶת־כַּנּֽוֹ׃", "onk": "יָת מַדְבְּחָא דַעֲלָתָא וְיָת סְרָדָא דִנְחָשָׁא דִּילֵיהּ יָת אֲרִיחוֹהִי וְיָת כָּל מָנוֹהִי יָת כִּיוֹרָא וְיָת בְּסִיסֵיהּ:", "onk_en": "The altar for burnt-offerings, with its copper grate, its poles and all its vessels, the laver and its base.", "pj": "יַת מַדְבְּחָא דַעֲלָתָא וְיַת קַנְקַל דִּנְחָשָׁא דִילֵיהּ יַת אֲרִיחוֹי וְיַת כָּל מָנוֹי וְיַת כִּיּוֹרָא וְיַת בְּסִיסֵיהּ", "pj_en": "the altar of burnt offering, and its brasen grate, with its staves, and its vessels, and the laver, with its base;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 17, "aliyah": 1, "heb": "אֵ֚ת קַלְעֵ֣י הֶחָצֵ֔ר אֶת־עַמֻּדָ֖יו וְאֶת־אֲדָנֶ֑יהָ וְאֵ֕ת מָסַ֖ךְ שַׁ֥עַר הֶחָצֵֽר׃", "onk": "יָת סְרָדֵי דַרְתָּא יָת עַמּוּדוֹהִי וְיָת סַמְכָהָא וְיָת פְּרָסָא דִּתְרַע דַּרְתָּא:", "onk_en": "The curtains for the enclosure, its pillars and its sockets, and the screen for the entrance of the enclosure.", "pj": "יַת וָוִילְוַת דַּרְתָּא יַת עַמּוּדוֹי וְיַת חוֹמַרְנָהָא וְיַת פְּרָסָא דִתְרַע דַּרְתָּא", "pj_en": "and the curtains of the court, with its pillars, and bases, and the hanging for the gate of the court,", "tj": "", "tj_en": "", "rashi": "<b>את עמדיו ואת אדניה.<\/b> הֲרֵי חָצֵר קָרוּי כָּאן לְשׁוֹן זָכָר וּלְשׁוֹן נְקֵבָה, וְכֵן דְּבָרִים הַרְבֵּה:<br><br><b>ואת מסך שער החצר.<\/b> וִילוֹן פָּרוּשׂ לְצַד הַמִּזְרָח עֶשְׂרִים אַמָּה אֶמְצָעִיּוֹת שֶׁל רֹחַב הֶחָצֵר – שֶׁהָיָה חֲמִשִּׁים רֹחַב – וּסְתוּמִין הֵימֶנּוּ לְצַד צָפוֹן ט\"ו אַמָּה, וְכֵן לַדָּרוֹם, שֶׁנֶּאֱמַר, וַחֲמֵשׁ עֶשְׂרֵה אַמָּה קְלָעִים לַכָּתֵף:", "rashi_en": "את עמדיו ואת אדניה ITS COLUMNS AND ITS SOCKETS — עמדיו has a masculine and אדניה a feminine suffix; thus חצר is here used as (lit., called) masculine and feminine noun. Similar it is with many things (cf. Rashi on Genesis 32:9).<br><br>ואת מסך שער החצר AND THE SCREEN FOR THE GATE OF THE ENCLOSURE — the curtain which was hanging on the east side covering the twenty middle cubits in the width of the enclosure which latter was fifty cubits wide. Of this fifteen cubits on the north side were closed by hangings and so, too, on the south side, as it is said, (Exodus 27:14, 15) “The hangings of one side of the gate shall be fifteen cubits … [and on the other side shall be hangings fifteen cubits]”."}, {"ch": 35, "v": 18, "aliyah": 1, "heb": "אֶת־יִתְדֹ֧ת הַמִּשְׁכָּ֛ן וְאֶת־יִתְדֹ֥ת הֶחָצֵ֖ר וְאֶת־מֵיתְרֵיהֶֽם׃", "onk": "יָת סִכֵּי מַשְׁכְּנָא וְיָת סִכֵּי דְדַרְתָּא וְיָת אַטּוּנֵיהוֹן:", "onk_en": "The stakes of the mishkon, and the stakes of the enclosure and their ropes.", "pj": "יַת מַחְתֵּי מַשְׁכְּנָא וְיַת מַחְתֵּי דַרְתָּא וְיַת אֲטוּנֵיהוֹן", "pj_en": "and the pins of the tabernacle, and the pins of the court, and their cords;", "tj": "", "tj_en": "", "rashi": "<b>יתדת.<\/b> לִתְקֹעַ וְלִקְשׁוֹר בָּהֶם סוֹפֵי הַיְרִיעוֹת בָּאָרֶץ, שֶׁלֹּא יָנוּעוּ בָּרוּחַ:<br><br><b>מיתריהם.<\/b> חֲבָלִים לִקְשֹׁר:", "rashi_en": "יתדת THE PINS — in order to insert them into the ground and to fasten thereby the edges of the curtains that they should not be moved about by the wind.<br><br>מיתריהם THEIR CORDS to bind with."}, {"ch": 35, "v": 19, "aliyah": 1, "heb": "אֶת־בִּגְדֵ֥י הַשְּׂרָ֖ד לְשָׁרֵ֣ת בַּקֹּ֑דֶשׁ אֶת־בִּגְדֵ֤י הַקֹּ֙דֶשׁ֙ לְאַהֲרֹ֣ן הַכֹּהֵ֔ן וְאֶת־בִּגְדֵ֥י בָנָ֖יו לְכַהֵֽן׃", "onk": "יָת לְבוּשֵׁי <b>שִׁמּוּשָׁא לְשַׁמָּשָׁא בְקוּדְשָׁא<\/b> יָת לְבוּשֵׁי קוּדְשָׁא לְאַהֲרֹן כַּהֲנָא וְיָת לְבוּשֵׁי בְנוֹהִי לְשַׁמָּשָׁא:", "onk_en": "The covering cloths [<b>of service<\/b>] for the holy articles [<b>to serve in the Sanctuary<\/b>], and the sacred garments for Aharon the kohein, and the garments for his sons to wear when they serve.", "pj": "יַת לְבוּשֵׁי שִׁמּוּשָׁא לְשַׁמָּשָׁא בְּקוּדְשָׁא יַת לְבוּשֵׁי קוּדְשָׁא דִּלְאַהֲרן כַּהֲנָא וְיַת לְבוּשֵׁי בְּנוֹי לְשַׁמָּשָׁא", "pj_en": "the vestments of ministration, for ministering in the sanctuary, and the holy vestments for Aharon the priest, and the vestments of his sons for ministering.", "tj": "", "tj_en": "", "rashi": "<b>בגדי השרד.<\/b> לְכַסּוֹת הָאָרוֹן וְהַשֻּׁלְחָן, הַמְּנוֹרָה וְהַמִּזְבְּחוֹת בִּשְׁעַת סִלּוּק מַסָּעוֹת:", "rashi_en": "בגדי השרד THE KNITTED GARMENTS — to cover up the Ark, the table, the candelabrum and the altars at the time of removing and packing up the articles in the Tabernacle when they set out on their journeyings."}, {"ch": 35, "v": 20, "aliyah": 1, "heb": "וַיֵּ֥צְא֛וּ כׇּל־עֲדַ֥ת בְּנֵֽי־יִשְׂרָאֵ֖ל מִלִּפְנֵ֥י מֹשֶֽׁה׃", "onk": "וּנְפָקוּ כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל מִן קֳדָם משֶׁה:", "onk_en": "The entire congregation of the B’nei Yisrael departed from the presence of Moshe.", "pj": "וּנְפָקוּ כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל מִן קֳדָם משֶׁה", "pj_en": "And all the congregation of the sons of Israel went out from before Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 21, "aliyah": 2, "heb": "וַיָּבֹ֕אוּ כׇּל־אִ֖ישׁ אֲשֶׁר־נְשָׂא֣וֹ לִבּ֑וֹ וְכֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜וֹ אֹת֗וֹ הֵ֠בִ֠יאוּ אֶת־תְּרוּמַ֨ת יְהֹוָ֜ה לִמְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּלְכׇל־עֲבֹ֣דָת֔וֹ וּלְבִגְדֵ֖י הַקֹּֽדֶשׁ׃", "onk": "וַאֲתוֹ כָּל גְּבַר דְּאִתְרְעֵי לִבֵּיהּ וְכֹל דִּי <b>אַשְׁלֵמַת<\/b> רוּחֵיהּ יָתֵיהּ אַיְתִיאוּ יָת אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ לַעֲבִידַת מַשְׁכַּן זִמְנָא וּלְכָל פֻּלְחָנֵיהּ וְלִלְבוּשֵׁי קוּדְשָׁא:", "onk_en": "Every man whose heart lifted him up came—and every one whose generous spirit inspired [<b>filled<\/b>] him brought a terumah-offering to [<b>before<\/b>] Adonoy, for the work of the Tent of Meeting, and for all [that was needed for] its service, and for the sacred garments.", "pj": "וְאָתוֹ כָּל גְּבַר דְּאִתְרְעֵי לִבֵּיהּ וְכָל דְּאַשְׁלֵמִית רוּחֵיהּ בִּנְבוּאָתָא דְעִמֵּיהּ הַיְתִיוּ יַת אַפְרָשׁוּתָא לִקְדָם יְיָ לְעִיבִידַת מַשְׁכַּן זִימְנָא וּלְכָל פּוּלְחָנֵיהּ וְלִלְבוּשֵׁיהּ קוּדְשָׁא", "pj_en": "And every man whose heart moved him, and every one who was filled with the Spirit of prophecy, came, and brought what he had for a separation before the Lord for the work of the tabernacle of ordinance, and for all its service, and for the holy vestments.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 22, "aliyah": 2, "heb": "וַיָּבֹ֥אוּ הָאֲנָשִׁ֖ים עַל־הַנָּשִׁ֑ים כֹּ֣ל&thinsp;<b>׀<\/b> נְדִ֣יב לֵ֗ב הֵ֠בִ֠יאוּ חָ֣ח וָנֶ֜זֶם וְטַבַּ֤עַת וְכוּמָז֙ כׇּל־כְּלִ֣י זָהָ֔ב וְכׇל־אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַיהֹוָֽה׃", "onk": "<b>וּמַיְתַן גֻּבְרַיָּא עַל<\/b> נְשַׁיָּא כֹּל דְּאִתְרְעֵי לִבֵּיהּ אַיְתִיאוּ שֵׁירִין וְשִׁבְכִין וְעִזְקַן וּמָחוּךְ כָּל מָן דִּדְהַב וְכָל גְּבַר דִּי אֲרֵים אֲרָמוּת דַּהֲבָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "And they came—both men and [<b>brought—men in addition to<\/b>] woman—all who were generous of heart brought bracelets, nose rings, finger rings, and buckles—all kinds of golden vessels—and every man that offered a wave-offering of gold unto [<b>before<\/b>] Adonoy.", "pj": "וְאָתוּ גוּבְרַיָא עִם נְשַׁיָא כָּל מַאן דְּאִתְרְעֵי לִבֵּיהּ הַיְתִיוּ שִׁירִין וְשִׁיוְוִין עִזְקַן וּמְחוֹכִין וְכָל תַּכְשִׁיט דִּדְהַב וְכָל גְבַר דְּאֲרִים אֲרָמוּת דַּהֲבָא קֳדָם יְיָ", "pj_en": "And with the men came the women, every one whose heart was moved, and brought chains, and necklaces, rings, bracelets, and every ornament of gold; every one offering up the offering of gold before the Lord.", "tj": "", "tj_en": "", "rashi": "(<b>על הנשים.<\/b> עִם הַנָּשִׁים וּסְמוּכִין אֲלֵיהֶן):<br><br><b>חח.<\/b> הוּא תַּכְשִׁיט שֶׁל זָהָב עָגֹל, נָתוּן עַל הַזְּרוֹעַ, וְהוּא הַצָּמִיד:<br><br><b>וכומז.<\/b> כְּלִי זָהָב הוּא נָתוּן כְּנֶגֶד אוֹתוֹ מָקוֹם לָאִשָּׁה, וְרַבּוֹתֵינוּ פֵּרְשׁוּ שֵׁם כּוּמָז, כָּאן מְקוֹם זִמָּה (שבת ס\"ד):", "rashi_en": "על הנשים means with the women and closely following them.<br><br>חח is a circular golden ornament placed upon the arm; it is the צמיד which is often mentioned in Scripture (cf. e. g., Numbers 31:50).<br><br>כומז was a golden ornament worn by the women upon their private parts, Our Rabbis explain the name כּוּמָז as [an acrostic]: כַּאן מְקוֹם זִמָּה, [meaning] here is the place of licentiousness. (cf. Shabbat 64a)."}, {"ch": 35, "v": 23, "aliyah": 2, "heb": "וְכׇל־אִ֞ישׁ אֲשֶׁר־נִמְצָ֣א אִתּ֗וֹ תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֣שׁ וְעִזִּ֑ים וְעֹרֹ֨ת אֵילִ֧ם מְאׇדָּמִ֛ים וְעֹרֹ֥ת תְּחָשִׁ֖ים הֵבִֽיאוּ׃", "onk": "וְכָל גְּבַר דְּאִשְׁתְּכַח עִמֵּיהּ תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ וּמְעַזֵּי וּמַשְׁכֵי דְדִכְרֵי מְסַמְּקֵי וּמַשְׁכֵי סַסְגּוֹנָא אַיְתִיאוּ:", "onk_en": "Every man who had with him greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, fine linen, goats’ hair, red dyed rams’ skins, and tachash [<b>multicolored<\/b>] skins brought them.", "pj": "וְכָל גְּבַר דְּהִשְׁתַּכַּח עִמֵּיהּ תִּכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ וּמְעִיזֵי וּמַשְׁכֵי דְדִכְרֵי מְסַמְקֵי וּמַשְׁכֵי סַסְגוֹנָא הַיְיתִיוּ", "pj_en": "And every one with whom was found hyacinth, or purple, or crimson, or fine linen, goats' hair, or purple skins, brought the separation before the Lord; ___", "tj": "", "tj_en": "", "rashi": "<b>וכל איש אשר נמצא אתו.<\/b> תְּכֵלֶת אוֹ אַרְגָּמָן אוֹ תוֹלַעַת שָׁנִי אוֹ עוֹרוֹת אֵילִים אוֹ תְּחָשִׁים כֻּלָּם הֵבִיאוּ:", "rashi_en": "וכל איש אשר נמצא אתו AND EVERY MAN WITH WHOM WAS FOUND blue purple, or red purple, or crimson, or rams’ skins, or tachash skins — all of them brought whatever they had."}, {"ch": 35, "v": 24, "aliyah": 2, "heb": "כׇּל־מֵרִ֗ים תְּר֤וּמַת כֶּ֙סֶף֙ וּנְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהֹוָ֑ה וְכֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜וֹ עֲצֵ֥י שִׁטִּ֛ים לְכׇל־מְלֶ֥אכֶת הָעֲבֹדָ֖ה הֵבִֽיאוּ׃", "onk": "כָּל דַּאֲרֵים אֲרָמוּת כְּסַף וּנְחַשׁ אַיְתִיאוּ יָת אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ וְכֹל דִּי אִשְׁתְּכַח עִמֵּיהּ אָעֵי שִׁטִּין לְכָל עִבִידַת פֻּלְחָנָא אַיְתִיאוּ:", "onk_en": "Everyone who did lift up a terumah-offering of silver or copper, brought the terumah-offering to [<b>before<\/b>] Adonoy; and everyone who had with him acacia wood for use in the work of the service, brought it.", "pj": "כָּל דְּאָרִים אֲרָמוּת כַּסְפָּא וּנְחָשָׁא הַיְתִיוּ יַת אַפְרָשׁוּתָא קֳדָם יְיָ וְכָל מַאן דְּהִשְׁתַּכַּח עִמֵּיהּ קִיסִין דְּשִׁיטָא לְכָל עִיבִידַת פּוּלְחָנָא הַיְתִיוּ", "pj_en": "___ and all with whom were found woods of sitta for all the work of the service brought.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 25, "aliyah": 2, "heb": "וְכׇל־אִשָּׁ֥ה חַכְמַת־לֵ֖ב בְּיָדֶ֣יהָ טָו֑וּ וַיָּבִ֣יאוּ מַטְוֶ֗ה אֶֽת־הַתְּכֵ֙לֶת֙ וְאֶת־הָֽאַרְגָּמָ֔ן אֶת־תּוֹלַ֥עַת הַשָּׁנִ֖י וְאֶת־הַשֵּֽׁשׁ׃", "onk": "וְכָל אִתְּתָא חַכִּימַת לִבָּא בִּידָהָא מְעַזְּלָא וּמַיְתַן כַּד עָזֵל יָת תִּכְלָא וְיָת אַרְגְּוָנָא יָת <b>צְבַע<\/b> זְהוֹרִי וְיָת בּוּצָא:", "onk_en": "And every wise-hearted woman spun with her hands; and they brought the spun yarn of greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool and fine linen.", "pj": "וְכָל אִיתְּתָא חַכִּימַת לִבָּהָא בִידָהָא הֲוַת עַזְלָא וּמַתְיָין כַּד עָזִיל יַת תִּכְלָא וְיַת אַרְגְּוָונָא וְיַת צְבַע זְהוֹרִי וְיַת בּוּצָא", "pj_en": "And every woman whose heart was wise spun with her hands, and brought the spun work of hyacinth, and purple, and crimson, and fine linen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 26, "aliyah": 2, "heb": "וְכׇ֨ל־הַנָּשִׁ֔ים אֲשֶׁ֨ר נָשָׂ֥א לִבָּ֛ן אֹתָ֖נָה בְּחׇכְמָ֑ה טָו֖וּ אֶת־הָעִזִּֽים׃", "onk": "וְכָל נְשַׁיָּא דְּאִתְרְעֵי לִבְּהֶן עִמְּהֶן בְּחָכְמָא עַזְּלַן יָת מֵעַזְיָא:", "onk_en": "And all the women whose hearts inspired them with wisdom, spun the goat’s hair.", "pj": "וְכָל נְשַׁיָא דְאִתְרְעֵי לִבְּהוֹן עִמְהוֹן בְּחָכְמְתָא הֲווֹן עַזְלָן יַת מְעִיזַיָא עַל גְּוִיַיתְהוֹן וּמְנַפְסִין יַתְהֵן כַּד הִינוּן חַיִּין", "pj_en": "And all the women whose hearts were moved in wisdom spun goats' hair (while) upon their bodies, and sheared them, being alive.", "tj": "", "tj_en": "", "rashi": "<b>טוו את העזים.<\/b> הִיא הָיְתָה אָמָּנוּת יְתֵרָה, שֶׁמֵּעַל גַּבֵּי הָעִזִּים טוֹוִין אוֹתָם (שבת ע\"ד):", "rashi_en": "טוו את העזים [AND THE WOMEN] SPUN THE GOATS’ HAIR (lit., the goats) — This required extraordinary skill, for they spun it (the goats’ hair) from off the backs of the goats (whilst it was still on the living animals) (Shabbat 99a)."}, {"ch": 35, "v": 27, "aliyah": 2, "heb": "וְהַנְּשִׂאִ֣ם הֵבִ֔יאוּ אֵ֚ת אַבְנֵ֣י הַשֹּׁ֔הַם וְאֵ֖ת אַבְנֵ֣י הַמִּלֻּאִ֑ים לָאֵפ֖וֹד וְלַחֹֽשֶׁן׃", "onk": "וְרַבְרְבַיָּא אַיְתִיאוּ יָת אַבְנֵי בוּרְלָא וְיָת אַבְנֵי אַשְׁלָמוּתָא לְשַׁקָּעָא בְּאֵפוֹדָא וּבְחוּשְׁנָא:", "onk_en": "And the leaders [of the tribes] brought onyx stones, and stones for setting into the ephod and breastplate.", "pj": "וַעֲנַנֵי שְׁמַיָא אָזְלִין לְפִישׁוֹן וְדַלְיַין מִתַּמָּן יַת אַבְנֵי בּוּרְלְוַת חֵילָא וְיַת אַבְנֵי אַשְׁלָמוּתָא לְשַׁקְעָא בְּאֵיפוֹדָא וּבְחוּשְׁנָא וּמַחְתַן יַתְהוֹן בְּאַנְפֵּי מַדְבְּרָא אָזְלִין רַבְרְבָנֵי יִשְרָאֵל וּמַיְיתַן יַתְהוֹן לִצְרוֹךְ עִיבִידְתָּא", "pj_en": "And the clouds of heaven went to the Phison, and drew up from thence onyx stones, and stones for infilling, to enchase the ephod and the breastplate, and spread them upon the face of the wilderness; and the princes of Israel went, and brought them for the need of the work.", "tj": "", "tj_en": "", "rashi": "<b>והנשאם הביאו.<\/b> אָמַר רַ' נָתָן: מָה רָאוּ נְשִׂיאִים לְהִתְנַדֵּב בַּחֲנֻכַּת הַמִּזְבֵּחַ בַּתְּחִלָּה וּבִמְלֶאכֶת הַמִּשְׁכָּן לֹא הִתְנַדְּבוּ בַּתְּחִלָּה? אֶלָּא כָּךְ אָמְרוּ נְשִׂיאִים, יִתְנַדְּבוּ צִבּוּר מַה שֶּׁמִּתְנַדְּבִין, וּמַה שֶּׁמְּחַסְּרִים, אָנוּ מַשְׁלִימִין אוֹתוֹ, כֵּיוָן שֶׁהִשְׁלִימוּ צִבּוּר אֶת הַכֹּל – שֶׁנֶּ' וְהַמְּלָאכָה הָיְתָה דַיָּם – אָמְרוּ נְשִׂיאִים מֶה עָלֵינוּ לַעֲשׂוֹת? <b>הביאו את אבני השהם<\/b> וְגוֹ', לְכָךְ הִתְנַדְּבוּ בַּחֲנֻכַּת הַמִּזְבֵּחַ תְּחִלָּה, וּלְפִי שֶׁנִּתְעַצְּלוּ מִתְּחִלָּה נֶחְסְרָה אוֹת מִשְּׁמָם, וְהַנְּשִׂאִם כְּתִיב (ספרי במדבר מ\"ה):", "rashi_en": "והנשאם הביאו AND THE PRINCES BROUGHT [ONYX STONES] R. Nathan asked, “What reason had the princes to give their contributions at the dedication of the altar (Numbers 7:12ff.) first of all the people, whereas at the work of the Tabernacle they were not the first, but the last to contribute?” But — replied he — the princes spoke thus: “Let the community in general contribute all they with to give and what will then be lacking we shall supply” But when the community gave everything needed in its entirety — as it is said, (Exodus 36:7) “For the stuff they had was enough [for all the work to make it, and some was left]” — the princes asked, “What can we now do?” therefore הביאו את אבני השהם וגו׳ THEY BROUGHT THE ONYX STONES etc. That is why they were the first to contribute at the consecration of the altar. Because, however, they were dilatory at the beginning, a letter is missing here from their title (thus intimating that something, viz., zeal was lacking in them): for it is written והנשאם instead of והנשיאים (Numbers Rabbah 12:16)."}, {"ch": 35, "v": 28, "aliyah": 2, "heb": "וְאֶת־הַבֹּ֖שֶׂם וְאֶת־הַשָּׁ֑מֶן לְמָא֕וֹר וּלְשֶׁ֙מֶן֙ הַמִּשְׁחָ֔ה וְלִקְטֹ֖רֶת הַסַּמִּֽים׃", "onk": "וְיָת בּוּסְמָא וְיָת מִשְׁחָא לְאַנְהָרוּתָא וּלְמִשְׁחָא דִרְבוּתָא וְלִקְטֹרֶת בּוּסְמַיָּא:", "onk_en": "And the spices, and the oil for the light, and the anointing oil, and the incense of aromatic spices.", "pj": "וְתַיְבִין עֲנָנֵי שְׁמַיָא וְאָזְלִין לְגַן עֵדֶן וְנַסְבִין מִתַּמָּן יַת בּוּשְמָא בְּחִירָא וְיַת מִשְׁחָא דְזֵיתָא לְאַנְהָרוּתָא וְיַת אַפַרְסְמָא דַכְיָא לִמְשַׁח רְבוּתָא וְלִקְטוֹרֶת בּוּסְמַיָא", "pj_en": "And the clouds of heaven returned, and went to the garden of Eden, and took from thence choice aromatics, and oil of olives for the light, and pure balsam for the anointing oil, and for the sweet incense.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 29, "aliyah": 2, "heb": "כׇּל־אִ֣ישׁ וְאִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּם֮ אֹתָם֒ לְהָבִיא֙ לְכׇל־הַמְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה לַעֲשׂ֖וֹת בְּיַד־מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי־יִשְׂרָאֵ֛ל נְדָבָ֖ה לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "כָּל גְּבַר וְאִתְּתָא דְּאִתְרְעֵי לִבְּהוֹן עִמְּהוֹן לְאַיְתָאָה לְכָל עִבִדְתָּא דִּי פַקֵּד יְיָ לְמֶעְבַּד בִּידָא דְמשֶׁה אַיְתִיאוּ בְנֵי יִשְׂרָאֵל נְדַבְתָּא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Every man and woman whose generous heart inspired them to bring something for all the work that Adonoy had commanded to be done through Moshe [did so]. The B’nei Yisrael brought a free-will gift to [<b>before<\/b>] Adonoy.", "pj": "כָּל גְּבַר בַּר יִשְרָאֵל וְאִתְּתָא בַת יִשְרָאֵל דְּאִתְרְעֵי לִבְּהוֹן עִמְהוֹן לְאַיְיתָאָה לְכָל עִיבִידְתָּא דְפַקֵּיד יְיָ לְמֶעֱבַד בִּידָא דְמשֶׁה הַיְתִיוּ בְּנֵי יִשְרָאֵל נְדַבְתָּא קֳדָם יְיָ", "pj_en": "Every man, a son of Israel, and (every) woman, a daughter of Israel, who was moved in heart, brought for all the work which the Lord by Mosheh had commanded to be made; so brought the children of Israel the votive gift before the Lord.", "tj": "נְסִיבָה:", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 30, "aliyah": 3, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהֹוָ֖ה בְּשֵׁ֑ם בְּצַלְאֵ֛ל בֶּן־אוּרִ֥י בֶן־ח֖וּר לְמַטֵּ֥ה יְהוּדָֽה׃", "onk": "וַאֲמַר משֶׁה לִבְנֵי יִשְׂרָאֵל חֲזוֹ <b>דְּרַבִּי<\/b> יְיָ בְּשׁוּם בְּצַלְאֵל בַּר אוּרִי בַר חוּר לְשִׁבְטָא דִיהוּדָה:", "onk_en": "Moshe said to the B’nei Yisrael, “See, Adonoy has designated [<b>exalted<\/b>] by name, Betzalel, son of Uri, son of Chur, of the tribe of Yehudah.", "pj": "וַאֲמַר משֶׁה לִבְנֵי יִשְרָאֵל חָמוֹן דְּמַנֵי יְיָ בְּשׁוּם טַב בְּצַלְאֵל בַּר אוּרִי בַּר חוּר לְשִׁבְטָא דִיהוּדָא", "pj_en": "And Mosheh said to the sons of Israel, See, the Lord hath ordained with a good name Bezalel bar Uri bar Hur, of the tribe of Jehudah,", "tj": "", "tj_en": "", "rashi": "<b>חור.<\/b> בְּנָהּ שֶׁל מִרְיָם הָיָה:", "rashi_en": "חור HUR was the son the Miriam (Sotah 11b; cf. Rashi on Exodus 24:14)."}, {"ch": 35, "v": 31, "aliyah": 3, "heb": "וַיְמַלֵּ֥א אֹת֖וֹ ר֣וּחַ אֱלֹהִ֑ים בְּחׇכְמָ֛ה בִּתְבוּנָ֥ה וּבְדַ֖עַת וּבְכׇל־מְלָאכָֽה׃", "onk": "וְאַשְׁלֵם עִמֵּיהּ <b>רוּחַ נְבוּאָה מִן קֳדָם יְיָ<\/b> בְּחָכְמְתָא בְּסוּכְלְתָנוּ וּבְמַדַּע וּבְכָל עִבִידָא:", "onk_en": "And He endowed him with Divine [<b>the<\/b>] spirit [<b>of prophecy from before Adonoy<\/b>], with wisdom, with understanding, with knowledge and with [the skill to perform] all types of crafting.", "pj": "וְאַשְׁלֵים עִמֵּיהּ רוּחַ נְבוּאָה מִן קֳדָם יְיָ בְּחוּכְמָתָא בְּסוּכְלְתָנוּ וּבְמַנְדְּעָא וּבְכָל עִיבִידְתָּא", "pj_en": "and hath filled him with the Spirit of prophecy from before the Lord, in wisdom, in understanding, in knowledge, and in all handicraft;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 32, "aliyah": 3, "heb": "וְלַחְשֹׁ֖ב מַֽחֲשָׁבֹ֑ת לַעֲשֹׂ֛ת בַּזָּהָ֥ב וּבַכֶּ֖סֶף וּבַנְּחֹֽשֶׁת׃", "onk": "<b>וּלְאַלָּפָא אוּמַנְוָן<\/b> לְמֶעְבַּד בְּדַהֲבָא וּבְכַסְפָּא וּבִנְחָשָׁא:", "onk_en": "And to devise [plans] [<b>teach craftsmanship<\/b>] with ingenuity, to execute [those plans] in gold, in silver and in copper.", "pj": "וּלְאַלָפָא אוּמַנְוָון לְמֶעֱבַד בְּדַהֲבָא וּבְכַסְפָּא וּבִנְחָשָׁא", "pj_en": "and to instruct artificers to work in gold, and in silver, and in brass,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 33, "aliyah": 3, "heb": "וּבַחֲרֹ֥שֶׁת אֶ֛בֶן לְמַלֹּ֖את וּבַחֲרֹ֣שֶׁת עֵ֑ץ לַעֲשׂ֖וֹת בְּכׇל־מְלֶ֥אכֶת מַחֲשָֽׁבֶת׃", "onk": "<b>וּבְאוּמָנוּת אֶבֶן טָבָא<\/b> לְאַשְׁלָמָא וּבְנַגָּרוּת אָעָא לְמֶעְבַּד בְּכָל עִבִידַת <b>אוּמַנְוָן<\/b>:", "onk_en": "And in masonary [<b>to cut precious stones<\/b>] for settings, and in carpentry, to execute all kinds of clever tasks [<b>of craftsmanship<\/b>].", "pj": "וּבְאַגְלָפוּת מַרְגְּלִיתָא טַבְתָא לְאַשְׁלָמוּת בְּהוֹן יַת עִיבִידְתָּא וּבְנַגָּרוּת קִיסָא לְמֶעֱבַד בְּכָל עִיבִידַת אוּמַנְוָון", "pj_en": "and in the cutting of precious stones, to perfect by them the work, and in the fabrication of wood, to work in all the work of artificers.", "tj": "וּבִגְלָפִית אַבְנַיָא טַבְתָּא דְאַשְׁלָמָא וְנַגְרוּת קִיסָא לְמֶעֱבַד בְּכָל עִיבִידָא דְאוֹמָנוֹי:", "tj_en": "And in the cutting of precious stones for completion, and the workmanship of wood, to work in all the work of the artificer.", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 34, "aliyah": 3, "heb": "וּלְהוֹרֹ֖ת נָתַ֣ן בְּלִבּ֑וֹ ה֕וּא וְאׇֽהֳלִיאָ֥ב בֶּן־אֲחִיסָמָ֖ךְ לְמַטֵּה־דָֽן׃", "onk": "וּלְאַלָּפָא יְהַב בְּלִבֵּיהּ הוּא וְאָהֳלִיאָב בַּר אֲחִיסָמָךְ לְשִׁבְטָא דְדָן:", "onk_en": "And the ability to instruct he instilled in his heart, he (Betzalel) and Oholiov, the son of Achisomoch of the tribe of Dan.", "pj": "וּלְמֵילַף אוּמַנְוָותָא לְמִשְׁאַר אוּמַנְיָא יְהַב מַנְדְּעָא בְּלִבֵּיהּ הוּא וְאָהֳלִיאָב בַּר אֲחִיסָמָךְ לְשִׁבְטָא דְדָן", "pj_en": "And to teach art-work to the rest of the artificers he imparted skill to his heart, and to (that of) Ahaliab bar Achisamak, of the tribe of Dan.", "tj": "", "tj_en": "", "rashi": "<b>ואהליאב.<\/b> מִשֵּׁבֶט דָּן מִן הַיְרוּדִין שֶׁבַּשְּׁבָטִים – מִבְּנֵי הַשְּׁפָחוֹת – וְהִשְׁוָהוּ הַמָּקוֹם לִבְצַלְאֵל לִמְלֶאכֶת הַמִּשְׁכָּן וְהוּא מִגְּדוֹלֵי הַשְּׁבָטִים, לְקַיֵּם מַה שֶּׁנֶּ' וְלֹא נִכַּר שׁוֹעַ לִפְנֵי דָל (איוב ל\"ד):", "rashi_en": "ואהליאב AND OHOLIAB — he was of the tribe of Dan, of one of the lowest of the tribes, of the sons of the handmaids, and yet the Omnipresent placed him with regard to the work of the Tabernacle on a level with Bezalel although he was a member of one of the noble tribes (Judah)! in order to confirm what Scripture says, (Job 34:19) “He regardeth not the rich more than the poor” (Midrash Tanchuma 2:10:13)."}, {"ch": 35, "v": 35, "aliyah": 3, "heb": "מִלֵּ֨א אֹתָ֜ם חׇכְמַת־לֵ֗ב לַעֲשׂוֹת֮ כׇּל־מְלֶ֣אכֶת חָרָ֣שׁ&thinsp;<small>׀<\/small>&thinsp;וְחֹשֵׁב֒ וְרֹקֵ֞ם בַּתְּכֵ֣לֶת וּבָֽאַרְגָּמָ֗ן בְּתוֹלַ֧עַת הַשָּׁנִ֛י וּבַשֵּׁ֖שׁ וְאֹרֵ֑ג עֹשֵׂי֙ כׇּל־מְלָאכָ֔ה וְחֹשְׁבֵ֖י מַחֲשָׁבֹֽת׃", "onk": "אַשְׁלֵם עִמְּהוֹן חַכִּימוּת לִבָּא לְמֶעְבַּד כָּל עִבִידַת <b>נַגָּר<\/b> וְאָמָּן וְצַיָּר בְּתִכְלָא וּבְאַרְגְּוָנָא <b>בִּצְבַע<\/b> זְהוֹרִי וּבְבוּצָא וּמַחֵי עָבְדֵי כָּל עִבִידָא <b>וּמַלְפֵי אוּמַנְוָן<\/b>:", "onk_en": "He filled them with wisdom of the heart, to execute all the tasks of the engraver [<b>carpenter<\/b>], the craftsman, and the embroiderer of greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, fine linen, and the [the tasks of] weaver, [also] that of laborers and planners [<b>those who teach craftsmanship<\/b>].", "pj": "אַשְׁלִים עִמְהוֹן חַכִּימוּת לִבָּא לְמֶעֱבַד כָּל עִיבִידַת נַגַר וְאוּמָן וְצַיַיר בְּתִיכְלָא וּבְאַרְגְּוָונָא וּבִצְבַע זְהוֹרֵי וּבְבוּצָא וְגַרְדֵי עַבְדֵי כָּל עִיבִידְתָּא וּמַלְפֵי אוּמַנְוָון", "pj_en": "He filled them with wisdom of heart to make all the work of the carpenter and the embroiderer, in hyacinth, and in purple, and in crimson, and in fine linen; and of the sewer, to fashion all the work, and to teach the workmen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 1, "aliyah": 3, "heb": "וְעָשָׂה֩ בְצַלְאֵ֨ל וְאׇהֳלִיאָ֜ב וְכֹ֣ל&thinsp;<b>׀<\/b> אִ֣ישׁ חֲכַם־לֵ֗ב אֲשֶׁר֩ נָתַ֨ן יְהֹוָ֜ה חׇכְמָ֤ה וּתְבוּנָה֙ בָּהֵ֔מָּה לָדַ֣עַת לַעֲשֹׂ֔ת אֶֽת־כׇּל־מְלֶ֖אכֶת עֲבֹדַ֣ת הַקֹּ֑דֶשׁ לְכֹ֥ל אֲשֶׁר־צִוָּ֖ה יְהֹוָֽה׃", "onk": "וַעֲבַד בְּצַלְאֵל וְאָהֳלִיאָב וְכָל גְּבַר חַכִּים לִבָּא דִּיהַב יְיָ חָכְמָא וְסוּכְלְתָנוּתָא בְּהוֹן לְמִדַּע לְמֶעְבַּד יָת כָּל עִבִידַת פָּלְחַן קוּדְשָׁא לְכֹל דִּי פַּקֵּד יְיָ:", "onk_en": "And they shall execute—Betzalel and Oholiov—and every wise-hearted man whom Adonoy had endowed with wisdom and insight to know (how) to execute in all of the holy work—all that Adonoy had commanded.", "pj": "וַעֲבַד בְּצַלְאֵל וְאָהֳלִיאָב וְכָל גְּבַר חַכִּים לִבָּא דִּיהַב יְיָ חוּכְמָתָא וְסוּכְלְתָנוּתָא בְּהוֹן לְמִידַע וּלְמֶעֱבַד יַת כָּל עִיבִידַת פּוּלְחַן קוּדְשָׁא לְכָל מַה דְּפַקֵּיד יְיָ", "pj_en": "And Bezalel and Ahaliab wrought, and every man wise in heart, to whom the Lord had given wisdom and intelligence to understand and to make all the work for the service of the sanctuary, according to all that the Lord had commanded.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 2, "aliyah": 3, "heb": "וַיִּקְרָ֣א מֹשֶׁ֗ה אֶל־בְּצַלְאֵל֮ וְאֶל־אׇֽהֳלִיאָב֒ וְאֶל֙ כׇּל־אִ֣ישׁ חֲכַם־לֵ֔ב אֲשֶׁ֨ר נָתַ֧ן יְהֹוָ֛ה חׇכְמָ֖ה בְּלִבּ֑וֹ כֹּ֚ל אֲשֶׁ֣ר נְשָׂא֣וֹ לִבּ֔וֹ לְקׇרְבָ֥ה אֶל־הַמְּלָאכָ֖ה לַעֲשֹׂ֥ת אֹתָֽהּ׃", "onk": "וּקְרָא משֶׁה לִבְצַלְאֵל וּלְאָהֳלִיאָב וּלְכָל גְּבַר חַכִּים לִבָּא דִּיהַב יְיָ חָכְמְתָא בְּלִבֵּיהּ כָּל דְּאִתְרְעֵי לִבֵּיהּ לְמִקְרַב לְעִבִדְתָּא לְמֶעְבַּד יָתֵיהּ:", "onk_en": "Moshe called to Betzalel and to Oholiov, and to every wise-hearted man whom Adonoy had endowed with wisdom in his heart, everyone whose heart moved him to approach the task—to execute it.", "pj": "וּקְרָא משֶׁה לִבְצַלְאֵל וּלְאָהֳלִיאָב וּלְכָל גְּבַר חַכִּים לִבָּא דִיהַב יְיָ חָכְמְתָא בְּלִבֵּיהּ כָּל מַאן דְּאִתְרְעֵי לִבֵּיהּ לְמִקְרַב לְעִיבִידְתָּא לְמֶעֱבַד יָתָהּ", "pj_en": "And Mosheh called Bezalel and Ahaliab, and every man wise in heart, to whose heart the Lord had given wisdom, every one whose heart was moved, to draw near, and do the work itself.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 3, "aliyah": 3, "heb": "וַיִּקְח֞וּ מִלִּפְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כׇּל־הַתְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִמְלֶ֛אכֶת עֲבֹדַ֥ת הַקֹּ֖דֶשׁ לַעֲשֹׂ֣ת אֹתָ֑הּ וְ֠הֵ֠ם הֵבִ֨יאוּ אֵלָ֥יו ע֛וֹד נְדָבָ֖ה בַּבֹּ֥קֶר בַּבֹּֽקֶר׃", "onk": "וּנְסִיבוּ מִן קֳדָם משֶׁה יָת כָּל אַפְרָשׁוּתָא דִּי אַיְתִיאוּ בְּנֵי יִשְׂרָאֵל לְעִבִידַת פָּלְחַן קוּדְשָׁא לְמֶעְבַּד יָתַהּ וְאִנּוּן מַיְתַן לֵיהּ עוֹד נְדַבְתָּא בִּצְפַר בִּצְפָר:", "onk_en": "And they took from before Moshe, all the terumah-offering which the B’nei Yisrael brought for the tasks of the holy work, to execute it. And they continued to bring gifts each and every morning.", "pj": "וּנְסִיבוּ מִן קֳדָם משֶׁה יַת כָּל אַפְרָשׁוּתָא דְאַיְיתִיוּ בְּנֵי יִשְרָאֵל לְעִיבִידַת פּוּלְחַן קוּדְשָׁא לְמֶעֱבַד יָתָהּ וְהִינוּן מַיְיתִין לֵיהּ תּוּב נְדַבְתָּא בִּצְפַר בִּצְפָר מִן מָמוֹנְהוֹן", "pj_en": "And they took from before Mosheh all the separation that the children of Israel had brought for the work of the service of the sanctuary, to make it. And they still brought to him the voluntary gift, morning after morning from their possessions.", "tj": "", "tj_en": "The gift.", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 4, "aliyah": 3, "heb": "וַיָּבֹ֙אוּ֙ כׇּל־הַ֣חֲכָמִ֔ים הָעֹשִׂ֕ים אֵ֖ת כׇּל־מְלֶ֣אכֶת הַקֹּ֑דֶשׁ אִֽישׁ־אִ֥ישׁ מִמְּלַאכְתּ֖וֹ אֲשֶׁר־הֵ֥מָּה עֹשִֽׂים׃", "onk": "וַאֲתוֹ כָּל חַכִּימַיָּא דְּעָבְדִין יָת כָּל עִבִידַת קוּדְשָׁא גְּבַר גְּבַר מֵעִבִדְתֵּיהּ דְּאִנּוּן עָבְדִין:", "onk_en": "All the wise men came—who were executing all the holy tasks—each and every man from the task in which he was engaged.", "pj": "וְאָתוּ כָּל חַכִּימַיָא דְעָבְדִין יַת כָּל עִיבִידַת קוּדְשָׁא גְּבַר גְּבַר מֵעִבִידְתֵּיהּ דְּהִינוּן עָבְדִין", "pj_en": "And all the wise men who did all the work of the sanctuary came, each man from the work which he had done;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 5, "aliyah": 3, "heb": "וַיֹּאמְרוּ֙ אֶל־מֹשֶׁ֣ה לֵּאמֹ֔ר מַרְבִּ֥ים הָעָ֖ם לְהָבִ֑יא מִדֵּ֤י הָֽעֲבֹדָה֙ לַמְּלָאכָ֔ה אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה לַעֲשֹׂ֥ת אֹתָֽהּ׃", "onk": "וַאֲמָרוּ לְמשֶׁה לְמֵימַר מַסְגַּן עַמָּא לְאַיְתָאָה מִסַּת פָּלְחָנָא לְעִבִדְתָּא דְּפַקֵּד יְיָ לְמֶעְבַּד יָתַהּ:", "onk_en": "They said the following to Moshe: the people are bringing too much—more than is needed for the tasks which Adonoy has commanded to execute.", "pj": "וַאֲמָרוּ לְמשֶׁה מַסְגְּיַין עַמָּא לְמַיְיתַיָא מִיסַת פּוּלְחָנָא לְעִיבִידְתָּא דְפַקֵּיד יְיָ לְמֶעֱבַד יָתָהּ", "pj_en": "and they said to Mosheh, The people abound in bringing (more) than is enough for the service of the work, which the Lord hath ordained.", "tj": "", "tj_en": "", "rashi": "<b>מדי העבדה.<\/b> יוֹתֵר מִכְּדֵי צֹרֶךְ הָעֲבוֹדָה:", "rashi_en": "מדי העבדה means more than is sufficient for the needs of the work."}, {"ch": 36, "v": 6, "aliyah": 3, "heb": "וַיְצַ֣ו מֹשֶׁ֗ה וַיַּעֲבִ֨ירוּ ק֥וֹל בַּֽמַּחֲנֶה֮ לֵאמֹר֒ אִ֣ישׁ וְאִשָּׁ֗ה אַל־יַעֲשׂוּ־ע֛וֹד מְלָאכָ֖ה לִתְרוּמַ֣ת הַקֹּ֑דֶשׁ וַיִּכָּלֵ֥א הָעָ֖ם מֵהָבִֽיא׃", "onk": "וּפַקֵּד משֶׁה וְאַעֲבַרוּ כָרוֹזָא בְמַשְׁרִיתָא לְמֵימַר גְּבַר וְאִתְּתָא לָא יַעַבְדוּן עוֹד עִבִדְתָּא לְאַפְרָשׁוּת קוּדְשָׁא וּפְסַק עַמָּא מִלְּאַיְתָאָה:", "onk_en": "Moshe commanded—and they proclaimed throughout the encampment saying, “Let no man or woman bring any more material for the sacred offering.” And the people stopped bringing.", "pj": "וּפַקֵּיד משֶׁה וְאַעֲבָרוּ כְרוֹזָא בְּמַשְׁרִיתָא לְמֵימָר גְּבַר וְאִתְּתָא לָא יַעַבְדוּן תּוּב עִיבִידְתָּא לְאַפְרָשׁוּת קוּדְשָׁא וּפְסַק עַמָּא מִלְאַיְתָאָה", "pj_en": "And Mosheh commanded, and they made proclamation through the camp, saying, Neither man nor woman may make any more work for the holy separation: and the people ceased from bringing.", "tj": "", "tj_en": "", "rashi": "<b>ויכלא.<\/b> לְשׁוֹן מְנִיעָה:", "rashi_en": "ויכלא is an expression for withholding."}, {"ch": 36, "v": 7, "aliyah": 3, "heb": "וְהַמְּלָאכָ֗ה הָיְתָ֥ה דַיָּ֛ם לְכׇל־הַמְּלָאכָ֖ה לַעֲשׂ֣וֹת אֹתָ֑הּ וְהוֹתֵֽר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעִבִדְתָּא הֲוַת מִסַּת לְכָל עִבִדְתָּא לְמֶעְבַּד יָתַהּ וִיתָרָת:", "onk_en": "The material was enough for all the work that had to be done, and some was left over.", "pj": "וְעִיבִידְתָּא הֲוַת כְּמֵיסַת לְכָל עִבִידְתָּא וַעֲבָדוּ יָתָהּ וּבְרַם שַׁיְירוּ", "pj_en": "For what had been done was according to the sufficiency of all the work; and they did it, and had more than enough.", "tj": "", "tj_en": "", "rashi": "<b>והמלאכה היתה דים לכל המלאכה.<\/b> וּמְלֶאכֶת הַהֲבָאָה הָיְתָה דַיָּם שֶׁל עוֹשֵׂי הַמִּשְׁכָּן, לְכָל הַמְּלָאכָה שֶׁל מִשְׁכָּן, לַעֲשׂוֹת אוֹתָהּ וּלְהוֹתֵר:<br><br><b>והותר.<\/b> כְּמוֹ וְהַכְבֵּד אֶת לִבּוֹ (שמות ח'), וְהַכּוֹת אֶת מוֹאָב (מלכים ב ג'):", "rashi_en": "והמלאכה היתה דים (lit., and the work was their sufficiency — was enough for them — for all the work) — this means the work of contributing was the sufficiency of (was enough for) the workers at the Tabernacle, for all the work connected with the Tabernacle to make it and even to leave some over.<br><br>והותר is an infinitive similar to, (Exodus 8:11) “[But when Pharaoh saw that there was respite] he allowed his heart to be hardened (והכבד‎)”; (2 Kings 3:24) “and they smote (והכות) Moab” (infinitives used in perfect sense)."}, {"ch": 36, "v": 8, "aliyah": 4, "heb": "וַיַּעֲשׂ֨וּ כׇל־חֲכַם־לֵ֜ב בְּעֹשֵׂ֧י הַמְּלָאכָ֛ה אֶת־הַמִּשְׁכָּ֖ן עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מׇשְׁזָ֗ר וּתְכֵ֤לֶת וְאַרְגָּמָן֙ וְתוֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב עָשָׂ֥ה אֹתָֽם׃", "onk": "וַעֲבָדוּ כָל חַכִּימֵי לִבָּא בְּעָבְדֵי עִבִדְתָּא יָת מַשְׁכְּנָא עֲשַׂר יְרִיעָן דְּבוּץ שְׁזִיר וְתִכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי צוּרַת כְּרוּבִין עוֹבַד אָמָּן עֲבַד יָתְהוֹן:", "onk_en": "All craftsmen with the spirit of wisdom made the mishkon out of ten drapes, (consisting of) twined fine linen, greenish blue wool, dark red wool and crimson [<b>colored<\/b>] wool, figures of Cherubim, the work of a craftsman.", "pj": "וַעֲבָדוּ כָּל חַכִּימֵי לִבָּא יַת מַשְׁכְּנָא עֲשַר יְרִיעַן דְּבוּץ שְׁזִיר וְתִכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרִי צוּרַת כְּרוּבִין עוֹבַד אוּמַן עֲבַד יַתְהוֹן", "pj_en": "And all the wise in heart made the TABERNACLE; ten curtains of fine linen, and hyacinth, and purple, and scarlet, figured with kerubin, the work of the embroiderer, he made them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 9, "aliyah": 4, "heb": "אֹ֜רֶךְ הַיְרִיעָ֣ה הָֽאַחַ֗ת שְׁמֹנֶ֤ה וְעֶשְׂרִים֙ בָּֽאַמָּ֔ה וְרֹ֙חַב֙ אַרְבַּ֣ע בָּֽאַמָּ֔ה הַיְרִיעָ֖ה הָאֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְכׇל־הַיְרִיעֹֽת׃", "onk": "אֻרְכָּא דִּירִיעֲתָא חֲדָא עַסְרִין וּתְמַנְיָא אַמִּין וּפוּתְיָא אַרְבַּע אַמִּין דִּירִיעֲתָא חֲדָא מְשַׁחְתָא חֲדָא לְכָל יְרִיעָתָא:", "onk_en": "The length of each drape was twenty eight amohs, and each drape was four amohs wide. All drapes had the same measure.", "pj": "אוּרְכָּא דִירִיעֲתָא חֲדָא עַשְרִין וְתַמְנֵי אַמִּין וּפוּתְיָא אַרְבַּע אַמִּין סְכוּם דִּירִיעֲתָא חֲדָא מְשַׁחְתָּא חֲדָא לְכָל יְרִיעָתָא", "pj_en": "The length of one curtain twenty and eight cubits, the sum of one curtain; the measure was one for all the curtains.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 10, "aliyah": 4, "heb": "וַיְחַבֵּר֙ אֶת־חֲמֵ֣שׁ הַיְרִיעֹ֔ת אַחַ֖ת אֶל־אֶחָ֑ת וְחָמֵ֤שׁ יְרִיעֹת֙ חִבַּ֔ר אַחַ֖ת אֶל־אֶחָֽת׃", "onk": "וְלָפֵף יָת חָמֵשׁ יְרִיעָן חֲדָא עִם חֲדָא וְחָמֵשׁ יְרִיעָן לָפֵף חֲדָא עִם חֲדָא:", "onk_en": "He joined (sewed) five of these drapes together, and the other five drapes he joined (sewed) together.", "pj": "וְלָפֵיף יַת חָמֵשׁ יְרִיעַן חֲדָא עִם חֲדָא וְחָמֵשׁ יְרִיעַן לָפֵיף חֲדָא עִם חֲדָא", "pj_en": "And he conjoined five curtains one with another, and (the other) five curtains conjoined he one with another.", "tj": "", "tj_en": "In the jointure.", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 11, "aliyah": 4, "heb": "וַיַּ֜עַשׂ לֻֽלְאֹ֣ת תְּכֵ֗לֶת עַ֣ל שְׂפַ֤ת הַיְרִיעָה֙ הָֽאֶחָ֔ת מִקָּצָ֖ה בַּמַּחְבָּ֑רֶת כֵּ֤ן עָשָׂה֙ בִּשְׂפַ֣ת הַיְרִיעָ֔ה הַקִּ֣יצוֹנָ֔ה בַּמַּחְבֶּ֖רֶת הַשֵּׁנִֽית׃", "onk": "וַעֲבַד עֲנוּבִין דְּתִכְלָא עַל סִפְתָא דִירִיעֲתָא חֲדָא מִסִּטְרָא בֵּית לוֹפֵי כֵּן עֲבַד בְּסִפְתָא דִּירִיעֲתָא בְּסִטְרָא בֵּית לוֹפֵי תִּנְיֵתָא:", "onk_en": "He made loops of greenish blue wool on the edge of the drape which was at the (innermost) end of the (first) group. He did the same on the edge of the drape which was the innermost end of the second group.", "pj": "וְעָבַד עֲנוּבִין דְּתִכְלָא עַל שִפְתָא דִירִיעֲתָא חֲדָא מִסִּטְרָא בֵּית לוֹפֵי כֵּן עָבַד בְּשִפְתָא דִירִיעֲתָא בֵּית לוֹפֵי תִּנְיָינָא", "pj_en": "And he made loops of hyacinth upon the edge of one curtain, at the place of conjunction in the side; so made he in the side at the place of conjunction in the other curtain.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 12, "aliyah": 4, "heb": "חֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֮ בַּיְרִיעָ֣ה הָאֶחָת֒ וַחֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ בִּקְצֵ֣ה הַיְרִיעָ֔ה אֲשֶׁ֖ר בַּמַּחְבֶּ֣רֶת הַשֵּׁנִ֑ית מַקְבִּילֹת֙ הַלֻּ֣לָאֹ֔ת אַחַ֖ת אֶל־אֶחָֽת׃", "onk": "חַמְשִׁין עֲנוּבִין עֲבַד בִּירִיעֲתָא חֲדָא וְחַמְשִׁין עֲנוּבִין עֲבַד בְּסִטְרָא דִירִיעֲתָא דְבֵית לוֹפֵי תִּנְיֵתָא מְכַוְּנָן עֲנוּבַיָּא חֲדָא לָקֳבֵל חֲדָא:", "onk_en": "He made fifty loops on (the edge of) one drape and he made fifty loops on the edge of the drape which was on the second group. The loops were opposite one another.", "pj": "חַמְשִׁין עֲנוּבִין עָבַד בִּירִיעֲתָא חֲדָא וְחַמְשִׁין עֲנוּבִין עָבַד בְּסִטְרָא דִירִיעֲתָא דְבֵית לוֹפֵי תִנְיָינָא מְכַוְונַן עֲנוּבַיָא חֲדָא לְקָבֵל חֲדָא", "pj_en": "Fifty loops he made in one curtain, and fifty loops made he at the place of juncture of the edge of the second curtain; the loops were arranged one over against the other.", "tj": "", "tj_en": "Answering to each other.", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 13, "aliyah": 4, "heb": "וַיַּ֕עַשׂ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וַיְחַבֵּ֨ר אֶת־הַיְרִיעֹ֜ת אַחַ֤ת אֶל־אַחַת֙ בַּקְּרָסִ֔ים וַיְהִ֥י הַמִּשְׁכָּ֖ן אֶחָֽד׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲבַד חַמְשִׁין פּוּרְפִין דִּדְהָב וְלָפֵף יָת יְרִיעֲתָא חֲדָא עִם חֲדָא בְּפוּרְפַיָּא וַהֲוָה מַשְׁכְּנָא חָד:", "onk_en": "He made fifty golden clasps and he joined the drapes (of each group) together with the clasps. The mishkon was thus one unit.", "pj": "וְעָבַד חַמְשִׁין פּוּרְפִין דִּדְהַב וְלָפֵיף יַת יְרִיעֲתָא חֲדָא עִם חֲדָא בְּפוּרְפַּיָא וַהֲוָה מַשְׁכְּנָא חָד", "pj_en": "And he made fifty taches of gold, and conjoined one curtain with another with the taches, and there was one tabernacle.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 14, "aliyah": 4, "heb": "וַיַּ֙עַשׂ֙ יְרִיעֹ֣ת עִזִּ֔ים לְאֹ֖הֶל עַל־הַמִּשְׁכָּ֑ן עַשְׁתֵּֽי־עֶשְׂרֵ֥ה יְרִיעֹ֖ת עָשָׂ֥ה אֹתָֽם׃", "onk": "וַעֲבַד יְרִיעָן דִּמְעַזֵּי לִפְרָסָא עַל מַשְׁכְּנָא חַד עֲשַׂר יְרִיעָן עֲבַד יָתְהֶן:", "onk_en": "He made drapes of goats’ hair for a covering over the mishkon. He made eleven such drapes.", "pj": "וַעֲבַד יְרִיעַן דְּמֵעַזֵּי לִפְרָסָא עַל מַשְׁכְּנָא חַד סְרֵי יְרִיעַן עֲבַד יַתְהוֹן", "pj_en": "And he made curtains of goats' hair to spread upon the tabernacle: eleven curtains he made them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 15, "aliyah": 4, "heb": "אֹ֜רֶךְ הַיְרִיעָ֣ה הָאַחַ֗ת שְׁלֹשִׁים֙ בָּֽאַמָּ֔ה וְאַרְבַּ֣ע אַמּ֔וֹת רֹ֖חַב הַיְרִיעָ֣ה הָאֶחָ֑ת מִדָּ֣ה אַחַ֔ת לְעַשְׁתֵּ֥י עֶשְׂרֵ֖ה יְרִיעֹֽת׃", "onk": "אֻרְכָּא דִּירִיעֲתָא חֲדָא תְּלָתִין בְּאַמִּין וְאַרְבַּע אַמִּין פּוּתְיָא דִּירִיעֲתָא חֲדָא מְשַׁחְתָּא חֲדָא לְחַד עֲשַׂר יְרִיעָן:", "onk_en": "The length of each drape was thirty amohs, and the width of each drape was four amohs. The eleven drapes were of the same measure.", "pj": "אוּרְכָּא דִירִיעֲתָא חֲדָא תְּלָתִין אַמִּין וְאַרְבַּע אַמִּין פּוּתְיָא דִירִיעֲתָא חֲדָא מְשַׁחְתָּא חֲדָא לְחַד סְרֵי יְרִיעַן", "pj_en": "The length of one curtain thirty cubits, and four cubits the breadth of one curtain; one measure for the eleven curtains.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 16, "aliyah": 4, "heb": "וַיְחַבֵּ֛ר אֶת־חֲמֵ֥שׁ הַיְרִיעֹ֖ת לְבָ֑ד וְאֶת־שֵׁ֥שׁ הַיְרִיעֹ֖ת לְבָֽד׃", "onk": "וְלָפֵף יָת חֲמֵשׁ יְרִיעָן לְחוֹד וְיָת שֵׁת יְרִיעָן לְחוֹד:", "onk_en": "And he joined together five drapes by themselves, and six drapes by themselves.", "pj": "וְלָפֵיף יַת חֲמֵשׁ יְרִיעַן לְחוֹד כָּל קְבֵיל חַמְשָׁא סִפְרֵי אוֹרַיְיתָא וְיַת שִׁית יְרִיעַן לְחוֹד כָּל קְבֵיל שִׁתָּא סִדְרֵי מַתְנְיָיתָא", "pj_en": "And he joined five curtains together, corresponding with the five books of the law; and six curtains together, corresponding with the six orders of the Mishna.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 17, "aliyah": 4, "heb": "וַיַּ֜עַשׂ לֻֽלָאֹ֣ת חֲמִשִּׁ֗ים עַ֚ל שְׂפַ֣ת הַיְרִיעָ֔ה הַקִּיצֹנָ֖ה בַּמַּחְבָּ֑רֶת וַחֲמִשִּׁ֣ים לֻלָאֹ֗ת עָשָׂה֙ עַל־שְׂפַ֣ת הַיְרִיעָ֔ה הַחֹבֶ֖רֶת הַשֵּׁנִֽית׃", "onk": "וַעֲבַד עֲנוּבִין חַמְשִׁין עַל סִפְתָא דִירִיעֲתָא בְּסִטְרָא בֵּית לוֹפֵי וְחַמְשִׁין עֲנוּבִין עֲבַד עַל סִפְתָא דִירִיעֲתָא דְבֵית לוֹפֵי תִּנְיֵתָא:", "onk_en": "He made fifty loops on the edge of one drape which was the innermost end of the (first) group and he made fifty loops on the edge of the drape which was on the second group.", "pj": "וַעֲבַד עֲנוּבִין חַמְשִׁין עַל שִפְתָא דִירִיעֲתָא בְּצִטְרָא בֵּית לוֹפֵי וְחַמְשִׁין עֲנוּבִין עֲבַד עַל שִפְתָא דִירִיעֲתָא דְּבֵית לוֹפֵי תִּנְיָינָא", "pj_en": "And he made fifty loops in the border of the curtain at the place of conjuncture, and fifty loops made he upon the border of the curtain at the second place of conjuncture.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 18, "aliyah": 4, "heb": "וַיַּ֛עַשׂ קַרְסֵ֥י נְחֹ֖שֶׁת חֲמִשִּׁ֑ים לְחַבֵּ֥ר אֶת־הָאֹ֖הֶל לִהְיֹ֥ת אֶחָֽד׃", "onk": "וַעֲבַד פּוּרְפִין דִּנְחָשָׁא חַמְשִׁין לְלַפָּפָא יָת מַשְׁכְּנָא לְמֵהֱוֵי חָד:", "onk_en": "He made fifty copper clasps to join the tent together making it one.", "pj": "וַעֲבַד פּוּרְפִּין דִּנְחָשָׁא לְלַפְּפָא יַת מַשְׁכְּנָא לְמֶהֱוֵי חָד", "pj_en": "And he made taches of brass to compact the tabernacle, that it might become one.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 19, "aliyah": 4, "heb": "וַיַּ֤עַשׂ מִכְסֶה֙ לָאֹ֔הֶל עֹרֹ֥ת אֵילִ֖ם מְאׇדָּמִ֑ים וּמִכְסֵ֛ה עֹרֹ֥ת תְּחָשִׁ֖ים מִלְמָֽעְלָה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַעֲבַד חוֹפָאָה לְמַשְׁכְּנָא מַשְׁכֵי דְדִכְרֵי מְסַמְּקֵי וְחוֹפָאָה מַשְׁכֵי <b>דְסַסְגּוֹנָא<\/b> מִלְּעֵלָּא:", "onk_en": "He made a covering for the tent out of red dyed rams’ skins, and a covering of tachash [<b>multicolored<\/b>] skins above that.", "pj": "וַעֲבַד חוֹפָאָה לְמַשְׁכְּנָא מַשְׁכֵי דְדִכְרֵי מְסַמְקֵי וּמַשְׁכֵי דְסַסְגוֹנָא לְטַלְלָא מִלְעֵילָא", "pj_en": "And he made a covering for the tabernacle of rams' skins reddened, and of purple skins to protect it above.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 20, "aliyah": 5, "heb": "וַיַּ֥עַשׂ אֶת־הַקְּרָשִׁ֖ים לַמִּשְׁכָּ֑ן עֲצֵ֥י שִׁטִּ֖ים עֹמְדִֽים׃", "onk": "וַעֲבַד יָת דַּפַּיָּא לְמַשְׁכְּנָא דְּאָעֵי שִׁטִּין קָיְמִין:", "onk_en": "He made planks for the mishkon out of acacia wood; (these planks) stood upright (vertically).", "pj": "וַעֲבַד יַת לוּחַיָא לְמַשְׁכְּנָא מִן קִיסֵי שִׁיטָא קַיְימִין הֵי כְאוֹרַח נְצִיבְהוֹן", "pj_en": "And he made the boards of the tabernacle of sitta wood, standing up, after the way of their plantation;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 21, "aliyah": 5, "heb": "עֶ֥שֶׂר אַמֹּ֖ת אֹ֣רֶךְ הַקָּ֑רֶשׁ וְאַמָּה֙ וַחֲצִ֣י הָֽאַמָּ֔ה רֹ֖חַב הַקֶּ֥רֶשׁ הָאֶחָֽד׃", "onk": "עֲשַׂר אַמִּין אֻרְכָּא דְדַפָּא וְאַמְּתָא וּפַלְגּוּת אַמְּתָא פּוּתְיָא דְּדַפָּא חָד:", "onk_en": "Each plank was ten amohs long, and one and one half amohs was the width of each plank.", "pj": "עֲשַר אַמִּין אוּרְכָּא דְלוּחָא וְאַמְתָא וּפַלְגָא דְאַמְתָא פּוּתְיָא דְלוּחָא חָד", "pj_en": "ten cubits the length of the board, and a cubit and a half of a cubit the breadth of one board.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 22, "aliyah": 5, "heb": "שְׁתֵּ֣י יָדֹ֗ת לַקֶּ֙רֶשׁ֙ הָֽאֶחָ֔ד מְשֻׁ֨לָּבֹ֔ת אַחַ֖ת אֶל־אֶחָ֑ת כֵּ֣ן עָשָׂ֔ה לְכֹ֖ל קַרְשֵׁ֥י הַמִּשְׁכָּֽן׃", "onk": "תַּרְתֵּין צִירִין לְדַפָּא חַד מְשַׁלְּבִין חֲדָא לָקֳבֵל חֲדָא כֵּן עֲבַד לְכֹל דַּפֵּי מַשְׁכְּנָא:", "onk_en": "Each plank had two (square) pegs, exactly parallel to each other. In this manner he made all the planks of the mishkon.", "pj": "תְּרֵין צִירִין לְלוּחָא חָד מְכַוְונָן סְטַר חַד בְּגוֹ סְטַר חַד הֵיכְדֵין עָבַד לְכָל לוּחֵי מַשְׁכְּנָא", "pj_en": "Each board had two tenons arranged, one side for the midst of the other side; and so did he for all the boards of the tabernacle.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 23, "aliyah": 5, "heb": "וַיַּ֥עַשׂ אֶת־הַקְּרָשִׁ֖ים לַמִּשְׁכָּ֑ן עֶשְׂרִ֣ים קְרָשִׁ֔ים לִפְאַ֖ת נֶ֥גֶב תֵּימָֽנָה׃", "onk": "וַעֲבַד יָת דַּפַּיָּא לְמַשְׁכְּנָא עֶסְרִין דַּפִּין לְרוּחַ עֵבַר דָּרוֹמָא:", "onk_en": "He made these planks for the mishkon, twenty planks for the southern side.", "pj": "וַעֲבַד יַת לוּחַיָא לְמַשְׁכְּנָא עֶשְרִין לוּחִין לְרוּחַ עִיבַר דְּרוֹמָא", "pj_en": "And he made the boards of the tabernacle twenty boards, on the side of the south wind;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 24, "aliyah": 5, "heb": "וְאַרְבָּעִים֙ אַדְנֵי־כֶ֔סֶף עָשָׂ֕ה תַּ֖חַת עֶשְׂרִ֣ים הַקְּרָשִׁ֑ים שְׁנֵ֨י אֲדָנִ֜ים תַּֽחַת־הַקֶּ֤רֶשׁ הָאֶחָד֙ לִשְׁתֵּ֣י יְדֹתָ֔יו וּשְׁנֵ֧י אֲדָנִ֛ים תַּֽחַת־הַקֶּ֥רֶשׁ הָאֶחָ֖ד לִשְׁתֵּ֥י יְדֹתָֽיו׃", "onk": "וְאַרְבְּעִין סַמְכִין דִּכְסַף עֲבַד תְּחוֹת עֶסְרִין דַּפִּין תְּרֵין סַמְכִין תְּחוֹת דַפָּא חַד לִתְרֵין צִירוֹהִי וּתְרֵין סַמְכִין תְּחוֹת דַּפָּא חַד לִתְרֵין צִירוֹהִי:", "onk_en": "He made forty silver sockets, (and placed them) under the twenty planks. There were two sockets under one plank (one) for each of the two pegs, and two sockets under the other plank, (one) for each of the two pegs.", "pj": "וְאַרְבְּעִין חוֹמְרִין דִּכְסַף עֲבַד תְּחוֹת עֶשְרִין לוּחַיָא תְּרֵין חוֹמְרִין תְּחוֹת לוּחָא חָד לִתְרֵין צִירוֹי וּתְרֵין חוֹמְרִין תְּחוֹת לוּחָא חָד לִתְרֵין צִירוֹי", "pj_en": "and forty sockets of silver he made under the twenty boards; two sockets beneath one board for its two tenons, and two sockets under another board for its two tenons.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 25, "aliyah": 5, "heb": "וּלְצֶ֧לַע הַמִּשְׁכָּ֛ן הַשֵּׁנִ֖ית לִפְאַ֣ת צָפ֑וֹן עָשָׂ֖ה עֶשְׂרִ֥ים קְרָשִֽׁים׃", "onk": "וְלִסְטַר מַשְׁכְּנָא תִּנְיֵתָא לְרוּחַ צִפּוּנָא עֲבַד עֶסְרִין דַּפִּין:", "onk_en": "For the second wall of the mishkon, to the northern side, he made twenty planks.", "pj": "וְלִסְטַר מַשְׁכְּנָא תִּנְיָינָא לְרוּחַ צִפּוּנָא עָבַד עֶשְרִין לוּחִין", "pj_en": "And for the second side of the tabernacle on the north he made twenty boards,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 26, "aliyah": 5, "heb": "וְאַרְבָּעִ֥ים אַדְנֵיהֶ֖ם כָּ֑סֶף שְׁנֵ֣י אֲדָנִ֗ים תַּ֚חַת הַקֶּ֣רֶשׁ הָאֶחָ֔ד וּשְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַקֶּ֥רֶשׁ הָאֶחָֽד׃", "onk": "וְאַרְבְּעִין סַמְכֵיהוֹן דִּכְסָף תְּרֵין סַמְכִין תְּחוֹת דַּפָּא חַד וּתְרֵין סַמְכִין תְּחוֹת דַּפָּא חָד:", "onk_en": "(He made) their forty silver sockets, two sockets under each plank, two sockets under each plank.", "pj": "וְאַרְבְּעִין חוֹמְרֵיהוֹן דִּכְסַף תְּרֵין חוֹמְרִין תְּחוֹת לוּחָא חָד וּתְרֵין חוֹמְרִין תְּחוֹת לוּחָא חָד", "pj_en": "and their forty sockets of silver; two sockets beneath one board, and two sockets beneath another board.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 27, "aliyah": 5, "heb": "וּֽלְיַרְכְּתֵ֥י הַמִּשְׁכָּ֖ן יָ֑מָּה עָשָׂ֖ה שִׁשָּׁ֥ה קְרָשִֽׁים׃", "onk": "וְלִסְיָפֵי מַשְׁכְּנָא מַעַרְבָא עֲבַד שִׁתָּא דַפִּין:", "onk_en": "For the western end of the mishkon he made six planks.", "pj": "וְלִסְיָיפֵי מַשְׁכְּנָא מַעַרְבָא עָבַד שִׁתָּא לוּחִין", "pj_en": "And to the border of the tabernacle westward he made six boards,", "tj": "", "tj_en": "At the declivities.", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 28, "aliyah": 5, "heb": "וּשְׁנֵ֤י קְרָשִׁים֙ עָשָׂ֔ה לִמְקֻצְעֹ֖ת הַמִּשְׁכָּ֑ן בַּיַּרְכָתָֽיִם׃", "onk": "וּתְרֵין דַּפִּין עֲבַד לְזָוְיַת מַשְׁכְּנָא <b>בְּסוֹפֵיהוֹן<\/b>:", "onk_en": "He made two planks for the corners of the mishkon at the rear side [<b>their ends<\/b>].", "pj": "וּתְרֵין לוּחִין עָבַד לְזַוְויַת מַשְׁכְּנָא בְּסוֹפֵיהוֹן", "pj_en": "and two boards made he at the corners of the tabernacle at their extremes.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 29, "aliyah": 5, "heb": "וְהָי֣וּ תוֹאֲמִם֮ מִלְּמַ֒טָּה֒ וְיַחְדָּ֗ו יִהְי֤וּ תַמִּים֙ אֶל־רֹאשׁ֔וֹ אֶל־הַטַּבַּ֖עַת הָאֶחָ֑ת כֵּ֚ן עָשָׂ֣ה לִשְׁנֵיהֶ֔ם לִשְׁנֵ֖י הַמִּקְצֹעֹֽת׃", "onk": "וַהֲווֹ מְכַוְּנִין מִלְּרַע וְכַחֲדָא הֲווֹ מְכַוְּנִין עַל רֵישֵׁיהּ לְעִזְקָתָא חֲדָא כֵּן עֲבַד לְתַרְוֵיהוֹן לִתְרֵין זָוְיָן:", "onk_en": "They were coupled together on the bottom, and they were coupled together evenly on the top with one (square) ring. In this manner he made the two (planks) which were at the two corners.", "pj": "וַהֲווֹן מְזַוְוגִין מִלְרַע וְכַחֲדָא הֲווֹן מְזַוְוגִין בְּרֵישֵׁיהוֹן בְּעִזְקָתָא חֲדָא הֵיכְדֵין עָבַד לִתְרֵיהוֹן לְתַרְתֵּין זִוְויַין", "pj_en": "And they were conjoined below, and joined together were they at their tops with one ring; so made he both of them at the two corners.", "tj": "", "tj_en": "And they were twins.", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 30, "aliyah": 5, "heb": "וְהָיוּ֙ שְׁמֹנָ֣ה קְרָשִׁ֔ים וְאַדְנֵיהֶ֣ם כֶּ֔סֶף שִׁשָּׁ֥ה עָשָׂ֖ר אֲדָנִ֑ים שְׁנֵ֤י אֲדָנִים֙ שְׁנֵ֣י אֲדָנִ֔ים תַּ֖חַת הַקֶּ֥רֶשׁ הָאֶחָֽד׃", "onk": "וַהֲווֹ תְּמַנְיָא דַפִּין וְסַמְכֵיהוֹן דִּכְסַף שִׁתָּא עֲשַׂר סַמְכִין תְּרֵין סַמְכִין תְּרֵין סַמְכִין תְּחוֹת דַּפָּא חָד:", "onk_en": "There were eight planks, and their silver sockets, totaling sixteen sockets, two sockets, two sockets under each plank.", "pj": "וַהֲווֹן תְּמַנְיָא לוּחִין וְחוֹמְרֵיהוֹן דִּכְסַף שִׁיתְּסַר חוֹמְרִין תְּרֵין חוֹמְרִין תְּרֵין חוֹמְרִין תְּחוֹת לוּחָא חָד", "pj_en": "And eight boards there were, and their sockets of silver, sixteen sockets; two sockets, and two sockets under one board.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 31, "aliyah": 5, "heb": "וַיַּ֥עַשׂ בְּרִיחֵ֖י עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְקַרְשֵׁ֥י צֶֽלַע־הַמִּשְׁכָּ֖ן הָאֶחָֽת׃", "onk": "וַעֲבַד עַבְּרֵי דְּאָעֵי שִׁטִּין חַמְשָׁא לְדַפֵּי סְטַר מַשְׁכְּנָא חָד:", "onk_en": "He made bars out of acacia wood, five for the planks of one wall,", "pj": "וַעֲבַד נַגְרִין דְּקִיסֵי שִׁיטָא חַמְשָׁא לְלוּחֵי סְטַר מַשְׁכְּנָא חָד", "pj_en": "made bars of sitta wood; five for the boards of one side of the tabernacle,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 32, "aliyah": 5, "heb": "וַחֲמִשָּׁ֣ה בְרִיחִ֔ם לְקַרְשֵׁ֥י צֶֽלַע־הַמִּשְׁכָּ֖ן הַשֵּׁנִ֑ית וַחֲמִשָּׁ֤ה בְרִיחִם֙ לְקַרְשֵׁ֣י הַמִּשְׁכָּ֔ן לַיַּרְכָתַ֖יִם יָֽמָּה׃", "onk": "וְחַמְשָׁא עַבְּרִין לְדַפֵּי סְטַר מַשְׁכְּנָא תִּנְיֵתָא וְחַמְשָׁא עַבְּרִין לְדַפֵּי מַשְׁכְּנָא לְסוֹפֵיהוֹן מַעַרְבָא:", "onk_en": "and five bars for the planks of the second wall of the mishkon, and five bars for the planks of the western (back) wall of the mishkon.", "pj": "וְחַמְשָׁא נַגְרִין לְלוּחֵי סְטַר מַשְׁכְּנָא תִּנְיָינָא וְחַמְשָׁא נַגְרִין לְלוּחֵי סְטַר מַשְׁכְּנָא לְסוֹפֵיהוֹן מַעַרְבָא", "pj_en": "and five bars for the boards of the second side of the tabernacle, and five bars for the boards of the tabernacle at the ends westward.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 33, "aliyah": 5, "heb": "וַיַּ֖עַשׂ אֶת־הַבְּרִ֣יחַ הַתִּיכֹ֑ן לִבְרֹ֙חַ֙ בְּת֣וֹךְ הַקְּרָשִׁ֔ים מִן־הַקָּצֶ֖ה אֶל־הַקָּצֶֽה׃", "onk": "וַעֲבַד יָת עַבְּרָא מְצִיעָאָה לְאַעְבָּרָא בְּגוֹ דַפַּיָּא מִן סְיָפֵי לִסְיָפֵי:", "onk_en": "He made the middle (center) bar to go through the planks, [reinforcing the planks] from one end to the other.", "pj": "וַעֲבַד יַת נַגְרָא מְצִיעָאָה לְשַׁלְבְּשָׁא בְּגוֹ לוּחַיָיא מִן סְיָיפֵי לִסְיָיפֵי מִן אִילָנָא דִנְצִיב אַבְרָהָם אָבוּנָן בְּבֵירָא דְשָׁבַע וְצַלִי תַּמָּן בְּשׁוּם מֵימְרָא דַיְיָ אֱלָהָא עַלְמָא", "pj_en": "made the middle bar to mortise in the midst of the boards from end to end,-of the tree which our father Abraham planted in Beira of Sheba, praying there in the Name of the Word of the Lord, the everlasting, God.", "tj": "וַעֲבַד יַת נַגְרַיָא מְצִיעַיָא לְבַרְדוֹק בֵּינֵי לוּחַיָא:", "tj_en": "And he, made the middle board to go along among the boards.", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 34, "aliyah": 5, "heb": "וְֽאֶת־הַקְּרָשִׁ֞ים צִפָּ֣ה זָהָ֗ב וְאֶת־טַבְּעֹתָם֙ עָשָׂ֣ה זָהָ֔ב בָּתִּ֖ים לַבְּרִיחִ֑ם וַיְצַ֥ף אֶת־הַבְּרִיחִ֖ם זָהָֽב׃", "onk": "וְיָת דַּפַּיָּא חֲפָא דַהֲבָא וְיָת עִזְקָתְהוֹן עֲבַד דַּהֲבָא אַתְרָא לְעַבְּרַיָּא וַחֲפָא יָת עַבְּרַיָּא דַּהֲבָא:", "onk_en": "He overlaid the planks with gold, and made their rings out of gold to hold the bars. He (also) overlaid the bars with gold.", "pj": "וְיַת לוּחַיָא חָפָא דַהֲבָא וְיַת עִזְקַתְהוֹן עָבַד דַּהֲבָא אַתְרָא לְנַגְרִין וַחֲפָא יַת נַגְרִין דַּהֲבָא", "pj_en": "And the boards he overlaid with gold, and the rings be made of gold, as the place for the bars; and he covered the bars with gold.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 35, "aliyah": 5, "heb": "וַיַּ֙עַשׂ֙ אֶת־הַפָּרֹ֔כֶת תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֣שׁ מׇשְׁזָ֑ר מַעֲשֵׂ֥ה חֹשֵׁ֛ב עָשָׂ֥ה אֹתָ֖הּ כְּרֻבִֽים׃", "onk": "וַעֲבַד יָת פָּרֻכְתָּא תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר עוֹבַד אָמָּן עֲבַד יָתַהּ צוּרַת כְּרוּבִין:", "onk_en": "He made the paroches (partition) out of greenish blue wool, dark red wool, crimson [<b>colored<\/b>] wool, and fine, twined linen, the work of a craftsman, with figures of Cherubim (woven into it).", "pj": "וַעֲבַד יַת פַּרְגּוֹדָא דְתִיכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרִי וּבוּץ שְׁזִיר עוֹבַד אוּמַן עָבָד יָתָהּ כְּרוּבִין צִיּוּרִין", "pj_en": "And he made the VEIL of hyacinth, and purple, and crimson, and fine linen twined, the work of the artificer; figured with kerubin he made it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 36, "aliyah": 5, "heb": "וַיַּ֣עַשׂ לָ֗הּ אַרְבָּעָה֙ עַמּוּדֵ֣י שִׁטִּ֔ים וַיְצַפֵּ֣ם זָהָ֔ב וָוֵיהֶ֖ם זָהָ֑ב וַיִּצֹ֣ק לָהֶ֔ם אַרְבָּעָ֖ה אַדְנֵי־כָֽסֶף׃", "onk": "וַעֲבַד לֵיהּ אַרְבְּעָא עַמּוּדֵי שִׁטִּין וַחֲפָנוּן דַּהֲבָא וָוֵיהוֹן דַּהֲבָא וְאַתִּיךְ לְהוֹן אַרְבְּעָא סַמְכִין דִּכְסָף:", "onk_en": "He made for it (the paroches) four acacia-wood pillars and he overlaid them with gold. Their hooks were also of gold. He cast for them four silver sockets.", "pj": "וַעֲבַד לָהּ אַרְבְּעָה עַמּוּדֵי קֵיסֵי שִׁיטָא וַחֲפָנוּן דַּהֲבָא וָוֵיהוֹן דַּהֲבָא וְאָתִיךְ לְהוֹן אַרְבְּעָא חוֹמְרִין דִּכְסָף", "pj_en": "And he made for it four pillars of sitta wood, and covered them with gold, and their hooks of gold, and cast for them four sockets of silver.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 37, "aliyah": 5, "heb": "וַיַּ֤עַשׂ מָסָךְ֙ לְפֶ֣תַח הָאֹ֔הֶל תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֣שׁ מׇשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃", "onk": "וַעֲבַד פְּרָסָא לִתְרַע מַשְׁכְּנָא תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר עוֹבַד צַיָּר:", "onk_en": "He made a screen for the entrance of the tent, of greenish blue wool, dark red wool, crimson [<b>colored<\/b>] wool, and fine twined linen. It was the work of an embroiderer.", "pj": "וַעֲבַד וִילוֹן פָּרִיס לִתְרַע מַשְׁכְּנָא דְתִכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרִי וּבוּץ שְׁזִיר עוֹבַד צִיּוּר", "pj_en": "And he made a curtain for the door of the tabernacle, of hyacinth, and purple, and crimson., and fine linen twined, the work of the embroiderer,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 38, "aliyah": 5, "heb": "וְאֶת־עַמּוּדָ֤יו חֲמִשָּׁה֙ וְאֶת־וָ֣וֵיהֶ֔ם וְצִפָּ֧ה רָאשֵׁיהֶ֛ם וַחֲשֻׁקֵיהֶ֖ם זָהָ֑ב וְאַדְנֵיהֶ֥ם חֲמִשָּׁ֖ה נְחֹֽשֶׁת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת עַמּוּדוֹהִי חַמְשָׁא וְיָת וָוֵיהוֹן וַחֲפָא רֵישֵׁיהוֹן וְכִבּוּשֵׁיהוֹן דַּהֲבָא וְסַמְכֵיהוֹן חַמְשָׁא נְחָשָׁא:", "onk_en": "(He made) five pillars (to hold the screen), along with their hooks and he overlaid their caps and bands with gold. Their five sockets (he made of) copper.", "pj": "וְיַת עַמּוּדוֹי חַמְשָׁא וְיַת וָוֵיהוֹן וְחָפֵי רֵישֵׁיהוֹן וְכִבּוּשֵׁיהוֹן דַּהֲבָא וְחוֹמְרֵיהוֹן חַמְשָׁא דִנְחָשָׁא", "pj_en": "and its five pillars, and their five hooks; covered their capitals and their joinings with gold, and their five bases with brass.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 1, "aliyah": 5, "heb": "וַיַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת־הָאָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָחֵ֜צִי אׇרְכּ֗וֹ וְאַמָּ֤ה וָחֵ֙צִי֙ רׇחְבּ֔וֹ וְאַמָּ֥ה וָחֵ֖צִי קֹמָתֽוֹ׃", "onk": "וַעֲבַד בְּצַלְאֵל יָת אֲרוֹנָא דְּאָעֵי שִׁטִּין תַּרְתֵּין אַמִּין וּפַלְגָּא אֻרְכֵּיהּ וְאַמְּתָא וּפַלְגָא פְתָיֵהּ וְאַמְתָא וּפַלְגָּא רוּמֵיהּ:", "onk_en": "Betzalel made the ark of acacia wood, two and one-half amohs long, one and one-half amohs wide, and one and one-half amohs high.", "pj": "וְעָבַד בְּצַלְאֵל יַת אֲרוֹנָא דְקִיסֵי שִׁיטָא תַּרְתֵּין אַמִּין וּפַלְגָא אוּרְכֵּיהּ וְאַמְתָא וּפַלְגָא פּוּתְיֵהּ וְאַמְתָא וּפַלְגָא רוּמֵיהּ", "pj_en": "And Bezalel made the ARK of sitta wood; two cubits and a half its length, and a cubit and half its breadth, and a cubit and half its height.", "tj": "", "tj_en": "", "rashi": "<b>ויעש בצלאל.<\/b> לְפִי שֶׁנָּתַן נַפְשׁוֹ עַל הַמְּלָאכָה יוֹתֵר מִשְּׁאָר חֲכָמִים, נִקְרֵאת עַל שְׁמוֹ (שמות רבה):", "rashi_en": "ויעש בצלאל AND BEZALEL MADE [THE ARK] — Because he gave himself over to the work more whole-heartedly than the other wise men it is called after his name (his name alone is associated with the act) (Midrash Tanchuma, Vayakhel 10)."}, {"ch": 37, "v": 2, "aliyah": 5, "heb": "וַיְצַפֵּ֛הוּ זָהָ֥ב טָה֖וֹר מִבַּ֣יִת וּמִח֑וּץ וַיַּ֥עַשׂ ל֛וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃", "onk": "וַחֲפָהִי דְּהַב דְּכֵי מִגָּו וּמִבָּרָא וַעֲבַד לֵיהּ דֵּיר דִּדְהַב סְחוֹר סְחוֹר:", "onk_en": "He covered it with pure gold from inside and out. He made for it a golden crown-like rim around (its top).", "pj": "וְחַפְיֵיהּ דְּהַב דְּכֵי מִגֵּיו וּמִבָּרָא וְעָבַד לֵיהּ דֵּיר דִּדְהַב חֲזוֹר חֲזוֹר", "pj_en": "And he covered it with pure gold within and without, and made for it a crown of gold round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 3, "aliyah": 5, "heb": "וַיִּצֹ֣ק ל֗וֹ אַרְבַּע֙ טַבְּעֹ֣ת זָהָ֔ב עַ֖ל אַרְבַּ֣ע פַּעֲמֹתָ֑י
