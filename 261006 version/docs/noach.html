ְ וְאִתְּתָךְ וּבְנָךְ וּנְשֵׁי בְנָךְ עִמָּךְ:", "onk_en": "Depart from the ark, yourself and your wife, your sons, and your son’s wives with you.", "pj": "פּוּק מִן תֵּיבוּתָא אַנְתְּ וְאִנְתְּתָךְ וּבְנָךְ וּנְשֵׁי בְנָךְ עִמָךְ", "pj_en": "Go forth from the ark, thou, and thy wife, and thy sons, and the wives of thy sons, with thee.", "tj": "", "tj_en": "", "rashi": "<b>אתה ואשתך וגו'.<\/b> אִישׁ וְאִשְׁתּוֹ, כָּאן הִתִּיר לָהֶם תַּשְׁמִישׁ הַמִּטָּה:", "rashi_en": "’אתה ואשתך וגו THOU AND THY WIFE etc. — Husband and wife are mentioned together— now He allowed them to resume family life (Genesis Rabbah 34:8). "}, {"ch": 8, "v": 17, "aliyah": 4, "heb": "כׇּל־הַחַיָּ֨ה אֲשֶֽׁר־אִתְּךָ֜ מִכׇּל־בָּשָׂ֗ר בָּע֧וֹף וּבַבְּהֵמָ֛ה וּבְכׇל־הָרֶ֛מֶשׂ הָרֹמֵ֥שׂ עַל־הָאָ֖רֶץ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(הוצא)<\/span> <span class=\"mam-kq-q\">[הַיְצֵ֣א]<\/span><\/span> אִתָּ֑ךְ וְשָֽׁרְצ֣וּ בָאָ֔רֶץ וּפָר֥וּ וְרָב֖וּ עַל־הָאָֽרֶץ׃", "onk": "כָּל חַיְתָא דִּעִמָּךְ מִכָּל בִּשְׂרָא בְּעוֹפָא וּבִבְעִירָא וּבְכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא אַפֵּיק עִמָּךְ וְיִתְיַלְּדוּן בְּאַרְעָא וְיִפְּשׁוּן וְיִסְגּוּן עַל אַרְעָא:", "onk_en": "Every living thing that is with you, of all flesh, [including] birds, animals, every creeping creature that creeps on the earth, let them depart with you. Let them spread over the earth, and be fruitful and multiply on the earth.", "pj": "כָּל חַיְתָא דְעִמָךְ מִכָּל בִּשְרָא בְּעוֹפָא וּבִבְעִירָא וּבְכָל רִיחֲשָׁא דַרְחֵישׁ עַל אַרְעָא הַנְפֵּק עִמָךְ וְיִתְיַלְדוּן בְּאַרְעָא וְיִפְשׁוּן וְיִסְגוּן עַל אַרְעָא", "pj_en": "Every living animal that is with thee of all flesh, of fowl, of cattle, and of every reptile that creepeth on the earth, bring forth with thee, that they may produce in the earth, and spread abroad and multiply on the earth.", "tj": "", "tj_en": "", "rashi": "<b>הוצא.<\/b> הוֹצֵא כְּתִיב, הַיְצֵא קְרִי, הַיְצֵא – אֱמֹר לָהֶם שֶׁיֵּצְאוּ; הוֹצֵא – אִם אֵינָם רוֹצִים לָצֵאת הוֹצִיאֵם אַתָּה:<br><br><b>ושרצו בארץ.<\/b> וְלֹא בַּתֵּבָה, מַגִּיד שֶׁאַף הַבְּהֵמָה וְהָעוֹף נֶאֱסְרוּ בְתַשְׁמִישׁ:", "rashi_en": "הוצא BRING FORTH — The Ketib is הוצא and the Keri היצא — ;היצא means, “tell them to go forth”, הוצא means, ‘‘if they do not wish (if they refuse) to go forth, you make them go out”.<br><br>ושרצו בארץ THAT THEY MAY BRING FORTH ABUNDANTLY IN THE EARTH but not in the Ark: this teaches that cattle and fowls also were separated, male and female, in the Ark (Genesis Rabbah 34:8). "}, {"ch": 8, "v": 18, "aliyah": 4, "heb": "וַיֵּ֖צֵא־נֹ֑חַ וּבָנָ֛יו וְאִשְׁתּ֥וֹ וּנְשֵֽׁי־בָנָ֖יו אִתּֽוֹ׃", "onk": "וּנְפַק נֹחַ וּבְנוֹהִי וְאִתְּתֵיהּ וּנְשֵׁי בְנוֹהִי עִמֵּיהּ:", "onk_en": "Noach departed [from the ark together with] his sons, his wife and son’s wives.", "pj": "וּנְפַק נחַ וּבְנוֹי וְאִנְתְּתֵיהּ וּנְשֵׁי בְנוֹי עִמֵיהּ", "pj_en": "And Noah went forth, and his sons, and his wife, and the wives of his sons, with him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 19, "aliyah": 4, "heb": "כׇּל־הַֽחַיָּ֗ה כׇּל־הָרֶ֙מֶשׂ֙ וְכׇל־הָע֔וֹף כֹּ֖ל רוֹמֵ֣שׂ עַל־הָאָ֑רֶץ לְמִשְׁפְּחֹ֣תֵיהֶ֔ם יָצְא֖וּ מִן־הַתֵּבָֽה׃", "onk": "כָּל חַיְתָא כָּל רִחֲשָׁא וְכָל עוֹפָא כֹּל דְּרָחֵשׁ עַל אַרְעָא לְזַרְעֲיָתְהוֹן נְפָקוּ מִן תֵּבוֹתָא:", "onk_en": "Every living thing, every creeping creature, every bird, everything that creeps on the earth, departed from the ark according to their families.", "pj": "כָּל חַיְתָא כָּל רִיחֲשָׁא וְכָל עוֹפָא דִרְחִישׁ עַל אַרְעָא לְזַרְעֲיַתְהוֹן נְפָקוּ מִן תֵּיבוּתָא", "pj_en": "Every animal, every reptile, and every bird, which moveth upon the earth, according to its seed, went forth from the ark.", "tj": "", "tj_en": "", "rashi": "<b>למשפחותיהם.<\/b> קִבְּלוּ עֲלֵיהֶם עַל מְנָת לִדָּבֵק בְּמִינָן:", "rashi_en": "למשפחתיהם AFTER THEIR FAMILIES — They took upon themselves to keep to their specie. "}, {"ch": 8, "v": 20, "aliyah": 4, "heb": "וַיִּ֥בֶן נֹ֛חַ מִזְבֵּ֖חַ לַֽיהֹוָ֑ה וַיִּקַּ֞ח מִכֹּ֣ל&thinsp;<b>׀<\/b> הַבְּהֵמָ֣ה הַטְּהֹרָ֗ה וּמִכֹּל֙ הָע֣וֹף הַטָּה֔וֹר וַיַּ֥עַל עֹלֹ֖ת בַּמִּזְבֵּֽחַ׃", "onk": "וּבְנָא נֹחַ מַדְבְּחָא <b>קֳדָם<\/b> יְיָ וּנְסִיב מִכֹּל בְּעִירָא דַכְיָא וּמִכֹּל עוֹפָא דְכֵי וְאַסֵּיק עֲלָוָן בְּמִדְבְּחָא:", "onk_en": "Noach built an altar to [<b>before<\/b>] Adonoy, and took of every [ritually] clean animal and of every [ritually] clean bird, and brought up burnt-offerings on the altar.", "pj": "וּבְנָא נחַ מַדְבְּחָא קֳדָם יְיָ הוּא מַדְבְּחָא דְבָנָא אָדָם בְּעִידָן דְאִיטְרַד מִן גִנְתָא דְעֵדֶן וְאַקְרִיב עֲלוֹי קָרְבָּנָא וְעִלוֹי אַקְרִיבוּ קַיִן וְהֶבֶל יַת קָרְבָּנֵיהוֹן וְכַד נַחְתוּ מוֹי דְטוֹבְעָנָא אִיתְצַד וּבַנְיֵיהּ נחַ וְנָסָב מִכָּל בְּעִירָא דַכְיָא וּמִן כָּל עוֹף דְכֵי וְאַסֵיק אַרְבַּע עַל הַהוּא מַדְבְּחָא", "pj_en": "And Noah builded the altar before the Lord; that altar which Adam had builded in the time when he was cast forth from the garden of Eden, and had offered an oblation upon it; and upon it had Kain and Habel offered their oblations. But when the waters of the deluge descended, it was destroyed, and Noah rebuilded it; and he took of all clean cattle, and of all clean fowl, and sacrificed four upon that altar. And the Lord accepted his oblation with favour:", "tj": "", "tj_en": "", "rashi": "<b>מכל הבהמה הטהורה.<\/b> אָמַר לֹא צִוָּה לִי הַקָּבָּ\"ה לְהַכְנִיס מֵאֵלּוּ ז' ז' אֶלָּא כְּדֵי לְהַקְרִיב קָרְבָּן מֵהֶם:", "rashi_en": "מכל הבהמה הטהרה OF ALL CLEAN CATTLE — He said: “The Holy One, blessed be He, ordered me to take in seven pairs of these only in order that I might offer a sacrifice of them” (Genesis Rabbah 34:9). "}, {"ch": 8, "v": 21, "aliyah": 4, "heb": "וַיָּ֣רַח יְהֹוָה֮ אֶת־רֵ֣יחַ הַנִּיחֹ֒חַ֒ וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־לִבּ֗וֹ לֹֽא־אֹ֠סִ֠ף לְקַלֵּ֨ל ע֤וֹד אֶת־הָֽאֲדָמָה֙ בַּעֲב֣וּר הָֽאָדָ֔ם כִּ֠י יֵ֣צֶר לֵ֧ב הָאָדָ֛ם רַ֖ע מִנְּעֻרָ֑יו וְלֹֽא־אֹסִ֥ף ע֛וֹד לְהַכּ֥וֹת אֶת־כׇּל־חַ֖י כַּֽאֲשֶׁ֥ר עָשִֽׂיתִי׃", "onk": "<b>וְקַבִּיל יְיָ בְּרַעֲוָא יָת קוּרְבָּנֵיהּ<\/b> וַאֲמַר יְיָ <b>בְּמֵימְרֵיהּ<\/b> לָא אוֹסֵף לְמֵילַט עוֹד יָת אַרְעָא בְּדִיל <b>חוֹבֵי<\/b> אֱנָשָׁא אֲרֵי יִצְרָא לִבָּא דֶאֱנָשָׁא בִּישׁ מִזְּעִירֵיהּ וְלָא אוֹסֵף עוֹד לְמִמְחֵי יָת כָּל דְּחַי כְּמָא דְעָבְדִית:", "onk_en": "Adonoy smelled the pleasing fragrance, [<b>Adonoy accepted his offering with favor<\/b>] and Adonoy said in His heart [<b>with his Word<\/b>], Never again will I curse the ground because of [<b>the sins of<\/b>] man, for the inclination of man’s heart is evil from [the time of] his youth. I will never again smite every living thing as I have done.", "pj": "וְקַבֵּל יְיָ בְּרַעֲוָא קוּרְבָנֵיהּ וַאֲמַר יְיָ בְּמֵימְרֵיהּ לָא אוֹסִיף לְמֵילִיט תּוּב יַת אַרְעָא בְּגִין חוֹבֵי בְּנֵי אֱנָשָׁא אֲרוּם יִצְרָא דְלִבָּא דְאֵינָשָׁא בִּישׁ מִטַלְיוּתֵיהּ וְלָא אוֹסִיף תּוּב לְמִמְחֵי יַת כָּל דְחַי הֵיכְמָא דְעוֹבָדִית", "pj_en": "and the Lord said in His Word, I will not add again to curse the earth on account of the sin of the children of men; for the imagination of the heart of man is evil from his youth; neither will I add to destroy whatever liveth as I have done.", "tj": "", "tj_en": "", "rashi": "<b>מנעריו.<\/b> מנעריו כְּתִיב, מִשֶּׁנִּנְעַר לָצֵאת מִמְּעֵי אִמּוֹ נִתַּן בּוֹ יֵצֶר הָרָע:<br><br><b>לא אסף ולא אסף.<\/b> כָּפַל הַדָּבָר לִשְׁבוּעָה; הוּא שֶׁכָּתוּב אֲשֶׁר נִשְׁבַּעְתִּי מֵעֲבֹר מֵי נֹחַ, וְלֹא מָצִינוּ בָהּ שְׁבוּעָה, אֶלָּא זוֹ שֶׁכָּפַל דְּבָרָיו וְהִיא שְׁבוּעָה וְכֵן דָּרְשׁוּ חֲכָמִים בְּמס' שְׁבוּעוֹת:", "rashi_en": ". מנעריו FROM HIS YOUTH — This word is written without a Vav after the ע so that it may be read as מנעריו which would imply that from the moment the embryo bestirs itself to have an independent existence the evil inclination is given to it (Genesis Rabbah 34:10).<br><br>לא אסף… ולא אסף I WILL NEVER AGAIN … NEITHER WILL I EVER AGAIN — He repeated the expression that it might serve as a solemn oath, and it is to this that the text (Isaiah 54:9) refers: “For as I have sworn that the waters of Noah [will never again pass over the earth]”. We, however, do not find any explicit oath regarding this, but this passage in which He repeated these words, which may be regarded as an oath. Thus do our Sages explain in Treatise Shevuot 36a. "}, {"ch": 8, "v": 22, "aliyah": 4, "heb": "עֹ֖ד כׇּל־יְמֵ֣י הָאָ֑רֶץ זֶ֡רַע וְ֠קָצִ֠יר וְקֹ֨ר וָחֹ֜ם וְקַ֧יִץ וָחֹ֛רֶף וְי֥וֹם וָלַ֖יְלָה לֹ֥א יִשְׁבֹּֽתוּ׃", "onk": "עוֹד כָּל יוֹמֵי אַרְעָא זְרוֹעָא וַחֲצָדָא וְקוֹרָא וְחוֹמָא וְקַיְטָא וְסִתְוָא וִימָם וְלֵילְיָא לָא יִבְטְלוּן:", "onk_en": "So long as the earth exists, seed-time and harvest, cold and heat, summer and winter, day and night, will never be suspended.", "pj": "עוֹד כָּל יוֹמֵי אַרְעָא דְרוֹעָא בִּתְקוּפַת תִּשְׁרֵי וַחֲצָדָא בִּתְקוּפַת נִיסָן וְקוֹרָא בִּתְקוּפַת טֵבַת וְחוֹמָא בִּתְקוּפַת תַּמוּז וְקַיְטָא וְסִתְוָא וִימָמֵי וְלֵילֵי לָא יִתְבַּטְלוּן", "pj_en": "Until all the days of the earth, sowing in the season of Tishri, and harvest in the season of Nisan, and coldness in the season of Tebeth, and warmth in the season of Tammuz, and summer and winter, and days and nights shall not fail.", "tj": "עוֹד כָּל יוֹמֵי אַרְעָא מִן כְּדוֹן זַרְעִין וְחַצְדִין וְצִינְתָא וְשׁוֹרְבָא וִימָם וְלֵילָא לָא פַּסְקִין:", "tj_en": "Until all the days of the earth from now, sowing and reaping, and cold and heat, and days and nights shall not cease.", "rashi": "<b>עוד כל ימי הארץ וגו' לא ישבתו.<\/b> ו' עִתִּים הַלָּלוּ שְׁנֵי חֳדָשִׁים לְכָל אֶחָד וְאֶחָד, כְּמוֹ שֶׁשָּׁנִינוּ חֲצִי תִשְׁרֵי וּמַרְחֶשְׁוָן וַחֲצִי כִסְלֵו זֶרַע, חֲצִי כִסְלֵו וְטֵבֵת וַחֲצִי שְׁבָט קֹר (חֹרֶף) (ב\"מ ק\"ו):<br><br><b>קור.<\/b> קָשֶׁה מֵחֹרֶף:<br><br><b>חרף.<\/b> עֵת זֶרַע שְׂעוֹרִים וְקִטְנִית הַחֲרִיפִין לְהִתְבַּשֵּׁל מַהֵר, וְהוּא חֲצִי שְׁבָט וַאֲדָר וַחֲצִי נִיסָן:<br><br><b>קציר.<\/b> חֲצִי נִיסָן וְאִיָּר וַחֲצִי סִיוָן:<br><br><b>קיץ.<\/b> חֲצִי סִיוָן תַּמּוּז וַחֲצִי אָב, הוּא זְמַן לְקִיטַת תְּאֵנִים וּזְמַן שֶׁמְּיַבְּשִׁים אוֹתָן בַּשָּׂדוֹת, וּשְׁמוֹ קַיִץ, כְּמוֹ הַלֶּחֶם וְהַקַּיִץ לֶאֱכוֹל הַנְּעָרִים (ש\"ב ט\"ז):<br><br><b>חום.<\/b> הוּא סוֹף יְמוֹת הַחַמָּה, חֲצִי אָב וֶאֱלוּל וַחֲצִי תִשְׁרֵי, שֶׁהָעוֹלָם חַם בְּיוֹתֵר; כְּמוֹ שֶׁשָּׁנִינוּ בְּמַסֶּכֶת יוֹמָא שִׁלְהֵי קַיְיטָא קָשֵׁי מִקַּיְיטָא:<br><br><b>ויום ולילה לא ישבתו.<\/b> מִכְּלָל שֶׁשָּׁבְתוּ כָּל יְמוֹת הַמַּבּוּל, שֶׁלֹּא שִׁמְּשׁוּ הַמַּזָּלוֹת, וְלֹא נִכַּר בֵּין יוֹם וּבֵין לַיְלָה (ב\"ר פכ\"ה ופ' ל\"ד):<br><br><b>לא ישבתו.<\/b> לֹא יִפְסְקוּ כָּל אֵלֶה מִלְּהִתְנַהֵג כְּסִדְרָן:", "rashi_en": "עוד כל ימי הארץ וגו' לא ישבתו WHILE THE EARTH REMAINETH … SHALL NOT CEASE — Of these six seasons each consists of two months, as we have learned (Bava Metzia 106b): Half of Tishri, Marcheshvan and half of Kislev is seedtime; half of Kislev, Tebeth and half of Shebat is the cold-season. <br><br>קור COLD-SEASON is more severe than חורף winter.<br><br>חורף WINTER is the time of sowing barley and pulse which are quick (חריף) to ripen. It is half of Shebat, Adar and half of Nisan.<br><br>קציר HARVEST — Half of Nisan, Eyar, and half of Sivan.<br><br>קיץ SUMMER — Half of Sivan, Tammuz and half of Ab. This is the time of fig-gathering, the time when they lay them out to dry in the fields. and its name is קיץ “summer-fruittime”, as (2 Samuel 16:2) “And the bread and the summer-fruit (קיץ) for the young men to eat”.<br><br>חום HEAT — This is the end of the hot season, half of Ab, Elul and half of Tishri, when the world is excessively hot, as we have learned in Treatise Yoma 29a: “The end of the summer is worse than the summer itself”.<br><br>ויום ולילה לא ישבתו DAY AND NIGHT SHALL NOT CEASE — From this we may infer that they (day and night) ceased during the period of the Flood, for the planetary system did not function, so that there was no distinction between day and night (Genesis Rabbah 34:11).<br><br>לא ישבתו SHALL NOT CEASE — None of these shall cease to take their natural course."}, {"ch": 9, "v": 1, "aliyah": 4, "heb": "וַיְבָ֣רֶךְ אֱלֹהִ֔ים אֶת־נֹ֖חַ וְאֶת־בָּנָ֑יו וַיֹּ֧אמֶר לָהֶ֛ם פְּר֥וּ וּרְב֖וּ וּמִלְא֥וּ אֶת־הָאָֽרֶץ׃", "onk": "וּבָרִיךְ יְיָ יָת נֹח וְיָת בְּנוֹהִי וַאֲמַר לְהוֹן פּוּשׁוּ וּסְגוּ וּמְלוּ יָת אַרְעָא:", "onk_en": "Elohim blessed Noach and his sons. He said to them, Be fruitful and multiply and fill the earth.", "pj": "וּבְרִיךְ יְיָ יַת נחַ וְיַת בְּנוֹי וַאֲמַר לְהוֹם פּוּשוּ וּסְגוּ וּמְלוּ יַת אַרְעָא", "pj_en": "And the Lord blessed Noah, and his sons, and said to them, Spread forth and multiply, and replenish the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 2, "aliyah": 4, "heb": "וּמוֹרַאֲכֶ֤ם וְחִתְּכֶם֙ יִֽהְיֶ֔ה עַ֚ל כׇּל־חַיַּ֣ת הָאָ֔רֶץ וְעַ֖ל כׇּל־ע֣וֹף הַשָּׁמָ֑יִם בְּכֹל֩ אֲשֶׁ֨ר תִּרְמֹ֧שׂ הָֽאֲדָמָ֛ה וּֽבְכׇל־דְּגֵ֥י הַיָּ֖ם בְּיֶדְכֶ֥ם נִתָּֽנוּ׃", "onk": "וְדַחֲלַתְכוֹן וְאֵימַתְכוֹן תְּהֵי עַל כָּל חֵוַת אַרְעָא וְעַל כָּל עוֹפָא דִשְׁמַיָּא בְּכֹל דִּי תַרְחֵישׁ אַרְעָא וּבְכָל נוּנֵי יַמָּא בְּיֶדְכוֹן יְהוֹן מְסִירִין:", "onk_en": "Your fear and terror will be upon every wild beast of the earth, and upon every bird in the heavens. All that creeps on the ground, and all the fish of the sea, are given into your hands.", "pj": "וְדַחֲלַתְכוֹן וְאֵימַתְכוֹן יְהֵי עַל כָּל חֵיוַת אַרְעָא וְעַל כָּל עוֹפָא דִשְׁמַיָא מִכָּל דְתַרְחֵשׁ אַרְעָא וּבְכָל נוּנֵי יַמָא בְּיֶדְכֶם יִתְמַסְרוּן", "pj_en": "And the fear of you and the dread of you shall be upon every beast of the earth, and on every fowl of the heavens; of all that the earth swarmeth forth, and all the fishes of the sea, into your hand are they delivered.", "tj": "", "tj_en": "", "rashi": "<b>וחתכם.<\/b> וְאֵימַתְכֶם, כְּמוֹ תִּרְאוּ חֲתַת (איוב ו') וְאַגָּדָה לְשׁוֹן חַיּוּת שֶׁכָּל זְמַן שֶׁתִּינוֹק בֶּן יוֹמוֹ חַי אֵין אַתָּה צָרִיךְ לְשָׁמְרוֹ מִן הָעַכְבָּרִים; עוֹג מֶלֶךְ הַבָּשָׁן מֵת, צָרִיךְ לְשָׁמְרוֹ מִן הָעַכְבָּרִים, שֶׁנֶּאֱמַר וּמוֹרַאֲכֶם וְחִתְּכֶם יִהְיֶה, אֵימָתַי יִהְיֶה מוֹרַאֲכֶם עַל הַחַיּוֹת? כָּל זְמַן שֶׁאַתֶּם חַיִּים (שבת קנ\"א):", "rashi_en": "וחתכם means AND THE DREAD OF YOU, similar to (Job 6:21) “ye see a terror (חתת).\" The Agada takes the word as signifying “life”, “vitality” (חיות): So long as a baby, even one day old, has life you do not have to guard it against the attacks of mice, whilst Og, king of Bashan, when dead needs to be guarded against the attacks of mice, as it is said, “And the fear of you and the terror of you shall be [upon the beasts of the field etc.].” When will the fear of you be upon the beasts? So long as you are alive (חתכם) (Shabbat 151b)."}, {"ch": 9, "v": 3, "aliyah": 4, "heb": "כׇּל־רֶ֙מֶשׂ֙ אֲשֶׁ֣ר הוּא־חַ֔י לָכֶ֥ם יִהְיֶ֖ה לְאׇכְלָ֑ה כְּיֶ֣רֶק עֵ֔שֶׂב נָתַ֥תִּי לָכֶ֖ם אֶת־כֹּֽל׃", "onk": "כָּל רִחֲשָׁא דְּהוּא חַי לְכוֹן יְהֵי לְמֵיכָל כִּירוֹק עִשְׂבָּא יְהָבִית לְכוֹן יָת כֹּלָּא:", "onk_en": "Every moving creature that lives, shall be yours for food; like the green vegetation [which I gave previously] I have [now] given you everything [for food].", "pj": "כָּל רִיחֲשָׁא דְהוּא חַי דִלְכוֹן יְהֵי לְמֵיכַל כִּירוֹק עִסְבָּא יְהָבִית לְכוֹן יַת כּוֹלָא", "pj_en": "Every moving thing which liveth to you shall be for food: as the green herb have I given to you the whole.", "tj": "", "tj_en": "", "rashi": "<b>לכם יהיה לאכלה.<\/b> שֶׁלֹּא הִרְשֵׁיתִי לְאָדָם הָרִאשׁוֹן בָּשָׂר אֶלָּא יֶרֶק עֵשֶׂב; וְלָכֶם – כְּיֶרֶק עֵשֶׂב שֶׁהִפְקַרְתִּי לְאָדָם הָרִאשׁוֹן, נָתַתִּי לָכֶם אֶת כֹּל (סנה' נ\"ט):", "rashi_en": "לכם יהיה לאכלה SHALL BE FOOD FOR YOU — For I did not permit Adam Harishon to eat meat, but green herbs alone; but lo you — even as the green herbs that I gave the full use of to Adam Harishon — do I give everything (Sanhedrin 59b). "}, {"ch": 9, "v": 4, "aliyah": 4, "heb": "אַךְ־בָּשָׂ֕ר בְּנַפְשׁ֥וֹ דָמ֖וֹ לֹ֥א תֹאכֵֽלוּ׃", "onk": "בְּרַם בִּשְׂרָא בְּנַפְשֵׁיהּ דְּמֵיהּ לָא תֵכְלוּן:", "onk_en": "Nevertheless, flesh with its lifeblood, you shall not eat.", "pj": "בְּרַם בִּשְרָא דְתָלִישׁ מִן חַיוּתָא חַיָא בִּזְמַן דִבְנַפְשֵׁיהּ בֵּיהּ אוֹ דְתָלִישׁ מִן חַיוּתָא נְכִיסְתָּא וְעַד דְלָא נַפְקָא כּוֹלָא נִשְׁמָתָא לָא תֵיכְלוּן", "pj_en": "But flesh which is torn of the living beast, what time the life is in it, or that torn from a slaughtered animal before all the breath has gone forth, you shall not eat.", "tj": "", "tj_en": "", "rashi": "<b>בשר בנפשו.<\/b> אָסַר לָהֶם אֵבֶר מִן הַחַי, כְּלוֹמַר כָּל זְמַן שֶׁנַּפְשׁוֹ בּוֹ, לֹא תֹאכְלוּ הַבָּשָׂר:<br><br><b>בנפשו דמו.<\/b> בְעוֹד נַפְשׁוֹ בּוֹ<br><br><b>בשר בנפשו לא תאכלו.<\/b> הֲרֵי אֵבֶר מִן הַחַי, וְאַף בְּנַפְשׁוֹ דָמוֹ לֹא תֹאכֵלוּ, הֲרֵי דָם מִן הַחַי:", "rashi_en": "בשר בנפשו FLESH WITH THE SOUL THEREOF [SHALL YE NOT EAT] — He here prohibited to them אבר מן החי the eating of a limb cut from a living animal, that is to say that בשר בנפשו (literally, flesh together with its life) means so long as its life is in it you shall not eat the flesh.<br><br>בנפשו דמו (literally, its blood together with its life) means whilst its (the animal’s) life is still in it (the blood).<br><br>Consequently בשר בנפשו לא תאכלו FLESH SO LONG AS THERE IS LIFE IN IT SHALL YE NOT EAT forms the prohibition of אבר מן החי the eating of a limb cut from a living animal. And connecting בנפשו with דמו we obtain the reading also בנפשו דמו לא תאכלו ITS BLOOD TOGETHER WITH ITS LIFE SHALL YE NOT EAT which forms the prohibition of partaking of blood of a living animal (Sanhedrin 59a)"}, {"ch": 9, "v": 5, "aliyah": 4, "heb": "וְאַ֨ךְ אֶת־דִּמְכֶ֤ם לְנַפְשֹֽׁתֵיכֶם֙ אֶדְרֹ֔שׁ מִיַּ֥ד כׇּל־חַיָּ֖ה אֶדְרְשֶׁ֑נּוּ וּמִיַּ֣ד הָֽאָדָ֗ם מִיַּד֙ אִ֣ישׁ אָחִ֔יו אֶדְרֹ֖שׁ אֶת־נֶ֥פֶשׁ הָֽאָדָֽם׃", "onk": "וּבְרַם יָת דִּמְכוֹן לְנַפְשָׁתֵיכוֹן אֶתְבַּע מִיַּד כָּל חַיְתָא אֶתְבְּעִנֵּיהּ וּמִיַּד אֱנָשָׁא <b>מִיַּד גְּבַר דְּיֵשׁוֹד יָת דְּמָא דַאֲחוֹהִי<\/b> אֶתְבַּע יָת נַפְשָׁא דֶאֱנָשָׁא:", "onk_en": "However, of the blood of your souls, I will demand an account; from the hand of every beast will I demand it. From the hand of man, even from the hand of man’s own brother, [<b>from the hand of a man who spills his brother’s blood,<\/b>] will I demand an account of man’s soul.", "pj": "וּבְרַם יַת דִמְכוֹן לְנַפְשָׁתֵיכוֹן אֵתְבּוֹעַ מִן יְדָא דְכָל חַיְתָא דְקַטְלָא לְבַר נְשָׁא אִיתְבּוֹעִינֵיהּ לְאִיתְקַטְלָא עֲלֵיהּ וּמִידָא דְאֵינָשָׁא מִיַד גְבַר דְיֵישׁוֹד יַת דְמָא דְאָחוֹי אִתְבַּע יַת נַפְשָׁא דְאֵינָשָׁא", "pj_en": "But the blood of your lives I will I require of every animal which hath killed a man, I will require that it be put to death on his account. And from the hand of the human being, from the hand of the man who hath shed the blood of his brother, will I require the life of man.", "tj": "", "tj_en": "", "rashi": "<b>ואך את דמכם.<\/b> אַעַ\"פִּ שֶׁהִתַּרְתִּי לָכֶם נְטִילַת נְשָׁמָה בַּבְּהֵמָה, אֶת דִּמְכֶם אֶדְרֹשׁ מֵהַשּׁוֹפֵךְ דַּם עַצְמוֹ:<br><br><b>לנפשתיכם.<\/b> אַף הַחוֹנֵק עַצְמוֹ, אַף עַל פִּי שֶׁלֹּא יָצָא מִמֶּנּוּ דָם:<br><br><b>מיד כל חיה.<\/b> לְפִי שֶׁחָטְאוּ דוֹר הַמַּבּוּל וְהֻפְקְרוּ לְמַאֲכַל חַיּוֹת רָעוֹת לִשְׁלֹט בָּהֶן, שֶׁנֶּאֱמַר נִמְשַׁל כַּבְּהֵמוֹת נִדְמוּ (תהלים מ\"ט), לְפִיכָךְ הֻצְרַךְ לְהַזְהִיר עֲלֵיהֶן אֶת הַחַיּוֹת:<br><br><b>ומיד האדם.<\/b> מִיַּד הַהוֹרֵג בְּמֵזִיד וְאֵין עֵדִים, אֲנִי אֶדְרֹשׁ:<br><br><b>מיד איש אחיו.<\/b> שֶׁהוּא אוֹהֵב לוֹ כְאָח וְהָרַג שׁוֹגֵג, אֲנִי אֶדְרֹשׁ אִם לֹא יִגְלֶה וִיבַקֵּשׁ עַל עֲוֹנוֹ לִמָּחֵל, שֶׁאַף הַשּׁוֹגֵג צָרִיךְ כַּפָּרָה, וְאִם אֵין עֵדִים לְחַיְּבוֹ גָלוּת וְהוּא אֵינוֹ נִכְנָע, הַקָּבָּ\"ה דוֹרֵש מִמֶּנוּ, כְּמוֹ שֶׁדָּרְשוּ רַבּוֹתֵינוּ \"וְהָאֱלֹהִים אִנָּה לְיָדוֹ\" – בְּמַסֶּכֶת מַכּוֹת – הַקָּבָּ\"ה מְזַמְּנָן לְפֻנְדָּק אֶחָד וְכוּ':", "rashi_en": "ואך את דמכם HOWEVER YOUR BLOOD — Although I have permitted you to take the life of cattle yet your blood I will surely require from him amongst you who sheds his own blood (see Bava Kamma 91b).<br><br>לנפשותיכם YOUR LIFE — Even though one strangles himself (Genesis Rabbah 34:13) so that no blood flows from him yet I will require it from him.<br><br>מיד כל חיה AT THE HAND OF EVERY BEAST — Because the generation of the Flood sinned and they were therefore freely exposed to become food for wild beasts which would have power over them — as it is said (Psalms 49:21), “He is ruled over by wild beasts like the beasts that perish” (these being the prey of other animals) (Shabbat 151b) — it was therefore necessary to proclaim a punishment against wild animals on their account.<br><br>ומיד האדם AT THE HAND OF MAN — At the hand of one who kills with premeditation, when there are no witnesses to the murder, will “I” require it.<br><br>מיד איש אחיו AT THE HAND OF EVERY MAN’S BROTHER — At the hand of a man who loves him like a brother and slays him accidentally will “I” require it, unless he go into banishment (in one of the Cities of Refuge) and pray for forgiveness for his iniquity. For even one who kills another by accident needs atonement: therefore if there are no witnesses to the deed to make him liable to banishment and he does not humble himself, the Holy One, blessed be He, will require it of him, just as our Rabbis explain the text, (Exodus 21:13) ‘‘But God causes it to come to hand”, in Treatise Makkot (Makkot 10b): The Holy One, blessed be He, causes them (the man who killed by accident and had not expiated the murder and the man who killed with premeditation) to meet at the same inn. The former in ascending a ladder falls upon the latter and kills him and has therefore — the accident having been seen by men — to go to banishment."}, {"ch": 9, "v": 6, "aliyah": 4, "heb": "שֹׁפֵךְ֙ דַּ֣ם הָֽאָדָ֔ם בָּֽאָדָ֖ם דָּמ֣וֹ יִשָּׁפֵ֑ךְ כִּ֚י בְּצֶ֣לֶם אֱלֹהִ֔ים עָשָׂ֖ה אֶת־הָאָדָֽם׃", "onk": "דְּיֵשׁוֹד דְּמָא דֶאֱנָשָׁא <b>בְּסַהֲדִין עַל מֵימַר דַּיָּנַיָּא דְּמֵיהּ יִתְּשָׁד<\/b> אֲרֵי בְּצַלְמָא דַיְיָ עֲבַד יָת אֱנָשָׁא:", "onk_en": "He who spills the blood of man, through man shall his blood be spilled, [<b>by witnesses according to the word of judges shall his blood be spilled,<\/b>] for in the image of Elohim, He made man.", "pj": "דְיֵישׁוֹד דְמָא דְאֵינָשָׁא בְּסַהֲדִין דְיָינַיָא מְחַיְיבִין לֵיהּ קְטוֹל וּדְיֵישׁוֹד בְּלָא סַהֲדִין מָרֵי עָלְמָא עָתִיד לְאִתְפַּרְעָא מִנֵיהּ לְיוֹם דִינָא רַבָּא אֲרוּם בִּדְיוֹקְנָא דַיְיָ עֲבַד יַת אֵינָשָׁא", "pj_en": "Whoso sheddeth the blood of man, the judges, by witnesses, shall condemn him unto death; but he who sheddeth it without witnesses, the Lord of the world will bring punishment on him in the day of the great judgment; because in the image of the Lord He made man.", "tj": "", "tj_en": "", "rashi": "<b>באדם דמו ישפך.<\/b> אִם יֵשׁ עֵדִים הֲמִיתוּהוּ אַתֶּם, לָמָּה? כִּי בְצֶלֶם אֱלֹהִים וגו':<br><br><b>עשה את האדם.<\/b> זֶה מִקְרָא חָסֵר, וְצָרִיךְ לִהְיוֹת עָשָׂה הָעוֹשֶׂה אֶת הָאָדָם וְכֵן הַרְבֵּה בַּמִּקְרָא:", "rashi_en": "באדם דמו ישפך BY MAN SHALL HIS BLOOD BE SHED — If there are witnesses you kill him. Why? Because in the image of God [made He man] and he has destroyed the Divine image (Genesis Rabbah 34:14)<br><br>עשה את האדם HE MADE MAN — This verse is abbreviated and should be “the Maker made man”; there are many similar expressions in the Scriptures. "}, {"ch": 9, "v": 7, "aliyah": 4, "heb": "וְאַתֶּ֖ם פְּר֣וּ וּרְב֑וּ שִׁרְצ֥וּ בָאָ֖רֶץ וּרְבוּ־בָֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַתּוּן פּוּשׁוּ וּסְגוּ אִתְיְלִידוּ בְאַרְעָא וּסְגוּ בַהּ:", "onk_en": "And now be fruitful and multiply, spread throughout the earth and multiply on it.", "pj": "וְאַתּוּן פּוּשׁוּ וּסְגוּ אִיתְיְלִידוּ בְּאַרְעָא וּסְגוּ בָהּ", "pj_en": "And you, spread yourselves abroad and multiply; bring forth in the earth, and increase in it.", "tj": "", "tj_en": "", "rashi": "<b>ואתם פרו ורבו.<\/b> לְפִי פְּשׁוּטוֹ הָרִאשׁוֹנָה לִבְרָכָה וְכָאן לְצִוּוּי. וּלְפִי מִדְרָשׁוֹ לְהַקִּישׁ מִי שֶׁאֵינוֹ עוֹסֵק בִּפְרִיָּה וּרְבִיָּה לְשׁוֹפֵךְ דָּמִים (יבמות ס\"ג):", "rashi_en": "ואתם פרו ורבו AND YE, BE FRUITFUL AND MULTIPLY — According to the real sense, the first time this was said to man (Genesis 9:1) it was said as a blessing (an assurance that they would be fruitful); here it is a command (Ketubot 5a). According to the Midrashic explanation this command is mentioned here after the mention of murder in order to liken one who abstains from having children to one who sheds blood (Yevamot 63b). "}, {"ch": 9, "v": 8, "aliyah": 5, "heb": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־נֹ֔חַ וְאֶל־בָּנָ֥יו אִתּ֖וֹ לֵאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְנֹחַ וְלִבְנוֹהִי עִמֵּיהּ לְמֵימָר:", "onk_en": "Elohim said to Noach and to his sons with him, saying,", "pj": "וַאֲמַר יְיָ לְנחַ וְלִבְנוֹי עִמֵיהּ לְמֵימַר", "pj_en": "And the Lord spake to Noah, and to his sons with him, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 9, "aliyah": 5, "heb": "וַאֲנִ֕י הִנְנִ֥י מֵקִ֛ים אֶת־בְּרִיתִ֖י אִתְּכֶ֑ם וְאֶֽת־זַרְעֲכֶ֖ם אַֽחֲרֵיכֶֽם׃", "onk": "וַאֲנָא הָא אֲנָא מֵקִים יָת קְיָמִי עִמְּכוֹן וְעִם בְּנֵיכוֹן בַּתְרֵיכוֹן:", "onk_en": "Behold, I am making a covenant with you and with your offspring after you.", "pj": "אֲנָא הָא אֲנָא מְקַיֵים קְיָמַי עִמְכוֹן וְעִם בְּנֵיכוֹן בַּתְרֵיכוֹן", "pj_en": "I, behold, I establish my covenant with you, and with your children after you;", "tj": "", "tj_en": "", "rashi": "<b>ואני הנני.<\/b> מַסְכִּים אֲנִי עִמְּךָ, שֶׁהָיָה נֹחַ דוֹאֵג לַעֲסֹק בִּפְרִיָּה וּרְבִיָּה עַד שֶׁהִבְטִיחוֹ הַקָּבָּ\"ה שֶׁלֹּא לְשַׁחֵת הָעוֹלָם עוֹד, וְכֵן עָשָׂה וּבָאַחֲרוֹנָה אָמַר לוֹ הִנְנִי מַסְכִּים לַעֲשׂוֹת קִיּוּם וְחִזּוּק בְּרִית לְהַבְטָחָתִי וְאֶתֵּן לְךָ אוֹת:", "rashi_en": "ואני הנני AND I BEHOLD I — “I am in agreement with you”; He said this because Noah feared to fulfil the duty of propagating the species until the Holy One, blessed be He, promised him that he would not again destroy the world and this promise God made (Midrash Tanchuma, Noach 11). Ultimately He said to him, “If you are still anxious I am willing to give to My promise the permanence and strength of a covenant and I will give you a sign.”"}, {"ch": 9, "v": 10, "aliyah": 5, "heb": "וְאֵ֨ת כׇּל־נֶ֤פֶשׁ הַֽחַיָּה֙ אֲשֶׁ֣ר אִתְּכֶ֔ם בָּע֧וֹף בַּבְּהֵמָ֛ה וּֽבְכׇל־חַיַּ֥ת הָאָ֖רֶץ אִתְּכֶ֑ם מִכֹּל֙ יֹצְאֵ֣י הַתֵּבָ֔ה לְכֹ֖ל חַיַּ֥ת הָאָֽרֶץ׃", "onk": "וְעִם כָּל נַפְשָׁא חַיְתָא דְּעִמְּכוֹן בְּעוֹפָא בִבְעִירָא וּבְכָל חֵיוַת אַרְעָא דְּעִמְּכוֹן מִכֹּל נַפְקֵי תֵבוֹתָא לְכֹל חַיַּת אַרְעָא:", "onk_en": "And with every living creature that is with you, with the birds, the animals, and all the beasts of the earth with you, all who departed from the ark, including every living creature on earth.", "pj": "וְעִם כָּל נַפְשָׁא חַיְיתָא דְעִמְכוֹן בְּעוֹפָא וּבִבְעִירָא וּבְכָל חַיַת אַרְעָא דְעִמְכוֹן מִכָּל נַפְקֵי תֵיבוּתָא לְכָל חַיַת אַרְעָא", "pj_en": "and with every living soul that is with you, of birds, and of cattle, and of every beast of the earth that is with you, of all that go forth from the ark, of every beast of the earth.", "tj": "", "tj_en": "", "rashi": "<b>חית הארץ אתכם.<\/b> הֵם הַמִּתְהַלְּכִים עִם הַבְּרִיּוֹת:<br><br><b>מכל יוצאי התבה.<\/b> לְהָבִיא שְׁקָצִים וּרְמָשִׂים:<br><br><b>חית הארץ.<\/b> לְהָבִיא הַמַּזִּיקִין, שֶׁאֵינָן בִּכְלַל הַחַיָּה אֲשֶׁר אִתְּכֶם, שֶׁאֵין הִלּוּכָן עִם הַבְּרִיוֹת:", "rashi_en": "חית הארץ אתכם AND EVERY ANIMAL OF THE EARTH WITH YOU or, THAT ARE WITH YOU — those which go about with human beings.<br><br>מכל יוצאי התבה OF ALL THAT GO OUT OF THE ARK — These words would include creeping things and reptiles.<br><br>חית הארץ [EVEN EVERY] BEAST OF THE EARTH — These words are intended to include dangerous animals which cannot be included in the above description, “every living creature that is with you” — for these do not go about with human beings. "}, {"ch": 9, "v": 11, "aliyah": 5, "heb": "וַהֲקִמֹתִ֤י אֶת־בְּרִיתִי֙ אִתְּכֶ֔ם וְלֹֽא־יִכָּרֵ֧ת כׇּל־בָּשָׂ֛ר ע֖וֹד מִמֵּ֣י הַמַּבּ֑וּל וְלֹֽא־יִהְיֶ֥ה ע֛וֹד מַבּ֖וּל לְשַׁחֵ֥ת הָאָֽרֶץ׃", "onk": "וְאָקֵם יָת קְיָמִי עִמְּכוֹן וְלָא יִשְׁתֵּיצֵי כָל בִּשְׂרָא עוֹד מִמֵּי טוֹפָנָא וְלָא יְהֵי עוֹד טוֹפָנָא לְחַבָּלָא אַרְעָא:", "onk_en": "I will keep My covenant with you, that never again will all flesh be cut off by flood waters, never again will flood waters destroy the earth.", "pj": "וַאֲקַיֵים יַת קְיָימַי עִמְכוֹן וְלָא יִשְׁתֵּצֵי כָּל בִּשְרָא עוֹד מִמוֹי דְטוּבְעָנָא וְלָא יְהִי עוֹד טוּבְעָנָא לְחַבָּלָא אַרְעָא", "pj_en": "And I will establish my covenant with you, and will not again cause all flesh to perish by the waters of a flood; and there shall not again be a flood to destroy the earth.", "tj": "", "tj_en": "", "rashi": "<b>והקמותי.<\/b> אֶעֱשֶׂה קִיּוּם לִבְרִיתִי. וּמַהוּ קִיּוּמוֹ? אוֹת הַקֶּשֶׁת כְּמוֹ שֶׁמְּסַיֵּם וְהוֹלֵךְ:", "rashi_en": "והקמתי AND I WILL ESTABLISH — I will give confirmation to my covenant; and in what consists this confirmation? “The sign of the rainbow”, as it goes on explaining at the end. "}, {"ch": 9, "v": 12, "aliyah": 5, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֗ים זֹ֤את אֽוֹת־הַבְּרִית֙ אֲשֶׁר־אֲנִ֣י נֹתֵ֗ן בֵּינִי֙ וּבֵ֣ינֵיכֶ֔ם וּבֵ֛ין כׇּל־נֶ֥פֶשׁ חַיָּ֖ה אֲשֶׁ֣ר אִתְּכֶ֑ם לְדֹרֹ֖ת עוֹלָֽם׃", "onk": "וַאֲמַר יְיָ דָּא אָת קְיָם דִּי אֲנָא יָהֵב בֵּין <b>מֵימְרִי<\/b> וּבֵינֵיכוֹן וּבֵין כָּל נַפְשָׁא חַיְתָא דִּי עִמְּכוֹן לְדָרֵי עַלְמָא:", "onk_en": "Elohim said, This is the sign of the covenant that I pledge between Myself [<b>My Word<\/b>] and you, and between every living creature that is with you, for the generations of all time.", "pj": "וַאֲמַר יְיָ דָא אַת קַיָימָא דַאֲנָא מְקַיֵים בֵּין מֵימְרִי וּבֵינֵיכוֹן וּבֵין כָּל נַפְשַׁת חַיְתָא דְעִמְכוֹן לְדָרֵי עַלְמָא", "pj_en": "And the Lord said, This is the sign of the covenant which I establish between My Word and between you and every living soul that is with you, unto the generations of the world.", "tj": "", "tj_en": "", "rashi": "<b>לדרת עולם.<\/b> נִכְתַּב חָסֵר, שֶׁיֵּשׁ דּוֹרוֹת שֶׁלֹּא הֻצְרְכוּ לְאוֹת לְפִי שֶׁצַּדִּיקִים גְּמוּרִים הָיוּ, כְּמוֹ דּוֹרוֹ שֶׁל חִזְקִיָּהוּ מֶלֶךְ יְהוּדָה וְדוֹרוֹ שֶׁל רַבִּי שִׁמְעוֹן בֶּן יוֹחַאי (ב\"ר):", "rashi_en": "לדרת עולם FOR GENERATIONS FOR EVER — The word לדרת “for generations” is written defective (without Vav) (implying that the sign will be necessary only for such generations as are “defective’’ in faith) because there will be some generations which will require no sign since they were completely righteous, such as the generation of Hezekiah, king of Judah, and the generation of R. Simeon ben Yochai (Genesis Rabbah 35:2). "}, {"ch": 9, "v": 13, "aliyah": 5, "heb": "אֶת־קַשְׁתִּ֕י נָתַ֖תִּי בֶּֽעָנָ֑ן וְהָֽיְתָה֙ לְא֣וֹת בְּרִ֔ית בֵּינִ֖י וּבֵ֥ין הָאָֽרֶץ׃", "onk": "יָת קַשְׁתִּי יְהָבִית בַּעֲנָנָא וּתְהִי לְאָת קְיָם בֵּין <b>מֵימְרִי<\/b> וּבֵין אַרְעָא:", "onk_en": "I have set My [rain] bow in the clouds, and it shall be a sign of the covenant between Myself [<b>My Word<\/b>] and the earth.", "pj": "יַת קַשְׁתִּי יְהָבִית בַּעֲנָנָא וּתְהֵי לְסִימָן קְיַים בֵּין מֵימְרִי וּבֵינֵי אַרְעָא", "pj_en": "I have set My Bow in the cloud, and it shall be for a token of the covenant between My Word and the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 14, "aliyah": 5, "heb": "וְהָיָ֕ה בְּעַֽנְנִ֥י עָנָ֖ן עַל־הָאָ֑רֶץ וְנִרְאֲתָ֥ה הַקֶּ֖שֶׁת בֶּעָנָֽן׃", "onk": "וִיהִי בַּעֲנָנוּתִי עֲנָנָא עַל אַרְעָא וְתִתְחֲזֵי קַשְׁתָּא בַּעֲנָנָא:", "onk_en": "At a time when I bring clouds over the earth, the [rain] bow will be seen in the clouds.", "pj": "וִיהֵי כַּד אֶפְרוֹס עֲנָנֵי יְקָרָא עֲלוֹי אַרְעָא וְתִתְחַמֵי קַשְׁתָּא בִּימָמָא עַד לָא יִטְמַע שִׁמְשָׁא בַּעֲנָנָא", "pj_en": "And it shall be that when I spread forth My glorious cloud over the earth, the bow shall be seen in the day (time), while the sun is not sunk (or hidden) in a cloud.", "tj": "", "tj_en": "", "rashi": "<b>בענני ענן.<\/b> כְּשֶׁתַּעֲלֶה בְמַחֲשָׁבָה לְפָנַי לְהָבִיא חֹשֶׁךְ וַאֲבַדּוֹן לָעוֹלָם:", "rashi_en": "בענני ענן WHEN I BRING A CLOUD — When I have it in mind to bring darkness and destruction upon the world. "}, {"ch": 9, "v": 15, "aliyah": 5, "heb": "וְזָכַרְתִּ֣י אֶת־בְּרִיתִ֗י אֲשֶׁ֤ר בֵּינִי֙ וּבֵ֣ינֵיכֶ֔ם וּבֵ֛ין כׇּל־נֶ֥פֶשׁ חַיָּ֖ה בְּכׇל־בָּשָׂ֑ר וְלֹֽא־יִֽהְיֶ֨ה ע֤וֹד הַמַּ֙יִם֙ לְמַבּ֔וּל לְשַׁחֵ֖ת כׇּל־בָּשָֽׂר׃", "onk": "וּדְכִירְנָא יָת קְיָמִי דִּי בֵין <b>מֵימְרִי<\/b> וּבֵינֵיכוֹן וּבֵין כָּל נַפְשָׁא חַיְתָא בְּכָל בִּשְׂרָא וְלָא יְהֵא עוֹד מַיָּא לְטוֹפָנָא לְחַבָּלָא כָל בִּשְׂרָא:", "onk_en": "I shall remember My covenant that is between Myself [<b>My Word<\/b>] and you, and between every living soul in all flesh, that never again will flood waters destroy all flesh.", "pj": "וּדְכִירְנָא יַת קְיָימִי דְבֵין מֵימְרִי וּבֵינֵיכוֹן וּבֵין כָּל נַפְשַׁת חַיְתָא בְּכָל בִּיסְרָא וְלָא יְהִי תּוּב מַיָא לְטוּבְעָנָא לְחַבָּלָא כָּל בִּישְרָא", "pj_en": "And I will remember My covenant which is between My Word and between you and every living soul of all flesh, that there shall not be the waters of a flood to destroy all flesh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 16, "aliyah": 5, "heb": "וְהָיְתָ֥ה הַקֶּ֖שֶׁת בֶּֽעָנָ֑ן וּרְאִיתִ֗יהָ לִזְכֹּר֙ בְּרִ֣ית עוֹלָ֔ם בֵּ֣ין אֱלֹהִ֔ים וּבֵין֙ כׇּל־נֶ֣פֶשׁ חַיָּ֔ה בְּכׇל־בָּשָׂ֖ר אֲשֶׁ֥ר עַל־הָאָֽרֶץ׃", "onk": "וּתְהֵי קַשְׁתָּא בַּעֲנָנָא וְאֵחֲזִנַּהּ לְמִדְכַּר קְיַם עָלָם בֵּין <b>מֵימְרָא<\/b> דַיְיָ וּבֵין כָּל נַפְשָׁא חַיְתָא בְּכָל בִּשְׂרָא דִּי עַל אַרְעָא:", "onk_en": "The [rain]bow shall be in the clouds, and I will see it to remember the eternal covenant between [<b>the Word of<\/b>] Elohim and between every living soul that is in all flesh that is on the earth.", "pj": "וּתְהִי קַשְׁתָּא בַּעֲנָנָא וְאַחְמִינָהּ לְמִדְכַּר קְיַים עֲלַם בֵּין מֵימְרָא דַיְיָ וּבֵין כָּל נַפְשַׁת חַיְיתָא בְּכָל בִּסְרָא דְעַל אַרְעָא", "pj_en": "And the bow shall be in the cloud, and I will look upon it, to remember the everlasting covenant between the Word of the Lord and every living soul of all flesh that is upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>בין אלהים ובין כל נפש חיה.<\/b> בֵּין מִדַּת הַדִּין שֶׁל מַעְלָה וּבֵינֵיכֶם, שֶׁהָיָה לוֹ לִכְתֹּב בֵּינִי וּבֵין כָּל נֶפֶשׁ חַיָּה, אֶלָּא זֶהוּ מִדְרָשׁוֹ כְּשֶׁתָּבֹא מִדַּת הַדִּין לְקַטְרֵג עֲלֵיכֶם לְחַיֵּב אֶתְכֶם, אֲנִי רוֹאֶה אֶת הָאוֹת וְנִזְכָּר:", "rashi_en": "בין אלהים ובין כל נפש חיה BETWEEN GOD AND EVERY LIVING SOUL — Between Divine Justice and you; for otherwise it should have written “between Me and every living thing”. But this is its explanation: when Justice will come to accuse and condemn you I will look upon the sign and remember the covenant (see Genesis Rabbah 35:3). "}, {"ch": 9, "v": 17, "aliyah": 5, "heb": "וַיֹּ֥אמֶר אֱלֹהִ֖ים אֶל־נֹ֑חַ זֹ֤את אֽוֹת־הַבְּרִית֙ אֲשֶׁ֣ר הֲקִמֹ֔תִי בֵּינִ֕י וּבֵ֥ין כׇּל־בָּשָׂ֖ר אֲשֶׁ֥ר עַל־הָאָֽרֶץ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר יְיָ לְנֹחַ דָּא אָת קְיָם דִּי אֲקֵמִית בֵּין <b>מֵימְרִי<\/b> וּבֵין כָּל בִּשְׂרָא דִּי עַל אַרְעָא:", "onk_en": "Elohim said to Noach, This is the sign of the covenant that I have established between Myself [<b>My Word<\/b>] and between all flesh that is on the earth.", "pj": "וַאֲמַר יְיָ לְנחַ דָא אָת קְיַים דְקַיְימִית בֵּין מֵימְרִי וּבֵין מֵימַר כָּל בִּסְרָא דְעַל אַרְעָא", "pj_en": "And the Lord said to Noah, This is the sign of the covenant that I have covenanted between My Word and between the word for all flesh that is upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>זאת אות הברית.<\/b> הֶרְאָהוּ הַקֶּשֶׁת וְאָמַר לוֹ הֲרֵי הָאוֹת שֶׁאָמַרְתִּי:", "rashi_en": "זאת אות הברית THIS IS THE SIGN OF THE COVENANT — He pointed to the rainbow, and said to him, “This is the sign of which I have spoken.” "}, {"ch": 9, "v": 18, "aliyah": 6, "heb": "וַיִּֽהְי֣וּ בְנֵי־נֹ֗חַ הַיֹּֽצְאִים֙ מִן־הַתֵּבָ֔ה שֵׁ֖ם וְחָ֣ם וָיָ֑פֶת וְחָ֕ם ה֖וּא אֲבִ֥י כְנָֽעַן׃", "onk": "וַהֲווֹ בְנֵי נֹחַ דִּי נְפָקוּ מִן תֵּבוֹתָא שֵׁם וְחָם וָיָפֶת וְחָם הוּא אֲבוּהִי דִכְנָעַן:", "onk_en": "The sons of Noach, who went out of the ark were Sheim, Yafes and Cham; Cham was the father of Canaan.", "pj": "וַהֲווֹ בְנֵי נחַ דִנְפָקוּ מִן תֵּיבוּתָא שֵׁם וְחָם וְיָפֶת וְחָם הוּא אֲבוֹי דִכְנָעַן", "pj_en": "And the sons of Noah who went forth from the ark were Shem, Cham, and Japhet; and Cham is the father of Kenaan.", "tj": "", "tj_en": "", "rashi": "<b>וחם הוא אבי כנען.<\/b> לָמָּה הֻצְרַךְ לוֹמַר כָּאן? לְפִי שֶׁהַפָּרָשָׁה עֲסוּקָה וּבָאָה בְּשִׁכְרוּתוֹ שֶׁל נֹחַ שֶׁקִּלְקֵל בָּה חָם וְעַל יָדוֹ נִתְקַלֵּל כְּנַעַן, וַעֲדַיִן לֹא כָתַב תּוֹלְדוֹת חָם, וְלֹא יָדַעְנוּ שֶׁכְּנַעַן בְּנוֹ – לְפִיכָךְ הֻצְרַךְ לוֹמַר כָּאן וְחָם הוּא אֲבִי כְנָעַן:", "rashi_en": "וחם הוא אבי כנען AND HAM IS THE FATHER OF CANAAN — Why is it necessary to mention this here? Because this section goes on to deal with the account of Noah’s drunkenness when Ham sinned and through him Canaan was cursed. Now as the generations of Ham have not yet been mentioned and we therefore would not know that Canaan was his son, it was necessary to state here that “Ham is the father of Canaan”. "}, {"ch": 9, "v": 19, "aliyah": 6, "heb": "שְׁלֹשָׁ֥ה אֵ֖לֶּה בְּנֵי־נֹ֑חַ וּמֵאֵ֖לֶּה נָֽפְצָ֥ה כׇל־הָאָֽרֶץ׃", "onk": "תְּלָתָא אִלֵּין בְּנֵי נֹחַ וּמֵאִלֵּין <b>אִתְבַּדָּרוּ<\/b> כָּל אַרְעָא:", "onk_en": "These three were the sons of Noach, and from these, the whole world developed [<b>was spread out<\/b>].", "pj": "תְּלָתָא אִלֵין בְּנוֹי דְנחַ וּמֵאִילֵין אִתְבְּדָרוּ לְמֵיתַב בְּכָל אַרְעָא", "pj_en": "These are the three sons of Noah, and from them they were spread abroad to dwell in all the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 20, "aliyah": 6, "heb": "וַיָּ֥חֶל נֹ֖חַ אִ֣ישׁ הָֽאֲדָמָ֑ה וַיִּטַּ֖ע כָּֽרֶם׃", "onk": "וְשָׁרֵי נֹחַ גְּבַר <b>פָּלַח בְּאַרְעָא<\/b> וּנְצִיב כַּרְמָא:", "onk_en": "Noach began to be a man of the soil [<b>a man who worked the land<\/b>] and he planted a vineyard.", "pj": "וּשְׁרֵי נחַ לְמֶהֱוֵי גְבַר פְּלַח בְּאַרְעָא וְאַשְׁכַּח גוּפְנָא דְמוֹשְׁכֵיהּ נַהֲרָא מִן גִינוּנִיתָא דְעֵדֶן וְנַצְבֵיהּ לְכַרְמָא וּבֵיהּ בְּיוֹמָא אֲנֵיצַת וּבְשִׁילַת עִנְבִין וְעַצְרִינוּן", "pj_en": "And Noah began to be a man working in the earth. And he found a vine which the river had brought away from the garden of Eden; and he planted it in a vineyard, and it flourished in a day; and its grapes became ripe, and he pressed them out.", "tj": "וּשְׁרֵי נחַ גַבְרָא צַדִיקַיָא לְמֶהֱוֵי וּנְצִיב כַּרְמָא:", "tj_en": "And Noah began to be a righteous man, and he planted a vineyard.", "rashi": "<b>ויחל.<\/b> עָשָׂה עַצְמוֹ חֻלִּין, שֶׁהָיָה לוֹ לַעֲסֹק תְּחִלָּה בִּנְטִיעָה אַחֶרֶת (ב\"ר):<br><br><b>איש האדמה.<\/b> אֲדוֹנֵי הָאֲדָמָה כְּמוֹ אִישׁ נָעֳמִי (רות א'):<br><br><b>ויטע כרם.<\/b> כְּשֶׁנִּכְנַס לַתֵּבָה הִכְנִיס עִמּוֹ זְמוֹרוֹת וְיִחוּרֵי תְאֵנִים (ב\"ר):", "rashi_en": "ויחל [AND NOAH] BEGAN — (The word may be connected also with a root meaning “profane”) He profaned (degraded) himself, for he should have occupied himself first with planting something different (Genesis Rabbah 36:3).<br><br>איש האדמה A MAN OF THE GROUND — The master (owner, lord) of the ground; similar to Ruth 1:3 איש נעמי “The husband (lord) of Naomi”.<br><br>ויטע כרם AND HE PLANTED A VINEYARD — When he went into the Ark he had taken with him vine-branches and shoots of fig trees (Genesis Rabbah 36:3). "}, {"ch": 9, "v": 21, "aliyah": 6, "heb": "וַיֵּ֥שְׁתְּ מִן־הַיַּ֖יִן וַיִּשְׁכָּ֑ר וַיִּתְגַּ֖ל בְּת֥וֹךְ אׇהֳלֹֽה׃", "onk": "וּשְׁתִי מִן חַמְרָא וּרְוִי וְאִתְגְּלִי בְּגוֹ מַשְׁכְּנֵיהּ:", "onk_en": "He drank of the wine and was intoxicated. He [then] uncovered himself in his tent.", "pj": "וְשָׁתֵי מִן חַמְרָא וְרָוֵי וְאִתְעַרְטַל בְּגוֹ מַשְׁכְּנֵיהּ", "pj_en": "And he drank of the wine and was drunken; and he made himself naked in the midst of his tent.", "tj": "", "tj_en": "", "rashi": "<b>ויתגל.<\/b> לְשׁוֹן וַיִּתְפַּעֵל:<br><br><b>אהלה.<\/b> אהלה כְּתִיב, רֶמֶז לְי' שְׁבָטִים שֶׁנִּקְרְאוּ עַל שֵׁם שׁוֹמְרוֹן, שֶׁנִּקְרֵאת אָהֳלָה שֶׁגָּלוּ עַל עִסְקֵי הַיַּיִן שֶׁנֶּאֱמַר הַשֹּׁתִים בְּמִזְרְקֵי יַיִן (עמוס ו'):", "rashi_en": "ויתגל AND HE UNCOVERED HIMSELF — This is the Hithpael form.<br><br>אהלה HIS TENT — This word is written אהלה (with ה at end instead of ו) so that it may be regarded as an allusion to the ten tribes who were spoken of as Samaria which was called “אהלה” Ohala and who were exiled because of indulgence in wine, at it is said (Amos 6:6) ‘‘that drink wine in bowls”. "}, {"ch": 9, "v": 22, "aliyah": 6, "heb": "וַיַּ֗רְא חָ֚ם אֲבִ֣י כְנַ֔עַן אֵ֖ת עֶרְוַ֣ת אָבִ֑יו וַיַּגֵּ֥ד לִשְׁנֵֽי־אֶחָ֖יו בַּחֽוּץ׃", "onk": "וַחֲזָא חָם אֲבוּהִי דִכְנַעַן יָת עֶרְיְתָא דַאֲבוּהִי וְחַוִּי לִתְרֵין אֲחוֹהִי <b>בְּשׁוּקָא<\/b>:", "onk_en": "Cham the father of Canaan saw the nakedness of his father, and told it to his brothers [who were] Outside [<b>in the marketplace<\/b>].", "pj": "וַחֲמָא חָם אֲבוֹי דִכְנָעַן יַת עֶרְיְיתָא דַאֲבוֹי וְחַוֵי לִתְרֵי אֲחוֹהִי בְּשׁוֹקָא", "pj_en": "And Cham, the father of Kenaan, beheld the nakedness of his father, and showed to his brethren without.", "tj": "", "tj_en": "", "rashi": "<b>וירא חם אבי כנען.<\/b> יֵשׁ מֵרַבּוֹתֵינוּ אוֹמְרִים כְּנַעַן רָאָה וְהִגִּיד לְאָבִיו, לְכָךְ הֻזְכַּר עַל הַדָּבָר וְנִתְקַלֵּל (ב\"ר):<br><br><b>וירא את ערות אביו.<\/b> יֵשׁ אוֹמְרִים סֵרְסוֹ וְיֵשׁ אוֹמְרִים רְבָעוֹ (סנה' ע'):", "rashi_en": "וירא חם אבי כנען AND HAM THE FATHER OF CANAAN SAW — Some of our Rabbis say that Canaan saw it and told his father about it, and on that account he is mentioned in connection with this matter and was cursed (Genesis Rabbah 36:7). <br><br>וירא את ערות אביו AND HE SAW HIS FATHER'S NAKEDNESS — Some say that he castrated him and some say that he sodomized him (Sanhedrin 70a)."}, {"ch": 9, "v": 23, "aliyah": 6, "heb": "וַיִּקַּח֩ שֵׁ֨ם וָיֶ֜פֶת אֶת־הַשִּׂמְלָ֗ה וַיָּשִׂ֙ימוּ֙ עַל־שְׁכֶ֣ם שְׁנֵיהֶ֔ם וַיֵּֽלְכוּ֙ אֲחֹ֣רַנִּ֔ית וַיְכַסּ֕וּ אֵ֖ת עֶרְוַ֣ת אֲבִיהֶ֑ם וּפְנֵיהֶם֙ אֲחֹ֣רַנִּ֔ית וְעֶרְוַ֥ת אֲבִיהֶ֖ם לֹ֥א רָאֽוּ׃", "onk": "וּנְסֵיב שֵׁם וָיֶפֶת יָת כְּסוּתָא וְשַׁוִּיוּ עַל כְּתַף תַּרְוֵיהוֹן וַאֲזָלוּ מְחַזְּרִין וַחֲפִיאוּ יָת עֶרְיְתָא דַאֲבוּהוֹן וְאַפֵּיהוֹן מְחַזְּרִין וְעֶרְיְתָא דַאֲבוּהוֹן לָא חֲזוֹ:", "onk_en": "Sheim and Yafes took the cloak, placed it on their shoulders, and walked backwards, covering the nakedness of their father. They faced away from him, and did not see the nakedness of their father.", "pj": "וּנְסֵב שֵׁם וְיֶפֶת יַת אִסְטְלָא וְשַׁוִיוּ עַל כְּתַף תַּרְוֵיהוֹן וְאָזְלוּ מְאַחְזַרְיָן וְכַסִיאוּ יַת עִירְיְיתָא דַאֲבוּהוֹן וְאַפֵּיהוֹם מֵאַחְזְרִין וְעֶרְיְתָא דַאֲבוּהוֹן לָא חָמוּן", "pj_en": "And Shem and Japhet took a mantle, and bare it upon the shoulders of each, and went backward, and covered the nakedness of their father; and their faces were turned back, and the nakedness of their father they did not behold.", "tj": "", "tj_en": "", "rashi": "<b>ויקח שם ויפת.<\/b> אֵין כְּתִיב וַיִּקְחוּ, אֶלָּא וַיִּקַּח – לִמֵּד עַל שֵׁם שֶׁנִּתְאַמֵּץ בַּמִּצְוָה יוֹתֵר מִיֶּפֶת, לְכָךְ זָכוּ בָנָיו לְטַלִּית שֶׁל צִיצִית, וְיֶפֶת זָכָה לִקְבוּרָה לְבָנָיו, שֶׁנֶאֱמַר אֶתֵּן לְגוֹג מְקוֹם שָׁם קֶבֶר (יחזקאל ל\"ט), וְחָם שֶׁבִּזָּה אֶת אָבִיו נֶאֱמַר בְּזַרְעוֹ כֵּן יִנְהַג מֶלֶךְ אַשּׁוּר אֶת שְׁבִי מִצְרַיִם וְאֶת גָּלוּת כּוּשׁ נְעָרִים וּזְקֵנִים עָרוֹם וְיָחֵף וַחֲשׂוּפַי שֵׁת וְגוֹ' (ישעיהו כ'):<br><br><b>ופניהם אחורנית.<\/b> לָמָּה נֶאֱמַר פַּעַם שְׁנִיָּה? מְלַמֵּד שֶׁכְּשֶׁקָּרְבוּ אֶצְלוֹ וְהֻצְרְכוּ לַהֲפֹךְ עַצְמָם לְכַסּוֹתוֹ הָפְכוּ פְנֵיהֶם אֲחוֹרַנִּית:", "rashi_en": "ויקח שם ויפת AND SHEM AND JAPHETH TOOK — (literally, “And Shem took and Japheth”) It is not written here ויקחו ‘‘And they took”, but ויקח “And he took”, in order to teach regarding Shem that he devoted himself to this duty with more eagerness than Japheth. Therefore have Shem’s sons received the privilege of wearing the cloak that has fringes, and the sons of Japheth were privileged to receive honorable burial, as it is said, (Ezekiel 39:11) “I will give unto Gog (a descendant of Japheth) a place fit for burial [in Israel]”. But as for Ham who despised his father — of his descendants it is said (Isaiah 20:4) “So shall the king of Assyria lead away the captives of Egypt, and the exiles of Ethiopia (these were peopled by the children of Ham) young and old, naked and barefoot and with buttocks uncovered etc.” (Genesis Rabbah 36:6 and Tanchuma 1:2:15).<br><br>ופניהם אחורנית AND THEIR FACES WERE BACKWARD — Wherefore is it written a second time (that they turned themselves backward)? It is to tell us that when they came near to him and it was necessary for them to turn round in order to cover him they kept their faces turned away (Genesis Rabbah 36:6). "}, {"ch": 9, "v": 24, "aliyah": 6, "heb": "וַיִּ֥יקֶץ נֹ֖חַ מִיֵּינ֑וֹ וַיֵּ֕דַע אֵ֛ת אֲשֶׁר־עָ֥שָׂה ל֖וֹ בְּנ֥וֹ הַקָּטָֽן׃", "onk": "וְאִתְּעַר נֹחַ מֵחַמְרֵיהּ וִידַע יָת דִּי עֲבַד לֵיהּ בְּרֵיהּ זְעֵירָא:", "onk_en": "Noach awoke from his wine [induced sleep] and he realized what had been done to him by his youngest son.", "pj": "וְאִתְעַר נחַ מִן חַמְרֵיהּ וִידַע בְּאִשְׁתָּעוֹת חֶלְמָא יַת דְעָבַד לֵיהּ חָם בְּרֵיהּ דְהוּא קָלִיל בִּזְכוּתָא דְגָרַם לֵיהּ דְלָא יוֹלִיד בַּר רְבִיעָיֵי", "pj_en": "And Noach awoke from his wine, and knew, by the relation of a dream, what had been done to him by Cham his son, who was inferior in worth, on the account that he had not begotten a fourth son.", "tj": "", "tj_en": "", "rashi": "<b>בנו הקטן.<\/b> הַפָּסוּל וְהַבָּזוּי, כְּמוֹ הִנֵּה קָטֹן נְתַתִּיךָ בַּגּוֹיִם בָּזוּי בָּאָדָם (ירמיה מ\"ט):", "rashi_en": "בנו הקטן HIS YOUNGER SON — The unworthy and despicable one, as (Jeremiah 49:15) “For, behold, I make thee small (קטן) among the nations, and despised among men\" (Genesis Rabbah 36:7). "}, {"ch": 9, "v": 25, "aliyah": 6, "heb": "וַיֹּ֖אמֶר אָר֣וּר כְּנָ֑עַן עֶ֥בֶד עֲבָדִ֖ים יִֽהְיֶ֥ה לְאֶחָֽיו׃", "onk": "וַאֲמַר לִיט כְּנָעַן עֶבֶד פָּלַח עַבְדִין יְהֵי לַאֲחוֹהִי:", "onk_en": "He said, Cursed is Canaan. A slave of slaves shall he be to his brothers.", "pj": "וַאֲמַר לִיט כְּנָעַן דְהוּא בְּרֵיהּ רְבִיעָיֵי עֲבִיד מְשַׁעֲבֵּד יְהִי לְאָחוֹי", "pj_en": "And he said, Accursed is Kenaan who is his fourth son, a serving servant shall he be to his brethren.", "tj": "", "tj_en": "", "rashi": "<b>ארור כנען.<\/b> אַתָּה גָרַמְתָּ לִי שֶׁלֹּא אוֹלִיד בֵּן רְבִיעִי אַחֵר לְשַׁמְּשֵׁנִי, אָרוּר בִּנְךָ רְבִיעִי לִהְיוֹת מְשַׁמֵּשׁ אֶת זַרְעָם שֶׁל אֵלּוּ הַגְּדוֹלִים, שֶׁהוּטַל עֲלֵיהֶם טֹרַח עֲבוֹדָתִי מֵעַתָּה. וּמָה רָאָה חָם שֶׁסֵּרְסוֹ? אָמַר לָהֶם לְאֶחָיו אָדָם הָרִאשׁוֹן שְׁנֵי בָנִים הָיוּ לוֹ, וְהָרַג זֶה אֶת זֶה בִּשְׁבִיל יְרֻשַּׁת הָעוֹלָם, וְאָבִינוּ יֵשׁ לוֹ ג' בָּנִים וְעוֹדֶנּוּ מְבַקֵּשׁ בֵּן רְבִיעִי:", "rashi_en": "ארור כנען CURSED BE CANAAN — You have brought it about that I cannot beget a fourth son to serve me; cursed, therefore, be your fourth son (see Chap. 10:6) to serve under the descendants of these elder ones upon whom the duty of serving me will devolve from now on. Why did Ham maltreat him in this manner? He said to his brothers, “Adam Harishon had two sons and one killed the other in order that he might possess the whole world(Genesis Rabbah 36:7): our father already has three sons, and he wishes to have yet another “. "}, {"ch": 9, "v": 26, "aliyah": 6, "heb": "וַיֹּ֕אמֶר בָּר֥וּךְ יְהֹוָ֖ה אֱלֹ֣הֵי שֵׁ֑ם וִיהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽמוֹ׃", "onk": "וַאֲמַר בְּרִיךְ יְיָ אֱלָהֵהּ דְּשֵׁם וִיהֵי כְנַעַן עַבְדָא לְהוֹן:", "onk_en": "He then said, Blessed is Adonoy, God of Sheim; may Canaan be his slave.", "pj": "וַאֲמַר בְּרִיךְ יְיָ אֱלָהָא דְשֵׁם דַעֲבִידְתֵּיהּ צַדִיקָא וּבְגִין יֶהֱוֵי כְּנָעַן עֲבִיד לֵיהּ", "pj_en": "And he said, Blessed be the Lord, the God of Shem, whose work is righteous; and therefore shall Kenaan be servant unto him.", "tj": "", "tj_en": "", "rashi": "<b>ברוך ה' אלהי שם.<\/b> שֶׁעָתִיד לִשְׁמֹר הַבְטָחָתוֹ לְזַרְעוֹ, לָתֵת לָהֶם אֶת אֶרֶץ כְּנַעַן:<br><br><b>ויהי.<\/b> לָהֶם כְּנַעַן לְמַס עוֹבֵד:", "rashi_en": "ברוך ה' אלהי שם BLESSED BE THE ETERNAL, THE GOD OF SHEM, who will in days to come carry out his promise to his descendants to give them the land of Canaan.<br><br>ויהי AND MAY HE BE — Canaan — their servant serving and paying tribute (Cp. Josh. 16:10)."}, {"ch": 9, "v": 27, "aliyah": 6, "heb": "יַ֤פְתְּ אֱלֹהִים֙ לְיֶ֔פֶת וְיִשְׁכֹּ֖ן בְּאׇֽהֳלֵי־שֵׁ֑ם וִיהִ֥י כְנַ֖עַן עֶ֥בֶד לָֽמוֹ׃", "onk": "יַפְתֵּי יְיָ לְיֶפֶת וְיַשְׁרֵי <b>שְׁכִינְתֵּיהּ<\/b> בְּמַשְׁכְּנֵיהּ דְּשֵׁם וִיהֵי כְנַעַן עַבְדָא לְהוֹן:", "onk_en": "Elohim will enlarge Yefes, but He [<b>His Shechina<\/b>] will dwell in the tents of Sheim, and Canaan will be their slave.", "pj": "יַשְׁפַּר יְיָ תְּחוּמֵיהּ דְיֶפֶת וְיִתְגַיְירוּן בְּנוֹי וְיִשְׁרוּן בְּמֶדְרָשָׁא דְשֵׁם וִיהֵי כְנָעַן עֲבִיד לְהוֹן", "pj_en": "The Lord shall beautify the borders of Japhet, and his sons shall be proselyted and dwell in the schools of Shem, and Kenaan shall be a servant to them.", "tj": "", "tj_en": "", "rashi": "<b>יפת אלהים ליפת.<\/b> מְתֻרְגָּם יַפְתֵּי, יַרְחִיב:<br><br><b>וישכן באהלי שם.<\/b> יַשְׁרֶה שְׁכִינָתוֹ בְּיִשְׂרָאֵל. וּמִדְרַשׁ חֲכָמִים אַעַ\"פִּ שֶׁיַּפְתְּ אֱלֹהִים לְיֶפֶת – שֶׁבָּנָה כֹּרֶשׁ, שֶׁהָיָה מִבְּנֵי יֶפֶת, בַּיִת שֵׁנִי – לֹא שָׁרְתָה בּוֹ שְׁכִינָה; וְהֵיכָן שָׁרְתָה? בְּמִקְדָשׁ רִאשׁוֹן שֶׁבָּנָה שְׁלֹמֹה שֶׁהָיָה מִבְּנֵי שֵׁם:<br><br><b>ויהי כנען עבד למו.<\/b> אַף מִשֶּׁיִּגְלוּ בְנֵי שֵׁם יִמָּכְרוּ לָהֶם עֲבָדִים מִבְּנֵי כְּנַעַן:", "rashi_en": "יפת אלהים ליפת MAY GOD ENLARGE JAPHETH — The Targum renders the verb by יפתי meaning, “may He extend”.<br><br>וישכון באהלי שם AND MAY HE DWELL IN THE TENTS OF SHEM — may He make His Divine Presence (Shechinah) dwell in Israel. According to the Midrashic exposition of the Sages (Yoma 10a) it means: Although God enlarged Japheth inasmuch that Cyrus, who was a descendant of Japheth, built the second Temple, yet the Shechinah did not dwell in it. Where, then, did it dwell? In the first Temple which Solomon, a descendant of Shem, built.<br><br>ויהי כנען עבד למו AND MAY CANAAN BE SERVANT TO THEM — Even when the children of Shem be in exile, children of Canaan will be sold to them as slaves."}, {"ch": 9, "v": 28, "aliyah": 6, "heb": "וַֽיְחִי־נֹ֖חַ אַחַ֣ר הַמַּבּ֑וּל שְׁלֹ֤שׁ מֵאוֹת֙ שָׁנָ֔ה וַֽחֲמִשִּׁ֖ים שָׁנָֽה׃", "onk": "וַחֲיָא נֹחַ בָּתַר טוֹפָנָא תְּלַת מְאָה וְחַמְשִׁין שְׁנִין:", "onk_en": "After the Flood, Noach lived three hundred and fifty years.", "pj": "וַחֲיָא נחַ בָּתַר טוּבְעָנָא תְּלַת מְאָה וְחַמְשִׁין שְׁנִין", "pj_en": "And Noach lived after the deluge three hundred and fifty years.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 29, "aliyah": 6, "heb": "וַיִּֽהְיוּ֙<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז וַֽיְהִי֙)<\/i> כׇּל־יְמֵי־נֹ֔חַ תְּשַׁ֤ע מֵאוֹת֙ שָׁנָ֔ה וַחֲמִשִּׁ֖ים שָׁנָ֑ה וַיָּמֹֽת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲווֹ כָל יוֹמֵי נֹחַ תְּשַׁע מְאָה וְחַמְשִׁין שְׁנִין וּמִית:", "onk_en": "All the days of Noach totaled nine hundred and fifty years, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי נחַ תְּשַׁע מְאָה וְחַמְשִׁין שְׁנִין וּמִית", "pj_en": "And all the days of Noach were nine hundred and fifty years; and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 1, "aliyah": 6, "heb": "וְאֵ֙לֶּה֙ תּוֹלְדֹ֣ת בְּנֵי־נֹ֔חַ שֵׁ֖ם חָ֣ם וָיָ֑פֶת וַיִּוָּלְד֥וּ לָהֶ֛ם בָּנִ֖ים אַחַ֥ר הַמַּבּֽוּל׃", "onk": "וְאִלֵּין תּוּלְדַת בְּנֵי נֹחַ שֵׁם חָם וָיָפֶת וְאִתְיְלִידוּ לְהוֹן בְּנִין בָּתַר טוֹפָנָא:", "onk_en": "These are the histories of Noach’s sons, Sheim, Cham and Yafes. Children were born to them after the Flood.", "pj": "אִלֵין תּוּלְדַת בְּנוֹי דְנחַ וְאִיתְיְלִידוּ לְהוֹן בְּנִין בָּתַר טוּבְעָנָא", "pj_en": "These are the generations of the sons of Noach, and (of the) sons (who) were born to them after the deluge.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 2, "aliyah": 6, "heb": "בְּנֵ֣י יֶ֔פֶת גֹּ֣מֶר וּמָג֔וֹג וּמָדַ֖י וְיָוָ֣ן וְתֻבָ֑ל וּמֶ֖שֶׁךְ וְתִירָֽס׃", "onk": "בְּנֵי יֶפֶת גּוֹמֶר וּמָגוֹג וּמָדַי וְיָוָן וְתוּבָל וּמֶשֶׁךְ וְתִירָס:", "onk_en": "The sons of Yafes were: Gomer, Magog, Modai, Yavan, Tuval, Meshech, and Tiras.", "pj": "בְּנוֹי דְיֶפֶת גוֹמֶר וּמָגוֹג וּמָדַי וְיָוָן וְתוּבָל וּמֶשֶׁךְ וְתִירָס וְשׁוּם אַפַּרְכְיוּתְהוֹן אַפְרִיקֵי וְגַרְמַנְיָא וְתַמְדִיֵי וּמַקֵדוֹנִיָא וְיַתִינְיָא וְאוּסְיָא וְתַרְקֵי", "pj_en": "The sons of Japheth, Gomer, and Magog, and Madai, and Javan, and Thubal, and Meshek, and Thiras. And the names of their provinces, Afriki, and Germania, and Medi, and Makadonia, and Iatinia, and Asia, and Tharki.", "tj": "בְּנוֹי דְיֶפֶת גוֹמֶר וְשׁוּם אַפַרְכָיוּתְהוֹן אַפְרִיקֵי וְגַרְמַנְיָא וּמָדַי וּמִקְדוֹנְיָא וְיֵתָנְיָא וַאֲנַסְיָא וְתַרְקֵי:", "tj_en": "The sons of Japheth, Gomer; and the name of their provinces, Afriki, and Garmania, and Madai, and Mokdonia, and Yatania, and Asia, and Tharki.", "rashi": "<b>ותירס.<\/b> זוֹ פָּרַס (ב\"ר):", "rashi_en": "ותירס AND TIRAS — This is Persia (Yoma 10a). "}, {"ch": 10, "v": 3, "aliyah": 6, "heb": "וּבְנֵ֖י גֹּ֑מֶר אַשְׁכְּנַ֥ז וְרִיפַ֖ת וְתֹגַרְמָֽה׃", "onk": "וּבְנֵי גּוֹמֶר אַשְׁכְּנַז וְרִיפַת וְתוֹגַרְמָה:", "onk_en": "The sons of Gomer were: Ashkenaz, Riphas and Togarmah.", "pj": "וּבְנוֹי דְגוֹמֶר אַשְׁכְּנַז וְרִיפַת וְתוֹגַרְמָא", "pj_en": "And the sons of Gomer, Ashkenaz, and Riphath, and Togarma.", "tj": "וּבְנוֹי דְגוֹמֶר וְשׁוּם אַפַרְכָיוּתְהוֹן אַסְיָא וּפַרְכַוָן וּבַרְבְּרִיאָה:", "tj_en": "And the sons of Gomer, and the name of their provinces, Asia and Pharkui (Phrygia?) and Barberia.", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 4, "aliyah": 6, "heb": "וּבְנֵ֥י יָוָ֖ן אֱלִישָׁ֣ה וְתַרְשִׁ֑ישׁ כִּתִּ֖ים וְדֹדָנִֽים׃", "onk": "וּבְנֵי יָוָן אֶלִישָׁה וְתַרְשִׁישׁ כִּתִּים וְדֹדָנִים:", "onk_en": "The sons of Yavan were: Elishah, Tarshish, Kittim and Dodanim.", "pj": "וּבְנוֹי דְיָוָן אֱלִישָׁה אַלַס וְטַרְסַס אַכַזְיָא וְדוֹרְדַנְיָא", "pj_en": "And the sons of Javan, Elisha, Alas, and Tarsas, Akazia, and Dordonia.", "tj": "וּבְנוֹי דְיָוָן אֱלִישָׁה וְשׁוּם אַפַרְכָיוּתְהוֹן אַלַסְטָרְסוֹם וְדוֹדַנְיָא:", "tj_en": "And the sons of Javan, Elisha, and the name of their provinces, Alastarasom, Italia, and Dordonia.", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 5, "aliyah": 6, "heb": "מֵ֠אֵ֠לֶּה נִפְרְד֞וּ אִיֵּ֤י הַגּוֹיִם֙ בְּאַרְצֹתָ֔ם אִ֖ישׁ לִלְשֹׁנ֑וֹ לְמִשְׁפְּחֹתָ֖ם בְּגוֹיֵהֶֽם׃", "onk": "מֵאִלֵּין אִתַּפְרָשׁוּ נַגְוַת עַמְמַיָּא בְּאַרְעֲהוֹן גְּבַר לְלִישָׁנֵיהּ לְזַרְעֲיָתְהוֹן בְּעַמְמֵיהוֹן:", "onk_en": "From these the nations were separated into islands, [set apart] in their own lands, each to its language, according to their families in their nations.", "pj": "מֵאִילֵן אִתְפַּרְשׁוּ גְנִיסֵי נַגְוַות עַמְמַיָא כָל חַד לְלִישְׁנֵיהּ לְיִחוּסֵיהוֹם בְּעַמְמֵיהוֹם", "pj_en": "From these were distributed the tribes of the islands of the Gentiles, every one according to his language, to his kindred in their nations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 6, "aliyah": 6, "heb": "וּבְנֵ֖י חָ֑ם כּ֥וּשׁ וּמִצְרַ֖יִם וּפ֥וּט וּכְנָֽעַן׃", "onk": "וּבְנֵי חָם כּוּשׁ וּמִצְרַיִם וּפוּט וּכְנָעַן:", "onk_en": "The sons of Cham were: Cush, Mitzraim, Put and Canaan.", "pj": "וּבְנוֹי דְחָם כּוּשׁ וּמִצְרַיִם וּפוּט וּכְנָעַן וְשׁוּם אַרְכָיוֹתְהוֹם עַרְבַיָא וּמִצְרַיִם וְאַלִיחְרוֹק וּכְנָעַן", "pj_en": "And the sons of Cham, Kush, and Mizraim, and Phut, and Kenaan. And the name of their provinces, Arabia, and Mizraim, and Alichrok, and Kenaan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 7, "aliyah": 6, "heb": "וּבְנֵ֣י כ֔וּשׁ סְבָא֙ וַֽחֲוִילָ֔ה וְסַבְתָּ֥ה וְרַעְמָ֖ה וְסַבְתְּכָ֑א וּבְנֵ֥י רַעְמָ֖ה שְׁבָ֥א וּדְדָֽן׃", "onk": "וּבְנֵי כוּשׁ סְבָא וַחֲוִילָה וְסַבְתָּה וְרַעְמָה וְסַבְתְּכָא וּבְנֵי רַעְמָה שְׁבָא וּדְדָן:", "onk_en": "The sons of Cush were: Seva, Chavilah, Savtah, Raamah, and Savtecha. The sons of Raamah were: Sheva and Dedan.", "pj": "וּבְנוֹי דְכוּשׁ סְבָא וַחֲוִילָה וְסַבְתָּ וְרַעֲמָא וְסַבְתְּכָא וְשׁוּם אַפַרְכָיוֹתְהוֹם סִינִירָאֵי וְהִנְדְקִי וּסְמִידָאֵי וְלוּבָּאֵי וְזִינְגָאֵי וּבְנוֹי דִמְוָרִיטִינוֹס זִמְדְגַד וּמְזָג", "pj_en": "And the sons of Kush, Seba, and Havilah, and Sabta, and Raama, and Sabteka, and the name of their provinces, Sinirai, and Hindiki, and Semadi, and Lubai, and Zingai. And the sons of Mauritinos, Zmargad and Mezag.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 8, "aliyah": 6, "heb": "וְכ֖וּשׁ יָלַ֣ד אֶת־נִמְרֹ֑ד ה֣וּא הֵחֵ֔ל לִֽהְי֥וֹת גִּבֹּ֖ר בָּאָֽרֶץ׃", "onk": "וְכוּשׁ אוֹלִיד יָת נִמְרֹד הוּא שָׁרֵי לְמֵהֲוֵי גִבַּר <b>תַּקִּיף<\/b> בְּאַרְעָא:", "onk_en": "Cush produced [a son] Nimrod. He began to be [<b>mighty and<\/b>] powerful on earth.", "pj": "וְכוּשׁ אוֹלִיד יַת נִמְרוֹד הוּא שָׁרֵי לְמֶהֱוֵי גִבַר בְּחֶטְאָה וּלְמֵרְדָא קֳדָם יְיָ בְּאַרְעָא", "pj_en": "And Kush begat Nimrod: he began to be mighty in sin, and to rebel before the Lord in the earth.", "tj": "", "tj_en": "", "rashi": "<b>להיות גבור.<\/b> לְהַמְרִיד כָּל הָעוֹלָם עַל הַקָּבָּ\"ה בַּעֲצַת דוֹר הַפַּלָּגָה:", "rashi_en": "להיות גבור TO BE A MIGHTY ONE — Mighty in causing the whole world to rebel against the Holy One, blessed be He, by the plan he devised for the generation that witnessed the separation of the races (דור הפלגה) to build the Tower of Babel (Genesis Rabbah 23:7). "}, {"ch": 10, "v": 9, "aliyah": 6, "heb": "הֽוּא־הָיָ֥ה גִבֹּֽר־צַ֖יִד לִפְנֵ֣י יְהֹוָ֑ה עַל־כֵּן֙ יֵֽאָמַ֔ר כְּנִמְרֹ֛ד גִּבּ֥וֹר צַ֖יִד לִפְנֵ֥י יְהֹוָֽה׃", "onk": "הוּא הֲוָה <b>גִבַּר תַּקִּיף<\/b> קֳדָם יְיָ עַל כֵּן יִתְאֲמַר כְּנִמְרֹד <b>גִּבַּר תַּקִּיף<\/b> קֳדָם יְיָ:", "onk_en": "He was a mighty hunter [<b>mighty and powerful<\/b>] before Adonoy. It is therefore said, Like Nimrod, a mighty hunter [<b>mighty and powerful<\/b>] before Adonoy.", "pj": "הוּא הֲוָה גִבַּר מְרוֹדָא קֳדָם יְיָ בְּגִין כֵּן יִתְאַמֵר מִן יוֹמָא דְאִיתְבְּרִי עַלְמָא לָא הֲוָה כְּנִמְרוֹד גִבַּר בְּצֵידָא וּמְרוֹדָא קֳדָם יְיָ", "pj_en": "He was a mighty rebel before the Lord; therefore it is said, From the day that the world was created there hath not been as Nimrod, mighty in hunting, and a rebel before the Lord.", "tj": "הוּא הֲוָה גִבּוֹר בְּצַיְידָא בְּחֶטְאָה קָדָם יְיָ דַהֲוָה צַיִיד בְּנֵי אֱנָשָׁא בְּלִישַׁנְהוֹן וַאֲמַר לְהוֹן רְחוּקוּ מִן דִינוֹ דְשֵׁם וְאִדְבְּקוּ בְּדִינוֹ דְנִמְרוֹד בְּגִין כְּדֵין יִתְאַמֵר כְּנִמְרוֹד גִבָּרָא גִבַּר בְּצַדְיָא בְּחֶטְאָה קָדָם יְיָ:", "tj_en": "He was mighty in hunting and in sin before the Lord; for he was a hunter of the sons of men in their languages. And he said to them, Leave the judgments of Shem, and adhere to the judgments of Nimrod. On this account it is said, As Nimrod the mighty, mighty in hunting and in sin before the Lord.", "rashi": "<b>גבר ציד.<\/b> צָד דַּעְתָּן שֶׁל בְּרִיוֹת בְּפִיו, וּמַטְעָן לִמְרֹד בַּמָּקוֹם:<br><br><b>לפני ה'.<\/b> מִתְכַּוֵן לְהַקְנִיטוֹ עַל פָּנָיו:<br><br><b>על כן יאמר.<\/b> עַל כָּל אָדָם מַרְשִׁיעַ בְּעַזּוּת פָּנִים, יוֹדֵע רִבּוֹנוֹ וּמִתְכַּוֵּן לִמְרֹד בּוֹ, יֵאָמֵר זֶה כְּנִמְרֹד גִּבּוֹר צַיִד:", "rashi_en": "גבור ציד A MIGHTY HUNTER — He ensnared the minds of people by his words, misleading them to rebel against the Omnipresent (Genesis Rabbah 37:2).<br><br>‘לפני ה BEFORE THE LORD — intending purposely to provoke Him to His face<br><br>על כן יאמר WHEREFORE IT IS SAID — Regarding any man who brazenly acts wickedly — knowing his Master and yet of set purpose rebelling against Him — it is said. “This man is like Nimrod a mighty hunter” (Sifra, Bechukotai, Section 2 1-2). "}, {"ch": 10, "v": 10, "aliyah": 6, "heb": "וַתְּהִ֨י רֵאשִׁ֤ית מַמְלַכְתּוֹ֙ בָּבֶ֔ל וְאֶ֖רֶךְ וְאַכַּ֣ד וְכַלְנֵ֑ה בְּאֶ֖רֶץ שִׁנְעָֽר׃", "onk": "וַהֲוָה רֵישׁ מַלְכוּתֵיהּ בָּבֶל וְאֶרֶךְ וְאַכַּד וְכַלְנֵה בְּאַרְעָא דְ<b>בָבֶל<\/b>:", "onk_en": "The beginning of his kingdom was Babylon, Erech, Akad and Kalneh in the land of Shinar [<b>Babylon<\/b>].", "pj": "וַהֲוָה שְׁרוֹי מַלְכוּתֵיהּ בָּבֶל רַבְּתִי וַהֲדָס וּנְצִיבִין וּקְטִסְפּוֹן בְּאַרְעָא דְפוּנְטוֹס", "pj_en": "And the beginning of his kingdom was Bavel the Great, and Hadas, and Netsibin, and Ketispon, in the land of Pontos.", "tj": "וַהֲוַת שֵׁירוּי מַלְכוּתֵיהּ בָּבֶל וַהֲדָס וּנְצִיבִין וְקִטִיסְפוֹן בְּאַרְעָא דְבָּבֶל:", "tj_en": "And the beginning of his kingdom was Bavel, and Hadas, and Netsibin, and Katispa in the land of Bavel.", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 11, "aliyah": 6, "heb": "מִן־הָאָ֥רֶץ הַהִ֖וא יָצָ֣א אַשּׁ֑וּר וַיִּ֙בֶן֙ אֶת־נִ֣ינְוֵ֔ה וְאֶת־רְחֹבֹ֥ת עִ֖יר וְאֶת־כָּֽלַח׃", "onk": "מִן אַרְעָא (<small>נ\"א<\/small> עֵיצָה) הַהִיא <b>נְפַק אֲתוּרָאָה וּבְנָא<\/b> יָת נִינְוֵה וְיָת רְחֹבֹת (<small>נ\"א<\/small> רְחוֹבֵי) קַרְתָּא וְיָת כָּלַח:", "onk_en": "Asshur departed that land, and he built [<b>The Assyrians departed that land and built<\/b>] Nineveh, Rechovos Iyr and Kalach.", "pj": "מִן אַרְעָא הַהוּא נְפַק נִמְרוֹד וּמְלַךְ בְּאַתּוּר דְלָא בְּעָא לְמֶהֱוֵי בְּעֵטַת דָרָא דִפְלוֹגִתָּא וּשְׁבַק אַרְבַּע קוּרְיָן אִילֵן וִיהַב לֵיהּ יְיָ בְּגִין כֵּן אַתְרָא וּבְנָא אַרְבַּע קוּרְיָן אַחְרָנִין יַת נִינְוֵה וְיַת פַּלְטִאַת קַּרְתָּא וְיַת פַּרְיוֹת", "pj_en": "From that land went forth Nimrod, and reigned in Athur, because he would not be in the counsel of a divided generation. And he left those four cities; and the Lord thereupon gave him a place; and he builded four other cities, Nineveh and Pelatiath, Kartha and Parioth.", "tj": "מִן אַרְעָא הַהוּא נְפַק אֲתוֹרַיָיא וּבְנָא יַת נִינְוֵה וְיַת פְּלַטְיָיתָא דְקַרְתָּא וְיַת חַרְיָית:", "tj_en": "From that land he went out towards Athur, and builded Nineveh, and Pelatiath-Kartha, and Hadiath.", "rashi": "<b>מן הארץ וגו'.<\/b> כֵּיוָן שֶׁרָאָה אַשּׁוּר אֶת בָּנָיו שׁוֹמְעִין לְנִמְרוֹד וּמוֹרְדִין בַּמָקוֹם לִבְנוֹת הַמִּגְדָּל יָצָא מִתּוֹכָם:", "rashi_en": "‘מן הארץ וגו OUT OF THAT LAND WENT FORTH ASSHUR — As soon as Asshur saw that his sons listened to Nimrod, rebelling against the Omnipresent by building the Tower, he went forth out of their midst (Genesis Rabbah 37:4). "}, {"ch": 10, "v": 12, "aliyah": 6, "heb": "וְֽאֶת־רֶ֔סֶן בֵּ֥ין נִֽינְוֵ֖ה וּבֵ֣ין כָּ֑לַח הִ֖וא הָעִ֥יר הַגְּדֹלָֽה׃", "onk": "וְיָת רֶסֶן בֵּין נִינְוֵה וּבֵין כָּלַח הִיא קַרְתָּא רַבְּתָא:", "onk_en": "[He also built] Resen between Nineveh and Kalach. This was the great city.", "pj": "וְיַת תַּלְסַר דְמִתְבַּנְיָא בֵּינֵי נִינְוֵה וּבֵינֵי חַרְיַית אִיהִי קַרְתָּא רַבְּתָא", "pj_en": "And Talesar, which was builded between Nineveh and Hadiath; that is a great city.", "tj": "וְיַת תַּלְאָסָר בֵּין נִינְוֵה וּבֵין חַרְיַית הִיא קַרְתָּא רַבְּתָא:", "tj_en": "And Talesar, between Nineveh and Hadiath, which is a great city.", "rashi": "<b>העיר הגדלה.<\/b> הִיא נִינְוֵה שֶׁנֶּ' וְנִינְוֵה הָיְתָה עִיר גְּדוֹלָה לֵאלֹהִים (יונה ג'):", "rashi_en": "העיר הגדלה THE GREAT CITY — This refers to Nineveh (not to Calah the last mentioned city nor to Resen), as it is said (Jonah 3:3) “Now Nineveh was an exceeding great city” (Yoma 10a). "}, {"ch": 10, "v": 13, "aliyah": 6, "heb": "וּמִצְרַ֡יִם יָלַ֞ד אֶת־לוּדִ֧ים וְאֶת־עֲנָמִ֛ים וְאֶת־לְהָבִ֖ים וְאֶת־נַפְתֻּחִֽים׃", "onk": "וּמִצְרָאֵי (<small>נ\"א<\/small> וּמִצְרַיִם) אוֹלִיד יָת לוּדָאֵי וְיָת עֲנָמָאֵי וְיָת לְהָבָאֵי וְיָת נַפְתּוּחָאֵי:", "onk_en": "Mitzraim produced [the following nations]: Ludim, Anamim, Lehavim and the Naftuchim.", "pj": "וּמִצְרַיִם אוֹלִיד יַת נִיוַוטָאֵי וְיַת מַרְטִיוֹטָאֵי וְיַת לִיוַוקָאֵי וְיַת פַּנְטַסְכִּינָאֵי", "pj_en": "And Mizraim begat the Nivatee, and the Mariotee, and the Livakee, and the Pantascinee,", "tj": "וּמִצְרַיִם אוֹלִיד יַת מַרְיוֹטָאֵי וְיַת פַּנְטְפּוֹלִיטָאֵי וְיַת לוֹסְטָאַי:", "tj_en": "And Mizraim begat the Mariotaee, and Pentepolitaee, and Lusetaee,", "rashi": "<b>להבים.<\/b> שֶׁפְּנֵיהֶם דּוֹמִים לְלַהַב:", "rashi_en": "להבים LEHABIM — So called because their faces were fiery as a flame."}, {"ch": 10, "v": 14, "aliyah": 6, "heb": "וְֽאֶת־פַּתְרֻסִ֞ים וְאֶת־כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִשָּׁ֛ם פְּלִשְׁתִּ֖ים וְאֶת־כַּפְתֹּרִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיָת פַּתְרוּסָאֵי וְיָת כַּסְלוּחָאֵי דִּי נְפָקוּ מִתַּמָּן פְּלִשְׁתָּאֵי וְיָת <b>קַפּוּטְקָאֵי<\/b>:", "onk_en": "[Also] the Pasrusim, and the Kasluchim; from whom came the Plishtim and the Kaphtorim [<b>Kaputkim<\/b>].", "pj": "וְיַת נַסְיוֹטָאֵי וְיַת פַּנְטְפּוֹלוֹטָאֵי דִנְפָקוּ מִתַּמָן פְּלִישְׁתָּאֵי וְיַת קַפּוּדְקָאֵי", "pj_en": "and the Pathrosim, and the Nasiotaee, and the Pantapolotee, from whom went forth the Philistaee and the Kaphodikaee.", "tj": "וְיַת פִּילוֹסָאֵי וְיַת פְּנַטְסַכְנָאֵי דִנְפָקוּ מִתַּמָן פְּלִישְׁתָּאֵי וְיַת קַפּוּדְקָאֵי:", "tj_en": "and Pelusaee, and the Pantaskenaee, from whom went forth the Philistaee and Kapodekaee.", "rashi": "<b>פתרסים ואת כסלחים אשר יצאו משם פלשתים.<\/b> מִשְּׁנֵיהֶם יָצְאוּ, שֶׁהָיוּ פַּתְרוּסִים וְכַסְלוּחִים מַחֲלִיפִין מִשְׁכַּב נְשׁוֹתֵיהֶם אֵלּוּ לָאֵלּוּ וְיָצְאוּ מֵהֶם פְּלִשְׁתִּים:", "rashi_en": "ואת פתרסים ואת כסלחים אשר יצאו משם פלשתים AND PATHRUSIM AND CASLUHIM OUT OF WHOM CAME PHILISTIM — They (the Philistines) were descended from both of them for the Pathrusim and the Casluhim used to live together in promiscuous intercourse, and the Philistines were their offspring (Genesis Rabbah 37:5). "}, {"ch": 10, "v": 15, "aliyah": 6, "heb": "וּכְנַ֗עַן יָלַ֛ד אֶת־צִידֹ֥ן בְּכֹר֖וֹ וְאֶת־חֵֽת׃", "onk": "וּכְנַעַן אוֹלִיד יָת צִידוֹן בָּכְרֵיהּ וְיָת חֵת:", "onk_en": "Canaan produced his first-born, Sidon, and Cheis.", "pj": "וּכְנָעַן אוֹלִיד יַת צִידוֹן בּוּכְרֵיהּ וְיַת חֵת", "pj_en": "And Kenaan begat Zidon his firstborn, and Heth,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 16, "aliyah": 6, "heb": "וְאֶת־הַיְבוּסִי֙ וְאֶת־הָ֣אֱמֹרִ֔י וְאֵ֖ת הַגִּרְגָּשִֽׁי׃", "onk": "וְיָת יְבוּסָאֵי וְיָת אֱמוֹרָאֵי וְיָת גִּרְגָּשָׁאֵי:", "onk_en": "[And] the Yevusite, the Amorite, the Girgashite,", "pj": "וְיַת יְבוּסָאֵי וְיַת אֱמוֹרָאֵי וְיַת גִרְגָשָׁאֵי", "pj_en": "and the Jebusaee, and the Emoraee, and the Gergeshaee,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 17, "aliyah": 6, "heb": "וְאֶת־הַֽחִוִּ֥י וְאֶת־הַֽעַרְקִ֖י וְאֶת־הַסִּינִֽי׃", "onk": "וְיָת חִוָּאֵי וְיָת עַרְקָאֵי וְיָת <b>אַנְתּוֹסָאֵי<\/b>:", "onk_en": "The Chivite, the Arkite, the Sinite [<b>Antosite<\/b>],", "pj": "וְיַת חִוָאֵי וְיַת עַרְקָאֵי וְיַת אַנְטוֹסָאֵי", "pj_en": "and the Hivaee, and the Irkaee, and the Antosaee,", "tj": "וְיַת טְרִיפּוֹלָאֵי וְיַת עַרְקָאֵי וְיַת כַּפְרוּסָאֵי:", "tj_en": "And the Tripolaee, and the Arkaee, and the Kaphrusaee.", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 18, "aliyah": 6, "heb": "וְאֶת־הָֽאַרְוָדִ֥י וְאֶת־הַצְּמָרִ֖י וְאֶת־הַֽחֲמָתִ֑י וְאַחַ֣ר נָפֹ֔צוּ מִשְׁפְּח֖וֹת הַֽכְּנַעֲנִֽי׃", "onk": "וְיָת אַרְוָדָאֵי וְיָת צְמָרָאֵי וְיָת חֲמָתָאֵי וּבָתַר כֵּן <b>אִתְבַּדָּרוּ<\/b> זַרְעֲיַת כְּנַעֲנָאֵי:", "onk_en": "The Arvadite, the Tzemarite, and the Chamasite. Later, the families of the Canaanites [further] developed [<b>were spread out<\/b>].", "pj": "וְיַת לוֹטְסָאֵי וְיַת חוֹמְצָאֵי וְיַת אַנְטְכוֹאֵי וּבָתַר כְּדֵין אִתְבַּדְרוּ זַרְעֲיַתְהוֹן דִכְנַעֲנָאֵי", "pj_en": "and the Lutasaee, and the Chomtsaee, and the Antekoee; and after then the seed of the Kenaanaee were scattered.", "tj": "וְיַת אַנְטְרִידִנָאֵי וְיַת חֲמִיצָאֵי וְיַת אַנְטוֹכְיָא מִן בָּבֶל מִן בָּתַר כְּדֵין אִתְפְּרָעוּ נִיסֵי אוּמַיָא:", "tj_en": "And the Antridanaee, and the Chamatsaee, and the Antukeia: from Bavel, after then, were distinguished the islands of the peoples.", "rashi": "<b>ואחר נפוצו.<\/b> מֵאֵלֶּה נָפוֹצוּ מִשְׁפָּחוֹת הַרְבֵּה:", "rashi_en": "ואחר נפוצו AND AFTERWARDS WERE SPREAD ABROAD — From these many families were spread abroad (besides those already mentioned. 5:15—18). "}, {"ch": 10, "v": 19, "aliyah": 6, "heb": "וַיְהִ֞י גְּב֤וּל הַֽכְּנַעֲנִי֙ מִצִּידֹ֔ן בֹּאֲכָ֥ה גְרָ֖רָה עַד־עַזָּ֑ה בֹּאֲכָ֞ה סְדֹ֧מָה וַעֲמֹרָ֛ה וְאַדְמָ֥ה וּצְבֹיִ֖ם עַד־לָֽשַׁע׃", "onk": "וַהֲוָה תְּחוּם כְּנַעֲנָאֵי מִצִּידוֹן מָטֵי לִגְרָר עַד עַזָּה מָטֵי לִסְדוֹם וַעֲמוֹרָה וְאַדְמָה וּצְבוֹיִם עַד לָשַׁע:", "onk_en": "The borders of the Canaanites were from Sidon toward Gerar until Gaza, toward Sedom, Amorah, Admah, and Tzevoyim, until Lasha.", "pj": "וַהֲוָא תְּחוּם כְּנַעֲנָאֵי מִן כּוֹתְנַיִים מַעֲלָךְ לִגְרָר עַד עַזָה מַעֲלָךְ לִסְדוֹם וַעֲמוֹרָה אַדְמָא וּצְבוֹיִים עַד קַלְדָהִי", "pj_en": "And the limit of the Kenaanaee was from Kothanis, going up to Gerar, unto Azah, unto Sedom and Amorah, Admah and Zeboim, unto Kaldahi.", "tj": "", "tj_en": "", "rashi": "<b>גבול הכנעני.<\/b> סוֹף אַרְצוֹ. כָּל גְּבוּל לְשׁוֹן סוֹף וְקָצֶה:<br><br><b>באכה.<\/b> שֵׁם דָּבָר. וְלִי נִרְאֶה כְּאָדָם הָאוֹמֵר לַחֲבֵרוֹ, גְּבוּל זֶה מַגִּיעַ עַד אֲשֶׁר תָּבֹא לִגְבוּל פְּלוֹנִי:", "rashi_en": "גבול הכנעני THE BOUNDARY OF THE CANAANITE means the end of his land: wherever גבול occurs it signifies end and extremity.<br><br>באכה AS THOU COMEST - This word is a noun. I think it is a colloquial expression like that used by a person who says to another: This boundary stretches until you come to such and such a boundary."}, {"ch": 10, "v": 20, "aliyah": 6, "heb": "אֵ֣לֶּה בְנֵי־חָ֔ם לְמִשְׁפְּחֹתָ֖ם לִלְשֹֽׁנֹתָ֑ם בְּאַרְצֹתָ֖ם בְּגוֹיֵהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין בְּנֵי חָם לְזַרְעֲיָתְהוֹן לְלִישָׁנְהוֹן בְּאַרְעָתְהוֹן בְּעַמְמֵיהוֹן:", "onk_en": "These are the sons of Cham according to their families, and their languages, in their lands and in their nations.", "pj": "אִילֵין בְּנוֹי דְחָם לְזַרְעִית יִחוּסֵיהֶם לְלִישַׁנְהוֹם בְּמוֹתַב אַרְעָתֵיהוֹן בִּגְנִיסַת עַמְמֵיהוֹן", "pj_en": "These are the sons of Cham, according to the seed of their genealogies, after their languages, in the dwelling of their lands, in the kindred of their people.", "tj": "", "tj_en": "", "rashi": "<b>ללשונותם בארצותם.<\/b> אַעַ\"פִּ שֶׁנֶּחְלְקוּ לִלְשׁוֹנוֹת וַאֲרָצוֹת, כֻּלָּם בְּנֵי חָם הֵם:", "rashi_en": "ללשנתם בארצתם AFTER THEIR TONGUES, IN THEIR LANDS — Although these were of different tongues and lands they are nevertheless all sons of Ham. "}, {"ch": 10, "v": 21, "aliyah": 6, "heb": "וּלְשֵׁ֥ם יֻלַּ֖ד גַּם־ה֑וּא אֲבִי֙ כׇּל־בְּנֵי־עֵ֔בֶר אֲחִ֖י יֶ֥פֶת הַגָּדֽוֹל׃", "onk": "וּלְשֵׁם אִתְיְלִיד אַף הוּא אֲבוּהוֹן דְּכָל בְּנֵי עֵבֶר אֲחוּהִי דְּיֶפֶת רַבָּא:", "onk_en": "Sons were also born to Sheim, father of the Children of the Other Side. He was the brother of Yefes, the elder.", "pj": "וּלְשֵׁם אִיתְיְלִיד אַף הוּא בַּר הוּא אַבוּהוֹן דְכָל בְּנֵי עִיבְרָאֵי אָחוֹי דְיֶפֶת רַבָּא בִּדְחַלְתָּא דַיְיָ", "pj_en": "And to Shem also was born a son. He is the father of all the sons of the Hebrews, the brother of Japheth, great in the fear of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>אבי כל בני עבר.<\/b> הַנָּהָר הָיָה שֵׁם:<br><br><b>אחי יפת הגדול.<\/b> אֵינִי יוֹדֵעַ אִם יֶפֶת הַגָּדוֹל אִם שֵׁם, כְּשֶׁהוּא אוֹמֵר שֵׁם בֶּן מְאַת שָׁנָה וְגוֹ' שְׁנָתַיִם אַחַר הַמַּבּוּל, הֱוֵי אוֹמֵר יֶפֶת הַגָּדוֹל, שֶׁהֲרֵי בֶּן ת\"ק שָׁנָה הָיָה נֹחַ כְּשֶׁהִתְחִיל לְהוֹלִיד, וְהַמַּבּוּל הָיָה בִּשְׁנַת שֵׁשׁ מֵאוֹת שָׁנָה, נִמְצָא שֶׁהַגָּדוֹל בְּבָנָיו הָיָה בֶן מֵאָה שָׁנָה, וְשֵׁם לֹא הִגִּיע לְמֵאָה עַד שְׁנָתַיִם אַחַר הַמַּבּוּל:<br><br><b>אחי יפת.<\/b> וְלֹא אֲחִי חָם? שֶׁאֵלּוּ שְׁנֵיהֶם כִּבְּדוּ אֶת אֲבִיהֶם, וְזֶה בִּזָּהוּ:", "rashi_en": "אבי כל בני עבר THE FATHER OF ALL THE CHILDREN OF EBER — (עבר means the “side” or “ other side” of a river) — The father of all the children of עבר הנהר, the other side of the River (Euphrates), was Shem.<br><br>אחי יפת הגדול [SHEM …] THE BROTHER OF JAPHETH, THE ELDER — (The Hebrew is ambiguous: “the elder” may refer either to Shem or to Japheth). One cannot from here determine whether Japheth was the elder or Shem. Since, however, it states (10:10) “Shem was a hundred years old … two years after the flood” you must admit that Japheth was the elder. Because Noah was 500 years old when he first had children (5:32), and the Flood happened in the six hundredth year of his life (7:11), consequently the eldest of his sons was then one hundred years old, whereas Shem reached his hundredth year only two years after the Flood (and therefore Japheth was the elder of the two) (Genesis Rabbah 37:7).<br><br>אחי יפת THE BROTHER OF JAPHETH — It does not state “brother of Ham”, because those two honoured their father whereas Ham put him to shame. "}, {"ch": 10, "v": 22, "aliyah": 6, "heb": "בְּנֵ֥י שֵׁ֖ם עֵילָ֣ם וְאַשּׁ֑וּר וְאַרְפַּכְשַׁ֖ד וְל֥וּד וַֽאֲרָֽם׃", "onk": "בְּנֵי שֵׁם עֵילָם וְאַשּׁוּר וְאַרְפַּכְשַׁד וְלוּד וַאֲרָם:", "onk_en": "The sons of Sheim were: Elam, and Asshur, Arpachshad, Lud, and Aram.", "pj": "בְּנוֹי דְשֵׁם עֵילָם וְאַתּוּר וְאַרְפַּכְשַׁד וְלוּד וַאֲרָם", "pj_en": "The sons of Shem: Elim, and Athur, and Arphakshad, and Lud, and Aram.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 23, "aliyah": 6, "heb": "וּבְנֵ֖י אֲרָ֑ם ע֥וּץ וְח֖וּל וְגֶ֥תֶר וָמַֽשׁ׃", "onk": "וּבְנֵי אֲרָם עוּץ וְחוּל וְגֶתֶר וָמַשׁ:", "onk_en": "The sons of Aram were: Uz, Chul, Geser and Mash.", "pj": "", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 24, "aliyah": 6, "heb": "וְאַרְפַּכְשַׁ֖ד יָלַ֣ד אֶת־שָׁ֑לַח וְשֶׁ֖לַח יָלַ֥ד אֶת־עֵֽבֶר׃", "onk": "וְאַרְפַּכְשַׁד אוֹלִיד יָת שָׁלַח וְשֶׁלַח אוֹלִיד יָת עֵבֶר:", "onk_en": "Arpachshad produced Shelach, and Shelach produced Eiver.", "pj": "וְאַרְפַּכְשַׁד אוֹלִיד יַת שֶׁלַח וְשֶׁלַח אוֹלִיד יַת עֵבֶר", "pj_en": "Arphakshad begat Shelach, and Shelach begat Eber.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 25, "aliyah": 6, "heb": "וּלְעֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָֽאֶחָ֞ד פֶּ֗לֶג כִּ֤י בְיָמָיו֙ נִפְלְגָ֣ה הָאָ֔רֶץ וְשֵׁ֥ם אָחִ֖יו יׇקְטָֽן׃", "onk": "וּלְעֵבֶר אִתְיְלִידוּ תְּרֵין בְּנִין שׁוּם חַד פֶּלֶג אֲרֵי בְּיוֹמוֹהִי אִתְפְּלִיגַת אַרְעָא וְשׁוּם אֲחוּהִי יָקְטָן:", "onk_en": "Two sons were born to Eiver, the name of one was Peleg, for in his days the earth[’s inhabitants] were dispersed, and his brothers name was Yaktan.", "pj": "וּלְעֵבֶר אִיתְיְלִידוּ תְּרֵין בְּנִין שׁוּם חַד פֶּלֶג אַרוּם בְּיוֹמוֹי אִתְפְּלִיגַת אַרְעָא וְשׁוּם אָחוֹי יָקְטָן", "pj_en": "And to Eber were born two sons: the name of the one was Peleg, because in his days the earth was divided; and the name of the other Joktan.", "tj": "", "tj_en": "", "rashi": "<b>נפלגה.<\/b> נִתְבַּלְבְּלוּ הַלְּשׁוֹנוֹת וְנָפוֹצוּ מִן הַבִּקְעָה וְנִתְפַּלְּגוּ בְכָל הָעוֹלָם. לָמַדְנוּ שֶׁהָיָה עֵבֶר נָבִיא, שֶׁקָּרָא שֵׁם בְּנוֹ עַל שֵׁם הֶעָתִיד; וְשָׁנִינוּ בְסֵדֶר עוֹלָם שֶׁבְּסוֹף יָמָיו נִתְפַּלְּגוּ, שֶׁאִ\"תֹּ בִּתְחִלַּת יָמָיו, הֲרֵי יָקְטָן אָחִיו צָעִיר מִמֶּנּוּ וְהוֹלִיד כַּמָּה מִשְׁפָּחוֹת קֹדֶם לָכֵן, שֶׁנֶּאֱמַר וְיָקְטָן יָלַד וְגוֹ' וְאַחַר כָּךְ וַיְהִי כָל הָאָרֶץ וְגוֹ'; וְאִ\"תֹּ בְּאֶמְצַע יָמָיו, לֹא בָא הַכָּתוּב לִסְתֹּם אֶלָּא לְפָרֵשׁ, הָא לָמַדְתָּ שֶׁבִּשְׁנַת מוֹת פֶּלֶג נִתְפַּלְּגוּ:<br><br><b>ויקטן.<\/b> שֶׁהָיָה עָנָו וּמַקְטִין עַצְמוֹ, לְכָךְ זָכָה לְהַעֲמִיד כָּל הַמִּשְׁפָּחוֹת הַלָּלוּ:", "rashi_en": "נפלגה [THE EARTH] WAS DIVIDED — The languages became confounded and they (the peoples) were scattered abroad from the plain of Shinar, and were dispersed throughout the whole world. We may learn from this that Eber was a prophet, for he gave his son the name פלג, “division” after an event which was to happen in the future (Genesis Rabbah 37:7). For we learn in Seder Olam that it was during the last of his days that they were dispersed abroad. For if you argue that this happened early in his life (and that therefore he was not anticipating the future in so naming his son, but that the name referred to an event that had already happened), behold, his brother Joktan was younger than he and he had begotten many families previous to the dispersion, as it is said (10:26) “And Joktan begot etc.” and only afterwards is it stated “And the whole earth was etc.” (with reference to the dispersion). If, on the other hand, you argue that the dispersal happened in the middle period of his life, then I reply that the verse surely does not intend to refer to the time when the dispersion took place in an indefinite manner, but to state quite definitely when it was. Hence you may learn that it was in the year of Peleg’s death that they were dispersed. <br><br>יקטן JOKTAN — He was so called (“the little one”) because he was so humble and thought little (ומקטין) of himself; therefore he merited the privilege of rearing all these families (Genesis Rabbah 37:7). "}, {"ch": 10, "v": 26, "aliyah": 6, "heb": "וְיׇקְטָ֣ן יָלַ֔ד אֶת־אַלְמוֹדָ֖ד וְאֶת־שָׁ֑לֶף וְאֶת־חֲצַרְמָ֖וֶת וְאֶת־יָֽרַח׃", "onk": "וְיָקְטָן אוֹלִיד יָת אַלְמוֹדָד וְיָת שָׁלֶף וְיָת חֲצַרְמָוֶת וְיָת יָרַח:", "onk_en": "Yaktan produced Almodad, Shelef, Chatzarmaves, and Yerach,", "pj": "וְיָקְטָן אוֹלִיד יַת אַלְמוֹדָד דִמָשַׁח יַת אַרְעָא בְּאַשַׁלְוָן וְיַת שָׁלֶף דְשָׁלֶף מוֹי דְנַהַרְוָותָא וְיַת חַצַרְמָוֶת וְיַת יָרַח", "pj_en": "And Joktan begat Elmodad, who measured (or lined) the earth with lines; and Shaleph, who led forth the waters of rivers, and Chatsarmaveth, and Jarach, and", "tj": "", "tj_en": "", "rashi": "<b>חצרמות.<\/b> עַל שֵׁם מְקוֹמוֹ, דִּבְרֵי אַגָּדָה (ב\"ר):", "rashi_en": "חצרמות He was so called (Court of Death) after his city. So is the statement of the Agada (Genesis Rabbah 37:8)."}, {"ch": 10, "v": 27, "aliyah": 6, "heb": "וְאֶת־הֲדוֹרָ֥ם וְאֶת־אוּזָ֖ל וְאֶת־דִּקְלָֽה׃", "onk": "וְיָת הֲדוֹרָם וְיָת אוּזָל וְיָת דִּקְלָה:", "onk_en": "[also] Hadoram, Uval, and Diklah,", "pj": "וְיַת הֲדוֹרָם וְיַת אוּזָל וְיַת דִיקְלָה", "pj_en": "Harodam, and Uzal, and Dikla,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 28, "aliyah": 6, "heb": "וְאֶת־עוֹבָ֥ל וְאֶת־אֲבִֽימָאֵ֖ל וְאֶת־שְׁבָֽא׃", "onk": "וְיָת עוֹבָל וְיָת אֲבִימָאֵל וְיָת שְׁבָא:", "onk_en": "[also] Oval, Avimaeil, and Sheva,", "pj": "וְיַת עוֹבָל וְיַת אֲבִימָאֵל וְיַת שְׁבָא", "pj_en": "and Oval, and Avimael, and Sheba,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 29, "aliyah": 6, "heb": "וְאֶת־אוֹפִ֥ר וְאֶת־חֲוִילָ֖ה וְאֶת־יוֹבָ֑ב כׇּל־אֵ֖לֶּה בְּנֵ֥י יׇקְטָֽן׃", "onk": "וְיָת אוֹפִר וְיָת חֲוִילָה וְיָת יוֹבָב כָּל אִלֵּין בְּנֵי יָקְטָן:", "onk_en": "[also] Ophir, Chavilah, and Yovav. All these were sons of Yaktan.", "pj": "וְיַת אוֹפִיר וְיַת חֲוִילָא וְיַת יוֹבָב כָּל אִילֵין בְּנוֹי דְיָקְטָן", "pj_en": "and Ophir, and Havila, and Jobab. All these are the sons of Joktan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 30, "aliyah": 6, "heb": "וַיְהִ֥י מוֹשָׁבָ֖ם מִמֵּשָׁ֑א בֹּאֲכָ֥ה סְפָ֖רָה הַ֥ר הַקֶּֽדֶם׃", "onk": "וַהֲוָה מוֹתְבָנְהוֹן מִמֵּשָׁא מָטֵי לִסְפַר טוּר מָדִינְחָא:", "onk_en": "Their dwelling place was from Meishah toward Sephor, the eastern mountain.", "pj": "וַהֲוָה בֵּית מוֹתְבָנֵיהוֹן מִן מֵישָׁא מַעֲלַךְ לִסְפַּרְוָואֵי טַוָור מַדִינְחָא", "pj_en": "And the house of their dwelling was from Mesha, by which thou goest up to Sepharvae, a mountain of the east.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 31, "aliyah": 6, "heb": "אֵ֣לֶּה בְנֵי־שֵׁ֔ם לְמִשְׁפְּחֹתָ֖ם לִלְשֹׁנֹתָ֑ם בְּאַרְצֹתָ֖ם לְגוֹיֵהֶֽם׃", "onk": "אִלֵּין בְּנֵי שֵׁם לְזַרְעֲיָתְהוֹן לְלִישָׁנְהוֹן לְאַרְעָתְהוֹן בְּעַמְמֵיהוֹן:", "onk_en": "These are the sons of Sheim, according to their families and their languages, in their lands and in their nations.", "pj": "אִלֵין בְּנוֹי דְשֵׁם לְיִחוּסֵיהוֹן בְּמוֹתַב אַרְעֲיַתְהוֹן לִגְנִיסַת עַמְמֵיהוֹן", "pj_en": "These are the sons of Shem, according to their houses, in the dwelling of their lands, according to the kindred of their people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 32, "aliyah": 6, "heb": "אֵ֣לֶּה מִשְׁפְּחֹ֧ת בְּנֵי־נֹ֛חַ לְתוֹלְדֹתָ֖ם בְּגוֹיֵהֶ֑ם וּמֵאֵ֜לֶּה נִפְרְד֧וּ הַגּוֹיִ֛ם בָּאָ֖רֶץ אַחַ֥ר הַמַּבּֽוּל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אִלֵּין זַרְעֲיַת בְּנֵי נֹחַ לְתוּלְדָתְהוֹן בְּעַמְמֵיהוֹן וּמֵאִלֵּין אִתַּפְרָשׁוּ עַמְמַיָּא בְּאַרְעָא בָּתַר טוֹפָנָא:", "onk_en": "These are the families of the sons of Noach, according to their descendants and in their nations. From these the nations were separated on the earth after the Flood.", "pj": "אִלֵין יְחוּסֵי בְּנוֹי דְנחַ לְיִחוּסֵהוֹן בְּעַמְמֵיהוֹן וּמֵאִלֵין אִתְפָּרָשׁוּ עַמְמַיָא בְּאַרְעָא בָּתַר טוּבְעָנָא", "pj_en": "These are the houses of the sons of Noah, according to their ho
