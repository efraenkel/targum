ְחוֹד עִרְבוּבִין:", "tj_en": "A mixed multitude.", "rashi": "<b>ערב רב.<\/b> תַּעֲרֹבֶת אֻמּוֹת שֶׁל גֵּרִים:", "rashi_en": "ערב רב A MIXED MULTITUDE — a mingling of various nations who had become proselytes."}, {"ch": 12, "v": 39, "aliyah": 6, "heb": "וַיֹּאפ֨וּ אֶת־הַבָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִמִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי־גֹרְשׁ֣וּ מִמִּצְרַ֗יִם וְלֹ֤א יָֽכְלוּ֙ לְהִתְמַהְמֵ֔הַּ וְגַם־צֵדָ֖ה לֹא־עָשׂ֥וּ לָהֶֽם׃", "onk": "וַאֲפוֹ יָת לַיְשָׁא דִי אַפִּיקוּ מִמִצְרַיִם גְרִיצָן פַּטִירָן אֲרֵי לָא חֲמָע אֲרֵי אִתָּרָכוּ מִמִצְרַיִם וְלָא יָכִילוּ לְאִתְעַכָּבָא וְאַף זְוָדִין לָא עֲבָדוּ לְהוֹן:", "onk_en": "They baked the dough that they had brought out of Egypt into matzoh cakes, for it was not leavened. Since they were driven out of Egypt and could not delay, they had also not prepared provisions for themselves.", "pj": "וַהֲווֹ קַטְעִין מִן לִישָׁא דְאַפִּיקוּ מִמִּצְרַיִם וְסַדְרִין עַל רֵישֵׁיהוֹן וּמִתְאַפֵּי לְהוֹן מְחוּמְתָּא דְשִׁימְשָׁא חֲרִירַן פַּטִירַן אֲרוּם לָא חָמִיעַ אֲרוּם אִיתְרִיכוּ מִמִּצְרַיִם וְלָא יָכִילוּ לְמִישְׁהֵי וְסַפִּיקָא לְהוֹן לְמֵיכַל עַד חֲמֵיסַר יוֹמִין לְיַרְחָא דְאִיָּיר מְטוֹל דִּזְוָודִין לָא עֲבָדוּ לְהוֹן", "pj_en": "And they divided the dough which they brought out of Mizraim, which they had carried on their heads, and it was baked for them by the heat of the sun, (into) unleavened cakes, because it had not fermented; for the Mizraee had thrust them out, neither could they delay; and it was sufficient for them to eat until the fifteenth of the month Ijar; because they had not prepared provision for the way.", "tj": "", "tj_en": "", "rashi": "<b>עגת מצות.<\/b> חֲרָרָה שֶׁל מַצָּה; בָּצֵק שֶׁלֹּא הֶחֱמִיץ קָרוּי מַצָּה:<br><br><b>וגם צדה לא עשו להם.<\/b> לַדֶּרֶךְ. מַגִּיד שִׁבְחָן שֶׁל יִשְׂרָאֵל, שֶׁלֹּא אָמְרוּ הֵיאַךְ נֵצֵא לַמִּדְבָּר בְּלֹא צֵידָה? אֶלָּא הֶאֱמִינוּ וְהָלְכוּ; הוּא שֶׁמְּפֹרָשׁ בַּקַּבָּלָה, \"זָכַרְתִּי לָךְ חֶסֶד נְעוּרַיִךְ אַהֲבַת כְּלוּלֹתָיִךְ לֶכְתֵּךְ אַחֲרַי בַּמִּדְבָּר בְּאֶרֶץ לֹא זְרוּעָה\" (ירמיהו ב'), מַה שָּׂכָר מְפֹרָשׁ אַחֲרָיו? \"קֹדֶשׁ יִשְׂרָאֵל לַה' וְגוֹ'\":", "rashi_en": "עגת מצות means a cake of (made of) unleavened dough (Mekhilta); dough which has not become leavened is termed מצה.<br><br>וגם צדה לא עשו להם NEITHER HAD THEY MADE FOR THEMSELVES ANY PROVISION for the journey. This is stated to tell how praiseworthy Israel was: that they did not say, “How can we go forth into the wilderness without provisions?” But they had faith and set forth. This it is that is referred to more explicitly in the prophets: (Jeremiah 2:1) “I remember for thee the affection of thy youth, the love of thine espousals, how thou wentest after me in the wilderness in a land that was not sown”. What reward is afterwards set forth there? “Israel is the Lord’s hallowed portion etc.” (Mekhilta)."}, {"ch": 12, "v": 40, "aliyah": 6, "heb": "וּמוֹשַׁב֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר יָשְׁב֖וּ בְּמִצְרָ֑יִם שְׁלֹשִׁ֣ים שָׁנָ֔ה וְאַרְבַּ֥ע מֵא֖וֹת שָׁנָֽה׃", "onk": "וּמוֹתַב בְּנֵי יִשְׂרָאֵל דִי יְתִיבוּ בְּמִצְרָיִם אַרְבַּע מְאָה וּתְלָתִין שְׁנִין:", "onk_en": "The habitation of the B’nei Yisrael living in Egypt lasted four hundred and thirty years.", "pj": "וְיוֹמַיָא דְיָתִיבוּ בְּנֵי יִשְרָאֵל בְּמִצְרַיִם תְּלָתִין שְׁמִיטִין דִּשְׁנִין דִּסְכוּמְהוֹן מָאתָן וְעֶשֶר שְׁנִין וּמִנְיַן אַרְבַּע מְאָה וּתְלָתִין שְׁנִין מִן דְּמַלֵּיל יְיָ לְאַבְרָהָם מִן שַׁעְתָּא דְמַלֵּיל עִמֵּיהּ בַּחֲמֵיסַר בְּנִיסָן בֵּינֵי פְּסוּגַיָיא עַד יוֹמָא דִּנְפָקוּ מִמִּצְרַיִם", "pj_en": "And the days of the dwelling of the sons of Israel in Mizraim were thirty weeks of years, (thirty times seven years,) which is the sum of two hundred and ten years. But the number of four hundred and thirty years (had passed away since) the Lord spake to Abraham, in the hour that He spake with him on the fifteenth of Nisan, between the divided parts, until the day that they went out of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>אשר ישבו במצרים.<\/b> אַחַר שְׁאָר הַיְשִׁיבוֹת שֶׁיָּשְׁבוּ גֵּרִים בְּאֶרֶץ לֹא לָהֶם:<br><br><b>שלשים שנה וארבע מאות שנה.<\/b> בֵּין הַכֹּל, מִשֶּׁנּוֹלַד יִצְחָק עַד עַכְשָׁו, הָיוּ אַרְבַּע מֵאוֹת, מִשֶּׁהָיָה לוֹ זֶרַע לְאַבְרָהָם נִתְקַיֵּם כִּי גֵר יִהְיֶה זַרְעֲךָ, וּשְׁלֹשִׁים שָׁנָה הָיוּ מִשֶׁנִּגְזְרָה גְזֵרַת בֵּין הַבְּתָרִים עַד שֶׁנּוֹלַד יִצְחָק; וְאִי אֶפְשָׁר לוֹמַר בְּאֶרֶץ מִצְרַיִם לְבַדָּהּ, שֶׁהֲרֵי קְהָת מִן הַבָּאִים עִם יַעֲקֹב הָיָה, צֵא וַחֲשֹׁב כָּל שְׁנוֹתָיו וְכָל שְׁנוֹת עַמְרָם בְּנוֹ וּשְׁמוֹנִים שֶׁל מֹשֶׁה, לֹא תִמְצָאֵם כָּל כָּךְ, וְעַל כָּרְחֲךָ הַרְבֵּה שָׁנִים הָיוּ לִקְהָת עַד שֶׁלֹּא יָרַד לְמִצְרַיִם, וְהַרְבֵּה מִשְּׁנוֹת עַמְרָם נִבְלָעִים בִּשְׁנוֹת קְהָת, וְהַרְבֵּה מִשְּׁמוֹנִים שֶׁל מֹשֶׁה נִבְלָעִים בִּשְׁנוֹת עַמְרָם, הֲרֵי שֶׁלֹּא תִמְצָא אַרְבַּע מֵאוֹת לְבִיאַת מִצְרַיִם, וְהֻזְקַקְתָּה לוֹמַר עַל כָּרְחֲךָ, שֶׁאַף שְׁאָר הַיְשִׁיבוֹת נִקְרְאוּ גֵּרוּת וַאֲפִלּוּ בְחֶבְרוֹן שֶׁנֶּאֱמַר \"אֲשֶׁר גָּר שָׁם אַבְרָהָם וְיִצְחָק\" (בראשית ל\"ה), וְאוֹמֵר \"אֶת אֶרֶץ מְגֻרֵיהֶם אֲשֶׁר גָּרוּ בָהּ\" (שמות ו'), לְפִיכָךְ אַתָּה צָרִיךְ לוֹמַר \"כִּי גֵר יִהְיֶה זַרְעֲךָ\" מִשֶּׁהָיָה לוֹ זֶרַע, וּכְשֶׁתִּמְנֶה ת' שָׁנָה מִשֶּׁנּוֹלַד יִצְחָק, תִּמְצָא מִבִּיאָתָן לְמִצְרַיִם עַד יְצִיאָתָן ר\"י, וְזֶה אֶחָד מִן הַדְּבָרִים שֶׁשִּׁנּוּ לְתַלְמַי הַמֶּלֶךְ (מגילה ט'):", "rashi_en": "אשר ישבו במצרים WHO ABODE IN EGYPT after the other settlements (i. e. including those also) which they had made as strangers in a land that was not theirs (cf. Mekhilta).<br><br>שלשים שנה וארבע מאות שנה FOUR HUNDRED AND THIRTY YEARS — Altogether from the birth of Isaac until now were 400 years, and we must reckon from that event, for only from the time when Abraham had offspring from Sarah could the prophecy (Genesis 15:13) “Thy offspring shall be a stranger” be fulfilled; and there had been 30 years since that decree made at “the convenant between the parts” until the birth of Isaac. It is impossible to say that this means that they were 430 years in the land of Egypt alone, for Kohath was one of those who came into Egypt with Jacob (Genesis 46:11); go and reckon all his years and all the years of Amram his son and the whole eighty years of Moses, the latter’s son, until the Exodus and you will not find that they total to so many; and you must admit that Kohath had already lived many years before he went down to Egypt, and that many of Amram’s years are included in the years of his father Kohath, and that many of the 80 years of Moses are included in the years of his father Amram, so that you see that you will not find 400 years from the time of Israel’s coming into Egypt until the Exodus. You are compelled to admit, even though unwillingly, that the other settlements which the patriarchs made in lands other than Egypt come also under the name of “sojourning as a stranger” (גרות), including also that at Hebron, even though it was in Canaan itself, because it is said, (Genesis 35:27) “[Hebron] where Abraham and Isaac sojourned”, and it says, (Exodus 6:4) “[the land Canaan], the land of their sojournings wherein they sojourned”. Consequently you must necessarily say that the prophecy, “thy offspring shall be strangers… [four hundred years]” began only from the time when he had offspring. And only if you reckon the 400 years from the birth of Isaac will you find that from the time they came into Egypt until the time they left it, was 210 years (as alluded to in Genesis 15:13). This was one of the passages which they altered for king Ptolemy (Mekhilta; Megillah 9a)."}, {"ch": 12, "v": 41, "aliyah": 6, "heb": "וַיְהִ֗י מִקֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְאַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַיְהִ֗י בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה יָ֥צְא֛וּ כׇּל־צִבְא֥וֹת יְהֹוָ֖ה מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַהֲוָה מִסוֹף אַרְבַּע מְאָה וּתְלָתִין שְׁנִין וַהֲוָה בִּכְרַן יוֹמָא הָדֵין נְפָקוּ כָּל חֵילַיָא דַיְיָ מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "It was at the end of the four hundred and thirty years, and on that very day all of Adonoy’s multitudes went out of the land of Egypt.", "pj": "וַהֲוָה מִסּוֹף תְּלָתִין שְׁנִין מִדְאִיתְגַּזְרַת גְּזֵירְתָּא הָדָא עַד דְּאִיתְיְלִיד יִצְחָק עַד דִנְפָקוּ פְּרִיקִין מִמִּצְרַיִם אַרְבַּע מְאָה שְׁנִין וַהֲוָה בִּכְרַן יוֹמָא הָדֵין נְפָקוּ כָּל חֵילַיָא דַיְיָ פְּרִיקִין מֵאַרְעָא דְּמִצְרָיִם", "pj_en": "And it was at the end of thirty years from the making of this covenant, that Izhak was born; and thence until they went out of Mizraim four hundred (years), on the selfsame day it was that all the hosts of the Lord went forth made free from the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ויהי מקץ שלשים שנה וגו' ויהי בעצם היום הזה.<\/b> מַגִּיד, שֶׁכֵּיוָן שֶׁהִגִּיעַ הַקֵּץ לֹא עִכְּבָן הַמָּקוֹם כְּהֶרֶף עַיִן – בְּט\"ו בְנִיסָן בָּאוּ מַלְאֲכֵי הַשָּׁרֵת אֵצֶל אַבְרָהָם לְבַשְּׂרוֹ, וּבְט\"ו בְּנִיסָן נוֹלַד יִצְחָק, וּבְט\"ו בְּנִיסָן נִגְזְרָה גְּזֵרַת בֵּין הַבְּתָרִים:", "rashi_en": "ויהי מקץ שלשים שנה וגו' ויהי בעצם היום הזה AND IT CAME TO PASS AT THE END OF THE 430 YEARS … EVEN ON THE SELF-SAME DAY — The addition of the latter phrase tells us that as soon as the predetermined end of the bondage arrived the Omnipresent did not detain them even as long as the twinkling of an eye (Mekhilta). For on the fifteenth of Nisan the ministering angels had come to Abraham to announce to him the promised birth of Isaac, and on the fifteenth of Nisan Isaac was born, and on the fifteenth of Nisan the decree “between the parts” relating to Israel’s slavery was made."}, {"ch": 12, "v": 42, "aliyah": 6, "heb": "לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽיהֹוָ֔ה לְהוֹצִיאָ֖ם מֵאֶ֣רֶץ מִצְרָ֑יִם הֽוּא־הַלַּ֤יְלָה הַזֶּה֙ לַֽיהֹוָ֔ה שִׁמֻּרִ֛ים לְכׇל־בְּנֵ֥י יִשְׂרָאֵ֖ל לְדֹרֹתָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לֵיל נְטִיר הוּא <b>קֳדָם<\/b> יְיָ לְאַפָּקוּתְהוֹן מֵאַרְעָא דְמִצְרַיִם הוּא לֵילְיָא הָדֵין <b>קֳדָם<\/b> יְיָ נְטִירִין לְכָל בְּנֵי יִשְׂרָאֵל לְדָרֵיהוֹן:", "onk_en": "This was a night of vigil for [<b>before<\/b>] Adonoy, to bring them out of the land of Egypt. This night remains a night of vigil to [<b>before<\/b>] Adonoy for all the B’nei Yisrael for [all] their generations.", "pj": "אַרְבָּעָה לֵילְוָון כְּתִיבִין בְּסֵפֶר דּוּכְרָנַיָיא קֳדָם רִבּוֹן עַלְמָא לֵילְיָא קַדְמָאָה כַּד אִיתְגְּלֵי לְמִבְרֵי עַלְמָא תִּנְיָינָא כַּד אִיתְגְּלֵי עַל אַבְרָהָם תְּלִיתָאָה כַּד אִיתְגְּלֵי בְּמִצְרַיִם וַהֲוָת יְדֵיהּ מְקַטְלָא כָּל בּוּכְרָא דְמִצְרַיִם וִימִינֵיהּ מְשֵׁיזְבָא בְּכוֹרֵיהֶן דְּיִשְרָאֵל רְבִיעָאָה כַּד אִתְגְּלֵי לְמִפְרוֹק עַמָּא בֵּית יִשְרָאֵל מִבֵּינֵי עַמְמַיָא וְכוּלְהוֹן קָרָא לֵילֵי נְטִיר בְּגִין כֵּן פָּרִישׁ משֶׁה וַאֲמַר לֵיל נְטִיר לְפוּרְקַן הוּא מִן קֳדָם יְיָ לְמַפְקָא יַת עַמָּא בְּנֵי יִשְרָאֵל מֵאַרְעָא דְמִצְרַיִם הוּא לֵילְיָא הָדֵין נְטִיר מִמַּלְאָכָה מְחַבְּלָא לְכָל בְּנֵי יִשְרָאֵל דִּבְמִצְרַיִם וְכֵן לְמִיפְרַקְהוֹן מִגַּלְוַותְהוֹן לְדָרֵיהוֹן:", "pj_en": "Four nights are there written in the Book of Memorials before the Lord of the world. Night the first,--when He was revealed in creating the world; the second,--when He was revealed to Abraham; the third,--when He was revealed in Mizraim, His hand killing all the firstborn of Mizraim, and His right hand saving the firstborn of Israel; the fourth,--when He will yet be revealed to liberate the people of the house of Israel from among the nations. And all these are called Nights to be observed; for so explained Mosheh, and said thereof, It is to be observed on account of the liberation which is from the Lord, to lead forth the people of the sons of Israel from the land of Mizraim. This is that Night of preservation from the destroying angel for all the sons of Israel who were in Mizraim, and of redemption of their generations from their captivity.", "tj": "לֵיל נְטִיר וּמְזוּמָן לְפוּרְקַן הוּא מִן קֳדָם יְיָ בְּאַפָּקָתְהוֹן דִּבְנֵי יִשְרָאֵל פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם אֲרוּם אַרְבַּע לֵילְוָן אִינוּן כְּתִיבִין בְּסֵפֶר דִּכְרָנַיָא לֵילָא קַדְמָאָה כַּד אִתְגְּלֵי מֵימְרָא דַיְיָ עַל עַלְמָא לְמִבְרָא יָתֵיהּ הֲוָת עַלְמָא תָּהֵי וּבָהֵי וַחֲשׁוֹכָא פָּרִיס עַל אַפֵּי תְהוֹמָא וּמֵימְרָא דַּיְיָ הֲוָה נָהִיר וּמַנְהַר וּקְרֵי יָתֵיהּ לֵילָא קַדְמַיָא: לֵילָא תִּנְיָנָא כַּד אִתְגְּלֵי מֵימְרָא דַיְיָ עַל אַבְרָם בֵּינֵי בְּתָרַיָא הֲוָה אַבְרָהָם בַּר מְאָה שְׁנִין וְשָרָה הֲוָת בְּרַת תִּשְׁעִין שְׁנִין לִמְקַיְימָא מַה דְּאָמַר כְּתָבָא אַבְרָהָם בַּר מְאָה שְׁנִין אִיפְשַׁר לֵיהּ לְמוֹלְדָה וְשָרָה בְּרַת תִּשְׁעִין שְׁנִין אִיפְשַׁר לָהּ דְּתוֹלִיד הֲלָא בַּר תְּלָתִין וּשְׁבַע שְׁנִין הֲוָה אֲבוּנָן יִצְחָק בִּזְמַן דְּאִיתְקְרֵיב עַל גַּבֵּי מַדְבְּחָא שְׁמַיָא מָכוּ וְנַחֲתוּ וַחֲמָא יִצְחָק יַת שַׁכְלוּלֵיהוֹן וְכַהֲיָין עֵינוֹ מִן מְרוֹמַיָא וּקְרֵי יָתֵיהּ לֵילְיָא תִּנְיָנָא: לֵילָא תְלִיתָאָה כַּד אִתְגְּלֵי מֵימְרָא דַיְיָ עַל מִצְרָאֵי בְּפַלְגוּת לֵילְיָא הֲוַת יְמִינָא מְקַטְלָא בּוּכְרֵיהוֹן דְּמִצְרָאֵי וִימִינֵיהּ מְשֵׁיזְבָא בּוּכְרֵיהוֹן דְּיִשְרָאֵל לְמִקַיְימָא מַה דַּאֲמַר כְּתָבָא בְּרִי בּוּכְרִי הִינוּן יִשְרָאֵל וּקְרֵי יָתֵיהּ לֵילָא תְּלִיתָאָה: לֵילָא רְבִיעָאָה כַּד יַשְׁלִים עַלְמָא קִיצֵיהּ לְמִיתְפַּרְקָא חַבְלֵי רִישְׁעָא יִשְׁתֵּיצוּן וְגִירֵי פַּרְזְלָא יִתְבְּרוּן משֶׁה יִפּוֹק מִן גּוֹ מַדְבְּרָא וּמַלְכָּא מְשִׁיחָא מִן גּוֹ רוֹמָא דֵּין יְדַבֵּר בְּרֵישׁ עֲנָנָא וְדֵין יְדַבֵּר בְּרֵישׁ עֲנָנָא וּמֵימְרָא דַיְיָ מְדַבֵּר בֵּין תַּרְוֵיהוֹן וְאִינוּן מְהַלְכִין כַּחֲדָא הוּא לֵיל פִּסְחָא קֳדָם יְיָ נְטִיר וּמְזַמִּין לְכָל יִשְרָאֵל לְדָרֵיהוֹן:", "tj_en": "It is a night to be observed and celebrated for the liberation from before the Lord in bringing forth the sons of Israel, made free from the land of Mizraim. Four nights are there written in the Book of Memorial. Night first; when the Word of the Lord was revealed upon the world as it was created; when the world was without form and void, and darkness was spread upon the face of the deep, and the Word of the Lord illuminated and made it light; and he called it the first night. Night second; when the Word of the Lord was revealed unto Abraham between the divided parts; when Abraham was a son of a hundred years, and Sarah was a daughter of ninety years, and that which the Scripture saith was confirmed,--Abraham a hundred years, can he beget? and Sarah, ninety year old, can she bear? Was not our father Izhak a son of thirty and seven years, at the time he was offered upon the altar? The heavens were (then) bowed down and brought low, and Izhak saw their realities, and his eyes were blinded at the sight, and he called it the second night. The third night; when the Word of the Lord was revealed upon the Mizraee, at the dividing of the night; His right hand slew the firstborn of the Mizraee, His right hand spared the firstborn of Israel; to fulfil what the Scripture hath said, Israel is My firstborn son. And he called it the third night. Night the fourth; when the end of the age will be accomplished, that it might be dissolved, the bands of wickedness destroyed and the iron yoke broken. Mosheh came forth from the midst of the desert; but the King Meshiha (comes) from the midst of Roma. The Cloud preceded that, and the Cloud will go before this one; and the Word of the Lord will lead between both, and they shall proceed together. This is the night of the Pascha before the Lord, to be observed and celebrated by the sons of Israel in all their generations.", "rashi": "<b>ליל שמרים.<\/b> שֶׁהָיָה הַקָּבָּ\"ה שׁוֹמֵר וּמְצַפֶּה לוֹ, לְקַיֵּם הַבְטָחָתוֹ <b>להוציאם מארץ מצרים<\/b>:<br><br><b>הוא הלילה הזה לה'.<\/b> הוּא הַלַּיְלָה שֶׁאָמַר לְאַבְרָהָם, בַּלַּיְלָה הַזֶּה אֲנִי גוֹאֵל אֶת בָּנֶיךָ (מכילתא):<br><br><b>שמרים לכל בני ישראל לדרתם.<\/b> מְשֻׁמָּר וּבָא מִן הַמַּזִּיקִין, כָּעִנְיָן שֶׁנֶּאֱמַר \"וְלֹא יִתֵּן הַמַּשְׁחִית וְגוֹ'\" (פסחים ק\"ט):", "rashi_en": "ליל שמרים IT WAS NIGHT OF WATCHING [UNTO THE LORD] — a night which the Holy One, blessed be He, was watching for and looking forward to, that He might fulfill His promise להוציאם מארץ מצרים TO BRING THEM OUT FROM THE LAND OF EGYPT.<br><br>הוא הלילה הזה לה IT IS THIS NIGHT OF THE LORD — it is the night of which He said to Abraham, “On this night will I redeem your children” (Mekhilta; cf. Rashi on Genesis 39:11).<br><br>שמרים לכל בני ישראל לדרתם [IT IS A NIGHT] OF PROTECTION FOR ALL THE CHILDREN OF ISRAEL THROUGHOUT THEIR GENERATIONS — this night is protected, and comes as such from ages past, against all destructive forces, as it is said, (v. 33) “And He will not permit the destroyer [to enter your houses]” (Pesachim 109b; Rosh Hashanah 11b)."}, {"ch": 12, "v": 43, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֣ה וְאַהֲרֹ֔ן זֹ֖את חֻקַּ֣ת הַפָּ֑סַח כׇּל־בֶּן־נֵכָ֖ר לֹא־יֹ֥אכַל בּֽוֹ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרֹן דָא גְזֵירַת פִּסְחָא כָּל <b>בַּר יִשְׂרָאֵל דְיִשְׁתַּמַד<\/b> לָא יֵכוּל בֵּהּ:", "onk_en": "Adonoy said to Moshe and Aharon, “This is the statute of the Pesach offering: No alien [<b>Jew who renounces his religion<\/b>] may eat it.", "pj": "וַאֲמַר יְיָ לְמשֶׁה וְאַהֲרן דָּא הִיא גְזֵירַת פִּסְחָא כָּל בַּר עַמְמִין אוֹ בַּר יִשְרָאֵל דְּאִיסְתְּלַק וְלָא הָדַר לָא יֵיכוּל בֵּיהּ", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>זאת חקת הפסח.<\/b> בְּי\"ד בְּנִיסָן נֶאֶמְרָה לָהֶם פָּרָשָׁה זוֹ:<br><br><b>כל בן נכר.<\/b> שֶׁנִּתְנַכְּרוּ מַעֲשָׂיו לְאָבִיו שֶׁבַּשָּׁמַיִם, וְאֶחָד הַגּוֹי וְאֶחָד יִשְׂרָאֵל מְשֻׁמָּד בְּמַשְׁמָע (מכילתא):", "rashi_en": "זאת חקת הפסח THIS IS THE ORDINANCE OF THE PASSOVER — This chapter was spoken to them on the 14th day of Nisan.<br><br>כל בן נכר NO STRANGE PERSON — one whose actions are estranged from his Heavenly Father (Zevachim 22b); both a heathen and an apostate Israelite therefore are implied in this term (Mekhilta)."}, {"ch": 12, "v": 44, "aliyah": 6, "heb": "וְכׇל־עֶ֥בֶד אִ֖ישׁ מִקְנַת־כָּ֑סֶף וּמַלְתָּ֣ה אֹת֔וֹ אָ֖ז יֹ֥אכַל בּֽוֹ׃", "onk": "וְכָל עֲבַד גְבַר זְבִינֵי כַסְפָּא וְתִגְזַר יָתֵהּ בְּכֵן יֵכוּל בֵּהּ:", "onk_en": "However each man’s slave [if he was]purchased with money, you must circumcise him and then he may eat it.", "pj": "וְכָל גּוּבְרָאֵי דְּאִזְדַּבַּן לְעֶבֶד לְגַבְרָא בַּר יִשְרָאֵל זַבִּין כַּסְפָּא וְתִגְזוֹר יָתֵיהּ וְתִטְבְּלִינֵיהּ בְּכֵן יֵיכוּל בֵּיהּ", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>ומלתה אתו אז יאכל בו.<\/b> רַבּוֹ, מַגִּיד שֶׁמִּילַת עֲבָדָיו מְעַכַּבְתּוֹ מִלֶּאֱכֹל בַּפֶּסַח, דִּבְרֵי רַבִּי יְהוֹשֻׁעַ. רַבִּי אֱלִיעֶזֶר אוֹמֵר, אֵין מִילַת עֲבָדָיו מְעַכַּבְתּוֹ מִלֶּאֱכֹל בַּפֶּסַח, אִם כֵּן מַה תַּ\"לֹ <b>אז יאכל בו<\/b>? הָעֶבֶד:", "rashi_en": "ומלתה אתו אז יאכל בו WHEN THOU HAST CIRCUMCISED HIM THEN SHALL HE EAT THEREOF — “he” means his (the slave’s) master; this tells us that the neglect to circumcise his slaves bars him from eating of the Paschal offering. This is the opinion of R. Joshua. Rabbi Eliezer, however, said: the neglect to circumcise his slaves does not bar him from eating of the Paschal offering. The objection was raised: if this be so what means “Then shall he eat thereof”? — The reply was given: “He” means the slave, not the master (the meaning being that the slave, so long as he is uncircumcised may not eat of it) (cf. Mekhilta)."}, {"ch": 12, "v": 45, "aliyah": 6, "heb": "תּוֹשָׁ֥ב וְשָׂכִ֖יר לֹא־יֹ֥אכַל בּֽוֹ׃", "onk": "תּוֹתָבָא וַאֲגִירָא לָא יֵכוּל בֵּהּ:", "onk_en": "An [alien] sojourner or hired worker may not eat it.", "pj": "דַּיוֹר תּוֹתַב וַאֲגִירָא נוּכְרָאָה לָא יֵיכוֹל בֵּיהּ", "pj_en": "A sojourner or a hired stranger shall not eat thereof.", "tj": "תּוֹתָבָא דִגְבַר וַאֲגִירָא כַּד הֲוָה בַּר עַמְמִין לָא יֵיכוּל מִינֵיהּ:", "tj_en": "A sojourning man and a hireling born of the Gentiles shall not eat of it.", "rashi": "<b>תושב.<\/b> זֶה גֵּר תּוֹשָׁב:<br><br><b>ושכיר.<\/b> זֶה גּוֹי, וּמַה תַּ\"לֹ, וַהֲלֹא עֲרֵלִים הֵם, וְנֶאֱמַר <b>וכל ערל לא יאכל בו<\/b>? אֶלָּא כְּגוֹן עֲרָבִי מָהוּל וְגִבְעוֹנִי מָהוּל וְהוּא תּוֹשָׁב אוֹ שָׂכִיר (שם):", "rashi_en": "תושב A TOLERATED SOJOURNER — this means a stranger who has settled in Palestine (having undertaken to observe the seven precepts of the “Sons of Noah”).<br><br>ושכיר AND A HIRED SERVANT — a heathen. But why need Scripture state at all that these (the תושב and the שכיר) may not eat of the Passover lamb? These are uncircumcised and it is said (v. 48) “And no uncircumcised person shall eat thereof”? But it refers to such a one as a circumcised Arabian or a circumcised Gibeonite who is a settler or a hired servant (Mekhilta; Yevamot 71a)."}, {"ch": 12, "v": 46, "aliyah": 6, "heb": "בְּבַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא־תוֹצִ֧יא מִן־הַבַּ֛יִת מִן־הַבָּשָׂ֖ר ח֑וּצָה וְעֶ֖צֶם לֹ֥א תִשְׁבְּרוּ־בֽוֹ׃", "onk": "<b>בַּחֲבוּרָא<\/b> חֲדָא יִתְאָכֵל לָא תַפֵּיק מִן בֵּיתָא מִן בִּסְרָא לְבָרָא וְגַרְמָא לָא תִתְבְּרוּן בֵּהּ:", "onk_en": "It must be eaten in one house [<b>group<\/b>]. You must not remove from the house any of its flesh, to the outdoors, and you must not break any of its bones.", "pj": "בַּחֲבוּרָא חָדָא יִתְאָכֵל לָא תִפְקוּן מִן בֵּיתָא מִן בִּשְרָא בַּר מֵחֲבוּרָתָא וְלָא לִמְשַׁדְרָא דוֹרוֹנִין גְּבַר לְחַבְרֵיהּ וּגְרָמָא לָא תְתַבְּרִין בֵּיהּ בְּדִיל לְמֵיכוּל מַה דִּבְגַוֵּיהּ", "pj_en": "In his own company he shall eat. Thou shalt not carry any of the flesh out of the house from (thy) company, nor send a gift one mail to his neighbour; and a bone of him shall not be broken for the sake of eating that which is within it.", "tj": "", "tj_en": "", "rashi": "<b>בבית אחד יאכל.<\/b> בַּחֲבוּרָה אַחַת, שֶׁלֹּא יֵעָשׂוּ הַנִּמְנִין עָלָיו שְׁתֵּי חֲבוּרוֹת וִיחַלְּקוּהוּ. אַתָּה אוֹמֵר בַּחֲבוּרָה אַחַת אוֹ אֵינוֹ אֶלָּא בְּבַיִת אֶחָד כְּמַשְׁמָעוֹ, וּלְלַמֵּד שֶׁאִם הִתְחִילוּ וְהָיוּ אוֹכְלִים בֶּחָצֵר וְיָרְדוּ גְּשָׁמִים שֶׁלֹּא יִכָּנְסוּ לַבַּיִת? תַּלְמוּד לוֹמַר, \"עַל הַבָּתִּים אֲשֶׁר יֹאכְלוּ אֹתוֹ בָּהֶם\", מִכָּאן שֶׁהָאוֹכֵל אוֹכֵל בִּשְׁנֵי מְקוֹמוֹת:<br><br><b>לא תוציא מן הבית.<\/b> מִן הַחֲבוּרָה:<br><br><b>ועצם לא תשברו בו.<\/b> הָרָאוּי לַאֲכִילָה, כְּגוֹן שֶׁיֵּשׁ עָלָיו כַּזַּיִת בָּשָׂר, יֵשׁ בּוֹ מִשּׁוּם שְׁבִירַת עֶצֶם, אֵין עָלָיו כַּזַּיִת בָּשָׂר אֵין בּוֹ מִשּׁוּם שְׁבִירַת עֶצֶם:", "rashi_en": "בבית אחד יאכל IN ONE HOUSE SHALL IT BE EATEN — in one company (cf. שה לבית); meaning that those who have registered themselves for it (the Paschal offering) shall not form themselves afterwards into two companies and divide it. An objection was raised: You say that this means “in one company”, but perhaps this is not so, but it means “in one house” (or place) as it usually signifies, and it intends to teach that if they had begun to eat, for example, in the courtyard of a house and rain fell they may not enter the house to complete the eating of the offering? The reply was given: this cannot be so, because Scripture says, (v. 7) “[They shall put the blood] upon the houses (plural) wherein they shall eat it” — and from here it follows that one who is eating the Paschal offering may eat it in two places (consequently the only meaning of the term בית is “company”, as was suggested) (cf. Mekhilta and Onkelos).<br><br>לא תוציא מן הבית THOU SHALT NOT CARRY FORTH OUT OF THE HOUSE this must therefore mean away from the company (Mekhilta).<br><br>ועצם לא תשברו בו NEITHER SHALL YE BREAK A BONE THEREOF — any bone that is fitted for eating (for the purpose of the performing the command of eating the Paschal lamb) as, for instance, one upon which there is flesh of the size of an olive — to it there is (applies) the prohibition relating to the breaking of a bone, but if there is not upon it flesh of the size of an olive there does not apply to it the prohibition of breaking a bone (cf. Pesachim 84b)."}, {"ch": 12, "v": 47, "aliyah": 6, "heb": "כׇּל־עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽוֹ׃", "onk": "כָּל כְּנִשְׁתָּא דְיִשְׂרָאֵל יַעְבְּדוּן יָתֵהּ:", "onk_en": "The entire community of Yisrael must make this [offering].", "pj": "כָּל כְּנִשְׁתָּא דְיִשְרָאֵל מִתְעַרְבִין דֵּין גְנִיסָא עִם דֵּין גְּנִיסְתָּא אוֹחֲרִי לְמֶעֱבַד יָתֵיהּ", "pj_en": "All the congregation of Israel shall mix together, this one with that, one family with another, that they may perform it.", "tj": "", "tj_en": "", "rashi": "<b>כל עדת ישראל יעשו אתו.<\/b> לָמָּה נֶאֱמַר, לְפִי שֶׁהוּא אוֹמֵר בְּפֶסַח מִצְרַיִם \"שֶׂה לְבֵית אָבוֹת\", שֶׁנִּמְנוּ עָלָיו לַמִּשְׁפָּחוֹת, יָכוֹל אַף פֶּסַח דּוֹרוֹת כֵּן? תַּ\"לֹ <b>כל עדת ישראל יעשו אתו<\/b>:", "rashi_en": "כל עדת ישראל יעשו אתו ALL THE CONGREGATION OF ISRAEL SHALL KEEP IT — Why is this stated? Since it says of the Paschal offering offered in Egypt, (v. 3) “a lamb for the house of their fathers” which means that they are to be registered for it by families, one might think that in the case of the Paschal offering offered by future generations this must also be so! Therefore Scripture states: “All the congregation of Israel may eat it” (i.e. any of them may eat it whoever they may be who combine to do so) (Mekhilta)."}, {"ch": 12, "v": 48, "aliyah": 6, "heb": "וְכִֽי־יָג֨וּר אִתְּךָ֜ גֵּ֗ר וְעָ֣שָׂה פֶ֘סַח֮ לַיהֹוָה֒ הִמּ֧וֹל ל֣וֹ כׇל־זָכָ֗ר וְאָז֙ יִקְרַ֣ב לַעֲשֹׂת֔וֹ וְהָיָ֖ה כְּאֶזְרַ֣ח הָאָ֑רֶץ וְכׇל־עָרֵ֖ל לֹֽא־יֹ֥אכַל בּֽוֹ׃", "onk": "וַאֲרֵי יִתְגַיַר עִמָךְ גִיוֹרָא וְיַעְבֵּד פִּסְחָא <b>קֳדָם<\/b> יְיָ מִגְזַר לֵהּ כָּל דְכוּרָא וּבְכֵן יִקְרַב לְמֶעְבְּדֵהּ וִיהֵי כְּיַצִיבָא דְאַרְעָא וְכָל עַרְלָא לָא יֵכוּל בֵּהּ:", "onk_en": "When a proselyte dwells with you and wants to make the Pesach-offering to [<b>before<\/b>] Adonoy, every male must be circumcised. He may then come near [join] to make it, and be like the native born. But no uncircumcised male may eat of it.", "pj": "וַאֲרוּם יִתְגַּיַּיר עִמְכוֹן גִּיּוֹרָא וְיַעֲבֵד פִּסְחָא קֳדָם יְיָ יִגְזוֹר לֵיהּ כָּל דְּכוּרָא וּבְכֵן יְהֵי כָּשֵׁר לְמֶעֱבְדֵיהּ וִיהֵי כְּיַצִיבָא דְאַרְעָא וְכָל עַרְלָאֵי בַּר יִשְרָאֵל לָא יֵיכוּל בֵּיהּ", "pj_en": "And if a proselyte sojourn with you, and would perform the pascha before the Lord, let every male belonging to him be circumcised, and so be made fit to perform it; and he shall be as the native of the land: but no uncircumcised one of the sons of Israel shall eat thereof.", "tj": "", "tj_en": "", "rashi": "<b>ועשה פסח.<\/b> יָכוֹל כָּל הַמִּתְגַּיֵּר יַעֲשֶׂה פֶּסַח מִיָּד, תַּלְמוּד לוֹמַר <b>והיה כאזרח הארץ<\/b>, מָה אֶזְרָח בְּאַרְבָּעָה עָשָׂר אַף גֵּר בְּאַרְבָּעָה עָשָׂר (שם):<br><br><b>וכל ערל לא יאכל בו.<\/b> לְהָבִיא אֶת שֶׁמֵּתוּ אֶחָיו מֵחֲמַת מִילָה, שֶׁאֵינוֹ מוּמָר לַעֲרֵלוּת וְאֵינוֹ לָמֵד מִ\"בֶּן נֵכָר לֹא יֹאכַל בּוֹ\" (שם):", "rashi_en": "ועשה פסח AND HE WILL KEEP THE PASSOVER (the words may mean, then he shall keep the Passover) — One might think that this verse implies that any-one who becomes a proselyte (גר) must keep the Passover-offering rite immediately after his circumcision (even though this has not taken place just before Passover), therefore Scripture states והיה כאזרח הארץ “but he shall be as a native of the land”. How is it in the case of a native? He brings the offering on the fourteenth! So, too, a proselyte must bring it only on the fourteenth (Mekhilta).<br><br>וכל ערל לא יאכל בו AND NO UNCIRCUMCISED PERSON SHALL EAT THEREOF — This is stated in addition to the somewhat similar text in v. 43 in order to include in the prohibition of eating the Paschal offering any person whose brothers have died in consequence of circumcision (in which case the parents are exempted from circumcising any of their children born after the death of these), because such a one is not to be regarded as an apostate who of set purpose remains uncircumcised, and the law regarding such a one cannot be derived from the statement in v. 43, “no strange person shall eat thereof” (because Rashi has explained this to refer to an Israelite whose doings have estranged him from God)."}, {"ch": 12, "v": 49, "aliyah": 6, "heb": "תּוֹרָ֣ה אַחַ֔ת יִהְיֶ֖ה לָֽאֶזְרָ֑ח וְלַגֵּ֖ר הַגָּ֥ר בְּתוֹכְכֶֽם׃", "onk": "אוֹרַיְתָא חֲדָא יְהֵא לְיַצִיבָא וּלְגִיוֹרָא דְיִתְגַיְרוּן בֵּינֵיכוֹן:", "onk_en": "There shall be one law for the native born and for the proselyte who dwells among you.", "pj": "אוֹרַיְיתָא חָדָא תְּהֵא לְכָל מִצְוָותָא לְיַצִּיבָא וּלְגִיּוֹרָא דִי מִתְגַּיֵּיר בֵּינֵיכוֹן", "pj_en": "One law shall there be as to appointments for the native and for the proselyte who sojourneth among you.", "tj": "", "tj_en": "", "rashi": "<b>תורה אחת וגו'.<\/b> לְהַשְׁווֹת גֵּר לָאֶזְרָח אַף לִשְׁאָר מִצְווֹת שֶׁבַּתּוֹרָה (שם):", "rashi_en": "תורה אחת וגו׳ ONE LAW etc. — This is stated in addition to the similar text in v. 48 in order to declare that the proselyte is equal to the native also in respect to all other commands of the Torah (i. e. the preceding text has reference only to the Paschal offering whilst this is a general statement) (Mekhilta)."}, {"ch": 12, "v": 50, "aliyah": 6, "heb": "וַֽיַּעֲשׂ֖וּ כׇּל־בְּנֵ֣י יִשְׂרָאֵ֑ל כַּאֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֶת־מֹשֶׁ֥ה וְאֶֽת־אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַעֲבָדוּ כָּל בְּנֵי יִשְׂרָאֵל כְּמָא דִי פַקִיד יְיָ יָת משֶׁה וְיָת אַהֲרֹן כֵּן עֲבָדוּ:", "onk_en": "All the B’nei Yisrael did as Adonoy commanded Moshe and Aharon. They [Moshe and Aharon] also did so.", "pj": "וַעֲבָדוּ כָּל בְּנֵי יִשְרָאֵל הֵיכְמָא דְפַּקִּיד יְיָ יַת משֶׁה וְיַת אַהֲרן הֵיכְדֵין עָבָדוּ", "pj_en": "And all the sons of Israel did as the Lord had commanded Mosheh and Aharon, so did they.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 51, "aliyah": 6, "heb": "וַיְהִ֕י בְּעֶ֖צֶם הַיּ֣וֹם הַזֶּ֑ה הוֹצִ֨יא יְהֹוָ֜ה אֶת־בְּנֵ֧י יִשְׂרָאֵ֛ל מֵאֶ֥רֶץ מִצְרַ֖יִם עַל־צִבְאֹתָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲוָה בִּכְרַן יוֹמָא הָדֵין אַפֵּיק יְיָ יָת בְּנֵי יִשְׂרָאֵל מֵאַרְעָא דְמִצְרַיִם עַל חֵילֵיהוֹן:", "onk_en": "On that very day, Adonoy took the B’nei Yisrael out of Egypt in their multitudes.", "pj": "וַהֲוָה בִּכְרַן יוֹמָא הָדֵין אַפֵּיק יְיָ יַת בְּנֵי יִשְרָאֵל מֵאַרְעָא דְמִצְרַיִם עַל חֵילֵיהוֹן", "pj_en": "And it was on that same day that the Lord brought forth the sons of Israel from the land of Mizraim, with their hosts.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 1, "aliyah": 7, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying,", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake unto Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 2, "aliyah": 7, "heb": "קַדֶּשׁ־לִ֨י כׇל־בְּכ֜וֹר פֶּ֤טֶר כׇּל־רֶ֙חֶם֙ בִּבְנֵ֣י יִשְׂרָאֵ֔ל בָּאָדָ֖ם וּבַבְּהֵמָ֑ה לִ֖י הֽוּא׃", "onk": "אַקְדֵשׁ <b>קֳדָמַי<\/b> כָּל בּוּכְרָא פָּתַח כָּל וַלְדָא בִּבְנֵי יִשְׂרָאֵל בֶּאֱנָשָׁא וּבִבְעִירָא דִילִי הוּא:", "onk_en": "“Sanctify to [<b>before<\/b>] Me all the first-born, that [is the first to] open the womb among the B’nei Yisrael, both of man and beast, it is Mine.”", "pj": "אַקְדֵישׁ קֳדָמַי כָּל בּוּכְרָא דְכוּרַיָא פְּתַח כָּל וַולְדָא בִּבְנֵי יִשְרָאֵל בְּאֵינָשָׁא וּבִבְעִירָא דִילִי הוּא", "pj_en": "Sanctify before Me every firstborn male. Whatsoever openeth the womb of all the sons of Israel among men, and (also) among beasts, is Mine.", "tj": "", "tj_en": "", "rashi": "<b>פטר כל רחם.<\/b> שֶׁפָּתַח הָרֶחֶם תְּחִלָּה, כְּמוֹ: \"פּוֹטֵר מַיִם רֵאשִׁית מָדוֹן\" (משלי י\"ז), וְכֵן \"יַפְטִירוּ בְשָׂפָה\" (תהלים כ\"ב) – יִפְתְּחוּ שְׂפָתַיִם:<br><br><b>לי הוא.<\/b> לְעַצְמִי קָנִיתִי, עַ\"יְ שֶׁהִכֵּיתִי בְכוֹרֵי מִצְרַיִם:", "rashi_en": "פטר כל רחם THE FIRST OFFSPRING OF EVERY WOMB — The words mean: that which first openeth the womb, the root פטר meaning to open, as in (Proverbs 17:14) “As one makes an opening (פוטר) for water so is the beginning of strife”; and so, too, is (Psalms 22:8) יפטירו בשפה i. e. “they open the lips”.<br><br>לי הוא IT IS MINE — I have acquired him for Myself through My having smitten the first born of the Egyptians."}, {"ch": 13, "v": 3, "aliyah": 7, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶל־הָעָ֗ם זָכ֞וֹר אֶת־הַיּ֤וֹם הַזֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִמִּצְרַ֙יִם֙ מִבֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּחֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְכֶ֖ם מִזֶּ֑ה וְלֹ֥א יֵאָכֵ֖ל חָמֵֽץ׃", "onk": "וַאֲמַר משֶׁה לְעַמָא הֲווֹ דְכִירִין יָת יוֹמָא הָדֵין דִי נְפַקְתּוּן מִמִצְרַיִם מִבֵּית עַבְדוּתָא אֲרֵי בִּתְקוֹף יְדָא אַפֵּיק יְיָ יָתְכוֹן מִכָּא וְלָא יִתְאֲכֵל חֲמִיעַ:", "onk_en": "Moshe said to the people, “Remember this day [as the day] on which you came out of Egypt, from the house of slavery, for with a strong hand Adonoy brought you out from this. You must not eat chametz.", "pj": "וַאֲמַר משֶׁה לְעַמָּא הֲווֹן דְּכִירִין יַת יוֹמָא הָדֵין דִּי נְפַקְתּוּן פְּרִיקִין מִמִצְרַיִם מִבֵּית שִׁעְבּוּד עֲבָדַיָיא אֲרוּם בִּתְקוֹף גְּבוּרַת יְדָא אַפֵּיק יְיָ יַתְכוֹן מִיכָּא וְלָא יִתְאָכֵל חָמִיעַ", "pj_en": "And Mosheh said to the people, Remember this the day in which you went out free from Mizraim from the house of the bondage of slaves; for by great strength of hand did the Lord bring you forth from thence; and you shall not eat leaven.", "tj": "", "tj_en": "", "rashi": "<b>זכור את היום הזה.<\/b> לִמֵּד, שֶׁמַּזְכִּירִין יְצִיאַת מִצְרַיִם בְּכָל יוֹם:", "rashi_en": "זכור את היום הזה REMEMBER THIS DAY — This teaches that one must make mention of the Exodus from Egypt every day (Mekhilta; cf. Rashi on Deuteronomy 27:9)."}, {"ch": 13, "v": 4, "aliyah": 7, "heb": "הַיּ֖וֹם אַתֶּ֣ם יֹצְאִ֑ים בְּחֹ֖דֶשׁ הָאָבִֽיב׃", "onk": "יוֹמָא דֵין אַתּוּן נָפְקִין בְּיַרְחָא דְאַבִּיבָא:", "onk_en": "On this day you went out, in the month of Aviv [Nissan].", "pj": "יוֹמָא דֵין אַתּוּן נַפְקוּן פְּרִיקִין בַּחֲמֵיסַר בְּנִיסָן הוּא יַרְחָא דְּאַבִּיבָא", "pj_en": "This day you are come out free; on the fifteenth of Nisan, which is the month of Abiba.", "tj": "", "tj_en": "", "rashi": "<b>בחדש האביב.<\/b> וְכִי לֹא הָיִינוּ יוֹדְעִין בְּאֵיזֶה חֹדֶשׁ? אֶלָּא כָּךְ אָמַר לָהֶם, רְאוּ חֶסֶד שֶׁגְּמַלְכֶם, שֶׁהוֹצִיא אֶתְכֶם בְּחֹדֶשׁ שֶׁהוּא כָשֵׁר לָצֵאת, לֹא חַמָּה וְלֹא צִנָּה וְלֹא גְּשָׁמִים, וְכֵן הוּא אוֹמֵר, \"מוֹצִיא אֲסִירִים בַּכּוֹשָׁרוֹת\" (תהלים ס\"ח) – חֹדֶשׁ שֶׁהוּא כָשֵׁר לָצֵאת (מכילתא):", "rashi_en": "בחדש האביב IN THE MONTH ABIB — But would we not know in which month they went out (even though it were not stated here)? But Moses spake to them as follows: See the kindness which God has bestowed on you — that He brought you forth in a month that is fitted for going out, not hot, nor cold nor rainy. In the same sense it says (Psalms 68:7) “He bringeth forth the prisoners בכשרות” i. e. in a month that is fitted (כשר) for going out (Mekhilta)."}, {"ch": 13, "v": 5, "aliyah": 7, "heb": "וְהָיָ֣ה כִֽי־יְבִיאֲךָ֣ יְהֹוָ֡ה אֶל־אֶ֣רֶץ הַֽ֠כְּנַעֲנִ֠י וְהַחִתִּ֨י וְהָאֱמֹרִ֜י וְהַחִוִּ֣י וְהַיְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַאֲבֹתֶ֙יךָ֙ לָ֣תֶת לָ֔ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָ֑שׁ וְעָבַדְתָּ֛ אֶת־הָעֲבֹדָ֥ה הַזֹּ֖את בַּחֹ֥דֶשׁ הַזֶּֽה׃", "onk": "וִיהֵי אֲרֵי יָעֵלִנָךְ יְיָ לְאַרְעָא דִכְנַעֲנָאֵי וְחִתָּאֵי וֶאֱמוֹרָאֵי וְחִוָאֵי וִיבוּסָאֵי דִי קַיִים לַאֲבָהָתָךְ לְמִתַּן לָךְ אַרְעָא <b>עַבְדָא<\/b> חֲלָב וּדְבָשׁ וְתִפְלַח יָת פָּלְחָנָא הָדָא בְּיַרְחָא הָדֵין:", "onk_en": "When Adonoy brings you to the land of the Canaanite, the Chittites, the Emorites, the Chivites and the Yevusites, which He swore to your fathers [that He would] give to you—a land flowing with [<b>producing<\/b>] milk and honey—you must conduct this service in this month.", "pj": "וִיהֵי אֲרוּם יֵיעָלִינָךְ יְיָ אֱלָהָךְ לְאַרַע כְּנַעֲנָאֵי חִיתָּאֵי וְאֵימוֹרָאֵי וְחִיוָאֵי וִיבוּסָאֵי דְּקַיֵּים בְּמֵימְרֵיהּ וּלְאַבְהָתָךְ לְמִיתַּן לָךְ אַרְעָא עַבְדָא חֲלָב וּדְבָשׁ וְתִפְלַח יַת פּוּלְחָנָא הָדָא בְּיַרְחָא הָדֵין", "pj_en": "And it shall be, when the Lord your God shall have brought you into the land of the Kenaanaee, and Hittaee, and Amoraee, and Hivaee, and Jebusaee, which He sware by His Word unto Abraham to give thee, a land producing milk and honey, that thou shalt keep this service in this month.", "tj": "", "tj_en": "", "rashi": "<b>אל ארץ הכנעני וגו'.<\/b> וְאַעַ\"פִּ שֶׁלֹּא מָנָה אֶלָּא חֲמִשָּׁה עֲמָמִין, כָּל ז' גּוֹיִם בְּמַשְׁמָע, שֶׁכֻּלָּן בִּכְלַל כְּנַעֲנִי הֵם וְאַחַת מִמִּשְׁפְּחוֹת כְּנַעַן הָיְתָה שֶׁלֹּא נִקְרָא לָהּ שֵׁם אֶלָּא כְּנַעֲנִי:<br><br><b>נשבע לאבתיך.<\/b> בְּאַבְרָהָם הוּא אוֹמֵר \"בַּיּוֹם הַהוּא כָּרַת ה' אֶת אַבְרָם וְגוֹ'\" (בראשית ט\"ו), וּבְיִצְחָק הוּא אוֹמֵר \"גּוּר בָּאָרֶץ הַזֹּאת\" (שם כ\"ו), וּבְיַעֲקֹב הוּא אוֹמֵר \"הָאָרֶץ אֲשֶׁר אַתָּה שׁוֹכֵב עָלֶיהָ\" (שם כ\"ח):<br><br><b>זבת חלב ודבש.<\/b> חָלָב זָב מִן הָעִזִּים, וְהַדְּבַשׁ זָב מִן הַתְּמָרִים וּמִן הַתְּאֵנִים:<br><br><b>את העבדה הזאת.<\/b> שֶׁל פֶּסַח; וַהֲלֹא כְּבָר נֶאֱמַר לְמַעְלָה \"וְהָיָה כִּי תָבֹאוּ אֶל הָאָרֶץ וְגוֹ'\", וְלָמָּה חָזַר וּשְׁנָאָהּ? בִּשְׁבִיל דָּבָר שֶׁנִּתְחַדֵּשׁ בָּהּ, בְּפָרָשָׁה רִאשׁוֹנָה נֶאֱמַר \"וְהָיָה כִּי יֹאמְרוּ אֲלֵיכֶם בְּנֵיכֶם מָה הָעֲבֹדָה הַזֹּאת לָכֶם\" — בְּבֵן רָשָׁע הַכָּתוּב מְדַבֵּר שֶׁהוֹצִיא אֶת עַצְמוֹ מִן הַכְּלָל, וְכָאן \"וְהִגַּדְתָּ לְבִנְךָ\" — בְּבֵן שֶׁאֵינוֹ יוֹדֵעַ לִשְׁאֹל, וְהַכָּתוּב מְלַמֶּדְךָ, שֶׁתִּפְתַּח לוֹ אַתָּה בְּדִבְרֵי אַגָּדָה הַמּוֹשְׁכִין אֶת הַלֵּב (מכילתא):", "rashi_en": "אל ארץ הכנעני וגו׳ TO THE LAND OF THE CANAANITE — And although it enumerates here only the five peoples, all the seven nations are implied (Mekhilta) for all are included in the generic term Canaanite, although there was one of the races of Canaan which had no other name than that of Canaanite (whilst the other races had, beside the generic name Canaanite, some special designation as Hittite etc.: hence under the term Canaanite one may understand either the one race bearing this name or any of the other races. Here, therefore, the introductory word הכנעני alludes to the particular tribe so called and to the two others included in this generic term, or it may allude to three tribes included in the generic term. In either case we get the “seven peoples of Canaan”).<br><br>נשבע לאבתיך WHICH HE SWORE UNTO THY FATHERS — In the case of Abraham it says, (Genesis 15:18) “On that day the Lord made a covenant with Abram [saying, To thy seed I will give this land]”; in the case of Isaac it says, (Genesis 26:3) “Sojourn in this land … [for to thee and to thy seed I will give all these countries]”; and in the case of Jacob it says, (Genesis 28:13) “the land wheron thou liest [to thee will I give it and to thy seed]” (Mekhilta).<br><br>זבת חלב ודבש FLOWING WITH MILK AND HONEY — milk flows from the goats and honey flows from the dates and from the figs.<br><br>את העבודה הזאת THIS SERVICE — that of the Paschal offering. But has it not already been said above, (Exodus 12:25) “And it shall come to pass when ye be come into the land … [that ye shall keep this service]”? Why then does it repeat it again? On account of a new matter that is introduced here; viz., in the former chapter it says, (v. 26) “And it shall come to pass when your children shall say unto you, What mean ye by this service?” and there Scripture is speaking about a wicked son who excludes himself from the Israelite community (by saying ye, as though he does not wish to participate in the service), whilst here it states, (v. 8) “And thou shalt tell thy son”, referring to a son who does not know how to enquire, and Scripture teaches you that you yourself must open up the conversation with Agadic explanations which attract the heart (cf. Mekhilta; Shabbat 87a)."}, {"ch": 13, "v": 6, "aliyah": 7, "heb": "שִׁבְעַ֥ת יָמִ֖ים תֹּאכַ֣ל מַצֹּ֑ת וּבַיּוֹם֙ הַשְּׁבִיעִ֔י חַ֖ג לַיהֹוָֽה׃", "onk": "שִׁבְעָה יוֹמִין תֵּיכוּל <b>פַּטִירָא<\/b> וּבְיוֹמָא שְׁבִיעָאָה חַגָא קֳדָם יְיָ:", "onk_en": "For seven days you must eat matzos [<b>the matzoh<\/b>], and the seventh day is a festival to Adonoy.", "pj": "שׁוּבְעָא יוֹמִין תֵּיכוּל פַּטִּירָא וּבְיוֹמָא שְׁבִיעָאָה חַגָּא קֳדָם יְיָ", "pj_en": "Seven days shalt thou eat unleavened cakes, and on the seventh day shall be a feast before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 7, "aliyah": 7, "heb": "מַצּוֹת֙ יֵֽאָכֵ֔ל אֵ֖ת שִׁבְעַ֣ת הַיָּמִ֑ים וְלֹֽא־יֵרָאֶ֨ה לְךָ֜ חָמֵ֗ץ וְלֹֽא־יֵרָאֶ֥ה לְךָ֛ שְׂאֹ֖ר בְּכׇל־גְּבֻלֶֽךָ׃", "onk": "<b>פַּטִיר<\/b> יִתְאֲכֵל יָת שִׁבְעַת יוֹמִין וְלָא יִתְחֲזֵי לָךְ חֲמִיעַ וְלָא יִתְחֲזֵי לָךְ חֲמִיר בְּכָל תְּחוּמָךְ:", "onk_en": "Matzos [<b>Matzoh<\/b>] must be eaten these seven days. No chametz may be seen in your possession, and no leaven may be seen in all your boundaries.", "pj": "פַּטִּירֵי יִתְאָכֵיל יַת שׁוּבְעָא יוֹמִין וְלָא יִתְחָמֵי לָךְ חָמִיעַ וְלָא יִתְחָמֵי לָךְ חֲמִיר בְּכָל תְּחוּמָךְ", "pj_en": "Unleavened cakes shall be eaten seven days, and nothing leavened shall be seen with thee, nor leaven itself be seen with thee in all thy borders.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 8, "aliyah": 7, "heb": "וְהִגַּדְתָּ֣ לְבִנְךָ֔ בַּיּ֥וֹם הַה֖וּא לֵאמֹ֑ר בַּעֲב֣וּר זֶ֗ה עָשָׂ֤ה יְהֹוָה֙ לִ֔י בְּצֵאתִ֖י מִמִּצְרָֽיִם׃", "onk": "וּתְחַוֵי לִבְרָךְ בְּיוֹמָא הַהוּא לְמֵימָר בְּדִיל דֵין עֲבַד יְיָ לִי בְּמִפְּקִי מִמִצְרָיִם:", "onk_en": "You must tell your son [child] on that day saying, ‘Because of this, Adonoy did [this] for me when I came out of Egypt.’", "pj": "וְתִתְנֵי לִבְרָךְ בְּיוֹמָא הַהוּא לְמֵימָר מִן בִּגְלַל מִצְוָותָא דָא עֲבַד מֵימְרָא דַיְיָ לִי נִיסִין וּפְרִישִׁין בְּמִפְקֵי מִמִּצְרָיִם", "pj_en": "And thou shalt instruct thy son on that day, saying, This precept is on account of what the Word of the Lord did for me in miracles and wonders, in bringing me forth from Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>בעבור זה.<\/b> בַּעֲבוּר שֶׁאֲקַיֵּם מִצְווֹתָיו, כְּגוֹן פֶּסַח מַצָּה וּמָרוֹר הַלָּלוּ:<br><br><b>עשה ה' לי.<\/b> רָמַז תְּשׁוּבָה לְבֵן רָשָׁע, לוֹמַר עָשָׂה ה' לִי, וְלֹא לְךָ, שֶׁאִלּוּ הָיִיתָ שָׁם לֹא הָיִיתָ כְדַאי לִגָּאֵל (מכילתא):", "rashi_en": "בעבור זה FOR THE SAKE OF THIS — for the sake that I should carry out His commands, such as this Passover offering, this unleavened bread and this bitter herb (cf. Mekhilta).<br><br>עשה ה' לי GOD DID FOR ME — Here is an indication of the reply to be given to the wicked son: that one should say to him, “God did for me” — and one should not say “what God did לנו, for us” — thus implying “not for thee”, for if thou hadst been there (in Egypt) thou wouldst not have been regarded as worthy of being redeemed (Mekhilta)."}, {"ch": 13, "v": 9, "aliyah": 7, "heb": "וְהָיָה֩ לְךָ֨ לְא֜וֹת עַל־יָדְךָ֗ וּלְזִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔יךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהֹוָ֖ה בְּפִ֑יךָ כִּ֚י בְּיָ֣ד חֲזָקָ֔ה הוֹצִֽאֲךָ֥ יְהֹוָ֖ה מִמִּצְרָֽיִם׃", "onk": "וִיהֵי לָךְ לְאָת עַל יְדָךְ וּלְדָכְרָנָא בֵּין עֵינָיךְ בְּדִיל תְּהֵי אוֹרַיְתָא דַיְיָ בְּפוּמָךְ אֲרֵי בִּידָא תַקִיפָא אַפְּקָךְ יְיָ מִמִצְרָיִם:", "onk_en": "It shall be to you as a sign on your hand, and for a reminder between your eyes, so that Adonoy’s teachings will be in your mouth, for with a strong hand Adonoy brought you out of Egypt.", "pj": "וִיהֵי לָךְ נִיסָא הָדֵין חֲקִיק וּמְפָרַשׁ עַל תְּפִילַת יְדָא בְּגוּבְהָא דִשְמָאלָךְ וּלְדוּכְרָן חֲקִיק וּמְפָרַשׁ עַל תְּפִלַּת רֵישָׁא קְבִיעָא כָּל קָבֵיל עֵינָךְ בְּגוּבְהָא לְרֵישָׁךְ מִן בִּגְלַל דְּתִיהֲוֵי אוֹרַיְיתָא דַיְיָ בְּפוּמָךְ אֲרוּם בְּחֵיל יְדָא תַקִיפְתָּא הַנְפָקָךְ יְיָ מִמִּצְרָיִם", "pj_en": "And this miracle shall be inscribed and set forth upon the tephilla of the hand, on the top of thy left (arm,) and for a memorial inscribed and set forth upon the tephilla of thy head, set between thine eyes on thy forehead; that the law of the Lord may be in thy mouth, because in strength, with a mighty hand, the Lord brought thee forth from Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>והיה לך לאות.<\/b> יְצִיאַת מִצְרַיִם תִּהְיֶה לְךָ <b>לאות<\/b>:<br><br><b>על ידך ולזכרון בית עיניך.<\/b> שֶׁתִּכְתֹּב הַפָּרָשִׁיּוֹת הַלָּלוּ וְתִקְשְׁרֵם בָּרֹאשׁ וּבַזְּרוֹעַ:<br><br><b>על ידך.<\/b> עַל יַד שְׂמֹאל, לְפִיכָךְ יָדְכָה מָלֵא בְּפָרָשָׁה שְׁנִיָּה, לִדְרֹשׁ בָּהּ יָד שֶׁהִיא כֵהָה (מנחות ל\"ו):", "rashi_en": "והיה לך לאות AND IT SHALL BE FOR A SIGN UNTO THEE — i. e. the Exodus from Egypt shall be to thee as a sign<br><br>על ידך ולזכרון בין עיניך UPON THINE HAND AND AS A MEMORIAL BETWEEN THINE EYES — meaning, that you shall write these paragraphs (verses 1—10 and 11—16) and bind them upon the head and upon the arm.<br><br>על ידך UPON THY HAND — on the left hand; that is why the word is written יָדְכָה in its full form (not יָדְךָ) in the second section (v. 16), so that we should explain it (by dividing this word into two: יד כה) as meaning the hand that is weak (כהה) (Menachot 36b)."}, {"ch": 13, "v": 10, "aliyah": 7, "heb": "וְשָׁמַרְתָּ֛ אֶת־הַחֻקָּ֥ה הַזֹּ֖את לְמוֹעֲדָ֑הּ מִיָּמִ֖ים יָמִֽימָה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִטַר יָת קְיָמָא הָדָא לְזִמְנֵהּ מִזְמַן לִזְמָן:", "onk_en": "You must preserve this statute in its appointed time, from year to year.", "pj": "וְתִנְטוֹר יַת קְיָימָא הָדָא דִתְפִילֵי לְזִימְנָא דְחָזֵי לָהּ בְּיוֹמֵי עוֹבָדָא וְלָא בְּשַׁבַּיָיא וּבְמוֹעֲדַיָא וּבִימָמָא וְלָא בְּלֵילְיָא", "pj_en": "Thou shalt therefore keep this statute of the Tephillin in the season to which it belongs, on work days, not on sabbaths or solemnities; and by day, not by night.", "tj": "מִן אִלֵּין יוֹמִין לְאִלֵּין יַרְחִין:", "tj_en": "From these days to those months.", "rashi": "<b>מימים ימימה.<\/b> מִשָּׁנָה לְשָׁנָה (שם):", "rashi_en": "מימים ימימה means FROM YEAR TO YEAR (ימים frequently signifies a year) (Menachot 36b)."}, {"ch": 13, "v": 11, "aliyah": 7, "heb": "וְהָיָ֞ה כִּֽי־יְבִאֲךָ֤ יְהֹוָה֙ אֶל־אֶ֣רֶץ הַֽכְּנַעֲנִ֔י כַּאֲשֶׁ֛ר נִשְׁבַּ֥ע לְךָ֖ וְלַֽאֲבֹתֶ֑יךָ וּנְתָנָ֖הּ לָֽךְ׃", "onk": "וִיהֵי אֲרֵי יָעֵלִנָךְ יְיָ לְאַרְעָא דִכְנַעֲנָאֵי כְּמָא דִי קַיִים לָךְ וְלַאֲבָהָתָךְ וְיִתְּנִנַהּ לָךְ:", "onk_en": "When Adonoy brings you to the land of the Canaanites as He swore to you and to your fathers; and He will have given it to you.", "pj": "וִיהֵי אֲרוּם יָעֵלִינָךְ יְיָ לְאַרְעָא דְכְנַעֲנָאֵי הֵיכְמָא דְקַיֵּים לָךְ וּלְאַבְהָתָךְ וְיִתְּנִינָהּ לָךְ", "pj_en": "And when I the Lord have brought thee into the land of the Kenaanaee, which I have sworn to thee and to thy fathers to give thee,", "tj": "", "tj_en": "", "rashi": "(<b>והיה כי יבאך.<\/b> יֵשׁ מֵרַבּוֹתֵינוּ שֶׁלָּמְדוּ מִכָּאן שֶׁלֹּא קָדְשׁוּ בְּכוֹרוֹת הַנּוֹלָדִים בַּמִּדְבָּר, וְהָאוֹמֵר קָדְשׁוּ, מְפָרֵשׁ בִּיאָה זוֹ אִם תְּקַיְּמוּהוּ בַמִּדְבָּר תִּזְכּוּ לִכָּנֵס לָאָרֶץ וּתְקַיְּמוּהוּ שָׁם):<br><br><b>נשבע לך.<\/b> וְהֵיכָן נִשְׁבַּע לְךָ? \"וְהֵבֵאתִי אֶתְכֶם אֶל הָאָרֶץ אֲשֶׁר נָשָׂאתִי וְגוֹ'\" (שמות ו'):<br><br><b>ונתנה לך.<\/b> תְּהֵא בְעֵינֶיךָ כְּאִלּוּ נִתְּנָה לְךָ בּוֹ בַּיּוֹם, וְאַל תְּהִי בְעֵינֶיךָ כִּירֻשַּׁת אָבוֹת:", "rashi_en": "והיה כי יביאך AND IT SHALL COME TO PASS WHEN [THE LORD] SHALL BRING THEE … [THOU SHALT SET APART etc.] — There are some of our Rabbis who learned from this statement that the firstborn who were born in the wilderness were not thus hallowed. He who says that these were thus hallowed explains this “coming” (i. e. this verse, which appears to make the hallowing of the firstborn dependent upon their arrival in the land) as follows: if you observe it (this command) in the wilderness, you will be privileged to enter the land and to observe it there (cf. Bekhorot 4b).<br><br>נשבע לך HE SWORE UNTO THEE — And where did He swear this unto thee? (Exodus 6:8) “And I will bring you unto the land concerning which I did lift up my hand etc.” (cf. Rashi on this verse where he explains that “lifting up the hand” denotes taking an oath) (Mekhilta).<br><br>ונתנה לך AND SHALL GIVE IT TO THEE Let it be in thine eyes (regard it) as though He had given it to thee on that same day (when on each occasion you carry out this command) and do not regard it as an inheritance from your ancestors (Mekhilta)."}, {"ch": 13, "v": 12, "aliyah": 7, "heb": "וְהַעֲבַרְתָּ֥ כׇל־פֶּֽטֶר־רֶ֖חֶם לַֽיהֹוָ֑ה וְכׇל־פֶּ֣טֶר&thinsp;<b>׀<\/b> שֶׁ֣גֶר בְּהֵמָ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה לְךָ֛ הַזְּכָרִ֖ים לַיהֹוָֽה׃", "onk": "וְתַעְבַּר כָּל פָּתַח וַלְדָא <b>קֳדָם<\/b> יְיָ וְכָל פָּתַח וְלַד בְּעִירָא דִי יְהֵי לָךְ דִכְרִין <b>תַּקְדֵשׁ קֳדָם<\/b> יְיָ:", "onk_en": "[At that time] you must pass on, [set aside] every one that [is first to] open the womb, to [<b>before<\/b>] Adonoy. Every firstling that is dropped [born] by animals that belong to you, the males shall belong to [<b>be consecrated before<\/b>] Adonoy.", "pj": "וְתַפְרֵשׁ כָּל פְּתַח וַולְדָא קֳדָם יְיָ וְכָל פְּתַח וַולְדָא בְּעִירָא דְּמֵשַׁגְרָא אִמֵּיהּ דִּיהוֹן לִיךְ דִּכְרִין תַּקְדֵּישׁ קֳדָם יְיָ", "pj_en": "thou shalt set apart before the Lord every one that openeth the womb; and every animal that its dam beareth and that openeth the womb if it be to thee a male thou shalt sanctify before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>והעברת.<\/b> אֵין וְהַעֲבַרְתָּ אֶלָּא לְשׁוֹן הַפְרָשָׁה, וְכֵן הוּא אוֹמֵר \"וְהַעֲבַרְתָּ אֶת נַחֲלָתוֹ לְבִתּוֹ\" (במדבר כ\"ז) (מכילתא):<br><br><b>שגר בהמה.<\/b> נֵפֶל שֶׁשִּׁגְּרַתּוּ אִמּוֹ וְשִׁלְּחַתּוּ בְּלֹא עִתּוֹ; וְלִמֶּדְךָ הַכָּתוּב שֶׁהוּא קָדוֹשׁ בִּבְכוֹרָה לִפְטֹר אֶת הַבָּא אַחֲרָיו וְאַף שֶׁאֵין נֵפֶל קָרוּי שֶׁגֶר, כְּמוֹ \"שְׁגַר אֲלָפֶיךָ\" (דברים ז'), אֲבָל זֶה לֹא בָא אֶלָּא לְלַמֵּד עַל הַנֵּפֶל שֶׁהֲרֵי כְבָר כָּתַב כָּל פֶּטֶר רֶחֶם. וְאִ\"תֹּ אַף בְּכוֹר בְּהֵמָה טְמֵאָה בְּמַשְׁמָע, בָּא וּפֵרֵשׁ בְּמָקוֹם אַחֵר \"בִּבְקָרְךָ וּבְצֹאנְךָ\" (דברים ט\"ו). לָשׁוֹן אַחֵר יֵשׁ לְפָרֵשׁ, \"וְהַעֲבַרְתָּ כָל פֶּטֶר רֶחֶם\" — בִּבְכוֹר אָדָם הַכָּתוּב מְדַבֵּר:", "rashi_en": "והעברת This word והעברת is an expression for “setting apart”. Similarly it says, (Numbers 27:8) “And ye shall set his inheritance apart (והעברתם) for his daughter” (Mekhilta).<br><br>שגר בהמה DROPPED BY BEAST— a premature birth; and this is termed שגר because its mother casts it out (שגר) and expels it (שלחתו) from the womb before its due time (שגר is a synonym of שלח “to let go”). Scripture teaches you that although it is a premature birth it is nevertheless holy by reason of its being first born, in so far that it exempts from the law regarding the firstborn the young that comes (is born) after it (Mekhilta). It is true that an animal that is not a premature birth) is also called שגר, as (Deuteronomy 7:13) “the שגר of thy kine” (where it speaks of blessing this, and it is therefore evident that it cannot there denote a premature birth), but this שגר (i. e. its use here) is intended only to tell us something about a premature birth, because, you see, it has already written in this verse: “Every first offspring of the womb”! And if you say that also the firstborn of an unclean animal (and not a premature birth) is implied by שגר (and that this also must be hallowed) then I reply that Scripture comes and expressly states in another passage, (Deuteronomy 15:19) “[All the firstling males that are born] of thy herd and of thy flocks (thus only clean animals) [shalt thou sanctify etc.]”. Another meaning may be given in explanation of והעברת כל פטר רחם “thou shalt set apart every first born of the womb” — viz., that Scripture by the term פטר רחם is speaking of the firstborn of man (consequently the following words, שגר בהמה, need not denote an animal of premature birth, but an animal born in the natural course as it certainly means in Deuteronomy 7:13, and we thus avoid the necessity of here assigning to שגר a meaning different from that which it bears in the latter passage)."}, {"ch": 13, "v": 13, "aliyah": 7, "heb": "וְכׇל־פֶּ֤טֶר חֲמֹר֙ תִּפְדֶּ֣ה בְשֶׂ֔ה וְאִם־לֹ֥א תִפְדֶּ֖ה וַעֲרַפְתּ֑וֹ וְכֹ֨ל בְּכ֥וֹר אָדָ֛ם בְּבָנֶ֖יךָ תִּפְדֶּֽה׃", "onk": "וְכָל פָּתַח (בּוּכְרָא) דַחֲמָרָא תִּפְרוֹק בְּאִמְרָא וְאִם לָא תִפְרוֹק וְתִנְקְפֵהּ וְכָל בּוּכְרָא דַאֲנָשָׁא בִּבְנָיךְ תִּפְרוֹק:", "onk_en": "Redeem each firstling donkey with a sheep. If it is not redeemed, you must break its neck. Redeem every first-born male among your sons.", "pj": "וְכָל פְּתַח וַולְדָא דְחַמְרָא תִּפְרוֹק בְּאִימְרָא וְאִין לָא תִפְרוֹק וְתִנְקוֹף יָתֵיהּ וְכָל בּוּכְרָא דְּאֵינָשָׁא בִּבְרָךְ תִּפְרוֹק בְּכַסְפָּא וְלָא בְּעַבְדָךְ תִּפְרוֹק", "pj_en": "And every ass that openeth the womb thou shalt redeem with a lamb; and if thou redeem him not, thou shalt cut him off; and every firstborn man (child) among thy sons thou shalt redeem; but thy servant thou mayest not redeem with money.", "tj": "וּתְקַטְלוּן יָתֵיהּ:", "tj_en": "Thou shalt kill him.", "rashi": "<b>פטר חמור.<\/b> וְלֹא פֶּטֶר שְׁאָר בְּהֵמָה טְמֵאָה; וּגְזֵרַת הַכָּתוּב הִיא לְפִי שֶׁנִּמְשְׁלוּ בְּכוֹרֵי מִצְרַיִם לַחֲמוֹרִים; וְעוֹד, שֶׁסִּיְּעוּ אֶת יִשְׂרָאֵל בִּיצִיאָתָן, שֶׁאֵין לְךָ אֶחָד מִיִּשְׂרָאֵל שֶׁלֹּא נָטַל הַרְבֵּה חֲמוֹרִים מִמִּצְרַיִם טְעוּנִים מִכַּסְפָּם וּמִזְּהָבָם שֶׁל מִצְרִים:<br><br><b>תפדה בשה.<\/b> נוֹתֵן שֶׂה לַכֹּהֵן וּפֶטֶר חֲמוֹר מֻתָּר בַּהֲנָאָה וְהַשֶּׂה חֻלִּין בְּיַד כֹּהֵן (בכורות ט'):<br><br><b>וערפתו.<\/b> עוֹרְפוֹ בְּקוֹפִיץ מֵאֲחוֹרָיו וְהוֹרְגוֹ; הוּא הִפְסִיד מָמוֹנוֹ שֶׁל כֹּהֵן, לְפִיכָךְ יַפְסִיד מָמוֹנוֹ (שם י'):<br><br><b>וכל בכור אדם בבניך תפדה.<\/b> חָמֵשׁ סְלָעִים פִּדְיוֹנוֹ קָצוּב בְּמָקוֹם אַחֵר (במדבר י\"ח):", "rashi_en": "פטר חמור AND EVERY FIRST OFFSPRING OF AN ASS — but not the first offspring of other unclean animals. This exception is the enactment of Scripture, because the firstborn of the Egyptians are compared to asses (Ezekiel 23:20; Bereishit Rabbah 96); and a further reason for this exception is because they (the asses) were of assistance to the Israelites when they left Egypt, for there was not a single Israelite who did not take with him from Egypt several asses laden with the silver and gold of Egypt. (Bekhorot 5b).<br><br>תפדה בשה THOU SHALT REDEEM WITH A LAMB — one gives a lamb to the priest, and the first offspring of the ass is then permitted to be made use of, whilst the lamb remains in the priest’s possession with the character of a non-holy object (חולין — an ordinary animal) (cf. Bekhorot 9b).<br><br>וערפתו THEN THOU SHALT BREAK ITS NECK — one breaks its neck with a hatchet from behind and so slays it (Bekhorot 13a). The reason is: he (the owner of the ass) has caused a loss to the possessions of the priest (by not giving him the lamb), therefore must he suffer loss in his own possessions (Mekhilta d['Rabbi Yishmael 13:13:2).<br><br>וכל בכור בניך תפדה AND ALL THE FIRSTBORN OF MAN AMONGST THY SONS SHALT THOU REDEEM — His redemption money is fixed in another passage (Numbers 18:16) at five Sela’im."}, {"ch": 13, "v": 14, "aliyah": 7, "heb": "וְהָיָ֞ה כִּֽי־יִשְׁאָלְךָ֥ בִנְךָ֛ מָחָ֖ר לֵאמֹ֣ר מַה־זֹּ֑את וְאָמַרְתָּ֣ אֵלָ֔יו בְּחֹ֣זֶק יָ֗ד הוֹצִיאָ֧נוּ יְהֹוָ֛ה מִמִּצְרַ֖יִם מִבֵּ֥ית עֲבָדִֽים׃", "onk": "וִיהֵי אֲרֵי יִשְׁאֲלִנָךְ בְּרָךְ מְחָר לְמֵימַר מָא דָא וְתֵימַר לֵהּ בִּתְקוֹף יְדָא אַפְּקָנָא יְיָ מִמִצְרַיִם מִבֵּית עַבְדוּתָא:", "onk_en": "When your son asks you at a later time saying ‘What is this?’ You should say to him, “With a strong hand Adonoy brought us out of Egypt from the house of slavery.", "pj": "וִיהֵי אֲרוּם יְשַׁיְילִינָךְ בְּרָךְ מְחַר לְמֵימַר מַה דָּא מִצְוָותָא דְבוּכְרַיָיא וְתֵימַר לֵיהּ בִּתְקוֹף יְדָא אַפְקָנָא יְיָ מִמִּצְרַיִם פְּרִיקִין מִבֵּית שִׁעֲבּוּד עַבְדַיָא", "pj_en": "And when in future thy son shall ask thee, saying, What is this ordinance of the firstborn? thou shalt tell him: By the power of a mighty hand the Lord delivered us from Mizraim, redeeming us from the house of the servitude of slaves.", "tj": "", "tj_en": "", "rashi": "<b>כי ישאלך בנך מחר.<\/b> יֵשׁ מָחָר שֶׁהוּא עַכְשָׁיו וְיֵשׁ מָחָר שֶׁהוּא לְאַחַר זְמַן, כְּגוֹן זֶה, וּכְגוֹן \"וְלֹא יֹאמְרוּ בְנֵיכֶם מָחָר לְבָנֵינוּ\" (יהושע כ\"ב), דִּבְנֵי גָד וְדִבְנֵי רְאוּבֵן:<br><br><b>מה זאת.<\/b> זֶה תִּינוֹק טִפֵּשׁ שֶׁאֵינוֹ יוֹדֵעַ לְהַעֲמִיק שְׁאֵלָתוֹ וְסוֹתֵם וְשׁוֹאֵל \"מַה זֹּאת?\", וּבְמָקוֹם אַחֵר הוּא אוֹמֵר \"מָה הָעֵדֹת וְהַחֻקִּים וְהַמִּשְׁפָּטִים וְגוֹ'\" (דברים ו'), הֲרֵי זֹאת שְׁאֵלַת בֵּן חָכָם; דִּבְּרָה תוֹרָה כְּנֶגֶד אַרְבָּעָה בָנִים — רָשָׁע, וְשֶׁאֵינוֹ יוֹדֵעַ לִשְׁאֹל, וְהַשּׁוֹאֵל דֶּרֶךְ סְתוּמָה, וְהַשּׁוֹאֵל דֶּרֶךְ חָכְמָה (מכילתא):", "rashi_en": "כי ישאלך בנך מחר WHEN THY SON ASKETH THEE מחר — There is a usage of the word מחר that refers to “now” (i. e. to the period of time that is nearest to “now” viz., to-morrow), and there is another usage of מחר that refers to a day following after the lapse of some time, as, for example, this מחר here and as, for example, (Joshua 22:27) “That your children may not say to our children in time to come (מחר)” which occurs in the chapter about the sons of Gad and the sons of Reuben (Mekhilta).<br><br>מה זאת WHAT IS THIS? — This is the question of a dull child who has not sufficient understanding to question very profoundly and who therefore asks in an indefinite fashion, “What is this?” In another passage (Deuteronomy 6:20) it states, “[When thy son asketh thee…], What mean the testimonies and the statutes and the judgments … [which the Lord our God hath commanded you?]” This, however, is the question of a wise son. The Torah in mentioning four different explanations of the Passover sacrifice-rite to be given by a father to his children, is speaking in reference to four different types of son: the wicked son (12:25 and in the second half of 13:8), and one who has not sufficient understanding how to ask (in the first half of 13:8), and one who asks in an indefinite manner (13:14), and one who asks in a wise fashion (Deuteronomy 6:20) (cf. Mekhilta; Jerusalem Talmud Pesachim 10:4)."}, {"ch": 13, "v": 15, "aliyah": 7, "heb": "וַיְהִ֗י כִּֽי־הִקְשָׁ֣ה פַרְעֹה֮ לְשַׁלְּחֵ֒נוּ֒ וַיַּהֲרֹ֨ג יְהֹוָ֤ה כׇּל־בְּכוֹר֙ בְּאֶ֣רֶץ מִצְרַ֔יִם מִבְּכֹ֥ר אָדָ֖ם וְעַד־בְּכ֣וֹר בְּהֵמָ֑ה עַל־כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽיהֹוָ֗ה כׇּל־פֶּ֤טֶר רֶ֙חֶם֙ הַזְּכָרִ֔ים וְכׇל־בְּכ֥וֹר בָּנַ֖י אֶפְדֶּֽה׃", "onk": "וַהֲוָה אֲרֵי אַקְשֵׁי פַרְעֹה לְשַׁלָחוּתָנָא וּקְטַל יְיָ כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מִבּוּכְרָא דַאֲנָשָׁא וְעַד בּוּכְרָא דִבְעִירָא עַל כֵּן אֲנָא דָבַח <b>קֳדָם<\/b> יְיָ כָּל פָּתַח וַלְדָא דִכְרִין וְכָל בּוּכְרָא דִבְנַי אֶפְרוֹק:", "onk_en": "When Pharaoh stubbornly refused to send us out, Adonoy killed every first-born in the land of Egypt, from the first-born of man to the first-born of beast. I am therefore sacrificing to [<b>before<\/b>] Adonoy all that [is first to] open the womb which are male, and the first-born of my sons I redeem.’", "pj": "וַהֲוָה כַּד אַקְשֵׁי מֵימְרָא דַיְיָ יַת לִבָּא דְפַרְעה לְמִפְטְרָנָא וְקָטַל יְיָ כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מִן בּוּכְרָא דְּאֵינָשָׁא וְעַד בּוּכְרָא דִבְעִירָא בְּגִין כֵּן אֲנָא דַבַּח קֳדָם יְיָ כָּל פְּתַח וַולְדָא דוּכְרַיָיא וְכָל בּוּכְרָא דִבְרַיי אֶפְרוֹק בְּכַסְפָּא", "pj_en": "And when the Word of the Lord had hardened the heart of Pharoh (that be would) not deliver us, he killed all the firstborn in the land of Mizraim, from the firstborn of man to the firstborn of cattle; therefore do I sacrifice before the Lord every male that openeth the womb, and every firstborn of my sons I redeem with silver.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 16, "aliyah": 7, "heb": "וְהָיָ֤ה לְאוֹת֙ עַל־יָ֣דְכָ֔ה וּלְטוֹטָפֹ֖ת בֵּ֣ין עֵינֶ֑יךָ כִּ֚י בְּחֹ֣זֶק יָ֔ד הוֹצִיאָ֥נוּ יְהֹוָ֖ה מִמִּצְרָֽיִם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיהֵי לְאָת עַל יְדָךְ וְלִתְפִלִין בֵּין עֵינָיךְ אֲרֵי בִּתְקוֹף יְדָא אַפְּקָנָא יְיָ מִמִצְרָיִם:", "onk_en": "[These words] shall be a sign on your hand and for totafos [<b>phylacteries<\/b>] between your eyes, for with a strong hand Adonoy brought us out of Egypt.”", "pj": "וִיהֵי לְאַת חֲקִיק וּמְפָרֵשׁ עַל יַד שְמָאלָךְ וְלִתְפִילִין בֵּין רִיסֵי עֵינָךְ אֲרוּם בִּתְקוֹף גְּבוּרַת יְדָא הַנְפָקָנָא יְיָ מִמִּצְרָיִם", "pj_en": "And it shall be inscribed and set forth upon thy left land, and on the tephilla between thine eyebrows; because by mighty strength of hand the Lord brought us out of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ולטוטפת.<\/b> תְּפִלִּין; וְעַל שֵׁם שֶׁהֵם אַרְבָעָה בָתִּים קְרוּיִין <b>טטפת<\/b> – \"טט\" בְּכַתְפִּי שְׁתַּיִם, \"פת\" בְּאַפְרִיקִי שְׁתַּיִם (סנהדרין ד'). וּמְנַחֵם חִבְּרוֹ עִם \"וְהַטֵּף אֶל דָּרוֹם\" (יחזקאל כ\"א), \"אַל תַּטִּיפוּ\" (מיכה ב'), לְשׁוֹן דִּבּוּר, כְּמוֹ וּלְזִכָּרוֹן, שֶׁהָרוֹאֶה אוֹתָם קָשׁוּר בֵּין הָעֵינַיִם, יִזְכֹּר הַנֵּס וִידַבֵּר בּוֹ:", "rashi_en": "ולטטפת this denotes the Tephillin; and because they consist of four houses (compartments) they are called טטפת, for טט denotes “two” in Katpi and פת in Afriki denotes “two״ (Sanhedrin 4b). Menachem ben Seruk, however, placed it in the same section (gave it the same meaning) as, (Ezekiel 21:2) “And speak (הטף) to the south״; and as, (Micah 2:6) “speak ye (תטיפו) not”; so that טטפת would be an expression denoting “speaking”, and corresponds to ולזכרון (in v. 9 where it really replaces טוטפת), because whoever sees them (the Tephillin) bound between the eyes will remember the miracle (so that they become a זכרון, a reminder) and will speak about it (so that they become a טטפת. something that causes one to speak about the miracle)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
