נָשִׁים וָטָף (שם):", "rashi_en": "לא נתן סיחון וגו׳ AND SIHON WOULD NOT SUFFER [ISRAEL TO PASS THROUGH HIS BOUNDARY] — For all the Canaanite kings paid him tribute, because he protected them that no hostile forces should pass through his land against them. As soon as Israel said to him, “Let me pass through they land”, he answered them: “The whole purpose of my dwelling here is to protect them against you, and yet you speak thus!” (Midrash Tanchuma, Chukat 23).<br><br>ויצא לקראת ישראל AND HE WENT OUT AGAINST ISRAEL — Even if Heshbon had been full of people as puny as gnats, no human being could have captured it, and if Sihon had been (resided) in a weak village no human being could have overcome him. How much the more was he invincible whilst he dwelt in Heshbon. Therefore the Holy One, blessed be He, said: Why should I trouble My children to all this extent, to besiege each city? He therefore put it into the hearts of all the men of war to go forth from the cities, and they assembled all of them in one spot, and there they fell in battle; from there Israel proceeded to the cities and there were none to resist them, for there were only women and children there (Midrash Tanchuma, Chukat 23)."}, {"ch": 21, "v": 24, "aliyah": 4, "heb": "וַיַּכֵּ֥הוּ יִשְׂרָאֵ֖ל לְפִי־חָ֑רֶב וַיִּירַ֨שׁ אֶת־אַרְצ֜וֹ מֵֽאַרְנֹ֗ן עַד־יַבֹּק֙ עַד־בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן׃", "onk": "וּמְחָהִי יִשְׂרָאֵל לְפִתְגַּם דְּחָרֶב וִירֵת יָת אַרְעֵיהּ מֵאַרְנוֹנָא עַד יוּבְקָא עַד בְּנֵי עַמּוֹן אֲרֵי תַקִּיף תְּחוּמָא דִּבְנֵי עַמּוֹן:", "onk_en": "Yisroel defeated him with the edge of the sword and took possession of his land; from Arnon to the Yabok, as far as Amon[’s border], because Amon’s border was impregnable.", "pj": "וּמְחוֹהִי יִשְרָאֵל בִּשְׁמָתָא דַיְיָ דְקַטְלָא כְּפִתְגַם דְחָרֶב וְיָרִית יַת אַרְעֵיהּ מֵאַרְנוֹנָא עַד יוּבְקָא עַד תְּחוּם בְּנֵי עַמוֹן אֲרוּם תַּקִיף הֲוָת רַבַּת תְּחוּם בְּנֵי עַמוֹן וְעַד כְּדוֹן אִית לְהוֹן אָרְכָּא", "pj_en": "And Israel smote him with the anathema of the Lord, that he would destroy (him) with the edge of the sword; and he took possession of his country, from Arnon unto the Jabbok, unto the border of the children of Ammon; because Rabbath, which is the limit of the children of Ammon, was strong; and so far was their boundary.", "tj": "", "tj_en": "", "rashi": "<b>כי עז.<\/b> וּמַהוּ חָזְקוֹ? הַתְרָאָתוֹ שֶׁל הַקָּבָּ\"ה שֶׁאָמַר לָהֶם אַל תְּצֻרֵם וְגוֹ' (דברים ב'):", "rashi_en": "כי עז FOR [THE BOUNDARY OF THE CHILDREN OF AMMON] WAS STRONG — And what constituted its strength? The warning of the Holy One, blessed be He, who had said to them (the Israelites), (Deuteronomy 2:19), Harass them not, etc.”."}, {"ch": 21, "v": 25, "aliyah": 4, "heb": "וַיִּקַּח֙ יִשְׂרָאֵ֔ל אֵ֥ת כׇּל־הֶעָרִ֖ים הָאֵ֑לֶּה וַיֵּ֤שֶׁב יִשְׂרָאֵל֙ בְּכׇל־עָרֵ֣י הָֽאֱמֹרִ֔י בְּחֶשְׁבּ֖וֹן וּבְכׇל־בְּנֹתֶֽיהָ׃", "onk": "<b>וּכְבַשׁ<\/b> יִשְׂרָאֵל יָת כָּל קִרְוַיָּא הָאִלֵּין וִיתֵב יִשְׂרָאֵל בְּכָל קִרְוֵי אֱמוֹרָאָה בְּחֶשְׁבּוֹן וּבְכָל <b>כַּפְרָנָהָא<\/b>:", "onk_en": "Yisroel took [<b>captured<\/b>] all these cities; Yisroel settled in all the cities of the Emorite, in Cheshbon and all its daughters [<b>villages<\/b>].", "pj": "וּנְסֵיב יִשְרָאֵל יַת כָּל קִרְוַיָא הָאִלֵין וִיתֵיב יִשְרָאֵל בְּכָל קִרְוֵי אֱמוֹרָאֵי בְּחֶשְׁבּוֹן וּבְכָל כַּפְרָנָהָא", "pj_en": "And Israel took all those cities, and dwelt in all the cities of the Amorites, in Heshbon, and in all her villages.", "tj": "", "tj_en": "", "rashi": "<b>בנתיה.<\/b> כְּפָרִים הַסְּמוּכִים לָהּ:", "rashi_en": "בנתיה (lit., its daughters) — the villages adjacent to it."}, {"ch": 21, "v": 26, "aliyah": 4, "heb": "כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָאֱמֹרִ֖י הִ֑וא וְה֣וּא נִלְחַ֗ם בְּמֶ֤לֶךְ מוֹאָב֙ הָֽרִאשׁ֔וֹן וַיִּקַּ֧ח אֶת־כׇּל־אַרְצ֛וֹ מִיָּד֖וֹ עַד־אַרְנֹֽן׃", "onk": "אֲרֵי חֶשְׁבּוֹן קַרְתָּא דְּסִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה הִיא וְהוּא אַגַּח קְרָבָא בְּמַלְכָּא דְמוֹאָב קַדְמָאָה וּנְסִיב יָת כָּל אַרְעֵיהּ מִידֵיהּ עַד אַרְנוֹן:", "onk_en": "For Cheshbon was then a city of Sichon, King of the Emorites, and he had waged war against the first king of Moav, and took all his land from his hand, as far as Arnon.", "pj": "אֲרוּם חֶשְׁבּוֹן קַרְתָּא דְסִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה הִיא וְהוּא אַגַח קְרָבָא בְּמַלְכָּא דְמוֹאָב קַדְמָאָה וּנְסֵיב יַת כָּל אַרְעֵיהּ מִן יְדֵיהּ עַד אַרְנוֹן", "pj_en": "For Heshbon was the city of Sihon, king of the Amorites; for he had beforetime made war with the King of Moab, and had taken all his country from his hand unto the Arnon.", "tj": "", "tj_en": "", "rashi": "<b>והוא נלחם.<\/b> לָמָּה הֻצְרַךְ לִכָּתֵב? לְפִי שֶׁנֶּאֱמַר (שם) \"אַל תָּצַר אֶת מוֹאָב\", וְחֶשְׁבּוֹן מִשֶּׁל מוֹאָב הָיְתָה, כָּתַב לָנוּ שֶׁסִּיחוֹן לְקָחָהּ מֵהֶם וְעַל יָדוֹ טָהֲרָה לְיִשְֹרָאֵל (חולין ס'; גיטין ל\"ח):<br><br><b>מידו.<\/b> מֵרְשׁוּתוֹ (בבא מציעא נ\"ו):", "rashi_en": "והוא נלחם AND HE (SIHON) HAD FOUGHT [AGAINST THE FORMER KING OF MOAB] — Why is it necessary that this should be written? Because it is said (Deuteronomy 2:9), “Harass not Moab”, and Heshbon belonged to Moab (and therefore should not have been attacked), it (Scripture) tells us that Sihon had taken it from them, and through him it (Heshbon) became permissible to Israel as an object of attack (Chullin 60b; Gittin 38a).<br><br>מידו means FROM HIS POSSESSION (Bava Metzia 56b)."}, {"ch": 21, "v": 27, "aliyah": 4, "heb": "עַל־כֵּ֛ן יֹאמְר֥וּ הַמֹּשְׁלִ֖ים בֹּ֣אוּ חֶשְׁבּ֑וֹן תִּבָּנֶ֥ה וְתִכּוֹנֵ֖ן עִ֥יר סִיחֽוֹן׃", "onk": "עַל כֵּן יֵימְרוּן מְתָלַיָּא עוּלוּ לְחֶשְׁבּוֹן תִּתְבְּנֵי וְתִשְׁתַּכְלַל קַרְתָּא דְסִיחוֹן:", "onk_en": "Concerning this, the parable tellers say: “Come to Cheshbon, may it be built and established as the city of Sichon.", "pj": "עַל כֵּן יֵימְרוּן בְּחִידְתָא מְתוּלַיָיא אָמְרִין צַדִיקַיָא דְשָׁלְטִין בְּיִצְרֵיהוֹן אִיתוּ וְנַחְשׁוֹב זֵיינָא דְעוּבְדָא טָבָא כֻּלוֹ קֳבֵיל אַגְרָא וַאֲגַר עוֹבָדָא בִּישָׁא כֻּלוֹ קֳבֵיל זֵיינָא יִתְבְּנֵי וְיִשְׁתַּכְלַל דְמִיתְעַר וּמְשִ¦יחַ בְּאוֹרַיְיתָא", "pj_en": "Therefore, say the young men, (or the chosen ones,) using proverbs: The righteous who rule their passions say, Come let us reckon (Heshbon) the strength of a good work by the recompense, and the recompense of an evil work by the strength for whoso is watchful and diligent in the law is builded up and perfected;", "tj": "מִן בְּגִין כֵּן יֵימְרוּן מְתוּלֵי מְתָלַיָיא עוּלוּ:", "tj_en": "Therefore say they who speak in proverbs, Ascend.", "rashi": "<b>על כן.<\/b> עַל אוֹתָהּ מִלְחָמָה שֶׁנִּלְחַם סִיחוֹן בְּמוֹאָב:<br><br><b>יאמרו המשלים.<\/b> בִּלְעָם, שֶׁנֶּאֱמַר בּוֹ \"וַיִּשָּׂא מְשָׁלוֹ\" (במדבר כ\"ג):<br><br><b>המשלים.<\/b> בִּלְעָם וּבְעוֹר, וְהֵם אָמְרוּ:<br><br><b>באו חשבון.<\/b> שֶׁלֹּא הָיָה סִיחוֹן יָכוֹל לְכָבְשָׁהּ וְהָלַךְ וְשָׂכַר אֶת בִּלְעָם לְקַלְּלוֹ (תנחומא); וְזֶהוּ שֶׁאָמַר לוֹ בָּלָק \"כִּי יָדַעְתִּי אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ\" וְגוֹ' (במדבר כ\"ב):<br><br><b>תבנה ותכונן.<\/b> חֶשְׁבּוֹן בְּשֵׁם סִיחוֹן לִהְיוֹת עִירוֹ:", "rashi_en": "על כן (more lit., about this) — about this war which Sihon waged against Moab,<br><br>יאמרו המשלים THEY THAT SPEAK IN PARABLES SAY — One of these was Balaam of whom it is said, (Numbers 23:7), \"And he took up his parable”.<br><br>המשלים  THEY THAT SPEAK IN PARABLES — The plural המשלים refers to Balaam and his father Beor (see Rashi on Numbers 24:3). They said — <br><br>באו חשבון “COME TO HESHBON”, — For Sihon had been unable to capture it, and he went and hired Balaam to curse it, and this is the meaning of what Balak said, (Numbers 22:6) “For I know (by what has already happened) that whomsoever thou blessest is blessed, [and whomsoever thou cursest is cursed]” (Midrash Tanchuma, Chukat 24).<br><br>תבנה ותכונן IT WILL BE BUILT UP AND ESTABLISHED, [SIHON’S CITY] — Heshbon will be rebuilt under Sihon’s name to be his city."}, {"ch": 21, "v": 28, "aliyah": 4, "heb": "כִּי־אֵשׁ֙ יָֽצְאָ֣ה מֵֽחֶשְׁבּ֔וֹן לֶהָבָ֖ה מִקִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן׃", "onk": "אֲרֵי <b>קִידוּם תַּקִּיף כְּ<\/b>אֶשָּׁא נְפַק מֵחֶשְׁבּוֹן <b>עָבְדֵי קְרָבָא<\/b> כְּשַׁלְהוֹבִיתָא מִקַּרְתָּא דְסִיחוֹן <b>קְטִילוּ עַמָּא דִּשְׁרוֹ<\/b> בִלְחָיַת מוֹאָב <b>כּוּמְרַיָּא דְּפָלְחִין בֵּית דַּחֲלָא<\/b> רָמָתָא דְאַרְנוֹן:", "onk_en": "For [<b>an Easterly wind as strong as<\/b>] a fire went forth from Cheshbon, [<b>waged war as<\/b>] a flame from Sichon’s capital; it consumed [<b>killing the nation that dwelled in<\/b>] Ar [<b>Lechoyas<\/b>], of Moav, [<b>killing<\/b>] the masters [<b>priests who serve in the house of idol worship<\/b>] of Arnon’s heights.", "pj": "אֲרוּם מִילִין תַּקִיפִין הֵי כְאֵישָׁא נַפְקִין מִפּוּמֵי צַדִיקַיָא מָרֵי חוּשְׁבְּנָא דְנָא וְזַכְוַון חֲסִינַן הֵי כְשַׁלְהוֹבִיתָא מֵאִלֵין דְקַרְיָין וּמְשִ¦יחִין בְּאוֹרַיְיתָא אָכְלַת אֵישְׁתְּהוֹן לְסַנָאָה וְלִבְעֵיל דְבָבָא דְמִתְחַשְׁבִין קוּמֵיהוֹן הֵי כְפִלְחֵי בַּמְתֵי טַעֲוָותָא דְנַחֲלֵי אַרְנוֹנָא", "pj_en": "for mighty words like fire go forth from the lips of the righteous, the masters of such thought, (calculation, heshbona,) and powerful merit like flames from those who are read and devoted in the law: their fire devoureth the foe and the adversary, who are reckoned before them as the worshippers of the idol altars in the valley of Arnona.", "tj": "אֲרוּם עַם גוּבְרִין וּבַעֲרִין הֵיךְ אֶשָׁא נְפָקוּ מֵחֶשְׁבּוֹן עַבְדֵי קְרָבָא כְּשַׁלְהֵבִין דְאֶשָׁא מִקַרְתָּא דְסִיחוֹן קָטִילוּ מַלְכֵיהוֹן דֶאֱמוֹרָאֵי שֵׁיצוּן לְחַיָית קַרְתְּהוֹן דְמוֹאָבָאֵי קָטִילוּ כוּמְרַיָא דַהֲווֹ מְדַבְּחִין קֳדָם טַעֲוָותֵיהּ דְאַרְנוֹנָא:", "tj_en": "Because the men of their people like fire come out of Heshbon, making war as flames of fire from the city of Sihon: the kings of the Amoraee are slain, the villages of the Moabite cities are destroyed, and the priests are slaughtered who sacrificed before the idols of Arnona.", "rashi": "<b>כי אש יצאה מחשבון.<\/b> מִשֶּׁכְּבָשָׁהּ סִיחוֹן:<br><br><b>אכלה ער מואב.<\/b> שֵׁם אוֹתָהּ הַמְּדִינָה קָרוּי עָר בְּלָשׁוֹן עִבְרִי וּלְחָיַת בְּלָשׁוֹן אֲרַמִּי:<br><br><b>ער מואב.<\/b> עָר שֶׁל מוֹאָב:", "rashi_en": "כי אש יצאה מחשבון FOR A FIRE WILL GO FORTH FROM HESHBON after Sihon captures it,<br><br>אכלה ער מואב IT WILL CONSUME AR OF MOAB — The name of that province was called Ar in the Hebrew language and Lechayath (see the Targum Onkelos) in the Aramaic language. <br><br>ער מואב means AR OF MOAB."}, {"ch": 21, "v": 29, "aliyah": 4, "heb": "אוֹי־לְךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם־כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤יו פְּלֵיטִם֙ וּבְנֹתָ֣יו בַּשְּׁבִ֔ית לְמֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן׃", "onk": "וַי לְכוֹן מוֹאָבָאֵי אֲבַדְתּוּן עַמָּא <b>דְפָלְחִין<\/b> לִכְמוֹשׁ מְסַר בְּנוֹהִי צִירִין וּבְנָתֵיהּ בְּשִׁבְיָא לְמַלְכָּא דֶאֱמוֹרָאָה סִיחוֹן:", "onk_en": "Woe to you, O Moav, you are destroyed, people of [<b>who serve<\/b>] Kemosh, he rendered your sons as refugees, and your daughters captives, of Sichon, King of Emori.", "pj": "יְיָא לְכוֹן סַנְאֵי צַדִיקַיָא אֲבַדְתּוּן עַמָא דִכְמִישׁ מִדְסֵינַת פִּתְגָמֵי אוֹרַיְיתָא לֵית לְהוֹן תַּקַנְתָּא עַד דְיֵיצְרְכוֹן לְמִגְלֵי לַאֲתַר דְיִלְפוּן אוֹרַיְיתָא וּבְנֵיהוֹן וּבְנַתְהוֹן מִתְרַחֲקָן בְּשִׁבְיַית חַרְבָּא כָּל קֳבֵל מִתְמָלְכִין בְּמוֹלְכָנָא דְאוֹרַיְיתָא אֱמוֹרָאִין וּמְשִיחִין בְּאוֹרַיְיתָא", "pj_en": "Woe to you, ye haters of the just! ye have perished, ye people of Kemosh, haters of the words of the law, in whom there is no righteousness, unless he waste you to bring you captive unto the place where they teach. the law, and their sons and daughters be removed by captivity of the sword to be near them who consult in its counsels the instructors and those anointed with the law.", "tj": "אוֹי לְכוֹן מוֹאֲבָאֵי סַפְתוּן וּבָדְתוּן פַּלְחֵי טַעֲוָותָא כְּמוֹשׁ מְסַרְתּוּן בְּנֵיכוֹן כְּפוּתִין בְּקוֹלַרְיָיא וּבְנַתְכוֹן בְּשִׁבְיָיתָא לְמַלְכֵיהוֹן דֶאֱמוֹרָאֵי סִיחוֹן:", "tj_en": "Woe to you of Moab! Ye are consumed, destroyed, O worshippers of the idol of Kemosh; your sons and daughters bound by the collar are carried into the captivity of Sihon, king of the Amorites.", "rashi": "<b>אוי לך מואב.<\/b> שֶׁקִּלְּלוּ אֶת מוֹאָב שֶׁיִּמָּסְרוּ בְיָדוֹ (תנחומא):<br><br><b>כמוש.<\/b> שֵׁם אֱלֹהֵי מוֹאָב:<br><br><b>נתן.<\/b> הַנּוֹתֵן אֶת בָּנָיו שֶׁל מוֹאָב:<br><br><b>פליטם<\/b> — נָסִים וּפְלֵטִים מֵחֶרֶב וְאֶת בְּנוֹתָיו בַּשְּׁבִית וְגוֹ':", "rashi_en": "אוי לך מואב WOE TO THEE, MOAB — [These are not the words of the historian but those of Balaam and Beor, for] they cursed the Moabites (as they had been hired to do) so that they should be delivered into his (Sihon’s) hands (Midrash Tanchuma, Chukat 24).<br><br>כמוש CHEMOSH was the name of Moab’s god.<br><br>נתן HE HATH GIVEN [HIS SONS] — The subject of the sentence is to be supplied: HE who gave HATH GIVEN HIS SONS i.e. those of Moab,<br><br>פלטים — AS FUGITIVES — as men who flee and attempt to escape from the sword, and his daughters into captivity, etc."}, {"ch": 21, "v": 30, "aliyah": 4, "heb": "וַנִּירָ֛ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד־דִּיבֹ֑ן וַנַּשִּׁ֣ים עַד־נֹ֔פַח אֲשֶׁ֖רׄ עַד־מֵֽידְבָֽא׃", "onk": "וּמַלְכוּ פְסָקַת מֵחֶשְׁבּוֹן <b>עֲדָא שׁוּלְטַן<\/b> מִדִּיבוֹן וְצַדִיאוּ עַד נֹפַח דִּסְמִיךְ עַד מֵידְבָא:", "onk_en": "Their kingdom was uprooted from Cheshbon as far as Divon [<b>whose reign has ended<\/b>]; we made them desolate as far as Nofach near Meidva.”", "pj": "אֲמִירִין רַשִׁיעַיָא לֵית רְמָא וּמְנַטְלָא חָמֵי כָּל דָא עָבַד חוּשְׁבַּנְכוֹן עַד דִיסוּף כִּדְבוֹנָא נַפְשֵׁיכוֹן וּמָרֵי עַלְמָא יִצְדֵי יַתְהוֹן עַד דִיפַח נַפְשֵׁיהוֹן וְיִצְדוּן כְּמָא דְאַצְדֵי קִרְוֵי אֱמוֹרָאֵי וּפַלְטִירֵי רַבָּנֵיהוֹן מִן תַּרְעָא רַבָּא דְבֵית מַלְכוּתָא עַד שׁוּקָא דִנְפָחַיָא דִסְמִיךְ עַד מֵידְבָא", "pj_en": "The wicked have said, In all this there is nothing lofty to the sight; but your numbers shall perish until the falsehood of your souls be ended, and the Lord of the world destroy them till their lives have expired, and they have come to nothing, as the cities of the Amorites have perished, and the palaces of their princes from the great gate of the house of the kingdom to the street of the smiths which is nigh to Medeba.", "tj": "וּפַסְקָא מַלְכוּ מִן חֶשְׁבּוֹן וְשׁוּלְטַן מִן דִיבוֹן וּצְדַן אוֹרְחָתֵיהּ עַד נְפָחַיָא דִסְמִיךְ לְמֵידְבָא:", "tj_en": "And the kingdom hath ceased from Heshbon, and the ruler from Dibon, and his ways are made desolate unto the smithies which are nigh to Medaba.", "rashi": "<b>ונירם אבד.<\/b> מַלְכוּת שֶׁלָּהֶם:<br><br><b>אבד חשבון עד דיבן<\/b> — מַלְכוּת וְעֹל שֶׁהָיָה לְמוֹאָב בְּחֶשְׁבּוֹן אָבַד מִשָּׁם, וְכֵן עַד דִּיבֹן; תַּרְגּוּם שֶׁל סָר \"עַד\", כְּלוֹמַר סָר נִיר מִדִּיבֹן; נִיר לְשׁוֹן מַלְכוּת וְעֹל מֶמְשֶׁלֶת אִישׁ, כְּמוֹ \"לְמַעַן הֱיוֹת נִיר לְדָוִד עַבְדִּי\" (מ\"א י\"א):<br><br><b>ונשים.<\/b> שִׁי\"ן דְּגוּשָׁה, לְשׁוֹן שְׁמָמָה, כָּךְ יֹאמְרוּ הַמֹּשְׁלִים, \"וַנַּשִּׁים אוֹתָם עַד נֹפַח\" — הֲשִׁמּוֹנוּם עַד נֹפַח:", "rashi_en": "ונירם means their sovreignty.<br><br>אבד חשבון עד דיבן means: the sovreignty and the subjugation which Moab had over Heshbon is destroyed from thence. Similar also is the meaning of עד דיבן because the Targum of סר “it hath departed” is עד, so that this phrase means to say, sovreignty hath departed from Dibon. The word ניר denotes the sovreignty and yoke which result from a person’s rulership, as, (1 Kings 11:36) “that David Thy servant may always have dominion (ניר) before Me”.<br><br>ונשים WE HAVE LAID WASTE — The ש has a Dagesh, for the word denotes waste (שמם). Thus say they who speak in parables: ונשים אותם עד נפח which signifies we have laid them waste as far as Nophah."}, {"ch": 21, "v": 31, "aliyah": 4, "heb": "וַיֵּ֙שֶׁב֙ יִשְׂרָאֵ֔ל בְּאֶ֖רֶץ הָאֱמֹרִֽי׃", "onk": "וִיתֵב יִשְׂרָאֵל בַּאֲרַע אֱמוֹרָאָה:", "onk_en": "Yisroel settled in the land of the Emorite.", "pj": "וִיתִיבוּ יִשְרָאֵל בָּתַר דְקָטִילוּ יַת סִיחוֹן בְּאַרְעָא דֶאֱמוֹרָאֵי", "pj_en": "And Israel, after they had destroyed Sihon, dwelt in the land of the Amorites.", "tj": "וּשְׁרוֹן יִשְ¦רָאֵל בְּאַרְעֲהוֹן דֶאֱמוֹרָאֵי:", "tj_en": "And Israel dwelt in the land of the Amorites.", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 32, "aliyah": 4, "heb": "וַיִּשְׁלַ֤ח מֹשֶׁה֙ לְרַגֵּ֣ל אֶת־יַעְזֵ֔ר וַֽיִּלְכְּד֖וּ בְּנֹתֶ֑יהָ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(ויירש)<\/span> <span class=\"mam-kq-q\">[וַיּ֖וֹרֶשׁ]<\/span><\/span> אֶת־הָאֱמֹרִ֥י אֲשֶׁר־שָֽׁם׃", "onk": "וּשְׁלַח משֶׁה לְאַלָּלָא יָת יַעְזֵר וּכְבָשׁוּ כַּפְרָנָהָא וְתָרִיךְ יָת אֱמוֹרָאָה דִּי תַמָּן:", "onk_en": "Moshe sent [men] to spy on Ya’zer, and they captured its surrounding villages, and drove out the Emorites that were there.", "pj": "וְשָׁדַר משֶׁה יַת כָּלֵב וְיַת פִּנְחָס לְאַלָלָא יַת מַכְבַּר וּכְבָשׁוּ כּוּפְרָנָהָא וְשֵׁיצוּן יַת אֱמוֹרָאֵי דְתַמָן", "pj_en": "And Mosheh sent Kaleb and Phineas to examine Makbar, and they subdued the villages, and destroyed the Amorites who were there.", "tj": "וּשְׁלַח משֶׁה לְמִילְלָא יַת מַכְוַור וּכְבִישׁוּ כַּפְרָנַיָא וְשֵׁיצוּן יַת אֱמוֹרָאֵי דִי הֲוָון תַּמָן:", "tj_en": "And Mosheh sent to explore Makvar, and they took the villages, and destroyed the Amorites who were there.", "rashi": "<b>וישלח משה לרגל את יעזר.<\/b> הַמְרַגְּלִים לְכָדוּהָ, אָמְרוּ לֹא נַעֲשֶׂה כָּרִאשׁוֹנִים, בְּטוּחִים אָנוּ בְּכֹחַ תְּפִלָּתוֹ שֶׁל מֹשֶׁה לְהִלָּחֵם (תנחומא):", "rashi_en": "וישלח משה לרגל את יעזר AND MOSES SENT TO SPY OUT JAAZER — The spies captured it (as the text goes on to state, “and they captured it”). They said: We will not do as the former spies, for we have confidence in the power of Moses’ prayer to be able to fight against it (Midrash Tanchuma, Chukat 24)."}, {"ch": 21, "v": 33, "aliyah": 4, "heb": "וַיִּפְנוּ֙ וַֽיַּעֲל֔וּ דֶּ֖רֶךְ הַבָּשָׁ֑ן וַיֵּצֵ֣א עוֹג֩ מֶֽלֶךְ־הַבָּשָׁ֨ן לִקְרָאתָ֜ם ה֧וּא וְכׇל־עַמּ֛וֹ לַמִּלְחָמָ֖ה אֶדְרֶֽעִי׃", "onk": "וְאִתְפְּנִיאוּ וּסְלִיקוּ לְאֹרַח <b>מַתְנָן<\/b> וּנְפַק עוֹג מַלְכָּא <b>דְמַתְנָן<\/b> לָקֳדָמוּתְהוֹן הוּא וְכָל עַמֵּיהּ לְאַגָּחָא קְרָבָא לְאֶדְרֶעִי:", "onk_en": "They then turned and headed toward the Bashan [<b>Masnon<\/b>]; and Og, King of the Bashan [<b>Masnon<\/b>], came out against them he with all his people, to wage war at Edre’i.", "pj": "וְאִתְפְּנִיאוּ וּסְלִיקוּ אוֹרַח מַתְנָן וּנְפַק עוֹג מַלְכָּא דְמַתְנָן לִקְדָמוּתָנָא הוּא וְכָל עַמֵיהּ לְאַגָחָא קְרָבָא לְאֶדְרֶעִי", "pj_en": "Then they turned, and went up by the way of Mathnan; and Og, the king of Mathnan, came out to meet us, he and all his people, to give battle at Edrei.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 34, "aliyah": 4, "heb": "וַיֹּ֨אמֶר יְהֹוָ֤ה אֶל־מֹשֶׁה֙ אַל־תִּירָ֣א אֹת֔וֹ כִּ֣י בְיָדְךָ֞ נָתַ֧תִּי אֹת֛וֹ וְאֶת־כׇּל־עַמּ֖וֹ וְאֶת־אַרְצ֑וֹ וְעָשִׂ֣יתָ לּ֔וֹ כַּאֲשֶׁ֣ר עָשִׂ֗יתָ לְסִיחֹן֙ מֶ֣לֶךְ הָֽאֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּחֶשְׁבּֽוֹן׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה לָא תִדְחַל מִנֵּיהּ אֲרֵי בִידָךְ מְסָרִית יָתֵיהּ וְיָת כָּל עַמֵּיהּ וְיָת אַרְעֵיהּ וְתַעְבֵּד לֵיהּ כְּמָא דִי עֲבַדְתְּ לְסִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה דִּי יָתֵב בְּחֶשְׁבּוֹן:", "onk_en": "Adonoy said to Moshe, “Do not be afraid of him, for into your hand I have delivered Ihim and all his people and territory; do to him as you have done to Sichon, King of the Emorite, who lives in Cheshbon.”", "pj": "וַהֲוָה כֵּיוָן דְחָמָא משֶׁה יַת עוֹג זָע וְאַרְתֵּית מִן קֳדָמוֹי עָנֵי וַאֲמַר דֵין הוּא עוֹג רַשִׁיעָא דַהֲוָה מַחְסִיד יַת אַבְרָהָם וְשָרָה אַבְהָתָן לְמֵימָר אַתּוּן מְדַמְיַן לְאִלָנִין שְׁתוּלִין עַל פִּרְקַטוּנִין דְמַיָין בְרַם פֵּירִין לֵית הִינוּן עַבְדִין בְּגִין כֵּן אַמְתִּין לֵיהּ קוּדְשָׁא בְּרִיךְ הוּא לִמְחַוְיָא לְדָרַיָא וְיֶחְמֵי מִן בְּנֵיהוֹן אוּכְלוּסִין סַגִיאִין לְאִתְמַסְרָא בִּידֵיהוֹן בְּכֵן אָמַר יְיָ לְמשֶׁה לָא תִדְחַל מִנֵיהּ אֲרוּם בִּידָךְ מְסָרִית יָתֵיהּ וְיַת כָּל עַמֵיהּ וְיַת כָּל אַרְעֵיהּ וְתַעֲבֵיד לֵיהּ הֵיכְמָא דְעָבַדְתָּ לְסִיחוֹן מַלְכָּא דֶאֱמוֹרָאֵי דַהֲוָה יָתֵיב בְּחֶשְׁבּוֹן", "pj_en": "And it was, when Mosheh saw Og, he trembled before him, stricken with fear: but he (soon) answered and said, This is Og the Wicked, who taunted Abraham our father and Sarah, saying: You are like trees planted by the water channels, but bring forth no fruit: therefore hath the Holy One, blessed be He, spared him to live through generations, that he might see the great multitude of their children, and be delivered into our hands. Then spake the Lord unto Mosheh: Fear him not, for I have delivered him into thy hand, and all his people and country; and thou shalt do to him as thou hast done to Sihon, king of the Amorites, who dwelt in Heshbon.", "tj": "וַהֲוָה כַּד חֲמָא משֶׁה יַת עוֹג וַאֲמַר הֲלָא דֵין עוֹג רַשִׁיעָא דַהֲוָה מוֹנֶה לְאַבְרָהָם וְשָרָה וַאֲמַר אַבְרָהָם וְשָרָה מְדַמְיַין לְאִלָנִין יָאִין דְקַיְימִין עַל מַבּוּעִין דְמַיָין בְּרַם פֵּירִין לָא עַבְדִין בְּגִין כְּדֵין קַיֵים יָתֵיהּ יְיָ קוּדְשָׁא יְהֵי שְׁמֵיהּ מְבָרֵךְ שְׁנִין סַגְיַין עַד זְמַן דַחֲמָא בְּנֵיהוֹן וּבְנֵי בְּנֵיהוֹן וְחָזַר וְנָפַל בִּידֵיהוֹן וַאֲמַר יְיָ לְמשֶׁה לָא תִדְחַל מִנֵיהּ אֲרוּם בִּידָךְ מְסָרִית יָתֵיהּ וְיַת כָּל עַמֵיהּ וְיַת אַרְעֵיהּ וְתַעֲבֵיד לֵיהּ הֵיךְ מַה דַעֲבַדְתָּא לְסִיחוֹן מַלְכֵיהוֹן דֶאֱמוֹרָאֵי דַהֲוָה שָׁרֵי בְּחֶשְׁבּוֹן:", "tj_en": "And when Mosheh saw Og, he said, Is not this Og the Wicked, who taunted Abraham and Sarah, and said, They are like fair trees by fountain of water, but give no fruit. Therefore the Holy One, blessed be He, hath kept him alive for many years, till the time that he should see their children and children's children, and fall by their hands. Therefore the Lord said to Mosheh, Fear him not, for I have delivered him into thy hand, and all his people, and all his land; and thou shalt do to him as thou hast done to Sichon, king of the Amorites, who dwelt in Heshbon.", "rashi": "<b>אל תירא אתו.<\/b> שֶׁהָיָה מֹשֶׁה יָרֵא לְהִלָּחֵם, שֶׁמָּא תַּעֲמֹד לוֹ זְכוּתוֹ שֶׁל אַבְרָהָם, שֶׁנֶּאֱמַר \"וַיָּבֹא הַפָּלִיט\" (בראשית י\"ד) — הוּא עוֹג שֶׁפָּלַט מִן הָרְפָאִים שֶׁהִכּוּ כְּדָרְלָעֹמֶר וַחֲבֵרָיו בְּעַשְׁתְּרוֹת קַרְנַיִם, שֶׁנֶּאֱמַר (דברים ג') \"רַק עוֹג מֶלֶךְ הַבָּשָׁן נִשְׁאַר מִיֶּתֶר הָרְפָאִים\" (נדה ס\"א):", "rashi_en": "אל תירא אתו FEAR HIM NOT — God said this concerning Og but not about Sihon (cf v. 23), because Moses feared to wage battle, perhaps the merit of Abraham with whom Og had been associated would stand up (i.e., be an advocate) for him, as it is said, (Genesis 14:13) “And the one who escaped came [and told it to Abraham]” — this was Og who had escaped from the Rephaim whom Chedoladmar and his allies had smitten in Ashoreth Karnaim (Genesis 14:5), as it is said, (Deuteronomy 3:11). \"For only Og king of Bashan was left of the remnant of the Rephaim\" (cf. Midrash Tanchuma, Chukat 25, Niddah 61a)."}, {"ch": 21, "v": 35, "aliyah": 4, "heb": "וַיַּכּ֨וּ אֹת֤וֹ וְאֶת־בָּנָיו֙ וְאֶת־כׇּל־עַמּ֔וֹ עַד־בִּלְתִּ֥י הִשְׁאִֽיר־ל֖וֹ שָׂרִ֑יד וַיִּֽירְשׁ֖וּ אֶת־אַרְצֽוֹ׃", "onk": "וּמְחוֹ יָתֵיהּ וְיָת בְּנוֹהִי וְיָת כָּל עַמֵּיהּ עַד דְּלָא אִשְׁתְּאַר לֵיהּ מְשֵׁזִיב וִירִיתוּ יָת אַרְעֵיהּ:", "onk_en": "And they killed him (Og), his sons, and all his people, leaving no survivors; and they took possession of his land.", "pj": "וַהֲוָה כֵּיוַן דְחָמָא עוֹג רַשִׁיעָא יַת מַשִׁירְיָיתָא דְיִשְרָאֵל דַהֲוָה שִׁיתָּא פַּרְסֵי אָמַר לֵית אֲנָא מְסַדֵר סִדְרֵי קְרָבָא כֻּלוֹ קֳבֵיל עַמָא הָדֵין דִלְמָא יַעַבְדוּן לִי הֵיכְמָא דְעָבָדוּ לְסִיחוֹן וַאֲזַל וְעָקַר טַוְורָא בַּר שִׁיתָּא פַּרְסֵי וְאַחֲתֵיהּ עַל רֵישֵׁיהּ לְמִטְלַק עֲלֵיהוֹן מִן יַד זַמִין מֵימְרָא דַיְיָ זוֹחֲלָא וּפָכַר טַוְורָא וְנַקְרֵיהּ וְטָמַע רֵישֵׁיהּ בְּגַוֵיהּ בָּעָא לְמִשְׁלְפֵיהּ מִן רֵישֵׁיהּ וְלָא יָכִיל מִן בִּגְלַל דְמַשְׁכֵי כַּכֵיהּ וְשִׁינֵיהּ פּוּמֵיהּ הַלְכָא וְהַלְכָא אָזַל משֶׁה וְנָסַב נַרְגָא בְּרַת עִישַרְתֵּי אַמִין וְטָפַז עִישַרְתֵּי אַמִין וּמַחְיֵיהּ בְּקַרְסוּלֵיהּ וְנָפַל וּמִית מִן לְהָאֵל לְמַשְׁרִיתָא דְיִשְרָאֵל דְהָכִין כְּתִיב וּמְחוֹ יָתֵיהּ וְיַת בְּנוֹי וְיַת כָּל עַמֵיהּ עַד דִי לָא שְׁיָירוּ לֵיהּ מְשֵׁיזִיב וִירִיתוּ יַת אַרְעֵיהּ", "pj_en": "Now it was, after Og the Wicked had seen the camp of Israel spreading over six miles he said with himself, I will make war against this people, that they may not do to me as they have done to Sihon: so went he and tare up a mountain six miles in size, and brought it upon his head to hurl it upon them. But the Word of the Lord forthwith prepared a reptile which ate into the mountain and perforated it, and his head was swallowed up within it; and he sought to withdraw it, but could not, because his back teeth and his front ones were drawn hither and thither. And Mosheh went and took an axe of ten cubits, and sprang ten cubits, and struck him on the ankle of his foot, and he fell, and died beyond the camp of Israel. Thus it is written. And they smote him and his sons and daughters, and all his people, till none of them remained to escape; and they took possession of his land.", "tj": "", "tj_en": "", "rashi": "<b>ויכו אתו.<\/b> מֹשֶׁה הֲרָגוֹ, כִּדְאִיתָא בִבְרָכוֹת בְּהָרוֹאֶה (ברכות דף נ\"ד), עֲקַר טוּרָא בַּר תְּלָתָא פַרְסֵי וְכוּ':", "rashi_en": "ויכו אתו AND THEY SMOTE HIM — Moses slew him, as it is related in Treatise Berakhot, in the chapter beginning הרואה‎ (Berakhot 54b): He tore up a rock covering an area of three Parsang and he hurled it at him."}, {"ch": 22, "v": 1, "aliyah": 4, "heb": "וַיִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽיַּחֲנוּ֙ בְּעַֽרְב֣וֹת מוֹאָ֔ב מֵעֵ֖בֶר לְיַרְדֵּ֥ן יְרֵחֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּנְטָלוּ בְּנֵי יִשְׂרָאֵל וּשְׁרוֹ בְּמֵשְׁרַיָּא דְמוֹאָב מֵעִבְרָא לְיַרְדְּנָא דִירֵחוֹ:", "onk_en": "Bnei Yisroel traveled and camped in the western plains of Moav, across the Yardein from Yereicho.", "pj": "וּנְטָלוּ בְּנֵי יִשְׂרָאֵל וּשְׁרוֹן בְּמַשִׁרְיָא דְמוֹאָב מֵעִיבְרָא לְיַרְדְנָא דִירֵיחוֹ", "pj_en": "And the children of Israel journeyed, and encamped in the plains of Moab, near the passage of the Jordan (toward) Jericho.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 2, "aliyah": 4, "heb": "וַיַּ֥רְא בָּלָ֖ק בֶּן־צִפּ֑וֹר אֵ֛ת כׇּל־אֲשֶׁר־עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽאֱמֹרִֽי׃", "onk": "וַחֲזָא בָּלָק בַּר צִפּוֹר יָת כָּל דִּי עֲבַד יִשְׂרָאֵל לֶאֱמוֹרָאֵי:", "onk_en": "And Balak the son of Tzipor saw all that Yisroel had done to the Emorite.", "pj": "וירא וַחֲמָא בָּלָק בַּר צִפּוֹר יַת כָּל מַה דְעָבַד יִשְׂרָאֵל לֶאֱמוֹרָאֵי", "pj_en": "AND Balak bar Zippor saw what Israel had done to the Amoraee.", "tj": "", "tj_en": "", "rashi": "<b>וירא בלק בן צפור את כל אשר עשה ישראל לאמרי.<\/b> אָמַר, אֵלּוּ שְׁנֵי מְלָכִים שֶׁהָיִינוּ בְטוּחִים עֲלֵיהֶם לֹא עָמְדוּ בִּפְנֵיהֶם, אָנוּ עַל אַחַת כַּמָּה וְכַמָּה, לְפִיכָךְ \"וַיָּגָר מוֹאָב\" (תנחומא):", "rashi_en": "וירא בלק ... את כל אשר עשה ישראל לאמרי AND BALAK … SAW ALL THAT ISRAEL HAD DONE TO THE AMORITES — He said to his people: Those two kings (Sihon and Og) on whom we relied (see Rashi on Numbers 21:23) could not resist them; how much less can we do so; on this account (because he said this to his people) ויגר מואב MOAB (the whole people) WAS SORE AFRAID (Midrash Tanchuma, Balak 2)."}, {"ch": 22, "v": 3, "aliyah": 4, "heb": "וַיָּ֨גׇר מוֹאָ֜ב מִפְּנֵ֥י הָעָ֛ם מְאֹ֖ד כִּ֣י רַב־ה֑וּא וַיָּ֣קׇץ מוֹאָ֔ב מִפְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּדְחֵל מוֹאֲבָאָה מִן קֳדָם עַמָּא לַחֲדָא אֲרֵי סַגִּי הוּא וַעֲקַת לְמוֹאֲבָאָה מִן קֳדָם בְּנֵי יִשְׂרָאֵל:", "onk_en": "And Moav became terrified of the people [of Israel] because of their great numbers, and so, Moav detested the Bnei Yisroel.", "pj": "וּדְחִילוּ מוֹאֲבָאֵי מִן קֳדָם עַמָא לַחֲדָא אֲרוּם סַגִי הוּא וְאִתְיַעֲקוּ מוֹאֲבָאֵי בְּחַיֵיהוֹן מִן קֳדָם בְּנֵי יִשְׂרָאֵל", "pj_en": "And the Moabaee feared before the people greatly because they were many, and they were distressed in their life before the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ויגר.<\/b> לְשׁוֹן מוֹרָא, כְּמוֹ \"גּוּרוּ לָכֶם\" (איוב י\"ט):<br><br><b>ויקץ מואב.<\/b> קָצוּ בְחַיֵּיהֶם:", "rashi_en": "ויגר is an expression signifying fear, as in (Job. 19:29): “Be ye afraid (גורו‎)\" .<br><br>ויקץ מואב means they (Moab) were sick of their lives (the expression is similar to קצתי בחיי in Genesis 27:46, being an abbreviated form of it)."}, {"ch": 22, "v": 4, "aliyah": 4, "heb": "וַיֹּ֨אמֶר מוֹאָ֜ב אֶל־זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַקָּהָל֙ אֶת־כׇּל־סְבִ֣יבֹתֵ֔ינוּ כִּלְחֹ֣ךְ הַשּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַשָּׂדֶ֑ה וּבָלָ֧ק בֶּן־צִפּ֛וֹר מֶ֥לֶךְ לְמוֹאָ֖ב בָּעֵ֥ת הַהִֽוא׃", "onk": "וַאֲמַר מוֹאָב לְסָבֵי מִדְיָן כְּעַן יְשֵׁיצוּן קְהָלָא יָת כָּל סַחֲרָנָנָא כְּמָא <b>דִמְלַחִיךְ<\/b> תּוֹרָא יָת יְרוֹקָא דְחַקְלָא וּבָלָק בַּר צִפּוֹר מַלְכָּא לְמוֹאָב בְּעִדָּנָא הַהִיא:", "onk_en": "Moav said to the elders of Midian, “Now this assembly will lick up [<b>consume<\/b>] everything around us, just as the ox laps up the herbs of the field.” Balak the son of Tzipor was King of Moav at that time.", "pj": "וַאֲמַר מוֹאֲבָאֵי לְסָבֵי מִדְיָנָאֵי אֲרוּם עַמָא חַד וּמָלְכוּ חַד הֲווֹן עַד הַהוּא יוֹמָא כְּדוּן יְשֵׁיצוּן קְהָלָא יַת כָּל חָזְרָנוּתָא הֵיכְמָא דְמִבְעֵי תוֹרָא יַת עִיסְבָּא דְחַקְלָא וּבָלָק בַּר צִפּוֹר מִדְיָנָאָה מַלְכָּא לְמוֹאָב בְּעִידָנָא הַהִיא וְלָא בְּעִידָנָא חוֹרָנָא דְהָכִין הֲוָה תְנָאָה בֵּינַתְהוֹן לְמֶהֱוֵי מַלְכִין לְפִרְקִין מֵאִילַךְ וְאִילַךְ", "pj_en": "And they said to the elders of the Midianee, for the people had been one and the kingdom one unto that day: Now will this congregation consume all that is about them, as the ox eateth up the grass of the field. And Balak bar Zippor, a Midianite, was the king of Moab at that time; without (a Midianite) being such at another time; for so was the tradition among them, to have kings from this people and from that, by turns.", "tj": "", "tj_en": "", "rashi": "<b>אל זקני מדין.<\/b> וַהֲלֹא מֵעוֹלָם הָיוּ שׂוֹנְאִים זֶה אֶת זֶה, שֶׁנֶּאֱמַר \"הַמַּכֶּה אֶת מִדְיָן בִּשְׂדֵה מוֹאָב\" (בראשית ל\"ו), שֶׁבָּאוּ מִדְיָן עַל מוֹאָב לַמִּלְחָמָה? אֶלָּא מִיִּרְאָתָן שֶׁל יִשְׂרָאֵל עָשׂוּ שָׁלוֹם בֵּינֵיהֶם; וּמָה רָאָה מוֹאָב לִטֹּל עֵצָה מִמִּדְיָן? כֵּיוָן שֶׁרָאוּ אֶת יִשְׂרָאֵל נוֹצְחִים שֶׁלֹּא כְמִנְהַג הָעוֹלָם, אָמְרוּ מַנְהִיגָם שֶׁל אֵלּוּ בְּמִדְיָן נִתְגַּדֵּל, נִשְׁאַל מֵהֶם מַה מִּדָּתוֹ, אָמְרוּ לָהֶם אֵין כֹּחוֹ אֶלָּא בְּפִיו, אָמְרוּ, אַף אָנוּ נָבֹא עֲלֵיהֶם בְּאָדָם שֶׁכֹּחוֹ בְּפִיו (תנחומא):<br><br><b>כלחך השור.<\/b> כָּל מַה שֶּׁהַשּׁוֹר מְלַחֵךְ אֵין בּוֹ בְרָכָה (שם):<br><br><b>בעת ההוא.<\/b> לֹא הָיָה רָאוּי לְמַלְכוּת, מִנְּסִיכֵי מִדְיָן הָיָה, וְכֵיוָן שֶׁמֵּת סִיחוֹן מִנּוּהוּ עֲלֵיהֶם לְצֹרֶךְ שָׁעָה (שם):", "rashi_en": "אל זקני מדין AND MOAB SAID] TO THE ELDERS OF MIDIAN But did not these (Moab and Midian) always hate one another, just as is stated, (Genesis 36:35) “who had smitten Midian in the country of Moab”, from which it is evident that Midian had come against Moab in war? But out of fear of Israel they now made peace between themselves (Midrash Tanchuma, Balak 3; cf. Sanhedrin 105a). And what induced Moab to take counsel of Midian? When they saw that Israel was victorious in a supernatural manner they said: the leader of these people grew up in Midian; let us ask them what is his chief characteristic. They replied to them; “His power lies only in his mouth (in prayer)”. Whereupon they said: “Then we must come against them with a man whose power lies in his mouth” (Midrash Tanchuma, Balak 3).<br><br>כלחך השור AS THE OX LICKETH — they used this comparison because whatever piece of ground the ox licks has no blessing left in it (cf. Shabbat 140b, 141a; Midrash Tanchuma, Balak 3).<br><br>בעת ההוא [BALAK WAS KING OF MOAB] AT THAT TIME — at that time: he was not really entitled to the kingdom; he was actually one of the Midianite princes, but when Sihon died they (the Moabites) appointed him as king over them to meet the needs of the time (Midrash Tanchuma, Balak 4)."}, {"ch": 22, "v": 5, "aliyah": 4, "heb": "וַיִּשְׁלַ֨ח מַלְאָכִ֜ים אֶל־בִּלְעָ֣ם בֶּן־בְּעֹ֗ר<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז בְּע֗וֹר)<\/i> פְּ֠ת֠וֹרָה אֲשֶׁ֧ר עַל־הַנָּהָ֛ר אֶ֥רֶץ בְּנֵי־עַמּ֖וֹ לִקְרֹא־ל֑וֹ לֵאמֹ֗ר הִ֠נֵּ֠ה עַ֣ם יָצָ֤א מִמִּצְרַ֙יִם֙ הִנֵּ֤ה כִסָּה֙ אֶת־עֵ֣ין הָאָ֔רֶץ וְה֥וּא יֹשֵׁ֖ב מִמֻּלִֽי׃", "onk": "וּשְׁלַח אִזְגַּדִּין לְוָת בִּלְעָם בַּר בְּעוֹר לִפְתוֹר אֲרָם דְעַל <b>פְּרָת<\/b> אֲרַע בְּנֵי עַמֵּיהּ לְמִקְרֵי לֵיהּ לְמֵימָר הָא עַמָּא נְפַק מִמִּצְרַיִם הָא <b>חֲפָא יָת עֵין שִׁמְשָׁא<\/b> דְאַרְעָא וְהוּא שָׁרֵי מִלְּקִבְלִי:", "onk_en": "He sent emissaries to Bil’am the son of Beor, to Pesor—which is by the river [<b>Peras<\/b>], the land of his people—to call him, saying: “Behold, a nation came out of Egypt, behold they have covered [<b>obscured the sunshine from<\/b>] the face of the earth, and is located across from me.", "pj": "וְשָׁדַר עִזְגְדִין לְוַת לָבָן אֲרַמִי הוּא בִּלְעָם דִבְעָא לְמִבְלוֹעַ יַת עַמָא בֵּית יִשְׂרָאֵל בַּר בְּעוֹר דְאִיטַפַּשׁ מִסוֹגְעֵי חָכְמָתֵיהּ וְלָא חַס עַל יִשְׂרָאֵל זַרְעָא דִבְנֵי בְנָתֵיהּ וּבֵית מוֹתְבֵיהּ בְּפַדַן הִיא פְּתוֹר עַל שְׁמֵיהּ פָּתִיר חֶלְמַיָא וְהִיא מִתְבַּנְיָא בַּאֲרָם דְעַל פְּרָת אַרַע דְפַלְחִין וְסַגְדִין לֵיהּ בְּנֵי עַמָא לְמִקְרֵי לֵיהּ לְמֵימַר הָא עַמָא נְפַק מִמִצְרַיִם וְהָא חָפָא יַת חֶזְוָא דְאַרְעָא וְהוּא שְׁרֵי מִן קִבְלִי", "pj_en": "And he sent unto Laban the Aramite, who was Bileam, (so called because he it was) who sought (Biluva) to swallow up (Amma) the people of the house of Israel: the son of Beor, who was insane from the vastness of his knowledge; and would not spare Israel, the descendants of his sons and daughters: and the house of his habitation in Padan was at Pethor, a name signifying an interpreter of dreams. It was built in Aram upon the Phrat, in a land where the children of the people worshipped and adored him. (To him did Balak send) to call him, saying: Behold, a people hath come out of Mizraim, and, lo, they cover the face of the earth, and are encamped over against me.", "tj": "", "tj_en": "", "rashi": "<b>פתורה.<\/b> כְּשֻׁלְחָנִי זֶה שֶׁהַכֹּל מְרִיצִין לוֹ מָעוֹת, כָּךְ כָּל הַמְּלָכִים מְרִיצִין לוֹ אִגְּרוֹתֵיהֶם, וּלְפִי פְשׁוּטוֹ שֶׁל מִקְרָא כָּךְ שֵׁם הַמָּקוֹם (שם):<br><br><b>ארץ בני עמו.<\/b> שֶׁל בָּלָק, מִשָּׁם הָיָה, וְזֶה הָיָה מִתְנַבֵּא וְאוֹמֵר לוֹ, עָתִיד אַתָּה לִמְלֹךְ; וְאִם תֹּאמַר מִפְּנֵי מָה הִשְׁרָה הַקָּבָּ\"ה שְׁכִינָתוֹ עַל גּוֹי רָשָׁע? כְּדֵי שֶׁלֹּא יִהְיֶה פִתְחוֹן פֶּה לָאֻמּוֹת לוֹמַר, אִלּו הָיוּ לָנוּ נְבִיאִים, חָזַרְנוּ לְמוּטָב, הֶעֱמִיד לָהֶם נְבִיאִים וְהֵם פָּרְצוּ גֶדֶר הָעוֹלָם, שֶׁבַּתְּחִלָּה הָיוּ גְדוּרִים בַּעֲרָיוֹת, וְזֶה נָתַן לָהֶם עֵצָה לְהַפְקִיר עַצְמָן לִזְנוּת:<br><br><b>לקרא לו.<\/b> הַקְּרִיאָה הָיְתָה שֶׁלּוֹ וְלַהֲנָאָתוֹ, שֶׁהָיָה פוֹסֵק לוֹ מָמוֹן הַרְבֵּה:<br><br><b>עם יצא ממצרים.<\/b> וְאִם תֹּאמַר מַה מַּזִּיקְךָ?<br><br><b>הנה כסה את עין הארץ.<\/b> סִיחוֹן וְעוֹג שֶׁהָיוּ שׁוֹמְרִים אוֹתָנוּ עָמְדוּ עֲלֵיהֶם וַהֲרָגוּם:<br><br><b>והוא ישב ממלי.<\/b> חָסֵר כְּתִיב, קְרוֹבִים הֵם לְהַכְרִיתֵנִי כְּמוֹ (תהילים קי\"ח) כִּי אֲמִילַם (תנחומא):", "rashi_en": "פתורה HE SENT TO BALAAM פתורה because he was like a money changer before whom everyone lays coins; similarly all the kings used to send him their letters, asking for his advice. However, according to the literal sense of the text, this was the name of the place (Midrash Tanchuma, Balak 4).<br><br>ארץ בני עמו THE LAND OF THE CHILDREN OF HIS PEOPLE — of Balak's people, for he came from there, and this man (Balaam) had prophesied saying to him, “You are destined to be king”. — And if you ask: Why did the Holy One blessed be He, let his Shechina rest upon so wicked a heathen, I reply that in order that the heathen peoples should have no excuse to say, “If we had prophets, we would have changed for the better”, He raised up prophets for them. Yet they (these prophets) broke down the moral fence of the world, because at first they (the heathens) were fenced in against (they refrained from) immoral living, but this man (Balaam) counselled them to freely offer themselves to prostitution (Midrash Tanchuma, Balak 1; cf. Rashi on Numbers 24:14).<br><br>לקרא לו TO CALL HIM — the call was for him, for his benefit; for he (Balak) fixed for him (agreed to pay him) a large sum.<br><br>עם יצא ממצרים [THERE IS] A PEOPLE COME OUT FROM EGYPT — and if you ask: What harm does that do you?<br><br>הנה כסה את עין הארץ BEHOLD THEY COVER THE FACE OF THE EARTH — Sihon and Og who used to protect us stood up against them, but they slew them (Midrash Tanchuma, Balak 4).<br><br>והוא ישב ממלי AND THEY ARE STATIONED OPPOSITE ME — ממלי is written deficient in the ו (the full form is ממולי, so that it may be connected with מול “to cut off”) — they are near enough to cut me off. The word is the same as in (Psalms 118:10): “that I shall cut them off (אמילם)” (Midrash Tanchuma, Balak 4)."}, {"ch": 22, "v": 6, "aliyah": 4, "heb": "וְעַתָּה֩ לְכָה־נָּ֨א אָֽרָה־לִּ֜י אֶת־הָעָ֣ם הַזֶּ֗ה כִּֽי־עָצ֥וּם הוּא֙ מִמֶּ֔נִּי אוּלַ֤י אוּכַל֙ נַכֶּה־בּ֔וֹ וַאֲגָרְשֶׁ֖נּוּ מִן־הָאָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר־תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַאֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר׃", "onk": "וּכְעַן אִיתָא כְעַן לוֹט לִי יָת עַמָּא הָדֵין אֲרֵי תַקִּיף הוּא מִנִּי מָאִים אֵכּוּל <b>לְאַגָּחָא בֵיהּ קְרָב<\/b> וַאֲתָרֵכִנֵּיהּ מִן אַרְעָא אֲרֵי יְדַעְנָא יָת דִּי תְבָרַךְ מְבָרָךְ וְדִי תְלוֹט לִיט:", "onk_en": "And now, please come and curse this nation for me, for it is too mighty for me, perhaps it will enable us to strike at [<b>wage war with<\/b>] him, and banish them from the land; for I know, that whomever you bless is blessed, and whomever you curse is cursed.”", "pj": "וּכְדוּן אִיתָא בְּבָעוּ לוֹט בְּגִינִי יַת עַמָא הָדֵין אֲרוּם תַּקִיף הוּא מִנִי לְוַואי אֵיכוֹל לְאַזְעוֹרֵיהּ וְאִתְרְכִינֵיהּ מִן אַרְעָא אֲרוּם יַדְעִית יַת דִי תְבוֹרָךְ מְבוֹרָךְ וְדִי תְלוֹט לִיט יֵילוּט", "pj_en": "But now, I entreat, come, curse this people for me, for they are stronger than I, if I may but be able to meet them, though smaller than they, and drive them from the land. For I know that he whom thou dost bless is blessed, and he whom thou dost curse is cursed.", "tj": "", "tj_en": "", "rashi": "<b>נכה בו.<\/b> אֲנִי וְעַמִּי נַכֶּה בָהֶם. דָּ\"אַ — לְשׁוֹן מִשְׁנָה הוּא (ב\"מ ק\"ה), מְנַכֶּה לוֹ מִן הַדָּמִים — לְחַסֵּר מֵהֶם מְעַט (תנחומא):<br><br><b>כי ידעתי וגו'.<\/b> עַל יְדֵי מִלְחֶמֶת סִיחוֹן שֶׁעֲזַרְתּוֹ לְהַכּוֹת אֶת מוֹאָב:", "rashi_en": "נכה בו (this may mean, “we may smite them”) I and my people may smite them. — Another explanation is that this is a Mishnaic Hebrew expression as in (Bava Metzia 105b) “he deducts (מנכה) for him something from the price”, so that it means: [perhaps I may be able] to reduce them a little in numbers (Midrash Tanchuma, Balak 4).<br><br>כי ידעתי וגו׳ FOR I KNOW etc., through the war of Sihon against Moab, because you assisted him to smite Moab (Midrash Tanchuma, Balak 4; cf. Rashi on 21:27)."}, {"ch": 22, "v": 7, "aliyah": 4, "heb": "וַיֵּ֨לְכ֜וּ זִקְנֵ֤י מוֹאָב֙ וְזִקְנֵ֣י מִדְיָ֔ן וּקְסָמִ֖ים בְּיָדָ֑ם וַיָּבֹ֙אוּ֙ אֶל־בִּלְעָ֔ם וַיְדַבְּר֥וּ אֵלָ֖יו דִּבְרֵ֥י בָלָֽק׃", "onk": "וַאֲזָלוּ סָבֵי מוֹאָב וְסָבֵי מִדְיָן וְקִסְמַיָּא בִּידֵיהוֹן וַאֲתוֹ לְוָת בִּלְעָם וּמַלִּילוּ עִמֵּיהּ פִּתְגָּמֵי בָלָק:", "onk_en": "And the elders of Moav and Midian went with magic charms in their hands; they came to Bil’am and conveyed Balak's message to him.", "pj": "וַאֲזָלוּ סָבֵי מוֹאָב וְסָבֵי מִדְיָן וּמִיגְדִין דְקִיסְמִין חֲתִימִין בִּידֵיהוֹן וְאָתוּ לְוַת בִּלְעָם וּמַלִילוּ עִמֵיהּ פִּתְגָמֵי בָּלָק", "pj_en": "And the elders of Moab and of Midian went, with the price of divinations sealed up in their hands, and came to Bileam, and told him the words of Balak.", "tj": "וַאֲזָלוּ חַכִּימֵי מוֹאֲבָאֵי וְחַכִּימֵי מִדְיָנָאֵי וְאִגְרִין חֲתִימִין בִּידֵיהוֹן וְאָתוּ לְוַת בִּלְעָם וּמַלִילוּ עִמֵיהּ פִּתְגָמֵי דְבָלָק:", "tj_en": "And the sages of the Moabites and of the Midianites went, with sealed letters in their hands, and came to Bileam, and spake with him the words of Balak.", "rashi": "<b>וקסמים בידם.<\/b> כָּל מִינֵי קְסָמִים, שֶׁלֹּא יֹאמַר אֵין כְּלֵי תַשְׁמִישִׁי עִמִּי; דָּ\"אַ — קֶסֶם זֶה נָטְלוּ בְיָדָם זִקְנֵי מִדְיָן, אָמְרוּ אִם יָבֹא עִמָּנוּ בַּפַּעַם הַזֹּאת יֵשׁ בּוֹ מַמָּשׁ, וְאִם יִדְחֵנוּ אֵין בּוֹ תוֹעֶלֶת, לְפִיכָךְ כְּשֶׁאָמַר לָהֶם \"לִינוּ פֹה הַלַּיְלָה\" אָמְרוּ אֵין בּוֹ תִקְוָה, הִנִּיחוּהוּ וְהָלְכוּ לָהֶם, שֶׁנֶּאֱמַר \"וַיֵּשְׁבוּ שָׂרֵי מוֹאָב עִם בִּלְעָם\", אֲבָל זִקְנֵי מִדְיָן הָלְכוּ לָהֶם (שם):", "rashi_en": "וקסמים בידם AND DIVINATIONS WERE IN THEIR HANDS — all kinds of divination, in order that he should not say, “I have not got my tools with me”. — Another explanation is: this omen (קסם) the elders of Midyan took with them: — they said, “If he comes with us this time, there is something substantial in him, but if he puts us off there is no use of him”. — Consequently when he told them, “Stay here tonight”, they said, There is no hope in him”; they left him and went away, as it is said, (v. 8) And the princes of Moab stayed with Balaam”, but the princes of Midyan went away (Midrash Tanchuma, Balak 5)."}, {"ch": 22, "v": 8, "aliyah": 4, "heb": "וַיֹּ֣אמֶר אֲלֵיהֶ֗ם לִ֤ינוּ פֹה֙ הַלַּ֔יְלָה וַהֲשִׁבֹתִ֤י אֶתְכֶם֙ דָּבָ֔ר כַּאֲשֶׁ֛ר יְדַבֵּ֥ר יְהֹוָ֖ה אֵלָ֑י וַיֵּשְׁב֥וּ שָׂרֵֽי־מוֹאָ֖ב עִם־בִּלְעָֽם׃", "onk": "וַאֲמַר לְהוֹן בִּיתוּ הָכָא בְּלֵילְיָא וְאָתֵב יָתְכוֹן פִּתְגָּמָא כְּמָא דִּי מַלֵּיל יְיָ עִמִּי וְאוֹרִיכוּ רַבְרְבֵי מוֹאָב עִם בִּלְעָם:", "onk_en": "He replied to them: “Spend this night here and then I will give you an answer according to what Adonoy tells me,’’ and the dignitaries of Moav remained with Bil’am.", "pj": "וַאֲמַר לְהוֹן בִּיתוּ הָכָא בְלֵילְיָא וְאָתִיב יַתְכוֹן פִּתְגָמָא הֵיכְמָא דִי יְמַלֵיל יְיָ עִמִי וְאַסְחָרוּ רַבְרְבֵי מוֹאָב עִם בִּלְעָם", "pj_en": "And he said to them, Abide here tonight, and I will return you word as the Lord shall speak with me. And the princes of Moab stayed with Bileam.", "tj": "", "tj_en": "", "rashi": "<b>לינו פה הלילה.<\/b> אֵין רוּחַ הַקֹּדֶשׁ שׁוֹרָה עָלָיו אֶלָּא בַּלַּיְלָה, וְכֵן לְכָל נְבִיאֵי אֻמּוֹת הָעוֹלָם, וְכֵן לָבָן בַּחֲלוֹם הַלַּיְלָה, שֶׁנֶּאֱמַר (בראשית ל\"א) \"וַיָּבֹא אֱלֹהִים אֶל לָבָן הָאֲרַמִּי בַּחֲלוֹם הַלַּיְלָה\" כְּאָדָם הַהוֹלֵךְ אֵצֶל פִּילַגְשׁוֹ בְּהֵחָבֵא (תנחומא; ויקרא רבה א'):<br><br><b>כאשר ידבר ה' אלי.<\/b> אִם יַמְלִיכֵנִי לָלֶכֶת עִם בְּנֵי אָדָם כְּמוֹתְכֶם, אֵלֵךְ עִמָּכֶם, שֶׁמָּא אֵין כְּבוֹדוֹ לְתִתִּי לַהֲלֹךְ אֶלָּא עִם שָׂרִים גְּדוֹלִים מִכֶּם:<br><br><b>וישבו.<\/b> לְשׁוֹן עַכָּבָה:", "rashi_en": "לינו פה הלילה LODGE HERE THIS NIGHT — The Holy Spirit rested upon him only at night time, and similarly in the case of all the prophets of the heathen peoples, and similarly He revealed Himself to Laban in a dream at night, as it is said, (Genesis 31:24) “And God came to Laban in a dream of the night” — as a man who comes to his concubine furtively (cf. Leviticus Rabbah 1 13; Rashi on Job 12:4).<br><br>כאשר ידבר ה' אלי [AND I WILL GIVE YOU AN ANSWER] AS THE LORD SHALL SPEAK TO ME — If He advises me to go with people such as you I will go with you; but perhaps it is not compatible with His dignity to permit me to go except with princes greater than you.<br><br>וישבו — this is an expression for “remaining”, (they remained with Balaam)."}, {"ch": 22, "v": 9, "aliyah": 4, "heb": "וַיָּבֹ֥א אֱלֹהִ֖ים אֶל־בִּלְעָ֑ם וַיֹּ֕אמֶר מִ֛י הָאֲנָשִׁ֥ים הָאֵ֖לֶּה עִמָּֽךְ׃", "onk": "וַאֲתָא <b>מֵימַר מִן קֳדָם<\/b> יְיָ לְוָת בִּלְעָם וַאֲמַר מָן גֻּבְרַיָּא הָאִלֵּין דְּעִמָּךְ:", "onk_en": "God[<b>’s word<\/b>] appeared to [<b>before<\/b>] Bil’am and said, “Who are these men with you?”", "pj": "וְאָתָא מֵימַר מִן קֳדָם יְיָ לְבִלְעָם וַאֲמַר מַאן גוּבְרַיָא הָאִלֵין כְּעַן דְבִיתוּ עִמָךְ", "pj_en": "And the Word from before the Lord came to Bileam, and He said, What men are these who are now lodging with thee?", "tj": "", "tj_en": "", "rashi": "<b>מי האנשים האלה עמך.<\/b> לְהַטְעוֹתוֹ בָא, אָמַר פְּעָמִים שֶׁאֵין הַכֹּל גָּלוּי לְפָנָיו, אֵין דַּעְתּוֹ שָׁוָה עָלָיו, אַף אֲנִי אֶרְאֶה עֵת שֶׁאוּכַל לְקַלֵּל וְלֹא יָבִין (תנחומא):", "rashi_en": "מי האנשים האלה עמך WHO ARE THESE MEN WITH THEE? — By putting this question He intended to delude him. And indeed he (Balaam) thereupon said: “It seems, then, that there are times when everything is not manifest to Him; His knowledge is not always alike. I will select a time when I can curse and when He will not observe it” (Midrash Tanchuma, Balak 5)."}, {"ch": 22, "v": 10, "aliyah": 4, "heb": "וַיֹּ֥אמֶר בִּלְעָ֖ם אֶל־הָאֱלֹהִ֑ים בָּלָ֧ק בֶּן־צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽי׃", "onk": "וַאֲמַר בִּלְעָם קֳדָם יְיָ בָּלָק בַּר צִפּוֹר מַלְכָּא דְמוֹאָב שְׁלַח לְוָתִי:", "onk_en": "Bil’am replied to God: “Balak son of Tzipor, King of Moav, has sent them to me [saying]:", "pj": "וַאֲמַר בִּלְעָם קֳדָם יְיָ בָּלָק בַּר צִפּוֹר מֶלֶךְ מוֹאָב שָׁדַר פּוּלִין לְוָתִי", "pj_en": "And Bileam said before the Lord, Balak bar Zippor, king of the Moabaee, hath sent messengers to me, saying:", "tj": "", "tj_en": "", "rashi": "<b>בלק בן צפור וגו'.<\/b> אַעַ\"פִּ שֶׁאֵינִי חָשׁוּב בְּעֵינֶיךָ, חָשׁוּב אֲנִי בְּעֵינֵי הַמְּלָכִים (שם):", "rashi_en": "בלק בן צפור וגו׳ BALAK THE SON OF ZIPPOR [KING OF MOAB, HAS SENT TO ME] — Although I am of no importance in Your eyes, I am of importance in the eyes of kings (Midrash Tanchuma, Balak 5)."}, {"ch": 22, "v": 11, "aliyah": 4, "heb": "הִנֵּ֤ה הָעָם֙ הַיֹּצֵ֣א מִמִּצְרַ֔יִם וַיְכַ֖ס אֶת־עֵ֣ין הָאָ֑רֶץ עַתָּ֗ה לְכָ֤ה קָֽבָה־לִּי֙ אֹת֔וֹ אוּלַ֥י אוּכַ֛ל לְהִלָּ֥חֶם בּ֖וֹ וְגֵרַשְׁתִּֽיו׃", "onk": "הָא עַמָּא דִּי נְפַק מִמִּצְרַיִם <b>וַחֲפָא יָת עֵין שִׁמְשָׁא<\/b> דְאַרְעָא כְּעַן אִיתָא לוֹט לִי יָתֵיהּ מָאִים אֵיכוּל לְאַגָּחָא בֵיהּ קְרָב וַאֲתָרֵכִנֵּיהּ:", "onk_en": "‘Behold, the people that came out of Egypt has covered [<b>obscured the sunshine from<\/b>] the face of the earth; come now, and curse him for me so that I will be able to wage war against him, and banish him’.”", "pj": "הָא עַמָא נְפַק מִמִצְרַיִם וַחֲפָא יַת חֵיזְוָא דְאַרְעָא וּכְדוּן אִיתָא לוֹט בְּגִינִי יָתֵיהּ לְוַאי אֵיכוֹל לִמְסַדְרָא סִדְרֵי קְרָבָא בֵּיהּ וְאִתְרְכִינֵיהּ", "pj_en": "Behold, a people hath come out of Mizraim, and cover the face of the land: now therefore, come, curse them for me, so that I may be able to fight and drive them away.", "tj": "", "tj_en": "", "rashi": "<b>קבה לי.<\/b> זוֹ קָשָׁה מֵאָרָה לִּי, שֶׁהוּא נוֹקֵב וּמְפָרֵשׁ (שם):<br><br><b>וגרשתיו.<\/b> מִן הָעוֹלָם, וּבָלָק לֹא אָמַר אֶלָּא וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ — אֵינִי מְבַקֵּשׁ אֶלָּא לְהַסִּיעָם מֵעָלַי, וּבִלְעָם הָיָה שׂוֹנְאָם יוֹתֵר מִבָּלָק (שם):", "rashi_en": "קבה לי CURSE FOR ME — this is worse than ארה לי, (the expression which Balak had actually used, v. 6), for in the case of this verb it means that one mentions and pronounces in full [the name of God] when cursing (cf. Rashi on Leviticus 24:16) (Midrash Tanchuma, Balak 5).<br><br>וגרשתיו AND I WILL DRIVE THEM OUT, meaning from the world; but Balak had said only, (v. 6) “and I will drive them out from the land”: I seek only to make them move away from me. Balaam, however, hated them even more than did Balak (cf.Midrash Tanchuma, Balak 5)."}, {"ch": 22, "v": 12, "aliyah": 4, "heb": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּהֶ֑ם לֹ֤א תָאֹר֙ אֶת־הָעָ֔ם כִּ֥י בָר֖וּךְ הֽוּא׃", "onk": "וַאֲמַר יְיָ לְבִלְעָם לָא תֵזִל עִמְּהוֹן לָא תְלוּט יָת עַמָּא אֲרֵי בְרִיךְ הוּא:", "onk_en": "God said to Bil’am: “Do not go with them! You shall not curse the people, for they are blessed.”", "pj": "וַאֲמַר יְיָ לְבִלְעָם לָא תֵזִיל עִמְהוֹן וְלָא תְלוּט יַת עַמָא אֲרוּם בָּרִיכִין הִינוּן מִנִי מִיוֹמָא דְאַבְהַתְהוֹן", "pj_en": "And the Lord said unto Bileam, Thou shalt not go with them, nor curse the people, for they are blessed of Me from the day of their fathers.", "tj": "", "tj_en": "", "rashi": "<b>לא תלך עמהם.<\/b> אָמַר לוֹ אִם כֵּן אֲקַלְּלֵם בִּמְקוֹמִי, אָמַר לוֹ <b>לא תאר את העם<\/b>, אָמַר לוֹ אִם כֵּן אֲבָרְכֵם, אָמַר לוֹ אֵינָם צְרִיכִים לְבִרְכָתְךָ, <b>כי ברוך הוא<\/b>, מָשָׁל, אוֹמְרִים לְצִרְעָה לֹא מִדֻּבְשֵׁךְ וְלֹא מֵעֻקְצֵךְ (שם):", "rashi_en": "לא תלך עמהם THOU SHALT NOT GO WITH THEM — He said: If so, I will curse them in my own place. Whereupon God answered: לא תאור את העם THOU SHALT NOT CURSE THE PEOPLE. — He said to Him: If so, I will bless them. He replied to him: They do not need your blessing, כי ברוך הוא FOR THEY ARE ALREADY BLESSED. A parable! People say to the hornet: neither any of your honey nor any of your sting! (Midrash Tanchuma, Balak 6)."}, {"ch": 22, "v": 13, "aliyah": 5, "heb": "וַיָּ֤קׇם בִּלְעָם֙ בַּבֹּ֔קֶר וַיֹּ֙אמֶר֙ אֶל־שָׂרֵ֣י בָלָ֔ק לְכ֖וּ אֶֽל־אַרְצְכֶ֑ם כִּ֚י מֵאֵ֣ן יְהֹוָ֔ה לְתִתִּ֖י לַהֲלֹ֥ךְ עִמָּכֶֽם׃", "onk": "וְקָם בִּלְעָם בְּצַפְרָא וַאֲמַר לְרַבְרְבֵי בָלָק אִיזִילוּ לְאַרְעֲכוֹן אֲרֵי <b>לֵית רַעֲוָא קֳדָם יְיָ<\/b> לְמִשְׁבְּקִי לְמִזַל עִמְּכוֹן:", "onk_en": "Bil’am arose in the morning and said to Balak's dignitaries: “Go back to your land, for Adonoy refuses [<b>it is not the will of Hashem<\/b>] to allow me to go with you.”", "pj": "וְקָם בִּלְעָם בְּצַפְרָא וַאֲמַר לְרַבְרְבֵי מוֹאָב אִזִילוּ לְאַרְעֲכוֹן אֲרוּם לֵית רַעֲוָא מִן קֳדָם יְיָ לְמִשְׁבְּקִי לְמֵיזַל עִמְכוֹן", "pj_en": "And Bileam rose up early, and said to the princes of Moab, Go unto your country, for it is not pleasing before the Lord to permit me to journey with you.", "tj": "", "tj_en": "", "rashi": "<b>להלך עמכם.<\/b> אֶלָּא עִם שָׂרִים גְּדוֹלִים מִכֶּם, לָמַדְנוּ שֶׁרוּחוֹ גְבוֹהָה, וְלֹא רָצָה לְגַלּוֹת שֶׁהוּא בִרְשׁוּתוֹ שֶׁל מָקוֹם, אֶלָּא בִלְשׁוֹן גַּסּוּת, לְפִיכָךְ <b>ויסף עוד בלק<\/b>:", "rashi_en": "להלך עמכם [THE LORD REFUSES TO GIVE ME LEAVE] TO GO WITH YOU, but only with princes greater than you. This tells us that he was of a proud nature and he did not wish to divulge that he was under the control of the Omnipresent except in arrogant terms (“God will not permit me to go with you”). Consequently (v. 15), ויוסף עוד בלק “Balak sent yet again [more princes, and more honorable than these] (Midrash Tanchuma, Balak 6)."}, {"ch": 22, "v": 14, "aliyah": 5, "heb": "וַיָּק֙וּמוּ֙ שָׂרֵ֣י מוֹאָ֔ב וַיָּבֹ֖אוּ אֶל־בָּלָ֑ק וַיֹּ֣אמְר֔וּ מֵאֵ֥ן בִּלְעָ֖ם הֲלֹ֥ךְ עִמָּֽנוּ׃", "onk": "וְקָמוּ רַבְרְבֵי מוֹאָב וַאֲתוֹ לְוָת בָּלָק וַאֲמָרוּ סָרֵב בִּלְעָם לְמֵתֵי עִמָּנָא:", "onk_en": "Moav's dignitaries got up, and came to Balak and said: “Bil’am refuses to go with us.”", "pj": "וְקָמוּ רַבְרְבֵי מוֹאָב וְאָתוּ לְוַת בָּלָק וַאֲמָרוּ מְסָרֵב בִּלְעָם לְמֵיתֵי עִמָנָא", "pj_en": "And the princes of Moab arose and came to Balak, and said, Bileam hath refused to come with us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 15, "aliyah": 5, "heb": "וַיֹּ֥סֶף ע֖וֹד בָּלָ֑ק שְׁלֹ֣חַ שָׂרִ֔ים רַבִּ֥ים וְנִכְבָּדִ֖ים מֵאֵֽלֶּה׃", "onk": "וְאוֹסִיף עוֹד בָּלָק לְמִשְׁלַח רַבְרְבִין סַגִּיאִין וְיַקִּירִין מֵאִלֵּין:", "onk_en": "Balak persisted and sent dignitaries in greater number and of higher rank than these.", "pj": "וְאוֹסֵף תּוּב בָּלָק לִמְשַׁדְרָא רַבְרְבִין סַגִיאִין וְיַקִירִין מֵאִלֵין", "pj_en": "But Balak added to send (other) princes more, and nobler than they;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 16, "aliyah": 5, "heb": "וַיָּבֹ֖אוּ אֶל־בִּלְעָ֑ם וַיֹּ֣אמְרוּ ל֗וֹ כֹּ֤ה אָמַר֙ בָּלָ֣ק בֶּן־צִפּ֔וֹר אַל־נָ֥א תִמָּנַ֖ע מֵהֲלֹ֥ךְ אֵלָֽי׃", "onk": "וַאֲתוֹ לְוָת בִּלְעָם וַאֲמָרוּ לֵיהּ כִּדְנַן אֲמַר בָּלָק בַּר צִפּוֹר לָא כְעַן תִּתְמְנַע מִלְּמֵתֵי לְוָתִי:", "onk_en": "They came to Bil’am and said to him: “The following is a message from Balak the son Tzipor: ‘Please do not refuse to come to me.", "pj": "וְאָתוּ לְוַת בִּלְעָם וַאֲמָרוּ לֵיהּ כִּדְנַן אָמַר בָּלָק בַּר צִפּוֹר לָא כְּדוֹן תִּתְמְנַע מִלְמֵיתֵי לְוָתִי", "pj_en": "and they came to Bileam, and said to him: Thus saith Balak bar Zippor, Let not anything hinder thee from coming to me;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 17, "aliyah": 5, "heb": "כִּֽי־כַבֵּ֤ד אֲכַבֶּדְךָ֙ מְאֹ֔ד וְכֹ֛ל אֲשֶׁר־תֹּאמַ֥ר אֵלַ֖י אֶֽעֱשֶׂ֑ה וּלְכָה־נָּא֙ קָֽבָה־לִּ֔י אֵ֖ת הָעָ֥ם הַזֶּֽה׃", "onk": "אֲרֵי יְקָרָא אֲיַקְּרִנָּךְ לַחֲדָא וְכֹל דִּי תֵימַר לִי אַעְבֵּד וְאִיתָא כְעַן לוֹט לִי יָת עַמָּא הָדֵין:", "onk_en": "For I will honor you greatly and whatever you tell me, I will do, if you would just please come and curse this people for me.’”", "pj": "אֲרוּם מִיקְרָא אֲיַקְרִינָךְ לַחֲדָא וְכָל דְתֵימַר לִי אֶעֱבַד וְאִיתָא כְדוֹן לוּט לְוָתִי יַת עַמָא הָדֵין", "pj_en": "for honouring I will honour thee greatly, and whatever thou biddest me I will do. Come therefore now, and curse this people for me.", "tj": "", "tj_en": "", "rashi": "<b>כי כבד אכבדך מאד.<\/b> יוֹתֵר מִמַּה שֶּׁהָיִיתָ נוֹטֵל לְשֶׁעָבַר אֲנִי נוֹתֵן לְךָ (שם):", "rashi_en": "כי כבד אכבדך מאד FOR I WILL HONOR THEE EXCEEDINGLY — Exceedingly: more than you have ever received as a fee in the past (cf. Rashi Numbers 21:27) will I now give you (Midrash Tanchuma, Balak 6)."}, {"ch": 22, "v": 18, "aliyah": 5, "heb": "וַיַּ֣עַן בִּלְעָ֗ם וַיֹּ֙אמֶר֙ אֶל־עַבְדֵ֣י בָלָ֔ק אִם־יִתֶּן־לִ֥י בָלָ֛ק מְלֹ֥א בֵית֖וֹ כֶּ֣סֶף וְזָהָ֑ב לֹ֣א אוּכַ֗ל לַעֲבֹר֙ אֶת־פִּי֙ יְהֹוָ֣ה אֱלֹהָ֔י לַעֲשׂ֥וֹת קְטַנָּ֖ה א֥וֹ גְדוֹלָֽה׃", "onk": "וְאָתֵב בִּלְעָם וַאֲמַר לְעַבְדֵי בָלָק אִם יִתֶּן לִי בָלָק מְלֵי בֵיתֵיהּ כְּסַף וּדְהָב <b>לֵית לִי רְשׁוּ<\/b> לְמֶעְבַּר עַל גְּזֵרַת מֵימְרָא דַיְיָ אֱלָהִי לְמֶעְבַּד זְעֶרְתָּא אוֹ רַבְּתָא:", "onk_en": "Bil’am answered and said to Balak's servants: “Even if Balak would give me silver and gold enough to fill his house, I cannot [<b>have no permission<\/b>] transgress the word of Adonoy my God, by doing anything small or great.", "pj": "וְאָתֵיב בִּלְעָם וַאֲמַר לְעַבְדֵי בָלָק אִין יִתֵּן לִי בָּלָק מְלֵי בֵיתֵיהּ קוּרְטוּר דִילֵיהּ כְּסַף וּדְהַב לֵית לִי רְשׁוּ לְמֶעֱבַר עַל גְזֵירַת מֵימְרָא דַיְיָ אֱלָהָי לְמֶעֱבַד מִילְתָא זְעֵירְתָּא אוֹ רַבְּתָא", "pj_en": "And Bileam answered the servants of Balak, and said, If Balak would give me out of his treasury a house full of silver and gold, I have no power to transgress the decree &lt;gzyrt&gt; of the Word &lt;mymr'&gt; of the Lord my God, to fabricate a word &lt;mlt'&gt; either small or great.", "tj": "", "tj_en": "", "rashi": "<b>מלא ביתו כסף וזהב.<\/b> לָמַדְנוּ שֶׁנַּפְשׁוֹ רְחָבָה וּמְחַמֵּד מָמוֹן אֲחֵרִים, אָמַר רָאוּי לוֹ לִתֵּן לִי כָּל כֶּסֶף וְזָהָב שֶׁלּוֹ, שֶׁהֲרֵי צָרִיךְ לִשְׂכֹּר חַיָּלוֹת רַבּוֹת, סָפֵק נוֹצֵחַ סָפֵק אֵינוֹ נוֹצֵחַ, וַאֲנִי וַדַּאי נוֹצֵחַ (שם):<br><br><b>לא אוכל לעבר.<\/b> עַל כָּרְחוֹ גִלָּה שֶׁהוּא בִרְשׁוּת אַחֵרִים, וְנִתְנַבֵּא כָאן שֶׁאֵינוֹ יָכוֹל לְבַטֵּל הַבְּרָכוֹת שֶׁנִּתְבָּרְכוּ הָאָבוֹת מִפִּי הַשְּׁכִינָה (שם):", "rashi_en": "מלא ביתו כסף וזהב [IF BALAK WOULD GIVE ME HIS HOUSE] FULL OF SILVER AND GOLD — This tells us that he was avaricious and covetous of other peoples wealth. He said: He ought to give me all his silver and gold, for, behold, he would otherwise have to hire many armies to fight against them. Even then it is doubtful whether he would conquer or not conquer, but “I” would certainly conquer (Midrash Tanchuma, Balak 6).<br><br>לא אוכל לעבר I CANNOT GO BEYOND [THE WORD OF THE LORD] — Against his own will he divulged to them that he was under the control of others, and he prophesied here that he would be unable to annul those blessings with which the patriarchs had been blessed by the mouth of God (Midrash Tanchuma, Balak 6)."}, {"ch": 22, "v": 19, "aliyah": 5, "heb": "וְעַתָּ֗ה שְׁב֨וּ נָ֥א בָזֶ֛ה גַּם־אַתֶּ֖ם הַלָּ֑יְלָה וְאֵ֣דְעָ֔ה מַה־יֹּסֵ֥ף יְהֹוָ֖ה דַּבֵּ֥ר עִמִּֽי׃", "onk": "וּכְעַן אוֹרִיכוּ כְעַן הָכָא אַף אַתּוּן בְּלֵילְיָא וְאִדַּע מָא יוֹסֵף יְיָ לְמַלָּלָא עִמִּי:", "onk_en": "Now, you also, please remain here overnight, and I will get to know what more will Adonoy tell me.”", "pj": "וּכְדוּן אַסְחָרוּ בְּבָעוּ הָכָא אוּף אַתּוּן בְּלֵילְיָא וְאִינְדַע מַה יוֹסִיף מֵימְרָא דַיְיָ לְמַלָלָא עִמִי", "pj_en": "But I entreat you to remain here this night also, that I may know what the Word &lt;mymr'&gt; of the Lord may yet speak with me.", "tj": "", "tj_en": "", "rashi": "<b>גם אתם.<\/b> פִּיו הִכְשִׁילוֹ — גַּם אַתֶּם סוֹפְכֶם לֵילֵךְ בְּפַחֵי נֶפֶשׁ כָּרִאשׁוֹנִים:<br><br><b>מה יסף.<\/b> לֹא יְשַׁנֶּה דְבָרָיו מִבְּרָכָה לִקְלָלָה, הַלְוַאי שֶׁלֹּא יוֹסִיף לְבָרֵךְ; כָּאן נִתְנַבֵּא שֶׁעָתִיד לְהוֹסִיף לָהֶם בְּרָכוֹת עַל יָדוֹ (שם):", "rashi_en": "גם אתם [ABIDE] ALSO YE [HERE] — His mouth tripped him up (unwittingly he spoke the truth): you also in the end will go away disappointed as the former princes (Midrash Tanchuma, Balak 6).<br><br>מה יסף WHAT MORE [THE LORD WILL SAY TO ME] — He certainly will not change His words from a blessing to a curse: I only hope that he will not add a further blessing. — He here prophesied that He would in the end give them a further blessing by his agency (Midrash Tanchuma, Balak 6)."}, {"ch": 22, "v": 20, "aliyah": 5, "heb": "וַיָּבֹ֨א אֱלֹהִ֥ים&thinsp;<small>׀<\/small>&thinsp;אֶל־בִּלְעָם֮ לַ֒יְלָה֒ וַיֹּ֣אמֶר ל֗וֹ אִם־לִקְרֹ֤א לְךָ֙ בָּ֣אוּ הָאֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑ם וְאַ֗ךְ אֶת־הַדָּבָ֛ר אֲשֶׁר־אֲדַבֵּ֥ר אֵלֶ֖יךָ אֹת֥וֹ תַעֲשֶֽׂה׃", "onk": "וַאֲתָא <b>מֵימַר מִן קֳדָם<\/b> יְיָ לְבִלְעָם בְּלֵילְיָא וַאֲמַר לֵיהּ אִם לְמִקְרֵי לָךְ אֲתוֹ גֻבְרַיָּא קוּם אִזֵּל עִמְּהוֹן וּבְרַם יָת פִּתְגָּמָא דִּי אֲמַלֵּל עִמָּךְ יָתֵיהּ תַּעְבֵּד:", "onk_en": "God[<b>’s word<\/b>] appeared [<b>before<\/b>] to Bil’am that night and said to him: “If the men have come to call you, arise and go with them; however, whatever I will say to you, you will do.”", "pj": "וְאָתָא מֵימַר מִן קֳדָם יְיָ לְבִלְעָם בְּלֵילְיָא וַאֲמַר לֵיהּ אִין לְמִקְרֵי לָךְ אָתוּ גוּבְרַיָא קוּם טַיֵיל עִמְהוֹן וּלְחוֹד פִּתְגָמָא דַאֲמַלֵיל עִמָךְ יָתֵיהּ תַּעֲבֵיד", "pj_en": "And the Word &lt;mymr'&gt; came from before the Lord unto Bileam in the night, and said to him, If these men come to call thee, arise, go with them; only, the word &lt;ptgm'&gt; that I will speak with thee, that shalt thou do.", "tj": "", "tj_en": "", "rashi": "<b>אם לקרא לך.<\/b> אִם הַקְּרִיאָה שֶׁלְּךָ וְסָבוּר אַתָּה לִטֹּל עָלֶיהָ שָׂכָר, <b>קום לך אתם<\/b>:<br><br><b>ואך.<\/b> עַל כָּרְחֲךָ <b>את הדבר אשר אדבר אליך אתו תעשה;<\/b> וְאַף עַל פִּי כֵן וַיֵּלֶךְ בִּלְעָם, אָמַר שֶׁמָּא אֲפַתֶּנּוּ וְיִתְרַצֶּה:", "rashi_en": "אם לקרא לך IF [THE MEN COME] TO CALL THEE — If the call be for you, for your benefit, and you think to take a fee for it.<br><br>קום לך אתם ARISE, GO WITH THEM, ואך BUT, in spite of yourself, את הדבר אשר אדבר אליך אתו תעשה THE WORD WHICH I SHALL SPEAK TO THEE, THAT SHALL YOU DO, and, nevertheless, Balaam went (as it is stated in the next verse), for he said: perhaps I may persuade Him and He will agree that I should curse."}, {"ch": 22, "v": 21, "aliyah": 5, "heb": "וַיָּ֤קׇם בִּלְעָם֙ בַּבֹּ֔קֶר וַֽיַּחֲבֹ֖שׁ אֶת־אֲתֹנ֑וֹ וַיֵּ֖לֶךְ עִם־שָׂרֵ֥י מוֹאָֽב׃", "onk": "וְקָם בִּלְעָם בְּצַפְרָא <b>וְזָרִיז<\/b> יָת אַתָּנֵיהּ וַאֲזַל עִם רַבְרְבֵי מוֹאָב:", "onk_en": "Bil’am arose in the morning, saddled [<b>readied<\/b>] his donkey, and went with the Moavite dignitaries.", "pj": "וְקָם בִּלְעָם בְּצַפְרָא וְזָרִיז יַת אַתְנֵיהּ וַאֲזַל עִם רַבְרְבֵי מוֹאָב", "pj_en": "And Bileam, arose in the morning, and saddled his ass, and went with the princes of Moab.", "tj": "וְקָם בִּלְעָם בְּצַפְרָא וְשַׁוֵי יַת אַתְנֵיהּ וַאֲזַל עִם רַבְרְבָנֵי מוֹאָב:", "tj_en": "And Bileam arose in the morning, and made ready his ass, and went with the princes of Moab.", "rashi": "<b>ויחבש את אתנו.<\/b> מִכָּאן שֶׁהַשִּׂנְאָה מְקַלְקֶלֶת אֶת הַשּׁוּרָה, שֶׁחָבַשׁ הוּא בְּעַצְמוֹ; אָמַר הַקָּבָּ\"ה רָשָׁע כְּבָר קְדָמְךָ אַבְרָהָם אֲבִיהֶם, שֶׁנֶּאֱמַר (בראשית כ\"ב) \"וַיַּשְׁכֵּם אַבְרָהָם בַּבֹּקֶר וַיַּחֲבֹשׁ אֶת חֲמֹרוֹ\" (תנחומא):<br><br><b>עם שרי מואב.<\/b> לִבּוֹ כְּלִבָּם שָׁוֶה:", "rashi_en": "ויחבש את אתנו AND HE SADDLED HIS SHE-ASS — From here we may learn that the hatred one bears for a person makes one disregard the rule imposed upon him by his exalted position, for he, himself, not a servant, did the saddling. The Holy One, blessed be He, said: You wicked man! Their ancestor Abraham has already anticipated you in this, as it is said, (Genesis 22:3) “And Abraham rose up early in the morning and saddled his ass”) (Midrash Tanchuma, Balak 8; cf. Sanhedrin 105b).<br><br>עם שרי מואב [HE WENT] WITH THE PRINCES OF MOAB — his heart alike with their hearts (cf. Midrash Tanchuma, Balak 8)."}, {"ch": 22, "v": 22, "aliyah": 5, "heb": "וַיִּֽחַר־אַ֣ף אֱלֹהִים֮ כִּֽי־הוֹלֵ֣ךְ הוּא֒ וַיִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהֹוָ֛ה בַּדֶּ֖רֶךְ לְשָׂטָ֣ן ל֑וֹ וְהוּא֙ רֹכֵ֣ב עַל־אֲתֹנ֔וֹ וּשְׁנֵ֥י נְעָרָ֖יו עִמּֽוֹ׃", "onk": "וּתְקֵף רָגְזָא דַיְיָ אֲרֵי אָזֵל הוּא וְאִתְעַתַּד מַלְאָכָא דַיְיָ בְּאָרְחָא לְשָׂטָן לֵיהּ וְהוּא רָכִיב עַל אַתָּנֵיהּ וּתְרֵין עוּלֵמוֹהִי עִמֵּיהּ:", "onk_en": "God showed anger because he went, and an angel of Adonoy placed himself in the way to thwart him, as he was riding on his donkey accompanied by his two attendants.", "pj": "וּתְקֵיף רוּגְזָא דַיְיָ אֲרוּם אָזִיל הוּא לִלְטוֹנִינוּן וְאִתְעַתַּד מַלְאָכָא דַיְיָ בְּאִסְרָטָא לְמִישְטַן לֵיהּ וְהוּא רְכִיב עַל אַתְנֵיהּ וּתְרֵין עוּלֵימוֹי יֵנִיס וְיֵמְרִיס עִמֵיהּ", "pj_en": "But the anger of the Lord was provoked, because he would go (that he might) curse them; and the angel of the Lord stood in the way to be an adversary to him. But he sat upon his ass, and his two young men, Jannes and Jambres, were with him.", "tj": "", "tj_en": "", "rashi": "<b>כי הולך הוא.<\/b> רָאָה שֶׁהַדָּבָר רַע בְּעֵינֵי הַמָּקוֹם וְנִתְאַוָּה לֵילֵךְ:<br><br><b>לשטן לו.<\/b> מַלְאָךְ שֶׁל רַחֲמִים הָיָה, וְהָיָה רוֹצֶה לְמָנְעוֹ מִלַּחֲטֹא, שֶׁלֹּא יֶחֱטָא וְיֹאבַד (שם):<br><br><b>ושני נעריו עמו.<\/b> מִכָּאן לְאָדָם חָשׁוּב הַיּוֹצֵא לַדֶּרֶךְ יוֹלִיךְ עִמּוֹ שְׁנֵי אֲנָשִׁים לְשַׁמְּשׁוֹ, וְחוֹזְרִים וּמְשַׁמְּשִׁים זֶה אֶת זֶה (שם):", "rashi_en": "כי הולך הוא [AND GOD'S ANGER WAS KINDLED] BECAUSE HE WENT — He perceived that the matter was evil in the eyes of the Omni-present and yet he longed to go.<br><br>לשטן לו [AND THE ANGEL OF THE LORD STOOD IN THE WAY] FOR AN OBSTRUCTION AGAINST HIM — It was an Angel of Mercy מלאך ה׳, an angel of the Lord,( the designation of God as a God of Mercy), and he wished to deter him from sinning — so that he should not sin and perish (Midrash Tanchuma, Balak 8).<br><br>ושני נעריו עמו AND HIS TWO LADS WERE WITH HIM — From here we have a rule for a distinguished personage who is going on a journey, that he should take with him two men to serve him, so that these in turn may serve one another (i.e., act for one another by taking over the other’s duties if he must leave his master for a short time) (Midrash Tanchuma, Balak 8). (See Rashi Genesis 22:3)."}, {"ch": 22, "v": 23, "aliyah": 5, "heb": "וַתֵּ֣רֶא הָאָתוֹן֩ אֶת־מַלְאַ֨ךְ יְהֹוָ֜ה נִצָּ֣ב בַּדֶּ֗רֶךְ וְחַרְבּ֤וֹ שְׁלוּפָה֙ בְּיָד֔וֹ וַתֵּ֤ט הָֽאָתוֹן֙ מִן־הַדֶּ֔רֶךְ וַתֵּ֖לֶךְ בַּשָּׂדֶ֑ה וַיַּ֤ךְ בִּלְעָם֙ אֶת־הָ֣אָת֔וֹן לְהַטֹּתָ֖הּ הַדָּֽרֶךְ׃", "onk": "וַחֲזַת אַתָּנָא יָת מַלְאָכָא דַיְיָ מְעַתַּד בְּאָרְחָא וְחַרְבֵּיהּ שְׁלִיפָא בִּידֵיהּ וּסְטַת אַתָּנָא מִן אוֹרְחָא וַאֲזָלַת בְּחַקְלָא וּמְחָא בִלְעָם יָת אַתָּנָא לְאַסְטָיוּתַהּ לְאָרְחָא:", "onk_en": "The donkey saw the angel of Adonoy standing in the way with his sword drawn in his hand; the donkey turned aside from the way and went into the field; Bil’am struck the donkey to get it back on the way.", "pj": "וַחֲמַת אַתְנָא יַת מַלְאָכָא דַיְיָ מְעַתַּד בְּאִיסְרָטָא וְחַרְבֵּיהּ שְׁלִיפָא בִּידֵיהּ וּסְטַת אַתְנָא מִן אָרְחָא וַאֲזָלַת בְּחַקְלָא וּמְחָא בִלְעָם יַת אַתְנָא לִמְכַוְונָא יָתָהּ לְאִיסְרָטָא", "pj_en": "And the ass discerned the angel of the Lord standing in the way with a drawn sword in his hand, and the ass turned aside out of the road, to go into the field. And Bileam smote the ass to make her return unto the way.", "tj": "", "tj_en": "", "rashi": "<b>ותרא האתון.<\/b> וְהוּא לֹא רָאָה שֶׁנָּתַן הַקָּבָּ\"ה רְשׁוּת לַבְּהֵמָה לִרְאוֹת יוֹתֵר מִן הָאָדָם, שֶׁמִּתּוֹךְ שֶׁיֵּשׁ בּוֹ דַּעַת, תִּטָּרֵף דַּעְתּוֹ כְּשֶׁיִּרְאֶה מַזִּיקִין:<br><br><b>וחרבו שלופה בידו.<\/b> אָמַר, רָשָׁע זֶה הִנִּיחַ כְּלִי אֻמָּנוּתוֹ, שֶׁכְּלִי זֵינָן שֶׁל אֻמּוֹת הָעוֹלָם בַּחֶרֶב, וְהוּא בָא עֲלֵיהֶם בְּפִיו שֶׁהוּא אֻמָּנוּת שֶׁלָּהֶם, אַף אֲנִי אֶתְפֹּשׂ אֶת שֶׁלּוֹ וְאָבֹא עָלָיו בְּאֻמָּנוּתוֹ, וְכֵן סוֹפוֹ — \"וְאֵת בִּלְעָם בֶּן בְּעוֹר הָרְגוּ בֶחָרֶב\" (במדבר ל\"א):", "rashi_en": "ותרא האתון AND THE SHE-ASS SAW [THE ANGEL] — but he did not see him, for the Holy One, blessed be He, gave an animal power to see more than the man, for just because he possesses sense his mind would become perturbed if he sees noxious beings.<br><br>וחרבו שלופה בידו AND HIS SWORD DRAWN IN HIS HAND — He (God) said: This wicked man has abandoned the tools of his own craft, — for the offensive weapons of the heathen peoples consist in the sword, — and he is attacking them with his mouth which is their metier; I will take his implement and come against him with his own metier. Thus, indeed, was his end (Numbers 31:8): “And Balaam the son of Beor they slew by the sword” (Midrash Tanchuma 4:7:23)."}, {"ch": 22, "v": 24, "aliyah": 5, "heb": "וַֽיַּעֲמֹד֙ מַלְאַ֣ךְ יְהֹוָ֔ה בְּמִשְׁע֖וֹל הַכְּרָמִ֑ים גָּדֵ֥ר מִזֶּ֖ה וְגָדֵ֥ר מִזֶּֽה׃", "onk": "וְקָם מַלְאָכָא דַיְיָ בִּשְׁבִיל כַּרְמַיָּא <b>אַתְרָא<\/b> דְּגָדֵרָא מִכָּא וְגָדֵרָא מִכָּא:", "onk_en": "But the angel of Adonoy stood in a narrow path of the vineyards [<b>at a place<\/b>] with a barrier at either side.", "pj": "וְקָם מַלְאָכָא דַיְיָ בְּדוֹחֲקָא דְמִיצַע בֵּינֵי כְרָמַיָא אֲתַר דְאָקִים יַעֲקב וְלָבָן אוֹגַר וְקָמָא מִצִטְרָא מִיכָּא וְשָכוּתָא מִצִיטְרָא מִיכָּא וְקַיְימוּ דְלָא לְמֵעִיבַר דֵין תְּחוּם דֵין לְבִישָׁא", "pj_en": "And the angel of the Lord stood in a narrow path that was in the midst between vineyards, in the place where Jacob and Laban raised the mound, the pillar on this side and the observatory on that side, which they raised, that neither should pass that limit to do evil (to the other).", "tj": "וְקָם מַלְאָכָא דַיְיָ בְּאֶמְצַע כְּרָמַיָא סַגְיָא מִן דֵין וְסַגְיָא מִן דֵין סִטְרָא:", "tj_en": "And the angel of the Lord stood between the vineyards, a hedge (being) on this and on that side.", "rashi": "<b>במשעול.<\/b> כְּתַרְגּוּמוֹ \"בִּשְׁבִיל\", וְכֵן \"אִם יִשְׂפֹּק עֲפַר שֹׁמְרוֹן לִשְׁעָלִים\" (מלכים א כ') — עָפָר הַנִּדְבָּק בְּכַפּוֹת הָרַגְלַיִם בְּהִלּוּכָן, וְכֵן \"מִי מָדַד בְּשָׁעֳלוֹ מַיִם\" (ישעיהו מ') — בְּרַגְלָיו וּבְהִלּוּכוֹ:<br><br><b>גדר מזה וגדר מזה.<\/b> סְתָם גָּדֵר שֶׁל אֲבָנִים הוּא:", "rashi_en": "במשעול — Understand this as the Targum does: IN A PATH. And similar is, (1 Kings 20:10) “If the dust of Samaria shall suffice לשעלים” — the dust that attaches itself to the soles of peoples’ feet when they walk. And similarly, (Isaiah 40:12) “Who hath measured the water בשעלו” — with his feet and through his walking (as one measures by pacing).<br><br>גדר מזה וגדר מזה A FENCE BEING ON THIS SIDE AND A FENCE ON THAT SIDE — The term גדר without further definition is one of stone (and that is why in the next verse it is called a קיר which is a term for a stone wall; cf. Leviticus 14:37—40)."}, {"ch": 22, "v": 25, "aliyah": 5, "heb": "וַתֵּ֨רֶא הָאָת֜וֹן אֶת־מַלְאַ֣ךְ יְהֹוָ֗ה וַתִּלָּחֵץ֙ אֶל־הַקִּ֔יר וַתִּלְחַ֛ץ אֶת־רֶ֥גֶל בִּלְעָ֖ם אֶל־הַקִּ֑יר וַיֹּ֖סֶף לְהַכֹּתָֽהּ׃", "onk": "וַחֲזַת אַתָּנָא יָת מַלְאָכָא דַיְיָ וְאִדְחֵקַת לְכָתְלָא וּדְחֵקַת יָת רִגְלָא דְבִלְעָם לְכָתְלָא וְאוֹסִיף לְמִמְחַהּ:", "onk_en": "When the donkey saw the angel of Adonoy, she was pressed against the wall and pressed Bil’am's foot against the wall; and he struck her even more.", "pj": "וַחֲמַת אַתְנָא יַת מַלְאָכָא דַיְיָ וְאִדְחָקַת לִסְיָיגָא וּדְחֵקַת יַת רֵיגַל בִּלְעָם לִסְיָיגָא וְאוֹסִיף לְמִימְחָהּ וּמַלְאָכָא אִתְכַּסֵי מִינָהּ", "pj_en": "And the ass discerned the angel of the Lord, and thrust herself against the hedge, and bruised Bileam's foot by the hedge, and he smote her again; for the angel was invisible to him.", "tj": "", "tj_en": "", "rashi": "<b>ותלחץ.<\/b> הִיא עַצְמָהּ:<br><br>וַתִּלְחַץ: אֶת אֲחֵרִים — <b>את רגל בלעם<\/b>:", "rashi_en": "וַתִּלָּחֵץ — the Niphal form denotes that SHE PRESSED HERSELF. <br><br>וַתִּלְחַץ — the Kal denotes that SHE PRESSED something else — viz., את רגל בלעם BALAAM’S FOOT."}, {"ch": 22, "v": 26, "aliyah": 5, "heb": "וַיּ֥וֹסֶף מַלְאַךְ־יְהֹוָ֖ה עֲב֑וֹר וַֽיַּעֲמֹד֙ בְּמָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין־דֶּ֥רֶךְ לִנְט֖וֹת יָמִ֥ין וּשְׂמֹֽאול׃", "onk": "וְאוֹסֵף מַלְאָכָא דַיְיָ לְמֶעְבָּר וְקָם בַּאֲתַר עָק דִּי לֵית אֹרַח לְמִסְטֵי לְיַמִּינָא וְלִשְׂמָאלָא:", "onk_en": "Adonoy’s angel passed further ahead and stood in a narrow place, where there was no room to turn [either] to the right or to the left.", "pj": "וְאוֹסִיף מַלְאָכָא דַיְיָ לְמֵעִיבַּר וְקָם בַּאֲתַר דָחִיק דְלֵית אוֹרַח לְמִיסְטֵי לְיַמִינָא וְלִשְמָאלָא", "pj_en": "And the angel of the Lord yet passed on, and stood in a distant place, where there was no way to turn either to the right or left.", "tj": "", "tj_en": "", "rashi": "<b>ויוסף מלאך ה' עבור.<\/b> לַעֲבֹר עוֹד לְפָנָיו — לַהֲלֹךְ לִהְיוֹת לְפָנָיו בְּמָקוֹם אַחֵר, כְּמוֹ \"וְהוּא עָבַר לִפְנֵיהֶם\" (בראשית ל\"ג); וּמִדְרַשׁ אַגָּדָה יֵשׁ בְּתַנְחוּמָא: מָה רָאָה לַעֲמֹד בִּשְׁלֹשָׁה מְקוֹמוֹת? סִימָנֵי אָבוֹת הֶרְאָהוּ:", "rashi_en": "ויוסף מלאך ה' עובר AND THE ANGEL OF THE LORD WENT FURTHER — went further in front of him — it went on so as to be before him in another spot. It is similar to, (Genesis 33:3) “And he passed in front of them”. — And there is a Midrashic explanation in Tanchuma: What reason had he to stand in three places? He (the Angel) showed him (Balaam) symbols referring to the three patriarchs (Midrash Tanchuma, Balak 8)."}, {"ch": 22, "v": 27, "aliyah": 5, "heb": "וַתֵּ֤רֶא הָֽאָתוֹן֙ אֶת־מַלְאַ֣ךְ יְהֹוָ֔ה וַתִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַיִּֽחַר־אַ֣ף בִּלְעָ֔ם וַיַּ֥ךְ אֶת־הָאָת֖וֹן בַּמַּקֵּֽל׃", "onk": "וַחֲזַת אַתָּנָא יָת מַלְאָכָא דַיְיָ וּרְבָעַת תְּחוֹת בִּלְעָם <b>וּתְקֵף רוּגְזָא<\/b> דְבִלְעָם וּמְחָא יָת אַתָּנָא בְּחֻטְרָא:", "onk_en": "When the donkey saw the angel of Adonoy, it crouched beneath Bil’am; Bil’am[<b>’s anger was provoked<\/b>] became angry and beat the donkey with the stick.", "pj": "וַחֲמַת אַתְנָא יַת מַלְאָכָא דַיְיָ וּרְבַעַת לָהּ תְּחוֹת בִּלְעָם וּתְקֵיף רוּגְזָא דְבִלְעָם וּמְחָא יַת אַתְנָא בְּשׁוֹטָא", "pj_en": "And the ass saw the angel of the Lord, and fell under Bileam; and Bileam's wrath was strong, so that he smote the ass with his staff.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 28, "aliyah": 5, "heb": "וַיִּפְתַּ֥ח יְהֹוָ֖ה אֶת־פִּ֣י הָאָת֑וֹן וַתֹּ֤אמֶר לְבִלְעָם֙ מֶה־עָשִׂ֣יתִֽי לְךָ֔ כִּ֣י הִכִּיתַ֔נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים׃", "onk": "וּפְתַח יְיָ יָת פּוּמָא דְַאַתָּנָא וַאֲמָרַת לְבִלְעָם מֶה עֲבָדִית לָךְ אֲרֵי מְחִיתַנִּי דְּנַן תְּלַת זִמְנִין:", "onk_en": "Adonoy opened the mouth of the donkey, and she said to Bil’am: “What have I done to you, that you have hit me these three times?”", "pj": "עֲשַרְתֵּי פִתְגָמִין אִתְבְּרִיאוּ בָּתַר שַׁכְלוּל עַלְמָא בְּמֵיעֲלֵי שַׁבְּתָא בֵּינֵי שִׁימְשָׁתָא מַנָא וּבֵירָא וְחוּטְרָא דְמֹשֶׁה וּשְׁמִירָא וְקַשְׁתָּא וַעֲנָנֵי יְקָרָא וּפוּם אַרְעָא וּכְתַב לוּחֵי קְיָימָא וּמַזִיקֵי וּפוּם מַמְלַל אַתְנָא בֵּי הַהִיא שַׁעְתָּא פְּתַח מֵימְרָא דַיְיָ יַת פּוּמָהּ וְאִזְדַמֵן לָהּ מַמְלַל וַאֲמָרַת לְבִלְעָם מַה עֲבָדִית לָךְ אֲרוּם מְחִיתַנִי דֵין תְּלַת זִמְנִין", "pj_en": "Ten things were created after the world had been founded at the coming in of the Sabbath between the suns, - the manna, the well, the rod of Mosheh, the diamond, the rainbow, the cloud of glory, the mouth of the earth, the writing of the tables of the covenant, the demons, and the speaking ass. And in that hour the Word of the Lord opened her mouth, and fitted her to speak: and she said to Bileam. What have I done to thee, that thou hast smitten me these three times?", "tj": "", "tj_en": "", "rashi": "<b>זה שלש רגלים.<\/b> רָמַז לוֹ: אַתָּה מְבַקֵּשׁ לַעֲקֹר אֻמָּה הַחוֹגֶגֶת שָׁלֹשׁ רְגָלִים בַּשָּׁנָה? (תנחומא):", "rashi_en": "זה שלש רגלים THESE THREE TIMES — By these words he suggested to him: You seek to root out a nation that celebrates three festivals (שלש רגלים) annually?! (Midrash Tanchuma, Balak 9)."}, {"ch": 22, "v": 29, "aliyah": 5, "heb": "וַיֹּ֤אמֶר בִּלְעָם֙ לָֽאָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑י ל֤וּ יֶשׁ־חֶ֙רֶב֙ בְּיָדִ֔י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽיךְ׃", "onk": "וַאֲמַר בִּלְעָם לְאַתָּנָא אֲרֵי חַיִּכְתְּ בִּי אִלּוּפוֹן אִית חַרְבָּא בִּידִי אֲרֵי כְעַן קְטַלְתִּיךְ:", "onk_en": "Bil’am said to the donkey: “Because you have ridiculed me; would that I had a sword in my hand, I would kill you now.”", "pj": "וַאֲמַר בִּלְעָם לְאַתְנָא אֲרוּם שְׁקַרְתְּ בִּי אִילוּ אִית סַיְיפָא בִידִי אֲרוּם כְּדוֹן קְטַלְתִּיךְ", "pj_en": "And Bileam said to the ass, Because thou hast been false to me; if there was now but a sword in in hand, I would kill thee.", "tj": "", "tj_en": "", "rashi": "<b>התעללת.<\/b> כְּתַרְגּוּמוֹ, לְשׁוֹן גְּנַאי וּבִזָּיוֹן:<br><br><b>לו יש חרב בידי.<\/b> גְּנוּת גְּדוֹלָה הָיָה לוֹ דָבָר זֶה בְּעֵינֵי הַשָּׂרִים — זֶה הוֹלֵךְ לַהֲרֹג אֻמָּה שְׁלֵמָה בְּפִיו וּלְאָתוֹן זוֹ צָרִיךְ כְּלֵי זַיִן:", "rashi_en": "התעללת — Understand this as the Targum does: an expression denoting scorn and disdain — [THOU HAST MADE SPORT OF ME]. <br><br>לו יש חרב בידי I WOULD THERE WERE A SWORD IN MY HAND — This utterance was a great shame for him in the sight of the princes: this man was going for the purpose of slaying a whole nation by his mouth, and for this animal he required a weapon! (cf. Midrash Tanchuma, Balak 9)."}, {"ch": 22, "v": 30, "aliyah": 5, "heb": "וַתֹּ֨אמֶר הָאָת֜וֹן אֶל־בִּלְעָ֗ם הֲלוֹא֩ אָנֹכִ֨י אֲתֹֽנְךָ֜ אֲשֶׁר־רָכַ֣בְתָּ עָלַ֗י מֵעֽוֹדְךָ֙ עַד־הַיּ֣וֹם הַזֶּ֔ה הַֽהַסְכֵּ֣ן הִסְכַּ֔נְתִּי לַעֲשׂ֥וֹת לְךָ֖ כֹּ֑ה וַיֹּ֖אמֶר לֹֽא׃", "onk": "וַאֲמָרַת אַתָּנָא לְבִלְעָם הֲלָא אֲנָא אַתָּנָךְ דִּי רְכַבְתְּ עֲלַי <b>מִדְּאִיתָךְ<\/b> עַד יוֹמָא הָדֵין הֲמֵילַף אַלִּיפְנָא לְמֶעְבַּד לָךְ כְּדֵין וַאֲמַר לָא:", "onk_en": "The donkey replied to Bil’am: “Am I not the very same donkey that you have been riding on all your life [<b>from the time I became yours<\/b>] until this very day? Was it ever my habit to do this to you?” And he said: “No.”", "pj": "וַאֲמָרַת אַתְנָא לְבִלְעָם וַי לָךְ בִּלְעָם חֲסִיר דַעְתָּא אַנְתְּ דַאֲנָא בְעִירָא מְסָאֲבָא מִיתָא בְּעַלְמָא הָדֵין וְלָא אַתְיָא לְעָלְמָא דְאָתִי לָא יְכִילַת לְמֵילוֹט יָתִי כָּל דְכֵן בְּנוֹי דְאַבְרָהָם יִצְחָק וְיַעֲקב דְבִזְכוּתְהוֹן אִתְבְּרֵי עַלְמָא וְאַנְתְּ אָזִיל לְמֵילַט יַתְהוֹן וְדִי גָנַבְתְּ דַעְתְּהוֹן דְעַמָא הָאִלֵין וַאֲמָרַת לֵיהּ הֲדָא אַתְנָא דִידִי שְׁאִילָא הִיא בִּידִי וְסוּסְיָא דִידִי שַׁדִי בִּרְטִיבָא הֲלָא אֲנָא אַתְנָךְ דְרָכַבְתָּ עָלַי מִן טַלְיוּתָךְ עַד זְמַן יוֹמָא הָדֵין הָא מִתְהַנְיֵתִי מִינָךְ בְּמַשְׁכְּבָא וְלָא אִתְכַּוָונִית לְמֶעֱבַד לָךְ הֵיכְדֵין וַאֲמַר לָא", "pj_en": "And the ass said to Bileam, Woe to thee, Bileam, thou wanting-in-mind when me, an unclean beast, who am to die in this world, and not to enter the world to come, thou art not able to curse; how much less (canst thou harm) the children of Abraham, Izhak, and Jakob, on account of whom the world hath been created, but whom thou art going to curse! So hast thou deceived these people, and hast said, This is not my ass, she is a loan in, my hand, and my horses remain in the pasture. But am I not thine ass upon whom thou hast ridden from thy youth unto this day? and have I been used to do thus with thee? And he said, No.", "tj": "וַאֲמַרַת אַתְנָא לְבִלְעָם וַי לָךְ בִּלְעָם רַשִׁיעָא חֲסַר דַעְתָּא וְכָל חוּכְמָא לָא אִשְׁתְּכַּח בָּךְ הָא אֲנָא בְעִיר מְסָאָב מִיתָא בְּעַלְמָא הָדֵין וְלָא אַתְיָא לְעַלְמָא דְאָתֵי לָא יַכְלַת לְמִילוּט יָתִי בְּחוּכְמַת דַעְתָּךְ עַל חַד כַּמָה וְכַמָה בְּנוֹי דְאַבְרָהָם יִצְחָק וְיַעֲקב דְבִזְכוּתְהוֹן אִתְבְּרֵי עַלְמָא מִן שֵׁירוּיָא וְהֵיךְ אַתְּ אָזַל לְמֵילַט יַתְהוֹן כַּד גָנַבְתְּ דַעְתֵּיהוֹן דְעַמָא הָאִלֵין וַאֲמַרַת לְהוֹן לֵית אַתְנָא הָדָא דִידִי שְׁאִילָא הִיא בִּידִי בְּרַם הֲלָא אֲנָא הִיא אַתְנָךְ דִי רְכַבְתְּ עָלַי מִן טַלְיוּתָךְ עַד יוֹמָא הָדֵין הַמִתְכַּוְונַת אִתְכַּוְונַת לְמֶעֱבַּד לָךְ כְּדוֹן וַאֲמַר לָהּ לָא:", "tj_en": "And the ass said to Bileam, Woe to thee, Bileam the wicked, wanting in understanding and wisdom! Behold, me, an unclean beast, who am to die in this world and not to enter the world to come, thou hast not power with all thy skill to curse; how much less the children of Abraham, Izhak, and Jakob, on whose account the world was created at the beginning! And why art thou going to curse them? For thou hast deceived the people, saying to them, This is not my ass: she is a loan in my hand. But am I not thy ass, upon whom thou hast ridden from thy youth unto this day? Did I indeed intend to do thus with thee? And he said to her, No.", "rashi": "<b>ההסכן הסכנתי.<\/b> כְּתַרְגּוּמוֹ, וְכֵן \"הַלְאֵל יִסְכָּן גָּבֶר\" (איוב כ\"ב); וְרַבּוֹתֵינוּ דָרְשׁוּ מִקְרָא זֶה בַּתַּלְמוּד, אָמְרוּ לֵיהּ מַאי טַעְמָא לָא רְכַבְתְּ אַסּוּסְיָא? אֲמַר לְהוּ בִּרְטִיבָא שְׁדַאי לֵיהּ כו', כִּדְאִיתָא בְמַסֶּכֶת עֲ\"זָ (דף ד'):", "rashi_en": "ההסכן הסכנתי — Understand this as the Targum does — HAVE I EVER LEARNT? Similar is, (Job 22:2) “Does a man learn (יסכן) for God’s benefit” (see Rashi on this verse). And our Rabbis have explained this verse in the Talmud: They said to him, “What is the reason you are not riding on a horse?” He replied to them: “I have left it in the meadow grass” (i.e., I have put it out to graze). Whereupon the ass exclaimed: Am I not your ass upon whom thou hast ridden from my very youth unto this day?!” (so you see, you have never possessed a horse) — as it is related in Treatise Avodah Zarah 4b."}, {"ch": 22, "v": 31, "aliyah": 5, "heb": "וַיְגַ֣ל יְהֹוָה֮ אֶת־עֵינֵ֣י בִלְעָם֒ וַיַּ֞רְא אֶת־מַלְאַ֤ךְ יְהֹוָה֙ נִצָּ֣ב בַּדֶּ֔רֶךְ וְחַרְבּ֥וֹ שְׁלֻפָ֖ה בְּיָד֑וֹ וַיִּקֹּ֥ד וַיִּשְׁתַּ֖חוּ לְאַפָּֽיו׃", "onk": "וּגְלָא יְיָ יָת עֵינֵי בִלְעָם וַחֲזָא יָת מַלְאָכָא דַיְיָ מְעַתַּד בְּאָרְחָא וְחַרְבֵּיהּ שְׁלִיפָא בִּידֵיהּ וּכְרַע וּסְגִיד לְאַפּוֹהִי:", "onk_en": "Adonoy then enabled Bil’am to see, and he observed the angel of Adonoy standing in the way with his sword drawn in his hand. He bowed his head and prostrated himself on his face.", "pj": "וּגְלָא יְיָ יַת עֵינוֹי דְבִלְעָם וַחֲמָא יַת מַלְאָכָא דַיְיָ מְעַתַּד בְּאִיסְרַטָא וְסַיְיפֵיהּ שְׁלִיפָא בִּידֵיהּ וְגָחַן וּסְגִיד עַל אַנְפּוֹי", "pj_en": "And the Lord unveiled the eyes of Bileam, and he beheld the angel of the Lord standing in the way, his sword unsheathed in his hand; and he bowed, and worshipped on his face.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 32, "aliyah": 5, "heb": "וַיֹּ֤אמֶר אֵלָיו֙ מַלְאַ֣ךְ יְהֹוָ֔ה עַל־מָ֗ה הִכִּ֙יתָ֙ אֶת־אֲתֹ֣נְךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְשָׂטָ֔ן כִּֽי־יָרַ֥ט הַדֶּ֖רֶךְ לְנֶגְדִּֽי׃", "onk": "וַאֲמַר לֵיהּ מַלְאָכָא דַיְיָ עַל מָא מְחִיתָא יָת אֲתָּנָךְ דְּנַן תְּלַת זִמְנִין הָא אֲנָא נְפָקִית לְמִסְטַן אֲרֵי <b>גְלֵי קֳדָמַי דְּאַתְּ רָעֵי לְמֵזַל בְּאוּרְחָא<\/b> לְקִבְלִי:", "onk_en": "The angel of Adonoy said to him: “Why did you hit your donkey these three times? Behold, I came out to obstruct you, because your way is [<b>it is clear to me that you desire to proceed on a path<\/b>] contrary to me.", "pj": "וַאֲמַר לֵיהּ מַלְאָכָא דַיְיָ מְטוֹל מַה מָחִית יַת אַתְנָא דְנַן תְּלַת זִמְנִין הָא אֲנָא נְפָקִית לְמִשְטַן לָךְ וְאַתְנָא דְחִילַת חָמַת סָטַת מִן אָרְחָא וּגְלֵי קֳדָמַי דְאַנְתְּ בָּעֵי לְמֵיזַל לְמֵילוֹט יַת עַמָא וּמִילָא לָא מְהוֹגְנָא לְקִבְלִי", "pj_en": "And the angel of the Lord said to him, why hast thou smitten thine ass these three times? Behold, I have come out to withstand thee; and the ass, fearing, saw, and turned from the way. It is known before me that thou seekest to go to curse the people, a thing that is not pleasing to me.", "tj": "", "tj_en": "", "rashi": "<b>כי ירט הדרך לנגדי.<\/b> רַבּוֹתֵינוּ חַכְמֵי הַמִּשְׁנָה דְּרָשׁוּהוּ נוֹטָרִיקוֹן — יָרְאָה, רָאֲתָה, נָטְתָה בִּשְׁבִיל שֶׁהַדֶּרֶךְ לְנֶגְדִּי (שבת קכ\"ה), כְּלוֹמַר לְקִנְאָתִי וּלְהַקְנִיטֵנִי; וּלְפִי מַשְׁמָעוֹ כִּי חָרַד הַדֶּרֶךְ לְנֶגְדִּי, לְשׁוֹן רֶטֶט — כִּי רָאִיתִי בַעַל הַדֶּרֶךְ שֶׁחָרַד וּמִהֵר הַדֶּרֶךְ שֶׁהוּא לְכַעְסִי וּלְהַמְרוֹתִי, וּמִקְרָא קָצָר הוּא, כְּמוֹ \"וַתְּכַל דָּוִד\" (שמואל ב י\"ג); לִישָׁנָא אַחֲרִינָא יָרַט לְשׁוֹן רָצוֹן, וְכֵן \"עַל יְדֵי רְשָׁעִים יִרְטֵנִי\" (איוב ט\"ז) — מְפַיֵּס וּ
