<style>
:root {

  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const SLUG = "tazria";
const DATA = [{"ch": 12, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying:", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 2, "aliyah": 1, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ לֵאמֹ֔ר אִשָּׁה֙ כִּ֣י תַזְרִ֔יעַ וְיָלְדָ֖ה זָכָ֑ר וְטָֽמְאָה֙ שִׁבְעַ֣ת יָמִ֔ים כִּימֵ֛י נִדַּ֥ת דְּוֺתָ֖הּ תִּטְמָֽא׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל לְמֵימַר אִתְּתָא אֲרֵי תְעַדִּי וּתְלִיד דְּכָר וּתְהֵי מְסָאָבָא שִׁבְעַת יוֹמִין כְּיוֹמֵי <b>רִחוּק סוֹבְתַהּ<\/b> תְּהֵי מְסָאָבָא:", "onk_en": "Speak to Bnei Yisroel, saying, when a woman conceives and gives birth to a male child she will be ritually unclean for seven days; as the days of her menstrual flow [<b>the state of her impure ‘separation’<\/b>], she will be unclean.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל לְמֵימָר אִתְּתָא אֲרוּם תַעֲדֵי וְתֵילִיד בִּיר דְכַר וּתְהֵי מְסָאָבָא שַׁבְעָא יוֹמִין הֵי כְיוֹמֵי רִיחוּק סְאוּבְתָּהּ הֵיכְדֵין תִּסְתָּאֵב", "pj_en": "Speak with the sons of Israel, saying: When a woman hath conceived and borne a male child, she shall be unclean seven days, as the days of the removal of her uncleanness shall she be unclean.", "tj": "", "tj_en": "", "rashi": "<b>אשה כי תזריע.<\/b> אָ\"רַ שִׂמְלַאי: כְּשֵׁם שֶׁיְּצִירָתוֹ שֶׁל אָדָם אַחַר כָּל בְּהֵמָה חַיָּה וָעוֹף בְּמַעֲשֵׂה בְרֵאשִׁית, כָּךְ תּוֹרָתוֹ נִתְפָּרְשָׁה אַחַר תּוֹרַת בְּהֵמָה חַיָּה וָעוֹף (ויקרא רבה יד):<br><br><b>כי תזריע.<\/b> לְרַבּוֹת שֶׁאֲפִלּוּ יְלָדַתּוּ מָחוּי — שֶׁנִּמְחָה וְנַעֲשָׂה כְּעֵין זֶרַע — אִמּוֹ טְמֵאָה לֵידָה (נדה כ\"ז):<br><br><b>כימי נדת דותה תטמא.<\/b> כְּסֵדֶר כָּל טֻמְאָה הָאֲמוּרָה בְנִדָּה מִטַּמְּאָה בְטֻמְאַת לֵידָה, וַאֲפִלוּ נִפְתַּח הַקֶּבֶר בְּלֹא דָם (שם כ\"א):<br><br><b>דותה.<\/b> לְשׁוֹן דָּבָר הַזָּב מִגּוּפָהּ; לָשׁוֹן אַחֵר לְשׁוֹן מַדְוֶה וְחֹלִי, שֶׁאֵין אִשָּׁה רוֹאָה דָם שֶׁלֹּא תֶחֱלֶה וְרֹאשָׁהּ וְאֵבָרֶיהָ כְבֵדִין עָלֶיהָ (שם ט'):", "rashi_en": "אשה כי תזריע IF A WOMAN HAVE CONCEIVED SEED — R. Simlai said: Even as the formation of man took place after that of every cattle, beast and fowl when the world was created, so, too, the law regarding him is set forth after the law regarding cattle, beast and fowl (contained in the previous chapter) (Leviticus Rabbah 14:1).<br><br>כי תזריע — These words are superfluous, כי ילדה would suffice — they mean literally, ”if she bringeth forth seed” and are employed to include the case that if she gave birth to him (the male child) as a pulpy mass which had dissolved, having become liquified like seed, even then its mother becomes unclean as though it were a normal birth (Niddah 27b). <br><br> כימי נדת דותה תטמא AS IN THE DAYS OF THE SEPARATION FOR HER IMPURITY SHALL SHE BECOME UNCLEAN — According to the regulation of every uncleanness which is mentioned in the case of a נדה does she become unclean in respect to the uncleanness resulting from child-birth — even though the womb opened without any issue of blood (cf. Niddah 21a). <br><br>דותה — This is an expression for anything which flows from her body (‎‎‏זב = דו, “flowing”), and the translation is: “as in the days of separation due to her flux”. Another explanation is: it has the same meaning as .מדוה (root דוה), malady and sickness, and this is termed דותה, “her sickness”, because no woman sees an issue of blood from herself except that, as a result of it, she becomes unwell and her head and limbs feel heavy (cf. Niddah 9a)."}, {"ch": 12, "v": 3, "aliyah": 1, "heb": "וּבַיּ֖וֹם הַשְּׁמִינִ֑י יִמּ֖וֹל בְּשַׂ֥ר עׇרְלָתֽוֹ׃", "onk": "וּבְיוֹמָא תְּמִינָאָה יִגְזַר בִּסְרָא דְעָרְלְתֵיהּ:", "onk_en": "On the eighth day, the flesh of his foreskin shall be circumcised.", "pj": "וּבְיוֹמָא תְמִינָאֵי תִּשְׁתְּרֵי וּבָרָא יִתְגְזַר בְּשַר עָרְלָתֵיהּ", "pj_en": "But on the eighth day she shall be loosed, and her child shall be circumcised in the flesh of his foreskin.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 4, "aliyah": 1, "heb": "וּשְׁלֹשִׁ֥ים יוֹם֙ וּשְׁלֹ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב בִּדְמֵ֣י טׇהֳרָ֑הֿ בְּכׇל־קֹ֣דֶשׁ לֹֽא־תִגָּ֗ע וְאֶל־הַמִּקְדָּשׁ֙ לֹ֣א תָבֹ֔א עַד־מְלֹ֖את יְמֵ֥י טׇהֳרָֽהּ׃", "onk": "וּתְלָתִין וּתְלָתָא יוֹמִין תֵּיתֵב בְּדַם דְּכוּ בְּכָל קוּדְשָׁא לָא תִקְרַב וּלְמִקְדְּשָׁא לָא תֵעוֹל עַד מִשְׁלַם יוֹמֵי דָכוּתַהּ:", "onk_en": "For thirty-three days she will remain [in the status] that the blood [she sees] is ritually pure. She shall not touch anything holy and she shall not come into the Sanctuary, until the days of her purity are completed.", "pj": "וּתְלָתִין וּתְלָתָא יוֹמִין רְצִיפִין תְּהֵא כָּל דְמָהָא דַכְיָין בְּרַם בְּכָל קוּדְשַׁיָא לָא תִקְרַב וּלְבֵי מַקְדְשָׁא לָא תֵיעוֹל עַד זְמַן מִישְׁלַם יוֹמֵי דְכוּתָהּ", "pj_en": "And thirty and three continuous days she shall have for the purification of the whole blood; but she must not touch things sacred, nor come into the sanctuary until the time when the days of her purification be completed.", "tj": "", "tj_en": "", "rashi": "<b>תשב.<\/b> אֵין תֵּשֵׁב אֶלָּא לְשׁוֹן עַכָּבָה, כְּמוֹ וַתֵּשְׁבוּ בְקָדֵשׁ (דברים א'), וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא (בראשית י\"ג):<br><br><b>בדמי טהרה.<\/b> אַעַ\"פִּי שֶׁרוֹאָה טְהוֹרָה:<br><br><b>בדמי טהרה.<\/b> לֹא מַפִּיק הֵ\"א, וְהוּא שֵׁם דָּבָר כְּמוֹ טֹהַר:<br><br><b>ימי טהרה.<\/b> מַפִּיק הֵ\"א — יְמֵי טֹהַר שֶׁלָּהּ:<br><br><b>בכל קדש.<\/b> לְרַבּוֹת אֶת הַתְּרוּמָה, לְפִי שֶׁזּוֹ טְבוּלַת יוֹם אָרֹךְ, שֶׁטָּבְלָה לְסוֹף שִׁבְעָה וְאֵין שִׁמְשָׁהּ מַעֲרִיב לְטַהֲרָהּ עַד שְׁקִיעַת הַחַמָּה שֶׁל יוֹם אַרְבָּעִים שֶׁלְּמָחָר תָּבִיא אֶת כַּפָּרַת טָהֳרָתָהּ:<br><br><b>לא תגע.<\/b> אַזְהָרָה לָאוֹכֵל וְכוֹ' כְּמוֹ שֶׁשְּׁנוּיָה בִיבָמוֹת (דף ע\"ה):", "rashi_en": "תשב — The word תשב signifies here “remaining”, just as in (Deuteronomy 1:46) “And ye stayed (ותשבו) at Kadesh”, and (Genesis 13:18) “and he stayed (‎‎‎וישב) in the Plain of Mamre” <br><br> בדמי טהרה IN THE BLOOD OF PURIFICATION — Even though she see an issue of blood she is nevertheless clean (Sifra, Tazria Parashat Yoledet, Chapter 1 7). <br><br>בדמי טהרה — There is no Mappik in the last 'ה‎ of טהרה (as there is in the last word of this verse): it (the word) is an uninflected noun similar in meaning to טֹהַר (being a feminine form of it). <br><br>ימי טהרה — the 'ה here has a Mappik and the meaning is: the days of her טֹהַר, her purification.<br><br>בכל קדש [SHE SHALL NOT TOUCH] ANYTHING THAT IS HOLY — not anything: this serves to include the heave-offering (Makkot 14b; Yevamot 75a). The Torah prescribes this because such a woman must be regarded as one who has taken the immersion on a very long day (טבולת יום ארוך), because she immersed herself at the end of the first seven days whilst her sun does not set to bring about her purification until sunset of the fortieth day since it is only on the morrow that she has to bring the atonement offering in connection with her purification, as it is stated in v. 6.<br><br>לא תגע SHE SHALL NOT TOUCH — This is a prohibition addressed to anyone who would eat holy things in a state of uncleanness, as it is stated in a Baraitha in Yevamot 75a."}, {"ch": 12, "v": 5, "aliyah": 1, "heb": "וְאִם־נְקֵבָ֣ה תֵלֵ֔ד וְטָמְאָ֥ה שְׁבֻעַ֖יִם כְּנִדָּתָ֑הּ וְשִׁשִּׁ֥ים יוֹם֙ וְשֵׁ֣שֶׁת יָמִ֔ים תֵּשֵׁ֖ב עַל־דְּמֵ֥י טׇהֳרָֽהֿ׃", "onk": "וְאִם נְקוּבְתָא תְלִיד וּתְהֵי מְסָאָבָא <b>אַרְבְּעָה עֲסַר כְּרִחוּקַהּ<\/b> וְשִׁתִּין וְשִׁתָּא יוֹמִין תֵּיתֵב עַל דַּם דְּכוּ:", "onk_en": "If she gives birth to a female she will be unclean for two weeks [<b>fourteen days<\/b>] as during her menstruation [<b>‘separation’<\/b>]. For sixty-six days she will remain [in the status] that the blood [she sees] is ritually pure.", "pj": "וְאִין בְּרַת נוּקְבָא תְלִיד וּתְהֵי מְסָאֲבָא אַרְבֵּסְרֵי יוֹמִין רְצִיפִין הֵי כְּרִיחוּקָהּ וּבַחֲמֵיסַר תִּישְׁתְּרֵי וְשִׁיתִּין וְשִׁיתָּא יוֹמִין רְצִיפִין תְהֵי עַל דְמָהָא דַכְיָין", "pj_en": "And if she hath borne a daughter, she shall be unclean fourteen continuous days according to (the law of) her separation; and on the fifteenth she shall be released; but sixty and six continuous days shall she have for the (full) purification of the blood.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 6, "aliyah": 1, "heb": "וּבִמְלֹ֣את&thinsp;<b>׀<\/b> יְמֵ֣י טׇהֳרָ֗הּ לְבֵן֮ א֣וֹ לְבַת֒ תָּבִ֞יא כֶּ֤בֶשׂ בֶּן־שְׁנָתוֹ֙ לְעֹלָ֔ה וּבֶן־יוֹנָ֥ה אוֹ־תֹ֖ר לְחַטָּ֑את אֶל־פֶּ֥תַח אֹֽהֶל־מוֹעֵ֖ד אֶל־הַכֹּהֵֽן׃", "onk": "וּבְמִשְׁלַם יוֹמֵי דָכוּתַהּ לִבְרָא אוֹ לִבְרַתָּא תַּיְתִי אִמָּר בַּר שַׁתֵּיהּ לַעֲלָתָא וּבַר יוֹנָה אוֹ שַׁפְנִינָא לְחַטָּאתָא לִתְרַע מַשְׁכַּן זִמְנָא לְוָת כַּהֲנָא:", "onk_en": "When the days of her purification are completed, be it for a son or for a daughter, she shall bring a lamb, in its first year, as a burnt-offering and a young pigeon or a turtledove as a sin-offering, to the entrance of the Tent of Meeting, to the <i>kohein.<\/i>", "pj": "וּבְמִשְׁלַם יוֹמֵי דְכִיתָא לִבְרָא אוֹ לִבְרַתָּא תַּיְיתֵי אִימַר בַּר שַׁתְיָא לַעֲלָתָא וְגוֹזָל בַּר יוֹנָן אוֹ שַׁפְנִינָא לְחַטָאתָא לִתְרַע מַשְׁכַּן זִמְנָא לְוַת כַּהֲנָא", "pj_en": "And when the days of her purification are completed for the son or the daughter, she shall bring a lamb of its year for a burnt offering, and a young pigeon or a turtle dove for a sin offering, unto the priest at the door of the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 7, "aliyah": 1, "heb": "וְהִקְרִיב֞וֹ לִפְנֵ֤י יְהֹוָה֙ וְכִפֶּ֣ר עָלֶ֔יהָ וְטָהֲרָ֖הֿ מִמְּקֹ֣ר דָּמֶ֑יהָ זֹ֤את תּוֹרַת֙ הַיֹּלֶ֔דֶת לַזָּכָ֖ר א֥וֹ לַנְּקֵבָֽה׃", "onk": "וִיקָרְבִנֵּיהּ קֳדָם יְיָ וִיכַפֵּר עֲלַהּ וְתִדְכֵּי <b>מִסּוֹאֲבַת<\/b> דְּמָהָא דָּא אוֹרַיְתָא דְיַלֶּדְתָּא לְדוּכְרָא אוֹ לִנְקֻבְתָא:", "onk_en": "He will bring it before Adonoy and atone for her and she will be cleansed from the source [<b>impurity<\/b>] of her blood; this is the law regarding the woman who gives birth to a male or to a female.", "pj": "וִיקַרְבִינָהּ קֳדָם יְיָ וִיכַפֵּר עֲלָהּ כַּהֲנָא וְתִידְכֵּי מַבּוּעַ תְּרֵין דְמָהָא דָא הוּא אוֹרַיְיתָא דִיְלִידְתָּא לִדְכַר אוֹ לְנוּקְבָא", "pj_en": "and the priest shall offer it before the Lord and make atonement for her; then shall she be purified from either source of (her) blood. This is the law of the purification of her who hath borne a son or a daughter.", "tj": "", "tj_en": "", "rashi": "<b>והקריבו.<\/b> לִמֶּדְךָ שֶׁאֵין מְעַכְּבָהּ לֶאֱכֹל בְּקָדָשִׁים אֶלָּא אֶחָד מֵהֶם, וְאֵי זֶה הוּא? זֶה חַטָּאת, שֶׁנֶּאֱמַר וְכִפֶּר עָלֶיהָ הַכֹּהֵן וְטָהֵרָה, מִי שֶׁהוּא בָא לְכַפֵּר, בּוֹ הַטָּהֳרָה תְלוּיָה:<br><br><b>וטהרה.<\/b> מִכְּלָל שֶׁעַד כָּאן קְרוּיָה טְמֵאָה:", "rashi_en": "והקריבו AND HE SHALL OFFER IT — Two offerings have been mentioned, a lamb and a bird, but it states here ,,and he shall offer it and so make an atonement for her” — this teaches you that only the omission to sacrifice a particular one of these two precludes her from eating the sacrificial food. And which is this? It is the sin-offering, because it is stated immediately afterwards: “he shall make expiation for her and she shall be clean” — that which is intended as expiation (i. e. the sin-offering), upon it does the purification depend (Sifra, Tazria Parashat Yoledet, Chapter 3 4).<br><br>וטהרה AND SHE SHALL BE CLEAN — it follows, therefore, that until now (until she has brought the atonement offering) she is termed ‘‘unclean” (i.e. she is regarded as טמאה) although she is actually טהרה."}, {"ch": 12, "v": 8, "aliyah": 1, "heb": "וְאִם־לֹ֨א תִמְצָ֣א יָדָהּ֮ דֵּ֣י שֶׂה֒ וְלָקְחָ֣ה שְׁתֵּֽי־תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֶחָ֥ד לְעֹלָ֖ה וְאֶחָ֣ד לְחַטָּ֑את וְכִפֶּ֥ר עָלֶ֛יהָ הַכֹּהֵ֖ן וְטָהֵֽרָה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִם לָא תַשְׁכַּח יְדַהּ כְּמִסַּת אִמְּרָא וְתִסַּב תַּרְתֵּין שַׁפְנִינִין אוֹ תְרֵין בְּנֵי יוֹנָה חַד לַעֲלָתָא וְחַד לְחַטָּאתָא וִיכַפֵּר עֲלַהּ כַּהֲנָא וְתִדְכֵּי:", "onk_en": "If she cannot afford [to acquire] a lamb she shall take two turtledoves or two young pigeons; one as a burnt-offering and one as a sin-offering. The <i>kohein<\/i> will atone for her and she will be cleansed.", "pj": "וְאִין לָא הַשְׁכַּח יְדָהּ הֵי כְמִיסַת לְמִיתוֹיָיא אִימְרָא וְתִיסַב תְּרֵין שַׁפְנִינִין אוֹ תְרֵין גוֹזְלִין בְּנֵי יוֹנָן חַד לַעֲלָתָא וְחַד לְחַטָאתָא וִיכַפֵּר עֲלָהּ כַּהֲנָא וְתִידְכֵּי", "pj_en": "But if she find not her hand sufficient to bring a lamb, let her bring two turtle doves or two young pigeons; one for the burnt offering, and one for the sin offering, and the priest shall make atonement for her, and she shall be clean.", "tj": "", "tj_en": "", "rashi": "<b>אחד לעלה ואחד לחטאת.<\/b> לֹא הִקְדִּימָהּ הַכָּתוּב אֶלָּא לְמִקְרָאָהּ, אֲבָל לְהַקְרָבָה חַטָּאת קוֹדֵם לָעוֹלָה, כָּךְ שָׁנִינוּ בִּזְבָחִים בְּפֶרֶק כָּל הַתָּדִיר (זבחים צ ע\"א):", "rashi_en": "אחד לעלה ואחד לחטאת THE ONE FOR A BURNT-OFFERING AND THE OTHER FOR A SIN-OFFERING — Scripture puts it (the עולה) first only by way of mention, but so far as offering it is concerned the sin-offering precedes the burnt-offering; thus do we learn in the Treatise Zevachim 90a, in the chapter commencing כל התדיר ."}, {"ch": 13, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 2, "aliyah": 1, "heb": "אָדָ֗ם כִּֽי־יִהְיֶ֤ה בְעוֹר־בְּשָׂרוֹ֙ שְׂאֵ֤ת אֽוֹ־סַפַּ֙חַת֙ א֣וֹ בַהֶ֔רֶת וְהָיָ֥ה בְעוֹר־בְּשָׂר֖וֹ לְנֶ֣גַע צָרָ֑עַת וְהוּבָא֙ אֶל־אַהֲרֹ֣ן הַכֹּהֵ֔ן א֛וֹ אֶל־אַחַ֥ד מִבָּנָ֖יו הַכֹּהֲנִֽים׃", "onk": "אֱנַשׁ אֲרֵי יְהֵי בִמְשַׁךְ בִּסְרֵיהּ <b>עַמְקָא<\/b> אוֹ עַדְיָא אוֹ בַהֲרָא וִיהֵי בִמְשַׁךְ בִּסְרֵיהּ לְמַכְתַּשׁ <b>סְגִירוּ<\/b> וְיִתֵּתֵי לְוָת אַהֲרֹן כַּהֲנָא אוֹ לְוָת חַד מִבְּנוֹהִי כָּהֲנַיָּא:", "onk_en": "When a person will have, in the skin of his flesh a spot of intense [<b>deep<\/b>] whiteness or an off-white spot, or a snow-white spot, and it forms on the skin of his body [like] the plague of <i>tzoraas,<\/i> [<b>‘confinement’<\/b>] he shall be brought to Aharon, the <i>kohein,<\/i> or to one of his sons, the <i>kohanim.<\/i>", "pj": "בַּר נַשׁ אֲרוּם יְהֵי בִּמְשָׁךְ בִּסְרֵיהּ שׁוּמָא זְקִיפָא אוֹ קְלוֹפֵי אוֹ בַהַקֵי וִיהֵי בִּמְשַׁךְ בִּישְרֵיהּ לְמִיכְתַּשׁ סְגִירוּ וִיתֵיתֵי לְוַת אַהֲרן כַּהֲנָא אוֹ לְוַת חַד מִבְּנוֹי כַּהֲנַיָא", "pj_en": "If a man have in the skin of his flesh a rising tumour or a white spot, and it be in the skin of his flesh (as) the plague of leprosy, let him be brought unto Aharon the priest, or to one of the priests his sons.", "tj": "שׁוּמָא אוֹ קַלְפָא אוֹ בַהֲקֵי:", "tj_en": "A tumour, or sore, or white spot,", "rashi": "<b>שאת או ספחת וגו'.<\/b> שְׁמוֹת נְגָעִים הֵם וּלְבָנוֹת זוֹ מִזּוֹ:<br><br><b>בהרת.<\/b> חֲבַרְבּוּרוֹת, טיי\"א בְּלַעַז, וְכֵן בָּהִיר הוּא בַּשְּׁחָקִים (איוב ל\"ז):<br><br><b>אל אהרן וגו'.<\/b> גְּזֵרַת הַכָּתוּב הִיא שֶׁאֵין טֻמְאַת נְגָעִים וְטָהֳרָתָן אֶלָּא עַל פִּי כֹהֵן (ספרא):", "rashi_en": "'שאת או ספחת וגו‎ — These are the names of leprous plagues — A RISING, A SCAB etc., — and they are the one whiter than the other (cf. Shevuot 5b; Sifra, Tazria Parashat Nega'im, Section 1 4).<br><br>בהרת means SPOTS, taie in O. F. — Similar is (Job 37:21) “It is a spot (בהיר) in the skies”.<br><br>'אל אהרון וגו‎ [HE SHALL BE BROUGHT] TO AARON etc. — It is an enactment of Scripture that the uncleanness and purification of leprous plagues are pronounced only by the mouth of a priest (Sifra, Tazria Parashat Nega'im, Section 1 9)."}, {"ch": 13, "v": 3, "aliyah": 1, "heb": "וְרָאָ֣ה הַכֹּהֵ֣ן אֶת־הַנֶּ֣גַע בְּעֽוֹר־הַ֠בָּשָׂ֠ר וְשֵׂעָ֨ר בַּנֶּ֜גַע הָפַ֣ךְ&thinsp;<b>׀<\/b> לָבָ֗ן וּמַרְאֵ֤ה הַנֶּ֙גַע֙ עָמֹק֙ מֵע֣וֹר בְּשָׂר֔וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְרָאָ֥הוּ הַכֹּהֵ֖ן וְטִמֵּ֥א אֹתֽוֹ׃", "onk": "וֶיֶחֱזֵי כַהֲנָא יָת מַכְתָּשָׁא בִמְשַׁךְ בִּסְרָא וְשֵׂעָר בְּמַכְתָּשָׁא אִתְהֲפִיךְ לְמֶחֱוָר וּמֶחֱזֵי מַכְתָּשָׁא עַמִּיק בִּמְשַׁךְ בִּסְרֵיהּ מַכְתַּשׁ <b>סְגִירוּתָא<\/b> הוּא וְיֶחֱזִנֵּיהּ כַּהֲנָא וִיסָאֵב יָתֵיהּ:", "onk_en": "The <i>kohein<\/i> shall see the plague in the skin of the flesh and [if] the hair in the skin-eruption has turned white and the appearance of the plague is deeper than the skin of his body, it is the skin-eruption of <i>tzoraas.<\/i> [<b>‘confinement’<\/b>] The <i>kohein<\/i> shall see it and declare him [to be] unclean.", "pj": "וְיֶחֱמֵי כַּהֲנָא יַת מַכְתְּשָׁא בִּמְשַׁךְ בִּישְרָא וְשַעֲרָא בְּמַכְתְּשָׁא אִיתְהַפִּיךְ לְחִיוָור וְחֵיזְיוּ דְמַכְתְּשָׁא עַמִיק לִמְחַוָור כְּתַלְגָא יַתִּיר מִמְשַׁךְ בִּישְרֵיהּ מַכְתַּשׁ סְגִירוּתָא הוּא וְיַחֲמִינֵיהּ כַּהֲנָא וִיסָאֵיב יָתֵיהּ", "pj_en": "And the priest shall look at the plague in the skin of the flesh,--and if the hair of the stricken place be turned to whiteness, and the appearance of the plague be deeper (than the surface), and be whiter than the skin of his flesh, like snow, it is the plague of leprosy; and the priest having inspected him shall make him to be unclean.", "tj": "", "tj_en": "", "rashi": "<b>הפך לבן.<\/b> מִתְּחִלָּה שָׁחֹר וְהָפַךְ לְלָבָן בְּתוֹךְ הַנֶּגַע; וּמִעוּט שֵׂעָר שְׁנַיִם:<br><br><b>עמק מעור בשרו.<\/b> כָּל מַרְאֵה לָבָן עָמֹק הוּא, כְּמַרְאֵה חַמָּה עֲמֻקָּה מִן הַצֵּל:<br><br><b>וטמא אתו.<\/b> יֹאמַר לוֹ טָמֵא אַתָּה, שֶׁשֵּׂעָר לָבָן סִימָן טֻמְאָה הוּא גְּזֵרַת הַכָּתוּב:", "rashi_en": "הפך לבן [THE HAIR …] IS TURNED WHITE — This means that at first it was dark, and it turned white within the plague. The smallest number of hairs implied by the term שער is two (Sifra, Tazria Parashat Nega'im, Chapter 2 2).<br><br>עמק מעור בשרו [THE PLAGUE] IS DEEPER THAN THE SKIN OF HIS FLESH — Every white colour is deep (in contrast to a dark colour surrounding it) just as the colour of anything illuminated by the sun is deeper than the shadow (Shevuot 6b).<br><br>וטמא אתו HE SHALL PRONOUNCE HIM UNCLEAN — He (the priest) shall say to him. “Thou art unclean” — for it is an enactment of Scripture that hair that has become white is a symptom of uncleanness."}, {"ch": 13, "v": 4, "aliyah": 1, "heb": "וְאִם־בַּהֶ֩רֶת֩ לְבָנָ֨ה הִ֜וא בְּע֣וֹר בְּשָׂר֗וֹ וְעָמֹק֙ אֵין־מַרְאֶ֣הָ מִן־הָע֔וֹר וּשְׂעָרָ֖הֿ לֹא־הָפַ֣ךְ לָבָ֑ן וְהִסְגִּ֧יר הַכֹּהֵ֛ן אֶת־הַנֶּ֖גַע שִׁבְעַ֥ת יָמִֽים׃", "onk": "וְאִם בַּהֲרָא חַוְּרָא הִיא בִּמְשַׁךְ בִּסְרֵיהּ וְעַמִּיק לֵית מֶחֱזָהָא מִן מַשְׁכָא וּשְׂעָרָא לָא אִתְהֲפִיךְ לְמֶחֱוָר וְיַסְגַּר כַּהֲנָא יָת מַכְתָּשָׁא שִׁבְעָא יוֹמִין:", "onk_en": "If it is a snow-white spot in the skin of the flesh and it does not appear deeper than the skin and the hair did not turn white, the <i>kohein<\/i> shall confine the plague for seven days.", "pj": "וְאִם בַּהַקֵי חִיוַורְתָּא כְּסִידָא הוּא בִּמְשַׁךְ בִּישְרֵיהּ וְעָמִיק לֵית חֵיזְוֵיהּ לִמְחַוֵור כְּתַלְגָא יַתִּיר מִן מַשְׁכָא וּשְעָרָא לָא אִיתְהַפִּיךְ לְחִיוַור כְּסִידָא וְיַסְגֵר כַּהֲנָא יַת מַכְתְּשָׁא שַׁבְעָא יוֹמִין", "pj_en": "But if the bright spot be white like chalk in the skin of his flesh, and the appearance of it be not deep, with whiteness like snow rather than skin, the hair, too, not being turned to whiteness like chalk, the priest shall shut up him who is plagued seven days;", "tj": "", "tj_en": "", "rashi": "<b>ועמק אין מראה.<\/b> לֹא יָדַעְתִּי פֵרוּשׁוֹ:<br><br><b>והסגיר.<\/b> יַסְגִּירֶנּוּ בְּבַיִת אֶחָד וְלֹא יִרְאֶה עַד סוֹף הַשָּׁבוּעַ וְיוֹכִיחוּ סִימָנִים עָלָיו:", "rashi_en": "ועמק אין מראה AND ITS APPEARANCE BE NOT DEEPER [THAN THE SKIN] — I do not know the meaning of this.<br><br>והסגיר HE SHALL SHUT [HIM UP] — He shall shut him up in one house and shall not see him again until the end of the week. Then the symptom that show themselves shall decide regarding him whether he is unclean or not."}, {"ch": 13, "v": 5, "aliyah": 1, "heb": "וְרָאָ֣הוּ הַכֹּהֵן֮ בַּיּ֣וֹם הַשְּׁבִיעִי֒ וְהִנֵּ֤ה הַנֶּ֙גַע֙ עָמַ֣ד בְּעֵינָ֔יו לֹֽא־פָשָׂ֥ה הַנֶּ֖גַע בָּע֑וֹר וְהִסְגִּיר֧וֹ הַכֹּהֵ֛ן שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית׃", "onk": "וְיֶחֱזִנֵּיהּ כַּהֲנָא בְּיוֹמָא שְׁבִיעָאָה וְהָא מַכְתְּשָׁא <b>קָם כַּד הֲוָה<\/b> לָא <b>אוֹסֵף<\/b> מַכְתָּשָׁא בְּמַשְׁכָּא וְיַסְגְּרִנֵּיהּ כַּהֲנָא שִׁבְעָא יוֹמִין תִּנְיָנוּת:", "onk_en": "The <i>kohein<\/i> shall see him on the seventh day and behold! [if] the skin-eruption has maintained its hue [<b>remained as it was<\/b>]; the skin-eruption did not spread [<b>increase<\/b>] in the skin. The <i>kohein<\/i> shall confine him for seven days, a second time,", "pj": "וְיֶחֱמִינֵיהּ כַּהֲנָא בְּיוֹמָא שְׁבִיעָאָה וְהָא מַכְתָּשָׁא קָם כַּד הֲוָה לָא הֲלִיךְ פִּיסְיוֹנָא דְמַכְתָּשָׁא בְּמַשְׁכָא וְיַסְגְרִינֵיהּ כַּהֲנָא שַׁבְעָא יוֹמִין תִּנְיָינוּת", "pj_en": "and the priest shall inspect him on the seventh day, and, behold, if the plague stand as it was, and have not gone on wider in the skin, the priest shall shut him up a second seven days.", "tj": "", "tj_en": "", "rashi": "<b>בעניו.<\/b> בְּמַרְאֵהוּ וּבְשִׁעוּרוֹ הָרִאשׁוֹן:<br><br><b>והסגירו … שנית.<\/b> הָא אִם פָּשָׂה בְּשָׁבוּעַ רִאשׁוֹן, טָמֵא מֻחְלָט:", "rashi_en": "בעניו means in its original colour and size.<br><br>שנית … ‎והסגירו HE SHALL SHUT HIM UP … A SECOND TIME — Consequently if it has spread during the first week, he is decidedly unclean, and no further quarantine is required."}, {"ch": 13, "v": 6, "aliyah": 2, "heb": "וְרָאָה֩ הַכֹּהֵ֨ן אֹת֜וֹ בַּיּ֣וֹם הַשְּׁבִיעִי֮ שֵׁנִית֒ וְהִנֵּה֙ כֵּהָ֣ה הַנֶּ֔גַע וְלֹא־פָשָׂ֥ה הַנֶּ֖גַע בָּע֑וֹר וְטִהֲר֤וֹ הַכֹּהֵן֙ מִסְפַּ֣חַת הִ֔וא וְכִבֶּ֥ס בְּגָדָ֖יו וְטָהֵֽר׃", "onk": "וְיֶחֱזֵי כַהֲנָא יָתֵיהּ בְּיוֹמָא שְׁבִיעָאָה תִּנְיָנוּת וְהָא עַמְיָא מַכְתָּשָׁא וְלָא <b>אוֹסֵף<\/b> מַכְתָּשָׁא בְּמַשְׁכָּא וִידַכִּנֵּיהּ כַּהֲנָא <b>עֲדִיתָא<\/b> הִיא וִיצַבַּע לְבוּשׁוֹהִי וְיִדְכֵּי:", "onk_en": "The <i>kohein<\/i> shall see him on the seventh day for the second time and behold! [if] the skin-eruption became dimmer and the skin-eruption did not spread [<b>increase<\/b>] in the skin, the <i>kohein<\/i> shall declare him [to be] clean; it is [merely] a [<b>removed<\/b>] white discoloration. He shall wash his garments and he will be cleansed.", "pj": "וְיֶחֱמֵי כַּהֲנָא יָתֵיהּ בְּיוֹמָא שְׁבִיעָאָה תִּנְיָנוּת וְהָא עַמְיָא מַכְתָּשָׁא לָא הֲלִיךְ פִּסְיוֹנָא דְמַכְתָּשָׁא בְּמַשְׁכָא וִידַכִּינֵיהּ כַּהֲנָא קְלוּפֵי מִטַפְלָא הוּא וְיִצְבַּע לְבוּשׁוֹי וְיִדְכֵּי", "pj_en": "And the priest shall inspect him the second seventh day; and, behold, if the plague hath become darker, and hath not gone wider in the skin, the priest shall make him to be clean; it is an obstinate sore, and he shall wash his clothes and be clean.", "tj": "", "tj_en": "", "rashi": "<b>כהה.<\/b> הָכְהָה מִמַּרְאִיתוֹ, הָא אִם עָמַד בְּמַרְאִיתוֹ אוֹ פָשָׂה טָמֵא:<br><br><b>מספחת.<\/b> שֵׁם נֶגַע טָהוֹר:<br><br><b>וכבס בגדיו וטהר.<\/b> הוֹאִיל וְנִזְקַק לְהִסָּגֵר נִקְרָא טָמֵא וְצָרִיךְ טְבִילָה:", "rashi_en": "כֵּהֶה means it has become paler than its former color — consequently if it remains in its color or if it has spread he is unclean.<br><br>מספחת — This is the name of a clean leprous disease.<br><br>וכבס את בגדיו וטהר AND HE SHALL WASH HIS GARMENTS AND BE CLEAN — Since he required shutting up he was termed (was regarded as coming under the term) “unclean” (although it now transpires that he was clean), and he must undergo immersion in a ritual bath."}, {"ch": 13, "v": 7, "aliyah": 2, "heb": "וְאִם־פָּשֹׂ֨ה תִפְשֶׂ֤ה הַמִּסְפַּ֙חַת֙ בָּע֔וֹר אַחֲרֵ֧י הֵרָאֹת֛וֹ אֶל־הַכֹּהֵ֖ן לְטׇהֳרָת֑וֹ וְנִרְאָ֥ה שֵׁנִ֖ית אֶל־הַכֹּהֵֽן׃", "onk": "וְאִם <b>אוֹסָפָא תוֹסֵף עֲדִיתָא<\/b> בְּמַשְׁכָּא בָּתַר דִּאִתַּחֲזִי לְכַהֲנָא לְדַכּוּתֵיהּ וְיִתַּחֲזִי תִנְיָנוּת לְכַהֲנָא:", "onk_en": "If the [<b>removed<\/b>] white discoloration has spread [<b>increased<\/b>] in the skin after it was shown to the <i>kohein,<\/i> who pronounced that it was clean, it must be shown a second time to the <i>kohein.<\/i>", "pj": "וְאִם הֲלוּכֵי הֲלִיךְ פִּסְיוֹנָא דְקִילוּפֵי דְמִטַפְלָא בְּמַשְׁכָא בָּתַר דְאִיתְחַמֵי לְכַּהֲנָא לִדְכוּתֵיהּ וְיִתְחֲמֵי תִנְיָינוּת לְכַהֲנָא", "pj_en": "But if the inveterate sore widen in the skin after he had been shown to the priest who had pronounced him clean, let him a second time be seen by the priest.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 8, "aliyah": 2, "heb": "וְרָאָה֙ הַכֹּהֵ֔ן וְהִנֵּ֛ה פָּשְׂתָ֥ה הַמִּסְפַּ֖חַת בָּע֑וֹר וְטִמְּא֥וֹ הַכֹּהֵ֖ן צָרַ֥עַת הִֽוא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיֶחֱזֵי כַהֲנָא וְהָא <b>אוֹסֵפַת עֲדִיתָא<\/b> בְּמַשְׁכָּא וִיסָאֵבִנֵּיהּ כַּהֲנָא <b>סְגִירוּתָא<\/b> הִיא:", "onk_en": "The <i>kohein<\/i> shall see and behold! [if] the [<b>removed<\/b>] white discoloration has spread [<b>increased<\/b>] in the skin, the <i>kohein<\/i> shall declare him unclean, it is <i>tzoraas.<\/i> [<b>‘confinement’<\/b>]", "pj": "וְיֶחֱמֵי כַּהֲנָא וְלָא הֲלִיכַת פִּיסְיוֹנָא דְקִילוּפֵי מִטַפְלָא בְּמַשְׁכָא וְיַסְאֲבִינֵיהּ כַהֲנָא מְטוֹל דִסְגִירוּתָא הוּא", "pj_en": "And the priest shall look; and, behold, if the widening of the inveterate sore hath gone on in the skin, the priest shall make him unclean; for it is the leprosy.", "tj": "", "tj_en": "", "rashi": "<b>וטמאו הכהן.<\/b> וּמִשֶּׁטִּמְּאוֹ הֲרֵי הוּא מֻחְלָט, וְזָקוּק לְצִפֳּרִים וּלְתִגְלַחַת וּלְקָרְבָּן הָאָמוּר בְּפָרָשַׁת זֹאת תִּהְיֶה:<br><br><b>צרעת הוא.<\/b> הַמִּסְפַּחַת הַזֹּאת:<br><br><b>צרעת.<\/b> לְשׁוֹן נְקֵבָה. <b>נגע.<\/b> לְשׁוֹן זָכָר:", "rashi_en": "וטמאו הכהן AND THE PRIEST SHALL PRONOUNCE HIM UNCLEAN — and as soon as he has pronounced him unclean he is a decided leper and he is obliged when he recovers from his leprosy to bring two birds (as a means of his purification) and to shave his flesh and to bring the offering which is mentioned in the section beginning זאת תהיה — Leviticus ch. 14 (cf. Megillah 8b).<br><br>צרעת הוא IT IS A LEPROSY — this מספחת is a leprosy (while the מספחת mentioned in v. 6 is a clean scab)<br><br>The word צרעת is feminine; נגע is masculine."}, {"ch": 13, "v": 9, "aliyah": 2, "heb": "נֶ֣גַע צָרַ֔עַת כִּ֥י תִהְיֶ֖ה בְּאָדָ֑ם וְהוּבָ֖א אֶל־הַכֹּהֵֽן׃", "onk": "מַכְתַּשׁ <b>סְגִירוּ<\/b> אֲרֵי תְהֵי בֶּאֱנָשָׁא וְיִתֵּתֵי לְוָת כַּהֲנָא:", "onk_en": "When there is a skin-eruption of <i>tzoraas<\/i> [<b>‘confinement’<\/b>] on a person he shall be brought to the <i>kohein.<\/i>", "pj": "מַכְתַּשׁ סְגִירוּ אֲרוּם יְהֵי בְּבַר נַשׁ וִיתֵיתֵיהּ לְוַת כַּהֲנָא", "pj_en": "When the plague of leprosy is upon a man, let him be brought to the priest.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 10, "aliyah": 2, "heb": "וְרָאָ֣ה הַכֹּהֵ֗ן וְהִנֵּ֤ה שְׂאֵת־לְבָנָה֙ בָּע֔וֹר וְהִ֕יא הָפְכָ֖ה שֵׂעָ֣ר לָבָ֑ן וּמִֽחְיַ֛ת בָּשָׂ֥ר חַ֖י בַּשְׂאֵֽת׃", "onk": "וְיֶחֱזֵי כַהֲנָא וְהָא <b>עַמְקָא<\/b> חַוְּרָא בְּמַשְׁכָּא וְהִיא הֲפָכַת שֵׂעָר לְחִוָּר <b>וְרשֶׁם<\/b> בִּסְרָא חַיְתָא <b>בְּעַמִּקְתָּא<\/b>:", "onk_en": "The <i>kohein<\/i> shall see and behold! there is an intensely [<b>deep<\/b>] white spot on the skin and it has turned the hair white or there is [<b>an impression of<\/b>] healthy flesh in the spot of intense [<b>deep<\/b>] whiteness,", "pj": "וְיֶחֱמֵי כַּהֲנָא וְהָא שׁוּמָא זְקִיפָא חִיוְרָא בְּמוֹשְׁכָא כַּעֲמַר נָקִי וְהִיא הַפְכַת שַעֲרָא לְמֶחֱוַר כִּקְרוּם בֵּיעֲתָא וְרוֹשַׁם בִּישְרָא חַיָיא בְּשׁוּמָא", "pj_en": "And the priest shall observe; and, behold, if there be a white tumour rising on the skin like pure wool, and the hair be turned to whiteness as the white of an egg, and the sign of quick flesh be in the tumour,", "tj": "", "tj_en": "", "rashi": "<b>ומחית.<\/b> שינמי\"נט בְּלַעַז, שֶׁנֶּהְפַּךְ מִקְצַת הַלֹּבֶן שֶׁבְּתוֹךְ הַשְּׂאֵת לְמַרְאֵה בָשָׂר, אַף הִיא סִימָן טֻמְאָה — שֵׂעָר לָבָן בְּלֹא מִחְיָה וּמִחְיָה בְּלֹא שֵׂעָר לָבָן — וְאַף עַל פִּי שֶׁלֹּא נֶאֶמְרָה מִחְיָה אֶלָּא בַּשְּׂאֵת, אַף בְּכָל הַמַּרְאוֹת וְתוֹלְדוֹתֵיהֶן הוּא סִימָן טֻמְאָה:", "rashi_en": "ומחית A QUICK [RAW FLESH] — sainement in old French English healing; — it means that the part of the white within the “higher-lying white spot” (השאת) has turned to a flesh-colour; this, too, is a symptom of uncleanness; — white hair without healthy flesh, and healthy flesh without white hair . Although healthy flesh is mentioned only in connection with a spot of higher-lying colour, in the case of all pure white colours (snow-white and wool-white) and their shades (lit., derivations) it is also a symptom of uncleanness(cf. Sifra, Tazria Parashat Nega'im, Section 3 1; Mishnah Negaim 4:6)."}, {"ch": 13, "v": 11, "aliyah": 2, "heb": "צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּע֣וֹר בְּשָׂר֔וֹ וְטִמְּא֖וֹ הַכֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔נּוּ כִּ֥י טָמֵ֖א הֽוּא׃", "onk": "<b>סְגִירוּת<\/b> עַתִּיקָא הִיא בִּמְשַׁךְ בִּסְרֵיהּ וִיסָאֵבִנֵּיהּ כַּהֲנָא לָא יַסְגְּרִנֵיהּ אֲרֵי מְסָאָב הוּא:", "onk_en": "it is an old <i>tzoraas<\/i> [<b>‘confinement’<\/b>] in the skin of his body and the <i>kohein<\/i> shall declare him unclean he shall not confine him, since he is [obviously] unclean.", "pj": "סְגִירוּתָא עֲתִּיקוּתָא הוּא בִּמְשַׁךְ בִּישְרֵיהּ וְיַסְאִיבִינֵיהּ וְיַחְלְטִינֵיהּ כַּהֲנָא לָא יַסְגְרִינֵיהּ אֲרוּם מְסָאָב הוּא", "pj_en": "it is an inveterate leprosy in the skin of his flesh; and the priest shall adjudge and pronounce him unclean, but not shut him up, for he is (known to be) unclean.", "tj": "", "tj_en": "", "rashi": "<b>צרעת נושנת הוא.<\/b> מַכָּה יְשָׁנָה הִיא תַּחַת הַמִּחְיָה, וְחַבּוּרָה זוֹ נִרְאֵית בְּרִיאָה לְמַעְלָה וְתַחְתֶּיהָ מְלֵאָה לֵחָה — שֶׁלֹּא תֹאמַר הוֹאִיל וְעָלְתָה מִחְיָה אֲטַהֲרֶנָּה:", "rashi_en": "צרעת נשנת הוא IT IS AN OLD LEPROSY — i. e. it is an old leprous malady beneath the sound flesh, and this wound appears healthy above, but underneath it is full of moisture (pus), therefore the priest shall pronounce it unclean. Scripture states this in order that you should not say: since healthy flesh has come over it I shall pronounce it clean."}, {"ch": 13, "v": 12, "aliyah": 2, "heb": "וְאִם־פָּר֨וֹחַ תִּפְרַ֤ח הַצָּרַ֙עַת֙ בָּע֔וֹר וְכִסְּתָ֣ה הַצָּרַ֗עַת אֵ֚ת כׇּל־ע֣וֹר הַנֶּ֔גַע מֵרֹאשׁ֖וֹ וְעַד־רַגְלָ֑יו לְכׇל־מַרְאֵ֖ה עֵינֵ֥י הַכֹּהֵֽן׃", "onk": "וְאִם מִסְגָּא תִסְגֵּי <b>סְגִירוּתָא<\/b> בְּמַשְׁכָּא וְתַחֲפֵי <b>סְגִירוּתָא<\/b> יָת כָּל מְשַׁךְ מַכְתָּשָׁא מֵרֵישֵׁיהּ וְעַד רַגְלוֹהִי לְכָל חֵיזוּ עֵינֵי כַהֲנָא:", "onk_en": "And if the <i>tzoraas<\/i> [<b>‘confinement’<\/b>] sprouts on the skin and if the <i>tzoraas<\/i> [<b>‘confinement’<\/b>] covered the entire skin of the [one affected by] the eruption from his head until his feet to the extent that the <i>kohein<\/i> can see.", "pj": "וְאִין מִסְגַיָא תַּסְגֵי סְגִירוּתָא בְּמוֹשְׁכָא וְתַחְפֵי סְגִירוּתָא יַת כָּל מְשַׁךְ בִּישְרֵיהּ מֵרֵישֵׁיהּ וְעַד רִיגְלוֹי לְכָל חֵיזְיוּ דְחַמְיַין עֵינוֹי דְכַהֲנָא וּמִתְכַוְונָן בֵּין לִמְדַכְיָא וּבֵין לְסָאֳבָא", "pj_en": "Yet if the leprosy increasing increaseth in the skin, and the leprosy covereth all the skin of his flesh, from his head even to his feet, in whatever part the eyes of the priest may look on, in deliberating between cleanness and uncleanness,", "tj": "", "tj_en": "", "rashi": "<b>מראשו.<\/b> שֶׁל אָדָם <b>ועד רגליו<\/b>:<br><br><b>לכל מראה עיני הכהן.<\/b> פְּרָט לְכֹהֵן שֶׁחָשַׁךְ מְאוֹרוֹ (ספרא):", "rashi_en": "מראשו FROM THE HEAD of the man ועד רגליו AND UNTO HIS FEET,<br><br>לכל מראה עיני הכהן WHERESOEVER THE PRIEST LOOKETH (lit., to the whole sight of the priest’s eyes) — This excludes a priest the sight of whose eyes is darkened (whose sight is imperfect) (Sifra, Tazria Parashat Nega'im, Chapter 4 4)."}, {"ch": 13, "v": 13, "aliyah": 2, "heb": "וְרָאָ֣ה הַכֹּהֵ֗ן וְהִנֵּ֨ה כִסְּתָ֤ה הַצָּרַ֙עַת֙ אֶת־כׇּל־בְּשָׂר֔וֹ וְטִהַ֖ר אֶת־הַנָּ֑גַע כֻּלּ֛וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא׃", "onk": "וְיֶחֱזֵי כַהֲנָא וְהָא חֲפַת <b>סְגִירוּתָא<\/b> יָת כָּל בִּסְרֵיהּ וִידַכִּי יָת מַכְתָּשָׁא כֻּלֵּיהּ אִתְהֲפִיךְ לְמֶחֱוַר דְּכֵי הוּא:", "onk_en": "The <i>kohein<\/i> shall see and behold! the <i>tzoraas<\/i> [<b>‘confinement’<\/b>] has covered all of his body, he shall declare the skin-eruption to be cleansed, it has turned completely white, he is clean.", "pj": "וְיֶחֱמֵי כַּהֲנָא וְהָא חְפַת סְגִירוּתָא יַת כָּל בִּישְרֵיהּ וְיִדְכֵּי יַת מַכְתָּשָׁא כּוּלֵיהּ אִתְהֲפִּיךְ לְחִיוַור דְכֵי הוּא", "pj_en": "the priest shall consider; and, behold, if the leprosy covereth all his flesh, the plagued man shall be (pronounced) to be clean: all of him is turned to whiteness, he is clean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 14, "aliyah": 2, "heb": "וּבְי֨וֹם הֵרָא֥וֹת בּ֛וֹ בָּשָׂ֥ר חַ֖י יִטְמָֽא׃", "onk": "וּבְיוֹמָא דְאִתַּחֲזִי בֵיהּ בִּסְרָא חַיָּא יְהֵי מְסָאָב:", "onk_en": "On the day that healthy flesh appears on him, he will become unclean.", "pj": "בְּרַם יוֹמָא דְיִתְחֲמֵי בֵּיהּ בִּישְרָא חַיָיא דְבֵיהּ יְהֵי מְסָאָב", "pj_en": "But in the day that live flesh appeareth in him he is unclean.", "tj": "", "tj_en": "", "rashi": "<b>וביום הראות בו בשר חי.<\/b> אִם צָמְחָה בוֹ מִחְיָה הֲרֵי כְבָר פֵּרֵשׁ שֶׁהַמִּחְיָה סִימָן טֻמְאָה? אֶלָּא הֲרֵי שֶׁהָיָה הַנֶּגַע בְּאֶחָד מֵעֶשְׂרִים וְאַרְבָּעָה רָאשֵׁי אֵבָרִים שֶׁאֵין מִטַּמְּאִין מִשּׁוּם מִחְיָה — לְפִי שֶׁאֵין נִרְאֶה הַנֶּגַע כֻּלּוֹ כְאֶחָד, שֶׁשּׁוֹפְעִין אֵילָךְ וָאֵילָךְ (נגעים פ\"ו; קידושין כ\"ה) — וְחָזַר רֹאשׁ הָאֵבֶר וְנִתְגַּלָּה שִׁפּוּעוֹ עַל יְדֵי שֻׁמָּן, כְּגוֹן שֶׁהִבְרִיא וְנַעֲשָֹה רָחָב וְנִרְאֵית בּוֹ הַמִּחְיָה, לִמְּדָנוּ הַכָּתוּב שֶׁתְּטַמֵּא (ספרא):<br><br><b>וביום.<\/b> מַה תַּ\"ל? לְלַמֵּד יֵשׁ יוֹם שֶׁאַתָּה רוֹאֶה בוֹ וְיֵשׁ יוֹם שֶׁאֵין אַתָּה רוֹאֶה בוֹ, מִכָּאן אָמְרוּ: חָתָן נוֹתְנִין לוֹ כָּל שִׁבְעַת יְמֵי הַמִּשְׁתֶּה, לוֹ וְלִכְסוּתוֹ וּלְבֵיתוֹ, וְכֵן בָּרֶגֶל נוֹתְנִין לוֹ כָּל יְמֵי הָרֶגֶל (נגעים פ\"ג, מועד קטן ז'):", "rashi_en": "בו בשר חי‎‎‎‏‎‎ וביום הראות ‎‎ BUT ON THE DAY WHEN RAW FLESH APPEARETH IN HIM [HE SHALL BE UNCLEAN] — If this means that a healthy spot sprang up in it and that on this account it is unclean, surely, however, it has already been stated that the healthy spot is a symptom of uncleanness! Why repeat it here? But it is the following case: that the plague was on one of the “twenty-four tips of the limbs” that project from the body (cf. Rashi on Exodus 21:26), — which cannot become unclean (i. e. be declared unclean) because it has healthy flesh since the leprous plague as a whole cannot be seen at one time, (as is required by Scripture stating: לכל מראה עיני הכהן  cf. Kiddushin 25a),because they (the two sides of the affected limb) slope in different directions (Mishnah Negaim 6:7; Kiddushin 25a) — and the tip of the limb altered, so that its sloping side became visible through fat, as e. g., if it (the tip of the limb) became thick and broadened (so that the sloping sides flattened out to form one surface with the limb) and the healthy flesh thus becomes visible in it, Scripture informs us that it (such healthy flesh) makes it unclean on the day when it is seen in it (Sifra, Tazria Parashat Nega'im, Chapter 5 1). ‎<br><br>וביום — Why is this word used (it might have said ובהראות)? To inform us that there are days when you may see (examine) the plague and there are days when you may not examine. On this account they (the Rabbis) said: A bridegroom is given a respite of all the seven days of the marriage festivities — to him, and to his clothing and his house (i.e. whether he himself or his clothing, cf. v. 17, or his house, cf. Leviticus 14:33 ff., has been affected by a leprous disease), and similarly on a festival he (everyone) is given a respite all the days of that festival — and during these periods the priest may not come to examine him or his clothing or his house (Mishnah Negaim 3:2; Moed Katan 7b; Sifra, Tazria Parashat Nega'im, Chapter 5 2; cf. Bekhorot 43b)."}, {"ch": 13, "v": 15, "aliyah": 2, "heb": "וְרָאָ֧ה הַכֹּהֵ֛ן אֶת־הַבָּשָׂ֥ר הַחַ֖י וְטִמְּא֑וֹ הַבָּשָׂ֥ר הַחַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא׃", "onk": "וְיֶחֱזֵי כַהֲנָא יָת בִּסְרָא חַיָּא וִיסָאֵבִנֵּיהּ בִּסְרָא חַיָּא מְסָאָב הוּא <b>סְגִירוּת<\/b> הוּא:", "onk_en": "The <i>kohein<\/i> shall see the healthy flesh and declare him unclean. The healthy flesh is unclean, it is <i>tzoraas.<\/i> [<b>‘confinement’<\/b>]", "pj": "וְיֶחֱמֵי כַּהֲנָאיַת בִּישְרָא חַיָיא וְיַסְאִיבִינֵיהּ מְטוּל דְבִישְרָא חַיָיא דְבֵיהּ מְסָאָב הוּא סְגִירוּתָא הוּא", "pj_en": "And the priest shall observe the live flesh, and make him to be unclean; on account of the live flesh in him he is unclean; it is leprosy.", "tj": "", "tj_en": "", "rashi": "<b>צרעת הוא.<\/b> הַבָּשָׂר הַהוּא: בָּשָׂר לְשׁוֹן זָכָר:", "rashi_en": "צרעת הוא IT IS A LEPROSY — that flesh is a leprosy; בשר is masc., and therefore the pronoun הוּא is used as its copula."}, {"ch": 13, "v": 16, "aliyah": 2, "heb": "א֣וֹ כִ֥י יָשׁ֛וּב הַבָּשָׂ֥ר הַחַ֖י וְנֶהְפַּ֣ךְ לְלָבָ֑ן וּבָ֖א אֶל־הַכֹּהֵֽן׃", "onk": "אוֹ אֲרֵי יְתוּב בִּסְרָא חַיָּא וְיִתְהֲפִיךְ לְמֶחֱוָר <b>וְיִתֵּתֵי<\/b> לְוָת כַּהֲנָא:", "onk_en": "Or, if the healthy flesh turns again and it was changed to white, he shall come [<b>be brought<\/b>] to the <i>kohein.<\/i>", "pj": "אוֹ אֲרוּם יֵיתוּב בִּישְרָא חַיָיא וְיִתְהַפִּיךְ לְחִיוַור וְיַיְתֵי לְוַת כַּהֲנָא", "pj_en": "Or if the live flesh be turned and changed into whiteness, he shall be brought to the priest;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 17, "aliyah": 2, "heb": "וְרָאָ֙הוּ֙ הַכֹּהֵ֔ן וְהִנֵּ֛ה נֶהְפַּ֥ךְ הַנֶּ֖גַע לְלָבָ֑ן וְטִהַ֧ר הַכֹּהֵ֛ן אֶת־הַנֶּ֖גַע טָה֥וֹר הֽוּא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיֶחֱזִנֵּיהּ כַּהֲנָא וְהָא אִתְהֲפִיךְ מַכְתָּשָׁא לְמֶחֱוָר וִידַכֵּי כַהֲנָא יָת מַכְתָּשָׁא דְּכֵי הוּא:", "onk_en": "The <i>kohein<\/i> shall see him, and behold! the skin-eruption has turned white; the <i>kohein<\/i> shall declare the skin-eruption to be clean, he is clean.", "pj": "וְיַחֲמִינֵיהּ כַּהֲנָא וְהָא אִתְהַפִּיךְ מַכְתָּשָׁא לְמִיחֲוָור וְיִדְכֵּי כַּהֲנָא יַת מַכְתָּשָׁא דְכֵי הוּא", "pj_en": "and the priest shall observe, and, behold, the plague is turned white, and the priest shall adjudge the plague to be clean; he is clean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 18, "aliyah": 3, "heb": "וּבָשָׂ֕ר כִּֽי־יִהְיֶ֥ה בֽוֹ־בְעֹר֖וֹ שְׁחִ֑ין וְנִרְפָּֽא׃", "onk": "וּבִסְרָא אֲרֵי יְהֵי בֵיהּ בְּמַשְׁכֵּיהּ שִׁחֲנָא וְיִתַּסֵּי:", "onk_en": "When a person has on his skin an inflammation that has healed.", "pj": "וּבַר נַשׁ אֲרוּם יְהֵי בֵיהּ בְמוֹשְׁכֵיהּ שִׁיחְנָא וְאִיתְּסֵי", "pj_en": "And if a man have in his skin an ulcer, and it hath healed;", "tj": "", "tj_en": "", "rashi": "<b>שחין.<\/b> לְשׁוֹן חִמּוּם, שֶׁנִּתְחַמֵּם הַבָּשָֹר בְּלִקּוּי הַבָּא לוֹ מֵחֲמַת מַכָּה שֶׁלֹּא מֵחֲמַת הָאוּר (חולין ח'):<br><br><b>ונרפא.<\/b> הַשְּׁחִין הֶעֱלָה אֲרוּכָה וּבִמְקוֹמוֹ הֶעֱלָה נֶגַע אַחֵר:", "rashi_en": "שחין A BOIL — The word expresses the idea of heat. It is so called because the flesh has become inflamed by an injury which came about as the result of a blow and not as the result of fire (the latter case being mentioned in v. 24 and being termed a מכוה) (Chullin 8a).<br><br>ונרפא AND IT BECAME HEALED — the boil (not the flesh also mentioned in this verse) became healed and in its place it produced another plague (the שאת mentioned in the next verse)."}, {"ch": 13, "v": 19, "aliyah": 3, "heb": "וְהָיָ֞ה בִּמְק֤וֹם הַשְּׁחִין֙ שְׂאֵ֣ת לְבָנָ֔ה א֥וֹ בַהֶ֖רֶת לְבָנָ֣ה אֲדַמְדָּ֑מֶת וְנִרְאָ֖ה אֶל־הַכֹּהֵֽן׃", "onk": "וִיהֵי בַּאֲתַר שִׁחֲנָא <b>עַמְקָא<\/b> חַוְּרָא אוֹ בַהֲרָא חַוְּרָא סַמְקָא וְיִתַּחֲזִי לְכַהֲנָא:", "onk_en": "If there was on the area of the inflammation a spot of intense [<b>deep<\/b>] whiteness or a snow-white spot tinged with red it shall be shown to the <i>kohein.<\/i>", "pj": "וִיהֵי בַּאֲתַר שִׁיחְנָא שׁוּמָא זְקִיפָא חִיוְרָא אוֹ בַּהֲקֵי מִיטַפְלָא חִיוְרָא סַמְקָא מְעַרְבִין וְיִתְחֲמֵי לְוַת כַּהֲנָא", "pj_en": "but in the place of the ulcer there hath come a white rising tumour, or a bright fixed spot, (in colour) white mixed with red; he shall be seen by the priest.", "tj": "", "tj_en": "", "rashi": "<b>או בהרת לבנה אדמדמת.<\/b> שֶׁאֵין הַנֶּגַע לָבָן חָלָק, אֶלָּא פָּתוּךְ וּמְעֹרָב בִּשְׁתֵּי מַרְאוֹת — לֹבֶן וְאֹדֶם:", "rashi_en": "או בהרת לבנה אדמדמת in OR A BRIGHT SPOT REDDISH-WHITE — It means that the plague is not evenly white but it is compounded and intermingled with two colours — white and red."}, {"ch": 13, "v": 20, "aliyah": 3, "heb": "וְרָאָ֣ה הַכֹּהֵ֗ן וְהִנֵּ֤ה מַרְאֶ֙הָ֙ שָׁפָ֣ל מִן־הָע֔וֹר וּשְׂעָרָ֖הּ הָפַ֣ךְ לָבָ֑ן וְטִמְּא֧וֹ הַכֹּהֵ֛ן נֶֽגַע־צָרַ֥עַת הִ֖וא בַּשְּׁחִ֥ין פָּרָֽחָה׃", "onk": "וְיֶחֱזֵי כַהֲנָא וְהָא מֶחֱזָהָא מַכִּיךְ מִן מַשְׁכָּא וּשְׂעָרַהּ אִתְהֲפִיךְ לְמֶחֱוָר וִיסָאֵבִינֵיהּ כַּהֲנָא מַכְתַּשׁ <b>סְגִירוּתָא<\/b> הִיא בְּשִׁחֲנָא סְגִיאַת:", "onk_en": "The <i>kohein<\/i> shall see it and behold! its appearance is lower than the skin, and its hair has turned white, the <i>kohein<\/i> shall declare him unclean; It is the skin-eruption of <i>tzoraas<\/i> [<b>‘confinement’<\/b>] that has sprouted through the inflammation.", "pj": "וְיֶחֱמֵי כַּהֲנָא וְהָא חֵיזְוָהָא מַכִּיךְ מִן מוֹשְׁכָא לְמֶחֱוַור וּשְעָרָהּ אִתְהַפִּיךְ לְמֶחֱוַור וְיַסְאִיבִינֵיהּ כַּהֲנָא מְטוּל דְמַכְתַּשׁ סְגִירוּתָא הוּא בְּשִׁיחֲנָא סַגִיאָת", "pj_en": "And the priest shall look; and, behold, if the appearance of it be deeper than the skin, and it becometh white, and the hair is turned white, the priest shall make him to be unclean; for it is a plague of leprosy which increaseth in the ulcer.", "tj": "", "tj_en": "", "rashi": "<b>מראה שפל.<\/b> וְאֵין מַמָּשָׁהּ שָׁפָל, אֶלָּא מִתּוֹךְ לַבְנוּנִיתוֹ הוּא נִרְאֶה שָׁפָל וְעָמֹק, כְּמַרְאֵה חַמָּה עֲמֻקָּה מִן הַצֵּל:", "rashi_en": "מראה שפל IT BE IN SIGHT LOWER [THAN THE SKIN] — it itself is not deeper, but on account of its whiteness it appears lower and deeper ‎(מראה שפל), just as the colour of anything illuminated by the sun is deeper than the shadow (see Rashi v. 3)."}, {"ch": 13, "v": 21, "aliyah": 3, "heb": "וְאִ֣ם&thinsp;<b>׀<\/b> יִרְאֶ֣נָּה הַכֹּהֵ֗ן וְהִנֵּ֤ה אֵֽין־בָּהּ֙ שֵׂעָ֣ר לָבָ֔ן וּשְׁפָלָ֥הֿ אֵינֶ֛נָּה מִן־הָע֖וֹר וְהִ֣יא כֵהָ֑ה וְהִסְגִּיר֥וֹ הַכֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׃", "onk": "וְאִם יֶחֱזִנַּהּ כַּהֲנָא וְהָא לֵית בַּהּ שֵׂעָר חִוָּר וּמַכִּיכָא לֵיתָהָא מִן מַשְׁכָּא וְהִיא עָמְיָא וְיַסְגְּרִנֵּיהּ כַּהֲנָא שִׁבְעָא יוֹמִין:", "onk_en": "If the <i>kohein<\/i> looks at it and behold! there is no white hair in it, and it is not lower than the skin and it is faint, the <i>kohein<\/i> shall confine him for seven days.", "pj": "וְאִין יֶחֱמִינָהּ כַּהֲנָא וְהָא לֵית בָּהּ שְעַר חִיוַור וּמַכִּיכָא לָא אִיתָא לִמְחַוֵור יַתִּיר מִן מַשְׁכָא מְטוּל דְהִיא עַמְיָא וְיַסְגִירִינֵיהּ כַּהֲנָא שׁוּבְעָא יוֹמִין", "pj_en": "And if the priest look, and, behold, the hair in it is not whitened, and the whiteness (of the spot) is not in appearance deeper than the skin, and that it hath become dim, then must the priest shut him up seven days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 22, "aliyah": 3, "heb": "וְאִם־פָּשֹׂ֥ה תִפְשֶׂ֖ה בָּע֑וֹר וְטִמֵּ֧א הַכֹּהֵ֛ן אֹת֖וֹ נֶ֥גַע הִֽוא׃", "onk": "וְאִם <b>אוֹסָפָא תוֹסֵף<\/b> בְּמַשְׁכָּא וִיסָאֵב כַּהֲנָא יָתֵיהּ מַכְתָּשָׁא הִיא:", "onk_en": "If it spread [<b>increased<\/b>] in the skin, the <i>kohein<\/i> shall declare him unclean, it is a skin eruption.", "pj": "וְאִין הַלְכָא תַהֲלִיךְ פִּסְיוֹנָא בְּמוֹשְׁכָא וְיִסְאַב כַּהֲנָא יָתֵיהּ מַכְתְּשָׁא הוּא", "pj_en": "And the priest shall look on the seventh day; and if it hath gone on widening in the skin, the priest shall make him to be unclean; for it is the plague of leprosy.", "tj": "", "tj_en": "", "rashi": "<b>נגע הוא.<\/b> הַשְּׂאֵת הַזֹּאת אוֹ הַבַּהֶרֶת:", "rashi_en": "נגע הִוא IT IS A PLAGUE — this rising or bright spot is a plague (שאת and בהרת are fem., hence the fem. adj. הִיא)."}, {"ch": 13, "v": 23, "aliyah": 3, "heb": "וְאִם־תַּחְתֶּ֜יהָ תַּעֲמֹ֤ד הַבַּהֶ֙רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַשְּׁחִ֖ין הִ֑וא וְטִהֲר֖וֹ הַכֹּהֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִם בְּאַתְרָהָא קָמַת בֶּהַרְתָּא לָא <b>אוֹסֵפַת רשֶׁם<\/b> שִׁחֲנָא הִיא וִידַכִּנֵּיהּ כַּהֲנָא:", "onk_en": "If the snow-white spot remains in its place and it did not spread [<b>increase<\/b>], it is [merely] a scar [<b>an impression<\/b>] of the inflammation and the <i>kohein<\/i> shall declare him clean.", "pj": "וְאִין בְּאַתְרָא קָמַת בַּהֲקֵי לָא הֲלִיכַת פִּסְיוֹנָא צוֹלְקַת שִׁיחֲנָא הִיא וְיַדְכִינֵיהּ כַּהֲנָא", "pj_en": "But if the spot abideth in its place, and hath not gone on widening in the skin, but hath become fainter, it is an inflamed blotch; and the priest shall make him to be clean; it is a burning scar.", "tj": "", "tj_en": "", "rashi": "<b>תחתיה.<\/b> בִּמְקוֹמָהּ:<br><br><b>צרבת השחין.<\/b> כְּתַרְגּוּמוֹ רֹשֶׁם שִׁחֲנָא; — אֵינוֹ אֶלָּא רֹשֶׁם הַחִמּוּם הַנִּכָּר בַּבָּשָֹר; כָּל צָרֶבֶת לְשׁוֹן רְגִיעַת עוֹר הַנִּרְגָּע מֵחֲמַת חִמּוּם, כְּמוֹ וְנִצְרְבוּ בָהּ כָּל פָּנִים (יחזקאל כ\"א), רייטרו\"ר בְּלַעַז:<br><br><b>צרבת.<\/b> רייטרי\"שמנט בְּלַעַז:", "rashi_en": ".תחתיה means IN ITS PLACE (and not “beneath it”).<br><br>צרבת שחין [IT IS] A BURNING BOIL — Understand this as the Targum does: רשם שחנא — i. e. it is only a mark (a scar) of the inflammation, discernible in the flesh. Wherever צרבת occurs it denotes the contraction of skin which has become shrivelled through inflammation. Similar is, (Ezekiel 21:3) “and every face shall become shrivelled (ונצרבו)” through the heat mentioned in the verse, retrecir in old French, to contract.<br><br>צרבת is retrecissement in old French, (English = contraction). "}, {"ch": 13, "v": 24, "aliyah": 4, "heb": "א֣וֹ בָשָׂ֔ר כִּֽי־יִהְיֶ֥ה בְעֹר֖וֹ מִכְוַת־אֵ֑שׁ וְֽהָיְתָ֞ה מִֽחְיַ֣ת הַמִּכְוָ֗ה בַּהֶ֛רֶת לְבָנָ֥ה אֲדַמְדֶּ֖מֶת א֥וֹ לְבָנָֽה׃", "onk": "אוֹ בִסְרָא אֲרֵי יְהֵי בְמַשְׁכֵּיהּ כְּוָאָה דְנוּר וּתְהֵי <b>רשֶׁם<\/b> כְּוָאָה בַּהֲרָא חַוְּרָא סַמְקָא אוֹ חַוְּרָא:", "onk_en": "When a person has on his skin a burn from a fire and [on] the healthy flesh [<b>impression<\/b>] of the burnt part, came a snow-white spot tinged with red or pure white spot.", "pj": "אוֹ בַּר נַשׁ אֲרוּם יְהֵי בְּמוֹשְׁכֵיהּ כְוָואָה דְנוּר וּתְהֵי רוֹשָׁם כְּוָואָה בַּהֲקֵי חִוְרָא סוֹמְקָא מְעַרְבִין אוֹ חִוְורָא בִּלְחוֹדָא", "pj_en": "Or if there be in a man's skin a hot burning, and in the burning wound a spot of white mixed with red, or white only;", "tj": "", "tj_en": "", "rashi": "<b>מחית המכוה.<\/b> שנימני\"ט; כְּשֶׁחָיְתָה הַמִּכְוָה הָפְכָה לְבַהֶרֶת פְּתוּכָה אוֹ לְבָנָה חֲלָקָה; וְסִימָנֵי מִכְוָה וְסִימָנֵי שְׁחִין שָׁוִים הֵם, וְלָמָּה חִלְּקָן הַכָּתוּב? לוֹמַר שֶׁאֵין מִצְטָרְפִין זֶה עִם זֶה — נוֹלַד חֲצִי גְרִיס בַּשְּׁחִין וַחֲצִי גְרִיס בַּמִּכְוָה, לֹא יִדּוֹנוּ כִגְרִיס (חולין ח'):", "rashi_en": "מחית המכוה IIEALED FLESH OF THE BURNT PART — sainement in old French The text means that when the burnt part was healed it turned into a bright spot variegated or evenly white (i.e. ‎'וכו‎‎ והיתה denotes “and the healed flesh became a white bright spot etc.”). The symptoms of cleanness or uncleanness of a burn and the symptoms of a boil are exactly similar. Why, then, has Scripture mentioned them separately (in two paragraphs, instead of saying ואדם כי יהיה בעור בשרו שחין ומכוה )? To tell us that they cannot be combined one with the other to make up the minimum size of a spot which is a symptom of leprosy — if, e. g., there develops a leprous spot the size of a half of a גריס (a גריס is a half-bean; חצי גריס is a half of this), in a boil (שחין), and one of the size of a half גריס in a burn (מכוה), they do not come under the law of a full ‎‎‏ גריס(the minimum size for an unclean spot) (Chullin 8a)."}, {"ch": 13, "v": 25, "aliyah": 4, "heb": "וְרָאָ֣ה אֹתָ֣הּ הַכֹּהֵ֡ן וְהִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּבַּהֶ֗רֶת וּמַרְאֶ֙הָ֙ עָמֹ֣ק מִן־הָע֔וֹר צָרַ֣עַת הִ֔וא בַּמִּכְוָ֖ה פָּרָ֑חָה וְטִמֵּ֤א אֹתוֹ֙ הַכֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא׃", "onk": "וְיֶחֱזֵי יָתַהּ כַּהֲנָא וְהָא אִתְהֲפִיךְ שֵׂעָר חִוָּר בְּבַהֶרְתָּא וּמֶחֱזָהָא עַמִּיק מִן מַשְׁכָּא <b>סְגִירוּתָא<\/b> הִיא בִּכְוָאָה סְגִיאָה וִיסָאֵב יָתֵיהּ כַּהֲנָא מַכְתַּשׁ <b>סְגִירוּתָא<\/b> הִיא:", "onk_en": "The <i>kohein<\/i> shall see it and behold! the hair has turned white in the snow-white spot and its appearance is deeper than the skin; it is <i>tzoraas<\/i> [<b>‘confinement’<\/b>] that has sprouted in the burn. The <i>kohein<\/i> shall declare him unclean, it is the skin-eruption of <i>tzoraas.<\/i> [<b>‘confinement’<\/b>]", "pj": "וְיֶחֱמֵי יָתָהּ כַּהֲנָא וְהָא אִתְהַפִּיךְ שְעָרָא לְמִחְוַור כְּסִידָא וְחֵיזְוֵיהּ עָמִיק לְמֵיחְוַור כְּתַלְגָא יַתִּיר מִן מַשְׁכָא סְגִירוּתָא הוּא בִּכְוָאָה סְגִיאַת וְיִסְאַב יָתֵיהּ כַּהֲנָא מַכְתַּשׁ סְגִירוּתָא הוּא", "pj_en": "the priest shall look upon it: and, behold, the hair is turned white as chalk, and its appearance is deeper than the skin becoming white as snow; it is leprosy growing in the burning spot; and the priest shall make him unclean, it is the plague of leprosy.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 26, "aliyah": 4, "heb": "וְאִ֣ם&thinsp;<b>׀<\/b> יִרְאֶ֣נָּה הַכֹּהֵ֗ן וְהִנֵּ֤ה אֵֽין־בַּבַּהֶ֙רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּשְׁפָלָ֥הֿ אֵינֶ֛נָּה מִן־הָע֖וֹר וְהִ֣וא כֵהָ֑ה וְהִסְגִּיר֥וֹ הַכֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׃", "onk": "וְאִם יֶחֱזִנַּהּ כַּהֲנָא וְהָא לֵית בְּבַהֶרְתָּא שֵׂעָר חִוָּר וּמַכִּיכָא לֵיתָהָא מִן מַשְׁכָּא וְהִיא עָמְיָא וְיַסגְּרִנֵּיהּ כַּהֲנָא שִׁבְעָא יוֹמִין:", "onk_en": "If the <i>kohein<\/i> shall see it, and behold! there is not, in the snow-white spot, any white hair and it is not lower than the skin, and it is faint. The <i>kohein<\/i> shall confine him for seven days.", "pj": "וְאִין יֶחֱמִינֵיהּ כַּהֲנָא וְהָא לֵית בִּבְהָקֵי שְעַר חִיוַור וּמַכִּיכָא לָא אִיתָא לְמִחְוַור יַתִּיר מִן מוֹשְׁכָא מְטוֹל דְהִיא עַמְיָא וְיַסְגְרִינֵיהּ כַּהֲנָא שׁוּבְעָא יוֹמִין", "pj_en": "But if the priest look on it, and, behold, the hair on the burning place be not white, and it be not deep, nor becoming whiter than the skin, though it may be dim; then the priest shall shut him up seven days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 27, "aliyah": 4, "heb": "וְרָאָ֥הוּ הַכֹּהֵ֖ן בַּיּ֣וֹם הַשְּׁבִיעִ֑י אִם־פָּשֹׂ֤ה תִפְשֶׂה֙ בָּע֔וֹר וְטִמֵּ֤א הַכֹּהֵן֙ אֹת֔וֹ נֶ֥גַע צָרַ֖עַת הִֽוא׃", "onk": "וְיֶחֱזִנֵּיהּ כַּהֲנָא בְּיוֹמָא שְׁבִיעָאָה אִם <b>אוֹסָפָא תוֹסֵף<\/b> בְּמַשְׁכָּא וִיסָאֵב כַּהֲנָא יָתֵיהּ מַכְתַּשׁ <b>סְגִירוּתָא<\/b> הִיא:", "onk_en": "The <i>kohein<\/i> shall see him on the seventh day. If it has spread [<b>increased<\/b>] in the skin, the <i>kohein<\/i> shall declare him unclean, it is the skin-eruption of <i>tzoraas.<\/i> [<b>‘confinement’<\/b>]", "pj": "וְיַחְמִינֵיהּ כַּהֲנָא בְּיוֹמָא שְׁבִיעָאָה אִין הַלְכָא תַּהֲלִיךְ פִּסְיוֹנָא בְּמוֹשְׁכָא וְיַסְאִיב כַּהֲנָא יָתֵיהּ מְטוּל דְמַכְתַּשׁ סְגִירוּתָא הוּא", "pj_en": "And the priest shall see him on the seventh day; and if it hath gone on widening in the skin, the priest shall make him unclean; it is the plague of leprosy.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 28, "aliyah": 4, "heb": "וְאִם־תַּחְתֶּ֩יהָ֩ תַעֲמֹ֨ד הַבַּהֶ֜רֶת לֹא־פָשְׂתָ֤ה בָעוֹר֙ וְהִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַמִּכְוָ֖ה הִ֑וא וְטִֽהֲרוֹ֙ הַכֹּהֵ֔ן כִּֽי־צָרֶ֥בֶת הַמִּכְוָ֖ה הִֽוא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִם בְּאַתְרָהָא קָמַת בַּהֶרְתָּא לָא <b>אוֹסֵפַת<\/b> בְּמַשְׁכָּא וְהִיא עָמְיָא <b>עֹמֶק<\/b> כְּוָאָה הִיא וִידַכִּנֵּיהּ כַּהֲנָא אֲרֵי <b>רשֶׁם<\/b> כְּוָאָה הִיא:", "onk_en": "If the snow-white spot remains in its place and it did not spread [<b>increase<\/b>] in the skin and it is faint, it is the [<b>deep<\/b>] white spot of the burn. The <i>kohein<\/i> shall declare him clean for it is [merely] the scar [<b>impression<\/b>] of the burn.", "pj": "וְאִין בְּאַתְרָהּ קָמַת בַּהֲקֵי לָא הֲלִיכַת פִּסְיָינָתָא בְּמוֹשְׁכָא וְהִיא עַמְיָא שׁוּמַת כְּוָאָה הוּא וְיַדְכְּאִינֵיהּ כַּהֲנָא אֲרוּם צוֹלְקַת כְּוָואָה הוּא", "pj_en": "*But if the inflamed spot abide in its place, and go not on to widen in the skin and it be dim (in appearance), it is a burning spot; and the priest shall make him to be clean, for it is a burning wound.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 29, "aliyah": 5, "heb": "וְאִישׁ֙ א֣וֹ אִשָּׁ֔ה כִּֽי־יִהְיֶ֥ה ב֖וֹ נָ֑גַע בְּרֹ֖אשׁ א֥וֹ בְזָקָֽן׃", "onk": "וּגְבַר אוֹ אִתְּתָא אֲרֵי יְהֵי בֵיהּ מַכְתָּשָׁא בְּרֵישָׁא אוֹ בִדְקָן:", "onk_en": "If a man or a woman will have a skin-eruption on the head or in the beard.", "pj": "וּגְבַר אוֹ אִיתָא אֲרוּם יְהֵי בֵּיה מַכְתְּשָׁא בְּרֵישׁ אוֹ בִּדְקָן", "pj_en": "And if a man or a woman have a plague upon the head, or in the beard,", "tj": "", "tj_en": "", "rashi": "<b>בראש או בזקן.<\/b> בָּא הַכָּתוּב לְחַלֵּק בֵּין נֶגַע שֶׁבִּמְקוֹם שֵׂעָר לְנֶגַע שֶׁבִּמְקוֹם בָּשָׂר, שֶׁזֶּה סִימָנוֹ בְּשֵׂעָר לָבָן וְזֶה סִימָנוֹ בְּשֵׂעָר צָהֹב:", "rashi_en": "בראש או בזקן UPON THE HEAD OR UPON THE BEARD — Scripture intends to make a difference between a plague which is on a place where hair grows and a plague which is on a place where flesh is (already mentioned v. 38) — that as regards this (that on the flesh) its symptom of uncleanness consists in white hair, and as regards the other its symptom consists in gold-coloured hair (Sifra, Braita d'Rabbi Yishmael 14)."}, {"ch": 13, "v": 30, "aliyah": 5, "heb": "וְרָאָ֨ה הַכֹּהֵ֜ן אֶת־הַנֶּ֗גַע וְהִנֵּ֤ה מַרְאֵ֙הוּ֙ עָמֹ֣ק מִן־הָע֔וֹר וּב֛וֹ שֵׂעָ֥ר צָהֹ֖ב דָּ֑ק וְטִמֵּ֨א אֹת֤וֹ הַכֹּהֵן֙ נֶ֣תֶק ה֔וּא צָרַ֧עַת הָרֹ֛אשׁ א֥וֹ הַזָּקָ֖ן הֽוּא׃", "onk": "וְיֶחֱזֵי כַהֲנָא יָת מַכְתָּשָׁא וְהָא מֶחֱזוֹהִי עַמִּיק מִן מַשְׁכָּא וּבֵיהּ שֵׂעָר <b>סֻמָּק<\/b> דַּעְדָּק וִיסָאֵב יָתֵיהּ כַּהֲנָא נִתְקָא הוּא <b>סְגִירוּת<\/b> רֵישָׁא אוֹ דִקְנָא הוּא:", "onk_en": "The <i>kohein<\/i> shall see the skin-eruption, and behold! its appearance is deeper than the skin and there is thin golden [<b>reddish<\/b>] hair in it. The <i>kohein<\/i> shall pronounce it unclean, It is a <i>nesek,<\/i> it is <i>tzoraas<\/i> [<b>‘confinement’<\/b>] of the head or the beard.", "pj": "וְיֶחֱמֵי כַּהֲנָא יַת מַכְתָּשָׁא וְהָא חֶזְוֵיהּ עַמִיק לְמִחְוַור יַתִּיר מִן מַשְׁכָא וּבֵיהּ שְעַר מְצַלְהַב כְּחֵיזוּ דְהַב דָקִיק וְיִסְאַב יָתֵיהּ כַהֲנָא נִיתְקָא הוּא סְגִירוּת רֵישָׁא אוֹ דִיקְנָא הוּא", "pj_en": "the priest shall look upon the plague; and, behold, if the appearance is deeper and whiter than the skin, and yellow hair be in it, in sight like a thin thread of gold, the priest shall make him unclean; it is a scurvy, a leprosy in the head or the beard.", "tj": "", "tj_en": "", "rashi": "<b>ובו שער צהב.<\/b> שֶׁנֶּהְפַּךְ שֵׂעָר שָׁחֹר שֶׁבּוֹ לְצָהֹב:<br><br><b>נתק הוא.<\/b> כָּךְ שְׁמוֹ שֶׁל נֶגַע שֶׁבִּמְקוֹם שֵׂעָר:", "rashi_en": "ובו שער צהוב AND THERE BE IN IT A GOLD-COLOURED HAIR — This means that the black hair that was in it has turned into gold-coloured (cf. Rashi on v. 3). <br><br>נתק הוא — this (נתק) is the name of a plague which is on the spot where hair grows."}, {"ch": 13, "v": 31, "aliyah": 5, "heb": "וְכִֽי־יִרְאֶ֨ה הַכֹּהֵ֜ן אֶת־נֶ֣גַע הַנֶּ֗תֶק וְהִנֵּ֤ה אֵין־מַרְאֵ֙הוּ֙ עָמֹ֣ק מִן־הָע֔וֹר וְשֵׂעָ֥ר שָׁחֹ֖ר אֵ֣ין בּ֑וֹ וְהִסְגִּ֧יר הַכֹּהֵ֛ן אֶת־נֶ֥גַע הַנֶּ֖תֶק שִׁבְעַ֥ת יָמִֽים׃", "onk": "וַאֲרֵי יֶחֱזֵי כַהֲנָא יָת מַכְתַּשׁ נִתְקָא וְהָא לֵית מֶחֱזוֹהִי עַמִּיק מִן מַשְׁכָּא וְשֵׂעָר אֻכָּם לֵית בֵּיהּ וְיַסְגַּר כַּהֲנָא יָת מַכְתַּשׁ נִתְקָא שִׁבְעַת יוֹמִין:", "onk_en": "When the <i>kohein<\/i> will see the skin eruption of <i>nesek<\/i>—and behold! it does not appear deeper than the skin and there is no black hair in it, the <i>kohein<\/i> shall confine [the one affected by] the skin-eruption of the <i>nesek<\/i> for seven days.", "pj": "וַאֲרוּם יֶחְמֵי כַּהֲנָא יַת מַכְתַּשׁ נִיתְקָא וְהָא לֵית חֵיזְוֵיהּ עַמִיק לְמִחְוַר יַתִּיר מִן מַשְׁכָא וּשְעַר אוּכַם לֵית בֵּיהּ וְיַסְגֵר כַּהֲנָא יַת מַכְתַּשׁ נִיתְקָא שׁוּבְעָא יוֹמִין", "pj_en": "But if the priest view the scurfed plague, and, behold, if the appearance of it be not deeper nor whiter than the skin, and there be no black hair in it, the priest shall shut up him who hath the scurfed plague seven days.", "tj": "", "tj_en": "", "rashi": "<b>ושער שחר אין בו.<\/b> הָא אִם הָיָה בוֹ שֵׂעָר שָׁחֹר טָהוֹר וְאֵין צָרִיךְ לְהֶסְגֵּר, שֶׁהַשֵּׂעָר שָׁחֹר סִימָן טָהֳרָה הוּא בִנְתָקִים, כְּמוֹ שֶׁנֶּאֱמַר (פסוק ל\"ז), וְשֵׂעָר שָׁחֹר צָמַח בּוֹ וְגוֹ':", "rashi_en": "ושער שחור אין בו AND THERE IS NO BLACK HAIR IN IT [THE PRIEST SHALL SHUT HIM UP] — Consequently, if there is black hair in it, he is clean, and does not require to be shut up — for black hair is a characteristic of cleanness in cases of נתקים, as it is stated, (v. 37) “if there is black hair grown up in it … [he is clean]” (Sifra, Tazria Parashat Nega'im, Chapter 8 9)."}, {"ch": 13, "v": 32, "aliyah": 5, "heb": "וְרָאָ֨ה הַכֹּהֵ֣ן אֶת־הַנֶּ֘גַע֮ בַּיּ֣וֹם הַשְּׁבִיעִי֒ וְהִנֵּה֙ לֹא־פָשָׂ֣ה הַנֶּ֔תֶק וְלֹא־הָ֥יָה ב֖וֹ שֵׂעָ֣ר צָהֹ֑ב וּמַרְאֵ֣ה הַנֶּ֔תֶק אֵ֥ין עָמֹ֖ק מִן־הָעֽוֹר׃", "onk": "וְיֶחֱזֵי כַהֲנָא יָת מַכְתָּשָׁא בְּיוֹמָא שְׁבִיעָאָה וְהָא לָא <b>אוֹסֵף<\/b> נִתְקָא וְלָא הֲוָה בֵיהּ שֵׂעָר <b>סֻמָּק<\/b> וּמֶחֱזֵי נִתְקָא לֵית עַמִּיק מִן מַשְׁכָּא:", "onk_en": "The <i>kohein<\/i> shall see the skin-eruption on the seventh day, and behold! the <i>nesek<\/i> did not spread [<b>increase<\/b>] and there was no golden [<b>reddish<\/b>] hair in it and the appearance of the <i>nesek<\/i> is not deeper than the skin.", "pj": "וְיֶחְמֵי כַּהֲנָא יַת מַכְתָּשָׁא בְּיוֹמָא שְׁבִיעָאָה וְהָא לָא הֲלִיךְ פִּסְיוֹן מַכְתָּשָׁא וְלָא הֲוָה בֵיהּ שְעַר מְצַלְהַב כְּחֵיזוּ דְהַב וְחֵיזְוֵי נִיתְקָא לֵית עַמִיק יַתִּיר מִן מַשְׁכָא", "pj_en": "And the priest on the seventh day shall look upon the plague; and, behold, if the plague hath not gone on in breadth, and no yellow hair like gold be in it, and the appearance of the scurf is not deeper than the skin,", "tj": "", "tj_en": "", "rashi": "<b>והנה לא פשה וגו'.<\/b> הָא אִם פָּשָׂה אוֹ הָיָה בוֹ שֵׂעָר צָהֹב טָמֵא:", "rashi_en": "'והנה לא פשה וגו‏‎‎‎ AND BEHOLD IF [THE SCAB] SPREAD NOT etc. — Consequently, if it spreads or there is in it gold-coloured hair it is unclean."}, {"ch": 13, "v": 33, "aliyah": 5, "heb": "וְהִ֨תְ<big>גַּ<\/big>לָּ֔ח וְאֶת־הַנֶּ֖תֶק לֹ֣א יְגַלֵּ֑חַ וְהִסְגִּ֨יר הַכֹּהֵ֧ן אֶת־הַנֶּ֛תֶק שִׁבְעַ֥ת יָמִ֖ים שֵׁנִֽית׃", "onk": "<b>וִיגַלַּח סָחֳרָנֵי נִתְקָא וּדְעִם<\/b> נִתְקָא לָא יְגַלַּח וְיַסְגַּר כַּהֲנָא יָת נִתְקָא שִׁבְעָא יוֹמִין תִּנְיָנוּת:", "onk_en": "He shall be shaved [<b>shave around the nesek<\/b>] but he shall not shave [<b>close to<\/b>] the <i>nesek,<\/i> and the <i>kohein<\/i> shall confine the <i>nesek<\/i> for a second seven day period.", "pj": "וִיסַפֵּר יַת שַעֲרָא דְחַזְרָנוּת נִיתְקָא בְּרַם דְעִם נִיתְקָא לָא יַסְפֵּר וְיַסְגֵר כַּהֲנָא יַת נִיתְקָא שַׁבְעָא יוֹמִין", "pj_en": "he shall cut away the hair which surrounds the scar, but the scurfed part he must not shave; and the priest shall shut him who hath the scurf, seven days.", "tj": "", "tj_en": "", "rashi": "<b>והתגלח.<\/b> סְבִיבוֹת הַנֶּתֶק,<br><br><b>ואת הנתק לא יגלח.<\/b> מַנִּיחַ שְׁתֵּי שְׂעָרוֹת סָמוּךְ לוֹ סָבִיב, כְּדֵי שֶׁיְּהֵא נִכָּר אִם פָּשָׂה, שֶׁאִם יִפְשֶׂה יַעֲבֹר הַשְּׂעָרוֹת וְיֵצֵא לִמְקוֹם הַגִּלּוּחַ (נגעים פ\"י, ספרא):", "rashi_en": "והתגלח AND HE SHALL CUT HIS HAIR around the scall,<br><br>ואת הנתק לא יגלח BUT THE SCALL ITSELF HE SHALL NOT CUT THE HAIR OF — this means that he leaves a row of two hairs quite close to it around it in order that it may become discernible if it (the scall) spreads, for if it spreads it passes the hair and will extend to the spot where the hair has been cut off (Mishnah Negaim 10:5; Sifra, Tazria Parashat Nega'im, Chapter 9 7)."}, {"ch": 13, "v": 34, "aliyah": 5, "heb": "וְרָאָה֩ הַכֹּהֵ֨ן אֶת־הַנֶּ֜תֶק בַּיּ֣וֹם הַשְּׁבִיעִ֗י וְ֠הִנֵּ֠ה לֹא־פָשָׂ֤ה הַנֶּ֙תֶק֙ בָּע֔וֹר וּמַרְאֵ֕הוּ אֵינֶ֥נּוּ עָמֹ֖ק מִן־הָע֑וֹר וְטִהַ֤ר אֹתוֹ֙ הַכֹּהֵ֔ן וְכִבֶּ֥ס בְּגָדָ֖יו וְטָהֵֽר׃", "onk": "וְיֶחֱזֵי כַהֲנָא יָת נִתְקָא בְּיוֹמָא שְׁבִיעָאָה וְהָא לָא <b>אוֹסֵף<\/b> נִתְקָא בְּמַשְׁכָּא וּמֶחֱזוֹהִי לֵיתוֹהִי עַמִּיק מִן מַשְׁכָּא וִידַכֵּי יָתֵיהּ כַּהֲנָא וִיצַבַּע לְבוּשׁוֹהִי וְיִדְכֵּי:", "onk_en": "The <i>kohein<\/i> shall see the <i>nesek<\/i> on the seventh day and behold! if the <i>nesek<\/i> did not spread [<b>increase<\/b>] in the skin and its appearance is not deeper than the skin. The <i>kohein<\/i> shall declare him clean. He shall wash his garments and he will be clean.", "pj": "וְיֶחֱמֵי כַּהֲנָא יַת נִיתְקָא בְּיוֹמָא שְׁבִיעָאָה וְהָא לָא הֲלִיךְ פִּסְיוֹן נִיתְקָא בְּמַשְׁכָא וְחֵיזְוֵי לֵיתוֹי עַמִיק לְמֶחְוַור יַתִּיר מִן מַשְׁכָא וְיִדְכֵּי יָתֵיהּ כַּהֲנָא וְיִצְבַּע לְבוּשׁוֹי וְיִדְכֵּי", "pj_en": "Then shall the priest look upon the scurf on the seventh day; and, behold, if the scar hath not gone on in breadth in the skin, and its appearance is not deeper nor becoming whiter than the skin, the priest shall make him to be clean; and he shall wash his clothes and be clean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 35, "aliyah": 5, "heb": "וְאִם־פָּשֹׂ֥ה יִפְשֶׂ֛ה הַנֶּ֖תֶק בָּע֑וֹר אַחֲרֵ֖י טׇהֳרָתֽוֹ׃", "onk": "וְאִם <b>אוֹסָפָא יוֹסֵף<\/b> נִתְקָא בְּמַשְׁכָּא בָּתַר דָּכוּתֵיהּ:", "onk_en": "If the <i>nesek<\/i> spreads [<b>increases<\/b>] [extensively] in the skin after he is pronounced clean,", "pj": "וְאִין הֲלִיךְ תִּתְהַלֵךְ פִּסְיוֹנָא דְנִיתְקָא בְּמַשְׁכָא בָּתַר דְכוּתֵיהּ", "pj_en": "But should the breadth of the scar go on in the skin after his purification,", "tj": "", "tj_en": "", "rashi": "<b>אחרי טהרתו.<\/b> אֵין לִי אֶלָּא פוֹשֶׂה לְאַחַר הַפְּטוֹר, מִנַּיִן אַף בְּסוֹף שָׁבוּעַ רִאשׁוֹן וּבְסוֹף שָׁבוּעַ שֵׁנִי? תַּלְמוּד לוֹמַר פָּשֹׂה יִפְשֶׂה (ספרא):", "rashi_en": "אחרי טהרתו [AND IF THE SCALL SPREADS AT ALL …] AFTER HIS BEING PRONOUNCED CLEAN — I have here only the statement that he is unclean if it spreads after he has been freed from the quarantine; whence do I know that the same applies if it has spread by the end of the first week and or by the end of the second week? Because it states here: “if it spreads at all” (Sifra, Tazria Parashat Nega'im, Chapter 9 9)."}, {"ch": 13, "v": 36, "aliyah": 5, "heb": "וְרָאָ֙הוּ֙ הַכֹּהֵ֔ן וְהִנֵּ֛ה פָּשָׂ֥ה הַנֶּ֖תֶק בָּע֑וֹר לֹֽא־יְבַקֵּ֧ר הַכֹּהֵ֛ן לַשֵּׂעָ֥ר הַצָּהֹ֖ב טָמֵ֥א הֽוּא׃", "onk": "וְיֶחֱזִנֵּיהּ כַּהֲנָא וְהָא <b>אוֹסֵף<\/b> נִתְקָא בְּמַשְׁכָּא לָא יְבַקֵּר כַּהֲנָא לְשֵׂעָר <b>סֻמָּק<\/b> מְסָאָב הוּא:", "onk_en": "the <i>kohein<\/i> shall see him and behold! the <i>nesek<\/i> has spread [<b>increased<\/b>] in the skin. The <i>kohein<\/i> shall not [even] look for golden [<b>reddish<\/b>] hair, he is unclean.", "pj": "וְיֶחְמִינֵיהּ כַּהֲנָא וְהָא הֲלִיךְ פִּסְיוֹן נִתְקָא בְּמַשְׁכָא לָא יְפַשְׁפֵּשׁ כַּהֲנָא לְשֵעָר מְצַלְהַב מְטוּל דִמְסָאָב הוּא", "pj_en": "the priest shall inspect it: and, behold, if the breadth hath increased, the priest need not look narrowly after the yellow hair; for he is unclean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 37, "aliyah": 5, "heb": "וְאִם־בְּעֵינָיו֩ עָמַ֨ד הַנֶּ֜תֶק וְשֵׂעָ֨ר שָׁחֹ֧ר צָֽמַח־בּ֛וֹ נִרְפָּ֥א הַנֶּ֖תֶק טָה֣וֹר ה֑וּא וְטִהֲר֖וֹ הַכֹּהֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִם כַּד הֲוָה קָם נִתְקָא וְשֵׂעָר אֻכָּם צְמַח בֵּיהּ אִתַּסִּי נִתְקָא דְּכֵי הוּא וִידַכִּנֵּיהּ כַּהֲנָא:", "onk_en": "If the <i>nesek<\/i> remained the same as it was and black hair grew in it, the <i>nesek<\/i> is healed, he is clean, and the <i>kohein<\/i> shall declare him clean.", "pj": "וְאִם כַּד הֲוָה קָם נִיתְקָא וּשְעַר אוּכָם צָמַח בֵּיהּ אִיתְסֵי נִיתְקָא דְכֵי הוּא וְיַדְכִּינֵיהּ כַּהֲנָא", "pj_en": "But if the scar abideth, (without widening,) and black hair hath sprung up in it, the scar hath healed; he is clean, and the priest shall make him to be clean.", "tj": "", "tj_en": "", "rashi": "<b>ושער שחר.<\/b> מִנַּיִן אַף הַיָּרֹק וְהָאָדֹם, שֶׁאֵינוֹ צָהֹב? תַּלְמוּד לוֹמַר \"וְשֵׂעָר\"; וּלְשׁוֹן צָהֹב דּוֹמֶה לְתַבְנִית הַזָּהָב — צָהֹב כְּמוֹ זָהֹב, אור\"פלא בְּלַעַז:<br><br><b>טהור הוא וטהרו הכהן.<\/b> הָא טָמֵא שֶׁטִּהֲרוֹ הַכֹּהֵן לֹא טָהוֹר:", "rashi_en": "ושער שחור AND [THERE BE] BLACK HAIR — Whence do I know that this applies also to yellow or reddish hair which also, like black hair here mentioned, are not gold-coloured? Because it states ושער “and hair” (whatever its colour may be) (Sifra, Tazria Parashat Nega'im, Chapter 9 14). The expression צָהוֹב denotes anything like the appearance of gold, and צהוב is equivalent to זהוב, orpàle in old French (English = pale gold). <br><br>טהור הוא וטהרו הכהן HE IS CLEAN AND THE PRIEST SHALL PRONOUNCE HIM CLEAN — Consequently a person who is really unclean whom the priest pronounces clean is not clean. [It is true that the declaration is left to the priest — as pointed out by Rashi on v. 2 — but if he erred or willfully pronounced the unclean person clean it is of no effect for Scripture states: he is clean and the priest then — and then only — shall pronounce him clean] (Sifra, Tazria Parashat Nega'im, Chapter 9 16)."}, {"ch": 13, "v": 38, "aliyah": 5, "heb": "וְאִישׁ֙ אֽוֹ־אִשָּׁ֔ה כִּֽי־יִהְיֶ֥ה בְעוֹר־בְּשָׂרָ֖ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת׃", "onk": "וּגְבַר אוֹ אִתְּתָא אֲרֵי יְהֵי בִמְשַׁךְ בִּסְרְהוֹן בַּהֲרָן בַּהֲרָן חַוְּרָן:", "onk_en": "When a man or a woman have in the skin of their flesh—white spots.", "pj": "וּגְבַר אוֹ אִיתָא אֲרוּם יְהֵי בִמְשׁוֹךְ בִּישְרֵיהוֹן בַּהֲקֵי בַּהֲקֵי חִוְורָן", "pj_en": "And if a man or a woman have in the skin of their flesh bright white spots,", "tj": "", "tj_en": "", "rashi": "<b>בהרת.<\/b> חֲבַרְבּוּרוֹת:", "rashi_en": "בהרות are SPOTS."}, {"ch": 13, "v": 39, "aliyah": 5, "heb": "וְרָאָ֣ה הַכֹּהֵ֗ן וְהִנֵּ֧ה בְעוֹר־בְּשָׂרָ֛ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּע֖וֹר טָה֥וֹר הֽוּא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיֶחֱזֵי כַהֲנָא וְהָא בִמְשַׁךְ בִּסְרְהוֹן בַּהֲרָן עָמְיָן חַוְּרָן בָּהֲקָא הוּא סָגֵי בְמַשְׁכָּא דְּכֵי הוּא:", "onk_en": "The <i>kohein<\/i> shall see, and behold! in the skin of their flesh are dim white spots, it is [merely] scurf that has sprouted in the skin; it is clean.", "pj": "וְיֶחֱמֵי כַּהֲנָא וְהָא בִמְשׁוֹךְ בִּישְרֵיהוֹן בַּהֲקֵי עַמְיַין חִוְורָן צַחַר הוּא סַגֵי בְּמַשְׁכָא דְכֵי הוּא", "pj_en": "the priest shall look, and, behold, if the spots in the skin of their flesh are a greyish white, it is a bright freckle growing in the skin; he is clean.", "tj": "", "tj_en": "", "rashi": "<b>כהות לבנת.<\/b> שֶׁאֵין לֹבֶן שֶׁלָּהֶן עַז אֶלָּא כּוֹהֶה:<br><br><b>בהק.<\/b> כְּמוֹ לֹבֶן הַנִּרְאֶה בִּבְשַׂר אָדָם אָדֹם, שֶׁקּוֹרִין רוש\"ו, בֵּין חֲבַרְבּוּרוֹת אַדְמִימוּתוֹ, קָרוּי בֹּהַק, כְּאִישׁ עַדְשָׁן שֶׁבֵּין עֲדָשָׁה לַעֲדָשָׁה מַבְהִיק הַבָּשָֹר בְּלֹבֶן צַח:", "rashi_en": "כהות לבנות DULL WHITE — It means that their whiteness is not intense but a dull white.<br><br>בהק A BRIGHTNESS — just like the white which shows itself in the flesh of a ruddy man, who is termed rouge in old French, between his red spots: this is called בהק “brightness” — like a man who is covered with lentil-like spots, when between one lentil-like spot and another the flesh shows bright with a pure brightness."}, {"ch": 13, "v": 40, "aliyah": 6, "heb": "וְאִ֕ישׁ כִּ֥י יִמָּרֵ֖ט רֹאשׁ֑וֹ קֵרֵ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃", "onk": "וּגְבַר אֲרֵי יַתַּר שְׂעַר רֵישֵׁיהּ קְרַח הוּא דְּכֵי הוּא:", "onk_en": "If a mans hair falls out, he is [merely] bald; he is clean.", "pj": "וּגְבַר אֲרוּם יִתַּר שְעַר רֵישֵׁיהּ קְרוּחַ הוּא דְכֵי הוּא", "pj_en": "And if a man's hair fall off from his head, he is bald, but he is clean.", "tj": "", "tj_en": "", "rashi": "<b>קרח הוא טהור הוא.<\/b> טָהוֹר מִטֻּמְאַת נְתָקִין, שֶׁאֵינוֹ נִדּוֹן בְּסִימָנֵי רֹאשׁ וְזָקָן שֶׁהֵם מְקוֹם שֵׂעָר, אֶלָּא בְסִימָנֵי נֶגַע עוֹר בָּשָׂר — (בְּשֵֹעָר לָבָן) וּמִחְיָה וּפִשְׂיוֹן (נגעים פ\"י):", "rashi_en": "קרח הוא טהור הוא HE IS BALD, HE IS CLEAN — clean from the uncleanness of נתק (a scall in a hairy spot) (Sifra, Braita d'Rabbi Yishmael 15), for he is not subject to the law about the symptoms of the head or the beard, which are places where hair grows, but to that about the symptoms of a plague on the skin of the flesh — [white hair], healthy flesh or the spreading of the plague."}, {"ch": 13, "v": 41, "aliyah": 6, "heb": "וְאִם֙ מִפְּאַ֣ת פָּנָ֔יו יִמָּרֵ֖ט רֹאשׁ֑וֹ גִּבֵּ֥חַ ה֖וּא טָה֥וֹר הֽוּא׃", "onk": "וְאִם מִלָּקֳבֵל אֲפּוֹהִי יַתַּר שְׂעַר רֵישֵׁיהּ גְּלוֹשׁ הוּא דְּכֵי הוּא:", "onk_en": "If, on the front of his head his hair falls out, he is [merely] frontally bald; he is clean.", "pj": "וְאִין מִקְבֵל אַנְפּוֹי יִתַּר שְעַר רֵישֵׁיהּ גִלְשַׁלְשָׁן הוּא דְכֵי הוּא", "pj_en": "And if the hair fall away from the brow of his face, he is partly bald, but he is clean.", "tj": "", "tj_en": "", "rashi": "<b>ואם מפאת פניו.<\/b> מִשִּׁפּוּעַ קָדְקֹד כְּלַפֵּי פָנָיו קָרוּי גַּבַּחַת — וְאַף הַצְּדָעִין שֶׁמִּכָּאן וּמִכָּאן בִּכְלָל — וּמִשִּׁפּוּעַ קָדְקֹד כְּלַפֵּי אֲחוֹרָיו קָרוּי קָרַחַת:", "rashi_en": "ואם מפאת בניו AND IF FROM THE CORNER OF HIS FACE [THERE FALLS OFF THE HAIR OF HIS HEAD] — The area from the slope of one’s skull in the direction of the face is called גבחת (and that explains why the man suffering from such a malady is here called גבח) — and the temples on both sides are also included; and the area from the slope of one’s skull in the direction of the back of his head is termed קרחת (hence the term קרח in v. 40) (Sifra, Tazria Parashat Nega'im, Chapter 10 7)."}, {"ch": 13, "v": 42, "aliyah": 6, "heb": "וְכִֽי־יִהְיֶ֤ה בַקָּרַ֙חַת֙ א֣וֹ בַגַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֙חַת֙ הִ֔וא בְּקָרַחְתּ֖וֹ א֥וֹ בְגַבַּחְתּֽוֹ׃", "onk": "וַאֲרֵי יְהֵי בְקָרָחוּתֵיהּ אוֹ בִגְלוֹשׁוּתֵיהּ מַכְתַּשׁ חִוָּר סַמּוֹק <b>סְגִירוּת<\/b> סָגְיָא הִיא בְּקָרָחוּתֵיהּ אוֹ בִגְלוֹשׁוּתֵיהּ:", "onk_en": "If there will be, in the baldness in back of the head or in the baldness in front of the h
