ְאִשְׁתַּטָּחִית בִּצְלוֹ אֲרוּם אֲמַר יְיָ לִמְשֵׁצְיָא יַתְכוֹן", "pj_en": "And I bowed down in prayer before the Lord for the forty days and nights in which I was prostrate in supplication, because the Lord had said He was about to destroy you.", "tj": "", "tj_en": "", "rashi": "<b>ואתנפל וגו'.<\/b> אֵלּוּ הֵן עַצְמָם הָאֲמוּרִים לְמַעְלָה, וּכְפָלָן כָּאן, לְפִי שֶׁכָּתוּב כָּאן סֵדֶר תְּפִלָּתוֹ, שֶׁנֶּאֱמַר <b>ה' אלהים אל תשחת עמך וגו'<\/b>:", "rashi_en": "ואתנפל וגו׳ AND I FELL DOWN [BEFORE THE LORD … THE FORTY DAYS … WHICH I HAD FALLEN DOWN] — These are the very same forty days mentioned above (v. 18), and it mentions them a second time here, because there is written here (in the next verse) the wording of his prayer, as it is said, “O Lord God, destroy not thy people, etc.”."}, {"ch": 9, "v": 26, "aliyah": 3, "heb": "וָאֶתְפַּלֵּ֣ל אֶל־יְהֹוָה֮ וָאֹמַר֒ אֲדֹנָ֣י יֱהֹוִ֗ה אַל־תַּשְׁחֵ֤ת עַמְּךָ֙ וְנַחֲלָ֣תְךָ֔ אֲשֶׁ֥ר פָּדִ֖יתָ בְּגׇדְלֶ֑ךָ אֲשֶׁר־הוֹצֵ֥אתָ מִמִּצְרַ֖יִם בְּיָ֥ד חֲזָקָֽה׃", "onk": "וְצַלֵּיתִי קֳדָם יְיָ וַאֲמָרִית יְיָ אֱלָהִים לָא תְחַבַּל עַמָּךְ וְאַחֲסַנְתָּךְ דִּי פְרַקְתָּא בְּתָקְפָּךְ דִּי אַפֶּקְתָּא מִמִּצְרַיִם בִּידָא תַקִּיפָא:", "onk_en": "I prayed to Adonoy and said, ‘‘Adonoy, God, do not harm Your people and Your territory that You redeemed with Your power, whom You took out of Egypt with a powerful hand.", "pj": "וּצְלִיַּית קֳדָם יְיָ וַאֲמָרִית בְּבָעוּ בְּרַחֲמִין קֳדָמָךְ יְיָ אֱלהִים לָא תְחַבֵּל עַמָּךְ וְאַחֲסַנְתָּךְ דִּי פְרַקְתָּא בְּתוּקְפָךְ דִּי אַפֵּיקְתָּא מִמִּצְרַיִם בִּגְבוּרַת אִידָא תַקִּיפְתָּא", "pj_en": "And I prayed before the Lord, and said: I implore mercy before Thee, O Lord God, that Thou wouldst not destroy Thy people and Thy heritage which Thou hast redeemed by Thy power, and led forth from Mizraim by the strength of Thy mighty hand.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 27, "aliyah": 3, "heb": "זְכֹר֙ לַעֲבָדֶ֔יךָ לְאַבְרָהָ֥ם לְיִצְחָ֖ק וּֽלְיַעֲקֹ֑ב אַל־תֵּ֗פֶן אֶל־קְשִׁי֙ הָעָ֣ם הַזֶּ֔ה וְאֶל־רִשְׁע֖וֹ וְאֶל־חַטָּאתֽוֹ׃", "onk": "אִדְּכַר לְעַבְדָּיךְ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב לָא תִתְפְּנֵי לְקַשְׁיוּת עַמָּא הָדֵין וּלְחוֹבֵיהוֹן וְלַחֲטָאֵיהוֹן:", "onk_en": "Recall Your servants—Avrohom, Yitzchok, and Yaakov; do not pay attention to the stubborness of this people, to its wickedness, and to its sin.", "pj": "הֲוֵי דְכִיר לְעַבְדָּךְ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב וְלָא תִסְתַּכֵּל לְקַשְׁיוּת לֵב עַמָּא הָדֵין לְרִישְׁעֵיהוֹן וּלְסוּרְחָנוּתְהוּן", "pj_en": "Remember Thy servants Abraham, Izhak, and Jakob, nor regard Thou the hard heart of this people, nor their wickedness, nor their sin:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 28, "aliyah": 3, "heb": "פֶּן־יֹאמְר֗וּ הָאָ֘רֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣נוּ מִשָּׁם֒ מִבְּלִי֙ יְכֹ֣לֶת יְהֹוָ֔ה לַהֲבִיאָ֕ם אֶל־הָאָ֖רֶץ אֲשֶׁר־דִּבֶּ֣ר לָהֶ֑ם וּמִשִּׂנְאָת֣וֹ אוֹתָ֔ם הוֹצִיאָ֖ם לַהֲמִתָ֥ם בַּמִּדְבָּֽר׃", "onk": "דִּילְמָא יֵימְרוּן דָּיְרֵי אַרְעָא דִּי אַפֶּקְתָּנָא מִתַּמָּן מִדְּלֵית יוּכְלָא דַיְיָ <b>לְאָעָלֻתְהוֹן<\/b> לְאַרְעָא דִּי מַלִּיל לְהוֹן וּמִדְּסָנֵי יָתְהוֹן אַפֵּקִנּוּן לְקַטָּלוּתְהוֹן בְּמַדְבְּרָא:", "onk_en": "Lest [the inhabitants] say—[of] the land that you took us out of—‘Because of Adonony’s inability to bring them [<b>up<\/b>] to the land that He promised for them, and because of His hatred of them, He took them out to kill them in the wilderness.’", "pj": "דִּילְמָא יֵימְרוּן דַּיְירֵי אַרְעָא דְאַפֵּקְתָּנָא מִתַּמָּן מִדְאִיתְתִישׁ חֵילָא מִן קֳדָם יְיָ לְאַעֲלוּתְהוֹן לְאַרְעָא דְמַלֵּיל לְהוֹן וּמִדְסָנֵי יַתְהוֹן אַפֵּיקִינוּן לְקַטְלוּתְהוֹן בְּמַדְבְּרָא", "pj_en": "lest the inhabitants of the land from whence Thou hast led us say, that power failed before the Lord to bring them into the land of which Thou hast told them, and that because Thou didst hate them, therefore didst Thou lead them out to kill them in the wilderness.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 29, "aliyah": 3, "heb": "וְהֵ֥ם עַמְּךָ֖ וְנַחֲלָתֶ֑ךָ אֲשֶׁ֤ר הוֹצֵ֙אתָ֙ בְּכֹחֲךָ֣ הַגָּדֹ֔ל וּבִֽזְרֹעֲךָ֖ הַנְּטוּיָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִנּוּן עַמָּךְ וְאַחֲסַנְתָּךְ דִּי אַפֶּקְתָּא בְּחֵילָךְ רַבָּא וּבִדְרָעָךְ מְרָמְמָא:", "onk_en": "But they are Your people, Your territory, whom You took out with Your great power and with Your extended arm.’’", "pj": "וְהִינוּן עַמָּךְ וְאַחְסַנְתָּךְ דְּאַפֵּיקְתָּא בְּחֵילָךְ רַבָּא וּבִדְרָעָךְ מְרַמְמָא", "pj_en": "But they are Thy people and Thy heritage, whom Thou didst bring out by Thy great power, and with Thy uplifted arm.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 1, "aliyah": 4, "heb": "בָּעֵ֨ת הַהִ֜וא אָמַ֧ר יְהֹוָ֣ה אֵלַ֗י פְּסׇל־לְךָ֞ שְׁנֵֽי־לוּחֹ֤ת אֲבָנִים֙ כָּרִ֣אשֹׁנִ֔ים וַעֲלֵ֥ה אֵלַ֖י הָהָ֑רָה וְעָשִׂ֥יתָ לְּךָ֖ אֲר֥וֹן עֵֽץ׃", "onk": "בְּעִדָּנָא הַהִיא אֲמַר יְיָ לִי פְּסַל לָךְ תְּרֵין לוּחֵי אַבְנַיָּא כְּקַדְמָאֵי וְסַק <b>לָקֳדָמַי<\/b> לְטוּרָא וְתַעְבֵּד לָךְ אֲרוֹנָא דְאָעָא:", "onk_en": "At that time, Adonoy said to me, ‘‘Hew for yourself two stone tablets like the originals, and ascend to [<b>before<\/b>] Me on the mountain; and make for yourself a wooden case.", "pj": "בְּעִידָנָא הַהוּא אָמַר יְיָ לִי פְּסָל לָךְ תְּרֵי לוּחֵי מַרְמִירָא כְּצוּרַתְהוֹן דְּקַמָּאֵי וְסוּק לִקְדָמַי לְטַוְורָא וְעִיבַד לָךְ אֲרוֹנָא דְקֵיסָא", "pj_en": "At that time did the Lord say to me: Hew thee two tables of marble according to the form of the first; and ascend before Me into the mountain, and make thee an ark of wood.", "tj": "", "tj_en": "", "rashi": "<b>בעת ההוא.<\/b> לְסוֹף אַרְבָּעִים יוֹם נִתְרַצָּה לִי וְאָמַר לִי <b>פסל לך<\/b>, וְאַחַר כָּךְ <b>ועשית לך ארון<\/b>, וַאֲנִי עָשִׂיתִי אָרוֹן תְּחִלָּה, שֶׁכְּשֶׁאָבֹא וְהַלּוּחוֹת בְּיָדִי הֵיכָן אֶתְּנֵם? וְלֹא זֶה הוּא הָאָרוֹן שֶׁעָשָׂה בְצַלְאֵל, שֶׁהֲרֵי מִשְׁכָּן לֹא נִתְעַסְּקוּ בוֹ עַד לְאַחַר יוֹם הַכִּפּוּרִים, כִּי בְּרִדְתּוֹ מִן הָהָר צִוָּה לָהֶם עַל מְלֶאכֶת הַמִּשְׁכָּן, וּבְצַלְאֵל עָשָׂה מִשְׁכָּן תְּחִלָּה וְאַחַר כָּךְ אָרוֹן וְכֵלִים, נִמְצָא זֶה אָרוֹן אַחֵר הָיָה, וְזֶהוּ שֶׁהָיָה יוֹצֵא עִמָּהֶם לַמִּלְחָמָה, וְאוֹתוֹ שֶׁעָשָׂה בְצַלְאֵל לֹא יָצָא לַמִּלְחָמָה, אֶלָּא בִּימֵי עֵלִי, וְנֶעֶנְשׁוּ עָלָיו וְנִשְׁבָּה (תלמוד ירושלמי שקלים ו):", "rashi_en": "בעת ההוא AT THAT TIME — At the end of forty days He was reconciled with me and said to me, פסל לך HEW FOR THYSELF [TWO TABLETS] and afterwards, ועשית לך ארון עץ MAKE THEE AN ARK OF WOOD. I, however, (see v. 3) made the Ark first (Midrash Tanchuma, Eikev 1), because when I came with the tablets in my hand where could I place them? Now this was not the Ark which Bezaleel made for the Tabernacle, because with the Tabernacle they did not occupy themselves until after the Day of Atonement, for only when he came down from the mountain on that day did he give them the command regarding the construction of the Tabernacle, and Bezaleel made the Tabernacle first and afterwards the Ark and the other articles (Berakhot 55a). It follows, therefore, that this was another Ark; and it was this, that went forth with them to battle, whilst that which Bezaleel made went forth to battle only once, in the days of Eli — and they were punished for this, for it was captured by the Philistines (cf. Jerusalem Talmud Shekalim 6:1)."}, {"ch": 10, "v": 2, "aliyah": 4, "heb": "וְאֶכְתֹּב֙ עַל־הַלֻּחֹ֔ת אֶ֨ת־הַדְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל־הַלֻּחֹ֥ת הָרִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְשַׂמְתָּ֖ם בָּאָרֽוֹן׃", "onk": "וְאֶכְתּוֹב עַל לוּחַיָּא יָת פִּתְגָּמַיָּא דִּי הֲווֹ עַל לוּחַיָּא קַדְמָאֵי דִּי תְבַרְתָּא וּתְשַׁוִּנּוּן בַּאֲרוֹנָא:", "onk_en": "And I will write on the tablets the words that were on the original tablets that you smashed, and you will place them in the case.’’", "pj": "וְאֶכְתּוֹב עַל לוּחַיָא יַת פִּתְגָמַיָא דַהֲווֹ עַל לוּחַיָא קַמָּאֵי דְיַיתְשַׁר חֵילָךְ דִּתְבַרְתִּינוּן וּתְשַׁוִּינוּן בָּאֲרוֹנָא", "pj_en": "And I will write upon the tables the words which were upon the former ones, which thou didst break with thy entire strength; and thou shalt put them within the ark.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 3, "aliyah": 4, "heb": "וָאַ֤עַשׂ אֲרוֹן֙ עֲצֵ֣י שִׁטִּ֔ים וָאֶפְסֹ֛ל שְׁנֵי־לֻחֹ֥ת אֲבָנִ֖ים כָּרִאשֹׁנִ֑ים וָאַ֣עַל הָהָ֔רָה וּשְׁנֵ֥י הַלֻּחֹ֖ת בְּיָדִֽי׃", "onk": "וַעֲבָדִית אֲרוֹנָא דְּאָעֵי שִׁטִּין וּפְסָלִית תְּרֵין לוּחֵי אַבְנַיָּא כְּקַדְמָאֵי וּסְלֵקִית לְטוּרָא וּתְרֵין לוּחַיָּא בִּידִי:", "onk_en": "So I made a case of <i>shittim<\/i> wood, and I hewed two stone tablets like the originals, and I ascended the mountain with the two tablets in my hand.", "pj": "וַעֲבָדִית אֲרוֹנָא דְקֵיסֵי שִׁטַיָא וּפְסָלִית תְּרֵין לוּחֵי מַרְמִירָא כְּצוּרַת קַמָּאֵי וּסְלָקִית לְטַוְורָא וּתְרֵין לוּחֵי בִּידִי", "pj_en": "And I made an ark of sitta wood, and hewed two marble tables according to the form of the first, and went up into the mountain, having the two tables in my hand.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 4, "aliyah": 4, "heb": "וַיִּכְתֹּ֨ב עַֽל־הַלֻּחֹ֜ת כַּמִּכְתָּ֣ב הָרִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַדְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהֹוָ֨ה אֲלֵיכֶ֥ם בָּהָ֛ר מִתּ֥וֹךְ הָאֵ֖שׁ בְּי֣וֹם הַקָּהָ֑ל וַיִּתְּנֵ֥ם יְהֹוָ֖ה אֵלָֽי׃", "onk": "וּכְתַב עַל לוּחַיָּא כִּכְתָבָא קַדְמָאָה יָת עַשְׂרָא פִתְגָּמַיָּא דִּי מַלִּיל יְיָ עִמְּכוֹן בְּטוּרָא מִגּוֹ אֶשָׁתָא בְּיוֹמָא דִקְהָלָא וִיהָבִנּוּן יְיָ לִי:", "onk_en": "He wrote on the tablets like the original writing, the ten statements that Adonoy addressed to you on the mountain from within the fire on the day of assembly, and Adonoy gave them to me.", "pj": "וּכְתַב עַל לוּחַיָא הֵי כִּכְתָבָא קַמָּא יַת עֲשַרְתֵּי דְבִירַיָא דְמַלֵּיל יְיָ עִמְכוֹן בְּטַוְורָא מִגּוֹ אֵישָׁתָא בְּיוֹמָא דְאִתְכְּנָשׁוּ קְהָלָא וִיהָבִינָן יְיָ לִי", "pj_en": "And He wrote upon the tables according to the former writing, the Ten Words which the Lord spake with you from the mount in the midst of the fire on the day that the congregation was gathered together, and the Lord gave them to me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 5, "aliyah": 4, "heb": "וָאֵ֗פֶן וָֽאֵרֵד֙ מִן־הָהָ֔ר וָֽאָשִׂם֙ אֶת־הַלֻּחֹ֔ת בָּאָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַיִּ֣הְיוּ שָׁ֔ם כַּאֲשֶׁ֥ר צִוַּ֖נִי יְהֹוָֽה׃", "onk": "וְאִתְפְּנֵיתִי וּנְחָתִית מִן טוּרָא וְשַׁוֵּיתִי יָת לוּחַיָּא בַּאֲרוֹנָא דִּי עֲבָדִית וַהֲווֹ תַמָּן כְּמָא דִי פַקְּדַנִי יְיָ:", "onk_en": "I turned and descended the mountain, and placed the tablets into the case that I had made; and they remained there as Adonoy had commanded me.", "pj": "וְכַוָונִית וּנְחָתִית מִן טַוְורָא וְשַׁוְויַית יַת לוּחַיָא בָּאֲרוֹנָא דְעָבְדִית וַהֲווֹ תַּמָּן צְנִיעִין הֵיכְמָא דְפַקְדַנִי יְיָ", "pj_en": "And I turned and came down from the mountain, and put the tables into the ark which I had made, and there are they laid up (hidden) as the Lord commanded me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 6, "aliyah": 4, "heb": "וּבְנֵ֣י יִשְׂרָאֵ֗ל נָ֥סְע֛וּ מִבְּאֵרֹ֥ת בְּנֵי־יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַיִּקָּבֵ֣ר שָׁ֔ם וַיְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖וֹ תַּחְתָּֽיו׃", "onk": "וּבְנֵי יִשְׂרָאֵל נְטָלוּ מִבְּאֵרוֹת בְּנֵי יַעֲקָן לְמוֹסֵרָה תַּמָּן מִית אַהֲרֹן וְאִתְקְבַר תַּמָּן וְשַׁמֵּשׁ אֶלְעָזָר בְּרֵיהּ תְּחוֹתוֹהִי:", "onk_en": "Bnei Yisroel traveled from Be’eiros Bnei Ya’akon to Moseiroh. There Aharon died and was buried there; and his son El’ozor served in his stead.", "pj": "וּבְנֵי יִשְרָאֵל נְטָלוּ מִן כּוּפְרָנֵי בֵּירֵי בְּנֵי יַעֲקָן לְמוֹסֵרָה תַּמָּן אַגַח עִמְהוֹן עֲמָלֵק כַּד מְלָךְ בַּעֲרָד דִּשְׁמַע דְּמִית אַהֲרן וְאִסְתַּלְקוּ עֲנָנֵי יְקָרָא וּמִדְעָקַת עַל יִשְרָאֵל עַל קְרָבָא הַהוּא בָּעוּ לְמֵיתוּב לְמִצְרַיִם וְהַדְרֵי שִׁית מַטְלִין רְדָפוּ בְּנֵי לֵוִי בַּתְרֵיהוֹן וּקְטָלוּ מִנְהוֹן תַּמְנֵי גְנִיסַן וַהֲדָרוּ לַאֲחוֹרֵיהוֹן אַף מִבְּנֵי לֵוִי אִתְקְטִילוּ אַרְבַּע גְּנִיסַן אָמְרוּ דֵין לְדֵין מַאן גָּרַם לָנָא קָטוֹלָא הָדָא אֶלָא עַל דְּאִתְרְשַׁלְנָא בְּמִסְפְּדָא דְאַהֲרן חֲסִידָא וּקְבָעוּ תַּמָּן מִסְפְּדָא כָּל בְּנֵי יִשְרָאֵל כְּאִלּוּ תַמָּן מִית אַהֲרן וְאִתְקְבַר תַּמָּן וּבְכֵן שַׁמֵּישׁ אֶלְעָזָר בְּרֵיהּ בְּאַתְרוֹי", "pj_en": "And the children of Israel journeyed from the villages of the wells of the Beni Jahakan to Mosera. There Amalek, who reigned in Arad, and who had heard that Aharon was dead, and that the Cloud of Glory had gone up, (came and) fought with them. And those of Israel who were distressed by that war sought to go back into Mizraim, and returned (towards it) six journeys; (but) the sons of Levi followed after them, and slew eight families of them, and the remainder returned. Of the sons of Levi also four families were slain. And they said one to another, What hath been the cause of this slaughter? Because we have been remiss in the mourning for Aharon the Saint. Therefore all the children of Israel observed there a mourning for Aharon’s death; and there was he buried, and Elazar his son ministered in his stead.", "tj": "", "tj_en": "", "rashi": "<b>ובני ישראל נסעו מבארת בני יעקן מוסרה.<\/b> מָה עִנְיָן זֶה לְכָאן? וְעוֹד, וְכִי מִבְּאֵרוֹת בְּנֵי יַעֲקָן נָסְעוּ לְמוֹסֵרָה, וַהֲלֹא מִמּוֹסֵרָה בָּאוּ לִבְנֵי יַעֲקָן, שֶׁנֶּאֱמַר \"וַיִּסְעוּ מִמֹּסֵרוֹת וְגוֹ'\" (במדבר ל\"ג), וְעוֹד, שָׁם מֵת אַהֲרֹן, וַהֲלֹא בְּהֹר הָהָר מֵת, צֵא וַחֲשֹׁב וְתִמְצָא שְׁמוֹנָה מַסָּעוֹת מִמּוֹסֵרוֹת לְהֹר הָהָר? אֶלָּא אַף זוֹ מִן הַתּוֹכֵחָה, וְעוֹד זֹאת עֲשִׂיתֶם, כְּשֶׁמֵּת אַהֲרֹן בְּהֹר הָהָר לְסוֹף אַרְבָּעִים שָׁנָה וְנִסְתַּלְּקוּ עַנְנֵי כָבוֹד, יְרֵאתֶם לָכֶם מִמִּלְחֶמֶת מֶלֶךְ עֲרָד, וּנְתַתֶּם רֹאשׁ לַחֲזֹר לְמִצְרַיִם וַחֲזַרְתֶּם לַאֲחוֹרֵיכֶם שְׁמוֹנָה מַסָּעוֹת עַד בְּנֵי יַעֲקָן, וּמִשָּׁם לְמוֹסֵרָה, שָׁם נִלְחֲמוּ בָּכֶם בְּנֵי לֵוִי וְהָרְגוּ מִכֶּם וְאַתֶּם מֵהֶם, עַד שֶׁהֶחֱזִירוּ אֶתְכֶם בְּדֶרֶךְ חֲזָרַתְכֶם, וּמִשָּׁם חֲזַרְתֶּם הַגֻּדְגֹּדָה הוּא חֹר הַגִּדְגָּד.", "rashi_en": "ובני ישראל נסעו מבארת בני יעקן מוסרה AND THE CHILDREN OF ISRAEL JOURNEYED FROM BEEROTH OF THE CHILDREN OF JAAKAN TO MOSERA — What has this matter to do with what has been related here? Further: Did they indeed journey from Beeroth of the children of Jaakan to Mosera; did they not come from Mosera to Beeroth of the children of Jaakan, as it is said, (Numbers 33:31) “And they journeyed from Moseroth, [and they encamped in Bene Jaakan]”? And further: it states here, “There (at Mosera) did Aaron die”. But did he not die at Mount Hor? Go and count and you will find that there are eight stations from Mosera to Mount Hor! — But really this also is part of the reproof offered by Moses. In effect he said, “This, also, ye did: when Aaron died on Mount Hor at the end of forty years and the clouds of Divine Glory departed, ye feared war with the king of Arad and you appointed a leader that ye might return to Egypt, and ye turned backwards eight stages unto Bene Jaakan and hence to Mosera. There the sons of Levi fought with you, and they slew some of you, and you some of them, until they forced you back on the road along which you had retreated. From there (Mosera) ye returned to Gudgodah, — that is identical with Hor Hagidgod (Numbers 33:32)."}, {"ch": 10, "v": 7, "aliyah": 4, "heb": "מִשָּׁ֥ם נָסְע֖וּ הַגֻּדְגֹּ֑דָה וּמִן־הַגֻּדְגֹּ֣דָה יׇטְבָ֔תָה אֶ֖רֶץ נַ֥חֲלֵי מָֽיִם׃", "onk": "מִתַּמָּן נְטָלוּ לְגֻדְגֹּד וּמִן גֻּדְגֹּד לְיָטְבָת אַרְעָא <b>נָגְדָן<\/b> נַחֲלִין דְּמַיִּין:", "onk_en": "From there they traveled to Goodgode, and from Goodgode to Yotvos, a land with flowing with streams of water.", "pj": "מִתַּמָּן נְטָלוּ לְגוּדְגוֹד וּמִן גּוּדְגוֹד לְיָטְבַת אֲרַע נַגְדָא נַחֲלִין דְּמַיָין", "pj_en": "Thence they journeyed to Gudgod, and from Gudgod to Jotbath, a land flowing with streams of water.", "tj": "", "tj_en": "", "rashi": "<b>ומן הגדגדה וגו'.<\/b> וּבְמוֹסֵרָה עֲשִׂיתֶם אֵבֶל כָּבֵד עַל מִיתָתוֹ שֶׁל אַהֲרֹן שֶׁגָּרְמָה לָכֶם זֹאת, וְנִדְמָה לָכֶם כְּאִלּוּ מֵת שָׁם (תלמוד ירושלמי סוטה א'; מכילתא שמות ט\"ו; תנחומא חקת); וְסָמַךְ מֹשֶׁה תּוֹכֵחָה זוֹ לְשִׁבּוּר הַלּוּחוֹת לוֹמַר שֶׁקָּשָׁה מִיתָתָן שֶׁל צַדִּיקִים לִפְנֵי הַקָּבָּ\"ה כַּיּוֹם שֶׁנִּשְׁתַּבְּרוּ בוֹ הַלּוּחוֹת, וּלְהוֹדִיעֲךָ שֶׁהֻקְשָׁה לוֹ מַה שֶּׁאָמְרוּ \"נִתְּנָה רֹאשׁ\" (במדבר י\"ד) לִפְרֹשׁ מִמֶּנּוּ – כַּיּוֹם שֶׁעָשׂוּ בוֹ אֶת הָעֵגֶל (ויקרא רבה כ'):", "rashi_en": "ומן הגדגדה וגו׳ AND FROM GUDGODAH [TO JOTBATH etc.] — And at Mosera you made a great mourning on account of the death of Aaron which was the cause of this your retreat, and it seemed to you as though he had died there” (Yerushalmi Sotah 1:10 at end; Mekhilta; cf. Midrash Tanchuma חקת and Pirkei DeRabbi Eliezer 17; see Rashi on Numbers 21:4). — Moses placed this reproof immediately after the mention of the breaking of the tablets to indicate that the death of the righteous is as grievous before the Holy One, blessed be He, as the day on which the tablets were broken, and to tell you that is was displeasing to Him when they said, (Numbers 14:4) “Let us set up a head (another god; see Rashi on that verse) in order to part from Him, as was the day on which they made the golden calf (Leviticus Rabbah 20:12)."}, {"ch": 10, "v": 8, "aliyah": 4, "heb": "בָּעֵ֣ת הַהִ֗וא הִבְדִּ֤יל יְהֹוָה֙ אֶת־שֵׁ֣בֶט הַלֵּוִ֔י לָשֵׂ֖את אֶת־אֲר֣וֹן בְּרִית־יְהֹוָ֑ה לַעֲמֹד֩ לִפְנֵ֨י יְהֹוָ֤ה לְשָֽׁרְתוֹ֙ וּלְבָרֵ֣ךְ בִּשְׁמ֔וֹ עַ֖ד הַיּ֥וֹם הַזֶּֽה׃", "onk": "בְּעִדָּנָא הַהִיא אַפְרֵשׁ יְיָ יָת שִׁבְטָא דְלֵוִי לְמִטַּל יָת אֲרוֹן קְיָמָא דַיְיָ לְמֵקַם קֳדָם יְיָ לְשַׁמָּשׁוּתֵיהּ וּלְבָרָכָא בִשְׁמֵיהּ עַד יוֹמָא הָדֵין:", "onk_en": "At that time Adonoy separated the tribe of Leivi to carry the case of Adonoy’s covenant, to stand before Adonoy to serve Him, and to bless in His name until this day.", "pj": "בְּעִידָנָא הַהוּא אַפְרֵישׁ יְיָ יַת שִׁבְטָא דְלֵוִי מְטוּל דְּקַנִּיאוּ לִשְׁמֵיהּ לְאִתְקְטָלָא בְּגִין יְקָרֵיהּ לִמְסוֹבְרָא יַת אֲרוֹן קְיָימָא דַיְיָ לְמֵיקוּם קֳדָם יְיָ לְשַׁמָּשׁוּתֵיהּ וּלְבָרְכָא בִּשְׁמֵיהּ עַד זְמַן יוֹמָא הָדֵין", "pj_en": "At that time the Lord distinguished the tribe of Levi, because they had been zealous (even) to slay for His honour; that they should bear the ark of the Lord’s covenant, and stand before the Lord to minister unto Him and to bless in His Name until this day.", "tj": "", "tj_en": "", "rashi": "<b>בעת ההוא הבדיל ה' וגו'.<\/b> מוּסָב לָעִנְיָן הָרִאשׁוֹן:<br><br><b>בעת ההוא<\/b>, בַּשָּׁנָה הָרִאשׁוֹנָה לְצֵאתְכֶם מִמִּצְרַיִם, וּטְעִיתֶם בָּעֵגֶל וּבְנֵי לֵוִי לֹא טָעוּ, הִבְדִּילָם הַמָּקוֹם מִכֶּם; וְסָמַךְ מִקְרָא זֶה לַחֲזָרַת בְּנֵי יַעֲקָן לוֹמַר שֶׁאַף בְּזוֹ לֹא טָעוּ בָהּ בְּנֵי לֵוִי אֶלָּא עָמְדוּ בֶּאֱמוּנָתָם:<br><br><b>לשאת את ארון.<\/b> הַלְוִיִם:<br><br><b>לעמד לפני ה' לשרתו ולברך בשמו.<\/b> הַכֹּהֲנִים, וְהוּא נְשִׂיאַת כַּפַּיִם (ערכין י\"א):", "rashi_en": "בעת ההוא הבדיל ה׳ וגו׳ AT THAT TIME THE LORD SEPARATED [THE TRIBE OF LEVI] — This is to be connected with the former narrative (that which speaks of the tablets of stone, ending at v. 5; vv. 6—8 which contain reference to Aaron’s death being interpolated for the reason given by Rashi);<br><br>בעת ההוא AT THAT TIME accordingly means: In the first year of the Exodus from Egypt, when ye sinned by worshipping the golden calf, but the sons of Levi did not thus sin. — at that time God separated them from you. It places this verse in juxtaposition with the retreat to Bene Jaakon to tell you that in this matter also, the sons of Levi did not sin, but stood steadfast in their faith.<br><br>לשאת את ארון TO BEAR THE ARK — [This was the function of] the Levites (such as were not כהנים).<br><br>‎ לעמד לפני ה׳ לשרתו ולברך בשמו TO STAND BEFORE THE LORD, TO MINISTER UNTO HIM AND TO BLESS IN HIS NAME — This (to bless in His Name) was the function of the priests and refers to the “raising of the hands” (a technical term for reciting the priestly benediction which is done with uplifted hands) (Arakhin 11a)."}, {"ch": 10, "v": 9, "aliyah": 4, "heb": "עַל־כֵּ֞ן לֹֽא־הָיָ֧ה לְלֵוִ֛י חֵ֥לֶק וְנַחֲלָ֖ה עִם־אֶחָ֑יו יְהֹוָה֙ ה֣וּא נַחֲלָת֔וֹ כַּאֲשֶׁ֥ר דִּבֶּ֛ר יְהֹוָ֥ה אֱלֹהֶ֖יךָ לֽוֹ׃", "onk": "עַל כֵּן לָא הֲוָה לְלֵוִי חֳלָק וְאַחֲסָנָא עִם אֲחוֹהִי <b>מַתְּנָן דִּיהַב לֵיהּ<\/b> יְיָ <b>אִנּוּן<\/b> אַחֲסַנְתֵּיהּ כְּמָא דִי מַלִּיל יְיָ אֱלָהָךְ לֵיהּ:", "onk_en": "This is why Leivi had no share or territory with his brothers: [<b>the gifts which<\/b>] Adonoy [<b>has given him are<\/b>] is his territory as Adonoy, your God, promised for him.", "pj": "בְּגִין כֵּן לָא הֲוָה לְשִׁבְטָא דְלֵוִי חוּלַק וְאַחְסָנָא עִם אֲחוֹהִי מַתְּנָן דִּיהַב לֵיהּ יְיָ הִינוּן אַחֲסַנְתֵּיהּ הֵיכְמָא דְמַלֵּיל יְיָ אֱלָהָכוֹן לֵיהּ", "pj_en": "Therefore the tribe of Levi hath not a portion or inheritance with his brethren; the gifts which the Lord giveth him are his inheritance, as the Lord your God hath spoken to him.", "tj": "", "tj_en": "", "rashi": "<b>על כן לא היה ללוי חלק.<\/b> לְפִי שֶׁהֻבְדְּלוּ לַעֲבוֹדַת מִזְבֵּחַ וְאֵינָן פְּנוּיִין לַחֲרֹשׁ וְלִזְרֹעַ:<br><br><b>ה' הוא נחלתו.<\/b> נוֹטֵל פְּרָס מְזֻמָּן מִבֵּית הַמֶּלֶךְ:", "rashi_en": "על כן לא היה ללוי חלק WHEREFORE LEVI HATH NO PORTION — because they have been singled out for the service of the altar (v. 8), and therefore were not free to plough and sow.<br><br>ה' הוא נחלתו THE LORD IS HIS INHERITANCE — he receives his daily fare ready for him from the King’s house (from the Temple; the dues from the sacrifices, etc.)."}, {"ch": 10, "v": 10, "aliyah": 4, "heb": "וְאָנֹכִ֞י עָמַ֣דְתִּי בָהָ֗ר כַּיָּמִים֙ הָרִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְאַרְבָּעִ֖ים לָ֑יְלָה וַיִּשְׁמַ֨ע יְהֹוָ֜ה אֵלַ֗י גַּ֚ם בַּפַּ֣עַם הַהִ֔וא לֹא־אָבָ֥ה יְהֹוָ֖ה הַשְׁחִיתֶֽךָ׃", "onk": "וַאֲנָא הֲוֵיתִי קָאֵם בְּטוּרָא כְּיוֹמִין קַדְמָאִין אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן וְקַבִּיל יְיָ צְלוֹתִי אַף בְּזִמְנָא הַהוּא לָא אָבֵי יְיָ לְחַבָּלוּתָךְ:", "onk_en": "And I remained on the mountain like the previous time, forty days and forty nights, and Adonoy accepted my prayer that time, too; Adonoy was unwilling to harm you.", "pj": "וַאֲנָא הֲוֵית קָאֵי בְּטַוְורָא בָּעֵי וּמְצַלֵּי הֵי כְּיוֹמַיָא קַמָּאֵי אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילַוָן וְקַבֵּיל יְיָ צְלוֹתִי אוּף בְּזִמְנָא הַהוּא לָא צָבָא יְיָ לְחַבְּלוּתָךְ", "pj_en": "But I stood in the mount praying and interceding as in the former days (of the) forty days and nights, and the Lord received my prayer at that time also, and the Lord would not destroy you.", "tj": "", "tj_en": "", "rashi": "<b>ואנכי עמדתי בהר.<\/b> לְקַבֵּל הַלּוּחוֹת הָאַחֲרוֹנוֹת, וּלְפִי שֶׁלֹּא פֵּרֵשׁ לְמַעְלָה כַּמָּה עָמַד בָּהָר בַּעֲלִיָּה אַחֲרוֹנָה זוֹ, חָזַר וְהִתְחִיל בָּהּ:<br><br><b>כימים הראשנים.<\/b> שֶׁל לוּחוֹת הָרִאשׁוֹנוֹת, מַה הֵם בְּרָצוֹן אַף אֵלּוּ בְּרָצוֹן, אֲבָל הָאֶמְצָעִיִּים שֶׁעָמַדְתִּי שָׁם לְהִתְפַּלֵּל עֲלֵיכֶם הָיוּ בְכַעַס:", "rashi_en": "ואנכי עמדתי בהר AND I REMAINED ON THE MOUNT to receive the last (second) tablets. — Since it does not state above (v. 2) how long he remained on the mount at this last ascent, he begins again with it (with that incident).<br><br>כימים הראשנים AS THE FORMER DAYS — those of the first tablets. How was it with those? They were passed in God’s goodwill! So these, too, were passed in God’s goodwill. But the intervening forty days when I remained there to pray for you were passed in God’s anger (Seder Olam 10; cf. Rashi on Deuteronomy 9:18)."}, {"ch": 10, "v": 11, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֵלַ֔י ק֛וּם לֵ֥ךְ לְמַסַּ֖ע לִפְנֵ֣י הָעָ֑ם וְיָבֹ֙אוּ֙ וְיִֽירְשׁ֣וּ אֶת־הָאָ֔רֶץ אֲשֶׁר־נִשְׁבַּ֥עְתִּי לַאֲבֹתָ֖ם לָתֵ֥ת לָהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר יְיָ לִי קוּם זִיל לְמִטּוּל קֳדָם עַמָּא וְיֵעֲלוּן וְיֵרְתוּן יָת אַרְעָא דִּי קַיֵּמִית לַאֲבָהָתְהוֹן לְמִתַּן לְהוֹן:", "onk_en": "And Adonoy said to me, ‘‘Get ready! Go lead the people’s traveling, and let them come and inherit the land that I swore to their forefathers to give them.’’", "pj": "וַאֲמַר יְיָ לִי קוּם אֱזִיל לְתַיֵיר קֳדָם עַמָּא וְיַעֲלוּן וְיֵרְתוּן יַת אַרְעָא דְקַיֵּימִית לְאַבְהַתְהוֹן לְמִתַּן לְהוֹן", "pj_en": "And the Lord said to me, Arise, go, lead forth the people, that they be brought in, and possess the land which I promised to their fathers to give them.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אלי וגו'.<\/b> אַף עַל פִּי שֶׁסַּרְתֶּם מֵאַחֲרָיו וּטְעִיתֶם בָּעֵגֶל, אָמַר לִי לֵךְ נְחֵה אֶת הָעָם (שמות ל\"ב):", "rashi_en": "ויאמר ה' אלי וגו׳ AND THE LORD SPAKE TO ME, [ARISE, GO ON THE JOURNEY BEFORE THE PEOPLE] — Although you had turned away from Him and had sinned by worshipping the golden calf, yet He said to me, (Exodus 32:34) “Go, lead the people”."}, {"ch": 10, "v": 12, "aliyah": 5, "heb": "וְעַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהֹוָ֣ה אֱלֹהֶ֔יךָ שֹׁאֵ֖ל מֵעִמָּ֑ךְ כִּ֣י אִם־לְ֠יִרְאָ֠ה אֶת־יְהֹוָ֨ה אֱלֹהֶ֜יךָ לָלֶ֤כֶת בְּכׇל־דְּרָכָיו֙ וּלְאַהֲבָ֣ה אֹת֔וֹ וְלַֽעֲבֹד֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּכׇל־לְבָבְךָ֖ וּבְכׇל־נַפְשֶֽׁךָ׃", "onk": "וּכְעַן יִשְׂרָאֵל מָא יְיָ אֱלָהָךְ <b>תָּבַע<\/b> מִנָּךְ אֶלָּהֵן לְמִדְחַל קֳדָם יְיָ אֱלָהָךְ לִמְהַךְ בְּכָל אָרְחָן <b>דְּתָקְנָן קֳדָמוֹהִי<\/b> וּלְמִרְחַם יָתֵיהּ וּלְמִפְלַח קֳדָם יְיָ אֱלָהָךְ בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ:", "onk_en": "And now, Yisroel, what is Adonoy, your God, asking [<b>demand<\/b>] of you, other than to fear Adonoy, your God, to go in all His ways [<b>that are correct before Him<\/b>] and to love Him, and to serve Adonoy, your God, wholeheartedly and with your whole being.", "pj": "וּכְדוֹן יִשְרָאֵל מָה יְיָ אֱלָהָכוֹן בָּעֵי מִנְכוֹן אֱלָהֵן לְמִדְחַל מִן קֳדָם יְיָ אֱלָהָכוֹן לִמְהַךְ בְּכָל אָרְחָן דְּתַקְנָן קֳדָמוֹי וּלְמִרְחַם יָתֵיהּ וּלְמִפְלַח קֳדָם יְיָ אֱלָהָכוֹן בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן", "pj_en": "And now, Israel, what doth the Lord your God require of you, but that you fear the Lord your God, to walk in all the ways that are right before Him, and that you love Him, and serve the Lord your God with all your heart and with all your soul,", "tj": "", "tj_en": "", "rashi": "<b>ועתה ישראל.<\/b> אַף עַל פִּי שֶׁעֲשִׂיתֶם כָּל זֹאת, עוֹדֶנּוּ רַחֲמָיו וְחִבָּתוֹ עֲלֵיכֶם, וּמִכָּל מַה שֶּׁחֲטָאתֶם לְפָנָיו אֵינוֹ שׁוֹאֵל מִכֶּם <b>כי אם ליראה וגו'<\/b>:<br><br><b>כי אם ליראה וגו'.<\/b> וְרַבּוֹתֵינוּ דָּרְשׁוּ מִכָּאן הַכֹּל בִּידֵי שָׁמַיִם חוּץ מִיִּרְאַת שָׁמַיִם (ברכות ל\"ג):", "rashi_en": "ועתה ישראל AND NOW, O ISRAEL, [WHAT DOTH THE LORD THY GOD ASK OF THEE] — Although you did all this, yet His mercy and His love are extended over you, and in spite of all that you sinned against Him, He asks nothing of you EXCEPT TO FEAR [THE LORD YOUR GOD, etc.].<br><br>כי אם ליראה וגו׳ EXCEPT TO FEAR [THE LORD YOUR GOD, etc.]. — Our Rabbis derived from this (“and now, what does God ask from you”) that everything is in the hands of God except the fear of God (Berakhot 33b)."}, {"ch": 10, "v": 13, "aliyah": 5, "heb": "לִשְׁמֹ֞ר אֶת־מִצְוֺ֤ת יְהֹוָה֙ וְאֶת־חֻקֹּתָ֔יו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּ֑וֹם לְט֖וֹב לָֽךְ׃", "onk": "לְמִטַּר יָת פִּקּוֹדַיָּא דַיְיָ וְיָת קְיָמוֹהִי דַּאֲנָא מְפַקְּדָךְ יוֹמָא דֵין לִדְיֵיטַב לָךְ:", "onk_en": "To guard Adonoy’s commandments and His statutes that I am commanding you today; for your benefit.", "pj": "לְמִנְטוֹר יַת פִּקּוּדוֹי דַיְיָ וְיַת קְיָימוֹהִי דַאֲנָא מְפַקֵיד יַתְכוֹן יוֹמָא דֵין מְטוּל דְיוֹטֵב לְכוֹן", "pj_en": "to keep the commandments of the Lord and His statutes which I command you this day, that it may be well with you?", "tj": "", "tj_en": "", "rashi": "<b>לשמר את מצות ה'.<\/b> וְאַף הִיא לֹא לְחִנָּם, אֶלָּא <b>לטוב לך<\/b> שֶׁתְּקַבְּלוּ שָׂכָר:", "rashi_en": "'לשמר את מצות ה TO KEEP THE COMMANDMENTS OF THE LORD — and this, too, not unrequited, but לטוב לך FOR THY GOOD — that you should receive a reward for doing so."}, {"ch": 10, "v": 14, "aliyah": 5, "heb": "הֵ֚ן לַיהֹוָ֣ה אֱלֹהֶ֔יךָ הַשָּׁמַ֖יִם וּשְׁמֵ֣י הַשָּׁמָ֑יִם הָאָ֖רֶץ וְכׇל־אֲשֶׁר־בָּֽהּ׃", "onk": "הָא דַּיְיָ אֱלָהָךְ שְׁמַיָּא וּשְׁמֵי שְׁמַיָּא אַרְעָא וְכָל דִּי בַהּ:", "onk_en": "Look! to Adonoy, your God, belong the heavens and the heavens beyond the heavens, the earth and all that is in it.", "pj": "הָא דַיְיָ אֱלָהָכוֹן שְׁמַיָא וּשְׁמֵי שְׁמַיָא וְכִתֵּי מַלְאָכַיָא דִבְהוֹן לִמְשַׁמְשִׁין קֳדָמוֹי אַרְעָא וְכָל דְּאִית בָּהּ", "pj_en": "Behold, the heavens, and the heavens of the heavens, are be Lord’s your God, and the hosts of angels are in them to minister before Him, and the earth, and whatsoever is therein.", "tj": "", "tj_en": "", "rashi": "<b>הן לה' אלהיך.<\/b> הַכֹּל, וְאַף עַל פִּי כֵן, <b>רק באבתיך חשק ה'.<\/b> מִן הַכֹּל:", "rashi_en": "הן לה׳ אלהיך BEHOLD, UNTO THE LORD THY GOD BELONGS the whole Universe (“the heavens … and the earth and all that therein is”), and yet  רק באבתיך חשק ה׳ ONLY IN THY FATHERS DID THE LORD TAKE PLEASURE. "}, {"ch": 10, "v": 15, "aliyah": 5, "heb": "רַ֧ק בַּאֲבֹתֶ֛יךָ חָשַׁ֥ק יְהֹוָ֖ה לְאַהֲבָ֣ה אוֹתָ֑ם וַיִּבְחַ֞ר בְּזַרְעָ֣ם אַחֲרֵיהֶ֗ם בָּכֶ֛ם מִכׇּל־הָעַמִּ֖ים כַּיּ֥וֹם הַזֶּֽה׃", "onk": "לְחוֹד בַּאֲבָהָתָךְ צָבֵי יְיָ לְמִרְחַם יָתְהוֹן וְאִתִּרְעֵי בִּבְנֵיהוֹן בַּתְרֵיהוֹן בְּכוֹן מִכָּל עַמְמַיָּא כְּיוֹמָא הָדֵין:", "onk_en": "[Yet] only your forefathers did Adonoy desire, to love them; and He chose their descendants after them—you—from all the peoples, like this day.", "pj": "לְחוֹד בְּאַבְהַתְכוֹן צָבָא יְיָ מְטוּל לְמִרְחַם יַתְהוֹן וְאִתְרְעֵי בִּבְנֵיהוֹן בַּתְרֵיהוֹן כְּוַותְכוֹן מִכָּל עַמְמַיָא דְעַל אַנְפֵּי אַרְעָא כִּזְמַן יוֹמָא הָדֵין", "pj_en": "Only the Lord had pleasure in your fathers, and because He would love you He hath had favour to their children after them, as you, above all the nations upon the face of the earth, at the time of this day.", "tj": "", "tj_en": "", "rashi": "<b>בכם.<\/b> כְּמוֹ שֶׁאַתֶּם רוֹאִים אֶתְכֶם חֲשׁוּקִים <b>מכל העמים היום הזה<\/b>:", "rashi_en": "בכם [AND HE CHOSE …] YOU, even as you see yourselves the object of His pleasure מכל העמים, כיום הזה MORE THAN ALL OTHER PEOPLES THIS DAY."}, {"ch": 10, "v": 16, "aliyah": 5, "heb": "וּמַלְתֶּ֕ם אֵ֖ת עׇרְלַ֣ת לְבַבְכֶ֑ם וְעׇ֨רְפְּכֶ֔ם לֹ֥א תַקְשׁ֖וּ עֽוֹד׃", "onk": "וְתֶעְדּוּן יָת <b>טַפְשׁוּת<\/b> לִבְּכוֹן וּקְדָלְכוֹן לָא תַקְשׁוּן עוֹד:", "onk_en": "You are to remove your heart’s blockage [<b>foolishness<\/b>], not to make yourselves stubborn any more.", "pj": "וְתַעֲדוּן יַת טִפְּשׁוּת לִבְּכוֹן וּקְדַלְכוֹן לָא תַקְשׁוּן תּוּב", "pj_en": "Put away folly, therefore, from your heart, and be not stiff-necked any more;", "tj": "", "tj_en": "", "rashi": "<b>ערלת לבבכם.<\/b> אֹטֶם לְבַבְכֶם וְכִסּוּיוֹ:", "rashi_en": "ערלת לבבכם [YE SHALL CIRCUMCISE] THE FORESKIN OF YOUR HEART — This means: ye shall remove the closure and cover that is on your hearts, [which prevent My words gaining entrance to them] (cf. Rashi on Exodus 6:12 and Leviticus 19:23)."}, {"ch": 10, "v": 17, "aliyah": 5, "heb": "כִּ֚י יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽאֱלֹהִ֔ים וַאֲדֹנֵ֖י הָאֲדֹנִ֑ים הָאֵ֨ל הַגָּדֹ֤ל הַגִּבֹּר֙ וְהַנּוֹרָ֔א אֲשֶׁר֙ לֹא־יִשָּׂ֣א פָנִ֔ים וְלֹ֥א יִקַּ֖ח שֹֽׁחַד׃", "onk": "אֲרֵי יְיָ אֱלָהֲכוֹן הוּא אֱלָהָא <b>דַּיָּנִין וּמָרֵי מַלְכִין<\/b> אֱלָהָא רַבָּא גִּבָּרָא וּדְחִילָא <b>דִּי לֵית קֳדָמוֹהִי<\/b> מִסַּב אַפִּין וְאַף לָא לְקַבָּלָא שָׁחְדָא:", "onk_en": "For Adonoy, your God, is God over judges and Lord over lords [<b>kings<\/b>]; the Almighty—the Great, the Powerful, and the Awesome [One]—Who neither exercises [<b>that there is not before Him<\/b>] favoritism nor accepts bribes.", "pj": "אֲרוּם יְיָ אֱלָהָכוֹן הוּא אֱלָהָא דַיָינָא וּמָארֵי מַלְכִין אֱלָהָא רַבָּא גִבָּרָא וּדְחִילָא דְּלֵית קֳדָמוֹי מֵיסַב אַפִּין וְאוּף לָא לְקַבָּלָא שׁוֹחֲדָא", "pj_en": "for the Lord thy God is God, the Judge, and the Monarch of kings, a Great God, mighty and terrible, before whom there is no respect of persons, and who taketh no bribe;", "tj": "", "tj_en": "", "rashi": "<b>ואדני האדנים.<\/b> לֹא יוּכַל שׁוּם אָדוֹן לְהַצִּיל אֶתְכֶם מִיָּדוֹ:<br><br><b>לא ישא פנים.<\/b> אִם תִּפְרְקוּ עֻלּוֹ:<br><br><b>ולא יקח שחד.<\/b> לְפַיְּסוֹ בְּמָמוֹן:", "rashi_en": "ואדני האדנים [FOR THE LORD YOUR GOD IS …] LORD OF LORDS (i.e. He is Lord over those who are lords, kings, governors, etc.) — so that no lord is able to deliver you from His hand.<br><br>לא ישא פנים HE WILL NOT REGARD PERSONS, if you cast off His yoke,<br><br>ולא יקח שֹחד NOR WILL HE TAKE A BRIBE, that one should appease Him by money."}, {"ch": 10, "v": 18, "aliyah": 5, "heb": "עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְאַלְמָנָ֑ה וְאֹהֵ֣ב גֵּ֔ר לָ֥תֶת ל֖וֹ לֶ֥חֶם וְשִׂמְלָֽה׃", "onk": "עָבֵד דִּין יִתַּם וְאַרְמְלָא וְרָחֵם גִּיּוֹרָא לְמִתַּן לֵיהּ <b>מְזוֹנָא וּכְסוּ<\/b>:", "onk_en": "Who performs justice for orphan and widow, and loves the convert to give him bread [<b>sustenance<\/b>] and a garment [<b>shelter<\/b>].", "pj": "עִבַּד דִּין יִיתָם וְאַרְמַלְתָּא וּרְחֵים גִּיוֹרָא לְמִתַּן לֵיהּ מָזוֹן וְאִסְטוֹלָא", "pj_en": "He doeth judgment for the orphan and widow, and hath compassion upon the stranger to give him food and raiment.", "tj": "", "tj_en": "", "rashi": "<b>עשה משפט יתום ואלמנה.<\/b> הֲרֵי גְּבוּרָה, וְאֵצֶל גְּבוּרָתוֹ אַתָּה מוֹצֵא עַנְוְתָנוּתוֹ (מגילה ל\"א):<br><br><b>ואהב גר לתת לו לחם ושמלה.<\/b> וְדָבָר חָשׁוּב הוּא זֶה, שֶׁכָּל עַצְמוֹ שֶׁל יַעֲקֹב אָבִינוּ עַל זֶה נִתְפַּלֵּל (בראשית כ\"ח) וְנָתַן לִי לֶחֶם לֶאֱכֹל וּבֶגֶד לִלְבֹּשׁ (בראשית רבה ע'):", "rashi_en": "עשה משפט יתום ואלמנה HE EXECUTETH JUDGMENT OF THE FATHERLESS AND THE WIDOW — You have mention of His power (in the preceding verse) and together with His power you find mention of His humility here (“He executeth judgment of the fatherless and the widow”) (Megillah 31a).<br><br>ואהב גר לתת לו לחם ושמלה AND HE LOVETH THE STRANGER IN GIVING HIM BREAD AND RAIMENT — and this (bread and raiment) is a matter of importance, for the very self of (all the energies of) Jacob, our ancestor, was to pray for this, (Genesis 28:20) “Let Him give me bread to eat and raiment to put on” (Genesis Rabbah 70:5)."}, {"ch": 10, "v": 19, "aliyah": 5, "heb": "וַאֲהַבְתֶּ֖ם אֶת־הַגֵּ֑ר כִּֽי־גֵרִ֥ים הֱיִיתֶ֖ם בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְתִרְחֲמוּן יָת גִּיּוֹרָא אֲרֵי דַיָּרִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "You are to love the convert, because you were strangers in the land of Egypt.", "pj": "וּתְרַחֲמוּן יַת גִּיּוֹרָא אֲרוּם גִּיוֹרִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרָיִם", "pj_en": "Have pity then (yourselves) upon the stranger, for you were strangers in the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>כי גרים הייתם.<\/b> מוּם שֶׁבְּךָ אַל תֹּאמַר לַחֲבֵרְךָ (בבא מציעא נ\"ט):", "rashi_en": "כי גרים הייתם [LOVE THE STRANGER] FOR YE WERE STRANGERS — Do not reproach thy fellow man for a fault which is also thine (cf. Rashi on Exodus 22:20; Bava Metzia 59b)."}, {"ch": 10, "v": 20, "aliyah": 5, "heb": "אֶת־יְהֹוָ֧ה אֱלֹהֶ֛יךָ תִּירָ֖א אֹת֣וֹ תַעֲבֹ֑ד וּב֣וֹ תִדְבָּ֔ק וּבִשְׁמ֖וֹ תִּשָּׁבֵֽעַ׃", "onk": "יָת יְיָ אֱלָהָךְ תִּדְחַל <b>וּקֳדָמוֹהִי<\/b> תִפְלָח <b>וּלְדַחַלְתֵּיהּ תִּקְרַב<\/b> וּבִשְׁמֵיהּ תְּקַיַּם:", "onk_en": "You are to fear [<b>before<\/b>] Adonoy, your God, serve Him, cling to Him [<b>come near to the fear of Him<\/b>], and swear by His name.", "pj": "מִן קֳדָם יְיָ אֱלָהָכוֹן תְּדַחֲלוּן וּקְדָמוֹי תִפְלְחוּן וּבְדַחַלְתֵּיהּ תִּתְקַרְבוּן וּבִשְׁמֵיהּ תּוֹמוּן", "pj_en": "Revere the Lord your God, and worship before Him, and cleave closely to His fear, and swear by His Name.", "tj": "", "tj_en": "", "rashi": "<b>את ה' אלהיך תירא.<\/b> וְתַעֲבֹד לוֹ וְתִדְבַּק בּוֹ, וּלְאַחַר שֶׁיִּהְיוּ בְךָ כָּל הַמִּדּוֹת הַלָּלוּ, אָז בִּשְׁמוֹ תִּשָּׁבֵעַ:", "rashi_en": "את ה׳ אלוהיך תירא THOU SHALT FEAR THE LORD THY GOD, and serve Him and cleave to Him; and after you possess all these qualities, then you may swear by His Name (cf. Rashi on 6:13 and Note thereon)."}, {"ch": 10, "v": 21, "aliyah": 5, "heb": "ה֥וּא תְהִלָּתְךָ֖ וְה֣וּא אֱלֹהֶ֑יךָ אֲשֶׁר־עָשָׂ֣ה אִתְּךָ֗ אֶת־הַגְּדֹלֹ֤ת וְאֶת־הַנּֽוֹרָאֹת֙ הָאֵ֔לֶּה אֲשֶׁ֥ר רָא֖וּ עֵינֶֽיךָ׃", "onk": "הוּא תֻשְׁבַּחְתָּךְ וְהוּא אֱלָהָךְ דַּעֲבַד עִמָּךְ יָת רַבְרְבָתָא וְיָת חֲסִינָתָא הָאִלֵּין דִּי חֲזוֹ עֵינָיךְ:", "onk_en": "He is your praise and He is your God, Who performed with you these great and fearsome things that your eyes witnessed.", "pj": "הוּא תוּשְׁבַּחְתְּכוֹן וְהוּא אֱלָהָכוֹן דְּעָבַד עִמְכוֹן יַת רַבְרְבָתָא וְיַת חֲסִינָתָא הָאִילֵין דַּחֲמִיתוּן בְּעֵינֵיכוֹן", "pj_en": "He is your praise, and He is your God, who hath done for thee these great and mighty acts which thou hast beheld with thy eyes.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 22, "aliyah": 5, "heb": "בְּשִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖יךָ מִצְרָ֑יְמָה וְעַתָּ֗ה שָֽׂמְךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ כְּכוֹכְבֵ֥י הַשָּׁמַ֖יִם לָרֹֽב׃", "onk": "בְּשַׁבְעִין נַפְשָׁן נְחָתוּ אֲבָהָתָךְ לְמִצְרָיִם וּכְעַן שַׁוְּיָךְ יְיָ אֱלָהָךְ כְּכוֹכְבֵי שְׁמַיָּא לְמִסְגֵּי:", "onk_en": "Numbering seventy people, your forefathers went down to Egypt; and now Adonoy, your God, has placed you like the stars of the sky, numerous.", "pj": "בְּשׁוּבְעִין נַפְשָׁתָא נְחָתוּ אַבְהַתְכוֹן לְמִצְרַיִם וּכְדוֹן שַׁוִינְכוֹן יְיָ אֱלָהָכוֹן הֵי כְּכוֹכְבֵי שְׁמַיָא לְמִסְגֵי", "pj_en": "With seventy souls your fathers went down into Mizraim, and now hath the Lord your God set you as the stars of the heavens for multitude.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 1, "aliyah": 5, "heb": "וְאָ֣הַבְתָּ֔ אֵ֖ת יְהֹוָ֣ה אֱלֹהֶ֑יךָ וְשָׁמַרְתָּ֣ מִשְׁמַרְתּ֗וֹ וְחֻקֹּתָ֧יו וּמִשְׁפָּטָ֛יו וּמִצְוֺתָ֖יו כׇּל־הַיָּמִֽים׃", "onk": "וְתִרְחַם יָת יְיָ אֱלָהָךְ וְתִטַּר מַטְּרַת <b>מֵימְרֵיהּ<\/b> וּקְיָמוֹהִי וְדִינוֹהִי וּפִקּוֹדוֹהִי כָּל יוֹמַיָּא:", "onk_en": "You are to love Adonoy, your God, and you are to guard His watch [<b>word<\/b>], and His statutes, and His laws, and His commandments, all the years.", "pj": "וּתְרַחֲמוּן יַת יְיָ אֱלָהָכוֹן וְתִינְטְרוּן מַטְרַת מֵימְרֵיהּ וּקְיָימוֹי וְדִינוֹי וּפִקּוּדוֹי כָּל יוֹמַיָא", "pj_en": "Therefore shall you love the Lord your God, and diligently observe His Word, His statutes, and His judgments always.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 2, "aliyah": 5, "heb": "וִֽידַעְתֶּם֮ הַיּוֹם֒ כִּ֣י&thinsp;<b>׀<\/b> לֹ֣א אֶת־בְּנֵיכֶ֗ם אֲשֶׁ֤ר לֹֽא־יָדְעוּ֙ וַאֲשֶׁ֣ר לֹא־רָא֔וּ אֶת־מוּסַ֖ר יְהֹוָ֣ה אֱלֹהֵיכֶ֑ם אֶת־גׇּדְל֕וֹ אֶת־יָדוֹ֙ הַחֲזָקָ֔ה וּזְרֹע֖וֹ הַנְּטוּיָֽה׃", "onk": "וְתִדְּעוּן יוֹמָא דֵין אֲרֵי לָא יָת בְּנֵיכוֹן דִּי לָא יְדָעוּ וְדִי לָא חֲזוֹ יָת אֻלְפָנָא דַּיְיָ אֱלָהֲכוֹן יָת רְבוּתֵיהּ יָת יְדֵיהּ תַּקִּיפָא וּדְרָעֵיהּ מְרָמְמָא:", "onk_en": "You will know today that not with your children who have not known and who have not seen the teaching of Adonoy, your God—His greatness, His powerful hand and His extended arm,", "pj": "וְתִנְדְּעוּן יוֹמָא דֵין אֲרוּם לָא עִם בְּנֵיכוֹן דְּלָא יָדְעוּן וְלָא חָמוּן יַת אוּלְפַן אוֹרַיְיתָא דַיְיָ אֱלָהָכוֹן יַת רְבוּתֵיהּ וְיַת יְדֵיהּ תַקִיפְתָּא וּדְרָעֵיהּ מְרַמַם", "pj_en": "And know you this day, for (I speak) not with your children who have not known or seen the instruction of the law of the Lord your God, nor His greatness, nor His mighty hand, nor His uplifted arm,", "tj": "", "tj_en": "", "rashi": "<b>וידעתם היום.<\/b> תְּנוּ לֵב לָדַעַת וּלְהָבִין ולְקַבֵּל תּוֹכַחְתִּי:<br><br><b>כי לא את בניכם.<\/b> אֲנִי מְדַבֵּר עַכְשָׁו, שֶׁיּוּכְלוּ לוֹמַר אָנוּ לֹא יָדַעְנוּ וְלֹא רָאִינוּ בְּכָל זֶה:", "rashi_en": "וידעתם היום AND KNOW YE THIS DAY — Set your heart to know and comprehend, and to accept my reproof.<br><br>כי לא את בניכם FOR NOT WITH YOUR CHILDREN am I now speaking who might say, “We do not know nor have we seen all this” (all that God did for you, and what He did to Egypt, and for you in the wilderness, and to Dathan and Abiram, as related in vv. 2—6). "}, {"ch": 11, "v": 3, "aliyah": 5, "heb": "וְאֶת־אֹֽתֹתָיו֙ וְאֶֽת־מַעֲשָׂ֔יו אֲשֶׁ֥ר עָשָׂ֖ה בְּת֣וֹךְ מִצְרָ֑יִם לְפַרְעֹ֥ה מֶֽלֶךְ־מִצְרַ֖יִם וּלְכׇל־אַרְצֽוֹ׃", "onk": "וְיָת אַתְוָתֵיהּ וְיָת עוֹבָדוֹהִי דִּי עֲבַד בְּגוֹ מִצְרָיִם לְפַרְעֹה מַלְכָּא דְמִצְרַיִם וּלְכָל אַרְעֵיהּ:", "onk_en": "and His signs and His deeds that He performed within Egypt, to Pharaoh king of Egypt, and to his entire land;", "pj": "וְיַת אַתְוָותֵיהּ וְיַת עוֹבָדוֹי דְעָבַד בְּגוֹ מִצְרַיִם לְפַרְעה מַלְכָּא דְמִצְרַיִם וּלְכָל יַתְבֵי אַרְעֵיהּ", "pj_en": "or His signs and works which He wrought in Mizraim, on Pharoh king of Mizraim, and on all the inhabitants of his land;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 4, "aliyah": 5, "heb": "וַאֲשֶׁ֣ר עָשָׂה֩ לְחֵ֨יל מִצְרַ֜יִם לְסוּסָ֣יו וּלְרִכְבּ֗וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת־מֵ֤י יַם־סוּף֙ עַל־פְּנֵיהֶ֔ם בְּרׇדְפָ֖ם אַחֲרֵיכֶ֑ם וַיְאַבְּדֵ֣ם יְהֹוָ֔ה עַ֖ד הַיּ֥וֹם הַזֶּֽה׃", "onk": "וְדִי עֲבַד <b>לְמַשִּׁרְיַת<\/b> מִצְרַיִם לְסוּסָוָתֵיהּ וְלִרְתִיכוֹהִי דִּי אַטִּיף יָת מֵי יַמָּא דְסוּף עַל אַפֵּיהוֹן בְּמִרְדָּפְהוֹן בַּתְרֵיכוֹן וְאוֹבָדִנּוּן יְיָ עַד יוֹמָא הָדֵין:", "onk_en": "And what He did to the Egyptian army [<b>host<\/b>], to its horses and to its chariots—that He flooded the waters of Yam Suf over them when they were chasing you—Adonoy destroyed them until this day;", "pj": "וּדְעָבַד לְמַשִׁרְיַית מִצְרַיִם לְסוּסְוַותְהוֹן וּלְאַרְתִיכֵיהוֹן דִּי אַטִּיף יַת מוֹי דְיַמָא דְסוּף עַל אַפֵּיהוֹן כַּד רְדָפוּ בַּתְרֵיכוֹן וְאַבֵּידִינוּן יְיָ עַד זְמַן יוֹמָא הָדֵין", "pj_en": "what He did also to the hosts of Mizraim, to their horses and chariots, when He made the waters of the Red Sea to overwhelm their faces when they followed after you, when the Lord destroyed them unto this day’s time;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 5, "aliyah": 5, "heb": "וַאֲשֶׁ֥ר עָשָׂ֛ה לָכֶ֖ם בַּמִּדְבָּ֑ר עַד־בֹּאֲכֶ֖ם עַד־הַמָּק֥וֹם הַזֶּֽה׃", "onk": "וְדִי עֲבַד לְכוֹן בְּמַדְבְּרָא עַד מֵיתֵיכוֹן עַד אַתְרָא הָדֵין:", "onk_en": "And what He did for you in the wilderness, until you arrived at this place;", "pj": "וּדְעָבַד לְכוֹן בְּמַדְבְּרָא עַד זְמַן מֵיתֵיכוֹן עַד אַתְרָא הָדֵין", "pj_en": "and what He hath done to you in the wilderness till the time that you came to this place;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 6, "aliyah": 5, "heb": "וַאֲשֶׁ֨ר עָשָׂ֜ה לְדָתָ֣ן וְלַאֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן־רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָאָ֙רֶץ֙ אֶת־פִּ֔יהָ וַתִּבְלָעֵ֥ם וְאֶת־בָּתֵּיהֶ֖ם וְאֶת־אׇהֳלֵיהֶ֑ם וְאֵ֤ת כׇּל־הַיְקוּם֙ אֲשֶׁ֣ר בְּרַגְלֵיהֶ֔ם בְּקֶ֖רֶב כׇּל־יִשְׂרָאֵֽל׃", "onk": "וְדִי עֲבַד לְדָתָן וְלַאֲבִירָם בְּנֵי אֱלִיאָב בַּר רְאוּבֵן דִּי פְתָחַת אַרְעָא יָת פּוּמַהּ וּבְלָעָתְנוּן וְיָת <b>אֱנַשׁ<\/b> בָּתֵּיהוֹן וְיָת מַשְׁכְּנֵיהוֹן וְיָת כָּל יְקוּמָא <b>דִּי עִמְּהוֹן<\/b> בְּגוֹ כָּל יִשְׂרָאֵל:", "onk_en": "And what He did to Dosson and to Avirom sons of Eli’ov son of Re’uven, that the earth opened its mouth and swallowed them and [<b>the members of<\/b>] their families and their tents and all the sustenance at their feet [<b>that was with them<\/b>] amid all of Yisroel.", "pj": "וּדְעָבַד לְדָתָן וְלַאֲבִירָם בְּנֵי אֱלִיאָב בַּר רְאוּבֵן דִּפְתָחַת אַרְעָא יַת פּוּמָהּ וּבְלָעַתְנוּן וְיַת אֵינַשׁ בָּתֵּיהוֹן וְיַת כָּל טַרְיָיתָא דַּהֲווֹ עִמְהוֹן בְּגוֹ כָּל יִשְרָאֵל", "pj_en": "and what He did unto Dathan and Abiram the sons of Eliab bar Reuben, when the earth opened her mouth and swallowed them up with the men of their house, and all their substance, in the midst of all Israel:", "tj": "", "tj_en": "", "rashi": "<b>בקרב כל ישראל.<\/b> כָּל מָקוֹם שֶׁהָיָה אֶחָד מֵהֶם בּוֹרֵחַ הָאָרֶץ נִבְקַעַת מִתַּחְתָּיו וּבוֹלַעְתּוֹ, אֵלּוּ דִּבְרֵי רַבִּי יְהוּדָה, אָמַר לוֹ רַבִּי נְחֶמְיָה וַהֲלֹא כְבָר נֶאֱמַר (במדבר ט\"ז) וַתִּפְתַּח הָאָרֶץ אֶת פִּיהָ – וְלֹא פִּיּוֹתֶיהָ. אָמַר לוֹ וּמָה אֲנִי מְקַיֵּם <b>בקרב כל ישראל<\/b>? אָמַר לוֹ שֶׁנַּעֲשֵׂית הָאָרֶץ מִדְרוֹן כְּמַשְׁפֵּךְ, וְכָל מָקוֹם שֶׁהָיָה אֶחָד מֵהֶם הָיָה מִתְגַּלְגֵּל וּבָא עַד מְקוֹם הַבְּקִיעָה (עי' ילקוט שמעוני תשנ\"ב):<br><br><b>ואת כל היקום אשר ברגליהם.<\/b> זֶה מָמוֹנוֹ שֶׁל אָדָם שֶׁמַּעֲמִידוֹ עַל רַגְלָיו (סנהדרין ק\"י):", "rashi_en": "בקרב כל ישראל [AND THE EARTH SWALLOWED THEM UP] IN THE MIDST OF ALL ISRAEL — Wherever one of them fled the earth was riven beneath him and swallowed him up. This is the view of R. Judah. Rabbi Nehemiah said to him: But is it not already stated, (Numbers 16:32) “And the earth opened its mouth”, and it does not state “its mouths”? Whereupon he (R. Judah) asked him: “But how, then, can I explain the words: “in the midst of all Israel” (if there was but one spot at which they were swallowed up, as you suggest Scripture states by the word פיה, “its mouth”)? He replied to him: you can reconcile the two texts by assuming that the earth became a declivity, — something like a funnel, — and wherever it was that one of them happened to be, he rolled down until he reached the place where the fissure was (cf. Yalkut Shimoni on Torah 752).<br><br>ואת כל היקום אשר ברגליהם AND ALL THE SUBSTANCE THAT WAS AT THEIR FEET — This means a man’s money, that places him on his feet (Sanhedrin 110a). "}, {"ch": 11, "v": 7, "aliyah": 5, "heb": "כִּ֤י עֵֽינֵיכֶם֙ הָֽרֹאֹ֔ת אֶת־כׇּל־מַעֲשֵׂ֥ה יְהֹוָ֖ה הַגָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה׃", "onk": "אֲרֵי עֵינֵיכוֹן חֲזָאָה יָת כָּל עוֹבָדָא דַיְיָ רַבָּא דִּי עֲבָד:", "onk_en": "Rather <i>your<\/i> eyes have been witnessing the entire overwhelming activity of Adonoy that He has performed.", "pj": "אֲרוּם בְּעֵינֵיכוֹן אַתּוּן חַמְיַין יַת כָּל עוֹבָדָא דַיְיָ רַבָּא דִי עֲבָד", "pj_en": "for with your eyes have you seen all the great work of the Lord which He hath wrought.", "tj": "", "tj_en": "", "rashi": "<b>כי עיניכם הראת.<\/b> מֻסָּב עַל הַמִּקְרָא הָאָמוּר לְמַעְלָה – כִּי לֹא אֶת בְּנֵיכֶם אֲשֶׁר לֹא יָדְעוּ כִּי אִם עִמָּכֶם אֲשֶׁר עֵינֵיכֶם הָרֹאֹת וְגוֹ':", "rashi_en": "כי עיניכם הראת BUT YOUR EYES HAVE SEEN — This is to be connected with the verse mentioned above (v. 2), thus: (2) For not with your children am I speaking who do not know, but with you whose eyes have seen, etc."}, {"ch": 11, "v": 8, "aliyah": 5, "heb": "וּשְׁמַרְתֶּם֙ אֶת־כׇּל־הַמִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּבָאתֶם֙ וִֽירִשְׁתֶּ֣ם אֶת־הָאָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "וְתִטַּר יָת (כָּל) תַּפְקֶדְתָּא דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין בְּדִיל דְּתִתְקְפוּן <b>וְתֵעֲלוּן<\/b> וְתֵירְתוּן יָת אַרְעָא דִּי אַתּוּן עָבְרִין תַּמָּן לְמֵירְתַהּ:", "onk_en": "You will guard the entire <i>mitzvah<\/i> that I am commanding you today, in order that you be encouraged and will arrive in, [<b>amd go up to,<\/b>] and inherit the land that you are crossing over there to inherit.", "pj": "וְתִנְטְרוּן יַת כָּל תַּפְקֵידְתָּא דַּאֲנָא מְפַקֵיד לְכוֹן יוֹמָא דֵין מִן בִּגְלַל דְּתִתְקְפוּן וְתֵיעֲלוּן וְתֵירְתוּן יַת אַרְעָא דְאַתּוּן עָבְרִין לְתַמָּן לְמֵירְתָהּ", "pj_en": "Therefore shall you keep all the precepts which I command you this day, that you may be strengthened, and go in, and inherit the land to possess which you go over;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 9, "aliyah": 5, "heb": "וּלְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל־הָ֣אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהֹוָ֧ה לַאֲבֹתֵיכֶ֛ם לָתֵ֥ת לָהֶ֖ם וּלְזַרְעָ֑ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָֽשׁ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבְדִיל דְּתוֹרְכוּן יוֹמִין עַל אַרְעָא דִּי קַיִּים יְיָ לַאֲבָהָתְכוֹן לְמִתַּן לְהוֹן וְלִבְנֵיהוֹן אַרְעָא <b>עָבְדָא<\/b> חֲלַב וּדְבָשׁ:", "onk_en": "And in order that you will last long on the land that Adonoy swore to your forefathers to give to them and to their descendants, a land flowing [<b>producing<\/b>] milk and honey.", "pj": "וּמִן בִּגְלַל דְּיִסְגוּן יוֹמֵיכוֹן עַל אַרְעָא דְקַיֵּים יְיָ לְאַבְהַתְכוֹן לְמִתַּן לְהוֹן וְלִבְנֵיהוֹן אַרְעָא דְפֵירָהָא שְׁמֵינִין כַּחֲלָב וְחַלְיַין כִּדְבָשׁ", "pj_en": "and that your days may be multiplied upon the land which the Lord sware to your fathers to give it to them and their children; a land whose fruits are rich as milk, and sweet as honey.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 10, "aliyah": 6, "heb": "כִּ֣י הָאָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא־שָׁ֙מָּה֙ לְרִשְׁתָּ֔הּ לֹ֣א כְאֶ֤רֶץ מִצְרַ֙יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִשָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת־זַרְעֲךָ֔ וְהִשְׁקִ֥יתָ בְרַגְלְךָ֖ כְּגַ֥ן הַיָּרָֽק׃", "onk": "אֲרֵי אַרְעָא דִּי אַתְּ עָלֵל לְתַמָּן לְמֵירְתַהּ לָא כְאַרְעָא דְמִצְרַיִם הִיא דִּי נְפַקְתּוּן מִתַּמָּן דִּי תִזְרַע יָת זַרְעָךְ וּמַשְׁקַת לֵיהּ בְּרַגְלָךְ כְּגִנְתָא יַרְקָא:", "onk_en": "For the land where you are arriving to inherit is not like the land of Egypt from which you departed, where you planted your seed and watered [it] on foot like a vegetable garden.", "pj": "אֲרוּם אַרְעָא דְאַנְתְּ עָלֵיל תַּמָּן לְמֵירְתָהּ לָא כְאַרְעָא דְמִצְרַיִם הִיא דִנְפַקְתּוּן מִתַּמָּן דְּתִזְרַע יַת זַרְעָךְ וּמַשְׁקְיַת לֵיהּ בְּגַרְמָךְ הֵי כְגִינַת יַרְקָא", "pj_en": "For the land to which thou goest in to possess it is not like the land of Mizraim, from whence you have come, in which thou didst sow thy seed, and water it thyself as a garden of herbs;", "tj": "", "tj_en": "", "rashi": "<b>לא כארץ מצרים הוא.<\/b> אֶלָּא טוֹבָה הֵימֶנָּה, וְנֶאֶמְרָה הַבְטָחָה זוֹ לְיִשְׂרָאֵל בִּיצִיאָתָם מִמִּצְרַיִם, שֶׁהָיוּ אוֹמְרִים שֶׁמָּא לֹא נָבֹא אֶל אֶרֶץ טוֹבָה וְיָפָה כָּזוֹ. יָכוֹל בִּגְנוּתָהּ הַכָּתוּב מְדַבֵּר, וְכָךְ אָמַר לָהֶם לֹא כְּאֶרֶץ מִצְרַיִם הִיא אֶלָּא רָעָה הֵימֶנָּה? תַּ\"לֹ \"וְחֶבְרוֹן שֶׁבַע שָׁנִים נִבְנְתָה לִפְנֵי וְגוֹ'\" (במדבר י\"ג), אָדָם אֶחָד בְּנָאָן, חָם בָּנָה צֹעַן לְמִצְרַיִם בְּנוֹ, וְחֶבְרוֹן לִכְנַעַן, דֶּרֶךְ אֶרֶץ אָדָם בּוֹנֶה אֶת הַנָּאֶה וְאַחַר כָּךְ בּוֹנֶה אֶת הַגָּרוּעַ, שֶׁפְּסָלְתּוֹ שֶׁל רִאשׁוֹן הוּא נוֹתֵן בַּשֵּׁנִי, וּבְכָל מָקוֹם הֶחָבִיב קוֹדֵם, הָא לָמַדְתָּ שֶׁחֶבְרוֹן יָפָה מִצֹּעַן; וּמִצְרַיִם מְשֻׁבַּחַת מִכָּל הָאֲרָצוֹת שֶׁנֶּאֱמַר (בראשית י\"ג) \"כְּגַן ה' כְּאֶרֶץ מִצְרַיִם\", וְצֹעַן שֶׁבַח מִצְרַיִם הִיא שֶׁהִיא מְקוֹם מַלְכוּת, שֶׁכֵּן הוּא אוֹמֵר (ישעיהו ל') \"כִּי הָיוּ בְצֹעַן שָׂרָיו\", וְחֶבְרוֹן פְּסָלְתָּהּ שֶׁל יִשְׂרָאֵל, לְכָךְ הִקְצוּהָ לְקְבוּרַת מֵתִים, וְאַף עַל פִּי כֵן הִיא יָפָה מִצֹּעַן. וּבִכְתֻבּוֹת (דף קי\"ב) דָּרְשׁוּ בְּעִנְיָן אַחֵר, אֶפְשָׁר אָדָם בּוֹנֶה בַיִת לִבְנוֹ הַקָּטָן וְאַחַר כָּךְ לִבְנוֹ הַגָּדוֹל? אֶלָּא שֶׁמְּבֻנָּה עַל אֶחָד מִשִּׁבְעָה בְּצֹעַן:<br><br><b>אשר יצאתם משם.<\/b> אֲפִלּוּ אֶרֶץ רַעְמְסֵס אֲשֶׁר יְשַׁבְתֶּם בָּהּ וְהִיא בְּמֵיטַב אֶרֶץ מִצְרַיִם, שֶׁנֶּאֱמַר \"בְּמֵיטַב הָאָרֶץ וְגוֹ'\" (בראשית מ\"ז), אַף הִיא אֵינָהּ כְּאֶרֶץ יִשְׂרָאֵל:<br><br><b>והשקית ברגלך.<\/b> אֶרֶץ מִצְרַיִם הָיְתָה צְרִיכָה לְהָבִיא מַיִם מִנִּילוּס, בְּרַגְלְךָ, וּלְהַשְׁקוֹתָהּ – צָרִיךְ אַתָּה לִנְדֹּד מִשְּׁנָתְךָ וְלַעֲמֹל, וְהַנָּמוּךְ שׁוֹתֶה וְלֹא הַגָּבוֹהַּ, וְאַתָּה מַעֲלֶה הַמַּיִם מִן הַנָּמוּךְ לַגָּבוֹהַּ, אֲבָל זוֹ <b>למטר השמים תשתה מים<\/b> – אַתָּה יָשֵׁן עַל מִטָּתְךָ וְהַקָּבָּ\"ה מַשְׁקֶה נָמוּךְ וְגָבוֹהּ גָּלוּי וְשֶׁאֵינוֹ גָלוּי כְּאֶחָת (ספרי):<br><br><b>כגן הירק.<\/b> שֶׁאֵין דַּי לוֹ בִגְשָׁמִים וּמַשְׁקִין אוֹתוֹ בָּרֶגֶל וּבַכָּתֵף:", "rashi_en": "לא כארץ מצרים הוא [THE LAND WHITHER THOU GOEST …] IS NOT AS THE LAND OF EGYPT, but it is better than it. He mentions Egypt because this assurance was made to Israel on their departure from Egypt, for they said: Perhaps we shall not come to a land as good and beautiful as this. — One might, however, think that Scripture is here speaking to its (the Land’s) disparagement, and that he states the following to them: It is not as the land of Egypt — but it is worse than it! It, however, states, (Numbers 13:22; see Rashi thereon) “And Hebron was built seven years before Zoan in Egypt etc.”. One person built both of them: Ham built Zoan for Mizrajim (Egypt), his son, and Hebron for Canaan, another son. The usual way is that a man first builds the better city, and afterwards builds the inferior one, because what is not good enough for the first he puts into the second, and, besides, the better is usually first. Thus you may learn that Hebron was a finer city than Zoan. Now Egypt is superior to all other lands, for it is stated of it, (Genesis 13:10) “Like the garden of the Lord, viz., like the land of Egypt”, and Zoan was the best city in Egypt, because it was the seat of royalty, for thus does it state, (Isaiah 30:4) “For in Zoan were its princes”; Hebron was the worst city in Canaan, — for this reason, indeed, they set it apart for a place of burial, — and yet it was finer than Zoan (cf. Sifrei Devarim 37:1-3). — In the Talmud, Treatise Ketuboth 112a, they derived this in another manner: Is it likely that a man would first build a house for his younger son (here Canaan), and afterwards for his elder son (Mizrajim)? But the meaning of שבע שנים נבנתה וכו׳ is that it (Hebron) was furnished (built up) with all excellencies seven times better than Zoan.<br><br>אשר יצאתם משם [THE LAND OF EGYPT] FROM WHICH YE WENT FORTH — even the district of Raamses in which ye dwelt and which was in the best part of the land Egypt, as it is said, (Genesis 47:11) “[And Joseph placed his father and his brethren] in the best part of the land, [in the land of Raamses]” — even that is not as good as the land of Israel (cf. Sifrei Devarim 38:7).<br><br>והשקית ברגלך [LIKE THE LAND OF EGYPT] WHICH THOU DIDST WATER WITH THY FOOT — The land of Egypt was such that you had to bring water from the Nile through your foot (i.e. you had to go to the Nile to bring water) to irrigate it — you had to rise from your sleep and to toil. Then again, the lowlying parts alone drank (were irrigated by the Nile) and not the higher land, and you had to take up water from the lower to the higher parts: but this land (Canaan),  למטר השמים תשתה מים DRINKETH WATER OF THE RAIN OF HEAVEN — You may sleep soundly on your beds, and the Holy One, blessed be He, waters both low and high districts, both what is exposed and what is not exposed alike (Sifrei Devarim 38:2).<br><br>כגן הירק AS A GARDEN OF HERBS, which has not enough from rain alone, and one has to water it through the foot and shoulder (one has to run about to bring water which one has to carry on one’s shoulder)."}, {"ch": 11, "v": 11, "aliyah": 6, "heb": "וְהָאָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֥ים שָׁ֙מָּה֙ לְרִשְׁתָּ֔הּ אֶ֥רֶץ הָרִ֖ים וּבְקָעֹ֑ת לִמְטַ֥ר הַשָּׁמַ֖יִם תִּשְׁתֶּה־מָּֽיִם׃", "onk": "וְאַרְעָא דִּי אַתּוּן עָבְרִין תַּמָּן לְמֵירְתַהּ אֲרַע טוּרִין וּבִקְעָן לִמְטַר שְׁמַיָּא תִּשְׁתֵּי מַיָּא:", "onk_en": "Rather, the land where you are crossing to inherit is a land of mountains and plains—by the rain of the skies will you drink water.", "pj": "וְאַרְעָא דְאַתּוּן עָבְרִין לְתַמָּן לְמֵירְתָהּ אֲרַע טַוְורִין וּבִקְעָן מִן מַטְרָא דְנָחִית מִן שְׁמַיָא שַׁתְיָא מוֹי", "pj_en": "but the land which you pass over to inherit is a land of mountains and valleys: it drinketh water from the rain that cometh down from the heavens;", "tj": "", "tj_en": "", "rashi": "<b>ארץ הרים ובקעת.<\/b> מְשֻׁבָּח הָהָר מִן הַמִּישׁוֹר, שֶׁהַמִּישׁוֹר בְּבֵית כֹּר אַתָּה זוֹרֵעַ כֹּר, אֲבָל הָהָר בֵּית כֹּר מִמֶּנּוּ חֲמֵשֶׁת כֹּרִין – אַרְבָּעָה מֵאַרְבָּעָה שִׁפּוּעָיו וְאֶחָד בְּרֹאשׁוֹ:<br><br><b>ובקעת.<\/b> הֵן מִישׁוֹר:", "rashi_en": "ארץ הרים ובקעת [THE LAND WHITHER THOU ART PASSING IS] A LAND OF HILLS AND VALLEYS — The mountain is better than the plain because in the plain, in an area that takes a Kor of seed, you can sow only a Kor, but in the mountain the summit of which is an area that takes a Kor, from it you have areas for five Kors of seed: four from its four slopes and one on its summit (Sifrei Devarim 39:3).<br><br>ובקעת — these are the plain lands."}, {"ch": 11, "v": 12, "aliyah": 6, "heb": "אֶ֕רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ דֹּרֵ֣שׁ אֹתָ֑הּ תָּמִ֗יד עֵינֵ֨י יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ בָּ֔הּ מֵֽרֵשִׁית֙ הַשָּׁנָ֔ה וְעַ֖ד אַחֲרִ֥ית שָׁנָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אַרְעָא דַּיְיָ אֱלָהָךְ תָּבַע יָתַהּ תְּדִירָא עֵינֵי יְיָ אֱלָהָךְ בַּהּ מֵרֵישָׁא דְּשַׁתָּא וְעַד סוֹפָא דְשַׁתָּא:", "onk_en": "A land that Adonoy, your God, looks after; the eyes of Adonoy, your God, are always upon it, from the year’s beginning until the year’s end.", "pj": "אַרְעָא דַיְיָ אֱלָהָךְ תְּבַע יָתֵהּ בְּמֵימְרֵיהּ לְאוֹטָבוּתָא תְּדִירָא עֵינֵי יְיָ אֱלָהָךְ מִסְתַּכְּלִין בָּהּ מִן שִׁירוּיָא דְשַׁתָּא עַד סוֹפָא דְשַׁתָּא", "pj_en": "it is a land which the Lord your God inquireth after by His Word, that He may bless it evermore; the eyes of the Lord your God look upon it from the beginning of the year to the year’s end.", "tj": "אַרְעָא דִי יְיָ אֱלָהָכוֹן תְּבַע יָתָהּ בִּתְדִירָא:", "tj_en": "A land which the Lord your God inquireth after continually.", "rashi": "<b>אשר ה' אלהיך דרש אתה.<\/b> וַהֲלֹא כָּל הָאֲרָצוֹת דוֹרֵשׁ, שֶׁנֶּאֱמַר \"לְהַמְטִיר עַל אֶרֶץ לֹא אִישׁ\" (איוב ל\"ח)? אֶלָּא כִּבְיָכוֹל אֵינוֹ דוֹרֵשׁ אֶלָּא אוֹתָהּ, וְעַל יְדֵי אוֹתָהּ דְּרִישָׁה שֶׁדּוֹרְשָׁהּ, דּוֹרֵשׁ אֶת כָּל הָאֲרָצוֹת עִמָּהּ:<br><br><b>תמיד עיני ה' אלהיך בה.<\/b> לִרְאוֹת מַה הִיא צְרִיכָה, וּלְחַדֵּשׁ בָּהּ גְּזֵרוֹת, עִתִּים לְטוֹבָה עִתִּים לְרָעָה כוּ', כִּדְאִיתָא בְּרֹ\"הַ (דף י\"ז):<br><br><b>מרשית השנה.<\/b> מֵרֹאשׁ הַשָּׁנָה נִדּוֹן מַה יְּהֵא בְּסוֹפָהּ (שם ח'):", "rashi_en": "אשר ה' אלהיך דרש אתה [A LAND] WHICH THE LORD THY GOD CARETH FOR — But does He not care for all lands, as it said, (Job 38:26) “[Who hath cleft a way for the lightning of the thunder …] to cause rain even on a land where no man is\"? But, if one can say so of God, He cares for that land alone, but through the care which He bestows on it, He cares also for all other lands with it (Sifrei Devarim 40:1).<br><br>תמיד עיני ה' אלהיך בה THE EYES OF THE LORD THY GOD ARE ALWAYS UPON IT, to see what it requires, and to make new dispensations for it, sometimes for good and sometimes for bad, as is stated in Treatise Rosh Hashanah 17b.<br><br>מרשית השנה FROM THE BEGINNING OF THE YEAR [TO THE END OF THE YEAR] — At the beginning of the year it is decided by God what will be right up to the end of it (Rosh Hashanah 8a)."}, {"ch": 11, "v": 13, "aliyah": 6, "heb": "וְהָיָ֗ה אִם־שָׁמֹ֤עַ תִּשְׁמְעוּ֙ אֶל־מִצְוֺתַ֔י אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְכֶ֖ם הַיּ֑וֹם לְאַהֲבָ֞ה אֶת־יְהֹוָ֤ה אֱלֹֽהֵיכֶם֙ וּלְעׇבְד֔וֹ בְּכׇל־לְבַבְכֶ֖ם וּבְכׇל־נַפְשְׁכֶֽם׃", "onk": "וִיהֵי אִם קַבָּלָא תְקַבְּלוּן לְפִקּוֹדַי דִּי אֲנָא מְפַקֵּד יָתְכוֹן יוֹמָא דֵין לְמִרְחַם יָת יְיָ אֱלָהֲכוֹן וּלְמִפְלַח <b>קֳדָמוֹהִי<\/b> בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן:", "onk_en": "Should you thoroughly heed My commandments that I am commanding you today—to love Adonoy, your God, and to serve [<b>before<\/b>] Him with all your desires and with your entire beings,", "pj": "וִיהֵי אִין קַבָּלָא תְקַבְּלוּן לְפִקוּדַי דַאֲנָא מְפַקֵּיד יַתְכוֹן יוֹמָא הָדֵין לְמִרְחַם יַת יְיָ אֱלָהָכוֹן וּלְמִפְלַח קֳדָמוֹי בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן", "pj_en": "And it shall be that if you diligently obey My commandments which I command you this day, to love the Lord your God, and to serve Him with all your heart, and with all your soul,", "tj": "", "tj_en": "", "rashi": "<b>והיה אם שמע.<\/b> וְהָיָה מוּסָב עַל הָאָמוּר לְמַעְלָה, לִמְטַר הַשָּׁמַיִם תִּשְׁתֶּה מָּיִם:<br><br><b>והיה אם שמע תשמעו.<\/b> אִם שָׁמֹעַ בַּיָּשָׁן תִּשְׁמְעוּ בֶּחָדָשׁ, וְכֵן \"אִם שָׁכֹחַ תִּשְׁכַּח\" (דברים ח') – אִם הִתְחַלְתָּ לִשְׁכֹּחַ סוֹפְךָ שֶׁתִּשְׁכַּח כֻּלָּהּ, שֶׁכֵּן כְּתִיב בִּמְגִלָּה אִם תַּעַזְבֵנִי יוֹם יוֹמַיִם אֶעֶזְבֶךָּ:<br><br><b>מצוה אתכם היום.<\/b> שֶׁיִּהְיוּ עֲלֵיכֶם חֲדָשִׁים, כְּאִלּוּ שְׁמַעְתֶּם בּוֹ בַיּוֹם (ספרי):<br><br><b>לאהבה את ה'.<\/b> שֶׁלֹּא תֹאמַר הֲרֵי אֲנִי לוֹמֵד בִּשְׁבִיל שֶׁאֶהְיֶה עָשִׁיר, בִּשְׁבִיל שֶׁאֶקָּרֵא רַב, בִּשְׁבִיל שֶׁאֲקַבֵּל שָׂכָר, אֶלָּא כָּל מַה שֶּׁתַּעֲשֶׂה עֲשֵׂה מֵאַהֲבָה וְסוֹף הַכָּבוֹד לָבֹא (שם):<br><br><b>ולעבדו בכל לבבכם.<\/b> עֲבוֹדָה שֶׁהִיא בַּלֵּב, וְזוֹ הִיא תְפִלָּה, שֶׁהַתְּפִלָּה קְרוּיָה עֲבוֹדָה, שֶׁנֶּאֱמַר \"אֱלָהָךְ דִּי אַנְתְּ פָּלַח לֵהּ בִּתְדִירָא\" (דניאל ו'), וְכִי יֵשׁ פֻּלְחָן בְּבָבֶל? אֶלָּא עַל שֶׁהָיָה מִתְפַּלֵּל שֶׁנֶּאֱמַר (שם) \"וְכַוִּין פְּתִיחָן לֵהּ וְגוֹ'\"; וְכֵן בְּדָוִד הוּא אוֹמֵר (תהילים קמ\"א) \"תִּכּוֹן תְּפִלָּתִי קְטֹרֶת לְפָנֶיךָ\":<br><br><b>בכל לבבכם ובכל נפשכם.<\/b> וַהֲלֹא כְּבָר הִזְהִיר \"בְּכָל לְבָבְךָ וּבְכָל נַפְשְׁךָ\" (דברים ו'), אֶלָּא אַזְהָרָה לַיָּחִיד, אַזְהָרָה לַצִּבּוּר (ספרי):", "rashi_en": "והיה אם שמע AND IT SHALL COME TO PASS IF YE WILL HEARKEN — The word והיה is to be connected with what is said above (v. 11): “it drinketh water of the rain of heaven”.<br><br>שמע תשמעו lit: AND IT WILL COME TO PASS IF HEARKENING YE WILL HEARKEN — If you hearken to the old (if you hear again what you have already learnt, i.e. if you repeatedly study the old lessons), you will hearken to the new (you will the more easily gain new knowledge) (Sukkah 46b; cf. Rashi on Exodus 19:5). Similar is the meaning of אם שכח תשכח (Deuteronomy 8:19): If you have begun to forget, your end will be that you will forget all of it. So, too, is written in a certain Scroll: If thou forgettest Me one day, I will forget thee two days (cf. Sifrei Devarim 48:8; Jerusalem Talmud end of Berakhot).<br><br>מצוה אתכם היום [MY COMMANDMENTS WHICH I] COMMAND YOU THIS DAY — This suggests that they should ever be to you as new commandments, as though you had heard them for the first time on that day (Sifrei Devarim 58).<br><br>לאהבה את ה׳ TO LOVE THE LORD — This means that you should not say: Well, I will learn, but in order that I may become rich, in order that I may obtain the title Rabbi, in order that I may receive a prize, — but whatever you do, do it out of love for God (Sifrei Devarim 41:23), and ultimately the honour which you desire will certainly come (Nedarim 62a).<br><br>ולעבדו בכל לבבכם AND TO SERVE HIM WITH ALL YOUR HEART — i.e. to serve Him with a service that is in the heart: that is prayer, for prayer is termed service (עבודה), as it is said, (Daniel 6:17) “Thy God whom thou servest continually”. But was there service (i.e. sacrificial service, the technical term for which is עבודה) in Babylon? But the term is used because he offered prayer there, as it is said, (Daniel 6:11) “Now his windows were open [in his upper chamber towards Jerusalem and he kneeled upon his knees three times a day and prayed]”. And so, too, it states in the case of David (Psalms 141:2): “Let my prayer be set forth as incense before Thee” (incense being part of the sacrificial service) (Sifrei Devarim 41:25-27).<br><br>בכל לבבכם ובכל נפשכם [TO LOVE THE LORD] WITH ALL YOUR HEART AND WITH ALL YOUR SOUL — But has it not already admonished us to love God, by the words (6:5) “[Thou shall love the Lord thy God] with all thy heart and with all thy soul”? But that was an admonition addressed to each and every individual (“with all thy heart”), whilst here it is an admonition addressed to them as a community (“with all your heart”) (Sifrei Devarim 41:29)."}, {"ch": 11, "v": 14, "aliyah": 6, "heb": "וְנָתַתִּ֧י מְטַֽר־אַרְצְכֶ֛ם בְּעִתּ֖וֹ יוֹרֶ֣ה וּמַלְק֑וֹשׁ וְאָסַפְתָּ֣ דְגָנֶ֔ךָ וְתִירֹֽשְׁךָ֖ וְיִצְהָרֶֽךָ׃", "onk": "וְאֶתֵּן מְטַר אַרְעֲכוֹן בְּעִדָּנֵיהּ בַּכִּיר וְלַקִּישׁ וְתִכְנוֹשׁ עִבּוּרָךְ וְחַמְרָךְ וּמִשְׁחָךְ:", "onk_en": "I will provide the rain of your land in its time, fall rain and spring rain, and you will harvest your grain and your wine and your olive oil.", "pj": "וְאֶתֵּן מִטְרָא דְאַרְעֲכוֹן בְּעִידְנֵיהּ בַּכִּיר בְּמַרְחֶשְׁוָן וְלָקִישׁ בְּנִיסָן וְתִכְנְשׁוּן עִבּוּרֵיכוֹן חַמְרֵיכוֹן וּמִשְׁחֵיכוֹן", "pj_en": "then will I give you the rain of your land in its time, the early in Marchesvan, and the latter in Nisan, that you may gather in your corn, your wine., and your oil.", "tj": "", "tj_en": "", "rashi": "<b>ונתתי מטר ארצכם.<\/b> עֲשִׂיתֶם מַה שֶּׁעֲלֵיכֶם אַף אֲנִי אֶעֱשֶׂה מַה שֶּׁעָלַי (שם):<br><br><b>בעתו.<\/b> בַּלֵּילוֹת שֶׁלֹּא יַטְרִיחוּ אֶתְכֶם; דָּ\"אַ – בְּעִתּוֹ בְּלֵילֵי שַׁבָּתוֹת שֶׁהַכֹּל מְצוּיִין בְּבָתֵּיהֶם:<br><br><b>יורה.<\/b> הִיא רְבִיעָה הַנּוֹפֶלֶת לְאַחַר הַזְּרִיעָה, שֶׁמַּרְוָה אֶת הָאָרֶץ וְאֶת הַזְּרָעִים:<br><br><b>מלקוש.<\/b> רְבִיעָה הַיּוֹרֶדֶת סָמוּךְ לַקָּצִיר, לְמַלֹּאת הַתְּבוּאָה בְּקַשֶּׁיהָ. וּלְשׁוֹן מַלְקוֹשׁ דָּבָר הַמְאֻחָר כְּדִמְתַרְגְּמִינָן (בראשית ל') \"וְהָיָה הָעֲטֻפִים לְלָבָן\" – לַקִּישַׁיָּא; דָּ\"אַ – לְכָךְ נִקְרֵאת מַלְקוֹשׁ, שֶׁיּוֹרֶדֶת עַל הַמְּלִילוֹת וְעַל הַקַּשִּׁין:<br><br><b>ואספת דגנך.<\/b> אַתָּה תַאַסְפֶנּוּ אֶל הַבַּיִת וְלֹא אוֹיְבֶיךָ, כָּעִנְיָן שֶׁנֶּאֱמַר \"אִם אֶתֵּן דְּגָנֵךְ וְגוֹ' כִּי מְאַסְפָיו יֹאכְלֻהוּ\" (ישעיהו ס\"ב) וְלֹא כָעִנְיָן שֶׁנֶּאֱמַר \"וְהָיָה אִם זָרַע יִשְׂרָאֵל וְגוֹ'\" (שופטים ו'):", "rashi_en": "ונתתי מטר ארצכם I WILL GIVE THE RAIN OF YOUR LAND [IN ITS SEASON] — You will then have done what devolved upon you, I, too, shall do what devolves upon Me (Sifrei Devarim 41:29; cf. Rashi on Deuteronomy 26:15). <br><br>בעתו [RAIN …] IN ITS SEASON — i.e. at night time, so that it may not cause you any trouble. — Another explanation of בעתו IN ITS SEASON is: on Sabbath (Friday) nights when everyone is usually at home (cf. Sifrei Devarim 42:2; Taanit 23a; see Rashi on Leviticus 26:4). <br><br>יורה THE FIRST RAIN — This is the rain that falls after the sowing-time, which thoroughly drenches (מרוה) the soil and the seed (Sifrei Devarim 42:4; Taanit 6a).<br><br>מלקוש THE LATTER RAIN is the rain that descends just before the harvest time to make the grain full (ripe) on its stalk. The term מלקוש refers to something that is late, just as in the Targum we translate והיה העטפים ללבן (Genesis 30:42; see Rashi thereon) “those born late were Laban’s” by לקשיא. — Another explanation: The reason why it is called מלקוש is because it falls at the same period upon the ears (מלילות) and the stalks (קש) (i.e. just before the harvest) (Taanit 6a).<br><br>ואספת דגנך AND THOU SHALT GATHER IN THY CORN means: and thou shalt gather it into thy house, and not thy enemies, just as it is said, (Isaiah 62:8—9) “[The Lord hath sworn … ], surely I will no more give thy corn [to be food for thine enemies], but they that have gathered it shall eat it”; and not as it is said, (Judges 6:3) “And so it was when Israel had sown that the Midianites came up [and destroyed the produce of the land]” (Sifrei Devarim 42:10)."}, {"ch": 11, "v": 15, "aliyah": 6, "heb": "וְנָתַתִּ֛י עֵ֥שֶׂב בְּשָׂדְךָ֖ לִבְהֶמְתֶּ֑ךָ וְאָכַלְתָּ֖ וְשָׂבָֽעְתָּ׃", "onk": "וְאֶתֵּן עִשְׂבָּא בְחַקְלָךְ לִבְעִירָךְ וְתֵיכוּל וְתִשְׂבָּע:", "onk_en": "And I will provide grass in your field for your animals, and you will eat and be full.", "pj": "וְאֶתֵּן עִסְבָּא בְּחַקְלָךְ לִבְעִירָךְ וְתֵיכוּל וְתִסְבַּע", "pj_en": "I will give herbage also in thy field for thy cattle, that thou mayest eat and have enough.", "tj": "", "tj_en": "", "rashi": "<b>ונתתי עשב בשדך.<\/b> שֶׁלֹּא תִצְטָרֵךְ לְהוֹלִיכָהּ לַמִּדְבָּרוֹת. דָּ\"אַ — שֶׁתִּהְיֶה גּוֹזֵז תְּבוּאָתְךָ כָּל יְמוֹת הַגְּשָׁמִים וּמַשְׁלִיךְ לִפְנֵי בְהֶמְתְּךָ וְאַתָּה מוֹנֵעַ יָדְךָ מִמֶּנָּה שְׁלוֹשִׁים יוֹם קֹדֶם לַקָּצִיר וְאֵינָהּ פּוֹחֶתֶת מִדְּגָנָהּ (ספרי):<br><br><b>ואכלת ושבעת.<\/b> הֲרֵי זוֹ בְרָכָה אַחֶרֶת שֶׁתְּהֵא בְרָכָה מְצוּיָה בַּפַּת בְּתוֹךְ הַמֵּעַיִם <b>ואכלת ושבעת<\/b>:", "rashi_en": "ונתתי עשב בשדך AND I WILL GIVE GRASS IN THY FIELD [FOR THY CATTLE] in thy field: so that you will not need to lead them to distant pasture grounds. Another explanation: it means that you will be able to cut your grain all the rainy season and cast it before thy cattle as fodder, and if you withdraw your hand from it (stop doing this) only thirty days before the harvest, it will not give you less of its corn than if you had not fed your cattle with it (as is implied by ואכלת ושבעת, you will eat to the full) (Sifrei Devarim 43:2).<br><br>ואכלת ושבעת AND THOU SHALT EAT AND BE SATISFIED — This is quite another (a separate) blessing; it means that a blessing will be on the bread within the stomach (see Rashi on Leviticus 25:19). השמרו לכם "}, {"ch": 11, "v": 16, "aliyah": 6, "heb": "הִשָּֽׁמְר֣וּ לָכֶ֔ם פֶּ֥ן יִפְתֶּ֖ה לְבַבְכֶ֑ם וְסַרְתֶּ֗ם וַעֲבַדְתֶּם֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וְהִשְׁתַּחֲוִיתֶ֖ם לָהֶֽם׃", "onk": "אִסְתַּמָּרוּ לְכוֹן דִּילְמָא <b>יִטְעוּן<\/b> לִבְּכוֹן וְתִסְטוּן וְתִפְלְחוּן לְ<b>טַעֲוַת עַמְמַיָּא<\/b> וְתִסְגְּדוּן לְהוֹן:", "onk_en": "Look out for yourselves lest your heart be misled [<b>mistaken<\/b>] and you turn away and serve other gods [<b>idols of the nations<\/b>] and bow to them,", "pj": "אִסְתַּמָּרוּ לְכוֹן דִּילְמָא יִטְעֵי יִצְרָא דְלִבְּכוֹן וְתִסְטוּן וְתִפְלְחוּן לְטַעֲוַות עַמְמַיָא וְתִסְגְּדוּן לְהוֹן", "pj_en": "Take heed to yourselves, lest you be led away by the imagination of your heart, and turn aside to serve the idols of the Gentiles, and worship them,", "tj": "", "tj_en": "", "rashi": "<b>השמרו לכם.<\/b> כֵּיוָן שֶׁתִּהְיוּ אוֹכְלִים וּשְׂבֵעִים הִשָּׁמְרוּ לָכֶם שֶׁלֹּא תִבְעֲטוּ, שֶׁאֵין אָדָם מוֹרֵד בְּהַקָּדוֹשׁ בָּרוּךְ הוּא אֶלָּא מִתּוֹךְ שְׂבִיעָה, שֶׁנֶּאֱמַר \"פֶּן תֹּאכַל וְשָׂבָעְתָּ וּבְקָרְךָ וְצֹאנְךָ יִרְבְּיֻן\" (דברים ח'), מַה הוּא אוֹמֵר אַחֲרָיו? \"וְרָם לְבָבֶךָ וְשָׁכַחְתָּ\":<br><br><b>וסרתם.<\/b> לִפְרֹשׁ מִן הַתּוֹרָה, וּמִתּוֹךְ כָּךְ <b>ועבדתם אלהים אחרים<\/b>, שֶׁכֵּיוָן שֶׁאָדָם פּוֹרֵשׁ מִן הַתּוֹרָה הוֹלֵךְ וּמִדַּבֵּק בַּעֲ\"זָ, וְכֵן דָּוִד אוֹמֵר \"כִּי גֵרְשׁוּנִי הַיּוֹם מֵהִסְתַּפֵּחַ בְּנַחֲלַת ה' לֵאמֹר לֵךְ עֲבֹד וְגוֹ'\" (שמואל א כ\"ו), וּמִי אָמַר לוֹ כֵן? אֶלָּא כֵּיוָן שֶׁאֲנִי מְגֹרָשׁ מִלַּעֲסֹק בַּתּוֹרָה, הֲרֵינִי קָרוֹב לַעֲבֹד אֱלֹהִים אֲחֵרִים:<br><br><b>אלהים אחרים.<\/b> שֶׁהֵם אֲחֵרִים לְעוֹבְדֵיהֶם – צוֹעֵק אֵלָיו וְאֵינוֹ עוֹנֵהוּ, נִמְצָא עָשׂוּי לוֹ כְּנָכְרִי (ספרי):", "rashi_en": "TAKE HEED [THAT YOUR HEART MISLEAD YOU NOT] — when you have eaten and are full, take heed to yourselves that you kick not against God; for usually no man rebels against the Holy One, blessed be He, except out of satiety, as it is said, (Deuteronomy 8:12—14) “Lest thou eat and art full … and thy herds and flocks increase”. What is stated after this? “And thy heart be lifted up and thou forget [the Lord thy God]” (Sifrei Devarim 43:7).<br><br>וסרתם AND YE TURN ASIDE, to depart from the Torah, and through this, ועבדתם אלהים אחרים YE WILL SERVE OTHER GODS, for so soon as a man departs from the Torah he goes and clings to idol-worship. Similarly did David say, (I Samuel 26:19) “For they have driven me out this day, that I should not cleave to the inheritance of the Lord (the Torah) saying, Go, serve other gods”. But who had really said thus to him?! But he meant: Since I am driven out so that I can no longer occupy myself with the Torah, I am nearly exposed to the danger of serving other gods (Sifrei Devarim 43:14).<br><br>אלהים אחרים OTHER GODS — i.e. gods that are other (alien) to those who worship them: one calls to it, and it does not answer him; consequently it becomes to him like a stranger (Sifrei Devarim 43:17)."}, {"ch": 11, "v": 17, "aliyah": 6, "heb": "וְחָרָ֨ה אַף־יְהֹוָ֜ה בָּכֶ֗ם וְעָצַ֤ר אֶת־הַשָּׁמַ֙יִם֙ וְלֹֽא־יִהְיֶ֣ה מָטָ֔ר וְהָ֣אֲדָמָ֔ה לֹ֥א תִתֵּ֖ן אֶת־יְבוּלָ֑הּ וַאֲבַדְתֶּ֣ם מְהֵרָ֗ה מֵעַל֙ הָאָ֣רֶץ הַטֹּבָ֔ה אֲשֶׁ֥ר יְהֹוָ֖ה נֹתֵ֥ן לָכֶֽם׃", "onk": "וְיִתְקוֹף רָגְזָא דַיְיָ בְּכוֹן וְיֵחוֹד יָת שְׁמַיָּא וְלָא יְהֵי מִטְרָא וְאַרְעָא לָא תִתֵּן יָת עֲלַלְתַּהּ וְתֵיבְדוּן בִּפְרִיעַ מֵעַל אַרְעָא טַבְתָא דַּיְיָ יָהֵב לְכוֹן:", "onk_en": "And Adonoy’s anger will be aroused against you, and He will restrain the skies and there will be no rain, and the soil will not yield its produce, and you will swiftly be removed from upon the good land that Adonoy is giving you.", "pj": "וְיִתְקֵף רוּגְזָא דַיְיָ בְּכוֹן וְיֵיחוּד יַת עֲנָנֵי שְׁמַיָא דְלָא יֵחְתוּן מַטְרָא וְאַרְעָא לָא תִתֵּן עֲלַלְתָּהּ וְתֵיבְדוּן בְּסַרְהוֹבַיָא מֵעִלַוֵי אַרְעָא מְשַׁבְּחָא דַיְיָ יָהֵיב לְכוֹן", "pj_en": "and the Lord’s anger be provoked against you, and He shut up the clouds of heaven, and let not the rain come down, and the earth yield no provender, and you perish soon from off the glorious land which the Lord shall give you.", "tj": "", "tj_en": "", "rashi": "<b>את יבולה.<\/b> אַף מַה שֶּׁאַתָּה מוֹבִיל לָהּ, כָּעִנְיָן שֶׁנֶּאֱמַר (חגי א') זְרַעְתֶּם הַרְבֵּה וְהָבֵא מְעָט (ספרי):<br><br><b>ואבדתם מהרה.<\/b> עַל כָּל שְׁאָר הַיִּסּוּרִין אַגְלֶה אֶתְכֶן מִן הָאֲדָמָה שֶׁגָּרְמָה לָכֶם לַחֲטֹא; מָשָׁל לְמֶלֶךְ שֶׁשָּׁלַח בְּנוֹ לְבֵית הַמִּשְׁתֶּה וְהָיָה יוֹשֵׁב וּמַפְקִידוֹ אַל תֹּאכַל יוֹתֵר מִצָּרְכְּךָ, שֶׁתָּבֹא נָקִי לְבֵיתְךָ, וְלֹא הִשְׁגִּיחַ הַבֵּן הַהוּא, אָכַל וְשָׁתָה יוֹתֵר מִצָּרְכּוֹ, וְהֵקִיא וְטִנֵּף אֶת כָּל בְּנֵי הַמְּסִבָּה, נְטָלוּהוּ בְיָדָיו וּבְרַגְלָיו וּזְרָקוּהוּ אֲחוֹרֵי פַּלְטְרִין (שם):<br><br><b>מהרה.<\/b> אֵינִי נוֹתֵן לָכֶם אַרְכָּא, וְאִם תֹּאמְרוּ וַהֲלֹא נִתְּנָה אַרְכָּא לְדוֹר הַמַּבּוּל שֶׁנֶּאֱמַר וְהָיוּ יָמָיו מֵאָה וְעֶשְׂרִים שָׁנָה (בראשית ו') דּוֹר הַמַּבּוּל לֹא הָיָה לָהֶם מִמִּי לִלְמֹד וְאַתֶּם יֵשׁ לָכֶם מִמִּי לִלְמֹד (ספרי):", "rashi_en": "את יבולה [THE GROUND WILL NOT GIVE] ITS יבול — it will not yield even as much as what you have brought (יבול) to it (even the same quantity of seed you have sown in it), just as it is said, (Hag. 1:6) “You sow much, but bring in little” (Sifrei Devarim 43:28; cf. Rashi on Leviticus 26:20).<br><br>ואבדתם מהרה AND YE SHALL PERISH QUICKLY — In addition to all the other sufferings I will banish you from the soil which made you sin (Sifrei Devarim 43:29). A parable! It may be compared to the case of a king who sent his son to the banqueting hall and earnestly charged him, “Do not eat more than you need, in order that you may come home clean!” The son, however, took no notice of this; he ate and drank more than he needed, and vomited it up and befouled all the company. They took him by his hands and feet and cast him out of the palace (Sifrei Devarim 43:23).<br><br>מהרה [AND YE SHALL PERISH] QUICKLY — I will give you no respite. But if you ask: Was not respite given to the generation of the flood, as it is said, (Genesis 6:3) “His days shall be (i.e. a respite shall be given him for) one hundred and twenty years”? Then I reply: The generation of flood had no one from whom to learn, but you have someone from whom to learn (Sifrei Devarim 43:31)."}, {"ch": 11, "v": 18, "aliyah": 6, "heb": "וְשַׂמְתֶּם֙ אֶת־דְּבָרַ֣י אֵ֔לֶּה עַל־לְבַבְכֶ֖ם וְעַֽל־נַפְשְׁכֶ֑ם וּקְשַׁרְתֶּ֨ם אֹתָ֤ם לְאוֹת֙ עַל־יֶדְכֶ֔ם וְהָי֥וּ לְטוֹטָפֹ֖ת בֵּ֥ין עֵינֵיכֶֽם׃", "onk": "וּתְשַׁוּוּן יָת פִּתְגָּמַי אִלֵּין עַל לִבְּכוֹן וְעַל נַפְשְׁכוֹן וְתִקְטְרוּן יָתְהוֹן לְאָת עַל יֶדְכוֹן וִיהוֹן <b>לִתְפִלִּין<\/b> בֵּין עֵינֵיכוֹן:", "onk_en": "You are to place these words of Mine on your mind and on your being, and bind them as a sign on your hand and they will be <i>totafos<\/i> [<b>tefillin<\/b>] on your head;", "pj": "וּתְשַׁוּוּן יַת פִּתְגָמַי אִלֵין עַל לִבְּכוֹן וְעַל נַפְשְׁכוֹן וְתִקְטוֹרוּן יַתְהוֹן כַּד הִנּוּן כְּתִיבִין עַל תְּפִילָא לְאָת עַל רוּם יֶדְכוֹן שְמָאלִיתָא וִיהוֹן לִתְפִילִין קֳבֵיל מוֹקְדֵיכוֹן בֵּין עֵינֵיכוֹן", "pj_en": "But lay these my words upon your heart, and upon your soul, and bind them, written upon tephillin, as a sign upon the upper part (wrist?) of your left hands, and let them be for tephillin over thy forehead between thy eyes.", "tj": "", "tj_en": "", "rashi": "<b>ושמתם את דברי.<\/b> אַף לְאַחַר שֶׁתִּגְלוּ הֱיוּ מְצֻיָּנִים בַּמִּצְווֹת, הַנִּיחוּ תְּפִלִּין, עֲשׂוּ מְזוּזוֹת, כְּדֵי שֶׁלֹּא יִהְיוּ לָכֶם חֲדָשִׁים כְּשֶׁתַּחְזְרוּ, וְכֵן הוּא אוֹמֵר (ירמיהו ל\"א) הַצִּיבִי לָךְ צִיֻּנִים (ספרי):", "rashi_en": "ושמתם את דברי AND YE SHALL PLACE MY WORDS [UPON YOUR HEART] — Even after you have been banished make yourselves distinctive by means of My commands: lay Tephillin, attach Mezuzoth to your doorposts, so that these shall not be novelties to you when you return. Similarly does it state, (Jeremiah 31:21) “Set thee up distinguishing marks” (Sifrei Devarim 43:34)."}, {"ch": 11, "v": 19, "aliyah": 6, "heb": "וְלִמַּדְתֶּ֥ם אֹתָ֛ם אֶת־בְּנֵיכֶ֖ם לְדַבֵּ֣ר בָּ֑ם בְּשִׁבְתְּךָ֤ בְּבֵיתֶ֙ךָ֙ וּבְלֶכְתְּךָ֣ בַדֶּ֔רֶךְ וּֽבְשׇׁכְבְּךָ֖ וּבְקוּמֶֽךָ׃", "onk": "וְתַלְּפוּן יָתְהוֹן יָת בְּנֵיכוֹן לְמַלָּלָא בְהוֹן בְּמִתְּבָךְ בְּבֵיתָךְ וּבִמְהָכָךְ בְּאָרְחָא וּבְמִשְׁכְּבָךְ וּבִמְקִימָךְ:", "onk_en": "And you are to teach them to your sons to speak in them when you sit at home, and when you journey on the road, and when you go to sleep, and when you rise;", "pj": "וְתַלְפוּן יַתְהוֹן יַת בְּנֵיכוֹן לִמְגַרְסָא בְּהוֹן בְּמִתְבֵיכוֹן בְּבָתֵּיכוֹן עִם חִיתּוּנְכוֹן וּבְמִיהֲכֵכוֹן בְּאָרְחָא וּבְפַנְיָא סְמִיךְ לְמִשְׁכַּבְכוֹן וּבְצַפְרָא סְמִיךְ לְמִקְמֵיכוֹן", "pj_en": "And thou shalt teach them to thy children to study them when you are sitting in your house with your kindred, and when you are walking in the way, and in the evening when you lie down, and in the morning when you arise.", "tj": "וּבִדְמִיכְכוֹן וּבְקִימְכוֹן:", "tj_en": "And when you repose, and when you rise up.", "rashi": "<b>לדבר בם.<\/b> מִשָּׁעָה שֶׁהַבֵּן יוֹדֵעַ לְדַבֵּר, לַמְּדֵהוּ \"תּוֹרָה צִוָּה לָנוּ מֹשֶׁה\" שֶׁיְּהֵא זֶה לִמּוּד דִּבּוּרוֹ; מִכָּאן אָמְרוּ כְּשֶׁהַתִּינוֹק מַתְחִיל לְדַבֵּר אָבִיו מֵשִׂיחַ עִמּוֹ בִּלְשׁוֹן הַקֹּדֶשׁ וּמְלַמְּדוֹ תוֹרָה, וְאִם לֹא עָשָׂה כֵן הֲרֵי הוּא כְאִלּוּ קוֹבְרוֹ, שֶׁנֶּאֱמַר <b>ולמדתם אתם את בניכם לדבר בם וגו'.<\/b>", "rashi_en": "לדבר בם [AND YE SHALL TEACH THEM UNTO YOUR CHILDREN,] TO SPEAK OF THEM — From the moment when your son knows how to speak, teach him the text (Deuteronomy 33:4) “Moses commanded us the Torah as a possession of the congregation of Jacob” — so that this should be the means of teaching him to speak (Sukkah 42a). From this they (the Rabbis) derived their teaching: When the babe begins to speak, his father should speak with him in the Holy Tongue, and should instruct him in the Torah. If he does not do this, it is as though he buries him, as it is said here, “And ye shall teach them unto your children to speak of them, etc.”,"}, {"ch": 11, "v": 20, "aliyah": 6, "heb": "וּכְתַבְתָּ֛ם עַל־מְזוּז֥וֹת בֵּיתֶ֖ךָ וּבִשְׁעָרֶֽיךָ׃", "onk": "וְתִכְתְּבִנּוּן עַל מְזוּזְיָן <b>וְתִקְבְּעִנּוּן בְּסִפֵּי<\/b> בֵיתָךְ וּבְתַרְעָךְ:", "onk_en": "And you are to write them on the doorposts [<b>and affix them to the lintels<\/b>] of your home and your gateways.", "pj": "וְתִכְתְּבִינוּן בִּמְגִילְתָּא עַל מְזוּזְיַין וְתִקְבְּעִינוּן בְּתוֹלְתָּא קֳבֵל תִּקֵי בְּסִיפֵי בָתֵּיכוֹן וּבְתַרְעֵיכוֹן", "pj_en": "And you shall write them upon parchment, upon the posts, and affix them to three (things), against thy chest, against the pillars of thy house, and against thy gates:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 21, "aliyah": 6, "heb": "לְמַ֨עַן יִרְבּ֤וּ יְמֵיכֶם֙ וִימֵ֣י בְנֵיכֶ֔ם עַ֚ל הָֽאֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהֹוָ֛ה לַאֲבֹתֵיכֶ֖ם לָתֵ֣ת לָהֶ֑ם כִּימֵ֥י הַשָּׁמַ֖יִם עַל־הָאָֽרֶץ<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן הָאָֽרֶ<big>ץ<\/big> בצד״י גדולה)<\/i>׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּדִיל דְּיִסְגּוּן יוֹמֵיכוֹן וְיוֹמֵי בְנֵיכוֹן עַל אַרְעָא דִּי קַיִּים יְיָ לַאֲבָהָתְכוֹן לְמִתַּן לְהוֹן כְּיוֹמֵי שְׁמַיָּא עַל אַרְעָא:", "onk_en": "In order that they will be many—your years and the years of your children on the soil that Adonoy swore to your forefathers to give them, like the years of heaven on earth.", "pj": "מִן בִּגְלַל דְּיִסְגוּן יוֹמֵיכוֹן וְיוֹמֵי בְּנֵיכוֹן עַל אַרְעָא דְקַיֵּים יְיָ לְאַבְהַתְכוֹן לְמִיתְנָא לְהוֹן כִּסְכוֹם יוֹמִין דְּקַיְימִין שְׁמַיָא עַל אַרְעָא", "pj_en": "that your days and the days of your children may be multiplied on the land which the Lord sware to your fathers to give you, as the number of the days that the heavens abide over the earth.", "tj": "", "tj_en": "", "rashi": "<b>למען ירבו ימיכם וימי בניכם.<\/b> אִם עֲשִׂיתֶם כֵּן יִרְבּוּ, וְאִם לָאו לֹא יִרְבּוּ, שֶׁדִּבְרֵי תוֹרָה נִדְרָשִׁין מִכְּלַל לָאו הֵן וּמִכְּלַל הֵן לָאו (ספרי):<br><br><b>לתת להם.<\/b> לָתֵת לָכֶם אֵין כְּתִיב כָּאן, אֶלָּא לָתֵת לָהֶם, מִכָּאן מָצִינוּ לְמֵדִים תְּחִיַּת הַמֵּתִים מִן הַתּוֹרָה:", "rashi_en": "למען ירבו ימיכם וימי בניכם IN ORDER THAT YOUR DAYS MAY BE INCREASED AND THE DAYS OF YOUR CHILDREN — We may learn from this that if you do so, then they will be increased, but if not, they will not be increased, for the statements of the Torah may be expounded so as to derive from the negative the positive, and from the positive, the negative (Sifrei Devarim 46).<br><br>לתת להם [THE LA
