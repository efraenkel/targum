orms and whatever is similar to anything similar to it (Sifra, Shemini, Chapter 12 2).<br><br>הולך על ארבע THAT GOETH UPON ALL FOUR — This is the scorpion (Sifra, Shemini, Chapter 12 2). <br><br>כל EVERYTHING [THAT GOETH UPON ALL FOUR] — The word “everything” is intended to include the beetle, —  escarbot in O. F. — and whatever is similar to anything similar to it (Sifra, Shemini, Chapter 12 2).<br><br>מרבה רגלים [AND] WHAT HATH MANY FEET — This is the centipede  (Sifra, Shemini, Chapter 12 2) — an insect which has feet from its head to its tail on both sides of its body, and it is called centpies in old French"}, {"ch": 11, "v": 43, "aliyah": 7, "heb": "אַל־תְּשַׁקְּצוּ֙ אֶת־נַפְשֹׁ֣תֵיכֶ֔ם בְּכׇל־הַשֶּׁ֖רֶץ הַשֹּׁרֵ֑ץ וְלֹ֤א תִֽטַּמְּאוּ֙ בָּהֶ֔ם וְנִטְמֵתֶ֖ם בָּֽם׃", "onk": "לָא תְשַׁקְּצוּ יָת נַפְשָׁתֵיכוֹן בְּכָל רִחֲשָׁא דְּרָחֵשׁ וְלָא תִסְתַּאֲבוּן בְּהוֹן וְתִסְתַּאֲבוּן פּוֹן בְּהוֹן:", "onk_en": "Do not make yourselves repulsive by [eating] any creeping creature that crawls, and do not make yourselves unclean with them, for you will become unclean because of them.", "pj": "לָא תְשַׁקְצוּן יַת נַפְשָׁתֵיכוֹן בְּכָל רִיחֲשָׁא דִרְחֵישׁ וְלָא תִסְתַּאֲבוּן בְּהוֹן דִילְמָא תִּסְתַּאֲבוּן פּוֹן בְּהוֹן", "pj_en": "You shall not contaminate your souls by any reptile that creepeth, nor defile yourselves with them, lest by them you make yourselves unclean.", "tj": "", "tj_en": "", "rashi": "<b>אל תשקצו.<\/b> בַּאֲכִילָתָן, שֶׁהֲרֵי כְּתִיב נַפְשֹׁתֵיכֶם וְאֵין שִׁקּוּץ נֶפֶשׁ בְּמַגָּע, וְכֵן וְלֹא תְטַמְּאוּ בַּאֲכִילָתָם:<br><br><b>ונטמתם בם.<\/b> אִם אַתֶּם מִטַּמְּאִין בָּהֶם בָּאָרֶץ, אַף אֲנִי מְטַמֵּא אֶתְכֶם בָּעוֹלָם הַבָּא וּבִישִׁיבַת מַעְלָה (יומא ל\"ט):", "rashi_en": "אל תשקצו YE SHALL NOT MAKE [YOUR SOULS] ABOMINABLE, by eating these (Meilah 16b): this must be the meaning, because you see it is written “[ye shall not make] your souls [abominable]” and no soiling of the soul arises from touching these creatures. And similarly the words (v. 44) “neither shall ye defile [your souls]” mean: by eating them.<br><br>ונטמתם בם THAT YE SHOULD BE DEFILED THEREBY — If you become defiled thereby on earth I will treat you as defiled in the world-to-come and in the heavenly academy (cf. Yoma 39a)."}, {"ch": 11, "v": 44, "aliyah": 7, "heb": "כִּ֣י אֲנִ֣י יְהֹוָה֮ אֱלֹֽהֵיכֶם֒ וְהִתְקַדִּשְׁתֶּם֙ וִהְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָ֑נִי וְלֹ֤א תְטַמְּאוּ֙ אֶת־נַפְשֹׁ֣תֵיכֶ֔ם בְּכׇל־הַשֶּׁ֖רֶץ הָרֹמֵ֥שׂ עַל־הָאָֽרֶץ׃", "onk": "אֲרֵי אֲנָא יְיָ אֱלָהָכוֹן וְתִתְקַדְּשׁוּן וּתְהוֹן קַדִּישִׁין אֲרֵי קַדִּישׁ אֲנָא וְלָא תְסַאֲבוּן יָת נַפְשָׁתֵיכוֹן בְּכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא:", "onk_en": "For I am Adonoy, your God; you shall sanctify yourselves and you shall become holy, for I am Holy and you shall not make yourselves unclean with any creeping creature that crawls on the ground.", "pj": "אֲרוּם אֲנָא יְיָ הוּא אֳלָהָכוֹן וְתִתְקַדְשׁוּן וְתֶהֱווֹן קַדִישִׁין אֲרוּם קַדִישׁ אֲנָא וְלָא תִסְתַּאֲבוּן יַת נַפְשָׁתֵיכוֹן בְּכָל רִיחְשָׁא דִרְחֵישׁ עַל אַרְעָא", "pj_en": "For I am the Lord your God; therefore sanctify yourselves, and be holy, for I am Holy, and defile not your souls by any reptile that creepeth upon the ground:", "tj": "", "tj_en": "", "rashi": "<b>כי אני ה' אלהיכם.<\/b> כְּשֵׁם שֶׁאֲנִי קָדוֹשׁ שֶׁאֲנִי ה' אֱלֹהֵיכֶם, כָּךְ וְהִתְקַדִּשְׁתֶּם — קַדְּשׁוּ עַצְמְכֶם לְמַטָּה:<br><br><b>והייתם קדשים.<\/b> לְפִי שֶׁאֲנִי אֲקַדֵּשׁ אֶתְכֶם לְמַעְלָה וּבָעוֹלָם הַבָּא:<br><br><b>ולא תטמאו וגו'.<\/b> לַעֲבֹר עֲלֵיהֶם בְּלָאוִין הַרְבֵּה, וְכָל לָאו מַלְקוּת, וְזֶהוּ שֶׁאָמְרוּ בַּתַּלְמוּד (מכות ט\"ז:), אָכַל פּוּטִיתָא לוֹקֶה אַרְבַּע, נְמָלָה לוֹקֶה חָמֵשׁ, צִרְעָה לוֹקֶה שֵׁשׁ:", "rashi_en": "כי אני ה׳ אלהיכם FOR I AM THE LORD YOUR GOD — Just as I am holy, I, Who am the Lord your God, similarly והתקדשתם MAKE YOURSELVES HOLY below on earth ( (Sifra, Shemini, Chapter 12 3),<br><br>והייתם קדשים AND YE WILL BE HOLY, because I will then treat you as holy, above and in the world-to-come (Yoma 39a).<br><br>ולא תטמאו NEITHER SHALL YE DEFILE [YOUR SOULS] etc. — This is repeated in order to bring it about that a person transgresses many negative commands when he eats such abominable things: and every single negative commandment involves for its transgression the punishment of lashes. This is the meaning of what they said in the Talmud (Makkot 16b): if one has eaten a Putisa (a shell fish or water reptile), he receives floggings (39 lashes) four times, (because four of the different prohibitions referring to שרצים apply to such a water reptile); if he has eaten an ant, he receives five such floggings; a hornet, six such floggings."}, {"ch": 11, "v": 45, "aliyah": 7, "heb": "כִּ֣י&thinsp;<b>׀<\/b> אֲנִ֣י יְהֹוָ֗ה הַֽמַּעֲלֶ֤ה אֶתְכֶם֙ מֵאֶ֣רֶץ מִצְרַ֔יִם לִהְיֹ֥ת לָכֶ֖ם לֵאלֹהִ֑ים וִהְיִיתֶ֣ם קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אָֽנִי׃", "onk": "אֲרֵי אֲנָא יְיָ דְּאַסֵּק יָתְכוֹן מֵאַרְעָא דְמִצְרַיִם לְמֶהֱוֵי לְכוֹן לֶאֱלָהּ וּתְהוֹן קַדִּישִׁין אֲרֵי קַדִּישׁ אֲנָא:", "onk_en": "For I am Adonoy, who brings you up from the land of Egypt to be your God. You shall be holy, for I am Holy.", "pj": "אֲרוּם אֲנָא הוּא יְיָ דְאַסֵיקִית יַתְכוֹן פְּרִיקִין מִן אַרְעָא דְמִצְרַיִם מְטוּל לְמֶהֱוֵי לְכוֹן לֵאלָהָא וְתֶהֱווּן קַדִישִׁין אֲרוּם קַדִישׁ אֲנָא", "pj_en": "for I am the Lord who have brought you up free from the land of Mizraim, that I may be a God to you; and you may be holy, for I am Holy.", "tj": "", "tj_en": "", "rashi": "<b>כי אני ה' המעלה אתכם.<\/b> עַל מְנָת שֶׁתְּקַבְּלוּ מִצְוֹתַי הֶעֱלֵיתִי אֶתְכֶם; דָּבָר אַחֵר, כִּי אֲנִי ה' הַמַּעֲלֶה אֶתְכֶם: בְּכֻלָּן כְּתִיב \"הוֹצֵאתִי\" וְכָאן כְּתִיב \"הַמַּעֲלֶה\", תָּנָא דְבֵי רַ' יִשְׁמָעֵאל אִלְּמָלֵי לֹא הֶעֱלֵיתִי אֶת יִשְֹרָאֵל מִמִּצְרַיִם אֶלָּא בִּשְׁבִיל שֶׁאֵין מִטַּמְּאִין בִּשְׁרָצִים כִּשְׁאָר אֻמּוֹת דַּיָּם, וּמַעַלְיוּתָא הִיא גַּבַּיְהוּ, זֶהוּ לְשׁוֹן מַעֲלָה:", "rashi_en": "כי אני ה׳ המעלה אתכם FOR I AM THE LORD THAT BRINGETH YOU UP [OUT OF THE LAND OF EGYPT] — On condition that you should accept My commandments did I bring you up (Sifra, Shemini, Chapter 12 4). Another explanation of: FOR I AM THE LORD THAT BRINGETH YOU UP — In all other places it is written, “I brought (you) forth”, and here it is written “that bringeth (you) up” — in reference to this it was taught in the school of R. Ishmael: If I had brought up Israel from Egypt only to effect this one thing — that they do not defile themselves by reptiles as do the other peoples, that should be sufficient for them (Bava Metzia 61b), and it should be regarded by them as an elevation for themselves — this is what is implied in the expression used here: מעלה (I raised you above the people of the land of Egypt)."}, {"ch": 11, "v": 46, "aliyah": 7, "heb": "זֹ֣את תּוֹרַ֤ת הַבְּהֵמָה֙ וְהָע֔וֹף וְכֹל֙ נֶ֣פֶשׁ הַֽחַיָּ֔ה הָרֹמֶ֖שֶׂת בַּמָּ֑יִם וּלְכׇל־נֶ֖פֶשׁ הַשֹּׁרֶ֥צֶת עַל־הָאָֽרֶץ׃", "onk": "דָּא אוֹרַיְתָא דִבְעִירָא וּדְעוֹפָא וּדְכֹל נַפְשָׁתָא חַיְתָא דִּרְחֵשָׁא בְּמַיָּא וּלְכָל נַפְשָׁא דִּרְחֵשָׁא עַל אַרְעָא:", "onk_en": "This is the law concerning the animals and the fowl and of all living creatures that swarm in the waters and for all creatures that crawl on the earth.", "pj": "דָא הוּא גְזֵירַת אוֹרַיְיתָא דִבְעִירָא וְעוֹפָא וְכָל נַפְשַׁת חַיְיתָא דְרִחֲשָׁא בְּמַיָא וּלְכָל נַפְשָׁא דִרְחִישָׁא עַל אַרְעָא", "pj_en": "This is the decree of the law concerning beasts, and birds, and every living animal that creepeth upon the ground;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 47, "aliyah": 7, "heb": "לְהַבְדִּ֕יל בֵּ֥ין הַטָּמֵ֖א וּבֵ֣ין הַטָּהֹ֑ר וּבֵ֤ין הַֽחַיָּה֙ הַֽנֶּאֱכֶ֔לֶת וּבֵין֙ הַֽחַיָּ֔ה אֲשֶׁ֖ר לֹ֥א תֵאָכֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לְאַפְרָשָׁא בֵּין מְסָאָבָא וּבֵין דַּכְיָא וּבֵין חַיְתָא דְּמִתְאַכְלָא וּבֵין חַיְתָא דִּי לָא מִתְאַכְלָא:", "onk_en": "To distinguish between the unclean and between the clean, and between the living creatures which may be eaten and between the living creature which may not be eaten.", "pj": "לְאַפְרָשָׁא בֵּינֵי מְסָאֲבָא וּבֵינֵי דַכְיָא בֵּינֵי חַיְיתָא דְמִיכַשְׁרָא לְאִיתְאַכְלָא וּבֵינֵי חַיְיתָא דְלָא מִיכַשְׁרָא לְאִיתְאַכְלָא", "pj_en": "for making distinction between the unclean and the clean; between the animal whose flesh may be eaten, and the animal whose flesh may not be eaten.", "tj": "", "tj_en": "", "rashi": "<b>להבדיל.<\/b> לֹא בִּלְבַד הַשּׁוֹנֶה, אֶלָּא שֶׁתְּהֵא יוֹדֵעַ וּמַכִּיר וּבָקִי בָּהֶן (ספרא):<br><br><b>בין הטמא ובין הטהר.<\/b> צָרִיךְ לוֹמַר בֵּין חֲמוֹר לְפָרָה, וַהֲלֹא כְבָר מְפֹרָשִׁים הֵם? אֶלָּא בֵּין טְמֵאָה לְךָ לִטְהוֹרָה לְךָ — בֵּין נִשְׁחַט חֶצְיוֹ שֶׁל קָנֶה לְנִשְׁחַט רֻבּוֹ:<br><br><b>ובין החיה הנאכלת.<\/b> צָרִיךְ לוֹמַר בֵּין צְבִי לְעָרוֹד וַהֲלֹא כְבָר מְפֹרָשִׁים הֵם? אֶלָּא בֵּין שֶׁנּוֹלְדוּ בָהּ סִימָנֵי טְרֵפָה כְּשֵׁרָה לְנוֹלְדוּ בָהּ סִימָנֵי טְרֵפָה פְּסוּלָה (ספרא):", "rashi_en": "להבדיל TO MAKE A DISTINCTION — Not that one should only learn the laws, but it is a command that you should know and recognize the differences and be expert in them (Sifra, Shemini, Chapter 12 6).<br><br>‎הטהור‎‎ בין הטמא ‎ובין‎  BETWEEN THE UNCLEAN AND THE CLEAN — Is it necessary to say. that one should understand to distinguish between the ass and the cow? Have they not already been closely defined as to their distinguishing characteristics? But the meaning is: that you should thoroughly understand to distinguish between what is unclean for you and what is clean for you (i. e. between what is forbidden and what is permitted to you) — between the case of an animal only half of whose wind-pipe has been cut through by the knife, and the case when the greater part has been cut through (in the former case the animal is forbidden, in the latter it is permitted as food) (Sifra, Shemini, Chapter 12 7).<br><br>ובין החיה הנאכלת AND BETWEEN AN ANIMAL THAT MAY BE EATEN — Is it necessary to say that one should learn to distinguish between a stag and a wild ass? Have not these already been closely defined as to their distinguishing characteristics? But the meaning is: that you should thoroughly understand to distinguish between the case when there have arisen in it (in the animal) signs by which one might regard it as forbidden (טרפה) and yet it is permitted as food (כשרה), and the case when there have arisen in it signs by which one might regard it as forbidden and because of which it is actually unfitted to be eaten (Sifra, Shemini, Chapter 12 8)."}];

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
