 say: Although we have manna to eat, and a well of which to drink, (that which followed them through the wilderness), we will not drink of it, but we will buy food and water from you to your advantage. From here we may learn a rule for a guest (one lodging in an inn): although he has in his possession something to eat, he should yet purchase something from the local tradesman in order to benefit his host (Midrash Tanchuma, Chukat 12).<br><br>דרך המלך נלך וגו׳ WE WILL KEEP TO THE KING’S HIGHWAY etc. — we will muzzle our cattle, and so they will not turn aside into the fields on this side or that to eat (Midrash Tanchuma, Chukat 12)."}, {"ch": 20, "v": 18, "aliyah": 2, "heb": "וַיֹּ֤אמֶר אֵלָיו֙ אֱד֔וֹם לֹ֥א תַעֲבֹ֖ר בִּ֑י פֶּן־בַּחֶ֖רֶב אֵצֵ֥א לִקְרָאתֶֽךָ׃", "onk": "וַאֲמַר לֵיהּ אֱדוֹמָאָה לָא תְעִבַּר <b>בִּתְחוּמִי<\/b> דִּילְמָא <b>בִּדְקָטְלִין<\/b> בְּחַרְבָּא אֶפּוֹק לָקֳדָמוּתָךְ:", "onk_en": "Edom responded, “You shall not pass through me (my land) [<b>my border<\/b>], lest I go out against you [<b>to kill you<\/b>] with the sword!”", "pj": "וַאֲמַר לֵיהּ אֱדוֹמָאָה לָא תְעִיבַּר בִּתְחוּמִי דִלְמָא בִשְׁלִיפֵי חֶרֶב אֵפּוֹק לִקְדָמוּתָךְ", "pj_en": "But Edomea answered him, You shall not go through my coast, lest I come to meet thee with the unsheathed sword.", "tj": "", "tj_en": "", "rashi": "<b>פן בחרב אצא לקראתך.<\/b> אַתֶּם מִתְגָּאִים בְּקוֹל שֶׁהוֹרִישְׁכֶם אֲבִיכֶם וְאוֹמְרִים \"וַנִּצְעַק אֶל ה' וַיִּשְׁמַע קֹלֵנוּ\", וַאֲנִי אֵצֵא עֲלֵיכֶם בְּמַה שֶּׁהוֹרִישֵׁנִי אָבִי \"וְעַל חַרְבְּךָ תִחְיֶה\" (בראשית כ\"ז):", "rashi_en": "פן בחרב אצא לקראתך LEST I COME OUT AGAINST THEE WITH THE SWORD — You pride yourselves on the “voice” which your father bequeathed you as a blessing, saying, “And we cried unto the Lord and He heard our voice” (cf. Rashi on v. 16); I, therefore, will come out against you with that which my father bequeathed me when he said, (Genesis 27:40) “And by thy sword shalt thou live” (Midrash Tanchuma, Beshalach 9 on בשלח)"}, {"ch": 20, "v": 19, "aliyah": 2, "heb": "וַיֹּאמְר֨וּ אֵלָ֥יו בְּנֵֽי־יִשְׂרָאֵל֮ בַּֽמְסִלָּ֣ה נַעֲלֶה֒ וְאִם־מֵימֶ֤יךָ נִשְׁתֶּה֙ אֲנִ֣י וּמִקְנַ֔י וְנָתַתִּ֖י מִכְרָ֑ם רַ֥ק אֵין־דָּבָ֖ר בְּרַגְלַ֥י אֶֽעֱבֹֽרָה׃", "onk": "וַאֲמָרוּ לֵיהּ בְּנֵי יִשְׂרָאֵל בְּאֹרַח <b>כְּבִישָׁא<\/b> נִסַּק וְאִם מֵיּמָךְ נִשְׁתֵּי אֲנָא וּבְעִירַי וְאֶתֵּן דְּמֵיהוֹן לְחוֹד <b>לֵית פִּתְגַּם דְּבִישׁ<\/b> בְּרַגְלַי אֲעִבַּר:", "onk_en": "Bnei Yisroel said, “We will go up by the [<b>paved<\/b>] highway, and if we or our cattle drink your water we will pay for it, it is just nothing, we only want [<b>with no evil intent<\/b>] to pass through on foot.”", "pj": "וַאֲמָרוּ לֵיהּ בְּנֵי יִשְרָאֵל בְּאִסְטַרְטַיָא דְמַלְכָּא נֵיזֵיל אִין מַיִיךְ נִשְׁתֵּי אֲנָא וּבְעִירֵי וְאֵיתֵּן דְמֵי מֵימְהוֹן לְחוֹד לֵית פִּתְגַם דְבִישׁ בִּלְחוֹדִי אֲעִיבַר", "pj_en": "And Israel said to him, We would go by the king's highway; if we drink thy waters, I and my cattle, I will give thee the price of their value. I will only pass through, without doing wrong.", "tj": "", "tj_en": "", "rashi": "<b>רק אין דבר.<\/b> אֵין שׁוּם דָּבָר מַזִּיקְךָ:", "rashi_en": "רק אין דבר lit., ONLY NO THING — i.e., nothing will do you any harm."}, {"ch": 20, "v": 20, "aliyah": 2, "heb": "וַיֹּ֖אמֶר לֹ֣א תַעֲבֹ֑ר וַיֵּצֵ֤א אֱדוֹם֙ לִקְרָאת֔וֹ בְּעַ֥ם כָּבֵ֖ד וּבְיָ֥ד חֲזָקָֽה׃", "onk": "וַאֲמַר לָא תְעִבָּר וּנְפַק אֱדוֹמָאָה לָקֳדָמוּתֵיהּ <b>בְּחֵיל<\/b> רַב וּבִידָא תַקִּיפָא:", "onk_en": "Then (Edom) responded, “Do not pass through!” Edom came to confront [Bnei Yisroel] with a massive number of people [<b>an army<\/b>] and a strong hand.", "pj": "וַאֲמַר לָא תְעִיבַר וּנְפַק אֱדוֹמָאָה לְקַדְמוּתֵיהּ בְחֵיל רַב וּבִידָא תַקִיפְתָּא", "pj_en": "But he said, You shall not pass through. And Edomea came out to meet him with a large army and with a strong hand.", "tj": "", "tj_en": "", "rashi": "<b>וביד חזקה.<\/b> בְּהַבְטָחַת זְקֵנֵנוּ \"וְהַיָּדַיִם יְדֵי עֵשָׂו\" (שם):", "rashi_en": "וביד חזקה AND WITH A STRONG HAND — relying upon our ancestors’ assurance: (Genesis 27:22) “and the hands are the hands of Esau” (cf. Midrash Tanchuma, Beshalach 9 on בשלח)"}, {"ch": 20, "v": 21, "aliyah": 2, "heb": "וַיְמָאֵ֣ן&thinsp;<b>׀<\/b> אֱד֗וֹם נְתֹן֙ אֶת־יִשְׂרָאֵ֔ל עֲבֹ֖ר בִּגְבֻל֑וֹ וַיֵּ֥ט יִשְׂרָאֵ֖ל מֵעָלָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְסָרֵיב אֱדוֹמָאָה לְמִשְׁבַק יָת יִשְׂרָאֵל לְמֶעֱבַּר בִּתְחוּמֵיהּ וּסְטָא יִשְׂרָאֵל מִלְּוָתֵיהּ:", "onk_en": "Edom refused to allow Yisroel to pass through its territory, and Yisroel turned aside from him.", "pj": "וְסָרֵיב אֱדוֹמָאָה לְמִשְׁבּוֹק יַת יִשְרָאֵל לִמְעִבַּר בִּתְחוּמֵיהּ וּסְטָא יִשְרָאֵל מִלְוָותֵיהּ דַהֲווֹ מַפְקְדִין מִן קֳדָם מֵימְרָא דִשְׁמַיָא דְלָא לִמְסַדְרָא עִמְהוֹן סִדְרֵי קְרָבָא מְטוֹל דְעַד כְּדוֹן לָא מָטָא זִמְנָא לְמִתְיַהֲבָא נִקְמָתָא דֶאֱדוֹם בִּידֵיהוֹן", "pj_en": "So Edomea would not suffer Israel to pass through his coast; and Israel turned away from him, because it was commanded from before the Word of the Heavens that they should not set battle in array against them, forasmuch as the time was not yet come when the punishment of Edom should be given into their hands.", "tj": "וּסְטוּן יִשְרָאֵל מֵעִלַוֵיהוֹן דַהֲווֹן מִפַקְדִין מִן אֲבוּהוֹן דְבִשְׁמַיָא דְלָא יְסַדְרוּן לְקִבְלֵיהוֹן סִדְרֵי קְרָבָא:", "tj_en": "And Israel turned away from them; for so was the commandment of their Father who is in heaven, that they should not set against them the array of war.", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 22, "aliyah": 3, "heb": "וַיִּסְע֖וּ מִקָּדֵ֑שׁ וַיָּבֹ֧אוּ בְנֵֽי־יִשְׂרָאֵ֛ל כׇּל־הָעֵדָ֖ה הֹ֥ר הָהָֽר׃", "onk": "וּנְטָלוּ מֵרְקָם וַאֲתוֹ בְנֵי יִשְׂרָאֵל כָּל כְּנִשְׁתָּא לְהֹר טוּרָא:", "onk_en": "They traveled from Kodeish, and the entire community of Bnei Yisroel came to Mount Hor.", "pj": "וּנְטָלוּ מֵרְקָם וְאָתוּ בְּנֵי יִשְרָאֵל כָּל כְּנִשְׁתָּא לְטַוְורוֹס אוּמָנוֹס", "pj_en": "And the whole congregation of the children of Israel journeyed from Rekem, and came unto Mount Umanom.", "tj": "", "tj_en": "", "rashi": "<b>כל העדה.<\/b> כֻּלָּם שְׁלֵמִים וְעוֹמְדִים לִכָּנֵס לָאָרֶץ, שֶׁלֹּא הָיָה בָּהֶן אֶחָד מֵאוֹתָם שֶׁנִּגְזְרָה גְזֵרָה עֲלֵיהֶם, שֶׁכְּבָר כָּלוּ מֵתֵי מִדְבָּר וְאֵלּוּ מֵאוֹתָן שֶׁכָּתוּב בָּהֶן (דברים ד') \"חַיִּים כֻּלְּכֶם הַיּוֹם\" (תנחומא):<br><br><b>הר ההר.<\/b> הַר עַל גַּבֵּי הַר, כְּתַפּוּחַ קָטָן עַל גַּבֵּי תַפּוּחַ גָּדוֹל, וְאַעַ\"פִּ שֶׁהֶעָנָן הוֹלֵךְ לִפְנֵיהֶם וּמַשְׁוֶה אֶת הֶהָרִים, שְׁלֹשָׁה נִשְׁאֲרוּ בָהֶן — הַר סִינַי לַתּוֹרָה וְהֹר הָהָר לִקְבוּרַת אַהֲרֹן וְהַר נְבוֹ לִקְבוּרַת מֹשֶׁה (תנחומא):", "rashi_en": "כל העדה THE WHOLE CONGREGATION — all of them perfect, and destined to enter the promised land, for among them there was not even one of those upon whom it had been decreed that they should not enter the land, because those who were to die in the wilderness had already ceased to exist, and these belonged to those about whom it is written, (Deuteronomy 4:4) ‘[But ye who did cleave to the Lord your God] are all of you alive this day” (Midrash Tanchuma, Chukat 14)<br><br>הר ההר MOUNT HOR (more lit., the mount of the mount) — This was a mount on top of a mount, like a small apple on top of a large apple. — Although the cloud went before them and levelled the mountains (cf. Rashi on 10:34), yet three of them remained: Mount Sinai for the giving of the Torah, Mount Hor for Aaron’s burial place, and Mount Nebo for Moses’ burial place (Midrash Tanchuma, Chukat 14)."}, {"ch": 20, "v": 23, "aliyah": 3, "heb": "וַיֹּ֧אמֶר יְהֹוָ֛ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן בְּהֹ֣ר הָהָ֑ר עַל־גְּב֥וּל אֶֽרֶץ־אֱד֖וֹם לֵאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרֹן בְּהֹר טוּרָא עַל תְּחוּם אַרְעָא דֶאֱדוֹם לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and Aharon at Mount Hor, at the border of the land of Edom, saying.", "pj": "וַאֲמַר יְיָ לְמשֶׁה בְּטַוְורוֹס אוּמָנוֹס עַל תְּחוּם אַרְעָא דֶאֱדוֹם לְמֵימָר", "pj_en": "And the Lord spake unto Mosheh in the Mount Umanom, on the coast of the land of Edom, saying:", "tj": "", "tj_en": "", "rashi": "<b>על גבול ארץ אדום.<\/b> מַגִּיד שֶׁמִּפְּנֵי שֶׁנִּתְחַבְּרוּ כָאן לְהִתְקָרֵב לְעֵשָׂו הָרָשָׁע, נִפְרְצוּ מַעֲשֵׂיהֶם וְחָסְרוּ הַצַּדִּיק הַזֶּה, וְכֵן הַנָּבִיא אוֹמֵר לִיהוֹשָׁפָט (דברי הימים ב' כ') \"בְּהִתְחַבֶּרְךָ עִם אֲחַזְיָהוּ פָּרַץ ה' אֶת מַעֲשֶׂיךָ\" (תנחומא):", "rashi_en": "על גבול ארץ אדום BY THE BOUNDARY OF THE LAND OF EDOM — This (the statement that Aaron died here) tells us that because they here wished to join themselves in close friendship with the wicked, a breach was made in their works and they had to lose this righteous man, Aaron. Similarly does the prophet say, (II Chronicles 20:37) “Because thou hast joined thyself with Ahaziah, the Lord hath made a breach in thy works” (Midrash Tanchuma, Chukat 14)."}, {"ch": 20, "v": 24, "aliyah": 3, "heb": "יֵאָסֵ֤ף אַהֲרֹן֙ אֶל־עַמָּ֔יו כִּ֣י לֹ֤א יָבֹא֙ אֶל־הָאָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִבְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר־מְרִיתֶ֥ם אֶת־פִּ֖י לְמֵ֥י מְרִיבָֽה׃", "onk": "יִתְכְּנֵשׁ אַהֲרֹן לְעַמֵּיהּ אֲרֵי לָא יֵיעוֹל לְאַרְעָא דִּי יְהָבִית לִבְנֵי יִשְׂרָאֵל עַל דִּי סָרִיבְתּוּן עַל מֵימְרִי לְמֵי מַצּוּתָא:", "onk_en": "“Aharon will now be gathered (die) to his people, for he shall not enter the land that I have given to Bnei Yisroel, because you defied My word at the waters of dispute.", "pj": "יִתְכְּנֵישׁ אַהֲרן לְעַמֵיהּ אֲרוּם לָא יֵיעוֹל לְאַרְעָא דִיהָבִית לִבְנֵי יִשְרָאֵל מְטוֹל דְסָרֵבְתּוּן עַל מֵימְרִי בְּמֵי מַצוּתָא", "pj_en": "Aharon shall be gathered unto his people; for he shall not enter into the land which I have given unto the children of Israel, because you were rebels against My Word at the Waters of Contention.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 25, "aliyah": 3, "heb": "קַ֚ח אֶֽת־אַהֲרֹ֔ן וְאֶת־אֶלְעָזָ֖ר בְּנ֑וֹ וְהַ֥עַל אֹתָ֖ם הֹ֥ר הָהָֽר׃", "onk": "דְּבַר יָת אַהֲרֹן וְיָת אֶלְעָזָר בְּרֵיהּ וְאַסֵּיק יָתְהוֹן לְהֹר טוּרָא:", "onk_en": "Take Aharon and his son Elozor, and bring them up to Mount Hor.", "pj": "דְבַר יַת אַהֲרן וְיַת אֶלְעָזָר בְּרֵיהּ וְאַסֵיק יַתְהוֹן לְטַוְורוֹס אוּמָנוֹס", "pj_en": "Take Aharon and Elazar his son, and make them come up to Mount Umanom.", "tj": "", "tj_en": "", "rashi": "<b>קח את אהרן.<\/b> בִּדְבָרִים שֶׁל נִחוּמִים — אֱמֹר לוֹ, אַשְׁרֶיךָ שֶׁתִּרְאֶה כִתְרְךָ נָתוּן לְבִנְךָ, מַה שֶּׁאֵין אֲנִי זַכַּאי לְכָךְ (שם):", "rashi_en": "קח את אהרן TAKE AARON by consoling words — say to him: Happy art thou that thou wilt see thy crown being given to thy son, something to which I am not privileged (Midrash Tanchuma, Chukat 17)."}, {"ch": 20, "v": 26, "aliyah": 3, "heb": "וְהַפְשֵׁ֤ט אֶֽת־אַהֲרֹן֙ אֶת־בְּגָדָ֔יו וְהִלְבַּשְׁתָּ֖ם אֶת־אֶלְעָזָ֣ר בְּנ֑וֹ וְאַהֲרֹ֥ן יֵאָסֵ֖ף וּמֵ֥ת שָֽׁם׃", "onk": "וְאַשְׁלַח יָת אַהֲרֹן יָת לְבוּשׁוֹהִי וְתַלְבֵּשִׁנּוּן יָת אֶלְעָזָר בְּרֵיהּ וְאַהֲרֹן יִתְכְּנֵשׁ וִימוּת תַּמָּן:", "onk_en": "Remove Aharon’s vestments and dress his son Elozor in them; Aharon will be gathered in and die there.”", "pj": "וְאַשְׁלַח יַת אַהֲרן יַת לְבוּשׁוֹי אִיקַר כְּהוּנְתָּא וְתַלְבִּישׁוּנוּן יַת אֶלְעָזָר בְּרֵיהּ וְאַהֲרן יִתְכְּנֵישׁ וִימוּת תַּמָן", "pj_en": "And thou shalt strip Aharon of his vestments, the adornment (glory) of the priesthood, and put them on Elazar his son; but Aharon shall be gathered, and die there.", "tj": "וְתַשְׁלִיחַ יַת אַהֲרן:", "tj_en": "And Mosheh drew off from Aharon.", "rashi": "<b>את בגדיו.<\/b> אֶת בִּגְדֵי כְהֻנָּה גְדוֹלָה הִלְבִּישָׁהוּ וְהִפְשִׁיטָם מֵעָלָיו, לְתִתָּם עַל בְּנוֹ בְּפָנָיו; אָמַר לוֹ הִכָּנֵס לַמְּעָרָה וְנִכְנַס, רָאָה מִטָּה מֻצַּעַת וְנֵר דָּלוּק, אָמַר לוֹ עֲלֵה לַמִּטָּה וְעָלָה, פְּשֹׁט יָדֶיךָ וּפָשַׁט, קְמֹץ פִּיךָ וְקָמַץ, עֲצֹם עֵינֶיךָ וְעָצַם, מִיָּד חָמַד מֹשֶׁה לְאוֹתָהּ מִיתָה, וְזֶהוּ שֶׁנֶּאֱמַר לוֹ (דברים ל\"ב) \"כַּאֲשֶׁר מֵת אַהֲרֹן אָחִיךָ\" — מִיתָה שֶׁנִתְאַוִּיתָ לָהּ (ספרי שם):", "rashi_en": "את בגדיו [AND STRIP AARON OF] HIS GARMENTS — i.e., the garments of the high priesthood. — He clothed him in these and stripped them off him to place them on his son in his presence. He (Moses) said to him (Aaron), “Enter the cave”, and he entered. — He saw a bed already made (more lit., outspread, i.e., with its sheets, etc.) and a light burning. He said to him, “Ascend the bed”, and he ascended. — “Stretch out your hands”, and he stretched them out. — “Close your mouth”, and he closed it. — “Close your eyes”, and he closed them. At that moment Moses longed for that self-same death, and this is what was said to him (Deuteronomy 32:50), “[And die] … as Aaron thy brother died” — the death, for which you longed (Siphre on that verse)."}, {"ch": 20, "v": 27, "aliyah": 3, "heb": "וַיַּ֣עַשׂ מֹשֶׁ֔ה כַּאֲשֶׁ֖ר צִוָּ֣ה יְהֹוָ֑ה וַֽיַּעֲלוּ֙ אֶל־הֹ֣ר הָהָ֔ר לְעֵינֵ֖י כׇּל־הָעֵדָֽה׃", "onk": "וַעֲבַד משֶׁה כְּמָא דִי פַּקִּיד יְיָ וּסְלִיקוּ לְהֹר טוּרָא לְעֵינֵי כָּל כְּנִשְׁתָּא:", "onk_en": "Moshe did as Adonoy commanded; and they went up Mount Hor in the presence of the entire community.", "pj": "וְעָבַד משֶׁה הֵיכְמָא דְפַקֵיד יְיָ יָתֵיהּ וּסְלִיקוּ לְטַוְורוֹס אוּמָנוֹס כַּד חָמָן כָּל כְּנִשְׁתָּא", "pj_en": "And Mosheh did as the Lord commanded him. And they ascended Mount Umanom, in the view of all the congregation.", "tj": "", "tj_en": "", "rashi": "<b>ויעש משה.<\/b> אַעַ\"פִּ שֶׁהַדָּבָר קָשֶׁה לוֹ, לֹא עִכֵּב (תנחומא):", "rashi_en": "ויעש משה AND MOSES DID [AS THE LORD COMMANDED] — Although this thing was hard for him he did not delay to do so (Midrash Tanchuma, Chukat 17)."}, {"ch": 20, "v": 28, "aliyah": 3, "heb": "וַיַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת־אַהֲרֹ֜ן אֶת־בְּגָדָ֗יו וַיַּלְבֵּ֤שׁ אֹתָם֙ אֶת־אֶלְעָזָ֣ר בְּנ֔וֹ וַיָּ֧מׇת אַהֲרֹ֛ן שָׁ֖ם בְּרֹ֣אשׁ הָהָ֑ר וַיֵּ֧רֶד מֹשֶׁ֛ה וְאֶלְעָזָ֖ר מִן־הָהָֽר׃", "onk": "וְאַשְׁלַח משֶׁה יָת אַהֲרֹן יָת לְבוּשׁוֹהִי וְאַלְבֵּישׁ יָתְהוֹן יָת אֶלְעָזָר בְּרֵיהּ וּמִית אַהֲרֹן תַּמָּן בְּרֵישׁ טוּרָא וּנְחַת משֶׁה וְאֶלְעָזָר מִן טוּרָא:", "onk_en": "Moshe then removed Aharon’s vestments and dressed Aharon’s son, Elozor, in them; Aharon died there on top of the mountain, and Moshe and Elozor descended from the mountain.", "pj": "וְאַשְׁלַח משֶׁה יַת אַהֲרן יַת לְבוּשׁוֹי אִיקַר כְּהוּנְתָּא וְאַלְבֵּישׁ יַת אֶלְעָזָר בְּרֵיהּ וּמִית אַהֲרן תַּמָן בְּרֵישׁ טַוְוָרא וּנְחַת משֶׁה וְאֶלְעָזָר מִן טַוְורָא", "pj_en": "And Mosheh stripped Aharon of his vestments, the priestly decoration, and put them on Elazar his son; and Aharon died there on the summit of the mountain and Mosheh and Elazar came down from the mount.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 29, "aliyah": 3, "heb": "וַיִּרְאוּ֙ כׇּל־הָ֣עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַיִּבְכּ֤וּ אֶֽת־אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲזוֹ כָּל כְּנִשְׁתָּא אֲרֵי מִית אַהֲרֹן וּבְכוֹ יָת אַהֲרֹן תְּלָתִין יוֹמִין כֹּל בֵּית יִשְׂרָאֵל:", "onk_en": "The entire community saw that Aharon died; and they wept for Aharon thirty days, the entire house of Yisroel.", "pj": "וְכֵיוַן דְנַח נַפְשֵׁיהּ דְאַהֲרן אִסְתַּלָקוּ עֲנָנָא יְקָרָא בְּחַד לְיַרְחָא דְאָב וְחָמוּן כָּל כְּנִשְׁתָּא דְאָתָא משֶׁה נָחִית מִן טַוְורָא מָנוֹי בְּזִיעִין וַהֲוָה בָּכֵי וַאֲמַר וַוי לִי עֲלָךְ אַהֲרן אָחִי עַמוּד צְלוֹתְהוֹן דְיִשְרָאֵל אוּף הִינוּן בָּכוֹן יַת אַהֲרן תְּלָתִין יוֹמִין גוּבְרַיָא וּנְשַׁיָא דְיִשְרָאֵל", "pj_en": "And when the soul of Aharon was at rest, the Cloud of Glory was lifted up on the first day of the month Ab; and all the congregation beheld Mosheh come down from the mountain with rent garments; and he wept and said, Woe unto me, for thee, my brother Aharon, the pillar of Israel's prayers! And they too wept for Aharon thirty days, the men and the women of Israel.", "tj": "וְחָמוֹן כָּל עַמָא דִכְנִישְׁתָּא משֶׁה נָחִית מִן רֵישׁ טוּרָא מָאנוֹי בְּזִיעִין וְקִיטְמָא בְּרֵישֵׁיה וַהֲוָה בָּכֵי וַאֲמַר וַוי לִי עֲלָךְ אַהֲרן אָחִי עַמוּד צְלוֹתְהוֹן דִבְנֵי יִשְרָאֵל דַהֲוֵיתָא מְכַפֵּר עֲלֵיהוֹן חַד זְמַן בְּכָל שְׁנָא בָּהּ בְּשַׁעֲתָּא הֵימִינוּן בְּנֵי יִשְרָאֵל אֲרוּם מִית אַהֲרן וּבְכוֹן יַת אַהֲרן תְּלָתִין יוֹמִין כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל:", "tj_en": "And all the congregation beheld Mosheh come down from the height of the mountain, with garments rent and dust upon his head, weeping and saying, Woe unto me, for thee, my brother Aharon, the pillar of the prayers of the sons of Israel, who madest atonement for them once every year! In that hour the sons of Israel believed that Aharon was dead; and all the congregation of the children of Israel wept for Aharon thirty days.", "rashi": "<b>ויראו כל העדה.<\/b> כְּשֶׁרָאוּ מֹשֶׁה וְאֶלְעָזָר יוֹרְדִים וְאַהֲרֹן לֹא יָרַד, אָמְרוּ הֵיכָן הוּא אַהֲרֹן? אָמַר לָהֶם מֵת, אָמְרוּ אֶפְשָׁר מִי שֶׁעָמַד כְּנֶגֶד הַמַּלְאָךְ וְעָצַר אֶת הַמַּגֵּפָה יִשְׁלֹט בוֹ מַלְאַךְ הַמָּוֶת? מִיָּד בִּקֵּשׁ מֹשֶׁה רַחֲמִים וְהֶרְאוּהוּ מַלְאֲכֵי הַשָּׁרֵת לָהֶם מֻטָּל בַּמִּטָּה, רָאוּ וְהֶאֱמִינוּ (שם):<br><br><b>כל בית ישראל.<\/b> הָאֲנָשִׁים וְהַנָּשִׁים, לְפִי שֶׁהָיָה אַהֲרֹן רוֹדֵף שָׁלוֹם וּמַטִּיל אַהֲבָה בֵּין בַּעֲלֵי מְרִיבָה וּבֵין אִישׁ לְאִשְׁתּוֹ (אדר\"נ י\"ב):<br><br><b>כי גוע.<\/b> אוֹמֵר אֲנִי שֶׁהַמְתַּרְגֵּם דְּהָא מִית טוֹעֶה הוּא, אֶלָּא אִם כֵּן מְתַרְגֵּם וַיִּרְאוּ וְאִתְחֲזִיאוּ, שֶׁלֹּא אָמְרוּ רַבּוֹתֵינוּ כִּי זֶה מְשַׁמֵּשׁ בִּלְשׁוֹן דְּהָא אֶלָּא עַל מִדְרָשׁ שֶׁנִּסְתַּלְּקוּ עַנְנֵי הַכָּבוֹד, וְכִדְאָמַר רַבִּי אַבָּהוּ (ראש השנה ג'), אַל תִּקְרֵי וַיִּרְאוּ, אֶלָּא וַיֵּרָאוּ, וְעַל לָשׁוֹן זֶה נוֹפֵל לְשׁוֹן דְּהָא, לְפִי שֶׁהִיא נְתִינַת טַעַם לְמַה שֶּׁלְּמַעְלָה הֵימֶנּוּ — לָמָּה וַיֵּרָאוּ? לְפִי שֶׁהֲרֵי מֵת אַהֲרֹן; אֲבָל עַל תַּרְגּוּם \"וְחָזוּ כָל כְּנִשְׁתָּא\" אֵין לְשׁוֹן דְּהָא נוֹפֵל אֶלָּא לְשׁוֹן אֲשֶׁר, שֶׁהוּא מִגִּזְרַת שִׁמּוּשׁ אִי, שֶׁמָּצִינוּ אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, כְּמוֹ \"וְאִם מַדּוּעַ לֹא תִקְצַר רוּחִי\" (איוב כ\"א), וְהַרְבֵּה מְפֹרָשִׁים מִזֶּה הַלָּשׁוֹן — \"אִם חֲרוּצִים יָמָיו\" (שם י\"ד):", "rashi_en": "ויראו כל העדה AND ALL THE CONGREGATION SAW [THAT AARON HAD DIED] — When they saw Moses and Eleazar descending and that Aaron was not descending with them, they said, “Where, then, is Aaron?” — He replied to them, “He is dead!” They thereupon said, “Is it possible that a man who stood up against the Angel and stayed the plague, — that over him the Angel of Death should have power?!” — Moses at once offered prayer and the ministering angels showed him (Aaron) to them lying upon the bier. They saw and believed (cf. Midrash Tanchuma, Chukat 17).<br><br>כל בית ישראל [THEY WEPT FOR AARON …] EVEN ALL THE HOUSE OF ISRAEL — all: both men and women, because Aaron used to pursue peace and promoted love between contending parties, and between man and wife (cf. The Fathers According to Rabbi Nathan 12).<br><br>כי גוע THAT (or because) HE HAD DIED — I say that he who translates these words in the Targum (i.e., anyone who holds that this is the correct rendering) by דהא מית, “because he had died”, is in error unless he also translates in the Targum the word ויראו by ואתחזיאו “they were seen (exposed)”, for our Rabbis stated that this word כי is used here in the sense of “because” only in accordance with a Midrash which relates that the clouds of glory which hitherto enveloped Israel disappeared at Aaron's death, (so that all the congregation were now exposed to the sight of their enemies), and in accordance with what R. Abuhu said (Rosh Hashanah 3a), “Read here not וַיִּרְאוּ but וַיֵּרָאוּ, “they were seen”. It is to this sense of the verb that the meaning of “because” is applicable to the word כי, since that gives the reason for what precedes it: Why were they seen? Because, behold, Aaron had died, and the clouds disappeared. But to the translation in the Targum, וחזו כל כנשתא (“and all the congregation saw”), the meaning of “because” (for the word כי) is not applicable, but only the meaning אשר, “that”, which is one of the usages of the word אי (the Aramaic equivalent of אם, which itself is one of the four classifications of the usage of כי; see ibid). For we find אם used in the sense of אשר “that”, as e.g., (Job 21:4) “so that (ואם) why should I not be impatient?” And many passages where אם occurs may be explained in this sense, as (Job 14:5), “that (אם) his days are determined”."}, {"ch": 21, "v": 1, "aliyah": 3, "heb": "וַיִּשְׁמַ֞ע הַכְּנַעֲנִ֤י מֶֽלֶךְ־עֲרָד֙ יֹשֵׁ֣ב הַנֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָאֲתָרִ֑ים וַיִּלָּ֙חֶם֙ בְּיִשְׂרָאֵ֔ל וַיִּ֥שְׁבְּ&thinsp;<small>׀<\/small>&thinsp;מִמֶּ֖נּוּ שֶֽׁבִי׃", "onk": "וּשְׁמַע כְּנַעֲנָאָה מַלְכָּא דַעֲרָד יָתֵב דָּרוֹמָא אֲרֵי אֲתָא יִשְׂרָאֵל אֹרַח מְאַלְלַיָּא <b>וְאַגַּח קְרָבָא<\/b> בְּיִשְׂרָאֵל וּשְׁבָא מִנֵּיהּ שִׁבְיָא:", "onk_en": "The Canaanite King of Arad heard—who lived in the south—that Yisroel had come by the route of the spies; he attacked [<b>waged war with<\/b>] Yisroel, and he took from them a captive.", "pj": "וּשְׁמַע עֲמָלֵק דַהֲוָה שָׁרֵי בְּאַרַע דָרוֹמָא וְאָתָא וְאִשְׁתַּנֵי וּמָלַךְ בַּעֲרַד אֲרוּם נַח נַפְשֵׁיהּ דְאַהֲרן וְאִסְתַּלֵק עֲמוּדָא דַעֲנָנָא דַהֲוָה מַדְבַּר בִּזְכוּתֵיהּ קֳדָם עַמָא בֵּית דְיִשְרָאֵל וַאֲרוּם אָתֵי יִשְרָאֵל אוֹרַח אַלָלַיָא אֲתַר דְמָרְדוּ בְּמָארֵי עַלְמָא דְכַד תָּבוּ אַלָלַיָא הֲווֹ בְּנֵי יִשְרָאֵל שַׁרְיָין בִּרְקַם וַהֲדָרוּ לְבַּתְרֵיהוֹן מִן רְקַם עַד מוֹסֵרוֹת שִׁית מַשׁוֹרְיַין אַרְבְּעִין שְׁנִין נְטָלוּ מִן מוֹסֵרוֹת וְתָבוּ לִרְקַם אוֹרַח מְאַלְלַיָא וְאָתוּ לְטַוְורוֹס אוּמָנוֹס וּמִית אַהֲרן תַּמָן הָא בְכֵן אָתָא וַאֲגַח קְרָבָא בְּיִשְרָאֵל וְשָׁבָא מִנְהוֹן שִׁבְיָא רַבָּא", "pj_en": "And Amalek, who had dwelt in the south, and changed, and came and reigned in Arad, heard that the soul of Aharon was at rest, that the pillar of the Cloud which for his sake had led the people of the house of Israel had been taken up, and that Israel was coming by the way of the explorers to the place where they had rebelled against the Lord of the world. For, when the explorers had returned, the children of Israel abode in Rekem, but afterward returned from Rekem to Motseroth, in six encampments during forty years, when they journeyed from Motseroth, and returned to Rekem by the way of the explorers, and came unto Mount Umanom, where Aharon died; (and,) behold, he came and arrayed battle against Israel, and captured some of them with a great captivity.", "tj": "וּשְׁמַע כְּנַעֲנָאָה מַלְכָּא דַעֲרָד דַהֲוָה שָׁרֵי בִדְרוֹמָא אֲרוּם מִית אַהֲרן גַבְרָא חֲסִידָא דִי בִזְכוּתֵיהּ הֲוָון עֲנָנֵי דִיקָרָא מָגִינִין עַל יִשְרָאֵל וְאִסְתַּלֵק עַמוּדָא דַעֲנָנָא וַאֲרוּם מִיתַת נְבִיאֲתָא מִרְיָם דְבִזְכוּתָהּ הֲוָה בֵּירָא מַהֲלָכָא וְאִתְגְנִיזַת בֵּירָא עָנֵי וַאֲמַר עַבְדֵי קְרָבָא אִיתוּן וְנִיסְדַר סִדְרֵי קְרָבָא כָּל קֳבֵיל יִשְרָאֵל אֲרוּם מָצֵינָן לְאוֹרְחָא דִי עֲלוּ בָּהּ יְלִילַיָא וּסְדָרוּ סִדְרֵי קְרָבָא כָּל קָבֵל יִשְרָאֵל וּשְׁבָא מִנְהוֹן שִׁבְיָא רַבָּא:", "tj_en": "And when the Kenaanite, king Arad, who dwelt in the south, heard that Aharon was dead, that holy man on account of whose merit the Cloud of Glory had protected Israel; that the pillar of the Cloud had been taken up; and that the prophetess Miriam was dead, on whose account the well had flowed, but had (since) been hidden; he answered and said, Ye servants of war, come and let us set battle in line against Israel; for we shall find the way by which the explorers came up. Therefore they set battle in line against Israel, and carried away some of them with a great captivity.", "rashi": "<b>וישמע הכנעני.<\/b> שָׁמַע שֶׁמֵּת אַהֲרֹן וְנִסְתַּלְּקוּ עַנְנֵי כָבוֹד כו', כִּדְאִיתָא בְּרֹאשׁ הַשָּׁנָה (דף ג'), וַעֲמָלֵק מֵעוֹלָם רְצוּעַת מַרְדּוּת לְיִשְׂרָאֵל, מְזֻמָּן בְּכָל עֵת לְפֻרְעָנוּת:<br><br><b>ישב הנגב.<\/b> זֶה עֲמָלֵק, שֶׁנֶּאֱמַר \"עֲמָלֵק יוֹשֵׁב בְּאֶרֶץ הַנֶּגֶב\" (במדבר י\"ג), וְשִׁנָּה אֶת לְשׁוֹנוֹ לְדַבֵּר בִּלְשׁוֹן כְּנַעַן, כְּדֵי שֶׁיִּהְיוּ יִשְׂרָאֵל מִתְפַּלְּלִים לְהַקָּבָּ\"ה לָתֵת כְּנַעֲנִים בְּיָדָם, וְהֵם אֵינָן כְּנַעֲנִים, רָאוּ יִשְׂרָאֵל לְבוּשֵׁיהֶם כִּלְבוּשֵׁי עֲמָלֵקִים וּלְשׁוֹנָם לְשׁוֹן כְּנַעַן, אָמְרוּ נִתְפַּלֵּל סְתָם, שֶׁנֶּאֱמַר \"אִם נָתֹן תִּתֵּן אֶת הָעָם הַזֶּה בְּיָדִי\" (עי' ילקוט שמעוני תשס\"ד):<br><br><b>דרך האתרים.<\/b> דֶּרֶךְ הַנֶּגֶב, שֶׁהָלְכוּ בּוֹ מְרַגְּלִים, שֶׁנֶּאֱמַר \"וַיַּעֲלוּ בַנֶּגֶב\" (במדבר י\"ג); דָּבָר אַחֵר: דֶּרֶךְ הָאֲתָרִים, דֶּרֶךְ הַתַּיָּר הַגָּדוֹל הַנּוֹסֵעַ לִפְנֵיהֶם, שֶׁנֶּאֱמַר (שם י') \"דֶּרֶךְ שְׁלֹשֶׁת יָמִים לָתוּר לָהֶם מְנוּחָה\" (תנחומא):<br><br><b>וישב ממנו שבי.<\/b> אֵינָהּ אֶלָּא שִׁפְחָה אַחַת (ילקוט שמעוני שם):", "rashi_en": "וישמע הכנעני AND THE CANAANITE HEARD — He heard that Aaron had died and that the clouds of glory had disappeared and he believed that now he was at liberty to wage war against Israel, as it is related in Rosh Hashana 3a; Amalek was from olden times a whip for chastising Israel — always held in readiness to be God's agent for Israels punishment (Midrash Tanchuma, Chukat 18).<br><br>ישב הנגב THE INHABITANT OF THE SOUTH COUNTRY — This was Amalek,as it is said, (Numbers 13:29), “Amalek was the inhabitant of the south country”. But he purposely changed his speech, talking in the “Canaanite” tongue, so that Israel might thereby be misled and would pray to the Holy One, blessed be He, that he should give the Canaanites into their power, whilst really they were not Canaanites, and their prayer would be ineffectual against the Amalakites. But Israel perceived that their clothing was as the clothing of Amalakites whilst their language was the language of Canaan; they thereupon said, “Let us pray against our enemies in general terms (without mention of any name), as it is stated (v. 2) that they said, “if Thou wilt indeed give this people into my hand”.<br><br>דרך האתרים BY WAY OF ATHARIM — by way of the south country by which the spies (תרים) had gone, as it is said, (Numbers 13:22) “and they went up by the south country”. Another explanation of דרך האתרים is: By the way of the Great Searcher (the Ark) which used to journey in front of them, as it is said, (Numbers 10:33) “[and the Ark of the Covenant of the Lord went before them] in the three days’ journey to search out (לתור) a resting-place for them” (Midrash Tanchuma, Chukat 14).<br><br>וישב ממנו שבי (more lit.,) AND CAPTURED FROM THEM A CAPTIVE — it was only one maid servant (Yalkut Shimoni on Torah 764)."}, {"ch": 21, "v": 2, "aliyah": 3, "heb": "וַיִּדַּ֨ר יִשְׂרָאֵ֥ל נֶ֛דֶר לַֽיהֹוָ֖ה וַיֹּאמַ֑ר אִם־נָתֹ֨ן תִּתֵּ֜ן אֶת־הָעָ֤ם הַזֶּה֙ בְּיָדִ֔י וְהַֽחֲרַמְתִּ֖י אֶת־עָרֵיהֶֽם׃", "onk": "וְקַיֵּם יִשְׂרָאֵל קְיָם <b>קֳדָם<\/b> יְיָ וַאֲמַר אִם מִמְסַר תִּמְסַר יָת עַמָּא הָדֵין בִּידִי וַאֲגַמַּר יָת קִרְוֵיהוֹן:", "onk_en": "Yisroel made a vow to [<b>before<\/b>] Adonoy and said, “If You will deliver this people into my hand, I shall consecrate their cities.”", "pj": "וְקַיֵים יִשְרָאֵל קְיַים קֳדָם יְיָ וַאֲמַר אִין מִמְסַר תִּמְסַר יַת עַמָא הָדֵין בִּידִי וְאִגְמַר יַת קִירְוֵיהוֹן", "pj_en": "And Israel vowed a vow before the Lord and said, If Thou wilt indeed deliver this people into my hand, I will destroy their cities.", "tj": "", "tj_en": "", "rashi": "<b>והחרמתי.<\/b> אַקְדִּישׁ שְׁלָלָם לְגָבוֹהַּ:", "rashi_en": "והחרמתי means I WILL DEDICATE their spoil (that of the cities) to the Most High."}, {"ch": 21, "v": 3, "aliyah": 3, "heb": "וַיִּשְׁמַ֨ע יְהֹוָ֜ה בְּק֣וֹל יִשְׂרָאֵ֗ל וַיִּתֵּן֙ אֶת־הַֽכְּנַעֲנִ֔י וַיַּחֲרֵ֥ם אֶתְהֶ֖ם וְאֶת־עָרֵיהֶ֑ם וַיִּקְרָ֥א שֵׁם־הַמָּק֖וֹם חׇרְמָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְקַבֵּיל יְיָ <b>צְלוֹתֵיהּ<\/b> דְּיִשְׂרָאֵל וּמְסַר יָת כְּנַעֲנָאָה וְגַמַּר יָתְהוֹן וְיָת קִרְוֵיהוֹן וּקְרָא שְׁמָא דְאַתְרָא חָרְמָה:", "onk_en": "Adonoy heard Yisroel’s voice [<b>prayers<\/b>], and He delivered the Canaanites (into Yisroel’s hand), and he (Yisroel) destroyed them and [consecrated] their cities; the region was named Chormo.", "pj": "וְקַבֵּיל יְיָ צְלוֹתֵיהּ דְיִשְרָאֵל וּמְסַר יַת כְּנַעֲנָאָה וּגְמַר יַתְהוֹן וְיַת קִירְוֵויהוֹן וּקְרָא שְׁמָא דְאַתְרָא חָרְמָה", "pj_en": "And the Lord heard Israel's prayer, and delivered up the Kenaanites, and he destroyed them and their cities. And he called the name of the place Hormah.", "tj": "", "tj_en": "", "rashi": "<b>ויחרם אתהם.<\/b> בַּהֲרִיגָה:<br><br><b>ואת עריהם.<\/b> חֶרְמֵי גָבוֹהַּ:", "rashi_en": "ויחרם אתהם AND HE DOOMED THEM by slaughter,<br><br>ואת עריהם AND THEIR CITIES as things dedicated to the Most High."}, {"ch": 21, "v": 4, "aliyah": 3, "heb": "וַיִּסְע֞וּ מֵהֹ֤ר הָהָר֙ דֶּ֣רֶךְ יַם־ס֔וּף לִסְבֹ֖ב אֶת־אֶ֣רֶץ אֱד֑וֹם וַתִּקְצַ֥ר נֶֽפֶשׁ־הָעָ֖ם בַּדָּֽרֶךְ׃", "onk": "וּנְטָלוּ מֵהֹר טוּרָא אֹרַח יַמָּא דְסוּף לְאַקָּפָא יָת אַרְעָא דֶאֱדוֹם וַעֲקַת <b>נַפְשָׁא<\/b> דְעַמָּא בְּאוֹרְחָא:", "onk_en": "They then traveled from Mount Hor by the Reed Sea route, in order to circle around the land of Edom; traveling was insufferable to the [<b>soul of the<\/b>] people.", "pj": "וּנְטָלוּ מִטַוְורוֹס אוּמָנוֹס מַהֲלַךְ יַמָא דְסוּף לְאַחֲזָרָא יַת אַרְעָא דֶאֱדוֹם וּקְנָטַת נַפְשָׁא דְעַמָא בְּאָרְחָא", "pj_en": "And they journeyed from Mount Umanom, by the way of the Sea of Suph, that they might compass the land of Edom; and the soul of the people was wearied in the way.", "tj": "", "tj_en": "", "rashi": "דרךְ <b>ים סוף.<\/b> כֵּיוָן שֶׁמֵּת אַהֲרֹן וּבָאת עֲלֵיהֶם מִלְחָמָה זוֹ, חָזְרוּ לַאֲחוֹרֵיהֶם דֶּרֶךְ יַם סוּף, הוּא הַדֶּרֶךְ שֶׁחָזְרוּ לָהֶם כְּשֶׁנִּגְזַר עֲלֵיהֶם גְּזֵרַת מְרַגְּלִים, שֶׁנֶּאֱמַר \"וּסְעוּ הַמִּדְבָּרָה דֶּרֶךְ יַם סוּף\" (דברים א'), וְכָאן חָזְרוּ לַאֲחוֹרֵיהֶם שֶׁבַע מַסָּעוֹת, שֶׁנֶּאֱמַר \"וּבְנֵי יִשְׂרָאֵל נָסְעוּ מִבְּאֵרֹת בְּנֵי יַעֲקָן מוֹסֵרָה שָׁם מֵת אַהֲרֹן\", וְכִי בְמוֹסֵרָה מֵת? וַהֲלֹא בְהֹר הָהָר מֵת? אֶלָּא שָׁם חָזְרוּ וְהִתְאַבְּלוּ עָלָיו וְהִסְפִּידוּהוּ כְּאִלּוּ הוּא בִפְנֵיהֶם; וְצֵא וּבְדֹק בַּמַּסָּעוֹת וְתִמְצְאֵם שֶׁבַע מַסָּעוֹת מִן מוֹסֵרָה עַד הֹר הָהָר (תנחומא):<br><br><b>לסבב את ארץ אדום.<\/b> שֶׁלֹּא נְתָנָם לַעֲבֹר בְּאַרְצוֹ:<br><br><b>ותקצר נפש העם בדרך.<\/b> בְּטֹרַח הַדֶּרֶךְ שֶׁהֻקְשָׁה לָהֶם, אָמְרוּ עַכְשָׁו הָיִינוּ קְרוֹבִים לִכָּנֵס לָאָרֶץ וְאָנוּ חוֹזְרִים לַאֲחוֹרֵינוּ, כָּךְ חָזְרוּ אֲבוֹתֵינוּ וְנִשְׁתָּהוּ שְׁלֹשִׁים וּשְׁמוֹנֶה שָׁנָה עַד הַיּוֹם, לְפִיכָךְ קָצְרָה נַפְשָׁם בְּעִנּוּי הַדֶּרֶךְ, וּבְלַעַ\"ז אנקרוט\"לור; וְלֹא יִתָּכֵן לוֹמַר וַתִּקְצַר נֶפֶשׁ הָעָם בַּדָּרֶךְ — בִּהְיוֹתוֹ בַדֶּרֶךְ, וְלֹא פֵּרֵשׁ בּוֹ בַּמֶּה קָצְרָה, שֶׁכָּל מָקוֹם שֶׁתִּמְצָא קִצּוּר נֶפֶש בַּמִּקְרָא מְפֹרָשׁ שָׁם בַּמֶּה קָצְרָה, כְּגוֹן \"וַתִּקְצַר נַפְשִׁי בָּהֶם\" (זכריה י\"א), וּכְגוֹן \"וַתִּקְצַר נַפְשׁוֹ בַּעֲמַל יִשְׂרָאֵל\" (שופטים י'), וְכָל דָּבָר קָשֶׁה עַל אָדָם נוֹפֵל בּוֹ לְשׁוֹן קִצּוּר נֶפֶשׁ, כְּאָדָם שֶׁהַטֹּרַח בָּא עָלָיו וְאֵין דַּעְתּוֹ רְחָבָה לְקַבֵּל אוֹתוֹ הַדָּבָר וְאֵין לוֹ מָקוֹם בְּתוֹךְ לִבּוֹ לָגוּר שָׁם הַצַּעַר, וּבְדָבָר הַמַּטְרִיחַ נוֹפֵל לְשׁוֹן גֹּדֶל, שֶׁגָּדוֹל הוּא וְכָבֵד עַל הָאָדָם, כְּגוֹן \"וְגַם נַפְשָׁם בָּחֲלָה בִי\" (זכריה י\"א) — גָּדְלָה עָלַי, \"וְיִגְאֶה כַּשַּׁחַל תְּצוּדֵנִי\" (איוב י'); כְּלָלוֹ שֶׁל פֵּרוּשׁ, כָּל לְשׁוֹן קִצּוּר נֶפֶשׁ בְּדָבָר לָשׁוֹן שֶׁאֵין יָכוֹל לְסָבְלוֹ הוּא — שֶׁאֵין הַדַּעַת סוֹבַלְתּוֹ:", "rashi_en": "דרך ים סוף BY THE WAY OF THE RED SEA — As soon as Aaron died and this war came upon them they turned back on the way to the Red Sea; this was the way on which they had turned back when there had been enacted against them the decree that they must wander in the wilderness in consequence of their murmuring after having received the report of the spies, as it is said, (Deuteronomy 1:40), “And take your journey into the wilderness by the way to the Red Sea”. Here they went back seven stages, as it is said, (Deuteronomy 10:6), “And the children of Israel journeyed from Beeroth-bene-jaakan to Moserah; there Aaron died”. But did he really die at Moserah; was it not at Mount Hor that he died?” But the explanation is, that there (at Moserah) they again mourned and lamented for him just as though he there lay dead before them. Go and examine the list of the stages (Numbers 33:31—37) and you will find that there are seven stages from Moserah to Mount Hor (Midrash Tanchuma, Chukat 18).<br><br>לסבב את ארץ אדום TO GO ROUND THE LAND OF EDOM — to go round it, because they would not permit them to pass through their land.<br><br>ותקצר נפש העם בדרך AND THE SOUL OF THE PEOPLE WAS MUCH DISCOURAGED BECAUSE OF THE WAY — because of the difficulties of the journey which were so hard for them. They said: Now we are close enough to enter the land, and yet we have to turn back. Just so had our fathers to turn back and they stayed in the wilderness thirty eight years until this day. —Consequently their soul became discouraged because of the hardship of the journey. In O. F., En cure del tour. — It would not be correct to say that ותקצר נפש העם בדרך means “[and the soul of the people was discouraged] while they were on the journey” and that it (the text) does not explain what it was discouraged through, for in every passage in Scripture where you find the phrase “the soul being discouraged”, it is there explained through what it became discouraged (the preposition ב being prefixed to the word that expresses the cause of discouragement). For example, (Zechariah 11:8) “And my soul became impatient of them (בהם)”, and, for example, (Judges 10:16): “And His soul became impatient with the enemies on account of the misery (בעמל) they inflicted upon Israel”. To anything that is hard for a man to bear the expression “the shortening of soul” (קצור נפש) is applicable - he is like a person upon whom trouble comes and his mind is not large enough to contain that matter and there is no room in his heart for that worry to abide there. Of the thing that causes the trouble the term “large” is used, denoting that it is too huge and heavy for a person. For example, (Zechariah 11:8) וגם נפשם בחלה בי, which signifies “(And also their souls] were great upon Me”; (Job. 10:16), “And it becomes large (it is a burden to Thee) even that Thou huntest me as though I were a lion”. (See Rashi on these verses and on Niddah 47a). To sum up the explanation: the phrase “shortening of the soul through a thing” signifies that one cannot bear it — that the mind cannot bear it."}, {"ch": 21, "v": 5, "aliyah": 3, "heb": "וַיְדַבֵּ֣ר הָעָ֗ם בֵּֽאלֹהִים֮ וּבְמֹשֶׁה֒ לָמָ֤ה הֶֽעֱלִיתֻ֙נוּ֙ מִמִּצְרַ֔יִם לָמ֖וּת בַּמִּדְבָּ֑ר כִּ֣י אֵ֥ין לֶ֙חֶם֙ וְאֵ֣ין מַ֔יִם וְנַפְשֵׁ֣נוּ קָ֔צָה בַּלֶּ֖חֶם הַקְּלֹקֵֽל׃", "onk": "<b>וְאִתְרַעַם<\/b> עַמָּא <b>בְּמֵימְרָא<\/b> דַיְיָ וְעִם משֶׁה נְצוֹ לְמָא אַסֶּקְתּוּנָא מִמִּצְרַיִם לִמְמַת בְּמַדְבְּרָא אֲרֵי לֵית לַחְמָא וְלֵית מַיָּא וְנַפְשָׁנָא עָקַת בְּמַנָּא הָדֵין <b>דְּמֵיכְלֵיהּ קָלִיל<\/b>:", "onk_en": "The people spoke out [<b>complained<\/b>] against [<b>the word of<\/b>] God and [<b>they fought<\/b>] Moshe, “Why did you bring us up out of Egypt to die in the wilderness? There is no food and no water, and we are disgusted with this rotten bread [<b>which is eaten simply<\/b>].”", "pj": "וְהִרְהֲרוּ עַמָא בִּלְבָבֵיהוֹן וְאִשְׁתָּעִיאוּ עַל מֵימְרָא דַיְיָ וּבְמשֶׁה נָצוּ לְמָא אַסֵיקְתָּנָא מִמִצְרַיִם לִמְמַת בְּמַדְבְּרָא אֲרוּם לֵית לַחֲמָא וְלֵית מַיָא וְנַפְשָׁתָנָא קַנְטַת בְּמַנָא הָדֵין דִמְזוֹנֵיהּ קָלִיל", "pj_en": "And the people thought (wickedly) in their heart, and talked against the Word of the Lord, and contended with Mosheh, saying: Why didst thou bring us up from Mizraim to die in the wilderness; for there is neither bread nor water, and our soul is weary of manna, this light food?", "tj": "", "tj_en": "", "rashi": "<b>באלהים ובמשה.<\/b> הִשְׁווּ עֶבֶד לְקוֹנוֹ (תנחומא):<br><br><b>למה העליתנו.<\/b> שְׁנֵיהֶם שָׁוִים:<br><br><b>ונפשנו קצה.<\/b> אַף זֶה לְשׁוֹן קִצּוּר נֶפֶשׁ וּמִאוּס:<br><br><b>בלחם הקלקל.<\/b> לְפִי שֶׁהַמָּן נִבְלָע בָּאֵבָרִים קְרָאוּהוּ קְלֹקֵל, אָמְרוּ, עָתִיד הַמָּן הַזֶּה שֶׁיִּתְפַּח בְּמֵעֵינוּ, כְּלוּם יֵשׁ יְלוּד אִשָּׁה שֶׁמַּכְנִיס וְאֵינוֹ מוֹצִיא? (יומא ע\"ה):", "rashi_en": "באלהים ובמשה [AND THE PEOPLE SPAKE] AGAINST GOD AND AGAINST MOSES — They placed the servant on a par with his Master (Midrash Tanchuma, Chukat 19).<br><br>למה העליתנו WHEREFORE HAVE YE BROUGHT US UP — “ye”: they (God and Moses) were both on a par to them.<br><br>ונפשנו קצה AND OUR SOUL LOATHETH — This, too, is an expression for “the shortening of soul” and “rejecting” (not being able to bear the trouble).<br><br>בלחם הקלקל THIS LIGHT BREAD — because the manna was miraculously absorbed into their limbs (and was not execrated) they derisively called it “light”. They said: this manna will at some time or other swell up in our stomachs, for is there any mortal (lit., anyone born of woman) who takes in food and does not eject it? (Yoma 75b; cf. Rashi on Avodah Zarah 5b)."}, {"ch": 21, "v": 6, "aliyah": 3, "heb": "וַיְשַׁלַּ֨ח יְהֹוָ֜ה בָּעָ֗ם אֵ֚ת הַנְּחָשִׁ֣ים הַשְּׂרָפִ֔ים וַֽיְנַשְּׁכ֖וּ אֶת־הָעָ֑ם וַיָּ֥מׇת עַם־רָ֖ב מִיִּשְׂרָאֵֽל׃", "onk": "וְגָרֵי יְיָ בְּעַמָּא יָת חִיוַן קָלָן וּנְכִיתוּ יָת עַמָּא וּמִית עַם סַגִּי מִיִּשְׂרָאֵל:", "onk_en": "Adonoy sent against the people the consuming snakes, and they bit the people, and many people of Yisroel died.", "pj": "בְּרַת קָלָא נַפְלַת מִן שְׁמֵי מְרוֹמָא וְכֵן אָמְרַת אִיתוּן חָמוּן כָּל בְּנֵי נְשָׁא כָּל טַבְיָין דַעֲבָדִית לְעַמָא אַסֵיקִית יַתְהוֹן פְּרִיקִין מִמִצְרַיִם אָחֵיתִית לְהוֹן מַנָא מִן שְׁמַיָא וּכְדוּן חָזְרוּ וְאִתְרַעֲמוּ עֲלוֹי וְהָא חִיוְיָא דְגָזְרִית עֲלוֹי מִן יוֹמֵי שֵׁירוּי עַלְמָא עָפָר יֶהֱוֵי מְזוֹנֵיהּ וְלָא אִתְרְעַם עִלַוַי וְעַמִי אִתְרַעֲמוּ עַל מְזוֹנֵיהוֹן וּכְדוּן יֵיתוּן חִיוָון דְלָא אִתְרַעֲמוּ עַל מְזוֹנֵיהוֹן וִינַכְתוּן יַת עַמָא דִי אִתְרַעֲמוּ עַל מְזוֹנֵיהוֹן בְּכֵן גָרֵי מֵימְרָא דַיְיָ בְּעַמָא יַת חִיוָון חוּרְמָנִין וּנְכִיתוּ יַת עַמָא וּמִיתוּ אוֹכְלוֹסִין סַגִיאִין מִיִשְרָאֵל", "pj_en": "And the bath-kol fell from the high heaven, and thus spake: Come, all men, and see all the benefits which I have done to the people whom I brought up free out of Mizraim. I made manna come down for them from heaven, yet now turn they and murmur against Me. Yet, behold, the serpent, whom, in the days of the beginning of the world, I doomed to have dust for his food, hath not murmured against me: but My people are murmuring about their food. Now shall the serpents who have not complained of their food come and bite the people who complain. Therefore did the Word of the Lord send the basilisk serpents, and they bit the people, and a great multitude of the people of Israel died.", "tj": "בְּרַת קַל נַפְקַת מִגוֹ אַרְעָא וְאִשְׁתַּמַע קָלָא בִּמְרוֹמַיָא חֲמוּן כָּל בְּנֵי אֱנָשָׁא וְאָצִיתוּ וּשְׁמִיעוּ כָּל בְּנֵי בִישְרָא לָטִית חִוְיָא מִן שֵׁרוּיָא וַאֲמָרִית לֵיהּ עַפְרָא יְהֵי מְזוֹנָךְ וְלָא אִתְרְעַם עַל מְזוֹנָא אַפֵּיקִית עַמִי פְּרִיקִין מִמִצְרַיִם וַאֲחָתִית לְהוֹן מַנָא מִשְׁמַיָא וַאֲגִיזַת לְהוֹן סַלְוָוא מִן יַמָא וְאַסֵיקַת לְהוֹן בֵּירָא מִתְּהוֹמָא חָזְרוּ עַמָא לְמִתְרַעֲמִין קֳדָמַי עַל עֵיסַק מַנָא לְמֵימָר נַפְשָׁן מְעִיקָא בְּלַחְמָא דְמֵיכְלֵיהּ קָלִיל מִן בְּגִין כֵּן יֵתֵי חִוְיָא דְלָא אִתְרְעַם עַל מְזוֹנֵיהּ וְאַנְכִית לְעַמָא הָאִילֵין דְאִתְרַעֲמוּ עַל מְזוֹנֵיהוֹן וְגָרֵי מֵימְרָא דַיְיָ בְּעַמָא יַת חִוְיָא שְרָפַיָא וּנְכִיתוּ יַת עַמָא וּמִיתוּ אוֹכְלוֹסִין סַגְיָן מִן יִשְרָאֵל:", "tj_en": "The bath-kol came forth from the midst of the earth, and a voice was heard from the heights, See, all men, and listen and hear, all ye children of flesh. The serpent, whom I cursed at the beginning, and said to him, Dust shall be thy food, hath not complained about his food. I led forth My people from Mizraim free, and caused the manna to descend for them from heaven; I made the quails to come over to them, and the well to spring up from the deep; yet now they again complain before Me on account of the manna, saying, Our soul is aggrieved by this light bread: therefore shall the serpent who hath not complained of his food come and bite this people who have murmured about their food. So the Word of the Lord sent fiery serpents among the people, and they bit the people, and a great multitude of Israel died.", "rashi": "<b>את הנחשים השרפים.<\/b> שֶׁשּׂוֹרְפִים אֶת הָאָדָם בְּאֶרֶס שִׁנֵּיהֶם:<br><br><b>וינשכו את העם.<\/b> יָבֹא נָחָשׁ שֶׁלָּקָה עַל הוֹצָאַת דִּבָּה וְיִפָּרַע מִמּוֹצִיאֵי דִּבָּה, יָבֹא נָחָשׁ שֶׁכָּל הַמִּינִין נִטְעָמִין לוֹ טַעַם אֶחָד וְיִפָּרַע מִכְּפוּיֵי טוֹבָה שֶׁדָּבָר אֶחָד מִשְׁתַּנֶּה לָהֶם לְכַמָּה מַטְעַמִּים (תנחומא):", "rashi_en": "את הנחשים השרפים BURNING SERPENTS — so termed because they burn (cause fever in) a person through the poison of their fangs.<br><br>וינשכו את העם AND THEY BIT THE PEOPLE — God said, as it were: Let the serpent which was punished for slanderous statements come and exact punishment from those who utter slander. — Let the serpent to which all kinds of food have one taste (that of earth; cf. Genesis 3:14 and Yoma 75a) come and exact punishment from these ingrates to whom one thing (the manna) had the taste of many different dainties (see Rashi 11:8) (Midrash Tanchuma, Chukat 19)."}, {"ch": 21, "v": 7, "aliyah": 3, "heb": "וַיָּבֹא֩ הָעָ֨ם אֶל־מֹשֶׁ֜ה וַיֹּאמְר֣וּ חָטָ֗אנוּ כִּֽי־דִבַּ֤רְנוּ בַֽיהֹוָה֙ וָבָ֔ךְ הִתְפַּלֵּל֙ אֶל־יְהֹוָ֔ה וְיָסֵ֥ר מֵעָלֵ֖ינוּ אֶת־הַנָּחָ֑שׁ וַיִּתְפַּלֵּ֥ל מֹשֶׁ֖ה בְּעַ֥ד הָעָֽם׃", "onk": "וַאֲתָא עַמָּא לְמשֶׁה וַאֲמָרוּ חַבְנָא אֲרֵי <b>אִתְרַעַמְנָא קֳדָם<\/b> יְיָ וְעִמָּךְ <b>נְצֵינָא<\/b> צַלִּי <b>קֳדָם<\/b> יְיָ וְיַעֲדִּי מִנָּנָא יָת חִוְיָא וְצַלִּי משֶׁה עַל עַמָּא:", "onk_en": "The people came to Moshe and said, “We have sinned by speaking against [<b>complaining before<\/b>] Adonoy and [<b>fighting with<\/b>] you; pray to [<b>before<\/b>] Adonoy that He remove the snakes from us.” Moshe prayed on behalf of the people.", "pj": "וְאָתוּ עַמָא לְוַת משֶׁה וַאֲמָרוּ חַבְנָא אֲרוּם הַרְהִירְנָא וְאִשְׁתָּעִינָא בִיקַר שְׁכִינְתָּא דַיְיָ וְעִמָךְ נָצֵינָא צַלִי קֳדָם יְיָ וְיַעֲדִי מִינָנָא יַת מְחַת חִוְיָא וְצַלִי משֶׁה עַל עַמָא", "pj_en": "And the people came to Mosheh, and said: We have sinned, in thinking and speaking against the glory of the Lord's Shekinah, and in contending with thee. Pray before the Lord to remove the plague of serpents from us. And Mosheh prayed for the people.", "tj": "", "tj_en": "", "rashi": "<b>ויתפלל משה.<\/b> מִכָּאן לְמִי שֶׁמְּבַקְשִׁים מִמֶּנּוּ, שֶׁלֹּא יְהֵא אַכְזָרִי מִלִּמְחֹל (עי' תנחומא):", "rashi_en": "ויתפלל משה AND MOSES PRAYED — From this we may learn that he of whom one seeks forgiveness should not be so cruel as not to forgive (cf. Midrash Tanchuma, Chukat 19)."}, {"ch": 21, "v": 8, "aliyah": 3, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה עֲשֵׂ֤ה לְךָ֙ שָׂרָ֔ף וְשִׂ֥ים אֹת֖וֹ עַל־נֵ֑ס וְהָיָה֙ כׇּל־הַנָּשׁ֔וּךְ וְרָאָ֥ה אֹת֖וֹ וָחָֽי׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עֲבֵיד לָךְ קָלְיָא וְשַׁוֵּי יָתֵיהּ עַל אָת וִיהֵי כָּל דְּיִתְנְכִית וְיֶחֱזֵי יָתֵיהּ וְיִתְקַיָּם:", "onk_en": "Adonoy said to Moshe, “Make yourself [the image of] a consuming snake, and place it upon a banner; and anyone bitten will look at it and live.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה עִיבַד לָךְ חִיוְיָא דִנְחָשָׁא וְשַׁוִי יָתֵיהּ עַל אֲתַר תְּלֵי וִיהֵי כָּל דִנְכִית יָתֵיהּ חִיוְיָא וִיהֵי מִסְתַּכֵּל בֵּיהּ וְחָאִי אִין מְכַוִין לִבֵּיהּ לְשׁוּם מֵימְרָא דַיְיָ", "pj_en": "And the Lord said to Mosheh, Make thee a serpent of brass, and set it upon a place aloft; and it shall be that when a serpent hath bitten any one, if he behold it, then shall he live, if his heart be directed to the Name of the Word of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>על נס.<\/b> עַל כְּלוֹנָס, שֶׁקּוֹרִין פירק\"א בְּלַעַז, וְכֵן \"וְכַנֵּס עַל הַגִּבְעָה\" (ישעיהו ל'), \"אָרִים נִסִּי\" (שם מ\"ט), \"שְׂאוּ נֵס\" (שם י\"ג); וּלְפִי שֶׁהוּא גָּבוֹהַּ לְאוֹת וְלִרְאָיָה, קוֹרְאוֹ נֵס:<br><br><b>כל הנשוך.<\/b> אֲפִלּוּ כֶלֶב אוֹ חֲמוֹר נוֹשְׁכוֹ הָיָה נִזּוֹק וּמִתְנַוְּנֶה וְהוֹלֵךְ, אֶלָּא שֶׁנְּשִׁיכַת הַנָּחָשׁ מְמַהֶרֶת לְהָמִית, לְכָךְ נֶאֱמַר כָּאן וְרָאָה אֹתוֹ — רְאִיָּה בְעָלְמָא — וּבִנְשִׁיכַת הַנָּחָשׁ נֶאֱמַר \"וְהִבִּיט\" — וְהָיָה אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ וְהִבִּיט וְגוֹ' — שֶׁלֹּא הָיָה מְמַהֵר נְשׁוּךְ הַנַּחַשׁ לְהִתְרַפְּאוֹת אֶלָּא אִם כֵּן מַבִּיט בּוֹ בְּכַוָּנָה; וְאָמְרוּ רַבּוֹתֵינוּ וְכִי נָחָשׁ מֵמִית אוֹ מְחַיֶּה? אֶלָּא, בִּזְמַן שֶׁהָיוּ יִשְׂרָאֵל מִסְתַּכְּלִין כְּלַפֵּי מַעְלָה וּמְשַׁעְבְּדִין אֶת לִבָּם לַאֲבִיהֶם שֶׁבַּשָּׁמַיִם הָיוּ מִתְרַפְּאִים, וְאִם לָאו הָיוּ נִמּוֹקִים (ראש השנה כ\"ט):", "rashi_en": "על נס means [SET IT] UPON A POLE which is termed perche in O. F. Similar is, (Isaiah 30:17) “And like a polo (banner) upon the hill”; (Isaiah 49:22) “I will lift up my pole (banner)”; (Isaiah 13:3) “Lift up a banner.\" Because it is lofty so that it can serve as a sign and as evidence of something it is called נס, something raised on high (cf. Rashi on Exodus 20:17).<br><br>כל הנשוך ANYONE THAT IS BITTEN — even though a dog or ass had bitten him, he felt the effects of the injury and became enfeebled more and more (cf. Tanchuma); only that the bite of a serpent kills more speedily. On this account it is stated here: וראה אתו, “whoever has been bitten, when he seeth it, [shall live]” — a mere glance sufficed to heal him. But in the case of the serpent’s bite it is stated והביט, and he gazed — “and it came to pass that if a serpent had bitten any man, when he gazed [at the brazen serpent, he lived]”, for the serpent’s bite was not so quick to heal unless he gazed intently (cf. Jerusalem Talmud Rosh Hashanah 3:9). — Our Rabbis said: But could the copper serpent cause death or life?! But the explanation is that when the Israelites in gazing at the serpent looked up on high and subjected their hearts to their Father in Heaven, they were healed, but if they did not do this they waste away (Rosh Hashanah 29a)."}, {"ch": 21, "v": 9, "aliyah": 3, "heb": "וַיַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַיְשִׂמֵ֖הוּ עַל־הַנֵּ֑ס וְהָיָ֗ה אִם־נָשַׁ֤ךְ הַנָּחָשׁ֙ אֶת־אִ֔ישׁ וְהִבִּ֛יט אֶל־נְחַ֥שׁ הַנְּחֹ֖שֶׁת וָחָֽי׃", "onk": "וַעֲבַד משֶׁה חִוְיָא דִנְחָשָׁא וְשַׁוְיֵיהּ עַל אָת וַהֲוָה כַּד נָכִית חִוְיָא יָת גַּבְרָא וּמִסְתַּכֵּל לְחִוְיָא דִנְחָשָׁא וּמִתְקַיָּם:", "onk_en": "Moshe made a copper snake and placed it on the banner; whenever a snake bit a person, he would gaze upon the copper snake and live.", "pj": "וַעֲבַד משֶׁה חִיוְיָא דִנְחָשָׁא וְשַׁוִי יָתֵיהּ עַל אֲתַר תְּלֵי וַהֲוֵי כַּד נְכִית חִיוְיָא יַת גַבְרָא וַהֲוָה מִסְתַּכֵּל בְּחִיוְיָא דִנְחָשָׁא וּמְכַוֵין לִבֵּיהּ לְשׁוּם מֵימְרָא דַיְיָ וְחָאִי", "pj_en": "And Mosheh made a serpent of brass, and set it upon a place aloft; and it was, when a serpent had bitten a man, and the serpent of brass was gazed at, and his heart was intent upon the Name of the Word of the Lord, he lived.", "tj": "וַעֲבַד משֶׁה חִיוְיָא דִנְחַשׁ וְשַׁוֵי יָתֵיהּ עַל אֲתַר תְּלֵי וַהֲוָה כָּל מַן דַהֲוָה מִינְכַת בְּחִיוְיָא הֲוָה תָלֵי אַפּוֹי בִּצְלוֹי גַב אָבוּי דְבִשְׁמַיָא וּמִסְתַּכֵּל בְּחִוְיָא דִנְחָשָׁא: וָחָי וּשְׁתָק:", "tj_en": "And Mosheh made a serpent of brass, and set it upon a high place; and it was that when any one had been bitten by a serpent, and his face was uplifted in prayer unto his Father who is in heaven, and he looked upon the brazen serpent, he lived.", "rashi": "<b>נחש נחשת.<\/b> לֹא נֶאֱמַר לוֹ לַעֲשׂוֹתוֹ שֶׁל נְחֹשֶׁת, אֶלָּא אָמַר מֹשֶׁה, הַקָּבָּ\"ה קוֹרְאוֹ נָחָשׁ וַאֲנִי אֶעֱשֶׂנּוּ שֶׁל נְחֹשֶׁת, לָשׁוֹן נוֹפֵל עַל לָשׁוֹן (בראשית רבה ל\"א):", "rashi_en": "נחש נחשת A SERPENT OF COPPER — He had not been told to make it of copper, but Moses said, “The Holy One, blessed be He, terms it נחש; I will therefore make it of נחשת — one term fitting the other term” (Genesis Rabbah 31:8)."}, {"ch": 21, "v": 10, "aliyah": 3, "heb": "וַיִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽיַּחֲנ֖וּ בְּאֹבֹֽת׃", "onk": "וּנְטָלוּ בְּנֵי יִשְׂרָאֵל וּשְׁרוֹ בְּאֹבֹת:", "onk_en": "Bnei Yisroel traveled on and camped in Ovos.", "pj": "וּנְטָלוּ מִתַּמָן בְּנֵי יִשְרָאֵל וּשְׁרוֹ בְּאוֹבוֹת", "pj_en": "And the children of Israel journeyed from thence, and pitched in Oboth;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 11, "aliyah": 3, "heb": "וַיִּסְע֖וּ מֵאֹבֹ֑ת וַֽיַּחֲנ֞וּ בְּעִיֵּ֣י הָֽעֲבָרִ֗ים בַּמִּדְבָּר֙ אֲשֶׁר֙ עַל־פְּנֵ֣י מוֹאָ֔ב מִמִּזְרַ֖ח הַשָּֽׁמֶשׁ׃", "onk": "וּנְטָלוּ מֵאֹבֹת וּשְׁרוֹ בִּמְגִיזַת עֲבָרָאֵי בְּמַדְבְּרָא דִּי עַל אַפֵּי מוֹאָב מִמַּדְנַח שִׁמְשָׁא:", "onk_en": "They traveled from Ovos and camped in the wasteland passes in the wilderness, facing Moav, eastward of the sun.", "pj": "וּנְטָלוּ מֵאוֹבוֹת וּשְׁרוֹ בְּמֵשְׁרֵי מְגִזְתָא בְּמַדְבְּרָא אָתַר דִמְכֻוָן עַל אַנְפֵּי מוֹאָב מִמַדְנַח שִׁמְשָׁא", "pj_en": "and they journeyed from Oboth, and encamped in the plain of Megistha, in a desert place which looketh toward Moab from the rising of the sun.", "tj": "", "tj_en": "", "rashi": "<b>בעיי העברים.<\/b> לֹא יָדַעְתִּי לָמָּה נִקְרָא שְׁמָם עִיִּים, וְעִי לְשׁוֹן חָרְבָּה הִיא — דָּבָר הַטָּאוּט בְּמַטְאֲטֵא, וְהָעַיִ\"ן בּוֹ יְסוֹד לְבַדָּהּ, וְהוּא מִלְּשׁוֹן \"יָעִים\" (שמות כ\"ז), \"וְיָעָה בָרָד\" (ישעיהו כ\"ח):<br><br><b>העברים.<\/b> דֶּרֶךְ מַעֲבַר הָעוֹבְרִים שָׁם אֶת הַר נְבוֹ אֶל אֶרֶץ כְּנַעַן, שֶׁהוּא מַפְסִיק בֵּין אֶרֶץ מוֹאָב לְאֶרֶץ אֱמוֹרִי:<br><br><b>על פני מואב ממזרח השמש.<\/b> בְּמִזְרָחָהּ שֶׁל אֶרֶץ מוֹאָב:", "rashi_en": "בעיי העברים IN IJE-ABARIM (in the עיים of Abarim) — I do not know why the name (that of these places) was called עיים, for the term עי signifies ruins; it is a thing (spot) that has been swept as it were with a broom. Only the single letter ע in it belongs to the root; it is connected in meaning with יעים (Exodus 27:3) and (Isaiah 28:17) “And the hail shall sweep away (יעה).<br><br>העברים  (from עבר to pass) — the road forming a pass for those who at that spot pass by Mount Nebo on their way to the land of Canaan, which mount separates the land of Moab from the land of the Amorites. ...<br><br>על פני מואב ממזרח השמש [IN THE WILDERNESS WHICH IS] BEFORE MOAB TOWARDS THE SUN-RISING (the East) — i.e., to the East of the land of Moab (not in the East of the world)."}, {"ch": 21, "v": 12, "aliyah": 3, "heb": "מִשָּׁ֖ם נָסָ֑עוּ וַֽיַּחֲנ֖וּ בְּנַ֥חַל זָֽרֶד׃", "onk": "מִתַּמָּן נְטָלוּ וּשְׁרוֹ בְּנַחֲלָא דְזָרֶד:", "onk_en": "They traveled from there and camped in the valley of Zered.", "pj": "מִתַּמָן נְטָלוּ וּשְׁרוֹ בְּנַחְלָא דְמִירְבֵּי חִילְפֵי וְגַלִי וְסִיגְלֵי", "pj_en": "Thence they journeyed and encamped in a valley abounding in reeds, osiers, and mandrakes.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 13, "aliyah": 3, "heb": "מִשָּׁם֮ נָסָ֒עוּ֒ וַֽיַּחֲנ֗וּ מֵעֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּמִּדְבָּ֔ר הַיֹּצֵ֖א מִגְּבֻ֣ל הָֽאֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּבֵ֥ין הָאֱמֹרִֽי׃", "onk": "מִתַּמָּן נְטָלוּ וּשְׁרוֹ מֵעִבְרָא דְאַרְנוֹן דִּי בְמַדְבְּרָא דְּנָפֵק מִתְּחוּם אֱמוֹרָאָה אֲרֵי אַרְנוֹן תְּחוּם מוֹאָב בֵּין מוֹאָב וּבֵין אֱמוֹרָאָה:", "onk_en": "They traveled from there and camped opposite Arnon, in the wilderness, extending from the Emorite border; Arnon being the Moav border between Moav and the Emorite.", "pj": "וּמִתַּמָן נְטָלוּ וּשְׁרוֹ מִן לְהָאֵל לְאַרְנוֹן בְּמַעְבְּרָא דִבְמַדְבְּרָא דְנָפִיק מִתְּחוּם אֱמוֹרָאָה אֲרוּם אַרְנוֹן תְּחוּם מוֹאָב מְמֻצָע בֵּין מוֹאָב וּבֵין אֱמוֹרָאָה וְיַתְבִין בֵּיהּ כּוּמְרָנַיָא פַּלְחֵי טַעֲוַותְהוֹן", "pj_en": "And they journeyed from thence, and encamped beyond the Arnon, in a passage of the desert that stretcheth from the coast of the Amoraah; for Arnon is the border of Moab, situate between Moab and the Amoraah; and therein dwelt a priesthood of the worshippers of idols.", "tj": "", "tj_en": "", "rashi": "<b>מגבל האמרי.<\/b> תְּחוּם סוֹף מֶצֶר שֶׁלָּהֶם, וְכֵן גְּבוּל מוֹאָב — לְשׁוֹן קָצֶה וָסוֹף:<br><br><b>מעבר ארנון.<\/b> הִקִּיפוּ אֶרֶץ מוֹאָב כָּל דְּרוֹמָהּ וּמִזְרָחָהּ עַד שֶׁבָּאוּ מֵעֵבֶר הַשֵּׁנִי לְאַרְנוֹן בְּתוֹךְ אֶרֶץ הָאֱמוֹרִי בִּצְפוֹנָהּ שֶׁל אֶרֶץ מוֹאָב:<br><br><b>היצא מגבל האמרי.<\/b> רְצוּעָה יוֹצְאָה מִגְּבוּל הָאֱמוֹרִי וְהִיא שֶׁל אֱמוֹרִיִּים, וְנִכְנֶסֶת לִגְבוּל מוֹאָב עַד אַרְנוֹן שֶׁהוּא גְּבוּל מוֹאָב, וְשָׁם חָנוּ יִשְֹרָאֵל וְלֹא בָאוּ לִגְבוּל מוֹאָב, <b>כי ארנון גבול מואב<\/b>, וְהֵם לֹא נָתְנוּ לָהֶם רְשׁוּת לַעֲבֹר בְּאַרְצָם, וְאַעַ\"פִּי שֶׁלֹּא פֵרְשָׁהּ מֹשֶׁה, פֵּרְשָׁהּ יִפְתָּח, כְּמוֹ שֶׁאָמַר יִפְתָּח (שופטים י\"א) \"וְגַם אֶל מֶלֶךְ מוֹאָב שָׁלַח וְלֹא אָבָה\", וּמֹשֶׁה רְמָזָהּ (דברים ב'), \"כַּאֲשֶׁר עָשׂוּ לִי בְּנֵי עֵשָׂו הַיֹּשְׁבִים בְּשֵׂעִיר וְהַמּוֹאָבִים הַיֹּשְׁבִים בְּעָר\" — מָה אֵלּוּ לֹא נְתָנוּם לַעֲבֹר בְּתוֹךְ אַרְצָם אֶלָּא הִקִּיפוּם סָבִיב, אַף מוֹאָב כֵּן:", "rashi_en": "מגבל האמרי The word גבול denotes boundary-line of (marking) the end of their frontier. Similar is the term the גבול of Moab (in this verse): it is an expression for extremity and end.<br><br>מעבר ארנון ON THE OTHER SIDE OF ARNON — they travelled round the land of Moab along the whole of its southern and eastern sides until they came to the other side of the Arnon into the land of the Amorites on the north of the land of Moab.<br><br>היצא מגבל האמרי [ARNON WHICH IS IN THE WILDERNESS] THAT COMETH OUT OF THE BOUNDARY OF THE AMORITES — a strip of land jutted out from the territory of the Amorites — it belonged to the Amorites — and entered into the territory of Moab extending unto the Arnon which is the boundary of Moab. It was there that the Israelites encamped and thus they did not pass into the territory of Moab, כי ארנון גבול מואב, FOR ARNON IS THE BOUNDARY OF MOAB, and they did not grant them permission to pass through their land. And although Moses did not state this plainly, Jephtha plainly stated it], as Jephtha said, (Judges 11:17) \"And in like manner he sent unto the king of Moab, out he would not permit him to pass through his territory”. Moses, however, made an allusion to it when he stated, (Deuteronomy 2:29) “As the children of Esau that dwell in Seir, and the Moabites that dwell in Ar, did unto me”. What was the case with these (the children of Esau)? They did not permit them to pass through their land, but they made them travel right round it! Similarly, too, Moab did!"}, {"ch": 21, "v": 14, "aliyah": 3, "heb": "עַל־כֵּן֙ יֵֽאָמַ֔ר בְּסֵ֖פֶר מִלְחֲמֹ֣ת יְהֹוָ֑ה אֶת־וָהֵ֣ב בְּסוּפָ֔ה וְאֶת־הַנְּחָלִ֖ים אַרְנֽוֹן׃", "onk": "עַל כֵּן יִתְאַמַּר בְּסִפְרָא קְרָבִין דַּעֲבַד יְיָ עַל יַמָּא דְסוּף <b>וּגְבוּרַן<\/b> דְּעַל נַחֲלֵי אַרְנוֹן:", "onk_en": "Concerning this will be told in the Book of the Wars of Adonoy, “He gave at the Reeds (Sea) and [<b>the might at<\/b>] the valleys of Arnon.", "pj": "עַל כֵּן יִּתְאַמַר בְּסֵפֶר אוֹרַיְיתָא דְתַמָן כְּתִיבִין קְרָבַיָא דַיְיָ אֶת וָהֵב דַהֲווֹן בְּעִלְעוּלָא דִסְגִירוּתָא וּטְרִידוּן בְּסוֹף מַשְׁרִיתָא הִינוּן בִּשְרוּ יַת יִשְרָאֵל דֶאֱדוֹם וּמוֹאָב אִיטְמָרוּ בֵּינֵי טַוְרַיָא לְמִכְמַן וּלְשֵׁיצָאָה עַמָא בֵּית יִשְרָאֵל וּמָארֵי עַלְמָא רָמַז לְטַוְרַיָא וְקָרִיבוּ דֵין לְדֵין וּמִיתוּ וַאֲרַמְהוֹן הֲוָה נְגִיד בְּנַחֲלָא סְמִיךְ לְאַרְנוֹן", "pj_en": "Therefore it is said in the book of the Law, where are recorded the wars of the Lord: Eth and Heb, who had been smitten with the blast of the leprosy, and had been banished beyond the confine of the camp, made known. to Israel that Edom and Moab were concealed among the mountains in ambush, to destroy the people of the house of Israel. But the Lord of the world made a sign to the mountains, which pressed one to another so that they died: and their blood flowed through a valley on the brink of the Arnon (or, a valley adjoining Arnon).", "tj": "בְּגִין כְּדֵין יִתְאַמַר בְּסֵפֶר אוֹרַיְיתָא דַיְיָ דִמְתִיל בְּסֵפֶר קְרָבַיָא נִיסַיָא וּגְבוּרְתָּא דְעָבַד יְיָ לְעַמֵיהּ בְּגוֹ בְּנֵי יִשְרָאֵל כַּד הֲווֹ קַיְימִין עַל יַמָא דְסוּף כֵּן עָבַד עִמְהוֹן כַּד הֲווֹ עָבְרִין יַת נַחֲלֵי אַרְנוֹנָא:", "tj_en": "Therefore it is said in the Book of the Law of the Lord, which is likened to a Book of Wars: The miracles and mighty acts which the Lord wrought for His people, the sons of Israel, when they stood by the Red Sea, so did He with them when they were at the fords of the vale of Arnona.", "rashi": "<b>על כן יאמר.<\/b> עַל חֲנִיָּה זוֹ וְנִסִּים שֶׁנַּעֲשׂוּ בָהּ <b>יאמר בספר מלחמת ה'<\/b> — כְּשֶׁמְּסַפְּרִים נִסִּים שֶׁנַּעֲשׂוּ לַאֲבוֹתֵינוּ יְסַפְּרוּ אֶת וָהֵב וגו':<br><br><b>את והב.<\/b> כְּמוֹ אֶת יָהֵב, כְּמוֹ שֶׁיֵּאָמֵר מִן יעד וָעֵד, כֵּן יֵאָמֵר מִן יהב וָהֵב, וְהַוָּי\"ו יְסוֹד הוּא, כְּלוֹמַר אֶת אֲשֶׁר יָהַב לָהֶם וְהִרְבָּה נִסִּים בְּיַם סוּף:<br><br><b>ואת הנחלים ארנון.<\/b> כְּשֵׁם שֶׁמְּסַפְּרִים בְּנִסֵּי יַם סוּף, כָּךְ יֵשׁ לְסַפֵּר בְּנִסֵּי נַחֲלֵי אַרְנוֹן, שֶׁאַף כָּאן נַעֲשׂוּ נִסִּים גְּדוֹלִים, וּמָה הֵם הַנִּסִּים?", "rashi_en": "על כן יאמר WHEREFORE IT IS SAID (more lit., about this it will be said) — About this encampment and the miracles that were wrought at it, it will be told בספר מלחמות ה׳ IN THE NARRATIVE (lit., THE BOOK) OF THE WARS OF THE LORD — whenever people narrate the miracles that were wrought for our fathers they will declare את והב.<br><br>את והב — is equivalent to את יהב; just as from the root יעד one may say וָעֵד, so from יהב, \"to give” one may say והב: the ו is a root-letter. It means to say: they will relate what (את) He gave (והב) to them (i.e. what boons He gave to them) and how He did many miracles at the Red Sea (בים סוף being the equivalent of בסופה in the text).<br><br>ואת הנחלים ארנון AND THE VALLEYS AT ARNON — Just as they relate the miracles at the Red Sea, so there should be related, too, the miracles at the valleys of Arnon, for here, also, great miracles were wrought (Midrash Tanchuma, Chukat 20). And what were those miracles? (the reply is given in the next passage)."}, {"ch": 21, "v": 15, "aliyah": 3, "heb": "וְאֶ֙שֶׁד֙ הַנְּחָלִ֔ים אֲשֶׁ֥ר נָטָ֖ה לְשֶׁ֣בֶת עָ֑ר וְנִשְׁעַ֖ן לִגְב֥וּל מוֹאָֽב׃", "onk": "וְשָׁפוּךְ נַחֲלַיָּא דְּמִדַּבְּרִין לָקֳבֵל לְחַיָּת וּמִסְתְּמִיךְ לִתְחוּם מוֹאָב:", "onk_en": "And the spillage in the valleys when it turned to dwell at Ar, and then leaned on the border of Moav.", "pj": "וְשִׁפְכוּת נַחֲלַיָא דְאַדְמֵיהוֹן הֲוָה נְגִיד עַד מוֹתְבוֹת לְחָיַית בְּרַם אִיהִי אִשְׁתֵּזִיבַת מִן דֵין גְמִירָא עַל דְלָא הֲוַת בְּעֵיטַתְהוֹן וְהָא הִיא לִתְחוּם מוֹאָב", "pj_en": "And the effusion of the streams of their blood flowed to the habitations of Lechaiath, which were, however, delivered from this destruction, because they had not been in their counsels; and, behold, it was unto the confine of Moab.", "tj": "כַּד הַוְויַן בְּנֵי יִשְרָאֵל עָבְרִין בְּנַחַל אַרְנוֹנָא אִיטַמָרוּ מוֹאָבַיָא בִּמְעָרַיָא דִי בְנַחֲלֵי אָמְרִין כַּד יֶהֱוְיַן בְּנֵי יִשְרָאֵל עָבְרִין אֲנַן נַפְקִין לִקֳדָמוּתְהוֹן וּמְקַטְלִין יַתְהוֹן וּרְמַז רִבּוֹן כָּל עַלְמָא יְיָ דִידַע מַה דְבִלְבָבַיָא וּגְלֵי קֳדָמוֹי מַה בְּכוּלְיָתָא רְמַז לְטוּרַיָא וְאַקְפוּ רֵישֵׁיהוֹן אִלֵין לְאִלֵין וְרָצִיצוּ רֵישֵׁי גִבָּרֵיהוֹן שְׁטִיפוּ נַחֲלַיָא מִן אִידָם לְטִילִין וַהֲווֹ יִשְרָאֵל ^מְהַלְכִין עַל רֵישֵׁי טוּרַיָא מִלְעֵיל וְלָא יָדְעוּ נִיסַיָא וּגְבוּרְתָּא דִי עֲבַד יְיָ עִמְהוֹן בְּנַחֲלֵי אַרְנוֹן וּלְחָיַית קַרְתָּא דְלָא הֲוַת שׁוּתָּפָא בַּעֲצַתְהוֹן אִשְׁתֵּזִיבַת לְהוֹן וְהָא הִיא סְמִיכָא לִתְחוֹמֵיהוֹן דְמוֹאֲבָאֵי:", "tj_en": "When the children of Israel were passing through the vale of Arnona, the Moabites were hidden in the caverns of the valley, saying: When the Beni Israel are coming through, we will go forth to prevent them, and will slay them. But the Lord of all the world, the Lord, who knew what was in their hearts, for before Him that which is within the reins is manifest, the Lord signed to the mountains, and their heads here and there were brought together, and the chiefs of their mighty ones were crushed, and the valleys were overflowed with the blood of the slain. But Israel walked above upon on the top of the hills, and knew not the miracle and mighty act which the Lord was doing for them in the valley of Arnon. But Lechaiath, the city which took no part in their counsel, was delivered from them; and, behold, it is by the confines of the Moabites.", "rashi": "<b>ואשד הנחלים.<\/b> תַּרְגּוּם שֶׁל שֶׁפֶךְ \"אֶשֶׁד\" — שֶׁפֶךְ הַנְּחָלִים שֶׁנִּשְׁפַּךְ שָׁם דַּם אֱמוֹרִיִּים, שֶׁהָיוּ נֶחְבָּאִים שָׁם, לְפִי שֶׁהָיוּ הֶהָרִים גְּבוֹהִים וְהַנַּחַל עָמֹק וְקָצָר וְהֶהָרִים סְמוּכִים זֶה לָזֶה — אָדָם עוֹמֵד עַל הָהָר מִזֶּה וּמְדַבֵּר עִם חֲבֵרוֹ בָּהָר הַזֶּה — וְהַדֶּרֶךְ עוֹבֵר בְּתוֹךְ הַנַּחַל, אָמְרוּ אֱמוֹרִיִּים, כְּשֶׁיִּכָּנְסוּ יִשְׂרָאֵל לָאָרֶץ לְתוֹךְ הַנַּחַל לַעֲבֹר, נֵצֵא מִן הַמְּעָרוֹת שֶׁבֶּהָרִים שֶׁלְּמַעְלָה מֵהֶם, וְנַהַרְגֵם בְּחִצִּים וְאַבְנֵי בָּלִיסְטְרָאוֹת, וְהָיוּ אוֹתָן הַנְּקָעִים בָּהָר שֶׁל צַד מוֹאָב, וּבָהָר שֶׁל צַד אֱמוֹרִיִּים הָיוּ כְּנֶגֶד אוֹתָן נְקָעִים כְּמִין קְרָנוֹת וְשָׁדַיִם בּוֹלְטִין לַחוּץ, כֵּיוָן שֶׁבָּאוּ יִשְׂרָאֵל לַעֲבֹר, נִזְדַּעְזַע הָהָר שֶׁל אֶרֶץ יִשְׂרָאֵל כְּשִׁפְחָה הַיּוֹצֵאת לְהַקְבִּיל פְּנֵי גְבִרְתָּהּ, וְנִתְקָרֵב לְצַד הָהָר שֶׁל מוֹאָב וְנִכְנְסוּ אוֹתָן הַשָּׁדַיִם לְתוֹךְ אוֹתָן נְקָעִים וַהֲרָגוּם, וְזֶהוּ אֲשֶׁר נָטָה לְשֶׁבֶת עָר — שֶׁהָהָר נָטָה מִמְּקוֹמוֹ וְנִתְקָרֵב לְצַד מוֹאָב וְנִדְבַּק בּוֹ, וְזֶהוּ וְנִשְׁעַן לִגְבוּל מוֹאָב (תנחומא; ברכות נ\"ד):", "rashi_en": "ואשר הנחלים THE DISCHARGE IN THE VALLEYS — The Targum translation of ,שפך “pouring forth”, is אשר. Consequently these words signify “the pouring forth in the valleys”, for at that place there was poured forth the blood of the Amorites who had concealed themselves there. As the mountains were high and the valley deep and narrow, and the mountains were so close to one another, that a man could stand upon the mountain on one side and speak to his fellow on the other mountain, and the road passed through the valley, the Amorites said: When the Israelites are about to enter the land by passing through the valley we will come out of the mountain caves above them and will kill them by arrows and stone missiles. Now those caves were in the mountains on the Moabite side, and on the mountain that was on the Amorite side there were, opposite those caves, projections like horns and breasts jutting out. When Israel were on the point of passing, the mountain that was located in the land of Israel (that on the Amorite side which afterwards came into the possession of the Israelites) was set in tremor as a handmaid that goes forth to receive her mistress, and moved nearer to the mountain of Moab, and these breast-like projections penetrated into the caves and killed them (the Amorites who were hidden in them). And this is the meaning of אשר נטה לשבת ער which inclineth towards the dwelling (location) of Ar (the capital Moab) — which means that the mountain inclined from its place and approached close to the mountain on the Moabite side and affixed itself to it: and this, too, is the meaning of ונשען לגבול מואב, and leaneth towards the boundary of Moab (Midrash Tanchuma, Chukat 20; cf. Berakhot 54b)."}, {"ch": 21, "v": 16, "aliyah": 3, "heb": "וּמִשָּׁ֖ם בְּאֵ֑רָה הִ֣וא הַבְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהֹוָה֙ לְמֹשֶׁ֔ה אֱסֹף֙ אֶת־הָעָ֔ם וְאֶתְּנָ֥ה לָהֶ֖ם מָֽיִם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּמִתַּמָּן אִתְיְהִיבַת לְהוֹן בֵּירָא הִיא בֵירָא דִּי אֲמַר יְיָ לְמשֶׁה כְּנוֹשׁ יָת עַמָּא וְאֶתֵּן לְהוֹן מַיָּא:", "onk_en": "From there, to the well; this is the well of which Adonoy said to Moshe, ‘Gather the people and I will give them water.’”", "pj": "וּמִתַּמָן אִתְיְהִיבַת לְהוֹן בֵּירָא הִיא בֵּירָא דְאָמַר יְיָ לְמשֶׁה כְּנוֹשׁ יַת עַמָא וְאֶתֵּן לְהוֹן מוֹי", "pj_en": "And from thence was given to them (the Israelites) the living well, the well concerning which the Lord said to Mosheh, Assemble the people and give them water.", "tj": "", "tj_en": "", "rashi": "<b>ומשם בארה.<\/b> מִשָּׁם בָּא הָאֶשֶׁד אֶל הַבְּאֵר; כֵּיצַד? אָמַר הַקָּבָּ\"ה מִי מוֹדִיעַ לְבָנַי הַנִּסִּים הַלָּלוּ? הַמָּשָׁל אוֹמֵר \"נָתַתָּ פַּת לְתִינוֹק הוֹדִיעַ לְאִמּוֹ\". לְאַחַר שֶׁעָבְרוּ חָזְרוּ הֶהָרִים לִמְקוֹמָם, וְהַבְּאֵר יָרְדָה לְתוֹךְ הַנַּחַל וְהֶעֶלְתָה מִשָּׁם דַּם הַהֲרוּגִים וּזְרוֹעוֹת וְאֵבָרִים וּמוֹלַכְתָּן סָבִיב הַמַּחֲנֶה, וְיִשְׂרָאֵל רָאוּ וְאָמְרוּ שִׁירָה:", "rashi_en": "ומשם בארה AND FROM THENCE TO THE WELL — from there the flow of blood ran to the well. How? The Holy One, blessed be He, said: Who will inform my children of those miracles? — The proverb says: If you have given bread to a child let its mother know (i.e., since the mother has, to an extent, benefitted by this, and the child cannot tell her, you should do so) (Shabbat 10b). After they (the Israelites) had passed by, the mountains returned to their original positions, and the well that followed the Israelites flowed down into the valley and brought up from there the blood and the arms and other limbs of those who had been thus killed, and carried them around the camp, so that Israel saw them, and they sang a song of triumph, as follows (Midrash Tanchuma, Chukat 20):"}, {"ch": 21, "v": 17, "aliyah": 3, "heb": "אָ֚ז יָשִׁ֣יר יִשְׂרָאֵ֔ל אֶת־הַשִּׁירָ֖ה הַזֹּ֑את עֲלִ֥י בְאֵ֖ר עֱנוּ־לָֽהּ׃", "onk": "בְּכֵן שַׁבַּח יִשְׂרָאֵל יָת <b>תּוּשְׁבַּחְתָּא<\/b> הָדָא סַקִּי בֵירָא שַׁבָּחוּ לָהּ:", "onk_en": "It was then that Yisroel sang this song [<b>of praise<\/b>]: “Arise, O well, sing to it!", "pj": "הָא בְּכֵן שַׁבַּח יִשְרָאֵל יַת שְׁבַח שִׁירָתָא הֲדָא בִּזְמַן דְאִתְכַּסְיַית וְהַדְרַת בֵּירָא דְאִתְיְהִיבַת לְהוֹן בִּזְכוּתָא דְמִרְיָם סוּקִי בֵירָא סוּקִי בֵירָא הֲווֹן מְזַמְרִין לָהּ וְהִיא סַלְקָא", "pj_en": "Then, behold, Israel sang the thanksgiving of this song, at the time that the well which had been hidden was restored to them through the merit of Miriam: Spring up, O well, spring up, O well ! sang they to it, and it sprang up:", "tj": "הָא בְּכֵן שַׁבָּחוּ יִשְרָאֵל יַת שְׁבַח שִׁירָתָא הָדָא סוּקִי בֵירָא הֲווֹ מְזַמְרִין לָהּ וְהִיא סַלְקָא:", "tj_en": "Behold then sang Israel this song of praise: Spring up, O well! they sang to it, and it sprang up:", "rashi": "<b>עלי באר.<\/b> מִתּוֹךְ הַנַּחַל וְהַעֲלִי מַה שֶּׁאַתְּ מַעֲלָה; וּמִנַּיִן שֶׁהַבְּאֵר הוֹדִיעָה לָהֶם? שֶׁנֶּאֱמַר \"וּמִשָּׁם בְּאֵרָה\", וְכִי מִשָּׁם הָיְתָה, וַהֲלֹא מִתְּחִלַּת אַרְבָּעִים שָׁנָה הָיְתָה עִמָּהֶם? אֶלָּא שֶׁיָּרְדָה לְפַרְסֵם אֶת הַנִּסִּים (תנחומא); וְכֵן אָז יָשִׁיר … הַשִּׁירָה הַזֹּאת נֶאֶמְרָה בְּסוֹף אַרְבָּעִים וְהַבְּאֵר נִתְּנָה לָהֶם מִתְּחִלַּת אַרְבָּעִים, מָה רָאָה לִכָּתֵב כָּאן? אֶלָּא הָעִנְיָן הַזֶּה נִדְרָשׁ לְמַעְלָה הֵימָנוּ:", "rashi_en": "עלי באר COME UP, WELL from the valley and bring up what you have to bring up! — Whence do we know that it was the well that announced to them these miracles as it is stated above? Because it is said: ומשם בארה “and from there to the well”. For you cannot say that it means: “from that place was (they got) the well”, because was it indeed from there that they got it? Had it not been with them from the beginning of the forty years’ wanderings? But it means that from there it flowed down to the Israelites to proclaim the miracles! Then again, also, the paragraph beginning with the words: אז ישיר … השירה הזאת were spoken at the end of the forty years whilst the well was given them at the beginning of the forty, and what reason then can there be to write it as late as here. But the subject of the song has to be explained in connection with what precedes it (that it was a summons to the well to bring up the bodies of the slain) (Midrash Tanchuma, Chukat 20)."}, {"ch": 21, "v": 18, "aliyah": 3, "heb": "בְּאֵ֞ר חֲפָר֣וּהָ שָׂרִ֗ים כָּר֙וּהָ֙ נְדִיבֵ֣י הָעָ֔ם בִּמְחֹקֵ֖ק בְּמִשְׁעֲנֹתָ֑ם וּמִמִּדְבָּ֖ר מַתָּנָֽה׃", "onk": "בֵּירָא דְּחָפְרוּהָ רַבְרְבַיָּא כְּרוּהָ רֵישֵׁי עַמָּא סַפְרַיָּא בְּחוּטְרֵיהוֹן וּמִמַּדְבְּרָא <b>אִתְיְהִיבַת לְהוֹן<\/b>:", "onk_en": "The well dug by princes, that the nobles of the nation excavated, through the lawgiver, with their staffs; from the wilderness a gift [<b>was given to them<\/b>].", "pj": "בֵּירָא דְחָפָרוּ יָתָהּ אַבְהַת עַלְמָא אַבְרָהָם יִצְחָק וְיַעֲקב רַבְרְבָנַיָא דְמִלְקַדְמִין חָפְרוּ יָתָהּ רֵישֵׁי עַמָא משֶׁה וְאַהֲרן סַפְרֵיהוֹן דְיִשְרָאֵל מַשְׁכוּ יָתָהּ בְּחוּטְרֵיהוֹן וּמִמַדְבְּרָא אִתְיְהִיבַת לְהוֹן לְמַתָּנָא", "pj_en": "the well which the fathers of the world, Abraham Izhak, and Jakob digged: the princes who were of old digged it, the chiefs of the people: Mosheh and Aharon, the scribes of Israel, found it with their rods; and from the desert it was given to them for a gift.", "tj": "בֵּירָא דְחָפָרוּ יָתָהּ רַבְרְבֵי עַלְמָא מִן שֵׁירוּיָא אַבְרָהָם יִצְחָק וְיַעֲקב שַׁכְלִילוּ יָתָהּ סוּכְלְתָנֵי עַלְמָא סַנְהֶדְרִין שׁוּבְעָתֵי חַכִּימַיָא דִמְפַרְשִׁין מָשְׁכוּ יָתָהּ בְּחוּטְרֵיהוֹן משֶׁה וְאַהֲרן סוּפְרֵיהוֹן דְיִשְרָאֵל וּמִמַדְבְּרָא אִתְיְהִיבַת לֵיהּ מַתָּנָא:", "tj_en": "the well which Abraham, Izhak, and Jakob, the princes of the world, at the beginning did see, the sages of the world, the Sanhedrin the seventy wise men who were appointed by name beheld it: Mosheh and Aharon, the scribes of Israel, found it with their rods, and from the desert it was given to them as a gift.", "rashi": "<b>באר חפרוה.<\/b> זֹאת הִיא הַבְּאֵר אֲשֶׁר חֲפָרוּהָ שָׂרִים — מֹשֶׁה וְאַהֲרֹן:<br><br><b>במשענתם.<\/b> בַּמַּטֶּה:<br><br><b>וממדבר.<\/b> נִתְּנָה לָהֶם:", "rashi_en": "באר חפרוה THE WELL, [PRINCES] DIGGED IT means: This is the well which the princes, Moses and Aaron, digged (cf. Targum Jonathan on).<br><br>במשענתם means WITH THE STAFF.<br><br>וממדבר מתנה AND FROM THE WILDERNESS was it given them [as a מתנה, a gift]."}, {"ch": 21, "v": 19, "aliyah": 3, "heb": "וּמִמַּתָּנָ֖ה נַחֲלִיאֵ֑ל וּמִנַּחֲלִיאֵ֖ל בָּמֽוֹת׃", "onk": "<b>וּמִדְּאִתְיְהִיבַת<\/b> לְהוֹן נָחֲתָא עִמְּהוֹן לְנַחֲלַיָּא וּמִנַחֲלַיָּא <b>סָלְקָא<\/b> עִמְּהוֹן לְרָמָתָא:", "onk_en": "The gift [<b>given to them<\/b>] (traveled) to the valley, and from the valley [<b>rose with them<\/b>] to the heights.", "pj": "וּמִן דְאִתְיְהִיבַת לְהוֹן לְמַתָּנָא חָזְרַת לְמֵיסוֹק עִמְהוֹן לְטַוְרָא רָמַיָא וּמִטַוְרָא רָמַיָא נַחֲתָא עִמְהוֹן לִגְלִימָתָא מְחַזְרָא לְכָל מַשִׁרְיָיתָא דְיִשְרָאֵל וּמַשְׁקְיָא יַתְהוֹן כָּל חַד וְחַד בִּתְרַע מַשְׁכְּנֵיהּ", "pj_en": "And from thence it was given to them in Mattana; turning, it went up with them to the high mountains, and from the high mountains it went down with them to the hills surrounding all the camp of Israel, and giving them drink, every one at the door of his tent.", "tj": "וּמִן דְאִתְיְהִיבַת לְהוֹן בֵּירָא מַתָּנָא חַזְרַת לְמֶהֱוֵי לְהוֹן לְנַחֲלִין שְׁטָפִין מִתְגַבְּרִין וְחַזְרַת לְמֶהֱוֵי סַלְקָא לְרֵישׁ טוּרַיָא וְנַחֲתָא עִמְהוֹן לְנַחֲלַיָא עַתִּיקָתָא אִתְגְנִיזַת מִנְהוֹן בֵּירָא דְאִית בִּתְחוּמֵיהוֹן דְמוֹאֲבָאֵי רֵישׁ רָמָתָא דְמִצְטַיְיפָא כָּל קֳבֵיל אַבְיַית יְשִׁימוֹן:", "tj_en": "And from thence the well was given to them at Mattana, turning it became strong overflowing streams, and again it ascended to the top of the mountains, and went down with them to the ancient valleys; but the well was hidden from them when on the borders of Moab, on the head of the height which overlooketh toward Abeth Jeshimon.", "rashi": "<b>וממתנה נחליאל.<\/b> כְּתַרְגּוּמוֹ:", "rashi_en": "וממתנה נחליאל — Understand this as the Targum does: And after it had been given them, it descended into the valley."}, {"ch": 21, "v": 20, "aliyah": 3, "heb": "וּמִבָּמ֗וֹת הַגַּיְא֙ אֲשֶׁר֙ בִּשְׂדֵ֣ה מוֹאָ֔ב רֹ֖אשׁ הַפִּסְגָּ֑ה וְנִשְׁקָ֖פָה עַל־פְּנֵ֥י הַיְשִׁימֹֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמֵרָמָתָא לְחֵילַיָּא דִּי בְּחַקְלֵי מוֹאָב רֵישׁ רָמָתָא וּמִסְתַּכְיָא עַל אַפֵּי בֵית יְשִׁימוֹן:", "onk_en": "And from the heights to the valley that is in the field of Moav, at the top of the peak that overlooks the wastelands.”", "pj": "וּמִטַוְרַיָא רָמַיָא נַחְתָא עִמְהוֹן לִגְלִימָתָא עֲמִיקְתָא וְאִתְגְנִיזַת עִמְהוֹן בִּתְחוּמֵיהוֹן דְמוֹאֲבָאֵי רֵישׁ רָמָתָא דִמְדִיקָא כָּל קֳבֵיל בֵּית יְשִׁימוֹן מְטוֹל פִּתְגָמֵי אוֹרַיְיתָא", "pj_en": "And from the high mountains it descended with them to the lower hills, but was hidden from them on the borders of Moab, at the summit of the hill looking toward Bethjeshimon, because there they neglected the words of the Law.", "tj": "", "tj_en": "", "rashi": "<b>ומבמות הגיא אשר בשדה מואב.<\/b> כִּי שָׁם מֵת מֹשֶׁה וְשָׁם בָּטְלָה הַבְּאֵר; דָּ\"אַ, כָּרוּהָ נְדִיבֵי הָעָם — כָּל נָשִׂיא וְנָשִׂיא כְּשֶׁהָיוּ חוֹנִים נוֹטֵל מַקְלוֹ וּמוֹשֵׁךְ אֵצֶל דִּגְלוֹ וּמַחֲנֵהוּ, וּמֵי הַבְּאֵר נִמְשָׁכִין דֶּרֶךְ אוֹתוֹ סִימָן וּבָאִין לִפְנֵי חֲנִיַּת כָּל שֵׁבֶט וָשֵׁבֶט (תנחומא):<br><br><b>במחקק.<\/b> עַל פִּי מֹשֶׁה שֶׁנִּקְרָא מְחוֹקֵק, שֶׁנֶּאֱמַר \"כִּי שָׁם חֶלְקַת מְחֹקֵק סָפוּן\" (דברים ל\"ג); וְלָמָּה לֹא נִזְכַּר מֹשֶׁה בְּשִׁירָה זוֹ? לְפִי שֶׁלָּקָה עַל יְדֵי הַבְּאֵר, וְכֵיוָן שֶׁלֹּא נִזְכַּר שְׁמוֹ שֶׁל מֹשֶׁה לֹא נִזְכַּר שְׁמוֹ שֶׁל הַקָּבָּ\"ה, מָשָׁל לְמֶלֶךְ שֶׁהָיוּ מְזַמְּנִין אוֹתוֹ לִסְעוּדָה, אָמַר אִם אוֹהֲבִי שָׁם אֲנִי שָׁם, וְאִם לָאו אֵינִי הוֹלֵךְ (תנחומא):<br><br><b>ראש הפסגה.<\/b> כְּתַרְגּוּמוֹ \"רֵישׁ רָמָתָא\":<br><br><b>פסגה.<\/b> לְשׁוֹן גֹּבַהּ, וְכֵן \"פַּסְּגוּ אַרְמְנוֹתֶיהָ\" (תהילים מ\"ח) — הַגְבִּיהוּ אַרְמְנוֹתֶיהָ:<br><br><b>ונשקפה.<\/b> אוֹתָהּ הַפִּסְגָּה עַל פְּנֵי הַמָּקוֹם שֶׁשְּׁמוֹ יְשִׁימוֹן, וְהוּא לְשׁוֹן מִדְבָּר שֶׁהוּא שָׁמֵם; דָּבָר אַחֵר וְנִשְׁקָפָה הַבְּאֵר עַל פְּנֵי הַיְשִׁימוֹן, שֶׁנִּגְנְזָה בְּיַמָּהּ שֶׁל טְבֶרְיָא, וְהָעוֹמֵד עַל הַיְשִׁימוֹן מַבִּיט וְרוֹאֶה כְּמִין כְּבָרָה בַּיָּם, וְהִיא הַבְּאֵר, כָּךְ דָּרַשׁ רַבִּי תַנְחוּמָא:", "rashi_en": "ומבמות הגיא אשר בשדי מואב AND FROM THE HEIGHTS (it descended finally) INTO THE VALLEY THAT IS IN THE FIELD OF MOAB, for there Moses died, and there the well finally ceased to flow. Another explanation is: כרוה נדיבי עם THE NOBLES OF THE PEOPLE HOLLOWED IT — each prince of the tribes when they encamped took his staff and drew a line on the ground from the well to his banner and encampment, and the waters of the well ran by way of that mark and came before the camping place of each tribe (Midrash Tanchuma, Chukat 21).<br><br>במחקק THROUGH THE LAWGIVER — by command of Moses who is called the מחוקק, the Lawgiver, as it is said, (Deuteronomy 33:21) “for there is the portion of the lawgiver (Moses’ grave) concealed”. But why is Moses not expressly mentioned by name in this song? Because he was punished through the well! And since Moses’ name is not mentioned, the name of the Holy One, blessed be He, is also not mentioned. A parable! It may be compared to the case of a king whom his subjects invited to a feast. He said: If my friend will be there, I, too, will be there, but if not, I will not go (Midrash Tanchuma, Chukat 21).<br><br>ראש הפסגה — Understand this as the Targum has it: to the top of the height. <br><br>פסגה denotes “high”, just as (Psalms 48:14) פסגו ארמנותיה, which means “make high its palaces”.<br><br>ונשקפה AND IT LOOKS — this height looks towards the place whose name is ישימון, which word describes the wilderness because that is waste (שמם with which the word ישימון may be linguistically associated). Another explanation is: ונשקפה AND IT LOOKS — the well looks על פני ישימון towards the front of ישימון, the wilderness, for it was hid (emptied) itself in the sea of Tiberias, and anyone who stood by the wilderness may look and see a kind of sieve in the sea, and that was the well!. Thus did R. Tanchuma (Midrash Tanchuma, Chukat 21) expound this passage."}, {"ch": 21, "v": 21, "aliyah": 4, "heb": "וַיִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל־סִיחֹ֥ן מֶֽלֶךְ־הָאֱמֹרִ֖י לֵאמֹֽר׃", "onk": "וּשְׁלַח יִשְׂרָאֵל אִזְגַּדִּין לְוָת סִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה לְמֵימָר:", "onk_en": "Yisroel sent emissaries to Sichon, King of the Emorite, saying.", "pj": "וְשָׁדַר יִשְרָאֵל עִזְגַדִין לְוַת סִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה לְמֵימָר", "pj_en": "Then sent Israel messengers to Sihon, king of the Amorites, saying:", "tj": "", "tj_en": "", "rashi": "<b>וישלח ישראל מלאכים.<\/b> וּבְמָקוֹם אַחֵר תּוֹלֶה הַשְּׁלִיחוּת בְּמֹשֶׁה, שֶׁנֶּאֱמַר \"וָאֶשְׁלַח מַלְאָכִים מִמִּדְבַּר קְדֵמוֹת\" (דברים ב'), וְכֵן \"וַיִּשְׁלַח מֹשֶׁה מַלְאָכִים מִקָּדֵשׁ אֶל מֶלֶךְ אֱדוֹם\" (במדבר כ'), וּבְיִפְתָּח הוּא אוֹמֵר (שופטים י\"א) \"וַיִּשְׁלַח יִשְׂרָאֵל מַלְאָכִים אֶל מֶלֶךְ אֱדוֹם\" וְגוֹ', הַכְּתוּבִים הַלָּלוּ צְרִיכִין זֶה לָזֶה, זֶה נוֹעֵל וְזֶה פוֹתֵחַ, שֶׁמֹּשֶׁה הוּא יִשְׂרָאֵל וְיִשְׂרָאֵל הֵם מֹשֶׁה, לוֹמַר לְךָ שֶׁנְּשִׂיא הַדּוֹר הוּא כְּכָל הַדּוֹר, כִּי הַנָּשִׂיא הוּא הַכֹּל (תנחומא):", "rashi_en": "וישלח ישראל מלאכים AND ISRAEL SENT MESSENGERS — But in another passage it attributes this embassy to Moses, as it is said, (Deuteronomy 2:26), “And ‘I’ sent messengers from the wilderness of Kedemoth [to Sihon king of Heshbon]”! And so, too, it states, (Numbers 20:14), “And Moses sent messengers to the king of Edom”; whilst in the story of Jephtha, it says, (Judges 11:17) “And Israel sent messengers to the king of Edom, etc.”. Each of these pairs of verses is necessary one to the other (i.e., they supplement each other): one keeps back information and the other discloses it, (more lit., one locks up and the other opens) — you may gather from them that Moses is Israel and Israel is Moses, thus telling you that the prince of any generation is the equal of the whole generation, for the prince is the whole (Midrash Tanchuma, Chukat 23)."}, {"ch": 21, "v": 22, "aliyah": 4, "heb": "אֶעְבְּרָ֣ה בְאַרְצֶ֗ךָ לֹ֤א נִטֶּה֙ בְּשָׂדֶ֣ה וּבְכֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּדֶ֤רֶךְ הַמֶּ֙לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר־נַעֲבֹ֖ר גְּבֻלֶֽךָ׃", "onk": "אֲעִבַר בְּאַרְעָךְ לָא נִסְטֵי בַּחֲקַל וּבִכְרַם לָא נִשְׁתֵּי מֵי גוֹב בְּאֹרַח מַלְכָּא נֵזֵל עַד דִּי נְעִבַר תְּחוּמָךְ:", "onk_en": "“Let me pass through your land, we will not turn aside into the fields and vineyards, we will not drink well water; we will go by the King’s road until we have passed through your territory.”", "pj": "אֲעִיבַּר בְּאַרְעָךְ לָא נְאַנוֹס אֲרִיסַן וְלָא נְשַׁרְגָן בְּתוּלָן וְלָא נִבְעוֹל נְשֵׁי גוּבְרִין אוֹרַח מַלְכָּא דְבִשְׁמַיָא נֵזֵיל עַד דְנֵיעִיבַר תְּחוּמָךְ", "pj_en": "I would pass through thy country. We will not carry off the betrothed, nor seduce virgins, nor have to do with the wives of men; by the highway of the King who is in the heavens we will go, until we have passed through thy border.", "tj": "", "tj_en": "", "rashi": "<b>אעברה בארצך.<\/b> אַעַ\"פִּ שֶׁלֹּא נִצְטַוּוּ לִפְתֹּחַ לָהֶם בְּשָׁלוֹם בִּקְּשׁוּ מֵהֶם שָׁלוֹם (שם):", "rashi_en": "אעברה בארצך LET ME PASS THROUGH THY LAND — Although they had not been bidden to open the negotiations with them by an offer of peace yet they first sought peace of them (cf. Midrash Tanchuma, Chukat 22)."}, {"ch": 21, "v": 23, "aliyah": 4, "heb": "וְלֹא־נָתַ֨ן סִיחֹ֣ן אֶת־יִשְׂרָאֵל֮ עֲבֹ֣ר בִּגְבֻלוֹ֒ וַיֶּאֱסֹ֨ף סִיחֹ֜ן אֶת־כׇּל־עַמּ֗וֹ וַיֵּצֵ֞א לִקְרַ֤את יִשְׂרָאֵל֙ הַמִּדְבָּ֔רָה וַיָּבֹ֖א יָ֑הְצָה וַיִּלָּ֖חֶם בְּיִשְׂרָאֵֽל׃", "onk": "וְלָא שְׁבַק סִיחוֹן יָת יִשְׂרָאֵל לְמֶעְבַּר בִּתְחוּמֵיהּ וּכְנַשׁ סִיחוֹן יָת כָּל עַמֵּיהּ וּנְפַק לָקֳדָמוּת יִשְׂרָאֵל לְמַדְבְּרָא וַאֲתָא לְיָהַץ <b>וִאַגִּיחַ קְרָבָא<\/b> בְּיִשְׂרָאֵל:", "onk_en": "But Sichon did not allow Yisroel to pass through his territory; Sichon gathered all his people and went out against Yisroel to the wilderness; he came to Yohatz and attacked [<b>waged war with<\/b>] Yisroel.", "pj": "וְלָא שְׁבַק סִיחוֹן יַת יִשְרָאֵל לְמֶעֱבַר בִּתְחוּמֵיהּ וּכְנַשׁ סִיחוֹן יַת כָּל עַמֵיהּ וּנְפַק לִקְדָמוּת יִשְרָאֵל לְמַדְבְּרָא וְאָתָא לְיָהַץ וְאַגַח קְרָבָא בְּיִשְרָאֵל", "pj_en": "But Sihon would not permit Israel to pass through his limit, but constrained all his people, and came out to Jahaz, and made war against Israel.", "tj": "", "tj_en": "", "rashi": "<b>ולא נתן סיחן וגו'.<\/b> לְפִי שֶׁכָּל מַלְכֵי כְנַעַן הָיוּ מַעֲלִין לוֹ מַס, שֶׁהָיָה שׁוֹמְרָם שֶׁלֹּא יַעַבְרוּ עֲלֵיהֶם גְּיָסוֹת, כֵּיוָן שֶׁאָמְרוּ לוֹ יִשְׂרָאֵל אֶעְבְּרָה בְאַרְצֶךָ, אָ\"לָ, כָּל עַצְמִי אֵינִי יוֹשֵׁב כָּאן אֶלָּא לְשָׁמְרָם מִפְּנֵיכֶם, וְאַתֶּם אוֹמְרִים כָּךְ (תנחומא):<br><br><b>ויצא לקראת ישראל.<\/b> אִלּוּ הָיְתָה חֶשְׁבּוֹן מְלֵאָה יַתּוּשִׁין אֵין כָּל בְּרִיָּה יְכוֹלָה לְכָבְשָׁהּ, וְאִם הָיָה סִיחוֹן בִּכְפָר חַלָּשׁ אֵין כָּל אָדָם יָכוֹל לְכָבְשׁוֹ, וְכָל שֶׁכֵּן שֶׁהָיָה בְּחֶשְׁבּוֹן; אָמַר הַקָּבָּ\"ה מָה אֲנִי מַטְרִיחַ עַל בָּנַי כָּל זֹאת לָצוּר עַל כָּל עִיר וָעִיר? נָתַן בְּלֵב כָּל אַנְשֵׁי הַמִּלְחָמָה לָצֵאת מִן הָעֲיָרוֹת, וְנִתְקַבְּצוּ כֻלָּם לְמָקוֹם אֶחָד וְשָׁם נָפְלוּ, וּמִשָּׁם הָלְכוּ יִשְׂרָאֵל אֶל הֶעָרִים וְאֵין עוֹמֵד לְנֶגְדָּם, כִּי אֵין שָׁם אֶלָּא
