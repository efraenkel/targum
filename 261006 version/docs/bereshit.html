<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פרשת בראשית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>פרשת בראשית</h1>
    <div class="icon-btns">
      <button class="icon-btn" id="exportBtn" aria-label="ייצוא קטעים מסומנים">📤</button>
      <button class="icon-btn" id="offlineBtn" aria-label="שמירה לקריאה ללא אינטרנט">✈️</button>
      <button class="icon-btn" id="fontBtn" aria-label="הגדרות גופן">Aa</button>
      <button class="icon-btn" id="themeBtn" aria-label="החלף ערכת צבעים">🌓</button>

    <div class="export-row">
      <button class="export-btn" id="copyBtn">העתק ללוח</button>

    <div class="export-msg" id="exportMsg"></div>
  </div>
  <div class="topnav">
    <a class="idx" href="index.html">⌂ כל הפרשות</a>

  <div class="chips">
    <button class="chip chip-onk" data-key="onk" data-on="true">אונקלוס</button>
    <button class="chip chip-pj" data-key="pj" data-on="true">יונתן (פסבדו)</button>
    <button class="chip chip-yer" data-key="yer" data-on="true">ירושלמי</button>
    <button class="chip chip-rashi" data-key="rashi" data-on="false">רש״י</button>

  <div class="panel" id="panel">
    <div class="panel-row">

      <select id="fontSelect">
        <option value="'David Libre', serif">David Libre (ברירת מחדל, קריא)</option>
        <option value="'Frank Ruhl Libre', serif">Frank Ruhl Libre (אחיד עם הפסוק)</option>
        <option value="'Noto Sans Hebrew', sans-serif">Noto Sans (ללא תגים, הכי ברור)</option>
        <option value="'Noto Rashi Hebrew', serif">Noto Rashi (כתב רש״י מסורתי)</option>
      </select>

    <div class="panel-row">

        <button class="size-btn" id="sizeUp">א+</button>

  <div class="pos-indicator" id="posIndicator"></div>
  <div class="chapter-nav" id="chapterNav"></div>

</header>
<div id="spacer"></div>
<main id="main"></main>
<footer>נוצר אוטומטית · Bereshit · 2026-10-10</footer>

<script>

const DATA = [{"ch": 1, "v": 1, "aliyah": 1, "heb": "<big>בְּ<\/big>רֵאשִׁ֖ית בָּרָ֣א אֱלֹהִ֑ים אֵ֥ת הַשָּׁמַ֖יִם וְאֵ֥ת הָאָֽרֶץ׃", "onk": "בְּקַדְמִין בְּרָא יְיָ יָת שְׁמַיָּא וְיָת אַרְעָא:", "onk_en": "In the beginning Elohim created the heavens and the earth.", "pj": "מִן אַוְולָא בְּרָא יְיָ יַת שְׁמַיָא וְיַת אַרְעָא", "pj_en": "At the beginning (min avella) the Lord created the heavens and the earth.", "tj": "בראשׁית בְּחוּכְמָא בְּרָא יְיָ:", "tj_en": "In wisdom (be-hukema) the Lord created.", "rashi": "<b>בראשית.<\/b> אָמַר רַבִּי יִצְחָק לֹֹֹֹֹא הָיָה צָרִיךְ לְהַתְחִיל אֶת הַתּוֹרָה אֶלָּא מֵהַחֹדֶשׁ הַזֶּה לָכֶם, שֶׁהִיא מִצְוָה רִאשׁוֹנָה שֶׁנִּצְטַוּוּ בָּהּ יִשׂרָאֵל, וּמַה טַּעַם פָּתַח בִּבְרֵאשִׁית? מִשׁוּם כֹּחַ מַעֲשָׂיו הִגִּיד לְעַמּוֹ לָתֵת לָהֶם נַחֲלַת גּוֹיִם (תהילים קי\"א), שֶׁאִם יֹאמְרוּ אֻמּוֹת הָעוֹלָם לְיִשְׁרָאֵל לִסְטִים אַתֶּם, שֶׁכְּבַשְׁתֶּם אַרְצוֹת שִׁבְעָה גוֹיִם, הֵם אוֹמְרִים לָהֶם כָּל הָאָרֶץ שֶׁל הַקָּבָּ\"ה הִיא, הוּא בְרָאָהּ וּנְתָנָהּ לַאֲשֶׁר יָשַׁר בְּעֵינָיו, בִּרְצוֹנוֹ נְתָנָהּ לָהֶם, וּבִרְצוֹנוֹ נְטָלָהּ מֵהֶם וּנְתָנָהּ לָנוּ:<br><br><b>בראשית ברא<\/b> אֵין הַמִּקְרָא הַזֶּה אוֹמֵר אֶלָּא דָּרְשֵׁנִי, כְּמוֹ שֶׁדְּרָשׁוּהוּ רַבּוֹתֵינוּ בִּשְׁבִיל הַתּוֹרָה שֶׁנִקְרֵאת רֵאשִׁית דַּרְכּוֹ (משלי ח'), וּבִשְׁבִיל יִשְׂרָאֵל שֶׁנִקְרְאוּ רֵאשִׁית תְּבוּאָתוֹ (ירמיה ב'); וְאִם בָּאתָ לְפָרְשׁוֹ כִּפְשׁוּטוֹ, כָּךְ פָּרְשֵׁהוּ בְּרֵאשִׁית בְּרִיאַת שָׁמַיִם וָאָרֶץ, וְהָאָרֶץ הָיְתָה תֹהוּ וָבֹהוּ וְחֹשֶׁךְ וַיֹּאמֶר אֱלֹהִים יְהִי אוֹר וְלֹא בָא הַמִּקְרָא לְהוֹרוֹת סֵדֶר הַבְּרִיאָה לוֹמַר שֶׁאֵלּוּ קָדְמוּ, שֶׁאִם בָּא לְהוֹרוֹת כָּךְ, הָיָה לוֹ לִכְתֹּב בָּרִאשׁוֹנָה בָּרָא אֶת הַשָּׁמַיִם וְגוֹ' שֶׁאֵין לְךָ רֵאשִׁית בַּמִּקְרָא שֶׁאֵינוֹ דָבוּק לַתֵּבָה שֶׁלְּאַחֲרָיו, כְּמוֹ בְּרֵאשִׁית מַמְלֶכֶת יְהוֹיָקִים (שׁם כ\"ז), רֵאשִׁית מַמְלַכְתּוֹ (בראשית י'), רֵאשִׁית דְּגָנְךָ (דברים י\"ח, ד'), – אַף כָּאן אַתָּה אוֹמֵר בְּרֵאשִׁית בָּרָא אֱלֹהִים וְגוֹ', כְּמוֹ בְּרֵאשִׁית בְּרֹא; וְדוֹמֶה לוֹ תְּחִלַּת דִּבֶּ  Israel may reply to them, “All the earth belongs to the Holy One, blessed be He; He created it and gave it to whom He pleased. When He willed He gave it to them, and when He willed He took it from them and gave it to us” (Yalkut Shimoni on Torah 187).<br><br>בראשית ברא IN THE BEGINNING GOD CREATED — This verse calls aloud for explanation in the manner that our Rabbis explained it: God created the world for the sake of the Torah which is called (Proverbs 8:22) “The beginning (ראשית) of His (God’s) way”, and for the sake of Israel who are called (Jeremiah 2:3) “The beginning (ראשית) of His (God’s) increase’’. If, however, you wish to explain it in its plain sense, explain it thus: At the beginning of the Creation of heaven and earth when the earth was without form and void and there was darkness, God said, “Let there be light”.  The text does not intend to point out the order of the acts of Creation — to state that these (heaven and earth) were created first; for if it intended to point this out, it should have written 'בראשונה ברא את השמים וגו “At first God created etc.” And for this reason: Because, wherever the word ראשית occurs in Scripture, it is in the construct state. E. g., (Jeremiah 26:1) “In the beginning of (בראשית) the reign of Jehoiakim”; (Genesis 10:10) “The beginning of (ראשית) his kingdom”; (Deuteronomy 18:4) “The first fruit of (ראשית) thy corn.” Similarly here you must translate בראשית ברא אלהים as though it read בראשית ברוא, at the beginning of God’s creating. A similar grammatical construction (of a noun in construct followed by a verb) is: (Hosea 1:2) תחלת דבר ה' בהושע, which is as much as to say, “At the beginning of God’s speaking through Hosea, the Lord said to Hosea.” Should you, however, insist that it does actually intend to point out that these (heaven and earth) were created first, and that the meaning is, “At the beginning of everything He created these, admitting therefore that the word בראשית is in the construct state and explaining the omission of a word signifying “everything” by saying that you have texts which are elliptical, omitting a word, as for example (Job 3:10) “Because it shut not up the doors of my mother’s womb” where it does not explicitly explain who it was that closed the womb; and (Isaiah 8:4) “He shall take away the spoil of Samaria” without explaining who shall take it away; and (Amos 6:12) “Doth he plough with oxen,\" and it does not explicitly state, “Doth a man plough with oxen”; (Isaiah 46:10) “Declaring from the beginning the end,” and it does not explicitly state, “Declaring from the beginning of a thing the end of a thing’ — if it is so (that you assert that this verse intends to point out that heaven and earth were created first), you should be astonished at yourself, because as a matter of fact the waters were created before heaven and earth, for, lo, it is written, (v. 2) “The Spirit of God was hovering on the face of the waters,” and Scripture had not yet disclosed when the creation of the waters took place — consequently you must learn from this that the creation of the waters preceded that of the earth. And a further proof that the heavens and earth were not the first thing created is that the heavens were created from fire (אש) and water (מים), from which it follows that fire and water were in existence before the heavens. Therefore you must admit that the text teaches nothing about the earlier or later sequence of the acts of Creation.<br><br>ברא אלהים GOD [AS JUDGE] CREATED — It does not state 'ברא ה “The Lord (the Merciful One) created, because at first God intended to create it (the world) to be placed under the attribute (rule) of strict justice, but He realised that the world could not thus endure and therefore gave precedence to Divine Mercy allying it with Divine Justice. It is to this that what is written in (Genesis 2:4) alludes — “In the day that the Lord God made earth and heaven”."}, {"ch": 1, "v": 2, "aliyah": 1, "heb": "וְהָאָ֗רֶץ הָיְתָ֥ה תֹ֙הוּ֙ וָבֹ֔הוּ וְחֹ֖שֶׁךְ עַל־פְּנֵ֣י תְה֑וֹם וְר֣וּחַ אֱלֹהִ֔ים מְרַחֶ֖פֶת עַל־פְּנֵ֥י הַמָּֽיִם׃", "onk": "וְאַרְעָא הֲוַת צָדְיָא וְרֵיקַנְיָא וַחֲשׁוֹכָא <b>פָּרַשׂ<\/b> עַל אַפֵּי תְהוֹמָא וְרוּחָא <b>מִן קֳדָם<\/b> יְיָ <b>מְנַשְּׁבָא<\/b> עַל אַפֵּי מַיָּא:", "onk_en": "The earth was unformed and desolate, and (there was) darkness [<b>was spread<\/b>] over the surface of the abyss. The breath of [<b>from before<\/b>] Elohim hovered [<b>blew<\/b>] above the surface of the water.", "pj": "וְאַרְעָא הֲוַת תַּהֲיָיא וּבַהֲיָיא צַדְיָא מִבְּנֵי נַשׁ וְרֵיקַנְיָא מִן כָּל בְּעִיר וַחֲשׁוֹכָא עַל אַפֵּי תְהוֹמָא וְרוּחַ רַחֲמִין מִן קֳדָם יְיָ מְנַתְבָא עַל אַנְפֵּי מַיָא", "pj_en": "And the earth was vacancy and desolation, solitary of the sons of men, and void of every animal; and darkness was upon the face of the abyss, and the Spirit of mercies from before the Lord breathed upon the face of the waters.", "tj": "וְאַרְעָא הֲוַת תַּהֲיָא וּבַהֲיָא וְצָדוּ מִן בְּנֵי אֱנָשָׁא וְרֵיקַנְיָא מִכָּל בְּעִיר וְרוּחָא דְרַחֲמִין מִן קֳדָם יְיָ הֲוַת מְנַשְׁבָא עַל אַפֵּי מַיָא:", "tj_en": "And the earth was vacancy and desolation, and solitary of the sons of men, and void of every animal; and the Spirit of mercies from before the Lord breathed upon the face of the waters.", "rashi": "<b>תהו ובהו.<\/b> תֹּהוּ לְשׁוֹן תֵּמַהּ וְשִׁמָּמוֹן, שֶׁאָדָם תּוֹהֵא וּמִשְׁתּוֹמֵם עַל בֹּהוּ שֶׁבָּהּ:<br><br><b>תהו.<\/b> אשטורדי\"שון בְּלַעַ\"ז:<br><br><b>בהו.<\/b> לְשׁוֹן רֵקוּת וְצָדוּ:<br><br><b>על פני תהום.<\/b> עַל פְּנֵי הַמַּיִם שֶׁעַל הָאָרֶץ:<br><br><b>ורוח אלהים מרחפת.<\/b> כִּסֵא הַכָּבוֹד עוֹמֵד בָּאֲוִיר וּמְרַחֵף עַל פְּנֵי הַמַּיִם בְּרוּחַ פִּיו שֶׁל הַקָּבָּ\"ה וּבְמַאֲמָרוֹ, כְּיוֹנָה הַמְרַחֶפֶת עַל הַקֵּן, אקוב\"טיר בְּלַעַ\"ז:", "rashi_en": "תהו ובהו DESOLATE AND VOID — The word תהו signifies astonishment and amazement, for a person would have been astonished and amazed at its emptiness.<br><br>תהו is estordison in old French.<br><br>בהו VOID — The word signifies emptiness and empty space.<br><br>על פני תהום ON THE FACE OF THE DEEP — i. e. the waters which were upon the earth.<br><br>ורוח אלהים מרחפת AND THE SPIRIT OF GOD WAS HOVERING — The throne of Divine Glory was standing in space, hovering over the face of the waters by the breath of the mouth of the Holy One, blessed be He, and by His command, even as a dove hovers over its nest. In old French acoveter."}, {"ch": 1, "v": 3, "aliyah": 1, "heb": "וַיֹּ֥אמֶר אֱלֹהִ֖ים יְהִ֣י א֑וֹר וַֽיְהִי־אֽוֹר׃", "onk": "וַאֲמַר יְיָ יְהֵי נְהוֹרָא וַהֲוָה נְהוֹרָא:", "onk_en": "Elohim said, Let there be light. and there was light.", "pj": "וַאֲמַר יְיָ יְהִי נְהוֹרָא לְאַנְהָרָא עִלָאָה וּמִן יַד הֲוָה נְהוֹרָא", "pj_en": "And the Lord said, Let there be light and to enlighten above; and at once there was light.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 4, "aliyah": 1, "heb": "וַיַּ֧רְא אֱלֹהִ֛ים אֶת־הָא֖וֹר כִּי־ט֑וֹב וַיַּבְדֵּ֣ל אֱלֹהִ֔ים בֵּ֥ין הָא֖וֹר וּבֵ֥ין הַחֹֽשֶׁךְ׃", "onk": "וַחֲזָא יְיָ יָת נְהוֹרָא אֲרֵי טָב וְאַפְרֵשׁ יְיָ בֵּין נְהוֹרָא וּבֵין חֲשׁוֹכָא:", "onk_en": "Elohim saw that the light was good, and Elohim divided the light from the darkness.", "pj": "וַחֲזָא יְיָ יַת נְהוֹרָא אֲרוּם טַב וְאַפְרֵישׁ יְיָ בֵּין נְהוֹרָא וּבֵין חֲשׁוֹכָא", "pj_en": "And the Lord beheld the light, that it was good; and the Lord divided between the light and the darkness.", "tj": "", "tj_en": "", "rashi": "<b>וירא אלהים את האור כי טוב ויבדל.<\/b> אַף בָּזֶה אָנוּ צְרִיכִין לְדִבְרֵי אַגַּדָה, רָאָהוּ שֶׁאֵינוֹ כְדַאי לְהִשְׁתַּמֵשׁ בּוֹ רְשָׁעִים, וְהִבְדִּילוֹ לַצַּדִּיקִים לֶעָתִיד לָבֹא. וּלְפִי פְּשׁוּטוֹ כָּךְ פָּרְשֵׁהוּ, רָאָהוּ כִּי טוֹב, וְאֵין נָאֶה לוֹ וְלַחֹשֶׁךְ שֶׁיִּהְיוּ מִשְׁתַּמְּשִׁים בְּעִרְבּוּבְיָא, וְקָבַע לָזֶה תְחוּמוֹ בַּיּוֹם, וְלָזֶה תְחוּמוֹ בַּלַּיְלָה:", "rashi_en": "וירא אלהים את האור כי טוב ויבדל AND GOD SAW THE LIGHT THAT IT WAS GOOD, AND GOD CAUSED A DIVISION — Here, also, we must depend upon the statement of the Agada: He saw that the wicked were unworthy of using it (the light); He, therefore, set it apart (ויבדל), reserving it for the righteous in the world to come (Chagigah 12a). But according to the plain sense explain it thus: He saw that it was good, and that it was not seemly that light and darkness should function together in a confused manner. He therefore limited this one’s sphere of activity to the daytime, and this one’s sphere of activity to the nighttime (see Genesis Rabbah 3:6)."}, {"ch": 1, "v": 5, "aliyah": 1, "heb": "וַיִּקְרָ֨א אֱלֹהִ֤ים&thinsp;<small>׀<\/small>&thinsp;לָאוֹר֙ י֔וֹם וְלַחֹ֖שֶׁךְ קָ֣רָא לָ֑יְלָה וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם אֶחָֽד׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּקְרָא יְיָ לִנְהוֹרָא יְמָמָא וְלַחֲשׁוֹכָא קְרָא לֵילְיָא וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹמָא חָד:", "onk_en": "Elohim called the light day, and the darkness He called night. It became evening and it became morning, one day.", "pj": "וּקְרָא יְיָ לִנְהוֹרָא יְמָמָא וְעַבְדֵהּ לְמִפְלַח בֵּיהּ דַיְירֵי עַלְמָא וְלַחֲשׁוֹכָא קָרָא לֵילְיָא וְעַבְדֵיהּ לְמֵינַח בֵּיהּ בִּרְיָיתָא וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹמָא חָד", "pj_en": "And the Lord called the light Day; and He made it that the inhabiters of the world might labour by it: and the darkness called He night; and He made it that in it the creatures might have rest. And it was evening, and it was morning, the First Day.", "tj": "וַהֲוָה רְמַשׁ וַהֲוָה צְפַר סְדַר עוֹבַד בְּרֵאשִׁית יוֹם קֳדָמָי:", "tj_en": "And it was evening, and it was morning, in the order of the work of the creation, (or of the beginning) the First Day.", "rashi": "<b>יום אחד.<\/b> לְפִי סֵדֶר לְשׁוֹן הַפָּרָשָׁה הָיָה לוֹ לִכְתֹּב יוֹם רִאשׁוֹן, כְּמוֹ שֶׁכָּתוּב בִּשְׁאָר הַיָּמִים שֵׁנִי, שְׁלִישִׁי, רְבִיעִי, לָמָּה כָתַב אֶחָד? לְפִי שֶׁהָיָה הַקָּבָּ\"ה יָחִיד בְּעוֹלָמוֹ, שֶׁלֹא נִבְרְאוּ הַמַּלְאָכִים עַד יוֹם שֵׁנִי, כָּךְ מְפֹרָשׁ בּבְ\"רַ:", "rashi_en": "יום אחד THE FIRST DAY (literally, one day) — According to the regular mode of expression used in this chapter it should be written here “first day”, just as it is written with regard to the other days “the second”, “the third”, “the fourth”. Why, then, does it write אחד “one”? Because the Holy One, blessed be He, was then the Only One (Sole Being) in His Universe, since the angels were not created until the second day. Thus it is explained in Genesis Rabbah (Genesis Rabbah 3:8)."}, {"ch": 1, "v": 6, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֔ים יְהִ֥י רָקִ֖יעַ בְּת֣וֹךְ הַמָּ֑יִם וִיהִ֣י מַבְדִּ֔יל בֵּ֥ין מַ֖יִם לָמָֽיִם׃", "onk": "וַאֲמַר יְיָ יְהִי רְקִיעָא <b>בִּמְצִיעוּת<\/b> מַיָּא וִיהִי מַפְרִישׁ בֵּין מַיָּא לְמַיָּא:", "onk_en": "Elohim said, Let there be a canopy in the midst [<b>middle<\/b>] of the waters, and let it divide between waters and waters.", "pj": "וַאֲמַר יְיָ יְהִי רְקִיעָא בִּמְצִיעוּת מַיָא וִיהִי מַפְרִישׁ בֵּינֵי מוֹי עִלָאֵי לְבֵינֵי מוֹי תַּתָּאֵי", "pj_en": "And the Lord said, Let there be an expanse in the midst of the waters, and let it separate between the waters above and the waters beneath.", "tj": "וִיהִי מַפְרִישׁ בֵּין מַיָא עִילָאִי וּבֵין מַיָא אַרְעָאִי:", "tj_en": "And let there be a separation between the waters above and the waters below.", "rashi": "<b>יהי רקיע.<\/b> יֶחֱזַק הָרָקִיעַ, שֶׁאַף עַל פִּי שֶׁנִּבְרְאוּ שָׁמַיִם בְּיוֹם א' עֲדַיִן לַחִים הָיוּ וְקָרְשׁוּ בַשֵּׁנִי מִגַּעֲרַת הַקָּבָּ\"ה בְּאָמְרוֹ יְהִי רָקִיעַ, וְזֶהוּ שֶׁכָּתַב (איוב כ\"ו) עַמּוּדֵי שָׁמַיִם יְרוֹפָפוּ – כָּל יוֹם רִאשׁוֹן, וּבַשֵּׁנִי יִתְמְהוּ מִגַּעֲרָתוֹ, כְּאָדָם שֶׁמִּשְׁתּוֹמֵם וְעוֹמֵד מִגַּעֲרַת הַמְאַיֵּם עָלָיו:<br><br><b>בתוך המים.<\/b> בְּאֶמְצַע הַמַּיִם, שֶׁיֵּש הֶפְרֵשׁ בֵּין מַיִם הָעֶליוֹנִים לָרָקִיעַ כְּמוֹ בֵין הָרָקִיעַ לַמַּיִם שֶׁעַל הָאָרֶץ, הָא לָמַדְתָּ, שֶׁהֵם תְּלוּיִים בְּמַאֲמָרוֹ שֶׁל מֶלֶךְ:", "rashi_en": "יהי רקיע BE THERE AN EXPANSE — Let the expansion become fixed; for although the heavens were created on the first day, they were still in a fluid form, and they became solidified only on the second day at the dread command (literally, rebuke) of the Holy One, blessed be He, when he said “Let the firmament be stable” (Genesis Rabbah 4:2). It is to this that allusion is made in what is written in (Job 26:11): “The pillars of heaven were trembling” (i. e. they were unstable) — this was during the whole of the first day — and on the second (Job 26:11): “they were astonished at His rebuke”, like a man who stands immovable, amazed at the rebuke of one who terrifies him.<br><br>בתוך המים IN THE MIDST OF THE WATERS — In the exact centre of the waters; because there is the same distance between the upper waters and the firmament as there is between the firmament and the waters that are upon the earth. Thus you may infer that they (the upper waters) are suspended in space by the command of the King (Genesis Rabbah 4:3). "}, {"ch": 1, "v": 7, "aliyah": 1, "heb": "וַיַּ֣עַשׂ אֱלֹהִים֮ אֶת־הָרָקִ֒יעַ֒ וַיַּבְדֵּ֗ל בֵּ֤ין הַמַּ֙יִם֙ אֲשֶׁר֙ מִתַּ֣חַת לָרָקִ֔יעַ וּבֵ֣ין הַמַּ֔יִם אֲשֶׁ֖ר מֵעַ֣ל לָרָקִ֑יעַ וַֽיְהִי־כֵֽן׃", "onk": "וַעֲבַד יְיָ יָת רְקִיעָא וְאַפְרֵישׁ בֵּין מַיָּא דִּי מִלְרַע לִרְקִיעָא וּבֵין מַיָּא דִּי מֵעַל לִרְקִיעָא וַהֲוָה כֵן:", "onk_en": "Elohim made the canopy, and divided the waters which were beneath the canopy, from the waters which were above the canopy, and it was so.", "pj": "וַעֲבַד יְיָ יַת רְקִיעָא סוּמְכֵיהּ תְּלַת אֶצְבָּעָתָא בֵינֵי סִטְרֵי שְׁמַיָא לְמוֹי דְאוֹקְיָינוֹס וְאַפְרֵשׁ בֵּינֵי מַיָא דְמִלְרַע לִרְקִיעָא וּבֵינֵי מַיָא דִלְעֵיל בְּקוּבְתָא דִרְקִיעָא וַהֲוָה כֵן", "pj_en": "And the Lord made the expanse, upbearing it with three fingers, between the confines of the heavens and the waters of the ocean, and separated between the waters which were below the expanse, and the waters which were above, in the collection (or covering) of the expanse; and it was so.", "tj": "", "tj_en": "", "rashi": "<b>ויעש אלהים את הרקיע.<\/b> תִּקְּנוֹ עַל עָמְדוֹ, וְהִיא עֲשִׂיָּתוֹ, כְּמוֹ וְעָשְׂתָה אֶת צִפָּרְנֶיהָ (דברים כ\"א):<br><br><b>מעל לרקיע.<\/b> עַל הָרָקִיעַ לֹא נֶאֱמַר אֶלָּא מֵעַל לָרָקִיעַ, לְפִי שֶׁהֵן תְּלוּיִין בָּאֲוִיר. וּמִפְּנֵי מָה לֹא נֶאֱמַר כִּי טוֹב בְּיוֹם שֵׁנִי? לְפִי שֶׁלֹא הָיָה נִגְמָר מְלֶאכֶת הַמַּיִם עַד יוֹם שְׁלִישִׁי, וַהֲרֵי הִתְחִיל בָּהּ בְּשֵׁנִי, וְדָבָר שֶׁלֹּא נִגְמַר אֵינוֹ בִּמְלוֹאוֹ וְטוּבוֹ; וּבַשְּׁלִישִׁי שֶׁנִּגְמַר מְלֶאכֶת הַמַּיִם וְהִתְחִיל וְגָמַר מְלָאכָה אֲחֶרֶת, כָּפַל בּוֹ כִּי טוֹב שְׁתֵּי פְּעָמִים, אַחַת לִגְמַר מְלֶאכֶת הַשֵּׁנִי וְאַחַת לִגְמַר מְלֶאכֶת הַיּוֹם:", "rashi_en": "ויעש אלהים את הרקיע AND GOD MADE THE EXPANSE — He put it in proper condition in its place: this is the meaning of “making” it. Similarly (Deuteronomy 21:12) ועשתה את צפרניה “And she shall let grow (literally, make) her nails”.<br><br>מעל לרקיע ABOVE THE EXPANSE — It is not said here על הרקיע “upon the firmament״, but מעל “hanging from above”, because they (the waters) were suspended in space (Genesis Rabbah 4:3). Why is it not stated in reference to the work of the second day “that it was good”? Because the work associated with water was not completed until the third day — He only began it on the second — and anything that is not completed is not in a state of perfection and at its best (and so cannot be termed “good”). Therefore on the third day when He completed the work associated with water and another work was commenced and finished, the words כי טוב are repeated, once in reference to the completion of the work of the second day, and again in reference to the completion of the work of that day (Genesis Rabbah 4:10)."}, {"ch": 1, "v": 8, "aliyah": 1, "heb": "וַיִּקְרָ֧א אֱלֹהִ֛ים לָֽרָקִ֖יעַ שָׁמָ֑יִם וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם שֵׁנִֽי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּקְרָא יְיָ לִרְקִיעָא שְׁמַיָּא וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם תִּנְיָן:", "onk_en": "Elohim called the canopy heaven. It became evening and it became morning the second day.", "pj": "וּקְרָא יְיָ לִרְקִיעָא שְׁמַיָא וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם תִּנְיָין", "pj_en": "And the Lord called the expanse the Heavens. And it was evening, and it was morning, the Second Day.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא אלהים לרקיע שמים.<\/b> שָׂא מַיִם, שָׁם מַיִם, אֵשׁ וּמַיִם, שֶׁעֵרְבָן זֶה בָזֶה וְעָשָׂה מֵהֶם שָׁמַיִם:", "rashi_en": "ויקרא אלהים לרקיע שמים AND GOD CALLED THE EXPANSE HEAVEN — The word “שמים”, Heaven, may be regarded as made up of שא מים “Carry water”, or שם מים “There is water”, or אש ומים “Fire and water”. He mingled fire with water and of them He made the heavens (Chagigah 12a). "}, {"ch": 1, "v": 9, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֗ים יִקָּו֨וּ הַמַּ֜יִם מִתַּ֤חַת הַשָּׁמַ֙יִם֙ אֶל־מָק֣וֹם אֶחָ֔ד וְתֵרָאֶ֖ה הַיַּבָּשָׁ֑ה וַֽיְהִי־כֵֽן׃", "onk": "וַאֲמַר יְיָ יִתְכַּנְשׁוּן מַיָּא מִתְּחוֹת שְׁמַיָּא לַאֲתַר חָד וְתִתְחֲזֵי יַבֶּשְׁתָּא וַהֲוָה כֵן:", "onk_en": "Elohim said, Let the waters beneath the heavens be gathered into one place, and let the dryness be seen. It was so.", "pj": "וַאֲמַר יְיָ יִתְכַּנְשׁוּן מַיָין תַּתָּאִין דְאִשְׁתַּאֲרוּ מִן לְרַע לִשְׁמַיָא לְדוּכְתָּא חַד וְתִתְנַגַב אַרְעָא דְתִתְחַמֵי יַבֶּשְׁתָּא וַהֲוָה כֵן", "pj_en": "And the Lord said, Let the lower waters which remain under the heavens be gathered together into one place, and the earth be dried, that the land may be visible. And it was so.", "tj": "", "tj_en": "", "rashi": "<b>יקוו המים.<\/b> שֶׁהָיוּ שְׁטוּחִין עַל פְּנֵי כָל הָאָרֶץ וְהִקְוָם בָּאוֹקְיָנוֹס הוּא הַיָּם הַגָּדוֹל שֶׁבְּכָל הַיַּמִּים:", "rashi_en": "יקוו המים THE WATERS SHALL BE DRAWN TOGETHER — For they were then spread over the surface of the whole earth, and He now gathered them together into what now constitutes the Ocean, which is the largest of all seas (Genesis Rabbah 5:2). "}, {"ch": 1, "v": 10, "aliyah": 1, "heb": "וַיִּקְרָ֨א אֱלֹהִ֤ים&thinsp;<small>׀<\/small>&thinsp;לַיַּבָּשָׁה֙ אֶ֔רֶץ וּלְמִקְוֵ֥ה הַמַּ֖יִם קָרָ֣א יַמִּ֑ים וַיַּ֥רְא אֱלֹהִ֖ים כִּי־טֽוֹב׃", "onk": "וּקְרָא יְיָ לְיַבֶּשְׁתָּא אַרְעָא וּלְבֵית כְּנִישׁוּת מַיָּא קְרָא יַמְמֵי וַחֲזָא יְיָ אֲרֵי טָב:", "onk_en": "Elohim called the dryness, earth, and the gathering of the waters, He called seas, and Elohim saw that it was good.", "pj": "וּקְרָא יְיָ לִנְגִיבְתָּא אַרְעָא וּלְבֵית כְנִישַת מַיָין קָרָא יַמְמֵי וַחֲמָא יְיָ אֲרוּם טָב", "pj_en": "And the Lord called the dry (land) the Earth, and the place of the assemblage of waters called He the Seas; and the Lord saw that it was good.", "tj": "", "tj_en": "", "rashi": "<b>קרא ימים.<\/b> וַהֲלֹא יָם אֶחָד הוּא? אֶלָּא אֵינוֹ דוֹמֶה טַעַם דָּג הָעוֹלֶה מִן הַיָּם בְּעַכּוֹ לְטַעַם דָּג הָעוֹלֶה מִן הַיָּם בְּאַסְפַּמְיָא:", "rashi_en": "קרא ימים CALLED HE SEAS — But does it not form one great sea? But it speaks of seas because the taste of fish which comes up from the sea at Acco is not the same as the taste of fish which comes up from the sea at Aspamia (Genesis Rabbah 5:8). "}, {"ch": 1, "v": 11, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֗ים תַּֽדְשֵׁ֤א הָאָ֙רֶץ֙ דֶּ֗שֶׁא עֵ֚שֶׂב מַזְרִ֣יעַ זֶ֔רַע עֵ֣ץ פְּרִ֞י עֹ֤שֶׂה פְּרִי֙ לְמִינ֔וֹ אֲשֶׁ֥ר זַרְעוֹ־ב֖וֹ עַל־הָאָ֑רֶץ וַֽיְהִי־כֵֽן׃", "onk": "וַאֲמַר יְיָ תַּדְאֵית אַרְעָא דִּיתְאָה עִסְבָּא דְּבַר זַרְעֵהּ מִזְדְּרַע אִילַן פֵּירִין עָבַד פֵּירִין לִזְנֵהּ דִּי בַר זַרְעֵהּ בֵּהּ עַל אַרְעָא וַהֲוָה כֵן:", "onk_en": "Elohim said, Let the earth sprout grass, seed-yielding herbs, fruit trees bearing fruit of its own kind, with its seed within it, upon the earth. And it was so.", "pj": "וַאֲמַר יְיָ תַּרְבֵּי אַרְעָא דִיתְאֵי עִישְבָּא דְבִיזְרֵיהּ מִזְדְרָע וְאִילֵן פֵּירֵי עֲבִיד פֵּירֵי לִזְנֵיהּ דְבִזְרֵיהּ בֵּיהּ עַל אַרְעָא וַהֲוָה כֵן", "pj_en": "And the Lord said, Let the earth increase the grassy herb whose seed seedeth, and the fruit-tree making fruit after its kind, whose seed is in itself upon the earth. And it was so.", "tj": "", "tj_en": "", "rashi": "<b>תדשא הארץ דשא עשב.<\/b> לֹא דֶּשֶׁא לְשׁוֹן עֵשֶׂב וְלֹא עֵשֶׂב לְשׁוֹן דֶּשֶׁא, וְלֹא הָיָה לְשׁוֹן הַמִּקְרָא לוֹמַר תַּעֲשִׂיב הָאָרֶץ, שֶׁמִינֵי דְּשָׁאִים מְחֻלָּקִין, כָּל אֶחָד לְעַצְמוֹ נִקְרָא עֵשֶׂב פְּלוֹנִי, וְאֵין לָשׁוֹן לַמְדַבֵּר לוֹמַר דֶּשֶׁא פְּלוֹנִי, שֶׁלְּשׁוֹן דֶּשֶׁא הוּא לְבִישַׁת הָאָרֶץ כְּשֶׁהִיא מִתְמַלֵּאת בִּדְשָׁאִים:<br><br><b>תדשא הארץ.<\/b> תִּתְמַלֵּא וְתִתְכַּסֶּה לְבוּשׁ עֲשָׂבִים. בִּלְשׁוֹן לַעַז נִקְרָא דֶּשֶׁא ארבריץ, כֻּלָן בְּעִרְבּוּבְיָא, וְכָל שֹׁרֶשׁ לְעַצְמוֹ נִקְרָא עֵשֶׂב:<br><br><b>מזריע זרע.<\/b> שֶׁיְּגַדֵּל בּוֹ זַרְעוֹ לִזְרֹעַ מִמֶּנוּ בְּמָקוֹם אַחֵר:<br><br><b>עץ פרי.<\/b> שֶׁיְּהֵא טַעַם הָעֵץ כְּטַעַם הַפְּרִי, וְהִיא לֹא עָשְׂתָה כֵן, אֶלָּא וַתּוֹצֵא הָאָרֶץ עֵץ עוֹשֶׂה פְּרִי וְלֹא הָעֵץ פְּרִי, לְפִיכָךְ כְּשֶׁנִּתְקַלֵּל אָדָם עַל עֲוֹנוֹ נִפְקְדָה גַם הִיא עַל עֲוֹנָהּ וְנִתְקַלְּלָה:<br><br><b>אשר זרעו בו.<\/b> הֵן גַרְעִינֵי כָל פְּרִי שֶׁמֵּהֶן הָאִילָן צוֹמֵחַ כְּשֶׁנּוֹטְעִין אוֹתוֹ:", "rashi_en": "תדשא הארץ דשא עשב THE EARTH SHALL SPROUT FORTH SPROUTS, HERB — דשא does not mean the same as עשב nor does עשב mean the same as דשא so that it is not a correct expression in Biblical Hebrew to say תעשיב הארץ, for the species of דשא are all different, each by itself being called this or that עשב, and it would not be linguistically correct for a speaker to say this or that דשא, for by דשא is meant that which forms the covering of the ground when it is filled with herbage.<br><br>תדשא הארץ THE EARTH SHALL SPROUT FORTH [SPROUTS] — Let it be filled and covered with a garment of different grasses. In old French דשא is called herbaries; English herbage, meaning all species of herbs growing together collectively whilst each root by itself is called an עשב.<br><br>— מזריע זרע YIELDING SEED — that its seed should grow within itself, so that some of it may be sown in another spot.<br><br>עץ פרי FRUIT TREE — that the taste of the tree be exactly the same as that of the fruit. It did not, however, do this, but (v. 12) “the earth brought forth a tree yielding fruit” and the tree itself was not a fruit; therefore when Adam was cursed on account of his sin, it (the earth) was also visited (because of its sin) and was cursed also (Genesis Rabbah 5:9).<br><br>אשר זרעו בו WHOSE SEED IS IN ITSELF — This refers to the kernels of each kind of fruit from which the tree grows when they are planted. "}, {"ch": 1, "v": 12, "aliyah": 1, "heb": "וַתּוֹצֵ֨א הָאָ֜רֶץ דֶּ֠שֶׁא עֵ֣שֶׂב מַזְרִ֤יעַ זֶ֙רַע֙ לְמִינֵ֔הוּ וְעֵ֧ץ עֹֽשֶׂה־פְּרִ֛י אֲשֶׁ֥ר זַרְעוֹ־ב֖וֹ לְמִינֵ֑הוּ וַיַּ֥רְא אֱלֹהִ֖ים כִּי־טֽוֹב׃", "onk": "וְאַפֵּקַת אַרְעָא דִּיתְאָה עִסְבָּא דְּבַר זַרְעֵהּ מִזְדְּרַע לִזְנוֹהִי וְאִילַן עָבֵד פֵּירִין דְּבַר זַרְעֵהּ בֵּהּ לִזְנוֹהִי וַחֲזָא יְיָ אֲרֵי טָב:", "onk_en": "The earth brought forth grass, herbs yielding seed of its kind, and trees bearing fruit which has in it seeds of its kind; and Elohim saw that it was good.", "pj": "וְהַנְפָקַת אַרְעָא דִיתְאִין עִיסְבָא דְבִזְרֵיהּ מִזְדְרַע וְאִילָן עַבִיד פֵּירֵי לִזְנֵיהּ וַחֲמָא יְיָ אֲרוּם טָב", "pj_en": "And the earth produced grasses (and) herbage whose seed seedeth, and the tree making fruit after its kind. And the Lord saw that it was good.", "tj": "", "tj_en": "", "rashi": "<b>ותוצא הארץ וגו'.<\/b> אַעַ\"פִּ שֶׁלֹּא נֶאֱמַר לְמִינֵהוּ בַּדְּשָׁאִין בְּצִוּוּיֵיהֶן, שָׁמְעוּ שֶׁנִּצְטַוּוּ הָאִילָנוֹת עַל כָּךְ, נָשְׂאוּ קַ\"וָ בְּעַצְמָן, כַּמְּפֹרָשׁ בָּאַגָּדָה בִּשְׁחִיטַת חֻלִּין:", "rashi_en": "ותוצא הארץ וגו AND THE EARTH BROUGHT FORTH etc. — Although the expression למינהו according to its kind, was not used when the various kinds of herbage were bidden to come forth, they heard that the trees were so commanded and they applied to themselves the argument à fortiore (ק\"ו), as it is explained in an Aggadic passage in (Chullin 60a). "}, {"ch": 1, "v": 13, "aliyah": 1, "heb": "וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם שְׁלִישִֽׁי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם תְּלִיתָאִי:", "onk_en": "It became evening and it became morning, the third day.", "pj": "וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם תְּלִיתָאֵי", "pj_en": "And it was evening, and it was morning, the Third Day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 14, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֗ים יְהִ֤י מְאֹרֹת֙ בִּרְקִ֣יעַ הַשָּׁמַ֔יִם לְהַבְדִּ֕יל בֵּ֥ין הַיּ֖וֹם וּבֵ֣ין הַלָּ֑יְלָה וְהָי֤וּ לְאֹתֹת֙ וּלְמ֣וֹעֲדִ֔ים וּלְיָמִ֖ים וְשָׁנִֽים׃", "onk": "וַאֲמַר יְיָ יְהוֹן נְהוֹרִין בִּרְקִיעָא דִּשְׁמַיָּא לְאַפְרָשָׁא בֵּין יְמָמָא וּבֵין לֵילְיָא וִיהוֹן לְאָתִין וּלְזִמְנִין וּלְ<b>מִימְנֵי בְהוֹן<\/b> יוֹמִין וּשְׁנִין:", "onk_en": "Elohim said, Let there be lights in the canopy of heaven to divide between the day and the night, and they will serve for signs for seasons, [<b>and to count<\/b>] (for) days and (for) years [<b>with them<\/b>].", "pj": "וַאֲמַר יְיָ יְהוֹן נְהוֹרִין בִּרְקִיעָא דִשְׁמַיָא לְמַפְרְשָׁא בֵּינֵי יְמָמָא וּבֵינֵי לֵילְיָא וִיהוֹן לְסִימָנִין וּלְזִמְנֵי מוֹעֲדִין וּלְמִימְנֵי בְּהוֹן חוּשְׁבַּן יוֹמִין וּלְמַקְדְשָׁא רֵישֵׁי יַרְחִין וְרֵישֵׁי שְׁנִין עִבּוּרֵי יַרְחִין וְעִבּוּרֵי שְׁנִין וּתְקוּפַת שִׁמְשָׁא וּמוֹלַד סִיהֲרָא וּמַחֲזוֹרִין", "pj_en": "And the Lord said, Let there be lights in the expanse of the heavens, to distinguish between the day and the night; and let them be for signs and for festival times, and for the numbering by them the account of days, and for the sanctifying of the beginning of months, and the beginning of years, the passing away of months, and the passing away of years, the revolutions of the sun, the birth of the moon, and the revolvings (of seasons).", "tj": "וִיהוֹן לְאָתִין לְמוֹעֲדִין וּלְמַקְדְשָׁא בְּהוֹן רֵישֵׁי יַרְחִין וּשְׁנִין:", "tj_en": "And let them be for signs, and for seasons, and for the sanctifying by them of the beginning of months and years.", "rashi": "<b>יהי מארת וגו'.<\/b> מִיֹּום רִאשׁוֹן נִבְרְאוּ וּבָרְבִיעִי צִוָּה עֲלֵיהֶם לְהִתָּלוֹת בָּרָקִיעַ, וְכֵן כָּל תּוֹלְדוֹת שָׁמַיִם וָאָרֶץ נִבְרְאוּ מִיּוֹם רִאשׁוֹן, וְכָל אֶחָד וְאֶחָד נִקְבַּע בַּיוֹם שֶׁנִּגְזַר עָלָיו, הוּא שֶׁכָּתוּב אֵת הַשָּׁמַיִם, לְרַבּוֹת תּוֹלְדוֹתֵיהֶם, וְאֵת הָאָרֶץ, לְרַבּוֹת תּוֹלְדוֹתֶיהָ:<br><br><b>יהי מארת.<\/b> חָסֵר וָי\"ו כְּתִיב, עַל שֶׁהוּא יוֹם מְאֵרָה לִפֹּל אַסְכָּרָה בַּתִּינוֹקוֹת, הוּא שֶׁשָּׁנִינוּ בְּד' הָיוּ מִתְעַנִּים עַל אַסְכָּרָה שֶׁלֹּא תִפֹּל בַּתִּינוֹקוֹת:<br><br><b>להבדיל בין היום ובין הלילה.<\/b> מִשֶּׁנִּגְנַז הָאוֹר הָרִאשׁוֹן, אֲבָל בְּשִׁבְעַת יְמֵי בְרֵאשִׁית שִׁמְּשׁוּ הָאוֹר וְהַחֹשֶׁךְ הָרִאשׁוֹנִים יַחַד בֵּין בַּיּוֹם וּבֵין בַּלַּיְלָה:<br><br><b>והיו לאותות.<\/b> כְּשֶׁהַמְּאוֹרוֹת לוֹקִין, סִימָן רַע הוּא לָעוֹלָם, שֶׁנֶּאֱמַר מֵאֹתוֹת הַשָּׁמַיִם אַל תֵּחָתּוּ (ירמיה י'), בַּעֲשׂוֹתְכֶם רְצוֹן הַקָּבָּ\"ה אֵין אַתֶּם צְרִיכִין לִדְאֹג מִן הַפֻּרְעָנוּת:<br><br><b>ולמועדים.<\/b> עַל שֵׁם הֶעָתִיד, שֶׁעֲתִידִים יִשְׂרָאֵל לְהִצְטַוּוֹת עַל הַמּוֹעֲדוֹת וְהֵם נִמְנִים לְמוֹלַד הַלְּבָנָה:<br><br><b>ולימים.<\/b> שִׁמּוּשׁ הַחַמָּה חֲצִי יוֹם וְשִׁמּוּשׁ הַלְּבָנָה חֶצְיוֹ, הֲרֵי יוֹם שָׁלֵם:<br><br><b>ושנים.<\/b> לְסוֹף שס\"ה יָמִים (ס\"א וּרְבִיעַ יוֹם), יִגְמְרוּ מַהֲלָכָתָם בְּי\"ב מַזָּלוֹת הַמְשָׁרְתִים אוֹתָם, וְהִיא שָׁנָה, וְחוֹזְרִים וּמַתְחִילִים פַּעַם שְׁנִיָּה לְסַבֵּב בַּגַּלְגַּל כְּמַהֲלָכָן הָרִאשׁוֹן:", "rashi_en": "יהי מארת BE THERE LUMINARIES — They had been created on the first day, but on the fourth He commanded them to be suspended in the firmament (Chagigah 12a). Indeed, all the productions of heaven and earth were created on the first day, but each of them was put in its place on that day when it was so commanded. In reference to this it is written את השמים (v. 1) In the beginning God created that which was את with the heavens etc., in order to include all the productions of heaven, ואת הארץ to include all its (the earth’s) productions (Genesis Rabbah 12:4).<br><br>יהי מארת The word is written without the ו after the א (so that it may be read מארת, cursed), because it is a cursed day when children are liable to suffer from croup. In reference to this we read (in Taanit 27b): On the fourth day of the week they used to fast to avert croup from the children (Yerushalmi Taanit 4:3).<br><br>להבדיל בין היום ובין הלילה TO CAUSE A DIVISION BETWEEN THE DAY AND THE NIGHT — This took place after the primeval (divine) light was conserved for the righteous; but during the first seven [another reading is “three”] days of Creation the primeval light and darkness functioned together both by day and by night.<br><br>והיו לאותות AND THEY SHALL BE FOR SIGNS — When the heavenly luminaries are eclipsed it is a sign of ill-omen for the world, as it is written, (Jeremiah 10:2) “Be not dismayed at the signs of heaven” — when you carry out the will of the Holy One, blessed be He, you need apprehend no calamity (Sukkah 29a).<br><br>ולמועדים AND FOR SEASONS (FESTIVALS) — This is written with a view to the future when Israel would receive command regarding the festivals which would be calculated from the time of the lunar conjunction (Genesis Rabbah 6:1).<br><br>ולימים AND FOR DAYS — The sun functions half a day and the moon the other half — together a full day.<br><br>ושנים AND FOR YEARS — At the end of three hundred and sixty five days [another version: 365¼] they complete their course through the twelve signs of the Zodiac that attend them, and that is one year [another version: and this makes 365¼ days]; they then begin to revolve a second time in a circle similar to their first cycle. "}, {"ch": 1, "v": 15, "aliyah": 1, "heb": "וְהָי֤וּ לִמְאוֹרֹת֙ בִּרְקִ֣יעַ הַשָּׁמַ֔יִם לְהָאִ֖יר עַל־הָאָ֑רֶץ וַֽיְהִי־כֵֽן׃", "onk": "וִיהוֹן לִנְהוֹרִין בִּרְקִיעָא דִּשְׁמַיָּא לְאַנְהָרָא עַל אַרְעָא וַהֲוָה כֵן:", "onk_en": "They will be for lights in the canopy of heaven to illuminate the earth. And it was so.", "pj": "וִיהוֹן לִנְהוֹרִין בִּרְקִיעָא דִשְׁמַיָא לִמְנַהֲרָא עֲלוֹי אַרְעָא וַהֲוָה כֵן", "pj_en": "And let them be for luminaries in the expanse of the heavens to give light upon the earth. And it was so.", "tj": "", "tj_en": "", "rashi": "<b>והיו למאורת.<\/b> עוֹד זֹאת יְשַׁמְּשׁוּ, שֶׁיָּאִירוּ לָעוֹלָם:", "rashi_en": "והיו למאורות AND LET THEM BE FOR LIGHTS — They shall serve also this purpose, namely, to give light to the world. "}, {"ch": 1, "v": 16, "aliyah": 1, "heb": "וַיַּ֣עַשׂ אֱלֹהִ֔ים אֶת־שְׁנֵ֥י הַמְּאֹרֹ֖ת הַגְּדֹלִ֑ים אֶת־הַמָּא֤וֹר הַגָּדֹל֙ לְמֶמְשֶׁ֣לֶת הַיּ֔וֹם וְאֶת־הַמָּא֤וֹר הַקָּטֹן֙ לְמֶמְשֶׁ֣לֶת הַלַּ֔יְלָה וְאֵ֖ת הַכּוֹכָבִֽים׃", "onk": "וַעֲבַד יְיָ יָת תְּרֵין נְהוֹרַיָּא רַבְרְבַיָּא יָת נְהוֹרָא רַבָּא לְמִשְׁלַט בִּימָמָא וְיָת נְהוֹרָא זְעֵרָא לְמִשְׁלַט בְּלֵילְיָא וְיָת כּוֹכְבַיָּא:", "onk_en": "Elohim made the two great lights, the large light to rule the day, and the small light to rule the night, and the stars", "pj": "וַעֲבַד יְיָ יַת תְּרֵין נְהוֹרַיָא רַבְרְבַיָא וַהֲווֹן שָׁוִין בְּאִיקְרֵהוֹן עֶשְרִין וְחַד שָׁעִין בָּצִיר מִנְהוֹן שִׁית מְאָה וּתְרֵין שׁוּבְעִין חוֹלְקֵי שַׁעֲתָּא וּמִן בָּתַר כֵּן אִישְׁתָּעִית סִיהֲרָא עִילוֹי שִׁמְשָׁא לִישָׁן תְּלִיתָאֵי וְאִזְדְעָרַת וּמַנֵי יַת שִׁמְשָׁא דַהֲוָה נְהוֹרָא רַבָּא לְמִישְׁלַט בִּימָמָא וְיַת סִיהֲרָא דַהֲוָה נְהוֹרָא זְעֵירָא לְמִשְׁלַט בְּלֵילְיָא וְיַת כּוֹכְבַיָא", "pj_en": "And the Lord made two great luminaries; and they were equal in glory twenty and one years, less six hundred and two and seventy parts of an hour. And afterwards the moon recited against the sun a false report; and she was diminished, and the sun was appointed to be the greater light to rule the day; and the moon to be the inferior light to rule in the night, and the stars.", "tj": "", "tj_en": "", "rashi": "<b>המארת הגדולים.<\/b> שָׁוִים נִבְרְאוּ וְנִתְמַעֲטָה הַלְּבָנָה עַל שֶׁקִּטְרְגָה וְאָמְרָה אִ\"אֶ לִשְׁנֵי מְלָכִים שֶׁיִשְׁתַּמְּשׁוּ בְכֶתֶר אֶחָד:<br><br><b>ואת הכוכבים.<\/b> עַל יְדֵי שֶׁמִּעֵט אֶת הַלְּבָנָה הִרְבָּה צְבָאָיהָ לְהָפִיס דַּעְתָּהּ:", "rashi_en": "המאורות הגדולים THE GREAT LUMINARIES — They were created of equal size, but that of the moon was diminished because she complained and said, “It is impossible for two kings to make use of one crown” (Chullin 60b).<br><br>ואת הכוכבים AND THE STARS — Because He diminished the moon, He increased its attendant hosts to mollify it (Genesis Rabbah 6:4). "}, {"ch": 1, "v": 17, "aliyah": 1, "heb": "וַיִּתֵּ֥ן אֹתָ֛ם אֱלֹהִ֖ים בִּרְקִ֣יעַ הַשָּׁמָ֑יִם לְהָאִ֖יר עַל־הָאָֽרֶץ׃", "onk": "וִיהַב יָתְהוֹן יְיָ בִּרְקִיעָא דִּשְׁמַיָּא לְאַנְהָרָא עַל אַרְעָא:", "onk_en": "Elohim set them in the canopy of the heaven to illuminate the earth,", "pj": "וְסָדַר יַתְהוֹן יְיָ עַל שִׁטְרֵיהוֹן בִּרְקִיעָא דִשְׁמַיָא לִמְנַהֲרָא עַל אַרְעָא", "pj_en": "And the Lord ordained them unto their offices, in the expanse of the heavens, to give forth light upon the earth,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 18, "aliyah": 1, "heb": "וְלִמְשֹׁל֙ בַּיּ֣וֹם וּבַלַּ֔יְלָה וּֽלְהַבְדִּ֔יל בֵּ֥ין הָא֖וֹר וּבֵ֣ין הַחֹ֑שֶׁךְ וַיַּ֥רְא אֱלֹהִ֖ים כִּי־טֽוֹב׃", "onk": "וּלְמִשְׁלַט בִּימָמָא וּבְלֵילְיָא וּלְאַפְרָשָׁא בֵּין נְהוֹרָא וּבֵין חֲשׁוֹכָא וַחֲזָא יְיָ אֲרֵי טָב:", "onk_en": "to rule in the day and the night, and to divide between the light and the darkness; and Elohim saw that it was good.", "pj": "וּלְמִשַׁמְשָׁא בִּימָמָא וּבְלֵילְיָא וּלְמַפְרָשָׁא בֵּין נְהוֹרָא דִימָמָא וּבֵין חֲשׁוֹךְ לֵילְיָא וַחֲמָא יְיָ אֲרוּם טָב", "pj_en": "and to minister by day and by night, to distinguish between the light of the day and the darkness of the night. And the Lord beheld that it was good.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 19, "aliyah": 1, "heb": "וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם רְבִיעִֽי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם רְבִיעָאִי:", "onk_en": "It became evening and it became morning, the fourth day.", "pj": "וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם רְבִיעָאֵי", "pj_en": "And it was evening, and it was morning, Day the Fourth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 20, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֔ים יִשְׁרְצ֣וּ הַמַּ֔יִם שֶׁ֖רֶץ נֶ֣פֶשׁ חַיָּ֑ה וְעוֹף֙ יְעוֹפֵ֣ף עַל־הָאָ֔רֶץ עַל־פְּנֵ֖י רְקִ֥יעַ הַשָּׁמָֽיִם׃", "onk": "וַאֲמַר יְיָ יִרְחֲשׁוּן מַיָּא רְחֵשׁ נַפְשָׁא חַיְתָא וְעוֹפָא יְפָרַח עַל אַרְעָא עַל אַפֵּי רְקִיעָא דִּשְׁמַיָּא:", "onk_en": "Elohim said, Let the waters teem with swarms of living creatures, and let birds fly above the earth, in the open canopy of the heaven.", "pj": "וַאֲמַר יְיָ יְרַחֲשׁוּן רְקָקֵי מוֹי רְחֵישׁ נַפְשָׁא חַיְיתָא וְעוֹפָא דְטַיֵיס וּשַׁרְכַּפְתֵּיהּ עַל אַרְעָא וּשְבִיל טַיְיסֵיהּ עַל אַוִיר רָקִיעַ שְׁמַיָא", "pj_en": "And the Lord said, Let the lakes of the waters swarm forth the reptile, the living animal, and the fowl which flieth, whose nest is upon the earth; and let the way of the bird be upon the air of the expanse of the heavens.", "tj": "", "tj_en": "", "rashi": "<b>נפש חיה.<\/b> שֶׁיְּהֵא בָהּ חַיּוּת:<br><br><b>שרץ.<\/b> כָּל דָּבָר חַי שֶׁאֵינוֹ גָבוֹהַּ מִן הָאָרֶץ קָרוּי שֶׁרֶץ: בָּעוֹף, כְּגוֹן זְבוּבִים, בַּשְּׁקָצִים, כְּגוֹן נְמָלִים וְחִפּוּשִׁים וְתוֹלָעִים, בַּבְּרִיּוֹת, כְּגוֹן חֹלֶד וְעַכְבָּר וְחֹמֶט וְכַיּוֹצֵא בָהֶם, וְכָל הַדָּגִים:", "rashi_en": "נפש חיה LIVING CREATURES — Creatures that shall have vitality.<br><br>שרץ Every living creature that does not rise much above the ground is called שרץ, e. g., of winged creatures — flies; of abominable creatures — ants, beetles and worms; of larger creatures — the mole, snail and others of the same kind, and all fishes."}, {"ch": 1, "v": 21, "aliyah": 1, "heb": "וַיִּבְרָ֣א אֱלֹהִ֔ים אֶת־הַתַּנִּינִ֖ם הַגְּדֹלִ֑ים וְאֵ֣ת כׇּל־נֶ֣פֶשׁ הַֽחַיָּ֣ה&thinsp;<small>׀<\/small>&thinsp;הָֽרֹמֶ֡שֶׂת אֲשֶׁר֩ שָׁרְצ֨וּ הַמַּ֜יִם לְמִֽינֵהֶ֗ם וְאֵ֨ת כׇּל־ע֤וֹף כָּנָף֙ לְמִינֵ֔הוּ וַיַּ֥רְא אֱלֹהִ֖ים כִּי־טֽוֹב׃", "onk": "וּבְרָא יְיָ יָת תַּנִּינַיָּא רַבְרְבַיָּא וְיָת כָּל נַפְשָׁא חַיְתָא דִּרְחִשָׁא דִּי אַרְחִישׁוּ מַיָּא לִזְנֵיהוֹן וְיָת כָּל עוֹפָא דְפָרַח לִזְנוֹהִי וַחֲזָא יְיָ אֲרֵי טָב:", "onk_en": "And thus Elohim created the great whales, and every living creature that creeps, with which the waters teem, of its kind, and every winged bird of its kind; and Elohim saw that it was good.", "pj": "וּבְרָא יְיָ יַת תַּנִינַיָא רַבְרְבַיָא יַת לִוְיָתָן וּבַר זוּגֵיהּ דְמִתְעַתְּדִין לְיוֹם נֶחֱמָתָא וְיַת כָּל נַפְשָׁתָא חַיְתָא דְרִיחֲשָׁא דְאַרְחִישׁוּ מַיָא צְלִילְתָּא לִזְנֵיהוֹן זְנֵי דַכְיָין וּזְנֵי דְלָא דַכְיָין וְיַת כָּל עוֹף דְטַיֵיס בְּגַדְפִין לִזְנוֹהִי זְנֵי דַכְיָין וּזְנֵי דְלָא דַכְיָין וַחֲמָא יְיָ אֲרוּם טָב", "pj_en": "And the Lord created the great tanins, the lev-ya-than and his yoke-fellow which are prepared for the day of consolation, and every living animal which creepeth, and which the clear waters had swarmed forth after their kind; the kinds which are clean, and the kinds which are not clean; and every fowl which flieth with wings after their kinds, the clean and the unclean. And the Lord beheld that it was good.", "tj": "", "tj_en": "", "rashi": "<b>התנינם.<\/b> דָּגִים גְּדוֹלִים שֶׁבַּיָּם, וּבְדִבְרֵי אַגָּדָה הוּא לִוְיָתָן וּבֶן זוּגוֹ שֶׁבְּרָאָם זָכָר וּנְקֵבָה וְהָרַג אֶת הַנְּקֵבָה וּמְלָחָהּ לַצַּדִּיקִים לֶעָתִיד לָבֹא, שֶׁאִם יִפְרוּ וְיִרְבּוּ לֹא יִתְקַיֵּם הָעוֹלָם בִּפְנֵיהֶם:<br><br><b>נפש החיה.<\/b> שֶׁיֵּש בָּהּ חַיּוּת:", "rashi_en": "התנינים THE HUGE CREATURES — the large fishes that are in the sea; and according to the statement of the Agada (Bava Batra 74b) it means here the Leviathan and its consort which He created male and female. He, however, killed the female and preserved it in salt for the benefit of the righteous in the time to come, for had they been permitted to be fruitful and to multiply the world could not have endured because of them.<br><br>נפש חיה — that have vitality. "}, {"ch": 1, "v": 22, "aliyah": 1, "heb": "וַיְבָ֧רֶךְ אֹתָ֛ם אֱלֹהִ֖ים לֵאמֹ֑ר פְּר֣וּ וּרְב֗וּ וּמִלְא֤וּ אֶת־הַמַּ֙יִם֙ בַּיַּמִּ֔ים וְהָע֖וֹף יִ֥רֶב בָּאָֽרֶץ׃", "onk": "וּבָרִיךְ יָתְהוֹן יְיָ לְמֵימָר פּוּשׁוּ וּסְגוּ וּמְלוּ יָת מַיָּא בְּיַמְמַיָּא וְעוֹפָא יִסְגֵּי בְּאַרְעָא:", "onk_en": "Elohim blessed them saying, Be fruitful and multiply, fill the waters of the seas, and let the birds multiply on the earth.", "pj": "וּבָרִיךְ יַתְהוֹן יְיָ לְמֵימָר פּוּשׁוּ וּסְגוּ וּמְלוּ יַת מַיָא בְּיַמְמַיָא וְעוֹפָא יַפְשֵׁי בְּאַרְעָא", "pj_en": "And He blessed them, saying, Increase and multiply, and fill the waters of the seas, and let the fowl multiply upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>ויברך אותם.<\/b> לְפִי שֶׁמְּחַסְּרִים אוֹתָם וְצָדִין מֵהֶם וְאוֹכְלִין אוֹתָם, הֻצְרְכוּ לִבְרָכָה, וְאַף הַחַיּוֹת הֻצְרְכוּ לִבְרָכָה, אֶלָּא מִפְּנֵי הַנָּחָשׁ שֶׁעָתִיד לִקְלָלָה, לְכָךְ לֹא בֵרְכָן, שֶׁלֹּא יְהֵא הוּא בִכְלָל:<br><br><b>פרו.<\/b> לְ' פְּרִי כְּלוֹ' עֲשׁוּ פֵּרוֹת:<br><br><b>ורבו.<\/b> אִם לֹא אָמַר אֶלָּא פְּרוּ, הָיָה אֶחָד מוֹלִיד אֶחָד וְלֹא יוֹתֵר, וּבָא וּרְבוּ שֶׁאֶחָד מוֹלִיד הַרְבֵּה:", "rashi_en": "ויברך אותם AND HE BLESSED THEM — Because people decreased their number, hunting them and eating them, they needed a blessing (Genesis Rabbah 11:2); it is true that beasts also were in need of a blessing, but on account of the serpent that was to be cursed in the future, He did not bless them, in order that it might not be included in the blessing.<br><br>פרו BE FRUITFUL — פרו is of the same root as פרי, and means bring forth fruit.<br><br>ורבו AND MULTIPLY — Had He said “Be fruitful” only, one creature might have brought forth a single one, and no more, therefore He added ורבו “and multiply”, implying that one should bring forth many. "}, {"ch": 1, "v": 23, "aliyah": 1, "heb": "וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם חֲמִישִֽׁי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם חֲמִישָׁאִי:", "onk_en": "It became evening and it became morning, the fifth day.", "pj": "וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם חֲמִישָׁאֵי", "pj_en": "And it was evening, and it was morning, Day the Fifth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 24, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֗ים תּוֹצֵ֨א הָאָ֜רֶץ נֶ֤פֶשׁ חַיָּה֙ לְמִינָ֔הּ בְּהֵמָ֥ה וָרֶ֛מֶשׂ וְחַֽיְתוֹ־אֶ֖רֶץ לְמִינָ֑הּ וַֽיְהִי־כֵֽן׃", "onk": "וַאֲמַר יְיָ תַּפֵּק אַרְעָא נַפְשָׁא חַיְתָא לִזְנַהּ בְּעִיר וּרְחֵשׁ וְחֵוַת אַרְעָא לִזְנַהּ וַהֲוָה כֵן:", "onk_en": "Elohim said, Let the earth bring forth living creatures, each of its kind, animals [of pasture], creeping things, and beasts of the earth, each to its kind. And it was so.", "pj": "וַאֲמַר יְיָ תְּהַנְפֵּק גַרְגִישְׁתָּא דְאַרְעָא נַפְשַׁת בִּרְיָיתָא לִזְנֵיהּ זְנֵי דַכְיָין וּזְנֵי דְלָא דַכְיָין בְּעִירֵי וְרִחֲשֵׁי וּבַרְיַית אַרְעָא לִזְנֵיהּ וַהֲוָה כֵן", "pj_en": "And the Lord said, Let the soil of the earth bring forth the living creature according to his kind; the kind that is clean and the kind that is unclean; cattle, and creeping thing, and the creature of the earth, according to his kind. And it was so.", "tj": "", "tj_en": "", "rashi": "<b>תוצא הארץ.<\/b> הוּא שֶׁפֵּרַשְׁתִּי שֶׁהַכֹּל נִבְרָא מִיּוֹם רִאשׁוֹן, וְלֹא הֻצְרְכוּ אֶלָּא לְהוֹצִיאָם:<br><br><b>נפש חיה.<\/b> שֶׁיֵּשׁ בָּהּ חַיּוּת:<br><br><b>ורמש.<\/b> הֵם שְׁרָצִים, שֶׁהֵם נְמוּכִים וְרוֹמְשִׂים עַל הָאָרֶץ וְנִרְאִים כְּאִלּוּ נִגְרָרִים שֶׁאֵין הִלוּכָן נִכָּר. כָּל לְשׁוֹן רֶמֶשׂ וְשֶׁרֶץ בִּלְשׁוֹנֵנוּ קונמו\"בריש בלע\"ז:", "rashi_en": "תוצא הארץ THE EARTH SHALL BRING FORTH — That is what I have explained (v. 14) that all things were created on the first day, and it was only necessary to bring them forth from the ground.<br><br>נפש חיה — that have vitality.<br><br>ורמש — It means creeping swarms that creep low upon the ground; they appear as though they are dragged along, for how they move is not discernible. What we call רמש and שרץ in our (Hebrew) language, they call in old French mouvoir; English to move. "}, {"ch": 1, "v": 25, "aliyah": 1, "heb": "וַיַּ֣עַשׂ אֱלֹהִים֩ אֶת־חַיַּ֨ת הָאָ֜רֶץ לְמִינָ֗הּ וְאֶת־הַבְּהֵמָה֙ לְמִינָ֔הּ וְאֵ֛ת כׇּל־רֶ֥מֶשׂ הָֽאֲדָמָ֖ה לְמִינֵ֑הוּ וַיַּ֥רְא אֱלֹהִ֖ים כִּי־טֽוֹב׃", "onk": "וַעֲבַד יְיָ יָת חֵוַת אַרְעָא לִזְנַהּ וְיָת בְּעִירָא לִזְנַהּ וְיָת כָּל רִחֲשָׁא דְאַרְעָא לִזְנוֹהִי וַחֲזָא יְיָ אֲרֵי טָב:", "onk_en": "And thus Elohim made the beasts of the earth, each of its kind, the animals [of pasture] each of its kind, and everything that creeps on the ground, each of its kind, and Elohim saw that it was good.", "pj": "וַעַבַד יְיָ יַת חֵיוַת אַרְעָא לִזְנָהּ זְנֵי דַכְיָין וּזְנֵי דְלָא דַכְיָין וְיַת בְּעִירָא לִזְנָהּ וְיַת כָּל רִחִיש אַרְעָא לִזְנָהּ זְנֵי דַכְיָין וּזְנֵי דְלָא דַכְיָין וַחֲמָא יְיָ אֲרוּם טַב", "pj_en": "And the Lord made the beast of the earth after his kind, the clean and the unclean, and cattle after their kind, and every reptile of the earth after its kind, the clean and the unclean. And the Lord saw that it was good.", "tj": "", "tj_en": "", "rashi": "<b>ויעש.<\/b> תִּקְּנָם בְּצִבְיוֹנָם וּבְקוֹמָתָן:", "rashi_en": "ויעש AND HE MADE — He formed them with their full volition and in their full stature (Chullin 60a). "}, {"ch": 1, "v": 26, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֔ים נַֽעֲשֶׂ֥ה אָדָ֛ם בְּצַלְמֵ֖נוּ כִּדְמוּתֵ֑נוּ וְיִרְדּוּ֩ בִדְגַ֨ת הַיָּ֜ם וּבְע֣וֹף הַשָּׁמַ֗יִם וּבַבְּהֵמָה֙ וּבְכׇל־הָאָ֔רֶץ וּבְכׇל־הָרֶ֖מֶשׂ הָֽרֹמֵ֥שׂ עַל־הָאָֽרֶץ׃", "onk": "וַאֲמַר יְיָ נַעֲבִיד אֶינָשָׁא בְּצַלְמֵנָא כִּדְמוּתָנָא וְיִשְׁלְטוּן בְּנוּנֵי יַמָּא וּבְעוֹפָא דִּשְׁמַיָּא וּבִבְעִירָא וּבְכָל אַרְעָא וּבְכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא:", "onk_en": "Elohim said, Let us make man in our image, as our likeness, and let him dominate the fish of the sea, the birds of the heaven, the animals, all the earth, and every creeping thing that creeps on the earth.", "pj": "וַאֲמַר יְיָ לְמַלְאָכַיָא דִמְשַׁמְשִׁין קוֹמוֹי דְאִיתְבְּרִי בְּיוֹם תִּנְיָן לִבְרִיַית עַלְמָא נַעֲבֵיד אָדָם בְּצַלְמָנָא בִּדְיוֹקְנָנָא וְיִשְׁלְטוּן בְּכַוְורֵי יַמָא וּבְעוֹפָא דְאַוִיר שְׁמַיָא וּבִבְעִירָא וּבְכָל אַרְעָא וּבְכָל רִיחֲשָׁא דִרְחֵישׁ עֲלוֹי אַרְעָא", "pj_en": "And the Lord said to the angels who ministered before Him, who had been created in the second day of the creation of the world, Let us make man in Our image, in Our likeness; and let them rule over the fish of the sea, and over the fowl which are in the atmosphere of heaven, and over the cattle, and over all the earth, and over every reptile creeping upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>נעשה אדם.<\/b> עַנְוְתָנוּתוֹ שֶׁל הַקָּבָּ\"ה לָמַדְנוּ מִכָּאן, לְפִי שֶׁאָדָם הוּא בִּדְמוּת הַמַּלְאָכִים וְיִתְקַנְּאוּ בוֹ, לְפִיכָךְ נִמְלַךְ בָּהֶם, וּכְשֶׁהוּא דָן אֶת הַמְּלָכִים הוּא נִמְלָךְ בְּפָמַלְיָא שֶׁלּוֹ, שֶׁכֵּן מָצִינוּ בְאַחְאָב, שֶׁאָמַר לוֹ מִיכָה רָאִיתִי אֶת ה' יֹשֵׁב עַל כִּסְאוֹ וְכָל צְבָא הַשָּׁמַיִם עוֹמְדִים עָלָיו מִימִינוֹ וּמִשְּׂמֹאלוֹ (מלכים א כ\"ב), וְכִי יֵש יָמִין וּשְׂמֹאל לְפָנָיו? אֶלָּא אֵלּוּ מַיְמִינִים לִזְכוּת וְאֵלוּ מַשְׂמְאִילִים לְחוֹבָה, וְכֵן בִּגְזֵרַת עִירִין פִּתְגָמָא וּבְמֵאמַר קַדִּישִׁין שְׁאֵלְתָא (דניאל ד'), אַף כָּאן בְּפָמַלְיָא שֶׁלוֹ נָטַל רְשׁוּת, אָמַר לָהֶם יֵשׁ בָּעֶלְיוֹנִים כִּדְמוּתִי; אִם אֵין כִּדְמוּתִי בַתַּחְתּוֹנִים הֲרֵי יֵשׁ קִנְאָה בְמַעֲשֵׂה בְרֵאשִׁית:<br><br><b>נעשה אדם.<\/b> אַעַ\"פִּ שֶׁלֹּא סִיְּעוּהוּ בִיצִירָתוֹ וְיֵשׁ מָקוֹם לַמִּינִים לִרְדּוֹת, לֹא נִמְנַע הַכָּתוּב מִלְּלַמֵּד דֶרֶך אֶרֶץ וּמִדַּת עֲנָוָה שֶׁיְּהֵא הַגָּדוֹל נִמְלָךְ וְנוֹטֵל רְשׁוּת מִן הַקָּטָן; וְאִם כָּתַב אֶעֱשֶׂה אָדָם, לֹא לָמַדְנוּ שֶׁיְּהֵא מְדַבֵּר עִם בֵּית דִינוֹ, אֶלָּא עִם עַצְמוֹ, וּתְשׁוּבַת הַמִּינִים כָּתַב בְּצִדּוֹ, וַיִּבְרָא אֶת הָאָדָם, וְלֹא כָתַב וַיִּבְרְאוּ:<br><br><b>בצלמנו.<\/b> בִּדְפוּס שֶׁלָּנוּ:<br><br><b>כדמותנו.<\/b> לְהָבִין וּלְהַשְׂכִּיל:<br><br><b>וירדו בדגת הים.<\/b> יֵשׁ בַּלָּשׁוֹן הַזֶּה לְשׁוֹן רִדּוּי וּלְשׁוֹן יְרִידָה; זָכָה, רוֹדֶה בַחַיּוֹת וּבַבְּהֵמוֹת, לֹא זָכָה, נַעֲשֶׂה יָרוּד לִפְנֵיהֶם וְהַחַיָּה מוֹשֶׁלֶת בּוֹ:", "rashi_en": "נעשה אדם WE WILL MAKE MAN — The meekness of the Holy One, blessed be He, they (the Rabbis) learned from here: because the man is in the likeness of the angels and they might envy him, therefore He took counsel with them (Midrash Tanchuma, Shemot 18 and see Genesis Rabbah 8). And when He judges the kings He likewise consults His heavenly council, for thus we find in the case of Ahab to whom Micha said, (1 Kings 22:19) “I saw the Lord sitting on His throne, and all the host of heaven standing by Him on His right hand and on His left.” Has God, then, a right hand and a left hand? But it means that some stood on the right side to plead in favour of the accused and others stood on the left side to accuse; and similarly we read (Daniel 4:14), “the matter is by the decree of the watchers, and the sentence by the word of the holy ones”, — here, also, He consulted His heavenly council and asked permission of them, saying to them: “There are in the heavens beings after My likeness; if there will not be on earth also beings after My likeness, there will be envy among the beings that I have created” (Sanhedrin 38b).<br><br>נעשה אדם WE WILL MAKE MAN — Although they did not assist Him in forming him (the man) and although this use of the plural may give the heretics an occasion to rebel (i. e. to argue in favour of their own views), yet the verse does not refrain from teaching proper conduct and the virtue of humbleness, namely, that the greater should consult, and take permission from the smaller; for had it been written, “I shall make man”, we could not, then, have learned that He spoke to His judicial council but to Himself. And as a refutation of the heretics it is written immediately after this verse “And God created the man”, and it is not written “and they created” (Genesis Rabbah 8:9)<br><br>בצלמנו IN OUR IMAGE — in our type.<br><br>כדמתנו AFTER OUR LIKENESS — with the power to comprehend and to discern.<br><br>וירדו בדגת הים AND THEY SHALL HAVE DOMINION OVER THE FISH … [AND OVER THE BEASTS] — The expression וירדו may imply dominion as well as descending — if he is worthy he dominates over the beasts and cattle, if he is not worthy he will sink lower than them, and the beast will rule over him (Genesis Rabbah 8:12)."}, {"ch": 1, "v": 27, "aliyah": 1, "heb": "וַיִּבְרָ֨א אֱלֹהִ֤ים&thinsp;<small>׀<\/small>&thinsp;אֶת־הָֽאָדָם֙ בְּצַלְמ֔וֹ בְּצֶ֥לֶם אֱלֹהִ֖ים בָּרָ֣א אֹת֑וֹ זָכָ֥ר וּנְקֵבָ֖ה בָּרָ֥א אֹתָֽם׃", "onk": "וּבְרָא יְיָ יָת אָדָם בְּצַלְמֵהּ בְּצַלְמָא דַיְיָ בְּרָא יָתֵהּ דְּכַר וְנוּקְבָא בְּרָא יָתְהוֹן:", "onk_en": "And thus Elohim created man in his image. In the form of Elohim, He created him, male and female, He created them.", "pj": "וּבְרָא יְיָ יַת אָדָם בִּדְיוּקְנֵיהּ בְּצַלְמָא יְיָ בְּרָא יָתֵיהּ בְּמָאתָן וְאַרְבְּעִין וּתְמַנֵי אֵיבָרִין בִּתְלַת מְאָה וְשִׁיתִּין וְחַמְשָׁא גִידִין וּקְרַם עֲלוֹי מוֹשְׁכָא וּמְלֵי יָתֵיהּ בִּסְרָא וְאִידְמָא דְכַר וְנוּקְבָא בְגַוְהוֹן בְּרָא יַתְהוֹן", "pj_en": "And the Lord created man in His Likeness: In the image of the Lord He created him, with two hundred and forty and eight members, with three hundred and sixty and five nerves, and overlaid them with skin, and filled it with flesh and blood. Male and female in their bodies He created them.", "tj": "וּבְרָא מֵימְרָא דַיְיָ יַת אָדָם בִּדְמוּתֵיהּ בִּדְמוּת מִן קֳדָם יְיָ בְּרָא יָתֵיהּ דְכַר וְזוּגֵיהּ בְּרָא יַתְהוֹן:", "tj_en": "And the Word of the Lord created man in His likeness, in the likeness of the presence of the Lord He created him, the male and his yoke-fellow He created them.", "rashi": "<b>ויברא אלהים את האדם בצלמו.<\/b> בִּדְפוּס הֶעָשׂוּי לוֹ, שֶׁהַכֹּל נִבְרָא בְּמַאֲמָר וְהוּא נִבְרָא בַּיָּדַיִם, שֶׁנֶּאֱמַר וַתָּשֶׁת עָלַי כַּפֶּכָה (תהילים קל\"ט); נַעֲשָׂה בְחוֹתָם כְּמַטְבֵּעַ הָעֲשׂוּיָה עַל יְדֵי רֹשֶׁם שֶׁקּוֹרִין קוי\"ן בלע\"ז וְכֵן הוּא אוֹמֵר תִּתְהַפֵּךְ כְּחֹמֶר חוֹתָם (איוב ל\"ח):<br><br><b>בצלם אלהים ברא אותו.<\/b> פֵּרֵשׁ לְךָ שֶׁאוֹתוֹ צֶלֶם הַמְתֻקָּן לוֹ, צֶלֶם דְּיוֹקַן יוֹצְרוֹ הוּא:<br><br><b>זכר ונקבה ברא אותם.<\/b> וּלְהַלָּן הוּא אוֹמֵר וַיִּקַּח אַחַת מִצַּלְעֹתָיו וגו' (בראשית ב')? מִדְרַשׁ אַגָּדָה שֶׁבְּרָאוֹ שְׁנֵי פַרְצוּפִים בִּבְרִיאָה רִאשׁוֹנָה, וְאַחַר כָּךְ חֲלָקוֹ. וּפְשׁוּטוֹ שֶׁל מִקְרָא, כָּאן הוֹדִיעֲךָ שֶׁנִּבְרְאוּ שְׁנֵיהֶם בַּשִּׁשִּׁי וְלֹא פֵי' לְךָ כֵּיצַד בְּרִיָּתָן, וּפֵרֵשׁ לְךָ בְּמָקוֹם אַחֵר:", "rashi_en": "ויברא אלהים את האדם בצלמו SO GOD CREATED THE MAN IN HIS IMAGE —in the type that was specially made for him, for everything else was created by a creative fiat, whilst he was brought into existence by a creative act (literally, by hand), as it is said (Psalms 139:5) “And Thou hast laid thy hand upon me.” He was made by a seal as a coin that is made by a die that is called in old French coin. It is similarly said, (Job 38:14) “it is changed as clay under the seal” (Sanhedrin 38a).<br><br>בצלם אלהים ברא אותו IN THE IMAGE OF GOD CREATED HE HIM — It explains to you that the form prepared for him was the form of the image of his Creator.<br><br>זכר ונקבה ברא אותם MALE AND FEMALE CREATED HE THEM — And further on (Genesis 2:21) it is said: “and He took one of his ribs etc.” (The two passages appear to be contradictory.) But according to a Midrashic explanation,  He created him at first with two faces, and afterwards He divided him. But the real sense of the verse is: here it tells you that both of them were created on the sixth day, but it does not explain to you how their creation took place; this it explains to you in another place (Genesis Rabbah 8:1 and see Eruvin 18a) . "}, {"ch": 1, "v": 28, "aliyah": 1, "heb": "וַיְבָ֣רֶךְ אֹתָם֮ אֱלֹהִים֒ וַיֹּ֨אמֶר לָהֶ֜ם אֱלֹהִ֗ים פְּר֥וּ וּרְב֛וּ וּמִלְא֥וּ אֶת־הָאָ֖רֶץ וְכִבְשֻׁ֑הָ וּרְד֞וּ בִּדְגַ֤ת הַיָּם֙ וּבְע֣וֹף הַשָּׁמַ֔יִם וּבְכׇל־חַיָּ֖ה הָֽרֹמֶ֥שֶׂת עַל־הָאָֽרֶץ׃", "onk": "וּבָרִיךְ יָתְהוֹן יְיָ וַאֲמַר לְהוֹן יְיָ פּוּשׁוּ וּסְגוּ וּמְלוּ יָת אַרְעָא וּתְקוּפוּ עֲלַהּ וּשְׁלוּטוּ בְּנוּנֵי יַמָּא וּבְעוֹפָא דִּשְׁמַיָּא וּבְכָל חַיְתָא דְּרָחֵשָׁא עַל אַרְעָא:", "onk_en": "Elohim blessed them, and Elohim said to them, Be fruitful and multiply, fill the earth and subdue it, and dominate the fish of the sea, the birds of the heaven, and every living thing that moves upon the earth.", "pj": "וּבְרִיךְ יַתְהוֹן יְיָ וַאֲמַר לְהוֹן יְיָ פּוּשׁוּ וּסְגוּ וּמְלוּ יַת אַרְעָא בְּנִין וּבְנָן וּתְקוּפוּ עֲלָהּ בְּנִכְסִין וּשְׁלוּטוּ בְּכַוְורֵי יַמָא וּבְעוֹפָא דִשְׁמַיָא וּבְכָל רִיחֲשָׁא חַיְיתָא דְרַחֲשָׁא עֲלוֹי אַרְעָא", "pj_en": "And He blessed them, and the Lord said to them, Increase and multiply, and fill the earth with sons and daughters, and prevail over it, in its possessions; and have dominion over the fish of the sea and over the fowl of the heavens, and over every creeping animal that creepeth upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>וכבשה.<\/b> חָסֵר וָי\"ו לְלַמֶּדְךָ שֶׁהַזָּכָר כּוֹבֵשׁ אֶת הַנְּקֵבָה, שֶׁלֹּא תְהֵא יַצְאָנִית, וְעוֹד לְלַמֶּדְךָ שֶׁהָאִישׁ שֶׁדַּרְכּוֹ לִכְבֹּשׁ מְצֻוֶּה עַל פְּרִיָּה וּרְבִיָּה וְלֹא הָאִשָּׁה:", "rashi_en": "וכבשה AND SUBDUE IT — The word lacks a ו after the ש so that it may be read as meaning: and subdue her (i. e. the woman), thereby teaching you that the male controls the female in order that she may not become a gad-about; teaching you also that to the man, whose nature is to master, was given the Divine command to have issue, and not to the woman (Yevamot 65b). "}, {"ch": 1, "v": 29, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֱלֹהִ֗ים הִנֵּה֩ נָתַ֨תִּי לָכֶ֜ם אֶת־כׇּל־עֵ֣שֶׂב&thinsp;<b>׀<\/b> זֹרֵ֣עַ זֶ֗רַע אֲשֶׁר֙ עַל־פְּנֵ֣י כׇל־הָאָ֔רֶץ וְאֶת־כׇּל־הָעֵ֛ץ אֲשֶׁר־בּ֥וֹ פְרִי־עֵ֖ץ זֹרֵ֣עַ זָ֑רַע לָכֶ֥ם יִֽהְיֶ֖ה לְאׇכְלָֽה׃", "onk": "וַאֲמַר יְיָ הָא יְהָבִית לְכוֹן יָת כָּל עִסְבָּא דְּבַר זַרְעֵהּ מִזְדְּרַע דִּי עַל אַפֵּי כָל אַרְעָא וְיָת כָּל אִילָנָא דִּי בֵהּ פֵּירֵי אִילָנָא דְּבַר זַרְעֵהּ מִזְדְּרָע לְכוֹן יְהֵא לְמֵיכָל:", "onk_en": "Elohim said, Behold, I have given you all seed-yielding herbs that are on the surface of the earth, and every tree that has seed-yielding fruit; to you it shall be for food.", "pj": "וַאֲמַר יְיָ הָא יְהָבִית לְכוֹן יַת כָּל עִיסְבָּא דְבִיזְרֵיהּ מִזְדְרַע דְעִילוֹי אַנְפֵּי כָּל אַרְעָא וְיַת כָּל אִילָנֵי סְרָקָא לִצְרוֹךְ בִּנְיָינָא וּלְאַסָקוּתָא וּדְבֵיהּ פֵּירֵיהּ אִלָנָא דְבִזְרֵיהּ מִזְדְרַע לְכוֹן יְהֵי לְמֵיכָל", "pj_en": "And the Lord said, Behold, I have given you every herb whose seed seedeth upon the face of all the earth, and every unfruitful tree for the need of building and for burning; and the tree in which is fruit seeding after its kind, to you it shall be for food.", "tj": "", "tj_en": "", "rashi": "<b>לכם יהיה לאכלה ולכל חית הארץ.<\/b> הִשְׁוָה לָהֶם בְּהֵמוֹת וְחַיּוֹת לְמַאֲכָל, וְלֹא הִרְשָׁה לְאָדָם וּלְאִשְׁתּוֹ לְהָמִית בְּרִיָּה וְלֶאֱכֹל בָּשָׂר, אַךְ כָּל יֶרֶק עֵשֶׂב יֹאכְלוּ יַחַד כֻּלָם, וּכְשֶׁבָּאוּ בְנֵי נֹחַ הִתִּיר לָהֶם בָּשָׂר, שֶׁנֶאֱמַר כָּל רֶמֶשׂ אֲשֶׁר הוּא חַי וְגוֹ' כְּיֶרֶק עֵשֶׂב שֶׁהִתַּרְתִּי לְאָדָם הָרִאשׁוֹן נָתַתִּי לָכֶם אֶת כֹּל:", "rashi_en": "ולכל חית הארץ AND TO EVERY BEAST OF THE EARTH — Scripture places cattle and beasts on a level with them (human beings: that is, it places all alike in the same category) with regard to food, and did not permit Adam to kill any creature and eat its flesh, but all alike were to eat herbs. But when the era of the “Sons of Noah” began He permitted them to eat meat, for it is said, (Genesis 9:3) “every moving thing that lives should be for food for yourselves … “even as the herb” that I permitted to the first man, so do “I give to you everything” (Sanhedrin 59b). "}, {"ch": 1, "v": 30, "aliyah": 1, "heb": "וּֽלְכׇל־חַיַּ֣ת הָ֠אָ֠רֶץ וּלְכׇל־ע֨וֹף הַשָּׁמַ֜יִם וּלְכֹ֣ל&thinsp;<b>׀<\/b> רוֹמֵ֣שׂ עַל־הָאָ֗רֶץ אֲשֶׁר־בּוֹ֙ נֶ֣פֶשׁ חַיָּ֔ה אֶת־כׇּל־יֶ֥רֶק עֵ֖שֶׂב לְאׇכְלָ֑ה וַֽיְהִי־כֵֽן׃", "onk": "וּלְכָל חֵוַת אַרְעָא וּלְכָל עוֹפָא דִּשְׁמַיָּא וּלְכֹל דְּרָחֵשׁ עַל אַרְעָא דִּי בֵהּ נַפְשָׁא חַיְתָא יָת כָּל יְרוֹק עִסְבָּא לְמֵיכָל וַהֲוָה כֵן:", "onk_en": "And for every animal of the earth, for every bird of the heaven, and for everything that creeps on the ground, in which there is a living spirit, all vegetational herbs shall be [their] food. And it was so.", "pj": "וּלְכָל חֵיוַת אַרְעָא וּלְכָל עוֹפָא דִשְׁמַיָא וּלְכָל דְרָחִישׁ עַל אַרְעָא דְבֵיהּ נַפְשָׁא חַיְיתָא יַת כָּל יְרוֹקֵי עִסְבִּין וַהֲוָה כֵן", "pj_en": "But to every beast of the earth, and to every fowl of the heavens, and to every reptile upon the earth in which is the living soul, (I have given) all green herbs. And it was so.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 31, "aliyah": 1, "heb": "וַיַּ֤רְא אֱלֹהִים֙ אֶת־כׇּל־אֲשֶׁ֣ר עָשָׂ֔ה וְהִנֵּה־ט֖וֹב מְאֹ֑ד וַֽיְהִי־עֶ֥רֶב וַֽיְהִי־בֹ֖קֶר י֥וֹם הַשִּׁשִּֽׁי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַחֲזָא יְיָ יָת כָּל דִּי עֲבַד וְהָא <b>תַקִּין לַחֲדָא<\/b> וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם שְׁתִיתָאִי:", "onk_en": "Elohim saw all that He had made, and behold it was very good [<b>completely prepared<\/b>]. It became evening and it became morning, the sixth day.", "pj": "וַחֲזָא יְיָ יַת כָּל דְעָבַד וַהֲוָה טַב לַחֲדָא וַהֲוָה רְמַשׁ וַהֲוָה צְפַר יוֹם שְׁתִיתָאֵי", "pj_en": "And the Lord beheld every thing He had made, and it was very good. And it was evening, and it was morning, the Sixth Day.", "tj": "", "tj_en": "", "rashi": "<b>יום הששי.<\/b> הוֹסִיף ה' בַּשִּׁשִּׁי בִגְמַר מַעֲשֵׂה בְרֵאשִׁית, לוֹמַר שֶׁהִתְנָה עִמָּהֶם, עַל מְנָת שֶׁיְּקַבְּלוּ עֲלֵיהֶם יִשְׂרָאֵל חֲמִשָּׁה חֻמְּשֵׁי תוֹרָה. דָּבָר אַחֵר יוֹם הַשִּׁשִּׁי, כֻּלָּם תְּלוּיִם וְעוֹמְדִים עַד יוֹם הַשִּׁשִּׁי, הוּא ו' בְּסִיוָן הַמּוּכָן לְמַתַּן תּוֹרָה:", "rashi_en": "יום הששי THE SIXTH DAY — The letter ה, the numerical value of which is 5, is added to the word ששי when the work of Creation was complete, to imply that He made a stipulation with them that it endures only upon condition that Israel should accept the five books of the Torah (Shabbat 88a). Another interpretation of יום הששי THE SIXTH DAY — The whole Creation (the Universe) stood in a state of suspense (moral imperfection) until the sixth day — that is, the sixth day of Sivan which was destined to be the day when the Torah would be given to Israel (Avodah Zara 3a)."}, {"ch": 2, "v": 1, "aliyah": 1, "heb": "וַיְכֻלּ֛וּ הַשָּׁמַ֥יִם וְהָאָ֖רֶץ וְכׇל־צְבָאָֽם׃", "onk": "וְאִשְׁתַּכְלָלוּ שְׁמַיָּא וְאַרְעָא וְכָל חֵילֵיהוֹן:", "onk_en": "The heavens and the earth were completed, and [so were] all their conglomerations.", "pj": "וּשְׁלִימוּ בִּרְיָיתֵי שְׁמַיָא וְאַרְעָא וְכָל חֵלְוַותְהוֹן", "pj_en": "And the creatures of the heavens and earth, and all the hosts of them, were completed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 2, "aliyah": 1, "heb": "וַיְכַ֤ל אֱלֹהִים֙ בַּיּ֣וֹם הַשְּׁבִיעִ֔י מְלַאכְתּ֖וֹ אֲשֶׁ֣ר עָשָׂ֑ה וַיִּשְׁבֹּת֙ בַּיּ֣וֹם הַשְּׁבִיעִ֔י מִכׇּל־מְלַאכְתּ֖וֹ אֲשֶׁ֥ר עָשָֽׂה׃", "onk": "וְשֵׁיצֵי יְיָ בְּיוֹמָא שְׁבִיעָאָה עֲבִדְתֵּהּ דִּי עֲבָד וְנַח בְּיוֹמָא שְׁבִיעָאָה מִכָּל עֲבִדְתֵּהּ דִּי עֲבָד:", "onk_en": "Elohim completed by the seventh day His work which He had made, and He abstained on the seventh day from all His work which He had made.", "pj": "וּשְׁלִים יְיָ בְּיוֹמָא שְׁבִיעָאָה עֲבִידְתֵּיהּ דְעָבַד וְעִישַרְתֵּי עִיסְקִין דִבְרָא בֵּינֵי שִׁמְשְׁתָא וְנַח בְּיוֹמָא שְׁבִיעָאָה מִכָּל עֲבִידְתֵּיהּ דְעָבָד", "pj_en": "And the Lord had finished by the Seventh Day the work which He had wrought, and the ten formations which He had created between the suns; and He rested the Seventh Day from all His works which He had performed.", "tj": "", "tj_en": "", "rashi": "<b>ויכל אלהים ביום השביעי.<\/b> ר' שִׁמְעוֹן אוֹמֵר בָּשָׂר וָדָם, שֶׁאֵינוֹ יוֹדֵעַ עִתָּיו וּרְגָעָיו צָרִיך לְהוֹסִיף מֵחֹל עַל הַקֹּדֶשׁ, הַקָּבָּ\"ה שֶׁיּוֹדֵעַ עִתָּיו וּרְגָעָיו, נִכְנָס בֹּו כְּחוּט הַשַּׂעֲרָה, וְנִרְאֶה כְאִלּוּ כִלָּה בוֹ בַיֹּום. דָּ\"אַ מֶה הָיָה הָעוֹלָם חָסֵר? מְנוּחָה, בָּאת שַׁבָּת בָּאת מְנוּחָה, כָּלְתָה וְנִגְמְרָה הַמְּלָאכָה:", "rashi_en": "ויכל אלהים ביום השביעי AND ON THE SEVENTH DAY GOD FINISHED — R. Simeon says: A human being (literally, flesh and blood) who cannot know exactly his times and moments (who cannot accurately determine the point of time that marks the division between one period and that which follows it) must needs add from the week-day and observe it as the holy day (the Sabbath), but the Holy One, blessed be He, who knows His times and moments, began it (the seventh day) to a very hair’s breadth (with extreme exactness) and it therefore appeared as though He had completed His work on that very day (Genesis Rabbah 10:9). Another explanation: What did the world lack? Rest! Sabbath came — Rest came; and the work was thus finished and completed (Genesis Rabbah 10:9)! "}, {"ch": 2, "v": 3, "aliyah": 1, "heb": "וַיְבָ֤רֶךְ אֱלֹהִים֙ אֶת־י֣וֹם הַשְּׁבִיעִ֔י וַיְקַדֵּ֖שׁ אֹת֑וֹ כִּ֣י ב֤וֹ שָׁבַת֙ מִכׇּל־מְלַאכְתּ֔וֹ אֲשֶׁר־בָּרָ֥א אֱלֹהִ֖ים לַעֲשֽׂוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבָרִיךְ יְיָ יָת יוֹמָא שְׁבִיעָאָה וְקַדִּישׁ יָתֵהּ אֲרֵי בֵהּ נַח מִכָּל עֲבִדְתֵּהּ דִּי בְרָא  יְיָ לְמֶעְבַּד:", "onk_en": "Elohim blessed the seventh day and sanctified it, for on it He abstained from all His work, which Elohim had created to do.", "pj": "וּבְרִיךְ יְיָ יַת יוֹמָא שְׁבִיעָאָה מִן כּוּלְהוֹן יוֹמֵי שְׁבִיעָתָא וְקַדִישׁ יָתֵיהּ אֲרוּם בֵּיהּ נחַ מִכָּל עֲבִידְתֵּיהּ דִבְרָא יְיָ וְעָתִיד לְמֶעֱבָד", "pj_en": "And the Lord blessed the Seventh Day more than all the days of the week, and sanctified it, because in it He rested from all His works which the Lord had created and had willed to make.", "tj": "", "tj_en": "", "rashi": "<b>ויברך, ויקדש.<\/b> בֵּרְכוֹ בַּמָּן, שֶׁכָּל יְמוֹת הַשָּׁבוּעַ יוֹרֵד לָהֶם עֹמֶר לַגֻּלְגֹּלֶת, וּבַשִּׁשִּׁי לֶחֶם מִשְׁנֶה, וְקִדְּשׁוֹ בַּמָּן, שֶׁלֹּא יָרַד כְּלָל בְּשַׁבָּת, וְהַמִּקְרָא כָּתוּב עַל הֶעָתִיד:<br><br><b>אשר ברא אלהים לעשות.<\/b> הַמְּלָאכָה שֶׁהָיְתָה רְאוּיָה לֵעָשׂוֹת בַּשַּׁבָּת, כָּפַל וַעֲשָׂאָהּ בַּשִּׁשִּׁי כְּמוֹ שֶׁמְּפֹרָשׁ בְּב\"ר:", "rashi_en": "ויברך … ויקדש AND GOD BLESSED … AND HE SANCTIFIED — He blessed it through the Manna, that on all other days of the week there should fall for them (the Israelites) an Omer for each person, whereas on the sixth day there should fall twice as much of that bread. So, too, He sanctified it through the Manna, that it should not fall at all on the Sabbath (Genesis Rabbah 11:2). This verse is written here with reference to what would happen in the future.<br><br>אשר ברא אלהים לעשות WHICH GOD IN CREATING HAD MADE — The work which should have been done on the Sabbath He did in the double work which He executed on the sixth day, as it is explained in Genesis Rabbah 11:9."}, {"ch": 2, "v": 4, "aliyah": 2, "heb": "אֵ֣לֶּה תוֹלְד֧וֹת הַשָּׁמַ֛יִם וְהָאָ֖רֶץ בְּ<small>הִ<\/small>בָּֽרְאָ֑ם בְּי֗וֹם עֲשׂ֛וֹת יְהֹוָ֥ה אֱלֹהִ֖ים אֶ֥רֶץ וְשָׁמָֽיִם׃", "onk": "אִלֵּין תּוּלְדַת שְׁמַיָּא וְאַרְעָא כַּד אִתְבְּרִיאוּ בְּיוֹמָא דִּי עֲבַד יְיָ אֱלֹהִים אַרְעָא וּשְׁמַיָּא:", "onk_en": "This is the history of the heavens and the earth when they were created, on the day when Adonoy Elohim made earth and heaven.", "pj": "אִלֵין תּוּלְדַת שְׁמַיָא וְאַרְעָא כַּד אִיתְבְּרִיאוּ בְּיוֹמָא דְעָבַד יְיָ אֱלהִים אַרְעָא וּשְׁמַיָא", "pj_en": "These are the geneses of the heavens and earth when they were created in the day that the Lord God made the earth and heavens.", "tj": "", "tj_en": "", "rashi": "<b>אלה.<\/b> הָאֲמוּרִים לְמַעְלָה:<br><br><b>תולדות השמים והארץ בהבראם ביום עשות ה'.<\/b> לִמֶּדְךָ שֶׁכֻּלָּם נִבְרְאוּ בָרִאשׁוֹן. דָּבָר אַחֵר בְּהִבָּרְאָם, בְּה' בְרָאָם, שֶׁנ' בְיָהּ ה' צוּר עוֹלָמִים (ישעיהו כ\"ו), בְּב' אוֹתִיוֹת הַלָּלוּ שֶׁל הַשֵּׁם יָצַר שְׁנֵי עוֹלָמִים, וְלִמֶּדְךָ כָאן שֶׁהָעוֹלָם הַזֶּה נִבְרָא בְהֵ\"א, רֶמֶז שֶׁיָּרְדוּ לְמַטָּה לִרְאוֹת שַׁחַת כְּהֵ\"א זֹאת שֶׁסְּתוּמָה מִכָּל צְדָדִים וּפְתוּחָה לְמַטָּה לָרֶדֶת דֶּרֶךְ שָׁם:", "rashi_en": "אלה THESE [ARE THE GENERATIONS] — “These” means those that are mentioned above.<br><br>‘תולדות השמים והארץ בהבראם ביום עשות ה THESE ARE THE PRODUCTIONS OF THE HEAVEN AND OF THE EARTH WHEN THEY WERE CREATED, IN THE DAY THE LORD GOD MADE EARTH AND HEAVEN — The verse teaches you that all of them (the productions of heaven and earth) were created on the first day when God made earth and heaven. Another explanation of the word בהבראם: It may be divided as בה' בראם He created them with the letter ‘ה, as it is said, (Isaiah 26:4) כי ביה ה' צור עולמים “For in Jah, the Lord, is the rock of worlds”, which may be explained to mean (taking צור in sense of Former, Creator) “for by means of ב these two letters י ה of the Divine Name (יהוה) God formed the two worlds” (Menachot 29b), and this verse teaches that this world was created by means of the ‘ה — a suggestion that all created beings must descend to the nether world “to behold the pit” — the world being like this letter ‘ה , which is closed on all sides but open at the bottom, thus giving a way by which they must descend."}, {"ch": 2, "v": 5, "aliyah": 2, "heb": "וְכֹ֣ל&thinsp;<b>׀<\/b> שִׂ֣יחַ הַשָּׂדֶ֗ה טֶ֚רֶם יִֽהְיֶ֣ה בָאָ֔רֶץ וְכׇל־עֵ֥שֶׂב הַשָּׂדֶ֖ה טֶ֣רֶם יִצְמָ֑ח כִּי֩ לֹ֨א הִמְטִ֜יר יְהֹוָ֤ה אֱלֹהִים֙ עַל־הָאָ֔רֶץ וְאָדָ֣ם אַ֔יִן לַֽעֲבֹ֖ד אֶת־הָֽאֲדָמָֽה׃", "onk": "וְכֹל אִילָנֵי חַקְלָא עַד לָא הֲווּ בְאַרְעָא וְכָל עִסְבָּא דְחַקְלָא עַד לָא צְמָח אֲרֵי לָא <b>אָחִית<\/b> מִטְרָא יְיָ אֱלֹהִים עַל אַרְעָא וְאֱנַשׁ לֵית לְמִפְלַח יָת אַדְמְתָא:", "onk_en": "All the plants of the field were not yet on the earth, and all the herbal vegetation of the field had not yet sprouted, for Adonoy Elohim had not brought rain [<b>down<\/b>] upon the earth, and there was [yet] no man to work the soil.", "pj": "וְכָל אִילָנֵי חַקְלָא עַד כְּדוֹ לָא הֲווֹ בְּאַרְעָא וְכָל עִסְבֵּי חַקְלָא עַד כְּדוֹ לָא צָמַח אֲרוּם לָא אִמְטַר יְיָ אֱלהִים עַל אַרְעָא וְאֵינַשׁ לַיית לְמִפְלַח יַת אַדְמָתָא", "pj_en": "And all the trees of the field were not as yet in the earth, and all the herbs of the field had not as yet germinated, because the Lord God had not made it to rain upon the earth, and man was not to cultivate the ground.", "tj": "", "tj_en": "", "rashi": "<b>טרם יהיה בארץ.<\/b> כָּל טֶרֶם שֶׁבַּמִּקְרָא לְשׁוֹן עַד לֹא הוּא, וְאֵינוֹ לְשׁוֹן קֹדֶם, וְאֵינוֹ נִפְעָל לוֹמַר הִטְרִ
