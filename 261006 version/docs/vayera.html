<!DOCTYPE html>

<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "vayera";
const DATA = [{"ch": 18, "v": 1, "aliyah": 1, "heb": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה בְּאֵלֹנֵ֖י מַמְרֵ֑א וְה֛וּא יֹשֵׁ֥ב פֶּֽתַח־הָאֹ֖הֶל כְּחֹ֥ם הַיּֽוֹם׃", "onk": "<b>וְאִתְגְּלִי<\/b> לֵיהּ יְיָ <b>בְּמֵשְׁרֵי<\/b> מַמְרֵא וְהוּא יָתֵב בִּתְרַע מַשְׁכְּנָא כְּמֵיחַם יוֹמָא:", "onk_en": "Adonoy appeared [<b>became revealed<\/b>] to him in the groves [<b>plains<\/b>] of Mamrei and he was sitting at the door of the tent in the heat of the day.", "pj": "וירא וְאִתְגְלֵי עֲלוֹהִי יְקָרָא דַיְיָ בְּחֵיזְוֵי מַמְרֵא וְהוּא מְרַע מִכֵּיבָא דִמְהוּלְתָּא יָתִיב תְּרַע מַשְׁכְּנָא לְתוּקְפָא דְיוֹמָא", "pj_en": "AND the glory of the Lord was revealed to him in the valley of Mamre; and he, being ill from the pain of circumcision, sat at the door of the tabernacle in the fervour (or strength) of the day.", "tj": "", "tj_en": "", "rashi": "<b>וירא אליו.<\/b> לְבַקֵּר אֶת הַחוֹלֶה. אָמַר רַבִּי חָמָא בַּר חֲנִינָא, יוֹם שְׁלִישִׁי לְמִילָתוֹ הָיָה, וּבָא הַקָּבָּ\"ה וְשָׁאַל בִּשְׁלוֹמוֹ (בבא מציעא פ\"ו):<br><br><b>באלוני ממרא.<\/b> הוּא שֶׁנָּתַן לוֹ עֵצָה עַל הַמִּילָה, לְפִיכָךְ נִגְלָה עָלָיו בְּחֶלְקוֹ (בראשית רבה):<br><br><b>יושב.<\/b> ישב כְּתִיב, בִּקֵּשׁ לַעֲמֹד, אָמַר לוֹ הַקָּבָּ\"ה שֵׁב וַאֲנִי אֶעֱמֹד, וְאַתָּה סִימָן לְבָנֶיךָ שֶׁעָתִיד אֲנִי לְהִתְיַצֵּב בַּעֲדַת הַדַּיָּנִים וְהֵן יוֹשְׁבִין, שֶׁנֶּאֱמַר אֱלֹהִים נִצָּב בַּעֲדַת אֵל (תהילים פ\"ב) (בראשית רבה):<br><br><b>פתח האהל.<\/b> לִרְאוֹת אִם יֵשׁ עוֹבֵר וָשָׁב וְיַכְנִיסֵם בְּבֵיתוֹ:<br><br><b>כחום היום.<\/b> הוֹצִיא הַקָבָּ\"ה חַמָּה מִנַּרְתִּיקָהּ, שֶׁלֹּא לְהַטְרִיחוֹ בְּאוֹרְחִים, וּלְפִי שֶׁרָאָהוּ מִצְטַעֵר שֶׁלֹּא הָיוּ אוֹרְחִים בָּאִים, הֵבִיא הַמַּלְאָכִים עָלָיו בִּדְמוּת אֲנָשִׁים (בבא מציעא שם):", "rashi_en": "וירא אליו AND THE LORD APPEARED UNTO HIM to visit the sick man. R. Hama the son of Hanina said: it was the third day after his circumcision and the Holy One, blessed be He, came and enquired after the state of his health (Bava Metzia 86b)<br><br>באלוני ממרא BY THE TEREBINTHS OF MAMRÉ — It was he (Mamre) who advised him (Abraham) regarding the circumcision and therefore He revealed himself to him in his (Mamre’s) territory (Genesis Rabbah 42:8). <br><br>literally, יֹשֵׁב WAS SITTING — The word is written ישב (without the ו) and therefore may be translated “he sat”: He wished to rise, but the Holy One, blessed be He, said to him, Sit and I will stand. You shall form an example to your descendants — that I, in time to come, will stand in the assembly of the judges while they will sit, as it is said, (Psalms 82:1) “God standeth in the assembly of the judges” (Genesis Rabbah 48:7)<br><br>פתח האהל AT THE TENT-DOOR — that he might see whether anyone passed by, and invite him into the house<br><br>כחום היום IN THE HEAT OF THE DAY — The Holy One, blessed be He, brought the sun out of its sheath that he might not be troubled by travellers, and when He perceived that he was grieved that no travellers came He brought to him angels in the form of men (Bava Metzia 86b). "}, {"ch": 18, "v": 2, "aliyah": 1, "heb": "וַיִּשָּׂ֤א עֵינָיו֙ וַיַּ֔רְא וְהִנֵּה֙ שְׁלֹשָׁ֣ה אֲנָשִׁ֔ים נִצָּבִ֖ים עָלָ֑יו וַיַּ֗רְא וַיָּ֤רׇץ לִקְרָאתָם֙ מִפֶּ֣תַח הָאֹ֔הֶל וַיִּשְׁתַּ֖חוּ אָֽרְצָה׃", "onk": "וּזְקַף עֵינוֹהִי וַחֲזָא וְהָא תְּלָתָא גֻבְרִין (<small>נ\"י<\/small> גַבְרִין) קָיְמִין עִלָּווֹהִי וַחֲזָא וּרְהַט לְקַדָּמוּתְהוֹן מִתְּרַע מַשְׁכְּנָא וּסְגִיד עַל אַרְעָא:", "onk_en": "He lifted his eyes and saw, and behold three men were standing over him. He saw [them], and ran from the door of the tent to greet them, and he bowed down to the earth.", "pj": "וּזְקַף עֵינוֹי וְחָמָא וְהָא תְלָתָא מַלְאָכִין בִּדְמוּת גוּבְרִין קַיְימִין קוֹמוֹי דְאִשְׁתַּלְחוּ לִצְרוֹךְ תְּלַת מִילַיָא אֲרוּם לֵית אַוְשַׁר לְמַלְאָכָא דְשֵׁירוּתָא דְמִשְׁתַּלֵיחָא לְיַתִּיר מִן מִילָא חַד חַד אָתָא לִמְבַשְרָא יָתֵיהּ דְהָא שָרָה יָלְדָה בַּר זָכָר וְחַד אָתָא לְמִישֵׁזְבָא יַת לוֹט וְחַד אָתָא לְמֵיהֲפַךְ יַת סְדוֹם וְיַת עֲמוֹרָה וְכַד חָמִינוּן רָהַט לִקְדָמוּתְהוֹן מִתְּרַע מַשְׁכְּנָא וּסְגִיד עַל אַרְעָא", "pj_en": "And he lifted up his eyes and looked, and, behold, three angels in the resemblance of men were standing before him; (angels) who had been sent from the necessity of three things;--because it is not possible for a ministering angel to be sent for more than one purpose at a time;--one, then, had come to make known to him that Sarah should bear a man-child; one had come to deliver Lot; and one to overthrow Sedom and Amorah. And when he saw them, he ran to meet them from the door of the tent, and bowed himself on the earth.", "tj": "תְּלָתָא מַלְאָכַיָא אִשְׁתַּלְחוּ לְוַת אֲבוּנָן אַבְרָהָם וּתְלָתֵיהוֹן אִשְׁתַּלְחִין לִתְלַת מִילִין אֲרוּם לֵית אֶפְשָׁר לְחָד מִן מַלְאֲכֵי מְרוֹמָא דְיִשְׁתַּלַח בִּידֵיהּ יַתִּיר מִן מִילָה חֲדָא מַלְאָכָא קַדְמָאָה אִשְׁתַּלַח לְבַשְרָא לְאָבוּנָא אַבְרָהָם דְהָא שָרָה יָלְדָה לְיִצְחָק מַלְאָכָא תִּינְיָנָא אִישְׁתַּלַח לְשֵׁיזְבָא יַת לוֹט מִגוֹ הֲפֵיכָתָא מַלְאָכָא תְּלִתָאָה אִשְׁתַּלַח לְמֶהְפַךְ לִסְדוֹם וַעֲמוֹרָה אַדְמָה וּצְבוֹיִם בְּגִין כֵּן הֲוָה פִּתְגָם נְבוּאָה מִן קָדָם יְיָ לְוַת אַבְרָהָם צַדִיקָא וְאִתְגְלֵי עִילוֵיהּ מֵימְרָא דַיְיָ בְּמֵישְׁרֵי חֲזוֹזָא וְהוּא הֲוָה יָתִיב בִּתְרַע מַשְׁכְּנָא מִתְחַמָם מִן גְזֵירוּתֵיהּ לְתוּקְפָא דְיוֹמָא:", "tj_en": "Three angels were sent to our father Abraham; and the three were sent for three things; because it is not possible that one of the high angels should be sent for more things than one. The first angel was sent to announce to our father Abraham, that, behold, Sarah would bear Izhak; the second angel was sent to deliver Lot from the midst of the overthrow; the third angel was sent to overthrow Sedom and Amorah, Admah and Zeboim. Therefore was there a word of prophecy from before the Lord unto Abraham the Just, and the Word of the Lord was revealed to him in the valley of vision; and he sat in the door of the tabernacle, comforting himself from his circumcision in the fervour (or strength) of the day.", "rashi": "<b>והנה שלשה אנשים.<\/b> אֶחָד לְבַשֵּׂר אֶת שָׂרָה וְאֶחָד לַהֲפֹךְ אֶת סְדוֹם וְאֶחָד לְרַפְּאוֹת אֶת אַבְרָהָם, שֶׁאֵין מַלְאָךְ אֶחָד עוֹשֶׂה שְׁתֵּי שְׁלִיחֻיּוֹת (בראשית רבה). תֵּדַע לְךָ, שֶׁכֵּן כָּל הַפָּרָשָׁה הוּא מַזְכִּירָן בִּלְשׁוֹן רַבִּים וַיֹּאכֵלוּ, וַיֹּאמְרוּ אֵלָיו, וּבַבְּשׂוֹרָה נֶאֱמַר וַיֹּאמֶר שׁוֹב אָשׁוּב אֵלֶיךָ, וּבַהֲפִיכַת סְדוֹם הוּא אוֹמֵר כִּי לֹא אוּכַל לַעֲשׂוֹת דָּבָר לְבִלְתִּי הָפְכִּי, וּרְפָאֵל שֶׁרִפֵּא אֶת אַבְרָהָם הָלַךְ מִשָּׁם לְהַצִּיל אֶת לוֹט; הוּא שֶׁנֶּאֱמַר וַיְהִי כְהוֹצִיאָם אֹתָם הַחוּצָה וַיֹּאמֶר הִמָּלֵט עַל נַפְשֶׁךָ, לָמַדְתָּ שֶׁהָאֶחָד הָיָה מַצִּיל (בראשית רבה):<br><br><b>נצבים עליו.<\/b> לְפָנָיו, אֲבָל לָשׁוֹן נְקִיָּה הוּא כְּלַפֵּי הַמַּלְאָכִים:<br><br><b>וירא.<\/b> מַהוּ וַיַּרְא וַיַּרְא שְׁתֵּי פְעָמִים? הָרִאשׁוֹן כְּמַשְׁמָעוֹ וְהַשֵּׁנִי לְשׁוֹן הֲבָנָה, נִסְתַּכֵּל שֶׁהָיוּ נִצָּבִים בְּמָקוֹם אֶחָד וְהֵבִין שֶׁלֹּא הָיוּ רוֹצִים לְהַטְרִיחוֹ, וְאַף עַל פִּי שֶׁיּוֹדְעִים הָיוּ שֶׁיֵּצֵא לִקְרָאתָם עָמְדוּ בִמְקוֹמָם לְכְבוֹדוֹ, לְהַרְאוֹתוֹ שֶׁלֹּא רָצוּ לְהַטְרִיחוֹ, וְקָדַם הוּא וְרָץ לִקְרָאתָם, בְּבָבָא מְצִיעָא, כְתִיב נִצָּבִים עָלָיו, וּכְתִיב וַיָּרָץ לִקְרָאתָם? כַּד חַזְיוּהוּ דַּהֲוָה שָׁרֵי וְאָסַר פֵּרְשׁוּ הֵימֶנּוּ, מִיָּד וַיָּרָץ לִקְרָאתָם:", "rashi_en": "והנה שלשה אנשים AND BEHOLD THREE MEN — one to announce to Sarah the birth of a son, one to overthrow Sodom, and one to cure Abraham, for one angel does not carry out two commissions (Genesis Rabbah 50:2). You may know that this is so because throughout this section it (Scripture) mentions them in the plural — “and they ate” (Genesis 18:8), “and they said unto him” (Genesis 18:9) — whilst in the case of the announcement it states, (Genesis 18:10) “And he said, I will certainly return unto thee”, and with regard to the overthrow of Sodom it says (Genesis 19:22) “For “I” cannot do anything” and (Genesis 19:21) “that “I” will not overthrow [the city]”. Raphael who healed Abraham went thence to rescue Lot; that explains what is stated (Genesis 19:17) “And it came to pass when they had brought them forth, that he said, Escape for thy life”, for you learn from this that only one of these acted as Deliverer <br><br>נצבים עליו STOOD BY, or OVER HIM — before him; only this is a more fitting expression to use of angels<br><br>וירא AND HE SAW — What does the repetition of this word וירא imply? The first time it has its ordinary meaning (“he looked”), the second that of understanding: he saw that they were standing in one spot, and so understood that they had no desire to cause him any trouble. Although they knew that he would go to meet them they nevertheless remained where they were out of respect to him and to show him that they wished to spare him trouble; he, therefore, took the initiative and ran towards them. In the Treatise Bava Metzia 86b we have the following: It is written, “they were standing by him” and it is also written “He ran towards them” — how can these apparently contradictory statements be reconciled? But the explanation is, that at first they stood by him and when they perceived that he was loosening and re-binding his bandages, they retired from him; he therefore immediately ran towards them. "}, {"ch": 18, "v": 3, "aliyah": 1, "heb": "וַיֹּאמַ֑ר אֲדֹנָ֗י אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ אַל־נָ֥א תַעֲבֹ֖ר מֵעַ֥ל עַבְדֶּֽךָ׃", "onk": "וַאֲמָר יְיָ אִם <b>כְּעַן<\/b> אַשְׁכָּחִית רַחֲמִין <b>קֳדָמָךְ<\/b> (<small>נ\"י<\/small> בְּעֵינָיךְ) לָא כְעַן תְּעִבַּר מֵעַל עַבְדָּךְ:", "onk_en": "He said, My Master, if I have found favor in Your eyes [<b>before you<\/b>], please [<b>now<\/b>] do not bypass your servant.", "pj": "וַאֲמַר בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ יְיָ אִין כְּדוֹן אַשְׁכָּחִית חִינָא קוּמָךְ לָא כְדוֹן תְּסַלֵק אִיקַר שְׁכִינְתָּךְ מֵעִילוֹי עַבְדָךְ עַד דְאֵיכְנוֹס עִיבּוּרַיָא", "pj_en": "And he said, I beseech, by the mercies (that are) before Thee, O Lord, if now I have found favour before Thee, that the glory of Thy Shekina may not now ascend from Thy servant, until I have set forth provisions", "tj": "", "tj_en": "", "rashi": "<b>ויאמר אדני אם נא וגו'.<\/b> לַגָּדוֹל שֶׁבָּהֶם אָמַר וּקְרָאָם כֻּלָּם אֲדוֹנִים וְלַגָּדוֹל אָמַר אַל נָא תַעֲבֹר, וְכֵיוָן שֶׁלֹּא יַעֲבֹר הוּא יַעַמְדוּ חֲבֵרָיו עִמּוֹ, וּבְלָשׁוֹן זֶה הוּא חֹל (שבועות ל\"ה). דָּ\"אַ קֹדֶשׁ הוּא, וְהָיָה אוֹמֵר לְהַקָּבָּ\"ה לְהַמְתִּין לוֹ עַד שֶׁיָּרוּץ וְיַכְנִיס אֶת הָאוֹרְחִים וְאַעַ\"פִּ שֶׁכָּתוּב אַחַר וַיָּרָץ לִקְרָאתָם, הָאֲמִירָה קֹדֶם לָכֵן הָיְתָה, וְדֶרֶךְ הַמִּקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ שֶׁפֵּרַשְׁתִּי אֵצֶל לֹא יָדוֹן רוּחִי בָאָדָם, שֶׁנִּכְתַּב אַחַר וַיּוֹלֶד נֹחַ, וְאִי אֶפְשַׁר לוֹמַר אֶלָּא שֶׁהָיְתָה הַגְּזֵרָה קֹדֶם לַלֵּדָה כ' שָׁנָה, וּשְׁתֵּי הַלְּשׁוֹנוֹת בִּבְ\"רַ:", "rashi_en": "'ויאמר אדני אם נא וגו AND HE SAID, MY LORD, IF NOW etc. — He addressed himself to the Chief of them; calling them all “lords”, (אדני may mean “my lords”), whilst to their Chief he said “Do not I pray thee pass away”, for he knew that if he would not pass by, his companions would certainly remain with him. In this explanation the word אדני has a “profane” sense (does not refer to God, being merely a term of address, “Sirs”) . Another explanation is that the word is “holy” (referring to God): he asked God to wait for him whilst he ran and invited the travellers. For although this is written after the words “and he ran to meet them”, yet the conversation took place beforehand. It, indeed, is the way of the Scriptures to speak in this manner as I have explained in my comment on “My spirit shall not strive” (Genesis 6:3) which is written after the passage. “And Noah begot” (Genesis 5:32) whereas it is impossible to say otherwise than that the decree of a respite of 120 years made in reference to this verse “My spirit shall not strive etc.” was twenty years before the birth of Noah’s sons.) Both these explanations of אדני are to be found in Genesis Rabbah 48:10 (see also Shevuot 35b). "}, {"ch": 18, "v": 4, "aliyah": 1, "heb": "יֻקַּֽח־נָ֣א מְעַט־מַ֔יִם וְרַחֲצ֖וּ רַגְלֵיכֶ֑ם וְהִֽשָּׁעֲנ֖וּ תַּ֥חַת הָעֵֽץ׃", "onk": "<b>יִסְּבוּן כְּעַן זְעֵיר מַיָּא<\/b> וְאַסְחוּ רַגְלֵיכוֹן וְאִסְתְּמִיכוּ תְּחוֹת אִילָנָא:", "onk_en": "Let a bit of water be brought [<b>They will take a bit of water<\/b>] and wash your feet. Rest yourselves under the tree.", "pj": "תְּחוֹת אִילָנָא", "pj_en": "{Abraham again said to these men, Let a little water be brought, and wash your feet, and recline} under the tree.", "tj": "", "tj_en": "", "rashi": "<b>יקח נא.<\/b> עַל יְדֵי שָׁלִיחַ, וְהַקָּבָּ\"ה שִׁלֵּם לְבָנָיו עַל יְדֵי שָׁלִיחַ, שֶׁנֶּאֱמַר וַיָּרֶם מֹשֶׁה אֶת יָדוֹ וַיַּךְ אֶת הַסֶּלַע (במדבר כ'):<br><br><b>ורחצו רגליכם.<\/b> כַּסָּבוּר שֶׁהֵם עַרְבִיִּים שֶׁמִּשְׁתַּחֲוִים לַאֲבַק רַגְלֵיהֶם וִהִקְפִּיד שֶׁלֹא לְהַכְנִיס עֲ\"זָ לְבֵיתוֹ; אֲבָל לוֹט שֶׁלֹּא הִקְפִּיד, הִקְדִּים לִינָה לִרְחִיצָה, שֶׁנֶּאֱמַר וְלִינוּ וְרַחֲצוּ רַגְלֵיכֶם:<br><br><b>תחת העץ.<\/b> תַּחַת הָאִילָן:", "rashi_en": "יקח נא LET BE FETCHED, I PRAY THEE — This implies bringing by a messenger: therefore did the Holy One, blessed be He, recompense his (Abraham’s) children by a messenger when they required water, as it is said, (Numbers 20:11) “And Moses lifted up his hand and smote the rock etc.” (Bava Metzia 86b)<br><br>ורחצו רגליכם AND WASH YOUR FEET — He thought they were Arabians who worship the dust of their feet, and he was particular not to have the object of idolatrous worship brought into his house (Bava Metzia 86b). Lot, however, who was not particular about this, mentioned “lodging” (i.e. entering the house) before “washing” the feet, as it is said (Genesis 19:2) “[And he said to the angels] tarry here all night and wash your feet.”<br><br>תחת העץ UNDER THE TREE — beneath the terebinth (Genesis Rabbah 48:11)."}, {"ch": 18, "v": 5, "aliyah": 1, "heb": "וְאֶקְחָ֨ה פַת־לֶ֜חֶם וְסַעֲד֤וּ לִבְּכֶם֙ אַחַ֣ר תַּעֲבֹ֔רוּ כִּֽי־עַל־כֵּ֥ן עֲבַרְתֶּ֖ם עַֽל־עַבְדְּכֶ֑ם וַיֹּ֣אמְר֔וּ כֵּ֥ן תַּעֲשֶׂ֖ה כַּאֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "onk": "וְאֶסַּב פִּתָּא דְלַחְמָא וּסְעִידוּ לִבְּכוֹן בָּתַר כֵּן תַּעֲבָרוּן אֲרֵי עַל כֵּן עֲבַרְתּוּן עַל עַבְדְּכוֹן וַאֲמָרוּ כֵּן תַּעְבֵּיד כְּמָא דִּי מַלֵּלְתָּא:", "onk_en": "I will get bread and you will sustain your heart. Afterwards you will continue on your way, since you have passed by your servant. They said, Fine, do as you have said.", "pj": "וְאִיסָב סְעִיד דִלְחֵם וּסְעִידוּ לִבְּכוֹן וְאוֹדוּ לְשׁוּם מֵימְרָא דַיְיָ וּבָתַר כְּדֵין תַּעֲבִירוּן אֲרוּם בְגִין כְּדֵין בְּאִישׁוֹן שֵׁירוּתָא אַזְדַמַנְתּוּן וְעַבַרְתּוּן עַל עַבְדְכוֹן בְּדִיל לְמִסְעוֹד וַאֲמָרוּ יָאוּת מַלֵילְתָּא עֲבִיד כְּפִתְגָמָךְ", "pj_en": "And I will bring food of bread, that you may strengthen your hearts, and give thanks in the Name of the Word of the Lord, and afterwards pass on. For therefore at the time of repast are you come, and have turned aside to your servant to take food. And they said, Thou hast spoken well; do according to thy word.", "tj": "", "tj_en": "", "rashi": "<b>וסעדו לבכם.<\/b> בַּתּוֹרָה, בַנְּבִיאִים וּבַכְּתוּבִים מָצִינוּ דְּפִתָּא סַעֲדָתָא דְלִבָּא. בַּתּוֹרָה וְסַעֲדוּ לִבְּכֶם, בַּנְּבִיאִים סְעָד לִבְּךָ פַּת לֶחֶם (שופטים י\"ט), בַּכְּתוּבִים וְלֶחֶם לְבַב אֱנוֹשׁ יִסְעָד (תהל' ק\"ד). אָמַר רַבִּי חָמָא, לְבַבְכֶם אֵין כְּתִיב כָּאן אֶלָּא לִבְּכֶם, מַגִּיד שֶׁאֵין יֵצֶר הָרַע שׁוֹלֵט בַּמַּלְאָכִים (בראשית רבה):<br><br><b>אחר תעבורו.<\/b> אַחַר כֵּן תֵּלְכוּ:<br><br><b>כי על כן עברתם.<\/b> כִּי הַדָּבָר הַזֶּה אֲנִי מְבַקֵּשׁ מִכֶּם מֵאַחַר שֶׁעֲבַרְתֶּם עָלַי לִכְבוֹדִי:<br><br><b>כי על כן.<\/b> כְּמוֹ עַל אֲשֶׁר, וְכֵן כָּל כִּי עַל כֵּן שֶׁבַּמִּקְרָא, כִּי עַל כֵּן בָּאוּ בְּצֵל קֹרָתִי (בראשית י\"ט), כִּי עַל כֵּן רָאִיתִי פָנֶיךָ (בראשית ל״ג:י׳), כִּי עַל כֵּן לֹא נְתַתִּיהָ (שם ל\"ח), כִּי עַל כֵּן יָדַעְתָּ חֲנֹתֵנוּ (במדבר י'):", "rashi_en": "וסעדו לבכם AND SUSTAIN YOUR HEARTS — In the Torah, the Prophets and the Hagiographa we find that bread is the sustenance of the heart. In the Torah. “[And I will fetch a morsel of bread] and sustain your heart.” In the Prophets: “Stay thy heart with a morsel of bread” (Judges 19:5). In the Hagiographa: “And bread that sustaineth man’s heart” (Psalms 104:15). R. Hama said: Here is not written לבבכם but לבכם thus teaching that the evil inclination has no power over angels (Genesis Rabbah 48:11)<br><br>אחר תעבורו means after that, you may go away.<br><br>כי על כן עברתם FORASMUCH AS YE HAVE PASSED —For (כי) I ask you this thing because that (על כן) you have honoured me by calling at my place. כי] על כן] has the same meaning as על אשר “because that”. So, too, is the meaning wherever כי על כן occurs in Scripture, e. g., (Genesis 19:9) “For (כי) I ask you this because that (על כן) they have come under the shadow of my roof”; (Genesis 33:10)<br><br>“For (כי) you ought to do this because that (על כן) I have seen thy face”; (Genesis 38:26) “for (כי) she has done right because that (על כן) I gave her not”; (Numbers 10:31) “for (כי) thou ought to accompany us because that (על כן) thou knowest how we are to encamp”."}, {"ch": 18, "v": 6, "aliyah": 1, "heb": "וַיְמַהֵ֧ר אַבְרָהָ֛ם הָאֹ֖הֱלָה אֶל־שָׂרָ֑ה וַיֹּ֗אמֶר מַהֲרִ֞י שְׁלֹ֤שׁ סְאִים֙ קֶ֣מַח סֹ֔לֶת ל֖וּשִׁי וַעֲשִׂ֥י עֻגֽוֹת׃", "onk": "וְאוֹחִי אַבְרָהָם לְמַשְׁכְּנָא לְוַת שָׂרָה וַאֲמַר אוֹחָא תְּלָת סְאִין קִמְחָא דְסָלְתָּא לוּשִׁי וְעִבִידִי גְרִיצָן:", "onk_en": "Avraham hurried to Sarah’s tent and said, Hurry! [take] three measures of the finest flour; knead it and make cake-rolls.", "pj": "וְאוֹחִי אַבְרָהָם לְמַשְׁכְּנָא לְוַת שָרָה וַאֲמַר אוֹחָא תְּלַת סְאִין סְמִידָא דְסוּלְתָּא פִּתּוּכֵי וַעֲבִידִי גְרִיצָן", "pj_en": "And Abraham hastened into the tent unto Sarah, and said to her, Hasten three measures of flour-meal, mix and make cakes.", "tj": "", "tj_en": "", "rashi": "<b>קמח סלת.<\/b> סֹלֶת לְעֻגוֹת, קֶמַח לַעֲמִילָן שֶׁל טַבָּחִים, לְכַסּוֹת אֶת הַקְּדֵרָה לִשְׁאֹב אֶת הַזֻּהֲמָא:", "rashi_en": "קמח סלת MEAL, FINE FLOUR — The fine flour (סלת) for the cakes, the meal (קמח) for the dough used by cooks to place over the pot to absorb the scum (Bava Metzia 86b). "}, {"ch": 18, "v": 7, "aliyah": 1, "heb": "וְאֶל־הַבָּקָ֖ר רָ֣ץ אַבְרָהָ֑ם וַיִּקַּ֨ח בֶּן־בָּקָ֜ר רַ֤ךְ וָטוֹב֙ וַיִּתֵּ֣ן אֶל־הַנַּ֔עַר וַיְמַהֵ֖ר לַעֲשׂ֥וֹת אֹתֽוֹ׃", "onk": "וּלְוַת תּוֹרֵי רְהַט אַבְרָהָם וּדְבַר בַּר תּוֹרֵי רַכִּיךְ וְטַב וִיהַב לְעוּלֵמָא וְאוֹחִי לְמֶעְבַּד יָתֵיהּ:", "onk_en": "Avraham ran to the cattle, and took a tender, choice calf. He gave it to the lad. and hurried to prepare it.", "pj": "וּלְבַקְרוּתָא רְהַט אַבְרָהָם וּנְסַב בַּר תּוֹרֵי רַכִּיךְ וּשְׁמַן וִיהַב לְעוּלֵימָא וְאוֹחִי לְמֶעְבְדֵיהּ תַּבְשִׁילִין", "pj_en": "And unto the flock ran Abraham, and took a calf, tender and fat, and gave to a young man, and hastened to make prepared meats;", "tj": "", "tj_en": "", "rashi": "<b>בן בקר רך וטוב.<\/b> ג' פָּרִים הָיוּ, כְדֵי לְהַאֲכִילָן ג' לְשׁוֹנוֹת בְּחַרְדָּל (בבא מציעא פ\"ז):<br><br><b>אל הנער.<\/b> זֶה יִשְׁמָעֵאל, לְחַנְּכוֹ בְּמִצְוֹת (בראשית רבה):", "rashi_en": "בן בקר רך וטוב A CALF, TENDER AND GOOD — There were three calves so that he might give them to eat three tongues together with mustard condiment (Bava Metzia 86b).<br><br>אל הנער TO THE YOUNG MAN — This was Ishmael whom he bade to do this in order to train him to the performance of religious duties (in this case the duty of hospitality) (Genesis Rabbah 48:13). "}, {"ch": 18, "v": 8, "aliyah": 1, "heb": "וַיִּקַּ֨ח חֶמְאָ֜ה וְחָלָ֗ב וּבֶן־הַבָּקָר֙ אֲשֶׁ֣ר עָשָׂ֔ה וַיִּתֵּ֖ן לִפְנֵיהֶ֑ם וְהֽוּא־עֹמֵ֧ד עֲלֵיהֶ֛ם תַּ֥חַת הָעֵ֖ץ וַיֹּאכֵֽלוּ׃", "onk": "וּנְסִיב שְׁמַן וַחֲלָב וּבַר תּוֹרֵי דִּי עֲבַד וִיהַב קֳדָמֵיהוֹן וְהוּא <b>מְשַׁמֵּשׁ<\/b> עִלָּוֵיהוֹן תְּחוֹת אִילָנָא וַאֲכָלוּ:", "onk_en": "He took butter, milk, and the calf he had prepared, and set it before them. He stood over them [<b>served them<\/b>] under the tree, and they ate.", "pj": "וּנְסֵיב לֵוָאֵי שָׁמִין וַחֲלַב וּבַר תּוֹרֵי דְעָבַד עוּלֵימָא תַּבְשִׁילִין וְסַדֵר קֳדָמֵיהוֹן כְּאוֹרַח הִילְכַת בִּרְיַית עַלְמָא וְהוּא מְשַׁמֵשׁ קֳדָמֵיהוֹן וְאִינוּן יַתְבִין תְּחוֹת אִילָנָא וְדָמֵי לֵיהּ כְּאִילוּ אָכְלִין", "pj_en": "and he took rich cream and milk and the calf which the young man had made into prepared meats, and set them before them, according to the way and conduct (hilkath) of the creatures of the world; and he served before them, and they sat under the tree; and he quieted himself (to see) whether they would eat.", "tj": "", "tj_en": "", "rashi": "<b>ויקח חמאה וגו'.<\/b> וְלֶחֶם לֹא הֵבִיא, לְפִי שֶׁפֵּרְסָה שָׂרָה נִדָּה, שֶׁחָזַר לָהּ אֹרַח כַּנָּשִׁים אוֹתוֹ הַיּוֹם, וְנִטְמֵאת הָעִסָּה (בבא מציעא שם):<br><br><b>חמאה.<\/b> שֻׁמַּן הֶחָלָב שֶׁקּוֹלְטִין מֵעַל פָּנָיו:<br><br><b>ובן הבקר אשר עשה.<\/b> אֲשֶׁר תִּקֵּן; קַמָּא קַמָּא שֶׁתִּקֵן אַמְטִי וְאַיְיתִי קָמַיְהוּ:<br><br><b>ויאכלו.<\/b> נִרְאוּ כְמִי שֶׁאָכְלוּ, מִכָּאן שֶׁלֹּא יְשַׁנֶּה אָדָם מִן הַמִּנְהָג (בבא מציעא שם):", "rashi_en": "ויקח חמאה וגו AND HE TOOK חמאה, ETC. — but he did not bring bread, on account of Sarah becoming mentstruant; as the 'way of women' returned to her that day, and the dough became impure (Bava Metzia 87a). <br><br>חמאה is the fatty part of milk which is skimmed off its surface.<br><br>ובן הבקר אשר עשה literally, AND THE CALF WHICH HE HAD MADE — i.e. prepared. Whatever was ready first he brought and placed before them.<br><br>ויאכלו AND THEY DID EAT—They appeared to be eating: from this we may learn that a man should not act differently from the prevalent custom (Bava Metzia 86b). "}, {"ch": 18, "v": 9, "aliyah": 1, "heb": "וַיֹּאמְר֣וּ אֵׄלָ֔יׄוׄ אַיֵּ֖ה שָׂרָ֣ה אִשְׁתֶּ֑ךָ וַיֹּ֖אמֶר הִנֵּ֥ה בָאֹֽהֶל׃", "onk": "וַאֲמָרוּ לֵיהּ אָן שָׂרָה אִתְּתָךְ וַאֲמַר הָא בְמַשְׁכְּנָא:", "onk_en": "They said to him, Where is Sarah, your wife? He said Here, in the tent.", "pj": "וְאָמְרוּ לֵיהּ הָאן שָרָה אִנְתְּתָךְ וַאֲמַר הָא הִיא בְּמַשְׁכְּנָא", "pj_en": "And they said to him, Where is Sarah thy wife? And he said, Behold, she is in the tent.", "tj": "", "tj_en": "", "rashi": "<b>ויאמרו אליו.<\/b> נָקוּד עַל אי\"ו שֶׁבְּאֵלָיו, וְתַנְיָא רַ\"שִׁ בֶּן אֶלְעָזָר אוֹמֵר כָּל מָקוֹם שֶׁכְּתָב רַבֶּה עַל הַנְּקֻדָּה, אַתָּה דוֹרֵשׁ הַכְּתָב; וְכָאן הַנְּקֻדָּה רַבָּה עַל הַכְּתָב אַתָּה דּוֹרֵשׁ הַנְּקֻדָּה, שֶׁאַף לְשָׂרָה שָׁאֲלוּ אַיּוֹ אַבְרָהָם, לָמַדְנוּ שֶׁיִּשְׁאַל אָדָם בְּאַכְסַנְיָא שֶׁלּוֹ לָאִישׁ עַל הָאִשָּׁה וְלָאִשָּׁה עַל הָאִישׁ. בְּבָבָא מְצִיעָא אוֹמְרִים יוֹדְעִים הָיוּ מַלְאֲכֵי הַשָּׁרֵת שָׂרָה אִמֵּנוּ הֵיכָן הָיְתָה, אֶלָּא לְהוֹדִיעַ שֶׁצְּנוּעָה הָיְתָה, כְּדֵי לְחַבְּבָהּ עַל בַּעֲלָה. אָמַר רַבִּי יוֹסֵי בַּר חֲנִינָא, כְּדֵי לְשַׁגֵּר לָהּ כּוֹס שֶׁל בְּרָכָה:<br><br><b>הנה באהל.<\/b> צְנוּעָה הִיא:", "rashi_en": "ויאמרו אליו AND THEY SAID UNTO HIM — The letters 'א' י' ו of the word אליו have dots over them (thus distinguishing these letters which form the word meaning “where is he”?). R. Simeon the son of Eleazar said: wherever you find in a particular word or phrase that the letters in ordinary writing are more numerous than those dotted, you should give a special interpretation to those in ordinary writing. Here the dotted letters are more than those in ordinary writing and you, therefore, give an explanation of the dotted letters — that of Sarah also, they asked, איו “where is he (Abraham)”? So we may learn that in his inn a man should enquire of the man (the host) as to his wife’s welfare and of the woman (the hostess) about her husband’s. In Treatise Bava Metzia (87a) it is stated: The ministering angels knew, indeed, where our mother Sarah was but they asked this question in order to call attention to her modesty (retiring disposition) and so to endear her all the more to her husband.) R. José the son of Haninah stated that they enquired where she was in order to send her the wine-cup of blessing (the glass of wine held by him who recites the Grace after meals)<br><br>הנה באהל BEHOLD, IN THE TENT — She is a modest woman. "}, {"ch": 18, "v": 10, "aliyah": 1, "heb": "וַיֹּ֗אמֶר שׁ֣וֹב אָשׁ֤וּב אֵלֶ֙יךָ֙ כָּעֵ֣ת חַיָּ֔ה וְהִנֵּה־בֵ֖ן לְשָׂרָ֣ה אִשְׁתֶּ֑ךָ וְשָׂרָ֥ה שֹׁמַ֛עַת פֶּ֥תַח הָאֹ֖הֶל וְה֥וּא אַחֲרָֽיו׃", "onk": "וַאֲמַר מִתַּב אִתּוּב לְוָתָךְ <b>כְּעִדָּן דְּאַתּוּן קַיָּמִין<\/b> וְהָא בָר לְשָׂרָה אִתְּתָךְ וְשָׂרָה שְׁמַעַת בִּתְרַע מַשְׁכְּנָא וְהוּא אֲחוֹרוֹהִי:", "onk_en": "He said I will return to you next year [<b>at this time when you will be alive<\/b>], and Sarah, your wife will have a son. Sarah was listening at the door of the tent, that was behind him.", "pj": "וַאֲמַר חַד מִנְהוֹן מֵיתַב אִתוּב לְוָתָךְ לְשַׁתָּא דְאַתְיָא וְאַתּוּן קַיָימִין וְהָא בַּר לְשָרָה אִנְתְּתָךְ וְשָרָה הֲוַת שָׁמְעָא בִּתְרַע מַשְׁכְּנָא וְיִשְׁמָעֵאל קָאִי בַּתְרֵיהּ וְצָיִית מַה דְאָמַר מַלְאָכָא", "pj_en": "And one of them said, Returning I will return to thee in the coming year; and you shall be revived, and, behold, Sarah thy wife shall have a son. And Sarah was hearkening at the door of the tent, and Ishmael stood behind her, and marked what the Angel said.", "tj": "וַאֲמַר מַחֲזוֹר אַחֲזוֹר לְוָתָךְ כְּעִידַן הָדֵין דְאַתּוּן קַיָמִין וְהָא בַּר דְכַר לְשָרָה אִתְּתָךְ וְשָרָה הֲוָת שְׁמָעַת לִתְרַע מַשְׁכְּנָא וְיִשְׁמָעֵאל הֲוָה קָאִים מִן בַּתְרָא:", "tj_en": "And He said, Returning I will return to thee at that time, to revive you, and, behold, Sarah thy wife shall have a male child. And Sarah was hearkening at the door of the tent, and Ishmael stood behind her.", "rashi": "<b>שוב אשוב.<\/b> לֹא בִשְּׂרוֹ הַמַּלְאָךְ שֶׁיָּשׁוּב אֵלָיו, אֶלָּא בִשְׁלִיחוּתוֹ שֶׁל מָקוֹם אָמַר לוֹ, כְּמוֹ וַיֹּאמֶר לָהּ מַלְאַךְ ה' הַרְבָּה אַרְבֶּה, וְהוּא אֵין בְּיָדוֹ לְהַרְבּוֹת, אֶלָּא בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם, אַף כָּאן בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם אָמַר לוֹ כֵּן (בְּ\"רַ). אֱלִישָׁע אָמַר לַשּׁוּנַמִּית לַמּוֹעֵד הַזֶּה כָּעֵת חַיָּה אַתְּ חֹבֶקֶת בֵּן וַתֹּאמֶר אַל אֲדֹנִי אִישׁ הָאֱלֹהִים אַל תְּכַזֵּב בְּשִׁפְחָתֶךָ, אוֹתָן הַמַּלְאָכִים שֶׁבִּשְּׂרוּ אֶת שָׂרָה אָמְרוּ לַמּוֹעֵד אָשׁוּב, אָמַר לָהּ אֱלִישָׁע אוֹתָם הַמַּלְאָכִים שֶׁהֵם חַיִּים וְקַיָּמִים לְעוֹלָם אָמְרוּ לַמּוֹעֵד אָשׁוּב, אֲבָל אֲנִי בָשָׂר וָדָם שֶׁהַיּוֹם חַי וּמָחָר מֵת – בֵּין חַי וּבֵין מֵת לַמּוֹעֵד הַזֶּה וגו':<br><br><b>כעת חיה.<\/b> כָּעֵת הַזֹּאת לַשָּׁנָה הַבָּאָה, וּפֶסַח הָיָה, וּלְפֶסַח הַבָּא נוֹלַד יִצְחָק, מִדְּלָא קָרֵינַן כְּעֵת אֶלָּא כָּעֵת:<br><br><b>כעת חיה.<\/b> כָּעֵת הַזֹּאת שֶׁתְּהֵא חַיָּה לָכֶם, שֶׁתִּהְיוּ כֻּלְּכֶם שְׁלֵמִים וְקַיָּמִים:<br><br><b>והוא אחריו.<\/b> הַפֶּתַח הָיָה אַחַר הַמַּלְאָךְ:", "rashi_en": "שוב אשוב I WILL CERTAINLY RETURN — The angel was not announcing that he would return to him, but he was speaking to him as God’s agent (meaning that God would return). Similar is, (16:10) “And the angel of the Lord said to her, I will greatly multiply thy seed, but he had no power to multiply, and was speaking only as God’s agent. So also here, he spoke thus as God’s agent. Elisha said to the Shunamite (2 Kings 4:16), “At this season when the time cometh round thou shalt embrace a son”, and she said, “Nay, my lord, thou man of God, do not lie unto thy handmaid; see, those angels who made the announcement to Sarah said “at the appointed time I will return”! Elisha in effect said to her, “Those angels who live and endure for ever could indeed promise “at the appointed time I will return”, but I am only flesh and blood (human), alive today and dead tomorrow — but whether I live or die, “at this season [thou shalt embrace a son]” (Genesis Rabbah 53:2).<br><br>כעת חיה means at this time next year — it was the Passover, and on the next Passover Isaac was born — since we do not read כְּעֵת (at “a” time) but כָּעֵת (at this time).<br><br>The words כעת חיה signify: at this time when there will be life to you — when you will all be healthy and alive.<br><br>והוא אחריו AND IT (literally, HE) WAS BEHIND HIM — The door was behind the angel. "}, {"ch": 18, "v": 11, "aliyah": 1, "heb": "וְאַבְרָהָ֤ם וְשָׂרָה֙ זְקֵנִ֔ים בָּאִ֖ים בַּיָּמִ֑ים חָדַל֙ לִהְי֣וֹת לְשָׂרָ֔ה אֹ֖רַח כַּנָּשִֽׁים׃", "onk": "וְאַבְרָהָם וְשָׂרָה סִיבוּ עַלּוּ בְּיוֹמִין פְּסַק מִלְּמֶהֱוֵי לְשָׂרָה אוֹרַח כִּנְשַׁיָּא:", "onk_en": "Avraham and Sarah were old, well on in years. Sarah no longer had the way of women.", "pj": "וְאַבְרָהָם וְשָרָה סָבִין עָלוּ בְּיוֹמֵי פָּסַק מִלְמֶהֱוֵי לְשָרָה אוֹרַח סוּבְתָּא כִּנְשַׁיָא", "pj_en": "But Abraham and Sarah were old, they had mounted (alu) in days, and with Sarah the way of women had ceased.", "tj": "", "tj_en": "", "rashi": "<b>חדל להיות.<\/b> פָּסַק מִמֶּנָה:<br><br><b>אורח כנשים.<\/b> אֹרַח נִדּוֹת:", "rashi_en": "חדל להיות means [that] it had ceased from her.<br><br>אורח כנשים means the way of menstruation.  "}, {"ch": 18, "v": 12, "aliyah": 1, "heb": "וַתִּצְחַ֥ק שָׂרָ֖ה בְּקִרְבָּ֣הּ לֵאמֹ֑ר אַחֲרֵ֤י בְלֹתִי֙ הָֽיְתָה־לִּ֣י עֶדְנָ֔ה וַֽאדֹנִ֖י זָקֵֽן׃", "onk": "וְחַיְכַת שָׂרָה בִּמְעָהַהּ לְמֵימָר בָּתַר <b>דְּסֵיבִית<\/b> הֲוַת לִי <b>עוּלֵימוּ<\/b> וְרִבּוֹנִי סִיב:", "onk_en": "Sarah laughed to herself saying, Now that I am worn out [<b>old<\/b>], shall I have the pleasure [of a son] [<b>youthfulness<\/b>], my master being [also] an old man.", "pj": "וּתְמָהַת שָרָה בְּלִבָּה לְמֵימַר בָּתַר דִי סֵיבִית הֲוֵי לִי עִדוּיֵין וְרִבּוֹנִי אַבְרָהָם סִיב", "pj_en": "And Sarah wondered in her heart, saying After that I am old shall I have conceptions, and my lord Abraham is old?", "tj": "וְחַיְיכַת שָרָה בְּלִבָּהּ לְמֵימָר בָּתַר דְסָבִית אֶפְשַׁר דְאַחֲזוֹר לְיוֹמֵי טִלְיוּתִי לְמֶהֱוֵי לִי עִידוּי וְאַבְרָהָם סִיב:", "tj_en": "And Sarah derided in her heart, saying, After that I am old, is it possible to return to the days of my youth, for me to have conception, and Abraham is old?", "rashi": "<b>בקרבה.<\/b> מִסְתַּכֶּלֶת בְּמֵעֶיהָ וְאָמְרָה אֶפְשַׁר הַקְּרָבַיִם הַלָּלוּ טְעוּנִין וָלָד? הַשָּׁדַיִם הַלָּלוּ שֶׁצָּמְקוּ מוֹשְׁכִין חָלָב? תַּנְחוּמָא:<br><br><b>עדנה.<\/b> צִחְצוּחַ בָּשָׂר, וּלְשׁוֹן מִשְׁנָה מַשִּׁיר אֶת הַשֵּׂעָר וּמְעַדֵּן אֶת הַבָּשָׂר. דָבָר אַחֵר לְשׁוֹן עִדָּן; זְמַן וֶסֶת נִדּוּת:", "rashi_en": "בקרבה [SARAH LAUGHED] WITHIN HERSELF (or, REGARDING HER INSIDE) — She reflected on her physical condition, saying, “Is it possible that this womb shall bear a child, that these dried-up breasts shall give forth milk” (Midrash Tanchuma, Shoftim 18).<br><br>עדנה means glistening flesh (skin), and so it is used in the Mishna (Menachot 86a): it makes the hair fall out and the skin smooth (מעדן)."}, {"ch": 18, "v": 13, "aliyah": 1, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־אַבְרָהָ֑ם לָ֣מָּה זֶּה֩ צָחֲקָ֨ה שָׂרָ֜ה לֵאמֹ֗ר הַאַ֥ף אֻמְנָ֛ם אֵלֵ֖ד וַאֲנִ֥י זָקַֽנְתִּי׃", "onk": "וַאֲמַר יְיָ לְאַבְרָהָם לְמָא דְנָן חַיְכַת שָׂרָה לְמֵימַר הַבְרַם בְּקוּשְׁטָא אוֹלִיד וַאֲנָא סֵיבִית:", "onk_en": "Adonoy said to Avraham, Why did Sarah laugh saying, Can I really give birth when I am old?", "pj": "וַאֲמַר יְיָ לְאַבְרָהָם לָמָה דְנַן גַחְכַת שָרָה לְמֵימַר הַבְּרַם בִּקְשׁוֹט אוֹלִיד וַאֲנָא סָבִית", "pj_en": "And the Lord said to Abraham, Why hath Sarah so laughed, saying, Can it be in truth that I shall bear, being old?", "tj": "", "tj_en": "", "rashi": "<b>האף אמנם.<\/b> הֲגַם אֱמֶת אֵלֵד? <br><br><b>ואני זקנתי<\/b> שִׁנָּה הַכָּתוּב מִפְּנֵי הַשָּׁלוֹם, שֶׁהֲרֵי הִיא אָמְרָה וַאדֹנִי זָקֵן:", "rashi_en": "האף אמנם  means SHALL I REALLY BEAR? <br><br>ואני זקנתי I BEING OLD — Scripture (God) in relating her words to her husband alters them for the sake of peace, for she had said (v. 12) “my lord is old” (Genesis Rabbah 48:18). "}, {"ch": 18, "v": 14, "aliyah": 1, "heb": "הֲיִפָּלֵ֥א מֵיְהֹוָ֖ה דָּבָ֑ר לַמּוֹעֵ֞ד אָשׁ֥וּב אֵלֶ֛יךָ כָּעֵ֥ת חַיָּ֖ה וּלְשָׂרָ֥ה בֵֽן׃", "onk": "<b>הֲיִתְכַּסֵּא<\/b> מִן <b>קֳדָם<\/b> יְיָ פִּתְגָּמָא לִזְמַן אִתּוּב לְוָתָךְ <b>כְּעִדָּן דְּאַתּוּן קַיָּמִין<\/b> וּלְשָׂרָה בָר:", "onk_en": "Is anything too far removed [<b>hidden<\/b>] from [<b>before<\/b>] Adonoy? At the appointed time I will return to you, at this time of life [<b>when you will be alive<\/b>], and Sarah will have a son.", "pj": "הַאֶפְשַׁר דְיִתְכַּסֵי מִן קֳדָם יְיָ מִדָעָם לִזְמַן חַגָא אֵיתוּב בְּעִידָנָא הָדֵין וְאַתּוּן קַיָימִין וּלְשָרָה בָּר", "pj_en": "Is it possible to hide anything from before the Lord? At the gracious time I will return to thee, in the time when you shall be revived, and Sarah shall have a son.", "tj": "", "tj_en": "", "rashi": "<b>היפלא.<\/b> כְּתַרְגּוּמוֹ הֲיִתְכַּסִּי? וְכִי שׁוּם דָּבָר מֻפְלָא וּמֻפְרָד וּמְכֻסֶּה מִמֶּנִּי מִלַּעֲשׂוֹת כִּרְצוֹנִי:<br><br><b>למועד.<\/b> לְאוֹתוֹ מוֹעֵד הַמְיֻחָד שֶׁקָּבַעְתִּי לְךָ אֶתְמוֹל, לַמּוֹעֵד הַזֶּה בַּשָּׁנָה הָאַחֶרֶת:", "rashi_en": "היפלא IS TOO HARD? — As the Targum takes it: is anything hidden — far distant and apart (מופלא) from Me that I cannot do as I would wish?<br><br>למועד AT THE APPOINTED TIME — at the special time that I fixed for you yesterday (i.e. on a previous occasion) when I said, (17:21) “at this set time next year”. "}, {"ch": 18, "v": 15, "aliyah": 2, "heb": "וַתְּכַחֵ֨שׁ שָׂרָ֧ה&thinsp;<small>׀<\/small>&thinsp;לֵאמֹ֛ר לֹ֥א צָחַ֖קְתִּי כִּ֣י&thinsp;<small>׀<\/small>&thinsp;יָרֵ֑אָה וַיֹּ֥אמֶֽר&thinsp;<small>׀<\/small>&thinsp;לֹ֖א כִּ֥י צָחָֽקְתְּ׃", "onk": "וְכַדִּיבַת שָׂרָה לְמֵימָר לָא חַיֵּכִית אֲרֵי דְחֵילָת וַאֲמַר לָא <b>בְּרָם<\/b> חַיָּכְתְּ:", "onk_en": "Sarah denied it saying, I did not laugh, for she was afraid. He said, Not so, for [<b>but<\/b>] you did laugh.", "pj": "וְכַּפְרַת שָרָה לְמֵימַר לָא תָּמִהִית אֲרוּם דְחִילַת וְאָמַר מַלְאָכָא לָא תְדַחֲלוּן אֲרוּם בְּקוּשְׁטָא גָחַכְתְּ", "pj_en": "And Sarah denied and said, I wondered not; for she was afraid. And the Angel said, Fear not: yet in truth thou didst laugh.", "tj": "", "tj_en": "", "rashi": "<b>כי יראה וגו' כי צחקת.<\/b> הָרִאשׁוֹן מְשַׁמֵּשׁ לְשׁוֹן דְּהָא, שֶׁנּוֹתֵן טַעַם לַדָּבָר וַתְּכַחֵשׁ שָׂרָה – לְפִי שֶׁיָּרְאָה; וְהַשֵּׁנִי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא, וַיֹּאמֶר לֹא כִדְבָרֵךְ הוּא אֶלָּא צָחַקְתְּ, שֶׁאָמְרוּ רַבּוֹתֵינוּ כִּי מְשַׁמֵּשׁ בְּאַרְבַּע לְשׁוֹנוֹת, אִי, דִּלְמָא, אֶלָּא, דְּהָא:", "rashi_en": "כי יראה וגו' כי צחקת FOR SHE WAS AFRAID… BUT THOU DIDST LAUGH — The first כי is used in the sense of “because”, giving a reason for the former statement—Sarah denied … because she was afraid; the second כי is used in the meaning of “but” — “and He said, ‘It is not as you say that you did not laugh, but thou didst laugh’.” For our Rabbis say (Rosh Hashanah 3a) that the word כי has four meanings: “if”, “perhaps”, “but”, “because”."}, {"ch": 18, "v": 16, "aliyah": 2, "heb": "וַיָּקֻ֤מוּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים וַיַּשְׁקִ֖פוּ עַל־פְּנֵ֣י סְדֹ֑ם וְאַ֨בְרָהָ֔ם הֹלֵ֥ךְ עִמָּ֖ם לְשַׁלְּחָֽם׃", "onk": "וְקָמוּ מִתַּמָּן גֻּבְרַיָּא וְאִסְתְּכִיאוּ עַל אַפֵּי סְדוֹם וְאַבְרָהָם אָזֵל עִמְּהוֹן <b>לְאַלְווֹאֵיהוֹן<\/b>:", "onk_en": "The men stood up from where they were, and they gazed upon Sedom. Avraham went with them to send them [<b>escort them<\/b>] [on their way].", "pj": "וְקָמוּ מִתַּמָן מַלְאָכַיָא דַהֲווֹ מְדַמְיָין לְגַבְרַיָא דִין דְבִשַר יַת שָרָה סְלִיק לִשְמֵי מְרוֹמָא וּתְרֵין מִנְהוֹן אוֹדִיקוּ עַל אַנְפֵּי סְדוֹם וְאַבְרָהָם אָזִיל עִמְהוֹן לְאַלְוָואֵיהוֹן", "pj_en": "And the angels, who had the likeness of men, arose from thence, and the one who had made known the tidings to Sarah ascended to the high heavens; and two of them looked toward Sedom; and Abraham went with them.", "tj": "וְאַדִיקוּ:", "tj_en": "And they looked towards.", "rashi": "<b>וישקיפו.<\/b> כָּל הַשְׁקָפָה שֶׁבַּמִּקְרָא לְרָעָה חוּץ מֵהַשְׁקִיפָה מִמְּעוֹן קָדְשְׁךָ (דברים כ\"ו), שֶׁגָּדוֹל כֹּחַ מַתְּנוֹת עֲנִיִּים שֶׁהוֹפֵך מִדַּת הָרֹגֶז לְרַחֲמִים:<br><br><b>לשלחם.<\/b> לְלַוּוֹתָם; כַּסָּבוּר אוֹרְחִים הֵם:", "rashi_en": "וישקיפו [AND THE MEN] GLANCED — Wherever the Hiphil form of שקף occurs in the Scriptures it denotes taking notice for the purpose of bringing evil (Midrash Tanchuma, Ki Tisa 14), except (Deuteronomy 26:15) (a passage dealing with the tithe, including that given to the poor), “Look forth (השקיפה) from thy holy habitation . .. [and bless thy people] for so great is the power (virtue) of giving to the poor that it changes God’s anger into mercy.<br><br>לשלחם means TO ESCORT THEM, for he believed that they were travellers."}, {"ch": 18, "v": 17, "aliyah": 2, "heb": "וַֽיהֹוָ֖ה אָמָ֑ר הַֽמְכַסֶּ֤ה אֲנִי֙ מֵֽאַבְרָהָ֔ם אֲשֶׁ֖ר אֲנִ֥י עֹשֶֽׂה׃", "onk": "וַיְיָ אֲמָר הַמְכַסֵּי אֲנָא מֵאַבְרָהָם דִּי אֲנָא עָבֵד:", "onk_en": "Adonoy said, Shall I conceal from Avraham what I am about to do?", "pj": "וַיְיָ אָמַר בְּמֵימְרֵיהּ לֵית אַוְושַׁר לִי לִמְכַסְיָא מִן אַבְרָהָם מַה דַאֲנָא עָבֵיד וּמִן דִינָא הוּא דְלָא נַעֲבֵּיד עַד דְנוֹדַע יָתֵיהּ", "pj_en": "And the Lord said, with His Word, I cannot hide from Abraham that which I am about to do; and it is right that before I do it, I should make it known to him. For", "tj": "וַיְיָ בְּמֵימְרֵיהּ אָמַר הַמְכַסֵי אֲנָא מֵאַבְרָהָם רַחֲמִי יַת מַה דַאֲנָא עָבִיד הוֹאִיל וּכְרַכָּא דִסְדוֹם בְּגוֹ מַתַּנְתָּא דִי יְהָבִית לֵיהּ דִינָא הוּא דְלָא נָפִיךְ יָתָהּ עַד זְמַן דְאוֹדַע יָתֵיהּ:", "tj_en": "And the Lord with His Word said, Shall I hide from Abraham, My friend, that which I am about to do? Forasmuch as the town of Sedom is among the gifts that I have given to him, it is just that I should not overthrow it, till I have made it known to him.", "rashi": "<b>המכסה אני.<\/b> בִּתְמִיהָ:<br><br><b>אשר אני עושה<\/b> בִּסְדוֹם. לֹא יָפֶה לִי לַעֲשׂוֹת דָּבָר זֶה שֶׁלֹּא מִדַּעְתּוֹ. אֲנִי נָתַתִּי לוֹ אֶת הָאָרֶץ הַזֹּאת, וַחֲמִשָּׁה כְּרַכִּין הַלָּלוּ שֶׁלּוֹ הֵן, שֶׁנֶּאֱמַר: גְּבוּל הַכְּנַעֲנִי מִצִּידֹן בֹּאֲכָה סְדֹמָה וַעֲמֹרָה וְגוֹ' (בראשית י'). קָרָאתִי אוֹתוֹ אַבְרָהָם – אַב הֲמוֹן גּוֹיִם, וְאַשְׁמִיד אֶת הַבָּנִים וְלֹא אוֹדִיעַ לָאָב, שֶׁהוּא אוֹהֲבִי?", "rashi_en": "המכסה אני SHALL I HIDE? This is a question.<br><br>אשר אני עושה WHAT I AM DOING in Sodom. It is not proper for Me to do this thing without his knowledge. I gave him this land and these five cities therefore are his — as it is said, (10:19) “And the territory of the Canaanites was from Sidon … as thou goest towards Sodom and Gommorah etc.” I called him Abraham, the father of a multitude of nations; should I destroy the children without informing the father who loves me? (Genesis Rabbah 49:2)"}, {"ch": 18, "v": 18, "aliyah": 2, "heb": "וְאַ֨בְרָהָ֔ם הָי֧וֹ יִֽהְיֶ֛ה לְג֥וֹי גָּד֖וֹל וְעָצ֑וּם וְנִ֨בְרְכוּ־ב֔וֹ כֹּ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃", "onk": "וְאַבְרָהָם מֵהֲוָה יֶהֱוֵי לְעַם סַגִּי וְתַקִּיף וְיִתְבָּרְכוּן <b>בְּדִילֵיהּ<\/b> כֹּל עַמְמֵי אַרְעָא:", "onk_en": "Avraham is indeed to become a great and mighty nation, and through him [<b>and because of him<\/b>] shall be blessed all the nations of the world.", "pj": "וְאַבְרָהָם עָתִיד דִיהֵי לְעַם רַב וְתַקִיף וְיִתְבָּרְכוּן בְּדִילֵיהּ בִּזְכוּתֵיהּ כָּל עַמְמֵי אַרְעָא", "pj_en": "Abraham is to be a great and mighty people, and through him shall all the peoples of the earth be blessed.", "tj": "", "tj_en": "", "rashi": "<b>ואברהם היו יהיה.<\/b> מִ\"אַ: זֵכֶר צַדִּיק לִבְרָכָה, הוֹאִיל וְהִזְכִּירוֹ – בֵּרְכוֹ. וּפְשׁוּטוֹ: וְכִי מִמֶּנּוּ אֲנִי מַעֲלִים, וַהֲרֵי הוּא חָבִיב לְפָנַי לִהְיוֹת לְגוֹי גָּדוֹל וּלְהִתְבָּרֵך בּוֹ כָּל גּוֹיֵי הָאָרֶץ.", "rashi_en": "ואברהם היו יהיה SEEING THAT ABRAHAM SHALL SURELY BECOME — The Midrash applies to this the text Proverbs 10:7, “The mention of the righteous shall be for a blessing”: therefore, since He mentions him He blessed him (Genesis Rabbah 49:1). But its real meaning is: “Shall I conceal it from him, seeing that he is so beloved by Me as to become a great nation, and seeing that all nations of the earth shall bless themselves through him?” "}, {"ch": 18, "v": 19, "aliyah": 2, "heb": "כִּ֣י יְדַעְתִּ֗יו לְמַ֩עַן֩ אֲשֶׁ֨ר יְצַוֶּ֜ה אֶת־בָּנָ֤יו וְאֶת־בֵּיתוֹ֙ אַחֲרָ֔יו וְשָֽׁמְרוּ֙ דֶּ֣רֶךְ יְהֹוָ֔ה לַעֲשׂ֥וֹת צְדָקָ֖ה וּמִשְׁפָּ֑ט לְמַ֗עַן הָבִ֤יא יְהֹוָה֙ עַל־אַבְרָהָ֔ם אֵ֥ת אֲשֶׁר־דִּבֶּ֖ר עָלָֽיו׃", "onk": "<b>אֲרֵי גְלִי קֳדָמַי<\/b> (<small>גי' רמב\"ן<\/small> יְדַעְתִּנֵיהּ) <b>בְּדִיל דִּי יְפַקֵּד יָת בְּנוֹהִי<\/b> וְיָת אֱנַשׁ בֵּיתֵיהּ בַּתְרוֹהִי וְיִטְּרוּן <b>אָרְחָן דְּתַקְּנָן קֳדָם יְיָ<\/b> לְמֶעְבַּד צְדַקְתָּא וְדִינָא בְּדִיל אַיְתִי יְיָ עַל אַבְרָהָם יָת דִּמַלֵּל עֲלוֹהִי:", "onk_en": "For I have given him special attention because he commands his children [<b>For it is known to Me that he will command his children<\/b>], and his household after him, and they will preserve the way of Adonoy [<b>the ways that are good in the eyes of Adonoy<\/b>], doing charity and justice, so that Adonoy will bring upon Avraham all that which He has spoken of him.", "pj": "אֲרוּם גְלֵי קֳדָמַי חֲסִידוּתֵיהּ בְּגִין דְיַפְקֵד יַת בְּנוֹי וְיַת אֱנַשׁ בֵּיתֵיהּ בַּתְרֵיהּ וְיִטְרוּן אָרְחָן דְתַקְנָן קֳדָם יְיָ לְמֶעֱבַד צְדַקְתָּא וְדִינָא בְּגִין דְיֵיתֵי יְיָ עִילוֹי דְאַבְרָהָם יַת דְמַלֵיל עִלוֹי", "pj_en": "Because his holiness (piety, chasidutha) is manifest before Me, (and) that he will instruct his sons, and the men of his house after him, to keep the ways that are right before the Lord, to do justice and judgment, that the Lord may bring upon Abraham that which He hath spoken concerning him.", "tj": "", "tj_en": "", "rashi": "<b>כי ידעתיו.<\/b> לְשׁוֹן חִבָּה, כְּמוֹ מוֹדָע לְאִישָׁהּ (רות ב'), הֲלֹא בֹעַז מֹדַעְתָּנוּ (שם ג'), וָאֵדָעֲךָ בְּשֵׁם (שמות ל\"ג). וְאָמְנָם עִקַּר לְשׁוֹן כֻּלָּם אֵינוֹ אֶלָּא לְשׁוֹן יְדִיעָה, שֶׁהַמְחַבֵּב אֶת הָאָדָם מְקָרְבוֹ אֶצְלוֹ וְיוֹדְעוֹ וּמַכִּירוֹ, וְלָמָּה יְדַעְתִּיו?<br><br><b>למען אשר יצוה.<\/b> לְפִי שֶׁהוּא מְצַוֶּה אֶת בָּנָיו עָלַי לִשְׁמֹר דְּרָכַי. וְאִם תְּפָרְשֵׁהוּ כְתַרְגּוּמוֹ, יוֹדֵעַ אֲנִי בוֹ שֶׁיְּצַוֶּה אֶת בָּנָיו וְגוֹ', אֵין לְמַעַן נוֹפֵל עַל הַלָּשׁוֹן:<br><br><b>יצוה.<\/b> לְשׁוֹן הוֹוֶה, כְמוֹ כָּכָה יַעֲשֶׂה אִיּוֹב (איוב א'):<br><br><b>למען הביא.<\/b> כָּךְ הוּא מְצַוֶּה לְבָנָיו, שִׁמְרוּ דֶּרֶך ה' כְּדֵי שֶׁיָּבִיא ה' עַל אַבְרָהָם וְגוֹ'; עַל בֵּית אַבְרָהָם לֹא נֶאֱמַר אֶלָּא עַל אַבְרָהָם, לָמַדְנוּ, כָּל הַמַּעֲמִיד בֵּן צַדִּיק כְּאִלוּ אֵינוֹ מֵת:", "rashi_en": "כי ידעתיו FOR I KNOW HIM — this is an expression denoting \"affection\", as (Ruth 2:1) \"kinsman (מודע) of her husband,\" and (Ruth 3:2) “And is not Boaz our kinsman (מודעתנו), and (Exodus 30:17) “I have distinguished (ידעתיך) thee by name”. Still the primary meaning of these terms connected with the root ידע is really that of knowing, for whoever holds a person in affection attaches him to himself, so that he knows him well and is familiar with him. And why do I hold him dear?<br><br>למען אשר יצוה BECAUSE HE WILL GIVE HIS CHILDREN CHARGE CONCERNING ME TO KEEP MY WAYS. If, however, you explain it as the Targum, “I know “of” him that he will command his sons etc.”, then the word למען does not fit into the sense.<br><br>יצוה HE WILL COMMAND — This form of the verb (the imperfect) expresses frequentative action, as (Job 1.5) \"This Job used to do\" (יַעֲשֶׂה)<br><br>למען הביא IN ORDER THAT [THE LORD] MAY BRING — Thus will he ever command his children saying “Keep the way of the Lord in order that the Lord may bring upon Abraham etc.” Since it does not say here ‘‘upon the house of Abraham”, but upon Abraham himself, we may infer that he who trains up a righteous son is as though he never dies (Genesis Rabbah 49:4). "}, {"ch": 18, "v": 20, "aliyah": 2, "heb": "וַיֹּ֣אמֶר יְהֹוָ֔ה זַעֲקַ֛ת סְדֹ֥ם וַעֲמֹרָ֖ה כִּי־רָ֑בָּה וְחַ֨טָּאתָ֔ם כִּ֥י כָבְדָ֖ה מְאֹֽד׃", "onk": "וַאֲמַר יְיָ קְבֵלַת דִּסְדוֹם וַעֲמוֹרָה אֲרֵי סְגִיאַת וְחוֹבָתְהוֹן אֲרֵי תְקִיפַת לַחֲדָא:", "onk_en": "[Thus] Adonoy said, The wailing concerning Sedom and Amorah is so great, and their sin is so very grave.", "pj": "וַאֲמַר יְיָ לְמַלְאֲכֵי שֵׁירוּתָא קְבֵילַת סְדוֹם וַעֲמוֹרָה דְאַנִיסִין מִסְכְּנִין וְגַזְרִין דְכָל דְיָהִיב פִּתָּא לְעַנְיָא יֵיקַד בְּנוּרָא אֲרוּם סַגִיאַת וְחוֹבַתְהוֹן אֲרוּם תַּקִיפַת לַחֲדָא", "pj_en": "And the Lord said to the ministering angels, The cry of Sedom and Amorah, because they oppress the poor, and decree that whosoever giveth a morsel to the needy shall be burned with fire, is therefore great, and their guilt exceedingly weighty.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה'.<\/b> אֶל אַבְרָהָם שֶׁעָשָׂה כַּאֲשֶׁר אָמַר, שֶׁלֹּא יְכַסֶּה מִמֶּנּוּ:<br><br><b>כי רבה.<\/b> כָּל רַבָּה שֶׁבַּמִּקְרָא הַטַּעַם לְמַטָּה בַּבֵּי\"ת, לְפִי שֶׁהֵן מְתֻרְגָּמִין גְּדוֹלָה, אוֹ גְּדֵלָה וְהוֹלֶכֶת, אֲבָל זֶה טַעֲמוֹ לְמַעְלָה בָּרֵי\"ש, לְפִי שֶׁמְּתֻרְגָּם גָדְלָה כְּבָר כְּמוֹ שֶׁפֵּרַשְׁתִּי וַיְהִי הַשֶּׁמֶשׁ בָּאָה, הִנֵּה שָׁבָה יְבִמְתֵּךְ:", "rashi_en": "'ויאמר ה AND THE LORD SAID to Abraham, thus doing what he had said — that He would not conceal the matter from him.<br><br>כי רבה BECAUSE IT IS GREAT — Wherever רבה elsewhere occurs in Scripture the accent is on the last syllable — on the ב — because it is to be translated by “great” (adj.) or “becoming great” (participle), but this, here, has the accent on the first syllable — on the ר — because it is to be translated by “has already become great” (perf.), just as I have explained (15:17) “And it came to pass, that, when the sun had gone down (בָּאָה)” and (Ruth 1:15) “Behold, thy sister-in-law has gone back (שָׁבָה)”. "}, {"ch": 18, "v": 21, "aliyah": 2, "heb": "אֵֽרְדָה־נָּ֣א וְאֶרְאֶ֔ה הַכְּצַעֲקָתָ֛הּ הַבָּ֥אָה אֵלַ֖י עָשׂ֣וּ&thinsp;<small>׀<\/small>&thinsp;כָּלָ֑ה וְאִם־לֹ֖א אֵדָֽעָה׃", "onk": "<b>אִתְגְּלִי כְעַן וְאֶדּוּן<\/b> הֲכִי קְבִלְתְּהוֹן דְּעַלַּת <b>לִקֳדָמַי<\/b> עֲבָדוּ <b>אֶעְבֵּד עִמְּהוֹן גְּמֵירָא<\/b> (אִם לָא תָיְבִין) <b>וְאִם תָּיְבִין לָא אֶתְפְּרָע<\/b>:", "onk_en": "I will descend now and see [<b>I will become revealed now and judge<\/b>], if their wailing which has come to [<b>before<\/b>] Me is indicative of their conduct; destruction [shall come upon them] [<b>I will destroy them<\/b>]. If not I will know. [<b>If they will repent, I will not punish them.<\/b>]", "pj": "אִתְגְלֵי כְּדוּן וְאֶחְמֵי הָא כְּקִיבַלְתָּא דְרִיבָה פְּלֵיטִית דְעָלַת קוֹמוֹי עָבָדוּ גְמִירָא הִינוּן חַיָבִין וְאִם עַבְדִין תְּתוּבָא הֲלָא הִינוּן קֳדָמָי זַכָּאִין כְּמָא דְלָא יַדְעֵיהּ וְלָא אִתְפְּרַע", "pj_en": "I will now appear, and see whether, as the cry of a damsel torn away, which ascendeth before Me, they have made completion of their sins; (or, whether they have made an end of their sins;) and if they have wrought repentance, shall they not be as (if) innocent before Me? and as if not knowing, I will not punish.", "tj": "אִתְגְלֵי כְּעַן וְאֶחֱמֵי הָא כִּקְבֵלְתְּהוֹן דְעַמָא דִסְדוֹם וַעֲמוֹרָה סַלְקַת קָדָמוֹי כַּלַיָיה עֲבָדוּ גְמִירָא אִינוּן חֲיָיבִין מְדַמְיַן אִינוּן בְּנַפְשָׁתֵיהוֹן דִילְמָא לֵית עוֹבָדֵיהוֹן בִּישַׁיָא גְלֵן קָדָמוֹי וְאִין בָּעוּ לְמֶעֱבַד תְּתוּבָא הָא אִינוּן יְהָבִין כִּדְלָא יְדַעְתִּינוּן:", "tj_en": "Now will I appear and see, according as the cry of the people of Sedom and Amorah hath ascended before Me, whether they have made a complete end. It may be, that some among these sinners do not know that their works of evil are manifest before Me. And if they seek to work repentance, behold, they shall be considered before Me as if those works had not been known.", "rashi": "<b>ארדה נא.<\/b> לִמֵּד לַדַּיָּנִים שֶׁלֹא יִפְסְקוּ דִינֵי נְפָשׁוֹת אֶלָּא בִרְאִיָּה, הַכֹּל כְּמוֹ שֶׁפֵּרַשְׁתִּי בְפָרָשַׁת הַפַּלָּגָה. דָּבָר אַחֵר, אֵרְדָה נָא לְסוֹף מַעֲשֵׂיהֶם:<br><br><b>הכצעקתה.<\/b> שֶׁל מְדִינָה:<br><br><b>הבאה אלי עשו.<\/b> וְכֵן עוֹמְדִים בְּמִרְדָּם, כָּלָה אֲנִי עוֹשֶׂה בָהֶם, וְאִם לֹא יַעַמְדוּ בְמִרְדָּן אֵדְעָה מָה אֶעֶשֶׂה לְהִפָּרַע מֵהֶן בְּיִסּוּרִין וְלֹא אֲכַלֶּה אוֹתָן. וְכַיּוֹצֵא בוֹ מָצִינוּ בְּמָקוֹם אַחֵר, וְעַתָּה הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ וְאֵדְעָה מָה אֶעֱשֶׂה לָּךְ (שמות ל\"ג); וּלְפִיכָךְ יֵשׁ הֶפְסֵק נְקֻדַּת פְּסִיק בֵּין עָשׂוּ לְכָלָה, כְּדֵי לְהַפְרִיד תֵּבָה מֵחֲבֶרְתָּהּ. וְרַבּוֹתֵינוּ דָרְשׁוּ הַכְּצַעֲקָתָהּ – צַעֲקַת רִיבָה אַחַת שֶׁהָרְגוּ מִיתָה מְשֻׁנָּה עַל שֶׁנָּתְנָה מָזוֹן לְעָנִי, כַּמְּפֹרָשׁ בְּחֵלֶק:", "rashi_en": "ארדה נא I WILL GO DOWN NOW — This teaches the judges that they should not give decisions in cases involving capital punishment, except after having carefully looked into the matter — all as I have explained in the section dealing with the dispersion of the nations (11:5). Another explanation of ארדה נא is: I will go down to the very end of their doings (I will fathom the depths of their wickedness).<br><br>הכצעקתה WHETHER ACCORDING TO THE CRY OF IT (literally, of her) — i.e. the cry of the country (מדינה which is feminine).<br><br>הבאה אלי עשו WHETHER THEY HAVE DONE [ACCORDING TO THE CRY OF IT] WHICH IS COME UNTO ME — If they persist in their rebellious ways, (כלה) an end will I make of them; if, however, they do not persist in their rebellious ways, I shall know what I shall do — punishing them only with suffering, but I will not make an end of them. — A similar phrase we find elsewhere, (Exodus 33:5) “There- fore now put off thy ornaments from thee that I may know what to do unto thee”. — For this reason there is a separation marked by a פסיק between עשו and כלה, in order to separate in sense one word from the other. Our Teachers explained the word הכצעקתה “the cry of her”, to refer to the cry of a certain girl whom they put to death in an unnatural manner because she had given food to a poor man, as is explained in the chapter Chelek (Sanhedrin 109b). "}, {"ch": 18, "v": 22, "aliyah": 2, "heb": "וַיִּפְנ֤וּ מִשָּׁם֙ הָֽאֲנָשִׁ֔ים וַיֵּלְכ֖וּ סְדֹ֑מָה וְאַ֨בְרָהָ֔ם עוֹדֶ֥נּוּ עֹמֵ֖ד לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְאִתְפְּנִיאוּ מִתַּמָּן גֻּבְרַיָּא וַאֲזָלוּ לִסְדוֹם וְאַבְרָהָם עַד כְּעַן <b>מְשַׁמֵּשׁ בִּצְלוֹ<\/b> קֳדָם יְיָ:", "onk_en": "The men turned from where they were, and went toward Sedom. Avraham was still standing [<b>serving with prayer<\/b>] before Adonoy.", "pj": "וְאִתְפְּנֵי מִתַּמָן מַלְאָכַיָא דְדַמְיַן לְגוּבְרַיָא וַאֲזָלוּ לִסְדוֹם וְאַבְרָהָם עַד כְּדוּן בָּעֵי רַחֲמִין עַל לוֹט וּמְשַׁמֵשׁ בִּצְלוֹ קֳדָם יְיָ", "pj_en": "And the angels who had the likeness of men, turned thence and went towards Sedom. And Abraham now supplicated mercy for Lot, and ministered in prayer before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ויפנו משם.<\/b> מִמָּקוֹם שֶׁאַבְרָהָם לִוָּם שָׁם:<br><br><b>ואברהם עודנו עומד לפני ה'.<\/b> וַהֲלֹא לֹא הָלַךְ לַעֲמֹד לְפָנָיו, אֶלָּא הַקָּבָּ\"ה בָּא אֶצְלוֹ וְאָמַר לוֹ, זַעֲקַת סְדֹם וַעֲמֹרָה כִּי רָבָּה, וְהָיָה לוֹ לִכְתֹּב \"וַה' עוֹדֶנּוּ עוֹמֵד עַל אַבְרָהָם\"? אֶלָּא תִּקּוּן סוֹפְרִים הוּא זֶה (אֲשֶׁר הֲפָכוּהוּ רַזִ\"לִ לִכְתֹּב כֵּן) (בראשית רבה):", "rashi_en": "ויפנו משם AND [THE MEN] TURNED FROM THENCE —from the place where Abraham had accompanied them.<br><br>'ואברהם עודנו עומד לפני ה BUT ABRAHAM STOOD YET BEFORE THE LORD — But surely it was not he (Abraham) who had gone to stand before Him, but it was the Holy One, blessed be He, Who had come to him and had said to him, “Because the cry of Sodom and Gomorrah is great” and it should therefore have written here, “And the Lord stood yet before Abraham”? But it is a variation such as writers make to avoid an apparently irreverent expression (Genesis Rabbah 49:7) (which our Rabbis, of blessed memory, altered, writing it thus). "}, {"ch": 18, "v": 23, "aliyah": 2, "heb": "וַיִּגַּ֥שׁ אַבְרָהָ֖ם וַיֹּאמַ֑ר הַאַ֣ף תִּסְפֶּ֔ה צַדִּ֖יק עִם־רָשָֽׁע׃", "onk": "וּקְרֵב אַבְרָהָם וַאֲמָר <b>הֲבִרְגַז<\/b> תְּשֵׁיצֵי זַכָּאָה עִם חַיָּבָא:", "onk_en": "Avraham came forward and said, Will You [actually] destroy the righteous with the wicked [<b>in anger<\/b>]?", "pj": "וְצַלִי אַבְרָהָם וַאֲמַר הֲרוּגְזָךְ שֵׁצְיָא זַכְּאַי עִם חַיָיב", "pj_en": "And Abraham prayed and said, Wilt Thou destroy in Thy displeasure the innocent with the guilty?", "tj": "", "tj_en": "", "rashi": "<b>ויגש אברהם.<\/b> מָצִינוּ הַגָּשָׁה לַמִּלְחָמָה, וַיִּגַּשׁ יוֹאָב וְגוֹ' (שמואל ב י'), וְהַגָּשָׁה לְפִיוּס וַיִּגַּשׁ אֵלָיו יְהוּדָה, וְהַגָּשָׁה לִתְפִלָּה, וַיִּגַּשׁ אֵלִיָּהוּ הַנָּבִיא (מלכים א י\"ח), וּלְכָל אֵלֶּה נִכְנַס אַבְרָהָם לְדַבֵּר קָשׁוֹת וּלְפִיּוּס וְלִתְפִלָּה:<br><br><b>האף תספה.<\/b> הֲגַם תִּסְפֶּה. וּלְתַרְגּוּם שֶׁל אֻנְקְלוֹס, שֶׁתִּרְגְּמוֹ לְשׁוֹן רֹגֶז, כָּךְ פֵּרוּשׁוֹ, הַאַף יַשִּׂיאֲךָ שֶׁתִּסְפֶּה צַדִּיק עִם רָשָׁע:", "rashi_en": "ויגש אברהם AND ABRAHAM DREW NEAR — We find the verb ננש “to come near” used in the sense of coming near to wage war — (2 Samuel 10:13) “So Joab … drew near unto the battle”; — of coming near to persuade by entreaty — (44:18) “And Judah came near to him [and said, Oh, my lord]” — and of coming near to pray — (1 Kings 18:36) “And Elijah the prophet came near [and said, O Lord, God of Abraham etc.]” Abraham employed all these methods — to fight, by speaking stern words, and to persuade by entreaty, and to pray (Genesis Rabbah 49:8).<br><br>האף תספה means wilt Thou also destroy. But according to the Targum of Onkelos which translates it (the word האף) in the sense of anger, the explanation would be as follows: will Your anger urge you to destroy righteous with wicked? "}, {"ch": 18, "v": 24, "aliyah": 2, "heb": "אוּלַ֥י יֵ֛שׁ חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּת֣וֹךְ הָעִ֑יר הַאַ֤ף תִּסְפֶּה֙ וְלֹא־תִשָּׂ֣א לַמָּק֔וֹם לְמַ֛עַן חֲמִשִּׁ֥ים הַצַּדִּיקִ֖ם אֲשֶׁ֥ר בְּקִרְבָּֽהּ׃", "onk": "<b>מָאִים<\/b> אִית חַמְשִׁין זַכָּאִין בְּגוֹ קַרְתָּא <b>הֲבִרְגַז<\/b> תְּשֵׁיצֵי וְלָא תִשְׁבּוֹק לְאַתְרָא בְּדִיל חַמְשִׁין זַכָּאִין דִּי בְגַוַּהּ:", "onk_en": "Suppose [<b>Perhaps<\/b>] there are fifty righteous people in the midst of the city, will You still destroy it [<b>in anger<\/b>], and not bear with the place for the sake of the fifty righteous people inside it?", "pj": "מָאִים אִית חַמְשִׁין זַכָּאִין בְּגוֹ קַרְתָּא דְיֵיצְלוּן קֳדָמָךְ עֲשָרָה לְכָל קִרְוָוא כָּל קְבֵיל חַמְשָׁא קוּרְיַין סְדוֹם וַעֲמוֹרָה אַדְמָה וּצְבוֹיִם וְזוֹעַר הֲרוּגְזָךְ שֵׁצְיָא וְלָא תִשְׁבּוֹק לְאַתְרָא בְּגִין זַכְוַות חַמְשִׁין זַכָּאִין דִבְגַוָוהּ", "pj_en": "Perhaps there are fifty innocent persons within the city, who pray before Thee,--ten for every city, of all the five cities of Sedom, Amorah, Admah, Zeboim, and Zoar. Wilt Thou in Thy displeasure destroy and not forgive the country, on account of the fifty innocent ones who are in it? Unholy would it be before Thee to do according to this word, to slay the innocent with the guilty, and to make the innocent to be as the guilty!", "tj": "", "tj_en": "", "rashi": "<b>אולי יש חמשים צדיקים.<\/b> עֲשָׂרָה צַדִּיקִים לְכָל כְּרַךְ וּכְרַךְ, כִּי ה' מְקוֹמוֹת יֵשׁ. וְאִם תֹּאמַר: לֹא יַצִּילוּ הַצַּדִּיקִים אֶת הָרְשָׁעִים, לָמָּה תָּמִית הַצַּדִּיקִים?", "rashi_en": "אולי יש חמשים צדיקים PERADVENTURE THERE BE FIFTY RIGHTEOUS — ten righteous men for each city for there were five localities concerned. Should You, however, say that the righteous cannot save the wicked—but why should You kill the righteous at all? "}, {"ch": 18, "v": 25, "aliyah": 2, "heb": "חָלִ֨לָה לְּךָ֜ מֵעֲשֹׂ֣ת&thinsp;<b>׀<\/b> כַּדָּבָ֣ר הַזֶּ֗ה לְהָמִ֤ית צַדִּיק֙ עִם־רָשָׁ֔ע וְהָיָ֥ה כַצַּדִּ֖יק כָּרָשָׁ֑ע חָלִ֣לָה לָּ֔ךְ הֲשֹׁפֵט֙ כׇּל־הָאָ֔רֶץ לֹ֥א יַעֲשֶׂ֖ה מִשְׁפָּֽט׃", "onk": "<b>קוּשְׁטָא אִנּוּן דִּינָךְ מִלְּמֶעְבַּד<\/b> כְּפִתְגָּמָא הָדֵין לְקַטָּלָא זַכָּאָה עִם חַיָּבָא וִיהֵי זַכָּאָה כְּחַיָּבָא <b>קוּשְׁטָא אִנּוּן דִּינָךְ<\/b> דְּדָיִן (<small>נ\"י<\/small> הֲדַיַן) כָּל אַרְעָא לָא (<small>נ\"י<\/small> בְּרַם) יַעְבֵּד דִּינָא:", "onk_en": "It would be sacrilege [<b>Your judgments are true therefore it is impossible<\/b>] [to attribute] to You such an act, to kill the righteous with the wicked, treating the righteous and the wicked alike. It would be sacrilege to attribute this to You [<b>Your judgments are true<\/b>]: Shall the Judge of all the earth not do justice?", "pj": "חוּלִין הוּא לָךְ לְמֶעֱבַד כְּפִתְגָמָא הָדֵין לְמִקְטַל זַכְּאַי עִם חַיָיב וִיהֵא זַכְּאַי הֵיךְ חַיָיב חוּלִין הוּא לָךְ הֲאֶפְשָׁר מַאן דְדָאִין כָּל אַרְעָא לָא יַעֲבֵיד דִינָא", "pj_en": "That be unholy with Thee. It cannot be that One who is the Judge of all the earth should not do justice.", "tj": "", "tj_en": "", "rashi": "<b>חלילה לך.<\/b> חֻלִּין הוּא לְךָ, יֹאמְרוּ כָךְ הוּא אֻמָּנוּתוֹ, שׁוֹטֵף הַכֹּל, צֵדִּיקִים וּרְשָׁעִים, כָּךְ עָשִׂיתָ לְדוֹר הַמַּבּוּל וּלְדוֹר הַפַּלָּגָה:<br><br><b>כדבר הזה.<\/b> לֹא הוּא וְלֹא כַּיּוֹצֵא בוֹ:<br><br><b>חלילה לך.<\/b> לָעוֹלָם הַבָּא:<br><br><b>השופט כל הארץ.<\/b> נָקוּד בַּחֲטַף פַּתָּח ה\"א שֶׁל הֲשׁוֹפֵט, לְשׁוֹן תְּמִיהָ, וְכִי מִי שֶׁהוּא שׁוֹפֵט לֹא יַעֲשֶׂה מִשְׁפַּט אֱמֶת:", "rashi_en": "חלילה לך FAR BE IT FROM THEE — It is a profanation (חולין) of Yourself. People will say, “That is what He usually busies Himself with: He destroys every one, righteous and wicked alike” —and thus did You indeed do to the generation of the Flood and to that of the dispersal of nations (Midrash Tanchuma, Vayera 8).<br><br>כדבר הזה ANYTHING LIKE THIS THING — neither this nor anything like it (Genesis Rabbah 49:10).<br><br>חלילה לך IT IS UNWORTHY OF THEE —in the world to come.<br><br>השופט כל הארץ SHALL NOT THE JUDGE OF ALL THE EARTH [DO JUSTICE]? — The 'ה of השופט is punctuated with Chataph Patach because the words express a question: “Should not He who is Judge practice true justice”? "}, {"ch": 18, "v": 26, "aliyah": 2, "heb": "וַיֹּ֣אמֶר יְהֹוָ֔ה אִם־אֶמְצָ֥א בִסְדֹ֛ם חֲמִשִּׁ֥ים צַדִּיקִ֖ם בְּת֣וֹךְ הָעִ֑יר וְנָשָׂ֥אתִי לְכׇל־הַמָּק֖וֹם בַּעֲבוּרָֽם׃", "onk": "וַאֲמַר יְיָ אִם אַשְׁכַּח בִּסְדוֹם חַמְשִׁין זַכָּאִין בְּגוֹ קַרְתָּא וְאֶשְׁבּוֹק לְכָל אַתְרָא בְּדִילְהוֹן:", "onk_en": "Adonoy said; If, in Sedom, I find fifty righteous within the city, I will bear with the entire place for their sake.", "pj": "וַאֲמַר יְיָ אִין אַשְׁכַּח בִּסְדוֹם חַמְשִׁין זַכָּאִין בְּגוֹ קַרְתָּא דְיֵצְלוּן קֳדָמַי וְאֶשְׁבּוֹק לְכָל אַרְעָא בְּגִינְהוֹם", "pj_en": "And the Lord said, If I find in Sedom fifty innocent in the midst of the city who pray before Me, I will forgive all the land on their account.", "tj": "", "tj_en": "", "rashi": "<b>אם אמצא בסדם וגו' לכל המקום.<\/b> לְכָל הַכְּרַכִּים; וּלְפִי שֶׁסְּדוֹם הָיְתָה מֶטְרוֹפּוֹלִין וַחֲשׁוּבָה מִכֻּלָּם, תָּלָה בָהּ הַכָּתוּב:", "rashi_en": "אם אמצא בסדום וגו' לכל המקום IF I FIND IN SODOM … FORGIVE ALL THE PLACE — all the cities, but because Sodom was the capital city of the district and the most important of all, Scripture subordinates the order cities to it. "}, {"ch": 18, "v": 27, "aliyah": 2, "heb": "וַיַּ֥עַן אַבְרָהָ֖ם וַיֹּאמַ֑ר הִנֵּה־נָ֤א הוֹאַ֙לְתִּי֙ לְדַבֵּ֣ר אֶל־אֲדֹנָ֔י וְאָנֹכִ֖י עָפָ֥ר וָאֵֽפֶר׃", "onk": "וַאֲתֵב אַבְרָהָם וַאֲמָר הָא כְעַן שָׁרֵיתִי לְמַלָּלָא <b>קֳדָם<\/b> יְיָ וַאֲנָא עָפָר וּקְטָם:", "onk_en": "Avraham responded and said, Here I have begun to speak to [<b>before<\/b>] my Master, and I am but dust and ashes.", "pj": "וְאָתֵיב אַבְרָהָם וַאֲמַר בְּבָעוּ בְּרַחֲמִין הָא כְּדוֹן שָׁרִיתִי לְמַלְלָא קֳדָם יְיָ וַאֲנָא מְתִיל לְעָפָר וּקְטָם", "pj_en": "And Abraham responded, and said, I pray for mercy. Behold, now, I have begun to speak before the Lord; I, who am as dust and ashes.", "tj": "", "tj_en": "", "rashi": "<b>הואלתי.<\/b> רָצִיתִי כְּמוֹ וַיּוֹאֶל מֹשֶׁה (שמות ב'):<br><br><b>ואנכי עפר ואפר.<\/b> וּכְבָר הָיִיתִי רָאוּי לִהְיוֹת עָפָר עַל יְדֵי הַמְּלָכִים, וְאֵפֶר עַל יְדֵי נִמְרוֹד, לוּלֵי רַחֲמֶיךָ אֲשֶׁר עָמְדוּ לִי:", "rashi_en": "הואלתי means I am willing to speak, just as (Exodus 2:21) “And Moses was pleased (ויואל) [to dwell with the man]”. <br><br>ואנכי עפר ואפר I Am BUT DUST AND ASHES — I would long ago have been reduced to dust by the kings and to ashes by Nimrod had it not been that Thy mercies stood by me (Genesis Rabbah 49:11). "}, {"ch": 18, "v": 28, "aliyah": 2, "heb": "א֠וּלַ֠י יַחְסְר֞וּן חֲמִשִּׁ֤ים הַצַּדִּיקִם֙ חֲמִשָּׁ֔ה הֲתַשְׁחִ֥ית בַּחֲמִשָּׁ֖ה אֶת־כׇּל־הָעִ֑יר וַיֹּ֙אמֶר֙ לֹ֣א אַשְׁחִ֔ית אִם־אֶמְצָ֣א שָׁ֔ם אַרְבָּעִ֖ים וַחֲמִשָּֽׁה׃", "onk": "<b>מָאִים<\/b> יַחְסְרוּן חַמְשִׁין זַכָּאִין חַמְשָׁא הַתְחַבֵּל בְּחַמְשָׁא יָת כָּל קַרְתָּא וַאֲמַר לָא אֲחַבֵּל אִם אַשְׁכַּח תַּמָּן אַרְבְּעִין וְחַמְשָׁא:", "onk_en": "But suppose [<b>perhaps<\/b>] they lack five of the fifty righteous? Will You destroy all the city because of five? He said, I will not destroy if I find forty-five there.", "pj": "מָאִים חַסְרִין מִן חַמְשִׁין זַכָּאִין חַמְשָׁא הֲתַחֲבֵּל בְּגִין חַמְשָׁא דְחַסְרִין לְזוֹעֵר יַת כָּל קַרְתָּא וַאֲמַר לָא אֵיחַבֵּל אִין אַשְׁכַּח תַּמָן אַרְבְּעִין וְחַמְשָׁא", "pj_en": "Perhaps of the fifty innocent persons, five may be wanting. On account of the five who may be wanting to Zoar, wilt Thou destroy the whole city? And He said, I will not destroy it, if I find there forty and five.", "tj": "", "tj_en": "", "rashi": "<b>התשחית בחמשה.<\/b> וַהֲלֹא הֵן ט' לְכָל כְּרַךְ, וְאַתָּה צַדִּיקוֹ שֶׁל עוֹלָם תִּצְטָרֵף עִמָּהֶם:", "rashi_en": "התשחית בחמשה WILT THOU DESTROY ON ACCOUNT OF THE FIVE — Will there not still be nine for each city, and You, the All-Righteous One of the Universe, can be counted with them to make up the original number of ten! (Genesis Rabbah 49:9). "}, {"ch": 18, "v": 29, "aliyah": 2, "heb": "וַיֹּ֨סֶף ע֜וֹד לְדַבֵּ֤ר אֵלָיו֙ וַיֹּאמַ֔ר אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם אַרְבָּעִ֑ים וַיֹּ֙אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה בַּעֲב֖וּר הָאַרְבָּעִֽים׃", "onk": "וְאוֹסֵיף עוֹד לְמַלָּלָא <b>קֳדָמוֹהִי<\/b> וַאֲמַר <b>מָאִים<\/b> יִשְׁתַּכְּחוּן תַּמָּן אַרְבְּעִין וַאֲמַר לָא <b>אֶעְבֵּד גְּמֵרָא<\/b> בְּדִיל אַרְבְּעִין:", "onk_en": "He [Avraham] continued to speak to [<b>before<\/b>] Him and said, Suppose [<b>Perhaps<\/b>] there are forty found there? He said, I will not do it [<b>inflict destruction<\/b>] for the sake of the forty.", "pj": "וְאוֹסִיף תּוּב לְמַלָלָא קֳדָמוֹי וְאָמַר מָאִים יִשְׁתַּכְּחוּן תַּמָן אַרְבְּעִין עֲשָרָה עֲשָרָה לְכָל קַרְתָּא לְאַרְבַּעַת קוּרְיַין וְזוֹעֵר דְחוֹבָהָא קַלִילִין שְׁבוֹק לָהּ בְּגִין רַחֲמָךְ וַאֲמַר לָא אַעֲבֵיד גְמִירָא בְּגִין זַכְוַת אַרְבְּעִין", "pj_en": "And he added yet to speak before Him, and said, Perhaps there may be forty found there; ten for each city of the four cities, and Zoar, whose guilt is lighter, forgive thou for Thy mercy's sake. And he said, I will not make an end for the sake of the forty innocent ones.", "tj": "", "tj_en": "", "rashi": "<b>אולי ימצאון שם ארבעים.<\/b> וְיִמָּלְטוּ ד' הַכְּרַכִּים וְכֵן ל' יַצִּילוּ ג' מֵהֶם אוֹ כ' יַצִּילוּ ב' מֵהֶם אוֹ י' יַצִּילוּ אֶחָד מֵהֶם:", "rashi_en": ". אולי ימצאון שם ארבעים PERADVENTURE THERE SHALL BE FORTY FOUND THERE — then let four cities be saved; so, too, let thirty save three of them and twenty save two of them or ten save one of them. "}, {"ch": 18, "v": 30, "aliyah": 2, "heb": "וַ֠יֹּ֠אמֶר אַל־נָ֞א יִ֤חַר לַֽאדֹנָי֙ וַאֲדַבֵּ֔רָה אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם שְׁלֹשִׁ֑ים וַיֹּ֙אמֶר֙ לֹ֣א אֶֽעֱשֶׂ֔ה אִם־אֶמְצָ֥א שָׁ֖ם שְׁלֹשִֽׁים׃", "onk": "וַאֲמַר לָא כְעַן יִתְקֹף קֳדָם (<small>נ\"י<\/small> רוּגְזָא) דַיְיָ וַאֲמַלֵּל <b>מָאִים<\/b> יִשְׁתַּכְּחוּן תַּמָּן תְּלָתִין וַאֲמַר לָא <b>אֶעְבֵּד גְּמֵרָא<\/b> אִם אַשְׁכַּח תַּמָּן תְּלָתִין:", "onk_en": "He said, Let not my Master show anger and I will [continue] to speak. Suppose [<b>Perhaps<\/b>] thirty are found there? He said, I will not do it [<b>inflict destruction<\/b>] if I find thirty there.", "pj": "וַאֲמַר לָא כְּדוּן יִתְקוֹף רוּגְזָא דְרִיבּוֹן כָּל עָלְמַיָא יְיָ וַאֲמַלֵיל מָאִים יִשְׁתַּכְּחוּן תַּמָן תְּלָתִין דְיֵצְלוּן עֲשָרָה עֲשָרָה לְכָל קַרְתָּא לִתְלַת קוּרְיַין וּצְבוֹיִם וְזוֹעַר שְׁבוֹק לָהֶם בְגִין רַחֲמָךְ וְאָמַר לָא אַעֲבֵיד גְמִירָא אִין אַשְׁכַּח תַּמָן תְּלָתִין", "pj_en": "And he said, Let not the displeasure of the Lord, the Lord of all the world, wax strong against me, and I will speak. Perhaps thirty who pray may be found there, ten for each of the three cities, and Zeboim and Zoar forgive them for Thy mercy's sake. And He said, I will not make an end if I find thirty there.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 31, "aliyah": 2, "heb": "וַיֹּ֗אמֶר הִנֵּֽה־נָ֤א הוֹאַ֙לְתִּי֙ לְדַבֵּ֣ר אֶל־אֲדֹנָ֔י אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם עֶשְׂרִ֑ים וַיֹּ֙אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּעֲב֖וּר הָֽעֶשְׂרִֽים׃", "onk": "וַאֲמַר הָא כְעַן שָׁרֵיתִי לְמַלָּלָא <b>קֳדָם<\/b> יְיָ <b>מָאִים<\/b> יִשְׁתַּכְּחוּן תַּמָּן עֶשְׂרִין וַאֲמַר לָא אֲחַבֵּל בְּדִיל עֶשְׁרִין:", "onk_en": "He said, Here I wished to speak to [<b>before<\/b>] my Master. Suppose [<b>Perhaps<\/b>] twenty are found there? He said, I will not destroy for the sake of the twenty.", "pj": "וַאֲמַר בְּבָעוּ בְּרַחֲמִין הָא כְדוּן שָׁרִיתִי לְמַלָלָא קֳדָם רִבּוֹן כָּל עָלְמַיָא יְיָ מָאִים יִשְׁתַּכְּחוּן עֶשְרִין דְיֵצְלוּן עֲשָרָה עֲשָרָה לְתַרְתֵּין קוּרְיַין וְלִתְלַת שְׁבוֹק לְהוֹם בְּגִין רַחֲמָךְ וַאֲמַר לָא אֵיחַבֵּל בְּגִין זַכְוַות עֶשְרִין", "pj_en": "And he said, Imploring mercy, I have now begun to speak before the Lord, the Lord of all the world. Perhaps twenty who pray may be found; ten in each of the two cities, and the three forgive Thou for Thy mercy's sake! And He said, I will not destroy for the sake of the twenty innocent.", "tj": "", "tj_en": "", "rashi": "<b>הואלתי.<\/b> רָצִיתִי, כְּמוֹ וַיּוֹאֶל מֹשֶׁה (שמות ב'):", "rashi_en": "הואלתי means I am willing to speak, just as (Exodus 2:21) “And Moses was pleased (ויואל) [to dwell with the man]”."}, {"ch": 18, "v": 32, "aliyah": 2, "heb": "וַ֠יֹּ֠אמֶר אַל־נָ֞א יִ֤חַר לַֽאדֹנָי֙ וַאֲדַבְּרָ֣ה אַךְ־הַפַּ֔עַם אוּלַ֛י יִמָּצְא֥וּן שָׁ֖ם עֲשָׂרָ֑ה וַיֹּ֙אמֶר֙ לֹ֣א אַשְׁחִ֔ית בַּעֲב֖וּר הָעֲשָׂרָֽה׃", "onk": "וַאֲמַר <b>לָא כְעַן יִתְקֹף קֳדָם יְיָ<\/b> וֶאֱמַלֵּל בְּרַם זִמְנָא הָדָא מָאִים יִשְׁתַּכְּחוּן תַּמָּן עַשְׂרָא וַאֲמַר לָא אֲחַבֵּל בְּדִיל עַשְׂרָא:", "onk_en": "He said, Let not my Master show anger [<b>Let there not be anger before my Master<\/b>], and I will speak just once more. Suppose [<b>Perhaps<\/b>] ten are found there? He said, I will not destroy for the sake of the ten.", "pj": "וַאֲמַר בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ לָא כְּדוֹן יִתְקוֹף רוּגְזָא דְרִבּוֹן כָּל עָלְמַיָא יְיָ וַאֲמַלֵיל בְּרַם זִמְנָא הָדָא מָאִים יִשְׁתַּכְּחוּן תַּמָן עֲשָרָה וַנְהִי אֲנָא וְאִינוּן וְנִבְעֵי רַחֲמִין עַל כָּל אַתְרָא וְתִשְׁבּוֹק לְהוֹם וַאֲמַר לָא אֲחַבֵּל בְּגִין זַכְוַות עֲשָרָה", "pj_en": "And he said, I implore mercy before Thee! Let not the anger of the Lord,the Lord of all the world, grow strong, and I will speak only this time. Perhaps ten may be found there; and I and they will pray for mercy upon all the land, and Thou wilt forgive them. And He said, I will not destroy for the sake of the ten who may be innocent.", "tj": "", "tj_en": "", "rashi": "<b>אולי ימצאון שם עשרה.<\/b> עַל הַפָּחוּת לֹא בִקֵּשׁ, אָמַר דוֹר הַמַּבּוּל הָיוּ ח', נֹחַ וּבָנָיו וּנְשֵׁיהֶם, וְלֹא הִצִּילוּ עַל דּוֹרָם; וְעַל ט' עַל יְדֵי צֵרוּף כְּבָר בִּקֵּשׁ וְלֹא מָצָא:", "rashi_en": "אולי ימצאון שם עשרה PERADVENTURE THERE SHALL TEN BE FOUND THERE — For a smaller number he did not plead because he knew already of two instances where less than ten had failed to save the wicked. He said to himself: In the generation of the Flood there were eight righteous people, viz., Noah, his sons and their wives, and they could not save their generation (Genesis Rabbah 49:13), and for nine in association with God he had already pleaded but had found no acceptance. "}, {"ch": 18, "v": 33, "aliyah": 2, "heb": "וַיֵּ֣לֶךְ יְהֹוָ֔ה כַּאֲשֶׁ֣ר כִּלָּ֔ה לְדַבֵּ֖ר אֶל־אַבְרָהָ֑ם וְאַבְרָהָ֖ם שָׁ֥ב לִמְקֹמֽוֹ׃", "onk": "<b>וְאִסְתַּלַּק יְקָרָא דַיְיָ<\/b> כַּד שֵׁצִי לְמַלָּלָא עִם אַבְרָהָם וְאַבְרָהָם תָּב לְאַתְרֵיהּ:", "onk_en": "Adonoy departed [<b>The glory of Adonoy ascended<\/b>] when He finished speaking to Avraham, and Avraham returned to his place.", "pj": "וְאִסְתַּלֵק יְקָרָא דַיְיָ כַּד פָּסַק לְמַלָלָא עִם אַבְרָהָם וְאַבְרָהָם תַּב לְאַתְרֵיהּ", "pj_en": "And the majesty of the {Shekinah of the} Lord went up when He had ceased to speak with Abraham; and Abraham returned to his place.", "tj": "", "tj_en": "", "rashi": "<b>וילך ה' וגו'.<\/b> כֵּיוָן שֶׁנִּשְׁתַּתֵּק הַסָּנֵגוֹר הָלַךְ לוֹ הַדַּיָּן:<br><br><b>ואברהם שב למקומו.<\/b> נִסְתַּלֵּק הַדַּיָּן נִסְתַּלֵּק הַסָּנֵגוֹר, וְהַקָּטֵיגוֹר מְקַטְרֵג וּלְפִיכָךְ וַיָּבֹאוּ שְׁנֵי הַמַּלְאָכִים סְדֹמָה, לְהַשְׁחִית:", "rashi_en": "'וילך ה 'וגו AND THE LORD WENT AWAY — As soon as the counsel for the defence had nothing more to say the Judge took his departure.<br><br>ואברהם שב למקומו AND ABRAHAM RETURNED UNTO HIS PLAGE — The Judge departed, the Advocate went away, but the Prosecutor continued his accusation, and on that account— ויבואו שני המלאכים סדומה “The two angels came to Sodom” to destroy it (Genesis Rabbah 49:14)."}, {"ch": 19, "v": 1, "aliyah": 3, "heb": "וַ֠יָּבֹ֠אוּ שְׁנֵ֨י הַמַּלְאָכִ֤ים סְדֹ֙מָה֙ בָּעֶ֔רֶב וְל֖וֹט יֹשֵׁ֣ב בְּשַֽׁעַר־סְדֹ֑ם וַיַּרְא־לוֹט֙ וַיָּ֣קׇם לִקְרָאתָ֔ם וַיִּשְׁתַּ֥חוּ אַפַּ֖יִם אָֽרְצָה׃", "onk": "וְעַלּוּ תְּרֵין מַלְאָכַיָּא לִסְדוֹם בְּרַמְשָׁא וְלוֹט יָתֵב בְּתַרְעָא (<small>נ\"י<\/small> בִּתְרַע) דִסְדוֹם וַחֲזָא לוֹט וְקָם לְקַדָּמוּתְהוֹן וּסְגִיד עַל אַפּוֹהִי עַל אַרְעָא:", "onk_en": "The two angels came to Sedom in the evening, while Lot was sitting at the gate of Sedom. Lot saw them, and he got up to greet them, and he bowed with his face to the ground.", "pj": "וְאָתוּ תְּרֵין מַלְאָכַיָא לִסְדוֹם בְּרַמְשָׁא וְלוֹט יָתֵיב בְּתַרְעָא דִסְדוֹם וַחֲמָא לוֹט וְקָם לִקְדָמוּתְהוֹן מִתְרַע מַשְׁכְּנָא וּסְגִיד אַנְפּוֹי עַל אַרְעָא", "pj_en": "Two angels came to Sedom at the evening; and Lot sat in the gate of Sedom. And Lot saw, and rose up to meet them from the gate of the tabernacle. And he bowed his face to the ground,", "tj": "וְלוֹט יָתִיב בְּפִּילֵי דִסְדוֹם וַחֲמָא יַתְהוֹן וּרְהַט וְשָׁאִיל בִּשְׁלָמְהוֹן וּסְגִיד עַל אַפּוֹי עַל אַרְעָא:", "tj_en": "And Lot sat in the gate of Sedom, and he saw them, and ran and saluted them, and bowed with his face to the ground.", "rashi": "<b>שני.<\/b> א' לְהַשְׁחִית אֶת סְדוֹם וא' לְהַצִּיל אֶת לוֹט, וְהוּא אוֹתוֹ שֶׁבָּא לְרַפְּאוֹת אַבְרָהָם, וְהַשְּׁלִישִׁי שֶׁבָּא לְבָשֵּׂר אֶת שָׂרָה, כֵּיוָן שֶׁעָשָׂה שְׁלִיחוּתוֹ נִסְתַּלֵּק לוֹ:<br><br><b>המלאכים.<\/b> וּלְהַלָּן קְרָאָם אֲנָשִׁים? כְּשֶׁהָיְתָה שְׁכִינָה עִמָּהֶם קְרָאָם אֲנָשִׁים; דָּבָר אַחֵר אֵצֶל אַבְרָהָם שֶׁכֹּחוֹ גָדוֹל וְהָיוּ הַמַּלְאָכִים תְּדִירִין אֶצְלוֹ כַּאֲנָשִׁים קְרָאָם אֲנָשִׁים, וְאֵצֶל לוֹט קְרָאָם מַלְאָכִים (בראשית רבה):<br><br><b>בערב.<\/b> וְכִי כָל כָּךְ שָׁהוּ הַמַּלְאָכִים מֵחֶבְרוֹן לִסְדוֹם? אֶלָּא מַלְאֲכֵי רַחֲמִים הָיוּ וּמַמְתִּינִים שֶׁמָּא יוּכַל אַבְרָהָם לְלַמֵּד עֲלֵיהֶם סַנֵּגוֹרְיָא:<br><br><b>ולוט ישב בשער סדום.<\/b> ישב כְּתִיב, אוֹתוֹ הַיּוֹם מִנּוּהוּ שׁוֹפֵט עֲלֵיהֶם (בראשית רבה):<br><br><b>וירא לוט וגו'.<\/b> מִבֵּית אַב
