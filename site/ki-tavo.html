<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;

}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;

  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }

.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }

.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }

.size-btn:active { background: var(--rule); }

.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }

.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 26, "v": 1, "aliyah": 1, "heb": "וְהָיָה֙ כִּֽי־תָב֣וֹא אֶל־הָאָ֔רֶץ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ נַחֲלָ֑ה וִֽירִשְׁתָּ֖הּ וְיָשַׁ֥בְתָּ בָּֽהּ׃", "onk": "וִיהֵי אֲרֵי תֵעוּל לְאַרְעָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא וְתֵירְתַהּ וְתֵיתֵב בַּהּ:", "onk_en": "When it happens that you come to the land that Adonoy, your God, is giving you as territory, nd you inherit it and settle it;", "pj": "והיה וִיהֵי אֲרוּם תֵּיעֲלוּן לְאַרְעָה דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן אַחֲסָנָא וְתֵירְתוּנָהּ וְתֵיתְבוּן בָּהּ", "pj_en": "AND when you have entered into the land, which the Lord thy God giveth you for an inheritance, and you possess and dwell in it;", "tj": "", "tj_en": "", "rashi": "<b>והיה כי תבוא … וירשתה וישבת בה.<\/b> מַגִּיד שֶׁלֹּא נִתְחַיְּבוּ בְּבִכּוּרִים עַד שֶׁכָּבְשׁוּ אֶת הָאָרֶץ וְחִלְּקוּהָ (עי' קידושין ל\"ז ע\"ב):", "rashi_en": "והיה כי תבוא … וירשתה וישבת בה AND IT SHALL BE, WHEN YOU COME IN [UNTO THE LAND …] AND POSSESS IT AND SETTLE THEREIN  — This tells us that they (the Israelites) were not under the obligation to bring first fruits until they had conquered the land and divided it (cf. Kiddushin 37b)."}, {"ch": 26, "v": 2, "aliyah": 1, "heb": "וְלָקַחְתָּ֞ מֵרֵאשִׁ֣ית&thinsp;<b>׀<\/b> כׇּל־פְּרִ֣י הָאֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽאַרְצְךָ֛ אֲשֶׁ֨ר יְהֹוָ֧ה אֱלֹהֶ֛יךָ נֹתֵ֥ן לָ֖ךְ וְשַׂמְתָּ֣ בַטֶּ֑נֶא וְהָֽלַכְתָּ֙ אֶל־הַמָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לְשַׁכֵּ֥ן שְׁמ֖וֹ שָֽׁם׃", "onk": "וְתִסַּב מֵרֵישׁ כָּל אִבָּא דְאַרְעָא דִּי תָעֵל מֵאַרְעָךְ דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ וּתְשַׁוֵּי בְסַלָּא וּתְהַךְ לְאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ לְאַשְׁרָאָה שְׁכִנְתֵּיהּ תַּמָּן:", "onk_en": "You are to take of the first of all the fruits of the soil that you bring from your land, that Adonoy, your God, is giving you, and place [it] in a basket; and go to the place that Adonoy, your God, chooses to house His Presence there.", "pj": "וְתִסְבוּן מִן שֵׁירוֹי בִּכּוּרַיָא דְמִתְבַּשְׁלִין מִן שֵׁירוּיָא בְּכָל אִבָּא דְאַרְעָא דְתָעֵיל מֵאַרְעָךְ דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן וּתְשַׁווּן בְּסַלָא וּתְהָכוּן לְאַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַמָן", "pj_en": "you shall take of the earliest first fruits which are ripe at the beginning of all the produce of the ground which thou ingatherest from the land which the Lord your God hath given you, and put them into a basket, and go unto the place which the Lord your God will choose that His Shekinah may dwell there.", "tj": "", "tj_en": "", "rashi": "<b>מראשית.<\/b> וְלֹא כָל רֵאשִׁית, שֶׁאֵין כָּל הַפֵּרוֹת חַיָּבִים בְּבִכּוּרִים אֶלָּא שִׁבְעַת הַמִּינִין בִּלְבַד, נֶאֱמַר כָּאן \"אֶרֶץ\" וְנֶאֱמַר לְהַלָּן (דברים ח') \"אֶרֶץ חִטָּה וּשְׂעֹרָה וְגוֹ'\", מַה לְּהַלָּן מִשִׁבְעַת הַמִּינִים שֶׁנִּשְׁתַּבְּחָה בָהֶן אֶרֶץ יִשְׂרָאֵל, אַף כָּאן שֶׁבַח אֶרֶץ יִשְׂרָאֵל שֶׁהֵן שִׁבְעַת מִינִין (ספרי; מנחות פ\"ד):<br><br><b>זית שמן.<\/b> זַיִת אֱגוֹרִי, שֶׁשַּׁמְנוֹ אָגוּר בְּתוֹכוֹ (ספרי; ברכות ל\"ט):<br><br><b>ודבש.<\/b> הוּא דְּבַשׁ תְּמָרִים (ספרי):<br><br><b>מראשית.<\/b> אָדָם יוֹרֵד לְתוֹךְ שָׂדֵהוּ וְרוֹאֶה תְאֵנָה שֶׁבִּכְּרָה, כוֹרֵךְ עָלֶיהָ גְּמִי לְסִימָן וְאוֹמֵר \"הֲרֵי זוֹ בִכּוּרִים\" (ספרי; בכורים ג'):", "rashi_en": "מראשית [THEN THOU SHALT TAKE] OF THE FIRST [OF ALL THE FRUIT OF THE GROUND] — of the first fruits, but not all the first fruits, for not all fruits are subject to the duty of bringing to the Temple their first-fruits, only the seven chief kinds of products of Israel alone, for there is mentioned here ארץ, “the land” (אשר תביא מארצך) and it states there (Deuteronomy 8:8) “a land (ארץ) of wheat, and barley, etc.”, (thus suggesting an analogy — that the fruits of the land referred to here are those enumerated there). What is it that Scripture is speaking of there? Of the seven products through which the land of Israel is distinguished! So, too, here it speaks only of the distinguished products of the land of Israel which are seven species only (Sifrei Devarim 297:4; Menachot 84b).<br><br>זית שמן mentioned as one of these distinguished products is the Agari olive, in which the oil is gathered in one place.<br><br>ודבש HONEY is honey of dates (not of bees).<br><br>מראשית OF ITS FIRST FRUITS — but not all the first fruits (not even of the seven species mentioned above) but when a man goes into his field and sees for the first time that year a fig that has ripened he binds a piece of straw round it as an indication and says “Lo, this is בכורים\" (and it suffices) (Sifrei Devarim 297:7; Mishnah Bikkurim 3:1)."}, {"ch": 26, "v": 3, "aliyah": 1, "heb": "וּבָאתָ֙ אֶל־הַכֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּיָּמִ֣ים הָהֵ֑ם וְאָמַרְתָּ֣ אֵלָ֗יו הִגַּ֤דְתִּי הַיּוֹם֙ לַיהֹוָ֣ה אֱלֹהֶ֔יךָ כִּי־בָ֙אתִי֙ אֶל־הָאָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהֹוָ֛ה לַאֲבֹתֵ֖ינוּ לָ֥תֶת לָֽנוּ׃", "onk": "וְתֵיתֵי לְוָת כַּהֲנָא דִּי יְהֵי בְּיוֹמַיָּא הָאִנּוּן וְתֵימַר לֵיהּ חַוֵּיתִי יוֹמָא דֵין <b>קֳדָם<\/b> יְיָ אֱלָהָךְ אֲרֵי עַלִּית לְאַרְעָא דִּי קַיִּים יְיָ לַאֲבָהָתָנָא לְמִתַּן לָנָא:", "onk_en": "You are to come to the <i>kohein<\/i> who will be [of service] during those days and you will say to him, ‘‘I ascertain today to [<b>before<\/b>] Adonoy, your God, that I have arrived in the land that Adonoy swore to our forefathers to give us.’’", "pj": "וּתְעַטְרוּן בְּסַלַיָא וְצִינַיָא וּפֵיפוּרַיָא וְתֵיעֲלוּן לְוַת כַּהֲנָא דִי יֶהֱוֵי מְמַנֵי לְכַהֵן רַב בְּיוֹמַיָא הָאִינוּן וְתֵימְרוּן לֵיהּ אוֹדִינָן יוֹמָא דֵין קֳדָם יְיָ אֱלָהָךְ אֲרוּם עָלֵינָן לְאַרְעָא דְקַיֵים יְיָ לְאַבְהָתָן לְמִתַּן לָנָא", "pj_en": "And you shall put crowns upon the baskets, hampers, and paper cases, and bring them to the priest appointed to be the chief priest in those days, and shall say to him: We acknowledge this day before the Lord thy God that we have come into the land which the Lord sware unto our fathers to give us.", "tj": "וְתֵיתֵי לְוַת כַּהֲנָא דִי יֶהֱוֵי מְמַנָא כהֵן רַב בְּיוֹמַיָא הָאִינוּן וְתֵמְרוּן לֵיהּ אוֹדִינָן וְשַׁבְּחִינָן יוֹמָא הָדֵין קֳדָם יְיָ אֱלָהָא אֲרוּם עָלֵינָן לְאַרְעָא דְקַיֵים מֵימְרָא דַיְיָ לְאַבְהָתָן לְמִתַּן לָן:", "tj_en": "And thou shalt come to the priest who will be appointed the chief priest in those days, and say to him: We give glory and thanks this day before the Lord thy God, that we have come into the land which the Word of the Lord did covenant unto our fathers to give us.", "rashi": "<b>אשר יהיה בימים ההם.<\/b> אֵין לְךָ אֶלָּא כֹּהֵן שֶׁבְּיָמֶיךָ כְּמוֹ שֶׁהוּא (ראש השנה כ\"ה):<br><br><b>ואמרת אליו.<\/b> שֶׁאֵינְךָ כְּפוּי טוֹבָה:<br><br><b>הגדתי היום.<\/b> פַּעַם אַחַת בַּשָּׁנָה וְלֹא שְׁתֵּי פְעָמִים (ספרי):", "rashi_en": "אשר יהיה בימים ההם [AND THOU SHALT GO UNTO THE PRIEST] THAT SHALL BE IN THOSE DAYS — These apparently redundant words suggest: you have none else than the priest who lives in your days (you are only concerned with him) (cf. Sifrei Devarim 298:3; Rosh Hashanah 25b; see also Rashi on Deuteronomy 17:9).<br><br>ואמרת אליו AND SAY UNTO HIM that you are not ungrateful (Sifrei Devarim 299:1).<br><br>הגדתי היום I PROFESS THIS DAY — [the expression \"this day\" implies that the declaration is made] one once a year, but not twice a year [even when bringing from a different fruit or crop] (Sifrei Devarim 299:2)."}, {"ch": 26, "v": 4, "aliyah": 1, "heb": "וְלָקַ֧ח הַכֹּהֵ֛ן הַטֶּ֖נֶא מִיָּדֶ֑ךָ וְהִ֨נִּיח֔וֹ לִפְנֵ֕י מִזְבַּ֖ח יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וְיִסַּב כַּהֲנָא סַלָּא מִידָךְ וְיַחְתִנֵּיהּ קֳדָם מַדְבְּחָא דַּיְיָ אֱלָהָךְ:", "onk_en": "The <i>kohein<\/i> shall then take the basket from your hand, and he will place it before the altar of Adonoy, your God.", "pj": "וְיִסַב כַּהֲנָא יַת סַלָא דְבִכּוּרַיָא מִן יְדָךְ וְיוֹבֵל וְיֵיתֵי וְיָרִים וְיָחִית וּמִבָּתַר כְּדֵין יַחְתוּנֵיהּ קֳדָם מַדְבְּחָא דַיְיָ אֱלָהָכוֹן", "pj_en": "And the priest shall receive the basket of early fruits from thy hand, and take, bring, uplift, and lower it, and afterward lay it down before the altar of the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>ולקח הכהן הטנא מידך.<\/b> לְהָנִיף אוֹתוֹ, כֹּהֵן מַנִיחַ יָדוֹ תַּחַת יַד הַבְּעָלִים וּמֵנִיף (סוכה מ\"ז):", "rashi_en": "ולקח הכהן המנה מידך AND THE PRIEST SHALL TAKE THE BASKET OUT OF THY HAND in order to wave it. The priest places his hand beneath the hands of the owner and so waves it (Sukkah 47b)."}, {"ch": 26, "v": 5, "aliyah": 1, "heb": "וְעָנִ֨יתָ וְאָמַרְתָּ֜ לִפְנֵ֣י&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔י וַיֵּ֣רֶד מִצְרַ֔יְמָה וַיָּ֥גׇר שָׁ֖ם בִּמְתֵ֣י מְעָ֑ט וַֽיְהִי־שָׁ֕ם לְג֥וֹי גָּד֖וֹל עָצ֥וּם וָרָֽב׃", "onk": "וְתָתֵיב וְתֵימַר קֳדָם יְיָ אֱלָהָךְ <b>לָבָן<\/b> אֲרַמָּאָה <b>בָּעָא<\/b> לְאוֹבָדָא יָת אַבָּא וּנְחַת לְמִצְרַיִם וְדָר תַּמָּן <b>בְּעַם זְעֵר<\/b> וַהֲוָה תַמָּן לְעַם רַב תַּקִּיף וְסַגִּי:", "onk_en": "And you shall then proclaim and say before Adonoy, your God, ‘‘[<b>Lovon<\/b>] the Aramite [<b>wanted to<\/b>] destroy[ed] my forefather, then he descended to Egypt and sojourned there with a tiny community [<b>small nation<\/b>]; and there he became a great people, powerful and numerous.", "pj": "וְתָתִיבוּן וְתֵימְרוּן קֳדָם יְיָ אֱלָהָכוֹן לַאֲרַם נַהֲרַיָא נַחֲתַת אָבוּנָן יַעֲקב מִן שֵׁירוּיָא וּבְעָא לְאוֹבְדוֹתֵיהּ וְשֵׁזְבֵיהּ מֵימְרָא דַיְיָ מִן יְדוֹי וּמִבָּתַר כְּדֵין נָחַת לְמִצְרַיִם וְאִיתוֹתַב תַּמָן לְעַם קָלִיל וַהֲוָה תַמָן לְאוּמָא רַבָּא וְתַקִיפָא וּמְסַגְיָא", "pj_en": "And you shall respond, and say before the Lord your God: Our father Jakob went down into Aram Naharia at the beginning, and (Laban) sought to destroy him; but the Word of the Lord saved him out of his hands. And afterwards went he down into Mizraim and sojourned there, a few people; but there did he become a great people, and mighty and many.", "tj": "", "tj_en": "", "rashi": "<b>וענית.<\/b> לְשׁוֹן הֲרָמַת קוֹל (סוטה ל\"ב):<br><br><b>ארמי אבד אבי.<\/b> מַזְכִּיר חַסְדֵי הַמָּקוֹם, אֲרַמִּי אֹבֵד אָבִי — לָבָן בִּקֵּשׁ לַעֲקֹר אֶת הַכֹּל כְּשֶׁרָדַף אַחַר יַעֲקֹב, וּבִשְׁבִיל שֶׁחָשַׁב לַעֲשׂוֹת חָשַׁב לוֹ הַמָּקוֹם כְּאִלּוּ עָשָׂה, שֶׁאֻמּוֹת הָעוֹלָם חוֹשֵׁב לָהֶם הַקָּבָּ\"ה מַחֲשָׁבָה כְּמַעֲשֶׂה (עי' ספרי):<br><br><b>וירד מצרימה.<\/b> וְעוֹד אֲחֵרִים בָּאוּ עָלֵינוּ לְכַלּוֹתֵנוּ, שֶׁאַחֲרֵי זֹאת יָרַד יַעֲקֹב לְמִצְרַיִם:<br><br><b>במתי מעט.<\/b> בְּשִׁבְעִים נֶפֶשׁ (ספרי):", "rashi_en": "וענית is an expression for raising one’s voice (speaking loudly) (Sotah 32b).<br><br>ארמי אבד אבי A SYRIAN DESTROYED MY FATHER — He mentions the loving kindness of the Omnipresent saying, ארמי אבד אבי, a Syrian destroyed my father, which means: “Laban wished to exterminate the whole nation” (cf. the Haggadah for Passover) when he pursued Jacob. Because he intended to do it the Omnipresent accounted it unto him as though he had actually done it (and therefore the expression אבד which refers to the past is used), for as far as the nations of the world are concerned the Holy One, blessed be He, accounts unto them intention as an actual deed (cf. Sifrei Devarim 301:3; Onkelos).<br><br>וירד מצרימה AND HE WENT DOWN INTO EGYPT — But there were others, too, “who came against us to destroy us” (cf. the Passover Haggadah), for afterwards Jacob went down into Egypt with his children and these were enslaved there).<br><br>במתי מעט WITH A FEW PERSONS — with only seventy souls (Sifrei Devarim 301:4; Onkelos)."}, {"ch": 26, "v": 6, "aliyah": 1, "heb": "וַיָּרֵ֧עוּ אֹתָ֛נוּ הַמִּצְרִ֖ים וַיְעַנּ֑וּנוּ וַיִּתְּנ֥וּ עָלֵ֖ינוּ עֲבֹדָ֥ה קָשָֽׁה׃", "onk": "וְאַבְאִישׁוּ לָנָא מִצְרַיִם וְעַנְּיָנָא וִיהָבוּ עֲלָנָא פָּלְחָנָא קַשְׁיָא:", "onk_en": "‘‘The Egyptians treated us badly and oppressed us, and they imposed hard labor upon us.", "pj": "וְאַבְאִישׁוּ לָנָא מִצְרָאֵי וְצַעֲרוּ יָתָנָא וִיהָבוּ עֲלָנָא פּוּלְחָנָא קַשְׁיָא", "pj_en": "But the Mizraee evil-treated and afflicted us, and laid heavy bondage upon us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 7, "aliyah": 1, "heb": "וַנִּצְעַ֕ק אֶל־יְהֹוָ֖ה אֱלֹהֵ֣י אֲבֹתֵ֑ינוּ וַיִּשְׁמַ֤ע יְהֹוָה֙ אֶת־קֹלֵ֔נוּ וַיַּ֧רְא אֶת־עׇנְיֵ֛נוּ וְאֶת־עֲמָלֵ֖נוּ וְאֶֽת־לַחֲצֵֽנוּ׃", "onk": "וְצַלֵּינָא <b>קֳדָם<\/b> יְיָ אֱלָהָא דַאֲבָהָתָנָא וְקַבִּיל יְיָ צְלוֹתָנָא וּגְלֵי <b>קֳדָמוֹהִי<\/b> עַמְלָנָא וְלֵאוּתָנָא וְדוּחֲקָנָא:", "onk_en": "‘‘We prayed to [<b>before<\/b>] Adonoy, God of our forefathers, and Adonoy accepted our prayer, and perceived [<b>before Him<\/b>] our oppression, and our labor, and the pressure upon us.", "pj": "וְצַלֵינָא קֳדָם יְיָ אֱלָהָא דְאַבְהָתָן וְקַבֵּל יְיָ צְלוֹתָנָא וּגְלֵי קֳדָמוֹי צַעֲרָן וְלֵיעוּתָן וְדַחֲקָן", "pj_en": "But we prayed before the Lord our God, and the Lord hearkened to our prayers, our affliction and our travail; and our oppression was manifest before Him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 8, "aliyah": 1, "heb": "וַיּוֹצִאֵ֤נוּ יְהֹוָה֙ מִמִּצְרַ֔יִם בְּיָ֤ד חֲזָקָה֙ וּבִזְרֹ֣עַ נְטוּיָ֔ה וּבְמֹרָ֖א גָּדֹ֑ל וּבְאֹת֖וֹת וּבְמֹפְתִֽים׃", "onk": "וְאַפְּקָנָא יְיָ מִמִּצְרַיִם בִּידָא תַקִּיפָא וּבִדְרָעָא מְרָמְמָא וּבְחֶזְוָנָא רַבָּא וּבְאָתִין וּבְמוֹפְתִין:", "onk_en": "‘‘And Adonoy took us out of Egypt with a powerful hand and with an extended arm, and with great display, and with signs, and with wonders.", "pj": "וְהַנְפָקָנָא יְיָ מִמִצְרַיִם בִּידָא תַקִיפְתָּא וּבִדְרַע מְרַמְמָא וּבְחֶזְוָונָא רַבָּא וּבְאָתִין וּבְתִמְהִין", "pj_en": "And the Lord brought us out of Mizraim with a mighty hand and uplifted arm, and with great visions, signs, and wonders,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 9, "aliyah": 1, "heb": "וַיְבִאֵ֖נוּ אֶל־הַמָּק֣וֹם הַזֶּ֑ה וַיִּתֶּן־לָ֙נוּ֙ אֶת־הָאָ֣רֶץ הַזֹּ֔את אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָֽשׁ׃", "onk": "וְאַיְתָנָא לְאַתְרָא הָדֵין וִיהַב לָנָא יָת אַרְעָא הָדָא אַרְעָא עָבְדָא חֲלַב וּדְבָשׁ:", "onk_en": "‘‘And He brought us to this place, and He gave us this land, a land flowing milk and honey.", "pj": "וְאַנְטֵיל יָתָנָא לְאַתְרָא הָדֵין וִיהַב לָנָא יַת אַרְעָא הָדָא אֲרַע דְפֵירָהָא שְׁמֵינִין כַּחֲלָב וְחַלְיַין כִּדְבָשׁ", "pj_en": "and brought us into this place, and gave us this land, a land of fruits rich as milk and sweet as honey.", "tj": "", "tj_en": "", "rashi": "<b>אל המקום הזה.<\/b> זֶה בֵּית הַמִּקְדָּשׁ:<br><br><b>ויתן לנו את הארץ.<\/b> כְּמַשְׁמָעוֹ:", "rashi_en": "אל המקום הזה [AND HE HATH BROUGHT US] UNTO THIS PLACE — This refers to the Temple where the worshipper was standing when he made this declaration.<br><br>ויתן לנו את הארץ means what it literally implies: AND HATH GIVEN US THE LAND."}, {"ch": 26, "v": 10, "aliyah": 1, "heb": "וְעַתָּ֗ה הִנֵּ֤ה הֵבֵ֙אתִי֙ אֶת־רֵאשִׁית֙ פְּרִ֣י הָאֲדָמָ֔ה אֲשֶׁר־נָתַ֥תָּה לִּ֖י יְהֹוָ֑ה וְהִנַּחְתּ֗וֹ לִפְנֵי֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ וְהִֽשְׁתַּחֲוִ֔יתָ לִפְנֵ֖י יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וּכְעַן הָא אַיְתֵתִי יָת רֵישׁ אִבָּא דְאַרְעָא דִּיהַבְתְּ לִי יְיָ וְתַחְתִנֵיהּ קֳדָם יְיָ אֱלָהָךְ וְתִסְגּוּד קֳדָם יְיָ אֱלָהָךְ:", "onk_en": "And now, see! I have brought the first of the fruits of the soil that You have given me Adonoy.’’ And you shall then place it before Adonoy, your God, and you will prostrate yourself in the presence of Adonoy, your God.", "pj": "וּכְדוֹן הָא אַיְתֵיתִי יַת שֵׁירוֹי בִּיכּוּרֵי אִבָּא דְאַרְעָא דִיהַבְתְּ לִי יְיָ וְתַחְתוּנֵיהּ קֳדָם יְיָ אֱלָהָךְ וְתִסְגוֹד קֳדָם יְיָ אֱלָהָךְ", "pj_en": "Now, therefore, behold, I have brought the early firstlings of the fruit of the land which thou hast given me, O Lord. And thou shalt lay them before the Lord thy God, and worship,", "tj": "", "tj_en": "", "rashi": "<b>והנחתו.<\/b> מַגִּיד שֶׁנּוֹטְלוֹ אַחַר הֲנָפַת הַכֹּהֵן וְאוֹחֲזוֹ בְיָדוֹ כְּשֶׁהוּא קוֹרֵא וְחוֹזֵר וּמֵנִיף (ספרי; סוכה מ\"ז):", "rashi_en": "והנחתו AND THOU SHALT PLACE IT [BEFORE THE LORD THY GOD] — This tells us that he takes it after the priest has waved it, and holds it in his hand whilst he makes the declaration, and then again waves it (Sukkah 47b; cf. Sifrei Devarim 301:33)."}, {"ch": 26, "v": 11, "aliyah": 1, "heb": "וְשָׂמַחְתָּ֣ בְכׇל־הַטּ֗וֹב אֲשֶׁ֧ר נָֽתַן־לְךָ֛ יְהֹוָ֥ה אֱלֹהֶ֖יךָ וּלְבֵיתֶ֑ךָ אַתָּה֙ וְהַלֵּוִ֔י וְהַגֵּ֖ר אֲשֶׁ֥ר בְּקִרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתֶחֱדֵי בְכָל טַבְתָא דִּי יְהַב לָךְ יְיָ אֱלָהָךְ <b>וְלֶאֱנַשׁ<\/b> בֵּיתָךְ אַתְּ וְלֵוָאֵי וְגִיּוֹרָא דִּי בֵינָךְ:", "onk_en": "You shall rejoice with all the good that Adonoy, your God, gave you and [<b>the members of<\/b>] your household; you, the levi, and the proselyte in your midst.", "pj": "וְתֶחֱדֵי בְּכָל טַבְתָּא דִיהַב לָךְ יְיָ אֱלָהָךְ וּלְאֵינַשׁ בָּתֵּיכוֹן וְתֶהֱנוּן וְתֵיכְלוּן אַתּוּן וְלֵיוָאֵי וְגִיוֹרֵי דְבֵינֵיכוֹן", "pj_en": "and rejoice in all the good which the Lord thy God giveth thee, thou and the men of thy house, and enjoy and eat, you, the Levites and the sojourners who are among you.", "tj": "", "tj_en": "", "rashi": "<b>ושמחת בכל הטוב.<\/b> מִכָּאן אָמְרוּ אֵין קוֹרִין מִקְרָא בִכּוּרִים אֶלָּא בִזְמַן שִׂמְחָה, מֵעֲצֶרֶת וְעַד הֶחָג, שֶׁאָדָם מְלַקֵּט תְּבוּאָתוֹ וּפֵרוֹתָיו וְיֵינוֹ וְשַׁמְנוֹ, אֲבָל מֵהֶחָג וָאֵילָךְ מֵבִיא וְאֵינוֹ קוֹרֵא (פסחים ל\"ו):<br><br><b>אתה והלוי.<\/b> אַף הַלֵּוִי חַיָּב בְּבִכּוּרִים אִם נָטְעוּ בְּתוֹךְ עָרֵיהֶם:<br><br><b>והגר אשר בקרבך.<\/b> מֵבִיא וְאֵינוֹ קוֹרֵא, שֶׁאֵינוֹ יָכוֹל לוֹמַר לַאֲבוֹתֵינוּ (תלמוד ירושלמי מ\"ש פ\"ה ה\"ה):", "rashi_en": "ושמחת בכל הטוב AND THOU SHALT REJOICE IN EVERY GOOD THING — From this they (the Rabbis) derived the law that the recital on the occasion of bringing the first fruits is made only during the joyful period of the year — from Pentecost till the Feast of Tabernacles — when a man is gathering in his grain, his fruits, his wine and his oil; but from Tabernacles onwards until Chanucah if he brings these, he does not make the recital (Pesachim 36b).<br><br>אתה והלוי THOU AND THE LEVITE — the Levites are also bound to bring the first fruits to the priest if they planted anything in the fields attached to their cities.<br><br>והגר אשר בקרבך AND THE STRANGER THAT IS AMONG YOU — he, too, brings the first fruits to the priest but does not make the recital, for he cannot truly say, as is prescribed, “[I profess this day … that I have come into the land which the Lord sware] unto our fathers” (v. 3) since his fathers were not Israelites (cf. Sifrei Devarim 301:37; Mishnah Bikkurim 1:4; Talmud Yerushalmi Maaser Sheni 5:5)."}, {"ch": 26, "v": 12, "aliyah": 2, "heb": "כִּ֣י תְכַלֶּ֞ה לַ֠עְשֵׂ֠ר אֶת־כׇּל־מַעְשַׂ֧ר תְּבוּאָתְךָ֛ בַּשָּׁנָ֥ה הַשְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽמַּעֲשֵׂ֑ר וְנָתַתָּ֣ה לַלֵּוִ֗י לַגֵּר֙ לַיָּת֣וֹם וְלָֽאַלְמָנָ֔ה וְאָכְל֥וּ בִשְׁעָרֶ֖יךָ וְשָׂבֵֽעוּ׃", "onk": "אֲרֵי תְשֵׁצֵי לְעַשָּׂרָא יָת כָּל מַעֲשַׂר עֲלַלְתָּךְ בְּשַׁתָּא תְלִיתָאָה שְׁנַת מַעְשְׂרָא וְתִתֵּן לְלֵוָאֵי לְגִיּוֹרָא לְיִתַּמָּא וּלְאַרְמְלָא וְיֵכְלוּן בְּקִרְוָיךְ וְיִשְׂבְּעוּן:", "onk_en": "When you finish tithing all the tithes of your produce in the third year, the year of the tithe; and you have given to the Levi, to the proselyte, to the orphan, and to the widow, so that they may eat within your portals to their satisfaction;", "pj": "אֲרוּם תְּשֵׁיצוּן לְעַשְרָא יַת כָּל מַעֲשַר עֲלַלְתָּךְ בְּשַׁתָּא תְלִיתֵיתָא דִשְׁמִיטִיתָא וְתִתְּנוּן מַעַשְרָא קַמָאָה לְלֵיוָאֵי מַעַשְרָא תִּנְיָינָא הוּא מַעֲשַר מִסְכְּנַיָא לְגִיוֹרָא לְיַתְמָא וּלְאַרְמַלְתָּא וְיֵיכְלוּן בְּקִרְוָוךְ וְיִשְבְּעוּן", "pj_en": "When you make an end of tything all the tenths of your produce in the third year, which is the year of release, you shall give the first tenth to the Levites, the second tenth, which is the tythe of the poor, to the stranger, the orphan, and widow, that they may eat in your cities, and be satisfied.", "tj": "אֲרוּם תְּשַׁלְמוּן לְמַעַשְרָא יַת כָּל מַעֲשֵר עֲלַלְתָּךְ בְּשַׁתָּא תְלִיתָיָא דְהִיא שְׁנַת מַעַשַרְתָּא דְמִסְכֵּינַיָא וְתִיתְּנוּן מַעֲשְרָא קֳדָמַיָיא לְלֵיוָאֵי מַעֲשַר מִסְכֵּינַיָא לְגִיוֹרֵי לְיַתְמָא וּלְאַרְמַלְתָּא וְיֵיכְלוּן בְּקִירְוֵיכוֹן וְיִשְבְּעוּן:", "tj_en": "When you finish tything all the tenths of your produce in the third year, which is the year of the tythe for the poor, you shall give the first tenth to the Levites, and the poor's tenth to the stranger, the orphan, and widow, that they may eat in your cities, and be satisfied.", "rashi": "<b>כי תכלה לעשר את כל מעשר תבואתך בשנה השלישת.<\/b> כְּשֶׁתִּגְמֹר לְהַפְרִישׁ מַעַשְׂרוֹת שֶׁל שָׁנָה הַשְּׁלִישִׁית; קָבַע זְמַן הַבִּעוּר וְהַוִּדּוּי בְּעֶרֶב הַפֶּסַח שֶׁל שָׁנָה הָרְבִיעִית, שֶׁנֶּאֱמַר (דברים י\"ד) \"מִקְצֵה שָׁלֹשׁ שָׁנִים תּוֹצִיא וְגוֹ'\", נֶאֱמַר כָּאן \"מִקֵּץ\", וְנֶאֱמַר לְהַלָּן \"מִקֵּץ שֶׁבַע שָׁנִים\" לְעִנְיַן הַקְהֵל (דברים ל\"א) מַה לְּהַלָן רֶגֶל אַף כָּאן רֶגֶל, אִי מַה לְּהַלָּן חַג הַסֻּכּוֹת אַף כָּאן חַג הַסֻּכּוֹת, תַּלְמוּד לוֹמַר <b>כי תכלה לעשר<\/b> מַעַשְׂרוֹת שֶׁל שָׁנָה הַשְּׁלִישִׁית, רֶגֶל שֶׁהַמַּעַשְׂרוֹת כָּלִין בּוֹ וְזֶהוּ פֶּסַח, שֶׁהַרְבֵּה אִילָנוֹת יֵשׁ שֶׁנִּלְקָטִין אַחַר הַסֻּכּוֹת; נִמְצְאוּ מַעְשְׂרוֹת שֶׁל שְׁלִישִׁית כָּלִין בְּפֶסַח שֶׁל רְבִיעִית, וְכָל מִי שֶׁשִּׁהָה מַעַשְׂרוֹתָיו הִצְרִיכוֹ הַכָּתוּב לְבַעֲרוֹ מִן הַבַּיִת (שם ה\"ו):<br><br><b>שנת המעשר.<\/b> שָׁנָה שֶׁאֵין נוֹהֵג בָּהּ אֶלָּא מַעֲשֵׂר אֶחָד מִשְּׁנֵי מַעַשְׂרוֹת שֶׁנָּהֲגוּ בִשְׁתֵּי שָׁנִים שֶׁלְּפָנֶיהָ, שֶׁשָּׁנָה רִאשׁוֹנָה שֶׁל שְׁמִטָּה נוֹהֵג בָּה מַעֲשֵׂר רִאשׁוֹן, כְּמוֹ שֶׁנֶּאֱמַר (במדבר י\"ח) \"כִּי תִקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל אֶת הַמַּעֲשֵׂר\", וּמַעֲשֵׂר שֵׁנִי, שֶׁנֶּאֱמַר (דברים י\"ד) \"וְאָכַלְתָּ לִפְנֵי ה' אֱלֹהֶיךָ … מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ\", הֲרֵי שְׁנֵי מַעַשְׂרוֹת, וּבָא וְלִמֶּדְךָ כָאן בַּשָּׁנָה הַשְּׁלִישִׁית שֶׁאֵין נוֹהֵג מֵאוֹתָן שְׁנֵי מַעַשְׂרוֹת אֶלָּא הָאֶחָד, וְאֵי זֶה? זֶה מַעֲשֵׂר רִאשׁוֹן, וְתַחַת מַעֲשֵׂר שֵׁנִי יִתֵּן מַעְשַׂר עָנִי, שֶׁנֶּאֱמַר כָּאן <b>ונתתה ללוי<\/b> אֶת אֲשֶׁר לוֹ — הֲרֵי מַעֲשֵׂר רִאשׁוֹן, <b>לגר ליתום ולאלמנה<\/b> — זֶה מַעְשַׂר עָנִי (עי' ספרי):<br><br><b>ואכלו בשעריך ושבעו.<\/b> תֵּן לָהֶם כְּדֵי שָׂבְעָן, מִכָּאן אָמְרוּ אֵין פּוֹחֲתִין לֶעָנִי בַּגֹּרֶן פָּחוֹת מֵחֲצִי קַב חִטִּים וְכוּ' (ספרי; תלמוד ירושלמי פאה פ\"ח ה\"ה):", "rashi_en": "כי תכלה לעשר את כל מעשר תבואתך בשנה השלישת WHEN THOU HAST FINISHED TITHING ALL THE TITHES OF THY INCREASE IN THE THIRD YEAR — this means: when you have finished the setting apart of the tithes of the third year. It (Scripture) has fixed the time for removing the tithes from the house (ביעור) and the confession regarding their proper disposition (ודוי) for the eve of the Passover festival of the fourth year, because it is stated, (Deuteronomy 14:28) “At the end (מקצה) of three years thou shall bring forth [all the tithe of thy increase in the same year, and shalt lay it up within thy gates]”. It uses here (in the verse just quoted) the words “at the end of” (מקצה) and it states further (Deuteronomy 31:10—11): “At the end of every seven years … [in the festival of Tabernacles, … thou shalt read this law before Israel]” with reference to the law of “public assembly”, in order to suggest an analogy. How is it in the case further on? It takes place at a festival period as stated! So, too, here, the rite takes place at a festival period. If so, one might argue: What is the case there? It takes place on the festival of Tabernacles; so, too, here the rite takes place on Tabernacles! Scripture, however, states here: When thou hast finished tithing the tithes of the third year, which thus points to a festival on which all tithes are finished and this is the Passover festival, for there are many trees the fruits of which are gathered after Tabernacles, and consequently the setting apart of tithes of the third year is at an end on Passover of the fourth year. And whoever had delayed his tithes until then Scripture declares him bound to clear them out by that time from his house (cf. Sifrei Devarim 302; Talmud Yerushalmi Maaser Sheni 5:6).<br><br>שנת המעשר [THE THIRD YEAR] WHICH IS THE YEAR OF TITHE — These apparently redundant words (for every year except the Sabbatical year it “a year of tithing”) suggest: that year in which only one of the two tithes that had to be separated in the previous two years is due (שנת המעשר, lit., the year of the tithe), viz., the “First Tithe”. For in the first year of the Shemitta-period the law of the “First Tithe” applies — as it is stated, (Numbers 28:26) “[And to the Levites shalt thou speak …] when ye take of the children of Israel the tithe” (which is the First Tithe) — and that of the “Second Tithe”, as it is stated, (Deuteronomy 14:22—23; cf. Rashi on the latter verse) “[Thou shalt truly tithe all the increase of thy seed … year by year], and thou shalt eat before the Lord thy God … the tithe of thy corn, of thy wine, and of thine oil”. You thus have two tithes every year, one that you must give the Levite and the other which you must consume yourself in Jerusalem (the “Second Tithe”). It now comes and teaches you here that, in the third year, of those two tithes mentioned only one is due, and which is it? It is the “First Tithe”. And that instead of the “Second Tithe” one has to give in the third year (and similarly in the sixth) the “Tithe of the Poor”, for it states here ונתת ללוי “AND THOU HAST GIVEN UNTO THE LEVITE”, i.e. given him that which is due to him — here you have mention of the “First Tithe”, לגר ליתום ולאלמנה “[AND THOU HAST GIVEN] … UNTO THE STRANGER, THE FATHERLESS, AND THE WIDOW” — this is the “Tithe of the Poor” (cf. Sifrei Devarim 303:1; see also Rashi on Deuteronomy 14:23 and 29).<br><br>ואכלו בשעריך ושבעו THAT THEY MAY EAT WITHIN THY GATES, AND BE SATISFIED — Give them sufficient to satisfy them. From here they (the Rabbis) derived the law: one must give the poor in the barn no less than half a kab of wheat or a kab of barley (Sifrei Devarim 303:2; Talmud Yerushalmi Peah 8:5; see also Rashi on Deuteronomy 14:29)."}, {"ch": 26, "v": 13, "aliyah": 2, "heb": "וְאָמַרְתָּ֡ לִפְנֵי֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ בִּעַ֧רְתִּי הַקֹּ֣דֶשׁ מִן־הַבַּ֗יִת וְגַ֨ם נְתַתִּ֤יו לַלֵּוִי֙ וְלַגֵּר֙ לַיָּת֣וֹם וְלָאַלְמָנָ֔ה כְּכׇל־מִצְוָתְךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑נִי לֹֽא־עָבַ֥רְתִּי מִמִּצְוֺתֶ֖יךָ וְלֹ֥א שָׁכָֽחְתִּי׃", "onk": "וְתֵימַר קֳדָם יְיָ אֱלָהָךְ פַּלֵּתִי קֹדֶשׁ <b>מַעְשְׂרָא<\/b> מִן בֵּיתָא וְאַף יְהָבִתֵּיהּ לְלֵוָאֵי וּלְגִיּוֹרָא לְיִתַּמָּא וּלְאַרְמְלָא כְּכָל פִּקּוּדָךְ דִּי פַקִּדְתַּנִי לָא עֲבָרִית מִפִּקּוּדָיךְ וְלָא אִתִּנְשֵׁיתִי:", "onk_en": "You shall declare before Adonoy, your God, ‘‘I have divested my estate of sacred [<b>tithe<\/b>] material, and I have also presented it to the Levi and also to the proselyte, the orphan, and the widow, totally according to Your command that You commanded me; I did not transgress any of Your commandments nor did I forget.", "pj": "וּמַעֲשַר תְּלִיתָאֵי תֵיסַק וְתֵיכוּל קֳדָם יְיָ אֱלָהָךְ וְתֵימַר הָא אַפְרַשְׁנָן קוּדְשַׁיָא מִן בֵּיתָא וּלְחוֹד יְהַבְנַן מַעֲשְרָא קַמָאָה לְלֵיוָאֵי מַעַשְרָא תִנְיָנָא לְגִיוֹרֵי לְיַתְמָא וּלְאַרְמְלָא הֵי כְּכָל תַּפְקֵידְתָּךְ דְפַקֵידְתָּנִי לָא עָבְרַת חֲדָא מִן פִּקוּדַיִךְ וְלָא אַנְשֵׁיִית", "pj_en": "But the third tenth you shall bring up, and eat before the Lord thy God, and thou shalt say: Behold, we have set apart the consecrations from the house, and have also given the first tenth to the Levites, the second tenth to the strangers, the fatherless, and the widow, according to the commandment which Thou hast commanded me. I have not transgressed one of Thy commandments, nor have I forgotten.", "tj": "", "tj_en": "", "rashi": "<b>ואמרת לפני ה' אלהיך.<\/b> הִתְוַדֵּה שֶׁנָּתַתָּ מַעַשְׁרוֹתֶיךָ:<br><br><b>בערתי הקדש מן הבית.<\/b> זֶה מַעֲשֵׂר שֵׁנִי וְנֶטַע רְבָעִי (ספרי; מע\"ש ה\"י) וְלִמֶּדְךָ שֶׁאִם שִׁהָה מַעַשְׂרוֹתָיו שֶׁל שְׁתֵּי שָׁנִים וְלֹא הֶעֱלָם לִירוּשָׁלַיִם שֶׁצָּרִיךְ לְהַעֲלוֹתָם עַכְשָׁו:<br><br><b>וגם נתתיו ללוי.<\/b> מַעֲשֵׂר רִאשׁוֹן: <b>וגם.<\/b> לְרַבּוֹת תְּרוּמָה וּבִכּוּרִים:<br><br><b>ולגר ליתום ולאלמנה.<\/b> זֶה מַעְשַׂר עָנִי (שם):<br><br><b>ככל מצותך.<\/b> נְתַתִּים כְּסִדְרָם, לֹא הִקְדַּמְתִּי תְרוּמָה לְבִכּוּרִים וְלֹא מַעֲשֵׂר לִתְרוּמָה וְלֹא שֵׁנִי לָרִאשׁוֹן, שֶׁהַתְּרוּמָה קְרוּיָה רֵאשִׁית, שֶׁהִיא רִאשׁוֹנָה מִשֶּׁנַעֲשָׂה דָגָן, וּכְתִיב (שמות כ\"ב) \"מְלֵאָתְךָ וְדִמְעֲךָ לֹא תְאַחֵר\" — לֹא תְשַׁנֶּה אֶת הַסֵּדֶר (ספרי):<br><br><b>לא עברתי ממצותיך.<\/b> לֹא הִפְרַשְׁתִּי מִמִּין עַל שֶׁאֵינוֹ מִינוֹ וּמִן הֶחָדָשׁ עַל הַיָּשָׁן (שם):<br><br><b>ולא שכחתי.<\/b> מִלְּבָרֶכְךָ עַל הַפְרָשַׁת מַעַשְׂרוֹת (ברכות מ'):", "rashi_en": "ואמרת לפני ה' אלהיך THEN THOU SHALT SAY BEFORE THE LORD THY GOD — Make the declaration (lit., confess) that you have given your tithes (Sifrei Devarim 303:5).<br><br>בערתי הקדש מן הבית I HAVE REMOVED THE HALLOWED THINGS FROM THE HOUSE — this refers to the “Second Tithe” which is termed קדש (cf. Leviticus 27:30 and Rashi thereon) and the “fruit of the vineyard in the fourth year of its growth” (נטע רבעי which is also termed קדש; cf. Leviticus 19:24) (Sifrei Devarim 303:6; Mishnah Maaser Sheni 5:10). Scripture teaches you that if he has delayed his “Second Tithes” of the first two years of the Shemitta period and has not taken them up to Jerusalem he must bring them up now (Mishnah Maaser Sheni 5:10).<br><br>וגם נתתיו ללוי AND I HAVE ALSO GIVEN THEM TO THE LEVITE — this refers to the “First Tithe”. וגם AND ALSO — the redundant word וגם serves also to include “Terumah” and the first-fruits that one has failed to give to the priests (Sifrei Devarim 303:7; Mishnah Maaser Sheni 5:10).<br><br>ולגר ליתום ולאלמנה AND [I ALSO HAVE GIVEN] … UNTO THE STRANGER, THE FATHERLESS, AND THE WIDOW — this refers to the “Tithe of the Poor” (Sifrei Devarim 303:8).<br><br>ככל מצותך ACCORDING TO ALL THY COMMANDMENTS — i.e. I have given them (all the sacred gifts mentioned) in the sequence prescribed for them: I have not set aside the heave-offering before the first-fruits, nor the tithe before the heave-offering, nor the “second” tithe before the “first”. This would indeed have meant altering the sequence, for the heave-offering is (after the first-fruits which are naturally the first of all sacred gifts) termed ראשית “firstling״ (in its relation to the tithes) because it is the first gift due after it (the crop) has become (bears the name of) corn (i.e. after it has been winnowed), and it states, (Exodus 22:28) “Thou shalt not delay to offer from thy fulness and thy liquids”, which means (see Rashi on that verse and Note thereon): Thou shalt not alter the prescribed order (cf. Sifrei Devarim 303:11; Mishnah Maaser Sheni 5:11).<br><br>לא עברתי ממצותיך I HAVE NOT TRANSGRESSED THY COMMANDMENTS — i.e. I have not set apart as a sacred gift grain from one species as a substitute for what was due from another species, nor have I separated grain from the new crop as a substitute for what was due from the old one (Sifrei Devarim 303:13; cf. Mishnah Maaser Sheni 5:11).<br><br>ולא שכחתי NOR HAVE I FORGOTTEN — i.e. forgotten to bless you on the occasion of setting the tithes apart (Sifrei Devarim 303:14; Mishnah Maaser Sheni 5:11; cf. Berachot 40b)."}, {"ch": 26, "v": 14, "aliyah": 2, "heb": "לֹא־אָכַ֨לְתִּי בְאֹנִ֜י מִמֶּ֗נּוּ וְלֹא־בִעַ֤רְתִּי מִמֶּ֙נּוּ֙ בְּטָמֵ֔א וְלֹא־נָתַ֥תִּי מִמֶּ֖נּוּ לְמֵ֑ת שָׁמַ֗עְתִּי בְּקוֹל֙ יְהֹוָ֣ה אֱלֹהָ֔י עָשִׂ֕יתִי כְּכֹ֖ל אֲשֶׁ֥ר צִוִּיתָֽנִי׃", "onk": "לָא אֲכָלִית בְּאֶבְלִי מִנֵּיהּ וְלָא <b>פַלֵּתִי<\/b> מִנֵּיהּ בְּדִמְסָאָב וְלָא יְהָבִית מִנֵּיהּ לְמִית קַבֵּלִית <b>לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָי עֲבָדִית כְּכֹל דִּי פַקִּדְתַּנִי:", "onk_en": "I did not eat of it when grieving, nor did I devour it when ritually defiled, nor did I make use of it for the dead; I have heeded the voice [<b>word<\/b>] of Adonoy, my God; I have fulfilled everything that You commanded me.", "pj": "לָא אֲכָלִית בְּיוֹמֵי אֶבְלִי מִנֵיהּ וְלָא אַפְרֵישִׁית מִנֵיהּ בִּמְסָאָב וְלָא יְהָבִית מִנֵיהּ תַּכְרִיכִין לְנֶפֶשׁ דְמִית שְׁמַעֲנָן בְּקַל מֵימְרָא דַיְיָ עֲבָדִית כְּכָל מַה דְפַקֵדְתָּנִי", "pj_en": "I have not eaten of it in the days of my mourning, nor separated from it for the unclean, neither have I given of it a covering for the soul of the dead: we have hearkened to the voice of the Word of the Lord; I have done according to all that Thou hast commanded me.", "tj": "לָא אַכְלִינָן בְּאֶבְלוּ מִנֵיהּ וְלָא אַפְרַשְׁנָן מִנֵיהּ בְּסוֹאֲבָא וְלָא יְהָבִינָן מִינֵיהּ תַּכְרִיכִין לִטְמֵי נְפָשׁ דְמִשְׁתְּמַעֲנָן בְּקַל מֵימְרָא דַיְיָ אֱלָהָן עֲבַדְנָן כְּכָל מַה דִי אִתְפַּקֵד עֲלָנָא:", "tj_en": "We have not eaten thereof in (our) mourning, nor separated therefrom for the unclean, nor given of it for the defiled soul; for we have obeyed the voice of the Word of the Lord our God; we have done according to all that Thou hast commanded us.", "rashi": "<b>לא אכלתי באוני ממנו.<\/b> מִכָּאן שֶׁאָסוּר לְאוֹנֵן (עי' ביכורים פ\"ב משנה ב'):<br><br><b>ולא בערתי ממנו בטמא.<\/b> בֵּין שֶׁאֲנִי טָמֵא וְהוּא טָהוֹר, בֵּין שֶׁאֲנִי טָהוֹר וְהוּא טָמֵא (ספרי); וְהֵיכָן הֻזְהַר עַל כָּךְ? \"לֹא תוּכַל לֶאֱכֹל בִּשְׁעָרֶיךָ\" (דברים י\"ב) זוֹ אֲכִילַת טֻמְאָה, כְּמוֹ שֶׁנֶּאֱמַר בִּפְסוּלֵי הַמֻּקְדָּשִׁים (שם ט\"ו) \"בִּשְׁעָרֶיךָ תֹּאכְלֶנּוּ הַטָּמֵא וְהַטָּהוֹר וְגוֹ'\", אֲבָל זֶה לֹא תוּכַל לֶאֱכֹל דֶּרֶךְ אֲכִילַת שְׁעָרֶיךָ הָאָמוּר בְּמָקוֹם אַחֵר (יבמות ע\"ג):<br><br><b>ולא נתתי ממנו למת.<\/b> לַעֲשׂוֹת לוֹ אָרוֹן וְתַכְרִיכִין:<br><br><b>שמעתי בקול ה' אלהי.<\/b> הֲבִיאוֹתִיו לְבֵית הַבְּחִירָה:<br><br><b>עשיתי ככל אשר צויתני.<\/b> שָׂמַחְתִּי וְשִׂמַּחְתִּי בוֹ (ספרי; מעש\"ש פ\"ה י\"ב):", "rashi_en": "לא אכלתי באני ממנו I HAVE NOT EATEN THEREOF IN MY MOURNING — From here we may derive that it (partaking of sacred gifts) is forbidden to an אונן (a technical term for the near relatives of a deceased, from the period of death to burial) (cf. Sifrei Devarim 303:15; Mishnah Bikkurim 2:2).<br><br>ולא בערתי ממנו בטמא NEITHER HAVE I CONSUMED ANY THEREOF UNCLEAN — i.e. whether I was unclean and it (the sacred gift) was clean, or I was clean and it unclean (Sifrei Devarim 303:16). But where has one been prohibited about this (that he declares that he has not infringed the command)? In the following passage: (Deuteronomy 12:17) “Thou mayest not eat within thy gates [the tithe of thy corn]” — this (the expression “within thy gates”) refers to eating sacred things in a state of uncleanness, just as is stated with reference to פסולי המקדשין (animals intended as sacrifices, but which have become unfit for that purpose) (Deuteronomy 15:22) “Thou mayest eat it within thy gates: the unclean and the clean person [may eat it alike]”. These you may eat, states Scripture, — but this (the tithes of thy corn in a state of uncleanness) you must not eat in the manner which is termed “eating within thy gates” (“the unclean and the clean together”) of which there is mention in another passage (Yevamot 73b).<br><br>ולא נתתי ממנו למת NOR HAVE I GIVEN THEREOF FOR THE CORPSE to prepare for it a coffin and shrouds (Mishnah Maaser Sheni 5:12).<br><br>שמעתי בקול ה' אלהי I HAVE HEARKENED TO THE VOICE OF THE LORD MY GOD — i.e. I have brought it into the Chosen House (Temple‎) (Mishnah Maaser Sheni 5:12).<br><br>עשיתי ככל אשר צויתני I HAVE DONE ACCORDING TO ALL THOU HAST COMMANDED ME — I have myself rejoiced and made others rejoice by it (Sifrei Devarim 303:19; Mishnah Maaser Sheni 5:12)."}, {"ch": 26, "v": 15, "aliyah": 2, "heb": "הַשְׁקִ֩יפָה֩ מִמְּע֨וֹן קׇדְשְׁךָ֜ מִן־הַשָּׁמַ֗יִם וּבָרֵ֤ךְ אֶֽת־עַמְּךָ֙ אֶת־יִשְׂרָאֵ֔ל וְאֵת֙ הָאֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑נוּ כַּאֲשֶׁ֤ר נִשְׁבַּ֙עְתָּ֙ לַאֲבֹתֵ֔ינוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָֽשׁ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִסְתְּכִי מִמְּדוֹר קָדְשָׁךְ מִן שְׁמַיָּא וּבָרֵךְ יָת עַמָּךְ יָת יִשְׂרָאֵל וְיָת אַרְעָא דִּי יְהַבְתְּ לָנָא כְּמָא דִי קַיֶּמְתָּא לַאֲבָהָתָנָא אֲרַע עָבְדָא חֲלַב וּדְבָשׁ:", "onk_en": "View, from Your sacred residence, from the heavens, and bless Your people, Yisroel and the soil which You have given us, as You swore to our forefathers, a land flowing with milk and honey.’’", "pj": "אוֹדִיק מִמְדוֹר בֵּית שְׁכִינַת קוּדְשָׁךְ מִן שְׁמַיָא וּבְרִיךְ יַת עַמָךְ יַת יִשְרָאֵל וְיַת אַרְעָא דִיהַבְתְּ לָנָא הֵיכְמָא דְקַיְימִית לְאַבְהָתָנָא אַרְעָא דְפֵירָהָא שְׁמֵינִין כַּחֲלָב וְחַלְיָין כִּדְבָשׁ", "pj_en": "Look down from heaven, from the habitation of the glory of Thy holiness, and bless Thy people Israel, and the land which Thou hast given to us, as Thou didst swear unto our fathers, a land of fruits rich as milk and sweet as honey.", "tj": "אַדֵיק בְּבָעוּ מִמְדוֹר בֵּית שְׁכִינַת יְקָרָךְ וְקוּדְשָׁךְ מִן שְׁמַיָא וּבְרִיךְ יַת עַמָךְ יַת יִשְרָאֵל וְיַת אַרְעָא דִיהָבִית לָן הֵיךְ מַה דְקַיֵימַת לְאַבְהָתָן אַרְעָא דְעַבְדָא פֵּירִין טָבִין נְקִיָין כַּחֲלָבָא וַחֲלַיַין וּטְעִימַן כְּדוּבְשָׁא:", "tj_en": "Look down, we beseech Thee, from the heavens, the habitation of Thy glory and Thy holiness, and bless Thy people Israel, and the land which Thou hast given us, as Thou didst swear unto our fathers (to give us a land) producing good fruits, pure as milk, sweet and delicious as honey.", "rashi": "<b>השקיפה ממעון קדשך.<\/b> עָשִׂינוּ מַה שֶּׁגָּזַרְתָּ עָלֵינוּ, עֲשֵׂה אַתָּה מַה שֶּׁעָלֶיךָ לַעֲשׂוֹת (ספרי), שֶׁאָמַרְתָּ (ויקרא כ\"ו) \"אִם בְּחֻקֹּתַי תֵּלֵכוּ … וְנָתַתִּי גִשְׁמֵיכֶם בְּעִתָּם\":<br><br><b>אשר נתתה לנו כאשר נשבעת לאבותינו.<\/b> לָתֵת לָנוּ וְקִיַּמְתָּ — <b>ארץ זבת חלב ודבש<\/b>:", "rashi_en": "השקיפה ממעון קדשך GLANCE DOWN FROM THE RESIDENCE OF THY HOLINESS . . [AND BLESS THY PEOPLE ISRAEL — “We have done what Thou hast laid upon us, do Thou now what has upon Thee to do, because Thou hast said, (Leviticus 25:3, 4) If ye walk in My ordinances … Then I will give you rain in its season etc.<br><br>אשר נתתה לנו כאשר נשבעת לאבתינו [BLESS THY PEOPLE ISRAEL, AND THE LAND,] WHICH THOU HAST GIVEN US, AS THOU SWAREST UNTO OUR FATHERS, to give it unto us, and indeed Thou hast kept Thy promise, giving us ארץ זבת חלב ודבש A LAND FLOWING WITH MILK AND HONEY."}, {"ch": 26, "v": 16, "aliyah": 3, "heb": "הַיּ֣וֹם הַזֶּ֗ה יְהֹוָ֨ה אֱלֹהֶ֜יךָ מְצַוְּךָ֧ לַעֲשׂ֛וֹת אֶת־הַחֻקִּ֥ים הָאֵ֖לֶּה וְאֶת־הַמִּשְׁפָּטִ֑ים וְשָׁמַרְתָּ֤ וְעָשִׂ֙יתָ֙ אוֹתָ֔ם בְּכׇל־לְבָבְךָ֖ וּבְכׇל־נַפְשֶֽׁךָ׃", "onk": "יוֹמָא הָדֵין יְיָ אֱלָהָךְ מְפַקְּדָךְ לְמֶעְבַּד יָת קְיָמַיָּא הָאִלֵּין וְיָת דִּינַיָּא וְתִטַּר וְתַעְבֵּד יָתְהוֹן בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ:", "onk_en": "This very day, Adonoy, your God, commands you to perform these statutes and the laws; you shall observe and perform them wholeheartedly and with your whole being.", "pj": "יוֹמָא דֵין יְיָ אֱלָהָכוֹן מְפַקֵיד לְכוֹן לְמֶעֱבַד יַת קְיָימַיָא הָאִלֵין וְיַת דִינַיָא וְתִטְרוּן וְתַעַבְדוּן יַתְהוֹן בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן", "pj_en": "This day doth the Lord our God command you to perform these statutes and judgments, which you shall observe and do with all your heart and with all your soul.", "tj": "", "tj_en": "", "rashi": "<b>היום הזה ה' אלהיך מצוך.<\/b> בְּכָל יוֹם יִהְיוּ בְעֵינֶיךָ חֲדָשִׁים כְּאִלּוּ בוֹ בַיּוֹם נִצְטַוֵּיתָ עֲלֵיהֶם (תנחומא):<br><br><b>ושמרת ועשית אותם.<\/b> בַּת קוֹל מְבָרַכְתּוֹ — הֵבֵאתָ בִכּוּרִים הַיּוֹם, תִּזְכֶּה לְשָׁנָה הַבָּאָה (שם):", "rashi_en": "היום הזה ה׳ אלהיך מצוך THIS DAY THE LORD THY GOD COMMANDETH THEE — This suggests: each day they (God’s commandments) should be to you as something new (not antiquated and something of which you have become tired), as though you had received the commands that very day for the first time (Midrash Tanchuma, Ki Tavo 1; cf. Rashi on Deuteronomy 11:13).<br><br>ושמרת ועשית אותם THOU SHALT THEREFORE KEEP AND DO THEM — A heavenly voice (בת קול) pronounces by these words a blessing upon him (the worshipper): “You have brought the first fruits today — you will be privileged to do so next year, too!” (Midrash Tanchuma, Ki Tavo 1)."}, {"ch": 26, "v": 17, "aliyah": 3, "heb": "אֶת־יְהֹוָ֥ה הֶאֱמַ֖רְתָּ הַיּ֑וֹם לִהְיוֹת֩ לְךָ֨ לֵֽאלֹהִ֜ים וְלָלֶ֣כֶת בִּדְרָכָ֗יו וְלִשְׁמֹ֨ר חֻקָּ֧יו וּמִצְוֺתָ֛יו וּמִשְׁפָּטָ֖יו וְלִשְׁמֹ֥עַ בְּקֹלֽוֹ׃", "onk": "יָת יְיָ חֲטַבְתָּ יוֹמָא דֵין לְמֶהֱוֵי לָךְ לֶאֱלָהּ וְלִמְהַךְ בְּאָרְחָן <b>דְּתָקְנָן קֳדָמוֹהִי<\/b> וּלְמִטַּר קְיָמוֹהִי וּפִקּוּדוֹהִי וְדִינוֹהִי <b>וּלְקַבָּלָא בְמֵימְרֵיהּ<\/b>:", "onk_en": "Adonoy, you have distinguised today to be a God for you and to go in His ways [<b>which are proper before Him<\/b>] and to guard His statutes and His commandments and His laws, and to obey Him [<b>accept His word<\/b>].", "pj": "יַת יְיָ חֲטַבְתּוּן חֲטִיבָא חֲדָא בְּעַלְמָא יוֹמָנָא דְהָכִין כְּתִיב שְׁמַע יִשְרָאֵל יְיָ אֱלָהָנָא יְיָ חָד מְטוֹל לְמֶהֱוֵי לָךְ לֵאלָהָא וְלִמְהַךְ בְּאָרְחָן דְתַקְנָן קֳדָמוֹי וּלְמִנְטוֹר קְיָימוֹי וּפִקוּדוֹי וְדִינוֹי וְלִמְקַבְּלָא לְמֵימְרֵיהּ", "pj_en": "The Lord have you confessed with one confession in the world this day; for so it is written, Hear, O Israel: The Lord our God is one Lord; that He may be thy God, and that thou mayest walk in the ways that are right before Him, and keep His statutes, commandments, and judgments, and be obedient unto His Word.", "tj": "יַת מֵימְרָא דַיְיָ אַמְלִיכְתּוּן עֲלֵיכוֹן יוֹמָא דֵין לְמֶהֱוֵי לְכוֹן לֶאֱלָהָא:", "tj_en": "You have chosen the Word of the Lord to be King over you this day, that He may be your God.", "rashi": "<b>האמרת … האמירך.<\/b> אֵין לָהֶם עֵד מוֹכִיחַ בַּמִּקְרָא, וְלִי נִרְאֶה שֶׁהוּא לְשׁוֹן הַפְרָשָׁה וְהַבְדָּלָה — הִבְדַּלְתָּ לְךָ מֵאֱלֹהֵי הַנֵּכָר לִהְיוֹת לְךָ לֵאלֹהִים וְהוּא הִפְרִישְׁךָ אֵלָיו מֵעַמֵּי הָאָרֶץ לִהְיוֹת לוֹ לְעַם סְגֻלָּה, וּמָצָאתִי לָהֶם עֵד וְהוּא לְשׁוֹן תִּפְאֶרֶת כְּמוֹ (תהלים צ\"ד) \"יִתְאַמְּרוּ כָּל פֹּעֲלֵי אָוֶן\":", "rashi_en": "האמרה, האמירך are words for the meaning of which there is no decisive proof in Scripture. It seems to me, however, that they are expressions denoting “separation” and “selection”: “You have singled Him out from all strange gods to be unto you as God — and He on His part, has singled you out from the nations on earth to be unto Him a select people”. [As far as this meaning is concerned I have found a parallel (lit., a witness) to it where it bears the meaning “glory”, as in (Psalms 94:4): “All wrongdoers glory in themselves”]."}, {"ch": 26, "v": 18, "aliyah": 3, "heb": "וַֽיהֹוָ֞ה הֶאֱמִֽירְךָ֣ הַיּ֗וֹם לִהְי֥וֹת לוֹ֙ לְעַ֣ם סְגֻלָּ֔ה כַּאֲשֶׁ֖ר דִּבֶּר־לָ֑ךְ וְלִשְׁמֹ֖ר כׇּל־מִצְוֺתָֽיו׃", "onk": "וַייָ חָטְבָךְ יוֹמָא דֵין לְמֶהֱוֵי לֵיהּ לְעַם חַבִּיב כְּמָא דִי מַלִּיל לָךְ וּלְמִטַּר כָּל פִּקּוּדוֹהִי:", "onk_en": "And Adonoy has distinguished you today to be for Him a treasured people as He said to you, and to guard all His commandments.", "pj": "וּמֵימְרָא דַיְיָ חֲטִיב יַתְכוֹן חֲטִיבָא חֲדָא בְּעַלְמָא יוֹמָנָא דְהָכִין כְּתִיב מַאן כְּוַות עַמְךָ יִשְרָאֵל עַם יְחִידָאֵי בְּאַרְעָא מְטוֹל לְמֶהֱוֵי לֵיהּ לְעַם חָבִיב הֵיכְמָא דְמַלֵיל לְכוֹן וּלְמִנְטַר כָּל פִּקוּדוֹי", "pj_en": "And the Word of the Lord doth acknowledge (or honour) you with one acknowledgment in the world this day; as it is written, Who is as Thy people Israel, a peculiar people upon the earth, to be to Him a people beloved, as He hath said unto you, and that you may obey all His commandments?", "tj": "וּמֵימְרָא דַיְיָ אַמְלָךְ עֲלֵיכוֹן לִשְׁמֵיהּ לְעַם חֲבִיבַיָא הֵיךְ סְגוּלָה הֵיךְ מַה דִי מַלֵיל לְכוֹן וּלְמִיטַר כָּל פִּיקוּדוֹי:", "tj_en": "But the Word of the Lord becometh the King over you for His Name's sake, as over a people beloved as a treasure, as He hath spoken to you, that you may obey all His commandments.", "rashi": "<b>כאשר דבר לך.<\/b> וִהְיִיתֶם לִי סְגֻלָּה:", "rashi_en": "כאשר דבר לך AS HE HATH PROMISED THEE — in the words (Exodus 19:5) “Ye shall be a select portion unto Me” (Mekhilta)."}, {"ch": 26, "v": 19, "aliyah": 3, "heb": "וּֽלְתִתְּךָ֣ עֶלְי֗וֹן עַ֤ל כׇּל־הַגּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִתְהִלָּ֖ה וּלְשֵׁ֣ם וּלְתִפְאָ֑רֶת וְלִֽהְיֹתְךָ֧ עַם־קָדֹ֛שׁ לַיהֹוָ֥ה אֱלֹהֶ֖יךָ כַּאֲשֶׁ֥ר דִּבֵּֽר׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְמִתְּנָךְ עִלָּאָה עַל כָּל עַמְמַיָּא דִּי עֲבַד לְתֻשְׁבָּחָא וּלְשׁוּם וְלִרְבוּ וּלְמֶהֱוָךְ עַם קַדִּישׁ <b>קֳדָם<\/b> יְיָ אֱלָהָךְ כְּמָא דִי מַלִּיל:", "onk_en": "And to place you superior to all the nations whom He made, for praise and for renown and for glory, and so that you may be a people sanctified to [<b>before<\/b>] Adonoy, your God, as He said.", "pj": "וּלְמַנָאָה יַתְכוֹן רָמִין וְגֵיוְתָנִין עַל כָּל עַמְמַיָא דְעָבַד לִרְבוּ וּלְשׁוּם דִיקַר וּלְשִׁיבְהוֹרָא מְטוּל לְמֶהֱוֵי עַם קַדִישׁ קֳדָם יְיָ אֱלָהָכוֹן הֵיכְמָא דְמַלֵיל", "pj_en": "And He will set you on high, and exalt you above all the peoples He hath made in greatness, and with a name of glory and splendour, that you may be a holy people before the Lord your God, as He hath spoken.", "tj": "", "tj_en": "", "rashi": "<b>ולהיותך עם קדש … כאשר דבר.<\/b> וִהְיִיתֶם לִי קְדֹשִׁים (שמות כ', כ\"ו):", "rashi_en": "ולהיתך עם קדש … כאשר דבר AND THAT THOU MAYEST BE AN HOLY PEOPLE … AS HE HATH SPOKEN — in the words, (Leviticus 20:26) “And ye shall be holy unto Me” (Mekhilta)."}, {"ch": 27, "v": 1, "aliyah": 4, "heb": "וַיְצַ֤ו מֹשֶׁה֙ וְזִקְנֵ֣י יִשְׂרָאֵ֔ל אֶת־הָעָ֖ם לֵאמֹ֑ר שָׁמֹר֙ אֶת־כׇּל־הַמִּצְוָ֔ה אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְכֶ֖ם הַיּֽוֹם׃", "onk": "וּפַקִּיד משֶׁה וְסָבֵי יִשְׂרָאֵל יָת עַמָּא לְמֵימָר טַר יָת כָּל תַּפְקֶדְתָּא דִּי אֲנָא מְפַקֵּד יָתְכוֹן יוֹמָא דֵין:", "onk_en": "Moshe and the elders of Yisroel commanded the people the following, ‘‘Keep all of the commandment that I am commanding you today.", "pj": "וּפַקֵיד משֶׁה וְסָבֵי יִשְרָאֵל יַת עַמָא לְמֵימָר טוּרוּ יַת כָּל תַּפְקֵידְתָּא דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא", "pj_en": "And Mosheh and the elders of Israel instructed the people, saying: Observe all the commandments which I command you this day.", "tj": "", "tj_en": "", "rashi": "<b>שמר את כל המצוה.<\/b> לְשׁוֹן הוֹוֶה, גרדנ\"ט בְּלַעַז:", "rashi_en": "שמר את כל המצוה — The word שמור is a frequentative present tense, gardant in old French, keeping in English"}, {"ch": 27, "v": 2, "aliyah": 4, "heb": "וְהָיָ֗ה בַּיּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת־הַיַּרְדֵּן֒ אֶל־הָאָ֕רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֣ן לָ֑ךְ וַהֲקֵמֹתָ֤ לְךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְשַׂדְתָּ֥ אֹתָ֖ם בַּשִּֽׂיד׃", "onk": "וִיהֵי בְּיוֹמָא דִּי תַעְבְּרוּן יָת יַרְדְּנָא לְאַרְעָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ וּתְקִים לָךְ אַבְנִין רַבְרְבִין וּתְסוּד יָתְהוֹן בְּסִידָא:", "onk_en": "When the day comes that you cross the Yardein to the land that Adonoy, your God, is giving you, erect large stones and coat them with whitewash.", "pj": "וִיהֵי בְּיוֹמָא דְתַעַבְרוּן יַת יוֹרְדְנָא לְאַרְעָא דַיְיָ אֱלָהָכוֹן יָהִיב לְכוֹן וּתְקוּמוּן לְכוֹן אַבְנִין רַבְרְבִין וּתְשׁוּעוּן יַתְהוֹן בְּגִירָא", "pj_en": "And it shall be on the day that you pass over the Jordana into the land which the Lord your God giveth you, that you shall erect for you great stones, and plaster them with lime;", "tj": "", "tj_en": "", "rashi": "<b>והקמת לך.<\/b> בַּיַּרְדֵּן, וְאַחֲ\"כָּ תּוֹצִיא מִשָּׁם אֲחֵרוֹת וְתִבְנֶה מֵהֶן מִזְבֵּחַ בְּהַר עֵיבָל; נִמְצֵאת אַתָּה אוֹמֵר שְׁלוֹשָׁה מִינֵי אֲבָנִים הָיוּ — שְׁתֵּים עֶשְׂרֵה בַּיַּרְדֵּן וּכְנֶגְדָן בַּגִּלְגָּל וּכְנֶגְדָּן בְּהַר עֵיבָל, כִּדְאִיתָא בְמַסֶּכֶת סוֹטָה (דף ל\"ה):", "rashi_en": "והקמת לך THEN THOU SHALT RAISE THEE UP [GREAT STONES] — in the Jordan, and afterwards you shall take out from there others and build an altar of them on Mount Eval. Consequently you must say that there were three sets of stones: twelve in the Jordan, an equal number in Gilgal, and another twelve on Mount Ebal, as is stated in Treatise Sotah 35b."}, {"ch": 27, "v": 3, "aliyah": 4, "heb": "וְכָתַבְתָּ֣ עֲלֵיהֶ֗ן אֶֽת־כׇּל־דִּבְרֵ֛י הַתּוֹרָ֥ה הַזֹּ֖את בְּעׇבְרֶ֑ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל־הָאָ֜רֶץ אֲֽשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֣יךָ&thinsp;<b>׀<\/b> נֹתֵ֣ן לְךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּדְבַ֔שׁ כַּאֲשֶׁ֥ר דִּבֶּ֛ר יְהֹוָ֥ה אֱלֹהֵֽי־אֲבֹתֶ֖יךָ לָֽךְ׃", "onk": "וְתִכְתּוֹב עֲלֵיהוֹן יָת כָּל פִּתְגָּמֵי אוֹרַיְתָא הָדָא בְּמֶעְבְּרָךְ בְּדִיל דִּי תֵעוּל לְאַרְעָא דַיְיָ אֱלָהָךְ יָהֵב לָךְ אַרְעָא עָבְדָא חֲלַב וּדְבַשׁ כְּמָא דִי מַלִּיל יְיָ אֱלָהָא דַאֲבָהָתָךְ לָךְ:", "onk_en": "You are to write on them all statements of this Torah upon your crossing; in order that you come to the land that Adonoy, your God, is giving you, a land flowing milk and honey, as promised by Adonoy, God of your forefathers, to you.", "pj": "וְתִכְתּוֹב עֲלֵיהוֹן יַת כָּל פִּתְגָמֵי אוֹרַיְיתָא הֲדָא בְּמֶעֱבַרְכוֹן מִן בִּגְלַל דְתֵיעֲלוּן לְאַרְעָא דַיְיָ אֱלָהָכוֹן יָהִיב לְכוֹן אַרְעָא דְפֵירָהָא שְׁמֵינִין כַּחֲלָב וְעַבְדִין דְבַשׁ הֵיכְמָא דְמַלִיל אֱלָהָא דְאַבְהַתְכוֹן לְכוֹן", "pj_en": "and thou shalt write upon them all the words of this law, when you go over to enter the land which the Lord your God giveth you, a land whose fruits are rich as milk and producing honey, as the Lord God of your fathers hath said to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 4, "aliyah": 4, "heb": "וְהָיָה֮ בְּעׇבְרְכֶ֣ם אֶת־הַיַּרְדֵּן֒ תָּקִ֜ימוּ אֶת־הָאֲבָנִ֣ים הָאֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְכֶ֛ם הַיּ֖וֹם בְּהַ֣ר עֵיבָ֑ל וְשַׂדְתָּ֥ אוֹתָ֖ם בַּשִּֽׂיד׃", "onk": "וִיהֵי בְּמֵעֲבָרְכוֹן יָת יַרְדְּנָא תְּקִימוּן יָת אַבְנַיָּא הָאִלֵּין דִּי אֲנָא מְפַקֵּד יָתְכוֹן יוֹמָא דֵין בְּטוּרָא דְעֵיבָל וּתְסוּד יָתְהוֹן בְּסִידָא:", "onk_en": "As soon as you have crossed the Yardein, set up these stones that I am commanding you today, on Mount Eival, and coat them with whitewash.", "pj": "וִיהֵי בִּזְמַן דְתַעַבְרוּן יַת יוֹרְדְנָא תְקִימוּן יַת אַבְנַיָא הָאִילֵין דַאֲנָא מְפַקֵיד יַתְכוֹן בְּטַוְורָא דְעֵיבָל וּתְשׁוּעוּן יַתְהוֹן בְּגִירָא", "pj_en": "When you pass over Jordana, you shall erect the stones that I command you on the mountain of Ebal, and plaster them with lime;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 5, "aliyah": 4, "heb": "וּבָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַיהֹוָ֖ה אֱלֹהֶ֑יךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא־תָנִ֥יף עֲלֵיהֶ֖ם בַּרְזֶֽל׃", "onk": "וְתִבְנֵי תַמָּן מַדְבְּחָא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ מַדְבַּח אַבְנִין לָא תְרִים עֲלֵיהוֹן פַּרְזְלָא:", "onk_en": "Build there an altar to [<b>before<\/b>] Adonoy, your God; an altar of stones; do not lift iron upon them.", "pj": "וְתִבְנוּן תַּמָן מַדְבְּחָא קֳדָם יְיָ אֱלָהָכוֹן מַדְבַּח אַבְנִין לָא תְרִים עֲלֵיהוֹן פַּרְזְלָא", "pj_en": "and you shall build there an altar before the Lord your God, an altar of stone, not lifting up iron upon it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 6, "aliyah": 4, "heb": "אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת־מִזְבַּ֖ח יְהֹוָ֣ה אֱלֹהֶ֑יךָ וְהַעֲלִ֤יתָ עָלָיו֙ עוֹלֹ֔ת לַיהֹוָ֖ה אֱלֹהֶֽיךָ׃", "onk": "אַבְנִין שָׁלְמִין תִּבְנֵי יָת מַדְבְּחָא דַּיְיָ אֱלָהָךְ וְתַסֵּק עֲלוֹהִי עֲלָוָן <b>קֳדָם<\/b> יְיָ אֱלָהָךְ:", "onk_en": "[Of] whole stones are you to build the altar of Adonoy, your God; and you are to bring upon it burnt-offerings to [<b>before<\/b>] Adonoy, your God.", "pj": "אַבְנִין שַׁלְמִין תִּבְנוּן יַת מַדְבְּחָא דַיְיָ אֱלָהָכוֹן וְתִסְקוּן עֲלוֹי עֲלַוָון קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "With perfect stones ye shall build an altar to the Lord your God,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 7, "aliyah": 4, "heb": "וְזָבַחְתָּ֥ שְׁלָמִ֖ים וְאָכַ֣לְתָּ שָּׁ֑ם וְשָׂ֣מַחְתָּ֔ לִפְנֵ֖י יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וְתִכּוֹס <b>נִכְסַת קוּדְשִׁין<\/b> וְתֵיכוּל תַּמָּן וְתֶחֱדֵי קֳדָם יְיָ אֱלָהָךְ:", "onk_en": "You are to slaughter peace [<b>sacred<\/b>]-offerings and eat [them] there; and you are to rejoice in the presence of Adonoy, your God.", "pj": "וְתִיכְסוּן נִכְסַת קוּדְשִׁין וְתֵיכְלוּן תַּמָן וְתֵיחֲדוּן קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "and offer sacrifices upon it before the Lord your God. And you shall immolate the consecrated victims, and eat there, and rejoice before the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 8, "aliyah": 4, "heb": "וְכָתַבְתָּ֣ עַל־הָאֲבָנִ֗ים אֶֽת־כׇּל־דִּבְרֵ֛י הַתּוֹרָ֥ה הַזֹּ֖את בַּאֵ֥ר הֵיטֵֽב׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִכְתּוֹב עַל אַבְנַיָּא יָת כָּל פִּתְגָּמֵי אוֹרַיְתָא הָדָא פָּרַשׁ יָאוּת:", "onk_en": "You are to write on the stones all the statements of this Torah, explained properly.", "pj": "וְתִכְתְּבוּן עַל אַבְנַיָא יַת כָּל פִּתְגָמֵי אוֹרַיְיתָא הֲדָא כְּתַב חָקִיק וּמְפָרַשׁ מִתְקְרֵי בְּחַד לִישָׁן וּמִיתַרְגֵם בְּשִׁבְעִין לִישָׁנִין", "pj_en": "And upon the stones you shall write all the words of this law with writing deeply (engraven) and distinct, which shall be read in one language, but shall be interpreted in seventy languages.", "tj": "וְתִכְתְּבוּן עַל אַבְנַיָא יַת כָּל מִלֵי שְׁבַח אוֹרַייתָא הָדָא כְּתַב חָקִיק וּמְפָרֵשׁ טַבְאוֹת מִתְקְרֵי וּמְתַּרְגֵם בְּשִׁבְעִין לָשׁוֹן:", "tj_en": "And you shall write upon the stones all the glorious words of this law in writing deep and plain, to be well read, and to be interpreted in seventy tongues.", "rashi": "<b>באר היטב.<\/b> בְּשִׁבְעִים לָשׁוֹן (שם ל\"ב):", "rashi_en": "באר היטב EXPLAINING THEM WELL — i.e. in seventy languages (Sotah 32a; cf. Rashi on Deuteronomy 1:5)."}, {"ch": 27, "v": 9, "aliyah": 4, "heb": "וַיְדַבֵּ֤ר מֹשֶׁה֙ וְהַכֹּהֲנִ֣ים הַלְוִיִּ֔ם אֶ֥ל כׇּל־יִשְׂרָאֵ֖ל לֵאמֹ֑ר הַסְכֵּ֤ת&thinsp;<small>׀<\/small>&thinsp;וּשְׁמַע֙ יִשְׂרָאֵ֔ל הַיּ֤וֹם הַזֶּה֙ נִהְיֵ֣יתָֽ לְעָ֔ם לַיהֹוָ֖ה אֱלֹהֶֽיךָ׃", "onk": "וּמַלִּיל משֶׁה וְכָהֲנַיָּא לֵוָאֵי לְכָל יִשְׂרָאֵל לְמֵימָר אֲצֵית וּשְׁמַע יִשְׂרָאֵל יוֹמָא הָדֵין הֲוֵיתָא לְעַמָּא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ:", "onk_en": "Moshe and the <i>kohanim<\/i>-Levi’im addressed all of Yisroel, to say, ‘‘Take heed and accept, Yisroel! [On] this day you have become a people to [<b>before<\/b>] Adonoy, your God.", "pj": "וּמַלֵיל משֶׁה וְכַהֲנַיָא בְּנֵי לֵוִי עִם כָּל עַמָא לְמֵימָר צַיְיתוּ וּשְׁמָעוּ יִשְרָאֵל יוֹמָנָא הָדֵין אִתְבְּחַרְתּוּן לְמֶהֱוֵי עַמָא קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "And Mosheh and the priests, the sons of Levi, spake with all the people, saying: Listen, O Israel, and hear: This day are you chosen to be a people before the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>הסכת.<\/b> כְּתַרְגּוּמוֹ:<br><br><b>היום הזה נהיית לעם.<\/b> בְּכָל יוֹם יִהְיוּ בְעֵינֶיךָ כְּאִלּוּ הַיּוֹם בָּאתָ עִמּוֹ בַּבְּרִית (ברכות ס\"ג):", "rashi_en": "הסכת — Understand this as the Targum does: אצית listen! <br><br>היום הזה נהיית לעם THIS DAY YOU HAVE BECOME THE PEOPLE [OF THE LORD YOUR GOD] — On each day it should appear to you as though it were “today” that you have entered the covenant with him (Berachot 63b)."}, {"ch": 27, "v": 10, "aliyah": 4, "heb": "וְשָׁ֣מַעְתָּ֔ בְּק֖וֹל יְהֹוָ֣ה אֱלֹהֶ֑יךָ וְעָשִׂ֤יתָ אֶת־מִצְוֺתָו֙ וְאֶת־חֻקָּ֔יו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּֽוֹם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וּתְקַבֵּל לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ וְתַעְבֵּד יָת פִּקּוּדוֹהִי וְיָת קְיָמוֹהִי דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין:", "onk_en": "You are to obey [<b>accept the word of<\/b>] Adonoy, your God, and perform His commandments and His statutes that I am commanding you today.’’", "pj": "וּתְקַבְּלוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן וְתַעַבְדוּן יַת פִּקוּדוֹי וְיַת קְיָימוֹי דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָא דֵין", "pj_en": "Hearken, therefore, to the Word of the Lord your God, and perform His commandments which I command you today.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 11, "aliyah": 5, "heb": "וַיְצַ֤ו מֹשֶׁה֙ אֶת־הָעָ֔ם בַּיּ֥וֹם הַה֖וּא לֵאמֹֽר׃", "onk": "וּפַקִּיד משֶׁה יָת עַמָּא בְּיוֹמָא הַהוּא לְמֵימָר:", "onk_en": "Moshe commanded the people on that day, to say,", "pj": "וּפַקֵיד משֶׁה יַת עַמָא בְּיוֹמָא הַהוּא לְמֵימָר", "pj_en": "And Mosheh instructed the people that day, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 12, "aliyah": 5, "heb": "אֵ֠לֶּה יַֽעַמְד֞וּ לְבָרֵ֤ךְ אֶת־הָעָם֙ עַל־הַ֣ר גְּרִזִ֔ים בְּעׇבְרְכֶ֖ם אֶת־הַיַּרְדֵּ֑ן שִׁמְעוֹן֙ וְלֵוִ֣י וִֽיהוּדָ֔ה וְיִשָּׂשכָ֖ר וְיוֹסֵ֥ף וּבִנְיָמִֽן׃", "onk": "אִלֵּין יְקוּמוּן לְבָרָכָא יָת עַמָּא עַל טוּרָא דִגְרִזִּים בְּמֵעֲבָרְכוֹן יָת יַרְדְּנָא שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשׂכָר וְיוֹסֵף וּבִנְיָמִן:", "onk_en": "‘‘The following will stand to bless the people on Mount Gerizim, upon your crossing the Yardein: Shimon and Levi and Yehudah, and Yisachar and Yoseif and Binyomin.", "pj": "אִלֵין שִׁבְטַיָא יְקוּמוּן לְבָרְכָא יַת עַמָא עַל טַוְורָא דִגְרִיזִים בְּמֶעֱבַרְכוֹן יַת יוֹרְדְנָא שִׁמְעוֹן וְלֵוִי וִיהוּדָה וִישָשׁכָר וְיוֹסֵף וּבִנְיָמִין", "pj_en": "These tribes shall stand to bless the people on the mountain of Gerezim when you have passed the Jordan,-Shemeon, Levi, Jehudah, Issakar, Joseph, and Benjamin;", "tj": "", "tj_en": "", "rashi": "<b>לברך את העם.<\/b> כִּדְאִיתָא בְמַסֶּכֶת סוֹטָה (דף ל\"ב): שִׁשָּׁה שְׁבָטִים עָלוּ לְרֹאשׁ הַר גְּרִיזִים וְשִׁשָּׁה לְרֹאשׁ הַר עֵיבָל וְהַכֹּהֲנִים וְהַלְוִיִּם וְהָאָרוֹן לְמַטָּה בָּאֶמְצַע, הָפְכוּ לְוִיִּים פְּנֵיהֶם כְּלַפֵּי הַר גְּרִיזִים וּפָתְחוּ בַבְּרָכָה, \"בָּרוּךְ הָאִישׁ אֲשֶׁר לֹא יַעֲשֶׂה פֶסֶל וּמַסֵּכָה וְגוֹ'\", וְאֵלּוּ וָאֵלּוּ עוֹנִין אָמֵן. חָזְרוּ וְהָפְכוּ פְּנֵיהֶם כְּלַפֵּי הַר עֵיבָל וּפָתְחוּ בַקְּלָלָה וְאוֹמְרִים \"אָרוּר הָאִישׁ אֲשֶׁר יַעֲשֶׂה פֶסֶל וְגוֹ'\", וְכֵן כֻּלָּם עַד \"אָרוּר אֲשֶׁר לֹא יָקִים\":", "rashi_en": "לברך את העם [THESE SHALL STAND UP …] TO BLESS THE PEOPLE — The procedure was as is found in Treatise Sotah 32a: Six tribes ascended the top of Mount Gerizim and the other six the top of Mount Ebal, the priests, the Levites and the Ark remaining below in the midst (i.e. in the valley between). The Levites turned their faces towards Mount Gerizim and began to recite the blessing: “Blessed be the man that does not make any graven or molten image etc.”, and both these and those (the tribes on Mount Gerizim and those on Mount Ebal) answered “Amen”! Then they turned their faces towards Mount Ebal and began to recite the curse, saying: “Cursed be the man who maketh any graven [or molten image]” — and so in the case of all of them (the curses set forth here) till the last: “Cursed be he that does not uphold [all the words of this law to do them]” (cf. Rashi on Deuteronomy 11:29)."}, {"ch": 27, "v": 13, "aliyah": 5, "heb": "וְאֵ֛לֶּה יַֽעַמְד֥וּ עַל־הַקְּלָלָ֖ה בְּהַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְאָשֵׁ֔ר וּזְבוּלֻ֖ן דָּ֥ן וְנַפְתָּלִֽי׃", "onk": "וְאִלֵּין <b>יְקוּמוּן<\/b> עַל <b>לְוָטַיָּא<\/b> בְּטוּרָא דְעֵיבָל רְאוּבֵן גָּד וְאָשֵׁר וּזְבוּלֻן דָּן וְנַפְתָּלִי:", "onk_en": "And the following will stand for the curse[<b>rs<\/b>] at Mount Eival: Reuvein, Gad and Asher, and Zevulun, Don and Naftoli.", "pj": "וְאִלֵין שִׁבְטַיָא יְקוּמוּן עַל לְוָטַיָא בְּטַוְורָא דְעֵיבָל רְאוּבֵן גָד וְאָשֵׁר וּזְבוּלֻן דָן וְנַפְתָּלִי", "pj_en": "and these tribes shall stand (to pronounce) the curses on the mountain of Ebal, - Reuben, Gad, Asher, Zebulon, Dan, and Naphtali.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 14, "aliyah": 5, "heb": "וְעָנ֣וּ הַלְוִיִּ֗ם וְאָ֥מְר֛וּ אֶל־כׇּל־אִ֥ישׁ יִשְׂרָאֵ֖ל ק֥וֹל רָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיתִיבוּן לֵוָאֵי וְיֵימְרוּן לְכָל אֱנַשׁ יִשְׂרָאֵל קָלָא רָמָא:", "onk_en": "The Levi’im are to respond and say to every man of Yisroel aloud:", "pj": "וְיִכְרְזוּן לֵיוָאֵי וְיֵימְרוּן לְכָל אֵינַשׁ יִשְרָאֵל בְּקָלָא רָמָא", "pj_en": "And the Levites proclaimed and said to every man of Israel with a high voice:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 15, "aliyah": 5, "heb": "אָר֣וּר הָאִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּמַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהֹוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְשָׂ֣ם בַּסָּ֑תֶר וְעָנ֧וּ כׇל־הָעָ֛ם וְאָמְר֖וּ אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט גַּבְרָא דִּי יַעְבֵּד צֶלֶם וּמַתְּכָא <b>מְרָחָקָא קֳדָם<\/b> יְיָ עֹבַד יְדֵי אָמָן וּמְשַׁוִּי בְסִתְרָא וִיתִיבוּן כָּל עַמָּא וְיֵימְרוּן אָמֵן:", "onk_en": "‘Cursed is the man who makes a statue or a molten image, [<b>distanced before<\/b>] Adonoy’s abomination, the handiwork of a craftsman, and places [it] in a secret [place];’ the entire people will respond and say, <i>Amein.<\/i>", "pj": "שִׁיתָּא שִׁבְטִין קָמוּ עַל טַוְורָא דִגְרִיזִים וְשִׁיתָּא עַל טַוְורָא דְעֵיבָל וַאֲרוֹנָא וְכַהֲנַיָא וְלֵיוָאֵי בִּמְצִיעָא מְבָרְכַיָא הֲווֹן הָפְכִין אַפֵּיהוֹן כֻּלוֹ קֳבֵיל טַוְורָא דִגְרִיזִים וְאָמְרִין בְּרִיךְ יֶהֱוֵי גַבְרָא דְלָא יֶעֱבַד צְלַם וְצוּרָה וְכָל דְמוּ מַה דִמְרַחֵק קֳדָם יְיָ עוֹבַד יְדֵי אוּמַן וְלָא יְשַׁוֵי בְטוּמְרָא מְלַטְטַיָא הֲווֹן הָפְכִין אַפֵּיהוֹן כֻּלוֹ קֳבֵיל טַוְורָא דְעֵיבָל וְאָמְרִין לִיט יֶהֱוֵי גַבְרָא דְיַעֲבֵיד צְלַם וְצוּרָה וְכָל דְמוּ מַה דִמְרַחֵק קֳדָם יְיָ עוֹבַד יְדֵי אוּמַן וְשַׁוֵי בְטוּמְרָא הֲווֹן עַנְיַין כּוּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Six tribes shall stand on Mount Gerezim, and six on Mount Ebal; and the ark, the priests, and Levites in the midst. In blessing they shall turn their faces towards Mount Gerezim, and say: Blessed shall be the man who maketh not an image or form, or any similitude which is an abomination before the Lord, the work of the craftsman’s hand, and who placeth not such in concealment. In cursing, they shall turn their faces toward Mount Ebal, and say: Accursed be the man who maketh an image, figure, or any similitude which is an abomination before the Lord, the work of the craftsman’s hand, or who placeth such in concealment. And all of them shall respond together, and say, Amen.", "tj": "אֲשִׁיתָא שִׁבְטִין יְקוּמוּן לְהוֹן עַל טוֹרָא דִגְרִיזִים וְאַשִׁיתָא שִׁבְטִין יְקוּמוּן עַל טוּרָא דְעֵיבָל וַאֲרוֹנָא וְכַהֲנַיָא וְלֵיוָאֵי יְהִיבִין בִּמְצִיעָא וְכָל יִשְרָאֵל מִן כָּא וּמִן כָּא הָפְכִין אַפֵּיהוֹן לְקֳבֵיל טוּרָא דִגְרִיזִים וּפָתְחוּ הוּמְהוֹם (י\"ג פּוּמְהוֹם) בִּבְרָכָה בְּרִיךְ יֶהֱוֵי גַבְרָא דְלָא עֲבַד צְלָם וְצוּרָה וְכָל דְמוּ מַה דְסָנֵי וּמְרַחֵק קֳדָם יְיָ עוֹבַד יְדֵי בַּר נְשָׁא וּדְלָא יְשַׁוֵי בְּטוּמְרַיָא וּמְלַטְטַיָא הֲווֹן הָפְכִין אַפֵּיהוֹן לְקֳבֵל טוּרָא דְעֵיבָל וַאֲמַר לִיט יֶהֱוֵי גַבְרָא דִי יַעֲבֵד צְלָם וְצוּרָה וְכָל דְמוּ מַה דְסָנֵי וּמְרַחֵק קֳדָם יְיָ עוֹבַד יְדֵי בַּר נַשׁ וְדִי יְשַׁוֵי בְּטוּמְרָא וַהֲוַון כָּל עַמָא עַנְיַין אִלֵין וְאִילֵין וְאָמְרִין אָמֵן:", "tj_en": "Six tribes of them shall stand on Mount Gerezim, and six tribes on Mount Ebal. And the ark, with the priests and Levites in the midst.  And all Israel, here and there, turning their faces towards Mount Gerezim, shall open their mouth in benediction: Blessed be the man who hath not made an image, or a figure, or any similitude which the Lord hateth, and which is an abomination before Him, (being) the work of man's band, and who bath not hidden such. But in pronouncing the curses let them turn their faces toward Mount Ebal, and say: Accursed be the man who shall make an image, or figure, or any similitude which the Lord hateth and which is an abomination to Him, the work of man's hands; or the man who hath concealed such. And all the people shall answer them, and say, Amen.", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 16, "aliyah": 5, "heb": "אָר֕וּר מַקְלֶ֥ה אָבִ֖יו וְאִמּ֑וֹ וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דְּיִקְלֵי אֲבוּהִי וְאִמֵּיהּ וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever reviles his father or his mother,’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דִמְזַלְזֵל אִיקְרָא דְאָבוֹי וּדְאִמֵיהּ עַנְיַין כּוּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who contemneth the honour of his father or his mother. And all of them shall answer together, and say, Amen.", "tj": "", "tj_en": "", "rashi": "<b>מקלה אביו.<\/b> מְזַלְזֵל, לְשׁוֹן \"וְנִקְלָה אָחִיךָ\" (דברים כ\"ה):", "rashi_en": "מקלה means, “making light of”, it has the same meaning as (Deuteronomy 25:3) “Lest … thy brother become despicable (נקלה). "}, {"ch": 27, "v": 17, "aliyah": 5, "heb": "אָר֕וּר מַסִּ֖יג גְּב֣וּל רֵעֵ֑הוּ וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט <b>דְּיִשְׁנֵי<\/b> תְּחוּמָא דְחַבְרֵיהּ וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever casts aside [<b>changes<\/b>] the boundary of his fellow;’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דְיַשְׁנֵי תְּחוּמָא דְחַבְרֵיהּ הֲווֹן עַנְיַין כֻּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who shall transfer the boundary of his neighbour. And all of them shall answer together, and say, Amen.", "tj": "לִיט יֶהֱוֵי גַבְרָא דִמְשַׁנֵי תְּחוּמָא:", "tj_en": "Accursed be the man who changeth the bound mark.", "rashi": "<b>מסיג גבול.<\/b> מַחֲזִירוֹ לַאֲחוֹרָיו וְגוֹנֵב אֶת הַקַּרְקַע, לְשׁוֹן \"וְהֻסַּג אָחוֹר\" (ישעיהו נ\"ט):", "rashi_en": "מסיג גבול [CURSED BE] HE THAT REMOVES [HIS NEIGHBOUR’S] LAND-MARK — i.e. puts it further back in his neighbor’s field and thereby steals ground from him. The word מסיג has the same meaning as the verb in (Isaiah 59:14) “and he is turned backwards (הֻסַּג )\". "}, {"ch": 27, "v": 18, "aliyah": 5, "heb": "אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּדָּ֑רֶךְ וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דְּיַטְעֵי עַוִּירָא בְּאָרְחָא וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever misleads the blind about the way;’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דְיִטְעֵי אַכְסַנְיָא בְּאוֹרְחָא דְהוּא מְדַמֵי לְסַמְיָא הֲווֹן עַנְיַין כֻּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who causeth the pilgrim, who is like the blind, to wander from the way. And all of them shall answer together, and say, Amen.", "tj": "לִיט יֶהֱוֵי גַבְרָא דְיִטְעֵי אַכְסַנְיָא בְּאוֹרְחָא דְהוּא דָמֵי לְסַמְיָא וְיַעֲנוּן כָּל עַמָא וְיֵימְרוּן אָמֵן:", "tj_en": "Accursed be the man who maketh the wayfarer, who is like the blind, to wander from the way. And all the people shall answer, and say, Amen.", "rashi": "<b>משגה עור.<\/b> הַסּוּמָא בַדָּבָר וּמַשִּׂיאוֹ עֵצָה רָעָה:", "rashi_en": "משגה עור [CURSED BE] HE THAT CAUSES THE BLIND TO GO ASTRAY — This means: one who is blind (inexperienced) in a matter and one gives him bad advice (cf. Rashi on Leviticus 19:14)."}, {"ch": 27, "v": 19, "aliyah": 5, "heb": "אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר־יָת֖וֹם וְאַלְמָנָ֑ה וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(ספק פרשה סתומה בכתר ארם צובה)<\/i>", "onk": "לִיט דְּיַצְלֵי דִּין דַּיַּר יִתַּמָּא וְאַרְמְלָא וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever distorts justice for a convert, orphan, or widow;’ and entire people will say, <i>Amein.<\/i>", "pj": "לִיט דְיַצְלֵי דִין דַיָיר יִתַּם וְאַרְמְלָא הֲווֹן עַנְיַין כֻּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed be he who perverteth the judgment of the stranger, the widow, and the fatherless. And all shall answer together, and say, Amen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 20, "aliyah": 5, "heb": "אָר֗וּר שֹׁכֵב֙ עִם־אֵ֣שֶׁת אָבִ֔יו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑יו וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דְּיִשְׁכּוּב עִם אִתַּת אֲבוּהִי אֲרֵי גַלִּי כַּנְפָא דַאֲבוּהִי וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever has intercourse with his father’s wife, because he exposed the corner of his father[’s garment];’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דִמְשַׁמֵשׁ עִם אִתַּת אָבוֹי אֲרוּם גְלֵי כַנְפָא דְגַלֵי אָבוֹי הֲווֹן עַנְיַין כֻּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who lieth with his father’s wife, because he uncovereth his father’s skirt. And all shall answer together, and say, Amen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 21, "aliyah": 5, "heb": "אָר֕וּר שֹׁכֵ֖ב עִם־כׇּל־בְּהֵמָ֑ה וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דְּיִשְׁכּוּב עִם כָּל בְּעִירָא וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever has intercourse with any animal;’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דִמְשַׁמֵשׁ עִם כָּל בְּעִירָא הֲווֹן עַנְיַין כּוּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who lieth with a beast. And all shall answer together, and say, Amen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 22, "aliyah": 5, "heb": "אָר֗וּר שֹׁכֵב֙ עִם־אֲחֹת֔וֹ בַּת־אָבִ֖יו א֣וֹ בַת־אִמּ֑וֹ וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דְּיִשְׁכּוּב עִם אֲחָתֵיהּ בַּת אֲבוּהִי אוֹ בַת אִמֵּיהּ וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever has intercourse with his sister, daughter of his father or daughter of his mother;’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דִמְשַׁמֵשׁ עִם אַחְתֵיהּ בְּרַת אָבוֹי אוֹ בְּרַת אִמֵיהּ הֲווֹ עַנְיַין כּוּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who lieth with his sister, the daughter of his father or mother. And all shall answer together, and say, Amen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 23, "aliyah": 5, "heb": "אָר֕וּר שֹׁכֵ֖ב עִם־חֹֽתַנְתּ֑וֹ וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דְּיִשְׁכּוּב עִם חֲמוֹתֵיהּ וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever has intercourse with his father’s-in-law wife;’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דִמְשַׁמֵשׁ עִם חֲמוֹתֵיהּ הֲווֹן עַנְיַין כּוּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who shall lie with his mother-in-law. And all shall answer together, and say, Amen.", "tj": "לִיט יֶהֱוֵי גַבְרָא דִמְשַׁמֵשׁ עִם חֲבִיבָתֵיהּ וְיַעֲנוּן כָּל עַמָא וְיֵימְרוּן אָמֵן:", "tj_en": "Accursed is he who lieth with his mother-in-law. And all shall answer together, and say, Amen.", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 24, "aliyah": 5, "heb": "אָר֕וּר מַכֵּ֥ה רֵעֵ֖הוּ בַּסָּ֑תֶר וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דְּיִמְחֵי לְחַבְרֵיהּ בְּסִתְרָא וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever strikes his fellow in secret;’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דְיִמְחֵי חַבְרֵיהּ בְּלִישַׁן תְּלִיתָאֵי בְּטוּמְרָא הֲווֹן עַנְיַין כּוּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who attacketh his neighbour with slander in secret. And all shall answer together, and say, Amen.", "tj": "", "tj_en": "", "rashi": "<b>מכה רעהו בסתר.<\/b> עַל לָשׁוֹן הָרָע הוּא אוֹמֵר; רָאִיתִי בִיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן — י\"א אֲרוּרִים יֵשׁ כָּאן כְּנֶגֶד י\"א שְׁבָטִים, וּכְנֶגֶד שִׁמְעוֹן לֹא כָתַב אָרוּר, לְפִי שֶׁלֹּא הָיָה בְלִבּוֹ לְבָרְכוֹ לִפְנֵי מוֹתוֹ כְּשֶׁבֵּרֵךְ שְׁאָר הַשְּׁבָטִים, לְכָךְ לֹא רָצָה לְקַלְּלוֹ:", "rashi_en": "מכה רעהו בסתר [CURSED BE] HE THAT SMITETH HIS FELLOW SECRETLY — It is of slander that it here speaks (slander may be termed “smiting in secret”) (Pirkei DeRabbi Eliezer 53). — I have seen in the Work of R. Moses the Preacher; There are here eleven verses beginning with the words “cursed be” corresponding to eleven tribes. In allusion to Simeon, however, he (Moses) did not write down a formula beginning with “cursed be”, because he had no intention to bless him before his death when he blessed the other tribes (the tribe of Simeon is the only one not mentioned in chapter XXXIII. which contains the blessings that Moses bestowed on the tribes), therefore he did not want to curse him either."}, {"ch": 27, "v": 25, "aliyah": 5, "heb": "אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְהַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לִיט דִּי מְקַבֵּל שֹׁחֲדָא לְמִקְטַל נְפַשׁ דַּם זַכַּי וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever accepts a bribe to kill an innocent person;’ and the entire people will say, <i>Amein.<\/i>", "pj": "לִיט דִמְקַבֵּל שׁוֹחֲדָא לְמִיקְטוֹל בַּר נַשׁ לְמִשְׁדֵי אֲדַם זַכַּאי הֲווֹן עַנְיַין כּוּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן", "pj_en": "Accursed is he who receiveth hire to kill and to shed innocent blood. And all shall answer together, and say, Amen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 26, "aliyah": 5, "heb": "אָר֗וּר אֲשֶׁ֧ר לֹא־יָקִ֛ים אֶת־דִּבְרֵ֥י הַתּוֹרָֽה־הַזֹּ֖את לַעֲשׂ֣וֹת אוֹתָ֑ם וְאָמַ֥ר כׇּל־הָעָ֖ם אָמֵֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לִיט דִּי לָא יְקַיַּם יָת פִּתְגָּמֵי אוֹרַיְתָא הָדָא לְמֶעְבַּד יָתְהוֹן וְיֵימַר כָּל עַמָּא אָמֵן:", "onk_en": "‘Cursed is whoever does not uphold the statements of this Torah to perform them;’ and the entire people will say, <i>Amein.<\/i>", "pj": "תַּרְתֵּיסְרֵי שִׁבְטַיָא כָּל חַד וְחַד הֲוָה אָמַר בִּרְכָתָא בִּכְלָלָא וּלְוָוטַיָא בִּכְלָלָא מְבָרְכַיָא הֲווֹן הָפְכִין אַפֵּיהוֹן לְכָל מִילָא וּמִילָא כֻּלוֹ קֳבֵיל טַוְורָא דִגְרִיזִים וְאָמְרִין בְּרִיךְ יֶהֱוֵי גַבְרָא דִי יְקִים יַת פִּתְגָמֵי אוֹרַיְיתָא הֲדָא לְמֶעֱבַדְהוֹן מְלַטְטַיָא הָפְכִין אַפֵּיהוֹן כֻּלוֹ קֳבֵיל טַוְורָא דְעֵיבָל וְאָמְרִין לִיט יֶהֱוֵי גַבְרָא דְלָא יְקִים יַת פִּתְגָמֵי אוֹרַיְיתָא הֲדָא לְמֶעֱבַדְהוֹן הֲווֹן עַנְיַין כֻּלְהוֹן כַּחֲדָא וְאָמְרִין אָמֵן פִּתְגָמַיָא אִלֵין אִתְאַמָרוּ בְּסִינַי וְאִתַּנְייוּ בְּמַשְׁכַּן זִמְנָא וְאִיתְלֵיתוּן בְּמֵישְׁרֵי מוֹאָב תַּרְתֵּיסְרֵי מִלִין מִן מִלְתָא לְכָל שִׁבְטַיָא וְעַל כָּל פִּיקוּדָא וּפִיקוּדָא אִתְגְזַר עֲלָהּ תְּלָתִין וְשִׁית קַיָמִין", "pj_en": "The twelve tribes, each and every, shall pronounce the blessings altogether, and the curses altogether. In blessing, they shall turn their faces (in pronouncing) word by word towards Mount Gerezim, and shall say: Blessed is the man who confirmeth the words of this law to perform them. In cursing, they shall turn their faces towards Mount Ebal, and say: Accursed is the man who confirmeth not the words of this law to perform them. And all shall answer together, and say, Amen. These words were spoken at Sinai, and repeated in the tabernacle of ordinance, and (again) the third time on the plains of Moab, in twelve sentences (words), as the word of every tribe; and each several commandment (was thus) ratified by thirty and six adjurations.", "tj": "", "tj_en": "", "rashi": "<b>אשר לא יקים.<\/b> כָּאן כָּלַל אֶת כָּל הַתּוֹרָה כֻּלָּהּ וְקִבְּלוּהָ עֲלֵיהֶם בְּאָלָה וּבִשְׁבוּעָה:", "rashi_en": "אשר לא יקים [CURSED BE] HE THAT DOES NOT UPHOLD [ALL THE WORDS OF THIS LAW TO DO] — Here (in these words) he included the entire Torah under a curse and they took it upon them pledging themselves by an execration and an oath."}, {"ch": 28, "v": 1, "aliyah": 5, "heb": "וְהָיָ֗ה אִם־שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּקוֹל֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לִשְׁמֹ֤ר לַעֲשׂוֹת֙ אֶת־כׇּל־מִצְוֺתָ֔יו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּ֑וֹם וּנְתָ֨נְךָ֜ יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ עֶלְי֔וֹן עַ֖ל כׇּל־גּוֹיֵ֥י הָאָֽרֶץ׃", "onk": "וִיהֵי אִם <b>קַבָּלָא תְקַבֵּל לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ לְמִטַּר לְמֶעְבַּד יָת כָּל פִּקּוּדוֹהִי דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין וְיִתְּנִנָּךְ יְיָ אֱלָהָךְ עִלַּי עַל כָּל עַמְמֵי אַרְעָא:", "onk_en": "When you hearken and obey [<b>accept the word of<\/b>] Adonoy, your God, to be sure to perform all of His commandments that I am commanding you today; Adonoy, your God, will place you superior to all the nations of the earth.", "pj": "וִיהֵי אִין קַבָּלָא תְּקַבְּלוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן לְמִנְטַר וּלְמֶעֱבַד יַת כָּל פִּקוּדוֹי דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא וְיִתְנִינְכוֹן יְיָ אֱלָהָכוֹן רָמִין וְגֵיוְתָנִין עַל כָּל עַמְמֵי אַרְעָא", "pj_en": "And it shall be, if you will diligently hearken to the Word of the Lord your God, to observe and perform all the commandments which I command you this day, that the Lord your God will set you on high, and exalt you above all the nations of the earth;", "tj": "", "tj_e
