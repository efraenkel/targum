<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>

const DATA = [{"ch": 32, "v": 1, "aliyah": 1, "heb": "הַאֲזִ֥ינוּ הַשָּׁמַ֖יִם וַאֲדַבֵּ֑רָה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְתִשְׁמַ֥ע הָאָ֖רֶץ אִמְרֵי־פִֽי׃", "onk": "אַצִיתוּ שְׁמַיָּא וֶאֱמַלֵּל וְתִשְּׁמַע אַרְעָא אִמְרֵי פֻמִּי:", "onk_en": "Hearken, O heaven as I declare, let the earth hear my mouth’s sayings.", "pj": "האזינו וַהֲוָה דִי מָטָא קִיצֵיהּ דְמשֶׁה נְבִיָא לְמִתְכַּנְשָׁא מִגוֹ עַלְמָא אָמַר בְּלִבֵּיהּ לֵיתָנָא מַסְהִיד בְּעַמָא הָדֵין סַהֲדִין דְטַעֲמִין מִיתוּתָא בְּעַלְמָא הָדֵין הָאֲנָא מַסְהִיד בְּהוֹן סַהֲדִין דְלָא טַעֲמִין מִיתוּתָא בְּעַלְמָא הָדֵין בְּרַם סוֹפֵיהוֹן לְאִתְחַדְתָּא לְעַלְמָא דְאָתֵי יְשַׁעְיָה נְבִיָא כַּד הֲוָה מִתְנַבֵּי בִּכְנִישַׁתְהוֹן דְיִשְרָאֵל יְהַב שְׁמִיעָא לִשְׁמַיָא וְצַיְיתָא לְאַרְעָא מִן בִּגְלַל דַהֲוָה קָרִיב לְאַרְעָא וְרָחִיק מִן שְׁמַיָא בְּרַם משֶׁה נְבִיָא כַּד הֲוָה מִתְנַבֵּי בִּכְנִישַׁתְהוֹן דְיִשְרָאֵל יְהַב שְׁמִיעָא לְאַרְעָא וְצַיְיתָא לִשְׁמַיָא מִן בִּגְלַל דַהֲוָה קָרִיב לִשְׁמַיָא וְרָחִיק מִן אַרְעָא דְהָכִין כְּתִיב אַצִיתוּ שְׁמַיָא וַאֲמַלֵיל וְתִשְׁמַע אַרְעָא מַמְלַל פֻּמִי", "pj_en": "And when the last end of Mosheh the prophet was at hand, that he should be gathered from among the world, he said in his heart: I will not attest against this people with witnesses that taste of death in this world, behold, I attest against them with witnesses which do not taste of death in this world, and whose destination is to be renewed in the world to come. Isaiah the prophet, when he prophesied in the congregation of Israel, attributed hearing to the heavens, and attentiveness to the earth; because (in his case) earth was nearest and heaven more remote: but Mosheh the prophet, when he now prophesied in the congregation of Israel, attributed hearing to the earth, and attentiveness to the heavens; because (in his case) heaven was nearest and earth more remote; for so it is written, Attend, ye heavens, and I will speak; and hear, O earth, thewords of my mouth.", "tj": "כֵּיוַן דִמְטָא קִיצֵיהּ דְמשֶׁה לְמִסְתַּלְקָא מִן גוֹ עַלְמָא אָמַר הָא אֲנָא מַסְהִיד בְּעַלְמָא הָאִילֵין מִילָא דְלָא טַעֲמָא מַיְיתוּ מַסְהִיד אֲנָא בְּהוֹן שְׁמַיָא וְאַרְעָא דְלָא טַעֲמִין מַיְיתוּ בְּעַלְמָא הָדֵין בְּרַם סוֹפֵיהוֹן כַּלְיַין לְעַלְמָא דְאָתֵי דְכֵן הוּא מְפָרַשׁ וַאֲמַר טוּלוּ לִשְׁמַיָא עֵינֵיכוֹן וְאִסְתַּכָּלוּ לְאַרְעָא מִלְרַע אֲרוּם שְׁמַיָא כִּתְּנָנָא יִמְסִין וְאַרְעָא כִּלְבוּשָׁא תִבְלֵי בְּרַם אֲנָא עָתִיד בַּרְאֵי שָׁמַיִם חֲדַתּוּן וְאַרְעָא חַדְתָּא יְשַׁעְיָה נְבִיָא כַּד הֲוָה מִתְנַבֵּי בִּכְנִשְׁתְּהוֹן דְיִשְרָאֵל עַד דַהֲוָה רָחִיק מִן שְׁמַיָא וְקָרֵיב לְאַרְעָא יְהַב שְׁמוּעֲתָא לִשְׁמַיָא וְצַיְיתָא לְאַרְעָא דְכֵן הוּא מְפָרַשׁ וַאֲמַר שְׁמָעוּ שְׁמַיָא וְאַצִיתִי אַרְעָא אֲרוּם מֵימְרָא דַיְיָ אָמַר משֶׁה נְבִיָא כַּד הֲוָה מִתְנַבֵּא בִּכְנִשְׁתָּא דְיִשְרָאֵל עַד דַהֲוָה קָרִיב לִשְׁמַיָא וְרָחִיק מִן אַרְעָא יְהַב צַיְיתָא לִשְׁמַיָא וּשְׁמוּעֲתָא לְאַרְעָא כֵּן הוּא מְפָרַשׁ וַאֲמַר אָצִיתוּ שְׁמַיָא וַאֲמַלֵיל וְתִשְׁמַע אַרְעָא מַמְלֵיל דְפֻמִי:", "tj_en": "When the end of Mosheh came that he should be removed from the world, he said: Behold, I testify in this world a thing which tasteth not of death; so will I attest against them the heavens and earth which taste not of death in this world, but whose end is to be consumed in the world that cometh. For so he explained, and said: Lift up your eyes to the heavens, and consider the earth beneath; for the heavens shall dissolve like smoke, and the earth fade away as a garment; but I have prepared to create new heavens and a new earth. Isaiah the prophet, when he prophesied in the congregation of Israel, because he was remote from the heavens and nearest the earth, attributed hearing to the heavens, and attention to the earth: for so be explaineth, and saith: Hear, O heavens, and listen, O earth; for the Word of the Lord hath spoken. Mosheh the prophet, when he now prophesied in the congregation of Israel, attributed hearing to the earth, and attentiveness to the heavens; because (in his case) heaven was nearest and earth more remote; for so it is written, Attend, ye heavens, and I will speak; and hear, O earth, the words of my mouth.", "rashi": "<b>האזינו השמים.<\/b> שֶׁאֲנִי מַתְרֶה בָהֶם בְּיִשְׂרָאֵל וְתִהְיוּ עֵדִים בַּדָּבָר, שֶׁכָּךְ אָמַרְתִּי לָהֶם שֶׁאַתֶּם תִּהְיוּ עֵדִים, וְכֵן <b>ותשמע הארץ.<\/b> וְלָמָּה הֵעִיד בָּהֶם שָׁמַיִם וָאָרֶץ? אָמַר מֹשֶׁה: אֲנִי בָּשָׂר וָדָם, לְמָחָר אֲנִי מֵת, אִם יֹאמְרוּ יִשְׂרָאֵל לֹא קִבַּלְנוּ עָלֵינוּ הַבְּרִית, מִי בָא וּמַכְחִישָׁם? לְפִיכָךְ הֵעִיד בָּהֶם שָׁמַיִם וָאָרֶץ — עֵדִים שֶׁהֵן קַיָּמִים לְעוֹלָם. וְעוֹד, שֶׁאִם יִזְכּוּ יָבֹאוּ הָעֵדִים וְיִתְּנוּ שְׂכָרָם, הַגֶּפֶן תִּתֵּן פִּרְיָהּ וְהָאָרֶץ תִּתֵּן יְבוּלָהּ וְהַשָּׁמַיִם יִתְּנוּ טַלָּם, וְאִם יִתְחַיְּבוּ תִּהְיֶה בָהֶם יַד הָעֵדִים תְּחִלָּה — \"וְעָצַר אֶת הַשָּׁמַיִם וְלֹא יִהְיֶה מָטָר וְהָאֲדָמָה לֹא תִתֵּן אֶת יְבוּלָהּ\" (דברים י\"ז), וְאַחַר כָּךְ \"וַאֲבַדְתֶּם מְהֵרָה\" (שם י\"א) עַל יְדֵי הָאֻמּוֹת:", "rashi_en": "האזינו השמים HEAR YE HEAVENS that I warn Israel, and be ye witnesses to this matter; for so I have told them that ye will be witnesses (cf. Rashi on Deuteronomy 31:28). Similar is the meaning of ותשמע הארץ (i.e. the verb has the force of an imperative: AND LET THE EARTH HEAR). And why did He call heaven and earth as witnesses against them? Moses thought: “I am a being of flesh and blood (mortal); tomorrow I shall be dead. If the Israelites will once say, ‘We have never accepted the covenant’, who can come and refute them?” Therefore he called heaven and earth as witnesses against them — witnesses that endure forever (Sifrei Devarim 306:15). And a further reason was that if they should act worthily, the witnesses might come and give them their reward: the vine might yield its fruit, the ground give its increase, the heaven bestow its dew; while if they should act sinfully, the hand of the witnesses might first be against them (Rashi uses a phrase similar to that used of human witnesses; cf. e.g. Deuteronomy 13:10): “and He will restrain the heaven, that there be no rain, and the earth will not give its increase; and you shall perish quickly” (Deuteronomy 11:17) — through the attacks of other nations (Tanchuma 5:10:1)."}, {"ch": 32, "v": 2, "aliyah": 1, "heb": "יַעֲרֹ֤ף כַּמָּטָר֙ לִקְחִ֔י&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;תִּזַּ֥ל כַּטַּ֖ל אִמְרָתִ֑י כִּשְׂעִירִ֣ם עֲלֵי־דֶ֔שֶׁא&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְכִרְבִיבִ֖ים עֲלֵי־עֵֽשֶׂב׃", "onk": "<b>יְבַסַּם<\/b> כְּמִטְרָא אֻלְפָּנִי <b>יִתְקַבַּל<\/b> כְּטַלָּא מֵימְרִי <b>כְּרוּחֵי<\/b> מִטְרָא <b>דְנָשְׁבִין<\/b> עַל דִּתְאָה <b>וְכִרְסִיסֵי מַלְקוֹשָׁא<\/b> דִּי עַל עִשְׂבָּא:", "onk_en": "Let my instruction flow [<b>be fragrant<\/b>] like rainfall, let my saying drip [<b>be accepted<\/b>] like dew; like storm winds [<b>blowing<\/b>] on verdure, and like raindrops [<b>the traces of the last rainfall<\/b>] on grass.", "pj": "יִנְקוֹף עַל מְרוֹדַיָא הֵיךְ מִטְרָא סַפְּחָא אוּלְפָנִי וְתִתְקַבֵּל בְּרַעֲוָא עַל מְקַבְּלֵי אוּלְפָנָא הֵיךְ טַלָא מְמַלְלֵי דִילִי כִּרְבִיעִית רוּחֵי מִיטְרָא דְמִינַתְבִין עַל דִתְאִין בְּיֶרַח מַרְחֶשְׁוָון וְכַרְסִיסִין לְקוֹשִׁין דִמְרַוִוין צִמְחוֹנֵי אַרְעָא בְּיַרְחָא דְנִיסָן", "pj_en": "My doctrine shall smite the rebellious like heavy rain; but shall be enjoyed with pleasantness by those who receive instruction, as the dew: my words shall be like the downfalling rain of the wind that breathes upon the grass in the month of Marchesvan, and as the droppings of the latter rain which water the springing herbage of the earth in Nisan.", "tj": "יְבַסֵם עַל בְּנֵי יִשְרָאֵל כְּמִטְרָא אוּלְפַן אוֹרַיְיתִי תְקַבֵּיל עֲלֵיהוֹן בְּרַעֲוָא כְּטַלָא מֵימַר פּוּמִי כְּרוּחַיָא דִמְנַשְׁבִין עַל עִשְבָּא וְכַרְסִיסֵי דְמַלְקוֹשָׁא דְנַחְתִין וּמְרַוַיָן צִמְחָא דְאַרְעָא בְּיַרְחָא דְנִיסָן:", "tj_en": "The doctrine of my law shall be sweet to the children of Israel as the rain, the word Of my mouth will be received by them with pleasantness as the dew, as the wind which breathes upon the herb, and as the drops of the latter rain that descend and water the herbage of the ground in Nisan.", "rashi": "<b>יערף כמטר לקחי.<\/b> זוֹ הִיא הָעֵדוּת שֶׁתָּעִידוּ — שֶׁאֲנִי אוֹמֵר בִּפְנֵיכֶם תּוֹרָה שֶׁנָּתַתִּי לְיִשְׂרָאֵל שֶׁהִיא חַיִּים לָעוֹלָם כְּמָטָר זֶה שֶׁהוּא חַיִּים לָעוֹלָם (עי' ספרי); כַּאֲשֶׁר יַעַרְפוּ הַשָּׁמַיִם טַל וּמָטָר:<br><br><b>יערף.<\/b> לְשׁוֹן יַטִּיף, וְכֵן (תהילים ס\"ה) \"יִרְעֲפוּן דָּשֶׁן\", (דברים ל\"ג) \"יַעַרְפוּ טָל\":<br><br><b>תזל כטל.<\/b> שֶׁהַכֹּל שְׂמֵחִים בּוֹ, לְפִי שֶׁהַמָּטָר יֵשׁ בּוֹ עֲצָבִים לַבְּרִיּוֹת, כְּגוֹן הוֹלְכֵי דְרָכִים וּמִי שֶׁהָיָה בוֹרוֹ מָלֵא יַיִן (ספרי):<br><br><b>כשעירם.<\/b> לְשׁוֹן רוּחַ סְעָרָה, כְּתַרְגּוּמוֹ \"כְּרוּחֵי מִטְרָא\", מָה הָרוּחוֹת הַלָּלוּ מַחֲזִיקִים אֶת הָעֲשָׂבִים וּמְגַדְּלִין אוֹתָם, אַף דִּבְרֵי תוֹרָה מְגַדְּלִין אֶת לוֹמְדֵיהֶן:<br><br><b>וכרביבים.<\/b> טִפֵּי מָטָר. נִרְאֶה לִי עַל שֵׁם שֶׁיּוֹרֶה כְּחֵץ נִקְרָא רְבִיב, כְּמָה דְאַתְּ אוֹמֵר \"רֹבֶה קַשָּׁת\" (בראשית כ\"א):<br><br><b>דשא.<\/b> ארברי\"ץ, עֲטִיפַת הָאָרֶץ מְכֻסָּה בְיֶרֶק:<br><br><b>עשב.<\/b> קֶלַח אֶחָד קָרוּי עֵשֶׂב, וְכָל מִין וָמִין לְעַצְמוֹ קָרוּי עֵשֶׂב:", "rashi_en": "יערף כמטר לקחי MY DOCTRINE DROPPETH AS RAIN — This is the evidence that ye will have to give: that in your presence I declare that the Torah which I gave to Israel (לקחי) is life to the world as the rain which is life to the world (cf. Sifrei Devarim 306:17) — even as the heavens drop down dew and rain.<br><br>יערף means, IT DROPS. Similar is (Psalms 65:12) “[And thy paths] drop fatness” (ירעפון, where רעף = ערף); (Deuteronomy 33:28) “[also his heavens] shall drop down (יערפו) dew”.<br><br>תזל כטל IT FLOWS AS THE DEW in which everybody rejoices. He adds this because rain involves annoyance to some people, as, for instance, to those on a journey, or a man whose pit (the pit into which the wine flows when the grapes are being pressed) is full of wine (which thus becomes spoiled) (Sifrei Devarim 306:17).<br><br>כשעירים — This word has the same meaning as in (Psalms 148:8) “stormy (סערה) wind” (the ס and ש interchanging), as the Targum has it: כרוחי מטרא “like winds that bring rain”. How is it with the winds? They strengthen the herbage and promote their growth! So, too, the words of the Torah promote the moral growth of those who study them (Sifrei Devarim 306:18).<br><br>וכרביבים — these are DROPS OF RAIN. It seems to me that it (the rain) is called רביב because it shoots down like an arrow, just as you say, (i.e. just as the text reads) (Genesis 21:20) “A shooter (רבה) with the bow”.<br><br>דשא — herbaries in old French. English herbage — the vesture of the ground when it is covered with vegetation (greens).<br><br>עשב HERB — a single stalk is called עשב and similarly each species of herbs by itself is called עשב (whilst דשא denotes vegetation in general). (Cf. Rashi on Genesis 1:11 and Note thereon)."}, {"ch": 32, "v": 3, "aliyah": 1, "heb": "כִּ֛י שֵׁ֥ם יְהֹוָ֖ה אֶקְרָ֑א&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;הָב֥וּ גֹ֖דֶל לֵאלֹהֵֽינוּ׃", "onk": "אֲרֵי בִּשְׁמָא דַיְיָ אֲנָא <b>מְצַלֵּי<\/b> הָבוּ רְבוּתָא <b>קֳדָם<\/b> אֱלָהָנָא:", "onk_en": "When I pronounce [<b>pray in<\/b>] the name of [<b>before<\/b>] Adonoy, give greatness to our God,", "pj": "וַוי לְהוֹן לְרַשִׁיעַיָא דִמְדַכְרִין שְׁמָא קַדִישָׁא בְּגִידוּפִין אֲרוּם משֶׁה דַהֲוָה רַבְּהוֹן דְיִשְרָאֵל לָא הֲוָה אֶפְשַׁר לֵיהּ לְמִדְכַּר יַת שְׁמָא קַדִישָׁא עַד דַהֲוָה מְחַנִיךְ פּוּמֵיהּ בְּרֵישׁ שִׁירָתָא בִּתְמַנְיָין וְחַמְשָׁא אָתִין דְהִינוּן עַשְרִין וְחַד מִלִין וּמִן בָּתַר כְּדֵין אָמַר אֲרוּם בִּשְׁמָא דַיְיָ אֲנָא מְצַלֵי וְאַתּוּן עַמָא בֵּית יִשְרָאֵל הָבוּ אִיקַר וּרְבוּתָא קֳדָם אֱלָהָנָא", "pj_en": "Woe to the wicked who make memorial of the Holy Name with blasphemies. Wherefore Mosheh, who was the Doctor of Israel, would not permit himself to pronounce the Holy Name until he had dedicated his mouth at the beginning of his hymn with eighty and five letters, making twenty and one words, and afterwards be spake: In the Name of the Lord I invoke you, O house of Israel, to ascribe glory and greatness before our God.", "tj": "אָמַר משֶׁה נְבִיָא וַוי לְהוֹן לְרַשִׁיעַיָא דְמַדְכְּרִין שְׁמָא קַדִישָׁא בְּגָדִיפִין אֲרוּם לְחָד מִן מַלְאֲכֵי מְרוֹמָא לֵית אֶפְשַׁר לְמִידְכְּרָא שְׁמָא מְפָרָשָׁא עַד זְמַן דְאִינוּן אָמְרִין קָדוֹשׁ קָדוֹשׁ קָדוֹשׁ תְּלַת זִימְנִין וּמִנְהוֹן יַלִיף משֶׁה וְלָא הֲוָה מַדְכַּר שְׁמָא מְפָרַשׁ עַד זְמַן דַהֲוָה מַחֲנִיךְ פּוּמֵיהּ בְּעֶשְרִין וַחֲדָא מִילִין דְאִינוּן תַּמְנִין וְחַמְשָׁא אָתִין וְכֵן הוּא מְפָרַשׁ וַאֲמַר הַאֲזִינוּ הַשָׁמַיִם וַאֲדַבֵּרָה כִּי שֵׁם יְיָ אָמַר משֶׁה נְבִיָא בִּשְׁמָא דַיְיָ אֲנָא מְצַלֵי וְאַתּוּן עַמָא יִשְרָאֵל הָבוּ יְקַר וְתוּשְׁבַּחְתָּא וּרְבוּ רוֹמְמוּ לֵאלָהָא:", "tj_en": "Mosheh the prophet said: Woe to the wicked who make memorial of the Holy Name with blasphemies. For it is not possible even to one of the highest angels to utter that Name rightly until that they have said, Holy, Holy, Holy thrice. And from them did Mosheh learn not to utter that Name openly until he should have dedicated his mouth with twenty-one words which consist of eighty-five letters; and so explained he and said: Hear, ye heavens, and I will speak; for it is the Name of the Lord. Mosheh the prophet said: O people of Israel, I invoke you, in the Name of the Lord, to give glory, praise, and highest exaltation unto God.", "rashi": "<b>כי שם ה' אקרא.<\/b> הֲרֵי כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן כַּאֲשֶׁר, כְּמוֹ (ויקרא כ\"ג) \"כִּי תָבֹאוּ אֶל הָאָרֶץ\", כְּשֶׁאֶקְרָא וְאַזְכִּיר שֵׁם ה', אַתֶּם <b>הבו גדל לאלהינו<\/b> וּבָרְכוּ שְׁמוֹ, מִכָּאן אָמְרוּ שֶׁעוֹנִין בָּרוּךְ שֵׁם כְּבוֹד מַלְכוּתוֹ אַחַר בְּרָכָה שֶׁבַּמִּקְדָּשׁ (עי' ספרי; מכילתא שמות י\"ג; ברכות כ\"א; תענית ט\"ז):", "rashi_en": "כי שם ה' אקרא WHEN I SHALL CALL THE NAME OF THE LORD [ASCRIBE YE GREATNESS UNTO OUR GOD] — You see, כי is here used in the meaning of “when”, similar to (Leviticus 23:10) “When (כי) ye come into the land”. The meaning is: when I proclaim and mention the Name of the Lord, YE ASCRIBE GREATNESS TO OUR GOD and bless His name. From here they (the Rabbis) derived the law that people make the response, “Blessed be the Name of His glorious Kingdom for ever and ever\", after the recital of a Benediction in the Temple (Sifrei Devarim 306:37; Berakhot 21a; Taanit 16b)."}, {"ch": 32, "v": 4, "aliyah": 1, "heb": "הַצּוּר֙ תָּמִ֣ים פׇּֽעֳל֔וֹ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;כִּ֥י כׇל־דְּרָכָ֖יו מִשְׁפָּ֑ט אֵ֤ל אֱמוּנָה֙ וְאֵ֣ין עָ֔וֶל&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;צַדִּ֥יק וְיָשָׁ֖ר הֽוּא׃", "onk": "תַּקִּיפָא <b>דְּשָׁלְמִין<\/b> <b>עוֹבָדוֹהִי<\/b> אֲרֵי כָּל ארְחָתֵיהּ דִּינָא אֱלָהָא מְהֵימְנָא דְּמִן <b>קֳדָמוֹהִי<\/b> עַוְלָה <b>לָא נָפֵק דְּמִן קֳדָם<\/b> זַכַּי וְקַשִּׁיט הוּא:", "onk_en": "The Almighty’s works are flawless [<b>perfect<\/b>], for all His ways are just; A God of faithfulness without [<b>from before Him<\/b>] injustice [<b>does not eminate from before Him<\/b>]; righteous and upright is He.", "pj": "אָמַר משֶׁה נְבִיָא כַּד סְלֵיקַת לְטַוְורָא דְסִינַי חָמִית רִבּוֹן כָּל עָלְמַיָא יְיָ מְרַבַּע יוֹמָא לְאַרְבָּעָא חוּלְקִין תְּלַת שָׁעִין עָסִיק בְּאוֹרַיְיתָא וּתְלַת עָסִיק בְּדִינָא וּתְלַת מְכַרְזֵג בֵּין גְבַר לְאִיתָא וּגְזַר לִמְרוֹמָם וּמָאִיךְ וּתְלַת מְפַרְנֵס כָּל בִּרְיָיתָא דְהָכִין כְּתִיב תַּקִיף דְשַׁלְמִין עוֹבָדוֹי אֲרוּם כָּל אָרְחָתוֹי דִינָא אֱלָהָא מְהֵימְנָא דְמִן קֳדָמוֹי עַוְלָא לָא נָפִיק דְזַכַּאי וְקָשִׁיט הוּא", "pj_en": "Mosheh the prophet said: When I ascended the mountain of Sinai, I beheld the Lord of all the worlds, the Lord, dividing the day into four portions; three hours employed in the law, three with judgment, three in making marriage bonds between man and woman, and appointing to elevate or to abase, and three hours in the care of every created thing: for so it is written: The Mighty One whose works are perfect, for all His ways are judgment, a faithful God before whom no iniquity comes forth, pure and upright is He.", "tj": "אָמַר משֶׁה נְבִיָא כַּד סַלְקִית לִמְרוֹמָא חֲמִית תַּמָן רִבּוֹן כָּל עַלְמַיָא יְיָ מְרַבַּע יוֹמָא לְאַרְבַּע חוּלְקִין תְּלַת שָׁעִין עָסִיק בְּאוֹרַיְיתָא וּתְלַת שָׁעִין עָסִיק בְּדִינָא וּתְלַת שָׁעִין עָסִיק מְפַרְנֵס עַלְמָא וּתְלַת שָׁעִין מְזַוֵוג גְבַר לְאִיתָא תַּקִיפָא דְשַׁלְמִין עוֹבָדוֹהִי אֲרוּם כָּל אוֹרְחָתֵיהּ דִינִין דִקְשׁוֹט אֱלָהָא מְהֵימְנָא וְקַשִׁיטָא וְלֵית קֳדָמוֹי שְׁקַר צַדִיק וְקַשִׁיט בְּדִינָא הוּא:", "tj_en": "Mosheh the prophet said: When I ascended the mountain of Sinai, I beheld the Lord of all the worlds, the Lord, dividing the day into four portions; three hours employed in the law, three hours with judgment, three hours in the care of the world, three hours, uniting the marriage yoke of the husband to the wife, [(for it is written)]The Mighty One whose works are perfect, for all his ways are judgment, faithful God and true; falsehood is not before Him; He is just and upright in judgment.", "rashi": "<b>הצור תמים פעלו.<\/b> אַעַ\"פִּ שֶׁהוּא חָזָק, כְּשֶׁמֵּבִיא פֻּרְעָנוּת עַל עוֹבְרֵי רְצוֹנוֹ, לֹא בְּשֶׁטֶף הוּא מֵבִיא כִּי אִם בְּדִין, כִּי <b>תמים פעלו<\/b>:<br><br><b>אל אמונה.<\/b> לְשַׁלֵּם לַצַּדִּיקִים צִדְקָתָם לָעוֹלָם הַבָּא, וְאַעַ\"פִּ שֶׁמְּאַחֵר אֶת תַּגְמוּלָם, סוֹפוֹ לְאַמֵּן אֶת דְּבָרָיו:<br><br><b>ואין עול.<\/b> אַף לָרְשָׁעִים מְשַׁלֵּם שְׂכַר צִדְקָתָם בָּעוֹלָם הַזֶּה (עי' ספרי):<br><br><b>צדיק וישר הוא.<\/b> הַכֹּל מַצְדִּיקִים עֲלֵיהֶם אֶת דִּינוֹ, וְכָךְ רָאוּי וְיָשָׁר לָהֶם, <b>צדיק<\/b> מִפִּי הַבְּרִיּוֹת <b>וישר הוא<\/b> וְרָאוּי לְהַצְדִּיקוֹ:", "rashi_en": "הצור תמים פעלו THE ROCK, HIS WORK IS PERFECT — Although He is strong (הצור!) yet when He brings punishment upon those who transgress His will, He does not bring it in a flood of anger, but in deliberate judgment, because תמים פעלו HIS WORK IS PERFECT.<br><br>אל אמונה A GOD OF FAITHFULNESS — faithful to recompense the righteous their righteousness in the world to come; and even though He defers their recompense, in the end He will prove faithful (אמן) to His promise.<br><br>ואין עול AND WITHOUT INJUSTICE — even to the wicked He pays the reward for their meritorious deeds, but in this world (Sifrei Devarim 307:11; cf. Rashi on Deuteronomy 7:10).<br><br>צדיק וישר הוא — The meaning is: All acknowledge His judgment to be just (צדיק), and this is befitting and right of them (ישר), i.e., He is declared צדיק by the mouth of men, וישר, and it is right for them to declare Him צדיק, as righteous."}, {"ch": 32, "v": 5, "aliyah": 1, "heb": "שִׁחֵ֥ת ל֛וֹ לֹ֖א בָּנָ֣יו מוּמָ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;דּ֥וֹר עִקֵּ֖שׁ וּפְתַלְתֹּֽל׃", "onk": "חַבִּילוּ לְהוֹן לָא לֵיהּ בְּנַיָּא <b>דִּי פְלָחוּ לְטַעֲוָתָא<\/b> דָּרָא <b>דְאַשְׁנִיּוּ עוֹבָדוֹהִי וְאִשְׁתַּנִּיּוּ<\/b>:", "onk_en": "Destructiveness does not affect Him, it is the defect of His children [<b>who prayed to idols<\/b>]; a generation [<b>that changed its activities and became changed<\/b>] warped and twisted.", "pj": "חַבִּילוּ עוֹבָדֵיהוֹן טַבְיָא בְּנַיָא חֲבִיבַיָא אִשְׁתַּכַּח מוּמָא בְּהוֹן דָרָא עוּקְמָנָא דְאַשְׁנִייוּ עוֹבָדֵיהוֹן וְאוּף סֵדֶר דִינֵיהּ דְעַלְמָא אִשְׁתַּנֵי עֲלֵיהוֹן", "pj_en": "The beloved children have corrupted their good works, a blemish is found upon them; a perverse generation which have altered their works; so shall the order of this world’s judgment be altered upon them.", "tj": "חַבִּילוּ בְּנַיָא עוֹבָדֵיהוֹן וְלָא קֳדָמוֹי מְחַבְּלִין אֶלָא לְהוֹן עַד דִי חַבָּלוּ מוּמָא אִיתְיְהַב בְּהוֹן דָרָא עוּקָמָא וּפְתַלְגָא דְשַׁנוּ עוֹבָדוֹי וְאַף סִידְרֵי עַלְמָא אִישְׁתַּנֵי עֲלוֹי:", "tj_en": "The children have corrupted their works, and not them only, but themselves also: they have so corrupted that the spot is upon them; a depraved and perverse generation which changeth its order of this world shall be changed upon it.", "rashi": "<b>שחת לו וגו'.<\/b> כְּתַרְגּוּמוֹ, \"חַבִּילוּ לְהוֹן לָא לֵהּ\":<br><br><b>בניו מומם.<\/b> בָּנָיו הָיוּ וְהַשְׁחָתָה שֶׁהִשְׁחִיתוּ הִיא מוּמָם:<br><br><b>בניו מומם.<\/b> מוּמָם שֶׁל בָּנָיו הָיָה וְלֹא מוּמוֹ:<br><br><b>דור עקש.<\/b> עָקֹם וּמְעֻקָּל, כְּמוֹ \"וְאֵת כָּל הַיְשָׁרָה יְעַקֵּשׁוּ\" (מיכה ג'). וּבִלְשׁוֹן מִשְׁנָה \"חֻלְדָּה שֶׁשִּׁנֶּיהָ עֲקֻמּוֹת וַעֲקוּשׁוֹת\":<br><br><b>ופתלתל.<\/b> אנטורט\"ילייש, כַּפְּתִיל הַזֶּה שֶׁגּוֹדְלִין אוֹתוֹ וּמַקִּיפִין אוֹתוֹ סְבִיבוֹת הַגְּדִיל; פְּתַלְתֹּל מִן הַתֵּבוֹת הַכְּפוּלוֹת כְּמוֹ \"יְרַקְרַק\" \"אֲדַמְדָּם\" (ויקרא י\"ג) \"סְחַרְחַר\" (תהילים ל\"ח), \"סְגַלְגַּל\" (תרגום יונתן מלכים א ז'):", "rashi_en": "שחת לו — Take it as the Targum has it: חבילו להון לא לה “Corruption is theirs, not His”.<br><br>בניו מומם HIS CHILDREN, THEIR FAULT — i.e., they were His children, and the corruption which they wrought is their fault.<br><br>בניו מומם means: it was the fault of His children not His fault. <br><br>דור עקש means, [A] CROOKED AND PERVERTED [GENERATION]. עקש has the same meaning as the verb in (Micah 3:9) “and pervert (יעקשו) all equity”. In Mishnaic Hebrew we have (Chullin 56a): a weasel whose teeth are bent and crooked (עקושות). <br><br>ופתלתל entortille in old French, Engl, twisted: like a thread (פתיל), which one twines and twists round the central strand. The word פתלתל is of the “doubled” words (in which the two last letters are the same), like (Leviticus 13:49): ירקרק. אדמדם; (Psalms 38:31): סחרחר; (‎1 Kings 7:23; Targum Jonathan on): סגלגל‎."}, {"ch": 32, "v": 6, "aliyah": 1, "heb": "<big>הַ<\/big> לְיְהֹוָה֙<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן <big>הַֽ<\/big>לְיהֹוָה֙ בתיבה אחת)<\/i> תִּגְמְלוּ־זֹ֔את&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;עַ֥ם נָבָ֖ל וְלֹ֣א חָכָ֑ם הֲלוֹא־הוּא֙ אָבִ֣יךָ קָּנֶ֔ךָ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ה֥וּא עָשְׂךָ֖ וַֽיְכֹנְנֶֽךָ׃", "onk": "הָא <b>קֳדָם<\/b> יְיָ אַתּוּן גָּמְלִין <b>דָּא<\/b> עַמָּא <b>דְקַבִּילוּ אוֹרַיְתָא<\/b> וְלָא חַכִּימוּ הֲלָא הוּא אֲבוּךְ וְאַתְּ דִּי לֵיהּ הוּא עָבְדָךְ וְאַתְקְנָךְ:", "onk_en": "Is it with [<b>before<\/b>] Adonoy that you deal this way? base people [<b>who received the Torah and are<\/b>] lacking wisdom. Is He not your Father, who made you His? He made you and gave you a base.", "pj": "הַאֶפְשַׁר דִלְשׁוּם מֵימְרָא דַיְיָ אַתּוּן גָמְלִין דָא עַמָא דְהַווֹן טִפְּשִׁין וְקַבִּילוּ אוֹרַיְיתָא וְלָא חַכִּימוּ הֲלָא הוּא אֲבוּכוֹן דִי קְנָא יַתְכוֹן הוּא בְּרָא יַתְכוֹן וְשַׁכְלֵיל יַתְכוֹן", "pj_en": "Can you indeed so requite the Name of the Word of the Lord, O foolish people, and receive the law, yet not be made wise? Is He not your Father who bought you, who created you and established you?", "tj": "הָא מִן קֳדָם יְיָ תִּגְמְלוּ הֲדָא אוּמָא טִפְּשָׁא וְלָא חַכִּימַיָא הֲלָא הוּא אֲבוּכוֹן דְבִשְׁמַיָא דִקְנָא יַתְכוֹן הוּא בְּרָא יַתְכוֹן וְשַׁכְלֵיל יַתְכוֹן:", "tj_en": "Do you return this before the Lord, O people foolish and unwise? Is He not your Father who is in heaven, who bought you? He created and founded you.", "rashi": "<b>הלה' תגמלו זאת.<\/b> לְשׁוֹן תֵּמָהּ, וְכִי לְפָנָיו אַתֶּם מַעֲצִיבִין שֶׁיֵּשׁ בְּיָדוֹ לִפָּרַע מִכֶּם וְשֶׁהֵיטִיב לָכֶם בְּכָל הַטּוֹבוֹת?<br><br><b>עם נבל.<\/b> שֶׁשָּׁכְחוּ אֶת הֶעָשׂוּי לָהֶם:<br><br><b>ולא חכם.<\/b> לְהָבִין אֶת הַנּוֹלָדוֹת, שֶׁיֵּשׁ בְּיָדוֹ לְהֵיטִיב וּלְהָרַע:<br><br><b>הלוא הוא אביך קנך.<\/b> שֶׁקְּנָאֲךָ, שֶׁקִּנֶּנְךָ בְּקַן הַסְּלָעִים וּבְאֶרֶץ חֲזָקָה, שֶׁתִּקֶּנְךָ בְּכָל מִינֵי תַקָּנָה:<br><br><b>הוא עשך.<\/b> אֻמָּה בָּאֻמּוֹת:<br><br><b>ויכננך.<\/b> אַחֲרֵי כֵן בְּכָל מִינֵי בָסִיס וְכַן — מִכֶּם כֹּהֲנִים, מִכֶּם נְבִיאִים וּמִכֶּם מְלָכִים, כְּרַךְ שֶׁהַכֹּל בּוֹ (ספרי; חולין נ\"ו):", "rashi_en": "הלה׳ תגמלו זאת DO YOU THUS REQUITE THE LORD? — This Is an expression of astonishment: Do you mean to grieve Him Who has the power to punish you, and Who has bestowed all these favours upon you?<br><br>עם נבל A FOOLISH PEOPLE — i.e., a people that has forgotten all that has been done to them,<br><br>ולא חכם AND NOT WISE to consider what will result from their actions, viz., that it is in His power to do them good or evil according to their actions (cf. Siphre).<br><br>הלא הוא אביך קנך IS NOT HE THY FATHER קנך? The last word may mean: Who has acquired (קנה) thee, or, Who has placed thee (more lit., made thee nest, קנן) in a nest of rocks and in strong ground, or. Who has fitted you out (תקן) with everything that will benefit you.<br><br>הוא עשך HE HATH MADE THEE a nation among the nations of the world,<br><br>ויכננך AND HATH ESTABLISHED THEE afterwards on every kind of firm base and foundation (כן) (i.e. made you self-contained): out of your midst come your priests, out of your midst your Levites, and out of your midst your kings — a city in which is everything (Sifrei Devarim 309:7; Chullin 56b)."}, {"ch": 32, "v": 7, "aliyah": 2, "heb": "זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ שְׁנ֣וֹת דֹּר־וָדֹ֑ר&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;שְׁאַ֤ל אָבִ֙יךָ֙ וְיַגֵּ֔דְךָ זְקֵנֶ֖יךָ וְיֹ֥אמְרוּ לָֽךְ׃", "onk": "אִדְכַּר יוֹמִין דְּמִן עָלְמָא אִסְתַּכַּל בִּשְׁנֵי דַר וְדָר שְׁאַל אֲבוּךְ וִיחַוִּי לָךְ סָבִיךְ וְיֵימְרוּן לָךְ:", "onk_en": "Remember world history, study the generational epochs. Ask your father and he will relate to you, your elders and they will tell you.", "pj": "אִידְכָּרוּ מִן יוֹמַת עַלְמָא אִתְבּוֹנְנוּ בִּשְׁנַתְהוֹן דְכָל דָר וְדָר קְרוֹן בְּסִפְרֵי אוֹרַיְיתָא וְיִתְנוּן לְכוֹן וּבְסִפְרֵי נְבִיָא וְיֵימְרוּן לְכוֹן", "pj_en": "Remember the days of old; consider the years of every generation; read the books of the law, and they will teach you, and the books of the prophets, and they will tell you.", "tj": "אִידְכָּרוּ יוֹמִין יְמוֹת עַלְמָא אִתְבּוֹנְנוּ לִשְׁנֵי בְּכָל דָר וְדָר שְׁאִיל לְאַבְהַתְכוֹן דְרַבְרְבִין מִנְכוֹן בְּאוֹרַיְיתָא וְיִתְנוּן לְכוֹן חַכִּימִין וְיֵימְרוּן לְכוֹן:", "tj_en": "Be mindful of the days, the days of old, consider the years of one generation and another; ask your fathers who are greater in the law than you, and they will teach you, the sages, and they will tell you.", "rashi": "<b>זכר ימות עולם.<\/b> מֶה עָשָׂה בָרִאשׁוֹנִים שֶׁהִכְעִיסוּ לְפָנָיו:<br><br><b>בינו שנות דר ודר.<\/b> דּוֹר אֱנוֹשׁ שֶׁהֵצִיף עֲלֵיהֶם מֵי אוֹקְיָנוּס וְדוֹר הַמַּבּוּל שֶׁשְּׁטָפָם. דָּ\"אַ — לֹא נְתַתֶּם לְבַבְכֶם עַל שֶׁעָבַר, <b>בינו שנות דר ודר<\/b> — לְהַכִּיר לְהַבָּא, שֶׁיֵּשׁ בְּיָדוֹ לְהֵיטִיב לָכֶם וּלְהַנְחִיל לָכֶם יְמוֹת הַמָּשִׁיחַ וְהָעוֹלָם הַבָּא (עי' ספרי):<br><br><b>שאל אביך.<\/b> אֵלּוּ הַנְּבִיאִים שֶׁנִּקְרָאִים אָבוֹת, כְּמוֹ שֶׁנֶּאֱמַר (מלכים ב ב') בְּאֵלִיָּהוּ \"אָבִי אָבִי רֶכֶב יִשְׂרָאֵל\" (ספרי):<br><br><b>זקניך.<\/b> אֵלּוּ הַחֲכָמִים:<br><br><b>ויאמרו לך.<\/b> הָרִאשׁוֹנוֹת:", "rashi_en": "זכר ימות עולם REMEMBER THE DAYS OF OLD — what He did to previous generations who provoked Him to anger,<br><br>בינו שנות דר ודר [CONSIDER] THE YEARS OF GENERATION AFTER GENERATION — the generation of Enosh over whom He caused the waters of the ocean to flow, and the generations of the flood whom He drowned by flood (cf. Sifrei Devarim 310:1). Another explanation is: If you have not set your attention to the past (i.e. if you fail to remember the days of old, then) בינו שנות דר ודר CONSIDER at least THE YEARS OF GENERATION AND GENERATION so that you become conscious of what might happen in the future — that He has the power to bestow good upon you and to make you inherit the blissful days of Messiah and the world to come (cf. Sifrei Devarim 310:5).<br><br>שאל אביך ASK THY FATHER — these are the prophets who are termed fathers, as it is stated in the history of Elijah that Elisha exclaimed when Elijah departed, (2 Kings 2:12): “My father, my father, the chariot of Israel!” (cf. Sifrei Devarim 310:3).<br><br>זקניך THY ELDERS — these are the sages,<br><br>ויאמרו לך AND THEY WILL TELL THEE the events of the former days:"}, {"ch": 32, "v": 8, "aliyah": 2, "heb": "בְּהַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;בְּהַפְרִיד֖וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;לְמִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "בְּאַחֲסָנָא עִלָּאָה עַמְמַיָּא בְּפָרָשׁוּתֵיהּ בְּנֵי אֲנָשָׁא קַיִּים תְּחוּמֵי עַמְמַיָּא לְמִנְיַן בְּנֵי יִשְׂרָאֵל:", "onk_en": "When the Exalted One bequeathed nations, when He set apart the sons of man; He established the boundaries of peoples according to the number of Bnei Yisroel.", "pj": "בְּאַחְסָנוּת עִלָאָה עַלְמָא לְעַמְמַיָא דִי נְפָקוּ מִבְּנוֹי דְנׂחַ בְּאַפְרָשׁוּתֵיהּ מִכְתָּבִין וְלִישְׁנִין לִבְנֵי נְשָׁא בְּדָרָא דְפַלְגוּתָא בֵּי הוּא זִמְנָא רָמָא פִיצְתָא עִם שׁוּבְעִין מַלְאָכַיָא רַבְרְבֵי עַמְמִין דְאִתְגְלֵי עִמְהוֹן לְמֶחֱמֵי קַרְתָּא וּבֵי הוּא זִמְנָא אָקִים תְּחוּמֵי אוּמַיָא כִּסְכוּם מִנְיַין שׁוּבְעִין נַפְשָׁתָא דְיִשְרָאֵל דִנְחָתוּ לְמִצְרַיִם", "pj_en": "When the Most High made allotment of the world unto the nations which proceeded from the sons of Noach, in the separation of the writings and languages of the children of men at the time of the division, He cast the lot among the seventy angels, the princes of the nations with whom is the revelation to oversee the city, even at that time He established the limits of the nations according to the sum of the number of the seventy souls of Israel who went down into Mizraim.", "tj": "בְּאַחֲסָנוּת עִילַיָא אוּמַיָא בְּפָרָשׁוּתֵיהּ לִשְׁנֵי בְּנֵי אֵינָשָׁא קְבַע תְּחוּמִין לְאוּמַיָא לְמִנְיָן שִׁבְטַיָא דִבְנֵי יִשְרָאֵל:", "tj_en": "When the Most High divided the nations by lot, and distinguished the languages of the children of men, He appointed the bounds of the peoples according to the number of the tribes of the Beni Israel.", "rashi": "<b>בהנחל עליון גוים.<\/b> כְּשֶׁהִנְחִיל הַקָּבָּ\"ה לְמַכְעִיסָיו אֶת חֵלֶק נַחֲלָתָן הֱצִיפָן וּשְׁטָפָם:<br><br><b>בהפרידו בני אדם.<\/b> כְּשֶׁהֵפִיץ דּוֹר הַפַּלָּגָה הָיָה בְיָדוֹ לְהַעֲבִירָם מִן הָעוֹלָם, לֹא עָשָׂה כֵן אֶלָּא <b>יצב גבלת עמים<\/b>, קִיְּמָם וְלֹא אִבְּדָם:<br><br><b>למספר בני ישראל.<\/b> בִּשְׁבִיל מִסְפַּר בְּנֵי יִשְׂרָאֵל שֶׁעֲתִידִין לָצֵאת מִבְּנֵי שֵׁם, וּלְמִסְפַּר שִׁבְעִים נֶפֶשׁ שֶׁל בְּנֵי יִשְׂרָאֵל שֶׁיָּרְדוּ לְמִצְרַיִם הִצִּיב <b>גבלת עמים<\/b> — שִׁבְעִים לָשׁוֹן:", "rashi_en": "בהנחל עליון גוים WHEN THE MOST HIGH DIVIDED TO THE NATIONS THEIR INHERITANCE — when the Holy One, blessed be He gave those who provoked Him to anger their inheritance, He afterwards caused the flood to pass over them and He drowned them (Sifrei Devarim 311:1)<br><br>בהפרידו בני אדם WHEN HE SEPARATED THE SONS OF ADAM — i.e. when He scattered the generation which witnessed the separation of races, He also had the power to remove them from the world, yet He did not do so, but יצב גבלת עמים HE FIRMLY ESTABLISHED THE BOUNDARIES OF THE NATIONS — He let them (the peoples) remain in existence and did not destroy them,<br><br>למספר בני ישראל ACCORDING TO THE NUMBER OF THE CHILDREN OF ISRAEL — i.e. because of the number of the children of Israel that were in future to descend from Shem’s sons, and in accordance with the number of seventy souls of the children of Israel who went down to Egypt He firmly established גבלת עמים THE NATIONS ACCORDING TO THEIR BOUNDARIES — i.e. seventy separate nations (cf. Sifrei Devarim 311:5)."}, {"ch": 32, "v": 9, "aliyah": 2, "heb": "כִּ֛י חֵ֥לֶק יְהֹוָ֖ה עַמּ֑וֹ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;יַעֲקֹ֖ב חֶ֥בֶל נַחֲלָתֽוֹ׃", "onk": "אֲרֵי חֳלָקָא דַיְיָ עַמֵּיהּ יַעֲקב עֲדַב אַחֲסַנְתֵּיהּ:", "onk_en": "Because [of] Adonoy’s portion, His people, Yaakov the cable of His heritage.", "pj": "וְכֵיוַן דְנָפַל עַמָא קַדִישָׁא בְּפִיצְתָא דְמָארֵי עַלְמָא פָּתַח מִיכָאֵל פּוּמֵיהּ וַאֲמַר אֲרוּם חוּלַק טָב דְשׁוּם מֵימְרָא דַיְיָ עַמֵיהּ פָּתַח גַבְרִיאֵל פּוּמֵיהּ בְּתוּשְׁבְּחָא וַאֲמַר דְבֵית יַעֲקׂב עֲדַב אַחְסַנְתֵּיהּ", "pj_en": "And when the holy people fell to the lot of the Lord of all the world, Michael opened his lips and said: Let the good portion of the Name of the Lord’s Word be with Him. Gabriel opened his lips with thanksgivings, and said, Let the house of Jakob be the lot of His inheritance.", "tj": "אֲרוּם לְחַלְקָא דַיְיָ אִינוּן עַמֵיהּ דִבְנֵי יִשְרָאֵל וּדְבֵית יַעֲקב עֲדַב אַחֲסַנְתֵּיהּ:", "tj_en": "Because the Lord's portion are His people, and the house of Jakob the lot of His inheritance.", "rashi": "<b>כי חלק ה' עמו.<\/b> לָמָּה כָּל זֹאת? לְפִי שֶׁהָיָה חֶלְקוֹ כָּבוּשׁ בֵּינֵיהֶם וְעָתִיד לָצֵאת, וּמִי הוּא חֶלְקוֹ? <b>עמו.<\/b> וּמִי הוּא עַמּוֹ?<br><br><b>יעקב חבל נחלתו.<\/b> וְהוּא הַשְּׁלִישִׁי בָּאָבוֹת, הַמְשֻׁלָּשׁ בְּשָׁלוֹשׁ זְכֻיּוֹת, זְכוּת אֲבִי אָבִיו וּזְכוּת אָבִיו וּזְכוּתוֹ, הֲרֵי ג', כַּחֶבֶל הַזֶּה שֶׁהוּא עָשׂוּי בְּג' גְּדִילִים, וְהוּא וּבָנָיו הָיוּ לוֹ לְנַחֲלָה, וְלֹא יִשְׁמָעֵאל בֶּן אַבְרָהָם, וְלֹא עֵשָׂו בְּנוֹ שֶׁל יִצְחָק (עי' ספרי):", "rashi_en": "כי חלק ה' עמו FOR THE PORTION OF THE LORD, HIS PEOPLE — Why all this? (Why did He save them from destruction?) because His portion was comprised in them and was destined to come forth. And who is His portion? עמו HIS PEOPLE. And Who is His people? <br><br>יעקב חבל נחלתו JACOB THE ROPE OF HIS INHERITANCE — and he is the third amongst the patriarchs, who is endowed with three merits: the merit of his grandfather, the merit of his father and his own merit thus altogether three — like a rope (חבל) that is made up of three strands. Only he and his sons became His inheritance, not, however, Ishmael, Abraham’s son, nor Esau, Isaac’s son (cf. Sifrei Devarim 312:3),"}, {"ch": 32, "v": 10, "aliyah": 2, "heb": "יִמְצָאֵ֙הוּ֙ בְּאֶ֣רֶץ מִדְבָּ֔ר&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וּבְתֹ֖הוּ יְלֵ֣ל יְשִׁמֹ֑ן יְסֹבְבֶ֙נְהוּ֙ יְב֣וֹנְנֵ֔הוּ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;יִצְּרֶ֖נְהוּ כְּאִישׁ֥וֹן עֵינֽוֹ׃", "onk": "<b>סַפִּיק צָרְכֵּיהוֹן<\/b> בְּאַרְעָא מַדְבְּרָא <b>וּבֵית צַחֲוָנָא אֲתֵר דִּי לֵית מַיָּא אַשְׁרִנּוּן<\/b> סְחוֹר סְחוֹר <b>לְשְׁכִנְתֵּיהּ אַלֵּפִנּוּן פִּתְגָּמֵי אוֹרַיְתָא נְטָרִנּוּן<\/b> כְּבָבַת <b>עֵינֵיהוֹן<\/b>:", "onk_en": "He found them [<b>satisfied their needs<\/b>] in a wilderness country, in arid, shrieking desolation [<b>a place where there was no water<\/b>]. He encircled [<b>placed them<\/b>] them around [<b>His Shechinah<\/b>], He granted them understanding [<b>He taught them Torah<\/b>], He sheltered them like the pupil of His eye [<b>their eyes<\/b>].", "pj": "אֲרַע יַתְהוֹן שַׁרְיָין בְּמַדְבְּרָא בִּצְדִיוּת אֲתַר דִמְיַלְלִין שֵׁידִין וִידוּרִין וּבֵית צָחוֹתָא אָגִין עֲלֵיהוֹן שִׁבְעָתֵי עֲנָנֵי אִיקְרֵיהּ אַלֵיפִינוּן יַת אוֹרַיְיתֵיהּ נַטְרִינוּן הֵיכְמָא דִשְׁכִינָא נַטְרָא בְבֵי רְעִיוֹנֵיהּ", "pj_en": "He found them dwelling in the wilderness, in the solitude, the place of howling demons and thorns, the place of thirsting; He overspread them with His seven glorious clouds; He taught them His law; He kept them as the Shekinah keepeth the apple of His eye.", "tj": "אֲרַע יַתְהוֹן טַעֲיָין בְּאַרְעָא ^מַדְבְּרָא וּבְצָחוֹתָא דְלֵיל יְשִׁימוֹן אַקִיף עֲלֵיהוֹן עֲנָנֵי יְקַר שְׁכִינְתֵּיהּ אַלִיף יַתְהוֹן עֲשַרְתֵּי דִבָּרַיָא נְטַר יַתְהוֹן וְעַיְינֵי יַתְהוֹן הֵיךְ דִשְׁכִינָא נְטַר עַיְינָא:", "tj_en": "He found them wandering in a desert land, in the solitude of a howling wilderness; He threw over them clouds of glory; His Shekinah taught them the Ten Words, watched over them, and kept them as the apple of His eye.", "rashi": "<b>ימצאהו בארץ מדבר.<\/b> אוֹתָם מָצָא לוֹ נֶאֱמָנִים בְּאֶרֶץ הַמִּדְבָּר, שֶׁקִּבְּלוּ עֲלֵיהֶם תּוֹרָתוֹ וּמַלְכוּתוֹ וְעֻלּוֹ, מַה שֶּׁלֹּא עָשׂוּ יִשְׁמָעֵאל וְעֵשָׂו, שֶׁנֶּאֱמַר (דברים ל\"ג) \"וְזָרַח מִשֵּׂעִיר לָמוֹ הוֹפִיעַ מֵהַר פָּארָן\":<br><br><b>ובתהו ילל ישמן.<\/b> אֶרֶץ צִיָּה וּשְׁמָמָה, מְקוֹם יִלְלַת תַּנִּינִים וּבְנוֹת יַעֲנָה, אַף שָׁם נִמְשְׁכוּ אַחַר הָאֱמוּנָה, וְלֹא אָמְרוּ לְמֹשֶׁה הֵיאַךְ נֵצֵא לַמִּדְבָּרוֹת מְקוֹם צִיָּה וְשִׁמָּמוֹן? כָּעִנְיָן שֶׁנֶּאֱמַר (ירמיהו ב'), \"לֶכְתֵּךְ אַחֲרַי בַּמִּדְבָּר\":<br><br><b>יסבבנהו.<\/b> שָׁם סִבְּבָם וְהִקִּיפָם בַּעֲנָנִים וְסִבְּבָם בִּדְגָלִים לְאַרְבַּע רוּחוֹת וְסִבְּבָן בְּתַחְתִּית הָהָר שֶׁכָּפָהוּ עֲלֵיהֶם כְּגִיגִית (עי' ספרי):<br><br><b>יבוננהו.<\/b> שָׁם בְּתוֹרָה וּבִינָה:<br><br><b>יצרנהו.<\/b> מִנָּחָשׁ שָׂרָף וְעַקְרָב וּמִן הָאֻמּוֹת:<br><br><b>כאישון עינו.<\/b> הוּא הַשָּׁחֹר שֶׁבָּעַיִן שֶׁהַמָּאוֹר יוֹצֵא הֵימֶנּוּ. וְאֻנְקְלוֹס תִּרְגֵּם יִמְצָאֵהוּ — \"יַסְפִּיקֵהוּ כָּל צָרְכּוֹ בַמִּדְבָּר\", כְּמוֹ (במדבר י\"א) \"מָצָא לָהֶם\", (יהושע י\"ז) \"לֹא יִמָּצֵא לָנוּ הָהָר\":<br><br><b>יסבבנהו.<\/b> \"אַשְׁרִינוּן סְחוֹר סְחוֹר לִשְׁכִנְתֵּיהּ\", אֹהֶל מוֹעֵד בָּאֶמְצָע וְאַרְבָּעָה דְגָלִים לְאַרְבַּע רוּחוֹת:", "rashi_en": "ימצאהו בארץ מדבר HE FOUND HIM IN A DESERT LAND — for them (Jacob’s sons) he found to be faithful to Him in the desert land, when they accepted His Torah, His sovereignty and His yoke, something that Ishmael and Esau had refused to do, as it is said, (Deuteronomy 33:2) “And He shone from the Seir (Esau) unto them, He appeared from Mount Paran (Ishmael)” (cf. Rashi on that verse).<br><br>ובתהו ילל ישמן AND IN THE DESOLATE HOWLING SOLITUDE — i.e. in a land of drought and desolation, a place of screeching monsters and ostriches; even there they adhered to their faith and did not say to Moses, “But how can we go out into the wilderness, a place of drought and desolation?” — just as it is stated, (Jeremiah 2:2) “[I remember the loving kindness of your youth, the love of your espousals,] When you went after Me in the wilderness, [in to a land that was not sown]” (cf. Rashi on Exodus 12:39).<br><br>יסבבנהו HE SURROUNDED HIM — there He surrounded them and encompassed them with the “clouds of Glory”; He surrounded them with the banners on their four sides; he surrounded them by the underside of the mountain (Sinai), which He arched over them like a cask (cf. Sifrei Devarim 313:11).<br><br>יבוננהו HE INSTRUCTED HIM there in Torah and wisdom.<br><br>יצרנהו HE GUARDED HIM from snakes, serpents and scorpions and from hostile nations,<br><br>כאישון עינו AS THE אישון OF HIS EYE — that is the black in the eye from which the light comes. Onkelos, however, rendered ימצאהו by “He provided Him” with all He needed in the wilderness. It took the words to be of the same meaning as, (Numbers 11:22) “[Shall the flocks … be slain for them] to suffice (ומצא) them?” and (Joshua 17:16) “The hill is not enough (ימצא) for us”.<br><br>יסבבנהו — Onkelos renders this by “He made them abide round about His Divine dwelling place” — the “tent of congregation” in the middle and the divisions of the tribes (lit., the banners) on the four sides."}, {"ch": 32, "v": 11, "aliyah": 2, "heb": "כְּנֶ֙שֶׁר֙ יָעִ֣יר קִנּ֔וֹ עַל־גּוֹזָלָ֖יו יְרַחֵ֑ף&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;יִפְרֹ֤שׂ כְּנָפָיו֙ יִקָּחֵ֔הוּ יִשָּׂאֵ֖הוּ עַל־אֶבְרָתֽוֹ׃", "onk": "כְּנִשְׁרָא <b>דִּמְחִישׁ<\/b> לְקִנֵּיהּ עַל בְּנוֹהִי מִתְחוֹפֵף פָּרִיס גַּדְפּוֹהִי מְקַבֶּלְהוֹן מְנַטֶּלְהוֹן עַל <b>תְּקוֹף אֱבָרוֹהִי<\/b>:", "onk_en": "Like an eagle who rouses [<b>protects<\/b>] his nest, fluttering over his young, He extends His wings, grasps them, He bears them on His [<b>strong<\/b>] wing.", "pj": "הֵיךְ נִישְׁרָא דִמְעוֹרֵר וּמֵחִישׁ לְשַׁרְכַפְתֵּיהּ וְעַל חָסִילוֹי מְחוֹפֵף כְּדֵין שְׁכִינְתֵּיהּ מְעוֹרֵר לְמַשִׁירְיַתְהוֹן דְיִשְרָאֵל וְחָפָא עֲלֵיהוֹן טוֹל שְׁכִינְתֵּיהּ וְהֵיכְמָא דְנִישְׁרָא פָּרִיס גַדְפוֹי עַל בְּנוֹי וְטָעִין יַתְהוֹן וְסָבִיל יַתְהוֹן עַל אֵיבָרוֹי כְּדֵין טַעֲנִינוּן וְסַבְלִינוּן וְאַשְׁרִינוּן עַל תְּקוֹף כָּרְכֵי אַרְעָא דְיִשְרָאֵל", "pj_en": "As an eagle stirreth up and careth for his nest, and hovereth over his young, so did His Shekinah stir up the tents of Israel, and the shadow of His Shekinah overspread them; and as an eagle outstretcheth his wings over his young ones, beareth them and carrieth them upon his wings, so bare He them and carried them, and made them dwell upon the strong places of the land of Israel.", "tj": "כְּנִישְׁרָא דְמֵעִיר עַל קִינֵיהּ וְעַל גוֹזָלוֹי הוּא מְחַסְחַף פְּרָס כַּנְפוֹי וְטָעַן יַתְהוֹן וּסְבַל יַתְהוֹן עַל תְּקוֹף אֶבְרוֹי:", "tj_en": "As an eagle stirreth up his nest, and carefully spreadeth out his wings, and taketh and beareth them with the strength of his wings.", "rashi": "<b>כנשר יעיר קנו.<\/b> נִהֲגָם בְּרַחֲמִים וּבְחֶמְלָה, כַּנֶּשֶׁר הַזֶּה רַחְמָנִי עַל בָּנָיו, וְאֵינוֹ נִכְנָס לְקִנּוֹ פִּתְאֹם עַד שֶׁהוּא מְקַשְׁקֵשׁ וּמְטָרֵף עַל בָּנָיו בִּכְנָפָיו בֵּין אִילָן לְאִילָן, בֵּין שׂוֹכָה לַחֲבֶרְתָּהּ, כְּדֵי שֶׁיֵּעוֹרוּ בָּנָיו וִיהֵא בָהֶם כֹּחַ לְקַבְּלוֹ (ספרי):<br><br><b>יעיר קנו.<\/b> יְעוֹרֵר בָּנָיו:<br><br><b>על גוזליו ירחף.<\/b> אֵינוֹ מַכְבִּיד עַצְמוֹ עֲלֵיהֶם אֶלָּא מְחוֹפֵף — נוֹגֵעַ וְאֵינוֹ נוֹגֵעַ (תלמוד ירושלמי חגיגה ב') — אַף הַקָּבָּ\"הּ, \"שַׁדַּי לֹא מְצָאנֻהוּ שַׂגִּיא כֹחַ\" (איוב ל\"ז) כְּשֶׁבָּא לִתֵּן תּוֹרָה לֹא נִגְלָה עֲלֵיהֶם מֵרוּחַ אַחַת אֶלָּא מֵאַרְבַּע רוּחוֹת, שֶׁנֶּאֱמַר \"ה' מִסִּינַי בָּא וְזָרַח מִשֵּׂעִיר לָמוֹ הוֹפִיעַ מֵהַר פָּארָן\" (דברים ל\"ג), \"אֱלוֹהַּ מִתֵּימָן יָבוֹא\" (חבקוק ג') — זוֹ רוּחַ רְבִיעִית (ספרי):<br><br><b>יפרש כנפיו יקחהו.<\/b> כְּשֶׁבָּא לִטְּלָם מִמָּקוֹם לְמָקוֹם אֵינוֹ נוֹטְלָן בְּרַגְלָיו כִּשְׁאָר עוֹפוֹת, לְפִי שֶׁשְּׁאָר עוֹפוֹת יְרֵאִים מִן הַנֶּשֶׁר שֶׁהוּא מַגְבִּיהַּ לָעוּף וּפוֹרֵחַ עֲלֵיהֶם, לְפִיכָךְ נוֹשְׂאָן בְּרַגְלָיו, מִפְּנֵי הַנֶּשֶׁר, אֲבָל הַנֶּשֶׁר אֵינוֹ יָרֵא אֶלָּא מִן הַחֵץ, לְפִיכָךְ נוֹשְׂאָן עַל כְּנָפָיו, אוֹמֵר מוּטָב שֶׁיִּכָּנֵס הַחֵץ בִּי וְלֹא יִכָּנֵס בְּבָנַי, אַף הַקָּבָּ\"ה (שמות י\"ט) \"וָאֶשָּׂא אֶתְכֶם עַל כַּנְפֵי נְשָׁרִים\" — כְּשֶׁנָּסְעוּ מִצְרַיִם אַחֲרֵיהֶם וְהִשִּׂיגוּם עַל הַיָּם הָיוּ זוֹרְקִים בָּהֶם חִצִּים וְאַבְנֵי בָּלִיסְטְרָאוֹת, מִיָּד \"וַיִּסַּע מַלְאַךְ הָאֱלֹהִים וְגוֹ' וַיָּבֹא בֵּין מַחֲנֵה מִצְרַיִם וְגוֹ'\" (שמות י\"ד):", "rashi_en": "כנשר יעיר קנו AS AN EAGLE STIRRETH UP ITS NEST — He guided them with mercy and pity like the eagle which is full of pity towards his young and does not enter its nest suddenly — before it beats and flaps with its wings above its young passing between tree and tree, between branch and branch, in order that its young may awake and have enough strength to receive it (Sifrei Devarim 314:1).<br><br>יעיר קנו means, AWAKENS ITS YOUNG (i.e. קן, “nest” is a term for young birds).<br><br>על גוזליו ירחף IT HOVERETH OVER ITS YOUNG — it does not press heavily upon them, but hovers above them — touching them and yet not touching them. So too, the Holy One, blessed be He, (Job. 37:23) “The Almighty, we did not find Him to be too powerful in strength”: when He came to give the Torah to Israel, He did not reveal Himself from one side, (thus concentrating His power at one point), but from four sides, as it is said, (Deuteronomy 33:2) “The Lord came from Sinai, and shone forth from Seir unto them; He appeared from Mount Paran\"; also (Habakkuk 3:3) “God came from Teman” — this is the fourth side (Sifrei Devarim 314:1).<br><br>יפרש כנפיו יקחהו [AS AN EAGLE …] SPREADETH ABROAD ITS WINGS, TAKETH IT — When it comes to remove them (the young) from one place to another, it does not take them with its claws, as other birds do: because other birds are afraid of the eagle that soars so high and flies above them, therefore they carry them (the young) by their (the mother’s) claws for fear of the eagle. But the eagle is afraid only of an arrow, therefore it carries them (the young) on its wings, saying, “It is better that the arrow pierce me than that it should pierce my young”. So, too, the Holy One, blessed be He, says, (Exodus 19:4) “I bare you as on eagles wings” (Mekhilta): when the Egyptians marched after them and overtook them at the Red Sea, they threw arrows and stone missiles at them, whereupon at once “The angel of God moved … and came between the camp of Egypt [and the camp of Israel]” that it might receive the arrows etc. (Exodus 14:19—20 And Rashi thereon)."}, {"ch": 32, "v": 12, "aliyah": 2, "heb": "יְהֹוָ֖ה בָּדָ֣ד יַנְחֶ֑נּוּ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְאֵ֥ין עִמּ֖וֹ אֵ֥ל נֵכָֽר׃", "onk": "יְיָ בִּלְחוֹדוֹהִי <b>עֲתִיד <\/b>לְאַשְׁרָיוּתְהוֹן<b> בְּעָלְמָא דְּהוּא עָתִיד לְאִתְחַדָּתָא<\/b> וְלָא <b>יִתְקַיַּם קֳדָמוֹהִי פָּלְחַן טַעֲוָן<\/b>:", "onk_en": "Adonoy conducted them alone, without [opposition by] alien gods. [<b>Hashem alone will, in the future, place them in the world that He will renew and no idol worship will exist before Him.<\/b>]", "pj": "מֵימְרָא דַיְיָ בִּלְחוֹדֵיהוֹן יַשְׁרִינוּן בְּאַרְעֲהוֹן וְלָא מַשְׁרֵי בֵּינֵיהוֹן פַּלְחֵי פּוּלְחָנָא נוּכְרָאָה", "pj_en": "The Word of the Lord made them to dwell in His land, nor suffered any among them to be the followers of strange worship.", "tj": "יְיָ לְבִלְחוֹדֵיהוֹן אַשְׁרֵי יַתְהוֹן וְלֵית בֵּינֵיהוֹן פַּלְחֵי פּוּלְחַן נוּכְרָי:", "tj_en": "The Lord alone caused them to dwell, and none were among them who served with strange worship.", "rashi": "<b>ה' בדד ינחנו.<\/b> נִהֲגָם בַּמִּדְבָּר בָּדָד וּבֶטַח:<br><br><b>ואין עמו אל נכר.<\/b> לֹא הָיָה כֹחַ בְּאֶחָד מִכָּל אֱלֹהֵי הַגּוֹיִם לְהַרְאוֹת כֹּחוֹ וּלְהִלָּחֵם עִמָּהֶם. וְרַבּוֹתֵינוּ דְרָשׁוּהוּ עַל הֶעָתִיד וְכֵן תִּרְגֵּם אֻנְקְלוֹס, וַאֲנִי אוֹמֵר דִּבְרֵי תּוֹכֵחָה הֵם לְהָעִיד הַשָּׁמַיִם וְהָאָרֶץ וּתְהֵא הַשִּׁירָה לָהֶם לְעֵד שֶׁסּוֹפָן לִבְגֹּד וְלֹא יִזְכְּרוּ לֹא הָרִאשׁוֹנוֹת שֶׁעָשָׂה לָהֶם וְלֹא הַנּוֹלָדוֹת שֶׁהוּא עָתִיד לַעֲשׂוֹת לָהֶם, לְפִיכָךְ צָרִיךְ לְיַשֵּׁב הַדָּבָר לְכָאן וּלְכָאן. וְכָל הָעִנְיָן מוּסָב עַל <b>זכר ימות עולם בינו שנות דר ודר<\/b>, כֵּן עָשָׂה לָהֶם וְכֵן עָתִיד לַעֲשׂוֹת, כָּל זֶה הָיָה לָהֶם לִזְכֹּר:", "rashi_en": "ה׳ בדד ינחנו THE LORD ALONE GUIDED THEM — i.e. He guided them in the wilderness alone (unassisted) and yet in security,<br><br>ואין עמו אל נכר AND THERE WAS NO STRANGE GOD WITH HIM — for not one of the gods of the other peoples possessed the power to display its might and to war with them. — Our Rabbis, however, explained it as a promise referring to the future (cf. Sifrei Devarim 315), and so, too, does Onkelos render it. But I say that they (the statements of this chapter) are words of reproof which he said with the view of calling heaven and earth as witnesses against them, and also in order that this song (cf. Deuteronomy 31:21) should be witness, because He knew (Deuteronomy 31:29) that they would in future prove faithless and would bear in mind neither the past (lit., the first) deeds that He performed for them nor those that would come to pass (lit., that would be born), which at a future time He would do for them. For this reason it is necessary to make the text fit in with this and with that (the past and the future). Indeed, the whole section is to be connected with (v. 7) “Remember the days of old (i.e., the past), consider the years of generation after generation” (the future) (cf. Rashi on that verse): Thus has He done for them and thus will He in the future do for them — all this they ought to bear in mind."}, {"ch": 32, "v": 13, "aliyah": 3, "heb": "יַרְכִּבֵ֙הוּ֙ עַל־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[בָּ֣מֳתֵי]<\/span> <span class=\"mam-kq-k\">(במותי)<\/span><\/span> אָ֔רֶץ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וַיֹּאכַ֖ל תְּנוּבֹ֣ת שָׂדָ֑י וַיֵּנִקֵ֤הֽוּ דְבַשׁ֙ מִסֶּ֔לַע&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְשֶׁ֖מֶן מֵחַלְמִ֥ישׁ צֽוּר׃", "onk": "<b>אַשְׁרִנּוּן עַל תָּקְפֵי אַרְעָא וְאוֹכָלִנּוּן בִּזַּת סָנְאֵיהוֹן וִיהַב לְהוֹן בִּזַּת שַׁלִּיטֵי קִרְוִין וְנִכְסֵי יָתְבֵי כְּרַכִּין תַּקִּיפִין<\/b>:", "onk_en": "He shall transport them over the summit of the earth where they will consume the produce of the fields; and He shall nurture them with honey of bedrock and oil of staunchest rock mass. [<b>He placed them in the strong places of the land, and He fed them the spoils of their enemies, He gave them the spoils of the lords of cities, and the wealth of dwellers of fortified cities.<\/b>]", "pj": "אַשְׁרִינוּן עַל כַּרְכֵי אַרְעָא דְיִשְרָאֵל וְאַיְיכוֹל יַתְהוֹן תַּפְנוּקֵי עַלְלַת חַקְלָאָה וְאוֹנִיק יַתְהוֹן דוּבְשָׁא מִפֵּירָהָא דְמִתְרַבְיָין עַל כֵּיפִין וּמִשְׁחָא מִזֵיתָהָא וּמְלַבְלְבִין מִטִנְרִין תַּקִיפִין", "pj_en": "He made them to dwell in the strong places of the land of Israel, and gave them to eat of the goodly produce of His field, and nourished them with the honey of its fruits which grow even upon the rocks with the oil of its olive trees, and from branches (growing) out of the rocks.", "tj": "אַרְכְּבִינוּן עַל בָּמָתָא דְאַרְעָא וְאַיְיכַל יַתְהוֹן עֲלָלַת תַּפְנוּקֵי מַלְכִין וְאַיְינִיק יַתְהוֹן דְבַשׁ מִן כֵּיפָא וּמְשַׁח יַתְהוֹן מִן כּוֹף שָׁמִיר טִינְרָא:", "tj_en": "He made them ride upon the high places of the earth, and gave them to eat of royal delicacies, and nourished them with honey out of the rock, and with oil from their olives (growing) out of the flinty stone of the rock.", "rashi": "<b>ירכבהו על במתי ארץ.<\/b> כָּל הַמִּקְרָא כְּתַרְגּוּמוֹ:<br><br><b>ירכבהו וגו'.<\/b> עַל שֵׁם שֶׁאֶרֶץ יִשְׂרָאֵל גָּבוֹהַּ מִכָּל הָאֲרָצוֹת:<br><br><b>ויאכל תנובת שדי.<\/b> אֵלּוּ פֵרוֹת אֶרֶץ יִשְׂרָאֵל שֶׁקַּלִּים לָנוּב וּלְהִתְבַּשֵּׁל מִכָּל פֵּרוֹת הָאֲרָצוֹת:<br><br><b>וינקהו דבש מסלע.<\/b> מַעֲשֶׂה בְּאֶחָד שֶׁאָמַר לִבְנוֹ בְּסִיכְנִי הָבֵא לִי קְצִיעוֹת מִן הֶחָבִית, הָלַךְ וּמָצָא הַדְּבַשׁ צָף עַל פִּיהָ, אָמַר לוֹ זוֹ שֶׁל דְּבַשׁ הִיא אָמַר לוֹ הַשְׁקַע יָדְךָ לְתוֹכָהּ וְאַתָּה מַעֲלֶה קְצִיעוֹת מִתּוֹכָהּ (ספרי):<br><br><b>במתי ארץ.<\/b> לְשׁוֹן גֹּבַהּ:<br><br><b>שדי.<\/b> לְשׁוֹן שָׂדֶה:<br><br><b>מחלמיש צור.<\/b> תָּקְפּוֹ וְחָזְקוֹ שֶׁל סֶלַע, כְּשֶׁאֵינוֹ דָּבוּק לַתֵּיבָה שֶׁלְּאַחֲרָיו נָקוּד חַלָּמִישׁ וּכְשֶׁהוּא דָבוּק נָקוּד חַלְמִישׁ:<br><br><b>ושמן מחלמיש צור.<\/b> אֵלּוּ זֵיתִים שֶׁל גּוּשׁ חָלָב (ספרי):", "rashi_en": "ירכבהו על במתי ארץ HE MADE HIM RIDE ON THE HIGH PLACES OF THE EARTH — The entire text (vv. 13 and 14) is to be understood metaphorically as the Targum has it (i.e., as referring to Eretz Israel).<br><br>ירכבהו וגו׳ HE MADE HIM RIDE [UPON THE HIGH PLACES] — This expression is used because the land of Israel is higher than all other countries (Sifrei Devarim 316:1).<br><br>ויאכל תנובת שדי THAT HE MIGHT EAT THE PRODUCE OF THE FIELDS — This refers to the fruits of the land of Israel which are quicker to shoot (נוב) and to ripen than all the fruits of other countries (Sifrei Devarim 316:2).<br><br>וינקהו דבש מסלע AND HE MADE HIM SUCK HONEY OUT OF THE ROCK — Indeed it once happened that a man said to his son In Sichnin (a town in Galilee): “Bring me dried figs from the cask”. He went and found the honey flowing over its brim. He said to him, “But this is a vat of honey (not of figs)”. Thereupon he said to him: “Put your hands deep into it and you will bring up figs from it” (Sifrei Devarim 316:3).<br><br>במתי ארץ is an expression denoting height.<br><br>שדי has the same meaning as שדה, field.<br><br>מחלמיש צור (lit., out of the flint of the rock) — The meaning is: the strength and the hardness of the rock. — When it is not connected with the following word (that is, when it is used in the absolute state) it is vowelled חַלָּמִישׁ (as in Deuteronomy 8:15). whilst when it is connected (is in the construct state) it is punctuated חַלְמִישׁ as here. <br><br>ושמן מחלמיש צור AND OIL OUT OF THE FLINTY ROCK — this refers to the olives of Giscala (a place in Galilee) (Sifrei Devarim 316:4)."}, {"ch": 32, "v": 14, "aliyah": 3, "heb": "חֶמְאַ֨ת בָּקָ֜ר וַחֲלֵ֣ב צֹ֗אן&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;עִם־חֵ֨לֶב כָּרִ֜ים וְאֵילִ֤ים בְּנֵֽי־בָשָׁן֙ וְעַתּוּדִ֔ים&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;עִם־חֵ֖לֶב כִּלְי֣וֹת חִטָּ֑ה וְדַם־עֵנָ֖ב תִּשְׁתֶּה־חָֽמֶר׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>יְהַב לְהוֹן בִּזַּת מַלְכֵיהוֹן וְשַׁלִּיטֵיהוֹן עִם עתַר רַבְרְבֵיהוֹן וְתַקִּיפֵיהוֹן עַמָא דְאַרְעֲהוֹן וְאַחֲסַנְתְּהוֹן עִם בִּזַּת חֵילֵיהוֹן וּמַשִּׁרְיָתְהוֹן<\/b> וְדַם <b>גִבָּרֵיהוֹן יִתָּשַׁד כְּמַיָּא<\/b>:", "onk_en": "Butter-fat of cattle and milk of sheep with the fat of lambs, and rams native to Bashan and goats, with the fat of wheat kidneys, and the wine-flavored blood of the grapes will you drink. [<b>He gave them the spoils of their kings and rulers with the wealth of their great and powerful, the people of their lands and their estates with the spoils of their armies and camps. The blood of their heroes was spilled like water.<\/b>]", "pj": "יְהַב לְהוֹן לְוָואִי שְׁמֵינֵי תוֹרִין מִן בִּיזַת מַלְכֵיהוֹן וְחֶלְבָּא מִבַּכִּירֵי עַנִין מִן עָדֵי שִׁלְטוֹנֵיהוֹן עִם טוּב פְּטִימִין וְדִכְרִין בְּנֵי דְעָנִין שְׁמֵנִין מִמַתְנָן וְגַדָאִין אָמַר משֶׁה נְבִיָא אִין נַטְרִין הִינוּן עַמָא בֵּית יִשְרָאֵל מִצְוָותָא דְאוֹרַיְיתָא אִתְאַמַר עָלַי בִּנְבוּאָה דִיְהֶוְיָן גַרְגִרֵי חִיטֵיהוֹן הֵיךְ כּוּלְיַין דְתוֹרֵי וַחֲמַר סוּמַק מִן עִנְבָא חָד מַפְקִין כּוֹר חָד", "pj_en": "He gave them rich butter of kine from the spoil of their kings, and the fat of the firstlings of the sheep from the prey of their sultans, with the choice rams and goats of the flocks of Mathnan. Mosheh the prophet said: If the people of Israel will observe the precepts of the law, it is foretold that their wheat granary shall be like the kidneys of oxen, and that from one bunch of grapes shall come forth a kor of red wine.", "tj": "רַכִּיכֵי תוֹרִין וּשְׁמֵינֵי עָאן עִם טוּב דְפַטִימֵי וְדִכְרִין בְּנֵי בָתְנַיָיא וְגַדְיָין עִם שְׁמֵנֵיהוֹן דְחִיטַיָא אָמַר משֶׁה נְבִיָא אִין נָטְרִין הִינוּן בְּנֵי יִשְרָאֵל מִצְוָותָא וְאוֹרַיְיתָא מִן עִנְבָא חָדָא יֶהֱוְיַין שַׁתְיָין כּוֹס דַחֲמַר:", "tj_en": "Tender oxen and choice flocks, goodly fatlings, rams bred in Batenaia, and goats, with the richest of the wheat. Mosheh the prophet said: If the children of Israel will observe the precepts of the law; from one bunch they shall drink a cup of wine.", "rashi": "<b>חמאת בקר וחלב צאן.<\/b> זֶה הָיָה בִּימֵי שְׁלֹמֹה, שֶׁנֶּאֱמַר (מלכים א ד') \"עֲשָׂרָה בָקָר בְּרִאִים וְעֶשְׂרִים בָּקָר רְעִי וּמֵאָה צֹאן\":<br><br><b>עם חלב כרים.<\/b> זֶה הָיָה בִּימֵי עֲשֶׂרֶת הַשְּׁבָטִים, שֶׁנֶּאֱמַר (עמוס ו') \"וְאֹכְלִים כָּרִים מִצֹּאן\":<br><br><b>חלב כליות חטה.<\/b> זֶה הָיָה בִּימֵי שְׁלֹמֹה, שֶׁנֶּאֱמַר (מלכים א ה') \"וַיְהִי לֶחֶם שְׁלֹמֹה וְגוֹ'\":<br><br><b>ודם ענב תשתה חמר.<\/b> בִּימֵי עֲשֶׂרֶת הַשְּׁבָטִים \"הַשֹּׁתִים בְּמִזְרְקֵי יַיִן\" (עמוס ו'):<br><br><b>חמאת בקר.<\/b> הוּא שֻׁמָּן הַנִּקְלָט מֵעַל גַּבֵּי הֶחָלָב:<br><br><b>וחלב צאן.<\/b> חָלָב שֶׁל צֹאן, וּכְשֶׁהוּא דָבוּק נָקוּד חֲלֵב, כְּמוֹ \"בַּחֲלֵב אִמּוֹ\" (שמות כ\"ג):<br><br><b>כרים.<\/b> כְּבָשִׂים:<br><br><b>ואילים.<\/b> כְּמַשְׁמָעוֹ:<br><br><b>בני בשן.<\/b> שְׁמֵנִים הָיוּ:<br><br><b>כליות חטה.<\/b> חִטִּים שְׁמֵנִים כְּחֵלֶב כְּלָיוֹת וְגַסִּין כְּכוּלְיָא:<br><br><b>ודם ענב.<\/b> תִּהְיֶה שׁוֹתֶה יַיִן טוֹב וְטוֹעֵם יַיִן חָשׁוּב:<br><br><b>חמר.<\/b> יַיִן בִּלְשׁוֹן אֲרַמִּי \"חֲמַר\", אֵין זֶה שֵׁם דָּבָר אֶלָּא לְשׁוֹן מְשֻׁבָּח בְּטַעַם, ווי\"נוש בְּלַעַז. וְעוֹד יֵשׁ לְפָרֵשׁ שְׁנֵי מִקְרָאוֹת הַלָּלוּ אַחַר תַּרְגּוּם שֶׁל אֻנְקְלוֹס \"אַשְׁרִינוּן עַל תָּקְפֵּי אַרְעָא וְגוֹ'\":", "rashi_en": "חמאת בקר וחלב צאן [AND HE GAVE THEM TO EAT] CLOTTED CREAM OF THE HERD AND MILK OF THE FLOCK — This was in the days of Solomon, as it states (1 Kings 5:2—3): “[And Solomon’s provision for one day was …] ten fat oxen, and twenty oxen (בקר) out of the pasture, and an hundred sheep (צאן)(Sifrei Devarim 317:1). <br><br>עם חלב כרים WITH FAT OF FATTENED LAMBS — This was in the days of the “Ten Tribes” (the period of the Northern Kingdom). as it is said, (Amos. 6:4) “Who eat lambs (כרים) of the flock” (Sifrei Devarim 317:1).<br><br>חלב כליות חטה [WITH] THE FAT OF KIDNEYS OF WHEAT — This again was in the days of Solomon, as it is said, (1 Kings 5:2) “And Solomon's provision for one day was [thirty measures of fine flour etc.]” (Sifrei Devarim 317:1).<br><br>ודם ענב תשתה חמר AND THOU SHALT DRINK THE FOAMING BLOOD OF THE GRAPE — this again was in the days of the “Ten Tribes” as it is said, (Amos 6:6) “That drink wine in bowls” (Sifrei Devarim 317:1).<br><br>חמאת בקר is the cream that is gathered from the surface of the milk.<br><br>וחלב צאן means, and milk of sheep (i.e. the first word is in the construct state); whenever it is connected with the following word it is vowelled חֲלַב, as in (Deuteronomy 14:21) “in the milk of (בַּחֲלֵב) its mother”.<br><br>כרים are SHEEP.<br><br>ואילים has its ordinary meaning: RAMS.<br><br>בני בשן RAMS OF THE BREED OF BASHAN — These were very fat.<br><br>כליות חטה KIDNEYS OF WHEAT — wheat that is fat as is the fat of kidneys and the kernels of which are as large as kidneys.<br><br>ודם ענב AND THE BLOOD OF THE GRAPE [THOU SHALT DRINK חמר] — This means: Thou shalt drink good wine, and taste wine of a fine and good quality.<br><br>חמר — This word means wine in general in the Aramaic language, but this (the word חמר in our verse) is not a noun but it means excellent in taste, vinos in old French, (English = vinous). — One may also expound these two verses according to the Targum of Onkelos which has: אשרינון על תקפי ארעא וגו׳, He made them dwell upon the strong places of the earth etc."}, {"ch": 32, "v": 15, "aliyah": 3, "heb": "וַיִּשְׁמַ֤ן יְשֻׁרוּן֙ וַיִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וַיִּטֹּשׁ֙ אֱל֣וֹהַּ עָשָׂ֔הוּ וַיְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽוֹ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעַתַּר <b>יִשְׂרָאֵל<\/b> וּבְעַט <b>אַצְלַח תְּקוֹף קְנָא נִכְסִין וּשְׁבַק פָּלְחַן<\/b> אֱלָהָא דְעָבְדֵיהּ <b>וְאַרְגֵּז קֳדָם תַּקִּיפָא דְפָרְקֵיהּ<\/b>:", "onk_en": "Yeshurun grew fat and rebelled, you grew fat, you have become thick, and are covered with fat; he forsook the God who made him, he insulted the Rock of his salvation. [<b>Yisroel grew fat and rebelled. He was very successful and wealthy and forsook the service of the God Who made him, and provoked the Almighty Who redeemed him.<\/b>]", "pj": "וְעַתָּרוּ בֵּית יִשְרָאֵל וּפָחֲזוּ אַצְלָחוּ תְּקוֹף קָנִין נִכְסִין וּשְׁבָקוּ פּוּלְחַן אֱלָהָא דִבְרָא יַתְהוֹן וְאַרְגִיזוּ קֳדָם תַּקִיפָא דְפַרְקִינוּן", "pj_en": "But the house of Israel grew rich and wicked; they prospered much and possessed wealth, and forsook the worship of Eloah who created them, and provoked Him to anger who redeemed them.", "tj": "וַאֲכָלוּ דְבֵית יְשׁוּרוּן וּבְעָטוּ וְעַתְרוּ וּמְרָדוּ וְאַצְלִיחוּ וּקְנוֹ נִכְסִין וּשְׁבָקוּ מֵימַר אֱלָהָא דִבְרָא יַתְהוֹן וּכְפָרוּ בְּדַחֲלָא תַקִיפָא דִפְרַק יַתְהוֹן:", "tj_en": "But the house of Jeshuron ate and kicked; they became rich, and rebelled; they prospered, got wealth, and forsook the Word of God who had created them, and refused to worship the Almighty who had redeemed them.", "rashi": "<b>עבית.<\/b> לְשׁוֹן עֹבִי:<br><br><b>כשית.<\/b> כְּמוֹ כָּסִיתָ, לְשׁוֹן \"כִּי כִסָּה פָנָיו בְּחֶלְבּוֹ\" (איוב ט\"ו), כְּאָדָם שֶׁשָּׁמֵן מִבִּפְנִים וּכְסָלָיו נִכְפָּלִים מִבַּחוּץ, וְכֵן הוּא אוֹמֵר (שם) \"וַיַּעַשׂ פִּימָה עֲלֵי כָסֶל\":<br><br><b>כשית.<\/b> יֵשׁ לָשׁוֹן קַל בִּלְשׁוֹן כִּסּוּי, כְּמוֹ \"וְכֹסֶה קָלוֹן עָרוּם\" (משלי י\"ב), וְאִם כָּתַב כִּשִּׂיתָ, דָּגוּשׁ, הָיָה נִשְׁמָע כִּסִּיתָ אֶת אֲחֵרִים, כְּמוֹ \"כִּי כִסָּה פָנָיו\" (איוב ט\"ו):<br><br><b>וינבל צור ישעתו.<\/b> גִּנָּהוּ וּבִזָּהוּ, כְּמוֹ שֶׁנֶּאֱמַר (יחזקאל ח') \"אֲחוֹרֵיהֶם אֶל הֵיכַל ה' וְגוֹ'\", אֵין לְךָ נִבּוּל גָּדוֹל מִזֶּה (ספרי):", "rashi_en": "עבית has the meaning of “thickness” (stoutness), it therefore means: “ Thou hast waxed fat”.<br><br>כשית is the same as כסית (‎ס and ש interchanging). It has the same meaning as in Job 15:27  “Because he hath covered (כסה) his face with his fatness”— like a person who is full of fat inside and whose flanks therefore lie in folds outside, as it goes on to state, (Job 15:27) “and be made folds of fat on his flanks” (Sifrei Devarim 318:6).<br><br>כשית — There exists a Kal form (as is this word) in the sense of covering, as (Proverbs 12:16) “And a prudent man is covered with (וְכֹסָה) shame”. If it had written כִּשִּׂיתָ with a dagesh in the ש. it would imply, “Thou hast covered others (or other things)” (i.e., it would be transitive), as in the text already quoted, “For he hath covered (כִסָּה) his face”.<br><br>וינבל צור ישעתו AND HE LIGHTLY ESTEEMED THE ROCK OF HIS SALVATION — This means, He showed contempt for Him and scorned Him, as it is said, (Ezekiel 8:16) “[and, behold, … there were … men] with their buttocks towards the Temple of the Lord” — surely, there can be no greater contempt than this (see Rashi on this verse) (Sifrei Devarim 318:9)."}, {"ch": 32, "v": 16, "aliyah": 3, "heb": "יַקְנִאֻ֖הוּ בְּזָרִ֑ים בְּתוֹעֵבֹ֖ת יַכְעִיסֻֽהוּ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אַקְנִיאוּ <b>קֳדָמוֹהִי בְּפָלְחַן טַעֲוָן<\/b> בְּתוֹעֶבְתָּא אַרְגִּיזוּ <b>קֳדָמוֹהִי<\/b>:", "onk_en": "They incited His [<b>before Him<\/b>] vengeance with strangers [<b>with idol worship<\/b>], with loathsomeness did they spite Him [<b>before Him<\/b>].", "pj": "קָנוֹן יָתֵיהּ בְּפוּלְחָנָא נוּכְרַיָא בְּמַרְחַקַתְהוֹן אַרְגִיזוּ קֳדָמוֹי", "pj_en": "They moved Him to jealousy with strange worship, by their abominations they made Him angry.", "tj": "אַקְנוּן קֳדָמוֹי בְּטַעֲוַותְהוֹן בְּמֶרְחַקְהוֹן אַכְעִיסוּ יָתֵיהּ:", "tj_en": "They provoked Him to anger with their idols, by their abominations they made Him wroth", "rashi": "<b>יקנאהו.<\/b> הִבְעִירוּ חֲמָתוֹ וְקִנְאָתוֹ:<br><br><b>בתועבת.<\/b> בְּמַעֲשִׂים תְּעוּבִים, כְּגוֹן מִשְׁכַּב זְכוּר וּכְשָׁפִים שֶׁנֶאֱמַר בָּהֶם תּוֹעֵבָה:", "rashi_en": "יקנאהו means, they made His anger and His jealousy (קנאה) glow.<br><br>בתועבת WITH ABOMINATIONS — i.e. with abominable deeds such as pederasty and sorcery, of which the term תועבה is used (cf. Leviticus 18:23 and Deuteronomy 18:10—12)."}, {"ch": 32, "v": 17, "aliyah": 3, "heb": "יִזְבְּח֗וּ לַשֵּׁדִים֙ לֹ֣א אֱלֹ֔הַּ אֱלֹהִ֖ים לֹ֣א יְדָע֑וּם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;חֲדָשִׁים֙ מִקָּרֹ֣ב בָּ֔אוּ לֹ֥א שְׂעָר֖וּם אֲבֹתֵיכֶֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דַּבָּחוּ לְשֵׁדִין <b>דִּלֵית בְּהוֹן צְרוֹךְ דַּחֲלָן<\/b> דְּלָא יְדָעֻנּוּן חַדְתָּא דִּי מִקָּרִיב אִתְעֲבִידָא <b>לָא אִתְעַסָּקוּ בְהוֹן<\/b> אֲבָהָתְכוֹן:", "onk_en": "They slaughtered to ineffectual demons, gods [<b>that are worthless, fearful things that<\/b>] they did not know; novelties, lately arrived—your forefathers were not awed by them [<b>had no dealings with them<\/b>].", "pj": "יְדַבְּחוּן לְטַעֲווֹת דִמְתִילִין לְשֵׁידִין דְלֵית בְּהוֹן מִדַעַם דִצְרִיךְ טַעֲוָון דְלָא יַדְעוּנוּן דַחֲלָן חֲדַתַּן דִמִזְמַן קָרִיב אִתְעֲבִידוּ וְלָא אִתְעַסְקוּ בְּהוֹן אַבְהַתְכוֹן", "pj_en": "They sacrificed to idols, resembling devils, in whom there is no profit, to idols which they had not known, new gods lately made, with which your fathers had nothing to do;", "tj": "יְדַבְּחוּן לְשֵׁידַיָא דְלֵית בְּהוֹן מַמָשׁ טַעֲוָון דְלָא חַכִּימוּ יַתְהוֹן חַדְתָּנִין מִן כְּדוּן אִתְבְּרוּן וְלָא אִידְכְּרוּן בְּהוֹן אַבְהַתְכוֹן:", "tj_en": "They sacrificed to demons in whom is no stability, idols which they had not known, lately formed, which your fathers remembered not.", "rashi": "<b>לא אלה.<\/b> כְּתַרְגּוּמוֹ \"דְּלֵית בְּהוֹן צְרוֹךְ\", אִלּוּ הָיָה בָהֶם צְרוֹךְ לֹא הָיְתָה קִנְאָה כְפוּלָה כְּמוֹ עַכְשָׁו (ספרי):<br><br><b>חדשים מקרב באו.<\/b> אֲפִלּוּ הָאֻמּוֹת לֹא הָיוּ רְגִילִים בָּהֶם — גּוֹי שֶׁהָיָה רוֹאֶה אוֹתָם, הָיָה אוֹמֵר זֶה צֶלֶם יְהוּדִי:<br><br><b>לא שערום אבתיכם.<\/b> לֹא יָרְאוּ מֵהֶם — לֹא עָמְדָה שַׂעֲרָתָם מִפְּנֵיהֶם, דֶּרֶךְ שַׂעֲרוֹת הָאָדָם לַעֲמֹד מֵחֲמַת יִרְאָה, כָּךְ נִדְרַשׁ בְּסִפְרֵי. וְיֵשׁ לְפָרֵשׁ עוֹד <b>שערום<\/b> לְשׁוֹן (ישעיה יג, כא) \"וּשְׂעִירִים יְרַקְּדוּ שָׁם\", שְׂעִירִים הֵם שֵׁדִים, לֹא עָשׂוּ אֲבוֹתֵיכֶם שְׂעִירִים הַלָּלוּ:", "rashi_en": "לא אלה — Understand this as the Targum does: They sacrifice unto devils in which is no utility, for if there were at least any utility in them to the world (as e.g:, the sun, moon and stars) God’s jealousy would not have been so intense (lit. — doubled) as it is now. (Sifrei Devarim 318:13).<br><br>חדשים מקרב באו [THEY SACRIFICED … TO GODS] THAT CAME UP RECENTLY — i.e. with which even the heathen nations were not familiar. Indeed, if a heathen saw them he would say, “This is a Jewish idol” (Sifrei Devarim 318:14).<br><br>לא שערום אבתיכם — This means, which your fathers feared not; more literally it means: Their hair (שער) did not stand up on end because of them — for it is the nature of a person’s hair to stand up out of fear. Thus is it (the word שערום) explained in Sifrei Devarim 318:15. But it is also possible to explain it as being connected with the noun in (Isaiah 13:21) “And שעירים shall dance there”; שעירים are demons (satyrs), and the meaning of our verse would then be: your fathers never made these satyrs."}, {"ch": 32, "v": 18, "aliyah": 3, "heb": "צ֥וּר יְלָדְךָ֖ תֶּ֑שִׁ<small>י<\/small> וַתִּשְׁכַּ֖ח אֵ֥ל מְחֹלְלֶֽךָ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>דַּחֲלָא תַקִּיפָא<\/b> דִּבְרָאָךְ אִתְנְשֵׁיתָא <b>שְׁבַקְתָּא פָּלְחַן<\/b> אֱלָהָא <b>דְעָבְדָךְ<\/b>:", "onk_en": "[<b>The fear of<\/b>] the Rock Who bore you, you disregarded; you forsook [<b>the service of<\/b>] the Almighty Who delivered [<b>made<\/b>] you.", "pj": "דַחֲלַת תַּקִיפָא דִבְרָא יַתְכוֹן אִתְנַשְׁתּוּן וְאַנְשֵׁיתוּן מֵימַר אֱלָהָא דְעָבַד יַתְכוֹן מְחִילִין מְחִילִין", "pj_en": "But the adorable Strong One who created you have you forgotten; of the word of Eloha who strengthened you so often have you been forgetful.", "tj": "תַּקִיף דִבְרָא יַתְכוֹן אַנְשֵׁיתוּן וּשְׁבַקְתּוּן מֵימַר אֱלָהָא דִבְרָא יַתְכוֹן וְעָבַד יַתְכוֹן מַחֲלִין מַחֲלִין:", "tj_en": "The Almighty who created you ye have forgotten, and have forsaken the Word of God who gave you to be, and made you so many refuges.", "rashi": "<b>תשי.<\/b> תִּשְׁכַּח. וְרַבּוֹתֵינוּ דָרְשׁוּ כְּשֶׁבָּא לְהֵיטִיב לָכֶם אַתֶּם מַכְעִיסִין לְפָנָיו וּמַתִּישִׁים כֹּחוֹ מִלְּהֵיטִיב לָכֶם (ספרי):<br><br><b>אל מחללך.<\/b> מוֹצִיאֲךָ מֵרֶחֶם, לְשׁוֹן (תהלים כט) \"יְחוֹלֵל אַיָּלוֹת\", (תהלים מ\"ח) \"חִיל כַּיּוֹלֵדָה\":", "rashi_en": "תשי means THOU HAST FORGOTTEN. But our Rabbis explained it thus: whenever He was about to bestow good upon you, you provoked Him to anger and, as it were, weakened (תש) His power so that He could not do you good (Sifrei Devarim 319:3).<br><br>אל מחללך means, God Who has brought you forth out of the womb. It has the same meaning as in (Psalms 29:9) “[The voice of the Lord] makes hinds to bring forth (יחולל)”, and (Psalms 48:7) “travail (חיל) as that of a woman in childbirth”."}, {"ch": 32, "v": 19, "aliyah": 4, "heb": "וַיַּ֥רְא יְהֹוָ֖ה וַיִּנְאָ֑ץ מִכַּ֥עַס בָּנָ֖יו וּבְנֹתָֽיו׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וּגֱלִי קֳדָם יְיָ וּתְקֵף רָגְזֵיהּ מִדְאַרְגִּיזוּ קָדָמוֹהִי בְּנִין וּבְנָן<\/b>:", "onk_en": "Adonoy saw and was angered, by the spite of His sons and His daughters. [<b>It was apparent before Hashem, and His anger was kindled by the provocations of sons and daughters before Him.<\/b>]", "pj": "וּגְלֵי קֳדָם יְיָ וַהֲוָה רְגַז מִן קֳדָמוֹי מִן דְאַרְגִיזוּ קֳדָמוֹי בְּנַיָא חֲבִיבַיָא דְאִתְקְרוּן עַל שְׁמֵיהּ בְּנִין וּבְנָן", "pj_en": "And when it was manifest before the Lord, He was wroth, provoked thereto by His beloved children who were called upon His Name son and daughters.", "tj": "וּגְלֵי קֳדָם יְיָ וַהֲוָה רְגַז מִן כַּעֲסָא דְאַכְעִיסוּ יָתֵיהּ בְנַיָא חֲבִיבַיָא דַהֲווֹ חֲבִיבִין עֲלוֹי הֵיךְ בְּנִין וְהֵיךְ בְּנָן:", "tj_en": "And it was manifest before the Lord, and He was angry, because the beloved children had provoked Him, even they who were beloved by Him as sons and daughters.", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 20, "aliyah": 4, "heb": "וַיֹּ֗אמֶר אַסְתִּ֤ירָה פָנַי֙ מֵהֶ֔ם אֶרְאֶ֖ה מָ֣ה אַחֲרִיתָ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;כִּ֣י ד֤וֹר תַּהְפֻּכֹת֙ הֵ֔מָּה בָּנִ֖ים לֹא־אֵמֻ֥ן בָּֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמַר <b>אֱסַלֵק שְׁכִנְתִּי<\/b> מִנְּהוֹן <b>גֶּלִי קֳדָמַי<\/b> מָא יְהֵי בְסוֹפֵיהוֹן אֲרֵי דָרָא <b>דְאַשְׁנִיּוּ<\/b> אִנּוּן בְּנַיָּא <b>דִּלֵית בְּהוֹן הֵימָנוּ<\/b>:", "onk_en": "He said, ‘‘I will hide [<b>remove<\/b>] My face [<b>Shechinah<\/b>] from them, I will see [<b>it is revealed before Me<\/b>] what their end will be; for they are an upsetting [<b>deviated<\/b>] generation, sons who are devoid of breeding [<b>have no faith<\/b>].", "pj": "וַאֲמַר מְפַלְגָא אִיפְלִיג אַפֵּי רְעוּתִי מִנְהוֹן נֶחְמֵי מַה יֶהֱוַון בְּסוֹפֵיהוֹן אֲרוּם דַר דְהַפְכִינָן הִינוּן בְּנִין דְלֵית בְּהוֹן הֵימְנוּתָא", "pj_en": "And He said, I will take away from them the favour of My countenance; it will be seen what will be the end; for they are a perverse generation, children who have not faith.", "tj": "וַאֲמַר מֵיפַּךְ אַפֵּיךְ אַפִּי רַעֲוָתִי מִנְהוֹן אַחְמֵי מַה הֲווֹ בְּאַחֲרִיוּתְהוֹן אֲרוּם דַר תַּהֲפָּכִינוּן אִינוּן בְּנִין דְלֵית בְּהוֹן הֵימָנוּ:", "tj_en": "And He said, I will surely turn away the favor of My countenance from them; I will see what will be in their latter end; for they are a perverse generation, children in whom is no faith.", "rashi": "<b>מה אחריתם.<\/b> מַה תַּעֲלֶה בָהֶם בְּסוֹפָם:<br><br><b>כי דור תהפכת המה.<\/b> מְהַפְּכִין רְצוֹנִי לְכַעַס:<br><br><b>לא אמן בם.<\/b> אֵין גִדּוּלַי נִכָּרִים בָּהֶם, כִּי הוֹרֵיתִים דֶּרֶךְ טוֹבָה וְסָרוּ מִמֶּנָּה:<br><br><b>אמן.<\/b> לְשׁוֹן \"וַיְהִי אֹמֵן\" (אסתר ב'), נורריטור\"ה בְּלַעַז; דָּ\"אַ — <b>אמן<\/b> לְשׁוֹן אֱמוּנָה, כְּתַרְגּוּמוֹ, אָמְרוּ בְסִינַי נַעֲשֶׂה וְנִשְׁמָע וּלְשָׁעָה קַלָּה בִטְּלוּ הַבְטָחָתָם וְעָשׂוּ הָעֵגֶל (ספרי):", "rashi_en": "מה אחריתם [I WILL SEE] WHAT THEIR END SHALL BE — i.e. what will come upon them in the end.<br><br>כי דור תהפכת המה FOR THEY ARE A GENERATION OF PERVERSITY - i.e. they change (הפך) My goodwill into anger.<br><br>לא אמן בם means, My training is not evident in them, for I showed them the good way and they have deviated from it.<br><br>אמן is of the same meaning as in (Esther 2:7) “And he brought up (אמן) Hadassah”. Nouriture in old French  — Another explanation of אמן: it has the same meaning as אמונה, faithfulness, as the Targum takes it (“in whom there is no faithfulness”). At Sinai they said, “We will do and we will hearken” and after a very short time they broke their promise and made the golden calf (Sifrei Devarim 320:6)."}, {"ch": 32, "v": 21, "aliyah": 4, "heb": "הֵ֚ם קִנְא֣וּנִי בְלֹא־אֵ֔ל כִּעֲס֖וּנִי בְּהַבְלֵיהֶ֑ם&nbsp;&nbsp;
