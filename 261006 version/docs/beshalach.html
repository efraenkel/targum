הֲרן סַב צְלוּחִית דְּפָחַר חֲדָא וְהַב תַּמָּן מְלֵי עוּמְרָא מַנָא וְאַצְנַע יָתֵיהּ קֳדָם יְיָ לְמַטְרָא לְדָרֵיכוֹן", "pj_en": "And Mosheh said to Aharon, Take one earthen vase, and put therein a full homera of manna, and lay it up before the Lord to be kept unto your generations.", "tj": "", "tj_en": "", "rashi": "<b>צנצנת.<\/b> צְלוֹחִית שֶׁל חֶרֶס, כְּתַרְגּוּמוֹ:<br><br><b>והנח אותו לפני ה'.<\/b> לִפְנֵי הָאָרוֹן; וְלֹא נֶאֱמַר מִקְרָא זֶה עַד שֶׁנִּבְנָה אֹהֶל מוֹעֵד, אֶלָּא שֶׁנִּכְתַּב כָּאן בְּפָרָשַׁת הַמָּן:", "rashi_en": "צנצנת is an earthern flask, as it is translated in the Targum (cf. Mekhilta).<br><br>‘והנח אתו לפני ה AND LAY IT UP BEFORE THE LORD — before the Ark; this verse, of course, was not spoken until the tent of meeting had been built and the Ark was placed therein, but it is written here in the chapter about the Manna, as being its appropriate place."}, {"ch": 16, "v": 34, "aliyah": 6, "heb": "כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶל־מֹשֶׁ֑ה וַיַּנִּיחֵ֧הוּ אַהֲרֹ֛ן לִפְנֵ֥י הָעֵדֻ֖ת לְמִשְׁמָֽרֶת׃", "onk": "כְּמָא דִי פַקִיד יְיָ לְמשֶׁה וְאַצְנְעֵהּ אַהֲרֹן קֳדָם סָהֲדוּתָא לְמַטְרָא:", "onk_en": "As Adonoy commanded Moshe, Aharon placed it before the Testimony for preservation.", "pj": "הֵיכְמָא דְּפַקֵּיד יְיָ יַת משֶׁה וְאַצְנְעֵיהּ אַהֲרן קֳדָם סַהֲדוּתָא לְמַטְרָא", "pj_en": "As the Lord commanded Mosheh, so did Aharon, lay it up before the testimony to be kept.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 35, "aliyah": 6, "heb": "וּבְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת־הַמָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד־בֹּאָ֖ם אֶל־אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת־הַמָּן֙ אָֽכְל֔וּ עַד־בֹּאָ֕ם אֶל־קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן׃", "onk": "וּבְנֵי יִשְׂרָאֵל אֲכָלוּ יָת מַנָא אַרְבְּעִין שְׁנִין עַד דְמֵיתֵיהוֹן לְאַרְעָא יָתְבָתָא יָת מַנָא אֲכָלוּ עַד דְאָתוֹ לִסְיָפֵי אַרְעָא דִכְנָעַן:", "onk_en": "The B’nei Yisrael ate the manna for forty years, until they came to an inhabited land. They ate the manna until they came to the edge of the land of Canaan.", "pj": "וּבְנֵי יִשְרָאֵל אָכְלוּ יַת מַנָּא אַרְבְּעִין שְׁנִין בְּחַיּוֹהִי דְמשֶׁה עַד מֵיתֵיהוֹן לְאַרְעָא מֵיתִיבָא יַת מַנָּא אָכְלוּ אַרְבְּעִין יוֹמִין בָּתַר מוֹתֵיהּ עַד דְּעָבְרוּ יוּרְדְּנָא וְעָלוּ לִסְיָיפֵי אַרְעָא דִכְנָעַן", "pj_en": "And the children of Israel ate the manna forty years, until they came to an inhabited land: manna did they eat forty days after his death, until they had passed the Jordena, and entered upon the borders of the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "<b>ארבעים שנה.<\/b> וַהֲלֹא חָסֵר שְׁלֹשִׁים יוֹם הֵם? שֶׁהֲרֵי בְּט\"ו בְּאִיָּר יָרַד לָהֶם הַמָּן תְּחִלָּה וּבְט\"ו בְּנִיסָן פָּסַק, שֶׁנֶּאֱמַר \"וַיִּשְׁבֹּת הַמָּן מִמָּחֳרָת\" (יהושע ה')? אֶלָּא מַגִּיד, שֶׁהָעֻגּוֹת שֶׁהוֹצִיאוּ יִשְׂרָאֵל מִמִּצְרַיִם טָעֲמוּ בָהֶם טַעַם מָן (קידושין ל\"ח):<br><br><b>אל ארץ נושבת.<\/b> לְאַחַר שֶׁעָבְרוּ אֶת הַיַּרְדֵּן (שֶׁאוֹתָהּ שֶׁבְּעֵבֶר הַיַּרְדֵּן מְיֻשֶּׁבֶת וְטוֹבָה שֶׁנֶּאֱמַר \"אֶעְבְּרָה נָּא וְאֶרְאֶה אֶת הָאָרֶץ הַטּוֹבָה אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן\", וְתַרְגּוּם שֶׁל נוֹשָׁבֶת \"יָתְבָתָא\", רָצָה לוֹמַר — מְיֻשֶּׁבֶת):<br><br><b>אל קצה ארץ כנען.<\/b> בִּתְחִלַּת הַגְּבוּל קֹדֶם שֶׁעָבְרוּ אֶת הַיַּרְדֵּן, וְהוּא עַרְבוֹת מוֹאָב. נִמְצְאוּ מַכְחִישִׁין זֶה אֶת זֶה? אֶלָּא בְּעַרְבוֹת מוֹאָב כְּשֶׁמֵּת מֹשֶׁה בְּז' בַּאֲדָר פָּסַק הַמָּן מִלֵּירֵד, וְנִסְתַּפְּקוּ מִמָּן שֶׁלָּקְטוּ בוֹ בַיּוֹם עַד שֶׁהִקְרִיבוּ הָעֹמֶר בְּשִׁשָּׁה עָשָׂר בְּנִיסָן, שֶׁנֶּאֱמַר \"וַיֹּאכְלוּ מֵעֲבוּר הָאָרֶץ מִמָּחֳרַת הַפֶּסַח\" (יהושע ה'):", "rashi_en": "ארבעים שנה FORTY YEARS — But was not this period short of thirty days, since it was on the sixteenth of Iyar that the Manna fell for them for the first time and on the fifteenth of Nisan that it ceased, as it is said, (Joshua 5:12) “And the Manna ceased on the morrow”? (cf. the preceding verse which speaks of the day when they ate unleavened bread). But this tells us that in the cakes that Israel had brought out of Egypt and which they ate from the 15th of Nisan to the 16th of Iyar after they left Egypt they experienced the taste of Manna (so that the 40 years mentioned here as those during which they ate Manna may be regarded as complete) (Kiddushin 38a).<br><br>אל ארץ נושבת TO A LAND INHABITED — after they had crossed the Jordan, [for that territory on the other side of the Jordan was cultivated (מְיֻשֶׁבֶת, which is regarded as the equivalent of נושבת; cf. Rashi on Genesis 36:20) and good, as it is said, (Deuteronomy 3:25) “Let me pass over, I pray thee, and see the good land that is on the other side of the Jordan”. And the translation of נושבת by Onkelos is יתבתא which means to say מיושבת, “settled”].<br><br>אל קצה ארץ כנען UNTO THE EXTREMITY OF THE LAND OF CANAAN — at the beginning of the border before they passed over the Jordan, that is, in the plains of Moab — consequently they (these two descriptions of the locality) contradict each other! But the explanation is that in the plains of Moab, when Moses died (cf. Deuteronomy 34:1) on the seventh of Adar, the Manna really ceased to fall but they had a sufficient supply from the Manna which they had gathered on that day to last until they had brought the Omer on the sixteenth of Nisan in Canaan itself, the cultivated land, as it is said, (Joshua 5:11) “And they did eat of the produce of the land on the morrow after the Passover” (Kiddushin 38a)."}, {"ch": 16, "v": 36, "aliyah": 6, "heb": "וְהָעֹ֕מֶר עֲשִׂרִ֥ית הָאֵיפָ֖ה הֽוּא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְעֻמְרָא חַד מִן עַסְרָא <b>בִּתְלָת סְאִין<\/b> הוּא:", "onk_en": "The omer is a tenth of an eiphoh [<b>which is three se’in<\/b>].", "pj": "וְעִמְרָא חָד מִן עַשְרָא לִתְלַת סְאִין הוּא", "pj_en": "And a homera is one tenth of three seahs.", "tj": "", "tj_en": "", "rashi": "<b>עשרית האיפה.<\/b> הָאֵיפָה שָׁלֹשׁ סְאִין וְהַסְּאָה ו' קַבִּין וְהַקַּב ד' לֻגִּין וְהַלֹּג ו' בֵּיצִים, נִמְצָא עֲשִׂירִית הָאֵיפָה מ\"ג בֵּיצִים וְחֹמֶשׁ בֵּיצָה, וְהוּא שִׁעוּר לַחַלָּה וְלַמְּנָחוֹת:", "rashi_en": "עשירית האפה [THE OMER] IS THE TENTH PART OF AN EPHAH — The Ephah is three Seahs, and the Seah is six Kabs, and the Kab is four Logs and the Log has the capacity of six eggs: it follows, therefore, that the tenth of an Ephah has the capacity of forty-three and a fifth eggs — and this is the minimum quantity of dough for the Challa (the minimum quantity to which applies the injunction to separate a portion of the dough; cf. Numbers 15:20), and the measure for the meal offering (cf. Rashi on Eruvin 83b)."}, {"ch": 17, "v": 1, "aliyah": 7, "heb": "וַ֠יִּסְע֠וּ כׇּל־עֲדַ֨ת בְּנֵֽי־יִשְׂרָאֵ֧ל מִמִּדְבַּר־סִ֛ין לְמַסְעֵיהֶ֖ם עַל־פִּ֣י יְהֹוָ֑ה וַֽיַּחֲנוּ֙ בִּרְפִידִ֔ים וְאֵ֥ין מַ֖יִם לִשְׁתֹּ֥ת הָעָֽם׃", "onk": "וּנְטָלוּ כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל מִמַדְבְּרָא דְסִין לְמַטְלָנֵיהוֹן עַל מֵימְרָא דַיְיָ וּשְׁרוֹ בִּרְפִידִים וְלֵית מַיָא לְמִשְׁתֵּי עַמָא:", "onk_en": "The entire community of B’nei Yisrael journeyed from the wilderness of Sin, traveling according to the word of Adonoy. They camped in Rephidim, and there was no water for the people to drink.", "pj": "וּנְטָלוּ כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל מִמַּדְבְּרָא דְסִין לְמִטְלָנֵיהוֹן עַל מֵימְרָא דַיְיָ וּשְׁרוֹ בִּרְפִידִים אַתְרָא דְבַטִּילוּ אִידֵיהוֹן מִמִצְוָותָא דְאוֹרַיְתָא וְאִתְיַיבְּשׁוּ מַבּוּעַיָא וְלָא הֲוָה מוֹי לְמִשְׁתֵּי לְעַמָּא", "pj_en": "And all the congregation of the sons of Israel journeyed from the desert of Sin by their journeyings according to the word of the Lord, and they encamped in Rephidim, a place where their hands were idle in the commandments of the law, and the fountains were dry, and there was no water for the people to drink.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 2, "aliyah": 7, "heb": "וַיָּ֤רֶב הָעָם֙ עִם־מֹשֶׁ֔ה וַיֹּ֣אמְר֔וּ תְּנוּ־לָ֥נוּ מַ֖יִם וְנִשְׁתֶּ֑ה וַיֹּ֤אמֶר לָהֶם֙ מֹשֶׁ֔ה מַה־תְּרִיבוּן֙ עִמָּדִ֔י מַה־תְּנַסּ֖וּן אֶת־יְהֹוָֽה׃", "onk": "וּנְצָא עַמָא עִם משֶׁה וַאֲמָרוּ הָבוּ לָנָא מַיָא וְנִשְׁתֵּי וַאֲמַר לְהוֹן משֶׁה מָה אַתּוּן נָצָן עִמִי מָה מְנַסוּן אַתּוּן <b>קֳדָם<\/b> יְיָ:", "onk_en": "The people quarreled with Moshe, and said, “Give us water to drink.” Moshe said to them, “Why are you quarreling with me? Why are you testing [<b>before<\/b>] Adonoy?”", "pj": "וְנָצוּ רַשִׁיעֵי עַמָא עִם משֶׁה וְאָמָרוּ הַב לָן מוֹי וְנִשְׁתֵּי וַאֲמַר לְהוֹן משֶׁה מַה נָּצַן אַתּוּן עִמִּי וּמַה מְנַסֵן אַתּוּן קֳדָם יְיָ", "pj_en": "And the wicked of the people contended with Mosheh, and said, Give us water, that we may drink. And Mosheh said to them, Why contend you with me? and why tempt you before the Lord?", "tj": "", "tj_en": "", "rashi": "<b>מה תנסון.<\/b> לוֹמַר הֲיוּכַל לָתֵת מַיִם בְּאֶרֶץ צִיָּה?:", "rashi_en": "מה תנסון TO WHY DO YE TRY [THE LORD] by saying, “Will He be able to give us water in an arid land?”"}, {"ch": 17, "v": 3, "aliyah": 7, "heb": "וַיִּצְמָ֨א שָׁ֤ם הָעָם֙ לַמַּ֔יִם וַיָּ֥לֶן הָעָ֖ם עַל־מֹשֶׁ֑ה וַיֹּ֗אמֶר לָ֤מָּה זֶּה֙ הֶעֱלִיתָ֣נוּ מִמִּצְרַ֔יִם לְהָמִ֥ית אֹתִ֛י וְאֶת־בָּנַ֥י וְאֶת־מִקְנַ֖י בַּצָּמָֽא׃", "onk": "וּצְחִי תַמָן עַמָא לְמַיָא וְאִתְרַעַם עַמָא עַל משֶׁה וַאֲמַר לְמָא דְנַן אַסֶקְתָּנָא מִמִצְרַיִם לְקַטָלָא יָתִי וְיָת בְּנַי וְיָת בְּעִירַי בְּצָחוּתָא:", "onk_en": "The people were suffering thirst for [the lack of] water, and the people complained against Moshe and said, “Why did you bring us up from Egypt—to kill me and my children, and my livestock with thirst?”", "pj": "וּצְחִי תַמָּן עַמָּא לְמוֹי וְאִתְרָעַם עַמָּא עַל משֶׁה וַאֲמַר לְמָא דְנַן אַסֵיקְתָּנָא מִמִּצְרַיִם לְקַטְלָא יָתָנָא וְיַת בְּנָנָא וְיַת גֵּיתָנָא בְּצָחוּתָא", "pj_en": "But the people were athirst for water, and the people murmured against Mosheh, and said, Why hast thou made us come up out of Mizraim, to kill us, and our children, and our cattle with thirst ?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 4, "aliyah": 7, "heb": "וַיִּצְעַ֤ק מֹשֶׁה֙ אֶל־יְהֹוָ֣ה לֵאמֹ֔ר מָ֥ה אֶעֱשֶׂ֖ה לָעָ֣ם הַזֶּ֑ה ע֥וֹד מְעַ֖ט וּסְקָלֻֽנִי׃", "onk": "<b>וְצַלִי<\/b> משֶׁה <b>קֳדָם<\/b> יְיָ לְמֵימַר מָא אֶעְבֵּד לְעַמָא הָדֵין עוֹד זְעֵיר פּוֹן וְיִרְגְמֻנָנִי:", "onk_en": "Moshe cried out to [<b>prayed before<\/b>] Adonoy saying, “What shall I do for this people? Before long they will stone me.”", "pj": "וְצַלִּי משֶׁה קֳדָם יְיָ לְמֵימַר מַה אַעֲבֵיד לְעַמָּא הָדֵין תּוּב קָלִיל זְעֵיר וְהִינוּן רַגְמִין יָתִי", "pj_en": "And Mosheh prayed before the Lord, saying What shall I do for this people? Yet a very little, and they will stone me.", "tj": "", "tj_en": "", "rashi": "<b>עוד מעט.<\/b> אִם אַמְתִּין עוֹד מְעַט <b>וסקלני<\/b>:", "rashi_en": "עוד מעט YET A LITTLE means, if I wait but a little more they will stone me."}, {"ch": 17, "v": 5, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה עֲבֹר֙ לִפְנֵ֣י הָעָ֔ם וְקַ֥ח אִתְּךָ֖ מִזִּקְנֵ֣י יִשְׂרָאֵ֑ל וּמַטְּךָ֗ אֲשֶׁ֨ר הִכִּ֤יתָ בּוֹ֙ אֶת־הַיְאֹ֔ר קַ֥ח בְּיָדְךָ֖ וְהָלָֽכְתָּ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עִבַּר קֳדָם עַמָא וּדְבַר עִמָךְ מִסָבֵי יִשְׂרָאֵל וְחֻטְרָךְ דִי מָחֵיתָא בֵהּ יָת נַהֲרָא סַב בִּידָךְ וְתֵיזִל:", "onk_en": "Adonoy said to Moshe, “Pass to the front of the people and take with you the elders of the [B’nei] Yisrael. The staff with which you struck the river; take in to your hand, and go.", "pj": "וַאֲמַר יְיָ לְמשֶׁה עִיבַּר קֳדָם עַמָּא וּדְבַר עִמָּךְ מִסָּבֵי יִשְרָאֵל וְחוּטְרָךְ דְּמָחִית בֵּיהּ יַת נַהֲרָא דְּבַר בִּידָךְ וְאִיזֵיל לָךְ מִן קֳדָם תּוּרְעֲמַתְהוֹן", "pj_en": "And the Lord said to Mosheh, Pass over before the people, and take with thee some of the elders of Israel, and the rod with which thou didst smite the river take in thy hand, and go from the face of their murmuring.", "tj": "", "tj_en": "", "rashi": "<b>עבור לפני העם.<\/b> וּרְאֵה אִם יִסְקְלוּךָ, לָמָּה הוֹצֵאתָ לַעַז עַל בָּנַי? (שמות רבה):<br><br><b>וקח אתך מזקני ישראל.<\/b> לְעֵדוּת, שֶׁיִּרְאוּ שֶׁעַל יָדְךָ מַיִם יוֹצְאִים מִן הַצּוּר, וְלֹא יֹאמְרוּ מַעְיָנוֹת הָיוּ שָׁם מִימֵי קֶדֶם:<br><br><b>ומטך אשר הכית בו את היאר.<\/b> מַה תַּ\"לֹ \"אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר\"? אֶלָּא שֶׁהָיוּ יִשְׂרָאֵל אוֹמְרִים עַל הַמַּטֶּה שֶׁאֵינוֹ מוּכָן אֶלָּא לְפֻרְעָנוּת – בּוֹ לָקָה פַרְעֹה וּמִצְרַיִם כַּמָּה מַכּוֹת בְּמִצְרַיִם וְעַל הַיָּם – לְכָךְ נֶאֱמַר אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר, יִרְאוּ עַתָּה שֶׁאַף לְטוֹבָה הוּא מוּכָן (מכילתא):", "rashi_en": "עבר לפני העם PASS BEFORE THE PEOPLE and see whether they will stone you! (Midrash Tanchuma, Beshalach 23) Why have you uttered a slander against My children?<br><br>וקח אתך מזקני ישראל AND TAKE WITH THEE OF THE ELDERS OF ISRAEL as witnesses — that they may see that it is by your agency that the water will come forth from the rock and that people may not say that there had been springs there from time immemorial (Mekhilta).<br><br>ומטך אשר הכית בו את היאר AND THY STAFF, WHEREWITH THOU SMOTEST THE RIVER — What is the force of the words “wherewith thou smotest the river” — they are apparently superfluous? But these are added because the Israelites had said of the staff that it was intended only for punishment: by it Pharaoh and the Egyptians had been stricken with many plagues in Egypt and at the Red Sea. On this account it is stated here: take the staff wherewith thou smotest the river — they shall see now that it is also intended for good (Mekhilta)."}, {"ch": 17, "v": 6, "aliyah": 7, "heb": "הִנְנִ֣י עֹמֵד֩ לְפָנֶ֨יךָ שָּׁ֥ם&thinsp;<small>׀<\/small>&thinsp;עַֽל־הַצּוּר֮ בְּחֹרֵב֒ וְהִכִּ֣יתָ בַצּ֗וּר וְיָצְא֥וּ מִמֶּ֛נּוּ מַ֖יִם וְשָׁתָ֣ה הָעָ֑ם וַיַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְעֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "הָא אֲנָא קָאֵם קֳדָמָךְ תַּמָן עַל טִנָרָא בְּחוֹרֵב וְתִמְחֵי בְטִנָרָא וְיִפְּקוּן מִנֵהּ מַיָא וְיִשְׁתֵּי עַמָא וַעֲבַד כֵּן משֶׁה לְעֵינֵי סָבֵי יִשְׂרָאֵל:", "onk_en": "Behold, I will stand before you there on the rock in Choreiv. You shall strike the rock and water will come out of it, and the people [will be able] to drink. Moshe did this in the sight [presence] of the elders of the [B’nei] Yisrael.", "pj": "הָאֲנָא קָאִים קֳדָמָךְ תַּמָּן בְּאַתְרָא דְתֶחֱמֵי רוֹשֶׁם רִיגְלָא בְּחוֹרֵב וְתִמְחֵי בֵיהּ בְּטִינָר בְּחוּטְרָךְ וְיִפְקוּן מִינֵהּ מוֹי לְמִשְׁתֵּי וְיִשְׁתּוּן עַמָּא וְעָבַד הֵיכְדֵין משֶׁה קֳדָם סָבֵי יִשְרָאֵל", "pj_en": "Behold, I will stand before thee there, on the spot where thou sawest the impress of the foot on Horeb; and thou shalt smite the rock with thy rod, and therefrom shall come forth waters for drinking, and the people shall drink. And Mosheh did so before the elders of Israel.", "tj": "", "tj_en": "", "rashi": "<b>והכית בצור.<\/b> עַל הַצּוּר לֹא נֶאֱמַר אֶלָּא בַצּוּר, מִכָּאן שֶׁהַמַּטֶּה הָיָה שֶׁל מִין דָּבָר חָזָק וּשְׁמוֹ סַנְפִּירִינוֹן, וְהַצּוּר נִבְקַע מִפָּנָיו (שם):", "rashi_en": "והכית בצור AND THOU SHALT SMITE THE ROCK — It does not say here “thou shalt smite על הצור”, upon the surface of the rock, but בצור, right into the rock — from this it follows that the rod must have been composed of a kind of hard material the name of which is sapphire, and the rock was split by it (Mekhilta)."}, {"ch": 17, "v": 7, "aliyah": 7, "heb": "וַיִּקְרָא֙ שֵׁ֣ם הַמָּק֔וֹם מַסָּ֖ה וּמְרִיבָ֑ה עַל־רִ֣יב&thinsp;<b>׀<\/b> בְּנֵ֣י יִשְׂרָאֵ֗ל וְעַ֨ל נַסֹּתָ֤ם אֶת־יְהֹוָה֙ לֵאמֹ֔ר הֲיֵ֧שׁ יְהֹוָ֛ה בְּקִרְבֵּ֖נוּ אִם־אָֽיִן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּקְרָא שְׁמָא דְאַתְרָא נִסֵיתָא וּמַצוּתָא עַל דִנְצוֹ בְּנֵי יִשְׂרָאֵל וְעַל דְנַסִיאוּ <b>קֳדָם<\/b> יְיָ לְמֵימַר הֲאִית <b>שְׁכִינְתָּא דַ<\/b>יְיָ בֵּינָנָא אִם לָא:", "onk_en": "He [Moshe] named the place Massah and Merivah because the B’nei Yisrael had quarreled [Merivah] and because they had tested [Massah] [<b>before<\/b>] Adonoy, saying, “Is [<b>the Shechina of<\/b>] Adonoy among us or not?”", "pj": "וּקְרָא שְׁמָא דְאַתְרָא הַהוּא נִסְיוֹנָא וּמַצּוּתָא בְּגִין דְּנָצוּ בְּנֵי יִשְרָאֵל עִם משֶׁה וּבְגִין דְּנַסְיַין קֳדָם יְיָ לְמֵימַר הַאִין קוּשְׁטָא אִיקַר שְׁכִינְתָּא דַיְיָ שַׁרְיָא בֵּינָנָא אִין לָא", "pj_en": "And he called the name of that place Temptation and Strife; because there the sons of Israel contended with Mosheh, and because they tempted the Lord, saying, Doth the glory of the majesty of the Lord truly dwell among us, or not?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 8, "aliyah": 7, "heb": "וַיָּבֹ֖א עֲמָלֵ֑ק וַיִּלָּ֥חֶם עִם־יִשְׂרָאֵ֖ל בִּרְפִידִֽם׃", "onk": "וַאֲתָא עֲמָלֵק וַאֲגַח קְרָבָא עִם יִשְׂרָאֵל בִּרְפִידִם:", "onk_en": "Amaleik came and fought [<b>a war<\/b>] with [B’nei] Yisrael in Rephidim.", "pj": "וְאָתָא עֲמָלֵק מֵאַרַע דְּרוֹמָא וְשַׁוֵור בְּלֵילְיָא הַהוּא אֶלֶף וְשִׁית מְאָה מִילִין וּמִן בִּגְלַל מַצּוּתָא דַּהֲוָה בֵינֵי עֵשָו וּבֵינֵי יַעֲקב אָתָא וְאַגַּח קְרָבָא עִם יִשְרָאֵל בִּרְפִידִים וַהֲוָה נְסִיב וְקָטִיל גּוּבְרִין מִדְּבֵית דָּן דְּלָא הֲוָה עֲנָנָא מְקַבִּיל יַתְהוֹן מִן בִּגְלַל פּוּלְחָנָא נוּכְרָאָה דִי בֵינֵיהוֹן", "pj_en": "And Amalek came from the land of the south and leaped on that night a thousand and six hundred miles; and on account of the disagreement which had been between Esau and Jakob, he came and waged war with Israel in Rephidim, and took and killed (some of the) men of the house of Dan; for the cloud did not embrace them, because of the strange worship that was among them.", "tj": "", "tj_en": "", "rashi": "<b>ויבא עמלק וגו'.<\/b> סָמַךְ פָּרָשָׁה זוֹ לְמִקְרָא זֶה, לוֹמַר, תָּמִיד אֲנִי בֵינֵיכֶם וּמְזֻמָּן לְכָל צָרְכֵּיכֶם וְאַתֶּם אוֹמְרִים הֲיֵשׁ ה' בְּקִרְבֵּנוּ אִם אָיִן, חַיֵּיכֶם שֶׁהַכֶּלֶב בָּא וְנוֹשֵׁךְ אֶתְכֶם וְאַתֶּם צוֹעֲקִים לִי וְתֵדְעוּ הֵיכָן אֲנִי? מָשָׁל לְאָדָם שֶׁהִרְכִּיב בְּנוֹ עַל כְּתֵפוֹ וְיָצָא לַדֶּרֶךְ, הָיָה אוֹתוֹ הַבֵּן רוֹאֶה חֵפֶץ וְאוֹמֵר, אַבָּא טֹל חֵפֶץ זֶה וְתֵן לִי וְהוּא נוֹתֵן לוֹ, וְכֵן שְׁנִיָּה, וְכֵן שְׁלִישִׁית, פָּגְעוּ בְאָדָם אֶחָד אָמַר לוֹ אוֹתוֹ הַבֵּן, רָאִיתָ אֶת אַבָּא? אָמַר לוֹ אָבִיו, אֵינְךָ יוֹדֵעַ הֵיכָן אֲנִי? הִשְׁלִיכוֹ מֵעָלָיו וּבָא הַכֶּלֶב וּנְשָׁכוֹ (תנחומא יתרו):", "rashi_en": "ויבא עמלק THEN CAME AMALEK — Scripture places this section immediately after this preceding verse (they said, “Is the Lord among us or not?”) to imply, “I am ever among you and ready at hand for every thing you may need, and yet you say, “Is the Lord among us or not?” By your lives, I swear that the hound (Amalek) shall come and bite you, and you will cry for Me and then you will know where I am!” A parable: it may be compared to a man who carried his son upon his shoulder, and went out on a journey. The son saw an article and said, “Father, pick up that thing and give it to me”. He gave it to him, and so a second time and so also a third time. They met a certain man to whom the son said, “Have you seen my father anywhere?” Whereupon his father said to him, “Don’t you know where I am?” — He, therefore, cast him off from himself and a hound came and bit him (Midrash Tanchuma, Yitro 3)."}, {"ch": 17, "v": 9, "aliyah": 7, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֤ה אֶל־יְהוֹשֻׁ֙עַ֙ בְּחַר־לָ֣נוּ אֲנָשִׁ֔ים וְצֵ֖א הִלָּחֵ֣ם בַּעֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל־רֹ֣אשׁ הַגִּבְעָ֔ה וּמַטֵּ֥ה הָאֱלֹהִ֖ים בְּיָדִֽי׃", "onk": "וַאֲמַר משֶׁה לִיהוֹשֻׁעַ בְּחַר לָנָא גֻבְרִין וּפוּק <b>אֲגַח קְרָבָא<\/b> בַּעֲמָלֵק מְחָר אֲנָא קָאֵם עַל רֵישׁ רָמָתָא וְחוּטְרָא דְ<b>אִתְעֲבִידוּ בֵהּ נִסִין מִן קֳדָם<\/b> יְיָ בִּידִי:", "onk_en": "Moshe said to Yehoshua, “Choose men for us and go out to battle [<b>fight a war with<\/b>] Amaleik. Tomorrow, I will stand on top of the hill with the staff [<b>with which miracles were performed from before<\/b>] of God in my hand.”", "pj": "וַאֲמַר משֶׁה לִיהוֹשֻׁעַ בְּחַר לָנָא גּוּבְרִין גִּבָּרִין וְתַקִּיפִין בְּפִקּוּדַיָא וְנִצְחָנֵי קְרָבָא וּפוּק מִתְּחוֹת עֲנָנֵי יְקָרָא וּסְדַר סִדְרֵי קְרָבָא לִקְבֵיל מַשִׁירְיַין עֲמָלֵק מְחַר אֲנָא קָאִים בְּצוֹמָא מֵעַתַּד בְּזַכְוָות אַבְהָתָא רֵישֵׁי עַמָּא וְזַכְוַות אִימְהָתָא דִמְתִילַן לִגְלִימָתָא וְחוּטְרָא דְאִתְעֲבִידוּ בֵיהּ נִיסִין מִן קֳדָם יְיָ בִּידִי", "pj_en": "And Mosheh said to Jehoshua, Choose such men as are strong in the precepts, and victorious in fight; and go, under the Cloud of glory, and set battle in array against the hosts of Amalek. Tomorrow I will stand, prepared with fasting, with the righteous fathers of the chiefs of the people, and the righteous mothers who are like the hills, with the rod with which the miracles have been wrought from before the Lord, in my hand.", "tj": "", "tj_en": "", "rashi": "<b>בחר לנו.<\/b> לִי וּלְךָ – הִשְׁוָהוּ לוֹ; מִכָּאן אָמְרוּ חֲכָמִים יְהִי כְבוֹד תַּלְמִידְךָ חָבִיב עָלֶיךָ כְּשֶׁלָּךְ; וּכְבוֹד חֲבֵרְךָ כְּמוֹרָא רַבָּךְ מִנַּיִן? שֶׁנֶּאֱמַר \"וַיֹּאמֶר אַהֲרֹן אֶל מֹשֶׁה בִּי אֲדֹנִי\", וַהֲלֹא אַהֲרֹן גָּדוֹל מֵאָחִיו הָיָה וְעוֹשֶׂה אֶת חֲבֵרוֹ כְּרַבּוֹ. וּמוֹרָא רַבָּךְ כְּמוֹרָא שָׁמַיִם מִנַּיִן? שֶׁנֶּאֱמַר \"אֲדֹנִי מֹשֶׁה כְּלָאֵם\" – כַּלֵּם מִן הָעוֹלָם, חַיָּבִין הֵם כְּלָיָה, הַמּוֹרְדִים בְּךָ כְּאִלּוּ מָרְדוּ בְּהַקָּבָּ\"ה:<br><br><b>וצא הלחם.<\/b> צֵא מִן הֶעָנָן וְהִלָּחֵם בּוֹ:<br><br><b>מחר.<\/b> בְּעֵת הַמִּלְחָמָה, אָנֹכִי נִצָּב:<br><br><b>בחר לנו אנשים.<\/b> גִּבּוֹרִים וְיִרְאֵי חֵטְא שֶׁתְּהֵא זְכוּתָן מְסַיַּעְתָּן. דָּבָר אַחֵר – בְּחַר לָנוּ אֲנָשִׁים שֶׁיּוֹדְעִין לְבַטֵּל כְּשָׁפִים, לְפִי שֶׁבְּנֵי עֲמָלֵק מְכַשְּׁפִין הָיוּ:", "rashi_en": "בחר לנו CHOOSE OUT MEN FOR US — for me and for you: he (Moses) placed him (Joshua) on the same level with himself. They (the Rabbis) derived from here the teaching: let thy disciple’s honour be as dear to thee as thy own. And whence may we derive the next statement in thee well-known passage: and thy colleague’s honour as dear to thee as the reverence due to thy teacher? Because it is said, (Numbers 12:11) “And Aaron spake to Moses, “I beseech thee, my lord” — but surely Aaron was older than his brother and yet by addressing him as “my lord” he treated his colleague (Moses) as his teacher! “And the reverence due to thy teacher as the reverence due to God” — whence may this be derived? Because it is said, (Numbers 11:28) “[And he (Joshua) said (to his teacher, Moses)] “My lord, Moses, כלאם”, destroy them (כַּלֵּם) from out of the world! they who rebel against thee deserve to be destroyed just the same as though they had rebelled against the Holy One, blessed be He (Mekhilta).<br><br>וצא הלחם GO OUT, FIGHT — go out from the cloud and fight against him (Mekhilta),<br><br>מחר TO-MORROW, at the time of the battle, I will take my stand.<br><br>בחר לנו אנשים CHOOSE US MEN — brave men, and men who fear sin (אנשים does not mean merely men — males, but men fit for war and at the same time God-fearing) — choose these so that their merit may stand them in good stead (cf. (Mekhilta). Another explanation: בחר לנו אנשים Choose us men who know how to make witchcraft of none effect; he said this because the sons of Amalek were wizards (cf. Rashi on v. 12)"}, {"ch": 17, "v": 10, "aliyah": 7, "heb": "וַיַּ֣עַשׂ יְהוֹשֻׁ֗עַ כַּאֲשֶׁ֤ר אָֽמַר־לוֹ֙ מֹשֶׁ֔ה לְהִלָּחֵ֖ם בַּעֲמָלֵ֑ק וּמֹשֶׁה֙ אַהֲרֹ֣ן וְח֔וּר עָל֖וּ רֹ֥אשׁ הַגִּבְעָֽה׃", "onk": "וַעֲבַד יְהוֹשֻׁעַ כְּמָא דְאֲמַר לֵהּ משֶׁה <b>לְאַגָחָא קְרָבָא<\/b> בַּעֲמָלֵק וּמשֶׁה אַהֲרֹן וְחוּר סְלִיקוּ לְרֵישׁ רָמָתָא:", "onk_en": "Yehoshua did as Moshe told him—to battle [<b>fight a war with<\/b>] Amaleik. Moshe, Aharon and Chur went up to the top of the hill.", "pj": "וְעָבַד יְהוֹשֻׁעַ הֵיכְמָא דְאָמַר לֵיהּ משֶׁה לְאַגָחָא קְרָבָא בַּעֲמָלֵק וּמשֶׁה אַהֲרן וְחוּר סְלִיקוּ לְרֵישׁ רָמָתָא", "pj_en": "And Jehoshua did as Mosheh had bidden him, to wage war with Amalek. And Mosheh, and Aharon, and Hur went up to the top of the height.", "tj": "", "tj_en": "", "rashi": "<b>ומשה אהרן וחור.<\/b> מִכָּאן לְתַעֲנִית שֶׁצְּרִיכִים שְׁלֹשָׁה לַעֲבֹר לִפְנֵי הַתֵּבָה, שֶׁבְּתַעֲנִית הָיוּ שְׁרוּיִים (מכילתא):<br><br><b>חור.<\/b> בְּנָהּ שֶׁל מִרְיָם הָיָה וְכָלֵב בַּעְלָהּ (סוטה י\"א):", "rashi_en": "AND MOSES AND AARON AND HUR — From this we may infer as regards a public fast that three men must pass before the Holy Ark (i. e. must officiate at prayer) — we may infer this because they (the Israelites) were then engaged in fasting (Mekhilta).<br><br>חור HUR was the son of Miriam and her husband was Caleb (Sotah 11b)."}, {"ch": 17, "v": 11, "aliyah": 7, "heb": "וְהָיָ֗ה כַּאֲשֶׁ֨ר יָרִ֥ים מֹשֶׁ֛ה יָד֖וֹ וְגָבַ֣ר יִשְׂרָאֵ֑ל וְכַאֲשֶׁ֥ר יָנִ֛יחַ יָד֖וֹ וְגָבַ֥ר עֲמָלֵֽק׃", "onk": "וַהֲוָא כַּד מֵרִים משֶׁה יְדוֹהִי וּמִתְגַבְּרִין <b>דְבֵית<\/b> יִשְׂרָאֵל וְכַד מַנַח יְדוֹהִי וּמִתְגַבְּרִין <b>דְבֵית<\/b> עֲמָלֵק:", "onk_en": "When Moshe raised his hand, [<b>(the fighters) of the House of<\/b>] [B’nei] Yisrael prevailed; but when he let his hand down [to rest] [<b>(the fighters) of the House of<\/b>] Amaleik prevailed.", "pj": "וַהֲוָה כַד זְקֵיף משֶׁה יְדוֹי בִּצְלוֹי וּמִתְגַּבְּרִין דְּבֵית יִשְרָאֵל וְכַד הֲוָה מָנַח יְדוֹי מִן לְמַצְלַיָיא וּמִתְגַּבְּרִין דְּבֵית עֲמָלֵק", "pj_en": "And it was, when Mosheh lifted up his hands in prayer, that the house of Israel prevailed; and when he rested his hand from praying, that the house of Amalek prevailed.", "tj": "וַהֲוָה כַּד זְקֵיף משֶׁה יְדוֹי בִּצְלוֹי הֲווֹ בֵּית יִשְרָאֵל מִתְגַּבְּרִין וְכַד הֲוָה מְנַע יְדוֹי מִלְצַלּוֹי הֲוַון בֵּית עֲמָלֵק מִתְגַּבְּרִין וְנָפְלִין בְּסִדְרֵי קְרָבָא:", "tj_en": "And it was that when Mosheh lifted up his hands in prayer, the house of Israel prevailed; and when his hands declined from prayer, Amalek prevailed; and (Israel) fell in the line of battle.", "rashi": "<b>כאשר ירים משה ידו.<\/b> וְכִי יָדָיו שֶׁל מֹשֶׁה נוֹצְחוֹת הָיוּ הַמִּלְחָמָה וְכוּ' כִּדְאִיתָא בְּרֹ\"הַ:", "rashi_en": "כאשר ירים משה ידו WHEN MOSES LIFTED UP HIS HAND — But could Moses’ hands win the battle etc.? See the whole passage as it is given in the Treatise Rosh Hashanah 29a."}, {"ch": 17, "v": 12, "aliyah": 7, "heb": "וִידֵ֤י מֹשֶׁה֙ כְּבֵדִ֔ים וַיִּקְחוּ־אֶ֛בֶן וַיָּשִׂ֥ימוּ תַחְתָּ֖יו וַיֵּ֣שֶׁב עָלֶ֑יהָ וְאַהֲרֹ֨ן וְח֜וּר תָּֽמְכ֣וּ בְיָדָ֗יו מִזֶּ֤ה אֶחָד֙ וּמִזֶּ֣ה אֶחָ֔ד וַיְהִ֥י יָדָ֛יו אֱמוּנָ֖ה עַד־בֹּ֥א הַשָּֽׁמֶשׁ׃", "onk": "וִידֵי משֶׁה יְקָרָן וּנְסִיבוּ אַבְנָא וְשַׁוִיאוּ תְחוֹתוֹהִי וִיתֵב עֲלַהּ וְאַהֲרֹן וְחוּר סַעְדָן בִּידוֹהִי מִכָּא חַד וּמִכָּא חַד וַהֲוָה יְדוֹהִי <b>פְּרִיסָן בִּצְלוֹ<\/b> עַד דְעַל שִׁמְשָׁא:", "onk_en": "Moshe’s hands became heavy. They took a stone and placed it under him and he sat upon it. Aharon and Chur supported his hands, one of them on one side and one on the other side. His hands remained an expression of faith [as he prayed] [<b>were spread in prayer<\/b>] until sunset.", "pj": "וִידוֹי דְמשֶׁה הֲווֹ יַקְרִין מִן בִּגְלַל דְּעִכַּב קְרָבָא לִמְחַר וְלָא אִזְדְּרַז בְּיוֹמָא הַהוּא לְפוּרְקָנָא דְיִשְרָאֵל וְלָא הֲוָה יָכִיל לְמִיזְקַפְהוֹן בִּצְלוֹי וּמִן דַּהֲוָה צָבֵי לְסִגּוּפֵי נַפְשֵׁיהּ נְסִיבוּ אַבְנָא וְשַׁוִּיוּ תְּחוֹתוֹי וִיתֵיב עִילַוָּהּ וְאַהֲרן וְחוּר מְסַעֲדִין לִידוֹי מִיכָּא חָד וּמִכָּא חָד וְהַוָּאָה יְדוֹי פְּרִיסַן בְּהֵימְנוּתָא בִּצְלוֹ וְצוֹמָא עַד מִטְמוֹעַ שִׁמְשָׁא", "pj_en": "And the hands of Mosheh were heavy, because the conflict was prolonged till the morrow, and the deliverance of Israel was not prepared on that day; and he could not hold them up in prayer; on which account he would have afflicted his soul. And they took a stone, and placed it under him, and he sat upon it; and Aharon and Hur supported his hand, this the one, and that the other; and his hands were outstretched with firmness, (or, fidelity,) in prayer and fasting, until the going down of the sun.", "tj": "וִידוֹי דְמשֶׁה הֲווֹ זָקְפַן בִּצְלוֹי:", "tj_en": "And the hands of Mosheh were lifted up in prayer.", "rashi": "<b>וידי משה כבדים.<\/b> בִּשְׁבִיל שֶׁנִּתְעַצֵּל בַּמִּצְוָה וּמִנָּה אַחֵר תַּחְתָּיו, נִתְיַקְּרוּ יָדָיו:<br><br><b>ויקחו.<\/b> אַהֲרֹן וְחוּר:<br><br><b>אבן וישימו תחתיו.<\/b> וְלֹא יָשַׁב לוֹ עַל כַּר וָכֶסֶת. אָמַר: יִשְׂרָאֵל שְׁרוּיִין בְּצַעַר, אַף אֲנִי אֶהְיֶה עִמָּהֶם בְּצַעַר (תענית י\"א):<br><br><b>ויהי ידיו אמונה.<\/b> וַיְהִי מֹשֶׁה יָדָיו בֶּאֱמוּנָה, פְּרוּשׂוֹת הַשָּׁמַיִם בִּתְפִלָּה נֶאֱמָנָה וּנְכוֹנָה:<br><br><b>עד בא השמש.<\/b> שֶׁהָיוּ עֲמָלֵקִים מְחַשְּׁבִין אֶת הַשָּׁעוֹת בָּאִיצְטְרוּלוֹגִיאָה, בְּאֵיזוֹ שָׁעָה הֵם נוֹצְחִים, וְהֶעֱמִיד לָהֶם מֹשֶׁה חַמָּה וְעִרְבֵּב אֶת הַשָּׁעוֹת (תנחומא):", "rashi_en": "וידי משה כבדים BUT MOSES HANDS BECAME HEAVY — Because he had shown himself remiss in the duty that was his, of waging war himself against Amalek, and had appointed another in his stead, his hands became heavy (cf. (Mekhilta).<br><br>ויקחו AND THEY TOOK — Aaron and Hur took —<br><br>אבן וישימו תחתיו A STONE AND THEY PUT IT UNDER HIM [AND HE SAT THEREON] — but he did not seat himself upon a cushion or a pillow, for he said, “Israel is in tribulation; I will be in tribulation together with them”. (Taanit 11a).<br><br>ויהי ידיו אמונה (lit., and he was, his hands faithfulness) — and Moses was in the condition that his hands were in faithfulness — spread forth to heaven in a confident and firm prayer.<br><br>עד בא השמש UNTIL THE GOING DOWN OF THE SUN — Because the Amalekites had calculated the hours by astrology, as to which hour they would prove victorious, Moses held back the sun against them and brought the hours into confusion (Midrash Tanchuma, Beshalach 28)."}, {"ch": 17, "v": 13, "aliyah": 7, "heb": "וַיַּחֲלֹ֧שׁ יְהוֹשֻׁ֛עַ אֶת־עֲמָלֵ֥ק וְאֶת־עַמּ֖וֹ לְפִי־חָֽרֶב׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וְתַבַּר<\/b> יְהוֹשֻׁעַ יָת עֲמָלֵק וְיָת עַמֵהּ <b>לְפִתְגָם<\/b> דְחָרֶב:", "onk_en": "Yehoshua weakened [<b>crushed<\/b>] Amaleik and his people with the edge [<b>word<\/b>] of the sword.", "pj": "וּתְבַר יְהוֹשֻׁעַ יַת עֲמָלֵק דְּקָטַע רֵישֵׁי גִיבָּרַיָא דְּעַמֵּיהּ עַל פּוּם מֵימְרָא דַיְיָ בִּקְטִילַת סַיְיפָא", "pj_en": "And Jehoshua shattered Amalek, and cut off the heads, of the strong men of his people, by the mouth of the Word of the Lord, with the slaughter of the sword.", "tj": "", "tj_en": "", "rashi": "<b>ויחלש יהושע.<\/b> חָתַךְ רָאשֵׁי גִבּוֹרָיו וְלֹא הִשְׁאִיר אֶלָּא חַלָּשִׁים שֶׁבָּהֶם, וְלֹא הֲרָגָם כֻּלָּם, מִכָּאן אָנוּ לְמֵדִים שֶׁעָשׂוּ עַ\"פִּ הַדִּבּוּר שֶׁל שְׁכִינָה (שם):", "rashi_en": "ויחלש יהושע AND JOSHUA DISCOMFITED [AMALEK] (more lit., he weakened Amalek) — he cut off the heads of his mighty men and left only the weak amongst them, and he did not kill all of them (leaving the weak men alive: thus Amalek was made weak, and powerless for further mischief). From this we may learn that they acted according to the expressed pronouncement of the Shechina (otherwise they would, in the stress of battle, not have so discriminated) (Mekhilta)."}, {"ch": 17, "v": 14, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּסֵּ֔פֶר וְשִׂ֖ים בְּאׇזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי־מָחֹ֤ה אֶמְחֶה֙ אֶת־זֵ֣כֶר עֲמָלֵ֔ק מִתַּ֖חַת הַשָּׁמָֽיִם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה כְּתָב דָא דוּכְרָנָא בְּסִפְרָא וְשַׁוִי <b>קֳדָם<\/b> יְהוֹשֻׁעַ אֲרֵי מִמְחָא אֶמְחֵי יָת דוּכְרָנָא דַעֲמָלֵק מִתְּחוֹת שְׁמַיָא:", "onk_en": "Adonoy said to Moshe, “Write this as a remembrance in the Book, [the Torah] and repeat it in [<b>before<\/b>] Yehoshua’s ears, for I will totally obliterate the memory of Amaleik from under the heavens.", "pj": "וַאֲמַר יְיָ לְמשֶׁה כְּתוֹב דָּא דוּכְרָנָא בְּסֵפֶר סָבַיָיא דְמִלְקַדְמִין וְשַׁוִּי פִּתְגָמַיָא הָאִינוּן בְּמִשְׁמָעֵיהּ דִּיהוֹשֻׁעַ אֲרוּם מִימְחָא אֶמְחֵי יַת דּוּכְרָן עֲמָלֵק מִתְּחוֹת שְׁמַיָא", "pj_en": "And the Lord said unto Mosheh, Write this memorial in the book of the elders that were of old, and these words in the hearing, of Jehoshua, that blotting, I will blot out the memory of Amalek from under the heavens.", "tj": "", "tj_en": "", "rashi": "<b>כתב זאת זכרון.<\/b> שֶׁבָּא עֲמָלֵק לְהִזְדַּוֵּג לְיִשְׂרָאֵל קֹדֶם לְכָל הָאֻמּוֹת:<br><br><b>ושים באזני יהושע.<\/b> הַמַּכְנִיס אֶת יִשְׂרָאֵל לָאָרֶץ, שֶׁיְּצַוֶּה אֶת יִשְׂרָאֵל לְשַׁלֵּם לוֹ אֶת גְּמוּלוֹ; כָּאן נִרְמַז לוֹ לְמֹשֶׁה שֶׁיְּהוֹשֻׁעַ מַכְנִיס אֶת יִשְׂרָאֵל לָאָרֶץ (שם):<br><br><b>כי מחה אמחה.<\/b> לְכָךְ אֲנִי מַזְהִירְךָ כֵּן, כִּי חָפֵץ אֲנִי לִמְחוֹתוֹ:", "rashi_en": "כתב זאת זכרון WRITE THIS FOR A MEMORIAL, that Amalek came to wage war against Israel before any other nation.<br><br>ושים באזני יהושע AND PUT INTO THE EARS OF JOSHUA, who will bring Israel into the Holy Land, that he must command Israel to pay him his recompense. Here it was intimated to Moses (by the mere statement that Joshua should in some future time carry out the injunction to destroy Amalek) that Joshua would bring Israel into the Holy Land (cf. (Mekhilta).<br><br>כי מחה אמחה BECAUSE I WOULD UTTERLY BLOT OUT [THE REMEMBRANCE OF AMALEK] — the reason why I admonish you thus is because (כי) I desire to blot it out."}, {"ch": 17, "v": 15, "aliyah": 7, "heb": "וַיִּ֥בֶן מֹשֶׁ֖ה מִזְבֵּ֑חַ וַיִּקְרָ֥א שְׁמ֖וֹ יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;נִסִּֽי׃", "onk": "וּבְנָא משֶׁה מַדְבְּחָא <b>וּפְלַח עֲלוֹהִי קֳדָם<\/b> יְיָ <b>דַעֲבַד לֵהּ נִסִין<\/b>:", "onk_en": "Moshe built an altar and called it [<b>worshiped on it before<\/b>] Adonoy nissi [Adonoy is my miracle] [<b>Who had performed miracles for him<\/b>].", "pj": "וּבְנָא משֶׁה מַדְבְּחָה וּקְרָא שְׁמֵיהּ מֵימְרָא דַיְיָ דֵּין נִיסָא דִילִי דְנִיסָא דְעָבַר אַתְרָא בְּגִינִי הוּא", "pj_en": "And Mosheh builded an altar, and called the name of it, The Word of the Lord is my banner; for the sign which He hath wrought (in this) place was on my behalf.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא שמו.<\/b> שֶׁל מִזְבֵּחַ:<br><br><b>ה' נסי.<\/b> הַקָּבָּ\"ה עָשָׂה לָנוּ כָּאן נֵס. לֹא שֶׁהַמִּזְבֵּחַ קָרוּי ה', אֶלָּא הַמַּזְכִּיר שְׁמוֹ שֶׁל מִזְבֵּחַ זוֹכֵר אֶת הַנֵּס שֶׁעָשָׂה הַמָּקוֹם – ה' הוּא נֵס שֶׁלָּנוּ:", "rashi_en": "ויקרא שמו AND HE CALLED HIS (or its) NAME — the name of the altar,<br><br>ה׳ נסי (lit., the Lord is my banner or my miracle) — The Holy One, blessed be He, here performed a miracle for us. It does not mean that the altar was named ה׳, “the Lord, my banner”, but the reason for so calling it was that anyone mentioning the altar’s name would thereby remember the miracle which the Omni-present had performed, since he would be saying: the Lord, He is our Miracle (cf. Rashi on Genesis 33:20)."}, {"ch": 17, "v": 16, "aliyah": 7, "heb": "וַיֹּ֗אמֶר כִּֽי־יָד֙ עַל־כֵּ֣ס יָ֔הּ<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בכתר ארם צובה היה כתוב כֵּ֣סְיָ֔הּ בתיבה אחת)<\/i> מִלְחָמָ֥ה לַיהֹוָ֖ה בַּֽעֲמָלֵ֑ק מִדֹּ֖ר דֹּֽר׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר <b>בִּשְׁבוּעָה אֲמִירָא דָא מִן קֳדָם דְחֵילָא דִשְׁכִנְתֵּהּ עַל כָּרְסֵהּ יְקָרֵהּ דְעָתִיד דְיִתָּגַח קְרָבָא קֳדָם יְיָ בִּדְבֵית עֲמָלֵק לְשֵׁצָיוּתְהוֹן מִדָרֵי עָלְמָא<\/b>:", "onk_en": "He said [<b>with an oath, this saying from before the Awesome one, whose Shechina is upon His glorious throne, that in the future a war will be waged before God against the house of Amaleik to destroy them for generations forever.<\/b>] , “The hand is on God’s throne, Adonoy will be at war with Amaleik for all generations.”", "pj": "וַאֲמַר אֲרוּם קַיֵּים מֵימְרָא דַיְיָ בְּכוּרְסֵיהּ יְקָרֵיהּ דְּהוּא בְּמֵימְרֵיהּ יַגִּיחַ קְרָבָא בִּדְבֵית עֲמָלֵק וִישֵׁיצֵי יַתְהוֹן לִתְלָתֵי דָרַיָא מִדָּרָא דְעַלְמָא דֵין וּמִדָּרָא דִמְשִׁיחָא וּמִדָּרָא דְעַלְמָא דְאָתֵי", "pj_en": "And he said, Because the Word of the Lord hath sworn by the throne of His glory, that He by His Word will fight against those of the house of Amalek, and destroy them unto three generations; from the generation of this world, from the generation of the Meshiha, and from the generation of the world to come.", "tj": "וַאֲמַר שְׁבוּעָה נָפְקַת מִתְּחוֹת כּוּרְסֵי יְקָרָא דְרִבּוֹן כָּל עַלְמָא יְיָ מַלְכָּא קַדְמָאָה דְעָתִיד לְמִיתַב עַל כּוּרְסֵיהוֹן דְּמַלְכוּתֵיהּ דִבְנֵי יִשְרָאֵל הוּא שָׁאוּל בַּר קִישׁ וְהוּא יְסַדֵּר סִדְרֵי קְרָבָא כָּל קְבֵיל דְּבֵית עֲמָלֵק וְיִקְטוֹל יַתְהוֹן וּמַה דְּמִשְׁתַּיֵּיר מִנְהוֹן יְשֵׁיצוּן יַתְהוֹן מָרְדְּכַי וְאֶסְתֵּר יְיָ בְּמֵימְרֵיהּ אָמַר לְשֵׁיצַיָּא יַת דָּכְרָנֵיהּ דַּעֲמָלֵק לְדָרֵי דָרִין:", "tj_en": "And he said, The oath hath come forth from beneath the throne of the Great One, of all the world the Lord; the first king who will sit upon the throne of the kingdom of the sons of Israel, Shaul, the son of Kish, will set the battle in array against the house of Amalek, and will slay them; and those of them that remain will Mardekai and Esther destroy. The Lord hath said by His Word that the memory of Amalek shall perish to the age of ages.", "rashi": "<b>ויאמר.<\/b> מֹשֶׁה:<br><br><b>כי יד על כס יה.<\/b> יָדוֹ שֶׁל הַקָּבָּ\"ה הוּרְמָה לִשָּׁבַע בְּכִסְאוֹ לִהְיוֹת לוֹ מִלְחָמָה וְאֵיבָה בַעֲמָלֵק עוֹלָמִית, וּמַהוּ כֵּס וְלֹא נֶאֱמַר כִּסֵּא? וְאַף הַשֵּׁם נֶחֱלַק לְחֶצְיוֹ? נִשְׁבַּע הַקָּבָּ\"ה שֶׁאֵין שְׁמוֹ שָׁלֵם וְאֵין כִּסְאוֹ שָׁלֵם עַד שֶׁיִּמָּחֶה שְׁמוֹ שֶׁל עֲמָלֵק כֻּלּוֹ, וּכְשֶׁיִּמָּחֶה שְׁמוֹ יִהְיֶה הַשֵּׁם שָׁלֵם וְהַכִּסֵּא שָׁלֵם, שֶׁנֶּאֱמַר \"הָאוֹיֵב תַּמּוּ חֳרָבוֹת לָנֶצַח\" (תהלים ט'), זֶהוּ עֲמָלֵק שֶׁכָּתוּב בּוֹ \"וְעֶבְרָתוֹ שְׁמָרָה נֶצַח\" (עמוס א'), \"וְעָרִים נָתַשְׁתָּ אָבַד זִכְרָם הֵמָּה\" (תהלים שם), מַהוּ אוֹמֵר אַחֲרָיו? \"וַה' לְעוֹלָם יֵשֵׁב\" — הֲרֵי הַשֵּׁם שָׁלֵם, \"כּוֹנֵן לַמִּשְׁפָּט כִּסְאוֹ\" — הֲרֵי כִּסְּאוֹ שָׁלֵם:", "rashi_en": "ויאמר AND HE SAID — i. e. Moses said.<br><br>כי יד על כס יה BECAUSE THE HAND IS UPON THE THRONE OF JAH — the hand of the Holy One, blessed be He, is raised to swear by His throne that He will have war and enmity against Amalek to all eternity. And what is the force of כס — why does it not say as usual כסא? And the Divine Name, also, is divided into half (יה is only the half of the Tetragrammaton)! The Holy One, blessed be He, swears that His Name will not be perfect nor His throne perfect until the name of Amalek be entirely blotted out. But when his name is blotted out then will His (God’s) Name be perfect and His throne perfect, as it is said, (Psalms 9:7) “The enemy is come to an end, he whose swords were for ever” — and this refers to Amalek of whom it is written, (Amos 1:11; the paragraph is a prophecy against Edom — Esau — the father of Amalek) “he kept his wrath for ever”. The verse in the Psalm continues: “and thou didst uproot enemies, their very memorial is perished”, What does it say immediately after this? (Psalms 9:8) “But the Lord (the Divine Name as given here is the Tetragrammaton) shall now remain for ever” — you see that the Name will be perfect (after Amalek is entirely rooted out as is mentioned in v. 7); “He establishes his throne (כסאו not כס) in righteousness” — so you see that His throne will then be perfect (Midrash Tanchuma, Ki Teitzei 11)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
