ָהּ אַף עַל פִּי שֶׁאַתֶּם אוֹנְנִים:<br><br><b>כאשר צויתי.<\/b> לָכֶם בַּמִּנְחָה:", "rashi_en": "'הן לא הובא וגו‎ BEHOLD [THE BLOOD OF IT] WAS NOT BROUGHT [IN WITHIN THE HOLY PLACE] — for if it had been brought,then indeed was it your duty to burn it, as it is said (Leviticus 6:23) “Any sin-offering whereof any of the blood is brought [into the appointed tent, … shall not be eaten; it shall be burnt in the fire]” (Zevachim 101a; Pesachim 82a);<br><br>אכל תאכלו אתה YE SHOULD INDEED HAVE EATEN IT although you were Onanim,<br><br>כאשר צויתי AS I COMMANDED you in the case of the meal-offering (vv. 12, 13)."}, {"ch": 10, "v": 19, "aliyah": 5, "heb": "וַיְדַבֵּ֨ר אַהֲרֹ֜ן אֶל־מֹשֶׁ֗ה הֵ֣ן הַ֠יּ֠וֹם הִקְרִ֨יבוּ אֶת־חַטָּאתָ֤ם וְאֶת־עֹֽלָתָם֙ לִפְנֵ֣י יְהֹוָ֔ה וַתִּקְרֶ֥אנָה אֹתִ֖י כָּאֵ֑לֶּה וְאָכַ֤לְתִּי חַטָּאת֙ הַיּ֔וֹם הַיִּיטַ֖ב בְּעֵינֵ֥י יְהֹוָֽה׃", "onk": "וּמַלִּיל אַהֲרֹן עִם משֶׁה הָא יוֹמָא דֵין קָרִיבוּ יָת חַטָּאתְהוֹן וְיָת עֲלָתְהוֹן קֳדָם יְיָ וַעֲרָעָא יָתִי עָקָן כְּאִלֵּין וְאִלּוּפוֹן אֲכָלִית חַטָּאתָא יוֹמָא דֵין <b>הֲתַקֵּן<\/b> קֳדָם יְיָ:", "onk_en": "Aharon spoke [in reply] to Moshe, Behold, today they brought their sin-offerings and their burnt-offerings before Adonoy and then such [tragedy] befell me. If I had eaten the sin-offering today, would that have been good in the eyes of [<b>fitting before<\/b>] Adonoy?", "pj": "וּמַלֵיל אַהֲרן עִם משֶׁה הָא יוֹמָא דֵין קְרִיבוּ בְנֵי יִשְרָאֵל יַת קָרְבַּן חַטַאתְהוֹן וְעָלְוַותְהוֹן קֳדָם יְיָ וַאֲרַע יָתִי סִקוּל כְּאִילֵין בִּתְרֵין בְּנַי הֲלָא מַעֲשְרָא תִנְיָנָא אִתְפַּקֵיד דִי לָא לְמֵיכַל אָבִיל מִינֵיהּ כָּל דְכֵן קָרְבָּן חַטָאתָא וּמַה אִילוּ אִישְׁתְּלִיַית וַאֲכָלִית מִן קָרְבַּן חַטָאתָא יוֹמָא דֵין אוּף תְּרֵין בְּנַי דְאִשְׁתְּיָירוּ הֲוָה לְהוֹן מִן דִינָא דְיִתּוֹקְדוּן דְלֵית אֶפְשַׁר דִי שְׁפַר קֳדָם יְיָ", "pj_en": "And Aharon said to Mosheh, Behold, this day the sons of Israel have brought the oblation of their sin offering and their burnt sacrifice before the Lord; but a stroke hath befallen me, in those my two sons. Of the second tythe is it not commanded, Thou shalt not eat of it while mourning? How much more, then of the sin offering? If I had eaten of the sin offering this day with my two sons who are left, would it not have been all error, so that they too might have been burned by a judgment, for doing that which was not pleasing before the Lord?", "tj": "קְרִיבוּ יַת חַטְוָותֵיהוֹן וְיַת עֲלָוַותְהוֹן קֳדָם יְיָ וְאִיתְיַלְפָא יַתְהֶן דְּחַטָּאתָא חֲמִירָא מִן מַעְשְרָא תִנְיָינָא וְלֵית אֶפְשַׁר לַאֲבֵילָא לְמֵיכַל מִינֵיהּ וַאֲנָא דְאָרַע יָתִי אֲבֵילָא רוּבָא יוֹמָא הָדֵין דְּמִיתוּ תְּרֵין בְּנַי נָדָב וַאֲבִיהוּא וַאֲנָא אָבִיל עֲלֵיהוֹן הָא אִילוּ אֲכָלִית חַטָּאת יוֹמָא דֵין הֲאִית אֶפְשַׁר דְּשַׁפִּיר וְתַקִּין קֳדָם יְיָ:", "tj_en": "They have brought their sin offerings and their burnt sacrifice before the Lord; and I have been instructed that these of the sin offering are more weighty than those of the second tythes, of which it is not allowed to the mourner to eat; and to me hath been a great sorrow this day through the death of my two sons Nadab and Abihu: and consider, if, while mourning over them, I were to eat to-day of the sin offering, I should do what would not be pleasing or right before the Lord. When Mosheh had heard, and the word was pleasing in his sight, he sent out a herald through all the camp of Israel, and said, I am he from whom the rite had been hidden; but Aharon my brother hath taught it unto me. And because Mosheh humbled himself, he received thereupon a great reward.", "rashi": "<b>וידבר אהרן.<\/b> אֵין לְשׁוֹן דִּבּוּר אֶלָּא לְשׁוֹן עַז, שֶׁנֶּאֱמַר וַיְדַבֵּר הָעָם וְגוֹ' (במדבר כ\"א), אֶפְשָׁר מֹשֶׁה קָצַף עַל אֶלְעָזָר וְעַל אִיתָמָר וְאַהֲרֹן מְדַבֵּר? הָא יָדַעְתָּ שֶׁלֹּא הָיְתָה אֶלָּא מִדֶּרֶךְ כָּבוֹד; אָמְרוּ: אֵינוֹ בַדִּין שֶׁיְּהֵא אָבִינוּ יוֹשֵׁב וְאָנוּ מְדַבְּרִים לְפָנָיו, וְאֵינוֹ בַדִּין שֶׁיְּהֵא תַלְמִיד מֵשִׁיב אֶת רַבּוֹ; יָכוֹל מִפְּנֵי שֶׁלֹּא הָיָה בְאֶלְעָזָר לְהָשִׁיב? תַּ\"ל וַיֹּאמֶר אֶלְעָזָר הַכֹּהֵן אֶל אַנְשֵׁי הַצָּבָא וְגוֹמֵר (שם ל\"א), הֲרֵי כְּשֶׁרָצָה, דִּבֵּר לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִֹיאִים, זוֹ מָצָאתִי בְּסִפְרֵי שֶׁל פָּנִים שֵׁנִי:<br><br><b>הן היום הקריבו.<\/b> מַהוּ אוֹמֵר? אֶלָּא אָמַר לוֹ מֹשֶׁה: שֶׁמָּא זְרַקְתֶּם דָּמָהּ אוֹנְנִין, שֶׁאוֹנֵן שֶׁעָבַד חִלֵּל? אָמַר לוֹ אַהֲרֹן וְכִי הֵם הִקְרִיבוּ שֶׁהֵם הֶדְיוֹטוֹת? אֲנִי הִקְרַבְתִּי שֶׁאֲנִי כֹהֵן גָּדוֹל וּמַקְרִיב אוֹנֵן (זבחים ק\"א):<br><br><b>ותקראנה אתי כאלה.<\/b> אֲפִלוּ לֹא הָיוּ הַמֵּתִים בָּנַי, אֶלָּא שְׁאָר קְרוֹבִים שֶׁאֲנִי חַיָּב לִהְיוֹת אוֹנֵן עֲלֵיהֶם כְּאֵלּוּ, כְּגוֹן כָּל הָאֲמוּרִים בְּפָרָשַׁת כֹּהֲנִים שֶׁהַכֹּהֵן מִטַּמֵּא לָהֶם (ספרא).<br><br><b>ואכלתי חטאת.<\/b> וְאִם אָכַלְתִּי <b>הייטב וגו'<\/b>:<br><br><b>היום.<\/b> אֲבָל אֲנִינוּת לַיְלָה מֻתָּר, שֶׁאֵין אוֹנֵן אֶלָּא יוֹם קְבוּרָה (ספרא; זבחים ק'):<br><br><b>הייטב בעיני ה'.<\/b> אִם שָׁמַעְתָּ בְּקָדְשֵׁי שָׁעָה אֵין לְךָ לְהָקֵל בְּקָדְשֵׁי דוֹרוֹת:", "rashi_en": "וידבר אהרן AND AARON SAID — The term “saying” used here denotes a harsh utterance, as it is said (Numbers 21:5) “And the people spake (וידבר) against Moses, etc.” — Is it likely that when Moses expressed his indignation with Eleazar and with Ithamar, Aaron should reply to him in such harsh language? You must consequently know (conclude) that it was only by way of respect that these remained silent. They thought, “It would not be right that our father (Aaron) should be sitting here (be present) and that we should speak in his presence, nor would it be right that a disciple should retort on his teacher (Moses)”. You might think, however, that Eleazar did not possess the ability to reply, and that on this account he was silent. This was not so for it is stated (Numbers 31:21) “And Eleazar the priest spake to the men of the army, etc.” — and so you see that when he wished to do so he did speak in the presence of Moses and in the presence of the princes (cf. Numbers v. 13). This I found in the ספרי של פנים שני (known under the name of מדרש פנים or ספרי זוטא) (see Yalkut Shimoni on Torah 785:40).<br><br>הן היום הקריבו BEHOLD, THIS DAY THEY HAVE OFFERED — What did he mean by this? It does not appear to be a reply to Moses rebuke! But Moses had said to them: “Perhaps you have sprinkled its blood whilst you were Onanim and have on that account burnt it, since it thereby became defiled!? — for the rule is that if an Onan does any sacrifical rite he thereby defiles the sacrifice. Aaron therefore said to him: “Did they then offer the sacrifice — they wo are ordinary priests? It was “I” that offered — I who am the High Priest and who may therefore offer when an Onan (Zevachim 101a).<br><br>ותקראנה אתי כאלה AND IF THINGS LIKE THESE HAD BEFALLEN ME — even if those who died were not my sons but other blood relatives for whom I am bound to mourn as an Onan, even as I am bound to mourn for these — for instance all those mentioned in the section regarding the priests (ch. 21) for whom the priest may of set purpose render himself unclean (Sifra, Shemini, Chapter 2 9).<br><br>ואכלתי חטאת then IF I HAD EATEN THE SIN-OFFERING, 'הייטב וגו‎, WOULD IT HAVE BEEN PLEASING etc.<br><br>היום THIS DAY (i. e. by day) — but in the case of the mourning of an Onan on the night following the death, the eating of an offering is permitted, for the laws regarding an Onan really (i. e. מן התורה) apply only to the day of burial which is also the day of death (cf. Sifra, Shemini, Chapter 2 11; Zevachim 100b).<br><br>'הייטב בעיני ה WOULD IT HAVE BEEN PLEASING IN THE EYES OF THE LORD? — If you have heard (been commanded; cf. v. 13) in the case of occasional holy offerings to which category the meal offering offered on the day of installation and that of Nachshon belonged that these may be eaten by Onanim (cf. vv. 12 and 13) you have no right to take a lenient view and to permit this also in the case of sacrifices that are obligatory on all generations, as this goat of the New Moon is! (Zevachim 101a)."}, {"ch": 10, "v": 20, "aliyah": 5, "heb": "וַיִּשְׁמַ֣ע מֹשֶׁ֔ה וַיִּיטַ֖ב בְּעֵינָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּשְׁמַע משֶׁה <b>וּשְׁפַר<\/b> בְּעֵינוֹהִי:", "onk_en": "Moshe heard, and it was good [<b>pleasing<\/b>] in his eyes.", "pj": "וּשְׁמַע משֶׁה וּשְׁפַר קֳדָמוֹי וְאַפֵּיק כְּרוֹזָא בְּמַשְׁרִיתָא לְמֵימָר אֲנָא הוּא דְאִיתְעַלָמִית הִילְכָתָא מִנִי וְאַהֲרן אָחִי אִדְכַּר יָתָהּ לִי", "pj_en": "And Mosheh heard, and it was approvable before him, and he sent out a crier through the camp, saying, I am he from whom the rite hath been hidden, and Aharon my brother hath brought its remembrance to me.", "tj": "כֵּיוַן דִּשְׁמַע משֶׁה וּשְׁפַר פִּתְגָמָא בְּאַפּוֹי וְאַפִּיק כְּרוֹז בְּכָל מַשְׁרִיתְהוֹן דְּיִשְרָאֵל וַאֲמַר אֲנָא הוּא דְאִיתְעֲלָמִית הִילְכָתָא מִנִי וְאַהֲרן אָחִי אַלִּיף יָתָהּ לִי וְעַל דְּאַשְׁפַּל משֶׁה גַרְמֵיהּ קַבֵּיל עֲלֵיהּ אַגָר סַגִי וּשְׁמַע משֶׁה וּשְׁפַר פִּתְגָמָא בְּאַפּוֹי:", "tj_en": "For Mosheh heard, and the word was pleasing before him.", "rashi": "<b>וייטב בעיניו.<\/b> הוֹדָה וְלֹא בוֹשׁ לוֹמַר לֹא שָׁמַעְתִּי (זבחים ק\"א):", "rashi_en": "וייטב בעיניו AND IT WAS PLEASING IN HIS EYES — He admitted his error and was not ashamed to do so, by saying (instead of admitting it) “I have not heard a statement (from God regarding this)\", but rather he said, “I have heard, but I forgot it” (Sifra, Shemini, Chapter 2 12; Zevachim 101b)."}, {"ch": 11, "v": 1, "aliyah": 6, "heb": "וַיְדַבֵּ֧ר יְהֹוָ֛ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹ֥ר אֲלֵהֶֽם׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וּלְאַהֲרֹן לְמֵימַר לְהוֹן:", "onk_en": "And Adonoy spoke to Moshe and to Aharon, saying to them:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר לְהוֹן לִבְנֵי אַהֲרן דְיִזְהָרוּן יַת בְּנֵי יִשְרָאֵל דִי טַעֲמִין בִּדְכוּתָא מֵיכַלְהוֹן וְיִתְפַּרְשׁוּן מְסוֹאֲבוֹת תַּמְנִי סֵירֵי טְרִיפָן", "pj_en": "And the Lord spake with Mosheh and with Aharon, bidding them and the sons of Aharon admonish the children of Israel to taste their food in purity, and to separate on account of uncleanness eighteen kinds of food to be rejected.", "tj": "", "tj_en": "", "rashi": "<b>אל משה ואל אהרן.<\/b> לְמֹשֶׁה אָמַר שֶׁיֹּאמַר לְאַהֲרֹן:<br><br><b>לאמר אלהם.<\/b> אָמַר שֶׁיֹּאמַר לְאֶלְעָזָר וּלְאִיתָמָר; אוֹ אֵינוֹ אֶלָּא לֵאמֹר לְיִשְֹרָאֵל? כְּשֶׁהוּא אוֹמֵר דַּבְּרוּ אֶל בְּנֵי יִשְֹרָאֵל הֲרֵי דִּבּוּר אָמוּר לְיִשְֹרָאֵל, הָא מָה אֲנִי מְקַיֵּם לֵאמֹר אֲלֵהֶם? לַבָּנִים — לְאֶלְעָזָר וּלְאִיתָמָר (ספרא):", "rashi_en": " ‎‎משה ואל אהרן‏ ‎‎‏ אל[AND THE LORD SPOKE] TO MOSES AND TO AARON — He spoke to Moses that he should in turn tell Aaron (cf. Rashi on Leviticus 1:1 s. v.אליו.) <br><br>לאמר אליהם SAYING UNTO THEM (more lit. “to say unto them”) — He said to Aaron that he should tell it to Eleazar and Ithamar. But perhaps this is not the meaning, but it means that he should tell Israel? When, however, it states (v. 2) “Speak unto the children of Israel”, we have the command of speaking to Israel mentioned there; how then can I explain the words “to say to them?” — to say it to his sons, to Eleazar and Ithamar (Sifra, Shemini, Section 2 1)."}, {"ch": 11, "v": 2, "aliyah": 6, "heb": "דַּבְּר֛וּ אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר זֹ֤את הַֽחַיָּה֙ אֲשֶׁ֣ר תֹּאכְל֔וּ מִכׇּל־הַבְּהֵמָ֖ה אֲשֶׁ֥ר עַל־הָאָֽרֶץ׃", "onk": "מַלִּילוּ עִם בְּנֵי יִשְׂרָאֵל לְמֵימָר דָּא חַיְתָא דִּי תֵיכְלוּן מִכָּל בְּעִירָא דִּי עַל אַרְעָא:", "onk_en": "Speak to Bnei Yisroel, saying: these are the living things that you may eat from among all the animals that are on the earth.", "pj": "מַלִילוּ עִם בְּנֵי יִשְרָאֵל לְמֵימָר דָא חַיְתָא דְמִכַשְׁרָא לְמֵיכַלְהוֹן מִן כָּל בְּעִירָא דְעַל אַרְעָא", "pj_en": "Speak with the children of Israel, saying: These are the animals which are fit to you for food, of every beast which is upon the earth.", "tj": "", "tj_en": "", "rashi": "<b>דברו אל בני ישראל.<\/b> אֶת כֻּלָּם הִשְׁוָה לִהְיוֹת שְׁלוּחִים בְּדִבּוּר זֶה, לְפִי שֶׁהֻשְׁווּ בַּדְּמִימָה וְקִבְּלוּ עֲלֵיהֶם גְּזֵרַת הַמָּקוֹם מֵאַהֲבָה:<br><br><b>זאת החיה.<\/b> לְשׁוֹן חַיִּים, לְפִי שֶׁיִּשְֹרָאֵל דְּבוּקִים בַּמָּקוֹם וּרְאוּיִין לִהְיוֹת חַיִּים, לְפִיכָךְ הִבְדִּילָם מִן הַטֻּמְאָה וְגָזַר עֲלֵיהֶם מִצְוֹת, וְלָאֻמּוֹת לֹא אָסַר כְּלוּם, מָשָׁל לְרוֹפֵא שֶׁנִּכְנַס לְבַקֵּר אֶת הַחוֹלֶה כּוּ' כִּדְאִיתָא בְּמִדְרַשׁ רַבִּי תַנְחוּמָא:<br><br><b>זאת החיה.<\/b> מְלַמֵּד שֶׁהָיָה מֹשֶׁה אוֹחֵז בַּחַיָּה וּמַרְאֶה אוֹתָהּ לְיִשְֹרָאֵל זֹאת תֹּאכְלוּ וְזֹאת לֹא תֹאכְלוּ (חולין מ\"ב), אֶת זֶה תֹּאכְלוּ וְגוֹ' (פסוק ט'), אַף בְּשִׁרְצֵי הַמַּיִם אָחַז מִכָּל מִין וָמִין וְהֶרְאָה לָהֶם, וְכֵן בָּעוֹף וְאֶת אֵלֶּה תְּשַׁקְּצוּ מִן הָעוֹף (פסוק י\"ג), וְכֵן בַּשְּׁרָצִים וְזֶה לָכֶם הַטָּמֵא (פסוק כ\"ט):<br><br><b>זאת החיה … מכל הבהמה.<\/b> מְלַמֵּד שֶׁהַבְּהֵמָה בִּכְלַל חַיָּה (ספרא; חולין ע'):", "rashi_en": "דברו אל בני ישראל SPEAK TO THE CHILDREN OF ISRAEL (The word “speak” is in the plural) — He made all of them (Moses, Aaron, Eleazar and Ithamar) alike His messengers in communicating this utterance, because they were all alike in remaining silent and lovingly accepted the decree of the Omnipresent God in respect to the death of Nadab and Abihu.<br><br>זאת החיה THESE ARE THE ANIMALS — the word חיה is an expression denoting life and is purposely used here in preference to בהמה to express the following idea: because Israel cleave to the Omnipresent and therefore deserve to remain in life, [זאת החיה is thus taken to mean: This, O living nation (or, nation that lives), is what ye may eat!]. He therefore separated them from what is unclean, and imposed commandments upon them, whilst to the other nations who do not cleave to him He prohibited nought. A parable! It may be compared to the case of a physician who goes to visit a sick person: one who is incurable he permits to eat whatever he chooses, while to the patient who may recover he gives directions as to what he may eat and may not eat — as may be found in the Midrash of Rabbi Tanchuma 3:3:6. <br><br>זאת החיה THIS IS THE ANIMAL — This! the expression זאת teaches us that Moses held each animal and showed it to Israel, saying, “This ye may eat, and this ye may not eat” (Chullin 42a). Similarly Scripture states of fish (v. 9)  'את זה תאכלו וגו‎‎ THIS YE MAY EAT etc. — also of the swarming creatures of the waters he held some of every species and showed them to them (to the Israelites). So, too, in the case of birds: (v. 13) “And these are they which ye shall have in abomination amongst the fowls”, and similarly as regards the swarming reptiles (v. 29): “And these are unclean to you” (Sifra, Shemini, Section 2 2; cf. Menachot 29a).<br><br>מכל הבהמה ....... ‎זאת החיה ‎THESE ARE THE ANIMALS (החיה) [WHICH YE MAY EAT]; AMONG ALL THE CATTLE (הבהמה) [YE MAY EAT] etc. — This teaches us that בהמה is included in the term חיה (Sifra, Shemini, Section 2 8; Chullin 71a)."}, {"ch": 11, "v": 3, "aliyah": 6, "heb": "כֹּ֣ל&thinsp;<b>׀<\/b> מַפְרֶ֣סֶת פַּרְסָ֗ה וְשֹׁסַ֤עַת שֶׁ֙סַע֙ פְּרָסֹ֔ת מַעֲלַ֥ת גֵּרָ֖ה בַּבְּהֵמָ֑ה אֹתָ֖הּ תֹּאכֵֽלוּ׃", "onk": "כָּל דִּי סְדִיקָן פַּרְסָתָא וּמַטִּלְפָן טִלְפִין פַּרְסָתָא <b>מַסְּקָא פִשְׁרָא<\/b> בִּבְעִירָא יָתַהּ תֵּיכְלוּן:", "onk_en": "All that have a cloven hoof, and they [the hooves] are [completely] split and that [also] chews its cud [<b>brings up dissolved food<\/b>] among animals, you may eat it.", "pj": "כָּל דִסְדִיקָא פַּרְסָתָא וּמַטִילְפָא טִילְפִין פַּרְסָתָא וּדְאִית לָהּ קַרְנִין מַסְקָא פִּישְׁרָא בִּבְעִירָא יָתָהּ תֵּיכְלוּן", "pj_en": "Whatsoever divideth the hoof and is cloven-footed, and that which hath horns bringing up the cud among the beasts, that you may eat.", "tj": "", "tj_en": "", "rashi": "<b>מפרסת.<\/b> כְּתַרְגּוּמוֹ סְדִיקָא:<br><br><b>פרסה.<\/b> פלנט\"א בְּלַעַז:<br><br><b>ושסעת שסע.<\/b> שֶׁמֻּבְדֶּלֶת מִלְּמַעְלָה וּמִלְּמַטָּה בִּשְׁתֵּי צִפָּרְנִַין, כְּתַרְגּוּמוֹ וּמַטִּלְּפָן טִלְפִין, שֶׁיֵּשׁ שֶׁפַּרְסוֹתָיו סְדוּקוֹת מִלְּמַעְלָה וְאֵין שְׁסוּעוֹת וּמֻבְדָּלוֹת לְגַמְרֵי, שֶׁמִּלְּמַטָּה מְחֻבָּרוֹת:<br><br><b>מעלת גרה.<\/b> מַעֲלָה וּמְקִיאָה הָאֹכֶל מִמֵּעֶיהָ וּמַחֲזֶרֶת אוֹתוֹ לְתוֹךְ פִּיהָ לְכָתְשׁוֹ וּלְטָחֳנוֹ הָדֵק:<br><br><b>גרה.<\/b> כָּךְ שְׁמוֹ; וְיִתָּכֵן לִהְיוֹת מִגִּזְרַת מַיִם הַנִּגָּרִים (שמואל ב י\"ד), שֶׁהוּא נִגְרָר אַחַר הַפֶּה; וְתַרְגּוּמוֹ פִשְׁרָא, שֶׁעַל יְדֵי הַגֵּרָה הָאֹכֶל נִפְשָׁר וְנִמּוֹחַ:<br><br><b>בבהמה.<\/b> תֵּיבָה יְתֵרָה הִיא לִדְרָשָׁה — לְהַתִּיר אֶת הַשְּׁלִיל הַנִּמְצָא בִמְעֵי אִמּוֹ (ספרא; חולין ס\"ט):<br><br><b>אתה תאכלו.<\/b> וְלֹא בְהֵמָה טְמֵאָה, וַהֲלֹא בְאַזְהָרָה הִיא? אֶלָּא לַעֲבֹר עָלֶיהָ בַּעֲשֵׂה וְלֹא תַעֲשֶׂה (ספרא; זבחים ל\"ד):", "rashi_en": "מפרסת — Explain this as the Targum does: that is split. <br><br>פרסה — plante in O. F.; English= hoof.<br><br>ושסעת שסע AND HATH CLOVEN FEET — which are divided above and below into two nails (The hoof must be cloven over the entire height, so that from top to bottom they are split, and the hoofs are covered therefore not by one nail but by two); as the Targum has it: which has nails (plural). For there are animals whose hoofs are cleft on top but are not cleft and separated entirely, because they are joined below (cf. Rashi on v. 26).<br><br>מעלת גרה WHICH CHEWETH THE CUD — which brings up and spues up the food from its entrails and returns it into its mouth to pound it small and to grind it thin. <br><br>גרה THE CUD — This is its name (that of the food thus returned to the mouth); and it seems likely that it is of the same derivation as the word we find in (II Samuel 14:14) “water which is drawn towards (הנגרים) the earth”, and it (the cud) is so called because it is drawn towards the mouth. The translation of the Targum,however, is פשרא which denotes something dissolved, for through the rumination the food is dissolved and becomes pulpy (cf. Bava Kamma 28b).<br><br>בבהמה AMONGST (lit., in) THE BEAST — This is a redundant word and therefore may be used for an Halachic derivation — to permit the embryo found within the dam (בבהמה — within the beast) to be used as food without itself being slaughtered (Sifra, Shemini, Chapter 3 1; Chullin 69a). <br><br>אתה תאכלו THAT YE MAY EAT, and not an unclean animal. But is not this implied in the prohibition in the following verse? But what is here expressed in a positive form is there stated as a negative command, so that now, one who eats such food transgresses thereby a positive and a negative command (because a prohibition that is not plainly expressed, but can only be drawn by inference from a positive command, is itself regarded only as a positive command — לאו הבא מכלל עשה עשה) (Sifra, Shemini, Chapter 3 2)."}, {"ch": 11, "v": 4, "aliyah": 6, "heb": "אַ֤ךְ אֶת־זֶה֙ לֹ֣א תֹֽאכְל֔וּ מִֽמַּעֲלֵי֙ הַגֵּרָ֔ה וּמִמַּפְרִסֵ֖י הַפַּרְסָ֑ה אֶֽת־הַ֠גָּמָ֠ל כִּֽי־מַעֲלֵ֨ה גֵרָ֜ה ה֗וּא וּפַרְסָה֙ אֵינֶ֣נּוּ מַפְרִ֔יס טָמֵ֥א ה֖וּא לָכֶֽם׃", "onk": "בְּרַם יָת דֵּין לָא תֵיכְלוּן <b>מִמַּסְּקֵי פִשְׁרָא<\/b> וּמִמַּסְדִּיקֵי פַּרְסָתָא יָת גַּמְלָא אֲרֵי <b>מַסִּיק פִּשְׁרָא<\/b> הוּא וּפַרְסָתָא לָא סְדִיקָא מְסָאָב הוּא לְכוֹן:", "onk_en": "However, these in particular you may not eat of those that chew [<b>bring up<\/b>] their cud [<b>dissolved food<\/b>] and that have cloven hooves: the camel, for he chews [<b>brings up<\/b>] his cud [<b>dissolved food<\/b>] but does not have a split hoof it is unclean to you.", "pj": "בְּרַם יַת דֵין לָא תֵיכְלוּן מִמִינָא דְמַסְקֵי פִּישְׁרָא וּסְדִיקֵי פַּרְסָתָא דְאִיתְיְלִיד מִמְסָאָבְתָּא בְּרַם יַת גַמְלָא אֲרֵי מַסִיק פּוּשְׁרָא וּפַרְסָתֵיהּ לָא סְדִיקָא מְסָאָב הוּא לְכוֹן", "pj_en": "But you may not eat of the kinds that (only) bring up the cud, nor (of them which only) divide the hoof, because (they are) born of the unclean. The camel, because he bringeth up the cud, but divideth not the hoof; he is unclean to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 5, "aliyah": 6, "heb": "וְאֶת־הַשָּׁפָ֗ן כִּֽי־מַעֲלֵ֤ה גֵרָה֙ ה֔וּא וּפַרְסָ֖ה לֹ֣א יַפְרִ֑יס טָמֵ֥א ה֖וּא לָכֶֽם׃", "onk": "וְיָת <b>טַפְזָא<\/b> אֲרֵי <b>מַסִּיק פִּשְׁרָא<\/b> הוּא וּפַרְסָתָא לָא סְדִיקָא מְסָאָב הוּא לְכוֹן:", "onk_en": "The [<b>jumping<\/b>] rabbit , for it chews [<b>brings up<\/b>] its cud [<b>dissolved food<\/b>] but does not have a cloven hoof it is unclean to you.", "pj": "וְיַת טַוְוזָא אֲרוּם מַסִיק פִּישְׁרָא וּפַרְסָתֵיהּ לָא סְדִיקָא מְסָאָב הוּא לְכוֹן", "pj_en": "And the coney, because he bringeth up the cud, but divideth not the hoof, is unclean to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 6, "aliyah": 6, "heb": "וְאֶת־הָאַרְנֶ֗בֶת כִּֽי־מַעֲלַ֤ת גֵּרָה֙ הִ֔וא וּפַרְסָ֖ה לֹ֣א הִפְרִ֑יסָה טְמֵאָ֥ה הִ֖וא לָכֶֽם׃", "onk": "וְיָת אַרְנְבָא אֲרֵי <b>מַסְּקָא פִשְׁרָא<\/b> הִיא וּפַרְסָתָא לָא סְדִיקָא מְסָאָבָא הִיא לְכוֹן:", "onk_en": "The hare, for it chews [<b>brings up<\/b>] its cud [<b>dissolved food<\/b>] but it does not have a cloven hoof it is unclean to you.", "pj": "וְיַת אַרְנְבָא אֲרוּם מַסִיק פִּישְׁרָא הוּא וּפַרְסָתָא לָא סְדִיקָא מְסָאָב הוּא לְכוֹן", "pj_en": "And the hare, because he bringeth up the cud, but divideth not the hoof, is unclean to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 7, "aliyah": 6, "heb": "וְאֶת־הַ֠חֲזִ֠יר כִּֽי־מַפְרִ֨יס פַּרְסָ֜ה ה֗וּא וְשֹׁסַ֥ע שֶׁ֙סַע֙ פַּרְסָ֔ה וְה֖וּא גֵּרָ֣ה לֹֽא־יִגָּ֑ר טָמֵ֥א ה֖וּא לָכֶֽם׃", "onk": "וְיָת חֲזִירָא אֲרֵי סְדִיק פַּרְסָתָא הוּא וּמַטִּילְפָן טִלְפִין פַּרְסָתֵיהּ וְהוּא <b>פִּשְׁרָא לָא פָשָׁר<\/b> מְסָאָב הוּא לְכוֹן:", "onk_en": "The pig, for though it has cloven hooves, and its hooves are [completely] split—it does not chew [<b>bring up<\/b>] its cud [<b>dissolved food<\/b>]—it is unclean to you.", "pj": "וְיַת חֲזֵירָא אֲרוּם סָדִיק פַּרְסָתָא הוּא וּמְטַלֵיף טִילְפִין פַּרְסָתָא וְהוּא פִישְׁרָא לָא פָשָׁר מְסָאָב הוּא לְכוֹן", "pj_en": "And the swine, because he divideth the hoof, and is cloven, footed, but cheweth not the cud, is unclean to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 8, "aliyah": 6, "heb": "מִבְּשָׂרָם֙ לֹ֣א תֹאכֵ֔לוּ וּבְנִבְלָתָ֖ם לֹ֣א תִגָּ֑עוּ טְמֵאִ֥ים הֵ֖ם לָכֶֽם׃", "onk": "מִבִּסְרְהוֹן לָא תֵיכְלוּן וּבִנְבִלְתְּהוֹן לָא תִקְרְבוּן מְסַאֲבִין אִנּוּן לְכוֹן:", "onk_en": "You shall not eat of their flesh and you may not touch their carcasses; they are unclean to you.", "pj": "מִבִּשְרֵיהוֹן לָא תֵיכְלוּן וּבִנְבֵילְתְּהוֹן לָא תְקַרְבוּן מְסָאֲבִין אִינוּן לְכוֹן", "pj_en": "Of their flesh you shall not eat, nor touch their carcase; they are abominable to you.", "tj": "", "tj_en": "", "rashi": "<b>מבשרם לא תאכלו.<\/b> אֵין לִי אֶלָּא אֵלּוּ, שְׁאָר בְּהֵמָה טְמֵאָה שֶׁאֵין לָהּ שׁוּם סִימָן טָהֳרָה מִנַּיִן? אָמַרְתָּ קַל וָחֹמֶר, וּמָה אֵלּוּ שֶׁיֵּשׁ בָּהֶן קְצָת סִימָנֵי טָהֳרָה אֲסוּרוֹת וְכוּ' (ספרא):<br><br><b>מבשרם.<\/b> עַל בְּשָׂרָם בְּאַזְהָרָה וְלֹא עַל עֲצָמוֹת וְגִידִין וְקַרְנַיִם וּטְלָפַיִם (שם):<br><br><b>ובנבלתם לא תגעו.<\/b> יָכוֹל יְהוּ יִשְׂרָאֵל מֻזְהָרִים עַל מַגַּע נְבֵלָה, תַּ\"ל אֱמֹר אֶל הַכֹּהֲנִים וְגוֹ' — כֹּהֲנִים מֻזְהָרִין וְאֵין יִשְׂרָאֵל מֻזְהָרִין — קַל וָחֹמֶר מֵעַתָּה: וּמַה טֻּמְאַת מֵת חֲמוּרָה לֹא הִזְהִיר בָּהּ אֶלָּא כֹּהֲנִים, טֻמְאַת נְבֵלָה קַלָּה לֹא כָל שֶׁכֵּן, וּמַה תַּלְמוּד לוֹמַר לֹא תִגָּעוּ? בָּרֶגֶל (שם; ראש השנה ט\"ז):", "rashi_en": "מבשרם לא תאכלו OF THEIR FLESH SHALL YE NOT EAT — I have here only a law about these animals mentioned here! Whence can I derive that the same applies to other unclean animals which have no sign of cleanness at all? You must admit that it is a conclusion a fortiori: How is it with these that have some signs of cleanness? They are forbidden! how much the more must this be so in the case of cattle which do not possess even one sign of cleanness! (Sifra, Shemini, Chapter 3 2).<br><br>מבשרם OF THEIR FLESH [SHALL YE NOT EAT] — with respect to their flesh one is placed under a prohibition to eat, but not in respect to the bones, sinews, horns and claws (Sifra, Shemini, Chapter 4 8). <br><br>ובנבלתם לא תגעו AND THEIR CARRION SHALL YE NOT TOUCH — One might think that Israelites (i. e. non-priests) are prohibited from touching a carcass at any time! It, however, states, (Leviticus 21:1) in reference to uncleanness in touching a corpse: “Speak unto the priests etc.” — priests are prohibited (from touching it) and Israelites in general are not prohibited. Well, you can draw a conclusion a fortiori from now (i. e. consequent upon what you have now stated): How is it in the case of uncleanness caused by a corpse, which is a stringent kind of uncleanness? The Torah prohibits it only to priests, but ordinary Israelites may touch a corpse. Surely in the case of uncleanness caused by a carcass which is less stringent this is all the more so! Then why does it state here: “[and their carrion] shall ye not touch”? — It means on a festival when every male Israelite was obliged to appear in the Sanctuary and should therefore be in a state of cleanness (Sifra, Shemini, Chapter 4 8-9; Rosh Hashanah 16b)."}, {"ch": 11, "v": 9, "aliyah": 6, "heb": "אֶת־זֶה֙ תֹּֽאכְל֔וּ מִכֹּ֖ל אֲשֶׁ֣ר בַּמָּ֑יִם כֹּ֣ל אֲשֶׁר־לוֹ֩ סְנַפִּ֨יר וְקַשְׂקֶ֜שֶׂת בַּמַּ֗יִם בַּיַּמִּ֛ים וּבַנְּחָלִ֖ים אֹתָ֥ם תֹּאכֵֽלוּ׃", "onk": "יָת דֵּין תֵּיכְלוּן מִכָּל דִּי בְמַיָּא כֹּל דִּי לֵיהּ צִיצִין וְקַלְפִין בְּמַיָּא בְּיָמְמַיָּא וּבְנַחֲלַיָּא יָתְהוֹן תֵּיכְלוּן:", "onk_en": "These you may eat, of all things that are in water; all that have fins and scales in the waters, in oceans and in rivers; you may eat them.", "pj": "יַת דֵין תֵּיכְלוּן מִן כָּל דִבְמַיָא כָּל דִילֵיהּ צִיצִין וְחַרְסְפִיתִין בְּיַמְמַיָא וּבְנַחֲלַיָא יַתְהוֹן תֵּיכְלוּן", "pj_en": "And these you may eat, of all that are in the waters: every one that hath fins and scales in the seas and the rivers,", "tj": "", "tj_en": "", "rashi": "<b>סנפיר.<\/b> אֵלּוּ שֶׁשָּׁט בָּהֶם (חולין נ\"ט):<br><br><b>קשקשת.<\/b> אֵלּוּ קְלִפִּין הַקְּבוּעִים בּוֹ (כְּמוֹ שֶׁנֶּאֱמַר (שמואל א י\"ז), וְשִׁרְיוֹן קַשְׂקַשִּׂים הוּא לָבוּשׁ):", "rashi_en": "סנפיר — These are what it (the fish) swims with — FINS.<br><br>קשקשת — These are  the scales attached to it (see Chullin 59a) as it is said (I Samuel 17:5) \"in a scaly coat of mail (שריון קשקשים) was he clothed\"."}, {"ch": 11, "v": 10, "aliyah": 6, "heb": "וְכֹל֩ אֲשֶׁ֨ר אֵֽין־ל֜וֹ סְנַפִּ֣יר וְקַשְׂקֶ֗שֶׂת בַּיַּמִּים֙ וּבַנְּחָלִ֔ים מִכֹּל֙ שֶׁ֣רֶץ הַמַּ֔יִם וּמִכֹּ֛ל נֶ֥פֶשׁ הַחַיָּ֖ה אֲשֶׁ֣ר בַּמָּ֑יִם שֶׁ֥קֶץ הֵ֖ם לָכֶֽם׃", "onk": "וְכֹל דִּי לֵית לֵיהּ צִיצִין וְקַלְפִין בְּיַמְמַיָּא וּבְנַחֲלַיָּא מִכֹּל רִחֲשָׁא דְמַיָּא וּמִכָּל נַפְשָׁא חַיְתָא דִּי בְמַיָּא שִׁקְצָא אִנּוּן לְכוֹן:", "onk_en": "All that do not have fins and scales [that are] in the oceans and rivers; of any creature that creeps in the water and of any living creature that is in the water; they are repulsive to you.", "pj": "וְכָל דְלֵית לֵיהּ צִיצִין וְחַרְסְפִיתִין בְּיַמְמַיָא וּבְנַחֲלַיָא מִן כָּל רִיחֲשָׁא דִי בְּמַיָא שִׁיקְצָא הִינוּן לְכוֹן", "pj_en": "and of anything that is in the sea that crawleth, shall be an abomination to you,", "tj": "", "tj_en": "", "rashi": "<b>שרץ.<\/b> בְּכָל מָקוֹם מַשְׁמָעוֹ דָּבָר נָמוּךְ שֶׁרוֹחֵשׁ וְנָד עַל הָאָרֶץ:", "rashi_en": "שרץ THE PROLIFIC CREATURES — Everywhere this word denotes a low (small) being that creeps and moves along upon the ground (cf. Rashi on Genesis 1:20)."}, {"ch": 11, "v": 11, "aliyah": 6, "heb": "וְשֶׁ֖קֶץ יִהְי֣וּ לָכֶ֑ם מִבְּשָׂרָם֙ לֹ֣א תֹאכֵ֔לוּ וְאֶת־נִבְלָתָ֖ם תְּשַׁקֵּֽצוּ׃", "onk": "וְשִׁקְצָא יְהוֹן לְכוֹן מִבִּסְרְהוֹן לָא תֵיכְלוּן וְיָת נְבִלְתְּהוֹן תְּשַׁקְּצוּן:", "onk_en": "They shall be repulsive to you, you shall not eat of their flesh and their carcasses shall be repulsive by you.", "pj": "וְשִׁיקְצָא יְהוֹן לְכוֹן צִירֵיהוֹן וְרוֹעֲדֵיהוֹן וּמִבִּשְרֵיהוֹן לָא תֵיכְלוּן וְיַת נְבֵילְתְּהוֹן תְּשַׁקְצוּן וּמִן הַנָיָיתְהוֹן תִּתְרַחֲקוּן", "pj_en": "and an abomination shall their jelly and their sauce be to you; of their flesh you shall not eat, and their carcase you shall have in abhorence, and from the use of them you must keep aloof.", "tj": "", "tj_en": "", "rashi": "<b>ושקץ יהיו.<\/b> לֶאֱסֹר אֶת עֵרוּבֵיהֶן אִם יֵשׁ בָּהֶם בְּנוֹתֵן טַעַם (ספרא):<br><br><b>מבשרם.<\/b> אֵינוֹ מוּזְהָר עַל הַסְּנַפִּירִים וְעַל הָעֲצָמוֹת (שם):<br><br><b>ואת נבלתם תשקצו.<\/b> לְרַבּוֹת יַבְחוּשִׁין שֶׁסִּנְּנָן; יַבְחוּשִׁין מושיירונ\"ש בלע\"ז (חולין ס\"ז):", "rashi_en": "ושקץ יהיו AND THEY SHALL BE AN ABOMINABLE THING — This statement is here repeated to prohibit all things with which it (the שרץ) is mixed if they contain so much of the שרץ as to impart its taste to them (Sifra, Shemini, Section 3 9).<br><br>מבשרם OF THEIR FLESH — One is,however, not prohibited in respect to the fins and the bones (Sifra, Shemini, Section 3 10).<br><br>ואת נבלתם תשקצו BUT YE SHALL HAVE THEIR CARRION IN ABOMINATION — This serves to include in the category of abominable things יבחושין found in liquids which one has filtered. יבחושין are moucherons in O. F., (English = gnats)."}, {"ch": 11, "v": 12, "aliyah": 6, "heb": "כֹּ֣ל אֲשֶׁ֥ר אֵֽין־ל֛וֹ סְנַפִּ֥יר וְקַשְׂקֶ֖שֶׂת בַּמָּ֑יִם שֶׁ֥קֶץ ה֖וּא לָכֶֽם׃", "onk": "כֹּל דִּי לֵית לֵיהּ צִיצִין וְקַלְפִין בְּמַיָּא שִׁקְצָא הוּא לְכוֹן:", "onk_en": "Anything which does not have fins and scales in the water, is repulsive to you.", "pj": "כָּל דְלֵית לֵיהּ צִיצִין וְחַרְסְפִיתִין בְּמַיָא שִׁיקְצָא הוּא לְכוֹן", "pj_en": "Every one that hath fins nor scales in the waters shall be an abomination to you.", "tj": "", "tj_en": "", "rashi": "<b>כל אשר אין לו וגו'.<\/b> מַה תַּ\"ל? שֶׁיָּכוֹל אֵין לִי שֶׁיְּהֵא מֻתָּר אֶלָּא הַמַּעֲלֶה סִימָנִין שֶׁלּוֹ לַיַּבָּשָׁה, הִשִּׁירָן בַּמַּיִם מִנַּיִן? תַּ\"ל כֹּל אֲשֶׁר אֵין לוֹ סְנַפִּיר וְקַשְׂקֶשֶׂת בַּמַּיִם, הָא אִם הָיוּ לוֹ בַּמַּיִם אַף עַל פִּי שֶׁהִשִּׁירָן בַּעֲלִיָּתוֹ מֻתָּר (ספרא):", "rashi_en": "'כל אשר אין לו וגו‎ WHATEVER HATH NO [FINS] etc. — For what purpose is this repeated? Because I might think that in verse 9 I have only the law that permits the eating of a fish which brings up its signs of cleanness (i. e. fins and scales) to dry land. Whence, however, could I learn that if it sheds them whilst it is in the waters such is also permitted as food? Therefore it states here: whatever hath no fins and scales in the water [that shall be an abomination to you]”. Thus, if it did have them whilst it was in the water, even though it shed them when it came up on dry land, it is permissible as food! (Sifra, Shemini, Section 3 11)."}, {"ch": 11, "v": 13, "aliyah": 6, "heb": "וְאֶת־אֵ֙לֶּה֙ תְּשַׁקְּצ֣וּ מִן־הָע֔וֹף לֹ֥א יֵאָכְל֖וּ שֶׁ֣קֶץ הֵ֑ם אֶת־הַנֶּ֙שֶׁר֙ וְאֶת־הַפֶּ֔רֶס וְאֵ֖ת הָעׇזְנִיָּֽה׃", "onk": "וְיָת אִלֵּין תַּשַׁקְּצוּן מִן עוֹפָא לָא יִתְאַכְלוּן שִׁקְצָא אִנּוּן נִשְׁרָא וְעַר וְעַזְיָא:", "onk_en": "These you shall consider repulsive from among the fowl; they may not be eaten; they are repulsive: the eagle, the white-tailed eagle and the bearded vulture.", "pj": "וְיַת אִלֵין מִינַיָיא תְּשַׁקְצוּן מִן עוֹפָא דְלֵית לְהוֹן צִיבְעָא יְתֵירָא וּדְלֵית לֵיהּ זְפַקְתָּא וּדְקוּרְקְבָנֵיהּ לֵיתוֹי מַקְלִיף לָא יִתְאַכְלוּן שִׁיקְצָא הִינוּן יַת נִישְׁרָא וְיַת עוּזָא וְיַת בַּר גַזָא", "pj_en": "And these kinds of birds must be abominated: those not a finger long, or that have no vesicle (zephaq), or whose crop (kurkeban, ingluvies) peeleth not away, are not to be eaten they are abomination; the eagle, the black eagle, and the osprey,", "tj": "", "tj_en": "", "rashi": "<b>לא יאכלו.<\/b> לְחַיֵּב אֶת הַמַּאֲכִילָן לִקְטַנִּים, שֶׁכָּךְ מַשְׁמָעוֹ לֹא יְהוּ נֶאֱכָלִין עַל יָדְךָ, אוֹ אֵינוֹ אֶלָּא לְאָסְרָן בַּהֲנָאָה? תַּ\"ל לֹא תֹאכְלוּם — בַּאֲכִילָה אֲסוּרִין בַּהֲנָאָה מֻתָּרִין; כָּל עוֹף שֶׁנֶּאֱמַר בּוֹ לְמִינָהּ, לְמִינוֹ, לְמִינֵהוּ, יֵשׁ בְּאוֹתוֹ הַמִּין שֶאֵין דּוֹמִין זֶה לָזֶה לֹא בְמַרְאֵיהֶם וְלֹא בִשְׁמוֹתָם וְכֻלָּן מִין אֶחָד:", "rashi_en": "לא יאכלו THEY (the fowls to be mentioned) SHALL NOT BE EATEN — The prohibition is put in this form and not in the words “Ye shall not eat them” (v. 42) to declare liable to punishment those who give them as food to minors, the latter themselves not being liable, for the following is what it implies: They shall not be eaten through any act of yours. But perhaps this is not the meaning, but the words are intended to prohibit any beneficial use to be made of them?   It says, however, in reference to a similar case (v. 42) “Ye shall not eat them” — for eating they are forbidden, for any other use they are permitted! And the same is the case here (cf. Sifra, Shemini, Chapter 5 1; Zevachim 114a). — In reference to every fowl of which it is stated למינהו ,למינו ,למינה, “after its kind”, there are in that species some that are not alike one to the other either in their color or in the names they bear, and yet they are all one species."}, {"ch": 11, "v": 14, "aliyah": 6, "heb": "וְאֶ֨ת־הַדָּאָ֔ה וְאֶת־הָאַיָּ֖ה לְמִינָֽהּ׃", "onk": "וְדַיְתָא <b>וְטָרָפִיתָא<\/b> לִזְנַהּ:", "onk_en": "The falcon and the [<b>tearing<\/b>] vulture, to its kind.", "pj": "וְיַת דַיְיתָא וְיַת דַחְיָיא טַרְפִיתָא לִזְנָהּ", "pj_en": "and the kite, and the vulture after his kind,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 15, "aliyah": 6, "heb": "אֵ֥ת כׇּל־עֹרֵ֖ב לְמִינֽוֹ׃", "onk": "יָת כָּל עוּרְבָא לִזְנֵיהּ:", "onk_en": "Every raven, to its kind.", "pj": "וְיַת כָּל עוֹרְבָא לִזְנֵיהּ", "pj_en": "and every raven after his kind,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 16, "aliyah": 6, "heb": "וְאֵת֙ בַּ֣ת הַֽיַּעֲנָ֔ה וְאֶת־הַתַּחְמָ֖ס וְאֶת־הַשָּׁ֑חַף וְאֶת־הַנֵּ֖ץ לְמִינֵֽהוּ׃", "onk": "וְיָת בַּת נַעֲמִיתָא וְצִיצָא וְצִפַּר שַׁחְפָּא וְנָצָא לִזְנוֹהִי:", "onk_en": "The ostrich, the owl, the seagull and the sparrow hawk, to its kind.", "pj": "וְיַת בַּת נַעֲמִיתָא וְיַת חַטְפִיתָא וְיַת צִיפַּר שַׁחְפָא וְיַת בַּר נְצָצָא לִזְנֵיהּ", "pj_en": "and the ostrich, and the night raven, and the gull, and the hawk after his kind,", "tj": "", "tj_en": "", "rashi": "<b>הנץ.<\/b> אשפר\"ויר:", "rashi_en": "הנץ — Espervier in O. F., (English = sparrow-hawk)"}, {"ch": 11, "v": 17, "aliyah": 6, "heb": "וְאֶת־הַכּ֥וֹס וְאֶת־הַשָּׁלָ֖ךְ וְאֶת־הַיַּנְשֽׁוּף׃", "onk": "וְקַרְיָא <b>וְשָׁלֵינוּנָא<\/b> וְקִפּוֹפָא:", "onk_en": "The little owl, the cormorant [<b>fish drawer<\/b>] and the eagle owl.", "pj": "וְיַת צַיְירָא וְיַת שְׁלֵינוּנָא מִן יַמָא וְיַת קִיפוּפָא", "pj_en": "and the snatcher of fish from the sea, and the ibis,", "tj": "", "tj_en": "", "rashi": "<b>שלך.<\/b> פֵּרְשׁוּ רַבּוֹתֵינוּ זֶה הַשּׁוֹלֶה דָגִים מִן הַיָּם, וְזֶה שֶׁתִּרְגֵּם אֻנְקְלוֹס וְשָׁלֵי נוּנָא (חולין ס\"ג):<br><br><b>כוס וינשוף.<\/b> הֵם צואי\"טש הַצּוֹעֲקִים בַּלַּיְלָה, וְיֵשׁ לָהֶם לְסָתוֹת כְּאָדָם, וְעוֹד אַחֵר דּוֹמֶה לוֹ שֶׁקּוֹרִין יי\"בו:", "rashi_en": "שלך — Our Rabbis explained that this is a bird that draws up (שלה = שלך) fish out of the sea (Chullin 63a) and that is why Onkelos translates it by ושלי נונא “and that which draws up fishes” (a common heron; according to others a kind of pelican).<br><br>כוס וינשוף — These are chouettes in O. F. that shriek at night (kinds of owl), and have their cheek-bones formed like those of a human being; and there is another bird similar to it which is called hibou in O. F."}, {"ch": 11, "v": 18, "aliyah": 6, "heb": "וְאֶת־הַתִּנְשֶׁ֥מֶת וְאֶת־הַקָּאָ֖ת וְאֶת־הָרָחָֽם׃", "onk": "וּבַוְתָא וְקָאתָא וִירַקְרֵקָא:", "onk_en": "The horned owl, the pelican and the carrion vulture.", "pj": "וְיַת אוּתְיָא וְיַת קָקָא וְיַת שַׁרְקָרְקָא", "pj_en": "and the bustard, and the cuckoo, and the woodpecker,", "tj": "", "tj_en": "", "rashi": "<b>תנשמת.<\/b> הִיא קלב\"א ש\"וריץ, וְדוֹמָה לְעַכְבָּר הַפּוֹרַחַת בַּלַּיְלָה, וְתִנְשֶׁמֶת הָאֲמוּרָה בַּשְּׁרָצִים הִיא דוֹמָה לָהּ וְאֵין לָהּ עֵינַיִם, וְקוֹרִין לָהּ טלפ\"א:", "rashi_en": "תנשמת — This is the chauvesouris in O. F.: it is similar to a mouse which flies about at night (a “bat”). The תנשמת mentioned among the creeping things (v. 30) is somewhat like it but it has no eyes, and it is called “talpa”, (English = mole) (cf. Chullin 63a)."}, {"ch": 11, "v": 19, "aliyah": 6, "heb": "וְאֵת֙ הַחֲסִידָ֔ה הָאֲנָפָ֖ה לְמִינָ֑הּ וְאֶת־הַדּוּכִיפַ֖ת וְאֶת־הָעֲטַלֵּֽף׃", "onk": "<b>וְחַוָּרִיתָא<\/b> וְאִבּוּ לִזְנַהּ <b>וְנַגַּר טוּרָא<\/b> וַעֲטַלֵּפָא:", "onk_en": "The [<b>white<\/b>] stork and the heron, to its kind. The hoopoe [<b>mountain splitter<\/b>] and the bat.", "pj": "וְיַת דַיְיתָא חִוָורָתָא וְאַכְמָתָא לִזְנָהּ וְיַת נַגַר טוּרָא וְיַת טַרְפִידָא", "pj_en": "and the white stork, and the black, after his kind and the woodcock, and the bat.", "tj": "", "tj_en": "", "rashi": "<b>החסידה.<\/b> זוֹ דַיָּה לְבָנָה, ציגוני\"א, וְלָמָּה נִקְרָא שְׁמָהּ חֲסִידָה? שֶׁעוֹשָֹׁה חֲסִידוּת עִם חַבְרוֹתֶיהָ בִּמְזוֹנוֹת (שם):<br><br><b>האנפה.<\/b> הִיא דַיָּה רַגְזָנִית, וְנִרְאֶה לִי שֶׁקּוֹרִין אוֹתוֹ הי\"רון:<br><br><b>הדוכיפת.<\/b> תַּרְנְגוֹל הַבָּר, וְכַרְבָּלְתּוֹ כְפוּלָה, וּבְלַעַז הרופ\"א, וְלָמָּה נִקְרָא שְׁמוֹ דּוּכִיפַת? שֶׁ\"הוֹדוֹ כָפוּת\" וְזוֹ הִיא כַּרְבָּלְתוֹ, וְנַגַּר טוּרָא נִקְרָא עַל שֵׁם מַעֲשָׂיו, כְּמוֹ שֶׁפֵּרְשׁוּ רַבּוֹתֵינוּ בְּמַסֶּכֶת גִּטִּין בְּפֶרֶק מִי שֶׁאֲחָזוֹ (גיטין דף ס\"ח):", "rashi_en": "החסידה — This is the white stork, cigogne in old French And why is it called חסידה? Because it deals kindly (חסד) with its fellows in respect to food (Chullin 63a).<br><br>האנפה — This is the hot-tempered דיה, and it seems to me that it is what is called heron. <br><br>הדוכיפת — the wild cock which has a double comb (כרבלת). In O. F., herupé; (English = hoopoe). And why is its name called דוכיפת? Because its ornament (הודו) is tied tegether (כפות): this refers to its comb (which being doubled, appears to be tied up). It is also called נגר טורא, mountain-splitter, because of its doings, just as our Rabbis explained in Tractate Gittin 68b in the chapter commencing שאחזו ‎‎מי. "}, {"ch": 11, "v": 20, "aliyah": 6, "heb": "כֹּ֚ל שֶׁ֣רֶץ הָע֔וֹף הַהֹלֵ֖ךְ עַל־אַרְבַּ֑ע שֶׁ֥קֶץ ה֖וּא לָכֶֽם׃", "onk": "כֹּל רִחֲשָׁא דְעוֹפָא דִּמְהַלֵּךְ עַל אַרְבַּע שִׁקְצָא הוּא לְכוֹן:", "onk_en": "All winged insects that walk on four [legs] are repulsive to you.", "pj": "וְכָל רִיחֲשָׁא דְעוֹפָא דִמְהַלֵךְ עַל אַרְבַּע זְנֵי דְיַבְּבֵי וּזְנֵי אוֹזְפֵיהּ וּזְנֵי זִיבּוֹרֵי שִׁיקְצָא הוּא לְכוֹן בְּרַם דוּבְשָׁא דְזִיבּוֹרָא יִתְאָכֵיל", "pj_en": "And every flying reptile that goeth upon four, the fly species, the wasp (or hornet) species, and the bee species shall be an abomination to you: nevertheless of honey of the bee you may eat.", "tj": "", "tj_en": "", "rashi": "<b>שרץ העוף.<\/b> הֵם הַדַּקִּים הַנְּמוּכִים הָרוֹחֲשִׁין עַל הָאָרֶץ, כְּגוֹן זְבוּבִים וּצְרָעִין וְיַתּוּשִׁין וַחֲגָבִים:", "rashi_en": "העוף ‎שרץ PROLIFIC CREATURES AMONGST FOWL — These are the thin, lowly creatures which move upon the ground, such as flies and hornets and gnats and grasshoppers (cf. Rashi on Genesis 1:20)."}, {"ch": 11, "v": 21, "aliyah": 6, "heb": "אַ֤ךְ אֶת־זֶה֙ תֹּֽאכְל֔וּ מִכֹּל֙ שֶׁ֣רֶץ הָע֔וֹף הַהֹלֵ֖ךְ עַל־אַרְבַּ֑ע אֲשֶׁר־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[ל֤וֹ]<\/span> <span class=\"mam-kq-k\">(לא)<\/span><\/span> כְרָעַ֙יִם֙ מִמַּ֣עַל לְרַגְלָ֔יו לְנַתֵּ֥ר בָּהֵ֖ן עַל־הָאָֽרֶץ׃", "onk": "בְּרַם יָת דֵּין תֵּיכְלוּן מִכֹּל רִחֲשָׁא דְעוֹפָא דִּמְהַלֵּךְ עַל אַרְבַּע דִּי לֵיהּ קַרְצוּלִין מֵעִלָּוֵי רַגְלוֹהִי לְקַפָּצָא בְהוֹן עַל אַרְעָא:", "onk_en": "However, these you may eat of all the flying insects that walk on four [legs], those which have knees extending above their legs so that it hops on the ground with them.", "pj": "בְּרַם יַת דֵין תֵּיכְלוּן מִן כָּל רִיחֲשָׁא דְעוֹפָא דִמְהַלֵךְ עַל אַרְבַּע כָּל דְאִית לֵיהּ קַרְסוּלִין מִלְעֵיל לְרִיגְלוֹי לְמֵישְׁרָג בְּהוֹן עַל אַרְעָא", "pj_en": "So also of these you may eat, of every flying reptile that goeth upon four; every one that hath joints above his feet to leap therewith upon the ground.", "tj": "", "tj_en": "", "rashi": "<b>על ארבע.<\/b> עַל אַרְבַּע רַגְלָיִם:<br><br><b>ממעל לרגליו.<\/b> סָמוּךְ לְצַוָּארוֹ יֵשׁ לוֹ כְּמִין שְׁתֵּי רַגְלַיִם לְבַד אַרְבַּע רַגְלָיו, וּכְשֶׁרוֹצֶה לָעוּף וְלִקְפֹּץ מִן הָאָרֶץ מִתְחַזֵּק בְּאוֹתָן שְׁנֵי כְרָעַיִם וּפוֹרֵחַ, וְיֵשׁ הַרְבֵּה — כְּאוֹתָן שֶׁקּוֹרִין לנגו\"שטא — אֲבָל אֵין אָנוּ בְקִיאִין בָּהֶן, שֶׁאַרְבָּעָה סִימָנֵי טָהֳרָה נֶאֶמְרוּ בָהֶם אַרְבַּע רַגְלַיִם וְאַרְבַּע כְּנָפַיִם וְקַרְסוּלִין — אֵלּוּ כְרָעַיִם הַכְּתוּבִים כָּאן — וּכְנָפָיו חוֹפִין אֶת רֻבּוֹ, וְכָל סִימָנִין הַלָּלוּ מְצוּיִים בְּאוֹתָן שֶׁבֵּינוֹתֵינוּ, אֲבָל יֵשׁ שֶׁרֹאשָׁן אָרֹךְ וְיֵשׁ שֶׁאֵין לָהֶם זָנָב, וְצָרִיךְ שֶׁיְּהֵא שְׁמוֹ חָגָב, וּבָזֶה אֵין אָנוּ יוֹדְעִים לְהַבְדִּיל בֵּינֵיהֶן:", "rashi_en": "על ארבע means UPON FOUR legs.<br><br>ממעל לרגליו ABOVE ITS FEET — Quite close to its neck it has something like two feet, in addition to its real feet; when it wants to fly and to spring off the ground it presses itself strongly on the ground with those two knees and so it flies. There are many of these, such, as those which we call longouste (sea-locusts), but we are not expert in regard to them, — as to which we are not permitted as food, — because four characteristic marks of cleanness are mentioned by our Rabbis in respect to them, viz., four feet, four wings, and קרסולים, i. e. the כרעים mentioned here, and that their wings cover the greater part of them. All these characteristics are present in these which are found amongst us, but there are some of them which have a long head and there are some which have no tail, matters which do not affect the question of cleanness (Chullin 59a). It is, however, necessary in order that they shall belong to the clean species that they should bear the name חגב (Chullin 55b), and in this respect we do not know how to distinguish one from another [i. e. we have no tradition as regards to these locusts whether they belong to the species which was in olden (Talmudic) times called חגב or not, and consequently in spite of the other four marks of cleanness we cannot distinguish them from unclean locusts which also show the same marks but are unclean because they do not bear the name חגב]."}, {"ch": 11, "v": 22, "aliyah": 6, "heb": "אֶת־אֵ֤לֶּה מֵהֶם֙ תֹּאכֵ֔לוּ אֶת־הָֽאַרְבֶּ֣ה לְמִינ֔וֹ וְאֶת־הַסׇּלְעָ֖ם לְמִינֵ֑הוּ וְאֶת־הַחַרְגֹּ֣ל לְמִינֵ֔הוּ וְאֶת־הֶחָגָ֖ב לְמִינֵֽהוּ׃", "onk": "יָת אִלֵּין מִנְּהוֹן תֵּיכְלוּן יָת גּוֹבָא לִזְנַהּ וְיָת רָשׁוּנָא לִזְנוֹהִי וְיָת חַרְגּוֹלָא לִזְנוֹהִי וְיָת חֲגָבָא לִזְנוֹהִי:", "onk_en": "Of them, these you may eat; the locust, to its kind the <i>solom<\/i>-locust, to its kind, the grasshopper, to its kind and the <i>chogov<\/i>-hopper, to its kind.", "pj": "יַת אִלֵין מִינַיָיא מִנְהוֹן תֵּיכְלוּן יַת גוּבָאֵי לִזְנֵיהּ וְיַת רְשׁוּנָא לִזְנֵיהּ וְיַת נִיפוֹלָא לִזְנֵיהּ וְיַת כַּרְזְבָא דְהוּא נִדוּנָא לִזְנֵיהּ", "pj_en": "Of these kinds of them you may eat: the wingless locust after his kind, and the bald locust after his kind, the serpent-killer after his kind, and the karzeba, which is the palmerworm, after his kind.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 23, "aliyah": 6, "heb": "וְכֹל֙ שֶׁ֣רֶץ הָע֔וֹף אֲשֶׁר־ל֖וֹ אַרְבַּ֣ע רַגְלָ֑יִם שֶׁ֥קֶץ ה֖וּא לָכֶֽם׃", "onk": "וְכֹל רִחֲשָׁא דְעוֹפָא דִּי לֵיהּ אַרְבַּע רַגְלִין שִׁקְצָא הוּא לְכוֹן:", "onk_en": "All flying insects that have four feet are repulsive to you.", "pj": "וְכָל רִיחֲשָׁא דְעוֹפָא דְלֵיהּ אַרְבַּע רִיגְלִין שִׁיקְצָא הוּא לְכוֹן", "pj_en": "But all flying reptiles which have four feet are to be an abomination to you;", "tj": "", "tj_en": "", "rashi": "<b>וכל שרץ העוף וגו'.<\/b> בָּא וְלִמֵּד שֶׁאִם יֵשׁ לוֹ חָמֵשׁ טָהוֹר (ספרא):", "rashi_en": "'וכל שרץ העוף וגו‎ BUT ALL PROLIFIC CREATURES AMONG FOWL etc. — This repetition of the statement already made in verse 20 is intended to teach that if it has five feet it is clean (Sifra, Shemini, Chapter 5 10)."}, {"ch": 11, "v": 24, "aliyah": 6, "heb": "וּלְאֵ֖לֶּה תִּטַּמָּ֑אוּ כׇּל־הַנֹּגֵ֥עַ בְּנִבְלָתָ֖ם יִטְמָ֥א עַד־הָעָֽרֶב׃", "onk": "וּלְאִלֵּין תִּסְתָּאָבוּן כָּל דְּיִקְרַב בִּנְבִלְתְּהוֹן יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "As for these, [animals], you can be made unclean; all those who touch their carcasses shall be unclean until the evening.", "pj": "וּלְאִלֵין תִּסְתַּאֲבוּן כָּל דְיִקְרַב בִּנְבֵילְתְּהוֹן יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "and by them you would be defiled: whosoever toucheth their carcase shall be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>ולאלה.<\/b> הָעֲתִידִין לֵאָמֵר בָּעִנְיָן לְמַטָּה.<br><br><b>תטמאו.<\/b> כְּלוֹמַר בִּנְגִיעָתָם יֵשׁ טֻמְאָה:", "rashi_en": "ולאלה AND TO THESE which are to be mentioned further on in the section, <br><br>תטמאו YE CAN BECOME UNCLEAN — that is, by touching them there is uncleanness."}, {"ch": 11, "v": 25, "aliyah": 6, "heb": "וְכׇל־הַנֹּשֵׂ֖א מִנִּבְלָתָ֑ם יְכַבֵּ֥ס בְּגָדָ֖יו וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וְכָל דְּיִטוֹל מִנְּבִלְתְּהוֹן יְצַבַּע לְבוּשׁוֹהִי וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Anyone who carries of their carcasses; shall wash his garments and is unclean until the evening.", "pj": "וְכָל דְיוֹסִיט מִן נְבֵילְתְּהוֹן יְצַבַּע לְבוּשׁוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "Whoever carrieth any of their carcass must wash his clothes and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>וכל הנשא מנבלתם.<\/b> כָּל מָקוֹם שֶׁנֶּאֶמְרָה טֻמְאַת מַשָּׂא, חֲמוּרָה מִטֻּמְאַת מַגָּע, שֶׁהִיא טְעוּנָה כִבּוּס בְּגָדִים (ספרא):", "rashi_en": "וכל הנשא מנבלתם AND WHOSOEVER BEARETH OUGHT OF THE CARRION OF THEM [SHALL BE UNCLEAN UNTIL THE EVEN] — In every passage where there is mentioned uncleanness consequent upon the bearing of anything unclean it is more stringent than uncleanness which is the result of contact, inasmuch as the former requires also the washing of the clothing one happens to wear whilst carrying the unclean thing (Sifra, Shemini, Section 4 8)."}, {"ch": 11, "v": 26, "aliyah": 6, "heb": "לְֽכׇל־הַבְּהֵמָ֡ה אֲשֶׁ֣ר הִוא֩ מַפְרֶ֨סֶת פַּרְסָ֜ה וְשֶׁ֣סַע&thinsp;<b>׀<\/b> אֵינֶ֣נָּה שֹׁסַ֗עַת וְגֵרָה֙ אֵינֶ֣נָּה מַעֲלָ֔ה טְמֵאִ֥ים הֵ֖ם לָכֶ֑ם כׇּל־הַנֹּגֵ֥עַ בָּהֶ֖ם יִטְמָֽא׃", "onk": "לְכָל בְּעִירָא דִּי הִיא סְדִיקָא פַרְסָתָא וְטִלְפִין לֵיתָהָא מַטִּלְפָא <b>וּפִשְׁרָא<\/b> לֵיתָהָא מַסְּקָא מְסַאֲבִין אִנּוּן לְכוֹן כָּל דְּיִקְרַב בְּהוֹן יְהֵי מְסָאָב:", "onk_en": "Thus every animal that has cloven hooves but its hooves are not [completely] split and it does not bring up its cud [<b>dissolved food<\/b>], they are unclean to you; all who touch them shall become unclean.", "pj": "לְכָל בְּעִירָא דְהִיא סְדִיקָא פַרְסָתָא וְטִילְפוּן לַיְתָהּ מְטַלְפָא וּפִישְׁרָא לֵיתָהָא מַסְקָא מְסָאֲבִין הִינוּן לְכוֹן כָּל דְיִקְרַב בְּהוֹן יְהֵי מְסָאָב", "pj_en": "All cattle which divide the hoof, but are not cloven-footed nor throw up the cud, are to be unclean to you any one who toucheth them shall be unclean.", "tj": "", "tj_en": "", "rashi": "<b>מפרסת פרסה ושסע איננה שסעת.<\/b> כְּגוֹן גָּמָל, שֶׁפַּרְסָתוֹ סְדוּקָה לְמַעְלָה אֲבָל לְמַטָּה הִיא מְחֻבֶּרֶת, כָּאן לִמֶּדְךָ שֶׁנִּבְלַת בְּהֵמָה טְמֵאָה מְטַמְּאָה, וּבָעִנְיָן שֶׁבְּסוֹף הַפָּרָשָׁה פֵּרֵשׁ עַל בְּהֵמָה טְהוֹרָה:", "rashi_en": "מפרסת פרסה ושסע איננה שסעת WHICH DIVIDETH THE HOOF AND IS NOT CLOVEN FOOTED, such as the camel, the hoof of which is split on top but is attached below (see Rashi on v. 3); here it tells you that the carcass of an unclean animal causes uncleanness and in the paragraph which is at the end of this section (vv. 39–40) it sets forth the law concerning the carcass of a clean animal."}, {"ch": 11, "v": 27, "aliyah": 6, "heb": "וְכֹ֣ל&thinsp;<b>׀<\/b> הוֹלֵ֣ךְ עַל־כַּפָּ֗יו בְּכׇל־הַֽחַיָּה֙ הַהֹלֶ֣כֶת עַל־אַרְבַּ֔ע טְמֵאִ֥ים הֵ֖ם לָכֶ֑ם כׇּל־הַנֹּגֵ֥עַ בְּנִבְלָתָ֖ם יִטְמָ֥א עַד־הָעָֽרֶב׃", "onk": "וְכֹל דִּמְהַלֵּךְ עַל יְדוֹהִי בְּכָל חַיְתָא דִּמְהַלְכָא עַל אַרְבַּע מְסַאֲבִין אִנּוּן לְכוֹן כָּל דְּיִקְרַב בִּנְבִלְתְּהוֹן יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "All [animals] that walk on their paws among all the living creatures that walk on four legs, they are unclean to you. All who touch their carcasses shall be unclean until the evening.", "pj": "וְכָל דִמְטַיֵיל עַל יְדוֹי בְּכָל חַיְיתָא דִמְהַלְכָא עַל אַרְבַּע מְסָאֲבִין הִינוּן לְכוֹן כָּל דְיִקְרַב בִּנְבֵילְתְּהוֹן יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "Every one that goeth upon his paws of all animals that walk upon four shall be unclean to you.", "tj": "", "tj_en": "", "rashi": "<b>על כפיו.<\/b> כְּגוֹן כֶּלֶב וְדֹב וְחָתוּל:<br><br><b>טמאים הם לכם.<\/b> לְמַגָּע:", "rashi_en": "על כפיו UPON ITS PAWS — such as a dog, bear and cat (which have no hoofs).<br><br>טמאים הם לכם ARE UNCLEAN UNTO YOU, in respect to any contact with them."}, {"ch": 11, "v": 28, "aliyah": 6, "heb": "וְהַנֹּשֵׂא֙ אֶת־נִבְלָתָ֔ם יְכַבֵּ֥ס בְּגָדָ֖יו וְטָמֵ֣א עַד־הָעָ֑רֶב טְמֵאִ֥ים הֵ֖מָּה לָכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּדְיִטּוֹל יָת נְבִלְתְּהוֹן יְצַבַּע לְבוּשׁוֹהִי וִיהֵי מְסָאָב עַד רַמְשָׁא מְסַאֲבִין אִנּוּן לְכוֹן:", "onk_en": "Whoever carries their carcasses shall wash his garments and is unclean until the evening; they are unclean to you.", "pj": "וּדְיוֹסִיט יַת נְבֵילְתְּהוֹן יְצַבַּע לְבוּשׁוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא מְסָאֲבִין הִינוּן לְכוֹן", "pj_en": "Whoever toucheth their carcase shall be unclean until evening. Whoever beareth their carcase shall wash his clothes and be unclean until evening; unclean are they to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 29, "aliyah": 6, "heb": "וְזֶ֤ה לָכֶם֙ הַטָּמֵ֔א בַּשֶּׁ֖רֶץ הַשֹּׁרֵ֣ץ עַל־הָאָ֑רֶץ הַחֹ֥לֶד וְהָעַכְבָּ֖ר וְהַצָּ֥ב לְמִינֵֽהוּ׃", "onk": "וְדֵין לְכוֹן מְסָאָבָא בְּרִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא חֻלְדָא וְעַכְבָּרָא וְצָבָא לִזְנוֹהִי:", "onk_en": "These [also] are unclean to you among all creeping creatures that crawl on the ground; the weasel, the mouse and the toad, to its kind.", "pj": "וְדֵין לְכוֹן דִמְסָאַב דְמֵיהּ וּמַשְׁכֵיהּ וּבִישְרֵיהּ בְּרִיחֲשָׁא דְרָחִישׁ עַל אַרְעָא כִּרְכּוּשְׁתָּא וְעַכְבְּרָא אוּכְמָא וּסְמוֹקָא וְחִיוְרָא וְחַדְרוֹנָא לִזְנוֹי", "pj_en": "And these also to you are such as defile; the blood, the skin, and the flesh of every reptile that creepeth upon the ground: the weasel, the mouse, black, red, and white, and the toad, after his kind;", "tj": "", "tj_en": "", "rashi": "<b>וזה לכם הטמא.<\/b> כָּל טֻמְאוֹת הַלָּלוּ אֵינָן לְאִסּוּר אֲכִילָה אֶלָּא לְטֻמְאָה מַמָּשׁ — לִהְיוֹת טָמֵא בְּמַגָּעָן, וְנֶאֱסַר לֶאֱכֹל תְּרוּמָה וְקָדָשִׁים וְלִכָּנֵס בַּמִּקְדָּשׁ:<br><br><b>החלד.<\/b> מוש\"טילא:<br><br><b>והצב.<\/b> פויי\"ט שֶׁדּוֹמֶה לִצְפַרְדֵּעַ:", "rashi_en": "וזה לכם הטמא THESE ALSO SHALL BE UNCLEAN TO YOU — All these statements regarding uncleanness that follow are not intended as a prohibition against eating them (not as טמאה ,טמא in vv. 4—7 in the beginning of this section which is the result of eating the animals mentioned) but refers to actual uncleanness, — that one becomes unclean by contact with them and is thereby forbidden to eat the heave-offering and the holy sacrifices, and to enter the Sanctuary.<br><br>החלד — moustille in O. F.; (English = weasel).<br><br>והצב — bot in old French; (English = toad), which is like a frog."}, {"ch": 11, "v": 30, "aliyah": 6, "heb": "וְהָאֲנָקָ֥ה וְהַכֹּ֖חַ וְהַלְּטָאָ֑ה וְהַחֹ֖מֶט וְהַתִּנְשָֽׁמֶת׃", "onk": "וְיָלָא וְכֹחָא וְחֻלְטֵיתָא וְחֻמְטָא וְאָשׁוּתָא:", "onk_en": "The hedgehog, the chameleon, the lizard, the slug and the mole.", "pj": "וּמִינְקַת חִיוְיָא וְכוֹחָא וּשְׁמָמִיתָא וְקִיצוֹנָא וְסַלְמַנְדְרָא", "pj_en": "and the sucking serpent, and the chameleon, and the lizard, and the snail, and the salamander.", "tj": "", "tj_en": "", "rashi": "<b>אנקה.<\/b> הרי\"ון:<br><br><b>הלטאה.<\/b> לישרד\"ה:<br><br><b>חמט.<\/b> לימצ\"א:<br><br><b>תנשמת.<\/b> טל\"פא:", "rashi_en": "אנקה hérisson in O. F.; English hedgehog.<br><br>הלטאה — lizard in old French; English lizard.<br><br>חמט — limace in old French: English snail. <br><br>תנשמת — talpa in O. F.; English mole."}, {"ch": 11, "v": 31, "aliyah": 6, "heb": "אֵ֛לֶּה הַטְּמֵאִ֥ים לָכֶ֖ם בְּכׇל־הַשָּׁ֑רֶץ כׇּל־הַנֹּגֵ֧עַ בָּהֶ֛ם בְּמֹתָ֖ם יִטְמָ֥א עַד־הָעָֽרֶב׃", "onk": "אִלֵּין דִּמְסַאֲבִין לְכוֹן בְּכָל רִחֲשָׁא כָּל דְּיִקְרַב בְּהוֹן בְּמוֹתְהוֹן יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "These are unclean to you among all the creeping creatures. Whoever touches them when they are dead shall be unclean until the evening.", "pj": "אִלֵין תְּמַנְיָא מִינַיָיא דִמְסָאָבִין לְכוֹן בְּכָל רִיחֲשָׁא כָּל דְיִקְרַב בְּהוֹן וּבְמוֹשְׁכֵיהוֹן וּבְאַדְמֵיהוֹן יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "These eight kinds are unclean to you among all reptiles: whoever toucheth them, their skin or their blood, shall be unclean until the evening.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 32, "aliyah": 6, "heb": "וְכֹ֣ל אֲשֶׁר־יִפֹּל־עָלָיו֩ מֵהֶ֨ם&thinsp;<small>׀<\/small>&thinsp;בְּמֹתָ֜ם יִטְמָ֗א מִכׇּל־כְּלִי־עֵץ֙ א֣וֹ בֶ֤גֶד אוֹ־עוֹר֙ א֣וֹ שָׂ֔ק כׇּל־כְּלִ֕י אֲשֶׁר־יֵעָשֶׂ֥ה מְלָאכָ֖ה בָּהֶ֑ם בַּמַּ֧יִם יוּבָ֛א וְטָמֵ֥א עַד־הָעֶ֖רֶב וְטָהֵֽר׃", "onk": "וְכֹל דִּי יִפֵּל עֲלוֹהִי מִנְּהוֹן בְּמוֹתְהוֹן יְהֵי מְסָאָב מִכָּל מָאן דְּאָעָא אוֹ לְבוּשׁ אוֹ מְשַׁךְ אוֹ שָׂק כָּל מָאן דִּי תִתְעֲבֵד עִבִידָא בְּהוֹן בְּמַיָּא יִתָּעַל וִיהֵי מְסָאָב עַד רַמְשָׁא וְיִדְכֵּי:", "onk_en": "Everything, wherever a part of them may fall when they are dead, shall become unclean, such as a wooden vessel, or a garment, or a hide or a sack. Every vessel with which work is done, shall be brought [put] into water, and remains unclean until the evening, [then] it becomes clean.", "pj": "וְכָל מִדַעַם דְיִפּוֹל עֲלוֹי מִנְהוֹן בְּמוֹתְהוֹן דְאֵיבָרַיָא דִידְהוֹן דְאִיתְפְּשַׁח מִנְהוֹן יְהֵי מְסָאָב כָּל מָאן דְקֵיסָא אוֹ לְבוּשׁ אוֹ צַלָא אוֹ שַק כָּל מָאן דְתִתְעֲבִיד בְּהוֹן עִיבִידְתָּא בְּאַרְבְּעִין סָאוִוין דְמוֹי יִתְעַל וִיהֵי מְסָאָב לְכָל צְרוֹךְ עַד רַמְשָׁא וְיִדְכֵּי", "pj_en": "And whatever upon which any part of their dead body may fall, as their members when separated from them, shall be unclean; every vessel of wood, or garment, or leather, or sack, anything in which work is done, in four measures of water it shall be dipped, and be unclean for use until evening, when it shall be purified.", "tj": "", "tj_en": "", "rashi": "<b>במים יובא.<\/b> וְאַף לְאַחַר טְבִילָתוֹ טָמֵא הוּא לִתְרוּמָה:<br><br><b>עד הערב.<\/b> וְאַחַ\"כַּ <b>וטהר<\/b> בְּהַעֲרֵב הַשֶּׁמֶשׁ:", "rashi_en": "במים יובא IT MUST BE PUT INTO WATER — but even after it has been immersed, טמא IT IS UNCLEAN in respect to using it to hold the heave - offering,<br><br>עד הערב UNTIL THE EVENING,  AND — afterwards  — וטהר  IT BECOMETH CLEAN at the setting of the sun (Yevamot 75a)."}, {"ch": 11, "v": 33, "aliyah": 7, "heb": "וְכׇ֨ל־כְּלִי־חֶ֔רֶשׂ אֲשֶׁר־יִפֹּ֥ל מֵהֶ֖ם אֶל־תּוֹכ֑וֹ כֹּ֣ל אֲשֶׁ֧ר בְּתוֹכ֛וֹ יִטְמָ֖א וְאֹת֥וֹ תִשְׁבֹּֽרוּ׃", "onk": "וְכָל מָאן דַּחֲסַף דִּי יִפֵּל מִנְּהוֹן לְגַוֵּיהּ כֹּל דִּי בְגַוֵּיהּ יִסְתָּאַב וְיָתֵיהּ תְּתַבְּרוּן:", "onk_en": "Every earthen vessel into which a part of them may fall, everything that is within it becomes unclean, and you shall break it.", "pj": "וּמָאן דְפָחַר דְיַפִּיל מִנְהוֹן לְגַוֵיהּ כָּל מָאן דִי בְּגַוֵיהּ יְהֵי מְסָאָב וְיָתֵיהּ תְּשַׁבְּרוּן", "pj_en": "And any earthen vessel into which any of them may fall, any vessel in which they may be, shall be unclean and be broken;", "tj": "", "tj_en": "", "rashi": "<b>אל תוכו.<\/b> אֵין כְּלִי חֶרֶס מִטַּמֵּא אֶלָּא מֵאֲוִירוֹ (חולין כ\"ד):<br><br><b>כל אשר בתוכו יטמא.<\/b> הַכְּלִי חוֹזֵר וּמְטַמֵּא מַה שֶּׁבַּאֲוִירוֹ:<br><br><b>ואתו תשברו.<\/b> לִמֵּד שֶׁאֵין לוֹ טָהֳרָה בַּמִּקְוֶה:", "rashi_en": "אל תוכו [AND EVERY EARTHEN VESSEL] WHEREINTO [ANY OF THEM FALLETH SHALL BE UNCLEAN] — An earthen vessel does not become unclean except through the medium of its interior (i. e. only if something unclean is inside it) but not by something unclean touching its exterior) (cf. Chullin 24b).<br><br>כל אשר בתוכו יטמא WHATSOEVER IS INSIDE IT SHALL BE UNCLEAN — the vessel, in turn, renders anything inside it unclean.<br><br>ואתו תשברו AND IT SHALL YE BREAK — This teaches that there is no purification for it by immersion in a ritual bath, (cf. Sifra, Shemini, Section 7 13)."}, {"ch": 11, "v": 34, "aliyah": 7, "heb": "מִכׇּל־הָאֹ֜כֶל אֲשֶׁ֣ר יֵאָכֵ֗ל אֲשֶׁ֨ר יָב֥וֹא עָלָ֛יו מַ֖יִם יִטְמָ֑א וְכׇל־מַשְׁקֶה֙ אֲשֶׁ֣ר יִשָּׁתֶ֔ה בְּכׇל־כְּלִ֖י יִטְמָֽא׃", "onk": "מִכָּל מֵיכְלָא דְּמִתְאֲכֵל דִּי יַעֲלוּן עֲלוֹהִי מַיָּא יְהֵי מְסָאָב וְכָל מַשְׁקֵה דִי יִשְׁתֵּתֵי בְּכָל מָאן יְהֵי מְסָאָב:", "onk_en": "Of all foods that are eaten upon which water comes, shall be unclean. Every beverage that is drunk, in any vessel, shall be impure.", "pj": "מִכָּל מֵיכְלָא דְמִתְאֲכֵיל דִי יֵיעָלוּן עֲלוֹי מוֹי יְהֵי מְסָאָב וְכָל מַשְׁקֵי דְיִשְׁתֵּיתֵי בְּכָל מָאן יְהֵי מְסָאָב", "pj_en": "all food for eating upon which (such) water cometh shall be unclean, and any fluid which is used for drinking in any such vessel shall be unclean.", "tj": "", "tj_en": "", "rashi": "<b>מכל האכל אשר יאכל.<\/b> מוּסָב עַל מִקְרָא הָעֶלְיוֹן: \"כל אשר בתוכו יטמא מִכָּל הָאֹכֶל אֲשֶׁר יֵאָכֵל\" אֲשֶׁר בָּאוּ עָלָיו מַיִם וְהוּא בְּתוֹךְ כְּלִי חֶרֶס הַטָּמֵא יִטְמָא (וְכֵן כָּל מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה בְּכָל כְּלִי וְהוּא בְּתוֹךְ כְּלִי חֶרֶס הַטָּמֵא יִטְמָא). לָמַדְנוּ מִכָּאן דְּבָרִים הַרְבֵּה, לָמַדְנוּ שֶׁאֵין אֹכֶל מֻכְשָׁר וּמְתֻקָּן לְקַבֵּל טֻמְאָה עַד שֶׁיָּבֹאוּ עָלָיו מַיִם פַּעַם אַחַת, וּמִשֶּׁבָּאוּ עָלָיו מַיִם פַּעַם אַחַת מְקַבֵּל טֻמְאָה לְעוֹלָם וַאֲפִלוּ נָגוּב, וְהַיַּיִן וְהַשֶּׁמֶן וְכָל הַנִּקְרָא מַשְׁקֶה מַכְשִׁיר זְרָעִים לְטֻמְאָה כַּמַּיִם, שֶׁכָּךְ יֵשׁ לִדְרֹשׁ הַמִּקְרָא: אֲשֶׁר יָבֹא עָלָיו מַיִם אוֹ כָל מַשְׁקֶה אֲשֶׁר יִשָּׁתֶה בְּכָל כְּלִי, יִטְמָא הָאֹכֶל, וְעוֹד לָמְדוּ רַבּוֹתֵינוּ מִכָּאן שֶׁאֵין וְלַד הַטֻּמְאָה מְטַמֵּא כֵלִים שֶׁכָּךְ שָׁנִינוּ (פסחים פ'), יָכוֹל יְהוּ כָל הַכֵּלִים מִטַּמְּאִין מֵאֲוִיר כְּלִי חֶרֶס תַּ\"ל כֹּל אֲשֶׁר בְּתוֹכוֹ יִטְמָא מִכָּל הָאֹכֶל — אֹכֶל (וּמַשְׁקֶה) מִטַּמֵּא מֵאֲוִיר כְּלִי חֶרֶס וְאֵין כָּל הַכֵּלִים מִטַּמְּאִין מֵאֲוִיר כְּלִי חֶרֶס — לְפִי שֶׁהַשֶּׁרֶץ אַב הַטֻּמְאָה וְהַכְּלִי שֶׁנִּטְמָא מִמֶּנּוּ וְלַד הַטֻּמְאָה, לְפִיכָךְ אֵינוֹ חוֹזֵר וּמְטַמֵּא כֵלִים שֶׁבְּתוֹכוֹ, וְלָמַדְנוּ עוֹד שֶׁהַשֶּׁרֶץ שֶׁנָּפַל לַאֲוִיר הַתַּנּוּר וְהַפַּת בְּתוֹכוֹ וְלֹא נָגַע הַשֶּׁרֶץ בַּפַּת, הַתַּנּוּר רִאשׁוֹן וְהַפַּת שְׁנִיָּה, וְלֹא נֹאמַר רוֹאִין אֶת הַתַּנּוּר כְּאִלּוּ מָלֵא טֻמְאָה וּתְהֵא הַפַּת תְּחִלָּה, שֶׁאִם אַתָּה אוֹמֵר כֵּן, לֹא נִתְמַעֲטוּ כָל הַכֵּלִים מִלִּטַּמֵּא מֵאֲוִיר כְּלִי חֶרֶס, שֶׁהֲרֵי טֻמְאָה עַצְמָהּ נָגְעָה בָּהֶן מִגַּבָּן, וְלָמַדְנוּ עוֹד עַל בִּיאַת מַיִם שֶׁאֵינָהּ מַכְשֶׁרֶת זְרָעִים אֶלָּא אִם כֵּן נָפְלוּ עֲלֵיהֶן מִשֶּׁנִּתְלְשׁוּ, שֶׁאִם אַתָּה אוֹמֵר מְקַבְּלִין הֶכְשֵׁר בִּמְחֻבָּר, אֵין לְךָ שֶׁלֹּא בָאוּ עָלָיו מַיִם, וּמַהוּ אוֹמֵר אֲשֶׁר יָבֹא עָלָיו מַיִם? וְלָמַדְנוּ עוֹד שֶׁאֵין אֹכֶל מְטַמֵּא אֲחֵרִים אֶלָּא אִם כֵּן יֵשׁ בּוֹ כַּבֵּיצָה, שֶׁנֶּאֱמַר אֲשֶׁר \"יֵאָכֵל\" — אֹכֶל הַנֶּאֱכָל בְּבַת אֶחָת, וְשִׁעֲרוּ חֲכָמִים אֵין בֵּית הַבְּלִיעָה מַחֲזִיק יוֹתֵר מִבֵּיצַת תַּרְנְגֹלֶת (ספרא; יומא פ'):", "rashi_en": "מכל האכל אשר יאכל OF ALL THE FOOD WHICH MAY BE EATEN — This is to be connected with the preceding verse (consequently the words ואתו תשברו v. 33 are a parenthesis): “whatsoever is in it shall be unclean”; viz., anything of all food which may be eaten upon which water has once come, if it is in an earthen vessel which is unclean, itself becomes unclean. [And similarly all drink that may be drunk in any vessel, if it is in an earthen vessel that is unclean, itself becomes unclean]. From this we learn several things: we learn that food is not fitted and liable to become unclean until water has once come upon it, and after water has once come on it it can any time after become unclean, and even after it has become dry; that wine and oil and anything which is termed משקה, liquid, (besides the three mentioned, also blood, milk, dew and honey of bees; cf. Mishnah Makhshirin 6:4) makes vegetation fitted to become unclean even as water does, for thus must the verse be expounded: any food upon which there cometh water or any liquid which may be drunk out of any vessel, that food shall become unclean. Further our Rabbis derive from here the law that a “secondary uncleanness” (ולד הטומאה) cannot render “vessels” (a term used to denote anything except food and animate beings) unclean. For thus we read in a Boraitha (Pesachim 20a): One might think, since Scripture states v. 33: anything that is inside it shall be unclean, that all “vessels” that are placed inside an earthen vessel become unclean through the medium of the interior of an earthen vessel (i. e. because they are in contact with the earthen vessel which has itself become unclean through something unclean having been inside it)! It, however, says: all that is within it shall become unclean … of any food etc., — i.e., food [and liquids] may become unclean through the medium of the interior of an unclean earthen vessel, but no “vessels” can become unclean through the medium of the interior of an unclean earthen vessel. Now since a dead שרץ, “reptile” (which causes the uncleanness to the earthen vessel) is a primary source of uncleanness (אב הטומאה) and the object which has been rendered unclean by it (in this case the כלי חרס) is a secondary uncleanness (ולד הטומאה), consequently we have the rule that the latter a secondary uncleanness — cannot in turn render unclean “vessels” which are in it. And we further learn from this (Pesachim 20a) that if a dead reptile (שרץ) falls into the interior of an earthen oven in which there is bread, but the reptile does not come in contact with the bread, the oven becomes a secondary source of uncleanness of the first degree (ראשון לטומאה) and the bread one of the second degree (because the bread only becomes unclean through having come in contact with the oven which is only a secondary source of uncleanness of the first degree, and not a primary source): and we do not say that we regard the oven which contains the primary source as though it were full of uncleanness, and is itself a primary source, so that the bread should be a secondary uncleanness of the first degree (תחלה), as though it had itself touched the primary source; for if you argue so, then any article which is in an earthen vessel is not excluded from becoming unclean through the medium of its interior (whilst we have just stated that “vessels” are excluded — that in such a case they do not become unclean), because you see, if we assume that the whole interior is full of a primary source of uncleanness, it would be as though this uncleanness itself has touched them (the objects) on their outside and then the objects would indeed have become unclean: we, however, have stated that in such a case they do not become unclean; therefore we do not assume that the primary source of uncleanness fills the whole interior: the bread therefore receives the uncleanness not from the carcass but from the oven and is thus a secondary uncleanness of the second degree which does not further transfer its uncleanness to things which have no sacred character. — And we further learn (Chullin 118b; cf. Sifra, Shemini, Section 8 2) in regard to the “coming of water”, that this does not render vegetation fitted to become unclean unless it falls upon them after they have been plucked; because if you say that they (the vegetation) can acquire this fitness whilst still attached to the soil, then the law has no significance at all, for you have no growing vegetation upon which water does not fall at some time or other, and what, then, is the sense of Scripture saying, “upon which water cometh”? — And we further learn (Yoma 80a) that articles of food which are unclean do not render other food unclean unless the former contains at least a volume equal to that of an egg, for it says: “[food] which may be eaten”, i.e. food which may be eaten at one time, and our Rabbis calculated that the gullet does not hold more than a hen’s egg (Sifra, Shemini, Chapter 9 1; cf. also Yoma 80a)."}, {"ch": 11, "v": 35, "aliyah": 7, "heb": "וְ֠כֹ֠ל אֲשֶׁר־יִפֹּ֨ל מִנִּבְלָתָ֥ם&thinsp;<small>׀<\/small>&thinsp;עָלָיו֮ יִטְמָא֒ תַּנּ֧וּר וְכִירַ֛יִם יֻתָּ֖ץ טְמֵאִ֣ים הֵ֑ם וּטְמֵאִ֖ים יִהְי֥וּ לָכֶֽם׃", "onk": "וְכֹל דִּי יִפֵּל מִנְּבִלְתְּהוֹן עֲלוֹהִי יְהֵי מְסָאָב תַּנּוּר וְכִירַיִם יִתָּרְעוּן מְסַאֲבִין אִנּוּן וּמְסַאֲבִין יְהוֹן לְכוֹן:", "onk_en": "Everything upon which any part of their carcasses fall, shall be unclean [even] an oven and a hearth shall be shattered, they are unclean and they shall be unclean to you.", "pj": "וְכָל מִדַעַם דְיַפִּיל מִנְבֵילְתְּהוֹן עֲלוֹי יְהֵי מְסָאָב תַּנוּרִין וְתַפְיַין יִסְתְּרוּן מְסָאָבִין הִינוּן וּמְסָאָבִין יְהוֹן לְכוֹן", "pj_en": "And any thing upon which a part of their carcass may fall shall be unclean, whether ovens or pans they shall be broken, they are defiled and shall be unclean to you.", "tj": "יותץ יִתַּרְעוּן:", "tj_en": "The ovens and pans shall be broken.", "rashi": "<b>תנור וכירים.<\/b> כֵּלִים הַמִּטַּלְטְלִין הֵם, וְהֵן שֶׁל חֶרֶס וְיֵשׁ לָהֶן תָּוֶךְ, וְשׁוֹפֵת עַל נֶקֶב הֶחָלָל אֶת הַקְּדֵרָה, וּשְׁנֵיהֶם פִּיהֶם לְמַעְלָה:<br><br><b>יתץ.<\/b> שֶׁאֵין לִכְלֵי חֶרֶס טָהֳרָה בִּטְבִילָה:<br><br><b>וטמאים יהיו לכם.<\/b> שֶׁלֹּא תֹאמַר מְצֻוֶּה אֲנִי לְנָתְצָם, תַּלְמוּד לוֹמַר וּטְמֵאִים יִהְיוּ לָכֶם — אִם רָצָה לְקַיְּמָן בְּטֻמְאָתָן רַשַּׁאי:", "rashi_en": "תנור וכרים OVEN OR RANGES FOR POTS — These are movable objects, and they are of earthenware, they have an interior and one places the pot over the opening of the hollow space (the cavity); both have their openings on top. <br><br>יתץ SHALL BE BROKEN DOWN — because for an earthenware article there can be no purification by immersion in water.<br><br>וטמאים יהיו לכם AND THEY SHALL BE UNCLEAN TO YOU — In order that you should not say, “I am under a command to break it down”, it therefore states וטמאים יהיו לכם — i. e. if one  wishes to let them remain in their state of uncleanness (when they may still be used for חולין) one has the right to do so (Sifra, Shemini, Chapter 10 10). [יתץ therefore means: “should be broken down”, and the following words signify: “but though they are unclean (וטמאים) they may remain with you ‎(יהיו לכם‎)”]."}, {"ch": 11, "v": 36, "aliyah": 7, "heb": "אַ֣ךְ מַעְיָ֥ן וּב֛וֹר מִקְוֵה־מַ֖יִם יִהְיֶ֣ה טָה֑וֹר וְנֹגֵ֥עַ בְּנִבְלָתָ֖ם יִטְמָֽא׃", "onk": "בְּרַם מַעְיָן וְגוֹב <b>בֵּית כְּנִישׁוּת<\/b> מַיָּא יְהֵי דְכֵי וּדְיִקְרַב בִּנְבִלְתְּהוֹן יְהֵי מְסָאָב:", "onk_en": "However, a well-spring and a pit, a gathering of [<b>place of gathered<\/b>] water, shall be pure. [But] that which touches their carcasses shall be unclean.", "pj": "לְחוֹד עֵינַוָון וְגוֹבִין בֵּית כְּנִישׁוּת מַיָין נַבְעִין יְהֵי דְכֵי בְּרַם דִי יִקְרַב בִּנְבֵילְתְּהוֹן בְּגוֹ מַיָא הָאִילְיֵין יְהֵי מְסָאָב", "pj_en": "But fountains and cisterns, the place of the collection of running waters, shall be clean: but he who toucheth the carcase of any of those things (that may have fallen) into the water shall be unclean.", "tj": "", "tj_en": "", "rashi": "<b>אך מעין ובור מקוה מים.<\/b> הַמְחֻבָּרִים לַקַּרְקַע אֵין מְקַבְּלִין טֻמְאָה, וְעוֹד יֵשׁ לְךָ לִלְמֹד, <b>יהיה טהור<\/b> — הַטּוֹבֵל בָּהֶם מִטֻּמְאָתוֹ:<br><br><b>ונגע בנבלתם יטמא.<\/b> אֲפִלּוּ הוּא בְּתוֹךְ מַעְיָן וּבוֹר וְנוֹגֵעַ בְּטֻמְאָתָם יִטְמָא; שֶׁלֹּא תֹאמַר קַל וָחֹמֶר: אִם מְטַהֵר אֶת הַטְּמֵאִים מִטֻּמְאָתָם קַל וָחֹמֶר שֶׁיַּצִּיל אֶת הַטָּהוֹר מִלִּטַּמֵּא לְכָךְ נֶאֱמַר וְנֹגֵעַ בְּנִבְלָתָם יִטְמָא (נדרים ע\"ה):", "rashi_en": "עין ובור מקוה מים‎אך מ  NEVERTHELESS A FOUNTAIN OR A PIT WHERE THERE IS A GATHERING OF WATERS which are attached to the ground are not receptive of uncleanness (not being included in וכל משקה וגו׳ בכל כלי mentioned in v. 34, since it states here יהיה טהור, it shall remain clean). But you may also give it the meaning: יהיה טהור, he shall be clean i.e. he who immerses himself in them to free himself from his uncleanness.<br><br>ונגע בנבלתם יטמא BUT THAT WHICH TOUCHES THEIR CARRION SHALL BE UNCLEAN — even if one is in the fountain or pit and comes in contact with their uncleanness (their carcasses) he shall be unclean. This is specifically stated in order that you should not argue à fortiori as follows: since it cleanses the unclean from their uncleanness, it follows à fortiori that it will save the clean from becoming unclean, — it stales therefore, “but whoever touches their carrion shall be unclean” (Sifra, Shemini, Section 9 5; Nedarim 75b)."}, {"ch": 11, "v": 37, "aliyah": 7, "heb": "וְכִ֤י יִפֹּל֙ מִנִּבְלָתָ֔ם עַל־כׇּל־זֶ֥רַע זֵר֖וּעַ אֲשֶׁ֣ר יִזָּרֵ֑עַ טָה֖וֹר הֽוּא׃", "onk": "וַאֲרֵי יִפֵּל מִנְּבִלְתְּהוֹן עַל כָּל בַּר זְרַע זֵרוּעַ דִּי יִזְדְּרָע דְּכֵי הוּא:", "onk_en": "If any part of their carcasses falls on any sowing seed that will be planted, it remains [ritually] clean.", "pj": "וַאֲרוּם אִין יַפִּיל מִנְבֵילְתְּהוֹן עַל כָּל זֶרַע זַרְעוֹנִין בְּאוֹרְחָא דִי יִזְדְרַע בְּנוּגְבֵיהּ דְכֵי הוּא", "pj_en": "And if any part of their carcase fall in the way upon seed that is to be sown, that which is sown dry shall be clean;", "tj": "", "tj_en": "", "rashi": "<b>זרע זרוע.<\/b> זְרִיעָה שֶׁל מִינֵי זֵרְעוֹנִין; זֵרוּעַ שֵׁם דָּבָר הוּא, כְּמוֹ וְיִתְּנוּ לָנוּ מִן הַזֵּרֹעִים (דניאל א'):<br><br><b>טהור הוא.<\/b> לִמֶּדְךָ הַכָּתוּב שֶׁלֹּא הֻכְשַׁר וְנִתְקַן לִקָּרוֹת אֹכֶל לְקַבֵּל טֻמְאָה עַד שֶׁיָּבֹאוּ עָלָיו מָיִם:", "rashi_en": "זרע זרוע means seed of any kind of seed-plant. The word זרוע is a noun (not a passive participle, when it would be punctuated ‎זָרוע), like (Daniel 1:12) \"and let them give us of pulse — זֵרוֹעִים\". <br><br>טהור הוא HE SHALL BE CLEAN — Scripture by means of this and the following verse teaches you that it does not become fitted and proper to be termed food and therefore to be receptive of uncleanness, until water comes upon it."}, {"ch": 11, "v": 38, "aliyah": 7, "heb": "וְכִ֤י יֻתַּן־מַ֙יִם֙ עַל־זֶ֔רַע וְנָפַ֥ל מִנִּבְלָתָ֖ם עָלָ֑יו טָמֵ֥א ה֖וּא לָכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲרֵי יִתְיַהֲבוּן מַיָּא עַל בַּר זַרְעָא וְיִפֵּל מִנְּבִלְתְּהוֹן עֲלוֹהִי מְסָאָב הוּא לְכוֹן:", "onk_en": "If water was once placed on seeds and part of their carcasses fall upon them, they are unclean to you.", "pj": "וַאֲרוּם אִין מִתְיְהֵיב מוֹי עַל בַּר זַרְעָא וְיַפִּיל מִנְבֵילְתְּהוֹן עֲלוֹי בְּרוֹטְבֵיהּ מְסָאָב הוּא לְכוֹן", "pj_en": "but if the carcase of any of them fall upon water that is put upon the seed when so wetted, the seed is unclean to you.", "tj": "", "tj_en": "", "rashi": "<b>וכי יתן מים על זרע.<\/b> לְאַחַר שֶׁנִּתְלַשׁ, שֶׁאִם תֹּאמַר יֵשׁ הֶכְשֵׁר בִּמְחֻבָּר, אֵין לְךָ זֶרַע שֶׁלֹּא הֻכְשָׁר (חולין קי\"ח):<br><br><b>מים על זרע.<\/b> בֵּין מַיִם בֵּין שְׁאָר מַשְׁקִין, בֵּין הֵם עַל הַזֶּרַע בֵּין זֶרַע נוֹפֵל לְתוֹכָן, הַכֹּל נִדְרָשׁ בְּתוֹרַת כֹּהֲנִים:<br><br><b>ונפל מנבלתם עליו.<\/b> אַף מִשֶּׁנֻּגַּב מִן הַמַּיִם, שֶׁלֹּא הִקְפִּידָה תוֹרָה אֶלָּא לִהְיוֹת עָלָיו שֵׁם אֹכֶל, וּמִשֶּׁיָּרַד לוֹ הֶכְשֵׁר קַבָּלַת טֻמְאָה פַּעַם אַחַת, שׁוּב אֵינוֹ נֶעֱקָר הֵימֶנּוּ:", "rashi_en": "‎זרע‎‎ ‎על‎‎ מים‎ וכי יתן  BUT IF ANY WATER BE PUT ON THE SEED, after it has been plucked, … it shall be unclean; for if you assert that there can be fitness to receive uncleanness whilst it is still attached to the soil, you will never have any seed which has not become thus fitted (Chullin 118b; cf. Sifra, Shemini, Section 8 2 and Rashi on v. 34).<br><br>מים על זרע WATER ON SEED — whether it be water or any other liquids, whether these are on the seed or the seed falls into them — all this is derived in Torath Cohanim (from the wording) (Sifra, Shemini, Chapter 11 7-10).<br><br>ונפל מנבלתם עליו AND ANY PART O. THEIR CARRION FALL THEREON, even after it has become dry from the water, because the Torah is particular only that the name “food” should be applicable to it. Consequently as soon as the fitness to receive uncleanness has once fallen upon it, it can never again be removed from it even if it becomes dry again (cf. Bava Metzia 22a)."}, {"ch": 11, "v": 39, "aliyah": 7, "heb": "וְכִ֤י יָמוּת֙ מִן־הַבְּהֵמָ֔ה אֲשֶׁר־הִ֥יא לָכֶ֖ם לְאׇכְלָ֑ה הַנֹּגֵ֥עַ בְּנִבְלָתָ֖הּ יִטְמָ֥א עַד־הָעָֽרֶב׃", "onk": "וַאֲרֵי יְמוּת מִן בְּעִירָא דִּי הִיא לְכוֹן לְמֵיכָל דְּיִקְרַב בִּנְבִלְתַּהּ יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "If any animal dies [of those] that are permitted to eat whoever touches its carcass shall be unclean until the evening.", "pj": "וַאֲרוּם אִין יִתְפְּשַׁח אֵיבְרָא וִימוּת מִן בְּעִירָא דַכְיָא דְחַזְיָא לְכוֹן לְמֵיכוֹל דְיִקְרַב בִּנְבֵילְתָּהּ יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And if the limb of any clean beast that you may eat be torn and it die, whosoever toucheth its carcase shall be unclean until the evening.", "tj": "", "tj_en": "", "rashi": "<b>בנבלתה.<\/b> וְלֹא בָעֲצָמוֹת וְגִידִין וְלֹא בַקַּרְנַיִם וּטְלָפַיִם וְלֹא בָעוֹר (ספרא):", "rashi_en": "בנבלתה [HE THAT TOUCHETH] THE CARRION THEREOF [SHALL BE UNCLEAN] — but not if he touches the bones and sinews, nor the horns and claws, and not the hide after these have been removed from the body (Sifra, Shemini, Section 10 5; Chullin 117b)."}, {"ch": 11, "v": 40, "aliyah": 7, "heb": "וְהָֽאֹכֵל֙ מִנִּבְלָתָ֔הּ יְכַבֵּ֥ס בְּגָדָ֖יו וְטָמֵ֣א עַד־הָעָ֑רֶב וְהַנֹּשֵׂא֙ אֶת־נִבְלָתָ֔הּ יְכַבֵּ֥ס בְּגָדָ֖יו וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וּדְיֵכוּל מִנְּבִלְתַּהּ יְצַבַּע לְבוּשׁוֹהִי וִיהֵי מְסָאָב עַד רַמְשָׁא וּדְיִטּוֹל יָת נְבִלְתַּהּ יְצַבַּע לְבוּשׁוֹהִי וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Whoever eats of its carcass shall wash his garments and is unclean until the evening. Whoever carries its carcass shall wash his garments and is unclean until the evening.", "pj": "וּדְיֵכוֹל מִנְבֵילְתָּהּ יְצַבַּע לְבוּשׁוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא וּדְיוֹסִיט יַת נְבֵילְתָּהּ יְצַבַּע לְבוּשׁוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "He who eateth of its carcase shall wash his clothes, and be unclean until the evening; and he who carrieth its carcase shall wash his clothes, and be unclean till evening.", "tj": "", "tj_en": "", "rashi": "<b>והנשא את נבלתה.<\/b> חֲמוּרָה טֻמְאַת מַשָּׂא מִטֻּמְאַת מַגָּע, שֶׁהַנּוֹשֵׂא מְטַמֵּא בְגָדִים, וְהַנּוֹגֵעַ אֵין בְּגָדָיו טְמֵאִין, שֶׁלֹּא נֶאֱמַר בּוֹ יְכַבֵּס בְּגָדָיו:<br><br><b>והאכל מנבלתה.<\/b> יָכוֹל תְּטַמְּאֶנּוּ אֲכִילָתוֹ? כְּשֶׁהוּא אוֹמֵר בְּנִבְלַת עוֹף טָהוֹר (ויקרא כ\"ב) \"נְבֵלָה וּטְרֵפָה לֹא יֹאכַל לְטָמְאָה בָהּ\", בָהּ — אוֹתָהּ מְטַמָּא בְגָדִים בַּאֲכִילָתָהּ וְאֵין נִבְלַת בְּהֵמָה מְטַמָּא בְגָדִים בַּאֲכִילָתָהּ בְּלֹא מַשָּׂא, כְּגוֹן אִם תְּחָבָהּ לוֹ חֲבֵרוֹ בְּבֵית הַבְּלִיעָה, אִם כֵּן מַה תַּ\"ל הָאֹכֵל? לִתֵּן שִׁעוּר לַנּוֹשֵׂא וְלַנּוֹגֵעַ כְּדֵי אֲכִילָה, וְהוּא כַּזַּיִת (ספרא; נדה מ\"ב):<br><br><b>וטמא עד הערב.<\/b> אַף עַל פִּי שֶׁטָּבַל צָרִיךְ הַעֲרֵב שֶׁמֶשׁ:", "rashi_en": "והנשא את נבלתה HE ALSO THAT BEARETH THE CARRION OF IT [SHALL BE UNCLEAN] — The uncleanness resulting from bearing the carrion is more stringent than the uncleanness resulting from contact with it; for he who bears it thereby renders his garments unclean, whilst as for him who touches it his garments do not thereby become unclean, since it does not state regarding him in the preceding verse: “he shall wash his garments” (cf. Rashi on v. 25). <br><br>והאכל מנבלתה AND HE THAT EATETH OF ITS CARRION [… SHALL BE UNCLEAN] — One might think from this statement that the act of eating therefrom makes him unclean! But this is not so because when it states of the carcass of a clean fowl (Leviticus 22:8) “that which dies of itself (נבלה) or that which is torn he shall not eat to defile himself therewith”, we may learn from it: בה “therewith” — only that (the carcass of a clean fowl) makes a person’s clothes unclean by the very act of eating therefrom, but the carcass of cattle does not make a person’s clothes unclean by the very act of eating therefrom if there is no carrying involved, e. g., if another person inserts it into his gullet (for one it not regarded as carrying something which is inside his body). But if this be so, why is it here stated “he that eateth”? In order to prescribe as a minimum for making unclean him who bears or touches such carrion a quantity as much as can be called “eating” viz., a piece as large as an olive (Sifra, Shemini, Section 10 7; Niddah 42b).<br><br>עד הערב ‎‎וטמא AND HE SHALL BE UNCLEAN UNTO THE EVEN — although he may have immersed himself in water he must await sunset before he becomes clean."}, {"ch": 11, "v": 41, "aliyah": 7, "heb": "וְכׇל־הַשֶּׁ֖רֶץ הַשֹּׁרֵ֣ץ עַל־הָאָ֑רֶץ שֶׁ֥קֶץ ה֖וּא לֹ֥א יֵאָכֵֽל׃", "onk": "וְכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא שִׁקְצָא הוּא לָא יִתְאָכֵל:", "onk_en": "Every creeping creature which crawls on the ground is repulsive, it may not be eaten.", "pj": "וְכָל רִיחֲשָׁא דִרְחֵישׁ עַל אַרְעָא שִׁיקְצָא הוּא לָא יִתְאֲכֵיל", "pj_en": "And every reptile that creepeth on the ground is an abomination, it shall not be eaten.", "tj": "", "tj_en": "", "rashi": "<b>השרץ על הארץ.<\/b> לְהוֹצִיא אֶת הַיַּתּוּשִׁין שֶׁבַּכְּלִיסִין וְשֶׁבַּפּוֹלִין, וְאֶת הַזִּיזִין שֶׁבָּעֲדָשִׁים, שֶׁהֲרֵי לֹא שָׁרְצוּ עַל הָאָרֶץ אֶלָּא בְּתוֹךְ הָאֹכֶל, אֲבָל מִשֶּׁיָּצְאוּ לָאֲוִיר וְשָׁרְצוּ הֲרֵי נֶאֱסְרוּ (ספרא; חולין ס\"ז):<br><br><b>לא יאכל.<\/b> לְחַיֵּב עַל הַמַּאֲכִיל כָּאוֹכֵל; וְאֵין קָרוּי שֶׁרֶץ אֶלָּא דָּבָר נָמוּךְ, קְצַר רַגְלַיִם, שֶׁאֵינוֹ נִרְאֶה אֶלָּא כְּרוֹחֵשׁ וְנָד:", "rashi_en": "‎‎‎‏על הארץ ‎ושרץ THAT CREEPETH ON THE EARTH — the law is worded thus in order to exclude the insects in peas and in beans and the mites in lentils, for, you see, these do not move about on the ground but inside the food, but so soon as they have emerged into the air and have moved about they become prohibited to be eaten (Sifra, Shemini, Chapter 12 1; Chullin 67b).<br><br>לא יאכל IT SHALL NOT BE EATEN — This passive form; it shall not become the object of eating, is used to make the liability to punishment fall upon the one who gives these abominable things to others (to‎ minors) to eat just the same as upon him who himself eats them (Sifra, Shemini, Chapter 12 1; cf. Rashi on v. 13). — Only that is called שרץ which is low and has short feet and which seems only to progress by a creeping movement."}, {"ch": 11, "v": 42, "aliyah": 7, "heb": "כֹּל֩ הוֹלֵ֨ךְ עַל־גָּח֜<big>וֹ<\/big>ן וְכֹ֣ל&thinsp;<b>׀<\/b> הוֹלֵ֣ךְ עַל־אַרְבַּ֗ע עַ֚ד כׇּל־מַרְבֵּ֣ה רַגְלַ֔יִם לְכׇל־הַשֶּׁ֖רֶץ הַשֹּׁרֵ֣ץ עַל־הָאָ֑רֶץ לֹ֥א תֹאכְל֖וּם כִּי־שֶׁ֥קֶץ הֵֽם׃", "onk": "כֹּל דִּמְהַלֵּךְ עַל מְעוֹהִי וְכֹל דִּמְהַלֵּךְ עַל אַרְבַּע עַד כָּל סְגִיאוּת רַגְלָאִין לְכָל רִחֲשָׁא דְּרָחֵשׁ עַל אַרְעָא לָא תֵיכְלֻנּוּן אֲרֵי שִׁקְצָא אִנּוּן:", "onk_en": "Whatever crawls on its belly and whatever goes on four [legs] or whatever has many feet; regarding all creeping creatures that crawl on the ground; you may not eat them, for they are repulsive.", "pj": "כָּל דִמְהַלֵךְ עַל מָעוֹי וְכָל דִמְהַלֵךְ עַל אַרְבַּע מִן חִיוְיָא וְעַד נַדַל דְמַסְגֵי רִיגְלִין בְּכָל רִיחֲשָׁא דִרְחֵישׁ עַל אַרְעָא לָא תֵיכְלוּנוּן אֲרוּם שִׁיקְצָא הִינוּן", "pj_en": "And whatever goeth upon its belly, and whatever animal crawleth upon four, from the serpent unto the caterpillar which hath many feet, of any reptile that creepeth upon the ground you may not eat, for they are an abomination.", "tj": "כָּל דִּשְׁחַף עַל מָעוֹי בְּכָל חַיְיתָא:", "tj_en": "Whatsoever writhes upon its belly among all animals.", "rashi": "<b>הולך על גחון.<\/b> זֶה נָחָשׁ, וּלְשׁוֹן גָּחוֹן שְׁחִיָּה, שֶׁהוֹלֵךְ שָׁח וְנוֹפֵל עַל מֵעָיו:<br><br><b>כל הולך.<\/b> לְהָבִיא הַשִּׁלְשׁוּלִין וְאֶת הַדּוֹמֶה לַדּוֹמֶה:<br><br><b>הולך על ארבע.<\/b> זֶה עַקְרָב:<br><br><b>כל.<\/b> לְהָבִיא אֶת הַחִפּוּשִׁית, אשקר\"בוט בְּלַעַז, וְאֶת הַדּוֹמֶה לַדּוֹמֶה:<br><br><b>מרבה רגלים.<\/b> זֶה נַדָּל, שֶׁרֶץ שֶׁיֵּשׁ לוֹ רַגְלַיִם מֵרֹאשׁוֹ וְעַד זְנָבוֹ לְכָאן וּלְכָאן, וְקוֹרִין צינטפי\"דש (ספרא):", "rashi_en": "‎גחון‎ הולך על THAT GOETH ON THE BELLY — This is the serpent (Sifra, Shemini, Chapter 12 2; Chullin 67b), and the expression גחון denotes bending low, so that the phrase means: that which walks bent down and fallen upon its belly.<br><br>כל הולך EVERYTHING THAT GOETH — The word “everything” is employed to include w
