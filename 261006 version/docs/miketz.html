<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>

const DATA = [{"ch": 41, "v": 1, "aliyah": 1, "heb": "וַיְהִ֕י מִקֵּ֖ץ שְׁנָתַ֣יִם יָמִ֑ים וּפַרְעֹ֣ה חֹלֵ֔ם וְהִנֵּ֖ה עֹמֵ֥ד עַל־הַיְאֹֽר׃", "onk": "וַהֲוָה מִסּוֹף תַּרְתֵּין שְׁנִין וּפַרְעֹה חָלֵם וְהָא קָאֵם עַל נַהֲרָא:", "onk_en": "It was at the end of two full years, that Pharaoh had a dream, and behold, he was standing on the bank of the river.", "pj": "ויהי וַהֲוָה מִסוֹף תַּרְתֵּין שְׁנִין עָאל דוּכְרָנָא דְיוֹסֵף קֳדָם מֵימְרָא דַיְיָ וּפַרְעה הֲוָה חָלִים וְהָא קָאִי עַל נַהֲרָא", "pj_en": "It was at the end of two years, that the remembrance of Joseph came before the Word of the Lord. And Pharoh dreamed, and, behold, he stood by the river,", "tj": "", "tj_en": "", "rashi": "<b>ויהי מקץ.<\/b> כְּתַרְגּוּמוֹ מִסּוֹף, וְכָל לְשׁוֹן קֵץ סוֹף הוּא:<br><br><b>על היאר.<\/b> כָּל שְׁאָר נְהָרוֹת אֵינָם קְרוּיִין יְאוֹרִים חוּץ מִנִּילוּס, מִפְּנֵי שֶׁכָּל הָאָרֶץ עֲשׂוּיִם יְאוֹרִים יְאוֹרִים בִּידֵי אָדָם וְנִילוּס עוֹלֶה בְּתוֹכָם וּמַשְׁקֶה אוֹתָם, לְפִי שֶׁאֵין גְּשָׁמִים יוֹרְדִין בְּמִצְרַיִם תָּדִיר כִּשְׁאָר אֲרָצוֹת:", "rashi_en": "ויהי מקץ AND IT CAME TO PASS AT THE END — As the Targum renders it by מסוף “at the end” All forms of the noun קץ signify one end or the other.<br><br>על היאר BY THE RIVER — No other river is called יאר) except the Nile, because the whole country (Egypt) is full of artificially constructed canals (יאורים) and the Nile flows into them and fills them with water, since rain does not fall in Egypt as regularly as in other lands. "}, {"ch": 41, "v": 2, "aliyah": 1, "heb": "וְהִנֵּ֣ה מִן־הַיְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת יְפ֥וֹת מַרְאֶ֖ה וּבְרִיאֹ֣ת בָּשָׂ֑ר וַתִּרְעֶ֖ינָה בָּאָֽחוּ׃", "onk": "וְהָא מִן נַהֲרָא סָלְקָן שְׁבַע תּוֹרָן שַׁפִּירָן לְמֶחֱזֵי וּפַטִּימָן בְּשָׂר וְרָעְיָן בְּאַחֲוָה:", "onk_en": "Behold, from the river emerged seven cows, fine-looking and well-fleshed, and they were grazing in the reed grass.", "pj": "וְהָא מִן נַהֲרָא סַלְקַן שְׁבַע תּוֹרָתֵי שַׁפִּירָן לְמֵיחֲמֵי וּפַטִימָן בִּשְרָא וְרַעֲיָין בְּגוֹי גוּמַיָא", "pj_en": "and, behold, from the river came up seven oxen good-looking and fat-fleshed; and they grazed in the midst of the sedges.", "tj": "וַהֲוָאָה רַעֲיָין בְּגוֹ גוּמַיָא:", "tj_en": "Grazing in the midst of the sedges", "rashi": "<b>יפות מראה.<\/b> סִימָן הוּא לִימֵי שֹׂבַע, שֶׁהַבְּרִיּוֹת נִרְאוֹת יָפוֹת זוֹ לָזוֹ, שֶׁאֵין עֵין בְּרִיָּה צָרָה בַחֲבֶרְתָּהּ:<br><br><b>באחו.<\/b> בָּאֲגַם, מריש\"ק בְּלַעַז, כְּמוֹ יִשְׂגֶּא אָחוּ (איוב ח'):", "rashi_en": "יפות מראה BEAUTIFUL TO THE SIGHT — This was an indication of a period of plenty, when people show themselves well-disposed one to another, for no-one then envies another person’s prosperity (cf. Genesis Rabbah 89:4).<br><br>באחו IN THE REED-GRASS — in the marshy land. old French marais; English, marsh. Similar is (Job 8:11) “Can reed-grass (אחו) grow?”"}, {"ch": 41, "v": 3, "aliyah": 1, "heb": "וְהִנֵּ֞ה שֶׁ֧בַע פָּר֣וֹת אֲחֵר֗וֹת עֹל֤וֹת אַחֲרֵיהֶן֙ מִן־הַיְאֹ֔ר רָע֥וֹת מַרְאֶ֖ה וְדַקּ֣וֹת בָּשָׂ֑ר וַֽתַּעֲמֹ֛דְנָה אֵ֥צֶל הַפָּר֖וֹת עַל־שְׂפַ֥ת הַיְאֹֽר׃", "onk": "וְהָא שְׁבַע תּוֹרָן אָחֳרָנְיָן סָלְקָן בַּתְרֵיהוֹן מִן נַהֲרָא בִּישָׁן לְמֶחֱזֵי וַחֲסִירַן בְּשָׂר וְקָמָן <b>לְקִבְלֵיהוֹן<\/b> דְּתוֹרָן עַל כֵּיף נַהֲרָא:", "onk_en": "And behold, seven other cows emerged after them, from the river, bad-looking and thin-fleshed, and they stood next to [<b>opposite<\/b>] the cows that were [already] on the bank of the river.", "pj": "וְהָא שְׁבַע תּוֹרָתִי חוֹרַנְיַן סַלְקַן מִן נַהֲרָא בִּישָׁן לְמֵיחֲמֵי וְחַסְכָן בְּבִשְרֵיהוֹן וְקָמַן לְקִבְלֵיהוֹן דְתוֹרָתֵי עַל כֵּיף נַהֲרָא", "pj_en": "And, behold, seven other oxen came up from the river, evil-looking and lean in their flesh, and stood by the side of tile oxen on the bank of the river.", "tj": "", "tj_en": "", "rashi": "<b>ודקות בשר.<\/b> טינב\"ש בְּלַעַז, לְשׁוֹן דַּק:", "rashi_en": "ודקות בשר THIN-FLESHED in old French tenuis, meaning thin."}, {"ch": 41, "v": 4, "aliyah": 1, "heb": "וַתֹּאכַ֣לְנָה הַפָּר֗וֹת רָע֤וֹת הַמַּרְאֶה֙ וְדַקֹּ֣ת הַבָּשָׂ֔ר אֵ֚ת שֶׁ֣בַע הַפָּר֔וֹת יְפֹ֥ת הַמַּרְאֶ֖ה וְהַבְּרִיאֹ֑ת וַיִּיקַ֖ץ פַּרְעֹֽה׃", "onk": "וַאֲכָלַן תּוֹרְתָּא בִּישָׁן לְמֶחֱזֵי וַחֲסִירַן בְּשַׂר יָת שְׁבַע תּוֹרְתָּא שַׁפִּירָן לְמֶחֱזֵי וּפַטִּימָתָא וְאִתְּעַר פַּרְעֹה:", "onk_en": "They ate—the bad looking, thin-fleshed cows [then ate] the seven fine looking, healthy cows, and Pharaoh woke up.", "pj": "וְאָכְלָא תוֹרָתֵי דְבִישִׁין לְמֵיחְמֵי וַחֲסִירָן בְּבִשְרֵהוֹן יַת שְׁבַע תּוֹרָתֵי דְשַׁפִּירָן לְמֶחֱמֵי וּפַטִימָתָא וְאִתְעַר פַּרְעה מִדַמְכֵיהּ", "pj_en": "And the evil-looking and lean-fleshed oxen devoured the seven good-looking and fat. And Pharoh awoke from his sleep.", "tj": "", "tj_en": "", "rashi": "<b>ותאכלנה.<\/b> סִימָן שֶׁתְּהֵא כָל שִׂמְחַת הַשָּׂבָע נִשְׁכַּחַת בִּימֵי הָרָעָב:", "rashi_en": "ותאכלנה AND THEY ATE — indicating that all the joy occasioned by the years of plenty would be forgotten in the days of famine. "}, {"ch": 41, "v": 5, "aliyah": 1, "heb": "וַיִּישָׁ֕ן וַֽיַּחֲלֹ֖ם שֵׁנִ֑ית וְהִנֵּ֣ה&thinsp;<b>׀<\/b> שֶׁ֣בַע שִׁבֳּלִ֗ים עֹל֛וֹת בְּקָנֶ֥ה אֶחָ֖ד בְּרִיא֥וֹת וְטֹבֽוֹת׃", "onk": "וּדְמוּךְ וַחֲלַם תִּנְיָנוּת וְהָא שְׁבַע שֻׁבְּלַיָּא סָלְקָן בְּקַנְיָא חַד פַּטִּימָן וְטָבָן:", "onk_en": "He fell asleep and had a second dream. Behold, seven ears of grain [corn] came up on a single stalk, wholesome and good.", "pj": "וְדָמִיךְ וַחֲמָא חֶלְמָא תִּנְיָנוּת וְהָא שִׁבְעָה תּוּבְלֵי סַלְקָן בְּקַנְיָא חָד פַּטִימָן וְטָבָן", "pj_en": "And he slept, and saw a second dream; and, behold, seven ears arose on one stalk, full and good;", "tj": "", "tj_en": "", "rashi": "<b>בקנה אחת.<\/b> טוד\"ל בְּלַעַז:<br><br><b>בריאות.<\/b> שיינ\"ש בְּלַעַז:", "rashi_en": "בקנה אחד ON ONE STALK— Tuyau in old French <br><br>בריאות sains, English HEALTHY. "}, {"ch": 41, "v": 6, "aliyah": 1, "heb": "וְהִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים דַּקּ֖וֹת וּשְׁדוּפֹ֣ת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵיהֶֽן׃", "onk": "וְהָא שְׁבַע שֻׁבְּלַיָּא <b>לָקְיָן וּשְׁקִיפָן<\/b> קִדּוּם צָמְחָן בַּתְרֵיהוֹן:", "onk_en": "And behold, seven ears, thin [<b>smitten<\/b>] and scorched [<b>beaten<\/b>] by the east wind, grew up after them.", "pj": "וְהָא שִׁבְעָה תוּבְלֵי לַקְיַין וּשְׁקִיפַן קִידוּם צָמְחָן בַּתְרֵיהֶן", "pj_en": "and, behold, seven ears, thin and blighted with the east wind, sprang up after them.", "tj": "", "tj_en": "", "rashi": "<b>ושדופת.<\/b> הלייא\"ש בְּלַעַז, שְׁקִיפָן קִדּוּם, חֲבוּטוֹת, לְשׁוֹן מַשְׁקוֹף הֶחָבוּט תָּמִיד עַל יְדֵי הַדֶּלֶת הַמַּכָּה עָלָיו:<br><br><b>קדים.<\/b> רוּחַ מִזְרָחִית, שֶׁקּוֹרִין בי\"סא בְּלַעַז:", "rashi_en": "ושדופת PARCHED old French hales, (i.e. burnt up by the east wind) — But the Targum renders it by שקיפן קדום beaten upon by the east wind (and so burst open). This Aramaic word שקיפן is of the same root as משקוף a lintel, which is beaten continually by the door which knocks against it.<br><br>קדים is THE EAST WIND — called bise in old French "}, {"ch": 41, "v": 7, "aliyah": 1, "heb": "וַתִּבְלַ֙עְנָה֙ הַשִּׁבֳּלִ֣ים הַדַּקּ֔וֹת אֵ֚ת שֶׁ֣בַע הַֽשִּׁבֳּלִ֔ים הַבְּרִיא֖וֹת וְהַמְּלֵא֑וֹת וַיִּיקַ֥ץ פַּרְעֹ֖ה וְהִנֵּ֥ה חֲלֽוֹם׃", "onk": "וּבְלָעָא שֻׁבְּלַיָּא <b>לָקְיָתָא<\/b> יָת שְׁבַע שֻׁבְּלַיָּא פַּטִּימָתָא וּמָלְיָתָא וְאִתְּעַר פַּרְעֹה וְהָא חֶלְמָא:", "onk_en": "The seven thin [<b>smitten<\/b>] ears swallowed the seven wholesome, full ears. Pharaoh woke up, and behold it was a dream.", "pj": "וּבָלְעַן תּוּבְלַיָיא לַקְיָיתָא יַת שְׁבַע תּוּבְלַיָיא פַּטִימָתָא וּמַלְיָתָא וְאִיתְעַר פַּרְעה וְהָא הֲוָה חֵילְמָא", "pj_en": "And the seven thin ears devoured the seven fat and full. And Pharoh awoke, and, behold, it was a dream.", "tj": "", "tj_en": "", "rashi": "<b>הבריאות.<\/b> שיינ\"ש בְּלַעַז:<br><br><b>והנה חלום.<\/b> וְהִנֵּה נִשְׁלַם חֲלוֹם שָׁלֵם לְפָנָיו וְהֻצְרַךְ לְפוֹתְרִים:", "rashi_en": "הבריאות sains in old French; English HEALTHY.<br><br>והנה חלום AND, BEHOLD. IT WAS A DREAM — and behold a whole dream was completed before him (i.e. representation of what was evidently a completed whole had passed before him as a dream during his sleep) and demanded an interpreter."}, {"ch": 41, "v": 8, "aliyah": 1, "heb": "וַיְהִ֤י בַבֹּ֙קֶר֙ וַתִּפָּ֣עֶם רוּח֔וֹ וַיִּשְׁלַ֗ח וַיִּקְרָ֛א אֶת־כׇּל־חַרְטֻמֵּ֥י מִצְרַ֖יִם וְאֶת־כׇּל־חֲכָמֶ֑יהָ וַיְסַפֵּ֨ר פַּרְעֹ֤ה לָהֶם֙ אֶת־חֲלֹמ֔וֹ וְאֵין־פּוֹתֵ֥ר אוֹתָ֖ם לְפַרְעֹֽה׃", "onk": "וַהֲוָה בְצַפְרָא <b>וּמִטַּרְפָּא רוּחֵיהּ<\/b> וּשְׁלַח וּקְרָא יָת כָּל חָרָשֵׁי מִצְרַיִם וְיָת כָּל חַכִּימָהָא וְאִשְׁתָּעִי פַרְעֹה לְהוֹן יָת חֶלְמֵיהּ וְלֵית דְּפָשַׁר יָתְהוֹן לְפַרְעֹה:", "onk_en": "In the morning, he was agitated [<b>his spirit was beaten<\/b>]. He sent and summoned all the wizards of Egypt and all its wise men. Pharaoh related his dream to them, but none could interpret them for Pharaoh.", "pj": "וַהֲוָה בְּצַפְרָא וּמְטַרְפָא רוּחֵיהּ וְשָׁדַר וּקְרָא יַת כָּל חַרְשֵׁי מִצְרָאֵי וְיַת כָּל חַכִּימָהָא וְאִישְׁתָּעֵי פַּרְעה לְהוֹם יַת חֶלְמַיָא וְלָא הֲוָה אֶפְשַׁר לִגְבַר דִי יִפְשַׁר יָתֵיהּ אֲרוּם מִן קֳדָם יְיָ אִסְתַּקֵף מִן בִּגְלַל דִי מָטָא זִמְנֵיהּ דְיוֹסֵף לְמִיפַּק מִן בֵּית אֲסִירֵי", "pj_en": "And in the morning his spirit was troubled, and he sent and called all the magicians of Mizraim and all the wise men; and Pharoh told them the dreams; but no man was able to interpret it; for it was occasioned by the Lord, because the time had come that Joseph should come forth from the house of the bound.", "tj": "", "tj_en": "", "rashi": "<b>ותפעם רוחו.<\/b> וּמִטַּרְפָּא רוּחֵיהּ, מְקַשְׁקֶשֶׁת בְּתוֹכוֹ כְּפַעֲמוֹן; וּבִנְבוּכַדְנֶצַּר אוֹמֵר, וַתִּתְפָּעֶם רוּחוֹ (דניאל ב'), לְפִי שֶׁהָיוּ שָׁם שְׁתֵּי פְעִימוֹת, שִׁכְחַת הַחֲלוֹם וְהַעֲלָמַת פִּתְרוֹנוֹ (בראשית רבה):<br><br><b>חרטמי.<\/b> הַנֵּחָרִים בְּטִימֵי מֵתִים, שֶׁשּׁוֹאֲלִין בַּעֲצָמוֹת. טִימֵי הֵן עֲצָמוֹת בִּלְשׁוֹן אֲרַמִּי, וּבַמִּשְׁנָה בַּיִת שֶׁהוּא מָלֵא טִימַיָּא (אהלות פי\"ז), מָלֵא עֲצָמוֹת:<br><br><b>ואין פותר אותם לפרעה.<\/b> פּוֹתְרִים הָיוּ אוֹתָם, אֲבָל לֹא לְפַרְעֹה, שֶׁלֹּא הָיָה קוֹלָן נִכְנָס בְּאָזְנָיו, וְלֹא הָיָה לוֹ קוֹרַת רוּחַ בְּפִתְרוֹנָם, שֶׁהָיוּ אוֹמְרִים שֶׁבַע בָּנוֹת אַתָּה מוֹלִיד וְשֶׁבַע בָּנוֹת אַתָּה קוֹבֵר (בראשית רבה):", "rashi_en": "ותפעם רוחו HIS SPIRIT WAS TROUBLED — The Targum renders it by “his spirit was agitated” (beaten upon) — it rang within like a bell (פעמון). With regard to Nebuchadnezzar it states (Daniel 2:1) ותתפעם רוחו (the verb in the Hithpael, thus having a double ת), because in that case there were two reasons for perturbation — his forgetting the dream and his ignorance of its interpretation (Genesis Rabbah 89:5).<br><br>חרטמי ENGRAVERS OF HIEROGLYPHICS — It is a compound word הנחרים בטימי those who excite themselves by means of the bones of the dead — because they enquire of the dead. טימי used in this phrase means bones in Aramaic. In the Misnna we have (Mishnah Oholot 17:3) “a house that is full of טמיא” — full of bones.<br><br>ואין פותר אותם לפרעה AND THERE WAS NONE THAT COULD INTERPRET IT TO PHARAOH — There were, indeed, some who interpreted it, but not in reference to Pharaoh (לפרעה) (i.e., their interpretations had no reference to him as a Pharaoh, as a king), so that their words found no acceptance by him and he was not satisfied with their interpretation. They said: “You will beget seven daughters and you will bury seven daughters” (Genesis Rabbah 89:6). "}, {"ch": 41, "v": 9, "aliyah": 1, "heb": "וַיְדַבֵּר֙ שַׂ֣ר הַמַּשְׁקִ֔ים אֶת־פַּרְעֹ֖ה לֵאמֹ֑ר אֶת־חֲטָאַ֕י אֲנִ֖י מַזְכִּ֥יר הַיּֽוֹם׃", "onk": "וּמַלִּיל רַב שָׁקֵי (עִם) לְפַרְעֹה לְמֵימָר יָת סָרְחָנִי אֲנָא מַדְכַּר יוֹמָא דֵין:", "onk_en": "The chief butler spoke to Pharaoh saying, I recall my sins today:", "pj": "וּמַלֵיל רַב מְזוֹגַיָא קֳדָם פַּרְעה לְמֵימַר יַת סוֹרְחָנִי אֲנָא מַדְכַּר יוֹמָא דֵין", "pj_en": "And the chief of the cup-bearers spake before Pharoh, saying, My faults do I remember this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 10, "aliyah": 1, "heb": "פַּרְעֹ֖ה קָצַ֣ף עַל־עֲבָדָ֑יו וַיִּתֵּ֨ן אֹתִ֜י בְּמִשְׁמַ֗ר בֵּ֚ית שַׂ֣ר הַטַּבָּחִ֔ים אֹתִ֕י וְאֵ֖ת שַׂ֥ר הָאֹפִֽים׃", "onk": "פַּרְעֹה רְגֵז עַל עַבְדוֹהִי וִיהַב יָתִי בְּמַטְּרַת בֵּית רַב קָטוֹלַיָּא יָתִי וְיָת רַב נַחְתּוֹמֵי:", "onk_en": "Pharaoh was enraged at his servants, and he placed me under guard in the house of the chief executioner; me and the chief baker.", "pj": "מִן קֳדָם יְיָ אִסְתַּקֵף דְפַרְעה רְגֵיז עַל עַבְדוֹי וִיהַב יָתִי בְּמַטְרָא בֵּי רַב סַפּוֹקְלַטוֹרְיָא יָתִי וְיַת רַב נַחְתּוֹמָא", "pj_en": "It was occasioned from the Lord that Pharoh was angry with his servants, and he put me in ward in the house of the chief executioner, me and the chief baker.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 11, "aliyah": 1, "heb": "וַנַּֽחַלְמָ֥ה חֲל֛וֹם בְּלַ֥יְלָה אֶחָ֖ד אֲנִ֣י וָה֑וּא אִ֛ישׁ כְּפִתְר֥וֹן חֲלֹמ֖וֹ חָלָֽמְנוּ׃", "onk": "וַחֲלֵמְנָא חֶלְמָא בְּלֵילְיָא חַד אֲנָא וָהוּא גְּבַר כְּפִשְׁרַן חֶלְמֵיהּ חֲלֵמְנָא:", "onk_en": "We had a dream on the same night, I and he, each according to the interpretation of his dream, did we dream.", "pj": "וְחָלַמְנָא חֵילְמָא בְּלֵילְיָא חָד אֲנָא וְהוּא גְבַר חֵילְמֵיהּ וּפוֹשְׁרָן חֶלְמָא דְחַבְרֵיהּ חָלָמְנָא", "pj_en": "And we dreamed a dream in one night I and he; each man his (own) dream, and the interpretation of his companion's dream we dreamed.", "tj": "", "tj_en": "", "rashi": "<b>איש כפתרון חלמו.<\/b> חֲלוֹם הָרָאוּי לַפִּתְרוֹן שֶׁנִּפְתַּר לָנוּ וְדוֹמֶה לוֹ:", "rashi_en": "איש כפתרון חלמו [WE DREAMED] EACH MAN ACCORDING TO THE INTERPRETATION OF HIS DREAM — each of us dreamed a dream that fitted in with the interpretation that was given to us, and was exactly like it (not the kind of irrelevant interpretation offered you by your wise men). "}, {"ch": 41, "v": 12, "aliyah": 1, "heb": "וְשָׁ֨ם אִתָּ֜נוּ נַ֣עַר עִבְרִ֗י עֶ֚בֶד לְשַׂ֣ר הַטַּבָּחִ֔ים וַ֨נְּסַפֶּר־ל֔וֹ וַיִּפְתׇּר־לָ֖נוּ אֶת־חֲלֹמֹתֵ֑ינוּ אִ֥ישׁ כַּחֲלֹמ֖וֹ פָּתָֽר׃", "onk": "וְתַמָּן עִמָּנָא עוּלֵם עִבְרָאָה עַבְדָא לְרַב קָטוֹלַיָּא וְאִשְׁתָּעֵינָא לֵיהּ וּפָשַׁר לָנָא יָת חֶלְמָנָא גְּבַר כְּחֶלְמֵיהּ פָּשָׁר:", "onk_en": "With us there was a lad, a Hebrew, a slave of the chief of the slaughterers. We told him [about our dreams], and he interpreted our dreams, he interpreted each man’s dream accordingly.", "pj": "וְתַמָן עִמָנָא טַלְיָא עִיבְרָאֵי עַבְדָא לְרַב סַפּוֹקְלַטוֹרְיָא וְאִשְׁתָּעִינָא לֵיהּ וּפָשַׁר לָנָא יַת חֵילְמָנָא גְבַר הֵי כְּפוּשְׁרַן חֵילְמֵיהּ פָּשָׁר", "pj_en": "And there was with us a Hebrew youth, a servant of the chief executioner; and we recounted to him, and he explained the dream to us, to each man be explained the interpretation of his dream.", "tj": "", "tj_en": "", "rashi": "<b>נער עברי עבד.<\/b> אֲרוּרִים הָרְשָׁעִים, שֶׁאֵין טוֹבָתָם שְׁלֵמָה, מַזְכִּירוֹ בִּלְשׁוֹן בִּזָּיוֹן:<br><br><b>נער.<\/b> שׁוֹטֶה וְאֵין רָאוּי לִגְדֻלָּה:<br><br><b>עברי.<\/b> אֲפִלּוּ לְשׁוֹנֵנוּ אֵינוֹ מַכִּיר:<br><br><b>עבד.<\/b> וְכָתוּב בְּנִמּוּסֵי מִצְרַיִם שֶׁאֵין עֶבֶד מוֹלֵךְ וְלֹא לוֹבֵשׁ בִּגְדֵי שָׂרִים:<br><br><b>איש כחלמו.<\/b> לְפִי הַחֲלוֹם וְקָרוֹב לְעִנְיָנוֹ:", "rashi_en": "נער עברי עבד A LAD, AN HEBREW, A SLAVE — Cursed be the wicked for the favours they do are never really complete! He mentions him in disparaging language.<br><br>נער a lad, unwise and unfitted for a high position.<br><br>עברי a Hebrew, who does not even know our language;<br><br>עבד a slave — and it is written in the laws of Egypt that a slave may neither become a ruler nor dress in princely robes (Genesis Rabbah 89:7).<br><br>איש כחלמו EACH MAN ACCORDING TO HIS DREAM — He interpreted in accordance with the dream and approximating to its contents. "}, {"ch": 41, "v": 13, "aliyah": 1, "heb": "וַיְהִ֛י כַּאֲשֶׁ֥ר פָּֽתַר־לָ֖נוּ כֵּ֣ן הָיָ֑ה אֹתִ֛י הֵשִׁ֥יב עַל־כַּנִּ֖י וְאֹת֥וֹ תָלָֽה׃", "onk": "וַהֲוָה כְּמָא דִי פָּשַׁר לָנָא כֵּן הֲוָה יָתִי אֲתֵיב עַל שִׁמּוּשִׁי וְיָתֵיהּ צְלָב:", "onk_en": "It came to pass, that as he interpreted for us, so did it occur; he restored me to my position, and him he hanged.", "pj": "וַהֲוָה הֵיכְמָא דְפָשַׁר לָנָא כְּדֵין הֲוָה יָתִי אוֹתִיב בְּמִילֵיהּ עַל סֵדֶר שִׁימוּשֵׁי וְיָתֵיהּ צְלָב", "pj_en": "And even as he interpreted to us so it was; me he restored in his sentence to the order of my service, and him he hanged.", "tj": "", "tj_en": "", "rashi": "<b>השיב על כני.<\/b> פַּרְעֹה, הַנִּזְכָּר לְמַעְלָה, כְּמוֹ שֶׁאָמַר פַּרְעֹה קָצַף עַל עֲבָדָיו; הֲרֵי מִקְרָא קְצַר לָשׁוֹן, וְלֹא פֵּרֵשׁ מִי הֵשִׁיב, לְפִי שֶׁאֵין צָרִיךְ לְפָרֵשׁ; מִי הֵשִׁיב? מִי שֶׁבְּיָדוֹ לְהָשִׁיב, וְהוּא פַּרְעֹה; וְכֵן דֶּרֶךְ כָּל מִקְרָאוֹת קְצָרִים, עַל מִי שֶׁעָלָיו לַעֲשׂוֹת הֵם סוֹתְמִים אֶת הַדָּבָר:", "rashi_en": "השיב על כני HE RESTORED UNTO MY OFFICE — he means Pharaoh who was mentioned before, where it is said (v. 10) “Pharaoh was wroth with his servants”. The phrase is elliptical not stating explicitly who restored, for it is not necessary to state explicitly who restored: obviously he who has the power to restore viz, Pharaoh. This is the ease with all elliptical sentences — they leave the matter indefinite as to who has to do the action (i.e. they omit the subject of the verb). "}, {"ch": 41, "v": 14, "aliyah": 1, "heb": "וַיִּשְׁלַ֤ח פַּרְעֹה֙ וַיִּקְרָ֣א אֶת־יוֹסֵ֔ף וַיְרִיצֻ֖הוּ מִן־הַבּ֑וֹר וַיְגַלַּח֙ וַיְחַלֵּ֣ף שִׂמְלֹתָ֔יו וַיָּבֹ֖א אֶל־פַּרְעֹֽה׃", "onk": "וּשְׁלַח פַּרְעֹה וּקְרָא יָת יוֹסֵף וְאַרְהִיטוֹהִי מִן בֵּית אֲסִירֵי <b>וְסַפַּר<\/b> וְשַׁנִּי כְסוּתֵיהּ וְעַל לְוַת פַּרְעֹה:", "onk_en": "Pharaoh sent and summoned Yoseif. They hurried him out of the dungeon [<b>prison<\/b>], but [Yoseif first] shaved [<b>trimmed his hair<\/b>] and changed his clothes. And then came to Pharaoh.", "pj": "וְשָׁדַר פַּרְעה וּקְרָא יַת יוֹסֵף וְדִילוּגֵיהּ מִן בֵּית אֲסִירֵי וְסַפֵּר וְשַׁנִי כְּסוּתֵיהּ וְעַל לְוַת פַּרְעה", "pj_en": "And Pharoh sent and called Joseph, and hastened him from the prison; and he dressed his hair, and changed his garments, and went unto Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>מן הבור.<\/b> מִן בֵּית הַסֹּהַר שֶׁהוּא עָשׂוּי כְּמִין גֻּמָּא, וְכֵן כָּל בּוֹר שֶׁבַּמִּקְרָא לְשׁוֹן גֻּמָּא הוּא, וְאַף אִם אֵין בּוֹ מַיִם קָרוּי בּוֹר, פוש\"א בְּלַעַז:<br><br><b>ויגלח.<\/b> מִפְּנֵי כְבוֹד הַמַּלְכוּת (בראשית רבה):", "rashi_en": "מן הבור OUT OF THE DUNGEON — from the place of imprisonment which was made as a kind of pit Similarly, wherever בור occurs in Scripture it signifies a pit — even though it does not contain water (for בור is used of a cistern, excavated as a pit out of rocks) it is still called a בור; old French fosse.<br><br>ויגלח AND HE CLIPPED HIS HAIR, out of respect for the king (Genesis Rabbah 89:9). "}, {"ch": 41, "v": 15, "aliyah": 2, "heb": "וַיֹּ֤אמֶר פַּרְעֹה֙ אֶל־יוֹסֵ֔ף חֲל֣וֹם חָלַ֔מְתִּי וּפֹתֵ֖ר אֵ֣ין אֹת֑וֹ וַאֲנִ֗י שָׁמַ֤עְתִּי עָלֶ֙יךָ֙ לֵאמֹ֔ר תִּשְׁמַ֥ע חֲל֖וֹם לִפְתֹּ֥ר אֹתֽוֹ׃", "onk": "וַאֲמַר פַּרְעֹה לְיוֹסֵף חֶלְמָא חֲלֵמִית וּפָשַׁר לֵית לֵיהּ וַאֲנָא שִׁמְעֵית עֲלָךְ לְמֵימַר דְּאַתְּ שָׁמַע חֶלְמָא לְמִפְשַׁר יָתֵיהּ:", "onk_en": "Pharaoh said to Yoseif, I had a dream and there is no one to interpret it. I have heard it said about you that you hear a dream so as to interpret it.", "pj": "וַאֲמַר פַּרְעה לְיוֹסֵף חֶלְמָא חֲלֵימִית וּמַפְשַׁר לֵית יָתֵיהּ וַאֲנָא שְׁמָעִית עֲלָךְ לְמֵימָר אִין אַנְתְּ שְׁמַע חִילְמָא אַנְתְּ פְּשַׁר לֵיהּ", "pj_en": "And Pharoh said to Joseph, I have dreamed a dream, and there is no interpreter for it; and I have heard of thee, saying, that if thou hear a dream thou canst explain it.", "tj": "", "tj_en": "", "rashi": "<b>תשמע חלום לפתר אתו.<\/b> תַּאֲזִין וְתָבִין חֲלוֹם לִפְתֹּר אוֹתוֹ:<br><br><b>תשמע.<\/b> לְשׁוֹן הֲבָנָה וְהַאֲזָנָה, כְּמוֹ שׁוֹמֵעַ יוֹסֵף, אֲשֶׁר לֹא תִשְׁמַע לְשֹׁנוֹ, אנטינ\"דרא בְּלַעַז:", "rashi_en": "תשמע חלום לפתר אותו — means thou payest heed to and UNDERSTANDEST A DREAM TO INTERPRET IT.<br><br>תשמע means understanding and paying heed to. Examples are: (42:23) “Joseph (שומע) understood”; (Deuteronomy 28:49) “[a people] whose tongue thou shalt not understand (תשמע)”. old French entendre."}, {"ch": 41, "v": 16, "aliyah": 2, "heb": "וַיַּ֨עַן יוֹסֵ֧ף אֶת־פַּרְעֹ֛ה לֵאמֹ֖ר בִּלְעָדָ֑י אֱלֹהִ֕ים יַעֲנֶ֖ה אֶת־שְׁל֥וֹם פַּרְעֹֽה׃", "onk": "וַאֲתֵיב יוֹסֵף יָת פַּרְעֹה לְמֵימַר <b>בַּר מִן חָכְמְתִי אֶלָּהֵן מִן קֳדָם<\/b> יְיָ <b>יִתּתַב<\/b> יָת שְׁלָמָא דְפַרְעֹה:", "onk_en": "Yoseif answered Pharaoh, saying, Not I. [<b>from my wisdom but from before<\/b>] God will respond [<b>there be a response<\/b>] to the peace of Pharaoh.", "pj": "וְאָתֵב יוֹסֵף יַת פַּרְעה לְמֵימָר בַּר מִינִי לָא אִית גְבַר דְפָשַׁר חֶלְמִין בְּרַם מִן קֳדָם יְיָ יִתּוֹתַב שְׁלָמָא דְפַרְעה", "pj_en": "And Joseph answered Pharoh, saying, (It is) without me; it is not man who interprets dreams: but from before the Lord shall be an answer of peace unto Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>בלעדי.<\/b> אֵין הַחָכְמָה מִשֶּׁלִּי, אֶלָּא אֱלֹהִים יַעֲנֶה – יִתֵּן עֲנִיָּה בְּפִי – לִשְׁלוֹם פַּרְעֹה:", "rashi_en": "בלעדי NOT I— (the word is compounded of בל and עדי, it does not extend to me) The wisdom to interpret dreams is not my own, but God will answer — He will put in my mouth an answer that will be for Pharaoh’s welfare. "}, {"ch": 41, "v": 17, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר פַּרְעֹ֖ה אֶל־יוֹסֵ֑ף בַּחֲלֹמִ֕י הִנְנִ֥י עֹמֵ֖ד עַל־שְׂפַ֥ת הַיְאֹֽר׃", "onk": "וּמַלִּיל פַּרְעֹה (עִם) לְיוֹסֵף בְּחֶלְמִי הָא אֲנָא קָאֵם עַל כֵּיף נַהֲרָא:", "onk_en": "Pharaoh spoke to Yoseif, In my dream, I was standing on the bank of the river.", "pj": "וּמַלֵיל פַּרְעה עִם יוֹסֵף לְמֵימָר חָמֵי הֲוֵית בְּחֶלְמִי הָא אֲנָא קָאִי עַל כֵּיף נַהֲרָא", "pj_en": "And Pharoh spake with Joseph, saying, I saw in my dream, and, behold, I stood on the bank of the river.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 18, "aliyah": 2, "heb": "וְהִנֵּ֣ה מִן־הַיְאֹ֗ר עֹלֹת֙ שֶׁ֣בַע פָּר֔וֹת בְּרִיא֥וֹת בָּשָׂ֖ר וִיפֹ֣ת תֹּ֑אַר וַתִּרְעֶ֖ינָה בָּאָֽחוּ׃", "onk": "וְהָא מִן נַהֲרָא סָלְקָן שְׁבַע תּוֹרְתָּא פַּטִּימָן בְּשַׂר וְשַׁפִּירָן לְמֶחֱזֵי וְרָעְיָן בְּאַחֲוָה:", "onk_en": "Behold from the river there emerged seven cows, well-fleshed and fine looking, and they were grazing in the reed grass.", "pj": "וְהִנֵה מִן נַהֲרָא סַלְקַן שְׁבַע תּוֹרָתֵי פַּטִימָן בְּשַר וְשַׁפִּירָן לְמֶחְמֵי וְרַעֲיָין בְּגוֹ גוּמַיָא", "pj_en": "And, behold, from the river came up seven oxen, fat-fleshed and goodjlooking, and they grazed in the midst of the sedges.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 19, "aliyah": 2, "heb": "וְהִנֵּ֞ה שֶֽׁבַע־פָּר֤וֹת אֲחֵרוֹת֙ עֹל֣וֹת אַחֲרֵיהֶ֔ן דַּלּ֨וֹת וְרָע֥וֹת תֹּ֛אַר מְאֹ֖ד וְרַקּ֣וֹת בָּשָׂ֑ר לֹֽא־רָאִ֧יתִי כָהֵ֛נָּה בְּכׇל־אֶ֥רֶץ מִצְרַ֖יִם לָרֹֽעַ׃", "onk": "וְהָא שְׁבַע תּוֹרְתָּא אָחֳרָנְיָן סָלְקָן בַּתְרֵיהוֹן חֲסִיכָן וּבִישָׁן לְמֶחֱזֵי לַחֲדָא וַחֲסִירָן בְּשָׂר לָא חֲזֵתִי כְוָתְהֵן בְּכָל אַרְעָא דְמִצְרַיִם לְבִישׁוּ:", "onk_en": "And behold seven other cows emerged after them, poor, very bad-looking and thin-fleshed. I never saw in the entire land of Egypt, such bad looking [cows.]", "pj": "וְהָא שְׁבַע תּוֹרָתֵי חוֹרָנִין סָלְקָן בַּתְרֵיהֶן חֲשִיכָן וּבִישָׁן לְמֶחֱמֵי לַחֲדָא וְחַסְיַין בְּבִישְרֵהוֹן לָא חָמִית דִכְוַותְהוֹן בְּכָל אַרְעָא דְמִצְרַיִם לְבִישׁוּ", "pj_en": "And behold seven other oxen came up after them, wasted, and very eviljlooking, and lean in their flesh. I have not seen the like of them in all the land of Mizraim for badness.", "tj": "", "tj_en": "", "rashi": "<b>דלות.<\/b> כְּחוּשׁוֹת, כְּמוֹ מַדּוּעַ אַתָּה כָּכָה דַּל, דְּאַמְנוֹן (שמואל ב י\"ג):<br><br><b>ורקות בשר.<\/b> כָּל לְשׁוֹן רַקּוֹת שֶׁבַּמִּקְרָא חַסְרֵי בָשָׂר, וּבְלַעַז בלוא\"ש:", "rashi_en": "דלות means LEAN, as (2 Samuel 13:4) “Why art thou thus becoming (דל) lean?” which occurs in the narrative of Amnon.<br><br>ורקות בשר AND LEAN-FLESHED — wherever רקות is found in Scripture it means spare (literally, deficient) of flesh; old French flouet."}, {"ch": 41, "v": 20, "aliyah": 2, "heb": "וַתֹּאכַ֙לְנָה֙ הַפָּר֔וֹת הָרַקּ֖וֹת וְהָרָע֑וֹת אֵ֣ת שֶׁ֧בַע הַפָּר֛וֹת הָרִאשֹׁנ֖וֹת הַבְּרִיאֹֽת׃", "onk": "וַאֲכָלָן תּוֹרְתָּא חֲסִיכָתָא וּבִישָׁתָא יָת שְׁבַע תּוֹרְתָּא קַדְמָיָתָא פַּטִּימָתָא:", "onk_en": "The thin, bad-looking cows, ate the first seven cows, which were the healthy ones.", "pj": "וַאֲכִילָן תּוֹרָתֵי חֲשִכְתָּא וּבִישְׁתָא יַת שְׁבַע תּוֹרָתֵי קַמְיָיתָא וּפַטִימָתָא", "pj_en": "And the wasted and evil oxen devoured the first seven fat oxen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 21, "aliyah": 2, "heb": "וַתָּבֹ֣אנָה אֶל־קִרְבֶּ֗נָה וְלֹ֤א נוֹדַע֙ כִּי־בָ֣אוּ אֶל־קִרְבֶּ֔נָה וּמַרְאֵיהֶ֣ן רַ֔ע כַּאֲשֶׁ֖ר בַּתְּחִלָּ֑ה וָאִיקָֽץ׃", "onk": "וַעֲלָא לִמְעֵיהֶן וְלָא אִתְיְדַע אֲרֵי עַלּוּ לִמְעֵיהֶן וּמֶחֱזֵיהֵן בִּישׁ כַּד בְּקַדְמֵיתָא וְאִתְּעָרִית:", "onk_en": "They came inside them, but it could not be recognized that they had come inside them, [because] their appearance was as bad as it was previously. Then I woke up.", "pj": "וְעָלָא לִמְעֵהֶן וְלָא אִשְׁתְּמוֹדַע אֲרוּם עָלַן לִמְעֵהֶן וּמֶחְמֵיהֶן בִּישׁ הָא כִּדְבְקַדְמֵיתָא וְאִיתְעָרִית", "pj_en": "And they entered into their stomach, but it could not be known that they had entered into their stomach, for their appearance was evil as before; and I awoke.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 22, "aliyah": 2, "heb": "וָאֵ֖רֶא בַּחֲלֹמִ֑י וְהִנֵּ֣ה&thinsp;<b>׀<\/b> שֶׁ֣בַע שִׁבֳּלִ֗ים עֹלֹ֛ת בְּקָנֶ֥ה אֶחָ֖ד מְלֵאֹ֥ת וְטֹבֽוֹת׃", "onk": "וַחֲזֵית בְּחֶלְמִי וְהָא שְׁבַע שֻׁבְּלַיָּא סָלְקָן בְּקַנְיָא חַד מָלְיָן וְטָבָן:", "onk_en": "Then I saw in my dream that behold seven ears of grain [corn], wholesome and good, came up on one stalk.", "pj": "וַחֲמִית בְּחֶלְמִי וְהָא שְׁבַע תּוּבְלִין סַלְקָן בְּקַנְיָא חָד מַלְיָין וְטָבָן", "pj_en": "And I saw in my dream, and, behold, seven ears arose on one stalk, full and good;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 23, "aliyah": 2, "heb": "וְהִנֵּה֙ שֶׁ֣בַע שִׁבֳּלִ֔ים צְנֻמ֥וֹת דַּקּ֖וֹת שְׁדֻפ֣וֹת קָדִ֑ים צֹמְח֖וֹת אַחֲרֵיהֶֽם׃", "onk": "וְהָא שְׁבַע שֻׁבְּלַיָּא נָצָן <b>לָקְיָן שְׁקִיפָן<\/b> קִדּוּם צָמְחָן בַּתְרֵיהוֹן:", "onk_en": "And behold seven ears, shriveled, thin [<b>smitten<\/b>] and scorched [<b>beaten<\/b>] by the east wind, grew up after them.", "pj": "וְהָא שְׁבַע תּוּבְלֵי נָצַן לַקְיַין שְׁקִיפַן קִידוּם צָמָחָן בַּתְרֵיהֶן", "pj_en": "and, behold, seven ears withered, thin,* blighted with the east wind, sprang up after them.", "tj": "", "tj_en": "", "rashi": "<b>צנמות.<\/b> צוּנְמָא בִּלְשׁוֹן אֲרַמִּי סֶלַע, הֲרֵי הֵן כְּעֵץ בְּלִי לִחְלוּחַ וְקָשׁוֹת כְּסֶלַע, וְתַרְגּוּמוֹ נָצָן לָקְיָן, נָצָן – אֵין בָּהֶם אֶלָּא הַנֵּץ, לְפִי שֶׁנִּתְרוֹקְנוּ מִן הַזֶּרַע:", "rashi_en": "צנמות PARCHED — In Aramaic צונמא signifies a rock. They are like wood without moisture and as hard as a rock. But in the Targum it is translated by נצן לקין “their blossom is stricken” — there was nothing in them but the withered blossom, because they were empty of grain). "}, {"ch": 41, "v": 24, "aliyah": 2, "heb": "וַתִּבְלַ֙עְןָ֙ הַשִּׁבֳּלִ֣ים הַדַּקֹּ֔ת אֵ֛ת שֶׁ֥בַע הַֽשִּׁבֳּלִ֖ים הַטֹּב֑וֹת וָֽאֹמַר֙ אֶל־הַֽחַרְטֻמִּ֔ים וְאֵ֥ין מַגִּ֖יד לִֽי׃", "onk": "וּבְלָעָן שֻׁבְּלַיָּא <b>לָקְיָתָא<\/b> יָת שְּׁבַע שֻׁבְּלַיָּא טָבָתָא וַאֲמָרִית לַחֲרָשַׁיָּא וְלֵית דִּי מְחַוֵּי לִי:", "onk_en": "The thin [<b>smitten<\/b>] ears swallowed the seven good ears. I said this to the wizards, but none of them could tell me [its meaning].", "pj": "וּבָלְעָן תּוּבְלַיָא לַקְיָיתָא יַת שְׁבַע תּוּבְלַיָא טַבְתָא וַאֲמָרִית לְחַרְשַׁיָא וְלֵית דְמִתְנֵי לִי", "pj_en": "And the seven thin ears devoured the seven good ears. And I told the magicians, but there is no one who can teach me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 25, "aliyah": 2, "heb": "וַיֹּ֤אמֶר יוֹסֵף֙ אֶל־פַּרְעֹ֔ה חֲל֥וֹם פַּרְעֹ֖ה אֶחָ֣ד ה֑וּא אֵ֣ת אֲשֶׁ֧ר הָאֱלֹהִ֛ים עֹשֶׂ֖ה הִגִּ֥יד לְפַרְעֹֽה׃", "onk": "וַאֲמַר יוֹסֵף לְפַרְעֹה חֶלְמָא פַרְעֹה חַד הוּא יָת דִּי יְיָ עָתִיד לְמֶעְבַּד חַוִּי לְפַרְעֹה:", "onk_en": "Yoseif said to Pharaoh, Pharaoh’s dream is one. What God is about to do, He has told to Pharaoh.", "pj": "וַאֲמַר יוֹסֵף לְפַרְעה חֵילְמָא דְפַרְעה חַד הוּא מַה דַיְיָ עָתִיד לְמֶעֱבַד תָּנֵי לְפַרְעה", "pj_en": "And Joseph said to Pharoh, The dream of Pharoh is one. That which the Lord is about to do He showeth to Pharoh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 26, "aliyah": 2, "heb": "שֶׁ֧בַע פָּרֹ֣ת הַטֹּבֹ֗ת שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְשֶׁ֤בַע הַֽשִּׁבֳּלִים֙ הַטֹּבֹ֔ת שֶׁ֥בַע שָׁנִ֖ים הֵ֑נָּה חֲל֖וֹם אֶחָ֥ד הֽוּא׃", "onk": "שְׁבַע תּוֹרְתָּא טָבָתָא שְׁבַע שְׁנִין אִנּוּן וּשְׁבַע שֻׁבְּלַיָּא טָבָתָא שְׁבַע שְׁנִין אִנּוּן חֶלְמָא חַד הוּא:", "onk_en": "The seven good cows represent seven years, and the seven good ears represent seven years; it is one dream.", "pj": "שְׁבַע תּוֹרָתָן טַבְתָן שְׁבַע שְׁנַיָיא אִינוּן מְבַשְרָן וּשְׁבַע שׁוּבְלַיָא טַבְתָא שְׁבַע שְׁנַיָיא הָאִלֵין אִינוּן מְבַשְרָן חֶלְמָא חַד הוּא", "pj_en": "The seven good oxen announce seven years; and the seven good ears announce also those seven years: the dream is one.", "tj": "", "tj_en": "", "rashi": "<b>שבע שנים ושבע שנים.<\/b> כֻּלָּן אֵינָן אֶלָּא שֶׁבַע, וַאֲשֶׁר נִשְׁנָה הַחֲלוֹם פַּעֲמַיִם, לְפִי שֶׁהַדָּבָר מְזֻמָּן כְּמוֹ שֶׁפֵּרֵשׁ לוֹ בַּסּוֹף <b>ועל השנות החלום וגו'<\/b> בְּשֶׁבַע שָׁנִים הַטּוֹבוֹת נֶאֱמַר <b>הגיד לפרעה<\/b> לְפִי שֶׁהָיָה סָמוּךְ וּבְשֶׁבַע שְׁנֵי רָעָב נֶאֱמַר <b>הראה את פרעה<\/b>, לְפִי שֶׁהָיָה הַדָּבָר מֻפְלָג וְרָחוֹק, נוֹפֵל בּוֹ לְשׁוֹן מַרְאֶה:", "rashi_en": "שבע שנים  ושבע שנים SEVEN YEARS AND SEVEN YEARS —all together they are only seven years (not fourteen); and the reason why the dream was repeated is because the thing is ready to happen as he expressly stated to him afterwards (v. 32) “And for that the dream was doubled etc.” With reference to the seven good years it says (v. 25) “[What He is about to do] God hath declared unto Pharaoh”, because it (that period) was close at hand; whilst in the case of the seven years of famine it states (v. 28) “He hath shown unto Pharaoh” — because this thing was distant and far off (as regards time) the proper word to use in reference to it is “showing”. "}, {"ch": 41, "v": 27, "aliyah": 2, "heb": "וְשֶׁ֣בַע הַ֠פָּר֠וֹת הָֽרַקּ֨וֹת וְהָרָעֹ֜ת הָעֹלֹ֣ת אַחֲרֵיהֶ֗ן שֶׁ֤בַע שָׁנִים֙ הֵ֔נָּה וְשֶׁ֤בַע הַֽשִּׁבֳּלִים֙ הָרֵק֔וֹת שְׁדֻפ֖וֹת הַקָּדִ֑ים יִהְי֕וּ שֶׁ֖בַע שְׁנֵ֥י רָעָֽב׃", "onk": "וּשְׁבַע תּוֹרְתָּא חֲסִיכָתָא וּבִישָׁתָא דְּסָלְקָן בַּתְרֵיהוֹן שְׁבַע (<small>נ\"א<\/small> שַׁבְעָא) שְׁנִין אִנּוּן וּשְׁבַע שֻּׁבְּלַיָּא <b>לָקְיָתָא דִּשְׁקִיפָן<\/b> קִדּוּם יְהֶוְיָן שְׁבַע שְׁנֵי כַפְנָא:", "onk_en": "The seven thin, bad [looking] cows who came up after them, represent seven years, and the seven empty [<b>smitten<\/b>], east wind—scorched [<b>beaten<\/b>] ears, represent the coming of seven years of famine.", "pj": "וּשְׁבַע תּוֹרָתָא כְּחִישְׁתָּא וּבִשְׁתָא דְסַלְקָן בַּתְרֵיהֶן שְׁבַע שְׁנַיָיא חוֹרַנְיָיתָא אִינוּן מְבַשְרָן וּשְׁבַע תּוּבְלַיָיא לַקְיָיתָא שְׁקִיפַן קִידוּם הֵם הָכִי מְבַשְרָן דִיהֶוְוַין שְׁבַע שְׁנֵי כַפְנָא", "pj_en": "And the seven wasted and evil oxen which arose after them announce seven other years; and the seven ears thin and blighted with the east wind likewise make known that there will be seven years of famine.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 28, "aliyah": 2, "heb": "ה֣וּא הַדָּבָ֔ר אֲשֶׁ֥ר דִּבַּ֖רְתִּי אֶל־פַּרְעֹ֑ה אֲשֶׁ֧ר הָאֱלֹהִ֛ים עֹשֶׂ֖ה הֶרְאָ֥ה אֶת־פַּרְעֹֽה׃", "onk": "הוּא פִתְגָּמָא דִּי מַלֵּילִית עִם פַּרְעֹה דִּי יְיָ עָתִיד לְמֶעְבַּד אַחֲזֵי לְפַרְעֹה:", "onk_en": "This is the word that I have spoken to Pharaoh; what God is about to do, He has revealed to Pharaoh.", "pj": "הוּא פִּתְגָמָא דְמַלֵילִית עִם פַּרְעה מַה דַיְיָ עָתִיד לְמֶעֱבַד אַחְמֵי יַת פַּרְעה", "pj_en": "This is the word that I speak to Pharoh: what the Lord is about to do He showeth Pharoh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 29, "aliyah": 2, "heb": "הִנֵּ֛ה שֶׁ֥בַע שָׁנִ֖ים בָּא֑וֹת שָׂבָ֥ע גָּד֖וֹל בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "הָא שְׁבַע שְׁנִין אָתְיָן סִבְעָא (<small>נ\"א<\/small> שַׂבְעָא) רַבָּא בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "Behold, seven years are coming during which there will be great abundance in the entire land of Egypt.", "pj": "הָא שְׁבַע שְׁנַיָיא אַתְיָין שׁוֹבְעָא רַבָּא בְּכָל אַרְעָא דְמִצְרָיִם", "pj_en": "Behold, there come seven years of great plenty in all the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 30, "aliyah": 2, "heb": "וְ֠קָ֠מוּ שֶׁ֜בַע שְׁנֵ֤י רָעָב֙ אַחֲרֵיהֶ֔ן וְנִשְׁכַּ֥ח כׇּל־הַשָּׂבָ֖ע בְּאֶ֣רֶץ מִצְרָ֑יִם וְכִלָּ֥ה הָרָעָ֖ב אֶת־הָאָֽרֶץ׃", "onk": "וִיקוּמוּן שְׁבַע שְׁנֵי כַפְנָא בַּתְרֵיהֶן וְיִתִּנְשֵׁי כָּל סִבְעָא (<small>נ\"א<\/small> שַׂבְעָא) בְּאַרְעָא דְמִצְרָיִם וִישֵׁיצֵי כַפְנָא יָת (עַמָּא דְ)אַרְעָא:", "onk_en": "Seven years of famine will rise after them, and all the abundance will be forgotten in the land of Egypt. The famine will devastate the land.", "pj": "וִיקוּמוּן שְׁבַע שְׁנֵי כַפְנָא מִן בַּתְרֵיהוֹן וְיִתְנְשֵׁי כָּל שׁוֹבְעָא דַהֲוָה בְּאַרְעָא דְמִצְרַיִם וִישֵׁצֵי כַפְנָא יַת דַיְירֵי אַרְעָא", "pj_en": "And after them will arise seven years of famine, which will make all the plenty that was in the land of Mizraim to be forgotten; and the famine will consume the inhabitants of the land;", "tj": "", "tj_en": "", "rashi": "<b>ונשכח כל השבע.<\/b> הוּא פִתְרוֹן הַבְּלִיעָה:", "rashi_en": "ונשכח כל השבע AND ALL THE PLENTY SHALL BE FORGOTTEN — this is the interpretation of the act of swallowing. "}, {"ch": 41, "v": 31, "aliyah": 2, "heb": "וְלֹֽא־יִוָּדַ֤ע הַשָּׂבָע֙ בָּאָ֔רֶץ מִפְּנֵ֛י הָרָעָ֥ב הַה֖וּא אַחֲרֵי־כֵ֑ן כִּֽי־כָבֵ֥ד ה֖וּא מְאֹֽד׃", "onk": "וְלָא יִתְיְדַע שׂוֹבְעָא (<small>נ\"א<\/small> שִׂבְעָא) בְּאַרְעָא מִן קָדָם כַּפְנָא הַהוּא דִּיהֵי בָתַר כֵּן אֲרֵי תַקִיף הוּא לַחֲדָא:", "onk_en": "Nor will be known the [former] abundance of the land because of that famine that will follow, for it will be very severe.", "pj": "וְלָא יִתְיְדַע שׁוּבְעָא דַהֲוָה בְּאַרְעָא מִן כַּפְנָא הַהוּא דִיהֵי מִן בָּתַר כֵּן אֲרוּם תַּקִיף הוּא לַחֲדָא", "pj_en": "neither will the plenty which had been in the land be known, for the famine that will be afterward, because it will be exceeding strong.", "tj": "", "tj_en": "", "rashi": "<b>ולא יודע השבע.<\/b> הוּא פִּתְרוֹן <b>\"ולא נודע כי באו אל קרבנה\"<\/b>:", "rashi_en": "ולא יודע השבע AND THE PLENTY SHALL NOT BE KNOWN — this is the interpretation of (v. 21) “And it could not be noticed that they had eaten them up”. "}, {"ch": 41, "v": 32, "aliyah": 2, "heb": "וְעַ֨ל הִשָּׁנ֧וֹת הַחֲל֛וֹם אֶל־פַּרְעֹ֖ה פַּעֲמָ֑יִם כִּֽי־נָכ֤וֹן הַדָּבָר֙ מֵעִ֣ם הָאֱלֹהִ֔ים וּמְמַהֵ֥ר הָאֱלֹהִ֖ים לַעֲשֹׂתֽוֹ׃", "onk": "וְעַל דְּאִתַּנֵּית חֶלְמָא לְפַרְעֹה תַּרְתֵּין זִמְנִין אֲרֵי תַקֵּין פִּתְגָּמָא <b>מִן<\/b> קֳדָם יְיָ וְאוֹחִי יְיָ לְמֶעְבְּדֵיהּ:", "onk_en": "As for the dream being repeated twice to Pharaoh, it is because the thing stands ready [<b>from<\/b>] before God, and God is hurrying to do it.", "pj": "וּמִן בִּגְלַל דְאִיתְנֵי חֵילְמָא לְפַרְעה תַּרְתֵּין זִמְנִין אֲרוּם תַּקִיף פִּתְגָמָא מִן קֳדָם יְיָ וּמוֹחִי יְיָ לְמֶעֱבְדֵיהּ", "pj_en": "And forasmuch as the dream was repeated to Pharoh twice, therefore is the thing confirmed before the Lord, and the Lord hasteneth to do it.", "tj": "", "tj_en": "", "rashi": "<b>נכון.<\/b> מְזֻמָּן:", "rashi_en": "נכון —means PREPARED. "}, {"ch": 41, "v": 33, "aliyah": 2, "heb": "וְעַתָּה֙ יֵרֶ֣א פַרְעֹ֔ה אִ֖ישׁ נָב֣וֹן וְחָכָ֑ם וִישִׁיתֵ֖הוּ עַל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וּכְעַן יֶחֱזֵי פַרְעֹה גְּבַר סוּכְלְתָן וְחַכִּים וּמַנְּיֵהּ עַל אַרְעָא דְמִצְרָיִם:", "onk_en": "Now Pharaoh should seek a man of understanding and wisdom, and place him in charge of the land of Egypt.", "pj": "וּכְדוּן יֶחְמֵי פַּרְעה גְבַר סוּכְלְתָן וְחַכִּים וְיִמְנִינֵיהּ עַל אַרְעָא דְמִצְרָיִם", "pj_en": "But now let Pharoh look out a man prudent and wise, and appoint him over the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 34, "aliyah": 2, "heb": "יַעֲשֶׂ֣ה פַרְעֹ֔ה וְיַפְקֵ֥ד פְּקִדִ֖ים עַל־הָאָ֑רֶץ וְחִמֵּשׁ֙ אֶת־אֶ֣רֶץ מִצְרַ֔יִם בְּשֶׁ֖בַע שְׁנֵ֥י הַשָּׂבָֽע׃", "onk": "יַעְבֵּד פַּרְעֹה וִימַנֵּי <b>מְהֵימְנִין<\/b> עַל אַרְעָא וִיזָרֵז יָת אַרְעָא דְמִצְרַיִם בְּשֶׁבַע שְׁנֵי שׂוֹבְעָא (<small>נ\"א<\/small> שִׂבְעָא):", "onk_en": "This is what Pharaoh should do: appoint officials [<b>faithful men<\/b>] over the land, and prepare the land of Egypt during the seven years of abundance.", "pj": "יַעֲבֵיד פַּרְעה וְיִמַנֵי אַפּוֹטְרוֹפִּין עַל אַרְעָא וְיִפְקוּן חַד מִן חַמְשָׁא מִן כָּל עִיבּוּרָא דְאַרְעָא דְמִצְרַיִם בִּשְׁבַע שְׁנֵי שׁוֹבְעָא", "pj_en": "Let Pharoh make superintendents over the land, and let them take out one part in five of all the produce of the land of Mizraim in the seven years of plenty.", "tj": "יַעֲבֵיד פַּרְעה וִימַנֵי יָתֵיהּ אַפִּיטְרוֹפּוֹס עַל אַרְעָא חַד מִן חַמְשָׁא וִיפַלֵיג בְּאַרְעָא דְמִצְרַיִם בְּשַבְעָתֵיהּ שְׁנֵי שַׁבְעֲנָה:", "tj_en": "Let Pharoh make and appoint him a superintendent over the land; and let him set apart one in five throughout the land of Mizraim in the seven years of plenty.", "rashi": "<b>וחמש.<\/b> כְּתַרְגּוּמוֹ וִיזָרְזוּן; וְכֵן וַחֲמֻשִׁים (שמות י\"ג):", "rashi_en": "וחמש — render it as the Targum does “and they shall prepare”. Similar is (Exodus 13:18) “וחמושים and prepared (for war)”. "}, {"ch": 41, "v": 35, "aliyah": 2, "heb": "וְיִקְבְּצ֗וּ אֶת־כׇּל־אֹ֙כֶל֙ הַשָּׁנִ֣ים הַטֹּב֔וֹת הַבָּאֹ֖ת הָאֵ֑לֶּה וְיִצְבְּרוּ־בָ֞ר תַּ֧חַת יַד־פַּרְעֹ֛ה אֹ֥כֶל בֶּעָרִ֖ים וְשָׁמָֽרוּ׃", "onk": "וְיִכְנְשׁוּן יָת כָּל <b>עִיבוּר<\/b> שְׁנַיָּא טָבָן דְּאָתְיָן הָאִלֵּין וְיִצְבְּרוּן <b>עִיבוּרָא<\/b> תְּחוֹת יְדָא דְפַרְעֹה <b>עִיבוּרָא<\/b> בְּקִירְוַיָּא וְיִטְּרוּן:", "onk_en": "Let them gather in all the food [<b>grain<\/b>] during these good years that are coming, and let them store up grain under the hand [jurisdiction] of Pharaoh. Let the food [<b>grain<\/b>] be [kept] in the cities, and let them safeguard it.", "pj": "וְיִכְנְשׁוּן יַת כָּל עִיבּוּר שְׁנַיָא טַבְתָא דְאַתְיַין אִלֵין וְיִצְבְּרוּן עִיבּוּרָא תְּחוֹת אַפִּיטְרוֹפִּין דְפַּרְעה וִישַׁווּן עִבּוּרָא בְּקִרְוַיָיא וְיִנְטְרוּן", "pj_en": "And let them collect all the produce of those good years that are coming, and gather together the produce under the hand of Pharoh's superintendents, and set the produce in the cities to be kept;", "tj": "", "tj_en": "", "rashi": "<b>את כל אכל.<\/b> שֵׁם דָּבָר הוּא, לְפִיכָךְ טַעֲמוֹ בָּאָלֶ\"ף וְנָקוּד בְּפַתָּח קָטָן, וְאוֹכֵל שֶׁהוּא פֹּעַל, כְּגוֹן כִּי כָּל אֹכֵל חֵלֶב, טַעֲמוֹ לְמַטָּה בַּכַּ\"ף, וְנָקוּד קָמָץ קָטָן:<br><br><b>תחת יד פרעה.<\/b> בִּרְשׁוּתוֹ וּבְאוֹצְרוֹתָיו:", "rashi_en": "את כל אֹכֶל ALL THE FOOD — The word אֹכֶל is a noun and therefore the accent is on the א and the last syllable has the vowel Patach Katan (a name Rashi uses for our Segol), whilst אוֹכֵל — which is a participle, as for instance, (Leviticus 7:25) “For whosoever eateth (אוֹכֵל) the fat” — has the accent on the ultimate syllable, on the כ, and has the vowel Kametz Katan (Zéré).<br><br>תחת יד פרעה UNDER THE HAND OF PHARAOH — under his control and in his storehouses. "}, {"ch": 41, "v": 36, "aliyah": 2, "heb": "וְהָיָ֨ה הָאֹ֤כֶל לְפִקָּדוֹן֙ לָאָ֔רֶץ לְשֶׁ֙בַע֙ שְׁנֵ֣י הָרָעָ֔ב אֲשֶׁ֥ר תִּהְיֶ֖יןָ בְּאֶ֣רֶץ מִצְרָ֑יִם וְלֹֽא־תִכָּרֵ֥ת הָאָ֖רֶץ בָּרָעָֽב׃", "onk": "וִיהֵי <b>עִבוּרָא גָנִיז<\/b> (לְעַמָּא דְ) לְאַרְעָא לִשְׁבַע שְׁנֵי כַפְנָא דִּי תְהֶוְיָן בְּאַרְעָא דְמִצְרָיִם וְלָא תִשְׁתֵּיצֵי <b>עַמָּא דְאַרְעָא<\/b> בְּכַפְנָא:", "onk_en": "The food [<b>grain<\/b>] will be held in safe-keeping [<b>stored away<\/b>] for the land, for the seven years of famine; which will be in the land of Egypt. Let the [<b>people of the<\/b>] land not be cut off by the famine.", "pj": "וִיהֵי עִיבּוּרָא גְנִיז בִּמְעַרְתָּא בְּאַרְעָא לְמִזַן מִנֵיהּ בְּשֶׁבַע שְׁנֵי כַפְנָא דִיתִיהֶוְיַן בְּאַרַע דְמִצְרַיִם וְלָא יִשְׁתֵּצֵי עַמָא דְאַרְעָא בְּכַפְנָא", "pj_en": "and there will be provision laid up (as) in a cavern in the earth, that therefrom they may take in the years of famine which come upon the land of Mizraim, that the people of the land perish not through the famine.", "tj": "", "tj_en": "", "rashi": "<b>והיה האכל.<\/b> הַצָּבוּר כִּשְׁאָר פִּקָּדוֹן הַגָּנוּז לְקִיּוּם הָאָרֶץ:", "rashi_en": "והיה האכל — means AND THE FOOD that is stored up SHALL BE AS ANY other DEPOSIT (פקדון) that is held in reserve for the maintenance of the people of the land. "}, {"ch": 41, "v": 37, "aliyah": 2, "heb": "וַיִּיטַ֥ב הַדָּבָ֖ר בְּעֵינֵ֣י פַרְעֹ֑ה וּבְעֵינֵ֖י כׇּל־עֲבָדָֽיו׃", "onk": "וּשְׁפַר פִּתְגָּמָא בְּעֵינֵי פַרְעֹה וּבְעֵינֵי כָּל עַבְדוֹהִי:", "onk_en": "This thing [plan] was good in the eyes of Pharaoh, and in the eyes of all his servants.", "pj": "וּשְׁפַר פִּתְגָמָא קֳדָם פַּרְעה וְקָדָם כָּל עַבְדוֹי", "pj_en": "And the word was good before Pharoh, and before all his servants.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 38, "aliyah": 2, "heb": "וַיֹּ֥אמֶר פַּרְעֹ֖ה אֶל־עֲבָדָ֑יו הֲנִמְצָ֣א כָזֶ֔ה אִ֕ישׁ אֲשֶׁ֛ר ר֥וּחַ אֱלֹהִ֖ים בּֽוֹ׃", "onk": "וַאֲמַר פַּרְעֹה לְעַבְדוֹהִי הֲנִשְׁכַּח כְּדֵין גְּבָר דִּי <b>רוּחַ נְבוּאָה מִן קֳדָם יְיָ<\/b> בֵּיהּ:", "onk_en": "Pharaoh said to his servants, Can [another] one like this be found, a man who has God’s spirit [<b>the spirit of prophecy from before God<\/b>] in him?", "pj": "וַאֲמַר פַּרְעה לְעַבְדוֹי הַנִשְׁכַּח כְּדֵין גְבַר דִי רוּחַ נְבוּאָה מִן קֳדָם יְיָ בֵּיהּ", "pj_en": "And Pharoh said to his servants, Can we find a man like this, in whom is the spirit of prophecy from the Lord?", "tj": "", "tj_en": "", "rashi": "<b>הנמצא כזה.<\/b> הֲנִשְׁכַּח כְּדֵין? אִם נֵלֵךְ וּנְבַקְשֶׁנּוּ, הֲנִמְצָא כָמוֹהוּ? הֲנִמְצָא לְשׁוֹן תְּמִיהָה; וְכֵן כָּל הֵ\"א הַמְשַׁמֶּשֶׁת בְּרֹאשׁ תֵּבָה וּנְקוּדָה בַחֲטַף פַּתָּח:", "rashi_en": "הנמצא כזה CAN WE FIND SUCH A ONE AS THIS? — The Targum renders it: “can we find like this one” — meaning, “If we go to seek one could we find anyone like him?” הנמצא is a question, as is every ה prefixed to a word with the vowel Chataph Patach. "}, {"ch": 41, "v": 39, "aliyah": 3, "heb": "וַיֹּ֤אמֶר פַּרְעֹה֙ אֶל־יוֹסֵ֔ף אַחֲרֵ֨י הוֹדִ֧יעַ אֱלֹהִ֛ים אוֹתְךָ֖ אֶת־כׇּל־זֹ֑את אֵין־נָב֥וֹן וְחָכָ֖ם כָּמֽוֹךָ׃", "onk": "וַאֲמַר פַּרְעֹה לְיוֹסֵף בָּתַר דְּאוֹדַע יְיָ יָתָךְ יָת כָּל דָּא לֵית סָכְלְתָן וְחַכִּים כְּוָתָךְ:", "onk_en": "Pharaoh said to Yoseif, After Elohim has informed you of all this, there is no one so understanding and wise as you.", "pj": "וַאֲמַר פַּרְעה לִיוֹסֵף בָּתַר דְאוֹדַע יְיָ יָתָךְ יַת כָּל דָא לֵית סוּכְלָתָן וְחַכִּים כְּוָותָךְ", "pj_en": "And Pharoh said to Joseph, Since the Lord Hath made known all this to thee, there is no one so prudent and wise as thou art.", "tj": "", "tj_en": "", "rashi": "<b>אין נבון וחכם כמוך.<\/b> לְבַקֵּשׁ אִישׁ נָבוֹן וְחָכָם שֶׁאָמַרְתָּ, לֹא נִמְצָא כָמוֹךָ:", "rashi_en": "אין נבון וחכם כמוך  THERE IS NONE SO DISCREET AND WISE AS THOU ART — If we do seek for a discreet and wise man as you suggested (v. 33) we shall find none like you). "}, {"ch": 41, "v": 40, "aliyah": 3, "heb": "אַתָּה֙ תִּהְיֶ֣ה עַל־בֵּיתִ֔י וְעַל־פִּ֖יךָ יִשַּׁ֣ק כׇּל־עַמִּ֑י רַ֥ק הַכִּסֵּ֖א אֶגְדַּ֥ל מִמֶּֽךָּ׃", "onk": "אַתְּ תְּהֵי <b>מְמַנָּא<\/b> עַל בֵּיתִי וְעַל מֵימְרָךְ יִתְּזַן כָּל עַמִּי לְחוֹד כָּרְסֵי <b>מַלְכוּתָא הָדֵין<\/b> אֵיהֵי <b>יַקִּיר<\/b> מִנָּךְ:", "onk_en": "You shall be [<b>appointed<\/b>] over my house, and by your word shall all my people be fed. Only by [virtue of] the throne [<b>of this kingdom<\/b>] will I be greater [<b>more honored<\/b>] than you.", "pj": "אַנְתְּ תְּהִי אַפִּיטְרוֹפּוֹס עַל בֵּיתִי וְעַל גְזֵירַת מֵימַר פּוּמָךְ יִתְּזִינוּן כָּל עַמִי לְחוֹד כּוּרְסֵי מַלְכוּתָא אֱהֵא רַב מִינָךְ", "pj_en": "Thou shalt be superintendent over my house, and by the decree of thy mouth shall all my people be armed only in the throne of the kingdom will I be greater than thou.", "tj": "", "tj_en": "", "rashi": "<b>ישק.<\/b> יִתְּזַן, יִתְפַּרְנֵס – כָּל צָרְכֵי עַמִּי יִהְיוּ נַעֲשִׂים עַל יָדְךָ, כְּמוֹ נַשְּׁקוּ בַר (תהילים ב'), גרני\"שון בְּלַעַז:<br><br><b>רק הכסא.<\/b> שֶׁיִּהְיוּ קוֹרִין לִי מֶלֶךְ:<br><br><b>כסא.<\/b> לְשׁוֹן שֵׁם הַמְּלוּכָה, כְּמוֹ וִיגַדֵּל אֶת כִּסְאוֹ מִכִּסֵּא אֲדֹנִי הַמֶּלֶךְ (מלכים א א'):", "rashi_en": "ישק —The Targum renders it by יתזן which means SHALL BE FED — all my people’s needs shall be provided through you. Similar are (15:2) “and the steward (ובן משק) of my house”, and (Psalms 2:12) “Provide yourselves (נשקו) with purity” old French garnison.<br><br>רק הכסא ONLY IN THE THRONE — only in the fact that they shall call me king.<br><br>כסא THRONE is a metaphorical term for royal rank, like (1 Kings 1:37) “And he has made his throne (כסאו) greater than the throne of my lord king”. "}, {"ch": 41, "v": 41, "aliyah": 3, "heb": "וַיֹּ֥אמֶר פַּרְעֹ֖ה אֶל־יוֹסֵ֑ף רְאֵה֙ נָתַ֣תִּי אֹֽתְךָ֔ עַ֖ל כׇּל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר פַּרְעֹה לְיוֹסֵף חֲזֵי מַנֵּיתִי יָתָךְ עַל כָּל אַרְעָא דְמִצְרָיִם:", "onk_en": "Pharaoh said to Yoseif, Behold, I have placed you in charge of the entire land of Egypt.", "pj": "וַאֲמַר פַּרְעה לְיוֹסֵף חֳמֵי דְמַנִית יָתָךְ סַרְכָן עַל כָּל אַרְעָא דְמִצְרָיִם", "pj_en": "And Pharoh said to Joseph, See, I have appointed thee prince over the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>נתתי אתך.<\/b> מַנֵּיתִי יָתָךְ, וְאַעַ\"פִּ כֵּן לְשׁוֹן נְתִינָה הוּא, כְּמוֹ וּלְתִתְּךָ עֶלְיוֹן (דברים כ\"ו); בֵּין לִגְדֻלָּה בֵּין לְשִׁפְלוּת נוֹפֵל לְשׁוֹן נְתִינָה עָלָיו, כְּמוֹ נָתַתִּי אֶתְכֶם נִבְזִים וּשְׁפָלִים (מלאכי ב'):", "rashi_en": "נתתי אתך The Targum translates it by— “I have appointed thee”; nevertheless even in this sense it really means “giving”, as (Deuteronomy 26:19) “and to make thee (ולתתך) high”. To express either the idea of raising to high rank or of degrading the term “to give” may be used. An example of the latter is (Malachi 2:9) “I have made thee (נתתיך) contemptible and base”. "}, {"ch": 41, "v": 42, "aliyah": 3, "heb": "וַיָּ֨סַר פַּרְעֹ֤ה אֶת־טַבַּעְתּוֹ֙ מֵעַ֣ל יָד֔וֹ וַיִּתֵּ֥ן אֹתָ֖הּ עַל־יַ֣ד יוֹסֵ֑ף וַיַּלְבֵּ֤שׁ אֹתוֹ֙ בִּגְדֵי־שֵׁ֔שׁ וַיָּ֛שֶׂם רְבִ֥ד הַזָּהָ֖ב עַל־צַוָּארֽוֹ׃", "onk": "וְאַעְדִּי פַרְעֹה יָת עִזְקְתֵיהּ מֵעַל יְדֵיהּ וִיהַב יָתַהּ עַל יְדָא דְיוֹסֵף וְאַלְבִּישׁ יָתֵיהּ לְבוּשִׁין דְּבוּץ וְשַׁוִּי מָנִיכָא דְדַהֲבָא עַל צַוְּארֵיהּ:", "onk_en": "Pharaoh then took off his ring from his hand, and he placed it on Yoseif’s hand. He dressed him in linen garments, and put a gold chain around his neck.", "pj": "וְאַעֲדִי פַּרְעה יַת עִזְקָתֵיהּ מֵעַל יְדֵיהּ וִיהַב יָתָהּ עַל יְדָא דְיוֹסֵף וְאַלְבִּישׁ יָתֵיהּ לְבוּשִׁין דְבוּץ וְשַׁוֵי מְנִיכָא דְדַהֲבָא עַל צַוָורֵיהּ", "pj_en": "And Pharoh took off his ring from his hand, and set it on Joseph's hand; and he clothed him in vestments of fine linen, and set a collar of gold upon his neck,", "tj": "", "tj_en": "", "rashi": "<b>ויסר פרעה את טבעתו.<\/b> נְתִינַת טַבַּעַת הַמֶּלֶךְ הִיא אוֹת לְמִי שֶׁנּוֹתְנָהּ לוֹ לִהְיוֹת שֵׁנִי לוֹ לִגְדֻלָּה:<br><br><b>בגדי שש.<\/b> דְּבַר חֲשִׁיבוּת הוּא בְּמִצְרַיִם:<br><br><b>רביד.<\/b> עֲנָק, וְעַל שֶׁהוּא רָצוּף בְּטַבָּעוֹת קָרוּי רְבִיד וְכֵן מַרְבַדִּים רָבַדְתִּי עַרְשִׂי (משלי ז') – רִצַּפְתִּי עַרְשִׂי מַרְצָפוֹת, בִּלְשׁוֹן מִשְׁנָה מֻקָּף רוֹבְדִין שֶׁל אֶבֶן, עַל הָרֹבֶד שֶׁבָּעֲזָרָה, וְהִיא רִצְפָּה:", "rashi_en": "ויסר פרעה את טבעתו AND PHARAOH TOOK OFF HIS RING — When the king gives his ring it is a sign that the person to whom he hands it is to be second to him in rank.<br><br>בגדי שש FINE LINEN — this is a material much valued in Egypt (cf Rashi on Genesis 2:11).<br><br>רביד means A CHAIN — it is termed רביד because it is made up of links placed in a row. The root is the same as that found in (Proverbs 7:16) “I have decked (רבדתי) my bed with coverings of tapestry (מרבדים)” — i.e. I have placed on my couch rows of rugs. In Mishnaic Hebrew (Mishnah Middot 1:8) we have, “was surrounded with rows (רובדין) of stone”, and (Yoma 43b) “on the (רובד) row of stones that was in the Temple Court” — referring to the pavement (רצפה). "}, {"ch": 41, "v": 43, "aliyah": 3, "heb": "וַיַּרְכֵּ֣ב אֹת֗וֹ בְּמִרְכֶּ֤בֶת הַמִּשְׁנֶה֙ אֲשֶׁר־ל֔וֹ וַיִּקְרְא֥וּ לְפָנָ֖יו אַבְרֵ֑ךְ וְנָת֣וֹן אֹת֔וֹ עַ֖ל כׇּל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְאַרְכֵּיב יָתֵיהּ בִּרְתִכָּא תִנְיֵתָא דִּי לֵיהּ וְאַכְרִיזוּ קֳדָמוֹהִי <b>דֵּין אַבָּא לְמַלְכָּא<\/b> וּמַנִּי יָתֵיהּ עַל כָּל אַרְעָא דְמִצְרָיִם:", "onk_en": "He had him [Yoseif] ride in his second-ranking carriage, and they proclaimed before him, Avreich [<b>”This is the associate of the king”<\/b>]. He thus placed him over the entire land of Egypt.", "pj": "וְאַרְכֵּיב יָתֵיהּ בִּרְתִיכָא תִּנְיֵיתָא דִלְפַרְעה וַהֲווֹ מְקַלְסִין לִקְדָמוֹי דֵין אַבָּא לְמַלְכָּא רַב בְּחָכְמָתָא וְרַכִּיךְ בִּשְׁנַיָיא וּמָנֵי יָתֵיהּ סַרְכָן עַל כָּל אַרְעָא דְמִצְרַיִם", "pj_en": "and made him ride in the second chariot of Pharoh; and they chanted before him, This is the Father of the king; Great in wisdom, few in years. And he appointed him prince over all the land of Mizraim.", "tj": "וַהֲווֹ מְקַלְסִין קֳדָמוֹי וְאָמְרִין יְחִי אָבוֹי דְמַלְכָּא דְרַב בְּחוּכְמָא וְרַכִּיךְ בִּשְׁנַיָיא:", "tj_en": "And they chanted before him, and said, Live the Father of the king, Great in wisdom and few in years.", "rashi": "<b>במרכבת המשנה.<\/b> הַשְּׁנִיָּה לְמֶרְכַּבְתּוֹ, הַמְהַלֶּכֶת אֵצֶל שֶׁלּוֹ:<br><br><b>אברך.<\/b> כְּתַרְגּוּמוֹ \"דֵּין אַבָּא לְמַלְכָּא\", רֵךְ בִּלְשׁוֹן אֲרַמִּי (נ\"א רוֹמִי) מֶלֶךְ; בְּהַשֻּׁתָּפִין לָא רֵיכָא וְלֹא בַּר רֵיכָא, וּבְדִבְרֵי אַגָּדָה דָּרַשׁ רַבִּי יְהוּדָה אַבְרֵךְ זֶה יוֹסֵף שֶׁהוּא אָב בְּחָכְמָה וְרַךְ בַּשָּׁנִים, אָמַר לוֹ רַ' יוֹסֵי בֶּן דֻּרְמַסְקִית עַד מָתַי אַתָּה מְעַוֵּת עָלֵינוּ אֶת הַכְּתוּבִים? אֵין אַבְרֵךְ אֶלָּא לְשׁוֹן בִּרְכַּיִם, שֶׁהַכֹּל הָיוּ נִכְנָסִין וְיוֹצְאִין תַּחַת יָדוֹ, כָּעִנְיָן שֶׁנֶּאֱמַר, וְנָתוֹן אוֹתוֹ וְגוֹ':", "rashi_en": "במרכבת המשנה means — the chariot second in order to his chariot — that which drove next to his own.<br><br>אברך Render this as the Targum does: “This is the father (counsellor) of the king”. In Aramaic (some editions read in Roman i.e. Latin) רך means king (rex). Thus in the chapter beginning with השותפין (Bava Batra 4a) we have: “neither a noble (ריכא) nor the son of a noble (ריכא)”. In the Midrash (Sifré Devarim 1:1) Rabbi Judah explained: אברך is appellation for Joseph who was אב “a father” in wisdom and רך “tender” in years. Whereupon Rabbi Jose the son of a woman of Damascus said to him: “How much longer will you pervert for us the meaning of Scripture? The word אברך can only be connected with the word ברכים knees (i.e. “Bend the knee”), for all came in and went forth only by his permission, just as it states “and he set him [over all the land of Egypt]”. "}, {"ch": 41, "v": 44, "aliyah": 3, "heb": "וַיֹּ֧אמֶר פַּרְעֹ֛ה אֶל־יוֹסֵ֖ף אֲנִ֣י פַרְעֹ֑ה וּבִלְעָדֶ֗יךָ לֹֽא־יָרִ֨ים אִ֧ישׁ אֶת־יָד֛וֹ וְאֶת־רַגְל֖וֹ בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר פַּרְעֹה לְיוֹסֵף אֲנָא פַרְעֹה וּבַר <b>מֵימְרָךְ<\/b> לָא <b>יְרִים<\/b> גְּבַר יָת יְדֵיהּ <b>לְמֵיחַד זֵין<\/b> וְיָת רַגְלֵיהּ <b>לְמִרְכַּב עַל סוּסְיָא<\/b> בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "Pharaoh [then] said to Yoseif, I am Pharaoh, but without you [<b>your permission<\/b>], no man will lift [<b>pick up<\/b>] his hand [<b>to carry a sword<\/b>] or his foot [<b>to ride upon a horse<\/b>] in the entire land of Egypt.", "pj": "וַאֲמַר פַּרְעה לְיוֹסֵף אֲנָא פַרְעה מַלְכָּא וְאַנְתְּ אַלְקַפְטָא וּבַר מִמֵימְרָךְ לָא יְרִים גְבַר יְדֵיהּ לְמִיסוֹר זַיְינֵיהּ וְיַת רִיגְלֵיהּ לְמִירְכְּוּב עַל סוּסְיָא בְּכָל אַרְעָא דְמִצְרַיִם", "pj_en": "And Pharoh said to Joseph, I am Pharoh the king, and thou art viceregent, and without thy word a man shall not lift up his hand to gird on arms, or his foot to mount a horse in all the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>אני פרעה.<\/b> שֶׁיֵּשׁ יְכֹלֶת בְּיָדִי לִגְזֹר גְּזֵרָה עַל מַלְכוּתִי, וַאֲנִי גּוֹזֵר שֶׁלֹּא יָרִים אִישׁ יָדוֹ בִלְעָדֶיךָ, – שֶׁלֹּא בִּרְשׁוּתְךָ. דָּ\"אַ אֲנִי פַרְעֹה, אֲנִי אֶהְיֶה מֶלֶךְ, וּבִלְעָדֶיךָ וְגוֹ' וְזֶהוּ דֻּגְמַת רַק הַכִּסֵּא:<br><br><b>את ידו ואת רגלו.<\/b> כְּתַרְגּוּמוֹ:", "rashi_en": "אני פרעה I AM PHARAOH in whose power it is to issue decrees for my kingdom, and I order that no man shall lift up his hand בלעדיך — without your permission. Another explanation of אני פרעה: I AM PHARAOH — I shall be king, but without thy permission etc. It is exactly similar in meaning to (v. 40) “only in the throne [will I be greater than thou]”.<br><br>את ידו ואת רגלו HIS HAND OR HIS FOOT — Understand it as the Targum does: no man shall raise his hand to gird on a sword or raise his foot to mount a horse. "}, {"ch": 41, "v": 45, "aliyah": 3, "heb": "וַיִּקְרָ֨א פַרְעֹ֣ה שֵׁם־יוֹסֵף֮ צָֽפְנַ֣ת פַּעְנֵ֒חַ֒ וַיִּתֶּן־ל֣וֹ אֶת־אָֽסְנַ֗ת בַּת־פּ֥וֹטִי פֶ֛רַע<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן פּֽוֹטִיפֶ֛רַע בתיבה אחת)<\/i> כֹּהֵ֥ן אֹ֖ן לְאִשָּׁ֑ה וַיֵּצֵ֥א יוֹסֵ֖ף עַל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וּקְרָא פַרְעֹה שׁוּם יוֹסֵף <b>גַּבְרָא דְמִטַּמְרָן גָּלְיָן לֵיהּ<\/b> וִיהַב לֵיהּ יָת אָסְנַת בַּת פּוֹטִי פֶרַע <b>רַבָּא<\/b> דְאוֹן לְאִתְּתָא וּנְפַק יוֹסֵף (שַׁלִּיט) עַל אַרְעָא דְמִצְרָיִם:", "onk_en": "Pharaoh gave Yoseif the name Tzafnas Paneiach [<b>the man to whom hidden things are revealed<\/b>], and he gave him Osnas, the daughter of Poti Phera, priest [<b>chief<\/b>] of On as a wife. Yoseif [then] went out over the land of Egypt.", "pj": "וּקְרָא פַרְעה שְׁמֵיהּ דְיוֹסֵף גַבְרָא דִטְמִירָן מְפַרְסֵם וִיהַב לֵיהּ יַת אָסְנַת דִילֵידַת דִינָה לִשְׁכֶם וּרְבֵיתָה אִיתַּת פּוֹטִיפֶרַע רַבָּא דְטָנִיס לְאִינְתּוּ וּנְפַק יוֹסֵף שַׁלִיט עַל אַרְעָא דְמִצְרַיִם", "pj_en": "And Pharoh called the name of Joseph, The man who revealeth mysteries. And he gave him Asenath, whom Dinah had borne to Shekem, and the wife of Potiphera prince (Rabba) of Tanis had brought up, to be his wife. And Joseph went forth ruler over the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>צפנת פענח.<\/b> מְפָרֵשׁ הַצְּפוּנוֹת; וְאֵין לְפַעְנֵחַ דִּמְיוֹן בַּמִּקְרָא:<br><br><b>פוטיפרע.<\/b> הוּא פּוֹטִיפַר, וְנִקְרָא פּוֹטִיפֶרַע עַל שֶׁנִּסְתָּרֵס מֵאֵלָיו, לְפִי שֶׁחָמַד אֶת יוֹסֵף לְמִשְׁכַּב זָכָר (סוטה י\"ג):", "rashi_en": "צפנת פענח signifies \"Explainer of hidden things\". There is no other example in Scripture of the word.<br><br>פוטי פרע — POTIPHERAH — he is identical with Potiphar. And he is called Potipherah (<i>pherah<\/i> meaning, disturbed or cut) as he became naturally castrated, since he desired Yosef for male intercourse (Sotah 13b)."}, {"ch": 41, "v": 46, "aliyah": 3, "heb": "וְיוֹסֵף֙ בֶּן־שְׁלֹשִׁ֣ים שָׁנָ֔ה בְּעׇמְד֕וֹ לִפְנֵ֖י פַּרְעֹ֣ה מֶֽלֶךְ־מִצְרָ֑יִם וַיֵּצֵ֤א יוֹסֵף֙ מִלִּפְנֵ֣י פַרְעֹ֔ה וַֽיַּעֲבֹ֖ר בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְיוֹסֵף בַּר תְּלָתִין שְׁנִין כַּד קָם קֳדָם פַּרְעֹה מַלְכָּא דְמִצְרָיִם וּנְפַק יוֹסֵף מִן קֳדָם פַּרְעֹה וַעֲבַר (שַׁלִּיט) בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "Yoseif was thirty years old when he stood before Pharaoh, king of Egypt. Yoseif left Pharaoh’s presence, and traversed throughout the entire land of Egypt.", "pj": "וְיוֹסֵף בַּר תְּלָתִין שְׁנִין כַּד קָם קֳדָם פַּרְעה מַלְכָּא דְמִצְרַיִם וּנְפַק יוֹסֵף מִלְוַת פַּרְעה וְעָבַר רַב וְשַׁלִיט בְּכָל אַרְעָא דְמִצְרַיִם", "pj_en": "And Joseph was a son of thirty years when he stood before Pharoh, king of Mizraim. And Joseph went out from Pharoh, and passed, a prince and a ruler, through all ,the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 47, "aliyah": 3, "heb": "וַתַּ֣עַשׂ הָאָ֔רֶץ בְּשֶׁ֖בַע שְׁנֵ֣י הַשָּׂבָ֑ע לִקְמָצִֽים׃", "onk": "<b>וּכְנָשׁוּ דָיְרֵי אַרְעָא<\/b> בִּשְׁבַע שְׁנֵי שׂוֹבְעָא (<small>נ\"א<\/small> שִׂבְעָא) <b>עִיבוּרָא לְאוֹצָרִין<\/b>:", "onk_en": "The earth produced [<b>The inhabitants of the land stored up<\/b>] during the seven years of abundance by handfuls [<b>grain for store-houses<\/b>].", "pj": "וְאַצְלָחַת אַרְעָא דְכָל תּוּבָלָא עָבַד מְלֵי תְּרֵין קוּמְצִין בְּשֶׁבַע שְׁנֵי שׁוּבְעָא עַד דְיִמְלוּן כָּל אוֹצְרַיָא", "pj_en": "And the earth (so) brought forth, that every blade made two handsfull in the seven years of plenty, until all the granaries were full.", "tj": "", "tj_en": "", "rashi": "<b>ותעש הארץ.<\/b> כְּתַרְגּוּמוֹ, וְאֵין הַלָּשׁוֹן נֶעֱקָר מִלְּשׁוֹן עֲשִׂיָּה:<br><br><b>לקמצים.<\/b> קֹמֶץ עַל קֹמֶץ, יָד עַל יָד, הָיוּ אוֹצְרִים:", "rashi_en": "ותעש הארץ AND THE EARTH BROUGHT FORTH — understand it as the Targum does: the inhabitants of the land gathered. Still the word ותעש does not really lose its meaning of “doing” or “making”.<br><br>לקמצים BY HANDFULS — they stored up the grain handful upon handful, fist upon fist. "}, {"ch": 41, "v": 48, "aliyah": 3, "heb": "וַיִּקְבֹּ֞ץ אֶת־כׇּל־אֹ֣כֶל&thinsp;<b>׀<\/b> שֶׁ֣בַע שָׁנִ֗ים אֲשֶׁ֤ר הָיוּ֙ בְּאֶ֣רֶץ מִצְרַ֔יִם וַיִּתֶּן־אֹ֖כֶל בֶּעָרִ֑ים אֹ֧כֶל שְׂדֵה־הָעִ֛יר אֲשֶׁ֥ר סְבִיבֹתֶ֖יהָ נָתַ֥ן בְּתוֹכָֽהּ׃", "onk": "וּכְנַשׁ יָת כָּל <b>עִיבוּר<\/b> שְׁבַע שְׁנִין דִּי הֲווֹ בְּאַרְעָא דְמִצְרַיִם וִיהַב <b>עִיבוּר<\/b> בְּקִרְוַיָּא <b>עִיבוּר<\/b> חֲקַל קַרְתָּא דִּי בְסַחְרָנָהָא יְהַב בְּגַוָּהּ:", "onk_en": "He gathered in all the food [<b>grain<\/b>] of the seven years [that was produced] in the land of Egypt, and placed the food [<b>grain<\/b>] in the cities. The food [<b>grain<\/b>] of the fields surrounding each city was placed within [the city].", "pj": "וּכְנַשׁ יַת כָּל עִיבּוּר שְׁבַע שְׁנֵי שׁוּבְעָא דַהֲווֹ בְּאַרְעָא דְמִצְרַיִם וִיהַב עִיבּוּרָא בְּקִרְוַיָא עִבּוּר חַקְלֵי קַרְתָּא דִבְחוֹזְרָנָהָא כְּנַשׁ בְּגַוָוהּ", "pj_en": "And they gathered all the produce of the seven years of plenty which were in the land of Mizraim, and he laid up the produce in the cities; the produce of the fields which were round about a city he laid up therein.", "tj": "", "tj_en": "", "rashi": "<b>אכל שדה העיר אשר סביבתיה נתן בתוכה.<\/b> שֶׁכָּל אֶרֶץ וְאֶרֶץ מַעֲמֶדֶת פֵּרוֹתֶיהָ, וְנוֹתְנִין בַּתְּבוּאָה מֵעֲפַר הַמָּקוֹם, וּמַעֲמִיד אֶת הַתְּבוּאָה מִלִּרְקֹב:", "rashi_en": "אכל שדה העיר אשר סביבתיה נתן בתוכה THE FOOD OF THE FIELD WHICH WAS ROUND ABOUT EVERY CITY LAID HE UP IN THE SAME — for every district preserves its own produce; and for this people always put amongst the grain some of the earth of the place in which it grows and this prevents it decaying (Genesis Rabbah 90:5)."}, {"ch": 41, "v": 49, "aliyah": 3, "heb": "וַיִּצְבֹּ֨ר יוֹסֵ֥ף בָּ֛ר כְּח֥וֹל הַיָּ֖ם הַרְבֵּ֣ה מְאֹ֑ד עַ֛ד כִּי־חָדַ֥ל לִסְפֹּ֖ר כִּי־אֵ֥ין מִסְפָּֽר׃", "onk": "וּכְנַשׁ יוֹסֵף עִבוּרָא כְּחַלָּא דְיַמָּא סַגִּי לַחֲדָא עַד דִּי פְסַק לְמִמְנֵי אֲרֵי לֵית מִנְיָן:", "onk_en": "Yoseif piled up grain like the sand of the sea—in great abundance, until that they gave up counting it, because there were no [more] numbers.", "pj": "", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>עד כי חדל לספר.<\/b> עַד כִּי חָדַל לוֹ הַסּוֹפֵר לִסְפֹּר, וַהֲרֵי זֶה מִקְרָא קָצָר:<br><br><b>כי אין מספר.<\/b> לְפִי שֶׁאֵין מִסְפָּר, וַהֲרֵי כִי מְשַׁמֵּשׁ בְּלְשׁוֹן דְּהָא:", "rashi_en": "עד כי חדל לספר UNTIL THEY CEASED NUMBERING — until the one who was numbering stopped numbering — it is an elliptical phrase<br><br>כי אין מספר means because it was without number — The word כי has the meaning of because (Rosh Hashanah 3a). "}, {"ch": 41, "v": 50, "aliyah": 3, "heb": "וּלְיוֹסֵ֤ף יֻלַּד֙ שְׁנֵ֣י בָנִ֔ים בְּטֶ֥רֶם תָּב֖וֹא שְׁנַ֣ת הָרָעָ֑ב אֲשֶׁ֤ר יָֽלְדָה־לּוֹ֙ אָֽסְנַ֔ת בַּת־פּ֥וֹטִי פֶ֖רַע<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן פּֽוֹטִיפֶ֖רַע בתיבה אחת)<\/i> כֹּהֵ֥ן אֽוֹן׃", "onk": "וּלְיוֹסֵף אִתְיְלִיד תַּרְתֵּין בְּנִין עַד לָא עַלַּת שַׁתָּא דְכַפְנָא דִּיְלִידַת לֵיהּ אָסְנַת בַּת פּוֹטִי פֶרַע <b>רַבָּא<\/b> דְאוֹן:", "onk_en": "Two sons were born to Yoseif before the years of famine came. They were born to him by Osnas, the daughter of Poti Phera, Priest [<b>chief<\/b>] of On.", "pj": "וּלְיוֹסֵף אִתְיְלִידוּ תְּרֵין בְּנִין עַד לָא עָלַת שַׁתָּא דְכַפְנָא דִילִידַת לֵיהּ אָסְנַת דְרִיבַת בְּבֵית פּוֹטִיפֶרַע רַבָּא דְטָנִיס", "pj_en": "And to Joseph were born two sons before the year of famine arose, which Asenath who had been brought up in the house of Potipliera prince of Tanis bare to him.", "tj": "", "tj_en": "", "rashi": "<b>בטרם תבא שנת הרעב.<\/b> מִכָּאן שֶׁאָדָם אָסוּר לְשַׁמֵּשׁ מִטָּתוֹ בִּשְׁנֵי רְעָבוֹן (תענית י\"א):", "rashi_en": "בטרם תבא שנת הרעב BEFORE THE YEAR OF FAMINE CAME — from here we learn that a man must practise continence during times of famine (cf. Taanit 11a). "}, {"ch": 41, "v": 51, "aliyah": 3, "heb": "וַיִּקְרָ֥א יוֹסֵ֛ף אֶת־שֵׁ֥ם הַבְּכ֖וֹר מְנַשֶּׁ֑ה כִּֽי־נַשַּׁ֤נִי אֱלֹהִים֙ אֶת־כׇּל־עֲמָלִ֔י וְאֵ֖ת כׇּל־בֵּ֥ית אָבִֽי׃", "onk": "וּקְרָא יוֹסֵף יָת שׁוּם בּוּכְרָא מְנַשֶּׁה אֲרֵי אַנְשְׁיַנִי יְיָ יָת כָּל עַמְלִי וְיָת כָּל בֵּית אַבָּא:", "onk_en": "Yoseif named the first-born, Menasheh, For God has made me forget all my trouble, and all that was in my father’s house.", "pj": "וּקְרָא יוֹסֵף שׁוּם בּוּכְרָא מְנַשֶׁה אֲרוּם אַנְשְׁיַינִי יְיָ יַת כָּל לֵיאוּתִי וְיַת כָּל בֵּית אַבָּא", "pj_en": "And Joseph called the name of his firstjborn Menasheh; because, the Lord hath made me forget all my weariness and all the house of my father.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 52, "aliyah": 3, "heb": "וְאֵ֛ת שֵׁ֥ם הַשֵּׁנִ֖י קָרָ֣א אֶפְרָ֑יִם כִּֽי־הִפְרַ֥נִי אֱלֹהִ֖ים בְּאֶ֥רֶץ עׇנְיִֽי׃", "onk": "וְיָת שׁוּם תִּנְיָנָא קְרָא אֶפְרָיִם אֲרֵי אַפְּשַׁנִי יְיָ בְּאַרַע <b>שִׁעְבּוּדִי<\/b>:", "onk_en": "He named the second one Ephraim, Because Elohim has made me fruitful in the land of my suffering [<b>servitude<\/b>].", "pj": "וְיַת שׁוּם תִּנְיַין קְרָא אֶפְרַיִם אֲרוּם אָמַר תַּקִיף יָתִי יְיָ בְּאַרַע סִיגוּפִי וְהֵיכְדֵין עָתִיד לְמִתְקוֹף בֵּית אַבָּא הָכָא בְּסִיגוּפֵיהוֹם", "pj_en": "And the name of the second he called Ephraim; for he said, The Lord hath made me mighty in the land of my affliction, as he will make the house of my father mighty here in their afflictions.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 53, "aliyah": 4, "heb": "וַתִּכְלֶ֕ינָה שֶׁ֖בַע שְׁנֵ֣י הַשָּׂבָ֑ע אֲשֶׁ֥ר הָיָ֖ה בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "<b>וּשְׁלִימַת<\/b> שְׁבַע שְׁנֵי שׂוֹבְעָא (<small>נ\"א<\/small> שִׂבְעָא) דִּי הֲוָה בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "The seven years of abundance came to an end [<b>were completed<\/b>], [the good years] that were in the land of Egypt.", "pj": "וּשְׁלִימָן שְׁבַע שְׁנֵי שׁוּבְעָא דְהַוָאָה בְּאַרְעָא דְמִצְרָיִם", "pj_en": "And the seven years of plenty were completed which were to come in the land of Mizraim;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 54, "aliyah": 4, "heb": "וַתְּחִלֶּ֜ינָה שֶׁ֣בַע שְׁנֵ֤י הָרָעָב֙ לָב֔וֹא כַּאֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַיְהִ֤י רָעָב֙ בְּכׇל־הָ֣אֲרָצ֔וֹת וּבְכׇל־אֶ֥רֶץ מִצְרַ֖יִם הָ֥יָה לָֽחֶם׃", "onk": "וּשְׁרִיאַת שְׁבַע שְׁנֵי כַפְנָא לְמֵיעַל כְּמָא דִּי אֲמַר יוֹסֵף וַהֲוָה כַפְנָא בְּכָל אַרְעֲתָא וּבְכָל אַרְעָא דְמִצְרַיִם הֲוָה לַחְמָא:", "onk_en": "The seven years of famine started to come, just as Yoseif had said. There was famine in all the lands, but in all the land of Egypt there was bread.", "pj": "וּשְׁרִיאָן שְׁבַע שְׁנֵי כַפְנָא לְמֵיתֵי הֵיכְמָא דַאֲמַר יוֹסֵף וַהֲוָה כַפְנָא בְּכָל אַרְעָתָא וּבְכָל אַרְעָא דְמִצְרַיִם הֲוָה לַחְמָא", "pj_en": "and the seven years of famine began to be, as Joseph had said. And there was famine in all lands, but in all the land of Mizraim there was bread.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 41, "v": 55, "aliyah": 4, "heb": "וַתִּרְעַב֙ כׇּל־אֶ֣רֶץ מִצְרַ֔יִם וַיִּצְעַ֥ק הָעָ֛ם אֶל־פַּרְעֹ֖ה לַלָּ֑חֶם וַיֹּ֨אמֶר פַּרְעֹ֤ה לְכׇל־מִצְרַ֙יִם֙ לְכ֣וּ אֶל־יוֹסֵ֔ף אֲשֶׁר־יֹאמַ֥ר לָכֶ֖ם תַּעֲשֽׂוּ׃", "onk": "וּכְפָנַת כָּל אַרְעָא דְמִצְרַיִם וּצְוַח עַמָּא (קֳדָם) לְפַרְעֹה (עַל) לְלַחְמָא וַאֲמַר פַּרְעֹה לְכָל <b>מִצְרָאֵי<\/b> אִיזִילוּ לְוַת יוֹסֵף דִּי יֵימַר לְכוֹן תַּעְבְּדוּן:", "onk_en": "When all the land of Egypt was famished, the people cried out to Pharaoh for bread. Pharaoh said to all of Egypt [<b>the Egyptians<\/b>], Go to Yoseif. Whatever he says to you, do.", "pj": "וּכְפֵינַת כָּל אַרְעָא דְמִצְרַיִם דְלָא הֲוַת מַפְקָא בַּר זַרְעָא וּצְוַח עַמָא קֳדָם פַּרְעה בְּגִין לַחְמָא וַאֲמַר פַּרְעה לְכָל מִצְרָאֵי אִיזִילוּ לְוַת יוֹסֵף דְיֵימַר לְכוֹן תַּעֲבְדוּן", "pj_en": "And all the land of Mizraim had dearth; because the seed wheat bare no fruit, and the people cried before Pharoh for bread. And Pharoh said to all the Mizraee, Go to Joseph, and what he shall tell you do.", "tj": "", "tj_en": "", "rashi": "<b>ותרעב כל ארץ מצרים.<\/b> שֶׁהִרְקִיבָה תְבוּאָתָם שֶׁאָצְרוּ חוּץ מִשֶּׁל יוֹסֵף:<br><br><b>אשר יאמר לכם תעשו.<\/b> לְפִי שֶׁהָיָה יוֹסֵף אוֹמֵר לָהֶם שֶׁיִּמּוֹלוּ, וּכְשֶׁבָּאוּ אֵצֶל פַּרְעֹה וְאוֹמְרִים: כָּךְ הוּא אוֹמֵר לָנוּ, אָמַר לָהֶם: וְלָמָּה לֹא צְבַרְתֶּם בָּר, וַהֲלֹא הִכְרִיז לָכֶם שֶׁשְּׁנֵי הָרָעָב בָּאִים? אָמְרוּ לוֹ: אָסַפְנוּ הַרְבֵּה וְהִרְקִיבָה, אָמַר לָהֶם: אִם כֵּן, כָּל אֲשֶׁר יֹאמַר לָכֶם תַּעֲשׂוּ; הֲרֵי גָּזַר עַל הַתְּבוּאָה וְהִרְקִיבָה, מַה אִם יִגְזֹר עָלֵינוּ וְנָמוּת!", "rashi_en": "ותרעב כל ארץ מצרים AND THE LAND OF EGYPT WAS FAMISHED — for all the grain they had stored up rotted except that of Joseph (cf. Genesis Rabbah 91:5)<br><br>אשר יאמר לכם תעשו WHAT HE SAITH TO YOU, DO — He gave them this order because Joseph had told them to be circumcised. When they came to Pharaoh and said, “Thus he bids us do otherwise he will give us no corn”, he asked them, “Why did you yourselves not lay up corn? Did he not publicly announce that years of famine were coming?” They answered him, “We gathered in much, but it has rotted”. He said to them, “If this be so — what he saith to you, do. See, he laid a decree upon the produce and it rotted; what will happen if he lays a decree upon us that we should die!” (cf. Genesis Rabbah 91:5) "}, {"ch": 41, "v": 56, "aliyah": 4, "heb": "וְהָרָעָ֣ב הָיָ֔ה עַ֖ל כׇּל־פְּנֵ֣י הָאָ֑רֶץ וַיִּפְתַּ֨ח יוֹסֵ֜ף אֶֽת־כׇּל־אֲשֶׁ֤ר בָּהֶם֙ וַיִּשְׁבֹּ֣ר לְמִצְרַ֔יִם וַיֶּחֱזַ֥ק הָֽרָעָ֖ב בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְכַפְנָא הֲוָה עַל כָּל אַפֵּי אַרְעָא וּפְתַח יוֹסֵף יָת כָּל (אוֹצְרַיָּא) דִּי בְהוֹן עִיבוּרָא וְזַבִּין לְ<b>מִצְרַיִם<\/b> וּתְקֵיף כַּפְנָא בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "The famine spread over the entire face of the land. Yoseif opened everything that held grain, and sold [grain] to the Egyptians [<b>Egypt<\/b>]. The famine became severe in the land of Egypt.", "pj": "וְכַפְנָא הֲוַת עַל כָּל אַנְפֵּי אַרְעָא וּפְתַח יוֹסֵף יַת כָּל אוֹצְרִין דִבְהוֹן עִיבּוּרָא וְזַבִּין לְמִצְרָאֵי וּתְקֵף כַּפְנָא בְּאַרְעָא דְמִצְרָיִם", "pj_en": "And the famine was upon all the face of the land; and Joseph opened all the treasures and sold to the Mizraee. And the famine waxed mighty in the land of Mizraim;", "tj": "", "tj_en": "", "rashi": "<b>על כל פני הארץ.<\/b> מִי הֵם פְּנֵי הָאָרֶץ אֵלּוּ הָעֲשִׁירִים:<br><br><b>את כל אשר בהם.<\/b> כְּתַרְגּוּמוֹ דִּי בְהוֹן עִיבוּרָא:<br><br><b>וישבר למצרים.<\/b> שבר לְשׁוֹן מֶכֶר וּלְשׁוֹן קִנְיָן הוּא; כָּאן מְשַׁמֵּשׁ לְשׁוֹן מֶכֶר; שִׁבְרוּ לָנוּ מְעַט אֹכֶל, לְשׁוֹן קִנְיָן. וְאַל תֹּאמַר אֵינוֹ כִּי אִם בִּתְבוּאָה, שֶׁאַף בְּיַיִן וְחָלָב מָצִינוּ וּלְכוּ שִׁבְרוּ בְּלוֹא כֶסֶף וּבְלוֹא מְחִיר יַיִן וְחָלָב (ישעיהו נ\"ה):", "rashi_en": "על כל פני הארץ OVER ALL THE FACE OF THE EARTH — Who are the face of the earth? the well-to-do people (Genesis Rabbah 91:5).<br><br>את כל אשר בהם — understand it as the Targum renders it: [JOSEPH OPENED ALL THE STOREHOUSES] IN WHICH THERE WAS CORN.<br><br>וישבור למצרים AND HE SOLD UNTO THE EGYPTIANS — The root שבר has the meaning both of selling and buying. Here it is used in the sense of selling, whereas in (43:2) “שברו for us a little food”, it means buying. You cannot say that it (the word) can be used only of selling and buying grain for we find it used also of wine and milk: (Isaiah 55:1) “And come, buy (שברו) wine and milk without money and without price”. "}, {"ch": 41, "v": 57, "aliyah": 4, "heb": "וְכׇל־הָאָ֙רֶץ֙ בָּ֣אוּ מִצְרַ֔יְמָה לִשְׁבֹּ֖ר אֶל־יוֹסֵ֑ף כִּֽי־חָזַ֥ק הָרָעָ֖ב בְּכׇל־הָאָֽרֶץ׃", "onk": "וְכָל <b>דָּיְרֵי<\/b> אַרְעָא עַלּוּ לְמִצְרַיִם לְמִזְבַּן עִיבוּרָא מִן יוֹסֵף אֲרֵי תְקֵיף כַּפְנָא בְּכָל אַרְעָא:", "onk_en": "All [countries] [<b>inhabitants<\/b>] of the land came to Egypt to buy [grain] from Yoseif, for the famine was severe in all the land.", "pj": "וְכָל דַיְירֵי אַרְעָא עָלוּ לְמִצְרַיִם לְמִיזְבַּן עִיבּוּרָא מִן יוֹסֵף אֲרוּם תַּקִיף כַּפְנָא בְּכָל אַרְעָא", "pj_en": "and all the inhabitants of the earth came into Mizraim to buy provision of Joseph; for the famine was mighty in all the earth.", "tj": "", "tj_en": "", "rashi": "<b>וכל הארץ באו מצרימה אל יוסף לשבר<\/b>, וְאִם תִּדְרְשֵׁהוּ כְסִדְרוֹ, הָיָה צָרִיךְ לִכְתֹּב: לִשְׁבֹּר מִן יוֹסֵף:", "rashi_en": "וכל הארץ באו מצרימה —Transpose the words and explain it thus: “and all the countries came into Egypt אל יוסף to Joseph לשבר to buy corn”, for if you explain the words in the order in which they are written it ought to state לשבור מן יוסף to buy from Joseph."}, {"ch": 42, "v": 1, "aliyah": 4, "heb": "וַיַּ֣רְא יַעֲקֹ֔ב כִּ֥י יֶשׁ־שֶׁ֖בֶר בְּמִצְרָ֑יִם וַיֹּ֤אמֶר יַעֲקֹב֙ לְבָנָ֔יו לָ֖מָּה תִּתְרָאֽוּ׃", "onk": "וַחֲזָא יַעֲקֹב אֲרֵי אִית <b>עִיבוּרָא<\/b> מִזְדַּבַּן בְּמִצְרָיִם וַאֲמַר יַעֲקֹב לִבְנוֹהִי לְמָא תִּתְחֲזוּן:", "onk_en": "Yaakov saw that food [<b>grain<\/b>] was being sold in Egypt. Yaakov said to his sons, Why would you have everyone gazing at you?", "pj": "וַחֲמָא יַעֲקב אֲרוּם עַלְלַיָא זַבְּנִין וּמַיְיתָן עִיבּוּרָא מִמִצְרַיִם וַאֲמַר יַעֲקב לִבְנוֹי לְמָא דֵין אַתּוּן דַחֲלִין לְמֵיחוּת לְמִצְרָיִם", "pj_en": "And Jakob saw that provisions might be bought and that they brought corn from Mizraim; and Jakob said to his sons, Why are you afraid to go down to Mizraim?", "tj": "", "tj_en": "", "rashi": "<b>וירא יעקב כי יש שבר במצרים.<\/b> וּמֵהֵיכָן רָאָה? וַהֲלֹא לֹא רָאָה אֶלָּא שָׁמַע, שֶׁנֶּאֱמַר הִנֵּה שָׁמַעְתִּי וְגוֹ' וּמַהו
