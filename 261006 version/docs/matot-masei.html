ch": 33, "v": 9, "aliyah": 4, "heb": "וַיִּסְעוּ֙ מִמָּרָ֔ה וַיָּבֹ֖אוּ אֵילִ֑מָה וּ֠בְאֵילִ֠ם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְשִׁבְעִ֥ים תְּמָרִ֖ים וַיַּחֲנוּ־שָֽׁם׃", "onk": "וּנְטָלוּ מִמָּרָה וַאֲתוֹ לְאֵילִם וּבְאֵילִם תְּרֵי עֲשַׂר מַבּוּעִין דְּמַיִּן וְשַׁבְעִין דִּקְלִין וּשְׁרוֹ תַמָּן:", "onk_en": "They journeyed from Moroh and came to Eilim. In Eilim were twelve springs of water and seventy palm trees, and they camped there.", "pj": "וּנְטָלוּ מִמָרָה וַאֲתוֹ לְאֵילִם וּבְאֵילִם תַּרְתֵּיסְרֵי עִינְוָון דְמַיָין לִתְרֵיסַר שִׁבְטִין וְשׁוּבְעִין דִיקְלִין כֻּלוֹ קֳבֵיל שׁוּבְעִין חַכִּימַיָא וּשְׁרוֹ תַמָן עַל מַיָא", "pj_en": "And they removed from Marah, and came to Elim; in Elim were twelve fountains of water for the twelve tribes, and seventy palm trees, answering to the seventy sages; and they encamped there by the waters.", "tj": "וּנְטָלוּ מִמָרָה וַאֲתוֹ לְאֵילִימָה וּבְאֵילִם תַּרְתֵּי עַשְרֵי עַיְינִין דְמַיָין כָּל קֳבֵיל תְּרֵי עַשְרֵי שִׁבְטַיָא דְיִשְרָאֵל וְשַׁבְעִין דִיקְלִין כָּל קֳבֵיל שִׁבְעִין סָבַיָא סַנְהֶדְרִין דְיִשְרָאֵל וּשְׁרוֹ תַמָן:", "tj_en": "And they removed from Marah and came to Elim: in Elim were twelve fountains of water, answering to the twelve tribes of Israel, and seventy palm trees, answering to the seventy elders of the Sanhedrin of Israel; and they encamped there.", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 10, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵאֵילִ֑ם וַֽיַּחֲנ֖וּ עַל־יַם־סֽוּף׃", "onk": "וּנְטָלוּ מֵאֵילִם וּשְׁרוֹ עַל יַמָּא דְסוּף:", "onk_en": "They journeyed from Eilim and camped by the Sea of Reeds.", "pj": "וּנְטָלוּ מֵאֵילִם וּשְׁרוֹ עַל גֵיף יַמָא דְסוּף", "pj_en": "And they removed from Elim, and camped on the banks of the Sea of Suph;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 11, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִיַּם־ס֑וּף וַֽיַּחֲנ֖וּ בְּמִדְבַּר־סִֽין׃", "onk": "וּנְטָלוּ מִיַּמָּא דְסוּף וּשְׁרוֹ בְּמַדְבְּרָא דְסִין:", "onk_en": "They journeyed from the Sea of Reeds and camped in the wilderness of Sin.", "pj": "וּנְטָלוּ מִגֵיף יַמָא דְסוּף וּשְׁרוֹ בְּמַדְבְּרָא דְסִין", "pj_en": "and they removed from the banks of the sea, and encamped in the wilderness of Sin;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 12, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִמִּדְבַּר־סִ֑ין וַֽיַּחֲנ֖וּ בְּדׇפְקָֽה׃", "onk": "וּנְטָלוּ מִמַּדְבְּרָא דְסִין וּשְׁרוֹ בְּדָפְקָה:", "onk_en": "They journeyed from the wilderness of Sin and camped in Dofkoh.", "pj": "וּנְטָלוּ מִמַדְבְּרָא דְסִין וּשְׁרוֹ בְּדָפְקָה", "pj_en": "thence to Dopheka,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 13, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִדׇּפְקָ֑ה וַֽיַּחֲנ֖וּ בְּאָלֽוּשׁ׃", "onk": "וּנְטָלוּ מִדָּפְקָה וּשְׁרוֹ בְּאָלוּשׁ:", "onk_en": "They journeyed from Dofkoh and camped in Alush.", "pj": "וּנְטָלוּ מִדָפְקָה וּשְׁרוֹ בִכְרַךְ תַּקִיף", "pj_en": "Kerak Takiph (the strong tower),", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 14, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵאָל֑וּשׁ וַֽיַּחֲנוּ֙ בִּרְפִידִ֔ם וְלֹא־הָ֨יָה שָׁ֥ם מַ֛יִם לָעָ֖ם לִשְׁתּֽוֹת׃", "onk": "וּנְטָלוּ מֵאָלוּשׁ וּשְׁרוֹ בִּרְפִידִם וְלָא הֲוָה תַמָּן מַיָּא לְעַמָּא לְמִשְׁתֵּי:", "onk_en": "They journeyed from Alush and camped in Refidim, [but] there was no water there for the people to drink.", "pj": "וּנְטָלוּ מֵאֲתַר תַּקִיף וּשְׁרוֹ בִּרְפִידִים וּמְטוֹל דְרָפִין יְדֵיהוֹן מִפִּתְגָמֵי אוֹרַיְיתָא לָא הֲוָה תַמָן מוֹי לְמִשְׁתֵּי לְעַמָא", "pj_en": "Rephidim, where, because their hands were (raphin) neglectful of the words of the law, there was no water for the people to drink;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 15, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵרְפִידִ֑ם וַֽיַּחֲנ֖וּ בְּמִדְבַּ֥ר סִינָֽי׃", "onk": "וּנְטָלוּ מֵרְפִידִם וּשְׁרוֹ בְּמַדְבְּרָא דְסִינָי:", "onk_en": "They journeyed from Refidim and camped in the wilderness of Sinai.", "pj": "וּנְטָלוּ מֵרְפִידִים וּשְׁרוֹ בְּמַדְבְּרָא דְסִינָי", "pj_en": "thence to the wilderness of Sinai;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 16, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִמִּדְבַּ֣ר סִינָ֑י וַֽיַּחֲנ֖וּ בְּקִבְרֹ֥ת הַֽתַּאֲוָֽה׃", "onk": "וּנְטָלוּ מִמַּדְבְּרָא דְסִינָי וּשְׁרוֹ <b>בְּקִבְרֵי דִמְשַׁאֲלֵי<\/b>:", "onk_en": "They journeyed from the wilderness of Sinai and camped in Kivros Hata’avoh [<b>Graves of the Demanders<\/b>].", "pj": "וּנְטָלוּ מִמַדְבְּרָא דְסִינָי וּשְׁרוֹ בְּקִבְרֵי דִמְשַׁאֲלֵי בִּישְרָא", "pj_en": "thence to the Graves of those who desired flesh;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 17, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִקִּבְרֹ֣ת הַֽתַּאֲוָ֑ה וַֽיַּחֲנ֖וּ בַּחֲצֵרֹֽת׃", "onk": "וּנְטָלוּ <b>מִקִּבְרֵי דִמְשַׁאֲלֵי<\/b> וּשְׁרוֹ בַּחֲצֵרֹת:", "onk_en": "They journeyed from Kivros Hata’avoh [<b>Graves of the Demanders<\/b>] and camped in Chatzeiros.", "pj": "וּנְטָלוּ מִקִבְרֵי דִמְשַׁיְילֵי בִּישְרָא וּשְׁרוֹ בַּחֲצֵרוֹת אַתְרָא דְאִסְתַּגְרַת מִרְיָם נְבִיאֲתָא", "pj_en": "thence to Hazeroth, where Miriam the prophetess was struck, with leprosy;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 18, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵחֲצֵרֹ֑ת וַֽיַּחֲנ֖וּ בְּרִתְמָֽה׃", "onk": "וּנְטָלוּ מֵחֲצֵרֹת וּשְׁרוֹ בְּרִתְמָה:", "onk_en": "They journeyed from Chatzeiros and camped in Rismoh.", "pj": "וּנְטָלוּ מֵחֲצֵרוֹת וּשְׁרוֹ בְּרִיתְמָא אֲתַר דִמְרַבֵּי אִילָנֵי רְתָמֵי", "pj_en": "thence to Rithema, the place of many juniper trees;", "tj": "", "tj_en": "", "rashi": "<b>ויחנו ברתמה.<\/b> עַל שֵׁם לָשׁוֹן הָרָע שֶׁל מְרַגְּלִים, שֶׁנֶּאֱמַר \"מַה יִּתֵּן לְךָ וּמַה יֹּסִיף לָךְ לָשׁוֹן רְמִיָּה חִצֵּי גִבּוֹר שְׁנוּנִים עִם גַּחֲלֵי רְתָמִים\" (תהלים ק\"כ):", "rashi_en": "ויחנו ברתמה AND THEY ENCAMPED IN RITHMAH — It was so called with reference to the slanderous speech of the spies, uttered there, as it is said, (Psalms 120:3-4): “What shall be given unto thee, and what shall be done more unto thee, thou deceitful tongue? Sharp arrows of the mighty with coals of juniper (רְתָמִים). "}, {"ch": 33, "v": 19, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵרִתְמָ֑ה וַֽיַּחֲנ֖וּ בְּרִמֹּ֥ן פָּֽרֶץ׃", "onk": "וּנְטָלוּ מֵרִתְמָה וּשְׁרוֹ בְּרִמֹּן פָּרֶץ:", "onk_en": "They journeyed from Rismoh and camped in Rimon Peretz.", "pj": "וּנְטָלוּ מֵאֲתַר דִמְרַבֵּי אִילָנֵי רְתָמֵי וּשְׁרוֹ בְּרוּמָנָא דְמַתְקֵיף פֵּירוֹי", "pj_en": "thence to Rumana, whose fruit is hard;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 20, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵרִמֹּ֣ן פָּ֑רֶץ וַֽיַּחֲנ֖וּ בְּלִבְנָֽה׃", "onk": "וּנְטָלוּ מֵרִמֹּן פָּרֶץ וּשְׁרוֹ בְּלִבְנָה:", "onk_en": "They journeyed from Rimon Peretz and camped in Livnoh.", "pj": "וּנְטָלוּ מֵרוֹמָנָא דְמַתְקֵיף פֵּירוֹי וּשְׁרוֹ בְּלִבְנָא אֲתַר דִתְחוּמִין לָהּ מַלְבֵּינְתָּא בִּנְיַין", "pj_en": "thence to Libnah, whose borders are built of bricks (Iibnetha);", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 21, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִלִּבְנָ֑ה וַֽיַּחֲנ֖וּ בְּרִסָּֽה׃", "onk": "וּנְטָלוּ מִלִּבְנָה וּשְׁרוֹ בְּרִסָּה:", "onk_en": "They journeyed from Livnoh and camped in Risoh.", "pj": "וּנְטָלוּ מִלִבְנָא וּשְׁרוֹ בְּבֵית רִיסָא", "pj_en": "thence to Beth Rissa;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 22, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵרִסָּ֑ה וַֽיַּחֲנ֖וּ בִּקְהֵלָֽתָה׃", "onk": "וּנְטָלוּ מֵרִסָּה וּשְׁרוֹ בִּקְהֵלָתָה:", "onk_en": "They journeyed from Risoh and camped in Keheilosoh.", "pj": "וּנְטָלוּ מֵרִיסָא וּשְׁרוֹ בְּמַקְהֵלָת אֲתַר דְאִתְכַּנָשׁוּ קרַח וְסִיַעֲתֵּיהּ עַל משֶׁה וְאַהֲרן", "pj_en": "thence to Kehelath, where Korach and his companions banded together against Mosheh and Aharon;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 23, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִקְּהֵלָ֑תָה וַֽיַּחֲנ֖וּ בְּהַר־שָֽׁפֶר׃", "onk": "וּנְטָלוּ מִקְהֵלָתָה וּשְׁרוֹ בְּטוּרָא דְשָׁפֶר:", "onk_en": "They journeyed from Keheilosoh and camped in Har Shefer.", "pj": "וּנְטָלוּ מִקְהֵלָת וּשְׁרוֹ בְּטַוְורָא דְשַׁפִּירַן פֵּירוֹי", "pj_en": "thence to the mountain whose fruit is good;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 24, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵֽהַר־שָׁ֑פֶר וַֽיַּחֲנ֖וּ בַּחֲרָדָֽה׃", "onk": "וּנְטָלוּ מִטּוּרָא דְשָׁפֶר וּשְׁרוֹ בַּחֲרָדָה:", "onk_en": "They journeyed from Har Shefer and camped in Charodoh.", "pj": "וּנְטָלוּ מִטַוְורָא דְשַׁפִּירַן פֵּירוֹי וּשְׁרוֹ בַּחֲרָדָה אֲתַר דְתָוְוהוּ עַל בִּישָׁתָא דְמוֹתָנָא", "pj_en": "thence to Harada, where they were confounded by the evil plague;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 25, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵחֲרָדָ֑ה וַֽיַּחֲנ֖וּ בְּמַקְהֵלֹֽת׃", "onk": "וּנְטָלוּ מֵחֲרָדָה וּשְׁרוֹ בְּמַקְהֵלוֹת:", "onk_en": "They journeyed from Charodoh and camped in Makheilos.", "pj": "וּנְטָלוּ מֵחֲרָדָה וּשְׁרוֹ בְּמַקְהֵלוֹת אֲתַר כְּנוּפְיָא", "pj_en": "thence to Makheloth, the place of congregation;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 26, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִמַּקְהֵלֹ֑ת וַֽיַּחֲנ֖וּ בְּתָֽחַת׃", "onk": "וּנְטָלוּ מִמַּקְהֵלוֹת וּשְׁרוֹ בְּתָחַת:", "onk_en": "They journeyed from Makheilos and camped in Tochas.", "pj": "וּנְטָלוּ מִמַקְהֵלוֹת וּשְׁרוֹ בְּאַרְעִית מַקְהֵלוֹת", "pj_en": "thence to the lower Makheloth;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 27, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִתָּ֑חַת וַֽיַּחֲנ֖וּ בְּתָֽרַח׃", "onk": "וּנְטָלוּ מִתָּחַת וּשְׁרוֹ בְּתָרַח:", "onk_en": "They journeyed from Tochas and camped in Torach.", "pj": "וּנְטָלוּ מֵאַרְעִית מַקְהֵלוֹת וּשְׁרוֹ בְּתָרַח", "pj_en": "thence to Tharach,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 28, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִתָּ֑רַח וַֽיַּחֲנ֖וּ בְּמִתְקָֽה׃", "onk": "וּנְטָלוּ מִתָּרַח וּשְׁרוֹ בְּמִתְקָה:", "onk_en": "They journeyed from Torach and camped in Miskoh.", "pj": "וּנְטָלוּ מִתָּרַח וּשְׁרוֹ בְּמִתְקָה אֲתַר דְבַסִימִין מוֹהִי", "pj_en": "and Muka, whose waters were sweet;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 29, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִמִּתְקָ֑ה וַֽיַּחֲנ֖וּ בְּחַשְׁמֹנָֽה׃", "onk": "וּנְטָלוּ מִמִּתְקָה וּשְׁרוֹ בְּחַשְׁמֹנָה:", "onk_en": "They journeyed from Miskoh and camped in Chashmonoh.", "pj": "וּנְטָלוּ מֵאֲתַר דְבַסִימִין מוֹהִי וּשְׁרוֹ בְּחַשְׁמוֹנָה", "pj_en": "thence to Hasmona;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 30, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵֽחַשְׁמֹנָ֑ה וַֽיַּחֲנ֖וּ בְּמֹסֵרֽוֹת׃", "onk": "וּנְטָלוּ מֵחַשְׁמֹנָה וּשְׁרוֹ בְּמֹסֵרוֹת:", "onk_en": "They journeyed from Chashmonoh and camped in Moseiros.", "pj": "וּנְטָלוּ מֵחַשְׁמוֹנָה וּשְׁרוֹ בַּאֲתַר מַרְדוּתָא", "pj_en": "thence to Meredotha, the place of rebellion (or chastisement);", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 31, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִמֹּסֵר֑וֹת וַֽיַּחֲנ֖וּ בִּבְנֵ֥י יַעֲקָֽן׃", "onk": "וּנְטָלוּ מִמֹּסֵרוֹת וּשְׁרוֹ בִּבְנֵי יַעֲקָן:", "onk_en": "They journeyed from Moseiros and camped in Bnei Ya’akon.", "pj": "וּנְטָלוּ מֵאֲתַר מַרְדוּתָא וּשְׁרוֹ בְּבֵירֵי עַקְתָא", "pj_en": "thence to Bere-Haktha,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 32, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִבְּנֵ֣י יַעֲקָ֑ן וַֽיַּחֲנ֖וּ בְּחֹ֥ר הַגִּדְגָּֽד׃", "onk": "וּנְטָלוּ מִבְּנֵי יַעֲקָן וּשְׁרוֹ בְּחֹר הַגִּדְגָּד:", "onk_en": "They journeyed from Bnei Ya’akon and camped in Chor Hagidgod.", "pj": "וּנְטָלוּ מִבֵּירֵי עַקְתָא וּשְׁרוֹ בְשַׁקִיפִין וְאַתְרָא מִתְקְרֵי גֻדְגוֹד", "pj_en": "Gudgad, at the Rocks,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 33, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵחֹ֣ר הַגִּדְגָּ֑ד וַֽיַּחֲנ֖וּ בְּיׇטְבָֽתָה׃", "onk": "וּנְטָלוּ מֵחֹר הַגִּדְגָּד וּשְׁרוֹ בְּיָטְבָתָה:", "onk_en": "They journeyed from Chor Hagidgod and camped in Yotvosoh.", "pj": "וּנְטָלוּ מִשַׁקִיפִין דְגֻדְגוֹד וּשְׁרוֹ בְּיָטְבַת אֲתַר טַב וּנְיַיח", "pj_en": "Jotebath, a good and quiet place;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 34, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִיׇּטְבָ֑תָה וַֽיַּחֲנ֖וּ בְּעַבְרֹנָֽה׃", "onk": "וּנְטָלוּ מִיָּטְבָתָה וּשְׁרוֹ בְּעַבְרוֹנָה:", "onk_en": "They journeyed from Yotvosoh and camped in Avronoh.", "pj": "וּנְטָלוּ מֵאֲתַר טַב וּנְיַיח וּשְׁרוֹ בִּמְגִזָתָא", "pj_en": "thence to the Fords;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 35, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵֽעַבְרֹנָ֑ה וַֽיַּחֲנ֖וּ בְּעֶצְיֹ֥ן גָּֽבֶר׃", "onk": "וּנְטָלוּ מֵעַבְרוֹנָה וּשְׁרוֹ בְּעֶצְיוֹן גָּבֶר:", "onk_en": "They journeyed from Avronoh and camped in Etzyon Gover.", "pj": "וּנְטָלוּ מִמְגִזָתָא וּשְׁרוֹ בִּכְרַךְ תַּרְנְגוֹלָא", "pj_en": "thence to Tarnegolla, the tower of the cock;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 36, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵעֶצְיֹ֣ן גָּ֑בֶר וַיַּחֲנ֥וּ בְמִדְבַּר־צִ֖ן הִ֥וא קָדֵֽשׁ׃", "onk": "וּנְטָלוּ מֵעֶצְיוֹן גָּבֶר וּשְׁרוֹ בְּמַדְבְּרָא דְצִן הִיא <b>רְקָם<\/b>:", "onk_en": "They journeyed from Etzyon Gover and camped in the wilderness of Sin, which is Kodeish [<b>Rekom<\/b>].", "pj": "וּנְטָלוּ מִכְרַךְ תַּרְנְגוֹלָא וּשְׁרוֹ בְּמַדְבְּרָא צִינֵי טַוָור פַּרְזְלָא הִיא רְקָם", "pj_en": "thence to the wilderness of Zin; at the Iron Mount, which is Rekem;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 37, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִקָּדֵ֑שׁ וַֽיַּחֲנוּ֙ בְּהֹ֣ר הָהָ֔ר בִּקְצֵ֖ה אֶ֥רֶץ אֱדֽוֹם׃", "onk": "וּנְטָלוּ <b>מֵרְקָם<\/b> וּשְׁרוֹ בְּהוֹר טוּרָא בִּסְיָפֵי אַרְעָא דֶאֱדוֹם:", "onk_en": "They journeyed from Kodeish [<b>Rekom<\/b>] and camped in Hor Hohor, at the edge of the land of Edom.", "pj": "וּנְטָלוּ מֵרְקָם וּשְׁרוֹ בְּטַוְורוֹס אוּמָנוֹס בִּסְיָיפֵי אַרְעָא דֶאֱדוֹם", "pj_en": "thence to Mount Umano, on the borders of the Land of Edom.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 38, "aliyah": 4, "heb": "וַיַּ֩עַל֩ אַהֲרֹ֨ן הַכֹּהֵ֜ן אֶל־הֹ֥ר הָהָ֛ר עַל־פִּ֥י יְהֹוָ֖ה וַיָּ֣מׇת שָׁ֑ם בִּשְׁנַ֣ת הָֽאַרְבָּעִ֗ים לְצֵ֤את בְּנֵֽי־יִשְׂרָאֵל֙ מֵאֶ֣רֶץ מִצְרַ֔יִם בַּחֹ֥דֶשׁ הַחֲמִישִׁ֖י בְּאֶחָ֥ד לַחֹֽדֶשׁ׃", "onk": "וּסְלֵק אַהֲרֹן כַּהֲנָא לְהוֹר טוּרָא עַל מֵימְרָא דַיְיָ וּמִית תַּמָּן בִּשְׁנַת אַרְבְּעִין לְמֵפַּק בְּנֵי יִשְׂרָאֵל מֵאַרְעָא דְמִצְרַיִם בְּיַרְחָא חֲמִשָּׁאָה בְּחַד לְיַרְחָא:", "onk_en": "Then Aharon the <i>kohein<\/i> ascended Hor Hohor by the word of Adonoy and died there; in the fortieth year of Bnei Yisroel’s exodus from Egypt, on the first day of the fifth month.", "pj": "וּסְלֵיק אַהֲרן כַּהֲנָא לְטַוְורוֹס אוּמָנוֹס עַל מֵימְרָא דַיְיָ וּמִית תַּמָן בִּשְׁנַת אַרְבְּעִין לְמֵיפַּק בְּנֵי יִשְרָאֵל מִמִצְרַיִם בְּיַרְחָא חֲמִישָׁאָה בְּחַד לְיַרְחָא", "pj_en": "And Aharon the priest went up to Mount Umano by the Word of the Lord, and died there, in the fortieth year from the going out of the children of Israel from Mizraim, in the fifth month, on the first of the month.", "tj": "", "tj_en": "", "rashi": "<b>על פי ה'.<\/b> מְלַמֵּד שֶׁמֵּת בִּנְשִׁיקָה:", "rashi_en": " 'על פי ה [AND AARON THE PRIEST WENT UP TO MOUNT HOR] BY THE WORD (lit., BY THE MOUTH) OF THE LORD— This phrase tells us that he died by the Divine Kiss (Bava Batra 17a; cf. Rashi on Numbers 20:26)."}, {"ch": 33, "v": 39, "aliyah": 4, "heb": "וְאַהֲרֹ֔ן בֶּן־שָׁלֹ֧שׁ וְעֶשְׂרִ֛ים וּמְאַ֖ת שָׁנָ֑ה בְּמֹת֖וֹ בְּהֹ֥ר הָהָֽר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַהֲרֹן בַּר מְאָה וְעַשְׂרִין וּתְלַת שְׁנִין כַּד מִית בְּהוֹר טוּרָא:", "onk_en": "Aharon was 123 years old at his death on Hor Hohor.", "pj": "וְאַהֲרן בַּר מְאָה וְעַשְרִין וּתְלַת שְׁנִין כַּד מִית בְּטַוְורוֹס אוּמָנוֹס", "pj_en": "And Aharon was one hundred and twenty-three years old when he died on Mount Umano.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 40, "aliyah": 4, "heb": "וַיִּשְׁמַ֗ע הַֽכְּנַעֲנִי֙ מֶ֣לֶךְ עֲרָ֔ד וְהֽוּא־יֹשֵׁ֥ב בַּנֶּ֖גֶב בְּאֶ֣רֶץ כְּנָ֑עַן בְּבֹ֖א בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּשְׁמַע כְּנַעֲנָאָה מַלְכָּא דַעֲרָד וְהוּא יָתֵב בִּדְרוֹמָא בְּאַרְעָא דִכְנָעַן בְּמֵיתֵי בְּנֵי יִשְׂרָאֵל:", "onk_en": "The Canaanite, the king of Arod heard that Bnei Yisroel were approaching—he dwelt in the south of the land of Canaan.", "pj": "וּשְׁמַע עֲמָלֵק חַיָיבָא וְאִתְחַבֵּר בִּכְנַעֲנָאֵי וּמְלַךְ בַּעֲרָד וּבֵית מוֹתְבֵיהּ בְּאַרַע דָרוֹמָא כַּד אָתוּ בְנֵי יִשְרָאֵל וְאַגִיחַ בְּהוֹן וּגְמָרוּ יַתְהוֹן וְיַת קִירְוֵויהוֹן", "pj_en": "And Amalek the wicked, who was combined with the Kenaanites, and reigned in Arad,-the house of his abode was in the land of the south,-heard that the sons of Israel were coming to wage war against them, and utterly to destroy their cities.", "tj": "", "tj_en": "", "rashi": "<b>וישמע הכנעני.<\/b> לְלַמֶּדְךָ שֶׁמִּיתַת אַהֲרֹן הִיא הַשְּׁמוּעָה, שֶׁנִּסְתַּלְּקוּ עַנְנֵי כָבוֹד וּכְסָבוּר שֶׁנִּתְּנָה רְשׁוּת לְהִלָּחֵם בְּיִשְׂרָאֵל, לְפִיכָךְ חָזַר וּכְתָבָהּ (ראש השנה ג'):", "rashi_en": "וישמע הכנעני AND THE CANAANITE HEARD This is stated here to tell you that Aaron’s death was indeed the news he heard — that the clouds of glory that until now had protected Israel had departed, and he therefore believed that liberty was now given to wage war against Israel. It is on this account that this is again recorded here (see Rashi on Numbers 21:1) (Rosh Hashanah 3a)."}, {"ch": 33, "v": 41, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵהֹ֣ר הָהָ֑ר וַֽיַּחֲנ֖וּ בְּצַלְמֹנָֽה׃", "onk": "וּנְטָלוּ מֵהוֹר טוּרָא וּשְׁרוֹ בְּצַלְמוֹנָה:", "onk_en": "They journeyed from Hor Hohor and camped in Tzalmonoh.", "pj": "וּנְטָלוּ מִטַוְורוֹס אוּמָנוֹס וּשְׁרוֹ בְּצַלְמוֹנָה אֲתַר חוֹבָאֵי וְכוּר בְּאַרַע אֱדוֹמָאֵי וְתַמָן עָקַת נַפְשָׁא דְעַמָא בְּאוֹרְחָא", "pj_en": "And they removed from Mount Umano, and encamped in Zalmona, a place of thorns, and narrow (or squalid), in the land of the Edomaee; and there the soul of the people was distressed on account of the way;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 42, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִצַּלְמֹנָ֑ה וַֽיַּחֲנ֖וּ בְּפוּנֹֽן׃", "onk": "וּנְטָלוּ מִצַּלְמוֹנָה וּשְׁרוֹ בְּפוּנֹן:", "onk_en": "They journeyed from Tzalmonoh and camped in Punon.", "pj": "וּנְטָלוּ מִצַלְמוֹנָה וּשְׁרוֹ בְּפוּנוֹן אֲתַר דְגָרֵי יְיָ בְּהוֹן יַת חֵיוַן קָלָן וְסִילְקַת קְבֵילְתְּהוֹן עַד צֵית שְׁמַיָא", "pj_en": "thence to Punon, where the Lord sent burning serpents among them, and their cry went up to heaven.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 43, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִפּוּנֹ֑ן וַֽיַּחֲנ֖וּ בְּאֹבֹֽת׃", "onk": "וּנְטָלוּ מִפּוּנֹן וּשְׁרוֹ בְּאֹבוֹת:", "onk_en": "They journeyed from Punon and camped in Ovos.", "pj": "וּנְטָלוּ מֵאֲתַר דְגָרֵי יְיָ בְהוֹן יַת חֵיוַן קָלָן וּשְׁרוֹ בְּאוֹבוֹת", "pj_en": "And they removed to Oboth;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 44, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵאֹבֹ֑ת וַֽיַּחֲנ֛וּ בְּעִיֵּ֥י הָעֲבָרִ֖ים בִּגְב֥וּל מוֹאָֽב׃", "onk": "וּנְטָלוּ מֵאֹבוֹת וּשְׁרוֹ בִּמְגִזַּת עֲבָרָאֵי בִּתְחוּם מוֹאָב:", "onk_en": "They journeyed from Ovos and camped at the ruins of Avorim on Moav’s border.", "pj": "וּנְטָלוּ מֵאוֹבוֹת וּשְׁרוֹ בִּמְגִיזַת עִבְרָאֵי בִּתְחוּם מוֹאֲבָאֵי", "pj_en": "thence to the passage of the Fords, on the border of the Moabaee;", "tj": "", "tj_en": "", "rashi": "<b>בעיי העברים.<\/b> לְשׁוֹן חֳרָבוֹת וְגַלִּים כְּמוֹ \"לְעִי הַשָּׂדֶה\" (מיכה א'), \"שָׂמוּ אֶת יְרוּשָׁלַיִם לְעִיִּים\" (תהלים ע\"ט):", "rashi_en": "בעיי העברים IN IJE-ABARIM — The word denotes waste places and heaps of rubbish, the same as, (Micah 1:6): “[will make Samaria] into a heap (עי) in the field”; (Psalms 79:1): “They have made Jerusalem into heaps (עיים)” (cf. Rashi on Numbers 21:11)."}, {"ch": 33, "v": 45, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵעִיִּ֑ים וַֽיַּחֲנ֖וּ בְּדִיבֹ֥ן גָּֽד׃", "onk": "וּנְטָלוּ מִמְּגִזָּתָא וּשְׁרוֹ בְּדִיבוֹן גָד:", "onk_en": "They journeyed from the ruins and camped in Divon Gad.", "pj": "וּנְטָלוּ מִמְגִיזְתָּא וּשְׁרוֹ בְּדִיבוֹן בֵּית מַזְלָא", "pj_en": "thence to Dibon, the place of fortune;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 46, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִדִּיבֹ֣ן גָּ֑ד וַֽיַּחֲנ֖וּ בְּעַלְמֹ֥ן דִּבְלָתָֽיְמָה׃", "onk": "וּנְטָלוּ מִדִּיבוֹן גָּד וּשְׁרוֹ בְּעַלְמוֹן דִּבְלָתָיְמָה:", "onk_en": "They journeyed from Divon Gad and camped in Almon Divlasayim.", "pj": "וּנְטָלוּ מִדִיבוֹן בֵּית מַזְלָא וּשְׁרוֹ בְּעַלְמוֹן דִבְלָתָיְמָה אוּף תַּמָן אִתְכַּסְיַית מִנְהוֹן בֵּירָא עַל דִשְׁבָקוּ פִתְגָמֵי אוֹרַיְיתָא דְבַסִימִין כְּדִבְלָתָא", "pj_en": "thence to Almon Diblathaimah, where the well was hidden from them, because they had forsaken the words of the law, which are as delicious as figs (diblatha);", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 47, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵעַלְמֹ֣ן דִּבְלָתָ֑יְמָה וַֽיַּחֲנ֛וּ בְּהָרֵ֥י הָעֲבָרִ֖ים לִפְנֵ֥י נְבֽוֹ׃", "onk": "וּנְטָלוּ מֵעַלְמוֹן דִבְלָתָימָה וּשְׁרוֹ בְּטוּרֵי דַעֲבָרָאֵי דִּקֳדָם נְבוֹ:", "onk_en": "They journeyed from Almon Divlasayim and camped in the Avorim Mountains before Nevo.", "pj": "וּנְטָלוּ מֵעַלְמוֹן דִבְלָתָיְמָה וּשְׁרוֹ בְּטַוְורָא עִבְרָאֵי קֳדָם בֵּית קְבוּרְתֵּיהּ דְמשֶׁה", "pj_en": "thence to the Mount Ibraee, in front of the place of the burial of Mosheh;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 48, "aliyah": 4, "heb": "וַיִּסְע֖וּ מֵהָרֵ֣י הָעֲבָרִ֑ים וַֽיַּחֲנוּ֙ בְּעַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃", "onk": "וּנְטָלוּ מִטּוּרֵי דַעֲבָרָאֵי וּשְׁרוֹ בְּמֵישְׁרַיָּא דְמוֹאָב עַל יַרְדְּנָא דִירֵחוֹ:", "onk_en": "They journeyed from the Avorim Mountains and camped in the plains of Moav along the Yardein near Yereicho.", "pj": "וּנְטָלוּ מִטַוְורֵי עִבְרָאֵי וּשְׁרוֹ בְּמֵישְׁרַיָא דְמוֹאָב עַל יוֹרְדְנָא דִירֵיחוֹ", "pj_en": "thence they removed and encamped in the fields of Moab, by Jordan, near Jericho;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 49, "aliyah": 4, "heb": "וַיַּחֲנ֤וּ עַל־הַיַּרְדֵּן֙ מִבֵּ֣ית הַיְשִׁמֹ֔ת עַ֖ד אָבֵ֣ל הַשִּׁטִּ֑ים בְּעַֽרְבֹ֖ת מוֹאָֽב׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּשְׁרוֹ עַל יַרְדְּנָא מִבֵּית יְשִׁימוֹת עַד מֵישַׁר שִׁטִּין בְּמֵישְׁרַיָּא דְמוֹאָב:", "onk_en": "They camped along the Yardein, from Beis Yeshimos until Aveil Hasheetim, in the plains of Moav.", "pj": "וּשְׁרוֹ עַל יוֹרְדְנָא מִבֵּית יְשִׁימוֹת עַד מֵישַׁר שִׁיטִין בְּמֵישְׁרַיָא דְמוֹאָב", "pj_en": "and they encamped by the Jordan, from Bethjeshimon unto the plain of Sillan in the fields of Moab.", "tj": "", "tj_en": "", "rashi": "<b>מבית הישמת עד אבל השטים.<\/b> כָּאן לִמֶּדְךָ שִׁעוּר מַחֲנֵה יִשְׂרָאֵל י\"ב מִיל, דִּאָמַר רַבָּה בַּר בַּר חָנָה לְדִידִי חָזֵי לִי הַהוּא אַתְרָא וְכוּ' (עירובין נ\"ה):<br><br><b>אבל השטים.<\/b> מִישׁוֹר שֶׁל שִׁטִּים אָבֵל שְׁמוֹ:", "rashi_en": "מבית הישמת עד אבל השטים [AND THEY ENCAMPED] … FROM BETH-JESIMOTH EVEN UNTO ADEL-SHITTIM — Here it tells you that the extent of Israel’s camp was twelve miles, for Rabba bar bar Chana said: “I myself have seen that place etc., and it is three Parsangs (12 miles) square” (Eruvin 55b).<br><br>אבל השטים — The plain of Shittim had the name אבל (cf. Rashi on Genesis 14:6)."}, {"ch": 33, "v": 50, "aliyah": 5, "heb": "וַיְדַבֵּ֧ר יְהֹוָ֛ה אֶל־מֹשֶׁ֖ה בְּעַֽרְבֹ֣ת מוֹאָ֑ב עַל־יַרְדֵּ֥ן יְרֵח֖וֹ לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בְּמֵישְׁרַיָּא דְמוֹאָב עַל יַרְדְּנָא דִירֵחוֹ לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe in the plains of Moav along the Yardein [near] Yereicho, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה בְּמֵישְׁרַיָא דְמוֹאָב עַל יוֹרְדְנָא דִירֵיחוֹ לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, in the fields of Moab, at the Jordan, by Jericho, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 51, "aliyah": 5, "heb": "דַּבֵּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת־הַיַּרְדֵּ֖ן אֶל־אֶ֥רֶץ כְּנָֽעַן׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲרֵי אַתּוּן עָבְרִין יָת יַרְדְּנָא לְאַרְעָא דִכְנָעַן:", "onk_en": "“Speak to Bnei Yisroel and say to them: ‘When you cross the Yardein to the land of Canaan,", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֲרוּם אַתּוּן עָבְרִין יַת יוֹרְדְנָא לְאַרְעָא דִכְנָעַן", "pj_en": "Speak with the sons of Israel, and say to them: When you have passed over the Jordan into the land of Kenaan,", "tj": "", "tj_en": "", "rashi": "<b>כי אתם עברים את הירדן וגו' והורשתם וגו'.<\/b> וַהֲלֹא כַמָּה פְעָמִים הֻזְהֲרוּ עַל כָּךְ? אֶלָּא כָּךְ אָמַר לָהֶם מֹשֶׁה כְּשֶׁאַתֶּם עוֹבְרִים בַּיַּרְדֵּן בַּיַּבָּשָׁה עַל מְנָת כֵּן תַּעַבְרוּ, וְאִם לָאו — מַיִם בָּאִין וְשׁוֹטְפִין אֶתְכֶם, וְכֵן מָצִינוּ שֶׁאָמַר לָהֶם יְהוֹשֻׁעַ (יהושע ד') בְּעוֹדָם בַּיַּרְדֵּן (סוטה ל\"ד):", "rashi_en": "כי אתם עברים את הירדן וגו׳ והורשתם וגו׳ WHEN YOU ARE PASSED OVER THE JORDAN … YOU SHALL DRIVE OUT [ALL THE INHABITANTS] — But had they not already been admonished about this several times? But it is repeated here in this form “when you are passing over the Jordan”, and not as usual “when you come into the land” because Moses spoke thus to them: While you are passing through the Jordan on dry land, you shall pass over having this in view (that you will drive out the inhabitants), and if you do not, the waters will come and overwhelm you. And so indeed we find (Jos. 4:10) that Joshua spoke to them while they were still standing in the Jordan (Sotah 34a)."}, {"ch": 33, "v": 52, "aliyah": 5, "heb": "וְה֨וֹרַשְׁתֶּ֜ם אֶת־כׇּל־יֹשְׁבֵ֤י הָאָ֙רֶץ֙ מִפְּנֵיכֶ֔ם וְאִ֨בַּדְתֶּ֔ם אֵ֖ת כׇּל־מַשְׂכִּיֹּתָ֑ם וְאֵ֨ת כׇּל־צַלְמֵ֤י מַסֵּֽכֹתָם֙ תְּאַבֵּ֔דוּ וְאֵ֥ת כׇּל־בָּמוֹתָ֖ם תַּשְׁמִֽידוּ׃", "onk": "וּתְתָרְכוּן יָת כָּל יָתְבֵי אַרְעָא מִן קֳדָמֵיכוֹן וְתֵבְדוּן יָת כָּל בֵּית סִגְדַּתְהוֹן וְיָת כָּל צַלְמֵי מַתְּכַתְהוֹן תֵּבְדוּן וְיָת כָּל בָּמַתְהוֹן תְּשֵׁצוּן:", "onk_en": "you must drive out all of the inhabitants of the land before you. You must destroy all their carved stones, and demolish all their cast metal idols and tear down all their altars.", "pj": "וּתְתַרְכוּן יַת כָּל יַתְבֵי אַרְעָא מִן קֳדָמֵיכוֹן וְתִסְפוּן יַת כָּל בֵּית סִגְדֵיהוֹן וְיַת כָּל צַלְמֵי מַתְּכַוַותְהוֹן תְּסַיְיפוּן וְיַת כָּל בַּמְסֵיהוֹן תְּשֵׁיצוּן", "pj_en": "you shall drive out all the inhabitants of the country from before you, and lay waste all the houses of their worship, destroy all their molten images, and overthrow all their high places.", "tj": "וּתְשֵׁיצִינוּן יַת כָּל דַיָירֵי אַרְעָא מִן קֳדָמֵיכוֹן וּתְסוּפוּן יַת כָּל טַעֲוַותְהוֹן וְיַת כָּל צַלְמֵי מַתַּכְוַותְהוֹן תִּתְפַּרְכוּן וְיַת כָּל בַּמְסֵיהוֹן תְּשֵׁיצוּן:", "tj_en": "You shall destroy all the inhabitants of the land from before you, make an end of all their idols, break their molten images, and overthrow all their high places.", "rashi": "<b>והורשתם.<\/b> וְגֵרַשְׁתֶּם:<br><br><b>משכיתם.<\/b> כְּתַרְגּוּמוֹ — \"בֵּית סִגְדַּתְהוֹן\", עַל שֵׁם שֶׁהָיוּ מְסַכְּכִין אֶת הַקַּרְקַע בְּרִצְפַּת אֲבָנִים שֶׁל שַׁיִשׁ לְהִשְׁתַּחֲווֹת עֲלֵיהֶם בְּפִשּׁוּט יָדַיִם וְרַגְלַיִם, כְּדִכְתִיב \"וְאֶבֶן מַשְׂכִּית לֹא תִתְּנוּ בְּאַרְצְכֶם לְהִשְׁתַּחֲוֹת עָלֶיהָ\" (ויקרא כ\"ו):<br><br><b>מסכתם.<\/b> כְּתַרְגּוּמוֹ — \"מַתְּכַתְהוֹן\":", "rashi_en": "והורשתם means, AND YE SHALL DRIVE OUT.<br><br>משכיתם — Understand this as the Targum does: THEIR SPOTS FOR WORSHIP; it is called משכית (connected with the root סכך = סכה “to cover”), because they used to cover the ground with marble stone to prostrate themselves upon it with hands and feet stretched forth, as it is said, (Leviticus 26:1): “And no stone of משכית, covering (no mosaic) shall ye put on your ground to prostrate yourself upon it” (because this is a heathen form of worship).<br><br>מסכיתם — Understand this as the Targum does: their molten gods."}, {"ch": 33, "v": 53, "aliyah": 5, "heb": "וְהוֹרַשְׁתֶּ֥ם אֶת־הָאָ֖רֶץ וִֽישַׁבְתֶּם־בָּ֑הּ כִּ֥י לָכֶ֛ם נָתַ֥תִּי אֶת־הָאָ֖רֶץ לָרֶ֥שֶׁת אֹתָֽהּ׃", "onk": "וּתְתָרְכוּן יָת יָתְבֵי אַרְעָא וְתֵיתְבוּן בַּהּ אֲרֵי לְכוֹן יְהָבִית יָת אַרְעָא לְמֵירַת יָתָהּ:", "onk_en": "Drive out [the inhabitants of] the land and settle in it, because I have given this land to you to possess.", "pj": "וּתְתַרְכוּן יַת יַתְבֵי אַרְעָא וְתֵיתְבוּן בָּהּ אֲרוּם לְכוֹן יְהָבִית יַת אַרְעָא לְמֵירוּת יָתָהּ", "pj_en": "And you shall drive out the inhabitants of the land, and dwell therein, for I have given you the land to possess it.", "tj": "", "tj_en": "", "rashi": "<b>והורשתם את הארץ.<\/b> וְהוֹרַשְׁתֶּם אוֹתָהּ מִיּוֹשְׁבֶיהָ, וְאָז <b>וישבתם בה<\/b> — תּוּכְלוּ לְהִתְקַיֵּם בָּהּ, וְאִם לָאו — לֹא תוּכְלוּ לְהִתְקַיֵּם בָּהּ:", "rashi_en": "והורשתם את הארץ (lit., ye shall drive out the land) — this means: and you shall dispossess it of its inhabitants, and then, וישבתם בה YOU WILL DWELL IN IT — i.e., you will be able to remain in it, but if not, you will not be able to remain in it."}, {"ch": 33, "v": 54, "aliyah": 5, "heb": "וְהִתְנַחַלְתֶּם֩ אֶת־הָאָ֨רֶץ בְּגוֹרָ֜ל לְמִשְׁפְּחֹֽתֵיכֶ֗ם לָרַ֞ב תַּרְבּ֤וּ אֶת־נַחֲלָתוֹ֙ וְלַמְעַט֙ תַּמְעִ֣יט אֶת־נַחֲלָת֔וֹ אֶל֩ אֲשֶׁר־יֵ֨צֵא ל֥וֹ שָׁ֛מָּה הַגּוֹרָ֖ל ל֣וֹ יִהְיֶ֑ה לְמַטּ֥וֹת אֲבֹתֵיכֶ֖ם תִּתְנֶחָֽלוּ׃", "onk": "וְתַחְסְנוּן יָת אַרְעָא בְעַדְבָא לְזַרְעֲיַתְכוֹן לְסַגִּיאֵי תַּסְגּוּן יָת אַחֲסַנְתְּהוֹן וְלִזְעִירֵי תַּזְעִירוּן יָת אַחֲסַנְתְּהוֹן לִדְיִפּוֹק לֵיהּ תַּמָּן עַדְבָא דִּי לֵיהּ יְהֵי לְשִׁבְטֵי אֲבָהַתְכוֹן תַּחְסְנוּן:", "onk_en": "You shall give the land as an inheritance to your families by means of a lottery; to the large [family] you shall increase its portion, to the small [family] you shall decrease its portion. To whomever the lottery [system] ordains, it shall be his; according to your paternal tribes shall you inherit.", "pj": "וְתַחְסְנוּן יַת אַרְעָא בְּעַדְבִין לִגְנִיסַתְכוֹן לְשֵׁיבַט דְעַמֵיהּ סַגִין תַּסְגֵי וּלְשֵׁיבַט דְעַמֵיהּ זְעִירִין תַּזְעֵיר לִדְיִפּוֹק לֵיהּ תַּמָן עַדְבָא דִילֵיהּ יְהֵי לְשִׁבְטָא אֲבָהַתְכוֹן תִּתְחַסְנוּן", "pj_en": "And you shall inherit the land by lots, according to your families; to the tribe whose people are many you shall enlarge, and to the tribe whose people are few, you shall diminish. According to the place where one's lot falleth, there shall his place be; you shall inherit by the tribes of your fathers.", "tj": "", "tj_en": "", "rashi": "<b>אל אשר יצא לו שמה.<\/b> מִקְרָא קָצָר הוּא זֶה: אֶל מָקום <b>אשר יצא לו שמה הגורל לו יהיה<\/b>:<br><br><b>למטות אבתיכם.<\/b> לְפִי חֶשְׁבּוֹן יוֹצְאֵי מִצְרַיִם (בבא בתרא קי\"ז); דָּ\"אַ — בְּי\"ב גְּבוּלִין כְּמִנְיַן הַשְּׁבָטִים:", "rashi_en": "אל אשר יצא לו שמה — This is an elliptical verse, the meaning being, the place where the lot falleth to anyone, that shall be his.<br><br>למטות אבותיכם ACCORDING TO THE TRIBES OF YOUR FATHERS [YE SHALL DIVIDE INHERITANCE] — i.e., according to the number of those who came out of Egypt (Bava Batra 117a; cf. Rashi on Numbers 26:55). Another explanation: ye shall divide it into twelve districts, as is the number of the tribes."}, {"ch": 33, "v": 55, "aliyah": 5, "heb": "וְאִם־לֹ֨א תוֹרִ֜ישׁוּ אֶת־יֹשְׁבֵ֣י הָאָ֘רֶץ֮ מִפְּנֵיכֶם֒ וְהָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵהֶ֔ם לְשִׂכִּים֙ בְּעֵ֣ינֵיכֶ֔ם וְלִצְנִינִ֖ם בְּצִדֵּיכֶ֑ם וְצָרְר֣וּ אֶתְכֶ֔ם עַל־הָאָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽהּ׃", "onk": "וְאִם לָא תְתָרְכוּן יָת יָתְבֵי אַרְעָא מִן קֳדָמֵיכוֹן וִיהֵי דִּי תַשְׁאֲרוּן מִנְּהוֹן <b>לְסִיעַן נָטְלַן זְיַן לָקִבְלֵיכוֹן וּלְמַשִּׁרְיַן מַקְפַּנְכוֹן<\/b> וִיעִיקוּן לְכוֹן עַל אַרְעָא דִּי אַתּוּן יָתְבִין בַּהּ:", "onk_en": "But if you do not drive out the inhabitants of the land before you, those whom you will leave over will be spikes in your eyes and thorns in your sides [<b>armed groups coming against you and battalions surrounding you<\/b>], and they will persecute you upon the land in which you settle.", "pj": "וְאִין לָא תְּתַרְכוּן יַת כָּל יַתְבֵי אַרְעָא מִן קֳדָמֵיכוֹן וִיהֵי מַה דִתְשַׁיְירוּן מִנְהוֹן לְסָכְיַין בְּעֵינָא בִּישָׁא בְּכוֹן וּמַקִיפִין לְכוֹן כִּתְרֵיסִין בְּסִיטְרֵיכוֹן וְיַתְעִיקִין יַתְכוֹן עַל אַרְעָא דְאַתּוּן יַתְבִין בָּהּ", "pj_en": "But if you will not drive out the inhabitants of the land from before you, it will be that the residue whom you have spared looking at you with an evil eye will surround you as shields (terisin) on your sides, and afflict you in the land wherein you dwell;", "tj": "", "tj_en": "", "rashi": "<b>והיה אשר תותירו מהם.<\/b> יִהְיוּ לָכֶם לְרָעָה:<br><br><b>לשכים בעיניכם.<\/b> לִיתֵדוֹת הַמְנַקְּרוֹת עֵינֵיכֶם, תַּרְגּוּם שֶׁל יְתֵדוֹת \"שִׂיכַיָּא\":<br><br><b>ולצנינם.<\/b> פּוֹתְרִין בּוֹ הַפּוֹתְרִים לְשׁוֹן מְסוּכַת קוֹצִים הַסּוֹכֶכֶת אֶתְכֶם, לִסְגֹּר וְלִכְלֹא אֶתְכֶם מֵאֵין יוֹצֵא וָבָא:<br><br><b>וצררו אתכם.<\/b> כְּתַרְגּוּמוֹ:", "rashi_en": "והיה אשר תותירו מהם THEN IT SHALL COME TO PASS THAT THOSE WHOM YE LEAVE OF THEM shall be a misfortune for you. <br><br>לשכים AS שכים IN YOUR EYES — as pins which prick out your eyes: the Targum translation of יתדות pins or pegs, is שיכיא (cf. e. g., Exodus 27:19). <br><br>ולצנינים — The lexicographers explain it in the sense of a hedge of thorns (צנינים is another form of צנים) so that the meaning here is: they will become as something which hedges you in, enclosing and imprisoning you in order that none can go forth nor come in (cf. Rashi on Joshua 23:13) (The meaning is they will hedge you in on all sides בצדיכם.<br><br>וצררו אתכם — Understand this as the Targum does: (“and they will distress you”)."}, {"ch": 33, "v": 56, "aliyah": 5, "heb": "וְהָיָ֗ה כַּאֲשֶׁ֥ר דִּמִּ֛יתִי לַעֲשׂ֥וֹת לָהֶ֖ם אֶֽעֱשֶׂ֥ה לָכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיהֵי כְּמָא דִי חֲשָׁבִית לְמֶעְבַּד לְהוֹן אַעֲבֵּד לְכוֹן:", "onk_en": "And it shall be that what I had intended to do to them I will do to you.’”", "pj": "וְהֵיכְמָא דַחֲשֵׁילִית לְמֶעֱבַד לְהוֹן אַעֲבֵיד לְכוֹן", "pj_en": "and it shall be that as I had thought to do to them I will do to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 1, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 2, "aliyah": 5, "heb": "צַ֞ו אֶת־בְּנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם כִּֽי־אַתֶּ֥ם בָּאִ֖ים אֶל־הָאָ֣רֶץ כְּנָ֑עַן זֹ֣את הָאָ֗רֶץ אֲשֶׁ֨ר תִּפֹּ֤ל לָכֶם֙ בְּֽנַחֲלָ֔ה אֶ֥רֶץ כְּנַ֖עַן לִגְבֻלֹתֶֽיהָ׃", "onk": "פַּקֵּד יָת בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲרֵי אַתּוּן עָלִין לְאַרְעָא דִכְנָעַן דָּא אַרְעָא דִּי <b>תִתְפְּלֵג<\/b> לְכוֹן בְּאַחֲסָנָא אַרְעָא דִכְנַעַן לִתְחוּמָהָא:", "onk_en": "“Instruct Bnei Yisroel and say to them: ‘When you come to the land of Canaan, this is the land which will fall to [<b>divided for<\/b>] you as hereditary property, the land of Canaan according to its borders.", "pj": "פַּקֵיד יַת בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֲרוּם אַתּוּן עָלִין לְאַרְעָא דִכְנָעַן דָא אַרְעָא דְתִתְפְּלֵיג לְכוֹן בְּאַחְסָנָא אַרְעָא דִכְנַעַן בִּתְחוּמָהָא", "pj_en": "Command the sons of Israel, and say to them: When you have entered into the land of Kenaan, this shall be the land that shall be divided to you for an inheritance, the land of Kenaan by its limits.", "tj": "", "tj_en": "", "rashi": "<b>זאת הארץ אשר תפל לכם וגו'.<\/b> לְפִי שֶׁהַרְבֵּה מִצְוֹת נוֹהֲגוֹת בָּאָרֶץ וְאֵין נוֹהֲגוֹת בְּחוּצָה לָאָרֶץ, הֻצְרַךְ לִכְתֹּב מִצְרָנֵי גְבוּלֵי רוּחוֹתֶיהָ סָבִיב, לוֹמַר לְךָ מִן הַגְּבוּלִים הַלָּלוּ וְלִפְנִים הַמִּצְוֹת נוֹהֲגוֹת (עי' גיטין ח'):<br><br><b>תפל לכם.<\/b> עַל שֵׁם שֶׁנִּתְחַלְּקָה בְגוֹרָל נִקְרֵאת חֲלֻקָּה לְשׁוֹן נְפִילָה; וּמִ\"אַ אוֹמֵר עַ\"יְ שֶׁהִפִּיל הַקָּבָּ\"ה שָׂרֵיהֶם שֶׁל שִׁבְעָה אֻמּוֹת מִן הַשָּׁמַיִם וּכְפָתָן לִפְנֵי מֹשֶׁה אָמַר לוֹ רְאֵה אֵין בָּהֶם עוֹד כֹּחַ (עי' תנחומא):", "rashi_en": "ואת הארץ אשר תפול לכם וגו׳ THIS IS THE LAND THAT SHALL FALL TO YOU [FOR AN INHERITANCE] — Since many divine commandments have to be practised in the Land of Canaan and are not to be practised outside the Land, it (Scripture) feels compelled to describe the limiting lines of the boundaries of its sides all round, in order to tell you: from these boundaries and inward the divine commands have to be practised (cf. Gittin 8a).<br><br>תפול לכם [THE LAND WHICH] FALLS FOR YOU — Because it (the land) had to be divided by lot (which is said to fall upon a person), the division is expressed by the term “falling”. — And a Midrashic explanation of why this term is employed here states: It is because the Holy One, blessed be He, cast down (more lit., made fall) from heaven the tutelary angels of the seven nations of Canaan and placed them in fetters before Moses, He said to him, (Deuteronomy 1:21) “Behold the Lord God hath put before thee the tutelary angels of the land” — there is no more strength in them (cf. Midrash Tanchuma, Masei 4 and Rashi on Deuteronomy 2:31)."}, {"ch": 34, "v": 3, "aliyah": 5, "heb": "וְהָיָ֨ה לָכֶ֧ם פְּאַת־נֶ֛גֶב מִמִּדְבַּר־צִ֖ן עַל־יְדֵ֣י אֱד֑וֹם וְהָיָ֤ה לָכֶם֙ גְּב֣וּל נֶ֔גֶב מִקְצֵ֥ה יָם־הַמֶּ֖לַח קֵֽדְמָה׃", "onk": "וִיהֵי לְכוֹן רוּחַ דָּרוֹמָא מִמַּדְבְּרָא דְצִן עַל <b>תְּחוּמֵי<\/b> אֱדוֹם וִיהֵי לְכוֹן תְּחוּם דָּרוֹמָא מִסְּיָפֵי יַמָּא דְמִלְחָא קִדּוּמָא:", "onk_en": "Your southern flank shall be from the Tzin wilderness along [the land of] [<b>the borders of<\/b>] Edom; the southern border shall be from the edge of the Salt Sea to the east.", "pj": "וְיֶהֱוֵי לְכוֹן תְּחוּם דָרוֹמָא מִן מַדְבְּרָא דְצִינֵי טַוָר פַּרְזְלָא עַל תְּחוּמֵי אֱדוֹם וְיֶהֱוֵי תְּחוּם דָרוֹמָא מִן סְיָפֵי יַמָא דְמִלְחָא מַדִינְחָא", "pj_en": "Your south border (shall be) from the Wilderness of Palms, by the iron mountain, at the confines of Edom, even the south border at the extremities of the Sea of Salt, eastward.", "tj": "וְיֶהֱוֵי לְכוֹן תְּחוּמָא מִדְרוֹמָא מִמַדְבְּרָא דִרְקַם כָּל קֳבֵיל תְּחוֹמֵיהוֹן דֶאֱדוֹמָאֵי וִיהֵי לְכוֹן דָרוֹמָא מִסְיָיפֵי יַמָא דְמִלְחָא מִן מַדִינְחָא:", "tj_en": "And your border shall be southward, from the wilderness of Rekem, over against the frontier of the Edomaee, and southward shall it be to you unto the extremity of the Sea of Salt, eastward.", "rashi": "<b>והיה לכם פאת נגב.<\/b> רוּחַ דְּרוֹמִית אֲשֶׁר מִן הַמִּזְרָח לַמַּעֲרָב:<br><br><b>ממדבר צן.<\/b> אֲשֶׁר אֵצֶל אֱדוֹם מַתְחִיל מִקְצוֹעַ דְרוֹמִית מִזְרָחִית שֶׁל אֶרֶץ תִּשְׁעַת הַמַּטּוֹת; כֵּיצַד? שָׁלוֹשׁ אֲרָצוֹת יוֹשְׁבוֹת בִּדְרוֹמָהּ שֶׁל אֶרֶץ יִשְׂרָאֵל זוֹ אֵצֶל זוֹ — קְצָת אֶרֶץ מִצְרַיִם וְאֶרֶץ אֱדוֹם כֻּלָּהּ וְאֶרֶץ מוֹאָב כֻּלָּהּ, אֶרֶץ מִצְרַיִם בְּמִקְצוֹעַ דְּרוֹמִית מַעֲרָבִית, שֶׁנֶּאֱמַר בְּפָרָשָׁה זוֹ מֵעַצְמוֹן נַחְלָה מִצְרָיִם וְהָיוּ תוֹצְאֹתָיו הַיָּמָּה, וְנַחַל מִצְרַיִם הָיָה מְהַלֵּךְ עַל פְּנֵי כָל אֶרֶץ מִצְרַיִם שֶׁנֶּאֱמַר (יהושע י\"ג) \"מִן הַשִּׁיחוֹר אֲשֶׁר עַל פְּנֵי מִצְרַיִם\", וּמַפְסִיק בֵּין אֶרֶץ מִצְרַיִם לְאֶרֶץ יִשְׂרָאֵל, וְאֶרֶץ אֱדוֹם אֶצְלָהּ לְצַד הַמִּזְרָח, וְאֶרֶץ מוֹאָב אֵצֶל אֶרֶץ אֱדוֹם בְּסוֹף הַדָּרוֹם לַמִּזְרָח. וּכְשֶׁיָּצְאוּ יִשְׂרָאֵל מִמִּצְרַיִם, אִם רָצָה הַמָּקוֹם לְקָרֵב אֶת כְּנִיסָתָם לָאָרֶץ, הָיָה מַעֲבִירָם אֶת הַנִּילוּס לְצַד צָפוֹן וּבָאִין לְאֶרֶץ יִשְׂרָאֵל, וְלֹא עָשָׂה כֵן, וְזֶהוּ שֶׁנֶּאֱמַר (שמות י\"ג) \"וְלֹא נָחָם אֱלֹהִים דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים\", שֶׁהֵם יוֹשְׁבִים עַל הַיָּם בְּמַעֲרָבָהּ שֶׁל אֶרֶץ כְּנַעַן — כָּעִנְיָן שֶׁנֶּאֱמַר בַּפְּלִשְׁתִּים (צפניה ב') \"יֹשְׁבֵי חֶבֶל הַיָּם גּוֹי כְּרֵתִים\" — וְלֹא נָחָם אוֹתוֹ הַדֶּרֶךְ, אֶלָּא הֱסִבָּן וְהוֹצִיאָם דֶּרֶךְ דְּרוֹמָהּ אֶל הַמִּדְבָּר, וְהוּא שֶׁקְּרָאוֹ יְחֶזְקֵאל (יחזקאל כ') \"מִדְבַּר הָעַמִּים\", לְפִי שֶׁהָיוּ כַמָּה אֻמּוֹת יוֹשְׁבִים בְּצִדּוֹ; וְהוֹלְכִין אֵצֶל דְּרוֹמָהּ מִן הַמַּעֲרָב כְּלַפֵּי מִזְרָח תָּמִיד עַד שֶׁבָּאוּ לִדְרוֹמָהּ שֶׁל אֶרֶץ אֱדוֹם, וּבִקְּשׁוּ מִמֶּלֶךְ אֱדוֹם שֶׁיַּנִּיחֵם לַעֲבֹר דֶּרֶךְ אַרְצוֹ וּלְהִכָּנֵס לָאָרֶץ דֶּרֶךְ רָחְבָּהּ וְלֹא רָצָה, וְהֻצְרְכוּ לִסְבֹּב אֶת כָּל דְּרוֹמָהּ שֶׁל אֱדוֹם עַד בּוֹאָם לִדְרוֹמָהּ שֶׁל אֶרֶץ מוֹאָב, שֶׁנֶּאֱמַר (שופטים י\"א) \"וְגַם אֶל מֶלֶךְ מוֹאָב שָׁלַח וְלֹא אָבָה\", וְהָלְכוּ כָּל דְּרוֹמָהּ שֶׁל מוֹאָב עַד סוֹפָהּ, וּמִשָּׁם הָפְכוּ פְנֵיהֶם לַצָּפוֹן עַד שֶׁסָּבְבוּ כָל מֶצֶר מִזְרָחִי שֶׁלָּהּ לְרָחְבָּהּ; וּכְשֶׁכִּלּוּ אֶת מִזְרָחָהּ, מָצְאוּ אֶת אֶרֶץ סִיחוֹן וְעוֹג שֶׁהָיוּ יוֹשְׁבִין בְּמִזְרָחָהּ שֶׁל אֶרֶץ כְּנַעַן וְהַיַּרְדֵּן מַפְסִיק בֵּינֵיהֶם, וְזֶהוּ שֶׁנֶּאֱמַר בְּיִפְתָּח (שם) \"וַיֵּלֶךְ בַּמִּדְבָּר וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב\", וְכָבְשׁוּ אֶת אֶרֶץ סִיחוֹן וְעוֹג שֶׁהָיְתָה בִּצְפוֹנָהּ שֶׁל אֶרֶץ מוֹאָב וְקָרְבוּ עַד הַיַּרְדֵּן, וְהוּא כְנֶגֶד מִקְצוֹעַ צָפוֹנָה מַעֲרָבָה שֶׁל אֶרֶץ מוֹאָב; נִמְצָא שֶׁאֶרֶץ כְּנַעַן שֶׁבְּעֵבֶר הַיַּרְדֵּן לַמַּעֲרָב, הָיָה מִקְצוֹעַ דְּרוֹמִית מִזְרָחִית שֶׁלָּהּ אֵצֶל אֱדוֹם:", "rashi_en": "והיה לכם פאת נגב THE SOUTHERN פאה SHALL BE UNTO YOU — i.e. the south side which extends from east to west (פאה does not here mean “corner”).<br><br>ממדבר צין FROM THE WILDERNESS OF ZIN which is next to Edom there begins the south-east comer of the land of the nine tribes. How is this so? Three lands are situated to the south of the Land of Israel, one next to the other; part of the land of Egypt, and the whole land of Edom, and the whole of the land of Moab. The land of Egypt is at the south-west comer, as it is said in this section, (v. 5) that the southern boundary shall pass “from Azmon unto the Brook of Egypt, and the goings out thereof shall be at the sea” (i.e., at the west). Now the Brook of Egypt ran along the whole land of Egypt — as it is said, (Joshua 13:3) “From the Shihor which is before Egypt”, and divided the land of Egypt from the land of Israel. The land of Edom is next to it on its east. The land of Moab is next to the land of Edom at the end of the south side of Palestine at the east (i.e., the south eastern corner). — When Israel came out of Egypt if the Omnipresent had wished to bring about their entry into the Land quickly, he would have led them over the Nile northwards and they would have so come into the Land of Israel; but He did not do so. This is what is stated, (Exodus 13:17) “And God did not lead them by way of the land of the Philistines” who dwelt by the sea in the west of the land of Canaan — just as it is said of the Philistines, (Zephaniah 2:5) “inhabitants of the sea-coast, the nation of the Cherethites”. — However, He did not lead them by that route, but He made them travel round, and brought them out by a southern route into the wilderness. It is that which Ezekiel (Ezekiel 20:35) calls “the wilderness of the peoples”, because several peoples dwelt beside it. Then they proceeded along the south always from the west to the east, until they came to the south of the land of Edom. They asked of the king of Edom that he should permit them to pass by way of his land and to enter the land of Palestine along its (Edom’s) breadth. He, however, refused, and they were compelled to travel along the whole south of Edom until they came to the south of the land of Moab, as it is said, (Judges 11:17) “And also to the king of Moab he sent, but he refused”. Therefore they proceeded along the whole south of Moab unto its very end, and from there they turned their faces to the north until they had gone along its entire eastern boundary along its breadth. Wien they arrived to the end of its eastern side, they came upon the land of Sihon and Og who dwelt at the east of the land of Canaan with the Jordan dividing them (dividing the land of Sihon and Og from Canaan). This is what is stated in the history of Jephthah, (Judges 11:18) “Then he (Israel) went through the wilderness and compassed the land of Edom and the land of Moab and came by the east of the land of Moab”. They subdued the land of Sihon and Og which was on the north of Moab and they approached right up to the Jordan, which was opposite the north-west corner of the land of Moab. It follows therefore that the part of the land of Canaan which was on the west side of the Jordan had its south-east corner next to Edom. (This explains the words והיה לכם פאת נגב … על ידי אדום in our text.)"}, {"ch": 34, "v": 4, "aliyah": 5, "heb": "וְנָסַ֣ב לָכֶם֩ הַגְּב֨וּל מִנֶּ֜גֶב לְמַעֲלֵ֤ה עַקְרַבִּים֙ וְעָ֣בַר צִ֔נָה <span class=\"mam-kq\"><span class=\"mam-kq-k\">(והיה)<\/span> <span class=\"mam-kq-q\">[וְהָיוּ֙]<\/span><\/span> תּֽוֹצְאֹתָ֔יו מִנֶּ֖גֶב לְקָדֵ֣שׁ בַּרְנֵ֑עַ וְיָצָ֥א חֲצַר־אַדָּ֖ר וְעָבַ֥ר עַצְמֹֽנָה׃", "onk": "וְיַסְחַר לְכוֹן תְּחוּמָא מִדְּרוֹמָא <b>לְמַסְקָנָא<\/b> דְעַקְרַבִּים וִיעִבַר לְצִן וִיהוֹן מַפְּקָנוֹהִי מִדְּרוֹמָא <b>לִרְקַם גֵּיאָה<\/b> וְיִפּוֹק לַחֲצַר אַדָּר וִיעִבַר לְעַצְמוֹן:", "onk_en": "The border then turns south of Maaleh [<b>the heights of<\/b>] Akrabim passing toward Tzin; and its outskirts shall be south of Kadeish Barne’a [<b>Rekam Geyoh<\/b>], and then it shall extend to Chatzar Adar and continue toward Atzmon.", "pj": "וְיַקִיף לְכוֹן תְּחוּמָא מִן דָרוֹמָא לְמִסֵיקְתָּא דְעַקְרַבִּים וִיעִיבַר לְצִינֵי טַוָר פַּרְזְלָא וִיהוֹן מַפְקָנוֹי מִן דָרוֹמָא לִרְקַם גֵיאָה וְיִפּוֹק לְטִירִית אַדְרַיָא וִיעִיבַר לְקֵיסַם", "pj_en": "And your border shall turn from the south to the ascent of Akrabbith, and pass on to the palms of the mountain of iron, and the going forth thereof shall be southward of Rekem Giah, and shall go onward to the tower of Adar, and pass over to Kesam.", "tj": "וְיַקִיף לְכוֹן תְּחוּמָא דָרוֹמַיָא מִן מַסְקִיוּתָא דְעַקְרַבִּין דַעֲבַר בְּטוּר פַּרְזְלָא וְיֶהֱוֵי מַפְקָנוֹי מִדָרוֹם לִרְקַם דְגִיעָא וְיִפּוֹק דִירַת אֲדָרַיָא וְיַעֲבַר בִּקְסָם:", "tj_en": "And your South border shall go round from the ascent of Akrabim, which passeth over by the mountain of iron, and its outgoings shall be from the south unto Rekem Giah, and proceed to the buildings of the threshing floors, and pass on to Kesam.", "rashi": "<b>ונסב לכם הגבול מנגב למעלה עקרבים.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר \"וְנָסַב\" אוֹ \"וְיָצָא\" מְלַמֵּד שֶׁלֹּא הָיָה הַמֶּצֶר שָׁוֶה אֶלָּא הוֹלֵךְ וְיוֹצֵא לַחוּץ; יוֹצֵא הַמֶּצֶר וְעוֹקֵם לְצַד צְפוֹנוֹ שֶׁל עוֹלָם, בַּאֲלַכְסוֹן לַמַּעֲרָב, וְעוֹבֵר הַמֶּצֶר בִּדְרוֹמָהּ שֶׁל מַעֲלֵה עַקְרַבִּים, נִמְצָא מַעֲלֵה עַקְרַבִּים לִפְנִים מִן הַמֶּצֶר:<br><br><b>ועבר צנה.<\/b> אֶל צִן, כְּמוֹ מִצְרַיְמָה:<br><br><b>והיו תוצאתיו.<\/b> קְצוֹתָיו, בִּדְרוֹמָהּ שֶׁל קָדֵשׁ בַּרְנֵעַ:<br><br><b>ויצא חצר אדר.<\/b> מִתְפַּשֵּׁט הַמֶּצֶר וּמַרְחִיב לְצַד צָפוֹן שֶׁל עוֹלָם וְנִמְשָׁךְ עוֹד בַּאֲלַכְסוֹן לַמַּעֲרָב, וּבָא לוֹ לַחֲצַר אַדָּר, וּמִשָּׁם לְעַצְמוֹן, וּמִשָּׁם לְנַחַל מִצְרַיִם; וּלְשׁוֹן וְנָסַב הָאָמוּר כָּאן, לְפִי שֶׁכָּתַב וְיָצָא חֲצַר אַדָּר, שֶׁהִתְחִיל לְהַרְחִיב מִשֶּׁעָבַר אֶת קָדֵשׁ בַּרְנֵעַ, וְרֹחַב אוֹתָהּ רְצוּעָה שֶׁבָּלְטָה לְצַד צָפוֹן הָיְתָה מִקָּדֵשׁ בַּרְנֵעַ עַד עַצְמוֹן, וּמִשָּׁם וָהָלְאָה נִתְקַצֵּר הַמֶּצֶר וְנָסַב לְצַד הַדָּרוֹם וּבָא לוֹ לְנַחַל מִצְרַיִם, וּמִשָּׁם לְצַד הַמַּעֲרָב אֶל הַיָּם הַגָּדוֹל שֶׁהוּא מֶצֶר מַעֲרָבָהּ שֶׁל כָּל אֶרֶץ יִשְׂרָאֵל, נִמְצָא שֶׁנַּחַל מִצְרַיִם בְּמִקְצוֹעַ מַעֲרָבִית דְּרוֹמִית:", "rashi_en": "ונסב לכם הגבול מנגב למעלה עקרבים — AND YOUR BORDER SHALL TURN ABOUT SOUTHWARD OF THE ASCENT OF AKRABBIM - In every passage in this chapter where it says ונסב or ויצא, it tells us that the boundary line was not straight (i.e., did not continue in the same straight line) but in proceeding it projected outside this straight line. Here, the word means that the boundary line left the straight line and bent towards the north of the world (in a northerly direction) diagonally towards the west, and the boundary line passed by the south of the Ascent of Akrabbim. Consequently the Ascent of Akrabbim was within the boundary (cf. Rashi on Joshua 15:3).<br><br>ועבר צנה IT SHALL PASS ALONG TO ZIN — צנה is the same as אל צין “to Zin”, like מצרימה \"to Egypt\". <br><br>והיו תוצאתיו AND THE GOINGS OUT THEREOF SHALL BE — i.e., its ends shall be at the south of Kadesh-Barnea.<br><br>ויצא חצר אדר AND IT SHALL GO FORTH TO HAZZAR-ADDAR — the boundary spreads and widens towards the north of the world and extends further obliquely to the west, till it comes to Hazzar-Addar, thence to Azmon and thence to the Brook of Egypt. — The expression ונסב, \"and it turned about” which is used here (v. 5) (“and the boundary shall turn about”) is employed because it wrote, “and it shall go forth to Hazzar-Addar”, i.e., that it began to widen out when it had passed Kadesh-Bamea. The widening of that strip which projected northwards was only from Kadesh-Barnea to Azmon (i.e. that strip widened only between those two places), but from Azmon and further on, the boundary became narrower and turned towards the south and came to the Brook of Egypt, and thence westwards to the Great Sea which is the western boundary of the entire land of Israel. It follows, therefore, that the Brook of Egypt is at the south-west corner."}, {"ch": 34, "v": 5, "aliyah": 5, "heb": "וְנָסַ֧ב הַגְּב֛וּל מֵעַצְמ֖וֹן נַ֣חְלָה מִצְרָ֑יִם וְהָי֥וּ תוֹצְאֹתָ֖יו הַיָּֽמָּה׃", "onk": "וְיַסְחַר תְּחוּמָא מֵעַצְמוֹן לְנַחֲלָא דְמִצְרָיִם וִיהוֹן מַפְּקָנוֹהִי לְיַמָּא:", "onk_en": "The border turns from Atzmon toward the Egyptian Estuary and its outskirts shall reach the sea.", "pj": "וְיַקִיף תְּחוּמָא מִקֵיסָם לְנִילוֹס דְמִצְרָאֵי וִיהוֹן מַפְקָנוֹי לְמַעֲרָבָא", "pj_en": "And the border shall wind round from Kesam unto Nilos, of the Mizraee, and its outgoings shall be to the west.", "tj": "וְיַקִיף תְּחוּמָא מִן קְסַם לְנִילוֹס מִצְרַיִם וִיהוֹן מַפְקָנוֹי מִן מַעַרְבָא:", "tj_en": "And the border shall wind round from Kesam unto Nilos Mizraim, and the going out of it shall be at the sea.", "rashi": "<b>והיו תוצאתיו הימה.<\/b> אֶל מֶצֶר הַמַּעֲרָב שֶׁאֵין עוֹד גְּבוּל נֶגֶב מַאֲרִיךְ לְצַד הַמַּעֲרָב מִשָּׁם וָהָלְאָה:", "rashi_en": "והיו תוצאותיו הימה AND ITS GOINGS OUT SHALL BE AT THE SEA i.e. at the western boundary, because the southern border does not extend any more west of there and further on."}, {"ch": 34, "v": 6, "aliyah": 5, "heb": "וּגְב֣וּל יָ֔ם וְהָיָ֥ה לָכֶ֛ם הַיָּ֥ם הַגָּד֖וֹל וּגְב֑וּל זֶֽה־יִהְיֶ֥ה לָכֶ֖ם גְּב֥וּל יָֽם׃", "onk": "וּתְחוּם מַעַרְבָא וִיהֵי לְכוֹן יַמָּא רַבָּא וּתְחוּמֵיהּ דֵּין יְהֵי לְכוֹן תְּחוּם מַעֲרְבָא:", "onk_en": "As for the western border; it shall be the border of the Great Sea, this shall be your western border.", "pj": "וּתְחוּם מַעֲרָבָא וְיֶהֱוֵי לְכוֹן יַמָא רַבָּא אוֹקְיָינוּס וּתְחוּמֵיהּ הִינוּן מֵי בְּרֵאשִׁית עִם מַיָא קַדְמָאִין דְהַווֹן בְּגַוֵיהּ אַבִּירוֹי וּפַרְכִּידוֹי כִּרְכוֹי וּמַדִנְתֵּיהּ נִיסוֹי וּמְחוּזוֹי סְפִינְתֵּיהּ וְאַלְגַוְתֵּיהּ דֵין יֶהֱוֵי לְכוֹן תְּחוּם מַעַרְבַיָא", "pj_en": "And for the western border you shall have the Great Ocean Sea; its limits are the waters of the beginning with the waters of old which are in its depth; its capes and havens, its creeks and its cities, its islands and ports, its ships and its recesses: this shall be your border westward.", "tj": "וּתְחוּם יַמָא רַבָּא הוּא אוֹקְיָנוּס נָסוּי וּמֵחֲדוֹי וּסְפִינָתָא עִם מַיָא קֳדָמַיָא דְאִית בְּגַוֵיהּ הִינוּן מֵי בְרֵאשִׁית דֵין יֶהֱוֵי לְכוֹן תְּחוּמָא מַעַרְבַיָא:", "tj_en": "And the (west) border shall be the Great Ocean Sea; its isles, ports, and ships, with the ancient waters that are in it, the waters of the beginning; this shall be your western border.", "rashi": "<b>וגבול ים.<\/b> וּמֶצֶר מַעֲרָבִי מַהוּ?<br><br><b>והיה לכם הים הגדול.<\/b> לְמֶצֶר:<br><br><b>וגבול.<\/b> הַנִּסִּין שֶׁבְּתוֹךְ הַיָּם אַף הֵם מִן הַגְּבוּל, וְהֵם אִיִּים שֶקּוֹרִין איזל\"ס:", "rashi_en": "ים וגבול These words (apparently unconnected with what follows) mean: AND THE WESTERN BOUNDARY, what forms that?<br><br>והיה לכם הים הגדול THE GREAT SEA SHALL BE UNTO YOU for the boundary.<br><br>וגבול AND THE BOUNDARY — the נסין which are in the sea also belong to the boundary; they are what are called isles in O. F. (Gittin 8a)."}, {"ch": 34, "v": 7, "aliyah": 5, "heb": "וְזֶֽה־יִהְיֶ֥ה לָכֶ֖ם גְּב֣וּל צָפ֑וֹן מִן־הַיָּם֙ הַגָּדֹ֔ל תְּתָא֥וּ לָכֶ֖ם הֹ֥ר הָהָֽר׃", "onk": "וְדֵין יְהֵי לְכוֹן תְּחוּם צִפּוּנָא מִן יַמָּא רַבָּא תְּכַוְּנוּן לְכוֹן לְהֹר טוּרָא:", "onk_en": "This shall be your northern border; from the Great Sea turn yourselves to Hor Hahar.", "pj": "וְדֵין יֶהֱוֵי לְכוֹן תְּחוּם צִפּוּנָא מִן יַמָא רַבָּא תְּכַוְונוּן לְכוֹן לְטַוְורוֹס אוּמָנוֹס", "pj_en": "And this shall be your northern border; — from the Great Sea you shall appoint to you unto Mount Umanis.", "tj": "וְדֵין יֶהֱוֵי לְכוֹן תְּחוּם צִפּוּנַיָא מִן יַמָא רַבָּא תְּכַוְונוּן לְכוֹן לְטַוְורוֹס מָנוֹס:", "tj_en": "And this shall be your northern limit: from the Great Sea you shall appoint to you unto Mount Manos.", "rashi": "<b>גבול צפון.<\/b> מֶצֶר צָפוֹן:<br><br><b>מן הים הגדל תתאו לכם הר ההר.<\/b> שֶׁהוּא בְמִקְצוֹעַ צְפוֹנִית מַעֲרָבִית וְרֹאשׁוֹ מַשְׁפִּיעַ וְנִכְנָס לְתוֹךְ הַיָּם, וְיֵשׁ מֵרֹחַב הַיָּם לִפְנִים הֵימֶנּוּ וְחוּצָה הֵימֶנּוּ:<br><br><b>תתאו.<\/b> תְּשַׁפְּעוּ לָכֶם, לִנְטוֹת מִמַּעֲרָב לַצָּפוֹן, אֶל הֹר הָהָר:<br><br><b>תתאו.<\/b> לְשׁוֹן סִבָּה, כְּמוֹ \"אֶל תָּא הָרָצִים\" (מלכים א י\"ד), \"וְתָאֵי הַשַּׁעַר\" (יחזקאל מ') — הַיָּצִיעַ, שֶׁקּוֹרִין אפנדי\"ץ, שֶׁהוּא מוּסָב וּמְשֻׁפָּע:", "rashi_en": "גבול צפון means THE NORTHERN BOUNDARY.<br><br>מן הים הגדול תתאו לכם הר ההר FROM THE GREAT SEA YE SHALL MARK OUT YOUR LINE UNTO MOUNT HOR, which is at the north-west corner, and its top slopes down and goes to the sea and there is some of the breadth of the sea inward of it and outside it.<br><br>תתאו means, YE MUST MOVE IN A SLANTING DIRECTION so as to move from west to north to Mount Horayot<br><br>תתאו is an expression denoting “a slanting turn”, just as in (1 Kings 14:28) “the slanting chamber (תא) of the runners\" and (Ezekiel 40:10) “and the slanting chambers (תאי) of the gate”. The תא is a chamber with a sloping roof, which is called in O. F. apendiz; it is called תא because it leans and slopes (a lean-to or panthouse)."}, {"ch": 34, "v": 8, "aliyah": 5, "heb": "מֵהֹ֣ר הָהָ֔ר תְּתָא֖וּ לְבֹ֣א חֲמָ֑ת וְהָי֛וּ תּוֹצְאֹ֥ת הַגְּבֻ֖ל צְדָֽדָה׃", "onk": "מֵהוֹר טוּרָא <b>תְּכַוְּנוּן<\/b> לִמְטֵי חֲמָת וִיהוֹן מַפְּקָנוֹהִי דִתְחוּמָא לִצְדָד:", "onk_en": "From Hor Hahar turn to [<b>direct yourselves toward<\/b>] Levo Chamas and the outskirts of the border shall be toward Tzedad.", "pj": "מִטַוְורוֹס אוּמָנוֹס תְּכַוְונוּן לְכוֹן מַעֲלָךְ לִטְבַרְיָא וִיהוֹן מַפְקָנוֹי דִתְחוּמָא מִן תְּרֵי צִיטְרוֹי מְכַוְונִין לְכַרְכּוֹר דְבַר זַעֲמָה וּלְכַרְכּוֹר דְבַר סְנִיגוֹרָא וְדִוָוקִינוֹס וְתַרְנְגוֹלָא עַד קִסְרִין מַעֲלָךְ לְאָבְלַס דְקִילְקָאֵי", "pj_en": "From Mount Umanis you shall appoint to you (a line) as thou goest up to the entrance of Tebaria, and the outgoings of the border at its two sides, unto Kadkor Of Bar Zahama, and to Kadkol of Bar Sanigora, and Divakinos and Tarnegola unto Kesarin, where thou goest up to Abelas of Cilicia.", "tj": "מִטַוְורוֹס מָנוֹס תְּכַוְונוּן לְכוֹן לְמַעֲלֵי אַנְטוּכְיָיא וִיהוֹן מַפְקָנוֹי תְּחוּמָא דְאַוְולַס דְקִילְקָאֵי:", "tj_en": "From Mount Manos you shall extend to the entrance of Antiochia, and the outgoing shall be unto Abelas of the Cilicians;", "rashi": "<b>מהר ההר.<\/b> תָּסֹבּוּ וְתֵלְכוּ אֶל מֶצֶר הַצָּפוֹן לְצַד הַמִּזְרָח, וְתִפְגְּעוּ בִּלְבֹא חֲמָת, זוֹ אַנְטוֹכְיָא:<br><br><b>תוצאת הגבל.<\/b> סוֹפֵי הַגְּבוּל; כָּל מָקוֹם שֶׁנֶּאֱמַר תּוֹצְאוֹת הַגְּבוּל, אוֹ הַמֶּצֶר כָּלֶה שָׁם לְגַמְרֵי וְאֵינוֹ עוֹבֵר לְהַלָּן כְּלָל, אוֹ מִשָּׁם מִתְפַּשֵּׁט וּמַרְחִיב וְיוֹצֵא לַאֲחוֹרָיו לְהִמָּשֵׁךְ לְהַלָּן בַּאֲלַכְסוֹן יוֹתֵר מִן הָרֹחַב הָרִאשׁוֹן, וּלְעִנְיַן רֹחַב הַמִּדָּה הָרִאשׁוֹן קְרָאוֹ תּוֹצָאוֹת, שֶׁשָּׁם כָּלְתָה אוֹתָהּ מִדָּה:", "rashi_en": "מהר ההר FROM MOUNT HOR you shall turn about and go along the northern boundary towards the eastern side and you will arrive at the “Entrance to Hamath”, which is Antioch.<br><br>תוצאות הגבול means, THE END OF THE BOUNDARY. In every passage where it is said \"the end of the boundary”, either the boundary ends there entirely, not passing further on at all (cf. Rashi on v. 5), or from there it spreads and widens, projecting from the straight line backwards to extend itself further on in a more slanting direction than the first widening. And relative to the measurement of the first breadth it calls it תוצאות (the goings forth, the endings), because there that measurement ends."}, {"ch": 34, "v": 9, "aliyah": 5, "heb": "וְיָצָ֤א הַגְּבֻל֙ זִפְרֹ֔נָה וְהָי֥וּ תוֹצְאֹתָ֖יו חֲצַ֣ר עֵינָ֑ן זֶֽה־יִהְיֶ֥ה לָכֶ֖ם גְּב֥וּל צָפֽוֹן׃", "onk": "וְיִפּוֹק תְּחוּמָא לְזִפְרוֹן וִיהוֹן מַפְּקָנוֹהִי לַחֲצַר עֵינָן דֵּין יְהֵי לְכוֹן תְּחוּם צִפּוּנָא:", "onk_en": "The border shall then extend toward Zifron, and its outskirts shall be at Chatzar Einan; this shall be your northern border.", "pj": "וְיִפּוֹק תְּחוּמָא לְקֶרֶן זְכוּתָא וּלְגַבְתָּא דְחַטְמוֹנָא וִיהוֹן מַפְקָנוֹי לְכִירַיָא דְבֵית סָכָל וְלִמְצִיעוּת דָרָתָא רַבְּתָא דִמְמִצְעָא בֵּין טִירַת עִינְוְותָא לְבֵית דַרְמָשֶק דֵין יֶהֱוֵי לְכוֹן תְּחוּם צִיפּוּנָא", "pj_en": "And the border shall go on unto Keren Zekutha, and to Gibra Hatmona, and its outgoings shall be at Keria Bethsekel, and to the midst of the great court (darela rabtha), which is at Mizeha, between the towers of Hinvetha and Darmeshek: this shall be your northern limit.", "tj": "וְיִפְקוּן תְּחוּמָא לְזָפֵירִין וְיֶהֱווֹן מַפְקָנוֹי דִירַת עַיְינוּתָא דֵין דְיֶהֱוֵי לְכוֹן תְּחוּם צִיפוּנַיָא:", "tj_en": "and the border shall go to Zapherin, and its outgoing be at the dwellings of Hainutha,", "rashi": "<b>והיו תוצאתיו חצר עינן.<\/b> הוּא הָיָה סוֹף הַמֶּצֶר הַצְּפוֹנִי, וְנִמְצֵאת חֲצַר עֵינָן בְּמִקְצוֹעַ צְפוֹנִית מִזְרָחִית, וּמִשָּׁם <b>והתאויתם לכם<\/b> אֶל מֶצֶר הַמִּזְרָחִי:", "rashi_en": "והיו תוצאתיו חצר עינן AND THE GOINGS OUT OF IT SHALL BE AT HAZAR-ENAN — This place was the end of the northern boundary. It follows therefore that Hazar-Enan was in the north-east corner. And from there, “you shall then turn yourselves\" toward the eastern border. "}, {"ch": 34, "v": 10, "aliyah": 5, "heb": "וְהִתְאַוִּיתֶ֥ם לָכֶ֖ם לִגְב֣וּל קֵ֑דְמָה מֵחֲצַ֥ר עֵינָ֖ן שְׁפָֽמָה׃", "onk": "וּתְכַוְּנוּן לְכוֹן לִתְחוּם קִדּוּמָא מֵחֲצַר עֵינָן לִשְׁפָם:", "onk_en": "You shall turn yourselves toward the eastern border from Chatzar Einan to Shefam.", "pj": "וּתְכַוְונוּן לְכוֹן לִתְחוּם מַדִינְחָא מִטֵירַת עִינְוְותָא לְאַפְמִיאָה", "pj_en": "And you shall appoint your eastern border from the of Hinvetba unto Apamea;", "tj": "וּתְכַוְונוּן לְכוֹן תְּחוּמָא מַעַרְבַיָא מִדִירַת עַיְינוּתָא לְאַפַּמְיָס:", "tj_en": "unto Apamea, unto Dopline, east of Hainutha,", "rashi": "<b>והתאויתם.<\/b> לְשׁוֹן הֲסִבָּה וּנְטִיָּה, כְּמוֹ \"תְּתָאוּ\":<br><br><b>שפמה.<\/b> בַּמֶּצֶר הַמִּזְרָחִי, וּמִשָּׁם הָרִבְלָה:", "rashi_en": "והתאויתם לכם YOU SHALL TURN YOURSELVES to the eastern boundary. והתאויתם denotes turning round, just the same as תתאו (v. 7). <br><br>שפמה TO SHEPAM on the eastern boundary, and from there to Riblah."}, {"ch": 34, "v": 11, "aliyah": 5, "heb": "וְיָרַ֨ד הַגְּבֻ֧ל מִשְּׁפָ֛ם הָרִבְלָ֖ה מִקֶּ֣דֶם לָעָ֑יִן וְיָרַ֣ד הַגְּבֻ֔ל וּמָחָ֛ה עַל־כֶּ֥תֶף יָם־כִּנֶּ֖רֶת קֵֽדְמָה׃", "onk": "וְיֵחוֹת תְּחוּמָא מִשְּׁפָם לְרִבְלָה מִמַּדְנַח לָעָיִן וְיֵחוֹת תְּחוּמָא וְיִמְטֵי עַל כֵּיף יַם <b>גִנֵסַר<\/b> קִדּוּמָא:", "onk_en": "The border shall then descend from Shefam to Rivlah to the east of Ayin; the border shall descend and contact the bank of the eastern shore of the Kineres Sea [<b>of Ginesar<\/b>].", "pj": "וְיֵיחוֹת תְּחוּמָא מִן אַפְמִיאָה לִדְפַנֵי מִן מַדְנַח לְעֵינְוָותָא וְיֵיחוֹת תְּחוּמָא לִמְעָרַת סַנִיאָס וּמִמְעָרַת סַנִיאָס יֵיחוֹת תְּחוּמָא לְטַוָר תַּלְגָא וּמִטַוָר תַּלְגָא יֵיחוֹת תְּחוּמָא לְעֵינָן וּמֵעֵינָן יֵיחוֹת תְּחוּמָא וְיִסַב מֵישְׁרַיָא מֵישַׁר נַחֲלֵי אַרְנוֹנָא וְיֵיתֵי לְמַדְבְּרָא וְצִינֵי טַוָר פַּרְזְלָא מֵי מַצוּתָא אַבְּלוּ וּדְמוּכָא סְמִיךְ לִגְנִיסַת כְּרַךְ מַלְכוּתְהוֹן דֶאֱדוֹמָאֵי אַחֲסָנוּת שֵׁיבַט רְאוּבֵן וְגָד וּפַלְגוּת שֵׁיבַט מְנַשֶׁה וְיֵיחוֹת תְּחוּמָא וְיַקִיף לִתְחוּם יַמָא דִגְנֵיסַר מִמַדִינְחָא", "pj_en": "and the border shall descend from Apamea to Dophne, eastward of Hinvetha; thence the border shall go down to the cavern of Panias, and from the cavern of Panias to the mountain of snow, and from the mountain of snow to Henan, and from Henan the border shall go down and encompass the plain of the river of Arnon, and arrive at the wilderness and the palms of the mountain of iron, take in the Waters of Contention, and rest at Ginesar, a city of the kings of the Edomites, the inheritance of the tribes of Reuben and Gad, and the half tribe of Menasheh; and the border shall descend and encompass the Sea of Genesar on the east.", "tj": "וְיֵחוֹת תְּחוּמָא לַאֲפַמְיָס לְדָפְנֵי מַדִינְחָא לְעַיְנוּתָא וְיֵחוֹת תְּחוּמָא וְיַמְטֵי סְמִיךְ לְיַמָא דְגִינוּסָר מִן מַעַרְבָא:", "tj_en": "and shall descend and come down upon the Sea of Ginesar at the west.", "rashi": "<b>מקדם לעין.<\/b> שֵׁם מָקוֹם, וְהַמֶּצֶר הוֹלֵךְ בְּמִזְרָחוֹ, נִמְצָא הָעַיִן לִפְנִים מִן הַמֶּצֶר וּמֵאֶרֶץ יִשְׂרָאֵל הוּא:<br><br><b>וירד הגבול.<\/b> כָּל שֶׁהַגְּבוּל הוֹלֵךְ מִצָּפוֹן לַדָּרוֹם הוּא יוֹרֵד וְהוֹלֵךְ:<br><br><b>ומחה על כתף ים כנרת קדמה.<\/b> שֶׁיְּהֵא יָם כִּנֶּרֶת תּוֹךְ לַגְּבוּל, בַּמַּעֲרָב, וְהַגְּבוּל בְּמִזְרַח יָם כִּנֶּרֶת, וּמִשָּׁם יָרַד אֶל הַיַּרְדֵּן, וְהַיַּרְדֵּן מוֹשֵׁךְ וּבָא מִן הַצָּפוֹן לַדָּרוֹם בַּאֲלַכְסוֹן, נוֹטֶה לְצַד מִזְרָח מִתְקָרֵב לְצַד אֶרֶץ כְּנַעַן כְּנֶגֶד יָם כִּנֶּרֶת, וּמוֹשֵׁךְ לְצַד מִזְרָחָהּ שֶׁל אֶרֶץ יִשְׂרָאֵל (כְּנֶגֶד יָם כִּנֶּרֶת) עַד שֶׁנּוֹפֵל בְּיָם הַמֶּלַח, וּמִשָּׁם כָּלֶה הַגְּבוּל בְּתוֹצְאוֹתָיו אֶל יָם הַמֶּלַח, שֶׁמִּמֶּנּוּ הַתְחָלַת מֶצֶר מִקְצוֹעַ דְּרוֹמִית מִזְרָחִית, הֲרֵי סוֹבֶבֶת אוֹתָהּ לְאַרְבַּע רוּחוֹתֶיהָ:", "rashi_en": "מקדם לעין ON THE EAST SIDE OF AIN — עין is the name of a place. The boundary went to the east of it, and consequently Ain is within the boundary and was part of the land of Israel.<br><br>וירד הגבול AND THE BOUNDARY SHALL GO DOWN — The more the boundary goes from north to south it goes down more and more.<br><br>ומחה על כתף ים כנרת קדמה AND SHALL SMITE UPON THE SLOPE OF THE SEA OF CHINNERETH EASTWARD, so that the sea of Chinnereth is within the border to the west, and the boundary is on the east (קדמה) of the sea of Chinnereth. From there it went down to the Jordan. The Jordan extends from the north to the south in a slanting direction, inclining towards the east, but comes nearer the land of Canaan opposite the sea of Chinnereth, and extends further along the eastern side of the land of Israel [opposite the sea of Chinnereth] until it falls into the Salt Sea. There the boundary ends through its goings forth into the Salt Sea from which, too, is the beginning of the boundary at the south-east comer. — Here, then, you have a description of what bounds it (the land) round about on its four sides."}, {"ch": 34, "v": 12, "aliyah": 5, "heb": "וְיָרַ֤ד הַגְּבוּל֙ הַיַּרְדֵּ֔נָה וְהָי֥וּ תוֹצְאֹתָ֖יו יָ֣ם הַמֶּ֑לַח זֹאת֩ תִּהְיֶ֨ה לָכֶ֥ם הָאָ֛רֶץ לִגְבֻלֹתֶ֖יהָ סָבִֽיב׃", "onk": "וְיֵחוֹת תְּחוּמָא לְיַרְדְּנָא וִיהוֹן מַפְּקָנוֹהִי לְיַמָּא דְמִלְחָא דָּא תְהֵי לְכוֹן אַרְעָא לִתְחוּמָהָא סְחוֹר סְחוֹר:", "onk_en": "The border shall then descend along the Yardein and its outskirts shall be the Salt (Dead) Sea. This should be your land according to its borders all around.’”", "pj": "וְיֵיחוֹת תְּחוּמָא לְיוֹרְדְנָא וְיֶהֱווֹן מִפְקָנוֹי לְיַמָא דְמִלְחָא רֵיקָם גֵיעָה מִן דָרוֹמָא טַוְורוֹס אוּמָנוֹס מִן צִפּוּנָא יַמָא רַבָּא מִן מַעַרְבָא יַמָא דְמִלְחָא מִן מַדִינְחָא דָא תֶּהֱוֵי לְכוֹן אַרְעָא דְיִשְרָאֵל לְמִצְרָנֵי תְחוּמָהָא חֲזוֹר חֲזוֹר", "pj_en": "And the border shall descend to the Jordan, and its outgoing be at the Sea of Salt. Rekem Giah on the south, Mount Umanos on the north, the Great Sea on the west, the Sea of Salt on the east,-this shall be your country, the Land of Israel, by the extent of its borders round about.", "tj": "וְיֵחוֹת לְיַרְדְנָא וְיֶהֱווֹן מַפְקָנוֹי יַמָא דְמִלְחָא דָא תְהֵי לְכוֹן אַרְעָא לִתְחוּמָהָא חֲזוֹר חֲזוֹר:", "tj_en": "And it shall descend to Jordan, and have its outgoings at the Sea of Salt. This shall be your land by its limits round about.", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 13, "aliyah": 5, "heb": "וַיְצַ֣ו מֹשֶׁ֔ה אֶת־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר זֹ֣את הָאָ֗רֶץ אֲשֶׁ֨ר תִּתְנַחֲל֤וּ אֹתָהּ֙ בְּגוֹרָ֔ל אֲשֶׁר֙ צִוָּ֣ה יְהֹוָ֔ה לָתֵ֛ת לְתִשְׁעַ֥ת הַמַּטּ֖וֹת וַחֲצִ֥י הַמַּטֶּֽה׃", "onk": "וּפַקִּיד משֶׁה יָת בְּנֵי יִשְׂרָאֵל לְמֵימָר דָּא אַרְעָא דִּי תִתְחַסְנוּן יָתַהּ בְּעַדְבָא דִּי פַּקִּיד יְיָ לְמִתַּן לְתִשְׁעַת שִׁבְטִין וּפַלְגּוּת שִׁבְטָא:", "onk_en": "Moshe instructed Bnei Yisroel, saying: “This is the land which you must distribute as hereditary property by means of a lottery, which Adonoy has commanded to give to the nine and one half tribes.", "pj": "וּפַקֵיד משֶׁה יַת בְּנֵי יִשְרָאֵל לְמֵימָר דָא אַרְעָא דְתַחְסְנוּן יָתָהּ בְּעַדְבָא דְפַקֵיד יְיָ לְמִתַּן לְתִשְׁעַת שִׁבְטִין וּפַלְגוּת שִׁבְטָא", "pj_en": "And Mosheh commanded the sons of Israel, saying: This is the land which you are to inherit by lot, which the Lord hath commanded to give to the nine tribes and the half tribe.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 14, "aliyah": 5, "heb": "כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָראוּבֵנִי֙ לְבֵ֣ית אֲבֹתָ֔ם וּמַטֵּ֥ה בְנֵֽי־הַגָּדִ֖י לְבֵ֣ית אֲבֹתָ֑ם וַחֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽם׃", "onk": "אֲרֵי קַבִּילוּ שִׁבְטָא דִבְנֵי רְאוּבֵן לְבֵית אֲבָהַתְהוֹן וְשִׁבְטָא דִבְנֵי גָד לְבֵית אֲבָהַתְהוֹן וּפַלְגּוּת שִׁבְטָא דִמְנַשֶּׁה קַבִּילוּ אַחֲסַנְתְּהוֹן:", "onk_en": "Because the tribe of Reuvein’s descendants, the tribe of Gad’s descendants, and half of the tribe of Menashe have already taken their hereditary property.", "pj": "אֲרוּם קַבִּילוּ שִׁבְטָא דִבְנֵי רְאוּבֵן לְבֵית אֲבָהַתְהוֹן וְשִׁבְטָא דִבְנֵי גָד לְבֵית אֲבָהַתְהוֹן וּפַלְגוּת שִׁבְטָא דִמְנַשֶׁה קַבִּילוּ יַת אַחְסַנְתְּהוֹן", "pj_en": "For the tribe of the children of Reuben, according to the house of their fathers, and tribe of Gad, and the half tribe of Menasheh have received their inheritance __", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 15, "aliyah": 5, "heb": "שְׁנֵ֥י הַמַּטּ֖וֹת וַחֲצִ֣י הַמַּטֶּ֑ה לָקְח֣וּ נַחֲלָתָ֗ם מֵעֵ֛בֶר לְיַרְדֵּ֥ן יְרֵח֖וֹ קֵ֥דְמָה מִזְרָֽחָה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "תְּרֵין שִׁבְטִין וּפַלְגּוּת שִׁבְטָא קַבִּילוּ אַחֲסַנְתְּהוֹן מֵעִבְרָא לְיַרְדְּנָא דִירֵחוֹ קִדּוּמָא מַדִּינְחָא:", "onk_en": "These two and one half tribes have taken their hereditary property on this side of the Yardein near Yereicho, to the east, toward the sunrise.”", "pj": "תְּרֵין שִׁבְטִין וּפַלְגוּת שִׁבְטָא קַבִּילוּ אַחְסַנְתְּהוֹן מֵעִבְרָא לְיוֹרְדְנָא מַדִינְחָא", "pj_en": "__ beyond the Jordan on the eastern side.", "tj": "תְּרֵין שִׁבְטַיָא וּפַלְגוּת שִׁבְטָא קַבִּילוּ אַחֲסַנְתְּהוֹן מִן יַרְדְנָא דִירֵיחוֹ קֳדָמָאִין מִן מַדִינְחָא מִן מֵישַׁר יַמָא דְמִלְחָא נְפַק לְהוֹן תְּחוּמָא לְכִּנֶרֶת כְּרַךְ דְמַלְכַתְהוֹן דֶאֱמוֹרָאֵי וּמִכִּנֶרֶת כְּרַךְ מַלְכוּתְהוֹן דֶאֱמוֹרָאֵי נְפַק לְהוֹן תְּחוּמָא לְטוּר תַּלְגָא וּלְחוֹמָתָא דְלִבְנַן וּמִטוּר תַּלְגָא וּלְחוֹמָתָא דְלִבְנַן נְפַק לְהוֹן תְּחוּמָא לְחוֹבָא דִימִין צָפוֹן עַיְינוּתָא דְדַמֶשֶק וּמִן חוֹבָא דִי מִן צָפוֹן עַיְינוּתָא דְדַמָשֶק נְפַק לְהוֹן תְּחוּמָא לִדְיוֹקְיָנוֹס טוּר תַּלְגָא דְקֵיסַרְיוֹן דִי מִן מַדְנַח מַעֲרָב דָן וּמִן יוֹקְיָנוֹס תּוּרְנַגְלָא דִי מַדְנַח מַעֲרָב דָן נְפַק לְהוֹן תְּחוּמָא לְנַהֲרָא רַבָּא נַהֲרָא פְּרָת דַעֲלוֹי סְדַר נִצְחָנֵי קְרָבוֹי דַיְיָ מִתְעַבְּדִין וּמִן נַהֲרָא רַבָּא נַהֲרָא פְּרָת נְפַק לְהוֹן תְּחוּמָא לְקִרְוָן זַכָּתָא בַּתְרָא כָּל טְרֵיכוֹן זִמְרָא בֵּית מַלְכָּא דְסִיחוֹן מַלְכֵיהוֹן דֶאֱמוֹרָאֵי וּבֵית מַלְכוּתָא דְעוֹג מַלְכָּא דְמַתְנָן נְפַק לְרָפִיחַ וּלְשׁוֹקְמְזַיי עַד מָטֵי סְפַר יַמָא דְמִילְחָא הָדֵין הוּא חוּלַקְהוֹן דְתַרְיַין שִׁבְטַיָא וּפַלְגוּת שִׁבְטָא:", "tj_en": "The two tribes and the half tribe have received their inheritance beyond Jordan-Jericho first. Their border goeth forth on the east from the plain of the Salt Sea to Kinnereth, the city of the kingdom of the Amorites, and thence to the mountain of snow, and to Hamatha of Lebanon; thence to Hoba, on the northern side of Hainutha, of Damasek, and from Hoba to Divakinos, at the snowy mount of Kisarion, eastward of (the town of) Dan, on the west, and from thence to the Great River, the river Phrat, upon which is the order of the victories of the wars of the Lord, which are to be wrought there. And from the Great River, the Phrat, their border goeth forth to the cities of Zavatha, beyond all the Tarkon (Trechonites), unto Zimra, the royal house of Sihon, king of the Amoraee, and the royal house of Og, king of Mathnan, going to Raphiach and to Shokmezai, until thou comest to the shore of the Salt Sea. This is the portion of the two tribes and the half tribe.", "rashi": "<b>קדמה מזרחה.<\/b> אֶל פְּנֵי הָעוֹלָם, שֶׁהֵם בַּמִּזְרָח, שֶׁרוּחַ מִזְרָחִית קְרוּיָה פָנִים וּמַעֲרָבִית קְרוּיָה אָחוֹר, לְפִיכָךְ דָּרוֹם לַיָּמִין וְצָפוֹן לַשְּׂמֹאל:", "rashi_en": "קדמה מזרחה — At the front of (קדם) the world which is the east; for the east side is called פנים, “the face\" (equivalent to קדם, “front”), the west is called “behind”, and therefore the south is on the right and the north on the left (cf. Rashi on Exodus 27:13 and Note thereon)."}, {"ch": 34, "v": 16, "aliyah": 6, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 17, "aliyah": 6, "heb": "אֵ֚לֶּה שְׁמ֣וֹת הָֽאֲנָשִׁ֔ים אֲשֶׁר־יִנְחֲל֥וּ לָכֶ֖ם אֶת־הָאָ֑רֶץ אֶלְעָזָר֙ הַכֹּהֵ֔ן וִיהוֹשֻׁ֖עַ בִּן־נֽוּן׃", "onk": "אִלֵּין שְׁמָהַת גֻּבְרַיָּא דִּי יַחְסְנוּן לְכוֹן יָת אַרְעָא אֶלְעָזָר כַּהֲנָא וִיהוֹשֻׁעַ בַּר נוּן:", "onk_en": "“These are the names of the men who shall inherit the land for you: Elozor the <i>kohein<\/i> and Yehoshua son of Nun,", "pj": "אִלֵין שְׁמָהַת גוּבְרַיָא דְיַחְסְנוּן לְכוֹן יַת אַרְעָא אֶלְעָזָר כַּהֲנָא וִיהוֹשֻׁעַ בַּר נוּן", "pj_en": "These are the names of the men who shall make to you the inheritance of the land: Elazar the priest, and Jehoshua bar Nun,", "tj": "", "tj_en": "", "rashi": "<b>אשר ינחלו לכם.<\/b> בִּשְׁבִילְכֶם; כָּל נָשִׂיא וְנָשִׂיא אַפּוֹטְרוֹפּוֹס לְשִׁבְטוֹ וּמְחַלֵּק נַחֲלַת הַשֵּׁבֶט לַמִּשְׁפָּחוֹת וְלַגְּבָרִים, וּבוֹרֵר לְכָל אֶחָד וְאֶחָד חֵלֶק הָגוּן, וּמַה שֶּׁהֵם עוֹשִׂים יִהְיֶה עָשׂוּי כְּאִלּוּ עֲשָׂאוּם שְׁלוּחִים; וְלֹא יִתָּכֵן לְפָרֵשׁ <b>לכם<\/b> זֶה כְּכָל לָכֶם שֶׁבַּמִּקְרָא, שֶׁאִם כֵּן הָיָה לוֹ לִכְתֹּב יַנְחִילוּ לָכֶם, יִנְחֲלוּ מַשְׁמַע שֶׁהֵם נוֹחֲלִים לָכֶם — בִּשְׁבִילְכֶם וּבִמְקוֹמְכֶם, כְּמוֹ \"ה' יִלָּחֵם לָכֶם\" (שמות י\"ד):", "rashi_en": "אשר ינחלו לכם [THESE ARE THE … MEN] WHO SHALL TAKE POSSESSION OF THE LAND לכם — i.e., for you. Each prince was the agent of his tribe and divided the inheritance of the tribe amongst the families and again amongst the men, selecting for each a portion fitting for him. What they did was done (was legal) just as if they (the tribes) had appointed them their representatives (Kiddushin 42b). — It would not be right to explain this לכם as all other לכם (“to you”) which occur in the Bible, for if so it should have written יַנְחִילוּ לכם (Hiphil), “they will give the possession to you”. But יִנְחֲלוּ (Kal), implies that they themselves take possession לכם, “for you” and in your place. It is the same as, (Exodus 14:14): “The Lord will fight לכם” — “for you”."}, {"ch": 34, "v": 18, "aliyah": 6, "heb": "וְנָשִׂ֥יא אֶחָ֛ד נָשִׂ֥יא אֶחָ֖ד מִמַּטֶּ֑ה תִּקְח֖וּ לִנְחֹ֥ל אֶת־הָאָֽרֶץ׃", "onk": "וְרַבָּא חַד רַבָּא חַד מִשִּׁבְטָא תִּסְּבוּן לְאַחֲסָנָא יָת אַרְעָא:", "onk_en": "And one leader from each tribe you shall take, to help inherit the land.", "pj": "וְאַמַרְכּוֹל חַד אַמַרְכּוֹל חַד מִן שִׁבְטָא תִתְבְּרוּן לְאַחְסָנָא יַת אַרְעָא", "pj_en": "and one prince from each of the tribes you shall choose to give you the inheritance of the land.", "tj": "", "tj_en": "", "rashi": "<b>לנחל את הארץ.<\/b> שֶׁיְּהֵא נוֹחֵל וְחוֹלֵק אוֹתָהּ בִּמְקוֹמְכֶם:", "rashi_en": "לִנְחֹל את הארץ [YE SHALL TAKE ONE PRINCE OF EVERY TRIBE], TO TAKE POSSESSION OF THE LAND i.e. that he should take possession and apportion it in your place (i.e. as your representatives; cf. Rashi on previous verse)."}, {"ch": 34, "v": 19, "aliyah": 6, "heb": "וְאֵ֖לֶּה שְׁמ֣וֹת הָאֲנָשִׁ֑ים לְמַטֵּ֣ה יְהוּדָ֔ה כָּלֵ֖ב בֶּן־יְפֻנֶּֽה׃", "onk": "וְאִלֵּין שְׁמָהַת גֻּבְרַיָּא לְשִׁבְטָא דִיהוּדָה כָּלֵב בַּר יְפֻנֶּה:", "onk_en": "These are the names of the men: for the tribe of Yehudah, Kaleiv son of Yefuneh.", "pj": "וְאִלֵין שְׁמָהַת גוּבְרַיָא לְשִׁבְטָא דְבֵית יְהוּדָה כָּלֵב בַּר יְפֻנֶה", "pj_en": "And these are the names of the men. Of the tribe of Jehudah, Kaleb bar Jephunneh;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 20, "aliyah": 6, "heb": "וּלְמַטֵּה֙ בְּנֵ֣י שִׁמְע֔וֹן שְׁמוּאֵ֖ל בֶּן־עַמִּיהֽוּד׃", "onk": "וּלְשִׁבְטָא דִּבְנֵי שִׁמְעוֹן שְׁמוּאֵל בַּר עַמִיהוּד:", "onk_en": "For the tribe of Shimon, Shmuel, son of Amihud.", "pj": "לְשִׁבְטָא דְשִׁמְעוֹן שְׁמוּאֵל בַּר עַמִיהוּד", "pj_en": "for Shemeon, Shemuel bar Ammihud;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 21, "aliyah": 6, "heb": "לְמַטֵּ֣ה בִנְיָמִ֔ן אֱלִידָ֖ד בֶּן־כִּסְלֽוֹן׃", "onk": "לְשִׁבְטָא דְבִנְיָמִן אֱלִידָד בַּר כִּסְלוֹן:", "onk_en": "For the tribe of Binyamin, Elidad, son of Kislon.", "pj": "לְשִׁבְטָא דְבִנְיָמִין אֱלִידָד בַּר כִּסְלוֹן", "pj_en": "Benjamin, Elidad bar Kiselon;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 22, "aliyah": 6, "heb": "וּלְמַטֵּ֥ה בְנֵי־דָ֖ן נָשִׂ֑יא בֻּקִּ֖י בֶּן־יׇגְלִֽי׃", "onk": "וּלְשִׁבְטָא דִבְנֵי דָן רַבָּא בֻּקִּי בַּר יָגְלִי:", "onk_en": "The leader for the tribe of Don, Buki, son of Yogli.", "pj": "לְשִׁבְטָא דְדָן אַמַרְכּוֹל בֻּקִי בַּר יָגְלִי", "pj_en": "Dan, Buki bar Jageli;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 23, "aliyah": 6, "heb": "לִבְנֵ֣י יוֹסֵ֔ף לְמַטֵּ֥ה בְנֵֽי־מְנַשֶּׁ֖ה נָשִׂ֑יא חַנִּיאֵ֖ל בֶּן־אֵפֹֽד׃", "onk": "לִבְנֵי יוֹסֵף לְשִׁבְטָא דִבְנֵי מְנַשֶּׁה רַבָּא חַנִּיאֵל בַּר אֵפֹד:", "onk_en": "For Yoseif’s children, the leader for the tribe of Menashe, Chaniel, son of Eifod.", "pj": "לְשִׁבְטָא דִבְנֵי יוֹסֵף לְשִׁבְטָא דִבְנֵי מְנַשֶׁה אַמַרְכּוֹל חַנִיאֵל בַּר אֵפוֹד", "pj_en": "Joseph, Menasheh, Haniel bar Ephod;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 24, "aliyah": 6, "heb": "וּלְמַטֵּ֥ה בְנֵֽי־אֶפְרַ֖יִם נָשִׂ֑יא קְמוּאֵ֖ל בֶּן־שִׁפְטָֽן׃", "onk": "וּלְשִׁבְטָא דִבְנֵי אֶפְרַיִם רַבָּא קְמוּאֵל בַּר שִׁפְטָן:", "onk_en": "The leader for the tribe of Ephraim, Kemuel, son of Shiftan.", "pj": "לְשִׁבְטָא דְבֵית אֶפְרַיִם אַמַרְכּוֹל קְמוּאֵל בַּר שִׁפְטָן", "pj_en": "Ephraim, Kemuel bar Shipbtan;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 25, "aliyah": 6, "heb": "וּלְמַטֵּ֥ה בְנֵֽי־זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן־פַּרְנָֽךְ׃", "onk": "וּלְשִׁבְטָא דִבְנֵי זְבוּלֻן רַבָּא אֱלִיצָפָן בַּר פַּרְנָךְ:", "onk_en": "The leader for the tribe of Zevulun, Elitzafan, son of Parnach.", "pj": "לְשִׁבְטָא דִזְבוּלֻן אַמַרְכּוֹל אֱלִיצָפָן בַּר פַּרְנָךְ", "pj_en": "Zebulon, Elizaphan bar Parnak;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 26, "aliyah": 6, "heb": "וּלְמַטֵּ֥ה בְנֵֽי־יִשָּׂשכָ֖ר נָשִׂ֑יא פַּלְטִיאֵ֖ל בֶּן־עַזָּֽן׃", "onk": "וּלְשִׁבְטָא דִבְנֵי יִשָּׂשכָר רַבָּא פַּלְטִיאֵל בַּר עַזָּן:", "onk_en": "The leader for the tribe of Yissachar, Paltiel, son of Azan.", "pj": "לְשִׁבְטָא דְבֵית יִשָשכָר אַמַרְכּוֹל פַּלְטִיאֵל בַּר עַזָן", "pj_en": "Issakar, Paltiel bar Azan;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 27, "aliyah": 6, "heb": "וּלְמַטֵּ֥ה בְנֵי־אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן־שְׁלֹמִֽי׃", "onk": "וּלְשִׁבְטָא דִבְנֵי אָשֵׁר רַבָּא אֲחִיהוּד בַּר שְׁלֹּמִי:", "onk_en": "The leader for the tribe of Asher, Achihud, son of Shlomi.", "pj": "לְשִׁבְטָא דְאָשֵׁר אַמַרְכּוֹל אֲחִיהוּד בַּר שְׁלוֹמִי", "pj_en": "Asher, Abihud bar Shelomi;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 28, "aliyah": 6, "heb": "וּלְמַטֵּ֥ה בְנֵֽי־נַפְתָּלִ֖י נָשִׂ֑יא פְּדַהְאֵ֖ל בֶּן־עַמִּיהֽוּד׃", "onk": "וּלְשִׁבְטָא דִבְנֵי נַפְתָּלִי רַבָּא פְּדַהְאֵל בַּר עַמִּיהוּד:", "onk_en": "The leader for the tribe of Naftali, Pedah’eil, son of Amihud.”", "pj": "לְשִׁבְטָא דִבְנֵי נַפְתָּלִי אַמַרְכּוֹל פְּדַהְאֵל בַּר עַמִיהוּד", "pj_en": "Naphtali, Pedahael bar Ammihud.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 29, "aliyah": 6, "heb": "אֵ֕לֶּה אֲשֶׁ֖ר צִוָּ֣ה יְהֹוָ֑ה לְנַחֵ֥ל אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל בְּאֶ֥רֶץ כְּנָֽעַן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אִלֵּין דִּי פַּקִּיד יְיָ לְאַחֲסָנָא יָת בְּנֵי יִשְׂרָאֵל בְּאַרְעָא דִכְנָעַן:", "onk_en": "These are the ones whom Adonoy commanded to apportion the inheritance to Bnei Yisroel, in the land of Canaan.", "pj": "אִלֵין דְפַקֵיד יְיָ לְאַחְסָנָא יַת בְּנֵי יִשְרָאֵל בְּאַרְעָא דִכְנָעַן", "pj_en": "These are they whom the Lord commanded to divide the inheritance of the land of Kenaan to the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>לנחל את בני ישראל.<\/b> שֶׁהֵם יַנְחִילוּ אוֹתָהּ לָכֶם לְמַחְלְקוֹתֶיהָ:", "rashi_en": "לנחל את בני ישראל [THESE ARE THEY WHOM THE LORD COMMANDED] TO DIVIDE THE INHERITANCE UNTO THE CHILDREN OF ISRAEL — It means, that they should make you inherit it according to its divisions (according to how it should be divided amongst families and again amongst individuals)."}, {"ch": 35, "v": 1, "aliyah": 6, "heb": "וַיְדַבֵּ֧ר יְהֹוָ֛ה אֶל־מֹשֶׁ֖ה בְּעַֽרְבֹ֣ת מוֹאָ֑ב עַל־יַרְדֵּ֥ן יְרֵח֖וֹ לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בְּמֵישְׁרַיָּא דְמוֹאָב עַל יַרְדְּנָא דִירֵחוֹ לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe in the plains of Moav by the Yardein near Yereicho, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה בְּמֵישְׁרַיָא דְמוֹאָב עַל יוֹרְדְנָא דִירֵיחוֹ לְמֵימָר", "pj_en": "And the Lord spake with Mosheh in the plains of Moab, by Jordan-Jericho, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 2, "aliyah": 6, "heb": "צַו֮ אֶת־בְּנֵ֣י יִשְׂרָאֵל֒ וְנָתְנ֣וּ לַלְוִיִּ֗ם מִֽנַּחֲלַ֛ת אֲחֻזָּתָ֖ם עָרִ֣ים לָשָׁ֑בֶת וּמִגְרָ֗שׁ לֶֽעָרִים֙ סְבִיבֹ֣תֵיהֶ֔ם תִּתְּנ֖וּ לַלְוִיִּֽם׃", "onk": "פַּקֵּד יָת בְּנֵי יִשְׂרָאֵל וְיִתְּנוּן לְלֵוָאֵי מֵאַחֲסָנַת אַחוּדַתְהוֹן קִרְוִין לְמִתָּב וְרֶוַח לְקִרְוַיָּא סַחֲרָנֵיהוֹן תִּתְּנוּן לְלֵוָאֵי:", "onk_en": "“Instruct Bnei Yisroel and have them give to the Levites from their hereditary possession, cities in which to settle; and open space for the cities all around you shall give to the Levites.", "pj": "פַּקֵיד יַת בְּנֵי יִשְרָאֵל וְיֶחְסוּן לְלֵיוָאֵי מֵאַחְסָנַת אֲחוּדַתְהוֹן קִירְוִין לְמִיתַב וּפַרְוִילִין לְקִירְוַיָא חֲזוּרְנוּתְהוֹן תִּתְּנוּן לְלֵיוָאֵי", "pj_en": "Command the sons of Israel that they give to the Levites from their inheritance cities to dwell in, and suburbs (open spaces) to the cities round about shall you give to the Levites.", "tj": "וּפַרְוִוילֵי לְקִרְיַת חֲזוֹר חֲזוֹר לְהוֹן יִתְּנִינוּן לְלֵיוָאֵי:", "tj_en": "And suburbs to the cities round about them shall you give to the Levites.", "rashi": "<b>ומגרש.<\/b> רֶוַח מָקוֹם חָלָק חוּץ לָעִיר סָבִיב, לִהְיוֹת לְנוֹי לָעִיר, וְאֵין רַשָּׁאִין לִבְנוֹת שָׁם בַּיִת וְלֹא לִנְטֹעַ כֶּרֶם וְלֹא לִזְרֹעַ זְרִיעָה:", "rashi_en": "ומגרש AND OPEN LAND — an area consisting of an open space round about the city outside it, serving to beautify the city. It was not permitted to build houses there nor to plant vineyards nor to sow a plantation (cf. Arakhin 33b)."}, {"ch": 35, "v": 3, "aliyah": 6, "heb": "וְהָי֧וּ הֶֽעָרִ֛ים לָהֶ֖ם לָשָׁ֑בֶת וּמִגְרְשֵׁיהֶ֗ם יִהְי֤וּ לִבְה
