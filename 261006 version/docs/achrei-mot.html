<style>
:root {

  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;

:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>

const DATA = [{"ch": 16, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֤ר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּקׇרְבָתָ֥ם לִפְנֵי־יְהֹוָ֖ה וַיָּמֻֽתוּ׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בָּתַר דְּמִיתוּ תְּרֵין בְּנֵי אַהֲרֹן בְּקָרוֹבֵיהוֹן <b>אֶשָּׁתָא נוּכְרֵיתָא<\/b> קֳדָם יְיָ וּמִיתוּ:", "onk_en": "And Adonoy spoke to Moshe after the death of two sons of Aharon, who brought an [unauthorized] offering [<b>strange fire<\/b>] before Adonoy and they died.", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה מִן בָּתַר דְמִיתוּ תְּרֵין בְּנוֹי דְאַהֲרן כַּהֲנַיָא רַבְרְבַיָא בִּזְמַן קְרוֹבֵיהוֹן אֶשָׁא בַּרְיָא קֳדָם יְיָ וּמִיתוּ בְּאֵשָׁא מְצַלְהֲבָא", "pj_en": "And the Lord spake with Mosheh, after that the two sons of Aharon the high priest had died (or, the priests the two elder sons of Aharon had died) at the time of their offering extraneous fire (aisha baria) before the Lord; died they by the flaming fire.", "tj": "תְּרֵין בְּנוֹי דְאַהֲרן בְּקָרוֹבֵיהוֹן אֶשָׁא בַּרְיָא:", "tj_en": "The two sons of Aharon, in their offering extraneous fire.", "rashi": "<b>וידבר ה' אל משה אחרי מות שני בני אהרן וגו'.<\/b> מַה תַּ\"ל? הָיָה רַבִּי אֶלְעָזָר בֶּן עֲזַרְיָה מוֹשְׁלוֹ מָשָׁל לְחוֹלֶה שֶׁנִּכְנָס אֶצְלוֹ רוֹפֵא, אָמַר לוֹ אַל תֹּאכַל צוֹנֵן וְאַל תִּשְׁכַּב בְּטַחַב; בָּא אַחֵר וְאָמַר לוֹ אַל תֹּאכַל צוֹנֵן וְאַל תִּשְׁכַּב בְּטַחַב שֶׁלֹּא תָמוּת כְּדֶרֶךְ שֶׁמֵּת פְּלוֹנִי, זֶה זֵרְזוֹ יוֹתֵר מִן הָרִאשׁוֹן, לְכָךְ נֶאֱמַר אַחֲרֵי מוֹת שְׁנֵי בְּנֵי אַהֲרֹן:", "rashi_en": "'וידבר ה' אל משה אחרי מות שני בני אהרן וגו‎‎ AND THE LORD SPOKE UNTO MOSES AFTER THE DEATH OF THE TWO SONS OF AARON etc. —What is this statement intended to tell us? (i. e. why is it at all stated when God spoke this to Moses?) Rabbi Elazar ben Azariah illustrated this by a parable: It may be compared to the case of a sick person whom the physician visited. He (the physician) said to him: “Do not eat cold things nor sleep in a damp place!\" Another physician came and said to him: “Do not eat cold things, nor sleep in a damp place so that thou mayest not die as Mr. So-and-so died!\" Certainly this (the latter) put him on his guard more than the former; that is why Scripture states “after the death of the two sons of Aaron\" (Sifra, Acharei Mot, Section 1 3)."}, {"ch": 16, "v": 2, "aliyah": 1, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה דַּבֵּר֮ אֶל־אַהֲרֹ֣ן אָחִ֒יךָ֒ וְאַל־יָבֹ֤א בְכׇל־עֵת֙ אֶל־הַקֹּ֔דֶשׁ מִבֵּ֖ית לַפָּרֹ֑כֶת אֶל־פְּנֵ֨י הַכַּפֹּ֜רֶת אֲשֶׁ֤ר עַל־הָאָרֹן֙ וְלֹ֣א יָמ֔וּת כִּ֚י בֶּֽעָנָ֔ן אֵרָאֶ֖ה עַל־הַכַּפֹּֽרֶת׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה מַלֵּל עִם אַהֲרֹן אָחוּךְ וְלָא יְהֵי עָלֵל בְּכָל עִדָּן לְקוּדְשָׁא מִגָּיו לְפָרֻכְתָּא לָקֳדָם כַּפֻּרְתָּא דִּי עַל אֲרוֹנָא וְלָא יְמוּת אֲרֵי בַּעֲנָנָא אֲנָא <b>מִתְגְּלִי<\/b> עַל <b>בֵּית<\/b> כַּפֻּרְתָּא:", "onk_en": "Adonoy spoke to Moshe: Speak to your brother Aharon that he not come at all times into the Holy [Sanctuary] that is inside of the Curtain, before the Ark-cover that is on the Ark so that he not die, for in a cloud I shall appear [<b>become revealed<\/b>] on the [<b>House of the<\/b>] Ark-cover.", "pj": "וַאֲמַר יְיָ לְמשֶׁה מַלֵיל עִם אַהֲרן אָחוּךְ וְלָא יְהֵי עָלֵיל בְּכָל עִידַן לְקוּדְשָׁא מִן לְגֵיו לְפַרְגוֹדָא לִקְדָם כַּפּוּרְתָּא אֲרוּם בַּעֲנָנִי אִיקְרֵי שְׁכִינְתִּי מִתְגְלֵי עַל בֵּית כַּפּוֹרֵי", "pj_en": "And the Lord said unto Mosheh: Speak with Aharon thy brother, that he enter not at any time into the holy place within the veil before the mercy-seat; for the cloud of the glory of My Shekinah is revealed over the place of the mercy-seat.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אל משה דבר אל אהרן אחיך ואל יבא.<\/b> שֶׁלֹּא יָמוּת כְּדֶרֶךְ שֶׁמֵּתוּ בָנָיו:<br><br><b>ולא ימות.<\/b> שֶׁאִם בָּא הוּא מֵת (ספרא):<br><br><b>כי בענן אראה.<\/b> כִּי תָמִיד אֲנִי נִרְאֶה שָׁם עִם עַמּוּד עֲנָנִי, וּלְפִי שֶׁגִּלּוּי שְׁכִינָתִי שָׁם, יִזָּהֵר שֶׁלֹּא יַרְגִּיל לָבֹא, זֶהוּ פְשׁוּטוֹ; וּמִדְרָשׁוֹ: לֹא יָבֹא כִּי אִם בַּעֲנַן הַקְּטֹרֶת בְּיוֹם הַכִּפּוּרִים (יומא נ\"ג):", "rashi_en": "יבא‎ ויאמר ה׳ אל משה דבר אל אהרן אחיך ואל AND THE LORD SPOKE UNTO MOSES, SPEAK UNTO AARON THY BROTHER THAT HE COME NOT [AT ALL TIMES INTO THE HOLY PLACE]! THAT HE DIE NOT as his sons have died (Sifra, Acharei Mot, Section 1 4). <br><br>ולא ימות THAT HE DIE NOT — for if he comes into the Holy of Holies at any time other than Yom-Kippur he will die (Sifra, Acharei Mot, Section 1 4). <br><br>כי בענן אראה means, for I constantly show Myself there with My pillar of cloud, and because the revelation of My Shechinah takes place there he should take care not to make it his habit to come there. This is the literal meaning of the verse. The Halachic explanation is: He shall not come into the Holy of Holies except with (i.e. on the occasion when he is going to raise) a cloud of incense on the Day of Atonement (Yoma 53a)."}, {"ch": 16, "v": 3, "aliyah": 1, "heb": "בְּזֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל־הַקֹּ֑דֶשׁ בְּפַ֧ר בֶּן־בָּקָ֛ר לְחַטָּ֖את וְאַ֥יִל לְעֹלָֽה׃", "onk": "בְּדָא יְהֵי עָלֵל אַהֲרֹן לְקוּדְשָׁא בְּתוֹר בַּר תּוֹרֵי לְחַטָּאתָא וּדְכַר לַעֲלָתָא:", "onk_en": "With this shall Aharon come into the Holy [Sanctuary]; with a young bullock, for a sin-offering and a ram, for a burnt-offering.", "pj": "בַּהֲדָא מִידָה יְהֵי עָלִיל אַהֲרן לְקוּדְשָׁא בְּתוֹר בַּר תּוֹרֵי דְלָא עֵירוּבִין לְקָרְבַּן חַטָאתָא וּדְכַר לַעֲלָתָא", "pj_en": "This shall be the rite (mida) for the entering of Aharon into the holy place. With a young bullock, having no mixture, for the sin offering, and a ram for the burnt offering.", "tj": "", "tj_en": "", "rashi": "<b>בזאת.<\/b> גִּימַטְרִיָּא שֶׁלּוֹ אַרְבַּע מֵאוֹת וְעֶשֶׂר, רֶמֶז לְבַיִת רִאשׁוֹן (ויקרא רבה כ\"א):<br><br><b>בזאת יבא אהרן וגומר.<\/b> וְאַף זוֹ לֹא בְכָל עֵת, כִּי אִם בְּיוֹם הַכִּפּוּרִים, כְּמוֹ שֶׁמְּפֹרָשׁ בְּסוֹף הַפָּרָשָׁה \"בַּחֹדֶשׁ הַשְּׁבִיעִי בֶּעָשׂוֹר לַחֹדֶשׁ\" (שם):", "rashi_en": "בזאת WITH THIS [SHALL AARON COME] — The numerical value of this word is 410, being an allusion to the 410 years during which the First Temple existed (cf. Leviticus Rabbah 21 9).<br><br>'בזאת יבא אהרן וגו WITH THIS SHALL AARON COME [INTO THE HOLY PLACE] etc. — And this, also, shall not be at any time he pleases, but on the day of Atonement, as it is explicitly stated at the end of this section (vv. 29—34). “In the seventh month on the tenth day of the month [ye shall fast … And the priest … shall make expiation]\". "}, {"ch": 16, "v": 4, "aliyah": 1, "heb": "כְּתֹֽנֶת־בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּמִֽכְנְסֵי־בַד֮ יִהְי֣וּ עַל־בְּשָׂרוֹ֒ וּבְאַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּבְמִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי־קֹ֣דֶשׁ הֵ֔ם וְרָחַ֥ץ בַּמַּ֛יִם אֶת־בְּשָׂר֖וֹ וּלְבֵשָֽׁם׃", "onk": "כִּתּוּנָא דְבוּצָא קוּדְשָׁא יִלְבָּשׁ וּמִכְנְסִין דְּבוּץ יְהוֹן עַל בִּסְרֵיהּ וּבְהֶמְיָנָא דְבוּצָא יֵסַר וּבְמִצְנֶפְתָּא דְבוּצָא יָחֵת בְּרֵישֵׁיהּ לְבוּשֵׁי קוּדְשָׁא אִנּוּן וְיַסְחֵי בְמַיָּא יָת בִּסְרֵיהּ וְיַלְבְּשִׁנּוּן:", "onk_en": "He shall don a sanctified, linen tunic and linen pants shall be on his body. He shall gird himself with a linen sash and place a linen turban on his head. These are sacred garments; he shall bathe his body in water and clothe himself in them.", "pj": "כִּיתוּנָא דְבוּץ מִילַת קוּדְשָׁא יִלְבַּשׁ וְאַווֹרְקְסִין דְבוּץ מִילַת יְהוֹן עַל בִּישְרֵיהּ וּבְקִמוּרָא דְבוּץ מִילַת יֵצֶר וּמַצְנִיפָא דְבוּץ מִילַת נְטִיכַס בְּרֵישֵׁיהּ לְבוּשֵׁי קוּדְשָׁא הִינוּן בְּרַם בִּלְבוּשֵׁי דַהֲבָא לָא יְהֵי עָלֵיל מְטוֹל דְלָא יִדְכַּר חוֹבַת עֵיגְלָא דְדַהֲבָא וּבִזְמַן מֵעֲלֵיהּ יַסְחֵי יַת בִּישְרֵיהּ בְּאַרְבְּעִין סָאוִוין דְמוֹי וְיַלְבֵּישִׁינוּן", "pj_en": "With the vestments of fine linen, the holy robe, shall he be dressed, and linen drawers shall be upon his flesh, and with the girdle of fine linen shall he be bound, and the mitre of fine linen shall be ordained for his head. These are the holy garments; but with the golden robes he shall not enter, that there be not brought to memory the sin of the golden calf; and at the time when he is to enter he shall wash his flesh in forty seahs of water, and attire himself with them.", "tj": "", "tj_en": "", "rashi": "<b>כתנת בד וגו'.<\/b> מַגִּיד שֶׁאֵינוֹ מְשַׁמֵּשׁ לִפְנִים בִּשְׁמוֹנָה בְגָדִים שֶׁהוּא מְשַׁמֵּשׁ בָּהֶן בַּחוּץ, שֶׁיֵּשׁ בָּהֶם זָהָב, לְפִי שֶׁאֵין קָטֵגוֹר נַעֲשֶׂה סָנֵגוֹר, אֶלָּא בְּאַרְבָּעָה כְּכֹהֵן הֶדְיוֹט — וְכֻלָּן שֶׁל בּוּץ (ראש השנה כ\"ו):<br><br><b>קדש ילבש.<\/b> שֶׁיִּהְיוּ מִשֶּׁל הֶקְדֵּשׁ (ספרא):<br><br><b>יצנף.<\/b> כְּתַרְגּוּמוֹ, יָחֵת בְּרֵישֵׁיהּ — יַנִּיחַ בְּרֹאשׁוֹ, כְּמוֹ וַתַּנַּח בִּגְדוֹ (בראשית ל\"ט) — וַאֲחִתְּתֵהּ:<br><br><b>ורחץ במים.<\/b> אוֹתוֹ הַיּוֹם טָעוּן טְבִילָה בְּכָל חֲלִיפוֹתָיו; וְחָמֵשׁ פְּעָמִים הָיָה מַחֲלִיף מֵעֲבוֹדַת פְּנִים לַעֲבוֹדַת חוּץ, וּמִחוּץ לִפְנִים, וּמְשַׁנֶּה מִבִּגְדֵי זָהָב לְבִגְדֵי לָבָן וּמִבִּגְדֵי לָבָן לְבִגְדֵי זָהָב, וּבְכָל חֲלִיפָה טָעוּן טְבִילָה וּשְׁנֵי קִדּוּשֵׁי יָדַיִם וְרַגְלַיִם מִן הַכִּיּוֹר (יומא ל\"א):", "rashi_en": "'כתנת בד וגו [HE SHALL PUT ON] THE LINEN INNER GARMENTS etc. — This teaches us that he must not officiate in the “Interior\" (in the Holy of Holies) robed in the eight garments which were the insignia of the High Priest (cf. Exodus 28:4ff) in which he performed the service outside (in the היכל and the עזרה) and in which there was gold interwoven, — because the prosecuting counsel cannot become the defending counsel) — but in the four garments (cf. Exodus 28:40), like an ordinary priest, all of these being on this occasion entirely of linen (whereas one of the four worn by the ordinary priests, the belt, was a mixture of wool and linen) (Rosh Hashanah 26a).<br><br>קדש ילבש HE SHALL PUT ON [THE LINEN INNER GARMENT] OF HOLINESS (or, OF THE SANCTUARY) - This means that they shall be purchased from the Temple treasury (whilst his personal offering mentioned v. 3 had to be of his own) (Sifra, Acharei Mot, Chapter 1 10).<br><br>יצנף — Understand this as the Targum does: יחת ברישה which means: he shall place upon his head. Thus, the verb in (Genesis 39:16) ותנח בגדו, is rendered by the Targum ואחתתיה (of the same root as יחת) “and she placed\".<br><br>ורחץ במים AND HE SHALL LAVE [HIS FLESH] IN WATER — That day he required immersion at each change of his garments! Five times he proceeded alternately from the service in the “Interior\" to that performed outside and from the outside service to that in the \"Interior\", changing from the golden garments into the linen garments or from the linen garments into the golden garments. At each change he required to take an immersion and to wash his hands and his feet twice from the laver (viz., before he took off the garments he was wearing and after he had put on others — in all, 10 times during the day) (Yoma 32a)."}, {"ch": 16, "v": 5, "aliyah": 1, "heb": "וּמֵאֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי־שְׂעִירֵ֥י עִזִּ֖ים לְחַטָּ֑את וְאַ֥יִל אֶחָ֖ד לְעֹלָֽה׃", "onk": "וּמִין כְּנִשְׁתָּא דִּבְנֵי יִשְׂרָאֵל יִסַּב תְּרֵין צְפִירֵי עִזִּין לְחַטָּאתָא וּדְכַר חַד לַעֲלָתָא:", "onk_en": "He shall take, from the congregation of Israel two he-goats for sin-offerings and one ram for a burnt-offering.", "pj": "וּמִן כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל יִסַב תְּרֵין צְפִירֵי בְּנֵי עִזֵי דְלָא עֵירוּבִין לְקָרְבַּן חַטָאתָא וּדְכַר חַד לַעֲלָתָא", "pj_en": "And from the congregation of the sons of Israel let him take two kids of the goats, without mixture, for a sin offering, and one ram for a burnt offering.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 6, "aliyah": 1, "heb": "וְהִקְרִ֧יב אַהֲרֹ֛ן אֶת־פַּ֥ר הַחַטָּ֖את אֲשֶׁר־ל֑וֹ וְכִפֶּ֥ר בַּעֲד֖וֹ וּבְעַ֥ד בֵּיתֽוֹ׃", "onk": "וִיקָרֵב אַהֲרֹן יָת תּוֹרָא דְחַטָּאתָא דִּי לֵיהּ וִיכַפֵּר עֲלוֹהִי וְעַל אֱנַשׁ בֵּיתֵיהּ:", "onk_en": "Aharon shall bring the sin-offering bullock which is his and atone on his own behalf and on behalf of his household.", "pj": "וְיַקְרֵיב אַהֲרן יַת תּוֹרָא דְחַטָאתָא דְהוּא מִן מָמוֹנֵיהּ וִיכַפֵּר בְּאִשְׁתְּעוּת מִילַיָא עֲלוֹי וְעַל אֵינַשׁ בֵּיתֵיהּ", "pj_en": "And Aharon shall offer the bullock of the sin offering which (hath been purchased) with his own money, and make an atonement with words of confession for himself and for the men of his house.", "tj": "", "tj_en": "", "rashi": "<b>את פר החטאת אשר לו.<\/b> הָאָמוּר לְמַעְלָה, וְלִמֶּדְךָ כָּאן שֶׁמִּשֶּׁלּוֹ הוּא בָא וְלֹא מִשֶּׁל צִבּוּר (שם ג'):<br><br><b>וכפר בעדו ובעד ביתו.<\/b> מִתְוַדֶּה עָלָיו עֲוֹנוֹתָיו וַעֲוֹנוֹת בֵּיתוֹ (שם ל\"ו):", "rashi_en": "את פרי החטאת אשר לו [AND AARON SHALL OFFER] THE BULL OF SIN OFFERING WHICH IS HIS — i. e. that mentioned above (v. 3). It teaches you here, by adding the words אשר לו, that it came (had to be purchased) from his own and not from the money of the community (Sifra, Acharei Mot, Section 2 2; Yoma 3b).<br><br>וכפר בעדו ובעד ביתו means, he shall make confession over it of his own sins and of the sins of his house (Sifra, Acharei Mot, Section 2 2; Yoma 36b)."}, {"ch": 16, "v": 7, "aliyah": 1, "heb": "וְלָקַ֖ח אֶת־שְׁנֵ֣י הַשְּׂעִירִ֑ם וְהֶעֱמִ֤יד אֹתָם֙ לִפְנֵ֣י יְהֹוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיִסַּב יָת תְּרֵין צְפִירִין וִיקִים יָתְהוֹן קֳדָם יְיָ בִּתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "He shall take the two he-goats and stand them before Adonoy, at the entrance of the Tent of Meeting.", "pj": "וְיִסַב יַת תְּרֵין צְפִירִין וִיקֵם יַתְהוֹן קֳדָם יְיָ בִּתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And he shall take the two goats, and cause them to stand before the Lord, at the door of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 8, "aliyah": 1, "heb": "וְנָתַ֧ן אַהֲרֹ֛ן עַל־שְׁנֵ֥י הַשְּׂעִירִ֖ם גֹּרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַיהֹוָ֔ה וְגוֹרָ֥ל אֶחָ֖ד לַעֲזָאזֵֽל׃", "onk": "וְיִתֵּן אַהֲרֹן עַל תְּרֵין צְפִירִין עַדְבִין עַדְבָא חַד <b>לִשְׁמָא<\/b> דַיְיָ וְעַדְבָא חַד לַעֲזָאזֵל:", "onk_en": "Aharon shall put lots on the two he-goats; one lot [marked] for [<b>the Name of<\/b>] Adonoy and one lot [marked] for Azazel.", "pj": "וְיִתֵּן אַהֲרן עַל תְּרֵין צְפִירִין עַדְבִין שָׁוִין עַדְבָא חַד לִשְׁמָא דַיְיָ וְעַדְבָא חַד לַעֲזָאזֵל וְיִטְרַף בִּקְלַפִי וְיוֹפְקִינוּן וְיִטְלְקִינוּן עַל צְפִירַיָא", "pj_en": "And Aharon shall put upon the goats equal lots; one lot for the Name of the Lord, and one lot for Azazel: and he shall throw them into the vase, and draw them out, and put them upon the goats.", "tj": "", "tj_en": "", "rashi": "<b>ונתן אהרן על שני השעירם גרלות.<\/b> מַעֲמִיד אֶחָד לְיָמִין וְאֶחָד לִשְׂמֹאל, וְנוֹתֵן שְׁתֵּי יָדָיו בַּקַּלְפִּי, וְנוֹטֵל גּוֹרָל בְּיָמִין וַחֲבֵרוֹ בִּשְׂמֹאל וְנוֹתֵן עֲלֵיהֶם, אֶת שֶׁכָּתוּב בּוֹ \"לַשֵּׁם\" הוּא לַשֵּׁם, וְאֶת שֶׁכָּתוּב בּוֹ \"לַעֲזָאזֵל\" מִשְׁתַּלֵּחַ לַעֲזָאזֵל (יומא ל\"ט):<br><br><b>עזאזל.<\/b> הוּא הַר עַז וְקָשֶׁה, צוּק גָּבוֹהַּ, שֶׁנֶּאֱמַר אֶרֶץ גְזֵרָה — חֲתוּכָה:", "rashi_en": "‎‎‎‎‏ השעירים גרלות‎שני ‎על ‎‎ אהרן ‎ונתן  AND AARON SHALL CAST LOTS UPON THE TWO GOATS — He places one goat at his right and the other at his left. He then puts both his hands into an urn and takes one lot in his right hand and the other in his left. These he places upon them (the goats; i.e. one upon each of them). The goat upon which there fell that lot bearing the inscription 'לה, \"For the Lord\" was destined for the Lord, and that upon which there fell that lot bearing the inscription \"For Azazel\" was afterwards sent forth to the Azazel (Yoma 39a).<br><br>עזאזל AZAZEL — (The word is taken to be a compound of עזז \"to be strong\" and אל \"mighty\"). It was a precipitous and flinty rock — a towering peak, for it is said (v. 22) \"[and the goat shall bear upon it their iniquities into] an גזר) \"ארץ גזרה means to cut) — into a craggy land (Yoma 67b)."}, {"ch": 16, "v": 9, "aliyah": 1, "heb": "וְהִקְרִ֤יב אַהֲרֹן֙ אֶת־הַשָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛יו הַגּוֹרָ֖ל לַיהֹוָ֑ה וְעָשָׂ֖הוּ חַטָּֽאת׃", "onk": "וִיקָרֵב אַהֲרֹן יָת צְפִירָא דִּי סְלִיק עֲלוֹהִי עַדְבָא <b>לִשְׁמָא<\/b> דַיְיָ וְיַעְבִּדִנֵיהּ חַטָּאתָא:", "onk_en": "Aharon shall bring the goat upon which the lot [marked] for [<b>the Name of<\/b>] Adonoy came up and do (offer) it as a sin-offering.", "pj": "וִיקָרֵיב אַהֲרן יַת צְפִירָא דְסָלֵק עֲלוֹי עַדְבָא לִשְׁמָא דַיְיָ וְיַעַבְדִינֵיהּ קָרְבַּן חַטָאתָא", "pj_en": "And Aharon shall bring the goat upon which came up the lot for the Name of the Lord, and make him a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>ועשהו חטאת.<\/b> כְּשֶׁמַּנִיחַ הַגּוֹרָל עָלָיו קוֹרֵא לוֹ שֵׁם וְאוֹמֵר \"לַה' חַטָּאת\":", "rashi_en": "ועשהו חטאת means, when putting the lot upon it he names it (i.e. designates its purpose), using the words: \"to the Lord as a sin offering״ (Yoma 39a)."}, {"ch": 16, "v": 10, "aliyah": 1, "heb": "וְהַשָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤יו הַגּוֹרָל֙ לַעֲזָאזֵ֔ל יׇֽעֳמַד־חַ֛י לִפְנֵ֥י יְהֹוָ֖ה לְכַפֵּ֣ר עָלָ֑יו לְשַׁלַּ֥ח אֹת֛וֹ לַעֲזָאזֵ֖ל הַמִּדְבָּֽרָה׃", "onk": "וּצְפִירָא דִּי סְלִיק עֲלוֹהִי עַדְבָא לַעֲזָאזֵל יִתָּקַם כַּד חַי קֳדָם יְיָ לְכַפָּרָא עֲלוֹהִי לְשַׁלַּח יָתֵיהּ לַעֲזָאזֵל לְמַדְבְּרָא:", "onk_en": "The goat upon which came up the lot [marked] for Azazel shall be placed, alive, before Adonoy, to achieve atonement with it to send it to Azazel, in the desert.", "pj": "וּצְפִירָא דְסָלֵק עֲלוֹי עַדְבָא לַעֲזָאזֵל יִתּוֹקָם בְּחַיִין קֳדָם יְיָ לְכַפָּרָא עַל סַרְחָנוּת עַמָא בֵּית יִשְרָאֵל לְשַׁדְרָא יָתֵיהּ לִמְמָת בַּאֲתַר תַּקִיף וְקַשֵׁי דִבְמַדְבְּרָא דְצוּק דְהוּא בֵּית חֲרוּרֵי", "pj_en": "And the goat on which came up the lot for Azazel he shall make to stand alive before the Lord, to expiate for the sins of the people of the house of Israel, by sending him to die in a place rough and hard in the rocky desert which is Beth-hadurey.", "tj": "", "tj_en": "", "rashi": "<b>יעמד חי.<\/b> כְּמוֹ יֻעֲמַד חַי — עַל יְדֵי אֲחֵרִים, וְתַרְגּוּמוֹ יִתָּקַם כַּד חַי; מַה תַּ\"ל? לְפִי שֶׁנֶּאֱמַר לְשַׁלֵּחַ אֹתוֹ לַעֲזָאזֵל וְאֵינִי יוֹדֵעַ שִׁלּוּחוֹ אִם לְמִיתָה אִם לְחַיִּים, לְכָךְ נֶאֱמַר יָעֳמַד חַי, עֲמִידָתוֹ חַי עַד שֶׁיִּשְׁתַּלֵּחַ, מִכָּאן שֶׁשִּׁלּוּחוֹ לְמִיתָה (ספרא):<br><br><b>לכפר עליו.<\/b> שֶׁיִּתְוַדֶּה עָלָיו, כְּדִכְתִיב \"וְהִתְוַדָּה עָלָיו\" וְגוֹ':", "rashi_en": "חי ‎יעמד SHALL BE PRESENTED ALIVE —  חי‎ יָעֳמַד is the same as חי ‏‎ ‏ יוּעֲמַד (i. e. יָעֳמַד is a regular Hophal-form) — it shall be made to stand by others (i. e. it shall be placed). The Targum also renders it by: יתקם כד חי, “it shall be made to stand in a live state\". — Why is it stated that it shall be presented alive; this is already implied in the word יעמד. it shall be made to stand!? But because it continues “to send it forth unto Azazel\" and I would not know whether this “sending forth” means to death or to life (in the latter case it would mean “to let it go”; cf. Leviticus 14:7 where ושלח has this meaning), therefore Scripture states “it shall be presented alive” — its presentation must be made whilst it is alive and the animal remains so up to the time when it is being sent forth; it follows therefore that it shall be sent forth to death (Sifra, Acharei Mot, Chapter 2 6).<br><br>לכפר עליו THAT HE MAY MAKE AN EXPIATION WITH IT — i. e. that he (the High-Priest) shall confess upon it (upon its head) Israel’s sins, as it is said (v. 21) “And Aaron shall confess upon it [the iniquities of the children of Israel]” (cf. Yoma 40b)."}, {"ch": 16, "v": 11, "aliyah": 1, "heb": "וְהִקְרִ֨יב אַהֲרֹ֜ן אֶת־פַּ֤ר הַֽחַטָּאת֙ אֲשֶׁר־ל֔וֹ וְכִפֶּ֥ר בַּֽעֲד֖וֹ וּבְעַ֣ד בֵּית֑וֹ וְשָׁחַ֛ט אֶת־פַּ֥ר הַֽחַטָּ֖את אֲשֶׁר־לֽוֹ׃", "onk": "וִיקָרֵב אַהֲרֹן יָת תּוֹרָא דְחַטָּאתָא דִּי לֵיהּ וִיכַפֵּר עֲלוֹהִי וְעַל אֱנַשׁ בֵּיתֵיהּ וְיִכּוֹס יָת תּוֹרָא דְחַטָּאתָא דִּי לֵיהּ:", "onk_en": "Aharon shall bring the sin-offering-bullock which is his and atone on his behalf and on behalf of his household, and he shall slaughter his sin-offering-bullock.", "pj": "וְיַקְרֵיב אַהֲרן יַת תּוֹרָא דִילֵיהּ וִיכַפֵּר בְּאִישְׁתְּעוּת מִילַיָא עֲלוֹי וְעַל אֵינַשׁ בֵּיתֵיהּ וְיִכּוֹס יַת תּוֹרָא דְחַטָאתָא דִילֵיהּ", "pj_en": "And Aharon shall bring the bullock which is for himself, and make atonement with confession of words for himself, and for the men of his house, and kill the bullock for his sin offering.", "tj": "", "tj_en": "", "rashi": "<b>וכפר בעדו וגו'.<\/b> וִדּוּי שֵׁנִי, עָלָיו וְעַל אֶחָיו הַכֹּהֲנִים, שֶׁהֵם כֻּלָּם קְרוּיִים בֵּיתוֹ, שֶׁנֶּאֱמַר \"בֵּית אַהֲרֹן בָּרֲכוּ אֶת ה'\" וְגוֹ' (תהילים קל\"ה), מִכָּאן שֶׁהַכֹּהֲנִים מִתְכַּפְּרִין בּוֹ, וְכָל כַּפָּרָתָן אֵינָהּ אֶלָּא עַל טֻמְאַת מִקְדָּשׁ וְקָדָשָׁיו, כְּמוֹ שֶׁנֶּאֱמַר (פסוק ט\"ז), \"וְכִפֶּר עַל הַקֹּדֶשׁ מִטֻּמְאֹת\" וְגוֹ' (ספרא; שבועות ז'):", "rashi_en": "'וכפר בעדו וגו‎ AND HE SHALL MAKE AN EXPIATION FOR HIMSELF etc. — This implies a second confession of sins which he was to make for himself and on behalf of his brother-priests, who may all be termed “his house”, as it said (Psalms 135:19) “Bless the Lord, o house of Aaron, etc.\" (cf. Shevuot 14a). Hence we learn that the priests become atoned for by means of it (the bullock). The expiation effected by it extended, however, only to those sins committed by causing uncleanness to the Sanctuary or holy things (i.e. by the priests having entered the Sanctuary or eaten of the holy things in such a state), as it is said (v. 16) “And he shall make an expiation for the holy place because of the uncleanness [of the children of Israel] etc.”."}, {"ch": 16, "v": 12, "aliyah": 1, "heb": "וְלָקַ֣ח מְלֹֽא־הַ֠מַּחְתָּ֠ה גַּֽחֲלֵי־אֵ֞שׁ מֵעַ֤ל הַמִּזְבֵּ֙חַ֙ מִלִּפְנֵ֣י יְהֹוָ֔ה וּמְלֹ֣א חׇפְנָ֔יו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְהֵבִ֖יא מִבֵּ֥ית לַפָּרֹֽכֶת׃", "onk": "וְיִסַּב מְלֵי מַחְתִּיתָא גּוּמְרִין דְּאֶשָּׁא מֵעִלַּוֵי מַדְבְּחָא מִן קֳדָם יְיָ וּמְלֵי חָפְנוֹהִי קְטוֹרֶת <b>בּוּסְמִין<\/b> דַּקִּיקִין וְיָעֵל מִגָּיו לְפָרֻכְתָּא:", "onk_en": "He shall take a full hand-shovel of fiery coals from atop the altar, which is before Adonoy and full handfuls of finely-ground incense and he shall bring [them] inside of the curtain.", "pj": "וְיִסַב מְלֵי מַחְתִּיתָא גוּמְרִין לַחֲשַׁן דְאֵישָׁא מֵעִילַוֵי מַדְבְּחָא מִן קֳדָם יְיָ וּמְלֵי חוֹפְנוֹי קְטוֹרֶת בּוּסְמִין כְּתִישִׁין וְיָעֵיל מִן לְגֵיו לְפַרְגוֹדָא", "pj_en": "And he shall take a censer full of coals burning with fire from off the altar from before the Lord, and with his hand full of sweet incense, beaten small, he shall enter within the veil.", "tj": "", "tj_en": "", "rashi": "<b>מעל המזבח.<\/b> הַחִיצוֹן:<br><br><b>מלפני ה'.<\/b> מִצַּד שֶׁלִּפְנֵי הַפֶּתַח, וְהוּא צַד מַעֲרָבִי:<br><br><b>דקה.<\/b> מַה תַּ\"ל דַּקָּה? וַהֲלֹא כָל הַקְּטֹרֶת דַּקָּה הִיא, שֶׁנֶּאֱמַר וְשָׁחַקְתָּ מִמֶּנָּה הָדֵק (שמות ל\"ו), אֶלָּא שֶׁתְּהֵא דַּקָּה מִן הַדַּקָּה, שֶׁבְּעֶרֶב יֹהַ\"כִּ הָיָה מַחֲזִירָהּ לַמַּכְתֶּשֶׁת (כריתות ו'):", "rashi_en": "מעל המזבח FROM OFF THE ALTAR — i. e. the outer altar (that was in the fore-court) (Yoma 45b).<br><br>מלפני ה׳ FROM BEFORE THE LORD — from that side of the altar which was before the entrance — that is, the west side (cf. Yoma 45b.) <br><br>דקה [AND HIS HANDS FULL OF INCENSE OF AROMATICS] FINE — Why is it stated that it shall be fine? Was not all incense fine, for so it is said, (Exodus 30:36) \"And thou shall rub some of it very fine” - ? But it is intended to teach that it (the incense used on the Day of Atonement) was to be of the very finest powder, for on the Eve of the Day of Atonement it (the ordinary incense) was put again into the mortar in order that it should be again beaten into a finer powder. (Sifra, Acharei Mot, Chapter 3 8-9; Keritot 6b; Yoma 45a)."}, {"ch": 16, "v": 13, "aliyah": 1, "heb": "וְנָתַ֧ן אֶֽת־הַקְּטֹ֛רֶת עַל־הָאֵ֖שׁ לִפְנֵ֣י יְהֹוָ֑ה וְכִסָּ֣ה&thinsp;<b>׀<\/b> עֲנַ֣ן הַקְּטֹ֗רֶת אֶת־הַכַּפֹּ֛רֶת אֲשֶׁ֥ר עַל־הָעֵד֖וּת וְלֹ֥א יָמֽוּת׃", "onk": "וְיִתֵּן יָת קְטוֹרֶת בּוּסְמַיָּא עַל אֶשָּׁתָא לָקֳדָם יְיָ וְחָפֵי עֲנָנָא קְטָרְתָּא יָת כַּפֻּרְתָּא דִּי עַל סַהֲדוּתָא וְלָא יְמוּת:", "onk_en": "He shall put the incense [<b>spices<\/b>] on the fire before Adonoy and the cloud of incense will cover the Ark-cover that is on the [tablets of] Testimony, that he not die.", "pj": "וְיִתֵּן יַת קְטוֹרֶת בּוּסְמַיָא עַל אֵישָׁתָא קֳדָם יְיָ וְיַחְפֵי עֲנַן תְּנַן קְטוּרְתָּא יַת כַּפּוּרְתָּא דְעַל סַהֲדוּתָא וְלָא יְמוּת בְּאֵישָׁא מְצַלְהֲבָא קֳדָם יְיָ", "pj_en": "And he shall put the sweet incense upon the fire before the Lord, and the cloud of the fuming incense shall envelope the mercy-seat that is over the testimony, that he may not die by the flaming fire before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>על האש.<\/b> שֶׁבְּתוֹךְ הַמַּחְתָּה:<br><br><b>ולא ימות.<\/b> הָא אִם לֹא עֲשָֹאָהּ כְּתִקְנָהּ חַיָּב מִיתָה (ספרא):", "rashi_en": "על האש UPON THE FIRE which was in the censer.<br><br>ולא ימות THAT IIE DIE NOT — Hence, if he did not offer it according to regulation he was liable to the death penalty (Sifra, Acharei Mot, Chapter 3 10; Yoma 53a)."}, {"ch": 16, "v": 14, "aliyah": 1, "heb": "וְלָקַח֙ מִדַּ֣ם הַפָּ֔ר וְהִזָּ֧ה בְאֶצְבָּע֛וֹ עַל־פְּנֵ֥י הַכַּפֹּ֖רֶת קֵ֑דְמָה וְלִפְנֵ֣י הַכַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע־פְּעָמִ֛ים מִן־הַדָּ֖ם בְּאֶצְבָּעֽוֹ׃", "onk": "וְיִסַּב מִדְּמָא דְתוֹרָא וְיַדִּי בְאֶצְבְּעֵיהּ עַל אַפֵּי כַּפֻּרְתָּא קִדּוּמָא וְלָקֳדָם כַּפֻּרְתָּא יַדִּי שְׁבַע זִמְנִין מִן דְּמָא בְּאֶצְבְּעֵיהּ:", "onk_en": "He shall take some of the bullocks blood and he shall sprinkle with his finger, above the surface of the Ark-cover on its eastern part; and before the Ark-cover, he shall sprinkle, some blood, with his finger, seven times.", "pj": "וְיִסַב מִן אַדְמָא דְתוֹרָא וְיַדֵי בְּאַדְבְּעֵיהּ יְמִינָא עַל אַפֵּי כַּפּוּרְתָּא לְרוּחַ קִידוּמָא וְלִקְדָם כַּפּוּרְתָּא יַדֵי שְׁבַע זִמְנִין מִן אַדְמָהּ בְּאַדְבְּעֵיהּ יַמִינָא", "pj_en": "And he shall take of the blood of the bullock, and sprinkle with his right finger upon the face of the mercy-seat eastward, and before the mercyseat he shall sprinkle the blood seven times with his right finger.", "tj": "", "tj_en": "", "rashi": "<b>והזה באצבעו.<\/b> הַזָּאָה אַחַת בְּמַשְׁמָע:<br><br><b>ולפני הכפרת יזה שבע.<\/b> הֲרֵי אַחַת לְמַעְלָה וְשֶׁבַע לְמַטָּה (שם):", "rashi_en": "והזה  באצבעו AND HE SHALL SPRINKLE IT WITH THE FINGER — One sprinkling only is implied (since the next phrase mentions a definite number),<br><br>ולפני הכפרת יזה שבע AND BEFORE THE COVERING SHALL HE SPRINKLE [OF THE BLOOD] SEVEN TIMES — Thus we have one sprinkling upwards and seven downwards (Yoma 53b)."}, {"ch": 16, "v": 15, "aliyah": 1, "heb": "וְשָׁחַ֞ט אֶת־שְׂעִ֤יר הַֽחַטָּאת֙ אֲשֶׁ֣ר לָעָ֔ם וְהֵבִיא֙ אֶת־דָּמ֔וֹ אֶל־מִבֵּ֖ית לַפָּרֹ֑כֶת וְעָשָׂ֣ה אֶת־דָּמ֗וֹ כַּאֲשֶׁ֤ר עָשָׂה֙ לְדַ֣ם הַפָּ֔ר וְהִזָּ֥ה אֹת֛וֹ עַל־הַכַּפֹּ֖רֶת וְלִפְנֵ֥י הַכַּפֹּֽרֶת׃", "onk": "וְיִכּוֹס יָת צְפִירָא דְחַטָּאתָא דִּי לְעַמָּא וְיָעֵל יָת דְּמֵיהּ לְמִגָּיו לְפָרֻכְתָּא וְיַעְבֵּד לִדְמֵיהּ כְּמָא דִי עֲבַד לִדְמָא דְתוֹרָא וְיַדִּי יָתֵיהּ עַל כַּפֻּרְתָּא וְלָקֳדָם כַּפֻּרְתָּא:", "onk_en": "He shall slaughter the he-goat sin-offering that belongs to the people, and he shall bring its blood inside of the Curtain. He shall do [with] its blood just as he did with the bullocks blood and he shall sprinkle it on the Ark-cover and before of the Ark-cover.", "pj": "וְיִכּוֹס יַת צְפִירָא דְחַטָאתָא דְמִן מָמוֹנָא דְעַמָא וְיָעֵיל יַת אַדְמָא דִצְפִירָא מִלְגֵיו לְפַרְגוֹדָא וְיַעֲבֵיד לְאַדְמֵיהּ הֵי כְמָא דְעָבַד לְאַדְמָא דְתוֹרָא וְיַדֵי יָתֵיהּ עַל כַּפּוּרְתָּא וְלִקְדָם כַּפּוּרְתָּא", "pj_en": "Then shall he kill the goat of the sin offering which is (purchased with) the money of the people, and carry in of the blood of the goat within the veil, and do with the blood of the goat as he did with the blood of the bullock, and sprinkle it upon the mercy-seat, and before the mercy-seat.", "tj": "", "tj_en": "", "rashi": "<b>אשר לעם.<\/b> מַה שֶּׁהַפָּר מְכַפֵּר עַל הַכֹּהֲנִים מְכַפֵּר הַשָּׂעִיר עַל יִשְׂרָאֵל, וְהוּא הַשָּׂעִיר שֶׁעָלָה עָלָיו הַגּוֹרָל לַשֵּׁם (שבועות ב'):<br><br><b>כאשר עשה לדם הפר.<\/b> אַחַת לְמַעְלָה וְשֶׁבַע לְמַטָּה:", "rashi_en": "אשר לעם [THE GOAT OF THE SIN-OFFERING] THAT IS FOR THE PEOPLE — Only for that which the bullock effects atonement for the priests (i. e. for ומאת מקדש וקדשיו‎ט) the goat effects atonement for the Israelites. It (the goat spoken of here) is that goat upon which the lot “for the Lord\" fell (Yoma 61a; Shevuot 2b).<br><br>כאשר עשה לדם הפר AS HE DID WITH THE BLOOD OF THE BULLOCK, viz., sprinkling once upwards and seven times downwards (Yoma 53b)."}, {"ch": 16, "v": 16, "aliyah": 1, "heb": "וְכִפֶּ֣ר עַל־הַקֹּ֗דֶשׁ מִטֻּמְאֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וּמִפִּשְׁעֵיהֶ֖ם לְכׇל־חַטֹּאתָ֑ם וְכֵ֤ן יַעֲשֶׂה֙ לְאֹ֣הֶל מוֹעֵ֔ד הַשֹּׁכֵ֣ן אִתָּ֔ם בְּת֖וֹךְ טֻמְאֹתָֽם׃", "onk": "וִיכַפֵּר עַל קוּדְשָׁא מִסּוֹאֲבַת בְּנֵי יִשְׂרָאֵל וּמִמֶּרְדֵּיהוֹן לְכָל חֲטָאֵיהוֹן וְכֵן יַעְבֵּד לְמַשְׁכַּן זִמְנָא דְּשָׁרֵי עִמְּהוֹן בְּגוֹ סוֹאֲבָתְהוֹן:", "onk_en": "He will atone for the Sanctuary, from the impurities of Bnei Yisroel and from their rebellious sins for all their transgressions. He shall do likewise for the Tent of Meeting, that dwells with them in the midst of their impurity.", "pj": "וִיכַפֵּר עַל קוּדְשָׁא בְּאִישְׁתָּעוּת מִילַיָא מִסוֹאֲבוֹת בְּנֵי יִשְרָאֵל וּמִמְרָדֵיהוֹן לְכָל חַטָאֵיהוֹן וְהֵיכְדִין יַעֲבֵיד לְמַשְׁכַּן זִמְנָא דְשָׁרֵי עִמְהוֹן בְּגוֹ סְאוֹבְתְּהוֹן", "pj_en": "And he shall make atonement for the holy place, with confession of words for the uncleanness of the children of Israel, and for their rebellions, and for their sins; and so shall he do for the tabernacle of ordinance which remaineth with them in the midst of their uncleanness.", "tj": "", "tj_en": "", "rashi": "<b>מטמאת בני ישראל.<\/b> עַל הַנִּכְנָסִין לַמִּקְדָּשׁ בְּטֻמְאָה וְלֹא נוֹדַע לָהֶם בַּסּוֹף, שֶׁנֶּאֱמַר <b>לכל חטאתם<\/b>, וְחַטָּאת הִיא שׁוֹגֵג.<br><br><b>ומפשעיהם.<\/b> אַף הַנִּכְנָסִין מֵזִיד בְּטֻמְאָה (שם ז'):<br><br><b>וכן יעשה לאהל מועד.<\/b> כְּשֵׁם שֶׁהִזָּה מִשְּׁנֵיהֶם בִּפְנִים אַחַת לְמַעְלָה וְשֶׁבַע לְמַטָּה, כָּךְ מַזֶּה עַל הַפָּרֹכֶת מִבַּחוּץ מִשְּׁנֵיהֶם אַחַת לְמַעְלָה וְשֶׁבַע לְמַטָּה (ספרא; יומא נ\"ו):<br><br><b>השכן אתם בתוך טמאתם.<\/b> אַעַ\"פִּי שֶׁהֵם טְמֵאִים שְׁכִינָה בֵינֵיהֶם (שם):", "rashi_en": "מטמאת בני ישראל [AND HE SHALL MAKE AN EXPIATION FOR THE HOLY PLACE] BECAUSE OF THE UNCLEANNESS OF THE CHILDREN OF ISRAEL — i. e. for those who entered the Sanctuary in a state of uncleanness without having finally become conscious of this fact (Shevuot 7b), for it is said לכל חטאתם, and the word חטאת implies a sin committed unconsciously.<br><br>ומפשעיהם AND BECAUSE OF THEIR TRANSGRESSIONS — This implies atonement also for those who entered the Sanctuary presumptuously in a state of uncleanness (Shevuot 7b; cf. also Shevuot 2a and Sifra, Acharei Mot, Chapter 4 1).<br><br>וכן יעשה לאהל מועד AND SO SHALL HE DO FOR THE APPOINTED TENT — Just as he sprinkled in the “Interior\" (the Holy of Holies) from the blood of both of them (of the bullock and the goat) once upwards and seven times downwards so he sprinkles over against the Partition Vail from outside (i. e. standing in the היכל; cf. Leviticus 4:6) once upwards and seven times downwards (Sifra, Acharei Mot, Chapter 4 5; Yoma 56b).<br><br>השכן אתם בתוך טמאתם— This implies that although they are unclean nevertheless the Shechinah dwells in their midst (Sifra, Acharei Mot, Chapter 4 5; Yoma 57a)."}, {"ch": 16, "v": 17, "aliyah": 1, "heb": "וְכׇל־אָדָ֞ם לֹא־יִהְיֶ֣ה&thinsp;<b>׀<\/b> בְּאֹ֣הֶל מוֹעֵ֗ד בְּבֹא֛וֹ לְכַפֵּ֥ר בַּקֹּ֖דֶשׁ עַד־צֵאת֑וֹ וְכִפֶּ֤ר בַּעֲדוֹ֙ וּבְעַ֣ד בֵּית֔וֹ וּבְעַ֖ד כׇּל־קְהַ֥ל יִשְׂרָאֵֽל׃", "onk": "וְכָל אֱנַשׁ לָא יְהֵי בְּמַשְׁכַּן זִמְנָא בְּמֵעֲלֵיהּ לְכַפָּרָא בְקוּדְשָׁא עַד מִפְּקֵיהּ וִיכַפֵּר עֲלוֹהִי וְעַל אֱנַשׁ בֵּיתֵיהּ וְעַל כָּל קְהָלָא דְיִשְׂרָאֵל:", "onk_en": "No man shall be present in the Tent of Meeting when he comes in to atone for the Holy [Sanctuary] until he leaves. He shall atone on his behalf and on behalf of his household and on behalf of the entire assembly of Israel.", "pj": "וְכָל אֵינַשׁ לָא יְהֵי בְמַשְׁכַּן זִמְנָא בִּזְמַן מֵיעֲלֵיהּ לְכַפָּרָא בְּקוּדְשָׁא עַל חוֹבֵיהוֹן דְיִשְרָאֵל עַד זְמַן מִפְקֵיהּ וִיכַפֵּר עֲלוֹי וְעַל אֱנַשׁ בַּיְיתֵיהּ וְעַל כָּל קְהָלָא דְיִשְרָאֵל", "pj_en": "But let no one be in the tabernacle of ordinance at the time of his going in to make atonement in the holy place for the sins of Israel, until the time of his coming out; and so shall he make atonement for himself, and for the men of his house, and for all the congregation of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 18, "aliyah": 2, "heb": "וְיָצָ֗א אֶל־הַמִּזְבֵּ֛חַ אֲשֶׁ֥ר לִפְנֵֽי־יְהֹוָ֖ה וְכִפֶּ֣ר עָלָ֑יו וְלָקַ֞ח מִדַּ֤ם הַפָּר֙ וּמִדַּ֣ם הַשָּׂעִ֔יר וְנָתַ֛ן עַל־קַרְנ֥וֹת הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְיִפּוֹק לְמַדְבְּחָא דִּי קֳדָם יְיָ וִיכַפֵּר עֲלוֹהִי וְיִסַּב מִדְּמָא דְתוֹרָא וּמִדְּמָא דִצְפִירָא וְיִתֵּן עַל קַרְנַת מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He shall go out to the altar that is before Adonoy and atone on it. He shall take some of the bullocks blood and some of the he-goats blood and put it atop the corners of the altar, all around.", "pj": "וִיצַדֵד וְיִפּוֹק מִן קוּדְשָׁא לְמַדְבְּחָא דִקְדָם יְיָ וִיכַפֵּר עֲלוֹי בְּאִשְׁתְּעוּת מִילַיָא וְיִסַב מֵאַדְמָא דְתוֹרָא וּמֵאַדְמָא דִצְפִירָא כַּד הִינוּן מְעַרְבִין וְיִתֵּן עַל קַרְנַת מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And he shall withdraw, and come forth from the holy place, unto the altar which is before the Lord, and make atonement upon it with confession of words, and take of the blood of the bullock and of the blood of the goat, mingled together, and put it upon the horns of the altar round about.", "tj": "", "tj_en": "", "rashi": "<b>אל המזבח אשר לפני ה'.<\/b> זֶה מִזְבַּח הַזָּהָב שֶׁהוּא לִפְנֵי ה' — בַּהֵיכָל, וּמַה תַּ\"ל וְיָצָא? לְפִי שֶׁהִזָּה הַהַזָּאוֹת עַל הַפָּרֹכֶת וְעָמַד מִן הַמִּזְבֵּחַ וְלִפְנִים וְהִזָּה, וּבְמַתְּנוֹת הַמִּזְבֵּחַ הִזְקִיקוֹ לָצֵאת מִן הַמִּזְבֵּחַ וְלַחוּץ וְיַתְחִיל מִקֶּרֶן מִזְרָחִית צְפוֹנִית (יומא נ\"ח):<br><br><b>וכפר עליו.<\/b> מַה הִיא כַפָּרָתוֹ? <b>ולקח מדם הפר ומדם השעיר<\/b> מְעֹרָבִין זֶה לְתוֹךְ זֶה (שם נ\"ז):", "rashi_en": "אל המזבח אשר ‎'לפני ה‎‎‎ [AND HE SHALL GO OUT] UNTO THE ALTAR THAT IS BEFORE THE LORD — i. e. unto the golden altar which is before the Lord viz., in the היכל. But why then (if the golden altar is intended) does Scripture state ויצא, “he shall go out\" since he did not then leave the area where he officiated before? But because immediately before he made the sprinklings in front of the Partition Vail (cf. Rashi on the preceding verse) and was standing inwards (i.e. westwards) from the altar when sprinkling, whilst for the purpose of sprinkling the blood upon the horns of the altar Scripture forced him to go outwards from the altar (i. e. to its east-side, the side facing the exit) so that he should begin the sprinklings from the north-east corner, therefore it rightly Uses the term ויצא, he shall go out\"  i. e. move alongside the altar towards the exit (Sifra, Acharei Mot, Chapter 4 7-8; Yoma 58b).<br><br>וכפר עליו AND HE SHALL MAKE EXPIATION FOR IT — wherein does this expiation consist? ולקח מדם הפר ומדם השעיר that HE TAKETH OF THE BLOOD OF THE BULLOCK AND OF THE BLOOD OF THE GOAT mingled one with the other and sprinkles it (Sifra, Acharei Mot, Chapter 4 9; Yoma 57b)."}, {"ch": 16, "v": 19, "aliyah": 2, "heb": "וְהִזָּ֨ה עָלָ֧יו מִן־הַדָּ֛ם בְּאֶצְבָּע֖וֹ שֶׁ֣בַע פְּעָמִ֑ים וְטִהֲר֣וֹ וְקִדְּשׁ֔וֹ מִטֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְיַדֵּי עֲלוֹהִי מִן דְּמָא בְּאֶצְבְּעֵיהּ שְׁבַע זִמְנִין וִידַכִּנֵּיהּ וִיקַדְּשִׁנֵּיהּ מִסּוֹאֲבַת בְּנֵי יִשְׂרָאֵל:", "onk_en": "He shall sprinkle on it from the blood that is on his finger seven times and purify it and sanctify it from the impurities of Bnei Yisroel.", "pj": "וְיַדֵי עֲלוֹי מִן אַדְמָא בְּאִידְבְּעֵיהּ יַמִינָא שְׁבַע זִמְנִין וִידַכִּינֵיהּ וִיקַדְשִׁינֵיהּ מִסוֹאֲבוֹת בְּנֵי יִשְרָאֵל", "pj_en": "And he shall sprinkle upon it from the blood with his right finger seven times, and cleanse it, and sanctify it from the defilements of the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>והזה עליו מן הדם.<\/b> אַחַר שֶׁנָּתַן מַתָּנוֹת בְּאֶצְבָּעוֹ עַל קַרְנוֹתָיו מַזֶּה שֶׁבַע הַזָּאוֹת עַל גַּגּוֹ:<br><br><b>וטהרו.<\/b> מִמַּה שֶּׁעָבָר:<br><br><b>וקדשו.<\/b> לֶעָתִיד לָבֹא (ספרא):", "rashi_en": "והזה עליו מן הדם AND HE SHALL SPRINKLE UPON IT WITH THE BLOOD — After he has made with his finger the application of the blood upon the horns of the altar he shall make seven sprinklings on its top (עליו signifies \"upon it\") (cf. Sifra, Acharei Mot, Chapter 4 12).<br><br>וטהרו AND THUS HE CLEANSES IT from the defilement that happened to it in the past,<br><br>וקדשו AND HALLOWS IT for use in the future (Sifra, Acharei Mot, Chapter 4 13)"}, {"ch": 16, "v": 20, "aliyah": 2, "heb": "וְכִלָּה֙ מִכַּפֵּ֣ר אֶת־הַקֹּ֔דֶשׁ וְאֶת־אֹ֥הֶל מוֹעֵ֖ד וְאֶת־הַמִּזְבֵּ֑חַ וְהִקְרִ֖יב אֶת־הַשָּׂעִ֥יר הֶחָֽי׃", "onk": "וִישֵׁצֵי מִלְּכַפָּרָא עַל קוּדְשָׁא וְעַל מַשְׁכַּן זִמְנָא וְעַל מַדְבְּחָא וִיקָרֵב יָת צְפִירָא חַיָּא:", "onk_en": "When he finishes atoning for the Holy [Sanctuary] and [for] the Tent of Meeting and [for] the altar he shall bring the live he-goat.", "pj": "וְיִפְסוֹק מִן לִמְכַפְּרָא עַל קוּדְשָׁא וְעַל מַשְׁכַּן זִמְנָא וְעַל מַדְבְּחָא בְּאִישְׁתְּעוּת מִילַיָא וְיִקְרַב יַת צְפִירָא חַיָיא", "pj_en": "And when he hath completed to make atonement for the holy place, and for the tabernacle of ordinance, and for the altar, with confession of words, he shall bring near the living goat.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 21, "aliyah": 2, "heb": "וְסָמַ֨ךְ אַהֲרֹ֜ן אֶת־שְׁתֵּ֣י <span class=\"mam-kq-trivial\">יָדָ֗ו<\/span> עַ֣ל רֹ֣אשׁ הַשָּׂעִיר֮ הַחַי֒ וְהִתְוַדָּ֣ה עָלָ֗יו אֶת־כׇּל־עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְאֶת־כׇּל־פִּשְׁעֵיהֶ֖ם לְכׇל־חַטֹּאתָ֑ם וְנָתַ֤ן אֹתָם֙ עַל־רֹ֣אשׁ הַשָּׂעִ֔יר וְשִׁלַּ֛ח בְּיַד־אִ֥ישׁ עִתִּ֖י הַמִּדְבָּֽרָה׃", "onk": "וְיִסְמוֹךְ אַהֲרֹן יָת תַּרְתֵּין יְדוֹהִי עַל רֵישׁ צְפִירָא חַיָּא וְיִוַדֵּי עֲלוֹהִי יָת כָּל עֲוָיַת בְּנֵי יִשְׂרָאֵל וְיָת כָּל מֶרְדֵּיהוֹן לְכָל חֲטָאֵיהוֹן וְיִתֵּן יָתְהוֹן עַל רֵישׁ צְפִירָא וִישַׁלַּח בְּיַד גְּבַר דִּזְמִין <b>לִמְהַךְ<\/b> לְמַדְבְּרָא:", "onk_en": "Aharon shall lay his two hands on the head of the live he-goat and confess on it all the iniquities of Bnei Yisroel and all their rebellious transgressions for all their sins, and put them on the head of the goat and send it away with the man [so] designated, to [<b>go to<\/b>] the desert.", "pj": "וְיִסְמוֹךְ אַהֲרן יַת תַּרְתֵּין יְדוֹי בְּסִידְרָא חֲדָא יַת יְמִינֵיהּ עַל שְמָאלֵיהּ עַל רֵישׁ צְפִירָא חַיָיא וְיוֹדֵי עֲלוֹי יַת כָּל עֲוָיַית בְּנֵי יִשְרָאֵל וְיַת כָּל מְרוֹדֵיהוֹן לְכָל חַטָאֵיהוֹן וְיִתֵּן יַתְהוֹן בִּשְׁבוּעָה אֲמִירָא וּמְפָרְשָׁא בִּשְׁמָא רַבָּא וְיַקִירָא עַל רֵישׁ צְפִירָא וְיִפְטוֹר בְּיַד גְבַר דִי מְזַמֵן מִן אִשְׁתַּקֵד לִמְהַךְ לְמַדְבְּרָא דְצוֹק דְהוּא בֵּית חַרוֹרִי", "pj_en": "And Aharon shall lay his hands (upon him) in this order, his right hand upon his left, upon the head of the living goat, and confess over him all the iniquities of the children of Israel, and all their rebellions, and all their sins, and shall put them, with an oath uttered and expressed with the Great and glorious Name, upon the head of the goat, and send (him) away by the hand of a man prepared from the year foregoing, to take him into a rocky desert which is Beth-hadurey;", "tj": "", "tj_en": "", "rashi": "<b>איש עתי.<\/b> הַמּוּכָן לְכָךְ מִיּוֹם אֶתְמוֹל:", "rashi_en": "איש עתי A READY MAN — one who was held in readiness for this purpose from yesterday (Yoma 66a; Sifra, Acharei Mot, Section 4 8)."}, {"ch": 16, "v": 22, "aliyah": 2, "heb": "וְנָשָׂ֨א הַשָּׂעִ֥יר עָלָ֛יו אֶת־כׇּל־עֲוֺנֹתָ֖ם אֶל־אֶ֣רֶץ גְּזֵרָ֑ה וְשִׁלַּ֥ח אֶת־הַשָּׂעִ֖יר בַּמִּדְבָּֽר׃", "onk": "וְיִטּוֹל צְפִירָא עֲלוֹהִי יָת כָּל חוֹבֵיהוֹן לְאַרְעָא <b>דְלָא יָתְבָא<\/b> וִישַׁלַּח יָת צְפִירָא בְּמַדְבְּרָא:", "onk_en": "The goat shall carry upon itself all of their iniquities to a desolate [<b>an uninhabited<\/b>] land, and [the man shall] send the goat into the desert.", "pj": "וִיסוֹבַר צְפִירָא עֲלוֹי יַת כָּל חוֹבֵיהוֹן לַאֲתַר צַדְיָא וְיִפְטוֹר גַבְרָא יַת צְפִירָא לְמַדְבְּרָא דְצוֹק וְיִסוֹק צְפִירָא עַל טַוְורַיָא דְבֵית חֲרוֹרֵי וְיַדְחִינֵיהּ רוּחַ זִיקָא מִן קֳדָם יְיָ וִימוּת", "pj_en": "and the goat shall bear upon him all their sins into a desert place; and the man shall send forth the goat to a rocky desert; and the goat will go up on the mountains of Beth-hadurey, and a tempestuous wind from the presence of the Lord will carry him away, and he will die.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 23, "aliyah": 2, "heb": "וּבָ֤א אַהֲרֹן֙ אֶל־אֹ֣הֶל מוֹעֵ֔ד וּפָשַׁט֙ אֶת־בִּגְדֵ֣י הַבָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּבֹא֣וֹ אֶל־הַקֹּ֑דֶשׁ וְהִנִּיחָ֖ם שָֽׁם׃", "onk": "וְיֵיעוֹל אַהֲרֹן לְמַשְׁכַּן זִמְנָא וְיַשְׁלַח יָת לְבוּשֵׁי בוּצָא דִּי לְבַשׁ בְּמֵעֲלֵיהּ לְקוּדְשָׁא <b>וְיַצְנְעִנּוּן<\/b> תַּמָּן:", "onk_en": "Aharon will [then] come into the Tent of Meeting and remove the linen garments that he wore when he came into the Holy [Sanctuary] and place [<b>hide<\/b>] them there.", "pj": "וְיֵיעוֹל אַהֲרן וּבְנוֹי לְמַשְׁכַּן זִימְנָא וִישַׁלַח יַת לְבוּשֵׁי בוּצָא דְמִילַת דִלְבַשׁ בִּזְמַן מֵיעֲלֵיהּ לְקוּדְשָׁא וְיַצְנֵיעִינוּן תַּמָן", "pj_en": "And Aharon shall enter the tabernacle of ordinance, and take off the robes of fine linen with which he was attired at the time of his going into the holy place, and shall lay them aside there.", "tj": "", "tj_en": "", "rashi": "<b>ובא אהרן אל אהל מועד.<\/b> אָמְרוּ רַבּוֹתֵינוּ שֶׁאֵין זֶה מְקוֹמוֹ שֶׁל מִקְרָא זֶה וְנָתְנוּ טַעַם לְדִבְרֵיהֶם בְּמַסֶּכֶת יוֹמָא (דף ל\"ב), וְאָמְרוּ: כָּל הַפָּרָשָׁה כֻּלָּהּ נֶאֶמְרָה עַל הַסֵּדֶר חוּץ מִבִּיאָה זוֹ שֶׁהִיא אַחַר עֲשִֹיַּת עוֹלָתוֹ וְעוֹלַת הָעָם, וְהַקְטָרַת אֵמוּרֵי פַּר וְשָֹעִיר, שֶׁנַּעֲשִֹים בַּחוּץ בְּבִגְדֵי זָהָב, וְטוֹבֵל וּמְקַדֵּשׁ וּפוֹשְׁטָן וְלוֹבֵשׁ בִּגְדֵי לָבָן, <b>ובא אל אהל מועד<\/b> לְהוֹצִיא אֶת הַכַּף וְאֶת הַמַּחְתָּה שֶׁהִקְטִיר בָּהּ הַקְּטֹרֶת לִפְנַי וְלִפְנִים:<br><br><b>ופשט את בגדי הבד.<\/b> אַחַר שֶׁהוֹצִיאָהּ, וְלוֹבֵשׁ בִּגְדֵי זָהָב לְתָמִיד שֶׁל בֵּין הָעַרְבַּיִם; וְזֶהוּ סֵדֶר הָעֲבוֹדוֹת: תָּמִיד שֶׁל שַׁחַר בְּבִגְדֵי זָהָב, וַעֲבוֹדַת פַּר וְשָׂעִיר הַפְּנִימִיִּים וּקְטֹרֶת שֶׁל מַחְתָּה בְּבִגְדֵי לָבָן, וְאֵילוֹ וְאֵיל הָעָם וּמִקְצַת הַמּוּסָפִין בְּבִגְדֵי זָהָב, וְהוֹצָאַת כַּף וּמַחְתָּה בְּבִגְדֵי לָבָן, וּשְׁיָרֵי הַמּוּסָפִין וְתָמִיד שֶׁל בֵּין הָעַרְבַּיִם וּקְטֹרֶת הַהֵיכָל שֶׁעַל מִזְבֵּחַ הַפְּנִימִי בְּבִגְדֵי זָהָב; וְסֵדֶר הַמִּקְרָאוֹת לְפִי הָעֲבוֹדוֹת כָּךְ הוּא: וְשִׁלַּח אֶת הַשָּׂעִיר בַּמִּדְבָּר, וְרָחַץ אֶת בְּשָׂרוֹ בַמַּיִם וְגוֹ', וְיָצָא וְעָשָׂה אֶת עֹלָתוֹ וְגוֹ', וְאֵת חֵלֶב הַחַטָּאת וְגוֹ', וְכָל הַפָּרָשָׁה עַד וְאַחֲרֵי כֵן יָבוֹא אֶל הַמַּחֲנֶה — וְאַחַר כָּךְ וּבָא אַהֲרֹן:<br><br><b>והניחם שם.<\/b> מְלַמֵּד שֶׁטְּעוּנִין גְּנִיזָה וְלֹא יִשְׁתַּמֵּשׁ בְּאוֹתָן ד' בְגָדִים לְיוֹם הַכִּפּוּרִים אַחֵר (יומא י\"ב):", "rashi_en": "ובא אהרן אל אהל מועד AND AARON SHALL COME INTO THE APPOINTED TENT — Our Rabbis said (Sifra, Acharei Mot, Chapter 6 2; Yoma 32a), that this is not the proper place for this verse (it should be read after v. 25) and they gave a reason for this assertion in Treatise Yoma 32a. They said: The whole section is written in the order in which the rites actually took place with the exception of this \"coming\" into the appointed tent which was really done after he (the High-Priest) had offered his burnt offering and the burnt offering of the people (v. 24) and also after the burning of the fat-parts of the bullock and the goat, which rites were performed outside the Sanctuary (i. e. in the fore-court) he being then attired in the golden garments. This having been done he immersed himself, sanctified himself (i. e. washed his hands and feet), took them (the golden garments) off, and put on the linen garments and only then, ובא אהרן אל אהל מועד DID HE COME INTO THE APPOINTED TENT in order to bring out the spoon and the censer in which he had burnt the incense in the \"Innermost\" (the Holy of Holies).<br><br>ופשט את בגדי הבד AND HE SHALL PUT OFF THE LINEN GARMENTS — after he had brought it (the censer) out. Then he attired himself in his golden garments to offer the continual burnt offering due in the afternoon. Thus the order of the services on the Day of Atonement was as follows: The offering of the morning continual offering — in the golden garments; the service connected with the bullock and the ram the blood of both of which was sprinkled in the Interior, (v. 6—22) and the offering of the incense in the censer (in the Holy of Holies) — in the linen garments. The offering of his (the High-Priest's) ram and that of the people and one part of the additional offerings (the seven lambs mentioned in Numbers 29:8; cf. Yoma 70a) — in the golden garments. The bringing out of the spoon and the censer — in the linen garments. Finally the offering of the remaining additional offerings (the bullock and the ram mentioned in Numbers 29:8, 11) and of the continual burnt offering due in the afternoon and of the daily incense in the היכל. which was burnt on the golden altar — in the golden garments. The sequence of the Scriptural verses according to the rites as actually performed is as follows: \"and he shall send the goat forth into the desert\" (v. 22), then \"and he shall lave his flesh with water …. and come out and burn his burnt offering etc.\" (v. 24) and the whole section up to \"and afterwards he shall come into the camp\" (end of v. 28), and only after this (v. 23) \"and Aaron shall come etc.\" <br><br>והניחם שם AND HE SHALL PUT THEM THERE — This teaches us that they (the linen garments) must be laid by and that he must not officiate in those four garments again on any subsequent Day of Atonement (Sifra, Acharei Mot, Chapter 6 7; Yoma 12b)."}, {"ch": 16, "v": 24, "aliyah": 2, "heb": "וְרָחַ֨ץ אֶת־בְּשָׂר֤וֹ בַמַּ֙יִם֙ בְּמָק֣וֹם קָד֔וֹשׁ וְלָבַ֖שׁ אֶת־בְּגָדָ֑יו וְיָצָ֗א וְעָשָׂ֤ה אֶת־עֹֽלָתוֹ֙ וְאֶת־עֹלַ֣ת הָעָ֔ם וְכִפֶּ֥ר בַּעֲד֖וֹ וּבְעַ֥ד הָעָֽם׃", "onk": "וְיַסְחֵי יָת בִּסְרֵיהּ בְּמַיָּא בַּאֲתַר קַדִּישׁ וְיִלְבַּשׁ יָת לְבוּשׁוֹהִי וְיִפּוֹק וְיַעְבֵּד יָת עֲלָתֵיהּ וְיָת עֲלַת עַמָּא וִיכַפַּר עֲלוֹהִי וְעַל עַמָּא:", "onk_en": "He shall wash his flesh in water in a sacred place and don his garments. He shall go out and do (offer) his burnt-offering and the peoples burnt-offering and atone on his behalf and on behalf of the people.", "pj": "וְיַסְחֵי יַת בִּישְרֵיהּ בְּמוֹי בַּאֲתַר קַדִישׁ וְיִלְבַּשׁ יַת לְבוּשׁוֹי וִיצַדֵד וְיִפּוֹק וְיַעֲבֵיד יַת עֲלָתֵיהּ וְיַת עוֹלַת עַמֵיהּ וִיכַפֵּר עֲלוֹי וְעַל עַמֵיהּ", "pj_en": "Then shall he wash his flesh in the sanctuary, and afterward attire himself, and withdraw, and come forth, and perform his burnt offering and the burnt offering of the people, and make atonement for himself and for his people.", "tj": "", "tj_en": "", "rashi": "<b>ורחץ את בשרו וגו'.<\/b> לְמַעְלָה לָמַדְנוּ מִ\"וְרָחַץ אֶת בְּשָֹרוֹ וּלְבֵשָׁם\" שֶׁכְּשֶׁהוּא מְשַׁנֶּה מִבִּגְדֵי זָהָב לְבִגְדֵי לָבָן טָעוּן טְבִילָה, — שֶׁבְּאוֹתָהּ טְבִילָה פָשַׁט בִּגְדֵי זָהָב שֶׁעָבַד בָּהֶן עֲבוֹדַת תָּמִיד שֶׁל שַׁחַר וְלוֹבֵשׁ בִּגְדֵי לָבָן לַעֲבוֹדַת הַיּוֹם, — וְכָאן לָמַדְנוּ שֶׁכְּשֶׁהוּא מְשַׁנֶּה מִבִּגְדֵי לָבָן לְבִגְדֵי זָהָב טָעוּן טְבִילָה (שם ל\"ב):<br><br><b>במקום קדוש.<\/b> הַמְקֻדָּשׁ בִּקְדֻשַּׁת עֲזָרָה; וְהִיא הָיְתָה בְגַג בֵּית הַפַּרְוָה, וְכֵן אַרְבַּע טְבִילוֹת הַבָּאוֹת חוֹבָה לַיּוֹם, אֲבָל הָרִאשׁוֹנָה הָיְתָה בַחֹל (שם י\"ט):<br><br><b>ולבש את בגדיו.<\/b> שְׁמוֹנָה בְגָדִים שֶׁהוּא עוֹבֵד בָּהֶן כָּל יְמוֹת הַשָּׁנָה:<br><br><b>ויצא.<\/b> מִן הַהֵיכָל אֶל הֶחָצֵר שֶׁמִּזְבַּח הָעוֹלָה שָׁם:<br><br><b>ועשה את עלתו.<\/b> אַיִל לְעוֹלָה הָאָמוּר לְמַעְלָה:<br><br><b>ואת עלת העם.<\/b> וְאַיִל אֶחָד לְעוֹלָה הָאָמוּר לְמַעְלָה \"וּמֵאֵת עַדַת בְּנֵי יִשְֹרָאֵל\" וְגוֹ':", "rashi_en": "'ורחץ את בשרו וגו‎‎ AND HE SHALL LAVE HIS FLESH etc. — Above (v. 4) we have learned from the statement \"therefore shall he lave his flesh and so put them on\" that whenever he (the High-Priest) changed from the golden garments into the linen ones he had to immerse himself (for on the occasion of that immersion, mentioned v. 4, he took off his golden garments in which he performed the service connected with the continual burnt offering due in the morning and put on the linen garments for the performance of the service peculiar to that Day); here, however, we are told that whenever he changed from the linen garments into the golden ones he had also to immerse himself (Sifra, Acharei Mot, Chapter 6 3; Yoma 32).<br><br>במקום קדוש [AND HE SHALL LAVE HIS FLESH WITH WATER] IN A HOLY PLACE — i.e. in a place which has the sanctity of the fore-court. It (the immersion) took place (later on when the Temple was built) on the roof of the so-called Parva-compartment. Similarly also all the four immersions that formed a special obligation for the Day alone. The first immersion, however, (that which took place immediately before entering the עזרה to offer the תמיד של שחר) was taken in an unsanctified place (i.e. outside the fore-court) (Yoma 30a).<br><br>ולבש את בגדיו AND HE SHALL PUT ON HIS GARMENTS — i. e. the eight garments in which he officiated on every day of the year. <br><br>ויצא AND HE SHALL COME OUT from the היכל into the fore-court where was the altar of the burnt offering. ...<br><br>ועשה את עלתו AND HE SHALL MAKE HIS BURNT OFFERING — \"the ram for a burnt offering\" mentioned above (v. 3) (cf. Yoma 70b).<br><br>ואת עלת העם AND THE BURNT OFFERING OF THE PEOPLE — This is identical with \"a ram for a burnt offering\" mentioned above (v. 5) which begins with the words \"And he shall take from the congregation of the children of Israel … [a ram for a burnt offering]\"."}, {"ch": 16, "v": 25, "aliyah": 3, "heb": "וְאֵ֛ת חֵ֥לֶב הַֽחַטָּ֖את יַקְטִ֥יר הַמִּזְבֵּֽחָה׃", "onk": "וְיָת תַּרְבָּא דְחַטָּאתָא יַסֵּק לְמַדְבְּחָא:", "onk_en": "The fat of the sin-offering, he shall burn on the altar.", "pj": "וְיַת תַּרְבָּא דְחַטָאתָא יַסֵיק לְמַדְבְּחָא", "pj_en": "And the fat of the sin offering he shall burn at the altar.", "tj": "", "tj_en": "", "rashi": "<b>ואת חלב החטאת.<\/b> אֵמוּרֵי פַּר וְשָׂעִיר:<br><br><b>יקטיר המזבחה.<\/b> עַל מִזְבֵּחַ הַחִיצוֹן, דְּאִלּוּ בַּפְּנִימִי כְתִיב לֹא תַעֲלוּ עָלָיו קְטֹרֶת זָרָה וְעֹלָה וּמִנְחָה (שמות ל'):", "rashi_en": "ואת חלב החטאת AND THE FAT OF THE SIN OFFERING [SHALL HE CAUSE TO ASCEND IN FUMES] — i. e. the fat parts of both the bullock and the goat.<br><br>יקטיר המזבחה SHALL HE CAUSE TO ASCEND IN FUMES ON THE ALTAR — i. e. on the outer altar, for if you say that it was burnt on the inner altar you are wrong, for it is written (Exodus 30:9) \"Ye shall not bring up strange incense thereon, (i. e. on the inner altar) nor burnt offering, nor oblation\"."}, {"ch": 16, "v": 26, "aliyah": 3, "heb": "וְהַֽמְשַׁלֵּ֤חַ אֶת־הַשָּׂעִיר֙ לַֽעֲזָאזֵ֔ל יְכַבֵּ֣ס בְּגָדָ֔יו וְרָחַ֥ץ אֶת־בְּשָׂר֖וֹ בַּמָּ֑יִם וְאַחֲרֵי־כֵ֖ן יָב֥וֹא אֶל־הַֽמַּחֲנֶֽה׃", "onk": "<b>וּדְמוֹבִיל<\/b> יָת צְפִירָא לַעֲזָאזֵל יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי יָת בִּסְרֵיהּ בְּמַיָּא וּבָתַר כֵּן יֵיעוֹל לְמַשְׁרִיתָא:", "onk_en": "He who sends [<b>brings<\/b>] the goat to Azazel shall wash his garments, and bathe his body in water, and afterwards he shall come into the encampment.", "pj": "וּדְיִפְטוֹר צְפִירָא לַעֲזָאזֵל יְצַבַּע יַת לְבוּשׁוֹי וְיַסְחֵי יַת בִּישְרֵיהּ בְּאַרְבְּעִין סָאוִוין דְמוֹי וּמִן בָּתַר כְּדֵין יֵיעוֹל לְמַשְׁרִיתָא", "pj_en": "And he who led away the goat to Azazel shall wash his clothes, and bathe his flesh in forty seahs of water, and afterward he may enter the camp.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 27, "aliyah": 3, "heb": "וְאֵת֩ פַּ֨ר הַֽחַטָּ֜את וְאֵ֣ת&thinsp;<b>׀<\/b> שְׂעִ֣יר הַֽחַטָּ֗את אֲשֶׁ֨ר הוּבָ֤א אֶת־דָּמָם֙ לְכַפֵּ֣ר בַּקֹּ֔דֶשׁ יוֹצִ֖יא אֶל־מִח֣וּץ לַֽמַּחֲנֶ֑ה וְשָׂרְפ֣וּ בָאֵ֔שׁ אֶת־עֹרֹתָ֥ם וְאֶת־בְּשָׂרָ֖ם וְאֶת־פִּרְשָֽׁם׃", "onk": "וְיָת תּוֹרָא דְחַטָּאתָא וְיָת צְפִירָא דְחַטָּאתָא דִּי אִתָּעַל מִדִּמְהוֹן לְכַפָּרָא בְקוּדְשָׁא יִתַּפְּקוּן לְמִבָּרָא לְמַשְׁרִיתָא וְיוֹקְדוּן בְּנוּרָא יָת מַשְׁכֵּיהוֹן וְיָת בִּסְרְהוֹן וְיָת אָכְלֵיהוֹן:", "onk_en": "The sin-offering-bullock and the sin-offering-goat whose blood was brought to achieve atonement in the Holy [Sanctuary], he shall have removed beyond the encampment. They shall burn in fire their skins, their flesh and their waste [that are in their intestines].", "pj": "וְיַת תּוֹרָא דְחַטָאתָא וְיַת צְפִירָא דְחַטָאתָא דְאִיתְעַל מִן אַדְמֵיהוֹן לְכַפָּרָא בְּקוּדְשָׁא יִתַּפְקוּן בְּאַסְלוּן עַל יְדֵיהוֹן דִּיטְלָא דְכַהֲנַיָא וִיסוֹבָרוֹנוּן לְמִבָּרָא לְמַשְׁרִיתָא וְיוֹקְדוּן בְּנוּרָא יַת מַשְׁכֵיהוֹן וְיַת בִּשְרֵיהוֹן וְיַת רֵיעֵיהוֹן", "pj_en": "But the bullock for the sin offering, and the goat for the sin offering, whose blood was brought into the sanctuary to make atonement, shall be carried away upon carriages by the hands of young men who are priests; and they shall bear them without the camp, and burn them with fire, their skin, their flesh, and their dung.", "tj": "מַרְעֲיֵיהוֹן:", "tj_en": "", "rashi": "<b>אשר הובא את דמם.<\/b> לַהֵיכָל וְלִפְנַי וְלִפְנִים:", "rashi_en": "אשר הובא את דמם WHOSE BLOOD WAS BROUGHT into the Heichal and the Innermost (the Holy of Holies)."}, {"ch": 16, "v": 28, "aliyah": 3, "heb": "וְהַשֹּׂרֵ֣ף אֹתָ֔ם יְכַבֵּ֣ס בְּגָדָ֔יו וְרָחַ֥ץ אֶת־בְּשָׂר֖וֹ בַּמָּ֑יִם וְאַחֲרֵי־כֵ֖ן יָב֥וֹא אֶל־הַֽמַּחֲנֶֽה׃", "onk": "וּדְמוֹקִיד יָתְהוֹן יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי יָת בִּסְרֵיהּ בְּמַיָּא וּבָתַר כֵּן יֵיעוֹל לְמַשְׁרִיתָא:", "onk_en": "He who burns them shall wash his garments and bathe his body in water and afterwards he shall come into the encampment.", "pj": "וּדְמוֹקֵיד יַתְהוֹן יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי יַת בִּישְרֵיהּ בְּאַרְבְּעִין סָאוִוין דְמוֹי וּמִן בָּתַר כֵּן יֵיעוֹל לְמַשְׁרִיתָא", "pj_en": "And he who burneth them shall wash his clothes, and bathe his flesh in forty seahs of water, and afterwards he may enter the camp.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 29, "aliyah": 3, "heb": "וְהָיְתָ֥ה לָכֶ֖ם לְחֻקַּ֣ת עוֹלָ֑ם בַּחֹ֣דֶשׁ הַ֠שְּׁבִיעִ֠י בֶּֽעָשׂ֨וֹר לַחֹ֜דֶשׁ תְּעַנּ֣וּ אֶת־נַפְשֹֽׁתֵיכֶ֗ם וְכׇל־מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ הָֽאֶזְרָ֔ח וְהַגֵּ֖ר הַגָּ֥ר בְּתוֹכְכֶֽם׃", "onk": "וּתְהֵי לְכוֹן לִקְיַם עָלָם בְּיַרְחָא שְׁבִיעָאָה בְּעַשְׂרָא לְיַרְחָא תְּעַנּוּן יָת נַפְשָׁתֵיכוֹן וְכָל עִבִידָא לָא תַעְבְּדוּן <b>יַצִּיבָא<\/b> וְגִיּוֹרָא <b>דְּיִתְגַּיְּרוּן<\/b> בֵּינֵיכוֹן:", "onk_en": "It shall be for an everlasting statute for you; in the seventh month, on the tenth of the month, you shall afflict yourselves and not do any work, the native-born [<b>settled one<\/b>] and the proselyte residing [<b>that converts<\/b>] among you.", "pj": "וּתְהֵי דָא לְכוֹן לִקְיַים עֲלָם בְּיַרְחָא שְׁבִיעָאָה הוּא יֶרַח תִּשְׁרִי בְּעַשְרָא יוֹמִין לְיַרְחָא תְּעַנוּן יַת נַפְשָׁתֵיכוֹן מִן מֵיכְלָא וּמִן מִשְׁתַּיָא וּמִן הַוְיַית בָנֵי וְתַמְרוּקָא וּמְסָנָא וְתַשְׁמִישׁ עַרְסָא וְכָל עִיבִידְתָּא לָא תַעַבְדוּן יַצִיבָא וְגִיוֹרָא דְיִתְגַיֵיר בֵּינֵיכוֹן", "pj_en": "And this shall be to you for an everlasting statute: in the seventh month, it is the month Tishri, on the tenth day of the month, you shall humble your souls, (abstaining) from food, and from drinks, and from the use of the bath, and from rubbing, and from sandals, and from the practice of the bed: nor shall you do any work, neither the native-born nor the stranger who dwelleth among you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 30, "aliyah": 3, "heb": "כִּֽי־בַיּ֥וֹם הַזֶּ֛ה יְכַפֵּ֥ר עֲלֵיכֶ֖ם לְטַהֵ֣ר אֶתְכֶ֑ם מִכֹּל֙ חַטֹּ֣אתֵיכֶ֔ם לִפְנֵ֥י יְהֹוָ֖ה תִּטְהָֽרוּ׃", "onk": "אֲרֵי בְיוֹמָא הָדֵין יְכַפֵּר עֲלֵיכוֹן לְדַכָּאָה יָתְכוֹן מִכֹּל חוֹבֵיכוֹן קֳדָם יְיָ תִּדְכּוּן:", "onk_en": "For on this day He will make atonement for you, to purify you from all your sins, before Adonoy, you will be purified.", "pj": "אֲרוּם בְּיוֹמָא הָדֵין יְכַפֵּר עֲלֵיכוֹן לְדַכָּאָה יַתְכוֹן מִכָּל חוֹבֵיכוֹן וְאַתּוּן קֳדָם יְיָ תּוֹדוּן סוּרְחָנוּתְכוֹן וְתִידְכּוּן", "pj_en": "For on this day be shall make ATONEMENT for you to cleanse you from all your sins; and you shall confess your transgressions before the Lord, and shall be clean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 31, "aliyah": 3, "heb": "שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָכֶ֔ם וְעִנִּיתֶ֖ם אֶת־נַפְשֹׁתֵיכֶ֑ם חֻקַּ֖ת עוֹלָֽם׃", "onk": "שְׁבַת שְׁבָתָא הִיא לְכוֹן וּתְעַנּוּן יָת נַפְשָׁתֵיכוֹן קְיַם עֲלָם:", "onk_en": "It is a <i>Shabbos<\/i> of Shabbosos to you and you must afflict yourselves; it is an everlasting statute.", "pj": "שַׁבָּת שַׁבַּתָּא הוּא לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן וּתְעַנוּן יַת נַפְשָׁתֵיכוֹן קְיַים עֲלָם", "pj_en": "It is a Sabbath of rest to you: no work of business shall you do, but shall humiliate your souls. It is an everlasting statute.", "tj": "וּתְצוּמוּ בָהּ עַל נַפְשָׁתֵיכוֹן:", "tj_en": "But in it you shall fast for your souls.", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 32, "aliyah": 3, "heb": "וְכִפֶּ֨ר הַכֹּהֵ֜ן אֲשֶׁר־יִמְשַׁ֣ח אֹת֗וֹ וַאֲשֶׁ֤ר יְמַלֵּא֙ אֶת־יָד֔וֹ לְכַהֵ֖ן תַּ֣חַת אָבִ֑יו וְלָבַ֛שׁ אֶת־בִּגְדֵ֥י הַבָּ֖ד בִּגְדֵ֥י הַקֹּֽדֶשׁ׃", "onk": "וִיכַפַּר כַּהֲנָא <b>דִּי רַבִּי<\/b> יָתֵיהּ וְדִי <b>יְקָרֵב<\/b> יָת קֻרְבָּנֵיהּ לְשַׁמָּשָׁא תְּחוֹת אֲבוּהִי וְיִלְבַּשׁ יָת לְבוּשֵׁי בוּצָא לְבוּשֵׁי קוּדְשָׁא:", "onk_en": "The <i>kohein<\/i> will atone—he who himself will be anointed [<b>inaugurated to greatness<\/b>] and who will be initiated—[<b>offer his sacrifice<\/b>] to serve in his fathers stead and dress in the linen garments, the sacred garments.", "pj": "וִיכַפֵּר כַּהֲנָא דִי רַבֵּי יָתֵיהּ וְדִי קְרַב קוּרְבָּנֵיהּ לְשַׁמָשָׁא תְּחוֹת אָבוֹי וְיִלְבַּשׁ יַת לְבוּשֵׁי בוּץ מִילַת לְבוּשֵׁי קוּדְשָׁא", "pj_en": "And the priest who is anointed, and who hath offered his oblation to minister instead of his father, shall be clothed in the robes of fine linen, even the consecrated robes.", "tj": "", "tj_en": "", "rashi": "<b>וכפר הכהן אשר ימשח וגו'.<\/b> כַּפָּרָה זוֹ שֶׁל יוֹם הַכִּפּוּרִים אֵינָהּ כְּשֵׁרָה אֶלָּא בְּכֹהֵן גָּדוֹל (יומא ע\"ג); לְפִי שֶׁנֶּאֶמְרָה כָל הַפָּרָשָׁה בְּאַהֲרֹן, הֻצְרַךְ לוֹמַר בְּכֹהֵן גָּדוֹל הַבָּא אַחֲרָיו שֶׁיְּהֵא כָמוֹהוּ:<br><br><b>ואשר ימלא את ידו.<\/b> אֵין לִי אֶלָּא הַמָּשׁוּחַ בְּשֶׁמֶן הַמִּשְׁחָה, מְרֻבֵּה בְגָדִים מִנַּיִן? תַּ\"ל וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ וְגוֹמֵר; וְהֵם כָּל הַכֹּהֲנִים גְּדוֹלִים שֶׁעָמְדוּ מִיֹּאשִׁיָּהוּ וָאֵילָךְ, שֶׁבְּיָמָיו נִגְנְזָה צְלוֹחִית שֶׁל שֶׁמֶן הַמִּשְׁחָה (הוריות י\"ב):<br><br><b>לכהן תחת אביו.<\/b> לְלַמֵּד שֶׁאִם בְּנוֹ מְמַלֵּא אֶת מְקוֹמוֹ, הוּא קוֹדֵם לְכָל אָדָם (ספרא):", "rashi_en": "'וכפר הכהן אשר ימשח וגו‎ AND THE PRIEST WHOM THEY SHALL ANOINT … SHALL MAKE EXPIATION etc. — This expiation on the Day of Atonement is valid only if it is effected by the High-Priest. Because in the whole of this section reference is made to Aaron alone, Scripture was compelled to state here (towards the end) that any High-Priest succeeding him shall be like himself (i. e. shall possess the same power of effecting atonement on Yom-Kippur) (Sifra, Acharei Mot, Chapter 8 4). <br><br>ואשר ימלא את ידו AND WHOM THEY SHALL CONSECRATE — Since it is stated \"whom they anoint\" I might say I have here only the law that he who has been anointed with the oil of anointing is capable of effecting expiation; How do I know that this is also the case with a High- Priest who is distinguished from an ordinary priest only by a larger number of official garments though he may not have been anointed? Because Scripture states \"and whom they shall consecrate etc.\" (Sifra, Acharei Mot, Chapter 8 4) — Such (i. e. מרובה בגדים only) were all the High-Priests who held office from Josiah and later, for in his days the flask of anointing oil was concealed (Horayot 12a). <br><br>לכהן תחת אביו TO MINISTER AS A PRIEST IN HIS FATHER'S STEAD — The words \"in his father's stead” are intended to teach us that if the High-Priest’s son is able to fill his father’s place he has to be given preference to any other man (Sifra, Acharei Mot, Chapter 8 5)."}, {"ch": 16, "v": 33, "aliyah": 3, "heb": "וְכִפֶּר֙ אֶת־מִקְדַּ֣שׁ הַקֹּ֔דֶשׁ וְאֶת־אֹ֧הֶל מוֹעֵ֛ד וְאֶת־הַמִּזְבֵּ֖חַ יְכַפֵּ֑ר וְעַ֧ל הַכֹּהֲנִ֛ים וְעַל־כׇּל־עַ֥ם הַקָּהָ֖ל יְכַפֵּֽר׃", "onk": "וִיכַפַּר עַל מִקְדַּשׁ קוּדְשָׁא וְעַל מַשְׁכַּן זִמְנָא וְעַל מַדְבְּחָא יְכַפַּר וְעַל כַּהֲנַיָּא וְעַל כָּל עַמָּא דִקְהָלָא יְכַפַּר:", "onk_en": "He will atone for the Holy [Sanctuary]; and for the Tent of Meeting and for the altar, he will atone; for the <i>kohanim<\/i> and for the entire people of the congregation, he will atone.", "pj": "וִיכַפֵּר עַל מַקְדַשׁ קוּדְשָׁא וְעַל מַשְׁכַּן זִמְנָא וְעַל מַדְבְּחָא וְעַל כַּהֲנַיָא וְעַל כָּל עַמָא דִקְהָלָא יְכַפֵּר בְּאִישְׁתְּעוּת מִלַיָא", "pj_en": "And he shall make atonement for the Holy of Holies, and for the tabernacle of ordinance, and for the altar; and for the priests, and for all the people of the congregation, shall he atone, with confession of words.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 34, "aliyah": 3, "heb": "וְהָֽיְתָה־זֹּ֨את לָכֶ֜ם לְחֻקַּ֣ת עוֹלָ֗ם לְכַפֵּ֞ר עַל־בְּנֵ֤י יִשְׂרָאֵל֙ מִכׇּל־חַטֹּאתָ֔ם אַחַ֖ת בַּשָּׁנָ֑ה וַיַּ֕עַשׂ כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּתְהֵי דָא לְכוֹן לִקְיַם עָלָם לְכַפָּרָא עַל בְּנֵי יִשְׂרָאֵל מִכָּל חוֹבֵיהוֹן חֲדָא בְּשַׁתָּא וַעֲבַד כְּמָא דִי פַקֵּיד יְיָ יָת משֶׁה:", "onk_en": "This shall be for you as an everlasting statute, to achieve atonement for Bnei Yisroel from all their sins, once a year. He did as Adonoy commanded Moshe.", "pj": "וּתְהֵי דָא לְכוֹן לִקְיָים עֲלָם לְכַפָּרָא עַל בְּנֵי יִשְרָאֵל מִכָּל חוֹבֵיהוֹן חֲדָא זִמְנָא בְּשַׁתָּא וַעֲבַד אַהֲרן הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And this shall be to you for an everlasting statute, to expiate the children of Israel from all their sins, once in the year. And Aharon did as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויעש כאשר צוה וגו'.<\/b> כְּשֶׁהִגִּיעַ יוֹם הַכִּפּוּרִים עָשָֹה כַּסֵּדֶר הַזֶּה; וּלְהַגִּיד שִׁבְחוֹ שֶׁל אַהֲרֹן, שֶׁלֹּא הָיָה לוֹבְשָׁן לִגְדֻלָּתוֹ אֶלָּא כִּמְקַיֵּם גְּזֵרַת הַמֶּלֶךְ (שם):", "rashi_en": "'ויעש כאשר צוה וגו AND HE DID AS [THE LORD] COMMANDED [MOSES] etc. — When the next Day of Atonement arrived he (Aaron) did everything as is here set forth in order. And Scripture only states this in order to declare the praise of Aaron — that he did not attire himself with them (the official garments) for his own aggrandisement, but as one who was executing the ordinance of his King (Sifra, Acharei Mot, Chapter 8 10)."}, {"ch": 17, "v": 1, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 2, "aliyah": 4, "heb": "דַּבֵּ֨ר אֶֽל־אַהֲרֹ֜ן וְאֶל־בָּנָ֗יו וְאֶל֙ כׇּל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵיהֶ֑ם זֶ֣ה הַדָּבָ֔ר אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה לֵאמֹֽר׃", "onk": "מַלֵּל עִם אַהֲרֹן וְעִם בְּנוֹהִי וְעִם כָּל בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן דֵּין פִּתְגָּמָא דִּי פַקִּיד יְיָ לְמֵימָר:", "onk_en": "Speak to Aharon and to his sons and to all Bnei Yisroel and say to them; this is the edict that Adonoy commanded, saying:", "pj": "מַלֵיל עִם אַהֲרן וְעִם בְּנוֹי וְעִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן דֵין פִּתְגָמָא דְפַקֵיד יְיָ לְמֵימָר", "pj_en": "Speak with Aharon and with his sons, and with the sons of Israel, and tell them: This is the word which the Lord hath commanded, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 3, "aliyah": 4, "heb": "אִ֥ישׁ אִישׁ֙ מִבֵּ֣ית יִשְׂרָאֵ֔ל אֲשֶׁ֨ר יִשְׁחַ֜ט שׁ֥וֹר אוֹ־כֶ֛שֶׂב אוֹ־עֵ֖ז בַּֽמַּחֲנֶ֑ה א֚וֹ אֲשֶׁ֣ר יִשְׁחַ֔ט מִח֖וּץ לַֽמַּחֲנֶֽה׃", "onk": "גְּבַר גְּבַר מִבֵּית יִשְׂרָאֵל דִּי יִכּוֹס תּוֹר אוֹ אִמַּר אוֹ עִזָּא בְּמַשְׁרִיתָא אוֹ דִּי יִכּוֹס מִבָּרָא לְמַשְׁרִיתָא:", "onk_en": "Each and every person of the House of Israel who will slaughter an ox, lamb, or goat within the encampment or who will slaughter [it] beyond the encampment.", "pj": "גְבַר טְלֵי אוֹ סִיב מִבֵּית גְנִיסַת יִשְרָאֵל דִי יִכּוֹס נִכְסַת תּוֹר אוֹ אִימַר אוֹ עִיזָא בְּמַשְׁרִיתָא אוֹ דִי יִכּוֹס מִבָּרָא לְמַשְׁרִיתָא", "pj_en": "A man of the house of Israel, young or old, who shall kill as a sacrifice a bullock, or lamb, or goat in the camp, or who killeth it without the camp,", "tj": "", "tj_en": "", "rashi": "<b>אשר ישחט שור או כשב.<\/b> בַּמֻּקְדָּשִׁין הַכָּתוּב מְדַבֵּר, שֶׁנֶּאֱמַר \"לְהַקְרִיב קָרְבָּן\" (זבחים ק\"ז):<br><br><b>במחנה.<\/b> חוּץ לָעֲזָרָה:", "rashi_en": "ישחט שור או כשב‎ ‎‎‏ אשר [WHAT MAN SOEVER] THAT SLAUGHTERETH AN OX, OR A LAMB — Scripture is speaking here of consecrated animals since it says (v. 4) \"and bringeth it not unto the appointed tent to offer an offering\" (cf. Sifra, Acharei Mot, Section 6 3; Zevachim 106a).<br><br>במחנה [WHAT MAN SOEVER SLAUGHTERETH …] IN THE CAMP — i. e. outside the forecourt (cf. Sifra, Acharei Mot, Section 6 5; Zevachim 107b)."}, {"ch": 17, "v": 4, "aliyah": 4, "heb": "וְאֶל־פֶּ֜תַח אֹ֣הֶל מוֹעֵד֮ לֹ֣א הֱבִיאוֹ֒ לְהַקְרִ֤יב קׇרְבָּן֙ לַֽיהֹוָ֔ה לִפְנֵ֖י מִשְׁכַּ֣ן יְהֹוָ֑ה דָּ֣ם יֵחָשֵׁ֞ב לָאִ֤ישׁ הַהוּא֙ דָּ֣ם שָׁפָ֔ךְ וְנִכְרַ֛ת הָאִ֥ישׁ הַה֖וּא מִקֶּ֥רֶב עַמּֽוֹ׃", "onk": "וְלִתְרַע מַשְׁכַּן זִמְנָא לָא אַיְתֵיהּ לְקָרָבָא קֻרְבָּנָא קֳדָם יְיָ <b>קֳדָם<\/b> מַשְׁכְּנָא דַיְיָ דְּמָא יִתְחַשַּׁב לְגַבְרָא הַהוּא דְּמָא אֲשַׁד וְיִשְׁתֵּיצֵי אֲנָשָׁא הַהוּא מִגּוֹ עַמֵּיהּ:", "onk_en": "And to the entrance of the Tent of Meeting he did not bring it so that it may be brought as an offering to [<b>before<\/b>] Adonoy, before the Mishkan of Adonoy; it shall be considered for that person as blood, he has spilled blood, and that person shall be cut off from among his people.", "pj": "וְלִתְרַע מַשְׁכַּן זִמְנָא לָא אַיְיתֵיהּ לְקָרָבָא קָרְבָּנָא קֳדָם יְיָ קֳדָם מַשְׁכְּנָא דַיְיָ אֲדַם קְטוֹל יִתְחַשֵׁב לְגַבְרָא הַהוּא וּתְהֵי לֵיהּ כְּאִילוּ אֲדַם זַכְּאַי אָשַׁד וְיִשְׁתֵּצֵי בַּר נְשָׁא הַהוּא מֵעַמֵיהּ", "pj_en": "and bringeth it not to the door of the tabernacle of ordinance to offer it an oblation before the Lord, before the tabernacle of the Lord, the blood of slaughter shall be reckoned to that man, and it shall be to him as if he had shed innocent blood, and that man shall be destroyed from his people.", "tj": "", "tj_en": "", "rashi": "<b>דם יחשב.<\/b> כְּשׁוֹפֵךְ דַּם הָאָדָם שֶׁמִּתְחַיֵּב בְּנַפְשׁוֹ:<br><br><b>דם שפך.<\/b> לְרַבּוֹת אֶת הַזּוֹרֵק דָּמִים בַּחוּץ (שם):", "rashi_en": "דם יחשב BLOOD SHALL BE IMPUTED [UNTO THAN MAN] — As though he had shed the blood of a human being, who is guilty of a deadly sin. <br><br>דם שפך HE HATH SHED BLOOD — These apparently redundant words are intended to include in the penalty of כרת him who sprinkles outside the fore-court the blood of a sacrifice which has been slaughtered within it as is here commanded (Sanhedrin 34b; Zevachim 107a)."}, {"ch": 17, "v": 5, "aliyah": 4, "heb": "לְמַ֩עַן֩ אֲשֶׁ֨ר יָבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל אֶֽת־זִבְחֵיהֶם֮ אֲשֶׁ֣ר הֵ֣ם זֹבְחִים֮ עַל־פְּנֵ֣י הַשָּׂדֶה֒ וֶֽהֱבִיאֻ֣ם לַֽיהֹוָ֗ה אֶל־פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶל־הַכֹּהֵ֑ן וְזָ֨בְח֜וּ זִבְחֵ֧י שְׁלָמִ֛ים לַֽיהֹוָ֖ה אוֹתָֽם׃", "onk": "בְּדִיל דִּי יַיְתוּן בְּנֵי יִשְׂרָאֵל יָת דִּבְחֵיהוֹן דִּי אִנּוּן דָּבְחִין עַל אַפֵּי חַקְלָא וְיַיְתֻנּוּן <b>לָקֳדָם<\/b> יְיָ לִתְרַע מַשְׁכַּן זִמְנָא לְוָת כַּהֲנָא וְיִכְּסוּן נִכְסַת <b>קוּדְשִׁין קֳדָם<\/b> יְיָ יָתְהוֹן:", "onk_en": "So that Bnei Yisroel shall bring their sacrifices that they [would] slaughter on the field, and [instead] they shall bring them to [<b>before<\/b>] Adonoy to the entrance of the Tent of Meeting, to the <i>kohein<\/i>, and slaughter them as peace[<b>sacred<\/b>]-offerings to [<b>before<\/b>] Adonoy.", "pj": "מִן בִּגְלַל דְיַיְתוּן בְּנֵי יִשְרָאֵל נִכְסַתְהוֹן דְהִינוּן דַבְחִין עַל אַנְפֵּי חַקְלָא וְיַיְתוּנוּן קֳדָם יְיָ לִתְרַע מַשְׁכַּן זִמְנָא לְוַת כַּהֲנָא וְיִכְסוּן נִכְסַת קוּדְשִׁין קֳדָם יְיָ יַתְהוֹן", "pj_en": "In order that the sons of Israel may bring their sacrifices which they have heretofore killed on the face of the field, they may henceforth bring them before the Lord, at the door of the tabernacle of ordinance, unto the priest, and sacrifice their consecrated victims before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>אשר הם זבחים.<\/b> אֲשֶׁר הֵם רְגִילִים לִזְבֹּחַ:", "rashi_en": "אשר הם זבחים [THAT THE CHILDREN OF ISRAEL MAY BRING THEIR SACRIFICES] WHICH THEY SACRIFICE [IN THE OPEN FIELD ….. UNTO THE LORD] — \"which they sacrifice\" means, which they are at present accustomed to sacrifice."}, {"ch": 17, "v": 6, "aliyah": 4, "heb": "וְזָרַ֨ק הַכֹּהֵ֤ן אֶת־הַדָּם֙ עַל־מִזְבַּ֣ח יְהֹוָ֔ה פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְהִקְטִ֣יר הַחֵ֔לֶב לְרֵ֥יחַ נִיחֹ֖חַ לַיהֹוָֽה׃", "onk": "וְיִזְרוֹק כַּהֲנָא יָת דְּמָא עַל מַדְבְּחָא דַיְיָ בִּתְרַע מַשְׁכַּן זִמְנָא וְיַסֵּק תַּרְבָּא <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b> קֳדָם יְיָ:", "onk_en": "The <i>kohein<\/i> shall sprinkle the blood on the altar of Adonoy at the entrance of the Tent of Meeting and burn the fat as a pleasing fragrance to [<b>to be accepted with favor before<\/b>] Adonoy.", "pj": "וְיִזְרוֹק כַּהֲנָא יַת אַדְמָא עַל מַדְבְּחָא דַייָ בִּתְרַע מַשְׁכַּן זִמְנָא וְיֵסַק תַּרְבָּא לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "And the priest shall sprinkle the blood upon the altar of the Lord, at the door of the tabernacle of ordinance, and burn the fat, to be received with acceptance before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 7, "aliyah": 4, "heb": "וְלֹא־יִזְבְּח֥וּ עוֹד֙ אֶת־זִבְחֵיהֶ֔ם לַשְּׂעִירִ֕ם אֲשֶׁ֛ר הֵ֥ם זֹנִ֖ים אַחֲרֵיהֶ֑ם חֻקַּ֥ת עוֹלָ֛ם תִּֽהְיֶה־זֹּ֥את לָהֶ֖ם לְדֹרֹתָֽם׃", "onk": "וְלָא יִדְבְּחוּן עוֹד יָת דִּבְחֵיהוֹן לַשֵּׁדִין דִּי אִנּוּן טָעָן בַּתְרֵיהוֹן קְיַם עָלָם תְּהֵי דָא לְהוֹן לְדָרֵיהוֹן:", "onk_en": "They shall no longer sla
