<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פרשת שמיני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<header>
  <div class="title-row">

</header>

<script>
const SLUG = "shmini";
const DATA = [{"ch": 9, "v": 1, "aliyah": 1, "heb": "וַֽיְהִי֙ בַּיּ֣וֹם הַשְּׁמִינִ֔י קָרָ֣א מֹשֶׁ֔ה לְאַהֲרֹ֖ן וּלְבָנָ֑יו וּלְזִקְנֵ֖י יִשְׂרָאֵֽל׃", "onk": "וַהֲוָה בְּיוֹמָא תְמִינָאָה קְרָא משֶׁה לְאַהֲרֹן וְלִבְנוֹהִי וּלְסָבֵי יִשְׂרָאֵל:", "onk_en": "And it was on the eight day [that] Moshe called to Aharon and to his sons and to the elders of Israel.", "pj": "ויהי וַהֲוָה בְּיוֹמָא תְמִינָאָה לִרְבוּת אַהֲרן וּבְנוֹי וְיוֹם תְּמִינָאָה לְאַשְׁלָמוּתָא הוּא יוֹמָא קַדְמָאָה לְיַרְחָא דְנִיסָן אָקִים משֶׁה יַת מַשְׁכְּנָא וְלָא פַרְקֵיהּ וְלָא שַׁמֵשׁ תּוּב עַל גַבֵּי מַדְבְּחָא בְּכֵן קָרָא משֶׁה לְאַהֲרן וְלִבְנוֹי וּלְסָבֵי סַנְהֶדְרֵי יִשְרָאֵל", "pj_en": "On the eighth day of the anointing of Aharon and his sons, and the eighth day of that consecration, being the first day of the month of Nisan, when Mosheh had erected the tabernacle, he took it not down, neither ministered any longer at the altar; but Mosheh called Aharon and his sons, and the elders of the sanhedrin of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ויהי ביום השמיני.<\/b> לַמִּלּוּאִים; הוּא רֹאשׁ חֹדֶשׁ נִיסָן שֶׁהוּקַם הַמִּשְׁכָּן בּוֹ בַיּוֹם וְנָטַל עֶשֶׂר עֲטָרוֹת הַשְּׁנוּיוֹת בְּסֵדֶר עוֹלָם:<br><br><b>ולזקני ישראל.<\/b> לְהַשְׁמִיעָם שֶׁעַל פִּי הַדִּבּוּר אַהֲרֹן נִכְנָס וּמְשַׁמֵּשׁ בִּכְהֻנָּה גְדוֹלָה וְלֹא יֹאמְרוּ מֵאֵלָיו נִכְנָס (תנחומא):", "rashi_en": "ויהי ביום השמיני AND IT CAME TO PASS ON THE EIGHTH DAY of the installation of the priests into their sacred office (cf. Sifra); this was the New Moon of Nisan on which the Tabernacle was finally erected (cf. Rashi on Exodus 40:29) and it (that day) received ten crowns (it was distinguished in ten different ways) which are enumerated in Seder Olam 7 (Sifra, Shemini, Mechilta d'Miluim 2 1; Shabbat 87b).<br><br>ולזקני ישראל AND TO THE ELDERS OF ISRAEL, to inform them that it was by the express command of God that Aaron was entering the Sanctuary and ministering in the high-priesthood, so that they might not say: “He is entering on his own authority, unbidden.”"}, {"ch": 9, "v": 2, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֶֽל־אַהֲרֹ֗ן קַח־לְ֠ךָ֠ עֵ֣גֶל בֶּן־בָּקָ֧ר לְחַטָּ֛את וְאַ֥יִל לְעֹלָ֖ה תְּמִימִ֑ם וְהַקְרֵ֖ב לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וַאֲמַר לְאַהֲרֹן סַב לָךְ עֶגַל בַּר תּוֹרֵי לְחַטָּאתָא וּדְכַר לַעֲלָתָא שַׁלְמִין וְקָרֵב קֳדָם יְיָ:", "onk_en": "He said to Aharon, Take, for yourself, a young calf, for a sin-offering and a ram—for a burnt-offering—unblemished ones, and bring them before Adonoy.", "pj": "וַאֲמַר לְאַהֲרן סַב לָךְ עֵיגַל בַּר תּוֹרֵי לְחַטָאתָא מְטוֹל דְלָא יִשְׁתְּעֵי עֲלָךְ שִטְנָא לִישָׁן תְּלִיתָאֵי עַל עֵיסַק עֵיגְלָא דְעָבַדְתָּ בְּחוֹרֵב וּבְרַם דְכַר לַעֲלָתָא תִּיסַב מִן בִּגְלַל דִי יִדְכַּר לָךְ זְכוּתָא דְיִצְחָק דְכַפְתֵיהּ אָבוֹי כְּדִיכְרָא בְּטַוָור פּוּלְחָנָא תְּרֵיהוֹן יְהוֹן שַׁלְמִין וּקְרֵיב קֳדָם יְיָ", "pj_en": "And he said to Aharon, Take thou a calf, the young of a bullock, for a sin offering, that Satan may not accuse thee concerning the calf that thou madest at Horeb; and take a ram for the burnt sacrifice, that there may be a memorial for thee of the righteousness of Izhak whom his father bound as a ram on the mountain of worship, both of them shall be perfect, and bring them before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>קח לך עגל.<\/b> לְהוֹדִיעַ שֶׁכִּפֵּר לוֹ הַקָּבָּ\"ה עַל יְדֵי עֵגֶל זֶה עַל מַעֲשֵׂה הָעֵגֶל שֶׁעָשָֹה (שם):", "rashi_en": "קח לך עגל TAKE THEE A CALF — This animal was selected as a sin offering to announce to him that the Holy One, blessed be He, granted him atonement by means of this calf for the incident of the golden calf which he had made (Midrash Tanchuma, Shmini 4)"}, {"ch": 9, "v": 3, "aliyah": 1, "heb": "וְאֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵאמֹ֑ר קְח֤וּ שְׂעִיר־עִזִּים֙ לְחַטָּ֔את וְעֵ֨גֶל וָכֶ֧בֶשׂ בְּנֵי־שָׁנָ֛ה תְּמִימִ֖ם לְעֹלָֽה׃", "onk": "וְעִם בְּנֵי יִשְׂרָאֵל תְּמַלֵּל לְמֵימָר סִיבוּ צְפִיר בַּר עִזִּין לְחַטָּאתָא וְעֵגָל וְאִמָּר בְּנֵי שְׁנָא שַׁלְמִין לַעֲלָתָא:", "onk_en": "To Bnei Yisroel you shall speak, saying, take a he-goat, for a sin-offering and a calf and a lamb, both one year old—unblemished—for a burnt-offering,", "pj": "וְעִם בְּנֵי יִשְרָאֵל תְּמַלֵיל לְמֵימָר סָבוּ בְּרַם אַתּוּן צְפִיר בַּר עִיזֵי מְטוֹל דְסַטָנָא מִימְתִיל בֵּיהּ מְטוֹל דְלָא יִשְׁתְּעֵי עֲלֵיכוֹן לִישָׁן תְּלִיתָאֵי עַל עֵיסַק צְפִיר בַּר עִיזֵי דִנְכִיסוּ שִׁבְטוֹי דְיַעֲקב וּרְמִיוּ יָתֵיהּ וְעִיבַד יָתֵיהּ לְחַטָאתָא וְעֵיגְלָא מְטוֹל דְאִשְׁתַּעְבַּדְתּוּן לְעֵיגְלָא וְאִימַר בַּר שַׁתֵּיהּ מְטוֹל דְיִדְכַּר לְכוֹן זְכוּתָא דְיִצְחָק דְכַפְתֵיהּ אָבוֹי הֵי כְאִמְרָא תְּרֵיהוֹן שַׁלְמִין לְעָלָתָא", "pj_en": "And to the children of Israel spoke he, saying: Take for yourselves a kid of the goats, because Satana resembles him, lest he recount against you the accusation concerning the kid of the goats, which the sons (tribes) of Jakob killed, (Gen. xxxvii. 31,) and offer him for a sin offering; and a calf, because ye worshipped the calf, (Exod. xxxii. 4,) and a lamb of the year, that there may be for you a memorial of the righteousness of Izhak, whom his father did bind as a lamb, both of them perfect, for a burnt offering;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 4, "aliyah": 1, "heb": "וְשׁ֨וֹר וָאַ֜יִל לִשְׁלָמִ֗ים לִזְבֹּ֙חַ֙ לִפְנֵ֣י יְהֹוָ֔ה וּמִנְחָ֖ה בְּלוּלָ֣ה בַשָּׁ֑מֶן כִּ֣י הַיּ֔וֹם יְהֹוָ֖ה נִרְאָ֥ה אֲלֵיכֶֽם׃", "onk": "וְתוֹר וּדְכָר לְנִכְסַת <b>קוּדְשַׁיָּא<\/b> לְדַבָּחָא קֳדָם יְיָ וּמִנְחָתָא דְּפִילָא בִמְשָׁח אֲרֵי יוֹמָא דֵין <b>יְקָרָא<\/b> דַיְיָ <b>מִתְגְּלִי<\/b> לְכוֹן:", "onk_en": "an ox and a ram for a peace[<b>sacred<\/b>]-offering, to sacrifice before Adonoy and a meal-offering mixed with oil, for today, [<b>the Glory of<\/b>] Adonoy will appear [<b>become revealed<\/b>] to you.", "pj": "וְתוֹר וְאִימְרָא לְנִכְסַת קוּדְשָׁא לְדַבְּחָא קֳדָם יְיָ מִן בִּגְלַל דְיִתְרְעִי בְּכוֹן וּמִנְחָתָא פְּתִיכָא בִּמְשַׁח זֵיתָא אֲרוּם יוֹמָא דֵין אִיקַר שְׁכִינְתָּא דַיְיָ מִתְגְלֵי לְכוֹן", "pj_en": "with a bullock and a lamb, for a hallowed oblation to sacrifice before the Lord, that He may be gracious to you; and a mincha mingled with oil of the olive. For this day will the glory of the Lord's Shekinah be revealed unto you.", "tj": "", "tj_en": "", "rashi": "<b>כי היום ה' נראה אליכם.<\/b> לְהַשְׁרוֹת שְׁכִינָתוֹ בְמַעֲשֵׂה יְדֵיכֶם, לְכָךְ קָרְבָּנוֹת הַלָּלוּ בָּאִין חוֹבָה לְיוֹם זֶה:", "rashi_en": "כי היום ה' נראה אליכם FOR TODAY THE LORD WILL APPEAR UNTO YOU to make His Shechinah rest upon your handiwork; on this account these sacrifices come (are to be brought) as an obligation for this day (cf. Sifra, Shemini, Mechilta d'Miluim 2 4)."}, {"ch": 9, "v": 5, "aliyah": 1, "heb": "וַיִּקְח֗וּ אֵ֚ת אֲשֶׁ֣ר צִוָּ֣ה מֹשֶׁ֔ה אֶל־פְּנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וַֽיִּקְרְבוּ֙ כׇּל־הָ֣עֵדָ֔ה וַיַּֽעַמְד֖וּ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּנְסִיבוּ יָת דִּי פַקִּיד משֶׁה לָקֳדָם מַשְׁכַּן זִמְנָא וּקְרִיבוּ כָּל כְּנִשְׁתָּא וְקָמוּ קֳדָם יְיָ:", "onk_en": "They took that which Moshe commanded, before the Tent of Meeting; and the entire congregation approached and they stood before Adonoy.", "pj": "וְאִזְדַרְזוּן אַהֲרן וּבְנוֹי וְכָל בְּנֵי יִשְרָאֵל וּנְסִיבוּ יַת מַה דְפַּקֵיד משֶׁה וְהַיְיתִיוּ לִקֳדָם מַשְׁכַּן זִימְנָא וּקְרִיבוּ כָּל כְּנִישְׁתָּא וְקָמוּן בְּלֵב שְׁלִים קֳדָם יְיָ", "pj_en": "And Aharon and his sons, and all the sons of Israel, hastened and took what Mosheh commanded, and presented them in front of the tabernacle of ordinance; and the whole congregation drew near, and lifted up their heart fully before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 6, "aliyah": 1, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה זֶ֧ה הַדָּבָ֛ר אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה תַּעֲשׂ֑וּ וְיֵרָ֥א אֲלֵיכֶ֖ם כְּב֥וֹד יְהֹוָֽה׃", "onk": "וַאֲמַר משֶׁה דֵּין פִּתְגָּמָא דִּי פַקִּיד יְיָ תַּעְבְּדוּן <b>וְיִתְגְּלִי<\/b> לְכוֹן יְקָרָא דַיְיָ:", "onk_en": "Moshe said: This is what Adonoy commanded you to do: and the glory of Adonoy will appear [<b>become revealed<\/b>] to you.", "pj": "וַאֲמַר משֶׁה דֵין פִּתְגָמָא דְתַעַבְדוּן אַעַבְּרוּ יַת יִצְרָא בִּישָׁא מִן לִבְּכוֹן וּמִן יַד יִתְגְלֵי לְכוֹן אִיקַר שְׁכִינְתָּא דַיְיָ", "pj_en": "And Mosheh said, This is the thing which you must do. Put away the imagination of evil from your hearts, and there will speedily (at once) be revealed to you the glory of the Shekinah of the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 7, "aliyah": 1, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל־אַהֲרֹ֗ן קְרַ֤ב אֶל־הַמִּזְבֵּ֙חַ֙ וַעֲשֵׂ֞ה אֶת־חַטָּֽאתְךָ֙ וְאֶת־עֹ֣לָתֶ֔ךָ וְכַפֵּ֥ר בַּֽעַדְךָ֖ וּבְעַ֣ד הָעָ֑ם וַעֲשֵׂ֞ה אֶת־קׇרְבַּ֤ן הָעָם֙ וְכַפֵּ֣ר בַּֽעֲדָ֔ם כַּאֲשֶׁ֖ר צִוָּ֥ה יְהֹוָֽה׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן קְרַב לְמַדְבְּחָא וְעִבֵד יָת חַטָּאתָךְ וְיָת עֲלָתָךְ וְכַפַּר עֲלָךְ וְעַל עַמָּא וְעִבֵד יָת קֻרְבַּן עַמָּא וְכַפַּר עֲלֵיהוֹן כְּמָא דִי פַּקִּיד יְיָ:", "onk_en": "Moshe said to Aharon: Approach the altar and perform [the services of] your sin-offering and your burnt-offering and atone on your [own] behalf and on behalf of the people; and perform [the service of] the peoples offering and atone on their behalf, just as Adonoy commanded.", "pj": "וַהֲוָה כֵּיוָן דְחָמָא אַהֲרן מַדְבְּחָא בְּקַרְנוֹי מִדַמֵי לְעִיגְלָא אִיסְתְּפֵי לְמִיקְרַב לְגַבֵּיהּ בְּכֵן אָמַר לֵיהּ משֶׁה אָנִיס מִנְדְעָךְ וּקְרֵיב לְמַדְבְּחָא וְלָא תִסְתְּפֵי וְעִיבַד יַת חַטָאתָךְ וְיַת עֲלָתָךְ וְכַפֵּר אַמְטוּלָתָךְ וְאַמְטוּל עַמָא וְעִיבַד יַת קָרְבַּן עַמָא וְכַפֵּר עֲלֵיהוֹן הֵי כְּמָא דְפַקֵיד יְיָ", "pj_en": "But when Aharon saw at the corner of the altar the form of the calf, he was afraid to approach to its side. Mosheh, therefore, said to him, Take courage, and go near to the altar, fearing not, and offer thy sin offering, and make atonement for thyseIf and for the people, and perform the oblation of the people, and make atonement for them, as the Lord hath commanded.", "tj": "", "tj_en": "", "rashi": "<b>קרב אל המזבח.<\/b> שֶׁהָיָה אַהֲרֹן בּוֹשׁ וְיָרֵא לָגֶשֶׁת, אָמַר לוֹ מֹשֶׁה, לָמָּה אַתָּה בוֹשׁ? לְכָךְ נִבְחַרְתָּ (ספרא):<br><br><b>את חטאתך.<\/b> עֵגֶל בֶּן בָּקָר:<br><br><b>ואת עלתך.<\/b> הָאָיִל:<br><br><b>קרבן העם.<\/b> שְׂעִיר עִזִּים וְעֵגֶל וְכֶבֶשׂ; כָּל מָקוֹם שֶׁנֶּאֱמַר \"עֵגֶל\" בֶּן שָׁנָה הוּא וּמִכָּאן אַתָּה לָמֵד (שם):", "rashi_en": "קרב אל המזבח [AND MOSES SAID TO AARON] GO TO THE ALTAR, for Aaron was diffident and feared to go there. Moses therefore said to him “Wherefore art thou diffident? For this purpose hast thou been selected!” (cf. Sifra, Shemini, Mechilta d'Miluim 2 8).<br><br>את חטאתך THY SIN OFFERING — the young calf (v. 2).<br><br>ואת עלתך AND THY BURNT OFFERING — the ram (v. 2).<br><br>קרבן העם THE OFFERING OF THE PEOPLE — the kid of the goats and the calf and the lamb (v. 3). Wherever the term עגל, “calf” is mentioned without further definition it denotes one in its first year, and it is from this passage that you may derive this rule (cf. Sifra on 4:2; Rosh Hashanah 10a)."}, {"ch": 9, "v": 8, "aliyah": 1, "heb": "וַיִּקְרַ֥ב אַהֲרֹ֖ן אֶל־הַמִּזְבֵּ֑חַ וַיִּשְׁחַ֛ט אֶת־עֵ֥גֶל הַחַטָּ֖את אֲשֶׁר־לֽוֹ׃", "onk": "וּקְרֵב אַהֲרֹן לְמַדְבְּחָא וּנְכֵס יָת עֶגְלָא דְחַטָּאתָא דִּי לֵיהּ:", "onk_en": "Aharon approached the altar and slaughtered the calf that he had for a sin-offering.", "pj": "וּקְרֵיב אַהֲרן לְמַדְבְּחָא בִּזְרֵיזוּתָא וּנְכֵיס יַת עֶגְלָא דְחַטָאתָא דִידֵיהּ", "pj_en": "And Aharon approached to the altar with resolution, and slew the calf for his own sin offering.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 9, "aliyah": 1, "heb": "וַ֠יַּקְרִ֠בוּ בְּנֵ֨י אַהֲרֹ֣ן אֶת־הַדָּם֮ אֵלָיו֒ וַיִּטְבֹּ֤ל אֶצְבָּעוֹ֙ בַּדָּ֔ם וַיִּתֵּ֖ן עַל־קַרְנ֣וֹת הַמִּזְבֵּ֑חַ וְאֶת־הַדָּ֣ם יָצַ֔ק אֶל־יְס֖וֹד הַמִּזְבֵּֽחַ׃", "onk": "וְקָרִיבוּ בְּנֵי אַהֲרֹן יָת דְּמָא לֵיהּ וּטְבַל אֶצְבְּעֵיהּ בִּדְמָא וִיהַב עַל קַרְנַת מַדְבְּחָא וְיָת דְּמָא אֲרִיק לִיסוֹדָא דְמַדְבְּחָא:", "onk_en": "Aharons sons brought the blood to him and he dipped his finger into the blood and put it atop the corners of the altar and he poured the [remaining] blood into the base of the altar.", "pj": "וּקְרִיבוּ בְּנֵי אַהֲרן יַת אַדְמָא לְוָתֵיהּ וְטָבַל אַדְבְּעֵיהּ בַּאֲדָם תּוֹרָא וִיהַב עַל קַרְנַת מַדְבְּחָא וְיַת שְׁאַר אַדְמָא אָרִיק לִיסוֹדָא דְמַדְבְּחָא וְקַדְשֵׁיהּ לִמְכַפְּרָא עֲלוֹי", "pj_en": "And the sons of Aharon brought the blood to him, and he dipped his finger in the blood of the young bullock, and put it upon the horns of the altar, and the rest of the blood he poured out at the foundation of the altar, and sanctified it for the making of atonement upon it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 10, "aliyah": 1, "heb": "וְאֶת־הַחֵ֨לֶב וְאֶת־הַכְּלָיֹ֜ת וְאֶת־הַיֹּתֶ֤רֶת מִן־הַכָּבֵד֙ מִן־הַ֣חַטָּ֔את הִקְטִ֖יר הַמִּזְבֵּ֑חָה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וְיָת תַּרְבָּא וְיָת כָּלְיְתָא וְיָת חִצְרָא מִן כַּבְדָּא מִן חַטָּאתָא אַסֵּק לְמַדְבְּחָא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "The fat, kidneys and the lobe of the liver from the sin-offering, he burned on the altar, just as Adonoy commanded Moshe.", "pj": "וְיַת תְּרֵיב וְיַת כּוֹלְיַין וְיַת חַצְרָא מִן כַּבְדָא מִן חַטָאתָא אַסִיק לְמַדְבְּחָא הֵי כְּמָא דְפַקֵד יְיָ יַת משֶׁה", "pj_en": "And the fat, and the kidneys, with the caul of the liver of the sin offering, he burned at the altar, as the Lord had commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 11, "aliyah": 1, "heb": "וְאֶת־הַבָּשָׂ֖ר וְאֶת־הָע֑וֹר שָׂרַ֣ף בָּאֵ֔שׁ מִח֖וּץ לַֽמַּחֲנֶֽה׃", "onk": "וְיָת בִּשְׂרָא וְיָת מַשְׁכָּא אוֹקִיד בְּנוּרָא מִבָּרָא לְמַשְׁרִיתָא:", "onk_en": "The flesh and the skin, he burned in a fire beyond the encampment.", "pj": "וְיַת בִּישְרָא וְיַת מוֹשְׁכָא אוֹקִיד בְּנוּרָא מִבָּרָא לְמַשְׁרִיתָא", "pj_en": "But the flesh and the skin burned he with fire without the camp.", "tj": "", "tj_en": "", "rashi": "<b>ואת הבשר ואת העור וגו'.<\/b> לֹא מָצִינוּ חַטָּאת חִיצוֹנָה נִשְֹרֶפֶת אֶלָּא זוֹ וְשֶׁל מִלּוּאִים, וְכֻלָּן עַל פִּי הַדִּבּוּר:", "rashi_en": "'ואת הבשר ואת העור וגו‏‎‎ AND THE FLESH AND THE HIDE [HE BURNT .. OUTSIDE THE CAMP] — We do not find that any “external” sin-offering (one the blood of which was sprinkled on the outer altar) was burnt except this and that of the installation ceremony — and all these, only at the express command of God (cf. Rashi on Exodus 29:14)."}, {"ch": 9, "v": 12, "aliyah": 1, "heb": "וַיִּשְׁחַ֖ט אֶת־הָעֹלָ֑ה וַ֠יַּמְצִ֠אוּ בְּנֵ֨י אַהֲרֹ֤ן אֵלָיו֙ אֶת־הַדָּ֔ם וַיִּזְרְקֵ֥הוּ עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וּנְכֵס יָת עֲלָתָא וְאַמְטִיאוּ בְּנֵי אַהֲרֹן לֵיהּ יָת דְּמָא וּזְרָקֵיהּ עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He slaughtered the burnt-offering; and Aharons sons presented the blood to him, and he sprinkled it all around the altar.", "pj": "וּנְכֵס יַת עֲלָתָא וְאַקְרִיבוּ בְּנֵי אַהֲרן לֵיהּ יַת אַדְמָא וּדְרָקֵיהּ עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And he killed the burnt offering, and the sons of Aharon brought the blood to him, and he sprinkled it upon the altar round about.", "tj": "", "tj_en": "", "rashi": "<b>וימצאו.<\/b> לְשׁוֹן הוֹשָׁטָה וְהַזְמָנָה:", "rashi_en": "וימציאו — This signifies handing over and presenting."}, {"ch": 9, "v": 13, "aliyah": 1, "heb": "וְאֶת־הָעֹלָ֗ה הִמְצִ֧יאוּ אֵלָ֛יו לִנְתָחֶ֖יהָ וְאֶת־הָרֹ֑אשׁ וַיַּקְטֵ֖ר עַל־הַמִּזְבֵּֽחַ׃", "onk": "וְיָת עֲלָתָא אַמְטִיאוּ לֵיהּ לְאֵבָרָהָא וְיָת רֵישָׁא וְאַסֵּק עַל מַדְבְּחָא:", "onk_en": "They presented the burnt-offering to him with its limbs severed and [with] the head, and he burned them on the altar.", "pj": "וְיַת עֲלָתָא אַקְרִיבוּ יָתָהּ לְפִסְגָהָא וְיַת רֵישָׁא וְאַסֵיק עַל מַדְבְּחָא", "pj_en": "And they brought the burnt offering to him by its divisions, and the head, and he burned (them) upon the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 14, "aliyah": 1, "heb": "וַיִּרְחַ֥ץ אֶת־הַקֶּ֖רֶב וְאֶת־הַכְּרָעָ֑יִם וַיַּקְטֵ֥ר עַל־הָעֹלָ֖ה הַמִּזְבֵּֽחָה׃", "onk": "וְחַלִּיל יָת גַּוָּא וְיָת כְּרָעַיָּא וְאַסֵּק עַל עֲלָתָא לְמַדְבְּחָא:", "onk_en": "He washed the innards and the feet and burned them on the burnt-offering, on the altar.", "pj": "וְחַלִיל יַת בְּנֵי גַוָוא וְיַת רִיגְלַיָא וְאַסֵיק עַל עֲלָתָא לְמַדְבְּחָא", "pj_en": "And he washed the inwards and the fat, and burned the burnt offering, at the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 15, "aliyah": 1, "heb": "וַיַּקְרֵ֕ב אֵ֖ת קׇרְבַּ֣ן הָעָ֑ם וַיִּקַּ֞ח אֶת־שְׂעִ֤יר הַֽחַטָּאת֙ אֲשֶׁ֣ר לָעָ֔ם וַיִּשְׁחָטֵ֥הוּ וַֽיְחַטְּאֵ֖הוּ כָּרִאשֽׁוֹן׃", "onk": "וְקָרֵב יָת קֻרְבַּן עַמָּא וּנְסִיב יָת צְפִירָא דְחַטָּאתָא דִּי לְעַמָּא וְנָכְסֵיהּ <b>וְכַפֵּר בִּדְמֵיהּ<\/b> כְּקַדְמָאָה:", "onk_en": "He brought the peoples offering; he took the peoples sin-offering-goat, and he slaughtered it and offered it as a sin-offering [<b>atoned with its blood<\/b>], in the same manner as the first one.", "pj": "וּקְרֵיב יַת קָרְבַּן עַמָא וּנְסֵיב יַת צְפִירָא דְחַטָאתָא דִי לְעַמָא וְנַכְסֵיהּ וְכַפֵּר בְּאַדְמֵיהּ דִצְפִירָא הֵי כְמָא דִכְפַּר בַּאֲדַם עֵיגְלָא דְחַטָאתָא דִילֵיהּ דְקָרֵב בְּשֵׁירוּיָא", "pj_en": "And they brought the oblation of the people. And he took the goat for the people's sin offering and killed it, and made atonement with the blood of the goat, as he had made atonement with the blood of the calf of the sin offering for himself, which he had offered before.", "tj": "", "tj_en": "", "rashi": "<b>ויחטאהו.<\/b> עָשָׂהוּ כְּמִשְׁפַּט חַטָּאת:<br><br><b>כראשון.<\/b> כָּעֵגֶל שֶׁלּוֹ:", "rashi_en": "ויחטאהו means: he treated it according to the regulation regarding the חטאת, “sin-offering”.<br><br>כראשון AS THE FIRST — as his own calf (as is described in v. 8)."}, {"ch": 9, "v": 16, "aliyah": 1, "heb": "וַיַּקְרֵ֖ב אֶת־הָעֹלָ֑ה וַֽיַּעֲשֶׂ֖הָ כַּמִּשְׁפָּֽט׃", "onk": "וְקָרֵב יָת עֲלָתָא וְעָבְדַהּ כִּדְחָזֵי:", "onk_en": "He brought the burnt-offering and he did it according to the rule.", "pj": "וּקְרֵיב יַת עֲלָתָא וְעָבְדָהּ כְּהִלְכַת עֲלָתָא דְקָרֵיב אַמְטוּלְתֵיהּ", "pj_en": "And they brought the burnt offering, and he performed it after the rite of the burnt offering which he had offered for himself.", "tj": "", "tj_en": "", "rashi": "<b>ויעשה כמשפט.<\/b> הַמְפֹרָשׁ בְּעוֹלַת נְדָבָה בְּוַיִּקְרָא:", "rashi_en": "ויעשה כמשפט AND HE DID IT ACCORDING TO THE MANNER that is set forth in the section ויקרא (ch. 1) in respect to the burnt offering brought as a free-will gift (Beitzah 20a)."}, {"ch": 9, "v": 17, "aliyah": 2, "heb": "וַיַּקְרֵב֮ אֶת־הַמִּנְחָה֒ וַיְמַלֵּ֤א כַפּוֹ֙ מִמֶּ֔נָּה וַיַּקְטֵ֖ר עַל־הַמִּזְבֵּ֑חַ מִלְּבַ֖ד עֹלַ֥ת הַבֹּֽקֶר׃", "onk": "וְקָרֵב יָת מִנְחָתָא וּמְלָא יְדֵיהּ מִנַּהּ וְאַסֵּק עַל מַדְבְּחָא בַּר מֵעֲלַת צַפְרָא:", "onk_en": "He brought the meal-offering; he filled his palm from it and burned it on the altar: aside from the burnt-offering [that was brought] in the morning.", "pj": "וּקְרֵיב יַת מִנְחָתָא וּמְלֵא יְדֵיהּ מִינָהּ וּנְסֵיב מִינָהּ צְרִיד אַרְכַּבְתָּהּ וְאַסֵיק עַל מַדְבְּחָא בַּר מִן עוֹלַת צַפְרָא", "pj_en": "And they brought the mincha, and he filled his hands therefrom, and took of it a portion for its memorial, and burned upon the altar, beside the morning sacrifice", "tj": "", "tj_en": "", "rashi": "<b>וימלא כפו.<\/b> הִיא קְמִיצָה (שם):<br><br><b>מלבד עלת הבקר.<\/b> כָּל אֵלֶּה עָשָֹה אַחַר עוֹלַת הַתָּמִיד:", "rashi_en": "וימלא כפו AND HE FILLED HIS HAND [THEREWITH] — this is what is elsewhere termed קמיצה (i. e. this is elsewhere expressed by the phrase … וקמץ מלא קמצו “he shall take a fistful”) (Sifra, Shemini, Mechilta d'Miluim 2 10; cf. Menachot 9b).<br><br>מלבד עלת הבקר BESIDE THE BURNT OFFERING OF THE MORNING — all these rites he carried out after the continual burnt offering."}, {"ch": 9, "v": 18, "aliyah": 2, "heb": "וַיִּשְׁחַ֤ט אֶת־הַשּׁוֹר֙ וְאֶת־הָאַ֔יִל זֶ֥בַח הַשְּׁלָמִ֖ים אֲשֶׁ֣ר לָעָ֑ם וַ֠יַּמְצִ֠אוּ בְּנֵ֨י אַהֲרֹ֤ן אֶת־הַדָּם֙ אֵלָ֔יו וַיִּזְרְקֵ֥הוּ עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וּנְכֵס יָת תּוֹרָא וְיָת דִּכְרָא נִכְסַת <b>קוּדְשַׁיָּא<\/b> דִּי לְעַמָּא וְאַמְטִיאוּ בְּנֵי אַהֲרֹן יָת דְּמָא לֵיהּ וּזְרָקֵיהּ עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He slaughtered the ox and the ram, the peace[<b>sacred<\/b>]-offerings of the people; and Aharons sons presented the blood to him and he sprinkled it all around the altar.", "pj": "וּנְכֵיס יַת תּוֹרָא וְיַת דִיכְרָא נִיכְסַת קוּדְשַׁיָא דִי לְעַמָא וְאַקְרִיבוּ בְּנֵי אַהֲרן יַת אַדְמֵיהּ לֵיהּ וְדָרִיק עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And he killed the bullock and the ram of the hallowed oblations (peace offering) of the people, and the sons of Aharon brought the blood to him, and he sprinkled it upon the altar round about:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 19, "aliyah": 2, "heb": "וְאֶת־הַחֲלָבִ֖ים מִן־הַשּׁ֑וֹר וּמִ֨ן־הָאַ֔יִל הָֽאַלְיָ֤ה וְהַֽמְכַסֶּה֙ וְהַכְּלָיֹ֔ת וְיֹתֶ֖רֶת הַכָּבֵֽד׃", "onk": "וְיָת תַּרְבַּיָּא מִן תּוֹרָא וּמִן דִּכְרָא אֲלִיתָא וְחָפֵי גַוָּא וְכָלְיְתָא וַחֲצַר כַּבְדָּא:", "onk_en": "The fats of the ox and of the ram; the fat-tail, the [fat] covering [the innards], the kidneys and the lobe of the liver.", "pj": "וְיַת תַּרְבַּיָא מִן תּוֹרָא וּמִן דִיכְרָא אָלִיתָא וּדְחָפֵי בְּנֵי גַוָוא וְכוּלְיָיתָא וַחֲצַר כַּבְדָא", "pj_en": "and the fat of the bullock, and of the ram, the tail, and that which covereth the inwards, and the two kidneys, and the caul of the liver;", "tj": "", "tj_en": "", "rashi": "<b>והמכסה.<\/b> חֵלֶב הַמְכַסֶּה אֶת הַקֶּרֶב:", "rashi_en": "והמכסה AND THAT WHICH COVERETH — This is elsewhere (e.g., Leviticus 3:3) termed “the fat which covereth the inward parts”."}, {"ch": 9, "v": 20, "aliyah": 2, "heb": "וַיָּשִׂ֥ימוּ אֶת־הַחֲלָבִ֖ים עַל־הֶחָז֑וֹת וַיַּקְטֵ֥ר הַחֲלָבִ֖ים הַמִּזְבֵּֽחָה׃", "onk": "וְשַׁוִּיאוּ יָת תַּרְבַּיָּא עַל חֶדְוָתָא וְאַסֵּק תַּרְבַּיָּא לְמַדְבְּחָא:", "onk_en": "They put the fats on top of the breasts and he burned the fats on the altar.", "pj": "וְשַׁוִיוּ יַת תַּרְבַּיָא עַל חֶדְוָותָא וְאַסֵיק תַּרְבַּיָא לְמַדְבְּחָא", "pj_en": "and he laid the fat upon the breast, and burned the fat upon the altar.", "tj": "", "tj_en": "", "rashi": "<b>וישימו את החלבים על החזות.<\/b> לְאַחַר הַתְּנוּפָה נְתָנָן כֹּהֵן הַמֵּנִיף לְכֹהֵן אַחֵר לְהַקְטִירָם, נִמְצְאוּ הָעֶלְיוֹנִים לְמַטָּה (מנחות ס\"ב):", "rashi_en": "וישימו את החלבים על החזות AND THEY PUT THE FAT UPON THE BREAST — After the waving the priest who waved them gave them to another priest to burn them; consequently what was previously above was now beneath (cf. Rashi on Leviticus 7:30; Menachot 62a)."}, {"ch": 9, "v": 21, "aliyah": 2, "heb": "וְאֵ֣ת הֶחָז֗וֹת וְאֵת֙ שׁ֣וֹק הַיָּמִ֔ין הֵנִ֧יף אַהֲרֹ֛ן תְּנוּפָ֖ה לִפְנֵ֣י יְהֹוָ֑ה כַּאֲשֶׁ֖ר צִוָּ֥ה מֹשֶֽׁה׃", "onk": "וְיָת חֶדְוָתָא וְיָת שׁוֹקָא דְיַמִּינָא <b>אֲרֵם<\/b> אַהֲרֹן <b>אֲרָמָא<\/b> קֳדָם יְיָ כְּמָא דִי פַּקִּיד משֶׁה:", "onk_en": "The breasts and the right thigh, Aharon waved [<b>lifted up<\/b>] [as] a wave-offering [<b>an uplifted-offering<\/b>] before Adonoy, just as Moshe commanded.", "pj": "וְיַת חֶדְוָותָא וְיַת שׁוֹקָא דְיַמִינָא אָרֵים אַהֲרן אֲרָמָא קֳדָם יְיָ הֵיכְמָא דְפַקֵיד משֶׁה", "pj_en": "But the breast and the right shoulder Aharon uplifted, an elevation before the Lord, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 22, "aliyah": 2, "heb": "וַיִּשָּׂ֨א אַהֲרֹ֧ן אֶת־<span class=\"mam-kq-trivial\">יָדָ֛ו<\/span> אֶל־הָעָ֖ם וַֽיְבָרְכֵ֑ם וַיֵּ֗רֶד מֵעֲשֹׂ֧ת הַֽחַטָּ֛את וְהָעֹלָ֖ה וְהַשְּׁלָמִֽים׃", "onk": "וַאֲרֵם אַהֲרֹן יָת יְדוֹהִי עַל עַמָּא וּבָרֵכִנּוּן וּנְחַת מִלְּמֶעְבַּד חַטָּאתָא וַעֲלָתָא וְנִכְסַת <b>קוּדְשַׁיָּא<\/b>:", "onk_en": "Aharon raised his hands toward the people and he blessed them. He descended [from the altar where he] had offered the sin-offering, the burnt-offering and the peace[<b>sacred<\/b>]-offering.", "pj": "וּפְרַס אַהֲרן יַת יְדוֹי לָקֳבֵיל עַמָא וּבָרֵיכִינוּן וּנְחַת מִן מַדְבְּחָא בְּחֶדְוָוא מִן דְפָסַק לְמֶעֱבַּד חַטָאתָא וְעָלָתָא וְנִכְסַת קוּדְשַׁיָא", "pj_en": "And Aharon stretched out his hands towards the people and blessed them, and came down from the altar with joy, after he had finished to perform the sin offering and the burnt offering and the hallowed oblation.", "tj": "", "tj_en": "", "rashi": "<b>ויברכם.<\/b> בִּרְכַּת כֹּהֲנִים — יְבָרֶכְךָ, יָאֵר, יִשָּׂא (סוטה ל\"ח):<br><br><b>וירד.<\/b> מֵעַל הַמִּזְבֵּחַ:", "rashi_en": "ויברכם AND HE BLESSED THEM with the priestly benediction (Numbers 6:24—26): “May the Lord bless thee … May the Lord cause his face to shine … May the Lord lift up …” (cf. Sifra, Shemini, Mechilta d'Miluim 2 17; Sotah 38a) <br><br>‎‏וירד AND HE CAME DOWN from off the altar."}, {"ch": 9, "v": 23, "aliyah": 2, "heb": "וַיָּבֹ֨א מֹשֶׁ֤ה וְאַהֲרֹן֙ אֶל־אֹ֣הֶל מוֹעֵ֔ד וַיֵּ֣צְא֔וּ וַֽיְבָרְכ֖וּ אֶת־הָעָ֑ם וַיֵּרָ֥א כְבוֹד־יְהֹוָ֖ה אֶל־כׇּל־הָעָֽם׃", "onk": "וְעַל משֶׁה וְאַהֲרֹן לְמַשְׁכַּן זִמְנָא וּנְפָקוּ וּבָרִיכוּ יָת עַמָּא <b>וְאִתְגְּלִי<\/b> יְקָרָא דַיְיָ לְכָל עַמָּא:", "onk_en": "And Moshe and Aharon went [in]to the Tent of Meeting and [then] they went outside and blessed the people, and the glory of Adonoy appeared [<b>became revealed<\/b>] to the entire people.", "pj": "וְכֵיוָן דְאִתְעֲבִידוּ קוּרְבָּנַיָא וְלָא אִתְגְלֵית שְׁכִינְתָּא הֲוָה אַהֲרן מַבְהִית וַאֲמַר לְמשֶׁה דִילְמָא לָא אִתְרְעֵי מֵימְרָא דַיְיָ בְּעוֹבְדֵי יְדָי בְּכֵן עָלוּ משֶׁה וְאַהֲרן לְמַשְׁכַּן זִימְנָא וּצְלוּ עַל עַמָא בֵּית יִשְרָאֵל וּנְפָקוּ וּבְרִיכוּ יַת עַמָא וַאֲמַר יְקַבֵּיל מֵימְרָא דַיְיָ בְּרַעֲוָא יַת קוּרְבַּנְכוֹן וְיִשְׁרֵי וְיִשְׁבּוֹק עַל חוֹבֵיכוֹן וּמִן יַד אִיתְגְלֵי אִיקַר שְׁכִינְתָּא דַיְיָ לְכָל עַמָא", "pj_en": "But when, after the oblations had been performed, the Shekinah did not reveal itself, Aharon was ashamed, and said to Mosheh, It may be that the Word of the Lord hath no pleasure in the work of my hands. Then went Mosheh and Aharon into the tabernacle of ordinance, and prayed for the people of the house of Israel, and came forth and blessed the people, and said, May the Word of the Lord receive your oblations with favour, and remit and forgive your sins. Then, instant, instantly the Glory of the Lord's Shekinah revealed itself to all the people:", "tj": "", "tj_en": "", "rashi": "<b>ויבא משה ואהרן וגו'.<\/b> לָמָּה נִכְנְסוּ? מָצָאתִי בְּפָרָשַׁת מִלּוּאִים, בְּבָרַיְתָא הַנּוֹסֶפֶת עַל תּוֹרַת כֹּהֲנִים שֶׁלָּנוּ, לָמָּה נִכְנַס מֹשֶׁה עִם אַהֲרֹן? לְלַמְּדוֹ עַל מַעֲשֵׂה הַקְּטֹרֶת, אוֹ לֹא נִכְנַס אֶלָּא לְדָבָר אַחֵר? הֲרֵינִי דָן, יְרִידָה וּבִיאָה טְעוּנָה בְרָכָה, מַה יְּרִידָה מֵעֵין עֲבוֹדָה אַף בִּיאָה מֵעֵין עֲבוֹדָה, הָא לָמַדְתָּ לָמָּה נִכְנַס מֹשֶׁה עִם אַהֲרֹן לְלַמְּדוֹ עַל מַעֲשֵׂה הַקְּטֹרֶת; דָּ\"אַ כֵּיוָן שֶׁרָאָה אַהֲרֹן שֶׁקָּרְבוּ כָּל הַקָּרְבָּנוֹת וְנַעֲשׂוּ כָל הַמַּעֲשִׂים וְלֹא יָרְדָה שְׁכִינָה לְיִשְׂרָאֵל, הָיָה מִצְטַעֵר וְאוֹמֵר, יוֹדֵעַ אֲנִי שֶׁכָּעַס הַקָּבָּ\"ה עָלַי וּבִשְׁבִילִי לֹא יָרְדָה שְׁכִינָה לְיִשְׂרָאֵל, אָמַר לוֹ לְמֹשֶׁה, מֹשֶׁה אָחִי, כָּךְ עָשִֹיתָ לִי שֶׁנִּכְנַסְתִּי וְנִתְבַּיַּשְׁתִּי? מִיַּד נִכְנַס מֹשֶׁה עִמּוֹ וּבִקְּשׁוּ רַחֲמִים וְיָרְדָה שְׁכִינָה לְיִשְׂרָאֵל (ספרא):<br><br><b>ויצאו ויברכו את העם.<\/b> אָמְרוּ וִיהִי נֹעַם ה' אֱלֹהֵינוּ עָלֵינוּ, יְהִי רָצוֹן שֶׁתִּשְׁרֶה שְׁכִינָה בְמַעֲשֵׂה יְדֵיכֶם; לְפִי שֶׁכָּל שִׁבְעַת יְמֵי הַמִּלּוּאִים שֶׁהֶעֱמִידוֹ מֹשֶׁה לַמִּשְׁכָּן וְשִׁמֵּשׁ בּוֹ וּפֵרְקוֹ בְכָל יוֹם לֹא שָׁרְתָה בוֹ שְׁכִינָה, וְהָיוּ יִשְׂרָאֵל נִכְלָמִים וְאוֹמְרִים לְמֹשֶׁה, מֹשֶׁה רַבֵּנוּ, כָּל הַטֹּרַח שֶׁטָּרַחְנוּ שֶׁתִּשְׁרֶה שְׁכִינָה בֵינֵינוּ וְנֵדַע שֶׁנִּתְכַּפֵּר לָנוּ עֲוֹן הָעֵגֶל, לְכָךְ אָמַר לָהֶם זֶה הַדָּבָר אֲשֶׁר צִוָּה ה' תַּעֲשׂוּ וְיֵרָא אֲלֵיכֶם כְּבוֹד ה' — אַהֲרֹן אָחִי כְּדַאי וְחָשׁוּב מִמֶּנִּי, שֶׁעַל יְדֵי קָרְבְּנוֹתָיו וַעֲבוֹדָתוֹ תִשְׁרֶה שְׁכִינָה בָכֶם וְתֵדְעוּ שֶׁהַמָּקוֹם בָּחַר בּוֹ:", "rashi_en": "ויבא משה ואהרן AND MOSES AND AARON CAME, etc. — Wherefore did they now enter the Tabernacle? I have found the following in the “Mechilta d’Miluim,” in the Boraitha that is appended to our Torath Cohanim (Sifra): Wherefore did Moses enter with Aaron? To instruct him regarding the incense ceremony. Or it may be that he entered for some other reason?! See, I draw a conclusion: the descent from the altar and the entry into the tent of meeting both required to be accompanied by a benediction, as stated in vv. 22 and 23 (and consequently both were, in a measure, of similar character). Now what was the descent from the altar? It was of the nature (it look place in connection with) a sacrificial act! So, also, the entry into the tent took place in connection with a sacrificial act! Thus you may learn: Why did Moses enter with Aaron? To instruct him regarding the incense ceremony which was the only rite performed on that day within the tent! (Cf. Talmud Yerushalmi Taanit 4). Another explanation is: When Aaron perceived that all the sacrifices had been offered and all the rites performed, and yet the Shechinah had not descended for Israel, since the heavenly fire had not fallen to consume the sacrifice, he was uneasy in mind and said: I feel certain that the Holy One, blessed be He, is angry with me and that it is on my account that the Shechinah has not descended for Israel. He therefore said to Moses: “My brother Moses! Do you act thus with me: you know that I have entered into this matter at your bidding and yet I have been put to shame! Moses at once entered the tent with him and they offered prayer and the Shechinah descended for Israel (Sifra, Shemini, Mechilta d'Miluim 2 18).<br><br>ויצאו ויברכו את העם AND THEY CAME OUT AND BLESSED THE PEOPLE — They said the words that conclude “The Prayer of Moses” (Psalms 90:17): “May the beauty of the Lord our God be upon us” — i. e. May it be God’s will that the Shechinah may rest upon the work of your hands (see Rashi on Exodus 39:43). They invoked just this blessing and not another formula because during the whole seven days of the installation when Moses was setting up the Tabernacle and officiating therein and dismantling it daily the Shechinah had not rested upon it and the Israelites felt ashamed, saying to Moses: “O, our Teacher Moses! All the trouble which we have taken was only that the Shechinah may dwell amongst us, so that we may know that the sin of the golden calf has been atoned for on our behalf!” He therefore had said to them (v. 6): “This is the thing which the Lord commanded that ye should do so that the glory of the Lord may appear unto you” (i. e. only after these offerings will have been brought by Aaron (cf. v. 7) will God’s glory appear unto you). My brother Aaron is more worthy and excellent than I am, so that through his sacrifices and ministration the Shechinah will rest upon you, and ye will thereby know that the Omnipresent God has chosen him to bring His Shechinah upon you."}, {"ch": 9, "v": 24, "aliyah": 3, "heb": "וַתֵּ֤צֵא אֵשׁ֙ מִלִּפְנֵ֣י יְהֹוָ֔ה וַתֹּ֙אכַל֙ עַל־הַמִּזְבֵּ֔חַ אֶת־הָעֹלָ֖ה וְאֶת־הַחֲלָבִ֑ים וַיַּ֤רְא כׇּל־הָעָם֙ וַיָּרֹ֔נּוּ וַֽיִּפְּל֖וּ עַל־פְּנֵיהֶֽם׃", "onk": "וּנְפָקַת אֶשָּׁתָא מִן קֳדָם יְיָ וַאֲכָלַת עַל מַדְבְּחָא יָת עֲלָתָא וְיָת תַּרְבַּיָּא וַחֲזָא כָּל עַמָּא וְשַׁבָּחוּ וּנְפָלוּ עַל אַפֵּיהוֹן:", "onk_en": "A fire came forth from before Adonoy and consumed what was on the altar; the burnt-offering and the fats. All the people saw and they raised their voices in praise, and they fell on their faces.", "pj": "וּנְפָקַת אֵישָׁתָא מִן קֳדָם יְיָ וְאַכְלַת עַל מַדְבְּחָא יַת עָלָתָא יַת תַּרְבַּיָא וְחָמוּן כָּל עַמָא וְאוֹדוּן וְאִיתְרְכִינוּ בִּצְלוֹ עַל אַנְפֵּיהוֹן", "pj_en": "and the Fire came forth from the Presence of the Lord and consumed upon the altar the sacrifice and the fat. And all the people saw, and gave praise, and bowed in prayer upon their faces.", "tj": "וְאִתְרְכִינוּ בִּצְלוֹ עַל אַפֵּיהוֹן:", "tj_en": "And bowed in prayer upon their faces.", "rashi": "<b>וירנו.<\/b> כְּתַרְגּוּמוֹ:", "rashi_en": "וירנו Understand this as the Targum does: and they praised God."}, {"ch": 10, "v": 1, "aliyah": 3, "heb": "וַיִּקְח֣וּ בְנֵֽי־אַ֠הֲרֹ֠ן נָדָ֨ב וַאֲבִיה֜וּא אִ֣ישׁ מַחְתָּת֗וֹ וַיִּתְּנ֤וּ בָהֵן֙ אֵ֔שׁ וַיָּשִׂ֥ימוּ עָלֶ֖יהָ קְטֹ֑רֶת וַיַּקְרִ֜יבוּ לִפְנֵ֤י יְהֹוָה֙ אֵ֣שׁ זָרָ֔ה אֲשֶׁ֧ר לֹ֦א צִוָּ֖ה אֹתָֽם׃", "onk": "וּנְסִיבוּ בְנֵי אַהֲרֹן נָדָב וַאֲבִיהוּא גְּבַר מַחְתִּיתֵיהּ וִיהָבוּ בְהוֹן אֶשָּׁתָא וְשַׁוִּיאוּ עֲלַהּ קְטוֹרֶת וְקָרִיבוּ קֳדָם יְיָ אֶשָּׁתָא נוּכְרֵיתָא דִּי לָא פַּקִּיד יָתְהוֹן:", "onk_en": "Nodov and Avihu, Aharons sons, took, each of them his fire-pan, placed fire on it and then placed incense upon it and they brought before Adonoy a strange fire, which He had not commanded them.", "pj": "וּנְסִיבוּ בְנֵי אַהֲרן נָדָב וַאֲבִיהוּא גְבַר מַחְתִּיתֵיהּ וִיהָבוּ בְהוֹן אֵישָׁתָא וְשַׁוִיאוּ עֲלָהּ קְטוֹרֶת בּוּסְמִין וּקְרִיבוּ קֳדָם יְיָ אֵישָׁתָא נוּכְרָתָא מִן תַּפְיַין מַה דְלָא פַּקֵיד יַתְהוֹן", "pj_en": "But the sons of Aharon, Nadab and Abihu, took each man his censer, and put fire therein, and laid sweet incense upon it, and offered before the Lord strange fire taken from (under) the hearth-pots, which had not been commanded them.", "tj": "אֵישָׁא בַּרְיָא:", "tj_en": "Outside fire.", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 2, "aliyah": 3, "heb": "וַתֵּ֥צֵא אֵ֛שׁ מִלִּפְנֵ֥י יְהֹוָ֖ה וַתֹּ֣אכַל אוֹתָ֑ם וַיָּמֻ֖תוּ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּנְפָקַת אֶשָּׁתָא מִן קֳדָם יְיָ וַאֲכָלַת יָתְהוֹן וּמִיתוּ קֳדָם יְיָ:", "onk_en": "A fire came forth from before Adonoy and consumed them, and they died in the presence of Adonoy.", "pj": "וּנְפָקַת שַׁלְהוֹבִית אֵישָׁתָא מִן קֳדָם יְיָ בִּרְגַז וְאִתְפַּלִיגַת לְאַרְבַּעְתֵּי חוּטִין וְאָעֲלַת בְּגוֹ אַפֵּיהוֹן וְאוֹקִידַת יַת נִשְׁמַתְהוֹן בְּרַם גוּפֵיהוֹן לָא אִיתְחַרְכוּ וּמִיתוּ קֳדָם יְיָ", "pj_en": "And a flame of fire came out from before the Lord (as) with anger, and divided itself into four streams, (or lines,) and penetrated their nostrils, and burned their lives (souls) without destroying their bodies; and they died before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ותצא אש.<\/b> רַ' אֱלִיעֶזֶר אוֹמֵר לֹא מֵתוּ בְנֵי אַהֲרֹן אֶלָּא עַל יְדֵי שֶׁהוֹרוּ הֲלָכָה בִּפְנֵי מֹשֶׁה רַבָּן, רַבִּי יִשְׁמָעֵאל אוֹמֵר שְׁתוּיֵי יַיִן נִכְנְסוּ לַמִּקְדָּשׁ, תֵּדַע, שֶׁאַחַר מִיתָתָן הִזְהִיר הַנּוֹתָרִים שֶׁלֹּא יִכָּנְסוּ שְׁתוּיֵי יַיִן לַמִּקְדָּשׁ, מָשָׁל לְמֶלֶךְ שֶׁהָיָה לוֹ בֶן בַּיִת וְכוּ', כִּדְאִיתָא בְּוַיִּקְרָא רַבָּה:", "rashi_en": "ותצא אש AND THERE WENT OUT FIRE — Rabbi Eleizer said: the sons of Aaron died only because they gave decisions on religious matters in the presence of their teacher, Moses (Sifra, Shemini, Mechilta d'Miluim 2 32; Eruvin 63a). Rabbi Ishmael said: they died because they entered the Sanctuary intoxicated by wine. You may know that this is so, because after their death he admonished those who survived that they should not enter when intoxicated by wine (vv. 8—9). A parable! It may be compared to a king who had a bosom friend, etc., as is to be found in Leviticus Rabbah 12:1, 4 (cf. Biur)."}, {"ch": 10, "v": 3, "aliyah": 3, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל־אַהֲרֹ֗ן הוּא֩ אֲשֶׁר־דִּבֶּ֨ר יְהֹוָ֤ה&thinsp;<small>׀<\/small>&thinsp;לֵאמֹר֙ בִּקְרֹבַ֣י אֶקָּדֵ֔שׁ וְעַל־פְּנֵ֥י כׇל־הָעָ֖ם אֶכָּבֵ֑ד וַיִּדֹּ֖ם אַהֲרֹֽן׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן הוּא דִי מַלִּיל יְיָ לְמֵימַר בְּקָרִיבַי אִתְקַדַּשׁ וְעַל אַפֵּי כָל עַמָּא אִתְיַקָּר וּשְׁתִיק אַהֲרֹן:", "onk_en": "Moshe said to Aharon It is as Adonoy spoke, saying: through those that are near me I shall be sanctified, and in the presence of the entire people I will be glorified, and Aharon was silent.", "pj": "וַאֲמַר משֶׁה הִיא דְמַלֵיל יְיָ עִמִי בְּסִינַי לְמֵימָר בִּדְקָרִיבִין קֳדָמַי אֲנָא מַקְדַשׁ מַשְׁכְּנָא דְאִין לָא מִזְדַהֲרִין בְּעִיבִידַת קוּרְבָּנַיָא אוֹקִידִינוּן בְּשַׁלְהוֹבִית אֵישָׁתָא מִן קֳדָמוֹי מְטוֹל דְעַל מֵיחְמֵי כָּל עַמָא אִיתְיְקַר וּשְׁמַע אַהֲרן וְשָׁתִיק וְקַבֵּיל אֲגַר טַב עַל מִשְׁתּוֹקֵיהּ", "pj_en": "And Mosheh said, This is that which the Lord spake with me in Sinai, saying: In them who come near before Me I will have the tabernacle to be sacred, that, if they be not heedful in the service of the oblations, I will burn them with flaming fire from before Me, that in the sight of all the people I may be glorified. And Aharon heard, and was silent; and he received a good reward for his silence.", "tj": "", "tj_en": "", "rashi": "<b>הוא אשר דבר וגו'.<\/b> הֵיכָן דִּבֵּר? וְנֹעַדְתִּי שָׁמָּה לִבְנֵי יִשְֹרָאֵל וְנִקְדַּשׁ בִּכְבֹדִי (שמות כ\"ט), אַל תִּקְרֵי בִּכְבֹדִי אֶלָּא בִּמְכֻבָּדַי; אָמַר לוֹ מֹשֶׁה לְאַהֲרֹן, אַהֲרֹן אָחִי, יוֹדֵעַ הָיִיתִי שֶׁיִּתְקַדֵּשׁ הַבַּיִת בִּמְיֻדָּעָיו שֶׁל מָקוֹם, וְהָיִיתִי סָבוּר אוֹ בִי אוֹ בְךָ, עַכְשָׁיו רוֹאֶה אֲנִי שֶׁהֵם גְּדוֹלִים מִמֶּנִּי וּמִמְּךָ (ספרא):<br><br><b>וידם אהרן.<\/b> קִבֵּל שָׂכָר עַל שְׁתִיקָתוֹ, וּמַה שָּׂכָר קִבֵּל? שֶׁנִּתְיַחֵד עִמּוֹ הַדִּבּוּר — שֶׁנֶּאֶמְרָה לוֹ לְבַדּוֹ פָּרָשַׁת שְׁתוּיֵי יַיִן (ויקרא רבה י\"ב):<br><br><b>בקרבי.<\/b> בִּבְחִירַי:<br><br><b>ועל פני כל העם אכבד.<\/b> כְּשֶׁהַקָּבָּ\"ה עוֹשֶׂה דִין בַּצַּדִּיקִים מִתְיָרֵא וּמִתְעַלֶּה וּמִתְקַלֵּס, אִם כֵּן בְּאֵלּוּ, כָּל שֶׁכֵּן בָּרְשָׁעִים; וְכֵן הוּא אוֹמֵר נוֹרָא אֱלֹהִים מִמִּקְדָּשֶׁיךָ (תהלים ס\"ח), אַל תִּקְרֵי מִמִּקְדָּשֶׁיךָ אֶלָּא מִמְּקֻדָּשֶׁיךָ:", "rashi_en": "‎‎ '‏וגו‎‎‎ 'הוא אשר דבר ה‎ THIS IS WHAT THE LORD SPOKE, etc. — Where had He spoken this? In the statement (Exodus 29:43), “And there I will be met by the children of Israel and it (the Tabernacle) shall be sanctified by My glory (בכבודי).” Read not here בִכְבוֹדִי, “by My Glory” but בִּמְכֻבָּדַי, “through My honoured ones” (Zevachim 115b). Moses here said to Aaron: “My brother, Aaron! I knew that this House was to be sanctified by those who are beloved of the Omnipresent God and I thought it would be either through me or through thee; now I see that these (thy sons who have died) are greater than me and than thee!” (Leviticus Rabbah 12 2).<br><br>‎וידם אהרן AND AARON WAS SILENT — He received a reward for his silence. And what was the reward he received? That the subsequent Divine address was made to him alone and not to Moses also — for to him alone was spoken the section (vv. 9—11) dealing with those who are intoxicated by wine (see v. 8) (Zevachim 115b; Leviticus Rabbah 12 2).<br><br>בקרבי IN THEM THAT COME NEAR UNTO ME — i. e. in My chosen ones.<br><br>ועל פני כל העם אכבד AND BEFORE ALL THE PEOPLE I WILL BE HONOURED — When the Holy One, blessed be He, executes judgment upon the righteous He becomes feared, and exalted and praised. If this be so in the case of these (when He judges the righteous) how much more is it so in the case of the wicked (i. e. when He punishes the wicked)! And in a similar sense it says (Psalms 68:36) “Thou art feared, O god, ממקדשיך”. Read not here מִמִּקְדָשֶׁיךָ, “from out of Thy sanctuaries”, but ‎ ‏ מִמִּקֻדָּשֶׁיךָ“because of Thy sanctified ones” (Zevachim 115b)."}, {"ch": 10, "v": 4, "aliyah": 3, "heb": "וַיִּקְרָ֣א מֹשֶׁ֗ה אֶל־מִֽישָׁאֵל֙ וְאֶ֣ל אֶלְצָפָ֔ן בְּנֵ֥י עֻזִּיאֵ֖ל דֹּ֣ד אַהֲרֹ֑ן וַיֹּ֣אמֶר אֲלֵהֶ֗ם קִ֞֠רְב֞֠וּ שְׂא֤וּ אֶת־אֲחֵיכֶם֙ מֵאֵ֣ת פְּנֵי־הַקֹּ֔דֶשׁ אֶל־מִח֖וּץ לַֽמַּחֲנֶֽה׃", "onk": "וּקְרָא משֶׁה לְמִישָׁאֵל וּלְאֶלְצָפָן בְּנֵי עֻזִּיאֵל <b>אַח אֲבוּהִי<\/b> דְאַהֲרֹן וַאֲמַר לְהוֹן קְרִיבוּ טוּלוּ יָת אֲחוּכוֹן מִן קֳדָם אַפֵּי קוּדְשָׁא לְמִבָּרָא לְמַשְׁרִיתָא:", "onk_en": "Moshe called to Mishael and to Elzafan the sons of Uziel, [<b>the brother of the father of<\/b>] Aharon’s uncle, and said to them; Come closer and carry your brothers from the presence of the Sanctuary, to beyond the encampment.", "pj": "וּקְרָא משֶׁה לְמִישָׁאֵל וּלְאֶלְצָפָן בְּנוֹי דְעוּזִיאֵל לֵיוָאֵי חֲבִיבָא דְאַהֲרן וַאֲמַר לְהוֹן קְרִיבוּ טוּלוּ יַת אֲחוּכוֹן מִן קוּדְשָׁא וּתְסוֹבְרִינוּן לְמִבָּרָא לְמַשְׁרִיתָא", "pj_en": "And Mosheh called unto Mishael and to Elzaphan, the sons of Uzziel the Levite, the relative of Aharon, and said to them, Take your brethren from the sanctuary, and carry them, without the camp.", "tj": "", "tj_en": "", "rashi": "<b>דד אהרן.<\/b> עֻזִּיאֵל אֲחִי עַמְרָם הָיָה שֶׁנֶּאֱמַר וּבְנֵי קְהָת וְגוֹ' (שמות ו'):<br><br><b>שאו את אחיכם וגו'.<\/b> כְּאָדָם הָאוֹמֵר לַחֲבֵרוֹ, הַעֲבֵר אֶת הַמֵּת מִלִּפְנֵי הַכַּלָּה שֶׁלֹּא לְעַרְבֵּב אֶת הַשִּׂמְחָה:", "rashi_en": "דד אהרן THE UNCLE OF AARON — Uzziel was Amram’s brother, as it is said (Exodus 6:18) “And the sons of Kehath were [Amram …. and Uzziel]”.<br><br>שאו את אחיכם וגו׳ CARRY YOUR BRETHREN etc. — as a man who says to his fellow: Remove the corpse from before the bride in order not to disturb the joy."}, {"ch": 10, "v": 5, "aliyah": 3, "heb": "וַֽיִּקְרְב֗וּ וַיִּשָּׂאֻם֙ בְּכֻתֳּנֹתָ֔ם אֶל־מִח֖וּץ לַֽמַּחֲנֶ֑ה כַּאֲשֶׁ֖ר דִּבֶּ֥ר מֹשֶֽׁה׃", "onk": "וּקְרִיבוּ וּנְטָלֻנּוּן בְּכִתֻּנֵּיהוֹן לְמִבָּרָא לְמַשְׁרִיתָא כְּמָא דִי מַלִּיל משֶׁה:", "onk_en": "They came closer and they carried them in their tunics to beyond the encampment, just as Moshe spoke.", "pj": "וּקְרִיבוּ וְסוֹבְרִינוּן בְּאוּנְקְלָוָון דְפַרְזְלָא בְּכִיתּוֹנֵיהוֹן וּקְבָרוּנוּן לְמִבָּרָא לְמַשְׁרִיתָא הֵיכְמָא דְמַלֵיל משֶׁה", "pj_en": "And they came nigh, and carried them with hooks of iron in their garments, and buried them without the camp, as Mosheh had directed.", "tj": "", "tj_en": "", "rashi": "<b>בכתנתם.<\/b> שֶׁל מֵתִים; מְלַמֵּד שֶׁלֹּא נִשְׂרְפוּ בִגְדֵיהֶם אֶלָּא נִשְׁמָתָם, כְּמִין שְׁנֵי חוּטִין שֶׁל אֵשׁ נִכְנְסוּ לְתוֹךְ חָטְמֵיהֶם (ספרא):", "rashi_en": "בכתנתם IN THEIR GARMENTS — in those of the dead (not in their own garments). This tells us that their garments had not been destroyed by fire, but their souls alone (neither their clothing nor bodies showed signs of burning; they had been struck by fire inwardly): there entered into their nostrils something like two threads of fire which burnt them to death (Sifra, Shemini, Mechilta d'Miluim 2 34; Sanhedrin 52a)."}, {"ch": 10, "v": 6, "aliyah": 3, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֣ה אֶֽל־אַהֲרֹ֡ן וּלְאֶלְעָזָר֩ וּלְאִֽיתָמָ֨ר&thinsp;<small>׀<\/small>&thinsp;בָּנָ֜יו רָֽאשֵׁיכֶ֥ם אַל־תִּפְרָ֣עוּ&thinsp;<b>׀<\/b> וּבִגְדֵיכֶ֤ם לֹֽא־תִפְרֹ֙מוּ֙ וְלֹ֣א תָמֻ֔תוּ וְעַ֥ל כׇּל־הָעֵדָ֖ה יִקְצֹ֑ף וַאֲחֵיכֶם֙ כׇּל־בֵּ֣ית יִשְׂרָאֵ֔ל יִבְכּוּ֙ אֶת־הַשְּׂרֵפָ֔ה אֲשֶׁ֖ר שָׂרַ֥ף יְהֹוָֽה׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן וּלְאֶלְעָזָר וּלְאִיתָמָר בְּנוֹהִי רֵישֵׁיכוֹן לָא תְרַבּוּן פֵּרוּעַ וּלְבוּשֵׁיכוֹן לָא תְבַזְּעוּן וְלָא תְמוּתוּן וְעַל כָּל כְּנִשְׁתָּא יְהֵי רוּגְזָא וַאֲחֵיכוֹן כָּל בֵּית יִשְׂרָאֵל יִבְכּוּן יָת יְקִדְתָּא דִּי אוֹקִיד יְיָ:", "onk_en": "Moshe said to Aharon and to Elozor and Isomor, his sons: Do not let your hair grow long and do not tear your garments so that you will not die and bring [Divine] anger on the entire congregation; your brothers, the entire House of Yisroel shall weep over the conflagration that Adonoy set ablaze.", "pj": "וַאֲמַר משֶׁה לְאַהֲרן וּלְאֶלְעָזָר וּלְאִיתָמָר בְּנוֹי רֵישֵׁיכוֹן לָא תַרְבּוּן פָּרוּעַ וּלְבוּשֵׁיכוֹן לָא תְבַזְעוּן וְלָא תְמוּתוּן בִּיקִידַת אֵישָׁתָא וְעִילוֹי כָּל כְּנִישְׁתָּא יְהֵי רוּגְזָא בְּרַם שְׁתּוּקוּן וְתִזְכּוּן יַת דִינָא עֲלֵיכוֹן וַאֲחֵיכוֹן כָּל בֵּית יִשְרָאֵל יִבְכּוּן יַת יַקִידְתָּא דְאוֹקִיד יְיָ", "pj_en": "And Mosheh said to Aharon, and to Elasar and to Ithamar, his sons, Unbare not your heads, neither rend your garments, lest you die by the burning fire, and there be wrath upon all the congregation; but be silent and justify the judgment upon you, and let all your brethren of the house of Israel bewail the burning which the Lord hath kindled.", "tj": "", "tj_en": "", "rashi": "<b>אל תפרעו.<\/b> אַל תְּגַדְּלוּ שֵׂעָר, מִכָּאן שֶׁאָבֵל אָסוּר בְּתִסְפֹּרֶת, אֲבָל אַתֶּם אַל תְּעַרְבְּבוּ שִׂמְחָתוֹ שֶׁל מָקוֹם (מועד קטן י\"ד):<br><br><b>ולא תמתו.<\/b> הָא אִם תַּעֲשׂוּ תָּמוּתוּ (ספרא):<br><br><b>ואחיכם כל בית ישראל.<\/b> מִכָּאן שֶׁצָּרָתָן שֶׁל תַּלְמִידֵי חֲכָמִים מֻטֶּלֶת עַל הַכֹּל לְהִתְאַבֵּל בָּהּ (מועד קטן כ\"ח):", "rashi_en": "ראשיכם] אל תפרעו] means, let not your hair grow long (cf. Numbers 6:5) (Sifra, Shemini, Mechilta d'Miluim 2 40). From this (from the fact that Scripture forbade these particular mourners to let their hair grow long) it follows that an אבל (one mourning the death of a near relative) is forbidden to cut his hair. Moses's words therefore signified: Ordinarily an אבל may not cut his hair but ye, disturb ye not the joy of the Omnipresent God by displaying signs of mourning (Moed Katan 14b).<br><br>ולא תמתו LEST YE DIE — Consequently if ye do this ye shall die (Sifra, Shemini, Mechilta d'Miluim 2 41).<br><br>ואחיכם כי בית ישראל BUT (LET] YOUR BRETHREN, THE WHOLE OF ISRAEL [WEEP] — From this it follows that for the miseries of the learned the duty devolves upon everyone (the entire community) to mourn (cf. Moed Katan 28b.)"}, {"ch": 10, "v": 7, "aliyah": 3, "heb": "וּמִפֶּ֩תַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ פֶּן־תָּמֻ֔תוּ כִּי־שֶׁ֛מֶן מִשְׁחַ֥ת יְהֹוָ֖ה עֲלֵיכֶ֑ם וַֽיַּעֲשׂ֖וּ כִּדְבַ֥ר מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמִתְּרַע מַשְׁכַּן זִמְנָא לָא תִפְּקוּן דִּילְמָא תְמוּתוּן אֲרֵי מְשַׁח <b>רְבוּתָא<\/b> דַיְיָ עֲלֵיכוֹן וַעֲבָדוּ כְּפִתְגָּמָא דְמשֶׁה:", "onk_en": "From the entrance of the Tent of Meeting you shall not go forth lest you die; for the anointing oil of [<b>the inauguration to greatness of<\/b>] Adonoy is on you and they did as Moshe had said.", "pj": "וּמִתְּרַע מַשְׁכַּן זִמְנָא לָא תִפְקוּן דִלְמָא תְמוּתוּן אֲרוּם מְשַׁח רְבוּתָא דַיְיָ עֲלֵיכוֹן וַעֲבָדוּ הֵי כְפִתְגָמָא דְמשֶׁה", "pj_en": "And from the door of the tabernacle of ordinance go not forth lest you die; for the oil of the Lord's consecration is upon you. And they did according to the word of Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 8, "aliyah": 3, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ לְאַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Aharon, saying,", "pj": "וּמַלֵיל יְיָ עִם אַהֲרן לְמֵימָר", "pj_en": "And the Lord spake with Aharon, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 9, "aliyah": 3, "heb": "יַ֣יִן וְשֵׁכָ֞ר אַל־תֵּ֣שְׁתְּ&thinsp;<b>׀<\/b> אַתָּ֣ה&thinsp;<b>׀<\/b> וּבָנֶ֣יךָ אִתָּ֗ךְ בְּבֹאֲכֶ֛ם אֶל־אֹ֥הֶל מוֹעֵ֖ד וְלֹ֣א תָמֻ֑תוּ חֻקַּ֥ת עוֹלָ֖ם לְדֹרֹתֵיכֶֽם׃", "onk": "חֲמַר וּמְרַוֵּי לָא תִשְׁתֵּי אַתְּ וּבְנָיךְ עִמָּךְ בְּמֵעַלְכוֹן לְמַשְׁכַּן זִמְנָא וְלָא תְמוּתוּן קְיַם עָלָם לְדָרֵיכוֹן:", "onk_en": "Do not drink wine or any other intoxicant, you and your sons with you, when you enter the Tent of Meeting and you will not die; this is an everlasting statute throughout your generations.", "pj": "חֲמַר וְכָל מִדַעַם מַרְוֵי לָא תִשְׁתֵּי אַנְתְּ וּבְנָךְ עִמָךְ בִּזְמַן מֵיעַלְכוֹן לְמַשְׁכַּן זִימְנָא הֵיכְמָא דְעָבְדוּ בְּנָךְ דְמִיתוּ בִּיקִידַת אֵישָׁתָא קְיַים עֲלָם לְדָרֵיכוֹן", "pj_en": "Drink neither wine nor anything that maketh drunk, neither thou nor thy sons with thee at the time when ye are to enter into the tabernacle of ordinance, as thy sons did who have died by the burning of fire. It is an everlasting statute for your generations;", "tj": "", "tj_en": "", "rashi": "<b>יין ושכר.<\/b> יַיִן דֶּרֶךְ שִׁכְרוּתוֹ (ספרא):<br><br><b>בבאכם אל אהל מועד.<\/b> אֵין לִי אֶלָּא בְּבֹאֲכֶם לַהֵיכָל, בְּגִשְׁתָּם לַמִּזְבֵּחַ מִנַּיִן? נֶאֱמַר כָּאן בִּיאַת אֹהֶל מוֹעֵד וְנֶאֱמַר בְּקִדּוּשׁ יָדַיִם וְרַגְלַיִם בִּיאַת אֹהֶל מוֹעֵד, מַה לְּהַלָּן עָשָׂה גִישַׁת מִזְבֵּחַ כְּבִיאַת אֹהֶל מוֹעֵד, אַף כָּאן עָשָׂה גִישַׁת מִזְבֵּחַ כְּבִיאַת אֹהֶל מוֹעֵד (שם):", "rashi_en": "ושכר ‎יין [DO NOT DRINK] WINE NOR STRONG DRINK — do not drink wine in a manner that brings out its intoxicating force (i. e. do not drink a “log” of wine) (Sifra, Shemini, Section 1 1; Keritot 13b). <br><br>‎‏ בבאכם אל אהל מועד WHEN YE GO INTO THE APPOINTED TENT — I have in these words only a law that forbids this when ye go into the Sanctuary; whence can it be derived that it applies also whenever they approached the outer altar? But there is mention here of entering into the appointed tent and there is mention, in connection with the sanctification (the washing) of the hands and feet, of entering into the appointed tent (Exodus 30:20). What is the law there? It (the Torah) made the law regarding approaching to the altar exactly similar to that regarding entering the appointed tent (“when they go into the appointed tent they shall wash with water … or when they come near to the altar”)! Here, also, it makes approaching the altar exactly similar to entering the appointed tent (Sifra, Shemini, Section 1 5)."}, {"ch": 10, "v": 10, "aliyah": 3, "heb": "וּֽלְהַבְדִּ֔יל בֵּ֥ין הַקֹּ֖דֶשׁ וּבֵ֣ין הַחֹ֑ל וּבֵ֥ין הַטָּמֵ֖א וּבֵ֥ין הַטָּהֽוֹר׃", "onk": "וּלְאַפְרָשָׁא בֵּין קוּדְשָׁא וּבֵין חֻלָּא וּבֵין מְסָאָבָא וּבֵין דַּכְיָא:", "onk_en": "[So that you may] distinguish between what is sacred and what is mundane, between what is impure and what is pure.", "pj": "וּלְאַפְרָשָׁא בֵּינֵי קוּדְשָׁא וּבֵינֵי חוּלָא וּבֵינֵי מְסָאבָא וּבֵינֵי דַכְיָא", "pj_en": "and for the distinguishing between the sacred and the common, and between the unclean and the clean,", "tj": "", "tj_en": "", "rashi": "<b>ולהבדיל.<\/b> כְּדֵי שֶׁתַּבְדִּילוּ בֵּין עֲבוֹדָה קְדוֹשָׁה לִמְחֻלֶּלֶת, הָא לָמַדְתָּ שֶׁאִם עָבַד עֲבוֹדָתוֹ פְסוּלָה (שם):", "rashi_en": "ולהבדיל AND TO DISTINGUISH [BETWEEN THE HOLY AND THE UNHOLY] — i. e., Observe this law in order that ye may be able to distinguish between a holy (valid) sacrificial act and one which has become profane (invalid). Thus you may learn that if one performed a sacrificial rite in a state of intoxication his ministry was invalid (Sifra, Shemini, Section 1 8; Zevachim 17b)."}, {"ch": 10, "v": 11, "aliyah": 3, "heb": "וּלְהוֹרֹ֖ת אֶת־בְּנֵ֣י יִשְׂרָאֵ֑ל אֵ֚ת כׇּל־הַ֣חֻקִּ֔ים אֲשֶׁ֨ר דִּבֶּ֧ר יְהֹוָ֛ה אֲלֵיהֶ֖ם בְּיַד־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְאַלָּפָא יָת בְּנֵי יִשְׂרָאֵל יָת כָּל קְיָמַיָּא דִּי מַלִּיל יְיָ לְהוֹן בִּידָא דְמשֶׁה:", "onk_en": "[And that you may] teach Bnei Yisroel all the statutes that Adonoy spoke to them, through Moshe.", "pj": "וּלְאַלָפָא יַת בְּנֵי יִשְרָאֵל יַת כָּל קְיָמָא דְמַלֵיל יְיָ לְהוֹן בִּידָא דְמשֶׁה", "pj_en": "and for teaching the children of Israel all the statutes which the Lord hath spoken to them by the hand of Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ולהורת.<\/b> לִמֵּד שֶׁאָסוּר שִׁכּוֹר בְּהוֹרָאָה, יָכוֹל יְהֵא חַיָּב מִיתָה, תַּ\"ל אַתָּה וּבָנֶיךָ אִתָּךְ, וְלֹא תָמֻתוּ, כֹּהֲנִים בַּעֲבוֹדָתָם בְּמִיתָה, וְאֵין חֲכָמִים בְּהוֹרָאָתָן בְּמִיתָה (שם):", "rashi_en": "ולהורת AND TO TEACH [THE CHILDREN OF ISRAEL] — This informs us that an intoxicated person is forbidden to pronounce religious decisions. One might think that if he does so he is liable to the death penalty! It, however, says: “[Do not drink wine] thou (Aaron), nor thy sons with thee … lest ye die” — priests when they minister in a state of intoxication are punishable by death, but the Sages when they thus render decisions are not punishable by death (Sifra, Shemini, Section 1 6)."}, {"ch": 10, "v": 12, "aliyah": 4, "heb": "וַיְדַבֵּ֨ר מֹשֶׁ֜ה אֶֽל־אַהֲרֹ֗ן וְאֶ֣ל אֶ֠לְעָזָ֠ר וְאֶל־אִ֨יתָמָ֥ר&thinsp;<small>׀<\/small>&thinsp;בָּנָיו֮ הַנּֽוֹתָרִים֒ קְח֣וּ אֶת־הַמִּנְחָ֗ה הַנּוֹתֶ֙רֶת֙ מֵאִשֵּׁ֣י יְהֹוָ֔ה וְאִכְל֥וּהָ מַצּ֖וֹת אֵ֣צֶל הַמִּזְבֵּ֑חַ כִּ֛י קֹ֥דֶשׁ קׇֽדָשִׁ֖ים הִֽוא׃", "onk": "וּמַלִּיל משֶׁה עִם אַהֲרֹן וְעִם אֶלְעָזָר וְעִם אִיתָמָר בְּנוֹהִי דְּאִשְׁתָּאֲרוּ סִיבוּ יָת מִנְחָתָא דְאִשְׁתָּאָרַת <b>מִקֻּרְבָּנַיָּא<\/b> דַיְיָ וְאִכְלוּהָ <b>פַטִּיר<\/b> בִּסְטַר מַדְבְּחָא אֲרֵי קֹדֶשׁ קוּדְשִׁין הִיא:", "onk_en": "Moshe spoke to Aharon and to Elozor and Isomor, his surviving sons; Take the meal-offering which remains of the fire-offering [<b>offerings<\/b>] of Adonoy and eat it [as] <i>matzos<\/i> [<b>matzoh<\/b>] [unleavened] beside the altar, for it is holy of holies [=most holy].", "pj": "וּמַלֵיל משֶׁה עִם אַהֲרן וְעִם אֶלְעָזָר וְעִם אִיתָמָר בְּנוֹי דְאִישְׁתַּיְירוּ מִן יַקִידְתָּא סִיבוּ יַת מִנְחָתָא דְאִשְׁתְּיָרַת מִקוּרְבָּנַיָא דַיְיָ וְאִכְלוּהָ פַּטִיר בִּסְטַר מַדְבְּחָא אֲרוּם קוֹדֶשׁ קוּדְשִׁין הִיא", "pj_en": "And Mosheh spake with Aharon, and Elasar and Ithamar, his sons, who were left from the burning: Take the mincha that remaineth of the Lord's oblations, and eat it unleavened at the side of the altar, because it is most sacred:", "tj": "", "tj_en": "", "rashi": "<b>הנותרים.<\/b> מִן הַמִּיתָה, מְלַמֵּד שֶׁאַף עֲלֵיהֶן נִקְנְסָה מִיתָה עַל עֲוֹן הָעֵגֶל, הוּא שֶׁנֶּאֱמַר (דברים ט'), וּבְאַהֲרֹן הִתְאַנַּף ה' מְאֹד לְהַשְׁמִידוֹ, וְאֵין הַשְׁמָדָה אֶלָּא כִלּוּי בָּנִים, שֶׁנֶּאֱמַר (עמוס ב'), וָאַשְׁמִיד פִּרְיוֹ מִמַּעַל, וּתְפִלָּתוֹ שֶׁל מֹשֶׁה בִּטְּלָה מֶחֱצָה, שֶׁנֶּאֱמַר (דברים ט'), וָאֶתְפַּלֵּל גַּם בְּעַד אַהֲרֹן בָּעֵת הַהִיא:<br><br><b>קחו את המנחה.<\/b> אַף עַל פִּי שֶׁאַתֶּם אוֹנְנִין וְקָדָשִׁים אֲסוּרִים לְאוֹנֵן:<br><br><b>את המנחה.<\/b> זוֹ מִנְחַת שְׁמִינִי וּמִנְחַת נַחְשׁוֹן (ספרא):<br><br><b>ואכלוה מצות.<\/b> מַה תַּ\"ל? לְפִי שֶׁהִיא מִנְחַת צִבּוּר וּמִנְחַת שָׁעָה וְאֵין כַּיּוֹצֵא בָהּ לְדּוֹרוֹת, הֻצְרַךְ לְפָרֵשׁ בָּהּ דִּין שְׁאָר מְנָחוֹת (שם):", "rashi_en": "הנותרים WHO WERE LEFT from death. This teaches us that upon them, also, death had been pronounced in punishment for the sin of the golden calf. This is what is meant by the words (Deuteronomy 9:20) “And with Aaron the Lord was very angry to destroy him”, for the expression “destruction” means the extirpation of offspring, as it is said (Amos 2:9) “And I destroyed its fruit above”. Moses’ prayer, however, made half the sentence of none effect, (so that only two of Aaron’s four sons died) as it is said (Deuteronomy 9:20) “And I prayed also on behalf of Aaron at that time” (cf. Rashi on that passage).<br><br>קחו את המנחה TAKE THE MEAL OFFERING, although ye are אוננים and the holy things are forbidden to an אונן (Zevachim 101a).<br><br>את המנחה THE MEAL-OFFERING — This was the meal-offering prescribed for the eighth day of the installation ceremony and the meal-offering of Nachshon (Numbers 7:13; cf. Sifra, Shemini, Chapter 1 3).<br><br>ואכלהו מצות AND EAT IT AS UNLEAVENED CAKES — Why is this stated at all, since this regulation regarding the meal-offering has been previously laid down (cf. Leviticus 6:9)? Since, however, this (the meal-offering prescribed for the installation ceremony) was a communal meal-offering (cf. Leviticus 9:3—4) and an occasional meal-offering and nothing similar to it had been commanded for future generations and it was therefore possible that the regulations relating to meal-offerings in general did not apply, it was necessary expressly to set forth in respect of it the law already laid down for other meal-offerings (Sifra, Shemini, Chapter 1 4)."}, {"ch": 10, "v": 13, "aliyah": 4, "heb": "וַאֲכַלְתֶּ֤ם אֹתָהּ֙ בְּמָק֣וֹם קָד֔וֹשׁ כִּ֣י חׇקְךָ֤ וְחׇק־בָּנֶ֙יךָ֙ הִ֔וא מֵאִשֵּׁ֖י יְהֹוָ֑ה כִּי־כֵ֖ן צֻוֵּֽיתִי׃", "onk": "וְתֵיכְלוּן יָתַהּ בַּאֲתַר קַדִּישׁ אֲרֵי חֳלָקָךְ וָחֳלַק בְּנָיךְ הִיא <b>מִקֻּרְבָּנַיָּא<\/b> דַּיְיָ אֲרֵי כֵן אִתְפַּקָּדִית:", "onk_en": "You shall eat it in a sacred place, for it is your portion and the portion of your sons of the fire-offerings [<b>offerings<\/b>] of Adonoy, for so have I been commanded.", "pj": "וְתֵיכְלוּן יָתָהּ בַּאֲתַר קַדִישׁ אֲרוּם חוּלְקָךְ וְחוּלַק בְּנָךְ הוּא מִקוּרְבָּנַיָא דַיְיָ אֲרוּם הֵיכְדֵין אִיתְפַּקָדִית", "pj_en": "and you may eat it in the holy place; for it is thy portion and the portion of thy souls of the oblations of the Lord: for so have I been commanded.", "tj": "", "tj_en": "", "rashi": "<b>וחק בניך.<\/b> אֵין לַבָּנוֹת חֹק בַּקֳּדָשִׁים (שם):<br><br><b>כי כן צויתי.<\/b> בַּאֲנִינוּת יֹאכְלוּהָ (שם; זבחים ק\"א):", "rashi_en": "וחק בניך AND THY SONS’ PORTION — Daughters are not mentioned as is the case in v. 14 because daughters have no portion in these holy things (meal-offerings; cf. Leviticus 6:10— 11) (Sifra, Shemini, Chapter 1 7).<br><br>כי כן צויתי FOR SO AM I COMMANDED — that they must eat it even when they have the status of אוננים (Sifra, Shemini, Chapter 1 8; Zevachim 101a)."}, {"ch": 10, "v": 14, "aliyah": 4, "heb": "וְאֵת֩ חֲזֵ֨ה הַתְּנוּפָ֜ה וְאֵ֣ת&thinsp;<b>׀<\/b> שׁ֣וֹק הַתְּרוּמָ֗ה תֹּֽאכְלוּ֙ בְּמָק֣וֹם טָה֔וֹר אַתָּ֕ה וּבָנֶ֥יךָ וּבְנֹתֶ֖יךָ אִתָּ֑ךְ כִּֽי־חׇקְךָ֤ וְחׇק־בָּנֶ֙יךָ֙ נִתְּנ֔וּ מִזִּבְחֵ֥י שַׁלְמֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְיָת חֶדְיָא <b>דַאֲרָמוּתָא<\/b> וְיָת שׁוֹקָא דְאַפְרָשׁוּתָא תֵּיכְלוּן בַּאֲתַר דְּכֵי אַתְּ וּבְנָיךְ וּבְנָתָיךְ עִמָּךְ אֲרֵי חֳלָקָךְ וָחֳלַק בְּנָיךְ אִתְיְהִבוּ מִנִּכְסַת <b>קוּדְשַׁיָּא<\/b> דִּבְנֵי יִשְׂרָאֵל:", "onk_en": "The breast of the wave-offering [<b>uplifted-offering<\/b>] and the thigh that is the separated portion you shall eat in a pure (undefiled) place, you and your sons and daughters with you, for as your portion and as the portion of your sons they are given from the sacrifices of the peace[<b>sacred<\/b>]-offerings of Bnei Yisroel.", "pj": "וְיַת חַדְיָא דַאֲרָמוּתָא וְיַת שׁוֹקָא דְאַפְרָשׁוּתָא תֵּיכְלוּן בַּאֲתַר דְכֵי אַנְתְּ וּבְנָךְ וּבְנָתָךְ עִמָךְ אֲרוּם חוּלְקָךְ וְחוּלַק בְּנָךְ אִתְיְהִבוּ מִנִכְסַת קוּדְשַׁיָא דִבְנֵי יִשְרָאֵל", "pj_en": "But the breast of the uplifting and the shoulder of the separation you may eat in (any) clean place, thou and thy sons with thee, because it is thy portion and the portion of thy sons which hath been given from the hallowed sacrifices of the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ואת חזה התנופה.<\/b> שֶׁל שַׁלְמֵי צִבּוּר.<br><br><b>תאכלו במקום טהור.<\/b> וְכִי אֶת הָרִאשׁוֹנִים אָכְלוּ בְּמָקוֹם טָמֵא? אֶלָּא הָרִאשׁוֹנִים שֶׁהֵם קָדְשֵׁי קֳדָשִׁים הֻזְקְקָה אֲכִילָתָם בְּמָקוֹם קָדוֹשׁ, אֲבָל אֵלּוּ אֵין צְרִיכִים תּוֹךְ הַקְּלָעִים אֲבָל צְרִיכִים הֵם לֵאָכֵל תּוֹךְ מַחֲנֵה יִשְׂרָאֵל שֶׁהוּא טָהוֹר מִלִּכָּנֵס שָׁם מְצֹרָעִים; מִכָּאן שֶׁקָּדָשִׁים קַלִּים נֶאֱכָלִין בְּכָל הָעִיר (שם נ\"ה):<br><br><b>אתה ובניך ובנתיך.<\/b> אַתָּה וּבָנֶיךָ בְּחֵלֶק אֲבָל בְּנוֹתֶיךָ לֹא בְחֵלֶק, אֶלָּא אִם תִּתְּנוּ לָהֶם מַתָּנוֹת רַשָּׁאוֹת הֵן לֶאֱכֹל בְּחָזֶה וְשׁוֹק, אוֹ אֵינוֹ אֶלָּא אַף הַבָּנוֹת בְּחֵלֶק? תַּלְמוּד לוֹמַר כִּי חָקְךָ וְחָק בָּנֶיךָ נִתְּנוּ — חֹק לַבָּנִים וְאֵין חֹק לַבָּנוֹת (ספרא):", "rashi_en": "ואת חזה התנופה AND THE WAVE BREAST of the communal) peace-offerings,<br><br>תאכלו במקום טהור YE SHALL EAT IN A CLEAN PLACE —But had they eaten those that preceded this (the sin-offering and the meal-offering) in an unclean place? But he said this because the preceding ones being holy in the highest degree the eating of them had necessarily to take place in a holy spot (in the court of the Tabernacle), but these,however, were not required to be eaten “within the hangings” (i. e. in the court which was enclosed by hangings), but they were, however, required to be eaten in the camp of Israel (and not beyond the confines of that camp), that being a clean place in so far as lepers were precluded from entering it. From this we infer that sacrifices holy in a lower degree, being similar to the peace-offerings mentioned here, may be eaten anywhere within the city of Jerusalem, this area corresponding to “the camp of Israel” in the wilderness (see Rashi on 4:12; Zevachim 55a).<br><br>אתה ובניך ובנתיך THOU AND THY SONS AND THY DAUGHTERS — You and your sons have a claim to a portion, but your daughters have no claim to a portion; if, however, you give them part of these sacrifices as a gift they are permitted to eat of the breast and the shoulder. Or perhaps this is not the meaning, but if means that the daughters have also a claim to a portion? It, however, states immediately afterwards: “for as thy due and thy sons’ due are they given” there is a due to sons but there is no due to daughters (Sifra, Shemini, Chapter 1 10)."}, {"ch": 10, "v": 15, "aliyah": 4, "heb": "שׁ֣וֹק הַתְּרוּמָ֞ה וַחֲזֵ֣ה הַתְּנוּפָ֗ה עַ֣ל אִשֵּׁ֤י הַחֲלָבִים֙ יָבִ֔יאוּ לְהָנִ֥יף תְּנוּפָ֖ה לִפְנֵ֣י יְהֹוָ֑ה וְהָיָ֨ה לְךָ֜ וּלְבָנֶ֤יךָ אִתְּךָ֙ לְחׇק־עוֹלָ֔ם כַּאֲשֶׁ֖ר צִוָּ֥ה יְהֹוָֽה׃", "onk": "שׁוֹקָא דְאַפְרָשׁוּתָא וְחֶדְיָא <b>דַאֲרָמוּתָא<\/b> עַל קֻרְבָּנֵי תַרְבַּיָּא יַיְתוּן לַ<b>אֲרָמָא אֲרָמָא<\/b> קֳדָם יְיָ וִיהֵי לָךְ וְלִבְנָיךְ עִמָּךְ לִקְיַם עָלָם כְּמָא דִי פַּקִּיד יְיָ:", "onk_en": "The thigh that is the separated portion and the breast that is the wave-offering [<b>uplifted-offering<\/b>], on top of the fats of the fire offering [<b>offering<\/b>], they shall bring, to wave [<b>lift up<\/b>] as a wave-offering [<b>an uplifted-offering<\/b>] before Adonoy. It will be for you and for your sons with you an everlasting statute, just as Adonoy commanded.", "pj": "שׁוֹקָא דְאַפְרָשׁוּתָא וְחַדְיָא דַאֲרָמוּתָא עַל קוּרְבָּנֵיהּ תַּרְבַּיָא יַיְתוּן לַאֲרָמָא אֲרָמָא קֳדָם יְיָ וִיהֵי לָךְ וְלִבְנָךְ עִמָךְ לִקְיַים עֳלָם הֵיכְמָא דְפַקֵיד יְיָ", "pj_en": "The shoulder of the separation and the elevated breast with the fats of the oblations they shall bring to be uplifted an elevation before the Lord, and they shall then be thine and thy sons' with thee, by an everlasting statute, as the Lord commanded.", "tj": "", "tj_en": "", "rashi": "<b>שוק התרומה וחזה התנופה.<\/b> לשון אשר הונף ואשר הורם. תנופה מוליך ומביא תרומה מעלה ומוריד. ולמה חלקן הכתוב תרומה בשוק ותנופה בחזה. לא ידענו. ששניהם בהרמה והנפה:<br><br><b>על אשי החלבים.<\/b> מִכָּאן שֶׁהַחֲלָבִים לְמַטָּה בִּשְׁעַת תְּנוּפָה, וְיִשּׁוּב הַמִּקְרָאוֹת שֶׁלֹּא יַכְחִישׁוּ זֶה אֶת זֶה כְּבָר פֵּרַשְׁתִּי אֶת שְׁלָשְׁתָּן בְּצַו אֶת אַהֲרֹן:", "rashi_en": "על אשי החלבים WITH THE FIRE OFFERINGS OF THE FAT — From this we may learn that the fat-portions were beneath the others at the time of waving (Sifra, Shemini, Chapter 1 11). And as for the exposition of the texts in such a manner that they shall not contradict each other I have already explained the three of them in the section צו את אהרן (Leviticus 7:30; see Rashi thereon)."}, {"ch": 10, "v": 16, "aliyah": 5, "heb": "וְאֵ֣ת&thinsp;<b>׀<\/b> שְׂעִ֣יר הַֽחַטָּ֗את דָּרֹ֥שׁ דָּרַ֛שׁ מֹשֶׁ֖ה וְהִנֵּ֣ה שֹׂרָ֑ף וַ֠יִּקְצֹ֠ף עַל־אֶלְעָזָ֤ר וְעַל־אִֽיתָמָר֙ בְּנֵ֣י אַהֲרֹ֔ן הַנּוֹתָרִ֖ם לֵאמֹֽר׃", "onk": "וְיָת צְפִירָא דְחַטָּתָא מִתְבַּע תָּבְעֵי משֶׁה וְהָא אִתּוֹקָד וּרְגֵז עַל אֶלְעָזָר וְעַל אִיתָמָר בְּנֵי אַהֲרֹן דְּאִשְׁתָּאָרוּ לְמֵימָר:", "onk_en": "Regarding the goat of the sin-offering; Moshe made a detailed inquiry and behold! It was burned. He was angry with Elozor and Isomor, the remaining sons of Aharon, saying:", "pj": "וְיַת תְּלָתָא צְפִירַיָיא דְאִתְקְרִיבוּ בְּיוֹמָא הַהוּא צְפִירָא דְרֵישׁ יַרְחָא וּצְפִירָא דְחַטָאתָא דִלְעַמָא וּצְפִירָא דְחַטָאתָא דְקָרֵיב נַחְשׁוֹן בַּר עֲמִינָדָב לַחֲנוּכַּת מַדְבְּחָא אָזַל אַהֲרן וּבְנוֹי וְאוֹקִידוּ תְּלָתֵיהוֹן אָתָא משֶׁה וְתָבַע יַת צְפִירָא דְחַטָאתָא דִי לְעַמָא וְתַבְעֵיהּ וְהָא אִיתוֹקָד וְרָתַח עַל אֶלְעָזָר וְעַל אִיתָמָר בְּנוֹי דְאַהֲרן דְאִשְׁתְּיָירוּ לְמֵימָר", "pj_en": "And on this day three goats shall be offered; the goat for the beginning of the month, (or, new moon,) the goat of the people's sin offering, and the goat for the sin offering which Nachson bar Aminadab hath brought for the dedication of the altar. And Aharon and his sons went and burned those three. (But) Mosheh came and inquired for the goat of the people's sin offering; he sought it, but, behold, it had been burned, and he was angry with Elasar and Ithamar, the sons of Aharon who were left, and said,", "tj": "", "tj_en": "", "rashi": "<b>שעיר החטאת.<\/b> שְׂעִיר מוּסְפֵי רֹאשׁ חֹדֶשׁ; וּשְׁלֹשָׁה שְׂעִירֵי חַטָּאוֹת קָרְבוּ בוֹ בַיּוֹם, שְׂעִיר עִזִּים וּשְׂעִיר נַחְשׁוֹן וּשְׂעִיר רֹאשׁ חֹדֶשׁ, וּמִכֻּלָּן לֹא נִשְׂרַף אֶלָּא זֶה; וְנֶחְלְקוּ בַדָּבָר חַכְמֵי יִשְֹרָאֵל, יֵשׁ אוֹמְרִים מִפְּנֵי הַטֻּמְאָה שֶׁנָּגְעָה בוֹ נִשְׂרַף, וְיֵשׁ אוֹמְרִים מִפְּנֵי אֲנִינוּת נִשְׂרַף, לְפִי שֶׁהוּא קָדְשֵׁי דוֹרוֹת, אֲבָל בְּקָדְשֵׁי שָׁעָה סָמְכוּ עַל מֹשֶׁה שֶׁאָמַר לָהֶם בַּמִּנְחָה וְאִכְלוּהָ מַצּוֹת (ספרא; זבחים ק\"א):<br><br><b>דרש דרש.<\/b> שְׁתֵּי דְרִישׁוֹת: מִפְּנֵי מָה נִשְׂרַף זֶה? וּמִפְּנֵי מָה נֶאֶכְלוּ אֵלּוּ? כָּךְ הִיא בְּתוֹרַת כֹּהֲנִים:<br><br><b>על אלעזר ועל איתמר.<\/b> בִּשְׁבִיל כְּבוֹדוֹ שֶׁל אַהֲרֹן הָפַךְ פָּנָיו כְּנֶגֶד הַבָּנִים וְכָעַס (ספרא):<br><br><b>לאמר.<\/b> אָמַר לָהֶם הֲשִׁיבוּנִי עַל דְּבָרַי (שם):", "rashi_en": "שעיר החטאת THE GOAT OF THE SIN OFFERING — This was the goat of the additonal offerings of the New Moon. Three goats for sin-offerings had been sacrificed that day: a goat of the kids prescribed for the installation ceremony (see Leviticus  9:3), and the goat brought by Nachshon as a free-will offering, and the goat for the New Moon. Of all these, this last alone had been burnt, and the Sages of Israel differ in their opinions regarding the matter. Some say that it was on account of some uncleanness (unclean thing) which had touched it that it was burnt, whilst others say that it had been burnt on account of the state of mourning in which Aaron’s sons were, for it was a holy sacrifice ordained for all generations and was not of an exceptional character whilst in the case of the occasional holy sacrifices (the two other goats) they relied on Moses’ statement when he said in respect to the occasional meal-offering (v. 12), “and eat it as unleavened cakes”, although you are Onanim, and they took this to apply also to those goats which were also of an occasional character (Sifra, Shemini, Chapter 2 8-10; Zevachim 101a).<br><br>דרש דרש [MOSES] DILIGENTLY ENQUIRED ABOUT — The repetition of the word implies that he made two enquiries: why has this (the goat for the New Moon) been burnt and why have these other goats been eaten? — Thus it is stated in Torath Cohanim (Sifra, Shemini, Chapter 2 2).<br><br>על אלעזר ועל איתמר [HE WAS ANGRY] WITH ELEAZAR AND ITHAMAR — Out of the respect due to Aaron he turned towards his sons and showed himself angry with them instead of with Aaron (Sifra, Shemini, Chapter 2 3).<br><br>לאמר SAYING (i. e. that they should say or speak) — He said to them, “Give me replies to my questions” (Sifra, Shemini, Chapter 2)."}, {"ch": 10, "v": 17, "aliyah": 5, "heb": "מַדּ֗וּעַ לֹֽא־אֲכַלְתֶּ֤ם אֶת־הַחַטָּאת֙ בִּמְק֣וֹם הַקֹּ֔דֶשׁ כִּ֛י קֹ֥דֶשׁ קׇֽדָשִׁ֖ים הִ֑וא וְאֹתָ֣הּ&thinsp;<b>׀<\/b> נָתַ֣ן לָכֶ֗ם לָשֵׂאת֙ אֶת־עֲוֺ֣ן הָעֵדָ֔ה לְכַפֵּ֥ר עֲלֵיהֶ֖ם לִפְנֵ֥י יְהֹוָֽה׃", "onk": "מָדֵין לָא אֲכַלְתּוּן יָת חַטָּאתָא בַּאֲתַר קַדִּישׁ אֲרֵי קֹדֶשׁ קוּדְשִׁין הִיא וְיָתַהּ יָהֵב לְכוֹן לְסַלָּחָא עַל חוֹבֵי כְנִשְׁתָּא לְכַפָּרָא עַלֵיהוֹן קֳדָם יְיָ:", "onk_en": "Why did you not eat the sin-offering in a sacred place, for it is holy of holies [=most holy], and He gave it to you, to bear the iniquity of the congregation, to atone for them before Adonoy.", "pj": "מַדֵין לָא אֲכַלְתּוּן יַת חַטָאתָא בַּאֲתַר קַדִישׁ אֲרוּם קוֹדֶשׁ קוּדְשִׁין הוּא וְיָתָהּ יְהַב לְכוֹן לְמִשְׁרֵי עַל סִרְחָנוּת כְּנִישְׁתָּא לְכַפָּרָא עֲלֵיכוֹן קֳדָם יְיָ", "pj_en": "Why have you not eaten the sin offering in the holy place? forasmuch as it is most sacred, and hath been given to you for absolving the sin of the congregation, to make atonement for you before the Lord;", "tj": "", "tj_en": "", "rashi": "<b>מדוע לא אכלתם את החטאת במקום הקדש.<\/b> וְכִי חוּץ לַקֹּדֶשׁ אֲכָלוּהָ, וַהֲלֹא שְׂרָפוּהָ, וּמַה הוּא אוֹמֵר בִּמְקוֹם הַקֹּדֶשׁ, אֶלָּא אָמַר לָהֶם שֶׁמָּא חוּץ לַקְּלָעִים יָצְאָה וְנִפְסְלָה:<br><br><b>כי קדש קדשים הוא.<\/b> וְנִפְסֶלֶת בְּיוֹצֵא, וְהֵם אָמְרוּ לוֹ לָאו. אָמַר לָהֶם הוֹאִיל וּבִמְקוֹם הַקֹּדֶשׁ הָיְתָה, מַדּוּעַ לֹא אֲכַלְתֶּם אוֹתָהּ:<br><br><b>ואתה נתן לכם לשאת וגו'.<\/b> שֶׁהַכֹּהֲנִים אוֹכְלִים וּבְעָלִים מִתְכַּפְּרִים:<br><br><b>לשאת את עון העדה.<\/b> מִכָּאן לָמַדְנוּ שֶׁשְּׂעִיר רֹאשׁ חֹדֶשׁ הָיָה, שֶׁהוּא מְכַפֵּר עַל עֲוֹן טֻמְאַת מִקְדָּשׁ וְקָדָשָׁיו, שֶׁחַטַּאת שְׁמִינִי וְחַטַּאת נַחְשׁוֹן לֹא לְכַפָּרָה בָּאוּ:", "rashi_en": "מדוע לא אכלתם את החטאת במקום הקדש WHEREFORE HAVE YE NOT EATEN THE SIN OFFERING IN THE HOLY PLACE? — But had they eaten it outside the holy place? Had they not burnt it? What then did he mean when he said “in the holy place”? But he said to them in effect: Had it perhaps gone forth (been taken forth) outside the hangings of the court and so become invalid?<br><br>כי קדש קדשים הוא FOR IT IS HOLY IN THE HIGHEST DEGREE, and such sacrifices become invalid through being taken outside the hangings? If this was so you have done right in burning it! But they replied to him, “No, it has not been taken forth!” He thereupon said to them, “Since it remained in the holy place (במקום הקדש), wherefore have ye not eaten it (מדוע לא אכלתם)?!” (Sifra, Shemini, Chapter 2 4; cf. Zevachim 101a.) <br><br>'ואתה נתן לכם לשאת וגו‎ AND HE HATH GIVEN IT TO YOU TO BEAR [THE INIQUITY] etc., — for only if the priests eat it are the owners of the sin-offering (the entire Congregation in the case of the goat for the New Moon) atoned for (Sifra, Shemini, Chapter 2 4).<br><br>לשאת את עון העדה TO BEAR THE INIQUITY OF THE CONGREGATION — From this we learn that it must have been the goat for the New Moon about which he made the enquiries, for it was this that made atonement for iniquity involved in causing uncleanness to the Sanctuary and holy food (cf. Shevuot 2a), whilst the sin-offering for the eighth day of the installation ceremony and the sin-offering of Nachshan did not come (were not intended) for the purpose of atonement (Zevachim 101b)."}, {"ch": 10, "v": 18, "aliyah": 5, "heb": "הֵ֚ן לֹא־הוּבָ֣א אֶת־דָּמָ֔הּ אֶל־הַקֹּ֖דֶשׁ פְּנִ֑ימָה אָכ֨וֹל תֹּאכְל֥וּ אֹתָ֛הּ בַּקֹּ֖דֶשׁ כַּאֲשֶׁ֥ר צִוֵּֽיתִי׃", "onk": "הָא לָא אִתָּעַל יָת דְּמַהּ לְבֵית קֻדְשָׁא גַּוָּאָה מֵיכַל תֵּיכְלוּן יָתַהּ בְּקֻדְשָׁא כְּמָא דִי פַקֵּדִית:", "onk_en": "Behold its blood was not brought inside the Sanctuary, you should certainly have eaten it in a holy place as I have commanded.", "pj": "הָא לָא אִיתָעַל מִן אַדְמָא לְוַת קוּדְשָׁא גַוָואָה מֵיכַל תֵּיכְלוּן יָתֵיהּ בְּקוּדְשָׁא הֵיכְמָא דְאִתְפַּקֵדִית", "pj_en": "and, behold, none of its blood hath been carried in within the sanctuary. You should have indeed eaten it in the holy place, as I have been instructed.", "tj": "", "tj_en": "", "rashi": "<b>הן לא הובא וגו'.<\/b> שֶׁאִלּוּ הוּבָא, הָיָה לָכֶם לְשָֹרְפָהּ, כְּמוֹ שֶׁנֶּאֱמַר (ויקרא ו'), וְכָל חַטָּאת אֲשֶׁר יוּבָא מִדָּמָהּ וְגוֹ' (פסחים פ\"ב):<br><br><b>אכל תאכלו אתה.<\/b> הָיָה לָכֶם לְאָכְל
