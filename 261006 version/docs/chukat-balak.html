ע מֵימַר <b>מִן קֳדָם<\/b> אֵל וְחֵזוּ <b>מִן קֳדָם<\/b> שַׁדַּי חָזֵי שְׁכִיב <b>וּמִתְגְּלֵי לֵיהּ<\/b>:", "onk_en": "This is the declaration of one who hears [<b>from before<\/b>] God's utterance, who sees the vision of [<b>from before<\/b>] the Almighty; fallen, with opened eyes [<b>it is apparent to him<\/b>].", "pj": "אֵימַר דִשְׁמַע מֵימַר מִן קֳדָם אֱלָהָא חַיָיא דְחֵיזִיוּ מִן קֳדָם אֵל שַׁדַי הֲוָה חָמֵי וְכַד בָּעֵי דְמִתְגְלֵי לֵיהּ הֲוָה מִשְׁתַּטַח עַל אַנְפּוֹי וְרַזְיָא סְתִימַיָא מָה דְאִתְכַּסֵי מִן נְבִיָא מִתְגְלֵי לֵיהּ", "pj_en": "he hath said who heard the Word from before the living God; who ­beheld the vision before God the Almighty, and, seeking that it might be discovered to him, fell upon his face, and the secret mysteries hidden from the prophets were revealed to him.", "tj": "אֵימַר גַבְרָא דִשְׁמַע מַמְלֵל מִן קֳדָם יְיָ וְדִי חֲזָא מִן קֳדָם שַׁדַי חֲזֵי וְכַד הֲוָה בָּעֵי הֲוָה נִשְׁתַּטַח עַל אַפּוֹי וְרָזֵי נְבוּאֲתָא מִתְגַלִין לֵיהּ וַהֲוָה מִתְנַבֵּי עַל נַפְשֵׁיהּ דְהוּא נָפִיל בְּחַרְבָּא וְסוֹף נְבוּאֲתָא לְמִתְקַיְימָא:", "tj_en": "the man saith who heard the Word from before the Lord, and who saw the vision before the Almighty; when, inquiring, prostrate on his face, the mysteries of prophecy were disclosed to him, and of himself he did prophesy that he shall fall by the sword, a prophecy to be confirmed at the end!", "rashi": "<b>נפל וגלוי עינים.<\/b> פְּשׁוּטוֹ כְתַרְגּוּמוֹ — שֶׁאֵין נִרְאֶה עָלָיו אֶלָּא בַּלַּיְלָה כְּשֶׁהוּא שׁוֹכֵב; וּמִדְרָשׁוֹ: כְּשֶׁהָיָה נִגְלֶה עָלָיו לֹא הָיָה בוֹ כֹּחַ לַעֲמֹד עַל רַגְלָיו וְנוֹפֵל עַל פָּנָיו, לְפִי שֶׁהָיָה עָרֵל, וּמָאוּס לִהְיוֹת נִגְלֶה עָלָיו בְּקוֹמָה זְקוּפָה לְפָנָיו:", "rashi_en": "נפל וגלוי עינים FALLING BUT HAVING HIS EYES OPEN — Its plain sense is as the Targum has it (“lying down when it was revealed to him”), meaning, that God revealed Himself to him only at night when he was lying on his bed. — And a Midrashic explanation of it is: When He revealed Himself to him he had no strength to stand on his feet, and he, therefore, fell on his face — because he was uncircumcised and it was therefore a loathsome thing that He should reveal Himself to him whilst he stood in an erect posture before Him (cf. Tar. Jon. and Rashi on Genesis 17:3)."}, {"ch": 24, "v": 5, "aliyah": 7, "heb": "מַה־טֹּ֥בוּ אֹהָלֶ֖יךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖יךָ יִשְׂרָאֵֽל׃", "onk": "מָא טָבָא <b>אַרְעָךְ<\/b> יַעֲקֹב בֵּית מֵישְׁרָיךְ יִשְׂרָאֵל:", "onk_en": "How goodly are your tents [<b>land<\/b>], Yaakov, your dwelling places, Yisroel.", "pj": "כַּמָה יָאוָון הִינוּן בָּתֵּי מֶדְרָשֵׁיכוֹן בְּמַשְׁכְּנָא דִי שַׁמֵשׁ בְּהוֹן יַעֲקב אֲבוּכוֹן וְכַמָה יָאֵי הוּא מַשְׁכַּן זִמְנָא דִמְיַיצַע בֵּינֵיכוֹן וּמַשְׁכְּנֵיכוֹן דַחֲזוֹר חֲזוֹר לֵיהּ בֵּית יִשְרָאֵל", "pj_en": "How beautiful your houses of instruction, in the tabernacle where Jakob your father ministered; and how beautiful this tabernacle of ordinance which is found among you, and the tents that surround it, O house of Israel!", "tj": "מַה טָבִין הִינוּן מַשְׁכְּנִין דְצַלִי בְהוֹן יַעֲקב אֲבוּהוֹן וּמַשְׁכַּן זִמְנָא דַעֲבַדְתּוּן לִשְׁמִי וּמַשְׁכְּנֵיכוֹן חֲזוֹר חֲזוֹר לְכוֹן דְבֵית יִשְרָאֵל:", "tj_en": "How goodly were the tabernacles in which Jakob their father did pray; and the tabernacle of ordinance which you have made to My name, and your own tabernacles, O house of Israel!", "rashi": "<b>מה טבו אהליך.<\/b> עַל שֶׁרָאָה פִתְחֵיהֶם שֶׁאֵינָן מְכֻוָּנִין זֶה מוּל זֶה:<br><br><b>משכנתיך.<\/b> חֲנִיּוֹתֶיךָ, כְּתַרְגּוּמוֹ; דָּבָר אַחֵר, <b>מה טבו אהליך<\/b> — מַה טֹּבוּ אֹהֶל שִׁילֹה וּבֵית עוֹלָמִים בְּיִשּׁוּבָן, שֶׁמַּקְרִיבִין בָּהֶן קָרְבָּנוֹת לְכַפֵּר עֲלֵיכֶם:<br><br><b>משכנתיך.<\/b> אַף כְּשֶׁהֵן חֲרֵבִין, לְפִי שֶׁהֵן מַשְׁכּוֹן עֲלֵיכֶם, וְחֻרְבָּנָן כַּפָּרָה עַל הַנְּפָשׁוֹת, שֶׁנֶּאֱמַר \"כִּלָּה ה' אֶת חֲמָתוֹ\" (איכה ד'), וּבַמֶּה כִלָּה? (שם) \"וַיַּצֶּת אֵשׁ בְּצִיּוֹן\" (תנחומא משפטים):", "rashi_en": "מה טבו אהליך HOW GOODLY ARE THY TENTS — He said this because he saw that the entrances of their tents were not exactly facing each other (Bava Batra 60a; cf. v. 2). <br><br>משכנתיך means thy encampments, as the Targum has it. — Another explanation — מה טבו אהליך HOW GOODLY ARE THY TENTS — How goodly are the tent of Shiloh and the Temple when these flourished, in that sacrifices were offered therein to atone for you; <br><br>משכנתיך How goodly are they even when they are in ruins, because then they are a pledge (משכון) for you, and the fact that they are in ruins is an atonement for your souls, as it is said. (Lamentations 4:11) “The Lord hath brought His fury to an end”. And by what means hath He brought it to an end? “He hath kindled a fire in Zion! (i.e. hath destroyed the Temple) (cf. Midrash Tanchuma, Mishpatim 11)."}, {"ch": 24, "v": 6, "aliyah": 7, "heb": "כִּנְחָלִ֣ים נִטָּ֔יוּ כְּגַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּאֲהָלִים֙ נָטַ֣ע יְהֹוָ֔ה כַּאֲרָזִ֖ים עֲלֵי־מָֽיִם׃", "onk": "כְּנַחֲלִין <b>דְּמִדַּבְּרִין כְּגִנַּת שַׁקְיָא דְעַל פְּרָת<\/b> כְּבוּסְמַיָּא דִּנְצִיב יְיָ כְּאַרְזִין <b>דִּנְצִיבִין<\/b> עַל מַיָּא:", "onk_en": "They stretch forth like streams, like gardens by the river [<b>flowing like irrigated gardens near Peras<\/b>], like the aloe trees that Adonoy has planted; like cedar trees [<b>standing<\/b>] by the water.", "pj": "כְּנַחְלִין דְמַיָין דְמִתְגַבְּרִין כֵּן הִינוּן בְּנֵי יִשְרָאֵל יַתְבִין עִדְרִין עִדְרִין מִתְגַבְּרִין בְּאוּלְפַן אוֹרַיְיתָא וְהֵי כְּגַנִין שְׁתִילִין עַל פְּרַקְטוֹנֵי נַהֲרִין כֵּן הִינוּן תַּלְמִידֵיהוֹן חֲבוּרַן חֲבוּרַן בְּבֵית מֶדְרָשֵׁיהוֹן זִיו אַפֵּיהוֹן יַנְהַר כְּזִיו רְקִיעִין דִי בְרָא יְיָ בְּיוֹם תִּנְיַין לִבְּרִיאַת עַלְמָא וּמַתְחִינוּן לִיקַר שְׁכִינְתָּא רַמְיַין וּמְנַטְלִין עַל כָּל אוּמַיָא כַּאֲרָזַיָא דְלִיבְנוֹם דִשְׁתִילִין עַל מַבּוּעֵי מַיָין", "pj_en": "As tides of waters, so are the house of Israel, dwelling like flocks made strong by the doctrine of the law; and as gardens planted by the flowing streams, so are their disciples in the fellowships of their schools. The light of their faces shineth as the brightness of the firmament which the Lord created on the second day of the creation of the world, and outspread for the glory of the Shekinah. They are exalted and lifted up above all the nations, like cedars of Lebanon planted by fountains of waters.", "tj": "כְּנַחֲלִין מִתְגַבְּרִין כֵּן יֶהֱוְיָן יִשְרָאֵל מִתְגַבְּרִין עַל בַּעֲלֵי דְבָבֵיהוֹן וּכְגַנִין שְׁתִילִין עַל מַבּוּעִין דְמַיָין כֵּן יְהוֹן קִרְיַיתְהוֹן סָפְקַן סַפְרִין וּמַלְפֵי אוֹרַיְיתָא וְהֵיךְ שְׁמַיָא דִמְתַח מֵימְרָא דַיְיָ לְבֵית שְׁכִינָה לֵיהּ כֵּן יֶהֱוְיָן יִשְרָאֵל חַיִין וְקַיְימִין עַד לַעֲלַם יָאִין וּמְשַׁבְּחִין כַּאֲרָזַיָא דְמַיִין וּמְנַטְלִין בִּכְרָיוּתֵיהּ:", "tj_en": "As torrents that prevail, so shall Israel overpower their adversaries; and as gardens planted by fountains of water, so shall be their cities, giving forth scribes and teachers of the law; and as the heavens which the Memra of the Lord spread forth for the dwelling of His Shekinah, so shall Israel live, and endure unto eternity, beautiful and renowned as cedars by the waters which grow up oil high.", "rashi": "<b>כנחלים נטיו.<\/b> שֶׁנֶּאֶרְכוּ וְנִמְשְׁכוּ לִנְטוֹת לְמֵרָחוֹק; אָמְרוּ רַבּוֹתֵינוּ מִבִּרְכוֹתָיו שֶׁל אוֹתוֹ רָשָׁע אָנוּ לְמֵדִים מֶה הָיָה בְלִבּוֹ לְקַלְּלָם כְּשֶׁאָמַר לְהָשִׁית אֶל הַמִּדְבָּר פָּנָיו, וּכְשֶׁהָפַךְ הַמָּקוֹם אֶת פִּיו, בֵּרְכָם מֵעֵין אוֹתָם קְלָלוֹת שֶׁבִּקֵּשׁ לוֹמַר כו', כִּדְאִיתָא בְחֵלֶק (סנהדרין ק\"ה ב):<br><br><b>כאהלים.<\/b> כְּתַרְגּוּמוֹ, לְשׁוֹן \"מֹר וַאֲהָלוֹת\" (תהלים מ\"ה):<br><br><b>נטע ה'.<\/b> בְּגַן עֵדֶן; לָשׁוֹן אַחֵר <b>כאהלים נטע ה'<\/b> — כַּשָּׁמַיִם הַמְּתוּחִין כְּאֹהֶל:<br><br><b>נטע ה'.<\/b> לְשׁוֹן נְטִיעָה מָצִינוּ בְאֹהָלִים, שֶׁנֶּאֱמַר \"וְיִטַּע אָהֳלֵי אַפַּדְנוֹ\" (דניאל י\"א):", "rashi_en": "כנחלים נטיו AS THE BROOKS THAT WIND — which lengthen and draw themselves out so that they extend (נטיו) into the distance. — Our Rabbis said: From the blessings uttered by that wicked man we may learn what was in his heart as regards cursing them, when he thought to set his face towards the wilderness (cf. v. 1). When the Omnipresent turned the words of his mouth he uttered blessings corresponding to the contents of those curses which he had wished to pronounce as it is related in the chapter beginning with the word חלק Sanhedrin 105b.<br><br>כאהלים — Understand this as the Targum does (“as aromatic plants”), — taking it in the same meaning as in (Psalms 45:9) “Myrrh and aloes (אהלים). <br><br>נטע ה' (LIKE THE ALOES] WHICH THE LORD HATH PLANTED in the Garden of Eden. - Another explanation: כאהלים נטע ה׳ LIKE TENTS WHICH THE LORD HATH PLANTED — i.e., like the heavens which are stretched forth as a tent (cf. Isaiah 40:22: וימתחם כאהל לשבת).<br><br>נטע ה׳ [LIKE TENTS] WHICH THE LORD HAS PLANTED — We can speak of planting a tent for we find the expression “planting” in connection with tents, as it is said, (Daniel 11:45) “And he shall plant (ויטע) the tents of his palace”."}, {"ch": 24, "v": 7, "aliyah": 7, "heb": "יִֽזַּל־מַ֙יִם֙ מִדָּ֣לְיָ֔ו וְזַרְע֖וֹ בְּמַ֣יִם רַבִּ֑ים וְיָרֹ֤ם מֵֽאֲגַג֙ מַלְכּ֔וֹ וְתִנַּשֵּׂ֖א מַלְכֻתֽוֹ׃", "onk": "<b>יִסְגֵּי מַלְכָּא דְּיִתְרַבָּא מִבְּנוֹהִי וְיִשְׁלוֹט בְּעַמְמִין סַגִּיאִין<\/b> וְיִתְקוֹף מֵאֲגַג מַלְכֵּיהּ וְתִתְנְטֵל מַלְכוּתֵיהּ:", "onk_en": "Water flows out from his buckets, and his seed will have an abundant flow [<b>the anointed king shall grow and rule over many nations<\/b>]; his king will be greater than Agag and his monarchy shall be uplifted.", "pj": "יְקוּם מִנְהוֹן מַלְכֵיהוֹן וּפְרוֹקְהוֹן מִנְהוֹן וּבְהוֹן יֶהֱוֵי וְזַרְעֲיַיתְהוֹן בְּנוֹי דְיַעֲקב יִשְׁלְטוּן בְּעַמְמִין סַגִיאִין קַמָאָה דְיִמְלוֹךְ עֲלֵיהוֹן יַגִיחַ קְרָבָא בִּדְבֵית עֲמָלֵק וְיִתְרוֹמָם עַל אֲגַג מַלְכֵיהוֹן וּבְגִין דְיֵיחוֹס עֲלוֹי יִתְנְטֵיל מִנֵיהּ מַלְכוּתֵיהּ", "pj_en": "From them their King shall arise, and their Redeemer be of them and among them, and the seed of the children of Jakob shall rule over many nations. The first who will reign over them will make war with the house of Amalek, and will be exalted above Agag their king; but because he had spared him his kingdom will be taken from him.", "tj": "יְקוּם מַלְכֵיהוֹן לִבְנֵיהוֹן וּפְרוֹקֵיהוֹן מִנְהוֹן וּבְהוֹן יֶהֱוֵי וְיֶהֱוֵי מַכְנַשׁ לְהוֹן גְלוּתְהוֹן מִן מְדִינְתָּא בַּעֲלֵי דְבָבֵיהוֹן וּבְנֵיהוֹן יִשְׁלְטוּן בְּאוּמַיָא וּתְקֵיף מִן שָׁאוּל דִי חַס עַל אֲגַג מַלְכֵיהוֹן דַעֲמַלְקָאָה וְתִתְדְרַב מַלְכוּתֵיהּ דְמַלְכָּא מְשִׁיחָא:", "tj_en": "Their King will arise from among their children, and their Redeemer will be of them and among them; and He will gather their captives from the cities of their adversaries, and their children shall have rule among the peoples. And the kingdom of the King Meshiha shall be made great: stronger is He than Shaul who vanquished Agag the king of the Amalkaab.", "rashi": "<b>מדליו.<\/b> מִבְּאֵרוֹתָיו, וּפֵרוּשׁוֹ כְּתַרְגּוּמוֹ:<br><br><b>וזרעו במים רבים.<\/b> לְשׁוֹן הַצְלָחָה הוּא זֶה — כְּזֶרַע הַזָּרוּעַ עַל פְּנֵי הַמַּיִם:<br><br><b>וירם מאגג מלכו.<\/b> מֶלֶךְ רִאשׁוֹן שֶׁלָּהֶם יִכְבֹּשׁ אֶת אֲגַג מֶלֶךְ עֲמָלֵק:<br><br><b>ותנשא מלכתו.<\/b> שֶׁל יַעֲקֹב יוֹתֵר וְיוֹתֵר, שֶׁיָּבֹא אַחֲרָיו דָּוִד וּשְׁלֹמֹה:", "rashi_en": "מדליו means OUT OF HIS SPRINGS, and its explanation is as given in the Targum (“The king appointed from amongst his sons shall be great”).<br><br>וזרעו במים רבים AND HIS SEED SHALL BE IN MANY WATERS — This is an expression denoting prosperity — he shall be as seed which is sown upon well-watered soil.<br><br>וירם מאגג מלכו AND HIS KING SHALL BE HIGHER THAN AGAG — Their first king will conquer Agag king of the Amalakites.<br><br>ותנשא מלכתו AND HIS KINGDOM SHALL BE EXALTED — i.e. the kingdom of Jacob (the Israelitish people) shall be exalted more and more, because the powerful monarchs David and Solomon will succeed him (their first king)."}, {"ch": 24, "v": 8, "aliyah": 7, "heb": "אֵ֚ל מוֹצִיא֣וֹ מִמִּצְרַ֔יִם כְּתוֹעֲפֹ֥ת רְאֵ֖ם ל֑וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗יו וְעַצְמֹתֵיהֶ֛ם יְגָרֵ֖ם וְחִצָּ֥יו יִמְחָֽץ׃", "onk": "אֱלָהָא דְּאַפֵּקִנּוּן מִמִּצְרַיִם <b>תָּקְפָּא וְרוּמָא דִּילֵיהּ יֵיכְלוּן בְּנֵי יִשְׂרָאֵל נִכְסֵי עַמְמַיָּא סַנְאֵיהוֹן וּבְבִזַּת מַלְכֵּיהוֹן יִתְפַּנְּקוּן וְאַרְעַתְהוֹן יַחְסְנוּן<\/b>:", "onk_en": "God Who has brought him out of Egypt, has shown His great strength to him [<b>might and loftiness is His<\/b>]; He will consume His enemy nations, crushing their bones and dip His arrows [in their blood] [<b>Bnei Yisroel will eat from the wealth of the nations—their enemies, and will enjoy the spoils of their kings, and will inhabit their land<\/b>].", "pj": "אֱלָהָא דְאַפֵּיקִינוּן פְּרִיקִין מִמִצְרַיִם תּוּקְפָא וְרוֹמָא תּוּשְׁבַּחְתָּא גְבוּרְתָּא דִילֵיהּ יְשֵׁיצֵי יַת אוּמַיָא בַּעֲלֵי דְבָבֵיהוֹן וְתוּקְפְהוֹן יִתְבַּר וְגִירֵי מְחַוַות פּוּרְעָנוּתֵיהּ יְגָרֵי בְהוֹן וִישֵׁיצוּנוּן", "pj_en": "Unto Eloha, who brought them out free from Mizraim, belong might, and exaltation, and glory, and power. He will destroy the nations of their adversaries, and break down their strength and will send forth the plague-arrows of His vengeance among them, and destroy them.", "tj": "אֱלָהָא דִפְרַק וְאַפֵּיק יַתְהוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם תּוּקְפָא וְתוּשְׁבָּחָא וְרוֹמְמוּתָא דִידֵיהּ יָכְלִין בְּנֵי יִשְרָאֵל עַל בַּעֲלֵי דְבָבֵיהוֹן וְקוּרְיַיתְהוֹן יִפְלְגוּן וְגִבָּרֵיהוֹן יִקְטְלוּן וּמוֹתָרֵיהוֹן יִפְלְגוּן:", "tj_en": "Unto God who redeemed, and brought them out free from the land of Mizraim, belong power, and praise, and exaltation. The sons of Israel will prevail over their enemies, will divide their cities, slay their heroes, and disperse their residue.", "rashi": "<b>אל מוציאו ממצרים.<\/b> מִי גוֹרֵם לָהֶם הַגְּדֻלָּה הַזֹּאת? אֵל הַמּוֹצִיאָם מִמִּצְרַיִם בְּתֹקֶף וְרוּם שֶׁלּוֹ, יֹאכַל אֶת הַגּוֹיִם שֶׁהֵם צָרָיו:<br><br><b>ועצמתיהם.<\/b> שֶׁל צָרִים:<br><br><b>יגרם.<\/b> מְנַחֵם פָּתַר בּוֹ לְשׁוֹן שְׁבִירָה, וְכֵן \"לֹא גָרְמוּ לַבֹּקֶר\" (צפניה ג'), וְכֵן \"וְאֶת חֲרָשֶׂיהָ תְּגָרֵמִי\" (יחזקאל כ\"ג), וַאֲנִי אוֹמֵר לְשׁוֹן עֶצֶם הוּא, שֶׁמְּגָרֵר הַבָּשָׂר בְּשִׁנָּיו מִסָּבִיב, וְהַמֹּחַ שֶׁבִּפְנִים, וּמַעֲמִיד הָעֶצֶם עַל עַרְמִימוּתוֹ:<br><br><b>וחציו ימחץ.<\/b> אֻנְקְלוֹס תִּרְגֵּם חֶצְיוֹ שֶׁל צָרִים — חֲלֻקָּה שֶׁלָּהֶם, כְּמוֹ (בראשית מ\"ט) \"בַּעֲלֵי חִצִּים\" — מָרֵי פַּלְגּוּתָא, וְכֵן יִמְחָץ לְשׁוֹן \"וּמָחֲצָה וְחָלְפָה רַקָּתוֹ\" (שופטים ה') — שֶׁיֶחֱצוּ אֶת אַרְצָם. וְיֵשׁ לִפְתֹּר לְשׁוֹן חִצִּים מַמָּשׁ — חִצָּיו שֶׁל הַקָּבָּ\"ה יִמְחַץ בְּדָמָם שֶׁל צָרִים, יִטְבֹּל וְיִצְטַבַּע בְּדָמָם, כְּמוֹ \"לְמַעַן תִּמְחַץ רַגְלְךָ בְּדָם\" (תהלים ס\"ח), וְאֵינוֹ זָז מִלָּשׁוֹן מַכָּה, כְּמוֹ \"מָחַצְתִּי\" (דברים ל\"ב), שֶׁהַצָּבוּעַ בְּדָם נִרְאֶה כְּאִלּוּ מָחוּץ וְנָגוּעַ:", "rashi_en": "אל מוציאו ממצרים GOD WHO BROUGHT THEM OUT OF EGYPT — Who was the cause of all this greatness? God who brought them out from Egypt; by his strength and his sublimity HE EATS UP (יאכל) THE NATIONS (גוים) who are (צריו) HIS ADVERSARIES.<br><br>ועצמתיהם AND THEIR BONES — those of the adversaries.<br><br>יגרם — Menachem ben Seruk explained it in the sense of “breaking to pieces”, similar to, (Zephaniah 3:3) “who have not broken to pieces (גרמו) in the morning”, and similar to, (Ezekiel 23:34) “and thou shalt crunch (תגרמי) the sherds thereof”. I, however, say that it has the meaning of “bone” (גרם in Aramaic corresponds to Hebrew עצם) — it means that one pulls away the flesh with his teeth from around the bone, and the marrow from inside, and brings the bone into its original bare condition (i.e., as it was before flesh grew upon it).<br><br>וחציו ימחץ AND PIERCE THEM THROUGH WITH HIS ARROWS — Onkelos translated this as meaning, the חצים of the adversaries, taking it in the sense of “their postion of land”, similar to (Genesis 44:23) בעלי חצים, which he translated by מרי פלנותא “those who part (differ) from him”. So, too, according to the Targum ימחץ denotes “dividing” having the same meaning as in (Judges 5:26): “She divided (מחצה) and struck through his temples”. The meaning therefore is, that they will divide amongst themselves their (the adversaries’) land (Hence the translation of Onkelos: “they shall take possession of their land”). — But it can also be explained as meaning חצים literally (i.e., arrows): the arrows of the Holy One, blessed be He, He will ימחץ in the blood of the adversaries — i.e., he will dip and thus dye the arrows in their blood. Similar is, (Psalms 68:24) “In order that thou mayest colour thy foot (תמחץ) by the blood”. However, even in this sense it does not lose the usual meaning of “wounding”, as in (Deuteronomy 32:39): “I wound (מחצתי)”, for what is dyed by blood, looks as though it were wounded and stricken."}, {"ch": 24, "v": 9, "aliyah": 7, "heb": "כָּרַ֨ע שָׁכַ֧ב כַּאֲרִ֛י וּכְלָבִ֖יא מִ֣י יְקִימֶ֑נּוּ מְבָרְכֶ֣יךָ בָר֔וּךְ וְאֹרְרֶ֖יךָ אָרֽוּר׃", "onk": "<b>יְנוּחַ יִשְׁרֵי בִתְקוֹף<\/b> כְּאַרְיָא וּכְלֵיתָא <b>לֵית מַלְכוּ דִתְזַעְזְעִינֵיהּ<\/b> בְּרִיכָךְ יְהוֹן בְּרִיכִין וְלִיטָיךְ יְהוֹן לִיטִין:", "onk_en": "He crouches and lies [<b>rests and dwells with might<\/b>] like a lion, and, being a lion, who would dare rouse him? [<b>No kingdom can cause him fear.<\/b>] those who bless you are blessed, and those who curse you are cursed.”", "pj": "נַיְיחִין וְשַׁרְיַין כְּאַרְיָא וּכְלֵיתָא דְכַד דָמִיךְ מַאן יְקִימִינֵיהּ מְבָרְכְהוֹן יְהוֹן בְּרִיכִין כְּמשֶׁה נְבִייָא סַפְרֵיהוֹן דְיִשְרָאֵל וּמְלַטְטִינוּן יְהוֹן לִיטִין כְּבִלְעָם בַּר בְּעוֹר", "pj_en": "They shall repose and dwell as a lion, and as an old lion, that sleeping who will (dare to) awake? They who bless them are blessed, as Mosheh the prophet, the scribe of Israel; and they who curse them are accursed, as Bileam son of Beor.", "tj": "הָא עַמָא הָאִלֵין כְּאַרְיָא שַׁרְיָן וּכְאַרְיוּתָא מִתְגַבְּרִין מַאן דְבָרֵךְ יַתְכוֹן יִשְרָאֵל יֶהֱוֵי מְבוֹרָךְ כְּמשֶׁה נְבִיָא סַפְרֵיהוֹן דְיִשְרָאֵל וּמַאן דְלַיִיט יַתְכוֹן יֶהֱוֵי לוּט כְּבִלְעָם בַּר בְּעוֹר:", "tj_en": "Behold, these people will dwell as a lion, and be as the strong lions. He who blesseth you, O Israel, shall be blessed, as Mosheh the prophet, the scribe of Israel; and he who curseth you will be accursed, as Bileam, the son of Beor.", "rashi": "<b>כרע שכב כארי.<\/b> כְּתַרְגּוּמוֹ — יִתְיַשְּׁבוּ בְאַרְצָם בְּכֹחַ וּגְבוּרָה:", "rashi_en": "כרע שכב כארי HE CROUCHED, HE LAY DOWN AS A LION — Understand this as the Targum does (“He will have rest, he will dwell in strength like a lion”), meaning, they will be settled in their land in strength and might."}, {"ch": 24, "v": 10, "aliyah": 7, "heb": "וַיִּֽחַר־אַ֤ף בָּלָק֙ אֶל־בִּלְעָ֔ם וַיִּסְפֹּ֖ק אֶת־כַּפָּ֑יו וַיֹּ֨אמֶר בָּלָ֜ק אֶל־בִּלְעָ֗ם לָקֹ֤ב אֹֽיְבַי֙ קְרָאתִ֔יךָ וְהִנֵּה֙ בֵּרַ֣כְתָּ בָרֵ֔ךְ זֶ֖ה שָׁלֹ֥שׁ פְּעָמִֽים׃", "onk": "וּתְקֵף רוּגְזָא דְבָלָק בְּבִלְעָם וּשְׁקָפִנּוּן לִידוֹהִי וַאֲמַר בָּלָק לְבִלְעָם לְמֵילַט סַנְאַי קְרִיתָךְ וְהָא בָּרָכָא מְבָרְכַת לְהוֹן דְּנַן תְּלַת זִמְנִין:", "onk_en": "Balak became enraged at Bil’am and clapped his hands together; Balak then said to Bil’am: “I called you to curse my enemies, but you have blessed them these three times.", "pj": "וּתְקֵיף רוּגְזָא דְבָלָק בְּבִלְעָם וְטָפַח יַת יְדוֹי וַאֲמַר בָּלָק לְבִלְעָם לְמֵילַט סַנְאַי דְבַרְתִּיךְ וְהָא בְּרָכָא מְבָרְכַת לְהוֹן דְנַן תְּלַת זִמְנִין", "pj_en": "And Balak's wrath grew strong against Bileam, and, smiting his hands, Balak said to Bileam, I brought thee to curse my enemies, and, behold, in blessing thou hast blessed them these three times.", "tj": "וּתְקֵיף רוּגְזָא דְבָלָק עַל בִּלְעָם וְטָפַח בְּכַף יְדוֹי וַאֲמַר בָּלָק לְבִלְעָם לְמֵילַט שַנְאַי דְבָרִית יָתָךְ וּלְחוֹד מְבָרְכַתְּ:", "tj_en": "And Balak's anger grew strong against Bileam, and Balak smote his hands, and said to Bileam, I brought thee to curse my enemies, and thou hast only blessed.", "rashi": "<b>ויספק.<\/b> הִכָּה זוֹ עַל זוֹ:", "rashi_en": "ויספק means he clapped one hand upon the other."}, {"ch": 24, "v": 11, "aliyah": 7, "heb": "וְעַתָּ֖ה בְּרַח־לְךָ֣ אֶל־מְקוֹמֶ֑ךָ אָמַ֙רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְךָ֔ וְהִנֵּ֛ה מְנָעֲךָ֥ יְהֹוָ֖ה מִכָּבֽוֹד׃", "onk": "וּכְעַן <b>אֵזִיל<\/b> לָךְ לְאַתְרָךְ אֲמָרִית יְקָרָא אֲיַקְּרִנָּךְ וְהָא מְנָעָךְ יְיָ מִן יְקָר:", "onk_en": "Now, hurry [<b>go<\/b>] back home! I said I would exceedingly honor you, but Adonoy has held you back from honor.”", "pj": "וּכְדוֹן עֲרוֹק לָךְ לְאַתְרָךְ אֲמָרִית מְיַקְרָא אֲיַקְרִינָךְ וְהָא מְנַע יְיָ לְבִלְעָם מִן יְקָרָא", "pj_en": "And now flee to thy place. I had said that honouring I would honour thee; but, behold, the Lord hath kept back Bileam from honour.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 12, "aliyah": 7, "heb": "וַיֹּ֥אמֶר בִּלְעָ֖ם אֶל־בָּלָ֑ק הֲלֹ֗א גַּ֧ם אֶל־מַלְאָכֶ֛יךָ אֲשֶׁר־שָׁלַ֥חְתָּ אֵלַ֖י דִּבַּ֥רְתִּי לֵאמֹֽר׃", "onk": "וַאֲמַר בִּלְעָם לְבָלָק הֲלָא אַף לְאִזְגַדָּיךְ דִּי שַׁלְּחַת לְוָתִי מַלֵּלִית לְמֵימָר:", "onk_en": "Bil’am said to Balak: “Even to your emissaries whom you sent to me I said:", "pj": "וַאֲמַר בִּלְעָם לְבָלָק הֲלָא עִם אִזְגַדִין דְשָׁדַרְתְּ לְוָתִי מַלֵלִית לְמֵימָר", "pj_en": "But Bileam said to Balak, Did I not tell thy messengers whom thou sentest to me, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 13, "aliyah": 7, "heb": "אִם־יִתֶּן־לִ֨י בָלָ֜ק מְלֹ֣א בֵיתוֹ֮ כֶּ֣סֶף וְזָהָב֒ לֹ֣א אוּכַ֗ל לַעֲבֹר֙ אֶת־פִּ֣י יְהֹוָ֔ה לַעֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִלִּבִּ֑י אֲשֶׁר־יְדַבֵּ֥ר יְהֹוָ֖ה אֹת֥וֹ אֲדַבֵּֽר׃", "onk": "אִם יִתֶּן לִי בָלָק מְלֵי בֵיתֵיהּ כְּסַף וּדְהַב לֵית <b>לִי רְשׁוּ<\/b> לְמֶעְבַּר עַל <b>גְּזֵרַת מֵימְרָא<\/b> דַיְיָ לְמֶעְבַּד טַבְתָא אוֹ בִישְׁתָא <b>מֵרְעוּתִי<\/b> דִּימַלֵּל יְיָ יָתֵיהּ אֲמַלֵּל:", "onk_en": "‘Even if Balak would give me his house full of silver and gold, I cannot transgress the word of Adonoy to do good or evil [<b>from<\/b>] on my own [<b>will<\/b>];’ only what Adonoy declares will I speak.", "pj": "אִם יִתֵּן לִי בָלָק מִן יְקָרָא מְלא קוּרְטוֹר דִילֵיהּ כְּסַף וּדְהַב לֵית לִי רְשׁוּ לְמֶעֱבַר עַל גְזֵירֵת מֵימַר דַיְיָ לְמֶעֱבַד טַבְתָא אוֹ בִישְׁתָא מִן רְעוּתִי מַה דִי מַלֵיל יְיָ יָתֵיהּ אֲמַלֵיל", "pj_en": "If Balak would give me the fulness of his treasures of silver and gold, I have no power to transgress the decree of the Word of the Lord to do good or evil of my own will: what the Lord saith shall I not speak.", "tj": "", "tj_en": "", "rashi": "<b>לעבר את פי ה'.<\/b> כָּאן לֹא נֶאֱמַר \"אֱלֹהַי\" כְּמוֹ שֶׁנֶּאֱמַר בָּרִאשׁוֹנָה (כ\"ב י\"ח), לְפִי שֶׁיָּדַע שֶׁנִּבְאַשׁ בְּהַקָּבָּ\"ה וְנִטְרַד:", "rashi_en": "לעבר את פי ה׳ [I AM UNABLE] TO GO BEYOND THE WORD OF THE LORD — Here it does not say “[the Lord] my God”, as it is said at first (Numbers 22:18), because he had now become conscious that he was regarded by the Holy One, blessed be He, as something vile and banished from His presence."}, {"ch": 24, "v": 14, "aliyah": 7, "heb": "וְעַתָּ֕ה הִנְנִ֥י הוֹלֵ֖ךְ לְעַמִּ֑י לְכָה֙ אִיעָ֣צְךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָעָ֥ם הַזֶּ֛ה לְעַמְּךָ֖ בְּאַחֲרִ֥ית הַיָּמִֽים׃", "onk": "וּכְעַן הָא אֲנָא אָזֵל לְעַמִּי אִיתָא אֲמַלְכִינָךְ <b>מָא דְתַעְבֵּד<\/b> וַאֲחַוֵּי לָךְ מָא דְיַעְבֵּד עַמָּא הָדֵין לְעַמָּךְ בְּסוֹף יוֹמַיָּא:", "onk_en": "And now that I am returning to my people, come, I will advise you [<b>what you should do and I will show you<\/b>] what this people will do to your people in the end of days.”", "pj": "וּכְדוֹן הָאֲנָא מִתְפְנֵי וְאָזִיל לְעַמִי אִיתָא אֵימְלְכִינָךְ אִיזַל זַמִין פּוּנְדְקִין וּמַנֵי בְּהוֹן נְשַׁיָיא מַטְעֲיָיתָא זַבִּין מֵיכְלָא וּמִשְׁתַּיָיא בְּבָצִיר מִן טִימְהוֹן וְיֵיתוּן עַמָא הָדֵין וְיֵיכְלוּן וְיִשְׁתּוּן וִירַווּן וִישַׁמְשׁוּן עִמְהוֹן וִיכַפְרוּן בֶּאֱלָהָהוֹן וְיִתְמַסְרוּן בִּידָךְ בְּשָׁעָה קְּלִילָא וְיִפְּלוּן מִנְהוֹן סַגִיאִין בְּרַם בָּתַר כְּדֵין עֲתִידִין הִינוּן דְיִשְׁלְטוּן בְּעַמָךְ בְּסוֹף עֲקַב יוֹמַיָא", "pj_en": "And now, behold, I return to go to my people. Come, I will give thee counsel: Go, furnish tavern houses, and employ seductive women to sell food and drinks cheaply, and to bring this people together to eat and drink, and commit whoredom with them, that they may deny their God; then in a brief time will they be delivered into thy hand, and many of them fall. Nevertheless, after this they will still have dominion over thy people at the end of the days.", "tj": "וּכְדוֹ הָא אֲנָא אָזֵיל לְוַת עַמִי אִיתָא כְעַן אָעוּץ יָתָךְ עֵצָה דִי תַעֲבֵיד בְּעַמָא הָאִילֵן חָטֵי יַתְהוֹן וְאִין לָא לֵית אַתְּ שַׁלִיט בְּעַמָא הָאִילֵין בְּרַם עֲתִידִין הִינוּן עַמָא הָאִילֵין מִשְׁלוֹט בְּעַמָךְ בְּסוֹף עֲקַב יוֹמַיָא:", "tj_en": "And now, behold, I go to my people. Come now, I will counsel thee how thou art to act with this people. Lead them into sin; for else thou canst have power against them to prevail over thy people at the end of the days.", "rashi": "<b>הולך לעמי.<\/b> מֵעַתָּה הֲרֵינִי כִשְׁאָר עַמִּי, שֶׁנִּסְתַּלֵּק הַקָּבָּ\"ה מֵעָלָיו:<br><br><b>לכה איעצך.<\/b> מַה לְּךָ לַעֲשׂוֹת, וּמַה הִיא הָעֵצָה? אֱלֹהֵיהֶם שֶׁל אֵלּוּ שׂוֹנֵא זִמָּה הוּא כו', כִּדְאִיתָא בְחֵלֶק (סנהדרין ק\"ו); תֵּדַע שֶׁבִּלְעָם הִשִּׂיא עֵצָה זוֹ לְהַכְשִׁילָם בְּזִמָּה, שֶׁהֲרֵי נֶאֱמַר \"הֵן הֵנָּה הָיוּ לִבְנֵי יִשְׂרָאֵל בִּדְבַר בִּלְעָם\" (במדבר ל\"א):<br><br><b>אשר יעשה העם הזה לעמך.<\/b> מִקְרָא קָצָר הוּא זֶה: אִיעָצְךָ לְהַכְשִׁילָם וְאֹמַר לְךָ מַה שֶּׁהֵן עֲתִידִין לְהָרַע לְמוֹאָב בְּאַחֲרִית הַיָּמִים — \"וּמָחַץ פַּאֲתֵי מוֹאָב\"; הַתַּרְגּוּם מְפָרֵשׁ קֹצֶר הָעִבְרִי:", "rashi_en": "הולך לעמי [AND NOW, BEHOLD, I] GO TO MY PEOPLE — “From now on, behold, I am like the rest of my people”. He said this because he knew that the Holy One, blessed be He, had departed from him.<br><br>לך איעצך COME AND I WILL COUNSEL THEE what you have to do. And what is the counsel? The God of these people hates unchastity, therefore tempt them to sin by means of thy women-folk, as is related in the chapter חלק (Sanhedrin 106a) — You can know that it was Balaam who gave this counsel, to make them fall by the sin of unchastity, for it is stated, of the women of Midian (Numbers 31:16), “Behold, these were an enticement to the children of Israel through the word of Balaam”.<br><br>אשר יעשה העם הזה לעמך WHAT THIS PEOPLE SHALL DO TO THY PEOPLE — This is an elliptical verse, the meaning being: I will give thee counsel how to make them fall into sin, and I also will tell thee what evil they will once do to thy people Moab in later days: viz., (v. 17) “they will pierce the corners of Moab”. — The Targum explains at length what is implied by the terseness of the Hebrew text (“Come I will give thee counsel what thou shouldst do and I will show thee what this people etc.\")"}, {"ch": 24, "v": 15, "aliyah": 7, "heb": "וַיִּשָּׂ֥א מְשָׁל֖וֹ וַיֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣וֹ בְעֹ֔ר וּנְאֻ֥ם הַגֶּ֖בֶר שְׁתֻ֥ם הָעָֽיִן׃", "onk": "וּנְטַל מַתְלֵיהּ וַאֲמַר אֵמַר בִּלְעָם בְּרֵיהּ בְּעוֹר וְאֵמַר גַּבְרָא <b>דְּשַׁפִּיר חָזֵי<\/b>:", "onk_en": "He set forth his parable, and said: “This is the declaration of Bil’am the son of Beor, the declaration of the man, of the open-sockered eye [<b>sees well<\/b>].", "pj": "וּנְטַל מְתַל נְבוּתֵיהּ וַאֲמַר אֵימַר בִּלְעָם בַּר בְּעוֹר וְאֵימַר גַבְרָא דְיַקִיר מִן אָבוֹי דְרַזְיָא סְתִימַיָא מַה דְאִתְכַּסֵי מִן נְבִיָיא הֲוָה מִתְגְלֵי לֵיהּ", "pj_en": "And he took up the parable of his prophecy, and said Bileam the son of Beor speaketh; the man speaketh who is more honourable than his father, because the mysteries hidden from prophets have been revealed to him;", "tj": "וּנְטַל בִּמְתַל נְבִיוּתֵיהּ וַאֲמַר אָמַר בִּלְעָם בַּר בְּעוֹר וַאֲמַר גַבְרָא דְיַקִיר מִן אָבוֹי מַה דְאִתְכַּסֵי מִן כָּל נְבִיָא אִתְגְלֵי עֲלוֹי:", "tj_en": "And he took up the parable of his prophecy, and said: Bileam the son of Beor saith; the man who is more honourable than his father saith, for what hath been hid from all the prophets is revealed unto me:", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 16, "aliyah": 7, "heb": "נְאֻ֗ם שֹׁמֵ֙עַ֙ אִמְרֵי־אֵ֔ל וְיֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּגְל֥וּי עֵינָֽיִם׃", "onk": "אֵמַר דִּשְׁמַע מֵימַר מִן <b>קֳדָם<\/b> אֵל וִידַע מַדַּע מִן <b>קֳדָם<\/b> עִלָּאָה חֵזוּ מִן קֳדָם שַׁדַּי חָזֵי שְׁכִיב <b>וּמִתְגְּלֵי לֵיהּ<\/b>:", "onk_en": "This is the declaration of one who hears God's utterances and knows the thoughts of the Most Exalted; who sees the vision of the Almighty; fallen, with opened eyes [<b>and is apparent to him<\/b>].", "pj": "אֵימַר דְשָׁמַע מֵימַר מִן קֳדָם אֱלָהָא וִידַע שַׁעְתָּא דְרָתַח בֵּיהּ אֱלָהָא עִלָאָה דְחֵיזוּ מִן קֳדָם שַׁדַי חָמֵי וְכַד הֲוָה בָּעֵי דְיִתְגְלֵי לֵיהּ הֲוָה מִשְׁתַּטַח וּנְפַל עַל אַפּוֹי וְרַזְיָא סְתִימַיָא מַה דְאִתְכַּסֵי מִן נְבִיָא הֲוָה מִתְגְלֵי לֵיהּ", "pj_en": "he speaketh who heard the Word from before the Lord, and who knoweth the hour when the Most High God will be wroth with him; (he speaketh) who saw the vision before the Almighty, seeking, prostrate on his face, that it should be revealed to him; the secret, concealed from the prophets, was disclosed unto him.", "tj": "אָמַר גַבְרָא דִשְׁמַע מַמְלַל מִן קֳדָם יְיָ וִידַע דֵעָה מִן קֳדָם עִילַוֵיהּ דַחֲזֵי מִן קֳדָם שַׁדַי הֲוָה חָזֵי וְכַד הֲוָה בָּעֵי הֲוָה מִשְׁתַּטַח עַל אַפּוֹי וְרָזֵי נְבוּאֲתָא מִתְגַלְיָין לֵיהּ וַהֲוָה מִתְנַבֵּא עַל נַפְשֵׁיהּ דְהוּא נָפִיל בְּחַרְבָּא וְסוֹף נְבִיוּתֵיהּ לְמִתְקַיְימָא:", "tj_en": "the man speaketh who heard the Word from before the Lord, and learned knowledge from the Most High; who saw the vision in the presence of the Almighty, seeking prostrate on his face, when the visions of prophecy were disclosed to him, and he was made to foreknow of himself that he will fall by the sword, but that his prophecy will be confirmed.", "rashi": "<b>וידע דעת עליון.<\/b> לְכַוֵּן הַשָּׁעָה שֶׁכּוֹעֵס בָּהּ (סנהדרין ק\"ה):", "rashi_en": "וידע דעת עליון WHO KNOWETH THE MIND OF THE MOST HIGH — i.e., who knoweth to determine the precise moment when He is angry. (The meaning of the text is: “who knoweth His state of mind”, not, ”who knoweth his thoughts”) (Sanhedrin 105b)."}, {"ch": 24, "v": 17, "aliyah": 7, "heb": "אֶרְאֶ֙נּוּ֙ וְלֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖נּוּ וְלֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽיַּעֲקֹ֗ב וְקָ֥ם שֵׁ֙בֶט֙ מִיִּשְׂרָאֵ֔ל וּמָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְקַרְקַ֖ר כׇּל־בְּנֵי־שֵֽׁת׃", "onk": "חֲזִיתֵיהּ וְלָא כְעַן סְכִיתֵיהּ <b>וְלָא אִיתוֹהִי קָרִיב כַּד יְקוּם מַלְכָּא<\/b> מִיַּעֲקֹב <b>וְיִתְרַבָּא מְשִׁיחָא<\/b> מִיִּשְׁרָאֵל <b>וְיִקְטוֹל רַבְרְבֵי<\/b> מוֹאָב <b>וְיִשְׁלוֹט בְּכָל בְּנֵי אֱנָשָׁא<\/b>:", "onk_en": "I see it but not now, I perceive it but not in the near future; a star [<b>king<\/b>] has gone forth from Yaakov, and a staff has arisen [<b>the Moshiach will be magnified by<\/b>] from Yisroel, which will smash the corners [<b>kill the leaders<\/b>] of Moav, and impale all of the sons of Sheis [<b>will rule over mankind<\/b>].", "pj": "חָמֵי אֲנָא לֵיהּ וְלֵיתֵיהּ כְדוֹן מִסְתַּכֵּל אֲנָא בֵּיהּ וְלֵיתֵי מַקְרִיב כַּד יִמְלוֹךְ מְלִיךְ תַּקִיף מִדְבֵית יַעֲקב וְיִתְרַבֵּי מְשִׁיחָא וְשֵׁיבַט תַּקִיף מִיִשְרָאֵל וְיִקְטוֹל רַבְרְבָנֵי מוֹאֲבָאֵי וִירוֹקֵן כָּל בְּנוֹי דְשֵׁת מַשִׁירְיָיתֵיהּ דְגוֹג דַעֲתִידִין לִמְסַדְרָא סִדְרֵי קְרָבָא בְּיִשְרָאֵל וְיִפְּלוּן פִּגְרֵיהוֹן כֻּלְהוֹן קֳדָמוֹי", "pj_en": "I shall see Him, but not now; I shall behold Him, but it is not near. When the mighty King of Jakob's house shall reign, and the Meshiha, the Power-sceptre of Israel, be anointed, He will slay the princes of the Moabaee, and bring to nothing all the children of Sheth, the armies of Gog who will do battle against Israel and all their carcases shall fall before Him.", "tj": "חָמֵי אֲנָא לֵיהּ וְלֵית הוּא כְּדוֹן מִסְתַּכֵּל אֲנָא בֵּיהּ וְלֵית הוּא קְרֵיבָא עֲתִיד לְמֵיקָם מֶלֶךְ מִדְבֵית יַעֲקב וּפָרִיק וְשַׁלִיט מִדְבֵית יִשְרָאֵל וְיִקְטֵיל תַּקִיפֵי מוֹאֲבָאֵי וִירוֹקַן וִישֵׁיצֵי כָּל בְּנֵי מַדִינְחָא:", "tj_en": "I shall see Him, but not now; I shall behold Him, but He is not nigh. A King is to arise from the house of Jakob, and a Redeemer and Ruler from the house of Israel, who will slay the strong ones of the Moabaee, and bring to nothing and consume all the children of the east.", "rashi": "<b>אראנו.<\/b> רוֹאֶה אֲנִי שִׁבְחוֹ שֶׁל יַעֲקֹב וּגְדֻלָּתוֹ, אַךְ לֹא עַתָּה הִיא, אֶלָּא לְאַחַר זְמַן:<br><br><b>דרך כוכב.<\/b> כְּתַרְגּוּמוֹ, לְשׁוֹן \"דָּרַךְ קַשְׁתּוֹ\" (איכה ב'), שֶׁהַכּוֹכָב עוֹבֵר כְּחֵץ, וּבְלַעַז דישט\"נט, כְּלוֹמַר יָקוּם מַזָּל:<br><br><b>וקם שבט.<\/b> מֶלֶךְ רוֹדֶה וּמוֹשֵׁל:<br><br><b>ומחץ פאתי מואב.<\/b> זֶה דָוִד שֶׁנֶּאֱמַר בּוֹ \"הַשְׁכֵּב אוֹתָם אַרְצָה וַיְמַדֵּד שְׁנֵי חֲבָלִים לְהָמִית\" וְגוֹ' (שמואל ב ח'):<br><br><b>וקרקר.<\/b> לְשׁוֹן קוֹרֶה, כְּמוֹ \"אֲנִי קַרְתִּי\" (מלכים ב י\"ט), \"מַקֶּבֶת בּוֹר נֻקַּרְתֶּם\" (ישעיהו נ\"א), \"יִקְּרוּהָ עֹרְבֵי נַחַל\" (משלי ל'), פורי\"ר בְּלַעַ\"ז:<br><br><b>כל בני שת.<\/b> כָּל הָאֻמּוֹת, שֶׁכֻּלָּם יָצְאוּ מִן שֵׁת בְּנוֹ שֶׁל אָדָם הָרִאשׁוֹן:", "rashi_en": "אראנו I SEE HIM — I see the preeminence of Jacob and his greatness, but it is not now (ולא עתה), but will be after some time.<br><br>דרך כוכב A STAR COMETH OUT [OF JACOB] — Understand this as the Targum does (“a king will arise from Jacob”). The word דרך has the same meaning as in (Lamentations 2:4): “He has bent (דרך lit., trodden) his bow; this expression is used because the star shoots across [the heavens] as an arrow does when the bow is trodden. In O. F. destent. It is as much as to say, “Prosperity (a good fortune) will rise”.<br><br>וקם שבט AND A שבט RISES [OUT OF ISRAEL] — a king, who chastises with the rod (שבט) and has sovereign power.<br><br>ומחץ פאתי מואב AND PIERCETH THE CORNERS OF MOAB — This is a reference to David of whom it is stated, (II Samuel 8:2) “[And he smote Moab] … making them to lie down on the ground and he measured two lines to put to death etc.”.<br><br>וקרקר AND UNDERMINETH — This is an expression denoting “digging”, as in (2 Kings 19:24): “I have dug (קרתי)”; (Isaiah 51:1): “The hole of the pit from which you were dug out  (נקרתם); (Proverbs 30:17) “The ravens of the valley shall dig it out (יקרהו)\". In O. F. forer.<br><br>כל בני שת ALL THE CHILDREN OF SETH — i.e., all nations, because all of them issued from Seth, the son of Adam, the first man (cf. Onkelos)."}, {"ch": 24, "v": 18, "aliyah": 7, "heb": "וְהָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְהָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑יו וְיִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃", "onk": "וִיהֵי אֱדוֹם יְרֻתָּא וִיהֵי יְרֻתָּא שֵׂעִיר לְבַעֲלֵי דְבָבוֹהִי וְיִשְׂרָאֵל <b>יַצְלַח בְּנִכְסִין<\/b>:", "onk_en": "Edom will be possession and Seir shall become the possession of his enemies; but Yisroel will triumph [<b>be successful in enterprise<\/b>].", "pj": "וִיהַווֹן אֱדוֹמָאֵי תְּרִיכִין וִיהוֹן תְּרִיכִין בְּנֵי דְגַבְלָא מִן קֳדָם יִשְרָאֵל סַנְאֵיהוֹן וְיִשְרָאֵל יִתְקְפוּן בְּנִכְסִין וְיִרְתוּנוּן", "pj_en": "And the Edomaee will be utterly driven out, even the sons of Gabela from before Israel their foes, and Israel will be strengthened with their riches and possess them.", "tj": "וִיהֵי פָּרַס יַרְתֵי טוּרָא דְגַבְלָא לְבַעֲלֵי דְבָבֵיהוֹן וְיִשְרָאֵל יִתְגַבְּרוּן בְּחֵיל תַּקִיף:", "tj_en": "And Edom may inherit Mount Gabela from their enemies but Israel will be stronger with a mighty host.", "rashi": "<b>והיה ירשה שעיר.<\/b> לְאוֹיְבָיו יִשְׂרָאֵל:", "rashi_en": "והיה ירשה שעיר איביו SEIR ALSO SHALL BE A POSSESSION [FOR HIS ENEMIES] — for his enemy, Israel."}, {"ch": 24, "v": 19, "aliyah": 7, "heb": "וְיֵ֖רְדְּ מִֽיַּעֲקֹ֑ב וְהֶֽאֱבִ֥יד שָׂרִ֖יד מֵעִֽיר׃", "onk": "וְיֵחוּת חַד <b>מִדְּבֵית<\/b> יַעֲקֹב וְיוֹבֵד מְשֵׁזֵב מִקִּרְיַת עַמְמַיָּא:", "onk_en": "A ruler shall come from [<b>the house of<\/b>] Yaakov, who will annihilate the survivors of the city.”", "pj": "וִיקוּם שַׁלִיט מִדְבֵית יַעֲקב וְיוֹבִיד וִישֵׁיצֵי שֵׁיזְבוּתָא דְמִשְׁתַּיֵיר מִן קוּסְטַנְטִינֵי קַרְתָּא חַיַיבְתָּא וְיִצְדֵי וְיֶחֱרוֹב כְּרַכָּא מְרוֹדָא דְקִסְרִין תַּקִיף קִרְוֵי עַמְמַיָא", "pj_en": "And a prince of the house of Jakob will arise and destroy and consume the remnant that have escaped from Constantina the guilty city, and will lay waste and ruin the rebellious city, even Kaiserin the strong city of the Gentiles.", "tj": "עָתִיד מֶלֶךְ לְמֵיקָם מִדְבֵית יַעֲקב וִישֵׁיצֵי יַת כָּל מַה דְמִשְׁתַּיָיר מִן כְּרַכָּא חַיָיבָא:", "tj_en": "A King will arise from the house of Jakob, and destroy what shall remain of the strong city", "rashi": "<b>וירד מיעקב.<\/b> וְעוֹד יִהְיֶה מוֹשֵׁל אַחֵר מִיַּעֲקֹב:<br><br><b>והאביד שריד מעיר.<\/b> הַחֲשׁוּבָה שֶׁל אֱדוֹם, הִיא רוֹמִי, וְעַל מֶלֶךְ הַמָּשִׁיחַ אוֹמֵר כֵּן, שֶׁנֶּאֱמַר בּוֹ \"וְיֵרְדְּ מִיָּם עַד יָם\" (תהלים ע\"ב) \"וְלֹא יִהְיֶה שָׂרִיד לְבֵית עֵשָׂו\" (עוב' י\"ח):", "rashi_en": "וירד מיעקב AND OUT OF JACOB ONE SHALL RULE — and there will be yet another ruler from Jacob,<br><br>והאביד שריד מעיר AND HE WILL DESTROY THE REMNANT OF THE CITY — the most important city of Edom, and that is Rome. It is of King Messiah that he is thus speaking, of whom it is said, (Psalms 72:8) “And he shall have dominion (וירד) from sea to sea”; (Obadiah v. 18) “And there shall be no remnant (שריד) of the house of Esau\"."}, {"ch": 24, "v": 20, "aliyah": 7, "heb": "וַיַּרְא֙ אֶת־עֲמָלֵ֔ק וַיִּשָּׂ֥א מְשָׁל֖וֹ וַיֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְאַחֲרִית֖וֹ עֲדֵ֥י אֹבֵֽד׃", "onk": "וַחֲזָא יָת עֲמַלְקָאָה וּנְטַל מַתְלֵיהּ וַאֲמַר רֵישׁ <b>קְרָבַיָּא דְיִשְׂרָאֵל<\/b> הֲוָה עֲמַלְקָאָה וְסוֹפֵיהּ לְעָלְמָא יֵיבָד:", "onk_en": "When Bil’am saw Amalek, he declared his parable, and said: “Amalek was the first among nations [<b>to fight with Yisroel<\/b>], and his end will be total destruction.”", "pj": "וַחֲמָא יַת דְבֵית עֲמָלֵק וּנְטַל מְתַל נְבוּתֵיהּ וַאֲמַר שֵׁירוֹי אוּמַיָא דְאַגִיחוּ קְרָבָא בִּדְבֵית יִשְרָאֵל הִינוּן דְבֵית עֲמָלֵק וְסוֹפֵיהוֹן בְּיוֹמֵי מַלְכָּא מְשִׁיחָא לִמְסַדְרָא סִדְרֵי קְרָבָא עִם כָּל בְנֵי מַדִינְחָא עִם דְבֵית יִשְרָאֵל בְּרַם סוֹפֵיהוֹן דְאִלְיֵין וּדְאִילְיֵין עַד עַלְמָא יְהוֹן לְאוֹבְדָנָא", "pj_en": "And he looked on the house of Amalek, and took up the parable of his prophecy, and said: The first of the nations who made war with the house of Israel were those of the house of Amalek; and they at last, in the days of the King Meshiha, with all the children of the east, will make war against Israel; but all of them together will have eternal destruction in their end.", "tj": "וְחָמָא יַת עֲמַלְקָאָה וּנְטַל בִּמְתַל נְבִיוּתֵיהּ וַאֲמַר שֵׁירוּי אוּמַיָא דִסְדָרוּ קְרָבָא כָּל קֳבֵיל יִשְרָאֵל הִינוּן דְבֵית עֲמָלֵק וּבְעִקְבָא בְּסוֹף יוֹמַיָא הִינוּן יְסַדְרוּן לְקִבְלֵיהוֹן סִדְרֵי קְרָבָא וְסוֹפֵיהוֹן לַאֲבָדָן יֶהֱוֵי וְאוֹבָדוֹנֵיהוֹן עַד לַעֲלָם:", "tj_en": "And he beheld the Amalkaah, and took up the parable of his prophecy and said: The house of Amalek was the first of the peoples to make war with Israel, and at last in the end of the days they will array battle against them; but their end is to perish, and their destruction to be for ever.", "rashi": "<b>וירא את עמלק.<\/b> נִסְתַּכֵּל בְּפֻרְעֲנוּתוֹ שֶׁל עֲמָלֵק:<br><br><b>ראשית גוים עמלק.<\/b> הוּא קָדַם אֶת כֻּלָּם לְהִלָּחֵם בְּיִשְׂרָאֵל — וְכָךְ תִּרְגֵּם אֻנְקְלוֹס — <b>ואחריתו<\/b> לֵאָבֵד בְּיָדָם, שֶׁנֶּאֱמַר \"תִּמְחֶה אֶת זֵכֶר עֲמָלֵק\" (דברים כ\"ה):", "rashi_en": "וירא את עמלק AND HE SAW AMALEK — i.e. He perceived the retribution destined to befall Amalek.<br><br>ראשית גוים עמלק AMALEK WAS THE BEGINNING OF NATIONS — he was the first of them all to war against Israel; thus, too, does Onkelos translate it. ואחריתו BUT HIS LATTER END will be to be destroyed by their hands, as it is said, (Deuteronomy 25:19) “Thou shalt blot out the memory of Amalek”."}, {"ch": 24, "v": 21, "aliyah": 7, "heb": "וַיַּרְא֙ אֶת־הַקֵּינִ֔י וַיִּשָּׂ֥א מְשָׁל֖וֹ וַיֹּאמַ֑ר אֵיתָן֙ מֽוֹשָׁבֶ֔ךָ וְשִׂ֥ים בַּסֶּ֖לַע קִנֶּֽךָ׃", "onk": "וַחֲזָא יָת <b>שַׁלְמָאָה<\/b> וּנְטַל מַתְלֵיהּ וַאֲמַר תַּקִּיף בֵּית מוֹתְבָךְ וְשַׁוִּי <b>בִכְרַךְ תַּקִּיף מְדוֹרָךְ<\/b>:", "onk_en": "[When] he saw the Keinite [<b>Shalmites<\/b>], he set forth his parable, and said: “How powerful is your dwelling place, and set in a cliff your nest [<b>your dwelling in a forified city<\/b>].", "pj": "וַחֲמָא יַת יִתְרוֹ דְמִתְגַיֵיר וּנְטַל מְתַל נְבוּתֵיהּ וַאֲמַר מַה תַּקִיף הוּא מַשִׁרְוְיָךְ דִי שַׁוֵיתָא בְּנִקְרַיָא דְטִינְרַיָא מְדוֹרָךְ", "pj_en": "And he looked upon Jethro, who had been made proselyte, and took up the parable of his prophecy, and said: How strong is thy habitation, who hast set thy dwelling in the clefts of the rocks!", "tj": "וַחֲמָא יַת שַׁלְמַיָא וּנְטַל בִּמְתַל נְבִיוּתֵיהּ וַאֲמַר מָה תַקִיף הוּא מֵישְׁרוּיָךְ וְשַׁוְויַית בְּנַקָרַת צוּר בֵּית מְדוֹרָךְ:", "tj_en": "And when he looked upon the Shalmaia, taking up the parable of his prophecy, he said, How strong is thy abode, who hast set the house of thy dwelling in the clefts of the rock!", "rashi": "<b>וירא את הקיני.<\/b> לְפִי שֶׁהָיָה קֵינִי תָּקוּעַ אֵצֶל עֲמָלֵק, כָּעִנְיָן שֶׁנֶּאֱמַר \"וַיֹּאמֶר שָׁאוּל אֶל הַקֵּינִי\" וְגוֹ' (שמואל א ט\"ו), הִזְכִּירוֹ אַחַר עֲמָלֵק; נִסְתַּכֵּל בִּגְדֻלָּתָן שֶׁל בְּנֵי יִתְרוֹ שֶׁנֶּאֱמַר בָּהֶם (דבהי\"א ב') \"תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים\" (ספרי במדבר י'; סנהדרין ק\"ד):<br><br><b>איתן מושבך.<\/b> תָּמֵהַּ אֲנִי מֵהֵיכָן זָכִיתָ לְכָךְ הֲלֹא אַתָּה עִמִּי הָיִיתָ בַּעֲצַת \"הָבָה נִתְחַכְּמָה לוֹ\" (שמות א'), וְעַתָּה נִתְיַשַּׁבְתָּ בְאֵיתָן וּמָעוֹז שֶׁל יִשְׂרָאֵל (סנהדרין ק\"ו):", "rashi_en": "וירא את הקיני AND HE SAW THE KENITES — Because the Kenites were settled near the Amalekites — just as it is stated, (I Samuel 15:6) “And Saul said unto the Kenites, [Go, depart, get you down from among the Amalekites]’’ — he mentioned them immediately after the Amalekites. He beheld the greatness of the descendants of Jethro, of whom it is said, (I Chronicles 2:55) “The תרעתים, שמעתים, שוכתים\" — [These are the Kenites] (see Sifrei Bamidbar 78:1 on Numbers 10:29; Sanhedrin 104a, 106a, Sotah 11a).<br><br>איתן מושבך FIRM IS THY DWELLING PLACE — “I wonder whence you merited this; for were you not with me in the advice we gave Pharaoh (Exodus 1:10): ‘Come, let us deal wisely with them’, and now you have a seat in the strength and power of Israel, (in the Sanhedrin)’’! (Sanhedrin 106a)."}, {"ch": 24, "v": 22, "aliyah": 7, "heb": "כִּ֥י אִם־יִהְיֶ֖ה לְבָ֣עֵֽר קָ֑יִן עַד־מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽךָּ׃", "onk": "אֲרֵי אִם יְהֵי <b>לְשֵׁצָאָה שַׁלְמָאָה<\/b> עַד מָא אֲתוּרָאָה יִשְׁבִּנָּךְ:", "onk_en": "For, if Kayin is to be uprooted [<b>the Shalmites are to be destroyed<\/b>], until where will Ashur take you captive?”", "pj": "אֲרוּם אִין יִתְגְזַר לְמֶהֱוֵי לְבִיזְתָא בְּנוֹי דְשַׁלְמַיָא עַד כְּדֵי יֵיתֵי סַנְחֵרִיב מַלְכָּא דְאָתּוּר וְיִשְׁבֵּי יָתָךְ", "pj_en": "Yet so is it decreed that the children of the Shalmaia must be despoiled, but not until Sancherib the king of Athur shall come and make thee captive.", "tj": "אֲרוּם אִין יֶהֱוֵי שַׁלְמַיָא לְבִזָא עַד כְּעַן אֲתוּרַיָא עֲתִיד קָאִים שְׁבֵי יָתָךְ:", "tj_en": "But the Shalmaia will not be spoiled, until Athuria shall arise, and take thee captive.", "rashi": "<b>כי אם יהיה לבער קין וגו'.<\/b> אַשְׁרֶיךָ שֶׁנִּתְקַעְתָּ לְתֹקֶף זֶה, שֶׁאֵינְךָ נִטְרָד עוֹד מִן הָעוֹלָם, כִּי אַף אִם אַתָּה עָתִיד לִגְלוֹת עִם עֲשֶׂרֶת הַשְּׁבָטִים, וְתִהְיֶה לְבָעֵר מִמָּקוֹם שֶׁנִּתְיַשַּׁבְתָּ שָׁם, מַה בְּכָךְ?<br><br><b>עד מה אשור תשבך.<\/b> עַד הֵיכָן הוּא מַגְלֶה אוֹתְךָ? שֶׁמָּא לַחְלַח וְחָבוֹר? אֵין זֶה טֵרוּד מִן הָעוֹלָם, אֶלָּא טִלְטוּל מִמָּקוֹם לְמָקוֹם, וְתָשׁוּב עִם שְׁאָר הַגָּלֻיּוֹת:", "rashi_en": "כי אם יהיה לבער קין וגו׳ FOR IF THE KENITES WILL BE REMOVED etc. — Happy are you that you have firmly settled yourself in such strength, to which I have referred, so that thou will therefore never be driven from the world. For even if you will in the future go into exile with the Ten Tribes  and be removed from the place where you had settled, what does it matter? <br><br>עד מה אשור תשבך HOW FAR WILL ASSYRIA CARRY YOU AWAY CAPTIVE? Possibly as far as Chaloch and Chabor — this is not being driven from the world, but only being moved from place to place, and in the end you will return with the other exiles!"}, {"ch": 24, "v": 23, "aliyah": 7, "heb": "וַיִּשָּׂ֥א מְשָׁל֖וֹ וַיֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִשֻּׂמ֥וֹ אֵֽל׃", "onk": "וּנְטַל מַתְלֵיהּ וַאֲמַר <b>וַי לְחַיָּבַיָּא דְּיֵחוֹן כַּד יַעֲבֵּד אֱלָהָא יָת אִלֵּין<\/b>:", "onk_en": "He set forth his parable, and said: “Alas! Who can survive from God's devastation? [<b>Woe to those evil people who are living when Hashem does this.<\/b>]", "pj": "וּנְטַל מְתַל נְבוּתֵיהּ וַאֲמַר וַוי מַאן יִתְקְיַים בִּזְמַן דְיִתְגְלֵי מֵימְרָא דַיְיָ לְמִתַּן אֲגַר טַב לְצַדִיקַיָא וּלְמִתְפַּרְעָא מִן רַשִׁיעַיָא וּמְכַתֵּת אוּמַיָא וּמַלְכַיָא וּמְגָרֵי אִלְיֵין בְאִלְיֵין", "pj_en": "And he took up the parable of his prophecy, and said, Woe to them who are alive at the time when the Word of the Lord shall be revealed, to give the good reward to the righteous, and to take vengeance on the wicked, to smite the nations and the kings, and bring these things upon them!", "tj": "אַלְוַי מָן יֵיחִי כַּד יְשַׁוֵי מֵימְרָא דַיְיָ לְמִתַּן אֲגַר טַב לְצַדִיקַיָא וּלְמִתְפְּרַע מֵרַשִׁיעַיָא:", "tj_en": "Woe to him who is alive when the Word of the Lord setteth Himself to give the good reward to the just, and to take vengeance on the wicked!", "rashi": "<b>וישא משלו וגו'.<\/b> כֵּיוָן שֶׁהִזְכִּיר אֶת שְׁבִיַּת אַשּׁוּר, אָמַר <b>אוי מי יחיה משמו אל<\/b>, מִי יָכוֹל לְהַחֲיוֹת אֶת עַצְמוֹ מִשּׂוּמוֹ אֶת אֵלֶּה — שֶׁלֹּא יָשִׂים עָלָיו הַגּוֹזֵר אֶת אֵלֶּה, שֶׁיַּעֲמֹד סַנְחֵרִיב וִיבַלְבֵּל אֶת כָּל הָאֻמּוֹת, וְעוֹד יָבֹאוּ:", "rashi_en": "וישא משלו וגו׳ AND HE TOOK UP HIS PARABLE etc. — Because he mentioned the captivity into Assyria he exclaimed, אוי מי יחיה משמו אל, who is able to save himself alive, so that He who decrees (God) should not place upon him (משמו) these things (אל, the equivalent of אלה) — for Sannacherib, king of Assyria, shall rise up and bring all the nations into confusion. And further, there will come —"}, {"ch": 24, "v": 24, "aliyah": 7, "heb": "וְצִים֙ מִיַּ֣ד כִּתִּ֔ים וְעִנּ֥וּ אַשּׁ֖וּר וְעִנּוּ־עֵ֑בֶר וְגַם־ה֖וּא עֲדֵ֥י אֹבֵֽד׃", "onk": "<b>וְסִיעַן יִצְטָרְחַן מֵרוֹמָאֵי<\/b> וִיעַנּוּן לְאָתוּר <b>וְיִשְׁתַּעְבְּדוּן לְעֵבַר פְּרָת<\/b> וְאַף אִנּוּן לְעָלְמָא יֵיבְדוּן:", "onk_en": "Warships will come from Kittim [<b>groups will beg help from Rome<\/b>] and destroy Ashur, and cause suffering to those on the other side [<b>will enslave those beyond Peras<\/b>], but they, too, shall be lost for eternity.”", "pj": "וְצִיצִין יִצְטַרְחַן בְּמָנֵי זַיְינָא וְיִפְקוּן בְּאָכְלוּסִין סַגִיאִין מִן לַמְבַּרְנְיָא וּמֵאַרַע אִטַלְיָא וְיִצְטַרְפוּן בְּלִגְיוֹנִין דְיִפְקוּן מִן קוּסְטַנְטִינֵי וִיצַעֲרוּן לַאֲתוּרָאֵי וִישַׁעַבְּדוּן כָּל בְּנוֹי דְעֵבֶר בְּרַם סוֹפֵהוֹן דְאִלְיֵין וְאִלְיֵין לְמֵיפַּל בְּיַד מַלְכָּא מְשִׁיחָא וִיהַווֹן עַד עַלְמָא לְאוּבְדָנָא", "pj_en": "And ships (lit., sails) armed for war will come forth with urreat armies from Lombarnia, and from the land of Italia, conjoined with the legions that will come forth from Constantina, and will afflict the Athuraee, and bring into captivity all the sons of Eber; nevertheless the end of these and of those is to fall by the hand of the King Meshiha, and be brought to everlasting destruction:", "tj": "וְיִפְקוּן אוֹכְלוֹסִין סַגְיָין בְּלִבְרָנַיָא מִן מְדִינְתָּא רַבְּתָא וְיִצְרְפוּן עִמְהוֹן לִגְיוֹנִין סַגְיַין מִן דְרוֹמָאֵי וִישַׁעְבְּדוּן אֲתוּרַיָא וְיִצְעֲרוּן כָּל בְּנֵי עֵבֶר נַהֲרָא וּבְרַם סוֹפֵיהוֹן דְאִלֵין וּדְאִלֵין לַאֲבַדוֹן יֶהֱוֵי וְאוֹבְדָנָא עַד לַעֲלָם:", "tj_en": "And great hosts in Livernia will come from the great city, and will conjoin with them many legions of the Romaee, and subjugate Athuria, and afflict all the children beyond the river. Nevertheless the end of these and of those is to perish, and the destruction to be everlasting.", "rashi": "<b>צים מיד כתים.<\/b> וְיַעַבְרוּ כִתִּיִּים, שֶׁהֵן רוֹמִיִּים, בְּבִירָנִיּוֹת גְּדוֹלוֹת עַל אַשּׁוּר:<br><br><b>וענו עבר.<\/b> וְעִנּוּ אוֹתָם שֶׁבְּעֵבֶר הַנָּהָר:<br><br><b>וגם הוא עדי אבד.<\/b> וְכֵן פֵּרֵשׁ דָּנִיֵּאל \"עַד דִּיקְטִילַת חֵיוְתָא וְהוּבַד גִּשְׁמַהּ\" (דניאל ז'):<br><br><b>וצים.<\/b> סְפִינוֹת גְּדוֹלוֹת, כְּדִכְתִיב (ישעיהו ל\"ג) \"וְצִי אַדִּיר\", תַּרְגּוּמוֹ \"וּבוּרְנִי רַבְּתָא\" (יומא ע\"ז):", "rashi_en": "צים מיד כתים SHIPS FROM THE LAND OF CHITTIM and the people of Chittim — these are the Romans — will pass over in big ships against Assyria. <br><br>וענו עבר AND WILL AFFLICT THEM ON THE OTHER SIDE (עבר) of the river Euphrates.<br><br>וגם הוא עדי אבד BUT HE ALSO SHALL PERISH EVERLASTINGLY — (“He” means the Romans). And so, too, did Daniel expressly state, (Daniel 7:11) “until the beast (Rome) was slain and its body destroyed\".<br><br>וצים means [AND] BIG SHIPS, as it is written (Isaiah 33:21) “A gallant ship (צי)\", the Targum translation of which is “a big ship” (Yoma 77b)."}, {"ch": 24, "v": 25, "aliyah": 7, "heb": "וַיָּ֣קׇם בִּלְעָ֔ם וַיֵּ֖לֶךְ וַיָּ֣שׇׁב לִמְקֹמ֑וֹ וְגַם־בָּלָ֖ק הָלַ֥ךְ לְדַרְכּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְקָם בִּלְעָם וַאֲזַל וְתָב לְאַתְרֵיהּ וְאַף בָּלָק אֲזַל לְאָרְחֵיהּ:", "onk_en": "Bil’am arose, went, and returned home; and Balak too, went on his way.", "pj": "וְקָם בִּלְעָם וְאָזַל וְתַב לְאַתְרֵיהּ וּלְחוֹד בָּלָק אָזַל לְאוֹרְחֵיהּ וְאָקִים יַת בְּנַתְהוֹן דְמִדְיָינָאֵי בְּקוֹלִין מִבֵּית יְשִׁימוֹת עַד טַוָור תַּלְגָא וְהַוָואן זַבְּנָן זִינֵי כוּסְנִין בְּבָצִיר מִן טִימְהוֹן בְּמֵילְכַת בִּלְעָם רַשִׁיעָא בִּפְרָשַׁת אוּרְחָתָא", "pj_en": "And Bileam rose up and went to return to his place, and Balak also went upon his way, and appointed the daughters of the Midianites for the tavern booths at Beth Jeshimotb, by the snow mountain, where they sold sweetmeats cheaper than their price, after the counsel of Bileam the wicked, at the dividing of the way.", "tj": "וְקָם בִּלְעָם וְאָזַל וְחָזַר לְאַתְרֵיהּ וּלְחוֹד בָּלָק:", "tj_en": "And Bileam rose up and went to return to his place; and Balak also.", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 1, "aliyah": 7, "heb": "וַיֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּשִּׁטִּ֑ים וַיָּ֣חֶל הָעָ֔ם לִזְנ֖וֹת אֶל־בְּנ֥וֹת מוֹאָֽב׃", "onk": "וִיתֵב יִשְׂרָאֵל בְּשִׁטִּין וְשָׁרֵי עַמָּא לְמִטְעֵי בָּתַר בְּנַת מוֹאָב:", "onk_en": "Yisroel settled in Shittim and the people [of Yisroel] began acting promiscuously with the daughters of Moav.", "pj": "וִיתֵיב יִשְרָאֵל בְּאַתְרָא דַהֲוָה מִתְקְרֵי שִׁיטִין עַל שְׁטוּתָא וְקִלְקוּלָא דַהֲוָה בְּהוֹן וּשְׁרִיאוּ עַמָא לְאוֹפְסָא קְדוּשַׁתְהוֹן וּלְמִפְעַר גַרְמֵיהוֹן לְטוֹפְסָא דִפְּעוֹר וּלְמַטְעִית בָּתַר בְּנַת מוֹאֲבָאֵי דְמַפְקַן יַת טוֹפְסֵיהּ דִפְּעוֹר מִתּוֹתֵי פִּסְקִיֵיהוֹן", "pj_en": "And Israel dwelt in the place which is called Shittim, on account of the (Shetutha) foolishness and depravity which were among them. And the people began to profane their holiness, and to strip their bodies to the image of Peor, and commit fornication with the daughters of the Moabites, who brought out the image of Peor, concealed under their bundles.", "tj": "וּשְׁרוֹן יִשְרָאֵל בְּשִׁיטִין וּשְׁרוֹן עַמָא לִמְזַנְיָא עִם בְּנַתְהוֹן דְמוֹאֲבָאֵי:", "tj_en": "And Israel abode in Shittim; and the people began to commit fornication with the daughters of the Moabites.", "rashi": "<b>בשטים.<\/b> כָּךְ שְׁמָהּ:<br><br><b>לזנות אל בנות מואב.<\/b> עַל יְדֵי עֲצַת בִּלְעָם, כִּדְאִיתָא בְחֵלֶק (סנהדרין ק\"ו):", "rashi_en": "בשטים — Thus was its name: SHITTIM.<br><br>לזנות אל בנות מואב TO COMMIT WHOREDOM WITH THE DAUGHTERS OF MOAB — by the advice of Balaam, — as is related in the chapter חלק (Sanhedrin 106a)."}, {"ch": 25, "v": 2, "aliyah": 7, "heb": "וַתִּקְרֶ֣אןָ לָעָ֔ם לְזִבְחֵ֖י אֱלֹהֵיהֶ֑ן וַיֹּ֣אכַל הָעָ֔ם וַיִּֽשְׁתַּחֲו֖וּ לֵאלֹֽהֵיהֶֽן׃", "onk": "וּקְרָא לְעַמָּא לְדִבְחֵי <b>טַעֲוַתְהוֹן<\/b> וַאֲכַל עַמָּא וּסְגִידוּ <b>לְטַעֲוַתְהוֹן<\/b>:", "onk_en": "They [girls of Moav] invited the people [of Yisroel] to their idolatrous sacrifices [<b>abominations<\/b>]; and the people ate and prostrated themselves before their gods [<b>abominations<\/b>].", "pj": "וּקְרָאָה לְעַמָא לְדִבְחֵי טַעֲוַותְהוֹן וְאָכְלִין עַמָא בְּמַרְזְחֵיהוֹן וְסָגְדִין לְטַעֲוַותְהוֹן", "pj_en": "And they invited the people to the sacrifices of their idols; and the people ate in their feasts, and bowed themselves to their idols.", "tj": "וְקַרְיָן לְעַמָא לְדִבְחֵי טַעֲוַותְהֶן:", "tj_en": "And they invited the people to the sacrifices of their idols.", "rashi": "<b>וישתחוו לאלהיהן.<\/b> כְּשֶׁתָּקַף יִצְרוֹ וְאוֹמֵר לָהּ הִשָּׁמְעִי לִי, וְהִיא מוֹצִיאָה לוֹ דְּמוּת פְּעוֹר מֵחֵיקָהּ וְאוֹמֶרֶת לוֹ הִשְׁתַּחֲוֵה לָזֶה:", "rashi_en": "וישתחוו לאלהיהן AND THEY PROSTRATED THEMSELVES BEFORE THEIR GODS — When anyone’s passions overpowered him and he said to her, “Submit to me”, she took out for him an image of Peor from her bosom, saying to him, “First prostrate yourself before this\" (Midrash Tanchuma, Balak 18)."}, {"ch": 25, "v": 3, "aliyah": 7, "heb": "וַיִּצָּ֥מֶד יִשְׂרָאֵ֖ל לְבַ֣עַל פְּע֑וֹר וַיִּֽחַר־אַ֥ף יְהֹוָ֖ה בְּיִשְׂרָאֵֽל׃", "onk": "וְאִתְחַבַּר יִשְׂרָאֵל לְבַעֲלָא פְעוֹר וּתְקֵף רָגְזָא דַיְיָ בְּיִשְׂרָאֵל:", "onk_en": "Yisroel became united with Ba’al Pe’or; and the rage of Adony flared against Yisroel.", "pj": "וְאִתְחַבָּרוּ עַמָא בֵּית יִשְרָאֵל בְּבַעֲלָא פְּעוֹר כְּמַסְמְרָא בְּקִיסָא דְלָא מִתְפְּרֵשׁ בְּלָא קִיסְמָא וּתְקֵיף רוּגְזָא דַיְיָ בְּיִשְרָאֵל", "pj_en": "And the people of the house of Israel joined themselves to Baala-Peor, like the nail in the wood, which is not separated but by breaking up the wood (or, with the splinters). And the anger of the Lord was kindled against Israel.", "tj": "וְאִדְבְּקוּ יִשְרָאֵל לְפַלְחֵי טַעֲוָותָא דִפְּעוֹר וּתְקֵיף רוּגְזָא דַיְיָ עַל יִשְרָאֵל:", "tj_en": "And Israel were united with the worshippers of the idol of Peor; and the anger of the Lord was strong against Israel.", "rashi": "<b>פעור.<\/b> עַל שֵׁם שֶׁפּוֹעֲרִין לְפָנָיו פִּי הַטַּבַּעַת וּמוֹצִיאִין רְעִי, וְזוֹ הִיא עֲבוֹדָתוֹ (סנהדרין ס'):<br><br><b>ויחר אף ה' בישראל.<\/b> שָׁלַח בָּהֶם מַגֵּפָה:", "rashi_en": "פעור  — It was so named because they bared (פער) their anus and relieved themselves before it: this was its ceremonial rite (Sanhedrin 60b).<br><br>ויחר אף ה' בישראל AND THE ANGER OF THE LORD WAS KINDLED AGAINST ISRAEL — he sent a plague among them (cf. v. 8)."}, {"ch": 25, "v": 4, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה קַ֚ח אֶת־כׇּל־רָאשֵׁ֣י הָעָ֔ם וְהוֹקַ֥ע אוֹתָ֛ם לַיהֹוָ֖ה נֶ֣גֶד הַשָּׁ֑מֶשׁ וְיָשֹׁ֛ב חֲר֥וֹן אַף־יְהֹוָ֖ה מִיִּשְׂרָאֵֽל׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה דְּבַר יָת כָּל רֵישֵׁי עַמָּא <b>וְדוּן וּקְטוֹל דְּחַיַּב קְטוֹל קֳדָם<\/b> יְיָ לָקֳבֵל שִׁמְשָׁא וִיתוּב תְּקוֹף רוּגְזָא דַיְיָ מִיִּשְׂרָאֵל:", "onk_en": "Adonoy said to Moshe: “Take all the leaders of the people and hang them, [<b>judge and execute those guilty by death<\/b>] before Adonoy, facing the sun; thereby removing the rage of Adony against Yisroel.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה סַב יַת כָּל רֵישֵׁי עַמָא וּמַנֵי יַתְהוֹן דַיָינִין וִידוֹנוּן דִינִין דִקְטוֹלִין יַת עַמָא דְטָעוּ בָּתַר פְּעוֹר וְתִצְלוֹב יַתְהוֹן קֳדָם מֵימְרָא דַיְיָ עַל קִיסָא קֳבֵיל שִׁמְשָׁא בִּקְרִיצְתָּא וְעִם מִטְמוֹעַ שִׁמְשָׁא תָּחוֹת יַתְהוֹן וְתִקְבְּרִינוּן וִיתוּב תְּקוֹף רוּגְזָא דַיְיָ מִיִשְרָאֵל", "pj_en": "And the Lord said to Mosheh, Take all the chiefs of the people, and appoint them for judges, and let them give judgment to put to death the people who have gone astray after Peor, and hang them before the Word of the Lord upon the wood over against the morning sun, and at the departure of the sun take them down and bury them and turn away the strong anger of the Lord from Israel.", "tj": "וַאֲמַר מֵימְרָא דַיְיָ לְמשֶׁה סַב יַת כָּל רֵישֵׁי עַמָא וְאוֹקִים יַתְהוֹן סַנְהֶדְרִין קֳדָם יְיָ וִיהַוְיַן צְלָבִין כָּל מַן דְמִתְחַיֵיב לְמִתְקַטְלָא וְעִם מַעֲלֵי שִׁמְשָׁא יֶהֱוְיַן מַחְתִין נִבְלָתֵיהּ וְקַבְרִין בְּכֵן יַחֲזוֹר תְּקוֹף רוּגְזָא דַיְיָ מִן יִשְרָאֵל:", "tj_en": "And the Word of the Lord said to Mosheh, Take all the chiefs of the people and set them for a Sanhedrin before the Lord, and let them bang all who are worthy of death; and at sunset take down their bodies and bury them, that so may be averted the strong anger of the Lord from Israel.", "rashi": "<b>קח את כל ראשי העם.<\/b> לִשְׁפֹּט אֶת הָעוֹבְדִים לִפְעוֹר:<br><br><b>והוקע אותם.<\/b> אֶת הָעוֹבְדִים:<br><br><b>והוקע.<\/b> הִיא תְלִיָּה, כְּמוֹ שֶׁמָּצִינוּ בִּבְנֵי שָׁאוּל \"וְהוֹקַעֲנוּם לַה'\" (שמואל ב כ״א:ו׳) וְשָׁם תְּלִיָּה מְפֹרֶשֶׁת (סנהדרין ל\"ד); עֲ\"זָ בִּסְקִילָה וְכָל הַנִּסְקָלִין נִתְלִין (סנהדרין מ\"ה):<br><br><b>נגד השמש.<\/b> לְעֵין כֹּל. וּמִ\"אַ: הַשֶּׁמֶשׁ מוֹדִיעַ אֶת הַחוֹטְאִים, הֶעָנָן נִקְפָּל מִכְּנֶגְדּוֹ וְהַחַמָּה זוֹרַחַת עָלָיו:", "rashi_en": "קח את כל ראשי העם TAKE ALL THE HEADS OF THE PEOPLE, to judge those who worshipped Peor (Sanhedrin 35a),<br><br>והוקע אותם AND HANG THEM — those who worshipped it (not the heads of the people). <br><br>והוקע — This is “hanging”, just as we find in the case of Saul’s sons, (II Samuel XXL 6) “And we will kill them by הוקעה unto the Lord”, and there (II Samuel vv. 12—13) hanging is distinctly mentioned (Sanhedrin 34b). It is true that idolatry (the sin committed here) is punishable by stoning, but all who were stoned were also hanged (Sanhedrin 45b).<br><br>נגד השמש AGAINST THE SUN — i.e., in the sight of everyone. A Midrashic statement is: the sun made known who were the sinners, for the cloud rolled itself up from in front of him (the sinner) so that the sun shone upon him (Midrash Tanchuma, Balak 19)."}, {"ch": 25, "v": 5, "aliyah": 7, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה אֶל־שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔יו הַנִּצְמָדִ֖ים לְבַ֥עַל פְּעֽוֹר׃", "onk": "וַאֲמַר משֶׁה לְדַיָּנֵי יִשְׂרָאֵל קְטוּלוּ גְּבַר גַּבְרוֹהִי דְּאִתְחַבָּרוּ לְבַעֲלָא פְעוֹר:", "onk_en": "Moshe said to the judges of Yisroel: “Each of you must execute his men who were united with Ba’al Pe’or.”", "pj": "וַאֲמַר משֶׁה לְדַיְינֵי יִשְרָאֵל קְטוּלוּ אֵינַשׁ גְבַר שִׁבְטֵיהּ דְאַדְבָּקוּ בְּטַעֲוַת פְּעוֹר", "pj_en": "And Mosheh said to the judges of Israel, Slay every one a man of his tribe of those who have joined themselves to the idol of Peor.", "tj": "וַאֲמַר משֶׁה לְסַרְכַיָא דְיִשְרָאֵל קְטוּלוּ גְבַר יַת אֱנַשׁ בֵּיתֵיהּ אִילֵין דִי אַדְבִּיקוּ לְפַלְחֵי טַעֲוָותָא דִפְּעוֹר:", "tj_en": "And Mosheh said to the princes of Israel, Slay each one a man of his house of them who have joined themselves to the idol of Peor.", "rashi": "<b>הרגו איש אנשיו.<\/b> כָּל אֶחָד וְאֶחָד מִדַּיָּנֵי יִשְׂרָאֵל הָיָה הוֹרֵג שְׁנַיִם, וְדַּיָּנֵי יִשְֹרָאֵל שְׁמוֹנַת רִבּוֹא וּשְׁמוֹנַת אֲלָפִים כִּדְאִיתָא בְסַנְהֶ' (דף י\"ח:):", "rashi_en": "הרגו איש אנשיו KILL EVERYONE HIS MEN — Each one of the judges of Israel killed two men (אנשיו is plural), and the judges of Israel were eighty-eight thousand in number, as it is related in Sanhedrin (cf. Sanhedrin 18a)."}, {"ch": 25, "v": 6, "aliyah": 7, "heb": "וְהִנֵּ֡ה אִישׁ֩ מִבְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַיַּקְרֵ֤ב אֶל־אֶחָיו֙ אֶת־הַמִּדְיָנִ֔ית לְעֵינֵ֣י מֹשֶׁ֔ה וּלְעֵינֵ֖י כׇּל־עֲדַ֣ת בְּנֵי־יִשְׂרָאֵ֑ל וְהֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְהָא גַּבְרָא מִבְּנֵי יִשְׂרָאֵל אֲתָא וְקָרֵב לְוָת אֲחוֹהִי יָת מִדְיָנֵיתָא לְעֵינֵי משֶׁה וּלְעֵינֵי כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל וְאִנּוּן בָּכָן בִּתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "And behold, a man came from among Bnei Yisroel, and brought the Midianite woman to his brethren, before the eyes of Moshe and before the eyes of the entire congregation of Yisroel, who were weeping at the entrance to the Tent of Meeting.", "pj": "וְהָא גְבַר מִבְּנֵי יִשְרָאֵל אָתָא וְאָחַד בְּבֵלוּרִיתָא דְמִדְיָנֵיתָא וְקָרֵיב יָתָהּ לְוַת אָחוֹהִי לְמֶחֱמֵי משֶׁה וּלְמֶחֱמֵי כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל עָנֵי וְכֵן אָמַר לְמשֶׁה מַה דָא לְמִקְרַב לְגַבָּהּ וְאִין אָמַר אַנְתְּ דַאֲסִירָא הִיא הֲלָא אַנְתָּ נְסֵיבַת יַת מִדְיָינֵיתָא בְּרַת יִתְרוֹ וְכַדִי שָׁמַע משֶׁה רָתַח וְאִשְׁתְּלֵי וְאִינוּן בַּכְיַין וְקַרְיַין שְׁמַע וְקַיְמִין בִּתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And behold, a man of the sons of Israel came, holding a Midianitess, and brought her to his brethren, in the sight of Mosheh and all the congregation of the children of Israel. He answered and said to Mosheh, What is it (that is wrong) to have company with her? If thou sayest, It is forbidden, didst thou not thyseIf take a Midianitess, the daughter of Jethro? When Mosheh heard, he trembled and swooned. But they wept, and cried, Listen! And they stood at the door of the tabernacle of ordinance.", "tj": "וְהָא גְבַר מִבְּנֵי יִשְרָאֵל אָתָא וּקְרֵיב לְוַת אָחוֹי יַת מִדְיָנִיתָא קֳדָם משֶׁה וְקָדָם כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל וְהָא אִינוּן בַּכְיַין בִּתְרַע מַשְׁכַּן זִמְנָא:", "tj_en": "And, behold, a man of the sons of Israel came and brought to his brethren a Midianitha, before Mosheh and all the congregation of the children of Israel; and, behold, they were weeping at the door of the tabernacle.", "rashi": "<b>והנה איש מבני ישראל בא.<\/b> נִתְקַבְּצוּ שִׁבְטוֹ שֶׁל שִׁמְעוֹן אֵצֶל זִמְרִי שֶׁהָיָה נָשִׂיא שֶׁלָּהֶם, אָמְרוּ לוֹ, אָנוּ נִדּוֹנִין בְּמִיתָה וְאַתָּה יוֹשֵׁב וְכוּ' כִּדְאִיתָא בְּאֵלּוּ הֵן הַנִּשְׂרָפִין (סנהדרין פ\"ב):<br><br><b>את המדינית.<\/b> כָּזְבִּי בַת צוּר:<br><br><b>לעיני משה.<\/b> אָמְרוּ לוֹ, מֹשֶׁה, זוֹ אֲסוּרָה אוֹ מֻתֶּרֶת? אִם תֹּאמַר אֲסוּרָה, בַּת יִתְרוֹ מִי הִתִּירָהּ לְךָ, וְכוּ', כִּדְאִיתָא הָתָם:<br><br><b>והמה בכים.<\/b> נִתְעַלְּמָה מִמֶּנּוּ הֲלָכָה, גָּעוּ כֻלָּם בִּבְכִיָּה; בָּעֵגֶל עָמַד מֹשֶׁה כְּנֶגֶד שִׁשִּׁים רִבּוֹא, שֶׁנֶּאֱמַר \"וַיִּטְחַן עַד אֲשֶׁר דָּק\" וְגוֹ' (שמות ל\"ב), וְכָאן רָפוּ יָדָיו? אֶלָּא כְּדֵי שֶׁיָּבֹא פִינְחָס וְיִטֹּל אֶת הָרָאוּי לוֹ (תנחומא):", "rashi_en": "והנה איש וגו׳ AND BEHOLD, ONE [OF THE CHILDREN OF ISRAEL CAME] The tribe of Simeon gathered to Zimri who was their prince, saying to him. “We are sentenced to death and you remain quiet!?”, — as it is related in the chapter beginning אלו הן הנשרפין (Sanhedrin 82a).<br><br>את המדינית THE MIDIANITISH WOMAN — Kozbi the daughter of Zur.<br><br>לעיני משה BEFORE THE EYES OF MOSES — They said to him: “Moses, is this Midianite woman forbidden or permissible as a wife. If you say she is forbidden, then who made Jethro’s daughter, a Midianite woman, permissible to you, etc.” as is related there (Sanhedrin 82a).<br><br>והמה בכים AND THEY WERE WEEPING — the law (decision on this matter) escaped him and therefore they all burst out into weeping (Sanhedrin 82a). — In the case of the golden calf Moses successfully resisted six hundred thousand men, as it is said, (Exodus 32:20) “And he ground it to powder [and he made the children of Israel drink of it]”, and here his hands were weak (he did not know what to do)?! But this was intentionally caused by God in order that Phineas might come and receive that which was meant for him (Midrash Tanchuma, Balak 20)."}, {"ch": 25, "v": 7, "aliyah": 7, "heb": "וַיַּ֗רְא פִּֽינְחָס֙ בֶּן־אֶלְעָזָ֔ר בֶּֽן־אַהֲרֹ֖ן הַכֹּהֵ֑ן וַיָּ֙קׇם֙ מִתּ֣וֹךְ הָֽעֵדָ֔ה וַיִּקַּ֥ח רֹ֖מַח בְּיָדֽוֹ׃", "onk": "וַחֲזָא פִּינְחָס בַּר אֶלְעָזָר בַּר אַהֲרֹן כַּהֲנָא וְקָם מִגּוֹ כְנִשְׁתָּא וּנְסֵיב רָמְחָא בִּידֵיהּ:", "onk_en": "When he saw this—Pinchas the son of Elazar [and grand]son of Aharon the <i>Kohein<\/i>—he rose up from the midst of the community and took a spear in his hand.", "pj": "וַחֲמָא פִּינְחָס בַּר אֶלְעָזָר בַּר אַהֲרן כַּהֲנָא וְאִידְכַּר הִילְכְתָא עָנֵי וַאֲמַר מַאן דְיִקְטוֹל וְקָטִיל הָאן אִינוּן אַרְיְוָתָא דְשֵׁיבַט יְהוּדָה כֵּיוַן דְחַמְנוּן שַׁתְקִין קָם מִגוֹ סַנְהֶדְרֵי דִילֵיהּ וּנְסֵיב רוּמְחָא בִּידֵיהּ", "pj_en": "And Phinehas bar Elazar-bar Aharon, the priest, saw, and, remembering the ordination, answered, and said: He who ought to kill, let him kill! Where are the lions of the tribe of Jehudah? When they saw, they were quiet. And he arose from among his Sanhedrin, and took a lance in his hand.", "tj": "וַחֲמָא פִּינְחָס בַּר אֶלְעָזָר בְּרָא דְאַהֲרן כַּהֲנָא רַבָּא וְקָם מִגוֹ קְהָלָא וּנְסֵיב רוּמְחָא:", "tj_en": "And Phinehas bar Elazar bar Aharon, the high priest, saw, and arose from among the assembly, and took a lance.", "rashi": "<b>וירא פינחס.<\/b> רָאָה מַעֲשֶׂה וְנִזְכַּר הֲלָכָה — אָמַר לוֹ לְמֹשֶׁה מְקֻבַּלְנִי מִמְּךָ הַבּוֹעֵל אֲרַמִּית קַנָּאִין פּוֹגְעִין בּוֹ. אָמַר לוֹ \"קַרְיָנָא דְּאִגַּרְתָּא אִיהוּ לֶיהֱוֵי פַּרְוַנְקָא\", מִיָּד <b>ויקח רמח בידו וגו'<\/b> (סנהדרין פ\"ב):", "rashi_en": "וירא פנחס AND PHINEAS SAW — He saw what was being done and he was thereby reminded of the law on this subject (Sanhedrin 82a). He said to Moses, “I have received a tradition from you: he who has intercourse with an Aramean (heathen) woman, zealous people may attack him”. He replied to him: “Let him who reads the letter be the agent for executing it”; — straightway, ויקח רמח בידו HE TOOK A JAVELIN IN HIS HAND, etc. (Sanhedrin 82a)."}, {"ch": 25, "v": 8, "aliyah": 7, "heb": "וַ֠יָּבֹ֠א אַחַ֨ר אִֽישׁ־יִשְׂרָאֵ֜ל אֶל־הַקֻּבָּ֗ה וַיִּדְקֹר֙ אֶת־שְׁנֵיהֶ֔ם אֵ֚ת אִ֣ישׁ יִשְׂרָאֵ֔ל וְאֶת־הָאִשָּׁ֖ה אֶל־קֳבָתָ֑הּ וַתֵּֽעָצַר֙ הַמַּגֵּפָ֔ה מֵעַ֖ל בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְעַל בָּתַר גַּבְרָא בַר יִשְׂרָאֵל לְקוּבָתָא וּבְזַע יָת תַּרְוֵיהוֹן יָת גַּבְרָא בַר יִשְׂרָאֵל וְיָת אִתְּתָא לִמְעָהָא וְאִתְכְּלִי מוֹתָנָא מֵעַל בְּנֵי יִשְׂרָאֵל:", "onk_en": "He followed the Israelite man into the inner chamber of the tent and pierced both of them through—the Israelite man and the woman through her belly—and the plague stopped from [afflicting] the Bnei Yisroel.", "pj": "תְּרֵיסְרֵי נִיסִין אִתְעֲבִידוּ לְפִּינְחָס בִּזְמַן דְעַל בָּתַר גַבְרָא בַּר יִשְרָאֵל לְוַת מִדְיָנֵיתָא. נֵס קַדְמָאֵי דַהֲוָה לֵיהּ לְמִפְרַשׁ יַתְהוֹן וְלָא פֵּירַשׁ. נֵס תִּנְיָן דְאִסְתַּתָּם פּוּמְהוֹן וְלָא צַוְוחִין דְאִילוּ הֲווֹן צַוְוחִין הֲווֹן מִשְׁתֵּזְבִין. נֵס תְּלִיתָאֵי דְכַוִון בְּרוּמְחָא וּבַרְזִינוּן כַּחֲדָא יַת גַבְרָא בַּר יִשְרָאֵל בְּבֵית גוּבְרֵיהּ וְיַת מִדְיָנֵיתָא בְּבֵית בַּהֲתַת תּוּרְפָהּ. נֵס רְבִיעָאֵי דְקָם רוּמְחָא בַּאֲתַר בִּרְוָוזָא וְלָא אִשְׁתַּמֵיט. נֵס חֲמִישָׁאֵי כַּד סוֹבַר יַתְהוֹן אִזְדְקַף שִׁיקְפָא נְטַל מִינֵיהּ עַד דְנָפֵק. נֵס שְׁתִיתָאֵי סוֹבַר יַתְהוֹן בְּכָל מַשִׁרְיָיתָא דְיִשְרָאֵל דַהֲוָה שִׁיתָּא פַרְסֵי וְלָא אִשְׁתַּלְהִי. נֵס שְׁבִיעָאֵי זַקִיפִנוּן בִּדְרַע יְמִינֵיהּ לְמֶחֱמֵי כּוּלְהוֹן קְרֵבוֹי וְלָא יָכִילוּ לְהַנְזָקוּתֵיהּ. נֵס תְּמִינָאֵי דְאִתְעֲשַׁן אָע רוּמְחָא וְלָא אִתְבַּר מִן מְטוּלָא. נֵס תְּשִׁיעָאֵי דְאִתְנְגִיד פַּרְזְלָא כְּשִׁיעוּר תַּרְוֵיהוֹן וְלָא אִשְׁתַּלִיפוּ מִנֵיהּ. נֵס עֲשִירָאֵי אָתָא מַלְאָכָא וְהָפַךְ אִתְּתָא מִלְרַע וְגַבְרָא מִלְעֵיל דְיֶחֱמוּן כָּל בֵּית יִשְרָאֵל יַת חִיסוּדֵיהוֹן. נֵס חַדְסְרָאֵי דְאִתְנַטְרוּ כַּד חַיָין עַד זְמַן דַהֲלִיךְ יַתְהוֹן בְּכָל מַשִׁרְיָיתָא מִן בִּגְלַל דְלָא יִסְתָּאָב כַּהֲנָא בְּאָהֳלֵי דְמִיתָא. נֵס תְּרֵיסְרָאֵי דְאִתְקַרִישׁ אַדְמֵיהוֹן וְלָא נָפִיל עִילַוֵיהּ כֵּיוַן דְאוֹבִיל יַתְהוֹן בְּמַשְׁרִיתָא חַבַט שַׁדַנְהִי וּמִיתוּ עָנֵי וַאֲמַר קֳדָם רִבּוֹן עַלְמָא אֶפְשַׁר דִמְטוֹל אִלְיֵין יְמוּתוּן עַשְרִין וְאַרְבַּע אַלְפִין מִיִשְרָאֵל וּמִן יַד אִתְגוֹלְלוּ רַחֲמֵי שְׁמַיָא וְאִתְכַּלְיַית מוֹתָנָא מֵעִלַוֵי בְּנֵי יִשְרָאֵל", "pj_en": "Twelve miracles were wrought for Phinehas at the time that he went in after the man of Israel with the Midianitha. The first sign was, He would have parted them but could not. 2. Their mouth was closed, that they could not cry out; for had they cried out, they would have been rescued. 3. He drave the lance through both of them. 4. The lance remained fixed in the wound. 5. When he bare them aloft, the lintel was uplifted for him until he had gone forth. 6. He carried them through the whole camp, six miles, without fatigue. 7. He held them up by his right arm, in sight of their kindred, who had no power to hurt him. 8. The lance was made strong so as not to be broken with the load. 9. The iron transpierced them, but was not withdrawn. 10. An angel came and made bare their corpses in sight of the people. 11. They lingered alive till they had been carried through the entire camp, lest the priest in the tabernacle should be defiled by the dead. 12. Their blood thickened so as not to flow upon him; but when he had borne them through the camp, it brake forth, and they died. Answering, he said before the Lord of the world, Can it be that, on account of these, twenty and four thousands of Israel shall die? Immediately the compassions of Heaven were moved, and the plague was stayed from the children of Israel.", "tj": "וְעַל בָּתַר גְבַר יִשְרָאֵל לְקוֹבְתָא וּדְקַר יַת תַּרְוֵיהוֹן יַת גַבְרָא בַּר יִשְרָאֵל וְיַת אִתְּתָא בִּקְפָדָא וְאִתְכַּלְיַית מַגֵיפְתָּא מֵעִילַוֵי בְּנֵי יִשְרָאֵל:", "tj_en": "And he went in after the man of Israel into the tent, and thrust both of them, the man and the woman, through the body; and the plague was stayed from the children of Israel.", "rashi": "<b>אל הקבה.<\/b> אֶל הָאֹהֶל:<br><br><b>אל קבתה.<\/b> כְּמוֹ \"וְהַלְּחָיַיִם וְהַקֵּבָה\" (דברים י\"ח), כִּוֵּן בְּתוֹךְ זַכְרוּת שֶׁל זִמְרִי וְנַקְבוּת שֶׁלָּהּ וְרָאוּ כֻלָּם שֶׁלֹא לְחִנָּם הֲרָגָם, וְהַרְבֵּה נִסִּים נַעֲשׂוּ לוֹ כו', כִּדְאִיתָא הָתָם:", "rashi_en": "אל הקבה means TO THE TENT.<br><br>אל קבתה means IN HER STOMACH, similar to (Deut 18:3): “And the two cheeks and the maw (והקיבה)”. He miraculously struck exactly at Zimri’s male and her female parts so that everyone could plainly perceive that he had not killed them without just cause. Many other miracles, too, were wrought for him, as is related there (Sanhedrin 82b)."}, {"ch": 25, "v": 9, "aliyah": 7, "heb": "וַיִּהְי֕וּ הַמֵּתִ֖ים בַּמַּגֵּפָ֑ה אַרְבָּעָ֥ה וְעֶשְׂרִ֖ים אָֽלֶף׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲווֹ דְמִיתוּ בְמוֹתָנָא עַשְׂרִין וְאַרְבְּעָא אַלְפִין:", "onk_en": "Those that died in the plague, [numbered] twenty-four thousand.", "pj": "וַהֲווֹ סְכוּם דְמִיתוּ בְּמוֹתָנָא עַשְרִין וְאַרְבַּע אַלְפִין", "pj_en": "And the number who died by the pestilence was twenty and four thousand.", "tj": "וַהֲווֹ אִלֵין דְמַיְיתִין בְּמַגֵיפְתָּא עֶשְ¦רִין וְאַרְבְּעָה אַלְפִין:", "tj_en": "And those who died by that plague were twenty and four thousand.", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});
