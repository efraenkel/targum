": "", "rashi": "<b>לא יקח.<\/b> אֵין לוֹ בָּהּ לִקּוּחִין וְאֵין קִדּוּשִׁין תּוֹפְסִין בָּהּ (עי' קידושין ס\"ז):<br><br><b>ולא יגלה כנף אביו.<\/b> שׁוֹמֶרֶת יָבָם שֶׁל אָבִיו הָרְאוּיָה לְאָבִיו, וַהֲרֵי כְּבָר הֻזְהַר עָלֶיהָ מִשּׁוּם עֶרְוַת אֲחִי אָבִיךָ (ויקרא י\"ח) אֶלָּא לַעֲבֹר עַל זוֹ בִּשְׁנֵי לָאוִין, וְלִסְמֹךְ לָהּ לֹא יָבֹא מַמְזֵר, לְלַמֵּד שֶׁאֵין מַמְזֵר אֶלָּא מֵחַיָּבֵי כָּרֵתוֹת, וְקַל וָחֹמֶר מֵחַיָּבֵי מִיתוֹת בֵּית דִּין, שֶׁאֵין בָּעֲרָיוֹת מִיתַת בֵּית דִּין שֶׁאֵין בָּהּ כָּרֵת (יבמות מ\"ט):", "rashi_en": "לא יקח — This does not mean “he shall not take” but “he cannot take” his father’s wife: there can be no question of a legal marriage for him in regard to her, because the marriage ceremony (קדושין) has no legal hold on her (cannot make her his wife: it is no marriage) (Kiddushin 67b; cf. Rashi on Kiddushin 67b s. v. לא יקח) <br><br>ולא יגלה כנף אביו  AND HE SHALL NOT UNCOVER HIS FATHER’S SKIRT — This refers to the שומרת יבם of his father (the widow of his father’s brother who died without issue, and who is waiting (שומרת) for her brother-in-law (יבם) either to marry her or to put her through the ceremony of release, חליצה), who is thus destined for his father. But has he not already been prohibited about her (i.e. forbidden to marry her) on account of the law (Leviticus 18:14) “the nakedness of thy father’s brother [thou shalt not uncover]”?! But the prohibition is repeated here in order to make him transgress two negative commands if he takes her (Yevamot 4a), and in order to put into juxtaposition to it the law (v. 2) “one born of incest or adultery (ממזר) shall not come [into the assembly of the Lord]”, and thereby to teach that one is termed ממזר only if he is born from those liable to the penalty of excision on account of the intercourse between them, as is the case with one who take’s his father’s שומרת יבם, who is forbidden to him under the penalty of כרת as אשת אחי אביו; cf. Leviticus 18:14 and Leviticus 18:29 (but not if he was born of a woman intercourse with whom involves only flagellation), and it logically follows that the term applies also to one born from those liable to one of the death penalties by sentence of the court, for amongst the cases of forbidden intercourse there is none punishable with death by the sentence of the court which does not involve the penalty of excision (if it was not preceded by a warning) (Yevamot 49a; cf. also Rashi on Kiddushin 67b s. v. מהנ״מ). "}, {"ch": 23, "v": 2, "aliyah": 3, "heb": "לֹֽא־יָבֹ֧א פְצֽוּעַ־דַּכָּ֛א<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ורוב ספרי אשכנז דַּכָּ֛ה)<\/i> וּכְר֥וּת שׇׁפְכָ֖ה בִּקְהַ֥ל יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא <b>יִדְכֵּי<\/b> דְפָסִיק וְדִמְחַבַּל לְמֵעַל בִּקְהָלָא דַיְיָ:", "onk_en": "One may not [<b>be “cleansed” to<\/b>] enter—with injured or crushed genitals or with a gash causing spilling—into Adonoy’s community.", "pj": "לָא יִדְכֵּי דִמְסָרֵיס וּדְפָסִיק גִידָא לְמִיסַב אִיתָא מִקְהַל עַמָּא דַיְיָ", "pj_en": "He who is castrated is not fit to take a wife from the congregation of the Lord’s people.", "tj": "", "tj_en": "", "rashi": "<b>פצוע דכה.<\/b> שֶׁנִּפְצְעוּ אוֹ שֶׁנִּדְכְּאוּ בֵיצִים שֶׁלּוֹ:<br><br><b>וכרות שפכה.<\/b> שֶׁנִּכְרַת הַגִּיד וְשׁוּב אֵינוֹ יוֹרֶה קִלּוּחַ זֶרַע אֶלָּא שׁוֹפֵךְ וְשׁוֹתֵת וְאֵינוֹ מוֹלִיד (ספרי; יבמות ע'):", "rashi_en": "פצוע דכא means, one whose stones have been bruised (פצוע) or crushed (דכא) (Sifrei Devarim 247:1).<br><br>וכרות שפכה means, one whose membrum has a cut in it, so that it no longer forcibly ejects a continuous flow of sperm but it pours it forth slowly, and he thus cannot beget children (Sifrei Devarim 247:2; Yevamot 75b)."}, {"ch": 23, "v": 3, "aliyah": 3, "heb": "לֹא־יָבֹ֥א מַמְזֵ֖ר בִּקְהַ֣ל יְהֹוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא־יָ֥בֹא ל֖וֹ בִּקְהַ֥ל יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא <b>יִדְכֵּי<\/b> מַמְזֵרָא <b>לְמֵעַל<\/b> בִּקְהָלָא דַיְיָ אַף דָּרָא עֲשִׂירָאָה לָא <b>יִדְכֵּי<\/b> לֵיהּ לְמֵעַל בִּקְהָלָא דַיְיָ:", "onk_en": "A base-born may not [<b>be “cleansed” to<\/b>] enter into Adonoy’s community, even his tenth generation may not [<b>“cleanse” him<\/b>] enter into Adonoy’s community.", "pj": "לָא יִדְכֵּי דְמִתְיְלִיד מִן זְנוּ דְבֵיהּ מוּמָא בִּישָׁא דְאִיתְיְהִיב בְּעַמְמַיָא חוֹלוֹנָאֵי לְמֵיסַב אִיתָא כַּשְׁרָא מִקְהַל עַמָּא דַיְיָ אוֹף דּוֹר עֲשִירָאֵי לָא יִדְכֵּי לֵיהּ לְמֵיעַל בִּקְהָלָא דַיְיָ", "pj_en": "He who is born of fornication, or who hath upon him the evil mark which is set upon the unclean Gentiles, is not fit to take an upright wife from the congregation of the people of the Lord; nor unto the tenth generation shall it be fit for him to enter into the congregation of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לא יבא ממזר בקהל ה'.<\/b> לֹא יִשָּׂא יִשְׂרְאֵלִית:", "rashi_en": "לא יבא ממזר בקהל ה׳ ONE BORN IN INCEST OR ADULTERY SHALL NOT COME INTO THE ASSEMBLY OF THE LORD — i.e. he shall not marry an Israelite woman (Yevamot 78b)."}, {"ch": 23, "v": 4, "aliyah": 3, "heb": "לֹֽא־יָבֹ֧א עַמּוֹנִ֛י וּמוֹאָבִ֖י בִּקְהַ֣ל יְהֹוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא־יָבֹ֥א לָהֶ֛ם בִּקְהַ֥ל יְהֹוָ֖ה עַד־עוֹלָֽם׃", "onk": "לָא <b>יִדְכּוּן<\/b> עַמּוֹנָאֵי וּמוֹאָבָאֵי <b>לְמֵעַל<\/b> בִּקְהָלָא דַיְיָ אַף דָּרָא עֲשִׂירָאָה לָא <b>יִדְכֵּי<\/b> לְהוֹן <b>לְמֵעַל<\/b> בִּקְהָלָא דַיְיָ עַד עֳלָם:", "onk_en": "[Neither] an Ammonite nor a Moavite may [<b>be “cleansed” to<\/b>] enter into Adonoy’s community; even their tenth generation may not [<b>be “cleansed” to<\/b>] enter into Adonoy’s community forever.", "pj": "לָא יִדְכּוּן דְּכוּרֵי עַמּוֹנָאֵי וּמוֹאֲבָאֵי לְמֵיסַב אִיתָא מִקְהַל עַמָּא דַיְיָ בְּרַם דַּר עֲשִירָאֵי לָא יִדְכֵּי לְמֵיסַב אִיתָא מִקְהַל עַמָּא דַיְיָ עַד עָלְמָא", "pj_en": "Neither an Ammonite nor a Moabite man is fit to take a wife from the congregation of the Lord’s people, nor unto the tenth generation shall they take a wife from the congregation of the people of the Lord,", "tj": "", "tj_en": "", "rashi": "<b>לא יבא עמוני.<\/b> לֹא יִשָּׂא יִשְׂרְאֵלִית:", "rashi_en": "לא יבא עמוני AN AMONITE [OR MOABITE] SHALL NOT COME [INTO THE ASSEMBLY OF THE LORD] — i.e. he shall not marry an Israelite woman (Yevamot 77b)."}, {"ch": 23, "v": 5, "aliyah": 3, "heb": "עַל־דְּבַ֞ר אֲשֶׁ֨ר לֹא־קִדְּמ֤וּ אֶתְכֶם֙ בַּלֶּ֣חֶם וּבַמַּ֔יִם בַּדֶּ֖רֶךְ בְּצֵאתְכֶ֣ם מִמִּצְרָ֑יִם וַאֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜יךָ אֶת־בִּלְעָ֣ם בֶּן־בְּע֗וֹר מִפְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְקַֽלְלֶֽךָּ׃", "onk": "עַל <b>עֵסַק<\/b> דִּי לָא עֲרָעוּ יָתְכוֹן בְּלַחְמָא וּבְמַיָּא בְּאָרְחָא בְּמִפָּקְכוֹן מִמִּצְרָיִם וְדִי אֲגַר עֲלָךְ יָת בִּלְעָם בַּר בְּעוֹר מִפְּתוֹר אֲרַם <b>דִּי עַל פְּרָת<\/b> לְלַטָּיוּתָךְ:", "onk_en": "Because of the matter that they did not greet you with bread and water on the way when you came out of Egypt; and because he hired against you Bilam son of Beor from Pesor in Aram Naharayim [<b>on the river Peras<\/b>] to curse you.", "pj": "עַל עֵיסַק דְּלָא זְמִינוּ לְכוֹן בְּלַחֲמָא וּבְמוֹי בְּאָרְחָא בְּמִפַּקְכוֹן מִמִּצְרַיִם וּדְאוֹגַר לְכוֹן יַת בִּלְעָם בַּר בְּעוֹר מִן פְּתוֹר חֶלְמַיָא דְּמִתְבַּנְיָא בְּאַרַע אֲרַם דְּעַל פְּרָת לְמֵילַט יַתְכוֹן", "pj_en": "because they met you not with bread and water in the way when you came from Mizraim, but hired against you Bileam bar Beor from Petho Chelmaya, which is built in the land of Aram upon the Phrat, to curse you;", "tj": "", "tj_en": "", "rashi": "<b>על דבר.<\/b> עַל הָעֵצָה שֶׁיָּעֲצוּ אֶתְכֶם לְהַחֲטִיאֲכֶם:<br><br><b>בדרך.<\/b> כְּשֶׁהֱיִיתֶם בְּטֵרוּף (ספרי):", "rashi_en": "על דבר may be translated BECAUSE OF THE WORD — i.e. because of the advice which they gave you in order to entice you into sin (Sifrei Devarim 250:1).<br><br>בדרך IN THE WAY — when you were in a state of exhaustion (Sifrei Devarim 250:2)."}, {"ch": 23, "v": 6, "aliyah": 3, "heb": "וְלֹֽא־אָבָ֞ה יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ לִשְׁמֹ֣עַ אֶל־בִּלְעָ֔ם וַיַּהֲפֹךְ֩ יְהֹוָ֨ה אֱלֹהֶ֧יךָ לְּךָ֛ אֶת־הַקְּלָלָ֖ה לִבְרָכָ֑ה כִּ֥י אֲהֵֽבְךָ֖ יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וְלָא אָבֵי יְיָ אֱלָהָךְ לְקַבָּלָא מִן בִּלְעָם וַהֲפַךְ יְיָ אֱלָהָךְ לָךְ יָת <b>לְוָטִין לְבִרְכָן<\/b> אֲרֵי רָחֲמָךְ יְיָ אֱלָהָךְ:", "onk_en": "Adonoy, your God, was unwilling to heed Bilam, and Adonoy, your God, turned for you the curse[<b>s<\/b>] into a blessing[<b>s<\/b>], because Adonoy, your God, loved you.", "pj": "וְלָא צָבָא יְיָ אֱלָהָכוֹן לְקַבָּלָא מִן בִּלְעָם וְהָפַךְ יְיָ אֱלָהָכוֹן בְּפוּמֵיהּ מְטוֹלְכוֹן יַת לְוָוטִין לְבִרְכַן אֲרוּם רָחֵמִינְכוֹן יְיָ אֱלָהָכוֹן", "pj_en": "but the Lord your God would not hearken unto Bileam, but turned in his mouth curses into blessings, because the Lord your God loveth you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 7, "aliyah": 3, "heb": "לֹא־תִדְרֹ֥שׁ שְׁלֹמָ֖ם וְטֹבָתָ֑ם כׇּל־יָמֶ֖יךָ לְעוֹלָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תִתְבַּע שְׁלָמְהוֹן וְטָבָתְהוֹן כָּל יוֹמָיךְ לְעָלָם:", "onk_en": "Do not pursue their peace and their benefit all your life forever.", "pj": "לָא תִתְבְּעוּן שְׁלָמְהוֹן וְטָבְהוֹן כָּל יוֹמֵיכוֹן דַּאֲפִלּוּ מִתְגַיְירִין סְנָא נְטִיר בְּלִבְּהוֹן עַד עַלְמָא", "pj_en": "Ye shall not seek their peace or, their prosperity all your days, because, if even they become proselytes, they will entertain enmity in their hearts for ever.", "tj": "", "tj_en": "", "rashi": "<b>לא תדרש שלמם.<\/b> מִכְּלָל שֶׁנֶּאֱמַר עִמְּךָ יֵשֵׁב בְּקִרְבְּךָ יָכוֹל אַף זֶה כֵּן, תַּ\"לֹ <b>לא תדרש שלמם<\/b> (עי' ספרי):", "rashi_en": "לא תדרש שלמם THOU SHALT NOT SEEK THEIR PEACE [NOR THEIR GOOD] — Since it states, (v. 17) “He (the runaway slave) shall abide with you, even among you, … [where it shall be good for him]” one might think that this (a Moabite or Ammonite runaway slave) should also be treated likewise, therefore Scripture states לא תדרש שלמם THOU SHALT NOT SEEK THEIR PEACE [NOR THEIR GOOD] (Sifrei Devarim 251:2)."}, {"ch": 23, "v": 8, "aliyah": 4, "heb": "לֹֽא־תְתַעֵ֣ב אֲדֹמִ֔י כִּ֥י אָחִ֖יךָ ה֑וּא לֹא־תְתַעֵ֣ב מִצְרִ֔י כִּי־גֵ֖ר הָיִ֥יתָ בְאַרְצֽוֹ׃", "onk": "לָא <b>תְרַחַק<\/b> אֱדוֹמָאָה אֲרֵי אֲחוּךְ הוּא לָא <b>תְרַחַק<\/b> מִצְרָאָה אֲרֵי דַיָּר הֲוֵיתָא בְאַרְעֵיהּ:", "onk_en": "Do not despise [<b>distance<\/b>] the Edomite, for he is your brother; do not despise [<b>distance<\/b>] the Egyptian, for you were a stranger in his land.", "pj": "לָא תְרַחֲקוּן אֱדוֹמָאָה דְאָתֵי לְאִתְגַיְירָא אֲרוּם אֲחוּכוֹן הוּא לָא תְרַחֲקִין מִצְרָאָה דְּאָתֵי לְאִתְגַיְירָא אֲרוּם דַּיְירוּן הֲוֵיתוּן בְּאַרְעֲהוֹן", "pj_en": "You shall not abhor an Edomite when he cometh to be a proselyte, for he is your brother; nor shall you abhor a Mizraite, because you were dwellers in their land.", "tj": "", "tj_en": "", "rashi": "<b>לא תתעב אדמי.<\/b> לְגַמְרֵי, וְאַעַ\"פִּ שֶׁרָאוּי לְךָ לְתַעֲבוֹ שֶׁיָּצָא בַּחֶרֶב לִקְרָאתֶךָ:<br><br><b>לא תתעב מצרי.<\/b> מִכֹּל וָכֹל, אַף עַל פִּי שֶׁזָּרְקוּ זְכוּרֵיכֶם לַיְאוֹר. מַה טַּעַם? שֶׁהָיוּ לָכֶם אַכְסַנְיָא בִּשְׁעַת הַדְּחָק. לְפִיכָךְ —", "rashi_en": "לא תתעב אדמי THOU SHALT NOT ABHOR AN EDOMITE utterly, although it would be proper for you to abhor him because he came out against thee with the sword (Numbers 20:18—20).<br><br>לא תתעב מצרי THOU SHALT NOT ABHOR AN EGYPTIAN all in all (utterly), although they cast your male children into the river. And what is the reason that you should not abhor him utterly? Because they were your hosts in time of need (during Joseph’s reign when the neighbouring countries suffered from famine); therefore although they sinned against you do not utterly abhor him, but — "}, {"ch": 23, "v": 9, "aliyah": 4, "heb": "בָּנִ֛ים אֲשֶׁר־יִוָּלְד֥וּ לָהֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָהֶ֖ם בִּקְהַ֥ל יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּנִין דִּי יִתְיְלִידוּ לְהוֹן דָּרָא תְלִיתָאָה <b>יִדְכֵּי<\/b> לְהוֹן <b>לְמֵעַל<\/b> בִּקְהָלָא דַיְיָ:", "onk_en": "Children who will be born to them, in the third generation, will [<b>be “cleansed” to<\/b>] enter into Adonoy’s community.", "pj": "בְּנִין דְּמִתְיַלְדִין לְהוֹן דַּר תְּלִיתָאָה יִדְכּוּן לְמִסְבָּא מֵעַם קְהָלָה דַיְיָ", "pj_en": "The children who are born to them in the third generation shalt be fit to take wives from the people of the congregation of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>בנים אשר יולדו להם דור שלישי וגו'.<\/b> וּשְׁאָר אֻמּוֹת מֻתָּרִים מִיָּד, הָא לָמַדְתָּ שֶׁהַמַּחֲטִיא לָאָדָם קָשֶׁה לוֹ מִן הַהוֹרְגוֹ, שֶׁהַהוֹרְגוֹ הוֹרְגוֹ בָעוֹלָם הַזֶּה וְהַמַּחֲטִיאוֹ מוֹצִיאוֹ מִן הָעוֹלָם הַזֶּה וּמִן הָעוֹלָם הַבָּא, לְפִיכָךְ אֱדוֹם שֶׁקִּדְּמָם בַּחֶרֶב לֹא נִתְעַב, וְכֵן מִצְרַיִם שֶׁטִּבְּעוּם, וְאֵלּוּ שֶׁהֶחֱטִיאוּם נִתְעֲבוּ (ספרי):", "rashi_en": "בנים אשר יולדו להם דור שלישי וגומר THE CHILDREN THAT ARE BORN UNTO THEM [MAY COME INTO THE ASSEMBLY] IN THEIR THIRD GENERATION — other nations, however, since they did not sin against you may be admitted at once if they acknowledge the tenets of Judaim. — Thus you learn that he who causes a man to sin does him greater harm than if he kills him, for he who kills him, kills him only as regards this world, while he who causes him to sin puts him out of this world and the world to come. Therefore Edom, though he met them with the sword was not to be abhorred utterly, and similarly the Egyptians who drowned them (their male children), while those (the Ammonites and Moabites) who caused them to sin were to be utterly abhorred (Sifrei Devarim 252:3)."}, {"ch": 23, "v": 10, "aliyah": 4, "heb": "כִּֽי־תֵצֵ֥א מַחֲנֶ֖ה עַל־אֹיְבֶ֑יךָ וְנִ֨שְׁמַרְתָּ֔ מִכֹּ֖ל דָּבָ֥ר רָֽע׃", "onk": "אֲרֵי תִפּוֹק מַשְׁרִיתָא עַל בַּעֲלֵי דְבָבָךְ וְתִסְתַּמַּר מִכֹּל מִדַּעַם בִּישׁ:", "onk_en": "When you go out to encamp against your enemies take precautions from every evil thing.", "pj": "אֲרוּם תִּפְקוֹן מַשִׁירְוַיָן עַל בַּעֲלֵי דְבָבֵיכוֹן וְתִסְתַּמְּרוּן מִכָּל פִּתְגָם דְּבִישׁ מִפּוּלְחָנָא נוּכְרַיָא וְגִילוּי עֶרְיְיתָא וְשַׁדְיוּת אֲדַם זַכַּאי", "pj_en": "When you go forth in hosts against your enemies, beware of every evil thing, of strange worship, the, exposure of the shame, and the shedding of innocent blood.", "tj": "", "tj_en": "", "rashi": "<b>כי תצא וגו' … ונשמרת.<\/b> שֶׁהַשָּׂטָן מְקַטְרֵג בִּשְׁעַת הַסַּכָּנָה (תלמוד ירושלמי שבת ב'):", "rashi_en": "כי תצא וגו׳ ונשמרת WHEN [THE HOST] GOETH FORTH [AGAINST THINE ENEMIES], THEN KEEP THEE [FROM EVERY EVIL THING] — because Satan accuses men in time of danger (Jerusalem Talmud Shabbat 2:6; Midrash Tanchuma, Vayigash 1 on Genesis 42:4; cf. Rashi on that verse and our Note thereon)."}, {"ch": 23, "v": 11, "aliyah": 4, "heb": "כִּֽי־יִהְיֶ֤ה בְךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא־יִהְיֶ֥ה טָה֖וֹר מִקְּרֵה־לָ֑יְלָה וְיָצָא֙ אֶל־מִח֣וּץ לַֽמַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל־תּ֥וֹךְ הַֽמַּחֲנֶֽה׃", "onk": "אֲרֵי יְהֵי בָךְ גְּבַר דִּי לָא יְהֵי דְכֵי מִקְּרֵה לֵילְיָא וְיִפּוֹק לְמִבָּרָא לְמַשְׁרִיתָא לָא יֵעוּל לְגוֹ מַשְׁרִיתָא:", "onk_en": "If there is a man among you who is not undefiled [because of] a nocturnal incident; he must go out of the camp, he may not enter into the midst of the camp.", "pj": "אֲרוּם יְהֵי בָךְ גְּבַר דְּלָא יְהֵי דְכֵי מִקִּרְיוּת הִרְהוּר לֵילְיָא וְיִפּוֹק לְמִבָּרָא לְמַשְׁרִיתָא לָא יֵיעוֹל לְמִצּוּעַ מַשְׁרִיתָא", "pj_en": "Should there be a man among you who is unclean from accidents of the night, let him go without the camp, and come not among the tents.", "tj": "", "tj_en": "", "rashi": "<b>מקרה לילה.<\/b> דִּבֵּר הַכָּתוּב בַּהוֹוֶה (ספרי):<br><br><b>ויצא אל מחוץ למחנה.<\/b> זוֹ מִצְוַת עֲשֵׂה:<br><br><b>לא יבא אל תוך המחנה.<\/b> זוֹ מִצְוַת לֹא תַעֲשֶׂה (שם), וְאָסוּר לִכָּנֵס לְמַחֲנֵה לְוִיָּה, וְכָל שֶׁכֵּן לְמַחֲנֵה שְׁכִינָה (עי' פסחים ס\"ח):", "rashi_en": "מקרה לילה [IF THERE BE AMONG YOU ANY MAN THAT IS NOT CLEAN BY REASON OF] UNCLEANNESS THAT CHANCETH HIM BY NIGHT — By night: Scripture speaks of what usually occurs (but the law applies also if the uncleanness happens at day time) (Sifrei Devarim 255:3).<br><br>ויצא אל מחוץ למחנה THEN HE SHALL GO ABROAD OUT OF THE CAMP — This is a command,<br><br>לא יבא אל תוך המחנה HE SHALL NOT COME WITHIN THE CAMP — This is a prohibition (Sifrei Devarim 255:4). He is forbidden to enter the “camp of the Levites”, and all the more so, the \"camp of the Shechinah\". (cf. Sifrei Devarim 255:5; Pesachim 68a and Rashi on Numbers 5:2)."}, {"ch": 23, "v": 12, "aliyah": 4, "heb": "וְהָיָ֥ה לִפְנֽוֹת־עֶ֖רֶב יִרְחַ֣ץ בַּמָּ֑יִם וּכְבֹ֣א הַשֶּׁ֔מֶשׁ יָבֹ֖א אֶל־תּ֥וֹךְ הַֽמַּחֲנֶֽה׃", "onk": "וִיהֵי לְמִפְנֵי רַמְשָׁא יַסְחֵי בְמַיָּא וּכְמֵעַל שִׁמְשָׁא יֵעוּל לְגוֹ מַשְׁרִיתָא:", "onk_en": "As sunset nears he is to immerse in water; and after the sun has set he may enter the the midst of the camp.", "pj": "וִיהֵי לְעִידוֹנֵי רַמְשָׁא יַסְחֵי בְּמוֹי וּכְמִטְמוֹעַ שִׁמְשָׁא יֵיעוֹל לְגוֹ מַשְׁרִיתָא", "pj_en": "But at evening time let him wash with water, and on the going down of the sun he may come within the camp.", "tj": "וְיֶהֱוֵי לְעִדָנוֹי רַמְשָׁא יַשְׁזֵג בְּמַיָא:", "tj_en": "And at evening let him bathe with water.", "rashi": "<b>והיה לפנות ערב.<\/b> סָמוּךְ לְהֶעֱרֵב שִׁמְשׁוֹ יִטְבֹּל, שֶׁאֵינוֹ טָהוֹר בְּלֹא הֶעֱרֵב הַשֶּׁמֶשׁ (עי' ספרי):", "rashi_en": "והיה לפנות ערב BUT IT SHALL BE WHEN EVENING COMETH ON, [HE SHALL LAVE HIMSELF WITH WATER] — He should immerse himself close before the setting of the sun, for under no circumstances is he clean without having waited for the sunset (cf. Sifrei Devarim 256:2)."}, {"ch": 23, "v": 13, "aliyah": 4, "heb": "וְיָד֙ תִּהְיֶ֣ה לְךָ֔ מִח֖וּץ לַֽמַּחֲנֶ֑ה וְיָצָ֥אתָ שָּׁ֖מָּה חֽוּץ׃", "onk": "וַאֲתַר <b>מְתַקָּן<\/b> יְהֵי לָךְ מִבָּרָא לְמַשְׁרִיתָא וְתִפּוֹק תַּמָּן לְבָרָא:", "onk_en": "Have a designated [<b>prepared<\/b>] place outside the camp, and you will go out there to excrete.", "pj": "וְאָתַר מְזַמֵּן יֶהֱוֵי לָךְ מִבָּרָא לְמַשְׁרִיתָא וּתְשׁוּד תַּמָן מוֹי דְרִגְלָךְ", "pj_en": "Let a place be prepared for thee without the camp where thou mayest shed the water of thy feet,", "tj": "", "tj_en": "", "rashi": "<b>ויד תהיה לך.<\/b> כְּתַרְגּוּמוֹ, כְּמוֹ אִישׁ עַל יָדוֹ (במדבר ב'):<br><br><b>מחוץ למחנה.<\/b> חוּץ לֶעָנָן:", "rashi_en": "ויד תהיה לך THOU SHALT HAVE A יד [WITHOUT THE CAMP] — Understand the word יד as the Targum does: ואתר (and you shall have a place). Similar is, (Numbers 2:17) “Each man at his place (ידו)” (Sifrei Devarim 257:1).<br><br>מחוץ למחנה WITHOUT THE CAMP — i.e. outside the area enclosed by the clouds of glory."}, {"ch": 23, "v": 14, "aliyah": 4, "heb": "וְיָתֵ֛ד תִּהְיֶ֥ה לְךָ֖ עַל־אֲזֵנֶ֑ךָ וְהָיָה֙ בְּשִׁבְתְּךָ֣ ח֔וּץ וְחָפַרְתָּ֣ה בָ֔הּ וְשַׁבְתָּ֖ וְכִסִּ֥יתָ אֶת־צֵאָתֶֽךָ׃", "onk": "וְסִכְּתָא תְּהֵי לָךְ עַל זֵינָךְ וִיהֵי בְּמִתְבָךְ לְבָרָא וְתַחְפַּר בַּהּ וּתְתוּב וּתְכַסֵּי יָת מִפְּקָתָךְ:", "onk_en": "And a peg are you to have in addition to your weapons; when you need to sit to excrete dig with it, then use it again to cover your excrement.", "pj": "וְסִיכָא תֶהֱוֵי קְבִיעָא לְכוֹן עַל מָנֵי זֵינֵיכוֹן אֲתַר דְּתִסְרוּן סְיָיפֵיכוֹן וִיהֵי בְּמִתְבָךְ לְבָרָא וְתֶהֱוֵי חָפַר בָּהּ וְתִפְנֵי תַמָּן וּתְתוּב וּתְכַס יַת רַעֲיָיךְ", "pj_en": "and insert a blade with your weapon in the place oil which you bind your swords, and in thy sitting without thou shalt dig with it, and do what thou needest there, and turn and cover it.", "tj": "", "tj_en": "", "rashi": "<b>על אזנך.<\/b> לְבַד מִשְּׁאָר כְּלֵי תַּשְׁמִישְׁךָ:<br><br><b>אזנך.<\/b> כְּמוֹ כְּלִי זַיִן:", "rashi_en": "על אזנך [AND THOU SHALT HAVE A PIN] על אזנך — i.e. besides (על, “in addition to”, not “upon”) your other implements.<br><br>אזנך has the same meaning as זין in the phrase כלי זין. "}, {"ch": 23, "v": 15, "aliyah": 4, "heb": "כִּי֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ מִתְהַלֵּ֣ךְ&thinsp;<b>׀<\/b> בְּקֶ֣רֶב מַחֲנֶ֗ךָ לְהַצִּֽילְךָ֙ וְלָתֵ֤ת אֹיְבֶ֙יךָ֙ לְפָנֶ֔יךָ וְהָיָ֥ה מַחֲנֶ֖יךָ קָד֑וֹשׁ וְלֹֽא־יִרְאֶ֤ה בְךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְשָׁ֖ב מֵאַחֲרֶֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי יְיָ אֱלָהָךְ <b>שְׁכִנְתֵּיהּ<\/b> מְהַלְּכָא בְּגוֹ מַשְׁרִיתָךְ לְשֵׁזָבוּתָךְ וּלְמִמְסַר בַּעֲלֵי דְבָבָךְ קֳדָמָךְ וּתְהֵי מַשְׁרִיתָךְ קַדִּישָׁא וְלָא יִתְחֲזֵי בָךְ <b>עֲבֵרַת פִּתְגָּם<\/b> וִיתוּב <b>מֵימְרֵיהּ מִלְּאוֹטָבָא לָךְ<\/b>:", "onk_en": "For Adonoy, your God, [<b>His Shechinah<\/b>] is moving within your camp to save you and to defeat your enemies before you, so your camp must be holy; let Him not see within you disgraceful [<b>offensive<\/b>] objects lest He [<b>His word<\/b>] turn away from you [<b>from benefiting you<\/b>].", "pj": "אֲרוּם יְיָ אֱלָהָכוֹן שְׁכִינְתֵּיהּ מְהַלְכָא בִמְצַע מַשִּׁירְיַתְכוֹן לְשֵׁיזָבוּתְכוֹן וּלְמִימְסַר סַנְאֵיכוֹן בִּידֵיכוֹן בְּגִין כֵּן תְּהֵי אֲתַר מַשִּׁרְיַתְכוֹן קַדִּישָׁא וְלָא יֶחֱמֵי בְכוֹן קְלָנָא דְּמִדַּעַם דְּלָא יְסַלֵּק שְׁכִינְתֵּיהּ מִבֵּינֵיכוֹן", "pj_en": "For the Shekinah of the Lord thy God walketh in the midst of thy camp to save you, and to deliver your enemies into your hands; therefore shall the place of your camps be holy, and nothing impure be seen in it, that His Shekinah go not up from you.", "tj": "", "tj_en": "", "rashi": "<b>ולא יראה בך.<\/b> הַקָּבָּ\"ה <b>ערות דבר<\/b>:", "rashi_en": "ולא יראה בך THAT HE SEE NOT IN THEE — that the Holy One, blessed be He see not in thee ערות דבר A NAKEDNESS OF ANYTHING."}, {"ch": 23, "v": 16, "aliyah": 4, "heb": "לֹא־תַסְגִּ֥יר עֶ֖בֶד אֶל־אֲדֹנָ֑יו אֲשֶׁר־יִנָּצֵ֥ל אֵלֶ֖יךָ מֵעִ֥ם אֲדֹנָֽיו׃", "onk": "לָא <b>תִמְסַר<\/b> עֶבֶד <b>עַמְמִין לְיַד<\/b> רִבּוֹנֵיהּ דְּיִשְׁתֵּזֵב לְוָתָךְ מִלְּוָת רִבּוֹנֵיהּ:", "onk_en": "Do not deliver a [<b>foreign<\/b>] slave to [<b>the hand of<\/b>] his master, who escaped to you from his master.", "pj": "לָא תִימְסוֹר נוּכְרָאָה בִּידָא פַּלְחֵי טַעֲוָותֵי דְּאִישְׁתְּזִיב גַּבֵּיכוֹן לְמֶהֱוֵי תְּחוֹת טְלַל שְׁכִינְתִּי דְיִמְטוֹל הֵיכְנָא עֲרַק מִן פּוּלְחַן טָעוּתֵיהּ", "pj_en": "Thou shalt not deliver up a stranger into the hand of the worshipper of idols; (the sojourner) who hath escaped to be among you shall be under the protection of My Shekinah; for therefore he hath fled from his idolatry.", "tj": "", "tj_en": "", "rashi": "<b>לא תסגיר עבד.<\/b> כְּתַרְגּוּמוֹ; דָּ\"אַ — אֲפִלּוּ עֶבֶד כְּנַעֲנִי שֶׁל יִשְׂרָאֵל שֶׁבָּרַח מִחוּצָה לָאָרֶץ לְאֶרֶץ יִשְׂרָאֵל (גיטין מ\"ה):", "rashi_en": "לא תסגיר עבד THOU SHALT NOT DELIVER [UNTO HIS LORD] THE SERVANT [WHO IS ESCAPED FROM HIS LORD UNTO THEE] — Understand this as the Targum has it: עבד עממין the servant of the heathens. Another explanation is: that it implies even a Canaanite servant belonging to an Israelite who fled from outside the Land (from a foreign country) into the Land of Israel (Gittin 45a)."}, {"ch": 23, "v": 17, "aliyah": 4, "heb": "עִמְּךָ֞ יֵשֵׁ֣ב בְּקִרְבְּךָ֗ בַּמָּק֧וֹם אֲשֶׁר־יִבְחַ֛ר בְּאַחַ֥ד שְׁעָרֶ֖יךָ בַּטּ֣וֹב ל֑וֹ לֹ֖א תּוֹנֶֽנּוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עִמָּךְ יִתֵּב בֵּינָךְ בְּאַתְרָא דִּי יִתִּרְעֵי בַּחֲדָא מִן <b>קִרְוָיךְ<\/b> בִּדְיֵיטַב לֵיהּ לָא תוֹנִנֵּיהּ:", "onk_en": "With you will he live among you, in the place that he chooses in any of your cities, wherever it is good for him; do not distress him.", "pj": "עִמְכוֹן יָתֵיב וְיִנְטוֹר מִצְוָתָא בֵּינֵיכוֹן אַלִּיפוּ יָתֵיהּ אוֹרַיְיתָא קָבְעוּ לֵיהּ מֶדְרָשָׁא בְּאַתְרָא דְצָבֵי בַּחֲדָא מִן קִרְיֵיכוֹן אִתְעַסְקוּ עִמֵּיהּ בִּדְיוֹטִיב לֵיהּ לָא תוֹנִינֵיהּ בְּמִלִּין", "pj_en": "Let him dwell with you, and observe the commandments among you; teach him the law, and put him in a school in the place that he chooseth in one of your cities: employ (or, have business with) him, that he may do well, and trouble him not by words.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 18, "aliyah": 4, "heb": "לֹא־תִהְיֶ֥ה קְדֵשָׁ֖ה מִבְּנ֣וֹת יִשְׂרָאֵ֑ל וְלֹֽא־יִהְיֶ֥ה קָדֵ֖שׁ מִבְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "לָא תְהֵי <b>אִתְּתָא<\/b> מִבְּנַת יִשְׂרָאֵל <b>לִגְבַר עָבֵד<\/b> וְלָא יִסַּב <b>גַּבְרָא<\/b> מִבְּנֵי יִשְׂרָאֵל <b>אִתְּתָא אָמָא<\/b>:", "onk_en": "There is not to be a [<b>woman<\/b>] harlot from the daughters of Yisroel [<b>to a man slave<\/b>]; and there shall not be a [<b>man<\/b>] male prostitute from the sons of Yisroel [<b>to a woman servant<\/b>].", "pj": "לָא תִפְסוּן בְּנָתֵיכוֹן לְמֶהֱוֵי נְפָקַת בָּרָא וְלָא יִתְפַּס גַּבְרָא בַּר יִשְרָאֵל יַת גַּרְמֵיהּ בִּזְנוּ", "pj_en": "You shall not profane your daughters to make them harlots; nor shall any man of Israel debase himself by fornication.", "tj": "לָא תֶהֱוֵי נַפְקַת בְּרָא מִבְּנַתְהוֹן דְּבֵית יִשְרָאֵל וְלָא יֶהֱוֵי נְפַק בַּר מִן בְּנֵי יִשְרָאֵל:", "tj_en": "There shall not be a harlot among the daughters of the house of Israel, nor a whoremonger among the sons of Israel.", "rashi": "<b>לא תהיה קדשה.<\/b> מֻפְקֶרֶת מְקֻדֶּשֶׁת וּמְזֻמֶּנֶת לִזְנוּת:<br><br><b>ולא יהיה קדש.<\/b> מְזֻמָּן לְמִשְׁכַּב זְכוּר; וְאֻנְקְלוֹס תִּרְגֵּם \"לָא תְהֵא אִתְּתָא מִבְּנָת יִשְׂרָאֵל לִגְבַר עָבֵד\", שֶׁאַף זוֹ מֻפְקֶרֶת לִבְעִילַת זְנוּת הִיא, מֵאַחַר שֶׁאֵין קִדּוּשִׁין תּוֹפְסִין לוֹ בָּהּ, שֶׁהֲרֵי הֻקְּשׁוּ לַחֲמוֹר, שֶׁנֶּאֱמַר \"שְׁבוּ לָכֶם פֹּה עִם הַחֲמוֹר\" – עַם הַדּוֹמֶה לַחֲמוֹר, וְלָא יִסַּב גַּבְרָא מִבְּנֵי יִשְׂרָאֵל אִתְּתָא אָמָה, שֶׁאַף הוּא נַעֲשֶׂה קָדֵשׁ עַל יָדָהּ, שֶׁכָּל בְּעִילוֹתָיו בְּעִילוֹת זְנוּת, שֶׁאֵין קִדּוּשִׁין תּוֹפְסִין לוֹ בָּהּ (עי' קידושין ס\"ח):", "rashi_en": "לא תהיה קדשה THERE SHALL BE NO קדשה [OF THE DAUGHTERS OF ISRAEL] — i.e. a prostitute, — one who is devoted to and ever ready for illicit intercourse (cf. Rashi on Genesis 38:21 s. v. הקדשה; Rashi on Exodus 19:22 s. v. יתקדשו).<br><br>AND THERE SHALL BE NO קדש (OF THE SONS OF ISRAEL] — one ever ready for pederasty (Sanhedrin 54b). Onkelos, however, rendered the verse by לא תהא אתתא מבני ישראל לגבר עבר, “A woman of the daughters of Israel shall not become the wife of a slave”. Such a woman may also be termed a קדשה. because she, too, becomes a prostitute to illicit intercourse, since no marriage ceremony with her (קידושין) can for him have a hold on her (can be a valid ceremony), — for you see, they (the slaves) are compared to asses, as it is said, (Genesis 22:5), “Abide ye here עם החמור”, which is taken to mean (Kiddushin 68a), “[Abide ye here] עם החמור\", “O ye peop1e who are like asses”. And the second half of the verse Onkelos renders by ולא יסב גברא מבני ישראל אתתא אמה “and no man of Israel shall marry a bondwoman”, which is also an adequate translation, since he, too, becomes a קדש, “one devoted to illicit intercourse” through her, since every intercourse with her is an illicit intercourse, since his marriage to her is not binding (cf. Rashi on Kiddushin 69a s. v. או דיעבד קאמר‎)."}, {"ch": 23, "v": 19, "aliyah": 4, "heb": "לֹא־תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּמְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהֹוָ֥ה אֱלֹהֶ֖יךָ לְכׇל־נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהֹוָ֥ה אֱלֹהֶ֖יךָ גַּם־שְׁנֵיהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תָעֵל אֲגַר זַנִּיתָא וְחוּלְפַן כַּלְבָּא לְבֵית מַקְדְּשָׁא דַּיְיָ אֱלָהָךְ לְכָל נִדְרָא אֲרֵי <b>מְרָחָק קֳדָם<\/b> יְיָ אֱלָהָךְ אַף תַּרְוֵיהוֹן:", "onk_en": "Do not bring a harlot’s fee or payment for a dog to the house of Adonoy, your God, in fulfillment of any vow; because [<b>distanced from<\/b>] Adonoy, your God’s abominations are even both of them.", "pj": "לָא תַעֲלוּן אֲגַר מוֹהֲבוֹת מַטְעִיתָא וּפֵירוּג דְּכֶלֶב לְקַרְבָא בְּבֵי מוּקְדְּשָׁא דַיְיָ אֱלָהָכוֹן לְכָל נִדְרָא כָּל דְּכֵן לִשְׁאַר קוּרְבָּנַיָא אֲרוּם מְרַחֵק קֳדָם יְיָ אֱלָהָכוֹן אוּף תַּרְוֵיהוֹן", "pj_en": "You shall not bring a gift of the hire of an harlot, nor the price of a dog to offer it in the sanctuary of the Lord your God for any vow, much less as any of the oblations; for they are abominable, both of them, before the Lord your God.", "tj": "לָא תַעֲלוּן אֲגַר דִּזְנוּ וּפֵירוּג כֶּלֶב:", "tj_en": "You shall not bring the hire of an harlot, nor the price of a dog.", "rashi": "<b>אתנן זונה.<\/b> נָתַן לָהּ טָלֶה בְּאֶתְנַנָּהּ פָּסוּל לְהַקְרָבָה:<br><br><b>ומחיר כלב.<\/b> הֶחֱלִיף שֶׂה בְכֶלֶב (ספרי; תמורה כ\"ט):<br><br><b>גם שניהם.<\/b> לְרַבּוֹת שִׁנּוּיֵיהֶם, כְּגוֹן חִטִּים וַעֲשָׂאָן סֹלֶת (שם ל'):", "rashi_en": "אתנן זונה [THOU SHALT NOT BRING] THE PROSTITUTION HIRE OF A WHORE [… INTO THE HOUSE OF THE LORD, THY GOD FOR ANY VOW] — This means, if he (the paramour) gave her a lamb as the hire of her prostitution it is unfitted for sacrifice (Sifrei Devarim 261:1; Temurah 29a).<br><br>ומחיר כלב [THOU SHALT NOT BRING …] THE PRICE OF A DOG [INTO THE HOUSE OF THE LORD …], if one has exchanged a lamb for a dog (Sifrei Devarim 261:2; Temurah 30a).<br><br>גם שניהם FOR EVEN BOTH THESE ARE [ABOMINATION UNTO THE LORD, THY GOD] — The words גם שניהם taken as גם שנוייהם are intended to include in the prohibition the things into which they (whatever is given as hire) are changed, as, e.g., if he gave the woman wheat and she made it into flour (Temurah 30b)."}, {"ch": 23, "v": 20, "aliyah": 4, "heb": "לֹא־תַשִּׁ֣יךְ לְאָחִ֔יךָ נֶ֥שֶׁךְ כֶּ֖סֶף נֶ֣שֶׁךְ אֹ֑כֶל נֶ֕שֶׁךְ כׇּל־דָּבָ֖ר אֲשֶׁ֥ר יִשָּֽׁךְ׃", "onk": "לָא תְרַבֵּי לַאֲחוּךְ רִבִּית כְּסַף רִבִּית עִבוּר רִבִּית כָּל מִדַּעַם דְּמִתְרַבֵּי:", "onk_en": "You may not pay usury to your brother, usury on money, usury on food; usury on any matter where it is paid.", "pj": "לָא תַרְבֵּי מִדִּילָךְ לְחַבְרָךְ עַל מִזְפּוֹ דְּאוֹזְפָךְ לָא עַל מִזְפּוֹ דְּכָסִיף וּמִזְפּוֹ דְּמֵיכְלָא וְלָא עַל מִזְפּוֹ דְּכָל מִדַּעַם דְּמִתְרַבֵּי", "pj_en": "Thou shalt not make usury of that which is thine from thy neighbour upon the loan which thou lendest, either of money, or food, or any thing by which thou mayest make usury.", "tj": "", "tj_en": "", "rashi": "<b>לא תשיך.<\/b> אַזְהָרָה לַלֹּוֶה שֶׁלֹּא יִתֵּן רִבִּית לַמַּלְוֶה (עי' ספרי) (וְאַחַר כָּךְ אַזְהָרָה לַמַּלְוֶה אֶת כַּסְפְּךָ לֹא תִתֵּן לוֹ בְּנֶשֶׁךְ):", "rashi_en": "לא תשיך implies a prohibition addressed to the borrower that he should not pay interest to the creditor (cf. Sifrei Devarim 262:1; Bava Metzia 75b) [and afterwards (Leviticus 25:37) follows the prohibition addressed to the creditor, “thou shalt not give him thy money upon interest”]."}, {"ch": 23, "v": 21, "aliyah": 4, "heb": "לַנׇּכְרִ֣י תַשִּׁ֔יךְ וּלְאָחִ֖יךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְךָ֜ יְהֹוָ֣ה אֱלֹהֶ֗יךָ בְּכֹל֙ מִשְׁלַ֣ח יָדֶ֔ךָ עַל־הָאָ֕רֶץ אֲשֶׁר־אַתָּ֥ה בָא־שָׁ֖מָּה לְרִשְׁתָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>לְבַר עַמְמִין<\/b> תְּרַבֵּי וְלַאֲחוּךְ לָא תְרַבֵּי בְּדִיל דִּיבָרֵכִנָּךְ יְיָ אֱלָהָךְ בְּכֹל אוֹשָׁטוּת יְדָךְ עַל אַרְעָא דִּי אַתְּ עָלֵל לְתַמָּן לְמֵירְתַהּ:", "onk_en": "You may pay usury to the stranger [<b>foreigner<\/b>], but to your brother do not pay usury; in order that Adonoy, your God, will bless you in all your commerce on the land that you are coming there to inherit.", "pj": "לְבַר עַמְמִין תֵּיזוּף מִנֵּיהּ בְּרִיבִּיתָא וּלְאָחוּךְ לָא תֵיזוּף בְּרִיבִּיתָא מִן בִּגְלַל דִּיבָרְכִינָךְ יְיָ אֱלָהָךְ בְּכָל אוֹשָׁטוּת יְדָךְ עַל אַרְעָא דְאַנְתְּ עָלֵיל לְתַמָּן לְמֵירְתָהּ", "pj_en": "To a son of the Gentiles thou mayest lend for usury, but to thy brother thou shalt not lend for usury; that the Lord thy God may bless thee in all that thou puttest thine hand un to, in the land into which thou art entering to possess it.", "tj": "", "tj_en": "", "rashi": "<b>לנכרי תשיך.<\/b> וְלֹא לְאָחִיךָ, לָאו הַבָּא מִכְּלַל עֲשֵׂה, עֲשֵׂה, לַעֲבֹר עָלָיו בִּשְׁנֵי לָאוין וַעֲשֵׂה:", "rashi_en": "לנכרי תשיך UNTO AN ALIEN THOU MAYEST LEND UPON INTEREST (according to Rashi: TO AN ALIEN THOU MAYEST PAY INTEREST) — but not to thy brother. Such a prohibition which is not plainly stated but can only be drawn by inference from a positive command is itself regarded only as a positive command — so that one who pays interest to his brother transgresses two negative commands: לא תשיך in v. 20, ולאחיך לא תשיך in v. 21 and a positive command לנכרי תשיך — ולאחיך לא (cf. Sifrei Devarim 263:1; Bava Metzia 70b; also cf. Rashi on Deuteronomy 14:20)."}, {"ch": 23, "v": 22, "aliyah": 4, "heb": "כִּֽי־תִדֹּ֥ר נֶ֙דֶר֙ לַיהֹוָ֣ה אֱלֹהֶ֔יךָ לֹ֥א תְאַחֵ֖ר לְשַׁלְּמ֑וֹ כִּֽי־דָרֹ֨שׁ יִדְרְשֶׁ֜נּוּ יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ מֵֽעִמָּ֔ךְ וְהָיָ֥ה בְךָ֖ חֵֽטְא׃", "onk": "אֲרֵי תִדַּר נְדַר <b>קֳדָם<\/b> יְיָ אֱלָהָךְ לָא תְאַחַר לְשַׁלָּמוּתֵיהּ אֲרֵי מִתְבַּע יִתְבְּעִנֵּיהּ יְיָ אֱלָהָךְ מִנָּךְ וִיהֵי בָךְ חוֹבָא:", "onk_en": "If you make a vow to [<b>before<\/b>] Adonoy, your God, do not delay in discharging it; for Adonoy, your God, will surely demand it from you, and you will be at fault.", "pj": "אֲרוּם תִּידְרוּן נִדְרָא קֳדָם יְיָ אֱלָהָכוֹן לָא תוֹחֲרוּן לְשַׁלְמוּתֵיהּ תְּלַת חַגִּין אֲרוּם מִתְבַּע יִתְבְּעִינֵיהּ יְיָ אֱלָהָכוֹן בְּקוּרְבָּנָא לָא יְהֵי חוֹב וּפְסוּלָא דִבְהַפְתִּיק מָרֵי עַלְמָא קָאִי וְלָא יְהֵי בָךְ חוֹבַת עִכּוּב נִדְרָא", "pj_en": "When you vow a vow before the Lord your God, delay not to fulfil it in (one of) the three festivals; for the Lord your God requiring will require it. And in the oblation there shall not be any fault or blemish, for in the prescription of the Lord of the world it is so ordained. And thou shalt not be guilty of keeping back (delaying) thy vow:", "tj": "", "tj_en": "", "rashi": "<b>לא תאחר לשלמו.<\/b> שְׁלוֹשָׁה רְגָלִים, וּלְמָדוּהוּ רַבּוֹתֵינוּ מִן הַמִּקְרָא (ראש השנה ד'):", "rashi_en": "לא תאחר לשלמו [WHEN THOU SHALT VOW A VOW UNTO THE LORD THY GOD] THOU SHALT NOT DELAY TO PAY IT — beyond three festivals after the vow has been made. Our Rabbis have deduced it (the fact that one does not transgress the prohibition before three festivals elapse) from a Scriptural text (Rosh Hashanah 4b)."}, {"ch": 23, "v": 23, "aliyah": 4, "heb": "וְכִ֥י תֶחְדַּ֖ל לִנְדֹּ֑ר לֹֽא־יִהְיֶ֥ה בְךָ֖ חֵֽטְא׃", "onk": "וַאֲרֵי תִתִּמְנַע לְמִנְדַּר לָא יְהֵי בָךְ חוֹבָא:", "onk_en": "But if you desist from vowing, no fault will be found with you.", "pj": "וַאֲרוּם תִּתְמַנְעוּן מִלְּמֵידַר לָא יְהֵי בְכוֹן חוֹבָא", "pj_en": "though, if you refrain from vowing, it will not be sin in you,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 24, "aliyah": 4, "heb": "מוֹצָ֥א שְׂפָתֶ֖יךָ תִּשְׁמֹ֣ר וְעָשִׂ֑יתָ כַּאֲשֶׁ֨ר נָדַ֜רְתָּ לַיהֹוָ֤ה אֱלֹהֶ֙יךָ֙ נְדָבָ֔ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ בְּפִֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אַפָּקוּת סִפְוָתָךְ תִּטַּר וְתַעְבֵּד כְּמָא דִי נְדַרְתָּא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ נְדַבְתָּא דִּי מַלֶּלְתָּא בְּפוּמָךְ:", "onk_en": "Keep what you have articulated; and perform whatever you vow; to [<b>before<\/b>] Adonoy, your God, voluntarily—whatever you say with your mouth.", "pj": "מוֹמָתָא דְתִפּוֹק מִן שִפְוַותְכוֹן תְּקִימוּן מִצְוָותָא דְכַשְׁרִין לְאִתְעוֹבָדָא תַּעַבְדוּן וּדְלָא כַשְׁרִין לְאִתְעוֹבָדָא לָא תַעַבְדוּן וְהֵיכְמָא דִנְדַרְתּוּן תְּשַׁלְּמוּן חַטָּאתָא וְאַשְׁמָא עֲלַוָּון וְנִכְסְתָא קוּדְשִׁין תְּקַרְבוּן קֳדָם יְיָ אֱלָהָכוֹן וְנִיכְסְתָא תֵּיהוֹן וּנְבִזְבְּיַית בֵּית מוּקְדְּשָׁא דְמַלֵּילְתּוּן תִּתְּנוּן וּלְעַנְיֵי צִדְקָתָא מַה דְּאָמַרְתּוּן בְּפוּמְכוֹן", "pj_en": "the oath which goeth from your lips you shall confirm. The precepts of integrity you shall verily perform, but that which is not right to do ye shall not do; and according as you have vowed shall you fulfil; sin offerings, trespass offerings, burnt sacrifices, and consecrated victims shall you present before the Lord your God, and bring the libations and the gifts of the sanctuary of which you have spoken (in promises), and alms for the poor which your lips have declared.", "tj": "", "tj_en": "", "rashi": "<b>מוצא שפתיך תשמר.<\/b> לִתֵּן עֲשֵׂה עַל לֹא תַעֲשֶׂה (שם ו'):", "rashi_en": "מוצא שפתיך תשמר THAT WHICH HATH GONE OUT OF THY LIPS THOU SHALT KEEP — This is intended to add a positive command to the prohibition of delaying one’s vows (mentioned in the previous verse) (Rosh Hashanah 6a)."}, {"ch": 23, "v": 25, "aliyah": 5, "heb": "כִּ֤י תָבֹא֙ בְּכֶ֣רֶם רֵעֶ֔ךָ וְאָכַלְתָּ֧ עֲנָבִ֛ים כְּנַפְשְׁךָ֖ שׇׂבְעֶ֑ךָ וְאֶֽל־כֶּלְיְךָ֖ לֹ֥א תִתֵּֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי <b>תִתָּגַר<\/b> בְּכַרְמָא דְחַבְרָךְ וְתֵיכוּל עִנְּבִין כְּנַפְשָׁךְ שִׂבְעָךְ וּלְמָאנָךְ לָא תִתֵּן:", "onk_en": "When you [<b>are hired to<\/b>] enter your fellow’s vineyard, you may eat grapes as you desire, to your satisfaction; but you may not place it in your container.", "pj": "אֲרוּם תֵּיעוּל לְמֵיסַב אַגְרָא כְּפוֹעֵל בְּכַרְמָא דְחַבְרָךְ וְתֵיכוּל כְּרַעֲוַות נַפְשָׁךְ עַד דְּתִסְבַּע וּלְוַות צַנָךְ לָא תִתֵּן", "pj_en": "When thou hast come for hire into thy neighbour’s vineyard, thou mayest eat there as thou wilt, till thou art satisfied; but thou mayest not put any into thy basket.", "tj": "", "tj_en": "", "rashi": "<b>כי תבא בכרם רעך.<\/b> בְּפוֹעֵל הַכָּתוּב מְדַבֵּר:<br><br><b>כנפשך.<\/b> כַּמָּה שֶׁתִּרְצֶה:<br><br><b>שבעך.<\/b> וְלֹא אֲכִילָה גַסָּה (בבא מציעא פ\"ז):<br><br><b>ואל כליך לא תתן.<\/b> מִכָּאן שֶׁלֹּא דִּבְּרָה תוֹרָה אֶלָּא בִּשְׁעַת הַבָּצִיר, בִּזְמַן שֶׁאַתָּה נוֹתֵן לְכֶלְיוֹ שֶׁל בַּעַל הַבַּיִת (ספרי; בבא מציעא פ\"ט), אֲבָל אִם בָּא לַעֲדֹר וּלְקַשְׁקֵשׁ אֵינוֹ אוֹכֵל (שם פ\"ז):", "rashi_en": "כי תבא בכרם רעך WHEN THOU COMEST INTO THE VINEYARD OF THY FELLOW MAN, [THEN THOU MAYEST EAT GRAPES AT THY FILL] — Scripture is speaking of a laborer (who is engaged in gathering in the grapes, but not of one who is doing other work in the vineyard, nor of one who enters the vineyard with no intention to do work; cf. Rashi in the next passage) (Bava Metzia 87b).<br><br>כנפשך means as much as you like.<br><br>שבעך AT THY FILL — but not excessive eating (Bava Metzia 87b).<br><br>ואל כליך לא תתן BUT THOU SHALT NOT PUT ANY IN THY VESSEL — From here we may derive that Scripture is referring only to the period of the vintage, to the time when thou puttest grapes into the owner’s vessel, — then thou mayest eat but not put any into thy vessel; but if he comes to hoe or to weed (i.e. to do other work than harvesting) he must not eat of the grapes (Bava Metzia 89b)."}, {"ch": 23, "v": 26, "aliyah": 5, "heb": "כִּ֤י תָבֹא֙ בְּקָמַ֣ת רֵעֶ֔ךָ וְקָטַפְתָּ֥ מְלִילֹ֖ת בְּיָדֶ֑ךָ וְחֶרְמֵשׁ֙ לֹ֣א תָנִ֔יף עַ֖ל קָמַ֥ת רֵעֶֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי <b>תִתָּגַר<\/b> בְּקַמְתָא דְחַבְרָךְ וְתִקְטוֹף מְלִילָן בִּידָךְ וּמַגְלָא לָא תְרִים עַל קַמְתָא דְחַבְרָךְ:", "onk_en": "When you [<b>are hired to<\/b>] enter your fellow’s standing grainstalks, you may cut off stalks by hand, but do not lift a sickle over your fellow’s standing grainstalks.", "pj": "אֲרוּם תֵּיעוּלוּ לְמֵיסַב אַגְרָא כְּפָעֵל בְּקַמְתָא דְחַבְרָךְ וְתִקְטוֹף פְּרוּכְיַין בִּידָךְ וּמַגְלָא לָא תְרִים עַל קַמְתָא דְחַבְרָךְ", "pj_en": "When you go to work for hire in the field of thy neighbour, thou mayest gather with thy hands, but thou art not to put forth the sickle upon thy neighbour’s corn (for thyself).", "tj": "", "tj_en": "", "rashi": "<b>כי תבא בקמת רעך.<\/b> אַף זוֹ בְּפוֹעֵל הַכָּתוּב מְדַבֵּר:", "rashi_en": "כי תבא בקמת רעך WHEN THOU COMEST INTO THE STANDING CORN OF THY FELLOW MAN [THOU MAYEST PLUCK THE EARS WITH THINE HAND] — In this case too, Scripture is referring to a labourer in the field (cf. Sifrei Devarim 267:1; Bava Metzia 87b)."}, {"ch": 24, "v": 1, "aliyah": 5, "heb": "כִּֽי־יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּבְעָלָ֑הּ וְהָיָ֞ה אִם־לֹ֧א תִמְצָא־חֵ֣ן בְּעֵינָ֗יו כִּי־מָ֤צָא בָהּ֙ עֶרְוַ֣ת דָּבָ֔ר וְכָ֨תַב לָ֜הּ סֵ֤פֶר כְּרִיתֻת֙ וְנָתַ֣ן בְּיָדָ֔הּ וְשִׁלְּחָ֖הּ מִבֵּיתֽוֹ׃", "onk": "אֲרֵי יִסַּב גְּבַר אִתְּתָא וְיִבְעֲלִנַּהּ וִיהֵי אִם לָא תַשְׁכַּח רַחֲמִין בְּעֵינוֹהִי אֲרֵי אַשְׁכַּח בַּהּ <b>עֲבֵרַת<\/b> <b>פִּתְגָּם<\/b> וְיִכְתּוֹב לַהּ גֵּט פִּטּוּרִין וִיהַב בִּידַהּ וְיִפְטְרִנַּהּ מִבֵּיתֵיהּ:", "onk_en": "If a man marries a woman and consummates with her; should she not find favor in his eyes because he found in her something lecherous [<b>sinful<\/b>], he is to write for her a document of severance and place [it] in her hand and send her from his home.", "pj": "אֲרוּם יִסַב גְּבַר אִיתָא וְיֵיעוּל עֲלָהּ וִיהֵי אִין לָא הַשְׁכָּחַת רַחֲמִין בְּעֵינוֹי אֲרוּם אַשְׁכַּח בָּהּ עֲבֵירַת פִּתְגָם וְיִכְתּוֹב לָהּ סֵפֶר תִּירוּכִין קֳדָם בֵּי דִינָא וְיִתֵּן בִּרְשׁוּתָהּ וְיִטַיֵּיל יָתָהּ מִבֵּיתֵיהּ", "pj_en": "When a man hath taken a wife and gone unto her, if she hath not favour in his eyes because he findeth the thing that is wrong in her, then he may write her a bill of divorce before the court of justice, and put it into her power, and send her away from his house.", "tj": "", "tj_en": "", "rashi": "<b>כי מצא בה ערות דבר.<\/b> מִצְוָה עָלָיו לְגָרְשָׁהּ, שֶׁלֹּא תִמְצָא חֵן בְּעֵינָיו (גיט' צ'):", "rashi_en": "כי מצא בה ערות דבר [WHEN A MAN HATH TAKEN A WIFE, AND MARRIED HER, AND IT COMES TO PASS THAT SHE FINDS NO FAVOUR IN HIS EYES.] BECAUSE HE HATH FOUND SOME SCANDALOUS THING IN HER; [THEN LET HIM WRITE A BILL OF DIVORCEMENT … AND SEND HER AWAY …] — it is his duty to divorce her because she should not find favour in his eyes (cf. Gittin 90b)."}, {"ch": 24, "v": 2, "aliyah": 5, "heb": "וְיָצְאָ֖ה מִבֵּית֑וֹ וְהָלְכָ֖ה וְהָיְתָ֥ה לְאִישׁ־אַחֵֽר׃", "onk": "וְתִפּוֹק מִבֵּיתֵיהּ וּתְהַךְ וּתְהֵי לִגְבַר אָחֳרָן:", "onk_en": "If she leaves his home and goes and becomes [wife] to another man.", "pj": "וּנְפָקַת מִבַּיְיתֵיהּ וּתְהַךְ וּתְהֵי לִגְבַר אוֹחֲרָן", "pj_en": "And departing from his house she may go and marry another man.", "tj": "", "tj_en": "", "rashi": "<b>לאיש אחר.<\/b> אֵין זֶה בֶּן זוּגוֹ שֶׁל רִאשׁוֹן, הוּא הוֹצִיא רְשָׁעָה מִתּוֹךְ בֵּיתוֹ וְזֶה הִכְנִיסָהּ (שם):", "rashi_en": "לאיש אחר [AND WHEN SHE IS GONE OUT OF HIS HOUSE, AND HATH GONE AND BECOME] “ANOTHER” MAN’S WIFE — He is “another” (a different) man, not one of a pair with the first: he turned the wicked woman out of his house, whilst this man hath taken her into his house (Gittin 90b)."}, {"ch": 24, "v": 3, "aliyah": 5, "heb": "וּשְׂנֵאָהּ֮ הָאִ֣ישׁ הָאַחֲרוֹן֒ וְכָ֨תַב לָ֜הּ סֵ֤פֶר כְּרִיתֻת֙ וְנָתַ֣ן בְּיָדָ֔הּ וְשִׁלְּחָ֖הּ מִבֵּית֑וֹ א֣וֹ כִ֤י יָמוּת֙ הָאִ֣ישׁ הָאַחֲר֔וֹן אֲשֶׁר־לְקָחָ֥הּ ל֖וֹ לְאִשָּֽׁה׃", "onk": "וְיִסְנִנַּהּ גַּבְרָא בַתְרָאָה וְיִכְתּוֹב לַהּ גֵּט פִּטּוּרִין וְיִתֵּן בִּידַהּ וְיִפְטְרִנַּהּ מִבֵּיתֵיהּ אוֹ אֲרֵי יְמוּת גַּבְרָא בַתְרָאָה דְּנָסְבַהּ לֵיהּ לְאִנְתּוּ:", "onk_en": "If her last husband hates her and writes for her a document of severance and places [it] in her hand and sends her from his house, or if the latter man dies, who had taken her as his wife;", "pj": "וְאַכְרִיזוּ עֲלָהּ מִן שְׁמַיָא דְיַסְנִינָהּ גַּבְרָא בַּתְרָאָה וְיִכְתּוֹב לָהּ סֵפֶר תִּירוּכִין וְיִתֵּן בִּרְשׁוּתָהּ וִיטַיֵּיל לָהּ מִבַּיְיתֵיהּ אוֹ אַכְרִיזוּ עֲלוֹי וְיֵמוּת גַּבְרָא בַּתְרָאָה דְנַסְבָהּ לֵיהּ לְאִנְתּוּ", "pj_en": "But should they proclaim from the heavens about her that the latter husband shall dislike her, and write her a bill of divorce, and put it into her power to go from his house; or should they proclaim about him that lie the latter husband shall die:", "tj": "", "tj_en": "", "rashi": "<b>ושנאה האיש האחרון.<\/b> הַכָּתוּב מְבַשְּׂרוֹ שֶׁסּוֹפוֹ לִשְׂנֹאתָהּ, וְאִם לָאו קוֹבַרְתּוֹ, שֶׁנֶּאֱמַר <b>או כי ימות<\/b> (ספרי):", "rashi_en": "ושנאה האיש האחרון AND IF THE LATTER HUSBAND HATE HER — (these words lit. mean: and the other will hate her): Scripture tells you that in the end he will hate her and divorce her, and if not, she will bury him (be the cause of his death) as it states “or if the latter husband die” (Sifrei Devarim 270:4-5)."}, {"ch": 24, "v": 4, "aliyah": 5, "heb": "לֹא־יוּכַ֣ל בַּעְלָ֣הּ הָרִאשׁ֣וֹן אֲשֶֽׁר־שִׁ֠לְּחָ֠הּ לָשׁ֨וּב לְקַחְתָּ֜הּ לִהְי֧וֹת ל֣וֹ לְאִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי־תוֹעֵבָ֥ה הִ֖וא לִפְנֵ֣י יְהֹוָ֑ה וְלֹ֤א תַחֲטִיא֙ אֶת־הָאָ֔רֶץ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ נַחֲלָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לֵית <b>לֵיהּ רְשׁוּ<\/b> לְבַעֲלַהּ קַדְמָאָה דִי פָטְרַהּ לְמִתֻּב לְמִסְּבַהּ לְמֶהֱוֵי לֵיהּ לְאִנְתּוּ בָּתַר דִּי אִסְתָּאָבַת אֲרֵי מְרָחָקָא הִיא קֳדָם יְיָ וְלָא תְחַיַּב יָת אַרְעָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא:", "onk_en": "Her first husband who divorced her may not [<b>has no permission to<\/b>] remarry her to be his wife after her having been defiled, for it is an abomination before Adonoy; and you are not to make liable the land that Adonoy, your God, is giving you as territory.", "pj": "לֵית לֵיהּ רְשׁוּת לְבַעֲלָהּ קַמָּאָה דְפַטְרָהּ מִן שֵׁירוּיָא לִמְתוֹב לְמִסְבָּהּ לְמֶהֱוֵי לֵיהּ לְאִנְתּוּ מִן בָּתַר דְּאִיסְתְּאָבַת אֲרוּם מְרַחֲקָא הִיא קֳדָם יְיָ וְלָא מְרַחֲקִין בְּנָהָא דְתֵלִיד מִנֵּיהּ וְלָא תְחַיֵּיב חוֹבַת מוֹתָנָא יַת אַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן אַחְסָנָא", "pj_en": "it shall not be in the power of the first husband who dismissed her at the beginning to return and take her to be with him as his wife, after that she hath been defiled; for that is an abomination before the Lord: for the children whom she might bear should not be made abominable, or the land which the Lord your God giveth you to inherit become obnoxious to the plague.", "tj": "", "tj_en": "", "rashi": "<b>אחרי אשר הטמאה.<\/b> לְרַבּוֹת סוֹטָה שֶׁנִּסְתְּרָה (ספרי; יבמות י\"א):", "rashi_en": "אחרי אשר הטמאה [HER FIRST HUSBAND … MAY NOT TAKE HER AGAIN TO BE HIS WIFE] AFTER THAT SHE IS DEFILED — these words are intended to include in the prohibition a faithless wife (סוטה) who had been in seclusion with another man (Sifrei Devarim 270:10; Yevamot 11b)."}, {"ch": 24, "v": 5, "aliyah": 6, "heb": "כִּֽי־יִקַּ֥ח אִישׁ֙ אִשָּׁ֣ה חֲדָשָׁ֔ה לֹ֤א יֵצֵא֙ בַּצָּבָ֔א וְלֹא־יַעֲבֹ֥ר עָלָ֖יו לְכׇל־דָּבָ֑ר נָקִ֞י יִהְיֶ֤ה לְבֵיתוֹ֙ שָׁנָ֣ה אֶחָ֔ת וְשִׂמַּ֖ח אֶת־אִשְׁתּ֥וֹ אֲשֶׁר־לָקָֽח׃", "onk": "אֲרֵי יִסַּב גְּבַר אִתְּתָא חַדְתָּא לָא יִפּוֹק בְּחֵילָא וְלָא יֵעִבַר עֲלוֹהִי לְכָל מִדָּעַם <b>פָּנֵי<\/b> יְהֵי לְבֵיתֵיהּ שַׁתָּא חֲדָא וְיַחְדֵּי יָת אִתְּתֵיהּ דִּי נְסַב:", "onk_en": "When a man marries a new wife, he is not to be mobilized into the army, it shall not impose itself over him in any matter; he shall be free for his home one year and he shall bring joy to the wife he married.", "pj": "אֲרוּם יִסַּב גְּבַר אִיתָא חַדְתָּא בְּתוּלְתָּא לָא יִפּוֹק בְּחֵילָא דְּלָא יֶאֱרַע עֲלוֹי כָּל מִדַּעַם בִּישׁ פָּנֵי יְהֵי בְּבֵיתֵיהּ שַׁתָּא חֲדָא וְיִחְדֵי עִם אִנְתְּתֵיהּ דְּנָסִיב", "pj_en": "When a man hath taken a new wife a virgin he shall not go forth with the army, lest anything evil befall him; he shall be at leisure in his house one year, and rejoice with his wife whom he hath taken.", "tj": "", "tj_en": "", "rashi": "<b>אשה חדשה.<\/b> שֶׁהִיא חֲדָשָׁה לוֹ וַאֲפִלּוּ אַלְמָנָה, פְּרָט לְמַחֲזִיר גְּרוּשָׁתוֹ (ספרי; סוטה מ\"ד):<br><br><b>ולא יעבור עליו.<\/b> דְּבַר הַצָּבָא:<br><br><b>לכל דבר<\/b> שֶׁהוּא צֹרֶךְ הַצָּבָא, לֹא לְסַפֵּק מַיִם וּמָזוֹן וְלֹא לְתַקֵּן הַדְּרָכִים, אֲבָל הַחוֹזְרִים מֵעוֹרְכֵי הַמִּלְחָמָה עַל פִּי כֹהֵן, כְּגוֹן בָּנָה בַיִת וְלֹא חֲנָכוֹ אוֹ אֵרַשׂ אִשָּׁה וְלֹא לְקָחָהּ, מַסְפִּיקִין מַיִם וּמָזוֹן וּמְתַקְּנִין אֶת הַדְּרָכִים (שם):<br><br><b>יהיה לביתו.<\/b> אַף בִּשְׁבִיל בֵּיתוֹ, אִם בָּנָה בַיִת וַחֲנָכוֹ וְאִם נָטַע כֶּרֶם וְחִלְּלוֹ אֵינוֹ זָז מִבֵּיתוֹ בִּשְׁבִיל צָרְכֵי הַמִּלְחָמָה:<br><br><b>יהיה.<\/b> לְרַבּוֹת אֶת כַּרְמוֹ:<br><br><b>לביתו.<\/b> זֶה בֵיתוֹ:<br><br><b>ושמח.<\/b> יְשַׂמֵּחַ אֶת אִשְׁתּוֹ, וְתַרְגּוּמוֹ \"וְיַחְדֵי יָת אִתְּתֵהּ\", וְהַמְתַרְגֵּם וְיֶחְדֵּי עִם אִתְּתֵהּ טוֹעֶה הוּא, שֶׁאֵין זֶה תַּרְגּוּם שֶׁל וְשִׂמַּח אֶלָּא שֶׁל וְשָׂמַח:", "rashi_en": "אשה חדשה [WHEN A MAN HATH TAKEN] A NEW WIFE [HE SHALL NOT GO OUT TO THE HOST] — i.e., one that is new to him, even though she be a widow; but it excludes the case of one who re-marries his divorced wife (Sifrei Devarim 271:1; Sotah 44a; cf., however, Targum Jonathan). <br><br>ולא יעבר lit., NEITHER SHALL PASS UPON HIM (i.e., be obligatory upon him) any army matter,<br><br>לכל דבר AS REGARDS ANYTHING that is a requirement of the army: not to supply water and food, nor to repair the roads, whilst those who returned from the battle array at the bidding of the priest, e.g., one who had built a new house and had not yet dedicated it, or one who had betrothed a woman and had not yet taken her to wife (Deuteronomy 20:5—7), are bound to supply water and food and to repair roads (Sifrei Devarim 271:2; Sotah 44a).<br><br>יהיה לביתו [HE SHALL BE FREE] AT HOME (or, as it may be literally translated: [FREE] FOR HIS HOUSE) — i.e., also on account of his new house (not only on account of his recent marriage, as stated in the text): if he has built a new house and only just dedicated it (not lived in it a full year), and similarly, if he has planted a vineyard and has only just begun to eat of its fruits (not enjoyed its produce the full fourth year), he need not leave his house for the requirements of war. This Halacha is derived from the text as follows:<br><br>יהיה HE SHALL BE — This is intended to include the vineyard (Sifrei Devarim 271:4),<br><br>לביתו This is the mention of “his house” (Sifrei Devarim 271:3).<br><br>ושמח means HE SHALL GLADDEN [HIS WIFE], its correct Targum rendering therefore is: וְיַחְדֵי יַת אִיתְּתֵהּ which expresses this; One who reads in the Targum וְיַחְדֵי עִם אִיתְּתֵהּ “he shall rejoice with his wife” is in error, for this is not the Targum equivalent of וְשִׂמַּח (Piel) but of וְשָׂמַח (Kal)."}, {"ch": 24, "v": 6, "aliyah": 6, "heb": "לֹא־יַחֲבֹ֥ל רֵחַ֖יִם וָרָ֑כֶב כִּי־נֶ֖פֶשׁ ה֥וּא חֹבֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא יִסַּב מַשְׁכּוֹנָא רִחְיָא וְרִכְבָּא <b>אֲרֵי בְהוֹן מִתְעֲבֵד מָזוֹן לְכָל נְפַשׁ<\/b>:", "onk_en": "He may not secure as collateral a mortar or pestle, for his is taking life as security [<b>for sustinance is made with these for all souls<\/b>].", "pj": "לָא יְמַשְׁכַּן גְּבַר רֵיחַיָא וְרִיכְבָא אֲרוּם צוֹרְכֵי דִבְהוֹן מִתְעֲבֵיד מָזוֹן לְכָל נַפְשָׁא הוּא מְמַשְׁכַּן וְלָא יֶהֱוֵי גְבַר אֲסַר חַתְנִין וְכַלִּין בְּחַרְשִׁין אֲרוּם נַפְשָׁא דְעָתִיד לְמֵיפַק מִנְהוֹן הוּא מְחַבֵּל", "pj_en": "A man shall not take the millstones, lower or upper, as a pledge; for they are necessary in making food for every one. Neither shall a man join bridegrooms and brides by magical incantations; for what would be born of such would perish.", "tj": "לָא תְמַשְׁכְּנוּן רֵיחַיָא וְרִיכְבַּיָא אֲרוּם צוֹרְכֵי נַפְשָׁא הוּא מְמַשְׁכַּן: וְלָא תֶהֱוַון אִיסוּרֵי חַתְנִין וְכַלִּין אֲרוּם כָּל דַּעֲבַד אִילֵין כְּפַר בְּחַיֵּי עַלְמָא דְאָתֵי:", "tj_en": "You shall not take the upper and lower millstones for a pledge; for the pledge is a necessary of life.  Nor shall there be unlawful conjoinments of bridegrooms and brides; for what such produce is denied the life of the world to come.", "rashi": "<b>לא יחבל.<\/b> אִם בָּא לְמַשְׁכְּנוֹ עַל חוֹבוֹ בְּבֵית דִּין, לֹא יְמַשְׁכְּנֶנּוּ בִּדְבָרִים שֶׁעוֹשִׂים בָּהֶן אֹכֶל נֶפֶשׁ (ב\"מ קי\"ג):<br><br><b>רחים.<\/b> הִיא הַתַּחְתּוֹנָה:<br><br><b>ורכב.<\/b> הִיא הָעֶלְיוֹנָה:", "rashi_en": "לא יחבל NO MAN SHALL TAKE [THE LOWER OR THE UPPER MILLSTONE] AS PLEDGE — i.e. if one comes to demand a pledge through the court for his debt he should not take as a pledge anything by which food is prepared (Bava Metzia 113b, 115a).<br><br>רחים is the lower,<br><br>ורכב is the upper millstone."}, {"ch": 24, "v": 7, "aliyah": 6, "heb": "כִּי־יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵאֶחָיו֙ מִבְּנֵ֣י יִשְׂרָאֵ֔ל וְהִתְעַמֶּר־בּ֖וֹ וּמְכָר֑וֹ וּמֵת֙ הַגַּנָּ֣ב הַה֔וּא וּבִֽעַרְתָּ֥ הָרָ֖ע מִקִּרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי יִשְׁתְּכַח גְּבַר גָּנֵב נַפְשָׁא מֵאֲחוֹהִי מִבְּנֵי יִשְׂרָאֵל וְיִתָּגַר בֵּיהּ וִיזַבְּנִנֵּיהּ וְיִתְקְטֵל גַּנָּבָא הַהוּא וּתְפַלֵּי <b>עָבֵד<\/b> <b>דְּבִישׁ<\/b> מִבֵּינָךְ:", "onk_en": "If a man is apprehended having kidnaped a person from his brothers, from the descendants of Yisroel, and he exploited him and sold him; that kidnaper is to be put to death and you will eliminate the evil [<b>doer<\/b>] within you.", "pj": "אֲרוּם יִשְׁתַּכַּח בַּר נַשׁ גְּנִיב נְפָשׁ מֵאָחוֹי מִבְּנֵי יִשְרָאֵל וְיַעֲבֵיד בֵּיהּ פְּרַקְמַטְיָא וְיִזְבְּנִינֵיהּ וְיִתְקְטֵיל גַּבְרָא הַהוּא בְּשִׁינוּקָא דְסוֹדְרָא וּתְפַלֵּי עֲבִיד דְּבִישׁ מִבֵּינָךְ", "pj_en": "When a man is found stealing a person of his brethren of the sons of Israel, making merchandise of him, and selling him, that man shall die by strangulation with the napkin; and you shall put away the evil doer from among thee.", "tj": "", "tj_en": "", "rashi": "<b>כי ימצא.<\/b> בְּעֵדִים וְהַתְרָאָה, וְכֵן כָּל \"יִמָּצֵא\" שֶׁבַּתּוֹרָה:<br><br><b>והתעמר בו.<\/b> אֵינוֹ חַיָּב עַד שֶׁיִּשְׁתַּמֵּשׁ בּוֹ:", "rashi_en": "כי ימצא IF [A MAN] BE FOUND [STEALING …] — Found when doing so by witnesses and after legal warning. This, too, is the meaning in all cases where a form of the verb מצא is used in the Torah, under similar circumstances (Mekhilta; Sifrei Devarim 273:1).<br><br>והתעמר בו AND TREATS HIM AS A SLAVE — he is not liable to the death penalty until he uses him as a slave (cf. Sifrei Devarim 273:5; Sanhedrin 85b)."}, {"ch": 24, "v": 8, "aliyah": 6, "heb": "הִשָּׁ֧מֶר בְּנֶֽגַע־הַצָּרַ֛עַת לִשְׁמֹ֥ר מְאֹ֖ד וְלַעֲשׂ֑וֹת כְּכֹל֩ אֲשֶׁר־יוֹר֨וּ אֶתְכֶ֜ם הַכֹּהֲנִ֧ים הַלְוִיִּ֛ם כַּאֲשֶׁ֥ר צִוִּיתִ֖ם תִּשְׁמְר֥וּ לַעֲשֽׂוֹת׃", "onk": "אִסְתַּמַּר בְּמַכְתַּשׁ סְגִירוּ לְמִטַּר לַחֲדָא וּלְמֶעְבָּד כְּכֹל דִּי יַלְּפוּן יָתְכוֹן כָּהֲנַיָּא לֵוָאֵי כְּמָא דִי פַקֶּדְתִּנּוּן תִּטְּרוּן לְמֶעְבָּד:", "onk_en": "Take precautions with the leprosy affliction to be extremely careful and to do—in accordance with everything that the <i>kohanim<\/i> the Levites shall instruct you; as I commanded them are you to make sure to do.", "pj": "אִסְתַּמָּרוּ דְלָא לְמִקְטוֹעַ בִּישְרָא דְבֵיהּ בַּהֲקֵי אֱלָהֵן לְמִנְטוֹר לַחֲדָא לְמֶעֱבַד בֵּינֵי מַכְתַּשׁ צוּרְעָתָא לְמַכְתַּשׁ נוּתְקָא בֵּינֵי מְסָאָבָא לְבֵינֵי דַכְיָא הֵי כְּכָל מַה דְּיַלְפוּן יַתְכוֹן כַּהֲנַיָא דְּמִילְשֵׁבַט לֵוִי הֵיכְמָא דְפַקֵידְתִּינוּן תִּנְטְרוּן לְמֶעֱבַד", "pj_en": "Take heed that you cut not into flesh in which there is an ulcer; but make careful distinction between the plague of leprosy and ulceration; between the unclean and clean, according to all that the priests of the tribe of Levi shall teach you: whatever, they prescribe to you be observant to perform.", "tj": "", "tj_en": "", "rashi": "<b>השמר בנגע הצרעת.<\/b> שֶׁלֹּא תִתְלֹשׁ סִימָנֵי טֻמְאָה וְלֹא תָקֹץ אֶת הַבַּהֶרֶת (מכות כ\"ב):<br><br><b>ככל אשר יורו אתכם.<\/b> אִם לְהַסְגִּיר אִם לְהַחֲלִיט אִם לְטַהֵר:", "rashi_en": "השמר בנגע צרעת TAKE HEED IN THE AFFLICTION OF LEPROSY — take heed that you pluck not out the symptoms of uncleanness (cf. Leviticus ch. XIII.), nor cut out the leprous spot (Makkot 22a).<br><br>ככל אשר יורו אתכם ACCORDING TO ALL THAT [THE PRIESTS …] SHALL TEACH YOU — whether to place the leper in quarantine, or to declare him definitely unclean or clean."}, {"ch": 24, "v": 9, "aliyah": 6, "heb": "זָכ֕וֹר אֵ֧ת אֲשֶׁר־עָשָׂ֛ה יְהֹוָ֥ה אֱלֹהֶ֖יךָ לְמִרְיָ֑ם בַּדֶּ֖רֶךְ בְּצֵאתְכֶ֥ם מִמִּצְרָֽיִם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "הֲוֵי דְכִיר יָת דִּי עֲבַד יְיָ אֱלָהָךְ לְמִרְיָם בְּאָרְחָא בְּמִפָּקְכוֹן מִמִּצְרָיִם:", "onk_en": "Remember what Adonoy, your God, did to Miriam on the way when you were going out of Egypt.", "pj": "הֲווֹ זְהִירִין דְּלָא לְמֵחֲשַׁד חַד בְּחַבְרֵיהּ דְּלָא יִלְקֵי הֲווֹ דְּכִירִין מַה דְּעָבַד יְיָ אֱלָהָכוֹן לְמִרְיָם דְּחָשְׁדַּת לְמשֶׁה בְּמִלְתָא דְלָא הֲוַת בֵּיהּ וְלָקַת בְּצוֹרְעָא וְאִתְעַכְּבַת בְּאָרְחָא בְּמִפְקְכוֹן מִמִּצְרָיִם", "pj_en": "Be mindful that no one contemn his neighbour, lest he be smitten: remember that which the Lord your God did to Miriam, who contemned Mosheh for that which was not in him, when she was smitten with leprosy, and you were delayed in the way when coming out of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>זכור את אשר עשה ה' אלהיך למרים.<\/b> אִם בָּאתָ לְהִזָּהֵר שֶׁלֹּא תִלְקֶה בְּצָרַעַת אַל תְּסַפֵּר לָשׁוֹן הָרָע, זְכֹר הֶעָשׂוּי לְמִרְיָם שֶׁדִּבְּרָה בְאָחִיהָ וְלָקְתָה בִנְגָעִים (עי' ספרי):", "rashi_en": "זכור את אשר עשה ה' אלהיך למרים REMEMBER WHAT THE LORD THY GOD DID UNTO MIRIAM — if you wish to guard yourself against being stricken with leprosy, do not speak slander! Remember what was done unto Miriam who spoke slander against her brother and was stricken with a leprous plague! (cf. Sifrei Devarim 275:1)."}, {"ch": 24, "v": 10, "aliyah": 6, "heb": "כִּֽי־תַשֶּׁ֥ה בְרֵֽעֲךָ֖ מַשַּׁ֣את מְא֑וּמָה לֹא־תָבֹ֥א אֶל־בֵּית֖וֹ לַעֲבֹ֥ט עֲבֹטֽוֹ׃", "onk": "אֲרֵי תַרְשֵׁי בְחַבְרָךְ רְשׁוּ מִדָּעַם לָא תֵעוּל לְבֵיתֵיהּ לְמִסַּב <b>מַשְׁכּוֹנֵיהּ<\/b>:", "onk_en": "If you become your fellow’s creditor for any amount of debt, do not enter his house to take his pledge [<b>collateral<\/b>].", "pj": "אֲרוּם תּוֹזְפוּן בְּחַבְרֵיכוֹן מִיזְפוּ דְמִדַּעַם לָא תֵיעוּל לְבֵיתֵיהּ לְמַשְׁכּוֹנֵי מַשְׁכּוֹנֵיהּ", "pj_en": "When a man hath lent any thing to his neighbour upon a pledge, he shall not enter into his house to take his pledge;", "tj": "", "tj_en": "", "rashi": "<b>כי תשה ברעך.<\/b> תָחֹב בַּחֲבֵרְךָ:<br><br><b>משאת מאומה.<\/b> חוֹב שֶׁל כְּלוּם:", "rashi_en": "כי תשה ברעך means, WHEN THOU EXACTEST A DEBT FROM THY FELLOW MAN;<br><br>משאת מאומה means, A DEBT OF ANYTHING (whatever it may be)."}, {"ch": 24, "v": 11, "aliyah": 6, "heb": "בַּח֖וּץ תַּעֲמֹ֑ד וְהָאִ֗ישׁ אֲשֶׁ֤ר אַתָּה֙ נֹשֶׁ֣ה ב֔וֹ יוֹצִ֥יא אֵלֶ֛יךָ אֶֽת־הַעֲב֖וֹט הַחֽוּצָה׃", "onk": "בְּבָרָא תְּקוּם וְגַבְרָא דִּי אַתְּ רָשֵׁי בֵיהּ יַפֵּק לְוָתָךְ יָת <b>מַשְׁכּוֹנָא<\/b> לְבָרָא:", "onk_en": "Stand outside, and the man from whom you are claiming, will bring out the pledge [<b>collateral<\/b>] to you outside.", "pj": "בְּשׁוּקָא תֵּיקוּם וְגַבְרָא דְאַנְתְּ מוֹזִיף בֵּיהּ יָפִיק לָךְ יַת מַשְׁכּוֹנָא לְשׁוּקָא", "pj_en": "he shall stand in the street, and the man to whom thou hast made the loan shall bring out the pledge to thee into the street.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 12, "aliyah": 6, "heb": "וְאִם־אִ֥ישׁ עָנִ֖י ה֑וּא לֹ֥א תִשְׁכַּ֖ב בַּעֲבֹטֽוֹ׃", "onk": "וְאִם גְּבַר מִסְכֵּן הוּא לָא תִשְׁכּוּב <b>בְּמַשְׁכּוֹנֵיהּ<\/b>:", "onk_en": "And if he is a poor man, do not repose with his collateral [in your possession].", "pj": "וְאִין גְּבַר מִסְכֵּין הוּא לָא תָבִית וּמַשְׁכּוֹנֵיהּ גַּבָּךְ", "pj_en": "If the man be poor, thou shalt not have his pledge all night with thee;", "tj": "", "tj_en": "", "rashi": "<b>לא תשכב בעבטו.<\/b> לֹא תִשְׁכַּב וַעֲבוֹטוֹ אֶצְלְךָ (ספרי; בבא מציעא קי\"ד):", "rashi_en": "לא תשכב בעבטו THOU SHALT NOT SLEEP IN HIS PLEDGE — This means, thou shalt not go to sleep having his pledge with thee (Sifrei Devarim 277:2; Bava Metzia 111b)."}, {"ch": 24, "v": 13, "aliyah": 6, "heb": "הָשֵׁב֩ תָּשִׁ֨יב ל֤וֹ אֶֽת־הַעֲבוֹט֙ כְּב֣וֹא הַשֶּׁ֔מֶשׁ וְשָׁכַ֥ב בְּשַׂלְמָת֖וֹ וּבֵֽרְכֶ֑ךָּ וּלְךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִפְנֵ֖י יְהֹוָ֥ה אֱלֹהֶֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אָתָבָא תָתֵב לֵיהּ יָת <b>מַשְׁכּוֹנָא<\/b> כְּמֵעַל שִׁמְשָׁא וְיִשְׁכּוּב בִּכְסוּתֵיהּ וִיבָרֵכִנָּךְ וְלָךְ תְּהֵי <b>זְכוּתָא<\/b> קֳדָם יְיָ אֱלָהָךְ:", "onk_en": "Return are you to return the pledge [<b>collateral<\/b>] to him at sunset, and he will sleep with his garment and bless you; and it will be to your credit [<b>merit<\/b>] before Adonoy, your God.", "pj": "אוֹתָבָא תְתִיב לֵיהּ יַת מַשְׁכּוֹנָא כַּד מִטְמַע שִׁימְשָׁא וְיִגְנֵי בִּגְלוֹפְקְרֵיהּ וִיבָרְכִינָךְ וְלָךְ תְּהֵי זְכוּ דְּיַסְהִיד עֲלָךְ שִׁימְשָׁא קֳדָם יְיָ אֱלָהָךְ", "pj_en": "as the sun goeth down, thou shalt return the pledge, that he may lie in his garment and may bless thee; and to thee it shall be righteousness, for the sun shall bear the witness of thee before the Lord thy God.", "tj": "מַחֲזוֹרָא תַּחֲזוֹר לֵיהּ יַת מַשְׁכּוֹנָא כְּמֵיעַל שִׁימְשָׁא וְאִידְמוֹךְ בְּאִיסְטַלְיָתֵיהּ וִיבָרִיךְ יָתָךְ וְלָךְ תֶּהֱוֵי זְכוּ קֳדָם יְיָ אֱלָהָךְ:", "tj_en": "Thou shalt certainly return the pledge to him as the sun goeth down, that he may sleep in his garment, and may bless thee and to thee it shall be righteousness before the Lord thy God.", "rashi": "<b>כבוא השמש.<\/b> אִם כְּסוּת לַיְלָה הוּא, וְאִם כְּסוּת יוֹם — הַחֲזִירֵהוּ בַבֹּקֶר, וּכְבָר כָּתוּב בִּוְאֵלֶּה הַמִּשְׁפָּטִים (כ\"ב) \"עַד בֹּא הַשֶּׁמֶשׁ תְּשִׁיבֶנּוּ לוֹ\" — כָּל הַיּוֹם תְּשִׁיבֶנּוּ לוֹ, וּכְבֹא הַשֶּׁמֶשׁ תִּקָּחֶנּוּ:<br><br><b>וברכך.<\/b> וְאִם אֵינוֹ מְבָרֶכְךָ, מִכָּל מָקוֹם <b>ולך תהיה צדקה<\/b> (ספרי):", "rashi_en": "כבוא השמש [THOU SHALT RESTORE HIM THE PLEDGE] WHEN THE SUN GOETH DOWN — if it be a night garment; whilst if it be a garment worn during the day restore it to him in the morning. This, indeed, has already been written in the section beginning with the words ואלה המשפטים (Exodus 22:25) “Restore it unto him till the going down of the sun” which means: restore it unto him for the whole day and at nightfall you may take it again [till the daybreak of the next morning] (Bava Metzia 114b; cf. Rashi on Exodus 22.25.2 and Note thereon).<br><br>וברכך AND HE WILL BLESS THEE — and even if he will not bless thee, in any case, ולך תהיה צדקה IT SHALL BE RIGHTEOUSNESS UNTO THEE [BEFORE THE LORD THY GOD] (Sifrei Devarim 277:4)."}, {"ch": 24, "v": 14, "aliyah": 7, "heb": "לֹא־תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְאֶבְי֑וֹן מֵאַחֶ֕יךָ א֧וֹ מִגֵּרְךָ֛ אֲשֶׁ֥ר בְּאַרְצְךָ֖ בִּשְׁעָרֶֽיךָ׃", "onk": "לָא תְעִשּׁוּק אֲגִירָא עַנְיָא וּמִסְכֵּנָא מֵאַחָיךְ אוֹ מִגִּיּוֹרָךְ דִּי בְאַרְעָךְ בְּקִרְוָיךְ:", "onk_en": "Do not steal from the wage earner who is poor or destitute; from your brothers or your converts who are in your land in your cities.", "pj": "לָא תִטְלוֹמוּן חַבְרֵיכוֹן וְלָא תְשַׁנּוּן סוֹטְרֵיהּ דְּאַגְרָא עַנְיָא וּמִסְכְּנָא מִן אֲחֵיכוֹן אוֹ מִן גִּיּוֹרֵיכוֹן דְּמִתְגַּיְירִין בְּאַרְעֲכוֹן בְּקִירְוֵיכוֹן", "pj_en": "You shall not be hard upon your neighbours, or shift (or decrease) the wages of the needy and poor hireling of thy brethren, or of the strangers who sojourn in your land, in your cities.", "tj": "לָא תַעֲצוּן אַגְרָא דַאֲגִירָא מִסְכֵּינָא וּצְרִיכָא מִן אֲחוּכוֹן:", "tj_en": "You shall not willfully keep back the wages of the poor and needy of your brethren.", "rashi": "<b>לא תעשק שכיר.<\/b> וַהֲלֹא כְבָר כָּתוּב? אֶלָּא לַעֲבֹר עַל הָאֶבְיוֹן בִּשְׁנֵי לָאוין, \"לֹא תַעֲשֹׁק שְׂכַר שָׂכִיר\" שֶׁהוּא עָנִי וְאֶבְיוֹן, וְעַל הֶעָשִׁיר כְּבָר הֻזְהַר (ויקרא י\"ט) \"לֹא תַעֲשֹׁק אֶת רֵעֲךָ\" (ב\"מ ס\"א):<br><br><b>אביון.<\/b> הַתָּאֵב לְכָל דָּבָר:<br><br><b>מגרך.<\/b> זֶה גֵּר צֶדֶק:<br><br><b>בשעריך.<\/b> זֶה גֵּר תּוֹשָׁב הָאוֹכֵל נְבֵלוֹת:<br><br><b>אשר בארצך.<\/b> לְרַבּוֹת שְׂכַר בְּהֵמָה וְכֵלִים (בבא מציעא קי\"א):", "rashi_en": "לא תעשק שכיר THOU SHALT NOT WRONG ANY HIRED SERVANT — But has not this already been stated in Leviticus 19:13? But it is repeated here to make one transgress in respect of the hired, servant who is poor (i.e., if he wrongs such a person) two negative commands, for the meaning of the text here is: thou shalt not suppress the wages of an hired servant who is poor and needy. (The meaning is not: thou shalt not wrong a hired servant, the poor and the needy). As to the well-to-do hired servant one has already been prohibited to wrong him (Leviticus 19:13): “thou shalt not wrong thy neighbour” (Bava Metzia 61a).<br><br>אביון is one who longs for everything, (lacks all the necessities of life; cf. Rashi on Deuteronomy 15:4).<br><br>מגרך [WHETHER HE BE OF THY BRETHREN, OR] OF ANY STRANGERS — this refers to a “proselyte of righteousness” (who embraces the entire Jewish Faith out of conviction) (Sifrei Devarim 278:4),<br><br>בשערך [STRANGERS THAT ARE] WITHIN THY GATES — this refers to a stranger [who has undertaken not to worship idols] but eats carrion (who may reside in the land of Israel) (Sifrei Devarim 278:5), <br><br>אשר בארצך [OF ANY STRANGERS] THAT ARE IN THY LAND — this is intended to include in the prohibition of withholding what is due to one’s neighbor the payment for using his animals or utensils (Sifrei Devarim 278:5; Bava Metzia 111b)."}, {"ch": 24, "v": 15, "aliyah": 7, "heb": "בְּיוֹמוֹ֩ תִתֵּ֨ן שְׂכָר֜וֹ וְֽלֹא־תָב֧וֹא עָלָ֣יו הַשֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְאֵלָ֕יו ה֥וּא נֹשֵׂ֖א אֶת־נַפְשׁ֑וֹ וְלֹֽא־יִקְרָ֤א עָלֶ֙יךָ֙ אֶל־יְהֹוָ֔ה וְהָיָ֥ה בְךָ֖ חֵֽטְא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּיוֹמֵיהּ תִּתֵּן אַגְרֵיהּ וְלָא תֵעוּל עֲלוֹהִי שִׁמְשָׁא אֲרֵי עַנְיָא הוּא וְלֵיהּ הוּא <b>מְסַר<\/b> יָת נַפְשֵׁיהּ וְלָא יִקְרֵי עֲלָךְ <b>קֳדָם<\/b> יְיָ וִיהֵי בָךְ חוֹבָא:", "onk_en": "On its day give his wage and let the sun not set upon it, for he is a poor man, and he places his life in jeopardy for it; [so that] he should not complain about you to [<b>before<\/b>] Adonoy, and you will have a sin.", "pj": "בְּיוֹמֵיהּ תִּפְרַע לֵיהּ סוֹטְרֵיהּ וְלָא תִטְמוֹעַ עֲלוֹי שִׁמְשָׁא מְטוֹל דְּעַנְיָא הוּא וּמְטוּלְתֵּיהּ הוּא סָבַר לְקַיְימָא יַת נַפְשֵׁיהּ וְלָא יִקְבּוֹל עֲלָךְ קֳדָם יְיָ וִיהֵי בָּךְ חוֹבָא", "pj_en": "In his day thou shalt pay him his hire. Nor let the sun go down upon it; because he is poor, and he hopes (for that hire) to sustain his life: lest he appeal against thee before the Lord, and it be guilt in thee.", "tj": "בְּיוֹמֵיהּ תִּתֵּן אַגְרֵיהּ וְלָא תִטְמוֹעַ עֲלוֹהִי שִׁמְשָׁא אֲרוּם מִסְכֵּין הוּא וּמִן בְּגִין אַגְרָא הוּא סָבָל לֵיהּ יַת נַפְשֵׁיהּ וְלָא יִצְוַח עֲלֵיכוֹן קֳדָם יְיָ אִיזְדַּהֲרוּ דְלָא יֶהֱוֵי בְּכוֹן חוֹבָא:", "tj_en": "In his day thou shalt pay his wages, nor let the sun go down upon them; for he is poor, and by means of his hire he sustaineth his life: that he may not cry against thee before the Lord: so beware that it become not guilt in you.", "rashi": "<b>ואליו הוא נשא את נפשו.<\/b> אֶל הַשָּׂכָר הַזֶּה הוּא נוֹשֵׂא אֶת נַפְשׁוֹ לָמוּת, עָלָה בַכֶּבֶשׁ וְנִתְלָה בְאִילָן (ספרי; ב\"מ קי\"ב):<br><br><b>והיה בך חטא.<\/b> מִכָּל מָקוֹם, אֶלָּא שֶׁמְּמַהֲרִין לִפָּרֵעַ עַל יְדֵי הַקּוֹרֵא (ספרי):", "rashi_en": "ואליו הוא נשא את נפשו means, for the sake of this hire he exposes his life even unto death: he climbs up a steep staircase or hangs on to a high tree to do his work (Sifrei Devarim 279:3; Bava Metzia 112a).<br><br>והיה בך חטא [LEST HE CALL AGAINST THEE UNTO THE LORD,] AND IT BE SIN UNTO THEE — under any circumstances, even if he does not call against thee to the Lord, but greater haste is made to punish thee because of him who cries (Sifrei Devarim 279:4; cf. Rashi on Deuteronomy 15:9)."}, {"ch": 24, "v": 16, "aliyah": 7, "heb": "לֹֽא־יוּמְת֤וּ אָבוֹת֙ עַל־בָּנִ֔ים וּבָנִ֖ים לֹא־יוּמְת֣וּ עַל־אָב֑וֹת אִ֥ישׁ בְּחֶטְא֖וֹ יוּמָֽתוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא יְמוּתוּן אֲבָהָן עַל <b>פּוּם<\/b> בְּנִין וּבְנִין לָא יְמוּתוּן עַל <b>פּוּם<\/b> אֲבָהָן אֱנַשׁ בְּחוֹבֵיהּ יְמוּתוּן:", "onk_en": "Fathers shall not be executed through [<b>by the mouths of<\/b>] sons, and sons shall not be executed through [<b>by the mouths of<\/b>] fathers; each to be executed for his sin.", "pj": "לָא יִתְקַטְלוּן אַבְהָן לָא בְּסַהֲדוּת וְלָא בְחוֹבֵי בְּנִין וּבְנִין לָא יִתְקַטְלוּן לָא בְסַהֲדוּת וְלָא בְחוֹבֵי אַבְהָן אִישׁ בְּחוֹבֵי עַל סַהֲדִין כְּשֵׁירִין יִתְקַטְלוּן", "pj_en": "Fathers shall not die either by the testimony or for the sin of the children, and children shall not die either by the testimony or for the sin of the fathers: every one shall die, by proper witnesses, for his own sin.", "tj": "", "tj_en": "", "rashi": "<b>לא יומתו אבות על בנים.<\/b> בְּעֵדוּת בָּנִים, וְאִם תֹּאמַר בַּעֲוֹן בָּנִים, כְּבָר נֶאֱמַר <b>איש בחטאו יומתו<\/b> (ספרי; סנהדרין כ\"ז):<br><br><b>איש בחטאו יומתו.<\/b> אֲבָל מִי שֶׁאֵינוֹ אִישׁ מֵת בַּעֲוֹן אָבִיו, וְהַקְּטַנִּים מֵתִים בַּעֲוֹן אֲבוֹתָם בִּידֵי שָׁמַיִם (ספרי):", "rashi_en": "לא יומתו אבות על בנים FATHERS SHALL NOT BE PUT TO DEATH על בנים — i.e. by the evidence of their children. But if you say it means “for the sin of their children”, then it would be redundant for it goes on to state “every man shall be put to death for his own sin” (Sifrei Devarim 280:1; Sanhedrin 27b).<br><br>איש בחטאו יומתו EVERY MAN SHALL BE PUT TO DEATH FOR HIS OWN SIN — This suggests: but one who is not yet an איש, a man, does sometimes die on account of his father’s sins: little children sometimes die at the hands of Heaven because of their parents’ sins (Sifrei Devarim 280:3)."}, {"ch": 24, "v": 17, "aliyah": 7, "heb": "לֹ֣א תַטֶּ֔ה מִשְׁפַּ֖ט גֵּ֣ר יָת֑וֹם וְלֹ֣א תַחֲבֹ֔ל בֶּ֖גֶד אַלְמָנָֽה׃", "onk": "לָא <b>תַצְלֵי<\/b> דִין גִּיּוֹרָא וְיִתַּמָּא וְלָא תִסַּב <b>מַשְׁכּוֹנָא<\/b> לְבוּשׁ אַרְמְלָא:", "onk_en": "Do not be devious in [<b>forcibly wrench<\/b>] the judgment of the proselyte or orphan; and you may not secure as collateral, a widow’s garment.", "pj": "לָא תַצְלֵי דִין גִּיּוֹרָא וְיַתְמָא וְאַרְמְלָא וְלָא יְמַשְׁכַּן חַד מִנְכוֹן כְּסוּ דְאַרְמַלְתָּא דְלָא יְקוּמוּן שִׁיבְבוֹן בִּישִׁין וְיִפְקוּן עֲלָךְ טִיב בִּישׁ כַּד תְּהַדְרוּן מַשְׁכּוֹנָא לָהּ", "pj_en": "Thou shalt not warp the judgment of the stranger, the orphan, or the widow, nor shall any one of you take the garment of the widow for a pledge, that evil neighbours rise not and bring out a bad report against her when you return her pledge unto her.", "tj": "", "tj_en": "", "rashi": "<b>לא תטה משפט גר יתום.<\/b> וְעַל הֶעָשִׁיר כְּבָר הֻזְהַר (דברים ט\"ז) \"לֹא תַטֶּה מִשְׁפָּט\", וְשָׁנָה בֶעָנִי לַעֲבֹר עָלָיו בִּשְׁנֵי לָאוין, לְפִי שֶׁנָּקֵל לְהַטּוֹת מִשְׁפַּט עָנִי יוֹתֵר מִשֶּׁל עָשִׁיר, לְכָךְ הִזְהִיר וְשָׁנָה עָלָיו (ספרי):<br><br><b>ולא תחבל.<\/b> שֶׁלֹּא בִשְׁעַת הַלְוָאָה:", "rashi_en": "לא תטה משפט גר יתום THOU SHALT NOT PERVERT THE JUDGMENT OF THE STRANGER, OR OF THE FATHERLESS — and with regard to the well-to-do one has already been forbidden to do so (Deuteronomy 16:19): “Thou shalt not pervert judgment”, (which is a general prohibition including both poor and rich), but it (Scripture) repeats it regarding the poor in order to make one who perverts the judgment of the poor transgress two negative commands. Because it is easier to pervert the judgment of the defenseless poor than that of the rich, therefore Scripture lays down a prohibition regarding him a second time (Sifrei Devarim 281:1).<br><br>ולא תחבל NOR TAKE [A WIDOW’S GARMENT] TO PLEDGE — The term חבל refers to taking a pledge not at the time when the loan is transacted (but when default is made in payment) (cf. Bava Metzia 115a; see also Rashi on Exodus 22:25)."}, {"ch": 24, "v": 18, "aliyah": 7, "heb": "וְזָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֙יתָ֙ בְּמִצְרַ֔יִם וַֽיִּפְדְּךָ֛ יְהֹוָ֥ה אֱלֹהֶ֖יךָ מִשָּׁ֑ם עַל־כֵּ֞ן אָנֹכִ֤י מְצַוְּךָ֙ לַעֲשׂ֔וֹת אֶת־הַדָּבָ֖ר הַזֶּֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִדְכַּר אֲרֵי עַבְדָּא הֲוֵיתָא בְּמִצְרַיִם וּפָרְקָךְ יְיָ אֱלָהָךְ מִתַּמָּן עַל כֵּן אֲנָא מְפַקְּדָךְ לְמֶעְבַּד יָת פִּתְגָּמָא הָדֵין:", "onk_en": "Remember that you were a slave in Egypt, and Adonoy, your God, redeemed you from there; that is why I am commanding you to do this thing.", "pj": "וְתֶהֱווּן דְּכִירִין אֲרוּם מְשַׁעַבְּדִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרַיִם וּפְרַק יַתְכוֹן מֵימְרָא דַיְיָ אֱלָהָכוֹן מִתַּמָּן בְּגִין כֵּן אֲנָא מְפַקֵּיד לְכוֹן לְמֶעֱבַד יַת פִּתְגָמָא הָדֵין", "pj_en": "And remember that you were bondservants in the land of Mizraim, and that the Word of the Lord your God delivered you from thence; therefore have I commanded you to observe this thing.", "tj": "", "tj_en": "", "rashi": "<b>וזכרת.<\/b> עַל מְנָת כֵּן פְּדִיתִיךָ, לִשְׁמֹר חֻקּוֹתַי אֲפִלּוּ יֵשׁ חֶסְרוֹן כִּיס בַּדָּבָר:", "rashi_en": "וזכרת BUT THOU SHALT REMEMBER [THAT THOU WAST A SERVANT IN EGYPT AND THE LORD THY GOD RELEASED THEE THENCE] — I released you only with this condition — that you should observe my statutes even though there be monetary loss in the matter."}, {"ch": 24, "v": 19, "aliyah": 7, "heb": "כִּ֣י תִקְצֹר֩ קְצִֽירְךָ֨ בְשָׂדֶ֜ךָ וְשָֽׁכַחְתָּ֧ עֹ֣מֶר בַּשָּׂדֶ֗ה לֹ֤א תָשׁוּב֙ לְקַחְתּ֔וֹ לַגֵּ֛ר לַיָּת֥וֹם וְלָאַלְמָנָ֖ה יִהְיֶ֑ה לְמַ֤עַן יְבָרֶכְךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּכֹ֖ל מַעֲשֵׂ֥ה יָדֶֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי תַחְצוֹד חֲצָדָךְ בְּחַקְלָךְ וְתִנְשֵׁי עֻמְרָא בְחַקְלָא לָא תְתוּב לְמִסְּבֵיהּ לְגִיּוֹרָא לְיִתַּמָּא וּלְאַרְמְלָא יְהֵי בְּדִיל דִּיבָרֵכִנָּךְ יְיָ אֱלָהָךְ בְּכֹל עוֹבָדֵי יְדָךְ:", "onk_en": "When you reap your reaping in your field, and you forget a sheaf in the field, you may not return to take it; for the proselyte, for the orphan, and for the widow let it be; in order that Adonoy, your God, will bless you in all your endeavors.", "pj": "אֲרוּם תְּחַצְדוּן חַצְדֵיכוֹן בְּחַקְלֵיכוֹן וְתִתְנְשׁוּן עוּמְרָא בְּחַקְלָא לָא תְתוּבוּן לְמִסְבֵיהּ לְגִיּוֹרָא לְיַתְמָא וּלְאַרְמַלְתָּא יְהֵי מְטוּל דִּי יְבָרְכֵכוּן מֵימְרָא דַיְיָ אֱלָהָכוֹן בְּכָל עוֹבָדֵי יְדֵיכוֹן", "pj_en": "When you have reaped your harvests in your fields, and have forgotten a sheaf in the field, you shall not return to take it; let it be for the stranger, the orphan, and the widow, that the Word of the Lord your God may bless you in all the works of your hands.", "tj": "", "tj_en": "", "rashi": "<b>ושכחת עמר.<\/b> וְלֹא גָדִישׁ, מִכָּאן אָמְרוּ, עֹמֶר שֶׁיֵּשׁ בּוֹ סָאתַיִם וּשְׁכָחוֹ אֵינוֹ שִׁכְחָה (פאה ו' מ\"ב):<br><br><b>בשדה.<\/b> לְרַבּוֹת שִׁכְחַת קָמָה שֶׁשָּׁכַח מִקְצָתָהּ מִלִּקְצֹר:<br><br><b>לא תשוב לקחתו.<\/b> מִכָּאן אָמְרוּ, שֶׁלְּאַחֲרָיו שִׁכְחָה, שֶׁלְּפָנָיו אֵינוֹ שִׁכְחָה, שֶׁאֵינוֹ בְּבַל תָּשׁוּב (פאה מ\"ד; בבא מציעא י\"א):<br><br><b>למען יברכך.<\/b> וְאַעַ\"פִּ שֶׁבָּאת לְיָדוֹ שֶׁלֹּא בְמִתְכַּוֵּן, קַ\"וָ לָעוֹשֶׂה בְמִתְכַּוֵּן. אֱמֹר מֵעַתָּה נָפְלָה סֶלַע מִיָּדוֹ וּמְצָאָהּ עָנִי וְנִתְפַּרְנֵס בָּהּ — הֲרֵי הוּא מִתְבָּרֵךְ עָלֶיהָ (ספרי):", "rashi_en": "ושכחת עמר [WHEN THOU REAPEST THY HARVEST IN THY FIELD] AND HAST FORGOT A SHEAF … [THOU SHALT NOT RETURN TO TAKE IT] — a sheaf, but not a stack of corn (Sifrei Devarim 283:1). Hence they (the Rabbis) said, “A sheaf that contains two Seahs of grain which one has forgotten in the field, does not come under the term of שכחה (a forgotten sheaf)” (Mishnah Peah 6:6).<br><br>בשדה [AND HAST FORGOT …] IN THE FIELD — This apparently redundant word (it has just stated בשדך) is intended to include under this law forgotten “standing corn” (קמה) — that one has forgotten to cut down part of it (Sifrei Devarim 283:2).<br><br>לא תשוב לקחתו THOU SHALT NOT GO BACK TO TAKE IT — Hence they (the Rabbis) said: A sheaf that is behind him is considered as שכחה, that which is in front of him is not considered שכחה, for the expression “thou shalt not go back [to take it]” is not applicable to it (Mishnah Peah 6:4; Bava Metzia 11a).<br><br>למען יברכך THAT [THE LORD THY GOD] BLESS THEE — although it came into his (the stranger’s or the orphan’s) hand without him (the owner) intending this; it follows logically that he will certainly receive a blessing if he does this intentionally! — You must therefore admit that if a Sela fell out of one’s hand and a poor man found it and supports himself by it, then he will surely be blessed on that account (Sifrei Devarim 283:6; cf. Rashi on Leviticus 5:17 end)."}, {"ch": 24, "v": 20, "aliyah": 7, "heb": "כִּ֤י תַחְבֹּט֙ זֵֽיתְךָ֔ לֹ֥א תְפַאֵ֖ר אַחֲרֶ֑יךָ לַגֵּ֛ר לַיָּת֥וֹם וְלָאַלְמָנָ֖ה יִהְיֶֽה׃", "onk": "אֲרֵי תַחְבּוֹט זֵיתָךְ לָא תְפַלֵּי בַּתְרָךְ לְגִיּוֹרָא לְיִתַּמָּא וּלְאַרְמְלָא יְהֵי:", "onk_en": "When you harvest your olive tree, you may not strip it of its glory behind you. for the proselyte, for the orphan, and for the widow let it be.", "pj": "אֲרוּם תִּשְׁבְּטוּן זֵיתֵיכוֹן לָא תְבַקְרִינוּן מִן בַּתְרֵיכוֹן לְגִיּוֹרָא לְיַתְמָא וּלְאַרְמְלָא יֶהֱווֹן", "pj_en": "When you beat your olive trees, you shall not search them after (you have done it); for the stranger, the orphan, and widow, let it be.", "tj": "אֲרוּם תִּתְרוּן זֵיתֵיכוֹן לָא תִתְבַּקְרוּן יַתְהוֹן מִן בָּתַר כֵּן לְגִיּוֹרָא לְיַתְמָא וּלְאַרְמְלָא יְהוֹן:", "tj_en": "When you beat your olive trees, search them not afterward; let them be for the stranger, the orphan, and the widow.", "rashi": "<b>לא תפאר.<\/b> לֹא תִטֹּל תִּפְאַרְתּוֹ מִמֶּנּוּ (חולין קל\"א), מִכָּאן שֶׁמַּנִּיחִין פֵּאָה לָאִילָן:<br><br><b>אחריך.<\/b> זוֹ שִׁכְחָה:", "rashi_en": "לא תפאר — This means: thou shalt not entirely remove its (the olive tree’s) glory (תפארת) from it, i.e., its fruit (Chullin 131b). Hence they (the Rabbis) derived the law that one must leave פאה (some quantity of fruit) also on fruit-trees for the poor (cf. Mishnah Peah 4:1).<br><br>אחריך BEHIND THEE — This implies שכחה (forgotten fruit; that if he forgets to remove some fruit from the orchard, he must leave it for the poor)."}, {"ch": 24, "v": 21, "aliyah": 7, "heb": "כִּ֤י תִבְצֹר֙ כַּרְמְךָ֔ לֹ֥א תְעוֹלֵ֖ל אַחֲרֶ֑יךָ לַגֵּ֛ר לַיָּת֥וֹם וְלָאַלְמָנָ֖ה יִהְיֶֽה׃", "onk": "אֲרֵי תִקְטוֹף כַּרְמָךְ לָא תְעָלֵל בַּתְרָךְ לְגִיּוֹרָא לְיִתַּמָּא וּלְאַרְמְלָא יְהֵי:", "onk_en": "When you harvest your vineyard you may not harvest pygmy vines behind you; for the proselyte, for the orphan, and for the widow let it be.", "pj": "אֲרוּם תַּקְפוּן כַּרְמֵיכוֹן לָא תְעָלֵיל מִן בַּתְרֵיכוֹן לְגִיּוֹרָא לְיַתְמָא וּלְאַרְמְלָא יֶהֱווֹן", "pj_en": "When you gather in your vineyard, you shall not glean the branches after you; they shall be for the stranger, the orphan, and widow.", "tj": "אֲרוּם תִּקְטְפוּן כַּרְמֵיכוֹן לָא תְבַעֲרוּ טוֹטְלָוַתְהוֹן מִבָּתַר כֵּן לְגִיּוֹרָא לְיַתְמָא וּלְאַרְמַלְתָּא יֶהֱווֹן:", "tj_en": "When you gather your vines, search not their branches afterwards; let them be for the stranger and the widow.", "rashi": "<b>לא תעולל.<\/b> אִם מָצָאתָ בוֹ עוֹלֵלוֹת, לֹא תִקָּחֶנָּה. וְאֵי זוֹ הִיא עוֹלֵלוֹת? כָּל שֶׁאֵין לָהּ לֹא כָּתֵף וְלֹא נָטֵף. יֵשׁ לָהּ אֶחָד מֵהֶם — הֲרֵי הִיא לְבַעַל הַבַּיִת (ספרא); וְרָאִיתִי בְתַלְמוּד יְרוּשַׁלְמִי אֵי זוֹ הִיא כָּתֵף? פְּסִיגִין זֶה עַל גַּב זֶה, נָטֵף — אֵלּוּ הַתְּלוּיוֹת בַּשִּׁדְרָה וְיוֹרְדוֹת:", "rashi_en": "לא תעולל [WHEN THOU GATHEREST THE GRAPES OF THY VINEYARD] THOU SHALT NOT GLEAN IT — i.e., if you find tender grapes in it, thou shalt not take them away. And what are עוללות? Clusters which have neither כתף, “arms” nor נטף “drippings” If, however, they have one of these, then it belongs to the owner of the vineyard (not to the poor) (Mishnah Peah 7:4). (Cf. Rashi on Leviticus 19:10 and our translation and Note thereon). — I have seen the following in the Talmud Yerushalmi Peah 7:4: What is כתף? Where the branches lie one upon the other: whilst נטף are those which hang down directly from the central stem."}, {"ch": 24, "v": 22, "aliyah": 7, "heb": "וְזָ֣כַרְתָּ֔ כִּי־עֶ֥בֶד הָיִ֖יתָ בְּאֶ֣רֶץ מִצְרָ֑יִם עַל־כֵּ֞ן אָנֹכִ֤י מְצַוְּךָ֙ לַעֲשׂ֔וֹת אֶת־הַדָּבָ֖ר הַזֶּֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִדְכַּר אֲרֵי עַבְדָּא הֲוֵיתָא בְּאַרְעָא דְמִצְרָיִם עַל כֵּן אֲנָא מְפַקְּדָךְ לְמֶעְבַּד יָת פִּתְגָּמָא הָדֵין:", "onk_en": "Remember that you were a slave in the land of Egypt; that is why I am commanding you to do this thing.", "pj": "וְתֶהֱווּן דְּכִירִין אֲרוּם מְשַׁעְבְּדִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרַיִם בְּגִין כֵּן אֲנָא מְפַקֵּיד לְכוֹן לְמֶעֱבַד יַת פִּתְגָמָא הָדֵין", "pj_en": "So remember that you were bondservants in the land of Mizraim; therefore I command you to do this thing.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 1, "aliyah": 7, "heb": "כִּֽי־יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְנִגְּשׁ֥וּ אֶל־הַמִּשְׁפָּ֖ט וּשְׁפָט֑וּם וְהִצְדִּ֙יקוּ֙ אֶת־הַצַּדִּ֔יק וְהִרְשִׁ֖יעוּ אֶת־הָרָשָֽׁע׃", "onk": "אֲרֵי יְהֵי <b>דִין<\/b> בֵּין גֻּבְרַיָּא וְיִתְקָרְבוּן לְדִינָא וִידוּנֻנּוּן וִיזַכּוּן יָת זַכָּאָה וִיחַיְּבוּן יָת חַיָּבָא:", "onk_en": "If a quarrel [<b>lawsuit<\/
