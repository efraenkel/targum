ead a white skin-eruption, tinged with red, it is <i>tzoraas<\/i> [<b>‘confinement’<\/b>] sprouting in his frontal baldness or in his posterior baldness.", "pj": "וַאֲרוּם יְהֵא בְּקָרוּחְתָּא אוֹ בְגִילְשְׁלוּשְׁתָּא מַכְתַּשׁ חִיוַר סְמוּקְרֵי מְעַרַב סְגִירוּת סַגְיָא הוּא בְקוּרְחַתֵיהּ אוֹ בְגִלְשְׁלוּשְׁתֵּיהּ", "pj_en": "But, if his baldness or partial baldness hath in it a white plague mixed with red, it is a leprosy growing in his baldness or partial baldness.", "tj": "", "tj_en": "", "rashi": "<b>נגע לבן אדמדם.<\/b> פָּתוּךְ; מִנַּיִן שְׁאָר הַמַּרְאוֹת? תַּלְמוּד לוֹמַר נֶגַע:", "rashi_en": "נגע לבן אדמדם A RISING OF THE SORE REDDISH-WHITE — variegated (the term לבנה אדמדמת does not signify white and red each separately, but mingled: reddish-white). Whence may we learn that the plague is unclean too if it has the other colours (not variegated, but plain white shades of white which are the distinguishing characteristics of the plagues)? Because it states here: נגע, a plague (it describes it as a ‘‘plague” and therefore all colors applicable to a “plague” apply to it also)."}, {"ch": 13, "v": 43, "aliyah": 6, "heb": "וְרָאָ֨ה אֹת֜וֹ הַכֹּהֵ֗ן וְהִנֵּ֤ה שְׂאֵת־הַנֶּ֙גַע֙ לְבָנָ֣ה אֲדַמְדֶּ֔מֶת בְּקָרַחְתּ֖וֹ א֣וֹ בְגַבַּחְתּ֑וֹ כְּמַרְאֵ֥ה צָרַ֖עַת ע֥וֹר בָּשָֽׂר׃", "onk": "וְיֶחֱזֵי יָתֵיהּ כַּהֲנָא וְהָא <b>עַמִּיק<\/b> מַכְתָּשָׁא חַוְּרָא סַמְּקָא בְּקָרָחוּתֵיהּ אוֹ בִגְלוֹשׁוּתֵיהּ כְּמֶחֱזֵי <b>סְגִירוּתָא<\/b> מְשַׁךְ בִּסְרָא:", "onk_en": "The <i>kohein<\/i> shall see him, and behold! the spot of intense [<b>deep<\/b>] whiteness is tinged with red in his frontal baldness or in his posterior baldness just as the appearance <i>tzoraas<\/i> [<b>‘confinement’<\/b>] of the skin of the flesh.", "pj": "וְיֶחֱמֵי יָתֵיהּ כַּהֲנָא וְהָא שׁוּמַת מַכְתְּשָׁא חִיוְורָא סַמְקָא מְעַרְבָן בְּקוּרְחֲתֵיהּ אוֹ בְּגִלְשְׁלָשׁוּתֵיהּ הֵי כְחֵיזוֹ סְגִירוּת מְשַׁךְ בִּישְרָא", "pj_en": "And the priest shall look upon it, and, behold, if the spot of the plague be white mixed with red in his baldness, or partial baldness, like the appearance of leprosy in the skin of the flesh,", "tj": "", "tj_en": "", "rashi": "<b>כמראה צרעת עור בשר.<\/b> כְּמַרְאֵה הַצָּרַעַת הָאָמוּר בְּפָרָשַׁת \"עוֹר בָּשָׂר\" — אָדָם כִּי יִהְיֶה בְעוֹר בְּשָׂרוֹ, וּמָה אָמוּר בּוֹ? שֶׁמְּטַמֵּא בְאַרְבַּע מַרְאוֹת, וְנִדּוֹן בִּשְׁנֵי שָׁבוּעוֹת; וְלֹא כְמַרְאֵה צָרַעַת הָאָמוּר בִּשְׁחִין וּמִכְוָה שֶׁהוּא נִדּוֹן בְּשָׁבוּעַ אֶחָד, וְלֹא כְמַרְאֵה נְתָקִין שֶׁל מְקוֹם שֵׂעָר, שֶׁאֵין מְטַמְּאִין בְּאַרְבַּע מַרְאוֹת — שְׂאֵת וְתוֹלַדְתָּהּ, בַּהֶרֶת וְתוֹלַדְתָּהּ:", "rashi_en": "כמראה צרעת עור בשר AS THE COLOUR OF LEPROSY IN THE SKIN OF THE FLESH — it is like the colour of the leprosy which is mentioned in the section dealing with the plague on the skin of the flesh (v. 2): “When a man hath in the skin of his flesh …”.What is stated about that? That it makes one unclean by reason of four shades of white, and that it is subject to the law of quarantine during two weeks. And it is not to be treated like the colour of the leprosy mentioned in the case of the boil (v 18) or burn (v. 24) which though also unclean by reason of four shades of white are, however, subject to the law of quarantine for one week only, (i. e if at the end of the week there is neither white hair, nor has it spread the priest at once declares him clean); nor must it be treated as the colour of נתקין on a spot where hair grows — which do not make a person unclean by cause of four colours: a שאת and its subspecies, and that of a בהרת and its subspecies."}, {"ch": 13, "v": 44, "aliyah": 6, "heb": "אִישׁ־צָר֥וּעַ ה֖וּא טָמֵ֣א ה֑וּא טַמֵּ֧א יְטַמְּאֶ֛נּוּ הַכֹּהֵ֖ן בְּרֹאשׁ֥וֹ נִגְעֽוֹ׃", "onk": "גְּבַר <b>סְגִיר<\/b> הוּא מְסָאָב הוּא סָאֳבָא יְסָאֵבִנֵּיהּ כַּהֲנָא בְּרֵישֵׁיהּ מַכְתָּשֵׁיהּ:", "onk_en": "He is a person with <i>tzoraas,<\/i> [<b>‘confinement’<\/b>] he is unclean. The <i>kohein<\/i> shall declare him unclean; his skin-eruption is on his head.", "pj": "גְבַר סְגִיר הוּא מְסָאָב הוּא סָאֲבָא יְסַאֲבִינֵיהּ כַּהֲנָא מְטוּל דִבְרֵישֵׁיהּ מַכְתְּשֵׁיהּ", "pj_en": "he is a leprous man, he is unclean, and the priest shall verily make him to be unclean, for the plague is on his head.", "tj": "", "tj_en": "", "rashi": "<b>בראשו נגעו.<\/b> אֵין לִי אֶלָּא נְתָקִין, מִנַּיִן לְרַבּוֹת שְׁאָר הַמְנֻגָּעִים? תַּ\"ל \"טַמֵּא יְטַמְּאֶנּוּ\", לְרַבּוֹת אֶת כֻּלָּן — עַל כֻּלָּן הוּא אוֹמֵר בְּגָדָיו יִהְיוּ פְרֻמִים וְגוֹ':", "rashi_en": "בראשו נגעו HIS PLAGUE IS ON HIS HEAD — I have only a statement that the following laws apply to the case of נתקין, plagues on hairy places! Whence may we learn that there are included the sufferers from all other kinds of leprous plagues? Because it states מא יטמאנו‎ט, “he shall in any case proclaim him unclean”  (Sifra, Tazria Parashat Nega'im, Chapter 12 2)— thus including all of these: regarding all of these it says: “his garments shall be rent etc.”."}, {"ch": 13, "v": 45, "aliyah": 6, "heb": "וְהַצָּר֜וּעַ אֲשֶׁר־בּ֣וֹ הַנֶּ֗גַע בְּגָדָ֞יו יִהְי֤וּ פְרֻמִים֙ וְרֹאשׁוֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְעַל־שָׂפָ֖ם יַעְטֶ֑ה וְטָמֵ֥א&thinsp;<small>׀<\/small>&thinsp;טָמֵ֖א יִקְרָֽא׃", "onk": "<b>וּסְגִירָא<\/b> דִּי בֵיהּ מַכְתָּשָׁא לְבוּשׁוֹהִי יְהוֹן מְבַזְּעִין וְרֵישֵׁיהּ יְהֵי פְרִיעַ וְעַל שָׂפָם <b>כַּאֲבֵלָא<\/b> יִתְעַטָּף <b>וְלָא תִסְתַּאֲבוּן וְלָא תִסְתַּאֲבוּן<\/b> יִקְרֵי:", "onk_en": "The <i>tzorua<\/i> [<b>one who is ‘confined’<\/b>]—[the person] who has the skin-eruption—his garments shall have a tear in them, his hair shall be grown long, and he must cover his head down to his upper lip [<b>like a mourner<\/b>], and [<b>do not become<\/b>] Unclean, [<b>do not become<\/b>] unclean, shall he call out.", "pj": "וּמְצוֹרָעָא דְבֵיהּ מַכְתְּשָׁא לְבוּשׁוֹי יְהוֹן מְבַזְעוּן וְרֵישֵׁיהּ יְהֵי מֵרַבֵּי פֵּרוּעַ וְעַל סַפְרַיָא יֶהֱוֵי מְהַלֵךְ וְעַל שִיפְמֵי יְהֵי מְעַטֵף וְהֵי כַאֲבֵילָא יְהֵי לְבוּשׁ וּכְרוֹזָא מַכְרִיז וַאֲמַר רְחוּקוּ רְחוּקוּ מִן מְסָאֲבָא", "pj_en": "And the leper in whom is the plague shall have his clothes rent, and his hair shall be taken off, going to the shearer's, and his lips shall be covered; and he shall be clothed like a mourner, and crying, as a herald, he shall say, Keep off, keep off from the unclean!", "tj": "", "tj_en": "", "rashi": "<b>פרמים.<\/b> קְרוּעִים:<br><br><b>פרוע.<\/b> מְגֻדַּל שֵׂעָר:<br><br><b>ועל שפם יעטה.<\/b> כְּאָבֵל:<br><br><b>שפם.<\/b> שְׂעַר הַשְּׂפָתַיִם, גרנו\"ן בְּלַעַז:<br><br><b>וטמא טמא יקרא.<\/b> מַשְׁמִיעַ שֶׁהוּא טָמֵא וְיִפְרְשׁוּ מִמֶּנּוּ (ספרא, מועד קטן ה'):", "rashi_en": "פרומים signifies TORN.<br><br>פרוע means his head shall be over-grown with hair (Sifra, Tazria Parashat Nega'im, Chapter 13 6).<br><br>ועל שפם יעטה AND HE SHALL COVER HIS LIPS as one who mourns for the dead (Sifra, Tazria Parashat Nega'im, Chapter 13 7; cf. Onkelos).<br><br>שפם denotes the hair on the lips; grenon in old French, (English = moustache).<br><br>וטמא טמא יקרא AND HE SHALL CALL OUT, UNCLEAN, UNCLEAN — he must proclaim aloud that he is unclean, so that people may keep away from him (Sifra, Tazria Parashat Nega'im, Chapter 13 7; Moed Katan 5a)."}, {"ch": 13, "v": 46, "aliyah": 6, "heb": "כׇּל־יְמֵ֞י אֲשֶׁ֨ר הַנֶּ֥גַע בּ֛וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִח֥וּץ לַֽמַּחֲנֶ֖ה מוֹשָׁבֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל יוֹמֵי דִּי מַכְתָּשָׁא בֵיהּ יְהֵי מְסָאָב מְסָאָב הוּא בִּלְחוֹדוֹהִי יֵיתֵב מִבָּרָא לְמַשְׁרִיתָא מוֹתְבֵיהּ:", "onk_en": "All the days in which the skin-eruption is on him he shall be unclean; he is unclean. He shall dwell alone; his dwelling shall be beyond the encampment.", "pj": "כָּל יוֹמִין דְמַכְתְּשָׁא בֵיהּ יְהֵי מְסָאָב מְטוּל דִמְסָאָב הוּא בִּלְחוֹדוֹי יְתוּב וּלְצַד אִינְתְּתֵיהּ לָא יִתְקְרֵב מִבָּרָא לְמַשְׁרִיתָא מוֹתְבֵיהּ", "pj_en": "All the days that the plague is in him he shall be unclean, for unclean he is; he shall dwell alone by himself, to the side of his wife he must not come nigh, and his habitation shall be without the camp.", "tj": "", "tj_en": "", "rashi": "<b>בדד ישב.<\/b> שֶׁלֹּא יִהְיוּ טְמֵאִים יוֹשְׁבִין עִמּוֹ; וְאָמְרוּ רַבּוֹתֵינוּ מַה נִּשְׁתַּנָּה מִשְּׁאָר טְמֵאִים לֵישֵׁב בָּדָד? הוֹאִיל וְהוּא הִבְדִּיל בְּלָשׁוֹן הָרָע בֵּין אִישׁ לְאִשְׁתּוֹ וּבֵין אִישׁ לְרֵעֵהוּ, אַף הוּא יִבָּדֵל (ערכין ט\"ז):<br><br><b>מחוץ למחנה.<\/b> חוּץ לְשָׁלוֹשׁ מַחֲנוֹת:", "rashi_en": "בדד ישב HE SHALL ABIDE SOLITARY — This means that people who are unclean from other causes than that of leprosy shall not abide with him (Pesachim 67a; cf. Sifra). Our Rabbis said: Why is he (the leper) treated differently from other unclean persons that he should abide solitary? They replied: Because he, by slanderous statements, (cf. Numbers 12:10) parted man and wife, or a man from his friend, he must be parted from everybody (Arakhin 16b).<br><br>מחוץ למחנה WITHOUT THE CAMP — outside the three camps (see Rashi on Leviticus 4:12; cf. Sifra, Tazria Parashat Nega'im, Chapter 13 14 and Pesachim 67a)."}, {"ch": 13, "v": 47, "aliyah": 6, "heb": "וְהַבֶּ֕גֶד כִּֽי־יִהְיֶ֥ה ב֖וֹ נֶ֣גַע צָרָ֑עַת בְּבֶ֣גֶד צֶ֔מֶר א֖וֹ בְּבֶ֥גֶד פִּשְׁתִּֽים׃", "onk": "וּלְבוּשָׁא אֲרֵי יְהֵי בֵיהּ מַכְתַּשׁ <b>סְגִירוּ<\/b> בִּלְבוּשׁ עֲמַר אוֹ בִּלְבוּשׁ כִּתָּן:", "onk_en": "When in a garment there is a skin-eruption of <i>tzoraas,<\/i> [<b>‘confinement’<\/b>] whether a woolen garment or in a linen garment.", "pj": "וּלְבוּשָׁא אֲרוּם יְהֵי בֵיהּ מַכְתַּשׁ סְגִירוּ בִּלְבוּשׁ עֲמַר אוֹ בִּלְבוּשׁ כִּיתָּן", "pj_en": "And a garment in which is the plague of leprosy, whether a garment of wool or a garment of linen,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 48, "aliyah": 6, "heb": "א֤וֹ בִֽשְׁתִי֙ א֣וֹ בְעֵ֔רֶב לַפִּשְׁתִּ֖ים וְלַצָּ֑מֶר א֣וֹ בְע֔וֹר א֖וֹ בְּכׇל־מְלֶ֥אכֶת עֽוֹר׃", "onk": "אוֹ בְשִׁתְיָא אוֹ בְעַרְבָא לְכִתָּנָא וּלְעַמְרָא אוֹ בְמַשְׁכָּא אוֹ בְּכָל עֲבִידַת מְשָׁךְ:", "onk_en": "Or if it is the warp [lengthwise] threads, or in the woof [widthwise] threads, in a linen garment, or a woolen garment, or on leather or in any object made of leather.", "pj": "אוֹ בְשִׁתְיָא אוֹ בְעַרְבָא לְכִיתְּנָא וּלְעַמְרָא אוֹ בִּצְלָא אוֹ בְּכָל עִיבִידַת צְלָא", "pj_en": "whether in the warp or in the woof, in linen or in woollen, or in a skin, or in anything made of skin:", "tj": "", "tj_en": "", "rashi": "<b>לפשתים ולצמר.<\/b> שֶׁל פִּשְׁתִּים אוֹ שֶׁל צֶמֶר:<br><br><b>או בעור.<\/b> זֶה עוֹר שֶׁלֹא נַעֲשָׂה בוֹ מְלָאכָה:<br><br><b>או בכל מלאכת עור.<\/b> זֶה עוֹר שֶׁנַּעֲשָׂה בוֹ מְלָאכָה:", "rashi_en": "לפשתים ולצמר‎ means OF FLAX OR OF WOOL.<br><br>או בעור WHETHER IN A SKIN — this is a skin which has not been manufactured (of which no article has been made).<br><br>או במלאכת עור OR IN ANYTHING MADE OF SKIN — this is a skin which has been manufactured."}, {"ch": 13, "v": 49, "aliyah": 6, "heb": "וְהָיָ֨ה הַנֶּ֜גַע יְרַקְרַ֣ק&thinsp;<b>׀<\/b> א֣וֹ אֲדַמְדָּ֗ם בַּבֶּ֩גֶד֩ א֨וֹ בָע֜וֹר אֽוֹ־בַשְּׁתִ֤י אוֹ־בָעֵ֙רֶב֙ א֣וֹ בְכׇל־כְּלִי־ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְהׇרְאָ֖ה אֶת־הַכֹּהֵֽן׃", "onk": "וִיהֵי מַכְתָּשָׁא <b>יָרוֹק אוֹ סַמּוֹק<\/b> בִּלְבוּשָׁא אוֹ בְמַשְׁכָּא אוֹ בְשִׁתְיָא אוֹ בְעַרְבָא אוֹ בְכָל מַאן דִּמְשַׁךְ מַכְתַּשׁ <b>סְגִירוּתָא<\/b> הוּא וְיִתַּחֲזֵי לְכַהֲנָא:", "onk_en": "If the plague is deep green or deep red [<b>green or red<\/b>], in the garment, or in the leather hide or in the warp threads, or in the woof threads, or if it is in any object made of leather; it is the eruption of <i>tzoraas<\/i> [<b>‘confinement’<\/b>] and it shall be shown to the <i>kohein.<\/i>", "pj": "וִיהֵי מַכְתְּשָׁא יָרוֹק אוֹ סִימוֹק בִּלְבוּשָׁא אוֹ בִצְלָא אוֹ בְשִׁתְיָא אוֹ בְעַרְבָא אוֹ בְּכָל מַאן דִיצְלָא מַכְתַּשׁ סְגִירוּתָא הוּא וְיִתְחֲמֵי לְכַהֲנָא", "pj_en": "if the plague be green or red in the garment, or in the skin, whether in the warp or in the woof, or in anything of leather, it is the plague of leprosy, and must be shown to the priest.", "tj": "", "tj_en": "", "rashi": "<b>ירקרק.<\/b> יָרֹק שֶׁבַּיְרֻקִּין:<br><br><b>אדמדם.<\/b> אָדֹם שֶׁבָּאֲדֻמִּים:", "rashi_en": "ירקרק denotes green amongst the greens (the deepest green).<br><br>אדמדם — the deepest red (Sifra, Tazria Parashat Nega'im, Chapter 14 2)."}, {"ch": 13, "v": 50, "aliyah": 6, "heb": "וְרָאָ֥ה הַכֹּהֵ֖ן אֶת־הַנָּ֑גַע וְהִסְגִּ֥יר אֶת־הַנֶּ֖גַע שִׁבְעַ֥ת יָמִֽים׃", "onk": "וְיֶחֱזֵי כַהֲנָא יָת מַכְתָּשָׁא וְיַסְגַּר יָת מַכְתָּשָׁא שִׁבְעַת יוֹמִין:", "onk_en": "The <i>kohein<\/i> shall see the plague and confine the eruption, for seven days.", "pj": "וְיֶחֱמֵי כַהֲנָא יַת מַכְתְּשָׁא וְיַסְגֵר יַת מַכְתְּשָׁא שׁוּבְעָא יוֹמֵי", "pj_en": "And the priest shall look upon the plague, and shall shut it up seven days:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 51, "aliyah": 6, "heb": "וְרָאָ֨ה אֶת־הַנֶּ֜גַע בַּיּ֣וֹם הַשְּׁבִיעִ֗י כִּֽי־פָשָׂ֤ה הַנֶּ֙גַע֙ בַּ֠בֶּ֠גֶד אֽוֹ־בַשְּׁתִ֤י אֽוֹ־בָעֵ֙רֶב֙ א֣וֹ בָע֔וֹר לְכֹ֛ל אֲשֶׁר־יֵעָשֶׂ֥ה הָע֖וֹר לִמְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַנֶּ֖גַע טָמֵ֥א הֽוּא׃", "onk": "וְיֶחֱזֵי יָת מַכְתָּשָׁא בְּיוֹמָא שְׁבִיעָאָה אֲרֵי <b>אוֹסֵף<\/b> מַכְתָּשָׁא בִּלְבוּשָׁא אוֹ בְשִׁתְיָא אוֹ בְעַרְבָא אוֹ בְמַשְׁכָּא לְכֹל דִּי יִתְעֲבֵד מַשְׁכָּא לְעִבִידָא <b>סְגִירוּת מְחַסְרָא<\/b> מַכְתָּשָׁא מְסָאָב הוּא:", "onk_en": "He shall see the eruption on the seventh day. If the eruption has spread [<b>increased<\/b>] in the garment or in the warp thread, or in the woof thread, or in the leather hide, or in the work made of leather, it is a prickly <i>tzoraas,<\/i> [<b>‘confinement’ of loss<\/b>] it is unclean.", "pj": "וְיֶחֱמֵי יַת מַכְתְּשָׁא בְּיוֹמָא שְׁבִיעָאָה אֲרוּם הֲלִיךְ פִּסְיוֹן מַכְתְּשָׁא בִּלְבוּשָׁא אוֹ בְּשִׁיתְיָא אוֹ בְעַרְבָא אוֹ בִצְלָא לְכָל דְיִתְעֲבֵיד צְלָא לְעִיבִידְתָּא צוּרְעָא מֵחַלְטָא מַכְתְּשָׁא מְסָאָב הוּא", "pj_en": "and he shall look upon the plague on the seventh day, and if the plague hath become wider in the garment, whether in the warp or woof, or in the skin, or anything made of skin, it is a manifest plague of leprosy, it is unclean.", "tj": "", "tj_en": "", "rashi": "<b>צרעת ממארת.<\/b> לְשׁוֹן סִלּוֹן מַמְאִיר (יחזקאל כ\"ח), פויי\"נט בְּלַעַז; וּמִדְרָשׁוֹ: תֵּן בּוֹ מְאֵרָה שֶׁלֹא תֵהָנֶה הֵימֶנּוּ (ספרא):", "rashi_en": "צרעת ממארת A FRETTING LEPROSY — The word ממארת has the same meaning as. (Ezekiel 28:24) “a pricking (ממאיר) brier”; point (poignant) in old French The Midrashic explanation is: Attach a curse (מארה) to it, — that you will make no use of it (and therefore it must be burnt) (Sifra, Tazria Parashat Nega'im, Chapter 14 11)."}, {"ch": 13, "v": 52, "aliyah": 6, "heb": "וְשָׂרַ֨ף אֶת־הַבֶּ֜גֶד א֥וֹ אֶֽת־הַשְּׁתִ֣י&thinsp;<b>׀<\/b> א֣וֹ אֶת־הָעֵ֗רֶב בַּצֶּ֙מֶר֙ א֣וֹ בַפִּשְׁתִּ֔ים א֚וֹ אֶת־כׇּל־כְּלִ֣י הָע֔וֹר אֲשֶׁר־יִהְיֶ֥ה ב֖וֹ הַנָּ֑גַע כִּֽי־צָרַ֤עַת מַמְאֶ֙רֶת֙ הִ֔וא בָּאֵ֖שׁ תִּשָּׂרֵֽף׃", "onk": "וְיוֹקִיד יָת לְבוּשָׁא אוֹ יָת שִׁתְיָא אוֹ יָת עַרְבָא בְּעַמְרָא אוֹ בְכִתָּנָא אוֹ יָת כָּל מָאן דִּמְשַׁךְ דִּי יְהֵי בֵיהּ מַכְתָּשָׁא אֲרֵי <b>סְגִירוּת מְחַסְרָא<\/b> הִיא בְּנוּרָא תִּתּוֹקָד:", "onk_en": "He shall burn the garment, or the warp [lengthwise] threads, or the woof [widthwise] threads, be it in wool or in linen, or in all leather made objects, in which there is the eruption. For it is a prickly <i>tzoraas.<\/i> [<b>‘confinement’ of loss<\/b>] It shall be burned in fire.", "pj": "וְיוֹקִד יַת לְבוּשָׁא אוֹ יַת שִׁתְיָא אוֹ יַת עַרְבָא בְּעַמְרָא אוֹ בְּכִיתָּנָא אוֹ יַת כָּל מַאן דִיצְלָא דִיהֵי בֵּיהּ מַכְתְּשָׁא אֲרֵי סְגִירוּת מְחַסְרָא הוּא בְּנוּרָא תִתּוֹקָד", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>בצמר או בפשתים.<\/b> שֶׁל צֶמֶר אוֹ שֶׁל פִּשְׁתִּים, זֶהוּ פְשׁוּטוֹ; וּמִדְרָשׁוֹ: יָכוֹל יָבִיא גִּזֵּי צֶמֶר וַאֲנִיצֵי פִשְׁתָּן וְיִשְׂרְפֵם עִמּוֹ? תַּ\"ל \"הוּא\" <b>באש תשרף<\/b> — אֵינָהּ צְרִיכָה דָבָר אַחֵר עִמָּהּ, אִם כֵּן מַה תַּ\"ל \"בַּצֶּמֶר אוֹ בַפִּשְׁתִּים\"? לְהוֹצִיא אֶת הָאֻמְרִיּוֹת שֶׁבּוֹ שֶׁהֵן מִמִּין אַחֵר; אֻמְרִיּוֹת לְשׁוֹן שָׂפָה, כְּמוֹ אִימְרָא (ספרא):", "rashi_en": "בצמר ובפשתים means OF WOOL OR OF FLAX. This is the plain meaning. And the Midrashic explanation is: One might think that he must bring fleeces of wool or stalks of flax and burn them together with it, (the garment, in order to make a flame in which to burn it; then the verse will mean: he shall burn the garment with wool etc.) Scripture, however, states, in this verse, היא באש תשרף “it (the garment) shall be burnt in fire” — no other thing being required with it. If this be so why does it state בצמר או בפשתים? To exclude from being burnt the אומריות, the hems, that are on it if these are made of a different material than wool or flax respectively. The word אומריות means a hem; it is the same as the better-known word אימרא. (The translation is therefore: he shall burn [apply fire to] the garment etc., on the woolen parts only) (Sifra, Tazria Parashat Nega'im, Chapter 15 1)."}, {"ch": 13, "v": 53, "aliyah": 6, "heb": "וְאִם֮ יִרְאֶ֣ה הַכֹּהֵן֒ וְהִנֵּה֙ לֹא־פָשָׂ֣ה הַנֶּ֔גַע בַּבֶּ֕גֶד א֥וֹ בַשְּׁתִ֖י א֣וֹ בָעֵ֑רֶב א֖וֹ בְּכׇל־כְּלִי־עֽוֹר׃", "onk": "וְאִם יֶחֱזֵי כַהֲנָא וְהָא לָא <b>אוֹסֵף<\/b> מַכְתָּשָׁא בִּלְבוּשָׁא אוֹ בְשִׁתְיָא אוֹ בְעַרְבָא אוֹ בְּכָל מָאן דִּמְשָׁךְ:", "onk_en": "If the <i>kohein<\/i> will see, and behold! the eruption did not spread [<b>increase<\/b>] in the garment, or in the warp threads, or in the woof threads, or in any leather made object.", "pj": "וְאִין יֶחֱמֵי כַהֲנָא וְהָא לָא הֲלִיךְ פִּסְיוֹן מַכְתְּשָׁא בִּלְבוּשָׁא אוֹ בְשִׁיתְיָא אוֹ בְּעַרְבָא אוֹ בְּכָל מַאן דִיצְלָא", "pj_en": "But if the priest look, and, behold, the width of the plague hath not advanced in the garment, in warp or woof, or anything of skin,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 54, "aliyah": 6, "heb": "וְצִוָּה֙ הַכֹּהֵ֔ן וְכִ֨בְּס֔וּ אֵ֥ת אֲשֶׁר־בּ֖וֹ הַנָּ֑גַע וְהִסְגִּיר֥וֹ שִׁבְעַת־יָמִ֖ים שֵׁנִֽית׃", "onk": "וִיפַקֵּד כַּהֲנָא וִיחַוְּרוּן יָת דִּי בֵיהּ מַכְתָּשָׁא וְיַסְגְּרִנֵּיהּ שִׁבְעַת יוֹמִין תִּנְיָנוּת:", "onk_en": "The <i>kohein<\/i> shall command that they shall wash the article having the eruption, and confine it for seven days, a second time.", "pj": "וְיַפְקִיד כַּהֲנָא וִיחַוְורוּן יַת עִיסְקָא דְבֵיהּ מַכְתְּשָׁא וְיַסְגְרִינֵיהּ שׁוּבְעָא יוֹמִין תִּנְיָנוּת", "pj_en": "let the priest direct that they wash the material which hath the plague in it, and shut it up a second seven days.", "tj": "", "tj_en": "", "rashi": "<b>את אשר בו הנגע.<\/b> יָכוֹל מְקוֹם הַנֶּגַע בִּלְבַד, תַּ\"ל \"אֵת אֲשֶׁר בּוֹ הַנָּגַע\", יָכוֹל כָּל הַבֶּגֶד כֻּלּוֹ טָעוּן כִּבּוּס, תַּ\"ל \"הַנָּגַע\", הָא כֵיצַד? יְכַבֵּס מִן הַבֶּגֶד עִמּוֹ:", "rashi_en": "את אשר בו הנגע THAT WHEREIN THE PLAGUE IS — One might think that he has to wash only that spot in which is the plague and not the garment itself! It. however, states: Not, “he shall wash the plague, but “that where in the plague is”. If this be so, then one might think that the entire garment requires washing! It, however, states, (v. 55) הנגע “the plague” (after the plague has been washed), and not the garment. How shall it be done? He washes some of the garment with it (the plague) (Sifra, Tazria Parashat Nega'im, Chapter 15 5)."}, {"ch": 13, "v": 55, "aliyah": 7, "heb": "וְרָאָ֨ה הַכֹּהֵ֜ן אַחֲרֵ֣י&thinsp;<b>׀<\/b> הֻכַּבֵּ֣ס אֶת־הַנֶּ֗גַע וְ֠הִנֵּ֠ה לֹֽא־הָפַ֨ךְ הַנֶּ֤גַע אֶת־עֵינוֹ֙ וְהַנֶּ֣גַע לֹֽא־פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּאֵ֖שׁ תִּשְׂרְפֶ֑נּוּ פְּחֶ֣תֶת הִ֔וא בְּקָרַחְתּ֖וֹ א֥וֹ בְגַבַּחְתּֽוֹ׃", "onk": "וְיֶחֱזֵי כַהֲנָא בָּתַר דְּחַוָּרוּ יָת מַכְתָּשָׁא וְהָא לָא שְׁנָא מַכְתָּשָׁא <b>מִן כַּד הֲוָה<\/b> וּמַכְתָּשָׁא לָא <b>אוֹסֵף<\/b> מְסָאָב הוּא בְּנוּרָא תּוֹקְדִנֵּיהּ <b>תַּבְרָא<\/b> הִיא בְּשְׁחִיקוּתֵיהּ אוֹ בְחַדָּתוּתֵיהּ:", "onk_en": "The <i>kohein<\/i> shall see it after the eruption was washed and behold! [even if] the eruption did not change its hue [<b>from what it was<\/b>] and the eruption did not spread [<b>increase<\/b>]; it is unclean, you shall burn it in fire. It is a deep mark [<b>break<\/b>] be it in a worn [garment] or in a new [garment].", "pj": "וְיֶחֱמֵי כַּהֲנָא בָּתַר דְחַוָורוּ יַת מַכְתְּשָׁא וְהָא לָא שְׁנָא מַכְתְּשָׁא מִן כַּד הֲוָה וּמַכְתְּשָׁא לָא הֲלִיךְ פִּסְיוֹנֵיהּ מְסָאָב הוּא בְנוּרָא תוֹקְדִינֵיהּ מְטוֹל דְצוֹרָעָא שַׁקִיעָא הִיא בְּרַדַדֵיהּ אוֹ בְּלַבַּדֵיהּ", "pj_en": "And the priest shall look after they have washed the plague, and, behold, the (condition of the) plague hath not altered from what it was, and the plague hath not advanced in its size, it is unclean, thou shalt burn it in the fire, for the leprosy is deep in its bareness (or in its outward side).", "tj": "", "tj_en": "", "rashi": "<b>אחרי הכבס.<\/b> לְשׁוֹן הֵעָשׂוֹת:<br><br><b>לא הפך הנגע את עינו.<\/b> לֹא הָכְהָה מִמַּרְאִיתוֹ:<br><br><b>והנגע לא פשה.<\/b> שָׁמַעְנוּ שֶׁאִם לֹא הָפַךְ וְלֹא פָשָׂה טָמֵא — וְאֵין צָרִיךְ לוֹמַר לֹא הָפַךְ וּפָשָׂה — הָפַךְ וְלֹא פָשָׂה אֵינִי יוֹדֵעַ מַה יֵּעָשֶׂה לוֹ, תַּ\"ל \"וְהִסְגִּיר אֶת הַנֶּגַע\" — מִכָּל מָקוֹם, דִּבְרֵי רַ' יְהוּדָה, וַחֲכָמִים אוֹמְרִים וְכוּ', כִּדְאִיתָא בְת\"כֹּ, וּרְמַזְתִּיהָ כָּאן לְיַשֵּׁב הַמִּקְרָא עַל אָפְנָיו:<br><br><b>פחתת הוא.<\/b> לְשׁוֹן גֻּמָּא, כְּמוֹ בְּאַחַת הַפְּחָתִים (שמואל ב י\"ז), כְּלוֹמַר שְׁפֵלָה הִיא — נֶגַע שֶׁמַּרְאָיו שׁוֹקְעִין (ספרא):<br><br><b>בקרחתו או בגבחתו.<\/b> כְּתַרְגּוּמוֹ בִּשְׁחִיקוּתֵהּ אוֹ בְחַדָּתוּתֵהּ:<br><br><b>קרחתו.<\/b> שְׁחָקִים, יְשָׁנִים; וּמִפְּנֵי הַמִּדְרָשׁ שֶׁהֻצְרַךְ לִגְזֵרָה שָׁוָה — מִנַּיִן לִפְרִיחָה בַבְּגָדִים שֶׁהִיא טְהוֹרָה? נֶאֶמְרָה קָרַחַת וְגַבַּחַת בָּאָדָם, וְנֶאֶמְרָה קָרַחַת וְגַבַּחַת בַּבְּגָדִים, מַה לְּהַלָּן פָּרַח בְּכֻלּוֹ טָהוֹר אַף כָּאן פָּרַח בְּכֻלּוֹ טָהוֹר — לְכָךְ אָחַז הַכָּתוּב לְשׁוֹן קָרַחַת וְגַבַּחַת; וּלְעִנְיַן פֵּרוּשׁוֹ וְתַרְגּוּמוֹ זֶהוּ מַשְׁמָעוֹ: קָרַחַת לְשׁוֹן יְשָׁנִים וְגַבַּחַת לְשׁוֹן חֲדָשִׁים — כְּאִלּוּ נִכְתַּב בְּאַחֲרִיתוֹ אוֹ בְקַדְמוּתוֹ — שֶׁהַקָּרַחַת לְשׁוֹן אֲחוֹרַיִם וְגַּבַּחַת לְשׁוֹן פָּנִים, כְּמוֹ שֶׁכָּתוּב וְאִם מִפְּאַת פָּנָיו וְגוֹ', וְהַקָּרַחַת כָּל שֶׁשּׁוֹפֵעַ וְיוֹרֵד מִן הַקָּדְקֹד וּלְאַחֲרָיו, כָּךְ מְפֹרָשׁ בְּתֹ\"כֹּ:", "rashi_en": "הֻכַּבֵּס‎ ‎ ‎‎‎‏ אחרי AFTER IT IS WASHED — The verbal form is an expression of something done (a passive infinitive).<br><br>לא הפך הנגע את עינו THE PLAGUE HATH NOT CHANGED ITS COLOR — i. e. it has not become paler than its former colour.<br><br>והנגע לא פשה AND THE PLAGUE HATH NOT SPREAD — We understand from this that if it has not changed its color and has not spread it is unclean, (although the fact that it has not spread might lead us to suppose that it is clean;here, however, the color has not changed, and so it is unclean). It is, of course, not necessary to state that it is unclean if the colour has not changed but the plague has spread (for the spreading is an additional reason for declaring it unclean). If, however, it has changed its colour, but it has not spread, I would not know what one should do with it. Therefore it states, (v. 50) “And he shall shut up the plague” for a period and examine it again — shut it up whatever the circumstances of doubt may be. This is the opinion of Rabbi Jehuda. But other Sages say that in this case it is undoubtedly unclean as is stated in Torath Cohanim (Sifra, Tazria Parashat Nega'im, Chapter 15 7): and I make mention of this here (instead of doing so on v. 50), in order to explain that verse in its connection with this text. <br><br>פחתת היא — This is an expression denoting a pit (anything cut out) as in, (II Samuel 17:9) “in one of the pits (פחתים)”. It is as much as to say, it is low-lying — a plague the colour of which is sunk deep (Sifra, Tazria Parashat Nega'im, Chapter 15 8).<br><br>בגבחתו ‎‎‎ או‎ בקרחתו — Understand this as the Targum does: in its old state (lit., rubbed condition) or in its new state.<br><br>קרחתו is therefore שחקים (clothes rubbed by wear), old (and consequently ,שחיקותיה is a proper contrast to חדתותיה in the Targum). These words, קרחת and גבחת, although not properly applicable to garments are used here to afford an opportunity for an Halachic derivation, for which there is required an argument deduced from the similarity of phrases: Whence do we know in regard to a plague spreading over the entire surface in the case of garments that it is c1ean? Because the, terms קרחת and גבחת are used in the case of a human being and the terms קרחת and גבחת are used in the case of garments. How is it in the former case? If it has spread over all his body, he is clean (v.13)! So here, also, if it has spread over all the garment it is clean (Niddah 19a). For this reason Scripture here purposely avails itself of the expressions קרחת and גבחת, to make the גז\"ש possible. And in regard to its interpretation and its translation in the Targum the following is what it implies: קרחת is an expression denoting “old”, and גבחת is an expression denoting “new” (Sifra, Tazria Parashat Nega'im, Chapter 15 9); and the meaning is just the same as though it were written באחריתו או בקדמותו. at its end or at its beginning, — for קרחת has the meaning of the back- parts (i. e. the end), since גבחת has the meaning of face (front-side, i. e. beginning), as it is written, (v. 41) “And if from the corner towards his face [the hair of his head be fallen] … he is a גבח” — so that קרחת must be all that part which slopes downwards on the skull towards the back. Thus is it explained in Torath Cohanim (Sifra, Tazria Parashat Nega'im, Chapter 10 7)."}, {"ch": 13, "v": 56, "aliyah": 7, "heb": "וְאִם֮ רָאָ֣ה הַכֹּהֵן֒ וְהִנֵּה֙ כֵּהָ֣ה הַנֶּ֔גַע אַחֲרֵ֖י הֻכַּבֵּ֣ס אֹת֑וֹ וְקָרַ֣ע אֹת֗וֹ מִן־הַבֶּ֙גֶד֙ א֣וֹ מִן־הָע֔וֹר א֥וֹ מִן־הַשְּׁתִ֖י א֥וֹ מִן־הָעֵֽרֶב׃", "onk": "וְאִם חֲזָא כַהֲנָא וְהָא עָמְיָא מַכְתָּשָׁא בָּתַר דְּחַוָּרוּ יָתֵיהּ וּבְזַע יָתֵיהּ מִן לְבוּשָׁא אוֹ מִן מַשְׁכָּא אוֹ מִן שִׁתְיָא אוֹ מִן עַרְבָא:", "onk_en": "If the <i>kohein<\/i> saw and behold! the eruption grew faint after it was washed; he shall tear it from the garment, or from the leather, or from the warp threads or from the woof threads.", "pj": "וְאִין חָמַא כַהֲנָא וְהָא עַמָא מַכְתְּשָׁא בָּתַר דְחַוָורוּ יָתֵיהּ וִיבַזַע יָתֵיהּ מִן לְבוּשָׁא אוֹ מִן צְלָא אוֹ מִן שִׁיתְיָא אוֹ מִן עַרְבָא", "pj_en": "And if the priest observe, and, behold, the plague hath become dim, then shall he tear it out of the garment, or from the leather, or out of the warp or the woof.", "tj": "", "tj_en": "", "rashi": "<b>וקרע אתו.<\/b> יִקְרַע מְקוֹם הַנֶּגַע מִן הַבֶּגֶד וְיִשְׂרְפֶנּוּ:", "rashi_en": "וקרע אתו THEN SHALL HE  REND IT OUT — i. e. he shall tear out the plague-spot from the garment and burn it (just as he is commanded in the case mentioned in the next verse) (cf. Sifra, Tazria Parashat Nega'im, Chapter 16 2)."}, {"ch": 13, "v": 57, "aliyah": 7, "heb": "וְאִם־תֵּרָאֶ֨ה ע֜וֹד בַּ֠בֶּ֠גֶד אֽוֹ־בַשְּׁתִ֤י אֽוֹ־בָעֵ֙רֶב֙ א֣וֹ בְכׇל־כְּלִי־ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּאֵ֣שׁ תִּשְׂרְפֶ֔נּוּ אֵ֥ת אֲשֶׁר־בּ֖וֹ הַנָּֽגַע׃", "onk": "וְאִם תִּתְחֲזֵי עוֹד בִּלְבוּשָׁא אוֹ בְשִׁתְיָא אוֹ בְעַרְבָא אוֹ בְכָל מָאן דִּמְשַׁךְ סָגְיָא הִיא בְּנוּרָא תוֹקְדִנֵּיהּ יָת דִּי בֵיהּ מַכְתָּשָׁא:", "onk_en": "If it will appear again, in the garment or in the warp [lengthwise] threads, or in the woof [widthwise] threads, or in any leather-made object, it is a recurrent outbreak of <i>tzoraas.<\/i> You shall burn the article having the eruption in fire.", "pj": "וְאִין תִתְחֲמֵי תוּב בִּלְבוּשָׁא אוֹ בְשִׁיתְיָא אוֹ בְעַרְבָא אוֹ בְּכָל מַאן דִיצְלָא סַגְיָא הוּא בְּנוּרָא תוֹקְדִינֵיהּ יַת עִיסְקָא דְבֵיהּ מַכְתְּשָׁא", "pj_en": "But if it reappear in the garment, or in the warp or woof, or in anything of skin, and maketh increase, thou shalt burn such material which hath the plague in it.", "tj": "", "tj_en": "", "rashi": "<b>פרחת הוא.<\/b> דָּבָר הַחוֹזֵר וְצוֹמֵחַ:<br><br><b>באש תשרפנו.<\/b> אֶת כָּל הַבֶּגֶד:", "rashi_en": "פרחת היא IT IS A SPREADING PLAGUE — it is a thing which breaks out again and again.<br><br>באש תשרפנו THOU SHALT BURN IT IN FIRE — “it” — the entire garment (in contradistinction to v. 56)."}, {"ch": 13, "v": 58, "aliyah": 7, "heb": "וְהַבֶּ֡גֶד אֽוֹ־הַשְּׁתִ֨י אוֹ־הָעֵ֜רֶב אֽוֹ־כׇל־כְּלִ֤י הָעוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְסָ֥ר מֵהֶ֖ם הַנָּ֑גַע וְכֻבַּ֥ס שֵׁנִ֖ית וְטָהֵֽר׃", "onk": "וּלְבוּשָׁא אוֹ שִׁתְיָא אוֹ עַרְבָא אוֹ כָל מָאן דִּמְשַׁךְ דִּי יִתְחַוַּר וְיֶעְדֵּי מִנְּהוֹן מַכְתָּשָׁא וְיִצְטַבַּע תִּנְיָנוּת וְיִדְכֵּי:", "onk_en": "The garment, or the warp threads, or the woof threads, or any leather objects that were washed and the eruption disappears from them, it shall be washed a second time and it shall be purified.", "pj": "וּלְבוּשָׁא אוֹ שִׁיתְיָא אוֹ עַרְבָא אוֹ כָּל מַאן דִיצְלָא דִתְחַוָור וְיַעֲדֵי מִנֵיהּ מַכְתְּשָׁא וְיִצְטַבַּע תִּנְיָנוּת וְיִדְכֵּי", "pj_en": "And the garment, or the warp or woof, or anything of skin, which thou shalt wash and the plague depart from it shall be washed a second time, and it shall be clean.", "tj": "", "tj_en": "", "rashi": "<b>וסר מהם הנגע.<\/b> אִם כְּשֶׁכִּבְּסוּהוּ בַתְּחִלָּה עַל פִּי כֹהֵן סָר מִמֶּנּוּ הַנֶּגַע לְגַמְרֵי.<br><br><b>וכבס שנית.<\/b> לְשׁוֹן טְבִילָה; תַּרְגּוּם שֶׁל כִּבּוּסִין שֶׁבְּפָרָשָׁה זוֹ לְשׁוֹן לִבּוּן, \"וְיִתְחַוַּר\", חוּץ מִזֶּה, שֶׁאֵינוֹ לְלִבּוּן אֶלָּא לִטְבֹּל, לְכָךְ תַּרְגּוּמוֹ \"וְיִצְטַבַּע\", וְכֵן כָּל כִּבּוּסֵי בְגָדִים שֶׁהֵן לִטְבִילָה מְתֻרְגָּמִין וְיִצְטַבַּע:", "rashi_en": "וסר מהם הנגע IF THE PLAGUE BE DEPARTED FROM THEM — if when they washed it at first by the order of the priest (Leviticus 13:54), the plague departed from it entirely (cf. Sifra, Tazria Parashat Nega'im, Chapter 16 10),<br><br>וכבס שנית IT SHALL BE WASHED A SECOND TIME — here this expression denotes immersion in a ritual bath (not washing of the garment). The words used in the translation of the Targum for the expressions derived from the root כבס occurring in this section denote making white (cleaning, — e. g. ויתחור), “and it shall be made white” — except for this (וְכֻבַּס) which is not intended to mean making white but to mean immersion. For this reason it is translated in the Targum by ויצטבע — “it shall be dipped”. Similarly wherever it speaks of כבוס בגדים which intend “immersion” the Targum translation is ויצטבע, (this is the Targum of וְכֻבַּס‎ here and in Leviticus  15:17; the active וְכִבֶּס, is, of course, translated by ויצבע)."}, {"ch": 13, "v": 59, "aliyah": 7, "heb": "זֹ֠את תּוֹרַ֨ת נֶֽגַע־צָרַ֜עַת בֶּ֥גֶד הַצֶּ֣מֶר&thinsp;<b>׀<\/b> א֣וֹ הַפִּשְׁתִּ֗ים א֤וֹ הַשְּׁתִי֙ א֣וֹ הָעֵ֔רֶב א֖וֹ כׇּל־כְּלִי־ע֑וֹר לְטַהֲר֖וֹ א֥וֹ לְטַמְּאֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "דָּא אוֹרַיְתָא דְמַכְתַּשׁ <b>סְגִירוּ<\/b> בִּלְבוּשׁ עֲמַר אוֹ כִתָּנָא אוֹ שִׁתְיָא אוֹ עַרְבָא אוֹ כָּל מָאן דִּמְשָׁךְ לְדַכָּיוּתֵיהּ אוֹ לְסַאֲבוּתֵיהּ:", "onk_en": "This is the law of the eruption of <i>tzoraas<\/i> [<b>‘confinement’<\/b>] be it in a woolen garment, or a linen garment, or in the warp [lengthwise] thread, or in the woof [widthwise] thread, or in any leather-made object, that it be pronounced pure, or that it be pronounced impure.", "pj": "דָא אוֹרַיְיתָא דְמַכְתַּשׁ סְגִירוּ לְבוּשׁ עֲמַר אוֹ דְכִיתַן אוֹ שִׁיתְיָא אוֹ עַרְבָא אוֹ כָּל מַאן דִיצְלָא לְדַכְּאוּתֵיהּ אוֹ לְסָאֲבוּתֵיהּ", "pj_en": "This is the law for the plague of leprosy in a garment of woollen or of linen, or the warp or the woof, or anything of skin, to make it to be clean or to be unclean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
