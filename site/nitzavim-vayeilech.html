4:4), because the power (leadership) is being taken from me and given to Joshua. — Another explanation of לצאת ולבוא is: I can no more take the lead in the matter of the Law; this teaches us that the traditions and the well-springs of wisdom were stopped up for him (cf. Sotah 13b).<br><br>וה' אמר אלי — This (according to the previous comment) is the explanation of לא אוכל עוד לצאת ולבוא: I can no more go out and come in because (ו = because) the Lord has said unto Me, [Thou shalt not pass over this Jordan]."}, {"ch": 31, "v": 3, "aliyah": 4, "heb": "יְהֹוָ֨ה אֱלֹהֶ֜יךָ ה֣וּא&thinsp;<b>׀<\/b> עֹבֵ֣ר לְפָנֶ֗יךָ הֽוּא־יַשְׁמִ֞יד אֶת־הַגּוֹיִ֥ם הָאֵ֛לֶּה מִלְּפָנֶ֖יךָ וִירִשְׁתָּ֑ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְפָנֶ֔יךָ כַּאֲשֶׁ֖ר דִּבֶּ֥ר יְהֹוָֽה׃", "onk": "יְיָ אֱלָהָךְ <b>מֵימְרֵיהּ<\/b> יֵעִבַר קֳדָמָךְ הוּא יְשֵׁצֵי יָת עַמְמַיָּא הָאִלֵּין מִקֳּדָמָךְ וְתֵירְתִנּוּן יְהוֹשֻׁעַ הוּא עָבֵר קֳדָמָךְ כְּמָא דִי מַלִּיל יְיָ:", "onk_en": "Adonoy, your God, He [<b>His word<\/b>] is crossing before you, He will destroy these nations before you and you will inherit them. Yehoshua, he is crossing before you as Adonoy has stated.", "pj": "יְיָ אֱלָהָכוֹן וּשְׁכִינְתֵּיהּ עָבִיר קֳדָמֵיכוֹן הוּא יְשֵׁיצֵי יַת עַמְמַיָא הָאִלֵין וְתֵירְתִינוּן יְהוֹשֻׁעַ הוּא יְטַיֵיל קֳדָמֵיכוֹן הֵיכְמָא דְמַלֵיל יְיָ", "pj_en": "The Lord your God, and His Shekinah, will go over before you. He will destroy those nations, and you shall possess them. Jehoshua also will go before you, as the Lord hath said.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 4, "aliyah": 4, "heb": "וְעָשָׂ֤ה יְהֹוָה֙ לָהֶ֔ם כַּאֲשֶׁ֣ר עָשָׂ֗ה לְסִיח֥וֹן וּלְע֛וֹג מַלְכֵ֥י הָאֱמֹרִ֖י וּלְאַרְצָ֑ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽם׃", "onk": "וְיַעְבֵּד יְיָ לְהוֹן כְּמָא דִי עֲבַד לְסִיחוֹן וּלְעוֹג מַלְכֵי אֱמֹרָאָה וּלְאַרְעֲהוֹן דִּי שֵׁצִי יָתְהוֹן:", "onk_en": "And Adonoy will do to them as He did to Sichon and to Og, kings of the Emorites, and to their land; whom He destroyed.", "pj": "וְיַעֲבֵיד יְיָ פּוּרְעָנוּת דִינָא מִנְהוֹן הֵיכְמָא דְעָבַד לְסִיחוֹן וּלְעוֹג מַלְכֵי אֱמוֹרָאֵי וּלְעַמְמֵי אַרְעֲהוֹן דְשֵׁיצֵי יַתְהוֹן", "pj_en": "And the Lord will execute judgment on them, as He did on Sihon and Og kings of the Amoraee, and the people of their land, whom He destroyed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 5, "aliyah": 4, "heb": "וּנְתָנָ֥ם יְהֹוָ֖ה לִפְנֵיכֶ֑ם וַעֲשִׂיתֶ֣ם לָהֶ֔ם כְּכׇ֨ל־הַמִּצְוָ֔ה אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְכֶֽם׃", "onk": "<b>וְיִמְסְרִנּוּן<\/b> יְיָ <b>קֳדָמֵיכוֹן<\/b> וְתַעְבְּדוּן לְהוֹן כְּכָל תַּפְקֶדְתָּא דִּי פַקֵּדִית יָתְכוֹן:", "onk_en": "Adonoy will defeat [<b>deliver<\/b>] them before you, and you will do to them in accord with the <i>mitzvah<\/i> that I commanded you.", "pj": "וְיִמְסְרִינוּן מֵימְרָא דַיְיָ קֳדָמֵיכוֹן וְתַעַבְדוּן לְהוֹן הֵי כְּכָל תַּפְקֵידְתָּא דְפַקֵידִית יַתְכוֹן", "pj_en": "And the Word of the Lord will deliver them up before you, and you shall do to them according to all the commandment that I have commanded you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 6, "aliyah": 4, "heb": "חִזְק֣וּ וְאִמְצ֔וּ אַל־תִּֽירְא֥וּ וְאַל־תַּעַרְצ֖וּ מִפְּנֵיהֶ֑ם כִּ֣י&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ ה֚וּא הַהֹלֵ֣ךְ עִמָּ֔ךְ לֹ֥א יַרְפְּךָ֖ וְלֹ֥א יַעַזְבֶֽךָּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "תְּקִיפוּ וְאַלִּימוּ לָא תִדְחֲלוּן וְלָא תִתָּבְרוּן מִקֳּדָמֵיהוֹן אֲרֵי יְיָ אֱלָהָךְ הוּא דִּמְדַבַּר קֳדָמָךְ לָא יִשְׁבְּקִנָּךְ וְלָא יַרְטֵשִׁנָּךְ:", "onk_en": "Be courageous and bold, do not fear and do not quake before them; for Adonoy, your God, it is He Who is going with you, He will not enfeeble you nor will He abandon you.’’", "pj": "אִיתוֹקְפוּ וְאִתְחַיְילוּ לָא תִדַחֲלוּן וְלָא תִתְיַרְעוּן מִן קֳדָמֵיהוֹן אֲרוּם יְיָ אֱלָהָכוֹן שְׁכִינְתֵּיהּ מִידַבְּרָא קֳדָמֵיכוֹן לָא יִשְׁבְּקִינְכוֹן וְלָא יַרְחְקִינְכוֹן", "pj_en": "Be strong, then, and of good courage, fear not, nor be dismayed before them; for the Shekinah of the Lord your God will be the Leader of you, He will not forsake nor be far from you.", "tj": "", "tj_en": "", "rashi": "<b>לא ירפך.<\/b> לֹא יִתֵּן לְךָ רִפְיוֹן לִהְיוֹת נֶעֱזָב מִמֶּנּוּ:", "rashi_en": "לא ירפך means He will give you no looseness that you should be abandoned by Him (cf. Rashi on Deuteronomy 4:31)."}, {"ch": 31, "v": 7, "aliyah": 5, "heb": "וַיִּקְרָ֨א מֹשֶׁ֜ה לִיהוֹשֻׁ֗עַ וַיֹּ֨אמֶר אֵלָ֜יו לְעֵינֵ֣י כׇל־יִשְׂרָאֵל֮ חֲזַ֣ק וֶאֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת־הָעָ֣ם הַזֶּ֔ה אֶל־הָאָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהֹוָ֛ה לַאֲבֹתָ֖ם לָתֵ֣ת לָהֶ֑ם וְאַתָּ֖ה תַּנְחִילֶ֥נָּה אוֹתָֽם׃", "onk": "וּקְרָא משֶׁה לִיהוֹשֻׁעַ וַאֲמַר לֵיהּ לְעֵינֵי כָל יִשְׂרָאֵל תְּקַף וְאַלִּים אֲרֵי אַתְּ תֵּעוּל <b>עִם<\/b> עַמָּא הָדֵין לְאַרְעָא דִּי קַיִּים יְיָ לַאֲבָהָתְהוֹן לְמִתַּן לְהוֹן וְאַתְּ תַּחְסְנִנַּהּ יָתְהוֹן:", "onk_en": "Moshe called Yehoshua and said to him as all of Yisroel watched, ‘‘Be courageous and bold, for you shall enter with this people into the land that Adonoy swore to their forefathers to give them, and you will apportion it to them.", "pj": "וּקְרָא משֶׁה לִיהוֹשֻׁעַ מִן גוֹ עַמָא וַאֲמַר לֵיהּ לְמֵיחֲמֵיהוֹן דְכָל יִשְרָאֵל אִיתוֹקַף וְאִתְחַיָיל אֲרוּם אַנְתְּ מִתְמַנֵי לְמֵיעוּל עִם עַמָא הָדֵין לְאַרְעָא דְקַיֵים מֵימְרָא דַיְיָ לְאַבְהַתְהוֹן לְמִתַּן לְהוֹן וְאַנְתְּ תַּפְלִיג יָתֵיהּ לְהוֹן", "pj_en": "And Mosheh called Jehoshua from among the people, and said to him: Be thou strong, and of good courage; for thou art appointed to go with this people to the land which the Word of the Lord sware to your fathers to give them, and thou art to divide it among them.", "tj": "", "tj_en": "", "rashi": "<b>כי אתה תבוא את העם הזה.<\/b> \"אֲרֵי אַתְּ תֵּעוּל עִם עַמָּא הָדֵין\": מֹשֶׁה אָמַר לוֹ לִיהוֹשֻׁעַ זְקֵנִים שֶׁבַּדּוֹר יִהְיוּ עִמְּךָ, הַכֹּל לְפִי דַעְתָּן וַעֲצָתָן, אֲבָל הַקָּבָּ\"ה אָמַר לִיהוֹשֻׁעַ \"כִּי אַתָּה תָּבִיא אֶת בְּנֵי יִשְׂרָאֵל אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם\" — תָּבִיא עַל כָּרְחָם, הַכֹּל תָּלוּי בְּךָ, טֹל מַקֵּל וְהַךְ עַל קָדְקֳדָן, דַּבָּר אֶחָד לְדוֹר וְלֹא שְׁנֵי דַבָּרִים לְדוֹר (סנהדרין ח'):", "rashi_en": "כי אתה תבוא את העם הזה — Translate this as the Targum does: ארי אתה תעול עם עמא הדין, THOU SHALT GO WITH THIS PEOPLE. Moses, by the statement “Thou shall go with this people” (as one of them) said in effect to Joshua: The elders of the generation will be with thee: everything has to be done according to their opinion and their advice. The Holy One, blessed be He, however, said to Joshua, (v. 23) “For thou shalt bring (תביא) the children of Israel into the land which I swore unto them” — thou shalt bring them even against their will; everything depends on you alone: if necessary take a stick and beat them over the head: there can be but one leader for a generation, and not two leaders for a generation (Sanhedrin 8a)."}, {"ch": 31, "v": 8, "aliyah": 5, "heb": "וַיהֹוָ֞ה ה֣וּא&thinsp;<b>׀<\/b> הַהֹלֵ֣ךְ לְפָנֶ֗יךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔ךְ לֹ֥א יַרְפְּךָ֖ וְלֹ֣א יַעַזְבֶ֑ךָּ לֹ֥א תִירָ֖א וְלֹ֥א תֵחָֽת׃", "onk": "וַיְיָ הוּא דִּמְדַבַּר קֳדָמָךְ <b>מֵימְרֵיהּ יְהֵי בְסַעְדָּךְ<\/b> לָא יִשְׁבְּקִנָּךְ וְלָא <b>יַרְחֵקִנָּךְ<\/b> לָא תִדְחַל וְלָא תִתְּבַר:", "onk_en": "And Adonoy is the One Who is going ahead of you, He [<b>His word<\/b>] will be with you [<b>your support<\/b>], will not enfeeble you and will not abandon [<b>distance<\/b>] you; do not fear and do not quake.", "pj": "וּמֵימְרָא דַיְיָ שְׁכִינְתֵּיהּ מִידַבְּרָא קֳדָמָךְ וּמֵימְרֵיהּ יְהֵי בְסַעֲדָךְ לָא יִשְׁבְּקִינָךְ וְלָא יַרְחֲקִינָךְ לָא תִדְחַל וְלָא תִתְיָרַע", "pj_en": "And the Shekinah of the Word of the Lord will go before thee, and His Word will be thy helper; He will not forsake nor be far from thee; fear not, nor be dismayed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 9, "aliyah": 5, "heb": "וַיִּכְתֹּ֣ב מֹשֶׁה֮ אֶת־הַתּוֹרָ֣ה הַזֹּאת֒ וַֽיִּתְּנָ֗הּ אֶל־הַכֹּֽהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַנֹּ֣שְׂאִ֔ים אֶת־אֲר֖וֹן בְּרִ֣ית יְהֹוָ֑ה וְאֶל־כׇּל־זִקְנֵ֖י יִשְׂרָאֵֽל׃", "onk": "וּכְתַב משֶׁה יָת אוֹרַיְתָא הָדָא וִיהָבַהּ לְכָהֲנַיָּא בְּנֵי לֵוִי דְּנָטְלִין יָת אֲרוֹן קְיָמָא דַיְיָ וּלְכָל סָבֵי יִשְׂרָאֵל:", "onk_en": "Moshe wrote this Torah and he gave it to the <i>kohanim,<\/i> descendants of Levi, who carry the ark of Adonoy’s covenant; and to all the elders of Yisroel.", "pj": "וּכְתַב משֶׁה יַת אוֹרַיְיתָא הָדָא וּמְסָרָהּ לְכַהֲנַיָא בְּנֵי לֵוִי דְנַטְלִין יַת אֲרוֹן קְיָימָא דַיְיָ וּלְכָל חַכִּימֵי יִשְרָאֵל", "pj_en": "And Mosheh wrote this law, and delivered it to the priests the sons of Levi, who bare the ark of the Lord’s covenant, and to all the sages of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ויכתב משה, ויתנה.<\/b> כְּשֶׁנִּגְמְרָה כֻּלָּהּ נְתָנָהּ לִבְנֵי שִׁבְטוֹ (עי' ספרי דברים ל\"ד):", "rashi_en": "ויכתב משה ... ויתנה AND MOSES WROTE [THIS LAW] AND GAVE IT [UNTO THE PRIESTS, THE SONS OF LEVI] — When it was completely finished he gave it to the sons of his tribe."}, {"ch": 31, "v": 10, "aliyah": 5, "heb": "וַיְצַ֥ו מֹשֶׁ֖ה אוֹתָ֣ם לֵאמֹ֑ר מִקֵּ֣ץ&thinsp;<b>׀<\/b> שֶׁ֣בַע שָׁנִ֗ים בְּמֹעֵ֛ד שְׁנַ֥ת הַשְּׁמִטָּ֖ה בְּחַ֥ג הַסֻּכּֽוֹת׃", "onk": "וּפַקִּיד משֶׁה יָתְהוֹן לְמֵימָר מִסּוֹף שְׁבַע שְׁנִין בִּזְמַן שַׁתָּא דִשְׁמִטְּתָא בְּחַגָּא דִמְטַלַּיָּא:", "onk_en": "Moshe commanded them, saying: After seven years have ended, on the holy day of the Sh’mittah year, during the Sukkos festival;", "pj": "וּפַקֵיד משֶׁה יַתְהוֹן לְמֵימָר בְּסוֹף שְׁבַע שְׁנִין בְּאִשׁוֹנֵי שַׁתָּא דִשְׁמִיטָתָא בְּחַגָא דִמְטָלַיָא", "pj_en": "And Mosheh commanded them, saying: At the end of seven years in the time of the year of remission at the feast of Tabernacles,", "tj": "", "tj_en": "", "rashi": "<b>מקץ שבע שנים.<\/b> בְּשָׁנָה רִאשׁוֹנָה שֶׁל שְׁמִטָּה — בַּשְּׁמִינִית, וְלָמָּה קוֹרֵא אוֹתָהּ <b>שנת השמטה<\/b>? שֶׁעֲדַיִּן שְׁבִיעִית נוֹהֶגֶת בָּהּ, בַּקָּצִיר שֶׁל שְׁבִיעִית הַיּוֹצֵא לְמוֹצָאֵי שְׁבִיעִית:", "rashi_en": "מקץ שבע שנים AT THE END OF EVERY SEVEN YEARS [AT THE APPOINTED SEASON OF THE SHEMITTAH YEAR]  — This means in the first year of the new Shemittah-period — in the eighth year (Sotah 41a). But why does Scripture call it the “Shemittah-year”, which name usually implies the seventh year? Because the law of the “seventh year” still applies to it, viz., in connection with the harvest of the seventh year’s produce that actually goes forth into (takes place in) the year following the seventh year (the eighth year) (Rosh Hashanah 12b; cf. Rashi on Exodus 34:21)."}, {"ch": 31, "v": 11, "aliyah": 5, "heb": "בְּב֣וֹא כׇל־יִשְׂרָאֵ֗ל לֵֽרָאוֹת֙ אֶת־פְּנֵי֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ בַּמָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת־הַתּוֹרָ֥ה הַזֹּ֛את נֶ֥גֶד כׇּל־יִשְׂרָאֵ֖ל בְּאׇזְנֵיהֶֽם׃", "onk": "בְּמֵיתֵי כָל יִשְׂרָאֵל לְאִתְחֲזָאָה קֳדָם יְיָ אֱלָהָךְ בְּאַתְרָא דִּי יִתִּרְעֵי תִּקְרֵי יָת אוֹרַיְתָא הָדָא <b>קֳדָם<\/b> כָּל יִשְׂרָאֵל וְתַשְׁמְעִנּוּן:", "onk_en": "When all of Yisroel comes to be seen in the presence of Adonoy, your God, in the place that He chooses, you shall read this Torah facing [<b>before<\/b>] all of Yisroel for them to hear.", "pj": "בְּמֵיתֵי כָּל יִשְרָאֵל לְאִתְחַמָאָה קֳדָם יְיָ אֱלָהָכוֹן בְּאַתְרָא דְיִתְרְעֵי תִּיקְרוּן יַת אוֹרַיְיתָא הָדָא קֳבֵיל כָּל יִשְרָאֵל בְּמִשְׁמְעֲהוֹן", "pj_en": "when all Israel cometh to appear before the Lord your God, in the place that He will choose, you shall read this law before all Israel while they listen.", "tj": "", "tj_en": "", "rashi": "<b>תקרא את התורה הזאת.<\/b> הַמֶּלֶךְ הָיָה קוֹרֵא מִתְּחִלַּת \"אֵלֶּה הַדְּבָרִים\", כִּדְאִיתָא בְמַסֶּכֶת סוֹטָה (דף מ\"א) עַל בִּימָה שֶׁל עֵץ שֶׁהָיוּ עוֹשִׂין בָּעֲזָרָה:", "rashi_en": "תקרא את התורה הזאת [WHEN ALL ISRAEL IS COME TO APPEAR BEFORE THE LORD …] THOU SHALT READ THIS LAW [BEFORE ALL ISRAEL] — The king read from the beginning of the section “These are the words” (Deuteronomy 1:1), — as is set forth in Treatise Sotah 41a — upon a wooden platform that was erected in the forecourt."}, {"ch": 31, "v": 12, "aliyah": 5, "heb": "הַקְהֵ֣ל אֶת־הָעָ֗ם הָֽאֲנָשִׁ֤ים וְהַנָּשִׁים֙ וְהַטַּ֔ף וְגֵרְךָ֖ אֲשֶׁ֣ר בִּשְׁעָרֶ֑יךָ לְמַ֨עַן יִשְׁמְע֜וּ וּלְמַ֣עַן יִלְמְד֗וּ וְיָֽרְאוּ֙ אֶת־יְהֹוָ֣ה אֱלֹהֵיכֶ֔ם וְשָׁמְר֣וּ לַעֲשׂ֔וֹת אֶת־כׇּל־דִּבְרֵ֖י הַתּוֹרָ֥ה הַזֹּֽאת׃", "onk": "כְּנוֹשׁ יָת עַמָּא גֻּבְרַיָּא וּנְשַׁיָּא וְטַפְלָא וְגִיּוֹרָךְ דִּי <b>בְקִרְוָיךְ<\/b> בְּדִיל דְּיִשְׁמְעוּן וּבְדִיל דְּיִלְּפוּן וְיִדְחֲלוּן <b>מִקֳּדָם<\/b> יְיָ אֱלָהֲכוֹן וְיִטְּרוּן לְמֶעְבַּד יָת כָּל פִּתְגָּמֵי אוֹרַיְתָא הָדָא:", "onk_en": "Assemble the people—the men and the women and the infants, and your convert who is in your towns; in order for them to hear and in order for them to learn to fear [<b>before<\/b>] Adonoy, your God, and they will make sure to fulfill all the statements of this Torah.", "pj": "כְּנוּשׁוּ יַת עַמָא גוּבְרַיָא לְמֵילַף וּנְשַׁיָא לְמִשְׁמַע אוּלְפָנָא וְטַפְלַיָא לְקִיבּוּלֵי עֲלֵיהוֹן אַגְרָא דְמַיְיתִין יַתְהוֹן וְגִיוֹרַיָא דִבְקִירְוֵיכוֹן דְיֶחֱמוּן אִיקַר אוֹרַיְיתָא וִידַחֲלוּן כֻּלְהוֹן מִן קֳדָם מֵימְרָא דַיְיָ אֱלָהָכוֹן וְיִטְרוּן לְמֶעֱבַד יַת כָּל פִּתְגָמֵי אוֹרַיְיתָא הָדָא", "pj_en": "Assemble the people, the men, that they may learn, the women, that they may hear instruction, the children, that they may partake the benefit (reward) of those who bring them, and your sojourners who are in your cities, that they may behold the majesty of the law, and be reverent all of them before the Word of the Lord your God, and observe to do all the words of this law.", "tj": "", "tj_en": "", "rashi": "<b>האנשים.<\/b> לִלְמֹד:<br><br><b>והנשים.<\/b> לִשְׁמֹעַ:<br><br><b>והטף.<\/b> לָמָּה בָא? לָתֵת שָׂכָר לִמְבִיאֵיהֶם (חגיגה ג'):", "rashi_en": "האנשים [ASSEMBLE THE PEOPLE,] MEN [WOMEN, AND LITTLE ONES] — the men, in order to learn,<br><br>והנשים THE WOMEN, in order to listen to the words of the Law,<br><br>והטף AND THE LITTLE ONES — Why did they come? For no other purpose than that a reward should be given to those who bring them (Chagigah 3a)."}, {"ch": 31, "v": 13, "aliyah": 5, "heb": "וּבְנֵיהֶ֞ם אֲשֶׁ֣ר לֹא־יָדְע֗וּ יִשְׁמְעוּ֙ וְלָ֣מְד֔וּ לְיִרְאָ֖ה אֶת־יְהֹוָ֣ה אֱלֹהֵיכֶ֑ם כׇּל־הַיָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל־הָ֣אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת־הַיַּרְדֵּ֛ן שָׁ֖מָּה לְרִשְׁתָּֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבְנֵיהוֹן דִּי לָא יָדְעוּן יִשְׁמְעוּן וְיַלְּפוּן לְמִדְחַל יָת יְיָ אֱלָהֲכוֹן כָּל יוֹמַיָּא דִּי אַתּוּן קַיָּמִין עַל אַרְעָא דִּי אַתּוּן עָבְרִין יָת יַרְדְּנָא תַּמָּן לְמֵירְתַהּ:", "onk_en": "And their children who did not understand will hear and will learn to fear Adonoy, your God, all the years that you are living on the land that you are crossing the Yardein there to inherit.", "pj": "וּבְנֵיהוֹן דְלָא יָדְעוּ יִשְׁמְעוּן וְיִלְפוּן לְמִדְחַל מִן קֳדָם יְיָ אֱלָהָכוֹן כָּל יוֹמַיָא דְאַתּוּן קַיָימִין עַל אַרְעָא דְאַתּוּן עָבְרִין יַת יוֹרְדְנָא תַּמָן לְמֵירְתָהּ", "pj_en": "Let their children also, who know not, hear, and learn to fear the Lord your God all the days that you live in the land to inherit which you pass over Jordan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 14, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה הֵ֣ן קָרְב֣וּ יָמֶ֘יךָ֮ לָמוּת֒ קְרָ֣א אֶת־יְהוֹשֻׁ֗עַ וְהִֽתְיַצְּב֛וּ בְּאֹ֥הֶל מוֹעֵ֖ד וַאֲצַוֶּ֑נּוּ וַיֵּ֤לֶךְ מֹשֶׁה֙ וִיהוֹשֻׁ֔עַ וַיִּֽתְיַצְּב֖וּ בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה הָא קְרִיבוּ יוֹמָיךְ לִמְמַת קְרָא יָת יְהוֹשֻׁעַ וְאִתְעַתָּדוּ בְּמַשְׁכַּן זִמְנָא וֶאֱפַקְּדִנֵּיהּ וַאֲזַל משֶׁה וִיהוֹשֻׁע וְאִתְעַתָּדוּ בְּמַשְׁכַּן זִמְנָא:", "onk_en": "Adonoy said to Moshe, ‘‘Look! Your time is approaching to die. Call Yehoshua and present yourselves in Ohel Moed and I shall exhort him.’’ Moshe went with Yehoshua and they presented themselves in Ohel Moed.", "pj": "תְּלָתָא צַדִיקַיָא אִתְאַמָרַת קְרֵיבוּתָא בְּמִיתַתְהוֹן מְטוֹל דְלָא מָטוּ לְיוֹמֵי אַבְהַתְהוֹן וְכָל חַד וְחַד מַנֵי פַּרְנָסָא בְּיוֹמֵיהּ יַעֲקב אָבוּנָן וְדָוִד מַלְכָּא וּמשֶׁה נְבִיָא דְהָכִין כְּתִיב וַאֲמַר יְיָ לְמשֶׁה הָא קְרִיבַן יוֹמָךְ לִמְמַת קְרֵי יַת יְהוֹשֻׁעַ וְתִתְעַתְּדוּן בְּמַשְׁכַּן זִמְנָא וְאַפְקְדִינֵיהּ וַאֲזַל משֶׁה וִיהוֹשֻׁעַ וְאִתְעַתָּדוּ בְּמַשְׁכַּן זִמְנָא", "pj_en": "Unto three of the just was it told that the time of their death was drawing nigh, and that they should not attain to the days of their fathers; and each of them had been appointed a prince in his days; Jakob our father, David the king, and Mosheh the prophet; for thus it is written: And the Lord said unto Mosheh, Behold, thy day approacheth when thou must die. Call Jehoshua, and stand both of you in the tabernacle of ordinance, that I may give him charge. And Mosheh and Jehoshua went, and stood in the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>ואצונו.<\/b> וַאֲזָרְזֶנּוּ:", "rashi_en": "ואצונו means, THAT I MAY EXHORT HIM."}, {"ch": 31, "v": 15, "aliyah": 6, "heb": "וַיֵּרָ֧א יְהֹוָ֛ה בָּאֹ֖הֶל בְּעַמּ֣וּד עָנָ֑ן וַֽיַּעֲמֹ֛ד עַמּ֥וּד הֶעָנָ֖ן עַל־פֶּ֥תַח הָאֹֽהֶל׃", "onk": "וְאִתְגְּלִי יְיָ בְּמַשְׁכְּנָא בְּעַמּוּדָא דַעֲנָנָא וְקָם עַמּוּדָא דַעֲנָנָא עַל תְּרַע מַשְׁכְּנָא:", "onk_en": "Adonoy revealed Himself in the Ohel in a pillar of cloud; the pillar of cloud remained at the entrance of the Ohel.", "pj": "וְאִתְגְלֵי אִיקַר שְׁכִינְתָּא דַיְיָ בְּמַשְׁכְּנָא בְּעַמוּדָא דַעֲנָנָא וְקָם עַמוּדָא דַעֲנָנָא עַל תְּרַע מַשְׁכְּנָא וּמשֶׁה וִיהוֹשֻׁעַ קָמוֹן מִן לְבַר", "pj_en": "And the glorious Shekinah of the Lord revealed itself at the tabernacle in the pillar of the Cloud, and the pillar of the Cloud stood over the door of the tabernacle, and Mosheh and Jehoshua stood without.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 16, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה הִנְּךָ֥ שֹׁכֵ֖ב עִם־אֲבֹתֶ֑יךָ וְקָם֩ הָעָ֨ם הַזֶּ֜ה וְזָנָ֣ה&thinsp;<b>׀<\/b> אַחֲרֵ֣י&thinsp;<b>׀<\/b> אֱלֹהֵ֣י נֵכַר־הָאָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא־שָׁ֙מָּה֙ בְּקִרְבּ֔וֹ וַעֲזָבַ֕נִי וְהֵפֵר֙ אֶת־בְּרִיתִ֔י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽוֹ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה הָא אַתְּ שָׁכֵב עִם אֲבָהָתָךְ וִיקוּם עַמָּא הָדֵין וְיִטְעֵי בָּתַר <b>טַעֲוַת עַמְמֵי<\/b> אַרְעָא דִּי הוּא עָל תַּמָּן בֵּינֵיהוֹן וְיִשְׁבְּקוּן <b>דַּחַלְתִּי<\/b> וְיַשְׁנוּן יָת קְיָמִי דִּי גְזָרִית עִמְּהוֹן:", "onk_en": "Adonoy said to Moshe, ‘‘You are about to die, and this people will arise and stray after the gods of the stranger [people] [<b>foreign idols<\/b>] of the land that they are going there among them, and they will forsake [<b>the fear of<\/b>] Me and break My covenant that I made with them.", "pj": "וַאֲמַר יְיָ לְמשֶׁה הָא אַנְתְּ שְׁכִיב בְּעַפְרָא עִם אַבְהָתָךְ וְנִשְׁמָתָךְ תֶּהֱוֵי גְנִיזָא בִּגְנִיז חַיֵי עַלְמָא עִם אַבְהָתָךְ וִיקוּמוּן רַשִׁיעֵי עַמָא הָדֵין וְיִטְעוּן בָּתַר טַעֲוַות עַמְמַיָא דְהִינוּן עַלְלִין תַּמָן בֵּינֵיהוֹן וְיִשְׁבְּקוּן דַחַלְתִּי וְיִשְׁנוּן יַת קְיָימַי דִי גְזָרִית עִמְהוֹן", "pj_en": "And the Lord said to Mosheh, Behold, thou wilt lie down in the dust with thy fathers, and thy soul shall be treasured in the treasury of eternal life with thy fathers: but this wicked people will rise up and go astray after the idols of the nations among whom they come, and will forsake My worship, and change My covenant which I have made with them.", "tj": "וְיִשְׁבְּקוּן וְיִפְסוּן יַת קְיָימַיָא דִי קַיֵימִית עִמְהוֹן:", "tj_en": "They will forsake, and will profane the statutes I have confirmed with them.", "rashi": "<b>נכר הארץ.<\/b> גּוֹיֵי הָאָרֶץ:", "rashi_en": "נכר הארץ [THIS PEOPLE WILL … GO ASTRAY AFTER THE GODS OF] נכר הארץ — i.e., [after the gods of] the peoples of the land (Onkelos)."}, {"ch": 31, "v": 17, "aliyah": 6, "heb": "וְחָרָ֣ה אַפִּ֣י ב֣וֹ בַיּוֹם־הַ֠ה֠וּא וַעֲזַבְתִּ֞ים וְהִסְתַּרְתִּ֨י פָנַ֤י מֵהֶם֙ וְהָיָ֣ה לֶאֱכֹ֔ל וּמְצָאֻ֛הוּ רָע֥וֹת רַבּ֖וֹת וְצָר֑וֹת וְאָמַר֙ בַּיּ֣וֹם הַה֔וּא הֲלֹ֗א עַ֣ל כִּי־אֵ֤ין אֱלֹהַי֙ בְּקִרְבִּ֔י מְצָא֖וּנִי הָרָע֥וֹת הָאֵֽלֶּה׃", "onk": "וְיִתְקוֹף רָגְזִי <b>בְהוֹן<\/b> בְּיוֹמָא הַהוּא <b>וְאַרְחֵקִנּוּן<\/b> וֶאֱסַלֵּק <b>שְׁכִנְתִּי<\/b> מִנְּהוֹן וִיהוֹן <b>לְמִבַּז<\/b> וְיִעָרְעַן יָתְהוֹן בִּישָׁן סַגִּיאָן וְעָקָן וְיֵימַר בְּיוֹמָא הַהוּא הֲלָא מִדְּלֵית <b>שְׁכִינַת<\/b> אֱלָהַי בֵּינִי עָרְעוּנִי בִּישַׁיָּא הָאִלֵּין:", "onk_en": "And I will wax angry at them on that day and I will forsake [<b>distance<\/b>] them and I shall conceal My face [<b>Shechinah<\/b>] from them and they will be for consuming [<b>scorned<\/b>] and many evils and troubles will happen to them; and they will say on that day, ‘‘Look! Because [<b>the Shechinah of<\/b>] my God is not within me did these evils happen to me.’’", "pj": "וְיִתְקוֹף רוּגְזִי בְּהוֹן בְּיוֹמָא הַהוּא וְאַרְחִיקִינוּן וַאֲסַלֵק שְׁכִינְתִּי מִנְהוֹן וִיהוֹן לְבִיזָא וִיאַרְעָן יַתְהוֹן בִּישָׁן סַגִיאִין וְעָקָן וְיֵימְרוּן בְּעִידָנָא הַהִיא בִּשְׁבוּעָא מְטוֹל דְלֵית שְׁכִינַת אֱלָהַי שַׁרְיָא בְּמִצְעִי אִירְעוּנִי בִּישָׁתָא הָאִלֵין", "pj_en": "Then My anger will be kindled against them in that day, and I shall abhor them, and remove My Shekinah from them, and they will become a prey, and many evils and troubles shall befall them. And they will say at that time, with adjuration, Is it not because the Shekinah of my God dwelleth not among me, that all these evils have befallen me?", "tj": "", "tj_en": "", "rashi": "<b>והסתרתי פני.<\/b> כְּמוֹ שֶׁאֵינִי רוֹאֶה בְּצָרָתָם:", "rashi_en": "והסתרתי פני AND I WILL HIDE MY FACE FROM THEM, as though I do not see their distress."}, {"ch": 31, "v": 18, "aliyah": 6, "heb": "וְאָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַי֙ בַּיּ֣וֹם הַה֔וּא עַ֥ל כׇּל־הָרָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל־אֱלֹהִ֖ים אֲחֵרִֽים׃", "onk": "וַאֲנָא <b>סַלָּקָא אֱסַלֵּק שְׁכִנְתִּי מִנְּהוֹן<\/b> בְּיוֹמָא הַהוּא עַל כָּל בִּישָׁא דִּי עֲבָדוּ אֲרֵי אִתְפְּנִיּוּ <b>לְטַעֲוַת עַמְמַיָּא<\/b>:", "onk_en": "And I will surely conceal My face [<b>remove My Shechinah from them<\/b>] on that day because of all the wickedness that they did, because they turned to other gods [<b>idols of other nations<\/b>].", "pj": "וַאֲנָא מְסַלְקָא אֲסַלֵק שְׁכִינְתִּי מִנְהוֹן בְּעִידָנָא הַהִיא עַד דְיִתְמַקְמְקוּן וִיקַבְּלוּן פּוּרְעָנוּת חוֹבֵיהוֹן עַל כָּל בִּישָׁתָא דְעָבָדוּ אֲרוּם אִתְפְּנִיוּ בָּתַר טַעֲוַות עַמְמַיָא", "pj_en": "But I will indeed remove My Shekinah from them at that time, until they have dwindled away, to receive the punishment of their sins for all the evil they have wrought, because they turned themselves after the idols of the nations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 19, "aliyah": 6, "heb": "וְעַתָּ֗ה כִּתְב֤וּ לָכֶם֙ אֶת־הַשִּׁירָ֣ה הַזֹּ֔את וְלַמְּדָ֥הּ אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל שִׂימָ֣הּ בְּפִיהֶ֑ם לְמַ֨עַן תִּֽהְיֶה־לִּ֜י הַשִּׁירָ֥ה הַזֹּ֛את לְעֵ֖ד בִּבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּכְעַן כְּתִיבוּ לְכוֹן יָת <b>תֻּשְׁבַּחְתָּא<\/b> הָדָא וְאַלְּפַהּ יָת בְּנֵי יִשְׂרָאֵל שַׁוְּיַהּ בְּפֻמְהוֹן בְּדִיל דִּתְהֵי <b>קֳדָמַי תֻּשְׁבַּחְתָּא<\/b> הָדָא לְסָהִיד בִּבְנֵי יִשְׂרָאֵל:", "onk_en": "And now write for yourselves this song [<b>praise<\/b>] and teach it to Bnei Yisroel to place it in their mouths; in order that this song [<b>praise<\/b>] will be for [<b>before<\/b>] Me a witness against Bnei Yisroel.", "pj": "וּכְדוֹן כְּתִיבוּ לְכוֹן יַת תּוּשְׁבַּחְתָּא הֲדָא וְאַלְפָהּ יַת בְּנֵי יִשְרָאֵל שַׁוְויָהּ בְּפוּמְהוֹן בְּדִיל דְתֵהֵי תּוּשְׁבַּחְתָּא הֲדָא קֳדָמוֹי לְסָהִיד בִּבְנֵי יִשְרָאֵל", "pj_en": "And now, write you this hymn, and teach the children of Israel; put it upon their lips, that this hymn may be before them, for a witness against the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>את השירה הזאת.<\/b> \"הַאֲזִינוּ הַשָּׁמַיִם\" עַד \"וְכִפֶּר אַדְמָתוֹ עַמּוֹ\":", "rashi_en": "את השירה הזאת [NOW THEREFORE WRITE YE] THIS SONG — i.e. the text “Give ear, O ye heavens”, till “and make expiation for his ground, and his people” (Deuteronomy 32:1—43)."}, {"ch": 31, "v": 20, "aliyah": 7, "heb": "כִּֽי־אֲבִיאֶ֜נּוּ אֶֽל־הָאֲדָמָ֣ה&thinsp;<b>׀<\/b> אֲשֶׁר־נִשְׁבַּ֣עְתִּי לַאֲבֹתָ֗יו זָבַ֤ת חָלָב֙ וּדְבַ֔שׁ וְאָכַ֥ל וְשָׂבַ֖ע וְדָשֵׁ֑ן וּפָנָ֞ה אֶל־אֱלֹהִ֤ים אֲחֵרִים֙ וַעֲבָד֔וּם וְנִ֣אֲצ֔וּנִי וְהֵפֵ֖ר אֶת־בְּרִיתִֽי׃", "onk": "אֲרֵי אָעֵלִנּוּן לְאַרְעָא דִּי קַיֵּמִית לַאֲבָהָתְהוֹן עָבְדָא חֲלַב וּדְבַשׁ וְיֵיכְלוּן וְיִשְׂבְּעוּן וְיִתְפַּנְּקוּן וְיִתְפְּנוּן בָּתַר <b>טַעֲוַת עַמְמַיָּא<\/b> וְיִפְלְחֻנּוּן וְיִרְגְּזוּן <b>קֳדָמַי<\/b> וְיַשְׁנוּן יָת קְיָמִי:", "onk_en": "For I will bring them to the land that I swore to their forefathers, flowing milk and honey, and they will eat, and be full, and wax fat; and they will turn to other gods [<b>idols of other nations<\/b>] and serve them and they will infuriate [<b>before<\/b>] Me and break My covenant.", "pj": "אֲרוּם אֵיעֲלִינוּן לְאַרְעָא דְקַיֵימִית לְאַבְהַתְהוֹן עַבְדָא חֲלַב וּדְבַשׁ וְיֵיכְלוּן וְיִשְבְּעוּן וִידַהֲנוּן וְיִתְפְּנוּן לְטַעֲוַות עַמְמַיָא וְיִפְלְחוּנוּן וְיִרְגְזוּן קָדָמַי וְיִשְׁנוּן יַת קְיָימִי", "pj_en": "For I will bring them into the land which I promised to their fathers, (a land) producing milk and honey, and they will eat and be satisfied: but (after that they have) waxen fat they will turn away to the idols of the Gentiles and worship them; so will they provoke Me to anger, and abolish My covenant.", "tj": "", "tj_en": "", "rashi": "<b>ונאצוני.<\/b> וְהִכְעִיסוּנִי, וְכֵן כָּל נִאוּץ לְשׁוֹן כַּעַס:", "rashi_en": "ונאצוני means AND THEY WILL PROVOKE ME TO ANGER. So, too, every form of the root נאץ denotes anger."}, {"ch": 31, "v": 21, "aliyah": 7, "heb": "וְ֠הָיָ֠ה כִּי־תִמְצֶ֨אןָ אֹת֜וֹ רָע֣וֹת רַבּוֹת֮ וְצָרוֹת֒ וְ֠עָנְתָ֠ה הַשִּׁירָ֨ה הַזֹּ֤את לְפָנָיו֙ לְעֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִפִּ֣י זַרְע֑וֹ כִּ֧י יָדַ֣עְתִּי אֶת־יִצְר֗וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַיּ֔וֹם בְּטֶ֣רֶם אֲבִיאֶ֔נּוּ אֶל־הָאָ֖רֶץ אֲשֶׁ֥ר נִשְׁבַּֽעְתִּי׃", "onk": "וִיהֵי אֲרֵי <b>יְעָרְעָן<\/b> יָתֵיהּ בִּישָׁן סַגִּיאָן וְעָקָן <b>וְתָתֵב תֻּשְׁבַּחְתָּא<\/b> הָדָא <b>קֳדָמוֹהִי<\/b> לְסָהִיד אֲרֵי לָא תִתְנְשֵׁי מִפּוּם בְּנֵיהוֹן אֲרֵי <b>גְלֵי קֳדָמַי<\/b> יָת יִצְרְהוֹן דִּי אִנּוּן עָבְדִין יוֹמָא דֵין עַד לָא אָעֵלִנּוּן לְאַרְעָא דִּי קַיֵּמִית:", "onk_en": "Should many evils and troubles happen to them, this song [<b>praise<\/b>] shall [<b>return and<\/b>] serve [<b>before Me<\/b>] as testimony before them as witness—for it shall never be forgotten from the lips of their progeny—for I know [<b>it is revealed before Me<\/b>] their impulse that they are gratifying today prior to My bringing them to the land that I swore.", "pj": "וִיהֵי אֲרוּם יְעַרְעָן יַתְהוֹן בִּישַׁן סַגִיאָן וְעָקָן וְתַסְהִיד תּוּשְׁבַּחְתָּא הֲדָא קֳדָמֵיהוֹן לְסַהֲדוּ אֲרוּם גְלֵי קֳדָמַי דְלָא תִתְנְשֵׁי מִפּוּם בְּנֵיהוֹן אֲרוּם גְלֵי קֳדָמַי יַת יִצְרֵהוֹן בִּישָׁא דְאִינוּן עַבְדִין יוֹמָנָא עַד לָא אַעֲלֵיכוֹן לְאַרְעָא דְקַיֵימִית", "pj_en": "And when these many evils and troubles shall come upon them, then will this hymn bear witness to them for a testimony; for it is revealed before Me that it will not be forgotten on the lips of their children: for their evil disposition to which they are yielding today, even before I bring you into the promised land, is known to Me.", "tj": "", "tj_en": "", "rashi": "<b>וענתה השירה הזאת לפניו לעד.<\/b> שֶׁהִתְרֵיתִי בוֹ בְתוֹכָהּ עַל כָּל הַמּוֹצְאוֹת אוֹתוֹ:<br><br><b>כי לא תשכח מפי זרעו.<\/b> הֲרֵי זוֹ הַבְטָחָה לְיִשְׂרָאֵל שֶׁאֵין תּוֹרָה מִשְׁתַּכַּחַת מִזַּרְעָם לְגַמְרֵי:", "rashi_en": "וענתה השירה הזאת לפניו לעד [AND IT SHALL COME TO PASS …] THAT THIS SONG SHALL TESTIFY that in it I had warned them concerning all the things that had befallen them.<br><br>כי לא תשכח מפי זרעו FOR IT SHALL NOT BE FORGOTTEN OUT OF THE MOUTHS OF THEIR SEED — This is an assurance to Israel that the Torah in which this song is contained will never be entirely forgotten by their descendants (Shabbat 138b)."}, {"ch": 31, "v": 22, "aliyah": 7, "heb": "וַיִּכְתֹּ֥ב מֹשֶׁ֛ה אֶת־הַשִּׁירָ֥ה הַזֹּ֖את בַּיּ֣וֹם הַה֑וּא וַֽיְלַמְּדָ֖הּ אֶת־בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּכְתַב משֶׁה יָת <b>תּוּשְׁבַּחְתָּא<\/b> הָדָא בְּיוֹמָא הַהוּא וְאַלֵּפִנַּהּ לִבְנֵי יִשְׂרָאֵל:", "onk_en": "Moshe wrote this song [<b>praise<\/b>] on that day, and he taught it to Bnei Yisroel.", "pj": "וּכְתַב משֶׁה יַת תּוּשְׁבַּחְתָּא הֲדָא וְאַלְפָהּ יַת בְּנֵי יִשְרָאֵל", "pj_en": "And Mosheh wrote this hymn, and taught the children of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 23, "aliyah": 7, "heb": "וַיְצַ֞ו אֶת־יְהוֹשֻׁ֣עַ בִּן־נ֗וּן וַיֹּ֘אמֶר֮ חֲזַ֣ק וֶאֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת־בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל־הָאָ֖רֶץ אֲשֶׁר־נִשְׁבַּ֣עְתִּי לָהֶ֑ם וְאָנֹכִ֖י אֶהְיֶ֥ה עִמָּֽךְ׃", "onk": "וּפַקִּיד יָת יְהוֹשֻׁעַ בַּר נוּן וַאֲמַר תְּקֵף וְאַלִּים אֲרֵי אַתְּ תָּעֵל יָת בְּנֵי יִשְׂרָאֵל לְאַרְעָא דִּי קַיֵּמִית לְהוֹן וּמֵימְרִי יְהֵי בְסַעֲדָּךְ:", "onk_en": "He commanded Yehoshua, the son of Nun and said, ‘‘Be courageous and bold, for you will bring Bnei Yisroel to the land that I swore to them, and I will be with you.’’", "pj": "וּפַקֵיד יַת יְהוֹשׁוּעַ בַּר נוּן וַאֲמַר אִיתוֹקַף וְאִתְחַיֵיל אֲרוּם אַנְתְּ תָּעֵיל יַת בְּנֵי יִשְרָאֵל לְאַרְעָא דְקַיֵימִית לְהוֹן וּמֵימְרִי יְהֵי בְּסַעֲדָךְ", "pj_en": "And He commanded Jehoshua bar Nun, saying: Be strong and of good courage; for thou art to bring the sons of Israel into the land I have promised to them, and My Word shall be thy Helper.", "tj": "", "tj_en": "", "rashi": "<b>ויצו את יהושע בן נון.<\/b> מוּסָב לְמַעְלָה כְּלַפֵּי שְׁכִינָה, כְּמוֹ שֶׁמְּפֹרָשׁ \"אֶל הָאָרֶץ אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם\":", "rashi_en": "ויצו את יהושע בן נון AND HE COMMANDED JOSHUA THE SON OF NUN — This has to be connected with v. 14 above, and it refers to the Shechinah (to God; “He commanded” means “God commanded”), as it distinctly states here “[for thou shalt bring the children of Israel] into the land which “I” swore unto them, [and “I” will be with thee]”."}, {"ch": 31, "v": 24, "aliyah": 7, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> כְּכַלּ֣וֹת מֹשֶׁ֗ה לִכְתֹּ֛ב אֶת־דִּבְרֵ֥י הַתּוֹרָֽה־הַזֹּ֖את עַל־סֵ֑פֶר עַ֖ד תֻּמָּֽם׃", "onk": "וַהֲוָה כַּד שֵׁצֵי משֶׁה לְמִכְתַּב יָת פִּתְגָּמֵי אוֹרַיְתָא הָדָא עַל סִפְרָא עַד דִּשְׁלִימוּ:", "onk_en": "When Moshe finished writing the statements of this Torah in a book, till they were complete,", "pj": "וַהֲוָה כְּמִפְסַק משֶׁה לְמִכְתּוֹב יַת פִּתְגָמֵי אוֹרַיְיתָא הֲדָא עַל גְוִוילָא עַד דִי אַשְׁלִימוּנוּן", "pj_en": "And when Mosheh had finished to write the words of this law upon parchment to complete them,", "tj": "וַהֲוָה כֵיוַן דְאַשְׁלֵם משֶׁה לְמִכְתּוֹב יַת מַלָלֵי שְׁבַח אוֹרַיְיתָא הָדָא עַד זְמַן דַחֲסָלוּ:", "tj_en": "When Mosheh had completed to write the glorious words of this law until they were finished,", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 25, "aliyah": 7, "heb": "וַיְצַ֤ו מֹשֶׁה֙ אֶת־הַלְוִיִּ֔ם נֹ֥שְׂאֵ֛י אֲר֥וֹן בְּרִית־יְהֹוָ֖ה לֵאמֹֽר׃", "onk": "וּפַקִּיד משֶׁה יָת לֵוָאֵי נָטְלֵי אֲרוֹן קְיָמָא דַיְיָ לְמֵימָר:", "onk_en": "Moshe commanded the Levites, bearers of the ark of Adonoy’s covenant, saying:", "pj": "וּפַקֵיד משֶׁה יַת לֵיוָאֵי נַטְלֵי אֲרוֹן קְיָימָא דַיְיָ לְמֵימָר", "pj_en": "he commanded the Levites who bare the ark of the Lord’s covenant, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 26, "aliyah": 7, "heb": "לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַתּוֹרָה֙ הַזֶּ֔ה וְשַׂמְתֶּ֣ם אֹת֔וֹ מִצַּ֛ד אֲר֥וֹן בְּרִית־יְהֹוָ֖ה אֱלֹהֵיכֶ֑ם וְהָיָה־שָׁ֥ם בְּךָ֖ לְעֵֽד׃", "onk": "סִיבוּ יָת סִפְרָא דְאוֹרַיְתָא הָדֵין וּתְשַׁוּוּן יָתֵיהּ מִסְּטַר אֲרוֹנָא קְיָמָא דַיְיָ אֱלָהֲכוֹן וִיהֵי תַמָּן בָּךְ לְסָהִיד:", "onk_en": "‘‘Take this book of the Torah and place it on the side of the ark of Adonoy, your God’s covenant; and it will be there as witness against you.", "pj": "סָבוּ יַת סִפְרָא דְאוֹרַיְיתָא הָדָא וּתְשַׁווּן יָתֵיהּ בְּקוּפְסָא מִן צְטַר יְמִינָא דַאֲרוֹן קְיָימָא דַיְיָ אֱלָהָכוֹן וִיהֵי תַּמָן בְּכוֹן לְסָהִיד", "pj_en": "Take the book of this law, and put it into a chest on the right side of the ark of the covenant of the Lord your God, that it may be for a testament to you.", "tj": "", "tj_en": "", "rashi": "<b>לקח.<\/b> כְּמוֹ זָכוֹר (שמות כ') שָׁמוֹר (דברים ה'), הָלוֹךְ (ירמיהו ב'):<br><br><b>מצד ארון ברית ה'.<\/b> נֶחְלְקוּ בוֹ חַכְמֵי יִשְׂרָאֵל בְּבָבָא בָּתְרָא (דף י\"ד), יֵשׁ מֵהֶם אוֹמְרִים דַּף הָיָה בוֹלֵט מִן הָאָרוֹן מִבַּחוּץ וְשָׁם הָיָה מֻנָּח, וְיֵשׁ אוֹמְרִים מִצַּד הַלּוּחוֹת הָיָה מֻנָּח בְּתוֹךְ הָאָרוֹן:", "rashi_en": "לקח — The grammatical form and its meaning are the same as in (Exodus 20:8) זכור; (Deuteronomy 5:12) שמור; (Jeremiah 2:2) הלוך‎.<br><br>מצד ארון ברית ה׳ [TAKE THIS BOOK OF THE LAW AND PUT IT] AT THE SIDE OF THE ARK OF THE COVENANT OF THE LORD — The sages of Israel differ about it (the meaning of the phrase “at the side of the Ark”) in Treatise Bava Batra 14a. Some of them say: A board projected from the Ark outside it and there it (the song) lay, whilst others say that it lay at the side of the Tablets within the Ark."}, {"ch": 31, "v": 27, "aliyah": 7, "heb": "כִּ֣י אָנֹכִ֤י יָדַ֙עְתִּי֙ אֶֽת־מֶרְיְךָ֔ וְאֶֽת־עׇרְפְּךָ֖ הַקָּשֶׁ֑ה הֵ֣ן בְּעוֹדֶ֩נִּי֩ חַ֨י עִמָּכֶ֜ם הַיּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם־יְהֹוָ֔ה וְאַ֖ף כִּי־אַחֲרֵ֥י מוֹתִֽי׃", "onk": "אֲרֵי אֲנָא יְדַעְנָא יָת <b>סַרְבָנוּתָךְ<\/b> וְיָת קְדָלָךְ דְּקַשְׁיָא הָא בְעַד אֲנָא קַיָּם עִמְּכוֹן יוֹמָא דֵין <b>מְסָרְבִין<\/b> הֲוֵיתוּן <b>קֳדָם<\/b> יְיָ וְאַף אֲרֵי בָּתַר דְּאֵמוּת:", "onk_en": "For I know your rebelliousness your stubborness. Look! even while I live with you today you have been defiers [<b>rebellious<\/b>] with [<b>before<\/b>] Adonoy, surely after my death.", "pj": "אֲרוּם גְלֵי קֳדָמַי יַת סוּרְהַבְנוּתְכוֹן וְיַת קְדַלְכוֹן קַשְׁיָא הָא עַד זְמַן דַאֲנָא בְּחַיִים בֵּינֵיכוֹן יוֹמָא דֵין מְסַרְהֲבִין הֲוֵיתוּן קֳדָם יְיָ וְאוּף כָּל דְכֵן בָּתַר דְאֵימוּת", "pj_en": "For your rebellion is revealed before me, and the obduracy of your neck. Behold, while I am yet alive among you today ye are rebellious before the Lord; but how much more when I am dead!", "tj": "עַל אַחַת כַּמָה וְכַמָה בָּתַר דְאֵימוּת:", "tj_en": "How much more when I am dead!", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 28, "aliyah": 7, "heb": "הַקְהִ֧ילוּ אֵלַ֛י אֶת־כׇּל־זִקְנֵ֥י שִׁבְטֵיכֶ֖ם וְשֹׁטְרֵיכֶ֑ם וַאֲדַבְּרָ֣ה בְאׇזְנֵיהֶ֗ם אֵ֚ת הַדְּבָרִ֣ים הָאֵ֔לֶּה וְאָעִ֣ידָה בָּ֔ם אֶת־הַשָּׁמַ֖יִם וְאֶת־הָאָֽרֶץ׃", "onk": "כְּנִישׁוּ לְוָתִי יָת כָּל סָבֵי שִׁבְטֵיכוֹן וְסָרְכֵיכוֹן וֶאֱמַלֵּל <b>קֳדָמֵיהוֹן<\/b> יָת פִּתְגָּמַיָּא הָאִלֵּין וְאַסְהֵד בְּהוֹן יָת שְׁמַיָּא וְיָת אַרְעָא:", "onk_en": "Assemble to me all the judges of your tribes and your enforcers, and I will declare [<b>before Me<\/b>] in their hearing these statements, and invoke as witnesses against them heaven and earth,", "pj": "כְּנוּשׁוּ לְוָותִי יַת כָּל חַכִּימֵי שִׁבְטֵיכוֹן וְסַרְכֵיכוֹן וַאֲמַלֵיל בְּמִשְׁמְעֵהוֹן יַת כָּל פִּתְגָמַיָא הָאִילֵין וְאַסְהִיד בְּהוֹן יַת שְׁמַיָא וְיַת אַרְעָא", "pj_en": "Gather together to me all the sages of your tribes and your officers, and I will speak all these words in their hearing, and will call heaven and earth to bear witness against them.", "tj": "", "tj_en": "", "rashi": "<b>הקהילו אלי.<\/b> וְלֹא תָקְעוּ אוֹתוֹ הַיּוֹם בַּחֲצוֹצְרוֹת לְהַקְהִיל אֶת הַקָּהָל, לְפִי שֶׁנֶּאֱמַר (במדבר י') \"עֲשֵׂה לְךָ\", וְלֹא הִשְׁלִיט יְהוֹשֻׁעַ עֲלֵיהֶם, וְאַף בְּחַיָּיו נִגְנְזוּ — בְּיוֹם מוֹתוֹ — לְקַיֵּם מַה שֶּׁנֶּאֱמַר (קהלת ח') \"וְאֵין שִׁלְטוֹן בְּיוֹם הַמָּוֶת\" (תנחומא ויחי ובהעלותך):<br><br><b>ואעידה בם את השמים ואת הארץ.<\/b> וְאִם תֹּאמַר הֲרֵי כְּבָר הֵעִיד לְמַעְלָה — \"הַעִדֹתִי בָכֶם הַיּוֹם וְגוֹ'\"? הָתָם לְיִשְׂרָאֵל אָמַר, אֲבָל לַשָּׁמַיִם וְלָאָרֶץ לֹא אָמַר, וְעַכְשָׁו בָּא לוֹמַר \"הַאֲזִינוּ הַשָּׁמַיִם וְגוֹ'\"(דברים ל\"ב):", "rashi_en": "הקהילו אלי ASSEMBLE UNTO ME [ALL THE ELDERS OF YOUR TRIBE] — They did not, however, blow the trumpets that day to call the congregation together (as is prescribed in Numbers 10:3), because it states (Numbers 10:2) “Make for thee [two trumpets of silver]” (which Rashi explains to mean that no one should use them except himself), and he had not empowered Joshua to use them. Indeed they were hidden away even during his (Moses) lifetime — on the day of his death, thus fulfilling the words of the text, (Ecclesiastes 8:8) “There is no authority on the day of death” (cf. Midrash Tanchuma, Vayechi 2 on ויחי and ‎Midrash Tanchuma, Beha'alotcha 10 on בהעלתך).‎<br><br>ואעידה בם את השמים ואת הארץ I WILL CALL THE HEAVEN AND THE EARTH AS WITNESSES AGAINST THEM — But if you ask, “Behold he has already above (Deuteronomy 30:19) called heaven and earth as witnesses: “I call [the heaven and the earth] as witnesses this day against you etc.”?! Then I reply: There he said this to the Israelites (he told them that He would do this), but now he intends to say (Deuteronomy 32:1) “Give ear, O ye heavens, [and I will speak; and hear earth] etc.”, thus calling them as witnesses."}, {"ch": 31, "v": 29, "aliyah": 7, "heb": "כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִי֙ כִּֽי־הַשְׁחֵ֣ת תַּשְׁחִת֔וּן וְסַרְתֶּ֣ם מִן־הַדֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְכֶ֑ם וְקָרָ֨את אֶתְכֶ֤ם הָרָעָה֙ בְּאַחֲרִ֣ית הַיָּמִ֔ים כִּֽי־תַעֲשׂ֤וּ אֶת־הָרַע֙ בְּעֵינֵ֣י יְהֹוָ֔ה לְהַכְעִיס֖וֹ בְּמַעֲשֵׂ֥ה יְדֵיכֶֽם׃", "onk": "אֲרֵי יְדַעְנָא בָּתַר דְּאֵמוּת אֲרֵי חַבָּלָא תְחַבְּלוּן וְתִסְטוּן מִן אָרְחָא דִּי פַקֵּדִית יָתְכוֹן וּתְעָרַע יָתְכוֹן בִּשְׁתָּא בְּסוֹף יוֹמַיָּא אֲרֵי תַעְבְּדוּן יָת דְּבִישׁ <b>קֳדָם<\/b> יְיָ לְאַרְגָּזָא <b>קֳדָמוֹהִי<\/b> בְּעוֹבָדֵי יְדֵיכוֹן:", "onk_en": "For I know after my death, that you will become depraved and you will veer from the way that I commanded you; and harm will happen to you at the end of time, when you do what is wicked in [<b>before<\/b>] Adonoy’s eyes to spite [<b>before<\/b>] Him with your actions.", "pj": "אֲרוּם חַכִּימַת דְמִן בָּתַר דְאֵמוּת אֲרוּם חַבָּלָא תְחַבְּלוּן עוֹבָדֵיכוֹן וְתִטְעוּן מִן אָרְחָא דְפַקֵידִית יַתְכוֹן וְתֶאֱרַע יַתְכוֹן בִּישְׁתָּא בְּסוֹף כָּל יוֹמַיָא אֲרוּם תַּעַבְדוּן דְבִישׁ קֳדָם יְיָ לְאַרְגָזָא קֳדָמוֹי", "pj_en": "For I know that after my death corrupting you will corrupt your works, and go astray from the way I have commanded you, and that evil will befall you in the end, because you will do what is wrong before the Lord in provoking Him to anger.", "tj": "", "tj_en": "", "rashi": "<b>אחרי מותי כי השחת תשחיתון.<\/b> וַהֲרֵי כָּל יְמוֹת יְהוֹשֻׁעַ לֹא הִשְׁחִיתוּ, שֶׁנֶּאֱמַר \"וַיַּעַבְדוּ הָעָם אֶת ה' כֹּל יְמֵי יְהוֹשֻׁעַ\" (שופטים ב')? מִכָּאן שֶׁתַּלְמִידוֹ שֶׁל אָדָם חָבִיב עָלָיו כְּגוּפוֹ, כָּל זְמַן שֶׁיְּהוֹשֻׁעַ חַי הָיָה נִרְאֶה לְמֹשֶׁה כְּאִלּוּ הוּא חַי:", "rashi_en": "אחרי מותי כי השחת תשחתון [FOR I KNOW THAT] AFTER MY DEATH YE WILL UTTERLY CORRUPT YOURSELVES — But, you see, as a matter of fact, that all the days of Joshua they did not corrupt themselves, for it states, (Judges 2:7) “And the people served the Lord all the days of Joshua”?! (How, then, could Moses say that they would corrupt themselves after his death, by which he evidently meant immediately after his death, cf. v. 16)? But we may derive from here that one’s pupil should be as dear to him as his own self: — it appeared to Moses that so long as Joshua would live it would be as though he himself would be living (he thus alluded by the words “after my death” to a period after Joshua’s death)."}, {"ch": 31, "v": 30, "aliyah": 7, "heb": "וַיְדַבֵּ֣ר מֹשֶׁ֗ה בְּאׇזְנֵי֙ כׇּל־קְהַ֣ל יִשְׂרָאֵ֔ל אֶת־דִּבְרֵ֥י הַשִּׁירָ֖ה הַזֹּ֑את עַ֖ד תֻּמָּֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמַלִּיל משֶׁה <b>קֳדָם<\/b> כָּל קְהָלָא דְיִשְׂרָאֵל יָת פִּתְגָּמֵי תּוּשְׁבַּחְתָּא הָדָא עַד דִּשְׁלִימוּ:", "onk_en": "Moshe spoke in the hearing of [<b>before<\/b>] all the assemblage of Yisroel the statements of this song, till they were complete.", "pj": "וּמַלֵיל משֶׁה בְּמִשְׁמַע כָּל קְהָלָא דְיִשְרָאֵל יַת כָּל פִּתְגָמֵי שִׁבְחָא הָדָא עַד דִי שְׁלִימוּ", "pj_en": "And Mosheh spake in the hearing of all the congregation of Israel the words of this hymn until they were ended.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
