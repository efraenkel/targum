<!DOCTYPE html>
<html lang="he" dir="rtl">

<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

const DATA = [{"ch": 23, "v": 1, "aliyah": 1, "heb": "וַיִּהְיוּ֙ חַיֵּ֣י שָׂרָ֔ה מֵאָ֥ה שָׁנָ֛ה וְעֶשְׂרִ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים שְׁנֵ֖י חַיֵּ֥י שָׂרָֽה׃", "onk": "וַהֲווֹ חַיֵּי שָׂרָה מְאָה וְעֶשְׂרִין וּשְׁבַע שְׁנִין שְׁנֵי חַיֵּי שָׂרָה:", "onk_en": "The lifetime of Sarah consisted of one hundred years, twenty years and seven years. [These were] the years of Sarah’s life.", "pj": "ויהיו חיי שׁרה וַהֲווֹ חַיֵי שָרָה מְאָה וְעֶשְרִין וּשְׁבַע שְׁנִין שְׁנֵי חַיָיהָא דְשָרָה", "pj_en": "And the days of the life of Sarah were an hundred and twenty and seven years, the years of the life of Sarah.", "tj": "", "tj_en": "", "rashi": "<b>ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים.<\/b> לְכָךְ נִכְתַּב שָׁנָה בְּכָל כְּלָל וּכְלָל, לוֹמַר לְךָ שֶׁכָּל אֶחָד נִדְרָשׁ לְעַצְמוֹ, בַּת ק' כְּבַת כ' לְחֵטְא, מַה בַּת כ' לֹא חָטְאָה, שֶׁהֲרֵי אֵינָהּ בַּת עֳנָשִׁין, אַף בַּת ק' בְּלֹא חֵטְא, וּבַת כ' כְּבַת ז' לְיֹפִי:<br><br><b>שני חיי שרה.<\/b> כֻּלָּן שָׁוִין לְטוֹבָה:", "rashi_en": "ויהיו חיי שרה מאה שנה ועשרים שנה ושבע שנים AND THE LIFE OF SARAH WAS 127 YEARS (literally, 100 years, 20 years and 7 years) — The reason the word שנה is written at every term is to tell you that each term must be explained by itself as a complete number: at the age of one hundred she was as a woman of twenty as regards sin — for just as at the age of twenty one may regard her as having never sinned, since she had not then reached the age when she was subject to punishment, so, too, when she was one hundred years old she was sinless — and when she was twenty she was as beautiful as when she was seven (Genesis Rabbah 58:1).<br><br>שני חיי שרה THE YEARS OF SARAH’S LIFE — The word years is repeated and without a number to indicate that they were all equally good. "}, {"ch": 23, "v": 2, "aliyah": 1, "heb": "וַתָּ֣מׇת שָׂרָ֗ה בְּקִרְיַ֥ת אַרְבַּ֛ע הִ֥וא חֶבְר֖וֹן בְּאֶ֣רֶץ כְּנָ֑עַן וַיָּבֹא֙ אַבְרָהָ֔ם לִסְפֹּ֥ד לְשָׂרָ֖ה וְלִבְ<small>כֹּ<\/small>תָֽהּ׃", "onk": "וּמִיתַת שָׂרָה בְּקִרְיַת אַרְבַּע הִיא חֶבְרוֹן בְּאַרְעָא דִכְנָעַן וַאֲתָא אַבְרָהָם לְמִסְפְּדָה לְשָׂרָה וּלְמִבְכַּהּ:", "onk_en": "Sarah died in Kiryas Arba, which is Chevron, in the land of Canaan. Avraham came to eulogize Sarah and to weep for her.", "pj": "וּמִיתַת שָרָה בְּקִרְיַית אַרְבַּע הוּא חֶבְרוֹן בְּאַרְעָא דִכְנָעַן וְאָתָא אַבְרָהָם מִן טַוָור פּוּלְחָנָא וְאַשְׁכְּחָהּ דְמִיתַת וְיָתִיב לְמִסְפַּד לְשָרָה וּלְמִבְכְּיָיהּ", "pj_en": "And Sarah died in Kiryath Arba, which is Hebron. And Abraham came from the mountain of worship, and found that she was dead; and he sat to mourn for Sarah, and to weep for her.", "tj": "וּמִיתַת שָרָה בְּקִרְיַיתְהוֹן דְגוּבְרַיָא:", "tj_en": "And Sarah died in the city of the giants.", "rashi": "<b>בקרית ארבע.<\/b> עַל שֵׁם אַרְבַּע עֲנָקִים שֶׁהָיוּ שָׁם, אֲחִימָן שֵׁשַׁי וְתַלְמַי וַאֲבִיהֶם. דָּ\"אַ עַל שֵׁם אַרְבַּע זוּגוֹת שֶׁנִקְבְּרוּ שָׁם אִישׁ וְאִשְׁתּוֹ, אָדָם וְחַוָּה, אַבְרָהָם וְשָׂרָה, יִצְחָק וְרִבְקָה, יַעֲקֹב וְלֵאָה (בראשית רבה):<br><br><b>ויבא אברהם.<\/b> מִבְּאֵר שֶׁבַע:<br><br><b>לספוד לשרה ולבכתה.<\/b> וְנִסְמְכָה מִיתַת שָׂרָה לַעֲקֵדַת יִצְחָק לְפִי שֶׁעַל יְדֵי בְּשׂוֹרַת הָעֲקֵדָה, שֶׁנִּזְדַּמֵּן בְּנָהּ לִשְׁחִיטָה וְכִמְעַט שֶׁלֹּא נִשְׁחַט, פָּרְחָה נִשְׁמָתָהּ מִמֶּנָּה וּמֵתָה:", "rashi_en": "בקרית ארבע literally, the city of the Four, and it was so called because of the four giants who lived there: Ahiman, Sheshai, Talmai and their father (Numbers 13:22). Another explanation is that it was so called because of the four couples who were buried there, man and wife — Adam and Eve, Abraham and Sarah, Isaac and Rebecca, Jacob and Leah (Genesis Rabbah 58:4).<br><br>ויבא אברהם AND ABRAHAM CAME from Beer-Sheba<br><br>לספוד לשרה ולבכותה TO BEWAIL SARAH AND TO WEEP FOR HER — The narrative of the death of Sarah follows immediately on that of the Binding of Isaac, because through the announcement of the Binding — that her son had been made ready for sacrifice and had almost been sacrificed — she received a great shock (literally, her soul flew from her) and she died (Pirkei DeRabbi Eliezer 32). "}, {"ch": 23, "v": 3, "aliyah": 1, "heb": "וַיָּ֙קׇם֙ אַבְרָהָ֔ם מֵעַ֖ל פְּנֵ֣י מֵת֑וֹ וַיְדַבֵּ֥ר אֶל־בְּנֵי־חֵ֖ת לֵאמֹֽר׃", "onk": "וְקָם אַבְרָהָם מֵעַל אַפֵּי מִיתֵיהּ וּמַלֵּל עִם בְּנֵי חִתָּאָה לְמֵימָר:", "onk_en": "Avraham rose from the presence of his dead, and spoke to the sons of Cheis saying,", "pj": "וְקָם אַבְרָהָם מִן מַחֲמֵי אַפִּין עַל מֵיתֵיהּ וּמַלֵיל עִם בְּנֵי חִתָּאָה לְמֵימַר", "pj_en": "And Abraham rose up from the sight of the face of his dead, and spake with the sons of Hittah, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 4, "aliyah": 1, "heb": "גֵּר־וְתוֹשָׁ֥ב אָנֹכִ֖י עִמָּכֶ֑ם תְּנ֨וּ לִ֤י אֲחֻזַּת־קֶ֙בֶר֙ עִמָּכֶ֔ם וְאֶקְבְּרָ֥ה מֵתִ֖י מִלְּפָנָֽי׃", "onk": "דַּיָּר וְתוֹתַב אֲנָא עִמְּכוֹן הָבוּ לִי אַחְסָנַת קְבוּרָא עִמְּכוֹן וְאִקְבַּר מִיתִי מִן קֳדָמָי:", "onk_en": "I am a foreigner and a resident among you. Grant me the possession of a grave site with you, so that I may bury my dead from my presence.", "pj": "דַיָיר וְתוֹתָב אֲנָא עִמְכוֹן בְּבָעוּ זַבּוּנִי לִי אַחֲסָנַת קְבוּרְתָּא עִמְכוֹן וְאִיקְבַּר יַת מֵיתִי תַּמָן", "pj_en": "I am a sojourner and dweller with you; I pray sell me the inheritance of a sepulchre among you, and I will bury my dead there.", "tj": "", "tj_en": "", "rashi": "<b>גר ותושב אנכי עמכם.<\/b> גֵּר מֵאֶרֶץ אַחֶרֶת וְנִתְיַשַּׁבְתִּי עִמָּכֶם. וּמִדְרַשׁ אַגָּדָה אִם תִּרְצוּ הֲרֵינִי גֵּר, וְאִם לָאו אֶהְיֶה תּוֹשָׁב וְאֶטְּלֶנָּה מִן הַדִּין, שֶׁאָמַר לִי הַקָּבָּ\"ה לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ הַזֹּאת:<br><br><b>אחוזת קבר.<\/b> אֲחֻזַּת קַרְקַע לְבֵית הַקְּבָרוֹת:", "rashi_en": "גר ותושב אנכי עמכם I AM A STRANGER AND A SETTLER WITH YOU — A stranger having come from another land, but I have settled down amongst you. A Midrashic explanation is: if you agree to sell me the land then I will regard myself as a stranger and will pay for it, but if not, I shall claim it as a settler and will take it as my legal right, because the Holy One, blessed be He, said to me, (12:7) “Unto thy seed I give this land\" (Genesis Rabbah 58:6).<br><br>אחזת קבר A POSSESSION OF A BURYING PLACE — means possession of land to serve as a burying place. "}, {"ch": 23, "v": 5, "aliyah": 1, "heb": "וַיַּעֲנ֧וּ בְנֵי־חֵ֛ת אֶת־אַבְרָהָ֖ם לֵאמֹ֥ר לֽוֹ׃", "onk": "וְאָתִיבוּ בְנֵי חִתָּאָה יָת אַבְרָהָם לְמֵימַר לֵיהּ:", "onk_en": "The sons of Cheis replied to Avraham saying to him,", "pj": "וְאָתִיבוּ בְּנֵי חִתָּאָה יַת אַבְרָהָם לְמֵימַר לֵיהּ", "pj_en": "And the sons of Hittah responded unto Abraham, saying to him,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 6, "aliyah": 1, "heb": "שְׁמָעֵ֣נוּ&thinsp;<b>׀<\/b> אֲדֹנִ֗י נְשִׂ֨יא אֱלֹהִ֤ים אַתָּה֙ בְּתוֹכֵ֔נוּ בְּמִבְחַ֣ר קְבָרֵ֔ינוּ קְבֹ֖ר אֶת־מֵתֶ֑ךָ אִ֣ישׁ מִמֶּ֔נּוּ אֶת־קִבְר֛וֹ לֹֽא־יִכְלֶ֥ה מִמְּךָ֖ מִקְּבֹ֥ר מֵתֶֽךָ׃", "onk": "<b>קַבֵּל<\/b> מִנָּנָא רִבּוֹנָ<b>נָא<\/b> <b>רַב קֳדָם יְיָ<\/b> אַתְּ בֵּינָנָא בִּשְׁפַר קִבְרָנָא קְבַר יָת מִיתָךְ אֶנַּשׁ מִנָּנָא יָת קִבְרֵיהּ לָא יִמְנַע מִנָּךְ מִלְּמִקְבַּר מִיתָךְ:", "onk_en": "Hear [<b>Accept<\/b>] us my [<b>our<\/b>] master, you are a prince of God [<b>you are respected before God<\/b>] in our midst. Bury your dead in the choicest of our grave sites. No man among us will deny his grave site from you to bury your dead.", "pj": "קַבֵּל מִנָנָא רוֹבָּנָנָא רַב קֳדָם יְיָ אַתְּ בֵּינָנָא בִּשְׁפַר קִיבְרָנָא קְבַר יַת מִיתָךְ אִינַשׁ מִינָנָא יַת קְבוּרְתֵּיהּ לָא יִמְנַע מִינָךְ בְּגִין דְלָא לְמִיקְבַּר מִיתָךְ", "pj_en": "Attend to us, our lord. Great before the Lord art thou among us, in the best of our sepulchres bury thy dead: there is not a man of us who will refuse thee his sepulchre, that thou mayest bury thy dead.", "tj": "", "tj_en": "", "rashi": "<b>לא יכלה.<\/b> לֹא יִמְנַע כְּמוֹ לֹא תִכְלָא רַחֲמֶיךָ (תהילים מ') וּכְמוֹ וַיִּכָּלֵא הַגֶּשֶׁם (בראשית ח'):", "rashi_en": "לא יכלה means will not withhold, just as (Psalms 40:12) “Thou wilt not withhold (תכלא) Thy mercies”, and (Genesis 8:2) “And the rain was restrained (ויכלא)."}, {"ch": 23, "v": 7, "aliyah": 1, "heb": "וַיָּ֧קׇם אַבְרָהָ֛ם וַיִּשְׁתַּ֥חוּ לְעַם־הָאָ֖רֶץ לִבְנֵי־חֵֽת׃", "onk": "וְקָם אַבְרָהָם וּסְגִיד לְעַמָּא דְאַרְעָא לִבְנֵי חִתָּאָה:", "onk_en": "Avraham rose and bowed to the people of the land, the sons of Cheis.", "pj": "וְקָם אַבְרָהָם וְגָחַן לְעַמָא דְאַרְעָא לִבְנֵי חִתָּאָה", "pj_en": "And Abraham rose and bowed to the people of the land, the sons of Hittah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 8, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר אִתָּ֖ם לֵאמֹ֑ר אִם־יֵ֣שׁ אֶֽת־נַפְשְׁכֶ֗ם לִקְבֹּ֤ר אֶת־מֵתִי֙ מִלְּפָנַ֔י שְׁמָע֕וּנִי וּפִגְעוּ־לִ֖י בְּעֶפְר֥וֹן בֶּן־צֹֽחַר׃", "onk": "וּמַלֵּיל עִמְּהוֹן לְמֵימָר אִם אִית <b>רַעֲוָא בְנַפְשְׁכוֹן<\/b> לְמִקְבַּר יָת מִיתִי מִן קֳדָמַי <b>קַבִּילוּ<\/b> מִנִּי וּבְעוּ לִי מִן עֶפְרוֹן בַּר צוֹחַר:", "onk_en": "Avraham spoke to them, saying, If it is really your will [<b>the will of your soul<\/b>] that I bury my dead from my presence, listen to [<b>accept<\/b>] me and intercede for me with Ephron, son of Tzochar.", "pj": "וּמַלֵיל עִמְהוֹן לְמֵימַר אִין אִית רְעוּ עִם נַפְשֵׁיכוֹן לְמִיקְבַּר יַת מֵיתִי מִן מֶחֱמֵי אַפַּיַי קַבְּלוּ מִינִי וּבְעוּ עָלַי קֳדָם עֶפְרוֹן בַּר צוֹחַר", "pj_en": "And he spake with them, saying, If it be with the consent of your mind that I bury my dead from before my face, receive of me, and intercede for me before Ephron bar Zochar", "tj": "", "tj_en": "", "rashi": "<b>נפשכם.<\/b> רְצוֹנְכֶם:<br><br><b>ופגעו לי.<\/b> לְשוֹן בַּקָּשָׁה כְּמוֹ: אַל תִּפְגְּעִי בִּי (רות א'):", "rashi_en": "נפשכם means YOUR WILL.<br><br>ופגעו לי — This phrase signifies entreaty, as (Ruth 1:16) “Do not entreat (תפגעי) me”. "}, {"ch": 23, "v": 9, "aliyah": 1, "heb": "וְיִתֶּן־לִ֗י אֶת־מְעָרַ֤ת הַמַּכְפֵּלָה֙ אֲשֶׁר־ל֔וֹ אֲשֶׁ֖ר בִּקְצֵ֣ה שָׂדֵ֑הוּ בְּכֶ֨סֶף מָלֵ֜א יִתְּנֶ֥נָּה לִּ֛י בְּתוֹכְכֶ֖ם לַאֲחֻזַּת־קָֽבֶר׃", "onk": "וְיִתֶּן לִי יָת מְעָרַת כָּפֶלְתָּא דִּי לֵיהּ דִּי בִּסְטַר חַקְלֵיהּ בְּכַסְפָּא שְׁלִים יִתְּנִינַהּ לִי בֵּינֵיכוֹן לְאַחֲסָנַת קְבוּרָא:", "onk_en": "Let him give me the Machpeilah [double] cave, which belongs to him, which is at the end of his field. Let him give [sell] it to me for its full value, as a grave site among you.", "pj": "וְיִזְבּוּן לִי יַת מְעָרַת כָּפֵילְתָּא דִילֵיהּ דְמִתְבַּנְיָא בִּסְטַר חַקְלֵיהּ בִּכְסַף שְׁלִים יִתְּנִינָהּ לִי בֵּינֵיכוֹן לְאַחְסָנַת קְבוּרְתָּא", "pj_en": "that he sell me his double cave which is built in the side of his field, for the full price in silver let him give it me among you, for an inheritance of sepulture.", "tj": "", "tj_en": "", "rashi": "<b>המכפלה.<\/b> בַּית וַעֲלִיָּה עַל גַּבָּיו. דָּ\"אַ שֶׁכְּפוּלָה בְּזוּגוֹת (עירובין נ\"ג):<br><br><b>בכסף מלא.<\/b> שָׁלֵם, כָּל שָׁוְיָהּ; וְכֵן דָּוִד אָמַר לַאֲרַוְנָה בְּכֶסֶף מָלֵא (דברי הימים א כ\"א):", "rashi_en": "המכפלה MACHPELAH (the root, כפל, means double) — it had a lower and an upper cavern. Another explanation of why it was so called is, because it has the characteristic of being doubled on account of the couples who are buried there (see Rashi in verse 2) (Eruvin 53a).<br><br>בכסף מלא FOR ITS FULL VALUE IN SILVER — מלא means שלם so that the phrase means all that it is worth. Thus, too, did David say to Ornan, (1 Chronicles 21:22) “for full money”. "}, {"ch": 23, "v": 10, "aliyah": 1, "heb": "וְעֶפְר֥וֹן יֹשֵׁ֖ב בְּת֣וֹךְ בְּנֵי־חֵ֑ת וַיַּ֩עַן֩ עֶפְר֨וֹן הַחִתִּ֤י אֶת־אַבְרָהָם֙ בְּאׇזְנֵ֣י בְנֵי־חֵ֔ת לְכֹ֛ל בָּאֵ֥י שַֽׁעַר־עִיר֖וֹ לֵאמֹֽר׃", "onk": "וְעֶפְרוֹן יָתֵב בְּגוֹ בְּנֵי חִתָּאָה וְאָתֵיב עֶפְרוֹן חִתָּאָה יָת אַבְרָהָם <b>קֳדָם<\/b> בְּנֵי חִתָּאָה לְכָל עָלֵי תְּרַע קַרְתֵּיהּ לְמֵימָר:", "onk_en": "Ephron lived in the midst of the sons of Cheis, Ephron the Chitite replied to Avraham in the ears [audience] of [<b>before<\/b>] the sons of Cheis, for all who came to the city gate, saying,", "pj": "וְעֶפְרוֹן יָתֵיב בְּגוֹ בְּנֵי חִיתָּאָה וְאָתֵיב עֶפְרוֹן חִיתָּאָה יַת אַבְרָהָם בְּאַנְפֵּי בְּנֵי חִיתָּאָה לְכָל עָלֵי תְרַע קַרְתֵּיהּ לְמֵימַר", "pj_en": "But Ephron the Hittite answered Abraham in the presence of the sons of Hittah, of all who entered the gate of his city, saying,", "tj": "", "tj_en": "", "rashi": "<b>ועפרון ישב.<\/b> כְּתִיב חָסֵר, אוֹתוֹ הַיּוֹם מִנּוּהוּ שׁוֹטֵר עֲלֵיהֶם; מִפְּנֵי חֲשִׁיבוּתוֹ שֶׁל אַבְרָהָם שֶׁהָיָה צָרִיךְ לוֹ, עָלָה לִגְדֻלָּה:<br><br><b>לכל באי שער עירו.<\/b> שֶׁכֻּלָּן בָּטְלוּ מִמְּלָאכְתָּן וּבָאוּ לִגְמֹל חֶסֶד לְשָׂרָה:", "rashi_en": "ועפרון ישב The verb is written without a ו so that it may be read ישב he sat, thus indicating that on that very day they had appointed him (Ephron) to be an officer over them. Because of the high standing of Abraham who needed to negotiate with him, he was elevated to a dignified position (so that Abraham whom they esteemed as a great prince might have to negotiate with an equal and not with an inferior person (Genesis Rabbah 58:7). <br><br>לכל באי שער עירו OF ALL THAT CAME IN AT THE GATE OF HIS CITY — for they all left their work and came to pay their last respect to Sarah (Genesis Rabbah 58:7). "}, {"ch": 23, "v": 11, "aliyah": 1, "heb": "לֹֽא־אֲדֹנִ֣י שְׁמָעֵ֔נִי הַשָּׂדֶה֙ נָתַ֣תִּי לָ֔ךְ וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ לְךָ֣ נְתַתִּ֑יהָ לְעֵינֵ֧י בְנֵי־עַמִּ֛י נְתַתִּ֥יהָ לָּ֖ךְ קְבֹ֥ר מֵתֶֽךָ׃", "onk": "לָא רִבּוֹנִי <b>קַבֵּיל<\/b> מִנִּי חַקְלָא יְהָבִית לָךְ וּמְעַרְתָּא דִּי בֵיהּ לָךְ יְהָבִיתַהּ לְעֵינֵי בְנֵי עַמִּי יְהָבִיתַהּ לָךְ קְבַר מִיתָךְ:", "onk_en": "No, my master, hear [<b>accept<\/b>] me: I have given you the field, and the cave that is in it, I have [also] given to you. Before the eyes of the sons of my people I have given it to you. Bury your dead.", "pj": "בְּבָעוּ רִבּוֹנִי קַבֵּיל מִינִי חַקְלָא יְהָבִית לָךְ וּמְעַרְתָּא דְבֵיהּ לָךְ יְהַבְתָּהּ לְמַתְּנָא בְּאַנְפֵּי בְּנֵי עַמִי יְהַבְתָּהּ לָךְ אִיזֵל קְבַר מִיתָךְ", "pj_en": "My lord, listen to me: the field I give thee, and the cave which is in it, to thee I give it, as a gift before the sons of my people I give it to thee; go, bury thy dead.", "tj": "", "tj_en": "", "rashi": "<b>לא אדני.<\/b> לֹא תִּקְנֶה אוֹתָהּ בְּדָמִים:<br><br><b>נתתי לך.<\/b> הֲרֵי הוּא כְּמוֹ שֶׁנְּתַתִּיהָ לְךָ:", "rashi_en": "לא אדני NAY, MY LORD — You are not to buy it with money.<br><br>נתתי לך I HAVE GIVEN IT TO THEE (a perfect tense) — See, it is as though I have already given it to you. "}, {"ch": 23, "v": 12, "aliyah": 1, "heb": "וַיִּשְׁתַּ֙חוּ֙ אַבְרָהָ֔ם לִפְנֵ֖י עַ֥ם הָאָֽרֶץ׃", "onk": "וּסְגִיד אַבְרָהָם קֳדָם עַמָּא דְאַרְעָא:", "onk_en": "Avraham bowed to the people of the land.", "pj": "וְגָחַן לֵיהּ אַבְרָהָם בְּאַנְפֵּי בְּנֵי חִיתָּאָה", "pj_en": "And Abraham bowed before the sons of Hittah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 13, "aliyah": 1, "heb": "וַיְדַבֵּ֨ר אֶל־עֶפְר֜וֹן בְּאׇזְנֵ֤י עַם־הָאָ֙רֶץ֙ לֵאמֹ֔ר אַ֛ךְ אִם־אַתָּ֥ה ל֖וּ שְׁמָעֵ֑נִי נָתַ֜תִּי כֶּ֤סֶף הַשָּׂדֶה֙ קַ֣ח מִמֶּ֔נִּי וְאֶקְבְּרָ֥ה אֶת־מֵתִ֖י שָֽׁמָּה׃", "onk": "וּמַלֵּיל עִם עֶפְרוֹן <b>קֳדָם<\/b> עַמָּא דְאַרְעָא לְמֵימַר בְּרַם <b>אִם אַתְּ עָבֵד לִי טִיבוּ קַבֵּל מִנִּי<\/b> אֶתֵּן כַּסְפָּא דְמֵי חַקְלָא סַב מִנִּי וְאֶקְבַּר יָת מִיתִי תַּמָּן:", "onk_en": "He spoke to Ephron in the ears [audience] of [<b>before<\/b>] the people of the land saying, If you will only listen to me. [<b>If you will do a kindness for me, accept me.<\/b>] I have given the money for the [<b>value of the<\/b>] field. Take it from me and I will bury my dead there.", "pj": "וּמַלֵיל עִם עֶפְרוֹן בְּאַנְפֵּי עַמָא דְאַרְעָא לְמֵימַר בְּרַם אִם אַנְתְּ צָבֵי לְמֶעֱבַד לִי טִיבוּ קַבֵּל מִינִי אֶתֵּן כַּסְפָּא דְמֵי חַקְלָא סַב מִנִי וְאֶקְבּוֹר יַת מִיתִי תַּמָן", "pj_en": "And he spake with Ephron before the people of the land, saying, Nevertheless, if thou art willing to do me a favour, hear me: I will give thee in silver the price of the field; take (it) of me, and I will bury my dead there. And", "tj": "", "tj_en": "", "rashi": "<b>אך אם אתה לו שמעני.<\/b> אַתָּה אוֹמֵר לִי לִשְׁמֹעַ לְךָ וְלִקַּח בְּחִנָּם, אֲנִי אִי אֶפְשִׁי בְּכָךְ:<br><br><b>אך אם אתה לו שמעני.<\/b> הַלְוַאי וְתִשְׁמָעֵנִי:<br><br><b>נתתי.<\/b> דני\"ש בלע\"ז, מוּכָן הוּא אֶצְלִי, וְהַלְוַאי נָתַתִּי לְךָ כְּבָר:", "rashi_en": "אך אם אתה לו שמעני BUT IF THOU WOULDST ONLY HEAR ME — You tell me to listen to you (verse 11) and to accept it without payment. I do not desire this: <br><br>BUT IF THOU WOULDST ONLY HEAR ME!—i.e. I only wish that you would listen to me and do as I ask.<br><br>נתתי I GIVE (perfect with present sense) old French donne; English I give. I have the money ready and I only wish that I had already given it to you."}, {"ch": 23, "v": 14, "aliyah": 1, "heb": "וַיַּ֧עַן עֶפְר֛וֹן אֶת־אַבְרָהָ֖ם לֵאמֹ֥ר לֽוֹ׃", "onk": "וְאָתֵיב עֶפְרוֹן יָת אַבְרָהָם לְמֵימַר לֵיהּ:", "onk_en": "Ephron replied to Avraham, saying to him,", "pj": "וְאָתִיב עֶפְרוֹן יַת אַבְרָהָם לְמֵימַר לֵיהּ", "pj_en": "Ephron answered Abraham, saying to him,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 15, "aliyah": 1, "heb": "אֲדֹנִ֣י שְׁמָעֵ֔נִי אֶ֩רֶץ֩ אַרְבַּ֨ע מֵאֹ֧ת שֶֽׁקֶל־כֶּ֛סֶף בֵּינִ֥י וּבֵֽינְךָ֖ מַה־הִ֑וא וְאֶת־מֵתְךָ֖ קְבֹֽר׃", "onk": "רִבּוֹנִי <b>קַבֵּל<\/b> מִנִּי אַרְעָא שַׁוְיָא אַרְבַּע מְאָה סִלְעִין דִּכְסַף בֵּינָא וּבֵינָךְ מַה הִיא וְיָת מִיתָךְ קְבַר:", "onk_en": "My master, hear [<b>accept<\/b>] me. A land [worth] four hundred silver <i>shekel<\/i>—what is that between me and you? Bury your dead.", "pj": "רִבּוֹנִי קַבֵּל מִנִי אֲרַע דְטִימִין דִילֵהּ אַרְבַּע מְאָה סַלְעִין דִכְסַף בֵּינָא וּבֵינָךְ מַה הוּא וְיַת מִיתָךְ קְבַר", "pj_en": "My lord, hear me: the land, as to its price, would be four hundred sileen of silver; between me and thee what is that? Bury thy dead.", "tj": "", "tj_en": "", "rashi": "<b>ביני ובינך.<\/b> בֵּין שְׁנֵי אוֹהֲבִים כָּמוֹנוּ מַה הִיא חֲשׁוּבָה לִכְלוּם, אֶלָּא הַנַּח אֶת הַמֶּכֶר וְאֶת מֵתְךָ קְבֹר (בראשית רבה):", "rashi_en": "ביני ובינך BETWEEN ME AND THEE — Between two such friends as we are, of what importance is that? Nothing at all! Leave business alone and bury your dead! "}, {"ch": 23, "v": 16, "aliyah": 1, "heb": "וַיִּשְׁמַ֣ע אַבְרָהָם֮ אֶל־עֶפְרוֹן֒ וַיִּשְׁקֹ֤ל אַבְרָהָם֙ לְעֶפְרֹ֔ן אֶת־הַכֶּ֕סֶף אֲשֶׁ֥ר דִּבֶּ֖ר בְּאׇזְנֵ֣י בְנֵי־חֵ֑ת אַרְבַּ֤ע מֵאוֹת֙ שֶׁ֣קֶל כֶּ֔סֶף עֹבֵ֖ר לַסֹּחֵֽר׃", "onk": "<b>וְקַבֵּל<\/b> אַבְרָהָם מִן עֶפְרוֹן וּתְקַל אַבְרָהָם לְעֶפְרוֹן יָת כַּסְפָּא דְּמַלֵּיל <b>קֳדָם<\/b> בְּנֵי חִתָּאָה אַרְבַּע מְאָה סִלְעִין דִּכְסַף <b>מִתְקַבֵּל סְחוֹרָא<\/b> (<small>נ\"י<\/small> דְּמִתְקַבֵּל סְחוֹרָתָא) <b>בְּכָל מְדִינְתָּא<\/b>:", "onk_en": "Avraham listened to [<b>accepted<\/b>] Ephron, and Avraham weighed out for Ephron the silver that he spoke of in the hearing of [<b>before<\/b>] the sons of Cheis, four hundred silver shekel, negotiable currency [<b>which are accepted by merchants in every city<\/b>].", "pj": "וְקַבֵּל אַבְרָהָם מִן עֶפְרוֹן וּתְקַל אַבְרָהָם לְעֶפְרוֹן יַת כַּסְפָּא דְמַלֵיל בְּאַנְפֵּיהּ בְּנֵי חִתָּאָה אַרְבַּע מְאָה סִלְעִין דִכְסַף טַב עָבְרִין בְּכָל פְּתוֹר וּמִתְקַבְּלִין בְּכָל פְּרַקְמַטְיָא", "pj_en": "And Abraham hearkened unto Ephron, and Abraham weighed to Ephron the silver which he had named before the sons of Hittah, four hundred sileen of silver, good, passing at every table, and receivable in all transactions.", "tj": "אַרְבַּע מְאָה סַלְעִין דִכְסַף עָבְרִין לְכָל פְּתוֹר וּמִתְקַבְּלִין בְּכָל פְּרַקְמַטְיָא:", "tj_en": "Four hundred sileen of silver, passing at every table, and receivable in all transactions.", "rashi": "<b>וישקל אברהם לעפרן.<\/b> חָסֵר וָי\"ו; לְפִי שֶׁאָמַר הַרְבֵּה, וַאֲפִלּוּ מְעַט לֹא עָשָׂה (בבא מציעא פ\"ז), שֶׁנָּטַל מִמֶּנוּ שְׁקָלִים גְּדוֹלִים שֶׁהֵן קַנְטָרִין, שֶׁנֶּאֱמַר עֹבֵר לַסֹּחֵר, שֶׁמִּתְקַבְּלִים בְּשֶׁקֶל בְּכָל מָקוֹם (שם ובכורות נ'), וְיֵשׁ מָקוֹם שֶׁשִּׁקְלֵיהֶן גְּדוֹלִים, שֶׁהֵן קַנְטָרִין צנטינא\"רש בלע\"ז:", "rashi_en": "וישקל אברהם לעפרן AND ABRAHAM WEIGHED TO EPHRON [THE SILVER] — The name Ephron is written defectively (without the ו) to indicate that there was something missing in Ephron viz, sincerity — because he promised much but did not do even the very least (Bava Metzia 87a): He took from him big Shekels, viz., centenaria (worth a full 100 smaller units) as it is said, “money current with the merchant” which means, such coins as were everywhere accepted as worth a full Shekel — for there are places where their Shekels are of large size, centenaria; old French Centenars (cf. Ruth R. 7). "}, {"ch": 23, "v": 17, "aliyah": 2, "heb": "וַיָּ֣קׇם&thinsp;<b>׀<\/b> שְׂדֵ֣ה עֶפְר֗וֹן אֲשֶׁר֙ בַּמַּכְפֵּלָ֔ה אֲשֶׁ֖ר לִפְנֵ֣י מַמְרֵ֑א הַשָּׂדֶה֙ וְהַמְּעָרָ֣ה אֲשֶׁר־בּ֔וֹ וְכׇל־הָעֵץ֙ אֲשֶׁ֣ר בַּשָּׂדֶ֔ה אֲשֶׁ֥ר בְּכׇל־גְּבֻל֖וֹ סָבִֽיב׃", "onk": "וְקָם חֲקַל עֶפְרוֹן דִּי בְּכָפֶלְתָּא דִּי קֳדָם מַמְרֵא חַקְלָא וּמְעַרְתָּא דִּי בֵיהּ וְכָל אִילָנֵי דִּי בְחַקְלָא דִּי בְכָל תְּחוּמֵיהּ סְחוֹר סְחוֹר:", "onk_en": "The field of Ephron was established [as Avraham’s possession], [the field] which was in Machpeilah, facing Mamrei; [this included] the field, the cave that was in it, and all the trees that were in the field that were in the entire circumference of its boundaries.", "pj": "וְקָם זַבִּין חֲקַל עֶפְרוֹן דִי בְכָפֶלְתָּא דִקְדָם מַמְרֵא חַקְלָא וּמְעַרְתָּא דְבֵיהּ וְכָל אִילָנָא דִבְחַקְלָא דִבְכָל תְּחוּמֵיהּ חֲזוֹר חֲזוֹר", "pj_en": "And he confirmed the purchase of the field of Ephron, in which (was) the double (cave) which is before Mamre, The field, and the cave that is therein, and all the trees that were in the field, in all the boundaries thereof round about,", "tj": "", "tj_en": "", "rashi": "<b>ויקם שדה עפרון.<\/b> תְּקוּמָה הָיְתָה לוֹ, שֶׁיָּצָא מִיַּד הֶדְיוֹט לְיַד מֶלֶךְ; וּפְשׁוּטוֹ שֶׁל מִקְרָא וַיָּקָם הַשָּׂדֶה וְהַמְּעָרָה אֲשֶׁר בּוֹ וְכָל הָעֵץ לְאַבְרָהָם לְמִקְנָה וגו':", "rashi_en": "ויקם שדה עפרון AND THE FIELD OF EPHRON WAS MADE SURE (literally, it rose) — It received a rise in importance because it passed from the possession of a commoner (הדיוט an ordinary person) into the possession of a king (Genesis Rabbah 58:8). But the real meaning of the verse is: The field and the cave that was therein and all the trees … became secured to Abraham as a possession etc. (i. e. verse 17 is an incomplete sentence and must be read together with verse 18, thus: ויקם השדה וגו… לאברהם למקנה —The field etc. became secured to Abraham as a possession). "}, {"ch": 23, "v": 18, "aliyah": 2, "heb": "לְאַבְרָהָ֥ם לְמִקְנָ֖ה לְעֵינֵ֣י בְנֵי־חֵ֑ת בְּכֹ֖ל בָּאֵ֥י שַֽׁעַר־עִירֽוֹ׃", "onk": "לְאַבְרָהָם לִזְבִינוֹהִי לְעֵינֵי בְּנֵי חִתָּאָה בְּכָל עָלֵי תְּרַע קַרְתֵּיהּ:", "onk_en": "This became Avraham’s [possession] through a purchase before the eyes of the sons of Cheis, all who had come to the gate of his city.", "pj": "לְאַבְרָהָם לִזְבִינוֹי בְּאַנְפֵּי בְּנֵי חִתָּאָה לְכָל עָלֵי תְּרַע קַרְתֵּיהּ", "pj_en": "--Unto Abraham, for a purchased possession, in the presence of the sons of Hittah, (even) of all who entered in at the gate of the city.", "tj": "", "tj_en": "", "rashi": "<b>בכל באי שער עירו.<\/b> בְּקֶרֶב כֻּלָּם וּבְמַעֲמַד כֻּלָּם הִקְנָהוּ לוֹ:", "rashi_en": "בכל באי שער עירו BEFORE ALL THAT CAME IN AT THE GATE OF HIS CITY — In the midst of all them, and with all of them standing by he gave him legal possession of it."}, {"ch": 23, "v": 19, "aliyah": 2, "heb": "וְאַחֲרֵי־כֵן֩ קָבַ֨ר אַבְרָהָ֜ם אֶת־שָׂרָ֣ה אִשְׁתּ֗וֹ אֶל־מְעָרַ֞ת שְׂדֵ֧ה הַמַּכְפֵּלָ֛ה עַל־פְּנֵ֥י מַמְרֵ֖א הִ֣וא חֶבְר֑וֹן בְּאֶ֖רֶץ כְּנָֽעַן׃", "onk": "וּבָתַר כֵּן קְבַר אַבְרָהָם יָת שָׂרָה אִתְּתֵיהּ בִּמְעָרַת חֲקַל כָּפֶלְתָּא עַל אַפֵּי מַמְרֵא הִיא חֶבְרוֹן בְּאַרְעָא דִּכְנָעַן:", "onk_en": "After that Avraham buried his wife Sarah in the cave of the Machpeilah field, which faces Mamrei, which is Chevron, in the land of Canaan.", "pj": "וּמִן בָּתַר כְּדֵין קְבַר אַבְרָהָם יַת שָרָה אִנְתְּתֵיהּ לִמְעָרַת חֲקֵיל כָּפֶלְתָּא דְעַל אַנְפֵּי מַמְרֵא הוּא חֶבְרוֹן בְּאַרְעָא דִכְנָעַן", "pj_en": "And afterwards Abraham buried Sarah his wife in the cave of the field Kapheilta which is before Mamre, that is, Hebron in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 20, "aliyah": 2, "heb": "וַיָּ֨קׇם הַשָּׂדֶ֜ה וְהַמְּעָרָ֧ה אֲשֶׁר־בּ֛וֹ לְאַבְרָהָ֖ם לַאֲחֻזַּת־קָ֑בֶר מֵאֵ֖ת בְּנֵי־חֵֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְקָם חַקְלָא וּמְעַרְתָּא דִּי בֵיהּ לְאַבְרָהָם לְאַחֲסָנַת קְבוּרָא מִן בְּנֵי חִתָּאָה:", "onk_en": "The field and its cave was established as Avraham’s possession as a gravesite, by the sons of Cheis.", "pj": "וְקָם חַקְלָא וּמְעָרְתָּא דְבֵיהּ לְאַבְרָהָם לְאַחֲסָנַת קְבוּרְתָּא מִן בְּנֵי חִיתָּאָה", "pj_en": "And the field and the cave therein were confirmed unto Abraham for an inheritance of sepulture from the sons of Hittah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 1, "aliyah": 2, "heb": "וְאַבְרָהָ֣ם זָקֵ֔ן בָּ֖א בַּיָּמִ֑ים וַֽיהֹוָ֛ה בֵּרַ֥ךְ אֶת־אַבְרָהָ֖ם בַּכֹּֽל׃", "onk": "וְאַבְרָהָם סִיב עָל בְּיוֹמִין וַייָ בְּרִיךְ יָת אַבְרָהָם בְּכֹלָּא:", "onk_en": "Avraham was old, advanced in days [years], and Adonoy had blessed Avraham in all things.", "pj": "וְאַבְרָהָם סִיב עַל בְּיוֹמִין וּמֵימְרָא דַיְיָ בְּרִיךְ יַת אַבְרָהָם בְּכָל מִינֵי בִּרְכָתָא", "pj_en": "And Abraham was old with days, and the Word of the Lord had blessed Abraham with every kind of blessing.", "tj": "", "tj_en": "", "rashi": "<b>ברך את אברהם בכל.<\/b> בַּכֹּל עוֹלֶה בְּגִימַטְרִיָּא בֵּן, וּמֵאַחַר שֶׁהָיָה לוֹ בֵּן הָיָה צָרִיךְ לְהַשִּׂיאוֹ אִשָּׁה:", "rashi_en": "ברך את אברהם בכל [THE LORD HAD] BLESSED ABRAHAM IN ALL THINGS — The numerical value of the word בכל is equal to that of בן (a son) — suggesting that God had blessed Abraham with a son and since he had a son he had to find him a wife."}, {"ch": 24, "v": 2, "aliyah": 2, "heb": "וַיֹּ֣אמֶר אַבְרָהָ֗ם אֶל־עַבְדּוֹ֙ זְקַ֣ן בֵּית֔וֹ הַמֹּשֵׁ֖ל בְּכׇל־אֲשֶׁר־ל֑וֹ שִֽׂים־נָ֥א יָדְךָ֖ תַּ֥חַת יְרֵכִֽי׃", "onk": "וַאֲמַר אַבְרָהָם לְעַבְדֵיהּ סָבָא דְבֵיתֵיהּ דְּשַׁלִּיט בְּכָל דִּי לֵיהּ שַׁוִי כְעַן יְדָךְ תְּחוֹת יַרְכִּי:", "onk_en": "Avraham said to his servant, the senior [servant] of his household, who was in charge of all that he owned, Place your hand under my thigh.", "pj": "וַאֲמַר אַבְרָהָם לֶאֱלִיעֶזֶר עַבְדֵיהּ סָבָא דְבֵיתֵיהּ דְשַׁלִיט בְּכָל אַפּוֹתִּיקֵי דִלֵיהּ שַׁוִי כְדוֹן יְדָךְ בִּגְזֵירַת מְהוּלְתִּי", "pj_en": "And Abraham said to Eliezer his servant, the senior of his house, who had rule over all his property, Put now thy hand upon the section of my circumcision.", "tj": "וַאֲמַר אַבְרָהָם לְעַבְדֵיהּ שַׁלִיטָא דַהֲוָה שַׁלִיט בְּכָל מַה דִידֵיהּ שַׁוֵי כְעַן יְדָךְ תְּחוֹת יְרָךְ קְיָמִי:", "tj_en": "And Abraham said to his servant, the ruler who had rule over all that was his, Put now thy hand under the thigh of my covenant.", "rashi": "<b>זקן ביתו.<\/b> לְפִי שֶׁהוּא דָּבוּק נָקוּד זְקַן:<br><br><b>תחת ירכי.<\/b> לְפִי שֶׁהַנִּשְׁבָּע צָרִיךְ שֶׁיִּטֹּל בְּיָדוֹ חֵפֶץ שֶׁל מִצְוָה, כְּגוֹן סֵפֶר תּוֹרָה אוֹ תְּפִלִּין (שבועות ל\"ח), וְהַמִּילָה הָיְתָה מִצְוָה רִאשׁוֹנָה לוֹ וּבָאָה לוֹ עַל יְדֵי צַעַר וְהָיְתָה חֲבִיבָה עָלָיו וּנְטָלָהּ:", "rashi_en": "זקן ביתו THE ELDER OF HIS HOUSE — Because the noun is in the construct state the ק is punctuated with a Patach.<br><br>תחת ירכי UNDER MY THIGH — because whoever takes an oath must take in his hand some sacred object. such as a Scroll of the Law or Tefillin (Shevuot 38b). As circumcision was the first commandment given to him and became his only through much pain it was consequently dear to him and therefore he selected this as the object upon which to take the oath (Genesis Rabbah 59:8). "}, {"ch": 24, "v": 3, "aliyah": 2, "heb": "וְאַשְׁבִּ֣יעֲךָ֔ בַּֽיהֹוָה֙ אֱלֹהֵ֣י הַשָּׁמַ֔יִם וֵֽאלֹהֵ֖י הָאָ֑רֶץ אֲשֶׁ֨ר לֹֽא־תִקַּ֤ח אִשָּׁה֙ לִבְנִ֔י מִבְּנוֹת֙ הַֽכְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יוֹשֵׁ֥ב בְּקִרְבּֽוֹ׃", "onk": "וַאֲקַיֵּם עֲלָךְ <b>בְּמֵימְרָא<\/b> דַיְיָ אֱלָהָא דִשְׁמַיָּא וֵאלָהָא דְאַרְעָא דְּלָא תִסַּב אִתְּתָא לִבְרִי מִבְּנַת כְּנַעֲנָאֵי דִּי אֲנָא יָתֵב בֵּינֵיהוֹן:", "onk_en": "I will have you swear by [<b>the Word of<\/b>] Adonoy, God of heaven and God of earth, that you will not take a wife for my son from the daughters of the Canaanites, among whom I live.", "pj": "וְאוֹמִינָךְ בְּשׁוּם מֵימְרָא דַיְיָ אֱלָהָא דְמוֹתְבֵיהּ בִּשְׁמֵי מְרוֹמָא הוּא אֱלָהָא דְשׁוּלְטָנֵיהּ עַל אַרְעָא דִי לָא תִיסַב אִיתָא לִבְרִי מִבְּנַתְהוֹן דִכְנַעֲנָאֵי דִי אֲנָא יָתִיב בֵּינֵיהוֹן", "pj_en": "And swear to me in the name of the Word of the Lord God, whose habitation is in heaven on high, the God whose dominion is over the earth, that thou wilt not take a wife for my son from the daughters of the Kenaanites among whom I dwell;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 4, "aliyah": 2, "heb": "כִּ֧י אֶל־אַרְצִ֛י וְאֶל־מוֹלַדְתִּ֖י תֵּלֵ֑ךְ וְלָקַחְתָּ֥ אִשָּׁ֖ה לִבְנִ֥י לְיִצְחָֽק׃", "onk": "אֱלָהֵין לְאַרְעִי וּלְיַלָּדוּתִי תֵּיזִיל וְתִסַּב אִתְּתָא לִבְרִי לְיִצְחָק:", "onk_en": "Instead, to my [native] land, to my birthplace, shall you go, and take a wife for my son, for Yitzchok,", "pj": "אֱלָהֵין לְאַרְעִי וּלְבֵית גְנִיסָתִי תֵּיזֵיל וְתִסַב אִתְּתָא לִבְרִי יִצְחָק", "pj_en": "but that thou wilt go to the land and the house of my kindred, and take a wife for my son, for Izhak.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 5, "aliyah": 2, "heb": "וַיֹּ֤אמֶר אֵלָיו֙ הָעֶ֔בֶד אוּלַי֙ לֹא־תֹאבֶ֣ה הָֽאִשָּׁ֔ה לָלֶ֥כֶת אַחֲרַ֖י אֶל־הָאָ֣רֶץ הַזֹּ֑את הֶֽהָשֵׁ֤ב אָשִׁיב֙ אֶת־בִּנְךָ֔ אֶל־הָאָ֖רֶץ אֲשֶׁר־יָצָ֥אתָ מִשָּֽׁם׃", "onk": "וַאֲמַר לֵיהּ עַבְדָא מָאִים לָא תֵיבֵי אִתְּתָא לְמֵיתֵי בַתְרַי לְאַרְעָא הָדָא הַאֲתָבָא אָתֵיב יָת בְּרָךְ לְאַרְעָא דִּי נְפַקְתָּא מִתַּמָּן:", "onk_en": "The servant said to him, Perhaps the woman will not want to come back with me to this land? Shall I bring your son back to the land from where you came?", "pj": "וַאֲמַר לֵיהּ עַבְדָא מָאִים לֵית צְבוּת אִתְּתָא לְמֵיתֵי בַּתְרַיי לְאַרְעָא הָדָא הַאֲתָבָא אָתֵיב יַת בְּרָךְ לְאַרְעָא דִי נְפַקְתָּא מִתַּמָן", "pj_en": "And the domestic said to him, suppose the woman may not be willing to come after me to this land; shall I, returning make thy son return to the land from whence thou camest?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 6, "aliyah": 2, "heb": "וַיֹּ֥אמֶר אֵלָ֖יו אַבְרָהָ֑ם הִשָּׁ֣מֶר לְךָ֔ פֶּן־תָּשִׁ֥יב אֶת־בְּנִ֖י שָֽׁמָּה׃", "onk": "וַאֲמַר לֵיהּ אַבְרָהָם אִסְתַּמַּר לָךְ דִּילְמָא תָתֵיב יָת בְּרִי לְתַמָּן:", "onk_en": "Avraham said to him, Take care, not to bring my son back there.", "pj": "וַאֲמַר לֵיהּ אַבְרָהָם אִסְתַּמַר לָךְ דִילְמָא תָתֵיב יַת בְּרִי לְתַמָן", "pj_en": "And Abraham said to him, Beware, lest thou make my son return thither!", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 7, "aliyah": 2, "heb": "יְהֹוָ֣ה&thinsp;<b>׀<\/b> אֱלֹהֵ֣י הַשָּׁמַ֗יִם אֲשֶׁ֨ר לְקָחַ֜נִי מִבֵּ֣ית אָבִי֮ וּמֵאֶ֣רֶץ מֽוֹלַדְתִּי֒ וַאֲשֶׁ֨ר דִּבֶּר־לִ֜י וַאֲשֶׁ֤ר נִֽשְׁבַּֽע־לִי֙ לֵאמֹ֔ר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את ה֗וּא יִשְׁלַ֤ח מַלְאָכוֹ֙ לְפָנֶ֔יךָ וְלָקַחְתָּ֥ אִשָּׁ֛ה לִבְנִ֖י מִשָּֽׁם׃", "onk": "יְיָ אֱלָהָא דִשְׁמַיָּא דִּי דַבְּרַנִי מִבֵּית אַבָּא וּמֵאֲרַע יַלְדוּתִי וְדִי מַלֵּל לִי וְדִי קַיֵּם לִי לְמֵימַר לִבְרָךְ אֶתֵּן יָת אַרְעָא הָדָא הוּא יִשְׁלַח מַלְאָכֵיהּ קֳדָמָךְ וְתִסַּב אִתְּתָא לִבְרִי מִתַּמָּן:", "onk_en": "Adonoy, God of heaven, Who took me from my father’s house, and from the land of my birth, Who spoke to me, and Who swore to me, saying, To your descendants I will give this land—He will send His angel before you, and you shall take a wife for my son from there.", "pj": "יְיָ אֱלָהָא דְמוֹתְבֵיהּ בִּשְׁמֵי מְרוֹמָא דְדַבְּרַנִי מִן בֵּית אַבָּא וּמִן אֲרַע יַלְדוּתִי וּדְמַלֵיל לִי וּדְקַיֵים עָלַי לְמֵימַר לִבְנָךְ אֶתֵּן יַת אַרְעָא הָדָא הוּא יַזְמִין מַלְאֲכִי לְקָמָךְ וְתִיסַב אִיתָא לִבְרִי מִתַּמָן", "pj_en": "The Lord God, whose seat is in heaven on high, who took me from my father's house, and from the land of my birth; and who spake to me, and sware to me, saying, To thy son will I give this land; He will seasonably send His angel, and thou shalt take a wife for my son from thence.", "tj": "", "tj_en": "", "rashi": "<b>ה' אלהי השמים אשר לקחני מבית אבי.<\/b> וְלֹא אָמַר \"וֵאלֹהֵי הָאָרֶץ\", וּלְמַעְלָה אָמַר וְאַשְׁבִּיעֲךָ וגו'? אָמַר לוֹ עַכְשָׁו הוּא אֱלֹהֵי הַשָּׁמַיִם וֵאלֹהֵי הָאָרֶץ, שֶׁהִרְגַּלְתִּיו בְּפִי הַבְּרִיּוֹת, אֲבָל כְּשֶׁלְּקָחַנִי מִבֵּית אָבִי הָיָה אֱלֹהֵי הַשָּׁמַיִם וְלֹא אֱלֹהֵי הָאָרֶץ, שֶׁלֹּא הָיוּ בָּאֵי עוֹלָם מַכִּירִים בּוֹ וּשְׁמוֹ לֹא הָיָה רָגִיל בָּאָרֶץ:<br><br><b>מבית אבי.<\/b> מֵחָרָן:<br><br><b>ומארץ מולדתי.<\/b> מֵאוּר כַּשְׂדִּים:<br><br><b>ואשר דבר לי.<\/b> לְצָרְכִּי; כְּמוֹ אֲשֶׁר דִּבֶּר עָלַי (מלכים א' ב'), וְכֵן כָּל לִי וְלוֹ וְלָהֶם הַסְּמוּכִים אֵצֶל דִּבּוּר מְפֹרָשִׁים בִּלְשוֹן עַל, וְתַרְגּוּם שֶׁלָּהֶם עֲלַי, עֲלוֹהִי, עֲלֵיהוֹן, שֶׁאֵין נוֹפֵל אֵצֶל דִּבּוּר לְשׁוֹן לִי וְלוֹ וְלָהֶם, אֶלָּא אֵלַי, אֵלָיו, אֲלֵיהֶם, וְתַרְגּוּם שֶׁלָּהֶם עִמִּי, עִמֵּיהּ, עִמְּהוֹן, אֲבָל אֵצֶל אֲמִירָה נוֹפֵל לְשׁוֹן לִי וְלוֹ וְלָהֶם:<br><br><b>ואשר נשבע לי.<\/b> בֵּין הַבְּתָרִים:", "rashi_en": "'ה אלהי השמים אשר לקחני מבית אבי THE LORD, GOD OF HEAVEN, WHO TOOK ME FROM MY FATHER'S HOUSE — Here he did not say “[The God of heaven] and the God of the earth”, whereas above (v. 3) he said, “And I will make thee swear etc. … [and the God of the earth]’’. But, in effect, Abraham said to him: Now He is the God of heaven and the God of the earth, because I have made him (i. e. His Name) a familiar one in peoples’ mouths: but at the time when He took me from my father’s house He was God of heaven only and not God of the earth for people did not acknowledge Him and His Name was not commonly known on earth (Genesis Rabbah 59:7).<br><br>מבית אבי FROM MY FATHER S HOUSE — from Haran.<br><br>ומארץ מולדתי AND FROM THE LAND OF MY NATIVITY — from Ur-Kasdim.<br><br>ואשר דבר לי AND WHO SPOKE לי—The word לי means “in my interest”, just as (1 Kings 2:4) “which He spake concerning me (עלי)”. In the same way, in every case where לי or לו or להם follow after the verb דבר they must be explained in the sense of על “concerning” — and in the Targum they should be rendered by עלי or עלוהי or עליהון regarding me etc. — for with this verb דבר in the sense of speaking to a person, the expressions לי and לו and להם are not the appropriate ones, but אלי and אליו and אליהן, and their renderings in the Targum should be עמי and עמיה and עמהן i. e., to speak with me or him or them. In the case of the verb אמר, however, the expressions לי and לו and להם are the appropriate ones.<br><br>ואשר נשבע לי AND WHO SWORE UNTO ME at the Covenant between the Pieces (Genesis Rabbah 59:10)."}, {"ch": 24, "v": 8, "aliyah": 2, "heb": "וְאִם־לֹ֨א תֹאבֶ֤ה הָֽאִשָּׁה֙ לָלֶ֣כֶת אַחֲרֶ֔יךָ וְנִקִּ֕יתָ מִשְּׁבֻעָתִ֖י זֹ֑את רַ֣ק אֶת־בְּנִ֔י לֹ֥א תָשֵׁ֖ב שָֽׁמָּה׃", "onk": "וְאִם לָא תֵיבֵי אִתְּתָא לְמֵיתֵי בַתְרָךְ וּתְהֵי זַכָּאָה מִמּוֹמָתִי דָּא לְחוֹד יָת בְּרִי לָא תָתֵב לְתַמָּן:", "onk_en": "If the woman does not want to come back with you, you are absolved from this oath to me. But do not bring my son back there.", "pj": "וְאִם לֵית צְבוּת אִתְּתָא לְמֵיתֵי בַּתְרָךְ וְתִזְדְכִי מִמוֹמָתִי דָא לְחוֹד יַת בְּרִי לָא תָתֵיב לְתַמָן", "pj_en": "But if the woman be not willing to come after thee, thou shalt be innocent from this my oath; only make not my son return thither.", "tj": "", "tj_en": "", "rashi": "<b>ונקית משבועתי וגו'.<\/b> וְקַח לוֹ אִשָּׁה מִבְּנוֹת עָנֵר אֶשְׁכּוֹל וּמַמְרֵא:<br><br><b>רק את בני וגו'.<\/b> רַק מִעוּט הוּא; בְּנִי אֵינוֹ חוֹזֵר, אֲבָל יַעֲקֹב בֶּן בְּנִי סוֹפוֹ לַחֲזֹר:", "rashi_en": "'ונקית משבעתי וגו THEN SHALT THOU BE CLEAR FROM THIS MY OATH etc. — and take a wife for him from the daughters of Aner or Eshcol or Mamre.<br><br>רק את בני וגו ONLY [BRING NOT] MY SON [THITHER] etc. — The word רק narrows and limits (מעוט) the sense: it is only my son who may not go back there, but Jacob, my son’s son, in the end will go back there to find a wife  (Genesis Rabbah 59:10). "}, {"ch": 24, "v": 9, "aliyah": 2, "heb": "וַיָּ֤שֶׂם הָעֶ֙בֶד֙ אֶת־יָד֔וֹ תַּ֛חַת יֶ֥רֶךְ אַבְרָהָ֖ם אֲדֹנָ֑יו וַיִּשָּׁ֣בַֽע ל֔וֹ עַל־הַדָּבָ֖ר הַזֶּֽה׃", "onk": "וְשַׁוִּי עַבְדָא יָת יְדֵיהּ תְּחוֹת יַרְכָא דְאַבְרָהָם רִבּוֹנֵיהּ וְקַיֵּם לֵיהּ עַל פִּתְגָּמָא הָדֵין:", "onk_en": "The servant placed his hand under the thigh of Avraham, his master, and swore to him regarding this matter.", "pj": "וְשַׁוֵי עַבְדָא יַת יְדֵיהּ בְּגִזְרַת מְהוּלְתָּא דְאַבְרָהָם רִבּוֹנֵיהּ וְקַיֵים לֵיהּ (עַל) עֵיסַק פִּתְגָמָא הָדֵין", "pj_en": "And the servant put his hand upon the circumcised part of Abraham his lord, and sware to him according to this thing.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 10, "aliyah": 3, "heb": "וַיִּקַּ֣ח הָ֠עֶ֠בֶד עֲשָׂרָ֨ה גְמַלִּ֜ים מִגְּמַלֵּ֤י אֲדֹנָיו֙ וַיֵּ֔לֶךְ וְכׇל־ט֥וּב אֲדֹנָ֖יו בְּיָד֑וֹ וַיָּ֗קׇם וַיֵּ֛לֶךְ אֶל־אֲרַ֥ם נַֽהֲרַ֖יִם אֶל־עִ֥יר נָחֽוֹר׃", "onk": "וּדְבַר עַבְדָא עַשְׂרָא גַמְלִין מִגַּמְלֵי רִבּוֹנֵה וַאֲזַל וְכָל שְׁפַר רִבּוֹנֵיהּ בִּידֵיהּ וְקָם וַאֲזַל לַאֲרָם <b>דִּי עַל פְּרַת<\/b> לְקַרְתָּא דְנָחוֹר:", "onk_en": "The servant took ten camels from his master’s camels and departed, and all the property of his master was in his hand. He rose and went to Aram Naharayim [<b>which is next to the river P’ras<\/b>]; to the city of Nachor.", "pj": "וּדְבַר עַבְדָא עֲשָרָה גַמְלִין מִן גַמְלֵי רִבּוֹנֵיהּ וַאֲזַל וְכָל שְׁפַר אַפּוֹתִּיקִי דְרִיבּוֹנֵיהּ בִּידֵיהּ וְקָם וַאֲזַל לַאֲרַם דְעַל פְּרָת לְקַרְתָּא דְנָחוֹר", "pj_en": "And the servant took ten camels from the camels of his lord, and went: for all the goodly treasures of his lord were in his hand; and he arose and went unto Aram, which was by the Pherat, to the city of Nachor.", "tj": "וְכָל שְׁפַר אַפּוּתְיָקִי דְרִבּוֹנֵיהּ בִּידֵיהּ וְקָם וַאֲזַל לַאֲרַם דְעַל פְּרָת נַהֲרַיִם:", "tj_en": "And all the goodly treasures of his lord were in his hand; and he arose and went to Aram, which is by Pherat Naharaim.", "rashi": "<b>מגמלי אדוניו.<\/b> נִכָּרִין הָיוּ מִשְּׁאָר גְּמַלִּים, שֶׁהָיוּ יוֹצְאִין זְמוּמִין מִפְּנֵי הַגֶּזֶל, שֶׁלֹּא יִרְעוּ בִשְׂדוֹת אֲחֵרִים (בראשית רבה):<br><br><b>וכל טוב אדוניו בידו.<\/b> שְׁטָר מַתָּנָה כָּתַב לְיִצְחָק עַל כָּל אֲשֶׁר לוֹ, כְּדֵי שֶׁיִּקְפְּצוּ לִשְׁלֹחַ לוֹ בִּתָּם (בראשית רבה):<br><br><b>ארם נהרים.<\/b> בֵּין שְׁתֵּי נְהָרוֹת יוֹשֶׁבֶת:", "rashi_en": "מגמלי אדניו OF HIS MASTER’S CAMELS — These were distinguished from other camels by going out muzzled to avoid robbery — i.e. that they should not graze in other peoples’ fields (Genesis Rabbah 59:11).<br><br>וכל טוב אדניו בידו AND ALL THE GOODS OF HIS MASTER WERE IN HIS HAND — He wrote a deed of gift of all his possessions in favour of Isaac so that they would be eager to send him their daughter (Genesis Rabbah 59:11).<br><br>ארם נהרים MESOPOTAMIA (literally, ARAM OF THE TWO RIVERS) — it was situated between the two rivers, Euphrates and Tigris. "}, {"ch": 24, "v": 11, "aliyah": 3, "heb": "וַיַּבְרֵ֧ךְ הַגְּמַלִּ֛ים מִח֥וּץ לָעִ֖יר אֶל־בְּאֵ֣ר הַמָּ֑יִם לְעֵ֣ת עֶ֔רֶב לְעֵ֖ת צֵ֥את הַשֹּׁאֲבֹֽת׃", "onk": "<b>וְאַשְׁרֵי<\/b> גַמְלַיָּא מִבָּרָא לְקַרְתָּא לִבְאֵרָא דְמַיָּא לְעִדַּן רַמְשָׁא לְעִדַּן דְּנַפְקַן מַלְיָתָא:", "onk_en": "He made the camels kneel [<b>rest<\/b>] outside the city, beside a well of water, in the evening, at the time the women go out to draw water.", "pj": "וְאַרְבַּע גַמְלַיָא מִבָּרָא לְקַרְתָּא לְבֵירָא דְמַיָא לְעִידָן רַמְשָׁא לְעִדָן דְנַפְקַן מַלְיָאתָא", "pj_en": "And he made the camels lie down without the city by the fountain of waters, at the time of evening, the time when the fillers (of water) come forth.", "tj": "", "tj_en": "", "rashi": "<b>ויברך הגמלים.<\/b> הִרְבִּיצָם:", "rashi_en": "ויברך הגמלים means HE MADE THEM KNEEL (Genesis Rabbah 59:11)."}, {"ch": 24, "v": 12, "aliyah": 3, "heb": "וַיֹּאמַ֓ר&thinsp;<b>׀<\/b> יְהֹוָ֗ה אֱלֹהֵי֙ אֲדֹנִ֣י אַבְרָהָ֔ם הַקְרֵה־נָ֥א לְפָנַ֖י הַיּ֑וֹם וַעֲשֵׂה־חֶ֕סֶד עִ֖ם אֲדֹנִ֥י אַבְרָהָֽם׃", "onk": "וַאֲמַר יְיָ אֱלָהֵהּ דְּרִבּוֹנִי אַבְרָהָם זַמִּין כְּעַן קֳדָמַי יוֹמָא דֵין <b>וְעִבַד טִיבוּ<\/b> עִם רִבּוֹנִי אַבְרָהָם:", "onk_en": "He said, Adonoy, God of my master, Avraham, be present before me today, and act kindly [<b>do goodness<\/b>] with my master, Avraham.", "pj": "וַאֲמַר יְיָ אֱלָהָא דְרִיבּוֹנִי אַבְרָהָם זַמִין כְּעַן אִיתָא מְהַגְנָא קוּמִי יוֹמָנָא וְעִיבַד טִיבוֹי עִם רִבּוֹנִי אַבְרָהָם", "pj_en": "And he said, Lord God of my master Abraham, prepare thou a proper woman before me today, and deal graciously with my master Abraham.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 13, "aliyah": 3, "heb": "הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל־עֵ֣ין הַמָּ֑יִם וּבְנוֹת֙ אַנְשֵׁ֣י הָעִ֔יר יֹצְאֹ֖ת לִשְׁאֹ֥ב מָֽיִם׃", "onk": "הָא אֲנָא קָאֵם עַל עֵינָא דְמַיָּא וּבְנַת אֱנָשֵׁי קַרְתָּא נַפְקַן לְמִמְלֵי מַיָא:", "onk_en": "Behold, here I stand by this well of water, and the daughters of the townsmen are coming out to draw water.", "pj": "הָא אֲנָא קָאִי עַל עֵינָא דְמַיָא וּבְנַתְהוֹן דְאַנְשֵׁי קַרְתָּא נַפְקַן לְמִמְלֵי מוֹי", "pj_en": "Behold I stand at the well of waters, and the daughters of the men of the city are coming forth to fill waters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 14, "aliyah": 3, "heb": "וְהָיָ֣ה הַֽנַּעֲרָ֗ אֲשֶׁ֨ר אֹמַ֤ר אֵלֶ֙יהָ֙ הַטִּי־נָ֤א כַדֵּךְ֙ וְאֶשְׁתֶּ֔ה וְאָמְרָ֣ה שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה אֹתָ֤הּ הֹכַ֙חְתָּ֙ לְעַבְדְּךָ֣ לְיִצְחָ֔ק וּבָ֣הּ אֵדַ֔ע כִּי־עָשִׂ֥יתָ חֶ֖סֶד עִם־אֲדֹנִֽי׃", "onk": "וּתְהֵי עוּלֶמְתָּא דְּאֵימַר לַהּ אַרְכִינִי <b>כְעַן<\/b> קוּלְתִיךְ וְאֶשְׁתִּי וְתֵימַר אֵשְׁתְּ וְאַף גַּמְלָךְ אַשְׁקֵי יָתַהּ זַמִּנְתָּא לְעַבְדָךְ לְיִצְחָק וּבַהּ אִידַע אֲרֵי <b>עֲבַדְתָּ טִיבוּ<\/b> עִם רִבּוֹנִי:", "onk_en": "Let it be that the girl to whom I say, Please [<b>Now<\/b>], tip over your pitcher that I may drink and she will say Drink, and I will also give your camels to drink, will be the one whom You have determined for your servant, Yitzchok. With her I will know that You have dealt kindly [<b>with goodness<\/b>] with my master.", "pj": "וּתְהֵי רִיבָא דַאֲמַר לָהּ אַרְכִינִי כְדוֹן לְגִינִיךְ וְאֵשְׁתִּי וְתֵימַר שְׁתֵי וְאוּף גַמְלִיךְ אַשְׁקֵי יָתָהּ זְמִינְתָּא בְּמַזָלָא לְעַבְדָךְ לְיִצְחָק וּבָהּ אִינְדַע אֲרוּם עֲבַדְתְּ טִיבוּ עִם רִיבּוֹנִי", "pj_en": "Let the damsel to whom I say, Reach me now thy pitcher, that I may drink, and she say, Drink, and I will also make my camels drink, be she whom thou hast provided to go to thy servant Izhak; and herein shall I know that Thou hast dealt graciously with my master.", "tj": "", "tj_en": "", "rashi": "<b>אתה הכחת.<\/b> רְאוּיָה הִיא לוֹ שֶׁתְּהֵא גּוֹמֶלֶת חֲסָדִים, וּכְדַאי לִכָּנֵס בְּבֵיתוֹ שֶׁל אַבְרָהָם; וּלְשׁוֹן הֹכַחְתָּ בֵּרַרְתָּ, אפרו\"בישט בלע\"ז:<br><br><b>ובה אדע.<\/b> לְשׁוֹן תְּחִנָּה, הוֹדַע לִי בָּהּ:<br><br><b>כי עשית חסד.<\/b> אִם תִּהְיֶה מִמִּשְׁפַּחְתּוֹ וְהוֹגֶנֶת לוֹ אֵדַע כִּי עָשִׂית חֶסֶד:", "rashi_en": "אתה הכחת HER THOU HAST APPOINTED — She is fit for him since she will be charitable and will therefore be worthy of admission into the house of Abraham. The word הכחת means selected; old French approuvest; English thou hast selected.<br><br>ובה אדע This is a petition: “Let me know through her”.<br><br>כי עשית חסד THAT THOU HAST SHOWN KINDNESS — if she is of his family and a fit companion for him I shall know that thou hast shown kindness to my master."}, {"ch": 24, "v": 15, "aliyah": 3, "heb": "וַֽיְהִי־ה֗וּא טֶ֘רֶם֮ כִּלָּ֣ה לְדַבֵּר֒ וְהִנֵּ֧ה רִבְקָ֣ה יֹצֵ֗את אֲשֶׁ֤ר יֻלְּדָה֙ לִבְתוּאֵ֣ל בֶּן־מִלְכָּ֔ה אֵ֥שֶׁת נָח֖וֹר אֲחִ֣י אַבְרָהָ֑ם וְכַדָּ֖הּ עַל־שִׁכְמָֽהּ׃", "onk": "וַהֲוָה הוּא עַד לָא שֵׁיצֵי לְמַלָּלָא וְהָא רִבְקָה נְפָקַת דְּאִתְיְלִידַת לִבְתוּאֵל בַּר מִלְכָּה אִתַּת נָחוֹר אֲחוּהִי דְאַבְרָהָם וְקוּלְתַהּ עַל כַּתְפַּהּ:", "onk_en": "He had not yet finished speaking, and behold Rivkah came out. She had been born to Besu’eil, the son of Milkah, the wife of Nachor, Avraham’s brother. Her pitcher was on her shoulder.", "pj": "וַהֲוָה בְּשָׁעָא קַלִילָא הוּא עַד כְּדוֹן לָא פָּסַק לְמַלָלָא וְהָא רִבְקָה נַפְקַת דְאִתְיְלִידָא לִבְתוּאֵל בַּר מִלְכָּה אִנְתְּתֵיהּ דְנָחוֹר אָחוֹי דְאַבְרָהָם וּלְגִינְתָא עַל כַּתְפָהָא", "pj_en": "And it was in that little hour, while he had not ceased to speak, that, behold, Rivekah came forth, who was born to Bethuel, son of Milcha, the wife of Nachor, the brother of Abraham, and her pitcher was upon her shoulder.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 16, "aliyah": 3, "heb": "וְהַֽנַּעֲרָ֗ טֹבַ֤ת מַרְאֶה֙ מְאֹ֔ד בְּתוּלָ֕ה וְאִ֖ישׁ לֹ֣א יְדָעָ֑הּ וַתֵּ֣רֶד הָעַ֔יְנָה וַתְּמַלֵּ֥א כַדָּ֖הּ וַתָּֽעַל׃", "onk": "וְעוּלֶמְתָּא שַׁפִּירַת חֵיזוּ (<small>נ\"י<\/small> שַׁפִּירָא לְמֶחֱזֵי) לַחֲדָא בְּתֻלְתָּא וּגְבַר לָא יַדְעָהּ וּנְחָתַת לְעֵינָא וּמְלַת קוּלְתַהּ וּסְלֵקָת:", "onk_en": "The girl was very good looking—a virgin—no man had known her. She went down to the well, filled her pitcher, and came up.", "pj": "וְרִיבָא שַׁפִּירָא לְמֵיחֲמֵי לַחֲדָא בְּתוּלְתָּא וּגְבַר לָא יָדָעָהּ בְּמַשְׁכְּבָהּ וּנְחָתַת לְעַיְינָא וּמְלַת לְגִנְתָהּ וּסְלִיקַת", "pj_en": "And the damsel was a virgin, very beautiful to behold, and she descended to the fountain and filled her pitcher, and came up.", "tj": "", "tj_en": "", "rashi": "<b>בתולה.<\/b> מִמְּקוֹם בְּתוּלִים (בראשית רבה):<br><br><b>ואיש לא ידעה.<\/b> שֶׁלֹּא כְּדַרְכָּהּ, לְפִי שֶׁבְּנוֹת הַגּוֹיִם הָיוּ מְשַׁמְּרוֹת מְקוֹם בְּתוּלֵיהֶן וּמַפְקִירוֹת עַצְמָן מִמָּקוֹם אַחֵר, הֵעִיד עַל זוֹ שֶׁנְּקִיָּה מִכֹּל:", "rashi_en": "בתולה A VIRGIN — from the place of her hymen.<br><br>ואיש לא ידעה AND A MAN DID NOT KNOW HER — not in its way (meaning, anally). Because the daughters of the nations would guard the place of their hymens, but abandon themselves from another place. It testifies about this one that she was clean from all [of this] (Genesis Rabbah 60:5). "}, {"ch": 24, "v": 17, "aliyah": 3, "heb": "וַיָּ֥רׇץ הָעֶ֖בֶד לִקְרָאתָ֑הּ וַיֹּ֕אמֶר הַגְמִיאִ֥ינִי נָ֛א מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "onk": "וּרְהַט עַבְדָא לִקְדָמוּתַהּ וַאֲמַר אַשְׁקִינִי (<small>ס\"א<\/small> אַטְעֵמְנִי) כְעַן זְעֵיר מַיָּא מִקּוּלְתִיךְ:", "onk_en": "The servant ran toward her and said, Please [<b>Now<\/b>] let me sip a little water from your pitcher.", "pj": "וּרְהַט עַבְדָא לִקְדָמוּתָהָא וַאֲמַר אַטְעִמְנִי כְּדוֹן קַלֵיל מוֹי מִן לְגִינִיתִיךְ", "pj_en": "And the servant ran to meet her, and said, Let me taste now a little water from thy pitcher.", "tj": "", "tj_en": "", "rashi": "<b>וירץ העבד לקראתה.<\/b> לְפִי שֶׁרָאָה שֶׁעָלוּ הַמַּיִם לִקְרָאתָהּ (בראשית רבה):<br><br><b>הגמיאיני נא.<\/b> לְשׁוֹן גְּמִיעָה, הומיי\"ר בלע\"ז:", "rashi_en": "וירץ העבד לקראתה AND THE SERVANT RAN TOWARDS HER — because he saw that the waters rose in the well when she approached it (Genesis Rabbah 60:5). <br><br>הגמיאיני נא GIVE ME TO DRINK, I PRAY THEE — the word means sipping; old French humer."}, {"ch": 24, "v": 18, "aliyah": 3, "heb": "וַתֹּ֖אמֶר שְׁתֵ֣ה אֲדֹנִ֑י וַתְּמַהֵ֗ר וַתֹּ֧רֶד כַּדָּ֛הּ עַל־יָדָ֖הּ וַתַּשְׁקֵֽהוּ׃", "onk": "וַאֲמֶרֶת אֵשְׁתְּ רִבּוֹנִי וְאוֹחִיאַת וַאֲחֵיתַת קוּלְתַהּ עַל יְדַהּ וְאַשְׁקְתֵיהּ:", "onk_en": "She said, Drink, my master, and she quickly lowered her pitcher to her hand, and let him drink.", "pj": "וַאֲמָרַת שְׁתִי רִבּוֹנִי וְאוֹחִיאַת וַאֲחִיתַת לְגִינְתָא עַל יָדָהּ וְאַשְׁקִיתֵהּ", "pj_en": "And she said, Drink, my lord; and hastened to let down her pitcher upon her hand, and gave him drink.", "tj": "", "tj_en": "", "rashi": "<b>ותרד כדה.<\/b> מֵעַל שִׁכְמָהּ:", "rashi_en": "ותרד כדה SHE LET DOWN HER PITCHER from off her shoulder."}, {"ch": 24, "v": 19, "aliyah": 3, "heb": "וַתְּכַ֖ל לְהַשְׁקֹת֑וֹ וַתֹּ֗אמֶר גַּ֤ם לִגְמַלֶּ֙יךָ֙ אֶשְׁאָ֔ב עַ֥ד אִם־כִּלּ֖וּ לִשְׁתֹּֽת׃", "onk": "וְשֵׁיצִיאַת לְאַשְׁקָיוּתֵיהּ וַאֲמֶרֶת אַף לְגַמְלָךְ אַמְלֵי עַד <b>דִּי סַפְקוּן<\/b> לְמִשְׁתֵּי:", "onk_en": "When she had finished giving him to drink, she said, I will also draw water for your camels, until they will have finished drinking [<b>had enough to drink<\/b>].", "pj": "וּפְסָקַת לְאֲשְׁקִיוּתֵיהּ וַאֲמַרַת אוּף לְגַמְלָךְ אִימְלִי עַד דִי סַפְקוּן לְמִשְׁתֵּי", "pj_en": "And she finished giving him drink, and said, Also for thy camels I will fill until they be satisfied with drinking.", "tj": "", "tj_en": "", "rashi": "<b>עד אם כלו.<\/b> הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, אִם כִּלּוּ דַי סִפּוּקוֹן, שֶׁזּוֹ הִיא גְּמַר שְׁתִיָּתָן, כְּשֶׁשָּׁתוּ דֵּי סִפּוּקָן:", "rashi_en": "עד אם כלו literally, UNTIL THAT THEY HAVE FINISHED [DRINKING] — Here the word אם is used in the sense of אשר “that”. The words אם כלו the Targum renders by \"That they have done enough drinking”. Though the verb כלה signifies to finish, to end, the Targum is right in translating it thus for this is the end of their drinking when they have drunk as much as they wanted (cf. Rashi on Genesis 43:2). "}, {"ch": 24, "v": 20, "aliyah": 3, "heb": "וַתְּמַהֵ֗ר וַתְּעַ֤ר כַּדָּהּ֙ אֶל־הַשֹּׁ֔קֶת וַתָּ֥רׇץ ע֛וֹד אֶֽל־הַבְּאֵ֖ר לִשְׁאֹ֑ב וַתִּשְׁאַ֖ב לְכׇל־גְּמַלָּֽיו׃", "onk": "וְאוֹחִיאַת וּנְפָצַת קוּלְתַהּ לְבֵית שַׁקְיָא וּרְהָטַת עוֹד לְבֵירָא לְמִמְלֵי וּמְלַת לְכָל גַּמְלוֹהִי:", "onk_en": "She quickly emptied her pitcher into the trough and she ran to the well again to draw water. and she drew water for all his camels.", "pj": "וְאוֹחִיאַת וְרוֹקִינַת לְגִינְתָא לְמוֹרְבִּיוֹת בֵּית שִׁקְתֵי וּרְהָטַת תּוּב לְבֵירָא לְמִימְלֵי וּמְלַת לְכָל גַמְלוֹי", "pj_en": "And she hastened and emptied the pitcher into the canal, the place of drinking, and ran again to the well to fill; and she filled for all his camels.", "tj": "וְזָרְזַת וְאַחָתַת מוּרְבִּיָהּ לְגוֹי שַׁקְיָא וְאַשְׁקַת לְכָל גַמְלוֹהִי:", "tj_en": "And she made haste, and poured out her vase into the midst of the trough, and filled, and gave drink to all the camels.", "rashi": "<b>ותער.<\/b> לְשׁוֹן נְפִיצָה, וְהַרְבֵּה יֵשׁ בִּלְשׁוֹן מִשְׁנָה הַמְעָרֶה מִכְּלִי אֶל כֶּלִי, וּבַמִּקְרָא יֵשׁ לוֹ דּוֹמֶה אַל תְּעַר נַפְשִׁי (תהילים קמא), אֲשֶׁר הֶעֱרָה לַמָּוֶת נַפְשׁוֹ (ישעיהו נ\"ג):<br><br><b>השקת.<\/b> אֶבֶן חֲלוּלָה שֶׁשּׁוֹתִים בָּה הַגְּמַלִּים:", "rashi_en": "ותער AND SHE EMPTIED — It means “pouring out”. It occurs in this sense many times in the Mishna; e. g., (Avodah Zarah 72a), “He who pours (הטערה) from one vessel into another”, and we find it again in a similar sense in Biblical Hebrew: (Psalms 141:8) “O pour not out (תער) my soul”, and (Isaiah 53:12) “Because he poured forth (הערה) his soul unto death”<br><br>השקת THE TROUGH — a hollowed-out stone from which the camels drink. "}, {"ch": 24, "v": 21, "aliyah": 3, "heb": "וְהָאִ֥ישׁ מִשְׁתָּאֵ֖ה לָ֑הּ מַחֲרִ֕ישׁ לָדַ֗עַת הַֽהִצְלִ֧יחַ יְהֹוָ֛ה דַּרְכּ֖וֹ אִם־לֹֽא׃", "onk": "<b>וְגַבְרָא שָׁהֵי בַהּ מִסְתַּכֵּל שָׁתִיק לְמֵידַע<\/b> הַאַצְלַח יְיָ אָרְחֵיהּ אִם לָא:", "onk_en": "The man, wondering at her, remained silent, waiting to determine [<b>The man waited and observed silently to determine<\/b>] whether Adonoy had made his mission successful, or not.", "pj": "וְגַבְרָא הֲוָה מַמְתִּין לָהּ וּשְׁתֵיק לְמִנְדַע הַאַצְלַח יְיָ אָרְחֵיהּ אִין לָא", "pj_en": "But the man waited, and was silent, to know whether the Lord had prospered his way or not.", "tj": "", "tj_en": "", "rashi": "<b>משתאה.<\/b> לְשׁוֹן שְׁאִיָּה, כְּמוֹ שָׁאוּ עָרִים, תִּשָּׁאֶה שְׁמָמָה (שם ו'):<br><br><b>משתאה.<\/b> מִשְׁתּוֹמֵם וּמִתְבַּהַל עַל שֶׁרָאָה דְבָרוֹ קָרוֹב לְהַצְלִיחַ, אֲבָל אֵינוֹ יוֹדֵעַ אִם מִמִּשְׁפַּחַת אַבְרָהָם הִיא אִם לָאו. וְאַל תִּתְמַהּ בַּת' שֶׁל מִשְׁתָּאֵה, שֶׁאֵין לְךָ תֵּבָה שֶׁתְּחִלַּת יְסוֹדָהּ שִׁי\"ן וּמְדַבֶּרֶת בִּלְשׁוֹן מִתְפַּעֵל שֶׁאֵין תָּי\"ו מַפְרִידָה בֵּין שְׁתֵּי אוֹתִיּוֹת שֶׁל עִקָּר הַיְסוֹד כְּגוֹן מִשְׁתָּאֵה, מִשְׁתּוֹלֵל מִגִּזְרַת שׁוֹלָל, וַיִּשְׁתּוֹמֵם מִגִּזְרַת שְׁמָמָה, וְיִשְׁתַּמֵּר חֻקּוֹת עָמְרִי (מיכה ו') מִגִּזְרַת וַיִּשְׁמֹר, אַף כָּאן מִשְׁתָּאֵה מִגִּזְרַת תִּשָּׁאֶה, וּכְשֵׁם שֶׁאַתָּה מוֹצֵא לְשׁוֹן מְשׁוֹמֵם בְּאָדָם נִבְהָל וְנֶאֱלָם וּבַעַל מַחֲשָׁבוֹת, כְּמוֹ עַל יוֹמוֹ נָשַׁמּוּ אַחֲרֹנִים (איוב י\"ח), שֹׁמּוּ שָׁמַיִם (ירמיהו ב'), אֶשְׁתּוֹמַם כְּשָׁעָה חֲדָא (דניאל ד'), כָּךְ תְּפָרֵשׁ לְשׁוֹן שְׁאִיָּה בְּאָדָם בָּהוּל וּבַעַל מַחֲשָׁבוֹת (וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן שְׁהִיָּה, וְגַבְרָא שָׁהֵי, שׁוֹהֵא וְעוֹמֵד בְּמָקוֹם אֶחָד לִרְאוֹת הַהִצְלִיחַ ה' דַּרְכּוֹ; וְאֵין לְתַרְגֵּם שָׁתֵי, שֶׁהֲרֵי אֵינוֹ לְשׁוֹן שְׁתִיָּה, שֶׁאֵין אָלֶף נוֹפֶלֶת בִּלְשׁוֹן שְׁתִיָּה):<br><br><b>משתאה לה.<\/b> מִשְׁתּוֹמֵם עָלֶיהָ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג) וּכְמוֹ וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ (שם כ\"ו):", "rashi_en": "משתאה WAS WONDERING — The word really has the idea of being waste and desolate, as (Isaiah 6:11) “Until cities be waste (שאו) and the land become utterly desolate תשאה.<br><br>משתאה means he was astonished and perplexed, because he saw that what he had said was nearly successful only that he did not know whether she belonged to Abraham’s family or not. Do not be puzzled by the ת in the word משתאה for you will find no word (verb) whose first root letter is ש where, when it is used in the Hithpael, the ת of the Hithpael-prefix does not come between the first two letters of the root, as e.g. משתאה (here) and (Isaiah 59:15) משתולל of the same root as שולל, and (Isaiah 59:16) וישתומם of the same root as שממה and (Micha 6:16) “For the statutes of Omri are kept (וישתמר )” from the same root as וישמר —so, also, here משתאה is of the same root as תשאה. Now, just as you find the expression שמם (which really means waste and desolate) applied to a person who is perplexed and speechless (with amazement) and sunk in deep thought (about what is happening) — e. g., (Job 18:20) “They that come after shall be astonished (נשמו) at his day”, and (Jeremiah 2:12) “Be astonished (שומו) ye heavens”, and (Daniel 4:16) “He was appalled אשתומם for a time” — so too you may explain the expression שאה (which also really means waste and desolate) in all its verbal or noun forms as referring to a person who is perplexed and sunk deep in thought. Onkelos translates it in the sense of lingering — “the man lingered” — i. e. he wailed, standing on one spot, to see “whether God had made his journey prosperous”. But one should not read in the Targum שתי in place of שהי, as the Targum of משתאה, (as evidently some versions of the Targum read), for the word משתאה certainly does not mean drinking, for א has no place in the Hebrew words which mean drinking root (שתה).<br><br>משתאה לה means he was wondering about her, just as the ל has the meaning “about” in (20:13) “Say of me (לי), he is my brother”, and (26:7) “And the men of the place asked about his wife. "}, {"ch": 24, "v": 22, "aliyah": 3, "heb": "וַיְהִ֗י כַּאֲשֶׁ֨ר כִּלּ֤וּ הַגְּמַלִּים֙ לִשְׁתּ֔וֹת וַיִּקַּ֤ח הָאִישׁ֙ נֶ֣זֶם זָהָ֔ב בֶּ֖קַע מִשְׁקָל֑וֹ וּשְׁנֵ֤י צְמִידִים֙ עַל־יָדֶ֔יהָ עֲשָׂרָ֥ה זָהָ֖ב מִשְׁקָלָֽם׃", "onk": "וַהֲוָה <b>כַּד סַפִּיקוּ<\/b> גַמְלַיָּא לְמִשְׁתֵּי וּנְסֵיב גַּבְרָא קָדָשָׁא דְדַהֲבָא תִּקְלָא מַתְקְלֵיהּ וּתְרֵין שֵׁירִין עַל יְדָהָא מַתְקַל עֲשַׂר סִלְעִין דְּדַהֲבָא מַתְקַלְהוֹן:", "onk_en": "When the camels had finished drinking [<b>had enough to drink<\/b>], the man took a gold nose ring, weighing half a <i>shekel<\/i>, and two bracelets for her arms, weighing ten gold <i>shekel.<\/i>", "pj": "וַהֲוָה כַּד סְפִּיקַן גַמְלַיָא לְמִמְלֵי וּנְסִיב גַבְרָא קָדָשָׁא דְדַהֲבָא דַרְכְּמוֹנָא מַתְקְלֵיהּ קֳבֵל דַרְכְּמוֹנָא לְגַלְגֶלְתָּא דְאִיטְמוּסִין בְּנָהָא לְמֵיתַב לְעִיבִידַת מַשְׁכְּנָא וּתְרֵין שִׁירִין יְהַב עַל יְדָהָא מַתְקַל עֲשַר סַלְעִין דְדַהֲבָא סְכוּם מַתְקַלְהוֹן קֳבֵל תְּרֵין לוּחַיָא דִכְתִיבִין בְהוֹן עֲשַרְתִּי דִבְּרַיָא", "pj_en": "And it was when the camels had been satisfied with drink, that the man took an earring of gold, of a drachma in weight, the counterpart of the drachma of the head (money) which her children presented for the work of the sanctuary; and he set two golden bracelets upon her hands, in weight ten sileen of gold; the sum of their weight being the counterpart of the two tables on which were inscribed the Ten Words.", "tj": "", "tj_en": "", "rashi": "<b>בקע.<\/b> רֶמֶז לְשִׁקְלֵי יִשְׂרָאֵל בֶּקַע לַגֻּלְגֹּלֶת:<br><br><b>ושני צמידים.<\/b> רֶמֶז לִשְׁנֵי לוּחוֹת מְצֻמָּדוֹת:<br><br><b>עשרה זהב משקלם.<\/b> רֶמֶז לַעֲשֶׂרֶת הַדִּבְּרוֹת שֶׁבָּהֶן:", "rashi_en": "בקע BEKA (half a Shekel) — a symbol of the Shekels of the Israelites of which it is said (Exodus 38:26) “a Beka (half a Shekel) a head” (cf. Targum Jon).<br><br>ושני צמידים AND TWO BRACELETS (the word for bracelet signifies something joined or united) — a symbol of the two Tablets of stone, joined one to another (Genesis Rabbah 60:6).<br><br>עשרה זהב משקלם TEN SHEKELS OF GOLD WAS THEIR WEIGHT —a symbol of the Ten Commandments written on them (the Tablets) (Genesis Rabbah 60:6). "}, {"ch": 24, "v": 23, "aliyah": 3, "heb": "וַיֹּ֙אמֶר֙ בַּת־מִ֣י אַ֔תְּ הַגִּ֥ידִי נָ֖א לִ֑י הֲיֵ֧שׁ בֵּית־אָבִ֛יךְ מָק֥וֹם לָ֖נוּ לָלִֽין׃", "onk": "וַאֲמַר בַּת מָן אַתְּ חַוִּי <b>כְעַן<\/b> לִי הַאִית בֵּית אָבוּךְ <b>אָתַר כָּשַׁר<\/b> לָנָא לִמְבָת:", "onk_en": "He said to her, Whose daughter are you? Please [<b>Now<\/b>] tell me. Is there [<b>a fitting<\/b>] place in your father’s house for us to spend the night.", "pj": "וַאֲמַר בְּרַת מַאן אַתְּ תַּנִי כְדוֹן לִי הַאִית בֵּית אָבוּךְ אֲתַר כָּשַר לָנָא לִמְבָת", "pj_en": "And he said, Whose daughter art thou? Tell me now, if in thy father's house there be room for us to lodge.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר בת מי את.<\/b> לְאַחַר שֶׁנָּתַן לָהּ שְׁאָלָהּ, לְפִי שֶׁהָיָה בָּטוּחַ בִּזְכוּתוֹ שֶׁל אַבְרָהָם שֶׁהִצְלִיחַ הַקָּבָּ\"ה דַּרְכּוֹ:<br><br><b>ללין.<\/b> לִינָה אַחַת, לִין שֵׁם דָּבָר; וְהִיא אָמְרָה לָלוּן – כַּמָּה לִינוֹת:", "rashi_en": "ויאמר בת מי את AND HE SAID, WHOSE DAUGHTER ART THOU? — He asked her this after he had given her these presents, for he was confident that, on account of the merit of Abraham, the Holy One blessed be He, had made his journey successful.<br><br>ללין TO LODGE IN — the word means one night’s lodging. The word לין is a noun (of the same form as גיל ,שיר). She however said (Genesis 24:25) ללון (a verb, “to lodge” generally) meaning many nights’ lodging (Genesis Rabbah 60:6). "}, {"ch": 24, "v": 24, "aliyah": 3, "heb": "וַתֹּ֣אמֶר אֵלָ֔יו בַּת־בְּתוּאֵ֖ל אָנֹ֑כִי בֶּן־מִלְכָּ֕ה אֲשֶׁ֥ר יָלְדָ֖ה לְנָחֽוֹר׃", "onk": "וַאֲמֶרֶת לֵיהּ בַּת בְּתוּאֵל אֲנָא בַּר מִלְכָּא דִּילֵידַת לְנָחוֹר:", "onk_en": "She said to him, I am the daughter of Besueil, the son of Milkah, whom she bore to Nachor.", "pj": "וַאֲמַרַת לֵיהּ בְּרַת בְּתוּאֵל אֲנָא בַּר מִלְכָּה דִילֵידַת לְנָחוֹר", "pj_en": "And she said, I am the daughter of Bethuel the son of Milcha, whom she bare to Nachor.", "tj": "", "tj_en": "", "rashi": "<b>בת בתואל.<\/b> הֱשִׁיבַתּוּ עַל רִאשׁוֹן רִאשׁוֹן וְעַל אַחֲרוֹן אַחֲרוֹן:", "rashi_en": "בת בתואל DAUGHTER OF BETHUEL — She answered his first question first and his last last (cf. Avot 5:9). "}, {"ch": 24, "v": 25, "aliyah": 3, "heb": "וַתֹּ֣אמֶר אֵלָ֔יו גַּם־תֶּ֥בֶן גַּם־מִסְפּ֖וֹא רַ֣ב עִמָּ֑נוּ גַּם־מָק֖וֹם לָלֽוּן׃", "onk": "וַאֲמֶרֶת לֵיהּ אַף תִּבְנָא אַף כִּסָּתָא סַגִּי עִמָּנָא אַף <b>אָתַר כָּשַׁר<\/b> לִמְבָת:", "onk_en": "She said to him, We have plenty of straw and fodder, and also a [<b>fitting<\/b>] place to spend the night.", "pj": "וְתָנַת לְמֵימַר לֵיהּ אוּף תִּיבְנָא אוּף אַסְפַּסְתָּא סַגִי עִמָנָא אוּף אָתַר כָּשַׁר לִמְבָת", "pj_en": "And she told him, saying, There is also straw and provender in plenty with us, as also proper room to lodge.", "tj": "", "tj_en": "", "rashi": "<b>מספוא.<\/b> כָּל מַאֲכַל הַגְּמַלִים קָרוּי מִסְפּוֹא, כְּגוֹן תֶּבֶן וּשְׂעוֹרִים:", "rashi_en": "מספוא PROVENDER — All kinds of camels’ food is called מספוא e. g., straw and barley. "}, {"ch": 24, "v": 26, "aliyah": 3, "heb": "וַיִּקֹּ֣ד הָאִ֔ישׁ וַיִּשְׁתַּ֖חוּ לַֽיהֹוָֽה׃", "onk": "וּכְרַע גַּבְרָא וּסְגִיד <b>קֳדָם<\/b> יְיָ:", "onk_en": "The man bowed [his head] and prostrated himself to [<b>before<\/b>] Adonoy.", "pj": "וְגָחַן גַבְרָא וּסְגִיד קֳדָם יְיָ דְזַמִין קֳדָמוֹי אִתְּתָא מְהַגְנָא", "pj_en": "And the man bowed and worshipped before the Lord, who had thus prepared before him a suitable wife.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 27, "aliyah": 4, "heb": "וַיֹּ֗אמֶר בָּר֤וּךְ יְהֹוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣י אַבְרָהָ֔ם אֲ֠שֶׁ֠ר לֹֽא־עָזַ֥ב חַסְדּ֛וֹ וַאֲמִתּ֖וֹ מֵעִ֣ם אֲדֹנִ֑י אָנֹכִ֗י בַּדֶּ֙רֶךְ֙ נָחַ֣נִי יְהֹוָ֔ה בֵּ֖ית אֲחֵ֥י אֲדֹנִֽי׃", "onk": "וַאֲמַר בְּרִיךְ יְיָ אֱלָהָא דְרִבּוֹנִי אַבְרָהָם דִּי לָא מְנַע טִיבוּתֵיהּ וְקוּשְׁטֵיהּ מִן רִבּוֹנִי אֲנָא בְּאוֹרַח <b>תַּקְנָא<\/b> דַּבְּרַנִי יְיָ בֵּית אַחוֹהִי דְרִבּוֹנִי:", "onk_en": "He said, Blessed is Adonoy, God of my master, Avraham, Who has not abandoned His kindness [<b>goodness<\/b>] and truth [in dealing] with my master. I am still on the [<b>straight<\/b>] road and Adonoy has led me to the house of my master’s brethren.", "pj": "וַאֲמַר בְּרִיךְ שְׁמָא דַיְיָ אֱלָהֵיהּ דְרִיבּוֹנִי אַבְרָהָם דִי לָא מְנַע טֵיבוּתֵיהּ וְקוּשְׁטֵיהּ מִן רִבּוֹנִי אֲנָא בִּזְכוּתֵיהּ בְּאוֹרַח תַּקְנָא דַבְּרַנִי יְיָ בֵּית אָחוֹי דְרִבּוֹנִי", "pj_en": "And he said, Blessed be the Name of the Lord, the God of my master Abraham, who hath not restrained His mercy and His truth from my master; for the sake of his righteousness in the right way hath the Lord led me to the house of my master's brother.", "tj": "", "tj_en": "", "rashi": "<b>בדרך.<\/b> דֶּרֶךְ הַמְזֻמָּן, דֶּרֶך הַיָּשָׁר, בְּאוֹתוֹ דֶּרֶךְ שֶׁהָיִיתִי צָרִיךְ, וְכֵן כָּל בֵּי\"ת וְלָמֶ\"ד וְהֵ\"א הַמְשַׁמְּשִׁים בְּרֹאש הַתֵּבָה וּנְקוּדִים בְּפַתָּח, מְדַבְּרִים בְּדָבָר הַפָּשׁוּט שֶׁנִּזְכַּר כְּבָר בְּמָקוֹם אַחֵר, אוֹ שֶׁהוּא מְבֹרָר וְנִכָּר בְּאֵיזוֹ הוּא מְדַבֵּר:", "rashi_en": "בדרך [I BEING] IN THE WAY — The way i.e. the designated way — the right way — that way which I really required. In the same manner wherever ב or ל or ה are prefixed to a word and are punctuated with a Patach, they speak of some object that is quite definite in sense, having been already mentioned in another passage, or of some object where it is quite clear and evident about what one is speaking. "}, {"ch": 24, "v": 28, "aliyah": 4, "heb": "וַתָּ֙רׇץ֙ הַֽנַּעֲרָ֔ וַתַּגֵּ֖ד לְבֵ֣ית אִמָּ֑הּ כַּדְּבָרִ֖ים הָאֵֽלֶּה׃", "onk": "וּרְהָטַת עוּלֶמְתָּא וְחַוִּיאַת לְבֵית אִמַּהּ כְּפִתְגָּמַיָּא הָאִלֵּין:", "onk_en": "The girl ran and told her mother’s household of these these happenings.", "pj": "וּרְהִיטַת הָרִיבָא וְחַוִי לְבֵית אִימָהּ כְּפִתְגָמָא הָאִילֵין", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>לבית אמה.<\/b> דֶּרֶךְ הַנָּשִׁים הָיְתָה לִהְיוֹת לָהֶן בַּיִת לֵישֵׁב בּוֹ לִמְלַאכְתָּן, וְאֵין הַבַּת מַגֶּדֶת אֶלָּא לְאִמָּהּ:", "rashi_en": "לבית אמה [AND TOLD IT] TO THEM OF HER MOTHER’S HOUSE — It was customary for the women to have their own apartments to sit in at their work — and a daughter, of course, confides only in her mother (Genesis Rabbah 60:7). "}, {"ch": 24, "v": 29, "aliyah": 4, "heb": "וּלְרִבְקָ֥ה אָ֖ח וּשְׁמ֣וֹ לָבָ֑ן וַיָּ֨רׇץ לָבָ֧ן אֶל־הָאִ֛ישׁ הַח֖וּצָה אֶל־הָעָֽיִן׃", "onk": "וּלְרִבְקָה אָחָא וּשְׁמֵיהּ לָבָן וּרְהַט לָבָן לְוַת גַּבְרָא לְבָרָא לְוַת עֵינָא:", "onk_en": "Rivkah had a brother whose name was Lavan, and Lavan ran outside to the man [standing] at the well.", "pj": "וּלְרִבְקָה אָחָא וּשְׁמֵיהּ לָבָן וּרְהַט לָבָן לְוַת גַבְרָא לְבָרָא לְעַיְינָא", "pj_en": "And Rivekah had a brother whose name was Laban. And Laban ran towards the man without at the fountain.", "tj": "", "tj_en": "", "rashi": "<b>וירץ.<\/b> לְמָה רָץ וְעַל מָה רָץ? <b>ויהי כראות את הנזם<\/b>, אָמַר עָשִׁיר הוּא זֶה, וְנָתָן עֵינָיו בַּמָּמוֹן:", "rashi_en": "וירץ AND HE RAN — Why did he run and what did he run for? (The next verse explains why). ויהי כראות הנזם AND IT CAME TO PASS WHEN HE SAW THE RING —he said, “This must be a rich man ״, and he had an eye to his money. "}, {"ch": 24, "v": 30, "aliyah": 4, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> כִּרְאֹ֣ת אֶת־הַנֶּ֗זֶם וְֽאֶת־הַצְּמִדִים֮ עַל־יְדֵ֣י אֲחֹתוֹ֒ וּכְשׇׁמְע֗וֹ אֶת־דִּבְרֵ֞י רִבְקָ֤ה אֲחֹתוֹ֙ לֵאמֹ֔ר כֹּֽה־דִבֶּ֥ר אֵלַ֖י הָאִ֑ישׁ וַיָּבֹא֙ אֶל־הָאִ֔ישׁ וְהִנֵּ֛ה עֹמֵ֥ד עַל־הַגְּמַלִּ֖ים עַל־הָעָֽיִן׃", "onk": "וַהֲוָה כַּד חָזָא יָת קָדָשָׁא וְיָת שֵׁירַיָּא עַל יְדֵי אֲחָתֵיהּ וְכַד שְׁמַע יָת פִּתְגָּמֵי רִבְקָה אֲחָתֵיהּ לְמֵימַר כְּדֵין מַלֵּיל עִמִּי גַּבְרָא וַאֲתָא לְוַת גַּבְרָא וְהָא קָאֵם עִלַּוֵּי גַמְלַיָּא עַל עֵינָא:", "onk_en": "When he had seen the nose ring and the bracelets on the hands of his sister, and heard the words of his sister, Rivkah saying, this is what the man spoke to me, that he [then] came to the man, who was still standing beside the camels at the well.", "pj": "וַהֲוָה כְּדִי חָמָא יַת קָדָשָׁא וְיַת שֵׁרַיָא עַל יְדֵי אַחְתֵיהּ וְכַד שְׁמַע יַת פִּתְגָמֵי רִבְקָה אַחְתֵיהּ לְמֵימָר כְּדוּן מַלֵיל עִמִי גַבְרָא וְאָתָא לְוַת גַבְרָא וְהָא קָאֵי עֲלוֹי גַמְלַיָא עַל עֵינָא", "pj_en": "And when Laban saw the ring and the bracelets upon the hands of his sister, and heard the words of Rivekah his sister, saying, Thus hath the man spoken with me; he came to the man, and behold, he stood by the camels at the fountain.", "tj": "", "tj_en": "", "rashi": "<b>על הגמלים.<\/b> לְשָׁמְרָן, כְּמוֹ וְהוּא עוֹמֵד עֲלֵיהֶם (בראשית י״ח:ח׳), לְשַׁמְּשָׁם:", "rashi_en": "על הגמלים [HE WAS STANDING] BY THE CAMELS — to look after them. The phrase is the same as (18:8) “And he (Abraham) stood by them עומד עליהם\"— to wait on them. "}, {"ch": 24, "v": 31, "aliyah": 4, "heb": "וַיֹּ֕אמֶר בּ֖וֹא בְּר֣וּךְ יְהֹוָ֑ה לָ֤מָּה תַעֲמֹד֙ בַּח֔וּץ וְאָנֹכִי֙ פִּנִּ֣יתִי הַבַּ֔יִת וּמָק֖וֹם לַגְּמַלִּֽים׃", "onk": "וַאֲמַר עוּל בְּרִיכָא דַיְיָ לְמָא אַתְּ קָאֵם בְּבָרָא וַאֲנָא פַּנֵּיתִי בֵיתָא <b>וַאֲתַר כָּשַׁר<\/b> לְגַמְלַיָּא:", "onk_en": "He [Lavan] said, Come, you who are blessed of Adonoy, why are you standing outside? I have emptied the house and [prepared] a [<b>fitting<\/b>] place for the camels.", "pj": "וְחָשִׁיב לָבָן דְהוּא אַבְרָהָם וְאָמַר עוּל בְּרִיכָא דַיְיָ לְמָא אַנְתְּ קָאֵי בְּבָרָא וַאֲנָא פַּנְיַת בֵּיתָא מִפּוּלְחָנָא נוּכְרָאָה וַאֲתַר אַתְקִינַת לְגַמְלַיָא", "pj_en": "And Laban thought that this was Abraham, and said, Come in, thou blessed of the Lord: wherefore standest thou without, when I have purified the house from strange worship, and have prepared a place for the camels?", "tj": "", "tj_en": "", "rashi": "<b>פניתי הבית.<\/b> מֵעֲבוֹדַת אֱלִילִים (בראשית רבה):", "rashi_en": "פניתי הבית I HAVE CLEARED THE HOUSE of idols (Genesis Rabbah 60:7). "}, {"ch": 24, "v": 32, "aliyah": 4, "heb": "וַיָּבֹ֤א הָאִישׁ֙ הַבַּ֔יְתָה וַיְפַתַּ֖ח הַגְּמַלִּ֑ים וַיִּתֵּ֨ן תֶּ֤בֶן וּמִסְפּוֹא֙ לַגְּמַלִּ֔ים וּמַ֙יִם֙ לִרְחֹ֣ץ רַגְלָ֔יו וְרַגְלֵ֥י הָאֲנָשִׁ֖ים אֲשֶׁ֥ר אִתּֽוֹ׃", "onk": "וְעַל גַּבְרָא לְבֵיתָא וּשְׁרָא גַּמְלַיָּא וִיהַב תִּבְנָא וְכִסָּתָא לְגַמְלַיָּא וּמַיָּא לְאַסְחָאָה רַגְלוֹהִי וְרַגְלֵי גֻבְרַיָּא דְּעִמֵּיהּ:", "onk_en": "The man came into the house and unmuzzled the camels. [Lavan] gave the camels straw and fodder, and water to wash his [the man’s] feet and the feet of the men who were with him.", "pj": "וְעַל גַבְרָא לְבֵיתָא וְשָׁרֵי זְמָמֵי גַמְלַיָא וִיהַב (לָבָן) תִּבְנָא וְאַסְפַּסְתָּא לְגַמְלַיָא וּמוֹי לְמִשְׁזוּג רַגְלוֹי וְרַגְלֵי גוּבְרַיָא דִי עִמֵיהּ", "pj_en": "And the man entered the house, and Laban undid the gear of the camels, and gave the camels straw and provender; and water (to Eliezer) to wash his feet, and the feet of the men who were with him.", "tj": "", "tj_en": "", "rashi": "<b>ויפתח.<\/b> הִתִּיר זְמָם שֶׁלָּהֶם, שֶׁהָיָה סוֹתֵם אֶת פִּיהֶם שֶׁלֹא יִרְעוּ בַדֶּרֶךְ בִּשְׂדוֹת אַחֵרִים:", "rashi_en": "ויפתח HE UNGIRDED — He removed their muzzles, for he had closed their mouths by them so that on the journey they might not graze in other peoples’ fields (Genesis Rabbah 60:8). "}, {"ch": 24, "v": 33, "aliyah": 4, "heb": "<span class=\"mam-kq\"><span class=\"mam-kq-k\">(ויישם)<\/span> <span class=\"mam-kq-q\">[וַיּוּשַׂ֤ם]<\/span><\/span> לְפָנָיו֙ לֶאֱכֹ֔ל וַיֹּ֙אמֶר֙ לֹ֣א אֹכַ֔ל עַ֥ד אִם־דִּבַּ֖רְתִּי דְּבָרָ֑י וַיֹּ֖אמֶר דַּבֵּֽר׃", "onk": "וְשַׁוִּיאוּ קֳדָמוֹהִי לְמֵיכָל וַאֲמַר לָא אֵיכוּל עַד דַּאֲמַלֵּל פִּתְגָּמָי וַאֲמַר מַלֵּל:", "onk_en": "Food was set before him, but he said, I will not eat until I have spoken my words. He replied, Speak.", "pj": "וְסַדָרוּ קוּמֵיהּ לְמֵכוּל תַּבְשִׁילָה דְבֵיהּ סַמָא דִקְטוֹל וְאַרְגִישׁ בֵּיהּ וַאֲמַר לָא אֵיכוּל עַד דַאֲמַלֵיל פִּתְגָמָי וַאֲמַר מַלֵיל", "pj_en": "And he set in order before him to eat, prepared food in which was poison to kill; but he objected to it, and said, I will not eat, until I have spoken my words. And he said, Speak.", "tj": "", "tj_en": "", "rashi": "<b>עד אם דברתי.<\/b> הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר וּבִלְשׁוֹן כִּי, כְּמוֹ: עַד כִּי יָבֹא שִׁילֹה (בראשית מ\"ט) וְזֶהוּ שֶׁאָמְרוּ חֲזַ\"ל: כִּי מְשַׁמֵּשׁ בְּד' לְשׁוֹנוֹת, וְהָאֶחָד אִי, וְהוּא אִם:", "rashi_en": "עד אם דברתי UNTIL THAT I HAVE SPOKEN — This is the same as עד אשר, so that you see that אם has the meaning of both אשר and כי, an example of the latter usage being (49:10) “Until that (עד כי) men come to Shiloh” (where עד כי is equivalent to עד אם in our verse). That is what our Sages, of blessed memory, have said (Rosh Hashanah 3a): The word כי is used in four meanings. One of these they say, is אי which is the Aramaic for the Hebrew word \"im\"."}, {"ch": 24, "v": 34, "aliyah": 4, "heb": "וַיֹּאמַ֑ר עֶ֥בֶד אַבְרָהָ֖ם אָנֹֽכִי׃", "onk": "וַאֲמַר עַבְדָּא דְאַבְרָהָם אָנָא:", "onk_en": "He said, I am the servant of Avraham.", "pj": "וַאֲמַר עַבְדָא דְאַבְרָהָם אֲנָא", "pj_en": "And he said, I am the servant of Abraham.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 35, "aliyah": 4, "heb": "וַיהֹוָ֞ה בֵּרַ֧ךְ אֶת־אֲדֹנִ֛י מְאֹ֖ד וַיִּגְדָּ֑ל וַיִּתֶּן־ל֞וֹ צֹ֤אן וּבָקָר֙ וְכֶ֣סֶף וְזָהָ֔ב וַעֲבָדִם֙ וּשְׁפָחֹ֔ת וּגְמַלִּ֖ים וַחֲמֹרִֽים׃", "onk": "וַייָ בָּרִיךְ יָת רִבּוֹנִי לַחֲדָא וּרְבָא וִיהַב לֵיהּ עָאן וְתוֹרִין וּכְסַף וּדְהַב וְעַבְדִּין וְאַמְהָן וְגַמְלִין וַחֲמָרִין:", "onk_en":
