im afterwards. This (my son) did not sell it (his birthright) to Joseph (it must be remembered that Joseph being the founder of two tribes was regarded as the first-born of Jacob’s sons since the eldest son took a double portion in the father’s property), yet he did not raise any protest to him being regarded as the first-born and not only did he not raise a protest but he even wished to take him out of the pit and so rescue him from death (Berakhot 7b). "}, {"ch": 29, "v": 33, "aliyah": 3, "heb": "וַתַּ֣הַר עוֹד֮ וַתֵּ֣לֶד בֵּן֒ וַתֹּ֗אמֶר כִּֽי־שָׁמַ֤ע יְהֹוָה֙ כִּֽי־שְׂנוּאָ֣ה אָנֹ֔כִי וַיִּתֶּן־לִ֖י גַּם־אֶת־זֶ֑ה וַתִּקְרָ֥א שְׁמ֖וֹ שִׁמְעֽוֹן׃", "onk": "וְעַדִּיאַת עוֹד וִילִידַת בָּר וַאֲמֶרֶת <b>אֲרֵי<\/b> שְׁמִיעַ <b>קֳדָם יְיָ<\/b> אֲרֵי שְׂנִיאֲתָא אֲנָא וִיהַב לִי אַף יָת דֵּין וּקְרַת שְׁמֵיהּ שִׁמְעוֹן:", "onk_en": "She conceived again and gave birth to a son. She said, Since Adonoy [<b>it was<\/b>] heard [<b>before Adonoy<\/b>] that I am the hated one, He also gave me this one, and she named him Shimon.", "pj": "וְאִתְעַבָּרַת תּוּב וִילֵידַת בַּר וְאַמְרַת אֲרוּם שְׁמִיעַ קֳדָם יְיָ אֲרוּם שָנֵיתָא אָנָא וִיהַב לִי אוּף יַת דֵין וְהֵיכְדֵין יִשְׁתְּמַע קֳדָמוֹי קָלְהוֹן דְבָנַי כַּד יְהוֹן מִשְׁתַּעְבְּדִין בְּמִצְרַיִם וּקְרַת שְׁמֵיהּ שִׁמְעוֹן", "pj_en": "And she conceived again, and bare a son. And she said, Because it was heard before the Lord that I was hated, and He gave me this also: and so will be heard before Him the voice of my children when they shall be enslaved in Mizraim. And she called his name Shimeon.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 34, "aliyah": 3, "heb": "וַתַּ֣הַר עוֹד֮ וַתֵּ֣לֶד בֵּן֒ וַתֹּ֗אמֶר עַתָּ֤ה הַפַּ֙עַם֙ יִלָּוֶ֤ה אִישִׁי֙ אֵלַ֔י כִּֽי־יָלַ֥דְתִּי ל֖וֹ שְׁלֹשָׁ֣ה בָנִ֑ים עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ לֵוִֽי׃", "onk": "וְעַדִּיאַת עוֹד וִילִידַת בָּר וַאֲמֶרֶת הָדָא זִמְנָא יִתְחַבַּר לִי בַעְלִי אֲרֵי יְלֵידִית לֵיהּ תְּלָתָא בְנִין עַל כֵּן קְרָא שְׁמֵיהּ לֵוִי:", "onk_en": "She conceived again and gave birth to a son. She said, This time my husband will become attached to me, for I have born him three sons. He therefore named him Leivi.", "pj": "וְאִתְעַבְּרַת תּוּב וִילֵידַת בַּר וְאַמְרַת הָדָא זִמְנָא יִתְחַבֵּר עִמִי בַּעֲלִי אֲרוּם יְלֵדִית לֵיהּ תְּלָתָא בְּנִין וְהֵיכְדֵין עֲתִידִין בְּנוֹי לְמֶהֱוֵיהוֹן מִתְחַבְּרִין לְשַׁמָשָׁא קֳדָם יְיָ בְּגִין כֵּן קָרָא שְׁמֵיהּ לֵוִי", "pj_en": "And she conceived again, and bare a son, and said, This time will my husband be united to me, because I have borne him three sons; and thus will it be that my children shall be united to serve before the Lord: therefore she called his name Levi.", "tj": "", "tj_en": "", "rashi": "<b>הפעם ילוה אישי.<\/b> לְפִי שֶׁהָאִמָּהוֹת נְבִיאוֹת הָיוּ, וְיוֹדְעוֹת שֶׁי\"ב שְׁבָטִים יוֹצְאִים מִיַּעֲקֹב וְד' נָשִׁים יִשָּׂא, אָמְרָה, מֵעַתָּה אֵין לוֹ פִתְחוֹן פֶּה עָלַי, שֶׁהֲרֵי נָטַלְתִּי כָּל חֶלְקִי בַּבָּנִים (ברבות ס'):<br><br><b>על כן.<\/b> כָּל מִי שֶׁנֶּאֱמַר בּוֹ עַל כֵּן מְרֻבֶּה בְּאֻכְלוֹסִין, חוּץ מִלֵּוִי שֶׁהָאָרוֹן הָיָה מְכַלֶּה בָּהֶם:<br><br><b>קרא שמו לוי.<\/b> בְּכֻלָּם כְּתִיב וַתִּקְרָא, וְזֶה כָתַב בּוֹ קָרָא, וְיֵשׁ מִ\"אַ בְּאֵלֶּה הַדְּבָרִים רַבָּה שֶׁשָּׁלַח הַקָּבָּ\"ה גַּבְרִיאֵל וֶהֱבִיאוֹ לְפָנָיו וְקָרָא לוֹ שֵׁם זֶה, וְנָתַן לוֹ כ\"ד מַתְּנוֹת כְּהֻנָּה, וְעַל שֵׁם שֶׁלִּוָּהוּ בְמַתָּנוֹת קְרָאוֹ לֵוִי:", "rashi_en": "הפעם ילוה אישי THIS TIME WILL MY HUSBAND BECOME ATTACHED TO ME — Because the Matriarchs were prophetesses and knew that twelve tribes would issue from Jacob and that he would have four wives, she said, “From now he will have no fault to find with me, for I have assumed my full share in giving him children” (Midrash Tanchuma, Vayetzei 9).<br><br>על כן THEREFORE — Wherever in the case of the names given to Jacob’s sons the word “therefore” is used, that tribe had a numerous population (Genesis Rabbah 71:4), Levi forming an exception, because the Ark decimated them.<br><br>קרא שמו לוי [THEREFORE] WAS HIS NAME CALLED LEVI (literally, he called his name) — Of all of them (the sons) it is written “And she called”, but of this one Scripture writes “he called!” There is a Midrashic statement in Deuteronomy Rabbah that the Holy One, blessed be He, sent Gabriel who brought him (Levi) into His presence. He called him by this name and gave him the twenty-four perquisites with which the priesthood was favoured, and because He gave him these perquisites as an accompaniment (לוהו) He called him Levi (accompanied). "}, {"ch": 29, "v": 35, "aliyah": 3, "heb": "וַתַּ֨הַר ע֜וֹד וַתֵּ֣לֶד בֵּ֗ן וַתֹּ֙אמֶר֙ הַפַּ֙עַם֙ אוֹדֶ֣ה אֶת־יְהֹוָ֔ה עַל־כֵּ֛ן קָרְאָ֥ה שְׁמ֖וֹ יְהוּדָ֑ה וַֽתַּעֲמֹ֖ד מִלֶּֽדֶת׃", "onk": "וְעַדִּיאַת עוֹד וִילִידַת בָּר וַאֲמֶרֶת הָדָא זִמְנָא <b>אוֹדֶה קֳדָם<\/b> יְיָ עַל כֵּן קְרַת שְׁמֵיהּ יְהוּדָה וְקָמַת מִלְּמֵילַד:", "onk_en": "She conceived again and gave birth to a son. She said, This time I will [<b>give<\/b>] praise [<b>before<\/b>] Adonoy. She therefore named him Yehudah. She then stopped giving birth.", "pj": "וְאִתְעַבָּרַת תּוּב וִילֵידַת בַּר וַאֲמָרַת הָדָא זִמְנָא אוֹדֵי קֳדָם יְיָ דְמִן בְּרִי דֵין עָתִיד לְמֵיפַּק מַלְכִין וּמִינֵיהּ יִפּוֹק דָוִד מַלְכָּא דְעָתִיד לְאוֹדוּיֵי קֳדָם יְיָ בְּגִין כֵּן קְרָת שְׁמֵיהּ יְהוּדָה וְקָמַת מִלְמֵילַד", "pj_en": "And she conceived again, and bare a son, and said, This time will I give praise before the Lord; for from this my son kings shall come forth, and from him shall spring David the king, who shall offer praise before the Lord; therefore she called his name Jehudah. And she ceased to bear.", "tj": "", "tj_en": "", "rashi": "<b>הפעם אודה.<\/b> שֶׁנָּטַלְתִּי יוֹתֵר מֵחֶלְקִי, מֵעַתָּה יֵשׁ לִי לְהוֹדוֹת:", "rashi_en": "הפעם אודה NOW WILL I PRAISE [THE LORD] — because I have assumed more than my share, from now on I should praise God (Genesis Rabbah 71:4)."}, {"ch": 30, "v": 1, "aliyah": 3, "heb": "וַתֵּ֣רֶא רָחֵ֗ל כִּ֣י לֹ֤א יָֽלְדָה֙ לְיַעֲקֹ֔ב וַתְּקַנֵּ֥א רָחֵ֖ל בַּאֲחֹתָ֑הּ וַתֹּ֤אמֶר אֶֽל־יַעֲקֹב֙ הָֽבָה־לִּ֣י בָנִ֔ים וְאִם־אַ֖יִן מֵתָ֥ה אָנֹֽכִי׃", "onk": "וַחֲזַת רָחֵל אֲרֵי לָא יְלִידַת לְיַעֲקֹב וְקַנִּיאַת רָחֵל בַּאֲחָתַהּ וַאֲמֶרֶת לְיַעֲקֹב הַב לִי בְנִין וְאִם לָא מֵיתָא אֲנָא:", "onk_en": "Rochel saw that she was not bearing children to Yaakov. Rochel became jealous of her sister, and she said to Yaakov, Give me children; if not I am [considered] dead.", "pj": "וַחֲמַת רָחֵל אֲרוּם לָא יְלֵידַת לְיַעֲקב וְקַנִיאַת רָחֵל בַּאֲחָתָהּ וַאֲמָרַת לְיַעֲקב צַלִי קֳדָם יְיָ וִיהַב לִי בְּנִין וְאִין לָא הֵי כְמִיתָא אֲנָא חֲשִיבָא", "pj_en": "And Rahel saw that she bare not to Jakob, and Rahel was envious of her sister, and said to Jakob, Pray before the Lord that He give me children; and if not, my life I shall reckon as the dead.", "tj": "", "tj_en": "", "rashi": "<b>ותקנא רחל באחותה.<\/b> קִנְּאָה בְמַעֲשֶׂיהָ הַטּוֹבִים, אָמְרָה אִלּוּלֵי שֶׁצָּדְקָה מִמֶּנִּי לֹא זָכְתָה לְבָנִים (בראשית רבה):<br><br><b>הבה לי.<\/b> וְכִי כָּךְ עָשָׂה אָבִיךָ לְאִמְּךָ? וְהֲלֹא הִתְפַּלֵּל עָלֶיהָ:<br><br><b>מתה אנכי.<\/b> מִכָּאן לְמִי שֶׁאֵין לוֹ בָנִים שֶׁחָשׁוּב כַּמֵּת (בראשית רבה):", "rashi_en": "ותקנא רחל באחתה RACHEL ENVIED HER SISTER — She was envious of her because of her good deeds, thinking, “Unless she were more righteous than I am she would not have been privileged to bear children (Genesis Rabbah 71:6).”<br><br>הבה לי GIVE ME [CHILDREN ] — Did, then, your father act so towards your mother? Did he not pray on her behalf (Genesis Rabbah 71:6).<br><br>מתה אנכי I AM A DEAD WOMAN — One may infer from this that he who is childless may be regarded as dead (Genesis Rabbah 71:6). "}, {"ch": 30, "v": 2, "aliyah": 3, "heb": "וַיִּֽחַר־אַ֥ף יַעֲקֹ֖ב בְּרָחֵ֑ל וַיֹּ֗אמֶר הֲתַ֤חַת אֱלֹהִים֙ אָנֹ֔כִי אֲשֶׁר־מָנַ֥ע מִמֵּ֖ךְ פְּרִי־בָֽטֶן׃", "onk": "וּתְקֵיף רוּגְזָא דְיַעֲקֹב בְּרָחֵל וַאֲמַר <b>הָא מִנִּי אַתְּ בַּעְיָא הֲלָא מִן קֳדָם יְיָ תִּבְעִין<\/b> דִּי מְנַע מִנִּיךְ וַלְדָא דִמְעִין:", "onk_en": "Yaakov became very angry with Rochel, and he said, Am I in God’s place? [<b>Are you asking me? Is it not from before God that you should ask?<\/b>] [It is He] who has withheld from you the fruit of the womb.", "pj": "וּתְקֵיף רוּגְזָא דְיַעֲקב בְּרָחֵל וַאֲמַר עַד דְאַנְתְּ בַּעְיָא מִנִי בְּעִי מִן קֳדָם יְיָ דְמִן קֳדָמוֹי הִינוּן בְּנַיָא וְהוּא מְנַע מְנִיךְ פְּרִי מֵעַיָא", "pj_en": "And the anger of Jakob was stong against Rahel, and he said, Why do you ask of me? Ask before the Lord, from before whom are children, and who hath restrained from thee the fruit of the womb.", "tj": "", "tj_en": "", "rashi": "<b>התחת.<\/b> וְכִי בִמְקוֹמוֹ אֲנִי?<br><br><b>אשר מנע ממך.<\/b> אַתְּ אוֹמֶרֶת שֶׁאֶעֱשֶׂה כְאַבָּא, אֲנִי אֵינִי כְּאַבָּא, אַבָּא לֹא הָיוּ לוֹ בָנִים, אֲנִי יֵשׁ לִי בָּנִים; מִמֵּךְ מָנַע וְלֹא מִמֶּנִּי:", "rashi_en": "התחת means AM I IN HIS STEAD?<br><br>אשר מנע ממך WHO HATH WITHHELD FROM THEE —You say that I should do as my father did; but I am not circumstanced as my father was. My father had no children at all, I, however, have children. From you He has withheld children and not from me (Genesis Rabbah 71:7). "}, {"ch": 30, "v": 3, "aliyah": 3, "heb": "וַתֹּ֕אמֶר הִנֵּ֛ה אֲמָתִ֥י בִלְהָ֖ה בֹּ֣א אֵלֶ֑יהָ וְתֵלֵד֙ עַל־בִּרְכַּ֔י וְאִבָּנֶ֥ה גַם־אָנֹכִ֖י מִמֶּֽנָּה׃", "onk": "וַאֲמֶרֶת הָא אַמְתִי בִלְהָה עוּל לְוָתַהּ וּתְלִיד וַאֲנָא <b>אֱרַבֵּי וְאֶתְבְּנֵי<\/b> אַף אֲנָא מִנַּהּ:", "onk_en": "She said, Here is my handmaid, Bilhah, consummate a marriage with her. Let her give birth upon my knees [<b>and I will rear them<\/b>], and I too will have a son [<b>be built up<\/b>] through her.", "pj": "וַאֲמָרַת הָא אַמְתִי בִלְהָה עוּל לְוָותָהּ וְתֵילִיד וַאֲנָא אִירַבֵּי וְאִתְבְּנִי אוּף אֲנָא מִינָהּ", "pj_en": "And she said, Behold my handmaid Bilhah, enter with her, that she may bear, and I may increase and may be builded up from her.", "tj": "", "tj_en": "", "rashi": "<b>על ברכי.<\/b> כְּתַרְגּוּמוֹ וַאֲנָא אֱרַבֵּי:<br><br><b>ואבנה גם אנכי.<\/b> מַהוּ גַּם? אָמְרָה לוֹ זְקֶנְךָ אַבְרָהָם הָיוּ לוֹ בָנִים מֵהָגָר וְחָגַר מָתְנָיו כְּנֶגֶד שָׂרָה, אָמַר לָהּ זְקֵנָתִי הִכְנִיסָה צָרָתָהּ לְבֵיתָהּ, אָמְרָה לוֹ אִם הַדָּבָר הַזֶּה מְעַכֵּב, הִנֵּה אֲמָתִי:<br><br><b>ואבנה גם אנכי.<\/b> כְּשָׂרָה:", "rashi_en": "על ברכי UPON MY KNEES — as the Targum takes it: she will bear children and I will rear them.<br><br>ואבנה גם אנכי AND I ALSO MAY HAVE CHILDREN — What force has “also”? She said to him, “Your grandfather, Abraham, had children from Hagar and yet he girded up his loins (actively interceded) for Sarah and she afterwards was blessed with a child”. He replied, “But my grandmother brought an associate wife unto her house”. She retorted, “If that is what prevents me being blessed with children, הנה אמתי BEHOLD MY HANDMAID” etc.<br><br>ואבנה נם אנכי AND I ALSO MAY HAVE CHILDREN through her as Sarah was built up through her handmaid (Genesis Rabbah 71:7). "}, {"ch": 30, "v": 4, "aliyah": 3, "heb": "וַתִּתֶּן־ל֛וֹ אֶת־בִּלְהָ֥ה שִׁפְחָתָ֖הּ לְאִשָּׁ֑ה וַיָּבֹ֥א אֵלֶ֖יהָ יַעֲקֹֽב׃", "onk": "וִיהָבַת לֵיהּ יָת בִּלְהָה אַמְתַהּ לְאִנְתּוּ וְעַל לְוָתַהּ יַעֲקֹב:", "onk_en": "She gave him Bilhah, her handmaid, as a wife and Yaakov consummated the marriage with her.", "pj": "וְשַׁחְרָרַת לֵיהּ יַת אַמְתָהּ בִּלְהָה וּמָסְרָה לֵיהּ לְאִנְתּוּ וְעַל לְוָותָהּ יַעֲקב", "pj_en": "And she made her handmaid Bilhah free, and delivered her to him, and Jakob entered with her.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 5, "aliyah": 3, "heb": "וַתַּ֣הַר בִּלְהָ֔ה וַתֵּ֥לֶד לְיַעֲקֹ֖ב בֵּֽן׃", "onk": "וְעַדִּיאַת בִּלְהָה וִילִידַת לְיַעֲקֹב בָּר:", "onk_en": "Bilhah conceived and bore Yaakov a son.", "pj": "וְאַעֲדִיעַת בִּלְהָה וִילֵידַת לְיַעֲקב בָּר", "pj_en": "And Bilhah conceived, and bare a son to Jakob.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 6, "aliyah": 3, "heb": "וַתֹּ֤אמֶר רָחֵל֙ דָּנַ֣נִּי אֱלֹהִ֔ים וְגַם֙ שָׁמַ֣ע בְּקֹלִ֔י וַיִּתֶּן־לִ֖י בֵּ֑ן עַל־כֵּ֛ן קָרְאָ֥ה שְׁמ֖וֹ דָּֽן׃", "onk": "וַאֲמֶרֶת רָחֵל דְּנַנִּי יְיָ וְאַף <b>קַבִּיל צְלוֹתִי<\/b> וִיהַב לִי בָּר עַל כֵּן קְרַת שְׁמֵיהּ דָּן:", "onk_en": "Rochel said, Elohim has judged me. He has also heard my voice [<b>accepted my prayer<\/b>], and has given me a son. She therefore named him Don.", "pj": "וַאֲמַרַת רָחֵל דָן יְתִי יְיָ בִּרְחִימוֹי טַבְיָא וּלְחוֹד שָׁמַע בְּקוֹל צְלוֹתִי וִיהַב לִי בַּר וְהֵיכְדֵין עָתִיד לְמִידַן עַל יַד שִׁמְשׁוֹן בַּר מָנוֹח דְמִן זַרְעֲיָיתֵיהּ וְלָא מָסַר בִּידֵיהּ יַת עַמָא דִפְלִשְׁתָּאֵי בְּגִין כֵּן קְרַת שְׁמֵיהּ דָן", "pj_en": "And Rahel said, The Lord hath judged me in His good mercies; He hath also heard the voice of my prayer, and given me a son; and so it is to be that He shall judge by the hand of Shimshon bar Manovach, who shall be of his seed; and hath he not delivered into his hand the people of the Philistaee? Therefore she called his name Dan.", "tj": "", "tj_en": "", "rashi": "<b>דנני אלהים.<\/b> דָּנַנִּי וְחִיְּבַנִי וְזִכַּנִי (בראשית רבה):", "rashi_en": "דנני אלהים GOD HATH PRONOUNCED JUDGMENT UPON ME — He judged me and found me guilty; he judged me again and found me guiltless (Genesis Rabbah 71:7). "}, {"ch": 30, "v": 7, "aliyah": 3, "heb": "וַתַּ֣הַר ע֔וֹד וַתֵּ֕לֶד בִּלְהָ֖ה שִׁפְחַ֣ת רָחֵ֑ל בֵּ֥ן שֵׁנִ֖י לְיַעֲקֹֽב׃", "onk": "וְעַדִּיאַת עוֹד וִילִידַת בִּלְהָה אַמְתָא דְרָחֵל בָּר תִּנְיָן לְיַעֲקֹב:", "onk_en": "She conceived again, and Bilhah, Rochel’s handmaid, bore a second son to Yaakov.", "pj": "וְאִתְעַבָּרַת תּוּב וִילֵידַת בִּלְהָה אַמְתָא דְרָחֵל בַּר תִּנְיַין לְיַעֲקב", "pj_en": "And Bilhah the handmaid of Leah conceived again and bare a second son to Jakob.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 8, "aliyah": 3, "heb": "וַתֹּ֣אמֶר רָחֵ֗ל נַפְתּוּלֵ֨י אֱלֹהִ֧ים&thinsp;<small>׀<\/small>&thinsp;נִפְתַּ֛לְתִּי עִם־אֲחֹתִ֖י גַּם־יָכֹ֑לְתִּי וַתִּקְרָ֥א שְׁמ֖וֹ נַפְתָּלִֽי׃", "onk": "וַאֲמֶרֶת רָחֵל <b>קַבִּיל יְיָ בָּעוּתִי בְּאִתְחַנָּנוּתִי בִּצְלוֹתִי חֲמֵידַת דִּיהֵי לִי וְלַד כַּאֲחָתִי אַף אִתְיְהִיב לִי<\/b> וּקְרַת שְׁמֵיהּ נַפְתָּלִי:", "onk_en": "Rochel said, With Elohim’s bonds, I have been joined to my sister, and I have also prevailed [<b>Elohim accepted my request, when I pleaded in my prayer, I desired that I would have offspring like my sister, it was also given to me<\/b>]. She [therefore] called him Naftali.", "pj": "וַאֲמָרַת רָחֵל מְדַחֲקָא דְחִיקִית קֳדָם יְיָ בִּצְלוֹ בְּרַם קַבֵּיל בָּעוּתִי דִיהֵי לִי בַּר כַּאֲחָתִי אוּף יְהַב לִי תְּרֵין וְהֵיכְדֵין עֲתִידִין בְּנוֹי לְאִתְפְּרָקָא מִן יַד בַּעֲלֵי דְבָבֵיהוֹם בְּדַחֲקוּתְהוֹן בִּצְלוֹ קֳדָם יְיָ וּקְרַת שְׁמֵיהּ נַפְתָּלִי", "pj_en": "And Rahel said, With affliction afflicted was I before the Lord in prayer; therefore He hath received my request that I might have a son as my sister, and hath given me two. Even so are my children to be redeemed from the hand of their enemies when they shall afflict themselves in prayer before the Lord; and she called his name Naphtali.", "tj": "", "tj_en": "", "rashi": "<b>נפתולי אלהים.<\/b> מְנַחֵם בֶּן סָרוּק פֵּרְשׁוֹ בְּמַחְבֶּרֶת צָמִיד פָּתִיל, חִבּוּרִים מֵאֵת הַמָּקוֹם נִתְחַבַּרְתִּי עִם אֲחוֹתִי לִזְכּוֹת לְבָנִים. וַאֲנִי מְפָרְשׁוֹ לְשׁוֹן עִקֵּשׁ וּפְתַלְתֹּל (דברים ל\"ב) – נִתְעַקַּשְׁתִּי וְהִפְצַרְתִּי פְצִירוֹת וְנַפְתּוּלִים הַרְבֵּה לַמָּקוֹם, לִהְיוֹת שָׁוָה לַאֲחוֹתִי:<br><br><b>גם יכלתי.<\/b> הִסְכִּים עַל יָדִי; וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן תְּפִלָּה, כְּמוֹ נַפְתּוּלֵי אֱלֹהִים נִתְפַּלְתִּי בַּקָּשׁוֹת הַחֲבִיבוֹת לְפָנָיו; נִתְקַבַּלְתִּי, וְנֶעֱתַרְתִּי כַאֲחוֹתִי:<br><br><b>נפתלתי.<\/b> נִתְקַבְּלָה תְפִלָּתִי, וּמִ\"אַ יֵשׁ רַבִּים בִּלְשׁוֹן נוֹטָרִיקוֹן:", "rashi_en": "נפתולי אלהים WRESTLINGS OF GOD — Menachem ben Seruk explains in his Machbereth (Dictionary) that the word נפתולי is of the same root as פתיל in (Numbers 19:15) “a covering (פתיל) closely bound upon it”, so that the words here mean: By bonds from God have I been joined to my sister (made equal to her) to merit the privilege of having children. I, however, explain it in the same sense as (Deuteronomy 32:5) “perverse and crooked (עקש ופתלתול)”. I have been persistent and have made many importunities and wrestlings with God that I may become like my sister.<br><br>גם יכלתי AND I HAVE PREVAILED — He has yielded to my importunities. Onkelos translated it in the sense of prayer (תפלה), in this way: נפתולי אלהים נפתלתי means prayers that were pleasing to God I offered and I was accepted and was answered like my sister.<br><br>נפתלתי means my prayer was accepted. There are many Midrashic explanations in the manner of Notaricon (i.e. making the letters of the word the initial letters of phrases having reference to the matter in question) (Genesis Rabbah 71:8)."}, {"ch": 30, "v": 9, "aliyah": 3, "heb": "וַתֵּ֣רֶא לֵאָ֔ה כִּ֥י עָמְדָ֖ה מִלֶּ֑דֶת וַתִּקַּח֙ אֶת־זִלְפָּ֣ה שִׁפְחָתָ֔הּ וַתִּתֵּ֥ן אֹתָ֛הּ לְיַעֲקֹ֖ב לְאִשָּֽׁה׃", "onk": "וַחֲזַת לֵאָה אֲרֵי קָמַת מִלְּמֵילַד וּדְבָרַת יָת זִלְפָּה אַמְתַהּ וִיהָבַת יָתַהּ לְיַעֲקֹב לְאִנְתּוּ:", "onk_en": "Leah realized that she was no longer bearing children. She [therefore] took Zilpah, her handmaid, and gave her to Yaakov as a wife.", "pj": "וַחֲמַת לֵאָה אֲרוּם קָמַת מִלְמֵילָד וְשַׁחֲרָרַת יַת זִלְפָּה אַמְתָהּ וִיהָבַת יָתָהּ לְיַעֲקב לְאִנְתּוּ", "pj_en": "And Leah saw that she had ceased from bearing, and she made Zilpha her handmaid free, and gave her unto Jakob to wife.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 10, "aliyah": 3, "heb": "וַתֵּ֗לֶד זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה לְיַעֲקֹ֥ב בֵּֽן׃", "onk": "וִילִידַת זִלְפָּה אַמְתָא דְלֵאָה לְיַעֲקֹב בָּר:", "onk_en": "Zilpah, Leah’s handmaid, bore Yaakov a son.", "pj": "וִילֵידַת זִלְפָּה אַמְתָא דְלֵאָה לְיַעֲקב בָּר", "pj_en": "And Zilpha the handmaid of Leah conceived, and bare Jakob a son;", "tj": "", "tj_en": "", "rashi": "<b>ותלד זלפה.<\/b> בְּכֻלָּן נֶאֱמַר הֵרָיוֹן חוּץ מִזִּלְפָּה, לְפִי שֶׁהָיְתָה בַחוּרָה מִכֻּלָּן וְתִינֹקֶת בְּשָׁנִים וְאֵין הֵרָיוֹן נִכָּר בָּהּ; וּכְדֵי לְרַמּוֹת לְיַעֲקֹב, נְתָנָהּ לָבָן לְלֵאָה, שֶׁלֹּא יָבִין שֶׁמַּכְנִיסִין לוֹ אֶת לֵאָה, שֶׁכָּךְ מִנְהָג לִתֵּן שִׁפְחָה הַגְּדוֹלָה לַגְּדוֹלָה וּקְטַנָּה לַקְּטַנָּה:", "rashi_en": "ותלד זלפה AND ZILPAH BARE — In the case of all Jacob’s wives there is mention of their having been with child (i. e. Scripture states ותהר) except in the case of Zilpah. This was because she was the youngest of all and quite a child in age so that her being with child was not noticeable (Genesis Rabbah 71:9) Laban had given her to Leah in order to deceive Jacob — that he might not perceive that they were bringing Leah to him in marriage — for thus was the custom: to give the elder handmaid to the elder daughter, and the younger handmaid to the younger daughter. "}, {"ch": 30, "v": 11, "aliyah": 3, "heb": "וַתֹּ֥אמֶר לֵאָ֖ה <span class=\"mam-kq\"><span class=\"mam-kq-k\">(בגד)<\/span> <span class=\"mam-kq-q\">[בָּ֣א גָ֑ד]<\/span><\/span> וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ גָּֽד׃", "onk": "וַאֲמֶרֶת לֵאָה אֲתָא גָד וּקְרַת יָת שְׁמֵיהּ גָּד:", "onk_en": "Leah said, Unexpected success has come, and she named him Gad.", "pj": "וַאֲמַרַת לֵאָה אָתָא מַזְלָא טָבָא בְּרַם בְּנוֹי עֲתִידִין לְמֵירוֹת אַחַסַנְתְּהוֹן בְּקַדְמֵיתָא מֵעִבְרָא לְיַרְדְנָא וּקְרַת שְׁמֵיהּ גָד", "pj_en": "and Leah said, Good fortune cometh; his children shall surely inherit their habitation on the east side of Jardena: and she called his name Gad.", "tj": "וַאֲמָרַת לֵאָה אָתָא גַדָא טָבָא דְעָתִיד לְמַגְדְעָא מִשְׁתּוּיֵיהוֹן דְאוּמַיָא וּקְרָת:", "tj_en": "And Leah said, Good success Cometh; for the feastings of the Gentiles are to be cut off: and she called.", "rashi": "<b>בא גד.<\/b> בָּא מַזָּל טוֹב, כְּמוֹ גַּד גַּדִּי וְסָנוּק לָא (שבת ס\"ז), וְדוֹמֶה לוֹ הַעֹרְכִים לַגַּד שֻׁלְחָן (ישעיהו ס\"ה), וּמִ\"אַ שֶׁנּוֹלַד מָהוּל, כְּמוֹ גֹּדּוּ אִילָנָא (דניאל ד'), וְלֹא יָדַעְתִּי עַל מָה נִכְתְּבָה תֵּבָה אַחַת; דָּ\"אַ לָמָּה נִקְרֵאת תֵּבָה אַחַת בָּגָד, כְּמוֹ בָּגַדְתָּ בִּי, כְּשֶׁבָּאתָ אֶל שִׁפְחָתִי, כְּאִישׁ שֶׁבָּגַד בְּאֵשֶׁת נְעוּרִים:", "rashi_en": "בא גד FOR MY HAPPINESS! — Good luck has come, as (Shabbat 67b) “Be lucky, my luck (גד גדי) and tire not”. Similar, also, is (Isaiah 65:11) “That prepare a table for fortune (גד)”. The Midrashic explanation is that he was born with the sign of the covenant upon him. It would then be like (Daniel 4:11) “cut down (גדו) the tree”. I do not know why it (בגד) is written as one word. Another comment on בגד is: why is it read as one word? It may be connected with the root בגד which denotes faithless as though Leah said to Jacob, “You proved faithless to me when you married my handmaid”, like a man who is faithless (בגד) to the wife of his youth). "}, {"ch": 30, "v": 12, "aliyah": 3, "heb": "וַתֵּ֗לֶד זִלְפָּה֙ שִׁפְחַ֣ת לֵאָ֔ה בֵּ֥ן שֵׁנִ֖י לְיַעֲקֹֽב׃", "onk": "וִילִידַת זִלְפָּה אַמְתָא דְלֵאָה בָּר תִּנְיָן לְיַעֲקֹב:", "onk_en": "Zilpah, Leah’s handmaid bore a second son to Yaakov.", "pj": "וִילֵידַת זִלְפָּה אַמְתָא דְלֵאָה בַּר תִּנְיַן לְיַעֲקב", "pj_en": "And Zilpha the handmaid of Leah bare a second son to Jakob.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 13, "aliyah": 3, "heb": "וַתֹּ֣אמֶר לֵאָ֔ה בְּאׇשְׁרִ֕י כִּ֥י אִשְּׁר֖וּנִי בָּנ֑וֹת וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ אָשֵֽׁר׃", "onk": "וַאֲמֶרֶת לֵאָה <b>תֻּשְׁבַּחְתָּא הֲוַת לִי אֲרֵי בְכֵן יְשַׁבְּחֻנַּנִי נְשַׁיָּא<\/b> וּקְרַת יָת שְׁמֵיהּ אָשֵׁר:", "onk_en": "Leah said, It is in my good fortune that daughters [women] will consider me fortunate. [<b>Praise is mine, because women will praise me from now.<\/b>] She named him Asher.", "pj": "וַאֲמַרַת לֵאָה תּוּשְׁבַּחְתָּא הֲוַת לִי אֲרוּם שַׁבָּחוּ לִי בְּנַת יִשְרָאֵל וְהֵיכְדֵין עֲתִידִין בְּנוֹי לְשַׁבָּחָא קֳדָם יְיָ עַל טַב פֵּירֵי אַרְעֲהוֹם וּקְרַת יַת שְׁמֵיהּ אָשֵׁר", "pj_en": "And Leah said, Praise shall be mine: for the daughters of Israel will praise me, as his children will be praised before the Lord for the goodness of the fruit of his land; and she called his name Asher.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 14, "aliyah": 4, "heb": "וַיֵּ֨לֶךְ רְאוּבֵ֜ן בִּימֵ֣י קְצִיר־חִטִּ֗ים וַיִּמְצָ֤א דֽוּדָאִים֙ בַּשָּׂדֶ֔ה וַיָּבֵ֣א אֹתָ֔ם אֶל־לֵאָ֖ה אִמּ֑וֹ וַתֹּ֤אמֶר רָחֵל֙ אֶל־לֵאָ֔ה תְּנִי־נָ֣א לִ֔י מִדּוּדָאֵ֖י בְּנֵֽךְ׃", "onk": "וַאֲזַל רְאוּבֵן בְּיוֹמֵי חֲצַד חִטִּין וְאַשְׁכַּח יַבְרוּחִין בְּחַקְלָא וְאַיְתִי יָתְהוֹן לְלֵאָה אִמֵּיהּ וַאֲמֶרֶת רָחֵל לְלֵאָה הָבִי <b>כְעַן<\/b> לִי מִיַּבְרוּחֵי דִּבְרִיךְ:", "onk_en": "Reuvein went in the days of the wheat harvest, and found jasmine flowers in the field. He brought them to Leah, his mother. Rochel said to Leah, Please [<b>Now<\/b>] give me some of your son’s jasmine flowers.", "pj": "וְאָזַל רְאוּבֵן בְּיוֹמֵי סִיוָן בִּזְמַן חֲצַד חִיטִין וְאַשְׁכַּח יַבְרוּחִין בְּחַקְלָא וְאַיְיתִי יַתְהוֹם לְלֵאָה אִמֵיהּ וַאֲמַרַת רָחֵל לְלֵאָה הֲבִי כְדוּן לִי מִן יַבְרוּחֵי דִבְרִיךְ", "pj_en": "And Reuben went in the days of Sivan, in the time of wheat harvest, and found (Yaveruchin) mandrakes in the field; and he brought them to Leah his mother. And Rahel said to Leah, Give me now of thy son's mandrakes.", "tj": "", "tj_en": "", "rashi": "<b>בימי קציר חטים.<\/b> לְהַגִּיד שִׁבְחָן שֶׁל שְׁבָטִים; שְׁעַת הַקָּצִיר הָיָה וְלֹא פָשַׁט יָדוֹ בַגֶּזֶל לְהָבִיא חִטִּים וּשְׂעוֹרִים, אֶלָּא דְּבַר הַהֶפְקֵר, שֶׁאֵין אָדָם מַקְפִּיד בּוֹ:<br><br><b>דודאים.<\/b> סִיגְלִי, עֵשֶׂב הוּא (סנהדרין צ\"ט), וּבִלְשׁוֹן יִשְׁמָעֵאל יַסְמִי\"ן:", "rashi_en": "בימי קציר חטים IN THE DAYS OF WHEAT HARVEST — This is stated in praise of the tribes (שבטים a common term for Jacob’s twelve sons, the ancestors of the Tribes of Israel): it was harvest-time, yet he (Reuben) did not put forth his hand upon private property (literally, that which is stolen) by bringing home wheat or barley, but he brought home only ownerless things (such as were free for all to take) about which no one is particular (Genesis Rabbah 72:2).<br><br>דודאים are violets: it is a plant. In Arabic it is called Jasmin."}, {"ch": 30, "v": 15, "aliyah": 4, "heb": "וַתֹּ֣אמֶר לָ֗הּ הַמְעַט֙ קַחְתֵּ֣ךְ אֶת־אִישִׁ֔י וְלָקַ֕חַת גַּ֥ם אֶת־דּוּדָאֵ֖י בְּנִ֑י וַתֹּ֣אמֶר רָחֵ֗ל לָכֵן֙ יִשְׁכַּ֤ב עִמָּךְ֙ הַלַּ֔יְלָה תַּ֖חַת דּוּדָאֵ֥י בְנֵֽךְ׃", "onk": "וַאֲמֶרֶת לַהּ הַזְעֵיר דִּדְבַרְתְּ יָת בַּעְלִי וְתִסְּבִין אַף יָת יַבְרוּחֵי דִּבְרִי וַאֲמֶרֶת רָחֵל בְּכֵן יִשְׁכּוּב עִמָךְ בְּלֵילְיָא חֳלַף יַבְרוּחֵי דִבְרִיךְ:", "onk_en": "She [Leah] said to her, Isn’t it enough that you took my husband? Would you also take my son’s jasmine flowers? Rochel said, Therefore, he shall be with you tonight in exchange for your son’s jasmine flowers.", "pj": "וַאֲמַרַת לָהּ הַזְעֵיר הוּא דִנְסִיבַת יַת בַּעֲלִי וְאַנְתְּ בַּעְיָא לְמֵיסַב אוּף יַת יַבְרוּחֵי דִבְרִי וַאֲמַרַת רָחֵל בְּגִין כֵּן יִשְׁכּוּב עִמָךְ בְּלֵילְיָא הָדֵין חוֹלַף יַבְרוּחֵי דִבְרִיךְ", "pj_en": "And she said to her, Is it a little thing that thou hast taken my husband, and thou seekest to take also my son's mandrakes? And Rahel said, Therefore shall he lie with thee this night for thy son's mandrakes.", "tj": "בִּשְׁבוּעָה יִזְדַמֵן לְוָתִיךְ:", "tj_en": "For a week he shall consort with thee.", "rashi": "<b>ולקחת גם את דודאי בני.<\/b> בִּתְמִיהָ, וְלַעֲשׂוֹת עוֹד זֹאת לִקַּח גַם אֶת דּוּדָאֵי בְּנִי; וְתַרְגּוּמוֹ וּלְמֵיסַב:<br><br><b>לכן ישכב עמך הלילה.<\/b> שֶׁלִּי הָיְתָה שְׁכִיבַת לַיְלָה זוֹ, וַאֲנִי נוֹתְנָה לָךְ תַּחַת דּוּדָאֵי בְנֵךְ, וּלְפִי שֶׁזִּלְזְלָה בְּמִשְׁכַּב הַצַּדִּיק לֹא זָכְתָה לְהִקָּבֵר עִמּוֹ (נדה ל\"א):", "rashi_en": "Is it a small matter that thou hast taken my husband and that thou wouldst do this in addition — TO TAKE MY SON’S MANDRAKES ALSO? It should therefore be translated in the Targum by ולמיטב, the infinitive like the Hebrew infinitive ולקחת “and to take.”<br><br>לכן ישכב עמך הלילה THEREFORE SHALL HE BE WITH THEE TONIGHT —He should have stayed this night with me but I cede it to you in return for your son’s mandrakes. Because she thought lightly of companionship with so righteous a man she was not privileged to be buried together with him  (Genesis Rabbah 72:3). "}, {"ch": 30, "v": 16, "aliyah": 4, "heb": "וַיָּבֹ֨א יַעֲקֹ֣ב מִן־הַשָּׂדֶה֮ בָּעֶ֒רֶב֒ וַתֵּצֵ֨א לֵאָ֜ה לִקְרָאת֗וֹ וַתֹּ֙אמֶר֙ אֵלַ֣י תָּב֔וֹא כִּ֚י שָׂכֹ֣ר שְׂכַרְתִּ֔יךָ בְּדוּדָאֵ֖י בְּנִ֑י וַיִּשְׁכַּ֥ב עִמָּ֖הּ בַּלַּ֥יְלָה הֽוּא׃", "onk": "וַאֲתָא (<small>נ\"א<\/small> וְעַל) יַעֲקֹב מִן חַקְלָא בְּרַמְשָׁא וּנְפָקַת לֵאָה לְקַדָּמוּתֵיהּ וַאֲמֶרֶת לְוָתִי תֵיעוֹל אֲרֵי מֵיגַר אֲגַרְתִּיךְ בְּיַבְרוּחֵי דִּבְרִי וּשְׁכִיב עִמַּהּ בְּלֵילְיָא הוּא:", "onk_en": "Yaakov came from the field in the evening, and Leah went out to meet him. She said, You will come to me, for I have hired you with my son’s jasmine flowers, and he was with her at night.", "pj": "וְעַל יַעֲקב מִן חַקְלָא בְּרַמְשָׁא וּשְׁמָעַת לֵאָה קַל נְהִיקֵיהּ דְחַמְרָא וִידָעַת דְהָא יַעֲקב אָתָא וּנְפָקַת לֵאָה לִקְדָמוּתֵיהּ וַאֲמַרַת לְוָתִי תֵעוּל אֲרוּם מֵיגַר אֲגַרְתִּיךְ בְּיַבְרוּחֵי דִבְרִי מִן רָחֵל אַחְתִי וּשְׁכִיב עִמָהּ בְּלֵילְיָא הַהִיא", "pj_en": "And Jakob came from the field at evening. And Leah heard the voice of the braying of the ass, and knew that Jakob had come, and Leah went forth to meet him, and said, Thou wilt enter with me, because hiring I have hired thee with my son's mandrakes from Rahel my sister.", "tj": "", "tj_en": "", "rashi": "<b>שכר שכרתיך.<\/b> נָתַתִּי לְרָחֵל שְׂכָרָהּ:<br><br><b>בלילה הוא.<\/b> הַקָּבָּ\"ה סִיְּעוֹ, שֶׁיָּצָא מִשָּׁם יִשָּׂשכָר (בראשית רבה):", "rashi_en": "שכר שכרתיך FOR SURELY I HAVE HIRED THEE — I have given Rachel the hire she demanded.<br><br>בלילה הוא THAT NIGHT — With God’s help Isaachar was born (Niddah 31a, and cf. Genesis Rabbah 99)."}, {"ch": 30, "v": 17, "aliyah": 4, "heb": "וַיִּשְׁמַ֥ע אֱלֹהִ֖ים אֶל־לֵאָ֑ה וַתַּ֛הַר וַתֵּ֥לֶד לְיַעֲקֹ֖ב בֵּ֥ן חֲמִישִֽׁי׃", "onk": "<b>וְקַבִּיל<\/b> יְיָ <b>צְלוֹתַהּ<\/b> דְּלֵאָה וְעַדִּיאַת וִילִידַת לְיַעֲקֹב בַּר חֲמִישָׁאִי:", "onk_en": "Elohim perceived [<b>accepted<\/b>] Leah’s [wish] [<b>prayer<\/b>]. She conceived and bore [her] fifth son to Yaakov.", "pj": "וְקַבֵּיל יְיָ צְלוּתָא דְלֵאָה וְאִתְעַבָּרַת וִילֵידַת לְיַעֲקב בַּר חֲמִישָׁאֵי", "pj_en": "And he lay with her that night. And the Lord heard the prayer of Leah, and she conceived, and bare to Jakob a fifth son.", "tj": "", "tj_en": "", "rashi": "<b>וישמע אלהים אל לאה.<\/b> שֶׁהָיְתָה מִתְאַוָּה וּמְחַזֶּרֶת לְהַרְבּוֹת שְׁבָטִים:", "rashi_en": "וישמע אלהים אל לאה AND GOD HEARKENED UNTO LEAH —for she eagerly desired and sought means to increase the number of the tribes (Genesis Rabbah 72:5)."}, {"ch": 30, "v": 18, "aliyah": 4, "heb": "וַתֹּ֣אמֶר לֵאָ֗ה נָתַ֤ן אֱלֹהִים֙ שְׂכָרִ֔י אֲשֶׁר־נָתַ֥תִּי שִׁפְחָתִ֖י לְאִישִׁ֑י וַתִּקְרָ֥א שְׁמ֖וֹ יִשָּׂשכָֽר׃", "onk": "וַאֲמֶרֶת לֵאָה יְהַב יְיָ אַגְרִי דִּיהָבִית אַמְתִי לְבַעְלִי וּקְרַת שְׁמֵיהּ יִשָּׂשׂכָר:", "onk_en": "Leah said, Elohim has given me my reward because I gave my handmaid to my husband. She named him Yissachar.", "pj": "וַאֲמַרַת לֵאָה יְהַב יְיָ אַגְרִי דִיהָבַת אַמְתִי לְבַעֲלִי וְהֵיכְדֵין עֲתִידִין בְּנוֹי לְקַבָּלָא אֲגַר טַב עַל דְאִינוּן עַסִיקִין בְּאוֹרַיְיתָא וּקְרָא יַת שְׁמֵיהּ יִשָשׁכָר", "pj_en": "And Leah said, The Lord hath given me my reward, for that I gave my handmaid to my husband; even so shall his children receive a good reward, because they will occupy themselves with the law. And she called his name Issakar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 19, "aliyah": 4, "heb": "וַתַּ֤הַר עוֹד֙ לֵאָ֔ה וַתֵּ֥לֶד בֵּן־שִׁשִּׁ֖י לְיַעֲקֹֽב׃", "onk": "וְעַדִּיאַת עוֹד לֵאָה וִילִידַת בַּר שִׁתִיתָאִי לְיַעֲקֹב:", "onk_en": "Leah conceived again and bore [her] sixth son to Yaakov.", "pj": "וְאִתְעֲבָּרַת תּוּב לֵאָה וִילֵידַת בַּר שְׁתִיתָאֵי לְיַעֲקב", "pj_en": "And Leah conceived again, and bare a sixth son to Jakob;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 20, "aliyah": 4, "heb": "וַתֹּ֣אמֶר לֵאָ֗ה זְבָדַ֨נִי אֱלֹהִ֥ים&thinsp;<small>׀<\/small>&thinsp;אֹתִי֮ זֵ֣בֶד טוֹב֒ הַפַּ֙עַם֙ יִזְבְּלֵ֣נִי אִישִׁ֔י כִּֽי־יָלַ֥דְתִּי ל֖וֹ שִׁשָּׁ֣ה בָנִ֑ים וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ זְבֻלֽוּן׃", "onk": "וַאֲמֶרֶת לֵאָה יְהַב יְיָ יָתֵיהּ לִי חֳלַק טַב הָדָא זִמְנָא יְהֵי מְדוֹרֵיהּ דְּבַעְלִי לְוָתִי אֲרֵי יְלֵידִית לֵיהּ שִׁתָּא בְנִין וּקְרַת יָת שְׁמֵיהּ זְבֻלוּן:", "onk_en": "Leah said, Elohim has given [<b>me<\/b>] a goodly portion. Now my husband will make his [main] home with me, for I have borne him six sons. She named him Zevulun.", "pj": "וַאֲמַרַת לֵאָה עָבַד יָתִי יְיָ זְבוּדִין טָבִין מִבְּנִין זִמְנָא הָדָא יְהֵי מְדוֹרֵיהּ דְבַעֲלִי עִמִי אֲרוּם יְלִידַת לֵיהּ שִׁיתָּא בְנִין וְהֵיכְדִין עֲתִידִין בְּנוֹי לְקַבָּלָא חוּלַק טַב וּקְרַת יַת שְׁמֵיהּ זְבוּלוּן", "pj_en": "and said, The Lord hath endowed me with a good dowry by children. This time will the habitation of my husband be with me, because I have borne him six sons: and thus shall his children receive a good portion. And she called his name Zebulun.", "tj": "", "tj_en": "", "rashi": "<b>זבד טוב.<\/b> כְּתַרְגּוּמוֹ:<br><br><b>יזבלני.<\/b> לְ' בֵּית זְבֻל (מלכים א ח' י\"ג), הירבריי\"א בְּלַעַז, בֵּית מָדוֹר, מֵעַתָּה לֹא תְהֵא עִקַּר דִּירָתוֹ אֶלָּא עִמִּי שֶׁיֵּשׁ לִי בָנִים כְּנֶגֶד כָּל נָשָׁיו:", "rashi_en": "זבד טוב A GOOD DOWRY — explain it as the Targum renders it: a good portion.<br><br>יזבלני WILL RESIDE WITH ME — It has the same meaning as (1 Kings 8:13) “a house for dwelling (זבול)”. In old French herbergerie, a dwelling house. Leah meant: From now on his real home will be with me since I have as many children as all his other wives together. "}, {"ch": 30, "v": 21, "aliyah": 4, "heb": "וְאַחַ֖ר יָ֣לְדָה בַּ֑ת וַתִּקְרָ֥א אֶת־שְׁמָ֖הּ דִּינָֽה׃", "onk": "וּבָתַר כֵּן יְלִידַת בְּרַתָּא וּקְרַת יָת שְׁמַהּ דִּינָה:", "onk_en": "Afterwards she gave birth to a daughter, and named her Deenah.", "pj": "וּמִן בָּתַר כְּדֵין יְלֵידַת בְּרַת וּקְרַת יַת שְׁמָהּ דִינָה אֲרוּם אַמְרַת דִין הוּא מִן קֳדָם יְיָ דִיהוֹן מִנִי פַּלְגוּת שִׁבְטַיָא בְּרַם מִן רָחֵל אַחֲתִי יִפְקוּן תְּרֵין שִׁבְטִין הֵיכְמָא דִנְפָקוּ מִן חָדָא מִן אַמְהָתָא וּשְׁמִיעַ מִן קֳדָם יְיָ צְלוּתָא דְלֵאָה וְאִיתְחַלְפוּ עוּבָּרַיָא בִּמְעֵיהוֹן וַהֲוָה יָהִיב יוֹסֵף בִּמְעָהָא דְרָחֵל וְדִינָא בִּמְעָהָא דְלֵאָה", "pj_en": "And afterward she bare a daughter, and called her name Dinah; for she said, Judgement is from before the Lord, that there shall be from me a half of the tribes; but from Rahel my sister shall go forth two tribes, even as they shall proceed (in like manner) from each of the handmaids. And the prayer of Leah was heard before the Lord; and the infants were changed In their wombs; and Joseph was given to the womb of Rahel, and Dinah to the womb of Leah.", "tj": "", "tj_en": "", "rashi": "<b>דינה.<\/b> פֵּרְשׁוּ רַבּוֹתֵינוּ שֶׁדָּנָה לֵאָה דִּין בְּעַצְמָהּ, אִם זֶה זָכָר לֹא תְהֵא רָחֵל אֲחוֹתִי כְּאַחַת הַשְּׁפָחוֹת, וְהִתְפַּלְּלָה עָלָיו וְנֶהְפַּךְ לִנְקֵבָה (ברכות ס'):", "rashi_en": "דינה DINAH (Judgment) — Our Rabbis explained, that Leah set herself up as judge (דנה) against herself saying: “If this be a son, my sister Rachel cannot be even the equal of any of the handmaids”. She, therefore, offered prayer regarding it, and its sex was changed (Berakhot 60a). "}, {"ch": 30, "v": 22, "aliyah": 4, "heb": "וַיִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת־רָחֵ֑ל וַיִּשְׁמַ֤ע אֵלֶ֙יהָ֙ אֱלֹהִ֔ים וַיִּפְתַּ֖ח אֶת־רַחְמָֽהּ׃", "onk": "<b>וְעַל דּוּכְרָנָא דְרָחֵל קֳדָם יְיָ וְקַבִּיל צְלוֹתַהּ יְיָ וִיהַב לַהּ עִדּוּי<\/b>:", "onk_en": "Elohim remembered Rochel [<b>The remembrance of Rochel came before Elohim, and Elohim perceived her plight<\/b>] [<b>accepted her prayer<\/b>] and opened her womb [<b>allowed her to conceive<\/b>].", "pj": "וְעַל דוּכְרָנָא דְרָחֵל קֳדָם יְיָ וּשְׁמִיעַ קֳדָמוֹי קַל צְלוּתָהּ וְאָמַר בְּמֵימְרֵיהּ לְמִתַּן לָהּ בְּנִין", "pj_en": "And the remembrance of Rahel came before the Lord, and the voice of her prayer was heard before Him; and He said in his Word that He would give her sons.", "tj": "אַרְבָּעָה מַפְתֵּחִין דְאִינוּן מְסִירִין בְּיַד רִבּוֹן כָּל עַלְמָא יְיָ וְלָא מְסַר יַתְהוֹן לָא לְמַלְאָךְ וְלָא לְשָרָף מַפְתֵּחַ מִטְרָא מַפְתֵּחַ פַּרְנָסָה מַפְתֵּחַ קִבְרַיָא מַפְתֵּחַ עֲקַרְתָּא: מַפְתֵּחַ מִטְרָא דְכֵן כָּתְבָא מְפָרַשׁ יִפְתַּח יְיָ לְךָ אֶת אוֹצָרוֹ הַטוֹב וגו': מַפְתֵּחַ פַּרְנָסָה דְכֵן כָּתְבָא מְפָרַשׁ פּוֹתֵח אֶת יָדֶיךָ וגו': מַפְתֵּחַ קִבְרַיָא דְכֵן כָּתְבָא מְפָרַשׁ בְּפָּתְחִי אֶת קִבְרוֹתֵיכֶם וגו': מַפְתֵּחַ עֲקַרְתָּא דְכֵן כָּתְבָא מְפָרַשׁ וַיִזְכּוֹר אֱלהִים אֶת רָחֵל וגו': וְאִדְכַּר מֵימְרָא דַיְיָ בְּרַחֲמוֹי טַבְיָא יַת רָחֵל וּשְׁמִיעַ מֵימְרָא דַיְיָ בְּקַל צְלוֹתָהּ וַאֲמַר בְּמֵימְרֵיהּ לְמִיתַּן לָהּ בְּנִין:", "tj_en": "Four keys are held in the hand of the Lord of all the world, even the Lord, and He will not deliver them either to angel or to saraph; the key of the rain, the key of the provender, the key of the sepulchre, the key of barrenness. The key of rain : for thus the Scripture expoundeth, The Lord shall open unto thee His good treasure. The key of provender: for thus the Scripture expoundeth, Thou openest thine hand. The key of the sepulchre: for thus the Scripture expoundeth, When I shall open your sepulchre. The key of barrenness Scripture expoundeth, And Elohim remebered Rahel. And the Word of the Lord remembered Rahel in His good compassions, and the Word of the Lord heard the voice of her prayer, and He said in His Word that He would give her children.", "rashi": "<b>ויזכור אלהים את רחל.<\/b> זָכַר לָהּ שֶׁמָּסְרָה סִימָנֶיהָ לַאֲחוֹתָהּ וְשֶׁהָיְתָה מְצֵרָה שֶׁמָּא תַּעֲלֶה בְּגוֹרָלוֹ שֶׁל עֵשָׂו, שֶׁמָּא יְגָרְשֶׁנָּה יַעֲקֹב לְפִי שֶׁאֵין לָהּ בָּנִים, וְאַף עֵשָׂו הָרָשָׁע כָּךְ עָלָה בְּלִבּוֹ כְּשֶׁשָּׁמַע שֶׁאֵין לָהּ בָּנִים; הוּא שֶׁיִּסֵּד הַפַּיָּט הָאַדְמוֹן כְּבָט שֶׁלֹּא חָלָה, צָבָה לְקַחְתָּהּ לוֹ וְנִתְבֶּהָלָה:", "rashi_en": "ויזכר אלהים את רחל AND GOD REMEMBERED RACHEL — He remembered it to her as a merit that she had transmitted the secret signs to her sister and that she was greatly troubled lest she should fall to Esau’s lot if Jacob were to divorce her because she was childless. Indeed, this had entered Esau’s mind when he heard that she was childless  (Genesis Rabbah 73:4). The poet refers to this in his Composition (for the First Day of the New Year) “When the Ruddy One (Esau) perceived that she did not travail with child, he hoped to take her for himself and she became terrified”. "}, {"ch": 30, "v": 23, "aliyah": 4, "heb": "וַתַּ֖הַר וַתֵּ֣לֶד בֵּ֑ן וַתֹּ֕אמֶר אָסַ֥ף אֱלֹהִ֖ים אֶת־חֶרְפָּתִֽי׃", "onk": "וְעַדִּיאַת וִילִידַת בָּר וַאֲמֶרֶת כְּנַשׁ יְיָ יָת חִסּוּדִי:", "onk_en": "She conceived and gave birth to a son. She said, Elohim has removed my shame.", "pj": "וְאִיתְעַבָּרַת וִילֵידַת בַּר וַאֲמָרַת כְּנַשׁ יְיָ יַת חִיסוּדִי וְהֵיכְדֵין עָתִיד יְהוֹשֻׁעַ בְּרֵיהּ דְיוֹסֵף לְמִכְנוֹש יַת חִיסוּדָא דְמִצְרַיִם מֵעַל בְּנֵי יִשְׁרָאֵל וּלְמִגְזַר יַתְהוֹם מֵעִיבְרָא לְיַרְדְנָא", "pj_en": "And she conceived and, bare a son, and said, The Lord hath gathered off my reproach, even as Jehoshua the son of Joseph will gather off the reproach of Mizraim from the sons of Israel, and will circumcise them beyond Jardena.", "tj": "", "tj_en": "", "rashi": "<b>אסף.<\/b> הִכְנִיסָהּ בְּמָקוֹם שֶׁלֹּא תֵרָאֶה, וְכֵן אֱסֹף חֶרְפָּתֵנוּ (ישעיהו ד'), וְלֹא יֵאָסֵף הַבַּיתָה (שמות ט'), אָסְפוּ נָגְהָם (יואל ד'), וִירֵחֵךְ לֹא יֵאָסֵף (ישעיהו ס') – לֹא יִטָּמֵן:<br><br><b>חרפתי.<\/b> שֶׁהָיִיתִי לְחֶרְפָּה שֶׁאֲנִי עֲקָרָה וְהָיוּ אוֹמְרִים עָלַי שֶׁאֱעֶלֶה לְחֶלְקוֹ שֶׁל עֵשָׂו הָרָשָׁע. וְאַגָּדָה: כָּל זְמַן שֶׁאֵין לָאִשָּׁה בֵּן, אֵין לָהּ בְּמִי לִתְלוֹת סִרְחוֹנָהּ, מִשֶּׁיֵשׁ לָהּ בֵּן תּוֹלָה בוֹ: מִי שִׁבֵּר כְּלִי זֶה? בִּנְךָ. מִי אָכַל תְּאֵנִים אֵלּוּ? בִּנְךָ:", "rashi_en": "אסף [GOD] HATH TAKEN AWAY [MY DISGRACE] — He has laid it up somewhere where it cannot be seen. Similar examples are (Isaiah 4:1) “Take thou away (אסוף) our reproach”; (Exodus 9:19) “and shall not have been taken away (יאסף) into the house “; (Joel 4:13) “withdraw (אספו) their shining”; (Isaiah 60:20) “neither shall thy moon withdraw itself (יאסף) — meaning shall not hide itself.<br><br>חרפתי DISGRACE — because I had become an object of reproach as I was barren for people said about me that I would fall to the lot of Esau, the wicked. A Midrashic explanation is (Genesis Rabbah 73:5): So long as a woman has no child she has no-one to blame for her faults; when, however, she has a child, she puts it on him. “Who broke this vessel?” “Your son!” “Who ate those figs?” “Your son!” "}, {"ch": 30, "v": 24, "aliyah": 4, "heb": "וַתִּקְרָ֧א אֶת־שְׁמ֛וֹ יוֹסֵ֖ף לֵאמֹ֑ר יֹסֵ֧ף יְהֹוָ֛ה לִ֖י בֵּ֥ן אַחֵֽר׃", "onk": "וּקְרַת יָת שְׁמֵיהּ יוֹסֵף לְמֵימָר יוֹסֵף יְיָ לִי בַּר אָחֳרָן:", "onk_en": "She named him Yoseif, saying, May Adonoy add to me another son.", "pj": "וּקְרַת יַת שְׁמֵיהּ יוֹסֵף לְמֵימָר יוֹסִיף יְיָ לִי עַל דֵין בַּר אוֹחֲרָן", "pj_en": "And she called his name Joseph, saying, The Lord will add me yet another son to this one.", "tj": "", "tj_en": "", "rashi": "<b>יסף ה' לי בן אחר.<\/b> יוֹדַעַת הָיְתָה בִנְבוּאָה שֶׁאֵין יַעֲקֹב עָתִיד לְהַעֲמִיד אֶלָּא שְׁנֵים עָשָׂר שְׁבָטִים, אָמְרָה יְהִי רָצוֹן שֶׁאוֹתוֹ שֶׁהוּא עָתִיד לְהַעֲמִיד יְהֵא מִמֶּנִּי, לְכָךְ לֹא נִתְפַּלְּלָה אֶלָּא עַל בֵּן אַחֵר:", "rashi_en": "יסף ה' לי בן אחר THE ETERNAL WILL ADD TO ME ANOTHER SON — She knew prophetically that Jacob would rear only twelve tribes. She therefore prayed: “May it be God’s will that the tribe which he is yet destined to rear may issue from me”. For this reason she prayed only for one other son (Genesis Rabbah 72:6). "}, {"ch": 30, "v": 25, "aliyah": 4, "heb": "וַיְהִ֕י כַּאֲשֶׁ֛ר יָלְדָ֥ה רָחֵ֖ל אֶת־יוֹסֵ֑ף וַיֹּ֤אמֶר יַעֲקֹב֙ אֶל־לָבָ֔ן שַׁלְּחֵ֙נִי֙ וְאֵ֣לְכָ֔ה אֶל־מְקוֹמִ֖י וּלְאַרְצִֽי׃", "onk": "וַהֲוָה כַּד יְלִידַת רָחֵל יָת יוֹסֵף וַאֲמַר יַעֲקֹב לְלָבָן שַׁלְּחַנִי וְאֵיהַךְ לְאַתְרִי וּלְאַרְעִי:", "onk_en": "When Rochel had given birth to Yoseif, Yaakov said to Lavan, Send me on my way, and I will go to my own place and to my homeland.", "pj": "וַהֲוָה כְּדִי יְלֵידַת רָחֵל יַת יוֹסֵף וַאֲמַר יַעֲקב בְּרוּחַ קוּדְשָׁא דְבֵית יוֹסֵף עֲתִידִין לְמֶהֱוֵי כְּשַׁלְהוֹבִיתָא לְגַמְרָא יַת דְבֵית עֵשָו אָמַר מִכְּעַן לֵית אֲנָא מִסְתְּפֵי מִן עֵשָו וְלִגְיוֹנוֹ וַאֲמַר לְלָבָן שַׁלְחֵנִי וְאֵיהַךְ לְאַתְרִי וּלְאַרְעִי", "pj_en": "And it was when Rahel had borne Joseph, Jakob said by the Holy Spirit concerning the house of Joseph, They are to be as a flame to consume the house of Esau; and he said, Therefore will I not be afraid of Esau and his legions. And he, said unto Laban, Send me away, and I will go to my place and to my country.", "tj": "", "tj_en": "", "rashi": "<b>כאשר ילדה רחל את יוסף.<\/b> מִשֶּׁנּוֹלַד שְׂטָנוֹ שֶׁל עֵשָׂו, שֶׁנֶּאֱמַר וְהָיָה בֵית יַעֲקֹב אֵשׁ וּבֵית יוֹסֵף לֶהָבָה וּבֵית עֵשָׂו לְקַשׁ (עובדיה א'), אֵשׁ בְּלֹא לֶהָבָה אֵינוֹ שׁוֹלֵט לְמֵרָחוֹק, מִשֶּׁנּוֹלַד יוֹסֵף בָּטַח יַעֲקֹב בְּהַקָּבָּ\"ה וְרָצָה לָשׁוּב:", "rashi_en": "כאשר ילדה רחל את יוסף WHEN RACHEL HAD BORN JOSEPH — after the birth of him who was to become Esau’s adversary (Genesis Rabbah 73:7) — as it is said (Obadiah 1:18) “And the house of Jacob shall be a fire, and the house of Joseph a flame and the house of Esau for stubble“. Fire (Jacob) that has no flame (Joseph) has no effect at a distance. Therefore, when Joseph was born Jacob put his trust in the Holy One, blessed be He, and wished to return home (Obadiah 1:18). "}, {"ch": 30, "v": 26, "aliyah": 4, "heb": "תְּנָ֞ה אֶת־נָשַׁ֣י וְאֶת־יְלָדַ֗י אֲשֶׁ֨ר עָבַ֧דְתִּי אֹֽתְךָ֛ בָּהֵ֖ן וְאֵלֵ֑כָה כִּ֚י אַתָּ֣ה יָדַ֔עְתָּ אֶת־עֲבֹדָתִ֖י אֲשֶׁ֥ר עֲבַדְתִּֽיךָ׃", "onk": "הַב יָת נְשַׁי וְיָת בְּנַי דִּי פְלָחִית יָתָךְ בְּהֵן וְאֵזֵיל אֲרֵי אַתְּ יְדַעְתָּ יָת פָּלְחָנִי דִּפְלָחִתָּךְ:", "onk_en": "Give me [permission to take] my wives and my children, for whom I worked for you, and I will go; for you know my work that I did for you.", "pj": "הַב לִי יַת נְשַׁי וְיַת בְּנַיי דִפְלָחִית יָתָךְ בְּגִנְהוֹן וְאִיזֵל אֲרוּם אַנְתְּ יָדְעַת פּוּלְחָנִי דִי פְלַחְתָּךְ", "pj_en": "Give me my wives and my children, for whom I have served thee, and I will go; for thou knowest my service with which I have served thee.", "tj": "", "tj_en": "", "rashi": "<b>תנה את נשי וגו'.<\/b> אֵינִי רוֹצֶה לָצֵאת כִּי אִם בִּרְשׁוּת:", "rashi_en": "תנה את נשי וגו GIVE ME MY WIVES etc. — I have no wish to go away except with your permission. "}, {"ch": 30, "v": 27, "aliyah": 4, "heb": "וַיֹּ֤אמֶר אֵלָיו֙ לָבָ֔ן אִם־נָ֛א מָצָ֥אתִי חֵ֖ן בְּעֵינֶ֑יךָ נִחַ֕שְׁתִּי וַיְבָרְכֵ֥נִי יְהֹוָ֖ה בִּגְלָלֶֽךָ׃", "onk": "וַאַמַר לֵיהּ לָבָן אִם כְּעַן אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ <b>נַסֵּיתִי<\/b> וּבָרְכַנִי יְיָ בְּדִילָךְ:", "onk_en": "Lavan said to him, If [<b>now<\/b>] I have found favor in your eyes, I have divined [<b>determined<\/b>] that Adonoy has blessed me because of you.", "pj": "וַאֲמַר לֵיהּ לָבָן אִין כְּדוּן אַשְׁכָּחִית רַחֲמִין בְּעֵינָךְ הָא אַטְיָרִית קוּסְמִין וּבָרִכַנִי יְיָ בְּגִינָךְ", "pj_en": "But Laban said to him, If now I have found grace in thy eyes, I have observed by divination that the Lord hath blessed me for thy sake.", "tj": "אַטְיָירִית:", "tj_en": "I have observed. I have observed by divination that the Lord hath blessed me for thy sake.", "rashi": "<b>נחשתי.<\/b> מְנַחֵשׁ הָיָה, נִסִּיתִי בְּנִחוּשׁ שֶׁלִּי שֶׁעַל יָדְךָ בָּאָה לִי בְרָכָה; כְּשֶׁבָּאתָ לְכָאן לֹא הָיוּ לִי בָנִים, שֶׁנֶּאֱמַר וְהִנֵּה רָחֵל בִּתּוֹ בָּאָה עִם הַצֹּאן (בראשית כ״ט:ו׳), אֶפְשַׁר יֵשׁ לוֹ בָנִים וְהוּא שׁוֹלֵחַ בִתּוֹ אֵצֶל הָרוֹעִים? עַכְשָׁיו הָיוּ לוֹ בָנִים, שֶׁנֶּאֱמַר וַיִּשְׁמַע אֶת דִּבְרֵי בְנֵי לָבָן (שם ל\"א):", "rashi_en": "נחשתי I HAVE DIVINED — He was a diviner. “I have discovered by my art of divination that through you a blessing has come to me. When you first came here I had no sons” — for it is said (29:6) “And, behold, Rachel his daughter is coming with the flock”: is it possible if he had sons that he would have let his daughter go among the shepherds ? — now, however, he had sons, as it is said (31:1) “And he heard the words of Laban’s sons”. "}, {"ch": 30, "v": 28, "aliyah": 5, "heb": "וַיֹּאמַ֑ר נׇקְבָ֧ה שְׂכָרְךָ֛ עָלַ֖י וְאֶתֵּֽנָה׃", "onk": "וַאֲמָר פָּרֵישׁ אַגְרָךְ עֲלַי וְאֶתֵּן:", "onk_en": "He said, Set your wage for me, and I will give it.", "pj": "וַאֲמַר קְטַע אִיגְרָךְ עָלַי וְאֶתֵּן", "pj_en": "And he said, Appoint thy wages with me, and I will give thee.", "tj": "", "tj_en": "", "rashi": "<b>נקבה.<\/b> כְּתַרְגּוּמוֹ פָּרֵשׁ אַגְרָךְ:", "rashi_en": "נקבה— Explain it as the Targum renders it: state plainly thy wage. "}, {"ch": 30, "v": 29, "aliyah": 5, "heb": "וַיֹּ֣אמֶר אֵלָ֔יו אַתָּ֣ה יָדַ֔עְתָּ אֵ֖ת אֲשֶׁ֣ר עֲבַדְתִּ֑יךָ וְאֵ֛ת אֲשֶׁר־הָיָ֥ה מִקְנְךָ֖ אִתִּֽי׃", "onk": "וַאֲמַר לֵיהּ אַתְּ יְדַעְתָּ יָת דִּפְלָחִתָּךְ וְיָת דַּהֲוָה בְעִירָךְ עִמִּי:", "onk_en": "He [Yaakov] said to him, You know how I worked for you, and how your livestock were with me.", "pj": "וַאֲמַר לֵיהּ אַנְתְּ יָדְעַת יַת דִי פְלַחְתָּךְ וְיַת דַהֲוָה בְּעִירָךְ נְטִיר עִמִי", "pj_en": "And he said to him, Thou knowest how I have served thee, and how thy cattle have been kept by me:", "tj": "", "tj_en": "", "rashi": "<b>ואת אשר היה מקנך אתי.<\/b> אֶת חֶשְׁבּוֹן מִעוּט מִקְנְךָ שֶׁבָּא לְיָדִי מִתְּחִלָּה, כַּמָּה הָיוּ:", "rashi_en": "ואת אשר היה מקנך אתי AND WHAT THY CATTLE HATH BECOME WITH ME — You know the number of your few cattle that were entrusted to me at first — how small their number was. "}, {"ch": 30, "v": 30, "aliyah": 5, "heb": "כִּ֡י מְעַט֩ אֲשֶׁר־הָיָ֨ה לְךָ֤ לְפָנַי֙ וַיִּפְרֹ֣ץ לָרֹ֔ב וַיְבָ֧רֶךְ יְהֹוָ֛ה אֹתְךָ֖ לְרַגְלִ֑י וְעַתָּ֗ה מָתַ֛י אֶֽעֱשֶׂ֥ה גַם־אָנֹכִ֖י לְבֵיתִֽי׃", "onk": "אֲרֵי זְעֵיר דִּי הֲוָה לָךְ קֳדָמַי וּתְקֵיף לְמִסְגֵּי וּבָרִיךְ יְיָ יָתָךְ <b>בְּדִילִי<\/b> וּכְעַן אֵימָתַי אֶעְבֵּיד אַף אֲנָא לְבֵיתִי:", "onk_en": "For the little you had before I came here has increased and has become a multitude. Adonoy has blessed you with my coming [<b>for my sake<\/b>]. Now when will I also do something for my own house?", "pj": "אֲרוּם קָלִיל דַהֲוָה לָךְ עָאן קֳדָמַי וּתְקֵיף לְסַגִי וּבְרִיךְ יְיָ יָתָךְ בְּרִיגְלִי דְאַהֲנַיַית לָךְ מִדְעָלִית בְּבֵיתָךְ וּכְדוֹן אֵימַת אַעֲבֵיד אוּף אֲנָא עִבִידְתָּא וַאֲנָא זָקִיק לְפַרְנָסָא אִינְשֵׁי בֵיתִי", "pj_en": "for the little flock which thou hadst before me hath increased greatly, and the Lord hath blessed thee at my foot, that I have been profitable to thee from (the time of) my coming into thy house. And now when shall I do the work for which I am bound, to nourish the men of my house.", "tj": "", "tj_en": "", "rashi": "<b>לרגלי.<\/b> עִם רַגְלִי, בִּשְׁבִיל בִּיאַת רַגְלִי בָּאת אֶצְלְךָ הַבְּרָכָה, כְּמוֹ הָעָם אֲשֶׁר בְּרַגְלֶיךָ (שמות י\"א), לָעָם אֲשֶׁר בְּרַגְלָי (שופטים ח') – הַבָּאִים עִמִּי:<br><br><b>גם אנכי לביתי.<\/b> לְצֹרֶךְ בֵּיתִי; עַכְשָׁו אֵין עוֹשִׂין לְצָרְכִּי אֶלָּא בָּנַי וְצָרִיךְ אֲנִי לִהְיוֹת עוֹשֶׂה גַּם אֲנִי עִמָּהֶם לְסָמְכָן, וְזֶהוּ גַּם:", "rashi_en": "לרגלי SINCE MY COMING — The word is the same as עם רגלי “with my coming” (lit, with my foot)— on account of my coming has the blessing come to you (Genesis Rabbah 73:8). Similar is (Exodus 11:8) “And all the people that come with thee (ברגלך)”, and (Judges 8:5) “and the people that are ברגלי” — ie. that are coming with me.<br><br>גם אנכי לביתי WHEN SHALL I PROVIDE FOR MINE OWN HOUSE ALSO? — לביתי means for the needs of my household. At present my sons alone provide for my needs, but I, also, ought to work together with them, to assist them. This is the force of the word גם also. "}, {"ch": 30, "v": 31, "aliyah": 5, "heb": "וַיֹּ֖אמֶר מָ֣ה אֶתֶּן־לָ֑ךְ וַיֹּ֤אמֶר יַעֲקֹב֙ לֹא־תִתֶּן־לִ֣י מְא֔וּמָה אִם־תַּֽעֲשֶׂה־לִּי֙ הַדָּבָ֣ר הַזֶּ֔ה אָשׁ֛וּבָה אֶרְעֶ֥ה צֹֽאנְךָ֖ אֶשְׁמֹֽר׃", "onk": "וַאֲמַר מָה אֶתֶּן לָךְ וַאֲמַר יַעֲקֹב לָא תִתֶּן לִי מִדַּעַם אִם תַּעְבֶּד לִי פִּתְגָּמָא הָדֵין אֱתוּב אֶרְעֵי עָנָךְ אֶטָּר:", "onk_en": "He [Lavan] said, What shall I give you? Yaakov said, Do not give me anything—if you do this thing for me. I will continue to tend your flock and guard it.", "pj": "וַאֲמַר מָה אֶתֵּן לָךְ וַאֲמַר יַעֲקב לָא תִתֵּן לִי מִדַעַם אוֹחְרָן אִין תַּעֲבֵיד לִי פִתְגָמָא הָדֵין אֵיתוּב אֶרְעֵי עָנָךְ אֶטַר", "pj_en": "And he said, What shall I give thee ? And Jakob said, Thou shalt not give me anything else, (but) do me this thing, and I will return and pasture thy flock, and keep them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 32, "aliyah": 5, "heb": "אֶֽעֱבֹ֨ר בְּכׇל־צֹֽאנְךָ֜ הַיּ֗וֹם הָסֵ֨ר מִשָּׁ֜ם כׇּל־שֶׂ֣ה&thinsp;<b>׀<\/b> נָקֹ֣ד וְטָל֗וּא וְכׇל־שֶׂה־חוּם֙ בַּכְּשָׂבִ֔ים וְטָל֥וּא וְנָקֹ֖ד בָּעִזִּ֑ים וְהָיָ֖ה שְׂכָרִֽי׃", "onk": "אֶעְבַּר בְּכָל עָנָךְ יוֹמָא דֵין הַעֲדֵי (<small>נ\"א<\/small> אַעְדִּי) מִתַּמָּן כָּל אִמָּר נְמוֹר וּרְקוֹעַ וְכָל אִמָּר שְׁחוּם בְּאִמְּרַיָּא וּרְקוֹעַ וּנְמוֹר בְּעִזַּיָּא וִיהֵי אַגְרִי:", "onk_en": "I will go through all your flocks this day. I will remove from them every lamb that is speckled, or spotted, and every dark one among the sheep, and every goat that is spotted and speckled. That [kind] will be my wage.", "pj": "אֲעִיבַר בְּכָל עָנָךְ יוֹמָא דֵין אַעֲדִי מִתַּמָן כָּל אִימַר נְמוֹר וּקְרוֹחַ וְכָל אִימַר לָחוּשׁ בְּאִימְרַיָא וּקְרוֹחַ וּנְמוֹר בְּעִזַיָא וִיהֵי אַגְרֵי", "pj_en": "I will pass through thy whole flock today, and will set apart every lamb streaked and spotted, and every black lamb among the lambs, and spotted and streaked among the goats, and they shall be my wages.", "tj": "כָּל אִימַר קְרוּחַ וּנְמוֹר וְכָל אִימַר לְחוֹשׁ בְּאִימְרַיָא וּקְרוּחַ וּנְמוֹר בְּעִיזַיָא:", "tj_en": "Every lamb spotted and streaked, and every black lamb among the lambs, and the spotted and streaked among the goats.", "rashi": "<b>נקד.<\/b> מְנֻמָּר בַּחֲבַרְבּוּרוֹת דַּקּוֹת כּמוֹ נְקֻדּוֹת, פיונטור\"א בְּלַעַז:<br><br><b>וטלוא.<\/b> לְשׁוֹן טְלָאִים – חֲבַרְבּוּרוֹת רְחָבוֹת:<br><br><b>חום.<\/b> שָׁחוּם, דּוֹמֶה לְאָדֹם, רו\"ש בְּלַעַז; לְשׁוֹן מִשְׁנָה שַׁחֲמָתִית וְנִמְצֵאת לְבָנָה, לְעִנְיַן הַתְּבוּאָה:<br><br><b>והיה שכרי.<\/b> אוֹתָן שֶׁיִּוָּלְדוּ מִכָּאן וּלְהַבָּא נְקֻדִּים וּטְלוּאִים בָּעִזִּים וּשְׁחוּמִים בַּכְּשָׂבִים, יִהְיוּ שֶׁלִּי, וְאוֹתָן שֶׁיֶּשְׁנָן עַכְשָׁו, הַפְרֵשׁ מֵהֶם וְהַפְקִידֵם בְּיַד בָּנֶיךָ, שֶׁלֹּא תֹאמַר לִי עַל הַנּוֹלָדִים מֵעַתָּה אֵלּוּ הָיוּ שָׁם מִתְּחִלָּה, וְעוֹד, שֶׁלֹּא תֹאמַר לִי, עַל יְדֵי הַזְּכָרִים שֶׁהֵן נְקֻדִּים וּטְלוּאִים תֵּלַדְנָה הַנְּקֵבוֹת דֻּגְמָתָן מִכָּאן וָאֵילָךְ:", "rashi_en": "נקוד SPECKLED — marked with small specks like dots old French pointure; English points.<br><br>וטלוא AND SPOTTED — The word has the same meaning as טלאים “patches” — wide spots.<br><br>חום BROWN — dark, somewhat reddish, old French rouge. In the language of the Mishna (Bava Batra 5:6): “If he sells it as reddish-dark coloured (שחמתית) and it is found to be white”—a statement made in reference to grain.<br><br>והיה שכרי AND THEY SHALL BE MY HIRE — those which from now on will be born speckled and spotted among the goats and the brownish ones amongst the sheep shall belong to me. Those that are at present such set them apart and place them in charge of your sons, so that you may not be able to say to me about those that will be born in the future spotted and speckled and brownish. “These were there originally”. And a further reason why these should be set apart is, in order that you may not be able to say to me, “Because of the male animals that are speckled and spotted the females will give birth from now onwards to offspring of their own kind” (i.e., speckled etc.). "}, {"ch": 30, "v": 33, "aliyah": 5, "heb": "וְעָֽנְתָה־בִּ֤י צִדְקָתִי֙ בְּי֣וֹם מָחָ֔ר כִּֽי־תָב֥וֹא עַל־שְׂכָרִ֖י לְפָנֶ֑יךָ כֹּ֣ל אֲשֶׁר־אֵינֶ֩נּוּ֩ נָקֹ֨ד וְטָל֜וּא בָּֽעִזִּ֗ים וְחוּם֙ בַּכְּשָׂבִ֔ים גָּנ֥וּב ה֖וּא אִתִּֽי׃", "onk": "וְתַסְהֵד בִּי זָכוּתִי בְּיוֹם דִּמְחָר אֲרֵי תֵיעוֹל עַל אַגְרִי קֳדָמָךְ כֹּל דִּי לֵיתוֹהִי נְמוֹר וּרְקוֹעַ בְּעִזַּיָּא וּשְׁחוּם בְּאִמְּרַיָּא גְּנוּבָא הוּא עִמִּי:", "onk_en": "My righteousness shall testify for me in the future when it comes before you regarding my wage. Any goat which is not speckled or spotted, and any sheep that is [not] dark, is stolen [if it is] in my possession.", "pj": "וְתִיסְהַד בִּי זַכְוָותִי לְיוֹם מָחְרָא אֲרוּם תֶּהֱוֵי עַל אַגְרִי לְקַמָךְ כָּל דְלֵיתוֹהִי נְמוֹר וְקִירוֹחַ בְּעִזַיָא וּלְחוּשׁ בְּאִימְרַיָא גְנִיבָא הוּא לְמֶהֱוֵי דִילִי", "pj_en": "And my righteousness shall testify for me tomorrow, when my wages shall be brought before thee. Every one which is not streaked or spotted among the goats, or black among the lambs, shall be as if it had been a theft of mine.", "tj": "", "tj_en": "", "rashi": "<b>וענתה בי וגו'.<\/b> אִם תַּחְשְׁדֵנִי שֶׁאֲנִי נוֹטֵל מִשֶּׁלְּךָ כְּלוּם, תַּעֲנֶה בִי צִדְקָתִי כִּי תָבֹא צִדְקָתִי וְתָעִיד עַל שְׂכָרִי לְפָנֶיךָ, שֶׁלֹּא תִמְצָא בְעֶדְרִי כִּי אִם נְקֻדִּים וּטְלוּאִים, וְכָל שֶׁתִּמְצָא בָהֶן שֶׁאֵינוֹ נָקֹד אוֹ טָלוּא אוֹ חוּם, בְּיָדוּעַ שֶׁגְּנַבְתִּיו לְךָ וּבִגְנֵבָה הוּא שָׁרוּי אֶצְלִי:", "rashi_en": "'וענתה בי וגו AND MY RIGHTEOUSNESS SHALL ANSWER FOR ME etc. — Should you suspect me of taking any animals that are yours my righteousness will answer for me, — for my righteousness will come and bear witness before thee as to my hire that you will find in my herd only speckled and spotted ones. Whatever, however, you find amongst them (amongst the animals) that is not speckled or spotted or brownish it will be certain that I have stolen it from your flocks and that it is in my possession by way of theft. "}, {"ch": 30, "v": 34, "aliyah": 5, "heb": "וַיֹּ֥אמֶר לָבָ֖ן הֵ֑ן ל֖וּ יְהִ֥י כִדְבָרֶֽךָ׃", "onk": "וַאֲמַר לָבָן בְּרָם לְוַי יְהֵי כְפִתְגָּמָךְ:", "onk_en": "Lavan said, Agreed, may it be as you say.", "pj": "וַאֲמַר לָבָן יָאוּת לְוָאֵי דִיהִי כְּפִתְגָמָךְ", "pj_en": "And Laban said to him, Well, let it be according to thy word.", "tj": "", "tj_en": "", "rashi": "<b>הן.<\/b> לְ' קַבָּלַת דְּבָרִים:<br><br><b>לו יהי כדברך.<\/b> הַלְוַאי שֶׁתַּחְפֹּץ בְּכָךְ:", "rashi_en": "הן WELL! — an expression denoting agreement with a statement.<br><br>לו יהי כדברך I WOULD IT MIGHT BE ACCORDING TO THY WORD — Would that you will remain satisfied with this! "}, {"ch": 30, "v": 35, "aliyah": 5, "heb": "וַיָּ֣סַר בַּיּוֹם֩ הַה֨וּא אֶת־הַתְּיָשִׁ֜ים הָֽעֲקֻדִּ֣ים וְהַטְּלֻאִ֗ים וְאֵ֤ת כׇּל־הָֽעִזִּים֙ הַנְּקֻדּ֣וֹת וְהַטְּלֻאֹ֔ת כֹּ֤ל אֲשֶׁר־לָבָן֙ בּ֔וֹ וְכׇל־ח֖וּם בַּכְּשָׂבִ֑ים וַיִּתֵּ֖ן בְּיַד־בָּנָֽיו׃", "onk": "וְאַעְדִּי בְיוֹמָא הַהוּא יָת תְּיָשַׁיָּא רְגוֹלַיָּא וּרְקוֹעַיָּא וְיָת כָּל עִזַיָּא נְמוֹרְתָא וּרְקוֹעֲתָא כֹּל דִּי חִוָּר בֵּיהּ וְכָל דִּשְׁחוּם בְּאִמְּרַיָּא וִיהַב בְּיַד בְּנוֹהִי:", "onk_en": "That day he [Lavan] removed the he-goats that were ringed and spotted, and all the she-goats that were speckled and spotted, everyone that had white in it, and all the dark ones among the sheep; and he gave them to his sons.", "pj": "וְאַפְרֵישׁ בְּיוֹמָא הַהוּא יַת בָּרְחַיָא דְסִימָנָא בְּרִגְלֵיהוֹן וּקְרוּחַיָא וְיַת כָּל עִיזַיָא נְמוֹרְתָּא וּקְרוֹחְתָּא כָּל דִי שׁוּמָא חִיוְורָא בֵּיהּ וְכָל דִי לְחוּשׁ בְּאִימְרַיָא וִיהַב בִּידָא דִבְנוֹי", "pj_en": "And he separated that day the goats which were marked in their feet, and the spotted, and all the goats streaked or spotted, every one which had a white place in him, and every black one among the lambs, and gave them into the hand of his sons.", "tj": "", "tj_en": "", "rashi": "<b>ויסר.<\/b> לָבָן <b>ביום ההוא<\/b>:<br><br><b>את התישים.<\/b> עִזִּים זְכָרִים:<br><br><b>כל אשר לבן בו.<\/b> כָּל אֲשֶׁר הָיְתָה בוֹ חֲבַרְבּוּרִית לְבָנָה:<br><br><b>ויתן.<\/b> לָבָן <b>ביד בניו<\/b>:", "rashi_en": "ויסר  AND HE REMOVED i.e., Laban removed ביום ההוא ON THAT DAY<br><br>את התישים i.e. THE HE-GOATS.<br><br>כל אשר לבן בו EVERY ONE THAT HAD WHITE IN IT — all that had a white spot.<br><br>ויתן AND HE i.e. Laban, GAVE THEM ביד בניו INTO THE HAND OF HIS SONS. "}, {"ch": 30, "v": 36, "aliyah": 5, "heb": "וַיָּ֗שֶׂם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים בֵּינ֖וֹ וּבֵ֣ין יַעֲקֹ֑ב וְיַעֲקֹ֗ב רֹעֶ֛ה אֶת־צֹ֥אן לָבָ֖ן הַנּוֹתָרֹֽת׃", "onk": "וְשַׁוִּי מַהֲלַךְ תְּלָתָא יוֹמִין בֵּינוֹהִי וּבֵין יַעֲקֹב וְיַעֲקֹב רָעֵי יָת עָנָא דְלָבָן דְּאִשְׁתָּאֳרַן:", "onk_en": "He placed a three days journey between himself and Yaakov. Yaakov tended Lavan’s remaining flocks.", "pj": "וְשַׁוִי מַהֲלַךְ תְּלָתָא יוֹמִין בֵּינֵי עָנֵיהּ וּבֵינֵי יַעֲקב וְיַעֲקב רָעֵי יַת עָנָא דְלָבָן סָבָאָן וּמַרְעָאָן דְאִשְׁתַּאֲרוּ", "pj_en": "And he set a journey of three days between his flocks and (those of) Jakob. And Jakob tended the flock of Laban, the old and the feeble which were left.", "tj": "", "tj_en": "", "rashi": "<b>הנותרות.<\/b> הָרְעוּעוֹת שֶׁבָּהֶן, הַחוֹלוֹת וְהָעֲקָרוֹת שֶׁאֵינָן אֶלָּא שִׁירַיִם, אוֹתָן מָסַר לוֹ:", "rashi_en": "הנותרות [THE FLOCK OF LABAN] THAT WAS LEFT — The defective animals amongst them, the sickly and the barren, which were nothing but the leavings — these he (Laban) handed over to him (Genesis Rabbah 73:9). "}, {"ch": 30, "v": 37, "aliyah": 5, "heb": "וַיִּֽקַּֽח־ל֣וֹ יַעֲקֹ֗ב מַקַּ֥ל לִבְנֶ֛ה לַ֖ח וְל֣וּז וְעַרְמ֑וֹן וַיְפַצֵּ֤ל בָּהֵן֙ פְּצָל֣וֹת לְבָנ֔וֹת מַחְשֹׂף֙ הַלָּבָ֔ן אֲשֶׁ֖ר עַל־הַמַּקְלֽוֹת׃", "onk": "וּנְסִיב לֵיהּ יַעֲקֹב חוּטְרִין דִּלְבָן רַטִּיבִין דִּדְלוּז וְדִדְלוּף וְקַלִיף בְּהוֹן קִלְפִין חִוָּרִין קִלוּף חִוָּר דִּי עַל חוּטְרַיָּא:", "onk_en": "Yaakov took rods of poplar that were fresh, hazel and chestnut [trees], and peeled white stripes in them by uncovering the white which is in the rods.", "pj": "וּנְסֵיב לֵיהּ יַעֲקב חוֹטֶר דְפָרַח לָבָן וְדִילוֹז וְאַרְדְפוֹי וּקְלַף בְּהוֹן קְלִיפִין חִיוְורִין לְגַלָאָה חִיוְורָא דְעַל חוּטְרַיָא", "pj_en": "And Jakob took to him a rod of flowering poplar, and of almond, and of the plane tree, and peeled in them white peelings to disclose the white which was in the rods.", "tj": "", "tj_en": "", "rashi": "<b>מקל לבנה.<\/b> עֵץ הוּא, וּשְׁמוֹ לִבְנֶה, כְּמָא דְתֵימָא תַּחַת אַלּוֹן וְלִבְנֶה (הושע ד'), וְאוֹמֵר אֲנִי הוּא שֶׁקּוֹרִין טרינבל\"א בְּלַעַ\"ז, שֶׁהוּא לָבָן:<br><br><b>לח.<\/b> כְּשֶׁהוּא רָטֹב:<br><br><b>לוז.<\/b> וְעוֹד לָקַח מַקַּל לוּז, עֵץ שֶׁגְּדֵלִין בּוֹ אֱגוֹזִים דַּקִּים, קולדו\"י בְּלַעַז:<br><br><b>וערמון.<\/b> קשטני\"יר בְּלַעַז:<br><br><b>פצלות.<\/b> קִלּוּפִים קִלּוּפִים, שֶׁהָיָה עוֹשֵׂהוּ מְנֻמָּר:<br><br><b>מחשוף הלבן.<\/b> גִּלּוּי לֹבֶן שֶׁל מַקֵּל, כְּשֶׁהָיָה קוֹלְפוֹ הָיָה נִרְאֶה וְנִגְלֶה לֹבֶן שֶׁלּוֹ בַּמָּקוֹם הַקָּלוּף:", "rashi_en": "מקל לבנה STICKS OF לבנה — a tree that is called לבנה — just as you say (Hosea 4:13) “Under oaks and poplars (ולבנה)” I think it is what is called in old French tremble; English trembling-poplar, which is white.<br><br>לח FRESH — He took it when it was moist.<br><br>לוז ALMOND — He also took rods of לוז, a tree upon which small nuts growold French coudre; English hazel.<br><br>וערמון is old French chastenier, English chestnut.<br><br>פצלות STREAKS — many peelings so that he gave it the appearence of being striped.<br><br>מחשוף הלבן MAKING BARE THE WHITE — there was thus an uncovering of the white part of the rod: when he peeled it the white in it became uncovered and visible in the places where it was peeled."}, {"ch": 30, "v": 38, "aliyah": 5, "heb": "וַיַּצֵּ֗ג אֶת־הַמַּקְלוֹת֙ אֲשֶׁ֣ר פִּצֵּ֔ל בָּרְהָטִ֖ים בְּשִֽׁקְת֣וֹת הַמָּ֑יִם אֲשֶׁר֩ תָּבֹ֨אןָ הַצֹּ֤אן לִשְׁתּוֹת֙ לְנֹ֣כַח הַצֹּ֔אן וַיֵּחַ֖מְנָה בְּבֹאָ֥ן לִשְׁתּֽוֹת׃", "onk": "<b>וְדַעֵיץ<\/b> יָת חוּטְרַיָּא דִּי קַלִּיף בִּרְהָטַיָּא <b>אֲתַר<\/b> בֵּית שָׁקְיָא דְמַיָּא <b>אֲתַר<\/b> דְּאָתָן (<small>נ\"א<\/small> דְּאָתְיָן) עָנָא לְמִשְׁתֵּי לְקִבְלֵהוֹן דְּעָנָא וּמִתְיַחֲמָן בְּמֵיתֵיהוֹן לְמִשְׁתֵּי:", "onk_en": "He stuck [<b>inserted<\/b>] the rods that he had peeled into the ducts of the [<b>place of the<\/b>] watering troughs [<b>the place<\/b>] where the flock [ewes] came to drink, facing the flock [rams]; that they should become heated when they came to drink.", "pj": "וְנָעַץ יַת חוּטְרַיָא דִיקָלִיף בְּמוּרִכְיָיתָא בְּשַׁקְיָיתָא דְמַיָא אֲתַר דְאַתְיָין עָנָא לְמִשְׁתֵּי תַּמָן שַׁוִוינוּן לְקִבְלֵהֶן דַעֲנָא וַהֲווֹן מִתְיַחְמָן בְּמֵיתֵיהוֹן לְמִשְׁתֵּי", "pj_en": "And the rods which he had peeled, he fixed in the canals, in the troughs of water; at the place to which they brought the flocks to water, there placed he them over against the flock that they might conceive when they came to drink.", "tj": "בְּמַרְכִיוּתָא:", "tj_en": "In the canals.", "rashi": "<b>ויצג.<\/b> תַּרְגּוּמוֹ וְדָעִיץ, לְשׁוֹן תְּחִיבָה וּנְעִיצָה הוּא בִלְשׁוֹן אֲרַמִּי, וְהַרְבֵּה יֵשׁ בַּתַּלְמוּד דָּצָהּ וּשְׁלָפָהּ, דָּץ בֵּיהּ מִידֵי, דָּצָהּ כְּמוֹ דְעָצָהּ, אֶלָּא שֶׁמְּקַצֵּר אֶת לְשׁוֹנוֹ:<br><br><b>ברהטים.<\/b> בִּמְרוּצוֹת הַמַּיִם, בַּבְּרֵכוֹת הָעֲשׂוּיוֹת בָּאָרֶץ לְהַשְׁקוֹת שָׁם הַצֹּאן:<br><br><b>אשר תבאן וגו'.<\/b> בָּרְהָטִים אֲשֶׁר תָּבֹאנָה הַצֹּאן לִשְׁתּוֹת שָׁם הִצִּיג הַמַּקְלוֹת לְנֹכַח הַצֹּאן:<br><br><b>ויחמנה.<\/b> הַבְּהֵמָה רוֹאָה אֶת הַמַּקְלוֹת וְהִיא נִרְתַּעַת לַאֲחוֹרֶיהָ וְהַזָּכָר רוֹבְעָהּ וְיוֹלֶדֶת כַּיּוֹצֵא בוֹ. רַבִּי הוֹשַׁעְיָה אוֹמֵר, הַמַּיִם נַעֲשִׂין זֶרַע בִּמְעֵיהֶן וְלֹא הָיוּ צְרִיכוֹת לְזָכָר, וְזֶהוּ וַיֵּחַמְנָה וְגוֹ' (בראשית רבה):", "rashi_en": "ויצג AND HE SET — In the Targum it is rendered by ודעיץ which signifies in the Aramaic language sticking in and inserting. It occurs many times in the Talmud: (Shabbat 50b) “if he stuck it in (דצה) and pulled it out”; (Chullin 93b) “he stuck (דץ) something into it”, where דצה is the same as דעצה, being really a contracted form of it.<br><br>ברהטים IN THE GUTTERS — in the currents (מרוצות) of water running in the trenches made in the ground to water the sheep there (רהט is the Aramaic of רוץ).<br><br>אשר תבאנה WHERE THE FLOCKS COME TO DRINK etc. — In the currents whither the sheep come to drink, there did he set the rods in front of the sheep.<br><br>ויחמנה AND THEY CONCEIVED — The female animal saw the rods, it was startled at the sight of them and recoiled; its mate then pairing with it, it afterwards gave birth to young marked similar to the rods (Genesis Rabbah 73:10). "}, {"ch": 30, "v": 39, "aliyah": 5, "heb": "וַיֶּחֱמ֥וּ הַצֹּ֖אן אֶל־הַמַּקְל֑וֹת וַתֵּלַ֣דְןָ הַצֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּטְלֻאִֽים׃", "onk": "וְאִתְיַחֲמָא <b>עָנָא<\/b> בְּחוּטְרַיָּא וִילִידָא <b>עָנָא<\/b> רְגוֹלִין נְמוֹרִין וּרְקוֹעִין:", "onk_en": "The flock [<b>sheep<\/b>] became heated [and mated] before the rods, and the flock [<b>sheep<\/b>] gave birth to ringed, speckled and spotted [offspring].", "pj": "וְאִתְיַחֲמָן עָנָא לְקָבֵיל חוּטְרַיָא וִילֵידַן עָנָא רְגוּלִין דְסִימָנָא בְּרִיגְלֵיהוֹן וּקְרוּחִין וְגַבֵּיהוֹן חִיוְורִין", "pj_en": "And the sheep conceived over against the rods, and the sheep produced such as were marked in their feet, and spotted and white in their backs.", "tj": "", "tj_en": "", "rashi": "<b>אל המקלות.<\/b> אֶל מַרְאוֹת הַמַּקְלוֹת:<br><br><b>עקדים.<\/b> מְשֻׁנִּים בִּמְקוֹם עֲקִידָתָם, הֵם קַרְסֻלֵּי יְדֵיהֶם וְרַגְלֵיהֶם:", "rashi_en": "אל המקלות means at the sight of the rods.<br><br>עקודים RING-STRAKED — the word is connected with the root עקד “to bind” — differently coloured at that place where they are bound, viz., the ankles of the forelegs and hindlegs."}, {"ch": 30, "v": 40, "aliyah": 5, "heb": "וְהַכְּשָׂבִים֮ הִפְרִ֣יד יַעֲקֹב֒ וַ֠יִּתֵּ֠ן פְּנֵ֨י הַצֹּ֧אן אֶל־עָקֹ֛ד וְכׇל־ח֖וּם בְּצֹ֣אן לָבָ֑ן וַיָּֽשֶׁת־ל֤וֹ עֲדָרִים֙ לְבַדּ֔וֹ וְלֹ֥א שָׁתָ֖ם עַל־צֹ֥אן לָבָֽן׃", "onk": "וְאִמְּרַיָּא אַפְרֵשׁ יַעֲקֹב וִיהַב <b>בְּרֵישׁ עָנָא כָּל<\/b> דִּרְגוֹל וְכָל דִּשְׁחוּם בְּעָנָא דְלָבָן וְשַׁוִּי לֵיהּ עֶדְרִין בִּלְחוֹדוֹהִי וְלָא <b>עֲרֵבִנּוּן<\/b> עִם <b>עָנָא<\/b> דְלָבָן:", "onk_en": "Yaakov separated the lambs. He set the faces [<b>at the head<\/b>] of the flock [<b>sheep<\/b>] toward [<b>all<\/b>] the ringed ones and all the dark ones; [he did so] with Lavan’s flocks. He formed separate flocks of his own, and did not set [<b>mix<\/b>] them with Lavan’s flocks.", "pj": "וְטַלְיָא אַפְרֵישׁ יַעֲקב וִיהַב בְּרֵישׁ עָנָא מַשְׁכּוֹבִיתָא כָּל יַת דִרְגוֹל וְכָל דִלְחוּשׁ בְּעָנָא דְלָבָן וְשַׁוֵי לֵיהּ עֶדְרִין בִּלְחוֹדוֹי וְלָא עַרְבֵּיבִנוּן עִם עָנָא דְלָבָן", "pj_en": "And the lambs did Jakob set apart, and place in front of the flocks; all the various coloured and the black among Laban's sheep he set for himself a flock apart, and did not mix them with the sheep of Laban.", "tj": "", "tj_en": "", "rashi": "<b>והכשבים הפריד יעקב.<\/b> הַנּוֹלָדִים עֲקוּדִים נְקֻדִּים הִבְדִיל וְהִפְרִישׁ לְעַצְמָן וְעָשָׂה אוֹתָן עֵדֶר עֵדֶר לְבַדּוֹ, וְהוֹלִיךְ אוֹתוֹ הָעֵדֶר הָעָקוּד לִפְנֵי הַצֹּאן, וּפְנֵי הַצֹּאן הַהוֹלְכִים אַחֲרֵיהֶם צוֹפוֹת אֲלֵיהֶם; וְזֶהוּ שֶׁאָמַר וַיִּתֵּן פְּנֵי הַצֹּאן אֶל עָקֹד, שֶׁהָיוּ פְנֵי הַצֹּאן אֶל הָעֲקוּדִים, וְאֶל כָּל חוּם שֶׁמָּצָא בְּצֹאן לָבָן:<br><br><b>וישת לו עדרים.<\/b> כְּמוֹ שֶׁפֵּרַשְׁתִּי:", "rashi_en": "והכשבים הפריד יעקב AND JACOB PARTED THE LAMBS — Those sheep that were thus born spotted on the ankles and speckled he separated and set apart by themselves, thus forming them into a separate flock. He led that spotted flock in front of ordinary sheep so that the faces of the sheep that followed behind them were gazing at them. This is what Scripture means in saying, “He set the faces of the flocks towards the spotted” — that the faces of the sheep were directed towards the spotted animals and towards all that were brownish which he found amongst Laban’s sheep (i. e., amongst the sickly sheep which Laban had left him; cf. Genesis 5:36).<br><br>וישת לו עדרים means he formed them into a separate flock as I have already explained."}, {"ch": 30, "v": 41, "aliyah": 5, "heb": "וְהָיָ֗ה בְּכׇל־יַחֵם֮ הַצֹּ֣אן הַמְקֻשָּׁרוֹת֒ וְשָׂ֨ם יַעֲקֹ֧ב אֶת־הַמַּקְל֛וֹת לְעֵינֵ֥י הַצֹּ֖אן בָּרְהָטִ֑ים לְיַחְמֵ֖נָּה בַּמַּקְלֽוֹת׃", "onk": "וַהֲוֵי בְּכָל עִדַּן דְּמִתְיַחֲמָן <b>עָנָא<\/b> מְבַכַּרְתָּא וּמְשַׁוִּי יַעֲקֹב יָת חוּטְרַיָּא לְעֵינֵי <b>עָנָא<\/b> בִּרְהָטַיָּא לְיַחָמוּתְהוֹן בְּחוּטְרַיָּא:", "onk_en": "When the early-bearing flock [<b>sheep<\/b>] were heated [to mate], Yaakov placed the rods before the flock’s [<b>sheep’s<\/b>] eyes at the ducts, so they would be in heat among the rods.", "pj": "וַהֲוָה בְּכָל עִידַן דְמִתְיַחֲמָן עָנָא מְבַכְּרָתָא וּמְשַׁוִי יַעֲקב יַת חוּטְרַיָא לְעֵינֵי עָנָא בְּמוּרְכְיָיתָא לְיַחֲמוּתְהֶן קְבֵל חוּטְרַיָיא", "pj_en": "And it was that whenever the early (prime) sheep conceived, Jakob set the rods in the canals before the eyes of the sheep, that they might conceive before the rods.", "tj": "", "tj_en": "", "rashi": "<b>המקשרות.<\/b> כְּתַרְגּוּמוֹ הַבַּכִּירוֹת, וְאֵין לִי עֵד בַּמִּקְרָא; וּמְנַחֵם חִבְּרוֹ עִם אֲחִיתֹפֶל בַּקֹּשְׁרִים (שמואל ב ט\"ו), וַיְהִי הַקֶּשֶׁר אַמִּץ (שם), אוֹתָן הַמִּתְקַשְּׁרוֹת יַחַד לְמַהֵר עִבּוּרָן:", "rashi_en": "המקשרות THE STRONGER—Explain it as the Targum renders it: הבכירות the early-bearing sheep; but I have no evidence in the Scripture (i.e. I have no other example of the use of this word) to prove that this is its meaning. Menachem classifies it under the same root as (2 Samuel 15:31) “Ahitophel is among the conspirators (בקשרים)”, and as (2 Samuel 15:12) “And the conspiracy (הקשר) was strong” — so that the meaning would be those sheep that banded themselves together (mated) in order to accelerate their pregnancy (i.e. in order that they might become בכירות, early-bearing sheep). "}, {"ch": 30, "v": 42, "aliyah": 5, "heb": "וּבְהַעֲטִ֥יף הַצֹּ֖אן לֹ֣א יָשִׂ֑ים וְהָיָ֤ה הָעֲטֻפִים֙ לְלָבָ֔ן וְהַקְּשֻׁרִ֖ים לְיַעֲקֹֽב׃", "onk": "וּבְלַקִּישׁוּת <b>עָנָא<\/b> לָא מְשַׁוֵּי וַהֲווֹ לַקְּשַׁיָא לְלָבָן <b>וּבַכִּירַיָּא<\/b> לְיַעֲקֹב:", "onk_en": "But when the flock [<b>sheep<\/b>] were late-bearing, he did not place [the rods before them]. Thus the late-bearing ones were Lavan’s, and the early-bearing ones became the possession of Yaakov.", "pj": "וּבְלִקוּשֵׁי עָנָא לָא מְשַׁוִי וַהֲווֹן לַקִישַׁיָא לְלָבָן וּבַכִּירַיָיא לְיַעֲקב", "pj_en": "But with the late sheep he did not set them; and the late sheep were Laban's and the early ones Jakob's.", "tj": "", "tj_en": "", "rashi": "<b>ובהעטיף.<\/b> לְשׁוֹן אִחוּר, כְּתַרְגּוּמוֹ וּבְלַקִּישׁוּת. וּמְנַחֵם חִבְּרוֹ עִם הַמַּחֲלָצוֹת וְהַמַּעֲטָפוֹת (ישעיהו ג'), לְשׁוֹן עֲטִיפַת כְּסוּת, כְּלוֹמַר מִתְעַטְּפוֹת בְּעוֹרָן וְצַמְרָן וְאֵינָן מִתְאַוּוֹת לְהִתְיַחֵם עַ\"יְ הַזְּכָרִים:", "rashi_en": "ובהעטיף WHEN THE FLOCKS WERE FEEBLE — the word has the meaning of “being late”, as the Targum renders it בלקישות the late-bearing ones (cf. מלקוש the “latter” rain). Menachem classifies it under the same root as (Isaiah 3:22) “the aprons and the mantelets (המעטפות)”, so that it has the meaning of wrapping oneself in a garment, and the word denotes those animals that are well wrapped up in their skin and fur so that they do not desire to be warmed by the males. "}, {"ch": 30, "v": 43, "aliyah": 5, "heb": "וַיִּפְרֹ֥ץ הָאִ֖ישׁ מְאֹ֣ד מְאֹ֑ד וַֽיְהִי־לוֹ֙ צֹ֣אן רַבּ֔וֹת וּשְׁפָחוֹת֙ וַעֲבָדִ֔ים וּגְמַלִּ֖ים וַחֲמֹרִֽים׃", "onk": "וּתְקֵיף גַּבְרָא לַחֲדָא לַחֲדָא וַהֲווֹ לֵיהּ עָן סַגִּיאָן וַאַמְהָן וְעַבְדִּין וְגַמְלִין וַחֲמָרִין:", "onk_en": "The man became tremendously prosperous. He had multipying flocks, female slaves and male slaves, camels and donkeys.", "pj": "וּתְקֵיף גַבְרָא לַחֲדָא לַחֲדָא וַהֲווֹ לֵיהּ עָאן סַגִיאִין וְאַמְהָן וְעַבְדִין וּגְמַלִין וְחַמְרִין", "pj_en": "And the man increased greatly, and had a multitude of flocks, and handmaids and servants, and camels, and asses.", "tj": "", "tj_en": "", "rashi": "<b>צאן רבות.<\/b> פָּרוֹת וְרָבוֹת מִשְּׁאָר צֹאן:<br><br><b>ושפחות ועבדים.<\/b> מוֹכֵר צֹאנוֹ בְדָמִים יְקָרִים וְלוֹקֵחַ לוֹ כָּל אֵלֶּה:", "rashi_en": "צאן רבות MANY SHEEP — sheep that multiplied and were fruitful more than other sheep  (Genesis Rabbah 73:11).<br><br>ושפחות ועבדים AND HANDMAIDS, AND MEN-SERVANTS — he used to sell his sheep at a high price and he bought for himself all these (Tanchuma Yashan 1:7:24)."}, {"ch": 31, "v": 1, "aliyah": 5, "heb": "וַיִּשְׁמַ֗ע אֶת־דִּבְרֵ֤י בְנֵֽי־לָבָן֙ לֵאמֹ֔ר לָקַ֣ח יַעֲקֹ֔ב אֵ֖ת כׇּל־אֲשֶׁ֣ר לְאָבִ֑ינוּ וּמֵאֲשֶׁ֣ר לְאָבִ֔ינוּ עָשָׂ֕ה אֵ֥ת כׇּל־הַכָּבֹ֖ד הַזֶּֽה׃", "onk": "וּשְׁמַע יָת פִּתְגָּמֵי בְנֵי לָבָן דְּאָמְרִין נְסִיב יַעֲקֹב יָת כָּל דִּי לְאָבוּנָא וּמִדִּי לְאָבוּנָא <b>קְנָא<\/b> יָת כָּל <b>נִכְסַיָּא הָדֵין<\/b>:", "onk_en": "He [Yaakov] heard the words of Lavan’s sons [who were] saying, Yaakov has taken all that belonged to our father. From that which was our father’s, he made [<b>acquired<\/b>] all this wealth [<b>these possessions<\/b>].", "pj": "וּשְׁמַע יַת פִּתְגָמֵי בְּנֵי לָבָן דְאָמְרִין נְסִיב יַעֲקב יַת כָּל דִי לְאָבוּנָא וּמִדִי לְאָבוּנָא עָבַד לֵיהּ יַת כָּל יְקַר נִכְסַיָא הָאִילֵין", "pj_en": "But he heard the words of the sons of Laban, saying, Jakob hath taken all that was our father's; and from that which was our father's he hath made himself all the glory of these riches.", "tj": "", "tj_en": "", "rashi": "<b>עשה.<\/b> כָּנַס, כְּמוֹ וַיַּעַשׂ חַיִל וַיַּךְ אֶת עֲמָלֵק (שמואל א י\"ד):", "rashi_en": "עשה HE HATH MADE — i.e. gathered, as (1 Samuel 14:48) “And he gathered (ויעש) troops and smote the Amalekites”. "}, {"ch": 31, "v": 2, "aliyah": 5, "heb": "וַיַּ֥רְא יַעֲקֹ֖ב אֶת־פְּנֵ֣י לָבָ֑ן וְהִנֵּ֥ה אֵינֶ֛נּוּ עִמּ֖וֹ כִּתְמ֥וֹל שִׁלְשֽׁוֹם׃", "onk": "וַחֲזָא יַעֲקֹב יָת <b>סְבַר<\/b> אַפֵּי לָבָן וְהָא לֵיתוֹהִי עִמֵּיהּ כְּמֵאִתְמַלֵּי וּמִדְּקַמּוֹהִי:", "onk_en": "Yaakov saw [<b>the expression of<\/b>] Lavan’s face [demeanor] and it was not toward him as it was before.", "pj": "וַחֲמָא יַעֲקב יַת סְבַר אַפּוֹי דְלָבָן וְהָא לֵיתְנוּן שַׁפְיַין לְקִבְלֵיהּ כִּדְאִיתְמְלֵי וְהֵי כִּדְקַדְמוֹי", "pj_en": "And Jakob observed the looks of Laban and, behold, they were not peaceful toward him as yesterday and as before it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 3, "aliyah": 5, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶֽל־יַעֲקֹ֔ב שׁ֛וּב אֶל־אֶ֥רֶץ אֲבוֹתֶ֖יךָ וּלְמוֹלַדְתֶּ֑ךָ וְאֶֽהְיֶ֖ה עִמָּֽךְ׃", "onk": "וַאֲמַר יְיָ לְיַעֲקֹב תּוּב לְאַרְעָא דַאֲבָהָתָךְ וּלְיַלָּדְתָּךְ <b>וִיהֵי מֵימְרִי בְּסַעְדָּךְ<\/b>:", "onk_en": "Adonoy said to Yaakov, Return to the land of your fathers and to your birthplace, and I will be with you [<b>My Word will be your support<\/b>].", "pj": "וַאֲמַר יְיָ לְיַעֲקב תּוּב לְאַרַע אֲבָהָתָךְ וּלְיַלְדוּתָךְ וִיהֵי מֵימְרִי בְּסַעֲדָךְ", "pj_en": "And the Lord said to Jakob, Return to the land of thy fathers, and to thy native place; and My Word shall be for thy help.", "tj": "", "tj_en": "", "rashi": "<b>שוב אל ארץ אבותיך.<\/b> וְשָׁם <b>אהיה עמך<\/b>, אֲבָל בְּעוֹדְךָ מְחֻבָּר לַטָּמֵא אִי אֶפְשָׁר לְהַשְׁרוֹת שְׁכִינָתִי עָלֶיךָ (בראשית רבה):", "rashi_en": "שוב אל ארץ אבותיך RETURN UNTO THE LAND OF THY FATHERS — and there I will be with thee; but as long as you are associated with the unclean Laban it is impossible to make my Divine Presence (Shechina) rest upon you (Midrash Tanchuma, Vayetzei 10)."}, {"ch": 31, "v": 4, "aliyah": 5, "heb": "וַיִּשְׁלַ֣ח יַעֲקֹ֔ב וַיִּקְרָ֖א לְרָחֵ֣ל וּלְלֵאָ֑ה הַשָּׂדֶ֖ה אֶל־צֹאנֽוֹ׃", "onk": "וּשְׁלַח יַעֲקֹב וּקְרָא לְרָחֵל וּלְלֵאָה לְחַקְלָא לְוַת עָנֵיהּ:", "onk_en": "Yaakov sent and called Rochel and Leah to [come to] the field, to his flock.", "pj": "וְשַׁדַר יַעֲקב יַת נַפְתָּלִי דְהוּא אַזְגַד קָלֵיל וּקְרָא לְרָחֵל וּלְלֵאָה וְעָלַן לְחַקְלָא לְוַת עָנֵיהּ", "pj_en": "And Jakob sent Naphtali, who was a swift mes-senger, and he called Rahel and Leah, and they came into the field unto his flock.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא לרחל וללאה.<\/b> לְרָחֵל תְּחִלָּה וְאַחַר כָּךְ לְלֵאָה, שֶׁהִיא הָיְתָה עֲקֶרֶת הַבַּיִת שֶׁבִּשְׁבִילָהּ נִזְדַּוֵּג יַעֲקֹב עִם לָבָן, וְאַף בָּנֶיהָ שֶׁל לֵאָה מוֹדִים בַּדָּבָר, שֶׁהֲרֵי בֹּעַז וּבֵית דִּינוֹ מִשֵּׁבֶט יְהוּדָה אוֹמְרִים כְּרָחֵל וּכְלֵאָה אֲשֶׁר בָּנוּ שְׁתֵּיהֶם וְגוֹ' – הִקְדִּימוּ רָחֵל לְלֵאָה:", "rashi_en": "ויקרא לרחל וללאה AND HE CALLED RACHEL AND LEAH — First Rachel and afterwards Leah for she was the chief wife of the house for whose sake Jacob had entered into relations with Laban. Even the descendants of Leah admitted this (that Rachel was the principal wife), for Boaz and his Law-Court who were of the Tribe of Judah (Leah’s son) said (Ruth 4:11) “like Rachel and like Leah which two did build etc.”, mentioning Rachel before Leah  (Genesis Rabbah 71:2). "}, {"ch": 31, "v": 5, "aliyah": 5, "heb": "וַיֹּ֣אמֶר לָהֶ֗ן רֹאֶ֤ה אָנֹכִי֙ אֶת־פְּנֵ֣י אֲבִיכֶ֔ן כִּֽי־אֵינֶ֥נּוּ אֵלַ֖י כִּתְמֹ֣ל שִׁלְשֹׁ֑ם וֵֽאלֹהֵ֣י אָבִ֔י הָיָ֖ה עִמָּדִֽי׃", "onk": "וַאֲמַר לְהֵן חָזֵי אֲנָא יָת <b>סְבַר<\/b> אַפֵּי אֲבוּכֶן אֲרֵי לֵיתוֹהִי עִמִּי כְּמֵאִתְמַלִּי וּמִדְּקַמּוֹהִי וֵאלָהֵהּ דְּאַבָּא הֲוָה <b>בְּסַעְדִּי<\/b>:", "onk_en": "He said to them, I saw [<b>the expression of<\/b>] your father’s face; it is not toward me as it was before, but the God of my father was with me [<b>my support<\/b>].", "pj": "וַאֲמַר לְהֵין חָמֵי אָנָא יַת סְבַר אַפֵּי אֲבוּכוֹן וְהָא לֵיתְנוּן שַׁפְיַן עִמִי הֵי כִּדְאִיתְמְלִי וְהֵי כִּדְקָדְמוֹי וֵאלָהָא דְאַבָּא הֲוָה מֵימְרֵיהּ בְּסַעֲדִי", "pj_en": "And he said to them, I consider the looks of your father, and, behold, they are not peaceful with me as yesterday and as before it; but the God of my father hath been to my aid.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 6, "aliyah": 5, "heb": "וְאַתֵּ֖נָה יְדַעְתֶּ֑ן כִּ֚י בְּכׇל־כֹּחִ֔י עָבַ֖דְתִּי אֶת־אֲבִיכֶֽן׃", "onk": "וְאַתִּין יְדַעְתִּין אֲרֵי בְּכָל חֵילִי פְּלָחִית יָת אֲבוּכֶן:", "onk_en": "You know that I served your father with all my strength.", "pj": "וְאַתּוּן יְדַעְתּוּן אֲרוּם בְּכָל חֵילִי פְּלָחִית יַת אֲבוּכוֹן", "pj_en": "And you know that with all my strength I have served your father,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 7, "aliyah": 5, "heb": "וַאֲבִיכֶן֙ הֵ֣תֶל בִּ֔י וְהֶחֱלִ֥ף אֶת־מַשְׂכֻּרְתִּ֖י עֲשֶׂ֣רֶת מֹנִ֑ים וְלֹֽא־נְתָנ֣וֹ אֱלֹהִ֔ים לְהָרַ֖ע עִמָּדִֽי׃", "onk": "וַאֲבוּכֶן שְׁקַּר בִּי וְאַשְׁנִי יָת אַגְרִי עֲשַׂר זִמְנִין וְלָא שָׁבְקֵיהּ יְיָ לְאַבְאָשָׁא עִמִּי:", "onk_en": "Your father cheated me and changed my wage ten countings; but Elohim did not let him harm me.", "pj": "וַאֲבוּכוֹן שְׁקַר בִּי (ירוּשׁלמי וּפְרַג) וְשַׁלְחִיף יַת אַגְרִי עֲשַר חוּלְקִין וְלָא יְהַב לֵיהּ יְיָ רְשׁוּ לְאַבְאָשָׁא עִמִי", "pj_en": "but your father hath deceived me, and hath changed my wages ten portions; yet the Lord hath not given him power to do me evil.", "tj": "", "tj_en": "Hath commuted.", "rashi": "<b>עשרת מנים.<\/b> אֵין מוֹנִים פָּחוֹת מֵעֲשָׂרָה:<br><br><b>מנים.<\/b> לְשׁוֹן סְכוּם, כְּלַל הַחֶשְׁבּוֹן וְהֵן עֲשִׂירִיּוֹת; לָמַדְנוּ שֶׁהֶחֱלִיף תְּנָאוֹ ק' פְּעָמִים:", "rashi_en": "עשרת מנים TEN TIMES — The word מנים never means less than ten (Ruth 4:11). <br><br>מנים signifies sum — the total of enumeration — these are tens: we may infer, therefore, that he changed the conditions of his hire one hundred times (Genesis Rabbah 74:3). "}, {"ch": 31, "v": 8, "aliyah": 5, "heb": "אִם־כֹּ֣ה יֹאמַ֗ר נְקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔ךָ וְיָלְד֥וּ כׇל־הַצֹּ֖אן נְקֻדִּ֑ים וְאִם־כֹּ֣ה יֹאמַ֗ר עֲקֻדִּים֙ יִהְיֶ֣ה שְׂכָרֶ֔ךָ וְיָלְד֥וּ כׇל־הַצֹּ֖אן עֲקֻדִּֽים׃", "onk": "אִם כְּדֵין הֲוָה אֲמַר נְמוֹרִין יְהֵא אַגְרָךְ וִילִידָן כָּל <b>עָנָא<\/b> נְמוֹרִין וְאִם כְּדֵין הֲוָה אֲמַר רְגוֹלִין יְהֵא אַגְרָךְ וִילִידָן כָּל <b>עָנָא<\/b> רְגוֹלִין:", "onk_en": "If he would say, The speckled will be your wage, then all the flock [<b>sheep<\/b>] gave birth to speckled ones. If he would say, Ringed ones will be your wage, all the flock [<b>sheep<\/b>] gave birth to ringed ones.", "pj": "אִם כְּדֵין הֲוָה אָמִיר קְרוּחִין יְהֵי אַגְרָךְ וִילֵידַן כָּל עָנָא קְרוּחִין וְאִם כְּדֵין יֵימַר מַאן דְשׁוּמָא בְּרִיגְלֵהוֹן יְהֵי אַגְרָךְ וִילֵידַן כָּל עָנָא מַאן דְשׁוּמָא בְּרִיגְלֵהוֹן", "pj_en": "lf now he said, The streaked shall be thy wages, all the sheep bare streaked; and if now he said, The spotted-footed shall be thy wages, all the sheep bare those which were spotted in their feet:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 9, "aliyah": 5, "heb": "וַיַּצֵּ֧ל אֱלֹהִ֛ים אֶת־מִקְנֵ֥ה אֲבִיכֶ֖ם וַיִּתֶּן־לִֽי׃", "onk": "<b>וְאַפְרֵשׁ<\/b> יְיָ יָת גֵּיתֵי דַאֲבוּכוֹן וִיהַב לִי:", "onk_en": "Thus God delivered [<b>separated<\/b>] your father’s livestock, and gave it to me.", "pj": "וְרוֹקַן יְיָ יַת בֵּיתָא דַאֲבוּכוֹן וִיהַב לִי", "pj_en": "and the Lord hath taken away the flock of your father, and hath given (it) to me.", "tj": "וְרוֹקַן מֵימְרָא דַיְיָ:", "tj_en": "And the Word of the Lord hath taken away.", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 10, "aliyah": 5, "heb": "וַיְהִ֗י בְּעֵת֙ יַחֵ֣ם הַצֹּ֔אן וָאֶשָּׂ֥א עֵינַ֛י וָאֵ֖רֶא בַּחֲל֑וֹם וְהִנֵּ֤ה הָֽעַתֻּדִים֙ הָעֹלִ֣ים עַל־הַצֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּבְרֻדִּֽים׃", "onk": "וַהֲוָה בְּעִדַּן דְּאִתְיַחֲמָא <b>עָנָא<\/b> וּזְקָפִית עַיְנַי וַחֲזֵית בְּחֶלְמָא וְהָא <b>תְיָשַׁיָּא<\/b> דְּסָלְקִין עַל <b>עָנָא<\/b> רְגוֹלִין נְמוֹרִין וּפַצִּיחִין:", "onk_en": "At the time the flock [<b>sheep<\/b>] were in heat [to mate], I lifted my eyes, and in a dream I saw that the males [<b>rams<\/b>] going upon the flock [<b>sheep<\/b>] were ringed, speckled and striped.", "pj": "וַהֲוָה בְּעִידַן דְאִתְיַחֲמָא עָנָא וּזְקָפִית עֵינַי וְחָמִית בְּחֶלְמָא וְהָא בָּרְחַיָיא דְסַלְקִין עַל עָנָא שׁוּמָא בְּרַגְלֵיהוֹן וְקִירְוָוחִין וְגַבֵּיהוֹן חִיוָורִין", "pj_en": "And it was at the time when the flocks conceived, that I lifted up my eyes and saw in a dream, and, behold, the goats which rose upon the flock were spotted in their feet, or streaked or white in their backs.", "tj": "", "tj_en": "", "rashi": "<b>והנה העתדים.<\/b> אַעַ\"פִּ שֶׁהִבְדִּילָם לָבָן כֻּלָּם שֶׁלֹּא יִתְעַבְּרוּ הַצֹּאן דֻּגְמָתָן, הָיוּ הַמַּלְאָכִים מְבִיאִין אוֹתָן מֵעֵדֶר הַמָּסוּר בְּיַד בְּנֵי לָבָן לָעֵדֶר שֶׁבְּיַד יַעֲקֹב (בראשית רבה):<br><br><b>וברדים.<\/b> כְּתַרְגּוּמוֹ וּפַצִּיחִין, פייש\"יר בְּלַעַ\"ז, חוּט שֶׁל לָבָן מַקִּיף אֶת גּוּפוֹ סָבִיב, חֲבַרְבּוּרוֹת שֶׁלּוֹ פְתוּחָה וּמְפֻלֶּשֶׁת מִזּוֹ אֶל זוֹ; וְאֵין לְהָבִיא עֵד מִן הַמִּקְרָא:", "rashi_en": "והנה העתדים BEHOLD THE RAMS — Although Laban had separated all these so that the sheep should not give birth to young marked similar to them, angels brought them from the flock which had been placed in charge of Laban’s sons to the flock in Jacob’s charge  (Genesis Rabbah 73:10).
