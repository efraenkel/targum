ndred and seventy-seven years, and he died.", "pj": "וַהֲווֹ כָּל יוֹמֵי לֶמֶךְ שְׁבַע מְאָה וְשַׁבְעִין וּשְׁבַע שְׁנִין וּמִית", "pj_en": "And all the days of Lemek were seven hundred and seventy and seven years; and he died.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 32, "aliyah": 7, "heb": "וַֽיְהִי־נֹ֕חַ בֶּן־חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַיּ֣וֹלֶד נֹ֔חַ אֶת־שֵׁ֖ם אֶת־חָ֥ם וְאֶת־יָֽפֶת׃", "onk": "וַהֲוָה נֹחַ בַּר חֲמֵשׁ מְאָה שְׁנִין וְאוֹלִיד נֹחַ יָת שֵׁם יָת חָם וְיָת יָפֶת:", "onk_en": "Noach was five hundred years old, and Noach produced Sheim, Cham, and Yafes.", "pj": "וַהֲוָה נחַ בַּר חֲמֵשׁ מְאָה שְׁנִין וְאוֹלִיד נחַ יַת שֵׁם וְיַת חָם וְיַת יָפֶת", "pj_en": "And Noah was the son of five hundred years, and Noah begat Shem, Cham, and Japhet.", "tj": "", "tj_en": "", "rashi": "<b>בן חמש מאות שנה.<\/b> אָמַר רַבִּי יוּדָן מַה טַּעַם כָּל הַדּוֹרוֹת הוֹלִידוּ לְק' שָׁנָה וְזֶה לַחֲמֵשׁ מֵאוֹת? אָמַר הַקָּבָּ\"ה אִם רְשָׁעִים הֵם יֹאבְדוּ בַמַּיִם וְרַע לְצַדִּיק זֶה, וְאִם צַדִּיקִים הֵם אַטְרִיחַ עָלָיו לַעֲשׂוֹת תֵּבוֹת הַרְבֵּה, כָּבַשׁ אֶת מַעְיָנוֹ וְלֹא הוֹלִיד עַד חֲמֵשׁ מֵאוֹת שָׁנָה, כְּדֵי שֶׁלֹּא יְהֵא יֶפֶת הַגָּדוֹל שֶׁבְּבָנָיו רָאוּי לָעֳנָשִׁין לִפְנֵי הַמַּבּוּל (בראשית רבה), דִּכְתִיב כִּי הַנַּעַר בֶּן מֵאָה שָׁנָה יָמוּת (ישעיהו ס\"ה) רָאוּי לְעֹנֶשׁ לֶעָתִיד, וְכֵן לִפְנֵי מַתַּן תוֹרָה:<br><br><b>את שם את חם ואת יפת.<\/b> וַהֲלֹא יֶפֶת הַגָּדוֹל הוּא? אֶלָּא בַתְּחִלָּה אַתָּה דוֹרֵשׁ אֶת שֶׁהוּא צַדִּיק וְנוֹלַד כְּשֶׁהוּא מָהוּל וְשֶׁאַבְרָהָם יָצָא מִמֶּנּוּ וְכו' בבראשית רבה:", "rashi_en": "בן חמש מאות שנה FIVE HUNDRED YEARS OLD — R. Judan said: “How is it that all the previous generations had children at the age of hundred years and this one (Noah) at the age of 500 years? The Holy One, blessed be He, said, “If they (Noah’s children) be wicked, they will perish by the water of the Flood and it will grieve this righteous man; if they be righteous, I shall have to trouble him to construct several arks.” He therefore restrained him from having children until he was 500 years old, in order that Japhet, the oldest of his sons (cf. Rashi on Genesis 10:21) should not reach the punishable age before the Flood. For it is written (Isaiah 65:20), “For as a lad shall one die when he is one hundred years old”, meaning, that in the future time, he will only then be of punishable age, and this was so, too, before the giving of the Torah (Genesis Rabbah 26:2) .<br><br>את שם ואת חם ואת יפת SHEM, HAM AND JAPHETH — But was not Japheth the eldest? But you naturally first interest yourself in Shem who was a righteous man, who was born circumcised (a sign of righteousness) and from whom Abraham was to descend (Genesis Rabbah 26:3)."}, {"ch": 6, "v": 1, "aliyah": 7, "heb": "וַֽיְהִי֙ כִּֽי־הֵחֵ֣ל הָֽאָדָ֔ם לָרֹ֖ב עַל־פְּנֵ֣י הָֽאֲדָמָ֑ה וּבָנ֖וֹת יֻלְּד֥וּ לָהֶֽם׃", "onk": "וַהֲוָה כַּד שְׁרִיאוּ בְנֵי אֱנָשָׁא לְמִסְגֵּי עַל אַפֵּי אַרְעָא וּבְנָתָא אִתְיְלִידוּ לְהוֹן:", "onk_en": "It came to be when men began to multiply on the face of the earth, that daughters were born to them.", "pj": "וַהֲוָה אֲרֵי שְׁרִיאוּ בְּנֵי נְשָׁא לְמִסְגֵי עַל אַנְפֵּי אַרְעָא וּבְנָתָא שַׁפִּירְתָּא אִיתְיְלִידוּ לְהוֹן", "pj_en": "And it was when the sons of men began to multiply upon the face of the earth, and fair daughters were born to them;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 2, "aliyah": 7, "heb": "וַיִּרְא֤וּ בְנֵי־הָֽאֱלֹהִים֙ אֶת־בְּנ֣וֹת הָֽאָדָ֔ם כִּ֥י טֹבֹ֖ת הֵ֑נָּה וַיִּקְח֤וּ לָהֶם֙ נָשִׁ֔ים מִכֹּ֖ל אֲשֶׁ֥ר בָּחָֽרוּ׃", "onk": "וַחֲזוֹ בְנֵי רַבְרְבַיָּא יָת בְּנַת אֱנָשָׁא אֲרֵי שַׁפִּירָן אִנוּן וּנְסִיבוּ לְהוֹן נְשִׁין מִכֹּל <b>דִּי אִתְרְעִיאוּ<\/b>:", "onk_en": "The sons of the rulers saw that the daughters of man were fair and they took for themselves wives from whomever they chose [<b>wanted<\/b>].", "pj": "וְחָמוֹן בְּנֵי רַבְרְבַיָא יַת בְּנַת אֱנָשָׁא אֲרוּם שַׁפִּירָן הִינוּן וְכַחֲלָן וּפַקְסָן וּמְהַלְכִין בְּגִילוּי בִּשְׁרָא וְהִרְהִירוּ לִזְנוּ וּנְסִיבוּ לְהוֹן נְשִׁין מִכָּל דְאִתְרְעִיוּ", "pj_en": "and the sons of the great saw that the daughters of men were beautiful, and painted, and curled, walking with revelation of the flesh, and with imaginations of wickedness; that they took them wives of all who pleased them.", "tj": "", "tj_en": "", "rashi": "<b>בני האלהים.<\/b> בְּנֵי הַשָּׂרִים וְהַשּׁוֹפְטִים. דָּבָר אַחֵר בְּנֵי הָאֱלֹהִים, הֵם הַשָּׂרִים הַהוֹלְכִים בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם, אַף הֵם הָיוּ מִתְעָרְבִים בָּהֶם; כָּל אֱלֹהִים שֶׁבַּמִּקְרָא לְשׁוֹן מָרוּת, וְזֶה יוֹכִיחַ וְאַתָּה תִּהְיֶה לּוֹ לֵאלֹהִים (שמות ד'), רְאֵה נְתַתִּיךָ אֱלֹהִים (שם ז'):<br><br><b>כי טבת הנה.<\/b> אָמַר רַבִּי יוּדָן טבת כְּתִיב, כְּשֶׁהָיוּ מְטִיבִין אוֹתָהּ מְקֻשֶּׁטֶת לִכָּנֵס לַחֻפָּה, הָיָה גָּדוֹל נִכְנָס וּבוֹעֲלָהּ תְּחִלָּה (בראשית רבה):<br><br><b>מכל אשר בחרו.<\/b> אַף בְּעוּלַת בַּעַל, אַף הַזָּכָר וְהַבְּהֵמָה:", "rashi_en": "בני האלהים THE SONS OF ELOHIM — The sons of princes and rulers (Genesis Rabbah 26:15). Another explanation of בני האלהים is that these were princely angels who came as messengers from God: they, too, intermingled with them (the daughters of men). Wherever the word אלהים occurs in the Scriptures it signifies authority, and the following passages prove this: (Exodus 4:16) “and thou shalt be his (אלהים) master”, and (Exodus 7:1) “See, I have made the (אלהים) a master.”<br><br>כי טבת הנה THAT THEY WERE FAIR — Rabbi Judan said, “It is written here טבת, for when they were being made to appear “good” by being decked out to be taken beneath the marriage canopy one of the lords would come and carry her off first (Genesis Rabbah 26:5).<br><br>מכל אשר בחרו OF ALL WHOM THEY CHOOSE — even if it were a married woman or a man or an animal (Genesis Rabbah 26:5)."}, {"ch": 6, "v": 3, "aliyah": 7, "heb": "וַיֹּ֣אמֶר יְהֹוָ֗ה לֹֽא־יָד֨וֹן רוּחִ֤י בָֽאָדָם֙ לְעֹלָ֔ם בְּשַׁגַּ֖ם ה֣וּא בָשָׂ֑ר וְהָי֣וּ יָמָ֔יו מֵאָ֥ה וְעֶשְׂרִ֖ים שָׁנָֽה׃", "onk": "וַאֲמַר יְיָ <b>לָא יִתְקַיַם דָרָא בִישָׁא הָדֵין קֳדָמַי<\/b> לְעַלָם <b>בְּדִיל דְאִנוּן בִּשְׂרָא וְעוֹבָדֵיהוֹן בִּישַׁיָא אַרְכָא יְהִיבַת לְהוֹן מְאָה וְעַשְׂרִין שְׁנִין אִם יְתוּבוּן<\/b>:", "onk_en": "Adonoy said, My spirit will not continue to judge man forever [<b>this evil generation shall not exist before me forever<\/b>], since he is nothing but flesh [<b>since they are flesh and their deeds are evil<\/b>]. His days shall be a hundred and twenty years [<b>I will give them a period of a hundred and twenty years for them to repent<\/b>].", "pj": "וַאֲמַר יְיָ בְּמֵימְרֵיהּ לָא יִתְדְנוּן כָּל דָרַיָא בִּשַׁיָא דַעֲתִידִין לְמֵיקָם בְּסֵדֶר דַיָנַיָא דְדָרָא דְמַבּוּלָא לְמוֹבְדָא וּלְמִשְׁתֵּיצֵי מִגוֹ עַלְמָא הֲלָא יְהָבִית רוּחַ קָדְשִׁי בְּהוֹם מִן בִּגְלַל דִי יַעֲבְדוּן עוֹבָדִין טָבִין וְהָא אַבְאִישׁוּ עוֹבָדֵיהוֹן הָא יְהָבִית לְהוֹן אַרְכָּא מְאָה וְעַשְרִין שְׁנִין מִן בִּגְלַל דְיַעֲבְדוּן תְּתוּבָא וְלָא עָבָדוּ", "pj_en": "And the Lord said by His Word, All the generations of the wicked which are to arise shall not be purged after the order of the judgments of the generation of the deluge, which shall be destroyed and exterminated from the midst of the world. Have I not imparted My Holy Spirit to them, (or, placed My Holy Spirit in them,) that they may work good works? And, behold, their works are wicked. Behold, I will give them a prolongment of a hundred and twenty years, that they may work repentance, and not perish.", "tj": "וַאֲמַר מֵימְרֵיהּ דַיְיָ לָא יִתְדְנוּן דָרַיָא דַעֲתִידִין לְמֵיקָם מִן בָּתַר דָרָא דְמַבּוּלָא לְמוֹבְדָא לְמִשְׁתֵּיצֵי וּלְמִימְחָא גְמִירָא הֲלָא רוּחִי יְהָבִית בִּבְנֵי אֱנָשָׁא מִן בִּגְלַל דְאִינוּן בִּשְרָא וְעוֹבָדֵיהוֹן עוֹבָדִין בִּישִׁין הָא יְהָבִית לְהוֹן אַרְכָּא מְאָה וְעַשְרִין שְׁנִין דִילְמָא דְיַעֲבְדוּן תְּתוּבָא וְלָא עֲבָדוּ:", "tj_en": "And the Word of the Lord said, The generations which are to arise shall not be judged after (the manner of) the generation of the deluge, (which is) to be destroyed, and exterminated, and finally blotted out. Have I not imparted My Spirit to the sons of men, because they are flesh, that they may work good works? But they do works of evil. Behold, I have given them a prolongment of a hundred and twenty years, that they may work repentance; but they have not done it.", "rashi": "<b>לא ידון רוחי באדם.<\/b> לֹא יִתְרַעֵם וְיָרִיב רוּחִי עָלַי בִּשְׁבִיל הָאָדָם<br><br><b>לעלם.<\/b> לְאֹרֶךְ יָמִים; הִנֵּה רוּחִי נָדוֹן בְּקִרְבִּי אִם לְהַשְׁחִית וְאִם לְרַחֵם, לֹא יִהְיֶה מָדוֹן זֶה בְרוּחִי לְעוֹלָם, כְּלוֹמַר לְאֹרֶךְ יָמִים:<br><br><b>בשגם הוא בשר.<\/b> כְּמוֹ בְּשֶׁגַּם, כְּלוֹמַר, בִּשְׁבִיל שֶׁגַּם זֹאת בוֹ, שֶׁהוּא בָשָׂר וְאַף עַל פִּי כֵן אֵינוֹ נִכְנָע לְפָנַי, וּמָה אִם יִהְיֶה אֵשׁ אוֹ דָּבָר קָשֶׁה? כַּיּוֹצֵא בוֹ עַד שַׁקַּמְתִּי דְּבוֹרָה (שופטים ה') כְּמוֹ שֶׁקַּמְתִּי וְכֵן שָׁאַתָּה מְדַבֵּר עִמִּי (שם ו') כְּמוֹ שֶׁאַתָּה, אַף בְּשַׁגַּם כְמוֹ בְשֶׁגַּם;<br><br><b>והיו ימיו וגו'.<\/b> עַד ק\"ך שָׁנָה אַאֲרִיךְ לָהֶם אַפִּי, וְאִם לֹא יָשׁוּבוּ אָבִיא עֲלֵיהֶם מַבּוּל. וְאִם תֹּאמַר מִשֶּׁנּוֹלַד יֶפֶת עַד הַמַּבּוּל אֵינוֹ אֶלָא מֵאָה שָׁנָה, אֵין מֻקְדָּם וּמְאֻחָר בַּתּוֹרָה (פסחים ו') – כְּבָר הָיְתָה הַגְּזֵרָה גְּזוּרָה עֶשְׂרִים שָׁנָה קֹדֶם שֶׁהוֹלִיד נֹחַ תּוֹלָדוֹת, וְכֵן מָצִינוּ בְּסֵדֶר עוֹלָם. יֵשׁ מִדְרְשֵׁי אַגָּדָה רַבִּים בְּלֹא יָדוֹן, אֲבָל זֶה הוּא צִחְצוּחַ פְּשׁוּטוֹ:", "rashi_en": "לא ידון רוחי באדם MY SPIRIT SHALL NOT STRIVE AGAINST MAN — My Spirit shall not be in a state of discontent and shall not strive with Myself because of man.<br><br>לעולם ALWAYS — for a long time. Behold, My Spirit has been contending within Me whether to destroy or whether to show mercy: such contending (deliberation) shall not be forever — meaning, for a long time.<br><br>בשגם הוא בשר FOR THAT HE ALSO IS FLESH — This is the same as בְּשָׁגַּם — that is to say: because this quality is also in him viz., that he is only flesh, and yet he does not humble himself before Me; what would he do if he were of fire or of some other resisting matter! Similarly we find שַׁ for שָׁ, (Judges 5:7) עד שַׁקמתי דבורה “Until I Deborah arose”, where it is the same as שָׁקמתי; so also (Judges 6:17) שַׁאתה מדבר עמי “that it is thou who talkest with me”, where it is the same as שָׁאתה — so also here.<br><br>והיו ימיו וגו THEREFORE HIS DAYS SHALL BE etc. — For 120 years I will be long-suffering with them, and if they repent not I shall bring a flood upon them. If, now, you object, saying that from the birth of Japheth until the Flood there were only 100 years, remember that there is no “earlier” or “later” in the Torah (events are not always related in chronological order) (Pesachim 6b): the decree (regarding the Flood) was issued twenty years before Noah had any children — so we find in Seder Olam. There are many Midrashic explanations of the words לא ידון but this is transparently its plain sense. "}, {"ch": 6, "v": 4, "aliyah": 7, "heb": "הַנְּפִלִ֞ים הָי֣וּ בָאָ֘רֶץ֮ בַּיָּמִ֣ים הָהֵם֒ וְגַ֣ם אַֽחֲרֵי־כֵ֗ן אֲשֶׁ֨ר יָבֹ֜אוּ בְּנֵ֤י הָֽאֱלֹהִים֙ אֶל־בְּנ֣וֹת הָֽאָדָ֔ם וְיָלְד֖וּ לָהֶ֑ם הֵ֧מָּה הַגִּבֹּרִ֛ים אֲשֶׁ֥ר מֵעוֹלָ֖ם אַנְשֵׁ֥י הַשֵּֽׁם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "גִּבָּרַיָּא הֲווֹ בְאַרְעָא בְּיוֹמַיָּא הָאִנּוּן וְאַף בָּתַר כֵּן דִּי יַעֲלוּן בְּנֵי רַבְרְבַיָּא לְוַת בְּנַת אֱנָשָׁא וִילִידָן לְהוֹן אִנוּן גִּבָּרַיָּא דִּמֵעָלְמָא אֱנָשִׁין דִּשְׁמָא:", "onk_en": "There were giants on the earth in those days, and also later, when the sons of the rulers came to the daughters of man and they bore children to them. These were the mightiest ones who ever existed. [They were] men of renown.", "pj": "שַׁמְחַזָאֵי וְעוּזִיאֵל הִינוּן נְפִילִין מִן שְׁמַיָא וַהֲווֹ בְּאַרְעָא בְּיוֹמַיָא הָאִינוּן וְאוּף בָּתַר כֵּן דַעֲלוּן בְּנֵי רַבְרְבַיָא לְוַת בְּנַת אֱנָשָׁא וִילִידַן לְהוֹן וְהִינוּן מִתְקְרִין גַבְרִין דִמְעַלְמָא אִינְשֵׁי שְׁמָהָן", "pj_en": "Schamchazai and Uzziel, who fell from heaven, were on the earth in those days; and also, after the sons of the Great had gone in with the daughters of men, they bare to them: and these are they who are called men who are of the world, men of names.", "tj": "", "tj_en": "", "rashi": "<b>הנפלים.<\/b> עַל שֵׁם שֶׁנָּפְלוּ וְהִפִּילוּ אֶת הָעוֹלָם, וּבְלָשׁוֹן עִבְרִית לְשׁוֹן עֲנָקִים הוּא:<br><br><b>בימים ההם.<\/b> בִּימֵי דוֹר אֱנוֹשׁ וּבְנֵי קַיִן (בראשית רבה):<br><br><b>וגם אחרי כן.<\/b> אַף עַל פִּי שֶׁרָאוּ בְאָבְדָן שֶׁל דּוֹר אֱנוֹשׁ, שֶׁעָלָה אוֹקְיָנוּס וְהֵצִיף שְׁלִישׁ הָעוֹלָם לֹא נִכְנַע דּוֹר הַמַּבּוּל לִלְמֹד מֵהֶם:<br><br><b>אשר יבאו.<\/b> הָיוּ יוֹלְדוֹת עֲנָקִים כְּמוֹתָם:<br><br><b>הגבורים.<\/b> לִמְרֹד בַּמָּקוֹם:<br><br><b>אנשי השם.<\/b> אוֹתָן שֶׁנִּקְּבוּ בְשֵׁמוֹת עִירָד מְחוּיָאֵל מְתוּשָׁאֵל שֶׁנִּקְּבוּ עַל שֵׁם אָבְדָּן, שֶׁנִּמֹּחוּ וְהֻתְּשׁוּ. דָּבָר אַחֵר אַנְשֵׁי שִׁמָּמוֹן, שֶׁשִּׁמְּמוּ אֶת הָעוֹלָם:", "rashi_en": "הנפילים THE GIANTS — Thy were called נפילים because they fell (נפלו) and caused the downfall of (הפילו) the world (Genesis Rabbah 26:7).<br><br>In Hebrew the giants are usually called בימים ההם .ענקים IN THOSE DAYS — In the days of the generations of Enosh and the sons of Cain (Genesis Rabbah 26:7).<br><br>וגם אחרי כן AND ALSO AFTER THAT — Although they witnessed the destruction of the generation of Enosh when the Ocean rose and flooded a third part of the world, yet the generation of the Flood did not humble itself and take a lesson from them (Genesis Rabbah 26).<br><br>אשר יבאו WHEN [THE SONS OF GOD] CAME IN, they (the women) bore children, giants like them (the fathers) (Genesis Rabbah 26:7).<br><br>הגבורים MIGHTY — in rebellion against God.<br><br>אנשי שם MEN OF RENOWN (literally, men of name) — Men who bore distinctive names: עירד, מחויאל, מתושאל being so named because these names have reference to their destruction, for they were wiped out and torn out from the world (מחוי-אל would signify “wiped-out-by-God”, מתושאל “Torn-out-by-God). Another explanation is that they were men of devastation (אנשי שם-מון) — who devastated the world (Genesis Rabbah 26:7). "}, {"ch": 6, "v": 5, "aliyah": 7, "heb": "וַיַּ֣רְא יְהֹוָ֔ה כִּ֥י רַבָּ֛ה רָעַ֥ת הָאָדָ֖ם בָּאָ֑רֶץ וְכׇל־יֵ֙צֶר֙ מַחְשְׁבֹ֣ת לִבּ֔וֹ רַ֥ק רַ֖ע כׇּל־הַיּֽוֹם׃", "onk": "וַחֲזָא יְיָ אֲרֵי סְגִיאַת בִּישַׁת אֱנָשָׁא בְּאַרְעָא וְכָל יִצְרָא מַחְשְׁבַת לִבֵּהּ לְחוֹד בִּישׁ כָּל יוֹמָא:", "onk_en": "Adonoy saw that man’s wickedness had increased on the earth, and that every inclination of his heart was only for evil, all day long.", "pj": "וַחֲמָא יְיָ אֲרוּם סְגִיאַת בִּישַׁת אֱנָשָׁא בְּאַרְעָא וְכָל יִצְרָא דִמְחַשְׁבַת לִבֵּיהּ לְחוֹד בִּישׁ כָּל יוֹמָא", "pj_en": "And the Lord saw that the wickedness of man was great in the earth, and all the imagery of the thought of his heart was only evil every day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 6, "aliyah": 7, "heb": "וַיִּנָּ֣חֶם יְהֹוָ֔ה כִּֽי־עָשָׂ֥ה אֶת־הָֽאָדָ֖ם בָּאָ֑רֶץ וַיִּתְעַצֵּ֖ב אֶל־לִבּֽוֹ׃", "onk": "<b>וְתַב יְיָ בְּמֵימְרֵהּ<\/b> אֲרֵי עֲבַד יָת אֱנָשָׁא בְּאַרְעָא וַאֲמַר <b>בְּמֵימְרֵהּ לְמִתְּבַר תָּקְפְּהוֹן כִּרְעוּתֵהּ<\/b>:", "onk_en": "Adonoy was comforted [<b>regretted in His Word<\/b>] that He had made man on the earth, and He grieved in His heart [<b>and He said with His word to break their strength in accordance with His Will<\/b>].", "pj": "וְתַב יְיָ בְּמֵימְרֵיהּ אֲרוּם עֲבַד יַת אֶנָשָׁא בְּאַרְעָא וְאֵידְיָין עֲלֵיהוֹן בְּמֵימְרֵיהּ", "pj_en": "And it repented the Lord in His Word that He had made man upon the earth; and He passed judgment upon them by His Word.", "tj": "וַהֲוַת תָּהִי מִן קֳדָם יְיָ בְּמֵימְרֵיהּ אֲרֵי עֲבַד יַת אֱנָשָׁא בְּאַרְעָא וַאֲמַר וְעַדְיַין עִם לִבֵּיהּ:", "tj_en": "And there was repentance before the Lord in His Word that He had made man upon the earth. And He said, and judged in His heart.", "rashi": "<b>וינחם ה' כי עשה.<\/b> נֶחָמָה הָיְתָה לְפָנָיו שֶׁבְּרָאוֹ בַתַּחְתּוֹנִים, שֶׁאִלּוּ הָיָה מִן הָעֶלְיוֹנִים הָיָה מַמְרִידָן (בבראשית רבה):<br><br><b>ויתעצב.<\/b> הָאָדָם אֶל לִבּוֹ שֶׁל מָקוֹם, עָלָה בְמַחֲשַׁבְתּוֹ שֶׁל מָקוֹם לְהַעֲצִיבוֹ, זֶהוּ תַּרְגוּם אֻנְקְלוֹס. דָּבָר אַחֵר וַיִּנָּחֶם – נֶהְפְכָה מַחְשַׁבְתּוֹ שֶׁל מָקוֹם מִמִּדַּת רַחֲמִים לְמִדַּת הַדִּין, עָלָה בְמַחְשָׁבָה לְפָנָיו מַה לַּעֲשׂוֹת בָּאָדָם שֶׁעָשָׂה בָּאָרֶץ, וְכֵן כָּל לְשׁוֹן נִחוּם שֶׁבַּמִּקְרָא לְשׁוֹן נִמְלָךְ מַה לַּעֲשׂוֹת, וּבֶן אָדָם וְיִתְנֶחָם (במדבר כ\"ג) וְעַל עֲבָדָיו יִתְנֶחָם (דברים ל\"ב) וַיִּנָּחֶם ה' עַל הָרָעָה (שמות ל\"ב) נִחַמְתִּי כִּי הִמְלַכְתִּי (שמואל א' ט\"ו) כֻּלָּם לְשׁוֹן מַחֲשָׁבָה אַחֶרֶת הֵם:<br><br><b>ויתעצב אל לבו.<\/b> נִתְאַבֵּל עַל אָבְדַן מַעֲשֵׂה יָדָיו, כְּמוֹ נֶעֱצַב הַמֶּלֶךְ עַל בְּנוֹ (שם ב' י\"ט), וְזוֹ כָתַבְתִּי לִתְשׁוּבַת הַמִּינִים גּוֹי אֶחָד שֶׁשָּׁאַל אֶת רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה, אָמַר לוֹ אֵין אַתֶּם מוֹדִים שֶׁהַקָּבָּ\"ה רוֹאֶה אֶת הַנּוֹלָד? אָמַר לוֹ הֵן, אָמַר לוֹ וְהָא כְתִיב וַיִּתְעַצֵּב אֶל לִבּוֹ? אָמַר לוֹ נוֹלַד לְךָ בֵּן זָכָר מִיָּמֶיךָ? אָמַר לוֹ הֵן, אָמַר לוֹ וּמֶה עָשִׂיתָ? אָמַר לוֹ שָׂמַחְתִּי וְשִׂמַּחְתִּי אֶת הַכֹּל, אָמַר לוֹ וְלֹא הָיִיתָ יוֹדֵעַ שֶׁסּוֹפוֹ לָמוּת? אָמַר לוֹ בִּשְׁעַת חֶדְוָתָא חֶדְוָתָא בִּשְׁעַת אֶבְלָא אֶבְלָא, אָמַר לוֹ כָּךְ מַעֲשֵׂה הַקָּבָּ\"ה, אַף עַל פִּי שֶׁגָּלוּי לְפָנָיו שֶׁסּוֹפָן לַחֲטוֹא וּלְאָבְדָן לֹא נִמְנַע מִלְּבָרְאָן בִּשְׁבִיל הַצַּדִּיקִים הָעֲתִידִים לַעֲמֹד מֵהֶם:", "rashi_en": "וינחם ה' כי עשה AND THE LORD REPENTED THAT HE HAD MADE — (The first word is connected with that which means “comfort”) It was a consolation to Him that He had created man on earth, for had he been one of the heavenly beings he would have incited them also to rebel against God (Genesis Rabbah 27:4).<br><br>ויתעצב GRIEVED HIM — means, in the mind of God man became an object to be troubled (punished): it entered God’s heart to grieve him. This is how the Targum of Onkelos understands the verse. Another explanation of verse 6: וינחם AND [THE LORD] REPENTED — The thoughts of God turned from Divine mercy to Divine justice: He considered what to do with man whom He had made on the earth. Wherever this term is used in the Scripture it means “considering what to do”. Examples are: (Numbers 23:19) “nor the son of man that He should consider (ויתנחם)”; (Deuteronomy 32:36) “and reconsider (ויתנחם) regarding His servants”; (Exodus 32:14) “and the Lord reconsidered (וינחם) regarding the evil”; (1 Samuel 15:11) “I am reconsidering (נחמתי) that I have set up Saul to be king” — all these passages denote a change of mind.<br><br>ויתעצב אל לבו AND IT GRIEVED HIM AT HIS HEART— He mourned at the failure of His handiwork. Similarly (2 Samuel 19:3) ‘The king grieved (נעצב) for his son”. (Similarly here: God grieved for his (man’s) heart: that it had changed from good to bad). The following extract from the Midrash Rabbah I am writing in order that you may know how to refute the arguments of certain heretics: A gentile once asked Rabbi Joshua, the son of Korcha, saying to him, “Do you not admit that the Holy One, blessed be He, knows what is to happen in the future?” He replied, “Yes.” The gentile retorted, “But is it not written ‘and He was grieved in His heart’?” He answered: “Have you ever had a son born to you?” The reply was “Yes.” He asked (the gentile): “And what did you do?” He replied: “I rejoiced and I made others rejoice also.” The Rabbi asked him: “But did you not know that he must die?” The heathen replied: “At the time of joy, let there be joy, at the time of mourning let there be mourning”. The Rabbi then said: “Such, too, is the way of the Holy One, blessed be He: although it was clear to Him that in the end men would sin and would be destroyed, He did not refrain from creating them for the sake of the righteous men who were to issue from them” (Genesis Rabbah 27:4). "}, {"ch": 6, "v": 7, "aliyah": 7, "heb": "וַיֹּ֣אמֶר יְהֹוָ֗ה אֶמְחֶ֨ה אֶת־הָאָדָ֤ם אֲשֶׁר־בָּרָ֙אתִי֙ מֵעַל֙ פְּנֵ֣י הָֽאֲדָמָ֔ה מֵֽאָדָם֙ עַד־בְּהֵמָ֔ה עַד־רֶ֖מֶשׂ וְעַד־ע֣וֹף הַשָּׁמָ֑יִם כִּ֥י נִחַ֖מְתִּי כִּ֥י עֲשִׂיתִֽם׃", "onk": "וַאֲמַר יְיָ אֶמְחֵי יָת אֲנָשָׁא דִּי בְרֵאתִי מֵעַל אַפֵּי אַרְעָא מֵאֱנָשָׁא עַד בְּעִירָא עַד רִיחֲשָׁא וְעַד עוֹפָא דִּשְׁמַיָּא אֲרֵי תָבִית <b>בְּמֵימְרִי<\/b> אֲרֵי עֲבַדְתִּנוּן:", "onk_en": "Adonoy said, I will obliterate mankind which I have created from the face of the earth, from man to beast, to the creeping things and to the birds of heaven, for I regret [<b>with My word<\/b>] that I made them.", "pj": "וַאֲמַר יְיָ אַבְטִיל אֱנָשָׁא בְּמֵימְרִי דִבְרֵיתִי מֵעַל אַנְפֵּי אַרְעָא מֵאֱנָשָׁא עַד בְּעִירָא עַד רִיחֲשָׁא וְעַד עוֹפָא דִשְׁמַיָא אַרוּם תָּבִית בְּמֵימְרִי אֲרוּם עֲבַדְתִּינוּן", "pj_en": "And the Lord said, I will abolish by My Word man, whom I have created upon the face of the earth, from man to cattle, to the reptile, and to the fowl of the heavens; because I have repented in My Word that I have made them.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אמחה את האדם.<\/b> הוּא עָפָר וְאָבִיא עָלָיו מַיִם וְאֶמְחֶה אוֹתוֹ, לְכָךְ נֶאֱמַר לָשׁוֹן מִחוּי:<br><br><b>מאדם עד בהמה.<\/b> אַף הֵם הִשְׁחִיתוּ דַּרְכָּם (בראשית רבה). דָּבָר אַחֵר הַכֹּל נִבְרָא בִּשְׁבִיל אָדָם וְכֵיוָן שֶׁהוּא כָלֶה מַה צֹּרֶךְ בְּאֵלּוּ:<br><br><b>כי נחמתי כי עשיתם.<\/b> חָשַׁבְתִּי מַה לַּעֲשׂוֹת עַל אֲשֶׁר עֲשִׂיתִים:", "rashi_en": "ויאמר ה' אמחה את האדם AND GOD SAID I WILL BLOT OUT THE MAN — He is dust and I shall bring water upon him and blot him out: that is why this root מחה is used (it expresses the idea of sponging out by means of wet or dampness) (Genesis Rabbah 28:2).<br><br>מאדם ועד בהמה — FROM MAN, TO BEAST — These also corrupted their way (Genesis Rabbah 28:8). Another explanation is: All things were created on man’s account; when he ceases to be, what need of them? (Sanhedrin 108a)<br><br>כי נחמתי כי עשיתים means for I have thought out what to do because I have made them. (Cf. this with Rashi’s second explanation of וינחם 5:6)."}, {"ch": 6, "v": 8, "aliyah": 7, "heb": "וְנֹ֕חַ מָ֥צָא חֵ֖ן בְּעֵינֵ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְנֹחַ אַשְׁכַּח <b>רַחֲמִין קֳדָם<\/b> יְיָ:", "onk_en": "But Noach found favor [<b>mercy<\/b>] in the eyes of [<b>before<\/b>] Adonoy.", "pj": "וְנח דַהֲוָה צַדִיק אַשְׁכַּח חִינָא קֳדָם יְיָ", "pj_en": "But Noah, who was righteous, found favour before the Lord.", "tj": "וְנחַ עַל דַהֲוָה צַדִיק בְּדָרֵיהּ אַשְׁכַּח חִינָא וְחִסְדָא קֳדָם יְיָ:", "tj_en": "But Noah, because he was righteous in his generation, found favour and mercy before the Lord.", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
