<style>

  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const SLUG = "behar";
const DATA = [{"ch": 25, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֤ר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה בְּהַ֥ר סִינַ֖י לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בְּטוּרָא דְסִינַי לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe on Mount Sinai, saying;", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה בְּטַוְורָא דְסִינַי לְמֵימָר", "pj_en": "AND the Lord spake with Mosheh in the mountain of Sinai, saying:", "tj": "", "tj_en": "", "rashi": "<b>בהר סיני.<\/b> מָה עִנְיַן שְׁמִטָּה אֵצֶל הַר סִינַי? וַהֲלֹא כָל הַמִּצְוֹת נֶאֶמְרוּ מִסִּינַי? אֶלָּא מַה שְּׁמִטָּה נֶאֶמְרוּ כְלָלוֹתֶיהָ וּפְרָטוֹתֶיהָ וְדִקְדּוּקֶיהָ מִסִּינַי אַף כֻּלָּן נֶאֶמְרוּ כְלָלוֹתֵיהֶן וְדִקְדּוּקֵיהֶן מִסִּינַי, כָּךְ שְׁנוּיָה בְּתֹ\"כֹּ; וְנִרְאֶה לִי שֶׁכָּךְ פֵּרוּשָׁהּ: לְפִי שֶׁלֹּא מָצִינוּ שְׁמִטַּת קַרְקָעוֹת שֶׁנִּשְׁנֵית בְּעַרְבוֹת מוֹאָב בְּמִשְׁנֵה תוֹרָה, לָמַדְנוּ שֶׁכְּלָלוֹתֶיהָ וּפְרָטוֹתֶיהָ כֻּלָּן נֶאֶמְרוּ מִסִּינַי, וּבָא הַכָּתוּב וְלִמֵּד כָּאן עַל כָּל דִּבּוּר שֶׁנִּדְבַּר לְמֹשֶׁה, שֶׁמִּסִּינַי הָיוּ כֻלָּם, כְּלָלוֹתֵיהֶן וְדִקְדּוּקֵיהֶן, וְחָזְרוּ וְנִשְׁנוּ בְּעַרְבוֹת מוֹאָב:", "rashi_en": "בהר סיני [AND THE LORD SPOKE UNTO MOSES] ON THE MOUNT SINAI — What has the matter of the Sabbatical year to do with Mount Sinai that Scripture felt compelled to expressly state where it was commanded? Were not all commandments given on Sinai? But this statement is intended to suggest the following comparison: How is it in the case of the law of Shemittah? Its general rules, [its specific prescriptions] and minute details were ordained on Mount Sinai! So, also, were all commandments with their general rules and their minute details ordained on Mount Sinai. Thus is taught in Torath Cohanim (Sifra, Behar, Section 1 1). It seems to me that the following is the explanation of this: Since we do not find in Deuteronomy that the law concerning “the rest of the soil in the Sabbatical year” was repeated in “the fields of Moab” (cf. Deuteronomy 34:1; the place where Moses repeated many of the commandments contained in the other books of the Pentateuch), we may infer that all its general rules and specific prescriptions must have been promulgated on Sinai. The express mention of בהר סיני here appears therefore to be unnecessary but Scripture by mentioning it intends to teach regarding every Divine command (lit., Divine utterance) that was spoken to Moses that in every case they, their general rules and minute details originated at Sinai and that they were only repeated again in “the fields of Moab”."}, {"ch": 25, "v": 2, "aliyah": 1, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם כִּ֤י תָבֹ֙אוּ֙ אֶל־הָאָ֔רֶץ אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֣ן לָכֶ֑ם וְשָׁבְתָ֣ה הָאָ֔רֶץ שַׁבָּ֖ת לַיהֹוָֽה׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲרֵי תֵעֲלוּן לְאַרְעָא דִּי אֲנָא יָהֵב לְכוֹן וְתַשְׁמֵט אַרְעָא שְׁמִטְּתָא קֳדָם יְיָ:", "onk_en": "Speak to Bnei Yisroel and say to them, when you come to the land which I give to you the land shall be at rest—a <i>Shabbos<\/i> for [<b>rest before<\/b>] Adonoy.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֲרוּם תֵּיעָלוּן לְאַרְעָא דַאֲנָא יָהֵיב לְכוֹן וְתַשְׁמֵט אַרְעָא שְׁמִיטְתָא קֳדָם יְיָ", "pj_en": "Speak with the children of Israel, and say to them: When you have entered into the land that I will give to you, then shall the ground rest for a rest before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>שבת לה'.<\/b> לְשֵׁם ה', כְּשֵׁם שֶׁנֶּאֱמַר בְּשַׁבַּת בְּרֵאשִׁית (עי' ספרא):", "rashi_en": "שבת לה׳ [THEN SHALL THE LAND KEEP) A REST ‎'לה‎ — This means a rest in honor of the Lord (not a rest for the Lord, as in v. 4: שבת שבתון יהיה לארץ, “there shall be a strict Sabbath for the land”, i. e. for the land to rest) in the same sense as these words are used in the case of the weekly Sabbath (lit., the Sabbath of Creation) (Exodus 20:10) where 'שבת לה‎ cannot mean “a day for God to rest” (Sifra, Behar, Chapter 1 2)."}, {"ch": 25, "v": 3, "aliyah": 1, "heb": "שֵׁ֤שׁ שָׁנִים֙ תִּזְרַ֣ע שָׂדֶ֔ךָ וְשֵׁ֥שׁ שָׁנִ֖ים תִּזְמֹ֣ר כַּרְמֶ֑ךָ וְאָסַפְתָּ֖ אֶת־תְּבוּאָתָֽהּ׃", "onk": "שִׁית שְׁנִין תִּזְרַע חַקְלָךְ וְשִׁית שְׁנִין תִּכְסַח כַּרְמָךְ וְתִכְנוֹשׁ יָת עֲלַלְתַּהּ:", "onk_en": "For six years you shall plant your field and for six years you shall prune your vineyard and you shall harvest its produce.", "pj": "שִׁית שְׁנִין תִּזְרְעוּן חַקְלֵיכוֹן וְשִׁית שְׁנִין תִּנְזְרוּן כַּרְמֵיכוֹן וְתִכְנְשׁוּן יַת עֲלַלְתָּהּ", "pj_en": "Six years you shall sow your fields, and six years prune your vineyards and gather in the fruit;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 4, "aliyah": 1, "heb": "וּבַשָּׁנָ֣ה הַשְּׁבִיעִ֗ת שַׁבַּ֤ת שַׁבָּתוֹן֙ יִהְיֶ֣ה לָאָ֔רֶץ שַׁבָּ֖ת לַיהֹוָ֑ה שָֽׂדְךָ֙ לֹ֣א תִזְרָ֔ע וְכַרְמְךָ֖ לֹ֥א תִזְמֹֽר׃", "onk": "וּבְשַׁתָּא שְׁבִיעֲתָא נְיַח שְׁמִטְּתָא יְהֵי לְאַרְעָא דְּתַשְׁמֵט קֳדָם יְיָ חַקְלָךְ לָא תִזְרַע וְכַרְמָךְ לָא תִכְסָח:", "onk_en": "But the seventh year shall be a <i>Shabbos<\/i> of [<b>complete<\/b>] rest for the land, a <i>Shabbos<\/i> for [<b>rest before<\/b>] Adonoy, you shall not plant your field and you shall not prune your vineyard.", "pj": "וּבְשַׁתָּא שְׁבִיעֲתָא נְיַיח דִשְׁמִיטְתָא יְהֵי לְאַרְעָא דִי תַשְׁמֵט קֳדָם יְיָ חַקְלֵיכוֹן לָא תִזְרְעוּן וְכַרְמֵיכוֹן לָא תִנְזְרוּן", "pj_en": "but in the seventh year there shall be a rest of remission to the earth, that she may rest before the Lord; you shall not sow your fields, nor prune your vineyards.", "tj": "", "tj_en": "", "rashi": "<b>יהיה לארץ.<\/b> לַשָּׂדוֹת וְלַכְּרָמִים:<br><br><b>לא תזמר.<\/b> שֶׁקּוֹצְצִין זְמוֹרוֹתֶיהָ, וְתַרְגּוּמוֹ לָא תִכְסָח, וְדוֹמֶה לוֹ \"קוֹצִים כְּסוּחִים\" (ישעיהו ל\"ג), \"שְֹרֻפָה בָאֵשׁ כְּסוּחָה\" (תהילים פ'):", "rashi_en": "יהיה לארץ [A SABBATH OF STRICT REST] SHALL BE UNTO THE LAND [or SOIL] — unto the fields and vineyards.<br><br>לא תזמר — The word is a denominative verb from זמורה, a branch, and denotes: to do something to the branches: it is used here because one lops off its (the vineyard’s) branches. Its translation in the Targum is thus: לא תכסח, “thou shall not cut off”, and this root has a similar meaning in the Hebrew (Isaiah 33:12) “as thorns cut off (כסוחים)”; (Psalms 80:17) “it is burnt with fire, it is cut down (כסוחה). "}, {"ch": 25, "v": 5, "aliyah": 1, "heb": "אֵ֣ת סְפִ֤יחַ קְצִֽירְךָ֙ לֹ֣א תִקְצ֔וֹר וְאֶת־עִנְּבֵ֥י נְזִירֶ֖ךָ לֹ֣א תִבְצֹ֑ר שְׁנַ֥ת שַׁבָּת֖וֹן יִהְיֶ֥ה לָאָֽרֶץ׃", "onk": "יָת כַּתֵּי דַחֲצָדָךְ לָא תֶחֱצַד וְיָת עִנְּבֵי שִׁבְקָךְ לָא תִקְטוֹף שְׁנַת שְׁמִטְּתָא יְהֵי לְאַרְעָא:", "onk_en": "[Even] crops that grew on their own [from the seeds of your previous] harvest you shall not reap, and the grapes of your untended vines you shall not gather; it shall be a year of complete rest for the land.", "pj": "יַת כַּתֵּי שָׁבֵיק חַצְדְכוֹן לָא תְחַצְדוּן וְיַת עִינְבֵי רְדוּפֵיכוֹן צ\"ל פרודיכון לָא תִקְטְפוּן שְׁנַת שְׁמִיטָתָא יְהֵי לְאַרְעָא", "pj_en": "The after crop which remaineth from your harvests you may not reap, nor of your later grapes make a vintage; a year of remission it shall be unto the earth;", "tj": "", "tj_en": "", "rashi": "<b>את ספיח קצירך.<\/b> אֲפִלּוּ לֹא זְרַעְתָּהּ וְהִיא צָמְחָה מִן הַזֶּרַע שֶׁנָּפַל בָּהּ בְּעֵת הַקָּצִיר וְהוּא קָרוּי סָפִיחַ:<br><br><b>לא תקצור.<\/b> לִהְיוֹת מַחֲזִיק בּוֹ כִּשְׁאָר קָצִיר, אֶלָּא הֶפְקֵר יִהְיֶה לַכֹּל:<br><br><b>נזירך.<\/b> שֶׁהִנְזַרְתָּ וְהִפְרַשְׁתָּ בְנֵי אָדָם מֵהֶם וְלֹא הִפְקַרְתָּם:<br><br><b>לא תבצר.<\/b> אוֹתָם אֵינְךָ בוֹצֵר, אֶלָּא מִן הַמֻּפְקָר:", "rashi_en": "את ספיח קצירך  THAT WHICH GROW OF ITS OWN ACCORD OF THY HARVEST — i. e. even if you have not sown it but it grew from the seed which fell into it (into the ground) at the time of the last harvest — and that is what the term ספיח denotes.<br><br>לא תקצור THOU SHALT NOT REAP [IT] — to take it as your exclusive property as you do with other harvests (with the harvest in another year) but it shall be free (הפקר) to all and then thou also may reap of it.<br><br>נזירך [AND THE GRAPES OF THY VINE] WHICH ARE נזירים — i. e. those from which you barred people (שהנזרת) and from which you have kept them away, not having declared them free to everybody.<br><br>לא תבצר THOU SHALT NOT GATHER — them thou must not gather, but you may gather from that which has been declared free to everybody (Sifra, Behar, Chapter 1 3)."}, {"ch": 25, "v": 6, "aliyah": 1, "heb": "וְ֠הָיְתָ֠ה שַׁבַּ֨ת הָאָ֤רֶץ לָכֶם֙ לְאׇכְלָ֔ה לְךָ֖ וּלְעַבְדְּךָ֣ וְלַאֲמָתֶ֑ךָ וְלִשְׂכִֽירְךָ֙ וּלְתוֹשָׁ֣בְךָ֔ הַגָּרִ֖ים עִמָּֽךְ׃", "onk": "וּתְהֵי שְׁמִטַּת אַרְעָא לְכוֹן לְמֵיכַל לָךְ וּלְעַבְדָּךְ וּלְאַמְתָךְ וְלַאֲגִירָךְ וּלְתוֹתָבָךְ דְּדָיְרִין עִמָּךְ:", "onk_en": "The [produce] [<b>rest<\/b>] of the lands <i>Shabbos<\/i>[-year] [<b>land<\/b>] shall be for yourselves, for food, for you, your servant and your maidservant, for your hired hand and your resident sojourner who reside with you.", "pj": "וּתְהֵי שְׁמִיטַת אַרְעָא לְכוֹן לְמֵיכַל לָךְ וּלְעַבְדָךְ וּלְאַמְתָךְ וּלְאַגִירָךְ וּלְתוֹתָבָךְ דְדַיְירִין עִמָךְ", "pj_en": "but the remission of the ground shall be to you for food, to thee, to thy servant, and to thine handmaid, and to thy hireling, and to the stranger who dwelleth with thee;", "tj": "", "tj_en": "", "rashi": "<b>והיתה שבת הארץ וגו'.<\/b> אַעַ\"פִּ שֶׁאֲסַרְתִּים עָלֶיךָ, לֹא בַאֲכִילָה וְלֹא בַּהֲנָאָה אֲסַרְתִּים, אֶלָּא שֶׁלֹּא תִנְהֹג בָהֶם כְּבַעַל הַבַּיִת, אֶלָּא הַכֹּל יִהְיוּ שָׁוִים בָּהּ, אַתָּה וּשְׂכִירְךָ וְתוֹשָׁבְךָ:<br><br><b>שבת הארץ לכם לאכלה.<\/b> מִן הַשָּׁבוּת אַתָּה אוֹכֵל, וְאִי אַתָּה אוֹכֵל מִן הַשָּׁמוּר (ספרא):<br><br><b>לך ולעבדך ולאמתך.<\/b> לְפִי שֶׁנֶאֱמַר וְאָכְלוּ אֶבְיֹנֵי עַמֶּךָ (שמות כ\"ג), יָכוֹל יִהְיוּ אֲסוּרִים בַּאֲכִילָה לָעֲשִׁירִים, תַּ\"לֹ לְךָ וּלְעַבְדְּךָ וְלַאֲמָתֶךָ, הֲרֵי בְעָלִים וַעֲבָדִים וּשְׁפָחוֹת אֲמוּרִים כָּאן (ספרא):<br><br><b>ולשכירך ולתושבך.<\/b> אַף הַגּוֹיִם (שם):", "rashi_en": "'והיתה שבת הארץ וגו‎‎‎‎ AND THE SABBATH OF THE LAND SHALL BE [FOOD FOR YOU] — Although I have forbidden them (the fruits of the sabbatical year) to you by stating “thou shalt not harvest etc.”, I do not mean to forbid them to you as food or to be used for any other beneficial purpose but what I meant was that you should not comport yourself in respect of them as the exclusive owner but all must be equal as regards it (the Sabbatical year’s produce) — you and your hired servant and your sojourner.<br><br>שבת הארץ לכם לאכלה THE שבת OF THE LAND [SHALL BE] FOR FOOD FOR YOU — Since Scripture does not state והיתה תבואת הארץ לכם לאכלה‏ but‎‎  והיתה שבת הארץ לכם לאכלה it intimates: Only that which has been treated according to the Sabbatical law (שבות) and been declared free to all may you eat, but not that which has been kept by you (Sifra, Behar, Chapter 1 5).<br><br>לך ולעבדך ולאמתך [AND THE SABBATH OF THE LAND SHALL BE FOOD FOR YOU]; FOR THEE, FOR THY SERVANT, AND FOR THY MAID SERVANT — Because it states (Exodus 23:11) “[but in the seventh year thou shalt let it rest and lie still]; that the needy of thy people may eat”, one might think that they (the fruits of the Sabbatical year) are forbidden as food for the rich (and thus also for the owner of the field and his household), Scripture therefore states here: “[it shall be for food for thee,] for thy servant, and for thy maid servant” — thus you have the mention of the owners (the rich) here as well as of the servants and the maid servants — the poor (Sifra, Behar, Chapter 1 6).<br><br>ולשכירך ולתושבך AND FOR THY HIRED SERVANT, AND FOR THY SOJOURNER — Even non-Jews (Sifra, Behar, Chapter 1 7)."}, {"ch": 25, "v": 7, "aliyah": 1, "heb": "וְלִ֨בְהֶמְתְּךָ֔ וְלַֽחַיָּ֖ה אֲשֶׁ֣ר בְּאַרְצֶ֑ךָ תִּהְיֶ֥ה כׇל־תְּבוּאָתָ֖הּ לֶאֱכֹֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְלִבְעִירָךְ וּלְחַיְתָא דִּי בְאַרְעָךְ תְּהֵי כָל עֲלַלְתַּהּ לְמֵיכָל:", "onk_en": "[Also] for your domesticated animals and for the [wild] beasts that are in your land shall all of its produce be for food.", "pj": "וְלִבְעִירָךְ וּלְחַיְיתָא דִי בְאַרְעָךְ תְּהֵי כָּל עֲלַלְתָּא לְמֵיכַל", "pj_en": "and for thy cattle and for the animals that are in thy land shall be the produce of it (also).", "tj": "", "tj_en": "", "rashi": "<b>ולבהמתך ולחיה.<\/b> אִם חַיָּה אוֹכֶלֶת, בְּהֵמָה לֹא כָּל שֶׁכֵּן, שֶׁמְּזוֹנוֹתֶיהָ עָלֶיךָ, מַה תַּ\"לֹ וְלִבְהֶמְתְּךָ? מַקִּישׁ בְּהֵמָה לַחַיָּה, כָּל זְמַן שֶׁחַיָּה אוֹכֶלֶת מִן הַשָּׂדֶה, הַאֲכֵל לִבְהֶמְתְּךָ מִן הַבַּיִת, כָּלָה לַחַיָּה מִן הַשָּׂדֶה, כַּלֵּה לִבְהֶמְתְּךָ מִן הַבַּיִת (שם; תענית ו'):", "rashi_en": "ולבהמתך ולחיה AND FOR THY BEAST, AND FOR THY CATTLE [… SHALL ALL THE INCREASE THEREOF BE FOOD] — If the wild beast may eat thereof how much the more is this the case with cattle to supply which with food is your duty! What, then, is intended by Scripture specially stating “and for thy cattle”? But by mentioning it, it intends to put on a level (to suggest equal treatment of) the cattle with the wild beast: so long as the wild beast has the opportunity of eating from the produce in the field, feed your cattle with what is stored in the house; as soon, however, as food has disappeared for the wild beast from out of the field, make it disappear for thy cattle from out of thy house [i. e. clear it out of thy house into the field and make it thus available to all animals alike] (Sifra, Behar, Chapter 1 8; Taanit 6b)."}, {"ch": 25, "v": 8, "aliyah": 1, "heb": "וְסָפַרְתָּ֣ לְךָ֗ שֶׁ֚בַע שַׁבְּתֹ֣ת שָׁנִ֔ים שֶׁ֥בַע שָׁנִ֖ים שֶׁ֣בַע פְּעָמִ֑ים וְהָי֣וּ לְךָ֗ יְמֵי֙ שֶׁ֚בַע שַׁבְּתֹ֣ת הַשָּׁנִ֔ים תֵּ֥שַׁע וְאַרְבָּעִ֖ים שָׁנָֽה׃", "onk": "וְתִמְנֵי לָךְ שְׁבַע שְׁמִטִּין דִּשְׁנִין שְׁבַע שְׁנִין שְׁבַע זִמְנִין וִיהוֹן לָךְ יוֹמֵי שְׁבַע שְׁמִטִּין דִּשְׁנִין אַרְבְּעִין וְתֵשַׁע שְׁנִין:", "onk_en": "You shall count for yourself seven sabbatical years [<b>of rest<\/b>], seven years, seven times and it shall be for you, the days (period) of the seven sabbatical years [<b>of rest<\/b>], forty-nine years.", "pj": "וְתִמְנֵי לָךְ שְׁבַע שְׁמִיטִין דִשְׁנִין שְׁבַע שְׁנִין שְׁבַע זִימְנִין וִיהוֹן לָךְ סְכוּם שְׁבַע שְׁמִיטִין דִשְׁנִין אַרְבְּעִין וּתְשַׁע שְׁנִין", "pj_en": "And thou shalt number to thee seven Sabbaths of years, seven times seven years, and they shall be to thee the sum of the days of seven Sabbaths (or remissions, shemittin) of years, forty and nine years.", "tj": "", "tj_en": "", "rashi": "<b>שבתת שנים.<\/b> שְׁמִטּוֹת שָׁנִים, יָכוֹל יַעֲשֶׂה שֶׁבַע שָׁנִים רְצוּפוֹת שְׁמִטָּה וְיַעֲשֶׂה יוֹבֵל אַחֲרֵיהֶם, תַּ\"לֹ שֶׁבַע שָׁנִים שֶׁבַע פְּעָמִים, הֱוֵי אוֹמֵר כָּל שְׁמִטָּה וּשְׁמִטָּה בִּזְמַנָּהּ (ספרא):<br><br><b>והיו לך ימי שבע וגו'.<\/b> מַגִּיד לְךָ, שֶׁאַעַ\"פִּ שֶׁלֹּא עָשִׂיתָ שְׁמִטּוֹת, עֲשֵׂה יוֹבֵל לְסוֹף מ\"ט שָׁנָה; וּפְשׁוּטוֹ שֶׁל מִקְרָא: יַעֲלֶה לְךָ חֶשְׁבּוֹן שְׁנוֹת הַשְּׁמִטּוֹת לְמִסְפַּר מ\"ט:", "rashi_en": "שבתות שנים [AND THOU SHALT NUMBER] SEVEN SABBATHS OF YEARS [UNTO THEE] — seven Shemittah-periods of years (cf. Onkelos). One might think that one may keep seven successive years as “Shemittah” and keep the year immediately following them as the “Jubilee”, Scripture therefore states “seven years, seven times”, consequently you are bound to say that each of these seven years of release has to be kept in its proper time (i, e. at the end of six years of work) (Sifra, Behar, Section 1 1).<br><br>'והיו לך ימי שבע וגו‎‎ AND THE PERIOD OF SEVEN [SABBATHS OF YEARS] SHALL BE UNTO THEE [FORTY AND NINE YEARS] — This mention of the sum total tells you that even if you have not kept the years of “Shemittah” keep the “Jubilee” at the end of forty-nine years (Sifra, Behar, Section 1 2). (The translation according to this Midrashic explanation therefore is: When seven Sabbaths of years (i. e. the seven seven-year periods) will be unto thee forty-nine years, thou shalt cause the horn to be blown etc. — no matter whether you have kept the intervening שמיטות or not.) The plain sense of the verse, however, is: The sum total of the periods of which each ends in a “Shemittah” (or, the sum total of these Shemittah-periods) will give thee forty-nine years."}, {"ch": 25, "v": 9, "aliyah": 1, "heb": "וְהַֽעֲבַרְתָּ֞ שׁוֹפַ֤ר תְּרוּעָה֙ בַּחֹ֣דֶשׁ הַשְּׁבִעִ֔י בֶּעָשׂ֖וֹר לַחֹ֑דֶשׁ בְּיוֹם֙ הַכִּפֻּרִ֔ים תַּעֲבִ֥ירוּ שׁוֹפָ֖ר בְּכׇל־אַרְצְכֶֽם׃", "onk": "וְתַעֲבַר שׁוֹפַר יַבָּבָא בְּיַרְחָא שְׁבִיעָאָה בְּעַשְׂרָא לְיַרְחָא בְּיוֹמָא דְכִפּוּרַיָּא תַּעַבְּרוּן שׁוֹפָרָא בְּכָל אַרְעֲכוֹן:", "onk_en": "You shall make a proclamation [<b>crying<\/b>] with the <i>shofor<\/i> on the tenth day of the seventh month. On Yom Kippur shall this <i>shofor<\/i>-proclamation be made. throughout all your land.", "pj": "וְתַעֲבַר קַל שׁוֹפָר יַבָּבָא בְּיַרְחָא שְׁבִיעָאָה בְּעַשְרָא לְיַרְחָא בְּיוֹמָא דְכִפּוּרַיָא תַּעַבְרוּן קַל שׁוֹפָר חֵירוּתָא בְּכָל אַרְעֲכוֹן", "pj_en": "And thou shalt make the voice of the trumpet to sound a jubilee in the seventh month, on the tenth day of the month, on the Day of the Expiations thou shalt make the voice of the trumpet of Liberty to pass through all your land.", "tj": "", "tj_en": "", "rashi": "<b>והעברת.<\/b> לְשׁוֹן \"וַיַּעֲבִירוּ קוֹל בַּמַּחֲנֶה\" (שמות ל\"ו), לְשׁוֹן הַכְרָזָה (ראש השנה ל\"ד):<br><br><b>ביום הכפרים.<\/b> מִמַּשְׁמָע שֶׁנֶּאֱמַר בְּיוֹם הַכִּפּוּרִים, אֵינִי יוֹדֵעַ שֶׁהוּא בֶּעָשׂוֹר לַחֹדֶשׁ? אִם כֵּן לָמָּה נֶאֱמַר <b>בעשור לחדש<\/b>? אֶלָּא לוֹמַר לְךָ, תְּקִיעַה בֶּעָשׂוֹר לַחֹדֶשׁ דּוֹחָה שַׁבָּת בְּכָל אַרְצְכֶם, וְאֵין תְּקִיעַת רֹאשׁ הַשָּׁנָה דּוֹחָה שַׁבָּת בְּכָל אַרְצְכֶם אֶלָּא בְּבֵית דִּין בִּלְבָד (ספרא):", "rashi_en": "והעברת has the same meaning as the verb in (Exodus 36:6) “and they caused it to be proclaimed (ויעבירו קול) in the camp” — it is a term for proclamation (i. e. והעברת has not the literal meaning of causing a cornet to pass, i. e. to carry it about in the land as a symbol of freedom) (Rosh Hashanah 34a).<br><br>ביום הכפורים [ON THE TENTH DAY OF THE SEVENTH MONTH] ON THE DAY OF EXPIATION [SHALL YE CAUSE THE CORNET TO SOUND] — Since Scripture states “on the day of expiation” do I not know that it is “on the tenth day of the seventh month”? Why, then, does Scripture add “on the tenth day of the month”? But it adds these words in order to tell you: the blowing Of the שופר on the tenth day of the month sets aside the Sabbath (supersedes the Sabbath Law) throughout all your land (בכל ארצכם); whilst the blowing of the Shofar on the New Year, the first day of that month, does not supersede the Sabbath Law “throughout all your land”, but only at the law-court (בי\"ד) alone (Sifra, Behar, Section 1 5; Rosh Hashanah 29b)."}, {"ch": 25, "v": 10, "aliyah": 1, "heb": "וְקִדַּשְׁתֶּ֗ם אֵ֣ת שְׁנַ֤ת הַחֲמִשִּׁים֙ שָׁנָ֔ה וּקְרָאתֶ֥ם דְּר֛וֹר בָּאָ֖רֶץ לְכׇל־יֹשְׁבֶ֑יהָ יוֹבֵ֥ל הִוא֙ תִּהְיֶ֣ה לָכֶ֔ם וְשַׁבְתֶּ֗ם אִ֚ישׁ אֶל־אֲחֻזָּת֔וֹ וְאִ֥ישׁ אֶל־מִשְׁפַּחְתּ֖וֹ תָּשֻֽׁבוּ׃", "onk": "וּתְקַדְּשׁוּן יָת שְׁנַת חַמְשִׁין שְׁנִין וְתַקְרוּן חֵרוּתָא בְּאַרְעָא לְכָל יָתְבָהָא יוֹבֵלָא הִיא תְּהֵי לְכוֹן וּתְתוּבוּן גְּבַר לְאַחֲסַנְתֵּיהּ וּגְבַר לְזַרְעִיתֵיהּ תְּתוּבוּן:", "onk_en": "You shall sanctify the year of the fiftieth year and proclaim freedom in the land for all of its inhabitants; it shall be for you a jubilee and each man shall return to his ancestral land and each man shall return to his family.", "pj": "וּתְקַדְשׁוּן יַת שְׁנַת חַמְשִׁין שְׁנִין וְתִכְרְזוּן חֵירוּתָא בְּאַרְעָא דְיִשְרָאֵל לְכָל יַתְבָהָא יוּבְלָא הִיא תְהֵי לְכוֹן גְבַר לְאַחְסָנוּתֵיהּ וּגְבַר לְיִיחוּסֵיהּ תְּתוּבוּן", "pj_en": "And you shall sanctify that year, the fiftieth year, and proclaim liberty in the land of Israel to all the inhabitants; Jubela shall it be to you, and you shall return every man to his inheritance, and every man unto his family, you shall return.", "tj": "", "tj_en": "", "rashi": "<b>וקדשתם.<\/b> בִּכְנִיסָתָהּ מְקַדְּשִׁין אוֹתָהּ בְּבֵית דִּין, וְאוֹמְרִים מְקֻדֶּשֶׁת הַשָּׁנָה (ראש השנה כ\"ד):<br><br><b>וקראתם דרור.<\/b> לָעֲבָדִים, בֵּין נִרְצַע בֵּין שֶׁלֹּא כָלוּ לוֹ שֵׁשׁ שָׁנִים מִשֶּׁנִּמְכַּר: אָמַר רַבִּי יְהוּדָה מַהוּ לְשׁוֹן דְּרוֹר? כִּמְדַיַּר בֵּי דַיְרָא וְכוּ' — שֶׁדָּר בְּכָל מָקוֹם שֶׁהוּא רוֹצֶה וְאֵינוֹ בִרְשׁוּת אֲחֵרִים (ספרא; ראש השנה ט'):<br><br><b>יובל הוא.<\/b> שָׁנָה זֹאת מֻבְדֶּלֶת מִשְּׁאָר שָׁנִים בִּנְקִיבַת שֵׁם לָהּ לְבַדָּהּ, וּמַה שְּׁמָהּ? יוֹבֵל שְׁמָהּ, עַל שֵׁם תְּקִיעַת שׁוֹפָר:<br><br><b>ושבתם איש אל אחזתו.<\/b> שֶׁהַשָּׂדוֹת חוֹזְרוֹת לְבַעְלֵיהֶן:<br><br><b>ואיש אל משפחתו תשבו.<\/b> לְרַבּוֹת אֶת הַנִּרְצָע (קידושין ט\"ו):", "rashi_en": "וקדשתם AND YE SHALL SANCTIFY [THE FIFTIETH YEAR] — when it begins they declare it holy in the court by saying: “The year is holy!” (Sifra, Behar, Chapter 2 1; Rosh Hashanah 8b and Rosh Hashanah 24a).<br><br>וקראתם דרור AND YE SHALL PROCLAIM LIBERTY unto slaves, both to him whose ear has been pierced (and whose period of servitude has thus been prolonged until the Jubilee; cf. Exodus 21:6) and to him whose six years of servitude (the period prescribed for an ordinary Hebrew servant; Exodus 21:6 Exodus 21:2), reckoning from the time when he was sold, have not yet ended. R. Jehuda said, “What is the etymology of the term דרור, freedom? A free man is like a person who may dwell (דור) at an inn — meaning that he may reside in any place he pleases, and is not under the control of others. (דרור therefore implies liberty of residence) (Rosh Hashanah 9b).<br><br>יובל הוא IT SHALL BE A JUBILEE [UNTO YOU] — This year shall be distinguished from all other years by it alone being given a special name for itself. And what is its name? “Jobel” is its name — with reference to the “sounding of the Shofar” (the ram’s horn which is called יובל; cf. Exodus 19:13).<br><br>ושבתם איש אל אחזתו AND YE SHALL RETURN EVERY MAN UNTO HIS POSSESSION — This means that the fields return to their owners. (Not that each man actually goes back to his land — just as it goes on to state that the slave actually returns to his family).<br><br>ואיש אל משפחתו תשבו AND YE SHALL RETURN EVERY MAN UNTO HIS FAMILY — This verse is intended to include in the law of setting the slaves free also the slave whose ear has  been pierced (cf. Sifra, Behar, Chapter 2 5; Kiddushin 15a)."}, {"ch": 25, "v": 11, "aliyah": 1, "heb": "יוֹבֵ֣ל הִ֗וא שְׁנַ֛ת הַחֲמִשִּׁ֥ים שָׁנָ֖ה תִּהְיֶ֣ה לָכֶ֑ם לֹ֣א תִזְרָ֔עוּ וְלֹ֤א תִקְצְרוּ֙ אֶת־סְפִיחֶ֔יהָ וְלֹ֥א תִבְצְר֖וּ אֶת־נְזִרֶֽיהָ׃", "onk": "יוֹבֵלָא הִיא שְׁנַת חַמְשִׁין שְׁנִין תְּהֵי לְכוֹן לָא תִזְרְעוּן וְלָא תַחְצְדוּן יָת כַּתָּהָא וְלָא תִקְטְפוּן יָת שִׁבְקָהָא:", "onk_en": "It is a jubilee, [that] the year of the fiftieth year shall be for you. You shall not plant and you shall not reap [even] crops that grew on their own; and you shall not gather the [grapes of] its untended vineyard,", "pj": "יוּבְלָא הִיא שְׁנַת חַמְשִׁין שְׁנִין תְּהֵי לְכוֹן לָא תִזְרְעוּן וְלָא תְחַצְדוּן בַּאֲוָותָהָא וְלָא תְקַטְפוּן יַת עִנְבֵי שְׁמִיטָהָא", "pj_en": "The year of Jubela shall that fiftieth be to you: ye shall not sow, nor reap the after crop, nor make vintages of the grapes which have been let alone.", "tj": "", "tj_en": "", "rashi": "<b>יובל הוא שנת החמשים שנה.<\/b> מַה תַּ\"לֹ? לְפִי שֶׁנֶּאֱמַר וְקִדַּשְׁתֶּם וְגוֹ' כִּדְאִיתָא בְּרֹאשׁ הַשָּׁנָה (דף ח') וּבְתֹ\"כֹּ:<br><br><b>את נזריה.<\/b> אֶת הָעֲנָבִים הַמְשֻׁמָּרִים, אֲבָל בּוֹצֵר אַתָּה מִן הַמֻּפְקָרִים; כְּשֵׁם שֶׁנֶּאֱמַר בַּשְּׁבִיעִית כָּךְ נֶאֱמַר בַּיּוֹבֵל, נִמְצְאוּ שְׁתֵּי שָׁנִים קְדוֹשׁוֹת סְמוּכוֹת זוֹ לָזוֹ — שְׁנַת מ\"ט שְׁמִטָּה, וּשְׁנַת הַחֲמִשִּׁים יוֹבֵל:", "rashi_en": "יובל הוא שנת החמשים שנה IT IS A JUBILEE; THE FIFTIETH YEAR [SHALL BE UNTO YOU A PERIOD etc.] — Why is this statement made at all? Is it not identical with that made in v. 10? But because it is stated (v. 10) “and ye shall sanctify [the fiftieth year]” which implies that the year has to be sanctified at the beginning although the law of setting the slaves free applies only as from Yom Kippur, and consequently one might think that the holy character of the year is to be extended till the tenth of Tishri of the next year. Scripture therefore states here “a Jubilee is the fiftieth year” — but not any part of the fifty-first — just as is explained in Rosh Hashanah 8b and in Torat Cohanim (Sifra, Behar, Chapter 3 1).<br><br>את נזריה [YE SHALL NOT GATHER  THE GRAPES] THAT ARE נזירים — i. e. the grapes which have been kept by you (cf. Rashi on v. 6: לכם לאכלה‎ שבת הארץ), but you may gather from those that had been declared free to all (cf. Rashi on v. 5: ‎‎לא תבצר). Just as this is stated with reference to the Sabbatical year so, too, is it stated with regard to the Jubilee (Sifra, Behar, Chapter 3 2). Thus there are two holy years one after the other: the forty-ninth year שמיטה, and the fiftieth,יובל‎‎."}, {"ch": 25, "v": 12, "aliyah": 1, "heb": "כִּ֚י יוֹבֵ֣ל הִ֔וא קֹ֖דֶשׁ תִּהְיֶ֣ה לָכֶ֑ם מִ֨ן־הַשָּׂדֶ֔ה תֹּאכְל֖וּ אֶת־תְּבוּאָתָֽהּ׃", "onk": "אֲרֵי יוֹבֵלָא הִיא קוּדְשָׁא תְהֵי לְכוֹן מִן חַקְלָא תֵּיכְלוּן יָת עֲלַלְתַּהּ:", "onk_en": "For it is a jubilee, it shall be holy to you. Whatever is in the field, you may eat of its produce.", "pj": "אֲרוּם יוּבְלָא הִיא קוּדְשָׁא תְּהֵי לְכוֹן מִן חַקְלָא תֵּיכְלוּן יַת עֲלַלְתָּהּ", "pj_en": "For that Jubela shall be sacred to you, the produce of the field shall you eat.", "tj": "", "tj_en": "", "rashi": "<b>קדש תהיה לכם.<\/b> תּוֹפֶסֶת דָּמֶיהָ כְּהֶקְדֵּשׁ, יָכוֹל תֵּצֵא הִיא לְחֻלִּין, תַּ\"לֹ <b>תהיה<\/b> — בַּהֲוָיָתָהּ תְּהֵא (ספרא; סוכה מ'):<br><br><b>מן השדה תאכלו.<\/b> עַ\"יְ הַשָּׂדֶה אַתָּה אוֹכֵל מִן הַבַּיִת, שֶׁאִם כָּלָה לַחַיָּה מִן הַשָּׂדֶה, אַתָּה צָרִיךְ לְבַעֵר מִן הַבַּיִת; כְּשֵׁם שֶׁנֶּאֱמַר בַּשְּׁבִיעִית כָּךְ נֶאֱמַר בַּיּוֹבֵל (ספרא):", "rashi_en": "‎ קדש תהיה לכם IT SHALL BE HOLY UNTO YOU — The sacred character of the produce of that year attaches itself to its equivalent (i. e. to the articles given in exchange for it), just as is the case with Temple property (הקדש). One might think that after having been exchanged it (the fruit) leaves (loses) its sacred character and becomes חולין (ordinary produce), as is the case with many “holy” objects when they have thus been exchanged! Scripture, however, states תהיה “[holy] shall it be”, it shall always be in its original (holy) status (Sifra, Behar, Chapter 3 3; cf. Sukkah 40b).<br><br>מן השדה תאכלו את תבואתה YE SHALL EAT THE INCREASE THEREOF מן השדה — only by virtue of what is to be found in the field mayest thou eat of what is stored in the house; because if it (a particular fruit) has disappeared for food for the wild beasts in the field, you must clear it out of the house. Just as this is stated in reference to the produce of the Sabbatical year so is it slated also in reference to that of the Jubilee (Sifra, Behar, Chapter 3 4)."}, {"ch": 25, "v": 13, "aliyah": 1, "heb": "בִּשְׁנַ֥ת הַיּוֹבֵ֖ל הַזֹּ֑את תָּשֻׁ֕בוּ אִ֖ישׁ אֶל־אֲחֻזָּתֽוֹ׃", "onk": "בְּשַׁתָּא דְיוֹבֵלָא הָדָא תְּתוּבוּן גְּבַר לְאַחֲסַנְתֵּיהּ:", "onk_en": "On this jubilee year, each man shall return to his ancestral land.", "pj": "בְּשַׁתָּא דְיוּבְלָא הֲדָא תְּתוּבוּן גְבַר לְאַחְסַנְתֵּיהּ", "pj_en": "In this year of Jubela you shall return every man unto his inheritance.", "tj": "", "tj_en": "", "rashi": "<b>תשבו איש אל אחזתו.<\/b> וַהֲרֵי כְבָר נֶאֱמַר וְשַׁבְתֶּם אִישׁ אֶל אֲחֻזָּתוֹ? אֶלָּא לְרַבּוֹת הַמּוֹכֵר שָׂדֵהוּ וְעָמַד בְּנוֹ וּגְאָלָהּ שֶׁחוֹזֶרֶת לְאָבִיו בַּיּוֹבֵל (שם):", "rashi_en": "תשבו איש אל אחזתו YE SHALL RETURN EVERY MAN UNTO HIS POSSESSION — But has it not already been stated: (v. 10) “and ye shall return every man unto his possession”? But this is repeated in order to include in this law also the case of one who sold his field and his son came forward and redeemed it, — that it also is to be returned to the father in the Jubilee (Sifra, Behar, Chapter 3 6)."}, {"ch": 25, "v": 14, "aliyah": 2, "heb": "וְכִֽי־תִמְכְּר֤וּ מִמְכָּר֙ לַעֲמִיתֶ֔ךָ א֥וֹ קָנֹ֖ה מִיַּ֣ד עֲמִיתֶ֑ךָ אַל־תּוֹנ֖וּ אִ֥ישׁ אֶת־אָחִֽיו׃", "onk": "וַאֲרֵי תְזַבֵּן זְבִינִין לְחַבְרָךְ אוֹ תִזְבֵּן מִידָא דְחַבְרָךְ לָא תוֹנוּן גְּבַר יָת אֲחוֹהִי:", "onk_en": "If you sell anything to your neighbor, or purchase [something] from your neighbor, do not cheat one another.", "pj": "וַאֲרוּם תְּזַבְּנוּן זְבִינֵי לְחַבְרֵיכוֹן אוֹ תִזְבְּנוּן עִסְקָא דְמִיטַלְטְלָא מִן יַד חַבְרֵיכוֹן לֵית אַתּוּן רְשָׁאִין לְאוֹנַיָא גְבַר יַת חַבְרֵיהּ", "pj_en": "And when you sell sales to your neighbours, or you buy disposable (or moveable) goods from the hand of your neighbours, it is not allowable for a man to defraud his neighbour.", "tj": "", "tj_en": "", "rashi": "<b>וכי תמכרו וגו'.<\/b> לְפִי פְשׁוּטוֹ כְמַשְׁמָעוֹ; וְעוֹד יֵשׁ דְּרָשָׁה: מִנַּיִן כְּשֶׁאַתָּה מוֹכֵר, מְכֹר לְיִשְׂרָאֵל חֲבֵרְךָ? תַּ\"לֹ וְכִי תִמְכְּרוּ מִמְכָּר — לַעֲמִיתְךָ מְכֹר, וּמִנַּיִן שֶׁאִם בָּאתָ לִקְנוֹת קְנֵה מִיִּשְׂרָאֵל חֲבֵרְךָ? תַּ\"לֹ אוֹ קָנֹה — מִיַּד עֲמִיתֶךָ (ספרא):<br><br><b>אל תונו.<\/b> זוֹ אוֹנָאַת מָמוֹן (בבא מציעא נ\"ח):", "rashi_en": "‎'וכי תמכרו וגו‎‎‎‎ AND IF THOU SELL [OUGHT TO THY FELLOW… YE SHALL NOT OVERREACH ONE ANOTHER] — According to its plain sense the verse intimates what it literally means: (i. e. as translated above). But there is also a Midrashic interpretation: Whence can it be derived that if you sell anything you should sell it to your Israelite fellowman? From what Scripture states: “And if you sell  — ,לעמיתך sell  it  to one associated with you by nationality”. And whence can it be derived that if you intend to buy anything that you should buy it of your Israelite fellow? From what Scripture states “or if thou buy ought — מיד עמיתך, at the hand of one associated with thee, buy it” (Sifra, Behar, Section 3 1). <br><br>אל תונו YE SHALL NOT WRONG [ONE ANOTHER] — This refers to wronging in money matters (Sifra, Behar, Section 3 4)."}, {"ch": 25, "v": 15, "aliyah": 2, "heb": "בְּמִסְפַּ֤ר שָׁנִים֙ אַחַ֣ר הַיּוֹבֵ֔ל תִּקְנֶ֖ה מֵאֵ֣ת עֲמִיתֶ֑ךָ בְּמִסְפַּ֥ר שְׁנֵֽי־תְבוּאֹ֖ת יִמְכׇּר־לָֽךְ׃", "onk": "בְּמִנְיַן שְׁנַיָּא בָּתַר יוֹבֵלָא תִּזְבֵּן מִן חַבְרָךְ בְּמִנְיַן שְׁנֵי עֲלַלְתָּא יְזַבֶּן לָךְ:", "onk_en": "According to the number of years after the jubilee you shall purchase [land] from your neighbor; according to the number of produce years he shall sell it to you.", "pj": "עַמִי בְּנֵי יִשְרָאֵל אִין אַתּוּן זַבְנִין חֲקִיל אוֹ כַרְמָא בְּמִנְיַן סְכוֹם שְׁנַייָא בָּתַר יוּבְלָא תִּזְבְּנוּן מִן חַבְרֵיכוֹן כְּמִנְיַין שְׁנַיָיא דִכְנִישׁוּת עֲלַלְתָּא יְזַבְּנוּן לְכוֹן", "pj_en": "Sons of Israel, My people, if you sell a field or a vineyard, according to the sum of the number of years after the Jubela you shall buy of your neighbour; according to the number of years for gathering the produce they shall sell it to you;", "tj": "", "tj_en": "", "rashi": "<b>במספר שנים אחר היובל תקנה.<\/b> זֶהוּ פְשׁוּטוֹ לְיַשֵּׁב הַמִּקְרָא עַל אָפְנָיו: עַל הָאוֹנָאָה בָּא לְהַזְהִיר, כְּשֶׁתִּמְכֹּר אוֹ תִקְנֶה קַרְקַע, דְּעוּ כַּמָּה שָׁנִים יֵשׁ עַד הַיּוֹבֵל, וּלְפִי הַשָּׁנִים וּתְבוּאוֹת הַשָּׂדֶה שֶׁהִיא רְאוּיָה לַעֲשׂוֹת יִמְכֹּר הַמּוֹכֵר וְיִקְנֶה הַקּוֹנֶה, שֶׁהֲרֵי סוֹפוֹ לְהַחֲזִירָהּ לוֹ בִּשְׁנַת הַיּוֹבֵל, אִם יֵשׁ שָׁנִים מֻעָטוֹת וְזֶה מוֹכְרָהּ בְּדָמִים יְקָרִים, הֲרֵי נִתְאַנָּה לוֹקֵחַ, וְאִם יֵשׁ שָׁנִים מְרֻבּוֹת וְאָכַל מִמֶּנָּה תְּבוּאוֹת הַרְבֵּה, הֲרֵי נִתְאַנָּה מוֹכֵר, לְפִיכָךְ צָרִיךְ לִקְנוֹתָהּ לְפִי הַזְּמַן, וְזֶהוּ שֶׁנֶּאֱמַר בְּמִסְפַּר שְׁנֵי תְבוּאֹת יִמְכָּר לָךְ — לְפִי מִנְיַן שְׁנֵי הַתְּבוּאוֹת שֶׁתְּהֵא עוֹמֶדֶת בְּיַד הַלּוֹקֵחַ תִּמְכֹּר לוֹ. וְרַבּוֹתֵינוּ דָרְשׁוּ מִכָּאן שֶׁהַמּוֹכֵר שָׂדֵהוּ אֵינוֹ רַשַּׁאי לִגְאֹל פָּחוֹת מִשְׁתֵּי שָׁנִים — שֶׁתַּעֲמֹד שְׁתֵּי שָׁנִים בְּיַד הַלּוֹקֵחַ מִיּוֹם לְיוֹם, וַאֲפִלּוּ יֵשׁ שָׁלוֹשׁ תְּבוּאוֹת בְּאוֹתָן שְׁתֵּי שָׁנִים, כְּגוֹן שֶׁמְּכָרָהּ לוֹ בְּקָמוֹתֶיהָ; וּשְׁנֵי אֵינוֹ יוֹצֵא מִפְּשׁוּטוֹ — כְּלוֹמַר מִסְפַּר שָׁנִים שֶׁל תְּבוּאוֹת וְלֹא שֶׁל שִׁדָּפוֹן, וּמִעוּט שָׁנִים שְׁנַיִם (ספרא; ערכין כ\"ט):", "rashi_en": "במספר שנים אחר היובל תקנה ACCORDING TO THE NUMBER OF YEARS AFTER THE JUBILEE THOU SHALT BUY [OF THY COMPANION] — This (the following) is the literal sense fitting in the clauses of the verse as required by the context: Scripture intends here to warn against wronging prohibited in the preceding verse: When you sell or buy landed property take into account how many years there are  until the Jubilee, and according to the years and the crops of the field which it can be expected to yield shall the vendor sell and the purchaser buy, for in the end he (the purchaser) will have to return it to him (to the vendor) in the Jubilee-year. Consequently if there are only a few years until the Jubilee and this man sells it at a high price it follows that the purchaser has been overreached. If, on the other hand, there are still many years until the Jubilee so that he eats from it many crops the seller is overreached if you give him only a low price. It must therefore be purchased according to the period remaining until the Jubilee. That is what Scripture means when it states: “According to the number of the years of the fruits he shall sell unto  ,\"thee,\" i. e. according to the number of years of crops that it (the field) will remain in the hand of the purchaser you shall sell it to him. Our Rabbis, however, derived from here the law that one who sells his field has no right to repurchase it before the elapse of at least two years, — that it must remain in the possession of the purchaser two full years reckoning from date to date, and even though there may be three crops in these two years, as, for instance, if he sold it when it had its corn standing. And in this interpretation the word שני does not lose its literal meaning, viz., that of years, (the words שני תבואות are not taken in this interpretation to mean “two crops” as you might at first think) — the phrase means מספר שנים של תבואות the number of years of crops (i. e. שני is the construct of שנים) and not of years when the corn is smitten by blast, and you know that the minimum number implied in the plural שנים is two (this is how the Rabbis derived the law that the vendor must leave the field at least two years in possession of the purchaser) (Arakhin 29b)."}, {"ch": 25, "v": 16, "aliyah": 2, "heb": "לְפִ֣י&thinsp;<b>׀<\/b> רֹ֣ב הַשָּׁנִ֗ים תַּרְבֶּה֙ מִקְנָת֔וֹ וּלְפִי֙ מְעֹ֣ט הַשָּׁנִ֔ים תַּמְעִ֖יט מִקְנָת֑וֹ כִּ֚י מִסְפַּ֣ר תְּבוּאֹ֔ת ה֥וּא מֹכֵ֖ר לָֽךְ׃", "onk": "לְפוּם סְגִיאוּת שְׁנַיָּא תַּסְגֵּי זְבִינוֹהִי וּלְפוּם זְעֵרוּת שְׁנַיָּא תַּזְעֵר זְבִינוֹהִי אֲרֵי מִנְיַן עֲלַלְתָּא הוּא מְזַבֵּן לָךְ:", "onk_en": "Based on the abundance of years, you shall increase its purchase price and based on the lack of years you shall decrease its purchase price, since it is the number of produce-seasons that he is selling to you.", "pj": "לְפוּם סְכוֹם סוֹגֵי שְׁנַיָיא תַּסְגֵי זַבִּינוֹי וּלְפוּם סְכוֹם זְעֵירוּת שְׁנַיָיא תַּזְעִיר זַבִּינוֹי אֲרוּם מִנְיַן כְּנִישַׁת עֲלַלְתָּא הוּא מְזַבֵּן לָךְ", "pj_en": "according to the greatness of the amount of the years shall the price be enlarged; and according to the smallness of the amount of the years the price shall be diminished, because he sells to thee the amount of the fruitage to be ingathered.", "tj": "", "tj_en": "", "rashi": "<b>תרבה מקנתו.<\/b> תִּמְכְּרֶנָּה בְיֹקֶר:<br><br><b>תמעיט מקנתו.<\/b> תַּמְעִיט בְּדָמֶיהָ:", "rashi_en": "תרבה מקנתו THOU SHALT INCREASE THE PRICE THEREOF — i. e. you may sell it at a high price <br><br>תמעיט מקנתו — You shall offer a lower price."}, {"ch": 25, "v": 17, "aliyah": 2, "heb": "וְלֹ֤א תוֹנוּ֙ אִ֣ישׁ אֶת־עֲמִית֔וֹ וְיָרֵ֖אתָ מֵֽאֱלֹהֶ֑יךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "וְלָא תוֹנוּן גְּבַר יָת חַבְרֵיהּ וְתִדְחַל מֵאֱלָהָךְ אֲרֵי אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "You shall not cheat one another, and you shall fear your God for I am Adonoy, your God.", "pj": "וְלָא תוֹנוּן גְבַר יַת חַבְרֵיהּ בְּמִילִין קָשִׁין וְתִדְחַל מֵאֱלָהָךְ אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "And you shall not overreach one man his neighbour by hard words, but fear your God: I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>ולא תונו איש את עמיתו.<\/b> כָּאן הִזְהִיר עַל אוֹנָאַת דְּבָרִים, שֶׁלֹּא יַקְנִיט אֶת חֲבֵרוֹ וְלֹא יַשִּׂיאֶנּוּ עֵצָה שֶׁאֵינָהּ הוֹגֶנֶת לוֹ, לְפִי דַּרְכּוֹ וַהֲנָאָתוֹ שֶׁל יוֹעֵץ, וְאִ\"תֹּ מִי יוֹדֵעַ אִם נִתְכַּוַּנְתִּי לְרָעָה? לְכָךְ נֶאֱמַר וְיָרֵאתָ מֵּאֱלֹהֶיךָ — הַיּוֹדֵעַ מַחֲשָׁבוֹת הוּא יוֹדֵעַ. כָּל דָּבָר הַמָּסוּר לַלֵּב, שֶׁאֵין מַכִּיר אֶלָּא מִי שֶׁהַמַּחֲשָׁבָה בְלִבּוֹ, נֶאֱמַר בּוֹ וְיָרֵאתָ מֵּאֱלֹהֶיךָ (ספרא; בבא מציעא נ\"ח):", "rashi_en": "ולא תונו איש את עמיתו YE SHALL NOT THEREFORE BE EXTORTIONATE TO ONE ANOTHER — Here Scripture warns against vexing by words (wounding a person’s feelings) — that one should  not annoy his fellow-man, nor give him an advice which is unfitted for him, but is in accordance with the plan and the advantage of the adviser. But lest you should say, “Who knows whether I had any intention to do him evil?” Scripture therefore states: “but thou shalt fear thy God”! — He Who knows men’s thoughts, He knows it! In all cases where it is a matter of conscience (more lit., a matter handed over to the heart), when no one knows the truth except the one who has the thought in his heart, Scripture always states: “but be afraid of thy God”! (Sifra, Behar, Chapter 4 1-2; Bava Metzia 58b; cf. also Rashi on Leviticus 19:14.)"}, {"ch": 25, "v": 18, "aliyah": 2, "heb": "וַעֲשִׂיתֶם֙ אֶת־חֻקֹּתַ֔י וְאֶת־מִשְׁפָּטַ֥י תִּשְׁמְר֖וּ וַעֲשִׂיתֶ֣ם אֹתָ֑ם וִֽישַׁבְתֶּ֥ם עַל־הָאָ֖רֶץ לָבֶֽטַח׃", "onk": "וְתַעְבְּדוּן יָת קְיָמַי וְיָת דִּינַי תִּטְּרוּן וְתַעְבְּדוּן יָתְהוֹן וְתֵיתְבוּן עַל אַרְעָא לְרָחְצָן:", "onk_en": "You shall fulfill My statutes and keep My laws and fulfill them, and you will then live in the land in security.", "pj": "וְתַעַבְדוּן יַת קְיָמַי וְיַת סִדְרֵי דִינַי תִטְרוּן וְתַעְבְדוּן יַתְהוֹן וְתֵיתְבוּן עַל אַרְעָא לְרוֹחֲצָן", "pj_en": "And you shall perform My statutes, and observe the order of My judgments and do them, that you may dwell upon the land securely.", "tj": "", "tj_en": "", "rashi": "<b>וישבתם על הארץ לבטח.<\/b> שֶׁבַּעֲוֹן שְׁמִטָּה יִשְׂרָאֵל גּוֹלִים, שֶׁנֶּאֱמַר \"אָז תִּרְצֶה הָאָרֶץ אֶת שַׁבְּתֹתֶיהָ, וְהִרְצָת אֶת שַׁבְּתֹתֶיהָ\" (ויקרא כ\"ו), וְשִׁבְעִים שָׁנָה שֶׁל גָּלוּת בָּבֶל כְּנֶגֶד שִׁבְעִים שְׁמִטּוֹת שֶׁבִּטְּלוּ הָיוּ:", "rashi_en": "וישבתם על הארץ לבטח [WHEREFORE YE SHALL DO MY ORDINANCES] AND YE SHALL ABIDE IN THE LAND IN SAFETY — It states this because as a punishment for the sin of neglecting the laws of ”Shemittah” Israel becomes exiled, as it is said (Leviticus 26:33, 34) “(And I will disperse you among the nations…] Then shall the land makeup  for the Sabbatical years… even then make up for her Sabbatical years that she has not observed” (Shabbat 33a). The seventy years of the Babylonian exile were indeed a punishment corresponding to the seventy Sabbatical years which they had neglected (cf. Rashi on Leviticus 26:35)."}, {"ch": 25, "v": 19, "aliyah": 3, "heb": "וְנָתְנָ֤ה הָאָ֙רֶץ֙ פִּרְיָ֔הּ וַאֲכַלְתֶּ֖ם לָשֹׂ֑בַע וִֽישַׁבְתֶּ֥ם לָבֶ֖טַח עָלֶֽיהָ׃", "onk": "וְתִתֵּן אַרְעָא אִבַּהּ וְתֵיכְלוּן לְמִשְׂבָּע וְתֵיתְבוּן לְרָחֲצָן עֲלַהּ:", "onk_en": "The land will give forth its fruit and you will eat your fill, and you will live securely on it.", "pj": "וְתִתֵּן אַרְעָא אִיבָּהּ וְתֵיכְלוּן וְתִשְבְּעוּן וְתֵיתְבוּן עַל אַרְעָא לְרוֹחֲצָן", "pj_en": "And the land will yield her produce, and you shall eat and be satisfied, and dwell upon the land in security.", "tj": "", "tj_en": "", "rashi": "<b>ונתנה הארץ וגו', וישבתם לבטח עליה.<\/b> שֶׁלֹּא תִדְאֲגוּ מִשְּׁנַת בַּצֹּרֶת:<br><br><b>ואכלתם לשבע.<\/b> אַף בְּתוֹךְ הַמֵּעַיִם תְּהֵא בוֹ בְּרָכָה (עי' ספרא):", "rashi_en": "ונתנה הארץ וגו' וישבתם לבטח עליה AND THE LAND SHALL YIELD [HER PRODUCE AND YE SHALL EAT YOUR FILL], AND ABIDE THEREIN IN SAFETY — The latter words imply that ye shall not have to worry about years (lit., a year) of drought.<br><br>ואכלתם לשבע AND YE SHALL EAT YOUR FILL — [even if you eat only a little — cf. Rashi on Leviticus 26:5] it will be blessed in your stomach."}, {"ch": 25, "v": 20, "aliyah": 3, "heb": "וְכִ֣י תֹאמְר֔וּ מַה־נֹּאכַ֖ל בַּשָּׁנָ֣ה הַשְּׁבִיעִ֑ת הֵ֚ן לֹ֣א נִזְרָ֔ע וְלֹ֥א נֶאֱסֹ֖ף אֶת־תְּבוּאָתֵֽנוּ׃", "onk": "וַאֲרֵי תֵימְרוּן מָא נֵיכוּל בְּשַׁתָּא שְׁבִיעֵתָא הָא לָא נִזְרָע וְלָא נִכְנוֹשׁ יָת עֲלַלְתָּנָא:", "onk_en": "If you shall say (ask) What will we eat in the seventh year, for lo! we have not planted nor gathered our produce?", "pj": "וַאֲרוּם אִין תֵּימְרוּן מַה נֵיכוֹל בְּשַׁתָּא שְׁבִיעָתָא הָא לָא נִזְרַע וְלָא נִכְנוֹשׁ יַת כַּתֵּי עֲלַלְתָּנָא", "pj_en": "But if you say, What shall we eat in the seventh year; behold, we sow not, nor ingather even the after crop of our provision?", "tj": "", "tj_en": "", "rashi": "<b>ולא נאסף.<\/b> אֶל הַבַּיִת:<br><br><b>את תבואתנו.<\/b> כְּגוֹן יַיִן וּפֵרוֹת הָאִילָן וּסְפִיחִין הַבָּאִים מֵאֵלֵיהֶם:", "rashi_en": "ולא נאסף [AND IF YE SHALL SAY,… BEHOLD WE SHALL NOT SOW] NOR GATHER IN — into the house. <br><br>את תבואתנו OUR INCREASE — as, e. g., the wine and the fruits of trees and the aftergrowth of the fields, which grow of their own accord (Pesachim 51b)."}, {"ch": 25, "v": 21, "aliyah": 3, "heb": "וְצִוִּ֤יתִי אֶת־בִּרְכָתִי֙ לָכֶ֔ם בַּשָּׁנָ֖ה הַשִּׁשִּׁ֑ית וְעָשָׂת֙ אֶת־הַתְּבוּאָ֔ה לִשְׁלֹ֖שׁ הַשָּׁנִֽים׃", "onk": "וֶאֱפַקֵּד יָת בִּרְכָתִי לְכוֹן בְּשַׁתָּא שְׁתִיתֵתָא וְתַעְבֵּד יָת עֲלַלְתָּא לִתְלַת שְׁנִין:", "onk_en": "I shall command (direct) My blessing to you in the sixth year and it will produce [enough] for three years.", "pj": "וְאַפְקֵיד יַת בִּרְכָתִי לְכוֹן מִן אוֹצְרֵי טָבִין דְבִשְׁמֵי שְׁכִינְתִּי בְּשַׁתָּא שְׁתִיתֵיתָא וְתַעֲבֵיד יַת עֲלַלְתָּא דְתִסְפּוֹק לִתְלַת שְׁנִין", "pj_en": "I will command My blessing upon you from my treasures of goodness, which are in the heaven of My Presence, in the sixth year, and it will create produce that will suffice for three years.", "tj": "", "tj_en": "", "rashi": "<b>לשלש השנים.<\/b> לִקְצָת הַשִּׁשִּׁית — מִנִּיסָן וְעַד רֹ\"הַ, וְלַשְּׁבִיעִית, וְלַשְּׁמִינִית, שֶׁיִּזְרְעוּ בַשְּׁמִינִית בְּמַרְחֶשְׁוָן וְיִקְצְרוּ בְנִיסָן:", "rashi_en": "לשלש השנים [IT SHALL BRING FORTH INCREASE] FOR THE THREE YEARS — i. e. for a part of the sixth year — from Nisan till the New Year of the seventh — for the whole seventh year and for part of the eighth year, for in the eighth year they will sow in Marcheshvan but will harvest only in Nisan (so that they will have to depend on the harvest of the sixth year in the eighth too)."}, {"ch": 25, "v": 22, "aliyah": 3, "heb": "וּזְרַעְתֶּ֗ם אֵ֚ת הַשָּׁנָ֣ה הַשְּׁמִינִ֔ת וַאֲכַלְתֶּ֖ם מִן־הַתְּבוּאָ֣ה יָשָׁ֑ן עַ֣ד&thinsp;<b>׀<\/b> הַשָּׁנָ֣ה הַתְּשִׁיעִ֗ת עַד־בּוֹא֙ תְּב֣וּאָתָ֔הּ תֹּאכְל֖וּ יָשָֽׁן׃", "onk": "וְתִזְרְעוּן יָת שַׁתָּא תְמִינֵתָא וְתֵיכְלוּן מִן עֲלַלְתָּא עַתִּיקָא עַד שַׁתָּא תְשִׁיעֵתָא עַד מֵעַל עֲלַלְתַּהּ תֵּיכְלוּן עַתִּיקָא:", "onk_en": "You shall plant in the eighth year but you will still be eating from the old produce until the ninth year; until the [new] produce arrives (ripens) you shall eat [from] the old.", "pj": "וְתִזְרְעוּן יַת שַׁתָּא תְּמִינָתָא וְתֵיכְלוּן מִן עֲלַלְתָּא עַתִּיקְתָּא דְהַהוּא שַׁתָּא שְׁתִיתֵיתָא עַד שַׁתָּא תְּשִׁיעָתָא עַד זְמַן מֵיעַל עֲלַלְתָּא תֵּיכְלוּן עַתִּיקְתָּא", "pj_en": "But you shall sow in the eighth year, and eat of the old produce of the sixth year until the ninth year; until the time of the incoming of the new produce, shall you eat of the old.", "tj": "", "tj_en": "", "rashi": "<b>עד השנה התשיעת.<\/b> עַד חַג הַסֻּכּוֹת שֶׁל תְּשִׁיעִית, שֶׁהוּא עֵת בֹּא תְּבוּאָתָהּ שֶׁל שְׁמִינִית לְתוֹךְ הַבַּיִת, שֶׁכָּל יְמוֹת הַקַּיִץ הָיוּ בַשָּׂדֶה בַּגְּרָנוֹת, וּבְתִשְׁרֵי הוּא עֵת הָאָסִיף לַבַּיִת; וּפְעָמִים שֶׁהָיְתָה צְרִיכָה לַעֲשׂוֹת לְאַרְבַּע שָׁנִים — בַּשִּׁשִּׁית שֶׁלִּפְנֵי הַשְּׁמִטָּה הַשְּׁבִיעִית, שֶׁהֵן בְּטֵלִין מֵעֲבוֹדַת קַרְקַע שְׁתֵּי שָׁנִים רְצוּפוֹת — הַשְּׁבִיעִית וְהַיּוֹבֵל, וּמִקְרָא זֶה נֶאֱמַר בִּשְׁאָר הַשְּׁמִטּוֹת כֻּלָּן:", "rashi_en": "עד השנה התשיעית UNTIL THE NINTH YEAR — i. e. until the Feast of Tabernacles of the ninth year which is the time when the crop of the eighth year comes ‎(בא תבואתה) into the house (the granaries). For during the whole summer-time (the fruits) remained in the  fields  inthe barns, and in Tishri was the time for gathering them into the house. Sometimes indeed it th)e soil) had to bring forth fruits for four years, viz., during the sixth year preceding the seventh “Shemittah” (i. e. in the forty-eighth year of the Jubilee-period) when they had to refrain from agricultural work two successive years, viz., the Sabbatical year and the Jubilee immediately following it. This verse, however, (which mentions only an increase sufficient for three years) is said (written) with reference to all other (i. e. ordinary) Sabbatical years."}, {"ch": 25, "v": 23, "aliyah": 3, "heb": "וְהָאָ֗רֶץ לֹ֤א תִמָּכֵר֙ לִצְמִתֻ֔ת כִּי־לִ֖י הָאָ֑רֶץ כִּֽי־גֵרִ֧ים וְתוֹשָׁבִ֛ים אַתֶּ֖ם עִמָּדִֽי׃", "onk": "וְאַרְעָא לָא תִזְדַּבַּן לַחֲלוּטִין אֲרֵי דִילִי אַרְעָא אֲרֵי דַיָּרִין וְתוֹתָבִין אַתּוּן קֳדָמַי:", "onk_en": "The land shall not be sold in perpetuity, for the land is Mine, for, you are [merely as] foreigners [<b>foreign resident<\/b>] and resident aliens [<b>residents<\/b>] before Me.", "pj": "וְאַרְעָא דְיִשְרָאֵל לָא תִזְדַבֵּן לַחֲלוּטִין אֲרוּם דִילִי אַרְעָא אֲרוּם דַיְירִין וְתוֹתְבוּן אַתּוּן עִמִי", "pj_en": "And the land of Israel shall not be sold absolutely, for the land is Mine; for you are sojourners and guests with Me.", "tj": "", "tj_en": "", "rashi": "<b>והארץ לא תמכר.<\/b> לִתֵּן לָאו עַל חֲזָרַת שָׂדוֹת לַבְּעָלִים בַּיּוֹבֵל, שֶׁלֹּא יְהֵא הַלּוֹקֵחַ כּוֹבְשָׁהּ:<br><br><b>לצמתת.<\/b> לִפְסִיקָה, לִמְכִירָה פְסוּקָה עוֹלָמִית:<br><br><b>כי לי הארץ.<\/b> אַל תֵּרַע עֵינְךָ בָהּ שֶׁאֵינָהּ שֶׁלְּךָ (ספרא):", "rashi_en": "‎‎לא תמכר‎‎ והארץ THE LAND SHALL NOT BE SOLD [ABSOLUTELY] — This is intended to charge with the transgression of a negative command (לאו) the neglect of returning the fields to their owners in the Jubilee — it commands that the purchaser must not detain it (Sifra, Behar, Chapter 5 8). <br><br>לצמתת means for severance; the meaning is: it shall not be sold as a sale that severs in perpetuity.<br><br>כי לי הארץ FOR THE LAND IS MINE — Your eye shall not be evil towards it (you shall not begrudge this) for it is not yours."}, {"ch": 25, "v": 24, "aliyah": 3, "heb": "וּבְכֹ֖ל אֶ֣רֶץ אֲחֻזַּתְכֶ֑ם גְּאֻלָּ֖ה תִּתְּנ֥וּ לָאָֽרֶץ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבְכֹל אַרְעָא אַחֲסַנְתְּכוֹן פֻּרְקָנָא תִּתְּנוּן לְאַרְעָא:", "onk_en": "In all of your ancestral lands you shall grant redemption to the land.", "pj": "וּבְכָל אַרַע אַחֲסַנְתְּכוֹן פּוּרְקָנָא תִּתְּנוּן לְאַרְעָא", "pj_en": "And in all the land of your possession you shall let the ground have redemption.", "tj": "", "tj_en": "", "rashi": "<b>ובכל ארץ אחזתכם.<\/b> לְרַבּוֹת בָּתִּים וְעֶבֶד עִבְרִי, וְדָבָר זֶה מְפֹרָשׁ בְּקִדּוּשִׁין בְּפֶרֶק רִאשׁוֹן (דף כ\"א). וּלְפִי פְשׁוּטוֹ סָמוּךְ לְפָרָשָׁה שֶׁלְּאַחֲרָיו, שֶׁהַמּוֹכֵר אֲחֻזָּתוֹ רַשָּׁאִי לְגָאֳלָהּ לְאַחַר שְׁתֵּי שָׁנִים, אוֹ הוּא אוֹ קְרוֹבוֹ, וְאֵין הַלּוֹקֵחַ יָכוֹל לְעַכֵּב:", "rashi_en": "ובכל ארץ אחזתכם AND IN ALL THE LAND OF YOUR POSSESSION [YOU SHALL GRANT A REDEMPTION FOR THE LAND] — (The translation may be: And as regards everything etc.) thus including in this law houses and Hebrew servants (i. e. that to these also the right of redemption must be granted). And this matter is explained in Treatise Kiddushin 21a in the first section (cf. also Sifra, Behar, Chapter 4 9). According to the literal sense, however, it is to be connected with the section immediately following: to point out that one who sells his landed property has the right of redeeming it after two years either by himself or his relative, and that the purchaser has no right to prevent it (גאולה תתנו לארץ, you must grant redemption)."}, {"ch": 25, "v": 25, "aliyah": 4, "heb": "כִּֽי־יָמ֣וּךְ אָחִ֔יךָ וּמָכַ֖ר מֵאֲחֻזָּת֑וֹ וּבָ֤א גֹֽאֲלוֹ֙ הַקָּרֹ֣ב אֵלָ֔יו וְגָאַ֕ל אֵ֖ת מִמְכַּ֥ר אָחִֽיו׃", "onk": "אֲרֵי יְתְמַסְכַּן אָחוּךְ וִיזַבֵּן מֵאַחֲסַנְתֵּהּ וְיֵיתֵי פָרִיקֵיהּ דְּקָרִיב לֵיהּ וְיִפְרוֹק יָת זְבִינֵי אֲחוּהִי:", "onk_en": "If your brother becomes impoverished and sells some of his ancestral land, and a close relative comes and redeems that which his brother sold.", "pj": "אֲרוּם אִין יִתְמַסְכֵּן אָחוּךְ וְיִזְבּוּן מֵאַחְסַנְתֵּיהּ וְיֵיתֵי פְּרִיקֵיהּ דִקְרֵיב לֵיהּ וְיִפְרוֹק יַת זְבִינֵי אָחוֹי", "pj_en": "And if thy brother hath become poor and hath sold his possession, his redeemer who is near of kin to him may come and redeem the sale of his brother.", "tj": "", "tj_en": "", "rashi": "<b>כי ימוך אחיך ומכר.<\/b> מְלַמֵּד שֶׁאֵין אָדָם רַשַּׁאי לִמְכֹּר שָׂדֵהוּ אֶלָּא מֵחֲמַת דֹּחַק עֹנִי (עי' ספרא):<br><br><b>מאחזתו.<\/b> וְלֹא כֻּלָּהּ, לִמֵּד דֶּרֶךְ אֶרֶץ, שֶׁיְּשַׁיֵּר שָׂדֶה לְעַצְמוֹ:<br><br><b>וגאל את ממכר אחיו.<\/b> וְאֵין הַלּוֹקֵחַ יָכוֹל לְעַכֵּב:", "rashi_en": "כי ימוך אחיך ומכר  AND IF THY BROTHER BE WAXEN POOR AND HAS SOLD AWAY [SOME OF HIS POSSESSION] — The introductory words teach us that one is not permitted to sell his real estate except under the pressure of poverty (cf. Sifra, Behar, Chapter 5 1).<br><br>מאחזתו SOME OF HIS POSSESSION — but not the entire property. Scripture thereby teaches you a practical rule that, however needy a man is, he should always leave some immovables (lit., a field) for himself (Sifra, Behar, Chapter 5 1).<br><br>וגאל את ממכר אחיו HE SHALL REDEEM THAT WHICH HIS BROTHER SOLD — and the purchaser has no right to prevent it."}, {"ch": 25, "v": 26, "aliyah": 4, "heb": "וְאִ֕ישׁ כִּ֛י לֹ֥א יִֽהְיֶה־לּ֖וֹ גֹּאֵ֑ל וְהִשִּׂ֣יגָה יָד֔וֹ וּמָצָ֖א כְּדֵ֥י גְאֻלָּתֽוֹ׃", "onk": "וּגְבַר אֲרֵי לָא יְהֵי לֵהּ פָּרִיק וְתַדְבֵּק יְדֵהּ וְיַשְׁכַּח כְּמִסַּת פֻּרְקָנֵהּ:", "onk_en": "[Or] if the man has no redeemer (close relative) but has acquired sufficient means and finds [it] enough to redeem it [himself],", "pj": "וּגְבַר אֲרוּם לָא יְהֵי לֵיהּ מַאן דְחָמֵי לְמִפְרוֹק זְבִינוֹהִי וּתְאַרַע יְדֵיהּ וְיִשְׁכַּח הֵי כְמֵיסַת פּוּרְקָנֵיהּ", "pj_en": "But if a man have no one who is qualified to redeem that which he hath sold, and it befall to his own hand to find the price of its redemption,", "tj": "", "tj_en": "", "rashi": "<b>ואיש כי לא יהיה לו גאל.<\/b> וְכִי יֵשׁ לְךָ אָדָם בְּיִשְֹרָאֵל שֶׁאֵין לוֹ גּוֹאֲלִים? אֶלָּא גּוֹאֵל שֶׁיּוּכַל לִגְאֹל מִמְכָּרוֹ (קידושין כ\"א):", "rashi_en": "ואיש כי לא יהיה לו גואל [AND] IF [A MAN] HAVE  NONE TO REDEEM  IT  — But does there exist anyone in Israel who has none to redeem his property (who has no relative at all)? But the meaning is: a relative who is able (possesses the means) to redeem that which he has sold (Sifra, Behar, Chapter 5 2; cf. Kiddushin 21a)."}, {"ch": 25, "v": 27, "aliyah": 4, "heb": "וְחִשַּׁב֙ אֶת־שְׁנֵ֣י מִמְכָּר֔וֹ וְהֵשִׁיב֙ אֶת־הָ֣עֹדֵ֔ף לָאִ֖ישׁ אֲשֶׁ֣ר מָֽכַר־ל֑וֹ וְשָׁ֖ב לַאֲחֻזָּתֽוֹ׃", "onk": "וִיחַשֵּׁב יָת שְׁנֵי זְבִינוֹהִי וְיָתֵב יָת מוֹתָרָא לִגְבַר דִּי זַבֶּן לֵיהּ וִיתוּב לְאַחֲסַנְתֵּהּ:", "onk_en": "He shall calculate the number of years for which he sold the land and return the remainder (excess) to the man to whom he had sold it, and he shall return to his ancestral land.", "pj": "וִידַיֵיק יַת סְכוֹם שְׁנֵי זְבִינוֹי וְיָתֵיב יַת מוֹתָרָא לִגְבַר דְזַבִּין לֵיהּ וְיֵתוּב לְאַחֲסַנְתֵּיהּ", "pj_en": "then let him count the sum of the years of its sale, and give the amount to the man who bought it, and return to his possession.", "tj": "", "tj_en": "", "rashi": "<b>וחשב את שני ממכרו.<\/b> \"כַּמָּה שָׁנִים הָיוּ עַד הַיּוֹבֵל? כָּךְ וְכָךְ, וּבְכַמָּה מְכַרְתִּיהָ לְךָ? בְּכָךְ וְכָךְ, עָתִיד הָיִיתָ לְהַחֲזִירָהּ בַּיּוֹבֵל, נִמְצֵאתָ קוֹנֶה מִסְפַּר הַתְּבוּאוֹת כְּפִי חֶשְׁבּוֹן שֶׁל כָּל שָׁנָה, אָכַלְתָּ אוֹתָהּ שָׁלוֹשׁ שָׁנִים אוֹ אַרְבַּע, הוֹצֵא אֶת דְּמֵיהֶן מִן הַחֶשְׁבוֹן וְטֹל אֶת הַשְּׁאָר\"; וְזֶהוּ וְהֵשִׁיב אֶת הָעֹדֵף בִּדְמֵי הַמֶּקַח עַל הָאֲכִילָה שֶׁאֲכָלָהּ וְיִתְּנֵם לַלּוֹקֵחַ:<br><br><b>לאיש אשר מכר לו.<\/b> הַמּוֹכֵר הַזֶּה שֶׁבָּא לְגָאֳלָהּ:", "rashi_en": "וחשב את שני ממכרו THEN LET HIM RECKON THE YEARS OF THE SALE THEREOF — [let him reckon thus:] How many years were there until the Jubilee? So-and-so many! At what price did I sell it to you? At such-and-such a price! Now in the Jubilee year you would have to restore it to me; it follows therefore that you have actually bought a number of crops only (and not the land itself) at a certain sum for every year. You have eaten it (used it) three or four years; deduct therefore their value from the sum total of the purchase money and  you take the remainder. And this is the meaning of: “he shall restore the overplus” — viz., the excess of the purchase-money over the value of the crops which he (the purchaser) has enjoyed, and he shall restore it to the purchaser.<br><br>לאיש אשר מכר לו [AND HE SHALL RESTORE THE OVERPLUS] TO THE MAN TO WHOM HE HAD SOLD IT — i. e. to whom he — this seller who now comes to redeem it — had sold it (but not to any other person who is now in the possession of the field, having in his turn bought it from that man to whom he — the seller — had originally sold it) (Sifra, Behar, Chapter 5 3; Arakhin 30a)."}, {"ch": 25, "v": 28, "aliyah": 4, "heb": "וְאִ֨ם לֹֽא־מָצְאָ֜ה יָד֗וֹ דֵּי֮ הָשִׁ֣יב לוֹ֒ וְהָיָ֣ה מִמְכָּר֗וֹ בְּיַד֙ הַקֹּנֶ֣ה אֹת֔וֹ עַ֖ד שְׁנַ֣ת הַיּוֹבֵ֑ל וְיָצָא֙ בַּיֹּבֵ֔ל וְשָׁ֖ב לַאֲחֻזָּתֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִם לָא תַשְׁכַּח יְדֵהּ כְּמִסַּת אֲתֵב לֵיהּ וִיהֵי זְבִינוֹהִי בִּידָא דִּזְבַן יָתֵיהּ עַד שַׁתָּא דְיוֹבֵלָא וְיִפּוֹק בְּיוֹבֵלָא וִיתוּב לְאַחֲסַנְתֵּיהּ:", "onk_en": "Or if he does not have within his means enough to retrieve the land to himself, then that which he sold remains in the possession of the buyer until the jubilee year. It is then released by the jubilee and he [the seller] returns to his ancestral land.", "pj": "וְאִין לָא תְאַרַע יְדֵיהּ הֵיכְמִסַת דְיָתֵיב לֵיהּ וִיהֵי זְבִינוֹי בְּיַד מַאן דְזַבִּין יָתֵיהּ עַד שַׁתָּא דְיוֹבְלָא וְיִפּוֹק בְּלָא כְסַף וְיֵתוּב לְאַחֲסַנְתֵּיהּ", "pj_en": "But if his hand meet not with the price that he should give him, then the property sold shall (remain) in the hand of him who bought it until the year of Jubela, and shall then go out without money, and he shall return to his possession.", "tj": "", "tj_en": "", "rashi": "<b>די השיב לו.<\/b> מִכָּאן שֶׁאֵינוֹ גוֹאֵל לַחֲצָאִין (ספרא; ערכין ל'):<br><br><b>עד שנת היובל.<\/b> שֶׁלֹּא יִכָּנֵס לְתוֹךְ אוֹתָהּ שָׁנָה כְּלוּם, שֶׁהַיּוֹבֵל מְשַׁמֵּט בִּתְחִלָּתוֹ (ספרא; ערכין כ\"ח):", "rashi_en": "די השיב לו [BUT IF HE IS NOT ABLE] TO RESTORE IT (lit., if his hand find not sufficient means to restore to him) — Therefore it follows that  he (the vendor) has no right to redeem his property in parts (lit., by halves) (Sifra, Behar, Chapter 5 5, Arachin 30a).<br><br>עד שנת היובל UNTIL THE YEAR OF JUBILEE — “until” but not “including” the year of the Jubilee; it means that nothing of time shall have entered into that year (that not one moment of that year shall have passed), because the Jubilee effects the release of such property at its very beginning (in contrast to the cancelling of debts in the “Shemittah” which takes place only at the end of the year; cf. Deuteronomy 15:1 ff.) (Sifra, Behar, Chapter 5 6; Arakhin 28b)."}, {"ch": 25, "v": 29, "aliyah": 5, "heb": "וְאִ֗ישׁ כִּֽי־יִמְכֹּ֤ר בֵּית־מוֹשַׁב֙ עִ֣יר חוֹמָ֔ה וְהָיְתָה֙ גְּאֻלָּת֔וֹ עַד־תֹּ֖ם שְׁנַ֣ת מִמְכָּר֑וֹ יָמִ֖ים תִּהְיֶ֥ה גְאֻלָּתֽוֹ׃", "onk": "וּגְבַר אֲרֵי יְזַבֵּן בֵּית מוֹתַב קַרְתָּא מַקְּפָא שׁוּר וּתְהֵי פֻרְקָנֵיהּ עַד מִשְׁלַם שַׁתָּא דִזְבִינוֹהִי עִדָּן בְּעִדָּן תְּהֵי פֻרְקָנֵיהּ:", "onk_en": "If a man shall sell a residential home [that is] within [<b>surrounded by<\/b>] a walled city, the time allotted for its redemption shall be until the end of one year after he sold it. He has the days [of a full year] in which to redeem it.", "pj": "וּגְבַר אֲרוּם יִזְבּוֹן בֵּית מוֹתָבָא בְּבוּרְנִין דְמַקְפִין שׁוּר וִיהֵי פּוּרְקָנֵיהּ עַד מִשְׁלַם שַׁתָּא דְזַבִּינוֹי מִן עִידַן לְעִידַן יְהֵי פוּרְקָנֵיהּ", "pj_en": "And if a man sell a dwelling-house, in a town surrounded by a wall, it may have redemption until the completing of the year from its sale: from time to time shall be its redemption.", "tj": "", "tj_en": "", "rashi": "<b>בית מושב עיר חומה.<\/b> בַּיִת בְּתוֹךְ עִיר הַמֻּקֶּפֶת חוֹמָה מִימוֹת יְהוֹשֻׁעַ בִּן נוּן (ספרא):<br><br><b>והיתה גאלתו.<\/b> לְפִי שֶׁנֶּאֱמַר בְּשָׂדֶה שֶׁיָּכוֹל לְגָאֳלָהּ מִשְּׁתֵי שָׁנִים וָאֵילָךְ כָּל זְמַן שֶׁיִּרְצֶה, וּבְתוֹךְ שְׁתֵּי שָׁנִים הָרִאשׁוֹנִים אֵינוֹ יָכוֹל לְגָאֳלָהּ, הֻצְרַךְ לְפָרֵט בָּזֶה שֶׁהוּא חִלּוּף — שֶׁאִם רָצָה לִגְאֹל בְּשָׁנָה רִאשׁוֹנָה גּוֹאֲלָהּ, וּלְאַחַר מִכָּאן אֵינוֹ גוֹאֲלָהּ:<br><br><b>והיתה גאלתו.<\/b> שֶׁל בַּיִת:<br><br><b>ימים.<\/b> יְמֵי שָׁנָה שְׁלֵמָה קְרוּיִים יָמִים, וְכֵן \"תֵּשֵׁב הַנַּעֲרָה אִתָּנוּ יָמִים\" (בראשית כ\"ד):", "rashi_en": "בית מושב עיר חומה A DWELLING PLACE IN A CITY WHICH HATH A WALL — i. e. a house situated in a city which has been surrounded by a wall since the days of Joshua the son of Nun (Sifra, Behar, Section 4 1).<br><br>והיתה גאלתו THEN IT SHALL HAVE THE RIGHT TO BE REDEEMED [UNTIL THE COMPLETION OF THE YEAR OF ITS SALE]  — Because it is stated about a field that one may redeem it after two years from the date of the sale and onwards at any time he pleases, but one may not redeem it during the first two years, Scripture was compelled to state specially with reference to this (the house) that just the opposite is the case — that if one wishes to redeem it in the first year he may do so, but after that he cannot redeem it.<br><br>והיתה גאלתו THEN THE REDEMPTION OF IT — of the house — SHALL BE [TILL THE COMPLETION OF THE YEAR].<br><br>ימים YEAR (lit., days) — the days of a full year are, briefly, termed “days”. Similar is: (Genesis 24:55) “Let the damsel remain with us a year (‎‎‏.\"(ימים"}, {"ch": 25, "v": 30, "aliyah": 5, "heb": "וְאִ֣ם לֹֽא־יִגָּאֵ֗ל עַד־מְלֹ֣את לוֹ֮ שָׁנָ֣ה תְמִימָה֒ וְ֠קָ֠ם הַבַּ֨יִת אֲשֶׁר־בָּעִ֜יר אֲשֶׁר־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[ל֣וֹ]<\/span> <span class=\"mam-kq-k\">(לא)<\/span><\/span> חֹמָ֗ה לַצְּמִיתֻ֛ת לַקֹּנֶ֥ה אֹת֖וֹ לְדֹרֹתָ֑יו לֹ֥א יֵצֵ֖א בַּיֹּבֵֽל׃", "onk": "וְאִם לָא יִתְפָּרַק עַד מִשְׁלַם לֵיהּ שַׁתָּא שְׁלֶמְתָּא וִיקוּם בֵּיתָא דִי בְקַרְתָּא דִּי לֵיהּ שׁוּרָא לַחֲלוּטִין לְדִי זְבַן יָתֵיהּ לְדָרוֹהִי לָא יִפּוֹק בְּיוֹבֵלָא:", "onk_en": "If he does not redeem it by the end of a full year, the house within the city that is surrounded by a wall shall then remain in perpetuity to its purchaser for his generations (descendants.) It is not released by the jubilee.", "pj": "וְאִין לָא יִתְפְּרֵיק עַד זְמַן מִישְׁלַם לֵיהּ שַׁתָּא שְׁלֵימְתָּא וִיקוּם בֵּיתָא דִבְקַרְתָּא דִלֵיהּ שׁוּרִין לַחֲלוּטִין לְדִיזְבַּן יָתֵיהּ לְדָרוֹי לָא יִפּוֹק בְּיוֹבְלָא", "pj_en": "But if it be not redeemed at the completing of the full year, the house that is in a walled town shall be confirmed absolutely to him who bought it, unto his generations: it shall not go out at the Jubela.", "tj": "", "tj_en": "", "rashi": "<b>וקם הבית … צמיתת.<\/b> יָצָא מִכֹּחוֹ שֶׁל מוֹכֵר וְעוֹמֵד בְּכֹחוֹ שֶׁל קוֹנֶה:<br><br><b>אשר לא חמה.<\/b> \"לוֹ\" קָרֵינָן, אָמְרוּ רַבּוֹתֵינוּ זִ\"לִ אַעַ\"פִּ שֶׁאֵין לוֹ עַכְשָׁיו הוֹאִיל וְהָיְתָה לוֹ קֹדֶם לָכֵן; וְעִיר נְקֵבָה הִיא, וְהֻצְרַךְ לִכְתֹּב \"לָהּ\", אֶלָּא מִתּוֹךְ שֶׁצָּרִיךְ לִכְתֹּב \"לֹא\" בִּפְנִים, תִּקְּנוּ \"לוֹ\" בַּמָּסֹרֶת — זֶה נוֹפֵל עַל זֶה:<br><br><b>לא יצא ביבל.<\/b> אָמַר רַב סַפְרָא אִם פָּגַע בּוֹ יוֹבֵל בְּתוֹךְ שְׁנָתוֹ לֹא יֵצֵא (עי' ערכין ל\"א):", "rashi_en": "וקם הבית...לצמתת (THEN THE HOUSE… SHALL BE ESTABLISHED ABSOLUTELY [TO HIM THAT OBTAINED IT] — i. e. it leaves the control of the vendor for ever and stands under the exclusive control of the purchaser. <br><br>אשר לא חמה — We read the text as though it were written לו (i. e. tradition tells us to do so). Our Rabbis, of blessed memory, said (Arakhin 32a): We do so to intimate that the law applies to a city even if at the present it has not a rampart (אשר לא חמה) since previous to now it had one (אשר לו חמה). It is true that עיר is a feminine noun and the preposition referring to it should have been written לה (not לו), yet because Scripture was bound to write לא in the text for the reason given, the Massora (the traditional Scriptural text without vowels) replaced it by לו (instead of לה), because the sound of the one applies also to the other (they sound similar).<br><br>לא יצא ביובל IT SHALL NOT GO OUT IN THE JUBILEE — Rabbi Saphra said, “if the Jubilee happened to fall during that year (the first year of its sale), it shall nevertheless not go out” (Arakhin 31b)."}, {"ch": 25, "v": 31, "aliyah": 5, "heb": "וּבָתֵּ֣י הַחֲצֵרִ֗ים אֲשֶׁ֨ר אֵין־לָהֶ֤ם חֹמָה֙ סָבִ֔יב עַל־שְׂדֵ֥ה הָאָ֖רֶץ יֵחָשֵׁ֑ב גְּאֻלָּה֙ תִּהְיֶה־לּ֔וֹ וּבַיֹּבֵ֖ל יֵצֵֽא׃", "onk": "וּבָתֵּי פַצְחַיָּא דִּי לֵית לְהוֹן שׁוּר מַקַּף סְחוֹר סְחוֹר עַל חֲקַל אַרְעָא יִתְחַשָּׁב פֻּרְקָנָא תְּהֵי לֵיהּ וּבְיוֹבֵלָא יִפּוֹק:", "onk_en": "The houses of open cities which are not surrounded by a [<b>an encircling<\/b>] wall shall be considered as a field of the land. It shall have a redemption and it is released by the jubilee.", "pj": "וּבָתֵּי כּוּפְרָנַיָא דְלֵית לְהוֹן שׁוּר מַקַף חֲזוֹר חֲזוֹר הֵי כְטִינְדִיסִין דִפְרִיסִין עַל חֲקַל אַרְעָא יִתְחַשְׁבוּן פּוּרְקָנָא תְּהֵי לְהוֹן וּבְיוֹבְלָא יִפְקוּן", "pj_en": "But houses in villages which have no walls round about them, are to be accounted as tents which are spread upon the fields of the earth; they may be redeemed, and they shall go out at the Jubela.", "tj": "", "tj_en": "", "rashi": "<b>ובתי החצרים.<\/b> כְּתַרְגּוּמוֹ \"פַּצְחִין\" — עֲיָרוֹת פְּתוּחוֹת מֵאֵין חוֹמָה, וְיֵשׁ הַרְבֵּה בְּסֵפֶר יְהוֹשֻׁעַ, \"הֶעָרִים וְחַצְרֵיהֶם\" (יהושע י\"ג), \"בְּחַצְרֵיהֶם וּבְטִירֹתָם\" (בראשית כ\"ה):<br><br><b>על שדה הארץ יחשב.<\/b> הֲרֵי הֵן כְּשָׂדוֹת, הַנִּגְאָלִים עַד הַיּוֹבֵל וְיוֹצְאִין בַּיּוֹבֵל לַבְּעָלִים אִם לֹא נִגְאֲלוּ:<br><br><b>גאלה תהיה לו.<\/b> מִיָּד, אִם יִרְצֶה, וּבָזֶה יָפֶה כֹחוֹ מִכֹּחַ שָׂדוֹת, שֶׁהַשָּׂדוֹת אֵין נִגְאֲלוֹת עַד שְׁתֵּי שָׁנִים (ערכין ל\"ג):<br><br><b>וביבל יצא.<\/b> בְּחִנָּם:", "rashi_en": "ובתי החצרים BUT THE HOUSES OF THE VILLAGES — Understand this as the Targum does: פצחין i. e. “houses of open cities” such as have no rampart. The term חצר occurs many times in this sense in the Book of Joshua, e.g., (Joshua 13:29) “the cities and the unwalled places thereof (וחצריהם)”; so also (Genesis 25:16) \"by their unwalled places (בחצריהם) and by their strongholds” (see Rashi on that verse).<br><br>על שדה הארץ יחשב [BUT THE HOUSES OF THE VILLAGES]… SHALL BE ACCOUNTED AS THE FIELDS OF THE COUNTRY — i. e. they shall be like the fields which may be redeemed until the  Jubilee(not only in the first year) and go out in the Jubilee into the possession of their owners if they have not been redeemed in the meantime (Arakhin 33a).<br><br>גאלה תהיה לו THEY MAY BE REDEEMED — at once if he (the vendor) so desires. In this respect it (the house in an unwalled city) has even a greater advantage than the fields, for the fields cannot be redeemed until two years have elapsed from the date of the sale (Arakhin 33a; cf. Rashi on v. 24).<br><br>וביבל יצא AND THEY SHALL GO OUT IN THE JUBILEE — for nothing."}, {"ch": 25, "v": 32, "aliyah": 5, "heb": "וְעָרֵי֙ הַלְוִיִּ֔ם בָּתֵּ֖י עָרֵ֣י אֲחֻזָּתָ֑ם גְּאֻלַּ֥ת עוֹלָ֖ם תִּהְיֶ֥ה לַלְוִיִּֽם׃", "onk": "וְקִרְוֵי לֵיוָאֵי בָּתֵּי קִרְוֵי אַחֲסַנְתְּהוֹן פֻּרְקַן עָלָם תְּהֵי לְלֵיוָאֵי:", "onk_en": "The cities of the Levites the houses in the cities of their ancestral land, the Levites shall have an eternal right of redemption.", "pj": "וְקִרְוֵי לֵיוָאֵי בָּתֵּי קִירְוֵי אַחְסַנְתְּהוֹן פּוּרְקַן עֲלַם יְהֵי לְלֵיוָאֵי", "pj_en": "But the cities of the Levites, the houses of the cities of their possession may be always redeemable by the Levites.", "tj": "", "tj_en": "", "rashi": "<b>וערי הלוים.<\/b> אַרְבָּעִים וּשְׁמוֹנֶה עִיר שֶׁנִתְּנוּ לָהֶם:<br><br><b>גאלת עולם.<\/b> גּוֹאֵל מִיָּד, אֲפִלּוּ לִפְנֵי שְׁתֵּי שָׁנִים, אִם מָכְרוּ שָׂדֶה מִשְּׂדוֹתֵיהֶם הַנְּתוּנוֹת לָהֶם בְּאַלְפַּיִם אַמָּה סְבִיבוֹת הֶעָרִים, אוֹ אִם מָכְרוּ בַיִת בְּעִיר חוֹמָה, גּוֹאֲלִין לְעוֹלָם וְאֵינוֹ חָלוּט לְסוֹף שָׁנָה (שם):", "rashi_en": "וערי הלוים  THE CITIES OF THE LEVITES… [MAY BE REDEEMED AT ANY TIME]  — This refers only to the forty-eight cities which had been given to them (cf. Numbers 35:6. 7). (But if the Levites built another city for themselves, or if a  Levite possesses a house in a city inhabited by Israelites these do not come under this law). <br><br>גאלת עולם [THE LEVITES SHALL HAVE] THE RIGHT OF REDEMPTION AT ANY TIME — This means that they (Levites) may redeem at once — even before the end of two years — if they sold a field of those fields which had been given to them within the two thousand cubits round about the cities (cf. Numbers 25:5) (whilst an ordinary Israelite’s field must remain at least two years in the hand of the purchaser), or if they sold “a house in a city which has a wall” they may redeem it at any time and it does not become irredeemable at the end of one year (as is the case with such houses belonging to Israelites; cf. v. 30) (Arakhin 33b)."}, {"ch": 25, "v": 33, "aliyah": 5, "heb": "וַאֲשֶׁ֤ר יִגְאַל֙ מִן־הַלְוִיִּ֔ם וְיָצָ֧א מִמְכַּר־בַּ֛יִת וְעִ֥יר אֲחֻזָּת֖וֹ בַּיֹּבֵ֑ל כִּ֣י בָתֵּ֞י עָרֵ֣י הַלְוִיִּ֗ם הִ֚וא אֲחֻזָּתָ֔ם בְּת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְדִי יִפְרוֹק מִן לֵיוָאֵי וְיִפּוֹק זְבִין בֵּיתָא וְקַרְתָּא אַחֲסַנְתֵּיהּ בְּיוֹבֵלָא אֲרֵי בָתֵּי קִרְוֵי לֵיוָאֵי הִיא אַחֲסַנְתְּהוֹן בְּגוֹ בְּנֵי יִשְׂרָאֵל:", "onk_en": "If anyone redeems [a house or field] from the Levites, then the house or his ancestral city shall be released by the jubilee, for the houses of the Levitic cities are [considered] their ancestral lands among Bnei Yisroel.", "pj": "וּמַאן דְיִפְרוֹק מִן לֵיוָאֵי וְיִפּוֹק זְבִינֵי בֵּיתָא וְקִירְוֵי אַחְסַנְתְּהוֹן בְּיוֹבְלָא אֲרוּם בָּתֵּי קִירְוֵי לֵיוָאֵי הִיא אַחְסַנְתְּהוֹן בְּגוֹ בְּנֵי יִשְרָאֵל", "pj_en": "And when one hath purchased of the Levites the house that was sold in the cities of their possession, it shall go out at the Jubela; for the houses of the Levites are their inheritance among the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ואשר יגאל מן הלוים.<\/b> וְאִם יִקְנֶה בַיִת אוֹ עִיר מֵהֶם וְיֵצֵא בַיּוֹבֵל אוֹתוֹ מִמְכָּר שֶׁל בַּיִת אוֹ שֶׁל עִיר וְיָשׁוּב לַלֵּוִי שֶׁמְּכָרוֹ, וְלֹא יִהְיֶה חָלוּט כִּשְׁאָר בָּתֵּי עָרֵי חוֹמָה שֶׁל יִשְׂרָאֵל, וּגְאֻלָּה זוֹ לְשׁוֹן מְכִירָה; דָּ\"אַ, לְפִי שֶׁנֶּאֱמַר גְּאֻלַּת עוֹלָם תִּהְיֶה לַלְוִיִּם, יָכוֹל לֹא דִּבֵּר הַכָּתוּב אֶלָּא בְּלוֹקֵחַ יִשְׂרָאֵל שֶׁקָּנָה בַיִת בְּעָרֵי הַלְוִיִּם, אֲבָל לֵוִי שֶׁקָּנָה מִלֵּוִי, יִהְיֶה חָלוּט, תַּ\"לֹ וַאֲשֶׁר יִגְאַל מִן הַלְוִיִּם — אַף הַגּוֹאֵל מִיַּד לֵוִי גּוֹאֵל גְּאֻלַּת עוֹלָם:<br><br><b>ויצא ממכר בית.<\/b> הֲרֵי זוֹ מִצְוָה אַחֶרֶת, וְאִם לֹא גְאָלָהּ, יוֹצְאָה בַיּוֹבֵל וְאֵינוֹ נֶחְלָט לְסוֹף שָׁנָה כְּבַיִת שֶׁל יִשְֹרָאֵל:<br><br><b>כי בתי ערי הלוים הוא אחזתם.<\/b> לֹא הָיָה לָהֶם נַחֲלַת שָׂדוֹת וּכְרָמִים, אֶלָּא עָרִים לָשֶׁבֶת וּמִגְרְשֵׁיהֶם, לְפִיכָךְ הֵם לָהֶם בִּמְקוֹם שָׂדוֹת, וְיֵשׁ לָהֶם גְּאֻלָּה כְשָׂדוֹת, כְּדֵי שֶׁלֹּא תֻּפְקַע נַחֲלָתָם מֵהֶם:", "rashi_en": "‎הלוים‎ מן‎ואשר יגאל ‏ ‎‎‎ ‎— This means, and if any one buys a house or a city from them, then that house that has been sold or the city that was sold shall go out in the Jubilee and shall return unto the Levite who has sold it, and not be irredeemable as are other houses in “cities that have a wall” viz., those of Israelites. According to this explanation, יגאל has here the meaning of a “sale”. Another explanation is (taking יגאל here in its usual meaning of “redeeming”): Because it is stated in the previous verse: “the Levites shall have the right of redemption at any time”, I might think that Scripture is speaking only of an ordinary Israelite purchaser who bought a house in a city of the Levites, but when a Levite bought a house from another Levite it shall be irredeemable! Scripture therefore states “[the Levites shall have the right redemption at any time]”, ואשר יגאל מן הלוים, “also if one who redeems does so from the Levites — i. e. that also one (a Levite) who redeems a house from the possession of another Levite shall have the right to do so at any time (Sifra, Behar, Chapter 6 6).<br><br>ויצא ממכר בית THEN THE HOUSE THAT WAS SOLD… SHALL GO OUT [IN THE JUBILEE] — According to the second explanation of ‎'ואשר יגאל וכו‎‎ given above, this contains another command and is not a continuation of the words that precede. They mean: “but if he (the vendor) did not redeem it” then it shall go out in the Jubilee and shall not become irredeemable at the end of the first year as is the case with the house of an Israelite.<br><br>כי בתי ערי הלוים הוא אחזתם  FOR THE HOUSES OF THE CITIES OF THE LEVITES ARE THEIR POSSESSION  —They had no separate property of fields and vineyards, only cities to dwell therein together with the open land surrounding them; these, therefore, in their case took the place of the fields possessed by the Israelites and should thus be redeemable just like fields, in order that their inheritance should not be alienated from them."}, {"ch": 25, "v": 34, "aliyah": 5, "heb": "וּֽשְׂדֵ֛ה מִגְרַ֥שׁ עָרֵיהֶ֖ם לֹ֣א יִמָּכֵ֑ר כִּֽי־אֲחֻזַּ֥ת עוֹלָ֛ם ה֖וּא לָהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲקַל רְוַח קִרְוֵיהוֹן לָא יִזְדַּבָּן אֲרֵי אַחֲסָנַת עָלָם הוּא לְהוֹן:", "onk_en": "The field on the outskirts of their cities may not be sold for it is their perpetual ancestral land.", "pj": "וּבְרַם חֲקִיל פַּרְוִילִי קִירְוֵיהוֹן לָא יְזַבְּנוּן אֲרוּם אַחְסָנַת עֲלַם הוּא לְהוֹן", "pj_en": "But a field in the suburbs of their cities shall not be sold for it is an everlasting possession for them.", "tj": "וַחֲקַל פַּרְזִילִי קִירְיָיהוֹן לָא יִזְדַּבֵּן אֲרוּם אַחֲסָנַת:",
