p only in the case of sacrifice, offering incense, libation and prostration, as it is written (Exodus 22:19), “[He that sacrifices unto any god] save unto the Lord only [shall be doomed to death]” — which thus puts under the death penalty only kinds of worship that are performed in honor of the Most High God (i.e. such as have characteristics similar to “sacrifice”; cf. Rashi on Exodus 22:19), Scripture comes and teaches you here that if the usual way of worshiping any idol is by some other rite, as e.g., that one exposes himself in front of Baal Peor, or casts a stone before Mercury — then this is its cult and one who performs it is therefore liable to the death penalty, but for sacrifice, offering incense, libation and prostration one becomes liable to the death penalty even though this be not the usual way of worshiping it (Sanhedrin 60b)."}, {"ch": 12, "v": 31, "aliyah": 3, "heb": "לֹא־תַעֲשֶׂ֣ה כֵ֔ן לַיהֹוָ֖ה אֱלֹהֶ֑יךָ כִּי֩ כׇל־תּוֹעֲבַ֨ת יְהֹוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵאלֹ֣הֵיהֶ֔ם כִּ֣י גַ֤ם אֶת־בְּנֵיהֶם֙ וְאֶת־בְּנֹ֣תֵיהֶ֔ם יִשְׂרְפ֥וּ בָאֵ֖שׁ לֵאלֹֽהֵיהֶֽם׃", "onk": "לָא תַעְבֵּד כֵּן <b>קֳדָם<\/b> יְיָ אֱלָהָךְ אֲרֵי כָּל <b>דִּמְרָחָק קֳדָם<\/b> יְיָ דִּי סָנֵי עֲבָדוּ <b>לְטַעֲוָתְהוֹן<\/b> אֲרֵי אַף יָת בְּנֵיהוֹן וְיָת בְּנָתֵיהוֹן יוֹקְדִין בְּנוּרָא <b>לְטַעֲוָתְהוֹן<\/b>:", "onk_en": "Do not do so to [<b>before<\/b>] Adonoy, your God, because whatever is abominated by [<b>distanced before<\/b>] God, what He hates, they have done for their gods [<b>idols<\/b>]; for even their sons and their daughters do they burn in fire to their gods [<b>idols<\/b>].", "pj": "לָא תַעַבְדוּן פּוּלְחָנָא כְּדֵין לַייָ אֱלָהָכוֹן אֲרוּם כָּל דִּמְרַחֵק יְיָ דְסָנֵי עָבְדִין לְטַעֲוַותְהוֹן אֲרוּם אוּף יַת בְּנֵיהוֹן וְיַת בְּנָתֵיהוֹן כַּפְתִין וּמוֹקְדִין בְּנוּרָא לְטַעֲוַותְהוֹן", "pj_en": "So shall you not do in serving the Lord your God; for whatever is abominable and hateful to Him have they done to their idols; for even their sons and daughters they have bound and burned with fire unto their idols.", "tj": "", "tj_en": "", "rashi": "<b>כי גם את בניהם.<\/b> \"גַּם\" – לְרַבּוֹת אֶת אֲבוֹתֵיהֶם וְאִמּוֹתֵיהֶם; אָמַר רַבִּי עֲקִיבָא אֲנִי רָאִיתִי גוֹי שֶׁכְּפָתוֹ לְאָבִיו לִפְנֵי כַלְבּוֹ וַאֲכָלוֹ (ספרי):", "rashi_en": "כי גם את בניהם FOR ALSO THEIR SONS [AND THEIR DAUGHTERS HAVE THEY BURNT IN THE FIRE TO THEIR GOD] — The word גם, “also”, is intended to include amongst those they used to burn, their parents also. R. Akiba related, “I once saw a heathen who bound his father before his dog which thereupon devoured him” (Sifrei Devarim 81:6)."}, {"ch": 13, "v": 1, "aliyah": 3, "heb": "אֵ֣ת כׇּל־הַדָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְכֶ֔ם אֹת֥וֹ תִשְׁמְר֖וּ לַעֲשׂ֑וֹת לֹא־תֹסֵ֣ף עָלָ֔יו וְלֹ֥א תִגְרַ֖ע מִמֶּֽנּוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "יָת כָּל פִּתְגָּמָא דִּי אֲנָא מְפַקֵּד יָתְכוֹן יָתֵיהּ תִּטְּרוּן לְמֶעְבָּד לָא תוֹסְפוּן עֲלוֹהִי וְלָא תִמְנְעוּן מִנֵּיהּ:", "onk_en": "Everything that I am commanding you—be careful to fulfill it; do not add to it and do not subtract from it.", "pj": "יַת כָּל פִּתְגָמַיָא דַאֲנָא מְפַקֵּיד יַתְכוֹן יָתֵיהּ תִּטְרוּן לְמֶעֱבַד לָא תוֹסְפוּן עֲלוֹי וְלָא תִבְצְרוּן מִנֵּיהּ", "pj_en": "Whatsoever I command you, that shall you observe to do; ye shall not add to it nor diminish from it.", "tj": "", "tj_en": "", "rashi": "<b>את כל הדבר.<\/b> קַלָּה כַּחֲמוּרָה (שם):<br><br><b>תשמרו לעשות.<\/b> לִתֵּן לֹא תַעֲשֶׂה עַל עֲשֵׂה הָאֲמוּרִים בַּפָּרָשָׁה, שֶׁכָּל הִשָּׁמֶר לְשׁוֹן לֹא תַעֲשֶׂה הוּא, אֶלָּא שֶׁאֵין לוֹקִין עַל הִשָּׁמֶר שֶׁל עֲשֵׂה (מכות י\"ג):<br><br><b>לא תסף עליו.<\/b> חֲמִשָּׁה טֹטָפוֹת, חֲמִשָּׁה מִינִין בַּלּוּלָב, אַרְבַּע בְּרָכוֹת לְבִרְכַּת כֹּהֲנִים (ספרי):", "rashi_en": "את כל הדבר EVERYTHING [I COMMAND YOU] — light precepts as well as grave ones (Sifrei Devarim 82:1),<br><br>תשמרו לעשות OBSERVE TO DO — This statement is intended to attach also a prohibition (לאו) to the positive commands mentioned in this section (Sifrei Devarim 82:2), for wherever השמר is used it is a term that implies a prohibition, but the difference between this and an ordinary prohibition is that flagellation is not inflicted for infringing a prohibition resulting from the use of the term השמר in connection with a positive command.<br><br>לא תסף עליו THOU SHALT NOT ADD THERETO — as, for instance, to place five chapters in the Tephillin, to employ five species of fruit and plants in the fulfilment of the command of Lulab, to recite four instead of three blessings in the Benedictions of the priests (Sifrei Devarim 82:4; cf. Rashi on Deuteronomy 4:2)."}, {"ch": 13, "v": 2, "aliyah": 3, "heb": "כִּֽי־יָק֤וּם בְּקִרְבְּךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְנָתַ֥ן אֵלֶ֛יךָ א֖וֹת א֥וֹ מוֹפֵֽת׃", "onk": "אֲרֵי יְקוּם בֵּינָךְ נְבִיָּא אוֹ חָלֵם חֶלְמָא וְיִתֶּן לָךְ אָת אוֹ מוֹפְתָא:", "onk_en": "If a prophet arises among you or a dreamer of a dream, and he gives you an omen or a miracle,", "pj": "אֲרֵי יְקוּם בֵּינֵיכוֹן נְבִי שִׁקְרָא אוֹ מָרֵי חֲלִים חֶלְמָא דְזֵדָנוּתָא וְיִתֵּן לְכוֹן אָת אוֹ תִמְהָא", "pj_en": "When there may arise among you a false prophet or a dreamer of a profane dream, and he give you a sign or a miracle,", "tj": "", "tj_en": "", "rashi": "<b>ונתן אליך אות.<\/b> בַּשָּׁמַיִם, כָּעִנְיָן שֶׁנֶּאֱמַר בְּגִדְעוֹן (שופטים ו') \"וְעָשִׂיתָ לִּי אוֹת\" וְאוֹמֵר \"יְהִי נָא חֹרֶב אֶל הַגִּזָּה\" וְגוֹ':<br><br><b>או מופת.<\/b> בָּאָרֶץ, אַעַ\"פִּ כֵן לֹא תִשְׁמַע לוֹ, וְאִם תֹּאמַר מִפְּנֵי מָה נוֹתֵן לוֹ הַקָּבָּ\"ה מֶמְשָׁלָה לַעֲשׂוֹת אוֹת? <b>כי מנסה ה' אלהיכם אתכם<\/b> (ספרי; עי' סנהדרין צ'):", "rashi_en": "ונתן אליך אות [IF THERE ARISE AMONG YOU A PROPHET …] AND GIVETH THEE A SIGN that will show itself in the heavens, just as it is stated in the case of Gideon who spoke to the angel, (Judges 6:17) “[If now I found grace in your sight], then show me a sign (אות)”, and then it further states, (Judges 6:39) “[let me prove, I pray thee, but this once with the fleece;] let it be dry only upon the fleece [and upon all the ground let there be dew]”.<br><br>או מופת OR A WONDER showing itself on the earth. — Nevertheless you shall not hearken unto him (although the sign or the wonder come to pass; cf. v. 3). But if you ask, why then does God give him the power to perform a sign? Scripture replies, (v. 4) “for the Lord your God trieth you, [to know whether you really love the Lord your God]” (Sifrei Devarim 84:1; cf. Sanhedrin 90a)."}, {"ch": 13, "v": 3, "aliyah": 3, "heb": "וּבָ֤א הָאוֹת֙ וְהַמּוֹפֵ֔ת אֲשֶׁר־דִּבֶּ֥ר אֵלֶ֖יךָ לֵאמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא־יְדַעְתָּ֖ם וְנׇֽעׇבְדֵֽם׃", "onk": "וְיֵיתֵי אָתָא וּמוֹפְתָא דִּי מַלִּיל עִמָּךְ לְמֵימָר נְהַךְ בָּתַר <b>טַעֲוַת עַמְמַיָּא<\/b> דִּי לָא יְדַעְתָּנוּן וְנִפְלְחִנּוּן:", "onk_en": "And the omen or the miracle happens—the one he told you about—saying, ‘‘Let us go after other gods [<b>idols of other nations<\/b>], that you do not know, and let us serve them.’’", "pj": "וְיֵיתִי אָתָא אוֹ תִמְהָא דְמַלֵּיל עִמְכוֹן לְמֵימָר נְהַךְ בָּתַר טַעֲוַות עַמְמַיָא דְלָא חַכִּימְתְּנוּן וְנִפְלוֹחַ קֳדָמֵיכוֹן", "pj_en": "and the sign or the miracle come to pass, (yet) because he spake with you, saying, Let us go after the gods of the peoples whom thou hast not known, and worship them,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 4, "aliyah": 3, "heb": "לֹ֣א תִשְׁמַ֗ע אֶל־דִּבְרֵי֙ הַנָּבִ֣יא הַה֔וּא א֛וֹ אֶל־חוֹלֵ֥ם הַחֲל֖וֹם הַה֑וּא כִּ֣י מְנַסֶּ֞ה יְהֹוָ֤ה אֱלֹֽהֵיכֶם֙ אֶתְכֶ֔ם לָדַ֗עַת הֲיִשְׁכֶ֤ם אֹֽהֲבִים֙ אֶת־יְהֹוָ֣ה אֱלֹהֵיכֶ֔ם בְּכׇל־לְבַבְכֶ֖ם וּבְכׇל־נַפְשְׁכֶֽם׃", "onk": "לָא <b>תְקַבֵּל<\/b> לְפִתְגָּמֵי נְבִיָּא הַהוּא אוֹ לְחָלֵם חֶלְמָא הַהוּא אֲרֵי מְנַסֵּי יְיָ אֱלָהֲכוֹן יָתְכוֹן לְמִדַּע הַאִיתֵיכוֹן רָחֲמִין יָת יְיָ אֱלָהֲכוֹן בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן:", "onk_en": "Do not listen to [<b>accept<\/b>] the words of that prophet or to that dreamer of a dream, because Adonoy, your God, is testing you to know whether you love Adonoy, your God, wholeheartedly and with your entire beings.", "pj": "לָא תְקַבְּלוּן לְפִתְגָמֵי נְבִי שִׁקְרָא הַהוּא אוֹ מִן חֲלִים חֵילְמָא הַהוּא אֲרוּם מְנַסֵּי יְיָ אֱלָהָכוֹן יַתְכוֹן לְמִנְדוֹעַ הַאִיתֵיכוֹן רַחֲמִין יַת יְיָ אֱלָהָכוֹן בְּכָל לְבַבְכוֹן וּבְכָל נַפְשֵׁכוֹן", "pj_en": "you shall not hearken to the words of that lying prophet, or him who hath dreamed that dream; for the Lord your God (thereby) trieth you, to know whether you will love the Lord your God with all your heart and with all your soul.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 5, "aliyah": 3, "heb": "אַחֲרֵ֨י יְהֹוָ֧ה אֱלֹהֵיכֶ֛ם תֵּלֵ֖כוּ וְאֹת֣וֹ תִירָ֑אוּ וְאֶת־מִצְוֺתָ֤יו תִּשְׁמֹ֙רוּ֙ וּבְקֹל֣וֹ תִשְׁמָ֔עוּ וְאֹת֥וֹ תַעֲבֹ֖דוּ וּב֥וֹ תִדְבָּקֽוּן׃", "onk": "בָּתַר <b>דַּחַלְתָּא<\/b> דַיְיָ אֱלָהֲכוֹן תְּהָכוּן וְיָתֵיהּ תִּדְחֲלוּן וְיָת פִּקּוֹדוֹהִי תִטְּרוּן <b>וּלְמֵימְרֵיהּ תְּקַבְּלוּן וְקָדָמוֹהִי<\/b> תִפְלְחוּן <b>וּבְדַחַלְתֵּיהּ<\/b> תִּתְקָרְבוּן:", "onk_en": "After [<b>the fear of<\/b>] Adonoy, your God, are you to go, fear Him, keep His commandments, heed His voice [<b>accept His word<\/b>], serve [<b>before<\/b>] Him, and cleave to [<b>the fear of<\/b>] Him.", "pj": "בָּתַר פּוּלְחָנָא דַיְיָ אֱלָהָכוֹן תְּהָכוּן וְיָתֵיהּ תְּדַחֲלוּן וְיַת פִּקּוּדוֹי תִּנְטְרוּן וּלְמֵימְרֵיהּ תְּקַבְּלוּן וּקְדָמוֹי תִּצְלוּן וּבְדַחַלְתֵּיהּ תִּתְקַרְבוּן", "pj_en": "You shall walk after the service of the Lord your God, and Him shall you fear, and keep His commandments, hearken to His word, pray before Him, and cleave unto His fear.", "tj": "", "tj_en": "", "rashi": "<b>ואת מצותיו תשמרו.<\/b> תּוֹרַת מֹשֶׁה:<br><br><b>ובקלו תשמעו.<\/b> בְּקוֹל הַנְּבִיאִים:<br><br><b>ואתו תעבדו.<\/b> בְּמִקְדָּשׁוֹ (ספרי):<br><br><b>ובו תדבקון.<\/b> הִדַּבֵּק בִּדְרָכָיו – גְּמֹל חֲסָדִים, קְבֹר מֵתִים, בַּקֵּר חוֹלִים, כְּמוֹ שֶׁעָשָׂה הַקָּבָּ\"ה (סוטה י\"ד):", "rashi_en": "ואת מצותיו תשמורו HIS COMMANDMENTS YE SHALL KEEP — the Law of Moses,<br><br>ובקלו תשמעו HIS VOICE YE SHALL OBEY — the voice of the prophets,<br><br>ואתו תעבדו HIM YE SHALL SERVE in His Temple (Sifrei Devarim 85:5).<br><br>ובו תדבקון AND UNTO HIM YE SHALL CLEAVE — i.e. cleave to His ways: do kindly actions, bury the dead, visit the sick, as did the Holy One, blessed be He (Sotah 14a)."}, {"ch": 13, "v": 6, "aliyah": 3, "heb": "וְהַנָּבִ֣יא הַה֡וּא א֣וֹ חֹלֵם֩ הַחֲל֨וֹם הַה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר־סָ֠רָ֠ה עַל־יְהֹוָ֨ה אֱלֹֽהֵיכֶ֜ם הַמּוֹצִ֥יא אֶתְכֶ֣ם&thinsp;<b>׀<\/b> מֵאֶ֣רֶץ מִצְרַ֗יִם וְהַפֹּֽדְךָ֙ מִבֵּ֣ית עֲבָדִ֔ים לְהַדִּֽיחֲךָ֙ מִן־הַדֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּךָ֛ יְהֹוָ֥ה אֱלֹהֶ֖יךָ לָלֶ֣כֶת בָּ֑הּ וּבִֽעַרְתָּ֥ הָרָ֖ע מִקִּרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּנְבִיָּא הַהוּא אוֹ חָלֵם חֶלְמָא הַהוּא יִתְקְטֵל אֲרֵי מַלִּיל סַטְיָא עַל יְיָ אֱלָהֲכוֹן דִּי אַפֵּיק יָתְכוֹן מֵאַרְעָא דְמִצְרַיִם וּדְפָרְקָךְ מִבֵּית עַבְדוּתָא לְאַטְעֲיוּתָךְ מִן אָרְחָא דִּי פַקְּדָךְ יְיָ אֱלָהָךְ לִמְהַךְ בַּהּ וּתְפַלֵּי עָבֵד <b>דְּבִישׁ<\/b> מִבֵּינָךְ:", "onk_en": "And that prophet or that dreamer of a dream is to be executed, for he has uttered a fabrication about Adonoy, your God—Who took you out of the land of Egypt, and Who redeemed you from the house of bondage—to mislead you from the way that Adonoy, your God, commanded you to go upon, and you will eliminate the evil [<b>doers<\/b>] from within you.", "pj": "וּנְבִי שִׁקְרָא הַהוּא אוֹ חֲלִים חֵילְמָא זְדָנָא הַהוּא יִתְקְטֵל בְּסַיְיפָא אֲרוּם מַלֵּיל סַטְיָא עַל יְיָ אֱלָהָכוֹן דְּאַפֵּיק יַתְכוֹן מֵאַרְעָא דְמִצְרָאֵי וְדִי פְרַקְכוֹן מִבֵּית שִׁעְבּוּד עַבְדַיָא לְאַטְעֲיוּתְכוֹן מִן אָרְחָא דְפַקֵּידְכוֹן יְיָ אֱלָהָכוֹן לִמְהַלְכָא בָּהּ וּתְפַלּוּן עַבְדֵי בִישְׁתָּא מִבֵּינֵיכוֹן", "pj_en": "And that prophet of lies, or that dreamer of dreams, shall be slain with the sword, because he had spoken perversity against the Lord your God who brought you out from the land of the Mizraee, and redeemed you from the house of the affliction of slaves to make you to go astray from the path which the Lord your God hath commanded you to walk in: so shall you bring down the doers of evil among you.", "tj": "", "tj_en": "", "rashi": "<b>סרה.<\/b> דָּבָר הַמּוּסָר מִן הָעוֹלָם, שֶׁלֹּא הָיָה וְלֹא נִבְרָא וְלֹא צִוִּיתִיו לְדַבֵּר כֵּן, דישטו\"רנורא בְּלַעַז:<br><br><b>והפדך מבית עבדים.<\/b> אֲפִלּוּ אֵין לוֹ עָלֶיךָ אֶלָּא שֶׁפְּדָאֲךָ — דַּיּוֹ (ספרי):", "rashi_en": "סרה [BECAUSE HE HATH SPOKEN] סרה — i.e. something that is strange in the world (more lit., removed from the world), something which never existed and was never created (a pure invention), and which I never bade him say; detournure in O. F.<br><br>והפדך מבית עבדים AND WHO RELEASED YOU OUT OF THE HOUSE OF SERVANTS — even though he had no other claim on you but that He delivered you, it would be sufficient for Him to claim your obedience (Sifrei Devarim 86:5)."}, {"ch": 13, "v": 7, "aliyah": 3, "heb": "כִּ֣י יְסִֽיתְךָ֡ אָחִ֣יךָ בֶן־אִ֠מֶּ֠ךָ אֽוֹ־בִנְךָ֨ אֽוֹ־בִתְּךָ֜ א֣וֹ&thinsp;<b>׀<\/b> אֵ֣שֶׁת חֵיקֶ֗ךָ א֧וֹ רֵֽעֲךָ֛ אֲשֶׁ֥ר כְּנַפְשְׁךָ֖ בַּסֵּ֣תֶר לֵאמֹ֑ר נֵֽלְכָ֗ה וְנַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַאֲבֹתֶֽיךָ׃", "onk": "אֲרֵי יְמַלְּכִנָּךְ אֲחוּךְ בַּר אִמָּךְ אוֹ בְרָךְ אוֹ בְרַתָּךְ אוֹ אִתַּת <b>קְיָמָךְ<\/b> אוֹ חַבְרָךְ דִּי כְנַפְשָׁךְ בְּסִתְרָא לְמֵימָר נְהַךְ וְנִפְלַח <b>לְטַעֲוַת עַמְמַיָּא<\/b> דִּי לָא יְדַעַתְּ אַתְּ וַאֲבָהָתָךְ:", "onk_en": "If one shall incite you, your brother—son of your mother—or your son or your daughter, or the wife of your bosom [<b>covenant<\/b>], or your neighbor who is your soul mate, clandestinely, saying, ‘‘Let us go and serve other gods [<b>idols of other nations<\/b>]’’ whom you never knew—neither you nor your forefathers.", "pj": "אֲרוּם יַטְעִינָךְ מִילְכָא בִּישָׁא אָחוּךְ בַּר אִימָךְ כָּל דְּכֵן בַּר אִיבָךְ אוֹ בְרָךְ אוֹ בְרַתָּךְ אוֹ אִתְּתָךְ דְּדַמְכָא בְּעוֹדָךְ אוֹ חַבְרָךְ דְּחָבִיב עֲלָךְ כְּנַפְשָׁךְ כָּרַז לְמֵימָר נְהַךְ וְנִפְלַךְ לְטַעֲוַות עַמְמַיָא דְלָא חַכִּימְתָּא אַנְתְּ וְאַבְהָתָךְ", "pj_en": "When thy brother, the son of thy mother, when even the son of thy father, or thy own son or thy daughter, or thy wife who reposeth with thee, or thy friend who is beloved as thy soul, shall give thee evil counsel, to make thee go astray, speaking out and saying, Let us go and worship the gods of the Gentiles, which neither thou nor thy fathers have known;", "tj": "אֲרוּם יִסְטֵי יָתָךְ אָחוּךְ בְּרָא דְאִמָךְ אוֹ בְּרָךְ אוֹ בְּרַתָּךְ אוֹ אִתְּתָא דְדַמְכָא עִמָּךְ:", "tj_en": "When thy brother, the son of thy mother, thy son, thy daughter, or the wife who reposeth with thee, shall turn thee away.", "rashi": "<b>כי יסיתך.<\/b> אֵין הֲסָתָה אֶלָּא גֵּרוּי, שֶׁנֶּאֱמַר (ש\"מ כ\"ו) אִם ה' הֱסִיתְךָ בִּי, אנסיטר\"א בְּלַעַז, שֶׁמַּשִּׂיאוֹ לַעֲשׂוֹת כֵּן:<br><br><b>אחיך.<\/b> מֵאָב:<br><br>אוֹ <b>בן אמך.<\/b> מֵאֵם:<br><br><b>חיקך.<\/b> הַשּׁוֹכֶבֶת בְּחֵיקְךָ וּמְחֻקָּה בְּךָ, אפקיי\"דא בְּלַעַז, וְכֵן (יחזקאל מ\"ג), \"וּמֵחֵיק הָאָרֶץ\" – מִיסוֹד הַתָּקוּעַ בָּאָרֶץ:<br><br><b>אשר כנפשך.<\/b> זֶה אָבִיךָ, פֵּרֵשׁ לְךָ הַכָּתוּב אֶת הַחֲבִיבִין לְךָ, קַ\"וָ לַאֲחֵרִים:<br><br><b>בסתר.<\/b> דִּבֵּר הַכָּתוּב בַּהוֹוֶה, שֶׁאֵין דִּבְרֵי מֵסִית אֶלָּא בַּסֵּתֶר, וְכֵן שְׁלֹמֹה הוּא אוֹמֵר (משלי ז') \"בְּנֶשֶׁף בְּעֶרֶב יוֹם בְּאִישׁוֹן לַיְלָה וַאֲפֵלָה\":<br><br><b>אשר לא ידעת אתה ואבתיך.<\/b> דָּבָר זֶה גְּנַאי גָּדוֹל הוּא לְךָ – שֶׁאַף הָאֻמּוֹת אֵין מַנִּיחִין מַה שֶּׁמָּסְרוּ לָהֶם אֲבוֹתֵיהֶם, וְזֶה אוֹמֵר לְךָ עֲזֹב מַה שֶּׁמָּסְרוּ לְךָ אֲבוֹתֶיךָ (ספרי):", "rashi_en": "כי יסיתך IF [THY BROTHER …] ENTICE THEE — The term יסת always denotes to “stir up”, “to incite”, as it is said, (I Samuel 26:19) ”If it be the Lord that hath stirred thee up (הסיתך) against me” (Sifrei Devarim 87:2); inciter in O. F., Engl, to incite — i.e. that he induces one to act thus.<br><br>אחיך THY BROTHER — means, thy brother on the father’s side (Sifrei Devarim 87:4).<br><br>בן אמך THE SON OF THY MOTHER — i.e., thy brother on the mother’s side. (The meaning of the Hebrew words is: thy brother or the son of thy mother) (Sifrei Devarim 87:5).<br><br>חיקך [OR THE WIFE OF] THY BOSOM — i.e. who lies on thy bosom and is attached (מחוקה) to you, affichee in O. F. Similar is the expression (Ezekiel 43:14) “and from the bottom (מחיק) upon the ground” — i.e. from the foundation that is sunk in the ground.<br><br>אשר כנפשך [OR THY FELLOWMAN] WHO IS AS THINE OWN SOUL — Thus refers to thy father (Sifrei Devarim 87:11). Scripture specially mentions all those who are dear to you — that you must not consent unto them nor spare them (v. 9), how much the less should you consent unto others or spare them.<br><br>בסתר [IF THY BROTHER ENTICE THEE] SECRETLY — Scripture speaks of what usually occurs (but does not intend to exclude one who entices people publicly), for usually the words of the enticer are spoken in secret. Similarly does Solomon say of the strange woman that she practises her art of seduction (Proverbs 7:9) “In the twilight, in the evening of the day, in the blackness of night and the darkness” (Sifrei Devarim 87:12).<br><br>אשר לא ידעת אתה ואבתיך [LET US GO AND SERVE OTHER GODS] WHICH THOU HAST NOT KNOWN, THOU, NOR THY FATHERS — This would be a great disgrace for you: for not even the heathen nations abandon that which their fathers have handed down to them, and this man says to you, “Abandon what thy fathers have handed down to you”! (Sifrei Devarim 87:13)."}, {"ch": 13, "v": 8, "aliyah": 3, "heb": "מֵאֱלֹהֵ֣י הָֽעַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵיכֶ֔ם הַקְּרֹבִ֣ים אֵלֶ֔יךָ א֖וֹ הָרְחֹקִ֣ים מִמֶּ֑ךָּ מִקְצֵ֥ה הָאָ֖רֶץ וְעַד־קְצֵ֥ה הָאָֽרֶץ׃", "onk": "<b>מִטַּעֲוַת<\/b> עַמְמַיָּא דִּי בְסַחֲרָנֵיכוֹן דִּקְרִיבִין לָךְ אוֹ דִּרְחִיקִין מִנָּךְ מִסְּיָפֵי אַרְעָא וְעַד סְיָפֵי אַרְעָא:", "onk_en": "From the gods [<b>idols<\/b>] of the nations that surround you, who are near you or at a distance from you, from the ends of the earth to the ends of the earth,", "pj": "מִטַּעֲוַות שִׁבְעָתֵי עַמְמַיָא דִּבְחוֹזְרָנוּתְכוֹן דְּקָרִיבִין לְכוֹן אוֹ מִן שְׁאַר עַמְמַיָא דִרְחִיקִין לְכוֹן מִן סְיָיפֵי אַרְעָא וְעַד סְיָיפֵי אַרְעָא", "pj_en": "or the idols of the seven nations who are near you round about, or of the rest of the nations who are far away from you, from one end of the earth to the other;", "tj": "", "tj_en": "", "rashi": "<b>הקרבים אליך או הרחקים.<\/b> לָמָּה פֵּרֵט קְרוֹבִים וּרְחוֹקִים? אֶלָּא כָּךְ אָמַר הַכָּתוּב: מִטִּיבָן שֶׁל קְרוֹבִים אַתָּה לָמֵד טִיבָן שֶׁל רְחוֹקִים, כְּשֵׁם שֶׁאֵין מַמָּשׁ בַּקְּרוֹבִים, כָּךְ אֵין מַמָּשׁ בָּרְחוֹקִים (סנהדרין ס\"א):<br><br><b>מקצה הארץ.<\/b> זוֹ חַמָּה וּלְבָנָה וּצְבָא הַשָּׁמַיִם שֶׁהֵן מְהַלְּכִין מִסּוֹף הָעוֹלָם וְעַד סוֹפוֹ (ספרי):", "rashi_en": "הקרבים אליך או הרחקים [LET US GO AND SERVE OTHER GODS … NAMELY, OF THE GODS] WHICH ARE NIGH UNTO THEE, OR FAR OFF [FROM THEE] — To what end does it (Scripture) mention the gods of the near nations and those of the far-off ones? But this is in effect what Scripture says: From your knowledge of the gods of the near nations, you may draw conclusions regarding the nature of the gods of those far-off; just as there is nothing real in those of the near ones so there is nothing real in those of the far-off ones (Sanhedrin 61b; Sifrei Devarim 88:1).<br><br>מקצה הארץ [GODS … FAR OFF FROM THEE] FROM THE ONE END OF THE EARTH [EVEN UNTO THE OTHER END OF THE EARTH] — This refers to the sun, the moon and the host of heaven (the stars) who move from one end of the world to the other (Sifrei Devarim 88:2)."}, {"ch": 13, "v": 9, "aliyah": 3, "heb": "לֹא־תֹאבֶ֣ה ל֔וֹ וְלֹ֥א תִשְׁמַ֖ע אֵלָ֑יו וְלֹא־תָח֤וֹס עֵֽינְךָ֙ עָלָ֔יו וְלֹֽא־תַחְמֹ֥ל וְלֹֽא־תְכַסֶּ֖ה עָלָֽיו׃", "onk": "לָא תֵיבֵי לֵיהּ וְלָא <b>תְקַבֵּל<\/b> מִנֵּיהּ וְלָא תְחוּס עֵינָךְ עֲלוֹהִי וְלָא תְרַחַם וְלָא תְכַסֵּי עֲלוֹהִי:", "onk_en": "Do not be favorbly inclined towards him, and do not listen to [<b>accept from<\/b>] him; and do not view him compassionately, and do not take pity and do not cover for him.", "pj": "לָא תִיצְבוּן לְהוֹן וְלָא תְקַבְּלוּן מִנֵּיהּ וְלָא תֵיחוֹס עֵינֵיכוֹן עֲלוֹי וְלָא תְרַחֲמוּן וְלָא תְכַסּוּן בְּטוּמְרָא עֲלוֹי", "pj_en": "you shall not consent to them, nor hearken to him, neither shall your eye spare him or have compassion, nor shall you hide him in secret;", "tj": "", "tj_en": "", "rashi": "<b>לא תאבה לו.<\/b> לֹא תְהֵא תָאֵב לוֹ, לֹא תֶּאֱהָבֶנּוּ, לְפִי שֶׁנֶּאֱמַר (ויקרא י\"ט) וְאָהַבְתָּ לְרֵעֲךָ כָּמוֹךָ – אֶת זֶה לֹא תֶאֱהַב:<br><br><b>ולא תשמע אליו.<\/b> בְּהִתְחַנְּנוֹ עַל נַפְשׁוֹ לִמְחֹל לוֹ, לְפִי שֶׁנֶּאֱמַר (שמות כ\"ג) עָזֹב תַּעֲזֹב עִמּוֹ – לָזֶה לֹא תַעֲזֹב:<br><br><b>ולא תחוס עינך עליו.<\/b> לְפִי שֶׁנֶּאֱמַר (ויקרא י\"ט) לֹא תַעֲמֹד עַל דַּם רֵעֶךָ – עַל זֶה לֹא תָחֹס:<br><br><b>ולא תחמל.<\/b> לֹא תַהֲפֹךְ בִּזְכוּתוֹ:<br><br><b>ולא תכסה עליו.<\/b> אִם אַתָּה יוֹדֵעַ לוֹ חוֹבָה אֵינְךָ רַשַּׁאי לִשְׁתֹּק (ספרי):", "rashi_en": "לא תאבה לו THOU SHALT NOT CONSENT UNTO HIM — i.e. thou shalt feel no longing (תאב) towards him, thou shalt show no affection for him (אהב); This is stated because it is said, (Leviticus 19:18) “Thou shalt love thy fellowman as thyself”; this man, however, thou shalt not love (Sifrei Devarim 89:1). <br><br>ולא תשמע אליו AND THOU SHALT NOT HEARKEN UNTO HIM when he makes entreaty for his life, that you should forgive him. This is stated because it says. (Exodus 23:5) “[If thou see the ass of him that hateth thee] thou shalt surely help him”; this man, however, thou shalt not help (Sifrei Devarim 89:2).<br><br>ולא תחוס עינך עליו NEITHER SHALL THINE EYE SPARE HIM — This is stated because it says, (Leviticus 19:16) “thou shalt not stand against the blood of thy fellow” — this man, however, thou shalt not spare (Sifrei Devarim 89:3).<br><br>ולא תחמל NEITHER SHALT THOU PITY [HIM] — i.e. thou shalt not occupy thyself in his favour (you shall not seek to find anything favorable to him) (Sifrei Devarim 89:4).<br><br>ולא תכסה עליו AND THOU SHALT NOT CONCEAL (COVER OVER) HIM — If you know anything about him that will condemn him, you are not allowed to keep silent (Sifrei Devarim 89:5)."}, {"ch": 13, "v": 10, "aliyah": 3, "heb": "כִּ֤י הָרֹג֙ תַּֽהַרְגֶ֔נּוּ יָ֥דְךָ֛ תִּֽהְיֶה־בּ֥וֹ בָרִֽאשׁוֹנָ֖ה לַהֲמִית֑וֹ וְיַ֥ד כׇּל־הָעָ֖ם בָּאַחֲרֹנָֽה׃", "onk": "אֲרֵי מִקְטַל תִּקְטְלִנֵּיהּ יְדָךְ תְּהֵי בֵיהּ בְּקַדְמֵיתָא לְמִקְטְלֵיהּ וִידָא דְכָל עַמָּא בְּבַתְרֵיתָא:", "onk_en": "For you must surely execute him. Let your hand strike him first to execute him, and the hand of the entire people afterward.", "pj": "אֲרוּם מִקְטַל תִּקְטְלִינֵיהּ יְדֵיכוֹן יְתוּשְׁטַן בֵּיהּ בְּשֵׁירוּיָא לְמִקְטְלֵיהּ וִידֵיהוֹן דְּכָל עַמָּא בְּסוֹפָא", "pj_en": "but killing you shall kill him; your hand shall be the first upon him to slay him, and afterwards the hand of all the people;", "tj": "", "tj_en": "", "rashi": "<b>כי הרג תהרגנו.<\/b> אִם יָצָא מִבֵּ\"דִּ זַכַּאי הַחֲזִירֵהוּ לְחוֹבָה, יָצָא מִבֵּית דִּין חַיָּב אַל תַּחֲזִירֵהוּ לִזְכוּת (שם):<br><br><b>ידך תהיה בו בראשונה.<\/b> מִצְוָה בְּיַד הַנִּסָּת לַהֲמִיתוֹ. לֹא מֵת בְּיָדוֹ, יָמוּת בְּיַד אֲחֵרִים, שֶׁנֶּאֱמַר <b>ויד כל העם וגו'<\/b> (עי' ספרי):", "rashi_en": "כי הרג תהרגנו BUT THOU SHALT SURELY KILL HIM — and if he has left the court after having been acquitted have him brought back for condemnation if you know anything against him; if, on the other hand, he has left the court after being found guilty do not bring him back to plead in his favour (Sifrei Devarim 89:6-7).<br><br>ידך תהיה בו בראשונה THINE HAND SHALL BE FIRST UPON HIM [TO PUT HIM TO DEATH] — He who was to be seduced to idolatry has the duty to put him to death; if he did not die by his hand he must die by the hands of others, as it goes on to state “and afterwards the hands of all the people” (cf. Sifrei Devarim 89:8)."}, {"ch": 13, "v": 11, "aliyah": 3, "heb": "וּסְקַלְתּ֥וֹ בָאֲבָנִ֖ים וָמֵ֑ת כִּ֣י בִקֵּ֗שׁ לְהַדִּֽיחֲךָ֙ מֵעַל֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ הַמּוֹצִיאֲךָ֛ מֵאֶ֥רֶץ מִצְרַ֖יִם מִבֵּ֥ית עֲבָדִֽים׃", "onk": "וְתִרְגְּמִנֵּיהּ בְּאַבְנַיָּא וִימוּת אֲרֵי בָעָא לְאַטְעֲיוּתָךְ <b>מִדַּחַלְתָּא<\/b> דַיְיָ אֱלָהָךְ דִּי אַפְּקָךְ מֵאַרְעָא דְמִצְרַיִם מִבֵּית עַבְדוּתָא:", "onk_en": "And you are to stone him with stones so that he dies, for he sought to mislead you from [<b>the fear of<\/b>] Adonoy, your God, Who took you out of the land of Egypt, from the house of slavery.", "pj": "וּתְאַטְלוּן יָתֵיהּ בְּאַבְנָא וִימוּת אֲרוּם בְּעָא לְאַטְעֲיוּתְכוֹן מִדְּחַלְתָּא דַיְיָ אֱלָהָךְ דְּאַפֵּיק יַתְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם מִבֵּית שִׁעֲבּוּד עַבְדַיָא", "pj_en": "and you shall stone him that he die; because he sought to draw them away from the fear of the Lord thy God, who brought you out free from the land of Mizraim, from the house of the affliction of slaves.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 12, "aliyah": 3, "heb": "וְכׇ֨ל־יִשְׂרָאֵ֔ל יִשְׁמְע֖וּ וְיִֽרָא֑וּן וְלֹֽא־יוֹסִ֣פוּ לַעֲשׂ֗וֹת כַּדָּבָ֥ר הָרָ֛ע הַזֶּ֖ה בְּקִרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְכָל יִשְׂרָאֵל יִשְׁמְעוּן וְיִדְחֲלוּן וְלָא יוֹסְפוּן לְמֶעְבַּד כְּפִתְגָּמָא בִישָׁא הָדֵין בֵּינָךְ:", "onk_en": "And all of Yisroel will hear and will fear, and they will not proceed to do so evil a thing as this, within you.", "pj": "וְכָל יִשְרָאֵל יִשְׁמְעוּן וִידַחֲלוּן וְלָא יוֹסְפוּן לְמֶעֱבַד כְּפִתְגָמָא בִּישָׁא הָדֵין בֵּינֵיכוֹן", "pj_en": "And all Israel will hear and be afraid, and never more do according to that evil thing among you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 13, "aliyah": 3, "heb": "כִּֽי־תִשְׁמַ֞ע בְּאַחַ֣ת עָרֶ֗יךָ אֲשֶׁר֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ נֹתֵ֥ן לְךָ֛ לָשֶׁ֥בֶת שָׁ֖ם לֵאמֹֽר׃", "onk": "אֲרֵי תִשְׁמַע בְּחַד מִקִּרְוָיךְ דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ לְמִתַּב תַּמָּן לְמֵימָר:", "onk_en": "If you hear in one of your cities that Adonoy, your God, is giving you in which to settle, the following:", "pj": "אֲרוּם תִּשְׁמְעוּן בַּחֲדָא מִן קִרְוֵיכוֹן דַּיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן לְמֵיתַב תַּמָּן לְמֵימָר", "pj_en": "When, in one of your cities which the Lord your God will give you to dwell in, you hear it said", "tj": "", "tj_en": "", "rashi": "<b>לשבת שם.<\/b> פְּרָט לִירוּשָׁלַיִם שֶׁלֹּא נִתְּנָה לְדִירָה (שם):<br><br><b>כי תשמע, לאמר.<\/b> אוֹמְרִים כֵּן יָצְאוּ וְגוֹ' –", "rashi_en": "לשבת שם [IF THOU SHALT HEAR SAY IN THE CITIES WHICH THE LORD THY GOD HATH GIVEN THEE] TO ABIDE THERE — The words “to abide there” are added to exclude Jerusalem which city was not intended as a dwelling-place (Sifrei Devarim 92:5; cf. Bava Kamma 82b).<br><br>כי תשמע לאמור IF THOU SHALT HEAR … SAYING means, if thou shalt hear people saying thus: “[Certain men, worthless persons,] have gone out” etc."}, {"ch": 13, "v": 14, "aliyah": 3, "heb": "יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי־בְלִיַּ֙עַל֙ מִקִּרְבֶּ֔ךָ וַיַּדִּ֛יחוּ אֶת־יֹשְׁבֵ֥י עִירָ֖ם לֵאמֹ֑ר נֵלְכָ֗ה וְנַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא־יְדַעְתֶּֽם׃", "onk": "נְפָקוּ גֻּבְרִין <b>בְּנֵי רִשְׁעָא<\/b> מִבֵּינָךְ וְאַטְעָיוּ יָת יָתְבֵי קַרְתְּהוֹן לְמֵימָר נְהַךְ וְנִפְלַח <b>לְטַעֲוַת עַמְמַיָּא<\/b> דִּי לָא יְדַעְתּוּן:", "onk_en": "‘‘Men have gone out—unscrupulous [<b>evil<\/b>]—from among you, and they have misled the inhabitants of their city by saying, ‘Let us go and serve other gods [<b>idols of other nations<\/b>]’ that you do not know.’’", "pj": "נְפָקוּ גּוּבְרִין זְדָנִין מֵאוּלְפָנָא דַיְיָ אֱלָהָכוֹן דְּחַכִּימַיָא דְּבֵינֵיכוֹן וְאַטְעִין יַת יַתְבֵי קַרְתֵּיהוֹן לְמֵימָר נְהַךְ וְנִפְלַח לְטַעֲוַות עַמְמַיָא דְלָא חַכִּימְתּוּן", "pj_en": "that (certain) men of pride are drawing back from the doctrine of the Lord your God, or that even sages of your rabbins have gone forth and led away the inhabitants of their city, saying, Let us go and worship the gods of the nations which you have not known:", "tj": "", "tj_en": "", "rashi": "<b>אנשים.<\/b> וְלֹא נָשִׁים:<br><br><b>בני בליעל.<\/b> בְּלִי עֹל, שֶׁפָּרְקוּ עֻלּוֹ שֶׁל מָקוֹם (שם):<br><br><b>ישבי עירם.<\/b> וְלֹא יוֹשְׁבֵי עִיר אַחֶרֶת, מִכָּאן אָמְרוּ אֵין נַעֲשֵׂית עִיר הַנִּדַּחַת עַד שֶׁיַּדִּיחוּהָ אֲנָשִׁים וְעַד שֶׁיִּהְיוּ מַדִּיחֶיהָ מִתּוֹכָהּ (סנהדרין קי\"א):", "rashi_en": "אנשים CERTAIN MEN — but not women (Sifrei Devarim 93:1).<br><br>בני בליעל. WORTHLESS PERSONS — people that have thrown off the yoke of the Omnipresent (the word is taken in the sense of בְּלִי עוֹל, without a yoke) (Sifrei Devarim 93:2).<br><br>ישבי עירם THE INHABITANTS OF THEIR CITY — but not the inhabitants of another city (Sifrei Devarim 93:4). From here they (our Rabbis) derived what they said, “A town is not treated as an עיר הנדחת (i.e. does not come under the category of a “condemned city” which according to vv. 16—17 must be utterly destroyed) unless it be men who lead them (the inhabitants) astray, and unless its seducers be of its midst (inhabitants of that city) (Sanhedrin 111b)."}, {"ch": 13, "v": 15, "aliyah": 3, "heb": "וְדָרַשְׁתָּ֧ וְחָקַרְתָּ֛ וְשָׁאַלְתָּ֖ הֵיטֵ֑ב וְהִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַדָּבָ֔ר נֶעֶשְׂתָ֛ה הַתּוֹעֵבָ֥ה הַזֹּ֖את בְּקִרְבֶּֽךָ׃", "onk": "וְתִתְבַּע וְתִבְדּוֹק וְתִשְׁאַל יָאוּת וְהָא קֻשְׁטָא כֵּוָן פִּתְגָּמָא אִתְעֲבִידָא תּוֹעֶבְתָּא הָדָא בֵּינָךְ:", "onk_en": "You must investigate, inquire, and interrogate thoroughly; and if in fact the report is true and accurate—this abomination was committed among you.", "pj": "וְתִתְבְּעוּן וְתִבְדְּקוּן יַת סַהֲדַיָיא וּתְשַׁיְילוּן טַבָּאוּת וְהָא קוּשְׁטָא כֵּיוַון פִּתְגָמָא אִתְעֲבִידַת תּוֹעֵבְתָּא הָדָא בֵּינֵיכוֹן", "pj_en": "then search you out, and examine with witnesses, and make good inquiry; and, behold, if the thing be true and certain that this abomination hath been really done among you,", "tj": "", "tj_en": "", "rashi": "<b>ודרשת וחקרת ושאלת היטב.<\/b> מִכָּאן לָמְדוּ שֶׁבַע חֲקִירוֹת מֵרִבּוּי הַמִּקְרָא, כָּאן יֵשׁ ג' – דְּרִישָׁה וַחֲקִירָה וְהֵיטֵב, וְשָׁאַלְתָּ אֵינוֹ מִן הַמִּנְיָן, וּמִמֶּנּוּ לָמְדוּ בְּדִיקוֹת – וּבְמָקוֹם אַחֵר הוּא אוֹמֵר (דברים י\"ט) \"וְדָרְשׁוּ הַשּׁוֹפְטִים הֵיטֵב\", וְעוֹד בְּמָקוֹם אַחֵר הוּא אוֹמֵר (שם י\"ז) \"וְדָרַשְׁתָּ הֵיטֵב\", לָמְדוּ 'הֵיטֵב' 'הֵיטֵב' לִגְזֵרָה שָׁוָה, לִתֵּן הָאָמוּר שֶׁל זֶה בָּזֶה (סנהדרין מ'):", "rashi_en": "ודרשת וחקרת ושאלת היטב THEN SHALT THOU INQUIRE, AND MAKE SEARCH, AND ASK DILIGENTLY — From here — from the variety of expressions denoting inquiry in this verse — they (the Rabbis) derived the law of investigating capital cases by means of seven investigations” (referring to date, time and place). in the following manner: here (in our verse) there occur three expressions relating to inquiry, viz., ודרשת, וחקרת and היטב — the expression ושאלת does not come into account, because from it they derived בדיקות, the examination referring to accompanying circumstances, — and in another passage (Deuteronomy 19:18) it states, “and the judges shall enquire diligently (ודרשו השופטים היטב)”, and still in another passage (Deuteronomy 17:40) it states, “and thou shalt inquire diligently (ודרשת היטב)\" — thus altogether seven expressions. — And although they are used in connection with different cases they learned by way of analogy (ג\"ש) of the term היטב used here and in the passages quoted that it is intended to apply what is stated in one case to the others also (Sanhedrin 40a; cf. Sifrei Devarim 93:6)."}, {"ch": 13, "v": 16, "aliyah": 3, "heb": "הַכֵּ֣ה תַכֶּ֗ה אֶת־יֹ֥שְׁבֵ֛י הָעִ֥יר <span class=\"mam-kq-trivial\">הַהִ֖וא<\/span> לְפִי־חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧הּ וְאֶת־כׇּל־אֲשֶׁר־בָּ֛הּ וְאֶת־בְּהֶמְתָּ֖הּ לְפִי־חָֽרֶב׃", "onk": "מִמְחָא תִמְחֵי יָת יָתְבֵי קַרְתָּא הַהִיא לְפִתְגַּם דְּחָרֶב גַּמַּר יָתַהּ וְיָת כָּל דִּי בַהּ וְיָת בְּעִירַהּ לְפִתְגַּם דְּחָרֶב:", "onk_en": "You must surely strike down the inhabitants of that city by the sword; annihilate it and everything that is in it, and its livestock by the sword.", "pj": "מִמְחָא תִּמְחוּן יַת יַתְבֵי קַרְתָּא הַהוּא לְפִתְגַם דְּחָרֶב גַּמְרָא יָתָהּ וְיַת כָּל דְּבָהּ וְיַת בְּעִירָהּ לְפִתְגַּם דְּחָרֶב", "pj_en": "you shall smite the inhabitants of that city with the edge of the sword, to destroy it utterly and whatever is therein, even its cattle, with the edge of the sword.", "tj": "", "tj_en": "", "rashi": "<b>הכה תכה.<\/b> אִם אֵינְךָ יָכוֹל לַהֲמִיתָם בַּמִּיתָה הַכְּתוּבָה בָּהֶם, הֲמִיתֵם בְּאַחֶרֶת (ספרי; בבא מציעא ל\"א):", "rashi_en": "הכה תכה THOU SHALT SURELY SMITE [THE INHABITANTS OF THAT CITY] — If you cannot put them to death by the death-penalty prescribed regarding them, kill them in some other way (Sifrei Devarim 94:1; Bava Metzia 31b; cf. Rashi on v. 10)."}, {"ch": 13, "v": 17, "aliyah": 3, "heb": "וְאֶת־כׇּל־שְׁלָלָ֗הּ תִּקְבֹּץ֮ אֶל־תּ֣וֹךְ רְחֹבָהּ֒ וְשָׂרַפְתָּ֨ בָאֵ֜שׁ אֶת־הָעִ֤יר וְאֶת־כׇּל־שְׁלָלָהּ֙ כָּלִ֔יל לַיהֹוָ֖ה אֱלֹהֶ֑יךָ וְהָיְתָה֙ תֵּ֣ל עוֹלָ֔ם לֹ֥א תִבָּנֶ֖ה עֽוֹד׃", "onk": "וְיָת כָּל עֲדָאַהּ תִּכְנוֹשׁ לְגוֹ פְתָיַּהּ וְתוֹקֵד בְּנוּרָא יָת קַרְתָּא וְיָת כָּל עֲדָאַהּ גְּמִיר <b>קֳדָם<\/b> יְיָ אֱלָהָךְ וּתְהֵי תֵּל חָרִיב לְעָלָם לָא תִתְבְּנֵי עוֹד:", "onk_en": "And all its booty are you to collect within its plaza, and you are to burn in fire the city and all its booty—totally—for [<b>before<\/b>] Adonoy, your God; and it will be a ruin forever, it is never to be rebuilt.", "pj": "וְיַת כָּל עֲדָאָה תִּכְנְשׁוּן בִּמְצַע פַּלְטִיתָא וְתוּקְדוּן בְּנוּרָא יַת קַרְתָּא וְיַת כָּל עֲדָאָה גְמִיר קֳדָם יְיָ אֱלָהָכוֹן וּתְהֵי תֵּל חָרוֹב לְעַלָם לָא תִתְבְּנֵי תוּב", "pj_en": "You shall gather all its spoil into the midst of the street, and burn the city with fire, together with the whole of the spoil, before the Lord your God; and it shall be a desolate heap for ever, never to be builded again:", "tj": "", "tj_en": "", "rashi": "<b>לה' אלהיך.<\/b> לִשְׁמוֹ וּבִשְׁבִילוֹ:", "rashi_en": "לה' אלהיך [AND THOU SHALT BURN WITH FIRE THE CITY …] FOR THE LORD THY GOD — i.e. for the honor of His name and for His sake."}, {"ch": 13, "v": 18, "aliyah": 3, "heb": "וְלֹֽא־יִדְבַּ֧ק בְּיָדְךָ֛ מְא֖וּמָה מִן־הַחֵ֑רֶם לְמַ֩עַן֩ יָשׁ֨וּב יְהֹוָ֜ה מֵחֲר֣וֹן אַפּ֗וֹ וְנָֽתַן־לְךָ֤ רַחֲמִים֙ וְרִֽחַמְךָ֣ וְהִרְבֶּ֔ךָ כַּאֲשֶׁ֥ר נִשְׁבַּ֖ע לַאֲבֹתֶֽיךָ׃", "onk": "וְלָא יִדְבַּק בִּידָךְ מִדַּעַם מִן חֶרְמָא בְּדִיל דִּיתוּב יְיָ מִתְּקוֹף רוּגְזֵיהּ וְיֵהַב לָךְ רַחֲמִין וִירַחַם עֲלָךְ וְיַסְגִּנָּךְ כְּמָא דִי קַיִּים לַאֲבָהָתָךְ:", "onk_en": "Let nothing of the <i>cherem<\/i> cling to your hand; so that Adonoy withdraws His raising fury and grant you mercy, and He will be merciful toward you and multiply you as He swore to your forefathers", "pj": "וְלָא אִידְבֵּיק בְּיֶדְכוֹן מִדַּעַם מִן שַׁמְתָּא מִן בִּגְלַל דְּיֵיתוּב יְיָ מִתְקֵיף רוּגְזֵיהּ וְיִכְמוֹר עֲלֵיכוֹן רַחֲמִין וִירַחֵם עֲלֵיכוֹן וְיַסְגִינְכוֹן הֵיכְמָא דְקַיֵּים לְאַבְהַתְכוֹן", "pj_en": "that the Lord may be turned from the fierceness of His anger, and may show His mercy upon you, and love you, and multiply you, as He hath sworn to your fathers.", "tj": "", "tj_en": "", "rashi": "<b>למען ישוב ה' מחרון אפו.<\/b> שֶׁכָּל זְמַן שֶׁעֲ\"זָ בָעוֹלָם חֲרוֹן אַף בָּעוֹלָם (ספרי):", "rashi_en": "למען ישוב ה' מחרון אף THAT THE LORD MAY TURN FROM THE FIERCENESS OF HIS WRATH — for as long as idol-worship exists in the world the fierce wrath of God is kindled against the world (Sifrei Devarim 96:3; Sanhedrin 111b; cf. Rashi on Genesis 9:32)."}, {"ch": 13, "v": 19, "aliyah": 3, "heb": "כִּ֣י תִשְׁמַ֗ע בְּקוֹל֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לִשְׁמֹר֙ אֶת־כׇּל־מִצְוֺתָ֔יו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּ֑וֹם לַעֲשׂוֹת֙ הַיָּשָׁ֔ר בְּעֵינֵ֖י יְהֹוָ֥ה אֱלֹהֶֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי <b>תְקַבֵּל לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ לְמִטַּר יָת כָּל פִּקּוֹדוֹהִי דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין לְמֶעְבַּד <b>דְּכָשָׁר קֳדָם<\/b> יְיָ אֱלָהָךְ:", "onk_en": "When you heed the voice [<b>accept the word<\/b>] of Adonoy, your God, to guard all His commandments that I am commanding you today, to do the upright [<b>proper before<\/b>] in the eyes of Adonoy, your God.", "pj": "אֲרוּם תְּקַבְּלוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן לְמִנְטוֹר יַת כָּל פִּיקוּדוֹי דַאֲנָא מְפַקֵּיד לְכוֹן יוֹמָא דֵין לְמֶעֱבַד דְּכָשַׁר קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "So be ye obedient to the Word of the Lord your God, to keep all His commandments which I command you this day, that you may do what is right before the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 1, "aliyah": 4, "heb": "בָּנִ֣ים אַתֶּ֔ם לַיהֹוָ֖ה אֱלֹהֵיכֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְלֹֽא־תָשִׂ֧ימוּ קׇרְחָ֛ה בֵּ֥ין עֵינֵיכֶ֖ם לָמֵֽת׃", "onk": "בְּנִין אַתּוּן <b>קֳדָם<\/b> יְיָ אֱלָהֲכוֹן לָא תִתְחַמְמוּן וְלָא תְשַׁוּוּן מְרָט בֵּין עֵינֵיכוֹן עַל מִית:", "onk_en": "You are sons to [<b>before<\/b>] Adonoy, your God; do not lacerate yourselves and do not make yourselves bald between your eyes for a dead person.", "pj": "הֵי כִבְנִין חֲבִיבִין אַתּוּן קֳדָם יְיָ אֱלָהָכוֹן לָא תְגוּדוּן בִּישְרֵיכוֹן וְלָא תְשׁוּרַן כְּלִיל דִּיסְעַר עַל בֵּית אַפֵּיכוֹן עַל נְפַשׁ דְּמִית", "pj_en": "As beloved children before the Lord your God, you shall not make lacerations in your flesh, nor make bare the crown of the hair over your foreheads on account of the soul of the dead.", "tj": "בְּנִין חֲבִיבִין אַתּוּן קֳדָם יְיָ אֱלָהָכוֹן לָא תַעַבְדוּן חֲבוּרִין חֲבוּרִין לְפוּלְחָנָא נוּכְרֵיתָא וְלָא תְשַׁווּן קַרְחָא עַל בֵּית אַפֵּיכוֹן לִטְמֵי נַפְשָׁא דְמִית:", "tj_en": "You are beloved children before the Lord your God; you shall not make divers wounds for strange worship, nor cause baldness above your forehead to mourn for a person who is dead.", "rashi": "<b>לא תתגדדו.<\/b> לֹא תִתְּנוּ גְדִידָה וְשֶׂרֶט בִּבְשַׂרְכֶם עַל מֵת כְּדֶרֶךְ שֶׁהָאֱמוֹרִיִּים עוֹשִׂין, לְפִי שֶׁאַתֶּם בָּנָיו שֶׁל מָקוֹם וְאַתֶּם רְאוּיִין לִהְיוֹת נָאִים וְלֹא גְּדוּדִים וּמְקֹרָחִים:<br><br><b>בין עיניכם.<\/b> אֵצֶל הַפַּדַּחַת, וּבְמָקוֹם אַחֵר הוּא אוֹמֵר (ויקרא כ\"א) לֹא יִקְרְחֻה בְּרֹאשָׁם – לַעֲשׂוֹת כָּל הָרֹאשׁ כְּבֵין הָעֵינַיִם (ספרי):", "rashi_en": "לא תתגדדו YE SHALL NOT CUT YOURSELVES — i.e. you shall not make cuttings and incisions in your flesh for the dead in the way the Amorites do (Sifrei Devarim 96:11), because you are children of the Lord and it is therefore becoming for you to be comely and not cut about and with hair torn out.<br><br>בין עיניכם [NOR MAKE ANY BALDNESS] BETWEEN YOUR EYES — i.e. adjoining the forehead. In another passage (Leviticus 21:5), however, it states, “They shall not make their head bald”! It, however, intends to make the entire head like between the eyes (בֵּין עֵינַיִם) [i.e., one must not make bald spots on any part of the head]. (Sifrei Devarim 96:13; cf. Rashi on Leviticus 21:5 and Note thereon)."}, {"ch": 14, "v": 2, "aliyah": 4, "heb": "כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַיהֹוָ֖ה אֱלֹהֶ֑יךָ וּבְךָ֞ בָּחַ֣ר יְהֹוָ֗ה לִֽהְי֥וֹת לוֹ֙ לְעַ֣ם סְגֻלָּ֔ה מִכֹּל֙ הָֽעַמִּ֔ים אֲשֶׁ֖ר עַל־פְּנֵ֥י הָאֲדָמָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי עַם קַדִּישׁ אַתְּ קֳדָם יְיָ אֱלָהָךְ וּבָךְ אִתִּרְעֵי יְיָ לְמֶהֱוֵי לֵיהּ לְעַם חַבִּיב מִכֹּל עַמְמַיָּא דִּי עַל אַפֵּי אַרְעָא:", "onk_en": "For you are a sacred people to Adonoy, your God, and Adonoy has chosen you to be for Him a treasured people from all the peoples who are on the surface of the earth.", "pj": "אֲרוּם עַם קַדִּישׁ אַתּוּן קֳדָם יְיָ אֱלָהָכוֹן וּבְכוֹן אִיתְרְעֵי יְיָ אֱלָהָכוֹן לְמֶהֱוֵי לֵיהּ לְעָם חָבִיב מִכָּל עַמְמַיָא דְּעַל אַפֵּי אַרְעָא", "pj_en": "For you are to be a holy people before the Lord your God: the Lord your God hath chosen you to be a people more beloved than all the peoples who are upon the face of the earth.", "tj": "", "tj_en": "", "rashi": "<b>כי עם קדוש אתה.<\/b> קְדֻשַּׁת עַצְמְךָ מֵאֲבוֹתֶיךָ, וְעוֹד <b>ובך בחר ה'<\/b>:", "rashi_en": "כי עם קדוש אתה FOR THOU ART AN HOLY PEOPLE — You are holy — your actual holiness comes to you from your fathers, but, in addition, ובך בחר ה׳ THE LORD HAS CHOSEN YOU [so that you are for two reasons bound to keep away from these pagan customs] (cf. Sifrei Devarim 97:1)."}, {"ch": 14, "v": 3, "aliyah": 4, "heb": "לֹ֥א תֹאכַ֖ל כׇּל־תּוֹעֵבָֽה׃", "onk": "לָא תֵיכוּל כָּל דִּמְרָחָק:", "onk_en": "Do not eat any abomination.", "pj": "לָא תֵיכְלוּן כָּל מִדַּעַם דִּרְחֵיקִית מִנְכוֹן", "pj_en": "You may not eat of any thing that for you is abominable.", "tj": "", "tj_en": "", "rashi": "<b>כל תועבה.<\/b> כָּל שֶׁתִּעַבְתִּי לְךָ, כְּגוֹן צָרַם אֹזֶן בְּכוֹר כְּדֵי לְשָׁחֳטוֹ בַמְּדִינָה הֲרֵי דָּבָר שֶׁתִּעַבְתִּי לְךָ, כָּל מוּם לֹא יִהְיֶה בּוֹ, בָּא וְלִמֵּד כָּאן שֶׁלֹּא יִשְׁחַט וְיֹאכַל עַל אוֹתוֹ הַמּוּם. בִּשֵּׁל בָּשָׂר בְּחָלָב הֲרֵי דָּבָר שֶׁתִּעַבְתִּי לְךָ, וְהִזְהִיר כָּאן עַל אֲכִילָתוֹ (חולין קי\"ד):", "rashi_en": "כל תועבה [THOU SHALT NOT EAT] ANY ABOMINATION — i.e. anything that I have declared to be an abomination to you (which in itself may not be an abominable thing) — as for instance if one deliberately makes a slit in the ear of a firstborn animal (thus making it unfit for sacrifice) so that one may slaughter it in the country (i.e. outside Jerusalem) and eat it there. Here you have a thing I declared to be an abomination to you, in that I commanded you (Leviticus 22:21) “one shall cause no blemish to be therein”. Scripture now comes and teaches you here that one should not slaughter such an animal and eat it, on account of that blemish. Another example: If one boils meat in milk — here you have a thing that I have declared to be an abomination to you (cf. Exodus 23:19; Exodus 34:26; Deuteronomy 14:21), and here it lays down the prohibition about eating it (Chullin 114b)."}, {"ch": 14, "v": 4, "aliyah": 4, "heb": "זֹ֥את הַבְּהֵמָ֖ה אֲשֶׁ֣ר תֹּאכֵ֑לוּ שׁ֕וֹר שֵׂ֥ה כְשָׂבִ֖ים וְשֵׂ֥ה עִזִּֽים׃", "onk": "דֵּין בְּעִירָא דְּתֵיכְלוּן תּוֹרִין אִמְּרִין דִּרְחֵלִין וְגָדְיָן דְּעִזִּין:", "onk_en": "These are the animals that you are to eat: the bovine, the sheep and the goat;", "pj": "דָּא הִיא בְּעִירָא דְתֵיכְלוּן תּוֹרִין וְאִימְרֵי בְּנֵי רְחֵילִין וְלָא בְּנֵי מְסָאֲבִין וְגַדְיֵי בְּנֵי עִיזִין וְלָא עֵירוּבֵי טַמְיָין", "pj_en": "These are the animals which you may eat: oxen, and lambs of the ewes, such as are not blemished (unclean), and kids of the goats unmixed with what are unclean.", "tj": "", "tj_en": "", "rashi": "<b>זאת הבהמה, איל וצבי ויחמור.<\/b> לָמַדְנוּ שֶׁהַחַיָּה בִכְלַל בְּהֵמָה, וְלָמַדְנוּ שֶׁהַבְּהֵמָה וְחַיָּה טְמֵאָה מְרֻבָּה מִן הַטְּהוֹרָה, שֶׁבְּכָל מָקוֹם פּוֹרֵט אֶת הַמֻּעָט (ספרי; חולין י\"ג):", "rashi_en": "זאת הבהמה … איל וצבי ויחמור THESE ARE THE BEASTS [WHICH YOU MAY EAT] THE HART AND THE GAZELLE AND THE FALLOW DEER — This (the fact that Scripture begins with זאת הבהמה and goes on to enumerate חיות) teaches us that חיה is included in the term בהמה (Sifrei Devarim 100:1; Chullin 71a; cf. Rashi on Leviticus 11:2, last sentence, and Note thereon). It further teaches us that there are more unclean beasts and wild animals than clean ones, for where two contrasted classes are spoken of it always enumerates by name the individuals of the smaller class (Sifrei Devarim 100:3; Chullin 63a.) (Since it enumerates here the clean animals these must be the minority.)"}, {"ch": 14, "v": 5, "aliyah": 4, "heb": "אַיָּ֥ל וּצְבִ֖י וְיַחְמ֑וּר וְאַקּ֥וֹ וְדִישֹׁ֖ן וּתְא֥וֹ וָזָֽמֶר׃", "onk": "אַיָּלָא וְטַבְיָא וְיַחְמוּרָא וְיַעְלָא וְרֵימָא וְתוֹרְבָּלָא וְדִיצָא:", "onk_en": "The gazelle, the deer and the fallow deer; and the ibex and the adax; and the wild ox and the wild sheep.", "pj": "אַיְלִין וְטַבְיַן וְיַחֲמוּרִין יַעֲלִין וְרִימְנִין וְתוֹרֵי בַּר וְדִיצִין", "pj_en": "Harts and antelopes and fallow deer, rock goats and reems, wild oxen and pygargs;", "tj": "", "tj_en": "", "rashi": "<b>ואקו.<\/b> מְתֻרְגָּם יַעֲלָא (איוב ל\"ט) \"יַעֲלֵי סָלַע\", הוּא אשטנב\"וק:<br><br><b>ותאו.<\/b> \"תּוֹרְבָּלָא\", תּוֹר הַיַּעַר, \"בָּלָא\" — יַעַר בִּלְשׁוֹן אֲרַמִּי:", "rashi_en": "ואקו AND THE אקו — This is rendered in the Targum by יעלא, the same term as the Hebrew יעל in the expression יעלי סלע (Job 39:1). This is what is called in German 'Steinbock'.<br><br>ותאו — This is rendered in the Targum by תורבלא which is the same as תור יער, the ox of the forest (wild ox), for בלא means “forest״ in the Aramaic language."}, {"ch": 14, "v": 6, "aliyah": 4, "heb": "וְכׇל־בְּהֵמָ֞ה מַפְרֶ֣סֶת פַּרְסָ֗ה וְשֹׁסַ֤עַת שֶׁ֙סַע֙ שְׁתֵּ֣י פְרָס֔וֹת מַעֲלַ֥ת גֵּרָ֖ה בַּבְּהֵמָ֑ה אֹתָ֖הּ תֹּאכֵֽלוּ׃", "onk": "וְכָל בְּעִירָא דִּסְדִיקָא פַרְסָתָא וּמַטִּלְפָא טִלְפִין תַּרְתֵּין פַּרְסָתָא מַסְּקָא פִשְׁרָא בִּבְעִירָא יָתַהּ תֵּיכְלוּן:", "onk_en": "And every animal whose sole is cloven, whose hoof is truly split in two, regurgitating [its] cud within the animals, it may you eat.", "pj": "וְכָל בְּעִירָא דִסְדִיקָא טַלְפַיָיא וְלָהּ קַרְנִין וּסְדִיק סִדְקָא מַסְקָא פִּישְׁרָא בִּבְעִירָא יָתָהּ תֵּיכְלוּן", "pj_en": "and every animal that hath the divided hoof, and horns, and that cleaveth the cleft, bringing up the cud among animals, that you may eat.", "tj": "מַסְקַן גְּרָרָא בִּבְעִירָא יָתָהּ תֵיכְלוּן:", "tj_en": "Which bringeth up the cud among animals, that may you eat.", "rashi": "<b>מפרסת.<\/b> סְדוּקָה, כְּתַרְגּוּמוֹ:<br><br><b>פרסה.<\/b> פלאנט\"א:<br><br><b>ושסעת.<\/b> חֲלוּקָה בִשְׁתֵּי צִפָּרְנַיִם, שֶׁיֵּשׁ סְדוּקָה וְאֵינָהּ חֲלוּקָה בַּצִּפָּרְנַיִם, וְהִיא טְמֵאָה:<br><br><b>בבהמה.<\/b> מַשְׁמַע מַה שֶּׁנִּמְצָא בַבְּהֵמָה אֱכֹל, מִכָּאן אָמְרוּ שֶׁהַשְּׁלִיל נִתָּר בִּשְׁחִיטַת אִמּוֹ (חולין ס\"ט):", "rashi_en": "מפרסת means split, as the Targum has it.<br><br>פרסה - plante in O. F. (English = hoof).<br><br>ושסעת AND HATH CLOVEN [HOOFS] — i.e. hoofs divided into two nails, for there are animals with hoofs split but not entirely divided into two nails (cf. Rashi on Leviticus 9:3), and such are unclean.<br><br>בבהמה [AND EVERY BEAST THAT PARTETH THE HOOF …] AMONG THE BEASTS [YE MAY EAT] — if one takes בבהמה to signify “within the animal”, it suggests: that which is found in the beast you may eat. From here, therefore, they (the Rabbis) derived the law that a שליל (a fully developed embryo) becomes permitted to be eaten through the slaughter of its mother without requiring ritual slaughtering itself (Chullin 69a; Chullin 74a)."}, {"ch": 14, "v": 7, "aliyah": 4, "heb": "אַ֣ךְ אֶת־זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִמַּֽעֲלֵ֣י הַגֵּרָ֔ה וּמִמַּפְרִיסֵ֥י הַפַּרְסָ֖ה הַשְּׁסוּעָ֑ה אֶֽת־הַ֠גָּמָ֠ל וְאֶת־הָאַרְנֶ֨בֶת וְאֶת־הַשָּׁפָ֜ן כִּֽי־מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּפַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָכֶֽם׃", "onk": "בְּרַם יָת דֵּין לָא תֵיכְלוּן מִמַּסְּקֵי פִשְׁרָא וּמִמַּסְדִּיקֵי פַרְסָתָא <b>מַטִּלְפֵי טִלְפַיָּא<\/b> יָת גַּמְלָא וְיָת אַרְנְבָא וְיָת טַפְזָא אֲרֵי מַסְּקֵי פִשְׁרָא אִנּוּן וּפַרְסָתְהוֹן לָא סְדִיקָא מְסָאֲבִין אִנּוּן לְכוֹן:", "onk_en": "These, however, do not eat from the regurgitators of cud and from the cloven-soled [<b>split into hooves<\/b>]: the dromedary, the camel, and the hare and the hyrax; for regurgitators of cud are they, but have no cloven sole; they are ritually unclean for you.", "pj": "בְּרַם יַת דֵּין לָא תֵיכְלוּן מִמַּסְקֵי פִּישְׁרָא וּמִסְדִיקֵי פַּרְסָתָא שְׁלִילָא דְּלֵיהּ תְּרֵין רֵישִׁין וְתַרְתֵּין שַׁדְרָאִין הוֹאִיל וְלֵית בְּזַיְנֵיהּ חָזֵי לְמִתְקַיְימָא יַת גְּמָלָא וְיַת אַרְנְבָא וְיַת טַפְּזָא אֲרוּם מַסְקֵי פִּישְׁרָא הִינוּן וּפַרְסַתְהוֹן לָא סְדִיקָן מְסָאֲבִין הִינוּן לְכוֹן", "pj_en": "But of these you may not eat that bring up the cud, or of those who (only) have the hoof divided, the cast thing (embryo) which hath two heads or a double back, things which are not to be perpetuated in the same species (i.e. as a species); nor the camel, the hare, or the coney, because they chew the cud, but do not divide the hoof; they are unclean to you.", "tj": "אֲרוּם מַסְקֵי גְרָרָא הִינוּן וּפַרְסַתְהוֹן לֵית הִיא סְדִיקָה:", "tj_en": "Because they bring up the cud, but have not the hoof divided.", "rashi": "<b>השסועה.<\/b> בְּרִיָּה הִיא שֶׁיֵּשׁ לָהּ שְׁנֵי גַּבִּין וּשְׁתֵּי שִׁדְרָאוֹת (שם ס'); אָמְרוּ רַבּוֹתֵינוּ לָמָּה נִשְׁנוּ? בַּבְּהֵמוֹת מִפְּנֵי הַשְּׁסוּעָה וּבָעוֹפוֹת מִפְּנֵי הָרָאָה, שֶׁלֹּא נֶאֱמְרוּ בְּת\"כֹּ (שם ס\"ג):", "rashi_en": "השסועה — (lit., a cleft one) is a certain animal which has two backs and two spinal columns (Chullin 60b). — Our Rabbis asked, “Why are these (the clean and unclean beasts and fowls) here repeated” since the names have already been mentioned in Leviticus XI? They replied: the repetition was necessary so far as quadrupeds are concerned because of the שסועה, and so far as fowls are concerned because of the ראה, both of which are not mentioned in Torath Cohanim (i.e. Leviticus) (Chullin 63b)."}, {"ch": 14, "v": 8, "aliyah": 4, "heb": "וְאֶת־הַ֠חֲזִ֠יר כִּֽי־מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְלֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָכֶ֑ם מִבְּשָׂרָם֙ לֹ֣א תֹאכֵ֔לוּ וּבְנִבְלָתָ֖ם לֹ֥א תִגָּֽעוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיָת חֲזִירָא אֲרֵי מַסְדִּיק פַּרְסָתָא הוּא וְלָא פָשַׁר מְסָאָב הוּא לְכוֹן מִבִּסְרְהוֹן לָא תֵיכְלוּן וּבִנְבִלְתְּהוֹן לָא <b>תִקְרְבוּן<\/b>:", "onk_en": "Also the pig, because it is cloven-soled but does not [regurgitate its] cud; it is ritually unclean for you. From their flesh do not eat, and do not come in contact [<b>near<\/b>] with their carcasses.", "pj": "וְיַת חֲזִירָא אֲרוּם סְדִיק פַּרְסָתָא הוּא וְלֵית כַּנְפֵיק בֵּיהּ דְּסָדִיק וְלָא פָּשַׁר מְסָאַב הוּא לְכוֹן מִבִּסְרֵיהוֹן לָא תֵיכְלוּן וּבִנְבֵילְתְּהוֹן לָא תְקַרְבוּן", "pj_en": "The swine, because, though he hath the hoof divided, and there is none produced that like him divideth (the hoof), and yet cheweth not the cud, is unclean to you; of their flesh you shall not eat, nor touch their dead bodies.", "tj": "", "tj_en": "", "rashi": "<b>ובנבלתם לא תגעו.<\/b> רַבּוֹתֵינוּ פֵּרְשׁוּ — בָּרֶגֶל, שֶׁאָדָם חַיָּב לְטַהֵר אֶת עַצְמוֹ בָּרֶגֶל, יָכוֹל יִהְיוּ מֻזְהָרִים בְּכָל הַשָּׁנָה, תַּ\"לֹ \"אֱמֹר אֶל הַכֹּהֲנִים וְגוֹ'\", וּמַה טֻּמְאַת הַמֵּת חֲמוּרָה, הַכֹּהֲנִים מֻזְהָרִים וְאֵין יִשְׂרָאֵל מֻזְהָרִים, טֻמְאַת נְבֵלָה קַלָּה, לֹא כָּל שֶׁכֵּן:", "rashi_en": "ובנבלתם לא תגעו YE SHALL NOT TOUCH THEIR CARRION — Our Rabbis explained that this refers only to the festive seasons when every male Israelite was obliged to appear in the Sanctuary and should therefore be in a state of cleanness. One might think that they (the Israelites, i.e. non-priests) are prohibited from touching a carcass during the whole year! It, however, states, (Leviticus 21:1) in reference to the uncleanness of a corpse: “Say unto the priests … [there shall none be defiled by the dead] etc.”. Now you may draw a conclusion a fortiori: How is it in the case of uncleanness caused by a corpse which is a stringent kind of uncleanness? Priests only are prohibited regarding it but ordinary Israelites are not prohibited! Surely in the case of uncleanness caused by a carcass which is less stringent this is all the more so! (Sifra, Shemini, Chapter 4 8-9; cf. Rashi on Leviticus 11:8 and Note thereon)."}, {"ch": 14, "v": 9, "aliyah": 4, "heb": "אֶת־זֶה֙ תֹּֽאכְל֔וּ מִכֹּ֖ל אֲשֶׁ֣ר בַּמָּ֑יִם כֹּ֧ל אֲשֶׁר־ל֛וֹ סְנַפִּ֥יר וְקַשְׂקֶ֖שֶׂת תֹּאכֵֽלוּ׃", "onk": "יָת דֵּין תֵּיכְלוּן מִכֹּל דִּי בְמַיָּא כֹּל דִּי לֵיהּ צִיצִין וְקַלְפִין תֵּיכְלוּן:", "onk_en": "These are you to eat from whatever is in the water: whatever has fins and scales may you eat.", "pj": "לְחוֹד יַת דֵּין תֵּיכְלוּן מִן כָּל דִּבְמַיָא כָּל דִּילֵיהּ צִיצִין לְמִפְרַח וְחַרְסְפִיתִין עַל מוּשְׁכֵיהּ וְאִין נַתְרוֹן וְאִשְׁתְּיֵיר חַד תְּחוֹת לִיסָתֵיהּ וְחַד תְּחוֹת צִיצִיתֵיהּ וְחַד תְּחוֹת גּוֹנְבֵיהּ יָתֵיהּ תֵּיכְלוּן", "pj_en": "But this you may eat, of all that are in the waters, whatever hath fins to move, as by flying, and scales upon its skin; and though (some of which) may fall away, yet if there remain on under its jaw, another under its fin, and another under its tail, that you may eat.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 10, "aliyah": 4, "heb": "וְכֹ֨ל אֲשֶׁ֧ר אֵֽין־ל֛וֹ סְנַפִּ֥יר וְקַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְכֹל דִּי לֵית לֵיהּ צִיצִין וְקַלְפִין לָא תֵיכְלוּן מְסָאָב הוּא לְכוֹן:", "onk_en": "And whatever does not have fins and scales do not eat; they are ritually unclean for you.", "pj": "וְכָל דְּלֵית לֵיהּ צִיצִין וְחַרְסְפִיתִין לָא תֵיכְלוּן מְסָאָב הוּא לְכוֹן", "pj_en": "But whatever hath neither fins nor scales you may not eat; it is unclean to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 11, "aliyah": 4, "heb": "כׇּל־צִפּ֥וֹר טְהֹרָ֖ה תֹּאכֵֽלוּ׃", "onk": "כָּל צִפַּר דַּכְיָא תֵּיכְלוּן:", "onk_en": "You may eat any pure bird.", "pj": "כָּל צִפַּר דְּכֵי דְאִית בֵּיהּ זְפַק וְקוּרְקְבָנֵיהּ קָלִיף וְאִית לֵיהּ צִבְעָא יְתֵירָא וְלָא דָרִיס תֵּיכְלוּן", "pj_en": "Every bird which hath a vesicle or crop which may be picked away, and which (bird) is longer than a finger, and not of the rapacious kind, you may eat.", "tj": "", "tj_en": "", "rashi": "<b>כל צפור טהרה תאכלו.<\/b> לְהַתִּיר מְשֻׁלַּחַת שֶׁבַּמְּצֹרָע (ספרי; קידושין נ\"ז):", "rashi_en": "כל צפור טהרה תאכלו ALL CLEAN BIRDS YOU MAY EAT — 'All' — this is intended to permit as food also the bird that is set free in the case of a leper (i.e. at his purification rite; Leviticus 14:7) (Sifrei Devarim 103:1; Kiddushin 57a)."}, {"ch": 14, "v": 12, "aliyah": 4, "heb": "וְזֶ֕ה אֲשֶׁ֥ר לֹֽא־תֹאכְל֖וּ מֵהֶ֑ם הַנֶּ֥שֶׁר וְהַפֶּ֖רֶס וְהָֽעׇזְנִיָּֽה׃", "onk": "וְדֵין דִּי לָא תֵיכְלוּן מִנְּהוֹן נִשְׁרָא וְעָר וְעַזְיָא:", "onk_en": "And this is what you may not eat: the griffon vulture and the bearded vulture, and the black vulture;", "pj": "וְדֵין דְּלָא תֵיכְלוּן מִנְהוֹן נִישְׁרָא וְעוּזָא וּבַר גּוֹזָא", "pj_en": "But these are they which you may not eat: the eagle, the ossifrage, the osprey,", "tj": "וְדֵין דְּלָא תֵיכְלוּן מִנְהוֹן נִישְׁרָא וְעַדְיָא וּבַרְגְּזָא:", "tj_en": "And these are they of which you may not eat: the eagle, and the sea eagle (ossifrage), and the osprey.", "rashi": "<b>וזה אשר לא תאכלו מהם.<\/b> לֶאֱסֹר אֶת הַשְּׁחוּטָה (שם):", "rashi_en": "וזה אשר לא תאכלו מהם BUT THESE ARE THEY WHICH YOU MAY NOT EAT — This again is intended to forbid as food the bird that is slaughtered in the case of a leper (Sifrei Devarim 103:1-2; Kiddushin 57a)."}, {"ch": 14, "v": 13, "aliyah": 4, "heb": "וְהָרָאָה֙ וְאֶת־הָ֣אַיָּ֔ה וְהַדַּיָּ֖ה לְמִינָֽהּ׃", "onk": "וּבַת כַּנְפָא וְטָרָפִיתָא וְדַיְּתָא לִזְנַהּ:", "onk_en": "The ra’ah and the <i>ayah,<\/i> and the kite according to its kind;", "pj": "וְדַיְיתָא חִיוָורָא וְאוּכְמָתָא דְהִיא אִיבוּ וְדַיְיתָא לִזְנָהּ", "pj_en": "the daitha (lammer geyer?) white or black, which is a bird of prey, a kind of vulture.", "tj": "וְוָתָא וְיַת אִיבוּ וְדַיָיתָא לְמִינָהּ:", "tj_en": "And the rook, the heron also, and the vulture after his kind.", "rashi": "<b>הראה והאיה.<\/b> הִיא רָאָה הִיא אַיָּה הִיא דַיָּה, וְלָמָּה נִקְרָא שְׁמָהּ רָאָה? שֶׁרוֹאָה בְּיוֹתֵר, וְלָמָּה הִזְהִיר בְּכָל שְׁמוֹתֶיהָ? שֶׁלֹּא לִתֵּן פִּתְחוֹן פֶּה לְבַעַל דִּין לַחֲלֹק – שֶׁלֹּא יְהֵא הָאוֹסְרָהּ קוֹרֵא אוֹתָהּ רָאָה, וְהַבָּא לְהַתִּיר אוֹמֵר זוֹ דַּיָּה שְׁמָהּ אוֹ אַיָּה שְׁמָהּ, וְזוֹ לֹא אָסַר הַכָּתוּב. וּבָעוֹפוֹת פֵּרֵט לְךָ הַטְּמֵאִים לְלַמֵּד שֶׁהָעוֹפוֹת הַטְּהוֹרִים מְרֻבִּים עַל הַטְּמֵאִים, לְפִיכָךְ פֵּרֵט אֶת הַמֻּעָט (חולין ס\"ג):", "rashi_en": "ראה — הראה וראיה and איה and דיה are names for the same bird. Why is it called ראה? Because it sees keenly. And why does Scripture prohibit it under each of its names? In order not to give an opponent occasion to argue, i.e. in order that he who regards it as forbidden may not say, “This is the ראה and is therefore forbidden”, and he who wishes to declare it as permitted will then reply, “But this is named דיה\", or “this is named איה and this Scripture has not forbidden”. — In the case of birds, Scripture enumerates by name the unclean species, thus telling you that the clean birds are more numerous than the unclean (in contradistinction to quadrupeds; see vv. 4—5), for which reason Scripture mentions those by name which form the minority (Chullin 63b)."}, {"ch": 14, "v": 14, "aliyah": 4, "heb": "וְאֵ֥ת כׇּל־עֹרֵ֖ב לְמִינֽוֹ׃", "onk": "וְיָת כָּל עֹרְבָא לִזְנֵיהּ:", "onk_en": "And every raven according to its kind;", "pj": "וְיַת כָּל בְּנֵי עוּרְבָא לִזְנֵיהוֹן", "pj_en": "And every raven after his kind;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 15, "aliyah": 4, "heb": "וְאֵת֙ בַּ֣ת הַֽיַּעֲנָ֔ה וְאֶת־הַתַּחְמָ֖ס וְאֶת־הַשָּׁ֑חַף וְאֶת־הַנֵּ֖ץ לְמִינֵֽהוּ׃", "onk": "וְיָת בַּת נַעֲמִיתָא וְצִיצָא וְצִפַּר שַׁחְפָּא וְנָצָא לִזְנוֹהִי:", "onk_en": "And the dark desert eagle owl and the kestrel, and the gull, and the sparrow hawk according to its kind;", "pj": "וְיַת בְּרַת נַעֲמֵיתָא וְיַת חֲטִיפִיתָא וְיַת צִפַּר שַׁחֲפָא וְיַת בַּר נָצְצָא לִזְנוֹי", "pj_en": "and the owl, and nighthawk, and the cuckoo, and the falcon after his kind;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 16, "aliyah": 4, "heb": "אֶת־הַכּ֥וֹס וְאֶת־הַיַּנְשׁ֖וּף וְהַתִּנְשָֽׁמֶת׃", "onk": "וְקַדְיָא וְקִפּוֹפָא וּבַוְתָא:", "onk_en": "The dark little owl and the long-eared owl, and the <i>tinshames<\/i>;", "pj": "וְיַת קְפוּפָא וְיַת שַׁלִי נוּנָא מִן יַמָּא וְיַת צַדְיָא", "pj_en": "the great owl, and the sea gull (catcher of fish from the sea), and the night owl,", "tj": "", "tj_en": "", "rashi": "<b>התנשמת.<\/b> קלב\"א שורי\"ץ:", "rashi_en": "התנשמת — This is the chauve-souris in old French; (English = bat)."}, {"ch": 14, "v": 17, "aliyah": 4, "heb": "וְהַקָּאָ֥ת וְאֶֽת־הָרָחָ֖מָה וְאֶת־הַשָּׁלָֽךְ׃", "onk": "וְקָתָא וִירַקְרֵקָא וְשָׁלֵי נוּנָא:", "onk_en": "And the light little owl and the Egyptian vulture, and the shalach;", "pj": "וְקָקָא חִיוַרְתָּא וְאוּכְמְתָא וּשְׁרַקְרְקָא", "pj_en": "and the cormorant white or black, and the pica,", "tj": "", "tj_en": "", "rashi": "<b>שלך.<\/b> הַשּׁוֹלֶה דָּגִים מִן הַיָּם (שם):", "rashi_en": "שלך is a bird that draws out (שלה = שלך) fish from out the sea (see Rashi on Leviticus 11:17)."}, {"ch": 14, "v": 18, "aliyah": 4, "heb": "וְהַ֣חֲסִידָ֔ה וְהָאֲנָפָ֖ה לְמִינָ֑הּ וְהַדּוּכִיפַ֖ת וְהָעֲטַלֵּֽף׃", "onk": "וְחַוָּרִיתָא וְאִבּוּ לִזְנַהּ וְנַגַּר טוּרָא וַעֲטַלֵּפָא:", "onk_en": "And the stork, and the heron according to its kind, and the duchifas, and the bat.", "pj": "וְדַיְיתָא חִוַורְתָּא וְאוּכְמְתָא לִזְנָהּ וְנַגַר טוּרָא וְעַרְפְּרָא", "pj_en": "and the stork white or black after its kind, and the heathcock, and the bat,", "tj": "וְדַיְיתָא חִיוָורִיתָא וְאַבְנִיתָא לְמִינָהּ וְיַת נַגַר טוּרָא וְיַת חֲרַפְתָּא:", "tj_en": "And the white daitha, and the ibis according to his kind, and the heathcock, and the bat,", "rashi": "<b>דוכיפת.<\/b> הוּא תַּרְנְגוֹל הַבָּר, וּבְלַעַז הרו\"פא, וְכַרְבָּלְתּוֹ כְפוּלָה (גיט' ס\"ח):", "rashi_en": "דוכיפת is the wild cock, which is called in old French herupe, and which has a double comb (Chullin 63a; cf. Rashi on Leviticus 11:19)."}, {"ch": 14, "v": 19, "aliyah": 4, "heb": "וְכֹל֙ שֶׁ֣רֶץ הָע֔וֹף טָמֵ֥א ה֖וּא לָכֶ֑ם לֹ֖א יֵאָכֵֽלוּ׃", "onk": "וְכֹל רִחֲשָׁא דְעוֹפָא מְסָאָב הוּא לְכוֹן לָא יִתְאָכְלוּן:", "onk_en": "And all flying creeping creatures are ritually unclean for you; they may not be eaten.", "pj": "וְכָל דִּיבְבֵי וְזִיבוֹרֵי וְזִיזֵי דִטְלוֹפְחֵי וּפוּלֵי דְפַרְשֵׁיהּ מִן אוֹכְלָא וּפַרְחִין הֵי כְעוֹפָא מְסָאֲבִין אִינוּן לְכוֹן לָא יִתְאַכְלוּן", "pj_en": "and all flies (bees) and wasps, and all worms of vegetables and pulse, which come away from (materials of) food and fly as birds, are unclean to you, they may not be eaten;", "tj": "", "tj_en": "", "rashi": "<b>שרץ העוף.<\/b> הֵם הַנְּמוּכִים, הָרוֹחֲשִׁים עַל הָאָרֶץ. זְבוּבִין וּצְרָעִים וַחֲגָבִים טְמֵאִים קְרוּיִים שֶׁרֶץ:", "rashi_en": "שרץ העוף — These are the lowly creatures which move upon the ground: flies, hornets and the unclean species of grass-hoppers (cf. Rashi on Leviticus 11:20), come under the term of שרץ. "}, {"ch": 14, "v": 20, "aliyah": 4, "heb": "כׇּל־ע֥וֹף טָה֖וֹר תֹּאכֵֽלוּ׃", "onk": "כָּל עוֹפָא דְכֵי תֵּיכְלוּן:", "onk_en": "Every ritually clean bird you may eat.", "pj": "כָּל גּוּבָא דַכְיָא תֵּיכְלוּן", "pj_en": "but any clean beast {locust} you may eat.", "tj": "", "tj_en": "", "rashi": "<b>כל עוף טהור תאכלו.<\/b> וְלֹא אֶת הַטָּמֵא, בָּא לִתֵּן עֲשֵׂה עַל לֹא תַעֲשֶׂה; וְכֵן בַּבְּהֵמָה \"אֹתָהּ תֹּאכֵלוּ\", וְלֹא בְהֵמָה טְמֵאָה, וְלָאו הַבָּא מִכְּלַל עֲשֵׂה עֲשֵׂה, לַעֲבֹר עֲלֵיהֶם בַּעֲשֵׂה וְלֹא תַעֲשֶׂה:", "rashi_en": "כל עוף תאכלו ALL CLEAN FOWLS, YOU MAY EAT — but not (as is implied by these words) the unclean. Scripture intends, by this statement, to attach to the negative command which forbids unclean fowls (v. 12), a positive one which implicitly contains a prohibition. And similarly, when in the case of clean cattle it states, (v. 6) “that you may eat”, it implies: not, however, the unclean ones. Now a prohibition which is not plainly expressed but can only be drawn by inference from a positive command, is itself regarded only as a positive command, so that one who eats such food transgresses thereby not two negative commands, but a positive and a negative command (Sifrei Devarim 101:10; and cf. Rashi on Leviticus 11:3)."}, {"ch": 14, "v": 21, "aliyah": 4, "heb": "לֹ֣א תֹאכְל֣וּ כׇל־נְ֠בֵלָ֠ה לַגֵּ֨ר אֲשֶׁר־בִּשְׁעָרֶ֜יךָ תִּתְּנֶ֣נָּה וַאֲכָלָ֗הּ א֤וֹ מָכֹר֙ לְנׇכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַיהֹוָ֖ה אֱלֹהֶ֑יךָ לֹֽא־תְבַשֵּׁ֥ל גְּדִ֖י בַּחֲלֵ֥ב אִמּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא תֵיכְלוּן כָּל נְבִילָא לְתוֹתַב <b>עָרֵל<\/b> דִּי בְקִרְוָיךְ תִּתְּנִנַּהּ וְיֵיכְלִנַּהּ אוֹ תְזַבְּנִנַּהּ <b>לְבַר עַמְמִין<\/b> אֲרֵי עַם קַדִּישׁ אַתְּ קֳדָם יְיָ אֱלָהָךְ לָא תֵיכוּל <b>בְּשַׂר בַּחֲלָב<\/b>:", "onk_en": "Do not eat any carcass; to the [<b>uncircumcised<\/b>] alien in your cities give it and he will eat it or sell it to a non-Jew [<b>foreigner<\/b>], for you are a people sanctified to Adonoy, your God; do not cook a kid in its mother’s milk [<b>milk with meat<\/b>].", "pj": "לָא תֵיכְלוּן כָּל דְּמִיקַלְקְלָא בְּנִכְסָא לְגִיוּר עָרֵל דִּבְקִירְוֵיכוֹן תִּיתְּנוּנָהּ וְיֵכְלוּנָהּ אוֹ תַּזְבִּין לְבַר עַמְמִין אֲרוּם עַם קַדִּישׁ אַתּוּן קֳדָם יְיָ אֱלָהָכוֹן לֵית אַתּוּן רַשָּׁאִין לְמִיבַשְׁלָא כָּל דְּכֵן לְמֵיכוֹל בְּשַר בַּחֲלָב תַּרְוֵיהוֹן מְעַרְבִין בְּחָדָא", "pj_en": "You shall not eat of anything that is unclean through the manner of its death; you may give it to the uncircumcised stranger who is in your cities to eat it, or sell it to a son of the Gentiles; for you are a holy people before the Lord your God. It shall not be lawful for you to boil, much less to eat, flesh with milk when both are mixed together.", "tj": "", "tj_en": "", "rashi": "<b>לגר אשר בשעריך.<\/b> גֵּר תּוֹשָׁב שֶׁקִּבֵּל עָלָיו שֶׁלֹּא לַעֲבֹד עֲ\"זָ וְאוֹכֵל נְבֵלוֹת (ספרי):<br><br><b>כי עם קדוש אתה לה'.<\/b> קַדֵּשׁ אֶת עַצְמְךָ בַּמֻּתָּר לְךָ – דְּבָרִים הַמֻּתָּרִים וַאֲחֵרִים נוֹהֲגִים בָּהֶם אִסּוּר, אַל תַּתִּירֵם בִּפְנֵיהֶם (שם):<br><br><b>לא תבשל גדי.<\/b> שָׁלוֹשׁ פְּעָמִים, פְּרָט לְחַיָּה וּלְעוֹפוֹת וְלִבְהֵמָה טְמֵאָה (חולין קי\"ג):", "rashi_en": "לגר אשר בשעריך [YE SHALL NOT EAT ANY CARRION: THOU SHALT GIVE IT] UNTO THE STRANGER THAT IS IN THY GATES — i.e. unto a stranger that is a sojourner (גר תושב) — one who has undertaken not to worship idols (i.e. one who has been converted to the fundamental tenet of Judaism) but who eats carrion (does not obey the other teachings of the Torah) (Sifrei Devarim 104:2; cf. Rashi on Leviticus 25:35).<br><br>כי עם קדוש אתה לה׳ FOR THOU ART AN HOLY PEOPLE UNTO THE LORD — This implies: show yourself holy (abstinent) in respect to things which are permitted to you — i.e. things that are actually permitted but which some treat as forbidden you should not treat as permissible in their presence (Sifrei Devarim 104:7).<br><br>לא תבשל גדי THOU SHALT NOT SEETHE A KID [IN ITS MOTHER’S MILK] — Three times the prohibition of seething meat in milk is mentioned in the Torah (here, and in Exodus 23:19 and Exodus 34:26) and each time in the form: “thou shalt not seethe a kid” thus excluding three species: a wild beast, fowls and unclean beasts from the prohibition (Sifrei Devarim 104:8; Chullin 113a). "}, {"ch": 14, "v": 22, "aliyah": 5, "heb": "עַשֵּׂ֣ר תְּעַשֵּׂ֔ר אֵ֖ת כׇּל־תְּבוּאַ֣ת זַרְעֶ֑ךָ הַיֹּצֵ֥א הַשָּׂדֶ֖ה שָׁנָ֥ה שָׁנָֽה׃", "onk": "עַשְּׂרָא תְעַשֵּׂר יָת כָּל עֲלָלַת זַרְעָךְ דְּיִפּוֹק חַקְלָא שַׁתָּא בְשַׁתָּא:", "onk_en": "You must surely tithe all the produce of your planting, that your field yields on a yearly basis.", "pj": "הֲווֹ זְהִירִין לְעַשְרָא פֵּירֵיכוֹן מִן דְּאַתּוּן מַפְקִין וּכְנָשׁוּן מִן חַקְלָא כָּל שַׁתָּא וְשַׁתָּא וְלָא פֵּירֵי שַׁתָּא עַל פֵּירֵי שַׁתָּא אוֹחֲרֵי", "pj_en": "Be mindful to tythe your fruitage of whatsoever cometh forth, and which you gather in from the field year by year; not giving the fruit of one year for the fruit of another.", "tj": "עַמִּי בֵּית יִשְרָאֵל מַעַשְרָא תַעַשְרוּן יַת כָּל עֲלָלַת זַרְעֵיכוֹן מַהֲדֵי אַתּוּן זַרְעִין בְּאַפֵּי בְרָא וְכַנְשִׁין עַלָלָן בְּכָל שְׁנָא וּשְׁנָא עַמִּי יִשְרָאֵל לֵית אַתּוּן רַשָּׁאִין לְמַעַשְרָא וּלְמֵיכוּל מִן פֵּירֵי שְׁנָא וְעַד פֵּירֵי שְׁנָא:", "tj_en": "My people of the house of Israel, tything you shall tythe all the produce of your seed, of that which you sow upon the face of the field and gather in the produce of each year. Israel, My people, it is not lawful for you to tythe and eat the fruit of one year along with the fruit of (another) year.", "rashi": "<b>לא תבשל גדי‎ … עשר תעשר.<\/b> מָה עִנְיַן זֶה אֵצֶל זֶה? אָמַר לָהֶם הַקָּבָּ\"ה לְיִשְׂרָאֵל: אַל תִּגְרְמוּ לִי לְבַשֵּׁל גְּדָיִים שֶׁל תְּבוּאָה עַד שֶׁהֵן בִּמְעֵי אִמּוֹתֵיהֶן, שֶׁאִם אֵין אַתֶּם מְעַשְּׂרִים מַעַשְׂרוֹת כָּרָאוּי כְּשֶׁהוּא סָמוּךְ לְהִתְבַּשֵּׁל אֲנִי מוֹצִיא רוּחַ קָדִים וְהִיא מְשַׁדַּפְתָּן, שֶׁנֶּאֱמַר (מלכים ב י\"ט) \"וּשְׁדֵפָה לִפְנֵי קָמָה\", וְכֵן לְעִנְיַן בִּכּוּרִים (פסיק' ר'; תנחומא):<br><br><b>שנה שנה.<\/b> מִכָּאן שֶׁאֵין מְעַשְּׂרִין מִן הֶחָדָשׁ עַל הַיָּשָׁן (ספרי):", "rashi_en": "THOU SHALT TRULY TITHE [ALL THE INCREASE OF THY SEED] — What has this matter to do with that? (Why are they placed in juxtaposition)? But the Holy One, blessed be He, says in effect to Israel: “Do not compel Me to blast by heat the tender kernels of the grain, whilst they are yet in their mother’s womb (i.e. in the husks), for if you do not tithe your products as is proper, when they are near ripening I shall bring forth the east wind and it will blast them”, as it is said, (2 Kings 19:26) “[Therefore … they were] as the corn blasted before it be grown up” (Midrash Tanchuma, Re'eh 17). A similar reason may be given for בכורים (for its juxtaposition to לא תבשל גדי (Exodus 34:26).<br><br>שנה שנה [THOU SHALT TRULY GIVE TITHE] YEAR BY YEAR — From here we may derive that one must not give tithe from the new grain for the old (Sifrei Devarim 105:1)."}, {"ch": 14, "v": 23, "aliyah": 5, "heb": "וְאָכַלְתָּ֞ לִפְנֵ֣י&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ בַּמָּק֣וֹם אֲשֶׁר־יִבְחַר֮ לְשַׁכֵּ֣ן שְׁמ֣וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְךָ֙ תִּירֹשְׁךָ֣ וְיִצְהָרֶ֔ךָ וּבְכֹרֹ֥ת בְּקָרְךָ֖ וְצֹאנֶ֑ךָ לְמַ֣עַן תִּלְמַ֗ד לְיִרְאָ֛ה אֶת־יְהֹוָ֥ה אֱלֹהֶ֖יךָ כׇּל־הַיָּמִֽים׃", "onk": "וְתֵיכוּל קֳדָם יְיָ אֱלָהָךְ בְּאַתְרָא דִּי יִתִּרְעֵי לְאַשְׁרָאָה <b>שְׁכִנְתֵּיהּ<\/b> תַּמָּן מַעְשַׂר עִבוּרָךְ חַמְרָךְ וּמִשְׁחָךְ וּבְכוֹרֵי תוֹרָךְ וְעָנָךְ בְּדִיל דְּתֵילַף לְמִדְחַל <b>קֳדָם<\/b> יְיָ אֱלָהָךְ כָּל יוֹמַיָּא:", "onk_en": "You shall eat in the presence of Adonoy, your God, in the place He chooses to house His Presence [<b>Shechinah<\/b>] there—the tithe of your grain, your wine, and your olive oil, and the firstborn of your cattle and flocks; in order that you learn to fear [<b>before<\/b>] Adonoy, your God, all the years.", "pj": "וְתֵיכְלוּן מַעַשְרָא תִנְיָינָא קֳדָם יְיָ אֱלָהָכוֹן בְּאַתְרָא דְיִתְרְעֵי לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן מַעֲשַר עִיבּוּרֵיכוֹן חַמְרֵיכוֹן וּמִשְׁחֲכוֹן וְכֵן בִּכּוּרֵי תוֹרֵיכוֹן וְעָנֵיכוֹן מִן בִּגְלַל דְּתֵילְפוּן לְמִדְחַל מִן קֳדָם יְיָ אֱלָהָכוֹן כָּל יוֹמַיָא", "pj_en": "And the second tythe you shall eat before the Lord your God in the place which He will choose to make His Shekinah to dwell there; the tenths of your corn, your vines, and your oil, and likewise the firstlings of your oxen and sheep, that you may learn to fear the Lord your God all the days.", "tj": "", "tj_en": "", "rashi": "<b>ואכלת וגו'.<\/b> זֶה מַעֲשֵׂר שֵׁנִי. שֶׁכְּבָר לִמְּדָנוּ לִתֵּן מַעֲשֵׂר רִאשׁוֹן לַלְוִיִם, שֶׁנֶּאֱמַר \"כִּי תִקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל וְגוֹ'\" (במדבר י\"ח) וְנָתַן לָהֶם רְשׁוּת לְאָכְלוֹ בְּכָל מָקוֹם, שֶׁנֶּאֱמַר \"וַאֲכַלְתֶּם אֹתוֹ בְּכָל מָקוֹם\" (שם י\"ח), עַל כָּרְחֲךָ זֶה מַעֲשֵׂר אַחֵר הוּא:", "rashi_en": "'ואכלת וגו AND THOU SHALT EAT [BEFORE THE LORD THY GOD, IN THE PLACE WHICH HE SHALL CHOOSE … THE TITHE OF THY CORN etc.] — This is the “Second Tithe”, for it (Scripture) has already taught us to give the “First Tithe” to the Levites — as it is said, (Numbers 18:26) “[And unto the Levite shalt thou speak …], when ye take of the children of Israel the tithes”, etc., — and besides it gave them permission to eat it in any place, as it is said, (Numbers 18:31) “and ye shall eat it in any place” — thus you must admit that this tithe mentioned here, (which is to be eaten by an ordinary Israelite in Jerusalem) must be another one, — the “Second Tithe”."}, {"ch": 14, "v": 24, "aliyah": 5, "heb": "וְכִֽי־יִרְבֶּ֨ה מִמְּךָ֜ הַדֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַל֮ שְׂאֵתוֹ֒ כִּֽי־יִרְחַ֤ק מִמְּךָ֙ הַמָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לָשׂ֥וּם שְׁמ֖וֹ שָׁ֑ם כִּ֥י יְבָרֶכְךָ֖ יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וַאֲרֵי יִסְגֵּי מִנָּךְ אָרְחָא אֲרֵי לָא תִכּוּל לְמִטְּלֵיהּ אֲרֵי יִתְרָחַק מִנָּךְ אַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ לְאַשְׁרָאָה <b>שְׁכִנְתֵּיהּ<\/b> תַּמָּן אֲרֵי יְבָרֵכִנָּךְ יְיָ אֱלָהָךְ:", "onk_en": "If the journey will be beyond you; if you will be unable to carry it because the place is distant for you where Adonoy, your God, chooses to set His Presence [<b>Shechinah<\/b>] there, for Adonoy, your God, has blessed you—", "pj": "וַאֲרוּם יִסְגֵי מִנְכוֹן אוֹרְחָא אֲרוּם לָא תֵיכוּל לְמִיסוֹבְרָא יַת מַעַשְרָא אֲרוּם יִתְרְחַק מִנְכוֹן אַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן אֲרוּם יְבָרְכִינָךְ יְיָ אֱלָהָךְ", "pj_en": "And if the way be too great for you to be able to carry the tenth, because the place which the Lord thy God will choose for His Shekinah to dwell there is too distant from you, when the Lord thy God shall have blessed thee,", "tj": "", "tj_en": "", "rashi": "<b>כי יברכך.<\/b> שֶׁתְּהֵא הַתְּבוּאָה מְרֻבָּה לָשֵׂאת:", "rashi_en": "כי יברכך WHEN [THE LORD THY GOD] HATH BLESSED THEE — so that your produce will be too much to carry [as far as Jerusalem]."}, {"ch": 14, "v": 25, "aliyah": 5, "heb": "וְנָתַתָּ֖ה בַּכָּ֑סֶף וְצַרְתָּ֤ הַכֶּ֙סֶף֙ בְּיָ֣דְךָ֔ וְהָֽלַכְתָּ֙ אֶל־הַמָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהֹוָ֥ה אֱלֹהֶ֖יךָ בּֽוֹ׃", "onk": "וְתִתֵּן בְּכַסְפָּא וּתְצוּר כַּסְפָּא בִּידָךְ וּתְהַךְ לְאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ בֵּיהּ:", "onk_en": "you will substitute coins. You will bundle the coins in your hand, and will go to the place that Adonoy, your God, chooses.", "pj": "וּתְחַלֵּל בְּכַסְפָּא וִיהוֹן פְּרִיטֵי צְרִירִין בִּידָךְ וּתְהַךְ לְאַתְרָא דְיִתְרְעֵי יְיָ אֱלָהֲכוֹן בֵּיהּ", "pj_en": "then thou mayest make exchange for it into silver, and bind the sum in thy hand, and proceed to the place which the Lord thy God shall choose,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 26, "aliyah": 5, "heb": "וְנָתַתָּ֣ה הַכֶּ֡סֶף בְּכֹל֩ אֲשֶׁר־תְּאַוֶּ֨ה נַפְשְׁךָ֜ בַּבָּקָ֣ר וּבַצֹּ֗אן וּבַיַּ֙יִן֙ וּבַשֵּׁכָ֔ר וּבְכֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְךָ֖ נַפְשֶׁ֑ךָ וְאָכַ֣לְתָּ שָּׁ֗ם לִפְנֵי֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ וְשָׂמַחְתָּ֖ אַתָּ֥ה וּבֵיתֶֽךָ׃", "onk": "וְתִתֵּן כַּסְפָּא בְּכֹל דִּי יִתִּרְעֵי נַפְשָׁךְ בְּתוֹרֵי וּבְעָנָא <b>וּבַחֲמַר חֲדַת וְעַתִּיק<\/b> וּבְכֹל דִּי תִשְׁאֲלִנָּךְ נַפְשָׁךְ וְתֵיכוּל תַּמָּן קֳדָם יְיָ אֱלָהָךְ וְתֶחֱדֵי אַתְּ <b>וֶאֱנַשׁ<\/b> בֵּיתָךְ:", "onk_en": "You will spend the money for anything you desire—for cattle, sheep, wine, intoxicating liquor [<b>fresh and aged wine<\/b>]—and for anything that you wish; and you will eat there in the presence of Adonoy, your God, and will rejoice, you and [<b>the members of<\/b>] your household.", "pj": "וְתִתֵּן כַּסְפָּא בְּכָל דְּיִתְרְעֵי נַפְשָׁךְ בְּתוֹרֵי וּבְעָנָא וּבַחֲמַר חֲדַת וְעַתִּיק וּבְכָל דִּתְשַׁיְילִינָךְ נַפְשָׁךְ וְתֵיכְלוּן תַּמָּן קֳדָם יְיָ אֱלָהָכוֹן וְתֶחְדוּן אַתּוּן וֶאֱנַשׁ בָּתֵּיכוֹן", "pj_en": "and give the silver for any thing that thy soul pleaseth, of oxen, sheep, wine new or old, or whatever thy soul desireth; and you shall eat there before the Lord your God and rejoice, you and the men of your house.", "tj": "", "tj_en": "", "rashi": "<b>בכל אשר תאוה נפשך<\/b> – כְּלָל:<br><br><b>בבקר ובצאן וביין ובשכר<\/b> – פְּרָט:<br><br><b>ובכל אשר תשאלך נפשך<\/b> – חָזַר וְכָלַל, מַה הַפְּרָט מְפֹרָשׁ וְלַד וַלְדוֹת הָאָרֶץ וְרָאוּי לְמַאֲכַל אָדָם וְכוּ' (עירובין כ\"ז):", "rashi_en": "בכל אשר תאוה נפשך [AND THOU SHALT GIVE THAT MONEY] FOR WHATSOEVER THY SOUL LONGETH AFTER — this is a general statement,<br><br>בבקר ובצאן וביין ובשכר FOR ANY OF THE HERD, OR ANY OF THE FLOCK, OR FOR WINE, OR FOR STRONG DRINK — this is a particularisation,<br><br>ובכל אשר תאוה נפשך OR FOR WHATEVER THY SOUL DESIRES — Scripture again includes them in a general statement. [The rule is that when a verse expresses a כְּלָל, a פְּרָט, and then a כְּלָל again, as in this case, we apply the characteristics of the פְּרָט to the whole matter. Therefore,] just as the particulars mentioned have the characteristic of being products (ולד) of things themselves produced by the earth during the week of Creation, and are fitted to be food for man, etc. [So, too, the money must be expended only on things of this character] (Eruvin 27b)."}, {"ch": 14, "v": 27, "aliyah": 5, "heb": "וְהַלֵּוִ֥י אֲשֶׁר־בִּשְׁעָרֶ֖יךָ לֹ֣א תַֽעַזְבֶ֑נּוּ כִּ֣י אֵ֥ין ל֛וֹ חֵ֥לֶק וְנַחֲלָ֖ה עִמָּֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְלֵוָאָה דִי בְקִרְוָיךְ לָא תִשְׁבְּקִנֵּיהּ אֲרֵי לֵית לֵיהּ חֳלָק וְאַחֲסָנָא עִמָּךְ:", "onk_en": "And the Levite who is in your city, you must not abandon; since he has no portion or inheritance with you.", "pj": "וְלֵיוָאָה דִבְקִרְוֵיכוֹן לָא תִשְׁבְּקוּנֵיהּ אֲרוּם לֵית לֵיהּ חוֹלַק וְאַחְסָנָא עִמְכוֹן", "pj_en": "And the Levite who is in your cities forsake not, for he hath not a portion or a heritage with you.", "tj": "", "tj_en": "", "rashi": "<b>והלוי, לא תעזבנו.<\/b> מִלִּתֵּן לוֹ מַעֲשֵׂר רִאשׁוֹן:<br><br><b>כי אין לו חלק ונחלה עמך.<\/b> יָצְאוּ לֶקֶט שִׁכְחָה וּפֵאָה וְהֶפְקֵר, שֶׁאַף הוּא יֵשׁ לוֹ חֵלֶק עִמְּךָ בָּהֶן כָּמוֹךָ, וְאֵינָן חַיָּבִין בְּמַעֲשֵׂר:", "rashi_en": "והלוי … לא תעזבנו AND THE LEVITE [THAT IS WITHIN THY GATES;] THOU SHALT NOT FORSAKE HIM by not giving him the “First Tithe” (מעשר ראשון). <br><br>כי אין לו חלק ונחלה עמך OR HE HATH NO PORTION NOR INHERITANCE WITH THEE — This excludes “Gleanings” (לקט), “the forgotten sheaf” (שכחה), the “corner of the field” (פאה), and ownerless things (הפקר) from the things that must be tithed — for he (the Levite) has a portion in them (is entitled to take of them) with you, just the same as you, and they are therefore exempt from tithes (Mishnah Challah 1:3; Bava Kamma 94a)."}, {"ch": 14, "v": 28, "aliyah": 5, "heb": "מִקְצֵ֣ה&thinsp;<b>׀<\/b> שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת־כׇּל־מַעְשַׂר֙ תְּבוּאָ֣תְךָ֔ בַּשָּׁנָ֖ה הַהִ֑וא וְהִנַּחְתָּ֖ בִּשְׁעָרֶֽיךָ׃", "onk": "מִסּוֹף תְּלַת שְׁנִין תַּפֵּק יָת כָּל מַעְשַׂר עֲלַלְתָּךְ בְּשַׁתָּא הַהִיא וְתַצְנַע בְּקִרְוָיךְ:", "onk_en": "At the end of three years, separate all the tithes of your produce of that year and set them aside in your city.", "pj": "מִסּוֹף תְּלַת שְׁנִין תַּפְקוּן יַת כָּל מַעֲשַר עֲלַלְתְּכוֹן בְּשַׁתָּא הַהוּא וְתַצְנִיעוּן בְּקִרְוֵיכוֹן", "pj_en": "At the end of three years you shall bring forth all the tenths of your produce for that year, and lay them up in your cities.", "tj": "", "tj_en": "", "rashi": "<b>מקצה שלש שנים.<\/b> בָּא וְלִמֵּד שֶׁאִם הִשְׁהָה מַעַשְׂרוֹתָיו שֶׁל שָׁנָה רִאשׁוֹנָה וּשְׁנִיָּה לִשְׁמִטָּה, שֶׁיְּבַעֲרֵם מִן הַבַּיִת בַּשְּׁלִישִׁית:", "rashi_en": "מקצה שלש שנים AT THE END OF THREE YEARS [THOU SHALT BRING FORTH ALL THE TITHE OF THY INCREASE THE SAME YEAR] — Scripture hereby intends to teach you that if one has delayed to give his tithes of the first and the second year of the Sabbatical period, he has to remove them from his house in the third year."}, {"ch": 14, "v": 29, "aliyah": 5, "heb": "וּבָ֣א הַלֵּוִ֡י כִּ֣י אֵֽין־לוֹ֩ חֵ֨לֶק וְנַחֲלָ֜ה עִמָּ֗ךְ וְ֠הַגֵּ֠ר וְהַיָּת֤וֹם וְהָֽאַלְמָנָה֙ אֲשֶׁ֣ר בִּשְׁעָרֶ֔יךָ וְאָכְל֖וּ וְשָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּכׇל־מַעֲשֵׂ֥ה יָדְךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיֵיתֵי לֵוָאָה אֲרֵי לֵית לֵיהּ חֳלָק וְאַחֲסָנָא עִמָּךְ וְגִיּוֹרָא וְיִתַּמָּא וְאַרְמְלָא דִּי בְקִרְוָיךְ וְיֵיכְלוּן וְיִשְׂבְּעוּן בְּדִיל דִּי יְבָרֵכִנָּךְ יְיָ אֱלָהָךְ בְּכָל עוֹבָדֵי יְדָךְ דִּי תַעְבֵּד:", "onk_en": "The Levite shall come, for he has no portion or inheritance with you, and the proselyte and the orphan and the widow who are in your city, let them eat their fill; in order that Adonoy, your God, bless you in all the endeavors that you make.", "pj": "וְיֵיתֵי לֵיוָאָה אֲרוּם לֵית לֵיהּ חוּלַק וְאַחֲסָנָא עִמְכוֹן וְגִיּוֹרָא וְיַתְמָא וְאַרְמַלְתָּא דִבְקִירְוֵיכוֹן וְיֵיכְלוּן וְיִסְבְּעוּן מִן בִּגְלַל דִּיבָרְכֵיכוֹן יְיָ אֱלָהָכוֹן בְּכָל עוֹבָדֵי יְדֵיכוֹן דְּתַעַבְדוּן", "pj_en": "And the Levite, because he hath no part or heritage with you, and the stranger, the orphan, and the widow who are in your cities, shall come and eat and be satisfied; that the Lord your God may bless you in all the works of your hands that you do.", "tj": "", "tj_en": "", "rashi": "<b>ובא הלוי.<\/b> וְיִטֹּל מַעֲשֵׂר רִאשׁוֹן:<br><br><b>והגר והיתום.<\/b> וְיִטְּלוּ מַעֲשֵׂר שֵׁנִי, שֶׁהוּא שֶׁל עָנִי שֶׁל שָׁנָה זוֹ, וְלֹא תֹאכְלֶנּוּ אַתָּה בִּירוּשָׁלַיִם כְּדֶרֶךְ שֶׁנִּזְקַקְתָּ לֶאֱכֹל מַעֲשֵׂר שֵׁנִי שֶׁל שְׁתֵּי שָׁנִים:<br><br><b>ואכלו ושבעו.<\/b> תֵּן לָהֶם כְּדֵי שָׂבְעָן, מִכָּאן אָמְרוּ אֵין פּוֹחֲתִין לֶעָנִי בַּגֹּרֶן וְכוּ' (ספרי קי). וְאַתָּה הוֹלֵךְ לִירוּשָׁלַיִם בַּמַּעֲשֵׂר שֶׁל שָׁנָה רִאשׁוֹנָה וּשְׁנִיָּה שֶׁהִשְׁהֵיתָ, וּמִתְוַדֶּה \"בִּעַרְתִּי הַקֹּדֶשׁ מִן הַבַּיִת\" כְּמוֹ שֶׁמְּפֹרָשׁ בְּכִי תְכַלֶּה לַעְשֵׂר (דברים כ\"ו):", "rashi_en": "ובא הלוי AND THE LEVITE SHALL COME and take the “First Tithe” which you have failed to give him,<br><br>והגר והיתום AND THE STRANGER AND THE FATHERLESS [SHALL COME] and take the “Second Tithe”, which belongs to the poor in that year, and you shall not eat it yourself in Jerusalem, as you were bound to eat the “Second Tithe” of the first two years,<br><br>ואכלו ושבעו AND THEY SHALL EAT AND BE SATISFIED — Give them sufficient to satisfy them. From here they (the Rabbis) derived the law: one must give the poor in the barn no less than half a kab of wheat or a kab of barley (Sifrei Devarim 110:3). As for you, go up to Jerusalem with the tithe (i.e. מעשר שני) of the first and the second years which thou hast delayed, and make the confession there: “I have removed the hallowed things from the house” — as it is stated in the section beginning with the words כי תכלה לעשר (Deuteronomy 26:12)."}, {"ch": 15, "v": 1, "aliyah": 6, "heb": "מִקֵּ֥ץ שֶֽׁבַע־שָׁנִ֖ים תַּעֲשֶׂ֥ה שְׁמִטָּֽה׃", "onk": "מִסּוֹף שְׁבַע שְׁנִין תַּעְבֵּד שְׁמִטְּתָא:", "onk_en": "At the end of seven years, you are to make <i>shemitah.<\/i>", "pj": "מִסּוֹף שִׁבְעָתֵי שְׁנִין תַּעַבְדוּן שְׁמִיטָתָא", "pj_en": "At the end of seven years you shall make a Release.", "tj": "", "tj_en": "", "rashi": "<b>מקץ שבע שנים.<\/b> יָכוֹל שֶׁבַע שָׁנִים לְכָל מִלְוָה וּמִלְוָה, תַּ\"לֹ \"קָרְבָה שְׁנַת הַשֶּׁבַע\", וְאִם אַתָּה אוֹמֵר שֶׁבַע שָׁנִים לְכָל מִלְוָה וּמִלְוָה, לְהַלְוָאוֹת כָּל אֶחָד וְאֶחָד, הֵיאַךְ הִיא
