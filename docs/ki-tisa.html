־מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִזֶּ֔ה אַתָּ֣ה וְהָעָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵאֶ֣רֶץ מִצְרָ֑יִם אֶל־הָאָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּ֠עְתִּי לְאַבְרָהָ֨ם לְיִצְחָ֤ק וּֽלְיַעֲקֹב֙ לֵאמֹ֔ר לְזַרְעֲךָ֖ אֶתְּנֶֽנָּה׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה אִזֵּיל סַק מִכָּא אַתְּ וְעַמָּא דְּאַסֶּקְתָּא מֵאַרְעָא דְמִצְרַיִם לְאַרְעָא דִּי קַיֵּמִית לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב לְמֵימַר לִבְנָיךְ אֶתְּנִנַּהּ:", "onk_en": "Adonoy spoke to Moshe, “Leave, go up from this [place]—you and the people you brought up from the land of Egypt—to the land of which I swore to Avraham, to Yitzchok and to Yaakov, saying, ‘To your descendants I will give it.’", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה אִיזֵיל אִיסְתַּלֵּק מִכָּא דִלְמָא יִתְקֵף רְתַח רוּגְזִי בְּעַמָא וְאֵישֵׁיצִינוּן בְּגִין כֵּן טַיֵּיל אַנְתְּ וְעַמָּא דְאַסֵיקְתָּא מֵאַרְעָא דְמִצְרַיִם לְאַרְעָא דְקַיֵּימִית לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב לְמֵימַר לִבְנָךְ אֵיתְּנִינָהּ", "pj_en": "And the Lord spake with Mosheh, Go, remove thee hence, lest My anger grow hot against the people, and I consume them. Therefore proceed thou, and the people whom thou didst bring up out of the land of Mizraim, (to that land) which I have covenanted unto Abraham, to Izhak, and to Jakob, saying, Unto thy sons will I give it.", "tj": "", "tj_en": "", "rashi": "<b>לך עלה מזה.<\/b> אֶֶרֶץ יִשְׂרָאֵל גְּבוֹהָה מִכָּל הָאֲרָצוֹת, לְכָךְ נֶאֱמַר עֲלֵה; דָּ\"אַ, כְּלַפֵּי שֶׁאָמַר לוֹ בִּשְׁעַת הַכַּעַס \"לֶךְ רֵד\" אָמַר לוֹ בִּשְׁעַת רָצוֹן \"לֵךְ עֲלֵה\" (תנחומא):<br><br><b>אתה והעם.<\/b> כָּאן לֹא נֶאֱמַר וְעַמְּךָ:", "rashi_en": "לך עלה מזה GO, GO UP HENCE — The land of Israel is situated higher than all the other neighbouring lands, therefore it said “go up” (Zevachim 54b). Another explanation is: As a compensation for what He had said to him (Moses) in a time of anger, (Exodus 32:7) “Go, go down”, He now said to him, at a time of good-will, “Go, go up”.<br><br>אתה והעם THOU AND THE PEOPLE [WHICH THOU HAST BROUGHT UP] — Here — (in contrast to Exodus 32:7) it does not say “and thy people” (the mixed multitude which thou, of thine own accord, hast brought up from Egypt) (Midrash Tanchuma 3:9:26)."}, {"ch": 33, "v": 2, "aliyah": 2, "heb": "וְשָׁלַחְתִּ֥י לְפָנֶ֖יךָ מַלְאָ֑ךְ וְגֵֽרַשְׁתִּ֗י אֶת־הַֽכְּנַעֲנִי֙ הָֽאֱמֹרִ֔י וְהַֽחִתִּי֙ וְהַפְּרִזִּ֔י הַחִוִּ֖י וְהַיְבוּסִֽי׃", "onk": "וְאֶשְׁלַח קֳדָמָךְ מַלְאָכָא וְאֵתָרֵךְ יָת כְּנַעֲנָאֵי אֱמוֹרָאֵי וְחִתָּאֵי וּפְרִזָּאֵי חִוָּאֵי וִיבוּסָאֵי:", "onk_en": "I will send an angel before you, and I will drive out the Canaanites, the Emorites, the Chitites, the Perizites, the Chivites, and the Yevusites.", "pj": "וְאֵיזַמֵּן קֳדָמָךְ מַלְאָךְ וְאֵיתָרֵךְ עַל יְדוֹי יַת כְּנַעֲנָאֵי אֱמוֹרָאֵי חִיתָּאֵי וּפְרִיזָאֵי חִיוָאֵי וִיבוּסָאֵי", "pj_en": "And I will appoint before thee an angel, and by his hand will cast out the Kenaanaee, Amoraee, Hittaee, and Pherizaee, Hivaee, and Jebusaee;", "tj": "", "tj_en": "", "rashi": "<b>וגרשתי את הכנעני וגו'.<\/b> ו' אֻמּוֹת הֵם וְהַגִּרְגָּשִׁי עָמַד וּפָנָה מִפְּנֵיהֶם מֵאֵלָיו (תלמוד ירושלמי שביעית ו'):", "rashi_en": "וגרשתי את הכנעני וגו׳ AND I WILL DRIVE OUT THE CANAANITE etc. — These are only six nations whilst in Deuteronomy 7:1 seven such are mentioned! But the Girgashites, the seventh, arose and emigrated of their own accord from before them (the Israelites) and therefore are not mentioned here amongst those who were driven out (Jerusalem Talmud Shevi'it 6:2; Leviticus Rabbah 17:6)."}, {"ch": 33, "v": 3, "aliyah": 2, "heb": "אֶל־אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָ֑שׁ כִּי֩ לֹ֨א אֶֽעֱלֶ֜ה בְּקִרְבְּךָ֗ כִּ֤י עַם־קְשֵׁה־עֹ֙רֶף֙ אַ֔תָּה פֶּן־אֲכֶלְךָ֖ בַּדָּֽרֶךְ׃", "onk": "לְאַרְעָא <b>עַבְדָּא<\/b> חֲלָב וּדְבָשׁ אֲרֵי לָא אֲסַלֵּק <b>שְׁכִנְתִּי<\/b> מִבֵּינָךְ אֲרֵי עַם קְשֵׁי קְדַל אַתְּ דִּילְמָא אֲשֵׁיצִנָּךְ בְּאָרְחָא:", "onk_en": "[You will then] enter a land flowing with [<b>producing<\/b>] milk and honey. [I am sending an angel] for I [<b>My Shechina<\/b>] will not go up among you, for you are a stiff-necked people and I may destroy you along the way.”", "pj": "לְאַרַע עַבְדָא חֲלָב וּדְבָשׁ אֲרוּם לֵית אֶפְשַׁר דְּאֵיסַלֵק שְׁכִינַת יְקָרִי מִבֵּינֵיכוֹן בְּרַם לָא יְהֵי יְקָרִי שְׁרֵי בְּמָדוֹר מַשְׁרִיתֵיהוֹן אֲרוּם עַם קְשֵׁי קְדַל אַנְתְּ דִּילְמָא אֵישֵׁיצִינְכוֹן בְּאָרְחָא", "pj_en": "to the land producing milk and honey. For the Shekinah of My Glory cannot go up among you, nor My Majesty dwell in the habitation of their camp, because thou art a hard-necked people, lest I destroy you in the way.", "tj": "", "tj_en": "", "rashi": "<b>אל ארץ זבת חלב ודבש.<\/b> אֲנִי אוֹמֵר לְךָ לְהַעֲלוֹתָם:<br><br><b>כי לא אעלה בקרבך.<\/b> לְכָךְ אֲנִי אוֹמֵר לְךָ וְשָׁלַחְתִּי לְפָנֶיךָ מַלְאָךְ:<br><br><b>כי עם קשה ערף אתה.<\/b> וּכְשֶׁשְּׁכִינָתִי בְקִרְבְּכֶם וְאַתֶּם מַמְרִים בִּי, מַרְבֶּה אֲנִי עֲלֵיכֶם זַעַם:<br><br><b>אכלך.<\/b> לְשׁוֹן כִּלָּיוֹן:", "rashi_en": "ארץ זבת חלב ודבש UNTO A LAND FLOWING WITH MILK AND HONEY do I bid you to bring them up.<br><br>כי לא אעלה בקרבך BECAUSE I WILL NOT GO UP AMONG THEE, therefore I say to thee, I will send an angel before thee.<br><br>כי עם קשה ערף אתה FOR THOU ART A STIFF-NECKED PEOPLE, and if My Shechina were in thy midst and thou rebelledst against Me, I might become exceedingly angry with thee and destroy thee on the way.<br><br>אכלך is an expression for ‘‘destroying”."}, {"ch": 33, "v": 4, "aliyah": 2, "heb": "וַיִּשְׁמַ֣ע הָעָ֗ם אֶת־הַדָּבָ֥ר הָרָ֛ע הַזֶּ֖ה וַיִּתְאַבָּ֑לוּ וְלֹא־שָׁ֛תוּ אִ֥ישׁ עֶדְי֖וֹ עָלָֽיו׃", "onk": "וּשְׁמַע עַמָּא יָת פִּתְגָּמָא בִישָׁא הָדֵין וְאִתְאַבָּלוּ וְלָא שַׁוִּיוּ גְּבַר תִּקּוּן זֵינֵיהּ עֲלוֹהִי:", "onk_en": "When the people heard this bad news they mourned and no man wore his ornaments [crowns].", "pj": "וּשְׁמַע עַמָּא יַת פִּתְגָּמָא בִּישָׁא הָדֵין וְאִתְאַבָּלוּ וְלָא שַׁוִּיוּ גְבַר יַת תִּיקוּן זֵינֵיהּ דְּאִתְיַהַב לְהוֹן בְּסִינַי דְבֵיהּ שְׁמָא רַבָּא וְקַדִּישָׁא חָקִיק וּמְפָרַשׁ עֲלוֹי", "pj_en": "And the people heard this evil word, and mourned; and no man put on his accustomed ornaments, which had been given them at Mount Sinai, and on which was inscribed and set forth the great and holy Name.", "tj": "", "tj_en": "", "rashi": "<b>הדבר הרע.<\/b> שֶׁאֵין הַשְּׁכִינָה שׁוֹרָה וּמְהַלֶּכֶת עִמָּם:<br><br><b>איש עדיו.<\/b> כְּתָרִים שֶׁנִּתְּנוּ לָהֶם בְּחוֹרֵב כְּשֶׁאָמְרוּ נַעֲשֶׂה וְנִשְׁמָע (שבת פ\"ח):", "rashi_en": "הדבר הרע THIS EVIL THING — that the Shechina would not dwell nor go with them.<br><br>איש עדיו [AND NO MAN PUT ON HIM] HIS ORNAMENT — the crowns which were given them on Horeb when they said: (Exodus 24:7) “we shall do and hearken” (Shabbat 88a)."}, {"ch": 33, "v": 5, "aliyah": 2, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה אֱמֹ֤ר אֶל־בְּנֵֽי־יִשְׂרָאֵל֙ אַתֶּ֣ם עַם־קְשֵׁה־עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְקִרְבְּךָ֖ וְכִלִּיתִ֑יךָ וְעַתָּ֗ה הוֹרֵ֤ד עֶדְיְךָ֙ מֵֽעָלֶ֔יךָ וְאֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה־לָּֽךְ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֵימַר לִבְנֵי יִשְׂרָאֵל אַתּוּן עַם קְשֵׁי קְדַל שָׁעָה חֲדָא אֲסַלֵּק <b>שְׁכִנְתִּי<\/b> מִבֵּינָךְ וְאֵשֵׁצִנָּךְ וּכְעַן אַעְדִי תִּקּוּן זֵינָךְ מִנָּךְ <b>וּגְּלֵי קֳדָמַי<\/b> מָה אַעְבֵּד לָךְ:", "onk_en": "Adonoy said to Moshe, “Say to the B’nei Yisrael, ‘You are a stiff-necked people. Were I [<b>My Shechina<\/b>] to go up among you for one moment, I would destroy you. Now remove your ornaments and I know [<b>it will be revealed before Me<\/b>] what to do with you.’”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֵימַר לִבְנֵי יִשְרָאֵל אַתּוּן עַם קְשֵׁי קְדַל שְׁעָא חֲדָא קְלִילָא אֵיסַלֵּק אִיקַר שְׁכִינְתִּי מִבֵּינָךְ וְאֵישֵׁיצִינָךְ וּכְדוֹן אַעֲדֵי תִיקוּן זֵינָךְ מִינָךְ דְּאִתְגְּלֵי קֳדָמַי מַאן אֶעֱבַד לָךְ", "pj_en": "And the Lord said to Mosheh, Speak to the sons of Israel, Ye are a hard-necked people: were the glory of My Shekinah to go up with you, in one little hour I should destroy you. And now put thy accustomed ornaments from thee, that it may be manifest before Me what I may do to thee.", "tj": "", "tj_en": "", "rashi": "<b>רגע אחד אעלה בקרבך וכליתיך.<\/b> אִם אֶעֱלֶה בְקִרְבְּךָ וְאַתֶּם מַמְרִים בִּי בְּקַשְׁיוּת עָרְפְּכֶם אֶזְעֹם עֲלֵיכֶם רֶגַע אֶחָד – שֶׁהוּא שִׁעוּר זַעְמוֹ, שֶׁנֶּ' חֲבִי כִמְעַט רֶגַע עַד יַעֲבָר זָעַם (ישעיהו כ\"ו) – וַאֲכַלֶּה אֶתְכֶם, לְפִיכָךְ טוֹב לָכֶם שֶׁאֶשְׁלַח מַלְאָךְ:<br><br><b>ועתה.<\/b> פֻּרְעָנוּת זוֹ תִּלְקוּ מִיָּד – שֶׁתּוֹרִידוּ עֶדְיְכֶם מֵעֲלֵיכֶם:<br><br><b>ואדעה מה אעשה לך.<\/b> בִּפְקֻדַּת שְׁאָר הֶעָוֹן אֲנִי יוֹדֵעַ מַה שֶּׁבְּלִבִּי לַעֲשׂוֹת לְךָ:", "rashi_en": "רגע אחד אעלה בקרבך וכליתיך WERE I TO GO UP AMONG THEE ONE MOMENT, I SHOULD CONSUME THEE — If I were to go up amongst you and you rebelled against Me in your stiff-neckedness I would be angry with you but one moment — for this is the duration of His wrath (Berakhot 7a), as it is said, (Isaiah 26:20) “Hide thyself for a short moment, until the indignation be passed” — and I would consume you; therefore it is better for you that I should send an angel.<br><br>ועתה AND NOW — This punishment shall be inflicted upon you now, at once, viz., that you should put off your ornaments from you.<br><br>ואדעה מה אעשה לך AND I KNOW WHAT I SHALL DO UNTO THEE — In respect to the visitation for the remainder of the sin which still remains unpunished (cf. Rashi on Exodus 32:34) I know what is in My mind to do unto you."}, {"ch": 33, "v": 6, "aliyah": 2, "heb": "וַיִּֽתְנַצְּל֧וּ בְנֵֽי־יִשְׂרָאֵ֛ל אֶת־עֶדְיָ֖ם מֵהַ֥ר חוֹרֵֽב׃", "onk": "וְאַעְדִּיאוּ בְנֵי יִשְׂרָאֵל יָת תִּקּוּן זֵינֵיהוֹן מִטּוּרָא דְחוֹרֵב:", "onk_en": "The B’nei Yisrael took off their ornaments that they had [worn] at Mount Chorev.", "pj": "וְאִתְרוֹקְנוּ בְּנֵי יִשְרָאֵל מִן תִּיקוּן זֵינֵיהוֹן דִּשְׁמָא רַבָּא מְפָרַשׁ כְּתִיב בְּהוֹן דְּאִתְיַהֲבוּ לְהוֹן לְמַתָּנָה מִן טַוָור חוֹרֵב", "pj_en": "And the sons of Israel were deprived of their usual adornments, on which was written and set forth the great Name; and which had been given them, a gift from Mount Horeb. And Mosheh took and hid them in his tabernacle of instruction.", "tj": "", "tj_en": "", "rashi": "<b>את עדים מהר חורב.<\/b> אֶת הָעֲדִי שֶׁהָיָה בְיָדָם מֵהַר חוֹרֵב:", "rashi_en": "את עדים מהר חורב means THEIR ORNAMENT which they possessed from (מִ, from — in consequence of what happened at) MOUNT HOREB."}, {"ch": 33, "v": 7, "aliyah": 2, "heb": "וּמֹשֶׁה֩ יִקַּ֨ח אֶת־הָאֹ֜הֶל וְנָֽטָה־ל֣וֹ&thinsp;<b>׀<\/b> מִח֣וּץ לַֽמַּחֲנֶ֗ה הַרְחֵק֙ מִן־הַֽמַּחֲנֶ֔ה וְקָ֥רָא ל֖וֹ אֹ֣הֶל מוֹעֵ֑ד וְהָיָה֙ כׇּל־מְבַקֵּ֣שׁ יְהֹוָ֔ה יֵצֵא֙ אֶל־אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֖ר מִח֥וּץ לַֽמַּחֲנֶֽה׃", "onk": "וּמשֶׁה נְסִיב יָת מַשְׁכְּנָא וּפַרְסֵיהּ לֵיהּ מִבָּרָא לְמַשְׁרִיתָא אַרְחֵיק מִן מַשְׁרִיתָא וְקָרֵי לֵיהּ מַשְׁכַּן <b>בֵּית אוּלְפָנָא<\/b> וִיהֵי כָּל דְּתָבַע <b>אוּלְפַן מִן קֳדָם<\/b> יְיָ נְפַק לְמַשְׁכַּן <b>בֵּית אוּלְפָנָא<\/b> מִבָּרָא לְמַשְׁרִיתָא:", "onk_en": "Moshe would take the tent and set it up outside the camp, a distance from the camp, and he called it [the] Tent of Meeting [<b>the house of Instruction<\/b>]. Everyone who sought [<b>instruction from before<\/b>] Adonoy, would go out to the Tent of Meeting [<b>the house of Instruction<\/b>] that was outside the camp.", "pj": "וּמשֶׁה נְסִיבוּנוּן וּטְמִירִינוּן בְּמַשְׁכַּן אוּלְפַן אוֹרַיְיתָא דִּילֵיהּ בְּרַם יַת מַשְׁכְּנָא נָסַב מִתַּמָּן וּפַרְסֵיהּ לֵיהּ מִבָּרָא לְמַשְׁרִיתָא אַרְחִיק יָתֵיהּ מִן מַשִׁירְיַת עַמָּא דְּאִתְנְדוּן תְּרֵין אַלְפִין אַמִּין וַהֲוָה קָרֵי לֵיהּ מַשְׁכַּן בֵּית אוּלְפָנָא וַהֲוֵי כָּל מַאן דַּהֲדַר בִּתְתוּבָא בְּלֵב שְׁלִים קֳדָם יְיָ הֲוָה נָפִיק לְמַשְׁכַּן בֵּית אוּלְפָנָא דְמִבָּרָא לְמַשְׁרִיתָא מוֹדֵי עַל חוֹבֵיהּ וּמַצְלֵי עַל חוֹבֵיהּ וּמַצְלֵי וּמִשְׁתְּבֵק לֵיהּ", "pj_en": "But the tabernacle he took away from thence, and spread it without the camp, and removed it from the camp of the people to the distance of two thousand cubits; and it was called the Tabernacle of the House of Instruction: and it was that when any one turned by repentance with a true heart before the Lord, he went forth to the Tabernacle of the House of Instruction that was without the camp, to confess and pray for the pardon of his sins; and praying he was forgiven.", "tj": "", "tj_en": "", "rashi": "<b>ומשה.<\/b> מֵאוֹתוֹ עָוֹן וָהָלְאָה,<br><br><b>יקח את האהל.<\/b> לְשׁוֹן הוֹוֶה הוּא – לוֹקֵחַ אָהֳלוֹ וְנוֹטֵהוּ מִחוּץ לַמַּחֲנֶה; אָמַר מְנֻדֶּה לָרַב מְנֻדֶּה לַתַּלְמִיד (תנחומא):<br><br><b>הרחק.<\/b> אַלְפַּיִם אַמָּה, כָּעִנְיָן שֶׁנֶּ' אַךְ רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵנָיו כְּאַלְפַּיִם אַמָּה בַּמִּדָּה (יהושע ג'):<br><br><b>וקרא לו.<\/b> וְהָיָה קוֹרֵא לוֹ אֹהֶל מוֹעֵד, הוּא בֵּית וַעַד לִמְבַקְּשֵׁי תוֹרָה:<br><br><b>כל מבקש ה'.<\/b> מִכָּאן לִמְבַקֵּשׁ פְּנֵי זָקֵן כִּמְקַבֵּל פְּנֵי שְׁכִינָה (תנחומא):<br><br><b>יצא אל אהל מועד.<\/b> כְּמוֹ יוֹצֵא. דָּ\"אַ וְהָיָה כָּל מְבַקֵּשׁ ה' – אֲפִלּוּ מַלְאֲכֵי הַשָּׁרֵת כְּשֶׁהָיוּ שׁוֹאֲלִים מְקוֹם שְׁכִינָה, חַבְרֵיהֶם אוֹמְרִים לָהֶם הֲרֵי הוּא בְאָהֳלוֹ שֶׁל מֹשֶׁה:", "rashi_en": "ומשה AND MOSES, from the time of the sin and henceforth,<br><br>יקח את האהל USED TO TAKE THE TENT — יקח expresses an action continually going on — he used to take his tent and pitch it without the camp. He said, “One who has been placed under an interdict by the Master must be placed under an interdict by His disciple also” (Since God had stated that He would not dwell amongst the people, Moses, the disciple, also felt compelled to remove from their midst) (Midrash Tanchuma, Ki Tisa 27).<br><br>הרחק DISTANT [FROM THE CAMP] — two thousand cubits, just as it is stated, (Joshua 3:4) Yet there shall be a space between you (the Israelites) and it (the Ark) about 2,000 cubits by measure” (Midrash Tanchuma, Ki Tisa 27).<br><br>וקרא לו AND HE CALLED IT — This does not mean that he so named it once for all but that whenever he spoke of it he used to call it the tent of meeting, i. e. a meeting-place for those who sought instruction in the Torah.<br><br>כל מבקש ה׳ EVERY ONE WHO SOUGHT THE LORD — Hence (from the fact that anyone who visited Moses is described here as “one who seeks the Lord”) we may learn that he who makes a call on (Hebrew: seeks) a scholar (זקן is a Rabbinical term for a wise man; cf. Kiddushin 32b: אין זקן אלא חכם) may be regarded as paying his respects to the Divine Presence (Midrash Tanchuma, Ki Tisa 27).<br><br>יצא אל אהל מועד WENT OUT UNTO THE APPOINTED TENT — יֵצֵא (the imperfect) has here the meaning of יוֹצֵא (the participle: cf. Rashi on יקח וכו׳), i. e. he used to go out. Another explanation of והיה כל מבקש ה׳ is: The word כל, “every one”, implies: even the ministering angels used to go out unto the appointed tent; whenever these enquired where was the place of the Divine Glory their fellow-angels used to answer them: See, He (God) is in the tent of Moses."}, {"ch": 33, "v": 8, "aliyah": 2, "heb": "וְהָיָ֗ה כְּצֵ֤את מֹשֶׁה֙ אֶל־הָאֹ֔הֶל יָק֙וּמוּ֙ כׇּל־הָעָ֔ם וְנִ֨צְּב֔וּ אִ֖ישׁ פֶּ֣תַח אׇהֳל֑וֹ וְהִבִּ֙יטוּ֙ אַחֲרֵ֣י מֹשֶׁ֔ה עַד־בֹּא֖וֹ הָאֹֽהֱלָה׃", "onk": "וַהֲוָה כַּד נְפַק משֶׁה לְמַשְׁכְּנָא קַיְּמִין כָּל עַמָּא וּמִתְעַתְּדִין גְּבַר בִּתְרַע מַשְׁכְּנָא וּמִסְתַּכְּלִין אֲחוֹרֵי משֶׁה עַד דְּעָלֵל לְמַשְׁכְּנָא:", "onk_en": "Whenever Moshe went out to the tent, all the people would rise, and each person would stand at the entrance of his tent; and they would gaze after Moshe, until he had gone into the tent.", "pj": "וַהֲוָה כַּד הֲוָה נָפִיק משֶׁה מִן מַשְׁרִיתָא וְאָזֵיל לְמַשְׁכְּנָא קַיְימִין כָּל רַשִׁיעֵי עַמָּא וּמִתְעַתְּדִין גְּבַר בִּתְרַע מַשְׁכְּנֵיהּ וּמִסְתַּכְּלִין בְּעֵינָא בִּישָׁא אֲחוּרֵי משֶׁה עַד זְמַן מֵיעֲלֵיהּ לְמַשְׁכְּנָא", "pj_en": "And it was when Mosheh passed forth from the camp to go to the tabernacle that all the wicked people arose, and stood, every man at the door of his tent, and looked with the evil eye after Mosheh, when he entered the tabernacle.", "tj": "", "tj_en": "", "rashi": "<b>והיה.<\/b> לְשׁוֹן הוֹוֶה:<br><br><b>כצאת.<\/b> מֹשֶׁה מִן הַמַּחֲנֶה לָלֶכֶת <b>אל האהל<\/b>:<br><br><b>יקומו כל העם.<\/b> עוֹמְדִים מִפָּנָיו, וְאֵין יוֹשְׁבִין עַד שֶׁנִּתְכַּסָּה מֵהֶם:<br><br><b>והביטו אחרי משה.<\/b> לְשֶׁבַח – אַשְׁרֵי יְלוּד אִשָּׁה שֶׁכָּךְ מֻבְטָח שֶׁהַשְּׁכִינָה תִכָּנֵס אַחֲרָיו לְפֶתַח אָהֳלוֹ:", "rashi_en": "והיה — This expresses an action continually going on (“and it used to be”),<br><br>כצאת משה WHEN MOSES WENT OUT from the camp in order to go אל האהל INTO THE TENT, יקומו כל העם ALL THE PEOPLE ROSE UP — they used to stand up before him and did not sit down until he vanished from their sight (Hebrew: was hidden from them).<br><br>והביטו אחרי משה AND THEY LOOKED AFTER MOSES — Not sneeringly but out of admiration; they exclaimed: Happy is the human being (Hebrew: one born of woman) who is so sure that the Shechina will enter the door of his tent after him (cf. Kiddushin 33b; Midrash Tanchuma, Ki Tisa 27, Exodus Rabbah 51:6).<br><br><b>And they would gaze after Moshe —<\/b> in an admiring way, [saying, in effect:] “Fortunate is one born of woman who is assured that the Shechinah will follow him into the entranceway of his tent.” "}, {"ch": 33, "v": 9, "aliyah": 2, "heb": "וְהָיָ֗ה כְּבֹ֤א מֹשֶׁה֙ הָאֹ֔הֱלָה יֵרֵד֙ עַמּ֣וּד הֶֽעָנָ֔ן וְעָמַ֖ד פֶּ֣תַח הָאֹ֑הֶל וְדִבֶּ֖ר עִם־מֹשֶֽׁה׃", "onk": "וַהֲוָה כַּד עָלֵל משֶׁה לְמַשְׁכְּנָא נָחִית עַמּוּדָא דַּעֲנָנָא וְקָאֵם בִּתְרַע מַשְׁכְּנָא <b>וּמִתְמַלֵּל<\/b> עִם משֶׁה:", "onk_en": "When Moshe had gone into the tent, the Pillar of Cloud would descend and stand at the entrance of the tent, and [Adonoy] would speak to [<b>Himself with<\/b>] Moshe.", "pj": "וַהֲוָה כַּד אָעֵיל משֶׁה לְמַשְׁכְּנָא נָחִית עַמּוּדָא דַּעֲנָן יְקָרָא וְקָאֵי בִּתְרַע מַשְׁכְּנָא וּמִתְמַלֵּיל מֵימְרָא דַיְיָ עִם משֶׁה", "pj_en": "And it came to pass when Mosheh had gone into the tabernacle, the column of the glorious Cloud descended and stood at the door of the tabernacle; and the Word of the Lord spake with Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ודבר עם משה.<\/b> כְּמוֹ וּמְדַבֵּר עִם מֹשֶׁה; תַּרְגּוּמוֹ וּמִתְמַלֵּל עִם מֹשֶׁה שֶׁהוּא כְּבוֹד שְׁכִינָה, כְּמוֹ וַיִּשְׁמַע אֶת הַקּוֹל מִדַּבֵּר אֵלָיו (במדבר ז'), וְאֵינוֹ קוֹרֵא מְדַבֵּר אֵלָיו; כְּשֶׁהוּא קוֹרֵא מִדַּבֵּר, פִּתְרוֹנוֹ הַקּוֹל מִדַּבֵּר בֵּינוֹ לְבֵין עַצְמוֹ, וְהַהֶדְיוֹט שׁוֹמֵעַ מֵאֵלָיו, וּכְשֶׁהוּא קוֹרֵא מְדַבֵּר מַשְׁמַע שֶׁהַמֶּלֶךְ מְדַבֵּר עִם הַהֶדְיוֹט:", "rashi_en": "ודבר עם משה — This means the same as ומדבר עם משה AND HE USED TO SPEAK WITH MOSES (The verb ודבר expresses the idea of an action always going on as Rashi has explained the preceding verbs). The Targum renders it by ומתמלל עם משה (Hithpeal) i. e. He used to speak to Himself with (in the presence of) Moses — which is an expression of respect used with reference to the Shechinah. A similar Hebrew expression is, (Numbers 7:89) “Then he heard the voice מִדַּבֵּר to him” (= מתדבר, with assimilated ת), and it does not read there, מְדַבֵּר, “speaking to him”. Where the reading is מִדַּבֵּר its interpretation is: The voice was speaking by itself (i. e. it was not directed to any particular person) and the ordinary man naturally heard it (because he was there); but where the reading is מְדַבֵּר, it implies that the King was conversing with the ordinary man."}, {"ch": 33, "v": 10, "aliyah": 2, "heb": "וְרָאָ֤ה כׇל־הָעָם֙ אֶת־עַמּ֣וּד הֶֽעָנָ֔ן עֹמֵ֖ד פֶּ֣תַח הָאֹ֑הֶל וְקָ֤ם כׇּל־הָעָם֙ וְהִֽשְׁתַּחֲו֔וּ אִ֖ישׁ פֶּ֥תַח אׇהֳלֽוֹ׃", "onk": "וַחֲזָן כָּל עַמָּא יָת עַמּוּדָא דַעֲנָנָא קָאֵם בִּתְרַע מַשְׁכְּנָא וְקַיְּמִין כָּל עַמָּא וְסָגְדִין גְּבַר בִּתְרַע מַשְׁכְּנֵיהּ:", "onk_en": "When all the people saw the Pillar of Cloud, standing at the entrance of the tent; all the people rose and prostrated themselves, each man at the entrance of his tent.", "pj": "וְחָמַן כָּל עַמָּא יַת עַמּוּדָא דַעֲנָנָא קָאִי בִּתְרַע מַשְׁכְּנָא וּמִן יַד קַיְימִין כָּל עַמָּא וְסַגְדִין כָּל קְבֵל מַשְׁכְּנָא כִּדְקַיְימִין גְּבַר בִּתְרַע מַשְׁכְּנֵיהּ", "pj_en": "And all the people beheld the column of the Cloud standing at the door of the tabernacle, and the whole people at once rose up and worshipped towards the tabernacle, standing every man at the door of his tent.", "tj": "", "tj_en": "", "rashi": "<b>והשתחוו.<\/b> לַשְּׁכִינָה:", "rashi_en": "והשתחוו AND THEY PROSTRATED THEMSELVES to the Shechinah."}, {"ch": 33, "v": 11, "aliyah": 2, "heb": "וְדִבֶּ֨ר יְהֹוָ֤ה אֶל־מֹשֶׁה֙ פָּנִ֣ים אֶל־פָּנִ֔ים כַּאֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל־רֵעֵ֑הוּ וְשָׁב֙ אֶל־הַֽמַּחֲנֶ֔ה וּמְשָׁ֨רְת֜וֹ יְהוֹשֻׁ֤עַ בִּן־נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִתּ֥וֹךְ הָאֹֽהֶל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וּמִתְמַלֵּל<\/b> יְיָ עִם משֶׁה <b>מַמְלַל עִם מַמְלַל<\/b> כְּמָא דִּמְמַלֵּל גְּבַר עִם חַבְרֵיהּ וְתָב לְמַשְׁרִיתָא וּמְשׁוּמְשָׁנֵיהּ יְהוֹשֻׁעַ בַּר נוּן עוּלֵימָא לָא עֲדֵי מִגּוֹ מַשְׁכְּנָא:", "onk_en": "Adonoy spoke to [<b>Himself with<\/b>] Moshe face to face [<b>word to word<\/b>], just as a man speaks to his friend. and [Moshe then] would return to the camp, but his youthful attendant, Yehoshua, son of Nun, did not leave the tent.", "pj": "וּמִתְמַלֵּיל יְיָ עִם משֶׁה מַמְלֵל קְבֵל מַמְלֵל קַל דִּבּוּרָא הֲוָה שָׁמַע בְּרַם זִיו אַפִּין לָא הֲוָה חָמֵי הֵיכְמָא דִמְמַלֵּיל גְּבַר עִם חַבְרֵיהּ וּמִן בָּתַר דְּאִסְתַּלֵּק קַל דִּבּוּרָא תָּאִיב לְמַשְׁרִיתָא וּמִתְנֵי פִּתְגָמַיָא לִכְנִישְׁתְּהוֹן דְּיִשְרָאֵל בְּרַם מְשׁוּמְשָׁנֵיהּ יְהוֹשֻׁעַ בַּר נוּן הֲוָה טְלֵי לָא הֲוַת זֵייעַ מִגּוֹ מַשְׁכְּנֵיהּ", "pj_en": "And the Lord spake with Mosheh word for word,- the voice of the Word (dibbura) was heard, but the Majesty of the Presence was not seen,- in the way that a man converseth with his companion: and after the speaking voice had ascended, he returned to the camp, and delivered the word to the congregation of Israel. But his minister, Jehoshua bar Nun, a young man, removed not from the tabernacle.", "tj": "וְשַׁמְשֵׁיהּ יְהוֹשֻׁעַ בַּר נוּן טְלֵי זְעֵיר לָא פְּסַק מִגּוֹ מַשְׁכְּנָא:", "tj_en": "But his minister, Jehoshua bar Nun, a young man, passed not from within the tabernacle.", "rashi": "<b>ודבר ה' אל משה פנים אל פנים.<\/b> וּמִתְמַלֵּל עִם מֹשֶׁה:<br><br><b>ושב אל המחנה.<\/b> לְאַחַר שֶׁנִּדְבַּר עִמּוֹ הָיָה מֹשֶׁה שָׁב אֶל הַמַּחֲנֶה וּמְלַמֵּד לַזְּקֵנִים מַה שֶּׁלָּמַד; וְהַדָּבָר הַזֶּה נָהַג מֹשֶׁה מִיּוֹם הַכִּפּוּרִים עַד שֶׁהוּקַם הַמִּשְׁכָּן, וְלֹא יוֹתֵר, שֶׁהֲרֵי בְשִׁבְעָה עָשָׂר בְּתַמּוּז נִשְׁתַּבְּרוּ הַלּוּחוֹת, וּבְי\"ח שָׂרַף אֶת הָעֵגֶל וְדָן אֶת הַחוֹטְאִים, וּבְי\"ט עָלָה שֶׁנֶּאֱמַר וַיְהִי מִמָּחֳרָת וַיֹּאמֶר מֹשֶׁה אֶל הָעָם וְגוֹ' (שמות ל\"ב), וְעָשָׂה שָׁם אַרְבָּעִים יוֹם וּבִקֵּשׁ רַחֲמִים, שֶׁנֶּ' וָאֶתְנַפַּל לִפְנֵי ה' וְגוֹ' (דברים ט'), וּבְרֹאשׁ חֹדֶשׁ אֱלוּל נֶאֱמַר לוֹ וְעָלִיתָ בַבֹּקֶר אֶל הַר סִינַי (שמות ל\"ד), לְקַבֵּל לוּחוֹת הָאַחֲרוֹנוֹת – וְעָשָׂה שָׁם מ' יוֹם, שֶׁנֶּאֱמַר בָּהֶם וְאָנֹכִי עָמַדְתִּי בָהָר כַּיָּמִים הָרִאשׁוֹנִים וְגוֹ' – מָה הָרִאשׁוֹנִים בְּרָצוֹן אַף הָאַחֲרוֹנִים בְּרָצוֹן, אֱמֹר מֵעַתָּה אֶמְצָעִיִּים הָיוּ בְכַעַס – בְּעֲשָׂרָה בְּתִשְׁרֵי נִתְרַצָּה הַקָּבָּ\"ה לְיִשְׂרָאֵל בְּשִׂמְחָה וּבְלֵב שָׁלֵם, וְאָמַר לוֹ לְמֹשֶׁה סָלַחְתִּי, וּמָסַר לוֹ לוּחוֹת אַחֲרוֹנוֹת, וְיָרַד וְהִתְחִיל לְצַוּוֹתָם עַל מְלֶאכֶת הַמִּשְׁכָּן, וַעֲשָׂאוּהוּ עַד אֶחָד בְּנִיסָן, וּמִשֶּׁהוּקַם לֹא נִדְבַּר עִמּוֹ עוֹד אֶלָּא מֵאֹהֶל מוֹעֵד (תנחומא):<br><br><b>ושב אל המחנה.<\/b> תַּרְגּוּמוֹ וְתָיֵב לְמַשְׁרִיתָא, לְפִי שֶׁהוּא לְשׁוֹן הוֹוֶה, וְכֵן כָּל הָעִנְיָן, <b>וראה כל העם<\/b> – וְחָזַן, <b>ונצבו<\/b> – וְקָיְמִין, <b>והביטו<\/b> – וּמִסְתַּכְּלִין, <b>והשתחוו<\/b> – וְסָגְדִין. וּמִדְרָשׁוֹ: <b>ודבר ה' אל משה<\/b> – שֶׁיָּשׁוּב אֶל הַמַּחֲנֶה, אָמַר לוֹ אֲנִי בְכַעַס וְאַתָּה בְכַעַס, אִם כֵּן מִי יַקְרִיבֵם? (תנחומא):", "rashi_en": "ודבר ה׳ אל משה פנים אל פנים AND THE LORD SPAKE UNTO MOSES FACE TO FACE — Here too (as in v. 9) in spite of the fact that the text states “face to face” the Targum is: ומתמלל עם משה‎.<br><br>ושב אל המחנה .( AND HE RETURNED INTO THE CAMP — After God had conversed with him, Moses used to return to the camp and teach the elders what he had learned. This Moses practised from the day of Atonement until the Tabernacle was set up, but no longer. For on the seventeenth of Tammuz the tablets were broken, on the eighteenth he burnt the calf and punished the of fenders, on the nineteenth he ascended the mountain, as it is said (Exodus 32:30) “And it came to pass on the morrow (the day after he had punished the wrongdoers; cf. vv. 26—29), that Moses said unto the people”, [Ye have sinned a great sin and now I will go up to the Lord]”. There he spent forty days and sought mercy for the people, as it is said, (Deuteronomy 9:18) “And I threw myself down before the Lord [as at the first, forty days and forty nights]”. These terminated on the last day of Ab (there were 11 days from the 19th to the 29th of Tammuz therefore 29 days in Ab complete the forty) and he then returned to the people. On the first day of the New Moon of Ellul it was said to him, (Exodus 34:2) “And be ready in the morning] and go up in the morning unto mount Sinai” — to receive the second tablets. He again spent there the forty days of which it is stated, (Deuteronomy 10:10) “[And I stayed in the mountain, according to the first, days, [forty days and forty nights]”. The words כימים הראשונים, “like the first days”, cannot refer to the number of days for this is stated immediately afterwards; they are to be joined with עמדתי — I stayed in the same state as on the first days: How were the first forty days passed? In God’s good-will (because the Israelites had not yet sinned)! So, too, the last forty days were passed in God’s good-will — from which you must admit that the intervening forty days were passed in God’s anger. On the tenth of Tishri God became reconciled with Israel in joy and perfect affection and said to Moses: “I have forgiven!” and handed him over the second tablets, whereupon Moses went down and began to command them concerning the work of the Tabernacle (cf. Midrash Tanchuma, Ki Tisa 31; Seder Olam 6; Rashi on Exodus 18:13, Deuteronomy 9:18 and also Taanit 36b). They were occupied in its construction until the first of Nisan and from the time when it was set up God did not converse with him any more except from the tent of meeting.<br><br>ושב אל המחנה AND HE RETURNED TO THE CAMP — The translation in the Targum is: וְתָיִב למשריתא (a participle) “and he used to return to the camp”, because (as explained above) it denotes continuous action. Similarly, he translates all the verbs occuring in this section by participles: וראה כל העם he renders by ונצבו ;וחזן by והביטו ;וקימין by והשתחוו ;ומסתכלין by וסגדין. The Midrash explains ודבר ה' אל משה thus: And the Lord spake to Moses that he should return to the camp. He said to him: I am angry and you are angry; if this is to remain so, who will attract them to Me again? (cf. Midrash Tanchuma, Ki Tisa 27 and Berakhot 63b)."}, {"ch": 33, "v": 12, "aliyah": 3, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶל־יְהֹוָ֗ה רְ֠אֵ֠ה אַתָּ֞ה אֹמֵ֤ר אֵלַי֙ הַ֚עַל אֶת־הָעָ֣ם הַזֶּ֔ה וְאַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔נִי אֵ֥ת אֲשֶׁר־תִּשְׁלַ֖ח עִמִּ֑י וְאַתָּ֤ה אָמַ֙רְתָּ֙ יְדַעְתִּ֣יךָֽ בְשֵׁ֔ם וְגַם־מָצָ֥אתָ חֵ֖ן בְּעֵינָֽי׃", "onk": "וַאֲמַר משֶׁה <b>קֳדָם<\/b> יְיָ חֲזֵי דְאַתְּ אָמַר לִי אַסֵּיק יָת עַמָּא הָדֵין וְאַתְּ לָא הוֹדַעְתַּנִי יָת דִּי תִשְׁלַח עִמִּי וְאַתְּ אָמַרְתְּ <b>רַבִּיתָךְ<\/b> בְּשׁוּם וְאַף אַשְׁכַּחְתָּא רַחֲמִין <b>קֳדָמָי<\/b>:", "onk_en": "Moshe said to [<b>before<\/b>] Adonoy, “Behold, You say to me, ‘Lead this people up [to the land of Canaan],’ but You did not let me know whom You would send with me. You [also] said, ‘I know [<b>exalted<\/b>] you by name and you have also found favor in My eyes [<b>before Me<\/b>].’", "pj": "וַאֲמַר משֶׁה קֳדָם יְיָ חָמֵי מַה דְּאַנְתְּ אָמַר לִי סַלֵיק יַת עַמָּא הָדֵין וְאַנְתְּ לָא אוֹדַעְתָּנִי יַת מַאן דְּאַנְתְּ שְׁלַח עִמִּי וְאַנְתְּ בְּמֵימְרָךְ אָמַרְתְּ מַנֵית יָתָךְ בְּשׁוּם טַב וְאוּף אַשְׁכַּחְתְּ רַחֲמִין קֳדָמָי", "pj_en": "And Mosheh said before the Lord, Lo, what hast Thou said to me, Take this people up? but Thou hast not made me to know whom Thou wilt send with me. By Thy Word Thou hast said, I have ordained thee with a goodly name, and thou hast found favour before Me.", "tj": "", "tj_en": "", "rashi": "<b>ראה אתה אמר אלי.<\/b> רְאֵה – תֵּן עֵינֶיךָ וְלִבְּךָ עַל דְּבָרֶיךָ:<br><br><b>אתה אמר אלי וגו' ואתה לא הודעתני וגו'.<\/b> וַאֲשֶׁר אָמַרְתָּ לִי הִנֵּה אָנֹכִי שֹׁלֵחַ מַלְאָךְ, אֵין זוֹ הוֹדָעָה, שֶׁאֵין אֲנִי חָפֵץ בָּהּ:<br><br><b>ואתה אמרת ידעתיך בשם.<\/b> הִכַּרְתִּיךָ מִשְּׁאָר בְּנֵי אָדָם בְּשֵׁם חֲשִׁיבוּת, שֶׁהֲרֵי אָמַרְתָּ לִי הִנֵּה אָנֹכִי בָּא אֵלֶיךָ בְּעַב הֶעָנָן וְגוֹ' וְגַם בְּךָ יַאֲמִינוּ לְעוֹלָם (שמות י\"ט):", "rashi_en": "ראה אתה אמר אלי SEE. THOU SAYEST UNTO ME — Set Thy eyes and Thy heart to Thy own words (Think for a moment of what Thou, Thyself, hast told me)<br><br>אתה אמר אלי וגו׳ ואתה לא הודעתני וגו׳ THOU SAYEST UNTO ME [BRING UP THIS PEOPLE] AND NEVERTHELESS THOU HAST NOT LET ME KNOW [WHOM THOU WILT SEND WITH ME] — for what You have said to me (Exodus 23:20) “And I will send an angel before thee” is not “letting me know”, for I am not satisfied with it.<br><br>ואתה אמרת ידעתיך בשם YET THOU HAST SAID, I HAVE KNOWN THEE BY NAME — I have distinguished you from all other human beings by a characteristic (שם) which shows my importance in Thy eyes, for, see, Thou hast said to me, (Exodus 19:9) “Behold, I come unto thee in a thick cloud etc.… and also in thee they shall believe for ever”."}, {"ch": 33, "v": 13, "aliyah": 3, "heb": "וְעַתָּ֡ה אִם־נָא֩ מָצָ֨אתִי חֵ֜ן בְּעֵינֶ֗יךָ הוֹדִעֵ֤נִי נָא֙ אֶת־דְּרָכֶ֔ךָ וְאֵדָ֣עֲךָ֔ לְמַ֥עַן אֶמְצָא־חֵ֖ן בְּעֵינֶ֑יךָ וּרְאֵ֕ה כִּ֥י עַמְּךָ֖ הַגּ֥וֹי הַזֶּֽה׃", "onk": "וּכְעַן אִם <b>כְּעַן<\/b> אַשְׁכָּחִית רַחֲמִין <b>קֳדָמָךְ<\/b> הוֹדַעְנִי <b>כְעַן יָת אוֹרַח טוּבָךְ<\/b> וְאִדַּע <b>רַחֲמָךְ<\/b> בְּדִיל דְּאַשְׁכַּח רַחֲמִין <b>קֳדָמָךְ וּגְלֵי קָדָמָךְ<\/b> אֲרֵי עַמָּךְ עַמָּא הָדֵין:", "onk_en": "Now, please, if I have [<b>now<\/b>] found favor in Your eyes [<b>before You<\/b>], please [<b>now<\/b>] let me know Your [<b>the way of Your goodness<\/b>] way, so that I will know You [<b>Your love<\/b>], that I may find favor in Your eyes [<b>before You<\/b>]; and [also] consider [<b>it will be revealed before You<\/b>] that this nation is [indeed] Your people.”", "pj": "וּכְדוּן אִין בְּבָעוּ אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ אוֹדְעַנִי כְּדוּן יַת אוֹרַח טוּבָךְ וְאִנְדַע רַחֲמָךְ הֵיךְ אַנְתְּ מְדַבֵּר עִם בְּנֵי נְשָׁא זַכָּאִין מָטֵי לְהוֹן הֵי כְחַיְיבִין וּלְחַיְיבִין הֵי כְזַכָּאִין וְתוּב זַכָּאִין מָטֵי לְהוֹן הֵי כְזָכְוַותְהוֹן וְחַיְיבִין מָטֵי לְהוֹן הֵי כְחוֹבֵיהֶן מִן בִּגְלַל דְּאַשְׁכַּח רַחֲמִין קֳדָמָךְ וּגְלֵי קֳדָמָךְ אֲרוּם עַמָּךְ עַמָּא הָדֵין", "pj_en": "But now I pray, if I have found mercy before Thee, make me to know the way of Thy goodness, to understand Thy mercy when in Thy dealing with just men it falleth to them as it (falleth) to the guilty, and to the guilty as to the just; but, on the contrary how it (indeed) befalleth the just according to their righteousness and the guilty according to their guilt: that I may find mercy before Thee, and it be made manifest by Thee that this people is Thy people.", "tj": "", "tj_en": "", "rashi": "<b>ועתה וגו'.<\/b> אִם אֱמֶת שֶׁמָּצָאתִי חֵן בְּעֵינֶיךָ <b>הודעני נא את דרכך.<\/b> מַה שָּׂכָר אַתָּה נוֹתֵן לְמוֹצְאֵי חֵן בְּעֵינֶיךָ:<br><br><b>ואדעך למען אמצא חן בעיניך.<\/b> וְאֵדַע בָּזוֹ מִדַּת תַּגְמוּלֶיךָ – מַה הִיא מְצִיאַת חֵן שֶׁמָּצָאתִי בְּעֵינֶיךָ; וּפִתְרוֹן <b>למען אמצא חן<\/b> – לְמַעַן אַכִּיר כַּמָּה שְׂכַר מְצִיאַת הַחֵן:<br><br><b>וראה כי עמך הגוי הזה.<\/b> שֶׁלֹּא תֹאמַר וְאֶעֱשֶׂה אוֹתְךָ לְגוֹי גָּדוֹל וְאֶת אֵלֶּה תַּעֲזֹב, רְאֵה כִּי עַמְּךָ הֵם מִקֶּדֶם, וְאִם בָּהֶם תִּמְאַס, אֵינִי סוֹמֵךְ עַל הַיּוֹצְאִים מֵחֲלָצַי שֶׁיִּתְקַיְּמוּ, וְאֶת תַּשְׁלוּם הַשָּׂכָר שֶׁלִּי בָּעָם הַזֶּה תּוֹדִיעֵנִי; וְרַבּוֹתֵינוּ דָרְשׁוּ בְּמַסֶּכֶת בְּרָכוֹת (דף ז'), וַאֲנִי לְיַשֵּׁב הַמִּקְרָאוֹת עַל אָפְנֵיהֶם וְעַל סִדְרָם בָּאתִי:", "rashi_en": "ועתה וגו׳ NOW THEREFORE etc. — If it is true that I have found favour in Thy eyes, הודיעני נא את דרכך LET ME KNOW THY WAY — let me know what is the reward which Thou givest to those who find favour in Thine eyes.<br><br>ואדעך למען אמצא חן בעיניך means, that I may know by this (by Your letting me know Your way) the nature of the reward You bestow — what is this “finding of grace” which You have granted to me (Hebrew: which I found in Your eyes). The explanation of למען אמצא חן accordingly is: that I may find out (אמצא) how great is the reward attendant on this “finding of grace”.<br><br>וראה כי עמך הגוי הזה AND CONSIDER THAT THIS NATION IS THY PEOPLE so that You should not say, as You have said, (Exodus 32:10) “And I will make thee a great nation”, whilst these (the whole people) You will abandon! Consider that they are Your nation from of old, and if You reject them, surely I cannot rely upon it that those who are born of me will endure — rather let me know through this people the reward that is to be paid me (by sparing them). Our Rabbis have given a Midrashic explanation of this in Treatise Berakhot 7a but I come (my purpose is) to explain the verses in a manner fitting to them and in their context."}, {"ch": 33, "v": 14, "aliyah": 3, "heb": "וַיֹּאמַ֑ר פָּנַ֥י יֵלֵ֖כוּ וַהֲנִחֹ֥תִי לָֽךְ׃", "onk": "וַאֲמַר <b>שְׁכִנְתִּי<\/b> תְהַךְ וְאָנִיחַ לָךְ:", "onk_en": "He [God] said, “My Presence [<b>Shechina<\/b>] will go [with you] and I will accede to you[r request].”", "pj": "וַאֲמַר אַמְתֵּן עַד דִּיהֲכוּן סְבַר אַפִּין דְּרוּגְזָא וּמִן בָּתַר כְּדוֹן אָנוּחַ לָךְ", "pj_en": "And He said, Await, until the face of My displeasure shall have gone away, and afterward I will give thee rest.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר פני ילכו.<\/b> כְּתַרְגּוּמוֹ – לֹא אֶשְׁלַח עוֹד מַלְאָךְ, אֲנִי בְעַצְמִי אֵלֵךְ, כְּמוֹ וּפָנֶיךָ הוֹלְכִים בַּקְּרָב (שמואל ב י״ז:י״א):", "rashi_en": "ויאמר פני ילכו AND HE SAID, MY FACE SHALL GO WITH THEE Understand this as the Targum renders it: My Shechinah will go — I will no more send an angel with you, but I Myself will go. פנים here has the sense of “Self” as in (II Samuel 17:11) “and that thou go in the battle in thine own person (פניך)”."}, {"ch": 33, "v": 15, "aliyah": 3, "heb": "וַיֹּ֖אמֶר אֵלָ֑יו אִם־אֵ֤ין פָּנֶ֙יךָ֙ הֹלְכִ֔ים אַֽל־תַּעֲלֵ֖נוּ מִזֶּֽה׃", "onk": "וַאֲמַר <b>קֳדָמוֹהִי<\/b> אִם לֵית <b>שְׁכִנְתָּךְ<\/b> מְהַלְּכָא בֵינָנָא לָא תַסְקִינָנָא מִכָּא:", "onk_en": "And he [Moshe] said to [<b>before<\/b>] Him, “If Your Presence [<b>Shechina<\/b>] does not go [with us] do not make us leave from this [place].", "pj": "וַאֲמַר לֵיהּ אִין לֵית אַפִּין מְהַלְכָא מִינָנָא לָא תְסַלְקִינָנָא מִיכָּא בִּסְבַר אַפִּין דְּרוּגְזָא", "pj_en": "And he said to Him, If Thy wrath go not from us, suffer us not to go up from hence under the frown of Thy displeasure.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר אליו.<\/b> בְּזוֹ אֲנִי חָפֵץ, כִּי עַל יְדֵי מַלְאָךְ אַל תַּעֲלֵנוּ מִזֶּה:", "rashi_en": "‎ויאמר אליו AND HE SAID UNTO HIM — This is what I desired: for if it is to be by an angel rather do not bring us up from here."}, {"ch": 33, "v": 16, "aliyah": 3, "heb": "וּבַמֶּ֣ה&thinsp;<b>׀<\/b> יִוָּדַ֣ע אֵפ֗וֹא כִּֽי־מָצָ֨אתִי חֵ֤ן בְּעֵינֶ֙יךָ֙ אֲנִ֣י וְעַמֶּ֔ךָ הֲל֖וֹא בְּלֶכְתְּךָ֣ עִמָּ֑נוּ וְנִפְלִ֙ינוּ֙ אֲנִ֣י וְעַמְּךָ֔ מִכׇּ֨ל־הָעָ֔ם אֲשֶׁ֖ר עַל־פְּנֵ֥י הָאֲדָמָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבַמֶּה יִתְיַדַּע <b>הָכָא<\/b> אֲרֵי אַשְׁכָּחִית רַחֲמִין <b>קֳדָמָךְ<\/b> אֲנָא וְעַמָּךְ הֲלָא בְּמֵהַךְ <b>שְׁכִנְתָּךְ<\/b> עִמָּנָא <b>וְיִתְעַבְּדַן לָנָא פְרִישָׁן<\/b> לִי וּלְעַמָּךְ <b>מְשַׁנֵּי<\/b> מִכָּל עַמָּא דִּי עַל אַפֵּי אַרְעָא:", "onk_en": "And how will it be known [<b>here<\/b>]. that I have found favor in Your eyes [<b>before You<\/b>]—I and Your people—only if You [<b>Your Shechina<\/b>] go with us, so that we will be distinguished [<b>wonders will be done for us<\/b>]—I and Your people—[<b>that they will be distinct<\/b>] from every [other] people on the face of the earth.”", "pj": "וּבְמָה יִתְיְדַע כְּדוּן אֲרוּם אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ אֲנָא וְעַמָּךְ אֱלָהֵן בְּמַלָלוּת שְׁכִינְתָּךְ עִמָּן וְיִתְעַבְדָן לָנָא פְּרִישָׁן בְּסַלְקוּתָךְ רוּחַ נְבוּאָה מֵיעִילַוֵי אוּמַיָא וּתְהֵי מִתְמַלֵּיל בְּרוּחַ קוּדְשָׁא לִי וּלְעַמָּךְ מִן בִּגְלַל דְּנֵיהֵי מְשַׁנְיֵי מִכָּל עַמְמַיָא דְעַל אַנְפֵּי אַרְעָא", "pj_en": "In what will it be known that I have found mercy before Thee but in the converse of Thy Shekinah with us, that distinguishing signs may be wrought for us, in the withholdment of the Spirit of prophecy from the nations, and by Thy speaking by the Holy Spirit to me and to Thy people, that we may be distinguished from all the peoples upon the face of the earth?", "tj": "", "tj_en": "", "rashi": "<b>ובמה יודע אפוא.<\/b> יִוָּדַע מְצִיאַת הַחֵן, <b>הלוא בלכתך עמנו.<\/b> וְעוֹד דָּבָר אֲנִי שׁוֹאֵל מִמְּךָ, שֶׁלֹּא תַשְׁרֶה שְׁכִינָתְךָ עוֹד עַל אֻמּוֹת הָעוֹלָם.<br><br><b>ונפלינו אני ועמך.<\/b> וְנִהְיֶה מֻבְדָּלִים בַּדָּבָר הַזֶּה מִכָּל הָעָם (ברכות ז'), כְּמוֹ וְהִפְלָה ה' בֵּין מִקְנֵה יִשְׂרָאֵל וְגוֹ' (שמות ט'):", "rashi_en": "ובמה יודע אפוא FOR WHEREIN SHALL IT BE KNOWN HERE [THAT I AND THY PEOPLE HAVE FOUND FAVOUR IN THY EYES] — i. e. wherein shall the “finding of favour” be known, הלא בלכתך עמנו IF NOT BY YOUR GOING WITH US!? And yet another thing do I ask You: that You should not let Your Shechinah rest upon the other peoples of the world (Berakhot 7a).<br><br>ונפלינו אני ועמך SO SHALL WE BE DISTINGUISHED, I AND THY PEOPLE — through this very thing we shall become different from all the peoples. נפלינו is of the same root and meaning as in (Exodus 9:4) “And the Lord shall make a separation (והפלה) between the cattle of Israel etc.”"}, {"ch": 33, "v": 17, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה גַּ֣ם אֶת־הַדָּבָ֥ר הַזֶּ֛ה אֲשֶׁ֥ר דִּבַּ֖רְתָּ אֶֽעֱשֶׂ֑ה כִּֽי־מָצָ֤אתָ חֵן֙ בְּעֵינַ֔י וָאֵדָעֲךָ֖ בְּשֵֽׁם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אַף יָת פִּתְגָּמָא הָדֵין דִּי מַלֶּלְתָּא אֶעְבֵּד אֲרֵי אַשְׁכַּחְתָּא רַחֲמִין <b>קֳדָמַי וְרַבִּיתָךְ<\/b> בְּשׁוּם:", "onk_en": "Adonoy said to Moshe, “I will also do this thing that you have spoken, for you have found favor in My eyes [<b>before Me<\/b>], and I know [<b>exalted<\/b>] you by name.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אוּף יַת פִּתְגָמָא הָדֵין דְּמַלֵּילְתָּא אֶעֱבַד אֲרוּם אַשְׁכַּחְתָּא רַחֲמִין קֳדָמַי וּמַנֵּית יָתָךְ בְּשׁוּם טַב", "pj_en": "And the Lord said to Mosheh, This thing also which thou hast spoken of, will I do; for thou hast found mercy before Me, and I have ordained thee with a goodly name.", "tj": "", "tj_en": "", "rashi": "<b>גם את הדבר הזה.<\/b> שֶׁלֹּא תִשְׁרֶה שְׁכִינָתִי עוֹד עַל אֻמּוֹת הָעוֹלָם <b>אעשה<\/b>, וְאֵין דְּבָרָיו שֶׁל בִּלְעָם עַל יְדֵי שְׁרִיַּת הַשְּׁכִינָה, אֶלָּא \"נוֹפֵל וּגְלוּי עֵינָיִם\" כְּגוֹן וְאֵלַי דָּבָר יְגֻנָּב (איוב ד') – שׁוֹמְעִין עַ\"יְ שָׁלִיחַ:", "rashi_en": "גם את הדבר הזה THIS THING ALSO — that My Shechinah shall not rest henceforth upon the other nations of the world, אעשה I WILL DO. And thus He did, for the prophetical words of Balaam (the heathen prophet) were not uttered by reason of the Shechinah resting upon him, but, as Scripture describes it, (Numbers 24:4) “[he saw the vision of the Almighty] fallen, but with eyes uncovered” (i. e. whilst fallen into a sleep his mental eyes were open and he saw in a dream what the Almighty was to reveal unto him) in a state of mind similar to that described by Job (Job 4:12) “a word was by stealth conveyed (יגנב) to me” — they (the heathen prophets) used to hear God’s message through a medium."}, {"ch": 33, "v": 18, "aliyah": 4, "heb": "וַיֹּאמַ֑ר הַרְאֵ֥נִי נָ֖א אֶת־כְּבֹדֶֽךָ׃", "onk": "וַאֲמָר אַחֲזֵינִי <b>כְעַן<\/b> יָת יְקָרָךְ:", "onk_en": "He [Moshe] then said, “Please [<b>Now<\/b>] grant me a vision of Your Glory.”", "pj": "וַאֲמַר אַחְמֵי כְדוּן יָתִי יַת יְקָרָךְ", "pj_en": "And he said, Show now unto me Thy glory:", "tj": "", "tj_en": "", "rashi": "<b>ויאמר הראני נא את כבדך.<\/b> רָאָה מֹשֶׁה שֶׁהָיָה עֵת רָצוֹן וּדְבָרָיו מְקֻבָּלִים, וְהוֹסִיף לִשְׁאֹל לְהַרְאוֹתוֹ מַרְאִית כְּבוֹדוֹ:", "rashi_en": "ויאמר הראני נא את כבדך AND HE SAID I BESEECH THEE, SHOW ME THY GLORY — Moses saw that the hour was propitious and that his petitions were being favourably received, he therefore made a further request — that God should let him behold a reflection of His Glory."}, {"ch": 33, "v": 19, "aliyah": 4, "heb": "וַיֹּ֗אמֶר אֲנִ֨י אַעֲבִ֤יר כׇּל־טוּבִי֙ עַל־פָּנֶ֔יךָ וְקָרָ֧אתִֽי בְשֵׁ֛ם יְהֹוָ֖ה לְפָנֶ֑יךָ וְחַנֹּתִי֙ אֶת־אֲשֶׁ֣ר אָחֹ֔ן וְרִחַמְתִּ֖י אֶת־אֲשֶׁ֥ר אֲרַחֵֽם׃", "onk": "וַאֲמַר אֲנָא אַעְבַּר כָּל טוּבִי עַל אַפָּיךְ וְאֶקְרֵי בִשְׁמָא דַיְיָ קֳדָמָךְ וְאֵחוֹן לְמָן דְּאֵחוֹן וְאֵרַחֵם עַל מָן דְאֵרַחֵם:", "onk_en": "He [God] said, “I will cause all My goodness to pass before your presence, and will proclaim the Name, Adonoy, in your presence. I will be gracious to whom I will be gracious, and I will be compassionate to whom I will be compassionate.", "pj": "וַאֲמַר אֲנָא מַעֲבֵר כָּל מְכִילַת טוּבִי קֳדָמָךְ וְאֵיקְרֵי בְּשׁוּם מֵימְרֵיהּ דַּיְיָ קֳדָמָךְ וְאֵיחוּס עַל מַאן דְּחָמֵי לֵיהּ לְמֵיחוּס וְאֵירְחֵים עַל מַאן דְּחָמֵי לֵיהּ לְמִתְרַחֲמָא", "pj_en": "but He said, Behold, I will make all the measure of My goodness pass before thee, and I will give utterance in the good name of the Word of the Lord before thee; and I will have compassion upon whom I see it right to have compassion, and will be merciful to whom I see it right to have mercy.", "tj": "וַאֲמַר הָא אֲנָא מַעְבֵר כָּל מְכִילַת טוּבִי קֳדָמָךְ וְאִיקְרֵי בְשֵׁם טַב יְיָ קֳדָמָךְ וְאָחוּס עַל מַה דְּחָמֵי לֵיהּ לְמֵיחָס וַאֲרַחֵם עַל מַה דְּחָמֵי לֵיהּ לְמִתְרַחֲמָא:", "tj_en": "And He said, Behold, I will make all the measure of My goodness to pass before thee, and I will give utterance in the Name of the Lord before thee, and I will have compassion upon whom I see it right to have compassion, and will be merciful upon whom I see it right to have mercy.", "rashi": "<b>ויאמר אני אעביר וגו'.<\/b> הִגִּיעָה שָׁעָה שֶׁתִּרְאֶה בִּכְבוֹדִי מַה שֶּׁאַרְשֶׁה אוֹתְךָ לִרְאוֹת, לְפִי שֶׁאֲנִי רוֹצֶה וְצָרִיךְ לְלַמֶּדְךָ סֵדֶר תְּפִלָּה; שֶׁכְּשֶׁנִּצְרַכְתָּ לְבַקֵּשׁ רַחֲמִים עַל יִשְׂרָאֵל הִזְכַּרְתָּ לִי זְכוּת אָבוֹת, כְּסָבוּר אַתָּה שֶׁאִם תַּמָּה זְכוּת אָבוֹת אֵין עוֹד תִּקְוָה, אֲנִי אַעֲבִיר כָּל מִדַּת טוּבִי לְפָנֶיךָ עַל הַצּוּר וְאַתָּה נָתוּן בַּמְּעָרָה:<br><br><b>וקראתי בשם ה' לפניך.<\/b> לְלַמֶּדְךָ סֵדֶר בַּקָּשַׁת רַחֲמִים אַף אִם תִּכְלֶה זְכוּת אָבוֹת, וְכַסֵּדֶר זֶה שֶׁאַתָּה רוֹאֶה אוֹתִי – מְעֻטָּף וְקוֹרֵא י\"ג מִדּוֹת – הֱוֵי מְלַמֵּד אֶת יִשְׂרָאֵל לַעֲשׂוֹת כֵּן, וְעַ\"יְ שֶׁיַּזְכִּירוּ לְפָנַי \"רַחוּם וְחַנּוּן\" יִהְיוּ נַעֲנִין – כִּי רַחֲמַי לֹא כָלִים:<br><br><b>וחנתי את אשר אחון.<\/b> אוֹתָן פְּעָמִים שֶׁאֶרְצֶה לָחֹן:<br><br><b>ורחמתי.<\/b> עֵת שֶׁאֶחְפֹּץ לְרַחֵם; עַד כָּאן לֹא הִבְטִיחוֹ אֶלָּא עִתִּים אֶעֱנֶה וְעִתִּים לֹא אֶעֱנֶה, אֲבָל בִּשְׁעַת מַעֲשֶׂה אָמַר לוֹ הִנֵּה אָנֹכִי כֹּרֵת בְּרִית (שמות ל\"ד) – הִבְטִיחוֹ שֶׁאֵינָן חוֹזְרוֹת רֵיקָם:", "rashi_en": "ויאמר אגי אעביר וגו׳ AND HE SAID, I WILL MAKE ALL MY GOODNESS PASS [BEFORE YOU] — The time has arrived when you shall see of My Glory so much as I will allow you to see according as I wish, and therefore I find it necessary to teach you a set form of prayer. Just now when you felt the need to pray for mercy on Israel’s behalf you besought Me to remember the merits of the patriarchs and you thought that if the merits of the patriarchs are exhausted there is no more hope — I will therefore cause all the attribute of My goodness to pass before you on the rock whilst you are placed in the cave.<br><br>וקראתי בשם ה׳ לפניך AND I WILL CALL ON THE NAME OF THE LORD BEFORE THEE, to teach you the formula when praying for mercy even though the merits of the patriarchs should be exhausted. And according to the manner in which you see Me doing this, cloaked — as it were — in the Talith and proclaiming the thirteen attributes of mercy, do you teach Israel to do. And because that they will make mention before Me of the attributes: “Merciful”, “Gracious!” thereby proclaiming that My mercies do not fail (even though the merits of the patriarchs are exhausted) (Rosh Hashanah 17b).<br><br>וחנתי את אשר אחון I WILL BE GRACIOUS TO WHOM I WILL BE GRACIOUS i. e. in times when I shall be disposed to be gracious,<br><br>ורחמתי AND I WILL SHEW MERCY — those times that I shall desire to show mercy (Midrash Tanchuma 3:9:27). For the time being He only gave him (Moses) the promise: At times I will answer your prayer, at times I will not answer it. But at the time this was carried out (i. e. when He proclaimed the Attributes) He said to him (Exodus 34:10) “Behold, I make a covenant…” (I make this irrevocable) — thus assuring him that they (the 13 Attributes of Mercy when invoked in time of need) will never prove ineffective (Rosh Hashanah 17b)."}, {"ch": 33, "v": 20, "aliyah": 4, "heb": "וַיֹּ֕אמֶר לֹ֥א תוּכַ֖ל לִרְאֹ֣ת אֶת־פָּנָ֑י כִּ֛י לֹֽא־יִרְאַ֥נִי הָאָדָ֖ם וָחָֽי׃", "onk": "וַאֲמַר לָא תִיכוּל לְמֶחֱזֵי <b>יָת אַפֵּי שְׁכִנְתִּי<\/b> אֲרֵי לָא יֶחֱזִינַנִי אֱנָשָׁא וְיִתְקַיָּם:", "onk_en": "And He said, “You cannot see [<b>the<\/b>] My Presence [<b>of the Shechina<\/b>], for no man can see My Presence and live.”", "pj": "וַאֲמַר לֵית אֶפְשַׁר לָךְ לְמֵיחְמֵי יַת סְבַר אַפַּי אֲרוּם לָא יַחְמִינַנִי אֵינָשָׁא וְיִתְקַיֵּים", "pj_en": "And He said, Thou canst not see the visage of My face; for no man can see Me and abide alive. And the Lord said,", "tj": "", "tj_en": "", "rashi": "<b>ויאמר לא תוכל וגו'.<\/b> אַף כְּשֶׁאַעֲבִיר כָּל טוּבִי עַל פָּנֶיךָ אֵינִי נוֹתֵן לְךָ רְשׁוּת לִרְאוֹת אֶת פָּנַי:", "rashi_en": "ויאמר לא תוכל וגו׳ AND HE SAID, THOU CANST NOT [SEE MY FACE] — and even when I make all My goodness pass before you I shall not allow you to see My face."}, {"ch": 33, "v": 21, "aliyah": 4, "heb": "וַיֹּ֣אמֶר יְהֹוָ֔ה הִנֵּ֥ה מָק֖וֹם אִתִּ֑י וְנִצַּבְתָּ֖ עַל־הַצּֽוּר׃", "onk": "וַאֲמַר יְיָ הָא אָתַר <b>מַתְקַן קֳדָמַי<\/b> וְתִתְעַתַּד עַל טִנָּרָא:", "onk_en": "And Adonoy said, “Behold there is a place with [<b>prepared before<\/b>] Me, and you shall set yourself on the rock.", "pj": "וַאֲמַר יְיָ הָא אֲתַר מְתַקַּן קֳדָמַי וּתְהֵי מְעַתַּד עַל טִינָרָא", "pj_en": "Behold, a place is prepared before Me, and thou shalt stand upon the rock.", "tj": "", "tj_en": "", "rashi": "<b>הנה מקום אתי.<\/b> בָּהָר אֲשֶׁר אֲנִי מְדַבֵּר עִמְּךָ תָמִיד, יֵשׁ מָקוֹם מוּכָן לִי לְצָרְכְּךָ שֶׁאַטְמִינְךָ שָׁם שֶׁלֹּא תִזֹּק, וּמִשָּׁם תִּרְאֶה מַה שֶּׁתִּרְאֶה, זֶהוּ פְּשׁוּטוֹ; וּמִדְרָשׁוֹ, עַל מָקוֹם שֶׁהַשְּׁכִינָה שָׁם מְדַבֵּר, וְאוֹמֵר הַמָּקוֹם אִתִּי, וְאֵינוֹ אוֹמֵר אֲנִי בַמָּקוֹם, שֶׁהַקָּבָּ\"ה מְקוֹמוֹ שֶׁל עוֹלָם וְאֵין עוֹלָמוֹ מְקוֹמוֹ (תנחומא):", "rashi_en": "הנה מקום אתי BEHOLD, THERE IS A PLACE BY ME — On the mountain where I am continually speaking with you there is a place prepared by Me for your sake where I will hide you that you may not be hurt by the vision. From there you will see what you will be permitted to see. A Midrashic explanation is that by the word מקום Scripture is speaking of the place where the Shechinah is and that He therefore said, “The place is by Me” and He did not say, “I am in the place”, because the Holy One, blessed be He, is the “place” of the Universe (comprises the Universe) but His Universe is not His place (does not encompass Him) (Genesis Rabbah 68:9)."}, {"ch": 33, "v": 22, "aliyah": 4, "heb": "וְהָיָה֙ בַּעֲבֹ֣ר כְּבֹדִ֔י וְשַׂמְתִּ֖יךָ בְּנִקְרַ֣ת הַצּ֑וּר וְשַׂכֹּתִ֥י כַפִּ֛י עָלֶ֖יךָ עַד־עׇבְרִֽי׃", "onk": "וִיהֵי בְּמֵעֲבַר יְקָרִי וְאֵשַׁוִּינָךְ <b>בִּמְעָרַת<\/b> טִנָּרָא <b>וְאָגֵין בְּמֵימְרִי<\/b> עֲלָךְ עַד דְּאֶעֱבַר:", "onk_en": "When My Glory passes by, I will put you in a cleft [<b>cave<\/b>] of the rock, and I will cover [<b>shelter<\/b>] you with My Hand [<b>Word<\/b>] until I pass by.", "pj": "וִיהֵי בְּמֵיעִיבַר יְקַר שְׁכִינְתִּי וְאֵישַׁוִינָךְ בְּאַסְפְּלִידָא דְטִינְרָא וְאַגִין בְּמֵימְרִי עֲלָךְ עַד זְמַן דְּאַעִיבַּר", "pj_en": "And it shall be that when the glory of My Shekinah passeth before thee, I will put thee in a cavern of the rock, and will overshadow thee with My Word until the time that I have passed by.", "tj": "וְאַטֵיל יַת יְדָי:", "tj_en": "And I will overshadow with My hand.", "rashi": "<b>בעבר כבדי.<\/b> כְּשֶׁאֶעֱבֹר לְפָנֶיךָ:<br><br><b>בנקרת הצור.<\/b> כְּמוֹ הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר (במדבר ט\"ז), יִקְּרוּהָ עֹרְבֵי נַחַל (משלי ל'), אֲנִי קַרְתִּי וְשָׁתִיתִי מָיִם (מלכים ב' יט, כד; ישעיה לז, כה), גִּזְרָה אַחַת לָהֶם, נִקְרַת הַצּוּר: כְּרִיַּת הַצּוּר:<br><br><b>ושכתי כפי.<\/b> מִכָּאן שֶׁנִּתְּנָה רְשׁוּת לַמְחַבְּלִים לְחַבֵּל, וְתַרְגּוּמוֹ \"וְאָגֵין בְּמֵימְרִי\" כִּנּוּי הוּא לְדֶרֶךְ כָּבוֹד שֶׁל מַעְלָה, שֶׁאֵינוֹ צָרִיךְ לְסוֹכֵךְ עָלָיו בְּכַף מַמָּשׁ:", "rashi_en": "בעבר כבדי WHEN MY GLORY PASSETH BY – i. e. when I shall pass before you.<br><br>בנקרת הצור IN A CLEFT OF THE CRAG — נקרה is similar in meaning to the verbs in (Numbers 16:14) “Wilt thou bore out (תנקר) the eyes of these men?”; (Proverbs 30:17) “The ravens of the valley shall pick it out (יקרהו)‎”; (2 Kings 19:24) “I have digged a well (קרתי) and drunk strange waters”. All these have the same derivation. נקרת הצור thus means a place dug out of the rock.<br><br>ושכתי כפי AND I WILL SHELTER [THEE] WITH MY HAND — Hence it is evident that permission has been given to the destructive agencies to wound. The Targum renders ושכתי כפי by ואגין במימרי “I will protect thee with My word” This is merely a circumlocution in a manner more respectful to the Most High God and the Targum did not translate it literally because He (God) does not need to cover a person with the hand actually in order to protect him."}, {"ch": 33, "v": 23, "aliyah": 4, "heb": "וַהֲסִרֹתִי֙ אֶת־כַּפִּ֔י וְרָאִ֖יתָ אֶת־אֲחֹרָ֑י וּפָנַ֖י לֹ֥א יֵרָאֽוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br><sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(ספק פרשה סתומה בכתר ארם צובה)<\/i>", "onk": "וְאַעְדֵּי <b>יָת דִּבְרַת יְקָרִי<\/b> וְתֶחֱזֵי <b>יָת דְּבַתְרָי וְדִקֳדָמַי<\/b> לָא יִתְחֲזוּן:", "onk_en": "Then I will remove [<b>the guidance of<\/b>] My Hand [<b>Glory<\/b>], and you will see My Back [<b>that which is behind Me<\/b>], but My Face [<b>that which is before Me<\/b>] shall not be seen.", "pj": "וְאַעֲבַּר יַת כִּיתֵּי מַלְאָכַיָא דְּקַיְימִין וּמְשַׁמְשִׁין קֳדָמַי וְתֶחְמֵי יַת קְטוֹר דְּבִידָא דִתְפִילֵי אִיקַר שְׁכִינְתִּי וְאַפֵּי אִיקַר שְׁכִינְתִּי לֵית אֶפְשָׁר לָךְ לְמֵיחְמֵי", "pj_en": "And I will make the host of angels who stand and minister before Me to pass by, and thou shalt see the handborder of the tephilla of My glorious Shekinah; but the face of the glory of My Shekinah thou canst not be able to see.", "tj": "וְאַעֲבֵר יַת כִּיתֵּי מַלְאָכַיָא דְקַיְימִין וּמְשַׁמְשִׁין קֳדָמַי וְאֶחְמֵי יַת דְּבִירָא דְאַיְקַר שְׁכִינְתִּי לֵית אֶפְשַׁר לָךְ לְמֵיחְמֵי:", "tj_en": "And I will cause the hosts of angels who stand and minister before Me to pass by, and will make known the oracle; for the glory of My Shekinah thou art not able to behold.", "rashi": "<b>והסרתי את כפי.<\/b> וְאַעֲדֵי יָת דִּבְרַת יְקָרִי – כְּשֶׁאֲסַלֵּק הַנְהָגַת כְּבוֹדִי מִנֶּגֶד פָּנֶיךָ, לָלֶכֶת מִשָּׁם וּלְהַלָּן:<br><br><b>וראית את אחרי.<\/b> הֶרְאָהוּ קֶשֶׁר שֶׁל תְּפִלִּין (ברכות ז'):", "rashi_en": "והסרתי את כפי AND I WILL REMOVE MY HAND — The Targum renders this by ואעדי ית דברת יקרי “I will remove the guidance of My Glory”; it means: when I shall remove the guidance of My Glory from before thine eyes — to go right away from that place,<br><br>וראית את אחרי THEN THOU SHALT SEE WHAT IS BEHIND ME — He showed him the Tephillin-knot which is placed behind the head (cf. Berakhot 7a; Menachot 35b)."}, {"ch": 34, "v": 1, "aliyah": 5, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה פְּסׇל־לְךָ֛ שְׁנֵֽי־לֻחֹ֥ת אֲבָנִ֖ים כָּרִאשֹׁנִ֑ים וְכָתַבְתִּי֙ עַל־הַלֻּחֹ֔ת אֶ֨ת־הַדְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל־הַלֻּחֹ֥ת הָרִאשֹׁנִ֖ים אֲשֶׁ֥ר שִׁבַּֽרְתָּ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה פְּסָל לָךְ תְּרֵין לוּחֵי אַבְנַיָּא כְּקַדְמָאֵי וְאֶכְתּוֹב עַל לוּחַיָּא יָת פִּתְגָּמַיָּא דִי הֲווֹ עַל לוּחַיָּא קַדְמָאֵי דִּי תְבַרְתָּא:", "onk_en": "Adonoy said to Moshe, “Carve out two stone tablets for yourself just like the first ones. And I will write upon these tablets the words which were on the first Tablets that you broke.", "pj": "וַאֲמַר יְיָ לְמשֶׁה פְּסָל לָךְ תְּרֵין לוּחֵי אַבְנִין הֵי כְּקַדְמָאֵי וְאֶכְתּוֹב עַל לוּחַיָא יַת פִּתְגָמַיָא דַהֲווֹ עַל לוּחַיָא קַדְמָאֵי דִי תְבַרְתָּ", "pj_en": "And the Lord said to Mosheh, Hew thee two tables of stone, as the former, and write upon the tables the words that were upon the former tables which thou didst break;", "tj": "", "tj_en": "", "rashi": "<b>פסל לך.<\/b> הֶרְאָהוּ מַחְצַב סַנְפִּירִינוֹן מִתּוֹךְ אָהֳלוֹ וְאָמַר לוֹ הַפְּסֹלֶת יִהְיֶה שֶׁלְּךָ; מִשָּׁם נִתְעַשֵּׁר מֹשֶׁה הַרְבֵּה (תנחומא):<br><br><b>פסל לך.<\/b> אַתָּה שִׁבַּרְתָּ הָרִאשׁוֹנוֹת, אַתָּה פְּסָל לְךָ אֲחֵרוֹת, מָשָׁל לְמֶלֶךְ שֶׁהָלַךְ לִמְדִינַת הַיָּם וְהִנִּיחַ אֲרוּסָתוֹ עִם הַשְּׁפָחוֹת, מִתּוֹךְ קִלְקוּל הַשְּׁפָחוֹת יָצָא עָלֶיהָ שֵׁם רָע, עָמַד שׁוֹשְׁבִינָהּ וְקָרַע כְּתֻבָּתָהּ, אָמַר אִם יֹאמַר הַמֶּלֶךְ לְהָרְגָהּ, אֹמַר לוֹ עֲדַיִן אֵינָהּ אִשְׁתְּךָ; בָּדַק הַמֶּלֶךְ וּמָצָא שֶׁלֹּא הָיָה הַקִּלְקוּל אֶלָּא מִן הַשְּׁפָחוֹת, נִתְרַצָּה לָהּ, אָמַר לוֹ שׁוֹשְׁבִינָהּ כְּתֹב לָהּ כְּתֻבָּה אַחֶרֶת, שֶׁנִּקְרְעָה הָרִאשׁוֹנָה, אָמַר לוֹ הַמֶּלֶךְ אַתָּה קָרַעְתָּ אוֹתָהּ אַתָּה קְנֵה לָהּ נְיָר אַחֵר וַאֲנִי אֶכְתֹּב לָהּ בִּכְתָב יָדִי; כֵּן הַמֶּלֶךְ זֶה הַקָּבָּ\"ה, הַשְּׁפָחוֹת אֵלּוּ עֵרֶב רַב, וְהַשּׁוֹשְׁבִין זֶה מֹשֶׁה, אֲרוּסָתוֹ שֶׁל הַקָּבָּ\"ה יִשְׂרָאֵל, לְכָךְ נֶאֱמַר פְּסָל לְךָ (שם):", "rashi_en": "פסל לך HEW THEE — He showed him a quarry of sapphire in his tent and said to him: The chips (פסל = פסלת) shall be thine (לך). It was from this that Moses became so rich (cf. Midrash Tanchuma 3:9:29; Leviticus Rabbah 32:2).<br><br>Another explanation of פסל לך is: פסל לך HEW THYSELF — thou hast broken the first tablets, do thou therefore hew others. A parable: this may be compared to a king who travelled to a remote country (more lit., to a province over-sea) leaving his betrothed at home with her handmaids. Through the immoral conduct of her handmaids she also gained a bad reputation (more lit., there went forth against her an evil name). Her bridesman arose and tore up the marriage-contract saying: If the king proposes to kill her I shall say to him, “She is not yet thy wife” (the marriage contract which might have served as evidence being destroyed. The king made enquiry, found that the immorality had been only on the hand maids’ side and became reconciled with her. Her bridesman then said to the king, “Write another marriage contract for her because the first has been torn up”. Whereupon the king replied: You tore it up; do you therefore purchase for her new paper and I will write it for her in My handwriting. So, here, too: the King is the Holy One blessed be He, the handmaids are the mixed multitude, the bride’s friend is Moses, and the betrothed of the Holy One, blessed be He, is Israel — therefore it is said פסל לך, “Hew thyself the new tablets” (Midrash Tanchuma 3:9:30)."}, {"ch": 34, "v": 2, "aliyah": 5, "heb": "וֶהְיֵ֥ה נָכ֖וֹן לַבֹּ֑קֶר וְעָלִ֤יתָ בַבֹּ֙קֶר֙ אֶל־הַ֣ר סִינַ֔י וְנִצַּבְתָּ֥ לִ֛י שָׁ֖ם עַל־רֹ֥אשׁ הָהָֽר׃", "onk": "וֶהֱוֵי זַמִּין לְצַפְרָא וְתִסַּק בְּצַפְרָא לְטוּרָא דְסִינַי וְתִתְעַתַּד קֳדָמַי תַּמָּן עַל רֵישׁ טוּרָא:", "onk_en": "Be ready for the morning, and in the morning go up to Mount Sinai and stand there before Me on the top of the mountain.", "pj": "וַהֲוֵי זַמִין לְצַפְרָא וְתִיסוֹק לְצַפְרָא לְטַוְורָא דְסִינַי וְתִתְעַתַּד קֳדָמַי תַּמָּן עַל רֵישׁ טוּרָא", "pj_en": "and be ready in the morn; and at morning ascend thou Mount Sinai and stand there before Me on the summit of the mountain.", "tj": "", "tj_en": "", "rashi": "<b>נכון.<\/b> מְזֻמָּן:", "rashi_en": "נכון means PREPARED."}, {"ch": 34, "v": 3, "aliyah": 5, "heb": "וְאִישׁ֙ לֹֽא־יַעֲלֶ֣ה עִמָּ֔ךְ וְגַם־אִ֥ישׁ אַל־יֵרָ֖א בְּכׇל־הָהָ֑ר גַּם־הַצֹּ֤אן וְהַבָּקָר֙ אַל־יִרְע֔וּ אֶל־מ֖וּל הָהָ֥ר הַהֽוּא׃", "onk": "וֶאֱנַשׁ לָא יִסַּק עִמָּךְ וְאַף אֱנַשׁ לָא יִתְחֲזֵי בְּכָל טוּרָא אַף עֲנָא וְתוֹרֵי לָא יִרְעוּן לָקֳבֵל טוּרָא הַהוּא:", "onk_en": "No man shall go up with you, nor shall any man be seen on the entire mountain; even the sheep and cattle shall not graze before that mountain.”", "pj": "וְאֵינַשׁ לָא יִסַק עִמָּךְ וְאוּף אֵינַשׁ לָא יִתְחָמֵי בְּכָל טַוְורָא אוּף עָנָא וְתוֹרֵי לָא יַרְעוּן כָּל קְבֵיל טַוְורָא הַהוּא", "pj_en": "No man shall ascend with thee, nor any man be seen on all the mountain, nor sheep, nor oxen grazing on the side of the mount.", "tj": "", "tj_en": "", "rashi": "<b>ואיש לא יעלה עמך.<\/b> הָרִאשׁוֹנוֹת עַ\"יְ שֶׁהָיוּ בִתְשׁוּאוֹת וְקוֹלוֹת וּקְהִלּוֹת, שָׁלְטָה בָהֶן עַיִן רָעָה – אֵין לְךָ יָפֶה מִן הַצְּנִיעוּת (שם):", "rashi_en": "ואיש לא יעלה עמך AND NO MAN SHALL GO UP WITH THEE — Because the first tablets were given amidst great noises and alarms and a vast assembly the “evil eye” had power over them (they did not endure) — there is no finer quality than to be unostentatious! (Midrash Tanchuma 3:9:31)."}, {"ch": 34, "v": 4, "aliyah": 5, "heb": "וַיִּפְסֹ֡ל שְׁנֵֽי־לֻחֹ֨ת אֲבָנִ֜ים כָּרִאשֹׁנִ֗ים וַיַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַבֹּ֙קֶר֙ וַיַּ֙עַל֙ אֶל־הַ֣ר סִינַ֔י כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֹת֑וֹ וַיִּקַּ֣ח בְּיָד֔וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים׃", "onk": "וּפְסַל תְּרֵין לוּחֵי אַבְנַיָּא כְּקַדְמָאֵי וְאַקְדֵּם משֶׁה בְצַפְרָא וּסְלֵק לְטוּרָא דְסִינַי כְּמָא דְפַקֵּד יְיָ יָתֵיהּ וּנְסֵב בִּידֵיהּ תְּרֵין לוּחֵי אַבְנַיָּא:", "onk_en": "He [Moshe] carved out two stone tablets just like the first ones. Moshe rose early in the morning, and went up to Mount Sinai, as Adonoy had commanded him; and he took the two stone tablets in his hand.", "pj": "וּפְסַל תְּרֵין לוּחֵי אַבְנִין הֵי כְקַדְמָאֵי וְאַקְדִים משֶׁה בְּצַפְרָא וּסְלֵיק לְטַוְורָא דְסִינַי הֵיכְמָא דְפַקֵּיד יְיָ יָתֵיהּ וּנְסֵיב בִּידֵיהּ תְּרֵין לוּחֵי אַבְנַיָא", "pj_en": "And he hewed two tables of stone like the former: and Mosheh arose in the morning and ascended Mount Sinai, as the Lord had instructed him, and took in his hand the two tables of stone.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 5, "aliyah": 5, "heb": "וַיֵּ֤רֶד יְהֹוָה֙ בֶּֽעָנָ֔ן וַיִּתְיַצֵּ֥ב עִמּ֖וֹ שָׁ֑ם וַיִּקְרָ֥א בְשֵׁ֖ם יְהֹוָֽה׃", "onk": "<b>וְאִתְגְּלִי<\/b> יְיָ בַּעֲנָנָא וְאִתְעַתַּד עִמֵּיהּ תַּמָּן וּקְרָא בִשְׁמָא דַּיְיָ:", "onk_en": "Adonoy descended [<b>became revealed<\/b>] in a cloud and it stood with him there; and he [Moshe] called out [invoked] the Name, Adonoy.", "pj": "וְאִתְגְּלֵי יְיָ בְּעַנָנֵי אִיקַר שְׁכִינְתֵּיהּ וְאִתְעַתַּד משֶׁה עִמֵּיהּ תַּמָּן וּקְרָא משֶׁה בְּשׁוּם מֵימְרָא דַיְיָ", "pj_en": "And the Lord revealed Himself in the cloud of the glory of His Shekinah, and Mosheh stood with Him there; and Mosheh called on the Name of the Word of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא בשם ה'.<\/b> מְתַּרְגְּמִינַן וּקְרָא בִשְׁמָא דַה':", "rashi_en": "ויקרא בשם ה׳ AND HE CALLED BY NAME, O LORD — We render this in the Targum by, 'ויקרא בשמא דה and he (Moses) called on the name of the Lord."}, {"ch": 34, "v": 6, "aliyah": 5, "heb": "וַיַּעֲבֹ֨ר יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;עַל־פָּנָיו֮ וַיִּקְרָא֒ יְהֹוָ֣ה&thinsp;<small>׀<\/small>&thinsp;יְהֹוָ֔ה אֵ֥ל רַח֖וּם וְחַנּ֑וּן אֶ֥רֶךְ אַפַּ֖יִם וְרַב־חֶ֥סֶד וֶאֱמֶֽת׃", "onk": "<b>וְאַעְבַּר<\/b> יְיָ <b>שְׁכִנְתֵּיהּ<\/b> עַל אַפּוֹהִי וּקְרָא יְיָ יְיָ אֱלָהָא רַחֲמָנָא וְחַנָּנָא <b>מַרְחִיק<\/b> רְגַז <b>וּמַסְגֵּי לְמֶעְבַּד טַבְוָן וּקְשׁוֹט<\/b>:", "onk_en": "Adonoy [<b>made his Shechina pass<\/b>] passed before him, and proclaimed: “Adonoy, Adonoy, Almighty, merciful and gracious, slow to [<b>distancing<\/b>] anger, and [<b>making<\/b>] abounding in kindness [<b>goodness<\/b>] and truth [<b>abound<\/b>].", "pj": "וְאַעֲבֵיר יְיָ שְׁכִינְתֵּיהּ עַל אַפּוֹי וּקְרָא יְיָ יְיָ אֱלָהָא רַחֲמָנָא וְחַנָנָא אֶרֶךְ רוּחַ וּקְרִיב רַחֲמִין וּמַסְגֵי לְמֶעֱבַד חֶסֶד וּקְשׁוֹט", "pj_en": "And the Lord made His Shekinah to pass by before his face, and proclaimed, The Lord, the Lord God, merciful and gracious, long-suffering, and nigh in mercies, abounding to exercise compassion and truth;", "tj": "וַעֲבָרַת יְקַר שְׁכִינְתֵּיהּ דַיְיָ קֳדָמוֹי וְצַלִי משֶׁה וַאֲמַר יְיָ אֱלָהָא רַחֲמָנָא וְחַנָנָא רָחִיק רְגַז וְקָרֵב רַחֲמִין וּמַסְגֵי לְמֶעֱבַד חֶסֶד וּקְשׁוֹט:", "tj_en": "And the glory of the Shekinah of the Lord passed by before him; and Mosheh prayed, and said, Lord, Lord God, merciful and gracious, slow to be angry but nigh to be merciful, and abounding to exercise kindness and truth;", "rashi": "<b>ה' ה'.<\/b> מִדַּת רַחֲמִים הִיא, אַחַת קֹדֶם שֶׁיֶּחֱטָא, וְאַחַת אַחַר שֶׁיֶּחֱטָא וְיָשׁוּב (ראש השנה י\"ז):<br><br><b>אל.<\/b> אַף זוֹ מִדַּת רַחֲמִים, וְכֵן הוּא אוֹמֵר אֵלִי אֵלִי לָמָה עֲזַבְתָּנִי (תהילים כ\"ב) – וְאֵין לוֹמַר לְמִדַּת הַדִּין לָמָה עֲזַבְתָּנִי, כָּךְ מָצָאתִי בִּמְכִילְתָּא:<br><br><b>ארך אפים.<\/b> מַאֲרִיךְ אַפּוֹ וְאֵינוֹ מְמַהֵר לִפָּרַע, שֶׁמָּא יַעֲשֶׂה תְשׁוּבָה:<br><br><b>ורב חסד.<\/b> לַצְּרִיכִים חֶסֶד – שֶׁאֵין לָהֶם זְכֻיּוֹת כָּל כָּךְ:<br><br><b>ואמת.<\/b> לְשַׁלֵּם שָׂכָר טוֹב לְעוֹשֵׂי רְצוֹנוֹ:", "rashi_en": "ה׳ ה׳ THE LORD, THE LORD — This is the attribute of Divine mercy. The one (the first ה׳) alludes to God having mercy on the sinner before he sins and the other after he has sinned and repented (Rosh Hashanah 17b).<br><br>אל GOD — This is also an attribute of Divine mercy (it is not, as אלהים, an attribute of stern justice). Thus also does Scripture say, (Psalms 22:2) “My God, my God (אלי ,אלי) why hast Thou forsaken me?” — for surely one would not say to the attribute of stern Justice “why hast Thou forsaken me?”! Thus have I found in the Mechilta d'Rabbi Yishmael 15:2:2.<br><br>ארך אפים SLOW TO ANGER — He defers (מאריך) His anger and does not hasten to punish — it may be that the sinner will repent.<br><br>ורב חסד AND ABUNDANT IN MERCY — to those who need mercy because they have not sufficient merits to be saved by them.<br><br>ואמת AND TRUTH — faithfully rewarding those who perform His will."}, {"ch": 34, "v": 7, "aliyah": 5, "heb": "<big>נֹ<\/big>צֵ֥ר<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן נֹצֵ֥ר בנו״ן רגילה)<\/i> חֶ֙סֶד֙ לָאֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָפֶ֖שַׁע וְחַטָּאָ֑ה וְנַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד&thinsp;<b>׀<\/b> עֲוֺ֣ן אָב֗וֹת עַל־בָּנִים֙ וְעַל־בְּנֵ֣י בָנִ֔ים עַל־שִׁלֵּשִׁ֖ים וְעַל־רִבֵּעִֽים׃", "onk": "נָטַר טִיבוּ לְאַלְפֵי דָרִין שָׁבֵק לַעֲוָיָן <b>וְלִמְרוֹד<\/b> וּלְחוֹבִין <b>סָלַח לִדְתַיְבִין לְאוֹרַיְתֵיהּ<\/b> וְלִדְלָא תַיְבִין לָא מְזַכֵּי מַסְעַר חוֹבֵי אֲבָהָן עַל בְּנִין וְעַל בְּנֵי בְנִין <b>מָרָדִין<\/b> עַל דַּר תְּלִיתָי וְעַל דַר רְבִיעָי:", "onk_en": "He preserves kindness for thousands [of generations], bearing [forgiving] iniquity, transgression [<b>rebellion<\/b>] and sin. He clears [acquits the penitent] [<b>forgives those who return to his Torah<\/b>] and he does not clear [acquit the impenitent], visiting the iniquity of the fathers upon the children, and [<b>rebellious<\/b>] children’s children, [even] upon the third and fourth [generation].”", "pj": "נְטִיר חֶסֶד וְטִיבוּ לְאַלְפֵי דָרִין שָׁרֵי וְשָׁבִיק עַל חוֹבִין וּמַעֲבַר עַל מְרוֹדִין וּמְכַפֵּר עַל חַטָּאִין סְלַח לִדְתַיְיבִין לְאוֹרַיְיתָא וְלִדְלָא תַיְיבִין לָא מְזַכֵּי בְּיוֹם דִּינָא רַבָּא מַסְעַר חוֹבֵי אַבְהָן עַל בְּנִין מְרוֹדִין עַל דַּר תְּלִיתָאֵי וְעַל דַּר רְבִיעָאֵי", "pj_en": "keeping mercy and bounty for thousands of generations, absolving and remitting guilt, passing by rebellions, and covering sins; pardoning them who convert unto the law, but holding not guiltless in the great day of judgment those who will not convert; visiting the sins of fathers upon rebellious children upon the third and upon the fourth generation.", "tj": "נְטִיר טִיבוּ לְאַלְפֵי דָרִין שְׁרֵי וּשְׁבֵיק לְחוֹבִין וּלְסַרְחָנִין וּמְזַכַּיָא לָא מְזַכֵּי יְיָ יַת חַיָיבַיָא בְּיוֹם דִּינָא רַבָּא וּמַדְכַּר חוֹבֵי אַבְהָן רַשִׁיעָן עַל בְּנִין מְרָדִין עַל דַּר תְּלִיתָאֵי וְעַל דַּר רְבִיעָאֵי:", "tj_en": "keeping goodness for thousands of generations; absolving and remitting sin and transgressions, but not to acquit the guilty in the great day of judgment; and remembering the sins of wicked fathers upon rebellious children upon the third and upon the fourth generation.", "rashi": "<b>נצר חסד.<\/b> שֶׁהָאָדָם עוֹשֶׂה לְפָנָיו:<br><br><b>לאלפים.<\/b> לִשְׁנֵי אֲלָפִים דּוֹרוֹת:<br><br><b>עון ופשע.<\/b> עֲוֹנוֹת — אֵלּוּ הַזְּדוֹנוֹת, פְּשָׁעִים — אֵלּוּ הַמְּרָדִים שֶׁאָדָם עוֹשֶׂה לְהַכְעִיס:<br><br><b>ונקה לא ינקה.<\/b> לְפִי פְשׁוּטוֹ מַשְׁמָע שֶׁאֵינוֹ מְוַתֵּר עַל הֶעָוֹן לְגַמְרֵי, אֶלָּא נִפְרָע מִמֶּנּוּ מְעַט מְעַט, וְרַבּוֹתֵינוּ דָרְשׁוּ מְנַקֶּה הוּא לַשָּׁבִים וְלֹא יְנַקֶּה לְשֶׁאֵינָן שָׁבִים (יומא פ\"ו):<br><br><b>פקד עון אבות על בנים.<\/b> כְּשֶׁאוֹחֲזִים מַעֲשֵׂה אֲבוֹתֵיהֶם בִּידֵיהֶם, שֶׁכְּבָר פֵּרֵשׁ בְּמִקְרָא אַחֵר לְשֹׂנְאָי (שמות כ'):<br><br><b>ועל רבעים.<\/b> דּוֹר רְבִיעִי; נִמְצֵאת מִדָּה טוֹבָה מְרֻבָּה עַל מִדַּת פֻּרְעָנוּת אַחַת לַחֲמֵשׁ מֵאוֹת, שֶׁבְּמִדָּה טוֹבָה הוּא אוֹמֵר נֹצֵר חֶסֶד לָאֲלָפִים (תוספתא סוטה ד'):", "rashi_en": "נצר חסד means God keeps (stores up) the mercy which a person does in His presence,<br><br>לאלפים TO THOUSANDS — to two thousand generations (the plural, “generations”, and “two” is the least that this can imply; cf. Rashi on Exodus 20:6).<br><br>עונות — These are sins committed presumptuously (with premeditation). פשעים — These are sins committed rebelliously.<br><br>ונקה לא ינקה AND WHO WILL BY NO MEANS CLEAR THE GUILTY — According to its plain sense this means that He is not altogether indulgent to sin (He does not entirely remit the punishment), but little by little exacts punishment from, him (the sinner). Our Rabbis, however, have explained: ונקה, And he clears — He clears those who repent, לא ינקה, He does not clear — but does not clear those who will not repent (Yoma 86a).<br><br>פקד עון אבות על בנים VISITING THE INIQUITY OF THE FATHERS UPON THE CHILDREN — when they retain in their hands (follow the example of) the evil doings of their ancestors. This must be the meaning because in another verse of a similar character it has already been stated: of them that hate Me (cf. Exodus 20:5: Visiting the iniquity of fathers upon the children, upon the third and fourth generation of them that hate Me (Berakhot 7a; Sanhedrin 27b).<br><br>ועל רבעים means AND UPON THE FOURTH GENERATION — It follows, therefore, that the measure of good (reward) is greater than the measure of punishment in the proportion of one to five hundred, for in respect to the measure of good it says: “Keeping mercy for thousands” (two thousands at least) (cf. Rashi above: Tosefta Sotah 4:1; see also Rashi on Exodus 20:5)."}, {"ch": 34, "v": 8, "aliyah": 5, "heb": "וַיְמַהֵ֖ר מֹשֶׁ֑ה וַיִּקֹּ֥ד אַ֖רְצָה וַיִּשְׁתָּֽחוּ׃", "onk": "וְאוֹחִי משֶׁה וּכְרַע עַל אַרְעָא וּסְגִיד:", "onk_en": "Moshe hastened, bowed to the ground, and prostrated himself,", "pj": "וְאוֹחִי משֶׁה וְגָחַן עַל אַרְעָא וּסְגִיד", "pj_en": "And Mosheh made haste and bowed himself upon the earth and worshipped.", "tj": "וְזָרֵיז משֶׁה וַאֲקַד עַל אַרְעָא וְאוֹדִי וְשַׁבַּח:", "tj_en": "And Mosheh hastened and prostrated himself upon the earth, and gave thanks and glorified.", "rashi": "<b>וימהר משה.<\/b> כְּשֶׁרָאָה מֹשֶׁה שְׁכִינָה עוֹבֶרֶת, וְשָׁמַע קוֹל הַקְּרִיאָה, מִיָּד <b>וישתחו<\/b>:", "rashi_en": "וימהר משה, AND MOSES MADE HASTE — When Moses saw that the Shechinah passed by and heard the sound of the proclamation he immediately prostrated himself."}, {"ch": 34, "v": 9, "aliyah": 5, "heb": "וַיֹּ֡אמֶר אִם־נָא֩ מָצָ֨אתִי חֵ֤ן בְּעֵינֶ֙יךָ֙ אֲדֹנָ֔י יֵֽלֶךְ־נָ֥א אֲדֹנָ֖י בְּקִרְבֵּ֑נוּ כִּ֤י עַם־קְשֵׁה־עֹ֙רֶף֙ ה֔וּא וְסָלַחְתָּ֛ לַעֲוֺנֵ֥נוּ וּלְחַטָּאתֵ֖נוּ וּנְחַלְתָּֽנוּ׃", "onk": "וַאֲמַר אִם כְּעַן אַשְׁכָּחִית רַחֲמִין <b>קֳדָמָךְ<\/b> יְיָ תְּהַךְ כְּעַן <b>שְׁכִנְתָּא<\/b> דַיְיָ בֵּינָנָא אֲרֵי עַם קְשֵׁי קְדַל הוּא וְתִשְׁבּוֹק לְחוֹבָנָא וְלַחֲטָאָנָא וְתַחְסְנָנָא:", "onk_en": "and said, “If I have found favor in Your eyes [<b>before You<\/b>] my Master, let [<b>the Shechina of<\/b>] my Master go among us; although it is a stiff-necked people, pardon our iniquity and our sins, and take us as Your own possession.”", "pj": "וַאֲמַר אִין בְּבָעוּ אַשְׁכָּחִית רַחֲמִין קֳדָמָךְ יְיָ תְּהַךְ כְּדוֹן שְׁכִינַת יְקָרָךְ יְיָ בֵּינָנָא אֲרוּם עַם קְשֵׁי קְדַל הוּא וְתִשְׁבּוֹק לְחוֹבָנָא וּלְחַטָּאנָא וְתַחְסְנִינָנָא יַת אַרְעָא דְקַיְימִית לְאַבְהָתָנָא דְּלָא תְשַׁלְחְפִינָנָא בְּעַם אוֹחֲרָן", "pj_en": "And he said, If now I have found mercy before the Lord let the Shekinah of the Glory of the Lord go among us; for it is a people of hard neck; but pardon Thou our guilt and our sin, and give us the inheritance of the land which Thou didst covenant unto our fathers, and change us not to become an alien people.", "tj": "", "tj_en": "", "rashi": "<b>ילך נא אדני בקרבנו.<\/b> כְּמוֹ שֶׁהִבְטַחְתָּ, מֵאַחַר שֶׁאַתָּה נוֹשֵׂא עָוֹן; וְאִם עַם קְשֵׁה עֹרֶף הוּא וְיַמְרוּ בְךָ וְאָמַרְתָּ עַל זֹאת פֶּן אֲכֶלְךָ בַּדָּרֶךְ, אַתָּה תִסְלַח לַעֲוֹנֵינוּ וְגוֹמֵר; יֵשׁ כִּי בִּמְקוֹם אִם:<br><br><b>ונחלתנו.<\/b> וְתִתְּנֵנוּ לְךָ לְנַחֲלָה מְיֻחֶדֶת, זוֹ הִיא בַקָּשַׁת וְנִפְלִינוּ אֲנִי וְעַמְּךָ – שֶׁלֹּא תִשְׁרֶה שְׁכִינָתְךָ עַל הָאֻמּוֹת:", "rashi_en": "ילך נא אדני בקרבנו LET MY LORD, I PRAY THEE, GO AMONG US as Thou hast promised (cf. Exodus 33:14), since Thou forgivest iniquity. And even if it be a stiff-necked people and they have rebelled against Thee and Thou didst on that account say, (Exodus 30:3) “lest I consume thee in the way” — yet pardon Thou our iniquity etc. — כי is sometimes used in place of (in the sense of) אם, “if”.<br><br>ונחלתנו. AND TAKE US FOR THINE INHERITANCE — make us a special inheritance unto Thyself. This is the same request as that contained in (Exodus 33:16) “that we should be different, I and thy people [from all other peoples]” — which means that You should not let Your Shechinah rest upon the other peoples of the world (cf. Rashi on this verse)."}, {"ch": 34, "v": 10, "aliyah": 6, "heb": "וַיֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כׇּֽל־עַמְּךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא־נִבְרְא֥וּ בְכׇל־הָאָ֖רֶץ וּבְכׇל־הַגּוֹיִ֑ם וְרָאָ֣ה כׇל־הָ֠עָ֠ם אֲשֶׁר־אַתָּ֨ה בְקִרְבּ֜וֹ אֶת־מַעֲשֵׂ֤ה יְהֹוָה֙ כִּֽי־נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽךְ׃", "onk": "וַאֲמַר הָא אֲנָא גְּזַר קְיַם קֳדָם כָּל עַמָּךְ אַעֲבֵּיד פְּרִישָׁן דִּי לָא אִתְבְּרִיאוּ בְּכָל אַרְעָא וּבְכָל עַמְמַיָּא וְיֶחֱזֵי כָל עַמָּא דִּי אַתְּ בֵּינֵיהוֹן יָת עוֹבָדָא דַיְיָ אֲרֵי דָחֵל הוּא דִּי אֲנָא עָבֵד עִמָּךְ:", "onk_en": "And He said, “I hereby make a covenant; before all your people I will perform wonders such as have not been created in all the earth or for any nation; and all the people in whose midst you are, will see how awesome is the deed of Adonoy which I will perform for you.", "pj": "וַאֲמַר הָא אֲנָא גְזַר קְיַים דְּלָא אַשַׁלְחִיף עַמָּא הָדֵין בְּעַם אוֹחְרַן בְּרַם מִינָךְ יִפְקוּן אוֹכְלוֹסִין דְּצַדִּיקִין קְבֵיל כָּל עַמָּךְ אַעֲבֵּיד פְּרִישַׁן לְהוֹן בִּזְמַן דִּיהָכוּן בְּשִׁבְיָיתָא עַל נַהַרְוַות בָּבֶל וְאֵסֵילֵיקִינוּן מִתַּמָּן וְאֵשְׁרִינוּן מִן לְגֵיו לִנְהַר סַמְבַּטְיוֹן וּכְהִינוּן פְּרִישַׁן לָא אִתְבְּרִיוּ בְּכָל דַּיְירֵי אַרְעָא וּבְכָל עַמְמַיָא וְיֶחֱמוּן כָּל עַמָּא דְאַנְתְּ שָׁרֵי בֵּינֵיהוֹן בְּיוֹמָא הַהוּא יַת עוּבְדָא דַיְיָ אֲרוּם דָּחִיל הוּא דַאֲנָא עָבִיד עִמָךְ", "pj_en": "And He said, Behold, I make covenant that I will not change this people to become an alien people; nevertheless from thee shall proceed a multitude of the righteous; and with all thy people will I do wondrous things in the time when they go into captivity by the rivers of Bavel: for I will bring them up from thence, and make them dwell from within the river Sambation; and like wonders shall not be created among all the inhabitants of the earth, nor among any nation. And all the people among whom thou wilt dwell shall see in that day the work of the Lord; for terrible is the thing that I will do with thee.", "tj": "", "tj_en": "", "rashi": "<b>כרת ברית.<\/b> עַל זֹאת:<br><br><b>אעשה נפלאת.<\/b> לְשׁוֹן וְנִפְלִינוּ, שֶׁתִּהְיוּ מֻבְדָּלִים בְּזוֹ מִכָּל הָאֻמּוֹת, שֶׁלֹּא תִשְׁרֶה שְׁכִינָתִי עֲלֵיהֶם:", "rashi_en": "כרת ברית [BEHOLD, I] MAKE A COVENANT about this.<br><br>אעשה נפלאת — The word נפלאת is an expression of the same meaning as ונפלינו (Exodus 33:16; so that the phrase means: I will make a difference) meaning that you shall be different in this respect from all other peoples — in that My Shechinah will not rest upon them."}, {"ch": 34, "v": 11, "aliyah": 6, "heb": "שְׁמׇ֨ר־לְךָ֔ אֵ֛ת אֲשֶׁ֥ר אָנֹכִ֖י מְצַוְּךָ֣ הַיּ֑וֹם הִנְנִ֧י גֹרֵ֣שׁ מִפָּנֶ֗יךָ אֶת־הָאֱמֹרִי֙ וְהַֽכְּנַעֲנִ֔י וְהַחִתִּי֙ וְהַפְּרִזִּ֔י וְהַחִוִּ֖י וְהַיְבוּסִֽי׃", "onk": "טָר לָךְ יָת דִּי אֲנָא מְפַקְדָּךְ יוֹמָא דֵין הָא אֲנָא מְתָרֵךְ מִן קֳדָמָךְ יָת אֱמוֹרָאֵי וּכְנַעֲנָאֵי וְחִתָּאֵי וּפְרִזָּאֵי וְחִוָּאֵי וִיבוּסָאֵי:", "onk_en": "Preserve for your own sake that which I command you today. I am driving out [from] before you the Emorites, the Canaanites, the Chitites, the Perizites, the Chivities, and the Yevusites.", "pj": "טוֹר לָךְ יַת מַה דַּאֲנָא מְפַקֵיד לָךְ יוֹמָא דֵין הָאֲנָא מְתָרֵיךְ מִן קֳדָמָךְ יַת אֱמוֹרָאֵי וּכְנַעֲנָאֵי וְחִתָּאֵי וּפְרִיזָאֵי וְחִיוָאֵי וִיבוּסָאֵי", "pj_en": "Observe thou that which I command thee this day: behold, I drive out from before thee the Amoraee, and Kenaanaee, and Hittaee, and Pherizaee, and Hivaee, and Jebusaee.", "tj": "", "tj_en": "", "rashi": "<b>את האמרי וגו'.<\/b> ו' אֻמּוֹת יֵשׁ כָּאן, כִּי הַגִּרְגָּשִׁי עָמַד וּפָנָה מִפְּנֵיהֶם:", "rashi_en": "את האמרי וגו׳ THE AMORITE etc. — There are only six nations mentioned here, because the seventh, the Girgashites, arose and emigrated of their own accord (Leviticus Rabbah 17:6; cf. Rashi on Exodus 33:2)."}, {"ch": 34, "v": 12, "aliyah": 6, "heb": "הִשָּׁ֣מֶר לְךָ֗ פֶּן־תִּכְרֹ֤ת בְּרִית֙ לְיוֹשֵׁ֣ב הָאָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑יהָ פֶּן־יִהְיֶ֥ה לְמוֹקֵ֖שׁ בְּקִרְבֶּֽךָ׃", "onk": "אִסְתַּמַּר לָךְ דִּילְמָא תִגְזַר קְיַם לְיָתֵב אַרְעָא דִּי אַתְּ עָלֵל עֲלַהּ דִּילְמָא יְהֵי לְתַקְלָא בֵּינָךְ:", "onk_en": "For your own sake, be careful not to make a covenant with the people who live in the land to which you are coming, lest it be a trap in your midst.", "pj": "אִיסְתַּמַּר לָךְ דִּילְמָא תִגְזוֹר קְיַים לְיָתֵיב אַרְעָא דְאַנְתְּ עָלֵיל עֲלָהּ דִּלְמָא יְהֵי לְתַקָּלָא בֵּינָךְ", "pj_en": "Take heed to thee, lest thou strike covenants with the inhabitants of that land into which thou art to enter; that it may not be a stumbling-block unto thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 13, "aliyah": 6, "heb": "כִּ֤י אֶת־מִזְבְּחֹתָם֙ תִּתֹּצ֔וּן וְאֶת־מַצֵּבֹתָ֖ם תְּשַׁבֵּר֑וּן וְאֶת־אֲשֵׁרָ֖יו תִּכְרֹתֽוּן׃", "onk": "אֲרֵי יָת אֲגוֹרֵיהוֹן תְּתַרְעוּן וְיָת קָמַתְהוֹן תְּתַבְּרוּן וְיָת אֲשֵׁרֵיהוֹן תְּקַצְּצוּן:", "onk_en": "Rather you must shatter their altars, break down their monuments, and cut down their asherah-trees.", "pj": "אֲרוּם יַת אֵיגוֹרֵיהוֹן תְּתַרְעוּן וְיַת קָמַתְהוֹן תְּתַבְּרוּן וְיַת אֲשֵׁרֵיהוֹן תְּקַצְּצוּן", "pj_en": "But thou shalt rather destroy their high places, and break their statues, and cut down their groves;", "tj": "", "tj_en": "", "rashi": "<b>אשריו.<\/b> הוּא אִילָן שֶׁעוֹבְדִים אוֹתוֹ:", "rashi_en": "אשריו — An אשרה was a tree which they worshipped."}, {"ch": 34, "v": 14, "aliyah": 6, "heb": "כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְאֵ֣ל אַחֵ֑<big>ר<\/big> כִּ֤י יְהֹוָה֙ קַנָּ֣א שְׁמ֔וֹ אֵ֥ל קַנָּ֖א הֽוּא׃", "onk": "אֲרֵי לָא תִסְגּוֹד <b>לְטַעֲוַת עַמְמַיָּא<\/b> אֲרֵי יְיָ קַנָּא שְׁמֵיהּ אֵל קַנָּא הוּא:", "onk_en": "For you must not prostrate yourselves to another god [<b>false gods of the peoples<\/b>], because Adonoy—Jealous is His Name—He is a Jealous Almighty [God].", "pj": "אֲרוּם לֵית לְכוֹן רְשׁוּ לְמִסְגוֹד לֶאֱלָהָא אוֹחֲרָן אֲרוּם יְיָ קַנַּאי וּפוּרְעַן שְׁמֵיהּ אֱלָהּ קַנְּאַי וּפוּרְעַן הוּא", "pj_en": "for it is not lawful for thee to worship other gods; for the Lord is zealous and avengeful; His Name is God, the Zealous and the Avenger.", "tj": "", "tj_en": "", "rashi": "<b>קנא שמו.<\/b> מְקַנֵּא לִפָּרַע וְאֵינוֹ מְוַתֵּר, וְזֶהוּ כָּל לְשׁוֹן קִנְאָה – אוֹחֵז בְּנִצְחוֹנוֹ וּפוֹרֵעַ מֵאוֹיְבָיו:", "rashi_en": "קנא שמו WHOSE NAME IS קנא — Who is zealous (מקנא) to exact punishment from the sinners and is not indulgent towards idolatry. This (the above) is always the meaning of the root קנא wherever it is used in connection with God. Consequently קנא שמו His name (His characteristic) is קַנָּא that of a zealot, implies: He maintains (insists upon) his superiority over other gods, and punishes His enemies (those who worship idols)."}, {"ch": 34, "v": 15, "aliyah": 6, "heb": "פֶּן־תִּכְרֹ֥ת בְּרִ֖ית לְיוֹשֵׁ֣ב הָאָ֑רֶץ וְזָנ֣וּ&thinsp;<b>׀<\/b> אַחֲרֵ֣י אֱלֹֽהֵיהֶ֗ם וְזָבְחוּ֙ לֵאלֹ֣הֵיהֶ֔ם וְקָרָ֣א לְךָ֔ וְאָכַלְתָּ֖ מִזִּבְחֽוֹ׃", "onk": "דִּילְמָא תִגְזַר קְיַם לְיָתֵב אַרְעָא וְיִטְעוּן בָּתַר <b>טַעֲוַתְהוֹן<\/b> וְיִדְבְּחוּן לְטַעֲוַתְהוֹן וְיִקְרוּן לָךְ וְתֵיכוּל מִדִּבְחֵיהוֹן:", "onk_en": "[Take care] not to make a covenant with the people who live in the land, and go astray after their [<b>false<\/b>] gods [religions], and sacrifice to their [<b>false<\/b>] gods, [for he] will then call you and you will eat of his sacrifice.", "pj": "דִּילְמָא תִגְזוֹר קְיַים לְיָתֵיב אַרְעָא וְיִטְעוּן בָּתַר טַעֲוַותְהוֹן וְיִדְבְּחוּן לְטַעֲוַותְהוֹן וִיזַמְנוּן לָךְ וְתֵיכוֹל מִן דִּיבְחֵי טַעֲוַותְהוֹן", "pj_en": "Lest thou strike covenant with the dwellers in the land, and they draw thee astray after their idols, and they sacrifice to their idols, and invite thee, and thou eat of the sacrifices of their idols", "tj": "וִיטַעֲיָן:", "tj_en": "And they cause to err.", "rashi": "<b>ואכלת מזבחו.<\/b> כַּסָּבוּר אַתָּה שֶׁאֵין עֹנֶשׁ בַּאֲכִילָתוֹ, וַאֲנִי מַעֲלֶה עָלֶיךָ כְּמוֹדֶה בַעֲבוֹדָתָם, שֶׁמִּתּוֹךְ כָּךְ אַתָּה בָא וְלוֹקֵחַ מִבְּנוֹתָיו לְבָנֶיךָ (עבודה זרה ח'):", "rashi_en": "ואכלת מזבחו AND THOU EAT OF HIS SACRIFICE — You might perhaps think that there is no punishable offence in eating of it, this is not so, but I will account it unto you as though you consent to his idolatrous worship because through this (through partaking of his meals) you will be induced to take your daughters unto your sons (cf. Avodah Zarah 8a)."}, {"ch": 34, "v": 16, "aliyah": 6, "heb": "וְלָקַחְתָּ֥ מִבְּנֹתָ֖יו לְבָנֶ֑יךָ וְזָנ֣וּ בְנֹתָ֗יו אַחֲרֵי֙ אֱלֹ֣הֵיהֶ֔ן וְהִזְנוּ֙ אֶת־בָּנֶ֔יךָ אַחֲרֵ֖י אֱלֹהֵיהֶֽן׃", "onk": "וְתִסַּב מִבְּנַתְהוֹן לִבְנָיךְ וְיִטְעַיַּן בְּנַתְהוֹן בָּתַר <b>טַעֲוַתְהוֹן<\/b> וְיִטְעַיַּן יָת בְּנָיךְ בָּתַר <b>טַעֲוַתְהוֹן<\/b>:", "onk_en": "You will [then] accept his daughters [as wives] for your sons. His daughters will stray after their [<b>false<\/b>] gods, and they will lead your sons to stray after their [<b>false<\/b>] gods.", "pj": "וְתִיסַב מִבְּנַתְהוֹן לִבְנָךְ וְכַד טַעֲיָין בְּנַתְהוֹן בָּתַר טַעֲוַותְהֵין מַטְעֲיַין אוּף יַת בְּנָךְ בָּתַר טַעֲוַותְהֵין", "pj_en": "and thou take of their daughters for thy sons, and when their daughters wander after their idols they make thy sons also go astray after their idols.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 17, "aliyah": 6, "heb": "אֱלֹהֵ֥י מַסֵּכָ֖ה לֹ֥א תַעֲשֶׂה־לָּֽךְ׃", "onk": "דַּחֲלַן דְּמַתְכָא לָא תַעְבֵּד לָךְ:", "onk_en": "You must not make molten gods for yourselves.", "pj": "דַּחֲלַן דְּמַתְּכָא לָא תַעְבְּדוּן לְכוֹן", "pj_en": "Molten gods you shall not make to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 18, "aliyah": 6, "heb": "אֶת־חַ֣ג הַמַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔ךָ לְמוֹעֵ֖ד חֹ֣דֶשׁ הָאָבִ֑יב כִּ֚י בְּחֹ֣דֶשׁ הָֽאָבִ֔יב יָצָ֖אתָ מִמִּצְרָֽיִם׃", "onk": "יָת חַגָּא דְפַטִּירַיָּא תִּטַּר שִׁבְעָא יוֹמִין תֵּיכוּל פַּטִּירָא כְּמָא דִי פַקֵּדְתָּךְ לִזְמַן יַרְחָא דְאַבִּיבָא אֲרֵי בְּיַרְחָא דְאַבִּיבָא נְפַקְתָּא מִמִּצְרָיִם:", "onk_en": "Preserve the Festival of Matzos. Eat matzos for seven days as I commanded you, at the appointed time in the month of ripening [gra
