t who is to be sent at the end of the captivity.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 11, "aliyah": 5, "heb": "וּמָשַׁחְתָּ֥ אֶת־הַכִּיֹּ֖ר וְאֶת־כַּנּ֑וֹ וְקִדַּשְׁתָּ֖ אֹתֽוֹ׃", "onk": "וּתְרַבֵּי יָת כִּיּוֹרָא וְיָת בְּסִיסֵיהּ וּתְקַדֵּשׁ יָתֵיהּ:", "onk_en": "Anoint the laver and its base and sanctify it.", "pj": "וּתְרַבֵּי יַת כִּיּוֹרָא וְיַת בְּסִיסֵיהּ וּתְקַדֵּשׁ יָתֵיהּ מְטוּל יְהוֹשֻׁעַ מְשׁוּמְשָׁנָךְ רַבָּא דְסַנְהֶדְרִין דְּעִמֵּיהּ דְּעַל יְדוֹי עֲתִידָא אַרְעָא דְיִשְרָאֵל לְאִיתְפַּלְגָא וּמְשִׁיחָא בַּר אֶפְרַיִם דְּנָפִיק מִינֵיהּ דְּעַל יְדוֹי עֲתִידִין בֵּית יִשְרָאֵל לִמְנַצְחָא לְגוֹג וּלְסִיעָתֵיהּ בְּסוֹף יוֹמַיָא", "pj_en": "And thou shalt anoint the laver, and its base, and consecrate it, on account of Jehoshua thy minister, chief of the sanhedrin of his people; by whose hand the land of Israel is to be partitioned: and of Meshiha bar Ephraim, who shall spring from him, by whose hand the house of Israel is to vanquish Gog and his confederates at the end of the days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 12, "aliyah": 5, "heb": "וְהִקְרַבְתָּ֤ אֶֽת־אַהֲרֹן֙ וְאֶת־בָּנָ֔יו אֶל־פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְרָחַצְתָּ֥ אֹתָ֖ם בַּמָּֽיִם׃", "onk": "וּתְקָרֵב יָת אַהֲרֹן וְיָת בְּנוֹהִי לִתְרַע מַשְׁכַּן זִמְנָא וְתַסְחֵי יָתְהוֹן בְּמַיָּא:", "onk_en": "Bring Aharon and his sons to the entrance of the Tent of Meeting, and immerse them in a mikveh.", "pj": "וּתְקָרֵיב יַת אַהֲרן וְיַת בְּנוֹי לִתְרַע מַשְׁכַּן זִמְנָא וְתַסְחֵי יַתְהוֹן בְּמַיָא", "pj_en": "And thou shalt bring Aharon and his sons to the door of the tabernacle of ordinance, and wash them with water,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 13, "aliyah": 5, "heb": "וְהִלְבַּשְׁתָּ֙ אֶֽת־אַהֲרֹ֔ן אֵ֖ת בִּגְדֵ֣י הַקֹּ֑דֶשׁ וּמָשַׁחְתָּ֥ אֹת֛וֹ וְקִדַּשְׁתָּ֥ אֹת֖וֹ וְכִהֵ֥ן לִֽי׃", "onk": "וְתַלְבֵּשׁ יָת אַהֲרֹן יָת לְבוּשֵׁי קוּדְשָׁא וּתְרַבֵּי יָתֵיהּ וּתְקַדֵּשׁ יָתֵיהּ וִישַׁמֵּשׁ <b>קֳדָמָי<\/b>:", "onk_en": "Clothe Aharon with the sacred garments. Anoint him and sanctify him so that he may serve as a kohein to [<b>before<\/b>] Me.", "pj": "וְתַלְבֵּשׁ יַת אַהֲרן לְבוּשֵׁי קוּדְשָׁא וּתְרַבֵּי יָתֵיהּ וּתְקַדֵּשׁ יָתֵיהּ וִישַׁמֵּשׁ קֳדָמַי", "pj_en": "and clothe Aharon with the holy vestments, and anoint him, and consecrate him; that he may minister before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 14, "aliyah": 5, "heb": "וְאֶת־בָּנָ֖יו תַּקְרִ֑יב וְהִלְבַּשְׁתָּ֥ אֹתָ֖ם כֻּתֳּנֹֽת׃", "onk": "וְיָת בְּנוֹהִי תְּקָרֵב וְתַלְבֵּשׁ יָתְהוֹן כִּתּוּנִין:", "onk_en": "Bring his sons and clothe them with undershirts.", "pj": "וְיַת בְּנוֹי תַּקְרִיב וְתַלְבְּשִׁינוּן כִּיתּוּנִין", "pj_en": "And his sons thou shalt bring near, and dress them with tunics,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 15, "aliyah": 5, "heb": "וּמָשַׁחְתָּ֣ אֹתָ֗ם כַּאֲשֶׁ֤ר מָשַׁ֙חְתָּ֙ אֶת־אֲבִיהֶ֔ם וְכִהֲנ֖וּ לִ֑י וְ֠הָיְתָ֠ה לִהְיֹ֨ת לָהֶ֧ם מׇשְׁחָתָ֛ם לִכְהֻנַּ֥ת עוֹלָ֖ם לְדֹרֹתָֽם׃", "onk": "וּתְרַבֵּי יָתְהוֹן כְּמָא דִי רַבֵּיתָא יָת אֲבוּהוֹן וִישַׁמְּשׁוּן <b>קֳדָמָי<\/b> וּתְהֵי לְמֵהֶוֵי לְהוֹן רְבוּתְהוֹן לְכַהֲנוּת עָלָם לְדָרֵיהוֹן:", "onk_en": "Anoint them as you anointed their father, so that they may serve as kohanim to [<b>before<\/b>] Me. This should be done so that their anointing will make them an eternal kehunah throughout their generations.”", "pj": "וּתְרַבֵּי יַתְהוֹן הֵיכְמָא דְרָבִית יַת אֲבוּהוֹן וִישַׁמְשׁוּן קֳדָמַי וּתְהֵי לְמֶהֱוֵי לְהוֹן רְבוּתְהוֹן לִכְהוּנַת עֲלָם לְדָרֵיהוֹן", "pj_en": "and anoint them, as thou didst anoint their father, that they may minister before Me; and their consecration shall be for a perpetual priesthood in their generations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 16, "aliyah": 5, "heb": "וַיַּ֖עַשׂ מֹשֶׁ֑ה כְּ֠כֹ֠ל אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֹת֖וֹ כֵּ֥ן עָשָֽׂה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַעֲבַד משֶׁה כְּכֹל דִּי פַּקִּיד יְיָ יָתֵיהּ כֵּן עֲבָד:", "onk_en": "Moshe did according to all that Adonoy commanded him—so he did.", "pj": "וְעָבַד משֶׁה הֵי כְּכָל מַה דְּפַקֵּיד יְיָ יָתֵיהּ הֵיכְדֵין עֲבָד", "pj_en": "And Mosheh did all that the Lord commanded, so did he.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 17, "aliyah": 6, "heb": "וַיְהִ֞י בַּחֹ֧דֶשׁ הָרִאשׁ֛וֹן בַּשָּׁנָ֥ה הַשֵּׁנִ֖ית בְּאֶחָ֣ד לַחֹ֑דֶשׁ הוּקַ֖ם הַמִּשְׁכָּֽן׃", "onk": "וַהֲוָה בְּיַרְחָא קַדְמָאָה בְּשַׁתָּא תִנְיֵתָא בְּחַד לְיַרְחָא אִתָּקַם מַשְׁכְּנָא:", "onk_en": "It was in the first month of the second year, on the first day of the month, that the mishkon was set up.", "pj": "וַהֲוָה בְּיַרְחָא קַמָאָה הוּא יַרְחָא דְנִיסָן בְּשַׁתָּא תִּנְיֵינְתָא בְּחַד לְיַרְחָא אִיתָקַם מַשְׁכְּנָא", "pj_en": "And it was in the first month, that is, the month Nisan, in the second year, in the first of the month, that he reared up the tabernacle.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 18, "aliyah": 6, "heb": "וַיָּ֨קֶם מֹשֶׁ֜ה אֶת־הַמִּשְׁכָּ֗ן וַיִּתֵּן֙ אֶת־אֲדָנָ֔יו וַיָּ֙שֶׂם֙ אֶת־קְרָשָׁ֔יו וַיִּתֵּ֖ן אֶת־בְּרִיחָ֑יו וַיָּ֖קֶם אֶת־עַמּוּדָֽיו׃", "onk": "וַאֲקֵם משֶׁה יָת מַשְׁכְּנָא וִיהַב יָת סַמְּכוֹהִי וְשַׁוִּי יָת דַּפּוֹהִי וִיהַב יָת עַבְרוֹהִי וַאֲקֵם יָת עַמּוּדוֹהִי:", "onk_en": "Moshe set up the mishkon, placed its sockets, put up its boards, put in its bars, and set up its pillars.", "pj": "וְאָקִים משֶׁה יַת מַשְׁכְּנָא וִיהַב יַת חוֹמְרוֹי וְשַׁוִּי יַת לוּחוֹי וִיהַב יַת נַגְרוֹי וְאָקִים יַת עַמּוּדוֹי", "pj_en": "And Mosheh reared the tabernacle, and placed its bases, and set its boards, and placed its bars, and reared its pillars.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 19, "aliyah": 6, "heb": "וַיִּפְרֹ֤שׂ אֶת־הָאֹ֙הֶל֙ עַל־הַמִּשְׁכָּ֔ן וַיָּ֜שֶׂם אֶת־מִכְסֵ֥ה הָאֹ֛הֶל עָלָ֖יו מִלְמָ֑עְלָה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּפְרַס יָת פְּרָסָא עַל מַשְׁכְּנָא וְשַׁוִּי יָת חוֹפָאָה דְמַשְׁכְּנָא עֲלוֹהִי מִלְּעֵלָּא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "He spread the tent over the mishkon and placed the tent’s covering above it, just as Adonoy commanded Moshe.", "pj": "וּפְרַס יַת פְּרָסָא עַל מַשְׁכְּנָא וְשַׁוִּי יַת חוֹפָאָה לְמַשְׁכְּנָא עֲלוֹי מִן לְעֵילָא הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "And he spread the tent over the tabernacle, and placed the covering of the tabernacle upon it above, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויפרש את האהל.<\/b> הֵן יְרִיעוֹת הָעִזִּים:", "rashi_en": "ויפרש את האהל AND HE SPREAD THE TENT The אהל is the curtains of goats’ skins."}, {"ch": 40, "v": 20, "aliyah": 6, "heb": "וַיִּקַּ֞ח וַיִּתֵּ֤ן אֶת־הָעֵדֻת֙ אֶל־הָ֣אָרֹ֔ן וַיָּ֥שֶׂם אֶת־הַבַּדִּ֖ים עַל־הָאָרֹ֑ן וַיִּתֵּ֧ן אֶת־הַכַּפֹּ֛רֶת עַל־הָאָרֹ֖ן מִלְמָֽעְלָה׃", "onk": "וּנְסִיב וִיהַב יָת סַהֲדוּתָא לַאֲרוֹנָא וְשַׁוִּי יָת אֲרִיחַיָּא עַל אֲרוֹנָא וִיהַב יָת כַּפֻּרְתָּא עַל אֲרוֹנָא מִלְעֵלָּא:", "onk_en": "He took the Testimony and placed it into the ark, put the poles on the ark, and put the cover on top of the ark.", "pj": "וּנְסֵיב יַת תְּרֵין לוּחֵי אַבְנָא לוּחֵי קְיָימָא דְאִתְיְהִיבוּ לֵיהּ בְּחוֹרֵב וַהֲווּ קַיְימִין עַל אָת בְּבֵית אוּלְפָנָא הִנּוּן לוּחֵי סַהֲדוּתָא וְתַבְרֵי לוּחַיָא בְּאָרוֹנָא וְשַׁוִי יַת אֲרִיחַיָא עַל אֲרוֹנָא וִיהַב יַת כַּפּוּרְתָּא בַּהֲדֵי כְּרוּבַיָא דְנַפְקִין נְגִיד מִינָהּ עַל אֲרוֹנָא מִלְעֵילָא", "pj_en": "And he took the two tables of stone, the tables of the covenant which were given to him in Horeb, and set them up for a sign in the House of Instruction: they are the tables of the testimony. And the broken tables (he deposited) in the ark. And he set the staves in the ark, and placed the mercy seat, with the kerubaia that were produced for it of beaten work, upon the ark above.", "tj": "", "tj_en": "", "rashi": "<b>את העדת.<\/b> הַלּוּחוֹת:", "rashi_en": "את העדות THE TESTIMONY — the Tablets."}, {"ch": 40, "v": 21, "aliyah": 6, "heb": "וַיָּבֵ֣א אֶת־הָאָרֹן֮ אֶל־הַמִּשְׁכָּן֒ וַיָּ֗שֶׂם אֵ֚ת פָּרֹ֣כֶת הַמָּסָ֔ךְ וַיָּ֕סֶךְ עַ֖ל אֲר֣וֹן הָעֵד֑וּת כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאָעֵל יָת אֲרוֹנָא לְמַשְׁכְּנָא וְשַׁוִּי יָת פָּרֻכְתָּא דִפְרָסָא וְאַטֵּל עַל אֲרוֹנָא דְסַהֲדוּתָא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "He brought the ark into the mishkon and fastened the paroches (partition)-screen so that it covered the ark of Testimony, just as Adonoy commanded Moshe.", "pj": "וְהַנְעַל יַת אֲרוֹנָא לְמַשְׁכְּנָא וְשַׁוִי יַת פַּרְגוֹדָא דִפְרָסָא וְטַלְלֵיהּ עַל אֲרוֹנָא דְסַהֲדוּתָא הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "And he brought the ark into the tabernacle and set the veil of the covering and shadowed there with the ark of the testimony, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 22, "aliyah": 6, "heb": "וַיִּתֵּ֤ן אֶת־הַשֻּׁלְחָן֙ בְּאֹ֣הֶל מוֹעֵ֔ד עַ֛ל יֶ֥רֶךְ הַמִּשְׁכָּ֖ן צָפֹ֑נָה מִח֖וּץ לַפָּרֹֽכֶת׃", "onk": "וִיהַב יָת פָּתוֹרָא בְּמַשְׁכַּן זִמְנָא עַל צִדָּא דְמַשְׁכְּנָא צִפּוּנָא מִבָּרָא לְפָרֻכְתָּא:", "onk_en": "He placed the table in the Tent of Meeting on the north side of the mishkon, outside the paroches (partition).", "pj": "וִיהַב יַת פָּתוֹרָא בְּמַשְׁכַּן זִימְנָא עַל שִׁידָא דְמַשְׁכְּנָא צִפּוּנָא מִבָּרָא לְפַרְגוֹדָא", "pj_en": "And he placed the table in the tabernacle of ordinance, at the side of the tabernacle northward without the veil,", "tj": "", "tj_en": "", "rashi": "<b>על ירך המשכן צפנה.<\/b> בַּחֵצִי הַצְּפוֹנִי שֶׁל רֹחַב הַבַּיִת:<br><br><b>ירך.<\/b> כְּתַרְגּוּמוֹ, צִדָּא, כַּיָּרֵךְ הַזֶּה שֶׁהוּא בְּצִדּוֹ שֶׁל אָדָם:", "rashi_en": "על ירך המשכן צפנה UPON THE SIDE OF THE DWELLING NORTHWARD — i. e. in the northern half of the width of the house (not by the northern wall) (Yoma 33b).<br><br>ירך — This must be understood at the Targum renderd it: צדא. The real meaning is “thigh”, but the side of anything is just like the thigh which is at a person’s side."}, {"ch": 40, "v": 23, "aliyah": 6, "heb": "וַיַּעֲרֹ֥ךְ עָלָ֛יו עֵ֥רֶךְ לֶ֖חֶם לִפְנֵ֣י יְהֹוָ֑ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְסַדַּר עֲלוֹהִי סִדּוּר דִּלְחֵם קֳדָם יְיָ כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "He set upon it an arrangement of bread before Adonoy, just as Adonoy commanded Moshe.", "pj": "וְסַדֵּר עֲלוֹהִי סִדוּרִין דִּלְחֵם קֳדָם יְיָ הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "and set in order upon it the rows of bread before the Lord, as the Lord commanded Mosheh.", "tj": "וּסְדַר עֲלוֹהִי לְחֵם סְדַר אַפַּיָא קֳדָם יְיָ:", "tj_en": "And he set in order upon it the order of the bread of faces before the Lord.", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 24, "aliyah": 6, "heb": "וַיָּ֤שֶׂם אֶת־הַמְּנֹרָה֙ בְּאֹ֣הֶל מוֹעֵ֔ד נֹ֖כַח הַשֻּׁלְחָ֑ן עַ֛ל יֶ֥רֶךְ הַמִּשְׁכָּ֖ן נֶֽגְבָּה׃", "onk": "וְשַׁוִּי יָת מְנַרְתָּא בְּמַשְׁכַּן זִמְנָא לָקֳבֵל פָּתוֹרָא עַל צִדָּא דְמַשְׁכְּנָא לְדָרוֹמָא:", "onk_en": "He placed the Menorah in the Tent of Meeting, opposite the table, on the south side of the mishkon.", "pj": "וְשַׁוֵּי יַת מְנַרְתָּא בְּמַשְׁכַּן זִימְנָא כָּל קְבֵיל פָּתוֹרָא עַל שִׁידָא דְמַשְׁכְּנָא דְרוֹמָא", "pj_en": "And he placed the candelabrum in the tabernacle of ordinance, over against the table upon the side of the tabernacle southward,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 25, "aliyah": 6, "heb": "וַיַּ֥עַל הַנֵּרֹ֖ת לִפְנֵ֣י יְהֹוָ֑ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַדְלֵק בּוֹצִינָהָא קֳדָם יְיָ כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "He lit the lamps before Adonoy, just as Adonoy commanded Moshe.", "pj": "וְאַדְלִיק יַת בּוֹצִינַיָא קֳדָם יְיָ הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "and kindled the lamps before the Lord, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 26, "aliyah": 6, "heb": "וַיָּ֛שֶׂם אֶת־מִזְבַּ֥ח הַזָּהָ֖ב בְּאֹ֣הֶל מוֹעֵ֑ד לִפְנֵ֖י הַפָּרֹֽכֶת׃", "onk": "וְשַׁוִּי יָת מַדְבְּחָא דְדַהֲבָא בְּמַשְׁכַּן זִמְנָא קֳדָם פָּרֻכְתָּא:", "onk_en": "He placed the golden altar inside the Tent of Meeting, in front of the paroches.", "pj": "וְשַׁוִּי יַת מַדְבְּחָא דְדַהֲבָא בְּמַשְׁכַּן זִימְנָא קֳדָם פַּרְגוֹדָא", "pj_en": "And he set the golden altar in the tabernacle of ordinance before the veil,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 27, "aliyah": 6, "heb": "וַיַּקְטֵ֥ר עָלָ֖יו קְטֹ֣רֶת סַמִּ֑ים כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַקְטַר עֲלוֹהִי קְטֹרֶת בּוּסְמִין כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "He burned the incense of spices upon it, just as Adonoy commanded Moshe.", "pj": "וְאַסֵיק עֲלוֹי קְטוֹרֶת בּוּסְמִין הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "and burned sweet incense upon it, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויקטר עליו קטרת.<\/b> שַׁחֲרִית וְעַרְבִית, כְּמוֹ שֶׁנֶּאֱמַר בַּבֹּקֶר בַּבֹּקֶר בְּהֵיטִיבוֹ אֶת הַנֵּרוֹת וְגוֹמֵר (שמות ל'):", "rashi_en": "ויקטר עליו קטרת AND HE CAUSED THE INCENSE OF AROMATICS TO ASCEND UPON IT in the morning and in the evening, as it is said, (Exodus 30:7, 8) “[And Aaron shall cause incense of aromatics to ascend thereon in fumes] every morning when he trimmeth the lamps, [and when he trimmeth the lamps at even etc.]”."}, {"ch": 40, "v": 28, "aliyah": 7, "heb": "וַיָּ֛שֶׂם אֶת־מָסַ֥ךְ הַפֶּ֖תַח לַמִּשְׁכָּֽן׃", "onk": "וְשַׁוִּי יָת פְּרָסָא דְתַרְעָא לְמַשְׁכְּנָא:", "onk_en": "He set up the screen at the mishkon’s entrance.", "pj": "וְשַׁוֵּי יַת פְּרָסָא דְתַרְעָא לְמַשְׁכְּנָא", "pj_en": "And he set the hanging at the gate of the tabernacle.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 29, "aliyah": 7, "heb": "וְאֵת֙ מִזְבַּ֣ח הָעֹלָ֔ה שָׂ֕ם פֶּ֖תַח מִשְׁכַּ֣ן אֹֽהֶל־מוֹעֵ֑ד וַיַּ֣עַל עָלָ֗יו אֶת־הָעֹלָה֙ וְאֶת־הַמִּנְחָ֔ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיָת מַדְבְּחָא דַעֲלָתָא שַׁוִּי בִּתְרַע מַשְׁכְּנָא מַשְׁכַּן זִמְנָא וְאַסֵּק עֲלוֹהִי יָת עֲלָתָא וְיָת מִנְחָתָא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "He placed the burnt-offering altar at the entrance of the mishkon of the Tent of Meeting. He sacrificed on it a burnt-offering and a meal-offering, just as Adonoy commanded Moshe.", "pj": "וְיַת מַדְבְּחָא דְעָלָתָא שַׁוִי בִּתְרַע מַשְׁכְּנָא וְאַסֵּיק עֲלוֹי יַת עֲלָתָא וְיַת מִנְחָתָא הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "And the altar of burnt offering he placed at the gate of the tabernacle, and offered thereon the burnt offering and the oblation, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויעל עליו וגו'.<\/b> אַף בַּיּוֹם הַשְּׁמִינִי לַמִּלּוּאִים, שֶׁהוּא יוֹם הֲקָמַת הַמִּשְׁכָּן, שִׁמֵּשׁ מֹשֶׁה וְהִקְרִיב קָרְבְּנוֹת צִבּוּר, חוּץ מֵאוֹתָן שֶׁנִּצְטַוּוּ בוֹ בַיּוֹם, שֶׁנֶּאֱמַר קְרַב אֶל הַמִּזְבֵּחַ וְגוֹמֵר (ויקרא ט'):<br><br><b>את העלה.<\/b> עוֹלַת הַתָּמִיד:<br><br><b>ואת המנחה.<\/b> מִנְחַת נְסָכִים שֶׁל תָּמִיד, כְּמוֹ שֶׁנֶּאֱמַר וְעִשָּׂרֹן סֹלֶת בָּלוּל בְּשֶׁמֶן וְגוֹמֵר (שמות כ\"ט):", "rashi_en": "ויעל עליו וגו׳ AND OFFERED UPON IT etc. Not only during the first seven days of the consecration of Aaron and his sons during which Moses set the dwelling up and then dismantled it, but also on the eighth day of the consecration which was the day of the final erection of the dwelling for its ordinary purposes did Moses officiate and offer the congregational sacrifices except those which had been commanded exclusively for that very day, as it is said, (Leviticus 9:7) “[And Moses said to Aaron], approach unto the altar and offer etc.<br><br>את העלה THE BURNT OFFERING — the daily burnt offering.<br><br>ואח המנחה AND THE MEAL OFFERING — The meal offering brought together with the libation which was made with the daily burnt offering, at it is said, (Exodus 29:40) “[And with the one lamb] (of the daily burnt offering) shall be brought a tenth deal of flour mingled with … oil; [and the fourth part of a hin of wine for a libation …]”."}, {"ch": 40, "v": 30, "aliyah": 7, "heb": "וַיָּ֙שֶׂם֙ אֶת־הַכִּיֹּ֔ר בֵּֽין־אֹ֥הֶל מוֹעֵ֖ד וּבֵ֣ין הַמִּזְבֵּ֑חַ וַיִּתֵּ֥ן שָׁ֛מָּה מַ֖יִם לְרׇחְצָֽה׃", "onk": "וְשַׁוִּי יָת כִּיוֹרָא בֵּין מַשְׁכַּן זִמְנָא וּבֵין מַדְבְּחָא וִיהַב תַּמָּן מַיָּא <b>לְקִדּוּשׁ<\/b>:", "onk_en": "He set the laver between the Tent of Meeting and the altar, and put water into it for washing [<b>sanctification<\/b>].", "pj": "וְשַׁוֵי יַת כִּיּוֹרָא עַל בְּסִיסֵיהּ בֵּינֵי מַשְׁכַּן זִמְנָא וּבֵינֵי מַדְבְּחָא וִיהַב תַּמָּן מַיִין חַיִין לְקִידוּשׁ וְלָא פַּסְקִין וְלָא סַרְיַן כָּל יוֹמַיָא", "pj_en": "And he set the laver upon its foundation between the tabernacle of ordinance and the altar, and put living water therein for purification, that it may not fail, nor become corrupt all the days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 31, "aliyah": 7, "heb": "וְרָחֲצ֣וּ מִמֶּ֔נּוּ מֹשֶׁ֖ה וְאַהֲרֹ֣ן וּבָנָ֑יו אֶת־יְדֵיהֶ֖ם וְאֶת־רַגְלֵיהֶֽם׃", "onk": "<b>וִיקַדְּשׁוּן<\/b> מִנֵּיהּ משֶׁה וְאַהֲרֹן וּבְנוֹהִי יָת יְדֵיהוֹן וְיָת רַגְלֵיהוֹן:", "onk_en": "Moshe, Aharon and his sons washed [<b>would sanctify<\/b>] their hands and feet from it,", "pj": "וְנַסְבִין משֶׁה וְאַהֲרן וּבְנוֹי מִינֵיהּ בְּנַטְלָא וּמְקַדְשִׁין מִינֵיהּ יַת יְדֵיהוֹן וְיַת רִגְלֵיהוֹן", "pj_en": "And Mosheh, and Aharon, and his sons, took from it for their ablutions, and sanctified therewith their hands and their feet;", "tj": "", "tj_en": "", "rashi": "<b>ורחצו ממנו משה ואהרן.<\/b> יוֹם שְׁמִינִי לַמִּלּוּאִים הֻשְׁווּ כֻלָּם לִכְהֻנָּה, וְתַרְגּוּמוֹ וּמְקַדְּשִׁין מִנֵּהּ, בּוֹ בַיּוֹם קִדֵּשׁ מֹשֶׁה עִמָּהֶם:", "rashi_en": "ורחצו ממנו משה ואהרן AND MOSES AND AARON [AND HIS SONS] LAVED [THEIR HANDS] — On the eighth day of the consecration all of them mentioned here, including Moses, were alike in respect of the priestly office. The translation of ורחצו in the Targum should therefore be ומקדשין, and they were hallowing (i. e. they then hallowed their hands and their feet), for on that day Moses laved his hands together with them (Aaron and his sons)."}, {"ch": 40, "v": 32, "aliyah": 7, "heb": "בְּבֹאָ֞ם אֶל־אֹ֣הֶל מוֹעֵ֗ד וּבְקׇרְבָתָ֛ם אֶל־הַמִּזְבֵּ֖חַ יִרְחָ֑צוּ כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּמֵעַלְהוֹן לְמַשְׁכַּן זִמְנָא וּבְמִקְרָבְהוֹן לְמַדְבְּחָא <b>יְקַדְּשׁוּן<\/b> כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "when they came to the Tent of Meeting and when they approached the altar they would wash [<b>sanctify themselves<\/b>], just as Adonoy commanded Moshe.", "pj": "בִּזְמַן מֵיעַלְהוֹן לְמַשְׁכַּן זִימְנָא וּבְמִקְרְבֵיהוֹן לְמַדְבְּחָא מְקַדְשִׁין הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "at the time they entered into the tabernacle of ordinance, or approached unto the altar, they purified themselves, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ובקרבתם.<\/b> כְּמוֹ וּבְקָרְבָם – כְּשֶׁיִּקְרְבוּ:", "rashi_en": "ובקרבתם — This is equivalent to ובקרבם, and has an imperfect sense, the same as כשיקרבו. when they were approaching."}, {"ch": 40, "v": 33, "aliyah": 7, "heb": "וַיָּ֣קֶם אֶת־הֶחָצֵ֗ר סָבִיב֙ לַמִּשְׁכָּ֣ן וְלַמִּזְבֵּ֔חַ וַיִּתֵּ֕ן אֶת־מָסַ֖ךְ שַׁ֣עַר הֶחָצֵ֑ר וַיְכַ֥ל מֹשֶׁ֖ה אֶת־הַמְּלָאכָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲקֵם יָת דַּרְתָּא סְחוֹר סְחוֹר לְמַשְׁכְּנָא וּלְמַדְבְּחָא וִיהַב יָת פְּרָסָא דִּתְרַע דַּרְתָּא וְשֵׁיצֵי משֶׁה יָת עִבִידָא:", "onk_en": "He set up the enclosure around the mishkon and the altar, and put up the screen at the enclosure’s entrance, and thus Moshe completed the work.", "pj": "וְאָקֵים יַת דַרְתָּא חֲזוֹר חֲזוֹר לְמַשְׁכְּנָא וּלְמַדְבְּחָא וִיהַב יַת פְּרָסָא דְבִתְרַע מַשְׁכְּנָא וּגְמַר משֶׁה יַת עִיבִידְתָּא", "pj_en": "And he reared up the court round about the tabernacle and the altar, and placed the hanging which was for the gate of the tabernacle. And Mosheh completed the work.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 34, "aliyah": 7, "heb": "וַיְכַ֥ס הֶעָנָ֖ן אֶת־אֹ֣הֶל מוֹעֵ֑ד וּכְב֣וֹד יְהֹוָ֔ה מָלֵ֖א אֶת־הַמִּשְׁכָּֽן׃", "onk": "וַחֲפָא עֲנָנָא יָת מַשְׁכַּן זִמְנָא וִיקָרָא דַיְיָ אִתְמְלִי יָת מַשְׁכְּנָא:", "onk_en": "The cloud covered the Tent of Meeting, and the glory of Adonoy filled the mishkon.", "pj": "וַחֲפָא עֲנַן יְקָרָא יַת מַשְׁכַּן זִמְנָא וְאִיקַר שְׁכִינְתָּא דַיְיָ אִתְמְלֵי יַת מַשְׁכְּנָא", "pj_en": "Then the Cloud of Glory overspread the tabernacle of ordinance, and the glory of the Shekinah of the Lord filled the tabernacle.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 35, "aliyah": 7, "heb": "וְלֹא־יָכֹ֣ל מֹשֶׁ֗ה לָבוֹא֙ אֶל־אֹ֣הֶל מוֹעֵ֔ד כִּֽי־שָׁכַ֥ן עָלָ֖יו הֶעָנָ֑ן וּכְב֣וֹד יְהֹוָ֔ה מָלֵ֖א אֶת־הַמִּשְׁכָּֽן׃", "onk": "וְלָא יָכִיל משֶׁה לְמֵעַל לְמַשְׁכַּן זִמְנָא אֲרֵי שְׁרָא עֲלוֹהִי עֲנָנָא וִיקָרָא דַיְיָ אִתְמְלִי יָת מַשְׁכְּנָא:", "onk_en": "Moshe was unable to enter the Tent of Meeting because the cloud rested on it, and the glory of Adonoy filled the mishkon.", "pj": "וְלָא הֲוָה אֶפְשַׁר לְמשֶׁה לְמֵיעַל לְמַשְׁכַּן זִמְנָא אֲרוּם שְׁרָא עֲלוֹי עֲנַן יְקָרָא וְאִיקַר שְׁכִינְתָּא דַיְיָ אִתְמְלֵי יַת מַשְׁכְּנָא", "pj_en": "And Mosheh was not able to enter the tabernacle of ordinance, because the Cloud of Glory rested upon it, and the glory of the Lord's Shekinah filled the tabernacle.", "tj": "", "tj_en": "", "rashi": "<b>ולא יכל משה לבוא אל אהל מועד.<\/b> וְכָתוּב אֶחָד אוֹמֵר וּבְבֹא מֹשֶׁה אֶל אֹהֶל מוֹעֵד (במדבר ז')? בָּא הַכָּתוּב הַשְּׁלִישִׁי וְהִכְרִיעַ בֵּינֵיהֶם – כִּי שָׁכַן עָלָיו הֶעָנָן, אֱמֹר מֵעַתָּה כָּל זְמַן שֶׁהָיָה עָלָיו הֶעָנָן לֹא הָיָה יָכוֹל לָבֹא, נִסְתַּלֵּק הֶעָנָן נִכְנָס וּמְדַבֵּר עִמּוֹ (ספרא):", "rashi_en": "ולא יכל משה לבא אל אהל מועד AND MOSES WAS NOT ABLE TO COME INTO THE APPOINTED TENT — But another verse says, (Numbers 7:89) “And when Moses came into the appointed tent [to speak with Him then he heard the voice]”! There comes, however, a third verse and reconciles these apparently contradictory verses, for it says here כי שכן עליו הענן “For (or when) the cloud abode thereon (on the appointed tent)”. Hence you may say: so long as the cloud was upon it “he was not able to come into the appointed tent”, but as soon as the cloud disappeared he entered it and spoke with Him (Sifra, Braita d'Rabbi Yishmael 18)."}, {"ch": 40, "v": 36, "aliyah": 7, "heb": "וּבְהֵעָל֤וֹת הֶֽעָנָן֙ מֵעַ֣ל הַמִּשְׁכָּ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל בְּכֹ֖ל מַסְעֵיהֶֽם׃", "onk": "וּבְאִסְתַּלָּקוּת עֲנָנָא מֵעִלָּוֵי מַשְׁכְּנָא נָטְלִין בְּנֵי יִשְׂרָאֵל בְּכֹל מַטְּלָנֵיהוֹן:", "onk_en": "When the cloud rose up from over the mishkon, the B’nei Yisrael would set out in all their travels.", "pj": "וּבְאִישׁוֹן אִסְתַּלְקוּת עֲנַן יְקָרָא מֵעִלַוֵי מַשְׁכְּנָא נַטְלִין בְּנֵי יִשְרָאֵל בְּכָל מַטְלָנֵיהוֹן", "pj_en": "At the time when the Cloud of Glory ascended from the tabernacle, the sons of Israel went forward in all their journeys;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 37, "aliyah": 7, "heb": "וְאִם־לֹ֥א יֵעָלֶ֖ה הֶעָנָ֑ן וְלֹ֣א יִסְע֔וּ עַד־י֖וֹם הֵעָלֹתֽוֹ׃", "onk": "וְאִם לָא יִסְתַּלַּק עֲנָנָא וְלָא נָטְלִין עַד יוֹמָא דְּאִסְתַּלָּקוּתֵיהּ:", "onk_en": "If the cloud did not rise, they would not set out until the day that it rose.", "pj": "וְאִין לָא מִסְתַּלֵּק עֲנַן יְקָרָא וְלָא נַטְלִין עַד יוֹם אִסְתַּלְקוּתֵיהּ", "pj_en": "but if the Cloud of Glory went not up, they did not go forward until the day when it ascended.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 38, "aliyah": 7, "heb": "כִּי֩ עֲנַ֨ן יְהֹוָ֤ה עַֽל־הַמִּשְׁכָּן֙ יוֹמָ֔ם וְאֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑וֹ לְעֵינֵ֥י כׇל־בֵּֽית־יִשְׂרָאֵ֖ל בְּכׇל־מַסְעֵיהֶֽם׃", "onk": "אֲרֵי עֲנָנָא <b>יְקָרָא דַ<\/b>יְיָ עַל מַשְׁכְּנָא בִּימָמָא <b>וְחֵיזוּ<\/b> אֶשָּׁתָא הֲוֵי בְלֵילְיָא בֵּיהּ לְעֵינֵי כָל בֵּית יִשְׂרָאֵל בְּכֹל מַטְּלָנֵיהוֹן:", "onk_en": "For the cloud of [<b>the Glory of<\/b>] Adonoy was upon the mishkon by day, and there was a [<b>vision of<\/b>] fire in it by night, before the eyes of the entire Beis Yisrael, in all their travels.", "pj": "אֲרוּם עֲנַן יְקָרָא דַיְיָ הֲוָה מְטַלָל עַל מַשְׁכְּנָא בִּימָמָא וַעֲמוּדָא דְאֵישָׁתָא הֲוָה מִנְהַר בְּלֵילְיָא וְחַמְיָין כָּל בְּנֵי יִשְרָאֵל בְּכָל מַטְלָנֵיהוֹן", "pj_en": "For the Cloud of the Glory of the Lord overspread the tabernacle by day, and (as) a column of fire it gave light in the night, that all the sons of Israel might see in all their journeys.", "tj": "אֲרוּם עֲנַן יְקַר שְׁכִינְתֵּיהּ דַיְיָ הֲוָה מַטְלָל עַל מַשְׁכְּנָא בִּימָמִין וְאֵשָׁתָא הֲוָה מְנַהֲרָא עִלַוֵיהּ לֵילְיָא חַמְיַין כָּל בֵּית יִשְרָאֵל בְּכָל מַטְלָנֵיהוֹן:", "tj_en": "Because the Cloud of the Glory of the Lord's Shekinah overspread the tabernacle by day, and a fire shined upon it all the nights; all the sons of Israel seeing in all their journeys.", "rashi": "<b>לעיני כל בית ישראל בכל מסעיהם.<\/b> בְּכָל מַסָּע שֶׁהָיוּ נוֹסְעִים, הָיָה הֶעָנָן שׁוֹכֵן בַּמָּקוֹם אֲשֶׁר יַחֲנוּ שָׁם; מְקוֹם חֲנִיָּתָן אַף הוּא קָרוּי מַסָּע, וְכֵן וַיֵּלֶךְ לְמַסָּעָיו (בראשית י\"ג), וְכֵן אֵלֶּה מַסְעֵי (במדבר ל\"ג), לְפִי שֶׁמִּמְּקוֹם הַחֲנִיָּה חָזְרוּ וְנָסְעוּ, לְכָךְ נִקְרְאוּ כֻלָּן מַסָּעוֹת:", "rashi_en": "לעיני כל בית ישראל בכל מסעיהם [THE CLOUD WAS ON THE TABERNACLE] … IN THE SIGHT OF ALL THE HOUSE OF ISRAEL, THROUGHOUT ALL THEIR JOURNEYS — At every מסע which they made (according to Rashi this means: at every station at which they stopped) the cloud rested upon the Tabernacle in the place where they encamped. A place where they encamped is also called מסע (the literal meaning of which is “journey”). Similar is, (Genesis 13:3) “And he went on to his resting places (למסעיו)“ (cf. Rashi on this verse); similar also is, (Numbers 33:1) “These are the מסעי” — “the places of encampment”. Because from the place of encampment they always set out again on a new journey therefore all the different stages of their journeys (including the places where they encamped) are called מסעות."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
