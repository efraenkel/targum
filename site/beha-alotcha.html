<style>

}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

<script>
const DATA = [{"ch": 8, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying;", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 2, "aliyah": 1, "heb": "דַּבֵּר֙ אֶֽל־אַהֲרֹ֔ן וְאָמַרְתָּ֖ אֵלָ֑יו בְּהַעֲלֹֽתְךָ֙ אֶת־הַנֵּרֹ֔ת אֶל־מוּל֙ פְּנֵ֣י הַמְּנוֹרָ֔ה יָאִ֖ירוּ שִׁבְעַ֥ת הַנֵּרֽוֹת׃", "onk": "מַלֵּל עִם אַהֲרֹן וְתֵימַר לֵיהּ בְּאַדְלָקוּתָךְ יָת בּוֹצִינַיָּא לָקֳבֵל אַפֵּי מְנַרְתָּא יְהוֹן מְנַהֲרִין שִׁבְעָא בוֹצִינַיָּא:", "onk_en": "Speak to Aharon, and say to him; When you light the lamps towards the face of the Menorah shall the seven lamps cast [their] light.", "pj": "מַלֵיל עִם אַהֲרן וְתֵימַר לֵיהּ בִּזְמַן אַדְלָקוּתָךְ יַת בּוֹצִינַיָא כָּל קֳבֵיל אַפֵּי מְנַרְתָּא יְהוֹן מְנַהֲרִין שִׁבְעָתֵי בּוֹצִינַיָא תְּלַת לִקֳבֵיל רוּחַ מַעַרְבָא וּתְלַת לִקֳבֵל רוּחַ מַדִינְחָא וּשְׁבִיעָא בִּמְצִיעָאָה", "pj_en": "Speak with Aharon, and say to him: At the time when thou dost kindle the lamps upon the candelabrum, (all) the seven lamps shall be alight; three on the western side, and three on the eastern side, and the seventh in the midst.", "tj": "", "tj_en": "", "rashi": "<b>בהעלתך.<\/b> לָמָּה נִסְמְכָה פָרָשַׁת הַמְּנוֹרָה לְפָרָשַׁת הַנְּשִׂיאִים? לְפִי שֶׁכְּשָׁרָאָה אַהֲרֹן חֲנֻכַּת הַנְּשִׂיאִים חָלְשָׁה אָז דַּעְתּוֹ, שֶׁלֹּא הָיָה עִמָּהֶם בַּחֲנֻכָּה לֹא הוּא וְלֹא שִׁבְטוֹ, אָמַר לוֹ הַקָּבָּ\"ה חַיֶּיךָ שֶׁלְּךָ גְדוֹלָה מִשֶּׁלָּהֶם, שֶׁאַתָּה מַדְלִיק וּמֵטִיב אֶת הַנֵּרוֹת (עי' תנחומא):<br><br><b>בהעלתך.<\/b> עַל שֵׁם שֶׁהַלַּהַב עוֹלֶה, כָּתוּב בְּהַדְלָקָתָן לְשׁוֹן עֲלִיָּה, שֶׁצָּרִיךְ לְהַדְלִיק עַד שֶׁתְּהֵא שַׁלְהֶבֶת עוֹלָה מֵאֵלֶיהָ (שבת כ\"א), וְעוֹד דָּרְשׁוּ רַבּוֹתֵינוּ מִכָּאן שֶׁמַּעֲלָה הָיְתָה לִפְנֵי הַמְּנוֹרָה, שֶׁעָלֶיהָ הַכֹּהֵן עוֹמֵד וּמֵטִיב (ספרי):<br><br><b>אל מול פני המנורה.<\/b> אֶל מוּל נֵר הָאֶמְצָעִי, שֶׁאֵינוֹ בַקָּנִים אֶלָּא בְּגוּף שֶׁל מְנוֹרָה (עי' מנחות צ\"ח):<br><br><b>יאירו שבעת הנרות.<\/b> שִׁשָּׁה שֶׁעַל שֵׁשֶׁת הַקָּנִים, שְׁלֹשָׁה הַמִּזְרָחִיִּים פּוֹנִים לְמוּל הָאֶמְצָעִי — הַפְּתִילוֹת שֶׁבָּהֶן — וְכֵן שְׁלֹשָׁה הַמַּעֲרָבִיִּים רָאשֵׁי הַפְּתִילוֹת לְמוּל הָאֶמְצָעִי, וְלָמָּה? כְּדֵי שֶׁלֹּא יֹאמְרוּ, לְאוֹרָהּ הוּא צָרִיךְ (עי' תנחומא):", "rashi_en": "בהעלתך WHEN THOU LIGHTEST [THE LAMPS] — Why is the section treating of the candelabrum put in juxtaposition with the section dealing with the offerings of the princes? Because when Aaron saw the dedication offerings of the princes, he felt distressed because neither he nor his tribe was with them in the dedication, whereupon the Holy One, blessed be He, said to him, “By your life! Your  part is of greater importance than theirs, for you will kindle and set in order the lamps” (cf. Midrash Tanchuma, Beha'alotcha 5; see also Nachmanides).<br><br>בהעלתך lit., WHEN THOU MAKEST [THE LIGHTS] RISE — Because the flame rises upwards (עולה), an expression denoting “ascending” is used of kindling them (the lights), implying that one must kindle them until the light ascends of itself (Shabbat 21a). — Furthermore our Rabbis derived from here (from the expression בהעלתך) that there was a step in front of the candelabrum upon which the priest stood while preparing the lights (Sifrei Bamidbar 59).<br><br>אל מול פני המנורה OVER AGAINST THE CANDLESTICK — i.e. over against the central lamp which is not on one of the branches, like the others, but on the body (the central shaft) of the candelabrum itself (cf. Menachot 98b).<br><br>יאירו שבעת הנרות SHALL THE SEVEN LAMPS GIVE LIGHT — the seven lamps: this central lamp itself which naturally gave light over against the shaft (the פני המנורה) and the six lamps which were on the six branches, viz., the three on the east side of the central shaft should have their wicks turned towards the central one, and similarly the three on the west should have the ends of their wicks turned towards the central one (cf. Sifrei Bamidbar 59). And why was this? In order that people should not say: He (God) is in need of its (the candlestick’s) light (cf. Midrash Tanchuma, Beha'alotcha 5)."}, {"ch": 8, "v": 3, "aliyah": 1, "heb": "וַיַּ֤עַשׂ כֵּן֙ אַהֲרֹ֔ן אֶל־מוּל֙ פְּנֵ֣י הַמְּנוֹרָ֔ה הֶעֱלָ֖ה נֵרֹתֶ֑יהָ כַּֽאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וַעֲבַד כֵּן אַהֲרֹן לָקֳבֵל אַפֵּי מְנַרְתָּא אַדְלֵק בּוֹצִינָהָא כְּמָא דִּי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "Aharon did so; towards the face of the Menorah he lit its lamps, just as Adonoy commanded Moshe.", "pj": "וַעֲבַד כֵּן אַהֲרן כָּל קֳבֵיל אַפֵּי מְנַרְתָּא אַדְלֵיק בּוֹצִינָהָא הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And Aharon did so; at the face of the candelabrum he lit the lamps thereof, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויעש כן אהרן.<\/b> לְהַגִּיד שִׁבְחוֹ שֶׁל אַהֲרֹן שֶׁלֹּא שִׁנָּה (ספרי):", "rashi_en": "ויעש כן אהרן AND AARON DID SO — This is stated in order to tell the praise of Aaron — that he did not deviate [from G-d's command] (cf. Sifrei Bamidbar 60)."}, {"ch": 8, "v": 4, "aliyah": 1, "heb": "וְזֶ֨ה מַעֲשֵׂ֤ה הַמְּנֹרָה֙ מִקְשָׁ֣ה זָהָ֔ב עַד־יְרֵכָ֥הּ עַד־פִּרְחָ֖הּ מִקְשָׁ֣ה הִ֑וא כַּמַּרְאֶ֗ה אֲשֶׁ֨ר הֶרְאָ֤ה יְהֹוָה֙ אֶת־מֹשֶׁ֔ה כֵּ֥ן עָשָׂ֖ה אֶת־הַמְּנֹרָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְדֵין עוֹבַד מְנַרְתָּא נְגִידָא דְהַב עַד שִׁידַהּ עַד שׁוֹשַׁנַּהּ נְגִידָא הִיא כְּחֶזְוָא דִּי אַחֲזֵי יְיָ יָת משֶׁה כֵּן עֲבַד יָת מְנַרְתָּא:", "onk_en": "This is how the Menorah was made; beaten from [a block of] gold, from its base until its flowers it is beaten out [of a solid block], according to the vision which Adonoy showed to Moshe, so he made the Menorah.", "pj": "וְדֵין עוֹבַד מְנַרְתָּא מִינָא קַשְׁיָא דִדְהַב עַד בָּסִיס דִידָהּ וְעַד שׁוֹשַׁנְיָיהָא עוֹבַד אוּמַן בְּקוּרְנְסָא הִיא מִתְעַבְדָא הֵי כְחֵיזוּ דְאַחֲזֵי יְיָ יַת משֶׁה הֵיכְדֵין עָבַד בְּצַלְאֵל יַת מְנַרְתָּא", "pj_en": "And this was the work of the candelabrum, which was of beaten gold, from its foundations unto its lilies, the work of the artificer, with the hammer was it wrought: according to the vision which the Lord had showed Mosheh, so did Bezalel make the candelabrum.", "tj": "", "tj_en": "", "rashi": "<b>וזה מעשה המנרה.<\/b> שֶׁהֶרְאָהוּ הַקָּבָּ\"ה בְּאֶצְבַּע, לְפִי שֶׁנִּתְקַשָּׁה בָהּ, לְכָךְ נֶאֱמַר \"וְזֶה\":<br><br><b>מקשה.<\/b> בטדי\"ץ בְּלַעַז, לְשׁוֹן \"דָּא לְדָא נָקְשָׁן\" (דניאל ה'), עֶשֶׁת שֶׁל כִּכַּר זָהָב הָיְתָה, וּמַקִּישׁ בְּקֻרְנָס, וְחוֹתֵךְ בְּכַשִּׁיל, לְפַשֵּׁט אֵבָרֶיהָ כְּתִקְנָן, וְלֹא נַעֲשֵׂית אֵבָרִים אֵבָרִים עַ\"יְ חִבּוּר (עי' ספרא):<br><br><b>עד ירכה.<\/b> יְרֵכָהּ הִיא הַשִּׁדָּה שֶׁעַל הָרַגְלַיִם, חָלוּל, כְּדֶרֶךְ מְנוֹרוֹת כֶּסֶף שֶׁלִּפְנֵי הַשָּׂרִים:<br><br><b>עד ירכה עד פרחה.<\/b> כְּלוֹמַר גּוּפָהּ שֶׁל מְנוֹרָה כֻּלָּהּ וְכָל הַתָּלוּי בָּהּ:<br><br><b>עד ירכה.<\/b> שֶׁהוּא אֵבָר גָּדוֹל:<br><br><b>עד פרחה.<\/b> שֶׁהוּא מַעֲשֶׂה דַק שֶׁבָּהּ, הַכֹּל מִקְשָׁה; וְדֶרֶךְ \"עַד\" לְשַׁמֵּשׁ בְּלָשׁוֹן זֶה, כְּמוֹ \"מִגָּדִישׁ וְעַד קָמָה וְעַד כֶּרֶם זָיִת\" (שופטים ט\"ו):<br><br><b>כמראה אשר הראה וגו'.<\/b> כַּתַּבְנִית אֲשֶׁר הֶרְאָהוּ בָהָר, כְּמוֹ שֶׁנֶּאֱמַר (שמות כ\"ה) — וּרְאֵה וַעֲשֵׂה בְתַבְנִיתָם וְגוֹ' (ספרי):<br><br><b>כן עשה את המנרה.<\/b> מִי שֶׁעֲשָׂאָהּ; וּמִ\"אַ, עַל יְדֵי הַקָּבָּ\"ה נַעֲשֵׂית מֵאֵלֶיהָ (תנחומא):", "rashi_en": "וזה מעשה המנרה AND THIS IS THE WORK OF THE CANDLESTICK — “This” — we may gather that the Holy One, blessed be He, showed it to him (Moses) with His finger, because he was puzzled by it (how to construct it); and that is why it states, “this is [the construction of the candlestick]” (Sifrei Bamidbar 61; Menachot 29a).<br><br>מקשה means batediz in O. F., — [English = beaten], an expression of the same meaning as in (Daniel 5:6) “[and his feet] knocked (נקשן) one against another”. There was a block weighing a talent of gold and he (who made the candlestick) beat it with the hammer, and cut away with a chisel in order that its branches might be made to spread out as they should do, and it was not formed of separate pieces made into a whole by joining them together.<br><br>עד ירכה עד פרחה UNTO THE SHAFT THEREOF, UNTO THE FLOWERS THEREOF — Its ירך was the boxlike base which was above the feet (thus, the feet stood beneath this; cf. Rashi on Exodus 25:31), hollow, like the candlesticks of princely houses (lit., as the candlesticks standing before the princes).<br><br>עד ירכה עד פרחה — This phrase means as much as: the whole body of the candlestick and everything attached to it.<br><br>עד ירכה — FROM THE BASE which is a massive part.<br><br>עד פרחה — UP TO ITS FLOWER, which was the most slender piece of work in it — all was beaten out of the lump. The double form of עד … עד) עד) is used in this sense (to include everything), as e.g., (Judges 15:5) “[and he (Samson) burnt up everything] from the shocks to (עד) the standing corn and to (ועד) the vineyard and the olives\".<br><br>כמראה אשר הראה וגו׳ ACCORDING UNTO THE PATTERN WHICH [THE LORD] HAD SHOWED [MOSES] — i. e. according to the shape which he had shewn him on the mountain, as it is said, (Exodus 25:40) and see, that thou make them after their pattern [which was shewn thee in the mountain]\".<br><br>כן עשה את המנורה SO HE MADE THE CANDELABRUM — “he” means, the one who made it (not Moses, as might be assumed from the wording of the text; the subject is suppressed and it means no more than: so was the candlestick made). A Midrashic explanation is: By the instrumentality of the Holy One, blessed be He, it was made of itself (according to this the subject is “God” who is mentioned immediately before) (Midrash Tanchuma, Beha'alotcha 3; cf. Rashi on Exodus 25:31)."}, {"ch": 8, "v": 5, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 6, "aliyah": 1, "heb": "קַ֚ח אֶת־הַלְוִיִּ֔ם מִתּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְטִהַרְתָּ֖ אֹתָֽם׃", "onk": "<b>קָרֵב<\/b> יָת לֵוָאֵי מִגּוֹ בְּנֵי יִשְׂרָאֵל וּתְדַּכֵּי יָתְהוֹן:", "onk_en": "Take [<b>bring near<\/b>] the Levites from among Bnei Yisroel and purify them.", "pj": "קָרֵיב יַת לֵיוָאֵי מִגוֹ בְּנֵי יִשְרָאֵל וּתְדַכֵּי יַתְהוֹן", "pj_en": "Bring the Levites out from among the sons of Israel, and purify them.", "tj": "", "tj_en": "", "rashi": "<b>קח את הלוים.<\/b> קָחֵם בִּדְבָרִים — אַשְׁרֵיכֶם שֶׁתִּזְכּוּ לִהְיוֹת שַׁמָּשִׁים לַמָּקוֹם:", "rashi_en": "קח את הלוים means, win them over with fine words: “Happy are ye that ye are privileged to be servants of the Omnipresent!” (cf. Rashi on Leviticus 8:2.)"}, {"ch": 8, "v": 7, "aliyah": 1, "heb": "וְכֹֽה־תַעֲשֶׂ֤ה לָהֶם֙ לְטַֽהֲרָ֔ם הַזֵּ֥ה עֲלֵיהֶ֖ם מֵ֣י חַטָּ֑את וְהֶעֱבִ֤ירוּ תַ֙עַר֙ עַל־כׇּל־בְּשָׂרָ֔ם וְכִבְּס֥וּ בִגְדֵיהֶ֖ם וְהִטֶּהָֽרוּ׃", "onk": "וּכְדֵין תַּעְבֵּד לְהוֹן לְדַכּוֹאֵיהוֹן אַדֵּי עֲלֵיהוֹן מַיָּא דְחַטָּאתָא וְיַעְבְּרוּן מַסְפַּר עַל כָּל בִּשְׂרְהוֹן וִיחַוְּרוּן לְבוּשֵׁיהוֹן וְיִדְּכּוּן:", "onk_en": "This is what you shall do to them, to purify them; sprinkle them with the sin-offering waters, and cause a razor to pass over (shave) their entire bodies, and they shall wash their garments and purify themselves.", "pj": "וּכְדֵין תַּעֲבֵיד לְהוֹן לְדַכּוֹאֵיהוֹן אֲדֵי עֲלֵיהוֹן מַיָא דְחַטָאתָא וְיַעַבְרוּן גְלַב עַל כָּל בִּשְרֵיהוֹן וִיחַוְורוּן לְבוּשֵׁיהוֹן וְיִדְכּוּן בְּאַרְבְּעִין סָוִוין דְמַיָא", "pj_en": "And this shalt thou do to purify them. Sprinkle upon them the water for uncleanness through sin (chattatha), and let the razor pass over all their flesh, and let them wash their raiment, and wash themselves in forty savan of water.", "tj": "", "tj_en": "", "rashi": "<b>הזה עליהם מי חטאת.<\/b> שֶׁל אֵפֶר הַפָּרָה מִפְּנֵי טְמֵאֵי מֵתִים שֶׁבָּהֶם:<br><br><b>והעבירו תער.<\/b> מָצָאתִי בְדִבְרֵי רַבִּי מֹשֶׁה הַדַּרְשָׁן לְפִי שֶׁנִּתְּנוּ כַפָּרָה עַל הַבְּכוֹרוֹת שֶׁעָבְדוּ עֲ\"זָ, וְהִיא קְרוּיָה זִבְחֵי מֵתִים, וְהַמְּצֹרָע קָרוּי מֵת, הִזְקִיקָם תִּגְלַחַת כִּמְצוֹרָעִים:", "rashi_en": "הזה עליהם מי חטאת SPRINKLE UPON THEM WATER OF PURIFYING — water in which the ashes of the Red Heifer are mingled; on account of those among them who might have become unclean through contact with dead persons.<br><br>והעבירו תער AND LET THEM SHAVE [ALL THEIR FLESH] — I have found in the work of R. Moses the Preacher the following: Because they were made propitiatory substitutes for the firstborn who had worshipped the idol (the Golden Calf), and it (idolatry) is called (Psalms 106:28) “offerings to the dead”, and the leper is also called dead (cf. Numbers 12:12), it (Scripture) requires them to shave their body like lepers."}, {"ch": 8, "v": 8, "aliyah": 1, "heb": "וְלָֽקְחוּ֙ פַּ֣ר בֶּן־בָּקָ֔ר וּמִ֨נְחָת֔וֹ סֹ֖לֶת בְּלוּלָ֣ה בַשָּׁ֑מֶן וּפַר־שֵׁנִ֥י בֶן־בָּקָ֖ר תִּקַּ֥ח לְחַטָּֽאת׃", "onk": "וִיסְבוּן תּוֹר בַּר תּוֹרֵי וּמִנְחָתֵיהּ סֻלְתָּא דְּפִילָא בִמְשָׁח וְתוֹר תִּנְיַן בַּר תּוֹרֵי תִּסַּב לְחַטָּאתָא:", "onk_en": "They should take a young bullock and its meal-offering of flour mixed with oil, and you shall take a second young bullock, for a sin-offering.", "pj": "וְיִסְבּוּן תּוֹר בַּר תּוֹרֵי וּמִנְחָתֵיהּ סוּלְתָּא פְּתִיכָא בִּמְשַׁח זֵיתָא וְתוֹר תִּנְיַין בַּר תּוֹרֵי תִּיסַב לְחַטָאתָא", "pj_en": "And they shall take a young bullock, and his mincha of flour sprinkled with olive oil; and take thou a second young bullock for a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>ולקחו פר בן בקר.<\/b> וְהוּא עוֹלָה, כְּמוֹ שֶׁכָּתוּב \"וַעֲשֵֹה … וְאֶת הָאֶחָד עֹלָה\", וְהוּא קָרְבַּן צִבּוּר בַּעֲ\"זָ:<br><br><b>ופר שני.<\/b> מַה תַּ\"ל שֵׁנִי? לוֹמַר לְךָ מָה עוֹלָה לֹא נֶאֱכֶלֶת, אַף חַטָּאת לֹא נֶאֱכֶלֶת. וּבְזוֹ יֵשׁ סֶמֶךְ לִדְבָרָיו בְּת\"כֹּ; וְאוֹמֵר אֲנִי שֶׁהוֹרָאַת שָׁעָה הָיְתָה, שֶׁשָּׂעִיר הָיָה לָהֶם לְהָבִיא לְחַטַּאת עֲ\"זָ עִם פַּר הָעוֹלָה:", "rashi_en": "ולקחו פר בן בקר AND LET THEM TAKE A YOUNG BULLOCK, — and this was to be a burnt offering, as it is said, (v. 12) “and thou shalt offer the one [as a sin offering] and the other as a burnt offering”, and it (a bullock) was the communal offering prescribed (Numbers 15:24) in case of idol worship committed by the community (here the firstborn are regarded as a community).<br><br>ופר שני AND ANOTHER BULLOCK [THOU SHALT TAKE TO BE A SIN OFFERING] — What is the force of the word שני, the second? (There is no corresponding word אחד at the beginning of the sentence!). But it is used to suggest a comparison between the two sacrifices: How is it in the case of the burnt offering? It is not permitted to be eaten (for it is entirely burnt on the altar)! So, too, is this sin-offering not permitted to be eaten (in spite of being a חטאת חיצונה which as a rule may be eaten; cf. Rashi on Leviticus 9:11). And in this fact (that the חטאת prescribed was not eaten) there is some support in the statement of Torath Cohanim just quoted for his (R. Moses the Preacher’s) view (that the עולה which is paired with it was that enjoined for idolatry committed by the community) (cf. Sifra, Vayikra Dibbura d'Chovah, Chapter 3 4). — I, however, say that it (the fact that this חטאת was not to be eaten) was an occasional (exceptional) decision (הוראת שעה) (contrary to the rule of a חטאת חיצונה, and not because it was intended as a חטאת לע\"ז as asserted by R. Moses), for if his view were correct they would have had to offer a goat (as prescribed in Numbers 15:24 not a bullock) as a sin offering to expiate for idolatry together with a bullock for a burnt offering mentioned here."}, {"ch": 8, "v": 9, "aliyah": 1, "heb": "וְהִקְרַבְתָּ֙ אֶת־הַלְוִיִּ֔ם לִפְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְהִ֨קְהַלְתָּ֔ אֶֽת־כׇּל־עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּתְקָרֵב יָת לֵוָאֵי קֳדָם מַשְׁכַּן זִמְנָא וְתִכְנֵשׁ יָת כָּל כְּנִשְׁתָּא דִּבְנֵי יִשְׂרָאֵל:", "onk_en": "You shall bring the Levites near, before the Tent of Meeting, and you shall gather the entire congregation of Bnei Yisroel.", "pj": "וְתַקְרֵיב יַת לֵיוָאֵי קֳדָם מַשְׁכַּן זִמְנָא וְתִכְנוֹשׁ יַת כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל", "pj_en": "And thou shalt bring the Levites before the tabernacle of ordinance, and gather together also all the congregation of the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>והקהלת את כל עדת.<\/b> לְפִי שֶׁהַלְוִיִּם נִתָּנִים קָרְבַּן כַּפָּרָה תַּחְתֵּיהֶם, יָבֹאוּ וְיַעַמְדוּ עַל קָרְבָּנָם וְיִסְמְכוּ אֶת יְדֵיהֶם עֲלֵיהֶם:", "rashi_en": "והקהלת את כל עדת AND THOU SHALT GATHER THE WHOLE ASSEMBLY [OF THE CHILDREN OF ISRAEL] TOGETHER — Because the Levites were made, so to speak, an expiatory offering in their stead, let them come and stand at their offering and put their hands upon them (the Levites) as is prescribed in the case of an offering (cf. Leviticus 1:4)."}, {"ch": 8, "v": 10, "aliyah": 1, "heb": "וְהִקְרַבְתָּ֥ אֶת־הַלְוִיִּ֖ם לִפְנֵ֣י יְהֹוָ֑ה וְסָמְכ֧וּ בְנֵי־יִשְׂרָאֵ֛ל אֶת־יְדֵיהֶ֖ם עַל־הַלְוִיִּֽם׃", "onk": "וּתְקָרֵב יָת לֵוָאֵי קֳדָם יְיָ וְיִסְמְכוּן בְּנֵי יִשְׂרָאֵל יָת יְדֵיהוֹן עַל לֵוָאֵי:", "onk_en": "You shall bring the Levites near, before Adonoy, and Bnei Yisroel shall lay their hands on the Levites.", "pj": "וְתַקְרֵיב יַת לֵיוָאֵי קֳדָם יְיָ וְיִסְמְכוּן בְּנֵי יִשְרָאֵל יַת יְדֵיהוֹן עַל לֵיוָאֵי", "pj_en": "Thou shalt bring the Levites before the Lord, and the sons of Israel shall lay their hands upon the Levites.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 11, "aliyah": 1, "heb": "וְהֵנִיף֩ אַהֲרֹ֨ן אֶת־הַלְוִיִּ֤ם תְּנוּפָה֙ לִפְנֵ֣י יְהֹוָ֔ה מֵאֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְהָי֕וּ לַעֲבֹ֖ד אֶת־עֲבֹדַ֥ת יְהֹוָֽה׃", "onk": "וִירִים אַהֲרֹן יָת לֵוָאֵי אֲרָמָא קֳדָם יְיָ מִן בְּנֵי יִשְׂרָאֵל וִיהוֹן לְמִפְלַח יָת פָּלְחָנָא דַיְיָ:", "onk_en": "Aharon shall wave the Levites as a wave-offering before Adonoy from Bnei Yisroel and they will be [entrusted] to do the worship of Adonoy.", "pj": "וְיָרִים אַהֲרן יַת לֵיוָאֵי אֲרָמָא קֳדָם יְיָ מִן בְּנֵי יִשְרָאֵל וִיהוֹן לְמִפְלַח יַת פּוּלְחָנָא דַיְיָ", "pj_en": "And Aharon shall present the Levites, (as) an elevation before the Lord from the sons of Israel, and they shall be for the work of the service of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>והניף אהרן את הלוים תנופה.<\/b> כְּדֶרֶךְ שֶׁאֲשַׁם מְצֹרָע טָעוּן תְּנוּפָה חַי; שָׁלֹשׁ תְּנוּפוֹת נֶאֶמְרוּ בְּפָרָשָׁה זוֹ: הָרִאשׁוֹנָה — לִבְנֵי קְהָת, לְכָךְ נֶאֱמַר בָּם \"וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת ה'\", לְפִי שֶׁעֲבוֹדַת קֹדֶשׁ הַקֳּדָשִׁים עֲלֵיהֶם — הָאָרוֹן וְהַשֻּׁלְחָן וְגוֹ'; הַשְּׁנִיָּה — לִבְנֵי גֵרְשׁוֹן, לְכָךְ נֶאֱמַר בָּם \"תְּנוּפָה לַה'\", שֶׁאַף עֲלֵיהֶם הָיְתָה עֲבוֹדַת הַקֹּדֶשׁ — יְרִיעוֹת וּקְרָסִים הַנִּרְאוֹת בְּבֵית קֹדֶשׁ הַקֳּדָשִׁים, וְהַשְּׁלִישִׁית — לִבְנֵי מְרָרִי:", "rashi_en": "והניף אהרן את הלוים תנופה AND AARON SHALL MAKE A WAVING WITH THE LEVITES — just as the guilt offering of the leper (to whom the Levites are compared in some respect; cf. Rashi on v. 7) required waving whilst alive. — Three times is the command of waving the Levites mentioned in this section (vv. 11, 13, 15): the first refers to the sons of Kohath; therefore (because it is they who are referred to) Scripture adds with regard to them, “that they may execute the service of the Lord” — for it was upon them (the sons of Kohath) that the service of the most holy objects: the Ark, the table, etc., devolved. The second refers to the sons of Gershon, and therefore Scripture adds with regard to them, “a waving for the Lord”, for upon them devolved the service of the holy (though not the most holy) objects: the hangings and the catches which were visible in the Holy of Holies. The third refers to the sons of Merari."}, {"ch": 8, "v": 12, "aliyah": 1, "heb": "וְהַלְוִיִּם֙ יִסְמְכ֣וּ אֶת־יְדֵיהֶ֔ם עַ֖ל רֹ֣אשׁ הַפָּרִ֑ים וַ֠עֲשֵׂ֠ה אֶת־הָאֶחָ֨ד חַטָּ֜את וְאֶת־הָאֶחָ֤ד עֹלָה֙ לַֽיהֹוָ֔ה לְכַפֵּ֖ר עַל־הַלְוִיִּֽם׃", "onk": "וְלֵוָאֵי יִסְמְכוּן יָת יְדֵיהוֹן עַל רֵישׁ תּוֹרַיָּא וְיַעֲבֵּד יָת חַד חַטָּאתָא וְיָת חַד עֲלָתָא קֳדָם יְיָ לְכַפָּרָא עַל לֵוָאֵי:", "onk_en": "The Levites shall lay their hands on the head of the bulls and make the one for a sin-offering and the [other] one for a burnt-offering to Adonoy, to atone for the Levites.", "pj": "וְלֵיוָאֵי יִסְמְכוּן יַת יְדֵיהוֹן עַל רֵישׁ תּוֹרֵי וְעִיבַד יַת חַד חַטָאתָא וְיַת חַד עֲלָתָא קֳדָם יְיָ לְכַפָּרָא עַל לֵיוָאֵי", "pj_en": "And the Levites shall lay their hands upon the head of the bullocks, and make one a sin offering and one a burnt offering before the Lord, to atone for the Levites.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 13, "aliyah": 1, "heb": "וְהַֽעֲמַדְתָּ֙ אֶת־הַלְוִיִּ֔ם לִפְנֵ֥י אַהֲרֹ֖ן וְלִפְנֵ֣י בָנָ֑יו וְהֵנַפְתָּ֥ אֹתָ֛ם תְּנוּפָ֖ה לַֽיהֹוָֽה׃", "onk": "וּתְקֵם יָת לֵוָאֵי קֳדָם אַהֲרֹן וְקָדָם בְּנוֹהִי וּתְרֵם יָתְהוֹן אֲרָמָא קֳדָם יְיָ:", "onk_en": "You shall set the Levites before Aharon and before his sons, and lift them up as a wave-offering to Adonoy.", "pj": "וּתְקֵים יַת לֵיוָאֵי קֳדָם אַהֲרן וְקָדָם בְּנוֹי וּתְרֵים יַתְהוֹן אֲרָמָא קֳדָם יְיָ", "pj_en": "And thou shalt place the Levites before Aharon and his sons, and present them (as) an elevation before the Lord;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 14, "aliyah": 1, "heb": "וְהִבְדַּלְתָּ֙ אֶת־הַלְוִיִּ֔ם מִתּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְהָ֥יוּ לִ֖י הַלְוִיִּֽם׃", "onk": "וְתַפְרֵשׁ יָת לֵוָאֵי מִגּוֹ בְּנֵי יִשְׂרָאֵל וִיהוֹן <b>מְשַׁמְּשִׁין קֳדָמַי<\/b> לֵוָאֵי:", "onk_en": "You shall separate the Levites from among Bnei Yisroel and the Levites shall be Mine [<b>serve before Me<\/b>].", "pj": "וְתַפְרֵישׁ יַת לֵיוָאֵי מִגוֹ בְּנֵי יִשְרָאֵל וִיהוֹן מְשַׁמְשִׁין קֳדָמַי לֵיוָאֵי", "pj_en": "and thus shalt thou separate the Levites from among the sons of Israel, that the Levites may be ministers before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 15, "aliyah": 2, "heb": "וְאַֽחֲרֵי־כֵן֙ יָבֹ֣אוּ הַלְוִיִּ֔ם לַעֲבֹ֖ד אֶת־אֹ֣הֶל מוֹעֵ֑ד וְטִֽהַרְתָּ֣ אֹתָ֔ם וְהֵנַפְתָּ֥ אֹתָ֖ם תְּנוּפָֽה׃", "onk": "וּבָתַר כֵּן יַעֲלוּן לֵוָאֵי לְמִפְלַח יָת מַשְׁכַּן זִמְנָא וּתְדַכֵּי יָתְהוֹן וּתְרֵם יָתְהוֹן אֲרָמָא:", "onk_en": "After this is done, the Levites shall come to work in the Tent of Meeting, and you shall purify them, and you shall lift them up as a wave-offering,", "pj": "וּמִן בָּתַר כְּדֵין יֵיעָלוּן לֵיוָאֵי לְמִפְלַח פּוּלְחַן מַשְׁכַּן זִמְנָא וּתְדַכֵּי יַתְהוֹן וּתְרֵים יַתְהוֹן אֲרָמָא", "pj_en": "And afterward the Levites may enter to fulfil the service of the tabernacle of ordinance, when thou shalt have purified them and presented them (as) an elevation;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 16, "aliyah": 2, "heb": "כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֙מָּה֙ לִ֔י מִתּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּ֩חַת֩ פִּטְרַ֨ת כׇּל־רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִבְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖ם לִֽי׃", "onk": "אֲרֵי <b>אַפְרָשָׁא מַפְרְשִׁין<\/b> אִנּוּן לִי מִגּוֹ בְּנֵי יִשְׂרָאֵל חֲלַף פְּתַח כָּל וַלְדָּא בּוּכְרָא כֹלָּא מִבְּנֵי יִשְׂרָאֵל קָרֵבִית יָתְהוֹן קֳדָמָי:", "onk_en": "For they are given [<b>have been separated<\/b>]; they are given [<b>have been separated<\/b>] to Me from among Bnei Yisroel in place of those who open the womb,—every firstborn of Bnei Yisroel—I have taken them to be Mine.", "pj": "אֲרוּם מַפְרְשָׁא מְפַרְשִׁין הִינוּן קֳדָמַי מִגוֹ בְּנֵי יִשְרָאֵל חוֹלַף פְּתַח כָּל וַלְדָא בּוּכְרַיָא כֻּלְהוֹן דְמִבְּנֵי יִשְרָאֵל קָרֵיבִית יַתְהוֹן קֳדָמַי", "pj_en": "for separated they are separate before Me from among the sons of Israel, instead of every one who openeth the womb; the first-born of all who are of the sons of Israel have I taken (to be) before Me.", "tj": "", "tj_en": "", "rashi": "<b>נתנים נתנים.<\/b> נְתוּנִים לְמַשָּׂא, נְתוּנִים לָשִׁיר:<br><br><b>פטרת.<\/b> פְּתִיחַת:", "rashi_en": "נתנים נתנים FOR THEY ARE GIVEN, GIVEN ARE THEY [UNTO ME] — i.e., given twice: dedicated for bearing the holy objects and dedicated to sing in chorus in the Sanctuary.<br><br>פטרת means OPENING OF (such that open the womb, i. e. firstborn)."}, {"ch": 8, "v": 17, "aliyah": 2, "heb": "כִּ֣י לִ֤י כׇל־בְּכוֹר֙ בִּבְנֵ֣י יִשְׂרָאֵ֔ל בָּאָדָ֖ם וּבַבְּהֵמָ֑ה בְּי֗וֹם הַכֹּתִ֤י כׇל־בְּכוֹר֙ בְּאֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖ם לִֽי׃", "onk": "אֲרֵי דִילִי כָל בּוּכְרָא בִּבְנֵי יִשְׂרָאֵל בַּאֲנָשָׁא וּבִבְעִירָא בְּיוֹמָא דִּקְטָלִית כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם אַקְדֵּשִׁית יָתְהוֹן קֳדָמָי:", "onk_en": "For every firstborn of Bnei Yisroel is Mine, human and animal; on the day in which I slew every firstborn in the land of Egypt, I have sanctified them to be Mine.", "pj": "אֲרוּם דִילִי כָּל בּוּכְרָא בִּבְנֵי יִשְרָאֵל בְּאֵינָשָׁא וּבִבְעִירָא בְּיוֹמָא דִקְטָלִית כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם אַקְדֵשִׁית יַתְהוֹן קֳדָמָי", "pj_en": "For every first-born of the sons of Israel is Mine, whether of man or of beast: in the day that I slew all the first-born in the land of Mizraim, I sanctified them before Me;", "tj": "", "tj_en": "", "rashi": "<b>כי לי כל בכור.<\/b> שֶׁלִּי הָיוּ הַבְּכוֹרוֹת בְּקַו הַדִּין, שֶׁהֲגִנֹּתִי עֲלֵיהֶם בֵּין בְּכוֹרֵי מִצְרַיִם וְלָקַחְתִּי אוֹתָם לִי — עַד שֶׁטָּעוּ בָעֵגֶל, וְעַכְשָׁו \"וָאֶקַּח אֶת הַלְוִיִּם\":", "rashi_en": "כי לי כל בכור FOR ALL THE FIRSTBORN [OF THE CHILDREN OF ISRAEL] ARE MINE — This means: they became Mine by strict right (lit., by the line of justice), because I protected them distinguishing between them and the firstborn of Egypt, and I took them as Mine — until they sinned by worshipping the Golden Calf, but now ואקח את הלוים I HAVE TAKEN THE LEVITES in their stead."}, {"ch": 8, "v": 18, "aliyah": 2, "heb": "וָאֶקַּ֖ח אֶת־הַלְוִיִּ֑ם תַּ֥חַת כׇּל־בְּכ֖וֹר בִּבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְקָרֵבִית יָת לֵוָאֵי חֲלַף כָּל בּוּכְרָא בִּבְנֵי יִשְׂרָאֵל:", "onk_en": "I have taken the Levites instead of all firstborn of Bnei Yisroel,", "pj": "וּקְרִיבַת יַת לֵיוָאֵי חוֹלַף כָּל בּוּכְרָא בִּבְנֵי יִשְרָאֵל", "pj_en": "and I have taken the Levites instead of all the first-born of the sons of Israel,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 19, "aliyah": 2, "heb": "וָאֶתְּנָ֨ה אֶת־הַלְוִיִּ֜ם נְתֻנִ֣ים&thinsp;<b>׀<\/b> לְאַהֲרֹ֣ן וּלְבָנָ֗יו מִתּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַעֲבֹ֞ד אֶת־עֲבֹדַ֤ת בְּנֵֽי־יִשְׂרָאֵל֙ בְּאֹ֣הֶל מוֹעֵ֔ד וּלְכַפֵּ֖ר עַל־בְּנֵ֣י יִשְׂרָאֵ֑ל וְלֹ֨א יִהְיֶ֜ה בִּבְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּגֶ֥שֶׁת בְּנֵֽי־יִשְׂרָאֵ֖ל אֶל־הַקֹּֽדֶשׁ׃", "onk": "וִיהָבִית יָת לֵוָאֵי מְסִירִין לְאַהֲרֹן וְלִבְנוֹהִי מִגּוֹ בְּנֵי יִשְׂרָאֵל לְמִפְלַח יָת פָּלְחַן בְּנֵי יִשְׂרָאֵל בְּמַשְׁכַּן זִמְנָא וּלְכַפָּרָא עַל בְּנֵי יִשְׂרָאֵל וְלָא יְהֵי בִּבְנֵי יִשְׂרָאֵל מוֹתָא בְּמִקְרַב בְּנֵי יִשְׂרָאֵל לְקוּדְשָׁא:", "onk_en": "and I have given the Levites to be given as a gift to Aharon and to his sons from among Bnei Yisroel to do the duties of Bnei Yisroel in the Tent of Meeting, and to atone for Bnei Yisroel, so that there will not be a plague among Bnei Yisroel when Bnei Yisroel approach the sanctuary.", "pj": "וִיהָבִית יַת לֵיוָאֵי יְהִיבִין לְאַהֲרן וְלִבְנוֹי מִגוֹ בְּנֵי יִשְרָאֵל לְמִפְלַח יַת פּוּלְחַן בְּנֵי יִשְרָאֵל בְּמַשְׁכַּן זִמְנָא וּלְכַפָּרָא עַל בְּנֵי יִשְרָאֵל וְלָא יְהֵי בִּבְנֵי יִשְרָאֵל מוֹתָא בִּזְמַן מִקְרַב בְּנֵי יִשְרָאֵל לְקוּדְשָׁא", "pj_en": "and have given the Levites (as) gifts unto Aharon and to his sons from among the sons of Israel, to minister the service of the children of Israel in the tabernacle of ordinance, and to atone for the children of Israel, lest there be mortality among the children of Israel at the time when they approach the sanctuary.", "tj": "", "tj_en": "", "rashi": "<b>ואתנה וגו'.<\/b> חֲמִשָּׁה פְעָמִים נֶאֶמְרוּ בְנֵי יִשְׂרָאֵל בְּמִקְרָא זֶה, לְהוֹדִיעַ חִבָּתָן, שֶׁנִּכְפַּל אַזְכְּרוֹתֵיהֶן בְּמִקְרָא אֶחָד כְּמִנְיַן חֲמִשָּׁה חֻמְשֵׁי תוֹרָה, וְכָךְ רָאִיתִי בִּבְ\"רַ:<br><br><b>ולא יהיה בבני ישראל נגף.<\/b> שֶׁלֹא יִצְטָרְכוּ לָגֶשֶׁת אֶל הַקֹּדֶשׁ, שֶׁאִם יִגְּשׁוּ יִהְיֶה נֶגֶף:", "rashi_en": "ואתנה וגו׳ AND I HAVE GIVEN [THE LEVITES etc.] — Five times are the “children of Israel” mentioned in this verse (where the last four times they might have been alluded to by a personal pronoun), in order to show what affection they are held by the Lord in that the mention of them is repeated five times in one verse corresponding in number to the “Five Books of the Torah”. Thus I have seen stated in Genesis Rabbah (Leviticus Rabbah 2:4; cf. Genesis Rabbah 3:5).<br><br>ולא יהיה בבני ישראל נגף [AND I HAVE GIVEN THE LEVITES … TO DO THE SERVICE OF THE CHILDREN OF ISRAEL] THAT THERE BE NO PLAGUE AMONG THE CHILDREN OF ISRAEL [WHEN THE CHILDREN OF ISRAEL COME NIGH UNTO THE SANCTUARY] — The meaning is: I have given them etc. so that it should be unnecessary for them to come near to the Sanctuary, because [having sinned by worshipping the Calf], if they came near there would be a plague among them."}, {"ch": 8, "v": 20, "aliyah": 2, "heb": "וַיַּ֨עַשׂ מֹשֶׁ֧ה וְאַהֲרֹ֛ן וְכׇל־עֲדַ֥ת בְּנֵי־יִשְׂרָאֵ֖ל לַלְוִיִּ֑ם כְּ֠כֹ֠ל אֲשֶׁר־צִוָּ֨ה יְהֹוָ֤ה אֶת־מֹשֶׁה֙ לַלְוִיִּ֔ם כֵּן־עָשׂ֥וּ לָהֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וַעֲבַד משֶׁה וְאַהֲרֹן וְכָל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל לְלֵוָאֵי כְּכֹל דִּי פַקִּיד יְיָ יָת משֶׁה לְלֵוָאֵי כֵּן עֲבָדוּ לְהוֹן בְּנֵי יִשְׂרָאֵל:", "onk_en": "Moshe, Aharon, and the entire congregation of Bnei Yisroel did to the Levites just as Adonoy commanded Moshe regarding the Levites, so did Bnei Yisroel do to them.", "pj": "וַעֲבַד משֶׁה וְאַהֲרן וְכָל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל לְלֵיוָאֵי הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה עַל לֵיוָאֵי הֵיכְדֵין עָבָדוּ לְהוֹן בְּנֵי יִשְרָאֵל", "pj_en": "And Mosheh and Aharon and all the congregation of the Beni Israel did unto the Levites according to all that the Lord had commanded Mosheh concerning the Levites, so did the sons of Israel to them.", "tj": "", "tj_en": "", "rashi": "<b>ויעש משה ואהרן וכל עדת וגו'.<\/b> מֹשֶׁה הֶעֱמִידָן וְאַהֲרֹן הֱנִיפָן, וְיִשְׂרָאֵל סָמְכוּ אֶת יְדֵיהֶם:", "rashi_en": "ויעש משה ואהרן וכל עדת וגו׳ AND MOSES AND AARON AND ALL THE CONGREGATION … DID [TO THE LEVITES ACCORDING UNTO ALL THAT THE LORD COMMANDED MOSES] — i.e. Moses presented them (v. 13), Aaron made the waving with them (v. 11) and the Israelites put their hands (v. 10) upon the Levites’ heads (cf., however, Ibn Ezra)."}, {"ch": 8, "v": 21, "aliyah": 2, "heb": "וַיִּֽתְחַטְּא֣וּ הַלְוִיִּ֗ם וַֽיְכַבְּסוּ֙ בִּגְדֵיהֶ֔ם וַיָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛ם תְּנוּפָ֖ה לִפְנֵ֣י יְהֹוָ֑ה וַיְכַפֵּ֧ר עֲלֵיהֶ֛ם אַהֲרֹ֖ן לְטַהֲרָֽם׃", "onk": "וְאִדַּכִּיּוּ לֵוָאֵי וְחַוָּרוּ לְבוּשֵׁיהוֹן וַאֲרֵם אַהֲרֹן יָתְהוֹן אֲרָמָא קֳדָם יְיָ וְכַפַּר עֲלֵיהוֹן אַהֲרֹן לְדַכּוֹאֵיהוֹן:", "onk_en": "The Levites underwent purification and they washed their garments, and Aharon lifted them as a wave-offering before Adonoy; and Aharon achieved atonement on their behalf, to purify them.", "pj": "וְאִדְכִּיאוּ לֵיוָאֵי וְחַוָרוּ לְבוּשֵׁיהוֹן וַאֲרֵים אַהֲרן יַתְהוֹן אֲרָמָא קֳדָם יְיָ וְכַפֵּר עֲלֵיהוֹן אַהֲרן לְדַכּוֹאֵיהוֹן", "pj_en": "And the Levites were purified, and they washed their raiment; and Aharon presented them as an elevation before the Lord. And Aharon made atonement for them to purify them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 22, "aliyah": 2, "heb": "וְאַחֲרֵי־כֵ֞ן בָּ֣אוּ הַלְוִיִּ֗ם לַעֲבֹ֤ד אֶת־עֲבֹֽדָתָם֙ בְּאֹ֣הֶל מוֹעֵ֔ד לִפְנֵ֥י אַהֲרֹ֖ן וְלִפְנֵ֣י בָנָ֑יו כַּאֲשֶׁר֩ צִוָּ֨ה יְהֹוָ֤ה אֶת־מֹשֶׁה֙ עַל־הַלְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבָתַר כֵּן עֲלּוּ לֵוָאֵי לְמִפְלַח יָת פָּלְחַנְהוֹן בְּמַשְׁכַּן זִמְנָא קֳדָם אַהֲרֹן וְקָדָם בְּנוֹהִי כְּמָא דִּי פַקִּיד יְיָ יָת משֶׁה עַל לֵוָאֵי כֵּן עֲבָדוּ לְהוֹן:", "onk_en": "Afterwards, the Levites came to perform their duties in the Tent of Meeting in the presence of Aharon and in the presence of his sons; just as Adonoy commanded Moshe regarding the Levites, so they did unto them.", "pj": "וּמִבָּתַר כְּדֵין אָעֲלוּ לֵיוָאֵי לְמִפְלַח יַת פּוּלְחַנְהוֹן בְּמַשְׁכַּן זִמְנָא לִקֳדָם אַהֲרן וְלִקֳדָם בְּנוֹי הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה עַל לֵיוָאֵי הֵיכְדֵין עָבָדוּ לְהוֹן", "pj_en": "And afterward the Levites went in to fulfil their ministry in the tabernacle of ordinance, before Aharon and his sons: as the Lord had commanded Mosheh concerning the Levites, so did they unto them.", "tj": "", "tj_en": "", "rashi": "<b>כאשר צוה ה' … כן עשו.<\/b> לְהַגִּיד שֶׁבַח הָעוֹשִׂין וְהַנַּעֲשֶׂה בָהֶן, שֶׁאֶחָד מֵהֶם לֹא עִכֵּב:", "rashi_en": "כאשר צוה ה' ... כן עשו AS THE LORD HAD COMMANDED [MOSES CONCERNING THE LEVITES] SO DID THEY [UNTO THEM] — This is repeated (cf. v. 20) to tell the praise of those who performed the rite (Moses, Aaron and the Israelites) and those who had it performed on them (the Levites) — that none of them put any obstacle in the way."}, {"ch": 8, "v": 23, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 24, "aliyah": 2, "heb": "זֹ֖את אֲשֶׁ֣ר לַלְוִיִּ֑ם מִבֶּן֩ חָמֵ֨שׁ וְעֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה יָבוֹא֙ לִצְבֹ֣א צָבָ֔א בַּעֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃", "onk": "דָּא דִּי לְלֵוָאֵי מִבַּר חָמֵשׁ וְעַשְׂרִין שְׁנִין וּלְעֵלָּא יֵיתֵי לַחֲיָלָא חֵילָא בְּפָלְחַן מַשְׁכַּן זִמְנָא:", "onk_en": "This concerns the Levites; from the age of twenty-five years and above he shall enter the division for the duties of the Tent of Meeting.", "pj": "דָא אַחְוַויְיתָא דִי לְלֵיוָאֵי דְלָא מוּפְסָלִין בְּמוּמְהוֹן בְּרַם מִבַּר עֶשְרִין וְחָמֵשׁ שְׁנִין וּלְעֵילָא יֵיתֵי לְחַיְילָא חֵילָא בְּפוּלְחַן מַשְׁכַּן זִמְנָא", "pj_en": "This is the instruction for the Levites who are not disqualified (profaned) by their blemishes: from one of twenty-five years and upward, he shall come, according to his company, to the service of the tabernacle of ordinance", "tj": "", "tj_en": "", "rashi": "<b>זאת אשר ללוים.<\/b> שָׁנִים פּוֹסְלִים וְאֵין הַמּוּמִין פּוֹסְלִים בָּהֶם (ספרי; חולין כ\"ד):<br><br><b>מבן חמש ועשרים.<\/b> וּבְמָקוֹם אַחֵר אוֹמֵר \"מִבֶּן שְׁלֹשִׁים שָׁנָה\" (במדבר ד'), הָא כֵיצַד? מִבֶּן כ\"ה בָּא לִלְמֹד הִלְכוֹת עֲבוֹדָה וְלוֹמֵד חָמֵשׁ שָׁנִים וּבֶן שְׁלֹשִׁים עוֹבֵד, מִכָּאן לְתַלְמִיד שֶׁלֹּא רָאָה סִימָן יָפֶה בְּמִשְׁנָתוֹ בְּחָמֵשׁ שָׁנִים שׁוּב אֵינוֹ רוֹאֶה (ספרי; חולין כ\"ד):", "rashi_en": "זאת אשר ללוים THIS IS THAT WHICH BELONGETH TO THE LEVITES [FROM TWENTY FIVE YEARS etc.] — This suggests: years (the question of age) can disqualify them for the service (i.e. if they are younger than 25 and older than 50 years), but bodily blemishes cannot disqualify them, [as in the case of priests] (Sifrei Bamidbar 62; Chullin 24a).<br><br>מבן חמש ועשרים FROM TWENTY AND FIVE [YEARS] AND UPWARD [THEY SHALL GO IN TO WAIT UPON THE SERVICE] — But in another passage, it states, (Numbers 4:3) “from thirty years old [and upwards … all that enter into the host to do the work in the tabernacle]”! How are these apparently contradictory passages to be reconciled? In the following way: From twenty five years on he (the Levite) comes to learn the laws regulating the service, and he studies for five years, and at the age of thirty he may actually do the service. — From here we may derive the principle that a pupil who does not see an auspicious omen (i. e. success) in his study during five years will never see it. (Sifrei Bamidbar 62; Chullin 24a.)"}, {"ch": 8, "v": 25, "aliyah": 2, "heb": "וּמִבֶּן֙ חֲמִשִּׁ֣ים שָׁנָ֔ה יָשׁ֖וּב מִצְּבָ֣א הָעֲבֹדָ֑ה וְלֹ֥א יַעֲבֹ֖ד עֽוֹד׃", "onk": "וּמִבַּר חַמְשִׁין שְׁנִין יְתוּב מֵחֵיל פָּלְחָנָא וְלָא יִפְלַח עוֹד:", "onk_en": "From the age of fifty he shall retire from the work force, and shall no longer work.", "pj": "וּמִבַּר חַמְשִׁין שְׁנִין יֵיתוּב מֵחֵיל פּוּלְחָנָא וְלָא יִפְלַח תּוּב", "pj_en": "and from fifty years of age he shall return from the band of the service, and serve no more.", "tj": "", "tj_en": "", "rashi": "<b>ולא יעבד עוד.<\/b> עֲבוֹדַת מַשָּׂא בַּכָּתֵף, אֲבָל חוֹזֵר הוּא לִנְעִילַת שְׁעָרִים וְלָשִׁיר וְלִטְעֹן עֲגָלוֹת, וְזֶהוּ וְשֵׁרֵת אֶת אֶחָיו — עִם אֲחוֹהִי, כְּתַרְגּוּמוֹ:", "rashi_en": "ולא יעבד עוד [AND FROM THE AGE OF FIFTY YEARS HE SHALL CEASE WAITING UPON THE SERVICE] AND SHALL DO NO MORE SERVICE — the service of bearing loads on the shoulder, but he still returns (i. e. may be called upon) for closing the Temple gates, for the service of singing and for loading sacred articles upon the wagons; for this is the meaning of (v. 26) “But he shall serve את אחיו” i. e. together with his brethren, just as the Targum renders it (not, “he shall serve his brethren, i. e. wait upon them) (cf. Sifrei Bamidbar 63)."}, {"ch": 8, "v": 26, "aliyah": 2, "heb": "וְשֵׁרֵ֨ת אֶת־אֶחָ֜יו בְּאֹ֤הֶל מוֹעֵד֙ לִשְׁמֹ֣ר מִשְׁמֶ֔רֶת וַעֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַלְוִיִּ֖ם בְּמִשְׁמְרֹתָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִישַׁמַּשׁ עִם אֲחוֹהִי בְּמַשְׁכַּן זִמְנָא לְמִטַּר מַטָּרָא וּפָלְחָנָא לָא יִפְלָח כְּדֵין תַּעְבֵּד לְלֵוָאֵי בְּמַטְּרַתְהוֹן:", "onk_en": "But shall serve with his brethren in the Tent of Meeting to keep the watch, and he shall not do any service; so you shall have the Levites do in their guard duties.", "pj": "וִישַׁמֵשׁ עִם אָחוֹי בְּמַשְׁכַּן זִמְנָא לְמִטַר מַטְרָא וּפוּלְחָנָא לָא יִפְלַח הֵיכְדֵין תַּעֲבֵיד לְלֵיוָאֵי בְּמַטְרַתְהוֹן", "pj_en": "Yet he may minister with his brethren at the tabernacle of ordinance in keeping the watch; but he shall not do any of the service. So shall the Levites act in their charge.", "tj": "", "tj_en": "", "rashi": "<b>לשמר משמרת.<\/b> לַחֲנוֹת סָבִיב לָאֹהֶל וּלְהָקִים וּלְהוֹרִיד בִּשְׁעַת הַמַּסָּעוֹת:", "rashi_en": "לשמר משמרת TO KEEP THE CHARGE — i.e. to encamp round about the tent of meeting in order to keep strangers away, and to erect and dismantle it at the time of finishing and beginning the journey."}, {"ch": 9, "v": 1, "aliyah": 3, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֣ה אֶל־מֹשֶׁ֣ה בְמִדְבַּר־סִ֠ינַ֠י בַּשָּׁנָ֨ה הַשֵּׁנִ֜ית לְצֵאתָ֨ם מֵאֶ֧רֶץ מִצְרַ֛יִם בַּחֹ֥דֶשׁ הָרִאשׁ֖וֹן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בְּמַדְבְּרָא דְסִינַי בְּשַׁתָּא תִנְיֵתָא לְמִפַּקְהוֹן מֵאַרְעָא דְמִצְרַיִם בְּיַרְחָא קַדְמָאָה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe in the desert of Sinai in the second year of their exodus from the land of Egypt, in the first month, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה בְּמַדְבְּרָא דְסִינַי בְּשַׁתָּא תִּנְיֵיתָא לִזְמַן מִפַּקְהוֹן מֵאַרְעָא דְמִצְרַיִם בְּיַרְחָא קַדְמָאָה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh in the wilderness of Sinai, in the second year from the time of their going forth from the land of Mizraim, in the first month, saying:", "tj": "", "tj_en": "", "rashi": "<b>בחדש הראשון.<\/b> פָּרָשָׁה שֶׁבְּרֹאשׁ הַסֵּפֶר לֹא נֶאֶמְרָה עַד אִיָּר, לָמַדְתָּ שֶׁאֵין סֵדֶר מֻקְדָּם וּמְאֻחָר בַּתּוֹרָה, וְלָמָּה לֹא פָתַח בְּזוֹ? מִפְּנֵי שֶׁהִיא גְנוּתָן שֶׁל יִשְׂרָאֵל, שֶׁכָּל אַרְבָּעִים שָׁנָה שֶׁהָיוּ יִשְׂרָאֵל בַּמִדְבָּר לֹא הִקְרִיבוּ אֶלָּא פֶּסַח זוֹ בִּלְבָד (ספרי; תוספתא קידושין ל\"ח):", "rashi_en": "בחדש הראשון [AND THE LORD SPAKE UNTO MOSES] IN THE FIRST MONTH — The section which appears at the commencement of this Book was not spoken before Eyar (the second month; cf. Numbers 1:1): you learn, therefore, that there is no “earlier” or “later” (no chronological order) in the Torah. But why, indeed, did not Scripture open the Book with this section? Because it implies something disparaging to Israel (Sifrei Bamidbar 64:1) — that during all the forty years they were in the wilderness they offered only this single Passover sacrifice (Tosafot on Kiddushin 38b s. v. הואיל) "}, {"ch": 9, "v": 2, "aliyah": 3, "heb": "וְיַעֲשׂ֧וּ בְנֵי־יִשְׂרָאֵ֛ל אֶת־הַפָּ֖סַח בְּמוֹעֲדֽוֹ׃", "onk": "וְיַעְבְּדוּן בְּנֵי יִשְׂרָאֵל יָת פִּסְחָא בְּזִמְנֵיהּ:", "onk_en": "Bnei Yisroel shall perform the <i>Pesach<\/i>-offering in its proper time.", "pj": "וְיַעַבְדוּן בְּנֵי יִשְרָאֵל יַת נִכְסַת פִּסְחָא בֵּינֵי שִׁמְשְׁתָא בִּזְמַנֵיהּ", "pj_en": "Let the children of Israel perform the sacrifice of the Pascha between the suns at its time.", "tj": "", "tj_en": "", "rashi": "<b>במועדו.<\/b> אַף בְּשַׁבָּת, בְּמוֹעֲדוֹ — אַף בְּטֻמְאָה (ספרי):", "rashi_en": "במועדו AT ITS APPOINTED SEASON — even on Sabbath;  במועדו AT ITS APPOINTED SEASON (stated again in v. 3) intimates that it must be offered even in a state of uncleanness (i.e. when the whole congregation, or at least its greater part is unclean as a result of having come in contact with a human corpse) (cf. Sifrei Bamidbar 65)."}, {"ch": 9, "v": 3, "aliyah": 3, "heb": "בְּאַרְבָּעָ֣ה עָשָֽׂר־י֠וֹם בַּחֹ֨דֶשׁ הַזֶּ֜ה בֵּ֧ין הָֽעַרְבַּ֛יִם תַּעֲשׂ֥וּ אֹת֖וֹ בְּמֹעֲד֑וֹ כְּכׇל־חֻקֹּתָ֥יו וּכְכׇל־מִשְׁפָּטָ֖יו תַּעֲשׂ֥וּ אֹתֽוֹ׃", "onk": "בְּאַרְבְּעַת עַשְׂרָא יוֹמָא בְּיַרְחָא הָדֵין בֵּין שִׁמְשַׁיָּא תַּעְבְּדוּן יָתֵיהּ בְּזִמְנֵיהּ כְּכָל גְּזֵרָתֵיהּ וּכְכָל <b>דְּחָזֵי לֵיהּ<\/b> תַּעְבְּדוּן יָתֵיהּ:", "onk_en": "On the fourteenth day of this month, in the afternoon, you shall perform it in its proper time; according to all its statutes and according to all its laws [<b>that are appropriate for it<\/b>] you shall perform it.", "pj": "בְּאַרְבֵּיסַר יוֹמָא בְּיַרְחָא הָדֵין בֵּין שִׁמְשְׁתָא תַּעַבְדוּן יָתֵיהּ בִּזְמַנֵיהּ כְּכָל קְיָימוֹי וּכְכָל דִינוֹי תַּעַבְדוּן יָתֵיהּ", "pj_en": "On the fourteenth day of this mouth, between the suns, they shall perform it in its time; according to all its rites and all its statutes shall they do it.", "tj": "", "tj_en": "", "rashi": "<b>ככל חקתיו.<\/b> אֵלּוּ מִצְוֹת שֶׁבְּגוּפוֹ — שֶֹה תָמִים זָכָר בֶּן שָׁנָה:<br><br><b>וככל משפטיו.<\/b> אֵלּוּ מִצְוֹת שֶׁעַל גּוּפוֹ מִמָּקוֹם אַחֵר, כְּגוֹן שִׁבְעַת יָמִים לְמַצָּה וּלְבִעוּר חָמֵץ (מִצְוֹת שֶׁבְּגוּפוֹ — שֶׂה תָמִים זָכָר בֶּן שָׁנָה; שֶׁעַל גּוּפוֹ — צְלִי אֵשׁ רֹאשׁוֹ עַל כְּרָעָיו וְעַל קִרְבּוֹ; שֶׁחוּץ לְגוּפוֹ — מַצָּה וּבִעוּר חָמֵץ):", "rashi_en": "ככל חקותיו ACCORDING TO ALL RITES OF IT [… SHALL YE KEEP IT] — This refers to the laws relating to its body itself (i.e. the animal itself) while alive — that it must be “a lamb, without blemish, a male, one year old” (Exodus 12:5) (Sifrei Bamidbar 65). <br><br>וככל משפטיו AND ACCORDING TO ALL THE REGULATIONS THEREOF — This again refers to commands which have a bearing upon the animal itself but originating from another place (i.e. outside the animal itself), e.g. seven days for eating unleavened bread and during which the leaven must be removed from one’s home. [Some editions have (cf. Nachmanides): the laws relating to the animal itself are that it must be “a lamb, without blemish, a male and one year old”. Such as have to be practiced upon its body (note the difference in the meaning of this phrase, and the omission of ממקום אחר) are those mentioned in Exodus 12:9: “roasted with fire, its head with its legs and the inward parts thereof”; and finally such as go beyond the sacrifice itself: the eating of unleavened bread and the removal of leaven from the house]."}, {"ch": 9, "v": 4, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר מֹשֶׁ֛ה אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לַעֲשֹׂ֥ת הַפָּֽסַח׃", "onk": "וּמַלִּיל משֶׁה עִם בְּנֵי יִשְׂרָאֵל לְמֶעְבַּד פִּסְחָא:", "onk_en": "Moshe spoke to Bnei Yisroel [telling them] to perform the Pesach-offering.", "pj": "וּמַלֵיל משֶׁה עִם בְּנֵי יִשְרָאֵל לְמֶעֱבַּד יַת נִכְסַת פִּסְחָא", "pj_en": "And Mosheh spake with the children of Israel to perform the sacrifice of the Pascha.", "tj": "", "tj_en": "", "rashi": "<b>וידבר משה וגו'.<\/b> מַה תַּ\"ל? וַהֲלֹא נֶאֱמַר \"וַיְדַבֵּר מֹשֶׁה אֶת מֹעֲדֵי ה'\", אֶלָּא כְּשֶׁשָּׁמַע פָּרָשַׁת מוֹעֲדִים מִסִּינַי אָמַר לָהֶם, וְחָזַר וְהִזְהִירָם בִּשְׁעַת מַעֲשֶׂה (ספרי):", "rashi_en": "וידבר משה וגו׳ AND MOSES SPAKE [TO THE CHILDREN OF ISRAEL THAT THEY SHOULD KEEP THE PASSOVER] — Why is this stated at all? Has it not already been said, (Leviticus 23:44) “And Moses declared [unto the children of Israel] the appointed festivals of the Lord”? But the reason is: when he heard on Sinai the section dealing with the festivals he told it to them then and he used to exhort them again about the festivals at the time when they had to be observed (lit., at the time of action) (Sifrei Bamidbar 66)."}, {"ch": 9, "v": 5, "aliyah": 3, "heb": "וַיַּעֲשׂ֣וּ אֶת־הַפֶּ֡סַח בָּרִאשׁ֡וֹן בְּאַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַחֹ֛דֶשׁ בֵּ֥ין הָעַרְבַּ֖יִם בְּמִדְבַּ֣ר סִינָ֑י כְּ֠כֹ֠ל אֲשֶׁ֨ר צִוָּ֤ה יְהֹוָה֙ אֶת־מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וַעֲבָדוּ יָת פִּסְחָא <b>בְּנִיסָן<\/b> בְּאַרְבְּעַת עַשְׂרָא יוֹמָא לְיַרְחָא בֵּין שִׁמְשַׁיָּא בְּמַדְבְּרָא דְסִינָי כְּכֹל דִּי פַקִּיד יְיָ יָת משֶׁה כֵּן עֲבָדוּ בְּנֵי יִשְׂרָאֵל:", "onk_en": "They performed the Pesach-offering in the first [month] [<b>in Nissan<\/b>] on the fourteenth day of the month in the afternoon in the Sinai desert; according to all that Adonoy commanded Moshe, so did Bnei Yisroel do.", "pj": "וַעֲבָדוּ יַת פִּסְחָא בְּאַרְבֵּיסַר יוֹמִין לְיַרְחָא בֵּינֵי שִׁמְשְׁתָא בְּמַדְבְּרָא דְסִינַי כְּכָל מַה דִי פַקֵיד יְיָ יַת משֶׁה הֵיכְדֵין עָבָדוּ בְּנֵי יִשְרָאֵל", "pj_en": "They performed the Pascha, therefore, on the fourteenth day of the month, between the suns in the wilderness of Sinai; after all that the Lord had commanded Mosheh, so did the children of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 6, "aliyah": 3, "heb": "וַיְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְנֶ֣פֶשׁ אָדָ֔ם וְלֹא־יָכְל֥וּ לַעֲשֹׂת־הַפֶּ֖סַח בַּיּ֣וֹם הַה֑וּא וַֽיִּקְרְב֞וּ לִפְנֵ֥י מֹשֶׁ֛ה וְלִפְנֵ֥י אַהֲרֹ֖ן בַּיּ֥וֹם הַהֽוּא׃", "onk": "וַהֲווֹ גֻבְרַיָּא דִּי הֲווֹ מְסָאֲבִין לִטְמֵי נַפְשָׁא דֶאֱנָשָׁא וְלָא יְכִילוּ לְמֶעְבַּד פִּסְחָא בְּיוֹמָא הַהוּא וּקְרִיבוּ קֳדָם משֶׁה וְקָדָם אַהֲרֹן בְּיוֹמָא הַהוּא:", "onk_en": "There were men who were impure, having had [contact with] a corpse, and they were not able to perform the Pesach-offering on that day, and they drew near before Moshe and before Aharon, on that day.", "pj": "וַהֲווֹ גוּבְרַיָא דְהַווּ מְסָאֲבִין לִטְמֵי נְפַשׁ בַּר נַשׁ דְמִית עֲלֵיהוֹן בִּתְכֵּף דְפוּקְדָנֵיהּ רַמְיָא עֲלֵיהוֹן וְלָא יְכִילוּ לְמֶעֱבַד פִּסְחָא בְּיוֹמָא הַהוּא דְהַוָה יוֹם שְׁבִיעָאָה לְסוֹאֲבוּתְהוֹן וּקְרִיבוּ לִקֳדָם משֶׁה וְקָדָם אַהֲרן בְּיוֹמָא הַהוּא", "pj_en": "But certain men, who were unclean, having been defiled by the body of a man who had died near them suddenly; as the commandment (of the Pascha) came upon them, could not perform it on that day, which was the seventh of their uncleanness. And they came before Mosheh and Aharon on that day;", "tj": "", "tj_en": "", "rashi": "<b>לפני משה ולפני אהרן.<\/b> כְּשֶׁשְּׁנֵיהֶן יוֹשְׁבִין בְּבֵית הַמִּדְרָשׁ בָּאוּ וּשְׁאָלוּם, וְלֹא יִתָּכֵן לוֹמַר זֶה אַחַר זֶה, שֶׁאִם מֹשֶׁה לֹא הָיָה יוֹדֵעַ אַהֲרֹן מִנַּיִן לוֹ (ספרי; בבא בתרא קי\"ט):", "rashi_en": "לפני משה ולפני אהרן [AND THERE WERE CERTAIN MEN, WHO … COULD NOT KEEP THE PASSOVER AND THEY CAME] BEFORE MOSES AND BEFORE AARON — At a time when both were sitting together in the House of Study they came and put this question to them. It would not be correct to say — as the words “”before Moses and before Aaron” might suggest — that they came to them one after the other, because if Moses did not know the reply whence could Aaron know it? (cf. Sifrei Bamidbar 68; Bava Batra 119b)."}, {"ch": 9, "v": 7, "aliyah": 3, "heb": "וַ֠יֹּאמְר֠וּ הָאֲנָשִׁ֤ים הָהֵ֙מָּה֙ אֵלָ֔יו אֲנַ֥חְנוּ טְמֵאִ֖ים לְנֶ֣פֶשׁ אָדָ֑ם לָ֣מָּה נִגָּרַ֗ע לְבִלְתִּ֨י הַקְרִ֜יב אֶת־קׇרְבַּ֤ן יְהֹוָה֙ בְּמֹ֣עֲד֔וֹ בְּת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וַאֲמָרוּ גֻּבְרַיָּא הָאִנּוּן לֵיהּ אֲנַחְנָא מְסָאֲבִין לִטְמֵי נַפְשָׁא דֶאֱנָשָׁא לְמָא נִתְמְנַע בְּדִיל דְּלָא לְקָרָבָא יָת קֻרְבָּנָא דַיְיָ בְּזִמְנֵיהּ בְּגוֹ בְּנֵי יִשְׂרָאֵל:", "onk_en": "Those men said to him: “We are impure, having had contact with a corpse; why should we be excluded and not be able to bring the offering of Adonoy in its proper time, among Bnei Yisroel?”", "pj": "וְאָמָרוּ גוּבְרַיָא הָאִינוּן לֵיהּ אֲנַחְנָא אִסְתְּאַבְנָא לְבַר נַשׁ דְמִית עֲלָנָא לְמָה כְעַן נִתְמְנַע בְּגִין דְלָא לְמֵיכוֹס פִּסְחָא וּלְמִזְרוֹק אַדְמָא דְקוּרְבָּנָא דַיְיָ עַל מַדְבְּחָא בִּזְמַנֵיהּ וּבִשְרֵיהּ יֵיכְלוּן דַכְיָין בְּגוֹ בְּנֵי יִשְרָאֵל", "pj_en": "and these men said to him, We are unclean, on account of a man who died with us: therefore we are hindered from killing the Pascha, and shedding the blood of the Lord's oblation upon the altar at its time, that we may eat its flesh, being clean, among the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>למה נגרע.<\/b> אָמַר לָהֶם אֵין קָדָשִׁים קְרֵבִים בְּטֻמְאָה, אָמְרוּ לוֹ יִזָּרֵק הַדָּם עָלֵינוּ בְכֹהֲנִים טְהוֹרִים וְיֵאָכֵל הַבָּשָֹר לִטְהוֹרִים, אָמַר לָהֶם \"עִמְדוּ וְאֶשְׁמְעָה\" — כְּתַלְמִיד הַמֻּבְטָח לִשְׁמֹעַ מִפִּי רַבּוֹ; אַשְׁרֵי יְלוּד אִשָּׁה שֶׁכָּךְ מֻבְטָח, שֶׁכָּל זְמַן שֶׁהָיָה רוֹצֶה הָיָה מְדַבֵּר עִם הַשְּׁכִינָה; וּרְאוּיָה הָיְתָה פָרָשָׁה זוֹ לֵאָמֵר עַ\"יְ מֹשֶׁה כִּשְׁאָר כָּל הַתּוֹרָה כֻּלָּה, אֶלָּא שֶׁזָּכוּ אֵלּוּ שֶׁתֵּאָמֵר עַל יְדֵיהֶן, שֶׁמְּגַלְגְּלִין זְכוּת עַ\"יְ זַכַּאי (שם):", "rashi_en": "למה נגרע WHEREFORE ARE WE KEPT BACK? — He (Moses) had said to them, “Sacrifices are not permitted to be offered by anyone who is in a state of uncleanness”. They retorted, “למה נגרע” — Why should that prevent us? Let the blood be sprinkled on our behalf by clean priests, and let the flesh be eaten by the clean”. (i.e. let us partake of the flesh at night when we shall already be clean: see Note). Thereupon he said to them: “Stand still (i.e. wait a short time) and I will hear [what the Lord will command concerning you]” — he said this with confidence, like a pupil who is certain that he will get information from his teacher at any time. Happy, indeed, is a human being (lit., one born of woman) who may so confidently rely that at any time when he wishes to do so he may speak with the Shechinah! — This section, in fact, ought to have been said by Moses, just as all the other sections of the Torah, only that these men were privileged that it should be promulgated through their intervention, because “meritorious deeds are brought about by worthy men” (Sifrei Bamidbar 68; Bava Batra 119b)."}, {"ch": 9, "v": 8, "aliyah": 3, "heb": "וַיֹּ֥אמֶר אֲלֵהֶ֖ם מֹשֶׁ֑ה עִמְד֣וּ וְאֶשְׁמְעָ֔ה מַה־יְצַוֶּ֥ה יְהֹוָ֖ה לָכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר לְהוֹן משֶׁה <b>אוֹרִיכוּ<\/b> עַד דְּאִשְׁמַע מָה <b>דְאִתְפַּקַּד<\/b> קֳדָם יְיָ <b>עַל דִּי<\/b> לְכוֹן:", "onk_en": "Moshe said to them: “Stand [<b>wait<\/b>] and I will listen to what Adonoy will instruct [<b>command<\/b>] for [<b>regarding<\/b>] you.”", "pj": "דֵין הוּא חַד מֵאַרְבָּעָה דִינִין דְעָלוּ קֳדָם משֶׁה נְבִיָא וְדָן יַתְהוֹן עַל מֵימְרָא דְקוּדְשָׁא בִּקְצַת מִנְהוֹן הֲוָה משֶׁה מָתִין מִן בִּגְלַל דַהֲווֹ דִינֵי נַפְשָׁתָא וּבִקְצַתְהוֹן הֲוָה משֶׁה זָרִיז מִן בִּגְלַל דַהֲווֹ דִינֵי מָמוֹנָא בְּאִלֵין וּבְאִלֵין אָמַר משֶׁה לָא שַׁמְעִית מִן בִּגְלַל לְמַלְפָא לְרֵישֵׁי סַנְהֶדְרַיְתָא דַעֲתִידִין לְמֵקוּם מִן בַּתְרֵיהּ דִיהוֹן מְתוּנִין בְּדִינֵי נַפְשָׁתָא וּזְרִיזִין בְּדִינֵי מָמוֹנָא וְלָא יְבַהֲתוּן לִמְשַׁיְילֵי דִינָא דְמִתְקַשֵׁי לְהוֹן אֲרוּם משֶׁה דְהַוָה רַבְּהוֹן דְיִשְרָאֵל צָרִיךְ דְיֵימַר לָא שְׁמָעִית בְּגִין כֵּן אָמַר לְהוֹן משֶׁה אוֹרִיכוּ עַד דְאֶשְׁמַע מַה דְאִתְפְּקִיד מִן קֳדָם יְיָ עַל דִלְכוֹן", "pj_en": "This is one of four matters of judgment brought before Mosheh the prophet, which he decided according to the Word of the Holy One: in some of which Mosheh was deliberate, because they were judgments about life; but in the others Mosheh was prompt, they being (only) judgments concerning money: but in those (the former) Mosheh said, I have not heard; that he might teach the princes of the Sanhedrin who should arise after him to be deliberate in judgements regarding life, but prompt in judgments about money; and not to be ashamed to ask counsel in things too hard for them, inasmuch as Mosheh himself, the Rabbi of Israel, had need to say, I have not yet heard. Therefore, said Mosheh to them, Wait until I have heard what will be commanded from before the Lord concerning your case.", "tj": "דֵין חַד מֵאַרְבַּע דִינִין דְעָלוּ לִקְדָם משֶׁה בִּתְרֵין מִנְהוֹן הֲוָה משֶׁה מְזָרֵיז וּבִתְרֵין מִנְהוֹן הֲוָה משֶׁה מָתוּן בִּמְסַאֲבִין דְלָא יָכִילוּ לְמֶעֱבַד פִּסְחָא בִּזְמַנֵיהוֹן וּבְגִין בְּנָתָא דִצְלָפְחָד הֲוָה משֶׁה מְזָרֵז מִן בִּגְלַל דַהֲוָה דִינֵי מָמוֹן דִינֵיהוֹן וּבְמָחֲרָפָא דִחֲרַף שְׁמָא קַדִישָׁא וּבִמְקוֹשְׁשָׁא דְחַלֵל שַׁבְּתָּא בִּזְדָנוּ הֲוָה משֶׁה מָתוּן מִן בִּגְלַל דִי הֲווֹ דִינֵיהוֹן דִינֵי נַפְשָׁתָא בְּאִילֵן וּבְאִילֵן אֲמַר לָא שְׁמָעִית לְמַלְפָא דִינַיָא דַעֲתִידִין לְמֵיקַם בָּתַר משֶׁה לְמֶהֱוֵי זְרִיזִין בְּדִינֵי מָמוֹנָא וּמְתִינִין בְּדִינֵי נַפְשָׁתָא דְלָא יְבַהֲתוּן לְמֵימָר לָא שְׁמָעִית בְּרַם משֶׁה רַבָּן אָמַר לָא שְׁמָעִית וַאֲמַר לְהוֹן קוּמוּ וּשְׁמוּעוּ מַה דִי פַקֵיד מֵימְרָא דַיְיָ לְכוֹן:", "tj_en": "This is one of four matters of judgment brought before Mosheh, in two of which Mosheh was prompt, and in two was he slower. Concerning the unclean who could not perform the Pascha in its time, and concerning the daughters of Zelophehad, was Mosheh prompt, because the latter judgment was about money; but concerning the blasphemer who had reviled the sacred Name, and the gatherer of wood, who wickedly profaned the Sabbath, Mosheh was deliberate, they being decisions involving life; and in them he said, I have not heard; that he might teach the judges who were to come after Mosheh to be prompt in cases of mammon, but deliberate in those of life; and not to be ashamed to say, I have not heard, because Mosheh our Rabbi himself said, I have not heard. Therefore, spake he, Arise, and listen to what the Word of the Lord will prescribe to you.", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 9, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 10, "aliyah": 3, "heb": "דַּבֵּ֛ר אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי־יִהְיֶֽה־טָמֵ֣א&thinsp;<small>׀<\/small>&thinsp;לָנֶ֡פֶשׁ אוֹ֩ בְדֶ֨רֶךְ רְחֹקָ֜הׄ לָכֶ֗ם א֚וֹ לְדֹרֹ֣תֵיכֶ֔ם וְעָ֥שָׂה פֶ֖סַח לַיהֹוָֽה׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל לְמֵימָר גְּבַר גְּבַר אֲרֵי יְהֵי מְסָאָב לִטְמֵי נַפְשָׁא דֶאֱנָשָׁא אוֹ בְאָרְחָא רְחִיקָא לְכוֹן אוֹ לְדָרֵיכוֹן וְיַעְבֵּד פִּסְחָא קֳדָם יְיָ:", "onk_en": "Speak to Bnei Yisroel, saying; any person, if he will be impure from a corpse, or [is] on a distant road, [whether among] yourselves or for your descendants, he shall perform the Pesach-offering for Adonoy", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל לְמֵימָר גְבַר טְלֵי אוֹ גְבַר סִיב אֲרוּם יְהֵי מְסָאָב לִטְמֵי בַּר נַשׁ דְמִית אוֹ דַיֵב אוֹ סְגִיר דִמְרָחֵק בְּאוֹרַח עַלְמָא בְּקִרְיוּת לֵילְיָא וַהֲוָה בַּר מִן סְקוּף מַשְׁכְּנָא לְכוֹן גַרְמֵיכוֹן אוֹ לְדָרֵיכוֹן וְיִדְחֵי לְמֶעֱבַד פִּסְחָא קֳדָם יְיָ", "pj_en": "Speak with the sons of Israel, saying: A man, whether young or old, when unclean by defilement from the dead, or an issue, or the leprosy, or who is hindered in the way of the world by the accidents of the night, or who shall be at a distance from the threshold of his house: if such things happen to you, or to your generations, then may he defer to perform the Pascha before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>או בדרך רחקה.<\/b> נָקוּד עָלָיו, לוֹמַר, לֹא שֶׁרְחוֹקָה וַדַּאי, אֶלָּא שֶׁהָיָה חוּץ לְאַסְקֻפַּת הָעֲזָרָה כָּל זְמַן שְׁחִיטָה (פסח' צ\"ג); פֶּסַח שֵׁנִי מַצָּה וְחָמֵץ עִמּוֹ בַּבַּיִת, וְאֵין שָׁם יוֹם טוֹב, וְאֵין אִסּוּר חָמֵץ אֶלָא עִמּוֹ בַאֲכִילָתוֹ (שם צ\"ה):", "rashi_en": "או בדרך רחקה [IF ANY MAN … SHALL BE UNCLEAN BY REASON OF A DEAD,] OR BE ON A DISTANT JOURNEY — There is a dot on it (on the ה of the word רחקה which letter is therefore regarded as non-existent; cf. Rashi on Genesis 18:9 and Note thereon), in order to tell that what Scripture means by בדרך רחקה is that it (the journey) need not really be a distant one, but that his sacrifice is postponed even though he was merely outside the threshold of the forecourt during the whole time that the ceremony of slaughtering the Passover sacrifice tasted. (Pesachim 93b, cf. Sifrei Bamidbar 69:2). — On the “Second Passover” one may have with him unleavened and leavened bread together in his house, and there is no festival in connection with it, and the eating of leaven is forbidden only together with it (the Passover Sacrifice) — i.e. while the sacrifice is being eaten (cf. Pesachim 95a)."}, {"ch": 9, "v": 11, "aliyah": 3, "heb": "בַּחֹ֨דֶשׁ הַשֵּׁנִ֜י בְּאַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָעַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑וֹ עַל־מַצּ֥וֹת וּמְרֹרִ֖ים יֹאכְלֻֽהוּ׃", "onk": "בְּיַרְחָא תִנְיָנָא בְּאַרְבְּעַת עַשְׂרָא יוֹמָא בֵּין שִׁמְשַׁיָּא יַעְבְּדוּן יָתֵיהּ עַל פַּטִּיר וּמְרָרִין יֵיכְלֻנֵּיהּ:", "onk_en": "in the second month, on the fourteenth day in the afternoon he shall perform it. Together with <i>matzohs<\/i> and bitter herbs they shall eat it.", "pj": "בְּיַרְחָא תִנְיָינָא הוּא יַרְחָא דְאִיָיר בְּאַרְבֵּיסַר יוֹמָא בֵּינֵי שִׁמְשָׁתָא יַעַבְדוּן יָתֵיהּ עַל פַּטִיר וּמְרָרִין יֵיכְלוּנֵיהּ", "pj_en": "But in the second month, which is the month of Ijar, on the fourteenth day of the month, between the suns they shall perform it; with unleavened bread and with bitters they shall eat it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 12, "aliyah": 3, "heb": "לֹֽא־יַשְׁאִ֤ירוּ מִמֶּ֙נּוּ֙ עַד־בֹּ֔קֶר וְעֶ֖צֶם לֹ֣א יִשְׁבְּרוּ־ב֑וֹ כְּכׇל־חֻקַּ֥ת הַפֶּ֖סַח יַעֲשׂ֥וּ אֹתֽוֹ׃", "onk": "לָא יַשְׁאֲרוּן מִנֵּיהּ עַד צַפְרָא וְגַרְמָא לָא יִתְבְּרוּן בֵּיהּ כְּכָל גְּזֵרַת פִּסְחָא יַעְבְּדוּן יָתֵיהּ:", "onk_en": "They shall not leave any of it over until the morning and they shall not break any of its bones; according to all the statutes of the Pesach-offering they shall perform it.", "pj": "לָא יְשַׁיְירוּן מִנֵיהּ עַד צַפְרָא וְגַרְמָא לָא יִתְבְּרוּן בֵּיהּ כְּכָל אַחְוָיַית גְזֵירַת פִּסְחָא דְנִיסָן יַעַבְדוּן יָתֵיהּ בְּרַם בְּפִסְחָא דְנִיסָן הִינוּן יֵיכְלוּן פַּטִירֵי וְקוּרְבַּן פִּסְחָא לָא יַעַבְדוּן מְטוֹל דְסוֹאָבוּתְהוֹן בְּהוֹן וּבְפִסְחָא דְאִיָיר יִידְכּוּן וְיִקְרְבוּן יָתֵיהּ", "pj_en": "They shall not leave of it till the morning, and a bone in it shall not be broken; according to every instruction in the decree of the Pascha in Nisan, they shall perform it. In the Pascha of Nisan (such persons) may eat unleavened bread, but not perform the oblation of the Pascha on account of their defilement; but in the Pascha of Ijar being purified they shall offer it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 13, "aliyah": 3, "heb": "וְהָאִישׁ֩ אֲשֶׁר־ה֨וּא טָה֜וֹר וּבְדֶ֣רֶךְ לֹא־הָיָ֗ה וְחָדַל֙ לַעֲשׂ֣וֹת הַפֶּ֔סַח וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵֽעַמֶּ֑יהָ כִּ֣י&thinsp;<b>׀<\/b> קׇרְבַּ֣ן יְהֹוָ֗ה לֹ֤א הִקְרִיב֙ בְּמֹ֣עֲד֔וֹ חֶטְא֥וֹ יִשָּׂ֖א הָאִ֥ישׁ הַהֽוּא׃", "onk": "וְגַבְרָא דְהוּא דְכֵי וּבְאֹרַח לָא הֲוָה וְיִתְמְנַע לְמֶעְבַּד פִּסְחָא וְיִשְׁתֵּצֵי אֲנָשָׁא הַהִיא מֵעַמַּהּ אֲרֵי קֻרְבָּנָא דַיְיָ לָא קָרִיב בְּזִמְנֵיהּ חוֹבֵיהּ יְקַבֵּל גַּבְרָא הַהוּא:", "onk_en": "The person who is pure and was not on the road, and refrained from performing the Pesach-offering, that soul shall be cut off from its people, for the offering of Adonoy he did not bring in its proper time; that person shall bear his sin.", "pj": "וְגַבְרָא דְהוּא דְכֵי וּבְאוֹרַח עַלְמָא לָא אִסְתָּאֵב וּמִבָּרָא לְסִיקוּף מַשְׁכְּנֵיהּ לָא הֲוָה וּפְסַק מִלְמֶעֱבַד קוּרְבַּן פִּסְחָא דְנִיסָן וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא מֵעַמֵיהּ אֲרוּם קוּרְבָּנָא דַיְיָ לָא קְרֵיב בְּזִמְנֵיהּ חוֹבֵיהּ יְקַבֵּיל גַבְרָא הַהוּא", "pj_en": "But the man who, being clean and undefiled by the way of the world, and not at a distance from the threshold of his home, neglecteth to perform the oblation of the Pascha of Nisan, that man shall be cut off from his people, because he hath not offered the Lord's oblation in its season; that man shall bear his sin.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 14, "aliyah": 3, "heb": "וְכִֽי־יָג֨וּר אִתְּכֶ֜ם גֵּ֗ר וְעָ֤שָֽׂה פֶ֙סַח֙ לַֽיהֹוָ֔ה כְּחֻקַּ֥ת הַפֶּ֛סַח וּכְמִשְׁפָּט֖וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָכֶ֔ם וְלַגֵּ֖ר וּלְאֶזְרַ֥ח הָאָֽרֶץ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲרֵי יִתְגַּיַּר עִמְּכוֹן גִּיּוֹרָא וְיַעְבֵּד פִּסְחָא קֳדָם יְיָ כִּגְזֵרַת פִּסְחָא וְכִדְחָזֵי לֵיהּ כֵּן יַעְבֵּד קְיָמָא חַד יְהֵי לְכוֹן וּלְגִיּוֹרָא וּלְיַצִּיבָא דְאַרְעָא:", "onk_en": "If a proselyte dwells among you and brings the Pesach-offering to Adonoy; according to the statues of the Pesach-offering and according to its laws so shall he perform it; there shall be the same statute for yourselves; [both] for the proselyte and for the native born citizen.", "pj": "וַאֲרוּם אִין יִתְגַיֵיר עִמְכוֹן גִיוֹרָא וְיַעֲבֵיד פִּסְחָא קֳדָם יְיָ כְּאַחְוָיַית גְזֵירַת פִּסְחָא וְכִדְחָזֵי לֵיהּ הֵיכְדֵין יַעֲבֵיד קְיָמָא חֲדָא יְהֵי לְכוֹן וּלְדִיוֹרָא וּלְיַצִבָא דְאַרְעָא", "pj_en": "And if the stranger who is sojourning with you will perform the Pascha before the Lord, he shall do it after the proper manner of the Paschal decree, according to its form so shall he do it. You shall have one statute, both for the sojourner and for the native of the land.", "tj": "", "tj_en": "", "rashi": "<b>וכי יגור אתכם גר ועשה פסח.<\/b> יָכוֹל כָּל הַמִּתְגַּיֵּר יַעֲשֶׂה פֶסַח מִיָּד, תַּ\"ל \"חֻקָּה אַחַת\" וְגוֹ', אֶלָּא כָּךְ מַשְׁמָעוֹ — \"וְכִי יָגוּר אִתְּכֶם גֵּר\" וּבָא לַעֲשׂוֹת פֶּסַח עִם חֲבֵרָיו, \"כְּחֻקַּת הַפֶּסַח וּכְמִשְׁפָּטוֹ יַעֲשֶׂה\" (ספרי):", "rashi_en": "וכי יגור אתכם גר ועשה פסח AND IF A STRANGER SHALL SOJOURN AMONG YOU, AND WILL KEEP THE PASSOVER [ACCORDING TO THE ORDINANCE OF THE PASSOVER … SO SHALL HE DO] — One might think that this verse implies that anyone who becomes a proselyte (גר) must keep the Passover offering rite immediately after his circumcision (even though it has not taken place just before Passover), therefore Scripture states, “yo shall have one ordinance, [both for the stranger, and for him that was born in the land]” (which implies that just as the native brings the offering on the fourteenth of Nisan, so the proselyte, too, must bring it only on the fourteenth of Nisan; cf. Rashi on Exodus 12:48). What the first part of the verse implies is, therefore, the following: “and if a proselyte will sojourn among you, and comes to celebrate the Passover rite together with his fellows, then according to the ordinance of the Passover and according to the manner thereof shall he do” (i.e. ועשה פסח is not a predicative clause — when he becomes a proselyte then shall he offer the Passover, i. e. offer it immediately — but it is a conditional clause, coordinate to וכי יגור אתכם and the apodosis begins with כחקת הפסח etc.) (Sifrei Bamidbar 71)."}, {"ch": 9, "v": 15, "aliyah": 4, "heb": "וּבְיוֹם֙ הָקִ֣ים אֶת־הַמִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽעָנָן֙ אֶת־הַמִּשְׁכָּ֔ן לְאֹ֖הֶל הָעֵדֻ֑ת וּבָעֶ֜רֶב יִהְיֶ֧ה עַֽל־הַמִּשְׁכָּ֛ן כְּמַרְאֵה־אֵ֖שׁ עַד־בֹּֽקֶר׃", "onk": "וּבְיוֹמָא דְּאִתָּקַם יָת מַשְׁכְּנָא חֲפָא עֲנָנָא יָת מַשְׁכְּנָא לְמַשְׁכְּנָא דְסַהֲדוּתָא וּבְרַמְשָׁא הֲוָה עַל מַשְׁכְּנָא כְּחֵזוּ אֶשָּׁתָא עַד צַפְרָא:", "onk_en": "On the day that the <i>Mishkon<\/i> was erected, the Cloud covered the <i>Mishkon<\/i> [which served] as the Tent of Testimony; and in the evening, there was over the <i>Mishkon<\/i> an appearance of fire, until morning.", "pj": "וּבְיוֹמָא דְאִתְקַם יַת מַשְׁכְּנָא חָפָא עֲנַן יְקָרָא יַת מַשְׁכְּנָא וַהֲוָה מְטַלֵל בִּימָמָא לְמַשְׁכְּנָא דְסַהֲדוּתָא וּבְרַמְשָׁא הֲוֵי עַל מַשְׁכְּנָא הֵי כְּחֵיזוּ אֵישָׁא עַד צַפְרָא", "pj_en": "And on the day on which the tabernacle was reared the Cloud of Glory covered the Tabernacle; it overspread the Tabernacle of Testimony by day, and at evening, it was over the Tabernacle like a vision of Fire until the morning.", "tj": "", "tj_en": "", "rashi": "<b>המשכן לאהל העדת.<\/b> הַמִּשְׁכָּן הֶעָשׂוּי לִהְיוֹת אֹהֶל לְלוּחוֹת הָעֵדוּת:<br><br><b>יהיה על המשכן.<\/b> כְּמוֹ הֹוֶה עַל הַמִּשְׁכָּן, וְכֵן לְשׁוֹן כָּל הַפָּרָשָׁה:", "rashi_en": "המשכן לאהל העדות means THE TABERNACLE which is made FOR the purpose of being THE TENT for the tablets of THE TESTIMONY. <br><br>יהיה על המשכן WAS UPON THE TABERNACLE — This has the sense of: was continuously being upon the Tabernacle. Similar is the usage in the whole section (i. e. the verbs יסעו, יחגו, ישכון etc. are imperfects expressing continuous action)."}, {"ch": 9, "v": 16, "aliyah": 4, "heb": "כֵּ֚ן יִהְיֶ֣ה תָמִ֔יד הֶעָנָ֖ן יְכַסֶּ֑נּוּ וּמַרְאֵה־אֵ֖שׁ לָֽיְלָה׃", "onk": "כֵּן הֲוָה תְדִירָא עֲנָנָא חָפֵי לֵיהּ וְחֵזוּ אֶשָּׁתָא בְּלֵילְיָא:", "onk_en": "So it always was, the Cloud covered it, and an appearance of fire, at night.", "pj": "כְּדֵין הֲוֵי תְדִירָא עֲנַן יְקָרָא חָפֵי לֵיהּ בִּימָמָא וְחֵיזוּ אֵשָׁתָא בְּלֵילְיָא", "pj_en": "So was it continually, a Cloud of Glory covering it by day, and a vision of Fire by night.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 17, "aliyah": 4, "heb": "וּלְפִ֞י הֵעָל֤וֹת הֶֽעָנָן֙ מֵעַ֣ל הָאֹ֔הֶל וְאַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּבִמְק֗וֹם אֲשֶׁ֤ר יִשְׁכׇּן־שָׁם֙ הֶֽעָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּלְפוּם אִסְתַּלָּקוּת עֲנָנָא מֵעִלָּוֵי מַשְׁכְּנָא וּבָתַר כֵּן נָטְלִין בְּנֵי יִשְׂרָאֵל וּבְאַתְרָא דְּשָׁרֵי תַמָּן עֲנָנָא תַּמָּן שָׁרָן בְּנֵי יִשְׂרָאֵל:", "onk_en": "Whenever the Cloud was lifted from the Tent, afterwards, did Bnei Yisroel travel; in the place where the Cloud came to rest, it is there that Bnei Yisroel did camp.", "pj": "וּלְפוּם אִישׁוֹן אִסְתַּלְקוּת עֲנָנֵי יְקָרָא מֵעִלַוֵי מַשְׁכְּנָא וּבָתַר כֵּן נַטְלִין בְּנֵי יִשְרָאֵל וּבְאַתְרֵי דְשָׁרֵי תַמָן עֲנָנָא תַמָן שָׁרָן בְּנֵי יִשְרָאֵל", "pj_en": "And what time the Cloud of Glory was uplifted from the Tabernacle, then the children of Israel went forward; and at the place where the Cloud rested, there did the children of Israel rest.", "tj": "", "tj_en": "", "rashi": "<b>העלות הענן.<\/b> כְּתַרְגּוּמוֹ אִסְתַּלָּקוּת, וְכֵן \"וְנַעֲלָה הֶעָנָן\", וְלֹא יִתָּכֵן לִכְתֹּב וּלְפִי עֲלוֹת הֶעָנָן, וְעָלָה הֶעָנָן, שֶׁאֵין זֶה לְשׁוֹן סִלּוּק אֶלָּא צִמּוּחַ וַעֲלִיָּה, כְּמוֹ \"הִנֵּה עָב קְטַנָּה כְּכַף אִישׁ עֹלָה מִיָּם\" (מלכים א י\"ח):", "rashi_en": "העלות הענן — Understand this as the Targum does: the departure (more lit., the raising itself). Similar is, (v. 21): תעלה הענן which means “when the cloud raised itself” (departed; in both cases the verbs are Niphal). It would not be correct to have written in these passages ולפי עֲלוֹת הענן and וְעָלָה הענן (the verbs in the Kal), because this would not be an expression denoting departure, but “springing forth” and “rising”, just as, (1 Kings 18:44): “Behold a little cloud as small as a man’s hand rises (עלה) from the sea.\" "}, {"ch": 9, "v": 18, "aliyah": 4, "heb": "עַל־פִּ֣י יְהֹוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְעַל־פִּ֥י יְהֹוָ֖ה יַחֲנ֑וּ כׇּל־יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶעָנָ֛ן עַל־הַמִּשְׁכָּ֖ן יַחֲנֽוּ׃", "onk": "עַל מֵימְרָא דַיְיָ נָטְלִין בְּנֵי יִשְׂרָאֵל וְעַל מֵימְרָא דַיְיָ שָׁרָן כָּל יוֹמֵי דִּי שָׁרֵי עֲנָנָא עַל מַשְׁכְּנָא שָׁרָן:", "onk_en": "On the word of Adonoy, did Bnei Yisroel travel and on the word of Adonoy, did they camp; all those days on which the Cloud will rested above the <i>Mishkon<\/i>, did they camp.", "pj": "עַל פּוּם מֵימְרָא דַיְיָ נַטְלִין בְּנֵי יִשְרָאֵל וְעַל פּוּם מֵימְרָא דַיְיָ שָׁרָן כָּל יוֹמִין דְשָׁרֵי עֲנַן יְקָרָא עַל מַשְׁכְּנָא בְּרַם הִינוּן שָׁרָן", "pj_en": "By the mouth of the Word of the Lord the children of Israel went forward, and by the Word of the Lord they rested. All the days that the Cloud of Glory abode upon the Tabernacle, (so long) did they abide.", "tj": "", "tj_en": "", "rashi": "<b>על פי ה' יסעו.<\/b> שָׁנִינוּ בִּמְלֶאכֶת הַמִּשְׁכָּן: כֵּיוָן שֶׁהָיוּ יִשְׂרָאֵל נוֹסְעִים, הָיָה עַמּוּד הֶעָנָן מִתְקַפֵּל וְנִמְשָׁךְ עַל גַּבֵּי בְנֵי יְהוּדָה כְּמִין קוֹרָה, תָּקְעוּ וְהֵרִיעוּ וְתָקְעוּ, לֹא הָיָה מְהַלֵּךְ עַד שֶׁמֹּשֶׁה אוֹמֵר קוּמָה ה' — זוֹ בְּסִפְרֵי — וְנָסַע דֶּגֶל מַחֲנֵה יְהוּדָה:<br><br><b>ועל פי ה' יחנו.<\/b> כֵּיוָן שֶׁהָיָה יִשְׂרָאֵל חוֹנִים עַמּוּד הֶעָנָן הָיָה מִתַּמֵּר וְעוֹלֶה וְנִמְשָׁךְ עַל גַּבֵּי בְנֵי יְהוּדָה כְּמִין סֻכָּה, וְלֹא הָיָה נִפְרָשׂ עַד שֶׁמֹּשֶׁה אוֹמֵר \"שׁוּבָה ה' רִבְבוֹת אַלְפֵי יִשְׂרָאֵל\", הֱוֵי אוֹמֵר \"עַ\"פִּ ה' וּבְיַד מֹשֶׁה\" (ברייתא דמל\"ה פי\"ג):", "rashi_en": "(על פי ה’ יסעו (18 ” AT THE COMMANDMENT OF THE LORD [THE CHILDREN OF ISRAEL] JOURNEYED — We have learned in the Boraitha dealing with “the structure of the Tabernacle” (s. 13), “As soon as the Israelites set forth on a journey the pillar of cloud rolled itself up (contracted itself) and extended itself out above the camp of the sons of Judah, like a beam, whereupon they blew a “Tekiah”, a “Teruah”, and another “Tekiah”. It (the cloud) did not, however, move off until Moses said, (Numbers 10:35): “Rise up, O Lord!” — the latter statement is to be found in the Sifrei Bamidbar 84:5 (on the verse quoted) — and then the banner of the camp of Judah marched forward.<br><br>ועל פי ה' יחנו AT THE COMMANDMENT OF THE LORD THEY ENCAMPED — As soon as the Israelites encamped the pillar of cloud rose in a column and extended itself above the camp of the sons of Judah like the roof of a hut, and did not depart until Moses said, (Numbers 10:36), “Return, O Lord, unto the myriads of thousands of Israel!” — You must say (admit; more lit., be saying) that this is the meaning of (Numbers 10:23) “at the commandment of the Lord [they encamped and at the commandment of the Lord they journeyed ...]” but also by the agency of Moses (Sifrei Bamidbar 84:5)."}, {"ch": 9, "v": 19, "aliyah": 4, "heb": "וּבְהַאֲרִ֧יךְ הֶֽעָנָ֛ן עַל־הַמִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְשָׁמְר֧וּ בְנֵי־יִשְׂרָאֵ֛ל אֶת־מִשְׁמֶ֥רֶת יְהֹוָ֖ה וְלֹ֥א יִסָּֽעוּ׃", "onk": "וּבְאוֹרָכוּת עֲנָנָא עַל מַשְׁכְּנָא יוֹמִין סַגִּיאִין וְיִטְּרוּן בְּנֵי יִשְׂרָאֵל יָת מַטְּרַת <b>מֵימְרָא<\/b> דַיְיָ וְלָא נָטְלִין:", "onk_en": "When the Cloud tarried above the <i>Mishkon<\/i>, for many days, Bnei Yisroel would keep the watch of [<b>the word of<\/b>] Adonoy and they would not travel.", "pj": "וּבְאוֹרְכוּת עֲנָנָא עַל מַשְׁכְּנָא יוֹמִין סַגִיאִין וְיִנְטְרוּן בְּנֵי יִשְרָאֵל יַת מַטְרַת מֵימְרָא דַיְיָ וְלָא נַטְלִין", "pj_en": "And if the Cloud tarried over the Tabernacle many days the children of Israel observed the watch of the Word of the Lord, and did not proceed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 20, "aliyah": 4, "heb": "וְיֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽעָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל־הַמִּשְׁכָּ֑ן עַל־פִּ֤י יְהֹוָה֙ יַחֲנ֔וּ וְעַל־פִּ֥י יְהֹוָ֖ה יִסָּֽעוּ׃", "onk": "וְאִית דִּי הֲוָה עֲנָנָא יוֹמֵי דְמִנְיַן עַל מַשְׁכְּנָא עַל מֵימְרָא דַיְיָ שָׁרָן וְעַל מֵימְרָא דַיְיָ נָטְלִין:", "onk_en": "It sometimes happened that the Cloud was for a number of days above the <i>Mishkon<\/i>; on the order of Adonoy did they camp and on the order of Adonoy did they travel.", "pj": "וְאִית זְמַן דְהַוֵי עֲנַן יְקָרָא יוֹמִין דְמִנְיַן הִינוּן שִׁבְעָתֵי יוֹמִין שִׁבְעָתָא עַל מַשְׁכְּנָא עַל פּוּם מֵימְרָא דַיְיָ שָׁרָן וְעַל פּוּם מֵימְרָא דַיְיָ נַטְלִין", "pj_en": "If for the time of a number of days, suppose the seven days of the week, the Cloud of Glory was upon the Tabernacle, by the mouth of the Word of the Lord they rested, and by the mouth of the Word of the Lord they went forward.", "tj": "", "tj_en": "", "rashi": "<b>ויש.<\/b> כְּלוֹמַר, וּפְעָמִים:<br><br><b>ימים מספר.<\/b> יָמִים מוּעָטִים:", "rashi_en": "ויש means as much as AND SOMETIMES; (it is therefore to be translated: and there were times).<br><br>ימים מספר means, A FEW DAYS."}, {"ch": 9, "v": 21, "aliyah": 4, "heb": "וְיֵ֞שׁ אֲשֶׁר־יִהְיֶ֤ה הֶֽעָנָן֙ מֵעֶ֣רֶב עַד־בֹּ֔קֶר וְנַעֲלָ֧ה הֶֽעָנָ֛ן בַּבֹּ֖קֶר וְנָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָלַ֔יְלָה וְנַעֲלָ֥ה הֶעָנָ֖ן וְנָסָֽעוּ׃", "onk": "וְאִית דִּי הֲוָה עֲנָנָא מֵרַמְשָׁא עַד צַפְרָא וּמִסְתַּלַּק עֲנָנָא בְּצַפְרָא וְנָטְלִין אוֹ יֵמָם וְלֵילֵי וּמִסְתַּלַּק עֲנָנָא וְנָטְלִין:", "onk_en": "It sometimes happened that the Cloud was [there] [but] from evening until morning, and then the Cloud rose in the morning and they traveled; or, [the Cloud was there] for a day and a night and the Cloud was lifted, and they traveled.", "pj": "וְאִית זְמַן דְהַוֵי עֲנַן יְקָרָא מִן רַמְשָׁא וְעַד צַפְרָא וּמִסְתַּלֵק עֲנַן יְקָרָא בְּצַפְרָא וְנַטְלִין אוֹ יֵימָם וְלֵילֵי וּמִסְתַּלֵק עֲנָנָא וְנַטְלִין", "pj_en": "Or, if the Cloud of Glory (rested only) from evening until morning, and was uplifted in the morning, then went they onward; whether by day or by night, when the Cloud was lifted up they went forward;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 22, "aliyah": 4, "heb": "אֽוֹ־יֹמַ֜יִם אוֹ־חֹ֣דֶשׁ אוֹ־יָמִ֗ים בְּהַאֲרִ֨יךְ הֶעָנָ֤ן עַל־הַמִּשְׁכָּן֙ לִשְׁכֹּ֣ן עָלָ֔יו יַחֲנ֥וּ בְנֵֽי־יִשְׂרָאֵ֖ל וְלֹ֣א יִסָּ֑עוּ וּבְהֵעָלֹת֖וֹ יִסָּֽעוּ׃", "onk": "אוֹ תְרֵין יוֹמִין אוֹ יַרְחָא אוֹ <b>עִדָּן בְּעִדָּן<\/b> בְּאוֹרָכוּת עֲנָנָא עַל מַשְׁכְּנָא לְמִשְׁרֵי עֲלוֹהִי שָׁרָן בְּנֵי יִשְׂרָאֵל וְלָא נָטְלִין וּבְאִסְתַּלָּקוּתֵיהּ נָטְלִין:", "onk_en": "Or two days or a month or a year [<b>period of time<\/b>] that the Cloud prolonged its stay above the <i>Mishkon<\/i> to rest upon it; Bnei Yisroel remained encamped and they did not travel; when it rose they traveled.", "pj": "אוֹ תְּרֵין יוֹמִין אוֹ יַרְחָא אוֹ שַׁתָּא שְׁלֵימְתָּא בְּאוֹרְכוּת עֲנַן יְקָרָא עַל מַשְׁכְּנָא לְמֵישְׁרֵי עֲלוֹי שָׁרָן בְּנֵי יִשְרָאֵל וְלָא נַטְלִין וּבִזְמַן אִסְתַּלָקוּתֵיהּ נַטְלִין", "pj_en": "whether it was two days, or a month, or a year complete, while the Cloud of Glory made stay over the Tabernacle, abiding on it, the children of Israel abode, and journeyed not, and at the time of its uplifting they went forward.", "tj": "", "tj_en": "", "rashi": "<b>או ימים.<\/b> שָׁנָה, כְּמוֹ \"יָמִים תִּהְיֶה גְּאֻלָּתוֹ\" (ויקרא כ\"ה):", "rashi_en": "או ימים means, [OR] A FULL YEAR, just as, (Leviticus 25:29) “A full year (ימים) shall he have the right of redemption”."}, {"ch": 9, "v": 23, "aliyah": 4, "heb": "עַל־פִּ֤י יְהֹוָה֙ יַחֲנ֔וּ וְעַל־פִּ֥י יְהֹוָ֖ה יִסָּ֑עוּ אֶת־מִשְׁמֶ֤רֶת יְהֹוָה֙ שָׁמָ֔רוּ עַל־פִּ֥י יְהֹוָ֖ה בְּיַד־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "עַל מֵימְרָא דַיְיָ שָׁרָן וְעַל מֵימְרָא דַיְיָ נָטְלִין יָת מַטְּרַת <b>מֵימְרָא<\/b> דַיְיָ נָטְרִין עַל מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה:", "onk_en": "On the order of Adonoy they camped and on the order of [<b>the word of<\/b>] Adonoy they traveled; they kept the watch of Adonoy on the order of Adonoy, through Moshe.", "pj": "עַל פּוּם מֵימְרָא דַיְיָ שָׁרָן וְעַל פּוּם מֵימְרָא דַיְיָ נַטְלִין יַת מַטְרַת מֵימְרָא דַיְיָ נַטְרִין עַל פּוּם מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה", "pj_en": "By the mouth of the Word of the Lord they encamped, and by it they journeyed; they kept the observance of the Word of the Lord, by the mouth of the Word of the Lord through Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 1, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 2, "aliyah": 4, "heb": "עֲשֵׂ֣ה לְךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑ם וְהָי֤וּ לְךָ֙ לְמִקְרָ֣א הָֽעֵדָ֔ה וּלְמַסַּ֖ע אֶת־הַֽמַּחֲנֽוֹת׃", "onk": "עִבֵיד לָךְ תַּרְתֵּין חֲצוֹצְרַן דִּכְסַף נְגִיד תַּעְבֵּד יָתְהוֹן וִיהֶוְיָן לָךְ לְעַרְעָא כְנִשְׁתָּא וּלְאַטָּלָא יָת מַשְׁרִיתָא:", "onk_en": "Make for yourself two silver trumpets; you shall make them, beaten [from one block], and they shall be used by you to summon the congregation and to initiate the departure of the camps.", "pj": "עִיבַד לָךְ מִדִילָךְ תַּרְתֵּין חֲצוֹצְרַן דִכְסַף מִמִינָא קַשְׁיָא עוֹבַד אוּמַן תַּעֲבֵד יַתְהוֹן וִיהוֹן לָךְ לְעַרְעָא כְנִשְׁתָּא וּלְאַטְלָא יַת מַשִׁרְיָתָא", "pj_en": "Make for thee, of thine, two trumpets of silver of solid material, the work of the artificer shalt thou make them; and let them be thine, with which to convoke the assembly, and for the removing of the camps.", "tj": "", "tj_en": "", "rashi": "(<b>עשה לך.<\/b> שֶׁיִּהְיוּ תוֹקְעִין לְפָנֶיךָ כְּמֶלֶךְ, כְּמוֹ שֶׁנֶּאֱמַר \"וַיְהִי בִישֻׁרוּן מֶלֶךְ\":<br><br><b>עשה לך.<\/b> מִשֶּׁלְּךָ:<br><br><b>עשה לך.<\/b> אַתָּה עֲשֵׂה וּמִשְׁתַּמֵּשׁ בָּהֶם וְלֹא אַחֵר):<br><br><b>למקרא העדה.<\/b> כְּשֶׁתִּרְצֶה לְדַבֵּר עִם סַנְהֶדְרִין וּשְׁאָר הָעָם וְתִקְרָאֵם לֶאֱסֹף אֵלֶיךָ, תִּקְרָאֵם עַ\"יְ חֲצוֹצְרוֹת:<br><br><b>ולמסע את המחנות.<\/b> בִּשְׁעַת סִלּוּק מַסָּעוֹת תִּתְקְעוּ בָהֶם לְסִימָן, נִמְצֵאתָ אַתָּה אוֹמֵר עַ\"פִּ שְׁלֹשָׁה הָיוּ נוֹסְעִים — עַל פִּי הַקָּבָּ\"ה וְעַ\"פִּ מֹשֶׁה וְעַ\"פִּ הַחֲצוֹצְרוֹת (ברייתא דמל\"ה פי\"ג):<br><br><b>מקשה.<\/b> מִן הָעֶשֶׁת תַּעֲשֶׂה בְּהַקָּשַׁת הַקֻּרְנָס:", "rashi_en": "עשה לך MAKE THEE etc. — make לך, “for thyself” (on thy own behalf) suggests that they shall blow them in your presence, as before a king, as it is said, (with reference to Moses) (Deuteronomy 33:5) ויהי בישרון מלך “and he was king in Jeshurun”.<br><br>עשה לך MAKE THEE — from that which is thine own and not from the common funds (Sifrei Bamidbar 72).<br><br>עשה לך MAKE FOR THYSELF” also suggests: you make them and use them, but no one else.<br><br>למקרא העדה [THAT THOU MAYEST USE THEM] FOR THE CALLING OF THE ASSEMBLY — i. e. when you wish to speak to the Sanhedrin and the rest of the people and you summon them to assemble unto you, you shall summon them by the trumpets.<br><br>ולמסע א
