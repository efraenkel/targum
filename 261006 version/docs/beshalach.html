he Lord shall reign for ever and ever”: at that future period when all the kingdom will be His (Mekhilta)."}, {"ch": 15, "v": 18, "aliyah": 4, "heb": "יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;יִמְלֹ֖ךְ לְעֹלָ֥ם וָעֶֽד׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יְיָ <b>מַלְכוּתֵהּ קָאֵם<\/b> לְעָלַם וּלְעָלְמֵי עָלְמַיָא:", "onk_en": "Adonoy will reign[<b>, His kingdom is established<\/b>] forever and ever.", "pj": "כַּד חָמוּן עַמָּא בֵּית יִשְרָאֵל יַת נִיסַיָא וְיַת פְּרִישְׁוָותָא דְּעָבַד לְהוֹן קוּדְשָׁא יְהֵי שְׁמֵיהּ מְשַׁבַּח עַל יַמָא דְסוּף וּגְבוּרַת יְדֵיהּ בְּנֵי גְּלַלְיָא עַנְיָין וְאָמְרִין אִילֵין לְאִילֵין אִיתוּ נִיתַּן כְּלִיל דִּרְבוּ בְּרֵישׁ פְּרוֹקַן דְּהוּא מַעֲבִיר וְלָא עָבַר דְּהוּא מַחֲלִיף וְלָא חֲלִיף דְּדִילֵיהּ הוּא כְּלִיל מַלְכוּתָא וְהוּא מֶלֶךְ מַלְכִין בְּעָלְמָא הָדֵין וְדִילֵיהּ הוּא מַלְכוּתָא לְעַלְמָא דְאָתֵי וְדִילֵיהּ הִיא וְהַוְיָא לְעָלְמֵי עַלְמִין", "pj_en": "When the people of the house of Israel beheld the signs and manifestations which the Holy One, whose Name be praised, had done at the sea of Suph, and the power of His hand, the children of the captives answering said one to the other, Come, and let us set the crown of majesty on the head of our Redeemer, who maketh to pass over, and passeth not; who changeth, and is not changed; whose is the crown of the kingdom; the King of kings in this world; whose, too, is the kingdom in the world to come, for ever and ever.", "tj": "כֵּיוָן דְּחָמִין בֵּית יִשְרָאֵל יַת נִיסַיָיא וּפְלָאִין דַּעֲבַד לְהוֹן קוּדְשָׁא בְּרִיךְ הוּא עַל גֵּיף יַמָא יְהֵא שְׁמֵיהּ רַבָּא מְבָרַךְ לְעָלְמֵי עַלְמִין יְהָבוּ יְקַר וְתוּשְׁבַּחְתָּא וְרוֹמְמוּ לֵאלָהָהוֹן עָנְיָן בְּנֵי יִשְרָאֵל וְאָמְרִין אִלֵּין לְאִלֵּין אִתוּן נִתַּן כְּלִילָא בְּרֵישׁ פְּרוֹקָא דְּהוּא מַעֲבַר וְלָא מִתְעֲבֵיר דְּהוּא מַחֲלִיף וְלָא מִתְחַלֵּף דְּהוּא מֶלֶךְ מַלְכִין בְּעַלְמָא הָדֵין וְעוֹד דִּידֵיהּ הוּא כְּלִילָא דְמַלְכוּתָא לְעַלְמָא דְאָתֵי וְדִידֵיהּ הִיא עַד עֲלַם עַלְמַיָּא:", "tj_en": "When the house of Israel had beheld the signs and wonders that the Holy One, Blessed be He, had wrought for them at the border of the sea, let His great Name be blessed for ever and ever,­ they gave glory and thanksgiving and exaltation unto their God. The sons of Israel answered and said one to another, Come, let us set the crown upon the head of the Redeemer, who causeth to pass over, but is not passed; who changeth, but is not changed; the King of kings in this world; whose, too, is the crown of the kingdom of the world to come, and whose it will be for ever and ever.", "rashi": "<b>לעלם ועד.<\/b> לְשׁוֹן עוֹלָמוּת הוּא וְהַוָּי\"ו בּוֹ יְסוֹד, לְפִיכָךְ הִיא פְּתוּחָה, אֲבָל \"אָנֹכִי הַיּוֹדֵעַ וָעֵד\" (ירמיהו כ\"ט), שֶׁהַוָּי\"ו בּוֹ שִׁמּוּשׁ, קְמוּצָה הִיא:", "rashi_en": "לעלם ועד The word ועד is an expression denoting ETERNITY — The ו in it is a root-letter, and consequently it is vowelled with a Patach; but in the similar word in (Jeremiah 29:23) “I am He that knoweth and am witness (ועד)”, where the ו is a servile letter (a prefix) it is vowelled with a Kametz."}, {"ch": 15, "v": 19, "aliyah": 4, "heb": "כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּרִכְבּ֤וֹ וּבְפָרָשָׁיו֙ בַּיָּ֔ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וַיָּ֧שֶׁב יְהֹוָ֛ה עֲלֵהֶ֖ם אֶת־מֵ֣י הַיָּ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וּבְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַיַּבָּשָׁ֖ה בְּת֥וֹךְ הַיָּֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי עַל סוּסָוַת פַּרְעֹה בִּרְתִכּוֹהִי וּבְפָרָשׁוֹהִי בְּיַמָא וַאֲתֵיב יְיָ עֲלֵיהוֹן יָת מֵי יַמָא וּבְנֵי יִשְׂרָאֵל הַלִיכוּ בְיַבֶּשְׁתָּא בְּגוֹ יַמָא:", "onk_en": "When Pharaoh came with his horse and chariot and his cavalry into the sea, Adonoy returned the waters of the sea on them; and the B’nei Yisrael walked on dry land in the midst of the sea.", "pj": "אֲרוּם עָלוּ סוּסְוַות פַּרְעה בִּרְתִיכוֹי וּבְפָרָשׁוֹי בְּיַמָא וְחָזַר יְיָ עֲלֵיהוֹן יַת מוֹי דְיַמָּא וּבְנֵי יִשְרָאֵל הֲלִיכוּ בְּיַבֶּשְׁתָּא בְּגוֹ יַמָא וְתַמָּן סַלְקוּן עִינָוַון בְּסִימָן וְאִילָנֵי מֵיכְלָא וְיַרְקֵי וּמִגְדֵי בְּאַרְעִית יַמָא", "pj_en": "For Pharoh's horses with his chariots and horsemen went into the sea, and the Lord made the waters of the sea to return upon them; but the sons of Israel walked upon the land in the midst of the sea, and there did spring up sweet fountains and trees yielding food and verdure and ripe fruits, (even) on the ground of the sea.", "tj": "", "tj_en": "", "rashi": "<b>כי בא סוס פרעה.<\/b> כַּאֲשֶׁר בָּא:", "rashi_en": "כי בא סוס פרעה means WHEN [THE HORSES] CAME."}, {"ch": 15, "v": 20, "aliyah": 4, "heb": "וַתִּקַּח֩ מִרְיָ֨ם הַנְּבִיאָ֜ה אֲח֧וֹת אַהֲרֹ֛ן אֶת־הַתֹּ֖ף בְּיָדָ֑הּ וַתֵּצֶ֤אןָ כׇֽל־הַנָּשִׁים֙ אַחֲרֶ֔יהָ בְּתֻפִּ֖ים וּבִמְחֹלֹֽת׃", "onk": "וּנְסֵיבַת מִרְיָם נְבִיאֲתָא אֲחָתֵהּ דְאַהֲרֹן יָת תֻּפָּא בִּידַהּ וּנְפָקוּ כָל נְשַׁיָא בַּתְרָהָא בְּתֻפִּין וּבְחִנְגִין:", "onk_en": "Miriam the prophetess, sister of Aharon, took the drum in her hand; and all the women followed her with drums and dancing.", "pj": "וּנְסֵיבַת מִרְיָם נְבִיאָתָא אַחְתֵיהּ דְּאַהֲרן יַת תּוּפָא בִידָהּ וְנַפְקָן כָּל נְשַׁיָא בַּתְרָאָה בְּתוּפַיָיא הֲווֹ חַיְילִין וּבְחִנְגַיָא מְחַנְגִין", "pj_en": "And Miriam the prophetess, the sister of Aharon, took a tambourine in her hand, and all the women came out after her, dancing with tambourines and playing on instruments.", "tj": "", "tj_en": "", "rashi": "<b>ותקח מרים הנביאה.<\/b> הֵיכָן נִתְנַבְּאָה? כְּשֶׁהָיְתָה אֲחוֹת אַהֲרֹן, קֹדֶם שֶׁנּוֹלַד מֹשֶׁה, אָמְרָה עֲתִידָה אִמִּי שֶׁתֵּלֵד בֵּן וְכוּ' כִּדְאִיתָא בְּסוֹטָה. (דף י\"ב). דָּ\"אַ — אֲחוֹת אַהֲרֹן, לְפִי שֶׁמָּסַר נַפְשׁוֹ עָלֶיהָ כְּשֶׁנִּצְטָרְעָה נִקְרֵאת עַל שְׁמוֹ:<br><br><b>את התף.<\/b> כְּלִי שֶׁל מִינֵי זֶמֶר:<br><br><b>בתפים ובמחלת.<\/b> מֻבְטָחוֹת הָיוּ צַדְקָנִיּוֹת שֶׁבַּדּוֹר שֶׁהַקָּבָּ\"ה עוֹשֶׂה לָהֶם נִסִּים וְהוֹצִיאוּ תֻפִּים מִמִּצְרַיִם (מכילתא):", "rashi_en": "ותקח מרים הנביאה AND MIRIAM THE PROPHETESS TOOK — But where had she prophesied? When she was THE SISTER OF AARON alone — before Moses was born she said, “My mother will at some time bear a son who will deliver Israel etc.”, as is stated in Treatise Sotah 12b (cf. Megillah 14a). Another explanation of אחות אהרן, the sister of Aaron: because he jeopardised his life for her by entreating on her behalf and so possibly incurring God’s displeasure when she was stricken with leprosy, she is called by his name (Mekhilta; cf. Rashi Genesis 34:25).<br><br>את התף A TIMBREL — an instrument for a particular kind of music.<br><br>בתפים ובמחלת WITH TIMBRELS AND WITH DANCES — The righteous women in that generation were confident that God would perform miracles for them and they accordingly had brought timbrels with them from Egypt (Mekhilta)."}, {"ch": 15, "v": 21, "aliyah": 4, "heb": "וַתַּ֥עַן לָהֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽיהֹוָה֙ כִּֽי־גָאֹ֣ה גָּאָ֔ה ס֥וּס וְרֹכְב֖וֹ רָמָ֥ה בַיָּֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּמְעַנְיָא לָהֶן מִרְיָם <b>שַׁבָּחוּ וְאוֹדוּ קֳדָם<\/b> יְיָ אֲרֵי <b>אִתְגָאֵי עַל גֵוְתָנַיָא וְגֵאוּתָא דִילֵהּ הִיא<\/b> סוּסְיָא וְרָכְבֵהּ רְמָא בְיַמָא:", "onk_en": "Miriam led them in the response: “Sing to [<b>Praise and give thanks before<\/b>] Adonoy for He is most high [<b>exalted Himself above those who are exalted, and exaltation is His<\/b>]; horse and its rider He hurled into the sea.”", "pj": "וְזָמְרַת לְהוֹן מִרְיָם נוֹדֵי וּנְשַׁבְּחָא קֳדָם יְיָ אֲרוּם תּוּקְפָא וְרוֹמְמוּתָא דִידֵיהּ הוּא עַל גֵּיוְותָנִין הוּא מִתְגָאֵי וְעַל רָמִין הוּא מִתְנַטֵּל עַל דִּי אָזִיד פַּרְעה רַשִׁיעָא וְרָדַף בָּתַר עַמָּא בְּנֵי יִשְרָאֵל סוּסְוָותֵיהּ וּרְתִיכוֹי רְמָא וּטְמַע יַתְהוֹן בְּיַמָא דְסוּף", "pj_en": "And Miriam sang to them, Let us give thanks and praise before the Lord, for might and supremacy are His; above the proud He is glorified, and above the lofty He is exalted. When the wicked, Pharoh in his pride followed after the people of the sons of Israel, his horses and his chariots did He cast and drown in the sea of Suph.", "tj": "בְּתוּפַיָיא הֲוָון חַיְילִין:", "tj_en": "With tambourines dancing.", "rashi": "<b>ותען להם מרים.<\/b> מֹשֶׁה אָמַר שִׁירָה לָאֲנָשִׁים – הוּא אוֹמֵר וְהֵם עוֹנִין אַחֲרָיו – וּמִרְיָם אָמְרָה שִׁירָה לַנָּשִׁים (סוטה ל'):", "rashi_en": "ותען להם מרים AND MIRIAM SANG UNTO THEM — Moses sang the Song to the men — he sang it and they repeated it after him; and Miriam sang the Song to the women and they repeated it after her (Mekhilta)."}, {"ch": 15, "v": 22, "aliyah": 4, "heb": "וַיַּסַּ֨ע מֹשֶׁ֤ה אֶת־יִשְׂרָאֵל֙ מִיַּם־ס֔וּף וַיֵּצְא֖וּ אֶל־מִדְבַּר־שׁ֑וּר וַיֵּלְכ֧וּ שְׁלֹֽשֶׁת־יָמִ֛ים בַּמִּדְבָּ֖ר וְלֹא־מָ֥צְאוּ מָֽיִם׃", "onk": "וְאַטֵל משֶׁה יָת יִשְׂרָאֵל מִיַמָא דְסוּף וּנְפָקוּ לְמַדְבְּרָא <b>דְחַגְרָא<\/b> וַאֲזָלוּ תְלָתָא יוֹמִין בְּמַדְבְּרָא וְלָא אַשְׁכָּחוּ מַיָא:", "onk_en": "Moshe led [B’nei] Yisrael away from the Reed Sea, and they went out into the desert of Shur [<b>Cheger<\/b>], they traveled for three days in the desert and they did not find any water.", "pj": "וְאַטֵּיל משֶׁה יַת יִשְרָאֵל מִן יַמָא דְסוּף וּנְפָקוּ לְמַדְבְּרָא דְּחָלוּצָא וְטַיְילוּ תְּלָתָא יוֹמִין בְּמַדְבְּרָא בְּטֵילִין מִן פִּיקוּדַיָיא וְלָא אַשְׁכָּחוּ מַיָא", "pj_en": "And Mosheh made Israel go forward from the sea of Suph, and they went forth into the wilderness of Chalutsa. And they journeyed three days in the desert, empty of instruction, and found no water.", "tj": "אוֹרְחָא דְחָלוּצָא:", "tj_en": "The way of Chalutsa.", "rashi": "<b>ויסע משה.<\/b> הִסִּיעָן בְּעַל כָּרְחָם, שֶׁעִטְּרוּ מִצְרַיִם אֶת סוּסֵיהֶם בְּתַכְשִׁיטֵי זָהָב וָכֶסֶף וַאֲבָנִים טוֹבוֹת, וְהָיוּ יִשְׂרָאֵל מוֹצְאִין אוֹתָן בַּיָּם – וּגְדוֹלָה הָיְתָה בִזַּת הַיָּם מִבִּזַּת מִצְרַיִם שֶׁנֶּאֱמַר \"תּוֹרֵי זָהָב נַעֲשֶׂה לָּךְ עִם נְקֻדּוֹת הַכָּסֶף\" (שיר השירים א') – לְפִיכָךְ הֻצְרַךְ לְהַסִּיעָן בְּעַל כָּרְחָם:", "rashi_en": "ויסע משה AND MOSES CAUSED [ISRAEL] TO JOURNEY — He made them journey against their own will, because the Egyptians had adorned their horses with ornaments of gold and silver and with precious stones, and the Israelites were finding these in the sea. Greater, indeed, was the booty they obtained at the Red Sea then the booty they had brought out of Egypt — as it is said (Song 1:11) “Circlets of gold (the booty of the Sea) will we make thee together with the studs of silver” (which we brought forth from Egypt) (Mekhilta). On this account he was compelled to make them journey on against their will."}, {"ch": 15, "v": 23, "aliyah": 4, "heb": "וַיָּבֹ֣אוּ מָרָ֔תָה וְלֹ֣א יָֽכְל֗וּ לִשְׁתֹּ֥ת מַ֙יִם֙ מִמָּרָ֔ה כִּ֥י מָרִ֖ים הֵ֑ם עַל־כֵּ֥ן קָרָֽא־שְׁמָ֖הּ מָרָֽה׃", "onk": "וַאֲתוֹ לְמָרָה וְלָא יְכִילוּ לְמִשְׁתֵּי מַיָא מִמָרָה אֲרֵי מְרִירִין אִנוּן עַל כֵּן קְרָא שְׁמַהּ מָרָה:", "onk_en": "They came to Marah but they could not drink the water of Marah because it was bitter. The place was therefore called Marah [bitter].", "pj": "וְאָתוּ לְמָרָה וְלָא יָכִילוּ לְמִשְׁתֵּי מוֹי מִמָּרָה אֲרוּם מְרִירִין הִינוּן בְּגִין כֵּן קְרָא שְׁמֵיהּ מָרָה", "pj_en": "And they came to Marah, but could not drink the waters of Marah because they were bitter; therefore he called the name of it Marah.", "tj": "", "tj_en": "", "rashi": "<b>ויבאו מרתה.<\/b> כְּמוֹ לְמָרָה, ה\"א בְּסוֹף תֵּבָה בִּמְקוֹם למ\"ד בִּתְחִלָּתָהּ, וְהַתָּי\"ו הִיא בִּמְקוֹם ה\"א הַנִּשְׁרֶשֶׁת בְּתֵבַת מָרָה, וּבִסְמִיכָתָהּ, כְּשֶׁהִיא נִדְבֶּקֶת לַהֵ\"א שֶׁהוּא מוֹסִיף בִּמְקוֹם הַלָּמֶ\"ד, תֵּהָפֵךְ הַהֵ\"א שֶׁל שֹׁרֶשׁ לְתָי\"ו; וְכֵן כָּל הֵ\"א שֶׁהִיא שֹׁרֶשׁ בַּתֵּבָה תִּתְהַפֵּךְ לְתָי\"ו בִּסְמִיכָתָהּ, כְּמוֹ \"חֵמָה אֵין לִי\" (ישעיהו כ\"ז), \"וַחֲמָתוֹ בָּעֲרָה בוֹ\" (אסתר א'), הֲרֵי הֵ\"א שֶׁל שֹׁרֶשׁ נֶהְפֶּכֶת לְתָי\"ו מִפְּנֵי שֶׁנִּסְמֶכֶת אֶל הַוָּי\"ו הַנּוֹסֶפֶת, וְכֵן \"עֶבֶד וְאָמָה\" (ויקרא כ\"ה), \"הִנֵּה אֲמָתִי בִלְהָה\" (בראשית ל'), \"לְנֶפֶשׁ חַיָּה\" (בראשית ב׳:ז׳), \"וְזִהֲמַתּוּ חַיָּתוֹ לָחֶם\" (איוב ל\"ג), \"בֵּין הָרָמָה\" (שופטים ד'), \"וּתְשֻׁבָתוֹ הָרָמָתָה\" (שמואל א ז'):", "rashi_en": "ויבאו מרתה AND THEY CAME TO MARAH — The word מרתה is the same as למרה: a ה at the end of a word (as a suffix) replaces a ל at its beginning (as a prefix). The ת takes the place of the ה which is rooted in (an integral part of) the word מרה; when it is joined with another letter, viz., when it is attached to the ה which is added to the word in place of the ל, the ה of the primary form (the ordinary form of the noun from which longer forms are made by the addition of suffixes) is changed into a ת. Thus, also, every ה which is a root-letter (a letter in the primary form of the noun) is changed into a ת when it is joined to another letter. E. g., we have (Isaiah 27:4) “Fury (חמה) is not in Me”, but (Esther 1:12) “And his fury (חמתו) burned within him”; you see that the ה of the ground-form is changed into a ת because it is to be joined to the ו which has been added. Similar are: (Leviticus 25:44) “Manservant and handmaid (אמה)”, but (Genesis 30:3) “Behold, my handmaid (אמתי) Bilhah”; (Genesis 2:7) “a creature of life (חיה)”, but (Job 33:20) “His life (חיתו) maketh him to abhor bread”; (Judges 4:5) “Between Ramah (רמה) [and Beth-el]”, but (I Samuel 7:17) “And his return was to Ramah (הרמתה)” the latter example being exactly parallel to that in this verse (מרתה - מרה‎)."}, {"ch": 15, "v": 24, "aliyah": 4, "heb": "וַיִּלֹּ֧נוּ הָעָ֛ם עַל־מֹשֶׁ֥ה לֵּאמֹ֖ר מַה־נִּשְׁתֶּֽה׃", "onk": "וְאִתְרָעָמוּ עַמָא עַל משֶׁה לְמֵימַר מָה נִשְׁתֵּי:", "onk_en": "The people complained to Moshe saying, “What shall we drink?”", "pj": "וְאִתְרַעֲמוּ עַמָא עַל משֶׁה לְמֵימַר מַה נִּשְׁתֵּי", "pj_en": "And the people murmured against Mosheh, saying, What shall we drink?", "tj": "וְאִדְיָינוּ עַמָּא:", "tj_en": "And the people contended.", "rashi": "<b>וילנו.<\/b> לְשׁוֹן נִפְעָל הוּא, וְכֵן הַתַּרְגּוּם לְשׁוֹן נִפְעָל הוּא וְאִתְרַעֲמוּ, וְכֵן דֶּרֶךְ לְשׁוֹן תְּלוּנָה לְהָסֵב הַדִּבּוּר אֶל הָאָדָם – מִתְלוֹנֵן, מִתְרוֹעֵם וְלֹא אָמַר לוֹנֵן, רוֹעֵם, וְכֵן יֹאמַר הַלּוֹעֵז דקומפ\"לישנ\"ט ש\"י בְלַעַז, מֵסֵב הַדִּבּוּר אֵלָיו בְּאָמְרוֹ ש\"י:", "rashi_en": "וילנו AND THEY MURMURED — This is a Niphal form, and similarly the Targum is a Niphal form: ואתרעמו (the Ithpael form in Aramaic corresponds to the Hebrew Niphal). And such is the way in which the expression denoting murmuring (from root לון) is employed: to refer back the matter (the action of murmuring) to the person (the subject of the verb); thus one says מתלונן and מתרועם and one does not say לונן and רועם. So, too, the Frenchman says “decomplaisant se” in old French, where it turns back the matter (the action) to himself (the subject) by saying, “se”, English himself."}, {"ch": 15, "v": 25, "aliyah": 4, "heb": "וַיִּצְעַ֣ק אֶל־יְהֹוָ֗ה וַיּוֹרֵ֤הוּ יְהֹוָה֙ עֵ֔ץ וַיַּשְׁלֵךְ֙ אֶל־הַמַּ֔יִם וַֽיִּמְתְּק֖וּ הַמָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛וֹ חֹ֥ק וּמִשְׁפָּ֖ט וְשָׁ֥ם נִסָּֽהוּ׃", "onk": "<b>וְצַלִי קֳדָם<\/b> יְיָ <b>וְאַלְפֵהּ<\/b> יְיָ אָעָא וּרְמָא לְמַיָא <b>וּבַסִימוּ<\/b> מַיָא תַּמָן <b>גְזַר<\/b> לֵהּ קְיָם וְדִין וְתַמָן נַסְיֵהּ:", "onk_en": "He [Moshe] cried out to [<b>prayed before<\/b>] Adonoy, Adonoy showed him [<b>instructed him concerning<\/b>] a tree and he threw it into the water, and the water became sweet [<b>pleasing<\/b>]. There He set before [<b>established for<\/b>] them statutes and ordinances, and there He tested them.", "pj": "וְצַלֵּי קֳדָם יְיָ וְאַחְוַיֵהּ לֵיהּ יְיָ אִילַן מְרִיר דְּאַרְדִפְנֵי וְכָתַב עֲלוֹי שְׁמָא רַבָּא וְיַקִּירָא וְטָלַק לְגוֹי מַיָא וְאִתְחַלּוּן מַיָא תַּמָּן שַׁוִי לֵיהּ מֵימְרָא דַיְיָ גְּזֵרַת שַׁבְּתָא וְקַיֵּים אִיקַר אַבָּא וְאִמָּא דִינֵי פִּדְעָא וּמַשְׁקוֹפֵי וּקְנָסִין דְמִקְנְסֵי לְחַיָּיבַיָא וְתַמָּן נַסְיָא בְּנִסְיוֹנָא עֲשִירְיָתָא", "pj_en": "And he prayed before the Lord, and the Lord showed him the bitter tree of Ardiphne; and he wrote upon it the great and glorious Name, and cast it into the midst of the waters, and the waters were rendered sweet. And there did the Word of the Lord appoint to him the ordinance of the Sabbath, and the statute of honouring father and mother, the judgments concerning wounds and bruises., and the punishments wherewith offenders are punished; and there he tried (them) with the tenth trial,", "tj": "וְצַלֵּי משֶׁה קֳדָם יְיָ וְחַוֵּי לֵיהּ מֵימְרָא דַיְיָ אִילֵן דְּאִרְדִפְנִי וּטְלַק בְּגוֹ מַיָא וְאִתְחַלְיָין מַיָא תַּמָּן חַוִּי לֵיהּ מֵימְרָא דַיְיָ קַיָימִין וְסִידְרֵי דִינִין וְתַמָּן נַסֵּי יָתֵיהּ נִיסִין בְּנִסְיוֹנָא עֲשִירָאָה:", "tj_en": "And Mosheh prayed before the Lord, and the Word of the Lord showed him the tree of Ardiphne, and he cast it into the midst of the waters, and the waters were made sweet. There did the Word of the Lord show unto him statutes and orders of judgment, and there He tried him with trials in the tenth trial.", "rashi": "<b>שם שם לו.<\/b> בְּמָרָה נָתַן לָהֶם מִקְצָת פָּרָשִׁיּוֹת שֶׁל תּוֹרָה שֶׁיִּתְעַסְּקוּ בָהֶם, שַׁבָּת וּפָרָה אֲדֻמָּה וְדִינִין (סנהדרין נ\"ו):<br><br><b>ושם נסהו.<\/b> לָעָם, וְרָאָה קְשִׁי עָרְפּוֹ, שֶׁלֹּא נִמְלְכוּ בְמֹשֶׁה בְּלָשׁוֹן יָפָה \"בַּקֵּשׁ עָלֵינוּ רַחֲמִים שֶׁיִּהְיֶה לָנוּ מַיִם לִשְׁתּוֹת\" אֶלָּא נִתְלוֹנְנוּ:", "rashi_en": "שם שם לו HERE HE MADE FOR THEM [A STATUTE AND AN ORDINANCE) — At Marah He gave them a few sections of the Torah in order that they might engage in the study thereof; viz., the sections containing the command regarding the sabbath, the red heifer and the administration of justice (Mekhilta; Sanhedrin 56b).<br><br>ושם נסהו AND THERE HE TRIED THEM (lit., He tried him) — “him” (singular) means the people; and He saw their stubbornness: that they did not consult with Moses in a respectful fashion: “Entreat mercy for us that we may have water to drink” — but that they murmured."}, {"ch": 15, "v": 26, "aliyah": 4, "heb": "וַיֹּ֩אמֶר֩ אִם־שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְק֣וֹל&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ וְהַיָּשָׁ֤ר בְּעֵינָיו֙ תַּעֲשֶׂ֔ה וְהַֽאֲזַנְתָּ֙ לְמִצְוֺתָ֔יו וְשָׁמַרְתָּ֖ כׇּל־חֻקָּ֑יו כׇּֽל־הַמַּחֲלָ֞ה אֲשֶׁר־שַׂ֤מְתִּי בְמִצְרַ֙יִם֙ לֹא־אָשִׂ֣ים עָלֶ֔יךָ כִּ֛י אֲנִ֥י יְהֹוָ֖ה רֹפְאֶֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמַר אִם קַבָּלָא תְקַבֵּל <b>לְמֵימְרָא<\/b> דַיְיָ אֱלָהָךְ וּדְכָשַׁר <b>קֳדָמוֹהִי<\/b> תַעְבֵּד וְתַצֵית לִפִקוּדוֹהִי וְתִטַר כָּל קְיָמוֹהִי כָּל מַרְעִין דִי שַׁוֵיתִי בְמִצְרַיִם לָא אֲשַׁוֵי עֲלָךְ אֲרֵי אֲנָא יְיָ אַסָךְ:", "onk_en": "He said [to them,] “If you vigilantly obey the voice [<b>Word<\/b>] of Adonoy, your God, and do what is upright in His eyes [<b>before Him<\/b>], give ear to His commandments, and preserve all His statutes; [then], every sickness that I brought upon Egypt, I will not bring upon you, for I am Adonoy, Who heals you.", "pj": "וַאֲמַר אִין קַבָּלָא תְקַבֵּל לְמֵימְרָא דַיְיָ אֱלָהָךְ וּדְכָשַׁר קֳדָמוֹי תַּעֲבֵיד וְתַצֵּית לְפִקוּדוֹי וְתִנְטוֹר כָּל קְיָימוֹי כָּל מַרְעִין בִּישִׁין דְּשַׁוִּיתִי עַל מִצְרָאֵי לָא אַשְׁוִינוּן עֲלָךְ וְאִם תַּעַבְרוּן עַל פִּתְגָּמֵי אוֹרַיְיתָא וּמִשְׁתַּלְחִין עֲלָךְ אִין תְּתִיבוּן אַעֲדִינוּן מִנָךְ אֲרוּם אֲנָא הוּא יְיָ אַסְאָךְ", "pj_en": "and said, If you will truly hearken to the Word of the Lord your God, and do that which is right before Him, and will listen to His precepts and keep all His statutes, all those evil things that I laid upon the Mizraee I will not lay upon thee: but if thou wilt transgress against the word of the law, upon thee shall they be sent. If thou convert, I will remove them from thee; for I am the Lord thy Healer.", "tj": "אֲרוּם אֲנָא יְיָ בְּמֵימְרִי מָסֵי יָתָךְ:", "tj_en": "For I am the Lord who healeth thee by My Word.", "rashi": "<b>אם שמוע תשמע.<\/b> זוֹ קַבָּלָה שֶׁיְּקַבְּלוּ עֲלֵיהֶם:<br><br><b>תעשה.<\/b> הִיא עֲשִׂיָּה:<br><br><b>והאזנת.<\/b> תַּטֶּה אָזְנַיִם לְדַקְדֵּק בָּהֶם:<br><br><b>כל חקיו.<\/b> דְּבָרִים שֶׁאֵינָן אֶלָּא גְּזֵרַת מֶלֶךְ, בְּלֹא שׁוּם טַעַם, וְיֵצֶר הָרָע מְקַנְטֵר עֲלֵיהֶם: מָה אִסּוּר בְּאֵלּוּ? לָמָּה נֶאֶסְרוּ? כְּגוֹן לְבִישַׁת כִּלְאַיִם וַאֲכִילַת חֲזִיר וּפָרָה אֲדֻמָּה וְכַיּוֹצֵא בָהֶם (יומא ס\"ז):<br><br><b>לא אשים עליך.<\/b> וְאִם אָשִׂים הֲרֵי הוּא כְּלֹא הוּשְׂמָה, <b>כי אני ה' רפאך<\/b> – זֶהוּ מִדְרָשׁוֹ. וּלְפִי פְשׁוּטוֹ כִּי אֲנִי ה' רֹפְאֶךָ וּמְלַמֶּדְךָ תוֹרָה וּמִצְווֹת לְמַעַן תִּנָּצֵל מֵהֶם, כָּרוֹפֵא הַזֶּה הָאוֹמֵר לָאָדָם, אַל תֹּאכַל דָּבָר זֶה פֶּן יְבִיאֲךָ לִידֵי חֹלִי זֶה, וְכֵן הוּא אוֹמֵר \"רִפְאוּת תְּהִי לְשָׁרֶּךָ\" (משלי ג'):", "rashi_en": "אם שמע תשמע IF THOU WILL DILIGENTLY HEARKEN — this implies acceptance — that they should take upon themselves the duty of performing God’s commands.<br><br>תעשה AND IF THOU WILT DO — this implies the performance of the commands.<br><br>והאזנת means THOU WILT INCLINE THE EAR to be punctilious in the practice of the details.<br><br>כל חקיו ALL HIS STATUTES — Matters which are only the decrees of the King (decrees of God imposed by Him, as King, upon us, His subjects) and which appear to have no reason, and at which the evil inclination cavils saying, “What sense is there in prohibiting these? Why should they be prohibited?” — For instance: the prohibition of wearing a mixture of wool and linen, and of eating swine’s flesh, and the law regarding the red heifer, and similar matters (cf. Yoma 67b).<br><br>לא אשים עליך I WILL NOT PLACE ON THEE — and if I do place them on thee because thou refusest to hearken to My voice, it will be as though they had not been placed on thee, for if thou repentest of thy disobedience I will remove them immediately, כי אני ה׳ רפאך BECAUSE I AM THE LORD THAT HEALETH THEE. This is its Midrashic explanation (Mekhilta). But according to its literal sense the meaning is: For I am the Lord who healeth thee and teacheth thee the Law and Commandments in order that thou mayst be saved from them (these diseases) — like a physician who says to a man: Do not eat this thing lest it will bring you into danger from this disease. So, too, it states, (Proverbs 3:8) “It (obedience to God) will be wholesome to thy body” (implying that disease will not fall upon thee) (Mekhilta)."}, {"ch": 15, "v": 27, "aliyah": 5, "heb": "וַיָּבֹ֣אוּ אֵילִ֔מָה וְשָׁ֗ם שְׁתֵּ֥ים עֶשְׂרֵ֛ה עֵינֹ֥ת מַ֖יִם וְשִׁבְעִ֣ים תְּמָרִ֑ים וַיַּחֲנוּ־שָׁ֖ם עַל־הַמָּֽיִם׃", "onk": "וַאֲתוֹ לְאֵילִם וְתַמָן תְּרֵי עֲסַר מַבּוּעִין דְמַיִן וְשִׁבְעִין דִקְלִין וּשְׁרוֹ תַמָן עַל מַיָא:", "onk_en": "Then they came to Eilim, where there were twelve springs of water and seventy date palms. and they camped the by the water.", "pj": "וְאָתוּ לְאֵלִים וּבְאֵלִים תַּרְתֵּי סְרֵי עֵינַוָון דְּמַיָין עַנְוָוא לְכָל שִׁבְטָא וְשׁוּבְעִין דִּקְלִין כָּל קְבֵיל שׁוּבְעִין סָבַיָא דְיִשְרָאֵל וּשְׁרוֹן תַּמָּן עַל מַיָא", "pj_en": "And they came to Elim; and in Elim were twelve fountains of water, a fountain for each tribe; and seventy palm-trees, corresponding with the seventy elders of Israel: and they encamped there by the waters.", "tj": "וְאָתוּן לְאֵילִימָה וְתַמָּן תַּרְתֵּי עַשְרֵי ^עַיְינִין דְּמַיָין כָּל קְבֵיל תַּרְתֵּי עַשְרֵי שִׁבְטַיָא דְּיִשְרָאֵל וְשַׁבְעִין דִּיקְלִין כָּל קְבֵיל שַׁבְעִין סָבַיָא סַנְהֶדְרִין דְּיִשְרָאֵל:", "tj_en": "And they came to Elim, where were twelve fountains of water, answering to the twelve tribes of Israel, and seventy palm-trees, answering to the seventy elders of the Sanhedrin of Israel.", "rashi": "<b>שתים עשרה עינת מים.<\/b> כְּנֶגֶד י\"ב שְׁבָטִים נִזְדַּמְּנוּ לָהֶם:<br><br><b>ושבעים תמרים.<\/b> כְּנֶגֶד שִׁבְעִים זְקֵנִים (מכילתא):", "rashi_en": "שתים עשרה עינת מים TWELVE SPRINGS OF WATER — A number corresponding to the twelve tribes of Israel were ready for them (Mekhilta).<br><br>ושבעים תמרים AND SEVENTY PALM-TREES — corresponding to the seventy elders (Mekhilta)."}, {"ch": 16, "v": 1, "aliyah": 5, "heb": "וַיִּסְעוּ֙ מֵֽאֵילִ֔ם וַיָּבֹ֜אוּ כׇּל־עֲדַ֤ת בְּנֵֽי־יִשְׂרָאֵל֙ אֶל־מִדְבַּר־סִ֔ין אֲשֶׁ֥ר בֵּין־אֵילִ֖ם וּבֵ֣ין סִינָ֑י בַּחֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַחֹ֣דֶשׁ הַשֵּׁנִ֔י לְצֵאתָ֖ם מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וּנְטָלוּ מֵאֵילִם וַאֲתוֹ כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל לְמַדְבְּרָא דְסִין דִי בֵין אֵילִם וּבֵין סִינָי בְּחַמְשָׁא עַסְרָא יוֹמָא לְיַרְחָא תִנְיָנָא לְמִפָּקְהוֹן מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "They journeyed from Eilim, and the entire community of the B’nei Yisrael came to the desert of Sin, which is between Eilim and Sinai. It was the fifteenth day of the second month after they went out of the land of Egypt.", "pj": "וּנְטָלוּ מֵאֵלִים וְאָתוּן כָּל כְּנִשְׁתָּא דְּיִשְרָאֵל לְמַדְבְּרָא דְסִין דְּבֵין אֵלִים וּבֵין סִינָי בַּחֲמֵיסַר יוֹמִין לְיַרְחָא דְאִיָּיר הוּא יַרְחָא תִּנְיָנָא לְמִפַּקְהוֹן מֵאַרְעָא דְמִצְרָיִם", "pj_en": "And the whole congregation of Israel journeyed from Elim, and came to the desert of Sin, which is between Elim and Sinai, on the fifteenth day of the month of Ijar, the second month from their going forth from the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>בחמשה עשר יום.<\/b> נִתְפָּרֵשׁ הַיּוֹם שֶׁל חֲנָיָה זוֹ, לְפִי שֶׁבּוֹ בַיּוֹם כָּלְתָה הַחֲרָרָה שֶׁהוֹצִיאוּ מִמִּצְרַיִם וְהֻצְרְכוּ לַמָּן, לְלַמְּדֵנוּ, שֶׁאָכְלוּ מִשְּׁיָרֵי הַבָּצֵק שִׁשִּׁים וְאַחַת סְעוּדוֹת וְיָרַד לָהֶם מָן בְּשִׁשָּׁה עָשָׂר בְּאִיָּר, וְיוֹם א' בְּשַׁבָּת הָיָה כִּדְאִיתָא בְּמַסֶּכֶת שַׁבָּת (פ\"ז):", "rashi_en": "בחמשה עשר יום ON THE FIFTEENTH DAY — The day of this encampment is specially mentioned because on that day there came to an end the cake (provisions) they had brought with them from Egypt and they now needed the Manna, thus informing us that of the remains of the dough they had prepared in Egypt (cf. Rashi on Exodus 12:33) they ate sixty-one meals. For the Manna fell for them on the sixteenth day of Iyar, which was the first day of the week, just as is stated in the Treatise Shabbat 87b."}, {"ch": 16, "v": 2, "aliyah": 5, "heb": "<span class=\"mam-kq\"><span class=\"mam-kq-k\">(וילינו)<\/span> <span class=\"mam-kq-q\">[וַיִּלּ֜וֹנוּ]<\/span><\/span> כׇּל־עֲדַ֧ת בְּנֵי־יִשְׂרָאֵ֛ל עַל־מֹשֶׁ֥ה וְעַֽל־אַהֲרֹ֖ן בַּמִּדְבָּֽר׃", "onk": "וְאִתְרָעָמוּ כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל עַל משֶׁה וְעַל אַהֲרֹן בְּמַדְבְּרָא:", "onk_en": "The entire community of the B’nei Yisrael complained against Moshe and Aharon in the desert.", "pj": "וּבְהַהוּא יוֹמָא פָּסַק לְהוֹן לִישָׁא דְאַפִּיקוּ מִמִּצְרַיִם וְאִתְרַעֲמוּן כָּל בְּנֵי יִשְרָאֵל עַל משֶׁה וְעַל אַהֲרן בְּמַדְבְּרָא", "pj_en": "And on that day the bread which they had brought out of Mizraim was finished. And all the sons of Israel grumbled against Mosheh and against Aharon in the desert.", "tj": "", "tj_en": "", "rashi": "<b>וילונו.<\/b> לְפִי שֶׁכָּלָה הַלֶּחֶם:", "rashi_en": "וילנו AND THEY MURMURED, because the bread had come to an end."}, {"ch": 16, "v": 3, "aliyah": 5, "heb": "וַיֹּאמְר֨וּ אֲלֵהֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי־יִתֵּ֨ן מוּתֵ֤נוּ בְיַד־יְהֹוָה֙ בְּאֶ֣רֶץ מִצְרַ֔יִם בְּשִׁבְתֵּ֙נוּ֙ עַל־סִ֣יר הַבָּשָׂ֔ר בְּאׇכְלֵ֥נוּ לֶ֖חֶם לָשֹׂ֑בַע כִּֽי־הוֹצֵאתֶ֤ם אֹתָ֙נוּ֙ אֶל־הַמִּדְבָּ֣ר הַזֶּ֔ה לְהָמִ֛ית אֶת־כׇּל־הַקָּהָ֥ל הַזֶּ֖ה בָּרָעָֽב׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמָרוּ לְהוֹן בְּנֵי יִשְׂרָאֵל לְוַי דְמִיתְנָא <b>קֳדָם<\/b> יְיָ בְּאַרְעָא דְמִצְרַיִם כַּד הֲוֵינָא יָתְבִין עַל דוּדֵי בִסְרָא כַּד הֲוֵינָא אָכְלִין לַחְמָא וְשָׂבְעִין אֲרֵי אַפֶּקְתּוּן יָתָנָא לְמַדְבְּרָא הָדֵין לְקַטָלָא יָת כָּל קְהָלָא הָדֵין בְּכַפְנָא:", "onk_en": "The B’nei Yisrael said to them, “If only we had died by the hand of [<b>before<\/b>] Adonoy in the land of Egypt, when we sat by pots of meat and ate our fill of bread, for you have brought us out to this desert to cause this entire congregation to die of starvation.”", "pj": "וַאֲמָרוּ לְהוֹן בְּנֵי יִשְרָאֵל הַלְוַאי דְּמִיתְנָא בְּמֵימְרָא דַיְיָ בְּאַרְעָא דְמִצְרַיִם כַּד הֲוֵינָא יַתְבִין עַל דִּדְוָתָא דְבִיסְרָא כַּד הֲוֵינָא אָכְלִין לַחְמָא וּשְבֵעִין אֲרוּם הַנְפַּקְתּוּן יָתָן לְמַדְבְּרָא הָדֵין לְקַטָלָא יַת כָּל קְהָלָא הָדֵין בְּכַפְנָא", "pj_en": "And the sons of Israel said to them, Would that we had died by the Word of the Lord in the land of Mizraim, when we sat by the cisterns of meat, and ate bread and had enough! Why hast thou brought us out into this wilderness to kill all this congregation with hunger?", "tj": "", "tj_en": "", "rashi": "<b>מי יתן מותנו.<\/b> שֶׁנָּמוּת; וְאֵינוֹ שֵׁם דָּבָר כְּמוֹ מִיתָתֵנוּ, אֶלָּא כְּמוֹ עֲשׂוֹתֵנוּ חֲנוֹתֵנוּ שׁוּבֵנוּ, לַעֲשׂוֹת אֲנַחְנוּ, לַחֲנוֹת אֲנַחְנוּ, לָמוּת אֲנַחְנוּ. תַּרְגּוּמוֹ לְוַי דְּמִיתְנָא, \"לוּ מַתְנוּ\" (במדבר יד, ב) — הַלְוַאי וְהָיִינוּ מֵתִים:", "rashi_en": "מי יתן מותנו WOULD THAT WE HAD DIED — The word מותנו means “that we should die”; it is not a noun with the same meaning as מיתתנו “our death”, but it is an infinitive like עשותנו and חנותנו and שובנו which signify “that we should make”, “that we should encamp”, “that we should return”. In the Targum it is rendered by לוי דמיתנא which is really the Targum rendering of (Numbers 14:2) לו מתנו “Would that we were dead” (cf. Rashi on Exodus 14:12)."}, {"ch": 16, "v": 4, "aliyah": 5, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה הִנְנִ֨י מַמְטִ֥יר לָכֶ֛ם לֶ֖חֶם מִן־הַשָּׁמָ֑יִם וְיָצָ֨א הָעָ֤ם וְלָֽקְטוּ֙ דְּבַר־י֣וֹם בְּיוֹמ֔וֹ לְמַ֧עַן אֲנַסֶּ֛נּוּ הֲיֵלֵ֥ךְ בְּתוֹרָתִ֖י אִם־לֹֽא׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה הָא אֲנָא <b>מָחֵית<\/b> לְכוֹן לַחְמָא מִן שְׁמַיָא וְיִפְקוּן עַמָא וְיִלְקְטוּן פִּתְגַם יוֹם בְּיוֹמֵהּ בְּדִיל דַאֲנַסִנוּן הַיְהָכוּן בְּאוֹרַיְתִי אִם לָא:", "onk_en": "Adonoy said to Moshe, “Behold, I will make bread rain [<b>come down<\/b>] from heaven for you, and the people shall go out and gather enough for each day, that I may test them [to see] if they will walk in [the way of] My teaching or not.", "pj": "וַאֲמַר יְיָ לְמשֶׁה הָא אֲנָא מָחִית לְכוֹן לַחֲמָא מִן שְׁמַיָא דְּאִיצְטְנַא לְכוֹן מִן שֵׁרוּיָא וְיִפְקוּן עַמָּא וְיִלְקְטוּן פִּתְגַּם יוֹם בְּיוֹמֵיהּ מִן בִּגְלַל לְנַסּוֹיֵיהוֹן אִין נַטְרִין מִצְוָותָא דְאוֹרַיְיתִי אִין לָא", "pj_en": "And the Lord said to Mosheh, Behold, I will cause the bread which hath been laid up for you from the beginning to descend from heaven: and the people shall go out and gather the matter of a day by the day, that I may try them whether they will keep the commandments of My law or not.", "tj": "", "tj_en": "", "rashi": "<b>דבר יום ביומו.<\/b> צֹרֶךְ אֲכִילַת יוֹם יִלְקְטוּ בְּיוֹמוֹ וְלֹא הַיּוֹם לְצֹרֶךְ מָחָר (מכילתא):<br><br><b>למען אנסנו הילך בתורתי.<\/b> אִם יִשְׁמְרוּ מִצְווֹת הַתְּלוּיוֹת בּוֹ, שֶׁלֹּא יוֹתִירוּ מִמֶּנּוּ וְלֹא יֵצְאוּ בַּשַּׁבָּת לִלְקֹט:", "rashi_en": "דבר יום ביומו THE THING OF THE DAY ON ITS DAY — what is needed for a day’s eating shall they collect on its (that) day, and they shall not today collect what will be needed tomorrow (cf. Mekhilta).<br><br>למען אנסנו הילך בתורתי THAT I MAY TRY THEM WHETHER THEY WILL WALK IN MY LAW — whether they will observe the commands associated with it: viz., that they should not leave any overnight, and that they should not go out on the Sabbath to collect it."}, {"ch": 16, "v": 5, "aliyah": 5, "heb": "וְהָיָה֙ בַּיּ֣וֹם הַשִּׁשִּׁ֔י וְהֵכִ֖ינוּ אֵ֣ת אֲשֶׁר־יָבִ֑יאוּ וְהָיָ֣ה מִשְׁנֶ֔ה עַ֥ל אֲשֶֽׁר־יִלְקְט֖וּ י֥וֹם&thinsp;<small>׀<\/small>&thinsp;יֽוֹם׃", "onk": "וִיהֵי בְּיוֹמָא שְׁתִיתָאָה וִיתַקְנוּן יָת דְיַיְתוּן וִיהֵי עַל חַד תְּרֵין עַל דְיִלְקְטוּן יוֹם יוֹם:", "onk_en": "On the sixth day [when] they prepare what they bring [home], it will be twice as much as they gather every [other] day.”", "pj": "וִיהֵי בְּיוֹמָא שְׁתִיתָאֵי וְיִזְמְנוּן מַה דְּיַיְתוּן לְקָמֵיהוֹן לְמֵיכַל בְּיוֹמָא דְּשַׁבַּתָּא וִיעַרְבוּן בְּבָתַּיָא וְיִשְׁתַּתְּפוּן בְּדָרָתֵיהוֹן בְּגִין לְמֵיתַיָיא מִדֵּין לְדֵין וִיהֵי לְהוֹן בְּכוּפְלָא עַל מַה דִּמְלַקְטוּן יוֹמָא יוֹמָא", "pj_en": "And on the sixth day they shall prepare what they set before them to eat on the day of the Sabbath; and they shall mix in the houses and communicate in their dwellings, so that by carrying this to that, they may have double of that which they gather from day to day.", "tj": "", "tj_en": "", "rashi": "<b>והיה משנה.<\/b> לַיּוֹם וְלַמָּחֳרָת:<br><br><b>משנה.<\/b> עַל שֶׁהָיוּ רְגִילִים לִלְקֹט יוֹם יוֹם שֶׁל שְׁאָר יְמוֹת הַשָּׁבוּעַ; אוֹמֵר אֲנִי \"אֲשֶׁר יָבִיאוּ וְהָיָה מִשְׁנֶה\" – לְאַחַר שֶׁיָּבִיאוּ, יִמְצְאוּ מִשְׁנֶה בַּמְּדִידָה עַל אֲשֶׁר יִלְקְטוּ וְיָמֹדּוּ יוֹם יוֹם, וְזֶהוּ לָקְטוּ לֶחֶם מִשְׁנֶה – בִּלְקִיטָתוֹ הָיָה נִמְצָא לֶחֶם מִשְׁנֶה. וְזֶהוּ עַל כֵּן הוּא נוֹתֵן לָכֶם בַּיּוֹם הַשִּׁשִּׁי לֶחֶם יוֹמָיִם – נוֹתֵן לָכֶם בְּרָכָה, פוי\"שן, בַּבַּיִת לְמַלֹּאת הָעֹמֶר פַּעֲמַיִם לְלֶחֶם יוֹמַיִם:", "rashi_en": "והיה משנה AND IT SHALL BE DOUBLE — for today and for tomorrow.<br><br>משנה DOUBLE of what they were accustomed to collect on each day of the other days of the week. I say that the words, אשר יביאו והיה משנה “what they bring shall be double”, imply that after they have brought it home they will find it double in measure of what they had been gathering and measuring each day. This is the force of: “they collected double bread” (v. 22) — when it was collected it was found by them to be double food, and this is the meaning of (v. 29), “therefore he giveth you on the sixth day the bread of two days”: He gives you a blessing — old French foison, — abundance in the house that you may fill the Omer twice, as bread for two days."}, {"ch": 16, "v": 6, "aliyah": 5, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ וְאַהֲרֹ֔ן אֶֽל־כׇּל־בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽידַעְתֶּ֕ם כִּ֧י יְהֹוָ֛ה הוֹצִ֥יא אֶתְכֶ֖ם מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר משֶׁה וְאַהֲרֹן לְכָל בְּנֵי יִשְׂרָאֵל בְּרַמְשָׁא וְתִדְעוּן אֲרֵי יְיָ אַפֵּיק יָתְכוֹן מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "Moshe and Aharon said to all the B’nei Yisrael, “In the evening you will know that [it is] Adonoy [Who] brought you out from the land of Egypt.", "pj": "וַאֲמַר משֶׁה וְאַהֲרן לְכָל בְּנֵי יִשְרָאֵל בְּרַמְשָׁא וְתִנְדְּעוּן אֲרוּם יְיָ אַפֵּיק יַתְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרָיִם", "pj_en": "And Mosheh and Aharon said to all the sons of Israel, At evening you shall know that the Lord hath brought you out free from the land of Mizraim;", "tj": "", "tj_en": "", "rashi": "<b>ערב.<\/b> כְּמוֹ לָעֶרֶב:<br><br><b>וידעתם כי ה' הוציא אתכם מארץ מצרים.<\/b> לְפִי שֶׁאֲמַרְתֶּם לָנוּ כִּי הוֹצֵאתֶם אוֹתָנוּ, תֵּדְעוּ כִּי לֹא אֲנַחְנוּ הַמּוֹצִיאִים אֶלָּא ה' הוֹצִיא אֶתְכֶם שֶׁיָּגִיז לָכֶם אֶת הַשְּׂלָו:", "rashi_en": "ערב is the same as לערב AT EVENING<br><br>וידעתם כי ה׳ הוציא אתכם מארץ מצרים YE SHALL KNOW THAT THE LORD HATH BROUGHT YOU OUT OF THE LAND OF EGYPT — Since you said to us, (v. 3) “for ye have brought us forth” you shall know that it was not we who brought you forth, but it was God who brought you forth for He will bring quails for you."}, {"ch": 16, "v": 7, "aliyah": 5, "heb": "וּבֹ֗קֶר וּרְאִיתֶם֙ אֶת־כְּב֣וֹד יְהֹוָ֔ה בְּשׇׁמְע֥וֹ אֶת־תְּלֻנֹּתֵיכֶ֖ם עַל־יְהֹוָ֑ה וְנַ֣חְנוּ מָ֔ה כִּ֥י <span class=\"mam-kq\"><span class=\"mam-kq-k\">(תלונו)<\/span> <span class=\"mam-kq-q\">[תַלִּ֖ינוּ]<\/span><\/span> עָלֵֽינוּ׃", "onk": "וּבְצַפְרָא וְתֶחֱזוּן יָת יְקָרָא דַיְיָ <b>כַּד שְׁמִיעַ (קֳדָמוֹהִי)<\/b> יָת תֻּרְעֲמוּתְכוֹן <b>עַל מֵימְרָא<\/b> דַיְיָ וְנַחְנָא מָא אֲרֵי אַתְרַעַמְתּוּן עֲלָנָא:", "onk_en": "And in the morning you will see the glory of Adonoy, for He has heard your complaints [<b>are heard (before Him)<\/b>] against [<b>regarding the Word of<\/b>] Adonoy. But what are we that you cause complaints against us?”", "pj": "וּבְצַפְרָא יִתְגְּלֵי עֲלֵיכוֹן יְקַר שְׁכִינְתָּא דַיְיָ כַּד שְׁמִיעַן קֳדָמוֹי יַת תּוּרְעֲמַתְכוֹן קֳדָם יְיָ וַאֲנַחְנָא מָה אֲנַן חֲשִׁיבִין אֲרוּם אִתְרַעַמְתּוּן עֲלָנָא", "pj_en": "and in the morning will be revealed to you the glory of the Shekinah of the Lord; and we, what are we accounted, that you complain against us?", "tj": "וַאֲנַן מָה אֲנָן חֲשִׁיבִין:", "tj_en": "And we, what are we accounted?", "rashi": "<b>ובקר וראיתם.<\/b> לֹא עַל הַכָּבוֹד שֶׁנֶּאֱמַר \"וְהִנֵּה כְּבוֹד ה' נִרְאָה בֶּעָנָן\" נֶאֱמַר, אֶלָּא כָּךְ אָמַר לָהֶם, עֶרֶב וִידַעְתֶּם כִּי הַיְכֹלֶת בְּיָדוֹ לִתֵּן תַּאֲוַתְכֶם, וּבָשָׂר יִתֵּן, אַךְ לֹא בְּפָנִים מְאִירוֹת יִתְּנֶנָּה לָכֶם, כִּי שֶׁלֹּא כַּהֹגֶן שְׁאַלְתֶּם אוֹתוֹ וּמִכָּרֵס מְלֵאָה, וְהַלֶּחֶם שֶׁשְּׁאַלְתֶּם לְצֹרֶךְ, בִּירִידָתוֹ לַבֹּקֶר תִּרְאוּ אֶת כְּבוֹד אוֹר פָּנָיו – שֶׁיּוֹרִידֵהוּ לָכֶם דֶּרֶךְ חִבָּה, בַּבֹּקֶר, שֶׁיֵּשׁ שָׁעוֹת לַהֲכִינוֹ וְטַל מִלְמַעְלָה וְטַל מִלְּמַטָּה, כְּמֻנָּח בְּקֻפְסָא (יומא ע\"ה):<br><br><b>את תלנתיכם על ה'.<\/b> כְּמוֹ אֲשֶׁר עַל ה':<br><br><b>ונחנו מה.<\/b> מָה אֲנַחְנוּ חֲשׁוּבִין?<br><br><b>כי תלינו עלינו.<\/b> שֶׁתַּרְעִימוּ עָלֵינוּ אֶת הַכֹּל, וְאֶת בְּנֵיכֶם וּנְשֵׁיכֶם וּבְנוֹתֵיכֶם וְעֵרֶב רַב. וְעַל כָּרְחִי אֲנִי זָקוּק לְפָרֵשׁ תַּלִּינוּ בִּלְשׁוֹן תַּפְעִילוּ מִפְּנֵי דַּגְשׁוּתוֹ וּקְרִיָּתוֹ, שֶׁאִלּוּ הָיָה רָפֶה, הָיִיתִי מְפָרְשׁוֹ בִּלְשׁוֹן תִּפְעֲלוּ, כְּמוֹ \"וַיָּלֶן הָעָם עַל מֹשֶׁה\" (שמות י\"ז), אוֹ אִם הָיָה דָגוּשׁ וְאֵין בּוֹ יוֹ\"ד וְנִקְרָא תִלּוֹנוּ, הָיִיתִי מְפָרְשׁוֹ לְשׁוֹן תִּתְלוֹנְנוּ, עַכְשָׁיו הוּא מַשְׁמַע תַּלִּינוּ אֶת אֲחֵרִים, כְּמוֹ בַּמְּרַגְּלִים \"וַיַּלִּינוּ עָלָיו אֶת כָּל הָעֵדָה\" (במדבר י\"ד):", "rashi_en": "ובקר וראיתם AND IN THE MORNING YE SHALL SEE [THE GLORY OF THE LORD] — Not in reference to that glory of which it stated, (v. 10) “And behold the glory of the Lord appeared in the cloud” is this said, but thus, in effect, did he say to them: In the evening ye shall know that His hand has the power to give you your desire and He will give you flesh; but not with a radiant countenance will He give it to you, because you have asked Him something that is not proper (since one can exist without eating meat), and out of a full stomach (i. e. you really have meat for you have an abundance of cattle); but the bread for which you have asked out of necessity — when it falls in the morning you will behold the glory of the radiance of His countenance (His glory), because He will make it fall for you in a manner that is indicative of His love (Mekhilta) — in the morning, whilst there is yet time to prepare it, and there shall be dew above it and dew below it as though it were carefully packed in a chest (Yoma 75b).<br><br>את תלנתיכם על ה׳ this is the same as תלנתיכם] אשר על ה׳] YOUR MURMURINGS WHICH ARE AGAINST THE LORD.<br><br>ונחנו מה (lit., and we, what?) means AND WE, WHAT ARE WE accounted (of what importance are we?),<br><br>כי תלינו עלינו THAT YOU MAKE everyone MURMUR AGAINST US — your sons, and your wives, and your daughters and the mixed multitude. — And whether I like it or not I am forced to explain the word תַלִּינוּ in the sense of “you make (people) do something”, viz., murmur (i. e. what we call the Hiphil conjugation), because of its (the ל) be eshed and because of the קרי. For if it (the ל) were weak (i. e. without a Dagesh), I would explain it in the sense of “ye do something” (our Kal), just as, (Exodus 17:3) “And the people murmured (וַיָלֶן) against Moses”, or, if there was still a Dagesh but there was no י in it, so that it could be read תִלּוֹנוּ, I would explain it as meaning “ye put yourself in a state of murmuring” (our Niphal; cf. Rashi on Exodus 15:24). Now, however, it being as it is, it must imply “you make others murmur”, just as in the case of the spies it states, (Numbers 14:36) “And they made all the congregation to murmur (וַיַּלִּינוּ) against him” (where וַיַּלִּינוּ is the same grammatical form, so far as conjugation is concerned, as תַלִּינוּ, but as it has an object, כל העדה, it cannot mean “And they murmured”, and must necessarily mean “they made the congregation murmur)."}, {"ch": 16, "v": 8, "aliyah": 5, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֗ה בְּתֵ֣ת יְהֹוָה֩ לָכֶ֨ם בָּעֶ֜רֶב בָּשָׂ֣ר לֶאֱכֹ֗ל וְלֶ֤חֶם בַּבֹּ֙קֶר֙ לִשְׂבֹּ֔עַ בִּשְׁמֹ֤עַ יְהֹוָה֙ אֶת־תְּלֻנֹּ֣תֵיכֶ֔ם אֲשֶׁר־אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑יו וְנַ֣חְנוּ מָ֔ה לֹא־עָלֵ֥ינוּ תְלֻנֹּתֵיכֶ֖ם כִּ֥י עַל־יְהֹוָֽה׃", "onk": "וַאֲמַר משֶׁה בִּדְיִתֵּן יְיָ לְכוֹן בְּרַמְשָׁא בִּסְרָא לְמֵיכַל וְלַחְמָא בְּצַפְרָא לְמִשְׂבַּע <b>בְּדִשְׁמִיעַ קֳדָם<\/b> יְיָ יָת תֻּרְעֲמוּתְכוֹן דִי אַתּוּן מִתְרַעֲמִין עֲלוֹהִי וְנַחְנָא מָא לָא עֲלָנָא תֻּרְעֲמוּתְכוֹן אֶלָהֵן עַל <b>מֵימְרָא<\/b> דַיְיָ:", "onk_en": "[Then] Moshe said, “When Adonoy gives you meat to eat in the evening, and a filling meal of bread in the morning, Adonoy will have heard your complaints [<b>will have been heard before Adonoy<\/b>], that you cause complaints against Him. What are we? Your complaints are not against us but against [<b>the Word of<\/b>] Adonoy.”", "pj": "וַאֲמַר משֶׁה בְּדֵין תֵדְעוּן בִּדְיַזְמִין יְיָ לְכוֹן בְּרַמְשָׁא בִּישְרָא לְמֵיכוֹל וְלַחְמָא בְּצַפְרָא לְמִשְבּוֹעַ בְּדִשְׁמִיעַן קֳדָם יְיָ יַת תּוּרְעֲמוּתְכוֹן דְּאַתּוּן מִתְרַעֲמִין עֲלוֹי וַאֲנַחְנָא מָה אֲנַן חֲשִׁיבִין לָא עֲלָנָא תּוּרְעֲמַתְכוֹן אֱלָהֵן עַל מֵימְרָא דַיְיָ", "pj_en": "And Mosheh said, By this you shall know, when the Lord prepareth you at evening flesh to eat, and in the morning bread to satisfy, that your complainings wherewith you complain against Him are heard before the Lord. And we, what are we accounted? Your complaints are not against us, but against the Word of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>בשר לאכל.<\/b> וְלֹא לִשְׂבֹּעַ; לִמְּדָה תוֹרָה דֶּרֶךְ אֶרֶץ שֶׁאֵין אוֹכְלִין בָּשָׂר לָשֹׂבַע. וּמָה רָאָה לְהוֹרִיד לֶחֶם בַּבֹּקֶר וּבָשָׂר בָּעֶרֶב? לְפִי שֶׁהַלֶּחֶם שָׁאֲלוּ כַּהֹגֶן, שֶׁאִי אֶפְשָׁר לוֹ לָאָדָם בְּלֹא לֶחֶם, אֲבָל בָּשָׂר שָׁאֲלוּ שֶׁלֹּא כַּהֹגֶן, שֶׁהַרְבֵּה בְהֵמוֹת הָיוּ לָהֶם, וְעוֹד שֶׁהָיָה אֶפְשָׁר לָהֶם בְּלֹא בָשָׂר, לְפִיכָךְ נָתַן לָהֶם בִּשְׁעַת טֹרַח שֶׁלֹּא כַּהֹגֶן (יומא ע\"ה):<br><br><b>אשר אתם מלינם עליו.<\/b> אֶת הָאֲחֵרִים הַשּׁוֹמְעִים אֶתְכֶם מִתְלוֹנְנִים:", "rashi_en": "בשר לאכל FLESH TO EAT— but it does not add as it does in the next phrase לִשְׂבֹּעַ, “to satisfaction”; the Torah thus teaches us a rule of conduct — that one should not eat meat to satiety. And what did He see (what reason had He) that He made bread fall for them in the morning and flesh at evening? Because the bread they asked for was a proper thing to demand since it is impossible for a person to exist without bread; but meat they asked for improperly, for they had abundant cattle, and besides it was possible for them to exist without flesh. On this account He gave it to them at evening, at a time of (when it would cause them) trouble, a manner which was not favourable to them (Mekhilta; Yoma 75).<br><br>אשר אתם מלינים עליו means [YOUR MURMURINGS] WHICH YOU MAKE others who hear you murmuring MURMUR AGAINST HIM."}, {"ch": 16, "v": 9, "aliyah": 5, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ אֶֽל־אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל־כׇּל־עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִפְנֵ֣י יְהֹוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵיכֶֽם׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן אֱמַר לְכָל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל קְרִיבוּ קֳדָם יְיָ אֲרֵי <b>שְׁמִיעַן קֳדָמוֹהִי<\/b> יָת תֻּרְעֲמוּתְכוֹן:", "onk_en": "Then Moshe said to Aharon, “Say to the entire community of the B’nei Yisrael: Come near before Adonoy, for He has heard your complaints [<b>have been heard before Him<\/b>].”", "pj": "וַאֲמַר משֶׁה לְאַהֲרן אֵימַר לְכָל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל קְרִיבוּ קֳדָם יְיָ אֲרוּם שְׁמִיעַן קֳדָמוֹי יַת תּוּרְעֲמוּתְכוֹן", "pj_en": "Mosheh said to Aharon, Bid all the congregation of the sons of Israel draw nigh before the Lord; for your murmuring are heard before Him.", "tj": "", "tj_en": "", "rashi": "<b>קרבו.<\/b> לַמָּקוֹם שֶׁהֶעָנָן יֵרֵד:", "rashi_en": "קרבו APPROACH [BEFORE THE LORD] — to the place where the cloud will descend."}, {"ch": 16, "v": 10, "aliyah": 5, "heb": "וַיְהִ֗י כְּדַבֵּ֤ר אַהֲרֹן֙ אֶל־כׇּל־עֲדַ֣ת בְּנֵֽי־יִשְׂרָאֵ֔ל וַיִּפְנ֖וּ אֶל־הַמִּדְבָּ֑ר וְהִנֵּה֙ כְּב֣וֹד יְהֹוָ֔ה נִרְאָ֖ה בֶּעָנָֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲוָה כַּד מַלִיל אַהֲרֹן עִם כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל וְאִתְפְּנִיוּ לְמַדְבְּרָא וְהָא יְקָרָא דַיְיָ <b>אִתְגְלִי<\/b> בַּעֲנָנָא:", "onk_en": "As Aharon spoke to the entire community of the B’nei Yisrael, they turned toward to the desert, and behold the glory of Adonoy was visible [<b>revealed<\/b>] in the cloud.", "pj": "וַהֲוָה בְּמַלָלוּת אַהֲרן עִם כָּל כְּנִישְׁתָּא דְיִשְרָאֵל וְאִתְפְּנִיאוּ לְמַדְבְּרָא וְהָא יְקַר שְׁכִינְתָּא דַיְיָ אִתְגְּלֵי בַּעֲנַן יְקָרָא", "pj_en": "And it was while Aharon was speaking with all the congregation of Israel that they turned towards the desert, and, behold, the glory of the majesty of the Lord was revealed in the cloud of glory.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 11, "aliyah": 6, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying,", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake to Mosheh, saying", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 12, "aliyah": 6, "heb": "שָׁמַ֗עְתִּי אֶת־תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵהֶ֜ם לֵאמֹ֗ר בֵּ֤ין הָֽעַרְבַּ֙יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּבַבֹּ֖קֶר תִּשְׂבְּעוּ־לָ֑חֶם וִֽידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "<b>שְׁמִיעַ קֳדָמַי<\/b> יָת תֻּרְעֲמַת בְּנֵי יִשְׂרָאֵל מַלֵיל עִמְהוֹן לְמֵימַר בֵּין שִׁמְשַׁיָא תֵּיכְלוּן בִּסְרָא וּבְצַפְרָא תִּשְׂבְּעוּן לַחְמָא וְתִדְעוּן אֲרֵי אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "“I have heard the complaints of the B’nei Yisrael [<b>have been heard before Me<\/b>]. Speak to them saying, ‘Between evenings [afternoon] you will eat meat, and in the morning you will have your fill of bread, and you will know that I am Adonoy, your God.", "pj": "שְׁמִיעַ קֳדָמַי יַת תּוּרְעֲמוּת בְּנֵי יִשְרָאֵל מַלֵּיל עִמְהוֹן לְמֵימַר בֵּינֵי שִׁמְשְׁתָא תֵיכְלוּן בִּשְרָא וּבְצַפְרָא תֵיכְלוּן לַחְמָא וְתִנְדְּעוּן אֲרוּם אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "Hearing I have heard the murmurings of the sons of Israel before Me. Speak thou with them, saying, Between the evenings (suns) you shall eat flesh, and in the morning shall you eat bread, and shall know that I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 13, "aliyah": 6, "heb": "וַיְהִ֣י בָעֶ֔רֶב וַתַּ֣עַל הַשְּׂלָ֔ו וַתְּכַ֖ס אֶת־הַֽמַּחֲנֶ֑ה וּבַבֹּ֗קֶר הָֽיְתָה֙ שִׁכְבַ֣ת הַטַּ֔ל סָבִ֖יב לַֽמַּחֲנֶֽה׃", "onk": "וַהֲוָה בְרַמְשָׁא וּסְלֵיקַת סְלָיו וַחֲפַת יָת מַשְׁרִיתָא וּבְצַפְרָא הֲוַת <b>נְחָתַת<\/b> טַלָא סְחוֹר סְחוֹר לְמַשְׁרִיתָא:", "onk_en": "It was evening and quails rose up and covered the camp. In the morning there was a layer of dew [<b>descended<\/b>] around the camp.", "pj": "וַהֲוָה בְּרַמְשָׁא וּסְלִיקוּ פִּיסְיוֹנִין וַחֲפוֹי יַת מַשְׁרִיתָא וּבְצַפְרָא הֲוָת אֲנָחַת טַלָּא מִתְקַדְּשָׁא מִיתַקְנָא הֵי כְּפָתּוּרִין חֲזוֹר חֲזוֹר לְמַשְׁרִיתָא", "pj_en": "And it came to pass, that in the evening the pheasants came up and covered the camp; and in the morning there was a fall of holy dew, prepared as a table, round about the camp:", "tj": "", "tj_en": "", "rashi": "<b>השלו.<\/b> מִין עוֹף וְשָׁמֵן מְאֹד (יומא ע\"ה):<br><br><b>היתה שכבת הטל.<\/b> הַטַּל שׁוֹכֵב עַל הַמָּן, וּבְמָקוֹם אַחֵר הוּא אוֹמֵר (במדבר י\"א) \"וּבְרֶדֶת הַטַּל וְגוֹ'\", הַטַּל יוֹרֵד עַל הָאָרֶץ, וְהַמָּן יוֹרֵד עָלָיו, וְחוֹזֵר וְיוֹרֵד טַל עָלָיו, הֲרֵי הוּא כְּמֻנָּח בְּקֻפְסָא (יומא שם):", "rashi_en": "השליו THE QUAILS — a species of fowl which is very fatty (cf. Yoma 75b).<br><br>היתה שכבת הטל THERE WAS A LAYER OF DEW — Consequently the dew was lying upon the Manna. In another passage, however, it says, (Numbers 11:9) “And when the dew came down [upon the camp at night, the manna fell upon it]” and so there was dew under the Manna! Thus we see that the dew fell upon the ground and the Manna fell upon it, and then dew fell again upon this, and so it was as though it were carefully packed in a chest (Yoma 75b)."}, {"ch": 16, "v": 14, "aliyah": 6, "heb": "וַתַּ֖עַל שִׁכְבַ֣ת הַטָּ֑ל וְהִנֵּ֞ה עַל־פְּנֵ֤י הַמִּדְבָּר֙ דַּ֣ק מְחֻסְפָּ֔ס דַּ֥ק כַּכְּפֹ֖ר עַל־הָאָֽרֶץ׃", "onk": "וּסְלֵיקַת <b>נְחָתַת<\/b> טַלָא וְהָא עַל אַפֵּי מַדְבְּרָא דַעְדַק <b>מְקַלַף<\/b> דַעְדַק <b>כְּגִיר כִּ<\/b>גְלִידָא עַל אַרְעָא:", "onk_en": "The layer of dew [<b>that had fallen<\/b>] had risen, and behold, on the surface of the desert were thin [uncovered] [<b>peeled away<\/b>] flakes. It was as fine as [<b>gir, like<\/b>] frost on the ground.", "pj": "וּסְלִיקוּ עֲנָנַיָא וְאָחִיתוּ מַנָּא עִילַוֵי אֲנָחוּת טַלָא וַהֲוַת עַל אַנְפֵּי מַדְבְּרָא דְקִיק מְסַרְגֵּל דְּקִיק כִּגְלִידָא עַל אַרְעָא", "pj_en": "and the clouds ascended and caused manna to descend upon the dew; and there was upon the face of the desert a minute (substance) in lines, minute as the hoar frost upon the ground.", "tj": "כַּכְּפוֹרָא:", "tj_en": "As hoar frost.", "rashi": "<b>ותעל שכבת הטל וגו'.<\/b> כְּשֶׁהַחַמָּה זוֹרַחַת, עוֹלֶה הַטַּל שֶׁעַל הַמָּן לִקְרַאת הַחַמָּה, כְּדֶרֶךְ טַל עוֹלֶה לִקְרַאת הַחַמָּה; אַף אִם תְּמַלֵּא שְׁפוֹפֶרֶת שֶׁל בֵּיצָה טַל וְתִסְתֹּם אֶת פִּיהָ וְתַנִּיחָהּ בַחַמָּה הִיא עוֹלָה מֵאֵלֶיהָ בָּאֲוִיר. וְרַבּוֹתֵינוּ דָרְשׁוּ, שֶׁהַטַּל עוֹלֶה מִן הָאָרֶץ בָּאֲוִיר, וְכַעֲלוֹת שִׁכְבַת הַטָּל נִתְגַלָּה הַמָּן וְרָאוּ <b>והנה על פני המדבר וגו'<\/b>:<br><br><b>דק<\/b> – דָּבָר דַּק:<br><br><b>מחספס.<\/b> מְגֻלֶּה, וְאֵין דּוֹמֶה לוֹ בַּמִּקְרָא. וְיֵשׁ לוֹמַר מְחֻסְפָּס לְשׁוֹן חֲפִיסָה וּדְלוּסְקְמָא שֶׁבִּלְשׁוֹן מִשְׁנָה, כְּשֶׁנִּתְגַּלָּה מִשִּׁכְבַת הַטָּל רָאוּ שֶׁהָיָה דָּבָר דַּק מְחֻסְפָּס בְּתוֹכוֹ בֵּין שְׁתֵּי שִׁכְבוֹת הַטָּל. וְאֻנְקְלוֹס תִּרְגֵּם \"מְקַלַּף\", לְשׁוֹן מַחְשֹׂף הַלָּבָן:<br><br><b>ככפר.<\/b> כְּפוֹר יילי\"דא בְלַעַז, דַּעֲדַק כְּגִיר, \"כְּאַבְנֵי גִר\" (ישעיהו כ\"ז), וְהוּא מִין צֶבַע שָׁחֹר, כִּדְאָמְרִינַן גַּבֵּי כִּסּוּי הַדָּם \"הַגִּיר וְהַזַּרְנִיךְ\" (חולין פ\"ח). \"דַעְדַק כְּגִיר כִּגְלִידָא עַל אַרְעָא\" – דַּק הָיָה כְּגִיר וְשׁוֹכֵב מֻגְלָד כְּקֶרַח עַל הָאָרֶץ, וְכֵן פֵּרוּשׁוֹ: דַּק כַּכְּפֹר – שָׁטוּחַ, קָלוּשׁ וּמְחֻבָּר כִּגְלִיד. דַּק טינב\"ש בְּלַעַז, שֶׁהָיָה מַגְלִיד גֶּלֶד דַּק מִלְמַעְלָה; \"וּכְגִיר\" שֶׁתִּרְגֵּם אֻנְקְלוֹס תּוֹסֶפֶת הוּא עַל לְשׁוֹן הָעִבְרִית וְאֵין לוֹ תֵבָה בַּפָּסוּק:", "rashi_en": "ותעל שכבת הטל וגו׳ AND WHEN THE LAYER OF DEW WENT UP etc. — When the sun rose the dew which was lying upon the Manna ascended sunward, as is the manner of dew — that it ascends sunward; even if you were to fill an egg-shell with dew and close up its opening and place it in the sun, it (the egg-shell with the dew in it) will rise of its own accord into the air, (in consequence of the tendency of the dew to rise upwards). — But our Rabbis explained that these words imply that the dew rose from the ground into the air. — When the layer of dew went up the Manna became visible, and they looked, (cf. Midrash Tanchuma, Beshalach 20; Shemot Rabbah 38:4) והנה על המדבר דק AND BEHOLD, UPON THE SURFACE OF THE DESERT there was etc.<br><br>דק, a THIN object,<br><br>מחספס uncovered — and there is no other example of this word in the Scriptures. One may also explain מחספס as having the same meaning as חפיסה in (Mishna Bava Metzia 1:8) חפיסה ודלוסקמא, “a valise and chest”, in Mishnaic Hebrew, and the meaning would be, that when it became uncovered from the layer of dew they saw that there had been a thin object enclosed in it i. e. enclosed between the two layers of dew. Onkelos translates it by מקלף peeled (flaky), taking מחספס in the sense of, and from a similar root as, (Genesis 30:37) “peeling off (מחשף) the white”.<br><br>ככפר AS HOAR FORST — כפר is old French gelide. The Targum renders דק by דעדק כגיר, the word גיר occurring in (Isaiah 27:9) “גיר-stones” — this is a kind of black colour — just as we enumerate amongst the kinds of earth which may be used for covering the blood of a wild animal or bird after it has been slaughtered “powdered chalk (גיר) and orpiment” (Chullin 88b). Onkelos renders the entire phrase by “powdered like גיר, like hoar-frost upon the ground”, meaning that it was as fine as גיר and lay congealed as frost in the ground. This is therefore the meaning of דק ככפור: “spread out fine but yet one atom hanging to another like hoar-frost”. דק is old French tenuis — meaning that it formed a thin incrustation on top. The word וכגיר which Onkelos has in his translation is an addition to the Hebrew text, there being no word corresponding to it in the verse."}, {"ch": 16, "v": 15, "aliyah": 6, "heb": "וַיִּרְא֣וּ בְנֵֽי־יִשְׂרָאֵ֗ל וַיֹּ֨אמְר֜וּ אִ֤ישׁ אֶל־אָחִיו֙ מָ֣ן ה֔וּא כִּ֛י לֹ֥א יָדְע֖וּ מַה־ה֑וּא וַיֹּ֤אמֶר מֹשֶׁה֙ אֲלֵהֶ֔ם ה֣וּא הַלֶּ֔חֶם אֲשֶׁ֨ר נָתַ֧ן יְהֹוָ֛ה לָכֶ֖ם לְאׇכְלָֽה׃", "onk": "וַחֲזוֹ בְנֵי יִשְׂרָאֵל וַאֲמָרוּ גְבַר לַאֲחוּהִי מַנָא הוּא אֲרֵי לָא יְדָעוּ מָה הוּא וַאֲמַר משֶׁה לְהוֹן הוּא לַחְמָא דִי יְהַב יְיָ לְכוֹן לְמֵיכַל:", "onk_en": "The B’nei Yisrael saw it and said to one another, “It is a food,” for they did not know [exactly] what [kind] it was. Moshe said to them, “This is the bread that Adonoy is giving you to eat.", "pj": "וְחָמוּן בְּנֵי יִשְרָאֵל וַהֲווֹן תַּמְהִין וְאָמְרִין אֵינַשׁ לְחַבְרֵיהּ מַן הוּא אֲרוּם לָא יָדְעוּן מַה הוּא וַאֲמַר משֶׁה לְהוֹן הוּא לַחְמָא דְּאִצְטְנַא לְכוֹן מִן שֵׁירוּיָא בִּשְׁמֵי מְרוֹמָא וּכְדוּן יְהָבֵיהּ יְיָ לְכוֹן לְמֵיכַל", "pj_en": "And the sons of Israel beheld, and wondered, and said, a man to his companion, Man Hu? for they knew not what it was. And Mosheh said to them, It is the bread which hath been laid up for you from the beginning in the heavens on high, and now the Lord will give it you to eat.", "tj": "", "tj_en": "", "rashi": "<b>מן הוא.<\/b> הֲכָנַת מָזוֹן הוּא, כְּמוֹ \"וַיְמַן לָהֶם הַמֶּלֶךְ\" (דניאל א'):<br><br><b>כי לא ידעו מה הוא.<\/b> שֶׁיִּקְרָאוּהוּ בִשְׁמוֹ:", "rashi_en": "מן הוא means this is something prepared for food, as in (Daniel 1:5) “And the king appointed (וימן) for them,”.<br><br>כי לא ידעו מה הוא FOR THEY KNEW NOT WHAT IS WAS so that they could call it by its name."}, {"ch": 16, "v": 16, "aliyah": 6, "heb": "זֶ֤ה הַדָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהֹוָ֔ה לִקְט֣וּ מִמֶּ֔נּוּ אִ֖ישׁ לְפִ֣י אׇכְל֑וֹ עֹ֣מֶר לַגֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵיכֶ֔ם אִ֛ישׁ לַאֲשֶׁ֥ר בְּאׇהֳל֖וֹ תִּקָּֽחוּ׃", "onk": "דֵין פִּתְגָמָא דִי פַקֵיד יְיָ לְקוּטוּ מִנֵהּ גְבַר לְפוּם מֵיכְלֵהּ עֻמְרָא לְגֻלְגַלְתָּא מִנְיַן נַפְשָׁתֵיכוֹן גְבַר לְדִי בְמַשְׁכְּנֵהּ תִּסְבוּן:", "onk_en": "This is what Adonoy has commanded: Each man shall gather his requirement of food. An omer per person, according to the number of your people. shall each man take for those in his tent.”", "pj": "דֵּין פִּתְגָּמָא דְפַקֵּיד יְיָ לְקוּטוּ מִנֵיהּ גְבַר לְפוּם מֵיכְלֵיהּ עוּמְרָא לְגוּלְגַלְתָּא מִנְיַין נַפְשָׁתֵיכוֹן גְּבַר לְפוּם סְכוּם אִינְשֵׁי מַשְׁכְּנֵיהּ תִּסְבוּן", "pj_en": "This is the word which the Lord hath dictated: You are to gather of it, every man according to the number of your souls; every man according to the mouth of the number of the persons of his tabernacle, are you to take.", "tj": "", "tj_en": "", "rashi": "<b>עמר.<\/b> שֵׁם מִדָּה:<br><br><b>מספר נפשתיכם.<\/b> כְּפִי מִנְיַן נְפָשׁוֹת שֶׁיֵּשׁ לְאִישׁ בְּאָהֳלוֹ תִּקְּחוּ עֹמֶר לְכָל גֻּלְגֹּלֶת:", "rashi_en": "עמר — the name of a measure.<br><br>מספר נפשתיכם — The second half of the verse means ACCORDING TO (supply כ before מספר) THE NUMBER OF PERSONS WHOM A MAN HAS (איש לאשר being the same as אשר לאיש) IN HIS TENT SHALL YE TAKE AN OMER FOR EVERY HEAD (לַגֻּלגֹּלֶת the definite article with the ל having distributive force: each and every)."}, {"ch": 16, "v": 17, "aliyah": 6, "heb": "וַיַּעֲשׂוּ־כֵ֖ן בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽיִּלְקְט֔וּ הַמַּרְבֶּ֖ה וְהַמַּמְעִֽיט׃", "onk": "וַעַבָדוּ כֵן בְּנֵי יִשְׂרָאֵל וּלְקָטוּ דְאַסְגֵי וּדְאַזְעֵר:", "onk_en": "The B’nei Yisrael did so. They gathered it, some more, some less.", "pj": "וַעֲבָדוּ כֵן בְּנֵי יִשְרָאֵל וּלְקִיטוּ מַנָּא מַאן דְּמַסְגֵי וּמַאן דְּאַזְעֵיר", "pj_en": "And the sons of Israel did so, and gathered manna more or less;", "tj": "", "tj_en": "", "rashi": "<b>המרבה והממעיט.<\/b> יֵשׁ שֶׁלָּקְטוּ הַרְבֵּה וְיֵשׁ שֶׁלָּקְטוּ מְעַט, וּכְשֶׁבָּאוּ לְבֵיתָם מָדְדוּ בָעֹמֶר אִישׁ אִישׁ מַה שֶּׁלָּקְטוּ, וּמָצְאוּ שֶׁהַמַּרְבֶּה לִלְקֹט לֹא הֶעְדִּיף עַל עֹמֶר לַגֻּלְגֹּלֶת אֲשֶׁר בְּאָהֳלוֹ, וְהַמַּמְעִיט לִלְקֹט לֹא מָצָא חָסֵר מֵעֹמֶר לַגֻּלְגֹּלֶת; וְזֶהוּ נֵס גָּדוֹל שֶׁנַּעֲשָׂה בּוֹ:", "rashi_en": "המרבה והממעיט SOME MUCH, SOME LITTLE — There were some who gathered much and there were some who gathered little; and when they came home they measured it out by an Omer, each what he had gathered, and they then found that he who had gathered much had no excess over an Omer for each head that was in his tent, and that he who had gathered less did not find less than an Omer for each head, and this was a great miracle that was wrought in respect of it (the Manna)."}, {"ch": 16, "v": 18, "aliyah": 6, "heb": "וַיָּמֹ֣דּוּ בָעֹ֔מֶר וְלֹ֤א הֶעְדִּיף֙ הַמַּרְבֶּ֔ה וְהַמַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְפִֽי־אׇכְל֖וֹ לָקָֽטוּ׃", "onk": "וּכְלוֹ בְעוּמְרָא וְלָא אוֹתַר דְאַסְגֵי וּדְאַזְעֵר לָא חַסִיר גְבַר לְפוּם מֵיכְלֵהּ לְקָטוּ:", "onk_en": "However when they measured it with an omer, the one who had taken more had no extra, and the one who had taken less, was not lacking. They had gathered exactly enough for each one to eat.", "pj": "וְאָכִילוּ בְּעוּמְרָא לָא אִישְׁתַּיֵּיר מִן מְכִילְתָּא מַאן דְּאַסְגֵי לְמִלְקַט וּדְאַזְעֵר לְמִילְקַט לָא חָסֵר מִן מְכִילְתָּא גְּבַר לְפוּם מֵיכְלֵיהּ לְקִיטוּ", "pj_en": "but when they measured by the homer, nothing remained above the measure of him who had gathered much; and he who had gathered little, wanted nothing of the measure: every man according to the mouth of his eating, so they gathered.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 19, "aliyah": 6, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה אֲלֵהֶ֑ם אִ֕ישׁ אַל־יוֹתֵ֥ר מִמֶּ֖נּוּ עַד־בֹּֽקֶר׃", "onk": "וַאֲמַר משֶׁה לְהוֹן אֱנַשׁ לָא יַשְׁאַר מִנֵהּ עַד צַפְרָא:", "onk_en": "Moshe said to them, “Let no man leave any over until morning.”", "pj": "וַאֲמַר משֶׁה לְהוֹן גְּבַר לָא יְשַׁיֵּיר מִנֵּיהּ עַד צַפְרָא", "pj_en": "And Mosheh said to them, Let no man make a reserve of it till the morning.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 20, "aliyah": 6, "heb": "וְלֹא־שָׁמְע֣וּ אֶל־מֹשֶׁ֗ה וַיּוֹתִ֨רוּ אֲנָשִׁ֤ים מִמֶּ֙נּוּ֙ עַד־בֹּ֔קֶר וַיָּ֥רֻם תּוֹלָעִ֖ים וַיִּבְאַ֑שׁ וַיִּקְצֹ֥ף עֲלֵהֶ֖ם מֹשֶֽׁה׃", "onk": "וְלָא קַבִּילוּ מִן משֶׁה וְאַשְׁאָרוּ גֻבְרַיָא מִנֵהּ עַד צַפְרָא וּרְחֵשׁ רִיחֲשָׁא וּסְרִי וּרְגַז עֲלֵיהוֹן משֶׁה:", "onk_en": "They did not listen to [<b>accept<\/b>] Moshe, and some men left some over until morning. It became wormy and putrid, and Moshe was angry with them.", "pj": "וְלָא קַבִּילוּ מִן משֶׁה וְשַׁיְירוּ דָתָן וַאֲבִירָם גּוּבְרַיָיא חַיָיבַיָא מִנֵיהּ עַד צַפְרָא וְאַרְחֵשׁ מוֹרְנִין וּסְרֵי וּרְגַז עֲלֵיהוֹן משֶׁה", "pj_en": "But (some of them) hearkened not to Mosheh: Dathan and Abiram, men of wickedness, did reserve of it till the morning; but it produced worms and putrefied; and Mosheh was angry with them.", "tj": "", "tj_en": "", "rashi": "<b>ויותרו אנשים.<\/b> דָּתָן וַאֲבִירָם:<br><br><b>וירם תולעים.<\/b> לְשׁוֹן רִמָּה:<br><br><b>ויבאש.<\/b> הֲרֵי זֶה מִקְרָא הָפוּךְ, שֶׁבַּתְּחִלָּה הִבְאִישׁ וּלְבַסּוֹף הִתְלִיעַ, כָּעִנְיָן שֶׁנֶּאֱמַר \"וְלֹא הִבְאִישׁ וְרִמָּה לֹא הָיְתָה בּוֹ\", וְכֵן דֶּרֶךְ כָּל הַמַּתְלִיעִים (מכילתא):", "rashi_en": "ויותרו אנשים BUT SOME MEN LEFT OF IT — Dathan and Abiram (Shemot Rabbah 24:10; cf. Rashi on Exodus 2:13).<br><br>וירם תולעים AND IT BRED WORMS — the word וירם is of the same meaning and root as רִמָּה, worm.<br><br>ויבאש AND IT STANK — This is an inverted verse, because first it must have stunk and afterwards have become wormy, just as it is said, (v. 24) “And it did not stink and there was no worm therein — for this is the way of all things that become wormy (Mekhilta)."}, {"ch": 16, "v": 21, "aliyah": 6, "heb": "וַיִּלְקְט֤וּ אֹתוֹ֙ בַּבֹּ֣קֶר בַּבֹּ֔קֶר אִ֖ישׁ כְּפִ֣י אׇכְל֑וֹ וְחַ֥ם הַשֶּׁ֖מֶשׁ וְנָמָֽס׃", "onk": "וּלְקָטוּ יָתֵהּ בִּצְפַר בִּצְפָר גְבַר לְפוּם מֵיכְלֵהּ <b>וּמָה דְמִשְׁתָּאַר מִנֵהּ עַל אַפֵּי חַקְלָא<\/b> כַּד חֲמָא עֲלוֹהִי שִׁמְשָׁא פָּשָׁר:", "onk_en": "They gathered it each morning, each man according to what he would eat. [When] the sun became hot [<b>on that which remained from it upon the face of the field<\/b>], it melted.", "pj": "וַהֲווֹ מְלַקְטִין יָתֵיהּ מִן עִדַן צַפְרָא עַד אַרְבַּע שָׁעִין דְּיוֹמָא אֵינַשׁ לְפוּם מֵיכְלֵיהּ וּמִן אַרְבַּע שָׁעִין וּלְהָאֵל שָׁחִין שִׁימְשָׁא עִילוֹי וַהֲוָה שַׁיִיח וּמִתְעַבֵיד מַבּוּעִין דְּמַיִין וְנַגְדִין עַד יַמָא רַבָּא וְאַתְיָין חֵיוַן דַּכְיַין וּבְעִירָן וְשַׁתְיַין מִינֵהּ וַהֲווֹ בְּנֵי יִשְרָאֵל צַדְיַין וְאָכְלִין יַתְהוֹן", "pj_en": "And they gathered from the time of the dawn until the fourth hour of the day, every man according to his eating; but at the fourth hour, when the sun had waxed hot upon it, it liquefied, and made streams of water, which flowed away into the Great Sea; and wild animals that were clean, and cattle, came to drink of it, and the sons of Israel hunted, and ate them.", "tj": "הֲוָה שְׁיָיח:", "tj_en": "Became as streams.", "rashi": "<b>וחם השמש ונמס.<\/b> הַנִּשְׁאָר בַּשָּׂדֶה נַעֲשֶׂה נְחָלִים וְשׁוֹתִין מִמֶּנּוּ אַיָּלִים וּצְבָאִים, וְאֻמּוֹת הָעוֹלָם צָדִין מֵהֶם וְטוֹעֲמִים בָּהֶם טַעַם מָן, וְיוֹדְעִים מַה שִּׁבְחָן שֶׁל יִשְׂרָאֵל:<br><br><b>ונמס.<\/b> פָּשַׁר, לְשׁוֹן פּוֹשְׁרִים, עַל יְדֵי הַשֶּׁמֶשׁ מִתְחַמֵּם וּמַפְשִׁיר, דישטנ\"פריר בְּלַעַז, וְדֻגְמָתוֹ בְּסַנְהֶדְרִין בְּסוֹף ד' מִיתוֹת:", "rashi_en": "וחם השמש ונמס AND WHEN THE SUN WAXED HOT, IT MELTED — What was left in the field (outside the inhabited camp) melted and ran in streams; the harts and the roes drank therefrom, and the nations of the world hunted them and experienced through them the taste of the Manna, and thereby understood how great was Israel’s excellency (Mekhilta).<br><br>ונמס Onkelos translates by פָּשָׁר, having the same meaning as פושרים, tepid waters: through the sun it became warm and turned into tepid water; old French détemperer. An example of it (פשר) occurs in Treatise Sanhedrin at the end of the chapter that begins, ארבע מיתות‎ (Sanhedrin 67b)."}, {"ch": 16, "v": 22, "aliyah": 6, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> בַּיּ֣וֹם הַשִּׁשִּׁ֗י לָֽקְט֥וּ לֶ֙חֶם֙ מִשְׁנֶ֔ה שְׁנֵ֥י הָעֹ֖מֶר לָאֶחָ֑ד וַיָּבֹ֙אוּ֙ כׇּל־נְשִׂיאֵ֣י הָֽעֵדָ֔ה וַיַּגִּ֖ידוּ לְמֹשֶֽׁה׃", "onk": "וַהֲוָה בְּיוֹמָא שְׁתִיתָאָה לְקָטוּ לַחְמָא עַל חַד תְּרֵין תְּרֵין עֻמְרִין לְחָד וַאֲתוֹ כָּל רַבְרְבֵי כְנִשְׁתָּא וְחַוִיאוּ לְמשֶׁה:", "onk_en": "When the sixth day came, what they had gathered [was a] double [portion of] bread, two omers for each individual. All the leaders of the community came and told Moshe [about it].", "pj": "וַהֲוָה בְּיוֹמָא שְׁתִיתָאָה לְקָטוּ לְחֵם בְּכֵפְלָא תְּרֵין עוּמְרִין לְבַר נַשׁ חַד וְאָתוֹי כָּל רַבְרְבָנֵי כְנִשְׁתָּא וְתַנּוּ לְמשֶׁה", "pj_en": "And it came to pass on the sixth day they gathered double bread, two homers a man; and all the princes of the congregation came and told Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>לקטו לחם משנה.<\/b> כְּשֶׁמָּדְדוּ אֶת לְקִיטָתָם בְּאָהֳלֵיהֶם מָצְאוּ כִפְלַיִם, שְׁנֵי הָעֹמֶר לָאֶחָד. וּמִדְרַשׁ אַגָּדָה: לֶחֶם מִשְׁנֶה – מְשֻׁנֶּה, אוֹתוֹ הַיּוֹם נִשְׁתַּנָּה לְשֶׁבַח בְּרֵיחוֹ וְטַעְמוֹ (שם):<br><br><b>ויגידו למשה.<\/b> שְׁאָלוּהוּ מַה הַיּוֹם מִיּוֹמַיִם; וּמִכָּאן יֵשׁ לִלְמֹד שֶׁעֲדַיִן לֹא הִגִּיד לָהֶם מֹשֶׁה פָּרָשַׁת שַׁבָּת שֶׁנִּצְטַוָּה לוֹמַר לָהֶם וְהָיָה בַּיּוֹם הַשִּׁשִּׁי וְהֵכִינוּ וְגוֹ', עַד שֶׁשָּׁאֲלוּ מַה זֹּאת, אָמַר לָהֶם הוּא אֲשֶׁר דִּבֶּר ה' שֶׁנִּצְטַוֵּיתִי לוֹמַר לָכֶם, וְלְכָךְ עֲנָשׁוֹ הַכָּתוּב שֶׁאָמַר לוֹ עַד אָנָה מֵאַנְתֶּם, וְלֹא הוֹצִיאוֹ מִן הַכְּלָל:", "rashi_en": "לקטו לחם משנה THEY COLLECTED DOUBLE BREAD — when they measured in their tents what they had gathered they found it double — two Omers for each person (cf. Rashi on v. 5). (Rashi appears to supply אשר before לקטו: It came to pass on the sixth day, what they gathered אשר לַקטו, was double bread.) A Midrashic explanation is that משנה in לחם משנה signifies מְשֻׁנָּה different, changed, — that day it was changed for the better as regards its smell and its taste (Tanchuma Yashan).<br><br>ויגידו למשה AND THEY TOLD IT TO MOSES — They asked him, “How is this day different from other days?” — From this we may learn that Moses had not yet told them the section regarding the Sabbath which he had been commanded to say to them: (v. 5) “And it shall come to pass on the sixth day they shall prepare etc.” — he did not do this until they asked him, “What is this?” Then he said to them, (v. 23) “This is that which the Lord hath said” this is that which I was commanded to say to you previously, but I forgot to do so (Cf. Shemot Rabbah 25:10). On this account Scripture (God) punished him, in that He said to him, (v. 28) “How long will ye refuse [to keep my commandments]”, and He did not exclude him from the general body, by saying, “how long will they refuse etc.”"}, {"ch": 16, "v": 23, "aliyah": 6, "heb": "וַיֹּ֣אמֶר אֲלֵהֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהֹוָ֔ה שַׁבָּת֧וֹן שַׁבַּת־קֹ֛דֶשׁ לַֽיהֹוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר־תֹּאפ֞וּ אֵפ֗וּ וְאֵ֤ת אֲשֶֽׁר־תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְאֵת֙ כׇּל־הָ֣עֹדֵ֔ף הַנִּ֧יחוּ לָכֶ֛ם לְמִשְׁמֶ֖רֶת עַד־הַבֹּֽקֶר׃", "onk": "וַאֲמַר לְהוֹן הוּא דִי מַלִיל יְיָ שְׁבָתָא שְׁבַת קוּדְשָׁא <b>קֳדָם יְיָ<\/b> מְחָר יָת דִי אַתּוּן עֲתִידִין לְמֵפָא אֲפוֹ וְיָת דִי אַתּוּן עֲתִידִין לְבַשָׁלָא בַּשִׁילוּ וְיָת כָּל מוֹתָרָא אַצְנָעוּ לְכוֹן לְמַטָרָא עַד צַפְרָא:", "onk_en": "He said to them, “This is what Adonoy has said: Tomorrow is a [day of] rest, Adonoy’s [<b>a<\/b>] holy Shabbos [<b>before Adonoy<\/b>]. Bake what you want to bake, and cook what you want to cook, and whatever is left over, put aside for yourselves, to preserve it until the morning.”", "pj": "וַאֲמַר לְהוֹן משֶׁה הוּא דְמַלֵּיל יְיָ עֲבַדְתּוּן שַׁבָּא שַׁבַּת קוּדְשָׁא קֳדָם יְיָ לִמְחַר יַת דְּאַתּוּן צְרִיכִין לְמֵיפָא מְחַר אֵיפוּ יוֹמָא דֵין וְיַת דְּאַתּוּן צְרִיכִין לִמְבַשְׁלָא מְחַר בְּשִׁילוּ יוֹמָא דֵין וְיַת כָּל מַה דְּמִשְׁתַּיַּיר מִן מַה דִּי תֵיכְלוּן יוֹמָא דֵין אַצְנִיעוּ יָתֵיהּ וִיהֵי נְטִיר עַד צַפְרָא", "pj_en": "And Mosheh said to them, This which the Lord hath told you, do. Tomorrow is the rest of the holy Sabbath before the Lord: That which is needful to have to bake for tomorrow, bake today; and what is needful to boil for tomorrow, boil today: and all whatever remaineth of that which on eat today lay it up, and it shall be preserved until the morning.", "tj": "", "tj_en": "", "rashi": "<b>את אשר תאפו אפו.<\/b> מַה שֶּׁאַתֶּם רוֹצִים לֶאֱפוֹת בַּתַּנּוּר, אֵפוּ הַיּוֹם הַכֹּל לִשְׁנֵי יָמִים, וּמַה שֶּׁאַתֶּם צְרִיכִים לְבַשֵּׁל מִמֶּנּוּ בַּמַּיִם, בַּשְּׁלוּ הַיּוֹם. לְשׁוֹן אֲפִיָּה נוֹפֵל בְּלֶחֶם וּלְשׁוֹן בִּשּׁוּל בְּתַבְשִׁיל:<br><br><b>למשמרת.<\/b> לִגְנִיזָה:", "rashi_en": "את אשר תאפו אפו THAT WHICH YOU WOULD BAKE, BAKE whatever you wish to bake (cf. Onkelos: די אתון עתידין למפא and Rashi on אז ישיר משה) in the oven bake to-day — all that you will need for two days; and what you require to boil of it in water boil to-day. The expression baking applies to bread, (cf. Rashi on Genesis 40:1) and the expression boiling to a cooked dish.<br><br>למשמרת means as something put by (to be kept)."}, {"ch": 16, "v": 24, "aliyah": 6, "heb": "וַיַּנִּ֤יחוּ אֹתוֹ֙ עַד־הַבֹּ֔קֶר כַּאֲשֶׁ֖ר צִוָּ֣ה מֹשֶׁ֑ה וְלֹ֣א הִבְאִ֔ישׁ וְרִמָּ֖ה לֹא־הָ֥יְתָה בּֽוֹ׃", "onk": "וְאַצְנָעוּ יָתֵהּ עַד צַפְרָא כְּמָא דְפַקִיד משֶׁה וְלָא סְרִי וְרִיחֲשָׁא לָא הֲוָה בֵהּ:", "onk_en": "They put it aside until morning as Moshe had commanded. It did not turn putrid and there were no worms in it.", "pj": "וְאַצְנָעוּ יָתֵיהּ עַד צַפְרָא הֵיכְמָא דְפַקֵּיד משֶׁה וְלָא סְרִי וְרִיחֲשָׁא לָא הֲוָת בֵּיהּ", "pj_en": "And they laid it up until the morning, as Mosheh had directed them; and it did not corrupt, and no worm was in it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 25, "aliyah": 6, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ אִכְלֻ֣הוּ הַיּ֔וֹם כִּֽי־שַׁבָּ֥ת הַיּ֖וֹם לַיהֹוָ֑ה הַיּ֕וֹם לֹ֥א תִמְצָאֻ֖הוּ בַּשָּׂדֶֽה׃", "onk": "וַאֲמַר משֶׁה אִכְלוּהִי יוֹמָא דֵין אֲרֵי שַׁבְּתָא יוֹמָא דֵין <b>קֳדָם<\/b> יְיָ יוֹמָא דֵין לָא תַשְׁכְּחֻנֵהּ בְּחַקְלָא:", "onk_en": "Moshe said, “Eat it today, for today is Shabbos to [<b>before<\/b>] Adonoy. Today you will not find it [manna] in the field.", "pj": "וַאֲמַר משֶׁה אִכְלוּהוּ יוֹמָא דֵין אֲרוּם שַׁבְּתָא יוֹמָא דֵין קֳדָם יְיָ יוֹמָא דֵין לָא תִשְׁכְּחוּנֵיהּ בְּחַקְלָא", "pj_en": "And Mosheh said to them, Eat today, because this is the Sabbath day before the Lord. This day you will not find any in the field.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר משה אכלהו היום וגו'.<\/b> שַׁחֲרִית שֶׁהָיוּ רְגִילִין לָצֵאת וְלִלְקֹט בָּאוּ לִשְׁאֹל: \"אִם נֵצֵא אִם לָאו\", אָמַר לָהֶם אֶת שֶׁבְּיֶדְכֶם אִכְלוּ, לָעֶרֶב חָזְרוּ לְפָנָיו וּשְׁאָלוּהוּ מַהוּ לָצֵאת? אָמַר לָהֶם שַׁבָּת הַיּוֹם, רָאָה אוֹתָם דּוֹאֲגִים שֶׁמָּא פָסַק הַמָּן וְלֹא יֵרֵד עוֹד, אָמַר לָהֶם הַיּוֹם לֹא תִמְצָאוּהוּ, מַה תַּ\"לֹ הַיּוֹם? הַיּוֹם לֹא תִמְצָאוּהוּ אֲבָל מָחָר תִּמְצָאוּהוּ:", "rashi_en": "ויאמר משה אכלהו היום AND MOSES SAID, EAT THAT THIS DAY etc. — In the morning, when they had been accustomed to go forth and gather it, they came to enquire, “Shall we go out or not?” He replied to them, “What you have in your possession eat (אכלהו היום)”. In the evening they again came before him and asked him, “How is it now about going out?” He answered them, שבת היום “Today is the Sabbath”. He saw that they were worried believing perhaps the Manna had stopped and would not again fall; he therefore said to them, “Today ye shall not find it [in the field]”. What reason was there to say “Today”? — Today you will not find it, but tomorrow you will find it (Mekhilta)."}, {"ch": 16, "v": 26, "aliyah": 6, "heb": "שֵׁ֥שֶׁת יָמִ֖ים תִּלְקְטֻ֑הוּ וּבַיּ֧וֹם הַשְּׁבִיעִ֛י שַׁבָּ֖ת לֹ֥א יִֽהְיֶה־בּֽוֹ׃", "onk": "שִׁתָּא יוֹמִין תִּלְקְטֻנֵהּ וּבְיוֹמָא שְׁבִיעָאָה שַׁבְּתָא לָא יְהֵי בֵהּ:", "onk_en": "Six days you shall gather it, but the seventh day is Shabbos, there will be none on [that day].”", "pj": "שִׁתָּא יוֹמִין תִּלְקְטוּנֵיהּ וּבְיוֹמָא שְׁבִיעָאָה דְהוּא שַׁבְּתָא לָא יְהֵי בֵיהּ מַנָּא נָחִית", "pj_en": "Six days you shall gather, but on the seventh day, which is the Sabbath, no manna will come down.", "tj": "", "tj_en": "", "rashi": "<b>וביום השביעי שבת.<\/b> שַׁבָּת הוּא, הַמָּן <b>לא יהיה בו;<\/b> וְלֹא בָא הַכָּתוּב אֶלָּא לְרַבּוֹת יוֹם הַכִּפּוּרִים וְיָמִים טוֹבִים:", "rashi_en": "וביום השביעי שבת means but on the seventh day is a day of rest (supply the word הוא); and לא יהיה בו means the Manna shall not be on it; and this verse comes (is written) only to include the Day of Atonement and the Festivals [as being also days when no Manna would fall] (Mekhilta)."}, {"ch": 16, "v": 27, "aliyah": 6, "heb": "וַֽיְהִי֙ בַּיּ֣וֹם הַשְּׁבִיעִ֔י יָצְא֥וּ מִן־הָעָ֖ם לִלְקֹ֑ט וְלֹ֖א מָצָֽאוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲוָה בְּיוֹמָא שְׁבִיעָאָה נְפָקוּ מִן עַמָא לְמִלְקָט וְלָא אַשְׁכָּחוּ:", "onk_en": "When the seventh day came some of the people went out to gather, but they found none.", "pj": "וַהֲוָה בְּיוֹמָא שְׁבִיעָאָה נָפְקוּ מִן רַשִׁיעֵי עַמָּא לְמִילְקוֹט מַנָּא וְלָא אַשְׁכָּחוּ", "pj_en": "And it was that on the seventh day some of the wicked people went forth to gather manna, but they found none.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 28, "aliyah": 6, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֑ה עַד־אָ֙נָה֙ מֵֽאַנְתֶּ֔ם לִשְׁמֹ֥ר מִצְוֺתַ֖י וְתוֹרֹתָֽי׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עַד אֵימָתַי אַתּוּן מְסָרְבִין לְמִטַר פִּקוּדַי וְאוֹרָיָתַי:", "onk_en": "Adonoy said to Moshe, “How long will you refuse to keep My commandments and My teachings.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה עַד אֵימַת אַתּוּן מְסַרְבִין לְמִנְטוֹר פִּיקוּדַי וְאוֹרַיְיתָי", "pj_en": "And the Lord said to Mosheh, How long will ye refuse to keep My commandments and My laws?", "tj": "", "tj_en": "", "rashi": "<b>עד אנה מאנתם.<\/b> מְשַׁל הֶדְיוֹט הוּא \"בַּהֲדֵי הוּצָא לָקֵי כְרַבָּא\" – עַל יְדֵי הָרְשָׁעִים מִתְגַּנִּין הַכְּשֵׁרִין:", "rashi_en": "עד אנה מאנתם HOW LONG WILL YE REFUSE — A common proverb says: with the thorn the cabbage which is near it, is also stricken — through the wicked the good are brought into disgrace (cf. Rashi on v. 22) (Bava Kamma 92a)."}, {"ch": 16, "v": 29, "aliyah": 6, "heb": "רְא֗וּ כִּֽי־יְהֹוָה֮ נָתַ֣ן לָכֶ֣ם הַשַּׁבָּת֒ עַל־כֵּ֠ן ה֣וּא נֹתֵ֥ן לָכֶ֛ם בַּיּ֥וֹם הַשִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ&thinsp;<b>׀<\/b> אִ֣ישׁ תַּחְתָּ֗יו אַל־יֵ֥צֵא אִ֛ישׁ מִמְּקֹמ֖וֹ בַּיּ֥וֹם הַשְּׁבִיעִֽי׃", "onk": "חֲזוֹ אֲרֵי יְיָ יְהַב לְכוֹן שַׁבְּתָא עַל כֵּן הוּא יָהֵב לְכוֹן בְּיוֹמָא שְׁתִיתָאָה לְחֵם תְּרֵין יוֹמִין תִּיבוּ אֲנַשׁ תְּחוֹתוֹהִי לָא יִפּוֹק אֲנַשׁ מֵאַתְרֵהּ בְּיוֹמָא שְׁבִיעָאָה", "onk_en": "See, because Adonoy gave you the Shabbos, therefore He gave you on the sixth day bread for two days. Every man must remain in his place. No man may go out of his place on the seventh day.", "pj": "חָמוּן אֲרוּם יְיָ יְהַב לְכוֹן יַת שַׁבְּתָא בְּגִין כֵּן הוּא יָהִיב לְכוֹן בְּיוֹם שְׁתִיתָאָה לְחֵם לִתְּרֵין יוֹמִין שְׁרוֹן גְּבַר בְּאַתְרֵיהּ וְלָא תְטַלְטְלוּן מִדַּעַם מִרְשׁוּתָא לִרְשׁוּתָא בַּר מֵאַרְבָּעָה גַרְמִידֵי וְלָא יִפּוֹק אֵינַשׁ מֵאַתְרֵיהּ לְטַיְילָא לְבַר מִתְּרֵין אַלְפִין גַּרְמִידֵי בְּיוֹמָא שְׁבִיעָאָה", "pj_en": "Behold, because I have given you the Sabbath, I gave you on the sixth day bread for two days. Let every man abide in his Place, and not wander from one locality to another, beyond four yards; nor let any man go forth to walk beyond two thousand yards on the seventh day;", "tj": "", "tj_en": "", "rashi": "<b>ראו.<\/b> בְּעֵינֵיכֶם כִּי ה' בִּכְבוֹדוֹ מַזְהִיר אֶתְכֶם עַל הַשַּׁבָּת, שֶׁהֲרֵי נֵס נַעֲשֶׂה בְּכָל עֶרֶב שַׁבָּת לָתֵת לָכֶם לֶחֶם יוֹמַיִם:<br><br><b>שבו איש תחתיו.<\/b> מִכָּאן סָמְכוּ חֲכָמִים ד' אַמּוֹת לַיּוֹצֵא חוּץ לַתְּחוּם (ערובין נ\"א):<br><br><b>אל יצא איש ממקמו.<\/b> אֵלּוּ אַלְפַּיִם אַמָּה שֶׁל תְּחוּם שַׁבָּת (מכילתא), וְלֹא בִמְפֹרָשׁ – שֶׁאֵין תְּחוּמִין אֶלָּא מִדִּבְרֵי סוֹפְרִים – וְעִקָּרוֹ שֶׁל מִקְרָא עַל לוֹקְטֵי הַמָּן נֶאֱמַר:", "rashi_en": "ראו SEE with your very eyes (i. e. the word is used literally and not figuratively in the sense of “consider”) that the Lord in His glory (i. e. the Lord Himself) admonishes you regarding the Sabbath, for, behold, a miracle is performed for you on the eve of every Sabbath in that He gives you then bread for two days.<br><br>שבו איש תחתיו ABIDE YE EVERY MAN IN HIS PLACE (lit., beneath himself) — From here the Sages derived a support for the permission that a person who has gone beyond the Sabbath limit may move within a space of four cubits (Mekhilta; Eruvin 51a).<br><br>אל יצא איש ממקמו LET NO MAN GO OUT OF HIS PLACE — These are the 2,000 cubits of the Sabbath limit (Mekhilta); but this is not expressly mentioned here, because the command relating to the Sabbath limits is only an institution of the Sopherim. The text itself was really spoken about those who gathered the Manna (i. e., it does not constitute a prohibition regarding the Sabbath for all men and at all periods but was intended to forbid anyone to go out into the field to gather the Manna; cf. Sotah 30b)."}, {"ch": 16, "v": 30, "aliyah": 6, "heb": "וַיִּשְׁבְּת֥וּ הָעָ֖ם בַּיּ֥וֹם הַשְּׁבִעִֽי׃", "onk": "וְנָחוּ עַמָא בְּיוֹמָא שְׁבִיעָאָה:", "onk_en": "The people rested on the seventh day.", "pj": "וְנָחוּ עַמָּא בְּיוֹמָא שְׁבִיעָאָה", "pj_en": "for the people shall repose on the seventh day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 31, "aliyah": 6, "heb": "וַיִּקְרְא֧וּ בֵֽית־יִשְׂרָאֵ֛ל אֶת־שְׁמ֖וֹ מָ֑ן וְה֗וּא כְּזֶ֤רַע גַּד֙ לָבָ֔ן וְטַעְמ֖וֹ כְּצַפִּיחִ֥ת בִּדְבָֽשׁ׃", "onk": "וּקְרוֹ בֵית יִשְׂרָאֵל יָת שְׁמֵהּ מָן וְהוּא כְּבַר זְרַע גִדָא חִוָר וְטַעְמֵהּ כְּאִסְקְרֵיטָוָן בִּדְבָשׁ:", "onk_en": "The House of Yisrael named it [the food] man[na]. It was like white coriander seed, and it tasted like wafers in honey.", "pj": "וּקְרוֹן בֵּית יִשְרָאֵל יַת שְׁמֵיהּ מַנָּא וְהוּא כְּבַר זְרַע כּוּסְבַּר חֵיוַר וְטַעֲמֵיהּ כַּאֲשִׁישְׁיַין בִּדְבָשׁ", "pj_en": "And the house of Israel called the name of it Manna; and it was like the seed of coriander, white, and the taste of it like preparations of honey.", "tj": "כִּזְרַע דְּכוּסְבַּר חֵיוַר וְטַעֲמֵיהּ כְּשִׁפוּיָין בִּדְבָשׁ:", "tj_en": "Like the seed of coriander, and the taste of it like confections of honey.", "rashi": "<b>והוא כזרע גד לבן.<\/b> עֵשֶׂב שֶׁשְּׁמוֹ קול\"יינדר, וְזֶרַע שֶׁלּוֹ עָגֹל וְאֵינוֹ לָבָן, וְהַמָּן הָיָה לָבָן, וְאֵינוֹ נִמְשָׁל לְזֶרַע גַּד אֶלָּא לְעִנְיַן הָעִגּוּל, כְּזֶרַע גַּד הָיָה – וְהוּא לָבָן:<br><br><b>כצפיחת.<\/b> בָּצֵק שֶׁמְּטַגְּנִין אוֹתוֹ בִּדְבַשׁ, וְקוֹרִין לוֹ אִסְקְרִיטִין בִּלְשׁוֹן מִשְׁנָה (פסחים ל\"ז), וְהוּא תַּרְגּוּם שֶׁל אֻנְקְלוֹס:", "rashi_en": "והוא כזרע גד לבן AND IT WAS LIKE THE CORIANDER SEED, WHITE — a herb, the name of which is (in old French) coriandre; its seed is round and is not white, whilst the Manna was white. It follows therefore, that it is compared to coriander seed only in respect to its roundness — so that the meaning is: it was like coriander seed, and it was white (Yoma 75a).<br><br>כצפיחת LIKE FLAT CAKES — dough which is fried in honey. In the Mishnaic speech it is called אסקריטין (Pesachim 37a), and this is the translation of Onkelos here."}, {"ch": 16, "v": 32, "aliyah": 6, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַדָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהֹוָ֔ה מְלֹ֤א הָעֹ֙מֶר֙ מִמֶּ֔נּוּ לְמִשְׁמֶ֖רֶת לְדֹרֹתֵיכֶ֑ם לְמַ֣עַן&thinsp;<b>׀<\/b> יִרְא֣וּ אֶת־הַלֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְכֶם֙ בַּמִּדְבָּ֔ר בְּהוֹצִיאִ֥י אֶתְכֶ֖ם מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר משֶׁה דֵין פִּתְגָמָא דִי פַקִיד יְיָ מִלֵי עֻמְרָא מִנֵהּ לְמַטְרָא לְדָרֵיכוֹן בְּדִיל דְיֶחְזוּן יָת לַחְמָא דִי אוֹכָלִית יָתְכוֹן בְּמַדְבְּרָא בְּאַפָּקוּתִי יָתְכוֹן מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "Moshe said, “This is what Adonoy has commanded: Fill an omer [measure] with it to preserve it for your generations. That they may see the bread with which I fed you in the desert when I brought you out of the land of Egypt.”", "pj": "וַאֲמַר משֶׁה דֵּין פִּתְגָמָא דְפַקֵיד יְיָ לְאַצְנָעָא מְלֵי עוּמְרָא מִנֵּיהּ לְמַטָּרָא לְדָרֵיכוֹן מִן בִּגְלַל דְּיֶחְמוּן דָּרַיָא מְסַרְבַיָיא יַת לַחְמָא דְאוֹכְלִית יַתְכוֹן בְּמַדְבְּרָא בְּהַנְפָקוּתִי יַתְכוֹן מֵאַרְעָא דְמִצְרָיִם", "pj_en": "And Mosheh said, This is the thing which the Lord hath commanded to lay up of it a homer full to keep in your generations; that perverse generations may see the bread which you have eaten in the wilderness, in your coming forth out of the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>למשמרת.<\/b> לִגְנִיזָה:<br><br><b>לדרתיכם.<\/b> בִּימֵי יִרְמְיָהוּ; כְּשֶׁהָיָה יִרְמְיָהוּ מוֹכִיחָם לָמָּה אֵין אַתֶּם עוֹסְקִים בַּתּוֹרָה? וְהֵם אוֹמְרִים נַנִּיחַ מְלַאכְתֵּנוּ וְנַעֲסֹק בַּתּוֹרָה, מֵהֵיכָן נִתְפַּרְנֵס? הוֹצִיא לָהֶם צִנְצֶנֶת הַמָּן אָמַר לָהֶם אַתֶּם רְאוּ דְּבַר ה', שִׁמְעוּ לֹא נֶאֱמַר אֶלָּא רְאוּ, בָּזֶה נִתְפַּרְנְסוּ אֲבוֹתֵיכֶם, הַרְבֵּה שְׁלוּחִין יֵשׁ לוֹ לַמָּקוֹם לְהָכִין מָזוֹן לִירֵאָיו:", "rashi_en": "למשמרת means to put by.<br><br>לדרתיכם FOR YOUR GENERATIONS e. g., in the days of Jeremiah: when Jeremiah was rebuking them (the people), saying, “Why do you not engage yourselves with the Torah?”, and they answered him, “Shall we leave our work and engage ourselves with the Torah? From where shall we earn a living?”, he brought out to them the cruse of Manna and said to them, (Jeremiah 2:31) “[O Generation], see ye the thing of the Lord!” It is not said “Hear the word” but “See the thing”! — This thing is what your fathers were fed with. The Omnipresent God has many messengers (many means) to provide food for those who fear Him (Mekhilta)."}, {"ch": 16, "v": 33, "aliyah": 6, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל־אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְתֶן־שָׁ֥מָּה מְלֹֽא־הָעֹ֖מֶר מָ֑ן וְהַנַּ֤ח אֹתוֹ֙ לִפְנֵ֣י יְהֹוָ֔ה לְמִשְׁמֶ֖רֶת לְדֹרֹתֵיכֶֽם׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן סַב צְלוֹחִית חֲדָא וְהַב תַמָן מְלֵי עֻמְרָא מָן וְאַצְנַע יָתֵהּ <b>קֳדָם<\/b> יְיָ לְמַטְרָא לְדָרֵיכוֹן:", "onk_en": "Moshe said to Aharon, “Take a jar and put an omer full of manna in it, and place it before Adonoy to be preserved for your generations.”", "pj": "וַאֲמַר משֶׁה לְאַ
