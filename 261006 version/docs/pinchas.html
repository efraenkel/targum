בַתְרָא (דף קכ\"ב): אֶלְעָזָר הַכֹּהֵן הָיָה מְלֻבָּשׁ בְּאוּרִים וְתֻמִּים וְאוֹמֵר בְּרוּחַ הַקֹּדֶשׁ אִם שֵׁבֶט פְּלוֹנִי עוֹלֶה, תְּחוּם פְּלוֹנִי עוֹלֶה עִמּוֹ, וְהַשְּׁבָטִים הָיוּ כְתוּבִים בִּשְׁנֵים עָשָׂר פְּתָקִין וְי\"ב גְּבוּלִין בְּי\"ב פְּתָקִין, וּבְלָלוּם בַּקַּלְפִּי, וְהַנָּשִׂיא מַכְנִיס יָדוֹ לְתוֹכוֹ וְנוֹטֵל שְׁנַיִם פְּתָקִין, עוֹלֶה בְיָדוֹ פֶּתֶק שֶׁל שֵׁם שִׁבְטוֹ וּפֶתֶק שֶׁל גְּבוּל הַמְפֹרָשׁ לוֹ, וְהַגּוֹרָל עַצְמוֹ הָיָה צוֹוֵחַ וְאוֹמֵר אֲנִי הַגּוֹרָל עָלִיתִי לִגְבוּל פְּלוֹנִי לְשֵבֶט פְּלוֹנִי, שֶׁנֶּאֱמַר \"עַל פִּי הַגּוֹרָל\", וְלֹא נִתְחַלְּקָה הָאָרֶץ בְּמִדָּה, לְפִי שֶׁיֵּשׁ גְּבוּל מְשֻׁבָּח מֵחֲבֵרוֹ, אֶלָּא בְשׁוּמָא, בֵּית כֹּר רַע כְּנֶגֶד בֵּית סְאָה טוֹב, הַכֹּל לְפִי הַדָּמִים:", "rashi_en": "לרב תרבה נחלתו TO THE NUMEROUS THOU SHALT GIVE MORE INHERITANCE — To the tribe that had a numerous population they gave a large portion of land. Although the portions were not of equal area because, as we have now said, in all cases they assigned the portions according to the size of the tribe, yet they did so only by aid of the lot, but the lot fell by the utterance of the Holy Spirit, as is explained in Baba Batra 122a: Eleazar the Priest was clothed with the Urim and Thummim, and spake by the Holy Spirit, “If such-and-such a tribe comes up, such-and-such a territory shall come up with him”. The names of the tribes were written on twelve tablets, and those of twelve districts on twelve tablets. They mixed them in an urn, and the prince of a tribe inserted his hand in it and took out two tablets. There came up in his hand the tablet bearing the name of his tribe and the tablet relating to the district that had been declared by the Urim and Tummim to be intended for it. The lot, itself cried out, saying, “I, the lot, have come up for such-and-such a district for such-and-such a tribe”, as it is said, (v. 56) על פי הגורל by the mouth (utterance) of the lot [shall the possession thereof be divided]” (Midrash Tanchuma, Pinchas 6). The land was not divided by measurement alone because one district is superior to another but it was divided by estimating its fertility: a bad piece of land sufficient to sow a Kor was regarded as the equivalent of a good piece of land sufficient to sow a Seah (the thirtieth part of a Kor) — all depended upon the value of the soil."}, {"ch": 26, "v": 55, "aliyah": 3, "heb": "אַךְ־בְּגוֹרָ֕ל יֵחָלֵ֖ק אֶת־הָאָ֑רֶץ לִשְׁמ֥וֹת מַטּוֹת־אֲבֹתָ֖ם יִנְחָֽלוּ׃", "onk": "בְּרַם בְּעַדְבָא תִּתְפְּלֵג יָת אַרְעָא לִשְׁמָהָן שִׁבְטֵי אֲבָהַתְהוֹן יַחְסְנוּן:", "onk_en": "Only by lot should the land be divided, according to the names of their fathers’ tribes should they inherit it.", "pj": "בְּרַם בְּעַדְבִין תִּתְפְּלֵג אַרְעָא לִשְׁמָהָן שִׁבְטַיָא דְאַבְהַתְהוֹן יַחְסִינוּן", "pj_en": "Yet the land shall be divided by lots; according to the names of their fathers tribes they shall inherit.", "tj": "", "tj_en": "", "rashi": "<b>לשמות מטות אבתם.<\/b> אֵלּוּ יוֹצְאֵי מִצְרַיִם; שִׁנָּה הַכָּתוּב נַחֲלָה זוֹ מִכָּל הַנְּחָלוֹת שֶׁבַּתּוֹרָה, שֶׁכָּל הַנְּחָלוֹת הַחַיִּים יוֹרְשִׁים אֶת הַמֵּתִים וְכָאן מֵתִים יוֹרְשִׁים אֶת הַחַיִּים, כֵּיצַד? שְׁנֵי אַחִים מִיּוֹצְאֵי מִצְרַיִם שֶׁהָיוּ לָהֶם בָּנִים בְּבָאֵי הָאָרֶץ, לָזֶה אֶחָד וְלָזֶה שְׁלֹשָׁה, הָאֶחָד נָטַל חֵלֶק אֶחָד וְהַשְּׁלֹשָׁה נָטְלוּ שְׁלֹשָׁה, שֶׁנֶּאֱמַר לָאֵלֶּה תֵּחָלֵק הָאָרֶץ, חָזְרָה נַחֲלָתָן אֵצֶל אֲבִי אֲבִיהֶן וְחָלְקוּ הַכֹּל בְּשָׁוֶה, וְזֶהוּ שֶׁנֶּאֱמַר <b>לשמות מטות אבתם ינחלו<\/b> — שֶׁאַחַר שֶׁנָּטְלוּ הַבָּנִים, חִלְּקוּהָ לְפִי הָאָבוֹת שֶׁיָּצְאוּ מִמִּצְרַיִם, וְאִלּוּ מִתְּחִלָּה חִלְּקוּהָ לְמִנְיַן יוֹצְאֵי מִצְרַיִם לֹא הָיוּ נוֹטְלִין אֵלּוּ הָאַרְבָּעָה אֶלָּא שְׁנֵי חֲלָקִים, עַכְשָׁו נָטְלוּ אַרְבָּעָה חֲלָקִים (ספרי; בבא בתרא קי\"ז):<br><br><b>אך בגורל.<\/b> יָצְאוּ יְהוֹשֻׁעַ וְכָלֵב, וְכֵן הוּא אוֹמֵר \"וַיִּתְּנוּ לְכָלֵב אֶת חֶבְרוֹן כַּאֲשֶׁר דִּבֶּר מֹשֶׁה\" (שופטים א'), וְאוֹמֵר (יהושע י\"ט) \"עַל פִּי ה' נָתְנוּ לוֹ אֶת הָעִיר אֲשֶׁר שָׁאָל\" (ספרי):<br><br><b>מטות אבתם.<\/b> יָצְאוּ גֵרִים וַעֲבָדִים:", "rashi_en": "לשמות מטה אבתם ACCORDING TO THE NAMES OF THE TRIBES OF THEIR FATHERS [THEY SHALL INHERIT] — These (the fathers referred to) were they who came out of Egypt. — Scripture treated this inheritance differently to all other inheritances mentioned in the Torah, for in the case of all other inheritances the living become heirs to the dead, whilst here the dead become heirs to the living. How is this so? Two brothers who were of those who came out of Egypt who had sons at least twenty years old amongst those who came into the Land, one son to this and three to that, the one son took one portion, and the three took three portions, for it is said, (v. 53) “To these (enumerated in the census taken immediately before they entered Palestine) shall the land be divided”. Their inheritance (that of these four) returns to (is regarded as having belonged to) their fathers’ father, and they (the two brothers who have four sons between them), divide equally. This is what is stated, “according to the names of the tribes of their fathers they shall inherit” — that after the sons have received they divide it according to the fathers who came out of Egypt. If, however, they had straightway divided it according to the number of those who came out of Egypt these four would have taken only two portions, whilst now they take four portions (Bava Batra 117a; Sifrei Bamidbar 132:1).<br><br>אך בגורל — Joshua and Caleb are excepted from this method of division (since אך is a limiting term) and so indeed it states, (Judges 1:20) “And they gave Hebron to Caleb as Moses had said” (cf. Rashi on Numbers XlV. 24), and it further states, (Joshua 19:50) “According to the command of the Lord they gave him (Joshua) the city which he had asked” (Sifrei Bamidbar 132:3).<br><br>מטות אבתם THE TRIBES OF THEIR FATHERS — Consequently proselytes and slaves were excepted (Sifrei Bamidbar 132:4)."}, {"ch": 26, "v": 56, "aliyah": 3, "heb": "עַל־פִּי֙ הַגּוֹרָ֔ל תֵּחָלֵ֖ק נַחֲלָת֑וֹ בֵּ֥ין רַ֖ב לִמְעָֽט׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עַל פּוּם עַדְבָא תִּתְפְּלֵג אַחֲסַנְתְּהוֹן בֵּין סַגִּיאֵי לִזְעִירֵי:", "onk_en": "By word of the lottery should their inheritance be divided, with regard to whether they are many or few.”", "pj": "עַל פּוּם עַדְבִין תִּתְפְּלֵג אַחְסַנְתְּהוֹן בֵּין סַגִיאֵי לִזְעִירֵי", "pj_en": "Their heritage shall be divided by lots, whether great or small.", "tj": "", "tj_en": "", "rashi": "<b>על פי הגורל.<\/b> הַגּוֹרָל הָיָה מְדַבֵּר, כְּמוֹ שֶׁפֵּרַשְׁתִּי, מַגִּיד שֶׁנִּתְחַלְּקָה בְרוּחַ הַקֹּדֶשׁ {לְכָךְ נֶאֱמַר (יהושע י\"ט) \"עַל פִּי ה'\"}:", "rashi_en": "על פי הגורל ACCORDING TO (more lit., by the mouth of) THE LOT [SHALL THE POSSESSION BE DIVIDED] — The lot itself spoke as I have already explained; this tells us that the division took place by the Holy Spirit (Midrash Tanchuma, Pinchas 6)."}, {"ch": 26, "v": 57, "aliyah": 3, "heb": "וְאֵ֨לֶּה פְקוּדֵ֣י הַלֵּוִי֮ לְמִשְׁפְּחֹתָם֒ לְגֵרְשׁ֗וֹן מִשְׁפַּ֙חַת֙ הַגֵּ֣רְשֻׁנִּ֔י לִקְהָ֕ת מִשְׁפַּ֖חַת הַקְּהָתִ֑י לִמְרָרִ֕י מִשְׁפַּ֖חַת הַמְּרָרִֽי׃", "onk": "וְאִלֵּין מִנְיָנֵי לֵוָאֵי לְזַרְעֲיַתְהוֹן לְגֵרְשׁוֹן זַרְעִית גֵּרְשׁוֹן לִקְהָת זַרְעִית קְהָת לִמְרָרִי זַרְעִית מְרָרִי:", "onk_en": "These are the numbered ones of the Levites by their families: The Gershonite family of Gershon, the Kehosite family of Kehos, [and] the Merorite family of Merori.", "pj": "וְאִלֵין סְכוּמֵי לֵיוָאֵי לִגְנִיסַתְהוֹן לְגֵרְשׁוֹן גְנִיסַת גֵרְשׁוֹן לִקְהָת גְנִיסַת קְהָת לִמְרָרִי גְנִיסַת מְרָרִי", "pj_en": "But these are the names of the Levites after their families, the families of Gershon, Kehath, Merari. _", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 58, "aliyah": 3, "heb": "אֵ֣לֶּה&thinsp;<b>׀<\/b> מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַלִּבְנִ֜י מִשְׁפַּ֤חַת הַֽחֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַמַּחְלִי֙ מִשְׁפַּ֣חַת הַמּוּשִׁ֔י מִשְׁפַּ֖חַת הַקׇּרְחִ֑י וּקְהָ֖ת הוֹלִ֥ד אֶת־עַמְרָֽם׃", "onk": "אִלֵּין זַרְעֲיַת לֵוִי זַרְעִית לִבְנִי זַרְעִית חֶבְרוֹן זַרְעִית מַחְלִי זַרְעִית מוּשִׁי זַרְעִית קֹרַח וּקְהָת אוֹלִיד יָת עַמְרָם:", "onk_en": "These are the families of Levi: the Livnite family, the Chevronite family, the Machlite family, the Mushite family, and the Korchite family; Kehos’ son was Amram.", "pj": "אִלֵין גְנִיסַת לֵיוָאֵי גְנִיסַת לִבְנִי גְנִיסַת חֶבְרוֹן גְנִיסַת מַחְלִי גְנִיסַת מוּשִׁי גְנִיסַת קרַח וּקְהָת אוֹלִיד יַת עַמְרָם", "pj_en": "These are the families of the Levites: the family of Lebni, Hebron, Maheli, Mushi, Korach. And Kehath begat Amram;", "tj": "", "tj_en": "", "rashi": "<b>אלה משפחת לוי.<\/b> חָסֵר כָּאן מִשְׁפְּחוֹת הַשִּׁמְעִי וְהָעָזִּיאֵלִי וּקְצָת מִן הַיִּצְהָרִי:", "rashi_en": "אלה משפחת לוי THESE ARE THE FAMILIES OF LEVI — there are missing here the families of Shimei and Uzziel and part of that of Jizhar (cf. Exodus 6:16 ff. and Rashi on v. 13)."}, {"ch": 26, "v": 59, "aliyah": 3, "heb": "וְשֵׁ֣ם&thinsp;<b>׀<\/b> אֵ֣שֶׁת עַמְרָ֗ם יוֹכֶ֙בֶד֙ בַּת־לֵוִ֔י אֲשֶׁ֨ר יָלְדָ֥ה אֹתָ֛הּ לְלֵוִ֖י בְּמִצְרָ֑יִם וַתֵּ֣לֶד לְעַמְרָ֗ם אֶֽת־אַהֲרֹן֙ וְאֶת־מֹשֶׁ֔ה וְאֵ֖ת מִרְיָ֥ם אֲחֹתָֽם׃", "onk": "וְשׁוּם אִתַּת עַמְרָם יוֹכֶבֶד בַּת לֵוִי דִילֵדַת יָתַהּ לְלֵוִי בְּמִצְרָיִם וִילֵדַת לְעַמְרָם יָת אַהֲרֹן וְיָת משֶׁה וְיָת מִרְיָם אֲחָתְהוֹן:", "onk_en": "The name of Amram’s wife was Yocheved, daughter of Levi, whom [her mother] bore to Levi in Egypt. She bore to Amram, Aharon, Moshe, and their sister Miriam.", "pj": "וְשׁוּם אִתַּת עַמְרָם יוֹכֶבֶד בְּרַת לֵוִי דִילֵידַת לְלֵוִי בְּמֵיעַלְהוֹן בְּמִצְרַיִם בֵּינֵי שׁוּרַיָא וִילֵידַת לְעַמְרָם יַת אַהֲרן וְיַת משֶׁה וְיַת מִרְיָם אֲחַתְהוֹן", "pj_en": "and the name of Amram's wife was Jokebed, a daughter of Levi, who was born to Levi when they had come into Mizraim, within the walls; and she bare to Amram Aharon, and Mushe, and Miriam their sister.", "tj": "", "tj_en": "", "rashi": "<b>אשר ילדה אתה ללוי במצרים.<\/b> לֵדָתָהּ בְּמִצְרַיִם וְאֵין הוֹרָתָהּ בְּמִצְרַיִם, כְּשֶׁנִּכְנְסוּ לְתוֹךְ הַחוֹמָה יְלָדַתָּה, וְהִיא הִשְׁלִימָה מִנְיַן שִׁבְעִים, שֶׁהֲרֵי בִפְרָטָן אֵי אַתָּה מוֹצֵא אֶלָּא שִׁשִּׁים וָתֵשַׁע:", "rashi_en": "אשר ילדה אתה ללוי במצרים WHOM HER MOTHER BORE TO LEVI IN EGYPT — she was born in Egypt but was not conceived in Egypt; when they came “between the walls” (within the confines of Egypt), she gave birth to her, and she (Jochebed) made up the number of seventy; because in the enumeration of them (Genesis 46:8—27) you will find only sixty-nine (Numbers Rabbah 13:20; cf. Rashi Genesis 46:15)."}, {"ch": 26, "v": 60, "aliyah": 3, "heb": "וַיִּוָּלֵ֣ד לְאַהֲרֹ֔ן אֶת־נָדָ֖ב וְאֶת־אֲבִיה֑וּא אֶת־אֶלְעָזָ֖ר וְאֶת־אִיתָמָֽר׃", "onk": "וְאִתְיְלִיד לְאַהֲרֹן יָת נָדָב וְיָת אֲבִיהוּא יָת אֶלְעָזָר וְיָת אִיתָמָר:", "onk_en": "To Aharon were borne, Nadav and Avihu, Elozor and Isamar.", "pj": "וְאִתְיְלִיד לְאַהֲרן יַת נָדָב וְיַת אֲבִיהוּא יַת אֶלְעָזָר וְיַת אִיתָמָר", "pj_en": "And to Aharon were born Nadab and Abihu, Elazar and Ithamar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 61, "aliyah": 3, "heb": "וַיָּ֥מׇת נָדָ֖ב וַאֲבִיה֑וּא בְּהַקְרִיבָ֥ם אֵשׁ־זָרָ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּמִית נָדָב וַאֲבִיהוּא בְּקָרוֹבֵהוֹן אֶשָּׁתָא נוּכְרֵתָא קֳדָם יְיָ:", "onk_en": "Nadav and Avihu died when they offered a forbidden fire before Adonoy.", "pj": "וּמִיתוּ נָדָב וַאֲבִיהוּא בִּקְרוֹבֵיהוֹן אֵישָׁתָא נוּכְרֵיתָא מִן תַּפְיַין קֳדָם יְיָ", "pj_en": "But Nadab and Abihu died when they offered the strange fire from the hearth-pots before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 62, "aliyah": 3, "heb": "וַיִּהְי֣וּ פְקֻדֵיהֶ֗ם שְׁלֹשָׁ֤ה וְעֶשְׂרִים֙ אֶ֔לֶף כׇּל־זָכָ֖ר מִבֶּן־חֹ֣דֶשׁ וָמָ֑עְלָה כִּ֣י&thinsp;<b>׀<\/b> לֹ֣א הׇתְפָּקְד֗וּ בְּתוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא־נִתַּ֤ן לָהֶם֙ נַחֲלָ֔ה בְּת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וַהֲווֹ מִנְיָנֵיהוֹן עַשְׂרִין וּתְלָתָא אַלְפִין כָּל דְּכוּרָא מִבַּר יַרְחָא וּלְעֵלָּא אֲרֵי לָא אִתְמְנִיאוּ בְּגוֹ בְנֵי יִשְׂרָאֵל אֲרֵי לָא אִתְיְהִיבַת לְהוֹן אַחֲסָנָא בְּגוֹ בְנֵי יִשְׂרָאֵל:", "onk_en": "They numbered twenty-three thousand, for all males from one month and older. They were not counted among Bnei Yisroel, since no inheritance was given to them among Bnei Yisroel.", "pj": "וַהֲווֹ סְכוּמְהוֹן עַשְרִין וּתְלָתָא אַלְפִין כָּל דְכוּרָא מִבַּר יַרְחָא וּלְעֵילָא אֲרוּם לָא אִתְמְנִיאוּ בְּגוֹ בְּנֵי יִשְרָאֵל אֲרוּם לָא אִתְיְהִיבַת לְהוֹן אַחְסָנָא בְּגוֹ בְּנֵי יִשְרָאֵל", "pj_en": "And the number of them (the Levites) was twenty-three thousand, every male from a month old, and upward; for they were not reckoned among the children of Israel, as no possession was given them among the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>כי לא התפקדו בתוך בני ישראל.<\/b> לִהְיוֹת נִמְנִין בְּנֵי עֶשְׂרִים שָׁנָה, מַה טַּעַם? <b>כי לא נתן להם נחלה<\/b>, וְהַנִּמְנִין מִבֶּן עֶשְׂרִים שָׁנָה הָיוּ בְנֵי נַחֲלָה, שֶׁנֶּאֱמַר \"אִישׁ לְפִי פְקֻדָיו יֻתַּן נַחֲלָתוֹ\":", "rashi_en": "כי לא התפקדו בתוך בני ישראל FOR THEY WERE NOT NUMBERED AMONGST THE CHILDREN OF ISRAEL, that they should also be numbered from twenty years old and upwards. What was the reason that they were not numbered from twenty years old?  כי לא נתן להם נחלה BECAUSE NO INHERITANCE WAS TO BE GIVEN THEM, while those who were counted from twenty years old were persons who were recipients of an inheritance, as it is said, (v. 54) “to everyone shall his inheritance be given according to those that were numbered of them”, (consequently the Levites had to form a different group for the census).\n"}, {"ch": 26, "v": 63, "aliyah": 3, "heb": "אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְאֶלְעָזָ֖ר הַכֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת־בְּנֵ֤י יִשְׂרָאֵל֙ בְּעַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃", "onk": "אִלֵּין מִנְיָנֵי משֶׁה וְאֶלְעָזָר כַּהֲנָא דִּי מְנוֹ יָת בְּנֵי יִשְׂרָאֵל בְּמֵישְׁרַיָּא דְמוֹאָב עַל יַרְדֵּנָא דִירֵחוֹ:", "onk_en": "This is the census of Moshe and Elozor the <i>kohein<\/i> who counted the Bnei Yisroel in the plains of Moav, at Yardein Yereicho.", "pj": "אִלֵין סְכוּמֵי משֶׁה וְאֶלְעָזָר כַּהֲנָא דִי סְכָמוּן יַת בְּנֵי יִשְרָאֵל בְּמֵישְׁרַיָא דְמוֹאָב עַל יַרְדְנָא דִירֵיחוֹ", "pj_en": "These are the numbers when Mosheh and Elazar the priest numbered the sons of Israel in the plains of Moab, by Jordan, (over against) Jericho.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 64, "aliyah": 3, "heb": "וּבְאֵ֙לֶּה֙ לֹא־הָ֣יָה אִ֔ישׁ מִפְּקוּדֵ֣י מֹשֶׁ֔ה וְאַהֲרֹ֖ן הַכֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת־בְּנֵ֥י יִשְׂרָאֵ֖ל בְּמִדְבַּ֥ר סִינָֽי׃", "onk": "וּבְאִלֵּין לָא הֲוָה גְבַר מִמִּנְיָנֵי משֶׁה וְאַהֲרֹן כַּהֲנָא דִּי מְנוֹ יָת בְּנֵי יִשְׂרָאֵל בְּמַדְבְּרָא דְסִינָי:", "onk_en": "Among this [census] there was no man who had been included in the census of Moshe and Aharon the <i>kohein,<\/i> who had counted Bnei Yisroel in the wilderness of Sinai,", "pj": "וּבָאִלֵין לָא הֲוָה גְבַר מִן סְכוּמֵי משֶׁה וְאַהֲרן כַּהֲנָא דִי סְכָמוּן יַת בְּנֵי יִשְרָאֵל בְּמַדְבְּרָא דְסִינָי", "pj_en": "And among them was not a man of the numbers when Mosheh and Aharon the priest took the sum of the children of Israel in the wilderness of Sinai,", "tj": "", "tj_en": "", "rashi": "<b>ובאלה לא היה איש וגו'.<\/b> אֲבָל עַל הַנָּשִׁים לֹא נִגְזְרָה גְזֵרַת הַמְרַגְּלִים, לְפִי שֶׁהֵן הָיוּ מְחַבְּבוֹת אֶת הָאָרֶץ, הָאֲנָשִׁים אוֹמְרִים נִתְּנָה רֹאשׁ וְנָשׁוּבָה מִצְרַיְמָה, וְהַנָּשִׁים אוֹמְרוֹת \"תְּנָה לָּנוּ אֲחֻזָּה\", לְכָךְ נִסְמְכָה פָרָשַׁת בְּנוֹת צְלָפְחָד לְכָאן (תנחומא):", "rashi_en": "  ובאלה לא היה איש וגו׳ BUT AMONG THESE THERE WAS NO MAN [OF THEM WHOM MOSES AND AARON NUMBERED] — no man; but the decree consequent upon the incident of the spies had not been enacted upon the women, because they held the Promised Land dear. The men had said, (Numbers 14:4) “Let us appoint a chief and return to Egypt”, while the women said, (Numbers 27:4) “Give us a possession in the Land”. On this account, too, the chapter regarding the daughters of Zelophehad follows immediately here (Sifrei Bamidbar 133:1)."}, {"ch": 26, "v": 65, "aliyah": 3, "heb": "כִּֽי־אָמַ֤ר יְהֹוָה֙ לָהֶ֔ם מ֥וֹת יָמֻ֖תוּ בַּמִּדְבָּ֑ר וְלֹא־נוֹתַ֤ר מֵהֶם֙ אִ֔ישׁ כִּ֚י אִם־כָּלֵ֣ב בֶּן־יְפֻנֶּ֔ה וִיהוֹשֻׁ֖עַ בִּן־נֽוּן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי אֲמַר יְיָ לְהוֹן מֵמַת יְמוּתוּן בְּמַדְבְּרָא וְלָא אִשְׁתְּאַר מִנְהוֹן אֱנַשׁ אֶלָּהֵן כָּלֵב בַּר יְפֻנֶּה וִיהוֹשֻׁעַ בַּר נוּן:", "onk_en": "because Adonoy said to them that they would die in the desert. No one was left with the exception of Kaleiv, son of Yefuneh and Yehoshua, son of Nun.", "pj": "אֲרוּם אָמַר יְיָ לְהוֹן מְמַת יְמוּתוּן בְּמַדְבְּרָא וְלָא אִשְׁתַּיֵיר לְהוֹן אֱנַשׁ אֱלָהֵן כָּלֵב בַּר יְפוּנֶה וִיהוֹשֻׁעַ בַּר נוּן", "pj_en": "because the Lord had said that dying they should die in the wilderness; and none of them remained except Kaleb bar Jephunneh, and Jehoshua bar Nun.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 1, "aliyah": 3, "heb": "וַתִּקְרַ֜בְנָה בְּנ֣וֹת צְלׇפְחָ֗ד בֶּן־חֵ֤פֶר בֶּן־גִּלְעָד֙ בֶּן־מָכִ֣יר בֶּן־מְנַשֶּׁ֔ה לְמִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן־יוֹסֵ֑ף וְאֵ֙לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔יו מַחְלָ֣ה נֹעָ֔ה וְחׇגְלָ֥ה וּמִלְכָּ֖ה וְתִרְצָֽה׃", "onk": "וְקָרֵיבָא בְּנַת צְלָפְחָד בַּר חֵפֶר בַּר גִּלְעָד בַּר מָכִיר בַּר מְנַשֶּׁה לְזַרְעֲיַת מְנַשֶּׁה בַּר יוֹסֵף וְאִלֵּין שְׁמָהַת בְּנָתֵיהּ מַחְלָה נוֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה:", "onk_en": "And they approached—the daughters of Tzelofchad, son of Cheifer, son of Gil’ad, son of Machir, son of Menashe, of the families of Menashe the son of Yoseif. The names of his daughters were: Machlah, No’ah, Choglah, Milkah and Sirtzah.", "pj": "וּקְרִיבַן לְבֵי דִינָא בְּנַת צְלָפְחָד בַּר חֵפֶר בַּר גִלְעָד בַּר מָכִיר בַּר מְנַשֶׁה לִגְנִיסַת מְנַשֶׁה בַּר יוֹסֵף כַּד שָׁמְעַן דְאַרְעָא מִתְפַּלְגָא לְדִכְרִין וּרְחִיצוּ בְּרַחֲמֵי מָארֵי עַלְמָא וְאִלֵין שְׁמָהַת בְּנָתָא מַחְלָה נוֹעָה חָגְלָה מִלְכָּה וְתִרְצָה", "pj_en": "And the daughters of Zelophehad bar Hepher, bar Gilead, bar Makir, bar Menasheh, of the family of Menasheh bar Joseph, when they heard that the land was to be divided to the males, came to the beth din, trusting in the compassions of the Lord of the world. And these are the names of the daughters, Mahelah, Nohah, Hogela, Milchah, and Thirzah.", "tj": "", "tj_en": "", "rashi": "<b>למשפחת מנשה בן יוסף.<\/b> לָמָּה נֶאֱמַר? וַהֲלֹא כְבָר נֶאֱמַר <b>בן מנשה<\/b>, אֶלָּא לוֹמַר לְךָ, יוֹסֵף חִבֵּב אֶת הָאָרֶץ, שֶׁנֶּאֱמַר \"וְהַעֲלִתֶם אֶת עַצְמֹתַי\" וְגוֹ' (בראשית נ') וּבְנוֹתָיו חִבְּבוּ אֶת הָאָרֶץ, שֶׁנֶּאֱמַר תְּנָה לָּנוּ אֲחֻזָּה, וּלְלַמֶּדְךָ שֶׁהָיוּ כֻלָּם צַדִּיקִים, שֶׁכָּל מִי שֶׁמַּעֲשָׂיו וּמַעֲשֵׂה אֲבוֹתָיו סְתוּמִים וּפֵרֵט לְךָ הַכָּתוּב בְּאֶחָד מֵהֶם לְיַחֲסוֹ לְשֶׁבַח, הֲרֵי זֶה צַדִּיק בֶּן צַדִּיק, וְאִם יִחֲסוֹ לִגְנַאי, כְּגוֹן \"בָּא יִשְׁמָעֵאל בֶּן נְתַנְיָה בֶּן אֱלִישָׁמָע\" (מלכים ב כ\"ה), בְיָדוּעַ שֶׁכָּל הַנִּזְכָּרִים עִמּוֹ רְשָׁעִים הָיוּ (ספרי):<br><br><b>מחלה נעה וגו'.<\/b> וּלְהַלָּן (במדבר לו יא) הוּא אוֹמֵר \"וַתִּהְיֶינָה מַחְלָה תִרְצָה\", מַגִּיד שֶׁכֻּלָּן שְׁקוּלוֹת — זוֹ כְּזוֹ, לְפִיכָךְ שִׁנָּה אֶת סִדְרָן (שם):", "rashi_en": "למשפחת מנשה בן יוסף OF THE FAMILIES OF MANASSEH THE SON OF JOSEPH — Why is this stated? Has it not already been said בן מנשה, and consequently we know that they belonged to the family of Manasseh the son of Joseph?! But it is to suggest the following idea to you: Just as Joseph held the Promised Land dear, as it is said, (Genesis 50:25) “And ye shall bring my bones up (to Palestine) from hence”, so, too, his daughters held the Land dear, as it is said, (v. 4) “Give us an inheritance”; and further to teach you that they were righteous all of them (everyone here mentioned in the pedigree), for in every case where a person’s doings and his ancestors’ doings are nowhere plainly described and Scripture somewhere enters into the details of the pedigree in respect to one of them, tracing his genealogy back to someone worthy of praise, it is evident that the person in question is himself a righteous man and a son of a righteous father. But if it gives his genealogy in connection with something deserving of reprobation, — as, for example, (2 Kings 25:25) “Ishmael the son of Nethanian the son of Elishama came … and smote Gedaliah”, then it is quite certain that all who are mentioned in connection with him were wicked people (Sifrei Bamidbar 133:1).<br><br>מחלה נעה וגו׳ MAHLAH, NOAH, etc. — But further on (Numbers 36:11) states, “And Mahlah, Tirzah were” (changing the position of the names within the verse): this is to tell you that they all were of equal worth one with another, and on this account it is that it changed their order (i.e. the order of their names) (Sifrei Bamidbar 133:2)."}, {"ch": 27, "v": 2, "aliyah": 3, "heb": "וַֽתַּעֲמֹ֜דְנָה לִפְנֵ֣י מֹשֶׁ֗ה וְלִפְנֵי֙ אֶלְעָזָ֣ר הַכֹּהֵ֔ן וְלִפְנֵ֥י הַנְּשִׂיאִ֖ם וְכׇל־הָעֵדָ֑ה פֶּ֥תַח אֹֽהֶל־מוֹעֵ֖ד לֵאמֹֽר׃", "onk": "וְקָמָא קֳדָם משֶׁה וְקֳדָם אֶלְעָזָר כַּהֲנָא וְקֳדָם רַבְרְבַיָּא וְכָל כְּנִשְׁתָּא בִּתְרַע מַשְׁכַּן זִמְנָא לְמֵימָר:", "onk_en": "They stood before Moshe and before Elozor the <i>kohein,<\/i> and before the princes, and the entire community at the Tent of Meeting entrance, saying:", "pj": "וְקָמָא קֳדָם משֶׁה בָּתַר דְקָמוּ קֳדָם אֶלְעָזָר כַּהֲנָא וּקְדָם רַבְרְבַיָא וְכָל כְּנִישְׁתָּא לִתְרַע מַשְׁכַּן זִמְנָא לְמֵימָר", "pj_en": "And they stood before Mosheh, after that they had stood before Elazar the priest, the princes, and all the congregation, at the door of the tabernacle of ordinance, saying:", "tj": "", "tj_en": "", "rashi": "<b>לפני משה ולפני אלעזר.<\/b> מַגִּיד שֶׁלֹּא עָמְדוּ לִפְנֵיהֶם אֶלָּא בִשְׁנַת הָאַרְבָּעִים, אַחַר שֶׁמֵּת אַהֲרֹן (שם):<br><br><b>לפני משה.<\/b> וְאַחַר כָּךְ לִפְנֵי אֶלְעָזָר? אֶפְשַׁר אִם מֹשֶׁה לֹא יָדַע אֶלְעָזָר יוֹדֵעַ? אֶלָּא סָרֵס הַמִּקְרָא וְדָרְשֵׁהוּ, דִּבְרֵי רַבִּי יֹאשִׁיָּה. אַבָּא חָנָן מִשּׁוּם רַבִּי אֶלְעָזָר אוֹמֵר, בְּבֵית הַמִּדְרָשׁ הָיוּ יוֹשְׁבִים וְעָמְדוּ לִפְנֵי כֻלָּם (שם; בבא בתרא קי\"ט):", "rashi_en": "לפני משה ולפני אלעזר [AND THEY STOOD] BEFORE MOSES AND BEFORE ELEAZAR [THE PRIEST] — The fact that they approached Eleazar the Priest and not Aaron tells us that they stood before them (i.e., that this incident occurred) only (not earlier than) in the fortieth year after the Exodus indeed after Aaron’s death (Sifrei Bamidbar 133:3).<br><br>לפני משה [THEY STOOD] BEFORE MOSES, and afterwards לפני אלעזר, BEFORE ELEAZAR?! But is it possible if Moses did not know what reply to give them that Eleazar should know it? Rather, invert the words of the text and so expound it (before Eleazar and before Moses). This is the view of R. Josiah; but Abba Chanan said in the name of R. Eleazar that this inversion is unnecessary: they were sitting in the House of Study and they (the daughters of Zelophehad) stood before all of those who were present (Sifrei Bamidbar 133:3; Bava Batra 119b and Rashi on Numbers 9:6)."}, {"ch": 27, "v": 3, "aliyah": 3, "heb": "אָבִ֘ינוּ֮ מֵ֣ת בַּמִּדְבָּר֒ וְה֨וּא לֹא־הָיָ֜ה בְּת֣וֹךְ הָעֵדָ֗ה הַנּוֹעָדִ֛ים עַל־יְהֹוָ֖ה בַּעֲדַת־קֹ֑רַח כִּֽי־בְחֶטְא֣וֹ מֵ֔ת וּבָנִ֖ים לֹא־הָ֥יוּ לֽוֹ׃", "onk": "אָבוּנָא מִית בְּמַדְבְּרָא וְהוּא לָא הֲוָה בְּגוֹ כְנִשְׁתָּא דְּאִזְדַּמָּנוּ עַל יְיָ בִּכְנִשְׁתָּא דְקֹרַח אֲרֵי בְחוֹבֵיהּ מִית וּבְנִין לָא הֲווֹ לֵיהּ:", "onk_en": "“Our father died in the wilderness, but he was not among the group that banded together against Adonoy, in the company of Korach, but he died because of his own sin without leaving any sons.", "pj": "אָבוּנָא מִית בְּמַדְבְּרָא וְהוּא לָא הֲוָה בְּגוֹ כְנִישְׁתָּא דְמִתְרַעֲמוּ וּדְאִזְדַמְנוּ לְמָרָדָא עַל יְיָ בִּכְנִישְׁתָּא דְקרַח אֲרוּם בְּחוֹבֵיהּ מִית וְלָא אַחְטֵי לְחוֹרָנִין וּבְנִין דִכְרִין לָא הֲווֹ לֵיהּ", "pj_en": "Our father died in the wilderness, but he was not among the congregation who murmured and gathered to rebel against the Lord in the congregation of Korach, but died for his own sin; nor made he others to sin; but he had no male children.", "tj": "", "tj_en": "", "rashi": "<b>והוא לא היה וגו'.<\/b> לְפִי שֶׁהָיוּ בָאוֹת לוֹמַר <b>בחטאו מת<\/b>, נִזְקְקוּ לוֹמַר לֹא בְחֵטְא מִתְלוֹנְנִים וְלֹא בַעֲדַת קֹרַח שֶׁהִצּוּ עַל הַקָּבָּ\"ה הָיָה, אֶלָּא בְּחֶטְאוֹ לְבַדּוֹ מֵת, וְלֹא הֶחֱטִיא אֶת אֲחֵרִים עִמּוֹ (ספרי); רַבִּי עֲקִיבָא אוֹמֵר מְקוֹשֵׁשׁ עֵצִים הָיָה וְרַבִּי שִׁמְעוֹן אוֹמֵר מִן הַמַּעְפִּילִים הָיָה (שבת צ\"ו):", "rashi_en": "והוא לא היה וגו׳ AND HE WAS NOT [… IN THE CONGREGATION OF KORAH] — Because they intended to state בחטתו מת, that HE DIED IN HIS OWN SIN they felt compelled to say he had taken no part in the sin of those who murmured, nor had he been in the congregation of Korah who incited the people against the Holy One, blessed be He (cf. Sifrei Bamidbar 133:3, Bava Batra 118b), but he had died through his own sin only, and had not made others to sin with him (Sifrei Bamidbar 133:3). — As regards what this sin was, R. Akiba said that he was the man who gathered sticks on the Sabbath day (Numbers 15:32); R. Simeon said that he was one of those who presumed to disobey God’s command (Numbers 14:44) (Shabbat 96b)."}, {"ch": 27, "v": 4, "aliyah": 3, "heb": "לָ֣מָּה יִגָּרַ֤ע שֵׁם־אָבִ֙ינוּ֙ מִתּ֣וֹךְ מִשְׁפַּחְתּ֔וֹ כִּ֛י אֵ֥ין ל֖וֹ בֵּ֑ן תְּנָה־לָּ֣נוּ אֲחֻזָּ֔ה בְּת֖וֹךְ אֲחֵ֥י אָבִֽינוּ׃", "onk": "לְמָא <b>יִתְמְנַע<\/b> שְׁמָא דְאָבוּנָא מִגּוֹ זַרְעִיתֵיהּ אֲרֵי לֵית לֵיהּ בָּר הַב לָנָא אַחֲסָנָא בְּגוֹ אֲחֵי אָבוּנָא:", "onk_en": "Why should the name of our father be omitted [<b>held back<\/b>] from his family because he did not have a son? Give us a possession [of land] among our father’s brothers.”", "pj": "לְמָא יִתְמְנַע שׁוּם אָבוּנָא מִגוֹ גְנִיסְתֵּיהּ אֲרוּם לֵית לֵיהּ בִּיר דְכַר אִין לֵית אֲנַן חֲשִׁיבִין כְּבִיר וְאִימָן כְּנַטְרָא יָיבָם תִּסַב אִימָן חוֹלַק אָבוּנָן וְחוּלַק אָחָא דַאֲבוּנָן וְאִין אֲנַן חֲשִׁיבִין כְּבִיר הַב לָן אַחְסָנָא בְגוֹ אֲחֵי אָבוּנָן", "pj_en": "Why should the name of our father be taken away from among his family because he had not a male child? if we are not reckoned as a son, and our mother claim (or observe) the Jebam, our mother will take the portion of our father and of our father's brother. But if we be reckoned as a son, give us an inheritance among our father's brethren.", "tj": "", "tj_en": "", "rashi": "<b>למה יגרע שם אבינו.<\/b> אָנוּ בִּמְקוֹם בֵּן עוֹמְדוֹת, וְאִם אֵין הַנְּקֵבוֹת חֲשׁוּבוֹת זֶרַע, תִּתְיַבֵּם אִמֵּנוּ לְיָבָם (בבא בתרא קיט):<br><br><b>כי אין לו בן.<\/b> הָא אִם הָיָה לוֹ בֵן, לֹא הָיוּ תוֹבְעוֹת כְּלוּם, מַגִּיד שֶׁחַכְמָנִיּוֹת הָיוּ (שם):", "rashi_en": "למה יגרע שם אבינו WHY SHOULD THE NAME OF OUR FATHER BE DONE AWAY — We stand in the place of male children, and if you say that females are not regarded as issue in respect to inheritance, then our mother should marry her deceased husband’s brother (cf. Deuteronomy 25:5, 6) (Bava Batra 119b).<br><br>כי אין לו בן [WHY SHOULD OUR FATHER'S NAME BE DONE AWAY WITH] BECAUSE HE HATH NO SON — Thus it follows that if he had had a son they would have made no claim of any kind: this tells us that they were women of intelligence (Sifrei Bamidbar 133:4; cf. Bava Batra 119b). "}, {"ch": 27, "v": 5, "aliyah": 3, "heb": "וַיַּקְרֵ֥ב מֹשֶׁ֛ה אֶת־מִשְׁפָּטָ֖<big>ן<\/big> לִפְנֵ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְקָרֵב משֶׁה יָת דִּינְהֶן קֳדָם יְיָ:", "onk_en": "Moshe brought their case before Adonoy.", "pj": "דֵין חַד מִן אַרְבָּעָה דִינִין דִי עָלוּ קֳדָם משֶׁה נְבִיָא וּסְכַם יַתְהוֹן עַל דַעְתָּא דִלְעֵיל מִנְהוֹן דִינֵי מָמוֹנָא וּמִנְהוֹן דִינֵי נַפְשָׁתָא בְּדִינֵי מָמוֹנָא הֲוָה משֶׁה זָרִיז וּבְדִינֵי נַפְשָׁתָא הֲוָה משֶׁה מָתוּן וּבְאִלֵין וּבְאִלֵין אָמַר משֶׁה לָא שְׁמָעִית מִן בִּגְלַל לְמַלְפָא רֵישֵׁי סַנְהֶדְרֵי דְיִשְרָאֵל דַעֲתִידִין לְמֵיקוּם מִן בַּתְרֵיהּ דִי הֲווֹן זְרִיזִין לְדִינֵי מָמוֹנָא וּמְתוּנִין לְדִינֵי נַפְשָׁתָא וְלָא יְבַהֲתוּן לִמְשַׁיְילָא דִינָא דְמִתְקַשֵׁי לְהוֹן אֲרוּם משֶׁה דַהֲוָה רַבְּהוֹן דְיִשְרָאֵל צָרִיךְ דְיֵימַר לָא שְׁמָעִית בְּגִין כֵּן קְרַב משֶׁה יַת דִינְהֵין קֳדָם יְיָ", "pj_en": "This is one of the four cases of judgment brought before Mosheh the prophet, and which he resolved in the manner above said. Of them some were judgments, &amp;c. And Mosheh brought their cause before the Lord.", "tj": "דין חד מן ארבעה דינין וכו' כתוב לעיל גבי מקושש וגבי טמא נפש: וְאַקְרֵיב משֶׁה יַת סֵדֶר דִינֵיהוֹן קֳדָם יְיָ:", "tj_en": "", "rashi": "<b>ויקרב משה את משפטן.<\/b> נִתְעַלְּמָה הֲלָכָה מִמֶּנּוּ, וְכָאן נִפְרַע עַל שֶׁנָּטַל עֲטָרָה לוֹמַר (דברים א') \"וְהַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם תַּקְרִבוּן אֵלַי\"; דָּ\"אַ — רְאוּיָה הָיְתָה פָרָשָׁה זוֹ לְהִכָּתֵב עַל יְדֵי מֹשֶׁה, אֶלָּא שֶׁזָּכוּ בְנוֹת צְלָפְחָד וְנִכְתְּבָה עַל יָדָן (בבא בתרא קי\"ט; סנהדרין ח'):", "rashi_en": "\n ויקרב משה את משפטן AND MOSES BROUGHT THEIR CAUSE [BEFORE THE LORD] — The law on this subject escaped him (Sanhedrin 8a). Here he received punishment because he had assumed a “crown” (he had set himself up as the supreme judge) by saying, (Deuteronomy 1:17) “And the cause that is too hard for you ye shall bring to me”. Another explanation: This chapter ought to have been written by Moses (i.e., like most laws in the Torah it should have been spoken to the people by Moses without his having waited until some incident made its promulgation necessary), but for the fact that the daughters of Zelophehad had so much merit, it was therefore written through them (it was their complaint which gave occasion for stating it) (Bava Batra 119a; Sanhedrin 8a)."}, {"ch": 27, "v": 6, "aliyah": 4, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying:", "pj": "וַאֲמַר יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 7, "aliyah": 4, "heb": "כֵּ֗ן בְּנ֣וֹת צְלׇפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָהֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּת֖וֹךְ אֲחֵ֣י אֲבִיהֶ֑ם וְהַֽעֲבַרְתָּ֛ אֶת־נַחֲלַ֥ת אֲבִיהֶ֖ן לָהֶֽן׃", "onk": "יָאוּת בְּנַת צְלָפְחָד מְמַלְּלָן מִתַּן תִּתֵּן לְהוֹן אֲחוּדַת אַחֲסָנָא בְּגוֹ אֲחֵי אֲבוּהֶן וְתַעֲבַר יָת אַחֲסָנַת אֲבוּהֶן לְהֵן:", "onk_en": "“Tzelofchad’s daughters speak justly, give them a hereditary portion of land among their father’s brothers, and transfer the inheritance of their father to them.", "pj": "יָאוּת בְּנַת צְלָפְחָד מְמַלְלָן כְּתִיבָא הֲוַות דָא קֳדָמַי אֱלָהֵין זַכָּאִין לְאִיתְאַמְרָא עַל יְדֵיהֶן מִתֵּן תִּתֵּן לְהוֹן יֵרְתוּ וְאַחְסָנָא בְּגוֹ אֲחֵי אֲבוּהֶן וְתַעֲבֵר יַת אַחְסָנַת אֲבוּהֶן לְהוֹן", "pj_en": "The daughters of Zelophehad have fitly spoken: this hath been written before Me: but they are worthy that it be said of them, Give them possession and inheritance among the brethren of their father, and make over their father's possession unto them.", "tj": "", "tj_en": "", "rashi": "<b>כן בנות צלפחד דברת.<\/b> כְּתַרְגּוּמוֹ, \"יָאוּת\" — כָּךְ כְּתוּבָה פָרָשָׁה זוֹ לְפָנַי בַּמָּרוֹם, מַגִּיד שֶׁרָאֲתָה עֵינָן מַה שֶּׁלֹּא רָאֲתָה עֵינוֹ שֶׁל מֹשֶׁה (תנחומא):<br><br><b>כן בנות צלפחד דברת.<\/b> יָפֶה תָּבְעוּ, אַשְׁרֵי אָדָם שֶׁהַקָּבָּ\"ה מוֹדֶה לִדְבָרָיו (ספרי):<br><br><b>נתן תתן.<\/b> שְׁנֵי חֲלָקִים, חֵלֶק אֲבִיהֶן שֶׁהָיָה מִיּוֹצְאֵי מִצְרַיִם, וְחֶלְקוֹ עִם אֶחָיו בְּנִכְסֵי חֵפֶר (בבא בתרא קי\"ח):<br><br><b>והעברת.<\/b> לְשׁוֹן עֶבְרָה הוּא בְּמִי שֶׁאֵינוֹ מַנִּיחַ בֵּן לְיָרְשׁוֹ. דָּ\"אַ — עַל שֵׁם שֶׁהַבַּת מַעֲבֶרֶת נַחֲלָה מִשֵּׁבֶט לְשֵׁבֶט, שֶׁבְּנָהּ וּבַעְלָהּ יוֹרְשִׁין אוֹתָהּ — שֶׁ\"לֹא תִסֹּב נַחֲלָה\" (במדבר ל\"ו) לֹא נִצְטַוָּה אֶלָּא לְאוֹתוֹ הַדּוֹר בִּלְבַד (בבא בתרא ק\"כ) — וְכֵן וְהַעֲבַרְתֶּם אֶת נַחֲלָתוֹ לְבִתּוֹ, בְּכֻלָּן הוּא אוֹמֵר \"וּנְתַתֶּם\" וּבַבַּת הוּא אוֹמֵר \"וְהַעֲבַרְתֶּם\":", "rashi_en": "כן בנות צלפחד דברת THE DAUGHTERS OF ZELOPHEHAD SPEAK RIGHT — Understand the word כן as the Targum does: יאות rightly, properly. God said: Exactly so is this chapter written before me on High (The Law has long since been fixed) (Sifrei Bamidbar 134:1). This tells us that their eye saw what Moses’ eye did not see. (They had a finer perception of what was just in the law of inheritance than Moses had.) (cf. Midrash Tanchuma, Pinchas 8).<br><br>כן בנות צלפחד דברת — “They have made a fair claim”. Happy is the person with whose words the Holy One, blessed be He, agrees (Sifrei Bamidbar 134:1). <br><br>נתן תתן lit., GIVING THOU SHALT GIVE [A POSSESSION OF AN INHERITANCE AMONGST THEIR FATHER’S BRETHREN] — This suggests: thou shalt give two portions, viz., the portion of their father (אחזת נחלה) who was one of those who came out of Egypt, and his portion that he should have had together with his brothers (נחלה בתוך אחי אביהם) in the property of his father Hefer (who also was one of those who left Egypt) (cf. Rashi on Numbers 26:55) (cf. Sifrei Bamidbar 134:1; Bava Batra 118b). <br><br>והעברת — This is an expression (also) denoting “wrath” and it is used here instead of a form of נתן found throughout the chapter to suggest that God’s wrath is directed against one who leaves no son to be his heir (Bava Batra 116a). Another explanation is that the form of העבר “causing to pass” is exceptionally used in the case of a daughter being her father’s heiress because a daughter as heiress ordinarily causes the inheritance to pass from one tribe to another tribe, since her son and her husband are her heirs (Sifrei Bamidbar 134:2; Bava Batra 147a), for it must be born in mind that the command (Numbers 36:7), “The inheritance shall not move from tribe to tribe” was laid only upon that generation (Bava Batra 120a). And so, for the same reason, we have this verb used in (v. 8): “Then ye shall cause his inheritance to pass to his daughter”, for you see that in all of them (the other cases mentioned here) it says, ונתתם, “and ye shall give” (vv. 9, 10, 11), but in the case of a daughter it says, והעברתם, “and ye shall cause it to pass”."}, {"ch": 27, "v": 8, "aliyah": 4, "heb": "וְאֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵאמֹ֑ר אִ֣ישׁ כִּֽי־יָמ֗וּת וּבֵן֙ אֵ֣ין ל֔וֹ וְהַֽעֲבַרְתֶּ֥ם אֶת־נַחֲלָת֖וֹ לְבִתּֽוֹ׃", "onk": "וְעִם בְּנֵי יִשְׂרָאֵל תְּמַלֵּל לְמֵימָר גְּבַר אֲרֵי יְמוּת וּבַר לֵית לֵיהּ וְתַעְבְּרוּן יָת אַחֲסַנְתֵּיהּ לִבְרַתֵּיהּ:", "onk_en": "Speak to Bnei Yisroel and tell them, that if a man dies and has no son, his hereditary property shall be transferred to his daughter.", "pj": "וְעִם בְּנֵי יִשְרָאֵל תְּמַלֵיל לְמֵימָר גְבַר אֲרוּם יְמוּת וּבִיר דְכַר לֵית לֵיהּ וְתַעֲבְרוּן יַת אַחְסַנְתֵּיהּ לִבְרַתֵּיהּ", "pj_en": "And when a son of Israel shall speak, and say, A man hath died without having a male child, then you shall make over his inheritance to his daughter:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 9, "aliyah": 4, "heb": "וְאִם־אֵ֥ין ל֖וֹ בַּ֑ת וּנְתַתֶּ֥ם אֶת־נַחֲלָת֖וֹ לְאֶחָֽיו׃", "onk": "וְאִם לֵית לֵיהּ בְּרַתָּא וְתִתְּנוּן יָת אַחֲסַנְתֵּיהּ לַאֲחוֹהִי:", "onk_en": "If he has no daughter, you shall give his hereditary property to his brothers.", "pj": "וְאִין לֵית לֵיהּ בְּרַתָּא וְתִתְּנוּן יַת אַחְסַנְתֵּיהּ לַאֲחוֹהִי", "pj_en": "if he have no daughter, you shall give his possession to his brothers:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 10, "aliyah": 4, "heb": "וְאִם־אֵ֥ין ל֖וֹ אַחִ֑ים וּנְתַתֶּ֥ם אֶת־נַחֲלָת֖וֹ לַאֲחֵ֥י אָבִֽיו׃", "onk": "וְאִם לֵית לֵיהּ אַחִין וְתִתְּנוּן יָת אַחֲסַנְתֵּיהּ לַאֲחֵי אֲבוּהִי:", "onk_en": "If he has no brothers, you shall give his hereditary property to his father’s brothers.", "pj": "וְאִין לֵית לֵיהּ אָחִין וְתִתְּנוּן יַת אַחְסַנְתֵּיהּ לְאָחוֹי מִן אָבוֹי", "pj_en": "if he have no brothers, you shall give his possession to the brethren of his father:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 27, "v": 11, "aliyah": 4, "heb": "וְאִם־אֵ֣ין אַחִים֮ לְאָבִיו֒ וּנְתַתֶּ֣ם אֶת־נַחֲלָת֗וֹ לִשְׁאֵר֞וֹ הַקָּרֹ֥ב אֵלָ֛יו מִמִּשְׁפַּחְתּ֖וֹ וְיָרַ֣שׁ אֹתָ֑הּ וְֽהָ֨יְתָ֜ה לִבְנֵ֤י יִשְׂרָאֵל֙ לְחֻקַּ֣ת מִשְׁפָּ֔ט כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִם לֵית אַחִין לַאֲבוּהִי וְתִתְּנוּן יָת אַחֲסַנְתֵּיהּ לְקָרִיבֵיהּ דְּקָרִיב לֵיהּ מִזַּרְעִיתֵיהּ וְיֵרַת יָתַהּ וּתְהֵי לִבְנֵי יִשְׂרָאֵל לִגְזֵרַת דִּין כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "If his father had no brothers, you shall give his hereditary property to the relative closest to him in his family who will then inherit it. This shall remain a decreed law for Bnei Yisroel, as Adonoy had commanded Moshe.”", "pj": "וְאִין לֵית לֵיהּ אָחִין לְאָבוֹי וְתִתְּנוּן יַת אַחְסַנְתֵּיהּ לְקָרִיבֵיהּ דְקָרִיב לֵיהּ מִגְנִיסַת אָבוֹי וְיֵרוּת יָתָהּ וּתְהֵי לִבְנֵי יִשְרָאֵל לְאַחְוָיַית גְזֵירַת דִין הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "but if his father had no brothers, then you shall give his possession to his kinsman who is nearest to him of his father's family to inherit. And this shall be the publication of a decree of judgment to the children of Israel, as the Lord hath commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>לשארו הקרב אליו ממשפחתו.<\/b> וְאֵין מִשְׁפָּחָה קְרוּיָה אֶלָּא מִצַּד הָאָב (שם ק\"ט):", "rashi_en": "לשארו הקרוב אליו ממשפחתו TO HIS KIN THAT IS NEXT TO HIM OF HIS FAMILY — The term משפחה used in connection with inheritance denotes kinship only on the father’s side (Sifrei Bamidbar 134:3; Bava Batra 119b)."}, {"ch": 27, "v": 12, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה עֲלֵ֛ה אֶל־הַ֥ר הָעֲבָרִ֖ים הַזֶּ֑ה וּרְאֵה֙ אֶת־הָאָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה סַק לְטוּרָא דַעֲבָרָאֵי הָדֵין וַחֲזֵי יָת אַרְעָא דִּי יְהָבִית לִבְנֵי יִשְׂרָאֵל:", "onk_en": "Adonoy said to Moshe: “Go up this Avarim Mountain and look at the land that I have given to Bnei Yisroel.", "pj": "וַאֲמַר יְיָ לְמשֶׁה סוֹק לְטַוְורָא דְעַבְרָאֵי הָדֵין וְחָמֵי יַת אַרְעָא דִיהָבִית לִבְנֵי יִשְרָאֵל", "pj_en": "And the Lord said to Mosheh, Go up to this mount, of Abaraee, and survey the land which I have given to the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>עלה אל הר העברים.<\/b> לָמָּה נִסְמְכָה לְכָאן? כֵּיוָן שֶׁאָמַר הַקָּבָּ\"ה נָתֹן תִּתֵּן לָהֶם, אָמַר אוֹתִי צִוָּה הַמָּקוֹם לְהַנְחִיל, שֶׁמָּא הֻתְּרָה הַגְּזֵרָה וְאֶכָּנֵס לָאָרֶץ? אָמַר לוֹ הַקָּבָּ\"ה גְּזֵרָתִי בִּמְקוֹמָהּ עוֹמֶדֶת. דָּ\"אַ — כֵּיוָן שֶׁנִּכְנַס מֹשֶׁה לְנַחֲלַת בְּנֵי גָד וּבְנֵי רְאוּבֵן שָׂמַח וְאָמַר, כִּמְדֻמֶּה שֶׁהֻתַּר לִי נִדְרִי; מָשָׁל לְמֶלֶךְ שֶׁגָּזַר עַל בְּנוֹ שֶׁלֹּא יִכָּנֵס לְפֶתַח פָּלָטִין שֶׁלּוֹ, נִכְנַס לַשַּׁעַר וְהוּא אַחֲרָיו, לֶחָצֵר וְהוּא אַחֲרָיו, לַטְּרַקְלִין וְהוּא אַחֲרָיו, כֵּיוָן שֶׁבָּא לִכָּנֵס לַקִּיטוֹן, אָמַר לוֹ בְּנִי מִכָּאן וָאֵילָךְ אַתָּה אָסוּר לִכָּנֵס (ספרי):", "rashi_en": "עלה אל הר העברים GO UP INTO [THIS] MOUNT ABARIM — Why does this follow immediately here? Because when the Holy One, blessed be He, said to Moses, (v. 7) “Thou shalt surely give them an inheritance in the land” he (Moses) said, “It is me that the Omnipresent has commanded to apportion the inheritance. Perhaps then the decree that I must die in the wilderness is annulled and I shall enter the Promised Land!” Whereupon God said to him, “My decree remains exactly as it was” (Midrash Tanchuma, Pinchas 9). — Another explanation: As soon as Moses entered into the territory of the sons of Gad and the sons of Reuben (the eastern side of the Jordan, which, having been assigned to these tribes, might be regarded as part of the Promised Land), he rejoiced, saying, “It seems to me that the vow regarding me has been annulled in my favour”. God, therefore, said to him, My decree remains exactly as it was. A parable! It may be compared to the case of a king who decreed against his son that he should not enter the door of his palace. He (the king) entered within the gate, and he (the son) went after him (without the father raising any objection); to the audience chamber, and he after him. But as soon as he was about to enter his sleeping-chamber (his private room) he said to him, “My son, from here and further on you may not go” (Sifrei Bamidbar 134:4)."}, {"ch": 27, "v": 13, "aliyah": 4, "heb": "וְרָאִ֣יתָה אֹתָ֔הּ וְנֶאֱסַפְתָּ֥ אֶל־עַמֶּ֖יךָ גַּם־אָ֑תָּה כַּאֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽיךָ׃", "onk": "וְתֶחֱזֵי יָתָהּ וְתִתְכְּנֵשׁ לְעַמָּיךְ אַף אָתְּ כְּמָא דִי אִתְכְּנִישׁ אַהֲרֹן אָחוּךְ:", "onk_en": "[After] you have seen it, you too will be gathered to your people, just as your brother Aharon was gathered.", "pj": "וְתֶחֱמֵי יָתָהּ וְתִתְכְּנֵישׁ לְעַמָךְ לְחוֹד אַנְתְּ הֵיכְמָא דְאִתְכְּנֵישׁ אַהֲרן אָחוּךְ", "pj_en": "And thou shalt see it, but thou thyself self shalt be gathered to thy people, as Aharon thy brother hath been gathered:", "tj": "", "tj_en": "", "rashi": "<b>כאשר נאסף אהרן אחיך.<\/b> מִכָּאן שֶׁנִּתְאַוָּה מֹשֶׁה לְמִיתָתוֹ שֶׁל אַהֲרֹן (שם); דָּ\"אַ — אֵין אַתָּה טוֹב מִמֶּנּוּ, \"עַל אֲשֶׁר לֹא קִדַּשְׁתֶּם\" (דברים לב, נא), הָא אִם קִדַּשְׁתֶּם אוֹתִי עֲדַיִן לֹא הִגִּיעַ זְמַנְכֶם לְהִפָּטֵר (שם); בְּכָל מָקוֹם שֶׁכָּתַב מִיתָתָם כָּתַב סֻרְחָנָם, לְפִי שֶׁנִּגְזְרָה גְזֵרָה עַל דּוֹר הַמִּדְבָּר לָמוּת בַּמִּדְבָּר בְּעָוֹן שֶׁלֹּא הֶאֱמִינוּ, לְכָךְ בִּקֵּשׁ מֹשֶׁה שֶׁיִּכָּתֵב סֻרְחָנוֹ, שֶׁלֹּא יֹאמְרוּ אַף הוּא מִן הַמַּמְרִים הָיָה, מָשָׁל לִשְׁתֵּי נָשִׁים שֶׁלּוֹקוֹת בְּבֵית דִּין, אַחַת קִלְקְלָה וְאַחַת אָכְלָה פַגֵּי שְׁבִיעִית וְכוּ', אַף כָּאן בְּכָל מָקוֹם שֶׁהִזְכִּיר מִיתָתָן הִזְכִּיר סֻרְחָנָן, לְהוֹדִיעַ שֶׁלֹּא הָיְתָה בָהֶם אֶלָּא זוֹ בִּלְבַד (יומא פ\"ו):", "rashi_en": "כאשר נאסף אהרן אחיך [THOU SHALT BE GATHERED TO THY PEOPLE] AS AARON THY BROTHER WAS GATHERED — From this it is evident that Moses longed for a death similar to that of Aaron (cf. Rashi on Numbers 20:26). — Another explanation: you will die as he died (in the wilderness) because you are no better than he (Midrash Tanchuma, Pinchas 9). — Such indeed is suggested by (Deuteronomy 32:50. 51): “[and die … as Aaron thy brother died …] because you sanctified me not”. Thus it follows, if ye (both of you) had sanctified me your time would not have yet come to depart this life and you would not have died in the wilderness (Sifrei Bamidbar 137:1). In every passage where it writes about their death you will find that it writes about their offence. Because a decree had been made against the generation of the wilderness (those who left Egypt) that they should die in the wilderness on account of the sin that they did not have faith in God, therefore Moses requested that the nature of his offence should be stated in the Torah, so that people might not say, “He, too, was one of those “rebels”. A parable: It may be compared to the case of two women who were punished by the Court; one was an immoral woman and one had merely eaten unripe figs of the sabbatical year’s growth. The latter, therefore, requested that the nature of her offence might be made public, and they did so by proclamation. So, too, here: wherever it mentions their death it mentions also their misdeed, in order to make it known that there was only this single sin in them (Tanchuma 4:6:10 on חקת; Yoma 86b; cf. Sifrei Bamidbar 137:2)."}, {"ch": 27, "v": 14, "aliyah": 4, "heb": "כַּאֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜י בְּמִדְבַּר־צִ֗ן בִּמְרִיבַת֙ הָֽעֵדָ֔ה לְהַקְדִּישֵׁ֥נִי בַמַּ֖יִם לְעֵינֵיהֶ֑ם הֵ֛ם מֵֽי־מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר־צִֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כְּמָא דִי סָרֵיבְתּוּן עַל מֵימְרִי בְּמַדְבְּרָא דְצִן בְּמַצּוּת כְּנִשְׁתָּא לְקַדָּשׁוּתִי בְמַיָּא לְעֵינֵיהוֹן אִנּוּן מֵי מַצּוּת <b>רְקַם<\/b> מַדְבְּרָא דְצִן:", "onk_en": "Because you disobeyed My words in the wilderness of Tzin, when the community quarreled, [you were] to sanctify Me through the water, before their eyes.” Those were the waters of dispute at Kadeish [<b>Rekam<\/b>], in the wilderness of Tzin.", "pj": "מְטוֹל דְסָרֵבְתּוּן עַל מֵימְרִי בְּמַדְבְּרָא דְצִין בְּמוֹי מַצוּת כְּנִישְׁתָּא לְקַדָשׁוּתִי בְּמַיָא לְמֶחֱמֵיהוֹן הִינוּן מֵי מַצוּת רְקַם בְּמַדְבְּרָא דְצִין", "pj_en": "because you were disobedient against My Word in the desert of Zin, in the congregation at the Waters of Strife, to sanctify Me at the waters in their sight: these are the Waters of Strife in the desert of Zin.", "tj": "", "tj_en": "", "rashi": "<b>הם מי מריבת קדש.<\/b> הֵם לְבַדָּם — אֵין בָּהֶם עָוֹן אַחֵר; דָּ\"אַ — הֵם שֶׁהִמְרוּ בְמָרָה, הֵם הָיוּ שֶׁהִמְרוּ בְיַם סוּף, הֵם עַצְמָם שֶׁהִמְרוּ בְמִדְבַּר צִן:", "rashi_en": "המה מי מריבת קדש THEY, THE WATERS OF MERIBA IN KADESH — they alone were the cause of their death: there was no other sin in them. — Another explanation is: it was they (the waters) which were the cause of their rebellion at Marah (Exodus 16:23-24), it was they which made them rebel at the Red Sea (Exodus 14:11—12) and yet it was they which made them rebel here in the wilderness of Zin."}, {"ch": 27, "v": 15, "aliyah": 4, "heb": "וַיְדַבֵּ֣ר מֹשֶׁ֔ה אֶל־יְהֹוָ֖ה לֵאמֹֽר׃", "onk": "וּמַלִּיל משֶׁה עִם יְיָ לְמֵימָר:", "onk_en": "Moshe spoke to Adonoy, saying:", "pj": "וּמַלֵיל משֶׁה קֳדָם יְיָ לְמֵימָר", "pj_en": "And Mosheh spake before the Lord, saying", "tj": "", "tj_en": "", "rashi": "<b>וידבר משה אל ה' וגו'.<\/b> לְהוֹדִיעַ שִׁבְחָן שֶׁל צַדִּיקִים, כְּשֶׁנִּפְטָרִים מִן הָעוֹלָם מַנִּיחִים צָרְכָּן, וְעוֹסְקִין בְּצָרְכֵי צִבּוּר (ספרי):<br><br><b>לאמר.<\/b> אָמַר לוֹ, הֲשִׁיבֵנִי אִם אַתָּה מְמַנֶּה לָהֶם פַּרְנָס אִם לָאו (שם):", "rashi_en": "'וידבר משה אל ה‎‎‎ וגו׳ AND AND MOSES SPAKE TO THE LORD, [LET THE LORD … SET A MAN OVER THE CONGREGATION] — This statement serves to show the praise of the righteous: when they are about to depart from the world, they abandon all thought of their own affairs and occupy themselves with the affairs of the community (Sifrei Bamidbar 138). <br><br>לאמר saying (more lit., to say, i.e., that God should say, or answer him) — He said to Him, “Answer me whether You will appoint a leader for them or not” (Sifrei Bamidbar 138)."}, {"ch": 27, "v": 16, "aliyah": 4, "heb": "יִפְקֹ֣ד יְהֹוָ֔ה אֱלֹהֵ֥י הָרוּחֹ֖ת לְכׇל־בָּשָׂ֑ר אִ֖ישׁ עַל־הָעֵדָֽה׃", "onk": "יְמַנֵּי יְיָ אֱלָהָא רוּחַיָּא לְכָל בִּסְרָא גְּבַר עַל כְּנִשְׁתָּא:", "onk_en": "“Let Adonoy, God of the spirits, appoint a man over the community,", "pj": "יְמַנֵי מֵימְרָא דַיְיָ דְשַׁלִיט בְּנִשְׁמַת בַּר נַשׁ וּמִנֵיהּ מִתְיְיהַב רוּחַ נִשְׁמָתָא לְכָל בִּישְרָא גְבַר מְהֵימָן עַל כְּנִשְׁתָּא", "pj_en": "May the Word of the Lord, who ruleth over the souls of men, and by whom hath been given the inspiration of the spirit of all flesh, appoint a faithful man over the congregation,", "tj": "יְמַנֵי מֵימְרָא דַיְיָ אֱלָהָא דְשַׁלִיט בְּנִשְׁמַת כָּל בִּישְרָא גְבַר מְזַמִין עַל עַמָא דִכְנִשְׁתָּא:", "tj_en": "The Word of the Lord the God who ruleth over the spirit of all flesh, appoint a praiseworthy man over the people of the congregation.", "rashi": "<b>יפקד ה'.<\/b> כֵּיוָן שֶׁשָּׁמַע מֹשֶׁה שֶׁאָמַר לוֹ הַמָּקוֹם תֵּן נַחֲלַת צְלָפְחָד לִבְנוֹתָיו, אָמַר הִגִּיעַ שָׁעָה שֶׁאֶתְבַּע צָרְכִּי — שֶׁיִּירְשׁוּ בָּנַי אֶת גְּדֻלָּתִי, אָמַר לוֹ הַקָּבָּ\"ה לֹא כָךְ עָלְתָה בְמַחֲשָׁבָה לְפָנַי, כְּדַאי הוּא יְהוֹשֻׁעַ לִטֹּל שְׂכַר שִׁמּוּשׁוֹ שֶׁלֹּא מָשׁ מִתּוֹךְ הָאֹהֶל (שמות ל״ג:י״א), וְזֶהוּ שֶׁאָמַר שְׁלֹמֹה (משלי כ\"ז) \"נוֹצֵר תְּאֵנָה יֹאכַל פִּרְיָהּ\" (תנחומא):<br><br><b>אלהי הרוחת.<\/b> לָמָּה נֶאֱמַר? אָמַר לְפָנָיו, רִבּוֹנוֹ שֶׁל עוֹלָם, גָּלוּי לְפָנֶיךָ דַּעְתּוֹ שֶׁל כָּל אֶחָד וְאֶחָד, וְאֵינָן דּוֹמִין זֶה לָזֶה, מַנֵּה עֲלֵיהֶם מַנְהִיג שֶׁיְּהֵא סוֹבֵל כָּל אֶחָד וְאֶחָד לְפִי דַעְתּוֹ (ילקוט שמעוני):", "rashi_en": "יפקד ה׳ LET THE LORD … SET [A MAN OVER THE CONGREGATION] — When Moses heard that the Omnipresent said to him, “Give the inheritance of Zelophehad to his daughters”, he said to himself, “The time has come that I should ask something that I want — that my sons should inherit my high position”. God replied to him, “Not thus has entered My mind; Joshua deserves to receive the reward of his ministrations, because “he has never departed from out the tent” (Exodus XXXIII 11). — This is what Solomon said, (Proverbs 27:18) ‘‘Whoso keepeth the fig-tree shall eat the fruit thereof, [and he that waiteth on his master shall be honoured]” (Midrash Tanchuma, Pinchas 11).<br><br>אלהי הרוחת GOD OF THE SPIRITS [OF ALL FLESH] — Why is this expression used? (i.e., why does it not state simply אלהי כל בשר?) He said to Him: “Lord of the Universe! the personality of each person is revealed to you, and no two are alike. Appoint over them a leader who will tolerate each person according to his individual character (Midrash Tanchuma, Pinchas 10; cf. Yalkut Shimoni on Torah 776)."}, {"ch": 27, "v": 17, "aliyah": 4, "heb": "אֲשֶׁר־יֵצֵ֣א לִפְנֵיהֶ֗ם וַאֲשֶׁ֤ר יָבֹא֙ לִפְנֵיהֶ֔ם וַאֲשֶׁ֥ר יוֹצִיאֵ֖ם וַאֲשֶׁ֣ר יְבִיאֵ֑ם וְלֹ֤א תִהְיֶה֙ עֲדַ֣ת יְהֹוָ֔ה כַּצֹּ֕אן אֲשֶׁ֥ר אֵין־לָהֶ֖ם רֹעֶֽה׃", "onk": "דִּי יִפּוֹק קֳדָמֵיהוֹן וְדִי יֵעוֹל קֳדָמֵיהוֹן וְדִי יַפֵּקִנּוּן וְדִי יְעֵלִנּוּן וְלָא תְהֵי כְּנִשְׁתָּא דַיְיָ כְּעָנָא דִי לֵית לְהֵן רָעֵי:", "onk_en": "who will go forth before them, and who will come back before them, and who would lead them out and bring them in, so that the community of Adonoy shall not be like sheep that have no shepherd.”", "pj": "דִי הֲוֵי נְפַק קֳדָמֵיהוֹן לְסִדְרֵי קְרָבָא וְדִי הֲוָה עָלֵיל קֳדָמֵיהוֹן מִן סִדְרֵי קְרָבָא וּדְיִפּוֹק יַתְהוֹן מִן יַד בַּעֲלֵי דְבָבֵיהוֹן וּדְיֵעוּל יַתְהוֹן לְאַרְעָא דְיִשְרָאֵל וְלָא תְהֵי כְנִישְׁתָּא דַיְיָ בְּלָא חַכִּימִין מִן בִּגְלַל דְלָא יִטְעוֹן בֵּינֵי עַמְמַיָא כַּעֲנָא דְטָעַן וְלֵית לְהוֹן רוֹעֵי", "pj_en": "who may go out before them to set battle in array, and may come in before them from the he battle who may bring them out from the hands of their enemies, and bring them into the land of Israel; that the congregation of the Lord may not be without the wise, nor go astray among the nations as sheep who go astray, having no shepherd.", "tj": "", "tj_en": "", "rashi": "<b>אשר יצא לפניהם.<\/b> לֹא כְדֶרֶךְ מַלְכֵי הָאֻמּוֹת שֶׁיּוֹשְׁבִים בְּבָתֵּיהֶם וּמְשַׁלְּחִין אֶת חַיָּלוֹתֵיהֶם לַמִּלְחָמָה, אֶלָּא כְּמוֹ שֶׁעָשִׂיתִי אֲנִי, שֶׁנִּלְחַמְתִּי בְסִיחוֹן וּבְעוֹג, שֶׁנֶּאֱמַר (במדבר כ\"א) \"אַל תִּירָא אֹתוֹ\", וּכְדֶרֶךְ שֶׁעָשָׂה יְהוֹשֻׁעַ, שֶׁנֶּאֱמַר \"וַיֵּלֶךְ יְהוֹשֻׁעַ אֵלָיו וַיֹּאמֶר לוֹ הֲלָנוּ אַתָּה\" וְגוֹ' (יהושע ה'), וְכֵן בְּדָוִד הוּא אוֹמֵר (שמואל א י\"ח) \"כִּי הוּא יוֹצֵא וָבָא לִפְנֵיהֶם\" — יוֹצֵא בָּרֹאשׁ וְנִכְנָס בָּרֹאשׁ (ספרי):<br><br><b>ואשר יוציאם.<\/b> בִּזְכֻיּוֹתָיו:<br><br><b>ואשר יביאם.<\/b> בִּזְכֻיּוֹתָיו. דָּ\"אַ — <b>ואשר יביאם<\/b>, שֶׁלֹּא תַעֲשֶׂה לוֹ כְּדֶרֶךְ שֶׁאַתָּה עוֹשֶׂה לִּי, שֶׁאֵינִי מַכְנִיסָן לָאָרֶץ (ילקוט שמעוני):", "rashi_en": "אשר יצא לפניהם ONE WHO MAY GO BEFORE THEM — not as is the way of the kings of the nations who sit at home and send their armies to battle, but as “I” have done — I who fought against Sihon and against Og, as it is said, (Numbers 21:34) “Do not fear him: “[for I have delivered him into thy hand … and thou shall do to him as thou didst unto Sihon, etc.]” and as is the way that Joshua followed, as it is said, (Joshua 5:3) “And Joshua went to him and said, Art thou for us [or for our adversaries]”. And so, too, in the case of David, it says, (I Samuel 18:16) “For he went out and came in before them” — went out at their head, and came in at their head (Sifrei Bamidbar 139:2).<br><br>ואשר יוציאם AND WHO WILL LEAD THEM OUT, safely through his merits,<br><br>ואשר יביאם AND WHO WILL BRING THEM IN, safely through his merits (Siphre). Another explanation: ואשר יביאם AND WHO WILL BRING THEM IN — I ask that You should not do to him, as You have done to me' for I may not bring them into the Land. (cf. Yalkut Shimoni on Torah 776)."}, {"ch": 27, "v": 18, "aliyah": 4, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה קַח־לְךָ֙ אֶת־יְהוֹשֻׁ֣עַ בִּן־נ֔וּן אִ֖ישׁ אֲשֶׁר־ר֣וּחַ בּ֑וֹ וְסָמַכְתָּ֥ אֶת־יָדְךָ֖ עָלָֽיו׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה דְבַר לָךְ יָת יְהוֹשֻׁע בַּר נוּן גְּבַר דִּי רוּחַ <b>נְבוּאָה<\/b> בֵיהּ וְתִסְמוֹךְ יָת יְדָךְ עֲלוֹהִי:", "onk_en": "Adonoy said to Moshe: “Take to yourself Yehoshua son of Nun, a man in whom there is spirit [<b>of prophecy<\/b>], and lay your hand on him.", "pj": "וַאֲמַר יְיָ לְמשֶׁה דַבַּר לָךְ יַת יְהוֹשֻׁעַ בַּר נוּן גְבַר דְרוּחַ נְבוּאָה מִן קֳדָם יְיָ שַׁרְיָא עֲלוֹי וְתִסְמוֹךְ יַת יְדָךְ עֲלוֹי", "pj_en": "And the Lord said to Mosheh, Take to thee Jehoshua bar Nun, a man upon whom abideth the Spirit of prophecy from before the Lord, and lay thy hand upon him,", "tj": "", "tj_en": "", "rashi": "<b>קח לך.<\/b> קָחֶנּוּ בִּדְבָרִים — אַשְׁרֶיךָ שֶׁזָּכִיתָ לְהַנְהִיג בָּנָיו שֶׁל מָקוֹם:<br><br><b>לך.<\/b> אֶת שֶׁבָּדוּק לְךָ, אֶת שֶׁאַתָּה מַכִּיר:<br><br><b>אשר רוח בו.<\/b> כַּאֲשֶׁר שָׁאַלְתָּ, שֶׁיּוּכַל לַהֲלֹךְ כְּנֶגֶד רוּחוֹ שֶׁל כָּל אֶחָד וְאֶחָד (ספרי):<br><br><b>וסמכת את ידך עליו.<\/b> תֵּן לוֹ מְתֻרְגְּמָן שֶׁיִּדְרֹשׁ בְּחַיֶּיךָ, שֶׁלֹּא יֹאמְרוּ עָלָיו, לֹא הָיָה לוֹ לְהָרִים רֹאשׁ בִּימֵי מֹשֶׁה:", "rashi_en": "קח לך TAKE TO THEE [JOSHUA] — take him through fine words, saying,“Fortunate are you that you have merited to lead the children of the Omnipresent!” (cf. Sifrei Bamidbar 92 on 11:16).<br><br>לך [TAKE] TO THEE  — take one who has been examined by you, the one with whom you are familiar.<br><br>אשר רוח בו [A MAN] IN WHOM THERE IS SPIRIT — As you requested; someone able to deal with the character of each one. (Sifrei Bamidbar 140:1).<br><br>וסמכת את ידך עליו AND LAY THY HAND UPON HIM — Give him an interpreter, so that he will hold Halachic discourses during your life-time, — in order that people may not say about him if he does this only after your death: he dared not raise his head during Moses days but did so only at his death (cf. Sifrei Bamidbar 140:1)."}, {"ch": 27, "v": 19, "aliyah": 4, "heb": "וְהַֽעֲמַדְתָּ֣ אֹת֗וֹ לִפְנֵי֙ אֶלְעָזָ֣ר הַכֹּהֵ֔ן וְלִפְנֵ֖י כׇּל־הָעֵדָ֑ה וְצִוִּיתָ֥ה אֹת֖וֹ לְעֵינֵיהֶֽם׃", "onk": "וּתְקֵים יָתֵיהּ לָקֳדָם אֶלְעָזָר כַּהֲנָא וְלָקֳדָם כָּל כְּנִשְׁתָּא וּתְפַקֵּד יָתֵיהּ לְעֵינֵיהוֹן:", "onk_en": "Stand him before Elozor the <i>kohein<\/i> and before the entire community, and command him before their eyes.", "pj": "וְתָקִים יָתֵיהּ קֳדָם אֶלְעָזָר כַּהֲנָא וְקָדָם כָּל כְּנִישְׁתָּא וְתַפְקֵיד יָתֵיהּ לְמֵיחְמֵיהוֹן", "pj_en": "and make him stand before Elazar the priest and the whole congregation, and instruct him in their presence.", "tj": "", "tj_en": "", "rashi": "<b>וצויתה אתו.<\/b> עַל יִשְׂרָאֵל, דַּע שֶׁטַּרְחָנִין הֵם, סַרְבָנִים הֵם, עַל מְנָת שֶׁתְּקַבֵּל עָלֶיךָ (ספרי במדבר י\"א):", "rashi_en": "וצויתה אתו AND GIVE HIM A CHARGE concerning Israel; say to him, “Know that they are troublesome, that they are refractory — accept your office having in mind that you will have to take upon yourself all this (cf.  Sifrei Bamidbar 92 on 11:16)."}, {"ch": 27, "v": 20, "aliyah": 4, "heb": "וְנָתַתָּ֥ה מֵהֽוֹדְךָ֖ עָלָ֑יו לְמַ֣עַן יִשְׁמְע֔וּ כׇּל־עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְתִתֵּן מִזִּיוָךְ עֲלוֹהִי בְּדִיל דִּי <b>יְקַבְּלוּן מִנֵּיהּ<\/b> כָּל כְּנִשְׁתָּא דִּבְנֵי יִשְׂרָאֵל:", "onk_en": "Bestow some of your radiance on him, so that the entire community of Bnei Yisroel will hear [<b>be receptive to him<\/b>].", "pj": "וְתִתֵּן מִזִיו יְקָרָךְ עֲלוֹי מִן בִּגְלַל דִי יְקַבְּלוּן מִינֵיהּ כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל", "pj_en": "And thou shalt confer a ray of thy brightness upon him, that all the congregation of the sons of Israel may be obedient to him.", "tj": "", "tj_en": "", "rashi": "<b>ונתתה מהודך עליו.<\/b> זֶה קֵרוּן עוֹר פָּנִים:<br><br><b>מהודך.<\/b> וְלֹא כָּל הוֹדְךָ, וּמָצִינוּ לְמֵדִין פְּנֵי מֹשֶׁה כַּחַמָּה פְּנֵי יְהוֹשֻׁעַ כַּלְּבָנָה (ספרי; בבא בתרא ע\"ה):<br><br><b>למען ישמעו כל עדת בני ישראל.<\/b> שֶׁיִּהְיוּ נוֹהֲגִין בּוֹ כָּבוֹד וְיִרְאָה, כְּדֶרֶךְ שֶׁנּוֹהֲגִין בְּךָ:", "rashi_en": "ונתתה מהודך עליו AND THOU SHALT PUT SOME OF THY GLORY UPON HIM — This refers to the shining of the skin of his countenance (see Exodus 34:29—30).<br><br>מהודך SOME OF THY GLORY, and not all thy glory; consequently we learn from this: Moses’ face beamed like the sun, Joshua's face only like the moon (Sifrei Bamidbar 140:2; Bava Batra 75a).<br><br>למען ישמעו כל עדת ישראל THAT ALL THE CONGREGATION OF THE CHILDREN OF ISRAEL SHOULD BE OBEDIENT TO HIM — that they should comport themselves towards him with respect and reverence, in the same way as they comport themselves towards you (cf. Yalkut Shimoni on Torah 776)."}, {"ch": 27, "v": 21, "aliyah": 4, "heb": "וְלִפְנֵ֨י אֶלְעָזָ֤ר הַכֹּהֵן֙ יַעֲמֹ֔ד וְשָׁ֥אַל ל֛וֹ בְּמִשְׁפַּ֥ט הָאוּרִ֖ים לִפְנֵ֣י יְהֹוָ֑ה עַל־פִּ֨יו יֵצְא֜וּ וְעַל־פִּ֣יו יָבֹ֗אוּ ה֛וּא וְכׇל־בְּנֵי־יִשְׂרָאֵ֥ל אִתּ֖וֹ וְכׇל־הָעֵדָֽה׃", "onk": "וְלָקֳדָם אֶלְעָזָר כַּהֲנָא יְקוּם וְיִשְׁאַל לֵיהּ בְּדִין אוּרַיָּא קֳדָם יְיָ עַל מֵימְרֵיהּ יְהוֹן נָפְקִין וְ<b>עַל מֵימְרֵיהּ<\/b> יְהוֹן עַלִּין הוּא וְכָל בְּנֵי יִשְׂרָאֵל עִמֵּיהּ וְכָל כְּנִשְׁתָּא:", "onk_en": "He shall stand before Elozor the <i>kohein,<\/i> and ask, of him, through the judgment of the <i>Urim<\/i> before Adonoy. By his word they will come out and [<b>by his word they will<\/b>] go in—he, all Bnei Yisroel with him, and the entire community.”", "pj": "וּקְדָם אֶלְעָזָר כַּהֲנָא יְשַׁמֵישׁ וִיהֵי כַּד יִתְכַּסֵי מִנֵיהּ פִּתְגַם וְיַשְׁאִיל לֵיהּ בְּדִין אוּרַיָא קֳדָם יְיָ עַל מֵימְרָא דְאֶלְעָזָר כַּהֲנָא יְהוֹן נַפְקִין לְסִדְרֵי קְרָבָא וְעַל מֵימְרֵיהּ יְהוֹן עָלִין לְמֵידוֹן דִינָא הוּא וְכָל בְּנֵי יִשְרָאֵל עִמֵיהּ וְכָל כְּנִשְׁתָּא", "pj_en": "And he shall minister before Elazar the priest; and when any matter is hidden from him, he shall inquire for him before the Lord by Uraia. According to the word of Elazar the priest they shall go forth to battle, and come in to do judgment be and all the sons of Israel with him, even all the congregation.", "tj": "", "tj_en": "", "rashi": "<b>ולפני אלעזר הכהן יעמד.<\/b> הֲרֵי שְׁאֵלָתְךָ שֶׁשָּׁאַלְתָּ, שֶׁאֵין הַכָּבוֹד הַזֶּה זָז מִבֵּית אָבִיךָ, שֶׁאַף יְהוֹשֻׁעַ יְהֵא צָרִיךְ לְאֶלְעָזָר (תנחומא):<br><br><b>ושאל לו.<\/b> כְּשֶׁיִּצְטָרֵךְ לָצֵאת לַמִּלְחָמָה:<br><br><b>על פיו.<\/b> שֶׁל אֶלְעָזָר:<br><br><b>וכל העדה.<\/b> סַנְהֶדְרִין:", "rashi_en": "ולפני אלעזר הכהן יעמד AND HE SHALL STAND BEFORE ELEAZAR THE PRIEST — Here you have the request that you have made: that this honour should not depart from your father’s house, for Joshua, too, will need Eleazar (Midrash Tanchuma, Pinchas 11).<br><br>ושאל לו AND HE SHALL ASK OF HIM, whenever he finds it necessary to go forth to war (cf. Targum Jonathan on). <br><br>על פיו AT HIS WORD [SHALL THEY GO FORTH] — at Eleazar’s.<br><br>וכל העדה AND ALL THE CONGREGATION — the Sanhedrin (Sanhedrin 16a)."}, {"ch": 27, "v": 22, "aliyah": 4, "heb": "וַיַּ֣עַשׂ מֹשֶׁ֔ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֹת֑וֹ וַיִּקַּ֣ח אֶת־יְהוֹשֻׁ֗עַ וַיַּֽעֲמִדֵ֙הוּ֙ לִפְנֵי֙ אֶלְעָזָ֣ר הַכֹּהֵ֔ן וְלִפְנֵ֖י כׇּל־הָעֵדָֽה׃", "onk": "וַעֲבַד משֶׁה כְּמָא דִי פַּקִּיד יְיָ יָתֵיהּ וּדְבַר יָת יְהוֹשֻׁעַ וַאֲקִימֵיהּ קֳדָם אֶלְעָזָר כַּהֲנָא וּקֳדָם כָּל כְּנִשְׁתָּא:", "onk_en": "Moshe did as Adonoy commanded him. He took Yehoshua and presented him to Elozor the <i>kohein<\/i> and to the entire community.", "pj": "וַעֲבַד משֶׁה הֵיכְמָא דְפַקֵיד יְיָ יָתֵיהּ וּדְבַר יַת יְהוֹשֻׁעַ וְאַקִימֵיהּ קֳדָם אֶלְעָזָר כַּהֲנָא וְקָדָם כָּל כְּנִישְׁתָּא", "pj_en": "And Mosheh did as the Lord commanded him, and took Jehoshua and caused him to stand before Elazar the priest and all the congregation;", "tj": "", "tj_en": "", "rashi": "<b>ויקח את יהושע.<\/b> לְקָחוֹ בִדְבָרִים וְהוֹדִיעוֹ מַתַּן שְׂכַר פַּרְנְסֵי יִשְׂרָאֵל לָעוֹלָם הַבָּא (ספרי):", "rashi_en": "ויקח את יהושע AND HE TOOK JOSHUA — he took him by fine words and told him the reward that will be given to Israel’s leaders in the world to come (Sifrei Bamidbar 141:2)."}, {"ch": 27, "v": 23, "aliyah": 4, "heb": "וַיִּסְמֹ֧ךְ אֶת־יָדָ֛יו עָלָ֖יו וַיְצַוֵּ֑הוּ כַּאֲשֶׁ֛ר דִּבֶּ֥ר יְהֹוָ֖ה בְּיַד־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּסְמַךְ יָת יְדוֹהִי עֲלוֹהִי וּפַקְּדֵיהּ כְּמָא דִי מַלִּיל יְיָ בִּידָא דְמשֶׁה:", "onk_en": "He laid his hands on him and commanded him, just as Adonoy had commanded through Moshe.", "pj": "וּסְמַךְ יַת יְדוֹי עֲלוֹי וּפַקְדֵיהּ הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "and he laid his hands upon him and instructed him, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויסמך את ידיו.<\/b> בְּעַיִן יָפָה, יוֹתֵר וְיוֹתֵר מִמַּה שֶּׁנִּצְטַוָּה, שֶׁהַקָּבָּ\"ה אָמַר לוֹ \"וְסָמַכְתָּ אֶת יָדְךָ\", וְהוּא עָשָׂה בִּשְׁתֵּי יָדָיו, וַעֲשָׂאוֹ כִכְלִי מָלֵא וְגָדוּשׁ, וּמִלְּאוֹ חָכְמָתוֹ בְּעַיִן יָפָה (שם):<br><br><b>כאשר דבר ה'.<\/b> אַף לְעִנְיַן הַהוֹד — נָתַן מֵהוֹדוֹ עָלָיו:", "rashi_en": "ויסמך את ידיו AND HE LAID HIS HANDS [UPON HIM] — generously (in full measure), even more than he had been commanded, for the Holy One, blessed be He, had said, (v. 18) “Lay thy hand [upon him]”, but he did this with his two hands (Yalkut Shimoni on Torah 960), and so made of him a full and heaped up vessel (Sifrei Bamidbar 141:3) and filled him generously with his own wisdom.<br><br>כאשר דבר ה׳ AS THE LORD SPAKE, in respect also of the glory: he put some of his glory upon him."}, {"ch": 28, "v": 1, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 2, "aliyah": 5, "heb": "צַ֚ו אֶת־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם אֶת־קׇרְבָּנִ֨י לַחְמִ֜י לְאִשַּׁ֗י רֵ֚יחַ נִֽיחֹחִ֔י תִּשְׁמְר֕וּ לְהַקְרִ֥יב לִ֖י בְּמוֹעֲדֽוֹ׃", "onk": "פַּקֵּד יָת בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן יָת קוּרְבָּנִי לְחֵם <b>סִדּוּר<\/b> לְקוּרְבָּנִי <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b> תִּטְּרוּן לְקָרָבָא <b>קֳדָמַי<\/b> בְּזִמְנֵיהּ:", "onk_en": "“Command Bnei Yisroel and say to them, ‘My offering, My food of [<b>prepared for<\/b>] My fires, a pleasing aroma [<b>to be accepted willingly<\/b>] to Me, you shall be vigilant to offer to [<b>before<\/b>] Me at its prescribed time’.”", "pj": "פַּקֵיד יַת בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן יַת קוּרְבָּנִי לְחֵים סִדוּר פָּתוֹרֵי יֵיכְלוּן כַּהֲנַיָא וּמַה דְאַתּוּן מְקַרְבִין עַל גַב מַדְבְּחָא לֵית רְשׁוּ לִגְבַר דְיֵיכוּל מִנֵיהּ הֲלָא אֵישָׁתָא הִיא דְאַכְלָא יָתֵיהּ וְהוּא מִתְקַבֵּל קֳדָמֵי לְרֵיחַ רַעֲוָא. עַמִי בְּנֵי יִשְרָאֵל הֲווֹ זְהִירִין לִמְקַרְבָא יָתֵיהּ מֵאַפְרָשׁוּת לִשְׁכְּתָא קָרְבַּן קֳדָמַי בְּזִמְנֵיהּ", "pj_en": "Instruct the children of Israel, and say to them: The priests may eat of My oblation the bread of the order of My table; but that which you offer upon My altar may no man eat. Is there not a fire that will consume it? And it shall be accepted before Me as a pleasant smell. Sons of Israel, My people, be admonished to offer it from the firstlings on the Sabbath, an oblation before Me in its time.", "tj": "פַּקֵיד יַת בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן יַת קֻרְבָּנִי לְחֵים סִידוּר פָּתוֹרִי מַה דְאַתּוּן מְקַרְבִין קֳדָמַי עַל גַבֵּי מַדְבְּחָא הֲלָא אֵשָׁתָא הוּא דְאַכְלָא יָתֵיהּ וְהוּא מִתְקַבֵּל מִנְכוֹן קֳדָמַי לְרֵיחַ דְרַעֲוָא עַמִי בְּנֵי יִשְרָאֵל הֲווֹ זְהִירִין לְמִקְרְבָא יָתֵיהּ קֳדָמַי בְּזִימְנֵיהּ:", "tj_en": "Instruct the children of Israel, and say to them, My oblation, the bread of the order of My table. That which you offer upon the altar. Is there not a fire that will consume it? To be received from you before Me for a pleasant smell. Sons of Israel, My people, be admonished to offer it before Me in its season.", "rashi": "<b>צו את בני ישראל.<\/b> מָה אָמוּר לְמַעְלָה? יִפְקֹד ה', אָמַר לוֹ הַקָּבָּ\"ה עַד שֶׁאַתָּה מְצַוֵּנִי עַל בָּנַי, צַוֵּה אֶת בָּנַי עָלַי, מָשָׁל לְבַת מֶלֶךְ שֶׁהָיְתָה נִפְטֶרֶת מִן הָעוֹלָם וְהָיְתָה מְפַקֶּדֶת בַּעְלָהּ עַל בָּנֶיהָ וְכוּ' כִּדְאִיתָא בְסִפְרֵי:<br><br><b>קרבני.<\/b> זֶה הַדָּם:<br><br><b>לחמי.<\/b> אֵלּוּ אֵמוּרִין, וְכֵן הוּא אוֹמֵר (ויקרא ג') \"וְהִקְטִירָם הַכֹּהֵן הַמִּזְבֵּחָה לֶחֶם אִשֶּׁה\" (ספרי):<br><br><b>לאשי.<\/b> הַנִּתָּנִין לְאִשֵּׁי מִזְבְּחִי:<br><br><b>תשמרו.<\/b> שֶׁיִּהְיוּ כֹּהֲנִים וּלְוִיִּם וְיִשְׂרָאֵל עוֹמְדִין עַל גַּבָּיו, מִכָּאן לָמְדוּ וְתִקְּנוּ מַעֲמָדוֹת (תענית כ\"ו):<br><br><b>במועדו.<\/b> בְּכָל יוֹם הוּא מוֹעֵד הַתְּמִידִים:", "rashi_en": "צו את בני ישראל COMMAND THE CHILDREN OF ISRAEL — What is said above? Moses said, “Let the Lord set [a man over the congregation]” (Numbers 27:16). The Holy One, blessed be He, said to him, “Instead of giving Me a command regarding My children, command My children regarding Me!” A parable! It may be compared to the case of a princess who was departing this world and gave her husband charge concerning her children, etc., as it is related in Sifrei Bamidbar 142:1.<br><br>קרבני MY OFFERING — this refers to the blood.<br><br>לחמי MY FOOD — this refers to the fat-portions, and so it states, (Leviticus 3:16) “And the priest shall burn them (the fat-portions) on the altar, it is the food of the fire-offerings” (Sifrei Bamidbar 142:2). <br><br>לאשי [MY FOOD] FOR MY FIRE OFFERING — i.e., the fat-portions that are assigned for the fire offerings of My altar (Sifrei Bamidbar 142:2).<br><br>תשמרו YE (the children of Israel) SHALL WATCH [TO OFFER TO ME] — This implies that priests, Levites and ordinary Israelites shall stand by watching when the sacrifices are offered (Sifrei Bamidbar 142:2). From this command they (the Rabbis) derived the law of, and instituted the Maamadot (representatives of the people who were present when the sacrificial service was performed) (Taanit 27a).<br><br>במועדו [YE SHALL OFFER TO ME] IN ITS APPOINTED SEASON — Every day is the “appointed season” for the continual offerings."}, {"ch": 28, "v": 3, "aliyah": 5, "heb": "וְאָמַרְתָּ֣ לָהֶ֔ם זֶ֚ה הָֽאִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַיהֹוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי־שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַיּ֖וֹם עֹלָ֥ה תָמִֽיד׃", "onk": "וְתֵימַר לְהוֹן דֵּין קוּרְבָּנָא דִּי תְקָרְבוּן קֳדָם יְיָ אִמְּרִין בְּנֵי שְׁנָא שַׁלְמִין תְּרֵין לְיוֹמָא עֲלָתָא תְדִירָא:", "onk_en": "Say to them: “This is the fire-offering that you shall offer to Adonoy; yearling lambs without blemish, two each day, as a constant (daily) burnt-offering.", "pj": "וְתֵימַר לְהוֹן דֵין סֵדֶר קָרְבָּנַיָא דִי תְקַרְבוּן קֳדָם יְיָ אִמְרִין בְּנֵי שָׁנָה שַׁלְמִין תְּרֵין לְיוֹמָא עֲלָתָא תְּדִירָא", "pj_en": "And say to them: This is the order of the oblations you shall offer before the Lord; two lambs of the year, unblemished, daily, a perpetual burnt offering.", "tj": "", "tj_en": "", "rashi": "<b>ואמרת להם.<\/b> אַזְהָרָה לְבֵית דִּין (ספרי):<br><br><b>שנים ליום.<\/b> כִּפְשׁוּטוֹ, וְעִקָּרוֹ בָא לְלַמֵּד שֶׁיִּהְיוּ נִשְׁחָטִין כְּנֶגֶד הַיּוֹם — תָּמִיד שֶׁל שַׁחַר בַּמַּעֲרָב וְשֶׁל בֵּין הָעַרְבַּיִם בְּמִזְרָחָן שֶׁל טַבָּעוֹת (ספרי; יומא ס\"ב):", "rashi_en": "ואמרת להם AND THOU SHALT SAY TO THEM — This is an instruction to the Beth Din (Sifrei Bamidbar 142:3). <br><br>שנים ליום This may be understood according to its plain sense: TWO [LAMBS] FOR EACH DAY, But in the main it is intended to teach that they should be slaughtered at a spot opposite the day (i.e. the sun) — the morning continual offerings at the west and that of the evening at the east of the rings fixed in the ground and in which were inserted the animals feet (Sifrei Bamidbar 142:3; Yoma 62b)."}, {"ch": 28, "v": 4, "aliyah": 5, "heb": "אֶת־הַכֶּ֥בֶשׂ אֶחָ֖ד תַּעֲשֶׂ֣ה בַבֹּ֑קֶר וְאֵת֙ הַכֶּ֣בֶשׂ הַשֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָֽעַרְבָּֽיִם׃", "onk": "יָת אִמְּרָא חַד תַּעֲבֵּד בְּצַפְרָא וְיָת אִמְּרָא תִנְיָנָא תַּעֲבֵּד בֵּין שִׁמְשַׁיָּא:", "onk_en": "Offer one lamb in the morning and offer the second lamb in the afternoon.", "pj": "יַת אִימַר חָד תַּעֲבֵיד בְּצַפְרָא לִמְכַפְּרָא עַל חוֹבֵי לֵילְיָא וְיַת אִימַר תִּנְיַין תַּעֲבֵיד בֵּינֵי שִׁמְשָׁתָא לִמְכַפְּרָא עַל חוֹבֵי יְמָמָא", "pj_en": "The one lamb thou shalt perform in the morning to make atonement for the sins of the night; and the second lamb thou shalt perform between the suns to atone for the sins of the day;", "tj": "", "tj_en": "", "rashi": "<b>את הכבש אחד.<\/b> אַעַ\"פִּ שֶׁכְּבָר נֶאֱמַר בְּפָרָשַׁת וְאַתָּה תְּצַוֶּה \"וְזֶה אֲשֶׁר תַּעֲשֶׂה\" וְגוֹ' (שמות כט לח), הִיא הָיְתָה אַזְהָרָה לִימֵי הַמִּלּוּאִים וְכָאן צִוָּה לַדּוֹרוֹת:", "rashi_en": "את הכבש אחד THE ONE LAMB [SHALT THOU OFFER IN THE MORNING] — Although it has already been stated in the section beginning with the words ,ואתה תצוה (Exodus 29:38 39): “Now this is what thou shalt offer … [The one lamb thou shalt offer in the morning]”, that was an instruction for the days of the installation ceremony of the priests, but here it states the commands for all generations."}, {"ch": 28, "v": 5, "aliyah": 5, "heb": "וַעֲשִׂירִ֧ית הָאֵיפָ֛ה סֹ֖לֶת לְמִנְחָ֑ה בְּלוּלָ֛ה בְּשֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַהִֽין׃", "onk": "וְחַד מִן עַשְׂרָא <b>בִּתְלַת סְאִין<\/b> סוּלְתָּא לְמִנְחָתָא דְּפִילָא בִּמְשַׁח כְּתִישָׁא רַבְעוּת הִינָא:", "onk_en": "And one tenth of an <i>eiphah<\/i> [<b>three se’in<\/b>] of fine flour as a meal-offering, mixed with beaten oil measuring one fourth of a <i>hin.<\/i>", "pj": "וְחַד מִן עַשְרָא בִּתְלַת סָוִוין סְמִידָא דְחִינְטַיָא לְמִנְחָתָא פְּתִיכָא בִּמְשַׁח זֵיתָא כְּתִישָׁא רַבְעוּת הִינָא", "pj_en": "and the tenth of three seahs of wheaten flour as a mincha mingled with beaten olive oil, the fourth of a hin.", "tj": "", "tj_en": "", "rashi": "<b>סלת למנחה.<\/b> מִנְחַת נְסָכִים:", "rashi_en": "סלת למנחה FLOUR FOR A MEAL OFFERING — the meal offering that usually accompanies drink offerings (cf. Rashi on Leviticus 23:37)."}, {"ch": 28, "v": 6, "aliyah": 5, "heb": "עֹלַ֖ת תָּמִ֑יד הָעֲשֻׂיָה֙ בְּהַ֣ר סִינַ֔י לְרֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַֽיהֹוָֽה׃", "onk": "עֲלָתָא תְּדִירָא דְאִתְעֲבִידָא בְּטוּרָא דְסִינַי <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b> קוּרְבָּנָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "[This is] a constant (daily) burnt-offering as offered on Mount Sinai, for a pleasing aroma [<b>to be accepted willingly<\/b>], a fire-offering to [<b>before<\/b>] Adonoy.", "pj": "עֲלַת תְּדִירָא הֵיכְמָא דַהֲוַת מִקְרְבָא עַל טַוְורָא דְסִינַי מְטוֹל לְאִתְקַבָּלָא בְּרַעֲוָא קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "It is a perpetual burnt offering, such as was (ordained to be) offered at Mount Sinai, to be received with favour as an oblation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>העשיה בהר סיני.<\/b> כְּאוֹתָן שֶׁנַּעֲשׂוּ בִּימֵי הַמִּלּוּאִים; דָּ\"אַ — <b>העשיה בהר סיני<\/b>, הִקִּישׁ עוֹלַת תָּמִיד לְעוֹלַת הַר סִינַי — אוֹתָהּ שֶׁנִּתְקָרְבָה לִפְנֵי מַתַּן תּוֹרָה — שֶׁכָּתוּב בָּהּ (שם כ\"ד) \"וַיָּשֶֹם בָּאֲגָנֹת\", מְלַמֵּד שֶׁטְּעוּנָה כְּלִי (ספרי):", "rashi_en": "העשיה בהר סיני WHICH WAS OFFERED BY MOUNT SINAI — i.e., like those continual burnt offerings which were offered during the days of the installation ceremony (which took place whilst the people were encamped by Mount Sinai). — Another explanation of העשיה בהר סיני is: It compares the continual burnt offering to the burnt offering of Mount Sinai — to that which was offered on the fifth day of the third month, before the Giving of the Torah (see Rashi on Exodus 19:11), of which it is written, (Exodus 24:6) “And he put it (the blood) in basins”: this teaches, therefore, that it (the continual burnt-offering) requires a vessel for the reception of the blood (Sifra, Tzav, Chapter 18 8). "}, {"ch": 28, "v": 7, "aliyah": 5, "heb": "וְנִסְכּוֹ֙ רְבִיעִ֣ת הַהִ֔ין לַכֶּ֖בֶשׂ הָאֶחָ֑ד בַּקֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַיהֹוָֽה׃", "onk": "וְנִסְכֵּיהּ רַבְעוּת הִינָא לְאִמְּרָא חַד בְּקוּדְשָׁא יִתְנַסַּךְ נִסּוּךְ <b>דַּחֲמַר עַתִּיק קֳדָם<\/b> יְיָ:", "onk_en": "Its libation [shall be] one fourth of a <i>hin<\/i> for the one lamb, in the Holy [Sanctuary], you shall pour an intoxicating libation [<b>of aged wine<\/b>] to [<b>before<\/b>] Adonoy.", "pj": "וְנִסוּכֵיהּ רַבְעוּת הִינָא לְאִימַר חַד בְּמָאנֵי בֵּית קוּדְשָׁא יִתְנְסַךְ נִיסוּךְ חֲמַר עַתִּיק וְאִין לָא מַשְׁכַּח חֲמַר עַתִּיק מַיְיתֵי חֲמַר בַּר אַרְבְּעִין יוֹמִין לִמְנַסְכָא קֳדָם יְיָ", "pj_en": "And its libation shall be the fourth of a hin for one lamb; from the vessels of the house of the sanctuary shall it be outpoured, a libation of old wine. But if old wine may not be found, bring wine of forty days to pour out before the Lord.", "tj": "בְּמָאנֵי בֵּית קוֹדֶשׁ יִתְנַסֵךְ נִיסוּךְ חֲמַר בְּחִיר לִשְׁמָא דַיְיָ:", "tj_en": "From the vessels of the house of holiness, it shall be poured out a libation of choice wine unto the Name of the Lord.", "rashi": "<b>ונסכו.<\/b> יַיִן:<br><br><b>בקדש הסך.<\/b> עַל הַמִּזְבֵּחַ יִתְנַסְּכוּ:<br><br><b>נסך שכר.<\/b> יַיִן הַמְשַׁכֵּר, פְּרָט לְיַיִן מִגִּתּוֹ (בבא בתרא צ\"ז):", "rashi_en": "ונסכו (more lit., its pouring forth — i.e. its offering that was poured forth) — wine (cf. Numbers 15:5).<br><br>בקדש הסך CAUSING IT TO BE POURED FORTH ON THE HOLY SPOT — upon the altar they shall be poured out. <br><br>נסך שכר A POURING FORTH OF STRONG DRINK — wine that has intoxicating power. This excludes wine straight out of its vine press (new wine which is non-intoxicating) (Bava Batra 97a)."}, {"ch": 28, "v": 8, "aliyah": 5, "heb": "וְאֵת֙ הַכֶּ֣בֶשׂ הַשֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽעַרְבָּ֑יִם כְּמִנְחַ֨ת הַבֹּ֤קֶר וּכְנִסְכּוֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת אִמְּרָא תִנְיָנָא תַּעְבֵּד בֵּין שִׁמְשַׁיָּא כְּמִנְחַת צַפְרָא וּכְנִסְכֵּיהּ תַּעְבֵּד קֻרְבַּן <b>דְּמִתְקַבַּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "Offer the second lamb in the afternoon, with the same meal-offering of the morning together with its libation you shall offer it, a fire-offering of a pleasing aroma [<b>accepted willingly<\/b>] to [<b>before<\/b>] Adonoy.", "pj": "וְיַת אִימַר תִּנְיַין תַּעֲבֵיד בֵּינֵי שִׁמְשְׁתָא הֵי כְדוֹרוֹנָא דְצַפְרָא וְהֵי כִנְסוּכֵיהּ תַּעֲבֵיד קָרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "And the second lamb thou shalt perform between the suns, according to the presentation of the morning, and according to its oblation shalt thou make the offering, that it may be accepted with favour before the Lord", "tj": "", "tj_en": "", "rashi": "<b>ריח ניחח.<\/b> נַחַת רוּחַ לְפָנַי שֶׁאָמַרְתִּי וְנַעֲשָׂה רְצוֹנִי (ספרי):", "rashi_en": "ריח ניחח A SMELL OF ניחח — one that causes satisfaction (נחת רוח) to Me, that I gave commands and My will was executed (Sifrei Bamidbar 143:3; see Rashi on Leviticus 1:9)."}, {"ch": 28, "v": 9, "aliyah": 5, "heb": "וּבְיוֹם֙ הַשַּׁבָּ֔ת שְׁנֵֽי־כְבָשִׂ֥ים בְּנֵֽי־שָׁנָ֖ה תְּמִימִ֑ם וּשְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַשֶּׁ֖מֶן וְנִסְכּֽוֹ׃", "onk": "וּבְיוֹמָא דְּשַׁבְּתָא תְּרֵין אִמְּרִין בְּנֵי שְׁנָא שַׁלְמִין וּתְרֵין עִשְׂרוֹנִין סוּלְתָּא דְמִנְחָתָא דְּפִילָא בִמְשַׁח וְנִסְכֵּיהּ:", "onk_en": "On the Shabbos day [the offering shall be] two yearling lambs without blemish, and two tenths [of an <i>eiphah<\/i>] of fine flour as a meal-offering, mixed with [olive] oil, and its libation.", "pj": "וּבְיוֹמָא דְשַׁבַּתָּא תְּרֵין אִמְרִין בְּנֵי שָׁנָה שַׁלְמִין וּתְרֵין עֶשְרוֹנִין סְמִידָא לְמִנְחָתָא פְּתִיכָא בִּמְשַׁח זֵיתָא וְנִיסוּכָהּ", "pj_en": "but on the day of Shabbatha two lambs of the year without blemish, and two-tenths of flour mixed with olive oil for the mincha and its libation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 10, "aliyah": 5, "heb": "עֹלַ֥ת שַׁבַּ֖ת בְּשַׁבַּתּ֑וֹ עַל־עֹלַ֥ת הַתָּמִ֖יד וְנִסְכָּֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "עֲלַת שַׁבְּתָא <b>דְּתִתְעֲבֵד<\/b> בְּשַׁבַּתָּא עַל עֲלָתָא תְדִירָא וְנִסְכַּהּ:", "onk_en": "This is the burnt-offering on its [<b>which is done on<\/b>] Shabbos, in addition to the constant (daily) burnt-offering and its libation.", "pj": "עוֹלַת שַׁבְּתָא תִּתְעֲבֵד בְּשַׁבַּתָּא וּמִיתּוֹסְפָא עַל עוֹלַת תְּדִירָא וְנִיסוּכָהּ", "pj_en": "On the Sabbath thou shalt make a Sabbath burnt sacrifice in addition to the perpetual burnt sacrifice and its libation.", "tj": "", "tj_en": "", "rashi": "<b>עלת שבת בשבתו.<\/b> וְלֹא עוֹלַת שַׁבָּת זוֹ בְּשַׁבָּת אַחֶרֶת, הֲרֵי שֶׁלֹּא הִקְרִיב בְּשַׁבָּת זוֹ שׁוֹמֵעַ אֲנִי יַקְרִיב שְׁתַּיִם לַשַּׁבָּת הַבָּאָה, תַּ\"ל \"בְּשַׁבַּתּוֹ\", מַגִּיד שֶׁאִם עָבַר יוֹמוֹ בָּטֵל קָרְבָּנוֹ (ספרי):<br><br><b>על עלת התמיד.<\/b> אֵלּוּ מוּסָפִין, לְבַד אוֹתָן שְׁנֵי כְבָשִׂים שֶׁל עוֹלַת הַתָּמִיד, וּמַגִּיד שֶׁאֵין קְרֵבִין אֶלָּא בֵּין שְׁנֵי הַתְּמִידִין, וְכֵן בְּכָל הַמּוּסָפִין נֶאֱמַר עַל עֹלַת הַתָּמִיד לְתַלְמוּד זֶה:", "rashi_en": "עלת שבת בשבתו lit., THE BURNT OFFERING OF A SABBATH ON ITS SABBATH — and not the burnt offering of this Sabbath on another Sabbath. Take the case that one had not offered the sacrifice on this Sabbath, I might think that he might offer two on the following Sabbath! However, it states “on its Sabbath’, thus showing that if its day (the Sabbath on which it had to be brought) be past, its (that Sabbath’s) offering is cancelled (Sifrei Bamidbar 144:2).<br><br>על עלת התמיד BESIDES THE CONTINUAL BURNT OFFERING — these two lambs are additional offerings for the Sabbath besides (על) those two lambs of the continual burnt offering. And this tells us that these additional offerings must be brought only between the two continual offerings (Sifrei Bamidbar 144:2). Similarly in the case of all additional offerings it is stated that they are to be brought על עלת התמיד to point to this deduction."}, {"ch": 28, "v": 11, "aliyah": 5, "heb": "וּבְרָאשֵׁי֙ חׇדְשֵׁיכֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַיהֹוָ֑ה פָּרִ֨ים בְּנֵֽי־בָקָ֤ר שְׁנַ֙יִם֙ וְאַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי־שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם׃", "onk": "וּבְרֵישֵׁי יַרְחֵיכוֹן תְּקַרְבוּן עֲלָתָא קֳדָם יְיָ תּוֹרִין בְּנֵי תוֹרֵי תְּרֵין וּדְכַר חַד אִמְּרִין בְּנֵי שְׁנָא שַׁבְעָא שַׁלְמִין:", "onk_en": "At the beginning of your months you shall bring a burnt-offering to Adonoy, two young bulls, one ram, seven yearling lambs, [all] without blemish.", "pj": "וּבְרֵישֵׁי יַרְחֵיכוֹן תִּקְרְבוּן עֲלָתָא קֳדָם יְיָ תּוֹרִין בְּנֵי תוֹרֵי דְלָא עֵירוּבִין תְּרֵין וּדְכַר חָד אִמְרִין בְּנֵי שְׁנָא שַׁבְעָא שַׁלְמִין", "pj_en": "And at the beginning of your months you shall offer a burnt sacrifice before the Lord; two young bullocks, without mixture, one ram, lambs of the year seven, unblemished;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 12, "aliyah": 5, "heb": "וּשְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַשֶּׁ֔מֶן לַפָּ֖ר הָאֶחָ֑ד וּשְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַשֶּׁ֔מֶן לָאַ֖יִל הָֽאֶחָֽד׃", "onk": "וּתְלָתָא עִשְׂרוֹנִין סוּלְתָּא מִנְחָתָא דְּפִילָא בִמְשַׁח לְתוֹרָא חַד וּתְרֵין עִשְׂרוֹנִין סוּלְתָּא מִנְחָתָא דְּפִילָא בִמְשַׁח לְדִכְרָא חָד:", "onk_en": "And three tenths [of an <i>eiphah<\/i>] of fine flour as a meal-offering mixed with the [olive] oil for each bull, two tenths [of an <i>eiphah<\/i>] of fine flour as a meal-offering, mixed with the [olive] oil for the one ram,", "pj": "וּתְלָתָא עֶשְרוֹנִין סְמִידָא לְמִנְחָתָא פְּתִיכָא בִּמְשַׁח זֵיתָא לְתוֹרָא חָד וּתְרֵין עֶשְרוֹנִין סְמִידָא דְמִנְחָתָא פְּתִיכָא בִּמְשַׁח זֵיתָא לְדִכְרָא חָד", "pj_en": "and three tenths of flour mingled with oil for the mincha for one bullock; two tenths of flour with olive oil for the mincha of the one ram;", "tj": "", "tj_en": "", "rashi": "<b>ושלשה עשרנים.<\/b> כְּמִשְׁפַּט נִסְכֵּי פַר, שֶׁכֵּן הֵן קְצוּבִין בְּפָרָשַׁת נְסָכִים:", "rashi_en": "ושלשה עשרנים AND THREE TENTH DEALS [OF FLOUR] — according to the rule of the drink-offerings which are brought with a bullock, for so are they (three tenth deals) fixed in the chapter dealing with the drink offerings (Numbers 15:9)."}, {"ch": 28, "v": 13, "aliyah": 5, "heb": "וְעִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַשֶּׁ֔מֶן לַכֶּ֖בֶשׂ הָאֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַיהֹוָֽה׃", "onk": "וְעִשְׂרוֹנָא עִשְׂרוֹנָא סֻלְתָּא מִנְחָתָא דְּפִילָא בִמְשַׁח לְאִמְּרָא חַד עֲלָתָא <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b> קוּרְבָּנָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "And one tenth [of an <i>eiphah<\/i>] of fine flour as a meal-offering mixed with the [olive] oil for each lamb. A burnt-offering of pleasing aroma, a fire-offering [<b>accepted willingly<\/b>] to [<b>before<\/
