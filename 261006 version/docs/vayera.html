ְרָהָם לָמַד לַחֲזֹר עַל הָאוֹרְחִים:", "rashi_en": "שני TWO — One to destroy Sodom, the other to rescue Lot — it was he who had come to heal Abraham — whilst the third, who had come to make the announcement to Sarah, had departed as soon as he had carried out his mission (Midrash Tanchuma, Vayera 8).<br><br>המלאכים ANGELS — But elsewhere (Genesis 18:2) Scripture calls them men! When the Divine Presence was with them, it speaks of them as men. Another explanation is: in connection with Abraham whose power to receive heavenly visitors was great and whom angels visited as regularly as men, it calls them men, but in connection with Lot it calls them angels (Genesis Rabbah 50:2).<br><br>בערב AT EVENTIDE — Did it, however, take the angels such a long time to travel from Hebron to Sodom? But they were angels of mercy and so they tarried — perhaps Abraham would succeed in his advocacy for them (Genesis Rabbah 50:1).<br><br>ולוט ישב בשער סדום AND LOT WAS SITTING IN THE GATE OF SODOM — The word is written without a ו so that it may be read יָשַׁב (he sat) — because that day they had appointed him as their judge (Genesis Rabbah 50:3).<br><br>'וירא לוט וגו AND LOT SAW THEM etc. — From the practice in Abraham’s house he had learned to look out for strangers (Genesis Rabbah 50:4). "}, {"ch": 19, "v": 2, "aliyah": 3, "heb": "וַיֹּ֜אמֶר הִנֶּ֣ה נָּא־אֲדֹנַ֗י ס֣וּרוּ נָ֠א אֶל־בֵּ֨ית עַבְדְּכֶ֤ם וְלִ֙ינוּ֙ וְרַחֲצ֣וּ רַגְלֵיכֶ֔ם וְהִשְׁכַּמְתֶּ֖ם וַהֲלַכְתֶּ֣ם לְדַרְכְּכֶ֑ם וַיֹּאמְר֣וּ לֹּ֔א כִּ֥י בָרְח֖וֹב נָלִֽין׃", "onk": "וַאֲמַר <b>בְּבָעוּ כְעַן<\/b> רִבּוֹנַי זוּרוּ כְעַן לְבֵית עַבְדְּכוֹן וּבִיתוּ וְאַסְחוֹ רַגְלֵיכוֹן וּתְקַדְּמוּן וּתְהָכוּן לְאָרְחֲכוֹן וַאֲמָרוּ לָא אֶלָּהֵן בִּרְחוֹבָא נְבִית:", "onk_en": "He said, Behold [<b>Please<\/b>] now my lords, please [<b>now<\/b>] turn in to your servant’s house. Stay over night, bathe your feet, and get up early and continue on your way. They said, No, we will spend the night in the street.", "pj": "וַאֲמַר בְּבָעוּ כְּדוֹן רִבּוֹנֵי זוֹרוּ כְּדוֹן מִיכָּא וְעוּלוּ לְבֵית עַבְדֵיכוֹן וּבִיתוּ וּשְׁזוּגוּ רִיגְלֵיכוֹן וּתְקַדְמוּן וְתֶהֱכוּן לְאַרְחַתְכוֹן וְאָמְרוּ לָא אֲרֵי בְּשׁוּקָא נְבִית", "pj_en": "and said, I beg now, my lords, turn now hither, and enter the house of your servant, and lodge, and wash your feet; and you will arise and proceed on your way. And they said to him, No; for in the street we will lodge.", "tj": "וְאַסְחוּ רַגְלֵיכוֹן וּסְחוּן בְּצַפְרָא וְתֵיזְלוּן לְמַשְׁכְּנֵיכוֹן בִּשְׁלָם וְאָמָרוּ לָא אֲרוּם בִּפְלָטַיוּת קַרְתָּא נְבִית:", "tj_en": "And wash your feet, and wash you in the morning, and go to your tents in peace. And they said to him, No; for in the open place of the city we will lodge.", "rashi": "<b>הנה נא אדני.<\/b> הִנֵּה נָא אַתֶּם אֲדוֹנִים לִי אַחַר שֶׁעֲבַרְתֶּם עָלַי. דָּבָר אַחֵר הִנֵּה נָא צְרִיכִים אַתֶּם לָתֵת לֵב עַל הָרְשָׁעִים הַלָּלוּ שֶׁלֹּא יַכִּירוּ בָכֶם וְזוֹ הִיא עֵצָה נְכוֹנָה:<br><br><b>סורו נא.<\/b> עַקְּמוּ אֶת הַדֶּרֶךְ לְבֵיתִי דֶרֶךְ עֲקַלָּתוֹן שֶׁלֹּא יַכִּירוּ שֶׁאַתֶּם נִכְנָסִין שָׁם, לְכָךְ נֶאֱמַר סוּרוּ (בראשית רבה):<br><br><b>ולינו ורחצו רגליכם.<\/b> וְכִי דַרְכָּן שֶׁל בְּנֵי אָדָם לָלוּן תְּחִלָּה וְאַחַר כָּךְ רוֹחֵץ? וְעוֹד, שֶׁהֲרֵי אַבְרָהָם אָמַר לָהֶם תְּחִלָּה רַחֲצוּ רַגְלֵיכֶם? אֶלָּא כָּךְ אָמַר לוֹט, אִם כְּשֶׁיָּבֹאוּ אַנְשֵׁי סְדוֹם וְיִרְאוּ שֶׁכְּבָר רַחֲצוּ רַגְלֵיהֶם יַעֲלִילוּ עָלַי וְיֹאמְרוּ כְּבָר עָבְרוּ שְׁנֵי יָמִים אוֹ שְׁלֹשָׁה שֶׁבָּאוּ לְבֵיתְךָ וְלֹא הוֹדַעְתָּנוּ, לְפִיכָךְ אָמַר, מוּטָב שֶׁיִתְעַכְּבוּ כָּאן בַּאֲבַק רַגְלֵיהֶם שֶׁיִּהְיוּ נִרְאִין כְּמוֹ שֶׁבָּאוּ עַכְשָׁו; לְפִיכָךְ אָמַר לִינוּ תְּחִלָּה וְאַחַר כָּךְ רַחֲצוּ:<br><br><b>ויאמרו לא.<\/b> וּלְאַבְרָהָם אָמְרוּ כֵּן תַּעֲשֶׂה, מִכָּאן שֶׁמְּסָרְבִין לְקָטָן וְאֵין מְסָרְבִין לְגָדוֹל (בראשית רבה):<br><br><b>כי ברחוב נלין.<\/b> הֲרֵי כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא, שֶׁאָמְרוּ לֹא נָסוּר אֶל בֵּיתְךָ אֶלָּא בִּרְחוֹבָהּ שֶׁל עִיר נָלִין:", "rashi_en": "רנה נא אדני BEHOLD NOW, MY LORDS — Behold now you are my lords since you have passed by me. Another explanation is: Behold now you should be careful with respect to these wicked people that they should not observe you, and, therefore this is the good advice that I give you, viz.:<br><br>סורו נא—take a circuitous route to my house — a round-about way, that people should not notice you entering it. For this reason he said: סורו turn aside (Genesis Rabbah 50:4).<br><br>ולינו ורחצו רגליכם AND LODGE OVER NIGHT AND LAVE YOUR FEET — Is it then customary for people first to tarry all night and then to wash? Furthermore, Abraham began by saying to them, “Wash your feet”! —But this is what Lot thought: If when the men of Sodom come they see that they have already washed their feet, they will make a charge against me saying, “Two or three days have already elapsed since these come to your house and you did not report it to us” — consequently he said: it is better that they should stay here with the dust on their feet so that they would seem to have just arrived. On this account he first said to them, “Lodge over night”, and afterwards “Wash [your feet]” (Genesis Rabbah 50:4).<br><br>ויאמרו לא AND THEY SAID, NAY — But to Abraham they had said, “So do [as thou hast said]”! Hence we may infer that one may readily decline an invitation from an inferior but one should not so readily decline an invitation from a superior (Genesis Rabbah 50:4).<br><br>כי ברחוב נלין BUT WE WILL ABIDE IN THE STREET — Here כי is used in the sense of but; they said: We will not turn aside into your house but we will abide in the street of the city all night."}, {"ch": 19, "v": 3, "aliyah": 3, "heb": "וַיִּפְצַר־בָּ֣ם מְאֹ֔ד וַיָּסֻ֣רוּ אֵלָ֔יו וַיָּבֹ֖אוּ אֶל־בֵּית֑וֹ וַיַּ֤עַשׂ לָהֶם֙ מִשְׁתֶּ֔ה וּמַצּ֥וֹת אָפָ֖ה וַיֹּאכֵֽלוּ׃", "onk": "וְאַתְקֵף בְּהוֹן לַחֲדָא וְזָרוּ לְוָתֵיהּ וְעַלּוּ לְבֵיתֵיהּ וַעֲבַד לְהוֹן מִשְׁתְּיָא וּפַטִּיר אֲפָא לְהוֹן וַאֲכָלוּ:", "onk_en": "He urged them greatly, and they turned in to him and came to his house. He made a feast for them, and baked matzos [<b>for them<\/b>], and they ate.", "pj": "וּפַיֵיס בְּהוֹם לַחֲדָא וְזָרוּ לְוָותֵיהּ וְעָלוּ לְבֵיתֵיהּ וְעָבַד לְהוֹם מִשְׁתַּיָא וּפַטִירֵי אָפָא לְהוֹם וְדָמֵי לֵיהּ כְּאִילוּ אָכְלִין", "pj_en": "And he persuaded them earnestly, and they turned aside to be with him; and they entered his house, and he made a repast for them, and prepared unleavened cakes. And it seemed to him as if they did eat.", "tj": "וַהֲווֹ מִתְחַמְיַין הֵיךְ אָכְלִין וְהֵיךְ שָׁתְיָין:", "tj_en": "And it appeared as if they ate and drank.", "rashi": "<b>ויסרו אליו.<\/b> עִקְּמוּ אֶת הַדֶּרֶךְ לְצַד בֵּיתוֹ:<br><br><b>ומצות אפה.<\/b> פֶּסַח הָיָה:", "rashi_en": "ויסרו אליו AND THEY TURNED ASIDE UNTO HIM — They took a circuitous route towards his house (Genesis Rabbah 50:4). <br><br>ומצות אפה AND HE BAKED UNLEAVENED BREAD —It was Passover (Genesis Rabbah 48:12). "}, {"ch": 19, "v": 4, "aliyah": 3, "heb": "טֶ֘רֶם֮ יִשְׁכָּ֒בוּ֒ וְאַנְשֵׁ֨י הָעִ֜יר אַנְשֵׁ֤י סְדֹם֙ נָסַ֣בּוּ עַל־הַבַּ֔יִת מִנַּ֖עַר וְעַד־זָקֵ֑ן כׇּל־הָעָ֖ם מִקָּצֶֽה׃", "onk": "עַד לָא שְׁכִיבוּ וַאֲנָשֵׁי קַרְתָּא אֲנָשֵׁי סְדוֹם אַקִּיפוּ עַל בֵּיתָא מֵעוּלֵימָא וְעַד סָבָא כָּל עַמָּא מִסּוֹפֵיהּ:", "onk_en": "They had not yet lain down when the men of the city, the men of Sedom, surrounded the house—young and old alike—all the people from one end [of the city] to the other end.", "pj": "עַד דְלָא שְׁכִיבוּ וְאַנְשִׁין רַשִׁיעִין דִבְקַרְתָּא אֵינָשֵׁי סְדוֹם אַחֲזָרוּ עַל בֵּיתָא מִטַלְיָא וְעַד סָבָא כָּל עַמָא מִסֵיפָא", "pj_en": "They had not yet lain down, when the wicked men of the city, the men of Sedom, came round upon the house, from the youth to the old man, all the people throughout.", "tj": "", "tj_en": "", "rashi": "<b>טרם ישכבו ואנשי העיר אנשי סדום.<\/b> כָּךְ נִדְרַשׁ בִּבְ\"רַ טֶרֶם יִשְׁכָּבוּ וְאַנְשֵׁי הָעִיר הָיוּ בְּפִיהֶם שֶׁל מַלְאָכִים, שֶׁהָיוּ שׁוֹאֲלִים לְלוֹט מַה טִּיבָם וּמַעֲשֵׂיהֶם וְהוּא אוֹמֵר לָהֶם רֻבָּם רְשָׁעִים; עוֹדָם מְדַבְּרִים בָּהֶם וְאַנְשֵׁי סְדוֹם וְגוֹ'. וּפְשׁוּטוֹ שֶׁל מִקְרָא וְאַנְשֵׁי הָעִיר אַנְשֵׁי רֶשַׁע, נָסַבּוּ עַל הַבַּיִת; עַל שֶׁהָיוּ רְשָׁעִים נִקְרָאִים אַנְשֵׁי \"סְדוֹם\", כְּמוֹ שֶׁאָמַר הַכָּתוּב וְאַנְשֵׁי סְדֹם רָעִים וְחַטָּאִים:<br><br><b>כל העם מקצה.<\/b> מִקְּצֵה הָעִיר עַד הַקָּצֶה, שֶׁאֵין אֶחָד מֵהֶם מוֹחֶה בְיָדָם, שֶׁאֲפִלּוּ צַדִּיק אֶחָד אֵין בָּהֶם:", "rashi_en": "טרם ישכבו ואנשי העיר אנשי סדום The following explanation is given in Genesis Rabbah 50:5: Before they lay down, the men of the city were a topic of conversation (literally, were in the mouths of the angels), for they asked Lot about their character and doings, and the latter replied that most of them were wicked. They were still speaking about them, 'ואנשי סדום וגו “when the men of Sodom etc.” However the real sense of the text is: The men of the city, wicked men, compassed the house. Because they were wicked he designates them as “men of Sodom”, just as Scripture said, (Genesis 13:13) “And the men of Sodom were wicked and sinners”.<br><br>כל העם מקצה ALL THE PEOPLE FROM EVERY QUARTER — from one end of the city to the other end, and no-one protested, for there was not even one righteous person amongst them (Genesis Rabbah 50:5). "}, {"ch": 19, "v": 5, "aliyah": 3, "heb": "וַיִּקְרְא֤וּ אֶל־לוֹט֙ וַיֹּ֣אמְרוּ ל֔וֹ אַיֵּ֧ה הָאֲנָשִׁ֛ים אֲשֶׁר־בָּ֥אוּ אֵלֶ֖יךָ הַלָּ֑יְלָה הוֹצִיאֵ֣ם אֵלֵ֔ינוּ וְנֵדְעָ֖ה אֹתָֽם׃", "onk": "וּקְרוֹ לְלוֹט וַאֲמָרוּ לֵיהּ אָן גֻּבְרַיָּא דִּי אֲתוֹ לְוָתָךְ לֵילְיָא אַפֵּקִנּוּן לְוָתָנָא וְנִדַּע יָתְהוֹן:", "onk_en": "They called to Lot and said to him, Where are the men who came to you tonight? Bring them out to us that we may know them.", "pj": "וּקְרוֹ לְלוֹט וְאָמְרוּ לֵיהּ מַאן גוּבְרַיָא דְעָלוּ לְוָתָךְ לֵילְיָא דֵין אֲפֵּיקִינוּן לְוָותָן וּנְשַׁמֵשׁ עִמְהוֹן", "pj_en": "And they cried to Lot, and said to him, Where are the men who entered with thee tonight? Bring them out to us, and we will lie with them.", "tj": "", "tj_en": "", "rashi": "<b>ונדעה אותם.<\/b> בְּמִשְׁכַּב זָכָר כְּמוֹ אֲשֶׁר לֹא יָדְעוּ אִישׁ (בראשית רבה):", "rashi_en": "ונדעה אותם AND WE SHALL KNOW THEM — with homosexuality, as in \"who have not known a man\" (Genesis Rabbah 50:5). "}, {"ch": 19, "v": 6, "aliyah": 3, "heb": "וַיֵּצֵ֧א אֲלֵהֶ֛ם ל֖וֹט הַפֶּ֑תְחָה וְהַדֶּ֖לֶת סָגַ֥ר אַחֲרָֽיו׃", "onk": "וּנְפַק לְוָתְהוֹן לוֹט לְתַרְעָא וְדָשָׁא אֲחַד בַּתְרוֹהִי:", "onk_en": "Lot went out to them in front of the entrance, shutting the door behind him.", "pj": "וּנְפַק לְוַתְהוֹם לוֹט לְתַרְעָא וְדָשָׁא אָחַד בַּתְרוֹי", "pj_en": "And Lot went out to them to the gate, and shut the door after him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 7, "aliyah": 3, "heb": "וַיֹּאמַ֑ר אַל־נָ֥א אַחַ֖י תָּרֵֽעוּ׃", "onk": "וַאֲמַר בְּבָעוּ <b>כְעַן<\/b> אַחַי לָא תַבְאִישׁוּן:", "onk_en": "He said, My brothers, please [<b>now<\/b>] do not act wickedly.", "pj": "וַאֲמַר בְּבָעוּ לָא כְדוֹן אָחוּי תַּבְאִישׁוּן", "pj_en": "And he said, I pray, my brethren, do not thus wickedly.", "tj": "וַאֲמַר לְהוֹן לוֹט אַמְתִּינוּ הָכָא קָלִיל זְעֵיר עַד דְנִבְעֵי רַחֲמִין מִן קָדָם יְיָ:", "tj_en": "And Lot said to them, Wait here a little, till we have besought mercy before the Lord.", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 8, "aliyah": 3, "heb": "הִנֵּה־נָ֨א לִ֜י שְׁתֵּ֣י בָנ֗וֹת אֲשֶׁ֤ר לֹֽא־יָדְעוּ֙ אִ֔ישׁ אוֹצִֽיאָה־נָּ֤א אֶתְהֶן֙ אֲלֵיכֶ֔ם וַעֲשׂ֣וּ לָהֶ֔ן כַּטּ֖וֹב בְּעֵינֵיכֶ֑ם רַ֠ק לָֽאֲנָשִׁ֤ים הָאֵל֙ אַל־תַּעֲשׂ֣וּ דָבָ֔ר כִּֽי־עַל־כֵּ֥ן בָּ֖אוּ בְּצֵ֥ל קֹרָתִֽי׃", "onk": "הָא כְעַן לִי תַּרְתֵּין בְּנָן דִּי לָא יְדָעִנּוּן גְּבַר אַפֵּק כְּעַן יָתְהָן לְוָתְכוֹן וְעִיבִידוּ לְהֵן כִּדְתַקֵּן בְּעֵינֵיכוֹן לְחוֹד לְגֻבְרַיָּא הָאִלֵּין לָא תַעְבְּדוּן מִדַּעַם אֲרֵי עַל כֵּן עַלּוּ בִּטְלַל שֵׁרוּתִי:", "onk_en": "Behold! I have two daughters who have never known a man, I will bring them out to you, and do with them as you please; only do nothing to these men, since after all, they came under the shelter of my roof.", "pj": "הָא כְדוֹן אִית לִי תַּרְתֵּין בְּנָן דְלָא שְׁמִישׁוּ עִם גְבַר אַנְפֵּיק כְּדוֹן יַתְהוֹן לְוַתְכוֹן וְעִיבִידוּ לְהוֹן כִּדְתַקִין קוּמֵיכוֹן לְחוֹד לְגוּבְרַיָא הָאִילֵין לָא תַעֲבְדוּן מִידַעַם בִּישׁ אֲרוּם בְּגִין כֵּן עָלוּ לְמֵיבַת תְּחוֹת טְלַל כְּשׁוּרָא הָדָא דִי לִי", "pj_en": "Behold, now, I have two daughters who have had no dealing with a man; I would now bring even them out to you to do to them as is meet before you, rather than you should do evil to these men, because they have entered in to lodge under the shadow of my roof.", "tj": "דְלָא חָכְמוּ תַּשְׁמִישׁ לִגְבַר:", "tj_en": "Who have not known dealing with man.", "rashi": "<b>האל.<\/b> כְּמוֹ הָאֵלֶּה:<br><br><b>כי על כן באו.<\/b> כִּי הַטּוֹבָה הַזֹּאת תַּעֲשׂוּ לִכְבוֹדִי עַל אֲשֶׁר בָּאוּ בְּצֵל קֹרָתִי; תַּרְגּוּם בִּטְלַל שָׁרוּתֵי, תַּרְגּוּם שֶׁל קוֹרָה – שָׁרוּתָא:", "rashi_en": "האל is the same as האלה THESE.<br><br>כי על כן באו FOR AS MUCH AS THEY HAVE COME — For (כי) this kindness please do out of respect to me because that (על כן) they have come בצל קורתי UNDER THE SHADOW OF MY ROOF. — In the Targum this is given by בטלל שרותי: the Targum (Aramaic) for קורה (a beam) is שרותא."}, {"ch": 19, "v": 9, "aliyah": 3, "heb": "וַיֹּאמְר֣וּ&thinsp;<b>׀<\/b> גֶּשׁ־הָ֗לְאָה וַיֹּֽאמְרוּ֙ הָאֶחָ֤ד בָּֽא־לָגוּר֙ וַיִּשְׁפֹּ֣ט שָׁפ֔וֹט עַתָּ֕ה נָרַ֥ע לְךָ֖ מֵהֶ֑ם וַיִּפְצְר֨וּ בָאִ֤ישׁ בְּלוֹט֙ מְאֹ֔ד וַֽיִּגְּשׁ֖וּ לִשְׁבֹּ֥ר הַדָּֽלֶת׃", "onk": "וַאֲמָרוּ קְרֵב לְהַלָּא וַאֲמָרוּ חַד אֲתָא לְאִתּוֹתָבָא וְהָא דָיִין דִּינָא כְּעַן נַבְאֵשׁ לָךְ מִדִּילְהוֹן וּתְקִיפוּ בְגַבְרָא בְלוֹט לַחֲדָא וּקְרִיבוּ לְמִתְּבַר דָּשָׁא:", "onk_en": "They said, Step back out of the way! They said, This one came as an immigrant, and now he wants to be a judge. We will now deal worse with you than with them. They pushed hard against Lot, and came near to break the door.", "pj": "וְאָמְרוּ קְרִיב לְהַלָא וְאָמְרוּ הֲלָא בִּלְחוֹדוֹהִי אָתָא דֵין לְאִתּוֹתָבָא בֵּינָן וְהָא אִיתְעֲבִיד דַיְינָא וְדָאִין לְכוֹלָנָא וּכְדוֹן נַבְאִישׁ לָךְ יַתִּיר מִדִלְהוֹן וְאַתְקִיפוּ בְּגַבְרָא בְּלוֹט לַחֲדָא וְקָרִיבוּ לְמִתְבַּר דָשָׁא", "pj_en": "And they said, Give up this. And they said, Did not this come alone to sojourn among us? and, behold, he is making himself a judge, and judging the whole of us. But now we will do worse to thee than to them. And they prevailed against the man, against Lot, greatly, and came near, to shatter the door.", "tj": "", "tj_en": "", "rashi": "<b>ויאמרו גש הלאה.<\/b> קְרַב לְהָלְאָה, כְּלוֹמַר, הִתְקָרֵב לַצְּדָדִין וְהִתְרַחֵק מִמֶּנּוּ, וְכֵן כָּל הָלְאָה שֶׁבַּמִּקְרָא לְשׁוֹן רִחוּק, כְּמוֹ זְרֵה הָלְאָה (במדבר י\"ז), הִנֵּה הַחֵצִי מִמְּךָ וָהָלְאָה (שמואל א' כ'), גֶּשׁ הָלְאָה, (ישעיהו מ\"ט) – הִמָּשֵׁךְ לְהַלָּן, בִּלְשׁוֹן לַעַז טריטי\"דנוש, וּדְבַר נְזִיפָה הוּא, לוֹמַר – אֵין אָנוּ חוֹשְׁשִׁין לְךָ. וְדוֹמֶה לוֹ קְרַב אֵלֶיךָ אַל תִּגַּשׁ בִּי (ישעיהו ס\"ה), וְכֵן גְּשָׁה לִּי וְאֵשֵׁבָה (שם מ\"ט) – הִמָּשֵׁךְ לַצְּדָדִין בַּעֲבוּרִי וְאֵשֵׁב אֶצְלְךָ; אַתָּה מֵלִיץ עַל הָאוֹרְחִין, אֵיךְ מְלָאֲךָ לִבְּךָ? עַל שֶׁאָמַר לָהֶם עַל הַבָּנוֹת, אָמְרוּ לוֹ <b>גש הלאה<\/b>, לְשׁוֹן נַחַת; וְעַל שֶׁהָיָה מֵלִיץ עַל הָאוֹרְחִים – <b>האחד בא לגור<\/b>, אָדָם נָכְרִי יְחִידִי אַתָּה בֵינֵינוּ, שֶׁבָּאתָ לָגוּר, <b>וישפוט שפוט<\/b>, וְנַעֲשֵׂיתָ מוֹכִיחַ אוֹתָנוּ?<br><br><b>הדלת.<\/b> הִיא הַסּוֹבֶבֶת לִנְעֹל וְלִפְתֹּחַ:", "rashi_en": "ויאמרו גש הלאה AND THEY SAID, STEP BACK — Get you away over there — as much as to say, Take yourself aside and keep away from us. Similarly wherever the word הלאה occurs in Scripture it has the meaning of further away. For example: (Numbers 17:2) “Scatter (הלאה) yonder”; (1 Samuel 20:22) “Behold the arrows are beyond thee (הלאה)”   Thus גש הלאה signifies, withdraw yourself further away (old French Retire-toi de nous). It is an expression of contempt, signifying, “we do not take any notice of you!” Of a similar character are: (Isaiah 65:5) “Stand by thyself (אל תגש בי) come not near unto me”, and (Isaiah 49:20) גשה לי “Give place to me that I may dwell” which means “withdraw aside for my sake (לי) that I may dwell where you are now”. — They really meant to say to Lot: “You intercede for these strangers; how dare you!” In reply to what he had said to them regarding his daughters they answered: “Get out of the way” — a somewhat gentle expression — whilst with regard to his advocacy for the strangers they retorted, האחד בא לגור THIS MAN CAME TO SOJOURN — You are the only strange man amongst us, for you have come to sojourn here, וישפוט שפוט and you make yourself a Reprover of us!<br><br>הדלת THE DOOR — This term דלת signifies the wooden frame-work which swings round on hinges to close and open the entrance (cf. Verse 11). "}, {"ch": 19, "v": 10, "aliyah": 3, "heb": "וַיִּשְׁלְח֤וּ הָֽאֲנָשִׁים֙ אֶת־יָדָ֔ם וַיָּבִ֧יאוּ אֶת־ל֛וֹט אֲלֵיהֶ֖ם הַבָּ֑יְתָה וְאֶת־הַדֶּ֖לֶת סָגָֽרוּ׃", "onk": "וְאוֹשִׁיטוּ גֻבְרַיָּא יָת יְדֵיהוֹן וְאַיְתִיאוּ יָת לוֹט לְוָתְהוֹן לְבֵיתָא וְיָת דָּשָׁא אֲחָדוּ:", "onk_en": "The men put out their hands, and pulled Lot to them, into the house, and closed the door.", "pj": "וְאוֹשִׁיטוּ גוּבְרַיָא יַת יְדֵיהוֹן וְהַנְעִילוּ יַת לוֹט לְוַותְהוֹן לְבֵיתָא וְיַת דָשָׁא אָחָדוּ", "pj_en": "And the Men stretched forth their hands, and brought Lot unto them in the house, and shut the door.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 11, "aliyah": 3, "heb": "וְֽאֶת־הָאֲנָשִׁ֞ים אֲשֶׁר־פֶּ֣תַח הַבַּ֗יִת הִכּוּ֙ בַּסַּנְוֵרִ֔ים מִקָּטֹ֖ן וְעַד־גָּד֑וֹל וַיִּלְא֖וּ לִמְצֹ֥א הַפָּֽתַח׃", "onk": "וְיָת גֻּבְרַיָּא דִּי בִתְרַע בֵּיתָא מְחוֹ בְּשַׁבְרִירַיָּא מִזְּעֵירָא וְעַד רַבָּא וּלְאִיוּ לְאַשְׁכָּחָא תַרְעָא:", "onk_en": "The men who were at the entrance of the house, they struck with blindness—young and old alike—so that they wearied themselves trying to find the entrance.", "pj": "וְיַת גוּבְרַיָא דְבִתְרַע בֵיתָא מְחוּ בְּחַוַודְרוּרַיָא מִטַלְיָא וְעַד סָבָא וְאִישְׁתַּלְהִיוּ לְהַשְׁכָּחָא תַרְעָא", "pj_en": "But the men who were at the gate of the house they struck with a suffusion of the eyes, from the young to the old, and they wearied themselves to find the gate.", "tj": "בסנורים בְּחַדְבָּרֵהּ:", "tj_en": "With blindness.", "rashi": "<b>פתח.<\/b> הוּא הֶחָלָל שֶׁבּוֹ נִכְנָסִין וְיוֹצְאִין:<br><br><b>בסנורים.<\/b> מַכַּת עִוָּרוֹן:<br><br><b>מקטן ועד גדול.<\/b> הַקְּטָנִּים הִתְחִילוּ בָּעֲבֵרָה תְּחִלָּה, שֶׁנֶּאֱמַר מִנַּעַר וְעַד זָקֵן, לְפֵיכָךְ הִתְחִילָה הַפֻּרְעָנוּת מֵהֶם (בראשית רבה):", "rashi_en": "פתח THE DOOR (literally, opening) — This means the hollow space (opening) through which people go in and out.<br><br>בסנורים This is an attack of blindness (cf. Yoma 28b)<br><br>מקטן ועד גדול FROM SMALL TO GREAT — The small had begun this wrongdoing — as it is said, (Genesis 19:4) “both young and old” — therefore the punishment started with them (Genesis Rabbah 50:8). "}, {"ch": 19, "v": 12, "aliyah": 3, "heb": "וַיֹּאמְר֨וּ הָאֲנָשִׁ֜ים אֶל־ל֗וֹט עֹ֚ד מִֽי־לְךָ֣ פֹ֔ה חָתָן֙ וּבָנֶ֣יךָ וּבְנֹתֶ֔יךָ וְכֹ֥ל אֲשֶׁר־לְךָ֖ בָּעִ֑יר הוֹצֵ֖א מִן־הַמָּקֽוֹם׃", "onk": "וַאֲמָרוּ גֻבְרַיָּא לְלוֹט עוֹד מָן לָךְ הָכָא חַתְנָא וּבְנָךְ וּבְנָתָךְ וְכֹל דִּי לָךְ בְּקַרְתָּא אַפֵּיק מִן אַתְרָא:", "onk_en": "The men said to Lot, Who else do you have here—a son-in-law, your sons, your daughters? Whoever you have in the city, bring them out of his place.", "pj": "וַאֲמָרוּ גוּבְרַיָא לְלוֹט אִית טוּב מַאן לָךְ בְּקַרְתָּא קָרִיב אוֹ אָחָא הָכָא חַתְנָךְ בְּנָךְ בְּנָתָךְ הַנְפֵּק מִן אַתְרָא", "pj_en": "And the Men said to Lot, Hast thou yet in this city kinsman or brother? Thy sons-in-law, thy sons and thy daughters, take forth from the place;", "tj": "", "tj_en": "", "rashi": "<b>עוד מי לך פה.<\/b> פְּשׁוּטוֹ שֶׁל מִקְרָא מִי יֵשׁ לְךָ עוֹד בָּעִיר הַזֹּאת חוּץ מֵאִשְׁתְּךָ וּבְנוֹתֶיךָ שֶׁבַּבַּיִת:<br><br><b>חתן ובניך ובנתיך.<\/b> וְאִם יֵשׁ לְךָ חָתָן אוֹ בָנִים וּבָנוֹת הוֹצֵא מִן הַמָּקוֹם:<br><br><b>ובניך.<\/b> בְּנֵי בְּנוֹתֶיךָ הַנְּשׂוּאוֹת. וּמִ\"אַ <b>עד<\/b> – מֵאַחַר שֶׁעוֹשִׂין נְבָלָה כָּזֹאת, <b>מי לך<\/b> פִּתְחוֹן פֶּה לְלַמֵּד סַנֵּגוֹרְיָא עֲלֵיהֶם? שֶׁכָּל הַלַּיְלָה הָיָה מֵלִיץ עֲלֵיהֶם טוֹבוֹת, קְרִי בֵיהּ מִי לְךָ פֶה:", "rashi_en": "עד מי לך פה WHOM HAST THOU YET HERE — The evident sense of the verse is: whom else have you in this city besides thy wife and daughters who are at home with you.<br><br>חתן ובניך ובנותיך SON-IN-LAW, THY SONS AND THY DAUGHTERS — If you have a son-in-law, sons or daughters take them out of this place.<br><br>ובניך THY SONS means the sons of your married daughters. The Midrashic explanation of עוד YET is: since they have perpetrated so disgraceful an act, can you yet be so bold (more literally, “can you yet open your mouth”) to speak in defence of them? — for the whole night through he had been talking in favor of them. To obtain this explanation you must read: עוד מי לך פֶּה Have you yet a mouth! (instead of פֹּה here) (Genesis Rabbah 50:5). "}, {"ch": 19, "v": 13, "aliyah": 3, "heb": "כִּֽי־מַשְׁחִתִ֣ים אֲנַ֔חְנוּ אֶת־הַמָּק֖וֹם הַזֶּ֑ה כִּֽי־גָדְלָ֤ה צַעֲקָתָם֙ אֶת־פְּנֵ֣י יְהֹוָ֔ה וַיְשַׁלְּחֵ֥נוּ יְהֹוָ֖ה לְשַׁחֲתָֽהּ׃", "onk": "אֲרֵי מְחַבְּלִין אֲנַחְנָא יָת אַתְרָא הָדֵין אֲרֵי סְגִיאַת קְבִלְתְּהוֹן קֳדָם יְיָ וְשַׁלְחָנָא יְיָ לְחַבָּלוּתַהּ:", "onk_en": "We are going to destroy this place, for the wailing concerning them has become great in the presence of Adonoy; and Adonoy has sent us to destroy it.", "pj": "אֲרוּם מְחַבְּלִין אֲנַחֲנָא יַת אַתְרָא הָדֵין אֲרוּם סַגִיאַת קְבֵילְתְּהוֹן קֳדָם יְיָ וְשַׁדְרָנָא יְיָ לְחַבְּלוּתָהּ", "pj_en": "{for we are about to destroy this place,} for the cry of it before the Lord is great, and the Lord hath sent us to destroy it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 14, "aliyah": 3, "heb": "וַיֵּצֵ֨א ל֜וֹט וַיְדַבֵּ֣ר&thinsp;<b>׀<\/b> אֶל־חֲתָנָ֣יו&thinsp;<b>׀<\/b> לֹקְחֵ֣י בְנֹתָ֗יו וַיֹּ֙אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִן־הַמָּק֣וֹם הַזֶּ֔ה כִּֽי־מַשְׁחִ֥ית יְהֹוָ֖ה אֶת־הָעִ֑יר וַיְהִ֥י כִמְצַחֵ֖ק בְּעֵינֵ֥י חֲתָנָֽיו׃", "onk": "וּנְפַק לוֹט וּמַלִּיל עִם חַתְנוֹהִי נָסְבֵי בְנָתֵיהּ וַאֲמַר קוּמוּ פּוּקוּ מִן אַתְרָא הָדֵין אֲרֵי מְחַבֵּל יְיָ יָת קַרְתָּא וַהֲוָה כִּמְחָיִךְ בְּעֵינֵי חַתְנוֹהִי:", "onk_en": "Lot went out and spoke to his sons-in-law who had married his daughters. He said [to them], Get up! Get out of this place, for Adonoy is going to destroy the city! He appeared as a comedian in the eyes of his sons-in-law.", "pj": "וּנְפַק לוֹט וּמַלֵיל עִם חַתְנוֹי דִנְסִיבוּ בְּרַתּוֹי וַאֲמַר קוּמוּ פּוּקוּ מִן אַתְרָא הָדֵין אֲרוּם מְחַבֵּל יְיָ יַת קַרְתָּא וַהֲוָה פִּתְגָמָא כְּתִימְהָא כִּגְבַר מְגַחֵיךְ בְּעֵינֵי חַתְנוֹי", "pj_en": "And Lot went forth, and spake with his sons-in-law who had taken his daughters, and said, Arise, come forth from this place; for the Lord destroyeth the city. But the word was as a wonder, (and he) as a man ranting, in the eyes of his sons-in-law.", "tj": "", "tj_en": "", "rashi": "<b>חתניו.<\/b> שְׁתֵּי בָנוֹת נְשׂוּאוֹת הָיוּ לוֹ בָּעִיר:<br><br><b>לוקחי בנותיו.<\/b> שֶׁאוֹתָן שֶׁבַּבַּיִת אֲרוּסוֹת לָהֶם:", "rashi_en": "חתניו SONS- IN-LAW — he had two married daughters in the city (Genesis Rabbah 50:9).<br><br>לוקחי בנותיו THOSE WHO WERE MARRYING HIS DAUGHTERS — those to whom his daughters at home were betrothed (Genesis Rabbah 50:9). "}, {"ch": 19, "v": 15, "aliyah": 3, "heb": "וּכְמוֹ֙ הַשַּׁ֣חַר עָלָ֔ה וַיָּאִ֥יצוּ הַמַּלְאָכִ֖ים בְּל֣וֹט לֵאמֹ֑ר קוּם֩ קַ֨ח אֶֽת־אִשְׁתְּךָ֜ וְאֶת־שְׁתֵּ֤י בְנֹתֶ֙יךָ֙ הַנִּמְצָאֹ֔ת פֶּן־תִּסָּפֶ֖ה בַּעֲוֺ֥ן הָעִֽיר׃", "onk": "וּכְמִסַּק צַפְרָא הֲוָה וּדְחִיקוּ מַלְאָכַיָּא בְּלוֹט לְמֵימָר קוּם דְּבַר יָת אִתְּתָךְ וְיָת תַּרְתֵּין בְּנָתָךְ <b>דְּאִשְׁתְּכַחַן מְהֵימְנָן עִמָּךְ<\/b> דִּילְמָא תִלְקֵי בְּחוֹבֵי קַרְתָּא:", "onk_en": "At the break of dawn, the angels urged Lot on, saying, Get up! Take your wife and your two daughters who are here [<b>who are found to be faithful to you<\/b>], lest you be swept away in the iniquity of the city.", "pj": "וּכְאִישׁוֹן מֵיסַק קְרִצְתָּא הֲוָה לְמֵיסוֹק וּדְחִיקוּ מַלְאָכַיָא בְּלוֹט לְמֵימַר קוּם דְבַר יַת אִנְתְּתָךְ וְיַת תַּרְתֵּין בְּנָתָךְ דְהִשְׁתַּכְּחָן גַבָּךְ דִלְמָא תִּשְׁתֵּצֵי בְּחוֹבֵי יַתְבֵי קַרְתָּא", "pj_en": "And at the time that the morning was about to uprise, the angels were urgent upon Lot, saying, Up, take thy wife and thy two daughters who are with you, lest you perish in the condemnation of the inhabitants of the city.", "tj": "וּכְאִישׁוֹן לְמֵיסַק עֲמוּדָא שַׁחֲרָא:", "tj_en": "And it was at the time of the upcoming of the column of the morning.", "rashi": "<b>ויאיצו.<\/b> כְּתַרְגּוּמוֹ וּדְחִיקוּ – מִהֲרוּהוּ:<br><br><b>הנמצאות.<\/b> הַמְזֻמָּנוֹת לְךָ בַּבַּיִת לְהַצִּילָם. וּמִ\"אַ יֵשׁ וְזֶה יִשּׁוּבוֹ שֶׁל מִקְרָא:<br><br><b>תספה.<\/b> תִּהְיֶה כָּלֶה, עַד תֹּם כָּל הַדּוֹר (דברים ב') מְתֻרְגָּם עַד דְּסַף כָּל דָּרָא:", "rashi_en": "ויאיצו THEY URGED [LOT] — as the Targum takes it, “they pressed” — i.e. they hurried him.<br><br>הנמצאות WHO ARE HERE (literally, who can be found) — who are ready at hand in the house to be rescued. There is a Midrashic explanation also, but this is the proper way to explain the text.<br><br>תספה means [LEST] THOU BE MADE AN END OF. The words (Deuteronomy 2:14) עד תום כל הדור “until all the generation were completely ended” are translated by Onkelos: עד דסף כל דרא (the same root סף as in our text). "}, {"ch": 19, "v": 16, "aliyah": 3, "heb": "וַֽיִּתְמַהְמָ֓הּ&thinsp;<b>׀<\/b> וַיַּחֲזִ֨יקוּ הָאֲנָשִׁ֜ים בְּיָד֣וֹ וּבְיַד־אִשְׁתּ֗וֹ וּבְיַד֙ שְׁתֵּ֣י בְנֹתָ֔יו בְּחֶמְלַ֥ת יְהֹוָ֖ה עָלָ֑יו וַיֹּצִאֻ֥הוּ וַיַּנִּחֻ֖הוּ מִח֥וּץ לָעִֽיר׃", "onk": "וְאִתְעַכַּב וְאַתְקִיפוּ גֻבְרַיָּא בִּידֵיהּ וּבִידָא דְאִתְּתֵיהּ וּבְיַד תַּרְתֵּין בְּנָתֵיהּ כִּרְחַם (<small>נ\"י<\/small> כַּד חָס) יְיָ עֲלוֹהִי וְאַפְּקוּהִי וְאַשְׁרוּהִי מִבָּרָא לְקַרְתָּא:", "onk_en": "He hesitated, and the men grabbed his hand and the hand of his wife and two daughters, for Adonoy had pity on him. They brought him out and placed him outside the city.", "pj": "וְאִישְׁתְּהִי וְאַתְקִיפוּ גוּבְרַיָא בִּידֵיהּ וּבִידָא דְאִנְתְּתֵיהּ וּבִידָא דְתַרְתֵּין בְּרַתּוֹיֵי כַּד חַיְיסָא מִן קֳדָם יְיָ הֲוַת עֲלוֹי וְאַפְקוֹהִי וְאַשְׁרִיוֹהִי מִבָּרָא לְקַרְתָּא", "pj_en": "But he delayed: and the men laid hold on his hand, and on the hand of his wife, and on the hand of his two daughters, for mercy from the Lord was upon them. And they brought them forth, and set them without the city.", "tj": "", "tj_en": "", "rashi": "<b>ויתמהמה.<\/b> כְּדֵי לְהַצִּיל אֶת מָמוֹנוֹ:<br><br><b>ויחזיקו.<\/b> אֶחָד מֵהֶם הָיָה שָׁלִיחַ לְהַצִּילוֹ וַחֲבֵרוֹ לַהֲפֹךְ סְדוֹם, לְכָךְ נֶאֱמַר \"וַיֹּאמֶר\" הִמָּלֵט, וְלֹא נֶאֱמַר וַיֹּאמְרוּ (בראשית רבה):", "rashi_en": "ויתמהמה BUT HE LINGERED in order to save his property.<br><br>ויחזיקו AND THE MEN LAID HOLD [UPON HIS HAND]— One of these was commissioned to rescue him whilst his fellow was to overthrow Sodom; that is why it is stated (v. 17) “And he said, escape”, and it is not stated “And they said” (Genesis Rabbah 50:11). "}, {"ch": 19, "v": 17, "aliyah": 3, "heb": "וַיְהִי֩ כְהוֹצִיאָ֨ם אֹתָ֜ם הַח֗וּצָה וַיֹּ֙אמֶר֙ הִמָּלֵ֣ט עַל־נַפְשֶׁ֔ךָ אַל־תַּבִּ֣יט אַחֲרֶ֔יךָ וְאַֽל־תַּעֲמֹ֖ד בְּכׇל־הַכִּכָּ֑ר הָהָ֥רָה הִמָּלֵ֖ט פֶּן־תִּסָּפֶֽה׃", "onk": "וַהֲוָה כַּד אַפִּיקוּ יָתְהוֹן לְבָרָא וַאֲמַר <b>חוּס<\/b> עַל נַפְשָׁךְ לָא תִסְתְּכִי לַאֲחוֹרָךְ וְלָא תְקוּם בְּכָל <b>מֵישְׁרָא<\/b> לְטוּרָא אִשְׁתֵּזֵב דִּלְמָא תִלְקֵי:", "onk_en": "When they were brought out [of the city], he [the angel] said, Escape [<b>Have pity<\/b>] for your life! Do not look back! Do not remain anywhere in the valley [<b>plain<\/b>]. Escape to the mountain, lest you be swept away.", "pj": "וַהֲוָה בְּאַפְקָתְהוֹן יַתְהוֹן לְבָרָא וְהָדָר חַד מִנְהוֹן לִסְדוֹם לְחַבְּלוּתָהּ וְחַד אִשְתָּאֵר עִם לוֹט וְאָמַר לֵיהּ חוּס עַל נַפְשָׁךְ לָא תִּסְתַּכֵּל לַאֲחוֹרָךְ וְלָא תְקוּם בְּכָל מֵישְׁרָא לְטַוְורָא אִשְׁתְּזִיב דִילְמָא תִּשְׁתֵּצֵי", "pj_en": "And it was that as they led them without, one of them returned into Sedom, to destroy it; and one remained with Lot, and said to him, Be merciful to your life; look not behind you, and stand not in all the plain; to the mountain escape, or you perish.", "tj": "", "tj_en": "", "rashi": "<b>המלט על נפשך.<\/b> דַּיְּךָ לְהַצִּיל נְפָשׁוֹת, אַל תָּחוּס עַל הַמָּמוֹן:<br><br><b>אל תביט אחריך.<\/b> אַתָּה הִרְשַׁעְתָּ עִמָּהֶם וּבִזְכוּת אַבְרָהָם אַתָּה נִצָּל; אֵינְךָ כְּדַאי לִרְאוֹת בְּפֻרְעָנוּתָם וְאַתָּה נִצָּל:<br><br><b>בכל הככר.<\/b> כִּכַּר הַיַּרְדֵּן:<br><br><b>ההרה המלט.<\/b> אֵצֶל אַבְרָהָם בְּרַח, שֶׁהוּא יוֹשֵׁב בָּהָר, שֶׁנֶּאֱמַר וַיַּעְתֵּק מִשָּׁם הָהָרָה (בראשית י\"ב), וְאַף עַכְשָׁו הָיָה יוֹשֵׁב שָׁם, שֶׁנֶּאֱמַר אֶל הַמָּקוֹם אֲשֶׁר הָיָה שָׁם אָהֳלוֹ בַּתְּחִלָּה, וְאַעַ\"פִּ שֶׁכָּתוּב וַיֶּאֱהַל אַבְרָהָם וְגוֹ' (שם י\"ג), אֹהָלִים הַרְבֵּה הָיוּ לוֹ וְנִמְשְׁכוּ עַד חֶבְרוֹן:<br><br><b>המלט.<\/b> לְשׁוֹן הַשְׁמָטָה, וְכֵן כָּל הַמְלָטָה שֶׁבַּמִּקְרָא אשמוצי\"ר בלע\"ז וְכֵן וְהִמְלִיטָה זָכָר (ישעיהו ס\"ו), שֶׁנִּשְׁמַט הָעֻבָּר מִן הָרֶחֶם, כְּצִפּוֹר נִמְלְטָה (תהילים קכ\"ד), לֹא יָכְלוּ מַלֵּט מַשָּׂא (ישעיהו מ\"ו), לְהַשְׁמִיט מַשָּׂא הָרְעִי שֶׁבְּנִקְבֵיהֶם:", "rashi_en": "המלט על נפשך ESCAPE FOR THY LIFE — Let it suffice you to save your lives; do not give a thought to your possessions.<br><br>אל תבט אחריך LOOK NOT BEHIND THEE — You sinned with them but art saved through the merit of Abraham. It is not fitting that you should witness their doom whilst you yourself are escaping (Genesis Rabbah 50:11).<br><br>בכל הככר IN ALL THE PLAIN — the plain of the Jordan (cf. Genesis 13:11).<br><br>ההרה המלט ESCAPE TO THE MOUNTAIN — Flee to Abraham who is dwelling in the mountain — as it is said, (Genesis 12:8) “And he removed his tent thence unto the mountain”. He was still dwelling there, as it is said, (Genesis 13:3) “[And he went unto] … the place where his tent had been at first”, and although it is stated (Genesis 13:18) “And Abraham moved his tent etc.”, he had many tents and they stretched as far as Hebron.<br><br>המלט ESCAPE — it means “slipping away” and similarly wherever this root מלט occurs in the Scriptures; in old French émisser. Examples are: (Isaiah 66:7) “she was delivered of (המליטה) a man child” i. e. the embryo slipped out of the womb; (Psalms 124:7) “[Our soul] is escaped (נמלטה) like a bird”; and (Isaiah 46:2) “They could not deliver (מלט) the burden”, i.e. discharge (make slip out) the burden of excrement in their bowel-passages. "}, {"ch": 19, "v": 18, "aliyah": 3, "heb": "וַיֹּ֥אמֶר ל֖וֹט אֲלֵהֶ֑ם אַל־נָ֖א אֲדֹנָֽי׃", "onk": "וַאֲמַר לוֹט לְהוֹן <b>בְּבָעוּ כְעַן רִבּוֹנָי<\/b> (<small>נ\"י<\/small> יְיָ):", "onk_en": "Lot said to them, Please, not so my Master. [<b>Please, now, my Master.<\/b>]", "pj": "וַאֲמַר לוֹט לְוָתֵיהּ בְּבָעוּ מִינָךְ אַמְתִּין לִי שָׁעָה זְעִירָא עַד דְנִתְבּוֹעַ רַחֲמִין מִן קֳדָם יְיָ", "pj_en": "And Lot said to him, I beseech of thee endure with me a little hour, until I have prayed for mercy from before the Lord.", "tj": "אַמְתִּינוּ הָכָא קָלִיל זְעֵיר עַד דְנִבְעֵי רַחֲמִין קֳדָם יְיָ:", "tj_en": "Be steadfast here a little with us until I have besought mercy before the Lord.", "rashi": "<b>אל נא אדני.<\/b> רַבּוֹתֵינוּ אָמְרוּ (שבועות ל\"ב) שֶׁשֵּׁם זֶה קֹדֶשׁ, שֶׁנֶּאֱמַר בּוֹ לְהַחֲיוֹת אֶת נַפְשִׁי – מִי שֶׁיֵשׁ בְּיָדוֹ לְהָמִית וּלְהַחֲיוֹת; וְתַרְגּוּמוֹ בְּבָעוּ כְעַן ה':<br><br><b>אל נא.<\/b> אַל תֹּאמְרוּ אֵלַי לְהִמָּלֵט הָהָרָה:<br><br><b>נא.<\/b> לְשׁוֹן בַּקָּשָׁה:", "rashi_en": "אל נא אדני OH NOT SO, MY LORD — Our Rabbis said, that this name (Lord) is holy (i. e. refers to God; Shevuot 35b), since it is said regarding him (i.e. regarding the one who was addressed by this name) (v. 19) “[and thou hast magnified thy mercy …] in keeping alive my soul”. Therefore it must refer to Him who has the power to kill or keep alive. Indeed the Targum renders it, “I beg of thee, O Lord)”<br><br>אל נא OH NOT SO — do not tell me to escape to the mountain.<br><br>נא — This word is used when a request is being made. "}, {"ch": 19, "v": 19, "aliyah": 3, "heb": "הִנֵּה־נָ֠א מָצָ֨א עַבְדְּךָ֣ חֵן֮ בְּעֵינֶ֒יךָ֒ וַתַּגְדֵּ֣ל חַסְדְּךָ֗ אֲשֶׁ֤ר עָשִׂ֙יתָ֙ עִמָּדִ֔י לְהַחֲי֖וֹת אֶת־נַפְשִׁ֑י וְאָנֹכִ֗י לֹ֤א אוּכַל֙ לְהִמָּלֵ֣ט הָהָ֔רָה פֶּן־תִּדְבָּקַ֥נִי הָרָעָ֖ה וָמַֽתִּי׃", "onk": "הָא כְעַן אַשְׁכַּח עַבְדָךְ רַחֲמִין <b>קֳדָמָךְ<\/b> וְאַסְגֵּיתָא <b>טֵיבוּתָךְ<\/b> דִּי עֲבַדְתָּ עִמִּי לְקַיָּמָא יָת נַפְשִׁי וַאֲנָא לֵית אֲנָא יָכִיל לְאִשְׁתֵּזָבָא לְטוּרָא דִּילְמָא תְעַרְעִנַּנִי בִשְׁתָּא וְאֵימוּת:", "onk_en": "Behold your servant has found favor in Your eyes [<b>before You<\/b>]. Great is your kindness [<b>goodness<\/b>] that you have done with me, to keep me alive. I cannot escape to the mountain, lest the evil attach itself to me and I die.", "pj": "הָא כְּדוֹן אַשְׁכַּח עַבְדָךְ רַחֲמִין קָדָמָךְ וְאַסְגֵיתָא טֵיבוּתָךְ דְעַבַדְתָּא עִמִי לְקַיְימָא יַת נַפְשִׁי וַאֲנָא לָא יְכִילְנָא לְאֵישְׁתֵּזְבָא לְטַוְורָא דִלְמָא תִירְעִינַנִי בִּישְׁתָּא וְאֵימוּת", "pj_en": "Behold, now, thy servant hath found mercy before Thee, and Thou hast multiplied the kindness Thou hast done me in saving my life, and I am not able to escape to the mountain, lest evil overtake me, and I die.", "tj": "", "tj_en": "", "rashi": "<b>פן תדבקני הרעה.<\/b> כְּשֶׁהָיִיתִי אֵצֶל אַנְשֵׁי סְדוֹם הָיָה הַקָּבָּ\"ה רוֹאֶה מַעֲשַׂי וּמַעֲשֵׂה בְנֵי הָעִיר, וְהָיִיתִי נִרְאֶה צַדִּיק וּכְדַאי לְהִנָּצֵל, וּכְשֶׁאָבֹא אֵצֶל צַדִּיק אֲנִי כְרָשָׁע, וְכֵן אָמְרָה הַצָּרְפִית לְאֵלִיָּהוּ בָּאתָ אֵלַי לְהַזְכִּיר אֶת עֲוֹנִי (מלכים א י\"ז), עַד שֶׁלֹא בָאתָ אֶצְלִי הָיָה הַקָּבָּ\"ה רוֹאֶה מַעֲשַׂי וּמַעֲשֵׂה עַמִּי, וַאֲנִי צַדֶּקֶת בֵּינֵיהֶם, וּמִשֶּׁבָּאתָ אֶצְלִי, לְפִי מַעֲשֶׂיךָ אֲנִי רְשָׁעָה:", "rashi_en": "פן תדבקני הרעה [I CANNOT ESCAPE TO THE MOUNTAIN,] LEST SOME EVIL CLEAVE UNTO ME — Whilst I was with the people of Sodom the Holy One, blessed be He, compared my deeds with the deeds of the people of my city and I seemed to be righteous and deserving to be saved. When, however, I come to the righteous man (i.e. Abraham whom Rashi v. 17 stated to be dwelling in the mountain) I must be regarded as wicked. Thus, too, did the woman of Zarefath say to Elijah, (1 Kings 17:18) “Art thou come to bring my sin in remembrance?” Before you came to me the Holy One, blessed be He, compared my doings with the doings of my people and I was regarded as a righteous woman amongst them, but now that you have come to me, in comparison with your deeds, I am wicked (Genesis Rabbah 50:11). "}, {"ch": 19, "v": 20, "aliyah": 3, "heb": "הִנֵּה־נָ֠א הָעִ֨יר הַזֹּ֧את קְרֹבָ֛ה לָנ֥וּס שָׁ֖מָּה וְהִ֣וא מִצְעָ֑ר אִמָּלְטָ֨ה נָּ֜א שָׁ֗מָּה הֲלֹ֥א מִצְעָ֛ר הִ֖וא וּתְחִ֥י נַפְשִֽׁי׃", "onk": "הָא כְעַן קַרְתָּא הָדָא קְרִיבָא לְמֵעִירוֹק לְתַמָּן וְהִיא זְעֵירָא אִשְׁתֵּזַב כְּעַן תַּמָּן הֲלָא זְעֵירָא הִיא וְתִתְקַיַּם נַפְשִׁי:", "onk_en": "Behold, please, this city is near [enough] to flee there. It is insignificant. Let me escape there! It is insignificant, and my life will be saved.", "pj": "הָא כְּדוּן בְּבָעוּ קַרְתָּא הָדָא קְרִיבָא מוֹתְבָהָא וְחָמֵי לְמֵיעֲרוֹק לְתַמָן וְהִיא צִיבְחַר וְקַלִילִין חוֹבָהָא אִישְׁתְּזֵיב כְּדוֹן תַּמָן הֲלָא צִבְחַר הִיא וְתִתְקַיֵים נַפְשִׁי", "pj_en": "Behold, now, I pray, this city, it is a near habitation, and convenient (for us) to escape thither; and it is small, and the guilt thereof light. I will flee thither, then. Is it not a little one? and my life shall be preserved.", "tj": "", "tj_en": "", "rashi": "<b>העיר הזאת קרובה.<\/b> קְרוֹבָה יְשִׁיבָתָהּ, נִתְיַשְּׁבָה מִקָּרוֹב, לְפִיכָךְ לֹא נִתְמַלְּאָה סְאָתָהּ עֲדַיִן (שבת י'). וּמַה הִיא קְרִיבָתָהּ? מִדּוֹר הַפַּלָּגָה שֶׁנִּתְפַּלְּגוּ הָאֲנָשִׁים וְהִתְחִילוּ לְהִתְיַשֵּׁב אִישׁ אִישׁ בִּמְקוֹמוֹ, וְהִיא הָיְתָה בִּשְׁנַת מוֹת פֶּלֶג, וּמִשָּׁם וְעַד כָּאן נ\"ב שָׁנָה, שֶׁפֶּלֶג מֵת בִּשְׁנַת מ\"ח לְאַבְרָהָם. כֵּיצַד? פֶּלֶג חַי אַחֲרֵי הוֹלִידוֹ אֶת רְעוּ ר\"ט שָׁנָה, צֵא מֵהֶם ל\"ב כְּשֶׁנּוֹלַד שְׂרוּג, וּמִשְּׂרוּג עַד שֶׁנּוֹלַד נָחוֹר ל', הֲרֵי ס\"ב, וּמִנָּחוֹר עַד שֶׁנּוֹלַד תֶּרַח כ\"ט, הֲרֵי צ\"א, וּמִשָּׁם עַד שֶׁנּוֹלַד אַבְרָהָם ע', הֲרֵי קס\"א, תֵּן לָהֶם מ\"ח הֲרֵי ר\"ט, וְאוֹתָה שָׁנָה הָיְתָה שְׁנַת הַפַּלָּגָה, וּכְשֶׁנֶּחְרְבָה סְדוֹם הָיָה אַבְרָהָם בֶּן צ\"ט שָׁנָה, הֲרֵי מִדּוֹר הַפַּלָּגָה עַד כָּאן נ\"ב שָׁנָה; וְצֹעַר אִחֲרָה יְשִׁיבָתָהּ אַחֲרֵי יְשִׁיבַת סְדוֹם וְחַבְרוֹתֶיהָ שָׁנָה אַחַת, הוּא שֶׁנֶּאֱמַר אִמָּלְטָה נָּא, נָא בְּגִימַטְרִיָּא נ\"א:<br><br><b>הלא מצער היא.<\/b> וַהֲלֹא עֲוֹנוֹתֶיהָ מוּעָטִין וְיָכוֹל אַתָּה לְהַנִּיחָהּ: <br><br><b>ותחי נפשי<\/b> בָּהּ, זֶהוּ מִדְרָשׁוֹ. וּפְשׁוּטוֹ שֶׁל מִקְרָא הֲלֹא עִיר קְטַנָּה הִיא וַאֲנָשִׁים בָּהּ מְעַט, אֵין לָךְ לְהַקְפִּיד אִם תַּנִּיחֶנָּה, וּתְחִי נַפְשִׁי בָהּ:", "rashi_en": "העיר הזאת קרובה THIS CITY IS NEAR — Its settlement as a city is near in point of time — it has been populated quite recently and therefore its measure is not yet filled (Shabbat 10b). And how recent was its settlement? It dated from the generation of the Dispersal of Nations, when mankind was scattered and men began to settle down each in his own place. This took place in the year when Peleg died, and from that time until now was fifty-two years, because Peleg died when Abraham was 48 years old. How is this? Peleg lived after he begat Reu 209 years (11:19): deduct from this number the 32 years that Reu was old when Serug was born (v. 22) and the 30 from the birth of Serug until the birth of Nahor (v. 22) giving 62, and from the birth of Nahor until Terah was born (v. 24) 29, giving 91, and from then until Abraham’s birth 70, giving a total of 161. Add 48 years of Abraham’s life and you have the 209. That was the year of the Dispersion. When Sodom was destroyed Abraham was 99 years old, so that from the Generation of the Dispersal (in the 48th year of Abraham’s life) until this time was 52 years. The colonisation of Zoar took place one year later than that of Sodom and its sister cities. To this fact reference is made in the words אמלטה נא “let me escape נא” i.e. let me escape to the city which is (נ''א (51 in numerical value.<br><br>הלא מצער הוא IS IT NOT SMALL?— Are not its sins but few, so that you can let it alone.<br><br>ותחי נפשי SO THAT MY SOUL MAY LIVE? This is the Midrashic explanation (Shabbat 10b). The real meaning of the verse is: It is a small city with few inhabitants; you therefore need not be particular about leaving it alone, so that my soul may live in it. "}, {"ch": 19, "v": 21, "aliyah": 4, "heb": "וַיֹּ֣אמֶר אֵלָ֔יו הִנֵּה֙ נָשָׂ֣אתִי פָנֶ֔יךָ גַּ֖ם לַדָּבָ֣ר הַזֶּ֑ה לְבִלְתִּ֛י הׇפְכִּ֥י אֶת־הָעִ֖יר אֲשֶׁ֥ר דִּבַּֽרְתָּ׃", "onk": "וַאֲמַר לֵיהּ הָא נְסֵיבִית אַפָּךְ אַף לְפִתְגָּמָא הָדֵין בְּדִיל דְּלָא לְמֵהְפַּךְ יָת קַרְתָּא <b>דִּבְעֵיתָא עֲלַהּ<\/b>:", "onk_en": "He said to him, See I have also given you consideration regarding this. I will not overturn the city that you mentioned [<b>for which you have beseeched<\/b>].", "pj": "וַאֲמַר לֵיהּ הָא נְסִיבִית אַפָּךְ אוּף לְפִתְגָמָא הָדֵין בְּדִיל דְלָא אֶהֱפּוֹךְ יַת קַרְתָּא דְמַלֵילְתָּא לְאִשְׁתֵּזְבָא בָּהּ", "pj_en": "And He said, Behold, I have accepted thee in this matter also, that I will not overthrow the city for which thou hast spoken, to destroy it, that thou mayest escape to it.", "tj": "", "tj_en": "", "rashi": "<b>גם לדבר הזה.<\/b> לֹא דַּיְּךָ שֶׁאַתָּה נִצָּל, אֶלָּא אַף כָּל הָעִיר אַצִּיל בִּגְלָלְךָ:<br><br><b>הפכי.<\/b> הוֹפֵךְ אֲנִי, כְּמוֹ עַד בֹּאִי (בראשית מ\"ח), אַחֲרֵי רֹאִי (בראשית ט״ז:י״ג), מִדֵּי דַבְּרִי בּוֹ (ירמיהו ל\"א):", "rashi_en": "גם לדבר הזה CONCERNING THIS THING ALSO — Not only will you be saved, but I will also save the whole city for Your sake.<br><br>הפכי means I OVERTHROW, just as (48:5) “until I come (בואי) , and (16:13) “after I have seen (רואי)” and (Jeremiah 31:19) “whenever I speak (דברי) of him)”. "}, {"ch": 19, "v": 22, "aliyah": 4, "heb": "מַהֵר֙ הִמָּלֵ֣ט שָׁ֔מָּה כִּ֣י לֹ֤א אוּכַל֙ לַעֲשׂ֣וֹת דָּבָ֔ר עַד־בֹּאֲךָ֖ שָׁ֑מָּה עַל־כֵּ֛ן קָרָ֥א שֵׁם־הָעִ֖יר צֽוֹעַר׃", "onk": "אוֹחִי לְאִשְׁתֵּזֵב תַּמָּן אֲרֵי לָא אִכּוּל לְמֶעְבַּד פִּתְגָּמָא עַד מֵיתָךְ לְתַמָּן עַל כֵּן קְרָא שְׁמָא דְקַרְתָּא צוֹעַר:", "onk_en": "Hurry, escape there, for I can do nothing until you get there. The city was therefore called Zoar.", "pj": "אוֹחִי אִשְׁתְּזֵיב לְתַמָן אֲרוּם לָא יְכִילְנָא לְמֶעֱבַד מִדַעַם עַד מֵיעֲלָךְ לְתַמָן בְּגִין כֵּן קָרָא שְׁמָא דְקַרְתָּא זוֹעַר", "pj_en": "Hasten and flee thither: for I cannot do any thing till thou have entered there. Therefore he called the name of the city Zoar.", "tj": "", "tj_en": "", "rashi": "<b>כי לא אוכל לעשות.<\/b> זֶה עָנְשָׁן שֶׁל מַלְאָכִים עַל שֶׁאָמְרוּ כִּי מַשְׁחִתִים אֲנַחְנוּ, וְתָלוּ הַדָּבָר בְּעַצְמָן, לְפִיכָך לֹא זָזוּ מִשָּׁם עַד שֶׁהֻזְקְקוּ לוֹמַר שֶׁאֵין הַדָּבָר בִּרְשׁוּתָן:<br><br><b>כי לא אוכל.<\/b> לְשׁוֹן יָחִיד; מִכָּאן אַתָּה לָמֵד שֶׁהָאֶחָד הוֹפֵךְ וְהָאֶחָד מַצִּיל, שֶׁאֵין ב' מַלְאָכִים נִשְׁלָחִים לְדָבָר א':<br><br><b>על כן קרא שם העיר צוער.<\/b> עַל שֵׁם וְהִוא מִצְעָר:", "rashi_en": "כי לא אוכל לעשות FOR I CANNOT DO [ANY THING]—This admission of their powerlessness was the angels’ punishment for having said, (v. 13) “For we will destroy the city”, attributing the act to themselves; therefore they could not go away from there (i. e., the incident could not close) until they were compelled to admit that the thing was not in their power) (Genesis Rabbah 50:9).<br><br>כי לא אוכל FOR I CANNOT DO ANY THING — The pronoun is singular number. This proves that one was to overthrow the city and the other to deliver, for two angels are not sent on the same mission.<br><br>על כן קרא שם העיר צוער THEREFORE THE NAME OF THE CITY WAS CALLED ZOAR, with reference to Lot’s words (v. 20) “And it is (מצער) a little one”. "}, {"ch": 19, "v": 23, "aliyah": 4, "heb": "הַשֶּׁ֖מֶשׁ יָצָ֣א עַל־הָאָ֑רֶץ וְל֖וֹט בָּ֥א צֹֽעֲרָה׃", "onk": "שִׁמְשָׁא נְפַק עַל אַרְעָא וְלוֹט עַל לְצוֹעַר:", "onk_en": "The sun had risen upon the earth, when Lot came to Zoar.", "pj": "שִׁמְשָׁא עָבְרִית יַמָא וּנְפַק עַל אַרְעָא בְּסוֹף תְּלַת שָׁעִין וְלוֹט עַל לְזוֹעַר", "pj_en": "The sun had passed the sea, and come forth upon the earth, at the end of three hours, and Lot entered into Zoar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 24, "aliyah": 4, "heb": "וַֽיהֹוָ֗ה הִמְטִ֧יר עַל־סְדֹ֛ם וְעַל־עֲמֹרָ֖ה גׇּפְרִ֣ית וָאֵ֑שׁ מֵאֵ֥ת יְהֹוָ֖ה מִן־הַשָּׁמָֽיִם׃", "onk": "וַייָ אַמְטַר עַל סְדוֹם וְעַל עֲמוֹרָה גָּפְרֵיתָא וְאֶשָּׁתָא מִן קֳדָם יְיָ מִן שְׁמַיָּא:", "onk_en": "Adonoy caused to rain upon Sedom and Amorah—sulfur and fire—from [<b>before<\/b>] Adonoy, from heaven.", "pj": "וּמֵימְרָא דַיְיָ אָחִית מִיטְרִין דְרַעֲוָא עַל סְדוֹם וְעַל עֲמוֹרָה עַל מְנַת דְיַעַבְדוּן תְּתוּבָא וְלָא עָבְדוּ אֲרוּם אָמְרוּ לָא גְלֵי קֳדָם יְיָ עוּבְדִין בִּישַׁיָא הָא בְּכֵן נַחְתוּ עֲלֵיהוֹן כִּבְרֵיתָא וְאֵשָׁא מִן קֳדָם מֵימְרָא דַיְיָ מִן שְׁמַיָא", "pj_en": "And the Word of the Lord had caused showers of favour to descend upon Sedom and Amorah, to the intent that they might work repentance, but they did it not: so that they said, Wickedness is not manifest before the Lord. Behold, then, there are now sent down upon them sulphur and fire from before the Word of the Lord from Heaven.", "tj": "וּמֵימְרֵיהּ דַיְיָ הֲוָה מָחִית עַל עַמָא דִסְדוֹם וַעֲמוֹרָה מִיטְרִין דְרַעֲוָוא דִילְמָא דְיַעֲבְדוּן תְּתוּבָא מִן עוּבָדֵיהוֹן בִּישַׁיָא וְכֵוָון דַחָמְיָין מִטְרָא דְרַעֲוָוא הֲווֹ אָמְרִין דִילְמָא דְלֵית עוֹבָדֵינָן בִּישַׁיָא גְלַן קֳדָמוֹי חָזַר לְמֶהֱוֵי מָחִית עֲלֵיהוֹן גוּפְרֵיתָא וְאֵישָׁתָא מִן קֳדָם יְיָ מִן שְׁמַיָא:", "tj_en": "And the Word of the Lord Himself had made to descend upon the people of Sedom and Amorah showers of favour, that they might work repentance from their wicked works. But when they saw the showers of favour, they said, So, our wicked works are not manifest before Him. He turned (then), and caused to descend upon them bitumen and fire from before the Lord from the heavens.", "rashi": "<b>וה' המטיר.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר וַה' – הוּא וּבֵית דִּינוֹ:<br><br><b>המטיר על סדום.<\/b> בַּעֲלוֹת הַשַּׁחַר, כְּמוֹ שֶׁנֶּאֱמַר וּכְמוֹ הַשַּׁחַר עָלָה, שָׁעָה שֶׁהַלְּבָנָה עוֹמֶדֶת בָּרָקִיעַ עִם הַחַמָּה, לְפִי שֶׁהָיוּ מֵהֶם עוֹבְדִין לַחַמָּה וּמֵהֶם לַלְּבָנָה, אָמַר הַקָּבָּ\"ה אִם אֶפָּרַע מֵהֶם בַּיּוֹם, יִהְיוּ עוֹבְדֵי לְבָנָה אוֹמְרִים אִלּוּ הָיָה בַלַּיְלָה, כְּשֶׁהַלְּבָנָה מוֹשֶׁלֶת, לֹא הָיִינוּ חֲרֵבִין, וְאִם אֶפָּרַע מֵהֶם בַּלַּיְלָה, יִהְיוּ עוֹבְדֵי הַחַמָּה אוֹמְרִים אִלּוּ הָיָה בַּיּוֹם, כְּשֶׁהַחַמָּה מוֹשֶׁלֶת, לֹא הָיִינוּ חֲרֵבִין; לְכָךְ כְּתִיב וּכְמוֹ הַשַּׁחַר עָלָה, וְנִפְרַע מֵהֶם בְּשָׁעָה שֶׁהַחַמָּה וְהַלְּבָנָה מוֹשְׁלוֹת:<br><br><b>המטיר גפרית ואש.<\/b> בַּתְּחִלָּה מָטָר, וְנַעֲשָׂה גָּפְרִית וָאֵשׁ:<br><br><b>מאת ה'.<\/b> דֶּרֶךְ הַמִּקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ נְשֵׁי לֶמֶךְ, וְלֹא אָמַר נָשַׁי; וְכֵן אָמַר דָּוִד קְחוּ עִמָּכֶם אֶת עַבְדֵי אֲדֹנֵיכֶם (מלכים א א'), וְלֹא אָמַר מֵעֲבָדַי; וְכֵן אֲחַשְׁוֵרוֹשׁ אָמַר בְּשֵׁם הַמֶּלֶךְ, וְלֹא אָמַר בִּשְׁמִי; אַף כָּאן אָמַר, מֵאֵת ה' וְלֹא אָמַר מֵאִתִּי:<br><br><b>מן השמים.<\/b> הוּא שֶׁאָמַר הַכָּתוּב כִּי בָם יָדִין עַמִּים וְגוֹ' (איוב ל\"ו), כְּשֶׁבָּא לְיַסֵּר הֵבְּרִיוֹת מֵבִיא עֲלֵיהֶם אֵשׁ מִן הַשָּׁמַיִם, כְּמוֹ שֶׁעָשָׂה לִסְדוֹם, וּכְשֶׁבָּא לְהוֹרִיד הַמָּן מִן הַשָּׁמַיִם הִנְנִי מַמְטִיר לָכֶם לֶחֶם מִן הַשָּׁמָיִם (שמות ט\"ז):", "rashi_en": "וה' המטיר AND THE LORD CAUSED TO RAIN — Wherever it is said 'וה “And the Lord”, it means He and His Celestial Court (Genesis Rabbah 51:2).<br><br>המטיר על סדום HE CAUSED IT TO RAIN ON SODOM — When the morning broke), as it is said, (v. 15) “And when the morning dawned”, i. e. the time when the moon is in the sky together with the sun. As some of them worshipped the sun and others the moon, the Holy One, blessed be He, said, “If I punish them by day, the moon-worshippers may say, “If it had taken place at night when the moon rules we would not have been destroyed.” And if I punish them by night the sun-worshippers may say, “If it had taken place at day time when the sun rules we would not have been destroyed.” For this reason it is written, “And when the morning dawned” — He punished them at that time when both moon and sun are ruling (Genesis Rabbah 50:12).<br><br>המטיר גפרית ואש HE RAINED BRIMSTONE AND FIRE — At first it was rain (מטר) to see whether they would repent and this was then turned into brimstone and fire (Midrash Tanchuma, Beshalach 15).<br><br>'מאת ה FROM THE LORD — This is the Scriptural way of speaking (the Lord rained … from the Lord); e. g., (4:23) “Ye wives of Lamech” and he did not say “my wives”. Thus, too, did David say, (1 Kings 1:33) “Take with you the servants of your lord” and he did not say, “my servants” and so, too, did Ahasuerus say, (Ester 8:8) “in the king’s name” and did not say, “in my name”. So, also, here: “From the Lord” and He did not say, “from Him” (Genesis Rabbah 51:2).<br><br>מן השמים FROM HEAVEN — The text (Job 36:31) refers to this: “For by them (the heavens; see the preceding verses) He judges the peoples etc.” When God is about to punish mankind He brings upon them fire from heaven, just as He did to Sodom (cf. 5:32 of the same chapter); and when he caused the Manna to fall it was also from heaven (cf. the second half of 5:31) as it is said, (Exodus 16:4) “Behold I will rain bread from heaven for you” (Midrash Tanchuma, Vayera 10)."}, {"ch": 19, "v": 25, "aliyah": 4, "heb": "וַֽיַּהֲפֹךְ֙ אֶת־הֶעָרִ֣ים הָאֵ֔ל וְאֵ֖ת כׇּל־הַכִּכָּ֑ר וְאֵת֙ כׇּל־יֹשְׁבֵ֣י הֶעָרִ֔ים וְצֶ֖מַח הָאֲדָמָֽה׃", "onk": "וַהֲפַךְ יָת קִרְוַיָּא הָאִלֵּין וְיָת כָּל מֵישְׁרָא וְיָת כָּל יָתְבֵי קִרְוַיָּא וְצִמְחָא דְּאַרְעָא:", "onk_en": "He overturned these cities, and the entire plain, and all those who lived in the cities and all that grew upon the ground.", "pj": "וְהָפַךְ יַת קִרְוַויָא הָאִילֵין וְיַת כָּל מֵישְׁרָא וְיַת כָּל יַתְבֵי קִירְוַויָא וְצִמְחָא דְאַרְעָא", "pj_en": "And He overthrew those cities, and all the plain, and all the inhabitants of the cities, and the herbage of the earth.", "tj": "", "tj_en": "", "rashi": "<b>ויהפך את הערים וגו'.<\/b> אַרְבַּעְתָּם יוֹשְׁבוֹת בְּסֶלַע אֶחָד וַהֲפָכָן מִלְמַעְלָה לְמַטָּה, שֶׁנֶּאֱמַר בַּחַלָּמִישׁ שָׁלַח יָדוֹ וְגוֹ' (איוב כ'):", "rashi_en": "'ויהפוך את הערים וגו AND HE OVERTHREW [THOSE CITIES] etc. — The four cities were situated on one rock and He turned them upside down, as it is said, (Job 28:9) “He putteth forth His hand upon the flinty rock [and overturneth the mountains by the roots]” (Genesis Rabbah 51:4). "}, {"ch": 19, "v": 26, "aliyah": 4, "heb": "וַתַּבֵּ֥ט אִשְׁתּ֖וֹ מֵאַחֲרָ֑יו וַתְּהִ֖י נְצִ֥יב מֶֽלַח׃", "onk": "וְאִסְתְּכִיאַת אִתְּתֵיהּ מִבַּתְרוֹהִי וַהֲוַת קָמָא דְמִלְחָא:", "onk_en": "His [Lot’s] wife looked behind him; and she became a pillar of salt.", "pj": "וְאִיסְתַּכְּלַת אִינְתְּתֵיהּ מִבָּתַר מַלְאָכָא לְמִנְדוֹעַ מַה הֲוֵי בְּסוֹף בֵּיתֵיהּ דְאִיבָהּ דְהִיא הֲוַות מִבְּנַתְהוֹן דִסְדוֹמָאֵי וּמְטוּל דְחָטָת בְּמִלְחָא בְּפִירְסוּמֵי עַנְיָא הָא הִיא עֲבִידָא עַמוּד דְמֶלַח", "pj_en": "And his wife looked after the angel, to know what would be in the end of her father's house, for she was of the daughters of the Sedomaee; and because she sinned by salt (bemilcha) she was manifestly punished; behold, she was made a statue of salt.", "tj": "עַל דַהֲוַת אִתְּתֵיהּ דְלוֹט מִן בְּנֵי בְּנֵיהוֹן עַמָא דִסְדוֹם אִסְתַּכָּלַת מִן בַּתְרָהּ לְמִיחֲמֵי מַה הֱוֵי בְּסוֹף בַּיְיתֵיהּ דְאָבוּי וְהָא הִיא קַיָימָא עַמוּד דְמֶלַח עַד זְמַן דְתֵיתֵי תְחִיָה דְיֵיחוּן מֵתַיָא:", "tj_en": "And because the wife of Lot was of the children of the people of Sedom, she looked behind her, to see what would be the end of her father's house: and, behold, she was made to stand a statue of salt, until the time of the resurrection shall come, when the dead shall arise.", "rashi": "<b>ותבט אשתו מאחריו.<\/b> שֶׁל לוֹט:<br><br><b>ותהי נציב מלח.<\/b> בְּמֶלַח חָטְאָה וּבְמֶלַח לָקְתָה; אָמַר לָהּ תְּנִי מְעַט מֶלַח לָאוֹרְחִים הַלָּלוּ, אָמְרָה לוֹ אַף הַמִּנְהָג הָרַע הַזֶּה אַתָּה בָא לְהַנְהִיג בַּמָּקוֹם הַזֶּה (בראשית רבה):", "rashi_en": "ותבט אשתו מאחריו AND HIS WIFE LOOKED BACK FROM BEHIND HIM —behind Lot.<br><br>ותהי נציב מלח AND SHE BECAME A PILLAR OF SALT — By salt had she sinned and by salt was she punished. He (Lot) said to her once: “Give a little salt to these strangers” and she answered him, “Do you mean to introduce this bad custom, also, into our city?” (Genesis Rabbah 50:4). "}, {"ch": 19, "v": 27, "aliyah": 4, "heb": "וַיַּשְׁכֵּ֥ם אַבְרָהָ֖ם בַּבֹּ֑קֶר אֶ֨ל־הַמָּק֔וֹם אֲשֶׁר־עָ֥מַד שָׁ֖ם אֶת־פְּנֵ֥י יְהֹוָֽה׃", "onk": "וְאַקְדֵּים אַבְרָהָם בְּצַפְרָא <b>לְאַתְרָא דִּשַׁמֵּשׁ תַּמָּן בִּצְלוֹ קֳדָם יְיָ<\/b>:", "onk_en": "Avraham got up early in morning [to return] to the place where he had stood before the Presence of Adonoy [<b>to the place where he had served in prayer before Adonoy<\/b>].", "pj": "וְאַקְדִים אַבְרָהָם בְּצַפְרָא לְאַתְרָא דְשַׁמֵשׁ תַּמָן בִּצְלוֹ קֳדָם יְיָ", "pj_en": "And Abraham arose in the morning (and went) to the place where he had ministered in prayer before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 28, "aliyah": 4, "heb": "וַיַּשְׁקֵ֗ף עַל־פְּנֵ֤י סְדֹם֙ וַעֲמֹרָ֔ה וְעַֽל־כׇּל־פְּנֵ֖י אֶ֣רֶץ הַכִּכָּ֑ר וַיַּ֗רְא וְהִנֵּ֤ה עָלָה֙ קִיטֹ֣ר הָאָ֔רֶץ כְּקִיטֹ֖ר הַכִּבְשָֽׁן׃", "onk": "וְאִסְתְּכִי עַל אַפֵּי סְדוֹם וַעֲמוֹרָה וְעַל כָּל אַפֵּי אַרְעָא דְמֵישְׁרָא וַחֲזָא וְהָא סְלִיק תְּנָנָא דְאַרְעָא כִּתְנָנָא דְאַתּוּנָא:", "onk_en": "He [Avraham] stared at Sedom and Amorah, and the whole land of the plain, and he saw the heavy smoke rising from the earth like the smoke of a furnace.", "pj": "וְאוֹדִיק עַל אַנְפֵּי סְדוֹם וַעֲמוֹרָה וְעַל כָּל אַנְפֵּי אֲרַע מֵישְׁרָא וַחֲמָא וְהָא סְלֵיק קוּטְרָא דְאַרְעָא הוּא כְּקוּטְרָא דְאַתּוּנָא", "pj_en": "And he looked towards Sedom and Amorah, and all the land of the plain, and saw, and, behold, the smoke of the land went up as the smoke of a furnace.", "tj": "", "tj_en": "", "rashi": "<b>קיטור.<\/b> תִּמּוּר שֶׁל עָשָׁן, טורק\"א בלע\"ז:<br><br><b>הכבשן.<\/b> חֲפִירָה שֶׁשּׂוֹרְפִין בָּה אֶת הָאֲבָנִים לְסִיד, וְכֵן כָּל כִּבְשָׁן שֶׁבַּתּוֹרָה:", "rashi_en": "קיטר signifies a column of smoke. old French torche; English torch.<br><br>הכבשן A FURNACE — an excavation in which they burn stone to lime. This is the meaning of כבשן wherever it occurs in the Torah. "}, {"ch": 19, "v": 29, "aliyah": 4, "heb": "וַיְהִ֗י בְּשַׁחֵ֤ת אֱלֹהִים֙ אֶת־עָרֵ֣י הַכִּכָּ֔ר וַיִּזְכֹּ֥ר אֱלֹהִ֖ים אֶת־אַבְרָהָ֑ם וַיְשַׁלַּ֤ח אֶת־לוֹט֙ מִתּ֣וֹךְ הַהֲפֵכָ֔ה בַּהֲפֹךְ֙ אֶת־הֶ֣עָרִ֔ים אֲשֶׁר־יָשַׁ֥ב בָּהֵ֖ן לֽוֹט׃", "onk": "וַהֲוָה בְּחַבָּלוּת (<small>נ\"י<\/small> כַּד חֲבַל) יְיָ יָת קִרְוֵי מֵישְׁרָא וּדְכִיר יְיָ יָת אַבְרָהָם וְשַׁלַּח יָת לוֹט מִגּוֹ הֲפֶכְתָּא כַּד הֲפַךְ יָת קִרְוַיָּא דִּי הֲוָה יָתֵב בְּהֵן לוֹט:", "onk_en": "When Elohim destroyed the cities of the plain; Elohim remembered Avraham, and He sent Lot out of the upheaval when He overturned the cities in which Lot had lived.", "pj": "וַהֲוָה בְּחַבְּלוּת יְיָ יַת קִירְוֵי מֵישְׁרָא וּדְכִיר יְיָ יַת זְכוּתֵיהּ דְאַבְרָהָם וּשְׁלַח יַת לוֹט מִגוֹ הֲפֵיכְתָּא כַּד הָפַךְ יַת קִירְוַיָא דִי הֲוָה יָתִיב בְּהוֹן לוֹט", "pj_en": "And it was when the Lord destroyed the cities of the plain, that He remembered the righteousness of Abraham, and sent forth Lot from the midst of the overthrow, when He overthrew the cities wherein Lot had dwelt.", "tj": "", "tj_en": "", "rashi": "<b>ויזכור אלהים את אברהם.<\/b> מַהוּ זְכִירָתוֹ שֶׁל אַבְרָהָם עַל לוֹט? נִזְכַּר שֶׁהָיָה לוֹט יוֹדֵעַ שֶׁשָּׂרָה אִשְׁתּוֹ שֶׁל אַבְרָהָם וְשָׁמַע שֶׁאָמַר אַבְרָהָם בְּמִצְרַיִם עַל שָׂרָה אֲחוֹתִי הִיא, וְלֹא גִלָּה הַדָּבָר, שֶׁהָיָה חָס עָלָיו, לְפִיכָךְ חָס הַקָּבָּ\"ה עָלָיו (בראשית רבה):", "rashi_en": "ויזכר אלהים את אברהם GOD REMEMBERED ABRAHAM — What bearing has God’s remembering Abraham upon the rescue of Lot? He remembered that Lot knew that Sarah was Abraham’s wife and that when he heard that Abraham said in Egypt regarding Sarah, “She is my sister”, he did not betray him because he had sympathy with him. For this reason God had mercy upon him (Lot) (Genesis Rabbah 51:6). "}, {"ch": 19, "v": 30, "aliyah": 4, "heb": "וַיַּ֩עַל֩ ל֨וֹט מִצּ֜וֹעַר וַיֵּ֣שֶׁב בָּהָ֗ר וּשְׁתֵּ֤י בְנֹתָיו֙ עִמּ֔וֹ כִּ֥י יָרֵ֖א לָשֶׁ֣בֶת בְּצ֑וֹעַר וַיֵּ֙שֶׁב֙ בַּמְּעָרָ֔ה ה֖וּא וּשְׁתֵּ֥י בְנֹתָֽיו׃", "onk": "וּסְלֵק לוֹט מִצּוֹעַר וִיתֵב בְּטוּרָא וְתַרְתֵּין בְּנָתֵיהּ עִמֵּיהּ אֲרֵי דָחִיל לְמִתַּב בְּצוֹעַר וִיתֵב בִּמְעַרְתָּא הוּא וְתַרְתֵּין בְּנָתֵיהּ:", "onk_en": "Lot went up from Zoar and lived in the mountain; and his two daughters went with him, for he was afraid to live in Zoar. He lived in a cave, he and his two daughters.", "pj": "וּסְלֵיק לוֹט מִן זוֹעַר וְיָתִיב בְּטַוְורָא וְתַרְתֵּין בְּנָתֵיהּ עִמֵיהּ אֲרוּם הֲוָה דָחִיל לְמֵיתַב בְּזוֹעַר וִיתֵיב בִמְעַרְתָּא הוּא וְתַרְתֵּין בְּנָתֵיהּ", "pj_en": "And Lot went up from Zoar, and dwelt in the mountain, and his two daughters with him; because he feared to reside in Zoar. And he dwelt in a cavern, he and his two daughters.", "tj": "", "tj_en": "", "rashi": "<b>כי ירא לשבת בצוער.<\/b> לְפִי שֶׁהָיְתָה קְרוֹבָה לִסְדוֹם:", "rashi_en": "כי ירא לשבת בצוער FOR HE FEARED TO DWELL IN ZOAR, because it was near to Sodom."}, {"ch": 19, "v": 31, "aliyah": 4, "heb": "וַתֹּ֧אמֶר הַבְּכִירָ֛ה אֶל־הַצְּעִירָ֖ה אָבִ֣ינוּ זָקֵ֑ן וְאִ֨ישׁ אֵ֤ין בָּאָ֙רֶץ֙ לָב֣וֹא עָלֵ֔ינוּ כְּדֶ֖רֶךְ כׇּל־הָאָֽרֶץ׃", "onk": "וַאֲמֶרֶת רַבְּתָא לִזְעֶרְתָּא אֲבוּנָא סִיב וּגְבַר לֵית בְּאַרְעָא לְמֵיעַל עֲלָנָא כְּאוֹרַח כָּל אַרְעָא:", "onk_en": "The older girl said to the younger, Our father is old, and there is no man [left] on earth who will come into us in the normal manner.", "pj": "וַאֲמָרַת רַבְּתָא לִזְעֵירְתָּא אָבוּנָא סִיב וּגְבַר לֵית בְּאַרְעָא לְמֵיעַל עֲלָנָא כְּאוֹרַח כָּל אַרְעָא", "pj_en": "And the elder said to the less, Our father is old, and there is no man in the land to come to us after the way of the whole earth:", "tj": "וּגְבַר לֵית בְּאַרְעָא לְמִזְדַמְנָא לְוָותָן כְּנִימוּס כָּל אַרְעָא:", "tj_en": "And there is not a man in the land who may come with us after the law of all the earth:", "rashi": "<b>אבינו זקן.<\/b> וְאִם לֹא עַכְשָׁו אֵימָתַי? שֶׁמָּא יָמוּת אוֹ יִפְסֹק מֵהוֹלִיד:<br><br><b>ואיש אין בארץ.<\/b> סְבוּרוֹת הָיוּ שֶׁכָּל הָעוֹלָם נֶחֱרַב כְּמוֹ בְּדוֹר הַמַּבּוּל: (בראשית רבה):", "rashi_en": "אבינו זקן OUR FATHER IS OLD — And if not now, when? He may die or may cease to beget children.<br><br>ואיש אין בארץ AND THERE IS NOT A MAN IN THE EARTH — They thought that the whole world had been destroyed as in the time of the generation of the Flood. (Genesis Rabbah 51:8). "}, {"ch": 19, "v": 32, "aliyah": 4, "heb": "לְכָ֨ה נַשְׁקֶ֧ה אֶת־אָבִ֛ינוּ יַ֖יִן וְנִשְׁכְּבָ֣ה עִמּ֑וֹ וּנְחַיֶּ֥ה מֵאָבִ֖ינוּ זָֽרַע׃", "onk": "אִיתָא נַשְׁקֵי יָת אֲבוּנָא חַמְרָא וְנִשְׁכּוּב עִמֵּיהּ וּנְקַיֵּם מֵאֲבוּנָא בְּנִין:", "onk_en": "Come let us urge our father to drink wine, and sleep with him; that we may give life to seed [children] from our father.", "pj": "אִיתָא נַשְׁקֵי יַת אָבוּנָא חֲמַר וְכַד יְהֵי רַוֵי נְשַׁמֵשׁ עִימֵהּ וּנְקַיֵים מֵאֲבוּנָא בְּנִין", "pj_en": "come, let us make our father drink wine, and when he is drunken we will lie with him, and raise up sons from our father.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 33, "aliyah": 4, "heb": "וַתַּשְׁקֶ֧יןָ אֶת־אֲבִיהֶ֛ן יַ֖יִן בַּלַּ֣יְלָה ה֑וּא וַתָּבֹ֤א הַבְּכִירָה֙ וַתִּשְׁכַּ֣ב אֶת־אָבִ֔יהָ וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ וּבְקוּׄמָֽהּ׃", "onk": "וְאַשְׁקִיאָה יָת אֲבוּהֵן חַמְרָא בְּלֵילְיָא הוּא וְעַלַּת רַבְּתָא וּשְׁכִיבָא עִם אֲבוּהָא וְלָא יְדַע בְּמִשְׁכְּבַהּ וּבְקִימַהּ:", "onk_en": "They urged wine upon their father that night; and the older girl went in and slept with her father. He was not aware that she lay down or got up.", "pj": "וְאַשְׁקִיאָן יַת אֲבוּהוֹן חֲמַר בְּלֵילָא הַהוּא וְרָוָא וְקָמַת רַבְּתָא וְשַׁמֵישַׁת עִם אֲבוּהָא וְלָא יְדַע בְּמִשְׁכָּבָהּ וְלָא יְדַע בְּמִיקְמָהּ", "pj_en": "And they made their father drink wine that night, and he was drunk. And the elder arose, and lay with her father, nor did he know when she lay down, nor when she arose.", "tj": "", "tj_en": "", "rashi": "<b>ותשקין וגו'.<\/b> יַיִן נִזְדַּמֵּן לָהֶן בַּמְּעָרָה לְהוֹצִיא מֵהֶן שְׁנֵי אֻמּוֹת:<br><br><b>ותשכב את אביה.<\/b> וּבַצְּעִירָה כְתִיב וַתִּשְׁכַּב עִמּוֹ? צְעִירָה, לְפִי שֶׁלֹּא פָּתְחָה בִזְנוּת אֶלָּא אֲחוֹתָהּ לִמְּדַתָּה חָסַךְ עָלֶיהָ הַכָּתוּב וְלֹא פֵּרֵשׁ גְּנוּתָהּ; אֲבָל בְּכִירָה שֶׁפָּתְחָה בִזְנוּת פִּרְסְמָהּ הַכָּתוּב בִּמְפֹרָשׁ.<br><br><b>ובקומה.<\/b> שֶׁל בְּכִירָה נָקוּד, לוֹמַר, שֶׁבְּקוּמָהּ יָדַע, וְאַעַפּ\"כֵ לֹא נִשְׁמַר לַיִל שֵׁנִי מִלִּשְׁתּוֹת. אָמַר רַבִּי לֵוִי כָּל מִי שֶׁהוּא לָהוּט אַחַר בּוּלְמוּס שֶׁל עֲרָיוֹת לַסּוֹף מַאֲכִילִים אוֹתוֹ מִבְּשָׂרוֹ:", "rashi_en": "'ותשקין וגו AND THEY MADE THEIR FATHER DRINK [WINE] etc. — Wine was at hand for them in the cave out of a set purpose that they might bring forth two nations (Midrash Tanchuma, Beshalach 12).<br><br>ותשכב את אביה AND SHE LAY WITH HER FATHER — In the case of the younger daughter it is written (Genesis 19:35) “and she lay with him”, and it does not state “she lay with her father”. But because the younger did not originate this unchaste conduct but her sister taught it to her, Scripture glosses over her sin and does not explicitly make mention of her shame; but since the elder originated this unchaste conduct Scripture exposes her fully (Numbers Rabbah 20:23).<br><br>ובקומה NOR WHEN SHE AROSE — This word where it occurs with reference to the elder sister (Genesis 19:33) has dots above it (as though it is not written at all), implying that when she arose, he (Lot) was aware of it, and yet he did not take care on the second night to abstain from wine. (Horayot 10b.) R. Levi said, Whoever is inflamed by sexual desire will, in the end, be made to eat his own flesh (Genesis Rabbah 51:9). "}, {"ch": 19, "v": 34, "aliyah": 4, "heb": "וַֽיְהִי֙ מִֽמׇּחֳרָ֔ת וַתֹּ֤אמֶר הַבְּכִירָה֙ אֶל־הַצְּעִירָ֔ה הֵן־שָׁכַ֥בְתִּי אֶ֖מֶשׁ אֶת־אָבִ֑י נַשְׁקֶ֨נּוּ יַ֜יִן גַּם־הַלַּ֗יְלָה וּבֹ֙אִי֙ שִׁכְבִ֣י עִמּ֔וֹ וּנְחַיֶּ֥ה מֵאָבִ֖ינוּ זָֽרַע׃", "onk": "וַהֲוָה בְּיוֹמָא דְבַתְרוֹהִי וַאֲמֶרֶת רַבְּתָא לִזְעֶרְתָּא הָא שְׁכֵיבִית רַמְשָׁא עִם אַבָּא נַשְׁקִנֵּהּ חַמְרָא אַף בְּלֵילְיָא וְעוּלִי שְׁכִיבִי עִמֵּיהּ וּנְקַיֵּם מֵאֲבוּנָא בְּנִין:", "onk_en": "The next day, the older girl said to the younger, Last night I slept with my father. Let us urge wine upon him tonight also, and you go in and sleep with him that we may give life to seed from our father.", "pj": "וַהֲוָה מִיוֹמָחֳרָא וַאֲמָרַת רַבְּתָא לִזְעֵירְתָּא הָא כְּבַר שִׁמְשֵׁית רַמְשִׁי עִם אַבָּא נַשְׁקִינֵיהּ חַמְרָא אוּף בְּלֵילָא דֵין וִירְוֵי וְעוּלִי שִׁימוּשִׁי עִמֵיהּ וּנְקַיֵים מֵאָבוּנָא בְּנִין", "pj_en": "And it was the day following, and the elder said to the less, Behold, now, I lay my evening with the father; let us make him drink wine this night also, that he may be drunk; and go thou and lie with him, that we may raise up sons from our father.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 35, "aliyah": 4, "heb": "וַתַּשְׁקֶ֜יןָ גַּ֣ם בַּלַּ֧יְלָה הַה֛וּא אֶת־אֲבִיהֶ֖ן יָ֑יִן וַתָּ֤קׇם הַצְּעִירָה֙ וַתִּשְׁכַּ֣ב עִמּ֔וֹ וְלֹֽא־יָדַ֥ע בְּשִׁכְבָ֖הּ וּבְקֻמָֽהּ׃", "onk": "וְאַשְׁקִיאָה אַף בְּלֵילְיָא הַהוּא יָת אֲבוּהֵן חַמְרָא וְקָמַת זְעֶרְתָּא וּשְׁכִיבַת עִמֵּיהּ וְלָא יְדַע בְּמִשְׁכְּבַהּ וּבְקִימַהּ:", "onk_en": "That night also, they urged their father [to drink] wine. The younger went up and slept with him, and he was not aware that she lay down or got up.", "pj": "וְאַשְׁקִיאָן אוּף בְּלֵילָא הַהוּא יַת אֲבוּהוֹן חֲמַר וְרַוֵי וְקָמַת זְעֵירְתָּא וְשַׁמִישַׁת עִמֵיהּ וְלָא יָדַע בְּמִשְׁכְּבָהּ וְלָא בְּמִקְמָהּ", "pj_en": "And they made their father drink wine that night also, and he was drunk, and the younger arose, and lay with him; and he knew not in her lying down nor in her rising up.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 36, "aliyah": 4, "heb": "וַֽתַּהֲרֶ֛יןָ שְׁתֵּ֥י בְנֽוֹת־ל֖וֹט מֵאֲבִיהֶֽן׃", "onk": "וְעַדִּיאַן תַּרְתֵּין בְּנַת לוֹט מֵאֲבוּהֵן:", "onk_en": "Lot’s two daughters became pregnant from their father.", "pj": "וְאִתְעַבְּרַן תַּרְתֵּין בְּנַת לוֹט מֵאֲבוּהוֹן", "pj_en": "And the two daughters of Lot became with child by their father.", "tj": "", "tj_en": "", "rashi": "<b>ותהרין וגו'.<\/b> אַעַ\"פִּ שֶׁאֵין הָאִשָּׁה מִתְעַבֶּרֶת מִבִּיאָה רִאשׁוֹנָה, אֵלּוּ שָׁלְטוּ בְעַצְמָן וְהוֹצִיאוּ עֶרְוָתָן לַחוּץ וְנִתְעַבְּרוּ מִבִּיאָה רִאשׁוֹנָה:", "rashi_en": "ותהרין וגו AND THEY BECAME PREGNANT, ETC. — Even though a woman does not become pregnant from the first intercourse, these [women] mastered themselves and took out their hymens; and they became pregnant from the first intercourse (Genesis Rabbah 51:9)."}, {"ch": 19, "v": 37, "aliyah": 4, "heb": "וַתֵּ֤לֶד הַבְּכִירָה֙ בֵּ֔ן וַתִּקְרָ֥א שְׁמ֖וֹ מוֹאָ֑ב ה֥וּא אֲבִֽי־מוֹאָ֖ב עַד־הַיּֽוֹם׃", "onk": "וִילִידַת רַבְּתָא בַּר וּקְרַת שְׁמֵיהּ מוֹאָב הוּא אֲבוּהוֹן דְּמוֹאָבָא עַד יוֹמָא דֵין:", "onk_en": "The older girl gave birth to a son and she named him Moav. He is the ancestor of the Moabite nation even to this day.", "pj": "וִילֵידַת רַבְּתָא בַּר וּקְרַת שְׁמֵיהּ מוֹאָב אֲרוּם מֵאֲבוּהָא אִתְעַבָּרַת הוּא אֲבוּהוֹם דְמוֹאֲבָאֵי עַד יוֹמָא דֵין", "pj_en": "And the elder brought forth a son, and she called his name Moab, because from her father she had conceived. He is the father of the Moabaee unto this day.", "tj": "", "tj_en": "", "rashi": "<b>מואב.<\/b> זוֹ שֶׁלֹּא הָיְתָה צְנוּעָה פֵּרְשָׁה שֶׁמֵּאָבִיהָ הוּא, אֲבָל צְעִירָה קְרָאַתּוּ בְלָשׁוֹן נְקִיָּה, וְקִבְּלָה שָׂכָר בִּימֵי מֹשֶׁה, שֶׁנֶּאֱמַר בִּבְנֵי עַמּוֹן אַל תִּתְגָּר בָּם (דברים ב') – כְּלָל, וּבְמוֹאָב לֹא הִזְהִיר אֶלָּא שֶׁלֹּא יִלָּחֵם בָּם, אֲבָל לְצַעֲרָן הִתִּיר לוֹ:", "rashi_en": "מואב MOAB — This daughter who was immodest openly proclaimed that the son was born of her father (מֵאָב) but the younger named her child in a euphemistic fashion and was rewarded for this at the time of Moses, as it is said regarding the children of Ammon, (Deuteronomy 2:19) “Do not contend with them” — in any manner at all — whereas in reference to Moab it (Scripture) only forbade waging war against them but permitted them (the Israelites) to vex them (Genesis Rabbah 51:11)."}, {"ch": 19, "v": 38, "aliyah": 4, "heb": "וְהַצְּעִירָ֤ה גַם־הִוא֙ יָ֣לְדָה בֵּ֔ן וַתִּקְרָ֥א שְׁמ֖וֹ בֶּן־עַמִּ֑י ה֛וּא אֲבִ֥י בְנֵֽי־עַמּ֖וֹן עַד־הַיּֽוֹם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּזְעֶרְתָּא אַף הִיא יְלִידַת בַּר וּקְרַת שְׁמֵיהּ בַּר עַמִּי הוּא אֲבוּהוֹן דִּבְנֵי עַמּוֹן עַד יוֹמָא דֵין:", "onk_en": "The younger girl also gave birth to a son, and she named him Ben-Ami. He is the ancestor of the people of Ammon even to this day.", "pj": "וּזְעֵירְתָּא אוּף הִיא יְלִידַת בַּר וּקְרַת יַת שְׁמֵיהּ בַּר עַמִי אֲרוּם בַּר אֲבוּהָא הוּא אֲבוּהוֹן דְעַמָא דְעַמוֹנָאֵי עַד זְמַן יוֹמָא דֵין", "pj_en": "And the younger also brought forth a son, and she called his name Bar-Ammi, because he was the son of her father. He is the father of the Ammonite people unto this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 1, "aliyah": 4, "heb": "וַיִּסַּ֨ע מִשָּׁ֤ם אַבְרָהָם֙ אַ֣רְצָה הַנֶּ֔גֶב וַיֵּ֥שֶׁב בֵּין־קָדֵ֖שׁ וּבֵ֣ין שׁ֑וּר וַיָּ֖גׇר בִּגְרָֽר׃", "onk": "וּנְטַל מִתַּמָּן אַבְרָהָם לְאַרְעָא דָרוֹמָא וִיתֵב בֵּין <b>רְקָם<\/b> וּבֵין <b>חַגְרָא<\/b> וְאִתּוֹתַב בִּגְרָר:", "onk_en": "Avraham journeyed from there to the land of the Negev [<b>south<\/b>], and he lived between Kadeish [<b>Rekem<\/b>] and Shur [<b>Chagar<\/b>]. He lived for a while in Gerar.", "pj": "וּנְטַל מִתַּמָן אַבְרָהָם לְאַרְעָא דְרוֹמָא וְיָתִיב בֵּינֵי רְקָם וּבֵינֵי חַגְרָא וְאִתְנְתֵיב בִּגְרָר", "pj_en": "And Abraham went on from thence to the land of the south, and dwelt between Rekam and Chagra, and had his habitation in Gerar.", "tj": "", "tj_en": "", "rashi": "<b>ויסע משם אברהם.<\/b> כְּשֶׁרָאָה שֶׁחָרְבוּ הַכְּרַכִּים וּפָסְקוּ הָעוֹבְרִים וְהַשָּׁבִים, נָסַע לוֹ מִשָּׁם. דָּ\"אַ לְהִתְרַחֵק מִלּוֹט, שֶׁיָּצָא עָלָיו שֵׁם רָע, שֶׁבָּא עַל בְּנוֹתָיו:", "rashi_en": "ויסע משם אברהם AND ABRAHAM JOURNEYED FROM THENCE—When he observed that the cities had been destroyed and travellers ceased to pass to and fro, he went away from there. Another explanation is: he journeyed from there to get away from Lot who had gained an evil reputation because of his intercourse with his daughters (Genesis Rabbah 52:3-4). "}, {"ch": 20, "v": 2, "aliyah": 4, "heb": "וַיֹּ֧אמֶר אַבְרָהָ֛ם אֶל־שָׂרָ֥ה אִשְׁתּ֖וֹ אֲחֹ֣תִי הִ֑וא וַיִּשְׁלַ֗ח אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ גְּרָ֔ר וַיִּקַּ֖ח אֶת־שָׂרָֽה׃", "onk": "וַאֲמַר אַבְרָהָם עַל שָׂרָה אִתְּתֵיהּ אֲחָתִי הִיא וּשְׁלַח אֲבִימֶלֶךְ מַלְכָּא דִגְרָר וּדְבַר יָת שָׂרָה:", "onk_en": "Avraham said regarding Sarah, his wife, She is my sister. Avimelech, king of Gerar sent [messengers] and took Sarah.", "pj": "וַאֲמַר אַבְרָהָם עַל שָרָה אִנְתְּתֵיהּ אֲחוֹתִי הִיא וְשַׁדַר אֲבִימֶלֶךְ מַלְכָּא דִגְרָר וּדְבַר יַת שָרָה", "pj_en": "And Abraham said concerning Sarah his wife, She is my sister. And Abimelek, king of Gerar, sent and took Sarah.", "tj": "מַלְכָּא דַעֲרָד:", "tj_en": "King of Arad.", "rashi": "<b>ויאמר אברהם.<\/b> כָּאן לֹא נָטַל רְשׁוּת אֶלָּא עַל כָּרְחָהּ שֶׁלֹּא בְטוֹבָתָהּ, לְפִי שֶׁכְּבָר לֻקְּחָה לְבֵית פַּרְעֹה עַל יְדֵי כֵן:<br><br><b>אל שרה אשתו.<\/b> עַל שָׂרָה אִשְׁתּוֹ, כַּיוֹצֵא בוֹ אֶל הִלָּקַח אֲרוֹן וְגוֹ' וְאֶל מוֹת חָמִיהָ (שמואל א ד'), שְׁנֵיהֶם בִּלְשׁוֹן עַל:", "rashi_en": "ויאמר אברהם AND ABRAHAM SAID — This time he did not ask her consent but forcibly and against her inclination he stated that she was his sister, because she had already been taken once to Pharaoh’s house on account of this (Genesis Rabbah 52:4).<br><br>אל שרה אשתו OF SARAH HIS WIFE — means in reference to (אֶל in sense of עַל) just as (1 Samuel 4:21) “in reference to (אל) the ark of God being taken, and in reference to (אל) her father-in-law”, where the word אל, in both cases, has the same meaning as על. "}, {"ch": 20, "v": 3, "aliyah": 4, "heb": "וַיָּבֹ֧א אֱלֹהִ֛ים אֶל־אֲבִימֶ֖לֶךְ בַּחֲל֣וֹם הַלָּ֑יְלָה וַיֹּ֣אמֶר ל֗וֹ הִנְּךָ֥ מֵת֙ עַל־הָאִשָּׁ֣ה אֲשֶׁר־לָקַ֔חְתָּ וְהִ֖וא בְּעֻ֥לַת בָּֽעַל׃", "onk": "<b>וַאֲתָא מֵימַר מִן קֳדָם יְיָ לְוַת אֲבִימֶלֶךְ<\/b> בְּחֶלְמָא דְלֵילְיָא וַאֲמַר לֵיהּ הָא אַתְּ מִית עַל עֵיסַק אִתְּתָא דִדְבַרְתָּא וְהִיא <b>אִתַּת גְּבָר<\/b>:", "onk_en": "Elohim came to Avimelech [<b>Word came from before Elohim to Avimelech<\/b>] in a dream at night, and said to him, Behold, you shall die because of the woman you took, for she is a married woman [<b>a man’s wife<\/b>].", "pj": "וְאָתָא מֵימַר מִן קֳדָם יְיָ לְוַת אֲבִימֶלֶךְ בְּחֶלְמָא דְלֵילְיָא וַאֲמַר לֵיהּ הָא אַנְתְּ מַיִית עַל עֵיסַק אִנְתְּתָא דְאַנַסְתְּ וְהִיא מְבַעֲלָא לִגְבַר", "pj_en": "And a word came from before the Lord unto Abimelek, in a dream of the night, and said to him, Behold, thou diest, because of the woman whom thou hast carried away, and she a man's wife.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 4, "aliyah": 4, "heb": "וַאֲבִימֶ֕לֶךְ לֹ֥א קָרַ֖ב אֵלֶ֑יהָ וַיֹּאמַ֕ר אֲדֹנָ֕י הֲג֥וֹי גַּם־צַדִּ֖יק תַּהֲרֹֽג׃", "onk": "וַאֲבִימֶלֶךְ לָא קְרֵב לְוָתַהּ וַאֲמַר יְיָ הֲעָם אַף זַכַּאי תִּקְטוֹל:", "onk_en": "Avimelech had not come near to her. He said, My Master, will You also kill an innocent nation?", "pj": "וַאֲבִימֶלֶךְ לָא קָרִיב לְגַבָּה לִמְסַאֲבָהּ וְאָמַר יְיָ הֲבַר עַמְמִין דְלָא חַב אוּף חָמֵי לֵיהּ לְמִזְכֵּי בְּדִינָא אִתְקְטֵיל", "pj_en": "But Abimelek had not come nigh to defile her; and he said, Lord, shall the son of a people who hath not sinned, and whom it is right to absolve in the judgment, be killed?", "tj": "", "tj_en": "", "rashi": "<b>לא קרב אליה.<\/b> הַמַּלְאָךְ מְנָעוֹ, כְּמוֹ שֶׁנֶּאֱמַר לֹא נְתַתִּיךָ לִנְגֹּעַ אֵלֶיהָ:<br><br><b>הגוי גם צדיק תהרג.<\/b> אַף אִם הוּא צַדִּיק תַּהַרְגֶנּוּ, שֶׁמָּא כָךְ דַּרְכְּךָ לְאַבֵּד הָאֻמּוֹת חִנָּם? כָּךְ עָשִׂיתָ לְדוֹר הַמַּבּוּל וּלְדוֹר הַפַּלָּגָה, אַף אֲנִי אוֹמֵר שֶׁהֲרַגְתָּם עַל לֹא דָבָר, כְּמוֹ שֶׁאַתָּה אוֹמֵר לְהָרְגֵנִי:", "rashi_en": "לא קרב אליה HE HAD NOT COME NEAR HER — The Angel prevented him, as it is said (v. 6) “I have not permitted thee to touch her” (cf. Genesis Rabbah 52).<br><br>הגוי גם צדיק תהרוג WILT THOU SLAY ALSO A RIGHTEOUS NATION? — Even though it be righteous will you slay it? Is such perhaps Your usual way— to destroy nations without cause? That is what you did to the generation of the Flood and to the generation of the Dispersal. I may indeed say that you slew them without proper cause, just as you think to kill me without cause (Genesis Rabbah 52:6). "}, {"ch": 20, "v": 5, "aliyah": 4, "heb": "הֲלֹ֨א ה֤וּא אָֽמַר־לִי֙ אֲחֹ֣תִי הִ֔וא וְהִֽיא־גַם־הִ֥וא אָֽמְרָ֖ה אָחִ֣י ה֑וּא בְּתׇם־לְבָבִ֛י וּבְנִקְיֹ֥ן כַּפַּ֖י עָשִׂ֥יתִי זֹֽאת׃", "onk": "הֲלָא הוּא אֲמַר לִי אֲחָתִי הִיא וְהִיא אַף הִיא אֲמָרַת אָחִי הוּא <b>בְּקַשִּׁיטוּת<\/b> לִבִּי <b>וּבְזַכָּאוּת<\/b> יְדַי עֲבָדִית דָּא:", "onk_en": "Did he not say to me, She is my sister? And she also said, He is my brother. With an innocent [<b>upright<\/b>] heart and clean [<b>righteous<\/b>] hands I did this.", "pj": "הֲלָא הוּא אָמַר לִי דְאָחַת הִיא וְהִיא אוּף הִיא אָמְרַת אָחִי הוּא בְּקַשְׁטוּת לְבָבִי וּבְזַכְּאוּת יְדִי עֲבָדִית דָא", "pj_en": "Did he not tell me, She is my sister? and did not she also say, He is my brother? In the truthfulness of my heart and the innocency of my hands have I done this.", "tj": "", "tj_en": "", "rashi": "<b>גם הוא.<\/b> לְרַבּוֹת עֲבַדִים וְגַמָּלִים וְחַמָּרִים שֶׁלָּהּ, אֶת כֻּלָּם שָׁאַלְתִּי וְאָמְרוּ לִי אָחִיהָ הוּא:<br><br><b>בתם לבבי.<\/b> שֶׁלֹּא דִמִּיתִי לַחֲטֹא:<br><br><b>ובנקיון כפי.<\/b> נָקִי אֲנִי מִן הַחֵטְא, שֶׁלֹּא נָגַעְתִּי בָהּ:", "rashi_en": "גם הוא ALSO SHE HERSELF — The word “also” presupposes that others also said the same: it serves to include her servants, cameldrivers and assdrivers — all these I asked and they told me, “He is her brother” (Genesis Rabbah 52:6).<br><br>בתם לבבי IN THE INTEGRITY OF MY HEART —I did not intend to sin.<br><br>ובנקיון כפי AND IN THE INNOCENCY OF MY HANDS —I am innocent of this sin because I have not touched her. "}, {"ch": 20, "v": 6, "aliyah": 4, "heb": "וַיֹּ֩אמֶר֩ אֵלָ֨יו הָֽאֱלֹהִ֜ים בַּחֲלֹ֗ם גַּ֣ם אָנֹכִ֤י יָדַ֙עְתִּי֙ כִּ֤י בְתׇם־לְבָבְךָ֙ עָשִׂ֣יתָ זֹּ֔את וָאֶחְשֹׂ֧ךְ גַּם־אָנֹכִ֛י אֽוֹתְךָ֖ מֵחֲטוֹ־לִ֑י עַל־כֵּ֥ן לֹא־נְתַתִּ֖יךָ לִנְגֹּ֥עַ אֵלֶֽיהָ׃", "onk": "וַאֲמַר לֵיהּ <b>מֵימַר מִן קֳדָם יְיָ<\/b> בְּחֶלְמָא <b>אַף קֳדָמַי גְּלֵי<\/b> אֲרֵי <b>בְּקַשִּׁיטוּת<\/b> לִבָּךְ עָבָדְתָּ דָּא וּמְנָעִית אַף אֲנָא יָתָךְ מִלְּמֶחְטֵי <b>קֳדָמָי<\/b> עַל כֵּן לָא שְׁבַקְתָּךְ לְמִקְרַב לְוָתַהּ:", "onk_en": "Elohim said to him [<b>Word from Elohim was said to him<\/b>] in a dream, I also know [<b>it is also revealed before me<\/b>] that you did this with an innocent [<b>upright<\/b>] heart. I also prevented you from sinning against [<b>before<\/b>] Me. That is why I did not give you the chance to touch her.", "pj": "וַאֲמַר לֵיהּ מֵימְרָא דַיְיָ בְּחֵילְמָא אוּף קֳדָמַי גְלֵי אֲרוּם בְּקַשִׁיטוּת לְבָבֵךְ עָבַדְתְּ דָא וּמְנָעִית אוּף אֲנָא מִלְמֶחֱטֵי קֳדָמַי בְּגִין כֵּן לָא שְׁבַקְתִּיךְ לְמִקְרַב לְגַבָּהּ", "pj_en": "And the Word of the Lord said to him in a dream, Before Me also it is manifest that in the truthfulness of thy heart thou didst this, and so restrained I thee from sinning before Me; therefore I would not permit thee to come near her.", "tj": "", "tj_en": "", "rashi": "<b>ידעתי כי בתם לבבך וגו'.<\/b> אֱמֶת שֶׁלֹּא דִמִּיתָ מִתְּחִלָּה לַחֲטֹא אֲבָל נִקְיוֹן כַּפַּיִם אֵין כָּאן:<br><br><b>לא נתתיך.<\/b> לֹא מִמְּךָ הָיָה שֶׁלֹּא נָגַעְתָּ בָהּ, אֶלָּא חָשַׂכְתִּי אֲנִי אוֹתְךָ מֵחֲטֹא וְלֹא נָתַתִּי לְךָ כֹּחַ, וְכֵן וְלֹא נְתָנוֹ אֱלֹהִים (בראשית ל״א:ז׳), וְכֵן וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא (שופטים ט\"ו):", "rashi_en": "'ידעתי כי בתם לבבך וגו I KNOW THAT IN THE INTEGRITY OF THY HEART etc. — It is true that at first you had no intention of sinning, but you cannot claim innocency of hands (Genesis Rabbah 52:6) —<br><br>because לא נתתיך I PERMITTED THEE NOT — It was not of your own will that you did not touch her, but it was “I” who withheld you from sinning, and “I” did not permit you the possibility to touch her (Genesis Rabbah 52:7). Similar examples of נתן in sense of permitting are, (31:7) “God permitted him not (לא נתנו)” and (Judges 15:1) “But her father did not permit him (ולא נתנו) to go in”. "}, {"ch": 20, "v": 7, "aliyah": 4, "heb": "וְעַתָּ֗ה הָשֵׁ֤ב אֵֽשֶׁת־הָאִישׁ֙ כִּֽי־נָבִ֣יא ה֔וּא וְיִתְפַּלֵּ֥ל בַּֽעַדְךָ֖ וֶֽחְיֵ֑ה וְאִם־אֵֽינְךָ֣ מֵשִׁ֔יב דַּ֚ע כִּי־מ֣וֹת תָּמ֔וּת אַתָּ֖ה וְכׇל־אֲשֶׁר־לָֽךְ׃", "onk": "וּכְעַן אֲתֵיב אִתַּת גַּבְרָא אֲרֵי נְבִיָּא הוּא וִיצַלֵּי עֲלָךְ וּתְחֵי וְאִם לֵיתָךְ מְתִיב דַּע אֲרֵי מֵימַת תְּמוּת אַתְּ וְכָל דִּי לָךְ:", "onk_en": "Now return the man’s wife, for he is a prophet. He will pray for you and you will live. If you do not return her, you should know that you will surely die—you and all that is yours.", "pj": "וּכְעַן אָתִיב אִיתַּת גְבַר אֲרוּם נְבִיָא הוּא וְיַצְלִי עֲלָךְ וְתֵחֵי וְאִין לֵיתָךְ מֵתִיב דַע אֲרֵי מֵימְמַת תְּמוּת אַנְתְּ וְכָל דִילָךְ", "pj_en": "And now let the wife of the man return; for he is a prophet; he will pray for thee, and thou shalt live: but if thou wilt not let her return, know that dying thou shalt die, thou and all who are thine.", "tj": "", "tj_en": "", "rashi": "<b>השב אשת האיש.<\/b> וְאַל תְּהֵא סָבוּר שֶׁמָּא תִּתְגַּנֶּה בְעֵינָיו וְלֹא יְקַבְּלֶנָּה אוֹ יִשְׂנָאֲךָ וְלֹא יִתְפַּלֵּל עָלֶיךָ:<br><br><b>כי נביא הוא.<\/b> וְיוֹדֵעַ שֶׁלֹּא נָגַעְתָּ בָהּ, לְפִיכָךְ <b>ויתפלל בעדך<\/b> (בבא קמא צ\"ב):", "rashi_en": "השב אשת האיש RESTORE THE MAN’S WIFE and do not think that she will be repulsive in his eyes and that he will not take her back or that he will hate you and will not pray for you<br><br>כי נביא הוא FOR HE IS A PROPHET and he knows that you have not touched her (Genesis Rabbah 52:8); therefore—ויתפלל בעדך HE WILL PRAY FOR THEE. "}, {"ch": 20, "v": 8, "aliyah": 4, "heb": "וַיַּשְׁכֵּ֨ם אֲבִימֶ֜לֶךְ בַּבֹּ֗קֶר וַיִּקְרָא֙ לְכׇל־עֲבָדָ֔יו וַיְדַבֵּ֛ר אֶת־כׇּל־הַדְּבָרִ֥ים הָאֵ֖לֶּה בְּאׇזְנֵיהֶ֑ם וַיִּֽירְא֥וּ הָאֲנָשִׁ֖ים מְאֹֽד׃", "onk": "וְאַקְדֵּים אֲבִימֶלֶךְ בְּצַפְרָא וּקְרָא לְכָל עַבְדּוֹהִי וּמַלִּיל יָת כָּל פִּתְגָּמַיָּא הָאִלֵּין <b>קֳדָמֵיהוֹן<\/b> וּדְחִילוּ גוּבְרַיָּא לַחֲדָא:", "onk_en": "Avimelech got up early in the morning, and called all his servants. He spoke all these words in their ears [<b>before them<\/b>], and the men were very frightened.", "pj": "וְאַקְדִים אֲבִימֶלֶךְ בְּצַפְרָא וּקְרָא לְכָל עַבְדוֹי וּמַלֵיל יַת כָּל פִּתְגָמַיָא הָאִילֵין קֳדָמֵיהוֹן וּדְחִילוּ גוּבְרַיָא לַחֲדָא", "pj_en": "And Abimelek arose in the morning, and called all his servants, and told all these words before them; and the men feared greatly.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 9, "aliyah": 4, "heb": "וַיִּקְרָ֨א אֲבִימֶ֜לֶךְ לְאַבְרָהָ֗ם וַיֹּ֨אמֶר ל֜וֹ מֶֽה־עָשִׂ֤יתָ לָּ֙נוּ֙ וּמֶֽה־חָטָ֣אתִי לָ֔ךְ כִּֽי־הֵבֵ֧אתָ עָלַ֛י וְעַל־מַמְלַכְתִּ֖י חֲטָאָ֣ה גְדֹלָ֑ה מַעֲשִׂים֙ אֲשֶׁ֣ר לֹא־יֵֽעָשׂ֔וּ עָשִׂ֖יתָ עִמָּדִֽי׃", "onk": "וּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם וַאֲמַר לֵיהּ מַה עָבַדְתָּ לָנָא וּמַה חָבִית (<small>נ\"י<\/small> חָטֵית) לָךְ אֲרֵי אַיְתֵיתָא עֲלַי וְעַל מַלְכוּתִי חוֹבָא רַבָּא עוֹבָדִין דִּי לָא כָשְׁרִין לְאִתְעֲבָדָא עֲבַדְתָּ עִמִּי:", "onk_en": "Avimelech called Avraham and said to him, What have you done to us? What wrong did I do to you that you brought on me and upon my kingdom such a great sin? Deeds that ought not to be done, you have done to me.", "pj": "וּקְרָא אֲבִימֶלֶךְ לְאַבְרָהָם וְאָמַר מַה עָבַדְתְּ לָנָא וּמַה חָבִית לָךְ אֲרוּם אָתֵיתָא עָלַי וְעַל מַלְכוּתִי חוֹבָא רַבָּא עוּבְדִין דְלָא כַשְׁרִין לְאִתְעַבְדָא עָבַדְתְּ עִמִי", "pj_en": "And Abimelek called Abraham, and said, What hast thou done to us? And in what have I sinned against thee? For thou hast brought upon me and upon my kingdom a great sin. Thou hast wrought with me works that are not right.", "tj": "", "tj_en": "", "rashi": "<b>מעשים אשר לא יעשו.<\/b> מַכָּה אֲשֶׁר לֹא הֻרְגְּלָה לָבֹא עַל בְּרִיָה בָּאָה לָנוּ עַל יָדְךָ, עֲצִירַת כָּל נְקָבִים שֶׁל זֶרַע וְשֶׁל קְטַנִּים וּרְעִי וְאָזְנַיִם וְחֹטֶם:", "rashi_en": "מעשים אשר לא יעשו THINGS THAT OUGHT NOT TO BE DONE — A plague such as does not ordinarily fall upon human beings has come upon us through you, viz, the closing up of all the secretory channels — those of semen, urine, excrement, of the ears and the nose (cf. Bava Kamma 92a). "}, {"ch": 20, "v": 10, "aliyah": 4, "heb": "וַיֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל־אַבְרָהָ֑ם מָ֣ה רָאִ֔יתָ כִּ֥י עָשִׂ֖יתָ אֶת־הַדָּבָ֥ר הַזֶּֽה׃", "onk": "וַאֲמַר אֲבִימֶלֶךְ לְאַבְרָהָם מָה חָזֵיתָ אֲרֵי עֲבַדְתָּ יָת פִּתְגָּמָא הָדֵין:", "onk_en": "Avimelech [then] said to Avraham, What did you see that you did such a thing?", "pj": "וַאֲמַר אֲבִימֶלֶךְ לְאַבְרָהָם מַה חָמִיתָא אֲרוּם עָבַדְתְּ יַת פִּתְגָמָא הָדֵין", "pj_en": "And Abimelek said to Abraham, What hast thou seen, that thou didst this thing?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 11, "aliyah": 4, "heb": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם כִּ֣י אָמַ֗רְתִּי רַ֚ק אֵין־יִרְאַ֣ת אֱלֹהִ֔ים בַּמָּק֖וֹם הַזֶּ֑ה וַהֲרָג֖וּנִי עַל־דְּבַ֥ר אִשְׁתִּֽי׃", "onk": "וַאֲמַר אַבְרָהָם אֲרֵי אֲמָרִית לְחוֹד לֵית דַּחַלְתָּא דַיְיָ בְּאַתְרָא הָדֵין וְיִקְטְלֻנַּנִי עַל עֵיסַק אִתְּתִי:", "onk_en": "Avraham said, Because I said [thought] there is no fear of Elohim in this place, and they will kill me [in order] to take my wife.", "pj": "וַאֲמַר אַבְרָהָם אֲרוּם אֲמָרִית בִּלְבָבִי לְחוֹד לֵית דַחַלְתָּא דַיְיָ בְּאַתְרָא הָדֵין וְיִקְטְלוּנַנִי עַל עֵיסַק אִנְתְּתִי", "pj_en": "And Abraham said, Because I said in my heart, The fear of the Lord is not in this place, and they will kill me for the sake of my wife.", "tj": "", "tj_en": "", "rashi": "<b>רק אין יראת אלהים.<\/b> אַכְסְנַאי שֶׁבָּא לָעִיר, עַל עִסְקֵי אֲכִילָה וּשְׁתִיָּה שׁוֹאֲלִין אוֹתוֹ אוֹ עַל עִסְקֵי אִשְׁתּוֹ שׁוֹאֲלִין אוֹתוֹ? אִשְׁתְּךָ הִיא אוֹ אֲחוֹתְךָ הִיא? (בבא קמא שם):", "rashi_en": "רק אין יראת אלה
