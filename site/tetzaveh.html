he morning, thou shalt burn that which remaineth with fire; it shall not be eaten; for it is sacred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 35, "aliyah": 5, "heb": "וְעָשִׂ֜יתָ לְאַהֲרֹ֤ן וּלְבָנָיו֙ כָּ֔כָה כְּכֹ֥ל אֲשֶׁר־צִוִּ֖יתִי אֹתָ֑כָה שִׁבְעַ֥ת יָמִ֖ים תְּמַלֵּ֥א יָדָֽם׃", "onk": "וְתַעְבֵּד לְאַהֲרֹן וְלִבְנוֹהִי כְּדֵין כְּכֹל דִּי פַקֵּדִית יָתָךְ שִׁבְעַת יוֹמִין <b>תְּקָרֵב קֻרְבָּנְהוֹן<\/b>:", "onk_en": "So shall you do for Aharon and his sons, according to all that I have commanded you. Seven days shall you install them [<b>offer their sacrifices<\/b>].", "pj": "וְתַעֲבֵיד לְאַהֲרן וְלִבְנוֹהִי הֵיכְדֵין כְּכָל דִּי פַקֵידִית יָתָךְ שׁוּבְעָא יוֹמִין תִּקְרַב קוּרְבַּנְהוֹן", "pj_en": "And thus thou shalt do to Aharon and to his sons according to all that I have prescribed to thee; seven days thou shalt offer their oblation.", "tj": "", "tj_en": "", "rashi": "<b>ועשית לאהרן ולבניו ככה.<\/b> שָׁנָה הַכָּתוּב וְכָפַל לְעַכֵּב – שֶׁאִם חָסַר דָּבָר אֶחָד מִכָּל הָאָמוּר בָּעִנְיָן, לֹא נִתְמַלְּאוּ יְדֵיהֶם לִהְיוֹת כֹּהֲנִים וַעֲבוֹדָתָם פְּסוּלָה:<br><br><b>אתכה.<\/b> כְּמוֹ אוֹתָךְ:<br><br><b>שבעת ימים תמלא וגו'.<\/b> בָּעִנְיָן הַזֶּה וּבַקָּרְבָּנוֹת הַלָּלוּ בְּכָל יוֹם:", "rashi_en": "ועשית לאהרן ולבניו ככה AND THUS SHALT (i. e. must) THOU DO TO AARON AND HIS SONS — Scripture recites a second time in this general statement all that has been already commanded in order to impede the validity of the rites; i. e. that if they do not do this and a single thing is omitted of all that is prescribed in this section their initiation to be priests must be regarded as not having taken place and their act of sacrifice is consequently invalid (Yoma 5a).<br><br>אתכה is the same as (another form of): אוֹתָך “thee”.<br><br>שבעת ימים תמלא ידם SEVEN DAYS SHALT THOU CONSECRATE THEM in this manner and by means of these sacrifices on each day."}, {"ch": 29, "v": 36, "aliyah": 5, "heb": "וּפַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַיּוֹם֙ עַל־הַכִּפֻּרִ֔ים וְחִטֵּאתָ֙ עַל־הַמִּזְבֵּ֔חַ בְּכַפֶּרְךָ֖ עָלָ֑יו וּמָֽשַׁחְתָּ֥ אֹת֖וֹ לְקַדְּשֽׁוֹ׃", "onk": "וְתוֹרָא דְחַטָּאתָא תַּעְבֵּד לְיוֹמָא עַל כִּפּוּרַיָּא וּתְדַכֵּי עַל מַדְבְּחָא בְּכַפָּרוּתָךְ עֲלוֹהִי <b>וּתְרַבֵּי<\/b> יָתֵיהּ לְקַדָּשׁוּתֵיהּ:", "onk_en": "Offer a bull for a sin-offering each day for atonement; and by sprinkling [its blood] on the altar you will purify [<b>elevate<\/b>] it [the altar.] You shall then anoint it to sanctify it.", "pj": "וְתוֹרָא דְחַטָּאתָא תַּעֲבֵיד לְיוֹמָא עַל כִּיפּוּרַיָא וּתְרַבֵּי עַל מַדְבְּחָא בְּכַפָּרוּתָךְ עֲלוֹי וּתְרַבֵּי עֲלֵיהּ לְקַדָּשׁוּתֵיהּ", "pj_en": "And a bullock for a sin offering thou shalt offer daily for atonement, and shalt anoint the altar in offering the atonement upon it; thou shalt anoint it, to consecrate it.", "tj": "", "tj_en": "", "rashi": "<b>על הכפרים.<\/b> בִּשְׁבִיל הַכִּפּוּרִים, לְכַפֵּר עַל הַמִּזְבֵּחַ מִכָּל זָרוּת וְתִעוּב; וּלְפִי שֶׁנֶּ' שִׁבְעַת יָמִים תְּמַלֵּא יָדָם, אֵין לִי אֶלָּא דָּבָר הַבָּא בִּשְׁבִילָם, כְּגוֹן הָאֵילִים וְהַלֶּחֶם, אֲבָל הַבָּא בִּשְׁבִיל הַמִּזְבֵּחַ, כְּגוֹן פַּר שֶׁהוּא לְחִטּוּי הַמִּזְבֵּחַ, לֹא שָׁמַעְנוּ, לְכָךְ הֻצְרַךְ מִקְרָא זֶה; וּמִדְרַשׁ תּ\"כֹּ אוֹמֵר כַּפָּרַת הַמִּזְבֵּחַ הֻצְרְכָה שֶׁמָּא הִתְנַדֵּב אִישׁ דְּבַר גֶּזֶל בִּמְלֶאכֶת הַמִּשְׁכָּן וְהַמִּזְבֵּחַ:<br><br><b>וחטאת.<\/b> וּתְדַכֵּי, לְשׁוֹן מַתְּנַת דָּמִים הַנְּתוּנִים בְּאֶצְבַּע קָרוּי חִטּוּי:<br><br><b>ומשחת אתו.<\/b> בְּשֶׁמֶן הַמִּשְׁחָה, וְכָל הַמְּשִׁיחוֹת כְּמִין כִי:", "rashi_en": "על הכפרים means for the purpose of expiation — to expiate for the altar for all that is “strange” (not holy) and objectionable that may happened to it. Now since it is said. (v. 35) “Seven days shalt thou consecrate them” after having stated that if a single thing is omitted the ceremony is invalid, I can infer nothing more than that this alludes to a thing that is offered on account of them personally as, for example, the rams and the bread, but as regards anything that is offered on account of the altar as, for example, the bullock, which is intended to serve as expiation for the altar, we cannot infer from that verse that if this is omitted the ceremony of initiation is invalid; consequently this verse is necessary to inform us of this. An explanation in Torath Cohanim (the Sifra) states: atonement for the altar was necessary because perhaps a man had donated for work in connection with the construction of the Tabernacle or the altar something which he had stolen (Sifra, Tzav, Mechilta d'Miluim 1 15).<br><br>וחטאת — The Targum translates this by ותדכי AND THOU SHALT PURIFY [THE ALTAR]; the expression for placing upon the altar the blood that is placed there with the finger is called חַטַּא (hence it is followed by the preposition על “upon”).<br><br>ומשחת אתו AND THOU SHALT ANOINT IT with the oil of anointing: every anointing was done in the form of a Greek Chi (X)."}, {"ch": 29, "v": 37, "aliyah": 5, "heb": "שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל־הַמִּזְבֵּ֔חַ וְקִדַּשְׁתָּ֖ אֹת֑וֹ וְהָיָ֤ה הַמִּזְבֵּ֙חַ֙ קֹ֣דֶשׁ קׇֽדָשִׁ֔ים כׇּל־הַנֹּגֵ֥עַ בַּמִּזְבֵּ֖חַ יִקְדָּֽשׁ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "שִׁבְעַת יוֹמִין תְּכַפֵּר עַל מַדְבְּחָא וּתְקַדֵּשׁ יָתֵיהּ וִיהֵי מַדְבְּחָא קֹדֶשׁ קוּדְשַׁיָּא כָּל דְּיִקְרַב בְּמַדְבְּחָא יִתְקַדָּשׁ:", "onk_en": "For seven days you shall make atonement for the altar and sanctify it and thus the altar will be Holy of Holies. Anything that touches the altar becomes sacred.", "pj": "שׁוּבְעָא יוֹמִין תְּכַפֵּר עַל מַדְבְּחָא וּתְקַדֵּישׁ יָתֵיהּ וִיהֵי מַדְבְּחָא קוֹדֶשׁ קוּדְשִׁין כָּל דְּיִקְרַב בְּמַדְבְּחָא יִתְקַדֵּשׁ מִן בְּנֵי אַהֲרן בְּרַם מִן שְׁאַר עַמָּא לֵית אֶפְשַׁר לְהוֹן לְמִקְרַב דִּלְמָא יִתּוֹקְדוּן בְּאֵשָׁא מְצַלְהֲבָא דְנָפִיק מִן קוּדְשַׁיָא", "pj_en": "Seven days make thou atonement upon the altar to consecrate it; and it shall be the altar of the Holy of Holies. Every one of the sons of Aharon who approacheth to the altar must be holy; to the rest of the people it is not lawful to approach, lest they be burned with the fiery flame which cometh from the holy place.", "tj": "", "tj_en": "", "rashi": "<b>והיה המזבח קדש.<\/b> וּמַה הִיא קְדֻשָּׁתוֹ? <b>כל הנגע במזבח יקדש.<\/b> אֲפִלּוּ קָרְבָּן פָּסוּל שֶׁעָלָה עָלָיו קִדְּשׁוֹ הַמִּזְבֵּחַ לְהַכְשִׁירוֹ שֶׁלֹּא יֵרֵד; מִתּוֹךְ שֶׁנֶּאֱמַר כָּל הַנֹּגֵעַ בַּמִּזְבֵּחַ יִקְדָּשׁ, שׁוֹמֵעַ אֲנִי בֵּין רָאוּי בֵּין שֶׁאֵינוֹ רָאוּי – כְּגוֹן דָּבָר שֶׁלֹּא הָיָה פְסוּלוֹ בַּקֹּדֶשׁ, כְּגוֹן הָרוֹבֵעַ וְהַנִּרְבָּע וּמֻקְצֶה וְנֶעֱבָד וְהַטְּרֵפָה וְכַיּוֹצֵא בָּהֶן – תַּ\"לֹ וְזֶה אֲשֶׁר תַּעֲשֶׂה הַסָּמוּךְ אַחֲרָיו, מָה עוֹלָה רְאוּיָה, אַף כָּל רָאוּי שֶׁנִּרְאָה לוֹ כְבָר וְנִפְסַל מִשֶּׁבָּא לָעֲזָרָה, כְּגוֹן הַלָּן וְהַיּוֹצֵא וְהַטָּמֵא וְשֶׁנִּשְׁחַט בְּמַחֲשֶׁבֶת חוּץ לִזְמַנּוֹ וְחוּץ לִמְקוֹמוֹ וְכַיּוֹצֵא בָּהֶן (זבחים פ\"ג):", "rashi_en": "והיה המזבח קדש AND THE ALTAR SHALL BE [MOST] HOLY — and in what consists its holiness? In this: כל הנגע במזבח יקדש that WHATSOEVER TOUCHETH THE ALTAR SHALL BECOME HOLY — that even a sacrifice which is really invalid that has been brought upon it — even that does the altar sanctify making it a valid sacrifice in so far that it must not be taken down from the altar. Now since it is said, “Anything that toucheth the altar shall become holy”, I might infer that this applies to a thing whether it was fitting to be an offering at the time when it was brought into the Sanctuary or whether it was not so fitting as, for example, in the latter case, something the disqualification of which did not happen within the Sanctuary itself but had happened before it was brought there, such as, an animal, male or female, with which sexual sin had been committed, or an animal which had been set aside as a sacrifice to an idol, or one which had been worshipped as a god, or one which showed signs of incapacity to live owing to certain diseases (technically termed טרפה) and animals similar to these (with similar disqualifications); consequently it states, “Now this is that which thou shalt offer [upon the altar]”, which follows immediately after this (in v. 38). Now how is it in the case of the burnt-offering which is mentioned in the next verse as something commanded to be brought upon the altar? It must be fitted to be brought upon the altar! So, also, the preceding statement, “Whatever [touches the altar shall become holy]”, refers only to whatever was fitting, i. e. what was already fitting to be brought upon the altar and became disqualified only after it had been brought into the fore-court of the Sanctuary, as, for example, that which had been left over night (the blood or fat of a sacrifice which had been left until the morning without having been placed upon the altar), or that which, before it had been placed upon the altar, had been taken (lit., had gone forth) outside the forecourt, or that which had become unclean, or an animal which had been slaughtered with the intention to sprinkle the blood or to burn the fat or to eat the flesh outside the prescribed period or outside the prescribed place, and animals similar to these (Zevachim 83b)."}, {"ch": 29, "v": 38, "aliyah": 6, "heb": "וְזֶ֕ה אֲשֶׁ֥ר תַּעֲשֶׂ֖ה עַל־הַמִּזְבֵּ֑חַ כְּבָשִׂ֧ים בְּנֵֽי־שָׁנָ֛ה שְׁנַ֥יִם לַיּ֖וֹם תָּמִֽיד׃", "onk": "וְדֵין דִּי תַעְבֵּד עַל מַדְבְּחָא אִמְּרִין בְּנֵי שְׁנָא תְּרֵין לְיוֹמָא תְּדִירָא:", "onk_en": "And this is what you shall offer upon the altar: two yearling lambs each day, continually.", "pj": "וְדֵין קוּרְבָּנָא דְתַעֲבֵיד עַל מַדְבְּחָא אִמְרִין בְּנֵי שְׁנָה תְּרֵין לְיוֹמָא תְדִירָא", "pj_en": "And this is the oblation which thou shalt perform upon the altar; two lambs of one year, daily, evermore.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 39, "aliyah": 6, "heb": "אֶת־הַכֶּ֥בֶשׂ הָאֶחָ֖ד תַּעֲשֶׂ֣ה בַבֹּ֑קֶר וְאֵת֙ הַכֶּ֣בֶשׂ הַשֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָעַרְבָּֽיִם׃", "onk": "יָת אִמְּרָא חַד תַּעְבֵּד בְּצַפְרָא וְיָת אִמְרָא תִנְיָנָא תַּעְבֵּד בֵּין שִׁמְשַׁיָּא:", "onk_en": "Offer one lamb in the morning and offer the second lamb in the afternoon.", "pj": "יַת אִימְרָא חַד תַּעֲבֵיד בְּצַפְרָא וְיַת אִימְרָא תִנְיָנָא תַעֲבֵיד בֵּינֵי שִׁימְשָׁתָא", "pj_en": "The one lamb thou shalt perform in the morning; and the second lamb thou shalt perform between the evenings.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 40, "aliyah": 6, "heb": "וְעִשָּׂרֹ֨ן סֹ֜לֶת בָּל֨וּל בְּשֶׁ֤מֶן כָּתִית֙ רֶ֣בַע הַהִ֔ין וְנֵ֕סֶךְ רְבִיעִ֥ת הַהִ֖ין יָ֑יִן לַכֶּ֖בֶשׂ הָאֶחָֽד׃", "onk": "וְעִסְרוֹנָא סֻלְתָּא דְּפִילָא בִמְשַׁח כָּתִישָׁא רַבְעוּת הִינָא וְנִסְכָּא רַבְעוּת הִינָא חַמְרָא לְאִמְרָא חָד:", "onk_en": "And a tenth [of an ephah] of fine flour mixed with one fourth of a hin of pressed olive oil, and a libation of a fourth of a hin of wine for the first lamb.", "pj": "וְעִשְרוֹנָא סְמִידָא פָּתִיךְ בִּמְשַׁח זֵיתָא כְּתִישָׁא רַבְעוּת הִינָא וְנִיסוּכָא רַבְעוּת הִינָא חַמְרָא לְאִימְרָא חָד", "pj_en": "And the tenth of flour mingled with oil of olives beaten; (with) the fourth of a hina, and the libation of a fourth of a hina for the one lamb.", "tj": "", "tj_en": "", "rashi": "<b>ועשרן סלת.<\/b> עֲשִׂירִית הָאֵיפָה – מ\"ג בֵּיצִים וְחֹמֶשׁ בֵּיצָה:<br><br><b>בשמן כתית.<\/b> לֹא לְחוֹבָה נֶאֱמַר כָּתִית, אֶלָּא לְהַכְשִׁיר, לְפִי שֶׁנֶּאֱמַר כָּתִית לַמָּאוֹר – וּמַשְׁמָע לַמָּאוֹר וְלֹא לַמְּנָחוֹת – יָכוֹל לְפָסְלוֹ לַמְּנָחוֹת, תַּ\"לֹ כָּאן כָּתִית וְלֹא נֶאֱמַר כָּתִית לַמָּאוֹר, אֶלָּא לְמַעֵט מְנָחוֹת שֶׁאֵין צָרִיךְ כָּתִית, שֶׁאַף הַטָּחוּן בָּרֵיחַיִם כָּשֵׁר בָּהֶן (מנחות פ\"ו):<br><br><b>רבע ההין.<\/b> שְׁלֹשָׁה לֻגִּין:<br><br><b>ונסך.<\/b> לַסְּפָלִים, כְּמוֹ שֶׁשָּׁנִינוּ בְמַסֶּכֶת סֻכָּה (מ\"ח) – שְׁנֵי סְפָלִים שֶׁל כֶּסֶף הָיוּ בְרֹאשׁ הַמִּזְבֵּחַ וּמְנֻקָּבִים כְּמִין שְׁנֵי חֳטָמִין דַּקִּים, נוֹתֵן הַיַּיִן לְתוֹכוֹ וְהוּא מְקַלֵּחַ וְיוֹצֵא דֶּרֶךְ הַחֹטֶם וְנוֹפֵל עַל גַּג הַמִּזְבֵּחַ, וּמִשָּׁם יוֹרֵד לַשִּׁיתִין, בְּמִזְבַּח בֵּית עוֹלָמִים, וּבְמִזְבַּח הַנְּחֹשֶׁת יוֹרֵד מִן הַמִּזְבֵּחַ לָאָרֶץ:", "rashi_en": "ועשרן סלת A TENTH DEAL OF FLOUR — i. e. a tenth part of an ephah: a capacity of forty three and a fifth eggs (cf. Rashi on Exodus 16:36).<br><br>בשמן כתית [MINGLED] WITH OIL, BEATEN — Not to make this obligatory is it stated “beaten” but to make it lawful if such oil be at all used. Since it is stated, (Exodus 27:20) “beaten for the light” and the implication is that for the light it must be beaten and not for the meal-offerings, one might think that this is expressly stated in order to declare it unfitting for the meal-offerings; therefore it states here “beaten”, meaning that for the meal-offerings beaten oil may be used if one so wishes. And it is stated “beaten for the light”, only to exclude the meal-offerings from the command: that beaten oil is not obligatory for them — that oil obtained from olives ground in a mill is also permissible for them (Menachot 86b).<br><br>רבע ההין THE FOURTH PART OF A HIN — three logs.<br><br>ונסך AND A LIBATION — for the bowls, as we learn in Treatise Sukkah 48a: there were two silver bowls above the altar pierced with holes, as it were like two slender nostrils. He poured the wine into these and it ran through and gushed forth by way of this “nostril”, falling upon the top of the altar. Thence it ran down into the subterranean channels in the case of the altar in the Temple, but in the case of the copper altar in the Tabernacle it ran down from the altar to the ground."}, {"ch": 29, "v": 41, "aliyah": 6, "heb": "וְאֵת֙ הַכֶּ֣בֶשׂ הַשֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָעַרְבָּ֑יִם כְּמִנְחַ֨ת הַבֹּ֤קֶר וּכְנִסְכָּהּ֙ תַּֽעֲשֶׂה־לָּ֔הּ לְרֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַיהֹוָֽה׃", "onk": "וְיָת אִמְרָא תִנְיָנָא תַּעְבֵּד בֵּין שִׁמְשַׁיָּא כְּמִנְחַת צַפְרָא וּכְנִסְכַּהּ תַּעְבֵּד לַהּ <b>לְאִתְקַבָּלָא בְרַעֲוָא קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "Offer the second lamb in the afternoon. As the meal-offering of the morning together with its libation, shall you offer it, for a pleasing fragrance [<b>to be accepted with favor<\/b>], a fire-offering to [<b>sacrifice before<\/b>] Adonoy.", "pj": "וְיַת אִימְרָא תִנְיָנָא תַּעֲבֵיד בֵּינֵי שִׁמְשְׁתָא הֵי כְּמִנְחַת צַפְרָא וְהֵי כְנִיסוּכָהּ תַּעֲבֵיד לָהּ לְאִתְקַבָּלָא בְּרַעֲוָא קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "And the second lamb thou shalt perform between the evenings: it shall be as the mincha of the morning, and as the libation thou shalt do it, to be received with acceptance, an oblation before the Lord;", "tj": "", "tj_en": "", "rashi": "<b>לריח ניחח.<\/b> עַל הַמִּנְחָה נֶאֱמַר, שֶׁמִּנְחַת נְסָכִים כֻּלָּהּ כָּלִיל, וְסֵדֶר הַקְרָבָתָם הָאֵבָרִים בַּתְּחִלָּה וְאַחַר כָּךְ הַמִּנְחָה, שֶׁנֶּאֱמַר עֹלָה וּמִנְחָה:", "rashi_en": "לריח ניחח FOR A PLEASING ODOUR — This is said in reference to the meal-offering just mentioned and not only to the lamb mentioned in the first half of the verse, for also the meal-offering brought with the libation was all of it entirely burnt, unlike other meal-offerings. The order when offering them was: first the limbs of the animal and afterwards the meal-offering, since it is said (Leviticus 23:27) “burnt-offering and meal-offering”."}, {"ch": 29, "v": 42, "aliyah": 6, "heb": "עֹלַ֤ת תָּמִיד֙ לְדֹרֹ֣תֵיכֶ֔ם פֶּ֥תַח אֹֽהֶל־מוֹעֵ֖ד לִפְנֵ֣י יְהֹוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָכֶם֙ שָׁ֔מָּה לְדַבֵּ֥ר אֵלֶ֖יךָ שָֽׁם׃", "onk": "עֲלָתָא תְדִירָא לְדָרֵיכוֹן בִּתְרַע מַשְׁכַּן זִמְנָא קֳדָם יְיָ <b>דִּאֱזַמֵּן מֵימְרִי<\/b> לְכוֹן תַּמָּן לְמַלָּלָא עִמָּךְ תַּמָּן:", "onk_en": "This shall be a continual burnt-offering for your generations. [It shall be offered] at the entrance of the Tent of Meeting, before Adonoy, where I will meet [<b>prepare My Word<\/b>] with you, to speak to you there.", "pj": "עֲלַת תְּדִירָא לְדָרֵיכוֹן בִּתְרַע מַשְׁכַּן זִימְנָא קֳדָם יְיָ דְּאַזְמִין מֵימְרִי לְכוֹן תַּמָּן לְמַלָּלָא עִמָךְ תַּמָּן", "pj_en": "a perpetual holocaust for your generations at the door of the tabernacle of ordinance before the Lord; where I will appoint My Word to (meet) thee there, to speak with thee there.", "tj": "", "tj_en": "", "rashi": "<b>תמיד.<\/b> מִיּוֹם אֶל יוֹם – וְלֹא יַפְסִיק יוֹם בֵּינְתַיִם:<br><br><b>אשר אועד לכם.<\/b> כְּשֶׁאֶקְבַּע מוֹעֵד לְדַבֵּר אֵלֶיךָ, שָׁם אֶקְבָּעֶנּוּ לָבֹא. וְיֵשׁ מֵרַבּוֹתֵינוּ לֹמְדִים מִכָּאן שֶׁמֵּעַל מִזְבַּח הַנְּחֹשֶׁת הָיָה הַקָּבָּ\"ה מְדַבֵּר עִם מֹשֶׁה מִשֶּׁהוּקַם הַמִּשְׁכָּן, וְיֵשׁ אוֹמְרִים מֵעַל הַכַּפֹּרֶת, כְּמוֹ שֶׁנֶּאֱמַר וְדִבַּרְתִּי אִתְּךָ מֵעַל הַכַּפֹּרֶת (שמות כ\"ו), וַאֲשֶׁר אִוָּעֵד לָכֶם הָאָמוּר כָּאן אֵינוֹ אָמוּר עַל הַמִּזְבֵּחַ אֶלָּא עַל אֹהֶל מוֹעֵד הַנִּזְכָּר בַּמִּקְרָא:", "rashi_en": "תמיד A CONTINUAL [BURNT-OFFERING] i.e. from day to day: there shall not be an interval of a day between them (between two successive morning or afternoon offerings; cf. Rashi on Exodus 27:20).<br><br>אשר אועד לכם WHERE I SHALL BE MET BY YOU — when I shall appoint a place of meeting to speak unto you I shall appoint it there (at the entrance of the tent of meeting) as the spot to which to come. Some of our Rabbis learn from this that it was from above the copper altar that the Holy One, blessed be He, spoke with Moses after the Tabernacle was erected, for this was at the entrance; but some say that He spoke from above the cover of the Ark (the כפרת), as it is said, (Exodus 25:22) “And I will speak to thee from above the cover”, and that the words “where I shall be met by you” which are said here are not used in reference to the altar which was at the entrance of the tent of meeting, but in reference to the tent of meeting itself which is mentioned in this verse (so that the meaning is: “at the entrance of the tent of meeting where, viz., in the tent of meeting, I shall be met by you”; cf. ברייתא דמלאכת המשכן at the end)."}, {"ch": 29, "v": 43, "aliyah": 6, "heb": "וְנֹעַדְתִּ֥י שָׁ֖מָּה לִבְנֵ֣י יִשְׂרָאֵ֑ל וְנִקְדַּ֖שׁ בִּכְבֹדִֽי׃", "onk": "וְאֱזַמֵּן מֵימְרִי תַמָּן לִבְנֵי יִשְׂרָאֵל וְיִתְקַדַּשׁ בִּיקָרִי:", "onk_en": "It is there that I will meet [<b>prepare My Word<\/b>] with the B’nei Yisrael, and it [<b>I<\/b>] will be sanctified with My Glory.", "pj": "וְאֵיזַמֵן מֵימְרִי תַמָּן לִבְנֵי יִשְרָאֵל וְאֵקַדֵשׁ בְּרַבָּנֵיהוֹן בְּגִין יְקָרִי", "pj_en": "And there I will appoint My Word (to meet) with the sons of Israel, and I will be sanctified in their rulers for My glory.", "tj": "", "tj_en": "", "rashi": "<b>ונעדתי שמה.<\/b> אֶתְוַעֵד עִמָּם בְּדִבּוּר, כְּמֶלֶךְ הַקּוֹבֵעַ מְקוֹם מוֹעֵד לְדַבֵּר עִם עֲבָדָיו שָׁם:<br><br><b>ונקדש.<\/b> הַמִּשְׁכָּן:<br><br><b>בכבדי.<\/b> – שֶׁתִּשְׁרֶה שְׁכִינָתִי בּוֹ. וּמִדְרַשׁ אַגָּדָה אַל תִּקְרֵי בִּכְבֹדִי אֶלָּא בִּכְבוּדַי – בִּמְכֻבָּדִים שֶׁלִּי – כָּאן רָמַז לוֹ מִיתַת בְּנֵי אַהֲרֹן בְּיוֹם הֲקָמָתוֹ, וְזֶהוּ שֶׁאָמַר מֹשֶׁה הוּא אֲשֶׁר דִּבֶּר ה' לֵאמֹר בִּקְרֹבַי אֶקָּדֵשׁ, וְהֵיכָן דִּבֶּר? וְנִקְדַּשׁ בִּכְבֹדִי (זבחים קט\"ו):", "rashi_en": "ונעדתי שמה AND I WILL BE MET THERE — I will come together with them in a conversation as a king who appoints a place of meeting where he will speak with his subjects.<br><br>ונקדש AND IT — the Tabernacle — SHALL BE SANCTIFIED,<br><br>בכבדי BY MY GLORY — for my Shechina shall rest there. A Midrashic comment is: Read not here בִּכְבוֹדִי “by My Glory”, but בִּכְבוּדַי, “through My honoured ones”. Here He gave him some slight intimation of the death of Aaron’s sons on the day when it (the Tabernacle) would be erected. This is the meaning of what Moses then said, (Leviticus 10:3) “That is what the Lord said, Through those that draw near to Me will I be sanctified”. But where had he said this? Here, in the words, “and it shall be sanctified through My honoured ones” (Zevachim 115b)."}, {"ch": 29, "v": 44, "aliyah": 6, "heb": "וְקִדַּשְׁתִּ֛י אֶת־אֹ֥הֶל מוֹעֵ֖ד וְאֶת־הַמִּזְבֵּ֑חַ וְאֶת־אַהֲרֹ֧ן וְאֶת־בָּנָ֛יו אֲקַדֵּ֖שׁ לְכַהֵ֥ן לִֽי׃", "onk": "וֶאֱקַדֵּשׁ יָת מַשְׁכַּן זִמְנָא וְיָת מַדְבְּחָא וְיָת אַהֲרֹן וְיָת בְּנוֹהִי אֱקַדֵּשׁ לְשַׁמָּשָׁא <b>קֳדָמַי<\/b>:", "onk_en": "I will sanctify the Tent of Meeting and the altar, and Aharon and his sons I will sanctify to serve [<b>before<\/b>] Me as kohanim.", "pj": "וְאֵיקַדֵּשׁ יַת מַשְׁכַּן זִימְנָא וְיַת מַדְבְּחָא וְיַת אַהֲרן וְיַת בְּנוֹי אֵיקַדֵּשׁ לְשַׁמָּשָׁא קֳדָמָי", "pj_en": "And I will sanctify the tabernacle of ordinance and the altar; and Aharon and his sons will I sanctify to minister before Me:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 45, "aliyah": 6, "heb": "וְשָׁ֣כַנְתִּ֔י בְּת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְהָיִ֥יתִי לָהֶ֖ם לֵאלֹהִֽים׃", "onk": "<b>וְאַשְׁרֵי שְׁכִנְתִּי<\/b> בְּגוֹ בְּנֵי יִשְׂרָאֵל וְאֶהֱוֵי לְהוֹן לֶאֱלָהּ:", "onk_en": "I will dwell [<b>rest My Shechina<\/b>] among the B’nei Yisrael, and I will be their God.", "pj": "וְאַשְׁרֵי שְׁכִינְתִּי בְּגוֹ בְּנֵי יִשְרָאֵל וְאֶהֱוֵי לְהוֹן לֵאלָהָא", "pj_en": "and My Shekinah shall dwell in the midst of the sons of Israel, and I will be their God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 46, "aliyah": 6, "heb": "וְיָדְע֗וּ כִּ֣י אֲנִ֤י יְהֹוָה֙ אֱלֹ֣הֵיהֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛ם מֵאֶ֥רֶץ מִצְרַ֖יִם לְשׇׁכְנִ֣י בְתוֹכָ֑ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיִדְּעוּן אֲרֵי אֲנָא יְיָ אֱלָהֲהוֹן דִּי אַפֵּקִית יָתְהוֹן מֵאַרְעָא דְמִצְרַיִם <b>לְאַשְׁרָאָה שְׁכִנְתִּי<\/b> בֵּינֵיהוֹן אֲנָא יְיָ אֱלָהֲהוֹן:", "onk_en": "They will know that I, Adonoy, am their God who brought them out of the land of Egypt to dwell [<b>rest My Shechina<\/b>] among them. I am Adonoy, their God.", "pj": "וְיֵדְעוּן בְּנֵי יִשְרָאֵל אֲרוּם אֲנָא יְיָ אֱלָהָהוֹן דִּי הַנְפֵיקִית יַתְהוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם לְאַשְׁרָאָה שְׁכִינְתִּי בֵּינֵיהוֹן אֲנָא הוּא יְיָ אֱלָהָהוֹן", "pj_en": "And the sons of Israel shall know that I am their God, who led them out free from the land of Mizraim to make My Shekinah dwell among them. I am the Lord their God.", "tj": "", "tj_en": "", "rashi": "<b>לשכני בתוכם.<\/b> עַל מְנָת לִשְׁכֹּן אֲנִי בְּתוֹכָם:", "rashi_en": "לשכני בתכם means under the condition that I may dwell in the midst of them."}, {"ch": 30, "v": 1, "aliyah": 7, "heb": "וְעָשִׂ֥יתָ מִזְבֵּ֖חַ מִקְטַ֣ר קְטֹ֑רֶת עֲצֵ֥י שִׁטִּ֖ים תַּעֲשֶׂ֥ה אֹתֽוֹ׃", "onk": "וְתַעְבֵּד מַדְבְּחָא <b>לְאַקְטָרָא עֲלוֹהִי קְטֹרֶת<\/b> בּוּסְמַיָּא דְּאָעֵי שִׁטִּין תַּעְבֵּד יָתֵיהּ:", "onk_en": "You shall make an altar [<b>upon which<\/b>] to burn incense [<b>spices<\/b>]. Make it out of Acacia wood.", "pj": "וְתַעֲבֵיד מַדְבְּחָא לְאַסָקָא עֲלוֹי קְטוֹרֶת בּוּסְמַיָא דְקִיסֵי שִׁיטָא תַעֲבֵיד יָתֵיהּ", "pj_en": "And thou shalt make an altar on which to burn incense of perfumes: of sitta wood shalt thou make it.", "tj": "", "tj_en": "", "rashi": "<b>מקטר קטרת.<\/b> לְהַעֲלוֹת עָלָיו קִטּוּר עֲשַׁן סַמִּים:", "rashi_en": "מקטר קטרת FOR THE BURNING OF INCENSE — to raise smoke (קיטור) on it, viz., the smoke of incense."}, {"ch": 30, "v": 2, "aliyah": 7, "heb": "אַמָּ֨ה אׇרְכּ֜וֹ וְאַמָּ֤ה רׇחְבּוֹ֙ רָב֣וּעַ יִהְיֶ֔ה וְאַמָּתַ֖יִם קֹמָת֑וֹ מִמֶּ֖נּוּ קַרְנֹתָֽיו׃", "onk": "אַמְּתָא אֻרְכֵּיהּ וְאַמְּתָא פְתָיֵהּ מְרַבַּע יְהֵי וְתַרְתֵּין אַמִּין רוּמֵיהּ מִנֵּיהּ קַרְנוֹהִי:", "onk_en": "It shall be one amoh long and one amoh wide, it shall be a square, and two amohs high. Its horn-like elevations shall be of one piece with it.", "pj": "אַמְתָא אוּרְכֵּיהּ וְאַמְתָא פּוּתְיֵהּ מְרַבַּע יְהֵא וְתַרְתֵּין אַמִּין רוּמֵיהּ מִינֵיהּ יְהוֹן קַרְנוֹי זְקִיפוּן", "pj_en": "A cubit its length, and a cubit its breadth; foursquare shall it be: and two cubits its height: and its upright horns shall be of it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 3, "aliyah": 7, "heb": "וְצִפִּיתָ֨ אֹת֜וֹ זָהָ֣ב טָה֗וֹר אֶת־גַּגּ֧וֹ וְאֶת־קִירֹתָ֛יו סָבִ֖יב וְאֶת־קַרְנֹתָ֑יו וְעָשִׂ֥יתָ לּ֛וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃", "onk": "וְתַחֲפֵי יָתֵיהּ דְּהַב דְּכֵי יָת אִגָּרֵיהּ וְיָת כָּתְלוֹהִי סְחוֹר סְחוֹר וְיָת קַרְנוֹהִי וְתַעְבֵּד לֵיהּ דֵּיר דִּדְהַב סְחוֹר סְחוֹר:", "onk_en": "You shall overlay it with pure gold, on its top, its walls all around, and its horn-like elevations, and make a gold crown-like rim all around it.", "pj": "וְתַחְפֵי יָתֵיהּ דְּהַב דְּכֵי יַת אִיגְרֵיהּ וְיַת כּוֹתְלוֹי חֲזוֹר חֲזוֹר וְיַת קַרְנוֹי וְתַעֲבֵיד לֵיהּ זֵיר דִּדְהַב חֲזוֹר חֲזוֹר", "pj_en": "And thou shalt overlay it with pure gold, its top, and its wall round about, and its horns; and make for it a border of gold round about.", "tj": "", "tj_en": "", "rashi": "<b>את גגו.<\/b> זֶה הָיָה לוֹ גַּג, אֲבָל מִזְבַּח הָעוֹלָה לֹא הָיָה לוֹ גַּג אֶלָּא מְמַלְּאִים חֲלָלוֹ אֲדָמָה בְּכָל חֲנִיָּתָן:<br><br><b>זר זהב.<\/b> סִימָן הוּא לְכֶתֶר כְּהֻנָּה:", "rashi_en": "את גגו THE ROOF THEREOF — This altar had a top but the altar of burnt-offering had no top, but they filled in the hollow space enclosed by its sides with earth wherever they encamped (cf. Mekhilta).<br><br>זר זהב A CROWN OF GOLD — an emblem of the crown of priesthood (Yoma 72b)."}, {"ch": 30, "v": 4, "aliyah": 7, "heb": "וּשְׁתֵּי֩ טַבְּעֹ֨ת זָהָ֜ב תַּֽעֲשֶׂה־לּ֣וֹ&thinsp;<b>׀<\/b> מִתַּ֣חַת לְזֵר֗וֹ עַ֚ל שְׁתֵּ֣י צַלְעֹתָ֔יו תַּעֲשֶׂ֖ה עַל־שְׁנֵ֣י צִדָּ֑יו וְהָיָה֙ לְבָתִּ֣ים לְבַדִּ֔ים לָשֵׂ֥את אֹת֖וֹ בָּהֵֽמָּה׃", "onk": "וְתַרְתֵּין עִזְקַן דִּדְהַב תַּעְבֵּד לֵיהּ מִלְּרַע לְדֵירֵיהּ עַל תַּרְתֵּין זִוְיָתֵיהּ תַּעְבֵּד עַל תְּרֵין סִטְרוֹהִי וִיהֵי לְאַתְרָא לַאֲרִיחַיָּא לְמִטַּל יָתֵיהּ בְּהוֹן:", "onk_en": "Make two gold rings for it under its crown-like rim, on two of its corners. Make them on its two opposite sides. They will house the poles with which it is carried.", "pj": "וְתַרְתֵּין עִיזְקַן דִּדְהַב תַּעֲבֵיד לֵיהּ מִלְרַע לְזֵירֵיהּ עַל תְּרֵין זִיוְיָיתֵיהּ תַּעֲבֵיד עַל תְּרֵין צִיטְרוֹי וִיהֵי לְאַתְרָא לַאֲרִיחַיָא לְמֵיטַל יָתֵיהּ בְּהוֹם", "pj_en": "And two golden rings make thou for it beneath its border at the two corners, thou shalt make upon its two sides, to be the place for the staves by which it may be carried.", "tj": "", "tj_en": "", "rashi": "<b>צלעתיו.<\/b> כָּאן הוּא לְשׁוֹן זָוִיּוֹת, כְּתַרְגּוּמוֹ, לְפִי שֶׁנֶּאֱמַר עַל שְׁנֵי צִדָּיו – עַל שְׁתֵּי זָוִיּוֹת שֶׁבִּשְׁנֵי צִדָּיו:<br><br><b>והיה.<\/b> מַעֲשֵׂה הַטַּבָּעוֹת הָאֵלֶּה:<br><br><b>לבתים לבדים.<\/b> בַּיִת תִּהְיֶה הַטַּבַּעַת לַבַּד:", "rashi_en": "צלעתיו Here this word must signify “corners” (not “sides” as Rashi explains in Exodus 25:12), as it is translated in the Targum, since it is stated afterwards, על שני צדיו, “upon the two sides of it”, so that the phrases mean, “the two corners that are on its two sides”.<br><br>והיה (lit., “and it shall be”, not “they shall be”) — i. e. the making of these rings (this ring-work) shall be (shall serve) —<br><br>לבתים לבדים FOR PLACES FOR THE STAVES — i.e. the ring shall serve as a place for the stave (cf. Rashi on Exodus 25:27)."}, {"ch": 30, "v": 5, "aliyah": 7, "heb": "וְעָשִׂ֥יתָ אֶת־הַבַּדִּ֖ים עֲצֵ֣י שִׁטִּ֑ים וְצִפִּיתָ֥ אֹתָ֖ם זָהָֽב׃", "onk": "וְתַעְבֵּד יָת אֲרִיחַיָּא דְּאָעֵי שִׁטִּין וְתַחֲפֵי יָתְהוֹן דַּהֲבָא:", "onk_en": "Make the poles out of acacia wood and overlay them with gold.", "pj": "וְתַעֲבֵיד יַת אֲרִיחַיָא דְקִיסֵי שִׁיטָא וְתַחֲפֵי יַתְהוֹן דַּהֲבָא", "pj_en": "And thou shalt make the staves of sitta wood, and cover them with gold.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 6, "aliyah": 7, "heb": "וְנָתַתָּ֤ה אֹתוֹ֙ לִפְנֵ֣י הַפָּרֹ֔כֶת אֲשֶׁ֖ר עַל־אֲרֹ֣ן הָעֵדֻ֑ת לִפְנֵ֣י הַכַּפֹּ֗רֶת אֲשֶׁר֙ עַל־הָ֣עֵדֻ֔ת אֲשֶׁ֛ר אִוָּעֵ֥ד לְךָ֖ שָֽׁמָּה׃", "onk": "וְתִתֵּן יָתֵיהּ קֳדָם פָּרֻכְתָּא דִּי עַל אֲרוֹנָא דְסַהֲדוּתָא לִקֳדָם כַּפֻּרְתָּא דִּי עַל סַהֲדוּתָא דִּי <b>אֲזַמֵּן מֵימְרִי<\/b> לָךְ תַּמָּן:", "onk_en": "Place it in front of the paroches that is by the Ark of the Testimony, in front of the covering that is on the Testimony where I will meet [<b>prepare My Word<\/b>] with you there.", "pj": "וְתִתֵּן יָתֵיהּ קֳדָם פַּרְגּוֹדָא דְעַל אֲרוֹנָא דְסַהֲדוּתָא קֳדָם כַּפּוּרְתָּא דְעַל סַהֲדוּתָא דְּאֵיזַמֵּן מֵימְרִי לָךְ תַּמָּן", "pj_en": "And thou shalt place it before the veil which is over the ark of the testimony, before the mercy seat that is upon the testimony, where I will appoint My Word to be with thee.", "tj": "", "tj_en": "", "rashi": "<b>לפני הפרכת.<\/b> שֶׁמָּא תֹאמַר מָשׁוּךְ מִכְּנֶגֶד הָאָרוֹן לַצָּפוֹן אוֹ לַדָּרוֹם, תַּ\"לֹ לִפְנֵי הַכַּפֹּרֶת מְכֻוָּן כְּנֶגֶד הָאָרוֹן מִבַּחוּץ:", "rashi_en": "לפני הכפרת BEFORE THE PARTITION VEIL — But this vail was drawn across the entire width of the Tabernacle, and you may perhaps say that the altar was not to be placed exactly before (exactly in a straight line with) the Ark but might be withdrawn from the straight line to the North or to the south since in that position, too, it would be before the partition vail; therefore it states further, “before the covering of the Ark”, i. e. exactly in front of the Ark but outside the veil."}, {"ch": 30, "v": 7, "aliyah": 7, "heb": "וְהִקְטִ֥יר עָלָ֛יו אַהֲרֹ֖ן קְטֹ֣רֶת סַמִּ֑ים בַּבֹּ֣קֶר בַּבֹּ֗קֶר בְּהֵיטִיב֛וֹ אֶת־הַנֵּרֹ֖ת יַקְטִירֶֽנָּה׃", "onk": "וְיַקְטַר עֲלוֹהִי אַהֲרֹן קְטֹרֶת בּוּסְמִין בִּצְפַר בִּצְפַר בְּאַתְקָנוּתֵיהּ יָת בּוֹצִינַיָּא יַסֵּקִנַּהּ:", "onk_en": "Aharon shall burn upon it incense of spices. Every morning when he cleans the lamps, he shall burn it.", "pj": "וְיַקְטֵר עֲלוֹי אַהֲרן קְטוֹרֶת בּוּסְמִין בִּצְפַר בִּצְפַר בְּאַתְקָנוּתֵיהּ יַת בּוֹצִינַיָא יַקְטְרִינָהּ", "pj_en": "And Aharon shall burn sweet incense upon it from morning to morning: when he ordereth the lamps, be shall burn it.", "tj": "", "tj_en": "", "rashi": "<b>בהיטיבו.<\/b> לְשׁוֹן נִקּוּי הַבָּזִיכִין שֶׁל הַמְּנוֹרָה מִדֶּשֶן הַפְּתִילוֹת שֶׁנִּשְׂרְפוּ בַלַּיְלָה, וְהָיָה מְטִיבָן בְּכָל בֹּקֶר וָבֹקֶר:<br><br><b>הנרת.<\/b> לו\"שיש בְּלַעַז, וְכֵן כָּל נֵרוֹת הָאֲמוּרוֹת בַּמְּנוֹרָה, חוּץ מִמָּקוֹם שֶׁנֶּאֱמַר שָׁם הַעֲלָאָה שֶׁהוּא לְשׁוֹן הַדְלָקָה:", "rashi_en": "בהטיבו WHEN HE TRIMMETH — This word is an expression for cleansing the bowls of the candelabrum from the ashes of the wicks which had burnt out during the night; and he used to clean them (the lamps) out every morning.<br><br>הנרת THE LAMPS — luces in old French And this is the meaning of נרות whenever it is mentioned in connection with the candelabrum, except in any passage where the term העלאה “causing to ascend” (any verbal form which is the Hiphil of עלה), which denotes lighting is used, and there it signifies “lights”, (The translation here is therefore: “when he cleans out the lamps”, not “when he trims the lights”)."}, {"ch": 30, "v": 8, "aliyah": 7, "heb": "וּבְהַעֲלֹ֨ת אַהֲרֹ֧ן אֶת־הַנֵּרֹ֛ת בֵּ֥ין הָעַרְבַּ֖יִם יַקְטִירֶ֑נָּה קְטֹ֧רֶת תָּמִ֛יד לִפְנֵ֥י יְהֹוָ֖ה לְדֹרֹתֵיכֶֽם׃", "onk": "וּבְאַדְלָקוּת אַהֲרֹן יָת בּוֹצִינַיָּא בֵּין שִׁמְשַׁיָּא יַסֵּקִנַּהּ קְטֹרֶת <b>בּוּסְמַיָּא<\/b> תְדִירָא קֳדָם יְיָ לְדָרֵיכוֹן:", "onk_en": "And when Aharon lights the lamps in the afternoon, he shall burn it. It is a continual incense [<b>spice<\/b>]-offering before Adonoy for you generations.", "pj": "וּבְאַדְלָקוּת אַהֲרן יַת בּוֹצִינַיָא בֵּינֵי שִׁמְשְׁתָא יַקְטְרִינָהּ קְטוֹרֶת בּוּסְמִין תְּדִירָא קֳדָם יְיָ לְדָרֵיכוֹן", "pj_en": "And when Aharon kindleth the lamps between the evenings, he shall burn sweet incense perpetually before the Lord in your generations.", "tj": "", "tj_en": "", "rashi": "<b>ובהעלת.<\/b> כְּשֶׁיַּדְלִיקֵם לְהַעֲלוֹת לַהַבְתָן:<br><br><b>יקטירנה.<\/b> בְּכָל יוֹם, פְּרָס מַקְטִיר שַׁחֲרִית וּפְרָס מַקְטִיר בֵּין הָעַרְבַּיִם (כריתות ו'):", "rashi_en": "ובהעלת means when he kindles them by making their flame ascend (cf. Rashi on Exodus 27:20 and on Numbers 8:2).<br><br>יקטירנה HE SHALL BURN IT [A CONTINUAL INCENSE] — תמיד, “continual”, means every day regularly: a half he burnt in the morning and a half he burnt in the evening (Keritot 6b)."}, {"ch": 30, "v": 9, "aliyah": 7, "heb": "לֹא־תַעֲל֥וּ עָלָ֛יו קְטֹ֥רֶת זָרָ֖ה וְעֹלָ֣ה וּמִנְחָ֑ה וְנֵ֕סֶךְ לֹ֥א תִסְּכ֖וּ עָלָֽיו׃", "onk": "לָא תַסְּקוּן עֲלוֹהִי קְטֹרֶת בּוּסְמִין נוּכְרָאִין וַעֲלָתָא וּמִנְחָתָא וְנִסְכָּא לָא תְנַסְּכוּן עֲלוֹהִי:", "onk_en": "Do not bring upon it strange [unauthorized] incense [<b>spices<\/b>]; neither burnt-offerings nor meal-offerings. You shall not pour a libation-offering upon it.", "pj": "לָא תִסְקוּן עֲלוֹי קְטוֹרֶת בּוּסְמִין דְּעַמְמִין נוּכְרָאִין וְעָלָתָא וּמִנְחָתָא וְנִיסוּכִין לָא תְנַסְכוּן עֲלוֹי", "pj_en": "Thou shalt not offer thereon the sweet incense of strange peoples, nor offer upon it burnt offerings, or minchas, nor pour libations.", "tj": "", "tj_en": "", "rashi": "<b>לא תעלו עליו.<\/b> עַל מִזְבֵּחַ זֶה:<br><br><b>קטרת זרה.<\/b> שׁוּם קְטֹרֶת שֶׁל נְדָבָה – כֻּלָּן זָרוֹת לוֹ חוּץ מִזּוֹ:<br><br><b>ועלה ומנחה.<\/b> וְלֹא עוֹלָה וּמִנְחָה, עוֹלָה שֶׁל בְּהֵמָה וָעוֹף, מִנְחָה הִיא שֶׁל לֶחֶם:", "rashi_en": "לא תעלו עליו YE SHALL NOT OFFER ON IT — on it, i. e. on this altar, but you may offer on the copper altar (cf. Menachot 50b),<br><br>קטרת זרה STRANGE INCENSE — any incense brought as a freewill offering; all of them (all offerings of incense) are “strange” to it (to the altar) except this prescribed here.<br><br>ועלה ומנחה means, nor burnt offering nor meal-offering. The עולה is an offering of an animal or bird; מנחה is one of bread."}, {"ch": 30, "v": 10, "aliyah": 7, "heb": "וְכִפֶּ֤ר אַהֲרֹן֙ עַל־קַרְנֹתָ֔יו אַחַ֖ת בַּשָּׁנָ֑ה מִדַּ֞ם חַטַּ֣את הַכִּפֻּרִ֗ים אַחַ֤ת בַּשָּׁנָה֙ יְכַפֵּ֤ר עָלָיו֙ לְדֹרֹ֣תֵיכֶ֔ם קֹֽדֶשׁ־קׇדָשִׁ֥ים ה֖וּא לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיכַפֵּר אַהֲרֹן עַל קַרְנוֹהִי חֲדָא בְּשַׁתָּא מִדְּמָא חַטַּאת כִּפּוּרַיָּא חֲדָא בְשַׁתָּא יְכַפֵּר עֲלוֹהִי לְדָרֵיכוֹן קֹדֶשׁ קוּדְשִׁין הוּא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Aharon shall make atonement on its horn-like elevations once each year. With the blood of the sin-offering of atonement, he shall make atonement on it once each year for your generations. It is Holy of Holies to [<b>before<\/b>] Adonoy.", "pj": "וִיכַפֵּר אַהֲרן עַל קַרְנוֹי חֲדָא בְּשַׁתָּא מִן אֲדָם חַטָּאתָא דְכִפּוּרַיָא חֲדָא זִמְנָא בְּשַׁתָּא יְכַפֵּר עֲלוֹי בְּיוֹמָא דְכִפּוּרֵי לְדָרֵיכוֹן קוֹדֶשׁ קוּדְשִׁין הוּא קֳדָם יְיָ", "pj_en": "And Aharon shall expiate upon its horns once in the year with the blood of the sin offering for an expiation: once in the year shall he make atonement upon it on the day of atonement in your generations: it shall be most holy before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>וכפר אהרן.<\/b> מַתַּן דָּמִים:<br><br><b>אחת בשנה.<\/b> בְּיוֹם הַכִּפּוּרִים, הוּא שֶׁנֶּאֱמַר בְּאַחֲרֵי מוֹת וְיָצָא אֶל הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי ה' וְכִפֶּר עָלָיו (ויקרא ט\"ז):<br><br><b>חטאת הכפרים.<\/b> הֵם פַּר וְשָׂעִיר שֶׁל יוֹם הַכִּפּוּרִים הַמְכַפְּרִים עַל טֻמְאַת מִקְדָּשׁ וְקָדָשָׁיו:<br><br><b>קדש קדשים.<\/b> הַמִּזְבֵּחַ מְקֻדָּשׁ לִדְבָרִים הַלָּלוּ בִּלְבַד וְלֹא לַעֲבוֹדָה אַחֶרֶת:", "rashi_en": "וכפר אהרן AND AARON SHALL MAKE EXPIATION — This refers to the placing of the blood upon the horns of the altar.<br><br>אחת בשנה ONCE IN THE YEAR — On the Day of Atonement. This is what is said in the section אחרי מות, which describes the sacrificial service on that day, (Leviticus 16:18) “And he shall go out unto the altar that is before the Lord and make an expiation upon it”.<br><br>חטאת הכפרים SIN-OFFERING OF EXPIATION — These are the bullock and goat of the Day of Atonement which atone for the uncleanness of the Sanctuary and its holy offerings (Shevuot 2b; cf. Rashi on Leviticus 16:11).<br><br>קדש קדשים [IT IS] MOST HOLY — the altar is sanctified for offering on it these things alone and not for any other sacrificial service."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
