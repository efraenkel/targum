ן סְמִידָא מִן אַפְרָשׁוּתָא פְּתִיכָא בִּמְשַׁח זֵיתָא לְמִנְחָתָא", "pj_en": "and his oblation which he offered was one silver bowl, thickly embossed, (or, crusted,) in weight one hundred and thirty shekels, in shekels of the sanctuary; one silver vase, slightly embossed, of seventy shekels, in shekels of the sanctuary; both of these vessels he brought filled with flour of the separation, sprinkled with olive oil for a mincha;", "tj": "וְקוּרְבָּנֵיהּ דְיִקְרַב פַיְילֵי דִכְסַף חָד מְאָה וּתְלָתִין סַלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁא הֲוַת מַתְקְלָא מִזְרָק חָד דִכְסַף תְּקַל שׁוּבְעִין סַלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁא תְּרֵין מָאנַיָא הָאִלֵין קָרִיב יַתְהוֹן מַלְיָין סוּלְתָּא פַיְילָתָא וּמִזְרָקָא מֵעַרְבָא בִּמְשַׁח לְמִנְחָתָא:", "tj_en": "And the oblation which he offered was one silver dish, thickly embossed, (or, crusted,) in weight one hundred and thirty shekels, in shekels of the sanctuary; one silver vase, slightly embossed, of seventy shekels, in shekels of the sanctuary; both of these vessels he brought filled with flour of the separation, sprinkled with olive oil for a mincha;", "rashi": "<b>שניהם מלאים סלת.<\/b> לְמִנְחַת נְדָבָה:", "rashi_en": "שניהם מלאים סלת BOTH OF THEM WERE FULL OF FINE FLOUR — for a free-will meal-offering."}, {"ch": 7, "v": 14, "aliyah": 5, "heb": "כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃", "onk": "בָּזִיכָא חֲדָא מַתְקַל עֲשַׂר סִלְעִין הִיא דִדְהַב מַלְיָא קְטֹרֶת <b>בּוּסְמַיָּא<\/b>:", "onk_en": "One spoon of ten gold [<i>shekolim<\/i>], filled with [<b>fragrant<\/b>] incense.", "pj": "בָּזִיכָא חֲדָא מַתְקְלָא עֲשַר סִלְעִין דִכְסַף וְהִיא הֲוַת דִדְהַב טָב קָרִיב יָתָהּ מַלְיָא קְטוֹרֶת בּוּסְמָנִין טָבִין מִן אַפְרָשׁוּתָא", "pj_en": "one pan (censer) weighing ten silver shekels, but it was itself of good gold; and he brought it full of good sweet incense of the separation;", "tj": "בָּזִיךְ חֲדָא מַתְקְלָא עַשְרָא סַלְעִין דִי הֲוַת דְדַהֲבָא קָרִיב יָתָהּ מַלְיָא רֵישֵׁי בּוּסְמָנִין טָבִין וּמְפֻטְמִין וְדַכְיָין לִקְטוֹרֶת בּוּסְמַיָא:", "tj_en": "one pan (censer) weighing ten silver shekels, but it was itself of good gold; and he brought it full of good sweet incense of the separation;", "rashi": "<b>עשרה זהב.<\/b> כְּתַרְגּוּמוֹ, מִשְׁקַל עֶשֶׂר שִׁקְלֵי הַקֹּדֶשׁ הָיָה בָהּ:<br><br><b>מלאה קטרת.<\/b> לֹא מָצִינוּ קְטֹרֶת לְיָחִיד וְלֹא עַל מִזְבֵּחַ הַחִיצוֹן אֶלָּא זוֹ בִּלְבַד, וְהוֹרָאַת שָׁעָה הָיְתָה (מנחות נ'):", "rashi_en": "עשרה זהב — Understand this as the Targum does: there was in it (it contained) the weight of ten shekels of the Sanctuary.<br><br>מלאה קטרת FULL OF FRANKINCENSE — We do not find frankincense prescribed as an offering for an individual, nor to have been offered on the outer altar except this one alone; this offering of frankincense by the princes was therefore an הוראת שעה, a temporary measure (Menachot 50b)."}, {"ch": 7, "v": 15, "aliyah": 5, "heb": "פַּ֣ר אֶחָ֞ד בֶּן־בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ־אֶחָ֥ד בֶּן־שְׁנָת֖וֹ לְעֹלָֽה׃", "onk": "תּוֹר חַד בַּר תּוֹרֵי דְּכַר חַד אִמַּר חַד בַּר שַׁתֵּיהּ לַעֲלָתָא:", "onk_en": "One young bull, one ram, and one yearling sheep for a burnt-offering.", "pj": "תּוֹר חָד בַּר תּוֹרִין בַּר תְּלַת שְׁנִין דְכַר חָד בַּר תַּרְתֵּין שְׁנִין וְאִימַר חָד בַּר שַׁתֵּיהּ תְּלָתֵיהוֹן קְרַב רַב שִׁבְטָא דִיהוּדָה לַעֲלָתָא", "pj_en": "one young bullock of three years, one ram of two years, and one lamb of the year. These three did the chief of the tribe Jehudah bring for a burnt offering;", "tj": "תּוֹר חָד בַּר תּוֹרִין בַּר תְּלַת שְׁנִין דְכַר חָד בַּר תַּרְתֵּין שְׁנִין אִמַר חָד בַּר שַׁתְיֵהּ לַעֲלָתָא הֲוָה רַב שִׁבְטָא מַקְרִיב לְעֵילָא:", "tj_en": "one young bullock of three years, one ram of two years, and one lamb of the year. These three did the chief of the tribe Jehudah bring for a burnt offering;", "rashi": "<b>פר אחד.<\/b> מְיֻחָד שֶׁבְּעֶדְרוֹ (עי' ספרי):", "rashi_en": "פר אחד ONE BULLOCK — i.e. that which is unique (מיוחד) in the herd (cf. Sifrei Bamidbar 50)."}, {"ch": 7, "v": 16, "aliyah": 5, "heb": "שְׂעִיר־עִזִּ֥ים אֶחָ֖ד לְחַטָּֽאת׃", "onk": "צְפִיר בַּר עִזִּין חַד לְחַטָּאתָא:", "onk_en": "[And] one he-goat, for a sin-offering.", "pj": "צְפִיר בַּר עִזִין חָד קְרִיב לְחַטָאתָא", "pj_en": "one kid of the goats he brought for a sin offering;", "tj": "צְפִיר בַּר עִיזִין חַד קָרֵיב רַב שִׁבְטָא לְחַטָאתָא:", "tj_en": "one kid of the goats brought he for a sin offering;", "rashi": "<b>שעיר עזים אחד לחטאת.<\/b> לְכַפֵּר עַל קֶבֶר הַתְּהוֹם — טֻמְאַת סָפֵק (עי' ספרי):", "rashi_en": "שעיר עזים אחד לחטאת ONE KID OF THE GOATS FOR A SIN-OFFERING, to make expiation for uncleanness caused by a grave in the depths of the earth, (i.e. one that is not known to exist and it might therefore be assumed that people passed over it and thereby unwittingly became unclean), which was only a doubtful uncleanness (one about which there exists a doubt as to whether it actually has been incurred or not) (cf. Sifrei Bamidbar 51). "}, {"ch": 7, "v": 17, "aliyah": 5, "heb": "וּלְזֶ֣בַח הַשְּׁלָמִים֮ בָּקָ֣ר שְׁנַ֒יִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי־שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קׇרְבַּ֥ן נַחְשׁ֖וֹן בֶּן־עַמִּינָדָֽב׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְנִכְסַת <b>קוּדְשַׁיָּא<\/b> תּוֹרִין תְּרֵין דִּכְרֵי חַמְשָׁא גְּדָיֵי חַמְשָׁא אִמְּרִין בְּנֵי שְׁנָא חַמְשָׁא דֵּין קֻרְבָּנָא דְנַחְשׁוֹן בַּר עַמִּינָדָב:", "onk_en": "For the peace [<b>sacred<\/b>]-offering, two oxen, five rams, five kids, and five yearling sheep. This was the offering of Nachshon the son of Aminadav.", "pj": "וּלְנִכְסַת קוּדְשַׁיָא תּוֹרִין תְּרֵין דִכְרִין חַמְשָׁא בַּרְחֵי חַמְשָׁא אִמְרִין בְּנֵי שְׁנָה חַמְשָׁא דֵין סֵדֶר קוּרְבָּנָא דִי יְקָרֵיב מִנִכְסוֹי נַחְשׁוֹן בַּר עַמִינָדָב", "pj_en": "and for consecrated victims, two oxen, five rams, five goats, lambs of the year five: this is the order of the oblation which Nachshon bar Amminadab offered of his wealth.", "tj": "וּלְנִכְסַת קוּדְשַׁיָא קְרֵיב תּוֹרִין תְּרֵין דִכְרִין תְּרֵין גַדְיָין חַמְשָׁא וְאִמְרִין בְּנֵי שַׁתְהוֹן חַמְשָׁא דֵין קוּרְבָּנָא דְיִסְדַר וּקְרַב מִן נִכְסוֹי רַב שִׁבְטָא דִבְנוֹי דִיהוּדָה נַחְשׁוֹן בַּר עַמִינָדָב:", "tj_en": "and for consecrated victims, two oxen, five rams, five goats, lambs of the year five: this is the order of the oblation which Nachshon Bar Amminadab offered of his wealth.", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 18, "aliyah": 5, "heb": "בַּיּוֹם֙ הַשֵּׁנִ֔י הִקְרִ֖יב נְתַנְאֵ֣ל בֶּן־צוּעָ֑ר נְשִׂ֖יא יִשָּׂשכָֽר׃", "onk": "בְּיוֹמָא תִּנְיָנָא קָרִיב נְתַנְאֵל בַּר צוּעָר רַבָּא דְיִשָּׂשכָר:", "onk_en": "On the second day, [he that] brought [was] Nesanel the son of Tzu’ar, the leader of Yissachar.", "pj": "בְּיוֹמָא תִּנְיָינָא קָרֵיב יַת קָרְבְּנֵיהּ נְתַנְאֵל בַּר צוּעָר רַב בֵּית אַבָּא לְשִׁבְטָא דִישָשכָר", "pj_en": "On the second day, Nethanel bar Zuar, chief of the house of the fathers of the tribe Issakar, brought his oblation.", "tj": "", "tj_en": "", "rashi": "<b>הקריב נתנאל בן צוער … הקרב את קרבנו.<\/b> מַה תַּ\"ל \"הִקְרִיב\" בְּשִׁבְטוֹ שֶׁל יִשָּׂשכָר מַה שֶּׁלֹּא נֶאֱמַר בְּכָל הַשְּׁבָטִים? לְפִי שֶׁבָּא רְאוּבֵן וְעִרְעֵר וְאָמַר: אַחַר שֶׁקְּדָמַנִי יְהוּדָה, אַקְרִיב אֲנִי אַחֲרָיו, אָמַר לוֹ מֹשֶׁה מִפִּי הַגְּבוּרָה נֶאֱמַר לִי שֶׁיַּקְרִיבוּ כְּסֵדֶר מַסָּעוֹת — לְדִגְלֵיהֶם, לְכָךְ אָמַר הִקְרִב אֶת קָרְבָּנוֹ, וְהוּא חָסֵר יוֹ\"ד, שֶׁהוּא מַשְׁמַע הַקְרֵב, לְשׁוֹן צִוּוּי, שֶׁמִּפִּי הַגְּבוּרָה נִצְטַוָּה \"הַקְרֵב\". וּמַהוּ הִקְרִיב הִקְרִיב שְׁנֵי פְעָמִים? שֶׁבִּשְׁבִיל שְׁנֵי דְבָרִים זָכָה לְהַקְרִיב שֵׁנִי לַשְּׁבָטִים, אַחַת שֶׁהָיוּ יוֹדְעִים בַּתּוֹרָה, שֶׁנֶּאֱמַר \"וּמִבְּנֵי יִשָּׂשכָר יוֹדְעֵי בִינָה לַעִתִּים\" (דבהי\"א י\"ב), וְאַחַת שֶׁהֵם נָתְנוּ עֵצָה לַנְּשִׂיאִים לְהִתְנַדֵּב קָרְבָּנוֹת הַלָּלוּ. וּבִיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן מָצָאתִי, אָמַר רַבִּי פִּנְחָס בֶּן יָאִיר נְתַנְאֵל בֶּן צוּעָר הִשִּׂיאָן עֵצָה זוֹ:", "rashi_en": "הקריב נתנאל בן צוער... הקרב את קרבנו NETANEL BROUGHT HIS OFFERING...HE BROUGHT HIS OFFERING: Why is the word הִקְרִב, “brought [his offering],” used in connection with the tribe of Issachar, but is not used in connection with any of the [other] tribes? Because [the tribe of] Reuben came and complained, “Is it not enough that my brother Judah has preceded me? Let me [at least] offer up after him.” Moses said to him,“I was told by the Almighty that they should offer up in the order in which they travel, according to their divisions.” This is why it says: הִקְרִב אֶת קָרְבָּנוֹ, [in which the word הִקְרִב is] missing a“yud,” [thus] giving it the meaning of הַקְרֵב, in the imperative for he was commanded by the Almighty,“Bring the offering!” What is the meaning of הִקְרִב … הִקְרִב, twice? For because of two reasons he [Issachar] merited to be the second of the tribes to offer their sacrifices: One, because they were [well] versed in the Torah, as it says,“And of the sons of Issachar, those who had understanding of the times” (I Chron. 12:32). Another, because they advised the princes to contribute these offerings (Sifrei Bamidbar 53). In the treatise of Rabbi Moses Hadarshan [“the preacher”], I found [the following]: Rabbi Pinchas the son of Yair says [that] Netanel the son of Zu’ar gave them this idea."}, {"ch": 7, "v": 19, "aliyah": 5, "heb": "הִקְרִ֨ב אֶת־קׇרְבָּנ֜וֹ קַֽעֲרַת־כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּמֵאָה֮ מִשְׁקָלָהּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ שְׁנֵיהֶ֣ם&thinsp;<b>׀<\/b> מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן לְמִנְחָֽה׃", "onk": "קָרִיב יָת קֻרְבָּנֵיהּ מְגִסְתָּא דִכְסַף חֲדָא מְאָה וּתְלָתִין סִלְעִין הֲוָה מַתְקְלַהּ מִזְרְקָא חַד דִּכְסַף מַתְקְלֵיהּ שַׁבְעִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא תַּרְוֵיהוֹן מְלַן סֻלְתָּא דְּפִילָא בִמְשַׁח לְמִנְחָתָא:", "onk_en": "He brought forward his offering, one silver tray, its weight was one hundred thirty [<i>shekolim<\/i>]; one silver bowl [that weighed] seventy <i>shekolim<\/i> according to sanctuary weights. Both were filled with fine flour kneaded with [olive] oil, for a meal-offering.", "pj": "קָרֵיב יַת קוּרְבָּנֵיהּ בָּתַר יְהוּדָה עַל פּוּם קוּדְשָׁא פַיְילֵי דִכְסַף חֲדָא גִילְדָא סְמִיךְ מְאָה וּתְלָתִין סִלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁה הֲוָה מַתְקְלֵיה מַזִירְקָא חֲדָא דִכְסֵף דְגִילְדָא קַלִיש שׁוּבְעִין סִלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁה תְּרֵין מָנַיָא הָאִילֵן קְרֵיב יַתְהוֹן מַלְיָין סְמִידָא מִן אַפְרָשוּתָא פְּתִיכָא בִּמְשַׁח זֵיתָא לְמִנְחָתָא", "pj_en": "He brought his oblation after Jehudah by commandment of the Holy: one silver dish thickly embossed, one hundred and thirty shekels, &amp;c., as the first.", "tj": "", "tj_en": "", "rashi": "<b>קערת כסף.<\/b> מִנְיַן אוֹתִיוֹתָיו בְּגִימַטְרִיָּא תתק\"ל, כְּנֶגֶד שְׁנוֹתָיו שֶׁל אָדָם הָרִאשׁוֹן:<br><br><b>שלשים ומאה משקלה.<\/b> עַל שֵׁם שֶׁכְּשֶׁהֶעֱמִיד תּוֹלָדוֹת לְקִיּוּם הָעוֹלָם בֶּן ק\"ל שָנָה הָיָה, שֶׁנֶּאֱמַר \"וַיְחִי אָדָם שְׁלֹשִׁים וּמְאַת שָׁנָה וַיּוֹלֶד\" וְגוֹ' (בראשית ה'):<br><br><b>מזרק אחד כסף.<\/b> בְּגִימַטְרִיָּא תק\"ך, עַל שֵׁם נֹחַ שֶׁהֶעֱמִיד תּוֹלָדוֹת בֶּן ת\"ק שָׁנָה, וְעַל שֵׁם עֶשְֹרִים שָׁנָה שֶׁנִּגְזְרָה גְּזֵרַת הַמַּבּוּל קֹדֶם תּוֹלְדוֹתָיו — כְּמוֹ שֶׁפֵּרַשְׁתִּי אֵצֶל \"וְהָיוּ יָמָיו מֵאָה וְעֶשְׂרִים שָׁנָה\" (שם ו') — לְפִיכָךְ נֶאֱמַר — מִזְרָק אֶחָד כֶּסֶף, וְלֹא נֶאֱמַר מִזְרָק כֶּסֶף אֶחָד כְּמוֹ שֶׁנֶּאֱמַר בַּקְּעָרָה, לוֹמַר שֶׁאַף אוֹתִיּוֹת שֶׁל אֶחָד מִצְטָרְפוֹת לַמִּנְיָן:<br><br><b>שבעים שקל.<\/b> כְּנֶגֶד שִׁבְעִים אֻמּוֹת שֶׁיָּצְאוּ מִבָּנָיו:", "rashi_en": "קערת כסף — The numerical value of its letters (of the letters of these two words) is 930 corresponding to the years of Adam ha-Rishon (Numbers Rabbah 14:12).<br><br>שלשים ומאה משקלה THE WEIGHT THEREOF WAS AN HUNDRED AND THIRTY SHEKELS — in allusion to the fact that when he (Adam) first raised children to maintain the world in existence he was 130 years old, for it is said, (Genesis 5:3) “and Adam lived a hundred and thirty years and then begat [a son]” (Numbers Rabbah 14:12).<br><br>מזרק אחד כסף — The numerical value of these words is 520, being an allusion to Noah who begot children at the age of 500 and also an allusion to the twenty years before his offspring were born when the decree regarding the flood was made (thus together 520 years) — just as I have set forth in my comment upon the verse (Genesis 6:3): “yet his days shall be 120 years”. — It is for this reason that it is here said, מזרק אחד כסף and it is not said, מזרק כסף אחד, the number being placed at the end of the phrase, as it is said of the charger (קערת כסף אחת), — to indicate that the letters of the word אחד, too, should be taken into account in this reckoning (Numbers Rabbah 14:12).<br><br>שבעים שקל SEVENTY SHEKELS — corresponding to the seventy nations that descended from his (Noah’s) sons (Numbers Rabbah 14:12)."}, {"ch": 7, "v": 20, "aliyah": 5, "heb": "כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃", "onk": "בָּזִיכָא חֲדָא מַתְקַל עֲשַׂר סִלְעִין הִיא דִדְהַב מַלְיָא קְטֹרֶת בּוּסְמַיָּא:", "onk_en": "One spoon of ten gold [<i>shekolim<\/i>] filled with incense.", "pj": "בָּזִיכָא חֲדָא מַתְקְלָא עֲשְרָא סִלְעִין וְהִיא דִדְהַב טָב קָרִיב יָתָהּ מַלְיָא קְטוֹרֶת בּוּסְמָנִין טָבִין מִן אַפְרָשׁוּתָא", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "<b>כף אחת.<\/b> כְּנֶגֶד הַתּוֹרָה שֶׁנִּתְּנָה מִיָּדוֹ שֶׁל הַקָּבָּ\"ה:<br><br><b>עשרה זהב.<\/b> כְּנֶגֶד עֲשֶׂרֶת הַדִּבְּרוֹת:<br><br><b>מלאה קטרת.<\/b> גִּימַטְרִיָּא שֶׁל קְטֹרֶת תרי\"ג מִצְוֹת, וּבִלְבַד שֶׁתַּחֲלִיף קוֹ\"ף בְּדָלֶ\"ת עַ\"יְ א\"ת ב\"ש ג\"ר ד\"ק:", "rashi_en": "כף) כף אחת also denotes “hand”) — in allusion to the Torah that was given from the hand of the Holy One, blessed be He (Numbers Rabbah 13:16).<br><br>עשרה זהב — TEN SHEKELS, GOLD — corresponding to the Ten Commandments (Numbers Rabbah 13:16).<br><br>מלאה קטרת — The total of the word קטרת according to their numerical value is 613, the number of the Biblical commandments, except that you must exchange the קו\"ף by דל\"ת, according to the “Method of Permutation” known as א׳׳ת ב\"ש ג\"ר ד\"ק (by which the first letter of the Alphabet may take the place of the last, the second that of the one before last etc.) (Numbers Rabbah 13:16)."}, {"ch": 7, "v": 21, "aliyah": 5, "heb": "פַּ֣ר אֶחָ֞ד בֶּן־בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ־אֶחָ֥ד בֶּן־שְׁנָת֖וֹ לְעֹלָֽה׃", "onk": "תּוֹר חַד בַּר תּוֹרֵי דְּכַר חַד אִמַּר חַד בַּר שַׁתֵּיהּ לַעֲלָתָא:", "onk_en": "One young bull, one ram, and one yearling sheep for a burnt-offering.", "pj": "תּוֹר חַד בַּר תּוֹרִין בַּר תְּלַת שְׁנִין דְּכַר חָד בַּר תַּרְתֵּין שְׁנִין אִימַר חַד בַּר שַׁתֵּיהּ קְרִיב רַב שִׁבְטָא דְיִשָשְכָר לַעֲלָתָא", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "<b>פר אחד.<\/b> כְּנֶגֶד אַבְרָהָם, שֶׁנֶּאֱמַר בּוֹ \"וַיִּקַּח בֶּן בָּקָר\" (שם י\"ח):<br><br><b>איל אחד.<\/b> כְּנֶגֶד יִצְחָק, \"וַיִּקַּח אֶת הָאַיִל\" וְגוֹ' (שם כ\"ב):<br><br><b>כבש אחד.<\/b> כְּנֶגֶד יַעֲקֹב, \"וְהַכְּשָׂבִים הִפְרִיד יַעֲקֹב\" (שם ל'):", "rashi_en": "פר אחד ONE BULLOCK, [A YOUNG ONE, בן בקר] — in allusion to Abraham of whom it states, (Genesis 18:7) “And he took a young bull (בן בקר)\" (Numbers Rabbah 13:14). <br><br>איל אחד ONE RAM — in allusion to Isaac, with reference to whom Scripture states, (Genesis XXII 13) “and he (Abraham) took the ram (האיל) [and offered it up … in the stead of his son]” (Numbers Rabbah 13:14).<br><br>כבש אחד ONE LAMB — in allusion to Jacob of whom Scripture states, (Genesis 30:40) “and Jacob did separate the lambs” (Numbers Rabbah 13:14)."}, {"ch": 7, "v": 22, "aliyah": 5, "heb": "שְׂעִיר־עִזִּ֥ים אֶחָ֖ד לְחַטָּֽאת׃", "onk": "צְפִיר בַּר עִזִּין חַד לְחַטָּאתָא:", "onk_en": "[And] one he-goat for a sin-offering.", "pj": "צְפִיר בַּר עִזִין חַד קְרִיב לְחַטָאתָא", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "<b>שעיר עיזים.<\/b> לְכַפֵּר עַל מְכִירַת יוֹסֵף שֶׁנֶּאֱמַר בּוֹ \"וַיִּשְׁחֲטוּ שְׂעִיר עִזִּים\" (שם ל\"ז):", "rashi_en": "שעיר עזים [ONE] KID OF THE GOATS — in order to make expiation for the “selling of Joseph” with reference to whom it states, (Genesis 37:31) “and they slaughtered a kid of the goats” (Numbers Rabbah 13:13)."}, {"ch": 7, "v": 23, "aliyah": 5, "heb": "וּלְזֶ֣בַח הַשְּׁלָמִים֮ בָּקָ֣ר שְׁנַ֒יִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי־שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קׇרְבַּ֥ן נְתַנְאֵ֖ל בֶּן־צוּעָֽר׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְנִכְסַת קוּדְשַׁיָּא תּוֹרִין תְּרֵין דִּכְרֵין חַמְשָׁא גְּדָיֵי חַמְשָׁא אִמְּרִין בְּנֵי שְׁנָא חַמְשָׁא דֵּין קֻרְבַּן נְתַנְאֵל בַּר צוּעָר:", "onk_en": "For the peace-offering sacrifice, two oxen, five rams, five kids, and five yearling sheep. This was the offering of Nesanel the son of Tzu’ar.", "pj": "וּלְנִכְסַת קוּדְשַׁיָא תּוֹרִין תְּרֵין דִכְרֵי חַמְשָׁא בַּרְחֵי חַמְשָׁא אִמְרִין בְּנֵי שַׁתָּא חַמְשָׁא דֵין סֵדֶר קוּרְבָּנָא דְקָרֵיב מִנִכְסוֹי נְתַנְאֵל בַּר צוּעָר", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "<b>ולזבח השלמים בקר שנים.<\/b> כְּנֶגֶד מֹשֶׁה וְאַהֲרֹן שֶׁנָּתְנוּ שָׁלוֹם בֵּין יִשְׂרָאֵל לַאֲבִיהֶם שֶׁבַּשָּׁמַיִם:<br><br><b>אלים כבשים ועתדים.<\/b> שְׁלֹשָׁה מִינִים כְּנֶגֶד כֹּהֲנִים וּלְוִיִּם וְיִשְׂרְאֵלִים, וּכְנֶגֶד תּוֹרָה נְבִיאִים וּכְתוּבִים, שָׁלֹשׁ חֲמִשִּׁיּוֹת כְּנֶגֶד חֲמִשָּׁה חֻמְשִׁין וַחֲמֵשֶׁת הַדִּבְּרוֹת הַכְּתוּבִין עַל לוּחַ אֶחָד וַחֲמִשָּׁה הַכְּתוּבִים עַל הַשֵּׁנִי; עַד כָּאן בִּיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן:", "rashi_en": "ולזבח השלמים בקר שנים AND FOR A SACRIFICE OF PEACE-OFFERINGS TWO OXEN — The two peace-offerings are an allusion to Moses and Aaron who made peace between Israel and their Father in Heaven (Numbers Rabbah 13:19).<br><br>אילם כבשים ועתדים — three species — in allusion to the three divisions of the nation: priests, Levites and ordinary Israelites, and also in allusion to the Pentateuch, the Prophets and the Hagiographa, the three sections of the Holy Scriptures. There are three times “five”, in allusion to the “Five Books of Moses”, to the five Commandments written on one of the Tablets and to the five written on the other (Numbers Rabbah 14:10). Thus far have I found in the work of R. Moshe the Preacher."}, {"ch": 7, "v": 24, "aliyah": 5, "heb": "בַּיּוֹם֙ הַשְּׁלִישִׁ֔י נָשִׂ֖יא לִבְנֵ֣י זְבוּלֻ֑ן אֱלִיאָ֖ב בֶּן־חֵלֹֽן׃", "onk": "בְּיוֹמָא תְּלִיתָאָה רַבָּא לִבְנֵי זְבוּלֻן אֱלִיאָב בַּר חֵלוֹן:", "onk_en": "On the third day, the leader of the sons of Zevulun, Eliav the son of Cheilon.", "pj": "בְּיוֹמָא תְּלִיתָאָה קְרֵיב רַב בֵּית אַבָּא לִבְנֵי זְבוּלֻן אֱלִיאָב בַּר חֵלוֹן", "pj_en": "On the third day, Eliab bar Helon, prince of the Beni Zebulon, offered.", "tj": "", "tj_en": "", "rashi": "<b>ביום השלישי נשיא וגו'.<\/b> בַּיּוֹם הַשְּׁלִישִׁי הָיָה הַנָּשִׂיא הַמַּקְרִיב זְבוּלֻן, וְכֵן כֻּלָּם, אֲבָל בִּנְתַנְאֵל שֶׁנֶּאֱמַר בּוֹ הִקְרִיב נְתַנְאֵל, נוֹפֵל אַחֲרָיו הַלָּשׁוֹן לוֹמַר נְשִׂיא יִשָּׂשכָר, לְפִי שֶׁכְּבָר הִזְכִּיר שְׁמוֹ וְהַקְרָבָתוֹ, וּבַשְּׁאָר שֶׁלֹּא נֶאֱמַר בָּהֶן הִקְרִיב, נוֹפֵל עֲלֵיהֶן לָשׁוֹן זֶה — נָשִׂיא לִבְנֵי פְלוֹנִי — אוֹתוֹ הַיּוֹם הָיָה הַנָּשִׂיא הַמַּקְרִיב לְשֵׁבֶט פְּלוֹנִי:", "rashi_en": "ביום השלישי וגו׳ means, ON THE THIRD DAY, THE PRINCE who offered WAS OF THE SONS OF ZEBULUN, and similar is the meaning of the parallel statement in the case of all of them (all the other tribes). In the case of Nethaneel, however, of whom it is stated, (v. 18) הקריב “[on the second day] did Nethaneel the son of Zuar offer”, it is appropriate to use after it the phrase: “the prince of Issachar”, since it has already mentioned his name and the fact that he offered, whilst in the case of the others of whom it is not stated “he offered”, this phrase is the appropriate one, viz., the prince belonging to the sons of that-and-that tribe, when the meaning of the entire sentence is: on that day the prince who offered was of the sons of so-and-so."}, {"ch": 7, "v": 25, "aliyah": 5, "heb": "קׇרְבָּנ֞וֹ קַֽעֲרַת־כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּמֵאָה֮ מִשְׁקָלָהּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ שְׁנֵיהֶ֣ם&thinsp;<b>׀<\/b> מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן לְמִנְחָֽה׃", "onk": "קֻרְבָּנֵיהּ מְגִסְתָּא דִכְסַף חֲדָא מְאָה וּתְלָתִין סִלְעִין הֲוָה מַתְקְלַהּ מִזְרְקָא חַד דִכְסַף מַתְקְלֵיהּ שַׁבְעִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא תַּרְוֵיהוֹן מְלַן סֻלְתָּא דְּפִילָא בִמְשַׁח לְמִנְחָתָא:", "onk_en": "His offering was one silver tray, its weight was one hundred thirty <i>shekolim<\/i>; one silver bowl [that weighed] seventy <i>shekolim<\/i> according to sanctuary weights. Both were filled with fine flour kneaded with [olive] oil, for a meal-offering.", "pj": "קוּרְבָּנֵיהּ דִקְרֵיב פַיְילֵי דִכְסַף חֲדָא גִילְדָא סְמִיך מְאָה וּתְלָתִין סִלְעִין בִּסִלְעֵי קוּדְשָׁא וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 26, "aliyah": 5, "heb": "כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃", "onk": "בָּזִיכָא חֲדָא מַתְקַל עֲשַׂר סִלְעִין הִיא דִדְהַב מַלְיָא קְטֹרֶת בּוּסְמַיָּא:", "onk_en": "One spoon of ten gold [<i>shekolim<\/i>], filled with incense.", "pj": "בָּזִיכָא חֲדָא מַתְקַל וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 27, "aliyah": 5, "heb": "פַּ֣ר אֶחָ֞ד בֶּן־בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ־אֶחָ֥ד בֶּן־שְׁנָת֖וֹ לְעֹלָֽה׃", "onk": "תּוֹר חַד בַּר תּוֹרֵי דְּכַר חַד אִמַּר חַד בַּר שַׁתֵּיהּ לַעֲלָתָא:", "onk_en": "One young bull, one ram, and one yearling sheep for a burnt-offering.", "pj": "תּוֹר חַד וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 28, "aliyah": 5, "heb": "שְׂעִיר־עִזִּ֥ים אֶחָ֖ד לְחַטָּֽאת׃", "onk": "צְפִיר בַּר עִזִּין חַד לְחַטָּאתָא:", "onk_en": "[And] one he-goat for a sin-offering.", "pj": "צְפִיר בַּר עִזִין וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 29, "aliyah": 5, "heb": "וּלְזֶ֣בַח הַשְּׁלָמִים֮ בָּקָ֣ר שְׁנַ֒יִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי־שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קׇרְבַּ֥ן אֱלִיאָ֖ב בֶּן־חֵלֹֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְנִכְסַת קוּדְשַׁיָּא תּוֹרִין תְּרֵין דִּכְרֵי חַמְשָׁא גְּדָיֵי חַמְשָׁא אִמְּרִין בְּנֵי שְׁנָא חַמְשָׁא דֵּין קֻרְבַּן אֱלִיאָב בַּר חֵלוֹן", "onk_en": "For the peace-offering sacrifice, two oxen, five rams, five kids and five yearling sheep. This was the offering of of Eliav the son of Cheilon.", "pj": "וּלְנִכְסַת קוּדְשַׁיָא וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 30, "aliyah": 5, "heb": "בַּיּוֹם֙ הָרְבִיעִ֔י נָשִׂ֖יא לִבְנֵ֣י רְאוּבֵ֑ן אֱלִיצ֖וּר בֶּן־שְׁדֵיאֽוּר׃", "onk": "בְּיוֹמָא רְבִיעָאָה רַבָּא לִבְנֵי רְאוּבֵן אֱלִיצוּר בַּר שְׁדֵיאוּר:", "onk_en": "On the fourth day, the leader of the sons of Reuven, Elitzur the son of Shdeiur.", "pj": "בְּיוֹמָא רְבִיעָאָה קְרֵיב רַב בֵּית אַבָּא לִבְנֵי רְאוּבֵן אֱלִיצוּר בַּר שְׁדֵיאוּר", "pj_en": "On the fourth, Elizur bar Shedeur, prince of the Beni Reuben;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 31, "aliyah": 5, "heb": "קׇרְבָּנ֞וֹ קַֽעֲרַת־כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּמֵאָה֮ מִשְׁקָלָהּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ שְׁנֵיהֶ֣ם&thinsp;<b>׀<\/b> מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן לְמִנְחָֽה׃", "onk": "קֻרְבָּנֵיהּ מְגִסְתָּא דִכְסַף חֲדָא מְאָה וּתְלָתִין סִלְעִין הֲוָה מַתְקְלַהּ מִזְרְקָא חַד דִּכְסַף מַתְקְלֵיהּ שַׁבְעִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא תַּרְוֵיהוֹן מְלַן סֻלְתָּא דְּפִילָא בִמְשַׁח לְמִנְחָתָא:", "onk_en": "His offering was one silver tray, its weight was one hundred thirty <i>shekolim<\/i>; one silver bowl [that weighed] seventy <i>shekolim<\/i> according to sanctuary weights. Both were filled with fine flour kneaded with [olive] oil, for a meal-offering.", "pj": "קוּרְבָּנֵיהּ דִקְרֵיב פַיְילִי וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 32, "aliyah": 5, "heb": "כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃", "onk": "בָּזִיכָא חֲדָא מַתְקַל עֲשַׂר סִלְעִין הִיא דִדְהַב מַלְיָא קְטֹרֶת בּוּסְמַיָּא:", "onk_en": "One spoon of ten gold [<i>shekolim<\/i>], filled with incense.", "pj": "בָּזִיכָא חֲדָא מַת  רַב בֵּית אַבָּא לִבְנֵי אֶפְרַיִם אֱלִישָׁמָע בַּר עַמִיהוּד", "pj_en": "on the seventh, Elishama bar Ammihud, prince of the Beni Ephraim;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 49, "aliyah": 6, "heb": "קׇרְבָּנ֞וֹ קַֽעֲרַת־כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּמֵאָה֮ מִשְׁקָלָהּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ שְׁנֵיהֶ֣ם&thinsp;<b>׀<\/b> מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן לְמִנְחָֽה׃", "onk": "קֻרְבָּנֵיהּ מְגִסְתָּא דִכְסַף חֲדָא מְאָה וּתְלָתִין סִלְעִין הֲוָה מַתְקְלַהּ מִזְרְקָא חַד דִּכְסַף מַתְקְלֵיהּ שַׁבְעִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא תַּרְוֵיהוֹן מְלַן סֻלְתָּא דְּפִילָא בִמְשַׁח לְמִנְחָתָא:", "onk_en": "His offering was one silver tray, its weight was one hundred thirty <i>shekolim<\/i>; one silver bowl [that weighed] seventy <i>shekolim<\/i> according to sanctuary weights. Both were filled with fine flour kneaded with [olive] oil, for a meal-offering.", "pj": "קוּרְבָּנֵיהּ דִקְרֵיב פַיְילֵי וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 50, "aliyah": 6, "heb": "כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃", "onk": "בָּזִיכָא חֲדָא מַתְקַל עֲשַׂר סִלְעִין הִיא דִדְהַב מַלְיָא קְטֹרֶת בּוּסְמַיָּא:", "onk_en": "One spoon of ten gold [<i>shekolim<\/i>], filled with incense.", "pj": "בָּזִיכָא חֲדָא מַתְקַל וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 51, "aliyah": 6, "heb": "פַּ֣ר אֶחָ֞ד בֶּן־בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ־אֶחָ֥ד בֶּן־שְׁנָת֖וֹ לְעֹלָֽה׃", "onk": "תּוֹר חַד בַּר תּוֹרֵי דְּכַר חַד אִמַּר חַד בַּר שַׁתֵּיהּ לַעֲלָתָא:", "onk_en": "One young bull, one ram, and one yearling sheep for a burnt-offering.", "pj": "תּוֹר חָד בַּר תּוֹרִין וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 52, "aliyah": 6, "heb": "שְׂעִיר־עִזִּ֥ים אֶחָ֖ד לְחַטָּֽאת׃", "onk": "צְפִיר בַּר עִזִּין חַד לְחַטָּאתָא:", "onk_en": "[And] one he-goat for a sin-offering.", "pj": "צְפִיר בַּר עִזִין וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 53, "aliyah": 6, "heb": "וּלְזֶ֣בַח הַשְּׁלָמִים֮ בָּקָ֣ר שְׁנַ֒יִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי־שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קׇרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן־עַמִּיהֽוּד׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְנִכְסַת קוּדְשַׁיָּא תּוֹרִין תְּרֵין דִּכְרִין חַמְשָׁא גְּדָיֵי חַמְשָׁא אִמְּרִין בְּנֵי שְׁנָא חַמְשָׁא דֵּין קֻרְבַּן אֱלִישָׁמָע בַּר עַמִּיהוּד:", "onk_en": "For the peace-offering sacrifice, two oxen, five rams, five kids and five yearling sheep. This was the offering of Elishamah the son of Amihud.", "pj": "וּלְנִכְסַת קוּדְשַׁיָא וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 54, "aliyah": 6, "heb": "בַּיּוֹם֙ הַשְּׁמִינִ֔י נָשִׂ֖יא לִבְנֵ֣י מְנַשֶּׁ֑ה גַּמְלִיאֵ֖ל בֶּן־פְּדָהצֽוּר׃", "onk": "בְּיוֹמָא תְּמִינָאָה רַבָּא לִבְנֵי מְנַשֶּׁה גַּמְלִיאֵל בַּר פְּדָהצוּר:", "onk_en": "On the eighth day, the leader of the sons of Menashe, Gamliel the son of Pedahtzur.", "pj": "בְּיוֹמָא תְמִינָאָה קְרֵיב רַב בֵּית אַבָּא לִבְנֵי מְנַשֶׁה גַמְלִיאֵל בַּר פְּדָהצוּר", "pj_en": "on the eighth, Gamaliel bar Pedazur, prince of Menasheh;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 55, "aliyah": 6, "heb": "קׇרְבָּנ֞וֹ קַֽעֲרַת־כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּמֵאָה֮ מִשְׁקָלָהּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ שְׁנֵיהֶ֣ם&thinsp;<b>׀<\/b> מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן לְמִנְחָֽה׃", "onk": "קֻרְבָּנֵיהּ מְגִסְתָּא דִכְסַף חֲדָא מְאָה וּתְלָתִין סִלְעִין הֲוָה מַתְקְלַהּ מִזְרְקָא חַד דִּכְסַף מַתְקְלֵיהּ שַׁבְעִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא תַּרְוֵיהוֹן מְלַן סֻלְתָּא דְּפִילָא בִמְשַׁח לְמִנְחָתָא:", "onk_en": "His offering was one silver tray, its weight was one hundred thirty <i>shekolim<\/i>; one silver bowl [that weighed] seventy <i>shekolim<\/i> according to sanctuary weights. Both were filled with fin ְׁנֵיהֶ֣ם&thinsp;<b>׀<\/b> מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן לְמִנְחָֽה׃", "onk": "קֻרְבָּנֵיהּ מְגִסְתָּא דִכְסַף חֲדָא מְאָה וּתְלָתִין סִלְעִין הֲוָה מַתְקְלַהּ מִזְרְקָא חַד דִּכְסַף מַתְקְלֵיהּ שַׁבְעִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא תַּרְוֵיהוֹן מְלַן סֻלְתָּא דְּפִילָא בִמְשַׁח לְמִנְחָתָא:", "onk_en": "His offering was one silver tray its weight was one hundred thirty <i>shekolim<\/i>; one silver bowl [that weighed] seventy <i>shekolim<\/i> according to sanctuary weights. Both were filled with fine flour kneaded with [olive] oil, for a meal-offering.", "pj": "קוּרְבָּנֵיהּ דִקְרֵיב פַיְילֵי דִכְסַף חֲדָא מֵאָה וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 80, "aliyah": 7, "heb": "כַּ֥ף אַחַ֛ת עֲשָׂרָ֥ה זָהָ֖ב מְלֵאָ֥ה קְטֹֽרֶת׃", "onk": "בָּזִיכָא חֲדָא מַתְקַל עֲשַׂר סִלְעִין הִיא דִדְהַב מַלְיָא קְטֹרֶת בּוּסְמַיָּא:", "onk_en": "One spoon of ten gold [<i>shekolim<\/i>], filled with incense.", "pj": "בָּזִיכָא חַדָא מַתְקַל עֲשַר וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 81, "aliyah": 7, "heb": "פַּ֣ר אֶחָ֞ד בֶּן־בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ־אֶחָ֥ד בֶּן־שְׁנָת֖וֹ לְעֹלָֽה׃", "onk": "תּוֹר חַד בַּר תּוֹרֵי דְּכַר חַד אִמַּר חַד בַּר שַׁתֵּיהּ לַעֲלָתָא:", "onk_en": "One young bull, one ram, and one yearling sheep for a burnt-offering.", "pj": "תּוֹר חַד בַּר תּוֹרִין וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 82, "aliyah": 7, "heb": "שְׂעִיר־עִזִּ֥ים אֶחָ֖ד לְחַטָּֽאת׃", "onk": "צְפִיר בַּר עִזִּין חַד לְחַטָּאתָא:", "onk_en": "[And] one he-goat for a sin-offering.", "pj": "צְפִיר בַּר עִזִין וגו'", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 83, "aliyah": 7, "heb": "וּלְזֶ֣בַח הַשְּׁלָמִים֮ בָּקָ֣ר שְׁנַ֒יִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי־שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קׇרְבַּ֥ן אֲחִירַ֖ע בֶּן־עֵינָֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּלְנִכְסַת קוּדְשַׁיָּא תּוֹרִין תְּרֵין דִּכְרִין חַמְשָׁא גְּדָיֵי חַמְשָׁא אִמְּרִין בְּנֵי שְׁנָא חַמְשָׁא דֵּין קֻרְבַּן אֲחִירַע בַּר עֵינָן:", "onk_en": "For the peace-offering sacrifice, two oxen, five rams, five kids and five yearling sheep. This was the offering of Achirah the son of Einon.", "pj": "וּלְנִכְסַת קוּדְשַׁיָא תּוֹרִין תְּרֵין דִכְרֵי חַמְשָׁא בַּרְחֵי חַמְשָׁא אִמְרִין בְּנֵי שְׁנָה חַמְשָׁא דֵין סֵדֶר קוּרְבָּנָא דִי קְרַב מִנִכְסוֹי אֲחִירַע בַּר עֵינָן", "pj_en": "_", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 84, "aliyah": 7, "heb": "זֹ֣את&thinsp;<b>׀<\/b> חֲנֻכַּ֣ת הַמִּזְבֵּ֗חַ בְּיוֹם֙ הִמָּשַׁ֣ח אֹת֔וֹ מֵאֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי־כֶ֙סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׃", "onk": "דָּא חֲנֻכַּת מַדְבְּחָא בְּיוֹמָא דְּרַבִּיּוּ יָתֵיהּ מִן רַבְרְבֵי יִשְׂרָאֵל מְגִיסֵי כַסְפָּא תַּרְתָּא עַשְׂרֵי מַזְרְקֵי כַסְפָּא תְּרֵין עֲשַׂר בָּזִיכֵי דְדַהֲבָא תַּרְתָּא עַשְׂרֵי:", "onk_en": "This was the dedication of the altar on the day that it was anointed, given by the leaders of Israel; twelve silver trays twelve silver bowls and twelve golden spoons.", "pj": "דָא חֲנֻכַּת רְבוּתֵיהּ דְמַדְבְּחָא בְּיוֹם דְרַבִּיוּ יָתֵיהּ מִנִכְסֵי רַבְרְבֵי יִשְרָאֵל פַּיְילֵי דִכְסַף תַּרְתֵּי סְרֵי כָּל קֳבֵיל תְּרֵיסַר שִׁבְטַיָא מַזִירְקֵי דִכְסַף תְּרֵיסַר כָּל קֳבֵיל נְשִיאָה דִבְנֵי יִשְרָאֵל בָּזִיכֵי דְדַהֲבָא תְּרֵיסַר כָּל קֳבֵיל תְּרֵיסַר מַזָלַיָא", "pj_en": "This is the oblation at the anointing of the altar, on the day that they anointed it, from the riches of the princes of Israel: twelve silver bowls, answering to the twelve tribes; twelve silver vases, answering to the twelve princes of the Beni Israel; twelve golden pans, answering to the twelve signs (mazalia).", "tj": "", "tj_en": "", "rashi": "<b>ביום המשח אתו.<\/b> בּוֹ בַיּוֹם שֶׁנִּמְשַׁח הִקְרִיב, וּמָה אֲנִי מְקַיֵּם \"אַחֲרֵי הִמָּשַׁח\" (פסוק פ\"ח)? שֶׁנִּמְשַׁח תְּחִלָּה וְאַ\"כַּ הִקְרִיב, אוֹ אַחֲרֵי הִמָּשַׁח — לְאַחַר זְמַן וְלֹא בָא לְלַמֵּד בְּיוֹם הִמָּשַׁח אֶלָּא לוֹמַר שֶׁנִּמְשַׁח בַּיּוֹם? כְּשֶׁהוּא אוֹמֵר (ויקרא ז') \"בְּיוֹם מָשְׁחוֹ אֹתָם\", לָמַדְנוּ שֶׁנִּמְשַׁח בַּיּוֹם, וּמַתַּ\"ל \"בְּיוֹם הִמָּשַׁח אֹתוֹ\" ? בַּיּוֹם שֶׁנִּמְשַׁח הִקְרִיב (ספרי):<br><br><b>קערת כסף שתים עשרה.<\/b> הֵם הֵם שֶׁהִתְנַדְּבוּ, וְלֹא אֵרַע בָּהֶם פְּסוּל (שם):", "rashi_en": "ביום המשח אתו [THIS WAS THE DEDICATION OFFERING OF THE ALTAR] IN THE DAY WHEN IT WAS ANOINTED — This implies that on the very same day that it was anointed an offering was brought; but how, then, can I explain, (v. 88) “[This was dedication of the altar] after that it was anointed”? As intimating that it was first anointed and afterwards — but still on the same day — the offering was brought. Or, perhaps, these words אחרי המשח mean “some time (i.e. many days) after it was anointed”, and the phrase here ביום המשח אתו is merely intended to intimate that it was anointed during the day-time (and not at night)! This cannot be so, because when it states, (Leviticus 7:36) “In the day that he anointed them (Aaron and his sons)” we learn that it (the altar) was anointed during the day-time. What, then, must be the meaning of ביום המשח here? What we first suggested — that on the very same day that it was anointed the offering was brought (cf. Sifrei Bamidbar 53).<br><br>קערת כסף שתים עשרה TWELVE CHARGERS OF SILVER — This intimates: these are the same chargers which they had brought as free-will gifts and nothing to disqualify them had happened to them in the meantime (Sifrei Bamidbar 53)."}, {"ch": 7, "v": 85, "aliyah": 7, "heb": "שְׁלֹשִׁ֣ים וּמֵאָ֗ה הַקְּעָרָ֤ה הָֽאַחַת֙ כֶּ֔סֶף וְשִׁבְעִ֖ים הַמִּזְרָ֣ק הָאֶחָ֑ד כֹּ֚ל כֶּ֣סֶף הַכֵּלִ֔ים אַלְפַּ֥יִם וְאַרְבַּע־מֵא֖וֹת בְּשֶׁ֥קֶל הַקֹּֽדֶשׁ׃", "onk": "מְאָה וּתְלָתִין <b>סִלְעִין הֲוָה מַתְקְלָא<\/b> דִמְגִיסְתָּא חֲדָא דְּכַסְפָּא וְשַׁבְעִין דְּמִזְרְקָא חַד כֹּל כְּסַף מָנַיָּא תְּרֵין אַלְפִין וְאַרְבַּע מְאָה בִּסִלְעֵי קוּדְשָׁא:", "onk_en": "One hundred thirty [<b>shekolim was the weight of<\/b>] each silver tray and each bowl weighed seventy [<i>shekolim<\/i>]. All the silver vessels weighed two thousand four hundred [<i>shekolim<\/i>] according to sanctuary weights.", "pj": "מְאָה וּתְלָתִין סִלְעִין הֲוֵי מַתְקְלָא דְפַיְילָתָא חֲדָא דְכַסְפָּא כָּל קֳבֵיל שְׁנִין דַהֲוָת יוֹכֶבֶד כַּד יְלִידַת יַת משֶׁה וְשׁוּבְעִין סִלְעִין הֲוֵי מַתְקְלָא דְמַזִירְקָא חַד כָּל קֳבֵיל שׁוּבְעִין סָבֵי סַנְהֶדְרִין רַבָּא כָּל כְּסַף מָאנַיָא תְּרֵין אַלְפִין וְאַרְבַּע מְאָה סִלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁא", "pj_en": "One hundred and thirty shekels was the weight of each silver bowl, answering to the years of Jokebed when she bare Mosheh; and seventy shekels was the weight of each vase, answering to the seventy elders of the great Sanhedrin: all the silver vessels, two thousand four hundred shekels, in shekels of the sanctuary.", "tj": "", "tj_en": "", "rashi": "<b>שלשים ומאה הקערה האחת וגו'.<\/b> מַה תַּ\"ל? לְפִי שֶׁנֶּאֱמַר \"שְׁלֹשִׁים וּמֵאָה\" וְלֹא פֵּרֵשׁ בְּאֵיזוֹ שֶׁקֶל, לְכָךְ חָזַר וּשְׁנָאָהּ כָּאן, וְכָלַל בְּכֻלָּן — <b>כל כסף הכלים, בשקל הקדש<\/b>:<br><br><b>כל כסף הכלים וגו'.<\/b> לִמֶּדְךָ שֶׁהָיוּ כְלֵי הַמִּקְדָּשׁ מְכֻוָּנִים בְּמִשְׁקָלָן — שׁוֹקְלָן אֶחָד אֶחָד, וְשׁוֹקְלָן כֻּלָּן כְּאֶחָד — לֹא רִבָּה וְלֹא מִעֵט (שם):", "rashi_en": "שלשים ומאה הקערה אחת וגו׳ EACH CHARGER OF SILVER WEIGHING AN HUNDRED AND THIRTY SHEKELS etc. — Why is this stated at all since it has already been staled several times? But because it has only been said “the weight thereof was 130 shekels”, but it does not explain according to which shekel this is reckoned, it (Scripture) therefore repeats it (the number of shekels) here and then makes a general statement with regard to all of them: “all the silver of the vessels was [two thousand and four hundred shekels] after the shekels of the Sanctuary”.<br><br>כל כסף הכלים ALL THE SILVER OF THE VESSELS [WAS TWO THOUSAND AND FOUR HUNDRED SHEKELS etc.] — By giving the sum total of the shekels it teaches you that the vessels of the Sanctuary had their weight exact (thus e.g. a bowl of 70 shekels was exactly 70, neither more nor less) — whether one weighed them each separately or whether one weighed them all together he got neither more nor less than it should have been ( Sifrei Bamidbar 54)."}, {"ch": 7, "v": 86, "aliyah": 7, "heb": "כַּפּ֨וֹת זָהָ֤ב שְׁתֵּים־עֶשְׂרֵה֙ מְלֵאֹ֣ת קְטֹ֔רֶת עֲשָׂרָ֧ה עֲשָׂרָ֛ה הַכַּ֖ף בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ כׇּל־זְהַ֥ב הַכַּפּ֖וֹת עֶשְׂרִ֥ים וּמֵאָֽה׃", "onk": "בָּזִיכֵי דְדַהֲבָא תַּרְתֵּי עַשְׂרֵי מַלְיַן קְטֹרֶת <b>בּוּסְמַיָּא<\/b> מַתְקַל עֲשַׂר סִלְעִין הֲוָה מַתְקְלָא דְבָזִיכָא בְּסִלְעֵי קוּדְשָׁא כָּל דְּהַב בָּזִיכַיָּא מְאָה וְעַשְׂרִין:", "onk_en": "Twelve golden spoons filled with [<b>fragrant<\/b>] incense; each spoon weighed ten [<i>shekolim<\/i>] according to sanctuary weights. The total of the golden spoons is one hundred twenty [<i>shekolim<\/i>].", "pj": "בָּזִיכֵי דְדַהֲבָא תְּרֵי סְרֵי כָּל קֳבֵיל רַבְרְבֵי יִשְרָאֵל מַלְיָן קְטוֹרֶת בּוּסְמִין טָבִין מַתְקַל עֲשַר סִלְעִין הֲוָה מַתְקְלָא דְבָזִיכָא בְּסִלְעֵי בֵּית קוּדְשָׁא כָּל קֳבֵיל עֲשֵירְתָּא דִבְרַיָא כָּל דְהַב בָּזִיכַיָא מְאָה וְעֶשְרִין כָּל קֳבֵיל שְׁנַיָא דְחַיָא בְּהוֹן משֶׁה נְבִיאָה", "pj_en": "The golden pans were twelve, answering to the princes of Israel, full of good sweet incense; the weight of ten shekels was the weight of each pan, answering to the Ten Words; all the gold of the pans, one hundred and and twenty (shekels), answering to the years lived by Mosheh the prophet.", "tj": "", "tj_en": "", "rashi": "<b>כפות זהב שתים עשרה.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר כַּף אַחַת עֲשָׂרָה זָהָב, הִיא שֶׁל זָהָב וּמִשְׁקָלָהּ עֲשָׂרָה שְׁקָלִים שֶׁל כֶּסֶף, אוֹ אֵינוֹ אֶלָּא כַּף אַחַת שֶׁל כֶּסֶף וּמִשְׁקָלָהּ עֲשָׂרָה שִׁקְלֵי זָהָב — וְשִׁקְלֵי זָהָב אֵין מִשְׁקָלָם שָׁוֶה לְשֶׁל כֶּסֶף — תַּ\"ל \"כַּפּוֹת זָהָב\" — שֶׁל זָהָב הָיוּ (שם):", "rashi_en": "כפות זהב שתים עשרה THE GOLDEN SPOONS WERE TWELVE — Why is this stated at all, since we have been told that twelve princes brought each one spoon? But because it is stated in each instance: “one spoon עשרה זהב”, I might explain it either as meaning: it was of gold but its weight was ten shekels of silver, or, perhaps, not so, but it means: one spoon of silver and the weight thereof ten gold-shekels — and the gold-shekels have not their weight equal to those of silver-shekels — Scripture therefore states here, “golden spoons” — the spoons themselves were of gold ( Sifrei Bamidbar 55)."}, {"ch": 7, "v": 87, "aliyah": 7, "heb": "כׇּל־הַבָּקָ֨ר לָעֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים־עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי־שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּמִנְחָתָ֑ם וּשְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְחַטָּֽאת׃", "onk": "כָּל תּוֹרֵי לַעֲלָתָא תְּרֵי עֲשַׂר תּוֹרִין דִּכְרִין תְּרֵי עֲשַׂר אִמְּרִין בְּנֵי שְׁנָא תְּרֵי עֲשַׂר וּמִנְחַתְהוֹן וּצְפִירֵי בַּר עִזִּין תְּרֵי עֲשַׂר לְחַטָּאתָא:", "onk_en": "The total of the oxen for the burnt-offering is twelve oxen, twelve rams, twelve yearling sheep and their meal-offerings, and twelve he-goats for a sin-offering.", "pj": "כָּל תּוֹרֵי לַעֲלָתָא תְּרֵיסַר תּוֹרֵי לְרַב בֵּית אַבָּא דִיכְרָא דִיכְרִין תְּרֵיסַר מְטוּל דִיהוֹבְדוּן תְּרֵיסַר רַבְרְבֵי יִשְׁמָעֵאל אִמְרִין בְּנֵי שָׁנָה תְּרֵיסַר מְטוּל דִיהוֹבְדוּן תְּרֵיסַר רַבְרְבֵי פָּרַס וּמִנְחַתְהוֹן מְטוּל דְיַעֲדֵי כַפְנָא מִן עַלְמָא וּצְפִירֵי עִזִין תְּרֵיסַר לְחַטָאתָא מְטוּל לְכַפָּרָא עַל חוֹבֵי תְּרֵיסַר שִׁבְטַיָא", "pj_en": "All the bullocks for the burnt offering, twelve, a bullock for a prince of the house of the fathers; twelve rams, because the twelve princes of Ishmael would perish; twelve lambs of the year, because the twelve princes of Persia would perish; and their minchas, that famine might be removed from the world; and twelve kids of the goats for the sin offering, to atone for the sins of the twelve tribes.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 88, "aliyah": 7, "heb": "וְכֹ֞ל בְּקַ֣ר&thinsp;<b>׀<\/b> זֶ֣בַח הַשְּׁלָמִ֗ים עֶשְׂרִ֣ים וְאַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי־שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַמִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽוֹ׃", "onk": "וְכֹל תּוֹרֵי לְנִכְסַת <b>קוּדְשַׁיָּא<\/b> עַשְׂרִין וְאַרְבְּעָא תּוֹרִין דִּכְרִין שִׁתִּין גַּדְיַן שִׁתִּין אִמְּרִין בְּנֵי שְׁנָא שִׁתִּין דָּא חֲנֻכַּת מַדְבְּחָא בָּתַר דְּרַבִּיּוּ יָתֵיהּ:", "onk_en": "The total of the oxen for the peace [<b>sacred<\/b>]-offering sacrifice is twenty-four oxen, sixty rams, sixty kids and sixty yearling sheep. This was the dedication of the altar after it was anointed.", "pj": "וְכָל תּוֹרֵי לְנִכְסַת קוּדְשַׁיָא עֶשְרִין וְאַרְבַּע תוֹרִין כָּל קֳבֵיל עֶשְרִין וְאַרְבַּע מַטַרְתָּא דִכְרֵי שִׁתִּין כָּל קֳבֵיל שִׁתִּין שְׁנִין דַהֲוָה יִצְחָק כַּד יְלִיד יַת יַעֲקב בָּרְחֵי שִׁתִּין כָּל קֳבֵיל שִׁתִּין אַפִּין דְבִרְכַת כַּהֲנַיָא אִמְרִין בְּנֵי שָׁנָה שִׁתִּין לְכַפָּרָא עַל שִׁתִּין רִיבְוָן דְיִשְרָאֵל דָא חֲנֻכַּת רְבוּת מַדְבְּחָא בְּיוֹמָא דְרַבִּיוּ יָתֵיהּ", "pj_en": "And all the oxen for consecrated victims, twenty-four, answering to the twenty-four orders (of the priests); the rams, sixty, answering, to the sixty years which Izhak had lived when he begat Jakob; the goats, sixty, answering to the sixty letters in the benediction of the priests; lambs of the year, sixty, to atone for the sixty myriads of Israel. This was the dedication of the altar by anointment on the day that they anointed it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 89, "aliyah": 7, "heb": "וּבְבֹ֨א מֹשֶׁ֜ה אֶל־אֹ֣הֶל מוֹעֵד֮ לְדַבֵּ֣ר אִתּוֹ֒ וַיִּשְׁמַ֨ע אֶת־הַקּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗יו מֵעַ֤ל הַכַּפֹּ֙רֶת֙ אֲשֶׁר֙ עַל־אֲרֹ֣ן הָעֵדֻ֔ת מִבֵּ֖ין שְׁנֵ֣י הַכְּרֻבִ֑ים וַיְדַבֵּ֖ר אֵלָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְכַד עָלִיל משֶׁה לְמַשְׁכַּן זִמְנָא לְמַלָּלָא עִמֵּיהּ וּשְׁמַע יָת קָלָא דְמִתְמַלֵּל עִמֵּיהּ מֵעִלָּוֵי כַפֻּרְתָּא דִּי עַל אֲרוֹנָא דְסַהֲדוּתָא מִבֵּין תְּרֵין כְּרוּבַיָּא וּמִתְמַלֵּל עִמֵּיהּ:", "onk_en": "When Moshe would enter the Tent of Meeting to speak with Him (God), he would hear the Voice being spoken to him from above the Ark-cover which is atop the Ark of the Testimony from between the two cherubim; and He spoke to him.", "pj": "וְכַד עָלֵיל משֶׁה לְמַשְׁכַּן זִמְנָא לְמַלָלָא עִמֵיהּ וּשְׁמַע יַת קַל רוּחָא דְמִתְמַלֵיל עִמֵיהּ כַּד נָחִית מִן שְׁמֵי שְׁמַיָא עִילַוֵי כַפּוּרְתָּא דְעַל אֲרוֹנָא דְסַהֲדוּתָא מִבֵּין תְּרֵין כְּרוּבַיָא וּמִתַּמָן הֲוָה דִבּוּרָא מִתְמַלֵל עִמֵיהּ", "pj_en": "And when Mosheh entered into the tabernacle of ordinance to speak with Him, he heard the voice of the Spirit who spake with him descending from the heaven of heavens upon the Mercy Seat which was upon the Ark of the Testimony between the two Cherubim, and from thence was the Oracle {Word; Dibbera} speaking with him.", "tj": "", "tj_en": "", "rashi": "<b>ובבא משה.<\/b> שְׁנֵי כְתוּבִים הַמַּכְחִישִׁים זֶה אֶת זֶה, שְׁלִישִׁי בָא וְהִכְרִיעַ בֵּינֵיהֶם, כָּתוּב אֶחָד אוֹמֵר \"וַיְדַבֵּר ה' אֵלָיו מֵאֹהֶל מוֹעֵד\" (ויקרא א') — וְהוּא חוּץ לַפָּרֹכֶת — וְכָתוּב אֶחָד אוֹמֵר \"וְדִבַּרְתִּי אִתְּךָ מֵעַל הַכַּפֹּרֶת\" (שמות כ\"ה), בָּא זֶה וְהִכְרִיעַ בֵּינֵיהֶם: מֹשֶׁה בָא אֶל אֹהֶל מוֹעֵד, וְשָׁם שׁוֹמֵעַ אֶת הַקּוֹל הַבָּא מֵעַל הַכַּפֹּרֶת מִבֵּין שְׁנֵי הַכְּרוּבִים — הַקּוֹל יוֹצֵא מִן הַשָּׁמַיִם לְבֵין שְׁנֵי הַכְּרוּבִים, וּמִשָּׁם יָצָא לְאֹהֶל מוֹעֵד (ספרי):<br><br><b>וישמע את הקול.<\/b> יָכוֹל קוֹל נָמוּךְ, תַּ\"ל \"אֶת הַקּוֹל\", הוּא הַקּוֹל שֶׁנִּדְבַּר עִמּוֹ בְּסִינַי, וּכְשֶׁמַּגִּיעַ לַפֶּתַח הָיָה נִפְסָק וְלֹא הָיָה יוֹצֵא חוּץ לָאֹהֶל:<br><br><b>מדבר.<\/b> כְּמוֹ מִתְדַּבֵּר, כְּבוֹדוֹ שֶׁל מַעְלָה לוֹמַר כֵּן, מְדַּבֵּר בֵּינוֹ לְבֵין עַצְמוֹ, וּמֹשֶׁה שׁוֹמֵעַ מֵאֵלָיו:<br><br><b>וידבר אליו.<\/b> לְמַעֵט אֶת אַהֲרֹן מִן הַדִּבְּרוֹת (עי' ספרי):", "rashi_en": "ובבא משה AND WHEN MOSES CAME [INTO THE TENT OF MEETING … THEN HE HEARD THE VOICE SPEAKING UNTO HIM FROM OFF THE COVERING THAT WAS UPON THE ARK OF THE TESTIMONY] — When two Scriptural verses apparently contradict each other there comes a third and reconciles them. We have got such a case here: one verse says, (Leviticus 1:1) “[And the Lord called unto Moses] and spoke unto him out of the appointed tent”, which was outside the Vail, and another verse says, (Exodus 25:22). “And I shall speak unto thee from off the Ark-lid”, thus within the Vail — then this (our verse) comes and reconciles  them: Moses entered the appointed tent, and there he heard the Voice which came from above the Ark-lid, from between the two Cherubim — the Voice issued from Heaven unto the space between the two Cherubim, and from there it issued into the appointed tent where it was heard by Moses. (Sifrei Bamidbar 58 1; cf. Rashi on Exodus 25:22.) <br><br>וישמע את הקול AND HE HEARD THE VOICE — One might think it was a very low voice! Scripture, however, states “the Voice” (with the definite article — the well-known Voice) — it was that thunderous Voice with which He spoke to him on Sinai, and yet when it reached the door of the appointed tent it broke off and did not issue beyond the appointed tent (and therefore it states Leviticus 1:1 מאהל מועד from the appointed tent, and not באהל מועד, because the Voice confined itself to the Interior of the אהל מועד; see Rashi on Leviticus 1:1) (cf. Sifrei Bamidbar 58:2).<br><br>מדבר is the same as מתדבר (it is the Hitphael form with assimiliated ת) — “He heard the Voice uttering itself”. It is out of reverence for the Most High God that Scripture speaks thus: “The Voice was speaking to itself”, and Moses would listen in (i. e., he could not help hearing it). <br><br>וידבר אליו AND HE SPOKE UNTO HIM — unto him: thus excluding Aaron from the Divine communications (cf. Rashi on Leviticus 1:1, s. v. אליו)."}];

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

    const b = document.createElement('button');

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {

  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
