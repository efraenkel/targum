n": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 2, "aliyah": 5, "heb": "וּבָ֧אוּ עָלֶ֛יךָ כׇּל־הַבְּרָכ֥וֹת הָאֵ֖לֶּה וְהִשִּׂיגֻ֑ךָ כִּ֣י תִשְׁמַ֔ע בְּק֖וֹל יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וְיֵיתוּן עֲלָךְ כָּל בִּרְכְּתָא הָאִלֵּין <b>וְיִדְבְּקֻנָּךְ<\/b> אֲרֵי <b>תְקַבַּל לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ:", "onk_en": "All these blessings will come upon you and will reach [<b>adhere to<\/b>] you, when you obey [<b>accept the word of<\/b>] Adonoy, your God.", "pj": "וְיֵיתוּן עֲלֵיכוֹן כָּל בִּרְכָתָא הָאִלֵין וְיִדְבּוּקַנְכוֹן אֲרוּם תְּקַבְּלוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן", "pj_en": "and all these blessings shall come upon you, and abide with you, for that you will have hearkened to the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 3, "aliyah": 5, "heb": "בָּר֥וּךְ אַתָּ֖ה בָּעִ֑יר וּבָר֥וּךְ אַתָּ֖ה בַּשָּׂדֶֽה׃", "onk": "בְּרִיךְ אַתְּ בְּקַרְתָּא וּבְרִיךְ אַתְּ בְּחַקְלָא:", "onk_en": "Blessed are you in the city, and blessed are you in the field.", "pj": "בְּרִיכִין אַתּוּן בְּקַרְתָּא וּבְרִיכִין אַתּוּן בְּחַקְלָא", "pj_en": "Blessed shall you be in the city, and blessed in the field.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 4, "aliyah": 5, "heb": "בָּר֧וּךְ פְּרִֽי־בִטְנְךָ֛ וּפְרִ֥י אַדְמָתְךָ֖ וּפְרִ֣י בְהֶמְתֶּ֑ךָ שְׁגַ֥ר אֲלָפֶ֖יךָ וְעַשְׁתְּר֥וֹת צֹאנֶֽךָ׃", "onk": "בְּרִיךְ <b>וַלְדָּא דִמְעָךְ וְאִבָּא דְאַרְעָךְ וּוַלְדָּא<\/b> דִבְעִירָךְ בַּקְרֵי תוֹרָיךְ וְעֶדְרֵי עָנָךְ:", "onk_en": "Blessed is the fruit [<b>offspring<\/b>] of your belly, and the produce [<b>fruit<\/b>] of your soil, and the offspring of your animals, the issue of your cattle and the flocks of your sheep and goats.", "pj": "בְּרִיכִין וַלְדֵי מֵעֵיכוֹן וּפֵירֵי אַרְעֲכוֹן בַּקְרֵי תוֹרֵיכוֹן וְעֶדְרֵי עָנֵיכוֹן", "pj_en": "Blessed shall be the offspring of your womb, the fruits of your ground, the oxen of your herd, and the flocks of your sheep.", "tj": "", "tj_en": "", "rashi": "<b>שגר אלפיך.<\/b> וַלְדוֹת בְּקָרְךָ, שֶׁהַבְּהֵמָה מְשַׁגֶּרֶת מִמֵּעֶיהָ:<br><br><b>ועשתרות צאנך.<\/b> כְּתַרְגּוּמוֹ. וְרַבּוֹתֵינוּ אָמְרוּ לָמָּה נִקְרָא שְׁמָם עַשְׁתָּרוֹת? שֶׁמַּעֲשִׁירוֹת אֶת בַּעֲלֵיהֶן וּמַחֲזִיקוֹת אוֹתָם כְּעַשְׁתָּרוֹת הַלָּלוּ שֶׁהֵן סְלָעִים חֲזָקִים:", "rashi_en": "שגר אלפיך means the young of thy cattle which the animal casts out (שגר) of its womb.<br><br>ועשתרות צאנך — Understand this as the Targum does: the flocks of thy herd. Our Rabbis asked, “Why are they (the flocks of sheep) called עשתרות? Because, replied they, they enrich (מעשירות) their owners (through the sale of their wool, etc.) and make them strong as עשתרות — which are strong rocks (Chullin 84b; cf. Rashi on Deuteronomy 7:13)."}, {"ch": 28, "v": 5, "aliyah": 5, "heb": "בָּר֥וּךְ טַנְאֲךָ֖ וּמִשְׁאַרְתֶּֽךָ׃", "onk": "בְּרִיךְ סַלָּךְ וְאַצְוָתָךְ:", "onk_en": "Blessed will be your [fruit] basket and your solid foods.", "pj": "בְּרִיךְ סַלֵי בִּיכּוּרֵיכוֹן וְחַלַת שֵׁירוֹי אַצְוַותְכוֹן", "pj_en": "Blessed shall be the basket of your first fruits, and the first cakes of your flour.", "tj": "בְּרִיכִין תְהֶוְיָן בְּסַלֵי בִּיכּוּרֵיכוֹן וּבְאַצְוַותְכוֹן:", "tj_en": "Blessed shall you be in the baskets of your first fruits, and in your wheaten cakes.", "rashi": "<b>ברוך טנאך.<\/b> פֵּרוֹתֶיךָ; דָּ\"אַ — טַנְאֲךָ דָּבָר לַח שֶׁאַתָּה מְסַנֵּן בְּסַלִּים:<br><br><b>ומשארתך.<\/b> דָּבָר יָבֵשׁ שֶׁנִּשְׁאַר בַּכְּלִי וְאֵינוֹ זָב:", "rashi_en": "ברוך טנאך BLESSED SHALL BE THY BASKET — i.e. thy fruits (which are kept in baskets). — Another explanation of טנאך is that it means liquids which you filter through baskets (wicker work).<br><br>ומשארתך accordingly means dry produce that remains (נשאר) in the vessel and does not flow out."}, {"ch": 28, "v": 6, "aliyah": 5, "heb": "בָּר֥וּךְ אַתָּ֖ה בְּבֹאֶ֑ךָ וּבָר֥וּךְ אַתָּ֖ה בְּצֵאתֶֽךָ׃", "onk": "בְּרִיךְ אַתְּ בְּמֵעֲלָךְ וּבְרִיךְ אַתְּ בְּמִפְּקָךְ:", "onk_en": "You will be blessed at your arrival, and blessed at your departure.", "pj": "בְּרִיכִין אַתּוּן בְּמֵיעֲלְכוֹן לְבָתֵּי מֶדְרָשֵׁיכוֹן וּבְרִיכִין אַתּוּן בְּמִפַּקְכוֹן לִפְרַקְמַטְיֵיכוֹן", "pj_en": "Blessed shall you be in your coming in to your houses of instruction, and blessed shall you be when you go out to your affairs.", "tj": "בְּרִיכִין תֶּהֱווּן בְּמֵיעַלְכוֹן בְּבֵית מֶדְרָשֵׁיכוֹן וּבְרִיכִין תֶּהֱווּן בְּמִיפַקְכוֹן מִן בָּתֵי מֶדְרָשֵׁיכוֹן:", "tj_en": "Blessed shall you be when you go in to your houses of instruction, and blessed when you go out of them.", "rashi": "<b>ברוך אתה בבאך וברוך אתה בצאתך.<\/b> שֶׁתְּהֵי יְצִיאָתְךָ מִן הָעוֹלָם בְּלֹא חֵטְא כְּבִיאָתְךָ לָעוֹלָם (ב\"מ ק\"ז):", "rashi_en": "ברוך אתה בבאך וברוך אתה בצאתך BLESSED SHALT THOU BE WHEN THOU COMEST IN, AND BLESSED SHALT THOU BE WHEN THOU GOEST OUT — This means: may thy departure from this world be as sinless as was thy coming into the world (Bava Metzia 107a)."}, {"ch": 28, "v": 7, "aliyah": 6, "heb": "יִתֵּ֨ן יְהֹוָ֤ה אֶת־אֹיְבֶ֙יךָ֙ הַקָּמִ֣ים עָלֶ֔יךָ נִגָּפִ֖ים לְפָנֶ֑יךָ בְּדֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔יךָ וּבְשִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְפָנֶֽיךָ׃", "onk": "יִתֵּן יְיָ יָת בַּעֲלֵי דְבָבָךְ דְּקָיְמִין עֲלָךְ <b>תְּבִירִין<\/b> קֳדָמָךְ בְּאָרְחָא חַד יִפְּקוּן לְוָתָךְ וּבְשִׁבְעָא אָרְחָן יֵעִרְקוּן מִקֳּדָמָךְ:", "onk_en": "Adonoy will set your enemies who rise against you smitten [<b>broken<\/b>] before you; by one road will they approach you, but by seven roads they will flee from you.", "pj": "יְשַׁוֵי מֵימְרָא דַיְיָ יַת בַּעֲלֵי דְבָבֵיכוֹן דְקַיְימִין לְקוּבְלֵיכוֹן לִמְבָאֲשָׁא תְּבִירִין קֳדָמֵיכוֹן בְּאוֹרְחָא חַד יְהוֹן נַפְקִין לְוַותְכוֹן לְסִדְרֵי קְרָבָא וּבְשִׁבְעָא אָרְחִין טַעֲיַין יֶהֱווּן עַרְקִין מִן קֳדָמֵיכוֹן", "pj_en": "The Word of the Lord will cause your enemies who rise up against you to hurt you, to be broken before you. By one way they will come out to fight against you, but seven ways they shall be dispersed, I fleeing before you.", "tj": "", "tj_en": "", "rashi": "<b>ובשבעה דרכים ינוסו לפניך.<\/b> כֵּן דֶּרֶךְ הַנִּבְהָלִים לִבְרֹחַ, מִתְפַּזְּרִין לְכָל צַד:", "rashi_en": "ובשבעה דרכים ינוסו לפניך AND THEY SHALL RUN AWAY BEFORE THEE SEVEN WAYS — Such is the manner of all who flee out of fear: they scatter in every direction."}, {"ch": 28, "v": 8, "aliyah": 6, "heb": "יְצַ֨ו יְהֹוָ֤ה אִתְּךָ֙ אֶת־הַבְּרָכָ֔ה בַּאֲסָמֶ֕יךָ וּבְכֹ֖ל מִשְׁלַ֣ח יָדֶ֑ךָ וּבֵ֣רַכְךָ֔ בָּאָ֕רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֥ן לָֽךְ׃", "onk": "יְפַקֵּד יְיָ עִמָּךְ יָת בִּרְכְּתָא בְּאוֹצָרָךְ וּבְכֹל אוֹשָׁטוּת יְדָךְ וִיבָרֵכִנָּךְ בְּאַרְעָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ:", "onk_en": "Adonoy will order upon you the blessing in your storehouses and in all your commerce; and He will bless you in the land that Adonoy, your God, is giving you.", "pj": "יְפַקֵיד יְיָ עִמְכוֹן יַת בִּרְכָתָא בְּאוֹצְרֵיכוֹן וּבְכָל אוֹשָׁטוּת יְדֵיכוֹן וִיבָרְכֵיכוֹן בְּאַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן", "pj_en": "The Lord will command the blessing upon you in your treasuries, and on all that you put your hands unto, and will bless you in the land which the Lord your God giveth you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 9, "aliyah": 6, "heb": "יְקִֽימְךָ֨ יְהֹוָ֥ה לוֹ֙ לְעַ֣ם קָד֔וֹשׁ כַּאֲשֶׁ֖ר נִֽשְׁבַּֽע־לָ֑ךְ כִּ֣י תִשְׁמֹ֗ר אֶת־מִצְוֺת֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ וְהָלַכְתָּ֖ בִּדְרָכָֽיו׃", "onk": "יְקִימִנָּךְ יְיָ לֵיהּ לְעַם קַדִּישׁ כְּמָא דִי קַיִּים לָךְ אֲרֵי תִטַּר יָת פִּקּוּדַיָּא דַּיְיָ אֱלָהָךְ וּתְהַךְ <b>בְּאָרְחָן דְּתָקְנָן קֳדָמוֹהִי<\/b>:", "onk_en": "Adonoy will establish you for Himself as a holy people as He swore to you; when you will guard the commandments of Adonoy, your God, and will go in His ways [<b>that are correct before Him<\/b>].", "pj": "יְקוּם יַתְכוֹן מֵימְרָא דַיְיָ קֳדָמוֹי לְעַם קַדִישׁ הֵיכְמָא דְמַלֵיל לְכוֹן אֲרוּם תִּנְטְרוּן יַת פִּיקוּדַיָא דַיְיָ אֱלָהָכוֹן וְתַהֲכוּן בְּאָרְחָן דְתַקְנָן קֳדָמוֹי", "pj_en": "The Word of the Lord will establish you to be a holy people before Him, as He hath said unto you, when you keep the commandments of the Lord your God, and walk in the ways that are right before Him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 10, "aliyah": 6, "heb": "וְרָאוּ֙ כׇּל־עַמֵּ֣י הָאָ֔רֶץ כִּ֛י שֵׁ֥ם יְהֹוָ֖ה נִקְרָ֣א עָלֶ֑יךָ וְיָֽרְא֖וּ מִמֶּֽךָּ׃", "onk": "וְיֶחֱזוּן כָּל עַמְמֵי אַרְעָא אֲרֵי שְׁמָא דַיְיָ אִתְקְרֵי עֲלָךְ וְיִדְחֲלוּן מִנָּךְ:", "onk_en": "And all the peoples of the earth will see that you are called by Adonoy’s Name and they will fear you.", "pj": "וְיֶחֱמוּן כָּל עַמְמֵי אַרְעָא אֲרוּם שְׁמָא דַיְיָ חָקִיק בִּזְמַן דִתְּפִילִין עֲלָךְ וִידַחֲלוּן מִנָךְ", "pj_en": "And all the nations of the earth will see that the Name is written by (His own) appointment on the tephillin that are upon thee, and will be afraid of thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 11, "aliyah": 6, "heb": "וְהוֹתִרְךָ֤ יְהֹוָה֙ לְטוֹבָ֔ה בִּפְרִ֧י בִטְנְךָ֛ וּבִפְרִ֥י בְהֶמְתְּךָ֖ וּבִפְרִ֣י אַדְמָתֶ֑ךָ עַ֚ל הָאֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהֹוָ֛ה לַאֲבֹתֶ֖יךָ לָ֥תֶת לָֽךְ׃", "onk": "וְיוֹתְרִנָּךְ יְיָ לְטָבָא <b>בְּוַלְדָּא<\/b> דִמְעָךְ <b>וּבְוַלְדָּא<\/b> דִבְעִירָךְ <b>וּבְאִבָּא<\/b> דְאַרְעָךְ עַל אַרְעָא דִּי קַיִּים יְיָ לַאֲבָהָתָךְ לְמִתַּן לָךְ:", "onk_en": "Adonoy will give you surplus as benefit in the fruit [<b>offspring<\/b>] of your belly, and the offspring of your animals, and the produce [<b>fruit<\/b>] of your soil; upon the land that Adonoy swore to your forefathers to give you.", "pj": "וִישַׁיְירִנְכוֹן מֵימְרָא דַיְיָ לְטָבָא בְּוַולְדָא דִמְעֵיכוֹן וּבְוַולְדָא דִבְעִירֵיכוֹן וּבְאִבָּא דְאַרְעֲכוֹן עַל אַרְעָא דְקַיֵים יְיָ לְאַבְהַתְכוֹן", "pj_en": "And the Word of the Lord will make thee to abound in good, in the offspring of thy womb, and the increase of thy cattle, and in the fruit of thy ground, in the land which the Lord hath promised to thy fathers.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 12, "aliyah": 6, "heb": "יִפְתַּ֣ח יְהֹוָ֣ה&thinsp;<small>׀<\/small>&thinsp;לְ֠ךָ֠ אֶת־אוֹצָר֨וֹ הַטּ֜וֹב אֶת־הַשָּׁמַ֗יִם לָתֵ֤ת מְטַֽר־אַרְצְךָ֙ בְּעִתּ֔וֹ וּלְבָרֵ֕ךְ אֵ֖ת כׇּל־מַעֲשֵׂ֣ה יָדֶ֑ךָ וְהִלְוִ֙יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְאַתָּ֖ה לֹ֥א תִלְוֶֽה׃", "onk": "יִפְתַּח יְיָ לָךְ יָת אוֹצָרֵיהּ טָבָא יָת שְׁמַיָּא לְמִתַּן מְטַר אַרְעָךְ בְּעִדָּנֵיהּ וּלְבָרָכָא יָת כָּל עוֹבָדֵי יְדָךְ <b>וְתוֹזֵף<\/b> לְעַמְמִין סַגִּיאִין וְאַתְּ לָא <b>תְזוּף<\/b>:", "onk_en": "Adonoy will open for you His good storehouse, the sky, to give you your land’s rain on time and to bless all your endeavors; and you will lend to many nations, but you will not borrow.", "pj": "אַרְבְּעָא מַפְתְּחִין בִּידֵי דְמָארֵי עַלְמָא דְלָא מְסָרִינוּן בִּידָא דְטַפְסְרָא מַפְתְּחָא דְחַיְיתָא וּדְקִבְרַיָא וְדִמְזוֹנֵי וּדְמִטְרָא וְכֵן אָמַר משֶׁה נְבִיָא הָכָא יִפְתַּח יְיָ לְכוֹן יַת אוֹצָרֵיהּ טַב דְעִמֵיהּ בִּשְׁמַיָא לְמִתַּן מְטַר אַרְעֲכוֹן בְּזִמְנֵיהּ בַּכִּיר בְּמַרְחֶשְׁוָן וְלָקִישׁ בְּנִיסָן וּלְבָרְכָא יַת כָּל עוֹבָדֵי יְדֵיכוֹן וְתוֹזְפוּן לְעַמְמִין סַגִיאִין וְאַתּוּן לָא תִצְטַרְכוּן לְמֵיזִיף", "pj_en": "Four keys are in the hand of the Lord of all the world, which He hath not delivered into the hands of any secondary power: the key of life, and of the tombs, and of food, and of rain; and thus did Mosheh the prophet speak: The Lord will open to you His good treasure which is with Him in the heavens, and will give you the rain of your land in its season; the early in Marchesvan, and the latter in Nisan; and will bless you in all the works of your hands; and you will lend to many peoples, but shall have no need to borrow.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 13, "aliyah": 6, "heb": "וּנְתָֽנְךָ֨ יְהֹוָ֤ה לְרֹאשׁ֙ וְלֹ֣א לְזָנָ֔ב וְהָיִ֙יתָ֙ רַ֣ק לְמַ֔עְלָה וְלֹ֥א תִהְיֶ֖ה לְמָ֑טָּה כִּֽי־תִשְׁמַ֞ע אֶל־מִצְוֺ֣ת&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּךָ֛ הַיּ֖וֹם לִשְׁמֹ֥ר וְלַעֲשֽׂוֹת׃", "onk": "וְיִתְּנִנָּךְ יְיָ <b>לְתַקִּיף<\/b> וְלָא <b>לְחַלָּשׁ<\/b> וּתְהֵי בְּרַם לְעֵלָּא וְלָא תְהֵי לְתַחְתָּא אֲרֵי תְקַבַּל לְפִקּוּדַיָּא דַּיְיָ אֱלָהָךְ דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין לְמִטַּר וּלְמֶעְבָּד:", "onk_en": "Adonoy will place you at the head [<b>to be powerful<\/b>], not at the tail [<b>to be weak<\/b>]; and you will be solely on top, you will not be on the bottom; when you heed the commandments of Adonoy, your God, that I am commanding you today to guard and to perform.", "pj": "וְיִמְנֵי מֵימְרָא דַיְיָ יַתְכוֹן לְמַלְכִין וְלָא לְהֶדְיוֹטִין וְתֶהֱווּן לְחוֹד מְנַטְלִין וְלָא תְהוֹן לְמָאִיסִין אֲרוּם תְּקַבְּלוּן לְפִקוּדַיָא דַיְיָ אֱלָהָכוֹן דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא לְמִנְטוֹר וּלְמֶעֱבַד", "pj_en": "And the Word of the Lord will appoint you to be kings and not subjects, and to be ennobled and not abased, when you have hearkened to the commandments of the Lord your God which I command you this day to keep and perform.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 14, "aliyah": 6, "heb": "וְלֹ֣א תָס֗וּר מִכׇּל־הַדְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְכֶ֛ם הַיּ֖וֹם יָמִ֣ין וּשְׂמֹ֑אול לָלֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְעׇבְדָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלָא תִסְטוּן מִכָּל פִּתְגָּמַיָּא דִּי אֲנָא מְפַקֵּד יָתְכוֹן יוֹמָא דֵין יַמִּינָא וּשְׂמָאלָא לִמְהַךְ בָּתַר <b>טַעֲוַת עַמְמַיָּא<\/b> לְמִפְלְחִנּוּן:", "onk_en": "And you do not deviate from all the statements that I am commanding you today to the right or to the left, to follow other gods [<b>idols of the nations<\/b>] to serve them.", "pj": "וְלָא תִסְטוּן מִן כָּל פִּתְגָמַיָא דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא לְיַמִינָא וְלִשְמָאלָא לִמְהַךְ בָּתַר טַעֲוַות עַמְמַיָא לְמִפְלַחְהוֹן", "pj_en": "Decline not from any of these words that I teach you today either to the right or the left, in walking after the idols of the Gentiles to serve them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 15, "aliyah": 6, "heb": "וְהָיָ֗ה אִם־לֹ֤א תִשְׁמַע֙ בְּקוֹל֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לִשְׁמֹ֤ר לַעֲשׂוֹת֙ אֶת־כׇּל־מִצְוֺתָ֣יו וְחֻקֹּתָ֔יו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּ֑וֹם וּבָ֧אוּ עָלֶ֛יךָ כׇּל־הַקְּלָל֥וֹת הָאֵ֖לֶּה וְהִשִּׂיגֽוּךָ׃", "onk": "וִיהֵי אִם לָא <b>תְקַבַּל בְּמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ לְמִטַּר לְמֶעְבַּד יָת כָּל פִּקּוּדוֹהִי וּקְיָמוֹהִי דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין וְיֵיתוּן עֲלָךְ כָּל לְוָטַיָּא הָאִלֵּין <b>וְיִדְבְּקֻנָּךְ<\/b>:", "onk_en": "Should you not obey [<b>accept the word of<\/b>] Adonoy, your God, to guard to perform all His commandments and His statutes that I am commanding you today; then all these curses will come upon you and will reach [<b>cleave to<\/b>] you.", "pj": "כַּד פָּתַח משֶׁה נְבִיָא לְמֵימָר פִּתְגָמֵי אוֹכְחוּתָא הָאִלֵין אִתְרְגִישַׁת אַרְעָא וּשְׁמַיָא זָעוּ שִׁמְשָׁא וְסִיהֲרָא קָדְרוֹן וְכוֹכְבַיָא כְנָשׁוּ זִיוְוהוֹן אַבְהַת עַלְמָא צְוָוחִין מִבֵּית קְבוּרְתְּהֶן וְכָל בִּרְיָיתָא שָׁתְקִין וְאִלָנַיָיא לָא טִלְטֵל זָאזֵיהוֹן עַנְיַין אַבְהַת עַלְמָא וְאָמְרִין חֲבוֹל עַל בְּנֵינָן כַּד יְחוֹבִין וְיִמְטוּן עֲלֵיהוֹן לְוָוטַיָא אִלֵין הֵיךְ יָכְלִין לְסוֹבָרוּתְהוֹן וְדִלְמָא יֶעֱבַד בְּהוֹן שֵׁצְיוּ וְלָא תְהֵי זְכוּתִין מְגַנָא עֲלֵיהוֹן וְלָא יֶהֱוֵי גַבְרָא דִיקוּם וִיצַלֵי אַמָטוּלְתְּהוֹן בְּרַת קָלָא נָפְלַת מִן שְׁמֵי מְרוֹמָא וְכֵן אֲמָרַת לָא תִדְחֲלוּן אַבְהַת עַלְמָא דַאֲפִילוּ פָּסְקָא זְכוּתְהוֹן דְכָל דָרַיָא זְכוּתְכוֹן לָא יִפְסוֹק וּקְיָימָא דְקַיֵימִית עִמְכוֹן לָא מְבַטְלָא וּתְהֵי מְגַנָא עֲלֵיהוֹן עָנֵי משֶׁה נְבִיָא וַאֲמַר אַף עַל גַב דַאֲנָא מוֹכַח יַתְכוֹן עַל תְּנָאָה מִתְוַוכְּחִין לְמֵימָר דְאִין לָא תְקַבְּלוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן דְלָא לְמִטוּר לְמֶעֱבַד יַת כָּל פִּקוּדֵי וּקְיָמֵי דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָא דֵין וְיֵיתוּן עִילַוֵיכוֹן כֻּלְהוֹן לְוָטַיָא הָאִלֵין וְיִדְבְּקוּנְכוֹן", "pj_en": "When Mosheh the prophet began to pronounce the words of threatening the earth trembled, the heavens were moved, the sun and moon were darkened, the stars withdrew their beams, the fathers of the world cried from their sepulchres, while all creatures were silent, the very trees waved not their branches. The fathers of the world answered and said, Woe to our children should they sin, and bring these maledictions upon them; for how will they bear them? lest destruction be executed on them, and no merit of ours protect, and there be no man to stand and intercede on their behalf! Then fell the Bath-kol from the high heavens, and said, Fear not, ye fathers of the world; if the merit of all generations should fail, yours shall not; and the covenant which I have confirmed with you shall not be annulled, but will (still) overshadow them. Mosheh the prophet answered and said, Whomsoever I threaten I threaten conditionally, saying, If you hearken not to the Word of the Lord your God in neither observing nor doing all my commandments and statutes which I command you this day, then shall all these maledictions come upon and cleave unto you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 16, "aliyah": 6, "heb": "אָר֥וּר אַתָּ֖ה בָּעִ֑יר וְאָר֥וּר אַתָּ֖ה בַּשָּׂדֶֽה׃", "onk": "לִיט אַתְּ בְּקַרְתָּא וְלִיט אַתְּ בְּחַקְלָא:", "onk_en": "Cursed are you in the city and cursed are you in the field.", "pj": "לִיטִין אַתּוּן בְּקַרְתָּא וְלִיטִין אַתּוּן בְּחַקְלָא", "pj_en": "Accursed shall you be in the city and in the field.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 17, "aliyah": 6, "heb": "אָר֥וּר טַנְאֲךָ֖ וּמִשְׁאַרְתֶּֽךָ׃", "onk": "לִיט סַלָּךְ וְאַצְוָתָךְ:", "onk_en": "Cursed is your [fruit] basket and cursed are your solid foods.", "pj": "לִיטִין סַלֵי בִּכּוּרֵיכוֹן וְחַלַת שֵׁירוֹי אַצְוַותְכוֹן", "pj_en": "Accursed shall be the basket of your first fruits, and the first cakes of your flour.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 18, "aliyah": 6, "heb": "אָר֥וּר פְּרִֽי־בִטְנְךָ֖ וּפְרִ֣י אַדְמָתֶ֑ךָ שְׁגַ֥ר אֲלָפֶ֖יךָ וְעַשְׁתְּרֹ֥ת צֹאנֶֽךָ׃", "onk": "לִיט <b>וַלְדָּא<\/b> דִמְעָךְ <b>וְאִבָּא<\/b> דְאַרְעָךְ בַּקְרֵי תוֹרָיךְ וְעֶדְרֵי עָנָךְ:", "onk_en": "Cursed is the fruit [<b>offspring<\/b>] of your belly and the produce [<b>fruit<\/b>] of your soil, the calves of your cattle and the flocks of your sheep and goats.", "pj": "לִיטִין וַולְדֵי מֵעֵיכוֹן וּפֵירֵי אַרְעֲכוֹן בַּקְרֵי תּוֹרֵיכוֹן וְעֶדְרֵי עָנֵיכוֹן", "pj_en": "Accursed the children of your wombs, the fruits of your ground, the oxen of your herds, and the sheep of your flocks.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 19, "aliyah": 6, "heb": "אָר֥וּר אַתָּ֖ה בְּבֹאֶ֑ךָ וְאָר֥וּר אַתָּ֖ה בְּצֵאתֶֽךָ׃", "onk": "לִיט אַתְּ בְּמֵעֲלָךְ וְלִיט אַתְּ בְּמִפְּקָךְ:", "onk_en": "Cursed are you upon your arrival and cursed are you upon your departure.", "pj": "לִיטִין אַתּוּן בְּמַעַלְכוֹן לְבָתֵּי קִיאַטְרוֹנֵיכוֹן וְקוֹרְקִיסַתְכוֹן לְמִבַטְלָא פִּתְגָמֵי אוֹרַיְיתָא וְלִיטִין אַתּוּן בְּמִיפַּקְכוֹן לִפְרַגְמַטְיֵיכוֹן", "pj_en": "Accursed shall you be in your going into the houses of your theatres, and the places of your public shows, to make void the words of the law; and accursed shall you be in your coming out to your worldly affairs.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 20, "aliyah": 6, "heb": "יְשַׁלַּ֣ח יְהֹוָ֣ה&thinsp;<small>׀<\/small>&thinsp;בְּ֠ךָ֠ אֶת־הַמְּאֵרָ֤ה אֶת־הַמְּהוּמָה֙ וְאֶת־הַמִּגְעֶ֔רֶת בְּכׇל־מִשְׁלַ֥ח יָדְךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּׁמֶדְךָ֤ וְעַד־אֲבׇדְךָ֙ מַהֵ֔ר מִפְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖יךָ אֲשֶׁ֥ר עֲזַבְתָּֽנִי׃", "onk": "יְגָרֵי יְיָ בָּךְ יָת מְאֶרְתָּא וְיָת שִׁגּוּשַׁיָּא וְיָת מְזוֹפִיתָא בְּכָל אוֹשָׁטוּת יְדָךְ דִּי תַעְבֵּד עַד דְּתִשְׁתֵּצֵי וְעַד דְּתֵיבַד בִּפְרִיעַ מִן קֳדָם בִּישׁוּת עוֹבָדָיךְ דִּשְׁבַקְתָּא <b>דַחַלְתִּי<\/b>:", "onk_en": "Adonoy will visit upon you ruin, panic, and frustration in all the endeavors you undertake, until you are destroyed and until you are swiftly removed because of the wickedness of your deeds [in] that you forsook [<b>the fear of<\/b>] Me.", "pj": "יְגָרֵי מֵימְרָא דַיְיָ בְּכוֹן יַת לְוָוטְתָא לְלַטָטָא מָמוֹנְכוֹן וְיַת עַרְבּוּבָא לְעַרְבָּבָא שְׁלַמְכוֹן וְיַת מְזוֹפִיתָא בְּכָל אוֹשָׁטוּת יֶדְכוֹן דְתַעַבְדוּן עַד דְתִשְׁתֵּיצוּן וְעַד דְתוֹבְדוּן בְּסַרְהוּבַיָא מִן קֳדָם בִּישׁוּת עוֹבָדֵיכוֹן דִשְׁבַקְתּוּן דַחַלְתִּי", "pj_en": "The Word of the Lord will send forth curses among you to curse your wealth, and confusion to confound your prosperity, and vexation with all that you put your hands to do, until He hath undone you, and you perish soon on account of the wickedness of your doings when you have forsaken My worship.", "tj": "", "tj_en": "", "rashi": "<b>המארה.<\/b> חִסָּרוֹן, כְּמוֹ \"צָרַעַת מַמְאֶרֶת\" (ויקרא י\"ג):<br><br><b>המהומה.<\/b> שִׁגּוּשׁ, קוֹל בֶּהָלוֹת:", "rashi_en": "המארה means PAUCITY, similar to (Leviticus 13:51) “a fretting leprosy (ממארה)” (a leprosy that frets the flesh, thus attenuating it).<br><br>המהומה — Onkelos renders this by שגוש which means: A TERRIFYING SOUND."}, {"ch": 28, "v": 21, "aliyah": 6, "heb": "יַדְבֵּ֧ק יְהֹוָ֛ה בְּךָ֖ אֶת־הַדָּ֑בֶר עַ֚ד כַּלֹּת֣וֹ אֹֽתְךָ֔ מֵעַל֙ הָאֲדָמָ֔ה אֲשֶׁר־אַתָּ֥ה בָא־שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "יַדְבֵּק יְיָ בָּךְ יָת מוֹתָא עַד דִּישֵׁיצֵי יָתָךְ מֵעַל אַרְעָא דִּי אַתְּ עָלֵל לְתַמָּן לְמֵירְתַהּ:", "onk_en": "Adonoy will attach the plague to you until He exterminates you from upon the land that you are coming there to inherit.", "pj": "יְאַדֵיק מֵימְרָא דַיְיָ בְּכוֹן יַת מוֹתָא דִישֵׁיצֵי יַתְכוֹן מֵעִילַוֵי אַרְעָא דְאַתּוּן עַלְלִין תַּמָן לְמֵירְתָהּ", "pj_en": "The Word of the Lord will make the pestilence to cleave to you, to consume you from off the land which you are going to inherit.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 22, "aliyah": 6, "heb": "יַכְּכָ֣ה יְ֠הֹוָ֠ה בַּשַּׁחֶ֨פֶת וּבַקַּדַּ֜חַת וּבַדַּלֶּ֗קֶת וּבַֽחַרְחֻר֙ וּבַחֶ֔רֶב וּבַשִּׁדָּפ֖וֹן וּבַיֵּרָק֑וֹן וּרְדָפ֖וּךָ עַ֥ד אׇבְדֶֽךָ׃", "onk": "יִמְחִנָּךְ יְיָ בְּשַׁחֶפְתָּא וּבְקַדַּחְתָּא וּבִדְלֶקְתָּא וּבְחַרְחוּרָא וּבְחַרְבָּא וּבְשִׁדְּפוֹנָא וּבְיַרְקוֹנָא וְיִרְדְּפֻנָּךְ עַד דְּתֵיבָד:", "onk_en": "Adonoy will smite you with blistering and with searing temperature, and with raging fever, and with <i>charchur,<\/i> and with the sword, and with wind-blight, and with yellowing; and they will chase you until your annihilation.", "pj": "יִמְחֵי יַתְכוֹן מֵימְרָא דַיְיָ בְּשַׁחְפוּתָא וּבְקַדְחוּתָא וּבְאֵישָׁא דְגַרְמַיָא דְדַלְקָא מוֹחַיָא וּבְחַרְחוּרֵי דְלוּחֵי צִירְתָא דְלִבָּא וּבִשְׁלוּפֵי חַרְבָּא וּבְשִׁדָפוֹנָא וּבְיַרְקוֹנָא דְמַקְדוֹנַיָא וְיִרְדְפוּנְכוֹן עַל שִׁוְויֵיכוֹן עַד דְתֵיבְדוּן", "pj_en": "The Word of the Lord will smite you with abscess and inflammation, and fire in the bones that will burn up the marrow, and with fearful imaginations in the thoughts of the heart; and with the naked sword, and with blasting, and the jaundice of Macedonia, which shall follow you to your beds, until you are destroyed.", "tj": "", "tj_en": "", "rashi": "<b>בשחפת.<\/b> שֶׁבְּשָׂרוֹ נִשְׁחָף וְנָפוּחַ:<br><br><b>ובקדחת.<\/b> לְשׁוֹן \"כִּי אֵשׁ קָדְחָה בְאַפִּי\" (דברים ל\"ב), וְהוּא אֵשׁ שֶׁל חוֹלִים, מלו\"וי בְּלַעַז, שֶׁהִיא חַמָּה מְאֹד:<br><br><b>ובדלקת.<\/b> חַמָּה יוֹתֵר מִקַּדַּחַת, וּמִינֵי חֳלָאִים הֵם:<br><br><b>ובחרחר.<\/b> חֹלִי הַמְחַמְמוֹ תּוֹךְ הַגּוּף וְצָמֵא תָּמִיד לַמַּיִם, וּבְלַעַז אישטרד\"ימנט, לְשׁוֹן \"וְעַצְמִי חָרָה מִנִּי חֹרֶב\" (איוב ל') \"נָחַר מַפֻּחַ מֵאֵשׁ\" (ירמיהו ו'):<br><br><b>ובחרב.<\/b> יָבִיא עָלֶיךְ גְּיָסוֹת:<br><br><b>ובשדפון ובירקון.<\/b> מַכַּת תְּבוּאָה שֶׁבַּשָּׂדוֹת:<br><br><b>שדפון.<\/b> רוּחַ קָדִים, אשלי\"דה בְּלַעַז:<br><br><b>ירקון.<\/b> יֹבֶשׁ, וּפְנֵי הַתְּבוּאָה מַכְסִיפִין וְנֶהְפָּכִין לְיֵרָקוֹן, קמ\"א (נ\"א — קרו\"א) בְּלַעַז:<br><br><b>עד אבדך.<\/b> תַּרְגּוּם \"עַד דְּתֵיבָד\", כְּלוֹמַר עַד אֲבֹד אוֹתְךָ — שֶׁתִּכְלֶה מֵאֵלֶיךָ:", "rashi_en": "בשחפת — This is a disease whereby one’s flesh becomes worn away and swollen.<br><br>ובקדחת AND WITH FEVER — The word is similar in meaning to the verb in (Deuteronomy 32:22) “For a fire burns (קדחה) in My nostrils”. It is the heat felt by sick people, mal du feu in old French, which is a very high temperature.<br><br>ובדלקת — This is a fever even hotter than קדחת. — All these terms denote different kinds of diseases, but of a similar character.<br><br>ובחרחר — a disease that makes one burning hot inside the body, so that one is continually thirsting for water; in old French astrandement. The word is of the same meaning as the verbs in (Job 30:30) “My bones are burnt (חרה) because of heat”, and in (Jeremiah 6:29) “The bellows are burnt (נחר) by the fire”.<br><br>ובחרב AND WITH THE SWORD — i.e. He will bring hostile troops against you.<br><br>ובשדפון ובירקון AND WITH BLASTING AND WITH MILDEW — these are diseases that afflict grain which is yet in the field (yet growing).<br><br>שדפון is the hot east-wind, hale in old French<br><br>ירקון is drought. The symptoms are that the surface of the grain becomes pale and ultimately turns yellow; chaume in old French<br><br>עד אבדך — The Targum renders this by עד דתיבד, meaning “until you perish”, i.e. until you will perish on your own."}, {"ch": 28, "v": 23, "aliyah": 6, "heb": "וְהָי֥וּ שָׁמֶ֛יךָ אֲשֶׁ֥ר עַל־רֹאשְׁךָ֖ נְחֹ֑שֶׁת וְהָאָ֥רֶץ אֲשֶׁר־תַּחְתֶּ֖יךָ בַּרְזֶֽל׃", "onk": "וִיהוֹן שְׁמַיָּךְ דִּי עִלָּוֵי רֵישָׁךְ <b>חֲסִינִין<\/b> כִּנְחָשָׁא <b>מִלְּאֲחָתָא מִטְרָא<\/b> וְאַרְעָא דִי תְחוֹתָךְ <b>תַּקִּיפָא<\/b> כְפַרְזְלָא <b>מִלְּמֶעְבַּד פֵּרִין<\/b>:", "onk_en": "And the heavens above your head will be [<b>unyielding<\/b>] like copper [<b>in withholding rain<\/b>] and the earth that is beneath you, [<b>as strong as<\/b>] iron [<b>so as not to bear fruit<\/b>].", "pj": "וִיהוֹן שְׁמַיָא דְעִילַוֵיכוֹן הֵי כִּנְחָשָׁא דִמְזִיעַ וְלָא מְסַפְּקִין לְכוֹן טַלִין וּמִטְרִין וְאַרְעָא דִתְחוֹתְכוֹן הֵי כְּפַרְזְלָא דְלָא מַזִיעַ דְלָא מַרְטִיבָא אִילָנֵי וְאַסְפַּרְמְקֵי וּמְגָדֵי וְיַרְקֵי", "pj_en": "And the heavens above you shall be as brass which sweateth, but that will not yield you any dew or rain; and the ground under you be as iron which sweateth not. nor maketh green the trees, nor yieldeth spiceries, fruits, nor herbs.", "tj": "", "tj_en": "", "rashi": "<b>והיו שמיך אשר על ראשך נחשת.<\/b> קְלָלוֹת הַלָּלוּ מֹשֶׁה מִפִּי עַצְמוֹ אֲמָרָן, וְשֶׁבְּהַר סִינַי מִפִּי הַקָּבָּ\"ה אֲמָרָן, כְּמַשְׁמָעָן, וְכֵן נֶאֱמַר (ויקרא כ\"ו) \"וְאִם לֹא תִשְׁמְעוּ לִי … וְאִם תֵּלְכוּ עִמִּי קֶרִי\", וְכָאן הוּא אוֹמֵר \"בְּקוֹל ה' אֱלֹהֶיךָ … יַדְבֵּק ה' בְּךָ … יַכְּכָה ה'\", הֵקֵל מֹשֶׁה בְקִלְלוֹתָיו לְאָמְרָן בִּלְשׁוֹן יָחִיד. וְגַם כֵּן בִּקְלָלָה זוֹ הֵקֵל, שֶׁבָּרִאשׁוֹנוֹת הוּא אוֹמֵר \"אֶת שְׁמֵיכֶם כַּבַּרְזֶל וְאֶת אַרְצְכֶם כַּנְּחֻשָּׁה\" — שֶׁלֹּא יִהְיוּ הַשָּׁמַיִם מַזִּיעִין כְּדֶרֶךְ שֶׁאֵין הַבַּרְזֶל מַזִּיעַ וּמִתּוֹךְ כָּךְ יְהִי חֹרֶב בָּעוֹלָם וְהָאָרֶץ תְּהִי מַזַּעַת כְּדֶרֶךְ שֶׁהַנְּחֹשֶׁת מַזִּיעַ וְהִיא מַרְקֶבֶת פֵּרוֹתֶיהָ, וְכָאן הוּא אוֹמֵר \"שָׁמֶיךָ נְחֹשֶׁת וְאַרְצְךָ בַּרְזֶל\" — שֶׁיִהְיוּ שָׁמַיִם מַזִּיעִין, אַעַ\"פִּ שֶׁלֹּא יָרִיקוּ מָטָר, מִכָּל מָקוֹם לֹא יִהְיֶה חֹרֶב שֶׁל אֲבַדּוֹן בָּעוֹלָם, וְהָאָרֶץ לֹא תִהְיֶה מַזִּיעָה, כְּדֶרֶךְ שֶׁאֵין הַבַּרְזֶל מַזִּיעַ, וְאֵין הַפֵּרוֹת מַרְקִיבִין, וּמִכָּל מָקוֹם קְלָלָה הִיא, בֵּין שֶׁהִיא כַּנְּחֹשֶׁת בֵּין שֶׁהִיא כַבַּרְזֶל לֹא תוֹצִיא פֵּרוֹת, וְכֵן הַשָּׁמַיִם לֹא יָרִיקוּ מָטָר (ספרא ויקרא כ\"ו):", "rashi_en": "והיו שמיך אשר על ראשך נחשת AND THY HEAVEN WHICH IS OVER THY HEAD SHALL BE COPPER — These curses (i.e. all the curses contained in this chapter) Moses expressed them as though they came from his own mouth (Megillah 31b) whilst those he spoke on Mount Sinai (Leviticus 26), he expressed them as though from the mouth of the Holy One, blessed be He, as indeed is implied by them (by the expressions used), for so it states there: “And if ye will not hearken unto Me”; “And if ye walk contrary to Me”, whilst here it says: “[And if thou wilt not obey] the voice of the Lord thy God”; “The Lord shall make cleave unto thee”; “The Lord shall smite thee”. Moses was milder in his curses, expressing them in the singular (“The Lord shall smite thee”, not “you”, the entire people), and similarly in this curse, too, he was milder, for in the former curses (those in Leviticus) it states, (Leviticus 26:19) “[I will make] your heaven as iron and your earth as copper”, i.e., that the heaven would not exude moisture, just as iron does not exude, and there would therefore be drought in the world, whilst the earth would exude moisture (be humid) just as copper sweats, and it would consequently rot the fruits. Here, however, it states, “Thy heaven shall be copper and thy earth shall be iron”, i.e. that the heavens would exude moisture: even though they might not pour with rain, at any rate there would be no ruinous drought in the world; whilst the earth would not exude moisture just as iron does not sweat, and consequently the fruits would not perish. Nevertheless this is a curse: for whether it (the earth) be as copper or whether it be as iron it will produce no fruit, and the heaven, too, will not pour with rain (give rain in abundance) (cf. Sifra, Bechukotai, Chapter 5 3 on Leviticus 26:19)."}, {"ch": 28, "v": 24, "aliyah": 6, "heb": "יִתֵּ֧ן יְהֹוָ֛ה אֶת־מְטַ֥ר אַרְצְךָ֖ אָבָ֣ק וְעָפָ֑ר מִן־הַשָּׁמַ֙יִם֙ יֵרֵ֣ד עָלֶ֔יךָ עַ֖ד הִשָּׁמְדָֽךְ׃", "onk": "יִתֵּן יְיָ יָת מְטַר אַרְעָךְ אַבְקָא וְעַפְרָא מִן שְׁמַיָּא יֵחוּת עֲלָךְ עַד דְּתִשְׁתֵּצֵי:", "onk_en": "Adonoy will make the rain of your land into dust and soil; from the sky will it come down upon you until you are destroyed.", "pj": "יְגָרֵי יְיָ בָּתַר מִטְרִין דְנַחְתִין עַל אַרְעֲכוֹן רוּחָא דְמַסְקָא אַבְקָא וְעַפְרָא עִילַוֵי עִשְבֵּי חַקְלֵיכוֹן מִן שְׁמַיָא יֵחוֹת פּוּרְעָנוּ עֲלֵיכוֹן עַד דְתִשְׁתֵּיצוּן", "pj_en": "After the rain which cometh down on the earth, the Lord will send a wind that shall drive dust and ashes upon the herbage of your fields; and calamity will fall upon you from the heavens, until you are consumed.", "tj": "", "tj_en": "", "rashi": "<b>מטר ארצך אבק ועפר.<\/b> \"זִיקָא דְבָתַר מִטְרָא\", מָטָר יוֹרֵד וְלֹא כָל צָרְכּוֹ, וְאֵין בּוֹ כְּדֵי לְהַרְבִּיץ אֶת הֶעָפָר, וְהָרוּחַ בָּאָה וּמַעֲלָה אֶת הָאָבָק וּמְכַסֶּה אֶת עֵשֶׂב הַזְּרָעִים שֶׁהֵם לַחִים מִן הַמַּיִם וְנִדְבָּק בָּהֶם, וְנַעֲשֶׂה טִיט וּמִתְיַבֵּשׁ וּמַרְקִיבִין (תענית ג'):", "rashi_en": "מטר ארצך אבק ועפר [GOD SHALL MAKE] THE RAIN OF THY LAND POWDER AND DUST, through “a wind that comes after the rain” as the Talmud says (Taanit 3b); rain will fall but not as much as is needed, so that there will not be sufficient of it to lay the dust; the wind will come and blow the dust about and cover the leaves of the vegetation which are still wet from the water and it will adhere to them and so become mud which will afterwards become dry, and they will rot (Taanit 3b)."}, {"ch": 28, "v": 25, "aliyah": 6, "heb": "יִתֶּנְךָ֨ יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;נִגָּף֮ לִפְנֵ֣י אֹיְבֶ֒יךָ֒ בְּדֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔יו וּבְשִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְפָנָ֑יו וְהָיִ֣יתָ לְזַֽעֲוָ֔ה לְכֹ֖ל מַמְלְכ֥וֹת הָאָֽרֶץ׃", "onk": "יִתְּנִנָּךְ יְיָ <b>תְּבִיר<\/b> קֳדָם סָנְאָךְ בְּאָרְחָא חֲדָא תִּפּוֹק לְוָתֵיהּ וּבְשִׁבְעָא אָרְחָן תֵּעִרוֹק מִקֳּדָמוֹהִי וּתְהֵי לְזִיעַ לְכָל מַלְכְּוַת אַרְעָא:", "onk_en": "Adonoy will set you smitten [<b>broken<\/b>] before your enemies. By one road will you go out toward them and by seven roads will you flee before them; and you will be a cause of shuddering for all the kingdoms of the earth.", "pj": "יְשַׁוֵי יַתְכוֹן מֵימְרָא דַיְיָ תְּבִירִין קֳדָם בַּעֲלֵי דְבָבֵיכוֹן בְּאָרְחָא חַד תִּפְקוּן לִקְדָמוּתְהוֹן לְסִדְרֵי קְרָבָא וּבְשִׁבְעָתֵי אָרְחָן טַעֲיָין תֶּהֱווֹן מַפְכִין (י\"ג עַרְקִין) מִן קֳדָמֵיהוֹן וְתֶהֱווֹן לְרִיחוּק לְכָל מַלְכוּת אַרְעָא", "pj_en": "The Word of the Lord will cause you to be broken before your enemies: by one way you will go out to battle, but by seven ways shall you flee confounded before them, to become an execration in all the kingdoms of the earth.", "tj": "", "tj_en": "", "rashi": "<b>לזעוה.<\/b> לְאֵימָה וּלְזִיעַ, שֶׁיָּזוּעוּ כָּל שׁוֹמְעֵי מַכּוֹתֶיךָ מִמְּךָ וְיֹאמְרוּ \"אוֹי לָנוּ שֶׁלֹּא יָבֹא עָלֵינוּ כְּדֶרֶךְ שֶׁבָּא עַל אֵלּוּ\":", "rashi_en": "לזעוה [AND THOU SHALT] BECOME A זעוה, i.e. a cause of fright and trembling: it means that all who will hear of thy afflictions will tremblingly move away from you and will say, “Woe upon us, would that there should not befall us as has befallen them!”"}, {"ch": 28, "v": 26, "aliyah": 6, "heb": "וְהָיְתָ֤ה נִבְלָֽתְךָ֙ לְמַֽאֲכָ֔ל לְכׇל־ע֥וֹף הַשָּׁמַ֖יִם וּלְבֶהֱמַ֣ת הָאָ֑רֶץ וְאֵ֖ין מַחֲרִֽיד׃", "onk": "וּתְהֵי נְבִלְתָּךְ <b>מְשַׁגְּרָא<\/b> לְמֵיכַל לְכָל עוֹפָא דִשְׁמַיָּא וְלִבְעִירַת אַרְעָא וְלֵית דְּמָנִיד:", "onk_en": "Your corpse will be [<b>cast out for<\/b>] food for every bird of the sky and for the animals of the earth; with no one to scare [them].", "pj": "וּתְהֵי נְבֵלְתְּכוֹן מְשַׁגְרָא לְמֵיכַל לְכָל עוֹפָא דִשְׁמַיָא וְלִבְעִירָא דְאַרְעָא וְלֵית דְמָנִיד יַתְהוֹן מֵעִילַוֵי נְבֵילְתְּכוֹן", "pj_en": "And your carcases will be cast out to be meat for all the fowls of the sky, and for the beasts of the earth, and no one will scare them away from your corpses.", "tj": "וְלֵית דְמָנִיד יַתְכוֹן:", "tj_en": "And no one shall drive them away.", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 27, "aliyah": 6, "heb": "יַכְּכָ֨ה יְהֹוָ֜ה בִּשְׁחִ֤ין מִצְרַ֙יִם֙ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(ובעפלים)<\/span> <span class=\"mam-kq-q\">[וּבַטְּחֹרִ֔ים]<\/span><\/span> וּבַגָּרָ֖ב וּבֶחָ֑רֶס אֲשֶׁ֥ר לֹא־תוּכַ֖ל לְהֵרָפֵֽא׃", "onk": "יִמְחִנָּךְ יְיָ בְּשִׁחֲנָא דְמִצְרַיִם וּבִטְחוֹרִין וּבְגַרְבָּא וּבַחֲרִיס יַבִּישׁ דִּי לָא תִכּוּל לְאִתַּסָּאָה:", "onk_en": "Adonoy will plague you with Egyptian boils and with hemorroids and with running and dry boils; from which you will be unable to be healed.", "pj": "יַמְחִינְכוֹן מֵימְרָא דַיְיָ בְּשִׁיחְנֵי דִי לָקוּ בְּהוֹן מִצְרָאֵי וּבִטְחוֹרַיָא דִמְסַמְיָין חֶזְוָותָא וּבְגַרְבָּא וּבְחִכּוּכָא דְלָא תֵכְלוּן לְאִיתְּסָאָה", "pj_en": "And the Word of the Lord will smite you with the ulcers with which the Mizraee were smitten, and with haemorrhoids that blind the sight, and with blotches, and with erysipelas, from which you will not be able to be healed.", "tj": "יִמְחֵי יַתְכוֹן מֵימְרָא דַיְיָ בְּשׁוֹחֲנָא דְמִצְרַיִם וּבִטְחוֹרַיָא וּבְגַרְבָּא וּבַחֲכוּךְ חַסְפָּא דִי לָא יָכְלִין לְמִתַּסְיָא:", "tj_en": "The Word of the Lord will smite you with the ulcer of Mizraim, and with hemorrhoids, and with the blotch, and with scurvy, which cannot be healed.", "rashi": "<b>בשחין מצרים.<\/b> רַע הָיָה מְאֹד, לַח מִבִּפְנִים וְיָבֵשׁ מִבַּחוּץ, כִּדְאִיתָא בִּבְכוֹרוֹת (דף מ\"א):<br><br><b>גרב.<\/b> שְׁחִין לַח:<br><br><b>חרס.<\/b> שְׁחִין יָבֵשׁ כַּחֶרֶס:", "rashi_en": "בשחין מצרים [THE LORD WILL SMITH THEE] WITH THE BOILS OF EGYPT — This was very bad, being wet inside and dry on the surface, as is stated in Treatise Bechorot 41a.<br><br>גרב is a wet boil,<br><br>חרס is a boil dry as a potsherd (חרס identical with חרש, a potsherd cf. Rashi on Leviticus 21:20)."}, {"ch": 28, "v": 28, "aliyah": 6, "heb": "יַכְּכָ֣ה יְהֹוָ֔ה בְּשִׁגָּע֖וֹן וּבְעִוָּר֑וֹן וּבְתִמְה֖וֹן לֵבָֽב׃", "onk": "יִמְחִנָּךְ יְיָ בְּטַפְשׁוּתָא וּבְסַמְיוּתָא <b>וּבְשַׁעֲמָמוּת<\/b> <b>לִבָּא<\/b>:", "onk_en": "Adonoy will plague you with insanity and with blindness, and with utter confusion [<b>in your heart<\/b>].", "pj": "יַמְחִינְכוֹן מֵימְרָא דַיְיָ בְּשַׁוְויָיתָא דִמְטַפְּשָׁא מוֹקְדָא וּבְסַמְיָתָא וּבְשִׁיעֲמָמוּת לִבָּא", "pj_en": "The Word of the Lord will smite you with fearfulness which bewildereth the brain, and with blindness and stupor of heart.", "tj": "", "tj_en": "", "rashi": "<b>ובתמהון לבב.<\/b> אֹטֶם הַלֵּב, אשטור\"דישון בְּלַעַז:", "rashi_en": "ובתמהון לבב means “clogging of the heart”; etourdison in old French"}, {"ch": 28, "v": 29, "aliyah": 6, "heb": "וְהָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽצׇּהֳרַ֗יִם כַּאֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הַֽעִוֵּר֙ בָּאֲפֵלָ֔ה וְלֹ֥א תַצְלִ֖יחַ אֶת־דְּרָכֶ֑יךָ וְהָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְגָז֛וּל כׇּל־הַיָּמִ֖ים וְאֵ֥ין מוֹשִֽׁיעַ׃", "onk": "וּתְהֵי מְמַשֵּׁשׁ בְּטִהֲרָא כְּמָא דִי מַשֵּׁשׁ עַוִּירָא בְּקַבְלָא וְלָא תַצְלַח יָת אָרְחָתָיךְ וּתְהֵי בְּרַם עָשִׁיק וְאָנִיס כָּל יוֹמַיָּא וְלֵית דְּפָרִיק:", "onk_en": "You will grope at midday the way a blind man gropes in the darkness, and you will not succeed your ways; you will be only the victim of wrangling and robbed all the days with no savior.", "pj": "וְתֶהֱווֹן תְּבִיעִין מִילְכָּא טָבָא לִרְוָחֵי עֲקַתְכוֹן וְלָא יֶהֱוֵי בְּכוֹן מְחַוֵי קוּשְׁטָא הֵיכְמָא דִמְמַשֵׁשׁ סַמְיָא בְּקִיבְלָא דְלֵית לַעֲדֵי אוֹרְחָא לְמֶחֱמֵי לִמְכַוָונוּתְהוֹן בְּאָרְחָא וְלָא תַצְלְחוּן יַת אָרְחַתְכוֹן וְתֶהֱווֹן בְּרַם עַצְיַין וַאֲנִיסִין כָּל יוֹמַיָא וְלֵית דְפָרִיק", "pj_en": "And you will seek good counsel for enlargement from your adversities, but there will be none among you to show the truth, so that you will grope in darkness like the blind who have none passing by the road to see how to direct them in the way; nor shall you prosper in your ways, but be oppressed and afflicted all the days, without any to deliver.", "tj": "", "tj_en": "", "rashi": "<b>עשוק.<\/b> בְּכָל מַעֲשֶׂיךָ יִהְיֶה עִרְעוּר:", "rashi_en": "עשוק [THOU SHALT BE] WRONGED — i.e. against every action of yours there will be dispute."}, {"ch": 28, "v": 30, "aliyah": 6, "heb": "אִשָּׁ֣ה תְאָרֵ֗שׂ וְאִ֤ישׁ אַחֵר֙ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(ישגלנה)<\/span> <span class=\"mam-kq-q\">[יִשְׁכָּבֶ֔נָּה]<\/span><\/span> בַּ֥יִת תִּבְנֶ֖ה וְלֹא־תֵשֵׁ֣ב בּ֑וֹ כֶּ֥רֶם תִּטַּ֖ע וְלֹ֥א תְחַלְּלֶֽנּוּ׃", "onk": "אִתְּתָא תֵירוֹס וּגְבַר אָחֳרָן יִשְׁכְּבִנַּהּ בֵּיתָא תִבְנֵי וְלָא תֵיתֵב בֵּיהּ כַּרְמָא <b>תִצּוֹב<\/b> וְלָא תְחַלִּנֵּיהּ:", "onk_en": "A woman will you marry and another man will lie with her; a house will you build and will not live in it; a vineyard will you plant and will not redeem it[s fruit].", "pj": "אִיתָא תְּקַדֵשׁ וּגְבַר חוֹרַן יְשַׁמֵשׁ עִמָהּ בֵּיתָא תִבְנֵי וְלָא תִיתַב בֵּיהּ כַּרְמָא תִנְצוֹב וְלָא תַחְלִינֵיהּ", "pj_en": "Thou wilt betroth a wife, but another man will have her; thou wilt build a house, but not dwell in it; thou wilt plant a vineyard, but not make it common.", "tj": "", "tj_en": "", "rashi": "<b>ישגלנה.<\/b> לְשׁוֹן שֵׁגַל, פִּלֶגֶשׁ, וְהַכָּתוּב כִּנָּהוּ לְשֶׁבַח <b>ישכבנה<\/b>, וְתִקּוּן סוֹפְרִים הוּא זֶה:<br><br><b>תחללנו.<\/b> בַּשָּׁנָה הָרְבִיעִית לֶאֱכֹל פִּרְיוֹ (מגילה כ\"ה):", "rashi_en": "ישגלנה is connected in meaning with the noun שגל, a concubine; Scripture, however, paraphrases it by using a more decent, expression, viz., ישכבנה (i.e. the קרי is ישכבנה). This is a variation such as writers make to avoid an indecent expression (Megillah 25b; cf. Rashi on Genesis 18:22 and Note p. 266).<br><br>תחללנו THOU SHALT NOT MAKE IT חולין in the fourth year so as to be able to eat its fruits (cf. Rashi on Deuteronomy 20:6)."}, {"ch": 28, "v": 31, "aliyah": 6, "heb": "שׁוֹרְךָ֞ טָב֣וּחַ לְעֵינֶ֗יךָ וְלֹ֣א תֹאכַל֮ מִמֶּ֒נּוּ֒ חֲמֹֽרְךָ֙ גָּז֣וּל מִלְּפָנֶ֔יךָ וְלֹ֥א יָשׁ֖וּב לָ֑ךְ צֹֽאנְךָ֙ נְתֻנ֣וֹת לְאֹיְבֶ֔יךָ וְאֵ֥ין לְךָ֖ מוֹשִֽׁיעַ׃", "onk": "תּוֹרָךְ יְהֵי נָכֵס לְעֵינָיךְ וְלָא תֵיכוּל מִנֵּיהּ חֲמָרָךְ יְהֵי אָנֵס מִקֳּדָמָךְ וְלָא יְתוּב לָךְ עָנָךְ מְסִירִין לְבַעֲלֵי דְבָבָךְ וְלֵית לָךְ פָּרִיק:", "onk_en": "Your ox [will be] butchered before your eyes, and you will not eat of it; your ass [will be] robbed in your presence and will not return to you; your flocks [will be] given to your enemies, and you have no savior.", "pj": "תּוֹרֵיכוֹן יְהוֹן נְכִיסִין וְאַתּוּן חַמְיַין וְלָא תֵיכְלוּן מִנְהוֹן חַמְרֵיכוֹן יֶהֱוְיָין אֲנִיסִין מִן קֳדָמֵיכוֹן וְלָא יְתוּבוּן לְכוֹן עָנֵיכוֹן מְסִירִין לְבַעֲלֵי דְבָבֵיכוֹן וְלֵית לְכוֹן פָּרִיק", "pj_en": "Your oxen will be killed, you looking on, but without eating of them; your asses will be taken away from before you, but they will not be returned; your sheep will be delivered over to your enemies, and there will for you be no deliverance;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 32, "aliyah": 6, "heb": "בָּנֶ֨יךָ וּבְנֹתֶ֜יךָ נְתֻנִ֨ים לְעַ֤ם אַחֵר֙ וְעֵינֶ֣יךָ רֹא֔וֹת וְכָל֥וֹת אֲלֵיהֶ֖ם כׇּל־הַיּ֑וֹם וְאֵ֥ין לְאֵ֖ל יָדֶֽךָ׃", "onk": "בְּנָיךְ וּבְנָתָיךְ מְסִירִין לְעַמָּא אָחֳרָן וְעֵינָיךְ חֲזָן וִיסוּפָן <b>בִּגְלָלְהֵן<\/b> כָּל יוֹמָא וְלֵית חֵילָא בִּידָךְ:", "onk_en": "Your sons and your daughters [will be] given to another people while your eyes watch and pine for them [<b>because of them<\/b>] all day, and your are powerless.", "pj": "בְּנֵיכוֹן וּבְנָתֵיכוֹן מְסִירִין לְעַם חִילוֹנֵי וְעֵינֵיכוֹן חַמְיָין וְחַשְׁכָן עֲלֵיהוֹן כָּל יוֹמָא וְלֵית בִּידֵיכוֹן עָבְדִין טָבְיָן דְתִיתוֹקְפָן יְדֵיכוֹן בִּצְלוֹ קֳדָם יְיָ אֲבוּכוֹן דְבִשְׁמַיָא דְיִפְרוֹק יַתְכוֹן", "pj_en": "your sons and daughters will be given up to another people, and your eyes see it, and grow dim because of them from day to day; and in your hand will be no good work by which you may prevail in prayer before the Lord your Father who is in heaven, that He may save you.", "tj": "בְּנֵיכוֹן וּבְנָתֵיכוֹן מְסִירִין לְעַם חוֹרֵי וְעֵינֵיכוֹן חַמְיָין וִיהוֹן כַּסֵהוֹן עֲלֵיהוֹן כָּל יוֹמַיָא וְלֵית לְכוֹן עוֹבָדִין טָבִין דִי יִסְפַּק אֱלָהָא עַל יְדֵיכוֹן לְמִפְרַק יַתְהוֹן:", "tj_en": "Your sons and daughters shall be delivered unto another people, while your eyes behold and fail on account of them all the day; nor will you have the good works to give satisfaction unto God, that He might redeem you.", "rashi": "<b>וכלות אליהם.<\/b> מְצַפּוֹת אֲלֵיהֶם שֶׁיָּשׁוּבוּ וְאֵינָם שָׁבִים; כָּל תּוֹחֶלֶת שֶׁאֵינָהּ בָּאָה קְרוּיָה כִּלְיוֹן עֵינַיִם:", "rashi_en": "וכלות אליהם [AND THINE EYES SHALL SEE] AND LONG FOR THEM — i.e. they will look expectantly for them (the children) that they should return home, but they will not return. — Any desire that does not come to fulfillment is termed a “failing of the eyes” (cf. Deuteronomy 28:65)."}, {"ch": 28, "v": 33, "aliyah": 6, "heb": "פְּרִ֤י אַדְמָֽתְךָ֙ וְכׇל־יְגִ֣יעֲךָ֔ יֹאכַ֥ל עַ֖ם אֲשֶׁ֣ר לֹא־יָדָ֑עְתָּ וְהָיִ֗יתָ רַ֛ק עָשׁ֥וּק וְרָצ֖וּץ כׇּל־הַיָּמִֽים׃", "onk": "אִבָּא דְאַרְעָךְ וְכָל לֵאוּתָךְ יֵכוּל עַמָּא דִּי לָא יְדַעַתְּ וּתְהֵי בְרַם עָשִׁיק וּרְעִיעַ כָּל יוֹמַיָּא:", "onk_en": "The fruit of your soil and all your toil will be eaten by a people that you do not know; and you will be solely oppressed and crushed all the time.", "pj": "פֵּירֵי אַרְעֲכוֹן וְכָל לֵיעוּתְכוֹן יְגַמֵר עַמָא דְלָא חַכִּימְתּוּן וְתֶהֱווֹן בְּרַם טְלִימִין וּדְרִיסִין כָּל יוֹמַיָא", "pj_en": "The fruitage of your ground, and of all your labour, will a people whom thou hast not known devour, and thou shalt be oppressed and trodden down all the days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 34, "aliyah": 6, "heb": "וְהָיִ֖יתָ מְשֻׁגָּ֑ע מִמַּרְאֵ֥ה עֵינֶ֖יךָ אֲשֶׁ֥ר תִּרְאֶֽה׃", "onk": "וּתְהֵי <b>מִשְׁתַּטֵּיהּ<\/b> מֵחֵזוּ עֵינָיךְ דִּי תֶחֱזֵי:", "onk_en": "And you will become insane [<b>made<\/b>] from the sights that you see.", "pj": "וְתֶהֱווֹן מִשְׁתַּטְיָין מִפּוּרְעֲנוּתָא וּמִן מֶחְמֵי עֵינֵיכוֹן דְתֵיחְמוּן תְּזוּעוּן", "pj_en": "And you will be maddened by the vengeance, and shaken by the sight of your eyes that you will see.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 35, "aliyah": 6, "heb": "יַכְּכָ֨ה יְהֹוָ֜ה בִּשְׁחִ֣ין רָ֗ע עַל־הַבִּרְכַּ֙יִם֙ וְעַל־הַשֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא־תוּכַ֖ל לְהֵרָפֵ֑א מִכַּ֥ף רַגְלְךָ֖ וְעַ֥ד קׇדְקֳדֶֽךָ׃", "onk": "יִמְחִנָּךְ יְיָ בְּשִׁחֲנָא בִישָׁא עַל רְכֻבַיָּא וְעַל שָׁקַיָּא דִּי לָא תִכּוּל לְאִתַּסָּאָה מִפַּרְסַת רַגְלָךְ וְעַד <b>מוֹחָךְ<\/b>:", "onk_en": "Adonoy will plague you with bad boils on the knees and on the legs from which you will be unable to be healed; from the sole of your foot till your skull [<b>brain<\/b>].", "pj": "יַמְחִינְכוֹן מֵימְרָא דַיְיָ בְּשִׁיחְנָא בִישָׁא עַל רְכוּבַיָא מְטוֹל דְחַמִיטְתוֹן לְפִתְגַם עֲבֵירְתָּא וְעַל שַׁקְיָיא דִרְהָטוּ לָהּ וְאִין לָא תְתוּבוּן לְאוֹרַיְיתָא לָא תֵכְלוּן לְאִיתַּסָאָה אֱלָהֵן תִּילְקוּן בֵּיהּ מִפַּרְסַת רִיגְלֵיכוֹן וְעַד מוֹקְדָא דְרֵישֵׁיכוֹן", "pj_en": "The Word of the Lord will smite you with a sore ulcer in the knees, because you bent (them) in the matter of the transgression; and in the legs, by which you ran into it; for if you be not converted to the law you cannot be saved, but will be beaten by it from the sole of your feet unto the crown of your head.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 36, "aliyah": 6, "heb": "יוֹלֵ֨ךְ יְהֹוָ֜ה אֹתְךָ֗ וְאֶֽת־מַלְכְּךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔יךָ אֶל־גּ֕וֹי אֲשֶׁ֥ר לֹא־יָדַ֖עְתָּ אַתָּ֣ה וַאֲבֹתֶ֑יךָ וְעָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָאָֽבֶן׃", "onk": "<b>יַגְלֵי<\/b> יְיָ יָתָךְ וְיָת מַלְכָּךְ דִּי תְקִים עֲלָךְ לְעַם דִּי לָא יְדַעַתְּ אַתְּ וַאֲבָהָתָיךְ וְתִפְלַח תַּמָּן <b>לְעַמְמַיָּא פָּלְחֵי טַעֲוָתָא<\/b> אָעָא וְאַבְנָא:", "onk_en": "Adonoy will lead [<b>exile<\/b>] you and your king, whom you will set upon yourself, to a nation that neither you nor your parents knew; and there you will serve other powers [<b>nations worshipping idols<\/b>] [of] wood and stone.", "pj": "יַגְלֵי יְיָ יַתְכוֹן וְיַת מַלְכְּכוֹן דְתִמְנוּן עֲלֵיכוֹן לְאוּמָא דְלָא חַכִּימְתּוּן אַתּוּן וְאַבְהַתְכוֹן וְתֶהֱווֹן מַסְקֵי אַרְנוּנִין לְפַלְחֵי טַעֲוָון דְקַיְסִין וְאַבְנִין", "pj_en": "The Lord will make you and your king whom you may set over you to go away among a people that neither you nor your fathers have known; and you will carry tribute to peoples who worship idols of wood and stone.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 37, "aliyah": 6, "heb": "וְהָיִ֣יתָ לְשַׁמָּ֔ה לְמָשָׁ֖ל וְלִשְׁנִינָ֑ה בְּכֹל֙ הָֽעַמִּ֔ים אֲשֶׁר־יְנַהֶגְךָ֥ יְהֹוָ֖ה שָֽׁמָּה׃", "onk": "וּתְהֵי לְצָדוּ לִמְתַל וּלְשׁוֹעֵי בְּכֹל עַמְמַיָּא דִּי יִדְבְּרִנָּךְ יְיָ לְתַמָּן:", "onk_en": "You will become an [object of] stupefaction, be cited as an example and become the subject of gossip among all the peoples to whom Adonoy will lead you.", "pj": "וְאִין יְהַרְהֵר לִבְּכוֹן לְמִפְלַח לְטַעֲוַותְהוֹן תֶּהֱווֹן לְשַׁעֲמוֹן לְמִתְלִין וְלִתְנוּיָין בֵּינֵי עַמְמַיָא דִי בַּדַר יַתְכוֹן יְיָ לְתַמָן", "pj_en": ".And if the thought of your heart be to worship their idols, you shall be for astonishment, for proverbs and tales, among the sons of the Gentiles where the Lord will have scattered you.", "tj": "", "tj_en": "", "rashi": "<b>לשמה.<\/b> כְּמוֹ תִּמָּהוֹן, אש\"ו אשטורדישו\"ן, כָּל הָרוֹאֶה אוֹתְךָ יִשֹּׁם עָלֶיךָ:<br><br><b>למשל.<\/b> כְּשֶׁתָּבֹא מַכָּה רָעָה עַל אָדָם יֹאמְרוּ זוֹ דוֹמָה לְמַכַּת פְּלוֹנִי:<br><br><b>ולשנינה.<\/b> לְשׁוֹן \"וְשִׁנַּנְתָּם\" (דברים ו'), יְדַבְּרוּ בְךָ, וְכֵן תַּרְגּוּמוֹ \"וּלְשׁוֹעֵי\", לְשׁוֹן סִפּוּר וְאִשְׁתָּעִי:", "rashi_en": "לשמה [THOU SHALT] BECOME AN OBJECT OF ASTONISHMENT — This word means the same as תמהון, etourdison in old French, English astonishment. — Whoever will see you will be astonished about you.<br><br>למשל [THOU SHALT] BECOME A PROVERB — i.e., when an extraordinary misfortune comes upon a man people will say: “This is like the misfortune that befell Mr. So-and-so!”<br><br>ולשנינה AND A BYWORD — This is an expression of the same meaning as (Deuteronomy 6:7) ושננתם, “And thou shalt speak often”. — “And thou shalt become a ״שנינה therefore means: they (people) will talk about you (make you the topic of their conversation). Onkelos, too, renders it thus: ולשועי, which has the meaning of “relating about a matter”, just as ואשתעי is the Targum rendering of ויספר, “and he related”."}, {"ch": 28, "v": 38, "aliyah": 6, "heb": "זֶ֥רַע רַ֖ב תּוֹצִ֣יא הַשָּׂדֶ֑ה וּמְעַ֣ט תֶּאֱסֹ֔ף כִּ֥י יַחְסְלֶ֖נּוּ הָאַרְבֶּֽה׃", "onk": "<b>בַּר<\/b> זְרַע סַגִּי תַּפֵּק <b>לְחַקְלָא<\/b> וּזְעֵר תִּכְנוֹשׁ אֲרֵי יַחְסְלִנֵּיהּ גּוֹבָא:", "onk_en": "Much seed will you take out to the fields, and little will you gather because the locust will demolish it.", "pj": "בַּר זְרַע סַגִי תִפְקוּן לְחַקְלָא וּזְעֵיר תִּכְנְשׁוּן אֲרוּם יְקַרְסוּם יָתֵיהּ גוֹבָאֵי", "pj_en": "You will carry much seed into the field, but gather in little, for the locust shall eat it.", "tj": "תִּפְקוּן לְבָרָא וְקָלִיל תִּכְנוֹשׁוּן אֲרוּם יְקַרְסוּם יָתֵהּ גוֹבָא:", "tj_en": "You will carry out, but collect little, for the locust will devour it.", "rashi": "<b>יחסלנו.<\/b> יְכַלֶּנּוּ, וְעַל שֵׁם כָּךְ נִקְרָא חָסִיל, שֶׁמְּכַלֶּה אֶת הַכֹּל:", "rashi_en": "יחסלנו [THE LOCUST] WILL CROP IT OFF — The word means: it will make an end of it. It is for this reason that it (the locust) is also called חסיל (cf. e.g. Joel 1:4) because it consumes all the vegetation, etc. (חסל in Aramaic means “to end”; cf. Talmud Yerushalmi Taanit 3:6)."}, {"ch": 28, "v": 39, "aliyah": 6, "heb": "כְּרָמִ֥ים תִּטַּ֖ע וְעָבָ֑דְתָּ וְיַ֤יִן לֹֽא־תִשְׁתֶּה֙ וְלֹ֣א תֶאֱגֹ֔ר כִּ֥י תֹאכְלֶ֖נּוּ הַתֹּלָֽעַת׃", "onk": "כַּרְמִין תִּצּוֹב וְתִפְלַח וְחַמְרָא לָא תִשְׁתֵּי וְלָא תִכְנוֹשׁ אֲרֵי תֵיכְלִנֵּיהּ תֹּלַעְתָּא:", "onk_en": "Vineyards will you plant and labor in, but wine will you not drink nor will you store because worms will consume it.", "pj": "כְּרָמִין תִּנְצְבוּן וְתִפְלְחוּן וְחַמְרָא לָא תִשְׁתּוּן וְלָא תְעַצְרוּן לְמִכְנוֹשׁ אֲרוּם יְגַמְרִינֵיהּ זַחֲלָא", "pj_en": "You will plant vineyards and till them, but will not drink the wine nor press out the vintage, because the worm will have consumed it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 40, "aliyah": 6, "heb": "זֵיתִ֛ים יִהְי֥וּ לְךָ֖ בְּכׇל־גְּבוּלֶ֑ךָ וְשֶׁ֙מֶן֙ לֹ֣א תָס֔וּךְ כִּ֥י יִשַּׁ֖ל זֵיתֶֽךָ׃", "onk": "זֵיתִין יְהוֹן לָךְ בְּכָל תְּחוּמָךְ וּמִשְׁחָא לָא תְסוּךְ אֲרֵי <b>יִתְּרוּן<\/b> זֵיתָיךְ:", "onk_en": "Olives will you have within your entire boundary, but oil will you not annoint because your olives (trees) will be discarded [<b>wasted<\/b>].", "pj": "זֵיתִין יְהוֹן לְכוֹן בְּכָל תְּחוּמְכוֹן וּמְשַׁח לָא תְשׁוּטוּן אֲרוּם יְנַתְּרוּן זֵיתֵיכוֹן", "pj_en": "You will have olive trees in all your borders, but will not be anointed with oil, for your olive trees will fail.", "tj": "וּמְשַׁח לָא תִמְשְׁחוּן אֲרוּם יִתַּר נִצָה דְזַיְיתֵיכוֹן:", "tj_en": "But with oil you will not be anointed, for the bloom of your olive trees shall be destroyed.", "rashi": "<b>ישל.<\/b> יַשִּׁיר פֵּרוֹתָיו, לְשׁוֹן וְנָשַׁל הַבַּרְזֶל (דברים י\"ט):", "rashi_en": "ישל means, it (the olivetree) shall drop its fruits. It is similar in meaning to the verb in (Deuteronomy 19:5), \"And the iron falleth off (ונשל). "}, {"ch": 28, "v": 41, "aliyah": 6, "heb": "בָּנִ֥ים וּבָנ֖וֹת תּוֹלִ֑יד וְלֹא־יִהְי֣וּ לָ֔ךְ כִּ֥י יֵלְכ֖וּ בַּשֶּֽׁבִי׃", "onk": "בְּנִין וּבְנָן תּוֹלִיד וְלָא יְהוֹן לָךְ אֲרֵי יְהָכוּן בְּשִׁבְיָא:", "onk_en": "Sons and daughters will you bear, but you will not have them because they will go into captivity.", "pj": "בְּנִין וּבְנָן תּוֹלְדוּן וְלָא יֶהֱוְויָין מְהַנְיָין לְכוֹן אֲרוּם יִזְלוּן בְּשִׁבְיָיתָא", "pj_en": "You will beget sons and daughters, but they will yield you no advantage, for they shall go into captivity.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 42, "aliyah": 6, "heb": "כׇּל־עֵצְךָ֖ וּפְרִ֣י אַדְמָתֶ֑ךָ יְיָרֵ֖שׁ הַצְּלָצַֽל׃", "onk": "כָּל אִילָנָךְ <b>וְאִבָּא<\/b> דְאַרְעָךְ יַחְסְנִנֵּיהּ סַקָּאָה:", "onk_en": "All your trees and the fruit of your soil the cicada will impoverish.", "pj": "כָּל אִילָנֵיכוֹן וּפֵירֵי אַרְעֲכוֹן יְשֵׁצֵי חֲלָנוּנָא", "pj_en": "All the trees and fruits of your land the locusts will destroy.", "tj": "כָּל אִילָנֵיכוֹן וּפֵירֵי אַרְעֲכוֹן יֵירְתוּן מַסִיקַיָא:", "tj_en": "Robbers shall take possession of the trees and the fruits of your land.", "rashi": "<b>יירש הצלצל.<\/b> יַעֲשֶׂנּוּ הָאַרְבֶּה רָשׁ מִן הַפְּרִי:<br><br><b>יירש.<\/b> יַעֲנִי:<br><br><b>צלצל.<\/b> מִין אַרְבֶּה. וְאִי אֶפְשָׁר לְפָרֵשׁ יְיָרֵשׁ לְשׁוֹן יְרֻשָּׁה, שֶׁאִם כֵּן הָיָה לוֹ לִכְתֹּב \"יִירַשׁ\", וְלֹא לְשׁוֹן הוֹרָשָׁה וְגֵרוּשִׁין, שֶׁאִם כֵּן הָיָה לוֹ לִכְתֹּב \"יוֹרִישׁ\":", "rashi_en": "יירש הצלצל means, the locust will make it (the tree) bare (lit., will impoverish it) of its fruits.<br><br>יירש means, it will impoverish.<br><br>צלצל is a species of locust. — One cannot explain יְָירֵשׁ as meaning \"inheriting\" (\"taking possesion of\", as the Targum does), for if so it ought to have written יִירַשׁ (cf. Genesis 21:10). Nor can it have the meaning of “driving out” and “expelling”, for then it ought to have written יוריש."}, {"ch": 28, "v": 43, "aliyah": 6, "heb": "הַגֵּר֙ אֲשֶׁ֣ר בְּקִרְבְּךָ֔ יַעֲלֶ֥ה עָלֶ֖יךָ מַ֣עְלָה מָּ֑עְלָה וְאַתָּ֥ה תֵרֵ֖ד מַ֥טָּה מָּֽטָּה׃", "onk": "<b>תּוֹתַב עָרֵל<\/b> דִּי בֵינָךְ יְהֵי סָלִיק עֵיל מִנָּךְ לְעֵלָּא לְעֵלָּא וְאַתְּ תְּהֵי נָחֵת לְתַחְתָּא לְתַחְתָּא:", "onk_en": "The non-Jew [<b>uncircumcized alien<\/b>] among you will rise above you higher and higher, while you descend lower and lower.", "pj": "עַרְלָאָה דְדַיַיר בֵּינֵיכוֹן יִסוֹק עֲלֵיכוֹן מְסוּקְיָין עַל מְסוּקְיָין וְאַתּוּן תְּחוּתוּן דְרַע מִנֵיהּ מְחוּתִין מִן מְחוּתִין", "pj_en": "The uncircumcised who dwelleth among you will rise above you with ascension upon ascension, but you will go downwards by descent after descent.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 44, "aliyah": 6, "heb": "ה֣וּא יַלְוְךָ֔ וְאַתָּ֖ה לֹ֣א תַלְוֶ֑נּוּ ה֚וּא יִהְיֶ֣ה לְרֹ֔אשׁ וְאַתָּ֖ה תִּֽהְיֶ֥ה לְזָנָֽב׃", "onk": "הוּא יוֹזְפִנָּךְ וְאַתְּ לָא תוֹזְפִנֵּיהּ הוּא יְהֵי <b>לְתַקִּיף<\/b> וְאַתְּ תְּהֵי <b>לְחַלָּשׁ<\/b>:", "onk_en": "He will lend to you but you will not lend to him; he will be at the head [<b>powerful<\/b>], and you will be at the tail [<b>weak<\/b>].", "pj": "הוּא יַזְפוּנְכוֹן וְאַתּוּן לָא תוֹזְפוּן לְהוֹן הוּא יֶהֱוֵי שַׁלִיט וְאַתּוּן תֶּהֱווֹן הֶדְיוֹטִין", "pj_en": "He will lend to you, but you will not lend to him; he will be the master, and you the servant.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 45, "aliyah": 6, "heb": "וּבָ֨אוּ עָלֶ֜יךָ כׇּל־הַקְּלָל֣וֹת הָאֵ֗לֶּה וּרְדָפ֙וּךָ֙ וְהִשִּׂיג֔וּךָ עַ֖ד הִשָּׁמְדָ֑ךְ כִּי־לֹ֣א שָׁמַ֗עְתָּ בְּקוֹל֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לִשְׁמֹ֛ר מִצְוֺתָ֥יו וְחֻקֹּתָ֖יו אֲשֶׁ֥ר צִוָּֽךְ׃", "onk": "וְיֵיתוּן עֲלָךְ כָּל לְוָטַיָּא הָאִלֵּין וְיִרְדְּפֻנָּךְ <b>וְיִדְבְּקֻנָּךְ<\/b> עַד דְּתִשְׁתֵּצֵי אֲרֵי לָא <b>קַבֶּלְתָּא לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ לְמִטַּר פִּקּוּדוֹהִי וּקְיָמוֹהִי דִּי פַקְּדָךְ:", "onk_en": "All these curses will come upon you and will chase you and reach [<b>adhere to<\/b>] you until you are destroyed; for you have not obeyed [<b>accepted the word of<\/b>] Adonoy, your God, to guard His commandments and His statutes that He commanded you.", "pj": "וְיֵיתוּן עִילַוֵיכוֹן כָּל לְוָטַיָא הָאִלֵין וְיִרְדְפוּנְכוֹן וִיעַרְקִינְכוֹן עַד דְתִשְׁתֵּיצוּן אֲרוּם לָא קַבֵּילְתּוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן לְמִטַר פִּקוּדוֹי וּקְיָימוֹי דִי פַקֵיד יַתְכוֹן", "pj_en": "And all of these curses will come upon you, and will follow and cleave to you until you have perished, because you would not hearken to the Word of the Lord your God, to observe His commandments and statutes which He had commanded you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 46, "aliyah": 6, "heb": "וְהָי֣וּ בְךָ֔ לְא֖וֹת וּלְמוֹפֵ֑ת וּֽבְזַרְעֲךָ֖ עַד־עוֹלָֽם׃", "onk": "וִיהוֹן בָּךְ לְאָת וּלְמוֹפֵת וּבִבְנָיךְ עַד עֳלָם:", "onk_en": "They will happen to you as a sign and a wonder, and to your descendants forever.", "pj": "וִיהוֹן בְּכוֹן לְאָתִין וּלְתִמְהִין וּבִבְנֵיכוֹן עַד עָלְמָא", "pj_en": "And they will be upon you for signs and portents, and upon your children for ever;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 47, "aliyah": 6, "heb": "תַּ֗חַת אֲשֶׁ֤ר לֹא־עָבַ֙דְתָּ֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּשִׂמְחָ֖ה וּבְט֣וּב לֵבָ֑ב מֵרֹ֖ב כֹּֽל׃", "onk": "חֳלָף דִּי לָא פְלַחְתָּא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ בְּחֶדְוָא וּבְשַׁפִּירוּת לִבָּא מִסְּגֵי כֹּלָּא:", "onk_en": "Since you did not serve [<b>before<\/b>] Adonoy, your God, with joy and goodheartedness, in total affluence.", "pj": "חוֹלַף דְלָא פְלַחְתּוּן קֳדָם יְיָ אֱלָהָכוֹן בְּחֶדְוָוא וּבִשְׁפִּירוּת לִבָּא מִסוֹגְעֵי כָּל טוּבָא", "pj_en": "for that you would not serve before the Lord your God cheerfully, with rightness of heart for the abundance of all good.", "tj": "", "tj_en": "", "rashi": "<b>מרב כל.<\/b> בְּעוֹד שֶׁהָיָה לְךָ כָּל טוּב:", "rashi_en": "מרב כל means: while you possessed all good things."}, {"ch": 28, "v": 48, "aliyah": 6, "heb": "וְעָבַדְתָּ֣ אֶת־אֹיְבֶ֗יךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤נּוּ יְהֹוָה֙ בָּ֔ךְ בְּרָעָ֧ב וּבְצָמָ֛א וּבְעֵירֹ֖ם וּבְחֹ֣סֶר כֹּ֑ל וְנָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל־צַוָּארֶ֔ךָ עַ֥ד הִשְׁמִיד֖וֹ אֹתָֽךְ׃", "onk": "וְתִפְלַח יָת בַּעֲלֵי דְבָבָךְ דִּי <b>יְגָרִנֵּיהּ<\/b> יְיָ בָּךְ בְּכַפְנָא וּבְצַחוּתָא וּבְעַרְטִלְיָתָא וּבַחֲסִירוּת כֹּלָּא וְיִתֵּן נִיר פַּרְזְלָא עַל צַוְּארָךְ עַד דִּישֵׁיצֵי יָתָךְ:", "onk_en": "You will serve your enemies whom Adonoy sends [<b>will set<\/b>] against you, in hunger and in thirst and in nakedness and lacking everything; and he will set an iron yoke upon your neck until he destroys you.", "pj": "וְתִפְלְחוּן יַת בַּעֲלֵי דְבָבֵיכוֹן דִיגָרִינוּן מֵימְרָא דַיְיָ בְּכוֹן בְּכַפְנָא וּבְצָחוּתָא וּבְעַרְטִלְיוּתָא וּבְחוּסְרַן כָּל טַבְתָּא וְיִשְׁווֹן נִירֵי פַּרְזְלָא עַל צַוָורֵיכוֹן עַד זְמַן דִישֵׁיצֵי יַתְכוֹן", "pj_en": "But you will serve your enemies whom the Word of the Lord will send against you, in hunger, thirst, nakedness, and the want of every good; and they will put an iron yoke upon your necks until it hath worn you away.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 49, "aliyah": 6, "heb": "יִשָּׂ֣א יְהֹוָה֩ עָלֶ֨יךָ גּ֤וֹי מֵֽרָחֹק֙ מִקְצֵ֣ה הָאָ֔רֶץ כַּאֲשֶׁ֥ר יִדְאֶ֖ה הַנָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא־תִשְׁמַ֖ע לְשֹׁנֽוֹ׃", "onk": "יַיְתִי יְיָ עֲלָךְ עַם מֵרָחִיק מִסְּיָפֵי אַרְעָא כְּמָא דִי מִשְׁתְּדִי נִשְׁרָא עַמָּא דִּי לָא תִשְׁמַע לִישָׁנֵיהּ:", "onk_en": "Adonoy will raise upon you a nation from afar from the end of the earth, as the eagle soars, a nation whose language you will not hear.", "pj": "יְטַיֵיס מֵימְרָא דַיְיָ עֲלֵיכוֹן אוּמָא מִן רָחִיק מִן סְיָפֵי אַרְעָא קְלִילִין כְּמָא דְטַיֵיס גִישְׁרָא אוּמָא דְלָא תִשְׁמַע לִישְׁנֵיהּ", "pj_en": "The Word of the Lord will cause a people to fly upon you from afar, from the ends of the earth, swift as an eagle flieth; a people whose language thou wilt not understand;", "tj": "", "tj_en": "", "rashi": "<b>כאשר ידאה הנשר.<\/b> פִּתְאֹם וְדַרְכּוֹ מַצְלַחַת וְיֵקַלּוּ סוּסָיו:<br><br><b>לא תשמע לשנו.<\/b> לֹא תַכִּיר לְשׁוֹנוֹ, וְכֵן \"תִּשְׁמַע חֲלוֹם לִפְתֹּר אֹתוֹ\" (בראשית מ\"א), וְכֵן \"כִּי שֹׁמֵעַ יוֹסֵף\" (שם מ\"ב), אינטינד\"רי:", "rashi_en": "כאשר ידאה הנשר [THE LORD WILL BRING A NATION AGAINST YOU FROM AFAR], AS THE EAGLE SWOOPS DOWN — i.e. suddenly, and by a successful march, and its horses will be swift.<br><br>לא תשמע לשנו means, a nation whose tongue thou shalt not understand. Similar is, (Genesis 41:15) “You understand (תשמע) a dream to interpret it”, and so, too, (Genesis 42:23) “that Joseph understood (שמע)”; entendre in old French "}, {"ch": 28, "v": 50, "aliyah": 6, "heb": "גּ֖וֹי עַ֣ז פָּנִ֑ים אֲשֶׁ֨ר לֹא־יִשָּׂ֤א פָנִים֙ לְזָקֵ֔ן וְנַ֖עַר לֹ֥א יָחֹֽן׃", "onk": "עַם תַּקִּיף אַפִּין דִּי לָא יִסַּב אַפִּין לְסָבָא וְעַל יָנְקָא לָא מְרַחֵם:", "onk_en": "A hard-faced nation that will not show favor to the old, and will not pity the young.", "pj": "אוּמָא חֲצוּפֵי אַפִּין דְלָא נְסִיב אַפִּין לְסָבָא וְעַל עוּלֵים לָא חַיִיס", "pj_en": "a people hard in visage, who will not respect the old nor have pity on the young.", "tj": "אוּמָה חֲצִיפַת אַפִּין דִי לָא נְסַב אַפָּא לְסַב וְעַל טַלְיָא לָא חַיְיסָא:", "tj_en": "A people hard in visage, who will not respect the aged nor have mercy on the children.", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 51, "aliyah": 6, "heb": "וְ֠אָכַ֠ל פְּרִ֨י בְהֶמְתְּךָ֥ וּפְרִֽי־אַדְמָתְךָ֮ עַ֣ד הִשָּׁמְדָךְ֒ אֲשֶׁ֨ר לֹא־יַשְׁאִ֜יר לְךָ֗ דָּגָן֙ תִּיר֣וֹשׁ וְיִצְהָ֔ר שְׁגַ֥ר אֲלָפֶ֖יךָ וְעַשְׁתְּרֹ֣ת צֹאנֶ֑ךָ עַ֥ד הַאֲבִיד֖וֹ אֹתָֽךְ׃", "onk": "וְיֵיכוּל <b>וַלְדָּא<\/b> דִבְעִירָךְ <b>וְאִבָּא<\/b> דְאַרְעָךְ עַד דְּתִשְׁתֵּצֵי דִּי לָא יַשְׁאַר לָךְ עִבוּרָא חַמְרָא וּמִשְׁחָא בַּקְרֵי תוֹרָיךְ וְעֶדְרֵי עָנָךְ עַד דְּיוֹבֵד יָתָךְ:", "onk_en": "They will consume the offspring of your animals, and the produce [<b>fruit<\/b>] of your soil until you are destroyed; that will not leave you grain, wine, or oil, the calves of your cattle, or the flocks of your sheep and goats until they have you removed.", "pj": "וְיִגְמְרוּן וַולְדֵי דִבְעִרֵיכוֹן וּפֵירֵי אַרְעֲכוֹן עַד דְתִשְׁתֵּיצוּן דְלָא יְשַׁיְירוּן לְכוֹן עִבּוּר מְשַׁח וַחֲמַר בַּקְרֵי תוֹרֵיכוֹן וְעֶדְרֵי עָנֵיכוֹן עַד זְמַן דִי יְהוֹבְדוּן יַתְכוֹן", "pj_en": "And they will consume the increase of your cattle and the fruit of your ground till you are wasted away; for they will leave you neither corn, oil, wine, herds, nor flocks, until the time that they have destroyed you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 52, "aliyah": 6, "heb": "וְהֵצַ֨ר לְךָ֜ בְּכׇל־שְׁעָרֶ֗יךָ עַ֣ד רֶ֤דֶת חֹמֹתֶ֙יךָ֙ הַגְּבֹהֹ֣ת וְהַבְּצֻר֔וֹת אֲשֶׁ֥ר אַתָּ֛ה בֹּטֵ֥חַ בָּהֵ֖ן בְּכׇל־אַרְצֶ֑ךָ וְהֵצַ֤ר לְךָ֙ בְּכׇל־שְׁעָרֶ֔יךָ בְּכׇ֨ל־אַרְצְךָ֔ אֲשֶׁ֥ר נָתַ֛ן יְהֹוָ֥ה אֱלֹהֶ֖יךָ לָֽךְ׃", "onk": "וְיָעֵק לָךְ בְּכָל קִרְוָיךְ עַד <b>דְּיִכְבַּשׁ<\/b> שׁוּרָיךְ רָמַיָּא וּכְרִיכַיָּא דִּי אַתְּ רָחֵץ <b>לְאִשְׁתֵּזָבָא<\/b> בְּהֵן בְּכָל אַרְעָךְ וְיָעֵק לָךְ בְּכָל קִרְוָיךְ בְּכָל אַרְעָךְ דִּי יְהַב יְיָ אֱלָהָךְ לָךְ:", "onk_en": "They will make you suffer in all your cities until mastering [<b>capturing<\/b>] your ramparts and fortified walls upon which you rely [<b>to be saved<\/b>] throughout your land; they will make you suffer in all your cities throughout your land that Adonoy, your God, has given you.", "pj": "וְיָעִיקוּן לְכוֹן בְּכָל קִירְוֵיכוֹן עַד זְמַן דִי יֵחְתוּן אֲכוֹלֵיכוֹן רָמַיָא וְתָלִילַיָא דְאַתּוּן רְחִיצִין בְּהוֹן לְאִשְׁתֵּיזְבָא בְּהוֹן בְּכָל אַרְעֲכוֹן וְיָעִיקוּן לְכוֹן בְּכָל קִירְוֵיכוֹן בְּכָל אַרְעֲכוֹן דִיהַב יְיָ אֱלָהָכוֹן לְכוֹן", "pj_en": "And they will shut you up in your cities until they have demolished your high walls whereby you trusted to be saved in all your land; for they shall besiege you in all your cities, in the whole land which the Lord your God gave you.", "tj": "", "tj_en": "", "rashi": "<b>עד רדת חמתיך.<\/b> לְשׁוֹן רִדּוּי וְכִבּוּשׁ:", "rashi_en": "עד רדת חמתיך — The word רדת means subjugation (רדוי) and conquest (cf. Rashi on Deuteronomy 20:20)."}, {"ch": 28, "v": 53, "aliyah": 6, "heb": "וְאָכַלְתָּ֣ פְרִֽי־בִטְנְךָ֗ בְּשַׂ֤ר בָּנֶ֙יךָ֙ וּבְנֹתֶ֔יךָ אֲשֶׁ֥ר נָתַן־לְךָ֖ יְהֹוָ֣ה אֱלֹהֶ֑יךָ בְּמָצוֹר֙ וּבְמָצ֔וֹק אֲשֶׁר־יָצִ֥יק לְךָ֖ אֹיְבֶֽךָ׃", "onk": "וְתֵיכוּל <b>וַלְדָּא<\/b> דִמְעָךְ בְּשַׂר בְּנָיךְ וּבְנָתָיךְ דִּי יְהַב לָךְ יְיָ אֱלָהָךְ בִּצְיָרָא וּבְעַקְתָא דְּיָעֵק לָךְ סָנְאָךְ:", "onk_en": "You will eat the flesh [<b>offspring<\/b>] of your womb, the flesh of your sons and your daughters that Adonoy, your God, gave you; in the siege and in the distress that your enemy will distress you.", "pj": "וְיִגְמְרוּן וַולְדֵי מְעֵיכוֹן דְתֵיכְלוּנוּן בְּכַפְנָא בְּשַר בְּנֵיכוֹן וּבְנָתֵיכוֹן דִיהַב יְיָ אֱלָהָכוֹן לְכוֹן בְּצַעֲרוּ וּבְעָקָא דִיעִיקוּן לְכוֹן סַנְאֵיכוֹן", "pj_en": "And the children of your wombs shall be consumed; for you will eat them in the famine, even the flesh of your sons and daughters, whom the Lord your God did give you, by reason of the anguish and oppression wherewith your enemies shall oppress you.", "tj": "", "tj_en": "", "rashi": "<b>ואכלת … בשר בניך … במצור.<\/b> מֵחֲמַת שֶׁיִּהְיוּ צָרִים עַל הָעִיר וְיִהְיֶה שָׁם מָצוֹק, עֲקַת רְעָבוֹן:", "rashi_en": "ואכלת … בשר בניך … במצור AND THOU SHALT EAT … THE FLESH OF THY SONS … IN THE SIEGE, [AND IN THE DISTRESS] — Because they (the enemies) will besiege the city and there will consequently be distress— i.e. the stress of famine."}, {"ch": 28, "v": 54, "aliyah": 6, "heb": "הָאִישׁ֙ הָרַ֣ךְ בְּךָ֔ וְהֶעָנֹ֖ג מְאֹ֑ד תֵּרַ֨ע עֵינ֤וֹ בְאָחִיו֙ וּבְאֵ֣שֶׁת חֵיק֔וֹ וּבְיֶ֥תֶר בָּנָ֖יו אֲשֶׁ֥ר יוֹתִֽיר׃", "onk": "גַּבְרָא דְרַכִּיךְ בָּךְ וְדִמְפַנַּק לַחֲדָא תִּבְאֵשׁ עֵינֵיהּ בְּאָחוּהִי וּבְאִתַּת <b>קְיָמֵיהּ<\/b> וּבִשְׁאָר בְּנוֹהִי דִּי יַשְׁאַר:", "onk_en": "The delicate among you and the fastidious, [even] he will look askance at his brother and at the wife of his bosom [<b>covenant<\/b>] and at the rest of his sons whom he will leave over.", "pj": "גַבְרָא דְמֶחְטֵי בְּכוֹן וְדִימְפַרְנֵק לַחֲדָא תַּבְאֵשׁ עַיְינֵיהּ בְּאָחוֹי וּבְאִתְּתָא דְדָמְכָה בְּעוֹבֵיהּ וּבְשָׁיֵיר בְּנוֹי דִישַׁיֵיר", "pj_en": "The man who is gentle and refined among you will look with evil eyes upon his brother, and the wife who reposeth on his bosom, and upon the rest of his children who remain.", "tj": "גַבְרָא דְמֶחֱטֵי בְּכוֹן וְדִימְפַנַק לַחֲדָא תִּבְעַשׁ עֵינוֹי בְּאָחוֹי וּבְאִתַּת טַלְיוּתֵיהּ וּבְמוֹתְרֵי בְּנוֹי דְיוֹתִיר:", "tj_en": "The man who is gentle and most tender among you will look with evil eyes upon his brother, and on the wife of his youth, and on the rest of his children who remain.", "rashi": "<b>הרך בך והענג.<\/b> הוּא הָרַךְ הוּא הֶעָנֹג — לְשׁוֹן פִּנּוּק, וּמֵהִתְעַנֵּג וּמֵרֹךְ מוֹכִיחַ עֲלֵיהֶם שֶׁשְּׁנֵיהֶם אֶחָד; אַעַ\"פִּ שֶׁהוּא מְפֻנָּק וְדַעְתּוֹ קָצָה בְּדָבָר מָאוּס, יִמְתַּק לוֹ לְרַעֲבוֹנוֹ בְּשַׂר בָּנָיו וּבְנוֹתָיו, עַד כִּי <b>תרע עינו<\/b> בְּבָנָיו הַנּוֹתָרִים <b>מתת לאחד מהם מבשר בניו<\/b> אֲחֵיהֶם <b>אשר יאכל.<\/b> דָּ\"אַ — <b>הרך בך<\/b>, הָרַחֲמָנִי וְרַךְ הַלֵּבָב מֵרֹב רַעֲבָנוּת יִתְאַכְזְרוּ וְלֹא יִתְּנוּ מִבְּשַׂר בְּנֵיהֶם הַשְּׁחוּטִים לִבְנֵיהֶם הַנּוֹתָרִים:", "rashi_en": "הרך בך והענג THE MOST TENDER AMONG YOU AND THE DELICATE — רך and ענג are one and the same person; the words denote delicate living. The expressions in v. 56 ומהתענג ומרך prove regarding them that both of them (the two descriptive terms) refer to one person. The meaning of the verse is: Although he may be fastidious and his nature sickens at anything nauseous, yet the flesh of his sons and daughters will be so pleasant to him on account of his hunger, that תרע עינו HIS EYE WILL BE EVIL towards his remaining children, מתת לאחד מהם מבשר בניו THAT HE WILL NOT GIVE TO ANY OF THEM THE FLESH OF HIS CHILDREN — their brothers, אשר יאכל WHOM HE WILL EAT.  — Another explanation of הרך בך is: the merciful and tender-hearted will become cruel because of the great hunger and will not give of the flesh of their children who have been killed to their remaining children."}, {"ch": 28, "v": 55, "aliyah": 6, "heb": "מִתֵּ֣ת&thinsp;<b>׀<\/b> לְאַחַ֣ד מֵהֶ֗ם מִבְּשַׂ֤ר בָּנָיו֙ אֲשֶׁ֣ר יֹאכֵ֔ל מִבְּלִ֥י הִשְׁאִֽיר־ל֖וֹ כֹּ֑ל בְּמָצוֹר֙ וּבְמָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְךָ֛ אֹיִבְךָ֖ בְּכׇל־שְׁעָרֶֽיךָ׃", "onk": "מִלְּמִתַּן לְחַד מִנְּהוֹן מִבְּשַׂר בְּנוֹהִי דִּי יֵיכוּל מִדְּלָא אִשְׁתָּאַר לֵיהּ כֹּלָּא בִּצְיָרָא וּבְעַקְתָא דִּי יָעֵק לָךְ סָנְאָךְ בְּכָל קִרְוָיךְ:", "onk_en": "From giving to any of them of the flesh of his sons that he is eating for [fear of] not leaving everything for himself; in siege and in distress that your enemy will distress you in all your cities.", "pj": "מִן לָא לְמִתַּן לְחַד מִנְהוֹן מִבְּשַר בְּנוֹי דִי יֵיכוּל מִן דְלָא אִשְׁתְּיַיר לֵיהּ מִדַעַם בְּצַעֲרוֹי וּבְעָקָא דִי יְעָקוּן לְכוֹן סַנְאֵיכוֹן בְּכָל קִירְוֵיכוֹן", "pj_en": "He will not give to one of them of the flesh of his children which he eateth, because nothing remaineth to him in the anguish and straitness with which I will straiten you in all your cities.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 56, "aliyah": 6, "heb": "הָרַכָּ֨ה בְךָ֜ וְהָעֲנֻגָּ֗ה אֲשֶׁ֨ר לֹֽא־נִסְּתָ֤ה כַף־רַגְלָהּ֙ הַצֵּ֣ג עַל־הָאָ֔רֶץ מֵהִתְעַנֵּ֖ג וּמֵרֹ֑ךְ תֵּרַ֤ע עֵינָהּ֙ בְּאִ֣ישׁ חֵיקָ֔הּ וּבִבְנָ֖הּ וּבְבִתָּֽהּ׃", "onk": "דְּרַכִּיכָא בָךְ וְדִמְפַנְּקָא דִּי לָא נַסִּיאַת פַּרְסַת רַגְלַהּ <b>לַאֲחָתָא<\/b> עַל אַרְעָא מִמְּפַנְּקוּ וּמֵרַכִּיכוּ תַּבְאֵשׁ עֵינַהּ בִּגְבַר <b>קְיָמַהּ<\/b> וּבִבְרַהּ וּבִבְרַתַּהּ:", "onk_en": "The soft female among you and the indulged one the sole of whose foot never experienced standing [<b>putting her foot<\/b>] on the ground out of indulgence and out of softness; her eye will begrudge the husband of her bosom [<b>covenant<\/b>], and her son and daughter.", "pj": "דִמְחַטַיְיתָא בְכוֹן וּדְמִפְרַנְקָא דְלָא נַסְיַית פַּרְסַת רִיגְלָהּ לְמִדְרַס עַל אַרְעָא מִן פַּרִינְקָא וּמִן חִיטוֹיָא תִּבְאַשׁ עֵינָהּ בִּבְעֵיל דְדָמִיךְ בְּעוֹבָהּ וּבִבְרָהּ וּבִבְרַתָּהּ", "pj_en": "She who is delicate and luxurious among you, who hath not ventured to put the sole of her foot upon the ground from tenderness and delicacy, will look with evil eyes upon the husband of her bosom, upon her son and her daughter,", "tj": "דְמַחֲטַיָא בְּכוֹן וְדִמְפַנְקָא דִי לָא נַסְיַת כַּף רִיגְלָהּ לְמֵיטַלְיָא עַל אַרְעָא מִן פַּרְקִינָא וּמִן חֲטִיתָא תַּבְעַשׁ עַיְינָהּ בְּבַעַל טַלְיוּתָא וּבִבְרָהּ וּבִבְרַתָּהּ:", "tj_en": "She who is tender and delicate among you, who hath not attempted to walk with her feet upon the ground from delicacy and tenderness, will look with evil eyes on the husband of her youth, and on her son and her daughter.", "rashi": "<b>תרע עינה באיש חיקה ובבנה ובבתה.<\/b> הַגְּדוֹלִים:", "rashi_en": "תרע עינה באיש חיקה ובבנה ובבתה HER EYE SHALL BE EVIL TOWARDS THE HUSBAND OF HER BOSOM, AND TOWARDS HER SON, AND TOWARDS HER DAUGHTER — i.e. the adult sons and daughters,"}, {"ch": 28, "v": 57, "aliyah": 6, "heb": "וּֽבְשִׁלְיָתָ֞הּ הַיּוֹצֵ֣ת&thinsp;<b>׀<\/b> מִבֵּ֣ין רַגְלֶ֗יהָ וּבְבָנֶ֙יהָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי־תֹאכְלֵ֥ם בְּחֹסֶר־כֹּ֖ל בַּסָּ֑תֶר בְּמָצוֹר֙ וּבְמָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְךָ֛ אֹיִבְךָ֖ בִּשְׁעָרֶֽיךָ׃", "onk": "<b>וּבִזְעֵר בְּנָהָא<\/b> דְּיִפְּקוּן <b>מִנַּהּ<\/b> וּבִבְנָהָא דִּי תְלִיד אֲרֵי תֵיכְלִנּוּן בַּחֲסִירוּת כֹּלָּא בְּסִתְרָא בִּצְיָרָא וּבְעַקְתָא דִּי יָעֵק לָךְ סָנְאָךְ בְּקִרְוָיךְ:", "onk_en": "And her infant [<b>little children<\/b>] who emerges from between her legs [<b>from her<\/b>], and her children whom she bears, when she eats them for lack of everything, secretly; in siege and in distress that your enemy will distress you in your cities.", "pj": "וּבִשְׁפִיר שִׁלְיְתָא דְתִיפּוֹק מִבֵּית תּוֹרְפָהּ בְּעִידָן מוֹלְדָהּ וּבִבְנָהּ דְתוֹלִיד אֲרוּם תֵּיכְלוּנוּן בְּחוֹסְרַן כָּל מִדַעַם בְּטוּמְרָא בְּצַעֲרוּ וּבְעָקָא דִי יְעִיקוּן לְכוֹן סַנְאֵיכוֹן בְּקִירְוֵיכוֹן", "pj_en": "and the offspring she hath borne; for she will eat them in secret, through the want of all things, by reason of the anguish and oppression with which your enemies shall oppress you in your cities.", "tj": "", "tj_en": "", "rashi": "<b>ובשליתה.<\/b> בָּנֶיהָ הַקְּטַנִּים — בְּכֻלָּן תְּהֵא עֵינָהּ צָרָה כְּשֶׁתֹּאכַל אֶת הָאֶחָד מִלִּתֵּן לַאֲשֶׁר אֶצְלָהּ מִן הַבָּשָׂר:", "rashi_en": "ובשליתה AND TOWARDS HER שליה — i.e. towards her little children; towards all these will her eye be evil when she eats one of them so that she will not give of the flesh to those that are still with her (to those that are still living)."}, {"ch": 28, "v": 58, "aliyah": 6, "heb": "אִם־לֹ֨א תִשְׁמֹ֜ר לַעֲשׂ֗וֹת אֶת־כׇּל־דִּבְרֵי֙ הַתּוֹרָ֣ה הַזֹּ֔את הַכְּתֻבִ֖ים בַּסֵּ֣פֶר הַזֶּ֑ה לְ֠יִרְאָ֠ה אֶת־הַשֵּׁ֞ם הַנִּכְבָּ֤ד וְהַנּוֹרָא֙ הַזֶּ֔ה אֵ֖ת יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "אִם לָא תִטַּר לְמֶעְבַּד יָת כָּל פִּתְגָּמֵי אוֹרַיְתָא הָדָא דִּכְתִיבִין בְּסִפְרָא הָדֵין לְמִדְחַל יָת שְׁמָא יַקִּירָא וּדְחִילָא הָדֵין יָת יְיָ אֱלָהָךְ:", "onk_en": "If you will not guard to perform all the statements of this Torah that are written in this book to fear the respected and awesome Name, of Adonoy, your God.", "pj": "אִין לָא תִנְטְרוּן לְמֶעֱבַד יַת כָּל פִּקוּדַיָיא דְאוֹרַיְיתָא הָדָא דִכְתִיבִין בְּסִפְרָא הָדֵין לְמִדְחַל יַת שְׁמָא יַקִירָא וּדְחִילָא הָדֵין יַת יְיָ אֱלָהָכוֹן", "pj_en": "If you observe not to perform all the commands of this law written in this book, to reverence this glorious and fearful Name, The Lord your God,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 59, "aliyah": 6, "heb": "וְהִפְלָ֤א יְהֹוָה֙ אֶת־מַכֹּ֣תְךָ֔ וְאֵ֖ת מַכּ֣וֹת זַרְעֶ֑ךָ מַכּ֤וֹת גְּדֹלֹת֙ וְנֶ֣אֱמָנ֔וֹת וׇחֳלָיִ֖ם רָעִ֥ים וְנֶאֱמָנִֽים׃", "onk": "וְיַפְרַשׁ יְיָ יָת מָחָתָךְ וְיָת מָחַת בְּנָיךְ מָחָן רַבְרְבָן וּמְהֵימְנָן וּמַכְתְּשִׁין בִּישִׁין וּמְהֵימְנִין:", "onk_en": "Adonoy will strike you with prodigous blows and blows on your offspring, blows, great and dependable and illnesses harmful and dependable.", "pj": "וִיכַסֵי מֵימְרָא דַיְיָ מִנְכוֹן רוּחַ קוּדְשָׁא כַּד יֵיתוּן מַחְתִין עֲלֵיכוֹן וּמַחְתִין עַל בְּנֵיכוֹן מַחַן רַבְרְבִין וּמְהֵימְנָן דְלָא לְמִשְׁבַּקְכוֹן וּמַרְעִין בִּישִׁין וּמְהֵימְנִין דְמִתְעַתְּקִין עַל גוּשְׁמֵיכוֹן", "pj_en": "the Word of the Lord will hide the Holy Spirit from you, when the plagues come upon you and your children, great and continuous plagues which will not leave you, and grievous and continual evils that will grow old upon your bodies;", "tj": "", "tj_en": "", "rashi": "<b>והפלא ה' את מכתך.<\/b> מֻפְלָאוֹת וּמֻבְדָּלוֹת מִשְּׁאָר מַכּוֹת:<br><br><b>ונאמנות.<\/b> לְיַסֶּרְךָ, לְקַיֵּם שְׁלִיחוּתָן:", "rashi_en": "והפלא ה' את מכתך THEN THE LORD WILL DISTINGUISH THY PLAGUES — He will afflict you with plagues exceptional and quite different from other plagues.<br><br>ונאמנות (lit., trustworthy, reliable), i.e. certain to chastise you — certain to perform the task entrusted to them."}, {"ch": 28, "v": 60, "aliyah": 6, "heb": "וְהֵשִׁ֣יב בְּךָ֗ אֵ֚ת כׇּל־מַדְוֵ֣ה מִצְרַ֔יִם אֲשֶׁ֥ר יָגֹ֖רְתָּ מִפְּנֵיהֶ֑ם וְדָבְק֖וּ בָּֽךְ׃", "onk": "וְיָתֵב בָּךְ יָת כָּל מַכְתְּשֵׁי מִצְרַיִם דִּי דְחֶלְתָּא מִקֳּדָמֵיהוֹן וְיִדְבְּקוּן בָּךְ:", "onk_en": "He will bring back for you all the Egyptian diseases which you dreaded and they will cling to you.", "pj": "וִיתִיב בְּכוֹן יַת כָּל אַרְעַיָא דְאִתְגְרִייוּ בְּמִצְרָאֵי דִדְחִילַת מִן קֳדָמֵיהוֹן וְיִתְאַדְקוּן בְּכוֹן", "pj_en": "and will turn upon you all the woes which were sent upon the Mizraee before which thou wast afraid, and they shall cleave to you;", "tj": "", "tj_en": "", "rashi": "<b>אשר יגרת מפניהם.<\/b> מִפְּנֵי הַמַּכּוֹת. כְּשֶׁהָיוּ יִשְׂרָאֵל רוֹאִין מַכּוֹת מְשֻׁנּוֹת הַבָּאוֹת עַל מִצְרַיִם, הָיוּ יְרֵאִים מֵהֶם שֶׁלֹּא יָבֹאוּ גַּם עֲלֵיהֶם. תֵּדַע שֶׁכֵּן כָּתוּב \"אִם שָׁמוֹעַ תִּשְׁמַע וְגוֹ' כָּל הַמַּחֲלָה אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם לֹא אָשִׂים עָלֶיךָ\" (שמות ט\"ו) — אֵין מְיָרְאִין אֶת הָאָדָם אֶלָּא בְּדָבָר שֶׁהוּא יָגוֹר מִמֶּנּוּ:", "rashi_en": "אשר יגרת מפניהם [HE WILL BRING UPON THEE ALL THE DISEASES OF EGYPT] OF WHICH THOU ART AFRAID — i.e. afraid of the plagues (not of Egypt). When the Israelites saw the strange plagues that came upon the Egyptians they were afraid of them — that they might not befall them also. You may know this, for so it states, (Exodus 15:26) “If thou wilt indeed hearken [to the voice of the Lord …], none of the diseases which I have put upon Egypt, will I put on you”, since one threatens a person only with things of which he is afraid."}, {"ch": 28, "v": 61, "aliyah": 6, "heb": "גַּ֤ם כׇּל־חֳלִי֙ וְכׇל־מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּסֵ֖פֶר הַתּוֹרָ֣ה הַזֹּ֑את יַעְלֵ֤ם יְהֹוָה֙ עָלֶ֔יךָ עַ֖ד הִשָּׁמְדָֽךְ׃", "onk": "אַף כָּל מְרַע וְכָל מָחָא דִּי לָא כְתִיבִין בְּסִפְרָא דְאוֹרַיְתָא הָדָא יַיְתִנּוּן יְיָ עֲלָךְ עַד דְּיִשְׁתֵּצָךְ:", "onk_en": "Also every illness and every plague that is not written in the book of this Torah, will Adonoy raise up against you until you are destroyed.", "pj": "לְחוֹד כָּל מְרָא וְכָל מְחָא דְלָא כְּתִיבִין בְּסֵפֶר אוֹרַיְיתָא הָדֵין יַסְקִינוּן מֵימְרָא דַיְיָ עֲלֵיכוֹן עַד דְתִשְׁתֵּיצוּן", "pj_en": "and evils also that are not written in the book of this law will the Word of the Lord stir up against you until you are consumed.", "tj": "", "tj_en": "", "rashi": "<b>יעלם.<\/b> לְשׁוֹן עֲלִיָּה:", "rashi_en": "יעלם is a form from the root עלה (not from עלם)."}, {"ch": 28, "v": 62, "aliyah": 6, "heb": "וְנִשְׁאַרְתֶּם֙ בִּמְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּכוֹכְבֵ֥י הַשָּׁמַ֖יִם לָרֹ֑ב כִּֽי־לֹ֣א שָׁמַ֔עְתָּ בְּק֖וֹל יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וְתִשְׁתַּאֲרוּן <b>בְּעַם זְעֵר<\/b> חֳלָף דִּי הֲוֵיתוּן כְּכוֹכְבֵי שְׁמַיָּא לְמִסְגֵּי אֲרֵי לָא <b>קַבֶּלְתָּא לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ:", "onk_en": "You will remain numerically few [<b>a small nation<\/b>] instead of your having been like the stars in the sky, multitudinous; for you have not obeyed [<b>accepted the word of<\/b>] Adonoy, your God.", "pj": "וְתִשְׁתַּיְירוּן בְּאוּמָה קַלִילָא חוֹלַף דִי הֲוֵיתוּן הֵי כְכוֹכְבֵי שְׁמַיָא לְסוֹגֵי אֲרוּם לָא קַבֵּילְתּוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן", "pj_en": "And you who were as the stars of heaven for multitude will be left a few people, because you hearkened not to the Word of the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>ונשארתם במתי מעט תחת וגו'.<\/b> מֻעָטִין חֵלֶף מְרֻבִּים:", "rashi_en": "ונשארתם במתי מעט תחת וגו׳ AND YOU SHALL REMAIN FEW IN NUMBER WHEREAS [YOU WERE ONCE AS NUMEROUS AS THE STARS OF HEAVEN] — i.e. a few instead of many."}, {"ch": 28, "v": 63, "aliyah": 6, "heb": "וְ֠הָיָ֠ה כַּאֲשֶׁר־שָׂ֨שׂ יְהֹוָ֜ה עֲלֵיכֶ֗ם לְהֵיטִ֣יב אֶתְכֶם֮ וּלְהַרְבּ֣וֹת אֶתְכֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהֹוָה֙ עֲלֵיכֶ֔ם לְהַאֲבִ֥יד אֶתְכֶ֖ם וּלְהַשְׁמִ֣יד אֶתְכֶ֑ם וְנִסַּחְתֶּם֙ מֵעַ֣ל הָאֲדָמָ֔ה אֲשֶׁר־אַתָּ֥ה בָא־שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "וִיהֵי כְּמָא דִחַדֵּי יְיָ עֲלֵיכוֹן לְאוֹטָבָא יָתְכוֹן וּלְאַסְגָּאָה יָתְכוֹן כֵּן יֶחֱדֵי יְיָ עֲלֵיכוֹן לְאוֹבָדָא יָתְכוֹן וּלְשֵׁצָאָה יָתְכוֹן <b>וְתִטַּלְטְלוּן<\/b> מֵעַל אַרְעָא דִּאַתְּ עָלֵל לְתַמָּן לְמֵירְתַהּ:", "onk_en": "It will happen that as Adonoy rejoiced over you to benefit you and to multiply you, so will Adonoy bring joy to others over you to remove you and to destroy you; and you will be uprooted [<b>carried away<\/b>] from upon the land that you are coming there to inherit.", "pj": "וִיהֵי הֵיכְמָא דְחָדֵי מֵימְרָא דַיְיָ עֲלֵיכוֹן לְאוֹטָבוּתְכוֹן וּלְאַסְגָאָה יַתְכוֹן הֵיכְדֵין יֶחְדֵי מֵימְרָא דַיְיָ עֲלֵיכוֹן עַמְמִין נוּכְרָאִין לְהוֹבְדָא יַתְכוֹן וּלְמֵשַׁצְיָא יַתְכוֹן וְתִיתְעַקְרוּן מֵעִילַוֵי אַרְעָא דְאַתּוּן עַלְלִין לְתַמָן לְמֵירְתָהּ", "pj_en": "And as the Word of the Lord rejoiced over you to do you good, and to multiply you, so will He rejoice (in sending) against you strange nations to destroy and make you desolate, and you shall be uprooted from the land which you are going to possess.", "tj": "", "tj_en": "", "rashi": "<b>כן ישיש ה'.<\/b> אֶת אוֹיְבֵיכֶם <b>עליכם להאביד וגו'<\/b>:<br><br><b>ונסחתם.<\/b> לְשׁוֹן עֲקִירָה וְכֵן (משלי ט\"ו) \"בֵּית גֵּאִים יִסַּח ה'\":", "rashi_en": "'כן ישיש ה SO WILL THE LORD MAKE your enemies REJOICE עליכם OVER YOU, להאביד וגו׳ TO DESTROY [YOU] (Megillah 10b).<br><br>ונסחתם is an expression denoting “uprooting”. Similar is, (Proverbs 15:25) “The Lord will uproot (יסח) the house of the haughty”."}, {"ch": 28, "v": 64, "aliyah": 6, "heb": "וֶהֱפִֽיצְךָ֤ יְהֹוָה֙ בְּכׇל־הָ֣עַמִּ֔ים מִקְצֵ֥ה הָאָ֖רֶץ וְעַד־קְצֵ֣ה הָאָ֑רֶץ וְעָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא־יָדַ֛עְתָּ אַתָּ֥ה וַאֲבֹתֶ֖יךָ עֵ֥ץ וָאָֽבֶן׃", "onk": "וִיבַדְּרִנָּךְ יְיָ בְּכָל עַמְמַיָּא מִסְּיָפֵי אַרְעָא וְעַד סְיָפֵי אַרְעָא וְתִפְלַח תַּמָּן <b>לְעַמְמַיָּא פָּלְחֵי טַעֲוָתָא<\/b> דִּי לָא יְדַעְתָּ אַתְּ וַאֲבָהָתָךְ אָעָא וְאַבְנָא:", "onk_en": "Adonoy will disperse you among all the peoples from the end of the earth to the end of the earth; and you shall serve there [<b>nations who serve<\/b>] other gods [<b>idols<\/b>] which neither you nor your ancestors knew, wood and stone.", "pj": "וִיבַדְרְכוֹן יְיָ בֵּינֵי כָּל עַמְמַיָא מִסְיָיפֵי אַרְעָא וְעַד סְיָיפֵי אַרְעָא וְתֶהֱווֹן מְסַק אַרְנוֹנָא לְפַלְחֵי טַעֲוָותָא דְלָא יְדַעְתּוּן אַתְּ וְאַבְהָתָךְ דְמִן קִיסִין וְאַבְנִין", "pj_en": "And the Lord will disperse you among all nations, from one end of the earth to the other, and you shall be tributaries to the worshippers of idols of wood and stone which neither thou nor thy fathers have known.", "tj": "", "tj_en": "", "rashi": "<b>ועבדתם שם אלהים אחרים.<\/b> כְּתַרְגּוּמוֹ — לֹא עֲבוֹדַת אֱלֹהוּת מַמָּשׁ אֶלָּא מַעֲלִים מַס וְגֻלְגֹּלִיּוֹת לְכוּמְרֵי עֲ\"זָ:", "rashi_en": "ועבדתם שם אלהים אחרים AND YE WILL SERVE THERE OTHER GODS — Understand this as the Targum does: (ye will serve the peoples that worship idols); not actually that they shall serve idols, but they will
