<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פרשת עקב</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "eikev";
const DATA = [{"ch": 7, "v": 12, "aliyah": 1, "heb": "וְהָיָ֣ה&thinsp;<b>׀<\/b> עֵ֣קֶב תִּשְׁמְע֗וּן אֵ֤ת הַמִּשְׁפָּטִים֙ הָאֵ֔לֶּה וּשְׁמַרְתֶּ֥ם וַעֲשִׂיתֶ֖ם אֹתָ֑ם וְשָׁמַר֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ לְךָ֗ אֶֽת־הַבְּרִית֙ וְאֶת־הַחֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַאֲבֹתֶֽיךָ׃", "onk": "וִיהֵי <b>חֳלַף<\/b> דִּי תְקַבְּלוּן יָת דִּינַיָּא הָאִלֵּין וְתִטְּרוּן וְתַעְבְּדוּן יָתְהוֹן וְיִטַּר יְיָ אֱלָהָךְ לָךְ יָת קְיָמָא וְיָת חִסְדָּא דִּי קַיִּים לַאֲבָהָתָךְ:", "onk_en": "In the future, as a consequence of [<b>in exchange for<\/b>] your heeding these laws, and your guarding and fulfilling them; Adonoy, your God, will guard for you the covenant and the kindliness that He swore to your forefathers.", "pj": "והיה עקב וִיהֵי חוֹלַף דִּי תְקַבְּלוּן יַת דִּינַיָא הָאִילֵין וְתִנְטְרוּן וְתַעַבְדוּן יַתְהוֹן וְיִנְטַר יְיָ אֱלָהָכוֹן לְכוֹן יַת קְיָימַיָא וְיַת חִסְדָא דִי קַיֵּים לְאַבְהַתְכוֹן", "pj_en": "If you receive these judgments, and observe and perform them, then will the Lord your God keep with you the covenant and the lovingkindness which He sware to your fathers.", "tj": "", "tj_en": "", "rashi": "<b>והיה עקב תשמעון.<\/b> אִם הַמִּצְווֹת קַלּוֹת שֶׁאָדָם דָּשׁ בַּעֲקֵבָיו <b>תשמעון.<\/b><br><br><b>ושמר ה' וגו'.<\/b> יִשְׁמֹר לְךָ הַבְטָחָתוֹ (עי' תנחומא):", "rashi_en": "והיה עקב תשמעון AND THE CONSEQUENCE WILL BE, IF YE HEARKEN (The Hebrew text may be taken to signify if you will hear the heel, עקב) — If, even the lighter commands which a person usually treads on with his heels (i.e. which a person is inclined to treat lightly), ye will hearken to,<br><br>ושמר ה׳ וגו׳ THEN THE LORD [THY GOD] WILL KEEP FOR THEE His promise (Midrash Tanchuma, Eikev 1)."}, {"ch": 7, "v": 13, "aliyah": 1, "heb": "וַאֲהֵ֣בְךָ֔ וּבֵרַכְךָ֖ וְהִרְבֶּ֑ךָ וּבֵרַ֣ךְ פְּרִֽי־בִטְנְךָ֣ וּפְרִֽי־אַ֠דְמָתֶ֠ךָ דְּגָ֨נְךָ֜ וְתִירֹשְׁךָ֣ וְיִצְהָרֶ֗ךָ שְׁגַר־אֲלָפֶ֙יךָ֙ וְעַשְׁתְּרֹ֣ת צֹאנֶ֔ךָ עַ֚ל הָֽאֲדָמָ֔ה אֲשֶׁר־נִשְׁבַּ֥ע לַאֲבֹתֶ֖יךָ לָ֥תֶת לָֽךְ׃", "onk": "וְיִרְחֲמִנָּךְ וִיבָרֵכִנָּךְ וְיַסְגִּנָּךְ וִיבָרֵךְ וַלְדָּא דִמְעָךְ וְאִבָּא דְאַרְעָךְ עִבוּרָךְ וְחַמְרָךְ וּמִשְׁחָךְ בַּקְרֵי תוֹרָיךְ וְעֶדְרֵי עָנָךְ עַל אַרְעָא דִּי קַיִּים לַאֲבָהָתָךְ לְמִתַּן לָךְ:", "onk_en": "He will love you, and bless you, and multiply you; and He will bless the fruit of your belly and the fruit of your soil—your grain, your wine, and your olive oil—the offspring of your cattle, and the herds of your sheep, upon the soil that He swore to your forefathers to give you.", "pj": "וִירַחֲמִינְכוֹן וִיבָרְכִינְכוֹן וְיַסְגִינְכוֹן וִיבָרֵךְ וַלְדֵי מְעֵיכוֹן וּפֵירוֹי אַרְעֲכוֹן עִיבּוּרֵיכוֹן חֲמָרֵיכוֹן וּמִשְׁחֵיכוֹן בַּקְרַת תּוֹרֵיכוֹן וְעֶדְרֵי עַנְכוֹן עַל אַרְעָא דְקַיֵּים לְאַבְהָתָךְ לְמִתַּן לָךְ", "pj_en": "And He will love, bless, and multiply you, and will bless the children of your wombs, the fruit of your ground, your corn, wine, and oil, the herds of your oxen, and the flocks of your sheep, on the land which He sware to your fathers to give you.", "tj": "", "tj_en": "", "rashi": "<b>שגר אלפיך.<\/b> וַלְדֵי בְקָרְךָ שֶׁהַנְּקֵבָה מְשַׁגֶּרֶת מִמֵּעֶיהָ:<br><br><b>ועשתרת צאנך.<\/b> מְנַחֵם פֵּרֵשׁ \"אַבִּירֵי בָשָׁן\" (תהילים כ\"ב) – מִבְחַר הַצֹּאן, כְּמוֹ \"בְּעַשְׁתְּרֹת קַרְנַיִם\" (בראשית י\"ד), לְשׁוֹן חֹזֶק, וְאֻנְקְלוֹס תִּרְגֵּם \"וְעֶדְרֵי עָנָךְ\". וְרַבּוֹתֵינוּ אָמְרוּ לָמָּה נִקְרָא שְׁמָם עַשְׁתָּרוֹת? שֶׁמַּעֲשִׁירוֹת אֶת בַּעֲלֵיהֶן (חולין פ\"ד):", "rashi_en": "שגר אלפיך means the offspring of thy oxen which the female casts out (שגר) from its womb.<br><br>ועשתרות צאנך AND THE BREEDS OF THY FLOCK — Menachem ben Seruk explains this expression to be parallel to אבירי בשן, which means: \"the strong rams of Bashan” (Psalms 22:13), i.e. the choicest of the sheep, similar to (Genesis 14:5), “Ashteroth (עשתרות) Karnaim\", where also it is an expression for “strength\" (so that עשתרות denotes “the strong ones\"). Onkelos. however, translates it: “and the flocks of thy sheep\". Our Rabbis said: Why is their name called עשתרות? Because they enrich (עשר) their owner (through the sale of their wool, etc.) (cf. Chullin 84b)."}, {"ch": 7, "v": 14, "aliyah": 1, "heb": "בָּר֥וּךְ תִּֽהְיֶ֖ה מִכׇּל־הָעַמִּ֑ים לֹא־יִהְיֶ֥ה בְךָ֛ עָקָ֥ר וַֽעֲקָרָ֖ה וּבִבְהֶמְתֶּֽךָ׃", "onk": "בְּרִיךְ תְּהֵי מִכָּל עַמְמַיָּא לָא יְהֵי בָךְ עֲקַר וְעַקְרָא וּבִבְעִירָךְ:", "onk_en": "You will be blessed more than all the peoples; there will not be among you a sterile male or a barren female, nor among your animals.", "pj": "בְּרִיכִין תֶּהֱווֹן מִן כּוּלְהוֹן עַמַיָא לָא יֶהֱווֹן בְּכוֹן גּוּבְרִין עַקְרִין וּנְשִׁין עַקְרִין וְלָא בְּעִירָךְ עַקְרִין מֵעֲמָר וַחֲלָב וְטָלוּי", "pj_en": "More blessed will you be than all peoples; there shall not be among you barren men or women, nor thy cattle (be wanting) in wool, or milk, or offspring.", "tj": "", "tj_en": "", "rashi": "<b>עקר.<\/b> שֶׁאֵינוֹ מוֹלִיד:", "rashi_en": "עקר means, a man who cannot procreate."}, {"ch": 7, "v": 15, "aliyah": 1, "heb": "וְהֵסִ֧יר יְהֹוָ֛ה מִמְּךָ֖ כׇּל־חֹ֑לִי וְכׇל־מַדְוֵי֩ מִצְרַ֨יִם הָרָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָם֙ בָּ֔ךְ וּנְתָנָ֖ם בְּכׇל־שֹׂנְאֶֽיךָ׃", "onk": "וְיֶעְדֵּי יְיָ מִנָּךְ כָּל מַרְעִין וְכָל מַכְתְּשֵׁי מִצְרַיִם בִּישַׁיָּא דִּי יְדַעַתְּ לָא יְשַׁוִּנּוּן בָּךְ וְיִתְּנִנּוּן בְּכָל סָנְאָךְ:", "onk_en": "Adonoy will remove from you all illness; and all the harmful diseases of Egypt that you know, He will not place upon you, but will give them to all your enemies.", "pj": "וְיַעֲדֵי יְיָ מִינָךְ כָּל מַרְעִין וְכָל מַכְתָּשַׁיָא דְגָרֵי יְיָ עַל מִצְרַיִם בִּישַׁיָא דִידַעְתְּ לָא יְשַׁוִּינוּן בְּכוֹן וִיגָרִינוּן בְּכָל סַנְאֵיכוֹן", "pj_en": "And the Lord will put away from thee all the diseases and evil plagues that He sent upon Mizraim which thou hast known; He will not put them upon you, but will send them forth upon all your enemies.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 16, "aliyah": 1, "heb": "וְאָכַלְתָּ֣ אֶת־כׇּל־הָֽעַמִּ֗ים אֲשֶׁ֨ר יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ נֹתֵ֣ן לָ֔ךְ לֹא־תָח֥וֹס עֵֽינְךָ֖ עֲלֵיהֶ֑ם וְלֹ֤א תַעֲבֹד֙ אֶת־אֱלֹ֣הֵיהֶ֔ם כִּֽי־מוֹקֵ֥שׁ ה֖וּא לָֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וּתְגַמַּר<\/b> יָת כָּל עַמְמַיָּא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ לָא תְחוּס עֵינָךְ עֲלֵיהוֹן וְלָא תִפְלַח יָת <b>טַעֲוָתְהוֹן<\/b> אֲרֵי לְתַקְלָא הוּא לָךְ:", "onk_en": "You will consume all the peoples that Adonoy, your God, is giving you; do not take pity on them. Do not serve their gods [<b>idols<\/b>], because they are a snare for you.", "pj": "וּתְגַמַר יַת כָּל עַמְמַיָא דַיְיָ אֱלָהָךְ יָהִיב לָךְ לָא תֵיחוֹס עֵינָךְ עֲלֵיהוֹן וְלָא תִפְלַח יַת טַעֲוַותְהוֹן אֲרוּם לְתוּקְלָא הִינוּן לָךְ", "pj_en": "And thou shalt consume all the nations which the Lord thy God giveth up to thee; thine eye shall not spare them nor their idols, because they would be a stumbling block to thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 17, "aliyah": 1, "heb": "כִּ֤י תֹאמַר֙ בִּלְבָ֣בְךָ֔ רַבִּ֛ים הַגּוֹיִ֥ם הָאֵ֖לֶּה מִמֶּ֑נִּי אֵיכָ֥ה אוּכַ֖ל לְהוֹרִישָֽׁם׃", "onk": "דִּילְמָא תֵימַר בְּלִבָּךְ סַגִּיאִין עַמְמַיָּא הָאִלֵּין מִנִּי אֶכְדֵּין אִכּוּל לְתָרָכוּתְהוֹן:", "onk_en": "Perhaps you may think to yourself, ‘‘These nations are more numerous than I, how can I inherit them?’’", "pj": "דִּלְמָא תֵימַר בְּלִבָּךְ סַגִּיאִין עַמְמַיָא הָאִלֵּין מִנִּי הֵיכְדֵין אִית לִי יוּכְלָא לְתַרְכוּתְהוֹן", "pj_en": "Neither say in thy heart, These nations are greater and stronger than I am: how shall I be able to drive them out?", "tj": "", "tj_en": "", "rashi": "<b>כי תאמר בלבבך.<\/b> עַל כָּרְחֲךָ לְשׁוֹן דִּילְמָא הוּא, שֶׁמָּא תֹאמַר בִּלְבָבְךָ מִפְּנֵי שֶׁהֵם רַבִּים לֹא אוּכַל לְהוֹרִישָׁם, אַל תֹּאמַר כֵּן, <b>לא תירא מהם<\/b>, וְלֹא יִתָּכֵן לְפָרְשׁוֹ בְּאַחַת מִשְּׁאָר לְשׁוֹנוֹת שֶׁל כִּי שֶׁיִּפֹּל עָלָיו שׁוּב לֹא תִירָא מֵהֶם:", "rashi_en": "כי תאמר בלבבך — You must admit that the word כי here denotes “perhaps\": perhaps thou wilt say in thy heart, “Because they are many, I shall be unable to dispossess them\". Do not speak thus, לא תירא מהם THOU SHALT NOT BE AFRAID OF THEM. — For it is not possible to explain it in one of the three other meanings of כי so that the words לא תירא מהם will then appropriately fit in with it."}, {"ch": 7, "v": 18, "aliyah": 1, "heb": "לֹ֥א תִירָ֖א מֵהֶ֑ם זָכֹ֣ר תִּזְכֹּ֗ר אֵ֤ת אֲשֶׁר־עָשָׂה֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לְפַרְעֹ֖ה וּלְכׇל־מִצְרָֽיִם׃", "onk": "לָא תִדְחַל מִנְּהוֹן מִדְכַּר תִּדְכַּר יָת דִּי עֲבַד יְיָ אֱלָהָךְ לְפַרְעֹה וּלְכָל מִצְרָיִם:", "onk_en": "Do not fear them. Recall well what Adonoy, your God, did to Pharaoh and to all the Egyptians.", "pj": "לָא תִידַחֲלוּן מִנְהוֹן הֲווֹן דְּכִירִין יַת גְּבוּרָן דְּעָבַד יְיָ אֱלָהָךְ לְפַרְעה וּלְכָל מִצְרָאֵי", "pj_en": "Be not afraid of them; remember the work of power which the Lord thy God wrought upon Pharoh and all the Mizraee;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 19, "aliyah": 1, "heb": "הַמַּסֹּ֨ת הַגְּדֹלֹ֜ת אֲשֶׁר־רָא֣וּ עֵינֶ֗יךָ וְהָאֹתֹ֤ת וְהַמֹּֽפְתִים֙ וְהַיָּ֤ד הַחֲזָקָה֙ וְהַזְּרֹ֣עַ הַנְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲךָ֖ יְהֹוָ֣ה אֱלֹהֶ֑יךָ כֵּֽן־יַעֲשֶׂ֞ה יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ לְכׇל־הָ֣עַמִּ֔ים אֲשֶׁר־אַתָּ֥ה יָרֵ֖א מִפְּנֵיהֶֽם׃", "onk": "נִסִּין רַבְרְבִין דִּי חֲזָאָה עֵינָךְ וְאָתַיָּא וּמוֹפְתַיָּא וִידָא תַקֶּפְתָּא וּדְרָעָא מְרָמְמָא דִּי אַפְּקָךְ יְיָ אֱלָהָךְ כֵּן יַעְבֵּד יְיָ אֱלָהָךְ לְכָל עַמְמַיָּא דִּי אַתְּ דָּחֵל מִקֳּדָמֵיהוֹן:", "onk_en": "The great tests you witnessed, and the signs and the wonders and the strong hand and the extended arm with which Adonoy, your God, took you out; so will Adonoy, your God, do to all the peoples that you are afraid of.", "pj": "נִיסִין רַבְרְבִין דַּחֲמֵיתוּן בְּעֵינֵיכוֹן אָתַיָא וְתִמְהַיָא וּגְבוּרַת יְדָא תַקִיפְתָּא וְנִצְחָנוּת אֶדְרַע מְרַמְמָא כַּדְאַפְקְכוֹן יְיָ אֱלָהָכוֹן פְּרִיקִין הֵיכְדֵין יַעֲבֵד יְיָ אֱלָהָכוֹן לְכָל עַמְמַיָא דְאַנְתְּ דָּחִיל מִן קֳדָמֵיהוֹן", "pj_en": "the great miracles which thou didst see with thine eyes, the signs and wonders, the strength of the mighty hand, and the victory of the uplifted arm, when the Lord your God led you out free: so will the Lord your God do unto all the peoples before whom thou art afraid.", "tj": "", "tj_en": "", "rashi": "<b>המסת.<\/b> נִסְיוֹנוֹת:<br><br><b>והאתת.<\/b> כְּגוֹן וַיְהִי לְנָחָשׁ (שמות ד'), וְהָיוּ לְדָם בַּיַּבָּשֶׁת (שם):<br><br><b>והמפתים.<\/b> הַמַּכּוֹת הַמֻּפְלָאוֹת:<br><br><b>והיד החזקה.<\/b> זוֹ הַדֶּבֶר:<br><br><b>והזרע הנטויה.<\/b> זוֹ הַחֶרֶב שֶׁל מַכַּת בְּכוֹרוֹת:", "rashi_en": "המסות means, THE TRIALS (cf. Rashi on 4:34). <br><br>והאתת AND THE SIGNS, for example (Exodus 4:3) “and it became a serpent”, and (Exodus 4:9) “It became blood on the dry land”. ...<br><br>והמפתים AND THE WONDERS, viz., the wondrous plagues.<br><br>והיה החזקה AND THE STRONG HAND — this refers to the pestilence (Sifrei Bamidbar 115:1; cf. the Passover Haggadah).<br><br>והזרע הנטיה AND THE OUTSTRETCHED ARM, this refers to the sword for the smiting of the firstborn (Exodus 4:23)."}, {"ch": 7, "v": 20, "aliyah": 1, "heb": "וְגַם֙ אֶת־הַצִּרְעָ֔ה יְשַׁלַּ֛ח יְהֹוָ֥ה אֱלֹהֶ֖יךָ בָּ֑ם עַד־אֲבֹ֗ד הַנִּשְׁאָרִ֛ים וְהַנִּסְתָּרִ֖ים מִפָּנֶֽיךָ׃", "onk": "וְאַף יָת עֲרָעִיתָא <b>יְגָרֵי<\/b> יְיָ אֱלָהָךְ בְּהוֹן עַד דִיֵבַדּוּן דְּאִשְׁתָּאָרוּ וּדְאִטַּמָּרוּ מִקֳּדָמָךְ:", "onk_en": "Also the <i>tzir’oh<\/i> will Adonoy, your God, send against [<b>set upon<\/b>] them, until the destruction of those who survive and hide from you.", "pj": "וּלְחוֹד יַת מְחַת אוֹרְעַיִיתָא טְרִיקַיָיא יְגָרֵי יְיָ אֱלָהָכוֹן בְּהוֹן עַד דִּיהוֹבְדוּן מַה דְּמִשְׁתּוֹתְרִין וּמַה דְּמִיטַמְרִין מִן קֳדָמֵיכוֹן", "pj_en": "Moreover, the Lord your God will send the plague of biting hornets among you, until they who have remained shall perish and disappear before you.", "tj": "", "tj_en": "", "rashi": "<b>הצרעה.<\/b> מִין שֶׁרֶץ הָעוֹף שֶׁהָיְתָה זוֹרֶקֶת בָּהֶם מָרָה וּמְסָרַסְתָּן וּמְסַמְּאָה אֶת עֵינֵיהֶם בְּכָל מָקוֹם שֶׁהָיוּ נִסְתָּרִין שָׁם (סוטה ל\"ו):", "rashi_en": "הצרעה — a species of flying insect which injected poison into them, and castrated them and blinded their eyes wherever they hid themselves (Sotah 36a)."}, {"ch": 7, "v": 21, "aliyah": 1, "heb": "לֹ֥א תַעֲרֹ֖ץ מִפְּנֵיהֶ֑ם כִּֽי־יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ בְּקִרְבֶּ֔ךָ אֵ֥ל גָּד֖וֹל וְנוֹרָֽא׃", "onk": "לָא תִתְּבַר מִקֳּדָמֵיהוֹן אֲרֵי יְיָ אֱלָהָךְ <b>שְׁכִנְתֵּיהּ<\/b> בֵּינָךְ אֱלָהָא רַבָּא וּדְחִילָא:", "onk_en": "Do not be intimidated by them, for Adonoy, your God, [<b>His Shechinah<\/b>] is amid you, the great and fearsome Almighty.", "pj": "לָא תִתְבְּרוּן מִן קֳדָמֵיהוֹן אֲרוּם שְׁכִינַת יְיָ אֱלָהָכוֹן בֵּינֵיכוֹן אֱלָהָא רַבָּא וּדְחִילָא", "pj_en": "Therefore be not downbroken before them, for the Shekinah of the Lord your God is among you, the Great and Fearful God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 22, "aliyah": 1, "heb": "וְנָשַׁל֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ אֶת־הַגּוֹיִ֥ם הָאֵ֛ל מִפָּנֶ֖יךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣ם מַהֵ֔ר פֶּן־תִּרְבֶּ֥ה עָלֶ֖יךָ חַיַּ֥ת הַשָּׂדֶֽה׃", "onk": "וִיתָרֵךְ יְיָ אֱלָהָךְ יָת עַמְמַיָּא הָאִלֵּין מִקֳּדָמָךְ זְעֵר זְעֵר לָא תִכּוּל לְשֵׁצָיוּתְהוֹן בִּפְרִיעַ דִּילְמָא תִסְגֵּי עֲלָךְ חֵיוַת בָּרָא:", "onk_en": "Adonoy, your God, will expel these nations before you, gradually; you will be unable to exterminate them rapidly, lest the wild animals multiply against you.", "pj": "וְיִגְלֵי יְיָ אֱלָהָכוֹן יַת עַמְמַיָא הָאִלֵּין מִן קֳדָמֵיכוֹן קָלִיל לָא תֵיכוּל לְשֵׁיצֵיוּתְהוֹן בִּפְרִיעַ דִּלְמָא יַסְגֵי עֲלֵיכוֹן חֵיוַת בָּרָא כַּד יֵיתוּן לְמֵיכוֹל גּוּשְׁמֵיהוֹן", "pj_en": "But the Lord your God will make these nations depart from before thee by little and little. You may not destroy them at once, lest the beasts of the field multiply against you, when they have come to devour their carcases.", "tj": "", "tj_en": "", "rashi": "<b>פן תרבה עליך חית השדה.<\/b> וַהֲלֹא אִם עוֹשִׂין רְצוֹנוֹ שֶׁל מָקוֹם אֵין מִתְיָרְאִין מִן הַחַיָּה, שֶׁנֶּאֱמַר (איוב ה') וְחַיַּת הַשָּׂדֶה הָשְׁלְמָה לָּךְ? אֶלָּא גָּלוּי הָיָה לְפָנָיו שֶׁעֲתִידִין לַחֲטֹא:", "rashi_en": "פן תרבה עליך חית השדה LEST THE BEASTS OF THE FIELD INCREASE UPON THEE — But is it not a fact that if people perform the will of the Omnipresent they will not have to fear the beasts, as it is said, (Job 5:23) “And the beasts of the field shall be at peace with thee”?! But it states this because it was manifest before Him that they would in future sin."}, {"ch": 7, "v": 23, "aliyah": 1, "heb": "וּנְתָנָ֛ם יְהֹוָ֥ה אֱלֹהֶ֖יךָ לְפָנֶ֑יךָ וְהָמָם֙ מְהוּמָ֣ה גְדֹלָ֔ה עַ֖ד הִשָּׁמְדָֽם׃", "onk": "וְיִמְסְרִנּוּן יְיָ אֱלָהָךְ קֳדָמָךְ וִישַׁגֵּשִׁנּוּן שִׁגּוּשׁ רַב עַד דִּישֵׁיצִנּוּן:", "onk_en": "Adonoy, your God, will defeat them before you, and will confuse them with great confusion until they are destroyed.", "pj": "וְיִמְסְרִינוּן יְיָ אֱלָהָכוֹן קֳדָמֵיכוֹן וִיעַרְבִּינוּן עִרְבּוּב רַב עַד דְּיִשְׁתֵּיצוּן", "pj_en": "But the Lord your God will give them up before you, and will trouble them with great trouble, until they shall be consumed", "tj": "וִיעַרְבַּב יַתְהוֹן עִרְבּוּב רַב עַד זְמַן דְּיִשְׁתֵּיצוּן:", "tj_en": "And shall trouble them with great trouble, till the time that they shall be destroyed.", "rashi": "<b>והמם.<\/b> נָקוּד קָמָץ כֻּלּוֹ, לְפִי שֶׁאֵין מ\"ם אַחֲרוֹנָה מִן הַיְסוֹד, וַהֲרֵי הוּא כְּמוֹ וְהָם אוֹתָם, אֲבָל \"וְהָמַם גִּלְגַּל עֶגְלָתוֹ\" (ישעיהו כ\"ח) כֻּלּוֹ יְסוֹד, לְפִיכָךְ חֶצְיוֹ קָמָץ וְחֶצְיוֹ פַּתָּח, כִּשְׁאָר פֹּעַל שֶׁל שָׁלוֹשׁ אוֹתִיּוֹת:", "rashi_en": "והמם AND HE WILL CONFOUND THEM — This word is vowelled entirely (both syllables) with Kametz, because the last ם is not part of the root, and it is equivalent to וְהָם, “And he will confuse”, אותם “them”. But in (Isaiah 28:28) וְהָמַם גלגל עגלתו the verb המם consists entirely of root letters, therefore half of it (one syllable) has Kametz and half of it Patach, just like any other verb of three consonants."}, {"ch": 7, "v": 24, "aliyah": 1, "heb": "וְנָתַ֤ן מַלְכֵיהֶם֙ בְּיָדֶ֔ךָ וְהַאֲבַדְתָּ֣ אֶת־שְׁמָ֔ם מִתַּ֖חַת הַשָּׁמָ֑יִם לֹֽא־יִתְיַצֵּ֥ב אִישׁ֙ בְּפָנֶ֔יךָ עַ֥ד הִשְׁמִֽדְךָ֖ אֹתָֽם׃", "onk": "וְיִמְסַר מַלְכֵיהוֹן בִּידָךְ וְתוֹבַד יָת שִׁמְהוֹן מִתְּחוֹת שְׁמַיָּא לָא יִתְעַתַּד אֱנַשׁ מִקֳּדָמָךְ עַד דְּתִשֵׁיצֵי יָתְהוֹן:", "onk_en": "He will put their kings in your hand, and you will eliminate their name from beneath the heavens; no man will stand up to you until you have destroyed them.", "pj": "וְיִמְסוֹר מַלְכֵיהוֹן בְּיֶדְכוֹן וְתוֹבְדוּן יַת שׁוּמְהוֹן מִדּוּכְרָנָא תְּחוֹת כָּל שְׁמַיָא לָא יִתְעַתֵּד אֵינַשׁ קוֹמֵיכוֹן עַד דְּיִתְשֵׁיצֵי יַתְהוֹן", "pj_en": "And He will deliver their kings into your hands, and you shall destroy their names from remembrance under the whole heavens: not a man shall stand before you until you have destroyed them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 25, "aliyah": 1, "heb": "פְּסִילֵ֥י אֱלֹהֵיהֶ֖ם תִּשְׂרְפ֣וּן בָּאֵ֑שׁ לֹֽא־תַחְמֹד֩ כֶּ֨סֶף וְזָהָ֤ב עֲלֵיהֶם֙ וְלָקַחְתָּ֣ לָ֔ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔וֹ כִּ֧י תוֹעֲבַ֛ת יְהֹוָ֥ה אֱלֹהֶ֖יךָ הֽוּא׃", "onk": "צַלְמֵי <b>טַעֲוָתְהוֹן<\/b> תּוֹקְדוּן בְּנוּרָא לָא תַחְמֵד כַּסְפָּא וְדַהֲבָא דִי עֲלֵיהוֹן וְתִסַּב לָךְ דִּילְמָא תִּתָּקַל בֵּיהּ אֲרֵי מְרָחָקָא דַּיְיָ אֱלָהָךְ הוּא:", "onk_en": "Burn the statues of their gods [<b>idols<\/b>] in fire; do not covet the silver and gold upon them and take it for yourself, lest you be ensnared by it, because it is abominated by Adonoy, your God.", "pj": "צַלְמֵי טַעֲוַותְהוֹן תּוֹקְדוּן בְּנוּרָא לָא תְחַמְדוּן כַּסְפָּא וְדַהֲבָא דַּעֲלֵיהוֹן וְתִסְבוּן לְכוֹן דִּלְמָא תִתַּקְלוּן בְּהוֹן אֲרוּם מְרָחֵק קֳדָם יְיָ אֱלָהָכוֹן הוּא", "pj_en": "You shall burn their images with fire, nor desire the silver and gold that may be upon them, nor take them, lest through them you offend, for they are an abomination before the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 26, "aliyah": 1, "heb": "וְלֹא־תָבִ֤יא תֽוֹעֵבָה֙ אֶל־בֵּיתֶ֔ךָ וְהָיִ֥יתָ חֵ֖רֶם כָּמֹ֑הוּ שַׁקֵּ֧ץ&thinsp;<small>׀<\/small>&thinsp;תְּשַׁקְּצֶ֛נּוּ וְתַעֵ֥ב&thinsp;<small>׀<\/small>&thinsp;תְּֽתַעֲבֶ֖נּוּ כִּי־חֵ֥רֶם הֽוּא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלָא תָעֵל דִּמְרָחָק לְבֵיתָךְ וּתְהֵי חֶרְמָא כְּוָתֵיהּ שַׁקָּצָא תְשַׁקְּצִנֵּיהּ <b>וְרָחָקָא תְּרַחֲקִנֵּיהּ<\/b> אֲרֵי חֶרְמָא הוּא:", "onk_en": "Do not bring abomination into your house [lest] you become <i>cheirem<\/i> like it; thoroughly revile and abominate [<b>distance<\/b>] it, for it is <i>cheirem. <\/i>", "pj": "וְלָא תֵיעֲלוּן רִיחוּקֵי טַעֲוָותָא וְתִשְׁמִישָׁתָא לְבָתֵּיכוֹן דְּלָא תֶהֱווֹן שְׁמִיתִין כְּוַותְהוֹן שִׁיקְצָא תְּשַׁקְצִינוּן הֵיךְ סָאִיב שִׁיקְצָא וְרִיחֲקָא תְּרַחֲקִינוּן מְטוּל דְּשַׁמְתִּין הִינוּן", "pj_en": "Neither may you bring their abominable idols or their servicejvessels into your houses, that you be not accursed as they but you shall utterly loathe them as a loathsome reptile, and abhor them altogether, because they are accursed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 1, "aliyah": 1, "heb": "כׇּל־הַמִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּךָ֛ הַיּ֖וֹם תִּשְׁמְר֣וּן לַעֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּן וּרְבִיתֶ֗ם וּבָאתֶם֙ וִֽירִשְׁתֶּ֣ם אֶת־הָאָ֔רֶץ אֲשֶׁר־נִשְׁבַּ֥ע יְהֹוָ֖ה לַאֲבֹתֵיכֶֽם׃", "onk": "כָּל תַּפְקֶדְתָּא דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין תִּטְּרוּן לְמֶעְבָּד בְּדִיל דְּתֵיחוּן וְתִסְגּוּן וְתֵיתוּן וְתֵירְתוּן יָת אַרְעָא דִּי קַיִּים יְיָ לַאֲבָהָתְכוֹן:", "onk_en": "The entire <i>mitzvah<\/i> that I am commanding you today, are you to guard so as to fulfill; in order that you live and multiply and arrive to inherit the land that Adonoy swore to your forefathers.", "pj": "כָּל תַּפְקֵידְתָּא דַּאֲנָא מְפַקִּידְכוֹן יוֹמָא דֵין תִּטְרוּן לְמֶעֱבַד מִן בִּגְלַל דְּתֵיחוּן וְתִיסְגוּן וְתֵעֲלוּן וְתֵירְתוּן יַת אַרְעָא דְקַיֵּים יְיָ לְאַבְהַתְכוֹן", "pj_en": "Every commandment which I command you this day, observe ye to do, that you may live, and multiply, and go in and inherit the land which the Lord sware to your fathers.", "tj": "", "tj_en": "", "rashi": "<b>כל המצוה.<\/b> כִּפְשׁוּטוֹ; וּמִדְרַשׁ אַגָּדָה אִם הִתְחַלְתָּ בְּמִצְוָה גְּמֹר אוֹתָהּ, שֶׁאֵינָהּ נִקְרֵאת אֶלָּא עַל שֵׁם הַגּוֹמְרָהּ, שֶׁנֶּאֱמַר \"וְאֶת עַצְמוֹת יוֹסֵף אֲשֶׁר הֶעֱלוּ בְנֵי יִשְׂרָאֵל מִמִּצְרַיִם קָבְרוּ בִשְׁכֶם\" (יהושע כ\"ד), וַהֲלֹא מֹשֶׁה לְבַדּוֹ נִתְעַסֵּק בָּהֶם לְהַעֲלוֹתָם? אֶלָּא לְפִי שֶׁלֹּא הִסְפִּיק לְגָמְרָהּ וּגְמָרוּהָ יִשְׂרָאֵל נִקְרֵאת עַל שְׁמָם (תנחומא):", "rashi_en": "כל המצוה — Explain this in its plain sense: EVERY COMMANDMENT. — And a Midrashic explanation is (taking it to mean, “the whole of the commandment … shall ye be heedful to do”): If thou hast once made a beginning with a meritorious deed, carry it out to the end, because it bears the name only of him (it is attributed only to him) who does the last part of it, as it is said, (Joshua 24:32) \"And the bones of Joseph which the children of Israel brought up from Egypt they buried in Shechem”. But did not Moses alone busy himself with them to bring them up (cf. Exodus 13:19)? But because he had no opportunity to complete this (to inter them), the children of Israel completed it, it was called by their name (Midrash Tanchuma, Eikev 6)."}, {"ch": 8, "v": 2, "aliyah": 1, "heb": "וְזָכַרְתָּ֣ אֶת־כׇּל־הַדֶּ֗רֶךְ אֲשֶׁ֨ר הוֹלִֽיכְךָ֜ יְהֹוָ֧ה אֱלֹהֶ֛יךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּמִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְךָ֜ לְנַסֹּֽתְךָ֗ לָדַ֜עַת אֶת־אֲשֶׁ֧ר בִּֽלְבָבְךָ֛ הֲתִשְׁמֹ֥ר <span class=\"mam-kq-trivial\">מִצְוֺתָ֖ו<\/span> אִם־לֹֽא׃", "onk": "וְתִדְכַּר יָת כָּל אָרְחָא דִּי דַבְּרָךְ יְיָ אֱלָהָךְ דְּנַן אַרְבְּעִין שְׁנִין בְּמַדְבְּרָא בְּדִיל לְעַנָּיוּתָךְ לְנַסָּיוּתָךְ לְמִדַּע יָת דִּי בְלִבָּךְ הֲתִטַּר פִּקּוּדוֹהִי אִם לָא:", "onk_en": "You are to recall the entire way on which Adonoy, your God, led you these forty years in the wilderness; in order to oppress you, to test you, to know what is in your heart—will you guard His commandments or not?", "pj": "וְתֶהֱווֹן דְּכִירִין יַת כָּל אָרְחָא דְדַבַּרְכוֹן יְיָ אֱלָהָכוֹן דְּנַן אַרְבְּעִין שְׁנִין בְּמַדְבְּרָא מִן בִּגְלַל לְסַגִּיפְכוֹן וּמִן בִּגְלַל לְנַסְיוּכוֹן לְמִנְדוֹעַ הֲנַטְרוּן אַתּוּן פִּקּוּדוֹי אִין לָא", "pj_en": "And remember all the way by which the Lord your God hath led you these forty years in the wilderness, to humble and try you, to know whether you will keep His commandments or not.", "tj": "", "tj_en": "", "rashi": "<b>התשמר מצותו.<\/b> שֶׁלֹּא תְנַסֵּהוּ וְלֹא תְהַרְהֵר אַחֲרָיו:", "rashi_en": "התשמר מצותו [THAT HE MIGHT KNOW WHAT WAS IN THY HEART] WHETHER THOU WOULDST KEEP HIS COMMANDMENTS — viz., the commandment that ye should not put Him to the test, and that you should not doubt Him (i.e. His ways)."}, {"ch": 8, "v": 3, "aliyah": 1, "heb": "וַֽיְעַנְּךָ֮ וַיַּרְעִבֶ֒ךָ֒ וַיַּאֲכִֽלְךָ֤ אֶת־הַמָּן֙ אֲשֶׁ֣ר לֹא־יָדַ֔עְתָּ וְלֹ֥א יָדְע֖וּן אֲבֹתֶ֑יךָ לְמַ֣עַן הוֹדִֽיעֲךָ֗ כִּ֠י לֹ֣א עַל־הַלֶּ֤חֶם לְבַדּוֹ֙ יִחְיֶ֣ה הָֽאָדָ֔ם כִּ֛י עַל־כׇּל־מוֹצָ֥א פִֽי־יְהֹוָ֖ה יִחְיֶ֥ה הָאָדָֽם׃", "onk": "וְעַנְּיָךְ וְאַכְפָּנָךְ וְאוֹכָלָךְ יָת מַנָּא דִּי לָא יְדַעְתָּא וְלָא יָדְעוּן אֲבָהָתָיךְ בְּדִיל לְאוֹדָעוּתָךְ אֲרֵי לָא עַל לַחְמָא בִלְחוֹדוֹהִי מִתְקַיַּם אֱנָשָׁא אֲרֵי עַל כָּל אַפָּקוּת מֵימְרָא דַיְיָ יִתְקַיַּם אֱנָשָׁא:", "onk_en": "He oppressed you and made you hungry, and He fed you the <i>mon<\/i> that neither you knew nor your forefathers knew, in order to inform you that not by bread alone does man live, rather by the entire expression of Adonoy’s word does man live.", "pj": "וְעַנְיָךְ וְאַכְפִינָךְ וְאוֹכְלָךְ יַת מַנָּא דְּלָא יְדַעְתּוּן וְלָא יָדְעוּן אַבְהָתָךְ מִן בִּגְלַל לְהוֹדָעוּתָךְ אֲרוּם לָא עַל לַחֲמָא בִּלְחוֹדוֹי חַיֵּי בַּר נְשָׁא אֲרוּם עַל כָּל מַה דְּאִתְבְּרֵי עַל מֵימְרָא דַיְיָ חַיֵּי בַּר נְשָׁא", "pj_en": "And He humbled thee and let thee hunger, and fed thee with the manna which thou knewest not, nor thy fathers had known, that He might make thee to know that man liveth not by bread only, but by all that is created by the Word of the Lord doth man live.", "tj": "אֲרוּם לָא עַל מָזוֹנָא לְבִלְחוֹדוֹי:", "tj_en": "That by manna only.", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 4, "aliyah": 1, "heb": "שִׂמְלָ֨תְךָ֜ לֹ֤א בָֽלְתָה֙ מֵֽעָלֶ֔יךָ וְרַגְלְךָ֖ לֹ֣א בָצֵ֑קָה זֶ֖ה אַרְבָּעִ֥ים שָׁנָֽה׃", "onk": "כְּסוּתָךְ לָא אִבְלִיאַת מִנָּךְ וּמְסָנָךְ לָא יְחֵפוּ דְּנַן אַרְבְּעִין שְׁנִין:", "onk_en": "Your garment did not wear out on you, nor did your foot swell these forty years.", "pj": "כְּסוּתְכוֹן לָא בְּלַת מֵעִילַוֵי גּוּשְׁמֵיכוֹן וְרִגְלֵיכוֹן לָא הֲלִיכַן מְיַיחְפִּין דְּנָן אַרְבְּעִין שְׁנִין", "pj_en": "Your raiment hath not waxen old upon your bodies, and your feet have not gone without covering these forty years.", "tj": "", "tj_en": "", "rashi": "<b>שמלתך לא בלתה.<\/b> עַנְנֵי כָבוֹד הָיוּ שָׁפִים בִּכְסוּתָם וּמְגַהֲצִים אוֹתָם כְּמִין כֵּלִים מְגֹהָצִים, וְאַף קְטַנֵּיהֶם כְּמוֹ שֶׁהָיוּ גְדֵלִים הָיָה גָּדֵל לְבוּשָׁן עִמָּהֶם, כַּלְּבוּשׁ הַזֶּה שֶׁל חֹמֶט שֶׁגָּדֵל עִמּוֹ (עי' ילקוט שמעוני תת\"ן):<br><br><b>לא בצקה.<\/b> לֹא נָפְחָה כְּבָצֵק, כְּדֶרֶךְ הוֹלְכֵי יָחֵף שֶׁרַגְלֵיהֶם נְפוּחוֹת:", "rashi_en": "שמלתך לא בלתה THY RAIMENT DID NOT WEAR OUT — the clouds of Divine Glory used to rub the dirt off their clothes and bleach them so that they looked like new white articles, and also, their children, as they grew, their clothes grew with them, just like the clothes (shell) of a snail which grows with it (cf. Shir HaShirim Rabbah 4:11; Yalkut Shimoni on Torah 850).<br><br>לא בצקה This means: [AND THY FOOT] DID NOT SWELL like dough (בצק), as is usual with those who walk barefoot — that their feet become swollen."}, {"ch": 8, "v": 5, "aliyah": 1, "heb": "וְיָדַעְתָּ֖ עִם־לְבָבֶ֑ךָ כִּ֗י כַּאֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת־בְּנ֔וֹ יְהֹוָ֥ה אֱלֹהֶ֖יךָ מְיַסְּרֶֽךָּ׃", "onk": "וְתִדַּע עִם לִבָּךְ אֲרֵי כְּמָא דִי מְאַלֵּף גַּבְרָא יָת בְּרֵיהּ יְיָ אֱלָהָךְ מְאַלֵּף לָךְ:", "onk_en": "You will know with your heart that the way a man trains his son does Adonoy, your God, train you.", "pj": "וְתִנְדְּעוּן עִם רַעֲיוֹנֵי לִבְכוֹן אֲרוּם הֵיכְמָא דִּמְסַקֵּר גְּבַר יַת בְּרֵיהּ יְיָ אֱלָהָךְ מַסְקֵר יַתְכוֹן", "pj_en": "But you know with the thoughts of your hearts, that as a man regardeth his child, so the Lord your God hath regarded you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 6, "aliyah": 1, "heb": "וְשָׁ֣מַרְתָּ֔ אֶת־מִצְוֺ֖ת יְהֹוָ֣ה אֱלֹהֶ֑יךָ לָלֶ֥כֶת בִּדְרָכָ֖יו וּלְיִרְאָ֥ה אֹתֽוֹ׃", "onk": "וְתִטַּר יָת פִּקּוּדַיָּא דַּיְיָ אֱלָהָךְ לִמְהַךְ בְּאָרְחַן דְּתַקְנָן קֳדָמוֹהִי וּלְמִדְחַל יָתֵיהּ:", "onk_en": "You are to guard the commandments of Adonoy, your God, to go in His ways and to fear Him.", "pj": "וְתִנְטְרוּן יַת פִּקּוּדַיָא דַיְיָ אֱלָהָכוֹן לִמְהַךְ בְּאָרְחָן דְּתַקְנָן קֳדָמוֹי וּלְמִדְחַל יָתֵיהּ", "pj_en": "Keep, therefore, the commandments of the Lord your God, to walk in the ways that are right before Him, and to fear Him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 7, "aliyah": 1, "heb": "כִּ֚י יְהֹוָ֣ה אֱלֹהֶ֔יךָ מְבִֽיאֲךָ֖ אֶל־אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּתְהֹמֹ֔ת יֹצְאִ֥ים בַּבִּקְעָ֖ה וּבָהָֽר׃", "onk": "אֲרֵי יְיָ אֱלָהָךְ מַעֲלָךְ לְאַרְעָא טַבְתָא אַרְעָא נָגְדָא נַחֲלִין דְּמַיִּין מַבּוּעֵי עֵינָיָן וּתְהוֹמִין נָפְקִין בְּבִקְעָן וּבְטוּרִין:", "onk_en": "For Adonoy, your God, is bringing you to a good land, a land with streams of water, springs and groundwater that emerge in valley and hill.", "pj": "אֲרוּם יְיָ אֱלָהָכוֹן מֵעַל יַתְכוֹן לְאַרְעָא מְשַׁבְּחָא בְּפֵירָהָא אַרְעָא דְנַגְדָא נַחֲלִין דְּמַיָין צְלִילִין מַבּוּעֵי עֵינַוָון חַלְיַין וּתְהוֹמִין דְּלָא מְיַיבְּשִׁין נַפְקִין בְּבִקְעָן וּבְטַוְורִין", "pj_en": "For the Lord your God bringeth you into a land whose fruits are celebrated, a land whose streams flow in clear waters, from sweet fountain springs, and depths that dry not up, issuing forth among the vales and mountains;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 8, "aliyah": 1, "heb": "אֶ֤רֶץ חִטָּה֙ וּשְׂעֹרָ֔ה וְגֶ֥פֶן וּתְאֵנָ֖ה וְרִמּ֑וֹן אֶֽרֶץ־זֵ֥ית שֶׁ֖מֶן וּדְבָֽשׁ׃", "onk": "אַרְעָא חִטִּין וְסַעֲרִין וְגוּפְנִין וּתְאֵנִין וְרִמּוֹנִין אַרְעָא דְּזֵיתָהָא <b>עָבְדִין מִשְׁחָא וְהִיא עָבְדָא<\/b> דְבָשׁ:", "onk_en": "A land of wheat and barley, and grapes and figs and pomegranates; a land of olives [<b>yeilding oil<\/b>] and [<b>producing<\/b>] honey.", "pj": "אַרְעָא דְמַרְבַּיָיא חִינְטִין וּשְעוֹרִין וּמְלַבְלְבָא גוּפְנִין דְּמִנְהוֹן נָפִיק חֲמַר חַל וְחָרִיף וּמַרְבַּיָא תֵינִין וְרוּמָנִין אֲרַע דְּמִן זֵיתָהָא עַבְדִין מְשַׁח וּמִן תוּמְרַיָיהָא עַבְדִין דְּבָשׁ", "pj_en": "a land producing wheat and barley, and growing vines from which cometh out wine sweet and ripe, and a land which yieldeth figs and pomegranates, a land whose olive trees make oil, and whose palms give honey;", "tj": "אַרְעָא דְמִן זֵיתָהָא עָבְדִין מְשַׁח וּמִן תְּמָרָהָא עָבְדִין דּוּבְשָׁא:", "tj_en": "A land from whose olive trees they make oil, and from whose palms they make honey,", "rashi": "<b>זית שמן.<\/b> זֵיתִים הָעוֹשִׂים שֶׁמֶן:", "rashi_en": "זית שמן (lit., the olive of oil) means, olives that produce oil (i.e. good olives, not hard fruits that give no oil)."}, {"ch": 8, "v": 9, "aliyah": 1, "heb": "אֶ֗רֶץ אֲשֶׁ֨ר לֹ֤א בְמִסְכֵּנֻת֙ תֹּֽאכַל־בָּ֣הּ לֶ֔חֶם לֹֽא־תֶחְסַ֥ר כֹּ֖ל בָּ֑הּ אֶ֚רֶץ אֲשֶׁ֣ר אֲבָנֶ֣יהָ בַרְזֶ֔ל וּמֵהֲרָרֶ֖יהָ תַּחְצֹ֥ב נְחֹֽשֶׁת׃", "onk": "אַרְעָא דִּי לָא בְעִצּוּרִין תֵּיכוּל בַּהּ לַחְמָא לָא תֶחְסַר כָּל מִדַּעַם בַּהּ אַרְעָא דִּי אַבְנָהָא פַרְזְלָא וּמִטּוּרָהָא תִּפְסוּל נְחָשָׁא:", "onk_en": "A land where you will not eat bread in poverty, you will lack nothing there; a land whose stones are iron, and from whose hills you will mine copper.", "pj": "אַרְעָא דְלָא בְחוּסְרָנָא תֵיכְלוּן בָּהּ לַחֲמָא לָא תֶחְסַר כָּל מִדַּעַם בָּהּ אַרְעָא דִי חַכִּימָהָא גָזְרִין גְּזֵרַן בְּרִירַן הֵי כְּפַרְזְלָא וְתַלְמִידָהָא שַׁאֲלִין שְׁאִילִין מְסִימָן כִּנְחָשָׁא", "pj_en": "a land where, without poverty, you may eat bread and want nothing; a land whose sages will enact decrees unalloyed as iron, and whose disciples will propound questions weighty as brass.", "tj": "דִּי אַבְנָהָא בְרִירִין כְּפוּרְזְלָא וְטוּרַיָא חַכִּימִין (נ\"א חסימין) כִּנְחָשָׁא:", "tj_en": "whose stones are pure as iron and whose hills are firm as brass.", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 10, "aliyah": 1, "heb": "וְאָכַלְתָּ֖ וְשָׂבָ֑עְתָּ וּבֵֽרַכְתָּ֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ עַל־הָאָ֥רֶץ הַטֹּבָ֖ה אֲשֶׁ֥ר נָֽתַן־לָֽךְ׃", "onk": "וְתֵיכוּל וְתִשְׂבַּע וּתְבָרַךְ יָת יְיָ אֱלָהָךְ עַל אַרְעָא טַבְתָא דִיהַב לָךְ:", "onk_en": "You will eat and be full, and you will bless Adonoy, your God, for the good land He has given you.", "pj": "וְתֶהֱווֹן זְהִירִין בִּזְמַן דְּאַתּוּן אָכְלִין וּשְבֵעִין הֲווֹן מוֹדִין וּמְבָרְכִין קֳדָם יְיָ אֱלָהָכוֹן עַל כָּל פֵּירֵי אַרְעָא מְשַׁבְּחָא דִיהַב לְכוֹן", "pj_en": "Be mindful, therefore, in the time when you will have eaten and are satisfied, that you render thanksgiving and blessing before the Lord your God for all the fruit of the goodly land which He hath given you,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 11, "aliyah": 2, "heb": "הִשָּׁ֣מֶר לְךָ֔ פֶּן־תִּשְׁכַּ֖ח אֶת־יְהֹוָ֣ה אֱלֹהֶ֑יךָ לְבִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָיו֙ וּמִשְׁפָּטָ֣יו וְחֻקֹּתָ֔יו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּֽוֹם׃", "onk": "אִסְתַּמַּר לָךְ דִּילְמָא תִתְנְשֵׁי יָת <b>דַּחַלְתָּא<\/b> דַיְיָ אֱלָהָךְ בְּדִיל דְּלָא לְמִטַּר פִּקּוֹדוֹהִי וְדִינוֹהִי וּקְיָמוֹהִי דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין:", "onk_en": "Look out for yourself lest you forget [<b>the fear of<\/b>] Adonoy, your God, to not guard His commandments, His laws, and His statutes that I am commanding you today.", "pj": "אִסְתַּמְרוּן לְכוֹן דִּילְמָא תִתְנְשׁוּן יַת דַּחַלְתָּא דַיְיָ אֱלָהָכוֹן מִן בִּגְלַל דְּלָא לְמִנְטַר פִּקּוּדוֹי וְדִינוֹי וּקְיָמוֹי דַּאֲנָא מְפַקֵּיד לְכוֹן יוֹמָא דֵין", "pj_en": "lest you forget the fear of the Lord your God, and keep not His commandments, His judgments, and His statutes, which I command you this day;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 12, "aliyah": 2, "heb": "פֶּן־תֹּאכַ֖ל וְשָׂבָ֑עְתָּ וּבָתִּ֥ים טֹבִ֛ים תִּבְנֶ֖ה וְיָשָֽׁבְתָּ׃", "onk": "דִּילְמָא תֵיכוּל וְתִשְׂבַּע וּבָתִּין <b>שַׁפִּירִין<\/b> תִּבְנֵי וְתֵיתֵב:", "onk_en": "Lest you eat and be full, and build good [<b>beautiful<\/b>] houses and live [in them.]", "pj": "דִּלְמָא תֵּיכְלוּן וְתִשְבְּעִין וּבָתִּין שַׁפִּירִין תִּיבְנוּן וְתֵיתְבוּן", "pj_en": "lest, when you shall have eaten and are satisfied, and you have builded pleasant houses to dwell in,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 13, "aliyah": 2, "heb": "וּבְקָֽרְךָ֤ וְצֹֽאנְךָ֙ יִרְבְּיֻ֔ן וְכֶ֥סֶף וְזָהָ֖ב יִרְבֶּה־לָּ֑ךְ וְכֹ֥ל אֲשֶׁר־לְךָ֖ יִרְבֶּֽה׃", "onk": "וְתוֹרָךְ וְעָנָךְ יִסְגּוּן וְכַסְפָּא וְדַהֲבָא יִסְגֵּא לָךְ וְכֹל דִּי לָךְ יִסְגֵּא:", "onk_en": "And your cattle and your sheep multiply, and silver and gold multiply for you, and everything you own multiplies.", "pj": "וְתוֹרֵיכוֹן וְעָנֵיכוֹן יִסְגוּן וְכַסְפָּא וְדַהֲבָא יִסְגֵי לְכוֹן וְכָל דִּילְכוֹן יִסְגֵי", "pj_en": "and your oxen and sheep are multiplied, and silver and gold are increased to you, and all things you have are multiplied,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 14, "aliyah": 2, "heb": "וְרָ֖ם לְבָבֶ֑ךָ וְשָֽׁכַחְתָּ֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ הַמּוֹצִיאֲךָ֛ מֵאֶ֥רֶץ מִצְרַ֖יִם מִבֵּ֥ית עֲבָדִֽים׃", "onk": "וִירִים לִבָּךְ וְתִנְשֵׁי יָת <b>דַּחַלְתָּא<\/b> דַיְיָ אֱלָהָךְ דִּי אַפְּקָךְ מֵאַרְעָא דְמִצְרַיִם מִבֵּית עַבְדוּתָא:", "onk_en": "And your pride increases, and you forget [<b>the fear of<\/b>] Adonoy, your God, Who took you out of the land of Egypt, from the house of slavery;", "pj": "וְיִתְרָם לִבְּכוֹן וְתִתְנְשׁוּן יַת דַּחַלְתָּא דַיְיָ אֱלָהָכוֹן דְּאַפֵּיקְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם מִבֵּית שִׁעֲבּוּד עַבְדַיָא", "pj_en": "your heart be lifted up, and you forget the fear of the Lord your God, who brought you out free from the land of Mizraim, from the house of the affliction of slaves;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 15, "aliyah": 2, "heb": "הַמּוֹלִ֨יכְךָ֜ בַּמִּדְבָּ֣ר&thinsp;<b>׀<\/b> הַגָּדֹ֣ל וְהַנּוֹרָ֗א נָחָ֤שׁ&thinsp;<small>׀<\/small>&thinsp;שָׂרָף֙ וְעַקְרָ֔ב וְצִמָּא֖וֹן אֲשֶׁ֣ר אֵֽין־מָ֑יִם הַמּוֹצִ֤יא לְךָ֙ מַ֔יִם מִצּ֖וּר הַֽחַלָּמִֽישׁ׃", "onk": "דְּדַבְּרָךְ בְּמַדְבְּרָא רַבָּא וּדְחִילָא <b>אֲתַר חֵיוָן קָלָן וְעַקְרַבִּין וּבֵית צַחֲוָנָא אֲתַר<\/b> דִּי לֵית מַיָּא דְּאַפֵּק לָךְ מַיָּא מִטִּנָּרָא <b>תַּקִּיפָא<\/b>:", "onk_en": "Who led you through the wilderness—the great and awesome[one]—[<b>a place of<\/b>] snake[<b>s<\/b>], serpent[<b>s<\/b>] and scorpion[<b>s<\/b>], and thirst[<b>ing<\/b>] [<b>a place<\/b>] where there is no water; Who took water out for you from solid [<b>mighty<\/b>] rock;", "pj": "דְּדַבְּרָךְ בְּרַחֲמִין בְּמַדְבְּרָא רַבָּא וּדְחֵילָא אֲתַר מָלֵי חֵיוָן קָלִין וְעַקְרַבִּין עַקְצִין וּבֵית צַחְוָונָא אֲתַר דְּלֵית מוֹי דְּאַפֵּיק לָךְ מוֹי מִשָׁמִיר טִנְרָא", "pj_en": "who led thee in mercy through that great and fearful desert, a place abounding in burning serpents and scorpions with stings, a place where there is thirst but no water; but (where) He brought thee forth water out of the hard rock,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 16, "aliyah": 2, "heb": "הַמַּאֲכִ֨לְךָ֥ מָן֙ בַּמִּדְבָּ֔ר אֲשֶׁ֥ר לֹא־יָדְע֖וּן אֲבֹתֶ֑יךָ לְמַ֣עַן עַנֹּֽתְךָ֗ וּלְמַ֙עַן֙ נַסֹּתֶ֔ךָ לְהֵיטִֽבְךָ֖ בְּאַחֲרִיתֶֽךָ׃", "onk": "דְּאוֹכָלָךְ מַנָּא בְּמַדְבְּרָא דִּי לָא יָדְעוּן אֲבָהָתָךְ בְּדִיל לְעַנָּיוּתָךְ וּבְדִיל לְנַסָּיוּתָךְ לְאוֹטָבָא לָךְ בְּסוֹפָךְ:", "onk_en": "Who fed you <i>mon<\/i> in the wilderness that your forefathers had not known, in order to oppress you and in order to test you, to ultimately benefit you—", "pj": "דְּאוֹכְלָךְ מַנָא בְּמַדְבְּרָא דְּלָא יַדְעוּן אַבְהָתָךְ מִן בִּגְלַל לְסַגְפוּתָךְ וּמִן בִּגְלַל לְנַסְיוֹתָךְ לְאוֹטָבָא לָךְ בְּסוֹפָךְ", "pj_en": "and fed thee in the desert with manna which thy fathers knew not, to humble thee and to prove thee, that He may do thee good in thine end.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 17, "aliyah": 2, "heb": "וְאָמַרְתָּ֖ בִּלְבָבֶ֑ךָ כֹּחִי֙ וְעֹ֣צֶם יָדִ֔י עָ֥שָׂה לִ֖י אֶת־הַחַ֥יִל הַזֶּֽה׃", "onk": "וְתֵימַר בְּלִבָּךְ חֵילִי וּתְקֵף יְדִי קְנוֹ לִי יָת נִכְסַיָּא הָאִלֵּין:", "onk_en": "And you think, ‘‘My strength and the power of my hand have acquired this wealth for me.’’", "pj": "הֲווֹ זְהִירִין דְּלָא תֵימְרוּן בְּלִבְּכוֹן חֵילָן וּתְקוֹף יְדָן קָנוּ לָן יַת נִכְסַיָא הָאִילֵין", "pj_en": "Beware that you say not in your heart, Our strength and the might of our hands have obtained us all these riches;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 18, "aliyah": 2, "heb": "וְזָֽכַרְתָּ֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ כִּ֣י ה֗וּא הַנֹּתֵ֥ן לְךָ֛ כֹּ֖חַ לַעֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת־בְּרִית֛וֹ אֲשֶׁר־נִשְׁבַּ֥ע לַאֲבֹתֶ֖יךָ כַּיּ֥וֹם הַזֶּֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִדְכַּר יָת יְיָ אֱלָהָךְ אֲרֵי הוּא יָהֵב לָךְ עֵצָה לְמִקְנֵי נִכְסִין בְּדִיל לְקַיָּמָא יָת קְיָמֵיהּ דִּי קַיִּים לַאֲבָהָתָךְ כְּיוֹמָא הָדֵין:", "onk_en": "Recall Adonoy, your God, for it is He Who gives you counsel to acquire wealth, in order to establish His covenant that He swore to your forefathers this day.", "pj": "וְתֶהֱווֹן דְּכִירִין יַת יְיָ אֱלָהָכוֹן אֲרוּם הוּא דִּיהַב לְכוֹן מִלְכָּא לְמִקְנֵי נִיכְסִין מִן בִּגְלַל לְקַיָימָא יַת קְיָימֵיהּ דְּקַיֵּים לְאַבְהַתְכוֹן כִּזְמַן יוֹמָא הָדֵין", "pj_en": "but remember the Lord your God; for He it is who giveth thee counsel whereby to get wealth; that He may confirm the covenant which He sware to your fathers at the time of this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 19, "aliyah": 2, "heb": "וְהָיָ֗ה אִם־שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ וְהָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַעֲבַדְתָּ֖ם וְהִשְׁתַּחֲוִ֣יתָ לָהֶ֑ם הַעִדֹ֤תִי בָכֶם֙ הַיּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּן׃", "onk": "וִיהֵי אִם מִנְשָׁאָה תִנְשֵׁי יָת <b>דַּחַלְתָּא<\/b> דַיְיָ אֱלָהָךְ וּתְהַךְ בָּתַר טַעֲוַת עַמְמַיָּא וְתִפְלְחִנּוּן וְתִסְגּוּד לְהוֹן אַסְהֵדִית בְּכוֹן יוֹמָא דֵין אֲרֵי מֵיבַד תֵּיבְדוּן:", "onk_en": "When and if you forget [<b>the fear of<\/b>] Adonoy, your God, and follow other gods, and serve them and bow to them, I testify about you today that you will surely be destroyed.", "pj": "וִיהֵי אִין מִנְשָׁא תִּינְשָׁא יַת דַּחַלְתָּא דַיְיָ אֱלָהָכוֹן וּתְהָכוּן בָּתַר טַעֲוַות עַמְמַיָא וְתִפְלְחִינוּן וְתִסְגְּדוּן לְהוֹן אַסְהָדִית עֲלֵיכוֹן יוֹמָא דֵין אֲרוּם מֵיבַד תֵּיבְדוּן", "pj_en": "For it shall be that if you forget the fear of the Lord your God, and go after the idols of the Gentiles, to serve and worship them, I testify against you this day, you will surely perish;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 20, "aliyah": 2, "heb": "כַּגּוֹיִ֗ם אֲשֶׁ֤ר יְהֹוָה֙ מַאֲבִ֣יד מִפְּנֵיכֶ֔ם כֵּ֖ן תֹּאבֵד֑וּן עֵ֚קֶב לֹ֣א תִשְׁמְע֔וּן בְּק֖וֹל יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "כְּעַמְמַיָּא דִּי יְיָ מֹאבִיד מִקָּדָמֵיכוֹן כֵּן תֵּיבְדוּן חֳלַף דִּלָא קַבֶּלְתּוּן <b>בְּמֵימְרָא<\/b> דַּיְיָ אֱלָהֲכוֹן:", "onk_en": "Like the nations that Adonoy is destroying before you, so will you be destroyed, as a consequence of your not heeding [<b>the word of<\/b>] Adonoy, your God.", "pj": "הֵי כְעַמְמַיָא דַיְיָ מַגְלֵי מִן קֳדָמֵיכוֹן הֵיכְדֵין תֵּיבְדוּן חוֹלַף דְּלָא קַבֵּילְתּוּן לְמֵימְרָא דַּיְיָ אֱלָהָכוֹן", "pj_en": "as the peoples which the Lord your God disperseth before you, so will you perish, because you were not obedient to the Word of the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 1, "aliyah": 2, "heb": "שְׁמַ֣ע יִשְׂרָאֵ֗ל אַתָּ֨ה עֹבֵ֤ר הַיּוֹם֙ אֶת־הַיַּרְדֵּ֔ן לָבֹא֙ לָרֶ֣שֶׁת גּוֹיִ֔ם גְּדֹלִ֥ים וַעֲצֻמִ֖ים מִמֶּ֑ךָּ עָרִ֛ים גְּדֹלֹ֥ת וּבְצֻרֹ֖ת בַּשָּׁמָֽיִם׃", "onk": "שְׁמַע יִשְׂרָאֵל אַתְּ עָבֵר יוֹמָא דֵין יָת יַרְדְּנָא לְמֵעַל לְמֵירַת עַמְמִין רַבְרְבִין וְתַקִּיפִין מִנָּךְ קִרְוִין רַבְרְבָן וּכְרִיכָן עַד <b>צֵית<\/b> שְׁמַיָּא:", "onk_en": "Listen, Yisroel! You are today crossing the Yardein to come inherit nations greater and more powerful than you; cities great and fortified to the [<b>height of the<\/b>] sky.", "pj": "שְׁמָעוּ יִשְרָאֵל אַתּוּן עָבְרִין יוֹמָא דֵין יַת יוֹרְדְּנָא לְמֵיעוּל לְמֵירוּת עַמְמִין רַבְרְבִין וְתַקִּיפִין מִנְכוֹן קִרְוִין רַבְרְבִין וּכְרִיכַן עַד צֵית שְׁמַיָא", "pj_en": "Hear, Israel: you are this day (about) to pass Jordana to enter in and possess (the country of) nations greater and stronger than you, and cities many, and fortified to the height of heaven.", "tj": "", "tj_en": "", "rashi": "<b>גדלים ועצמים ממך.<\/b> אַתָּה עָצוּם וְהֵם עֲצוּמִים מִמְּךָ (ספרי דברים י\"א):", "rashi_en": "גדלים ועצמים ממך [NATIONS] GREATER AND MIGHTIER THAN THYSELF — Ye are mighty but they are still mightier than you (cf. Rashi on Deuteronomy 11:24)."}, {"ch": 9, "v": 2, "aliyah": 2, "heb": "עַֽם־גָּד֥וֹל וָרָ֖ם בְּנֵ֣י עֲנָקִ֑ים אֲשֶׁ֨ר אַתָּ֤ה יָדַ֙עְתָּ֙ וְאַתָּ֣ה שָׁמַ֔עְתָּ מִ֣י יִתְיַצֵּ֔ב לִפְנֵ֖י בְּנֵ֥י עֲנָֽק׃", "onk": "עַם רַב וְתַקִּיף בְּנֵי <b>גִבָּרַיָּא<\/b> דִּי אַתְּ יְדַעַתְּ וְאַתְּ שְׁמַעַתְּ מָן יִכּוּל לְמֵיקַם קֳדָם בְּנֵי <b>גִבָּרַיָּא<\/b>:", "onk_en": "A great and powerful people, descendants of the Anokim [<b>giants<\/b>], about whom you know and heard, ‘‘who can stand up to the descendants of Anok?’’", "pj": "עַם חָסִין וְגֵיוְתָן הֵי כְּגִנְבָּרַיָא דְּאַתּוּן יְדַעְתּוּן וְאַתּוּן שְׁמַעְתּוּן מַן יֵיכוּל לְמֵיקָם קֳדָם בְּנוֹי גִבָּרַיָא", "pj_en": "A people (are they) strong and tall as the giants whom you know, and of whom you have heard (say), Who can stand before the sons of the giants?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 3, "aliyah": 2, "heb": "וְיָדַעְתָּ֣ הַיּ֗וֹם כִּי֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ הֽוּא־הָעֹבֵ֤ר לְפָנֶ֙יךָ֙ אֵ֣שׁ אֹֽכְלָ֔ה ה֧וּא יַשְׁמִידֵ֛ם וְה֥וּא יַכְנִיעֵ֖ם לְפָנֶ֑יךָ וְהֽוֹרַשְׁתָּ֤ם וְהַֽאֲבַדְתָּם֙ מַהֵ֔ר כַּאֲשֶׁ֛ר דִּבֶּ֥ר יְהֹוָ֖ה לָֽךְ׃", "onk": "וְתִדַּע יוֹמָא דֵין אֲרֵי יְיָ אֱלָהָךְ הוּא דְעִבַר קֳדָמָךְ <b>מֵימְרֵיהּ<\/b> אֶשָּׁא אָכְלָא הוּא יְשֵׁצִנּוּן וְהוּא יְתָרֵכִנּוּן קֳדָמָךְ וּתְתָרֵכִנּוּן וְתוֹבְדִנּוּן בִּפְרִיעַ כְּמָא דִי מַלִּיל יְיָ לָךְ:", "onk_en": "You know today that Adonoy, your God, is the One crossing before you, [<b>His word is<\/b>] a consuming fire, He will destroy them and He will subdue them before you; you will expel them and destroy them quickly, as Adonoy promised for you.", "pj": "וְתִנְדְּעוּן יוֹמָא דֵין אֲרוּם יְיָ אֱלָהָכוֹן שְׁכִינַת יְקָרֵיהּ מְטַיְילָא קֳדָמֵיכוֹן מֵימְרֵיהּ אֵישָׁא אָכְלָא הוּא יְשֵׁצִינוּן וְהוּא יְתָרֵיכִינוּן מִן קֳדָמֵיכוֹן וּתְרָכִינוּן וְתוֹבְדִינוּן בְּסַרְהוֹבַיָא הֵיכְמָא דְמַלֵּיל יְיָ אֱלָהָכוֹן לְכוֹן", "pj_en": "Know, therefore, today that the Lord your God, whose glorious Shekinah goeth before you, whose Word is a consuming fire, will destroy them and drive them out before you; so shall you drive them out, and destroy them quickly, as the Lord your God hath said to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 4, "aliyah": 3, "heb": "אַל־תֹּאמַ֣ר בִּלְבָבְךָ֗ בַּהֲדֹ֣ף יְהֹוָה֩ אֱלֹהֶ֨יךָ אֹתָ֥ם&thinsp;<small>׀<\/small>&thinsp;מִלְּפָנֶ֘יךָ֮ לֵאמֹר֒ בְּצִדְקָתִי֙ הֱבִיאַ֣נִי יְהֹוָ֔ה לָרֶ֖שֶׁת אֶת־הָאָ֣רֶץ הַזֹּ֑את וּבְרִשְׁעַת֙ הַגּוֹיִ֣ם הָאֵ֔לֶּה יְהֹוָ֖ה מוֹרִישָׁ֥ם מִפָּנֶֽיךָ׃", "onk": "לָא תֵימַר בְּלִבָּךְ בִּדְיִתְּבַר יְיָ אֱלָהָךְ יָתְהוֹן מִקֳּדָמָךְ לְמֵימַר <b>בְּזָכוּתִי<\/b> אַעֲלַנִי יְיָ לְמֵירַת יָת אַרְעָא הָדָא <b>וּבְחוֹבֵי<\/b> עַמְמַיָּא הָאִלֵּין יְיָ מְתָרֵךְ לְהוֹן מִקֳּדָמָךְ:", "onk_en": "Do not think, when Adonoy, your God, smashes them before you, saying: ‘‘Because of my righteousness [<b>merit<\/b>] has Adonoy brought me to inherit this land,’’ and because of the wickedness [<b>sins<\/b>] of these nations is Adonoy expelling them before you.", "pj": "לָא תֵימְרוּן בְּלִבְּכוֹן כַּד יַדְחֵי יְיָ אֱלָהָכוֹן יַתְהוֹן מִן קֳדָמֵיכוֹן לְמֵימָר בִּזְכוּתִי אַעֲלַנִי יְיָ לְמֵירַת יַת אַרְעָא הָדָא וּבְחוֹבֵי עַמְמַיָא הָאִלֵין יְיָ מְתַרְכְהוֹן מִן קֳדָמֵיכוֹן", "pj_en": "Speak not in your heart when the Lord your God hath driven them away from before you saying, For the sake of my righteousness hath the Lord brought me in to inherit this land; for on account of the sins of these people the Lord driveth them out before you.", "tj": "", "tj_en": "", "rashi": "<b>אל תאמר בלבבך.<\/b> צִדְקָתִי וְרִשְׁעַת הַגּוֹיִם גָּרְמוּ:", "rashi_en": "אל תאמר בלבבך SAY NOT IN THY HEART, “My righteousness and the wickedness of these nations brought it about that I possess the land;"}, {"ch": 9, "v": 5, "aliyah": 3, "heb": "לֹ֣א בְצִדְקָתְךָ֗ וּבְיֹ֙שֶׁר֙ לְבָ֣בְךָ֔ אַתָּ֥ה בָ֖א לָרֶ֣שֶׁת אֶת־אַרְצָ֑ם כִּ֞י בְּרִשְׁעַ֣ת&thinsp;<b>׀<\/b> הַגּוֹיִ֣ם הָאֵ֗לֶּה יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ מוֹרִישָׁ֣ם מִפָּנֶ֔יךָ וּלְמַ֜עַן הָקִ֣ים אֶת־הַדָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהֹוָה֙ לַאֲבֹתֶ֔יךָ לְאַבְרָהָ֥ם לְיִצְחָ֖ק וּֽלְיַעֲקֹֽב׃", "onk": "לָא <b>בְזָכוּתָךְ<\/b> וּבְקַשִּׁיטוּת לִבָּךְ אַתְּ עָלֵל לְמֵירַת יָת אַרְעֲהוֹן אֲרֵי <b>בְּחוֹבֵי<\/b> עַמְמַיָּא הָאִלֵּין יְיָ אֱלָהָךְ מְתָרֶכְהוֹן מִקֳּדָמָךְ וּבְדִיל לַאֲקָמָא יָת פִּתְגָּמָא דִּי קַיִּים יְיָ לַאֲבָהָתָךְ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב:", "onk_en": "Not because of your righteousness [<b>merit<\/b>] and the uprightness of your heart are you coming to inherit their land. Rather, because of the wickedness [<b>sins<\/b>] of these nations is Adonoy, your God, expelling them before you, and in order to fulfill the matter that Adonoy swore to your forefathers—to Avrohom, to Yitzchok, and to Yaakov.", "pj": "לָא מְטוּל זַכְוַותְכוֹן וּבַתְרִיצוּת לִבְּכוֹן אַתּוּן עַלְלִין לְמֵירוּת יַת אַרְעֲהוֹן אֲרוּם בְּחוֹבֵי עַמְמַיָא הָאִלֵּין יְיָ אֱלָהָכוֹן מְתָרֵךְ יַתְהוֹן מִן קֳדָמֵיכוֹן וּמִן בִּגְלַל לְקַיְימָא יַת פִּתְגָמָא דְקַיֵּים יְיָ לְאַבְהַתְכוֹן לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב", "pj_en": "Not for your righteousness, or the integrity of your heart, will you be brought in to possess their land, but for the sins of these people the Lord your God driveth them away before you; and that the Lord may establish the word which He sware to Abraham, Izhak, and Jakob, your fathers.", "tj": "", "tj_en": "", "rashi": "<b>לא בצדקתך, אתה בא לרשת, כי ברשעת הגוים.<\/b> הֲרֵי כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא:", "rashi_en": "לא בצדקתך אתה בא לרשת … כי ברשעת הגוים NOT FOR THY RIGHTEOUSNESS … DOST THOU GO TO POSSESS [THEIR LAND], but (כי) for the wickedness of these nations. — Here you have the word כי used in the sense of \"but\"."}, {"ch": 9, "v": 6, "aliyah": 3, "heb": "וְיָדַעְתָּ֗ כִּ֠י לֹ֤א בְצִדְקָֽתְךָ֙ יְהֹוָ֣ה אֱ֠לֹהֶ֠יךָ נֹתֵ֨ן לְךָ֜ אֶת־הָאָ֧רֶץ הַטּוֹבָ֛ה הַזֹּ֖את לְרִשְׁתָּ֑הּ כִּ֥י עַם־קְשֵׁה־עֹ֖רֶף אָֽתָּה׃", "onk": "וְתִדַּע אֲרֵי לָא בְזָכוּתָךְ יְיָ אֱלָהָךְ יָהֵב לָךְ יָת אַרְעָא טַבְתָא הָדָא לְמֵירְתַהּ אֲרֵי עַם קְשֵׁי קְדַל אָתְּ:", "onk_en": "Know that not because of your righteousness is Adonoy, your God, giving you this good land to inherit, for you are a stubborn people.", "pj": "וְתִנְדְּעוּן אֲרוּם לָא בִּזְכוּתְכוֹן יְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן יַת אַרְעָא מְשַׁבְּחָא הֲדָא לְמֵירְתָהּ אֲרוּם עַם קְשֵׁי קְדַל אַתּוּן", "pj_en": "Know, therefore, that it is not on account of your merit that the Lord your God giveth you this glorious land to possess it; for a hardjnecked people are you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 7, "aliyah": 3, "heb": "זְכֹר֙ אַל־תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר־הִקְצַ֛פְתָּ אֶת־יְהֹוָ֥ה אֱלֹהֶ֖יךָ בַּמִּדְבָּ֑ר לְמִן־הַיּ֞וֹם אֲשֶׁר־יָצָ֣אתָ&thinsp;<b>׀<\/b> מֵאֶ֣רֶץ מִצְרַ֗יִם עַד־בֹּֽאֲכֶם֙ עַד־הַמָּק֣וֹם הַזֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם־יְהֹוָֽה׃", "onk": "הֱוֵי דְכִיר לָא תִנְשֵׁי יָת דִּי אַרְגֶּזְתָּא קֳדָם יְיָ אֱלָהָךְ בְּמַדְבְּרָא לְמִן יוֹמָא דִּי נְפַקְתָּא מֵאַרְעָא דְמִצְרַיִם עַד מֵיתֵיכוֹן עַד אַתְרָא הָדֵין מְסָרְבִין הֲוֵיתוּן קֳדָם יְיָ:", "onk_en": "Recall, do not forget, how you angered Adonoy, your God, in the wilderness; from the day you left the land of Egypt until you arrived at this place you have been defiers with Adonoy.", "pj": "הֲווֹ דְכִירִין לָא תִתְנְשׁוּן יַת דְּאַרְגַּזְתּוּן קֳדָם יְיָ אֱלָהָכוֹן בְּמַדְבְּרָא לְמִן יוֹמָא דִנְפַקְתּוּן מֵאַרְעָא דְמִצְרַיִם עַד מֵיתֵיכוֹן עַד אַתְרָא הָדֵין מְסַרְבִין הֲוֵיתוּן קֳדָם יְיָ", "pj_en": "Be mindful and forget not how you have provoked unto anger, before the Lord in the wilderness, from the day that you went out of the land of Mizraim until you came to this place, and have been perverse before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 8, "aliyah": 3, "heb": "וּבְחֹרֵ֥ב הִקְצַפְתֶּ֖ם אֶת־יְהֹוָ֑ה וַיִּתְאַנַּ֧ף יְהֹוָ֛ה בָּכֶ֖ם לְהַשְׁמִ֥יד אֶתְכֶֽם׃", "onk": "וּבְחֹרֵב אַרְגֶּזְתּוּן קֳדָם יְיָ וַהֲוָה רְגַז <b>מִן קֳדָם<\/b> יְיָ בְּכוֹן לְשֵׁצָאָה יָתְכוֹן:", "onk_en": "And in Choreiv you angered Adonoy, and [<b>from before<\/b>] Adonoy was infuriated with you to destroy you.", "pj": "וּבְחוֹרֵב אַרְגֵזְתּוּן קֳדָם יְיָ וַהֲוָה רוּגְזָא מִן קֳדָם יְיָ בְּכוֹן לְשֵׁיצְיָא יַתְכוֹן", "pj_en": "(Even) at Horeb you provoked the Lord to anger, so that there was wrath before the Lord against you, to destroy you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 9, "aliyah": 3, "heb": "בַּעֲלֹתִ֣י הָהָ֗רָה לָקַ֜חַת לוּחֹ֤ת הָֽאֲבָנִים֙ לוּחֹ֣ת הַבְּרִ֔ית אֲשֶׁר־כָּרַ֥ת יְהֹוָ֖ה עִמָּכֶ֑ם וָאֵשֵׁ֣ב בָּהָ֗ר אַרְבָּעִ֥ים יוֹם֙ וְאַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּמַ֖יִם לֹ֥א שָׁתִֽיתִי׃", "onk": "בְּמִסְּקִי לְטוּרָא לְמִסַּב לוּחֵי אַבְנַיָּא לוּחֵי קְיָמָא דִּי גְזַר יְיָ עִמְּכוֹן וִיתֵבִית בְּטוּרָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן לַחְמָא לָא אֲכָלִית וּמַיָּא לָא אִשְׁתֵּיתִי:", "onk_en": "When I went up the mountain to take the stone tablets, the tablets of the covenant that Adonoy made with you, I remained on the mountain forty days and forty nights; I ate no bread and drank no water.", "pj": "כַּד סְלֵיקַת לְטַוְורָא לְמִיסַב לוּחֵי מַרְמִירָא לוּחֵי קְיָימָא דְגָזַר יְיָ עִמְכוֹן וּשְׁהִיַּית בְּטַוְורָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילַוָון לַחְמָא לָא אֲכָלִית וּמַיָא לָא אִשְׁתֵּיתִי", "pj_en": "When I had gone up to the mountain to receive the tables of marble, the tables of the covenant which the Lord had made with you, and I tarried on the mountain forty days and forty nights, I ate no bread, I drank no water;", "tj": "", "tj_en": "", "rashi": "<b>ואשב בהר.<\/b> אֵין יְשִׁיבָה אֶלָּא לְשׁוֹן עַכָּבָה (מגילה כ\"א):", "rashi_en": "ואשב בהר — The verb ישב here means only \"staying\" (not \"sitting\"; it means: I stayed on the mountain) (Megillah 21a)."}, {"ch": 9, "v": 10, "aliyah": 3, "heb": "וַיִּתֵּ֨ן יְהֹוָ֜ה אֵלַ֗י אֶת־שְׁנֵי֙ לוּחֹ֣ת הָֽאֲבָנִ֔ים כְּתֻבִ֖ים בְּאֶצְבַּ֣ע אֱלֹהִ֑ים וַעֲלֵיהֶ֗ם כְּֽכׇל־הַדְּבָרִ֡ים אֲשֶׁ֣ר דִּבֶּר֩ יְהֹוָ֨ה עִמָּכֶ֥ם בָּהָ֛ר מִתּ֥וֹךְ הָאֵ֖שׁ בְּי֥וֹם הַקָּהָֽל׃", "onk": "וִיהַב יְיָ לִי יָת תְּרֵין לוּחֵי אַבְנַיָּא כְּתִיבִין בְּאֶצְבְּעָא דַיְיָ וַעֲלֵיהוֹן כְּכָל פִּתְגָּמַיָּא דִּי מַלִּיל יְיָ עִמְּכוֹן בְּטוּרָא מִגּוֹ אֶשָּׁתָא בְּיוֹמָא דִקְהָלָא:", "onk_en": "Adonoy gave me the two stone tablets written with God’s finger and upon them all the statements that Adonoy addressed to you on the mountain from within the fire, on the day of assembly.", "pj": "וִיהַב יְיָ לִי תְּרֵין לוּחֵי מַרְמִירָא כְּתִיבִין בְּאִיצְבְּעָא דַיְיָ וְעִילַוֵּיהוֹן כְּתִיב הֵי כְּכָל פִּתְגָמַיָא דְמַלֵּיל יְיָ עִמְכוֹן בְּטַוְורָא מִגּוֹ אֵישָׁתָא בְּיוֹם כְּנִישַׁת קְהָלָא", "pj_en": "and the Lord gave to me the two tables of marble inscribed by the finger of the Lord, and upon which was written according to all the words which the Lord spake with you on the mount from the midst of the fire in the day of the assembling of the congregation.", "tj": "", "tj_en": "", "rashi": "<b>לוחת.<\/b> לוחת כְּתִיב שֶׁשְּׁתֵיהֶן שָׁווֹת (תנחומא):", "rashi_en": "לוחת TABLETS — This word is written without a ו before the ת, so that it may be read לוחת (a singular form), to indicate that both of them were alike (Midrash Tanchuma, Eikev 10; cf. Rashi on Exodus 31:18 and Note thereon)."}, {"ch": 9, "v": 11, "aliyah": 3, "heb": "וַיְהִ֗י מִקֵּץ֙ אַרְבָּעִ֣ים י֔וֹם וְאַרְבָּעִ֖ים לָ֑יְלָה נָתַ֨ן יְהֹוָ֜ה אֵלַ֗י אֶת־שְׁנֵ֛י לֻחֹ֥ת הָאֲבָנִ֖ים לֻח֥וֹת הַבְּרִֽית׃", "onk": "וַהֲוָה מִסּוֹף אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן יְהַב יְיָ לִי יָת תְּרֵין לוּחֵי אַבְנַיָּא לוּחֵי קְיָמָא:", "onk_en": "When, at the end of forty days and forty nights, Adonoy gave me the two stone tablets, the covenant tablets,", "pj": "וַהֲוָה מִסּוֹף אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילַוָן יְהַב יְיָ לִי יַת תְּרֵין לוּחֵי מַרְמִירָא לוּחֵי קְיָימָא", "pj_en": "But at the end of the forty days and nights, when the Lord gave to me the two tables of marble, the tables of the covenant,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 12, "aliyah": 3, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֵלַ֗י ק֣וּם רֵ֤ד מַהֵר֙ מִזֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִמִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן־הַדֶּ֙רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔ם עָשׂ֥וּ לָהֶ֖ם מַסֵּכָֽה׃", "onk": "וַאֲמַר יְיָ לִי קוּם חוּת בִּפְרִיעַ מִכָּא אֲרֵי חַבִּיל עַמָּךְ דִּי אַפֶּקְתָּא מִמִּצְרָיִם סָטוּ בִּפְרִיעַ מִן אָרְחָא דִּי פַקֶּדְתִּנּוּן עֲבָדוּ לְהוֹן מַתְּכָא:", "onk_en": "Adonoy said to me, ‘‘Get ready! Go down quickly from here, because your people has corrupted—whom you took out of Egypt; they have veered swiftly from the way that I commanded them; they made them a molten image.", "pj": "וַאֲמַר יְיָ לִי קוּם חוּת בִּפְרִיעַ מִכָּא אֲרוּם חַבִּילוּ אָרְחַתְהוֹן עַמָּא דְאִתְקַרְיָין עַל שְׁמָךְ דְּאַפֵּיקְתָּא מֵאַרַע דְּמִצְרָיִם סָטוּ בִּפְרִיעַ מִן אוֹרְחָא דְפַקֵידְתִּינוּן בְּסִינַי לָא תַעַבְּדוּן לְכוֹן צְלַם וְצוּרָה וַעֲבָדוּ לְהוֹן מַתְּכָא", "pj_en": "the Lord said to me, Arise, go down quickly from hence, for the people who are called by thy name, whom I led forth from the land of Mizraim, have corrupted their way; {Onq., Nf. MT; they have soon gone aside from the way that I commanded them on Sinai, saying, Make not to you a likeness or image; for they have made for themselves a molten (form).}", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 13, "aliyah": 3, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֵלַ֣י לֵאמֹ֑ר רָאִ֙יתִי֙ אֶת־הָעָ֣ם הַזֶּ֔ה וְהִנֵּ֥ה עַם־קְשֵׁה־עֹ֖רֶף הֽוּא׃", "onk": "וַאֲמַר יְיָ לִי לְמֵימַר <b>גֱּלִי קֳדָמַי<\/b> יָת עַמָּא הָדֵין וְהָא עַם קְשֵׁי קְדַל הוּא:", "onk_en": "Adonoy said to me, to say, ‘‘I have seen this people [<b>have been revealed berore Me<\/b>], and look, it is a stubborn people!", "pj": "וַאֲמַר יְיָ לִי לְמֵימָר גְּלֵי קֳדָמַי סוּרְחָנוּת עַמָא הָדֵין וְהָא עַם קְשֵׁי קְדַל הוּא", "pj_en": "And the Lord spake to me saying, the sin of this people is revealed before Me, and behold this people is hard-necked:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 14, "aliyah": 3, "heb": "הֶ֤רֶף מִמֶּ֙נִּי֙ וְאַשְׁמִידֵ֔ם וְאֶמְחֶ֣ה אֶת־שְׁמָ֔ם מִתַּ֖חַת הַשָּׁמָ֑יִם וְאֶֽעֱשֶׂה֙ אֽוֹתְךָ֔ לְגוֹי־עָצ֥וּם וָרָ֖ב מִמֶּֽנּוּ׃", "onk": "אַנַּח <b>בָּעוּתָךְ מִקֳּדָמַי<\/b> וֶאֱשֵׁצִנּוּן וְאֶמְחֵי יָת שִׁמְהוֹן מִתְּחוֹת שְׁמַיָּא וְאֶעְבֵּד יָתָךְ לְעַם תַּקִּיף וְסַגִּי מִנְּהוֹן:", "onk_en": "Leave Me alone and let Me destroy them and eliminate their name from beneath the sky, and let Me make you into a nation more powerful and numerous than they.’’", "pj": "אֲנַח בָּעוּתָךְ מִן קֳדָמַי וְאֵישֵׁיצִינוּן וְאִמְחֵי יַת שׁוּמְהוֹן מִתְּחוֹת שְׁמַיָא וְאַעֲבֵיד יָתָךְ לְעַם תַּקִּיף וְסַגִּי מִנְהוֹן", "pj_en": "desist from thy prayer to Me, that I may destroy them, and blot out their name from under the heavens; and I will make of thee a people stronger and greater than they.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 15, "aliyah": 3, "heb": "וָאֵ֗פֶן וָֽאֵרֵד֙ מִן־הָהָ֔ר וְהָהָ֖ר בֹּעֵ֣ר בָּאֵ֑שׁ וּשְׁנֵי֙ לוּחֹ֣ת הַבְּרִ֔ית עַ֖ל שְׁתֵּ֥י יָדָֽי׃", "onk": "וְאִתְפְּנֵיתִי וּנְחָתִית מִן טוּרָא וְטוּרָא בָּעֵר בְּאֶשָּׁתָא וּתְרֵין לוּחֵי קְיָמָא עַל תַּרְתֵּין יְדָי:", "onk_en": "I turned and descended the mountain, and the mountain was burning with fire; and the two covenant tablets were on my two hands.", "pj": "וְכַוְנִית וּנְחָתִית מִן טַוְורָא וְטַוְורָא דָלֵיק בְּאֵישָׁתָא וּתְרֵין לוּחֵי קְיָימָא עַל תְּרֵין יְדָי", "pj_en": "And I prepared and went down from the mountain, and the mountain burned with fire; and the two tables of the covenant were upon my two hands.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 16, "aliyah": 3, "heb": "וָאֵ֗רֶא וְהִנֵּ֤ה חֲטָאתֶם֙ לַיהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם עֲשִׂיתֶ֣ם לָכֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן־הַדֶּ֕רֶךְ אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה אֶתְכֶֽם׃", "onk": "וַחֲזֵיתִי וְהָא חַבְתּוּן קֳדָם יְיָ אֱלָהֲכוֹן עֲבַדְתּוּן לְכוֹן עֵגֶל מַתְּכָא סְטֵתוּן בִּפְרִיעַ מִן אָרְחָא דִּי פַקִּיד יְיָ יָתְכוֹן:", "onk_en": "I beheld that you had just sinned to Adonoy, your God, you had made yourselves a molten calf; you had veered swiftly from the way that Adonoy had commanded you.", "pj": "וְחָמִית וְהָא סְרַחְתּוּן קֳדָם יְיָ אֱלָהָכוֹן עֲבַדְתּוּן לְכוֹן עֵיגַל מַתְּכָא סְטִיתוּן בִּפְרִיעַ מִן אָרְחָא דְפַקֵּיד יְיָ יַתְכוֹן", "pj_en": "And I saw, and, behold, you had sinned before the Lord your God; you had made for you a molten calf, and had quickly declined from the way which the Lord had commanded to you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 17, "aliyah": 3, "heb": "וָאֶתְפֹּשׂ֙ בִּשְׁנֵ֣י הַלֻּחֹ֔ת וָֽאַשְׁלִכֵ֔ם מֵעַ֖ל שְׁתֵּ֣י יָדָ֑י וָאֲשַׁבְּרֵ֖ם לְעֵינֵיכֶֽם׃", "onk": "וַאֲחָדִית בִּתְרֵין לוּחַיָּא וּרְמִיתִנּוּן מֵעַל תַּרְתֵּין יְדָי וּתְבַרְתִּנּוּן לְעֵינֵיכוֹן:", "onk_en": "I grasped the two tablets and threw them from (upon) my two hands, and smashed them before your eyes.", "pj": "וַאֲחָדַת בִּתְרֵין לוּחַיָא וּטְלַקְתִּינוּן מֵעִלַוֵי תַּרְתֵּין יְדָי וּתְבַרְתִּינוּן וְאַתּוּן חַמְיַין כַּד לוּחַיָא מִיתְבְּרִין וְאַתְוָותָא פָּרְחִין", "pj_en": "And taking the two tables, I cast them from my two hands and broke them; and you looked on while the tables were broken and the letters fled away.", "tj": "וּתְפָשִית בִּתְרֵין לוּחַיָא וְטַלְקִית יַתְהוֹן:", "tj_en": "And I took both the tables and cast them down.", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 18, "aliyah": 3, "heb": "וָֽאֶתְנַפַּל֩ לִפְנֵ֨י יְהֹוָ֜ה כָּרִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְאַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּמַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כׇּל־חַטַּאתְכֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַעֲשׂ֥וֹת הָרַ֛ע בְּעֵינֵ֥י יְהֹוָ֖ה לְהַכְעִיסֽוֹ׃", "onk": "וְאִשְׁתַּטָּחִית קֳדָם יְיָ כְּקַדְמֵתָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן לַחְמָא לָא אֲכָלִית וּמַיָּא לָא אִשְׁתֵּיתִי עַל כָּל חוֹבֵיכוֹן דִּי חַבְתּוּן לְמֶעְבַּד דְּבִישׁ <b>קֳדָם<\/b> יְיָ לְאַרְגָּזָא <b>קֳדָמוֹהִי<\/b>:", "onk_en": "I prostrated myself before Adonoy as before, forty days and forty nights, bread I did not eat nor water did I drink; for all of your sin that you sinned by doing what is evil in [<b>before<\/b>] Adonoy’s eyes to anger [<b>before<\/b>] Him.", "pj": "וּבָעִית רַחֲמִין מִן קֳדָם יְיָ כַּד בְּקַדְמֵיתָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילַוָן לַחֲמָא לָא אָכְלִית וּמוֹי לָא אִשְׁתְּיַית מְטוּל כָּל חוֹבֵיכוֹן דְּחַבְתּוּן לְמֶעֱבַד דְּבִישׁ קֳדָם יְיָ לְאַרְגְּזָא קֳדָמוֹי", "pj_en": "But I prayed for mercy as at the first before the Lord; forty days and forty nights I ate no bread, nor drank water, for all your sin whereby you had sinned in doing what was evil before the Lord to provoke Him to anger.", "tj": "", "tj_en": "", "rashi": "<b>ואתנפל לפני ה' כראשנה ארבעים יום.<\/b> שֶׁנֶּאֱמַר (שמות ל\"ב) וְעַתָּה אֶעֱלֶה אֶל ה' אוּלַי אֲכַפְּרָה, בְּאוֹתָהּ עֲלִיָּה נִתְעַכַּבְתִּי אַרְבָּעִים יוֹם, נִמְצְאוּ כָלִים בְּכ\"ט בְּאָב, שֶׁהוּא עָלָה בִּשְׁמוֹנָה עָשָׂר בְּתַמּוּז, בּוֹ בַיּוֹם נִתְרַצָּה לְיִשְׂרָאֵל וְאָמַר לוֹ לְמֹשֶׁה פְּסָל לְךָ שְׁנֵי לֻחוֹת (שם ל\"ד) עָשָׂה עוֹד אַרְבָּעִים יוֹם, נִמְצְאוּ כָלִים בְּיוֹם הַכִּפּוּרִים, בּוֹ בַיּוֹם נִתְרַצָּה הַקָּבָּ\"ה לְיִשְׂרָאֵל בְּשִׂמְחָה וְאָמַר לוֹ לְמֹשֶׁה סָלַחְתִּי כִּדְבָרֶךָ (במדבר י\"ד), לְכָךְ הֻקְבַּע לִמְחִילָה וְלִסְלִיחָה, וּמִנַּיִן שֶׁנִּתְרַצָּה בְרָצוֹן שָׁלֵם, שֶׁנֶּאֱמַר בָּאַרְבָּעִים שֶׁל לוּחוֹת אַחֲרוֹנוֹת (דברים י') וְאָנֹכִי עָמַדְתִּי בָהָר כַּיָּמִים הָרִאשֹׁנִים, מַה הָרִאשׁוֹנִים בְּרָצוֹן אַף הָאַחֲרוֹנִים בְּרָצוֹן, אֱמֹר מֵעַתָּה אֶמְצָעִיִּים הָיוּ בְּכַעַס:", "rashi_en": "ואתנפל לפני ה׳ כראשנה ארבעים יום AND I FELL DOWN BEFORE THE LORD, AS AT THE FIRST, FORTY DAYS, as it is said (Exodus 32:30) “And now I will go up to the Lord, perhaps I may atone [for your sin]”. At that ascent, which was the second I made, I tarried there forty days — consequently these terminated on the twenty-ninth of Ab, since he had ascended on the eighteenth of Tammuz. On that same day in Ab He became reconciled with Israel and said to Moses (Exodus 34:1) “Hew thee out two tablets”. He stayed there another forty days; consequently these terminated on the Day of Atonement (the tenth of Tishri). On that same day, the Holy One, blessed be He, was gladly reconciled (i.e. completely reconciled) with Israel and said to Moses, I have forgiven according to thy word. On this account it was appointed for pardon and forgiveness. And whence do we know that He was reconciled with them with complete goodwill? Because it is stated in respect to the forty days of the last tablets (in respect to third period of forty days) (Deuteronomy 10:10), “And I stayed in the mountain according to the first days”! What was the case with the first days? They were passed in God’s goodwill! (for they had not yet committed the sin of worshipping the golden calf). So, too, the last forty days were in God’s goodwill! You must now say (admit) that the intervening forty days were passed in God’s anger (Midrash Tanchuma, Ki Tisa 31; cf. Rashi on Exodus 18:13)."}, {"ch": 9, "v": 19, "aliyah": 3, "heb": "כִּ֣י יָגֹ֗רְתִּי מִפְּנֵ֤י הָאַף֙ וְהַ֣חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהֹוָ֛ה עֲלֵיכֶ֖ם לְהַשְׁמִ֣יד אֶתְכֶ֑ם וַיִּשְׁמַ֤ע יְהֹוָה֙ אֵלַ֔י גַּ֖ם בַּפַּ֥עַם הַהִֽוא׃", "onk": "אֲרֵי דְחֵלִית מִקֳּדָם רָגְזָא וְחֵמְתָא דִּי רְגַז יְיָ עֲלֵיכוֹן לְשֵׁצָאָה יָתְכוֹן וְקַבִּיל יְיָ צְלוֹתִי אַף בְּזִמְנָא הַהִיא:", "onk_en": "Because I was afraid of the anger and the fury that Adonoy raged at you to destroy you; and Adonoy accepted my prayer that time as well.", "pj": "בֵּי הִיא זִמְנָא אִשְׁתַּלְחוּן מִן קֳדָם יְיָ חֲמֵשְׁתֵּי מַלְאָכַיָא מְחַבְּלַיָא לְחַבָּלָא יַת יִשְרָאֵל אַף וְחֵמָה וְקֶצֶף וּמַשְׁחִית וַחֲרוֹן כֵּיוַן דִּי שְׁמַע משֶׁה רַבְּהוֹן דְּיִשְרָאֵל אָזַל וְאַדְכַּר שְׁמָא רַבָּא וְיַקִּירָא וְאוֹקֵים מִקִּבְרֵהוֹן אַבְרָהָם וְיִצְחָק וְיַעֲקב וְקָמוֹן בִּצְלוֹתָא קֳדָם יְיָ וּמִן יַד אִתְכְּלִיאוּ תְּלַת מִנְהוֹן וְאִשְׁתַּיְירוּן תְּרֵין אַף וְחֵימָא בָּעָא משֶׁה רַחֲמִין וְאִיתְכְּלִיאוּ אוּף תְּרֵיהוֹן וְחָפַר שִיַיח בְּאַרְעָא דְמוֹאָב וּטְמַרְנוּן בִּשְׁבוּעַת שְׁמָא רַבָּא וּדְחֵילָא דְּהָכִין כְּתִיב אֲרוּם דְּחֵילִית מִן קֳדָם רוּגְזָא וְחֵימְתָא דִרְגַז יְיָ עֲלֵיכוֹן לִמְשֵׁצְיָא יַתְכוֹן וְקַבֵּיל יְיָ צְלוֹתִי אוּף בְּזִמְנָא הַהוּא", "pj_en": "At that time five destroying angels were sent from the Lord to destroy Israel, Wrath, Burning, Relentlessness, Destruction, and Indignation; but when Mosheh the Rabban of Israel heard, he went and made memorial of the great and glorious Name, and called. And Abraham, Izhak, and Jakob arose from their tomb, and stood in prayer before the Lord; and forthwith three of them were restrained, and two of them, Wrath and Burning, remained. But Mosheh (yet) supplicated mercy, and were also restrained; and he digged a grave in the land of Moab and buried them, in swearing by the great and tremendous Name; for so it is written: For I was afraid before the anger with which the Lord was angry with you to destroy you, and the Lord received my prayer at that time also.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 20, "aliyah": 3, "heb": "וּֽבְאַהֲרֹ֗ן הִתְאַנַּ֧ף יְהֹוָ֛ה מְאֹ֖ד לְהַשְׁמִיד֑וֹ וָֽאֶתְפַּלֵּ֛ל גַּם־בְּעַ֥ד אַהֲרֹ֖ן בָּעֵ֥ת הַהִֽוא׃", "onk": "וְעַל אַהֲרֹן הֲוָה רְגַז מִן <b>קֳדָם<\/b> יְיָ לַחֲדָא לְשֵׁצָיוּתֵיהּ וְצַלֵּיתִי אַף עַל אַהֲרֹן בְּעִדָּנָא הַהִיא:", "onk_en": "And at Aharon [<b>from before<\/b>] Adonoy [<b>He<\/b>] grew very angry to destroy him; I prayed for Aharon, too, at that time.", "pj": "וְעַל אַהֲרן הֲוָה רְגַז מִן קֳדָם יְיָ לַחֲדָא לְשֵׁיצָיוּתֵיהּ וְצַלֵּיתִי אוּף עַל אַהֲרן בְּעִידָנָא הַהוּא", "pj_en": "But against Aharon was there great displeasure before the Lord, (so that) He would destroy him; but I prayed for Aharon also at that time.", "tj": "", "tj_en": "", "rashi": "<b>ובאהרן התאנף ה'.<\/b> לְפִי שֶׁשָּׁמַע לָכֶם:<br><br><b>להשמידו.<\/b> זֶה כִלּוּי בָּנִים, וְכֵן הוּא אוֹמֵר (עמוס ב') וָאַשְׁמִיד פִּרְיוֹ מִמַּעַל:<br><br><b>ואתפלל גם בעד אהרן.<\/b> וְהוֹעִילָה תְפִלָּתִי לְכַפֵּר מֶחֱצָה, וּמֵתוּ שְׁנַיִם וְנִשְׁאֲרוּ הַשְּׁנַיִם:", "rashi_en": "ובאהרן התאנף ה׳ AND WITH AARON THE LORD WAS ANGRY, because he listened to you.<br><br>להשמידו TO DESTROY HIM — this denotes the extermination of one’s children, and so, too, it states, (Amos 2:9) “And I destroyed (ואשמיד) his fruit (offspring) from above” (Leviticus Rabbah 7:1). <br><br>.(אחרי מות AND I PRAYED FOR AARON ALSO, and my prayer availed to atone half, so that only two of his sons died, and two remained alive."}, {"ch": 9, "v": 21, "aliyah": 3, "heb": "וְֽאֶת־חַטַּאתְכֶ֞ם אֲשֶׁר־עֲשִׂיתֶ֣ם אֶת־הָעֵ֗גֶל לָקַ֘חְתִּי֮ וָאֶשְׂרֹ֣ף אֹת֣וֹ&thinsp;<small>׀<\/small>&thinsp;בָּאֵשׁ֒ וָאֶכֹּ֨ת אֹת֤וֹ טָחוֹן֙ הֵיטֵ֔ב עַ֥ד אֲשֶׁר־דַּ֖ק לְעָפָ֑ר וָֽאַשְׁלִךְ֙ אֶת־עֲפָר֔וֹ אֶל־הַנַּ֖חַל הַיֹּרֵ֥ד מִן־הָהָֽר׃", "onk": "וְיָת חוֹבַתְכוֹן דִּי עֲבַדְתּוּן יָת עֶגְלָא נְסֵבִית וְאוֹקֵדִית יָתֵיהּ בְּנוּרָא וְשָׁפִית יָתֵיהּ בְּשׁוּפִינָא יָאוּת עַד דִּי הֲוָה דַּקִּיק לְעַפְרָא וּרְמֵת יָת עַפְרֵיהּ לְנַחֲלָא דְּנָחֵת מִן טוּרָא:", "onk_en": "And the sin[-object] that you made, the calf, I took and burned it in fire. I crushed it—thoroughly grinding it—until it was fine—to dust; and I threw its dust into the stream that was flowing down from the mountain.", "pj": "וְיַת סוּרְחַנְתְּכוֹן דַּעֲבַדְתּוּן יַת עֵיגְלָא נְסֵיבִית וְאוֹקֵדִית יָתֵיהּ בְּנוּרָא וְשַׁפְיַית יָתֵיהּ בְּשׁוֹפָנָא טַבְאוּת עַד דַּהֲוָה דָקִיק כְּעַפְרָא וּטְלָקִית יַת עַפְרֵיהּ לְנַחֲלָא דְנָחִית מִן טַוְורָא", "pj_en": "And your sin, the calf which you had made, I took, and burned it in fire, and crushed it well with crushing until I had bruised it into dust; and I threw the dust into the stream that descended from the mountain.", "tj": "", "tj_en": "", "rashi": "<b>טחון.<\/b> לְשׁוֹן הוֹוֶה, כְּמוֹ הָלוֹךְ וְכַלּוֹת, מולא\"נט בְּלַעַז:", "rashi_en": "טחון — This is a present tense of continuous action like הלוך וכלות “going on destroying”; moulant in O. F. English grinding (cf. Rashi on Deuteronomy 3:6)."}, {"ch": 9, "v": 22, "aliyah": 3, "heb": "וּבְתַבְעֵרָה֙ וּבְמַסָּ֔ה וּבְקִבְרֹ֖ת הַֽתַּאֲוָ֑ה מַקְצִפִ֥ים הֱיִיתֶ֖ם אֶת־יְהֹוָֽה׃", "onk": "וּבִדְלֶקְתָּא וּבְנִסֵּתָא וּבְקִבְרֵי דִמְשַׁאֲלֵי מַרְגְּזִין הֲוֵיתוּן <b>קֳדָם<\/b> יְיָ:", "onk_en": "And in Tav’eiroh and in Massoh and in Kivros Hata’voh you were angerers of [<b>before<\/b>] Adonoy.", "pj": "וּבְבֵית יְקִידְתָּא וּבְנִסֵיתָא וּבְקִבְרֵי תַחְמוּדָא מַרְגְּזִין הֲוֵיתוּן קֳדָם יְיָ", "pj_en": "And at the place of Burning, and that of the Temptation, and at the Graves of Desire you provoked to anger before the Lord.", "tj": "וּבְקִבְרַיָא תַחְמוּדַיָא:", "tj_en": "And at the Graves of Desire", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 23, "aliyah": 3, "heb": "וּבִשְׁלֹ֨חַ יְהֹוָ֜ה אֶתְכֶ֗ם מִקָּדֵ֤שׁ בַּרְנֵ֙עַ֙ לֵאמֹ֔ר עֲלוּ֙ וּרְשׁ֣וּ אֶת־הָאָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָכֶ֑ם וַתַּמְר֗וּ אֶת־פִּ֤י יְהֹוָה֙ אֱלֹ֣הֵיכֶ֔ם וְלֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔וֹ וְלֹ֥א שְׁמַעְתֶּ֖ם בְּקֹלֽוֹ׃", "onk": "וְכַד שְׁלַח יְיָ יָתְכוֹן <b>מֵרְקַם גֵּיאָה<\/b> לְמֵימַר סְקוֹ וְאַחֲסִינוּ יָת אַרְעָא דִּי יְהָבִית לְכוֹן וְסָרֶבְתּוּן עַל <b>גְּזֵרַת מֵימְרָא<\/b> דַיְיָ אֱלָהֲכוֹן וְלָא הֵימַנְתּוּן לֵיהּ וְלָא <b>קַבֶּלְתּוּן לְמֵימְרֵיהּ<\/b>:", "onk_en": "And when Adonoy sent you from Kodeish Barnei’a [<b>Rekam Geyah<\/b>], saying, ‘‘Go up and inherit the land that I have given you.’’ But you defied [<b>the decree of the word of<\/b>] Adonoy, your God, and did not trust Him, and did not heed Him [<b>accept His word<\/b>].", "pj": "וּבִזְמַן דְּשָׁלַח יְיָ יַתְכוֹן מֵרְקָם גֵּעָא לְמֵימָר סוּקוּ וְאַחֲסִינוּ יַת אַרְעָא דִיהָבִית לְכוֹן וְסָרֵיבְתּוּן עַל מֵימְרָא דַיְיָ אֱלָהָכוֹן וְלָא הֵימַנְתּוּן לֵיהּ וְלָא קַבֵּלְתּוּן לְמֵימְרֵיהּ", "pj_en": "And at the time when the Lord sent you from Rekem Giah, saying: Go up and take possession of the land which I have given you, then were you perverse with the Word of the Lord your God, and would not believe Him, nor be obedient to His Word.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 24, "aliyah": 3, "heb": "מַמְרִ֥ים הֱיִיתֶ֖ם עִם־יְהֹוָ֑ה מִיּ֖וֹם דַּעְתִּ֥י אֶתְכֶֽם׃", "onk": "מְסָרְבִין הֲוֵיתוּן קֳדָם יְיָ מִיּוֹמָא דִּידָעִית יָתְכוֹן:", "onk_en": "Defiers have you been with Adonoy, from the day I know you.", "pj": "מְסַרְבִין הֲוֵיתוּן קֳדָם יְיָ מִן יוֹמָא דְחַכִּימַת יַתְכוֹן", "pj_en": "You have been perverse before the Lord from the day that I have known you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 25, "aliyah": 3, "heb": "וָֽאֶתְנַפַּ֞ל לִפְנֵ֣י יְהֹוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַיּ֛וֹם וְאֶת־אַרְבָּעִ֥ים הַלַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי־אָמַ֥ר יְהֹוָ֖ה לְהַשְׁמִ֥יד אֶתְכֶֽם׃", "onk": "וְאִשְׁתַּטָּחִית קֳדָם יְיָ יָת אַרְבְּעִין יְמָמִין וְיָת אַרְבְּעִין לֵילָוָן דִּי אִשְׁתַּטָּחִית אֲרֵי אֲמַר יְיָ לְשֵׁצָאָה יָתְכוֹן:", "onk_en": "I prostrated myself before Adonoy the forty days and the forty nights that I prostrated myself, because Adonoy intended to destroy you.", "pj": "וְאִשְׁתַּטָּחִית בִּצְלוֹ קֳדָם יְיָ יַת אַרְבְּעִין יְמָמִין וְיַת אַרְבְּעִין לֵילַוָן דּ
