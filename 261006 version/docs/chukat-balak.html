<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "chukat-balak";
const DATA = [{"ch": 19, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and Aharon, saying.", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר", "pj_en": "AND the Lord spake with Mosheh and Aharon, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 2, "aliyah": 1, "heb": "זֹ֚את חֻקַּ֣ת הַתּוֹרָ֔ה אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה לֵאמֹ֑ר דַּבֵּ֣ר&thinsp;<b>׀<\/b> אֶל־בְּנֵ֣י יִשְׂרָאֵ֗ל וְיִקְח֣וּ אֵלֶ֩יךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין־בָּהּ֙ מ֔וּם אֲשֶׁ֛ר לֹא־עָלָ֥ה עָלֶ֖יהָ עֹֽל׃", "onk": "דָּא גְּזֵרַת אוֹרַיְתָא דִּי פַקִּיד יְיָ לְמֵימָר מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְיִסְּבוּן לָךְ תּוֹרְתָא סִמּוּקְתָּא שְׁלֶמְתָּא דִּי לֵית בָּהּ מוּמָא דִּי לָא סְלִיק עֲלַהּ נִירָא:", "onk_en": "This is the statute of the Torah which Adonoy commanded, saying; speak to Bnei Yisroel that they shall take to you a red, perfect cow without a blemish, upon which no yoke was laid.", "pj": "דָא גְזֵירַת אַחְוָיַת אוֹרַיְיתָא דְפַקֵיד יְיָ לְמֵימָר מַלֵיל עִם בְּנֵי יִשְרָאֵל וְיִסְבוּן לָךְ מֵאַפְרָשׁוּת לִישְׁכְּתָא תוֹרָתָא סוּמְקָתָא בְּרַת תַּרְתֵּין שְׁנִין דְלֵית בָּהּ מוּמָא וְשׁוּמָא מִשֵעָר חַוְורָן דְלָא סַלִיק עֲלָהּ דְכַר וְלָא אַטְרָחָא בְּאוּבְצַן עִיבִידְתָּא וְאִפְסְרָא וּקְטַרְבָא וְלָא אִידְעָצָא בְּזִקְתָא וְסוּל וְסִירְתָּא וְכָל דְדָמֵי לְנִירָא", "pj_en": "This is the decree, the publication of the law which the Lord hath commanded, saying; Speak to the sons of Israel, that they bring to thee from the separation of the fold a red heifer, two years old, in which there is neither spot nor white hair, on which no male hath come, nor the burden of any work been imposed, neither hurt by the thong, nor grieved by the goad or prick, nor collar (band) or any like yoke.", "tj": "", "tj_en": "", "rashi": "<b>זאת חקת התורה.<\/b> לְפִי שֶׁהַשָּׂטָן וְאֻמּוֹת הָעוֹלָם מוֹנִין אֶת יִשְׂרָאֵל, לוֹמַר מַה הַמִּצְוָה הַזֹּאת וּמַה טַּעַם יֵשׁ בָּהּ? לְפִיכָךְ כָּתַב בָּהּ חֻקָּה — גְּזֵרָה הִיא מִלְּפָנַי, אֵין לְךָ רְשׁוּת לְהַרְהֵר אַחֲרֶיהָ (יומא ס\"ז):<br><br><b>ויקחו אליך.<\/b> לְעוֹלָם הִיא נִקְרֵאת עַל שִׁמְךָ — פָּרָה שֶׁעָשָׂה מֹשֶׁה בַּמִּדְבָּר:<br><br><b>אדמה תמימה.<\/b> שֶׁתְּהֵא תְמִימָה בְּאַדְמִימוּת, שֶׁאִם הָיוּ בָהּ שְׁתֵּי שְׂעָרוֹת שְׁחֹרוֹת פְּסוּלָה (פרה פ\"ב):", "rashi_en": "וזאת חקת התורה THIS IS THE ORDINANCE OF THE LAW — Because Satan and the nations of the world taunt Israel, saying, “What is this command and what reason is there for it”, on this account it (Scripture) writes (uses) the term חקה about it, implying: It is an enactment from before Me; you have no right to criticize it (Yoma 67b; cf. Midrash Tanchuma, Chukat 7).<br><br>ויקחו אליך THEY SHALL TAKE UNTO THEE — It will always be called by thy name: people will speak of the cow which Moses prepared in the wilderness (Midrash Tanchuma, Chukat 8).<br><br>אדמה תמימה [A COW] RED, PERFECT — This means that it should be perfect in respect to its redness (Sifrei Bamidbar 123:1), — so that if there are two black hairs in it (or two of any color other than red) it is unfitted for the rite here described (Mishnah Parah 2:5)."}, {"ch": 19, "v": 3, "aliyah": 1, "heb": "וּנְתַתֶּ֣ם אֹתָ֔הּ אֶל־אֶלְעָזָ֖ר הַכֹּהֵ֑ן וְהוֹצִ֤יא אֹתָהּ֙ אֶל־מִח֣וּץ לַֽמַּחֲנֶ֔ה וְשָׁחַ֥ט אֹתָ֖הּ לְפָנָֽיו׃", "onk": "וְתִתְּנוּן יָתַהּ לְאֶלְעָזָר כַּהֲנָא וְיַפֵּק יָתַהּ לְמִבָּרָא לְמַשְׁרִיתָא וְיִכּוֹס יָתַהּ קֳדָמוֹהִי:", "onk_en": "Give it to Elozor the <i>kohein<\/i>; he shall take it outside the camp, and someone shall slaughter it in his presence.", "pj": "וְתִתְּנוּן יָתָהּ לְאֶלְעָזָר סְגַן כַּהֲנַיָא וִיהַנְפַּק יָתָהּ לְחוֹדָא לְמִבָּרָא לְמַשְׁרִיתָא וִיסַדֵר חֲזוֹר חֲזוֹר לָהּ סִידוּרֵי קִיסִין דְתֵינַיָא וְכַהֲנָא אוֹחֲרַן יִכּוֹס יָתָהּ קֳדָמוֹי בִּתְרֵין סִימָנַיָא כְּמִשְׁאַר בְּעִירַן וְיִבְדִיקְנָהּ בִּתְמַנֵי סְרִי טְרִיפַן", "pj_en": "And thou shalt give her unto Elazar, the chief of the priests, who shall lead her alone without the camp, and set round about her a railing (border) of the branches of fig trees; and another priest shall slay her with the two signs before him, after the manner of other animals, and examine her by the eighteen kinds of divisions.", "tj": "", "tj_en": "", "rashi": "<b>אלעזר.<\/b> מִצְוָתָהּ בַּסְּגָן (ספרי):<br><br><b>אל מחוץ למחנה.<\/b> חוּץ לְשָׁלוֹשׁ מַחֲנוֹת:<br><br><b>ושחט אתה לפניו.<\/b> זָר שׁוֹחֵט וְאֶלְעָזָר רוֹאֶה (שם; יומא מ\"ב):", "rashi_en": "אלעזר [YE SHALL GIVE IT TO] ELEAZAR — The command concerning it is to be carried out by the Segan (the second to the High Priest) (Sifrei Bamidbar 123:2; Yoma 42b).<br><br>אל מחוץ למחנה [HE SHALL BRING IT FORTH] WITHOUT THE CAMP — Outside the three camps (Yoma 68a; cf. Rashi on Leviticus 4:12).<br><br>ושחט אתה לפניו AND ONE SHALL SLAUGHTER IT IN HIS PRESENCE — A stranger (a non-priest) slaughters it while Eleazar looks on (superintends) (Sifrei Bamidbar 123:2; Yoma 42a)."}, {"ch": 19, "v": 4, "aliyah": 1, "heb": "וְלָקַ֞ח אֶלְעָזָ֧ר הַכֹּהֵ֛ן מִדָּמָ֖הּ בְּאֶצְבָּע֑וֹ וְהִזָּ֞ה אֶל־נֹ֨כַח פְּנֵ֧י אֹֽהֶל־מוֹעֵ֛ד מִדָּמָ֖הּ שֶׁ֥בַע פְּעָמִֽים׃", "onk": "וְיִסַּב אֶלְעָזָר כַּהֲנָא מִדְּמַהּ בְּאֶצְבְּעֵיהּ וְיַדִּי לָקֳבֵל אַפֵּי מַשְׁכַּן זִמְנָא מִדְּמַהּ שְׁבַע זִמְנִין:", "onk_en": "Elozor the <i>kohein<\/i> shall take some of its blood with his finger and sprinkle it directly facing the Tent of Meeting, some of its blood seven times.", "pj": "וְיִסַב אֶלְעָזָר בְּכִיהוּנֵיהּ מִן אַדְמֵיהּ בְּאַדְבַּע יַד יְמִינֵיהּ וְלָא יְקַבְּלִינֵיהּ בְּמָנָא וְיַדֵי לְסִידוּרָא דְקִיסֵי תֵינַיָא מִן לָגִין מִן צִטְרָא דִמְמַצַע כָּל קֳבֵיל אַפֵּי מַשְׁכַּן זִימְנָא מֵאַדְמָא בְּטִיבוּלָא חֲדָא שְׁבַע זִמְנִין", "pj_en": "And Elazar, in his priestly dress, shall take of her blood with the finger of his right hand, without (first) containing it in a vessel, and shall sprinkle the border of fig branches, and (afterwards) from the midst of a vessel on one side towards the tabernacle of ordinance, with one dipping, seven times (shall he sprinkle).", "tj": "", "tj_en": "", "rashi": "<b>אל נכח פני אהל מועד.<\/b> עוֹמֵד בְּמִזְרָחוֹ שֶׁל יְרוּשָׁלַיִם וּמִתְכַּוֵּן וְרוֹאֶה פִתְחוֹ שֶׁל הֵיכָל בִּשְׁעַת הַזָּאַת הַדָּם (ספרי; זבחים ק\"ה):", "rashi_en": "אל נכח פני אהל מועד [HE SHALL SPRINKLE THE BLOOD] TOWARDS THE FRONT SIDE OF THE APPOINTED TENT He stands at the East of Jerusalem and must direct his gaze straight towards the entrance of the Hechal at the time of sprinkling the blood (Sifrei Bamidbar 123:2; Yoma 68a)."}, {"ch": 19, "v": 5, "aliyah": 1, "heb": "וְשָׂרַ֥ף אֶת־הַפָּרָ֖ה לְעֵינָ֑יו אֶת־עֹרָ֤הּ וְאֶת־בְּשָׂרָהּ֙ וְאֶת־דָּמָ֔הּ עַל־פִּרְשָׁ֖הּ יִשְׂרֹֽף׃", "onk": "וְיוֹקֵד יָת תּוֹרְתָא לְעֵינוֹהִי יָת מַשְׁכַּהּ וְיָת בִּשְׂרַהּ וְיָת דְּמַהּ עַל אָכְלַהּ יוֹקֵד:", "onk_en": "Someone shall burn the cow in his presence; its skin, flesh, blood, with its waste (that are in its intestines) shall be burned.", "pj": "וְיִפְקוּן מִגוֹ סְדוּרָא וְיוֹקֵד כּהֵן אוֹחֲרַן יַת תּוֹרָתָא כַּד חָמֵי אֶלְעָזָר יַת מוֹשְׁכָהּ וְיַת בִּשְרָהּ וְיַת אַדְמָהּ עַל רֵיעַיָיהּ יוֹקֵד", "pj_en": "And they shall bring her out from the midst of the railing and another priest, while Elazar looketh on, shall burn the heifer, her skin, flesh, and blood, with her dung shall he burn.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 6, "aliyah": 1, "heb": "וְלָקַ֣ח הַכֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְאֵז֖וֹב וּשְׁנִ֣י תוֹלָ֑עַת וְהִשְׁלִ֕יךְ אֶל־תּ֖וֹךְ שְׂרֵפַ֥ת הַפָּרָֽה׃", "onk": "וְיִסַּב כַּהֲנָא אָעָא דְאַרְזָא וְאֵזוֹבָא וּצְבַע זְהוֹרִי וְיִרְמֵי לְגוֹ יְקִידַת תּוֹרְתָא:", "onk_en": "The <i>kohein<\/i> shall take a piece of cedar wood, hyssop, and crimson wool, and throw them into the burning of the cow.", "pj": "וְיִסַב כּהֵן אוֹחֲרַן בִּקְעֲתָא דְקֵיסָא דְגוּלְמוּשׁ וְאֵיזוֹבָא וּצְבַע דְאִשְׁתָּנֵי בִּזְהוֹרִי וְיִטְלוֹק לְגוֹ יְקִידְתָּא דְתוֹרָתָא וְיַסְגֵי דְלֵיקְתָּא לְאַפּוּשֵׁי קִיטְמָא", "pj_en": "And another priest shall take a piece of cedar wood and hyssop, and (wool) whose colour hath been changed to scarlet, and throw them into the midst of the burning of the heifer; and he shall enlarge the burning, that the ashes may be increased.", "tj": "וְיִטְלַק לְגוֹ קְטַם יְקִידַת תּוֹרָתָא:", "tj_en": "And throw into the midst of the ashes of the burning heifer.", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 7, "aliyah": 1, "heb": "וְכִבֶּ֨ס בְּגָדָ֜יו הַכֹּהֵ֗ן וְרָחַ֤ץ בְּשָׂרוֹ֙ בַּמַּ֔יִם וְאַחַ֖ר יָבֹ֣א אֶל־הַֽמַּחֲנֶ֑ה וְטָמֵ֥א הַכֹּהֵ֖ן עַד־הָעָֽרֶב׃", "onk": "וִיצַבַּע לְבוּשׁוֹהִי כַּהֲנָא וְיַסְחֵי בִשְׂרֵיהּ בְּמַיָּא וּבָתַר כֵּן יֵעוּל לְמַשְׁרִיתָא וִיהֵי מְסָאָב כַּהֲנָא עַד רַמְשָׁא:", "onk_en": "Then the <i>kohein<\/i> shall wash his garments and bathe his body in water, and afterwards he may enter the camp; [however,] the <i>kohein<\/i> shall be impure until the evening.", "pj": "וִיצַבַּע לְבוּשׁוֹי כַּהֲנָא דִינְכֵס יַת תּוֹרָתָא וְיַסְחֵי בִישְרֵיהּ בְּאַרְבְּעִין סָוִוין דְמוֹי וּמִן בָּתַר כְּדֵין יֵיעוּל לְמַשְׁרִיתָא וִיהֵי מְסָאָב כַּהֲנָא הַהוּא קֳדָם טִיבוּלֵיהּ עַד רַמְשָׁא", "pj_en": "And the priest who slew the heifer shall wash his dress in forty satas of water, and afterwards he may go into the camp; but the priest before his ablution shall be unclean until the evening.", "tj": "", "tj_en": "", "rashi": "<b>אל המחנה.<\/b> לְמַחֲנֵה שְׁכִינָה, שֶׁאֵין טָמֵא מְשֻׁלָּח חוּץ לִשְׁתֵּי מַחֲנוֹת אֶלָּא זָב וּבַעַל קֶרִי וּמְצֹרָע (עי' פסחים ס\"ז):<br><br><b>וטמא הכהן עד הערב.<\/b> סָרְסֵהוּ וְדָרְשֵׁהוּ — וְטָמֵא עַד הָעֶרֶב וְאַחַר יָבֹא אֶל הַמַּחֲנֶה:", "rashi_en": "אל המחנה [AND AFTERWARDS HE MAY COME] INTO THE CAMP — into the camp of the Shechina (in the case of the Temple at Jerusalem, into the forecourt, the עזרה, immediately in front of the Temple), from which alone he had been barred, for no unclean person was expelled from two camps (i.e. from more than one, viz., the מחנה שכינה) except a person with a running issue and a man who had experienced a seminal emission (who were expelled from the מחנה שכינה and מחנה לויה), and a leper (who had to remain outside all three) (cf. Pesachim 67a).<br><br>וטמא הכהן עד הערב [AND AFTERWARDS HE SHALL COME INTO THE CAMP] AND THE PRIEST SHALL BE UNCLEAN UNTO THE EVENING — Invert its order (that of the phrases forming this half of the verse), and then explain it: He shall be unclean until the evening and afterwards he shall come into the camp (cf Rashi Leviticus 11:32 and Note thereon)."}, {"ch": 19, "v": 8, "aliyah": 1, "heb": "וְהַשֹּׂרֵ֣ף אֹתָ֔הּ יְכַבֵּ֤ס בְּגָדָיו֙ בַּמַּ֔יִם וְרָחַ֥ץ בְּשָׂר֖וֹ בַּמָּ֑יִם וְטָמֵ֖א עַד־הָעָֽרֶב׃", "onk": "וּדְמוֹקֵד יָתַהּ יְצַבַּע לְבוֹשׁוֹהִי בְּמַיָּא וְיַסְחֵי בִשְׂרֵיהּ בְּמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Also, the one who burns it must wash his garments and bathe his body in water; he shall remain unclean until the evening.", "pj": "וְכַהֲנָא דְמִתְעַסֵק בִּיקִידְתָּא יְצַבַּע לְבוּשׁוֹי בְּאַרְבְּעִין סָוִוין דְמוֹי וְיַסְחֵי בִישְרֵיהּ בְּאַרְבְּעִין סָוִוין דְמוֹי וִיהֵי מְסָאָב קֳדָם טִבוּלֵיהּ עַד רַמְשָׁא", "pj_en": "And the priest who was employed in the burning shall wash his dress in forty satas of water, and his flesh in forty satas, and before his ablution shall be unclean until the evening.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 9, "aliyah": 1, "heb": "וְאָסַ֣ף&thinsp;<b>׀<\/b> אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַפָּרָ֔ה וְהִנִּ֛יחַ מִח֥וּץ לַֽמַּחֲנֶ֖ה בְּמָק֣וֹם טָה֑וֹר וְ֠הָיְתָ֠ה לַעֲדַ֨ת בְּנֵֽי־יִשְׂרָאֵ֧ל לְמִשְׁמֶ֛רֶת לְמֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׃", "onk": "וְיִכְנוֹשׁ גְּבַר דְּכֵי יָת קִטְמָא דְתוֹרְתָא וְיַצְנַע לְמִבָּרָא לְמַשְׁרִיתָא בַּאֲתַר דְּכֵי וּתְהֵי לִכְנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל לְמַטָּרָא לְמֵי אַדָּיוּתָא חַטָּאתָא הִיא:", "onk_en": "A ritually clean person shall gather the cow’s ashes and place [it] outside the camp in a clean place; it shall remain a keepsake for the community of Bnei Yisroel for sprinkling water for purification.", "pj": "וִיכְנוֹשׁ גְבַר כָּהִין דְכֵי יַת קִטְמָא דְתוֹרָתָא בְּקָלָל דְפָחַר מַקַף מְגוּפַת שְׁיַיע וִיפַלֵג יַת קִטְמָא לִתְלַת חוּלְקִין חֲדָא יָהִיב בְּחֵיל וַחֲדָא בְּטַוַור מִשְׁחָא וְחָדָא מִפְלַג לְכָל מַטְרַת לֵיוָאֵי וּתְהֵי לִכְנִישְׁתָּא דִבְנֵי יִשְרָאֵל לְמוֹי אַדְיוּתָא בְּרַם שִׁיבוּק חוֹבַת עֵיגְלָא הִיא", "pj_en": "And a man, a priest who is clean, shall gather up the ashes of the heifer in an earthenware receptacle, its opening covered round about with clay; and shall divide the ashes into three portions, of which one shall be placed within the wall (of Jerusalem), another in the Mount of Olives, and the third portion be in the custody of the Levites; and it shall be for the congregation of Israel, for the Water of Sprinkling: it is the heifer (immolated) for the remission of sins.", "tj": "", "tj_en": "", "rashi": "<b>והניח מחוץ למחנה.<\/b> לִשְׁלֹשָׁה חֲלָקִים מְחַלְּקָהּ, אֶחָד נָתַן בְּהַר הַמִּשְׁחָה, וְאֶחָד מִתְחַלֵּק לְכָל הַמִּשְׁמָרוֹת, וְאֶחָד נָתַן בַּחֵיל (ספרי; פרה פ\"ג), זֶה שֶׁל מִשְׁמָרוֹת הָיָה חוּץ לָעֲזָרָה, לִטֹּל מִמֶּנּוּ בְּנֵי הָעֲיָרוֹת וְכָל הַצְּרִיכִין לִטָּהֵר, וְזֶה שֶׁבְּהַר הַמִּשְׁחָה כֹּהֲנִים גְּדוֹלִים לְפָרוֹת אֲחֵרוֹת מְקַדְּשִׁין הֵימֶנָּה, וְזֶה שֶׁבַּחֵיל נָתוּן לְמִשְׁמֶרֶת מִגְּזֵרַת הַכָּתוּב, שֶׁנֶּאֱמַר <b>והיתה לעדת בני ישראל למשמרת<\/b>:<br><br><b>למי נדה.<\/b> לְמֵי הַזָּיָה, כְּמוֹ \"וַיַּדּוּ אֶבֶן בִּי\" (איכה ג'), \"לְיַדּוֹת אֶת קַרְנוֹת הַגּוֹיִם\" (זכריה ב'), לְשׁוֹן זְרִיקָה:<br><br><b>חטאת הוא.<\/b> לְשׁוֹן חִטּוּי, כִּפְשׁוּטוֹ, וּלְפִי הִלְכוֹתָיו קְרָאָהּ הַכָּתוּב חַטָּאת, לוֹמַר שֶׁהִיא כְּקָדָשִׁים לֵאָסֵר בַּהֲנָאָה (עי' ספרי; מנחות נ\"א):", "rashi_en": "והניח מחוץ למחנה AND HE SHALL LAY THEM UP WITHOUT THE CAMP — He divided it (the ashes) into three portions: one he placed on Mount Olivet, another was divided between all the priestly divisions, and the other he placed in the חיל (the space that surrounded the Temple area) (Sifrei Bamidbar 124:1; Mishnah Parah 3:11). That portion given to the priestly divisions was outside the forecourt, so that the inhabitants of the cities and anyone who required to be cleansed might take of it; as for that which was on the Mount of Olives, the High Priests purified themselves by means of it for preparing other “red cows”, whilst that which was in the space surrounding the Temple area was placed there to be kept for all times by special enactment of Scripture, as it is said, “and it shall be kept for the congregation of the children of Israel\" (cf. Tosefta Parah 3 8).<br><br>למי נדה FOR WATERS OF נדה — i.e. for waters of sprinkling (or casting); similar are, (Lamentations 3:53) “and they cast (וידו) a stone upon me”; (Zechariah 2:4) “to cast down (לידות) the horns of the nations”, both of which are expressions denoting “casting”.<br><br>חטאת הוא IT IS A PURIFICATION FROM SIN — This, according to its literal meaning, is an expression denoting “purification”, but from the point of view of the Halachot to which it is to be subject Scripture terms it a חטאת, “sin-offering”, to state by so doing that it is similar to holy things — that it is prohibited for any other use (cf. Sifrei Bamidbar 124:2; Menachot 51b)."}, {"ch": 19, "v": 10, "aliyah": 1, "heb": "וְ֠כִבֶּ֠ס הָאֹסֵ֨ף אֶת־אֵ֤פֶר הַפָּרָה֙ אֶת־בְּגָדָ֔יו וְטָמֵ֖א עַד־הָעָ֑רֶב וְֽהָיְתָ֞ה לִבְנֵ֣י יִשְׂרָאֵ֗ל וְלַגֵּ֛ר הַגָּ֥ר בְּתוֹכָ֖ם לְחֻקַּ֥ת עוֹלָֽם׃", "onk": "וִיצַבַּע דְּכַנֵּישׁ יָת קִטְמָא דְתוֹרְתָא יָת לְבוּשׁוֹהִי וִיהֵי מְסָאָב עַד רַמְשָׁא וּתְהֵי לִבְנֵי יִשְׂרָאֵל וּלְגִיּוֹרַיָּא דְּיִתְגַיְּרוּן בֵּינֵיהוֹן לִקְיַם עֳלָם:", "onk_en": "The one who gathers the cow’s ashes shall wash his garments, and remain unclean until the evening; it shall be for Bnei Yisroel and for the proselyte who lives among them an eternal statute.", "pj": "וִיצַבַּע כַּהֲנָא דִכְנֵישׁ יַת קִטְמָא דְתוֹרָתָא יַת לְבוּשׁוֹי וִיהֵי מְסָאָב קֳדָם טִיבוּלֵיהּ עַד רַמְשָׁא וּתְהֵי לִדְכוּתָא לִבְנֵי יִשְרָאֵל וּלְגִיוֹרַיָא דְיִתְגַיְירוּן בֵּינֵיהוֹן לִקְיַים עֲלָם", "pj_en": "And the priest who gathered up the ashes of the heifer shall wash his clothes, and before his ablution be unclean till the evening. And this shall be for the cleansing of the children of Israel, a statute for ever.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 11, "aliyah": 1, "heb": "הַנֹּגֵ֥עַ בְּמֵ֖ת לְכׇל־נֶ֣פֶשׁ אָדָ֑ם וְטָמֵ֖א שִׁבְעַ֥ת יָמִֽים׃", "onk": "דְּיִקְרַב בְּמֵתָא לְכָל נַפְשָׁא דֶאֱנָשָׁא וִיהֵי מְסָאָב שַׁבְעָא יוֹמִין:", "onk_en": "One who touches the corpse of any [human] soul shall become unclean for seven days.", "pj": "דְיִקְרַב בִּשְׁכִיבָא לְכָל בַּר נְשָׁא וַאֲפִילוּ לְוַולְדָא בַּר יַרְחִין לְגוּשְׁמֵיהּ וּבִדְמֵיהּ יְהֵי מְסָאָב שׁוּבְעָא יוֹמִין", "pj_en": "Whoever toucheth the body of a dead man, or of a child of some months old, either his body or his blood, shall be unclean seven days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 12, "aliyah": 1, "heb": "ה֣וּא יִתְחַטָּא־ב֞וֹ בַּיּ֧וֹם הַשְּׁלִישִׁ֛י וּבַיּ֥וֹם הַשְּׁבִיעִ֖י יִטְהָ֑ר וְאִם־לֹ֨א יִתְחַטָּ֜א בַּיּ֧וֹם הַשְּׁלִישִׁ֛י וּבַיּ֥וֹם הַשְּׁבִיעִ֖י לֹ֥א יִטְהָֽר׃", "onk": "הוּא <b>יַדֵּי<\/b> עֲלוֹהִי בְּיוֹמָא תְלִיתָאָה וּבְיוֹמָא שְׁבִיעָאָה יִדְכֵּי וְאִם לָא <b>יַדֵּי<\/b> עֲלוֹהִי בְּיוֹמָא תְלִיתָאָה וּבְיוֹמָא שְׁבִיעָאָה לָא יִדְכֵּי:", "onk_en": "He shall cleanse himself [<b>be sprinked<\/b>] with it on the third day and on the seventh day, so that he may become clean; if he does not have himself cleansed [<b>be sprinked<\/b>] on the third day and on the seventh day, he will not become clean.", "pj": "הוּא יַדֵי עֲלוֹי מֵי קִטְמָא הַהוּא בְּיוֹמָא תְלִיתָאָה וּבְיוֹמָא שְׁבִיעָאָה יִדְכֵּי וְאִין לָא יַדֵי עֲלוֹי בְּיוֹמָא תְלִיתָאָה יְעַכֵּב עֲלוֹי וּבְיוֹמָא שְׁבִיעָאָה לָא יִדְכֵּי", "pj_en": "He shall sprinkle himself with this water of the ashes on the third day, and on the seventh day he shall be clean. But if he sprinkle not himself on the third day, his uncleanness will remain upon him, and he will not be clean on the seventh day.", "tj": "", "tj_en": "", "rashi": "<b>הוא יתחטא בו.<\/b> בָּאֵפֶר הַזֶּה:", "rashi_en": "הוא יתחטא בו HE SHALL PURIFY HIMSELF WITH IT — with this ash."}, {"ch": 19, "v": 13, "aliyah": 1, "heb": "כׇּֽל־הַנֹּגֵ֡עַ בְּמֵ֣ת בְּנֶ֩פֶשׁ֩ הָאָדָ֨ם אֲשֶׁר־יָמ֜וּת וְלֹ֣א יִתְחַטָּ֗א אֶת־מִשְׁכַּ֤ן יְהֹוָה֙ טִמֵּ֔א וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מִיִּשְׂרָאֵ֑ל כִּי֩ מֵ֨י נִדָּ֜ה לֹא־זֹרַ֤ק עָלָיו֙ טָמֵ֣א יִהְיֶ֔ה ע֖וֹד טֻמְאָת֥וֹ בֽוֹ׃", "onk": "כָּל דְּיִקְרַב בְּמִיתָא בְנַפְשָׁא דֶאֱנָשָׁא דִי יְמוּת וְלָא <b>יַדֵּי<\/b> עֲלוֹהִי יָת מַשְׁכְּנָא דַיְיָ סָאָב וְיִשְׁתֵּצֵי אֱנָשָׁא הַהוּא מִיִּשְׂרָאֵל אֲרֵי מֵי אַדָּיוּתָא לָא אִזְדְּרִיקוּ עֲלוֹהִי מְסָאָב יְהֵי עוֹד סְאוֹבְתֵיהּ בֵּיהּ:", "onk_en": "Whoever touches a corpse of a [human] soul, who died and does not have himself cleansed [<b>be sprinked<\/b>] defiles the <i>Mishkan<\/i> of Adonoy (if he enters it), that soul will be cut off from Yisroel; because the sprinkling water was not sprinkled on him, he will be impure his impurity remains.", "pj": "כָּל דִי יִקְרַב בִּשְׁכִיבָא וּבְוַולְדָא בַּר תִּשְׁעָא יַרְחִין בְּגוּשְׁמֵיהּ וּבִדְמֵיהּ דְיֵימִית וְלָא יַדֵי עֲלוֹי יַת מַשְׁכְּנָא דַיְיָ סָאִיב וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא מִיִשְרָאֵל אֲרוּם מוֹי אַדְיוּתָא לָא אִזְדְרִיקוּ עֲלוֹי מְסָאָב הוּא תּוּב סוּבְתֵּיהּ בֵּיהּ עַד דְיַדֵי וִיהַדֵר וְיַדֵי וְיִטְבּוֹל בְּרַמְשָׁא שְׁבִיעָאָה", "pj_en": "Whoever hath touched the body of a dead man, or of a child nine months old, either the body or the blood, and will not sprinkle himself, he hath defiled the tabernacle of the Lord, and that man shall be cut off from Israel; forasmuch as the water of sprinkling is not sprinkled upon him, he is unclean, his uncleanness is yet on him, until he shall sprinkle himself; yet may he sprinkle and make ablution on the seventh evening.", "tj": "", "tj_en": "", "rashi": "<b>במת בנפש.<\/b> וְאֵי זֶה מֵת? שֶׁל נֶפֶשׁ הָאָדָם, לְהוֹצִיא נֶפֶשׁ בְּהֵמָה שֶׁאֵין טֻמְאָתָהּ צְרִיכָה הַזָּאָה; דָּ\"אַ, <b>בנפש<\/b> זוֹ רְבִיעִית דָּם (חולין ע\"ב):<br><br><b>את משכן ה' טמא.<\/b> אִם נִכְנַס לָעֲזָרָה אֲפִלּוּ בִטְבִילָה בְּלֹא הַזָּאַת שְׁלִישִׁי וּשְׁבִיעִי:<br><br><b>עוד טמאתו בו<\/b>, אַף עַל פִּי שֶׁטָּבַל:", "rashi_en": "במת בנפש [HE WHO TOUCHES] A DEAD BODY OF ANY PERSON — And what dead body is here intended? That of a human being (נפש האדם), the addition of בנפש האדם serving to exclude the person (body) of an animal, so intimating that uncleanness caused by it does not require sprinkling for its removal. Another explanation of בנפש is, that this term refers to a quarter of a log of blood (this being regarded as the minimum quantity necessary for maintaining life in a human being) (Chullin 72a).<br><br>את משכן ה' הוא טמא HE DEFILES THE TABERNACLE OF THE LORD, if he enters the forecourt even though after having immersed himself, but without having been sprinkled on the third and seventh days, <br><br>עוד טמאתו בו HIS UNCLEANNESS IS YET UPON HIM, although he has immersed himself."}, {"ch": 19, "v": 14, "aliyah": 1, "heb": "זֹ֚את הַתּוֹרָ֔ה אָדָ֖ם כִּֽי־יָמ֣וּת בְּאֹ֑הֶל כׇּל־הַבָּ֤א אֶל־הָאֹ֙הֶל֙ וְכׇל־אֲשֶׁ֣ר בָּאֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים׃", "onk": "דָּא אוֹרַיְתָא אֱנַשׁ אֲרֵי יְמוּת בְּמַשְׁכְּנָא כָּל דְּעָלֵל לְמַשְׁכְּנָא וְכָל דִּי בְּמַשְׁכְּנָא יְהֵי מְסָאָב שַׁבְעָא יוֹמִין:", "onk_en": "This is the law [regarding] a person who dies in a tent; anyone who enters the tent and everything that is in the tent shall be unclean for seven days.", "pj": "דָא אַחְוָויַית אוֹרַיְתָא גְבַר אֲרֵי יְמוֹת תְּחוֹת גַנָנָא דְפָרִיס כָּל מַאן דְעָלִיל לְמַשְׁכְּנָא אוֹרַח תַּרְעָא וְלָא מִן צִדְדֵיהּ כִּדְפָתַח תַּרְעֵיהּ מִכָּל דִבְמַשְׁכְּנָא וַאֲפִילוּ קַרְקָעִיתֵיהּ וְאַבְנוֹי וְקִיסוֹי וּמָנוֹי יְהֵי מְסָאָב שׁוּבְעָא יוֹמִין", "pj_en": "This is the indication of the law concerning a man when he hath died under the outspread tent every one who entereth into the tent by the way of the door, but not from its side, when its door is open, (or when one hath opened its door,) and whatever is in the tent, its floor, stone, wood, and vessels, shall be unclean seven days.", "tj": "", "tj_en": "", "rashi": "<b>כל הבא אל האהל.<\/b> בְּעוֹד שֶׁהַמֵּת בְּתוֹכוֹ:", "rashi_en": "כל הבא אל האהל ALL THAT COMETH INTO THE TENT, whilst the dead body is within it, shall be unclean seven days."}, {"ch": 19, "v": 15, "aliyah": 1, "heb": "וְכֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין־צָמִ֥יד פָּתִ֖יל עָלָ֑יו טָמֵ֖א הֽוּא׃", "onk": "וְכֹל מַן <b>דַּחֲסַף<\/b> פְּתִיחַ דְּלֵית מְגוּפַת שְׁיִיעַ מַקַּף עֲלוֹהִי מְסָאָב הוּא:", "onk_en": "Any open [<b>earthenware<\/b>] utensil that has no cover fastened to it, shall be unclean.", "pj": "וְכָל מַאן דְפָחַר פָּתִיחַ דְלֵית מְגוּפְתָּא מְחַבְּרָא בֵּיהּ מַקַף עַל פּוּמֵיהּ דְיַפְרֵישׁ בֵּינֵיהּ וּבֵין סוּבְתָּא מְסָאָב הוּא בִּגְנֵינָא בְּאַוִירָא דְסוֹבְתָּא דְמִפּוּמֵיהּ וּמִגַוֵיהּ וְלָא מִגַבֵּיהּ", "pj_en": "And every earthen vessel which hath no covering fastened upon its mouth, which would have kept it separate from the uncleanness, is defiled by the uncleanness of the air which toucheth its mouth, and its interior, and not the outside of it (only).", "tj": "וְכָל מַאן דַחֲסַף פָּתִיחַ דִי לֵית פּוּרְיָיתָא מִשְׁעָא עִילוֹי מְסָאָב הוּא:", "tj_en": "And every open vessel which hath no covering of stone upon it shall be unclean.", "rashi": "<b>וכל כלי פתוח.<\/b> בִּכְלִי חֶרֶס הַכָּתוּב מְדַבֵּר, שֶׁאֵין מְקַבֵּל טֻמְאָה מִגַּבּוֹ אֶלָּא מִתּוֹכוֹ, לְפִיכָךְ אִם אֵין מְגוּפַת צְמִידָתוֹ פְּתוּלָה עָלָיו יָפֶה בְּחִבּוּר, טָמֵא הוּא, הָא אִם יֵשׁ צָמִיד פָּתִיל עָלָיו טָהוֹר (שם כ\"ה):<br><br><b>פתיל.<\/b> לְשׁוֹן מְחֻבָּר בִּלְשׁוֹן עֲרָבִי, וְכֵן (בראשית ל') \"נַפְתּוּלֵי אֱלֹהִים נִפְתַּלְתִּי\" — נִתְחַבַּרְתִּי עִם אֲחוֹתִי:", "rashi_en": "וכל כלי פתוח AND EVERY OPEN VESSEL — Scripture is speaking of an earthen vessel which is not receptive of uncleanness by an unclean thing touching its exterior but only by it being in its interior (even without contact with the interior walls; cf. Rashi on Leviticus 11:33); therefore if the cover that forms its lid is not well joined to it by a perfect contact, it (the vessel) becomes unclean; but if the lid is joined upon it, it is clean, whilst metal vessels would in any case become unclean, whether they are closed or not, since they are receptive of uncleanness whether an unclean object touches them on their inside or on their outside (Chullin 25a).<br><br>פתיל is an expression denoting “joined” in the Arabic language. Similar is (Genesis 30:8; cf. Rashi thereon), נפתולי אלהים נפתלתי, “By bonds of God I have joined myself (נפתלתי) with my sister.\" "}, {"ch": 19, "v": 16, "aliyah": 1, "heb": "וְכֹ֨ל אֲשֶׁר־יִגַּ֜ע עַל־פְּנֵ֣י הַשָּׂדֶ֗ה בַּֽחֲלַל־חֶ֙רֶב֙ א֣וֹ בְמֵ֔ת אֽוֹ־בְעֶ֥צֶם אָדָ֖ם א֣וֹ בְקָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים׃", "onk": "וְכֹל דִּי יִקְרַב עַל אַפֵּי חַקְלָא בִּקְטֵל חַרְבָּא אוֹ בְמֵתָא אוֹ בְגַרְמָא דֶאֱנָשָׁא אוֹ בְקִבְרָא יְהֵי מְסָאָב שַׁבְעָא יוֹמִין:", "onk_en": "Anyone who touches, in an open field, one slain by the sword, a corpse, human bone, or grave, shall be unclean for seven days.", "pj": "וְכָל מַאן דְמִקְרַב עַל אַנְפֵּי בָרָא וְלָא בְּמִיתָא דְבִכְרֵיסָא דְאִמֵיהּ בִּקְטוֹל סַיְיפָא אוֹ בְּסַיְיפָא דְקָטִיל בֵּיהּ אוֹ בִּשְׁכִיבָא שְׁלֵימָא וַאֲפִילוּ בְּגַרְמֵיהּ כְּשַעַרְתָּא אוֹ בְגַרְמָא דְאֵינָשָׁא חַיָא דְפָרַשׁ מִנֵיהּ אוֹ בִּקְבוּרְתָּא וְגוֹלְלָא וְדוֹפְקָא יְהֵי מְסָאָב שׁוּבְעָא יוֹמִין", "pj_en": "And whoever shall touch not one who hath died in his mother's womb, but who hath been slain with the sword on the face of the field, or the sword with which he was slain, or the dead man himself, or a bone of his, or the hair, or the bone of a living man which hath been separated from him, or a grave, or a shroud, or the bier, shall be unclean seven days.", "tj": "", "tj_en": "", "rashi": "<b>על פני השדה.<\/b> רַבּוֹתֵינוּ דָרְשׁוּ לְרַבּוֹת גּוֹלֵל וְדוֹפֵק (ספרי; חולין ע\"ב). וּפְשׁוּטוֹ — עַל פְּנֵי הַשָּׂדֶה, שֶׁאֵין שָׁם אֹהֶל, מְטַמֵּא הַמֵּת שָׁם בִּנְגִיעָה:", "rashi_en": " על פני השדה  [AND EVERYTHING WHICH TOUCHES] ON THE OPEN FIELD — Our Rabbis explained that this is intended to include the upper board and the side board of a coffin (which were on the surface of the field — that these, too, render a person unclean) (Chullin 72a). The literal meaning of the words על פני השדה is, however, that even where there is no אהל, covering, there too, the dead body may cause uncleanness, but only by contact with it."}, {"ch": 19, "v": 17, "aliyah": 1, "heb": "וְלָֽקְחוּ֙ לַטָּמֵ֔א מֵעֲפַ֖ר שְׂרֵפַ֣ת הַֽחַטָּ֑את וְנָתַ֥ן עָלָ֛יו מַ֥יִם חַיִּ֖ים אֶל־כֶּֽלִי׃", "onk": "וְיִסְּבוּן לְדִמְסָאָב מֵעֲפַר יְקֵדַת חַטָּאתָא וְיִתְּנוּן עֲלוֹהִי מֵי מַבּוּעַ לְמָן:", "onk_en": "They shall take for the unclean person of the ashes from the burnt purification-offering and he shall place upon them living [spring] water in a vessel.", "pj": "וְיִסְבוּן לְדִמְסָאָב מִן עֲפַר יְקִידַת חַטָאתָא וְיִתֵּן עֲלוֹי מֵי מַבּוּעַ לְגוֹ מַאן דְפָחַר", "pj_en": "And for him who is unclean, they shall take of the ashes of the burnt sin offering, and put spring water upon them in an earthen vessel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 18, "aliyah": 1, "heb": "וְלָקַ֨ח אֵז֜וֹב וְטָבַ֣ל בַּמַּ֘יִם֮ אִ֣ישׁ טָהוֹר֒ וְהִזָּ֤ה עַל־הָאֹ֙הֶל֙ וְעַל־כׇּל־הַכֵּלִ֔ים וְעַל־הַנְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ־שָׁ֑ם וְעַל־הַנֹּגֵ֗עַ בַּעֶ֙צֶם֙ א֣וֹ בֶֽחָלָ֔ל א֥וֹ בַמֵּ֖ת א֥וֹ בַקָּֽבֶר׃", "onk": "וְיִסַּב אֵזוֹבָא וְיִטְבּוֹל בְּמַיָּא גְּבַר דְּכֵי וְיַדֵּי עַל מַשְׁכְּנָא וְעַל כָּל מָנַיָּא וְעַל נַפְשָׁתָא דִּי הֲווֹ תַמָּן וְעַל דְּיִקְרַב בְּגַרְמָא אוֹ בְקָטִילָא אוֹ בְמֵיתָא אוֹ בְקִבְרָא:", "onk_en": "He shall take hyssop and dip it into the water; [this is done by] a ritually clean person, he shall sprinkle it on the tent, on all the utensils and people that were there, and on anyone who touched the bone, murder victim, corpse, or grave.", "pj": "וְיִסַב אֵזוֹבָא תְּלָתָא קִילְחִין בְּאִיסְרָא חֲדָא וְיִטְמוֹשׁ בְּמַיָא הָאִינוּן בְּעִידַן קִבּוּל סוּבְתָּא גְבַר כָּהֵן דְכֵי וְיַדֵי עַל מַשְׁכְּנָא וְעַל כָּל מָנַיָא וְעַל בְּנֵי נַשׁ דַהֲווֹ תַמָן וְעַל דְמִקְרַב בְּגַרְמָא דְחַיָא דְפָרֵישׁ מִנֵיהּ וְנָפַל אוֹ בִּקְטוֹל חַרְבָּא אוֹ בִּשְׁכִיבָא בְּמוֹתָנָא אוֹ בְּבֵית קְבוּרְתָּא וְגוֹלְלָא וְדוֹפְקָא", "pj_en": "And let a man, a priest, who is clean, take three branches of hyssop bound. together, and dip (them) in the water at the time of receiving the uncleanness, and sprinkle the tent and all its vessels, and the men who are in it, or upon him who hath touched the bone of a living man that hath been severed from him, and hath fallen, or him who hath. been slain with the sword, or hath died by the plague, or a grave, or a wrapper, or a bier.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 19, "aliyah": 1, "heb": "וְהִזָּ֤ה הַטָּהֹר֙ עַל־הַטָּמֵ֔א בַּיּ֥וֹם הַשְּׁלִישִׁ֖י וּבַיּ֣וֹם הַשְּׁבִיעִ֑י וְחִטְּאוֹ֙ בַּיּ֣וֹם הַשְּׁבִיעִ֔י וְכִבֶּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָהֵ֥ר בָּעָֽרֶב׃", "onk": "וְיַדֵּי דַכְיָא עַל מְסָאֲבָא בְּיוֹמָא תְלִיתָאָה וּבְיוֹמָא שְׁבִיעָאָה וִידַכִּנֵּיהּ בְּיוֹמָא שְׁבִיעָאָה וִיצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וְיִדְכֵּי בְרַמְשָׁא:", "onk_en": "The ritually clean person shall sprinkle upon the unclean person on the third day and on the seventh day; he shall purify him on the seventh day when he must wash his garments and bathe in water, and then he becomes clean in the evening.", "pj": "וְיַדֵי כַּהֲנָא דַכְיָא עַל גַבְרָא מְסָאֲבָא בְּיוֹמָא תְלִיתָאָה וּבְיוֹמָא שְׁבִיעָאָה וְיַדְכִּינֵיהּ בְיוֹמָא שְׁבִיעָאָה וִיצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְמַיָא וְיִדְכֵּי בְרַמְשָׁא", "pj_en": "And the priest who is clean shall sprinkle upon the unclean man on the, third day, and on the seventh day, and shall make him clean on the seventh day; and he shall sprinkle his clothes, and wash himself with water, and at eventide be clean.", "tj": "", "tj_en": "", "rashi": "<b>וחטאו ביום השביעי.<\/b> הוּא גְמַר טָהֳרָתוֹ (עי' ספרי):", "rashi_en": "וחטאו ביום השביעי AND HE SHALL PURIFY HIM ON THE SEVENTH DAY — This is the completion of his purification (cf. Sifrei Bamidbar 129:2)."}, {"ch": 19, "v": 20, "aliyah": 1, "heb": "וְאִ֤ישׁ אֲשֶׁר־יִטְמָא֙ וְלֹ֣א יִתְחַטָּ֔א וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מִתּ֣וֹךְ הַקָּהָ֑ל כִּי֩ אֶת־מִקְדַּ֨שׁ יְהֹוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא־זֹרַ֥ק עָלָ֖יו טָמֵ֥א הֽוּא׃", "onk": "וּגְבַר דִּי יִסְתָּאַב וְלָא <b>יַדֵּי<\/b> עֲלוֹהִי וְיִשְׁתֵּצֵי <b>אֱנָשָׁא<\/b> הַהוּא מִגּוֹ קְהָלָא אֲרֵי יָת מַקְדְּשָׁא דַיְיָ סָאִיב מֵי אַדָּיוּתָא לָא אִזְדְּרִיקוּ עֲלוֹהִי מְסָאָב הוּא:", "onk_en": "A person who became ritually unclean [and enters the Sanctuary] without purifying himself [<b>being sprinkled<\/b>], that soul [<b>person<\/b>] will be cut off from the community; for he defiled the Sanctuary of Adonoy, the sprinkling water was not sprinkled upon him, he remains unclean.", "pj": "וּגְבַר דְיִסְתָּאַב וְלָא יַדֵי עֲלוֹי וְיִשְׁתֵּיצֵי בַר נְשָׁא הַהוּא מִגוֹ קְהָלָא אֲרוּם יַת מַקְדְשָׁא דַיְיָ סָאִיב מֵי אַדְיוּתָא לָא אִזְדְרִיקוּ עֲלוֹי מְסָאָב הוּא", "pj_en": "But the unclean man who will not be sprinkled, that man shall be cut off from among the congregation, because he hath defiled the sanctuary of the Lord; the water of sprinkling hath not been sprinkled upon him, he is unclean.", "tj": "", "tj_en": "", "rashi": "<b>ואיש אשר יטמא וגו'.<\/b> אִם נֶאֱמַר מִקְדָּשׁ לָמָּה נֶאֱמַר מִשְׁכָּן? כו' כִּדְאִיתָא בִשְׁבוּעוֹת (דף ט\"ז):", "rashi_en": "ואיש אשר יטמא וגו׳ AND THE MAN THAT IS UNCLEAN [AND DOES NOT PURIFY HIMSELF … HATH DEFILED THE SANCTUARY OF THE LORD] — If the Sanctuary is mentioned why is the Tabernacle also mentioned (in v. 13 “he hath defiled the Tabernacle of the Lord”)? etc., as is set forth in Treatise Shevuot 16b."}, {"ch": 19, "v": 21, "aliyah": 1, "heb": "וְהָיְתָ֥ה לָהֶ֖ם לְחֻקַּ֣ת עוֹלָ֑ם וּמַזֵּ֤ה מֵֽי־הַנִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔יו וְהַנֹּגֵ֙עַ֙ בְּמֵ֣י הַנִּדָּ֔ה יִטְמָ֖א עַד־הָעָֽרֶב׃", "onk": "וּתְהֵי לְהוֹן לִקְיַם עֳלָם וּדְיַדֵּי מֵי אַדָּיוּתָא יְצַבַּע לְבוּשׁוֹהִי וּדְיִקְרַב בְּמֵי אַדָּיוּתָא יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "This shall be the statute for all times; one who sprinkles the sprinkling waters shall wash his garments, and one who touches the sprinkling waters shall remain unclean until the evening.", "pj": "וּתְהֵי לְכוֹן לִקְיַים עֲלָם וּלְחוֹד כַּהֲנָא דְמַדֵי מֵי אַדְיוּתָא יְצַבַּע לְבוּשׁוֹי וּדְיִקְרַב בְּמֵי אַדְיוּתָא יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And it shall be unto you an everlasting statute. The priest, also, who sprinkleth the water of sprinkling shall sprinkle his clothes, and he who toucheth the water of sprinkling shall be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>ומזה מי הנדה.<\/b> רַבּוֹתֵינוּ אָמְרוּ שֶׁהַמַּזֶּה טָהוֹר, וְזֶה בָא לְלַמֵּד שֶׁהַנּוֹשֵׂא מֵי חַטָּאת טָמֵא טֻמְאָה חֲמוּרָה לְטַמֵּא בְגָדִים שֶׁעָלָיו, מַה שֶּׁאֵין כֵּן בַּנּוֹגֵעַ, וְזֶה שֶׁהוֹצִיא בִּלְשׁוֹן \"מַזֶּה\", לוֹמַר לְךָ שֶׁאֵינָן מְטַמְּאִין עַד שֶׁיְּהֵא בָהֶן שִׁעוּר הַזָּאָה (נדה ט'):<br><br><b>והנגע, יטמא.<\/b> וְאֵין טָעוּן כִּבּוּס בְּגָדִים:", "rashi_en": "ומזה מי הנדה AND HE THAT SPRINKLED THE WATER OF SPRINKLING [SHALL WASH HIS GARMENTS] — Our Rabbis said that the one who sprinkles remains clean, and this statement is intended to intimate that one who bears the waters of purification becomes unclean with a more stringent uncleanness, in that he renders unclean the garments that are upon him (for it states here that he shall wash his garments), which is not so in the case of one who only touches these waters. And this fact that it here expresses it (the idea of “bearing the waters”) by the term “he that sprinkles” is only to tell you that they (the waters) do not render a person who bears them unclean unless they contain a quantity capable of being sprinkled (Yoma 14a).<br><br>והנגע…יטמא AND HE THAT TOUCHETH … SHALL BE UNCLEAN, but does not require washing of his garments."}, {"ch": 19, "v": 22, "aliyah": 1, "heb": "וְכֹ֛ל אֲשֶׁר־יִגַּע־בּ֥וֹ הַטָּמֵ֖א יִטְמָ֑א וְהַנֶּ֥פֶשׁ הַנֹּגַ֖עַת תִּטְמָ֥א עַד־הָעָֽרֶב׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְכֹל דִּי יִקְרַב בֵּיהּ מְסָאָבָא יְהֵי מְסָאָב וֶאֱנַשׁ דְּיִקְרַב בֵּיהּ יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Anything which the unclean person touches, shall become unclean; and anyone touching him shall be ritually unclean until the evening.", "pj": "וְכָל מִדַעַם דְיִקְרַב בֵּיהּ מְסָאֲבָא וְלָא בְהֵיסֵיטָא יְהֵי מְסָאָב וּבַר נַשׁ דְכֵי דְיִקְרַב בֵּיהּ יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whatever the unclean person hath touched, though he carry it not, shall be unclean; and the clean man who toucheth him shall be unclean till evening.", "tj": "", "tj_en": "", "rashi": "<b>וכל אשר יגע בו הטמא.<\/b> הַזֶּה שֶׁנִּטְמָא בְּמֵת, <b>יטמא<\/b>:<br><br><b>והנפש הנגעת<\/b> בּוֹ: בִּטְמֵא מֵת:<br><br><b>תטמא עד הערב.<\/b> כָּאן לָמַדְנוּ שֶׁהַמֵּת אֲבִי אֲבוֹת הַטֻּמְאָה, וְנוֹגֵעַ בּוֹ אַב הַטֻּמְאָה וּמְטַמֵּא אָדָם; זֶה פֵרוּשָׁהּ לְפִי מַשְׁמָעָהּ וְהִלְכוֹתֶיהָ. וּמִ\"אַ הֶעְתַּקְתִּי מִיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן וְזֶהוּ:<br><br><b>ויקחו אליך.<\/b> מִשֶּׁלָּהֶם, כְּשֵׁם שֶׁהֵם פֵּרְקוּ נִזְמֵי הַזָּהָב לָעֵגֶל מִשֶּׁלָּהֶם, כָּךְ יָבִיאוּ זוֹ לְכַפָּרָה מִשֶּׁלָּהֶם: <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>פרה אדמה.<\/b> מָשָׁל לְבֶן שִׁפְחָה שֶׁטִּנֵּף פָּלָטִין שֶׁל מֶלֶךְ, אָמְרוּ תָּבֹא אִמּוֹ וּתְקַנֵּחַ הַצּוֹאָה, כָּךְ תָּבֹא פָרָה וּתְכַפֵּר עַל הָעֵגֶל (תנחומא): <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>אדמה.<\/b> עַל שֵׁם \"אִם יַאְדִּימוּ כַתּוֹלָע\" (ישעיהו א'), שֶׁהַחֵטְא קָרוּי אָדֹם: <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>תמימה.<\/b> עַל שֵׁם יִשְׂרָאֵל שֶׁהָיוּ תְמִימִים, וְנַעֲשׂוּ בוֹ בַּעֲלֵי מוּמִין, תָּבֹא זוֹ וּתְכַפֵּר עֲלֵיהֶם וְיַחְזְרוּ לְתַמּוּתָם: <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>לא עלה עליה על.<\/b> כְּשֵׁם שֶׁפָּרְקוּ מֵעֲלֵיהֶם עֹל שָׁמַיִם: <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>אל אלעזר הכהן.<\/b> כְּשֵׁם שֶׁנִּקְהֲלוּ עַל אַהֲרֹן, שֶׁהוּא כֹּהֵן, לַעֲשׂוֹת הָעֵגֶל; וּלְפִי שֶׁאַהֲרֹן עָשָׂה אֶת הָעֵגֶל לֹא נִתְּנָה לוֹ עֲבוֹדָה זוֹ עַל יָדוֹ, שֶׁאֵין קַטֵּיגוֹר נַעֲשֶׂה סַנֵּיגוֹר: <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>ושרף את הפרה.<\/b> כְּשֵׁם שֶׁנִּשְׂרַף הָעֵגֶל: <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>עץ ארז ואזוב ושני תולעת.<\/b> שְׁלֹשָׁה מִינִין הַלָּלוּ כְּנֶגֶד שְׁלֹשֶׁת אַלְפֵי אִישׁ שֶׁנָּפְלוּ בָעֵגֶל, וְאֶרֶז הוּא הַגָּבוֹהַּ מִכָּל הָאִילָנוֹת וְאֵזוֹב נָמוּךְ מִכֻּלָּם, סִימָן שֶׁהַגָּבוֹהַּ שֶׁנִּתְגָּאָה וְחָטָא יַשְׁפִּיל אֶת עַצְמוֹ כְּאֵזוֹב וְתוֹלַעַת וְיִתְכַּפֵּר לוֹ: <small>[רש\"י בשם ר' משה הדרשן]<\/small><br><br><b>למשמרת.<\/b> כְּמוֹ שֶׁפֶּשַׁע הָעֵגֶל שָׁמוּר לְדוֹרוֹת לְפֻרְעָנוּת, וְאֵין לְךָ פְּקֻדָּה שֶׁאֵין בָּהּ מִפְּקֻדַּת הָעֵגֶל, שֶׁנֶּאֱמַר \"וּבְיוֹם פָּקְדִי וּפָקַדְתִּי\" וְגוֹ' (שמות ל\"ב), וּכְשֵׁם שֶׁהָעֵגֶל מְטַמֵּא כָּל הָעוֹסְקִים בּוֹ, כָּךְ פָּרָה תְטַמֵּא כָּל הָעוֹסְקִין בּוֹ, וּכְשֵׁם שֶׁנִּטְהֲרוּ בְּאֶפְרוֹ, שֶׁנֶּאֱמַר \"וַיִּזֶר עַל פְּנֵי הַמַּיִם\" וְגוֹ' (שם), כָּךְ \"וְלָקְחוּ לַטָּמֵא מֵעֲפַר שְׂרֵפַת הַחַטָּאת\" וְגוֹ\": <small>[רש\"י בשם ר' משה הדרשן]<\/small>", "rashi_en": "וכל אשר יגע בו הטמא AND WHATSOEVER THE UNCLEAN PERSON TOUCHETH — i.e., this unclean person who has become unclean by reason of a corpse, SHALL TOUCH, יטמא SHALL BECOME UNCLEAN. <br><br>והנפש הנגעת AND THE SOUL THAT TOUCHETH him that hath become unclean by reason of a corpse,<br><br>תטמא עד הערב SHALL BE UNCLEAN UNTIL THE EVEN — Here we learn that a corpse is a progenitor of a primary source of uncleanness, and he that touches it becomes a primary source of uncleanness and can render a human being unclean. — This is its explanation (that of the whole chapter) according to what it literally implies and according to the Halachoth connected with it. — A Midrashic explanation I have copied from the work of R. Moses the Preacher, and this is:<br><br>ויקחו אליך AND THEY SHALL TAKE UNTO THEE — They shall take from that which is their own: just as they divested themselves of their golden earrings for making of the calf — i.e., of that which was their own, so shall they bring this calf-like animal as an atonement from that which is their own.<br><br>פרה אדמה A RED COW — Why this rite was performed with a cow may be exemplified by a parable it may be compared to the case of a handmaid’s child that defiled the king’s palace. They said: Let the mother come and wipe up the excrement. Similarly here: since they became defiled by a calf, let its mother (a cow) come and atone for the calf (cf. Midrash Tanchuma, Chukat 8).<br><br>אדמה RED — It had to be red in allusion to the idea contained in the text (Isaiah 1:18): “Though they (your sins) be red as scarlet [they shall become as white as snow]” — so you see that sin is termed red.<br><br>תמימה PERFECT — in allusion to the Israelites who were perfect but through it (the calf) became morally maimed: let this perfect animal come and atone for them so that they may regain their state of perfection.<br><br>לא עלה עליה על [A COW] UPON WHICH NEVER CAME A YOKE — just as they cast off themselves the yoke of Heaven.<br><br>אל אלעזר הכהן TO ELEAZAR THE PRIEST — just as they gathered together against Aaron who was a priest to force him to make the golden calf. But because Aaron had made the calf this rite was not entrusted to him that it should be carried out by him, because the prosecuting counsel cannot become the defending counsel (Rosh Hashanah 26a; cf. Rashi on Leviticus 16:4; Aaron who had caused the sin was not a fitting person to atone for it: therefore the rite had to be performed by another priest, viz., by Eleazar).<br><br>ושרף את הפרה AND ONE SHALL BURN THE COW, just as the calf was burnt (Exodus 32:20).<br><br>עץ ארז ואזוב ושני תולעת CEDAR WOOD AND HYSSOP AND CRIMSON — These three species correspond to the three thousand men who fell by the edge of the sword on account of the golden calf. The cedar is the loftiest of all trees and the hyssop the lowliest of all — a symbol that the man of high position who displays pride and on that account falls into sin should make himself as lowly as the hyssop and the worm (תולעת), and he will then gain atonement.<br><br>למשמרת [IT SHALL BE] KEPT [FOR THE CONGREGATION OF THE CHILDREN OF ISRAEL], just as the transgression of the calf is kept in remembrance for all future generations for punishment, for there is no visitation of Israel in which there is not something of the visitation of the sin caused by the calf, as it is said, (Exodus 32:34) “On the day when I visit I will visit [their sin upon them]” (cf. Rashi on that verse, and Sanhedrin 102a; Yerushalmi Taanit 14). And just as the calf rendered unclean everyone who busied himself with it (cf. Avodah Zarah 32b), so, too, does the cow make unclean all who busy themselves with it. And just as they (Israel) were purified by its dust (Exodus 22:20), similarly it states, (v. 17) “And for an unclean person shall they take of the dust of the burnt cow of purification, etc.”"}, {"ch": 20, "v": 1, "aliyah": 1, "heb": "וַיָּבֹ֣אוּ בְנֵֽי־יִ֠שְׂרָאֵ֠ל כׇּל־הָ֨עֵדָ֤ה מִדְבַּר־צִן֙ בַּחֹ֣דֶשׁ הָֽרִאשׁ֔וֹן וַיֵּ֥שֶׁב הָעָ֖ם בְּקָדֵ֑שׁ וַתָּ֤מׇת שָׁם֙ מִרְיָ֔ם וַתִּקָּבֵ֖ר שָֽׁם׃", "onk": "וַאֲתוֹ בְנֵי יִשְׂרָאֵל כָּל כְּנִשְׁתָּא לְמַדְבְּרָא דְצִין בְּיַרְחָא קַדְמָאָה וִיתֵב עַמָּא <b>בִּרְקָם<\/b> וּמִיתַת תַּמָּן מִרְיָם וְאִתְקְבָרַת תַּמָּן:", "onk_en": "The entire community of Bnei Yisroel came to the wilderness of Tzin, in the first month. The people settled in Kodeish [<b>Rekom<\/b>], and Miriam died and was buried there.", "pj": "וְאָתוּ בְּנֵי יִשְרָאֵל כָּל כְּנִשְׁתָּא לְמַדְבְּרָא דְצִין בְּעַשְרָא יוֹמִין לְיַרְחָא דְנִיסָן וּמִיתַת תַּמָן מִרְיָם וְאִתְקַבָּרַת תַּמָן", "pj_en": "And the whole congregation of the children of Israel came to the desert of Zin on the tenth day of the month Nisan. And Miriam died there, and was buried there.", "tj": "", "tj_en": "", "rashi": "<b>כל העדה.<\/b> עֵדָה הַשְּׁלֵמָה, שֶׁכְּבָר מֵתוּ מֵתֵי מִדְבָּר וְאֵלּוּ פֵרְשׁוּ לַחַיִּים:<br><br><b>ותמת שם מרים.<\/b> לָמָּה נִסְמְכָה פָרָשַׁת מִיתַת מִרְיָם לְפָרָשַׁת פָּרָה אֲדֻמָּה? לוֹמַר לְךָ, מַה קָּרְבָּנוֹת מְכַפְּרִין, אַף מִיתַת צַדִּיקִים מְכַפֶּרֶת (מועד קטן כ\"ח):<br><br><b>ותמת שם מרים.<\/b> אַף הִיא בִנְשִׁיקָה מֵתָה, וּמִפְּנֵי מָה לֹא נֶאֱמַר בָּהּ \"עַל פִּי ה'\"? שֶׁאֵינוֹ דֶּרֶךְ כָּבוֹד שֶׁל מַעְלָה, וּבְאַהֲרֹן נֶאֱמַר \"עַל פִּי ה'\" בְּאֵלֶּה מַסְעֵי (במדבר ל\"ג):", "rashi_en": "כל העדה [THE CHILDREN OF ISRAEL], EVEN THE WHOLE CONGREGATION — The congregation in its entirety, for those who were to die in the wilderness in consequence of their sin had already died, but these had been expressly mentioned for life (cf. Rashi on v. 22).<br><br>ותמת שם מרים AND MIRIAM DIED THERE — Why is the section narrating the death of Miriam placed immediately after the section treating of the red cow? To suggest to you the following comparison: What is the purpose of the sacrifices? They effect atonement! So, too, does the death of the righteous effect atonement! (Moed Katan 28a).<br><br>ותמת שם מרים AND MIRIAM DIED THERE — She, too, as Moses and Aaron, died by a Divine Kiss. But why is it not said with reference to her: she died “by the command (lit., mouth) of God”, (this being the Biblical expression from which is derived the Midrashic statement that they died by the Divine Kiss)? Because this would not be a respectful way of speaking about the Most High God, as it would have reference to a woman. But of Aaron it says in the Sedrah אלה מסעי (Numbers 33:38), “By the mouth of the Lord” (Moed Katan 28a)."}, {"ch": 20, "v": 2, "aliyah": 1, "heb": "וְלֹא־הָ֥יָה מַ֖יִם לָעֵדָ֑ה וַיִּקָּ֣הֲל֔וּ עַל־מֹשֶׁ֖ה וְעַֽל־אַהֲרֹֽן׃", "onk": "וְלָא הֲוָה מַיָּא לִכְנִשְׁתָּא וְאִתְכְּנָשׁוּ עַל משֶׁה וְעַל אַהֲרֹן:", "onk_en": "There was no water for the community, and they assembled against Moshe and Aharon.", "pj": "וּלְפוּם דְבִזְכוּתָא דְמִרְיָם אִתְיְהִיבַת בֵּירָא כַּד שְׁכִיבַת אִתְגְנִיזַת בֵּירָא וְלָא הֲוָה מוֹי לִכְנִישְׁתָּא וְאִתְכְּנִישׁוּ עַל משֶׁה וְעַל אַהֲרן", "pj_en": "And as on account of the innocency of Miriam a well had been given, so when she died the well was hidden, and the congregation had no water.", "tj": "", "tj_en": "", "rashi": "<b>ולא היה מים לעדה.<\/b> מִכָּאן שֶׁכָּל אַרְבָּעִים שָׁנָה הָיָה לָהֶם הַבְּאֵר בִּזְכוּת מִרְיָם (תענית ט'):", "rashi_en": "ולא היה מים לעדה AND THERE WAS NO WATER FOR THE CONGREGATION — Since this statement follows immediately after the mention of Miriam’s death, we may learn from it that during the entire forty years they had the “well” through Miriam’s merit (Taanit 9a)."}, {"ch": 20, "v": 3, "aliyah": 1, "heb": "וַיָּ֥רֶב הָעָ֖ם עִם־מֹשֶׁ֑ה וַיֹּאמְר֣וּ לֵאמֹ֔ר וְל֥וּ גָוַ֛עְנוּ בִּגְוַ֥ע אַחֵ֖ינוּ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּנְצָא עַמָּא עִם משֶׁה וַאֲמָרוּ לְמֵימַר וּלְוֵי דְמִתְנָא בְּמוֹתָא דְאַחָנָא קֳדָם יְיָ:", "onk_en": "The people quarreled with Moshe and said, “Would that we had died by our brothers’ death before Adonoy.", "pj": "וּנְצָא עַמָא עַל משֶׁה וַאֲמַרוּ לְמֵימָר הַלְוַאי דְמִיתְנָא כַּד מִיתוּ אֲחָנָא קֳדָם יְיָ", "pj_en": "And they gathered against Mosheh and Aharon, and the people contended with Mosheh, and said, Would that we had died when our brethren died before the Lord!", "tj": "", "tj_en": "", "rashi": "<b>ולו גוענו.<\/b> הַלְוַאי שֶׁגָּוַעְנוּ:<br><br><b>בגוע אחינו.<\/b> בְּמִיתַת אַחֵינוּ בַּדֶּבֶר, לִמֵּד שֶׁמִּיתַת צָמָא מְגֻנָּה מִמֶּנָּה:<br><br><b>בגוע.<\/b> שֵׁם דָּבָר הוּא, כְּמוֹ בְּמִיתַת אַחֵינוּ, וְלֹא יִתָּכֵן לְפָרְשׁוֹ כְּשֶׁמֵּתוּ אַחֵינוּ, שֶׁאִם כֵּן הָיָה לוֹ לִנָּקֵד בִּגְוֹעַ:", "rashi_en": "ולו גוענו — means, WOULD THAT WE HAD DIED.<br><br>בגוע אחינו means, by the death of our brethren — i.e., by the pestilence. This tells us that death by thirst is worse than that (i.e., than death by pestilence). <br><br>בגוע — This is a noun and means the same as במיתת אחינו, “by the death of our brethren”; and it would not be correct to explain (translate) it: “when our brethren died”, for if this were so, it should be voweled to read בִּגְוֹעַ."}, {"ch": 20, "v": 4, "aliyah": 1, "heb": "וְלָמָ֤ה הֲבֵאתֶם֙ אֶת־קְהַ֣ל יְהֹוָ֔ה אֶל־הַמִּדְבָּ֖ר הַזֶּ֑ה לָמ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּבְעִירֵֽנוּ׃", "onk": "וּלְמָא אַעֶלְתּוּן יָת קְהָלָא דַיְיָ לְמַדְבְּרָא הָדֵין לִמְמַת תַּמָּן אֲנַחְנָא וּבְעִירָנָא:", "onk_en": "Why did you bring the congregation of Adonoy into this wilderness for us and our livestock to die there?", "pj": "וּלְמָא אָתֵיתוּן יַת קְהָלָא דַיְיָ לְמַדְבְּרָא הָדֵין לִמְמַת תַּמָן אֲנַחְנָא וּבְעִירָנָא", "pj_en": "And why hast thou brought the congregation of the Lord into this desert, that we and our cattle may die here?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 5, "aliyah": 1, "heb": "וְלָמָ֤ה הֶֽעֱלִיתֻ֙נוּ֙ מִמִּצְרַ֔יִם לְהָבִ֣יא אֹתָ֔נוּ אֶל־הַמָּק֥וֹם הָרָ֖ע הַזֶּ֑ה לֹ֣א&thinsp;<b>׀<\/b> מְק֣וֹם זֶ֗רַע וּתְאֵנָ֤ה וְגֶ֙פֶן֙ וְרִמּ֔וֹן וּמַ֥יִם אַ֖יִן לִשְׁתּֽוֹת׃", "onk": "וּלְמָא אַסֶּקְתּוּנָא מִמִּצְרַיִם לְאַיְתָאָה יָתָנָא לְאַתְרָא בִישָׁא הָדֵין לָא אָתַר <b>כְּשַׁר<\/b> לְבֵית זְרַע <b>וְאַף לָא<\/b> תֵינִין וְגוּפְנִין וְרִמּוֹנִין וּמַיָּא לֵית לְמִשְׁתֵּי:", "onk_en": "Why did you take us out of Egypt and bring us to this terrible place? It is not a place [<b>fit<\/b>] for seed, [<b>nor for<\/b>] figs, grapes, or pomegranates; and there is no water to drink!”", "pj": "וּלְמָא אַסֵיקְתּוּנָא מִמִצְרַיִם לְאַיְתָאָה יָתָן לְאַתְרָא בִּישָׁא הָדֵין לָא אֲתַר כְּשַׁר לְבֵית דְרַע וְאוּף לָא לְמִנְצַב תֵּינִין וְגוּפְנִין וְרוֹמָנִין וּמוֹי לֵית לְמִשְׁתֵּי", "pj_en": "And why didst thou make us come up out of Mizraim., to bring us to this evil place, a place which is not fit for sowing, or for planting fig trees, or vines, or pomegranates, and where there is no water to drink?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 6, "aliyah": 1, "heb": "וַיָּבֹא֩ מֹשֶׁ֨ה וְאַהֲרֹ֜ן מִפְּנֵ֣י הַקָּהָ֗ל אֶל־פֶּ֙תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽיִּפְּל֖וּ עַל־פְּנֵיהֶ֑ם וַיֵּרָ֥א כְבוֹד־יְהֹוָ֖ה אֲלֵיהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְעַל משֶׁה וְאַהֲרֹן מִן קֳדָם קְהָלָא לִתְרַע מַשְׁכַּן זִמְנָא וּנְפָלוּ עַל אַפֵּיהוֹן וְאִתְגְּלֵי יְקָרָא דַיְיָ לְהוֹן:", "onk_en": "Moshe and Aharon moved away from the assembly to the entrance of the Tent of Meeting, and fell on their faces; the glory of Adonoy appeared to them.", "pj": "וְעָאל משֶׁה וְאַהֲרן מִן קֳדָם תּוּרְעֲמוּת קְהָלָא לִתְרַע מַשְׁכַּן זִמְנָא וְאִתְרְכִינוּ עַל אַפֵּיהוֹן וְאִתְגְלֵי אִיקַר שְׁכִינְתָּא דַיְיָ לְהוֹן", "pj_en": "And Mosheh and Aharon went from the face of the murmuring congregation to the door of the tabernacle of ordinance, and bowed upon their faces, and the Glory of the Lord's Shekinah was revealed to them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 7, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying.", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 8, "aliyah": 2, "heb": "קַ֣ח אֶת־הַמַּטֶּ֗ה וְהַקְהֵ֤ל אֶת־הָעֵדָה֙ אַתָּה֙ וְאַהֲרֹ֣ן אָחִ֔יךָ וְדִבַּרְתֶּ֧ם אֶל־הַסֶּ֛לַע לְעֵינֵיהֶ֖ם וְנָתַ֣ן מֵימָ֑יו וְהוֹצֵאתָ֨ לָהֶ֥ם מַ֙יִם֙ מִן־הַסֶּ֔לַע וְהִשְׁקִיתָ֥ אֶת־הָעֵדָ֖ה וְאֶת־בְּעִירָֽם׃", "onk": "סַב יָת חוּטְרָא וְאַכְנֵשׁ יָת כְּנִשְׁתָּא אַתְּ וְאַהֲרֹן אָחוּךְ וּתְמַלְּלוּן עִם כֵּיפָא לְעֵינֵיהוֹן וְיִתֵּן מוֹהִי וְתַפֵּק לְהוֹן מַיָּא מִן כֵּיפָא וְתַשְׁקֵי יָת כְּנִשְׁתָּא וְיָת בְּעִירְהוֹן:", "onk_en": "“Take the staff and assemble the community, you and Aharon your brother, and speak to the rock in their presence that it may give forth its water; you will then bring forth for them water from the rock, and give drink [to] the community and their livestock.”", "pj": "סַב יַת חוֹטֶר נִיסַיָא וּכְנַשׁ יַת כְּנִישְׁתָּא אַנְתְּ וְאַהֲרן אָחוּךְ וְתוּמוּן תְּרֵיכוֹן יַת כֵּיפָא בִּשְׁמָא רַבָּא וּמְפַרְשָׁא כַּד הִינוּן חַמְיָין וְיִתֵּן מוֹהִי וְאִין יְסָרֵב לְאַפּוֹקֵי מָחֵי אַנְתְּ לְחוֹדָךְ בֵּיהּ בְּחוּטְרָא דְבִידָךְ וּתְהַנְפֵּק לְהוֹן מַיָא מִן כֵּיפָא וְתַשְׁקֵי יַת כְּנִישְׁתָּא וְיַת בְּעִירֵיהוֹן", "pj_en": "Take the rod of the miracles, and gather the congregation, thou, and Aharon thy brother, and both of you adjure the rock, by the Great and manifested Name, while they look on, and it shall give forth its waters: but if it refuse to bring forth, smite thou it once with the rod that is in thy hand, and thou wilt bring out water for them from the rock, that the congregation and their cattle may drink.", "tj": "", "tj_en": "", "rashi": "<b>ואת בעירם.<\/b> מִכָּאן שֶׁחָס הַקָּבָּ\"ה עַל מָמוֹנָם שֶׁל יִשְׂרָאֵל:", "rashi_en": "ואת בעירם [SO SHALT THOU GIVE THE CONGREGATION] AND THEIR BEASTS [TO DRINK] From this we may see that the Holy One, blessed be He, has regard for the possessions of Israel (Menachot 76b; Midrash Tanchuma, Chukat 9)."}, {"ch": 20, "v": 9, "aliyah": 2, "heb": "וַיִּקַּ֥ח מֹשֶׁ֛ה אֶת־הַמַּטֶּ֖ה מִלִּפְנֵ֣י יְהֹוָ֑ה כַּאֲשֶׁ֖ר צִוָּֽהוּ׃", "onk": "וּנְסִיב משֶׁה יָת חוּטְרָא מִן קֳדָם יְיָ כְּמָא דִי פַּקְּדֵיהּ:", "onk_en": "Moshe took the staff from before Adonoy, as He instructed him.", "pj": "וּנְסֵיב משֶׁה יַת חוֹטֶר נִיסַיָא מִן קֳדָם יְיָ הֵיכְמָא דְפַקְדֵיהּ", "pj_en": "And Mosheh took the rod of the miracles from before the Lord, as he had commanded him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 10, "aliyah": 2, "heb": "וַיַּקְהִ֜לוּ מֹשֶׁ֧ה וְאַהֲרֹ֛ן אֶת־הַקָּהָ֖ל אֶל־פְּנֵ֣י הַסָּ֑לַע וַיֹּ֣אמֶר לָהֶ֗ם שִׁמְעוּ־נָא֙ הַמֹּרִ֔ים הֲמִן־הַסֶּ֣לַע הַזֶּ֔ה נוֹצִ֥יא לָכֶ֖ם מָֽיִם׃", "onk": "וְאַכְנִישׁוּ משֶׁה וְאַהֲרֹן יָת קְהָלָא לָקֳדָם כֵּיפָא וַאֲמַר לְהוֹן שְׁמָעוּ כְעַן סַרְבָנַיָּא הֲמִן כֵּיפָא הָדֵין נַפֵּק לְכוֹן מַיָּא:", "onk_en": "Moshe and Aharon assembled the community before the rock; [Moshe] said to them, “Listen, you rebels! Can we extract water from this rock for you?”", "pj": "וּכְנִישׁוּ משֶׁה וְאַהֲרן יַת קְהָלָא לִקְדָם כֵּיפָא וַאֲמַר לְהוֹן משֶׁה שְׁמָעוּ כְדוֹן סוּרְבָנַיָא הֲמִן כֵּיפָא הָדֵין אֶפְשַׁר לָן לְהַנְפָּקָא לְכוֹן מַיָא", "pj_en": "And Mosheh and Aharon gathered the congregation together before the rock. And Mosheh said to them, Hear now, rebels: is it possible for us to bring forth water for you from this rock?", "tj": "", "tj_en": "", "rashi": "<b>ויקהלו וגו'.<\/b> זֶה אֶחָד מִן הַמְּקוֹמוֹת שֶׁהֶחֱזִיק מוּעָט אֶת הַמְרֻבֶּה (בראשית רבה ה'):<br><br><b>המן הסלע הזה נוציא.<\/b> לְפִי שֶׁלֹּא הָיוּ מַכִּירִין אוֹתוֹ, לְפִי שֶׁהָלַךְ הַסֶּלַע וְיָשַׁב לוֹ בֵּין הַסְּלָעִים כְּשֶׁנִּסְתַּלֵּק הַבְּאֵר, וְהָיוּ יִשְׂרָאֵל אוֹמְרִים לָהֶם מַה לָּכֶם מֵאֵי זֶה סֶלַע תּוֹצִיאוּ לָנוּ מַיִם? לְכָךְ אָמַר לָהֶם <b>המרים<\/b> — סַרְבָנִים, לְשׁוֹן יְוָנִי שׁוֹטִים, מוֹרִים אֶת מוֹרֵיהֶם, הֲמִן הַסֶּלַע הַזֶּה שֶׁלֹּא נִצְטַוִּינוּ עָלָיו נוֹצִיא לָכֶם מַיִם? (תנחומא):", "rashi_en": "ויקהלו וגו׳ [AND MOSES AND AARON] ASSEMBLED [THE WHOLE CONGREGATION BEFORE THE ROCK] — This was one of the places where the smaller contained the greater, (the entire congregation being assembled in front of one rock) (Leviticus Rabbah 10:9).<br><br>המן הסלע הזה נוציא MUST WE BRING [WATER] OUT OF THIS ROCK? — They said this because they could not distinguish it (the rock intended by God), for the rock from which the water had hitherto flowed during these forty years had vanished and taken a place amongst the other rocks when the “well” disappeared after Miriam’s death, and Israel said to them, “What difference is it to you from which rock you bring forth water for us?” — It was on this account that he (Moses) said unto them (called them) המרים — which may mean “refractory”, or, as a Greek expression, “foolish people” (µώροι), or, “such as would teach (מורים) their teachers” — from this rock about which we have received no Divine Command can we bring forth water for you?! (cf. Midrash Tanchuma, Chukat 9)."}, {"ch": 20, "v": 11, "aliyah": 2, "heb": "וַיָּ֨רֶם מֹשֶׁ֜ה אֶת־יָד֗וֹ וַיַּ֧ךְ אֶת־הַסֶּ֛לַע בְּמַטֵּ֖הוּ פַּעֲמָ֑יִם וַיֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַתֵּ֥שְׁתְּ הָעֵדָ֖ה וּבְעִירָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲרֵם משֶׁה יָת יְדֵיהּ וּמְחָא יָת כֵּיפָא בְּחוּטְרֵיהּ תַּרְתֵּין זִמְנִין וּנְפָקוּ מַיָּא סַגִּיאֵי וּשְׁתִיאַת כְּנִשְׁתָּא וּבְעִירְהוֹן:", "onk_en": "And Moshe raised his hand and struck the rock with his staff twice; water rushed out abundantly, and the community and their livestock drank.", "pj": "וּזְקֵף משֶׁה יַת יְדֵיהּ וּמְחָא יַת כֵּיפָא בְּחוּטְרֵיהּ תַּרְתֵּין זִמְנִין בְּזִמְנָא קַמָאָה אֲטִיפַת אַדְמָא וּבְזִמְנָא תִּנְיָינָא נְפָקוּ מַיִין סַגִיאִין וְאִשְׁתִיאַת כְּנִשְׁתָּא וּבְעִירֵיהוֹן", "pj_en": "And Mosheh lifted up his hand, and with his rod struck the rock two times: at the first time it dropped blood; but at the second time there came forth a multitude of waters. And the congregation and their cattle drank.", "tj": "וְאַרְעֵם משֶׁה:", "tj_en": "And Mosheh lifted up.", "rashi": "<b>פעמים.<\/b> לְפִי שֶׁבָּרִאשׁוֹנָה לֹא הוֹצִיא אֶלָּא טִפִּין, לְפִי שֶׁלֹּא צִוָּה הַמָּקוֹם לְהַכּוֹתוֹ, אֶלָּא \"וְדִבַּרְתֶּם אֶל הַסֶּלַע\", וְהֵמָּה דִּבְּרוּ אֶל סֶלַע אַחֵר וְלֹא הוֹצִיא, אָמְרוּ, שֶׁמָּא צָרִיךְ לְהַכּוֹתוֹ כְּבָרִאשׁוֹנָה, שֶׁנֶּאֱמַר \"וְהִכִּיתָ בַצּוּר\" (שמות י\"ז), וְנִזְדַּמֵּן לָהֶם אוֹתוֹ סֶלַע וְהִכָּהוּ (תנחומא):", "rashi_en": "פעמים [HE SMOTE THE ROCK] TWICE, because at the first attempt it did not bring forth more than a few drops, for God had not bidden him smite it, but He had said, (v. 8) “and ye shall speak to the rock”. They had, indeed, spoken, but to a different rock (not that which God had intended) and it had not given forth water. They said, “Perhaps it is necessary to smite it as on the former occasion when it says, (Exodus 17:6) ‘and ye shall smite the rock’, and just that rock intended by God happened to be there and they smote it [but without full effect, and so they smote it a second time] (cf. Midrash Tanchuma, Chukat 9)."}, {"ch": 20, "v": 12, "aliyah": 2, "heb": "וַיֹּ֣אמֶר יְהֹוָה֮ אֶל־מֹשֶׁ֣ה וְאֶֽל־אַהֲרֹן֒ יַ֚עַן לֹא־הֶאֱמַנְתֶּ֣ם בִּ֔י לְהַ֨קְדִּישֵׁ֔נִי לְעֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָכֵ֗ן לֹ֤א תָבִ֙יאוּ֙ אֶת־הַקָּהָ֣ל הַזֶּ֔ה אֶל־הָאָ֖רֶץ אֲשֶׁר־נָתַ֥תִּי לָהֶֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרֹן חֲלַף דִּי לָא הֵמַנְתּוּן <b>בְּמֵימְרִי<\/b> לְקַדָּשׁוּתִי לְעֵינֵי בְּנֵי יִשְׂרָאֵל בְּכֵן לָא תַעֲלוּן יָת קְהָלָא הָדֵין לְאַרְעָא דִּי יְהָבִית לְהוֹן:", "onk_en": "Adonoy said to Moshe and Aharon, “Because you did not believe in Me [<b>My word<\/b>] to sanctify Me in the presence of Bnei Yisroel; therefore, you will not bring this congregation into the land that I have given them.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרן בִּשְׁבוּעֲתָא חוּלַף דְלָא הֵימַנְתּוּן בְּמֵימְרִי לְקַדָשׁוּתִי לְמֶחֱמֵיהוֹן בִּבְנֵי יִשְרָאֵל בְּגִין כֵּן לָא תְהַנְעֲלוּן יַת קְהָלָא הָדֵין לְאַרְעָא דִי אֶתֵּן לְהוֹן", "pj_en": "But the Lord spake to Mosheh and Aharon with the oath, Because ye have not believed in My Word, to sanctify Me in the sight of the children of Israel, therefore you shall not bring this congregation into the land that I will give them.", "tj": "", "tj_en": "", "rashi": "<b>יען לא האמנתם בי.<\/b> גִּלָּה הַכָּתוּב שֶׁאִלּוּלֵי חֵטְא זֶה בִּלְבַד הָיוּ נִכְנָסִין לָאָרֶץ, כְּדֵי שֶׁלֹּא יֹאמְרוּ עֲלֵיהֶם כַּעֲוֹן דּוֹר הַמִּדְבָּר שֶׁנִּגְזַר עֲלֵיהֶם שֶׁלֹּא יִכָּנְסוּ, כָּךְ הָיָה עֲוֹן מֹשֶׁה וְאַהֲרֹן; וַהֲלֹא \"הֲצֹאן וּבָקָר יִשָּׁחֵט\" (במדבר יא, כב) קָשָׁה מִזּוֹ? אֶלָּא לְפִי שֶׁבַּסֵּתֶר, חִסֵּךְ עָלָיו הַכָּתוּב, וְכָאן שֶׁבְּמַעֲמַד כָּל יִשְׂרָאֵל, לֹא חִסֵּךְ עָלָיו הַכָּתוּב מִפְּנֵי קִדּוּשׁ הַשֵּׁם:<br><br><b>להקדישני.<\/b> שֶׁאִלּוּ דִּבַּרְתֶּם אֶל הַסֶּלַע וְהוֹצִיא, הָיִיתִי מְקֻדָּשׁ לְעֵינֵי הָעֵדָה, וְאוֹמְרִים מַה סֶּלַע זֶה שֶׁאֵינוֹ מְדַבֵּר וְאֵינוֹ שׁוֹמֵעַ וְאֵינוֹ צָרִיךְ לְפַרְנָסָה מְקַיֵּם דִּבּוּרוֹ שֶׁל מָקוֹם, קַל וָחֹמֶר אָנוּ:<br><br><b>לכן לא תביאו.<\/b> בִּשְׁבוּעָה, כְּמוֹ \"וְלָכֵן נִשְׁבַּעְתִּי לְבֵית עֵלִי\" (שמואל א ג'), נִשְׁבַּע בִּקְפִיצָה שֶׁלֹּא יַרְבּוּ בִתְפִלָּה עַל כָּךְ:", "rashi_en": "יען לא האמנתם בי BECAUSE YE BELIEVED ME NOT — Scripture discloses the fact that but for this sin alone, they would have entered the land of Canaan, in order that people should not say of them, “Even as the sin of the generation of the Wilderness (a term used of those who left Egypt) on whom it was decreed that they should not enter the Land was the sin of Moses and Aaron” (cf. Rashi on Numbers 27:13). But was not the doubting question (cf. Rashi on Numbers 11:22), “shall the sheep and oxen be slaughtered for them?” a more grievous lack of faith in God than this? But because that had been said in private (no Israelites being present and therefore it could have no evil influence upon them), Scripture (God) spared him (and did not make his lack of faith public by pronouncing punishment for it), but here, where all Israel were standing by, Scripture does not spare him because of the Hallowing of the Divine Name (cf. Midrash Tanchuma, Chukat 10).<br><br>להקדישני TO SANCTIFY ME — For had you spoken to the rock and it had brought forth water I would have been sanctified before the whole congregation, for they would have said: What is the case with this rock which cannot speak and cannot hear and needs no maintenance? It fulfils the bidding of the Omnipresent God! How much more should we do so?<br><br>לכן לא תביאו THEREFORE YE SHALL NOT BRING — This expression (“therefore”) is used by way of an oath, just as (I Samuel 3:14), “Therefore I have sworn to the house of Eli”. Here He was quick to take an oath in order that they should not pray at length about it (that He should withdraw the decree) (Midrash Tanchuma, Vaera 2)."}, {"ch": 20, "v": 13, "aliyah": 2, "heb": "הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר־רָב֥וּ בְנֵֽי־יִשְׂרָאֵ֖ל אֶת־יְהֹוָ֑ה וַיִּקָּדֵ֖שׁ בָּֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִנּוּן מֵי מַצּוּתָא דִּי נְצוֹ בְּנֵי יִשְׂרָאֵל <b>קֳדָם<\/b> יְיָ וְאִתְקַדַּשׁ בְּהוֹן:", "onk_en": "They are the waters of dispute where Bnei Yisroel contended with [<b>before<\/b>] Adonoy, and He was sanctified through them.", "pj": "הִינוּן מֵי מַצוּתָא דְנָצוּ בְּנֵי יִשְרָאֵל קֳדָם יְיָ עַל עֵיסַק בֵּירָא דְאִתְגְנִיזַת וְאִתְקְדַשׁ בְּהוֹן בְּמשֶׁה וְאַהֲרן כַּד אִתְיְהִיבַת לְהוֹן", "pj_en": "These are the Waters of Contention, where the sons of Israel contended before the Lord on account of the well that had been hidden; and He was sanctified in them, in Mosheh and Aharon, when (the waters) were given to them.", "tj": "", "tj_en": "", "rashi": "<b>המה מי מריבה.<\/b> הֵם הַנִּזְכָּרִים בְּמָקוֹם אַחֵר; אֶת אֵלּוּ רָאוּ אִצְטַגְנִינֵי פַרְעֹה, שֶׁמּוֹשִׁיעָן שֶׁל יִשְׂרָאֵל לוֹקֶה בַמַּיִם, לְכָךְ גָּזְרוּ (שמות א') \"כָּל הַבֵּן הַיִּלּוֹד הַיְאֹרָה תַּשְׁלִיכֻהוּ\" (סנהדרין ק\"א):<br><br><b>ויקדש בם.<\/b> שֶׁמֵּתוּ מֹשֶׁה וְאַהֲרֹן עַל יָדָם; כְּשֶׁהַקָּבָּ\"ה עוֹשֶׂה דִּין בִּמְקֻדָּשָׁיו הוּא יָראוּי וּמִתְקַדֵּשׁ עַל הַבְּרִיּוֹת, וְכֵן הוּא אוֹמֵר \"נוֹרָא אֱלֹהִים מִמִּקְדָּשֶׁיךָ\" (תהילים ס\"ח), וְכֵן הוּא אוֹמֵר \"בִּקְרֹבַי אֶקָּדֵשׁ\" (ויקרא י'):", "rashi_en": "המה מי מריבה THESE ARE THE WATERS OF MERIBAH — These are they that were alluded to, though unwittingly, on another occasion: these it was that Pharaoh’s astrologers foresaw, saying that Israel’s deliverer would be punished through water. On that account they decreed (Exodus 1:22) “Every son that is born shall ye cast into the river” (Sanhedrin 101b).<br><br>ויקדש בם AND HE WAS SANCTIFIED IN THEM — For Moses and Aaron died on account of them (cf. Targum Jonathan on). When the Holy One, blessed be He, executes judgement upon those who are holy to Him he is revered and sanctified by mankind. Similarly does it state, (Psalms 68:36) “Revered art Thou when Thou showest Thyself אלהים, Judge, in consequence of thy hallowed ones”; and similarly, too, does it state, (Leviticus 10:3) “Through those that draw near unto me shall I be sanctified” (see Rashi on that verse; Zevachim 115b)."}, {"ch": 20, "v": 14, "aliyah": 2, "heb": "וַיִּשְׁלַ֨ח מֹשֶׁ֧ה מַלְאָכִ֛ים מִקָּדֵ֖שׁ אֶל־מֶ֣לֶךְ אֱד֑וֹם כֹּ֤ה אָמַר֙ אָחִ֣יךָ יִשְׂרָאֵ֔ל אַתָּ֣ה יָדַ֔עְתָּ אֵ֥ת כׇּל־הַתְּלָאָ֖ה אֲשֶׁ֥ר מְצָאָֽתְנוּ׃", "onk": "וּשְׁלַח משֶׁה אִזְגַּדִּין <b>מֵרְקָם<\/b> לְוָת מַלְכָּא דֶאֱדוֹם כִּדְנַן אֲמַר אָחוּךְ יִשְׂרָאֵל אַתְּ יְדַעַתְּ יָת כָּל עָקְתָא דִּי אַשְׁכַּחְתָּנָא:", "onk_en": "Moshe sent emissaries from Kodeish [<b>Rekom<\/b>] to the King of Edom (saying), “This is what your brother Yisroel declares; you know of all the hardship that we have encountered.", "pj": "וְשָׁדַר משֶׁה אִזְגַדִין מֵרְקָם לְוַת מַלְכָּא דֶאֱדוֹם לְמֵימָר כִּדְנַן אָמַר אָחוּךְ יִשְרָאֵל אַנְתְּ יַדְעַת יַת כָּל אַנִיקֵי דְאַשְׁכַּחְתָּנָא", "pj_en": "Then Mosheh sent messengers from Rekem unto the king of Edom, saying, Thus saith thy brother Israel. Thou hast known all the trouble that hath found us;", "tj": "", "tj_en": "", "rashi": "<b>אחיך ישראל.<\/b> מָה רָאָה לְהַזְכִּיר כָּאן אַחֲוָה? אֶלָּא אָמַר לוֹ אַחִים אֲנַחְנוּ, בְּנֵי אַבְרָהָם, שֶׁנֶּאֱמַר לוֹ \"כִּי גֵר יִהְיֶה זַרְעֲךָ\" (בראשית ט\"ו), וְעַל שְׁנֵינוּ הָיָה אוֹתוֹ הַחוֹב לְפָרְעוֹ (תנחומא):<br><br><b>אתה ידעת את כל התלאה.<\/b> לְפִיכָךְ פֵּרֵשׁ אֲבִיכֶם מֵעַל אָבִינוּ, שֶׁנֶּאֱמַר \"וַיֵּלֶךְ אֶל אֶרֶץ מִפְּנֵי יַעֲקֹב אָחִיו\" (בראשית ל״ו:ו׳) — מִפְּנֵי הַשְּׁטָר חוֹב הַמֻּטָּל עֲלֵיהֶם, וְהִטִּילוֹ עַל יַעֲקֹב:", "rashi_en": "אחיך ישראל THY BROTHER ISRAEL — What reason had he to mention here their brotherhood? But in effect he said to him: We are brothers, sons of Abraham to whom it was said, (Genesis 15:13) “know for a surety that thy seed shall be a stranger [in a land not theirs]”, and upon both of us, being of Abraham’s seed, was the duty of paying that debt (Midrash Tanchuma, Chukat 12).<br><br>אתה ידעת את כל התלאה THOU KNOWEST ALL THE TRAVAIL — It was on this account that your father separated himself from our father, as it is said, (Genesis 36:6), \"And he (Esau) went to another land on account of Jacob, his brother” — on account of the bond which devolved upon both of them, and he cast the whole of it upon Jacob (Genesis Rabbah 82:13; cf. Rashi on Genesis 36.7.2)."}, {"ch": 20, "v": 15, "aliyah": 2, "heb": "וַיֵּרְד֤וּ אֲבֹתֵ֙ינוּ֙ מִצְרַ֔יְמָה וַנֵּ֥שֶׁב בְּמִצְרַ֖יִם יָמִ֣ים רַבִּ֑ים וַיָּרֵ֥עוּ לָ֛נוּ מִצְרַ֖יִם וְלַאֲבֹתֵֽינוּ׃", "onk": "וּנְחָתוּ אֲבָהָתָנָא לְמִצְרַיִם וִיתֵבְנָא בְמִצְרַיִם יוֹמִין סַגִּיאִין וְאַבְאִישׁוּ לָנָא מִצְרָאֵי וְלַאֲבָהָתָנָא:", "onk_en": "Our forefathers went down to Egypt and we remained in Egypt for a long time; the Egyptians mistreated us and our forefathers.", "pj": "וּנְחָתוּ אַבְהָתָן לְמִצְרַיִם וִיתֵיבְנָא בְמִצְרַיִם יוֹמִין סַגִיאִין וְאַבְאִישׁוּ לָנָא מִצְרָאֵי וּלְאַבְהָתָנָא", "pj_en": "that our fathers went down into Mizraim and dwelt in Mizraim many days, and the Mizraee afflicted us and our fathers.", "tj": "", "tj_en": "", "rashi": "<b>וירעו לנו.<\/b> סָבַלְנוּ צָרוֹת רַבּוֹת:<br><br><b>ולאבתינו.<\/b> מִכָּאן שֶׁהָאָבוֹת מִצְטַעֲרִים בַּקֶּבֶר כְּשֶׁפֻּרְעָנוּת בָּאָה עַל יִשְֹרָאֵל (עי' תנחומא):", "rashi_en": "וירעו לנו AND [THE EGYPTIANS] DID EVIL TO US — we have borne many adversities. <br><br>ולאבתינו [THEY DID EVIL TO US] AND TO OUR FATHERS — From here we may learn that the patriarchs grieve in their graves when punishment comes upon Israel (cf. Midrash Tanchuma, Chukat 12)."}, {"ch": 20, "v": 16, "aliyah": 2, "heb": "וַנִּצְעַ֤ק אֶל־יְהֹוָה֙ וַיִּשְׁמַ֣ע קֹלֵ֔נוּ וַיִּשְׁלַ֣ח מַלְאָ֔ךְ וַיֹּצִאֵ֖נוּ מִמִּצְרָ֑יִם וְהִנֵּה֙ אֲנַ֣חְנוּ בְקָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽךָ׃", "onk": "וְצַלֵּינָא קֳדָם יְיָ וְקַבִּיל צְלוֹתָנָא וּשְׁלַח מַלְאָכָא וְאַפְּקָנָא מִמִּצְרָיִם וְהָא אֲנַחְנָא בִרְקַם קַרְתָּא דְּבִסְטַר תְּחוּמָךְ:", "onk_en": "Then we cried out [<b>prayed<\/b>] to Adonoy, and He heard our voice [<b>accept our prayer<\/b>], He sent an emissary and led us out of Egypt; now we are in Kodeish [<b>Rekom<\/b>], a city at the edge of your border.", "pj": "וְצַלִינָא קֳדָם יְיָ וְקַבֵּיל צְלוֹתָנָא וְשָׁדַר חַד מִמַלְאֲכֵי שֵׁירוּתָא וְהַנְפָקָנָא מִמִצְרַיִם וְהָא אֲנַחְנָא בִּרְקַם קַרְתָּא דְמִתְבַּנְיָא בִּסְטַר תְּחוּמָךְ", "pj_en": "And we prayed before the Lord, who heard our prayers, and sent one of the ministering angels to lead us out of Mizraim: and, behold, we are in Rekem, a city built on the side of thy border.", "tj": "", "tj_en": "", "rashi": "<b>וישמע קלנו.<\/b> בַּבְּרָכָה שֶׁבֵּרְכָנוּ אָבִינוּ \"הַקֹּל קוֹל יַעֲקֹב\", שֶׁאָנוּ צוֹעֲקִים וְנַעֲנִים (תנחומא בשלח):<br><br><b>מלאך.<\/b> זֶה מֹשֶׁה, מִכָּאן שֶׁהַנְּבִיאִים קְרוּאִים מַלְאָכִים, וְאוֹמֵר \"וַיִּהְיוּ מַלְעִבִים בְּמַלְאֲכֵי הָאֱלֹהִים\" (דברי הימים ב' ל\"ו):", "rashi_en": "וישמע קלנו HE HEARD OUR VOICE — through the blessing with which our father, Jacob, had blessed us — “the voice is Jacob’s voice” (Genesis 27:22), because whenever we cry we are answered (Midrash Tanchuma, Beshalach 9 on בשלח).<br><br>מלאך A MESSENGER (or an angel) — This was Moses; from this we may learn that the prophets are termed “angel”; so, too, it says, (II Chronicles 36:16) “And they grieved the angels (מלאכי) of God” (Leviticus Rabbah 1:1)."}, {"ch": 20, "v": 17, "aliyah": 2, "heb": "נַעְבְּרָה־נָּ֣א בְאַרְצֶ֗ךָ לֹ֤א נַעֲבֹר֙ בְּשָׂדֶ֣ה וּבְכֶ֔רֶם וְלֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַמֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּשְׂמֹ֔אול עַ֥ד אֲשֶֽׁר־נַעֲבֹ֖ר גְּבֻלֶֽךָ׃", "onk": "נְעִבַּר כְּעַן בְּאַרְעָךְ לָא נְעִבַּר בַּחֲקַל וּבִכְרַם וְלָא נִשְׁתֵּי מֵי גוֹב בְּאֹרַח מַלְכָּא נֵזֵל לָא נִסְטֵי לְיַמִּינָא וְלִשְׂמָאלָא עַד דִּנְעִבַּר תְּחוּמָךְ:", "onk_en": "Please let us pass through your land, we will not pass through any field or vineyard, and we will not drink well water; we will travel by the king’s road, we will not turn aside to the right or left, until we have passed through your territory.”", "pj": "נְעִיבַר כְּדוֹן בְּאַרְעָךְ לָא נְשַׁרְגְנָא בְּתוּלַן וְלָא נְאַנְנַס אֲרִיסַן וְלָא נִבְעוֹל נְשֵׁי גוּבְרִין בְּאוֹרַח מַלְכָּא דְבִשְׁמַיָא נֵיזֵיל וְלָא נִסְטֵי לְיַמִינָא וְלִשְמָאלָא לְהַנְזָקָא בִּשְׁבִילֵי רְשׁוּתָא עַד דִנְעִיבַּר תְּחוּמָךְ", "pj_en": "Let us now pass through thy land: we will not seduce virgins, nor carry off the betrothed, nor commit adultery: on the king's highway, under the heavens, we will go forward, and turn not to the right or to the left, to do any injury in the public way while we pass through thy border.", "tj": "נְעִיבַּר כְּעַן בְּאַרְעָךְ לָא נֵינוּס אֲנִיסָן וְלָא נְשַׁרַגְנָא בְתוּלַן וְלָא נִבְעֵי נְשֵׁי גוּבְרִין בְּאִסְטְרָטָא דְמַלְכָּא נֵזִיל לָא נִסְטֵי לָא לִימִין וְלָא לִשְמאל עַד זְמַן דִי נְעִיבַר תְּחוּמָךְ:", "tj_en": "Let us now pass through thy country. We will do no kind of mischief, neither seduce virgins nor seek the wives of the men; by the highway of the king we will proceed, nor turn to the right or the left till we have passed through thy coast.", "rashi": "<b>נעברה נא בארצך.<\/b> אֵין לְךָ לְעוֹרֵר עַל הַיְרֻשָּׁה שֶׁל אֶרֶץ יִשְׂרָאֵל, כְּשֵׁם שֶׁלֹּא פָרַעְתָּ הַחוֹב, עֲשֵׂה לָנוּ עֵזֶר מְעַט לַעֲבֹר דֶּרֶךְ אַרְצְךָ:<br><br><b>ולא נשתה מי באר.<\/b> מֵי בוֹרוֹת הָיָה צָרִיךְ לוֹמַר, אֶלָּא כָּךְ אָמַר מֹשֶׁה, אַעַ\"פִּ שֶׁיֵּשׁ בְּיָדֵנוּ מָן לֶאֱכֹל וּבְאֵר לִשְׁתּוֹת, לֹא נִשְׁתֶּה מִמֶּנּוּ, אֶלָּא נִקְנֶה מִכֶּם אֹכֶל וּמַיִם לַהֲנָאַתְכֶם, מִכָּאן לְאַכְסְנַאי אַעַ\"פִּ שֶׁיֵּשׁ בְּיָדוֹ לֶאֱכֹל יִקְנֶה מִן הַחֶנְוָנִי, כְּדֵי לְהַנּוֹת אֶת אֻשְׁפִּיזוֹ (תנחומא):<br><br><b>דרך המלך נלך וגו'.<\/b> אָנוּ חוֹסְמִים אֶת בְּהֶמְתֵּנוּ וְלֹא יִטּוּ לְכָאן וּלְכָאן לֶאֱכֹל (שם):", "rashi_en": "נעברה נא בארצך LET US PASS, I PRAY THEE, THROUGH THY COUNTRY — You have no right to lay claim to the land of Israel as an inheritance, just the same as you have not paid the debt (see Rashi v. 14); render us therefore a little assistance by permitting us to pass through your land. <br><br>ולא נשתה מי באר NEITHER WILL WE DRINK OF THE WATER OF THE SPRINGS — He should have said “water of the cisterns (בורות)”; but this was what Moses meant to
