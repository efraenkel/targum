"Adonoy blessed my master greatly and he prospered. He gave him sheep, cattle, silver, gold, male slaves, female slaves, camels and donkeys.", "pj": "וַיְיָ בְּרִיךְ יַת רִבּוֹנִי לַחֲדָא וּרְבָא וִיהַב לֵיהּ עָאן וְתוֹרִין וְכַסְפָּא וְדַהֲבָא וְעַבְדִין וְאַמְהָן וְגַמְלִין וְחַמְרִין", "pj_en": "And the Lord hath blessed my master greatly, and hath increased, and given him sheep and oxen, silver and gold, servants and handmaids, and camels and asses.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 36, "aliyah": 4, "heb": "וַתֵּ֡לֶד שָׂרָה֩ אֵ֨שֶׁת אֲדֹנִ֥י בֵן֙ לַֽאדֹנִ֔י אַחֲרֵ֖י זִקְנָתָ֑הּ וַיִּתֶּן־ל֖וֹ אֶת־כׇּל־אֲשֶׁר־לֽוֹ׃", "onk": "וִילֵידַת שָׂרָה אִתַּת רִבּוֹנִי בַר לְרִבּוֹנִי בָּתַר דְּסֵיבָת וִיהַב לֵיהּ יָת כָּל דִּילֵיהּ:", "onk_en": "Sarah, the wife of my master gave birth to a son to my master, after she had grown old, and he has given him all that he possesses.", "pj": "וִילֵדַת שָרָה אִיתַּת רִבּוֹנִי בַּר לְרִבּוֹנִי בָּתַר דְסֵיבַת וִיהַב לֵיהּ יַת כָּל דִילֵיהּ", "pj_en": "And Sarah; my master's wife, bare a son after she was old, and he hath given to him all that he hath.", "tj": "", "tj_en": "", "rashi": "<b>ויתן לו את כל אשר לו.<\/b> שְׁטָר הַמַּתָּנָה הֶרְאָה לָהֶם:", "rashi_en": "ויתן לו את כל אשר לו AND HE HATH GIVEN TO HIM ALL THAT HE HATH — he showed them the deed of gift. "}, {"ch": 24, "v": 37, "aliyah": 4, "heb": "וַיַּשְׁבִּעֵ֥נִי אֲדֹנִ֖י לֵאמֹ֑ר לֹא־תִקַּ֤ח אִשָּׁה֙ לִבְנִ֔י מִבְּנוֹת֙ הַֽכְּנַעֲנִ֔י אֲשֶׁ֥ר אָנֹכִ֖י יֹשֵׁ֥ב בְּאַרְצֽוֹ׃", "onk": "וְקַיֵּם עָלַי רִבּוֹנִי לְמֵימָר לָא תִסַּב אִתְּתָא לִבְרִי מִבְּנַת כְּנַעֲנָאֵי דִּי אֲנָא יָתֵב בְּאַרְעֵיהּ:", "onk_en": "My master placed me under oath, saying, Do not take a wife for my son from the daughters of the Canaanites, in whose land I live.", "pj": "וְאוֹמֵי יָתִי רִבּוֹנִי לְמֵימָר לָא תִסַב אִיתְּתָא לִבְרִי מִבְּנַת כְּנַעֲנָאֵי דַאֲנָא יָתִיב בְּאַרְעֲהוֹן", "pj_en": "And my master made me swear, saying, Thou shalt not take a wife for my son from the daughters of the Kenaanites in whose land I dwell,", "tj": "", "tj_en": "", "rashi": "<b>לא תקח אשה לבני מבנות הכנעני.<\/b> אִם לֹא תֵּלֵךְ תְּחִלָּה אֶל בֵּית אָבִי וְלֹא תֹאבֶה לָלֶכֶת אַחֲרֶיךָ:", "rashi_en": "לא תקח אשה לבני מבנות הכנעני THOU SHALT NOT TAKE A WIFE FOR MY SON FROM THE DAUGHTERS OF THE CANAANITES if you do not first go to my father’s house and to my family that thou mayest take a wife to my son and she will not be willing to follow you. "}, {"ch": 24, "v": 38, "aliyah": 4, "heb": "אִם־לֹ֧א אֶל־בֵּית־אָבִ֛י תֵּלֵ֖ךְ וְאֶל־מִשְׁפַּחְתִּ֑י וְלָקַחְתָּ֥ אִשָּׁ֖ה לִבְנִֽי׃", "onk": "אֱלָהֵן לְבֵית אַבָּא תֵּזֵיל וּלְזַרְעִיתִי וְתִסַּב אִתְּתָא לִבְרִי:", "onk_en": "Instead, you must go to my father’s house, and to my family. Take a wife for my son.", "pj": "אֱלָהֵן לְבֵית אִיבָּא תֵּזִיל וּלְיִיחוּסִי וְתִסַב אִיתָא לִבְרִי", "pj_en": "but shall go to my kindred, and take a wife for my son.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 39, "aliyah": 4, "heb": "וָאֹמַ֖ר אֶל־אֲדֹנִ֑י אֻלַ֛י לֹא־תֵלֵ֥ךְ הָאִשָּׁ֖ה אַחֲרָֽי׃", "onk": "וַאֲמָרִית לְרִבּוֹנִי מָאִים לָא תֵיתֵי אִתְּתָא בַּתְרָי:", "onk_en": "I said to my master, Perhaps the woman will not come back with me?", "pj": "וַאֲמָרִית לְרִבּוֹנִי מָאִים לָא תֵיתֵי אִתְּתָא בַּתְרָי", "pj_en": "But I said to my master, Perhaps the woman will not come after me.", "tj": "", "tj_en": "", "rashi": "<b>אלי לא תלך האשה.<\/b> אלי כְּתִיב, בַּת הָיְתָה לוֹ לֶאֱלִיעֶזֶר, וְהָיָה מְחַזֵּר לִמְצֹא עִלָּה שֶׁיֹּאמַר לוֹ אַבְרָהָם לִפְנוֹת אֵלָיו לְהַשִּׂיאוֹ בִּתּוֹ, אָמַר לוֹ אַבְרָהָם בְּנִי בָרוּךְ וְאַתָּה אָרוּר וְאֵין אָרוּר מִדַּבֵּק בְּבָרוּךְ:", "rashi_en": "אלי לא תלך האשה PERADVENTURE THE WOMAN WILL NOT FOLLOW ME —The word אולי perhaps is written without ו so that it may be read אֵלַי unto me. Eliezer had a daughter and he was endeavouring to find some reason why Abraham should say that he must appeal to him (Eliezer) that he should give his daughter in marriage to Isaac. Abraham said to him, “My son is blessed and you are subject to a curse. One who is under a curse cannot unite with one who is blessed” (Genesis Rabbah 59:9)."}, {"ch": 24, "v": 40, "aliyah": 4, "heb": "וַיֹּ֖אמֶר אֵלָ֑י יְהֹוָ֞ה אֲשֶׁר־הִתְהַלַּ֣כְתִּי לְפָנָ֗יו יִשְׁלַ֨ח מַלְאָכ֤וֹ אִתָּךְ֙ וְהִצְלִ֣יחַ דַּרְכֶּ֔ךָ וְלָקַחְתָּ֤ אִשָּׁה֙ לִבְנִ֔י מִמִּשְׁפַּחְתִּ֖י וּמִבֵּ֥ית אָבִֽי׃", "onk": "וַאֲמַר לִי יְיָ דִּי פְלָחִית קֳדָמוֹהִי יִשְׁלַח מַלְאָכֵיהּ עִמָּךְ וְיַצְלַח אָרְחָךְ וְתִסַּב אִתְּתָא לִבְרִי מִזַּרְעִיתִי וּמִבֵּית אַבָּא:", "onk_en": "He said to me, Adonoy, before Whom I have walked [<b>worshiped<\/b>], will send His angel with you, and make your journey successful. You will then take a wife for my son from my family and from my fathers house.", "pj": "וַאֲמַר לִי יְיָ דִפְלָחִית קוּמוֹי יַזְמִין מַלְאָכֵיהּ עִמָךְ וְיַצְלַח אָרְחָךְ וְתִסַב אִיתְּתָא לִבְרִי מִן יְחוּסִי וּמִגְנִיסַת בֵּית אִיבָּא", "pj_en": "And he said to me, The Lord before whom I worship will appoint His angel to be with thee, and will prosper thy way; and thou shalt take a wife for my son from my household, from the race of my father's house.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 41, "aliyah": 4, "heb": "אָ֤ז תִּנָּקֶה֙ מֵאָ֣לָתִ֔י כִּ֥י תָב֖וֹא אֶל־מִשְׁפַּחְתִּ֑י וְאִם־לֹ֤א יִתְּנוּ֙ לָ֔ךְ וְהָיִ֥יתָ נָקִ֖י מֵאָלָתִֽי׃", "onk": "בְּכֵן תְּהֵי זַכַּי (<small>נ\"י<\/small> זַכָּא) מִמּוּמָתִי אֲרֵי תְהַךְ לְזַרְעִיתִי וְאִם לָא יִתְּנוּן לָךְ וּתְהֵי זַכַּי מִמּוּמָתִי:", "onk_en": "You will then be absolved from my oath, if when you come [<b>go<\/b>] to my family, and they will not give her to you. You will be absolved from my oath.", "pj": "בְּכֵין תִּזְדְכִי מִמוֹמָתִי אִין תֵיעוֹל לְבֵית יִחוּסִי וְאִין לָא יִנָתְנוּן לָךְ וּתְהִי זַכָּאִי מִמוּמָתִי", "pj_en": "Then shalt thou be free from my oath: if, when thou art come to the house of my kindred, they give not to thee, thou shalt be free from thy oath.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 42, "aliyah": 4, "heb": "וָאָבֹ֥א הַיּ֖וֹם אֶל־הָעָ֑יִן וָאֹמַ֗ר יְהֹוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣י אַבְרָהָ֔ם אִם־יֶשְׁךָ־נָּא֙ מַצְלִ֣יחַ דַּרְכִּ֔י אֲשֶׁ֥ר אָנֹכִ֖י הֹלֵ֥ךְ עָלֶֽיהָ׃", "onk": "וְאָתִית (<small>נ\"י<\/small> וַאֲתֵיתִי) יוֹמָא דֵין לְעֵינָא וַאֲמָרִית יְיָ אֱלָהָא דְּרִבּוֹנִי אַבְרָהָם <b>אִם אִית כְּעַן רַעֲוָא קֳדָמָךְ לְאַצְלָחָא<\/b> אָרְחִי דִּי אֲנָא אָזֵיל עֲלַהּ:", "onk_en": "I came this day to the well, and I said, Adonoy, God of my master, Avraham, if You will grant success [<b>if it is pleasing before You to grant success<\/b>] to my journey on which I am going.", "pj": "וְאָתִית יוֹמָנָא לְעֵינָא וַאֲמָרִית יְיָ אֱלָהֵיהּ דְרִבּוֹנִי אַבְרָהָם אִין אִיתָךְ כְּדוֹן מַצְלַח אָרְחִי דַאֲנָא אָזִיל עֲלָהּ", "pj_en": "And I came today to the fountain, and said, Lord God of my master Abraham, if now Thou hast prospered the journey upon which I have come,", "tj": "", "tj_en": "", "rashi": "<b>ואבא היום.<\/b> הַיּוֹם יָצָאתִי וְהַיּוֹם בָּאתִי, מִכָּאן שֶׁקָּפְצָה לוֹ הָאָרֶץ. אָמַר רַבִּי אֲחָא יָפָה שִׂיחָתָן שֶׁל עַבְדֵי אָבוֹת לִפְנֵי הַמָּקוֹם מִתּוֹרָתָן שֶׁל בָּנִים, שֶׁהֲרֵי פָּרָשָׁה שֶׁל אֱלִיעֶזֶר כְּפוּלָה בַּתּוֹרָה וְהַרְבֵּה גּוּפֵי תוֹרָה לֹא נִתְּנוּ אֶלָּא בִּרְמִיזָה (בראשית רבה):", "rashi_en": "ואבא היום AND I CAME THIS DAY — Today I started on my journey and today I have arrived here. Hence we may infer that the earth (the road) shrunk for him (i. e. that the journey was shortened in a miraculous manner) (Sanhedrin 95a). R. Acha said: The ordinary conversation of the patriarchs' servants is more pleasing to God than even the Torah (religious discourse) of their children, for the chapter of Eliezer (the account of his journey) is repeated in the Torah (i. e. it is written once as a narrative and again repeated as part of the conversation of the patriarch’s servant) whereas many important principles of the Law are derived only from slight indications given in the Text (Genesis Rabbah 60:8). "}, {"ch": 24, "v": 43, "aliyah": 4, "heb": "הִנֵּ֛ה אָנֹכִ֥י נִצָּ֖ב עַל־עֵ֣ין הַמָּ֑יִם וְהָיָ֤ה הָֽעַלְמָה֙ הַיֹּצֵ֣את לִשְׁאֹ֔ב וְאָמַרְתִּ֣י אֵלֶ֔יהָ הַשְׁקִֽינִי־נָ֥א מְעַט־מַ֖יִם מִכַּדֵּֽךְ׃", "onk": "הָא אֲנָא קָאֵם עַל עֵינָא דְמַיָּא וִיהֵי עוּלֶמְתָּא דְּתִפּוֹק לְמִמְלֵי וְאֵימַר לַהּ אַשְׁקִינִי <b>כְעַן<\/b> זְעֵיר מַיָּא מִקּוּלְתִיךְ:", "onk_en": "Behold, here I stand at the well of water. When a girl comes out to draw water, I will say to her, Please [<b>Now<\/b>] let me drink a little water from your pitcher.", "pj": "הָא אֲנָא קָאִים עַל עֵינָא דְמַיָא וּתְהֵי רִיבָא דְתִיפּוֹק לְמִמְלֵי וְאֵימַר לָהּ אַשְׁקִינִי כְדוֹן קָלִיל מוֹי מִן לְגִינִיתִיךְ", "pj_en": "behold, I stand at the fountain of water,--let the damsel who may come forth to fill, to whom I will say, Give me now a little water to drink from thy pitcher,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 44, "aliyah": 4, "heb": "וְאָמְרָ֤ה אֵלַי֙ גַּם־אַתָּ֣ה שְׁתֵ֔ה וְגַ֥ם לִגְמַלֶּ֖יךָ אֶשְׁאָ֑ב הִ֣וא הָֽאִשָּׁ֔ה אֲשֶׁר־הֹכִ֥יחַ יְהֹוָ֖ה לְבֶן־אֲדֹנִֽי׃", "onk": "וְתֵימַר לִי אַף אַתְּ אֵשְׁתְּ וְאַף לְגַמְלָךְ אַמְלִי הִיא אִתְּתָא דְּזַמִּין יְיָ לְבַר רִבּוֹנִי:", "onk_en": "If she says to me, You too may drink, and I will also draw water for your camels, then she is the one whom Adonoy has determined for the son of my master.", "pj": "וְתֵימַר לִי אוּף אַנְתְּ שְׁתִי וְאוּף לְגַמְלָךְ אַמְלֵי הִיא אִנְתְּתָא דְזַמִין יְיָ בְּמַזָלָא לְבַר רִבּוֹנִי", "pj_en": "and she say, Drink, and for thy camels also will I draw, be the wife whom the Lord hath prepared by His decree for my master's son.", "tj": "", "tj_en": "", "rashi": "<b>גם אתה.<\/b> גַּם לְרַבּוֹת אֲנָשִׁים שֶׁעִמּוֹ:<br><br><b>הוכיח.<\/b> בֵּרֵר וְהוֹדִיעַ, וְכֵן כָּל הוֹכָחָה שֶׁבַּמִּקְרָא בֵּרוּר דָּבָר:", "rashi_en": "גם אתה DRINK THOU ALSO — Her use of the word גם, also suggests that she intended to include the men who accompanied him.<br><br>הכיח means selected and designated. So, too, wherever this word (the Hiphil of יכח) occurs in the Scriptures it signifies “making something clear”. "}, {"ch": 24, "v": 45, "aliyah": 4, "heb": "אֲנִי֩ טֶ֨רֶם אֲכַלֶּ֜ה לְדַבֵּ֣ר אֶל־לִבִּ֗י וְהִנֵּ֨ה רִבְקָ֤ה יֹצֵאת֙ וְכַדָּ֣הּ עַל־שִׁכְמָ֔הּ וַתֵּ֥רֶד הָעַ֖יְנָה וַתִּשְׁאָ֑ב וָאֹמַ֥ר אֵלֶ֖יהָ הַשְׁקִ֥ינִי נָֽא׃", "onk": "אֲנָא עַד לָא שֵׁיצִיתִי לְמַלָּלָא בְלִבִּי וְהָא רִבְקָה נְפָקַת וְקוּלְתַהּ עַל כַּתְפַּהּ וּנְחָתַת לְעֵינָא וּמְלָת וַאֲמָרִית לַהּ אַשְׁקִינִי <b>כְעָן<\/b>:", "onk_en": "Before I had finished speaking thus in my heart, when suddenly Rivkah came out with her pitcher on her shoulder. She went down to the well and drew water; and I said to her, Please [<b>Now<\/b>] give me a drink,", "pj": "אֲנָא עַד לָא פַּסְקִית לְמַלָלָא עִם הִרְהוּרֵי לִבִּי וְהָא רִבְקָה נַפְקַת וּלְגִינְתָהּ עַל כַּתְפָהּ וּנְחָתַת לְעַיְינָא וּמְלַת וַאֲמָרִית לָהּ אַשְׁקִינִי כְדוּן", "pj_en": "I had not yet finished speaking in the thoughts of my heart, when, behold, Rivekah came forth with the pitcher upon (her) shoulder, and went down to the fountain, and filled. And I said, Let me now drink.", "tj": "", "tj_en": "", "rashi": "<b>טרם אכלה.<\/b> טֶרֶם שֶׁאֲנִי מְכַלֶּה, וְכֵן כָּל לְשׁוֹן הוֹוֶה, פְּעָמִים שֶׁהוּא מְדַבֵּר בִּלְשׁוֹן עָבָר וְיָכוֹל לִכְתֹּב טֶרֶם כִּלִּיתִי, וּפְעָמִים שֶׁמְּדַבֵּר בִּלְשׁוֹן עָתִיד, כְּמוֹ כִּי אָמַר אִיּוֹב, הֲרֵי לְשׁוֹן עָבָר, כָּכָה יַעֲשֶׂה אִיּוֹב (איוב א'), הֲרֵי לְשׁוֹן עָתִיד, וּפֵרוּשׁ שְׁנֵיהֶם לְשׁוֹן הוֹוֶה, כִּי אוֹמֵר הָיָה אִיּוֹב אוּלַי חָטְאוּ בָנַי וגו', וְהָיָה עוֹשֶׁה כָּךְ:", "rashi_en": "טרם אכלה means I WAS NOT YET FINISHING. Similarly in the case of every word that expresses an action contemporaneous with another Scripture sometimes uses the past tense — so that it might have written here טרם כִּלִיתִי — and sometimes it uses the future tense. Examples are: (Job I. 5) “For Job was saying (אמר)” — here it is past tense and (ib.) “Thus was Job doing (יעשה)” — here it is future tense. But the meaning of both of them is contemporaneous action: “for Job was saying (whilst he sacrificed) “Perhaps my sons have sinned etc.\" “and he was doing this\" (whenever his sons feasted)."}, {"ch": 24, "v": 46, "aliyah": 4, "heb": "וַתְּמַהֵ֗ר וַתּ֤וֹרֶד כַּדָּהּ֙ מֵֽעָלֶ֔יהָ וַתֹּ֣אמֶר שְׁתֵ֔ה וְגַם־גְּמַלֶּ֖יךָ אַשְׁקֶ֑ה וָאֵ֕שְׁתְּ וְגַ֥ם הַגְּמַלִּ֖ים הִשְׁקָֽתָה׃", "onk": "וְאוֹחִיאַת וַאֲחִיתַת קוּלְתַהּ מִנַּהּ וַאֲמָרַת אֵשְׁתְּ וְאַף גַּמְלָךְ אַשְׁקִי וּשְׁתֵיתִי וְאַף גַּמְלַיָּא אַשְׁקִיאַת:", "onk_en": "She quickly lowered her pitcher and said, Drink, and I will also give your camels to drink. I drank and she also gave the camels to drink.", "pj": "וְאוֹחִיאַת וַאֲחִיתַת לְגִינְתָהּ מִינָהּ וַאֲמָרִית שְׁתִי וְאוּף גַמְלִיךְ אַשְׁקִי וְשָׁתִיתִי וְאוּף גַמְלַיָיא אַשְׁקִיַית", "pj_en": "And she hastened and let down her pitcher from her, and said, Drink, and I will also give thy camels drink.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 47, "aliyah": 4, "heb": "וָאֶשְׁאַ֣ל אֹתָ֗הּ וָאֹמַר֮ בַּת־מִ֣י אַתְּ֒ וַתֹּ֗אמֶר בַּת־בְּתוּאֵל֙ בֶּן־נָח֔וֹר אֲשֶׁ֥ר יָֽלְדָה־לּ֖וֹ מִלְכָּ֑ה וָאָשִׂ֤ם הַנֶּ֙זֶם֙ עַל־אַפָּ֔הּ וְהַצְּמִידִ֖ים עַל־יָדֶֽיהָ׃", "onk": "וּשְׁאֵילִית יָתַהּ וַאֲמָרִית בַּת מָן אַתְּ וַאֲמֶרֶת בַּת בְּתוּאֵל בַּר נָחוֹר דִּילֵידַת לֵיהּ מִלְכָּה וְשַׁוֵּיתִי קָדָשָׁא עַל אַפַּהּ וְשֵׁירַיָּא עַל יְדָהָא:", "onk_en": "I asked her and said, Whose daughter are you? She replied, The daughter of Besueil, son of Nachor, whom Milkah bore unto him. I [then] placed a nose ring on her face and bracelets upon her hands.", "pj": "וּשְׁאִילַת יָתָהּ וַאֲמָרִית בְּרַתְּ מָאן אַנְתְּ וַאֲמַרַת בְּרַת בְּתוּאֵל בַּר נָחוֹר דִלֵידַת לֵיהּ מִלְכָּה וְשַׁוִיַת קָדָשָׁא עַל אַפָּהּ וְשִׁירַיָא עַל יָדָהָא", "pj_en": "And I asked her, and said, Whose daughter art thou? And she said, The daughter of Bethuel, the son of Nachor, whom Milcha bare to him. And I set the jewel upon her brow, and the bracelets on her hand,", "tj": "", "tj_en": "", "rashi": "<b>ואשאל. ואשם.<\/b> שִׁנָּה הַסֵּדֶר, שֶׁהֲרֵי הוּא תְּחִלָּה נָתַן וְאַחַר כָּךְ שָׁאַל, אֶלָּא שֶׁלֹּא יִתְפְּשׂוּהוּ בִּדְבָרָיו וְיֹאמְרוּ הַאֵיךְ נָתַתָּ לָהּ וַעֲדַיִן אֵינְךָ יוֹדֵעַ מִי הִיא:", "rashi_en": "ואשאל...ואשם AND I ASKED HER ... AND I PUT THE RING —He changed the order of proceedings for in fact he had first given the presents and afterwards questioned her. But he did this in order that they should not catch him by his own words and say, \"How could you give her anything when you did not yet know who she was!\" "}, {"ch": 24, "v": 48, "aliyah": 4, "heb": "וָאֶקֹּ֥ד וָֽאֶשְׁתַּחֲוֶ֖ה לַיהֹוָ֑ה וָאֲבָרֵ֗ךְ אֶת־יְהֹוָה֙ אֱלֹהֵי֙ אֲדֹנִ֣י אַבְרָהָ֔ם אֲשֶׁ֤ר הִנְחַ֙נִי֙ בְּדֶ֣רֶךְ אֱמֶ֔ת לָקַ֛חַת אֶת־בַּת־אֲחִ֥י אֲדֹנִ֖י לִבְנֽוֹ׃", "onk": "וּכְרָעִית וּסְגָדִית <b>קֳדָם<\/b> יְיָ וּבָרֵכִית יָת יְיָ אֱלָהֵהּ דְּרִבּוֹנִי אַבְרָהָם דְּדַבְּרַנִי בְּאוֹרַח קְשׁוֹט לְמִיסַב יָת בַּת אֲחוּהִי דְרִבּוֹנִי לִבְרֵיהּ:", "onk_en": "I bowed and prostrated myself to [<b>before<\/b>] Adonoy, and I blessed Adonoy, God of my master Avraham, Who led me on the true path [in order] to take the daughter of my master’s brother for his son.", "pj": "וּגְחָנִית וּסְגִידִית קֳדָם יְיָ וּבְרִיכִית יַת יְיָ אֱלָהֵיהּ דְרִיבּוֹנִי אַבְרָהָם דְדַבְּרַנִי בְּאוֹרַח קְשׁוֹט לְמֵיסַב יַת בְּרַת אָחוֹי דְרִבּוֹנִי לִבְרֵיהּ", "pj_en": "and bowed and worshipped before the Lord; and I blessed the Lord, the God of my master Abraham, who had led me in the true way to take the daughter of master's brother for his son.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 49, "aliyah": 4, "heb": "וְ֠עַתָּ֠ה אִם־יֶשְׁכֶ֨ם עֹשִׂ֜ים חֶ֧סֶד וֶֽאֱמֶ֛ת אֶת־אֲדֹנִ֖י הַגִּ֣ידוּ לִ֑י וְאִם־לֹ֕א הַגִּ֣ידוּ לִ֔י וְאֶפְנֶ֥ה עַל־יָמִ֖ין א֥וֹ עַל־שְׂמֹֽאל׃", "onk": "וּכְעַן אִם אִיתֵיכוֹן עָבְדִין <b>טִיבוּ<\/b> וּקְשׁוֹט עִם רִבּוֹנִי חַוּוֹ לִי וְאִם לָא חַוּוֹ לִי וְאִתְפְּנֵי עַל יַמִּינָא אוֹ עַל שְׂמָאלָא:", "onk_en": "Now if you want to do what is kind [<b>good<\/b>] and true to my master, tell me. If not, tell me, and I will turn to the right or to the left.", "pj": "וּכְדוֹן אִין אִיתֵיכוֹן עָבְדִין טִיבוּ וּקְשׁוֹט עִם רִבּוֹנִי תָּנוּ לִי וְאִין לָא תָּנוּ לִי וְאִיפְנֵי עַל דָרוֹמָא אוֹ עַל צִפוּנָא", "pj_en": "And now, if you will deal kindly and truly with my master, tell me; and if not, tell me, that I may turn to the south or to the north.", "tj": "", "tj_en": "", "rashi": "<b>על ימין.<\/b> מִבְּנוֹת יִשְׁמָעֵאל:<br><br><b>על שמאל.<\/b> מִבְּנוֹת לוֹט, שֶׁהָיָה יוֹשֵׁב לִשְׂמֹאלוֹ שֶׁל אַבְרָהָם:", "rashi_en": "על ימין TO THE RIGHT HAND — to take a wife of the daughters of Ishmael.<br><br>על שמאל TO THE LEFT — to take a wife of the daughters of Lot who dwelt at the left of Abraham (Genesis Rabbah 60:9). "}, {"ch": 24, "v": 50, "aliyah": 4, "heb": "וַיַּ֨עַן לָבָ֤ן וּבְתוּאֵל֙ וַיֹּ֣אמְר֔וּ מֵיְהֹוָ֖ה יָצָ֣א הַדָּבָ֑ר לֹ֥א נוּכַ֛ל דַּבֵּ֥ר אֵלֶ֖יךָ רַ֥ע אוֹ־טֽוֹב׃", "onk": "וְאָתֵיב לָבָן וּבְתוּאֵל וַאֲמַרוּ מִן <b>קֳדָם<\/b> יְיָ נְפַק פִּתְגָּמָא לֵית אֲנַחְנָא יָכְלִין לְמַלָּלָא עִמָּךְ בִּישׁ אוֹ טָב:", "onk_en": "Lavan and Besueil answered and said, This is from [<b>before<\/b>] Adonoy, we cannot say anything to you, bad or good.", "pj": "וְאָתֵיב לָבָן וּבְתוּאֵל וְאָמְרוּ מִן קֳדָם יְיָ נְפַק פִּתְגָמָא דְרִבְקָה אִתְיְהִיבַת לְיִצְחָק אֲנַן לָא נֵיכוֹל לְמַלָלָא לָךְ בִּישׁ אוֹ טָב", "pj_en": "And Laban and Bethuel answered and said, The thing hath come forth from before the Lord that Rivekah should be given to Izhak, and we cannot say to thee either evil or good.", "tj": "", "tj_en": "", "rashi": "<b>ויען לבן ובתואל.<\/b> רָשָׁע הָיָה, וְקָפַץ לְהָשִׁיב לִפְנֵי אָבִיו:<br><br><b>לא נוכל דבר אליך.<\/b> לְמָאֵן בַּדָּבָר הַזְֶּה לֹא עַל יְדֵי תְשׁוּבַת דָּבָר רַע וְלֹא עַל יְדֵי תְשׁוּבַת דָּבָר הָגוּן, וְנִכָּר שֶׁמֵּה' יָצָא הַדָּבָר, לְפִי דְּבָרֶיךָ שֶׁזִּמְּנָהּ לְךָ (בראשית רבה):", "rashi_en": "ויען לבן ובתואל THEN LABAN AND BETHUEL ANSWERED —He (Laban) was a wicked person and so rushed in to answer before his father.<br><br>לא נוכל דבר אליך WE CANNOT SPEAK UNTO THEE — refusing this proposition either by answering you with unpleasant words (i. e. a flat refusal) or by giving you a reasoned reply, for it is evident that the matter proceedeth from the Lord since, according to your statement, He brought her and you together. "}, {"ch": 24, "v": 51, "aliyah": 4, "heb": "הִנֵּֽה־רִבְקָ֥ה לְפָנֶ֖יךָ קַ֣ח וָלֵ֑ךְ וּתְהִ֤י אִשָּׁה֙ לְבֶן־אֲדֹנֶ֔יךָ כַּאֲשֶׁ֖ר דִּבֶּ֥ר יְהֹוָֽה׃", "onk": "הָא רִבְקָה קֳדָמָךְ דְּבַר וְאֵיזִיל וּתְהֵי אִתְּתָא לְבַר רִבּוֹנָךְ כְּמָא דִּי מַלֵּל יְיָ:", "onk_en": "Here, Rivkah is before you, take her and go. Let her be a wife to your master’s son, as Adonoy has spoken.", "pj": "הָא רִבְקָה קוּמָךְ דְבַר וְאֵיזִיל וּתְהֵי אִיתָא לְבַר רִבּוֹנָךְ כְּמָא דְמַלֵיל יְיָ", "pj_en": "Behold, Rivekah is before thee, take and go, and let her be the wife of thy master's son, as the Lord hath spoken.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 52, "aliyah": 4, "heb": "וַיְהִ֕י כַּאֲשֶׁ֥ר שָׁמַ֛ע עֶ֥בֶד אַבְרָהָ֖ם אֶת־דִּבְרֵיהֶ֑ם וַיִּשְׁתַּ֥חוּ אַ֖רְצָה לַֽיהֹוָֽה׃", "onk": "וַהֲוָה כַּד שְׁמַע עַבְדָּא דְאַבְרָהָם יָת פִּתְגָּמֵיהוֹן וּסְגֵד עַל אַרְעָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "When Avraham’s servant heard their words, he prostrated himself to the ground to [<b>before<\/b>] Adonoy.", "pj": "וַהֲוָה כַּד שְׁמַע עַבְדָא דְאַבְרָהָם יַת פִּתְגָמֵיהוֹן וּסְגִיד עַל אַרְעָא קֳדָם יְיָ", "pj_en": "And when Abraham's servant heard these words, he worshipped on the ground before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>וישתחו ארצה.<\/b> מִכָּאן שֶׁמּוֹדִים עַל בְּשׂוֹרָה טוֹבָה:", "rashi_en": "וישתחו ארצה HE PROSTRATED HIMSELF — From this we may learn that we should thank God for good news (Genesis Rabbah 60:6). "}, {"ch": 24, "v": 53, "aliyah": 5, "heb": "וַיּוֹצֵ֨א הָעֶ֜בֶד כְּלֵי־כֶ֨סֶף וּכְלֵ֤י זָהָב֙ וּבְגָדִ֔ים וַיִּתֵּ֖ן לְרִבְקָ֑ה וּמִ֨גְדָּנֹ֔ת נָתַ֥ן לְאָחִ֖יהָ וּלְאִמָּֽהּ׃", "onk": "וְאַפֵּק עַבְדָּא מָנִין דִּכְסַף וּמָנִין דִּדְהַב וּלְבוּשִׁין וִיהַב לְרִבְקָה וּמִגְדָּנִין יְהַב לַאֲחוּהָא וּלְאִמַּהּ:", "onk_en": "The servant took out articles of silver, articles of gold and garments, and gave them to Rivkah. To her brother and mother, he gave precious fruits.", "pj": "וְהַנְפַק עַבְדָא מָנִין דִכְסַף וּמָנִין דִדְהַב וּלְבוּשִׁין וִיהַב לְרִבְקָה וְדוֹרוֹנִין יְהַב לְאָחוּהָא וּלְאִמָהּ", "pj_en": "And the servant brought forth vessels of silver and of gold, and vestments, and gave them to Rivekah; and presents give he to her brother and to her mother.", "tj": "", "tj_en": "", "rashi": "<b>ומגדנות.<\/b> לְשׁוֹן מְגָדִים, שֶׁהֵבִיא עִמּוֹ מִינֵי פֵּרוֹת שֶׁל אֶרֶץ יִשְׂרָאֵל:", "rashi_en": "ומגדנות PRECIOUS THINGS — it has the same meaning as מגדים (cf. Song 7:14) “precious fruits״, for he had brought with him various kinds of fruit from the land of Israel (Genesis Rabbah 60:11). "}, {"ch": 24, "v": 54, "aliyah": 5, "heb": "וַיֹּאכְל֣וּ וַיִּשְׁתּ֗וּ ה֛וּא וְהָאֲנָשִׁ֥ים אֲשֶׁר־עִמּ֖וֹ וַיָּלִ֑ינוּ וַיָּק֣וּמוּ בַבֹּ֔קֶר וַיֹּ֖אמֶר שַׁלְּחֻ֥נִי לַֽאדֹנִֽי׃", "onk": "וַאֲכָלוּ וּשְׁתִיאוּ הוּא וְגוּבְרַיָּא דִּי עִמֵּיהּ וּבָתוּ וְקָמוּ בְצַפְרָא וַאֲמַר שַׁלְּחוּנִי לְוַת רִבּוֹנִי:", "onk_en": "They [then] ate and drank, he and the men that were with him, and they stayed over night. They got up in the morning and he said, Send me off to my master.", "pj": "וְאָכְלוּ וְשָׁתוּ הוּא וְגוּבְרַיָא דְעִמֵיהּ וּבָתוּ וְקָמוּ בְּצַפְרָא וַאֲמַר שַׁדְרוּנִי לְרִבּוֹנִי", "pj_en": "And they ate and drank, he and the men who were with him, and passed the night. And he arose in the morning, and said, Send me away to my master.", "tj": "", "tj_en": "", "rashi": "<b>וילינו.<\/b> כָּל לִינָה שֶׁבַּמִּקְרָא לִינַת לַיְלָה אֶחָד:", "rashi_en": "וילינו AND LODGED OVER NIGHT — wherever the root לין occurs in Scripture it signifies staying for only one night. "}, {"ch": 24, "v": 55, "aliyah": 5, "heb": "וַיֹּ֤אמֶר אָחִ֙יהָ֙ וְאִמָּ֔הּ תֵּשֵׁ֨ב הַנַּעֲרָ֥ אִתָּ֛נוּ יָמִ֖ים א֣וֹ עָשׂ֑וֹר אַחַ֖ר תֵּלֵֽךְ׃", "onk": "וַאֲמַר אֲחוּהָא וְאִמַּהּ תָּתֵיב עוּלֶמְתָּא עִמָּנָא עִדַּן בְּעִדַּן אוֹ עַשְׂרָא יַרְחִין בָּתַר כֵּן תֵּיזִיל:", "onk_en": "Her brother and mother said, Let the girl abide with us a year or ten months, then she can go.", "pj": "וְעַל דִהֲווֹ מְמַלְלִין בְּרַמְשָׁא בְּתוּאֵל הֲוָה אָכִיל מֵהַהוּא תַבְשִׁילָא וְאַשְׁכְּחוּנוֹהִי בִּקְרִיצְתָּא דְהָא מִית וַאֲמַר אֲחוּהָא וְאִימָא תִּיתַב רִיבָא עִמָנָא יוֹמֵי שַׁתָּא חֲדָא אוֹ עֲשַר יַרְחִין וּבָתַר כְּדֵין תֵּיזִיל", "pj_en": "But as they were talking in the evening, Bethuel had eaten of that prepared food; and in the morning they found that he was dead. And the brother and mother said therefore, Let the damsel dwell with us the days of one year or ten months, and then she shall go.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר אחיה ואמה.<\/b> וּבְתוּאֵל הֵיכָן הָיָה? הָיָה רוֹצֶה לְעַכֵּב וּבָא מַלְאָךְ וֶהֱמִיתוֹ:<br><br><b>ימים.<\/b> שָׁנָה, כְּמוֹ יָמִים תִּהְיֶה גְאֻלָּתוֹ (ויקרא כ\"ה), שֶׁכָּךְ נוֹתְנִין לִבְתוּלָה זְמַן י\"ב חֹדֶש לְפַרְנֵס עַצְמָהּ בְּתַכְשִׁיטִים (כתובות נ\"ז):<br><br><b>או עשור.<\/b> י' חֳדָשִׁים; וְאִם תֹּאמַר יָמִים מַמָּשׁ, אֵין דֶּרֶך הַמְבַקְשִׁים לְבַקֵּש דָּבָר מֻעָט, וְאִם לֹא תִּרְצֶה תֵּן לָנוּ מְרֻבֶּה מִזֶּה:", "rashi_en": "ויאמר אחיה ואמה AND HER BROTHER AND HER MOTHER SAID —But where was Bethuel? He wished to prevent the marriage therefore an angel came and killed him (Genesis Rabbah 60:12).<br><br>ימים (literally, days) means a year — just as (Leviticus 25:29) “For a whole year (ימים) shall he have the right of redemption” — for the custom was to give a maiden twelve months to provide herself with a trousseau (literally, ornaments) (Genesis Rabbah 60:12).<br><br>או עשור OR TEN — i. e. ten months. But if you say that it does really mean “days” (“a few days”, and that it does not mean a year) I reply that it is not usual for people who make a request to ask for a little and to say “If you do not agree to this, then give us even more” (Ketubot 57b). "}, {"ch": 24, "v": 56, "aliyah": 5, "heb": "וַיֹּ֤אמֶר אֲלֵהֶם֙ אַל־תְּאַחֲר֣וּ אֹתִ֔י וַֽיהֹוָ֖ה הִצְלִ֣יחַ דַּרְכִּ֑י שַׁלְּח֕וּנִי וְאֵלְכָ֖ה לַֽאדֹנִֽי׃", "onk": "וַאֲמַר לְהוֹן לָא תְאַחֲרוּן יָתִי וַייָ אַצְלַח אָרְחִי שַׁלְּחוּנִי וְאֵיהַךְ לְוַת רִבּוֹנִי:", "onk_en": "He said to them, Do not detain me, for Adonoy has made my journey successful. Send me off, so that I can go to my master.", "pj": "וַאֲמַר לְהוֹם לָא תְעַכְּבוּן יָתִי וַיְיָ אַצְלַח אוֹרְחִי אִלְוְויוּנִי וְאֵיזִיל לְרִבּוֹנִי", "pj_en": "And he said, Hinder me not, when the Lord hath prospered my way; let me depart, and I will go to my master.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 57, "aliyah": 5, "heb": "וַיֹּאמְר֖וּ נִקְרָ֣א לַֽנַּעֲרָ֑ וְנִשְׁאֲלָ֖ה אֶת־פִּֽיהָ׃", "onk": "וַאֲמַרוּ נִקְרֵי לְעוּלֶמְתָּא <b>וְנִשְׁמָע מַה דְּהִיא אָמְרָה<\/b>:", "onk_en": "They said, Let us call the girl and ask her [<b>and hear what she says<\/b>].", "pj": "וַאֲמָרוּ נִקְרֵי לְרִיבָא וְנִשְׁמַע מַה דְהִיא אָמְרָה", "pj_en": "And they said, We will call Rivekah, and hear what she says.", "tj": "", "tj_en": "", "rashi": "<b>ונשאלה את פיה.<\/b> מִכָּאן שֶׁאֵין מַשִּׂיאִין אֶת הָאִשָּׁה אֶלָּא מִדַּעְתָּהּ (בראשית רבה):", "rashi_en": "ונשאלה את פיה AND ASK HER MOUTH — From this we may infer that a woman should not be given in marriage except with her own consent (Genesis Rabbah 60:12). "}, {"ch": 24, "v": 58, "aliyah": 5, "heb": "וַיִּקְרְא֤וּ לְרִבְקָה֙ וַיֹּאמְר֣וּ אֵלֶ֔יהָ הֲתֵלְכִ֖י עִם־הָאִ֣ישׁ הַזֶּ֑ה וַתֹּ֖אמֶר אֵלֵֽךְ׃", "onk": "וּקְרוֹ לְרִבְקָה וַאֲמַרוּ לַהּ הֲתֵיזְלִי עִם גַּבְרָא הָדֵין וַאֲמֶרֶת אֵיזִיל:", "onk_en": "They called Rivkah and said to her, Will you go with this man? She said, I will go.", "pj": "וּקְרוֹ לְרִבְקָה וַאֲמָרוּ לָהּ הֲתֵיזְלִי עִם גַבְרָא הָדֵין וַאֲמָרַת אִיזֵיל", "pj_en": "And they called Rivekah, and said to her, Wilt thou go with this man? And she said, I will go.", "tj": "", "tj_en": "", "rashi": "<b>ותאמר אלך.<\/b> מֵעַצְמִי, וְאַף אִם אֵינְכֶם רוֹצִים:", "rashi_en": "ותאמר אלך AND SHE SAID, I WILL GO — of my own accord even though you do not consent (Genesis Rabbah 60:12). "}, {"ch": 24, "v": 59, "aliyah": 5, "heb": "וַֽיְשַׁלְּח֛וּ אֶת־רִבְקָ֥ה אֲחֹתָ֖ם וְאֶת־מֵנִקְתָּ֑הּ וְאֶת־עֶ֥בֶד אַבְרָהָ֖ם וְאֶת־אֲנָשָֽׁיו׃", "onk": "וְשַׁלְּחוּ יָת רִבְקָה אֲחַתְהוֹן וְיָת מֵנִקְתַּהּ וְיָת עַבְדָּא דְאַבְרָהָם וְיָת גַּבְרוֹהִי:", "onk_en": "They sent off Rivkah their sister, along with her nurse, and with Avraham’s servant and his men.", "pj": "וְאַלְוִיוּ יַת רִבְקָה אֲחַתְהוֹם וְיַת פַּדְגְוָותָהּ וְיַת עַבְדָא דְאַבְרָהָם וְיַת גוּבְרוֹי", "pj_en": "And they let Rivekah their sister go, and her nurse, and the servant of Abraham, and his men.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 60, "aliyah": 5, "heb": "וַיְבָרְכ֤וּ אֶת־רִבְקָה֙ וַיֹּ֣אמְרוּ לָ֔הּ אֲחֹתֵ֕נוּ אַ֥תְּ הֲיִ֖י לְאַלְפֵ֣י רְבָבָ֑ה וְיִירַ֣שׁ זַרְעֵ֔ךְ אֵ֖ת שַׁ֥עַר שֹׂנְאָֽיו׃", "onk": "וּבָרִיכוּ יָת רִבְקָה וַאֲמַרוּ לַהּ אֲחָתָנָא אַתְּ הֲוֵי לְאַלְפִין <b>וּ<\/b>לְרִבְוָן וְיִרְתוּן בְּנַיְכִי יָת <b>קִרְוֵי<\/b> סַנְאֵיהוֹן:", "onk_en": "They blessed Rivkah and said to her, Our sister, may you become thousands of [<b>and<\/b>] myriads, and may your descendants inherit the gate [<b>cities<\/b>] of his foes.", "pj": "וּבָרִיכוּ יַת רִבְקָה וְאָמָרוּ לָהּ עַד כְּדוּן הֲוֵית אַחְתַן וּכְדוֹן אַתְּ אָזְלָא וּמִתְנַסְבָא לְצַדִיקָא יְהֵי רַעֲוָא דְמִינִיךְ יִפְקוּן אַלְפִין דְרִיבְוָון וְיֵירְתוּן בְּנַיְיכִי יַת קוּרְיֵי סַנְאֵיהוֹם", "pj_en": "And they blessed Rivekah, and said to her, Hitherto thou wast our sister; and now thou art going and art wedded to the righteous; so prosper thou, that from thee may come thousands of myriads; and may thy sons inherit the cities of those who hate them.", "tj": "", "tj_en": "", "rashi": "<b>את היי לאלפי רבבה.<\/b> אַתְּ וְזַרְעֵךְ תְּקַבְּלוּ אוֹתָהּ בְּרָכָה שֶׁנֶּאֱמַר לְאַבְרָהָם בְּהַר הַמּוֹרִיָּה וְהַרְבָּה אַרְבֶּה אֶת זַרְעֲךָ וגו', יְהִי רָצוֹן שֶׁיְּהֵא אוֹתוֹ הַזֶּרַע מִמֵּךְ וְלֹא מֵאִשָּׁה אַחֶרֶת:", "rashi_en": "את היי לאלפי רבבה MAYEST THOU BECOME THOUSANDS OF MYRIADS —May you and your seed receive that blessing which was promised to Abraham on Mount Moriah, (Genesis 22:17) “I will greatly multiply thy seed … [and let thy seed possess the gates of their enemies]”. May it be God’s will that that seed may proceed from you and not from another woman”. "}, {"ch": 24, "v": 61, "aliyah": 5, "heb": "וַתָּ֨קׇם רִבְקָ֜ה וְנַעֲרֹתֶ֗יהָ וַתִּרְכַּ֙בְנָה֙ עַל־הַגְּמַלִּ֔ים וַתֵּלַ֖כְנָה אַחֲרֵ֣י הָאִ֑ישׁ וַיִּקַּ֥ח הָעֶ֛בֶד אֶת־רִבְקָ֖ה וַיֵּלַֽךְ׃", "onk": "וְקָמַת רִבְקָה וְעוּלֶמְתָּהָא וּרְכִיבָא עַל גַּמְלַיָּא וַאֲזַלַּת בָּתַר גַּבְרָא וּדְבַר עַבְדָּא יָת רִבְקָה וַאֲזָל:", "onk_en": "Rivkah and her maidens set off. They rode on the camels and followed the man. The servant took Rivkah and left.", "pj": "וְקָמַת רִבְקָה וְרִבְתָהָא וּרְכָבָן עַל גַמְלַיָא וְאָזְלַן בָּתַר גַבְרָא וּדְבַר עַבְדָא יַת רִבְקָה בַּהֲדֵיהּ וְטַיֵיל וְהֵיכְמָא דְאִתְקְטָעָא לֵיהּ אָרְחָא בְּמֵיזְלֵיהּ לְפַדָן אֲרָם הֵיכְדֵין אִתְקְטָעָא לֵיהּ בְּמִיתְבֵיהּ דִבְיוֹמָא חַד אָזֵיל וּבְיוֹמָא חַד תַּב", "pj_en": "And Rivekah arose, and her damsel, and they rode upon camels, and went after the man. And the servant took Rivekah with him and journeyed. And as the way was shortened to him in his journey to Padan Aram, so was it shortened to him in his return, that in one day he went, and in one day he returned.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 62, "aliyah": 5, "heb": "וְיִצְחָק֙ בָּ֣א מִבּ֔וֹא בְּאֵ֥ר לַחַ֖י רֹאִ֑י וְה֥וּא יוֹשֵׁ֖ב בְּאֶ֥רֶץ הַנֶּֽגֶב׃", "onk": "וְיִצְחָק אָתָא מִמֵּתוֹהִי (<small>נ\"י<\/small> עַל בְּמֵתוֹהִי) <b>מִבֵּירָא דְמַלְאַךְ קַיָּמָא אִתְחֲזִי עֲלַהּ<\/b> וְהוּא יָתֵב בַּאֲרַע דָּרוֹמָא:", "onk_en": "Yitzchok had just come from the well [called] Lachai Ro’i [<b>the well at which a living angel appeared<\/b>], for he lived in the land of the Negev [<b>south<\/b>].", "pj": "וְיִצְחָק הֲוָה אָתִי מִבֵּי מֶדְרָשָׁא דְשֵׁם רַבָּא מַעֲלָנָא דְבֵירָא דְאִתְגְלֵי עֲלוֹי חַי וְקַיָם דְחָמֵי וְלָא מִתְחָמֵי וְהוּא הֲוָה יָתֵיב בְּאַרַע דָרוֹמָא", "pj_en": "And Izhak was coming from the school of the Rabba Shem, by the way of the fountain where had been revealed to him the Living and Eternal One, who seeth, and is not seen; and he resided in the land of the south.", "tj": "וְיִצְחָק הֲוָה אָתִי מִן בֵּית מֶדְרָשָׁא דְשֵׁם רַבָּא לִבְאֵרָא דְאִיתְגְלִית עֲלוֹהִי שְׁכִינְתֵּיהּ דַיְיָ וְהוּא הֲוָה שְׁרֵי בְּאַרְעָא דָרוֹמָא:", "tj_en": "And Izhak was coming from the school of the Rabba Shem, at the fountain where had been revealed to him the Shekinah of the Lord; and he dwelt in the land of the south.", "rashi": "<b>מבוא באר לחי רואי.<\/b> שֶׁהָלַךְ לְהָבִיא הָגָר לְאַבְרָהָם אָבִיו שֶׁיִּשָּׂאֶנָּה (בראשית רבה):<br><br><b>יושב בארץ הנגב.<\/b> קָרוֹב לְאוֹתוֹ בְּאֵר, שֶׁנֶּאֱמַר וַיִּסַּע מִשָּׁם אַבְרָהָם אַרְצָה הַנֶּגֶב וַיֵּשֶׁב בֵּין קָדֵשׁ וּבֵין שׁוּר (בראשית כ') וְשָׁם הָיָה הַבְּאֵר, שֶׁנֶּאֱמַר הִנֵּה בֵין קָדֵשׁ וּבֵין בָּרֶד (שם ט\"ז):", "rashi_en": "מבוא באר לחי ראי HE HAD JUST COME FROM THE WELL LACHAI-ROI— For he had gone there to bring Hagar back to Abraham that he might take her again as his wife (Genesis Rabbah 60:14). <br><br>יושב בארץ הנגב FOR HE DWELT IN THE LAND OF THE SOUTH, near to that well, as it is said, (Genesis 20:1) “And Abraham journeyed from thence towards the land of the South and dwelt between Kadesh and Shur”, and the well was there, as is said, (Genesis 16:14) “behold it is between Kadesh and Bered’’. "}, {"ch": 24, "v": 63, "aliyah": 5, "heb": "וַיֵּצֵ֥א יִצְחָ֛ק לָשׂ֥וּחַ בַּשָּׂדֶ֖ה לִפְנ֣וֹת עָ֑רֶב וַיִּשָּׂ֤א עֵינָיו֙ וַיַּ֔רְא וְהִנֵּ֥ה גְמַלִּ֖ים בָּאִֽים׃", "onk": "וּנְפַק יִצְחָק <b>לְצַלָּאָה<\/b> בְחַקְלָא לְמִפְנֵי רַמְשָׁא וּזְקַף עֵינוֹהִי וַחֲזָא וְהָא גַמְלַיָּא אָתָן:", "onk_en": "Yitzchok went out to meditate [<b>pray<\/b>] in the field towards evening. He raised his eyes and suddenly saw camels approaching.", "pj": "וּנְפַק יִצְחָק לְצַלָאָה בְּאַנְפֵּי בְרָא לְעִדוּנַי רַמְשָׁא וּזְקַף עֵינוֹהִי וַחֲמָא וְהָא גַמְלַיָא אָתִין", "pj_en": "And Izhak went forth to pray upon the face of the field at the time of evening; and he lifted up his eyes, and saw, and, behold, the camels were approaching.", "tj": "", "tj_en": "", "rashi": "<b>לשוח.<\/b> לְשׁוֹן תְּפִלָּה (בראשית רבה), כְּמוֹ יִשְׁפֹּךְ שִׂיחוֹ (תהילים ק\"ב):", "rashi_en": "לשוח TO MEDITATE — this means “to pray” (Genesis Rabbah 60:14), as we find (Psalms 102:1) “[A prayer of the afflicted …] when he poureth forth his plaint. "}, {"ch": 24, "v": 64, "aliyah": 5, "heb": "וַתִּשָּׂ֤א רִבְקָה֙ אֶת־עֵינֶ֔יהָ וַתֵּ֖רֶא אֶת־יִצְחָ֑ק וַתִּפֹּ֖ל מֵעַ֥ל הַגָּמָֽל׃", "onk": "וּזְקָפַת רִבְקָה יָת עֵינָהָא וַחֲזַת יָת יִצְחָק <b>וְאִתְרְכִינַת מֵעַל<\/b> גַּמְלָא:", "onk_en": "Rivkah raised her eyes and saw Yitzchok. She let herself down from [<b>She inclined herself while upon<\/b>] the camel.", "pj": "וְזָקְפַת רִבְקָה יַת עֵינָהָא וְחָמַת יַת יִצְחָק וְאִתְרְכִינַת מֵעַל גַמְלָא", "pj_en": "And Rivekah lifted up her eyes, and saw Izhak, and she bowed upon the camel.", "tj": "", "tj_en": "", "rashi": "<b>ותרא את יצחק.<\/b> רָאֲתָה אוֹתוֹ הָדוּר וְתוֹהָא מִפָּנָיו (בראשית רבה):<br><br><b>ותפל.<\/b> הִשְׁמִיטָה עַצְמָהּ לָאָרֶץ, כְּתַרְגּוּמוֹ וְאִתְרְכִינַת, הִטְּתָה עַצְמָהּ לָאָרֶץ וְלֹא הִגִּיעָה עַד הַקַּרְקַע, כְּמוֹ הַטִּי נָא כַדֵּךְ, אַרְכִינִי, וַיֵּט שָׁמַיִם (תהילים י\"ח), וְאַרְכִּין, לְשׁוֹן מֻטֶּה לָאָרֶץ, וְדוֹמֶה לוֹ כִּי יִפֹּל לֹא יוּטָל (תהילים ל\"ז), כְּלוֹמַר אִם יִטֶּה לָאָרֶץ לֹא יַגִּיעַ עַד הַקַּרְקַע:", "rashi_en": "ותרא את יצחק AND SHE SAW ISAAC — She saw his lordly appearance and gazed at him in astonishment (Genesis Rabbah 60:15).<br><br>ותפל SHE ALIGHTED (literally, she fell) — She let herself slide towards the ground; as the Targum renders it וארכינת —she inclined herself towards the earth, but did not actually reach the ground. Similarly in (Genesis 24:14) “let down thy pitcher, I pray thee”, the word הטי let down, Onkelos translates by ארכיני “incline”, and (Psalm 18:10) “He bowed (ויט) the heavens” he translates by וארכין which means “He bent them towards the ground”. A similar idea is (Psalms 37:24) “Though he fall (יפול) he shall not be utterly cast down” which is as much as to say, “though he bends himself towards the earth yet he shall not touch the ground (i. e. shall not fall entirely)” (Genesis Rabbah 60:15). "}, {"ch": 24, "v": 65, "aliyah": 5, "heb": "וַתֹּ֣אמֶר אֶל־הָעֶ֗בֶד מִֽי־הָאִ֤ישׁ הַלָּזֶה֙ הַהֹלֵ֤ךְ בַּשָּׂדֶה֙ לִקְרָאתֵ֔נוּ וַיֹּ֥אמֶר הָעֶ֖בֶד ה֣וּא אֲדֹנִ֑י וַתִּקַּ֥ח הַצָּעִ֖יף וַתִּתְכָּֽס׃", "onk": "וַאֲמֶרֶת לְעַבְדָּא מָן גַּבְרָא דֵיכִי דִּמְהַלֵּךְ בְּחַקְלָא לְקַדָּמוּתָנָא וַאֲמַר עַבְדָּא הוּא רִבּוֹנִי וּנְסֵיבַת עֵיפָא וְאִתְכַּסִּיאַת:", "onk_en": "She said to the servant, Who is that man walking through the field towards us? The servant said, He is my master. She then took the veil and covered herself.", "pj": "וַאֲמָרַת לְעַבְדָא מַן גַבְרָא הֲדוֹר וְיָאִי דִמְטַיֵיל בְּחַקְלָא לִקְדָמוּתָנָא וַאֲמַר עַבְדָא הוּא רִבּוֹנִי וּנְסִיבַת רְדִידָא וְאִתְעֲטִיפַת בֵּיהּ", "pj_en": "And she said to the servant, Who is the man (so) majestic and graceful, who walks in the field before us? And the servant said, He is my master. And she took a veil and covered herself.", "tj": "וּנְסֵיבַת רְדִידָא וְאִתְצַמְצַמָת בֵּיהּ:", "tj_en": "And she took a veil, and wrapped herself in it.", "rashi": "<b>ותתכס.<\/b> לְשׁוֹן וַתִּתְפַּעֵל, כְּמוֹ וַתִּקָּבֵר וַתִּשָּׁבֵר:", "rashi_en": "ותתכס AND [SHE] COVERED HERSELF — This has a passive meaning (she was covered); it is like (35:8) ותקבר “and she was buried”, and (1 Samuel 4:18) ותשבר “and [his neck] was broken”. "}, {"ch": 24, "v": 66, "aliyah": 5, "heb": "וַיְסַפֵּ֥ר הָעֶ֖בֶד לְיִצְחָ֑ק אֵ֥ת כׇּל־הַדְּבָרִ֖ים אֲשֶׁ֥ר עָשָֽׂה׃", "onk": "וְאִשְׁתָּעֵי עַבְדָּא לְיִצְחָק יָת כָּל פִּתְגָּמַיָּא דִּי עֲבָד:", "onk_en": "The servant told Yitzchok all the things he had done.", "pj": "וְתַנִי עַבְדָא לְיִצְחָק יַת כָּל פִּתְגָמַיָא דְעָבָד", "pj_en": "And the servant related to Izhak everything he had done.", "tj": "", "tj_en": "", "rashi": "<b>ויספר העבד.<\/b> גִּלָּה לוֹ נִסִּים שֶׁנַּעֲשׂוּ לוֹ, שֶׁקָּפְצָה לוֹ הָאָרֶץ וְשֶׁנִּזְדַּמְּנָה לוֹ רִבְקָה בִּתְּפִלָּתוֹ (בראשית רבה):", "rashi_en": "ויספר העבד AND THE SERVANT RELATED — He reported to him the miracles that had been wrought for him — how the earth had shrunk for him, and how Rebecca was ready for him in response to his prayer (Genesis Rabbah 60:15). "}, {"ch": 24, "v": 67, "aliyah": 5, "heb": "וַיְבִאֶ֣הָ יִצְחָ֗ק הָאֹ֙הֱלָה֙ שָׂרָ֣ה אִמּ֔וֹ וַיִּקַּ֧ח אֶת־רִבְקָ֛ה וַתְּהִי־ל֥וֹ לְאִשָּׁ֖ה וַיֶּאֱהָבֶ֑הָ וַיִּנָּחֵ֥ם יִצְחָ֖ק אַחֲרֵ֥י אִמּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וְאַעֲלַהּ יִצְחָק לְמַשְׁכְּנָא וַחֲזָא וְהָא תַקְּנִין עוֹבָדָהָא כְּעוֹבָדֵי שָׂרָה אִמֵּיהּ<\/b> וּנְסֵיב יָת רִבְקָה וַהֲוַת לֵיהּ לְאִנְתּוּ וּרְחִימַהּ וְאִתְנְחֵם יִצְחָק בָּתַר דְּמִיתַת אִמֵּיהּ:", "onk_en": "Yitzchok brought her into the tent of his mother, Sarah. [<b>Yitzchok brought her into the tent, and behold, her deeds were good like the deeds of Sarah his mother.<\/b>] He married Rivkah, and she became his wife, and he loved her. Yitzchok was then consoled for the loss of his mother.", "pj": "וְאָעֲלָהּ יִצְחָק לְמַשְׁכְּנָא דְשָרָה אִמֵיהּ וּמִן יַד נַהֲרַת בּוֹצִינָא דִטְפַת בִּזְמַן דְמִיתַת שָרָה וּנְסֵיב יַת רִבְקָה וַהֲוָת לֵיהּ לְאִנְתּוּ וְרִחֲמָהּ בְּגִין דְחָמָא עוּבְדָהָא דְתַקְנָן כְּעוּבְדֵי אִמֵיהּ וְאִתְנְחָם יִצְחָק בָּתַר דְמִיתַת אִמֵיהּ", "pj_en": "And Izhak introduced her into the tabernacle of Sarah his mother, and thereupon the light (again) shined which had gone out at the time of Sarah's death. And he took Rivekah, and she was his wife, and he loved her; for he saw her works that they were upright as the works of his mother. And Izhak was consoled after his mother's death.", "tj": "", "tj_en": "", "rashi": "<b>האהלה שרה אמו.<\/b> וַיְבִיאֶהָ הָאֹהֱלָה וְנַעֲשֵׂית דֻּגְמַת שָׂרָה אִמּוֹ, כְּלוֹמַר וַהֲרֵי הִיא שָׂרָה אִמּוֹ, שֶׁכָּל זְמַן שֶׁשָּׂרָה קַיֶּמֶת הָיָה נֵר דָּלוּק מֵעֶרֶב שַׁבָּת לְעֶרֶב שַׁבָּת וּבְרָכָה מְצוּיָה בָּעִסָּה וְעָנָן קָשׁוּר עַל הָאֹהֶל, וּמִשֶּׁמֵּתָה פָּסְקוּ, וּכְשֶׁבָּאת רִבְקָה חָזְרוּ (בראשית רבה):<br><br><b>אחרי אמו.<\/b> דֶּרֶךְ אֶרֶץ כָּל זְמַן שֶׁאִמּוֹ שֶׁל אָדָם קַיֶּמֶת, כָּרוּךְ הוּא אֶצְלָהּ; וּמִשֶּׁמֵּתָה, הוּא מִתְנַחֵם בְּאִשְׁתּוֹ:", "rashi_en": "האהלה שרה אמו INTO HIS MOTHER SARAH’S TENT — He brought her into the tent and she became exactly like his mother Sarah — that is to say, the words signify as much as, [And he brought her into the tent] and, behold, she was Sarah, his mother). For whilst Sarah was living, a light had been burning in the tent from one Sabbath eve to the next, there was always a blessing in the dough (a miraculous increase) and a cloud was always hanging over the tent (as a divine protection), but since her death all these had stopped. However, when Rebecca came, they reappeared” (Genesis Rabbah 60:16). <br><br>אחרי אמו [AND ISAAC WAS COMFORTED] AFTER HIS MOTHER’S DEATH — It is natural that whilst a man’s mother is living he is wrapped up in her, but when she dies he finds comfort in his wife (Pirkei DeRabbi Eliezer 32)."}, {"ch": 25, "v": 1, "aliyah": 6, "heb": "וַיֹּ֧סֶף אַבְרָהָ֛ם וַיִּקַּ֥ח אִשָּׁ֖ה וּשְׁמָ֥הּ קְטוּרָֽה׃", "onk": "וְאוֹסֵיף אַבְרָהָם וּנְסֵיב אִתְּתָא וּשְׁמַהּ קְטוּרָה:", "onk_en": "Avraham again took a wife. Her name was Keturah.", "pj": "וְאוֹסִיף אַבְרָהָם וּנְסַב אִיתָא וּשְׁמָהּ קְטוּרָה הִיא הָגָר דִקְטִירָא לֵיהּ מִן שֵׁרוּיָא", "pj_en": "And Abraham added and took a wife, and her name was Keturah; she is Hagar, who had been bound to him from the beginning.", "tj": "וְהִיא הֲוַת הָגָר דְהֲוַת אֲסִירָא לֵיהּ מִן שֵׁירוּיָה:", "tj_en": "She is Hagar, who had been tied to him from the beginning.", "rashi": "<b>קטורה.<\/b> זוֹ הָגָר, וְנִקְרֵאת קְטוּרָה עַל שֶׁנָּאִים מַעֲשֶׁיהָ כִּקְטֹרֶת (בראשית רבה), וְשֶׁקָּשְׁרָה פִּתְחָהּ, שֶֶׁלֹא נִזְדַּוְּגָה לְאָדָם מִיּוֹם שֶׁפֵּרְשָׁה מֵאַבְרָהָם:", "rashi_en": "קטורה KETURAH — This is Hagar. She was named Keturah because her deeds were as beautiful (sweet) as incense (Ketoreth) (Genesis Rabbah 61). And since she closed her 'opening,' as she did not mate with anyone from the time she separated from Avraham (Genesis Rabbah 61:4)."}, {"ch": 25, "v": 2, "aliyah": 6, "heb": "וַתֵּ֣לֶד ל֗וֹ אֶת־זִמְרָן֙ וְאֶת־יׇקְשָׁ֔ן וְאֶת־מְדָ֖ן וְאֶת־מִדְיָ֑ן וְאֶת־יִשְׁבָּ֖ק וְאֶת־שֽׁוּחַ׃", "onk": "וִילֵידַת לֵיהּ יָת זִמְרָן וְיָת יָקְשָׁן וְיָת מְדָן וְיָת מִדְיָן וְיָת יִשְׁבָּק וְיָת שׁוּחַ:", "onk_en": "She bore him Zimran, Yokshon, Medan, Midian, Yishbok, and Shuach.", "pj": "וִילֵידַת לֵיהּ יַת זִמְרָן וְיַת יָקְשָׁן וְיַת מְדָן וְיַת מִדְיָן וְיַת יִשְׁבָּק וְיַת שׁוּחַ", "pj_en": "And she bare to him Zimran, and Jokshan, and Medan, and Midyan, and Yishbak, and Shovack.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 3, "aliyah": 6, "heb": "וְיׇקְשָׁ֣ן יָלַ֔ד אֶת־שְׁבָ֖א וְאֶת־דְּדָ֑ן וּבְנֵ֣י דְדָ֔ן הָי֛וּ אַשּׁוּרִ֥ם וּלְטוּשִׁ֖ם וּלְאֻמִּֽים׃", "onk": "וְיָקְשָׁן אוֹלִיד יָת שְׁבָא וְיָת דְּדָן וּבְנֵי דְדָן הֲווֹ <b>לְמַשִּׁירְיָן וְלִשְׁכוּנִין וּלְנַגְוָן<\/b>:", "onk_en": "Yokshon fathered Shevah and Dedan. The sons of Dedan were Ashurim [<b>those who dwell in camps<\/b>], Letushim [<b>those who dwell in tents<\/b>] and Leumim [<b>those who dwell on islands<\/b>].", "pj": "וְיָקְשָׁן אוֹלִיד יַת שְׁבָא וְיַת דְדָן וּבְנֵי דְדָן הֲווֹן תַּגָרִין וְאִמְפּוּרִין וְרֵישֵׁי אוּמִין", "pj_en": "And Jokshan begat Sheva and Dedan; and the sons of Dedan were merchants, and negotiators, and chiefs of peoples.", "tj": "תַּגָרִין וְאוּמְנִין וְרֵישֵׁי אוּמִין:", "tj_en": "Merchants, and artificers, and chiefs of peoples.", "rashi": "<b>אשורים ולטושים.<\/b> שֵׁם רָאשֵׁי אֻמּוֹת (בראשית רבה), וְתַרְגּוּם שֶׁל אֻנְקְלוֹס אֵין לִי לְיַשְּׁבוֹ עַל לְשׁוֹן הַמִּקְרָא שֶׁפֵּרֵשׁ לְמַשִּׁירְיָן, לְשׁוֹן מַחֲנֶה, וְאִם תֹּאמַר שֶׁאֵינוֹ כֵן מִפְּנֵי הָאָלֶ\"ף שֶׁאֵינָהּ יְסוֹדִית, הֲרֵי לָנוּ תֵּבוֹת שֶׁאֵין בְּרֹאשָׁם אָלֶ\"ף וְנִתּוֹסְפָה אָלֶ\"ף בְּרֹאשָׁם, כְּמוֹ חוֹמַת אֲנָךְ (עמוס ז) שֶׁהוּא מִן נְכֵה רַגְלַיִם, וּכְמוֹ אָסוּךְ שָׁמֶן (מ\"ב ד), שֶׁהוּא מִן וְרָחַצְתְּ וָסַכְתְּ:<br><br><b>ולטושם.<\/b> הֵם בַּעֲלֵי אֹהָלִים הַמִּתְפַּזְרִים אָנֶה וָאָנָה וְנוֹסְעִים אִיש בְּאָהֳלֵי אַפַּדְנוֹ, וְכֵן הוּא אוֹמֵר וְהִנָּם נְטֻשִׁים עַל פְּנֵי כָל הָאָרֶץ (שמואל א ל') שֶׁכֵּן לָמֶ\"ד וְנוּ\"ן מִתְחַלְּפוֹת זוֹ בְּזוֹ):", "rashi_en": "אשורם ולטושם The names of chieftains of clans (Genesis Rabbah 61:5). As regards the translation of Onkelos I cannot make it fit in exactly with the words of the text. He explains אשורם by למשירין which means “camps” (cf. שיירא a caravan). If you say that this cannot be correct on account of the א in אשורם which is not a root letter in the word from which משירין is derived (whilst in אשורם we have an א) then I would reply that we find some words which should have no א at the beginning, but still א is placed before them. Such are אנך in (Amos 7:7) “a wall made by a plumbline (אנך)”, where the word is of the same root as נכה in (2 Samuel 4:4) “stricken (נכה) in his feet”, and אסוך, a cruse containing anointing oil, in (2 Kings 4:2) “a pot (אסוך) of oil” which is of the same root as וסכת in (Ruth 3:3) “wash thyself and (וסכת) annoint thyself”.<br><br>The לטושים (according to Onkelos) are owners of tents who spread about in all directions and travel about each in the “tents of his palace” (Rashi uses a Biblical phrase (Daniel 11:45), but he means nothing more than “each in his own tent”). Indeed Scripture says (1 Samuel 30:16) “Behold they were spread (נטושים) over all the ground”, for ל and נ may interchange (so that לטושים is equivalent to נטושים)."}, {"ch": 25, "v": 4, "aliyah": 6, "heb": "וּבְנֵ֣י מִדְיָ֗ן עֵיפָ֤ה וָעֵ֙פֶר֙ וַחֲנֹ֔ךְ וַאֲבִידָ֖ע וְאֶלְדָּעָ֑ה כׇּל־אֵ֖לֶּה בְּנֵ֥י קְטוּרָֽה׃", "onk": "וּבְנֵי מִדְיָן עֵיפָה וָעֵפֶר וַחֲנוֹךְ וַאֲבִידָע וְאֶלְדָּעָה כָּל אִלֵּין בְּנֵי קְטוּרָה:", "onk_en": "The sons of Midian were Eiphah, Eipher, Chanoch, Avidah and Eldoah. All these were children of Keturah.", "pj": "וּבְנוֹי דְמִדְיָן עֵיפָא וְעֵפֶר וַחֲנוֹךְ וַאֲבִידָע וְאֶלְדְעָה כָּל אִלֵין בְּנָהָא דִקְטוּרָה", "pj_en": "And the sons of Midyan, Eipher, and Ephher, and Honok, and Abida, and Aldaah, all these were the sons of Keturah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 5, "aliyah": 6, "heb": "וַיִּתֵּ֧ן אַבְרָהָ֛ם אֶת־כׇּל־אֲשֶׁר־ל֖וֹ לְיִצְחָֽק׃", "onk": "וִיהַב אַבְרָהָם יָת כָּל דִּילֵיהּ לְיִצְחָק:", "onk_en": "Avraham gave all that he possessed to Yitzchok.", "pj": "וִיהַב אַבְרָהָם בְּמַתָּנָא יַת כָּל דִילֵיהּ לְיִצְחָק", "pj_en": "And Abraham gave the gift of all he had to Izhak.", "tj": "", "tj_en": "", "rashi": "<b>ויתן אברהם וגו'.<\/b> אָמַר רַ' נְחֶמְיָה בְּרָכָה דִּיאַתִּיקֵי, שֶׁאָמַר לוֹ הַקָּבָּ\"ה לְאַבְרָהָם וֶהְיֵה בְּרָכָה, הַבְּרָכוֹת מְסוּרוֹת בְּיָדְךָ לְבָרֵךְ אֶת מִי שֶׁתִּרְצֶה, וְאַבְרָהָם מְסָרָן לְיִצְחָק (בראשית רבה):", "rashi_en": "AND ויתן אברהם וגו AND ABRAHAM GAVE etc. — R. Nehemiah said, he gave him the blessing as a legacy (literally, will, testament). The Holy One, blessed be He, had said to Abraham (12:2) “Be thou a blessing” which means “the blessing are entrusted to you that you may bless whomsoever you please”, and Abraham transferred them to Isaac (cf. Genesis Rabbah 61:6). "}, {"ch": 25, "v": 6, "aliyah": 6, "heb": "וְלִבְנֵ֤י הַפִּֽילַגְשִׁים֙ אֲשֶׁ֣ר לְאַבְרָהָ֔ם נָתַ֥ן אַבְרָהָ֖ם מַתָּנֹ֑ת וַֽיְשַׁלְּחֵ֞ם מֵעַ֨ל יִצְחָ֤ק בְּנוֹ֙ בְּעוֹדֶ֣נּוּ חַ֔י קֵ֖דְמָה אֶל־אֶ֥רֶץ קֶֽדֶם׃", "onk": "וְלִבְנֵי לְחֵינָתָא דִּי לְאַבְרָהָם יְהַב אַבְרָהָם מַתְּנָן וְשַׁלְּחִנּוּן מֵעַל יִצְחָק בְּרֵיהּ בְּעוֹד דְּהוּא קַיָּם קִידוּמָא לְאַרַע מָדִינְחָא:", "onk_en": "To the sons of the concubines that Avraham had, Avraham gave gifts. He sent them away from Yitzchok, his son, while he [Avraham] was still alive. [He sent them] eastward to the Land of the East.", "pj": "וְלִבְנֵיהוֹם דִפְלַקְתּוּן דִלְאַבְרָהָם יְהַב אַבְרָהָם נִכְסִין וּמְטַלְטְלִין לְמַתְּנָן וְתַרְכִינוּן מֵעִילוֹי יִצְחָק בְּרֵיהּ עַד דְהוּא בְּחַיֵי וְאָזְלַן לְמֵיתַב קִידוּמָא לְאַרַע מַדִינְחָא", "pj_en": "And to the sons of the concubines of Abraham gave Abraham riches and moveable property as gifts, and sent them away from Izhak his son while he (yet) lived; and they went and dwelt eastward in the land of the orient.", "tj": "", "tj_en": "", "rashi": "<b>הפילגשים.<\/b> חָסֵר כְּתִיב, שֶׁלֹּא הָיְתָה אֶלָּא פִּלֶגֶשׁ אַחַת, הִיא הָגָר, הִיא קְטוּרָה (בראשית רבה). נָשִׁים בִּכְתֻבָּה, פִּילַגְשִׁים בְּלֹא כְּתֻבָּה, כִּדְאָמְרִינַן בְּסַנְהֶדְרִין, בְּנָשִׁים וּפִילַגְשִׁים דְּדָוִד:<br><br><b>נתן אברהם מתנות.<\/b> פֵּרְשׁוּ רַבּוֹתֵינוּ שֵׁם טֻמְאָה מָסַר לָהֶם (סנהדרין צ\"א). דָּ\"אַ מַה שֶּׁנִּתַּן לוֹ עַל אוֹדוֹת שָׂרָה וּשְׁאָר מַתָּנוֹת שֶׁנִתְּנוּ לוֹ, הַכֹּל נָתַן לָהֶם, שֶׁלֹּא רָצָה לֵהָנוֹת מֵהֶם:", "rashi_en": "הפילגשים THE CONCUBINES — The word is written deficient, (without י, but our texts have a י in both places) because he had only one concubine, Hagar, who is identical with Keturah. Wives are those whom a man marries with a marriage-contract (Ketubah): concubines have no marriage contract, as we explain in the Talmud (Sanhedrin 21a) in reference to David’s wives and concubines.<br><br>נתן אברהם מתנות ABRAHAM GAVE GIFTS — Our Rabbis explained (Sanhedrin 91a) that he transmitted to them the names of impure things. Another explanation is: all that he had received as gifts because of Sarah — and other gifts that people had given him — all these he gave to them because he did not wish to derive any benefit from these. "}, {"ch": 25, "v": 7, "aliyah": 6, "heb": "וְאֵ֗לֶּה יְמֵ֛י שְׁנֵֽי־חַיֵּ֥י אַבְרָהָ֖ם אֲשֶׁר־חָ֑י מְאַ֥ת שָׁנָ֛ה וְשִׁבְעִ֥ים שָׁנָ֖ה וְחָמֵ֥שׁ שָׁנִֽים׃", "onk": "וְאִלֵּין יוֹמֵי שְׁנֵי חַיֵּי אַבְרָהָם דַּחֲיָא מְאָה וְשַׁבְעִין וְחָמֵשׁ שְׁנִין:", "onk_en": "These are the days of the years of Avraham which he lived, one hundred years, seventy years and five years.", "pj": "וְאִלֵין סְכוּם יוֹמֵי חַיֵי אַבְרָהָם דְחַיֵי מְאָה וְשׁוּבְעִין וַחֲמֵשׁ שְׁנִין", "pj_en": "And this is the number of the days of the life of Abraham, who lived a hundred and seventy and five years.", "tj": "", "tj_en": "", "rashi": "<b>מאת שנה ושבעים שנה וחמש שנים.<\/b> בֶּן ק' כְּבֶן ע' וּבֶן ע' כְּבֶן ה' בְּלֹא חֵטְא:", "rashi_en": "מאה שנה ושבעים שנה וחמש שנים A HUNDRED AND SEVENTY FIVE YEARS — (lit, a hundred years, and seventy years and five years) — at the age of one hundred years he was as strong as at seventy, and at the age of seventy he was as five — without sin. "}, {"ch": 25, "v": 8, "aliyah": 6, "heb": "וַיִּגְוַ֨ע וַיָּ֧מׇת אַבְרָהָ֛ם בְּשֵׂיבָ֥ה טוֹבָ֖ה זָקֵ֣ן וְשָׂבֵ֑עַ וַיֵּאָ֖סֶף אֶל־עַמָּֽיו׃", "onk": "וְאִתְנְגִיד וּמִית אַבְרָהָם בְּסֵיבוּ טָבָא סִיב <b>וּשְׂבַע יוֹמִין<\/b> וְאִתְכְּנִישׁ לְעַמֵּיהּ:", "onk_en": "Avraham expired and died in a good old age, old and satisfied [<b>and in the fullness of days<\/b>], and he was gathered to his people.", "pj": "וְאִתְנְגִיד וּמִית אַבְרָהָם בְּשֵיבוּ טָבָא סִיב וּשְבַע כָּל טוּבָא בְּרַם יִשְׁמָעֵאל עֲבַד תְּתוּבָא בְּיוֹמֵיהּ וּבָתַר כֵּן אִתְכְּנַשׁ לְעַמֵיהּ", "pj_en": "And Abraham expired, and died in a good old age, aged and satisfied with all good. (Also Ishmael wrought repentance in his days, and afterwards was gathered to his people.)", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 9, "aliyah": 6, "heb": "וַיִּקְבְּר֨וּ אֹת֜וֹ יִצְחָ֤ק וְיִשְׁמָעֵאל֙ בָּנָ֔יו אֶל־מְעָרַ֖ת הַמַּכְפֵּלָ֑ה אֶל־שְׂדֵ֞ה עֶפְרֹ֤ן בֶּן־צֹ֙חַר֙ הַֽחִתִּ֔י אֲשֶׁ֖ר עַל־פְּנֵ֥י מַמְרֵֽא׃", "onk": "וּקְבַרוּ יָתֵיהּ יִצְחָק וְיִשְׁמָעֵאל בְּנוֹהִי בִּמְעָרַת כָּפֶלְתָּא בַּחֲקַל עֶפְרוֹן בַּר צֹחַר חִתָּאָה דִּי עַל אַפֵּי מַמְרֵא:", "onk_en": "His sons Yitzchok and Yishmael buried him in the Machpeilah cave, in the field of Ephron, son of Tzochar, the Chitite, which faces Mamrei.", "pj": "וּקְבָרוּ יָתֵיהּ יִצְחָק וְיִשְׁמָעֵאל בְּנוֹי לִמְעָרַת כָּפֵילְתָּא לַחֲקַל עֶפְרוֹן בַּר צוֹחַר חִיתָּאָה דְעַל אַנְפֵּי מַמְרֵא", "pj_en": "And Izhak and Ishmael his sons buried him in the double cavern, at the field of Ephran bar Zochar, the Hittite, which is before Mamre;", "tj": "", "tj_en": "", "rashi": "<b>יצחק וישמעאל.<\/b> מִכָּאן שֶׁעָשָׂה יִשְׁמָעֵאל תְּשׁוּבָה וְהוֹלִיךְ אֶת יִצְחָק לְפָנָיו, וְהִיא שֵׂיבָה טוֹבָה שֶׁנֶּאֱמַר בְּאַבְרָהָם (בראשית רבה):", "rashi_en": "יצחק וישמעאל ISAAC AND ISHMAEL — From this we gather that Ishmael repented of his evil ways (cf.Bava Batra 16b) and yielded the precedence to Isaac. This is what is meant by the “good old age” mentioned in connection with Abraham (Genesis Rabbah 38:12). "}, {"ch": 25, "v": 10, "aliyah": 6, "heb": "הַשָּׂדֶ֛ה אֲשֶׁר־קָנָ֥ה אַבְרָהָ֖ם מֵאֵ֣ת בְּנֵי־חֵ֑ת שָׁ֛מָּה קֻבַּ֥ר אַבְרָהָ֖ם וְשָׂרָ֥ה אִשְׁתּֽוֹ׃", "onk": "חַקְלָא דִּי זְבַן אַבְרָהָם מִן בְּנֵי חִתָּאָה תַּמָּן אִתְקְבַר אַבְרָהָם וְשָׂרָה אִתְּתֵיהּ:", "onk_en": "[This was] the field that Avraham purchased from the sons of Cheis. Avraham and his wife, Sarah, were buried there.", "pj": "חַקְלָא דִזְבַן אַבְרָהָם מִן בְּנֵי חִתָּאָה תַּמָן אִתְקְבַר אַבְרָהָם וְשָרָה אִנְתְּתֵיהּ", "pj_en": "the field that Abraham purchased of the sons of Hittah: there was Abraham buried and Sarah his wife.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 11, "aliyah": 6, "heb": "וַיְהִ֗י אַחֲרֵי֙ מ֣וֹת אַבְרָהָ֔ם וַיְבָ֥רֶךְ אֱלֹהִ֖ים אֶת־יִצְחָ֣ק בְּנ֑וֹ וַיֵּ֣שֶׁב יִצְחָ֔ק עִם־בְּאֵ֥ר לַחַ֖י רֹאִֽי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲוָה בָּתַר דְּמִית אַבְרָהָם וּבָרֵךְ יְיָ יָת יִצְחָק בְּרֵיהּ וִיתֵב יִצְחָק עִם <b>בֵּירָא דְמַלְאַךְ קַיָּמָא אִתְחֲזֵי עֲלַהּ<\/b>:", "onk_en": "After Avraham died, Elohim blessed his son Yitzchok. Yitzchok lived near Be’er Lachai Ro’i [<b>the well at which a living angel appeared<\/b>].", "pj": "וּמִן בִּגְלַל דְלָא הֲוָה אַבְרָהָם צָבֵי לִבְרָכָא יַת יִשְׁמָעֵאל בְּגִין כֵּן לָא בְּרִיךְ יַת יִצְחָק דְאִין הֲוָה מְבָרֵךְ לְיִצְחָק וְלָא מְבָרֵךְ לְיִשְׁמָעֵאל הֲוָה נְטִיר לֵיהּ בָּבוֹי וּבָתַר דְמִית אַבְרָהָם בְּרִיךְ יְיָ יַת יִצְחָק וְיָתֵב יִצְחָק סָמִיךְ לְבֵירָא דְאִתְגְלֵי עֲלוֹי יְקַר חַי וְקַיָים דְחָמֵי וְלָא אִתְחָמֵי", "pj_en": "And because Abraham had not designed to bless Ishmael, therefore he blessed not Izhak; for had he blessed Izhak and not Ishmael, it would have kept them in enmity. But, after the death of Abraham, the Lord blessed Izhak; and Izhak dwelt near the well at which was revealed the glory of the Living and Eternal One, who seeth and is not seen.", "tj": "", "tj_en": "", "rashi": "<b>ויהי אחרי מות אברהם ויברך וגו'.<\/b> נִחֲמוֹ תַּנְחוּמֵי אֲבֵלִים. דָּ\"אַ אַעַ\"פִּ שֶׁמָּסַר הַקָּבָּ\"ה אֶת הַבְּרָכוֹת לְאַבְרָהָם, נִתְיָרֵא לְבָרֵךְ אֶת יִצְחָק מִפְּנֵי שֶׁצָּפָה אֶת עֵשָׂו יוֹצֵא מִמֶּנוּ, אָמַר יָבֹא בַּעַל הַבְּרָכוֹת וִיבָרֵךְ אֵת אֲשֶׁר יִיטַב בְּעֵינָיו, וּבָא הַקָּבָּ\"ה וּבֵרְכוֹ (סוטה י\"ד):", "rashi_en": "ויהי אחרי מות אברהם ויברך וגו AND IT CAME TO PASS AFTER THE DEATH OF ABRAHAM THAT GOD BLESSED ISAAC etc. — He comforted him with the words of the formula of consolation which we offer to mourners (Sotah 14a). Another explanation is: Although the Holy One, blessed be He, had entrusted the blessings to Abraham to bless whomever he wished yet he (Abraham) feared to bless Isaac, because he foresaw that Esau would be born from him. He therefore said, “Let the Master of the blessings come himself and bless whomever it seems proper in his eyes” — God came and blessed him (Isaac)(Genesis Rabbah 61:6). "}, {"ch": 25, "v": 12, "aliyah": 7, "heb": "וְאֵ֛לֶּה תֹּלְדֹ֥ת יִשְׁמָעֵ֖אל בֶּן־אַבְרָהָ֑ם אֲשֶׁ֨ר יָלְדָ֜ה הָגָ֧ר הַמִּצְרִ֛ית שִׁפְחַ֥ת שָׂרָ֖ה לְאַבְרָהָֽם׃", "onk": "וְאִלֵּין תּוּלְדַת יִשְׁמָעֵאל בַּר אַבְרָהָם דִּי יְלֵידַת הָגָר מִצְרֵתָא אַמְתָא דְשָׂרָה לְאַבְרָהָם:", "onk_en": "These are the descendants of Yishmael son of Avraham, whom Hagar, the Egyptian, Sarah’s slave, bore to Avraham.", "pj": "וְאִלֵין תּוּלְדַת יִשְׁמָעֵאל בַּר אַבְרָהָם דִילֵידַת הָגָר מִצְרֵיתָא אַמְתָא דְשָרָה לְאַבְרָהָם", "pj_en": "And these are the generations of Ishmael bar Abraham, whom Hagar the Mizreitha, the handmaid of Sarah, bare unto Abraham.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 13, "aliyah": 7, "heb": "וְאֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׁמָעֵ֔אל בִּשְׁמֹתָ֖ם לְתוֹלְדֹתָ֑ם בְּכֹ֤ר יִשְׁמָעֵאל֙ נְבָיֹ֔ת וְקֵדָ֥ר וְאַדְבְּאֵ֖ל וּמִבְשָֽׂם׃", "onk": "וְאִלֵּין שְׁמָהָן בְּנֵי יִשְׁמָעֵאל בִּשְׁמָהַתְהוֹן לְתוּלְדַתְהוֹן בּוּכְרָא דְיִשְׁמָעֵאל נְבָיוֹת וְקֵדָר וְאַדְבְּאֵל וּמִבְשָׂם:", "onk_en": "These are the names of Yishmael’s sons, by their names according to their birth. Nevayos was Yishmael’s first born, [he also had] Keidar, Adbeil and Mivsom,", "pj": "וְאִלֵין שְׁמָהַת בְּנֵי יִשְׁמָעֵאל בְּשׁוּמְהוֹן לְתוּלְדַתְהוֹן בּוּכְרָא דְיִשְׁמָעֵאל נְבוֹי וַעֲרַב וְאַדְבְּאֵל וּמִבְשָם", "pj_en": "And these are the names of the sons of Ishmael by their names, according to their generations. The firstborn of Ishmael, Neboi, and Arab, and Abdeel, and Mibsham,", "tj": "", "tj_en": "", "rashi": "<b>בשמותם לתולדותם.<\/b> סֵדֶר לֵידָתָן זֶה אַחַר זֶה:", "rashi_en": "בשמתם לתולדתם BY THEIR NAMES ACCORDING TO THEIR PROGENY — by the order in which they were born one after the other. "}, {"ch": 25, "v": 14, "aliyah": 7, "heb": "וּמִשְׁמָ֥ע וְדוּמָ֖ה וּמַשָּֽׂא׃", "onk": "וּמִשְׁמָע וְדוּמָה וּמַשָּׂא:", "onk_en": "Mishma, Dumah and Masa,", "pj": "וּצְמִיתָא וּשְׁתּוּקָא וְסוֹבָרָא", "pj_en": "--Hearing, Silence, Patience,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 15, "aliyah": 7, "heb": "חֲדַ֣ד וְתֵימָ֔א יְט֥וּר נָפִ֖ישׁ וָקֵֽדְמָה׃", "onk": "חֲדַד וְתֵימָא יְטוּר נָפִישׁ וָקֵדְמָה:", "onk_en": "Chadad, Teima, Yetur, Nofish and Keidmah.", "pj": "חֲרִיפָא וְתֵימָא יְטוּר נָפִישׁ וָקֵדְמָה", "pj_en": "and Sharpness: and Tema, Yetur, Naphish, and Kedemah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 16, "aliyah": 7, "heb": "אֵ֣לֶּה הֵ֞ם בְּנֵ֤י יִשְׁמָעֵאל֙ וְאֵ֣לֶּה שְׁמֹתָ֔ם בְּחַצְרֵיהֶ֖ם וּבְטִֽירֹתָ֑ם שְׁנֵים־עָשָׂ֥ר נְשִׂיאִ֖ם לְאֻמֹּתָֽם׃", "onk": "אִלֵּין אִנּוּן בְּנֵי יִשְׁמָעֵאל וְאִלֵּין שְׁמָהַתְהוֹן בְּפַצְחֵיהוֹן וּבִכְרַכֵּיהוֹן תְּרֵין עֲסַר רַבְרְבִין לְאֻמֵּיהוֹן:", "onk_en": "These are the sons of Yishmael, and these are their names in their open villages and in their fortified strongholds, twelve princes in their nations.", "pj": "אִלֵין הִינוּן בְּנוֹי דְיִשְׁמָעֵאל וְאִילֵין שׁוּמְהוֹן בְּכַּפְרָנֵיהוֹן וּבְקַסְטְרָוַותְהוֹן תְּרֵיסַר רַבְרְבִין לְאוּמַתְהוֹן", "pj_en": "These were the sons of Ishmael, and these their names in their villages, and in their fenced dwellings, twelve chiefs of their peoples.", "tj": "וּבְכַפְרָנֵהוֹן וּבְקַסְטַרְוָותֵיהוֹן תְּרֵי עֲשַר רַבְרְבִין לְאוּמֵיהוֹן:", "tj_en": "In their villages, and in their fenced dwellings (or encampments). Twelve chiefs of their peoples.", "rashi": "<b>בחצריהם.<\/b> כְּרַכִּים שֶׁאֵין לָהֶם חוֹמָה, וְתַּרְגּוּמוֹ בְּפַצְחֵיהוֹן שֶׁהֵם מְפֻצָּחִים, לְשׁוֹן פְּתִיחָה, כְּמוֹ פִּצְחוּ וְרַנְּנוּ (תהילים צ\"ח):", "rashi_en": "בחצריהם BY THEIR ENCLOSURES — Unwalled towns. In the Targum it is rendered by בפצחיהון because they are מפוצחים, which means “open”; similar in meaning to (Psalms 98:4) ‘‘Open your mouths (פצחו) and sing for joy”. "}, {"ch": 25, "v": 17, "aliyah": 7, "heb": "וְאֵ֗לֶּה שְׁנֵי֙ חַיֵּ֣י יִשְׁמָעֵ֔אל מְאַ֥ת שָׁנָ֛ה וּשְׁלֹשִׁ֥ים שָׁנָ֖ה וְשֶׁ֣בַע שָׁנִ֑ים וַיִּגְוַ֣ע וַיָּ֔מׇת וַיֵּאָ֖סֶף אֶל־עַמָּֽיו׃", "onk": "וְאִלֵּין שְׁנֵי חַיֵּי יִשְׁמָעֵאל מְאָה וּתְלָתִין וּשְׁבַע שְׁנִין וְאִתְנְגִיד וּמִית וְאִתְכְּנִישׁ לְעַמֵּיהּ:", "onk_en": "These are the years of Yishmael’s life, one hundred years, thirty years and seven years. He expired and died and was gathered to his people.", "pj": "וְאִלֵין שְׁנֵי חַיֵי יִשְׁמָעֵאל מְאָה וּתְלָתִין וּשְׁבַע שְׁנִין וְהָדַר בִּתְיוּבְתָּא וְאִתְנְגִיד וְאִתְכְּנִישׁ לְעַמֵיהּ", "pj_en": "And these are the years of the life of Ishmael, a hundred and thirty and seven years; and he was coverted in repentance, and expired, and was gathered to his people.", "tj": "", "tj_en": "", "rashi": "<b>ואלה שני חיי ישמעאל וגו'.<\/b> אָמַר רַבִּי חִיָּא בַּר אַבָּא לָמָּה נִמְנוּ שְׁנוֹתָיו שֶׁל יִשְׁמָעֵאל, כְּדֵי לְיַחֵס בָהֶם שְׁנוֹתָיו שֶׁל יַעֲקֹב מִשְּׁנוֹתָיו שֶׁל יִשְׁמָעֵאל, לָמַדְנוּ שֶׁשִּׁמֵּשׁ יַעֲקֹב בְּבֵית עֵבֶר י\"ד שָׁנָה כְּשֶׁפֵּרֵשׁ מֵאָבִיו קֹדֶם שֶׁבָּא אֵצֶל לָבָן, שֶׁהֲרֵי כְּשֶׁפֵּרֵשׁ יַעֲקֹב מֵאָבִיו מֵת יִשְׁמָעֵאל, שֶׁנֶּאֱמַר וַיֵּלֶךְ עֵשָׂו אֶל יִשְׁמָעֵאל וגו' (בראשית רבה כ\"ה), כְּמוֹ שֶׁמְּפֹרָשׁ בְּסוֹף מְגִלָּה נִקְרֵאת:<br><br><b>ויגוע.<\/b> לֹא נֶאֶמְרָה גְוִיעָה אֶלָּא בְּצַדִּיקִים:", "rashi_en": "ואלה שני חיי ישמעאל וגו AND THESE ARE THE YEARS OF THE LIFE OF ISHMAEL etc. —R. Chija the son of Abba asked: Why are the years of Ishmael enumerated? In order to trace through them the years of Jacob (i. e. the years in which the various incidents of his life happened). Calculating from the age of Ishmael (when he died) we may learn that Jacob attended at the School of Eber for fourteen years after he left his father and before he arrived at Laban’s house, for just when Jacob left his father Ishmael died, for it is said, (28:9) ‘‘So Esau went to Ishmael etc.”, as is explained in the Chapter Megilla Nikraath (Megillah 17a) (cf. Rashi on Genesis 28:9).<br><br>ויגוע AND HE EXPIRED — This expression — expiring — associated with a word denoting dying is only mentioned in the case of righteous people (Bava Batra 16b). "}, {"ch": 25, "v": 18, "aliyah": 7, "heb": "וַיִּשְׁכְּנ֨וּ מֵֽחֲוִילָ֜ה עַד־שׁ֗וּר אֲשֶׁר֙ עַל־פְּנֵ֣י מִצְרַ֔יִם בֹּאֲכָ֖ה אַשּׁ֑וּרָה עַל־פְּנֵ֥י כׇל־אֶחָ֖יו נָפָֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּשְׁרוֹ מֵחֲוִילָה עַד <b>חַגְרָא<\/b> דִּי עַל אַפֵּי מִצְרַיִם מָטֵי לְאָתוּר עַל אַפֵּי כָל אַחוֹהִי שְׁרָא:", "onk_en": "They lived from Chavilah to Shur [<b>Chagar<\/b>], which borders on Egypt, going towards Asshur. He lived in the presence of all his brethren.", "pj": "וּשְׁרוֹ מִן הִנְדְקִי עַד חֲלוּצָה דְעַל אַנְפֵּי מִצְרַיִם מַעֲלָךְ לְאַתּוּר עַל אַנְפֵּי כָּל אָחוֹי שְׁרָא בְּאַחֲסַנְתֵּיהּ", "pj_en": "And they dwelt from Hindiki unto Chalutsa, which is in face of Mizraim from going up to Athur. Before the face of all his brethren he dwelt in his possession.", "tj": "וּשְׁרוֹ מִן הִינְדִיקַא עַד חֲלוּצָה דְאִית כָּל קְבֵיל מִצְרַיִם מֵעֲלָךְ אֲתוּרַיָא קָדָם כָּל אֲחוּהִי שְׁרָא:", "tj_en": "And they dwelt from Hindekaia unto Chalutsa, which is by the side of Mizraim, from thy going up towards Arthur. Before all his brethren he dwelt.", "rashi": "<b>נפל.<\/b> שָׁכַן, כְּמוֹ וּמִדְיָן וַעֲמָלֵק וּבְנֵי קֶדֶם נֹפְלִים בָּעֵמֶק (שופטים ז'). כָּאן הוּא אוֹמֵר לְשׁוֹן נְפִילָה, וּלְהַלָּן אוֹמֵר עַל פְּנֵי כָל אֶחָיו יִשְׁכֹּן (בראשית ט״ז:י״ב)? עַד שֶׁלֹּא מֵת אַבְרָהָם יִשְׁכֹּן, מִשֶּׁמֵּת אַבְרָהָם נָפַל:", "rashi_en": "נפל (literally, he fell) means ‘‘he dwelt”, as (Judges 7:12) “Now the Midianites and the Amalekites and all children of the East dwelt (נופלים) in the valley.” Here it says “He fell” and there (16:12) it says “In the presence of all his brethren shall he dwell”. But it may be explained thus: before Abraham died it could be said “He would dwell in security: after he died, “he fell” (Genesis Rabbah 62:5). "}];

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

if (chapters.length > 1) {

    b.dataset.ch = ch;

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
