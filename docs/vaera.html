מַיָּא מִן נַהֲרָא וַהֲוָה דְמָא בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "The fish that were in the river died, and the river became so polluted that the Egyptians were unable to drink the water from the river. There was blood throughout all the land of Egypt.", "pj": "וְנוּנֵי דִי בְנַהֲרָא מִיתוּ וּסְרִי נַהֲרָא וְלָא יָכִילוּ מִצְרָאֵי לְמִשְׁתֵּי מוֹי מִן נַהֲרָא וַהֲוַת מְחַת דְמָא בְּכָל אַרְעָא דְמִצְרַיִם", "pj_en": "and the fish that were in the river died; and the river became foul, and the Mizraee could not drink of the waters, of the river and the plague of blood was in all the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 22, "aliyah": 4, "heb": "וַיַּֽעֲשׂוּ־כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּלָטֵיהֶ֑ם וַיֶּחֱזַ֤ק לֵב־פַּרְעֹה֙ וְלֹא־שָׁמַ֣ע אֲלֵהֶ֔ם כַּאֲשֶׁ֖ר דִּבֶּ֥ר יְהֹוָֽה׃", "onk": "וַעֲבָדוּ כֵן חָרָשֵׁי מִצְרַיִם בְּלַחֲשֵׁיהוֹן וְאִתַּקַּף לִבָּא דְפַרְעֹה וְלָא קַבֵּיל מִנְּהוֹן כְּמָא דִּמַלִּיל יְיָ:", "onk_en": "The sorcerers of Egypt did likewise with their magic art. Pharaoh’s heart remained hardened and he did not listen to [<b>accept<\/b>] them, just as Adonoy had spoken.", "pj": "וַעֲבָדוּ הֵיכְדֵין אִצְטַגְנִינֵי מִצְרַיִם בְּלַחֲשֵׁיהוֹן וְהָפִיכוּ מִן מַיָא דְגוֹשֶׁן לְאַדְמָא וְאִיתְקֵיף יִצְרָא דְלִבָּא דְפַרְעה וְלָא קַבֵּיל מִנְהוֹן הֵיכְמָא דְמַלֵיל יְיָ", "pj_en": "But so (also) did the astrologers of Mizraim by their burnings, and turned the waters of Goshen into blood. And the design of Pharoh's heart was strengthened, and he would not hearken. to them, as the Lord had said.", "tj": "", "tj_en": "", "rashi": "<b>בלטיהם.<\/b> לַחַשׁ שֶׁאוֹמְרִין אוֹתוֹ בַּלָּט וּבַחֲשַׁאי; וְרַבּוֹתֵינוּ אָמְרוּ, \"בְּלָטֵיהֶם\" מַעֲשֵׂה שֵׁדִים, \"בְּלַהֲטֵיהֶם\" מַעֲשֵׂה כְשָׁפִים (סנהדרין ס\"ז):<br><br><b>ויחזק לב פרעה.<\/b> לוֹמַר עַל יְדֵי מְכַשְּׁפוּת אַתֶּם עוֹשִׂים כֵּן; \"תֶּבֶן אַתֶּם מַכְנִיסִים לְעָפְרַיִם\", עִיר שֶׁכֻּלָּהּ תֶּבֶן, אַף אַתֶּם מְבִיאִין מְכַשְּׁפוּת לְמִצְרַיִם שֶׁכֻּלָּהּ כְּשָׁפִים:", "rashi_en": "בלטיהם SECRET ARTS — magic formulas which they utter secretly and in a whisper. Our Rabbis stated that בלטיהם refers to the work of demons, בלהטיהם to witchcraft (Sanhedrin 67b; Exodus Rabbah 9:11).<br><br>ויחזק לב פרעה AND PHARAOH’S HEART WAS HARDENED so that he said: You are doing this by witchcraft: “You are bringing straw to Afarayim”— a city that is full of straw; thus you bring sorcery to Egypt, a land that is full of sorcery (Menachot 85a; Exodus Rabbah 9:6-7)."}, {"ch": 7, "v": 23, "aliyah": 4, "heb": "וַיִּ֣פֶן פַּרְעֹ֔ה וַיָּבֹ֖א אֶל־בֵּית֑וֹ וְלֹא־שָׁ֥ת לִבּ֖וֹ גַּם־לָזֹֽאת׃", "onk": "וְאִתְפְּנִי פַרְעֹה וְעַל לְבֵיתֵיהּ וְלָא שַׁוִּי לִבֵּיהּ אַף לְדָא:", "onk_en": "Pharaoh turned and went into his house, and paid no attention even to this [miracle].", "pj": "וַעֲבַד פַּרְעה צוֹרְכֵיהּ וְעָאל לְבֵיתֵיהּ וְלָא שַׁוֵי לִבֵּיהּ לְחוֹד לְמַחְתָא דָא", "pj_en": "And Pharoh did what was needful to him, and went unto his house, nor did he set his heart upon this plague.", "tj": "", "tj_en": "", "rashi": "<b>גם לזאת.<\/b> לְמוֹפֵת הַמַּטֶּה שֶׁנֶּהְפַּךְ לְתַנִּין, וְלֹא לָזֶה שֶׁל דָּם:", "rashi_en": "גם לזאת [NEITHER DID HE SET HIS HEART] TO THIS ALSO — to the wonder of the staff which was changed into a serpent and also not to that of the blood."}, {"ch": 7, "v": 24, "aliyah": 4, "heb": "וַיַּחְפְּר֧וּ כׇל־מִצְרַ֛יִם סְבִיבֹ֥ת הַיְאֹ֖ר מַ֣יִם לִשְׁתּ֑וֹת כִּ֣י לֹ֤א יָֽכְלוּ֙ לִשְׁתֹּ֔ת מִמֵּימֵ֖י הַיְאֹֽר׃", "onk": "וַחֲפָרוּ כָל מִצְרָאֵי סַחֲרָנוּת נַהֲרָא מַיָּא לְמִשְׁתֵּי אֲרֵי לָא יְכִילוּ לְמִשְׁתֵּי מִמַּיָּא דְּנַהֲרָא:", "onk_en": "The Egyptians dug around the river for water to drink, for they could not drink from the waters of the river.", "pj": "וַחֲפָרוּ מִצְרָאֵי חַזְרָנוֹת נַהֲרָא מוֹי לְמִשְׁתֵּי וְלָא אַשְׁכָּחוּ צְלִילִין אֲרוּם לָא יָכִילוּ לְמִשְׁתֵּי מִן מוֹי דִבְנַהֲרָא", "pj_en": "And the Mizraee digged about the river for water to drink, but could not find them pure; for they were not able to drink of the water from the river.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 25, "aliyah": 4, "heb": "וַיִּמָּלֵ֖א שִׁבְעַ֣ת יָמִ֑ים אַחֲרֵ֥י הַכּוֹת־יְהֹוָ֖ה אֶת־הַיְאֹֽר׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאַשְׁלֵם שִׁבְעַת יוֹמִין בָּתַר דִּמְחָא יְיָ יָת נַהֲרָא:", "onk_en": "Seven full days [passed] after Adonoy had struck the river.", "pj": "וּשְׁלִימוּ שׁוּבְעָא יוֹמִין מִן בָּתַר דִמְחָא יְיָ יַת נַהֲרָא וּמִבָּתַר כֵּן אָסֵי מֵימְרָא דַיְיָ יַת נַהֲרָא", "pj_en": "And seven days were completed after the Lord had smitten the river, and the Word of the Lord had afterward healed the river.", "tj": "", "tj_en": "", "rashi": "<b>וימלא.<\/b> מִנְיַן <b>שבעת ימים<\/b>, שֶׁלֹּא שָׁב הַיְאוֹר לְקַדְמוּתוֹ, שֶׁהָיְתָה הַמַּכָּה מְשַׁמֶּשֶׁת רְבִיעַ חֹדֶשׁ, וג' חֲלָקִים הָיָה מֵעִיד וּמַתְרֶה בָהֶם (תנחומא):", "rashi_en": "וימלא AND THERE WAS COMPLETED (the verb is singular) שבעת ימים the number of SEVEN DAYS during which the river did not return to its original condition. For each plague functioned a quarter of a month and for three quarters He warned and cautioned them (Midrash Tanchuma, Vaera 13; Exodus Rabbah 9:12)."}, {"ch": 7, "v": 26, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה בֹּ֖א אֶל־פַּרְעֹ֑ה וְאָמַרְתָּ֣ אֵלָ֗יו כֹּ֚ה אָמַ֣ר יְהֹוָ֔ה שַׁלַּ֥ח אֶת־עַמִּ֖י וְיַֽעַבְדֻֽנִי׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עוּל לְוָת פַּרְעֹה וְתֵימַר לֵיהּ כִּדְנַן אֲמַר יְיָ שַׁלַּח יָת עַמִּי וְיִפְלְחוּן <b>קֳדָמָי<\/b>:", "onk_en": "Adonoy said to Moshe, “Go to Pharaoh and say to him, ‘This is what Adonoy has said, “Send out my people so they may worship [<b>before<\/b>] Me.", "pj": "וַאֲמַר יְיָ לְמשֶׁה עוּל לְוַת פַּרְעה וְתֵימַר לֵיהּ כִּדְנָא אָמַר יְיָ פְּטוֹר יַת עַמִי וְיִפְלְחוּן קָדָמַי", "pj_en": "And the Lord spoke to Mosheh, Go in unto Pharoh and say to him, Thus saith the Lord, Emancipate My people, that they may serve before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 27, "aliyah": 4, "heb": "וְאִם־מָאֵ֥ן אַתָּ֖ה לְשַׁלֵּ֑חַ הִנֵּ֣ה אָנֹכִ֗י נֹגֵ֛ף אֶת־כׇּל־גְּבוּלְךָ֖ בַּֽצְפַרְדְּעִֽים׃", "onk": "וְאִם סָרִיב אַתְּ לְשַׁלָּחָא הָא אֲנָא <b>מָחֵי<\/b> יָת כָּל תְּחוּמָךְ בְּעֻרְדְּעָנַיָּא:", "onk_en": "If you refuse to send [them,] behold I will plague [<b>smite<\/b>] all your borders [territories] with frogs.", "pj": "וְאִין מְסָרֵב אַנְתְּ לְמִפְטוֹר הָא אֲנָא מָחֵי יַת כָּל תְּחוּמָךְ בְּעוּרְדְעָנַיָא", "pj_en": "But if thou refuse to set them free, behold, I will plague all thy borders with frogs.", "tj": "", "tj_en": "", "rashi": "<b>ואם מאן אתה.<\/b> וְאִם סַרְבָן אַתָּה: <b>מאן.<\/b> כְּמוֹ מְמָאֵן, מְסָרֵב, אֶלָּא כִּנּוּי הָאָדָם עַל שֵׁם הַמִּפְעָל, כְּמוֹ \"שָׁלֵו\" (איוב ט\"ז), \"שָׁקֵט\" (שופטים י\"ח), \"סַר וְזָעֵף\" (מלכים א כ'):<br><br><b>נגף את כל גבולך.<\/b> מַכֶּה, וְכֵן כָּל לְשׁוֹן מַגֵּפָה אֵינוֹ לְשׁוֹן מִיתָה אֶלָּא לְשׁוֹן מַכָּה, וְכֵן \"וְנָגְפוּ אִשָּׁה הָרָה\" (שמות כ\"א), אֵינוֹ לְשׁוֹן מִיתָה, וְכֵן \"וּבְטֶרֶם יִתְנַגְּפוּ רַגְלֵיכֶם\" (ירמיהו י\"ג), \"פֶּן תִּגֹּף בָּאֶבֶן רַגְלֶךָ\" (תהילים צ\"א), \"וּלְאֶבֶן נֶגֶף\" (ישעיהו ח'):", "rashi_en": "ואם מאן אתה — AND IF THOU BE A REFUSER. מאן — The word has the same meaning as ממאן, refusing, (the Piel participle) only the difference is that it is a description of a person having reference to the action he always does (i. e. it is an adjective and the full phrase would be איש מאן) similar to שָׁלֵו “a man at ease” (Job 16:12); שָׁקֵט “a man at ease” (Jeremiah 48:11); וְזָעֵף [‎סר] “a man displeased” (1 Kings 20:43), whilst מְמאֵן merely describes the person as refusing at some particular moment.<br><br>נגף את כל גבולך I WILL PLAGUE ALL THY BOUNDARIES — נוגף means smiting. So, too, wherever a form from the root נגף occurs, it does not necessarily denote killing but it may mean merely smiting. Similarly, (Exodus 21:22) “and if they hurt (ונגפו) a woman with child”, does not mean they kill (as the context shows); so, too, (Jeremiah 13:16) “and before your feet stumble (יתנגפו)” (i. e. hit against something); (Psalms 91:12) “lest thou dash (תגף) thy foot against a stone”; (Isaiah 8:14) ”and for a stone of stumbling (נגף)‎”."}, {"ch": 7, "v": 28, "aliyah": 4, "heb": "וְשָׁרַ֣ץ הַיְאֹר֮ צְפַרְדְּעִים֒ וְעָלוּ֙ וּבָ֣אוּ בְּבֵיתֶ֔ךָ וּבַחֲדַ֥ר מִשְׁכָּבְךָ֖ וְעַל־מִטָּתֶ֑ךָ וּבְבֵ֤ית עֲבָדֶ֙יךָ֙ וּבְעַמֶּ֔ךָ וּבְתַנּוּרֶ֖יךָ וּבְמִשְׁאֲרוֹתֶֽיךָ׃", "onk": "וִירַבֵּי נַהֲרָא עֻרְדְּעָנַיָּא וְיִסְּקוּן וְיֶעֱלוּן בְּבֵיתָךְ וּבְאִדְּרוֹן בֵּית מִשְׁכְּבָךְ וְעַל עַרְסָךְ וּבְבֵית עַבְדָּיךְ וּבְעַמָּךְ וּבְתַנּוּרָךְ וּבְאַצְוָתָךְ:", "onk_en": "The river will swarm with frogs. They will emerge and come into your house, into your bedroom, and on your bed, into the houses of your servants and your people, into your ovens and into your kneading bowls.", "pj": "וְיִרְבֵּי נַהֲרָא עוּרְדְעָנַיָא וְיִסְקוּן וְיַעֲלוּן בְּבֵיתָךְ וּבְקִיטוּן בֵּי דַמְכָךְ וְעִילוֹי דַרְגְשָׁךְ וּבְבֵית עַבְדָךְ וּבְעַמָךְ וּבְתַנוּרָךְ וּבְאַצְוָותָךְ", "pj_en": "And the river shall multiply frogs, and they shall ascend and come up into thy house, and into the bedchamber where thou sleepest, and upon thy couch; and into the house of thy servants, and among thy people, and into the ovens, and into thy baking-troughs,", "tj": "", "tj_en": "", "rashi": "<b>ועלו.<\/b> מִן הַיְאוֹר:<br><br><b>בביתך.<\/b> וְאַחַר כָּךְ <b>בבית עבדיך.<\/b> הוּא הִתְחִיל בָּעֵצָה תְּחִלָּה, \"וַיֹּאמֶר אֶל עַמּוֹ\" (שמות א'), וּמִמֶּנּוּ הִתְחִילָה הַפֻּרְעָנוּת:", "rashi_en": "ועלו AND THEY SHALL GO UP from the river<br><br>בביתך — first into thine house and afterwards, בבית עבדיך — into the house of thy servants; he took the first step in counselling evil against Israel, as it is stated (1:9) “He spake to his people, “[Behold, the children of Israel are more numerous and powerful than we]”, and with him, therefore, did punishment begin (cf. Sotah 11a and Exodus Rabbah 10:3)."}, {"ch": 7, "v": 29, "aliyah": 4, "heb": "וּבְכָ֥ה וּֽבְעַמְּךָ֖ וּבְכׇל־עֲבָדֶ֑יךָ יַעֲל֖וּ הַֽצְפַרְדְּעִֽים׃", "onk": "וּבָךְ וּבְעַמָּךְ וּבְכָל עַבְדָּיךְ יִסְּקוּן עֻרְדְּעָנַיָּא:", "onk_en": "Upon you and upon your people and upon all your servants the frogs will emerge.", "pj": "וּבְגוּפָךְ וּבְגוּפֵי עַמָךְ וּבְכָל עַבְדָךְ יִשְׁלְטוּן עוּרְדְעָנַיָא", "pj_en": "and upon thy body, and upon the bodies of thy people, and upon all thy servants, shall the frogs have power.", "tj": "", "tj_en": "", "rashi": "<b>ובכה ובעמך.<\/b> בְּתוֹךְ מְעֵיהֶם נִכְנָסִין וּמְקַרְקְרִין (סוטה י\"א):", "rashi_en": "ובכה ובעמך AND UPON (or in) THEE AND THY PEOPLE [SHALL THE FROGS COME] — they made their way right into their bodies and crowed (Exodus Rabbah 10:3)."}, {"ch": 8, "v": 1, "aliyah": 4, "heb": "וַיֹּ֣אמֶר יְהֹוָה֮ אֶל־מֹשֶׁה֒ אֱמֹ֣ר אֶֽל־אַהֲרֹ֗ן נְטֵ֤ה אֶת־יָדְךָ֙ בְּמַטֶּ֔ךָ עַ֨ל־הַנְּהָרֹ֔ת עַל־הַיְאֹרִ֖ים וְעַל־הָאֲגַמִּ֑ים וְהַ֥עַל אֶת־הַֽצְפַרְדְּעִ֖ים עַל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֱמַר לְאַהֲרֹן אֲרֵים יָת יְדָךְ בְּחֻטְרָךְ עַל נַהֲרַיָּא עַל אֲרִתַּיָּא וְעַל אַגְמַיָּא וְאַסֵּיק יָת עֻרְדְּעָנַיָּא עַל אַרְעָא דְמִצְרָיִם:", "onk_en": "Adonoy said to Moshe, “Say to Aharon, ‘Extend your hand with your rod over the rivers, over the streams and over the lakes, and bring up the frogs upon the land of Egypt.’”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֵימַר לְאַהֲרן אֲרֵים יַת יְדָךְ בְּחוּטְרָא עַל נַהֲרָא עַל פַּצִידַיָיא וְעַל שִׁיקַיָיא וְאַסֵיק יַת עוּרְדְעָנַיָא עַל אַרְעָא דְמִצְרַיִם", "pj_en": "And the Lord said to Mosheh, Lift up thy hand with thy rod over the rivers, over the trenches, and over the canals, and I will bring up the frogs upon the land of Mizraim.", "tj": "", "tj_en": "Pools.", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 2, "aliyah": 4, "heb": "וַיֵּ֤ט אַהֲרֹן֙ אֶת־יָד֔וֹ עַ֖ל מֵימֵ֣י מִצְרָ֑יִם וַתַּ֙עַל֙ הַצְּפַרְדֵּ֔עַ וַתְּכַ֖ס אֶת־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲרֵים אַהֲרֹן יָת יְדֵיהּ עַל מַיָּא דְמִצְרָאֵי וּסְלֵיקַת עֻרְדְּעָנַיָּא וַחֲפַת יָת אַרְעָא דְמִצְרָיִם:", "onk_en": "Aharon extended his hand over the waters of Egypt, and the frog emerged and covered the land of Egypt.", "pj": "וַאֲרֵים אַהֲרן יַת יְדֵיהּ עַל מַיָא דְמִצְרַיִם וּסְלִיקַת מְחַת עוּרְדְעָנַיָא וַחֲפַת יַת אַרְעָא דְמִצְרָיִם בְּרַם משֶׁה לָא אַלְקֵי יַת מַיָא לָא בְּאַדְמָא וְלָא בְּעוּרְדְעָנַיָא מִן בִּגְלַל דַהֲוַת לֵיהּ בְּהוֹן שֵׁיזְבוּתָא בִּזְמַן דְטָלְקַת יָתֵיהּ אִמֵיהּ בְּנַהֲרָא", "pj_en": "And Aharon uplifted his hand over the waters of Mizraim, and the plague of frogs came up and covered the land of Mizraim. But Mosheh (himself) did not smite the waters, either with the blood or with the frogs because through them (the waters of the Nile) he had (found) safety the time that his mother laid him in the river.", "tj": "", "tj_en": "", "rashi": "<b>ותעל הצפרדע.<\/b> צְפַרֵדַּע אַחַת הָיְתָה וְהָיוּ מַכִּין אוֹתָהּ וְהִיא מַתֶּזֶת נְחִילִים נְחִילִים, זֶהוּ מִדְרָשׁוֹ (סנהדרין ס\"ז). וּפְשׁוּטוֹ יֵשׁ לוֹמַר, שֵׁרוּץ הַצְפַרְדְּעִים קוֹרֵא לְשׁוֹן יְחִידוּת; וְכֵן וַתְּהִי הַכִּנָּם – הָרְחִישָׁה, פדולייר\"א בְּלַעַז, וְאַף <b>ותעל הצפרדע<\/b> – גרינולייר\"א בְּלַעַז:", "rashi_en": "ותעל הצפרדע AND THE FROGS (lit. frog) CAME UP — Really there was only one frog, but when they struck at it, it was split into many swarms. This is a Midrashic explanation of the usage of the singular noun here (cf. Sanhedrin 67b; Exodus Rabbah 10:4). But as a literal explanation one must say that the swarm of the frogs is denoted by the singular form. Similar is, (v. 14) “and there was the כנם” — the swarm of insects, in old French pedulier; i. e. a swarm of lice. So, too, here, ותעל הצפרדע means: and there came up a grenouillière (old French) i. e. a swarm of frogs."}, {"ch": 8, "v": 3, "aliyah": 4, "heb": "וַיַּֽעֲשׂוּ־כֵ֥ן הַֽחַרְטֻמִּ֖ים בְּלָטֵיהֶ֑ם וַיַּעֲל֥וּ אֶת־הַֽצְפַרְדְּעִ֖ים עַל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַעֲבָדוּ כֵן חָרָשַׁיָּא בְּלַחֲשֵׁיהוֹן וְאַסִּיקוּ יָת עֻרְדְּעָנַיָּא עַל אַרְעָא דְמִצְרָיִם:", "onk_en": "The sorcerers did likewise with their magic art, and made the frogs emerge upon the land of Egypt.", "pj": "וְעָבָדוּ הֵיכְדֵין אִיסְטַגְנִינָן בְּלַחְשֵׁיהוֹן וְאַסִיקוּ יַת עוּרְדְעָנַיָא עַל אַרְעָא דְמִצְרָיִם", "pj_en": "And the astrologers did likewise by their burnings, and brought up frogs upon the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 4, "aliyah": 4, "heb": "וַיִּקְרָ֨א פַרְעֹ֜ה לְמֹשֶׁ֣ה וּֽלְאַהֲרֹ֗ן וַיֹּ֙אמֶר֙ הַעְתִּ֣ירוּ אֶל־יְהֹוָ֔ה וְיָסֵר֙ הַֽצְפַרְדְּעִ֔ים מִמֶּ֖נִּי וּמֵֽעַמִּ֑י וַאֲשַׁלְּחָה֙ אֶת־הָעָ֔ם וְיִזְבְּח֖וּ לַיהֹוָֽה׃", "onk": "וּקְרָא פַרְעֹה לְמשֶׁה וּלְאַהֲרֹן וַאֲמַר צַלּוֹ <b>קֳדָם<\/b> יְיָ וְיַעְדֵּי עֻרְדְּעָנַיָּא מִנִּי וּמֵעַמִּי וְאֶשְׁלַח יָת עַמָּא וְיִדְבְּחוּן <b>קֳדָם<\/b> יְיָ:", "onk_en": "Pharaoh called for Moshe and Aharon and said, “Pray to [<b>before<\/b>] Adonoy, and let Him remove the frogs from me and from my people, and I will send the people to sacrifice to [<b>before<\/b>] Adonoy.”", "pj": "וּקְרָא פַּרְעה לְמשֶׁה וּלְאַהֲרן וַאֲמַר צְלוֹן קֳדָם יְיָ וְיַעֲדֵי עוּרְדְעָנַיָא מִינִי וּמִן עַמָא וְאֶפְטוֹר יַת עַמָא וְיִדְבְּחוּן נִיכְסַת חַגָא קֳדָם יְיָ", "pj_en": "And Pharoh called to Mosheh and to Aharon, saying, Pray before the Lord, that He may remove the frogs from me and from my people; and I will release the people to offer the sacrifices of a feast before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 5, "aliyah": 4, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֣ה לְפַרְעֹה֮ הִתְפָּאֵ֣ר עָלַי֒ לְמָתַ֣י&thinsp;<b>׀<\/b> אַעְתִּ֣יר לְךָ֗ וְלַעֲבָדֶ֙יךָ֙ וּֽלְעַמְּךָ֔ לְהַכְרִית֙ הַֽצְפַרְדְּעִ֔ים מִמְּךָ֖ וּמִבָּתֶּ֑יךָ רַ֥ק בַּיְאֹ֖ר תִּשָּׁאַֽרְנָה׃", "onk": "וַאֲמַר משֶׁה לְפַרְעֹה <b>שְׁאַל לָךְ גְּבוּרָא הַב לִי זְמַן לְאִמָּתַי<\/b> אֱצַלֵּי עֲלָךְ וְעַל עַבְדָּיךְ וְעַל עַמָּךְ לְשֵׁיצָאָה עֻרְדְּעָנַיָּא מִנָּךְ וּמִבָּתָּיךְ לְחוֹד בְּנַהֲרָא תִּשְׁתָּאָרָן:", "onk_en": "Moshe said to Pharaoh, “Glorify [<b>Request might for<\/b>] yourself at my expense. [Exactly for] when shall I [<b>Give me a time when I shall<\/b>] pray for you, and for your servants and for your people, that the frogs be destroyed from you and from your houses, remaining only in the river.”", "pj": "וַאֲמַר משֶׁה לְפַרְעה שַׁבַּח בְּגִינִי לְאֵימַת דְאַנְתְּ בָּעֵי אַיְצַלֵי עֲלָךְ וְעַל עַבְדָךְ וְעַל עַמָךְ לְשֵׁיצָאָה עוּרְדְעָנַיָא מִינָךְ וּמִבָּתָּךְ לְחוֹד מָה דִבְנַהֲרָא יִשְׁתַּיְירוּן", "pj_en": "And Mosheh said to Pharoh, Glorify thyself on account of me. At what time dost thou request that I should pray for thee, and for thy servants, and for thy people, that the frogs may be destroyed from thee and from thy house, and be left only in the river?", "tj": "", "tj_en": "", "rashi": "<b>התפאר עלי.<\/b> כְּמוֹ \"הֲיִתְפָּאֵר הַגַּרְזֶן עַל הַחֹצֵב בּוֹ\" (ישעיהו י') – מִשְׁתַּבֵּחַ לוֹמַר אֲנִי גָּדוֹל מִמְּךָ, ונטי\"ר בְּלַעַז. וְכֵן הִתְפָּאֵר עָלַי – הִשְׁתַּבֵּחַ לְהִתְחַכֵּם וְלִשְׁאֹל דָּבָר גָּדוֹל, וְלוֹמַר שֶׁלֹּא אוּכַל לַעֲשׂוֹתוֹ:<br><br><b>למתי אעתיר לך.<\/b> אֶת אֲשֶׁר אַעְתִּיר לְךָ הַיּוֹם עַל הַכְרָתַת הַצְפַרְדְּעִים, לְמָתַי תִּרְצֶה שֶׁיִּכָּרְתוּ? וְתִרְאֶה אִם אַשְׁלִים דְּבָרִי לַמּוֹעֵד שֶׁתִּקְבַּע לִי. אִלּוּ נֶאֱמַר \"מָתַי\" אַעְתִּיר, הָיָה מַשְׁמָע מָתַי אֶתְפַּלֵּל, עַכְשָׁו שֶׁנֶּאֱמַר \"לְמָתַי\", מַשְׁמָע אֲנִי הַיּוֹם אֶתְפַּלֵּל עָלֶיךָ, שֶׁיִּכָּרְתוּ הַצְפַרְדְּעִים לִזְמַן שֶׁתִּקְבַּע עָלַי; אֱמֹר לְאֵיזֶה יוֹם תִּרְצֶה שֶׁיִּכָּרְתוּ: <b>אעתיר, העתירו, והעתרתי.<\/b> וְלֹא נֶאֱמַר אֶעְתַּר, עִתְרוּ, וְעָתַרְתִּי, מִפְּנֵי שֶׁכָּל לְשׁוֹן עתר הַרְבּוֹת פֶּלֶל הוּא, וְכַאֲשֶׁר יֹאמַר אַרְבֶּה, הַרְבּוּ, וְהִרְבֵּיתִי, לְשׁוֹן מַפְעִיל, כָּךְ יֹאמַר אַעְתִּיר, הַעְתִּירוּ, וְהַעְתַּרְתִּי דְּבָרִים; וְאָב לְכֻלָּם \"וְהַעְתַּרְתֶּם עָלַי דִּבְרֵיכֶם\" (יחזקאל ל\"ה) – הִרְבֵּיתֶם:", "rashi_en": "התפאר עלי GLORY OVER ME — Similar is, (Isaiah 10:15) “Should the axe יתפאר against him that heweth therewith” i. e. should it boast, saying “I am greater than thou”; old French vanter. Therefore התפאר means pride yourself on showing your cleverness and on asking of me a difficult matter asserting that I shall be unable to do it.<br><br>למתי אעתיר FOR WHAT PERIOD SHALL I ENTREAT FOR THEE — With reference to the entreaty which I shall make to-day regarding the destruction of the frogs, by what period do you wish that they should be destroyed, and you will see whether I can carry out my promise by the time which you will set me. If the text said מתי אעתיר (without ל), it would signify “when shall I pray?” but now that it is said למתי, it signifies I will pray to-day for you that the frogs should be destroyed by the time which you will set for me. Tell me, then, by what day you wish that they shall be destroyed. The words here, אעתיר and העתירו (v. 4) and העתרתי (v. 25) are Hiphil forms, and it does not say אֶעְתַּר and עִתְרוּ and וְעָתַרְתִּי (Kal forms) because wherever the root עתר is used it denotes to pray much (more lit. Rashi’s words signify “to multiply praying”, “to make much praying”), and just as one says אַרְבֶּה and הַרְבּוּ and וְהִרְבֵּתִי which all have the meaning of “causing an action to happen” (in this case, causing a thing to be much — our Hiphil conjugation), so one says אַעְתִּיר and הַעְתִּירוּ and וְהֵעְתַּרְתִּי “I increase”, “increase ye” and “I will increase” i. e. I will increase words. The passage which serves as evidence of the meaning of all these words is (Ezekiel 35:13) “וְהֵעְתַּרְתֶּם your words against Me” — which can only mean “Ye have multiplied” (being a transitive verb; cf. Rashi on Genesis 25:21)."}, {"ch": 8, "v": 6, "aliyah": 4, "heb": "וַיֹּ֖אמֶר לְמָחָ֑ר וַיֹּ֙אמֶר֙ כִּדְבָ֣רְךָ֔ לְמַ֣עַן תֵּדַ֔ע כִּי־אֵ֖ין כַּיהֹוָ֥ה אֱלֹהֵֽינוּ׃", "onk": "וַאֲמַר לִמְחָר וַאֲמַר כְּפִתְגָּמָךְ בְּדִיל דְּתִדַּע אֲרֵי לֵית כַּייָ אֱלָהָנָא:", "onk_en": "[Pharaoh] said, “By tomorrow.” [Moshe] said, “As you say. You will then know that there is none like Adonoy, our God.", "pj": "וַאֲמֵר לְמָחָר וַאֲמַר כְּפִתְגָמָךְ מִן בִּגְלַל דְתִנְדַע אֲרוּם לֵית כַּיְיָ אֱלָהָנָא", "pj_en": "And he said, Tomorrow. And he said, According to thy word: that thou mayest know that there is none like the Lord our God.", "tj": "", "tj_en": "Give a sign, and keep at a distance, till I shall have prayed for thee.", "rashi": "<b>ויאמר למחר.<\/b> הִתְפַּלֵּל הַיּוֹם, שֶׁיִּכָּרְתוּ לְמָחָר:", "rashi_en": "ויאמר למחר AND HE SAID, FOR TO-MORROW — He said: Pray to-day that they may be destroyed by to-morrow."}, {"ch": 8, "v": 7, "aliyah": 5, "heb": "וְסָר֣וּ הַֽצְפַרְדְּעִ֗ים מִמְּךָ֙ וּמִבָּ֣תֶּ֔יךָ וּמֵעֲבָדֶ֖יךָ וּמֵעַמֶּ֑ךָ רַ֥ק בַּיְאֹ֖ר תִּשָּׁאַֽרְנָה׃", "onk": "וְיֶעְדּוּן עֻרְדְּעָנַיָּא מִנָּךְ וּמִבָּתָּיךְ וּמֵעַבְדָּיךְ וּמֵעַמָּךְ לְחוֹד בְּנַהֲרָא יִשְׁתָּאָרָן:", "onk_en": "The frogs will be removed from you, from your houses, from your servants and from your people. They will remain only in the river.", "pj": "וְיַעֲדוּן עוּרְדְעָנַיָא מִינָךְ וּמִבָּתָּךְ וּמִן עַבְדָךְ וּמִן עַמָךְ לְחוֹד מַה דִבְנַהֲרָא יִשְׁתַּיְירוּן", "pj_en": "And the frogs shall depart from thee, and from thy house, and from thy servants, and from thy people; and those only that are in the river shall remain.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 8, "aliyah": 5, "heb": "וַיֵּצֵ֥א מֹשֶׁ֛ה וְאַהֲרֹ֖ן מֵעִ֣ם פַּרְעֹ֑ה וַיִּצְעַ֤ק מֹשֶׁה֙ אֶל־יְהֹוָ֔ה עַל־דְּבַ֥ר הַֽצְפַרְדְּעִ֖ים אֲשֶׁר־שָׂ֥ם לְפַרְעֹֽה׃", "onk": "וּנְפַק משֶׁה וְאַהֲרֹן מִלְּוָת פַּרְעֹה <b>וְצַלִּי<\/b> משֶׁה <b>קֳדָם<\/b> יְיָ עַל עֵסַק עֻרְדְּעָנַיָּא דִּי שַׁוִּי לְפַרְעֹה:", "onk_en": "Moshe and Aharon left Pharaoh, and Moshe cried out to [<b>prayed before<\/b>] Adonoy concerning the frogs that He had set upon Pharaoh.", "pj": "וּנְפַק משֶׁה וְאַהֲרן מִלְוַת פַּרְעה וְצַלֵי משֶׁה קֳדָם יְיָ עַל עֵיסַק עוּרְדְעָנַיָא דְשַׁוֵי לְפַרְעה", "pj_en": "And Mosheh and Aharon went out from Pharoh, and Mosheh prayed before the Lord respecting the frogs, as he had proposed to Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>ויצא, ויצעק.<\/b> מִיָּד, שֶׁיִּכָּרְתוּ לְמָחָר:", "rashi_en": "ויצא. . ויצעק THEY WENT … AND CRIED [UNTO THE LORD) immediately that they should be destroyed by to-morrow."}, {"ch": 8, "v": 9, "aliyah": 5, "heb": "וַיַּ֥עַשׂ יְהֹוָ֖ה כִּדְבַ֣ר מֹשֶׁ֑ה וַיָּמֻ֙תוּ֙ הַֽצְפַרְדְּעִ֔ים מִן־הַבָּתִּ֥ים מִן־הַחֲצֵרֹ֖ת וּמִן־הַשָּׂדֹֽת׃", "onk": "וַעֲבַד יְיָ כְּפִתְגָּמָא דְמשֶׁה וּמִיתוּ עֻרְדְּעָנַיָּא מִן בָּתַּיָּא מִן דָּרָתָא וּמִן חַקְלָתָא:", "onk_en": "Adonoy did as Moshe said, the frogs died, [those that were in] the houses, the courtyards, and the fields.", "pj": "וַעֲבַד יְיָ כְּפִתְגָמָא דְמשֶׁה וּמִיתוּ עוּרְדְעָנַיָא מִן בָּתַּיָא וּמִן דַרְתָּא וּמִן חַקְלָא", "pj_en": "And the Lord did according to the word of Mosheh; and the frogs died from the houses and from the courts and from the field,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 10, "aliyah": 5, "heb": "וַיִּצְבְּר֥וּ אֹתָ֖ם חֳמָרִ֣ם חֳמָרִ֑ם וַתִּבְאַ֖שׁ הָאָֽרֶץ׃", "onk": "וּכְנָשׁוּ יָתְהוֹן דְּגוֹרִין דְּגוֹרִין <b>וּסְרִיאוּ עַל אַרְעָא<\/b>:", "onk_en": "They gathered them into [many] heaps, and the land was [<b>they became<\/b>] polluted [<b>decayed upon the land<\/b>].", "pj": "וּכְנָשׁוּ יַתְהוֹן כַּרְוַון כַּרְוַון וּסְרִיַית אַרְעָא", "pj_en": "and they collected them in heaps and heaps, and the land was corrupted.", "tj": "כַּרְוַון כַּרְוַון:", "tj_en": "Heaps, heaps.", "rashi": "<b>חמרם חמרם.<\/b> צִבּוּרִים צִבּוּרִים, כְּתַרְגּוּמוֹ, דְּגוֹרִין – גַּלִּין:", "rashi_en": "חמרים חמרים means IN HEAPS, just as the Targum renders it, דגורין, which means גלין heaps (דגורא is the Targum of הגל in Genesis 31:46)."}, {"ch": 8, "v": 11, "aliyah": 5, "heb": "וַיַּ֣רְא פַּרְעֹ֗ה כִּ֤י הָֽיְתָה֙ הָֽרְוָחָ֔ה וְהַכְבֵּד֙ אֶת־לִבּ֔וֹ וְלֹ֥א שָׁמַ֖ע אֲלֵהֶ֑ם כַּאֲשֶׁ֖ר דִּבֶּ֥ר יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲזָא פַרְעֹה אֲרֵי הֲוַת רְוַחְתָּא וְיִתְיַקַּר יָת לִבֵּיהּ וְלָא <b>קַבִּיל<\/b> מִנְּהוֹן כְּמָא דִּמַלִּיל יְיָ:", "onk_en": "[When] Pharaoh saw that there was respite, he hardened his heart and did not listen to [<b>accept<\/b>] them, just as Adonoy had spoken.", "pj": "וַחֲמָא פַרְעה אֲרוּם הֲוָה רְוַוחְתָּא לְעַקְתֵיהּ וִיקַר יַת לִבֵּיהּ וְלָא קַבֵּיל מִנְהוֹן הֵיכְמָא דְמַלֵל יְיָ", "pj_en": "And Pharoh saw that he was refreshed from his molestation, but hardened his heart, and would not hearken to them, as the Lord had said.", "tj": "", "tj_en": "", "rashi": "<b>והכבד את לבו.<\/b> לְשׁוֹן פָּעוֹל הוּא, כְּמוֹ \"הָלוֹךְ וְנָסוֹעַ\" (בראשית י\"ב), וְכֵן \"וְהַכּוֹת אֶת מוֹאָב\" (מלכים ב ג׳:כ״ד), \"וְשָׁאוֹל לוֹ בֵאלֹהִים\" (שמואל א כ״ב:י״ג), \"הַכֵּה וּפָצֹעַ\" (מלכים א כ'):<br><br><b>כאשר דבר ה'.<\/b> וְהֵיכָן דִּבֵּר? וְלֹא יִשְׁמַע אֲלֵיכֶם פַּרְעֹה:", "rashi_en": "והכבד את לבו HE ALLOWED HIS HEART TO BE HARDENED — The word הַכְבֵּד expresses doing something (the Hebrew infinitive but having a past meaning) just as, (Genesis 12:9) “going (הלוך) and journeying (ונסוע)”. So, too, (2 Kings 3:24) “and smiting (והכת) Moab”; (I Samuel 22:13) “and enquiring (ושאול) of God for him”; (1 Kings 20:37); “smiting (הכה) and wounding (ופצוע)”.<br><br>‎ כאשר דבר ה׳ AS THE LORD HAD SPOKEN — And where had He said this? When He said, (Exodus 7:4) “Pharaoh will not hearken to you”."}, {"ch": 8, "v": 12, "aliyah": 5, "heb": "וַיֹּ֣אמֶר יְהֹוָה֮ אֶל־מֹשֶׁה֒ אֱמֹר֙ אֶֽל־אַהֲרֹ֔ן נְטֵ֣ה אֶֽת־מַטְּךָ֔ וְהַ֖ךְ אֶת־עֲפַ֣ר הָאָ֑רֶץ וְהָיָ֥ה לְכִנִּ֖ם בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֱמַר לְאַהֲרֹן אֲרֵים יָת חֻטְרָךְ וּמְחָא יָת עַפְרָא דְאַרְעָא וִיהֵא לְקַלְמְתָא בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "Adonoy said to Moshe, “Say to Aharon, Extend your rod and strike the dust of the earth; and it will turn into lice throughout the whole land of Egypt.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֵימַר לְאַהֲרן אֲרֵים יַת חוּטְרָךְ וּמְחֵי יַת עַפְרָא דְאַרְעָא וִיהֵי לְקַלְמֵי בְּכָל אַרְעָא דְמִצְרָיִם בְּרַם עַל יְדָךְ לֵית אֶפְשַׁר לְמִלְקֵי אַרְעָא דְבָהּ הֲוָת לָךְ שֵׁיזְבוּתָא כַּד קָטַלְתָּא יַת מִצְרָאֵי וְקַבִּילְתֵּיהּ", "pj_en": "And the Lord said to Mosheh, Speak unto Aharon, Lift up thy rod and smite the dust of the earth, and it shall become venomous insects in all the land of Mizraim. But it shall not be by thee that the ground shall be smitten, because therein for thee was (the means of) safety when thou hadst slain the Mizraite and it received him.", "tj": "", "tj_en": "", "rashi": "<b>אמר אל אהרן.<\/b> לֹא הָיָה הֶעָפָר כְּדַאי לִלְקוֹת עַ\"יְ מֹשֶׁה, לְפִי שֶׁהֵגֵן עָלָיו כְּשֶׁהָרַג אֶת הַמִּצְרִי וַיִּטְמְנֵהוּ בַּחוֹל, וְלָקָה עַל יְדֵי אַהֲרֹן (שמות רבה):", "rashi_en": "אמר אל אהרן SAY UNTO AARON — The dust did not deserve to be smitten by Moses because it had protected him when he slew the Egyptian, for “he hid him in the sand”; and it was therefore smitten by Aaron (Tanchuma; Exodus Rabbah 10:7)."}, {"ch": 8, "v": 13, "aliyah": 5, "heb": "וַיַּֽעֲשׂוּ־כֵ֗ן וַיֵּט֩ אַהֲרֹ֨ן אֶת־יָד֤וֹ בְמַטֵּ֙הוּ֙ וַיַּךְ֙ אֶת־עֲפַ֣ר הָאָ֔רֶץ וַתְּהִי֙ הַכִּנָּ֔ם בָּאָדָ֖ם וּבַבְּהֵמָ֑ה כׇּל־עֲפַ֥ר הָאָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַעֲבָדוּ כֵן וַאֲרֵים אַהֲרֹן יָת יְדֵיהּ בְּחֻטְרֵיהּ וּמְחָא יָת עַפְרָא דְאַרְעָא וַהֲוַת קַלְמְתָא בַּאֲנָשָׁא וּבִבְעִירָא כָּל עַפְרָא דְאַרְעָא הֲוַת קַלְמְתָא בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "They did so. Aharon extended his hand with his rod and struck the dust of the earth, and there was lice on man and beast. All the dust of the earth turned into lice throughout the whole land of Egypt.", "pj": "וַעֲבָדוּ הֵיכְדֵין וַאֲרֵים אַהֲרן יַת יְדֵיהּ בְּחוּטְרֵיהּ וּמְחָא יַת עַפְרָא דְאַרְעָא וַהֲוַת מְחַת קַלְמֵי בְּבִשְרָא דְאֵינָשָׁא וְדִבְעִירָא כָל עַפְרָא דְאַרְעָא אִיתְהֲפִּיךְ לְמֶהֱוֵי קַלְמֵי בְּכָל אַרְעָא דְמִצְרָיִם", "pj_en": "And they did so, and Aharon lifted up his hand with his rod, and smote the dust of the ground, and it became a plague of venomous insects upon the flesh of men and of cattle; all the dust of the earth was changed to become insects, in all the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ותהי הכנם.<\/b> הָרְחִישָׁה, פדוליר\"א בְּלַעַז:", "rashi_en": "ותהי הכנם means the swarming was. In old French pedulier."}, {"ch": 8, "v": 14, "aliyah": 5, "heb": "וַיַּעֲשׂוּ־כֵ֨ן הַחַרְטֻמִּ֧ים בְּלָטֵיהֶ֛ם לְהוֹצִ֥יא אֶת־הַכִּנִּ֖ים וְלֹ֣א יָכֹ֑לוּ וַתְּהִי֙ הַכִּנָּ֔ם בָּאָדָ֖ם וּבַבְּהֵמָֽה׃", "onk": "וַעֲבָדוּ כֵן חָרָשַׁיָּא בְּלַחֲשֵׁיהוֹן לְאַפָּקָא יָת קַלְמְתָא וְלָא יָכִילוּ וַהֲוַת קַלְמְתָא בַּאֲנָשָׁא וּבִבְעִירָא:", "onk_en": "The sorcerers did likewise with their magic art. They tried to bring forth lice but they could not, and there were lice on man and beast.", "pj": "וַעֲבָדוּ הֵיכְדֵין אִסְטַגְנִינַיָא חַרְשְׁיוּתָא בְּלַחֲשֵׁהוֹן לְאַנְפָּקָא יַת קַלְמִין וְלָא יָכִילוּ וַהֲוַת מְחַת קַלְמֵי שַׁלְטָא בְּאֵינָשָׁא וּבִבְעִירָא", "pj_en": "And the astrologers wrought with their burnings to bring forth the insects, but were not able; and the plague of insects prevailed upon men and upon cattle.", "tj": "", "tj_en": "", "rashi": "<b>להוציא את הכנים.<\/b> לִבְרֹאתָם וּלְהוֹצִיאָם מִמָּקוֹם אַחֵר:<br><br><b>ולא יכלו.<\/b> שֶׁאֵין הַשֵּׁד שׁוֹלֵט עַל בְּרִיָּה פְּחוּתָה מִכַּשְּׂעוֹרָה (סנהדרין ס\"ז):", "rashi_en": "להוציא את הכנים TO BRING FORTH GNATS — to create them and to bring them forth from some other place (not from dust but to turn some other material into gnats).<br><br>ולא יכלו BUT THEY COULD NOT — for the demon (through whose agency this was to be done) is powerless in the case of a creature smaller than a barley corn) (Sanhedrin 67b). Therefore they had to admit,"}, {"ch": 8, "v": 15, "aliyah": 5, "heb": "וַיֹּאמְר֤וּ הַֽחַרְטֻמִּם֙ אֶל־פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַיֶּחֱזַ֤ק לֵב־פַּרְעֹה֙ וְלֹֽא־שָׁמַ֣ע אֲלֵהֶ֔ם כַּאֲשֶׁ֖ר דִּבֶּ֥ר יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמָרוּ חָרָשַׁיָּא לְפַרְעֹה הָא <b>מָחָא מִן קֳדָם<\/b> יְיָ הִיא וְאִתַּקַּף לִבָּא דְפַרְעֹה וְלָא <b>קַבִּיל<\/b> מִנְּהוֹן כְּמָא דִּמַלִּיל יְיָ:", "onk_en": "The sorcerers said to Pharaoh, “This is the finger of [<b>a plague from before<\/b>] Elohim;” but Pharaoh’s heart remained hardened and he did not listen to [<b>accept<\/b>] them, as Adonoy had spoken.", "pj": "וַאֲמָרוּ אִיסְטַגְנִינֵי פַּרְעה לָא מִן כּחַ גְבוּרַת משֶׁה וְאַהֲרן הִיא אֱלָהֵן מְחָא מִשְׁתַּלְחָא מִן קֳדָם יְיָ הִיא וְאִתְקַף יִצְרָא דְלִבָּא דְפַרְעה וְלָא קַבֵּיל מִנְהוֹן הֵיכְמָא דְמַלֵיל יְיָ", "pj_en": "And the astrologers said to Pharoh, This is not by the power or strength of Mosheh and Aharon; but this is a plague sent from before the Lord. Yet the design of Pharoh's heart was strengthened, and he would not hearken to them, as the Lord had said.", "tj": "", "tj_en": "", "rashi": "<b>אצבע אלהים הוא.<\/b> מַכָּה זוֹ אֵינָהּ עַל יְדֵי כְשָׁפִים, מֵאֵת הַמָּקוֹם הִיא (שמות רבה):<br><br><b>כאשר דבר ה'.<\/b> וְלֹא יִשְׁמַע אֲלֵיכֶם פַּרְעֹה:", "rashi_en": "אצבע אלהים הוא THIS IS THE FINGER OF GOD — This plague is not caused by sorcery: it is of the Omnipresent God!<br><br>כאשר דבר ה׳ AS THE LORD HAD SPOKEN — when He said, (Exodus 7:4) “Pharaoh will not hearken unto you”."}, {"ch": 8, "v": 16, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה הַשְׁכֵּ֤ם בַּבֹּ֙קֶר֙ וְהִתְיַצֵּב֙ לִפְנֵ֣י פַרְעֹ֔ה הִנֵּ֖ה יוֹצֵ֣א הַמָּ֑יְמָה וְאָמַרְתָּ֣ אֵלָ֗יו כֹּ֚ה אָמַ֣ר יְהֹוָ֔ה שַׁלַּ֥ח עַמִּ֖י וְיַֽעַבְדֻֽנִי׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אַקְדֵּם בְּצַפְרָא וְאִתְעַתַּד קֳדָם פַּרְעֹה הָא נָפֵק לְמַיָּא וְתֵימַר לֵיהּ כִּדְנַן אֲמַר יְיָ שַׁלַּח עַמִּי וְיִפְלְחוּן <b>קֳדָמָי<\/b>:", "onk_en": "Adonoy said to Moshe, “Rise up early in the morning and set yourself before Pharaoh, when he goes out to the water, and say to him, ‘This is what Adonoy has said, ‘Send out My people so they may worship [<b>before<\/b>] Me.", "pj": "וַאֲמַר יְיָ לְמשֶׁה אַקְדֵם בְּצַפְרָא וְתִתְעַתַּד קֳדָם פַּרְעה הָא נָפִיק לְמִנְטַר קוּסְמִין עִילוֹי מַיָא הֵי כְּאַמְגוּשָׁא וְתֵימַר לֵיהּ כִּדְנָא אָמַר יְיָ פְּטוֹר יַת עַמִי וְיִפְלְחוּן קֳדָמַי", "pj_en": "And the Lord spake to Mosheh, Arise in the morning, and stand before Pharoh: behold, be goeth forth to observe divinations at the water, as a magician; and thou shalt say to him, Thus saith the Lord, Emancipate My people, that they may worship before Me;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 17, "aliyah": 5, "heb": "כִּ֣י אִם־אֵינְךָ֮ מְשַׁלֵּ֣חַ אֶת־עַמִּי֒ הִנְנִי֩ מַשְׁלִ֨יחַ בְּךָ֜ וּבַעֲבָדֶ֧יךָ וּֽבְעַמְּךָ֛ וּבְבָתֶּ֖יךָ אֶת־הֶעָרֹ֑ב וּמָ֨לְא֜וּ בָּתֵּ֤י מִצְרַ֙יִם֙ אֶת־הֶ֣עָרֹ֔ב וְגַ֥ם הָאֲדָמָ֖ה אֲשֶׁר־הֵ֥ם עָלֶֽיהָ׃", "onk": "אֲרֵי אִם לֵיתָךְ מְשַׁלַּח יָת עַמִּי הָא אֲנָא מַשְׁלַח בָּךְ וּבְעַבְדָּיךְ וּבְעַמָּךְ וּבְבָתָּיךְ יָת עָרוֹבָא וְיִמְלוּן בָּתֵּי מִצְרַיִם יָת עָרוֹבָא וְאַף אַרְעָא דִּאִנּוּן עֲלַהּ:", "onk_en": "For if you do not send out My people, behold, I will send against you and your servants, and your nation, and your houses, swarms of wild animals. The houses of Egypt will be full of the wild animals, and so too the ground upon which they stand.", "pj": "אֲרוּם אִין לֵיתָךְ מִפְטַר יַת עַמִי הָאֲנָא מְגָרֵי בָךְ וּבְעַבְדָךְ וּבְעַמָךְ וּבְבֵיתָךְ יַת עִירְבּוּב חֵיוַת בָּרָא וְיִתְמְלוּן בָּתֵּי מִצְרָאֵי עִירְבּוּב חֵיוַת בָּרָא וְאוּף יַת אַרְעָא דְהִינוּן עֲלָהּ", "pj_en": "but if thou wilt not set My people free, behold, I will stir up among thee, and thy servants, and thy people, and thy house, a mixed multitude of wild beasts and the houses of the Mizraee shall be filled with a swarm of wild beasts, and they shall be upon the land also.", "tj": "עִרְבּוּבָא:", "tj_en": "A commixture.", "rashi": "<b>משליח בך.<\/b> מְגָרֶה בְךָ, וְכֵן \"וְשֶׁן בְּהֵמוֹת אֲשַׁלַּח בָּם\" (דברים ל\"ב), לְשׁוֹן שִׁסּוּי, אינציט\"ר בְּלַעַז:<br><br><b>את הערב.<\/b> כָּל מִינֵי הַחַיּוֹת רָעוֹת וּנְחָשִׁים וְעַקְרַבִּים בְּעִרְבּוּבְיָא, וְהָיוּ מַשְׁחִיתִים בָּהֶם; וְיֵשׁ טַעַם בַּדָּבָר בָּאַגָּדָה בְּכָל מַכָּה וּמַכָּה לָמָּה זוֹ וְלָמָּה זוֹ; בְּטַכְסִיסֵי מִלְחֲמוֹת מְלָכִים בָּא עֲלֵיהֶם, כְּסֵדֶר מַלְכוּת כְּשֶׁצָּרָה עַל עִיר, בַּתְּחִלָּה מְקַלְקֵל מַעְיְנוֹתֶיהָ, וְאַחַר כָּךְ תּוֹקְעִין עֲלֵיהֶם וּמְרִיעִין בַּשּׁוֹפָרוֹת לְיָרְאָם וּלְבַהֲלָם, וְכֵן הַצְפַרְדְּעִים מְקַרְקְרִים וְהוֹמִים וְכוּ', כִּדְאִיתָא בְּמִדְרַשׁ רַבִּי תַּנְחוּמָא (פ' בא):", "rashi_en": "משליח בך means I WILL INCITE AGAINST THEE. Another example is. (Deuteronomy 32:24) “I will incite (אשלח) the tooth of beasts against them”, where it signifies letting loose an animal against a person; old French inciter. English to incite.<br><br>את הערב this means all kinds of wild beasts, serpents, and scorpions (a mixture [ערב] of noxious creatures) in a crowd (Exodus Rabbah 11:3) — these played havoc with them. There is a reason given in the Midrash in the case of each plague why this particular one and why that: God came against them with the tactics of warlike operations as carried out by kings in orderly sequence: a government (monarch) who is besieging a city first destroys its water supply, then they blow the trumpets and sound an alarm in order to terrify and dismay them — thus [their water supply was turned into blood], the frogs croaked and made a noise etc. - just as you will find it stated in the Midrash of Rabbi Tanchuma 2:3:4."}, {"ch": 8, "v": 18, "aliyah": 5, "heb": "וְהִפְלֵיתִי֩ בַיּ֨וֹם הַה֜וּא אֶת־אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּי֙ עֹמֵ֣ד עָלֶ֔יהָ לְבִלְתִּ֥י הֱיֽוֹת־שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהֹוָ֖ה בְּקֶ֥רֶב הָאָֽרֶץ׃", "onk": "וְאַפְרֵשׁ בְּיוֹמָא הַהוּא יָת אַרְעָא דְגשֶׁן דִּעַמִּי קָאִים עֲלַהּ בְּדִיל דְּלָא לְמֶהֱוֵי תַמָּן עָרוֹבָא בְּדִיל דְּתִדַּע אֲרֵי אֲנָא יְיָ <b>שַׁלִּיט<\/b> בְּגוֹ אַרְעָא:", "onk_en": "On that day, I will set apart the land of Goshen upon which My people stand [dwell], so that there will not be any wild animals there, so that you will know that I am Adonoy [<b>who rules<\/b>] in the midst of the earth.", "pj": "וְאֶעֱבֵיד פִּלְאִין בְּיוֹמָא הַהוּא עִם אַרְעָא דְגשֶׁן דְעַמִי שְׁרֵי עֲלָהּ בְּדִיל דְלָא לְמֶהֱוֵי תַמָן עִירְבּוּב חֵיוַת בָּרָא מִן בִּגְלַל דְתִנְדַע אַרוּם אֲנָא יְיָ שַׁלִיט בְּגוֹ אַרְעָא", "pj_en": "And I will do wonders that day in the land of Goshen where My people dwell, that there no swarms of wild beasts shall be; - that thou mayest know that I the Lord am the Ruler in the midst of the land.", "tj": "", "tj_en": "", "rashi": "<b>והפליתי.<\/b> וְהִפְרַשְׁתִּי, וְכֵן \"וְהִפְלָה ה'\" (שמות ט'), וְכֵן \"לֹא נִפְלֵאת הִיא מִמְּךָ\" (דברים ל') – לֹא מֻבְדֶּלֶת וּמֻפְרֶשֶׁת הִיא מִמְּךָ:<br><br><b>למען תדע כי אני ה' בקרב הארץ.<\/b> אַף עַל פִּי שֶׁשְּׁכִינָתִי בַּשָּׁמַיִם גְּזֵרָתִי מִתְקַיֶּמֶת בַּתַּחְתּוֹנִים:", "rashi_en": "והפליתי means I WILL SEPARATE. Similar is, (Exodus 9:4) “And the Lord will make a separation (והפלה)”; so, also, (Deuteronomy 30:11) “It is not נפלאת from thee״ — that is, “it is not separated and set at a far distance from thee”.<br><br>למען תדע כי אני ה׳ בקרב הארץ IN ORDER THAT THOU MAYEST KNOW THAT I AM THE ETERNAL IN THE MIDST OF THE EARTH — although My Shechina is in the heavens My command is fulfilled amongst mankind (as we might say, “My writ runs on earth also”)."}, {"ch": 8, "v": 19, "aliyah": 6, "heb": "וְשַׂמְתִּ֣י פְדֻ֔ת בֵּ֥ין עַמִּ֖י וּבֵ֣ין עַמֶּ֑ךָ לְמָחָ֥ר יִהְיֶ֖ה הָאֹ֥ת הַזֶּֽה׃", "onk": "וֶאֱשַׁוֵּי פוּרְקָן <b>לְ<\/b>עַמִּי <b>וְעַל<\/b> עַמָּךְ <b>אַיְתִי מָחָא<\/b> לִמְחָר יְהֵא אָתָא הָדֵין:", "onk_en": "I will set a [sign of] deliverance (distinction) between [<b>for<\/b>] My people and between [<b>but upon<\/b>] your people [<b>I will bring a plague<\/b>]. This sign will take place tomorrow.”", "pj": "וַאֲשַׁוֵי פּוּרְקַן לְעַמִי וְעַל עַמָךְ אַיְיתֵי מָחָא לְעִידַן מָחָר יְהֵי אָתָא הָדֵין", "pj_en": "And I will appoint redemption for My people, and upon thy people will I lay the plague: tomorrow this sign shall be.", "tj": "", "tj_en": "", "rashi": "<b>ושמתי פדת.<\/b> שֶׁיַּבְדִּיל בֵּין עַמִּי וּבֵין עַמְּךָ:", "rashi_en": "ושמתי פדות AND I WILL MAKE A DELIVERANCE which shall serve as a division BETWEEN MY PEOPLE AND THY PEOPLE."}, {"ch": 8, "v": 20, "aliyah": 6, "heb": "וַיַּ֤עַשׂ יְהֹוָה֙ כֵּ֔ן וַיָּבֹא֙ עָרֹ֣ב כָּבֵ֔ד בֵּ֥יתָה פַרְעֹ֖ה וּבֵ֣ית עֲבָדָ֑יו וּבְכׇל־אֶ֧רֶץ מִצְרַ֛יִם תִּשָּׁחֵ֥ת הָאָ֖רֶץ מִפְּנֵ֥י הֶעָרֹֽב׃", "onk": "וַעֲבַד יְיָ כֵּן וַאֲתָא עָרוֹבָא תַקִּיף לְבֵית פַּרְעֹה וּלְבֵית עַבְדּוֹהִי וּבְכָל אַרְעָא דְמִצְרַיִם אִתְחַבָּלַת אַרְעָא מִן קֳדָם עָרוֹבָא:", "onk_en": "Adonoy did so. Huge throngs of wild animals came to the house of Pharaoh and the houses of his servants. Throughout the whole land of Egypt the land was devastated by the wild animals.", "pj": "וְעָבַד יְיָ כֵּן וְאַיְיתֵי עִירְבּוּב חֵיוַת בָּרָא תַקִיף לְבֵית פַּרְעה וּלְבֵית עַבְדוֹי וּבְכָל אַרְעָא דְמִצְרַיִם אִיתְחַבִּילוּ יַתְבֵי אַרְעָא מִן קֳדָם עִירְבּוּב חֵיוַת בָּרָא", "pj_en": "And the Lord did so; and sent the mixed multitude of wild beasts in strength to the house of Pharoh, and to the house of his servants and in all the land of Mizraim the inhabitants of the land were devastated from the swarm of wild beasts.", "tj": "", "tj_en": "", "rashi": "<b>תשחת הארץ.<\/b> נִשְׁחֶתֶת הָאָרֶץ, אִתְחַבָּלַת אַרְעָא:", "rashi_en": "תשחת הארץ means the ground was being destroyed (the imperfect tense denotes what was then going on continuously), and so the Targum has אתחבלת ארעא (the participle) the ground was being ruined."}, {"ch": 8, "v": 21, "aliyah": 6, "heb": "וַיִּקְרָ֣א פַרְעֹ֔ה אֶל־מֹשֶׁ֖ה וּֽלְאַהֲרֹ֑ן וַיֹּ֗אמֶר לְכ֛וּ זִבְח֥וּ לֵאלֹֽהֵיכֶ֖ם בָּאָֽרֶץ׃", "onk": "וּקְרָא פַרְעֹה לְמשֶׁה וּלְאַהֲרֹן וַאֲמַר אֱזִילוּ דַּבָּחוּ <b>קֳדָם<\/b> אֱלָהֲכוֹן בְּאַרְעָא:", "onk_en": "Pharaoh called for Moshe and Aharon, and he said, “Go! Sacrifice to [<b>before<\/b>] your God [here] in the land.”", "pj": "וּקְרָא פַרְעה לְמשֶׁה וּלְאַהֲרן וַאֲמַר אִיזִילוּ פְּלָחוּ נִכְסַת חַגָא קֳדָם יְיָ אֱלָהָכוֹן בְּאַרְעָא הָדָא", "pj_en": "And Pharoh called to Mosheh and to Aharon., saying, Go, worship with festival sacrifices before the Lord your God in this land.", "tj": "", "tj_en": "", "rashi": "<b>זבחו לאלהיכם בארץ.<\/b> בִּמְקוֹמְכֶם וְלֹא תֵלְכוּ בַּמִּדְבָּר:", "rashi_en": "זבחו לאלהיכם בארץ SACRIFICE TO YOUR GOD IN THE LAND, in the place where you are, and do not go into the wilderness."}, {"ch": 8, "v": 22, "aliyah": 6, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַעֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַיהֹוָ֣ה אֱלֹהֵ֑ינוּ הֵ֣ן נִזְבַּ֞ח אֶת־תּוֹעֲבַ֥ת מִצְרַ֛יִם לְעֵינֵיהֶ֖ם וְלֹ֥א יִסְקְלֻֽנוּ׃", "onk": "וַאֲמַר משֶׁה לָא תַקֵּן לְמֶעְבַּד כֵּן אֲרֵי <b>בְעִירָא דְמִצְרָאֵי דָּחֲלִין לֵיהּ מִנֵּיהּ אֲנַחְנָא נָסְבִין לְדַבָּחָא קֳדָם<\/b> יְיָ אֱלָהָנָא <b>הָא נְדַבַּח יָת בְּעִירָא דְמִצְרָאֵי דָּחֲלִין לֵיהּ וְאִנּוּן יְהוֹן חָזָן הֲלָא יֵימְרוּן לְמִרְגְּמָנָא<\/b>:", "onk_en": "Moshe said, “It would not be proper to do so. For that which is abominable [sacred] to Egypt we intend to sacrifice to [<b>the animal that the Egyptians worship we are taking to sacrifice before<\/b>] Adonoy, our God. Could we sacrifice the abomination of the Egyptians before their eyes and not have them stone us? [<b>Behold, we will sacrifice the animal that the Egyptians worship, and they will see. Will they not want to stone us?<\/b>]", "pj": "וַאֲמַר משֶׁה לָא תַקִין לְמֶעֱבַד כֵּן אֲרוּם אִמְרַיָא דְהִינוּן טַעֲוַותְהוֹן דְמִצְרָאֵי מִנְהוֹן נִיסַב וְנִקְרְבָא קֳדָם יְיָ אֱלָהֵן הָא אִין מְקַרְבִין אֲנָן יַת טַעֲוַותְהוֹן דְמִצְרָאֵי קֳדָמֵיהוֹן הוּא מִן דִינָא הוּא לְאַטָלָא יָתָן בְּאַבְנִין", "pj_en": "But Mosheh said, It will not be right to do so; because we shall take sheep, which are the abomination of the Mizraee, and offer them before the Lord our God. Behold if we offer the abomination of the Mizraee before them, they would stone us with stones as an act of justice.", "tj": "", "tj_en": "", "rashi": "<b>תועבת מצרים.<\/b> יִרְאַת מִצְרַיִם, כְּמוֹ \"וּלְמִלְכֹּם תּוֹעֲבַת בְּנֵי עַמּוֹן\" (מלכים ב כ״ג:י״ג), וְאֵצֶל יִשְׂרָאֵל קוֹרֵא אוֹתָהּ תּוֹעֵבָה; וְעוֹד יֵשׁ לוֹמַר בְּלָשׁוֹן אַחֵר, <b>תועבת מצרים<\/b>, דָּבָר שָׂנאוּי הוּא לְמִצְרַיִם זְבִיחָה שֶׁאָנוּ זוֹבְחִים, שֶׁהֲרֵי יִרְאָתָם אָנוּ זוֹבְחִים:<br><br><b>ולא יסקלנו.<\/b> בִּתְמִיהָ:", "rashi_en": "תועבת מצרים THE ABOMINATION OF THE EGYPTIANS — This means: that which the Egyptians reverence (their idol), just as, (2 Kings 23:13) “and for Milcom the abomination (תועבת) of the children of Ammon”, but in relation to the Israelites it (Scripture) calls it תועבה. We may explain these words in another sense also: תועבת מצרים — The act of sacrifice which we practise is a hateful thing to the Egyptians seing that we sacrifice their god (sheep which were reverenced as gods in Egypt).<br><br>ולא יסקלנו — This must be read in the intonation of a question (although there is no interrogative prefix הֲ) AND WILL THEY NOT STONE US?"}, {"ch": 8, "v": 23, "aliyah": 6, "heb": "דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים נֵלֵ֖ךְ בַּמִּדְבָּ֑ר וְזָבַ֙חְנוּ֙ לַֽיהֹוָ֣ה אֱלֹהֵ֔ינוּ כַּאֲשֶׁ֖ר יֹאמַ֥ר אֵלֵֽינוּ׃", "onk": "מַהֲלַךְ תְּלָתָא יוֹמִין נֵיזִיל בְּמַדְבְּרָא וּנְדַבַּח <b>קֳדָם<\/b> יְיָ אֱלָהָנָא כְּמָא דִּיֵימַר לָנָא:", "onk_en": "We must make a three day trip into the wilderness, and sacrifice to [<b>before<\/b>] Adonoy, our God, in the manner that He will tell us.”", "pj": "מַהֲלַךְ תְּלָתָא יוֹמִין נְטַיֵיל בְּמַדְבְּרָא וּנְדַבַּח נִיכְסַת חַגָא קֳדָם אֱלָהָנָא הֵיכְמָא דְיֵימַר לָנָא", "pj_en": "We will go three days journey into the wilderness to offer the festival sacrifices before our God, as He hath bidden us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 24, "aliyah": 6, "heb": "וַיֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְכֶם֙ וּזְבַחְתֶּ֞ם לַיהֹוָ֤ה אֱלֹֽהֵיכֶם֙ בַּמִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא־תַרְחִ֖יקוּ לָלֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽי׃", "onk": "וַאֲמַר פַּרְעֹה אֲנָא אֲשַׁלַּח יָתְכוֹן וְתִדְבְּחוּן <b>קֳדָם<\/b> יְיָ אֱלָהֲכוֹן בְּמַדְבְּרָא לְחוֹד אַרְחָקָא לָא תְרַחֲקוּן לְמֵיזָל צַלּוֹ אַף עָלָי:", "onk_en": "Pharaoh, said, “I will send you out so that you may sacrifice to [<b>before<\/b>] Adonoy, your God in the wilderness, as long as you do not go too far away. Pray [<b>also<\/b>] for me.”", "pj": "וַאֲמַר פַּרְעה אֲנָא אֶפְטוֹר יַתְכוֹן וְתִדְבְּחוּן קֳדָם יְיָ אֱלָהָכוֹן בְּמַדְבְּרָא לְחוֹד אַרְחָקָא לָא תַרְחִיקוּן לְטַיְילָא צְלוֹ עָלָי", "pj_en": "And Pharoh said, I will release you to sacrifice before the Lord your God in the wilderness, only you shall not go to a greater distance. Pray, (too,) for me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 25, "aliyah": 6, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽעִמָּךְ֙ וְהַעְתַּרְתִּ֣י אֶל־יְהֹוָ֔ה וְסָ֣ר הֶעָרֹ֗ב מִפַּרְעֹ֛ה מֵעֲבָדָ֥יו וּמֵעַמּ֖וֹ מָחָ֑ר רַ֗ק אַל־יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְבִלְתִּי֙ שַׁלַּ֣ח אֶת־הָעָ֔ם לִזְבֹּ֖חַ לַֽיהֹוָֽה׃", "onk": "וַאֲמַר משֶׁה הָא אֲנָא נָפֵק מֵעִמָּךְ וֶאֱצַלֵּי קֳדָם יְיָ וְיַעְדֵּי עָרוֹבָא מִפַּרְעֹה מֵעַבְדּוֹהִי וּמֵעַמֵּיהּ מְחָר לְחוֹד לָא יוֹסֵף פַּרְעֹה לְשַׁקָּרָא בְּדִיל דְּלָא לְשַׁלָּחָא יָת עַמָּא לְדַבָּחָא קֳדָם יְיָ:", "onk_en": "Moshe said, “Behold, when I leave your presence I will pray to [<b>before<\/b>] Adonoy, and the wild animals will depart from Pharaoh, and from his servants and from his people, tomorrow. But let Pharaoh never again deceive us [by] refusing to send the people to sacrifice to [<b>before<\/b>] Adonoy.”", "pj": "וַאֲמַר משֶׁה הָא אֲנָא נָפִיק מִלְוָתָךְ וְאֵיצַלֵי קֳדָם יְיָ וְיַעְדֵי עִרְבּוּב חֵיוַת בָּרָא מִן פַּרְעה וּמִן עַמֵיהּ לִמְחַר לְחוֹד לָא יוֹסֵף פַּרְעה לִמְשַׁקְרָא בְּדִיל דְלָא לְמִפְטוֹר יַת עַמָא לִמְדַבְּחָא נִכְסַת חַגָא קֳדָם יְיָ", "pj_en": "And Mosheh said, I will go forth from thee, and pray before the Lord to remove the swarm of wild beasts from Pharoh, and from his servants, and from his people, tomorrow; only let not Pharoh add to deceive, in not releasing the people to offer the festal sacrifices before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>התל.<\/b> כְּמוֹ לְהָתֵל:", "rashi_en": "התל is the same as להתל (i. e. the infinitive may be used with or without ל prefixed)."}, {"ch": 8, "v": 26, "aliyah": 6, "heb": "וַיֵּצֵ֥א מֹשֶׁ֖ה מֵעִ֣ם פַּרְעֹ֑ה וַיֶּעְתַּ֖ר אֶל־יְהֹוָֽה׃", "onk": "וּנְפַק משֶׁה מִן קֳדָם פַּרְעֹה וְצַלִּי קֳדָם יְיָ:", "onk_en": "Moshe went out from Pharaoh[’s presence] and prayed to [<b>before<\/b>] Adonoy.", "pj": "וּנְפַק משֶׁה מִלְוַת פַּרְעה וְצַלִי קֳדָם יְיָ", "pj_en": "And Mosheh went out from Pharoh, and prayed before the Lord;", "tj": "", "tj_en": "", "rashi": "<b>ויעתר אל ה'.<\/b> נִתְאַמֵּץ בִּתְפִלָּה, וְכֵן אִם בָּא לוֹמַר וַיַּעְתִּיר, הָיָה יָכוֹל לוֹמַר, וּמַשְׁמָע וַיַּרְבֶּה בִּתְפִלָּה, וּכְשֶׁהוּא אוֹמֵר בִּלְשׁוֹן וַיִּפְעַל, מַשְׁמָע וַיִּרְבֶּה לְהִתְפַּלֵּל:", "rashi_en": "ויעתר אל ה׳ AND ENTREATED THE LORD (the verb is the Kal) — he concentrated his energies on prayer. So, too, if it had wished to use the term וַיַעְתִּיר (the Hiphil) it could have used it, and that would have signified, “and he increased words in prayer”. But when it uses an expression denoting “and he did something” (the Kal) it signifies “he prayed much (devoutly)”."}, {"ch": 8, "v": 27, "aliyah": 6, "heb": "וַיַּ֤עַשׂ יְהֹוָה֙ כִּדְבַ֣ר מֹשֶׁ֔ה וַיָּ֙סַר֙ הֶעָרֹ֔ב מִפַּרְעֹ֖ה מֵעֲבָדָ֣יו וּמֵעַמּ֑וֹ לֹ֥א נִשְׁאַ֖ר אֶחָֽד׃", "onk": "וַעֲבַד יְיָ כְּפִתְגָּמָא דְמשֶׁה וְאַעְדִּי עָרוֹבָא מִפַּרְעֹה מֵעַבְדּוֹהִי וּמֵעַמֵּיהּ לָא אִשְׁתָּאַר חָד:", "onk_en": "Adonoy did as Moshe spoke [requested]. He caused the wild animals to depart from Pharaoh from his servants and from his people. Not a single one remained.", "pj": "וַעֲבַד יְיָ כְּפִתְגַם בְּעוּתָא דְמשֶׁה וְאַעֲדֵי עִירְבּוּב חֵיוַת בָּרָא מִפַּרְעה וּמֵעַבְדוֹי וּמֵעַמֵיהּ לָא אִשְׁתְּאַר חָד", "pj_en": "and the Lord did according to the word of the prayer of Mosheh, and removed the swarm of wild beasts from Pharoh, and from his servants, and from his people; not one was left.", "tj": "", "tj_en": "", "rashi": "<b>ויסר הערב.<\/b> וְלֹא מֵתוּ כְּמוֹ שֶׁמֵּתוּ הַצְפַרְדְּעִים, שֶׁאִם מֵתוּ הָיָה לָהֶם הֲנָאָה בְּעוֹרוֹתָם (תנחומא):", "rashi_en": "ויסר הערב AND HE REMOVED THE SWARM OF ANIMALS — He merely removed them and they did not die as the frogs had died; for had they died, they (the Egyptians) could have made some use of their skins (Exodus Rabbah 11:3)."}, {"ch": 8, "v": 28, "aliyah": 6, "heb": "וַיַּכְבֵּ֤ד פַּרְעֹה֙ אֶת־לִבּ֔וֹ גַּ֖ם בַּפַּ֣עַם הַזֹּ֑את וְלֹ֥א שִׁלַּ֖ח אֶת־הָעָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַקַּר פַּרְעֹה יָת לִבֵּיהּ אַף בְּזִמְנָא הָדָא וְלָא שַׁלַּח יָת עַמָּא:", "onk_en": "But Pharaoh hardened his heart again, this time and he did not send out the people.", "pj": "וִיקַר פַּרְעה יַת יִצְרָא דְלִבֵּיהּ אוּף בְּזִמְנָא הָדָא וְלָא פְּטַר יַת עַמָא", "pj_en": "Yet did Pharoh strengthen the design of his heart this time also, and released not the people.", "tj": "", "tj_en": "", "rashi": "<b>גם בפעם הזאת. <\/b>אע\"פ שאמר אנכי אשלח אתכם, לא קיים הבטחתו: ", "rashi_en": "<b>Again this time.<\/b> [Once more,] though he said, “I will send you out,” he did not keep his promise. "}, {"ch": 9, "v": 1, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה בֹּ֖א אֶל־פַּרְעֹ֑ה וְדִבַּרְתָּ֣ אֵלָ֗יו כֹּֽה־אָמַ֤ר יְהֹוָה֙ אֱלֹהֵ֣י הָֽעִבְרִ֔ים שַׁלַּ֥ח אֶת־עַמִּ֖י וְיַֽעַבְדֻֽנִי׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עוּל לְוָת פַּרְעֹה וּתְמַלֵּל עִמֵּיהּ כִּדְנַן אֲמַר יְיָ אֱלָהָא דִיהוּדָאֵי שַׁלַּח יָת עַמִּי וְיִפְלְחוּן <b>קֳדָמָי<\/b>:", "onk_en": "Adonoy said to Moshe, “Go to Pharaoh and say to him, ‘This is what Adonoy, God of the Hebrews has said, Send out My people and let them serve [<b>before<\/b>] Me.", "pj": "וַאֲמַר יְיָ לְמשֶׁה עוּל לְוַת פַּרְעה וּתְמַלֵיל עִמֵיהּ כִּדְנַן אָמַר יְיָ אֱלָהָא דִיהוּדָאֵי פְּטוֹר יַת עַמִי וְיִפְלְחוּן קֳדָמַי", "pj_en": "And the Lord said to Mosheh, Go in to Pharoh, and say to him, Thus saith the Lord, the God of the Jehudaee, Emancipate My people, that they may worship before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 2, "aliyah": 6, "heb": "כִּ֛י אִם־מָאֵ֥ן אַתָּ֖ה לְשַׁלֵּ֑חַ וְעוֹדְךָ֖ מַחֲזִ֥יק בָּֽם׃", "onk": "אֲרֵי אִם סָרִיב אַתְּ לְשַׁלָּחָא וְעַד כְּעַן אַתְּ מַתְקֵף בְּהוֹן:", "onk_en": "For if you refuse to send them out, and continue holding them;", "pj": "אֲרוּם אִין מְסָרֵב אַנְתְּ לְמִפְטוֹר וְעַד כְּדוֹן אַנְתְּ מַתְקִיף בְּהוֹן", "pj_en": "But if thou refuse to release, and hitherto thou hast constrained them,", "tj": "", "tj_en": "", "rashi": "<b>מחזיק בם.<\/b> אוֹחֵז בָּם, כְּמוֹ \"וְהֶחֱזִיקָה בִּמְבֻשָׁיו\" (דברים כ\"ה):", "rashi_en": "מחזיק בם means WILT KEEP HOLD OF THEM, as in, (Deuteronomy 25:11) “and layeth hold of him etc. (...והחזיקה ב)”."}, {"ch": 9, "v": 3, "aliyah": 6, "heb": "הִנֵּ֨ה יַד־יְהֹוָ֜ה הוֹיָ֗ה בְּמִקְנְךָ֙ אֲשֶׁ֣ר בַּשָּׂדֶ֔ה בַּסּוּסִ֤ים בַּֽחֲמֹרִים֙ בַּגְּמַלִּ֔ים בַּבָּקָ֖ר וּבַצֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד׃", "onk": "הָא <b>מָחָא מִן קֳדָם<\/b> יְיָ הָוְיָא בִּבְעִירָךְ דִּבְחַקְלָא בְּסוּסָוָתָא בַּחֲמָרֵי בְּגַמְלֵי בְּתוֹרֵי וּבְעָנָא מוֹתָא תַּקִּיף לַחֲדָא:", "onk_en": "behold, the hand of [<b>a plague from before<\/b>] Adonoy is directed at your livestock that are in the field—upon the horses, the donkeys, the camels, the cattle and the sheep—there will be a very heavy [serious] plague.", "pj": "הָא מְחַת יְדָא דַיְיָ הַוְיָא כְּעַן כַּד לָא הֲוַת לְמֶהֱוֵי בִּבְעִירָךְ דִבְחַקְלָא בְּסוּסְוָותָא בְּחַמְרֵי בִּגְמַלֵי בְּתוֹרֵי וּבְעָנָא מוֹתָא תַקִיף לַחֲדָא", "pj_en": "behold, the stroke of the Lord's hand shall be as it hath not been yet, upon thy cattle that are in the field, upon the horses, and upon the asses, upon the camels, oxen, and sheep, with a very mighty death.", "tj": "מִתְגַרְיָא לְחוֹד:", "tj_en": "Great conturbation.", "rashi": "<b>הנה יד ה' הויה.<\/b> לְשׁוֹן הֹוֶה, כִּי כֵן יֹאמַר בִּלְשׁוֹן נְקֵבָה עַל שֶׁעָבַר הָיְתָה, וְעַל הֶעָתִיד תִּהְיֶה, וְעַל הָעוֹמֵד הוֹיָה, כְּמוֹ עוֹשָׂה, רוֹצָה, רוֹעָה:", "rashi_en": "‎הנה יד ה׳ הוֹיָה BEHOLD THE HAND OF THE LORD IS — The verb הויה is in the present tense, for so one says in the feminine gender of the past היתה, “she was”, of the future, תהיה, “she will be” and of the present, הוֹיָה, the latter form being similar to עוֹשָׂה and רוֹצָה and רוֹעָה (Fem. part. sing. Kal of ל\"ה verbs)."}, {"ch": 9, "v": 4, "aliyah": 6, "heb": "וְהִפְלָ֣ה יְהֹוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּבֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְלֹ֥א יָמ֛וּת מִכׇּל־לִבְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר׃", "onk": "וְאַפְרֵשׁ יְיָ בֵּין בְּעִירָא דְיִשְׂרָאֵל וּבֵין בְּעִירָא דְמִצְרָיִם וְלָא יְמוּת מִכָּל לִבְנֵי יִשְׂרָאֵל מִדָּעַם:", "onk_en": "Adonoy will distinguish between the livestock of the [B’nei] Yisrael and the livestock of Egypt. None belonging to the B’nei Yisrael will die.’”", "pj": "וְיַעֲבֵד יְיָ פִּלְאִין בֵּין גֵיתֵי דְיִשְרָאֵל וּבֵין גֵיתֵי דְמִצְרָאֵי וְלָא יְמוּת מִכָּל לִבְנֵי יִשְרָאֵל מִדָעַם", "pj_en": "And the Lord will work wonders between the flocks of Israel and the flocks of the Mizraee, that not any of those which belong to the sons of Israel shall die.", "tj": "", "tj_en": "", "rashi": "<b>והפלה.<\/b> וְהִבְדִּיל:", "rashi_en": "והפלה means HE WILL SEPARATE."}, {"ch": 9, "v": 5, "aliyah": 6, "heb": "וַיָּ֥שֶׂם יְהֹוָ֖ה מוֹעֵ֣ד לֵאמֹ֑ר מָחָ֗ר יַעֲשֶׂ֧ה יְהֹוָ֛ה הַדָּבָ֥ר הַזֶּ֖ה בָּאָֽרֶץ׃", "onk": "וְשַׁוִּי יְיָ זִמְנָא לְמֵימָר מְחַר יַעְבֵּד יְיָ פִּתְגָּמָא הָדֵין בְּאַרְעָא:", "onk_en": "Adonoy has set a time, saying, Tomorrow Adonoy will do this thing in the land.", "pj": "וּקְבַע יְיָ זִמְנָא לְמֵימָר מְחָר יַעֲבֵיד יְיָ יַת פִּתְגָמָא הָדֵין בְּאַרְעָא", "pj_en": "And the Lord set a time, saying, Tomorrow will the Lord do this thing in the land.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 6, "aliyah": 6, "heb": "וַיַּ֨עַשׂ יְהֹוָ֜ה אֶת־הַדָּבָ֤ר הַזֶּה֙ מִֽמׇּחֳרָ֔ת וַיָּ֕מׇת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּמִמִּקְנֵ֥ה בְנֵֽי־יִשְׂרָאֵ֖ל לֹא־מֵ֥ת אֶחָֽד׃", "onk": "וַעֲבַד יְיָ יָת פִּתְגָּמָא הָדֵין בְּיוֹמָא דְבַתְרוֹהִי וּמִית כֹּל בְּעִירָא דְמִצְרָיִם וּמִבְּעִירָא דִבְנֵי יִשְׂרָאֵל לָא מִית חָד:", "onk_en": "Adonoy did this thing on the next day, and all the livestock in Egypt died, but of the livestock of the B’nei Yisrael, not one died.", "pj": "וַעֲבַד יְיָ יַת פִּתְגָמָא הָדֵין לְיוֹם חֲרָן וּמִית כָּל בְּעִירָא דְמִצְרָאֵי וּמִבְּעִירָא דִבְנֵי יִשְרָאֵל לָא מִית חָד", "pj_en": "And the Lord did that thing the day after, and all the cattle of the Mizraee died; but of the cattle of the sons of Israel died not one.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 7, "aliyah": 6, "heb": "וַיִּשְׁלַ֣ח פַּרְעֹ֔ה וְהִנֵּ֗ה לֹא־מֵ֛ת מִמִּקְנֵ֥ה יִשְׂרָאֵ֖ל עַד־אֶחָ֑ד וַיִּכְבַּד֙ לֵ֣ב פַּרְעֹ֔ה וְלֹ֥א שִׁלַּ֖ח אֶת־הָעָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּשְׁלַח פַּרְעֹה וְהָא לָא מִית מִבְּעִירָא דְיִשְׂרָאֵל עַד חָד וְאִתְיַקַּר לִבָּא דְפַרְעֹה וְלָא שַׁלַּח יָת עַמָּא:", "onk_en": "Pharaoh sent [scouts] and behold not a single animal of the B’nei Yisrael died. The heart of Pharaoh remained hard and he did not send out the people.", "pj": "וְשָׁדַר פַּרְעה פּוּלִין לְמֶחֱמֵי וְהָא לָא מִית מִבְּעִירָא דִבְנֵי יִשְרָאֵל עַד חָד וְאִתְיַיקַר יִצְרָא דְלִבָּא דְפַרְעה וְלָא פְטַר יַת עַמָא", "pj_en": "And Pharoh sent certain to look; and, behold, not one of the cattle of the sons of Israel had died, not even one. But the disposition of Pharoh, heart was aggravated, and he would not release the people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 8, "aliyah": 6, "heb": "וַיֹּ֣אמֶר יְהֹוָה֮ אֶל־מֹשֶׁ֣ה וְאֶֽל־אַהֲרֹן֒ קְח֤וּ לָכֶם֙ מְלֹ֣א חׇפְנֵיכֶ֔ם פִּ֖יחַ כִּבְשָׁ֑ן וּזְרָק֥וֹ מֹשֶׁ֛ה הַשָּׁמַ֖יְמָה לְעֵינֵ֥י פַרְעֹֽה׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרֹן סִיבוּ לְכוֹן מְלֵי חָפְנֵיכוֹן פִּיחָא דְאַתּוּנָא וְיִזְרְקִנֵּיהּ משֶׁה לְצֵית שְׁמַיָּא לְעֵינֵי פַרְעֹה", "onk_en": "Adonoy spoke to Moshe and Aharon, “Both of you take full handfuls of furnace soot and let Moshe throw it heavenward before the eyes of Pharaoh.", "pj": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרן סִיבוּ לְכוֹן מָלֵי חוּפְנֵיכוֹן קְטַם דְקִיק מִן אַתּוּנָא וְיִדְרְקִינֵיהּ משֶׁה לְצֵית שְׁמַיָא לְמֶיחֱמֵי פַרְעה", "pj_en": "And the Lord said to Mosheh and to Aharon, Take with you hands-full of fine ashes from the furnace, and let Mosheh sprinkle them towards the height of the heavens in the sight of Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>מלא חפניכם.<\/b> ילויני\"ש בְּלַעַז:<br><br><b>פיח כבשן.<\/b> דָּבָר הַנִּפָּח מִן הַגֶּחָלִים עֲמוּמִים הַנִּשְׂרָפִים בַּכִּבְשָׁן, וּבְלַעַז אולבי\"ש:<br><br><b>פיח.<\/b> לְשׁוֹן הֲפָחָה, שֶׁהָרוּחַ מְפִיחָן וּמַפְרִיחָן:<br><br><b>וזרקו משה.<\/b> וְכָל דָּבָר הַנִּזְרָק בְּכֹחַ, אֵינוֹ נִזְרָק אֶלָּא בְיַד אַחַת, הֲרֵי נִסִּים הַרְבֵּה – אֶחָד שֶׁהֶחֱזִיק קֻמְצוֹ שֶׁל מֹשֶׁה מְלֹא חָפְנַיִם שֶׁלּוֹ וְשֶׁל אַהֲרֹן, וְאֶחָד שֶׁהָלַךְ הָאָבָק עַל כָּל אֶרֶץ מִצְרַיִם (תנחומא):", "rashi_en": "מלא חפניכם HANDFULS (more lit., as much as will fill your fists), old French joincheiz; Engl, double-handfuls.<br><br>פיח הכבשן SOOT OF THE FURNACE — the word פיח denotes a thing which is blown away (נפוח) from coals that have become extinguished after being burnt in a furnace; in old French oulvis.<br><br>פיח is derived from a root that signifies blowing, and it so called because the wind blows it about and scatters it abroad.<br><br>וזרקו משה AND LET MOSES THREW IT — Since anything which is thrown with force must be thrown with one hand only, there were here several miracles: one, that Moses’ closed fingers (קמץ) held as much as would fill his two fists and those of Aaron, and another, that this dust spread itself over the entire land of Egypt (Midrash Tanchuma, Vaera 14; Exodus Rabbah 11:8)."}, {"ch": 9, "v": 9, "aliyah": 6, "heb": "וְהָיָ֣ה לְאָבָ֔ק עַ֖ל כׇּל־אֶ֣רֶץ מִצְרָ֑יִם וְהָיָ֨ה עַל־הָאָדָ֜ם וְעַל־הַבְּהֵמָ֗ה לִשְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וִיהֵי לְאַבְקָא עַל כָּל אַרְעָא דְמִצְרָיִם וִיהֵי עַל אֲנָשָׁא וְעַל בְּעִירָא לְשִׁיחֲנָא סַגִּי אֲבַעְבֻּעִין בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "It will become a fine dust [and settle] over the whole land of Egypt. It will settle on man and beast causing a rash which will break out into boils [affecting] the whole land of Egypt.”", "pj": "וִיהֵי לְאַבְקָא עַל כָּל אַרְעָא דְמִצְרָיִם וִיהֵי עַל אֱנָשָׁא וְעַל בְּעִירָא לִשְׁחִין סַגִי שַׁלְפוּקִין בְּכָל אַרְעָא דְמִצְרָיִם", "pj_en": "And the dust shall be upon all the land of Mizraim, upon man and upon beast, for a boil, producing tumours in all the land of Mizraim", "tj": "שַּׁלְבוּקִין:", "tj_en": "Tumours.", "rashi": "<b>לשחין פרח אבעבעת.<\/b> כְּתַרְגּוּמוֹ, לְֹשִׁיחֲנָא סָגֵי אֲבַעְבּוּעִין, שֶׁעַל יָדוֹ צוֹמְחִין בָּהֶן בּוּעוֹת:<br><br><b>שחין.<\/b> לְשׁוֹן חֲמִימוּת; וְהַרְבֵּה יֵשׁ בִּלְשׁוֹן מִשְׁנָה, \"שָׁנָה שְׁחוּנָה\" (יומא נ\"ג):", "rashi_en": "לשחין פרח אבעבעת A BOIL BREAKING FORTH INTO BLAINS — Render it as the Targum does: a boil growing blains, — the idea is, that through it (the boil) blains burst out on them (on the people).<br><br>שחין has the meaning of “heat”. In the Mishnaic Hebrew there are many examples of its use; e. g., (Yoma 53b) “a hot (שחונה) year”."}, {"ch": 9, "v": 10, "aliyah": 6, "heb": "וַיִּקְח֞וּ אֶת־פִּ֣יחַ הַכִּבְשָׁ֗ן וַיַּֽעַמְדוּ֙ לִפְנֵ֣י פַרְעֹ֔ה וַיִּזְרֹ֥ק אֹת֛וֹ מֹשֶׁ֖ה הַשָּׁמָ֑יְמָה וַיְהִ֗י שְׁחִין֙ אֲבַעְבֻּעֹ֔ת פֹּרֵ֕חַ בָּאָדָ֖ם וּבַבְּהֵמָֽה׃", "onk": "וּנְסִיבוּ יָת פִּיחָא דְאַתּוּנָא וְקָמוּ קֳדָם פַּרְעֹה וּזְרַק יָתֵיהּ משֶׁה לְצֵית שְׁמַיָּא וַהֲוָה שִׁיחֲנָא אֲבַעְבֻּעִין סָגֵי בַּאֲנָשָׁא וּבִבְעִירָא:", "onk_en": "They took the furnace soot and stood before Pharaoh. Moshe threw it heavenward, and it caused a rash which broke into boils in man and beast.", "pj": "וּנְסִיבוּ יַת קִיטְמָא דְאַתּוּנָא וְקָמוּ לִקְדָם פַּרְעה וּדְרַק יָתֵיהּ משֶׁה לְצֵית שְׁמַיָא וַהֲוָה שְׁחִין שַׁלְפוּקִין סַגִי בְּאֵינָשָׁא וּבִבְעִירָא", "pj_en": "And they took ashes of the furnace, and arose to meet Pharoh; and Mosheh sprinkled them towards the height of the heavens; and there came a boil multiplying tumours upon man and beast.", "tj": "", "tj_en": "", "rashi": "<b>באדם ובבהמה.<\/b> וְאִם תֹּאמַר מֵאַיִן הָיוּ לָהֶם הַבְּהֵמוֹת, וַהֲלֹא כְּבָר נֶאֱמַר וַיָּמָת כֹּל מִקְנֵה מִצְרָיִם? לֹא נִגְזְרָה גְזֵרָה אֶלָּא עַל אוֹתָן שֶׁבַּשָּׂדוֹת בִּלְבַד, שֶׁנֶּאֱמַר בְּמִקְנְךָ אֲשֶׁר בַּשָּׂדֶה, וְהַיָּרֵא אֶת דְּבַר ה' הִכְנִיס אֶת מִקְנֵהוּ אֶל הַבָּתִּים, כֵּן שְׁנוּיָה בִּמְכִילְתָּא אֵצֶל \"וַיִּקַּח שֵׁשׁ מֵאוֹת רֶכֶב בָּחוּר\" (שמות י\"ד):", "rashi_en": "באדם ובבהמה UPON MAN AND UPON CATTLE — If you ask, “Whence did they obtain these cattle”? Has it not already been stated, (v. 6) “And all the cattle of Egypt died”? I reply that this judgment was decreed only against the cattle that were in the fields, as it is said, (v. 3) “[The hand of the Lord is] upon thy cattle which is in the field”, and everyone who feared the Lord took his cattle in-doors. So it is taught in the Mechilta in the comment on (Exodus 14:7) “And he took six hundred chosen chariots.”"}, {"ch": 9, "v": 11, "aliyah": 6, "heb": "וְלֹֽא־יָכְל֣וּ הַֽחַרְטֻמִּ֗ים לַעֲמֹ֛ד לִפְנֵ֥י מֹשֶׁ֖ה מִפְּנֵ֣י הַשְּׁחִ֑ין כִּֽי־הָיָ֣ה הַשְּׁחִ֔ין בַּֽחַרְטֻמִּ֖ם וּבְכׇל־מִצְרָֽיִם׃", "onk": "וְלָא יָכִילוּ חָרָשַׁיָּא לְמֵיקָם קֳדָם משֶׁה מִין קֳדָם שִׁיחֲנָא אֲרֵי הֲוָה שִׁיחֲנָא בְּחָרָשַׁיָּא וּבְכָל מִצְרָאֵי:", "onk_en": "The sorcerers could not stand before Moshe as a result of the rash, for the rash affected the sorcerers as well as all of Egypt.", "pj": "וְלָא יָכִילוּ אִיסְטַגְנִינַיָא לְמֵיקַם קֳדָם משֶׁה מִן קֳדָם שִׁיחְנָא אֲרוּם הֲוָה מְחַת שִׁיחְנָא בְּאִיסְטַגְנִינַיָא וּבְכָל מִצְרָאֵי", "pj_en": "And the astrologers could not stand before Mosheh, on account of the boil; for the plague of the boil was upon the astrologers, and upon all the Mizraee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 12, "aliyah": 6, "heb": "וַיְחַזֵּ֤ק יְהֹוָה֙ אֶת־לֵ֣ב פַּרְעֹ֔ה וְלֹ֥א שָׁמַ֖ע אֲלֵהֶ֑ם כַּאֲשֶׁ֛ר דִּבֶּ֥ר יְהֹוָ֖ה אֶל־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתַקִּיף יְיָ יָת לִבָּא דְפַרְעֹה וְלָא <b>קַבִּיל<\/b> מִנְּהוֹן כְּמָא דְּמַלֵּיל יְיָ עִם משֶׁה:", "onk_en": "Adonoy caused Pharaoh’s heart to remain hard and he did not listen to [<b>accept<\/b>] them just as Adonoy had spoken to Moshe.", "pj": "וּתְקֵיף יְיָ יַת יִצְרָא דְלִבָּא דְפַרְעה וְלָא קַבֵּיל מִנְהוֹן הֵיכְמָא דְמַלֵיל יְיָ עִם משֶׁה", "pj_en": "And the Lord hardened the design of Pharoh's heart, and he would not hearken to them, as the Lord had said to Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 13, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּבֹּ֔קֶר וְהִתְיַצֵּ֖ב לִפְנֵ֣י פַרְעֹ֑ה וְאָמַרְתָּ֣ אֵלָ֗יו כֹּֽה־אָמַ֤ר יְהֹוָה֙ אֱלֹהֵ֣י הָֽעִבְרִ֔ים שַׁלַּ֥ח אֶת־עַמִּ֖י וְיַֽעַבְדֻֽנִי׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אַקְדֵּם בְּצַפְרָא וְאִתְעַתַּד קֳדָם פַּרְעֹה וְתֵימַר לֵיהּ כִּדְנַן אֲמַר יְיָ אֱלָהָא דִיהוּדָאֵי שַׁלַּח יָת עַמִּי וְיִפְלְחוּן <b>קֳדָמָי<\/b>:", "onk_en": "Adonoy said to Moshe, “Rise early in the morning and stand before Pharaoh, and say to him, ‘This is what Adonoy, God of the Hebrews, has said, “Send out My people and let them serve [<b>before<\/b>] Me.", "pj": "וַאֲמַר יְיָ לְמשֶׁה אַקְדֵים בְּצַפְרָא וְתִתְעַתַּד קֳדָם פַּרְעה וְתֵימַר לֵיהּ כִּדְנָא אָמַר יְיָ אֱלָהָא דִיהוּדָאֵי פְּטוֹר יַת עַמִי וְיִפְלְחוּן קֳדָמַי", "pj_en": "And the Lord said to Mosheh, Arise in the morning, and place thyself before Pharoh, and say to him, Thus saith the Lord, the God of the Jehudaee, Emancipate My people, that they may worship before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 14, "aliyah": 6, "heb": "כִּ֣י&thinsp;<b>׀<\/b> בַּפַּ֣עַם הַזֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת־כׇּל־מַגֵּפֹתַי֙ אֶֽל־לִבְּךָ֔ וּבַעֲבָדֶ֖יךָ וּבְעַמֶּ֑ךָ בַּעֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖נִי בְּכׇל־הָאָֽרֶץ׃", "onk": "אֲרֵי בְּזִמְנָא הָדָא אֲנָא שָׁלַח יָת כָּל מְחָתַי לְלִבָּךְ וּבְעַבְדָּיךְ וּבְעַמָּךְ בְּדִיל דְּתִדַּע אֲרֵי לֵית דִּכְוָתִי <b>שַׁלִּיט<\/b> בְּכָל אַרְעָא:", "onk_en": "For this time, I will send all My plagues against your [very] heart. [They will strike] your servants and your people, so that you will know that there is none like Me[<b>, a ruler<\/b>] in all the earth.", "pj": "אַרוּם בְּזִימְנָא הָדָא אֲנָא שַׁלַח מַחְתָּא לָךְ מִן שְׁמַיָא וְתָתֵיב יַת כָּל מַחֲתַי דִמְחִיתָךְ לְלִבָּךְ וּבְעַבְדָךְ וּבְעַמָךְ דְמִן קֳדָמַי הַוָון מִשְׁתַּלְחוּן וְלָא מִן חַרְשְׁיוּתָא דִבְנֵי נְשָׁא בְּגִין דְתִנְדַע אֲרוּם לֵית דְדָמַי לִי בְכָל אַרְעָא", "pj_en": "For at this time I will send upon thee a plague from the heavens, and all My plagues Wherewith I have plagued thee thou wilt cause to return upon thy heart, and upon thy servants, and upon thy people, (plagues) which have been sent from before Me, and not from the magic of the sons of men, that thou mayest know that there is none like Me in all the earth.", "tj": "", "tj_en": "", "rashi": "<b>את כל מגפתי.<\/b> לָמַדְנוּ מִכָּאן שֶׁמַּכַּת בְּכוֹרוֹת שְׁקוּלָה כְּנֶגֶד כָּל הַמַּכּוֹת:", "rashi_en": "את כל מגפתי [FOR I WILL THIS TIME SEND] ALL MY PLAGUES — We may gather from this that the plague on the first ripe ears outweighed all the previous plagues."}, {"ch": 9, "v": 15, "aliyah": 6, "heb": "כִּ֤י עַתָּה֙ שָׁלַ֣חְתִּי אֶת־יָדִ֔י וָאַ֥ךְ אוֹתְךָ֛ וְאֶֽת־עַמְּךָ֖ בַּדָּ֑בֶר וַתִּכָּחֵ֖ד מִן־הָאָֽרֶץ׃", "onk": "אֲרֵי כְעַן <b>קְרֵיב קֳדָמַי דְּאֶשְׁלַח פּוֹן יָת מַחַת גְּבֻרְתִּי<\/b> וְאֶמְחֵי יָתָךְ וְיָת עַמָּךְ בְּמוֹתָא וְשֵׁיצִיאַת מִן אַרְעָא:", "onk_en": "For now [<b>had I wanted to<\/b>] I [could] have extended My hand [<b>sent the plague of My strength<\/b>], and struck you and your people with the pestilence, and you would have been obliterated from the earth.", "pj": "אֲרוּם כְּדוֹן שַׁדָרִית יַת מְחַת גְבוּרְתִּי מִן דִינָא הוּא דְמָחִיתִי יָתָךְ וְיַת עַמָךְ בְּמוֹתָא וְאִישְׁתֵּצִית מִן אַרְעָא", "pj_en": "Now could I send the plague of My strength by judgment (or, with justice) to strike thee and thy people with death, and destroy thee from the earth;", "tj": "", "tj_en": "", "rashi": "<b>כי עתה שלחתי את ידי וגו'.<\/b> כִּי אִלּוּ רָצִיתִי, כְּשֶׁהָיְתָה יָדִי בְמִקְנְךָ שֶׁהִכִּיתִים בַּדֶּבֶר, שְׁלַחְתִּיהָ וְהִכֵּיתִי <b>אותך ואת עמך<\/b> עִם הַבְּהֵמוֹת, <b>ותכחד מן הארץ<\/b>, אֲבָל <b>בעבור זאת העמדתיך וגו'<\/b>:", "rashi_en": "כי עתה שלחתי את ידי וגו׳ FOR NOW I MIGHT HAVE STRETCHED OUT MY HAND etc. — For had I so desired it, when My hand was upon thy cattle which I smote with pestilence I could have stretched it forth and smitten thee and thy people together with the cattle, ותכחד מן הארץ AND THOU WOULDST HAVE BEEN EXTERMINATED FROM THE EARTH, BUT (this word אבל corresponds to ואולם in the Hebrew text) בעבור זאת העמדתיך FOR THIS REASON I MADE THEE REMAIN [IN LIFE IN ORDER TO SHOW THEE MY POWER], etc."}, {"ch": 9, "v": 16, "aliyah": 6, "heb": "וְאוּלָ֗ם בַּעֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔יךָ בַּעֲב֖וּר הַרְאֹתְךָ֣ אֶת־כֹּחִ֑י וּלְמַ֛עַן סַפֵּ֥ר שְׁמִ֖י בְּכׇל־הָאָֽרֶץ׃", "onk": "וּבְרַם בְּדִיל דָּא קַיֵּמִתָּךְ בְּדִיל לְאַחֲזָיוּתָךְ יָת חֵילִי וּבְדִיל דִּיהוֹן מִשְׁתָּעַן <b>גְּבוּרַת שְׁמִי<\/b> בְּכָל אַרְעָא:", "onk_en": "Nevertheless, for this reason I have let you survive—to show you My strength—so that [<b>the strength of<\/b>] My Name will be declared throughout all the earth.", "pj": "וּבְרַם בְּקוּשְׁטָא לָא מִן בִּגְלַל דִי נְטַיְיבָא לָךְ קְיַימְתִּיךְ אֶלָא מִן בִּגְלַל לִמְחַזְיָךְ יַת חֵילִי וּמִן בִּגְלַל דְתִתְגֵי שְׁמִי קַדִישָׁא בְּכָל אַרְעָא", "pj_en": "but verily I have spared thee alive, not that I may benefit thee, but that My power may be made manifest to thee, and that My Holy Name may be made known in all the earth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 17, "aliyah": 7, "heb": "עוֹדְךָ֖ מִסְתּוֹלֵ֣ל בְּעַמִּ֑י לְבִלְתִּ֖י שַׁלְּחָֽם׃", "onk": "עַד כְּעַן אַתְּ כְּבֵישַׁת בֵּיהּ בְּעַמִּי בְּדִיל דְּלָא לְשַׁלָּחוּתְהוֹן:", "onk_en": "But you are still oppressing My people refusing to send them out.", "pj": "עַד כְּדוֹן אַנְתְּ מִתְרַבְרַב בְּעַמִי בְּדִיל דְלָא לְמִפְטְרִינוּן", "pj_en": "Hitherto hast thou tyrannized over My people, instead of releasing them.", "tj": "מִתְקֵיף:", "tj_en": "Relentlessly.", "rashi": "<b>עודך מסתולל בעמי.<\/b> כְּתַרְגּוּמוֹ, כְּבִישַׁת בֵּהּ בְּעַמִּי, וְהוּא מִגִּזְרַת מְסִלָּה, דִּמְתַרְגְּמִינָן אֹרַח כְּבִישָׁא, וּבְלַעַז קלקי\"ר; וּכְבָר פֵּרַשְׁתִּי בְּסוֹף וַיְהִי מִקֵּץ, כָּל תֵּבָה שֶׁתְּחִלַּת יְסוֹדָהּ סמ\"ך וְהִיא בָּאָה לְדַבֵּר בִּלְשׁוֹן מִתְפַּעֵל, נוֹתֵן הַתָּי\"ו שֶׁל שִׁמּוּשׁ בְּאֶמְצַע אוֹתִיּוֹת שֶׁל עִקָּר, כְּגוֹן זוֹ, וּכְגוֹן \"וְיִסְתַּבֵּל הֶחָגָב\" (קה' י\"ב), מִגִּזְרַת סבל, \"כִּי תִשְׂתָּרֵר עָלֵינוּ\" (במדבר ט\"ז), מִגִּזְרַת נָגִיד וְשָׂר, \"מִשְׂתַּכֵּל הֲוֵית\" (דניאל ז'):", "rashi_en": "עודך מסתולל בעמי Understand this as the Targum does: THOU TREADEST DOWN MY PEOPLE. The word מסתולל is of the same derivation as מְסִלַּה which we render in the Targum by “a trodden path”: old French caucher. I have already explained at the end of Sedrah ויהי מקץ (see Rashi on Genesis 44:16) that in the case of every word (verb) whose first root letter is ס (or ש), when it is intended to express the idea of acting upon itself (our Hithpael conjugation) one puts the ת of the prefix (הִתְ or מִת or יִתְ etc.) between the root letters, just as in this case, and as in, (Ecclesiastes 12:5) ‘‘and the grasshopper shall drag itself along heavily (ויסתבל)” which is derived from סבל “to carry a load”; (Numbers 16:13) “that thou wouldst make thyself altogether a prince (השתרר תשתרר) over us”, of the same derivation as the word שר in (II Chronicles 32:21) “a prince (שר) and noble”; (Daniel 7:8) ‘‘I was considering (מסתכל)” from the root סכל, “to reflect on.”"}, {"ch": 9, "v": 18, "aliyah": 7, "heb": "הִנְנִ֤י מַמְטִיר֙ כָּעֵ֣ת מָחָ֔ר בָּרָ֖ד כָּבֵ֣ד מְאֹ֑ד אֲשֶׁ֨ר לֹא־הָיָ֤ה כָמֹ֙הוּ֙ בְּמִצְרַ֔יִם לְמִן־הַיּ֥וֹם הִוָּסְדָ֖הֿ וְעַד־עָֽתָּה׃", "onk": "הָא אֲנָא <b>מָחֵית<\/b> מִטְרָא בְּעִדָּנָא הָדֵין מְחַר בַּרְדָּא תַּקִּיף לַחֲדָא דִּי לָא הֲוָה דִכְוָתֵיהּ בְּמִצְרַיִם לְמִן יוֹמָא דְאִשְׁתַּכְלָלַת וְעַד כְּעָן:", "onk_en": "Tomorrow at this time, I will cause it to rain [<b>down<\/b>] a tremendously heavy hail. There was never anything like it in Egypt, from the time it was founded until now.", "pj": "הָאֲנָא מָחִית בְּעִידַן הָדֵין לְמָחָר מִן אוֹצְרֵי שְׁמַיָא בַּרְדָא תַּקִיף לַחֲדָא דְלָא הֲוֵי דִכְוָותָא בְּמִצְרַיִם מִן יוֹמָא דְאִשְתַּכְלָלוּ אַנְשָׁהָא וְעַד כְּדוֹן", "pj_en": "Behold, at this time tomorrow I will cause to come down from the treasures of the heavens a mighty hall, the like of which hath never been in Mizraim since the day when men were settled upon it until now.", "tj": "", "tj_en": "", "rashi": "<b>כעת מחר.<\/b> כָּעֵת הַזֹּאת לְמָחָר; שָׂרַט לוֹ שְׂרִיטָה בַּכֹּתֶל – לְמָחָר כְּשֶׁתַּגִּיעַ חַמָּה לְכָאן, יֵרֵד הַבָּרָד:<br><br><b>הוסדה.<\/b> שֶׁנִּתְיַסְּדָה; וְכָל תֵּבָה שֶׁתְּחִלַּת יְסוֹדָהּ יוֹ\"ד, כְּגוֹן יסד, ילד, ידע, יסר, כְּשֶׁהִיא מִתְפַּעֶלֶת, תָּבֹא הַוָּי\"ו בִּמְקוֹם הַיּוֹ\"ד, כְּמוֹ הִוָּסְדָהּ, הִוָּלְדָהּ (הושע ב'), וַיִּוָּדַע, \"וַיִּוָּלֵד לְיוֹסֵף\" (בראשית מ\"ו), \"בִּדְבָרִים לֹא יִוָּסֶר עָבֶד\" (משלי כ\"ט):", "rashi_en": "כעת מחר means AT THIS TIME (כָּעֵת not כְּעֵת) TO-MORROW — He scratched a mark on the wall, saying, “To-morrow when the sun-rays reach here the hail will descend” (Exodus Rabbah 12:2; cf. Rashi on Genesis 21:2).<br><br>הוסדה means [FROM THE DAY] WHEN IT WAS FOUNDED (נתיסדה). Every word (verb) the first root-letter of which is י, as יסד and ילד and ידע and יסר, when it is used in the Hithpael sense (Rashi means our Niphal which often is the reflexive of the Kal), a ו replaces this י; e. g., הוסדה here, from יסד; (Hosea 2:5) “her being born (הִוָלְדָּהּ)”; (Esther 2:22) “and it was known (ויודע)”; (Genesis 66:20) “and there was born (ויולד) to Joseph”; (Proverbs 29:19) A servant will not be corrected (יוסר) by words”."}, {"ch": 9, "v": 19, "aliyah": 7, "heb": "וְעַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת־מִקְנְךָ֔ וְאֵ֛ת כׇּל־אֲשֶׁ֥ר לְךָ֖ בַּשָּׂדֶ֑ה כׇּל־הָאָדָ֨ם וְהַבְּהֵמָ֜ה אֲשֶֽׁר־יִמָּצֵ֣א בַשָּׂדֶ֗ה וְלֹ֤א יֵֽאָסֵף֙ הַבַּ֔יְתָה וְיָרַ֧ד עֲלֵהֶ֛ם הַבָּרָ֖ד וָמֵֽתוּ׃", "onk": "וּכְעַן שְׁלַח כְּנוֹשׁ יָת בְּעִירָךְ וְיָת כָּל דִּי לָךְ בְּחַקְלָא כָּל אֲנָשָׁא וּבְעִירָא דְּאִשְׁתְּכַח בְּחַקְלָא וְלָא יִתְכְּנֵשׁ לְבֵיתָא וְיֵחוֹת עֲלֵיהוֹן בַּרְדָּא וִימוּתוּן:", "onk_en": "Now send [word] and gather [shelter] your livestock and all that you have in the field. Any man or beast that is found [remains] in the field and will not be brought into the house [indoors]—the hail will descend upon them and they will die.”", "pj": "וּכְדוּן שְׁדַר כְּנוֹשׁ יַת גֵיתָךְ וְיַת כָּל דִילָךְ בְּחַקְלָא כָּל אֵינָשָׁא וּבְעִירָא דְאִשְׁתַּכַּח בְּחַקְלָא וְלָא יִתְכְּנוֹשׁ לְבֵיתָא וְיֵיחוֹת עִילַוֵהוֹן בַּרְדָא וִימוּתוּן", "pj_en": "But now send, gather together thy flocks, and all that thou hast in the field (for) upon all men and cattle that are found in the field, and not gathered together within the house, will the hail come down, and they will die.", "tj": "", "tj_en": "", "rashi": "<b>שלח העז.<\/b> כְּתַרְגּוּמוֹ, שְׁלַח כְּנוֹשׁ, וְכֵן \"יוֹשְׁבֵי הַגֵּבִים הֵעִיזוּ\" (ישעיה י'), \"הָעִזוּ בְּנֵי בִנְיָמִן\" (ירמיה ו'):<br><br><b>ולא יאסף הביתה.<\/b> לְשׁוֹן הַכְנָסָה הוּא:", "rashi_en": "שלח העז translate it as the Targum: SEND, GATHER. Similar examples of this sense are, (Isaiah 10:31) “The inhabitants of Gebim gather together (העיזו)”; (Jeremiah 6:1) “Gather together (העיזו), ye children of Benjamin”.<br><br>ולא יאסף הביתה The verb denotes “bringing into a place” so that the translation is: AND WHICH IS NOT GATHERED INTO THE HOUSE."}, {"ch": 9, "v": 20, "aliyah": 7, "heb": "הַיָּרֵא֙ אֶת־דְּבַ֣ר יְהֹוָ֔ה מֵֽעַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת־עֲבָדָ֥יו וְאֶת־מִקְנֵ֖הוּ אֶל־הַבָּתִּֽים׃", "onk": "דְּדָחִיל מִפִּתְגָּמָא דַיְיָ מֵעַבְדֵי פַּרְעֹה <b>כְּנַשׁ<\/b> יָת עַבְדּוֹהִי וְיָת גֵּיתוֹהִי לְבָתַּיָּא:", "onk_en": "He that feared the word of Adonoy among Pharaoh’s servants, made [<b>gathered<\/b>] his servants and his livestock flee into the houses [indoors].", "pj": "אִיוֹב דַהֲוָה דָחִיל מִפִּתְגָמָא דַיְיָ מֵעַבְדוֹי דְפַרְעה כְּנַש יַת עַבְדוֹי וְיַת גֵיתוֹי לְגוֹ בֵיתָא", "pj_en": "Hiob, (Job,) who reverenced the word of the Lord, among the servants of Pharoh, gathered together his servants and his flocks within the house.", "tj": "", "tj_en": "", "rashi": "<b>הניס.<\/b> הִבְרִיחַ:", "rashi_en": "הניס means HE MADE THEM FLEE."}, {"ch": 9, "v": 21, "aliyah": 7, "heb": "וַאֲשֶׁ֥ר לֹא־שָׂ֛ם לִבּ֖וֹ אֶל־דְּבַ֣ר יְהֹוָ֑ה וַֽיַּעֲזֹ֛ב אֶת־עֲבָדָ֥יו וְאֶת־מִקְנֵ֖הוּ בַּשָּׂדֶֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְדִי לָא שַׁוִּי לִבֵּיהּ לְפִתְגָּמָא דַיְיָ שְׁבַק יָת עַבְדּוֹהִי וְיָת גֵּיתוֹהִי בְּחַקְלָא:", "onk_en": "But he whose heart did not heed the word of Adonoy, left his servants and his livestock in the field.", "pj": "וּבִלְעָם דְלָא שַׁוֵיהּ לִבֵּיהּ לְפִתְגָמָא דַיְיָ וּשְׁבַק יַת עַבְדוֹי וְיַת גֵיתוֹי בְּחַקְלָא", "pj_en": "But Bileam, who did not set his heart upon the word of the Lord, left his servants and his flocks in the field.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 22, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה נְטֵ֤ה אֶת־יָֽדְךָ֙ עַל־הַשָּׁמַ֔יִם וִיהִ֥י בָרָ֖ד בְּכׇל־אֶ֣רֶץ מִצְרָ֑יִם עַל־הָאָדָ֣ם וְעַל־הַבְּהֵמָ֗ה וְעַ֛ל כׇּל־עֵ֥שֶׂב הַשָּׂדֶ֖ה בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֲרֵים יָת יְדָךְ עַל צֵית שְׁמַיָּא וִיהֵי בַרְדָּא בְּכָל אַרְעָא דְמִצְרָאֵי עַל אֲנָשָׁא וְעַל בְּעִירָא וְעַל כָּל עֶסְבָּא דְחַקְלָא בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "Adonoy said to Moshe, “Extend your hand toward the heavens, and there will be hail throughout the land of Egypt—on man and on beast, and upon all the vegetation in the land of Egypt.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֲרֵים יַת יְדָךְ עַל צֵית שְׁמַיָא וִיהִי בַרְדָא בְּכָל אַרְעָא דְמִצְרָיִם עַל אֱנָשָׁא וְעַל בְּעִירָא וְעַל כָּל עִיסְבָּא דְחַקְלָא בְּאַרְעָא דְמִצְרָיִם", "pj_en": "And the Lord said to Mosheh, Uplift thy hand towards the height of the heavens, and there shall be hail on all the land of Mizraim, upon men, and upon beasts, and upon every herb of the field in the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>על השמים.<\/b> לְצַד הַשָּׁמַיִם. וּמִדְרַשׁ אַגָּדָה: הִגְבִּיהוֹ הַקָּבָּ\"ה לְמֹשֶׁה לְמַעְלָה מִן הַשָּׁמַיִם:", "rashi_en": "על השמים signifies towards the heavens (i. e. על is the equivalent of אל). A Midrashic comment is that the Holy One, blessed be He, raised Moses high above the heavens see Midrash Tanchuma, Vaera 15)."}, {"ch": 9, "v": 23, "aliyah": 7, "heb": "וַיֵּ֨ט מֹשֶׁ֣ה אֶת־מַטֵּ֘הוּ֮ עַל־הַשָּׁמַ֒יִם֒ וַֽיהֹוָ֗ה נָתַ֤ן קֹלֹת֙ וּבָרָ֔ד וַתִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָה וַיַּמְטֵ֧ר יְהֹוָ֛ה בָּרָ֖ד עַל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲרֵים משֶׁה יָת חֻטְרֵיהּ עַל צֵית שְׁמַיָּא וַייָ יְהַב קָלִין וּבַרְדָּא וּמְהַלְּכָא אֶשָּׁתָא עַל אַרְעָא וְאַמְטַר יְיָ בַּרְדָּא עַל אַרְעָא דְמִצְרָיִם:", "onk_en": "Moshe extended his rod toward the heavens, and Adonoy sent thunder and hail, and fire came streaming down upon the earth. Adonoy caused it to rain hail on the land of Egypt.", "pj": "וַאֲרֵים משֶׁה יַת חוּטְרֵיהּ עַל צֵית שְׁמַיָא וַיְיָ יְהַב קָלִין וּבַרְדִין וּמְצַלְהֲבָא אֵישָׁתָא עַל אַרְעָא וְאָחִית יְיָ בַּרְדָא עַל אַרְעָא דְמִצְרָיִם", "pj_en": "And Mosheh lifted up his rod toward the height of the heavens, and the Lord gave forth thunders and hailstones with flaming, fire upon the ground; the Lord made the hail descend upon the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 24, "aliyah": 7, "heb": "וַיְהִ֣י בָרָ֔ד וְאֵ֕שׁ מִתְלַקַּ֖חַת בְּת֣וֹךְ הַבָּרָ֑ד כָּבֵ֣ד מְאֹ֔ד אֲ֠שֶׁ֠ר לֹֽא־הָיָ֤ה כָמֹ֙הוּ֙ בְּכׇל־אֶ֣רֶץ מִצְרַ֔יִם מֵאָ֖ז הָיְתָ֥ה לְגֽוֹי׃", "onk": "וַהֲוָה בַרְדָּא וְאֶשָּׁתָא מִשְׁתַּלְהָבַת בְּגוֹ בַרְדָּא תַּקִּיף לַחֲדָא דִּי לָא הֲוָה דִכְוָתֵיהּ בְּכָל אַרְעָא דְמִצְרַיִם מֵעִדַּן דַּהֲוַת לְעָם:", "onk_en": "There was hail and fire [lightning] flashing among the hailstones. It was an extremely heavy [downfall]. There had never been anything like it in all the land of Egypt since it became a nation.", "pj": "וַהֲוָה בַרְדָא וְאֵישָׁתָא מִתְקַפְּצָא בְּגוֹ בַרְדָא תַּקִיף לַחֲדָא דְלָא הֲוָה דִכְוָותֵיהּ בְּכָל אַרְעָא דְמִצְרַיִם מִן עִידָן דְהֲוַת לְאוּמָא וּמַלְכוּ", "pj_en": "And there was hail, and fire darting among the hail with exceeding force: unto it had never been the like in all the land of Mizraim ever since it was a nation and a kingdom.", "tj": "", "tj_en": "", "rashi": "<b>מתלקחת בתוך הברד.<\/b> נֵס בְּתוֹךְ נֵס, הָאֵשׁ וְהַבָּרָד מְעֹרָבִין, וְהַבָּרָד מַיִם הוּא, וְלַעֲשׂוֹת רְצוֹן קוֹנָם עָשׂוּ שָׁלוֹם בֵּינֵיהֶם:", "rashi_en": "מתלקחת בתוך הברד [AND FIRE] FLASHING UP AMIDST THE HAIL — a miracle within a miracle! Fire and hail mingled, although hail is water! But in order to perform the will of their Creator they made peace one with the other (Exodus Rabbah 12:4)."}, {"ch": 9, "v": 25, "aliyah": 7, "heb": "וַיַּ֨ךְ הַבָּרָ֜ד בְּכׇל־אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כׇּל־אֲשֶׁ֣ר בַּשָּׂדֶ֔ה מֵאָדָ֖ם וְעַד־בְּהֵמָ֑ה וְאֵ֨ת כׇּל־עֵ֤שֶׂב הַשָּׂדֶה֙ הִכָּ֣ה הַבָּרָ֔ד וְאֶת־כׇּל־עֵ֥ץ הַשָּׂדֶ֖ה שִׁבֵּֽר׃", "onk": "וּמְחָא בַרְדָּא בְּכָל אַרְעָא דְמִצְרַיִם יָת כָּל דִּי בְחַקְלָא מֵאֲנָשָׁא וְעַד בְּעִירָא וְיָת כָּל עֶסְבָּא דְחַקְלָא מְחָא בַרְדָּא וְיָת כָּל אִילַן דִּבְחַקְלָא תְּבַר:", "onk_en": "The hail struck throughout the whole land of Egypt, [killing] all that was in the field [outdoors]—both man and beast. All the vegetation in the fields was struck by the hail and every tree in the fields was shattered.", "pj": "וּמְחָא בַרְדָא בְּכָל אַרְעָא דְמִצְרַיִם יַת כָּל דִבְחַקְלָא מֵאֵינָשָׁא וְעַד בְּעִירָא וְיַת כָּל עִסְבָּא דְחַקְלָא מְחָא בַרְדָא וְיַת כָּל אִילָנָא דְחַקְלָא תְּבִיר וְשַׁרִישׁ", "pj_en": "And the hail smote in all the land of Mizraim whatsoever was in the field, of men and of cattle, and all the herbage of the field the hail smote, and every tree of the field it shattered and uprooted.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 26, "aliyah": 7, "heb": "רַ֚ק בְּאֶ֣רֶץ גֹּ֔שֶׁן אֲשֶׁר־שָׁ֖ם בְּנֵ֣י יִשְׂרָאֵ֑ל לֹ֥א הָיָ֖ה בָּרָֽד׃",
