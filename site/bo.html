 שֶׁנִּשְׁבַּעְתִּי לְאַבְרָהָם שֶׁאֶגְאַל אֶת בָּנָיו, וְלֹא הָיוּ בְיָדָם מִצְווֹת לְהִתְעַסֵּק בָּהֶם כְּדֵי שֶׁיִּגָּאֲלוּ, שֶׁנֶּאֱמַר \"וְאַתְּ עֵרוֹם וְעֶרְיָה\" (שם), וְנָתַן לָהֶם שְׁתֵּי מִצְווֹת, דַּם פֶּסַח וְדַם מִילָה, שֶׁמָּלוּ בְאוֹתוֹ הַלַּיְלָה, שֶׁנֶּאֱמַר \"מִתְבּוֹסֶסֶת בְּדָמָיִךְ\" (שם) – בִּשְׁנֵי דָּמִים, וְאוֹמֵר \"גַּם אַתְּ בְּדַם בְּרִיתֵךְ שִׁלַּחְתִּי אֲסִירַיִךְ מִבּוֹר אֵין מַיִם בּוֹ\" (זכריה ט'); וּלְפִי שֶׁהָיוּ שְׁטוּפִין בֶּאֱלִילִים אָמַר לָהֶם <b>משכו וקחו לכם<\/b>, מִשְׁכוּ יְדֵיכֶם מֵאֱלִילִים, וּקְחוּ לָכֶם צֹאן שֶׁל מִצְוָה (מכילתא):<br><br><b>ושחטו אתו וגו'.<\/b> וְכִי כֻּלָּן שׁוֹחֲטִין? אֶלָּא מִכָּאן שֶׁשְּׁלוּחוֹ שֶׁל אָדָם כְּמוֹתוֹ (קידושין מ\"א):<br><br><b>קהל עדת ישראל.<\/b> קָהָל וְעֵדָה וְיִשְׂרָאֵל; מִכָּאן אָמְרוּ, פִּסְחֵי צִבּוּר נִשְׁחָטִין בְּשָׁלוֹשׁ כִּתּוֹת זוֹ אַחַר זוֹ, נִכְנְסָה כַת רִאשׁוֹנָה נִנְעֲלוּ דַּלְתוֹת הָעֲזָרָה וְכוּ'. כִּדְאִיתָא בִּפְסָחִים (דף ס\"ד):<br><br><b>בין הערבים.<\/b> מִשֵּׁשׁ שָׁעוֹת וּלְמַעְלָה קָרוּי בֵּין הָעַרְבַּיִם, שֶׁהַשֶּׁמֶשׁ נוֹטֶה לְבֵית מְבוֹאוֹ לַעֲרֹב; וּלְשׁוֹן <b>בין הערבים<\/b> נִרְאֶה בְעֵינַי אוֹתָן שָׁעוֹת שֶׁבֵּין עֲרִיבַת הַיּוֹם לַעֲרִיבַת הַלַּיְלָה, עֲרִיבַת הַיּוֹם בִּתְחִלַּת ז' שָׁעוֹת מִכִּי יִנָּטוּ צִלְלֵי עֶרֶב, וַעֲרִיבַת הַלַּיְלָה בִּתְחִלַּת הַלַּיְלָה. ערב לְשׁוֹן נֶשֶׁף וְחֹשֶׁךְ, כְּמוֹ \"עָרְבָה כָּל שִׂמְחָה\" (ישעיהו כ\"ד):", "rashi_en": "והיה לכם למשמרת AND IT SHALL BE IN YOUR KEEPING (or watching) — This expresses the idea of examining, and the text therefore implies that it requires examination against any blemish during the four days before slaughter (Pesachim 96a). And why did He order that it should be taken from the flock four days before its slaughter, something which He did not command in respect to the paschal-lamb that was offered by succeeding generations? Rabbi Mathia, the son of Cheresh, said, in answer: Behold, it (Scripture) says, (Ezekiel 16:8) “And I passed over thee (an allusion to God’s passing over the Israelites in Egypt) and looked upon thee, and behold, thy time was the time of love” — there had arrived the time to fulfil the oath which I had sworn to Abraham to redeem his children. They, however, possessed no divine commands in which to engage in order that they should merit to be redeemed — as it is said (Ezekiel 16:7) “thou wast naked and bare” (i. e. bare of all merit earned through the fulfilment of God’s commands). He therefore gave them two commands, relating respectively to the blood of the paschal-lamb and the blood of the circumcision — for that night they circumcised themselves, as it is said (Ezekiel 16:6) “[When I passed over thee] I saw thee wallowing in thy bloods (בְּדָמַיִךְ is plural)” i. e. in two kinds of blood. Further it states, (Zechariah 9:11) “As for thee, also, because of the blood of the covenant I released thy prisoners out of the pit wherin there is no water”. And yet another reply to this question is, that because they were sunk in idolatry and had no merit gained by the practice of a divine command, He said unto them, (v. 21) משכו “Draw” — withdraw your hands from idols; וקחו לכם צאן “and take unto yourselves a lamb” to fulfil a divine command (Mekhilta).<br><br>ושחטו אתו וגו׳ AND THEY SHALL SLAUGHTER IT etc. — But did they all slaughter it (one alone did this on behalf of the company formed to eat that particular lamb; cf. Chullin 29b)? But we derive from this statement the legal principle that a man’s agent is as himself (this is derived from the fact that although one alone slaughtered the lamb on behalf of many, Scripture still states: they shall slaughter it) (Mekhilta; Kiddushin 41b).<br><br>קהל עדת ישראל it speaks here of קהל assembly, עדה congregation, ישראל Israel, whilst one of these terms alone would have sufficed; hence they (the Rabbis) said: the paschal-lambs of the congregation (a term used in contrast to that which was sacrificed by an individual on the 14th of the second month; cf. Numbers 9:9—14) are to be slaughtered in three groups, one after the other — the first group entered and the doors of the court were closed, etc. as is to be found in the Talmud, Treatise Pesachim (64a).<br><br>בין הערבים AT EVENTIDE — The period beginning at six hours (reckoning from six o’clock in the morning) and hence forward is called בין הערבים (Mekhilta), because the sun then inclines in the direction of the place of its setting to become darkened. The expression בין הערבים appears to me to denote those hours which are between the darkening of the day and the darkening of the night. The darkening of the day is at the beginning of the seventh hour in the day, from when the shadows of evening decline; and the darkening of the night is at the commencement of the night (this period is therefore from noon until the beginning of night). The word ערב is an expression for gloom and darkness, as in (Isaiah 24:11). “All joy is darkened\"."}, {"ch": 12, "v": 7, "aliyah": 4, "heb": "וְלָֽקְחוּ֙ מִן־הַדָּ֔ם וְנָ֥תְנ֛וּ עַל־שְׁתֵּ֥י הַמְּזוּזֹ֖ת וְעַל־הַמַּשְׁק֑וֹף עַ֚ל הַבָּ֣תִּ֔ים אֲשֶׁר־יֹאכְל֥וּ אֹת֖וֹ בָּהֶֽם׃", "onk": "וְיִסְבוּן מִן דְמָא וְיִתְּנוּן עַל תְּרֵין סִפַּיָא וְעַל שַׁקְפָא עַל בָּתַּיָא דְיֵכְלוּן יָתֵהּ בְּהוֹן:", "onk_en": "They shall take of its blood and place it on the side of the doorposts and on the lintel of the houses in which they will eat [the lamb].", "pj": "וְיִסְבוּן מִן דְּמָא וְיִתְּנוּן עַל תְּרֵין סִיפַיָּיא וְעִילוֹי מִסְקוּפָא עִלָּאָה מִלְּבַּר עַל בָּתַּיָא דְיֵיכְלוּן יָתֵיהּ וּדְדַמְכוּן בְּהוֹן", "pj_en": "And you shall take of the blood and set it upon the two posts and upon the upper board outside of the houses in which you eat and sleep.", "tj": "", "tj_en": "", "rashi": "<b>ולקחו מן הדם.<\/b> זוֹ קַבָּלַת הַדָּם, יָכוֹל בַּיָּד? תַּ\"לֹ <b>אשר בסף<\/b> (מכילתא):<br><br><b>המזוזת.<\/b> הֵם הַזְּקוּפוֹת אַחַת מִכָּאן לַפֶּתַח וְאַחַת מִכָּאן:<br><br><b>המשקוף.<\/b> הָעֶלְיוֹן שֶׁהַדֶּלֶת שׁוֹקֵף עָלָיו כְּשֶׁסּוֹגְרִין אוֹתוֹ, לינטי\"ל בְּלַעַז; וּלְשׁוֹן שְׁקִיפָה חֲבָטָה, כְּמוֹ \"קוֹל עָלֶה נִדָּף\" (ויקרא כ\"ו) – דְשָׁקִיף, חַבּוּרָה – מַשְׁקוֹפֵי:<br><br><b>על הבתים אשר יאכלו אתו בהם.<\/b> וְלֹא עַל מַשְׁקוֹף וּמְזוּזוֹת שֶׁבְּבֵית הַתֶּבֶן וּבֵית הַבָּקָר, שֶׁאֵין דָּרִין בְּתוֹכוֹ (ע' מכילתא):", "rashi_en": "ולקחו מן הדם AND THEY SHALL TAKE OF THE BLOOD — This refers to the ritual reception of the blood. One might think that they must take it in the hand; therefore Scripture states, (v. 22) “[and ye shall dip it in the blood] which is in the basin (Mekhilta).<br><br>המזוזת THE SIDE POSTS — These are the upright posts, one on this side of the entrance and one on that side.<br><br>המשקוף THE LINTEL — This is the upper post upon which the door beats (שוקף) when it is being closed; old French lintel. The expression שקף (from which משקוף lintel is derived) denotes beating, as may be seen from the Targum on, (Leviticus 26:36) “the sound of a leaf that is beaten (by another)”, which Onkelos renders by דשקיף; and from the Targum on, (Exodus 21:25) חַבּוּרָה “wheal” (a beaten spot), where משקופי is the rendering.<br><br>אל הבתים אשר יאכלו אתו בהם ON THE HOUSES WHEREIN THEY SHALL EAT IT — and not upon the lintel and the doorposts which are in the place used for storing straw or in the stalls of oxen, in which people do not live and eat. (Cf. Mekhilta and הגהות הגר״א thereon)."}, {"ch": 12, "v": 8, "aliyah": 4, "heb": "וְאָכְל֥וּ אֶת־הַבָּשָׂ֖ר בַּלַּ֣יְלָה הַזֶּ֑ה צְלִי־אֵ֣שׁ וּמַצּ֔וֹת עַל־מְרֹרִ֖ים יֹאכְלֻֽהוּ׃", "onk": "וְיֵכְלוּן יָת בִּסְרָא בְּלֵילָא הַהוּא טְוֵי נוּר <b>וּפַטִיר<\/b> עַל מְרָרִין יֵכְלֻנֵהּ:", "onk_en": "They shall eat the meat during this night. It shall be roasted over fire. They shall eat it with matzos [<b>matzoh<\/b>] and bitter herbs.", "pj": "וְיֵיכְלוּן יַת בִּישְרָא בְּלֵילְיָא הָדֵין דַּחֲמֵיסַר בְּנִיסַן עַד פַּלְגוּתֵיהּ דְּלֵילְיָא טְוֵי נוּר וּפַטִּיר עַל תַּמְכָא וְעוּלְשִׁין יֵיכְלוּנֵיהּ", "pj_en": "And you shall eat the flesh on that night, the fifteenth of Nisan, until the dividing of the night roasted with fire, without leaven, with horehound and lettuce shall you eat it.", "tj": "מְהַבְהַב:", "tj_en": "Roasted.", "rashi": "<b>את הבשר.<\/b> וְלֹא גִּידִים וַעֲצָמוֹת (שם):<br><br><b>ומצות על מררים.<\/b> כָּל עֵשֶׂב מַר נִקְרָא מָרוֹר; וְצִוָּם לֶאֱכֹל מַר זֵכֶר לְ\"וַיְמָרְרוּ אֶת חַיֵּיהֶם\" (שמות א'):", "rashi_en": "את הבשר AND THEY SHALL EAT] THE FLESH — but not the sinews and bones (Mekhilta).<br><br>ומצות על מררים AND UNLEAVENED BREAD WITH מררים — Every bitter herb is called מרור. He commanded them to eat something bitter as a reminder of: (Exodus 1:14) “And they made their lives bitter” (Pesachim 116b)."}, {"ch": 12, "v": 9, "aliyah": 4, "heb": "אַל־תֹּאכְל֤וּ מִמֶּ֙נּוּ֙ נָ֔א וּבָשֵׁ֥ל מְבֻשָּׁ֖ל בַּמָּ֑יִם כִּ֣י אִם־צְלִי־אֵ֔שׁ רֹאשׁ֥וֹ עַל־כְּרָעָ֖יו וְעַל־קִרְבּֽוֹ׃", "onk": "לָא תֵיכְלוּן מִנֵהּ כַּד חַי <b>וְאַף<\/b> לָא בַשָׁלָא מְבַשֵׁל בְּמַיָא אֱלָהֵן טְוֵי נוּר רֵישֵׁיה עַל כְּרָעוֹהִי וְעַל גַוֵהּ:", "onk_en": "You must not eat it half-cooked or [<b>even<\/b>] boiled in water, but only roasted over fire, its head with its knees and its inner organs.", "pj": "לָא תֵיכְלוּן מִנֵיהּ כַּד חַי וְלָא כַּד בַּשְׁלָא בְּחַמְרָא וּמִשְׁחָא וְשַׁקְיָינֵי וְלָא מְבֻשָּׁל בְּמַיָא אֱלָהֵן טְוֵי נוּר עִם רֵישֵׁיהּ עִם רַגְלוֹי וְעִם גַּוֵּיהּ", "pj_en": "Eat not of it while living, neither boiled in wine, or oil, or other fluids, neither boiled in water, but roasted with fire, with its head, and its feet, and its inwards.", "tj": "", "tj_en": "", "rashi": "<b>אל תאכלו ממנו נא.<\/b> שֶׁאֵינוֹ צָלוּי כָּל צָרְכּוֹ קוֹרְאוֹ נָא בְלָשׁוֹן עֲרָבִי:<br><br><b>ובשל מבשל.<\/b> כָּל זֶה בְּאַזְהָרַת <b>אל תאכלו<\/b>:<br><br><b>במים.<\/b> מִנַּיִן לִשְׁאָר מַשְׁקִין? תַּ\"לֹ וּבָשֵׁל מְבֻשָּׁל, מִכָּל מָקוֹם (פסחים מ\"א):<br><br><b>כי אם צלי אש.<\/b> לְמַעְלָה גָּזַר עָלָיו בְּמִצְוַת עֲשֵׂה, וְכָאן הוֹסִיף עָלָיו לֹא תַעֲשֶׂה, <b>אל תאכלו ממנו … כי אם צלי אש<\/b>:<br><br><b>ראשו על כרעיו.<\/b> צוֹלֵהוּ כֻּלּוֹ כְאֶחָד עִם רֹאשׁוֹ וְעִם כְּרָעָיו וְעִם קִרְבּוֹ, וּבְנֵי מֵעָיו נוֹתֵן לְתוֹכוֹ אַחַר הֲדָחָתָן (שם ע\"ד); וּלְשׁוֹן <b>על קרבו<\/b> כִּלְשׁוֹן \"עַל צִבְאוֹתָם\" (שמות ו'), כְּמוֹ בְּצִבְאוֹתָם – כְּמוֹת שֶׁהֵן, אַף זֶה כְּמוֹת שֶׁהוּא – כָּל בְּשָׂרוֹ מִשָּׁלֵם:", "rashi_en": "אל תאכלו ממנו נא DO NOT EAT OF IT HALF-DONE — flesh that is not roasted as much as it should be is called נא in the Arabic language (cf. Pesachim 41a).<br><br>ובשל מבשל NOR SODDEN AT ALL — All this belongs to the prohibition, “Do not eat of it” (The text is, therefore, to be translated as above, and not: Do not eat of it half done, but boiled etc. The words אל תאכלו are to be supplied before בשל and כי אם צלי אש) (Pesachim 41b).<br><br>במים [BOILED] IN WATER — Whence may it be deduced that this prohibition extends to other liquids also? Because Scripture states here ובשל מבשל, “or boiled at all” (Pesachim 41a.).<br><br>כי אם צלי אש BUT ROAST WITH FIRE — Above (in the preceding verse) Scripture promulgates the law regarding this in the form of an affirmative command; here it adds to that a negative command: Do not eat of it … except roasted by fire. (Consequently one who eats of it in in any manner except roasted by fire is liable to the punishment laid down for transgressing a negative command as well as to that for the infringement of a positive command) (Pesachim 41b).<br><br>ראשו על כרעיו ITS HEAD WITH ITS LEGS — One roasts it all in one, with its head and with its legs and with its inward parts, and one places its entrails inside it after having rinsed them (Pesachim 74a). The expression על קרבו, is like the expression, (Exodus 6:26) “על צבאותם”, which is the same as בצבאותם, “with their hosts”, which means, “just as they are” (every one of the Israelites). So, too, this phrase means: they shall roast the flesh just as it is — all its flesh, whole."}, {"ch": 12, "v": 10, "aliyah": 4, "heb": "וְלֹא־תוֹתִ֥ירוּ מִמֶּ֖נּוּ עַד־בֹּ֑קֶר וְהַנֹּתָ֥ר מִמֶּ֛נּוּ עַד־בֹּ֖קֶר בָּאֵ֥שׁ תִּשְׂרֹֽפוּ׃", "onk": "וְלָא תַשְׁאֲרוּן מִנֵהּ עַד צַפְרָא וּדְיִשְׁתָּאַר מִנֵהּ עַד צַפְרָא בְּנוּרָא תוֹקְדוּן:", "onk_en": "You must not leave any of it over until morning. Any of it left over until morning must be burned in fire.", "pj": "וְלָא תְשַׁיְירוּן מִנֵּיהּ עַד צַפְרָא וּדְאִשְׁתַּיֵּיר מִנֵּיהּ עַד צַפְרָא תַּצְנְעִנֵּיהּ וּבְאוֹרְתָּא דְּשִׁתְּסַר בְּנוּרָא תוֹקְדוּן דְּלֵית אֶפְשַׁר לְמִיתוֹקְדָא מוֹתַר נִיכְסַת קוּדְשַׁיָא בְּיוֹמָא טָבָא", "pj_en": "Nor shall any be left of it till the morning; but what may remain of it in the morning you shall cover over, and in the daylight of the sixteenth day burn with fire; for you may not burn the residue of a holy oblation on the feast day.", "tj": "", "tj_en": "", "rashi": "<b>והנתר ממנו עד בקר.<\/b> מַה תַּ\"לֹ <b>עד בקר<\/b> פַּעַם שְׁנִיָּה? לִתֵּן בֹּקֶר עַל בֹּקֶר, שֶׁהַבֹּקֶר מַשְׁמָעוֹ מִשְּׁעַת הָנֵץ הַחַמָּה, וּבָא הַכָּתוּב לְהַקְדִּים שֶׁאָסוּר בַּאֲכִילָה מֵעֲלוֹת הַשַּׁחַר, זֶהוּ לְפִי מַשְׁמָעוֹ. וְעוֹד מִדְרָשׁ אַחֵר, לִמֵּד שֶׁאֵינוֹ נִשְׂרָף בְּיוֹם טוֹב אֶלָּא מִמָּחֳרָת, וְכָךְ תִּדְרְשֶׁנּוּ: וְהַנּוֹתָר מִמֶּנּוּ בְּבֹקֶר רִאשׁוֹן, עַד בֹּקֶר שֵׁנִי תַעֲמֹד וְתִשְׂרְפֶנּוּ (מכילתא):", "rashi_en": "והנתר ממנו עד בקר AND THAT WHICH REMAINETH OF IT UNTIL THE MORNING — What does Scripture intend to teach by stating עד בקר a second time? It intends to add an earlier stage of morning to the stage of morning already mentioned: because the term morning usually signifies the period beginning with sun-rise, and Scripture here intends to advance the hour and forbid eating it even from the break of day. This is the explanation according to what the text really implies. And there is still another Halacha derived from it: it teaches that it is not to be burnt on the festival itself but on the following day, and this is how you must explain it: “[and ye shall not leave anything of it until the morning]”; והנתר ממנו “and as regards that which is left of it” unto that first morning (עד בקר), until the second morning shalt thou wait, and then shalt thou burn it (Mekhilta; Pesachim 83b; Shabbat 24b)."}, {"ch": 12, "v": 11, "aliyah": 4, "heb": "וְכָ֘כָה֮ תֹּאכְל֣וּ אֹתוֹ֒ מׇתְנֵיכֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵיכֶם֙ בְּרַגְלֵיכֶ֔ם וּמַקֶּלְכֶ֖ם בְּיֶדְכֶ֑ם וַאֲכַלְתֶּ֤ם אֹתוֹ֙ בְּחִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַיהֹוָֽה׃", "onk": "וּכְדֵין תֵּיכְלוּן יָתֵהּ חַרְצֵיכוֹן יְהוֹן אֲסִירִין מְסָנֵיכוֹן בְּרִגְלֵיכוֹן וְחוּטְרֵיכוֹן בִּידֵיכוֹן וְתֵיכְלוּן יָתֵהּ בִּבְהִילוּ פִּסְחָא הוּא <b>קֳדָם<\/b> יְיָ:", "onk_en": "This is how you must eat it: with your waist belted, your shoes on your feet, and your staff in your hand. You must eat it in haste, it is a Pesach-offering to [<b>before<\/b>] Adonoy.", "pj": "וּכְדָא הִילְכָתָא תֵיכְלוּן יָתֵיהּ בְּזִמְנָא דָא וְלָא לְדָרַיָא חַרְצֵיכוֹן יְהוֹן מְזַרְזִין מְסַנֵיכוֹן בְּרִיגְלֵיכוֹן וְחוּטְרֵיכוֹן בִּידֵיכוֹן וְתֵיכְלוּן יָתֵיהּ בִּבְהִילוּ דִשְׁכִינַת מָארֵי עַלְמָא מְטוּל דְּחַיְיסָא מִן קֳדָם יְיָ לְכוֹן הוּא", "pj_en": "And according to this manner you shall eat it, this time, but not in (other) generations: your loins shall be girded, your shoes on your feet, and your staves in your hands; and you shall eat in the fear of the majesty of the Lord of the world; because mercy hath been shown to you from before the Lord.", "tj": "אֲסִירִין בְּמִצְוְתָא דְאוֹרַיְיתָא:", "tj_en": "Bound by the precepts of the law.", "rashi": "<b>מתניכם חגרים.<\/b> מְזֻמָּנִים לַדֶּרֶךְ:<br><br><b>בחפזון.<\/b> לְשׁוֹן בֶּהָלָה וּמְהִירוּת, כְּמוֹ \"וַיְהִי דָּוִד נֶחְפָּז לָלֶכֶת\" (שמואל א' כ\"ג), \"אֲשֶׁר הִשְׁלִיכוּ אֲרָם בְּחָפְזָם\" (מלכים ב' ז'):<br><br><b>פסח הוא לה'.<\/b> הַקָּרְבָּן קָרוּי פסח עַל שֵׁם הַדִּלּוּג וְהַפְּסִיחָה, שֶׁהַקָּבָּ\"ה הָיָה מְדַלֵּג בָּתֵּי יִשְׂרָאֵל מִבֵּין בָּתֵּי מִצְרַיִם וְקוֹפֵץ מִמִּצְרִי לְמִצְרִי וְיִשְׂרָאֵל אֶמְצָעִי נִמְלָט; וְאַתֶּם עֲשׂוּ כָל עֲבוֹדוֹתָיו לְשֵׁם שָׁמַיִם, דֶּרֶךְ דִּלּוּג וּקְפִיצָה, זֵכֶר לִשְׁמוֹ שֶׁקָּרוּי פסח; וְגַם פשק\"א לְשׁוֹן פְּסִיעָה:", "rashi_en": "מתניכם חגרים YOUR LOINS GIRDED — i. e. prepared for the journey (Mekhilta).<br><br>בחפזון — This is an expression denoting hurry and haste, similar to, (I Samuel 23:26) “And David made haste (נחפז) to get away”; (2 Kings 7:15) ”which the Arameans had cast away in their haste\"<br><br>פסח הוא לה IT IS THE PASSOVER OF THE LORD — The offering is called פסח in allusion to the springing and passing over — because the Holy One, blessed be He, passed over the houses of the Israelites in between the houses of the Egyptians and sprang from Egyptian to Egyptian, whilst the Israelite who was between them escaped. The words “And ye shall eat it in haste for it is a 'springing’-offering to the Lord” imply: Ye, therefore, do every act of sacrificial service connected with it (with the Paschal lamb) in honour of Heaven (God) by way of springing and leaping over (i. e. hastily), as a reminder of its name, which is called, the “springing”-offering. In old French, (Provencal) too, Pascua (the term for the Passover festival) signifies stepping over."}, {"ch": 12, "v": 12, "aliyah": 4, "heb": "וְעָבַרְתִּ֣י בְאֶֽרֶץ־מִצְרַ֘יִם֮ בַּלַּ֣יְלָה הַזֶּה֒ וְהִכֵּיתִ֤י כׇל־בְּכוֹר֙ בְּאֶ֣רֶץ מִצְרַ֔יִם מֵאָדָ֖ם וְעַד־בְּהֵמָ֑ה וּבְכׇל־אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהֹוָֽה׃", "onk": "<b>וְאִתְגְלֵיתִי<\/b> בְאַרְעָא דְמִצְרַיִם בְּלֵילְיָא הָדֵין וְאֶקְטוֹל כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מֵאֲנָשָׁא וְעַד בְּעִירָא וּבְכָל טַעֲוַת מִצְרַיִם אַעְבֵּד דִינִין אֲנָא יְיָ:", "onk_en": "I will pass through [<b>become revealed in<\/b>] the land of Egypt on that night, and I will strike [kill] every first-born in the land of Egypt, from man to beast; and against all the gods of Egypt, I will execute judgments, I am Adonoy.", "pj": "וְאִתְגְּלֵי בְּאַרְעָא דְמִצְרַיִם בִּשְׁכִינַת יְקָרִי בְּלֵילְיָא הָדֵין וְעִמִּי תִּשְׁעִין אַלְפִין רִבְוָון מַלְאָכִין מְחַבְּלִין וְאֶקְטוֹל כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מֵאֱנָשָׁא וְעַד בְּעִירָא וּבְכָל טַעֲוַות מִצְרָאֵי אֶעֱבֵיד אַרְבַּע דִינִין טַעֲוַות מַתְּכָא מִתְרַכְּכִין טַעֲוַות אַבְנָא מִתְגַּדְעִין טַעֲוַות פַּחֲרָא מִתְעַבְּדִין בְּקִיקִין טַעֲוַות אָעָא מִתְעַבְּדִין קְטַם דְּיִנְדְּעוּן מִצְרָאֵי אֲרוּם אֲנָא יְיָ", "pj_en": "And I will be revealed in the land of Mizraim in the majesty of My glory this night, and with Me ninety thousand myriads of destroying angels; and I will slay all the firstborn in the land of Mizraim, of man and of beast, and against all the idols of the Mizraee I will execute four judgments: the molten idols shall be melted, the idols of stone be broken, the idols of clay shall he shattered, and the idols of wood be made dust, that the Mizraee may know that I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ועברתי.<\/b> כְּמֶלֶךְ הָעוֹבֵר מִמָּקוֹם לְמָקוֹם (מכילתא), וּבְהַעֲבָרָה אַחַת וּבְרֶגַע אֶחָד כֻּלָּן לוֹקִים:<br><br><b>כל בכור בארץ מצרים.<\/b> אַף בְּכוֹרוֹת אֲחֵרִים וְהֵם בְּמִצְרַיִם. וּמִנַּיִן אַף בְּכוֹרֵי מִצְרַיִם שֶׁבִּמְקוֹמוֹת אֲחֵרִים? תַּ\"לֹ \"לְמַכֵּה מִצְרַיִם בִּבְכוֹרֵיהֶם\" (תהלים קל\"ו):<br><br><b>מאדם ועד בהמה.<\/b> מִי שֶׁהִתְחִיל בַּעֲבֵרָה מִמֶּנּוּ מַתְחֶלֶת הַפֻּרְעָנוּת (מכילתא):<br><br><b>ובכל אלהי מצרים.<\/b> שֶׁל עֵץ נִרְקֶבֶת וְשֶׁל מַתֶּכֶת נִמְסֵת וְנִתֶּכֶת לָאָרֶץ (שם):<br><br><b>אעשה שפטים אני ה'.<\/b> אֲנִי בְעַצְמִי, וְלֹא עַל יְדֵי שָׁלִיחַ:", "rashi_en": "ועברתי AND I WILL PASS — This is not to be taken literally, but is speaks of God as one speaks of a king who passes from place to place (Mekhilta) but in this case all were punished at a single passage and in one moment.<br><br>כל בכור בארץ מצרים ALL THE FIRSTBORN IN THE LAND OF EGYPT — also the first-born of other nations who happened then to be in Egypt. And whence may we deduce that the first-born of the Egyptians who happened to be in other countries also died? From what Scripture states: (Psalms 136:10) “To Him that smote the Egyptians in their first-born” (an unqualified statement) (Mekhilta).<br><br>מאדם עד בהמה FROM MAN TO BEAST — He who first began the wrongdoing, from him began the punishment (Mekhilta).<br><br>ובכל אלהי מצרים AND AGAINST ALL THE GODS OF EGYPT [WILL I EXECUTE JUDGEMENTS] — An idol of wood rotted, and one of metal melted and was poured out on the ground (cf. Mekhilta)).<br><br>אעשה שפטים אני ה I WILL EXECUTE JUDGEMENTS, I, THE LORD — I, Myself, and not by means of a messenger (Pesikta Zotarta)."}, {"ch": 12, "v": 13, "aliyah": 4, "heb": "וְהָיָה֩ הַדָּ֨ם לָכֶ֜ם לְאֹ֗ת עַ֤ל הַבָּתִּים֙ אֲשֶׁ֣ר אַתֶּ֣ם שָׁ֔ם וְרָאִ֙יתִי֙ אֶת־הַדָּ֔ם וּפָסַחְתִּ֖י עֲלֵכֶ֑ם וְלֹֽא־יִֽהְיֶ֨ה בָכֶ֥ם נֶ֙גֶף֙ לְמַשְׁחִ֔ית בְּהַכֹּתִ֖י בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וִיהֵי דְמָא לְכוֹן לְאָת עַל בָּתַּיָא דִי אַתּוּן תַּמָן וְאֶחֱזֵי יָת דְמָא <b>וְאֵיחוֹס עֲלֵיכוֹן<\/b> וְלָא יְהֵי בְכוֹן מוֹתָא לְחַבָּלָא בְּמִקְטְלִי בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "The blood will be for you as a sign on the houses where you are [staying]. I will see the blood and I will pass over [<b>have mercy upon<\/b>] you. There will be no plague against you when I strike the land of Egypt.", "pj": "וִיהֵי דַּם נִכְסַת פִּסְחָא וּגְזֵרַת מְהוּלְתָּא מְעַרַב לְכוֹן לְמֶעֱבַד מִנֵּיהּ אָת עַל בָּתַּיָא דְּאַתּוּן שַׁרְיָן תַּמָּן וְאֶחֱמֵי יַת זְכוּת דְּמָא וְאֵיחוּס עֲלֵיכוֹן וְלָא יִשְׁלוֹט בְּכוֹן מַלְאָךְ מוֹתָא דְּאִתְיַהַב לֵיהּ רְשׁוּתָא לִמְחַבְּלָא בְּמִקְטְלִי בְּאַרְעָא דְּמִצְרָיִם", "pj_en": "And the blood of the paschal oblation, (like) the matter of circumcision, shall be a bail for you, to become a sign upon the houses where you dwell; and I will look upon the worth of the blood, and will spare you; and the angel of death, to whom is given the power to destroy, shall have no dominion over you in the slaughter of the Mizraee.", "tj": "", "tj_en": "", "rashi": "<b>והיה הדם לכם לאת.<\/b> לָכֶם לְאוֹת וְלֹא לַאֲחֵרִים לְאוֹת (שם). מִכָּאן שֶׁלֹּא נָתְנוּ הַדָּם אֶלָּא מִבִּפְנִים:<br><br><b>וראיתי את הדם.<\/b> הַכֹּל גָּלוּי לְפָנָיו, אֶלָּא אָמַר הַקָּבָּ\"ה, נוֹתֵן אֲנִי אֶת עֵינַי לִרְאוֹת שֶׁאַתֶּם עֲסוּקִים בְּמִצְווֹתַי, וּפוֹסֵחַ אֲנִי עֲלֵיכֶם (שם):<br><br><b>ופסחתי.<\/b> וְחָמַלְתִּי, וְדוֹמֶה לוֹ \"פָּסֹחַ וְהִמְלִיט\" (ישעיהו ל\"א). וַאֲנִי אוֹמֵר, כָּל פְּסִיחָה לְשׁוֹן דִּלּוּג וּקְפִיצָה. <b>ופסחתי<\/b>, מְדַלֵּג הָיָה מִבָּתֵּי יִשְׂרָאֵל לְבָתֵּי מִצְרִיִּים, שֶׁהָיוּ שְׁרוּיִים זֶה בְּתוֹךְ זֶה, וְכֵן \"פּוֹסְחִים עַל שְׁתֵּי הַסְּעִפִּים\" (מלכים א י\"ח), וְכֵן כָּל הַפִּסְּחִים – הוֹלְכִים כְּקוֹפְצִים, וְכֵן \"פָּסֹחַ וְהִמְלִיט\" – מְדַלְּגוֹ וּמְמַלְּטוֹ מִבֵּין הַמּוּמָתִים:<br><br><b>ולא יהיה בכם נגף.<\/b> אֲבָל הוֶֹה הוּא בַּמִּצְרִים. הֲרֵי שֶׁהָיָה מִצְרִי בְּבֵיתוֹ שֶׁל יִשְׂרָאֵל, יָכוֹל יִמָּלֵט? תַּ\"לֹ \"וְלֹא יִהְיֶה בָכֶם נֶגֶף\", אֲבָל הֹוֶה בַּמִּצְרִים שֶׁבְּבָתֵּיכֶם. הֲרֵי שֶׁהָיָה יִשְׂרָאֵל בְּבֵיתוֹ שֶׁל מִצְרִי, שׁוֹמֵעַ אֲנִי יִלְקֶה כְמוֹתוֹ, תַּ\"לֹ \"וְלֹא יִהְיֶה בָכֶם נֶגֶף\" (מכילתא):", "rashi_en": "והיה הדם לכם לאת AND THE BLOOD SHALL BE UNTO YOU FOR A SIGN — it shall be to you for a sign, and not to others for a sign (Mekhilta). From this we may learn that they put the blood only inside their houses.<br><br>וראיתי את הדם AND WHEN I SEE THE BLOOD — But surely everything is manifest to Him and He therefore did not need to look whether the blood had been put on the door-posts? But the meaning is: God says, I will set My eye (my attention) to take notice of the fact that you are engaged in the performance of My commands — then will I pass over you (Mekhilta).<br><br>ופסחתי — This signifies I WILL SPARE you; similar to this is, (Isaiah 31:5) “Sparing (פסוח) and delivering”. (This is the explanation of Menachem ben Seruk). But I say that wherever the root פסח occurs it is an expression for leaping and springing over, so that ופסחתי here denotes that He sprang from the houses of the Israelites when He reached them, without having entered them, to the houses of the Egyptians — for they (the Egyptians and the Israelites) dwelt one next to the other. Of a like import is, (1 Kings 18:21) “How long will ye leap (פוסחים) upon two twigs?” So, too, all פסחים lame people walk as though they were springing, and are therefore termed פסחים. This, too, is the meaning of, (Isaiah 31:5) פסוח והמליט “He springs over him and delivers him” from amongst those who are being killed.<br><br>ולא יהיה בכם נגף AND THE INFLICTION SHALL NOT BE UPON YOU — but it will be upon the Egyptians. — In the case that an Egyptian was in an Israelite’s house one might think that he would escape! Therefore Scripture says: “and the infliction shall not be upon you”, but it shall be upon the Egyptians who happen to be in your houses! In the case that an Israelite was in an Egyptians house, I might understand from this that he would be smitten just the same as he (the Egyptian)! Therefore Scripture says, “and the affliction shall not be upon you”, wherever you may happen to be (Mekhilta)."}, {"ch": 12, "v": 14, "aliyah": 4, "heb": "וְהָיָה֩ הַיּ֨וֹם הַזֶּ֤ה לָכֶם֙ לְזִכָּר֔וֹן וְחַגֹּתֶ֥ם אֹת֖וֹ חַ֣ג לַֽיהֹוָ֑ה לְדֹרֹ֣תֵיכֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחׇגֻּֽהוּ׃", "onk": "וִיהֵי יוֹמָא הָדֵין לְכוֹן לְדוּכְרָנָא וּתְחַגוּן יָתֵהּ חַגָא <b>קֳדָם<\/b> יְיָ לְדָרֵיכוֹן קְיָם עָלָם תְּחַגֻנֵהּ:", "onk_en": "This day shall be for you a [day of] remembrance. You shall celebrate it as a festival to [<b>before<\/b>] Adonoy, throughout your generations. It is an eternal statute that you must celebrate it.", "pj": "וִיהֵי יוֹמָא הָדֵין לְכוֹן לְדוּכְרָנָא וּתְחַגּוּן יָתֵיהּ חַגָּא קֳדָם יְיָ לְדָרֵיכוֹן קְיַים עֲלָם תַּחֲגוּנֵיהּ", "pj_en": "And this day shall be to you for a memorial, and you shall celebrate it a festival before the Lord in your generations; by a perpetual statute shall you solemnize it.", "tj": "", "tj_en": "", "rashi": "<b>לזכרון.<\/b> לְדוֹרוֹת:<br><br><b>וחגתם אתו.<\/b> יוֹם שֶׁהוּא לְךָ לְזִכָּרוֹן אַתָּה חוֹגְגוֹ. וַעֲדַיִן לֹא שָׁמַעְנוּ אֵיזֶהוּ יוֹם הַזִּכָּרוֹן, תַּ\"לֹ \"זָכוֹר אֶת הַיּוֹם הַזֶּה אֲשֶׁר יְצָאתֶם\" (שמות י\"ג), לִמְּדָנוּ, שֶׁיּוֹם הַיְצִיאָה הוּא יוֹם שֶׁל זִכָּרוֹן. וְאֵי זֶה יוֹם יָצְאוּ? תַּ\"לֹ \"מִמָּחֳרַת הַפֶּסַח יָצְאוּ\" (במדבר ל\"ג), הֱוֵי אוֹמֵר יוֹם חֲמִשָּׁה עָשָׂר בְּנִיסָן הוּא שֶׁל יוֹם טוֹב, שֶׁהֲרֵי לֵיל חֲמִשָּׁה עָשָֹר אָכְלוּ אֶת הַפֶּסַח וְלַבֹּקֶר יָצְאוּ (מכילתא):<br><br><b>לדרתיכם וגו'.<\/b> שׁוֹמֵעַ אֲנִי מִעוּט דּוֹרוֹת שְׁנַיִם, תַּ\"לֹ \"חֻקַּת עוֹלָם תְּחָגֻּהוּ\" (שם):", "rashi_en": "לזכרון [AND THIS DAY SHALL BE UNTO YOU] FOR A MEMORIAL — in future generations (i. e. in the future).<br><br>וחגתם אתו AND YE SHALL CELEBRATE IT AS A FEAST— Scripture states: the day that is to serve you as a memorial, that day thou shalt celebrate as a feast, but we have not yet heard which is the day that is to be a memorial; therefore Scripture says (Exodus 13:3) “Remember (זכור) this day in which ye went out” and this teaches us that the day of the Exodus itself is the day which is to be the memorial (זכרון). Now, on which day did they go forth? Scripture states, (Numbers 33:3) “On the morrow after the Passover-sacrifice they went forth”. Thus you must say that the day of the fifteenth of Nisan is that of the Feast, for on the night of the fifteenth (i. e. what we would term the night following the day of the fourteenth) they ate the Passover-sacrifice, and consequently on the next morning they went forth (Mekhilta).<br><br>לדרתיכם וגו׳ [YE SHALL CELEBRATE IT] FOR YOUR GENERATIONS etc. — I might understand from this that it need be celebrated only for the minimum of a plurality of generations, viz., two; therefore Scripture goes on to state “an ordinance for ever shall ye celebrate it as feast” (Mekhilta)."}, {"ch": 12, "v": 15, "aliyah": 4, "heb": "שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּיּ֣וֹם הָרִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִבָּתֵּיכֶ֑ם כִּ֣י&thinsp;<b>׀<\/b> כׇּל־אֹכֵ֣ל חָמֵ֗ץ וְנִכְרְתָ֞ה הַנֶּ֤פֶשׁ הַהִוא֙ מִיִּשְׂרָאֵ֔ל מִיּ֥וֹם הָרִאשֹׁ֖ן עַד־י֥וֹם הַשְּׁבִעִֽי׃", "onk": "שִׁבְעַת יוֹמִין <b>פַּטִיר<\/b> תֵּיכְלוּן בְּרַם בְּיוֹמָא קַדְמָאָה <b>תְּבַטְלוּן<\/b> חֲמִירָא מִבָּתֵּיכוֹן אֲרֵי כָּל דְיֵכוּל חֲמִיעַ וְיִשְׁתֵּצֵי אֱנָשָׁא הַהוּא מִיִשְׂרָאֵל מִיוֹמָא קַדְמָאָה עַד יוֹמָא שְׁבִיעָאָה:", "onk_en": "You must eat matzos [<b>matzoh<\/b>] for seven days, but before the first day you must remove [<b>nullify<\/b>] [all] leaven from your homes; for anyone who eats chametz, that soul will be cut off from Yisrael. [Chametz is forbidden] from the first day [of Pesach] until [after] the seventh day.", "pj": "שַׁבְעַת יוֹמִין פַּטִּירָא תֵיכְלוּן בְּרַם מִפַּלְגוּת יוֹמָא דְמִיקַמֵּי חַגָּא תְבַטְּלוּן חָמִיר מִבָּתֵּיכוֹן אֲרוּם כָּל דְּיֵיכוּל חָמִיעַ וְיִשְׁתֵּיצֵי אֵינָשָׁא הַהוּא מִיִּשְרָאֵל לְמִיּוֹמָא קַדְמָאָה דְחַגָּא וְעַד יוֹמָא שְׁבִיעָאָה", "pj_en": "Seven days you shall eat unleavened bread: in the dividing of the day which precedes the feast you shall put away leaven from your houses; for whosoever eateth what is leavened, from the first day of the feast until the seventh day, that man shall be destroyed from Israel.", "tj": "", "tj_en": "", "rashi": "<b>שבעת ימים.<\/b> שטיינ\"א שֶׁל יָמִים:<br><br><b>שבעת ימים מצות תאכלו.<\/b> וּבְמָקוֹם אַחֵר הוּא אוֹמֵר \"שֵׁשֶׁת יָמִים תֹּאכַל מַצּוֹת\" (דברים ט\"ז) לִמֵּד עַל שְׁבִיעִי שֶׁל פֶּסַח שֶׁאֵינוֹ חוֹבָה לֶאֱכֹל מַצָּה, וּבִלְבַד שֶׁלֹּא יֹאכַל חָמֵץ; מִנַּיִן אַף שִׁשָּׁה רְשׁוּת? תַּ\"לֹ \"שֵׁשֶׁת יָמִים\". זוֹ מִדָּה בַתּוֹרָה, דָּבָר שֶׁהָיָה בִּכְלָל וְיָצָא מִן הַכְּלָל לְלַמֵּד, לֹא לְלַמֵּד עַל עַצְמוֹ בִּלְבַד יָצָא, אֶלָּא לְלַמֵּד עַל הַכְּלָל כֻּלּוֹ יָצָא, מַה שְּׁבִיעִי רְשׁוּת אַף שִׁשָּׁה רְשׁוּת; יָכוֹל אַף הַלַּיְלָה הָרִאשׁוֹן רְשׁוּת, תַּ\"לֹ \"בָּעֶרֶב תֹּאכְלוּ מַצֹּת\" – הַכָּתוּב קְבָעוֹ חוֹבָה (פסחים ק\"כ):<br><br><b>אך ביום הראשון תשביתו שאור.<\/b> מֵעֶרֶב יוֹם טוֹב, וְקָרוּי רִאשׁוֹן לְפִי שֶׁהוּא לִפְנֵי הַשִּׁבְעָה; וּמָצִינוּ מֻקְדָּם קָרוּי רִאשׁוֹן, \"הֲרִאישׁוֹן אָדָם תִּוָּלֵד\" (איוב ט\"ו) – הֲלִפְנֵי אָדָם נוֹלַדְתָּ; אוֹ אֵינוֹ אֶלָּא רִאשׁוֹן שֶׁל שִׁבְעָה? תַּ\"לֹ \"לֹא תִשְׁחַט עַל חָמֵץ וְגוֹ'\" (שמות ל\"ד) – לֹא תִשְׁחַט הַפֶּסַח וַעֲדַיִן חָמֵץ קַיָּם (פסחים ה'):<br><br><b>הנפש ההוא.<\/b> כְּשֶׁהִיא בְנַפְשָׁהּ וּבְדַעְתָּהּ – פְּרָט לְאָנוּס (מכילתא):<br><br><b>מישראל.<\/b> שׁוֹמֵעַ אֲנִי תִּכָּרֵת מִיִּשְׂרָאֵל וְתֵלֶךְ לָהּ לְעַם אַחֵר, תַּ\"לֹ בְּמָקוֹם אַחֵר \"מִלְּפָנַי\" (ויקרא כ\"ב) – בְּכָל מָקוֹם שֶׁהוּא רְשׁוּתִי:", "rashi_en": "שבעת ימים denotes a septaine (old French) of days.<br><br>שבעת ימים מצות תאכלו SEVEN DAYS SHALL YE EAT UNLEAVENED BREAD — But in another passage it slates: (Deuteronomy 16:8) “Six days shalt thou eat unleavened bread”! This teaches regarding the seventh day of the Passover that it is not obligatory to eat unleavened bread on it, but only this is required viz., that one should not eat leavened food. Whence may we derive that the other six days, too, are optinal as regards the eating of unleavened bread? From what Scripture states: “Six days [shalt thou eat unnleavened bread]”. For the following is a Rule by which the Torah may be expounded: Anything that is included in a general statement and goes out (i. e. Scripture singles it out) from this general statement for the purpose of teaching something, does not go out from it in order to teach something regarding itself alone but it goes out from it to teach something about everything that is included in the general statement. Now the seventh day is included in the general statement “Seven days shall ye eat unleavened bread”, and in the text “Six days shall thou eat unleavened bread” it has left the general statement. How is it with the seventh day? It is optional as regards the eating of unleavened bread, (as explained in the earlier portion of this comment)! This, according to the above rule, applies also to everything that was included in the general statement i. e. to the whole seven days, and therefore the other six days are also optional in this respect! One might think that the first night of the Passover is also optional (since it is part of the first day when as we have just shown the eating of unleavened bread is optional), therefore Scripture states, (v. 18) “at evening ye shall eat unleavened bread” Scripture thus fixes it as obligatory for that night (Pesachim 120a).<br><br>אך ביום הראשון תשביתו שאור EVEN THE FIRST DAY YE SHALL HAVE PUT AWAY LEAVEN — This means on the eve of the festival ye shall put it away — and that day is termed “the first (הראשון) day” because it is immediately before the seven days: We find in another passage, too, that a thing which precedes another is termed ראשון, as in (Job. 15:7) “Wast thou born ראשון Adam”, i. e. wast thou born before Adam? — But perhaps the text it referring only to the first of the seven days (i. e. the word ראשון has its ordinary meaning of first, and leavened food must be removed on the first day of the Festival and not on the preceding day)! Scripture, however, states: (Exodus 34:25) “Thou shalt not offer together with leaven [the blood of my sacrifice]” — i. e. thou shalt not slaughter the Passover sacrifice whilst leavened bread is still existent (but the Passover sacrifice was slaughtered on the afternoon of the day before the first day of the Festival; consequently all leavened food must have been removed by the hour of slaughter)(Mekhilta; cf. Pesachim 5a).<br><br>הנפש ההיא [FOR WHOSOEVER EATETH ANYTHING LEAVENED..] THAT SOUL [SHALL BE CUT OFF] — if it eats unleavened bread when it is in its will (נפש) and with its full consciousness — this would exclude one who does so being under some external compulsion (force majeure) (cf. Mekhilta).<br><br>מישראל [THAT SOUL SHALL BE CUT OFF] FROM ISRAEL — I might understand from this that he shall be cut off from Israel and that he will be able to betake himself to another nation! Scripture therefore states in another passage, (Leviticus 22:3) “[that soul shall be cut off] from my presence” — in every place that is My territory (i. e. everywhere) (Mekhilta)."}, {"ch": 12, "v": 16, "aliyah": 4, "heb": "וּבַיּ֤וֹם הָרִאשׁוֹן֙ מִקְרָא־קֹ֔דֶשׁ וּבַיּוֹם֙ הַשְּׁבִיעִ֔י מִקְרָא־קֹ֖דֶשׁ יִהְיֶ֣ה לָכֶ֑ם כׇּל־מְלָאכָה֙ לֹא־יֵעָשֶׂ֣ה בָהֶ֔ם אַ֚ךְ אֲשֶׁ֣ר יֵאָכֵ֣ל לְכׇל־נֶ֔פֶשׁ ה֥וּא לְבַדּ֖וֹ יֵעָשֶׂ֥ה לָכֶֽם׃", "onk": "וּבְיוֹמָא קַדְמָאָה מְעָרַע קַדִישׁ וּבְיוֹמָא שְׁבִיעָאָה מְעָרַע קַדִישׁ יְהֵי לְכוֹן כָּל עִיבִידָא לָא יִתְעֲבֵד בְּהוֹן בְּרַם דִי מִתְאֲכֵל לְכָל נְפַשׁ הוּא בִלְחוֹדוֹהִי יִתְעֲבֵד לְכוֹן:", "onk_en": "The first day shall be a holy assembly and the seventh day shall be a holy assembly to you. No work shall be done on them, only for [the preparation of food] which will be eaten by every person, that alone may be done for you.", "pj": "וּבְיוֹמָא קַדְמָאָה מְעָרַע קַדִּישׁ וּבְיוֹמָא שְׁבִיעָאָה מְעָרַע קַדִּישׁ יְהֵי לְכוֹן כָּל עֲבִידְתָּא לָא יִתְעֲבֵיד בְּהוֹן לְחוֹד מִן דְּיִתְעֲבֵד לְמֵיכַל כָּל נֶפֶשׁ אִיהוּ בִּלְחוֹדוֹי יִתְעֲבֵיד לְכוֹן", "pj_en": "And on the first day there shall be a holy congregation, and on the seventh day there shall be to you a holy congregation. No work shall be done among you, only that which must be done for every one's eating may be done by you.", "tj": "", "tj_en": "", "rashi": "<b>מקרא קדש.<\/b> מקרא שֵׁם דָּבָר; קְרָא אוֹתוֹ <b>קדש<\/b> לַאֲכִילָה וּשְׁתִיָּה וּכְסוּת (מכילתא):<br><br><b>לא יעשה בהם.<\/b> אֲפִלּוּ עַל יְדֵי אֲחֵרִים (שם):<br><br><b>הוא לבדו.<\/b> \"הוּא\" וְלֹא מַכְשִׁירָיו שֶׁאֶפְשָׁר לַעֲשׂוֹתָן מֵעֶרֶב יוֹם טוֹב (ביצה כ\"ח):<br><br><b>לכל נפש.<\/b> אֲפִלּוּ לִבְהֵמָה; יָכוֹל אַף לַגּוֹיִם, תַּלְמוּד לוֹמַר לָכֶם (מכילתא):", "rashi_en": "מקרא קדש — The word מקרא is an infinitive and the translation is, “And on the first day there shall be “a calling it holy”, which implies: call it holy in regard to eating and drinking and raiment (Mekhilta).<br><br>לא יעשה בהם NO WORK SHALL BE DONE ON THEM, even by the agency of others (cf. Mekhilta).<br><br>הוא לבדו THAT ALONE — that and not such acts preliminary to it (to the preparation of food) as it was possible to do on the eve of the Festival (Beitzah 28b).<br><br>לכל נפש BY EVERY BEING — even by cattle. One might think that also food may be prepared for non-Israelites! Scripture however states, (in this verse) לכם (i. e. לכל נפש לכם) for every being that belongs to you (the responsibility for feeding which belongs to you) (Mekhilta)."}, {"ch": 12, "v": 17, "aliyah": 4, "heb": "וּשְׁמַרְתֶּם֮ אֶת־הַמַּצּוֹת֒ כִּ֗י בְּעֶ֙צֶם֙ הַיּ֣וֹם הַזֶּ֔ה הוֹצֵ֥אתִי אֶת־צִבְאוֹתֵיכֶ֖ם מֵאֶ֣רֶץ מִצְרָ֑יִם וּשְׁמַרְתֶּ֞ם אֶת־הַיּ֥וֹם הַזֶּ֛ה לְדֹרֹתֵיכֶ֖ם חֻקַּ֥ת עוֹלָֽם׃", "onk": "וְתִטְרוּן יָת <b>פַּטִירָא<\/b> אֲרֵי בִּכְרַן יוֹמָא הָדֵין אַפֵּיקִית יָת חֵילֵיכוֹן מֵאַרְעָא דְמִצְרָיִם וְתִטְרוּן יָת יוֹמָא הָדֵין לְדָרֵיכוֹן קְיָם עָלָם:", "onk_en": "You must be vigilant regarding the matzos [<b>matzoh<\/b>], for on this very day I brought out your hosts from the land of Egypt. You must preserve this day for your generations, it is an eternal statute.", "pj": "וְתִטְרוּן יַת לִישָׁתָא דְּפַטִּירֵי אֲרוּם בִּכְרַן יוֹמָא הָדֵין הַנְפֵּיק יְיָ יַת חֵילֵיכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם וְתִטְרוּן יַת יוֹמָא הָדֵין לְדָרֵיכוֹן קְיַם עֲלָם", "pj_en": "And you shall observe the feast of the unleavened bread, because in this same day the Lord will bring out your hosts free from the land of Mizraim; and you shall observe this day in your generations, a statute for ever.", "tj": "", "tj_en": "", "rashi": "<b>ושמרתם את המצות.<\/b> שֶׁלֹּא יָבֹאוּ לִידֵי חִמּוּץ; מִכָּאן אָמְרוּ תָּפַח תִּלְטֹשׁ בְּצוֹנֵן, רַבִּי יֹאשִׁיָּה אוֹמֵר אַל תְּהִי קוֹרֵא אֶת הַמַּצּוֹת, אֶלָּא אֶת הַמִּצְווֹת – כְּדֶרֶךְ שֶׁאֵין מַחֲמִיצִין אֶת הַמַּצָּה, כָּךְ אֵין מַחֲמִיצִין אֶת הַמִּצְוָה, אֶלָּא אִם בָּאָה לְיָדְךָ, עֲשֵׂה אוֹתָהּ מִיָּד (שם):<br><br><b>ושמרתם את היום הזה.<\/b> מִמְּלָאכָה:<br><br><b>לדרתיכם חקת עולם.<\/b> לְפִי שֶׁלֹּא נֶאֱמַר <b>דורות<\/b> וְ<b>חקת עולם<\/b> עַל הַמְּלָאכָה אֶלָּא עַל הַחֲגִיגָה, לְכָךְ חָזַר וּשְׁנָאוֹ כָּאן, שֶׁלֹּא תֹאמַר אַזְהָרַת <b>כל מלאכה לא יעשה<\/b> לֹא לְדוֹרוֹת נֶאֶמְרָה אֶלָּא לְאוֹתוֹ הַדּוֹר:", "rashi_en": "ושמרתם את המצות AND YE SHALL WATCH THE UNLEAVENED BREAD that it shall not reach the stage of becoming leavened; hence the Rabbis said, if it (the dough) is rising (a sign that the leavening process is setting in) she (the woman kneading the dough) polishes it with cold water (i. e. she slaps the dough with hands dipped in cold water). Rabbi Josiah said: Do not read “את המַּצּוֹת”, the unleavened bread, but את הַמִּצְוֹת “[ye shall watch] the commandements” — just as we may not cause the unleavened bread to become leavened by letting the dough remain in its raw state too long so we may not let the commandment become “leavened” by waiting too long before we perform it; but if it (a commandment) comes to your hand, perform it immediately (Mekhilta).<br><br>ושמרתם את היום הזה AND YE SHALL GUARD THIS DAY — against work,<br><br>לדרתיכם חקת עולם THROUGHOUT YOUR GENERATIONS, AN ORDINANCE FOR EVER — Because the expressions, “[throughout your] generations”, and “an ordinance for ever” have not been mentioned in connection with the prohibition of work but only in reference to the celebration of the Festival (v. 14), it is therefore repeated here in order that you should not say: the prohibition, (v. 16) “no work shall be done”, was not spoken for future generations but for that generation alone to whom the words were addressed."}, {"ch": 12, "v": 18, "aliyah": 4, "heb": "בָּרִאשֹׁ֡ן בְּאַרְבָּעָה֩ עָשָׂ֨ר י֤וֹם לַחֹ֙דֶשׁ֙ בָּעֶ֔רֶב תֹּאכְל֖וּ מַצֹּ֑ת עַ֠ד י֣וֹם הָאֶחָ֧ד וְעֶשְׂרִ֛ים לַחֹ֖דֶשׁ בָּעָֽרֶב׃", "onk": "<b>בְּנִיסָן<\/b> בְּאַרְבְּעָא עַסְרָא יוֹמָא לְיַרְחָא בְּרַמְשָׁא תֵּיכְלוּן <b>פַּטִירָא<\/b> עַד יוֹמָא עֶסְרִין וְחַד לְיַרְחָא בְּרַמְשָׁא:", "onk_en": "In the first [month] [<b>Nisan<\/b>] on the fourteenth day of the month, in the evening you shall eat matzos [<b>matzoh<\/b>]; until the twenty-first day of the month in the evening.", "pj": "בְּנִיסָן בְּאַרְבֵּיסַר יוֹמִין לְיַרְחָא תִּכְסוּן יַת פִּסְחָא וּבְרַמְשָׁא דְּחַמְסַר תֵּיכְלוּן פַּטִּירֵי עַד יוֹמָא דְעַשְרִין וְחַד לְיַרְחָא בְּרַמְשָׁא דְעַשְרִין וּתְרֵין תֵּיכְלוּן חָמִיעַ", "pj_en": "In Nisan, on the fourteenth day of the month, you shall kill the passover, and at evening on the fifteenth you shall eat unleavened bread until the twenty-first of the month. On the evening of the twenty-second you may eat leavened bread.", "tj": "", "tj_en": "", "rashi": "<b>עד יום האחד ועשרים.<\/b> לָמָּה נֶאֱמַר? וַהֲלֹא כְּבָר נֶאֱמַר \"שִׁבְעַת יָמִים\"? לְפִי שֶׁנֶּאֱמַר יָמִים, לֵילוֹת מִנַּיִן? תַּ\"לֹ <b>עד יום האחד ועשרים וגו'<\/b> (מכילתא):", "rashi_en": "עד יום האחד ועשרים UNTIL THE TWENTY-FIRST DAY — Why is this stated? Has it not already been stated, (v. 15) “Seven days [shall ye eat unleavened bread]” (beginning on the fifteenth day, as Rashi shows in his comment on v. 14 and therefore terminating on the twenty-first)? The answer is: Since it is said in that verse, “[seven] days [shalt thou eat unleavened bread]”, we may ask whence do we derive that the prohibition of eating leavened bread extends also to the nights of these seven days? Scripture therefore states here, “[Ye shall eat unleavened bread] until the twenty-first-day in the evening” (Mekhilta)."}, {"ch": 12, "v": 19, "aliyah": 4, "heb": "שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּבָתֵּיכֶ֑ם כִּ֣י&thinsp;<b>׀<\/b> כׇּל־אֹכֵ֣ל מַחְמֶ֗צֶת וְנִכְרְתָ֞ה הַנֶּ֤פֶשׁ הַהִוא֙ מֵעֲדַ֣ת יִשְׂרָאֵ֔ל בַּגֵּ֖ר וּבְאֶזְרַ֥ח הָאָֽרֶץ׃", "onk": "שִׁבְעַת יוֹמִין חֲמִיר לָא יִשְׁתְּכַח בְּבָתֵּיכוֹן אֲרֵי כָּל דְיֵכוּל מַחְמְעָא וְיִשְׁתֵּצֵי אֱנָשָׁא הַהוּא מִכְּנִשְׁתָּא דְיִשְׂרָאֵל בְּגִיוֹרָא וּבְיַצִיבָא דְאַרְעָא:", "onk_en": "For seven days leaven may not be found in your homes, for whoever eats chametz that soul shall be cut off from the community of Israel, whether a proselyte or a native born in the land.", "pj": "שׁוּבְעָא יוֹמִין חָמִיר לָא יִשְׁתְּכַח בְּבָתֵּיכוֹן אֲרוּם כָּל מַאן דְּיֵיכוּל מַחְמְעָא וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא מִכְּנִשְׁתָּא דְיִשְרָאֵל בְּדִיוֹרֵי וּבְיַצִּיבֵי דְאַרְעָא", "pj_en": "For seven days leaven shall not be found in your houses; for whosoever eateth of leaven, that man shall perish from the congregation of Israel, whether he be a stranger or home-bred in the land.", "tj": "", "tj_en": "", "rashi": "<b>לא ימצא בבתיכם.<\/b> מִנַּיִן לַגְּבוּלִין? תַּלְמוּד לֹוֹמַר \"בְּכָל גְּבוּלֶךָ\" (שמות י\"ג); מַה תַּ\"לֹ בְּבָתֵּיכֶם? מַה בֵּיתְךָ בִּרְשׁוּתְךָ, אַף גְּבוּלְךָ שֶׁבִּרְשׁוּתְךָ, יָצָא חֲמֵצוֹ שֶׁל נָכְרִי שֶׁהוּא אֵצֶל יִשְׂרָאֵל וְלֹא קִבֵּל עָלָיו אַחֲרָיוּת (מכילתא):<br><br><b>כי כל אכל מחמצת.<\/b> לַעֲנֹשׁ כָּרֵת עַל הַשְּׂאוֹר, וַהֲלֹא כְבָר עָנַשׁ עַל הֶחָמֵץ? אֶלָּא שֶׁלֹּא תֹאמַר חָמֵץ שֶׁרָאוּי לַאֲכִילָה עָנַשׁ עָלָיו, שְׂאוֹר שֶׁאֵינוֹ רָאוּי לַאֲכִילָה לֹא יֵעָנֵשׁ עָלָיו; וְאִם עָנַשׁ עַל הַשְּׂאוֹר וְלֹא עָנַשׁ עַל הֶחָמֵץ, הָיִיתִי אוֹמֵר, שְׂאוֹר שֶׁהוּא מְחַמֵּץ אֲחֵרִים עָנַשׁ עָלָיו, חָמֵץ שֶׁאֵינוֹ מְחַמֵּץ אֲחֵרִים לֹא יֵעָנשׁ עָלָיו, לְכָךְ נֶאֶמְרוּ שְׁנֵיהֶם (מכילתא):<br><br><b>בגר ובאזרח הארץ.<\/b> לְפִי שֶׁהַנֵּס נַעֲשָׂה לְיִשְׂרָאֵל, הֻצְרַךְ לְרַבּוֹת אֶת הַגֵּרִים (שם):", "rashi_en": "לא ימצא בבתיכם NO LEAVEN SHALL BE FOUND IN YOUR HOUSES — Whence may we derive that this applies also to the external properties which belong to you? From what Scripture states, (Exodus 13:7) “[Neither shall leaven be seen with thee] in all thy boundaries”. If this be so, why then need Scripture specify here “in your houses” (since this term is comprised in the more general term “in all thy boundaries”)? It is for the purpose of defining the latter term through the former. How is it the case of thy house? Everything contained in it is under thy control! So, too, the term “[leaven in all] your boundaries” means only such leaven as is in your boundaries and under your control, thereby excluding such leaven belonging to a non-Israelite as is deposited with an Israelite but for which he has accepted no responsibility (Mekhilta).<br><br>כי כל אכל מחמצת FOR WHOSOEVER EATETH THAT WHICH LEAVENETH — The purpose of this statement is to mention the punishment of excision for eating שאור (a synonym for מחמצת, which is something that causes the leavening process to set in, such as yeast etc., whilst חמץ denotes food which has become leavened). But has not Scripture already mentioned this punishment for eating leavened food (v. 15)? But the mention of this punishment is repeated here in connection with leaven מחמצת, in order that you should not argue as follows: For eating leavened food — a thing which is fitted to be eaten — it mentions this punishment, but if one eats leaven itself — which is something not fitted to be eaten — one should not be punished for it. If, however, it had mentioned the punishment for eating leaven but had not mentioned the punishment for eating leavened food, I might have said: For eating leaven — a thing which has the property of making other things leavened — it mentions the punishment, but if one eats leavened food — which is something that does not possess the property of making other things leavened — one should not be punished for it; therefore they are both mentioned (Mekhilta; cf. Beitzah 7b).<br><br>בגר ובאזרח הארץ WHETHER HE BE A STRANGER OR A NATIVE OF THE LAND — Because the miracle of the Exodus was performed for Israel it is necessary expressly to include the stranger who has become an Israelite in this command (Mekhilta)."}, {"ch": 12, "v": 20, "aliyah": 4, "heb": "כׇּל־מַחְמֶ֖צֶת לֹ֣א תֹאכֵ֑לוּ בְּכֹל֙ מוֹשְׁבֹ֣תֵיכֶ֔ם תֹּאכְל֖וּ מַצּֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "כָּל מַחְמְעָא לָא תֵיכְלוּן בְּכֹל מוֹתְבָנֵיכוֹן תֵּיכְלוּן <b>פַּטִירָא<\/b>:", "onk_en": "You must not eat anything that is chametz. In all your dwellings you shall eat matzos [<b>matzoh<\/b>].", "pj": "כָּל עַרְבִיבֵי דִּמְחָמַע לָא תֵיכְלוּן בְּכָל אֲתַר מוֹתְבָנֵיכוֹן תֵּיכְלוּן פַּטִירֵי", "pj_en": "Any mixture of leaven you shall not eat; in every place of your habitation you shall eat unleavened bread.", "tj": "", "tj_en": "", "rashi": "<b>מחמצת לא תאכלו.<\/b> אַזְהָרָה עַל אֲכִילַת שְׂאוֹר:<br><br><b>כל מחמצת.<\/b> לְהָבִיא אֶת תַּעֲרָבְתּוֹ:<br><br><b>בכל מושבתיכם תאכלו מצות.<\/b> זֶה בָא לְלַמֵּד שֶׁתְּהֵא רְאוּיָה לְהֵאָכֵל בְּכָל מוֹשְׁבֹתֵיכֶם, פְּרָט לְמַעֲשֵׂר שֵׁנִי וְחַלּוֹת תּוֹדָה (מכילתא):", "rashi_en": "מחמצת לא תאכלו THAT WHICH LEAVENETH YE SHALL NOT EAT — Here we have the prohibition regarding eating שאור (that which causes food to become leavened).<br><br>כל מחמצת [YE SHALL NOT EAT] ANYTHING THAT LEAVENETH — The use of the word כל, anything (even in the smallest degree), is intended to include food with which it (שאור) is mixed (Mekhilta).<br><br>בכל מושבתיכם תאכלו מצות IN ALL YOUR HABITATIONS SHALL YE EAT UNLEAVENED BREAD — This statement is intended to teach that it (the unleavened bread which you must eat on the first night of Passover) must be fitted to be eaten in all your habitations, thus excluding leavened bread which forms “the second tithe” and the unleavened meal cakes brought with the thanksgiving offering (which might be eaten only within the walls of Jerusalem) (Mekhilta)."}, {"ch": 12, "v": 21, "aliyah": 5, "heb": "וַיִּקְרָ֥א מֹשֶׁ֛ה לְכׇל־זִקְנֵ֥י יִשְׂרָאֵ֖ל וַיֹּ֣אמֶר אֲלֵהֶ֑ם מִֽשְׁכ֗וּ וּקְח֨וּ לָכֶ֥ם צֹ֛אן לְמִשְׁפְּחֹתֵיכֶ֖ם וְשַׁחֲט֥וּ הַפָּֽסַח׃", "onk": "וּקְרָא משֶׁה לְכָל סָבֵי יִשְׂרָאֵל וַאֲמַר לְהוֹן נְגִידוּ וְסִיבוּ לְכוֹן (מִן בְּנֵי) עָנָא לְזַרְעֲיָתְכוֹן וְכוּסוּ פִסְחָא:", "onk_en": "Moshe called to all the elders of Yisrael, and he said to them, “Draw [from your flocks] or purchase for yourselves a lamb for your families and slaughter it as a Pesach offering.", "pj": "וּקְרָא משֶׁה לְכָל סָבֵי יִשְרָאֵל וַאֲמַר לְהוֹן נְגוּדוּ יְדֵיכוֹן מִטַּעֲוַות מִצְרָאֵי וּסְבוּ לְכוֹן מִן בְּנֵי עָנָא לְיִיחוּסֵיכוֹן וְכוּסוּ אִימַר פִּסְחָא", "pj_en": "And Mosheh called all the elders of Israel, and said to them, Withdraw your hands from the idols of the Mizraee, and take to you from the offspring of the flock, according to your houses, and kill the paschal lamb.", "tj": "", "tj_en": "", "rashi": "<b>משכו.<\/b> מִי שֶׁיֵּשׁ לוֹ צֹאן יִמְשֹׁךְ מִשֶּׁלּוֹ:<br><br><b>וקחו.<\/b> מִי שֶׁאֵין לוֹ יִקַּח מִן הַשּׁוּק (שם):<br><br><b>למשפחתיכם.<\/b> שֶׂה לְבֵית אָבוֹת:", "rashi_en": "משכו DRAW OUT — He who has sheep let him draw one out from his own,<br><br>וקחו OR TAKE, and he who has no sheep let him purchase one in the market (Mekhilta).<br><br>למשפחתיכם [A LAMB] ACCORDING TO YOUR FAMILIES — this corresponds to שה לבית אבות a lamb for the house of their fathers in verse 3."}, {"ch": 12, "v": 22, "aliyah": 5, "heb": "וּלְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּטְבַלְתֶּם֮ בַּדָּ֣ם אֲשֶׁר־בַּסַּף֒ וְהִגַּעְתֶּ֤ם אֶל־הַמַּשְׁקוֹף֙ וְאֶל־שְׁתֵּ֣י הַמְּזוּזֹ֔ת מִן־הַדָּ֖ם אֲשֶׁ֣ר בַּסָּ֑ף וְאַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִפֶּֽתַח־בֵּית֖וֹ עַד־בֹּֽקֶר׃", "onk": "וְתִסְבוּן אֱסָרַת אֵזוֹבָא וְתִטְבְּלוּן בִּדְמָא דִבְמָנָא <b>וְתַדוּן<\/b> לְשַׁקְפָא וְלִתְרֵין סִפַּיָא מִן דְמָא דִבְמָנָא וְאַתּוּן לָא תִפְּקוּן אֱנַשׁ מִתְּרַע בֵּיתֵהּ עַד צַפְרָא:", "onk_en": "Take a bunch of hyssop, and dip it in the blood that is in the basin. Touch [<b>Sprinkle<\/b>] the lintel and the two side [door] posts with some of the blood in the basin. And all of you, let no man go out the door of his house until morning.", "pj": "וְתִסְבוּן אֵיסָרַת אֵזוֹבָא וְתִטְמְשׁוּן בְּדָמָא דִבְמַן פַּחֲרָא וְתַדוּן לְאִיסְקוֹפָא עִלָּאָה מִלְּבַר וּלְתַרְתֵּין סִפַּיָא מִן דְּמָא דִבְמַן פַּחֲרָא וְאַתּוּן לָא תִפְקוּן אֱנַשׁ מִן תְּרַע בֵּיתֵיהּ עַד צַפְרָא", "pj_en": "And you shall take a bunch of hyssop, and dip it in the blood that is in the earthen vessel, and upon the upper bar without and upon the two posts you shall sprinkle of the blood which is in the earthen vessel, and not a man of you must come forth from the door of his hour till the morning.", "tj": "", "tj_en": "", "rashi": "<b>אזוב.<\/b> מִין יָרָק שֶׁיֵּשׁ לוֹ גִּבְעוֹלִין:<br><br><b>אגדת אזוב.<\/b> שְׁלוֹשָׁה קְלָחִין קְרוּיִין אֲגֻדָּה (שבת ק\"ט):<br><br><b>אשר בסף.<\/b> בַּכְּלִי, כְּמוֹ סִפּוֹת כֶּסֶף:<br><br><b>מן הדם אשר בסף.<\/b> לָמָּה חָזַר וּשְׁנָאוֹ? שֶׁלֹּא תֹאמַר טְבִילָה אַחַת לִשְׁלוֹשׁ הַמַּתָּנוֹת, לְכָךְ נֶאֱמַר עוֹד אֲשֶׁר בַּסַּף, וְשֶׁתְּהֵא כָל נְתִינָה וּנְתִינָה מִן הַדָּם אֲשֶׁר בַּסַּף, עַל כָּל הַגָּעָה טְבִילָה (מכילתא):<br><br><b>ואתם לא תצאו וגו'.<\/b> מַגִּיד, שֶׁמֵּאַחַר שֶׁנִּתְּנָה רְשׁוּת לַמַּשְׁחִית לְחַבֵּל, אֵינוֹ מַבְחִין בֵּין צַדִּיק לְרָשָׁע (שם); וְלַיְלָה רְשׁוּת לַמְחַבְּלִים הוּא, שֶׁנֶּאֱמַר \"בּוֹ תִרְמֹשׂ כָּל חַיְתוֹ יָעַר\" (תהלים ק\"ד):", "rashi_en": "אזוב HYSSOP — a kind of herb which has thin stalks.<br><br>אגדת אזוב A BUNCH OF HYSSOP — three stalks are called a bunch (cf. Shabbat 109b; Sukkah 13a).<br><br>אשר בסף means WHICH IS IN THE VESSEL, as in (2 Kings 12:14) “basins (ספות) of silver.”<br><br>מן הדם אשר בסף WITH THE BLOOD WHICH IS IN THE BASIN — Why does Scripture repeat this (אשר בסף) again? In order that you should not say that one dipping of the hyssop in the basin suffices for the three sprinklings, therefore it is again stated: “[you shall touch the lintel…] “with the blood that is in the basin”, to show that each separate sprinkling must be with the blood which is in the basin — for each touching of the lintel and doorposts there must be a separate dipping (Mekhilta).<br><br>ואתם לא תצאו וגו׳ AND NONE OF YOU SHALL GO OUT etc. — This tells us that when once permission is given to the destroying angel to wound he makes no distinction between righteous and wicked (Mekhilta) — and nighttime is the domain of the destroying agencies as it is said, (Psalms 104:20) “[Thou makest darkness and it is night], wherein all the beasts of the forest creep forth”."}, {"ch": 12, "v": 23, "aliyah": 5, "heb": "וְעָבַ֣ר יְהֹוָה֮ לִנְגֹּ֣ף אֶת־מִצְרַ֒יִם֒ וְרָאָ֤ה אֶת־הַדָּם֙ עַל־הַמַּשְׁק֔וֹף וְעַ֖ל שְׁתֵּ֣י הַמְּזוּזֹ֑ת וּפָסַ֤ח יְהֹוָה֙ עַל־הַפֶּ֔תַח וְלֹ֤א יִתֵּן֙ הַמַּשְׁחִ֔ית לָבֹ֥א אֶל־בָּתֵּיכֶ֖ם לִנְגֹּֽף׃", "onk": "<b>וְיִתְגְלֵי<\/b> יְיָ לְמִמְחֵי יָת מִצְרַיִם וְיֶחֱזֵי יָת דְמָא עַל שַׁקְפָא וְעַל תְּרֵין סִפַּיָא <b>וְיֵחוֹס<\/b> יְיָ עַל תַּרְעָא וְלָא יִשְׁבּוֹק לְחַבָּלָא לְמֵיעַל לְבָתֵּיכוֹן לְמִמְחֵי:", "onk_en": "Adonoy will pass through [<b>become revealed<\/b>] to plague the Egyptians and He will see the blood on the lintel and on the two side [door] posts. Adonoy will then pass over [<b>have mercy upon<\/b>] that door and will not allow the destroyer to enter your houses to plague you.", "pj": "וְיִתְגְּלֵי יְקָרָא דַיְיָ לְמִימְחֵי יַת מִצְרָאֵי וְיֶחֱמֵי יַת אַדְמָא דְעַל אִסְקוֹפָא וְעַל תַּרְתֵּין סִיפַיָא וְיָגִין מֵימְרָא דַיְיָ עַל תַּרְעָא וְלָא יִשְׁבּוֹק מַלְאָכָא מְחַבְּלָא לְמֵיעוֹל לְבָתֵּיכוֹן לְמִימְחֵי", "pj_en": "For the Glory of the Lord will be manifested in striking the Mizraee, and He will see the blood upon the lintel and upon the too posts, and the Word of the Lord will spread His protection over the door, and the destroying angel will not be permitted to enter your houses to smite.", "tj": "", "tj_en": "", "rashi": "<b>ופסח.<\/b> וְחָמַל, וְיֵשׁ לוֹמַר וְדִלֵּג:<br><br><b>ולא יתן המשחית.<\/b> וְלֹא יִתֵּן לוֹ יְכֹלֶת לָבֹא, כְּמוֹ \"וְלֹא נְתָנוֹ אֱלֹהִים לְהָרַע עִמָּדִי\" (בראשית ל\"א):", "rashi_en": "ופסח signifies AND HE WILL SPARE; and one can also explain it to mean, “and He will leap over them” (cf. Rashi on v. 13 and on Isaiah 30:5).<br><br>ולא יתן המשחית AND HE WILL NOT GIVE THE DESTROYER He will not give him power to come in. The phrase is similar to (Genesis 31:9) “And God did not suffer him (נתנו — give him the power) to do me evil”."}, {"ch": 12, "v": 24, "aliyah": 5, "heb": "וּשְׁמַרְתֶּ֖ם אֶת־הַדָּבָ֣ר הַזֶּ֑ה לְחׇק־לְךָ֥ וּלְבָנֶ֖יךָ עַד־עוֹלָֽם׃", "onk": "וְתִטְרוּן יָת פִּתְגָמָא הָדֵין לִקְיָם לָךְ וְלִבְנָיךְ עַד עָלָם:", "onk_en": "You must preserve this [ritual] as a statute for you and your children forever.", "pj": "וְתִיטְרוּן יַת פִּתְגָמָא הָדֵין לִקְיַם לָךְ וְלִבְנָךְ דְּכוּרַיָא עַד עַלְמָא", "pj_en": "And you shall observe this thing for a statute to thee and to thy sons for a memorial for ever.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 25, "aliyah": 5, "heb": "וְהָיָ֞ה כִּֽי־תָבֹ֣אוּ אֶל־הָאָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהֹוָ֛ה לָכֶ֖ם כַּאֲשֶׁ֣ר דִּבֵּ֑ר וּשְׁמַרְתֶּ֖ם אֶת־הָעֲבֹדָ֥ה הַזֹּֽאת׃", "onk": "וִיהֵי אֲרֵי תֵעֲלוּן לְאַרְעָא דְיִתֵּן יְיָ לְכוֹן כְּמָא דִי מַלִיל וְתִטְרוּן יָת פָּלְחָנָא הָדֵין:", "onk_en": "When you come to the land that Adonoy will give to you, as He spoke, you must preserve this service.", "pj": "וִיהֵי אֲרוּם תַּעֲלוּן לְאַרְעָא דְּעָתִיד לְמִתַּן לְכוֹן יְיָ הֵיכְמָא דְמַלֵּיל וְתִיטְרוּן מִזְמַן דְּתִמְטוֹן לְתַמָּן יַת פּוּלְחָנָא הֲדָא", "pj_en": "And it shall be when you are come into the land that the Lord will give to you, as He hath spoken, that from the time of your coming you shall observe this service.", "tj": "", "tj_en": "", "rashi": "<b>והיה כי תבאו אל הארץ.<\/b> תָּלָה הַכָּתוּב עֲבוֹדָה זוֹ בְּבִיאָתָם לָאָרֶץ, וְלֹא נִתְחַיְּבוּ בַמִּדְבָּר אֶלָּא פֶּסַח אֶחָד שֶׁעָשׂוּ בַשָּׁנָה הַשֵּׁנִית עַל פִּי הַדִּבּוּר:<br><br><b>כאשר דבר.<\/b> וְהֵיכָן דִּבֵּר? \"וְהֵבֵאתִי אֶתְכֶם אֶל הָאָרֶץ וְגוֹ'\" (שמות ו'):", "rashi_en": "והיה כי תבאן אל הארץ AND IT SHALL COME TO PASS WHEN YE BE COME TO THE LAND — Scripture makes the observance of this service dependent upon their entrance into the land of Palestine (Mekhilta), and they were not under any obligation, when in the wilderness, to keep more than the one Passover which they kept in the second year after the Exodus (cf. Numbers 9:1—5), and that, too, only in consequence of a special divine communication. (Cf. Rashi on Numbers 9:1 and כאשר דבר (תוס׳ קיד׳ ל\"ז ע\"ב ד\"ה הואיל<br><br>ACCORDING AS HE SPAKE — And where did He say that He would give them that land? In the following verse: (Exodus 6:8) “And I will bring you into the land” (Mekhilta)."}, {"ch": 12, "v": 26, "aliyah": 5, "heb": "וְהָיָ֕ה כִּֽי־יֹאמְר֥וּ אֲלֵיכֶ֖ם בְּנֵיכֶ֑ם מָ֛ה הָעֲבֹדָ֥ה הַזֹּ֖את לָכֶֽם׃", "onk": "וִיהֵי אֲרֵי יֵימְרוּן לְכוֹן בְּנֵיכוֹן מָא פָּלְחָנָא הָדֵין לְכוֹן:", "onk_en": "When your children will ask you, “What is this service of yours?”", "pj": "וִיהֵי אֲרוּם יֵימְרוּן לְכוֹן בְּנֵיכוֹן בְּזִמְנָא הַהוּא מַה פּוּלְחָנָא הָדָא לְכוֹן", "pj_en": "And it shall be that when at that time your children shall say to you, What is this your service?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 27, "aliyah": 5, "heb": "וַאֲמַרְתֶּ֡ם זֶֽבַח־פֶּ֨סַח ה֜וּא לַֽיהֹוָ֗ה אֲשֶׁ֣ר פָּ֠סַ֠ח עַל־בָּתֵּ֤י בְנֵֽי־יִשְׂרָאֵל֙ בְּמִצְרַ֔יִם בְּנׇגְפּ֥וֹ אֶת־מִצְרַ֖יִם וְאֶת־בָּתֵּ֣ינוּ הִצִּ֑יל וַיִּקֹּ֥ד הָעָ֖ם וַיִּֽשְׁתַּחֲוֽוּ׃", "onk": "וְתֵימְרוּן דַבַּח <b>חֲיָס<\/b> הוּא <b>קֳדָם<\/b> יְיָ דִי <b>חָס<\/b> עַל בָּתֵּי בְנֵי יִשְׂרָאֵל בְּמִצְרַיִם כַּד הֲוָה מָחֵי יָת מִצְרָאֵי וְיָת בָּתָּנָא שֵׁזִיב וּכְרַע עַמָא וּסְגִידוּ:", "onk_en": "You shall say, “It is the Pesach-offering [<b>of compassion<\/b>] to [<b>before<\/b>] Adonoy Who passed over [<b>had mercy upon<\/b>] the houses of the B’nei Yisrael in Egypt when He struck the Egyptians and saved our homes. The people then bowed and prostrated themselves.", "pj": "וְתֵימְרוּן נִכְסַת חַיְיסָא הוּא קֳדָם יְיָ דְחַס בְּמֵימְרֵיהּ עַל בָּתֵּי בְּנֵי יִשְרָאֵל בְּמִצְרַיִם בְּחַבְּלוּתֵיהּ יַת מִצְרָאֵי וְיַת בָּתָּנָא שֵׁיזִיב וְכַד שָׁמְעוּ בֵּית יִשְרָאֵל יַת פִּתְגָמָא הָדֵין מִפּוּם משֶׁה גָּחְנוּ וּסְגִידוּ", "pj_en": "You shall say, It is the sacrifice of mercy before the Lord, who had mercy in His Word upon the houses of the sons of Israel in Mizraim, when He destroyed the Mizraee, and spared our houses. And when the house of Israel heard this word from the mouth of Mosheh, they bowed and worshipped.", "tj": "", "tj_en": "", "rashi": "<b>ויקד העם.<\/b> עַל בְּשׂוֹרַת הַגְּאֻלָּה וּבִיאַת הָאָרֶץ וּבְשׂוֹרַת הַבָּנִים שֶׁיִּהְיוּ לָהֶם:", "rashi_en": "ויקד העם AND THE PEOPLE BOWED THE HEAD in thanksgiving for the tidings of the approaching deliverance and for the promise of their coming into the land, and for the tidings regarding the children whom they would have (since v. 26 implies that they would be blessed with children)."}, {"ch": 12, "v": 28, "aliyah": 5, "heb": "וַיֵּלְכ֥וּ וַֽיַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּאֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֶת־מֹשֶׁ֥ה וְאַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲזָלוּ וַעֲבָדוּ בְּנֵי יִשְׂרָאֵל כְּמָא דְפַקִיד יְיָ יָת משֶׁה וְאַהֲרֹן כֵּן עֲבָדוּ:", "onk_en": "The B’nei Yisrael went and did as Adonoy commanded Moshe and Aharon. They [also] did so.", "pj": "וַאֲזָלוּ וַעֲבָדוּ בְּנֵי יִשְרָאֵל הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה וְיַת אַהֲרן הֵיכְדֵין אִיזְדַרְזוּ וַעֲבָדוּ", "pj_en": "And the sons of Israel went and did as the Lord com-manded Mosheh and Aharon, so did they hasten and do.", "tj": "", "tj_en": "", "rashi": "<b>וילכו ויעשו בני ישראל.<\/b> וְכִי כְּבָר עָשׂוּ, וַהֲלֹא מֵרֹאשׁ חֹדֶשׁ נֶאֱמַר לָהֶם? אֶלָּא מִכֵּיוָן שֶׁקִּבְּלוּ עֲלֵיהֶם מַעֲלֶה עֲלֵיהֶם הַכָּתוּב כְּאִלּוּ עָשׂוּ (מכילתא):<br><br><b>וילכו ויעשו.<\/b> אַף הַהֲלִיכָה מָנָה הַכָּתוּב, לִתֵּן שָׂכָר לַהֲלִיכָה וְשָׂכָר לַעֲשִׂיָּה (שם):<br><br><b>כאשר צוה ה' את משה ואהרן.<\/b> לְהַגִּיד שִׁבְחָן שֶׁל יִשְׂרָאֵל שֶׁלֹּא הִפִּילוּ דָּבָר מִכָּל מִצְווֹת מֹשֶׁה וְאַהֲרֹן, וּמַהוּ <b>כן עשו<\/b>? אַף מֹשֶׁה וְאַהֲרֹן כֵּן עָשׂוּ (שם):", "rashi_en": "וילכו ויעשו בני ישראל AND THE CHILDREN OF ISRAEL WENT AND DID — But did they really do this at once — was not all this spoken to them at the beginning of the month (cf. Rashi on v. 3) and they carried out the command only on the tenth and the fourteenth? But the explanation is: so soon as they had taken these duties upon themselves Scripture accounts it unto them as though they had already performed them (Mekhilta).<br><br>וילכו ויעשו THEY WENT AND DID — Scripture enumerates their going also, to give them a reward for going and a reward for doing (Mekhilta).<br><br>כאשר צוה ה' את משה ואהרן [THEY DID] AS THE LORD HAD COMMANDED MOSES AND AARON — This is stated for the purpose of declaring Israel’s praise — that they did not omit a single matter of all the commandments of Moses and Aaron. And what is the meaning of כן עשו SO DID THEY? Moses and Aaron also did thus!(Mekhilta)."}, {"ch": 12, "v": 29, "aliyah": 6, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> בַּחֲצִ֣י הַלַּ֗יְלָה וַֽיהֹוָה֮ הִכָּ֣ה כׇל־בְּכוֹר֮ בְּאֶ֣רֶץ מִצְרַ֒יִם֒ מִבְּכֹ֤ר פַּרְעֹה֙ הַיֹּשֵׁ֣ב עַל־כִּסְא֔וֹ עַ֚ד בְּכ֣וֹר הַשְּׁבִ֔י אֲשֶׁ֖ר בְּבֵ֣ית הַבּ֑וֹר וְכֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׃", "onk": "וַהֲוָה בְּפַלְגוּת לֵילְיָא וַיְיָ קְטַל כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מִבּוּכְרָא דְפַרְעֹה <b>דְעָתִיד לְמִתַּב עַל<\/b> כָּרְסֵי <b>מַלְכוּתֵהּ<\/b> עַד בּוּכְרָא דְשִׁבְיָא דִי בְּבֵית אֲסִירֵי וְכֹל בּוּכְרָא דִבְעִירָא:", "onk_en": "It was [exactly] midnight and Adonoy struck down [killed] every first-born son in the land of Egypt, from the first-born son of Pharaoh sitting on his [<b>who is destined to sit upon the<\/b>] throne [<b>of his kingdom<\/b>], to the first-born son of the captive [prisoner] who was in the dungeon, as well as every first-born animal.", "pj": "וַהֲוָה בְּפַלְגוּת לֵילְיָא דַּחֲמֵיסַר וּמֵימְרָא דַיְיָ קָטַל כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מִבִּיר בּוּכְרָא דְפַרְעה דְּעָתִיד לְמִיתַּב עַל כּוּרְסֵי מַלְכוּתֵיהּ עַד בּוּכְרַיָיא בְּנֵי מַלְכַיָא דְאִשְׁתְּבִין וְאִינוּן בֵּי גוֹבָא מִתְמַשְׁכְּנִין בְּיַד פַּרְעה וְעַל דַּהֲווֹ חָדָן בְּשִׁעְבּוּדְהוֹן דְּיִשְרָאֵל לָקוּ אוּף הִינוּן וְכָל בּוּכְרֵי בְּעִירָא מֵתוּ דְּמִצְרָאֵי פַּלְחִין לְהוֹן", "pj_en": "And it was in the dividing, of the night of the fifteenth, that the Word of the Lord slew all the firstborn in the land of Mizraim, from the firstborn son of Pharoh, who would have sat upon the throne of his kingdom, unto the firstborn sons of the kings who were captives in the dungeon as hostages under Pharoh's hand; and who, for having rejoiced at the servitude of Israel, were punished as (the Mizraee): and all the firstborn of the cattle that did the work of the Mizraee died also.", "tj": "", "tj_en": "", "rashi": "<b>וה'.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר \"וַה'\" הוּא וּבֵית דִּינוֹ, שֶׁהַוָּי\"ו לְשׁוֹן תּוֹסֶפֶת הוּא, כְּמוֹ פְּלוֹנִי וּפְלוֹנִי:<br><br><b>הכה כל בכור.<\/b> אַף שֶׁל אֻמָּה אַחֶרֶת וְהוּא בְמִצְרַיִם (מכילתא):<br><br><b>מבכר פרעה.<\/b> אַף פַּרְעֹה בְּכוֹר הָיָה, וְנִשְׁתַּיֵּר מִן הַבְּכוֹרוֹת, וְעָלָיו הוּא אוֹמֵר \"בַּעֲבוּר הַרְאוֹתְךָ אֶת כֹּחִי\" (שמות ט') – בְּיַם סוּף (מכילתא):<br><br><b>עד בכור השבי.<\/b> שֶׁהָיוּ שְׂמֵחִין לְאֵידָם שֶׁל יִשְׂרָאֵל; וְעוֹד, שֶׁלֹּא יֹאמְרוּ יִרְאָתֵנוּ הֵבִיאָה הַפֻּרְעָנוּת; וּבְכוֹר הַשִּׁפְחָה בִּכְלָל הָיָה, שֶׁהֲרֵי מָנָה מִן הֶחָשׁוּב שֶׁבְּכֻלָּן עַד הַפָּחוּת, וּבְכוֹר הַשִּׁפְחָה חָשׁוּב מִבְּכוֹר הַשְּׁבִי:", "rashi_en": "וה׳ “AND” THE LORD — Wherever it is stated וה׳ “And the Lord” it signifies He and His celestial Court, because the prefix ו expresses an addition, just as one says, “Mr. So-and-so and Mr. So-and-so” (Genesis Rabbah 51:2; cf. Rashi on Genesis 19:24).<br><br>הכה כל בכור SMOTE ALL THE FIRSTBORN — all: such, also, belonging to another people who happened to be in Egypt (Mekhilta; cf. Rashi on v. 12).<br><br>מבכר פרעה means FROM THE FIRSTBORN PHARAOH’S — Pharaoh too, was a firstborn, but he alone was allowed to remain of the firstborn; and regarding this it states, (Exodus 9:16) “[But for this cause I have maintained thee in life in order to show thee my power” — i. e. to show thee my power at the Read Sea (cf. Mekhilta).<br><br>עד בכור השבי UNTO THE FIRSTBORN OF THE CAPTIVE — because they rejoiced at the misfortune of the Israelites (Midrash Tanchuma, Bo 7); and a further reason why they were slain is that they should not say, — if they remained alive — it was our god who brought punishment upon our oppressors, the Egyptians (Mekhilta) The firstborn of the handmaid, threatened with death in 40:5 but not mentioned here as having been slain, is included in those stated here to have been slain since it enumerates here (i. e. the terms used here are intended to include everyone) from the most important amongst all of them to the least important, and the firstborn of the handmaid as belonging to the Egyptian people, is certainly more important than the firstborn of the captive (cf. Rashi on 11:6)."}, {"ch": 12, "v": 30, "aliyah": 6, "heb": "וַיָּ֨קׇם פַּרְעֹ֜ה לַ֗יְלָה ה֤וּא וְכׇל־עֲבָדָיו֙ וְכׇל־מִצְרַ֔יִם וַתְּהִ֛י צְעָקָ֥ה גְדֹלָ֖ה בְּמִצְרָ֑יִם כִּֽי־אֵ֣ין בַּ֔יִת אֲשֶׁ֥ר אֵֽין־שָׁ֖ם מֵֽת׃", "onk": "וְקָם פַּרְעֹה לֵילְיָא הוּא וְכָל עַבְדוֹהִי וְכָל מִצְרַיִם וַהֲוַת צְוַחְתָּא רַבְּתָא בְּמִצְרָיִם אֲרֵי לֵית בֵּיתָא דְלָא הֲוָה בֵהּ תַּמָן מֵתָא:", "onk_en": "Pharaoh arose at night, he and all his servants and all the Egyptians, and there was a great cry in Egypt, for there was no house where there were no dead.", "pj": "וְקָם פַּרְעה בְּלֵילְיָא הוּא וְכָל שְׁאָר עַבְדוֹי וְכָל שְׁאָר מִצְרָאֵי וַהֲוָה צְוַוחְתָּא רַבְּתָא אֲרוּם לָא הֲוָה תַּמָּן בֵּיתָא דְמִצְרָאֵי דְלָא הֲוָה תַמָּן בְּכוֹר מָאִית", "pj_en": "And Pharoh rose up in that night, and all the rest of his servants, and all the rest of the Mizraee; and there was a great cry, because there was no house of the Mizraee where the firstborn was not dead.", "tj": "", "tj_en": "", "rashi": "<b>ויקם פרעה.<\/b> מִמִּטָּתוֹ:<br><br><b>לילה.<\/b> וְלֹא כְּדֶרֶךְ הַמְּלָכִים בְּשָׁלוֹשׁ שָׁעוֹת בַּיּוֹם (שם):<br><br><b>הוא.<\/b> תְּחִלָּה, וְאַחַר כָּךְ <b>עבדיו<\/b>, מְלַמֵּד שֶׁהָיָה הוּא מְחַזֵּר עַל בָּתֵּי עֲבָדָיו וּמַעֲמִידָן (שם):<br><br><b>כי אין בית אשר אין שם מת.<\/b> יֵשׁ שָׁם בְּכוֹר, מֵת, אֵין שָׁם בְּכוֹר, גָּדוֹל שֶׁבַּבַּיִת קָרוּי בְּכוֹר, שֶׁנֶּאֱמַר \"אַף אֲנִי בְּכוֹר אֶתְּנֵהוּ\" (תהילים פ\"ט). דָּבָר אַחֵר, מִצְרִיּוֹת מְזַנּוֹת תַּחַת בַּעְלֵיהֶן וְיוֹלְדוֹת מֵרַוָּקִים פְּנוּיִים, וְהָיוּ לָהֶם בְּכוֹרוֹת הַרְבֵּה, פְּעָמִים חֲמִשָּׁה לְאִשָּׁה אַחַת, כָּל אֶחָד בְּכוֹר לְאָבִיו:", "rashi_en": "ויקם פרעה AND PHARAOH AROSE from his bed,<br><br>לילה AT NIGHT and not, as is the way of kings, at three hours in the day (9 o’clock in the morning) (Mekhilta; cf. Berakhot 9b).<br><br>הוא HE, first — and afterwards עבדיו HIS SERVANTS — this informs us that he went round to the houses of his servants and made them get up (Mekhilta).<br><br>כי אין בית אשר אין שם מת FOR THERE WAS NOT A HOUSE WHERE THERE WAS NOT ONE DEAD — If there was a firstborn there, he died: if there was no firstborn there, then the chief person in the house died because the chief person in the house is called בכור, as it is said, (Psalms 89:28) “I also will appoint him to be a בכור, [the highest of the kings of the earth]” (Mekhilta DeRashbi 12:30; cf. Rashi on 4:22; Pesachim Rabbah, Midr. Vajosha). Another explanation is: the Egyptian women were unfaithful to their husbands and bore children from young men, unmarried, and thus they (the Egyptian men) had many firstborn sons sometimes there were five to one woman, each being the firstborn to his own father (thus there might well be no house in which there was not a firstborn) (cf. Mekhilta)."}, {"ch": 12, "v": 31, "aliyah": 6, "heb": "וַיִּקְרָא֩ לְמֹשֶׁ֨ה וּֽלְאַהֲרֹ֜ן לַ֗יְלָה וַיֹּ֙אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִתּ֣וֹךְ עַמִּ֔י גַּם־אַתֶּ֖ם גַּם־בְּנֵ֣י יִשְׂרָאֵ֑ל וּלְכ֛וּ עִבְד֥וּ אֶת־יְהֹוָ֖ה כְּדַבֶּרְכֶֽם׃", "onk": "וּקְרָא לְמשֶׁה וּלְאַהֲרֹן לֵילְיָא וַאֲמַר קוּמוּ פּוּקוּ מִגוֹ עַמִי אַף אַתּוּן אַף בְּנֵי יִשְׂרָאֵל וֶאֱזִילוּ פְלָחוּ <b>קֳדָם<\/b> יְיָ כְּמָא דִהֲוֵתוּן אָמְרִין:", "onk_en": "[Pharaoh] called for Moshe and Aharon that night and said, “Set out! Get out from among my people, both you and the B’nei Yisrael. Go worship [<b>before<\/b>] Adonoy as you have said [requested].", "pj": "וּתְחוּם אַרְעָא דְמִצְרַיִם מַהֲלָךְ אַרְבַּע מְאָה פַּרְסֵי הֲוַת וְאַרְעָא דְגוֹשֶׁן דְּתַמָּן משֶׁה וּבְנֵי יִשְרָאֵל בִּמְצִיעוּת אַרְעָא דְמִצְרַיִם הֲוַת וּפַלְטְרִין דְּבֵית מַלְכוּתָא דְפַרְעה בְּרֵישׁ אַרְעָא דְמִצְרַיִם הֲוָה וְכַד קְרָא לְמשֶׁה וּלְאַהֲרן בְּלֵילְיָא דְפִסְחָא אִשְׁתְּמַא קָלֵיהּ עַד אַרְעָא דְגשֶׁן מִתְחַנֵּן הֲוָה פַּרְעה בְּקַל עָצִיב וְכֵן אָמַר קוּמוּ פּוּקוּ מִגּוֹ עַמִּי אוּף אַתּוּן אוּף בְּנֵי יִשְרָאֵל וְזִילוּ פְלָחוּ קֳדָם יְיָ הֵיכְמָא דַאֲמַרְתּוּן", "pj_en": "And the border of the land of Mizraim extended four hundred pharsee; but the land of Goshen, where Mosheh and the sons of Israel were, was in the midst of the land of Mizraim; and the royal palace of Pharoh was at the entrance of the land of Mizraim. But when he cried to Mosheh and to Aharon in the night of the Pascha, his voice was heard unto the land of Goshen; Pharoh crying with a voice of woe, and saying thus: Arise, Go forth from among my people, both you and the sons of Israel; and go, worship before the Lord, as you have said;", "tj": "", "tj_en": "", "rashi": "<b>ויקרא למשה ולאהרן לילה.<\/b> מַגִּיד שֶׁהָיָה מְחַזֵּר עַל פִּתְחֵי הָעִיר וְצוֹעֵק, הֵיכָן מֹשֶׁה שָׁרוּי? הֵיכָן אַהֲרֹן שָׁרוּי? (מכילתא):<br><br><b>גם אתם.<\/b> הַגְּבָרִים:<br><br><b>גם בני ישראל.<\/b> הַטַּף:<br><br><b>ולכו עבדו את ה' כדברכם.<\/b> הַכֹּל כְּמוֹ שֶׁאֲמַרְתֶּם וְלֹא כְּשֶׁאָמַרְתִּי אֲנִי; בָּטֵל \"לֹא אֲשַׁלֵּחַ\", בָּטֵל \"מִי וָמִי הַהוֹלְכִים\", בָּטֵל \"רַק צֹאנְכֶם וּבְקָרְכֶם יֻצָּג\":", "rashi_en": "ויקרא למשה ולאהרן לילה AND HE CALLED FOR MOSES AND AARON BY NIGHT — This tells us that he went round to the entrances leading into the city (i. e. to each different district) crying out, “Where does Moses reside? Where does Aaron reside?” (Mekhilta).<br><br>גם אתם BOTH YE — the men,<br><br>גם בני ישראל AND THE CHILDREN OF ISRAEL — the little ones (i. e. בני must be understood literally).<br><br>ולכו עבדו את ה' כדברכם AND GO, SERVE THE LORD, AS YE HAVE SAID — everything shall be as you have said and not as I have said: annulled is what I have said, (5:2) “I will not let you go” (“Arise, go out”); annulled is, (10:8) “who are they that shall go?” (“go, both you and the children of Israel”); annulled is, (10:24) “but your flocks and herds must remain” (“Take also your flocks and herds”) (cf. Mekhilta)."}, {"ch": 12, "v": 32, "aliyah": 6, "heb": "גַּם־צֹאנְכֶ֨ם גַּם־בְּקַרְכֶ֥ם קְח֛וּ כַּאֲשֶׁ֥ר דִּבַּרְתֶּ֖ם וָלֵ֑כוּ וּבֵֽרַכְתֶּ֖ם גַּם־אֹתִֽי׃", "onk": "אַף עַנְכוֹן אַף תּוֹרְכוֹן דְבָרוּ כְּמָא דִי מַלֵלְתֻּן וֶאֱזִילוּ <b>וְצַלוֹ<\/b> אַף עָלָי:", "onk_en": "Take your sheep and cattle too, as you have said and go; bless [<b>pray for<\/b>] me too.", "pj": "אוּף עַנְכוֹן אוּף תּוֹרֵיכוֹן דְּבָרוּ מִן דִּילִי הֵיכְמָא דְמַלֵּילְתּוּן וְזִילוּ וְלֵית אֲנָא בָּעֵי מִנְכוֹן אֱלָהֵין דְּתַצְלוּן עָלַי דְלָא אֵימוּת", "pj_en": "your sheep also take, and whatever of mine you have spoken about, and go; and nothing ask I of you except that you pray for me that I may not die.", "tj": "", "tj_en": "", "rashi": "<b>גם צאנכם גם בקרכם קחו.<\/b> וּמַהוּ <b>כאשר דברתם<\/b>? \"גַּם אַתָּה תִּתֵּן בְּיָדֵנוּ זְבָחִים וְעֹלֹת\" (שמות י'), קְחוּ כַּאֲשֶׁר דִּבַּרְתֶּם:<br><br><b>וברכתם גם אתי.<\/b> הִתְפַּלְּלוּ עָלַי שֶׁלֹּא אָמוּת, שֶׁאֲנִי בְּכוֹר:", "rashi_en": "גם צאנכם גם בקרכם קחו TAKE ALSO YOUR FLOCKS AND HERDS — And what is the force of כאשר דברתם AS YE HAVE SPOKEN? It is an allusion to (10:25) “Thou, also, must give into our hands sacrifices and burnt offerings” — it means: take of my cattle also even as ye said.<br><br>וברכתם גם אתי AND BLESS ME ALSO — Pray on my behalf that I should not die because I am a firstborn (cf. Targum Jonathan on Exodus 12:32 and Mekhilta)."}, {"ch": 12, "v": 33, "aliyah": 6, "heb": "וַתֶּחֱזַ֤ק מִצְרַ֙יִם֙ עַל־הָעָ֔ם לְמַהֵ֖ר לְשַׁלְּחָ֣ם מִן־הָאָ֑רֶץ כִּ֥י אָמְר֖וּ כֻּלָּ֥נוּ מֵתִֽים׃", "onk": "וּתְקֵיפַת מִצְרַיִם עַל עַמָא לְאוֹחָאָה לְשַׁלָחוּתְהוֹן מִן אַרְעָא אֲרֵי אֲמָרוּ כֻּלָנָא מָיְתִין:", "onk_en": "The Egyptians pressed the people to hurry them—to send them out of the land, for they said, “We are all dead men.”", "pj": "וְכַד שְׁמָעוּ משֶׁה וְאַהֲרן וּבְנֵי יִשְרָאֵל קָל בְּכוּתָא דְפַרְעה וְלָא אַשְׁגָחוּ עַד דְּאָזַל הוּא וְכָל עַבְדוֹי וְכָל מִצְרָאֵי וּתְקִיפוּ לְכָל עַמָּא בֵּית יִשְרָאֵל לְמִפְטְרִינוּן מִן אַרְעָא אֲרוּם אָמְרִין אִי שַׁהְיַין הִינוּן הָכָא שַׁעְתָּא חָדָא הָא כּוּלָנָא מַיְיתוּן", "pj_en": "When Mosheh and Aharon, and the sons of Israel, heard the voice of Pharoh's weeping, they were not mindful, until he came himself, and all his servants, and all the Mizraee, and urged all the people of the house of Israel, that they might hasten to send them forth from the land; For, said they, if they prolong here one hour more, behold, we are all dead.", "tj": "אֲרוּם אֲמָרוּ מִצְרָאֵי אִי שַׁהְיָין יִשְרָאֵל שָׁעָה חָדָא הָא כָּל מִצְרָיִם מַיְיתוּן:", "tj_en": "For, said the Mizraee, if Israel delay one hour (longer), behold, all Mizraim dies.", "rashi": "<b>כלנו מתים.<\/b> אָמְרוּ לֹא כִגְזֵרַת מֹשֶׁה הוּא, שֶׁהֲרֵי אָמַר \"וּמֵת כָּל בְּכוֹר\", וְכָאן אַף הַפְּשׁוּטִים מֵתִים, חֲמִשָּׁה אוֹ עֲשָׂרָה בְּבַיִת אֶחָד:", "rashi_en": "כלנו מתים WE ARE ALL DEAD MEN — They said, Not according to Moses’ decree is this what has happened for he said (10:5) “And every firstborn shall die”, and here all the ordinary people are dead, five or ten in one house (Mekhilta)."}, {"ch": 12, "v": 34, "aliyah": 6, "heb": "וַיִּשָּׂ֥א הָעָ֛ם אֶת־בְּצֵק֖וֹ טֶ֣רֶם יֶחְמָ֑ץ מִשְׁאֲרֹתָ֛ם צְרֻרֹ֥ת בְּשִׂמְלֹתָ֖ם עַל־שִׁכְמָֽם׃", "onk": "וּנְטַל עַמָא יָת לַיְשֵׁיהוֹן עַד לָא חֲמָע <b>מוֹתַר אַצְוָתְהוֹן<\/b> צְרִיר בִּלְבָשֵׁהוֹן עַל כַּתְפֵּיהוֹן:", "onk_en": "The people took their dough before it was leavened. Their [<b>The<\/b>] leftovers [<b>of their dough<\/b>] were wrapped in their clothing, [and carried] on their shoulders.", "pj": "וּנְטַל עַמָּא יַת לֵישֵׁיהוֹן עֲלוֹי רֵישֵׁיהוֹן עַד דְּלָא אַחְמָע וּמִן דְּמִשְׁתַּיֵּיר לְהוֹן מִן פַּטִּירֵי וּמְרִירִי סוֹבָרוּ צְרִיר בִּלְבוּשֵׁיהוֹן עַל כַּתְפֵיהוֹן", "pj_en": "And the people carried their dough upon their heads, being unleavened, and what remained to them of the paschal cakes and bitter things they carried, bound up with their raiment, upon their shoulders.", "tj": "מוֹתָר פִּסְחֵיהוֹן קְטִירִין בְּשׁוֹשִׁיפְהוֹן יְהָבִין עַל כִּתְפֵּהוֹן:", "tj_en": "", "rashi": "<b>טרם יחמץ.<\/b> הַמִּצְרִים לֹא הִנִּיחוּם לִשְׁהוֹת כְּדֵי חִמּוּץ:<br><br><b>משארתם.<\/b> שְׁיָרֵי מַצָּה וּמָרוֹר.<br><br><b>על שכמם.<\/b> אַעַ\"פִּ שֶׁבְּהֵמוֹת הַרְבֵּה הוֹלִיכוּ עִמָּהֶם, מְחַבְּבִים הָיוּ אֶת הַמִּצְוָה:", "rashi_en": "טרם יחמץ BEFORE IT WAS LEAVENED — The Egyptians would not allow them to stay long enough for the dough to become leavened.<br><br>משארתם (from the root שאר “to be left over”) denotes the leavings (what was left) of the unleavened bread and bitter herbs (Mekhilta).<br><br>על שכמם UPON THEIR SHOULDER — Although they took many cattle with them yet they bore this upon their shoulders because the commands of God were so dear unto them (Mekhilta)."}, {"ch": 12, "v": 35, "aliyah": 6, "heb": "וּבְנֵי־יִשְׂרָאֵ֥ל עָשׂ֖וּ כִּדְבַ֣ר מֹשֶׁ֑ה וַֽיִּשְׁאֲלוּ֙ מִמִּצְרַ֔יִם כְּלֵי־כֶ֛סֶף וּכְלֵ֥י זָהָ֖ב וּשְׂמָלֹֽת׃", "onk": "וּבְנֵי יִשְׂרָאֵל עֲבָדוּ כְּפִתְגָמָא דְמשֶׁה וּשְׁאִילוּ מִמִצְרַיִם מָנִין דִכְסַף וּמָנִין דִדְהַב וּלְבוּשִׁין:", "onk_en": "The B’nei Yisrael did as Moshe said, and they requested of the Egyptians silver articles and gold articles and clothing.", "pj": "וּבְנֵי יִשְרָאֵל עָבָדוּ כְּפִתְגָמָא דְמשֶׁה וְשַׁיְילוּ מִן מִצְרָאֵי מָנִין דִּכְסַף וּמָנִין דִּדְהַב", "pj_en": "And the sons of Israel did according to the word of Mosheh, and asked of the Mizraee vessels of silver and vessels of gold.", "tj": "", "tj_en": "", "rashi": "<b>כדבר משה.<\/b> שֶׁאָמַר לָהֶם בְּמִצְרַיִם, \"וְיִשְׁאֲלוּ אִישׁ מֵאֵת רֵעֵהוּ\":<br><br><b>ושמלת.<\/b> אַף הֵן הָיוּ חֲשׁוּבוֹת לָהֶם מִן הַכֶּסֶף וּמִן הַזָּהָב, וְהַמְאֻחָר בַּפָּסוּק חָשׁוּב:", "rashi_en": "כדבר משה [THEY DID] ACCORDING TO THE WORD OF MOSES which he had spoken to them in Egypt, viz., (Exodus 11:2) “And let every man ask his fellow…”<br><br>ושמלות AND GARMENTS — These were even more valued by them than the silver and than the gold: the later a thing is mentioned in the text the more valued it is (cf. Mekhilta) (i. e. the fact that silver is mentioned before gold shows that the text is mentioning the objects in the ascending scale of value and consequently the garments, as being mentioned last, must have been most valued by them)."}, {"ch": 12, "v": 36, "aliyah": 6, "heb": "וַֽיהֹוָ֞ה נָתַ֨ן אֶת־חֵ֥ן הָעָ֛ם בְּעֵינֵ֥י מִצְרַ֖יִם וַיַּשְׁאִל֑וּם וַֽיְנַצְּל֖וּ אֶת־מִצְרָֽיִם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַייָ יְהַב יָת עַמָא לְרַחֲמִין בְּעֵינֵי מִצְרַיִם וְאַשֵׁלִינוּן וְרוֹקִינוּ יָת מִצְרַיִם:", "onk_en": "Adonoy granted the people favor in the eyes of the Egyptians, and they granted their request. They [B’nei Yisrael thus] drained Egypt of its wealth.", "pj": "וַיְיָ יְהַב יַת עַמָּא לְחֵן וָחֶסֶד קֳדָם מִצְרָאֵי וְשַׁיְילִינוּן וְרוֹקִינוּן יַת מִצְרָאֵי מִנִכְסֵיהוֹן", "pj_en": "And the Lord gave the people favour and compassion before the Mizraee, and they brought forth to them, and they emptied the Mizraee of their riches.", "tj": "", "tj_en": "", "rashi": "<b>וישאלום.<\/b> אַף מַה שֶּׁלֹּא הָיוּ שׁוֹאֲלִים מֵהֶם הָיוּ נוֹתְנִים לָהֶם, אַתָּה אוֹמֵר אֶחָד? טֹל שְׁנַיִם וָלֵךְ.<br><br><b>וינצלו.<\/b> וְרוֹקִינוּ:", "rashi_en": "וישאלום lit., AND THEY HANDED THEM OVER — Even what they did not ask of them did they give to them: “You say “one” — take “two”, but only go!” (Mekhilta).<br><br>וינצלו The Targum translates this by ורוקינו, AND THEY EMPTIED OUT."}, {"ch": 12, "v": 37, "aliyah": 6, "heb": "וַיִּסְע֧וּ בְנֵֽי־יִשְׂרָאֵ֛ל מֵרַעְמְסֵ֖ס סֻכֹּ֑תָה כְּשֵׁשׁ־מֵא֨וֹת אֶ֧לֶף רַגְלִ֛י הַגְּבָרִ֖ים לְבַ֥ד מִטָּֽף׃", "onk": "וּנְטָלוּ בְנֵי יִשְׂרָאֵל מֵרַעְמְסֵס לְסֻכּוֹת כְּשִׁתְּ מֵאָה אַלְפִין רִגְלָאִין גֻבְרַיָא בַּר מִטַפְלָא:", "onk_en": "The B’nei Yisrael traveled from Ramseis to Sukkos. There were about six hundred thousand males on foot besides the children.", "pj": "וּנְטָלוּ בְּנֵי יִשְרָאֵל מִן פִּילוּסִין לְסוּכּוֹת מְאָה וּתְלָתִין מִילִין תַּמָּן אִיתְחַפִּיאוּ שִׁבְעַת עֲנָנֵי יְקָרָא אַרְבָּעָה מֵאַרְבַּע צִיטְרֵיהוֹן וְחַד מֵעִילַוֵּיהוֹן דְּלָא יֵיחוֹת עֲלֵיהוֹן מִטְרָא וּבַרְדָא וְלָא יִתְחַרְכוּן בִּשְׁרָבֵי שִׁמְשָׁא וְחַד מִלְּרַע לְהוֹן דְּלָא יְהַנְזְקוּן לְהוֹן כּוּבִין וְלָא חֵיוִין וְעַקְרַבִּין וְחָד מְטַיָּיל קוּמֵיהוֹן לְאַשְׁוָאָה עוּמְקַיָא וּלְמֵימַךְ טוּרַיָא לְאַתְקָנָא לְהוֹן בֵּית מֵשְׁרוֹי וְהִינוּן כְּשִׁית מֵאָה אַלְפִין גּוּבְרַיָא וּמְטַיְילִין עַל רִיגְלֵיהוֹן וְלָא רַכְבִין עַל סוּסְוָון בַּר מִטַּפְלָא חַמְשָׁא לְכָל גַּבְרָא", "pj_en": "And the sons of Israel moved forth from Pilusin towards Succoth, a hundred and thirty thousand, protected there by seven clouds of glory on their four sides: one above them, that neither hail nor rain might fall upon them, nor that they should be burned by the heat of the sun; one beneath them, that they might not be hurt by thorns, serpents, or scorpions; and one went before them, to make the valleys even, and the mountains low, and to prepare them a place of habitation. And they were about six hundred thousand men, journeying on foot, none riding on horses except the children five to every man;", "tj": "", "tj_en": "", "rashi": "<b>מרעמסס סכתה.<\/b> מֵאָה וְעֶשְׂרִים מִיל הָיוּ, וּבָאוּ שָׁם לְפִי שָׁעָה, שֶׁנֶּאֱמַר \"וָאֶשָּׂא אֶתְכֶם עַל כַּנְפֵי נְשָׁרִים\" (שמות י\"ט):<br><br><b>הגברים.<\/b> מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה (שה\"ש רבה ג, ו):", "rashi_en": "מרעמסס סכתה FROM RAMESES TO SUCCOTH — These were distant from one another 120 miles and yet they reached there in one moment, as it is said, (Exodus 19:4) “and I carried you as on eagles’ wings” (cf. Mekhilta and Rashi on Exodus 19:4).<br><br>הגברים ADULT MALES — from twenty years old and upwards (Shir HaShirim Rabbah 3:6)."}, {"ch": 12, "v": 38, "aliyah": 6, "heb": "וְגַם־עֵ֥רֶב רַ֖ב עָלָ֣ה אִתָּ֑ם וְצֹ֣אן וּבָקָ֔ר מִקְנֶ֖ה כָּבֵ֥ד מְאֹֽד׃", "onk": "וְאַף <b>נוּכְרָאִין סַגִיאִין<\/b> סְלִיקוּ עִמְהוֹן וְעָנָא וְתוֹרִין בְּעִירָא סַגִי לַחֲדָא:", "onk_en": "A great mixture [of nationalities] [<b>multitude of strangers<\/b>] also went up with them. There were [also] sheep and cattle, a huge amount of livestock.", "pj": "וְאוּף נוּכְרָאִין סַגִּיאִין מִנְהוֹן מָאתָן וְאַרְבְּעִין רִבְוָון סַלִּיקוּ עִמְהוֹן וְעָאָן וְתוֹרֵי וְגֵיתֵי סַגִּי לַחֲדָא", "pj_en": "and a multitude of strangers, two hundred and forty myriads, went up with them, and sheep, and oxen, and cattle, very many.", "tj": "ל
