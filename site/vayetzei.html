<br><br>וברדים GRISLED — Explain it as the Targum renders it: פציחין open; old French faissie, checquered. There was a white stripe going right round the body, the spots of which it was composed being open and running from one end to the other. But I can bring no evidence from Scripture that this is the meaning. "}, {"ch": 31, "v": 11, "aliyah": 5, "heb": "וַיֹּ֨אמֶר אֵלַ֜י מַלְאַ֧ךְ הָאֱלֹהִ֛ים בַּחֲל֖וֹם יַֽעֲקֹ֑ב וָאֹמַ֖ר הִנֵּֽנִי׃", "onk": "וַאֲמַר לִי מַלְאָכָא דַיְיָ בְּחֶלְמָא יַעֲקֹב וַאֲמָרִית הָא אֲנָא:", "onk_en": "An angel of Elohim said to me in a dream, Yaakov, and I said, Here I am.", "pj": "וַאֲמַר לִי מַלְאָכָה דַיְיָ בְּחֶלְמָא יַעֲקב וַאֲמָרִית הָא נָא", "pj_en": "And the Angel of the Lord said to me, in a dream, Jakob. And I said, Behold me.", "tj": "עָנֵי יַעֲקב בִּלְשַׁן קוּדְשָׁא וַאֲמַר הִנֵנִי:", "tj_en": "Jakob answered in the holy tongue, and said, Behold me.", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 12, "aliyah": 5, "heb": "וַיֹּ֗אמֶר שָׂא־נָ֨א עֵינֶ֤יךָ וּרְאֵה֙ כׇּל־הָֽעַתֻּדִים֙ הָעֹלִ֣ים עַל־הַצֹּ֔אן עֲקֻדִּ֥ים נְקֻדִּ֖ים וּבְרֻדִּ֑ים כִּ֣י רָאִ֔יתִי אֵ֛ת כׇּל־אֲשֶׁ֥ר לָבָ֖ן עֹ֥שֶׂה לָּֽךְ׃", "onk": "וַאֲמַר זְקוֹף <b>כְּעַן<\/b> עַיְנָךְ וַחֲזֵי כָּל <b>תְּיָשַׁיָּא<\/b> דְּסָלְקִין עַל <b>עָנָא<\/b> רְגוֹלִין נְמוֹרִין וּפַצִּיחִין אֲרֵי <b>גְלֵי קֳדָמַי<\/b> יָת כָּל דִּי לָבָן עָבֵד לָךְ:", "onk_en": "He said, Lift up your eyes [<b>now<\/b>] and see, all the males [<b>rams<\/b>] going up on the flock [<b>sheep<\/b>] are ringed, speckled, and striped; for I have seen all that Lavan is doing to you [<b>is revealed before Me<\/b>].", "pj": "וַאֲמַר זְקוֹף כְּדוֹן עֵינָךְ וְחָמֵי כָּל בָּרְחַיָא דְסַלְקִין עַל עָנָא שׁוּמָא בְּרִגְלֵיהוֹן וּקְרוּחִין וְגַבֵּיהוֹן חִוְורִין אֲרוּם גְלֵי קֳדָמַי יַת כָּל אוּנְסָא דְלָבָן עָבִיד לָךְ", "pj_en": "And He said, Lift up now thine eyes and see: all the goats that rise upon the flock are spotted in their feet, or streaked or white in their backs: because all the injury that Laban hath done thee is manifest before me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 13, "aliyah": 5, "heb": "אָנֹכִ֤י הָאֵל֙ בֵּֽית־אֵ֔ל אֲשֶׁ֨ר מָשַׁ֤חְתָּ שָּׁם֙ מַצֵּבָ֔ה אֲשֶׁ֨ר נָדַ֥רְתָּ לִּ֛י שָׁ֖ם נֶ֑דֶר עַתָּ֗ה ק֥וּם צֵא֙ מִן־הָאָ֣רֶץ הַזֹּ֔את וְשׁ֖וּב אֶל־אֶ֥רֶץ מוֹלַדְתֶּֽךָ׃", "onk": "אֲנָא אֱלָהָא דְּאִתְגְּלֵיתִי עֲלָךְ בְּבֵית אֵל דִּי מְשַׁחְתָּא תַמָּן קָמָא דִּי קַיִּמְתָּא <b>קֳדָמַי<\/b> תַּמָּן קְיָם כְּעַן קוּם פּוּק מִן אַרְעָא הָדָא וְתוּב לְאַרְעָא יַלָּדוּתָךְ:", "onk_en": "I am the Almighty of Elohim who appeared to you in Beis Eil, where you anointed a monument, where you made a vow to [<b>before<\/b>] Me. Now arise and leave this land, and return to the land of your birthplace.", "pj": "אֲנָא הוּא אֱלָהָא דְאִתְגְלֵיתִי עֲלָךְ בְּבֵית אֵל דִי רִיבִיתָא תַּמָן קָמָא דְקַיְימִית קֳדָמַי תַּמָן קְיַים כְּדוּן קוּם פּוּק מִן אַרְעָא הָדָא וְתוּב לְאַרַע יַלְדוּתָךְ", "pj_en": "I am Eloha who did reveal Myself to thee at Beth El where thou didst anoint the pillar, and swear the oath before Me. Arise now, go forth from this land, and return to the land of thy birth.", "tj": "", "tj_en": "", "rashi": "<b>האל בית אל.<\/b> כְּמוֹ אֵל בֵּית אֵל, הַהֵ\"א יְתֵרָה, וְדֶרֶךְ מִקְרָאוֹת לְדַבֵּר כֵּן, כְּמוֹ כִּי אַתֶּם בָּאִים אֶל הָאָרֶץ כְּנָעַן (במדבר ל\"ד):<br><br><b>משחת שם.<\/b> לְ' רִבּוּי וּגְדֻלָּה כְּשֶׁנִּמְשָׁח לַמַּלְכוּת, כָּךְ וַיִּצֹק שֶׁמֶן עַל רֹאשָׁהּ – לִהְיוֹת מְשׁוּחָה לְמִזְבֵּחַ:<br><br><b>אשר נדרת לי.<\/b> וְצָרִיךְ אַתָּה לְשַׁלְּמוֹ, שֶׁאָמַרְתָּ יִהְיֶה בֵּית אֱלֹהִים, שֶׁתַּקְרִיב שָׁם קָרְבָּנוֹת:", "rashi_en": "האל בית אל is the same as אל בית אל the ה of האל being redundant. It is customary for Scripture to speak thus, e. g. (Numbers 34:2) “When ye come into the land of Canaan הארץ כנען (instead of ארץ כנען).<br><br>משחת שם WHERE THOU ANOINTEDST [A PILLAR] — This denotes distinction and eminence just as when one is anointed king one is raised to eminence: thus, too (Genesis 28:18) “and he poured oil upon the top of it (the stone)” that it might be anointed to be an altar (thus being distinguished among other stones).<br><br>אשר נדרת לי WHERE THOU VOWEDST A VOW UNTO ME —and you are bound to fulfill it, for you said (Genesis 28:22) “it shall be God’s house”, signifying that you would offer sacrifice there. "}, {"ch": 31, "v": 14, "aliyah": 5, "heb": "וַתַּ֤עַן רָחֵל֙ וְלֵאָ֔ה וַתֹּאמַ֖רְנָה ל֑וֹ הַע֥וֹד לָ֛נוּ חֵ֥לֶק וְנַחֲלָ֖ה בְּבֵ֥ית אָבִֽינוּ׃", "onk": "וַאֲתִיבַת רָחֵל וְלֵאָה וַאֲמָרַן לֵיהּ הַעוֹד (כְּעַן) לָנָא חֳלָק וְאַחֲסָנָא בְּבֵית אֲבוּנָא:", "onk_en": "Rochel and Leah replied and said to him, Do we still have a portion and an inheritance in our father’s house?", "pj": "וַאֲתָבַת רָחֵל בְּאַסְכָּמוּתָא דְלֵאָה וְאַמְרָן לֵיהּ הַאֶפְשַר דְעַד כְּדוֹן אִית לָנָא חוּלַק וְאַחְסָנָא בְּבֵית אָבוּנָא", "pj_en": "And Rahel answered with the consent of Leah, and said to him, Can there now be yet any portion or inheritance for us in our father's house;", "tj": "", "tj_en": "", "rashi": "<b>העוד לנו.<\/b> לָמָּה נְעַכֵּב עַל יָדְךָ מִלָּשׁוּב? כְּלוּם אָנוּ מְיַחֲלוֹת לִירַשׁ מִנִּכְסֵי אָבִינוּ כְּלוּם בֵּין הַזְּכָרִים:", "rashi_en": "העוד לנו IS THERE YET ANY FOR US? — Why should we prevent you from returning? Can we at all hope to inherit anything belonging to our father together with his sons? "}, {"ch": 31, "v": 15, "aliyah": 5, "heb": "הֲל֧וֹא נׇכְרִיּ֛וֹת נֶחְשַׁ֥בְנוּ ל֖וֹ כִּ֣י מְכָרָ֑נוּ וַיֹּ֥אכַל גַּם־אָכ֖וֹל אֶת־כַּסְפֵּֽנוּ׃", "onk": "הֲלָא נוּכְרָאָן אִתְחֲשַׁבְנָא לֵיהּ אֲרֵי זַבְּנָנָא וַאֲכַל אַף מֵיכַל יָת כַּסְפָּנָא:", "onk_en": "Are we not considered by him as strangers? For he has sold us, and has completely consumed our money.", "pj": "הֲלָא נוּכְרֵיתָא אִתְחַשַׁבְנָא לֵיהּ אֲרוּם זַבְּנָנָא וְאָכַל אוּף מֵיכַל יַת כַּסְפָּנָא", "pj_en": "are we not considered by him as strangers For he hath sold us, and eating he hath eaten our money.", "tj": "הֲלָא נוּכְרָאִין אִיתְחַשְׁבִינָן לֵיהּ אֲרֵי זַבִּין יָתָן וְהָא לָא בָּעִי לְמֵיהַב לְחוֹד כְּתוּבָּתָן:", "tj_en": "Are we not considered strangers to him? for he hath sold us and, behold he is not willing to give us our dowry.", "rashi": "<b>הלא נכריות נחשבנו לו.<\/b> אֲפִלּוּ בְשָׁעָה שֶׁדֶּרֶךְ בְּנֵי אָדָם לָתֵת נְדוּנְיָה לִבְנוֹתָיו – בִּשְׁעַת נִשּׂוּאִין – נָהַג עִמָּנוּ כְּנָכְרִיּוֹת, כִּי מְכָרָנוּ לְךָ בִּשְׂכַר הַפְּעֻלָּה:<br><br><b>את כספנו.<\/b> שֶׁעִכֵּב דְּמֵי שְׂכַר פְּעֻלָּתְךָ:", "rashi_en": "הלא נכריות נחשבנו לו ARE WE NOT THOUGHT ALIENS BY HIM? — Even at a time when it is customary for people to give a dowry to their daughters — at the time of their marriage — he treated us as strangers for he sold us to you in return for your labour during fourteen years<br><br>את כספנו [HAS EATEN] OUR MONEY — for he kept for himself the money for the wages of your labour during the next six years. "}, {"ch": 31, "v": 16, "aliyah": 5, "heb": "כִּ֣י כׇל־הָעֹ֗שֶׁר אֲשֶׁ֨ר הִצִּ֤יל אֱלֹהִים֙ מֵֽאָבִ֔ינוּ לָ֥נוּ ה֖וּא וּלְבָנֵ֑ינוּ וְעַתָּ֗ה כֹּל֩ אֲשֶׁ֨ר אָמַ֧ר אֱלֹהִ֛ים אֵלֶ֖יךָ עֲשֵֽׂה׃", "onk": "אֲרֵי כָל עוּתְרָא דִּי <b>אַפְרֵשׁ<\/b> יְיָ מֵאֲבוּנָא דִּילָנָא הוּא וּלְבָנָנָא וּכְעַן כֹּל דִּי אֲמַר יְיָ לָךְ עָבֵד:", "onk_en": "All the wealth that Elohim rescued [<b>separated<\/b>] from our father belongs to us and our children. Now, whatever God has said to you, do it.", "pj": "אֲרוּם כָּל עוּתְרָא דְרוֹקַן יְיָ מִן אָבוּנָא דִי לָנָא הוּא וְדִבְנָנָא וּכְדוֹן כָּל דְאָמַר יְיָ לָךְ עִבֵיד", "pj_en": "Therefore all the wealth that the Lord hath taken from our father is ours and our children's. And now, all that the Lord hath said to thee, do.", "tj": "סְגוּלֵיהּ:", "tj_en": "His treasure.", "rashi": "<b>כי כל העשר.<\/b> כִּי זֶה מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא; כְּלוֹמַר, מִשֶּׁל אָבִינוּ אֵין לָנוּ כְּלוּם, אֶלָּא מַה שֶּׁהִצִּיל הַקָּבָּ\"ה מֵאָבִינוּ שֶׁלָּנוּ הוּא:<br><br><b>הציל.<\/b> לְשׁוֹן הִפְרִישׁ, וְכֵן כָּל לְשׁוֹן הַצָּלָה שֶׁבַּמִּקְרָא לְשׁוֹן הַפְרָשָׁה, שֶׁמַּפְרִישׁוֹ מִן הָרָעָה וּמִן הָאוֹיֵב:", "rashi_en": "כי כל העשר FOR ALL THE RICHES — The word כי here means but; as much as to say: of our father’s property we have nothing at all; but what The Holy One, blessed be He, has taken away from our father, that is ours. <br><br>הציל means separated (or taken away). Similarly all forms from the Hiphil of this root occuring in Scripture (usually translated by “to deliver”, “to rescue“) mean taking away, for one who rescues a person takes him away from the misfortune or from the enemy."}, {"ch": 31, "v": 17, "aliyah": 6, "heb": "וַיָּ֖קׇם יַעֲקֹ֑ב וַיִּשָּׂ֛א אֶת־בָּנָ֥יו וְאֶת־נָשָׁ֖יו עַל־הַגְּמַלִּֽים׃", "onk": "וְקָם יַעֲקֹב וּנְטַל יָת בְּנוֹהִי וְיָת נְשׁוֹהִי עַל גַּמְלַיָּא:", "onk_en": "Yaakov rose and lifted his sons and his wives upon the camels.", "pj": "וְקָם יַעֲקב וְסוֹבַר יַת בְּנוֹי וְיַת נְשׁוֹי עַל גַמְלַיָא", "pj_en": "And Jakob arose, and set his children and his wives upon camels.", "tj": "", "tj_en": "", "rashi": "<b>את בניו ואת נשיו.<\/b> הִקְדִּים זְכָרִים לִנְקֵבוֹת, וְעֵשָׂו הִקְדִּים נְקֵבוֹת לִזְכָרִים, שֶׁנֶּאֱמַר וַיִּקַּח עֵשָׂו אֶת נָשָׁיו וְאֶת בָּנָיו וְגוֹמֵר:", "rashi_en": "את בניו ואת נשיו HIS SONS AND HIS WIVES — He took the males before the females whereas Esau took the females before the males, as it is said (Genesis 36:6) “And Esau took his wives and his sons etc.”  (Genesis Rabbah 74:5)"}, {"ch": 31, "v": 18, "aliyah": 6, "heb": "וַיִּנְהַ֣ג אֶת־כׇּל־מִקְנֵ֗הוּ וְאֶת־כׇּל־רְכֻשׁוֹ֙ אֲשֶׁ֣ר רָכָ֔שׁ מִקְנֵה֙ קִנְיָנ֔וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּפַדַּ֣ן אֲרָ֑ם לָב֛וֹא אֶל־יִצְחָ֥ק אָבִ֖יו אַ֥רְצָה כְּנָֽעַן׃", "onk": "וּדְבַר יָת כָּל גֵּיתוֹהִי וְיָת כָּל קִנְיָנֵיהּ דִּקְנָא גֵּיתֵי קִנְיָנֵיהּ דִּי קְנָא בְּפַדַּן אֲרָם לְמֵיתֵי לְוַת יִצְחָק אֲבוּהִי לְאַרְעָא כְנָעַן:", "onk_en": "He led away all his livestock, and all his possessions that he had acquired, which he had purchased with his own livestock that he had acquired in Padan Aram, [in order] to come to Yitzchok, his father, to the land of Canaan.", "pj": "וּדְבַר יַת כָּל בְּעִירָא וְיַת כָּל נִכְסוֹי דִי קָנָא גֵיתוֹ וְנִכְסוֹי דִי קְנָא בְּפַדַן אֲרַם לְמֵיתֵי לְוַת יִצְחָק אָבוּי לְאַרְעָא דִכְנָעַן", "pj_en": "And he led all his herds and his substance which he had obtained in Padan Aram to go unto Izhak his father in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "<b>מקנה קנינו.<\/b> מַה שֶּׁקָּנָה מִצֹּאנוֹ, עֲבָדִים וּשְׁפָחוֹת וּגְמַלִּים וַחֲמוֹרִים:", "rashi_en": "מקנה קנינו means — what he had purchased by means of קנינו his own property i.e. his sheep, viz., menservants, maidservants, camels and asses (Genesis Rabbah 74:5; cf. Rashi on Genesis 30:43). "}, {"ch": 31, "v": 19, "aliyah": 6, "heb": "וְלָבָ֣ן הָלַ֔ךְ לִגְזֹ֖ז אֶת־צֹאנ֑וֹ וַתִּגְנֹ֣ב רָחֵ֔ל אֶת־הַתְּרָפִ֖ים אֲשֶׁ֥ר לְאָבִֽיהָ׃", "onk": "וְלָבָן אֲזַל לְמִגַּז יָת <b>עָנֵיהּ וְכַסִּיאַת<\/b> רָחֵל יָת צַלְמָנַיָּא דִּי לַאֲבוּהָא:", "onk_en": "Lavan [meanwhile] had gone to shear his flock [<b>sheep<\/b>], and Rochel stole [<b>hid<\/b>] the idols that belonged to her father.", "pj": "וְלָבָן אָזַל לְמֵיגַז עָנֵיהּ וּגְנֵיבַת רָחֵל יַת צַלְמָנַיָא דַהֲווֹן נַכְסִין גַבְרָא בּוּכְרָא וְחִזְמִין רֵישֵׁיהּ וּמַלְחִין לֵיהּ בְּמִילְחָא וּבוּסְמָנִין וְכָתְבִין קוּסְמִין בְּצִיצָא דְדַהֲבָא וִיהָבִין תְּחוֹת לִשְׁנֵיהּ וּמְקַיְמִין לֵיהּ בְּכוּתְלָא וּמְמַלֵיל עִמְהוֹן וְאִילֵין הֲווֹן דַהֲוָה גָחִין לְהוֹן אָבוּהָא", "pj_en": "And Laban had gone to shear his flock; and Rahel stole the images. For they had slain a man, a firstborn, and had cut off his head; they salted it with salt and balsams, and wrote incantations on a plate of gold, and put it under his tongue, and set it up in the wall, and it spake with them; and unto such their father bowed himself.", "tj": "", "tj_en": "", "rashi": "<b>לגזוז את צאנו.<\/b> שֶׁנָּתַן בְּיַד בָּנָיו דֶּרֶךְ שְׁלֹשֶׁת יָמִים בֵּינוֹ וּבֵין יַעֲקֹב:<br><br><b>ותגנב רחל את התרפים.<\/b> לְהַפְרִישׁ אֶת אָבִיהָ מֵעֲ\"זָ נִתְכַּוְּנָה (בראשית רבה):", "rashi_en": "לגזז את צאנו TO SHEAR HIS FLOCK which he had given into the charge of his sons at a distance of three days’ journey between himself and Jacob. <br><br>ותגגב רחל את התרפים AND RACHEL STOLE THE TERAPHIM — her intention was to wean her father from idol-worship (Genesis Rabbah 74:5). "}, {"ch": 31, "v": 20, "aliyah": 6, "heb": "וַיִּגְנֹ֣ב יַעֲקֹ֔ב אֶת־לֵ֥ב לָבָ֖ן הָאֲרַמִּ֑י עַל־בְּלִי֙ הִגִּ֣יד ל֔וֹ כִּ֥י בֹרֵ֖חַ הֽוּא׃", "onk": "<b>וְכַסִּי יַעֲקֹב מִן לִבָּא דְלָבָן<\/b> אֲרַמָּאָה עַל דְּלָא חַוִּי לֵיהּ אֲרֵי <b>אָזֵל<\/b> הוּא:", "onk_en": "Yaakov fooled [<b>concealed his intentions from the heart of<\/b>] Lavan, the Aramean, by not telling him that he had fled [<b>gone<\/b>].", "pj": "וְגָנַב יַעֲקב יַת דַעְתֵּיהּ דְלָבָן אֲרַמָאָה עַל דְלָא חֲוֵי לֵיהּ אֲרוּם אָזַל הוּא", "pj_en": "And Jakob stole the knowledge of Laban the Aramite, in that he did not show him when he went.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 21, "aliyah": 6, "heb": "וַיִּבְרַ֥ח הוּא֙ וְכׇל־אֲשֶׁר־ל֔וֹ וַיָּ֖קׇם וַיַּעֲבֹ֣ר אֶת־הַנָּהָ֑ר וַיָּ֥שֶׂם אֶת־פָּנָ֖יו הַ֥ר הַגִּלְעָֽד׃", "onk": "<b>וַאֲזַל<\/b> הוּא וְכָל דִּי לֵיהּ וְקָם וַעֲבַר יָת <b>פְּרָת<\/b> וְשַׁוִּי יָת אַפּוֹהִי לְטוּרָא דְגִלְעָד:", "onk_en": "He fled [<b>went<\/b>] with all that he possessed. He set out and crossed the river [<b>P’ras<\/b>], setting out in the direction of Mount Gilod.", "pj": "וְאָזַל הוּא עִם כָּל דִילֵיהּ וְקָם וַעֲבַר יַת פְּרָת וְשַׁוִי יַת אַנְפּוֹי לְמֵיסוֹק לְטַוְורָא דְגִלְעָד אֲרוּם חָמָא בְּרוּחַ קוּדְשָא דְתַמָן עָתִיד לְמֶהֱוֵי שֵׁיזְבוּתָא לִבְנוֹי בְּיוֹמֵי דְיִפְתָּח דְמִן גִלְעָד", "pj_en": "And he went, he with all that he had. And he arose and crossed the Pherat, and set his face to ascend toward the mountain of Gilead; because he saw by the Holy Spirit that from thence would be deliverance for his sons, in the days of Jephtach, who was of Gilead.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 22, "aliyah": 6, "heb": "וַיֻּגַּ֥ד לְלָבָ֖ן בַּיּ֣וֹם הַשְּׁלִישִׁ֑י כִּ֥י בָרַ֖ח יַעֲקֹֽב׃", "onk": "וְאִתְחֲוָה לְלָבָן בְּיוֹמָא תְלִיתָאָה אֲרֵי <b>אָזֵל<\/b> יַעֲקֹב:", "onk_en": "Lavan was told on the third day that Yaakov had fled [<b>gone<\/b>].", "pj": "וּבָתַר דְאָזַל יַעֲקב קָמוּ רַעֲיָא עַל בֵּירָא וְלָא אַשְׁכָּחוּ מַיָא וְאַמְתִּינוּ תְלָתָא יוֹמִין דִילְמָא תְהֵי טַיְיפָא וְלָא טָפַת וּבְכֵן אִיתוֹי לְלָבָן בְּיוֹמָא תְּלִיתָאָה וִידַע אֲרוּם עָרַק יַעֲקב דְבִזְכוּתֵיהּ הֲוָה טַיְיפָא עֶשְרִין שְׁנִין", "pj_en": "But after Jakob had gone, the shepherds went to the well, but found no water; and they waited three days, if that it might (again) overflow; but it overflowed not; and then came they to Laban on the third day, and he knew that Jakob had fled; because through his righteousness it had flowed twenty years.", "tj": "וַהֲוָה כַּד אִתְכְּנִישׁוּ רַעֲיָיא בַּעֲיָין לְמִשְׁתַּן עָנָא וְלָא הֲווֹ יָכְלִין וְאַמְתִּינוּ תְּרֵין וּתְלָתָא יוֹמִין דִילְמָא תַטִיף בֵּירָא וְלָא טְפַּת וּבְכֵן אַתְנוּ לְלָבָן בְּיוֹמָא תְּלִיתָאָה אֲרוּם עֲרַק יַעֲקב:", "tj_en": "And it was, when the shepherds were gathered together, they sought to water the flock, but were not able; and they waited two and three days, if that the well might overflow; but it overflowed not; and then came they to Laban in the third day, because Jakob had fled.", "rashi": "<b>ביום השלישי.<\/b> שֶׁהֲרֵי דֶּרֶךְ שְׁלֹשֶׁת יָמִים הָיָה בֵינֵיהֶם:", "rashi_en": "ביום השלישי ON THE THIRD DAY—for there was a journey of three days between them. "}, {"ch": 31, "v": 23, "aliyah": 6, "heb": "וַיִּקַּ֤ח אֶת־אֶחָיו֙ עִמּ֔וֹ וַיִּרְדֹּ֣ף אַחֲרָ֔יו דֶּ֖רֶךְ שִׁבְעַ֣ת יָמִ֑ים וַיַּדְבֵּ֥ק אֹת֖וֹ בְּהַ֥ר הַגִּלְעָֽד׃", "onk": "וּדְבַר יָת אָחוּהִי עִמֵּיהּ וּרְדַף בַּתְרוֹהִי מַהֲלַךְ שִׁבְעַת יוֹמִין וְאַדְבֵּק יָתֵיהּ בְּטוּרָא דְגִלְעָד:", "onk_en": "He took his brothers [kinsmen] with him, and pursued him a distance of seven days. He overtook him in Mount Gilod.", "pj": "וּדְבַר יַת קְרִיבוֹי עִמֵיהּ וּרְדַף בַּתְרוֹי מַהֲלַךְ שׁוּבְעָא יוֹמִין וַאֲרַע יָתֵיהּ דְשָׁרֵי בְּטַוַור גִלְעָד מוֹדִי וּמַצְלִי קֳדָם אֱלָהֵיהּ", "pj_en": "And he took his kinsmen with him, and pursued after him, going seven days, and overtook him, while sojourning in Mount Gilead offering praise and praying before his God.", "tj": "", "tj_en": "", "rashi": "<b>את אחיו.<\/b> קְרוֹבָיו:<br><br><b>דרך שבעת ימים.<\/b> כָּל אוֹתָן ג' יָמִים שֶׁהָלַךְ הַמַּגִּיד לְהַגִּיד לְלָבָן הָלַךְ יַעֲקֹב לְדַרְכּוֹ, נִמְצָא, יַעֲקֹב רָחוֹק מִלָּבָן שִׁשָּׁה יָמִים, וּבַשְּׁבִיעִי הִשִּׂיגוֹ לָבָן. לָמַדְנוּ שֶׁכָּל מַה שֶּׁהָלַךְ יַעֲקֹב בְּשִׁבְעָה יָמִים הָלַךְ לָבָן בְּיוֹם אֶחָד (שֶׁנֶּאֱמַר וַיִּרְדֹּף אַחֲרָיו דֶּרֶךְ שִׁבְעַת יָמִים, וְלֹא נֶאֱמַר וַיִרְדֹּף אַחֲרָיו שִׁבְעַת יָמִים):", "rashi_en": "את אחיו HIS BRETHREN — i.e. his kinsmen.<br><br>דרך שבעת ימים SEVEN DAY’S JOURNEY — During all the three days during which the messenger had gone to tell Laban Jacob had proceeded on his journey. Consequently Jacob was then six days distance from Laban. On the seventh day i.e. on the day when Jacob covered that stretch of ground which made him seven days distant from Laban’s starting point Laban overtook him. We may infer, therefore, that all the distance that Jacob would have taken seven days to cover Laban covered in one day. And thus it states: “and he pursued after him seven day’s journey” and it does not say “and he pursued after him for seven days” (Genesis Rabbah 74:6). "}, {"ch": 31, "v": 24, "aliyah": 6, "heb": "וַיָּבֹ֧א אֱלֹהִ֛ים אֶל־לָבָ֥ן הָאֲרַמִּ֖י בַּחֲלֹ֣ם הַלָּ֑יְלָה וַיֹּ֣אמֶר ל֗וֹ הִשָּׁ֧מֶר לְךָ֛ פֶּן־תְּדַבֵּ֥ר עִֽם־יַעֲקֹ֖ב מִטּ֥וֹב עַד־רָֽע׃", "onk": "<b>וַאֲתָא מֵימַר מִן קֳדָם יְיָ<\/b> לְוַת לָבָן אֲרַמָּאָה בְּחֵילְמָא דְלֵילְיָא וַאֲמַר לֵיהּ אִסְתַּמַּר לָךְ דִּילְמָא תְמַלֵּיל עִם יַעֲקֹב מִטַּב עַד בִּישׁ:", "onk_en": "Elohim appeared [<b>The Word came from before Elohim<\/b>] to Lavan the Aramean, in a dream that night, and said to him, Guard yourself, that you do not speak to Yaakov either good or evil.", "pj": "וְאָתָא מַלְאָכָא בְּמֵימָר מִן קֳדָם יְיָ וּשְׁלַף חַרְבָּא עַל לָבָן רַמָאָה בְּחֵילְמָא דְלֵילְיָא וְאָמַר לֵיהּ טוּר לָךְ דִילְמָא תְמַלֵיל עִם יַעֲקב מִן טַב עַד בִּישׁ", "pj_en": "And there came an angel with a word from before the Lord; and he drew the sword against Laban the deceitful in a dream of the night, and said to him, Beware lest thou speak with Jakob from good to evil.", "tj": "", "tj_en": "", "rashi": "<b>מטוב עד רע.<\/b> כָּל טוֹבָתָן שֶׁל רְשָׁעִים רָעָה הִיא אֵצֶל הַצַּדִּיקִים (יבמות ק\"ג):", "rashi_en": "מטוב עד רע EITHER GOOD OR EVIL — why should he not speak good? Because all the good that the wicked do to the righteous is evil in the opinion of the righteous (Yevamot 103b). "}, {"ch": 31, "v": 25, "aliyah": 6, "heb": "וַיַּשֵּׂ֥ג לָבָ֖ן אֶֽת־יַעֲקֹ֑ב וְיַעֲקֹ֗ב תָּקַ֤ע אֶֽת־אׇהֳלוֹ֙ בָּהָ֔ר וְלָבָ֛ן תָּקַ֥ע אֶת־אֶחָ֖יו בְּהַ֥ר הַגִּלְעָֽד׃", "onk": "וְאַדְבֵּיק לָבָן יָת יַעֲקֹב וְיַעֲקֹב <b>פְּרַס<\/b> יָת מַשְׁכְּנֵיהּ בְּטוּרָא וְלָבָן <b>אַשְׁרֵי<\/b> יָת אֲחוֹהִי בְּטוּרָא דְגִלְעָד:", "onk_en": "Lavan overtook Yaakov. Yaakov had set up [<b>spread<\/b>] his tents on the mountain, and Lavan and his brothers had set up [<b>encamped<\/b>] on Mount Gilod.", "pj": "וְאַדְבֵּק לָבָן יַת יַעֲקב וְיַעֲקב פְּרַס יַת מַשְׁכְּנֵיהּ בְּטַוְורָא וְלָבָן אַשְׁרֵי יַת אָחוֹי בְּהַהוּא טַוְורָא דְגִלְעָד", "pj_en": "And Laban came upon Jakob. And Jakob had spread his tent in the mountain, and Laban made his brethren abide in the mount of Gilead.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 26, "aliyah": 6, "heb": "וַיֹּ֤אמֶר לָבָן֙ לְיַעֲקֹ֔ב מֶ֣ה עָשִׂ֔יתָ וַתִּגְנֹ֖ב אֶת־לְבָבִ֑י וַתְּנַהֵג֙ אֶת־בְּנֹתַ֔י כִּשְׁבֻי֖וֹת חָֽרֶב׃", "onk": "וַאֲמַר לָבָן לְיַעֲקֹב מָה עֲבַדְתָּ <b>וְכַסֵּיתָא<\/b> מִנִּי וּדְבַרְתָּא יָת בְּנָתַי כְּשַׁבְיוֹת חַרְבָּא:", "onk_en": "Lavan said to Yaakov, What have you done? You fooled [<b>hid from<\/b>] me, and led my daughters away like prisoners of war.", "pj": "וַאֲמַר לָבָן לְיַעֲקב מַה עָבַדְתְּ וְגָנַבְתְּ דַעְתִּי וּדְבָרַת יַת בְּנָתַי הֵי כְּשִׁבְיַת חַרְבָּא", "pj_en": "And Laban said to Jakob, What hast thou done? Thou hast stolen my knowledge, and led away my daughters like captives of the sword.", "tj": "", "tj_en": "", "rashi": "<b>כשביות חרב.<\/b> כָּל חַיִל הַבָּא לַמִּלְחָמָה קָרוּי חֶרֶב:", "rashi_en": "כשביות חרב AS CAPTIVES TAKEN BY THE SWORD — an army going to war is termed “sword”. "}, {"ch": 31, "v": 27, "aliyah": 6, "heb": "לָ֤מָּה נַחְבֵּ֙אתָ֙ לִבְרֹ֔חַ וַתִּגְנֹ֖ב אֹתִ֑י וְלֹא־הִגַּ֣דְתָּ לִּ֔י וָֽאֲשַׁלֵּחֲךָ֛ בְּשִׂמְחָ֥ה וּבְשִׁרִ֖ים בְּתֹ֥ף וּבְכִנּֽוֹר׃", "onk": "לְמָה אִטְמַרְתָּ <b>לְמֵיזַל וְכַסֵּיתָא<\/b> מִנִּי וְלָא חַוֵּיתָא לִי וְשַׁלָּחִתָּךְ פּוֹן בְּחֶדְוָא וּבְתוּשְׁבְּחָן <b>בְּתוּפִין וּבְכִנָּרִין<\/b>:", "onk_en": "Why did you flee [<b>go<\/b>] so stealthily? You robbed [<b>hid from<\/b>] me and did not tell me. I would have sent you away, with joy and with song, with drum[<b>s<\/b>] and harp[<b>s<\/b>].", "pj": "לְמָא אִיטְמַרְתְּ לְמֵיזַל וְגָנַבְתְּ דַעְתִּי וְלָא תָנֵית לִי וְאִילוּ תָנֵיתָא לִי שְׁלַחְתִּיךְ פּוֹן בְּחֶדְוָוא וּבְתוּשְׁבְּחָן בְּתוּפִּין וּבְכִינָרִין", "pj_en": "Why didst thou hide from me that thou wouldst go, and steal my knowledge, and not tell me? For if thou hadst told me, I would have sent thee away with mirth, and with hymns, and with tambourines, and with harps.", "tj": "", "tj_en": "", "rashi": "<b>ותגנב אתי.<\/b> גָּנַבְתָּ אֶת דַּעְתִּי:", "rashi_en": "ותגנב אתי — means thou didst steal away my mind (as in Genesis 5:26). "}, {"ch": 31, "v": 28, "aliyah": 6, "heb": "וְלֹ֣א נְטַשְׁתַּ֔נִי לְנַשֵּׁ֥ק לְבָנַ֖י וְלִבְנֹתָ֑י עַתָּ֖ה הִסְכַּ֥לְתָּֽ עֲשֽׂוֹ׃", "onk": "וְלָא שְׁבַקְתַּנִי לְנַשָּׁקָא לִבְנַי וְלִבְנָתָי כְּעַן אַסְכֶּלְתָּא לְמֶעְבָּד:", "onk_en": "You did not let me kiss my [grand]sons and daughters. Now see how foolishly you acted.", "pj": "וְלָא אַמְתַנְתָּנִי לְנַשְׁקָא לִבְנֵי בְרַתִּי וְלִבְרַתִּי כְּדוֹן אִסְכַּלְתָּ מַה דְעָבַדְתָּ", "pj_en": "Neither hast thou suffered me to kiss the sons of my daughters, nor my daughters. Now hast thou been foolish in what thou hast done.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 29, "aliyah": 6, "heb": "יֶשׁ־לְאֵ֣ל יָדִ֔י לַעֲשׂ֥וֹת עִמָּכֶ֖ם רָ֑ע וֵֽאלֹהֵ֨י אֲבִיכֶ֜ם אֶ֣מֶשׁ&thinsp;<b>׀<\/b> אָמַ֧ר אֵלַ֣י לֵאמֹ֗ר הִשָּׁ֧מֶר לְךָ֛ מִדַּבֵּ֥ר עִֽם־יַעֲקֹ֖ב מִטּ֥וֹב עַד־רָֽע׃", "onk": "אִית חֵילָא בִידִי לְמֶעְבַּד עִמְּכוֹן בִּישׁ וֵאלָהָא דַאֲבוּכוֹן בְּרַמְשָׁא אֲמַר לִי לְמֵימַר אִסְתַּמַּר לָךְ מִלְּמַלָּלָא עִם יַעֲקֹב מִטַּב עַד בִּישׁ:", "onk_en": "It is within the power of my hand to harm you, but the God of your father spoke to me last night saying, Guard yourself not to speak to Yaakov either good or evil.", "pj": "אִית סְפִיקָא בְּיָדִי לְמֶעֱבַּד עִמְכוֹן בִּישָׁא וֵאלָהָא דַאֲבוּכוֹן בְּרַמְשָׁא אָמַר לִי לְמֵימָר אִסְתַּמַר לָךְ מִלְמַלְלָא עִם יַעֲקב מִטַב וְעַד בִּישׁ", "pj_en": "There is sufficiency in my hand to do evil with thee; but the God of thy father spake with me in the evening, saying, Be careful of speaking with Jakob from good to evil", "tj": "אִית לִי חֵיל וְאוֹכְלוֹסִין:", "tj_en": "There are strength and ability.", "rashi": "<b>יש לאל ידי.<\/b> יֵשׁ כֹּחַ וְחַיִל בְּיָדִי לַעֲשׂוֹת עִמָּכֶם רַע, וְכָל אֵל שֶׁהוּא לְ' קֹדֶש עַל שֵׁם עִזּוּז וְרֹב אוֹנִים הוּא:", "rashi_en": "יש לאל ידי means MY HAND HAS THE STRENGTH AND THE POWER — to do you hurt (אל therefore means strength and יש לאל ידי is equivalent to יש אל לידי). Wherever אל is used as a Divine Name it is because it signifies strength and abundance of power. "}, {"ch": 31, "v": 30, "aliyah": 6, "heb": "וְעַתָּה֙ הָלֹ֣ךְ הָלַ֔כְתָּ כִּֽי־נִכְסֹ֥ף נִכְסַ֖פְתָּה לְבֵ֣ית אָבִ֑יךָ לָ֥מָּה גָנַ֖בְתָּ אֶת־אֱלֹהָֽי׃", "onk": "וּכְעַן מֵיזַל אֲזַלְתָּ אֲרֵי חַמָּדָא חַמֵּדְתָּא לְבֵית אָבוּךְ לְמָא <b>נְסִבְתָּא<\/b> יָת דַּחַלְתִּי:", "onk_en": "Now you have gone for you yearned for your father’s house, but why did you steal [<b>take<\/b>] my gods?", "pj": "וּכְדוֹן מֵיזַל אָזֵילְתָּא אֲרוּם מִתְחַמְדָא חֲמֵידְתָא לְבֵיתֵיהּ דְאָבוּךְ לְמָא גְנַבְתָּ יַת צִילְמֵי טַעֲוָותִי", "pj_en": "now going thou wilt go; because desiring thou hast desired the house of thy father: (but) why hast thou stolen the images of my idols?", "tj": "", "tj_en": "", "rashi": "<b>נכספתה.<\/b> חָמַדְתָּ, וְהַרְבֵּה יֵשׁ בַּמִּקְרָא, נִכְסְפָה וְגַם כָּלְתָה נַפְשִׁי (תהילים פ\"ד), לְמַעֲשֵׂה יָדֶיךָ תִכְסֹף (איוב י\"ד):", "rashi_en": "נכספתה means THOU DIDST LONG—It occurs many times in Scripture: (Psalms 89:3) “My soul yearneth (נכספה) yea, pineth”; (Job 14:15) “Thou wouldst have a desire (תכסוף) to the work of hands”. "}, {"ch": 31, "v": 31, "aliyah": 6, "heb": "וַיַּ֥עַן יַעֲקֹ֖ב וַיֹּ֣אמֶר לְלָבָ֑ן כִּ֣י יָרֵ֔אתִי כִּ֣י אָמַ֔רְתִּי פֶּן־תִּגְזֹ֥ל אֶת־בְּנוֹתֶ֖יךָ מֵעִמִּֽי׃", "onk": "וַאֲתֵיב יַעֲקֹב וַאֲמַר לְלָבָן אֲרֵי דְחֵילִית אֲרֵי אֲמָרִית דִּילְמָא תָנֵיס יָת בְּנָתָךְ מִנִּי:", "onk_en": "Yaakov replied and said to Lavan, Because I was afraid, for I said you might forcibly take your daughters from me.", "pj": "וְאָתֵיב יַעֲקב וַאֲמַר לְלָבָן אֲרוּם אִסְתְּפֵיתִי וַאֲמָרִית דִלְמָא תֵינוֹס יַת בְּנָתָךְ מִנִי", "pj_en": "And Jakob answered and said to Laban, Because I feared, and said, Lest thou violently take away thy daughters from me.", "tj": "", "tj_en": "", "rashi": "<b>כי יראתי וגו'.<\/b> הֱשִׁיבוֹ עַל רִאשׁוֹן רִאשׁוֹן, שֶׁאָמַר לוֹ, וַתְּנַהֵג אֶת בְּנֹתַי וְגוֹ':", "rashi_en": "כי יראתי BECAUSE I FEARED — He answered his first question first, for he had asked him (Genesis 31:26) “[what hast thou done…] that thou hast carried away my daughters etc.” (this being the first of all Laban’s questions). "}, {"ch": 31, "v": 32, "aliyah": 6, "heb": "עִ֠ם אֲשֶׁ֨ר תִּמְצָ֣א אֶת־אֱלֹהֶ֘יךָ֮ לֹ֣א יִֽחְיֶה֒ נֶ֣גֶד אַחֵ֧ינוּ הַֽכֶּר־לְךָ֛ מָ֥ה עִמָּדִ֖י וְקַֽח־לָ֑ךְ וְלֹֽא־יָדַ֣ע יַעֲקֹ֔ב כִּ֥י רָחֵ֖ל גְּנָבָֽתַם׃", "onk": "עִם (<small>נ\"א<\/small> אֲתַר) דִּי תַשְׁכַּח יָת דַּחַלְתָּךְ לָא יִתְקַיַּם קֳדָם אֲחָנָא אִשְׁתְּמוֹדַע לָךְ מָה דְעִמִּי וְסַב לָךְ וְלָא יְדַע יַעֲקֹב אֲרֵי רָחֵל <b>נְסִיבָתְהוֹן<\/b>:", "onk_en": "With whomsoever you find your gods, he shall not live. In the presence of our brethren, identify anything belonging to you that is here with me and take it back with you. Yaakov did not know that Rochel had stolen [<b>taken<\/b>] them.", "pj": "עִם כָּל מָאן דְתִשְׁכַּח יַת צַלְמֵי טַעֲוָותָךְ יְמוּת בְּלָא זִימְנֵיהּ כָּל קְבֵיל אָחָנָא אִשְׁתְּמוֹדַע לָךְ מַאן דְעִמִי מִן דִילָךְ וְסַב לָךְ וְלָא יְדַע יַעֲקב אֲרוּם רָחֵל גְנָבַתְנוּן", "pj_en": "With whomsoever thou shalt find the images of thy idols, let him die before his time. Before all our brethren take knowledge of what with me is thine, and take it. But Jakob knew not that Rahel had stolen them.", "tj": "", "tj_en": "", "rashi": "<b>לא יחיה.<\/b> וּמֵאוֹתָהּ קְלָלָה מֵתָה רָחֵל בַּדֶּרֶךְ (בראשית רבה)<br><br><b>מה עמדי.<\/b> מִשֶּׁלְּךָ:", "rashi_en": "לא יחיה LET HIM NOT LIVE — In consequence of this curse Rachel died on the journey (Genesis Rabbah 74:9).<br><br>מה עמדי WHAT IS WITH ME that belongs to you. "}, {"ch": 31, "v": 33, "aliyah": 6, "heb": "וַיָּבֹ֨א לָבָ֜ן בְּאֹ֥הֶל יַעֲקֹ֣ב&thinsp;<b>׀<\/b> וּבְאֹ֣הֶל לֵאָ֗ה וּבְאֹ֛הֶל שְׁתֵּ֥י הָאֲמָהֹ֖ת וְלֹ֣א מָצָ֑א וַיֵּצֵא֙ מֵאֹ֣הֶל לֵאָ֔ה וַיָּבֹ֖א בְּאֹ֥הֶל רָחֵֽל׃", "onk": "וְעַל לָבָן בְּמַשְׁכְּנָא דְיַעֲקֹב וּבְמַשְׁכְּנָא דְלֵאָה וּבְמַשְׁכְּנָא דְּתַרְתֵּין <b>לְחֵינָתָא<\/b> וְלָא אַשְׁכַּח וּנְפַק מִמַּשְׁכְּנָא דְלֵאָה וְעַל בְּמַשְׁכְּנָא דְרָחֵל:", "onk_en": "Lavan came into Yaakov’s tent, and into Leah’s tent, and into the tents of the two handmaids [<b>concubines<\/b>], but he found nothing. He left Leah’s tent and came into Rochel’s tent.", "pj": "וְעַל לָבָן בְּמַשְׁכְּנָא דְיַעֲקב וּמַשְׁכְּנָא דְלֵאָה וּבְמַשְׁכְּנֵהוֹן דְתַרְתֵּין לְחֵינָתָא וְלָא אַשְׁכַּח וּנְפַק מִמַשְׁכְּנָא דְלֵאָה וְעַל בְּמַשְׁכְּנָא דְרָחֵל", "pj_en": "And Laban went into the tent of Jakob, and into the tent of Leah, and into the tent of the two concubines, but found not. And he went out from the tent of Leah, and entered the tent of Rahel.", "tj": "", "tj_en": "", "rashi": "<b>באהל יעקב.<\/b> הוּא אֹהֶל רָחֵל, שֶׁהָיָה יַעֲקֹב תָּדִיר אֶצְלָהּ; וְכֵן הוּא אוֹמֵר בְּנֵי רָחֵל אֵשֶׁת יַעֲקֹב וּבְכֻלָּן לֹא נֶאֱמַר אֵשֶׁת יַעֲקֹב:<br><br><b>ויבא באהל רחל.<\/b> כְּשֶׁיָּצָא מֵאֹהֶל לֵאָה חָזַר לוֹ לְאֹהֶל רָחֵל קֹדֶם שֶׁיְּחַפֵּשׂ בְּאֹהֶל הָאֲמָהוֹת, וְכָל כָּךְ לָמָּה? שֶׁהָיָה מַכִּיר בָּהּ שֶׁהִיא מַשְׁמְשָׁנִית:", "rashi_en": "באהל יעקב INTO JACOB’S TENT — This was Rachel’s tent also, for Jacob was constantly with her. For the same reason Scripture says (46:19) “the sons of Rachel Jacob’s wife”, whilst in the case of the other wives it does not state “Jacob’s wife” (Genesis Rabbah 74:9).<br><br>ויבא באהל רחל AND HE CAME INTO RACHEL’S TENT — When he left Leah’s tent he returned again to Rachel’s tent before he searched the tent of the two maid-servants. Why did he feel compelled to do all this? Because he knew full well that she was meddlesome (Genesis Rabbah 74:9). "}, {"ch": 31, "v": 34, "aliyah": 6, "heb": "וְרָחֵ֞ל לָקְחָ֣ה אֶת־הַתְּרָפִ֗ים וַתְּשִׂמֵ֛ם בְּכַ֥ר הַגָּמָ֖ל וַתֵּ֣שֶׁב עֲלֵיהֶ֑ם וַיְמַשֵּׁ֥שׁ לָבָ֛ן אֶת־כׇּל־הָאֹ֖הֶל וְלֹ֥א מָצָֽא׃", "onk": "וְרָחֵל נְסִיבַת יָת צַלְמָנַיָּא וְשַׁוִּתִּנּוּן בַּעֲבִיטָא דְגַמְלָא וִיתִיבַת עֲלֵיהוֹן וּמַשִּׁישׁ לָבָן יָת כָּל מַשְׁכְּנָא וְלָא אַשְׁכָּח:", "onk_en": "Rochel had taken the idols, and placed them in the camel’s saddle-pillow, and sat upon them. Lavan searched the whole tent and found nothing.", "pj": "וְרָחֵל נְסֵיבַת יַת צַלְמָנַיָא וְשַׁוְתִינוּן בַּעֲבִיטָא דְגַמְלָא וִיתֵיבַת עֲלַוֵיהוֹם וּפִשְׁפַּשׁ יַת כָּל מַשְׁכְּנָא וְלָא אַשְׁכַּח", "pj_en": "But Rahel had taken the images, and laid them in the paniers of the camels, and sat upon them. And he searched all the tent, but found not.", "tj": "", "tj_en": "", "rashi": "<b>בכר הגמל.<\/b> לְשׁוֹן כָּרִים וּכְסָתוֹת, כְּתַרְגּוּמוֹ בַּעֲבִיטָא דְגַמְלָא, וְהִיא מַרְדַּעַת הָעֲשׂוּיָה כְּמִין כַּר; וּבְעֵרוּבִין (דף ט\"ז) שָׁנִינוּ הִקִּיפוּהָ בַּעֲבִיטִין, וְהֵן עֲבִיטֵי גְמַלִּים, בשט\"ו בְּלַעַז:", "rashi_en": "בכר הגמל IN THE CAMEL’S SADDLE-PILLOW — כר has the same meaning as in the Talmudic phrase \"pillows (כרים) and bolsters”. Explain it as the Targum renders it: “in the עביטא of the camel”. This is a packsaddle made like a pillow. In Erubin (Eruvin 16a) we find, \"they enclosed it with עביטין” by which is meant the saddles of camels. old French bast, bat; English packsaddle. "}, {"ch": 31, "v": 35, "aliyah": 6, "heb": "וַתֹּ֣אמֶר אֶל־אָבִ֗יהָ אַל־יִ֙חַר֙ בְּעֵינֵ֣י אֲדֹנִ֔י כִּ֣י ל֤וֹא אוּכַל֙ לָק֣וּם מִפָּנֶ֔יךָ כִּי־דֶ֥רֶךְ נָשִׁ֖ים לִ֑י וַיְחַפֵּ֕שׂ וְלֹ֥א מָצָ֖א אֶת־הַתְּרָפִֽים׃", "onk": "וַאֲמֶרֶת לַאֲבוּהָא לָא יִתְקֵף בְּעֵינֵי רִבּוֹנִי אֲרֵי לָא אִכּוּל לְמֵיקַם מִן קֳדָמָךְ אֲרֵי אֹרַח נְשִׁין לִי וּבְלַשׁ וְלָא אַשְׁכַּח יָת צַלְמָנַיָּא:", "onk_en": "She said to her father, Let there not be anger in the eyes of my master that I cannot rise before you, for the way of women is upon me. He searched but did not find the idols.", "pj": "וַאֲמַרַת לָא יִתְקוֹף בְּעֵינֵי רִבּוֹנִי אֲרוּם לֵית אֶפְשַׁר לְמֵיקוֹם מִן קָמָךְ אֲרוּם אוֹרַח נְשִׁין לִי וּפִשְׁפַּשׁ וְלָא אַשְׁכַּח יַת צַלְמָנַיָא", "pj_en": "And she said, Let it not be displeasing in my lord's eyes that I am not able to arise before thee, because I have the way of women. And he searched, but found not the images.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 36, "aliyah": 6, "heb": "וַיִּ֥חַר לְיַעֲקֹ֖ב וַיָּ֣רֶב בְּלָבָ֑ן וַיַּ֤עַן יַעֲקֹב֙ וַיֹּ֣אמֶר לְלָבָ֔ן מַה־פִּשְׁעִי֙ מַ֣ה חַטָּאתִ֔י כִּ֥י דָלַ֖קְתָּ אַחֲרָֽי׃", "onk": "וּתְקֵיף לְיַעֲקֹב וּנְצָא עִם לָבָן וַאֲתֵיב יַעֲקֹב וַאֲמַר לְלָבָן מַה חוֹבִי מַה סוּרְחָנִי אֲרֵי רְדַפְתָּא בַּתְרָי:", "onk_en": "Yaakov was angry and he argued with Lavan. Yaakov replied and said to Lavan, What is my crime? What sin did I commit that you were in such hot pursuit of me?", "pj": "וּתְקֵיף רוּגְזָא דְיַעֲקב וְאִדַיָין עִם לָבָן וְאָתֵיב יַעֲקב וְאֵימַר לְלָבָן מַה חוֹבָתִי וּמַה סוּרְחָנִי אֲרוּם אוֹחֵיתָ לְמֵיתֵי בַּתְרָי", "pj_en": "And the anger of Jakob took fire, and he contended with Laban. And Jakob answered and said to Laban, What is my sin, and what my transgression, that thou hast so eagerly come after me?", "tj": "", "tj_en": "", "rashi": "<b>דלקת.<\/b> רָדַפְתָּ, כְּמוֹ עַל הֶהָרִים דְּלָקֻנוּ (איכה ד'), וּכְמוֹ מִדְּלֹק אַחֲרֵי פְלִשְׁתִּים (שמואל א י\"ז):", "rashi_en": "דלקת means THOU HAST PURSUED — as in (Lamentations 4:19) “They chased us (דלקנו) upon the mountains”, and (1 Samuel 17:53) ‘‘from chasing (מדלק) after the Philistines”. "}, {"ch": 31, "v": 37, "aliyah": 6, "heb": "כִּֽי־מִשַּׁ֣שְׁתָּ אֶת־כׇּל־כֵּלַ֗י מַה־מָּצָ֙אתָ֙ מִכֹּ֣ל כְּלֵי־בֵיתֶ֔ךָ שִׂ֣ים כֹּ֔ה נֶ֥גֶד אַחַ֖י וְאַחֶ֑יךָ וְיוֹכִ֖יחוּ בֵּ֥ין שְׁנֵֽינוּ׃", "onk": "אֲרֵי מַשִּׁשְׁתָּא יָת כָּל מָנַי מָה אַשְׁכַּחְתָּא מִכֹּל מָנֵי בֵיתָךְ שַׁוִּי הָכָא קֳדָם אַחַי וְאַחָיךְ וְיוֹכִיחוּן בֵּין תַּרְוָנָא:", "onk_en": "When you searched all my goods, what did you find of all your household goods? Place it here in the presence of my brethren and your brethren, and let them decide between the two of us.", "pj": "אֲרוּם פִּשְׁפַּשְׁתָּא יַת כָּל מָאנַי מַה אַשְׁכַּחְתָּ מִכָּל מָאנֵי בַיְיתָךְ שַׁוִי כְדוֹן דִינָךְ קֳבֵל אַחַי וְאַחָךְ וִידִינוּן קְשׁוֹט בֵּין תַּרְוֵינָן", "pj_en": "Having, therefore, searched all my vessels, what hast thou found of all the vessels of thy house? Lay now the matter before my brethren and thy brethren, and let them decide the truth between us two.", "tj": "", "tj_en": "", "rashi": "<b>ויוכיחו.<\/b> וִיבָרְרוּ עִם מִי הַדִּין, אפרובי\"ר בְּלַעַז:", "rashi_en": "ויוכיחו — means that they may decide who is right. old French eprouver; English prove. "}, {"ch": 31, "v": 38, "aliyah": 6, "heb": "זֶה֩ עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ עִמָּ֔ךְ רְחֵלֶ֥יךָ וְעִזֶּ֖יךָ לֹ֣א שִׁכֵּ֑לוּ וְאֵילֵ֥י צֹאנְךָ֖ לֹ֥א אָכָֽלְתִּי׃", "onk": "דְּנַן עֶסְרִין שְׁנִין אֲנָא עִמָּךְ רְחֵלָךְ וְעִזָּךְ לָא אַתְכִּילוּ וְדִכְרֵי עָנָךְ לָא אֲכָלִית:", "onk_en": "These twenty years that I was with you, your ewes and she-goats never miscarried, and I did not eat any rams of your flocks.", "pj": "דְנַן עֶשְרִין שְׁנִין אֲנָא גַבָּךְ רֵיחַלַיִךְ וְעִיזַיִךְ לָא אִתְכָּלוּ וַאֲגַר דִיכְרֵי עָנָךְ לָא אֲכָלִית", "pj_en": "These twenty years have I been with thee: thy ewes and thy goats have not failed, and the price of the rams of the flock I have not eaten.", "tj": "", "tj_en": "", "rashi": "<b>לא שכלו.<\/b> לֹא הִפִּילוּ עִבּוּרָם, כְּמוֹ רֶחֶם מַשְׁכִּיל (הושע ט'), תְּפַלֵּט פָּרָתוֹ וְלֹא תְשַׁכֵּל (איוב כ\"א):<br><br><b>ואילי צאנך.<\/b> מִכָּאן אָמְרוּ אַיִל בֶּן יוֹמוֹ קָרוּי אַיִל, שֶׁאִם לֹא כֵן, מַה שִּׁבְחוֹ? אֵלִים לֹא אָכַל, אֲבָל כְּבָשִׂים אָכַל, אִם כֵּן גַּזְלָן הוּא (בבא קמא ס\"ה):", "rashi_en": "לא שכלו means HAVE NOT MISCARRIED — Similar are: (Hosea 9:14) ‘‘a miscarrying (משכיל) womb”; (Job 21:10) “his cow calveth and casteth (תשכל) not her calf”.<br><br>ואילי צאנך AND THE RAMS OF THY FLOCK — From this phrase they (the Rabbis) inferred (Bava Kamma 65b) that a male sheep even when one day old is called a ram; for if this be not so, how was this creditable to him? Did he mean that he had not eaten rams (i. e. the larger animals), but that he had eaten the smaller sheep? If so, he was a thief! (39)."}, {"ch": 31, "v": 39, "aliyah": 6, "heb": "טְרֵפָה֙ לֹא־הֵבֵ֣אתִי אֵלֶ֔יךָ אָנֹכִ֣י אֲחַטֶּ֔נָּה מִיָּדִ֖י תְּבַקְשֶׁ֑נָּה גְּנֻֽבְתִ֣י י֔וֹם וּגְנֻֽבְתִ֖י לָֽיְלָה׃", "onk": "דִּתְבִירָא לָא אַיְתֵיתִי לְוָתָךְ <b>דַּהֲוָה שָׁגְיָא מִמִּנְיָנָא מִנִּי אַתְּ בָּעֵי לַהּ נְטָרִית בִּימָמָא וּנְטָרִית בְּלֵילְיָא<\/b>:", "onk_en": "I never brought you a mutilated animal. I will take the blame for it. You demanded compensation from my hand whether [an animal] was stolen from me by day or whether it was stolen from me by night. [<b>You demanded compensation from me for that which was missing from the total. I guarded by day and I guarded by night.<\/b>]", "pj": "דִתְבִירָא מִן חֵיוַת בָּרָא לָא אַיְיתֵיתִי לְוָותָךְ דְאִין אֲנָא חָטִי בָּהּ מִן יְדִי הֲוֵית תָּבַע יָתָהּ מַה דְמִתְגְנִיב בִּימָמָא מִבְּנֵי נְשָׁא עָלַי הֲוָה לְאַשְׁלָמָא וּמַה דַהֲוָה מִתְגְנֵיב בְּלֵילְיָא מִן חֵיוַת בָּרָא עָלַי הֲוֵינָא לִמְשַׁלְמָא", "pj_en": "That torn by wild beasts I have not brought to thee; for had I sinned, from my hand thou wouldst have required it. What was stolen in the day by men, that have I made good; and what was stolen in the night by wild beasts was made good also.", "tj": "קְטִילַת לָא אַיְיתִית לְוָותָךְ כָּל חֲדָא מִנְהוֹן דַהֲוָה עֲרָקָא מִן מִנְיָנָא אֲנָא הֲוֵינָא מְשַׁלֵם מִן יְדָי הֲוֵיתָא תָּבַע יָתָהּ וּמִן דַהֲווֹ גַנְבַיָיא גַנְבִין בִּימָמָא וְחֵיוַת בָּרָא מִתְאָכְלָא בְּלֵילְיָא אֲנָא הֲוֵינָא מְשַׁלֵם יָתָהּ:", "tj_en": "The dead I have not brought to thee; every one which had fled from the number, I have made that good; of my hands thou hast required it: and what thieves stole by day or wild beasts devoured by night I have made good.", "rashi": "<b>טרפה.<\/b> עַל יְדֵי אֲרִי וּזְאֵב:<br><br><b>אנכי אחטנה.<\/b> לְשׁוֹן קֹלֵעַ בָּאֶבֶן אֶל הַשַּׂעֲרָה וְלֹא יַחֲטִא (שופטים כ'), אֲנִי וּבְנִי שְׁלֹמֹה חַטָּאִים (מלכים א א') – חֲסֵרִים, אָנֹכִי אַחְסְרֶנָּה, אִם חָסְרָה חָסְרָה לִי, שֶׁמִּיָּדִי תְּבַקְשֶׁנָּה:<br><br>(<b>אנכי אחטנה<\/b> תַּרְגּוּמוֹ דַּהַוַת שָׁגְיָא מִמִּנְיָנָא, שֶׁהָיְתָה נִפְקֶדֶת וּמְחֻסֶּרֶת, כְּמוֹ וְלֹא נִפְקַד מִמֶּנּוּ אִישׁ (במדבר ל\"א), תַּרְגּוּמוֹ לָא שְׁגָא):<br><br><b>גנבתי יום וגנבתי לילה.<\/b> גְנוּבַת יוֹם אוֹ גְנוּבַת לַיְלָה, הַכֹּל שִׁלַּמְתִּי:<br><br><b>גנבתי.<\/b> כְּמוֹ רַבָּתִי בַגּוֹיִם שָׂרָתִי בַּמְּדִינוֹת (איכה א'), מְלֵאֲתִי מִשְׁפָּט (ישעיהו א') אֹהַבְתִּי לָדוּשׁ (הושע י'):", "rashi_en": "טרפה  THAT WHICH WAS TORN by a lion or a wolf. <br><br>אנכי אחטנה I BARE THE LOSS OF IT — It has the same meaning as the verb in (Judges 20:16) “sling stones at a hair-breadth and not miss (יחטא)”, and (1 Kings 1:21) “that I and my son Solomon shall suffer the loss of it (חטאים)” i.e. shall be lacking in authority. The sense therefore is: “I” was short of it; if it was missing, it was missing to me because you required it of my hand.<br><br>אנכי אחטנה In the Targum it is translated by דהות שגיא ממנינא which means that which was missing and deficient from the number of the animals. The words (Numbers 31:49) “There is missing (נפקד) not one man of us”, is rendered in the Targum by ולא שגיא<br><br>גנבתי יום וגנבתי לילה WHETHER STOLEN BY DAY OR STOLEN BY NIGHT — everything I paid back.<br><br>גנבתי As regards the suffix י it is similar to the י in (Lamentations 1:1) “great (רבתי) among the nations, princess (שרתי) among the provinces”; (Isaiah 1:21) “that was full of (מלאתי) justice”; (Hosea 10:11) “that loveth (אהבתי) to thresh”. "}, {"ch": 31, "v": 40, "aliyah": 6, "heb": "הָיִ֧יתִי בַיּ֛וֹם אֲכָלַ֥נִי חֹ֖רֶב וְקֶ֣רַח בַּלָּ֑יְלָה וַתִּדַּ֥ד שְׁנָתִ֖י מֵֽעֵינָֽי׃", "onk": "הֲוֵיתִי בִימָמָא אֲכַלְנִי שַׁרְבָא <b>וּגְלִידָא (הֲוָה) נָחֵית עֲלַי<\/b> בְּלֵילְיָא וּנְדַד שִׁנְתִּי מֵעֵינָי:", "onk_en": "I was consumed by the burning heat by day and ice [<b>frost came down upon me<\/b>] at night. My sleep was taken from my eyes.", "pj": "הֲוֵיתִי בִּימָמָא בְּחַקְלָא אֲכָלָנִי שְׁרִיבָא וּקְרוּשָׁא בְּלֵילְיָא וְאִתְפַּרְדַת שִׁינְתָא מִנִי", "pj_en": "I have been in the field; by day the heat hath devoured me, and the cold by night, and sleep hath been parted from me.", "tj": "", "tj_en": "", "rashi": "<b>אכלני חרב.<\/b> לְשׁוֹן אֵשׁ אֹכְלָה:<br><br><b>וקרח.<\/b> כְּמוֹ מַשְׁלִיךְ קַרְחוֹ (תהילים קמ\"ז), תַּרְגּוּמוֹ גְּלִידָא:<br><br><b>שנתי.<\/b> לְשׁוֹן שֵׁנָה:", "rashi_en": "אכלני חרב  THE DROUGHT CONSUMED ME — the same metaphor as (Deuteronomy 4:24) אש אכלה “a consuming fire”.<br><br>וקרח THE FROST — as (Psalms 147:17) “He casteth forth his ice (קרחו)”. In the Targum it is rendered by גלידא “hoar-frost”.<br><br>שנתי means MY SLEEP."}, {"ch": 31, "v": 41, "aliyah": 6, "heb": "זֶה־לִּ֞י עֶשְׂרִ֣ים שָׁנָה֮ בְּבֵיתֶ֒ךָ֒ עֲבַדְתִּ֜יךָ אַרְבַּֽע־עֶשְׂרֵ֤ה שָׁנָה֙ בִּשְׁתֵּ֣י בְנֹתֶ֔יךָ וְשֵׁ֥שׁ שָׁנִ֖ים בְּצֹאנֶ֑ךָ וַתַּחֲלֵ֥ף אֶת־מַשְׂכֻּרְתִּ֖י עֲשֶׂ֥רֶת מֹנִֽים׃", "onk": "דְּנַן לִי עֶסְרִין שְׁנִין בְּבֵיתָךְ פְּלָחִתָּךְ אַרְבַּע עֶסְרֵי שְׁנִין בְּתַרְתֵּין בְּנָתָיךְ וְשִׁתְּ שְׁנִין בְּעָנָךְ וְאַשְׁנֵיתָא יָת אַגְרִי עֲשַׂר זִמְנִין:", "onk_en": "These twenty years that I have been in your house, I served you fourteen years for your two daughters, and six years for your sheep, but you changed my wages ten times.", "pj": "דְנַן לִי עֶשְרִין שְׁנִין בְּבֵיתָךְ פְּלַחְתָּךְ אַרְבַּסְרִי שְׁנִין בְּגִין תַּרְתֵּין בְּנָתָךְ וְשִׁית שְׁנִין בְּגִין עָנָךְ וּשְׁלַחַפְתָּא יַת אַגְרִי עִישַרְתֵּי חוּלְקִין", "pj_en": "These twenty years have I been in thy house, serving thee; fourteen years for thy two daughters, and six years for thy sheep; and thou hast changed my wages ten parts.", "tj": "", "tj_en": "", "rashi": "<b>ותחלף את משכרתי.<\/b> הָיִיתָ מְשַׁנֶּה תְּנַאי שֶׁבֵּינֵינוּ, מִנָּקֹד לְטָלוּא, וּמֵעֲקוּדִים לִבְרֻדִּים:", "rashi_en": "ותחלף את משכרתי AND THOU HAST CHANGED MY HIRE — You have altered the agreement regarding my hire between us from speckled to spotted and from streaked to grisled. "}, {"ch": 31, "v": 42, "aliyah": 6, "heb": "לוּלֵ֡י אֱלֹהֵ֣י אָבִי֩ אֱלֹהֵ֨י אַבְרָהָ֜ם וּפַ֤חַד יִצְחָק֙ הָ֣יָה לִ֔י כִּ֥י עַתָּ֖ה רֵיקָ֣ם שִׁלַּחְתָּ֑נִי אֶת־עׇנְיִ֞י וְאֶת־יְגִ֧יעַ כַּפַּ֛י רָאָ֥ה אֱלֹהִ֖ים וַיּ֥וֹכַח אָֽמֶשׁ׃", "onk": "אִילוּלָא פוֹן אֱלָהֵהּ דְּאַבָּא אֱלָהֵהּ דְּאַבְרָהָם וּדְדָחִיל לֵיהּ יִצְחָק הֲוָה <b>בְּסַעְדִּי<\/b> אֲרֵי כְעַן רֵיקָן שִׁלַּחְתָּנִי יָת <b>עַמְלִי<\/b> וְיָת <b>לֵיאוּת<\/b> יְדַי <b>גְּלֵי קֳדָם<\/b> יְיָ וְאוֹכַח בְּרַמְשָׁא:", "onk_en": "Had not the God of my father, the God of Avraham and the Fear of Yitzchok been with me [<b>my support<\/b>], you would have sent me away empty-handed. My misery [<b>toil<\/b>] and the labor [<b>weariness<\/b>] of my hands was seen by [<b>revealed before<\/b>] Elohim, and He reprimanded you last night.", "pj": "אִילוּלֵי פּוֹן אֱלָהֵיהּ דְאַבָּא אֱלָהֵיהּ דְאַבְרָהָם וּדְדָחִיל לֵיהּ יִצְחָק הֲוָה בְסַעֲדִי אֲרוּם כְּדוֹן רֵיקָם שְׁלַחְתַּנִי יַת סִיגוּפִי וְיַת לֵיאוֹת יְדַיי גְלֵי קֳדָם יְיָ בְּגִין כֵּן אוֹכַח בְּרַמְשָׁא", "pj_en": "Unless the God of my father, the God of Abraham, and He whom Izhak feareth had been in my help, even now hadst thou sent me away empty: but my affliction and the travail of my hands are manifest before the Lord, and therefore He admonished thee in the evening.", "tj": "", "tj_en": "", "rashi": "<b>ופחד יצחק.<\/b> לֹא רָצָה לוֹמַר אֱלֹהֵי יִצְחָק, שֶׁאֵין הַקָּבָּ\"ה מְיַחֵד שְׁמוֹ עַל הַצַּדִּיקִים בְּחַיֵּיהֶם, וְאַעַ\"פִּ שֶׁאָמַר לוֹ בְּצֵאתוֹ מִבְּאֵר שֶׁבַע אֲנִי ה' אֱלֹהֵי אַבְרָהָם אָבִיךָ וֵאלֹהֵי יִצְחָק, בִּשְׁבִיל שֶׁכָּהוּ עֵינָיו, וַהֲרֵי הוּא כַּמֵּת; יַעֲקֹב נִתְיָרֵא לוֹמַר אֱלֹהֵי, וְאָמַר וּפַחַד:<br><br><b>ויוכח.<\/b> לְשׁוֹן תּוֹכָחָה הוּא וְלֹא לְשׁוֹן הוֹכָחָה:", "rashi_en": "ופחד יצחק AND THE DREAD OF ISAAC — He did not like to say “God of Isaac” because God does not associate His name with the righteous whilst they are alive. And although He (God) said, when he (Jacob) was departing from Beer-Sheba, (Genesis 28:13) “I am the Lord, the God of Abraham thy father and the God of Isaac”, this was because his (Isaac’s) eyes were dim and he might therefore be regarded as dead (Midrash Tanchuma, Toldot 7) — Jacob, however, feared to say “God of Isaac” and said “the Dread”.<br><br>ויוכח The word here has the meaning of reproof (“and he reproved thee”; cf. Genesis 5:24) and not of deciding (as in Genesis 5:37)."}, {"ch": 31, "v": 43, "aliyah": 7, "heb": "וַיַּ֨עַן לָבָ֜ן וַיֹּ֣אמֶר אֶֽל־יַעֲקֹ֗ב הַבָּנ֨וֹת בְּנֹתַ֜י וְהַבָּנִ֤ים בָּנַי֙ וְהַצֹּ֣אן צֹאנִ֔י וְכֹ֛ל אֲשֶׁר־אַתָּ֥ה רֹאֶ֖ה לִי־ה֑וּא וְלִבְנֹתַ֞י מָֽה־אֶעֱשֶׂ֤ה לָאֵ֙לֶּה֙ הַיּ֔וֹם א֥וֹ לִבְנֵיהֶ֖ן אֲשֶׁ֥ר יָלָֽדוּ׃", "onk": "וַאֲתֵיב לָבָן וַאֲמַר לְיַעֲקֹב בְּנָתָא בְּנָתַי וּבְנַיָּא בְנַי וְעָנָא עָנִי וְכֹל דִּי אַתְּ חָזֵי דִּילִי הוּא וְלִבְנָתַי מָה אֶעְבֵּיד לְאִלֵּין יוֹמָא דֵין אוֹ לִבְנֵיהֶן דִּילִידָן:", "onk_en": "Lavan replied and said to Yaakov, The daughters are my daughters, and the sons are my sons, and the[se] flocks are my flocks. All that you see is mine. What can I do unto these, my daughters, today, or to their children that they have born.", "pj": "וְאָתֵיב לָבָן וַאֲמַר לְיַעֲקב בָּנָתָא דִי נְסֵיבַת לִנְשִׁין בְּרַתַּיַי הִינִין וּבְנַיָא דִילִידַן הֵי כִּבְנַי חֲשִׁיבִין וְעָנָא מִן עָנַיי הֲווֹ וְכָל דְאַנְתְּ חָמֵי מִן דִילִי הוּא וְלִבְרַתַּיַי מָה אֵיכוּל לְמֶעֱבַד לְאִילֵין יוֹמָא דֵין אוֹ לִבְנֵיהֶן דִילִידָן", "pj_en": "And Laban answered and said to Jakob, The children whom thou hast received of thy wives are my children, and the children whom they may bear will be reputed as mine, and the sheep are my sheep and all that thou seest is mine. And for my daughters what can I do this day, and for the soils which they have borne?", "tj": "", "tj_en": "", "rashi": "<b>מה אעשה לאלה.<\/b> אֵיךְ תַּעֲלֶה עַל לִבִּי לְהָרַע לָהֶן:", "rashi_en": "מה אעשה לאלה WHAT CAN I DO UNTO THEM — How could it enter my mind injure them, my daughters! "}, {"ch": 31, "v": 44, "aliyah": 7, "heb": "וְעַתָּ֗ה לְכָ֛ה נִכְרְתָ֥ה בְרִ֖ית אֲנִ֣י וָאָ֑תָּה וְהָיָ֥ה לְעֵ֖ד בֵּינִ֥י וּבֵינֶֽךָ׃", "onk": "וּכְעַן אֱתָא נִגְזַר קְיָם אֲנָא וְאָתְּ וִיהֵי לְסָהִיד בֵּינִי וּבֵינָךְ:", "onk_en": "Now come [therefore] let us make a pact, I and you. Let Him be witness between me and you.", "pj": "וּכְדוֹן אִיתָא וְנִגְזַר קְיַם אֲנָא וְאַנְתְּ וִיהֵי לְסָהִיד בֵּינָא וּבֵינָךְ", "pj_en": "And now come, let us strike a covenant, I and thou, and it shall be for a witness between me and thee.", "tj": "", "tj_en": "", "rashi": "<b>והיה לעד.<\/b> הַקָּבָּ\"ה:", "rashi_en": "והיה לעד means and LET GOD BE FOR A WITNESS."}, {"ch": 31, "v": 45, "aliyah": 7, "heb": "וַיִּקַּ֥ח יַעֲקֹ֖ב אָ֑בֶן וַיְרִימֶ֖הָ מַצֵּבָֽה׃", "onk": "וּנְסִיב יַעֲקֹב אַבְנָא וּזְקָפַהּ קָמָא:", "onk_en": "Yaakov took a boulder and raised it as a monument.", "pj": "וּנְסֵיב יַעֲקב אַבְנָא וְזָקְפָא לְקָמָא", "pj_en": "And Jakob took a stone and set it up for a pillar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 46, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יַעֲקֹ֤ב לְאֶחָיו֙ לִקְט֣וּ אֲבָנִ֔ים וַיִּקְח֥וּ אֲבָנִ֖ים וַיַּֽעֲשׂוּ־גָ֑ל וַיֹּ֥אכְלוּ שָׁ֖ם עַל־הַגָּֽל׃", "onk": "וַאֲמַר יַעֲקֹב לַאֲחוֹהִי לְקוּטוּ אַבְנִין וּנְסִיבוּ אַבְנִין וַעֲבָדוּ דְגוֹרָא וַאֲכָלוּ תַמָּן עַל דְּגוֹרָא:", "onk_en": "Yaakov said to his brethren, Gather stones. They took stones and made a mound, and they ate on the mound.", "pj": "וַאֲמַר יַעֲקב לִבְנוֹי דַהֲוָה קָרֵי לְהוֹם אָחוּי לְקוּטוּ אַבְנִין וְלַקִטוּ אַבְנִין וַעֲבָדוּ אוֹגַר וַאֲכָלוּ תַמָן עַל אוֹגְרָא", "pj_en": "And Jakob said to his sons, whom he called his brethren, Collect stones. And they collected stones, and made a mound, and they ate upon the mound.", "tj": "", "tj_en": "", "rashi": "<b>לאחיו.<\/b> הֵם בָּנָיו שֶׁהָיוּ לוֹ אַחִים, נִגָּשִׁים אֵלָיו לְצָרָה וּלְמִלְחָמָה (בראשית רבה):", "rashi_en": "לאחיו UNTO HIS BRETHREN — really his sons, who were like brothers to him since they were standing by him in trouble and in battle (Genesis Rabbah 74:13). "}, {"ch": 31, "v": 47, "aliyah": 7, "heb": "וַיִּקְרָא־ל֣וֹ לָבָ֔ן יְגַ֖ר שָׂהֲדוּתָ֑א וְיַֽעֲקֹ֔ב קָ֥רָא ל֖וֹ גַּלְעֵֽד׃", "onk": "וּקְרָא לֵיהּ לָבָן יְגַר שַׂהֲדוּתָא וְיַעֲקֹב קְרָא לֵיהּ גַּלְעֵד:", "onk_en": "Lavan called it Yegar Sohadusa, but Yaakov called it Galeid.", "pj": "וּקְרָא לֵיהּ לָבָן אוֹגַר סָהִיד וְיַעֲקב קָרָא לֵיהּ בְּלִישַׁן בֵּית קוּדְשָׁא גַלְעֵד", "pj_en": "And Laban called it Ogar Sahid but Jakob called it in the holy tongue, Gal-ed. &lt;&lt;", "tj": "", "tj_en": "", "rashi": "<b>יגר שהדותא.<\/b> תַּרְגּוּמוֹ שֶׁל גַּלְעֵד:<br><br><b>גלעד.<\/b> גַּל עֵד:", "rashi_en": "יגר שהדותא This is the Aramaic of גלעד.<br><br>גלעד —  is really two words — גל עד heap of testimony. "}, {"ch": 31, "v": 48, "aliyah": 7, "heb": "וַיֹּ֣אמֶר לָבָ֔ן הַגַּ֨ל הַזֶּ֥ה עֵ֛ד בֵּינִ֥י וּבֵינְךָ֖ הַיּ֑וֹם עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ גַּלְעֵֽד׃", "onk": "וַאֲמַר לָבָן דְּגוֹרָא הָדֵין סָהִיד בֵּינִי וּבֵינָךְ יוֹמָא דֵין עַל כֵּן קְרָא שְׁמֵיהּ גַּלְעֵד:", "onk_en": "Lavan said, This mound is witness between me and you this day. He therefore called its name Galeid.", "pj": "וַאֲמַר לָבָן דָגוֹרָא הָדֵין סָהִיד בֵּינָא וּבֵנָךְ יוֹמָא דֵין עַל כֵּן קְרָא שְׁמֵיהּ גַלְעֵד", "pj_en": "And Laban said, This mound is a witness between me and you today; therefore it was called, Gal-ed;&gt;&gt;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 49, "aliyah": 7, "heb": "וְהַמִּצְפָּה֙ אֲשֶׁ֣ר אָמַ֔ר יִ֥צֶף יְהֹוָ֖ה בֵּינִ֣י וּבֵינֶ֑ךָ כִּ֥י נִסָּתֵ֖ר אִ֥ישׁ מֵרֵעֵֽהוּ׃", "onk": "וְסָכוּתָא דִּי אֲמַר יִסֶךְ <b>מֵימְרָא דַ<\/b>יְיָ בֵּינִי וּבֵינָךְ אֲרֵי נִתְכַּסִּי גְּבַר מֵחַבְרֵיהּ:", "onk_en": "And [he also called it] Mitzpah [Watchtower] because he said, [<b>The Word of<\/b>] Adonoy will watch between me and you, when we are concealed from each other[’s sight].", "pj": "וּסְכוּתָא אִתְקְרִיאַת דִי אֲמַר יִסְתְּכִי יְיָ בֵּינָא וּבֵינָךְ אֲרוּם נִטְמַר גְבַר מִן חַבְרֵיהּ", "pj_en": "And The Observatory also it was called because he said The Lord shall observe between me and thee when we are hidden each man from his neighbour.", "tj": "", "tj_en": "", "rashi": "<b>והמצפה אשר אמר וגו'.<\/b> וְהַמִּצְפָּה אֲשֶׁר בְּהַר הַגִּלְעָד, כְּמוֹ שֶׁכָּתוּב וַיַּעֲבֹר אֶת מִצְפֵּה גִלְעָד (שופטים י\"א), וְלָמָּה נִקְרֵאת שְׁמָהּ מִצְפָּה? לְפִי שֶׁאָמַר אֶחָד מֵהֶם לַחֲבֵרוֹ, יִצֶף ה' בֵּינִי וּבֵינֶךָ אִם תַּעֲבֹר אֶת הַבְּרִית:<br><br><b>כי נסתר.<\/b> וְלֹא נִרְאֶה אִישׁ אֶת רֵעֵהוּ:", "rashi_en": "והמצפה אשר אמר AND MIZPAH (literally, the Mizpah); BECAUSE HE SAID etc . — The word והמצפה and the Mizpah must refer to some well-known place bearing this name (for there are several places named Mizpah) it refers to the Mizpah which is in Mount Gilead — as it is written (Judges 11:29) “and he passed over Mizpah of Gilead”. Why was it also called Mizpah? Because each of them said to the other, “The Lord watch (יצף) between me and thee that thou shouldst not violate this covenant”.<br><br>כי נסתר WHEN WE ARE ABSENT, and shall not see (be able to watch) one another."}, {"ch": 31, "v": 50, "aliyah": 7, "heb": "אִם־תְּעַנֶּ֣ה אֶת־בְּנֹתַ֗י וְאִם־תִּקַּ֤ח נָשִׁים֙ עַל־בְּנֹתַ֔י אֵ֥ין אִ֖ישׁ עִמָּ֑נוּ רְאֵ֕ה אֱלֹהִ֥ים עֵ֖ד בֵּינִ֥י וּבֵינֶֽךָ׃", "onk": "אִם תְּעַנֵּי יָת בְּנָתַי וְאִם תִּסַּב נְשִׁין עַל בְּנָתַי לֵית אֱנַשׁ עִמָּנָא חָזֵי <b>מֵימְרָא דַ<\/b>יְיָ סָהִיד בֵּינִי וּבֵינָךְ:", "onk_en": "If you afflict my daughters, or marry other wives in addition to my daughters, there may be no man with us, but see, [<b>the Word of<\/b>] Elohim is witness between me and you.", "pj": "אִין תַּסְגִיף יַת בְּרַתַּי לְמֶעֱבַד לָהֵן עוּלְבָּנָא וְאִם תִּיסַב עַל בְּרַתַּיַי לֵית אֵינַשׁ לְמִידַן יָתָן חָמֵי מֵימְרָא דַיְיָ סָהִיד בֵּינָא וּבֵינָךְ", "pj_en": "If thou shalt afflict my daughters, doing them injury, and if thou take upon my daughters, there is no man to judge us, the Word of the Lord seeing is the witness between me and thee.", "tj": "", "tj_en": "", "rashi": "<b>בנתי, בנתי.<\/b> שְׁתֵּי פְעָמִים, אַף בִּלְהָה וְזִלְפָּה בְּנוֹתָיו הָיוּ מִפִּילֶגֶשׁ:<br><br><b>אם תענה את בנתי.<\/b> לִמְנֹע מֵהֶן עוֹנַת תַּשְׁמִישׁ (יומא ע\"ז):", "rashi_en": "בנתי....בנתי The word is written twice, referring once to Leah and Rachel and the second time to the handmaids, because Bilhah and Zilpah were also his daughters from a concubine (Genesis Rabbah 74:13).<br><br>אם תענה את בנתי IF THOU SHALT AFFLICT MY DAUGHTERS by refusing them thy companionship (Yoma 77b)."}, {"ch": 31, "v": 51, "aliyah": 7, "heb": "וַיֹּ֥אמֶר לָבָ֖ן לְיַעֲקֹ֑ב הִנֵּ֣ה&thinsp;<b>׀<\/b> הַגַּ֣ל הַזֶּ֗ה וְהִנֵּה֙ הַמַּצֵּבָ֔ה אֲשֶׁ֥ר יָרִ֖יתִי בֵּינִ֥י וּבֵינֶֽךָ׃", "onk": "וַאֲמַר לָבָן לְיַעֲקֹב הָא דְגוֹרָא הָדֵין וְהָא קַמְתָא דִי <b>אֲקֵימִית<\/b> בֵּינִי וּבֵינָךְ:", "onk_en": "Lavan said to Yaakov, Here is this mound, and here is this monument that I have cast [<b>established<\/b>] between me and you.", "pj": "וַאֲמַר לָבָן לְיַעֲקב הָא אוֹגַר הָדֵין וְהָא קָמָא דְאַקֵימִית בֵּינָא וּבֵינָךְ", "pj_en": "And Laban said to Jakob, Behold this mound, and behold the pillar which thou hast reared between me and thee.", "tj": "", "tj_en": "", "rashi": "<b>יריתי.<\/b> כְּמוֹ יָרָה בַיָּם, כְּזֶה שֶׁהוּא יוֹרֶה הַחֵץ:", "rashi_en": "יריתי I HAVE SET UP (by casting stones down); the word has the same meaning as (Exodus 15:4) “He cast (ירה) into the sea”. Laban speaks like a person who casts (יורה) one arrow (Midrash Rabbah has “one spear”) and boasts of his prowess."}, {"ch": 31, "v": 52, "aliyah": 7, "heb": "עֵ֚ד הַגַּ֣ל הַזֶּ֔ה וְעֵדָ֖ה הַמַּצֵּבָ֑ה אִם־אָ֗נִי לֹֽא־אֶעֱבֹ֤ר אֵלֶ֙יךָ֙ אֶת־הַגַּ֣ל הַזֶּ֔ה וְאִם־אַ֠תָּ֠ה לֹא־תַעֲבֹ֨ר אֵלַ֜י אֶת־הַגַּ֥ל הַזֶּ֛ה וְאֶת־הַמַּצֵּבָ֥ה הַזֹּ֖את לְרָעָֽה׃", "onk": "סָהִיד דְּגוֹרָא הָדֵין וְסָהֲדָא קָמָא אִם אֲנָא לָא אֶעְבַּר לְוָתָךְ יָת דְּגוֹרָא הָדֵין וְאִם אַתְּ לָא תֵעִבַּר לְוָתִי יָת דְּגוֹרָא הָדֵין וְיָת קַמְתָא הָדָא לְבִישׁוּ:", "onk_en": "This mound is witness, and the monument is witness, that I will not cross over to you beyond this mound; and you are not to cross over to me beyond this mound and this monument for harmful purposes.", "pj": "סְהִיד אוֹגַר הָדֵין וּסְהִידָא קָמָא אִין אֲנָא לָא אֲעִיבַר לְוָתָךְ יַת אוֹגַר הָדֵין וְאִין אַנְתְּ לָא תְעִיבַר לְוָתִי יַת אוֹגַר הָדֵין וְיַת קָמָא הָדָא לְאַבְאָשָׁא", "pj_en": "This mound is a witness, and this pillar is a witness, that I may not pass beyond this mound to thee, and that thou mayest not pass beyond this mound and this pillar to do harm.", "tj": "", "tj_en": "", "rashi": "<b>אם אני.<\/b> הֲרֵי אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, כְּמוֹ עַד אִם דִּבַּרְתִּי דְּבָרָי:<br><br><b>לרעה.<\/b> לְרָעָה אִי אַתָּה עוֹבֵר, אַבָל אַתָּה עוֹבֵר לִפְרַקְמַטְיָה:", "rashi_en": "אם אני THAT I WILL NOT — Here the word אם is used in the sense of אשר “that”, as (Genesis 24:33) “until that (אם) I have spoken my words”.<br><br>לרעה FOR EVIL — For evil you may not pass, but for trading purposes (as e. g., with a caravan) you may pass (Genesis Rabbah 74:16). "}, {"ch": 31, "v": 53, "aliyah": 7, "heb": "אֱלֹהֵ֨י אַבְרָהָ֜ם וֵֽאלֹהֵ֤י נָחוֹר֙ יִשְׁפְּט֣וּ בֵינֵ֔ינוּ אֱלֹהֵ֖י אֲבִיהֶ֑ם וַיִּשָּׁבַ֣ע יַעֲקֹ֔ב בְּפַ֖חַד אָבִ֥יו יִצְחָֽק׃", "onk": "אֱלָהֵהּ דְּאַבְרָהָם וֵאֱלָהֵהּ דְּנָחוֹר יְדוּנוּן בֵּינָנָא אֱלָהֵהּ דַאֲבוּהוֹן וְקַיֵּים יַעֲקֹב <b>בִּדְדָחִיל לֵיהּ אֲבוּהִי יִצְחָק<\/b>:", "onk_en": "The God of Avraham and the god of Nachor, the god of their fathers will judge between us. Yaakov swore by the Fear of his father, Yitzchok [<b>He who Yitchok his father feared<\/b>].", "pj": "אֱלָהֵיהּ דְאַבְרָהָם וֶאֱלָהֵיהּ דְנָחוֹר יְדִינוּן בֵּינָנָא אֱלָהֵיהּ דַאֲבוּהוֹן וְקַיֵים יַעֲקב בֶּאֱלָהָא דְדָחֵיל לֵיהּ אָבוֹי יִצְחָק", "pj_en": "The God of Abraham and the God of Nachor shall judge between us, the God of their fathers. But Jakob sware by the God whom his father Izhak feared.", "tj": "", "tj_en": "", "rashi": "<b>אלהי אברהם.<\/b> קֹדֶשׁ (בראשית רבה):<br><br><b>ואלהי נחור.<\/b> חֹל:<br><br><b>אלהי אביהם.<\/b> חֹל:", "rashi_en": "אלהי אברהם GOD OF ABRAHAM — Here the word אלהים is holy (i.e. it is the Divine Name). (Genesis Rabbah 74:17)<br><br>אלהי נחור THE GOD OF NAHOR — Here the name is non-holy (i.e. it is a designation for an idol) (Genesis Rabbah 74:17).<br><br>אלהי אביהם THE GOD OF THEIR FATHER — Here the name is non-holy (Genesis Rabbah 74:17). "}, {"ch": 31, "v": 54, "aliyah": 7, "heb": "וַיִּזְבַּ֨ח יַעֲקֹ֥ב זֶ֙בַח֙ בָּהָ֔ר וַיִּקְרָ֥א לְאֶחָ֖יו לֶאֱכׇל־לָ֑חֶם וַיֹּ֣אכְלוּ לֶ֔חֶם וַיָּלִ֖ינוּ בָּהָֽר׃", "onk": "וּנְכֵס יַעֲקֹב נִכְסָתָא בְּטוּרָא וּקְרָא לַאֲחוֹהִי לְמֵיכַל לַחֲמָא וַאֲכָלוּ לַחֲמָא וּבִיתוּ בְּטוּרָא:", "onk_en": "Yaakov slaughtered animals on the mountain, and invited his brethren to eat bread [a meal]. They ate bread and spent the night on the mountain.", "pj": "וּנְכַס יַעֲקב נִכְסְתָא בְּטַוְורָא וְזַמֵן לְקָרִיבוֹי דְאָתוּ עִם לָבָן לְמִסְעוֹד לַחֲמָא וּסְעָדוּ וּבָתוּ בְּטַוְורָא", "pj_en": "And Jakob slew sacrifices in the mount, and invited his kinsmen who came with Laban to help themselves to bread, (or strengthen themselves with bread,) and they helped themselves to bread, and lodged in the mount.", "tj": "", "tj_en": "", "rashi": "<b>ויזבח יעקב זבח.<\/b> שָׁחַט בְּהֵמוֹת לְמִשְׁתֶּה:<br><br><b>לאחיו.<\/b> לְאוֹהֲבָיו שֶׁעִם לָבָן:<br><br><b>לאכל לחם.<\/b> כָּל דְּבַר מַאֲכָל קָרוּי לֶחֶם, כְּמוֹ עֲבַד לְחֶם רַב (דניאל ה'), נַשְׁחִיתָה עֵץ בְּלַחְמוֹ (ירמיהו י\"א):", "rashi_en": "ויזבח יעקב זבח AND JACOB OFFERED A SACRIFICE — he slaughtered cattle for the feast<br><br>לאחיו HIS BRETHREN — those of his friends who were with Laban (cf Targum Jonathan)<br><br>לאכל לחם TO EAT BREAD — Any article of food is termed לחם bread, as (Daniel 5:1) “made a great feast (לחם רב)”, and (Jeremiah 11:19) “Let us destroy the tree with the fruit thereof (בלחמו)\"."}, {"ch": 32, "v": 1, "aliyah": 7, "heb": "וַיַּשְׁכֵּ֨ם לָבָ֜ן בַּבֹּ֗קֶר וַיְנַשֵּׁ֧ק לְבָנָ֛יו וְלִבְנוֹתָ֖יו וַיְבָ֣רֶךְ אֶתְהֶ֑ם וַיֵּ֛לֶךְ וַיָּ֥שׇׁב לָבָ֖ן לִמְקֹמֽוֹ׃", "onk": "וְאַקְדֵם לָבָן בְּצַפְרָא וּנְשַׁק לִבְנוֹהִי וְלִבְנָתֵיהּ וּבָרִיךְ יָתְהֵן וַאֲזַל וְתַב לָבָן לְאַתְרֵיהּ:", "onk_en": "Lavan rose early in the morning. He kissed his sons and daughters and blessed them. Lavan departed and returned to his place.", "pj": "וְאַקְדִים לָבָן בְּצַפְרָא וּנְשֵׁיק לִבְנוֹי דְיַעֲקב וְלִבְנָתֵיהּ דְלֵיהּ וּבְרִיךְ יַתְהוֹן וְאָזַל וְתַב לָבָן לְאַתְרֵיהּ", "pj_en": "And Laban arose in the morning, and kissed the sons of Jakob and his daughters, and blessed them; and Laban went and returned to his place.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 2, "aliyah": 7, "heb": "וְיַעֲקֹ֖ב הָלַ֣ךְ לְדַרְכּ֑וֹ וַיִּפְגְּעוּ־ב֖וֹ מַלְאֲכֵ֥י אֱלֹהִֽים׃", "onk": "וְיַעֲקֹב אָזַל לְאָרְחֵיהּ וַעֲרָעוּ בֵיהּ מַלְאָכַיָּא דַיְיָ:", "onk_en": "Yaakov went on his way, and the angels of Elohim met him.", "pj": "וְיַעֲקב אָזַל לְאָרְחֵיהּ וְאַרְעוּ בֵּיהּ מַלְאָכַיָא דַיְיָ", "pj_en": "And Jakob went on his way, and the angels of the Lord met him.", "tj": "", "tj_en": "", "rashi": "<b>ויפגעו בו מלאכי אלהים.<\/b> מַלְאָכִים שֶׁל אֶרֶץ יִשְׂרָאֵל בָּאוּ לִקְרָאתוֹ לְלַוּוֹתוֹ לָאָרֶץ:", "rashi_en": "ויפגעו בו מלאכי אלהים AND THE ANGELS OF GOD MET HIM — The angels who minister in the Land of Israel came to meet him in order to escort him into the Holy Land (see Genesis Rabbah 74:17). "}, {"ch": 32, "v": 3, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יַעֲקֹב֙ כַּאֲשֶׁ֣ר רָאָ֔ם מַחֲנֵ֥ה אֱלֹהִ֖ים זֶ֑ה וַיִּקְרָ֛א שֵֽׁם־הַמָּק֥וֹם הַה֖וּא מַֽחֲנָֽיִם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר יַעֲקֹב כַּד חֲזָנוּן <b>מַשְׁרִיתָא מִן קֳדָם יְיָ דֵּין<\/b> וּקְרָא שְׁמָא דְאַתְרָא הַהוּא מַחֲנָיִם:", "onk_en": "When Yaakov saw them, he said, This is Elohim’s camp. [<b>This is a camp from before Elohim.<\/b>] He named the place Machanayim.", "pj": "וַאֲמַר יַעֲקב כֵּיוָן דְחָמִינוּן לָא מַשִׁירְוַין דְעֵשָו הִינוּן דְאַתְיָין לִקְדָמוּתִי וְלָא מַשִׁירְוְיָן דְלָבָן הִינוּן דְהַדְרוּ לְמִרְדַף בַּתְרַיי אֱלָהֵין מַשִׁירְוְיָין דְמַלְאָכַיָא קַדִישִין דְאִשְׁתַּלְחוּ מִן קֳדָם יְיָ הִינוּן בְּגִין כֵּן קָרָא שְׁמֵיהּ דְאַתְרָא הַהוּא בְּלִישַׁן בֵּית קוּדְשָׁא מַחֲנָיִם", "pj_en": "And Jakob said when he saw them, These are not the host of Esau who are coming to meet me, nor the host of Laban, who have returned from pursuing me; but they are the host of the holy angels who are sent from before the Lord. Therefore the name of that place he called, in the language of the sanctuary, Machanaim.", "tj": "וַאֲמַר יַעֲקב כַּד חָמָא יַתְהוֹן דִילְמָא מַשִׁירְיָין מִן לָבָן אָחוֹי דְאִמָא אִינוּן אַתְיָין קֳדָמוֹי לִמְסַדְרָא לְקִבְלֵי סִידְרֵי קְרָבָא לְמִקְטַל יָתִי אוֹ דִלְמָא מַשִׁירְיַין דְמַלְאָכִין קַדִישִׁין מִן קֳדָם יְיָ אִינוּן וְאַתְיָין לְשֵׁיזְבָא יָתִי מִן יְדֵיהוֹן בְּגִין כְּדֵין קְרָא שְׁמֵיהּ דְאַתְרָא הַהוּא מַחֲנָיִם:", "tj_en": "And Jakob, when he beheld them, said, Perhaps they are a host from Laban, the brother of my mother, coming to set against me the array of battle to slay me; or (rather) they are a host of the holy angels from before the Lord, who are come to save me from their hands. And he called the name of that place Machanaim.", "rashi": "<b>מחנים.<\/b> שְׁתֵּי מַחֲנוֹת, שֶׁל חוּצָה לָאָרֶץ שֶׁבָּאוּ עִמּוֹ עַד כָּאן וְשֶׁל אֶרֶץ יִשְׂרָאֵל שֶׁבָּאוּ לִקְרָאתוֹ (ע' תנחומא פ' וישלח):", "rashi_en": "מחנים means two camps — the one consisting of the angels ministering outside the Holy Land who had come with him thus far, the other, of those ministering in the Land of Israel who had come to meet him (Midrash Tanchuma, Vayishlach 3)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
