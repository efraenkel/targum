<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "ki-teitzei";
const DATA = [{"ch": 21, "v": 10, "aliyah": 1, "heb": "כִּֽי־תֵצֵ֥א לַמִּלְחָמָ֖ה עַל־אֹיְבֶ֑יךָ וּנְתָנ֞וֹ יְהֹוָ֧ה אֱלֹהֶ֛יךָ בְּיָדֶ֖ךָ וְשָׁבִ֥יתָ שִׁבְיֽוֹ׃", "onk": "אֲרֵי תִפּוֹק <b>לַאֲגָחָא<\/b> <b>קְרָבָא<\/b> עַל בַּעֲלֵי דְבָבָךְ וְיִמְסְרִנּוּן יְיָ אֱלָהָךְ בִּידָךְ וְתִשְׁבֵּי שִׁבְיְהוֹן:", "onk_en": "If you should go to [<b>wage<\/b>] war against your enemies, and Adonoy, your God, puts them in your hand, and you capture prisoners from them;", "pj": "כי תצא אֲרוּם תִּפְקוּן לְסִדְרֵי קְרָבָא עַל בַּעֲלֵי דְבָבֵיכוֹן וְיִמְסְרִינוּן יְיָ אֱלָהָכוֹן בְּיֶדְכוֹן וְתִשְׁבֵי שִׁבְיָתָא מִנְהוֹן", "pj_en": "WHEN you go out to war against your enemies, and the Lord your God shall deliver them into your hands, and you take some of them captive:", "tj": "", "tj_en": "", "rashi": "<b>כי תצא למלחמה.<\/b> בְּמִלְחֶמֶת הָרְשׁוּת הַכָּתוּב מְדַבֵּר, שֶׁבְּמִלְחֶמֶת אֶרֶץ יִשְׂרָאֵל אֵין לוֹמַר וְשָׁבִיתָ שִׁבְיוֹ, שֶׁהֲרֵי כְבָר נֶאֱמַר (דברים כ') לֹא תְחַיֶּה כָּל נְשָׁמָה:<br><br><b>ושבית שביו.<\/b> לְרַבּוֹת כְּנַעֲנִים שֶׁבְּתוֹכָהּ וְאַעַ\"פִּ שֶׁהֵם מִשִׁבְעָה אֻמּוֹת (ספרי; סוטה ל\"ה):", "rashi_en": "כי תצא למלחמה WHEN THOU GOEST FORTH TO WAR — Scripture is speaking here of a war that is not obligatory upon the Israelites (Sifrei Devarim 211:1), for in regard to a war that was waged against the inhabitants of Erez Israel, Scripture could not possibly say, “and thou hast captured captives”, since it has already been stated regarding them, (Deuteronomy 20:16) “[But of the cities of those people ...] you shall not allow any soul to live”.<br><br>ושבית שביו AND THOU HAST CAPTURED CAPTIVES — These apparently redundant words are intended to include Canaanite people living in it (in a city outside Canaan), that it is allowed to capture them although they belong to the seven nations (Sifrei Devarim 211:4; Sotah 35b)."}, {"ch": 21, "v": 11, "aliyah": 1, "heb": "וְרָאִ֙יתָ֙ בַּשִּׁבְיָ֔ה אֵ֖שֶׁת יְפַת־תֹּ֑אַר וְחָשַׁקְתָּ֣ בָ֔הּ וְלָקַחְתָּ֥ לְךָ֖ לְאִשָּֽׁה׃", "onk": "וְתֶחֱזֵי בְּשִׁבְיָה אִתְּתָא שַׁפִּירַת חֵזוּ וְתִתְרְעֵי בַהּ וְתִסְּבַהּ לָךְ לְאִנְתּוּ:", "onk_en": "And you see among the prisoners a beautifully formed woman; if you desire her, you may take her as your wife.", "pj": "וְתֵיחֲמוּן בִּשְׁבִיתָא אִתָּא שַׁפִּירַת רֵיוֵוי וְתִתְיַדְעוּן בָּהּ וְתִסְבוּנָהּ לְכוֹן לְאִינְתּוּ", "pj_en": "if you see in the captivity a woman of fair countenance, and you approve of her, and would take her to you to wife;", "tj": "", "tj_en": "", "rashi": "<b>אשת.<\/b> אֲפִלּוּ אֵשֶׁת אִישׁ:<br><br><b>ולקחת לך לאשה.<\/b> לֹא דִּבְּרָה תוֹרָה אֶלָּא כְּנֶגֶד יֵצֶר הָרַע, שֶׁאִם אֵין הַקָּבָּ\"ה מַתִּירָהּ יִשָּׂאֶנָּה בְאִסּוּר, אֲבָל אִם נְשָׂאָהּ סוֹפוֹ לִהְיוֹת שׂוֹנְאָהּ, שֶׁנֶּאֱמַר אַחֲרָיו \"כִּי תִהְיֶיןָ לְאִישׁ וְגוֹ'\", וְסוֹפוֹ לְהוֹלִיד מִמֶּנָּה בֵּן סוֹרֵר וּמוֹרֶה, לְכָךְ נִסְמְכוּ פָּרָשִׁיּוֹת הַלָּלוּ (תנחומא):", "rashi_en": "אשת [AND THOU SEEST AMONG THE CAPTIVES] A WOMAN — even if she be a married woman (Sifrei Devarim 211:7; Kiddushin 21b).<br><br>ולקחת לך לאשה [AND THOU DELIGHTEST IN HER,] THAT THOU WOULDEST TAKE HER FOR THY WIFE) — Scripture is speaking (makes this concession) only in view of man’s evil inclination (his carnal desires) (Kiddushin 21b). For if the Holy One, blessed be He, would not permit her to him as a wife, he would nevertheless marry her although she would then be forbidden to him. However, if he does marry her, in the end he will hate her, for Scripture writes immediately afterwards, (v. 15) “If a man have two wives, one beloved, and another hated, etc.” and ultimately he will beget a refractory and rebellious son by her (v. 18). It is for this reason that these sections are put in juxtaposition (Midrash Tanchuma, Ki Teitzei 1).\n"}, {"ch": 21, "v": 12, "aliyah": 1, "heb": "וַהֲבֵאתָ֖הּ אֶל־תּ֣וֹךְ בֵּיתֶ֑ךָ וְגִלְּחָה֙ אֶת־רֹאשָׁ֔הּ וְעָשְׂתָ֖ה אֶת־צִפׇּרְנֶֽיהָ׃", "onk": "וְתָעֵלִנַּהּ לְגוֹ בֵיתָךְ וּתְגַלַּח יָת רֵישַׁהּ <b>וּתְרַבִּי<\/b> יָת טוּפְרָנָהָא:", "onk_en": "You will bring her into your house and she will shave her head and allow her nails to grow.", "pj": "וְתַעֲלִינָהּ לְגוֹ בֵּיתָךְ וּתְסַפַּר יַת מַזְיָיא דְרֵישָׁהּ וְתִיצְמֵי יַת טוּפְרְיָיהָא", "pj_en": "then thou shalt take her into thy house, and let her cut off the hair of her head, pare her nails,", "tj": "", "tj_en": "", "rashi": "<b>ועשתה את צפרניה.<\/b> תְּגַדְּלֵם כְּדֵי שֶׁתִּתְנַוֵּל (ספרי; יבמות מ\"ח):", "rashi_en": "ועשת את צפרניה means, AND SHE SHALL LET GROW HER NAILS — She must let them grow, so that she should becomes repulsive to her captor (cf. Sifrei Devarim 212:4; Yevamot 48a; see also Rashi on Genesis 1:7 and our Note thereon)."}, {"ch": 21, "v": 13, "aliyah": 1, "heb": "וְהֵסִ֩ירָה֩ אֶת־שִׂמְלַ֨ת שִׁבְיָ֜הּ מֵעָלֶ֗יהָ וְיָֽשְׁבָה֙ בְּבֵיתֶ֔ךָ וּבָ֥כְתָ֛ה אֶת־אָבִ֥יהָ וְאֶת־אִמָּ֖הּ יֶ֣רַח יָמִ֑ים וְאַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֙יהָ֙ וּבְעַלְתָּ֔הּ וְהָיְתָ֥ה לְךָ֖ לְאִשָּֽׁה׃", "onk": "וְתֶעְדֵּי יָת כְּסוּת שִׁבְיַהּ מִנַּהּ וְתֵיתַב בְּבֵיתָךְ וְתִבְכֵּי יָת אֲבוּהָא וְיָת אִמַּהּ יְרַח יוֹמִין וּבָתַר כֵּן תֵּעוּל לְוָתַהּ וְתִבְעֲלִנַּהּ וּתְהֵי לָךְ לְאִנְתּוּ:", "onk_en": "She must discard her prisoner’s garb from upon her, and she will remain in your home and weep for her father and her mother a month of days; and afterwards you may come to her and consummate with her, and she will become your wife.", "pj": "וּתְשַׁנֵי יַת כְּסוּת שִׁבְיָיתָהּ מִינָהּ וְתִטְבְּלִינָהּ וּתְגַיְירִינָהּ בְּבֵיתָךְ וְתִבְכֵּי עַל טַעֲוַות בֵּית אַבָּהּ וְאִמָּהּ וְתִשְׁהֵי תְּלַת יַרְחִין דִּי תֵדַע אִין הִיא מְעַבְּרָא וּמִן בָּתַר כְּדֵין תֵּיעוּל לְוָותָהּ וְתַפְרִין יָתָהּ וְתֶהֱוֵי לָךְ לְאִנְתּוּ", "pj_en": "and put off the dress of her captivity, and, dipping herself, become a proselyte in thy house, and weep on account of the idols of the house of her father and mother. And thou shalt wait three months to know whether she be with child; and afterwards thou mayest go to her, endow her, and make her thy wife.", "tj": "", "tj_en": "", "rashi": "<b>והסירה את שמלת שביה.<\/b> לְפִי שֶׁהֵם נָאִים, שֶׁהַגּוֹיִם בְּנוֹתֵיהֶם מִתְקַשְּׁטוֹת בַּמִּלְחָמָה בִּשְׁבִיל לְהַזְנוֹת אֲחֵרִים עִמָּהֶם (ספרי):<br><br><b>וישבה בביתך.<\/b> בַּבַּיִת שֶׁמִּשְׁתַּמֵּשׁ בּוֹ, נִכְנָס וְנִתְקָל בָּהּ, יוֹצֵא וְנִתְקָל בָּה, רוֹאֶה בִּבְכִיָּתָהּ, רוֹאֶה בְּנִוּוּלָהּ, כְּדֵי שֶׁתִּתְגַנֶּה עָלָיו (ספרי):<br><br><b>ובכתה את אביה.<\/b> כָּל כָּךְ לָמָּה? כְּדֵי שֶׁתְּהֵא בַּת יִשְׂרָאֵל שְׂמֵחָה וְזוֹ עֲצֵבָה, בַּת יִשְׂרָאֵל מִתְקַשֶּׁטֶת וְזוֹ מִתְנַוֶּלֶת (שם):", "rashi_en": "והסירה את שמלת שביה AND SHE SHALL REMOVE THE RAIMENT OF HER CAPTIVITY — the reason is because these are fine clothes, for the women of the heathen peoples adorned themselves in time of war in order to lure others (the enemy) to unchastity with them (Sifrei Devarim 213:1).<br><br>וישבה בביתך AND SHE SHALL DWELL IN “THY” HOUSE — [not in the women’s apartments, but] in the house which he constantly uses: when he goes in he stumbles upon her, when he leaves he stumbles upon her (i.e. he cannot avoid meeting her constantly and the novelty of her beauty wears off); he sees her endless crying, sees her neglected appearance — and all this in order that she should become repulsive to him (Sifrei Devarim 213:2).<br><br>ובכתה את אביה AND SHE SHALL WEEP FOR HER FATHER [AND HER MOTHER A FULL MONTH] — Why all this? In order to make a contrast — that while the Jewish woman (the captor’s Jewish wife) is gladsome, she should be downhearted, while the Jewish woman adorns herself, this one should bear a neglected appearance (Sifrei Devarim 213:5)."}, {"ch": 21, "v": 14, "aliyah": 1, "heb": "וְהָיָ֞ה אִם־לֹ֧א חָפַ֣צְתָּ בָּ֗הּ וְשִׁלַּחְתָּהּ֙ לְנַפְשָׁ֔הּ וּמָכֹ֥ר לֹא־תִמְכְּרֶ֖נָּה בַּכָּ֑סֶף לֹא־תִתְעַמֵּ֣ר בָּ֔הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיהֵי אִם לָא תִתְרְעֵי בַהּ <b>וְתִפְטְרִנַּהּ<\/b> לְנַפְשַׁהּ וְזַבָּנָא לָא תְזַבְּנִנַּהּ בְּכַסְפָּא לָא תִתָּגַר בַּהּ חֲלַף דִּי עִנִּיתַהּ:", "onk_en": "But it shall come to pass, that if you do not desire her you will send her free, but to sell—you may not sell her for money; you may not exploit her since you have oppressed her.", "pj": "וִיהֵי אִין לָא תִתְרְעֵי בָּהּ וְתִפְטְרִינָהּ לְבִלְחוֹדָהּ בְּגִיטָא וְזַבָּנָא לָא תְזַבְּנִינָהּ בְּכַסְפָּא לָא תִתְגָר בָּהּ בָּתַר דְּשַׁמַּשְׁתָּ עִמָּהּ", "pj_en": "But if thou hast no pleasure in her, then thou mayest send her away, only with a writing of divorce: but thou shalt in no wise sell her for money, nor make merchandise of her, after thou hast had intercourse with her.", "tj": "אִין לָא אִתְרְעֵי אַתְּ בָּהּ וְתִשְׁלַח יָתָהּ בִּרְשׁוּת נַפְשָׁהּ וּמְזַבְּנָא לָא תַזְבִּין יָתָהּ בִּכְסַף לָא תִתְגַר בָּהּ דִּי יְהִיבַת רְשׁוּתָךְ עֲלָהּ:", "tj_en": "If thou hast no pleasure in her, thou mayest send her away with power over herself; but thou shalt in no wise sell her for money, nor make merchandise of her; because thy power over her is given up.", "rashi": "<b>והיה אם לא חפצת בה.<\/b> הַכָּתוּב מְבַשֶּׂרְךָ שֶׁסּוֹפְךָ לִשְׂנֹאתָהּ (שם):<br><br><b>לא תתעמר בה.<\/b> לֹא תִּשְׁתַּמֵּשׁ בָּהּ, בִּלְשׁוֹן פַּרְסִי קוֹרִין לְעַבְדוּת וְשִׁמּוּשׁ \"עִימְרָאָה\", מִיסוֹדוֹ שֶׁל רַ' מֹשֶׁה הַדַּרְשָׁן לָמַדְתִּי כֵן:", "rashi_en": "והיה אם לא חפצת בה AND IT SHALL BE, IF THOU ART NOT PLEASED WITH HER — Scripture tell you that you will in the end hate her (Sifrei Devarim 214:1).<br><br>לא תתעמר בה means; THOU SHALT NOT USE HER AS A SLAVE. In the Persian language slavery and servitude is termed עימראה. I learned this from the work of R. Moses the Preacher."}, {"ch": 21, "v": 15, "aliyah": 1, "heb": "כִּֽי־תִהְיֶ֨יןָ לְאִ֜ישׁ שְׁתֵּ֣י נָשִׁ֗ים הָאַחַ֤ת אֲהוּבָה֙ וְהָאַחַ֣ת שְׂנוּאָ֔ה וְיָֽלְדוּ־ל֣וֹ בָנִ֔ים הָאֲהוּבָ֖ה וְהַשְּׂנוּאָ֑ה וְהָיָ֛ה הַבֵּ֥ן הַבְּכֹ֖ר לַשְּׂנִיאָֽה׃", "onk": "אֲרֵי תְהֶוְיָן לִגְבַר תַּרְתֵּין נְשִׁין חֲדָא רְחֶמְתָּא וַחֲדָא שְׂנִיאֲתָא וִילִידָן לֵיהּ בְּנִין רְחֶמְתָּא וּשְׂנִיאֲתָא וִיהֵי בְּרָא בוּכְרָא לִשְׂנִיאֲתָא:", "onk_en": "If a man has two wives, one loved and the other hated, and they bear him sons, the loved [one] and the hated [one], and the firstborn son will be the hated one’s.", "pj": "אֲרוּם תֶּהֶוְיָין לִגְבַר תַּרְתֵּין נְשִׁין חֲדָא רְחִימְתָּא לֵיהּ וַחֲדָא סְנִיתָא לֵיהּ וִילֵדַן לֵיהּ בְּנִין רְחוּמְתָּא וּסְנוּתָא וִיהֵי בִּיר בּוּכְרָא לִסְנֵיתָא", "pj_en": "If a man have two wives, and one is beloved and the other hated, and they bear him sons, both the beloved and the hated (wife), and the first-born son be of the hated,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 16, "aliyah": 1, "heb": "וְהָיָ֗ה בְּיוֹם֙ הַנְחִיל֣וֹ אֶת־בָּנָ֔יו אֵ֥ת אֲשֶׁר־יִהְיֶ֖ה ל֑וֹ לֹ֣א יוּכַ֗ל לְבַכֵּר֙ אֶת־בֶּן־הָ֣אֲהוּבָ֔ה עַל־פְּנֵ֥י בֶן־הַשְּׂנוּאָ֖ה הַבְּכֹֽר׃", "onk": "וִיהֵי בְּיוֹמָא דְּיַחֲסֵן לִבְנוֹהִי יָת דִּי יְהֵי לֵיהּ לֵית לֵיהּ רְשׁוּ לְבַכָּרָא יָת בַּר רְחֶמְתָּא עַל אַפֵּי בַר שְׂנִיאֲתָא בּוּכְרָא:", "onk_en": "When the day comes for him to will to his sons what he owns, he may not prefer the son of the loved one over the son of the hated one—the firstborn.", "pj": "וִיהֵי בְּיוֹם אַחֲסִינְתֵּיהּ יַת בְּנוֹי יַת נִיכְסִין דִּיהֵי לֵיהּ לֵית לֵיהּ רְשׁוּ לְמִתַּן חוּלַק בְּכוֹרוֹתָא לְבַר רְחוּמְתָּא עַל אַנְפֵּי בִּיר סְנֵיתָא דְהוּא בּוּכְרָא", "pj_en": "it shall be in the day that he deviseth to his sons the inheritance of the wealth that may be his, he shall not be allowed to give the birthright portion to the son of the beloved, over the head of the son of the hated wife, to whom the birthright belongs;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 17, "aliyah": 1, "heb": "כִּי֩ אֶת־הַבְּכֹ֨ר בֶּן־הַשְּׂנוּאָ֜ה יַכִּ֗יר לָ֤תֶת לוֹ֙ פִּ֣י שְׁנַ֔יִם בְּכֹ֥ל אֲשֶׁר־יִמָּצֵ֖א ל֑וֹ כִּי־הוּא֙ רֵאשִׁ֣ית אֹנ֔וֹ ל֖וֹ מִשְׁפַּ֥ט הַבְּכֹרָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי יָת בּוּכְרָא בַר שְׂנִיאֲתָא <b>יַפְרַשׁ<\/b> לְמִתַּן לֵיהּ תַּרְתֵּין חֳלָקִין בְּכֹל דִּי יִשְׁתְּכַח לֵיהּ אֲרֵי הוּא רֵישׁ תָּקְפֵּיהּ לֵיהּ <b>חָזְיָא<\/b> בְכֵרוּתָא:", "onk_en": "Rather, the firstborn son of the hated one is he to recognize [<b>separate<\/b>] to give him doublefold of all that he possesses; for he is the first of his power, he has the rights of primogeniture.", "pj": "אֲרוּם יַת בּוּכְרָא בִּיר סְנֵיתָא יְהוֹדַע לְכוֹלָא דְהוּא בּוּכְרָא לְמִתַּן לֵיהּ תְּרֵין חוּלְקִין בְּכָל מַה דְּמִשְׁתְּכַח גַּבֵּיהּ אֲרוּם הוּא שֵׁירוֹי תוּקְפֵיהּ לֵיהּ חַזְיָא בְּכֵירוּתָא", "pj_en": "but (let him acknowledge) the birthright of the son of her who is disliked, and all that belongeth to it, to give him the double portion of all that may be found with him, because he is the beginning of his strength, and to him pertaineth the birthright.", "tj": "", "tj_en": "", "rashi": "<b>פי שנים.<\/b> כְּנֶגֶד שְׁנֵי אַחִים:<br><br><b>בכל אשר ימצא לו.<\/b> מִכָּאן שֶׁאֵין הַבְּכוֹר נוֹטֵל פִּי שְׁנַיִם בָּרָאוּי לָבֹא לְאַחַר מִיתַת הָאָב כְּבַמֻּחְזָק (ספרי; בכורות נ\"א):", "rashi_en": "פי שנים A DOUBLE PORTION — i.e. a portion equal to those of two brothers together (Sifrei Devarim 217:2-4).<br><br>בכל אשר ימצא לו [BUT HE SHALL ACKNOWLEDGE THE SON OF THE HATED FOR THE FIRSTBORN, BY GIVING HIM A DOUBLE PORTION] OF ALL THAT SHALL BE FOUND WITH HIM — From here the Rabbis derived the law that the firstborn does not receive a double share of what is due to come after the death of the father (as, e.g., a debt or a legacy that were payable to his father on a certain date, before which, however, the father died — technically termed ראוי), as he does of what is actually held in possession by the father (מוחזק) (Sifrei Devarim 217:6; Bekhorot 51b)."}, {"ch": 21, "v": 18, "aliyah": 1, "heb": "כִּֽי־יִהְיֶ֣ה לְאִ֗ישׁ בֵּ֚ן סוֹרֵ֣ר וּמוֹרֶ֔ה אֵינֶ֣נּוּ שֹׁמֵ֔עַ בְּק֥וֹל אָבִ֖יו וּבְק֣וֹל אִמּ֑וֹ וְיִסְּר֣וּ אֹת֔וֹ וְלֹ֥א יִשְׁמַ֖ע אֲלֵיהֶֽם׃", "onk": "אֲרֵי יְהֵי לִגְבַר בַּר סָטֵי וּמָרֵי לֵיתוֹהִי מְקַבַּל <b>לְמֵימַר<\/b> אֲבוּהִי <b>וּלְמֵימַר<\/b> אִמֵּיהּ <b>וּמַלְּפָן<\/b> יָתֵיהּ וְלָא <b>יְקַבֵּל<\/b> מִנְּהוֹן:", "onk_en": "If a man has a wayward and rebellious son who does not obey his father[<b>’s words<\/b>] and his mother[<b>’s words<\/b>]; though they chasten [<b>teach<\/b>] him; he does not listen to [<b>obey<\/b>] them.", "pj": "אֲרוּם יְהֵי לִגְבַר בִּיר סוּרְהֲבָן וּמְרוֹד דְּלֵיתוֹי מְקַבֵּל לְמֵימָר אָבוֹי וּלְמֵימְרָא דְאִמֵּיהּ וְיִכְסְנוּן יָתֵיהּ וְלָא מְקַבֵּל אוּלְפַן מִנְהוֹן", "pj_en": "If a man hath a son depraved and rebellious, who will not obey the word of his father or of his mother, and who, when they reprove him, will not receive admonition from them;", "tj": "", "tj_en": "", "rashi": "<b>סורר.<\/b> סָר מִן הַדֶּרֶךְ:<br><br><b>ומורה.<\/b> מְסָרֵב בְדִבְרֵי אָבִיו, לְשׁוֹן מַמְרִים (דברים ט'):<br><br><b>ויסרו אתו.<\/b> מַתְרִין בּוֹ בִּפְנֵי שְׁלוֹשָׁה וּמַלְקִין אוֹתוֹ (ספרי; סנהדרין ע\"א); בֵּן סוֹרֵר וּמוֹרֶה אֵינוֹ חַיָּב עַד שֶׁיִּגְנֹב וְיֹאכַל תַּרְטֵימַר בָּשָׂר וְיִשְׁתֶּה חֲצִי לֹג יַיִן, שֶׁנֶּאֱמַר \"זוֹלֵל וְסֹבֵא\", וְנֶאֱמַר (משלי כ\"ג) \"אַל תְּהִי בְּסֹבְאֵי יָיִן בְּזֹלְלֵי בָשָׂר לָמוֹ\"; וּבֵן סוֹרֵר וּמוֹרֶה נֶהֱרָג עַל שֵׁם סוֹפוֹ, הִגִּיעָה תוֹרָה לְסוֹף דַּעְתּוֹ, סוֹף שֶׁמְּכַלֶּה מָמוֹן אָבִיו וּמְבַקֵּשׁ לִמּוּדוֹ וְאֵינוֹ מוֹצֵא, וְעוֹמֵד בְּפָרָשַׁת דְּרָכִים וּמְלַסְטֵם אֶת הַבְּרִיּוֹת, אָמְרָה תוֹרָה יָמוּת זַכַּאי וְאַל יָמוּת חַיָּב (ספרי; סנהדרין ע\"א):", "rashi_en": "סורר (from the root סור to deviate) means, one who deviates from the proper path of life.<br><br>ומורה means, one who is disobedient to the words of his father, of the same meaning as ממרים in the phrase (Deuteronomy 9:7) “ממרים הייתם”, “ye have been rebellious”.<br><br>ויסרו אתו AND THEY SHALL CHASTISE HIM — admonish him in the presence of three people, and if he still remains refractory they cause him to be lashed through the court (Sanhedrin 71a; cf. Sifrei Devarim 218:11). The refractory and rebellious son is not liable to the death penalty until he proves to be a thief and eats at one meal a “tartemar” (a weight of half a Maneh) flesh and drinks half a Log wine, for it is said of him, (v. 20) זולל וסבא, and in another passage (Proverbs 23:20) it says: “Do not be among wine-guzzlers (בְסֹבְאֵי-יָיִן), among gluttonous eaters of meat” (Sanhedrin 70a; cf. Sifrei Devarim 219:4). — The refractory and rebellious son is put to death on account of the final course his life must necessarily take (not because his present offence is deserving death); — the Torah has fathomed his ultimate disposition: in the end he will squander his fathers property and seeking in vain for the pleasures to which he has been accustomed, he will take his stand on the crossroads and rob people, and in some way or other make, himself liable to the death penalty. Says the Torah, “Let him die innocent of such crimes, and let him not die guilty of them” (Sifrei Devarim 220:3; Sanhedrin 72a)."}, {"ch": 21, "v": 19, "aliyah": 1, "heb": "וְתָ֥פְשׂוּ ב֖וֹ אָבִ֣יו וְאִמּ֑וֹ וְהוֹצִ֧יאוּ אֹת֛וֹ אֶל־זִקְנֵ֥י עִיר֖וֹ וְאֶל־שַׁ֥עַר מְקֹמֽוֹ׃", "onk": "וְיֶחֱדוּן בֵּיהּ אֲבוּהִי וְאִמֵּיהּ וְיַפְּקוּן יָתֵיהּ <b>לָקֳדָם<\/b> סָבֵי קַרְתֵּיהּ וְלִתְרַע בֵּית <b>דִּין<\/b> אַתְרֵיהּ:", "onk_en": "His father and mother are to grasp him and take him out to [<b>before<\/b>] the judges of his city and to the court in his location.", "pj": "וְיֶחְדוּן בֵּיהּ אָבוֹי וְאִמֵּיהּ וְיַפְקוּן יָתֵיהּ לִקֳדָם חַכִּימֵי קַרְתָּא לִתְרַע בֵּי דִינָא דִבְאַתְרֵיהּ", "pj_en": "his father and mother shall take him, and bring him before the sages of the city at the door of the court of justice in that place,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 20, "aliyah": 1, "heb": "וְאָמְר֞וּ אֶל־זִקְנֵ֣י עִיר֗וֹ בְּנֵ֤נוּ זֶה֙ סוֹרֵ֣ר וּמֹרֶ֔ה אֵינֶ֥נּוּ שֹׁמֵ֖עַ בְּקֹלֵ֑נוּ זוֹלֵ֖ל וְסֹבֵֽא׃", "onk": "וְיֵימְרוּן לְסָבֵי קַרְתֵּיהּ בְּנָנָא דֵין סָטֵי וּמָרֵי לֵיתוֹהִי מְקַבֵּל <b>לְמֵימְרָנָא<\/b> זָלֵל <b>בְּסָר<\/b> וְסָבֵי <b>חֲמַר<\/b>:", "onk_en": "They will say to the judges of his city, ‘‘This son of ours is wayward and rebellious—he does not obey [<b>our words<\/b>]—gluttonous [<b>with meat<\/b>] and drunken [<b>with wine<\/b>].’’", "pj": "וְיֵימְרוּן לְחַכִּימֵי קַרְתָּא עַבְרִינָן עַל גְּזֵירַת מֵימְרָא דַיְיָ בְּגִין כֵּן אִתְיְלִיד לָנָא בְּרָנָא דֵין דְּהוּא סוּרְהֲבָן וּמְרוֹד לֵיתוֹי צְיָית לְמֵימְרָנָא גַּרְגְּרָן בְּבִשְרָא וְשֵׁתָאֵי בְּחַמְרָא", "pj_en": "and say to the sages of the city, We had transgressed the decree of the Word of the Lord; therefore was born to us this son, who is presumptuous and disorderly; he will not hear our word, but is a glutton and a drunkard.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 21, "aliyah": 1, "heb": "וּ֠רְגָמֻ֠הוּ כׇּל־אַנְשֵׁ֨י עִיר֤וֹ בָֽאֲבָנִים֙ וָמֵ֔ת וּבִֽעַרְתָּ֥ הָרָ֖ע מִקִּרְבֶּ֑ךָ וְכׇל־יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְיִרָֽאוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיִרְגְּמֻנֵּיהּ כָּל גַּבְרֵי קַרְתֵּיהּ בְּאַבְנַיָּא וִימוּת וּתְפַלֵּי <b>עָבֵד<\/b> <b>דְּבִישׁ<\/b> מִבֵּינָךְ וְכָל יִשְׂרָאֵל יִשְׁמְעוּן וְיִדְחֲלוּן:", "onk_en": "And all the men of his city will stone him with stones so that he dies, and you will eliminate the evil [<b>doers<\/b>] within you; and let all Yisroel hear and be fearful.", "pj": "וִיהֵי אִין דְּחִיל וּמְקַבֵּל עֲלוֹי אוּלְפָנָא וּבְעַן לְקַיְמוּתֵיהּ מְקַיְימוּנֵיהּ וְאִין תָּאִיב וּמְרִיד יְאַטְלוּנֵיהּ כָּל אַנְשֵׁי קַרְתֵּיהּ בְּאַבְנַיָא וִימוּת וּתְפַלּוּן עֲבִיד דְּבִישׁ מִבֵּינֵיכוֹן וְכָל יִשְרָאֵל יִשְׁמְעוּן וִידַחֲלוּן", "pj_en": "And it shall be that if he brought to fear and receive instruction, and beg that his life may be spared, you shall let him live; but if he refuse and continue rebellious, then all the men of his city shall stone him with stones that he die; and so shall you put away the evil doer from among you, and all Israel will hear, and be afraid.", "tj": "", "tj_en": "", "rashi": "<b>וכל ישראל ישמעו ויראו.<\/b> מִכָּאן שֶׁצָּרִיךְ הַכְרָזָה בְּבֵית דִּין; \"פְּלוֹנִי נִסְקָל עַל שֶׁהָיָה בֵן סוֹרֵר וּמוֹרֶה\":", "rashi_en": "וכל ישראל ישמעו ויראו AND ALL ISRAEL SHALL HEAR AND FEAR — From here we derive the law that his execution requires public announcement by the court: “The man named so-and-so is stoned because he was a refractory and rebellious son” (Sanhedrin 89a)."}, {"ch": 21, "v": 22, "aliyah": 2, "heb": "וְכִֽי־יִהְיֶ֣ה בְאִ֗ישׁ חֵ֛טְא מִשְׁפַּט־מָ֖וֶת וְהוּמָ֑ת וְתָלִ֥יתָ אֹת֖וֹ עַל־עֵֽץ׃", "onk": "וַאֲרֵי יְהֵי בִגְבַר חוֹבַת דִּין דִּקְטוֹל וְיִתְקְטֵל <b>וְתִצְלוֹב<\/b> יָתֵיהּ עַל <b>צְלִיבָא<\/b>:", "onk_en": "If a man is guilty of a capital offense and is executed; you shall hang [<b>crucify<\/b>] him from a tree [<b>on a crucifix<\/b>].", "pj": "וַאֲרוּם אִין יְהֵי בִּגְבַר חוֹבַת דִּין קְטוֹל וְיִתְחַיֵּיב אַטְלוּת אַבְנִין וּבָתַר כְּדֵין יִצְלְבוּן יָתֵיהּ עַל קֵיסָא", "pj_en": "When a man hath become guilty of the judgment of death, and is condemned to be stoned, and they afterwards hang him on a beam,", "tj": "וְתִצְלְבוּן יָתֵיהּ עַל קֵיסָא:", "tj_en": "And you hang him on a beam,", "rashi": "<b>וכי יהיה באיש חטא משפט מות.<\/b> סְמִיכוּת הַפָּרָשִׁיּוֹת מַגִּיד שֶׁאִם חָסִים עָלָיו אָבִיו וְאִמּוֹ, סוֹף שֶׁיֵּצֵא לְתַרְבּוּת רָעָה וְיַעֲבֹר עֲבֵרוֹת וְיִתְחַיֵּב מִיתָה בְּבֵית דִּין (עי' תנחומא):<br><br><b>ותלית אתו על עץ.<\/b> רַבּוֹתֵינוּ אָמְרוּ, כָּל הַנִּסְקָלִין נִתְלִין, שֶׁנֶּאֱמַר \"כִּי קִלְלַת אֱלֹהִים תָּלוּי\", וְהַמְבָרֵךְ ה' בִּסְקִילָה (סנהדרין מ\"ה):", "rashi_en": "וכי יהיה באיש חטא משפט מות AND IF THERE BE IN A MAN A SIN DESERVING THE JUDGMENT OF DEATH — The juxtaposition of these sections (this and that of the rebellious son) tells us that if father and mother spare him (the rebellious son), he will in the latter end turn to mischief and commit sins for which he will become liable to the death penalty by the court (cf. Midrash Tanchuma, Ki Teitzei 1).<br><br>ותלית אתו על עץ [AND IF THERE BE IN A MAN A SIN DESERVING THE JUDGMENT OF DEATH] THOU SHALT HANG HIM ON A TREE — Our Rabbis said, All those who have to be put to death by stoning must afterwards be hanged, for it is said here (v. 23) “for cursing of God ends in hanging”, and we are told that one who curses God is punished with stoning (cf. Leviticus 24:15—16; Sanhedrin 45b)."}, {"ch": 21, "v": 23, "aliyah": 2, "heb": "לֹא־תָלִ֨ין נִבְלָת֜וֹ עַל־הָעֵ֗ץ כִּֽי־קָב֤וֹר תִּקְבְּרֶ֙נּוּ֙ בַּיּ֣וֹם הַה֔וּא כִּֽי־קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְלֹ֤א תְטַמֵּא֙ אֶת־אַדְמָ֣תְךָ֔ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ נַחֲלָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תְבִית נְבִלְתֵּיהּ עַל <b>צְלִיבָא<\/b> אֲרֵי מִקְבַּר תִּקְבְּרִנֵּיהּ בְּיוֹמָא הַהוּא אֲרֵי <b>עַל דְּחָב קֳדָם יְיָ אִצְטְלַב<\/b> וְלָא תְסָאֵב יָת אַרְעָךְ דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא:", "onk_en": "Do not leave his corpse overnight on the tree [<b>crucifix<\/b>], but you are surely to bury him on that day, for a hanging corpse is an affront to God [<b>for he was crucified because he sinned before Hashem<\/b>]; so do not defile your land that Adonoy, your God, is giving you as territory.", "pj": "לָא תָבִית נִבְלַת גּוּשְׁמֵיהּ עַל קֵיסָא אֲרוּם מִקְבַּר תִּקְבְּרוּנֵיהּ בְּיוֹמָא הַהוּא אֲרוּם קִילוּתָא קֳדָם אֱלָהָא לְמִצְלוֹב גְּבַר אֱלָהֵן חוֹבוֹי גָרְמוּ לֵיהּ וּמִן בִּגְלַל דִּבְדִיוּקְנָא דַיְיָ אִתְעֲבֵד תְּקַבְּרוּנֵיהּ עִם מִטְמוֹעַ שִׁמְשָׁא דְּלָא יְקִילִין בִּרְיָיתָא בֵּיהּ וְלָא תְטוּפוּן בִּנְבֵילְתְּהוֹן דְּחַיָּיבָא יַת אַרְעֲכוֹן דַּיְיָ אֱלָהָכוֹן יָהִיב לְכוֹן אַחֲסָנָא", "pj_en": "his dead body shall not remain upon the beam, but he shall be certainly buried on the same day; for it is execrable before God to hang a man, but that his guilt gave occasion for it; and because he was made in the image of God, you shall bury him at the going down of the sun, lest wild beasts abuse him, and lest you overspread your land, which the Lord your God giveth you to possess, with the dead bodies of criminals.", "tj": "", "tj_en": "", "rashi": "<b>כי קללת אלהים תלוי.<\/b> זִלְזוּלוֹ שֶׁל מֶלֶךְ הוּא, שֶׁאָדָם עָשׂוּי בִּדְמוּת דְּיוֹקָנוֹ, וְיִשְׂרָאֵל הֵם בָּנָיו; מָשָׁל לִשְׁנֵי אַחִים תְּאוֹמִים שֶׁהָיוּ דּוֹמִים זֶה לָזֶה, אֶחָד נַעֲשָׂה מֶלֶךְ וְאֶחָד נִתְפַּס לְלִסְטִיּוּת וְנִתְלָה, כָּל הָרוֹאֶה אוֹתוֹ אוֹמֵר הַמֶּלֶךְ תָּלוּי. כָּל קְלָלָה שֶׁבַּמִּקְרָא לְשׁוֹן הָקֵל וְזִלְזוּל, כְּמוֹ (מלכים א ב') \"וְהוּא קִלְלַנִי קְלָלָה נִמְרֶצֶת\":", "rashi_en": "כי קללת אלהים תלוי FOR HE THAT IS HANGED IS A קללת אלהים — i.e., a degradation of the Divine King, for man is made in His image and the Israelites are His children. A parable! It may be compared to the case of two twin brothers who very closely resembled each other: one became king and the other was arrested for robbery and was hanged. Whoever saw him on the gallows thought that the king was hanged (Sanhedrin 46b). — Wherever the term קללה occurs in Scripture it has the meaning of bonding in light esteem and despising, as e.g., (1 Kings 2:8) “[Shimei the son of Gera, a Benjamite of Bahurim] who cursed me with a severe curse (קללני קללה נמרצת)” (cf. II Samuel 16:5—8)."}, {"ch": 22, "v": 1, "aliyah": 2, "heb": "לֹֽא־תִרְאֶה֩ אֶת־שׁ֨וֹר אָחִ֜יךָ א֤וֹ אֶת־שֵׂיוֹ֙ נִדָּחִ֔ים וְהִתְעַלַּמְתָּ֖ מֵהֶ֑ם הָשֵׁ֥ב תְּשִׁיבֵ֖ם לְאָחִֽיךָ׃", "onk": "לָא תֶחֱזֵי יָת תּוֹרָא דְאָחוּךְ אוֹ יָת אִמְּרֵיהּ דְּטָעָן וְתִתְכְּבֵשׁ מִנְּהוֹן אָתָבָא תָתֵבִנּוּן לְאָחוּךְ:", "onk_en": "You may not observe your brother’s ox or his sheep lost and conceal yourself from them; you must surely return them to your brother.", "pj": "לָא תֶחְמוּן יַת תּוֹרָא דַּאֲחוּכוֹן אוֹ יַת אִמְרֵיהּ טַעֲיָין וּתְפַלְגוּן דַּעְתְּכוֹן מִנְהוֹן אָתָבָא תְּתִיבִינוּן לֵיהּ", "pj_en": "Thou shalt not see thy brother’s ox or his lamb going astray, and estrange thy knowledge from them; thou shalt certainly restore them to him.", "tj": "", "tj_en": "", "rashi": "<b>והתעלמת.<\/b> כּוֹבֵשׁ עַיִן כְּאִלּוּ אֵינוֹ רוֹאֵהוּ:<br><br><b>לא תראה … והתעלמת.<\/b> לֹא תִרְאֶה אוֹתוֹ שֶׁתִּתְעַלֵּם מִמֶּנּוּ, זֶהוּ פְּשׁוּטוֹ. וְרַבּוֹתֵינוּ אָמְרוּ פְּעָמִים שֶׁאַתָּה מִתְעַלֵּם וְכוּ' (ספרי; בבא מציעא ל'):", "rashi_en": "והתעלמת [THOU SHALT NOT SEE ANY OF THY BROTHER'S HERD … GO ASTRAY] AND HIDE THYSELF [FROM THEM] — i.e. one, as it were closes his eyes tight as though one does not see it.<br><br>לא תראה … והתעלמת THOU SHALT NOT SEE … AND HIDE THYSELF [FROM THEM] — “thou shalt not see it, that thou hide thyself from it” (i.e. you see it only to hide thyself from it), this is the plain sense of the verse. Our Rabbis, however, said that the omission of the particle לא before the verb והתעלמת (one would expect כי תראה … לא תתעלם) suggests: There are times when you may hide yourself from it, etc. (Sifrei Devarim 225:4; Bava Metzia 30a)."}, {"ch": 22, "v": 2, "aliyah": 2, "heb": "וְאִם־לֹ֨א קָר֥וֹב אָחִ֛יךָ אֵלֶ֖יךָ וְלֹ֣א יְדַעְתּ֑וֹ וַאֲסַפְתּוֹ֙ אֶל־תּ֣וֹךְ בֵּיתֶ֔ךָ וְהָיָ֣ה עִמְּךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֙יךָ֙ אֹת֔וֹ וַהֲשֵׁבֹת֖וֹ לֽוֹ׃", "onk": "וְאִם לָא קָרֵב אֲחוּךְ לְוָתָךְ וְלָא יְדַעַתְּ לֵיהּ וְתַכְנְשִׁנֵּיהּ לְגוֹ בֵיתָךְ וִיהֵי עִמָּךְ עַד דְּיִתְבַּע אֲחוּךְ יָתֵיהּ וְתָתֵיבִנֵּיהּ לֵיהּ:", "onk_en": "But if your brother is not near you or you do not know him, gather it into your house and let it stay with you until your brother seeks it, when you must return it to him.", "pj": "וְאִין לָא קְרִיבָא דַעְתָּא דְאָחוּךְ עִמָךְ אוֹ לָא חַכִּימְתֵּיהּ וְתִכְנְשִׁינֵיהּ לְגוֹ בֵיתָךְ וִיהֵי מִתְפַּרְנֵס גַּבָּךְ עַד זְמַן דְּיִתְבַּע אָחוּךְ יָתֵיהּ וּתְתִיבִינֵיהּ לֵיהּ", "pj_en": "But if knowledge of thy brother is not thine, if thou knowest him not, thou shalt bring it into thy house, and it shall be supported by thee till the time that thou hast sought out thy brother, and thou shalt restore it to him.", "tj": "", "tj_en": "", "rashi": "<b>עד דרש אחיך.<\/b> וְכִי תַעֲלֶה עַל דַּעְתְּךָ שֶׁיִּתְּנֵהוּ לוֹ קֹדֶם שֶׁיִּדְרְשֵׁהוּ? אֶלָּא דָּרְשֵׁהוּ שֶׁלֹּא יְהֵא רַמַּאי (בבא מציעא כ\"ז; עי' ספרי):<br><br><b>והשבתו לו.<\/b> שֶׁתְּהֵא בוֹ הֲשָׁבָה, שֶׁלֹּא יֹאכַל בְּבֵיתְךָ כְּדֵי דָּמָיו וְתִתְבָּעֵם מִמֶּנּוּ. מִכָּאן אָמְרוּ, כָּל דָּבָר שֶׁעוֹשֶׂה וְאוֹכֵל יַעֲשֶׂה וְיֹאכַל וְשֶׁאֵינוֹ עוֹשֶׂה וְאוֹכֵל יִמָּכֵר (בבא מציעא כ\"ח):", "rashi_en": "עד דרש אחיך [AND IT SHALL BE WITH THEE] UNTIL THY BROTHER ENQUIRES [FOR IT] — But would it ever enter your mind that one could give it back before he enquires for it (Scripture distinctly states that you do not know to whom the animal belongs)?! But the meaning of the verse is: Thou shalt make diligent enquiries of him that he should not be a fraudulent claimant (Bava Metzia 27b. 28a; cf. Sifrei Devarim 223:4).<br><br>והשבתו לו AND THOU SHALT RESTORE IT TO HIM — it is necessary that there be some restoration — that it (the animal) should not eat in your house to its own value, and you claim this from him (in which case there is no actual restoration of what has been lost). From here, they (the Rabbis) derived the law: Whatever works and requires food (as, for instance, oxen, etc., the cost of whose food is set off by the value of its labour) should work and eat; whatever does not work but requires feeding (as, for instance, sheep) should be sold and the money restored to the man who lost it (Bava Metzia 28b)."}, {"ch": 22, "v": 3, "aliyah": 2, "heb": "וְכֵ֧ן תַּעֲשֶׂ֣ה לַחֲמֹר֗וֹ וְכֵ֣ן תַּעֲשֶׂה֮ לְשִׂמְלָתוֹ֒ וְכֵ֣ן תַּעֲשֶׂ֗ה לְכׇל־אֲבֵדַ֥ת אָחִ֛יךָ אֲשֶׁר־תֹּאבַ֥ד מִמֶּ֖נּוּ וּמְצָאתָ֑הּ לֹ֥א תוּכַ֖ל לְהִתְעַלֵּֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְכֵן תַּעְבֵּד לַחֲמָרֵיהּ וְכֵן תַּעְבֵּד לִכְסוּתֵיהּ וְכֵן תַּעְבֵּד לְכָל אֲבֵדַת אֲחוּךְ דִּי תֵיבַד מִנֵּיהּ וְתַשְׁכְּחִנַּהּ <b>לֵית לָךְ רְשׁוּ<\/b> לְאִתְכַּסָּאָה:", "onk_en": "And so are you to do for his donkey, and so are you to do for his garment, and so are you to do for any lost object of your brother’s that is lost from him which you find. You may not [<b>have no permission to<\/b>] conceal yourself.", "pj": "וְהֵיכְדֵין תַּעֲבֵיד לְחַמְרֵיהּ וְהֵיכְדֵין תַּעֲבֵיד לִכְסוּתֵיהּ וְהֵיכְדֵין תַּעֲבֵיד לְכָל אֲבֵידְתָּא דְּאָחוּךְ דִּי מִתְבְּדָא מִנֵּיהּ וְתַשְׁכְּחָהּ לֵית לָךְ רְשׁוּ לְכַסָּאָהּ מִינֵיהּ אַכְרִיז עֲלָהּ וּתְהַדְרִינָהּ", "pj_en": "So shalt thou do with his ass, with his garment, and with any lost thing of thy brother’s. If thou find, it is not lawful for thee to hide it from him; thou shalt cry it, and restore it.", "tj": "וְכֵן תַּעֲבֵיד לְחַמְרֵיהּ וְכֵן תַּעֲבֵיד לְאִצְטַלִיתֵיהּ:", "tj_en": "And so shalt thou do with his ass, and with his robe.", "rashi": "<b>לא תוכל להתעלם.<\/b> לִכְבֹּשׁ עֵינְךָ כְּאִלּוּ אֵינְךָ רוֹאֶה אוֹתוֹ:", "rashi_en": "לא תוכל להתעלם THOU MAYEST NOT HIDE THYSELF — i.e. You must not cover your eyes, pretending not to see it."}, {"ch": 22, "v": 4, "aliyah": 2, "heb": "לֹא־תִרְאֶה֩ אֶת־חֲמ֨וֹר אָחִ֜יךָ א֤וֹ שׁוֹרוֹ֙ נֹפְלִ֣ים בַּדֶּ֔רֶךְ וְהִתְעַלַּמְתָּ֖ מֵהֶ֑ם הָקֵ֥ם תָּקִ֖ים עִמּֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תֶחֱזֵי יָת חֲמָרָא דְאָחוּךְ אוֹ תוֹרֵיהּ רָמָן בְּאָרְחָא וְתִתְכְּבֵשׁ מִנְּהוֹן אֲקָמָא תְקִים עִמֵּיהּ:", "onk_en": "Do not observe your brother’s donkey or his ox collapsing on the road and ignore them. You must surely lift it up with him.", "pj": "לָא תֶחְמוּן יַת חֲמָרָא דַאֲחוּכוֹן אוֹ תוֹרֵי רְמָאָן בְּאוֹרְחָא וְתִכְבְּשׁוּן עֵינֵיכוֹן מִנְהוֹן מֵיקַם תְּקוּמוּן עִמֵּיהּ", "pj_en": "Thou shalt not see thy brother’s ass nor his ox thrown on the way, and turn thy eyes from them; thou shalt verily lift it up for him.", "tj": "מִישְׁבַּק תִּשְׁבּוֹק יַת מַה דִּבְלִבָּךְ עֲלוֹי וּמִפְרַק תִּפְרוֹק עִמֵּיהּ וּמִטְעַן תִּטְעֲנִי עִמֵּיהּ:", "tj_en": "Thou shalt forgive what may be in thy heart against him, thou shalt deliver and lead it.", "rashi": "<b>הקם תקים.<\/b> זוֹ טְעִינָה – לְהַטְעִין מַשּׂאוֹי שֶׁנָּפַל מֵעָלָיו:<br><br><b>עמו.<\/b> עִם בְּעָלָיו, אֲבָל אִם הָלַךְ וְיָשַׁב לוֹ וְאָמַר לוֹ הוֹאִיל וְעָלֶיךָ מִצְוָה אִם רָצִיתָ לִטְעֹן טְעֹן, פָּטוּר (שם ל\"ב):", "rashi_en": "הקם תקים [THOU SHALT NOT SEE THY BROTHER’S ASS OR ANY OF HIS HERD FALL DOWN BY THE WAY, AND HIDE THYSELF FROM THEM] THOU SHALT SURELY RAISE UP — This refers to the duty of loading — to re-load the burden that fell from it.<br><br>עמו [THOU SHALT SURELY UPLOAD] WITH HIM — i.e. with the owner. But if he goes aside and sits down and says to him, “Since it is a duty for you to load it, if you want to load, go ahead and load!” — [“I” am not commanded to do it”], he is exempt from doing it (cf. Bava Metzia 32a)."}, {"ch": 22, "v": 5, "aliyah": 2, "heb": "לֹא־יִהְיֶ֤ה כְלִי־גֶ֙בֶר֙ עַל־אִשָּׁ֔ה וְלֹא־יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהֹוָ֥ה אֱלֹהֶ֖יךָ כׇּל־עֹ֥שֵׂה אֵֽלֶּה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא יְהֵי <b>תִקּוּן זֵין דִּ<\/b>גְבַר עַל אִתְּתָא וְלָא <b>יְתַקֵּן<\/b> גְּבַר <b>בְּתִקּוּנֵי<\/b> אִתְּתָא אֲרֵי <b>מְרָחָק קֳדָם<\/b> יְיָ אֱלָהָךְ כָּל עָבֵד אִלֵּין:", "onk_en": "A man’s attire [<b>weapons<\/b>] may not be on a woman nor may a man wear [<b>adorn himself with<\/b>] a woman’s garment [<b>adornments<\/b>]; for the abomination of [<b>are distanced before<\/b>] Adonoy, your God, are all who do these [things].", "pj": "לָא יִהְיֶה גּוּלְיַין דְּצִיצִית וּתְפִילִין דְּהִינוּן תִּקּוּנֵי גְבַר עַל אִיתָּא וְלָא יְסַפֵּר גְּבַר בֵּי שֵׁיחַיַא וְעִרְיְיתֵיהּ וּבֵי אַנְפּוֹי לְאִיתְחֲמָאָה הֵיךְ נְשָׁא אֲרוּם מְרַחֵק קֳדָם יְיָ אֱלָהָכוֹן הוּא כָּל דְּעָבִיד אִלֵּין", "pj_en": "Neither fringed robes nor tephillin which are the ornaments of a man shall be upon a woman; neither shall a man shave himself so as to appear like a woman; for every one who doeth so is an abomination before the Lord thy God.", "tj": "", "tj_en": "", "rashi": "<b>לא יהיה כלי גבר על אשה.<\/b> שֶׁתְּהֵא דּוֹמָה לְאִישׁ, כְּדֵי שֶׁתֵּלֵךְ בֵּין הָאֲנָשִׁים, שֶׁאֵין זוֹ אֶלָּא לְשֵׁם נִאוּף (עי' ספרי):<br><br><b>ולא ילבש גבר שמלת אשה.<\/b> לֵילֵךְ לֵישֵׁב בֵּין הַנָּשִׁים. דָּ\"אַ — שֶׁלֹּא יַשִּׁיר שְׂעַר הָעֶרְוָה וְשֵׂעָר שֶׁל בֵּית הַשֶּׁחִי (נזיר נ\"ט):<br><br><b>כי תועבת.<\/b> לֹא אָסְרָה תוֹרָה אֶלָּא לְבוּשׁ הַמֵּבִיא לִידֵי תוֹעֵבָה (עי' ספרי):", "rashi_en": "לא יהיה כלי גבר על אשה THE APPAREL OF A MAN SHALL NOT BE ON A WOMAN — so that she look like a man, in order to consort with men, for this can only be for the purpose of adultery (unchastity) (cf. Sifrei Devarim 226:1; Nazir 59a).<br><br>ולא ילבש גבר שמלת אשה NEITHER SHALL A MAN PUT ON A WOMAN’S GARMENT in order to go and stay unnoticed amongst women. Another explanation of the second part of the text is: it implies that a man should not remove the hair of the genitals and the hair beneath the arm-pit (Nazir 59a).<br><br>כי תועבת FOR [ALL THAT DO SO ARE] AN ABOMINATION [UNTO THE LORD THY GOD] — This implies that the Torah forbids only the wearing of a garb that leads to abomination (unchastity) (cf. Sifrei Devarim 226:1)."}, {"ch": 22, "v": 6, "aliyah": 2, "heb": "כִּ֣י יִקָּרֵ֣א <sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן <big>קַ<\/big>ן בקו״ף גדולה)<\/i>קַן־צִפּ֣וֹר&thinsp;<small>׀<\/small>&thinsp;לְפָנֶ֡יךָ בַּדֶּ֜רֶךְ בְּכׇל־עֵ֣ץ&thinsp;<b>׀<\/b> א֣וֹ עַל־הָאָ֗רֶץ אֶפְרֹחִים֙ א֣וֹ בֵיצִ֔ים וְהָאֵ֤ם רֹבֶ֙צֶת֙ עַל־הָֽאֶפְרֹחִ֔ים א֖וֹ עַל־הַבֵּיצִ֑ים לֹא־תִקַּ֥ח הָאֵ֖ם עַל־הַבָּנִֽים׃", "onk": "אֲרֵי יְעָרַע קִנָּא דְצִפְּרָא קֳדָמָךְ בְּאָרְחָא בְּכָל אִילָן אוֹ עַל אַרְעָא אֶפְרֹחִין אוֹ בֵיעִין וְאִמָא רְבֵעָא עַל אֶפְרֹחִין אוֹ עַל בֵּיעִין לָא תִסַּב אִמָּא עַל בְּנַיָּא:", "onk_en": "If you should chance upon a bird’s nest before you on the road in any tree, or on the ground, [with] fledglings or eggs, and the mother is sitting on the fledglings or on the eggs; do not take the mother with her offspring.", "pj": "אֲרוּם אִין אִזְדַמָּן שַׁרְכְּפָא דְּצִיפַּר דְּכֵי קַמָּךְ בְּאִסְרְטָא בְּכָל אִילָן אוֹ עַל אַרְעָא גּוֹזְלִין אוֹ בַּעֲיַין וְאִימָא רְבִיעָא עַל אֶפְרוֹחִין אוֹ עִילוֹי בַּעֲיַין לָא תִסַּב אִימָא מֵעַל בְּנַיָא", "pj_en": "If thou find the nest of a clean bird before thee in the way, in a tree, or upon the ground, in which there are young ones or eggs, and the mother sitting upon the young ones or eggs,", "tj": "", "tj_en": "", "rashi": "<b>כי יקרא.<\/b> פְּרָט לִמְזֻמָּן (חולין קל\"ט):<br><br><b>לא תקח האם.<\/b> בְּעוֹדָהּ עַל בָּנֶיהָ:", "rashi_en": "כי יקרא IF [A BIRD’S NEST] CHANCE TO BE [BEFORE THEE IN THE WAY … THOU SHALT NOT TAKE THE MOTHER WITH THE YOUNG] — If it chance to be, this excludes that which is always ready at hand (in thy court yard) (Sifrei Devarim 227:1; Chullin 139a).<br><br>לא תקח האם THOU SHALT NOT TAKE THE MOTHER so long as she is sitting upon the young."}, {"ch": 22, "v": 7, "aliyah": 2, "heb": "שַׁלֵּ֤חַ תְּשַׁלַּח֙ אֶת־הָאֵ֔ם וְאֶת־הַבָּנִ֖ים תִּֽקַּֽח־לָ֑ךְ לְמַ֙עַן֙ יִ֣יטַב לָ֔ךְ וְהַאֲרַכְתָּ֖ יָמִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "שַׁלָּחָא תְשַׁלַּח יָת אִמָּא וְיָת בְּנַיָּא תִּסַּב לָךְ בְּדִיל דְּיֵיטַב לָךְ וְתוֹרִיךְ יוֹמִין:", "onk_en": "You must surely send away the mother and the offspring take for yourself, so that you will benefit and you will live long.", "pj": "מִפְטַר תִּפְטוֹר יַת אִמָּא וְיַת בְּנַיָא תִסַּב לָךְ מִן בִּגְלַל דְּיוֹטַב לָךְ בְּעַלְמָא הָדֵין וְתוֹרִיךְ יוֹמִין בְּעַלְמָא דְאָתֵי", "pj_en": "thou shalt be sure to send the mother away, but thou mayest take the young for thyself that it may be well with thee in this world, and that thou mayest prolong tby days in the world to come.", "tj": "", "tj_en": "", "rashi": "<b>למען ייטב לך וגו'.<\/b> אִם מִצְוָה קַלָּה שֶׁאֵין בָּהּ חֶסְרוֹן כִּיס אָמְרָה תוֹרָה \"לְמַעַן יִיטַב לָךְ וְהַאֲרַכְתָּ יָמִים\", קַל וָחֹמֶר לְמַתַּן שְׂכָרָן שֶׁל מִצְווֹת חֲמוּרוֹת (שם קמ\"ב):", "rashi_en": "למען ייטב לך וגו׳ THAT IT MAY BE WELL WITH THEE etc. — If in the case of an easy command which involves no monetary loss, Scripture states “Do this in order that it may be well with thee and thou mayest prolong thy days”, it follows à fortiori that this at least will be the grant of the reward for the fulfilment of commands which are more difficult to observe (Chullin 142a)."}, {"ch": 22, "v": 8, "aliyah": 3, "heb": "כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְעָשִׂ֥יתָ מַעֲקֶ֖ה לְגַגֶּ֑ךָ וְלֹֽא־תָשִׂ֤ים דָּמִים֙ בְּבֵיתֶ֔ךָ כִּֽי־יִפֹּ֥ל הַנֹּפֵ֖ל מִמֶּֽנּוּ׃", "onk": "אֲרֵי תִבְנֵי בֵּיתָא חַדְתָּא וְתַעְבֵּד תְּיָקָא לְאִגְּרָךְ וְלָא תְשַׁוִּי <b>חוֹבַת דִּין דִקְטוֹל<\/b> בְּבֵיתָךְ אֲרֵי יִפֵּל דְּנָפֵל מִנֵּיהּ:", "onk_en": "When you build a new home, you are to make a fence for your roof; and do not place blood [<b>death<\/b>] [liability] in your house, for someone who should fall may fall from it.", "pj": "אֲרוּם תִּבְנֶה בֵּיתָא חַדְתָּא וְתַעֲבֵיד תֵּיאַק גִּפוּפִין לְאִיגְרָךְ לָא תִגְרְמוּן לְאִסְתַּקְפָא חוֹבַת אֲדַם דִּיקְטוֹל בְּבֵיתָךְ דִּלְמָא יִפּוֹל דֵּין דְּחָמֵי לְמֵיפַל מִנֵּיהּ", "pj_en": "When thou buildest a new house, thou shalt make a surrounding fence to thy roof, that it may not be the occasion of blood guilt by the loss of life at thy house, by any one through heedlessness falling therefrom.", "tj": "וְתַעֲבֵיד גִּיפוּף לְאִיגְרָךְ וְלָא תְשַׁוֵּי חוֹבַת שְׁפִיכוּת אֲדַם זַכַּאי בְּבֵיתָךְ:", "tj_en": "Then thou shalt make a parapet to thy roof, that the guilt of innocent blood shedding may not be set upon thy house.", "rashi": "<b>כי תבנה בית חדש.<\/b> אִם קִיַּמְתָּ מִצְוַת שִׁלּוּחַ הַקֵּן, סוֹפְךָ לִבְנוֹת בַּיִת חָדָשׁ, וּתְקַיֵּם מִצְוַת מַעֲקֶה, שֶׁמִּצְוָה גּוֹרֶרֶת מִצְוָה, וְתַגִּיעַ לְכֶרֶם וְשָׂדֶה וְלִבְגָדִים נָאִים, לְכָךְ נִסְמְכוּ פָּרָשִׁיּוֹת הַלָּלוּ (תנחומא):<br><br><b>מעקה.<\/b> גָּדֵר סָבִיב לַגַּג, וְאֻנְקְלוֹס תִּרְגֵּם \"תְּיָקָא\", כְּגוֹן תִּיק שֶׁמְּשַׁמֵּר מַה שֶּׁבְּתוֹכוֹ:<br><br><b>כי יפל הנפל.<\/b> רָאוּי זֶה לִפֹּל, וְאַעַ\"פִּ כֵן לֹא תִתְגַּלְגֵּל מִיתָתוֹ עַל יָדְךָ, שֶׁמְּגַלְגְּלִין זְכוּת עַל יְדֵי זַכַּאי וְחוֹבָה עַל יְדֵי חַיָּב (ספרי):", "rashi_en": "כי תבנה בית חדש WHEN THOU BUILDEST A NEW HOUSE, [THEN THOU SHALT MAKE A BATTLEMENT FOR THY ROOF] — If thou hast fulfilled the command of שלוח הקן (of letting a mother bird go when the nest is rifled), you will in the end be privileged to build a new house and to fulfill the command of “making a guard-rail”, for one good deed brings another good deed in its train, and you will attain to a vineyard (v. 9), fields (v. 10) and fine garments (vv. 11—12). It is for this reason (to suggest this) that these sections are put in juxtaposition (Midrash Tanchuma, Ki Teitzei 1).<br><br>מעקה means, a fence around the roof. Onkelos renders it by תיקא; the fencing is like a casing (תיק) which guards things that are within it.<br><br>כי יפל הנפל [THAT THOU BRING NOT BLOOD UPON THY HOUSE] IF ANY MAN FALL FROM THENCE — (The words may be taken to mean: if he that is to fall (הנופל) falls from it). This suggests: this man deserved to fall to his death (on account of some crime he had committed), nevertheless his death should not be occasioned by your agency, for meritorious things are brought about through the agency of good men and bad things only through the agency of evil men (Sifrei Devarim 229:7)."}, {"ch": 22, "v": 9, "aliyah": 3, "heb": "לֹא־תִזְרַ֥ע כַּרְמְךָ֖ כִּלְאָ֑יִם פֶּן־תִּקְדַּ֗שׁ הַֽמְלֵאָ֤ה הַזֶּ֙רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּתְבוּאַ֖ת הַכָּֽרֶם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תִזְרַע כַּרְמָךְ עֵרוּבִין דִּילְמָא <b>תִסְתָּאַב<\/b> דִּמְעַת זַרְעָא דִּי תִזְרַע וַעֲלָלַת כַּרְמָא:", "onk_en": "Do not plant in your vineyard mixed species, lest the expansion become obnoxious [<b>impure<\/b>]—the seed that you plant—and the produce of the vineyard.", "pj": "לָא תִזְרְעוּן כַּרְמֵיכוֹן עֵירוּבִין דִּלְמָא תִתְחַיֵּיב יַקִידְתָּא דִּימְעַת זַרְעָא דְתִזְרְעוּן וַעֲלָלַת כַּרְמָא", "pj_en": "You shall not sow your vineyard with seeds of dif ferent kinds, lest thou be chargeable with burning the mixed seed that you have sown and the produce of the vine.", "tj": "", "tj_en": "", "rashi": "<b>כלאים.<\/b> חִטָּה וּשְׂעוֹרָה וְחַרְצָן בְּמַפֹּלֶת יָד (ברכות כ\"ב):<br><br><b>פן תקדש.<\/b> כְּתַרְגוּמוֹ \"תִּסְתָּאַב\", כָּל דָּבָר הַנִּתְעָב עַל הָאָדָם, בֵּין לְשֶׁבַח כְּגוֹן הֶקְדֵּשׁ, בֵּין לִגְנַאי כְּגוֹן אִסּוּר, נוֹפֵל בּוֹ לְשׁוֹן קִדּוּשׁ, כְּמוֹ \"אַל תִּגַּשׁ בִּי כִּי קִדַּשְׁתִּיךָ\" (ישעיהו ס\"ה):<br><br>(<b>המלאה.<\/b> זֶה מִלּוּי וְתוֹסֶפֶת שֶׁהַזֶּרַע מוֹסִיף):", "rashi_en": "כלאים [THOU SHALT NOT SOW THY VINEYARD] WITH DIVERSE KINDS OF SEEDS — i.e. wheat and barley together with kernels of grapes with one and the same hand-throw (Berachot 22a; Kiddushin 39a; Chullin 82b).<br><br>פן תקדש LEST IT BECOME קדש — Take it as the Targum does: lest it become unclean (unfit for use); to anything for which a man has repugnance to come into contact with, be it on account of its sublimity as, for instance, holy things, or be it on account of some bad quality, as, for instance, something that is forbidden, the term קדוש is appropriate, as, in the latter sense, e.g., (Isaiah 65:5) “Come not near to me for I make thee קדוש\". <br><br>[המלאה — This is the fullness and increase which the seed produces]."}, {"ch": 22, "v": 10, "aliyah": 3, "heb": "לֹֽא־תַחֲרֹ֥שׁ בְּשׁוֹר־וּבַחֲמֹ֖ר יַחְדָּֽו׃", "onk": "לָא תִרְדֵּי בְתוֹרָא וּבַחֲמָרָא כַּחֲדָא:", "onk_en": "You may not plow with an ox and with a donkey together.", "pj": "לָא תֶהֱווֹן רַדְיַין בְּתוֹרָא וּבְחַמְרָא וּבְכָל בִּרְיָיתָא בִּתְרֵין זְיָנִין קְטִירִין כַּחֲדָא", "pj_en": "You shall not plough with an ox and an ass nor with any animals of two species bound together.", "tj": "", "tj_en": "", "rashi": "<b>לא תחרש בשור ובחמור.<\/b> הוּא הַדִּין לְכָל שְׁנֵי מִינִים שֶׁבָּעוֹלָם (בבא קמא נ\"ד), הוּא הַדִּין לְהַנְהִיגָם יַחַד קְשׁוּרִים זוּגִים בְּהוֹלָכַת שׁוּם מַשָּׂא (כלאים פ\"ח מ\"ב):", "rashi_en": "לא תחרש בשור ובחמור THOU SHALT NOT PLOUGH WITH AN OX AND WITH AN ASS [TOGETHER] — The same law applies to any two different kinds of animals in existence; the same law applies also to merely driving them together (when not ploughing) whilst they are yoked together as a pair carrying any load (Sifrei Devarim 232:1-2; cf. Kilayim 8:2 and 3; Bava Metzia 8b)."}, {"ch": 22, "v": 11, "aliyah": 3, "heb": "לֹ֤א תִלְבַּשׁ֙ שַֽׁעַטְנֵ֔ז צֶ֥מֶר וּפִשְׁתִּ֖ים יַחְדָּֽו׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תִלְבַּשׁ שַׁעַטְנֵזָא עֲמַר וְכִתָּן <b>מְחֻבַּר<\/b> כַּחֲדָא:", "onk_en": "Do not don a mixture of threads, wool and flax [<b>combined<\/b>] together.", "pj": "לָא תֶהֱווֹן לָבְשׁוּן וּמִשְׁתַּחֲנִין בִּכְסוּ דְּשִׁיעַ וְעָזֵיל וְנֵיז עֲמַר וְכִיתָּן מְעַרְבִין כַּחֲדָא", "pj_en": "You shall not clothe nor warm yourselves with a garment combed (carded) or netted, or interwoven with woollen and linen mixed together.", "tj": "", "tj_en": "", "rashi": "<b>שעטנז.<\/b> לְשׁוֹן עֵרוּב. וְרַבּוֹתֵינוּ פֵּרְשׁוּ — שׁוּעַ טָווּי וְנוּז (ספרי):", "rashi_en": "שעטנז is an expression for a mixture. Our Rabbis explained it to mean a material that is calendered (pressed, שוע), or woven (טווי), or twisted (נוז) together (Sifrei Devarim 232:1); (שעטנז is taken to be an abbreviation of these words; cf. Rashi on Leviticus 19:19 and our Note thereon)."}, {"ch": 22, "v": 12, "aliyah": 3, "heb": "גְּדִלִ֖ים תַּעֲשֶׂה־לָּ֑ךְ עַל־אַרְבַּ֛ע כַּנְפ֥וֹת כְּסוּתְךָ֖ אֲשֶׁ֥ר תְּכַסֶּה־בָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כְּרֻסְפְּדִין תַּעְבֶּד לָךְ עַל אַרְבַּע כַּנְפֵי כְסוּתָךְ דִּי תְכַסֵּי בַהּ:", "onk_en": "Make yourself pendant threads upon four corners of your garment that you cover with.", "pj": "בְּרַם לְאִצְטוֹלֵי כִיתָּן חוּטֵי צִיצְיַית מִן עֲמַר תְּהוֹן מַרְשַׁן לְמֶעֱבַד לְכוֹן עַל אַרְבַּע כַּנְפֵי גוּלְיַיתְכוֹן דְּתִתְעַטְפוּן בָּהּ בִּימָמָא", "pj_en": "Nevertheless on a robe of linen thread you may be permitted to make fringes of woollen upon the four extremities of your vestments with which you dress in the day.", "tj": "גְּדִילַן דְּצִיצִית תַּעַבְדוּן עַל אַרְבַּע צְנָפַת גּוֹלָתֵיכוֹן דְּיִתְכַסּוּן בָּהּ:", "tj_en": "Fringes of threads shall you make upon the four edges of your vestments with which you dress.", "rashi": "<b>גדלים תעשה לך.<\/b> אַף מִן הַכִּלְאַיִם, לְכָךְ סְמָכָן הַכָּתוּב (יבמות ד'):", "rashi_en": "גדלים תעשה לך THOU SHALT MAKE THEE TASSELS [UPON THE FOUR CORNERS OF THY VESTURE] — be they even from a mixture of wool and linen; for this reason Scripture puts them (the prohibition of שעטנז and the command of צצית) in juxtaposition (Yevamot 4a)."}, {"ch": 22, "v": 13, "aliyah": 3, "heb": "כִּֽי־יִקַּ֥ח אִ֖ישׁ אִשָּׁ֑ה וּבָ֥א אֵלֶ֖יהָ וּשְׂנֵאָֽהּ׃", "onk": "אֲרֵי יִסַּב גְּבַר אִתְּתָא וְיֵעוּל לְוָתַהּ וְיִסְנִנַּהּ:", "onk_en": "If a man marries a woman, and he has relations with her and hates her.", "pj": "אֲרוּם יִסַּב אֵינַשׁ אִיתָא בְּתוּלְתָּא וְיֵיעוֹל עֲלָהּ וּמִבָּתַר כְּדֵין יִסְנִינָהּ", "pj_en": "If a man take a wife or virgin and go unto her, but afterwards dislike her,", "tj": "", "tj_en": "", "rashi": "<b>ובא אליה ושנאה.<\/b> סוֹפוֹ,", "rashi_en": "ובא אליה ושנאה [IF ANY MAN TAKE A WIFE] AND COME UNTO HER AND HATE HER, the end will be,"}, {"ch": 22, "v": 14, "aliyah": 3, "heb": "וְשָׂ֥ם לָהּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְהוֹצִ֥א עָלֶ֖יהָ שֵׁ֣ם רָ֑ע וְאָמַ֗ר אֶת־הָאִשָּׁ֤ה הַזֹּאת֙ לָקַ֔חְתִּי וָאֶקְרַ֣ב אֵלֶ֔יהָ וְלֹא־מָצָ֥אתִי לָ֖הּ בְּתוּלִֽים׃", "onk": "וִישַׁוִּי לַהּ <b>תַּסְקוֹפֵי מִלִּין<\/b> וְיַפֵּק עֲלַהּ שׁוּם בִּישׁ וְיֵימַר יָת אִתְּתָא הָדָא נְסֵבִית וְעַלִּית לְוָתַהּ וְלָא אַשְׁכָּחִית לַהּ בְּתוּלִין:", "onk_en": "Then berates her with calumnies [<b>libelous words<\/b>] and alleges defamation about her, and he claims, ‘‘I married this woman and was intimate with her, and did not find signs of her virginity.’’", "pj": "וִישַׁוֵּי לָהּ עֲרַד דְּמִילִין וְיִפּוֹק עֲלָהּ טִיב בִּישׁ וְיֵימַר יַת אִתְּתָא הֲדָא נְסִיבִית וְשַׁמָּשִׁית עִמָּהּ וְלָא אַשְׁכָּחִית לָהּ סְהִידַווֹן", "pj_en": "and bring upon her words of calumny in an evil report against her, and say, I took this woman, and lay with her, but found not the witnesses for her;", "tj": "", "tj_en": "", "rashi": "<b>ושם לה עלילת דברים<\/b> – עֲבֵרָה גּוֹרֶרֶת עֲבֵרָה, עָבַר עַל לֹא תִשְׂנָא, סוֹפוֹ לָבֹא לִידֵי לָשׁוֹן הָרָע (עי' ספרי):<br><br><b>את האשה הזאת.<\/b> מִכָּאן שֶׁאֵין אוֹמֵר דָּבָר אֶלָּא בִּפְנֵי בַעַל דִּין (שם):", "rashi_en": " ושם לה עלילת דברים that HE WILL IMPUTE ACTIONS UPON HER BY MERE WORDS (i.e. he will slander her); one sin brings another sin in its train: if he transgresses the prohibition “thou shalt not hate [thy fellow]” (Leviticus 19:17), the end will be that he will fall into slander (cf. Sifrei Devarim 235:3).<br><br>את האשה הזאת THIS WOMAN — Hence we derive the law that one must not speak anything to the judge except in the presence of the opposing party (Sifrei Devarim 235:6)."}, {"ch": 22, "v": 15, "aliyah": 3, "heb": "וְלָקַ֛ח אֲבִ֥י <span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֖<\/span> וְאִמָּ֑הּ וְהוֹצִ֜יאוּ אֶת־בְּתוּלֵ֧י <span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֛<\/span> אֶל־זִקְנֵ֥י הָעִ֖יר הַשָּֽׁעְרָה׃", "onk": "וְיִסַּב אֲבוּהָא (<small>נ\"א<\/small> אֲבוּהִי) דְעוּלֶמְתָּא וְאִמַּהּ וְיַפְּקוּן יָת בְּתוּלֵי עוּלֶמְתָּא <b>לָקֳדָם<\/b> סָבֵי קַרְתָּא <b>לִתְרַע<\/b> בֵּית דִּין <b>אַתְרָא<\/b>:", "onk_en": "The girl’s father and mother will take and will prove the girl’s virginity to [<b>before<\/b>] the city judges in the [<b>door of the<\/b>] court [<b>of that place<\/b>].", "pj": "וְיִסְבוּן אֲבוּהָא דְעוּלֵימְתָּא וְאִמָּהּ רְשׁוּ מִבֵּי דִינָא וְיִפְקוּן יַת שׁוֹשִׁיפָא בַּהֲדֵי סְהִידַווֹן דְּעוּלֵימְתָּא לְוַת חַכִּימֵי קַרְתָּא לִתְרַע בֵּי דִינָא", "pj_en": "then the father and mother of the damsel may have licence from the court of judgment to produce the linen with the witnesses of her virginity, before the sages of the city, at the door of the beth din.", "tj": "", "tj_en": "", "rashi": "<b>אבי הנערה ואמה.<\/b> מִי שֶׁגִּדְּלוּ גִּדּוּלִים הָרָעִים יִתְבַּזּוּ עָלֶיהָ (עי' שם):", "rashi_en": "אבי הנערה ואמה [THEN SHALL] THE FATHER OF THE DAMSEL, AND HER MOTHER [TAKE AND BRING FORTH etc.] — Let those who have reared this depraved child (lit., “evil plant”) be exposed to contempt because of her (Sifrei Devarim 235:9)."}, {"ch": 22, "v": 16, "aliyah": 3, "heb": "וְאָמַ֛ר אֲבִ֥י <span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֖<\/span> אֶל־הַזְּקֵנִ֑ים אֶת־בִּתִּ֗י נָתַ֜תִּי לָאִ֥ישׁ הַזֶּ֛ה לְאִשָּׁ֖ה וַיִּשְׂנָאֶֽהָ׃", "onk": "וְיֵימַר אֲבוּהָא דְעוּלֶמְתָּא לְסָבַיָּא יָת בְּרַתִּי יְהָבִית לְגַבְרָא הָדֵין לְאִנְתּוּ וּסְנִנַּהּ:", "onk_en": "The girl’s father should assert to the judges, ‘‘My daughter did I marry to this man as a wife and he hates her.", "pj": "וְיֵימַר אֲבוּהָא דְעוּלֵימְתָּא לְחַכִּימַיָא יַת בְּרַתִּי קַדֵּישִׁית לְגַבְרָא הָדֵין לְאִנְתּוּ וּמִן בָּתַר דְּשַׁמֵּשׁ עִמָּהּ סַנָא לָהּ", "pj_en": "And the father of the damsel shall say to the sages, I wedded my daughter to this man to be his wife; but after lying with her he hath hated her;", "tj": "", "tj_en": "", "rashi": "<b>ואמר אבי הנערה.<\/b> מְלַמֵּד שֶׁאֵין רְשׁוּת לָאִשָּׁה לְדַבֵּר בִּפְנֵי הָאִישׁ (שם):", "rashi_en": "ואמר אבי הנערה AND THE DAMSEL’S FATHER SHALL SAY [UNTO THE ELDERS] — although both parents appear before them, yet the father alone shall speak — this teaches that a woman is not allowed to speak in the presence of her husband (if he, too, is concerned in the matter) (Sifrei Devarim 235:10)."}, {"ch": 22, "v": 17, "aliyah": 3, "heb": "וְהִנֵּה־ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵאמֹ֗ר לֹֽא־מָצָ֤אתִי לְבִתְּךָ֙ בְּתוּלִ֔ים וְאֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑י וּפָֽרְשׂוּ֙ הַשִּׂמְלָ֔ה לִפְנֵ֖י זִקְנֵ֥י הָעִֽיר׃", "onk": "וְהָא הוּא שַׁוִּי תַּסְקוֹפֵי מִלִּין לְמֵימַר לָא אַשְׁכָּחִית לִבְרַתָּךְ בְּתוּלִין וְאִלֵּין בְּתוּלֵי בְרַתִּי וְיִפְרְסוּן שׁוֹשִׁיפָא קֳדָם סָבֵי קַרְתָּא:", "onk_en": "Look! He has promulgated libelous words, claiming ‘I did not find signs of your daughter’s virginity.’ But this is [the proof of] my daughter’s virginity.’’ And let them spread the cloth before the city judges.", "pj": "וְהָא הוּא שַׁוֵי עֲרַד דְּמִילִין לְמֵימָר לָא אַשְׁכָּחִית לִבְרַתָּךְ סְהִידַווֹן וְאִילֵין סְהִידוֹי בְּרַתִּי וְיִפְרְסוּן שׁוֹשִׁיפָא קֳדָם חַכִּימֵי קַרְתָּא", "pj_en": "and, behold, he hath thrown upon her occasion of words, saying: I have not found the witnesses of thy daughter’s (virginity) but these are my daughter’s witnesses; and they shall spread the linen before the sages of the city;", "tj": "", "tj_en": "", "rashi": "<b>ופרשו השמלה.<\/b> הֲרֵי זֶה מָשָׁל, מְחֻוָּרִין הַדְּבָרִים כַּשִּׂמְלָה (שם; כתובות שם):", "rashi_en": "ופרשו השמלה AND THEY SHALL SPREAD THE CLOTH [BEFORE THE ELDERS OF THE CITY] — This is a figurative expression: they must make the matter as white (as clear) as a sheet (Sifrei Devarim 237:1; Ketubot 46a)."}, {"ch": 22, "v": 18, "aliyah": 3, "heb": "וְלָ֥קְח֛וּ זִקְנֵ֥י הָֽעִיר־הַהִ֖וא אֶת־הָאִ֑ישׁ וְיִסְּר֖וּ אֹתֽוֹ׃", "onk": "וְיִדְבְּרוּן סָבֵי קַרְתָּא הַהִיא יָת גַּבְרָא <b>וְיַלְקוּן<\/b> יָתֵיהּ:", "onk_en": "The judges of that city will take the man and will chastise [<b>whip<\/b>] him.", "pj": "וְיִסְבוּן חַכִּימֵי קַרְתָּא הַהוּא יַת גַּבְרָא וְיִלְקוּן יָתֵיהּ", "pj_en": "and the sages shall take that man, scourge him,", "tj": "", "tj_en": "", "rashi": "<b>ויסרו אתו.<\/b> מַלְקוּת (שם):", "rashi_en": "ויסרו אתו [AND THE ELDERS … SHALL TAKE THE MAN] AND CHASTISE HIM — i.e. with lashes (Sifrei Devarim 238:2; Ketubot 46a; cf. Onkelos)."}, {"ch": 22, "v": 19, "aliyah": 3, "heb": "וְעָנְשׁ֨וּ אֹת֜וֹ מֵ֣אָה כֶ֗סֶף וְנָתְנוּ֙ לַאֲבִ֣י הַֽנַּעֲרָ֔ה כִּ֤י הוֹצִיא֙ שֵׁ֣ם רָ֔ע עַ֖ל בְּתוּלַ֣ת יִשְׂרָאֵ֑ל וְלֽוֹ־תִהְיֶ֣ה לְאִשָּׁ֔ה לֹא־יוּכַ֥ל לְשַׁלְּחָ֖הּ כׇּל־יָמָֽיו׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיִגְבּוּן מִנֵּיהּ מְאָה סִלְעִין דִּכְסָף וְיִתְּנוּן לַאֲבוּהָא דְעוּלֶמְתָּא אֲרֵי אַפֵּק שׁוּם בִּישׁ עַל בְּתוּלְתָּא דְיִשְׂרָאֵל וְלֵיהּ תְּהֵי לְאִנְתּוּ <b>לֵית לֵיהּ רְשׁוּ<\/b> לְמִפְטְרַהּ כָּל יוֹמוֹהִי:", "onk_en": "And they will fine him one hundred silver [shekels] and give [them] to the girl’s father, because he defamed a virgin of Yisroel; and she shall remain his wife, he may not [<b>does not have permission<\/b>] divorce her all his life.", "pj": "וְיִזְמוּן יָתֵיהּ מְאָה סַלְעִין דִּכְסַף וְיִתְּנוּן לְאָבוּהָא דְעוּלֵימְתָּא אֲרוּם אַפִּיק טִיב בִּישׁ עַל בְּתוּלְתָּא כַּשְׁרָא דְיִשְרָאֵל וְלֵיהּ תְּהֵי לְאִנְתּוּ לֵית לֵיהּ רְשׁוּ לְמִפְטְרָהּ כָּל יוֹמוֹי", "pj_en": "and fine him a hundred shekels of silver, and give to the father of the damsel, because he had brought out an evil report against an upright virgin of Israel; and she shall be his wife, nor shall he have power to put her away all his days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 20, "aliyah": 3, "heb": "וְאִם־אֱמֶ֣ת הָיָ֔ה הַדָּבָ֖ר הַזֶּ֑ה לֹא־נִמְצְא֥וּ בְתוּלִ֖ים <span class=\"mam-kq-trivial\">לַֽנַּעֲרָֽ<\/span>׃", "onk": "וְאִם קֻשְׁטָא הֲוָה פִּתְגָּמָא הָדֵין לָא אִשְׁתְּכָחוּ בְתוּלִין לְעוּלֶמְתָּא:", "onk_en": "However, if the allegation is true; signs of the girl’s virginity were not found.", "pj": "וְאִין קְשׁוֹט הֲוָה פִּתְגָמָא הָדֵין לָא אִישְׁתַּכָּחוּ סְהִידַווֹן לְעוּלֵמְתָּא", "pj_en": "But if that word be true, and the witnesses of virginity were not found with the damsel", "tj": "וְאִין קוּשְׁטָא הֲוָה פִּתְגָּמָא הָדֵין לָא אַשְׁכָּחוּ סַהֲדִין לְטַלְיָתָא:", "tj_en": "But if this word be true, and the damsel's witnesses are not found,", "rashi": "<b>ואם אמת היה הדבר.<\/b> בְּעֵדִים וְהַתְרָאָה, שֶׁזִּנְּתָה לְאַחַר אֵרוּסִין (כתובות מ\"ד):", "rashi_en": "ואם אמת היה הדבר BUT IF THE THING BE TRUE — proven by evidence of witnesses and after legal warning that she had committed adultery after her betrothal (Ketubot 44b)."}, {"ch": 22, "v": 21, "aliyah": 3, "heb": "וְהוֹצִ֨יאוּ אֶת־<span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֜<\/span> אֶל־פֶּ֣תַח בֵּית־אָבִ֗יהָ וּסְקָל֩וּהָ֩ אַנְשֵׁ֨י עִירָ֤הּ בָּאֲבָנִים֙ וָמֵ֔תָה כִּֽי־עָשְׂתָ֤ה נְבָלָה֙ בְּיִשְׂרָאֵ֔ל לִזְנ֖וֹת בֵּ֣ית אָבִ֑יהָ וּבִֽעַרְתָּ֥ הָרָ֖ע מִקִּרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיַפְּקוּן יָת עוּלֶמְתָּא לִתְרַע בֵּית אָבוּהָא וְיִרְגְּמֻנַּהּ אֱנָשֵׁי קַרְתַּהּ בְּאַבְנַיָּא וּתְמוּת אֲרֵי עָבְדַת קְלָנָא בְּיִשְׂרָאֵל לְזַנָּאָה בֵּית אֲבוּהָא וּתְפַלֵּי <b>עָבֵד<\/b> <b>דְּבִישׁ<\/b> מִבֵּינָךְ:", "onk_en": "They are to take the girl out to the entrance of her father’s home and the people of her city will stone her with stones to death, because she committed a disgraceful act against Yisroel by behaving promiscuously [in] her father’s house; and you will eliminate the evil [<b>doer<\/b>] within you.", "pj": "וְיִפְקוּן יַת עוּלֵימְתָּא לִתְרַע בֵּית אָבוּהָא וִיאַטְלוּנָהּ אִינְשֵׁי קַרְתָּא בְּאַבְנַיָא וְתֵימוּת אֲרוּם עָבְדַת קְלָנָא בְּיִשְרָאֵל לְמַפְקָא שׁוּם בִּישׁ דִּזְנוּ עַל בֵּית אָבוּהָא וּתְפַלּוּן עֲבִיד דְּבִישׁ מִבֵּינֵיכוֹן", "pj_en": "then shall they bring her forth to the door of her father’s house, and the men of that city shall stone her with stones that she die; for she had wrought dishonour in Israel in bringing the ill fame of whoredom against her father’s house; and so shall they put away the evil doer from Israel.", "tj": "וְיִפְקוּן יַת טַלְיָתָא מִן תְּרַע בֵּיתָא דְאָבוּהָא וְיִרְגְּמוּן יָתֵיהּ עִמָּהּ:", "tj_en": "they shall bring that damsel from the door of her father's house, and the people shall stone her.", "rashi": "<b>אל פתח בית אביה.<\/b> רְאוּ גִּדּוּלִים שֶׁגִּדַּלְתֶּם (שם מ\"ה):<br><br><b>אנשי עירה.<\/b> בְּמַעֲמַד כָּל אַנְשֵׁי עִירָהּ (ספרי):<br><br><b>לזנות בית אביה.<\/b> כְּמוֹ בְּבֵית אָבִיהָ:", "rashi_en": "אל פתח בית אביה [THEN THEY SHALL BRING THE DAMSEL] TO THE ENTRANCE OF HER FATHER’S HOUSE — suggesting: “See what a child (lit., a plant) you have reared!” (Ketubot 45a).<br><br>אנשי עירה [AND] THE MEN OF HER CITY [SHALL OVERWHELM HER WITH STONES] — This means, the witnesses shall stone her, all the men of her city standing by (Sifrei Devarim 240:1; cf. Rashi on Leviticus 24:14).<br><br>לזנות בית אביה TO PLAY THE WHORE “IN” HER FATHER’S HOUSE — The word בית is equivalent to בבית."}, {"ch": 22, "v": 22, "aliyah": 3, "heb": "כִּֽי־יִמָּצֵ֨א אִ֜ישׁ שֹׁכֵ֣ב&thinsp;<b>׀<\/b> עִם־אִשָּׁ֣ה בְעֻֽלַת־בַּ֗עַל וּמֵ֙תוּ֙ גַּם־שְׁנֵיהֶ֔ם הָאִ֛ישׁ הַשֹּׁכֵ֥ב עִם־הָאִשָּׁ֖ה וְהָאִשָּׁ֑ה וּבִֽעַרְתָּ֥ הָרָ֖ע מִיִּשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי יִשְׁתְּכַח גְּבַר דְּשָׁכֵב עִם אִתְּתָא אִתַּת גְּבַר וְיִתְקַטְּלוּן אַף תַּרְוֵיהוֹן גַּבְרָא דְּשָׁכֵב עִם אִתְּתָא וְאִתְּתָא וּתְפַלֵּי <b>עָבֵד<\/b> <b>דְּבִישׁ<\/b> מִיִּשְׂרָאֵל:", "onk_en": "If a man is found having intercourse with a woman who is the wife of a man, even both of them shall die—the man who had intercourse with the woman and the woman—and you will eliminate the evil [<b>doer<\/b>] from Yisroel.", "pj": "אֲרוּם אִין מִשְׁתַּכַּח גְּבַר מְשַׁמֵּשׁ עִם אִתְּתָא אִתַּת גְּבַר חוֹרַן וְיִתְקַטְלוּן אוּף תַּרְוֵיהוֹן גַּבְרָא דִמְשַׁמֵּשׁ עִם אִתְּתָא וְאִתְּתָא וַאֲפִילוּ אִין מְעַבְּרָא לָא תִשְׁהוֹנֵיהּ עַד דְּתֵילִיד אֱלָהֵן בֵּי הִיא שַׁעְתָּא תִּקְטְלוּנוּן בְּשֵׁינוּקָא דְסוּדְרָא וּתְפַלּוּן עֲבִיד דְּבִישׁ מִיִּשְרָאֵל", "pj_en": "If a man be found lying with another’s wife, both of them shall be put to death; the male who hath lain with the woman, and the woman. Even if she be with child, they shall not wait till she is delivered, but in the same hour they shall put them to death by strangulation with the napkin, and cast away the evil doer from Israel.", "tj": "", "tj_en": "", "rashi": "<b>ומתו גם שניהם.<\/b> לְהוֹצִיא מַעֲשֵׂה חִדּוּדִים שֶׁאֵין הָאִשָּׁה נֶהֱנֵית מֵהֶם (ספרי; סנהדרין ס\"ו):<br><br><b>גם.<\/b> לְרַבּוֹת הַבָּאִים אַחֲרֵיהֶם (ספרי); דָּבָר אַחֵר, <b>גם שניהם<\/b> לְרַבּוֹת אֶת הַוָּלָד, שֶׁאִם הָיְתָה מְעֻבֶּרֶת אֵין מַמְתִּינִין לָהּ עַד שֶׁתֵּלֵד (ערכין ז'):", "rashi_en": "ומתו גם שניהם THEN THEY SHALL BOTH OF THEM DIE — The redundant words גם שניהם are intended to exclude a case of unnatural intercourse from which the woman derives no gratification (Sifrei Devarim 242:4; Sanhedrin 66b). <br><br>גם is intended to include those persons who commit adultery with one of this pair after them (i.e. after this pair had been found guilty) (Sifrei Devarim 242:5). Another explanation of גם שניהם is: these words are intended to include in the death penalty the embryo: that if the woman was pregnant the execution is not deferred until after she gives birth (cf. Targum Jonathan on; Arakhin 7a)."}, {"ch": 22, "v": 23, "aliyah": 3, "heb": "כִּ֤י יִהְיֶה֙ <span class=\"mam-kq-trivial\">נַעֲרָ֣<\/span> בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְאִ֑ישׁ וּמְצָאָ֥הּ אִ֛ישׁ בָּעִ֖יר וְשָׁכַ֥ב עִמָּֽהּ׃", "onk": "אֲרֵי תְהֵי עוּלֶמְתָּא בְתֻלְתָּא דִּמְאָרְסָא לִגְבַר וְיַשְׁכְּחִנַּהּ גְּבַר בְּקַרְתָּא וְיִשְׁכּוּב עִמַּהּ:", "onk_en": "If there will be a virgin girl married to a man, and a man encounters her in the city and has intercourse with her,", "pj": "אֲרוּם תֶּהֱוֵי עוּלֵימְתָּא בְתוּלְתָּא מִיקַדְשָׁא לִגְבַר וְיִשְׁכְּחִינָהּ גְּבַר חוֹרַן בְּקַרְתָּא וִישַׁמֵּשׁ עִמָּהּ", "pj_en": "If a damsel a virgin is betrothed to a man, and another man find her in the city, and lie with her,", "tj": "", "tj_en": "", "rashi": "<b>ומצאה איש בעיר.<\/b> לְפִיכָךְ שָׁכַב עִמָּהּ – פִּרְצָה קוֹרְאָה לַגַּנָּב, הָא אִלּוּ יָשְׁבָה בְּבֵיתָהּ, לֹא אֵרַע לָהּ (ספרי):", "rashi_en": "ומצאה איש בעיר [IF A DAMSEL THAT IS A VIRGIN BE BETROTHED UNTO A MAN] AND A MAN FIND HER IN THE CITY [AND LIE WITH HER] — (Because he found her outdoors) therefore he lay with her: a breach in the wall invites the thief; if she had remained at home (as becomes a chaste Jewish girl) this would not have happened to her (Sifrei Devarim 242:2-3)."}, {"ch": 22, "v": 24, "aliyah": 3, "heb": "וְהוֹצֵאתֶ֨ם אֶת־שְׁנֵיהֶ֜ם אֶל־שַׁ֣עַר&thinsp;<b>׀<\/b> הָעִ֣יר הַהִ֗וא וּסְקַלְתֶּ֨ם אֹתָ֥ם בָּאֲבָנִים֮ וָמֵ֒תוּ֒ אֶת־<span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֗<\/span> עַל־דְּבַר֙ אֲשֶׁ֣ר לֹא־צָעֲקָ֣ה בָעִ֔יר וְאֶ֨ת־הָאִ֔ישׁ עַל־דְּבַ֥ר אֲשֶׁר־עִנָּ֖ה אֶת־אֵ֣שֶׁת רֵעֵ֑הוּ וּבִֽעַרְתָּ֥ הָרָ֖ע מִקִּרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתַפְּקוּן יָת תַּרְוֵיהוֹן לִתְרַע קַרְתָּא הַהִיא וְתִרְגְּמוּן יָתְהוֹן בְּאַבְנַיָּא וִימוּתוּן יָת עוּלֶמְתָּא עַל <b>עֵסַק<\/b> דִּי לָא צְוָחַת בְּקַרְתָּא וְיָת גַּבְרָא עַל <b>עֵסַק<\/b> דְּעַנִּי יָת אִתַּת חַבְרֵיהּ וּתְפַלֵּי <b>עָבֵד<\/b> <b>דְּבִישׁ<\/b> מִבֵּינָךְ:", "onk_en": "You are to take them both out to the court of that city and stone them with stones to death, the girl for the fact that she did not scream in the city and the man for the fact that he oppressed the wife of his peer; and you will eliminate the evil [<b>doer<\/b>] within you.", "pj": "וְתַפְקוּן יַת תְּרֵיהוֹן לִתְרַע בֵּי דִינָא דִּבְקַרְתָּא הַהִיא וּתְאַטְלוּן יַתְהוֹן בְּאַבְנַיָא וִימוּתוּן יַת עוּלֵימְתָּא מִן בִּגְלַל דְּלָא פָגְנַת בְּקַרְתָּא וְיַת גַּבְרָא מִן בִּגְלַל דְּשַׁמֵּשׁ עִם אִתַּת חַבְרֵיהּ וּתְפַלּוּן עֲבִיד דְּבִישׁ מִבֵּינֵיכוֹן", "pj_en": "they shall bring forth both of them to the door of the beth din of that city, and stone them with stones that they die; the damsel because she did not cry out in the city, and the man because he lay with his neighbour’s wife; and you shall put away the evil doer from among you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 25, "aliyah": 3, "heb": "וְֽאִם־בַּשָּׂדֶ֞ה יִמְצָ֣א הָאִ֗ישׁ אֶת־<span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֙<\/span> הַמְאֹ֣רָשָׂ֔ה וְהֶחֱזִֽיק־בָּ֥הּ הָאִ֖ישׁ וְשָׁכַ֣ב עִמָּ֑הּ וּמֵ֗ת הָאִ֛ישׁ אֲשֶׁר־שָׁכַ֥ב עִמָּ֖הּ לְבַדּֽוֹ׃", "onk": "וְאִם בְּחַקְלָא יַשְׁכַּח גְּבַר יָת עוּלֶמְתָּא דִמְאָרְסָא וְיִתְקֶף בַּהּ גַּבְרָא וְיִשְׁכּוּב עִמַּהּ וְיִתְקְטֵל גַּבְרָא דְּשָׁכֵב עִמַּהּ בִּלְחוֹדוֹהִי:", "onk_en": "But if in the field the man encounters the married girl, and the man holds her and had intercourse with her; then he shall die—only the man who had intercourse with her.", "pj": "וְאִין בְּבָרָא יַשְׁכַּח גַּבְרָא יַת עוּלֵימְתָּא דְמִיקַדְשָׁא וְיִתְקַף בָּהּ גַּבְרָא וִישַׁמֵּשׁ עִמָּהּ וְיִתְקְטֵיל גַּבְרָא דְּשַׁמֵּשׁ עִמָּהּ בִּלְחוֹדוֹי", "pj_en": "But if a man find a damsel in the wilderness, and do violence to her and lie with her, the man only shall die who lay with her,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 26, "aliyah": 3, "heb": "<span class=\"mam-kq-trivial\">וְלַֽנַּעֲרָ֙<\/span> לֹא־תַעֲשֶׂ֣ה דָבָ֔ר אֵ֥ין <span class=\"mam-kq-trivial\">לַֽנַּעֲרָ֖<\/span> חֵ֣טְא מָ֑וֶת כִּ֡י כַּאֲשֶׁר֩ יָק֨וּם אִ֤ישׁ עַל־רֵעֵ֙הוּ֙ וּרְצָח֣וֹ נֶ֔פֶשׁ כֵּ֖ן הַדָּבָ֥ר הַזֶּֽה׃", "onk": "וּלְעוּלֶמְתָּא לָא תַעְבֵּד מִדַּעַם לֵית לְעוּלֶמְתָּא חוֹבַת דִּין דִּקְטוֹל אֲרֵי כְּמָא דִיקוּם גַּבְרָא עַל חַבְרֵיהּ וְיִקְטְלִנֵּיהּ נְפַשׁ כֵּן פִּתְגָּמָא הָדֵין:", "onk_en": "But to the girl you will not do a thing, the girl has no death liability; for, just as if a man rises up against his peer and murders him, so is this matter.", "pj": "וּלְעוּלֵימְתָּא לָא תַעַבְדוּן מִדָּעַם בִּישׁ לֵית לְעוּלֵימְתָּא דִין קְטוֹל אֱלָהֵן גַּבְרָא יִפְטְרִינָהּ מִנֵּיהּ בְּגִיטָא אֲרוּם הֵיכְמָא דְיִכְמוֹן גְּבַר עַל חַבְרֵיהּ וְיִקְטְלִינֵיהּ נְפָשׁ הֵיכְדֵין פִּתְגָמָא הָדֵין", "pj_en": "for the damsel is not guilty of death; but her husband may put her away from him by a bill of divorcement; for as when a man lieth in wait for his neighbour and taketh his life, so is this matter:", "tj": "", "tj_en": "", "rashi": "<b>כי כאשר יקום וגו'.<\/b> לְפִי פְשׁוּטוֹ זֶהוּ מַשְׁמָעוֹ: כִּי אֲנוּסָה הִיא וּבְחָזְקָה עָמַד עָלֶיהָ, כְּאָדָם הָעוֹמֵד עַל חֲבֵרוֹ לְהָרְגוֹ. וְרַבּוֹתֵינוּ דָּרְשׁוּ בוֹ הֲרֵי זֶה בָא לְלַמֵּד וְנִמְצָא לָמֵד וְכוּ' (סנהדרין ע\"ג):", "rashi_en": "כי כאשר יקום וגו׳ FOR AS WHEN A MAN RISETH [AGAINST HIS FELLOW MAN, AND SLAYETH HIM, EVEN SO IS THIS THING] — According to its plain sense the following is what it implies: there is in the damsel no sin deserving death, because she was coerced and he, (the man) attacked her with violence, just as when a man attacks his fellowman to kill him. — Our Rabbis, however, gave it (the verse) a Halachic interpretation as follows: Behold, this simile is intended to elucidate the law in question but at the same time turns out to be itself elucidated by that law (lit., this comes as a teacher and is found to be a learner) (Sanhedrin 73a)."}, {"ch": 22, "v": 27, "aliyah": 3, "heb": "כִּ֥י בַשָּׂדֶ֖ה מְצָאָ֑הּ צָעֲקָ֗ה <span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֙<\/span> הַמְאֹ֣רָשָׂ֔ה וְאֵ֥ין מוֹשִׁ֖יעַ לָֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי בְחַקְלָא אַשְׁכְּחַהּ צְוָחַת עוּלֶמְתָּא דִּמְאָרְסָא וְלֵית דְּפָרִיק לַהּ:", "onk_en": "For he encountered her in the field; the married girl screamed, but there was no one to rescue her.", "pj": "אֲרוּם בְּאַנְפֵּי בָּרָא אַשְׁכְּחָהּ פָּגְנַת עוּלֵּימְתָּא דְמִיקַדְשָׁא וְלָא אִזְדַמֵּן פַּרִיק לָהּ", "pj_en": "he found her upon the face of the field; the betrothed damsel cried out for help, but there was no one to deliver her.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 28, "aliyah": 3, "heb": "כִּֽי־יִמְצָ֣א אִ֗ישׁ <span class=\"mam-kq-trivial\">נַעֲרָ֤<\/span> בְתוּלָה֙ אֲשֶׁ֣ר לֹא־אֹרָ֔שָׂה וּתְפָשָׂ֖הּ וְשָׁכַ֣ב עִמָּ֑הּ וְנִמְצָֽאוּ׃", "onk": "אֲרֵי יַשְׁכַּח גְּבַר עוּלֶמְתָּא בְתֻלְתָּא דִּי לָא מְאָרְסָא <b>וְיֶחֱדִנַּהּ<\/b> וְיִשְׁכּוּב עִמַּהּ וְיִשְׁתַּכְּחוּן:", "onk_en": "If a man encounters a virgin girl who was not married and grabs her and has intercourse with her; and they are discovered.", "pj": "אֲרוּם יַשְׁכַּח גְּבַר עוּלֵימְתָּא בְּתוּלְתָּא דְלָא מִיקַדְשָׁא וְיֵחוּד בָּהּ וּמְשַׁמֵּשׁ עִמָּהּ וּמִשְׁתַּכְּחִין", "pj_en": "If a man find a damsel who is not betrothed, and seize and lie with her, and they be found,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 29, "aliyah": 3, "heb": "וְ֠נָתַ֠ן הָאִ֨ישׁ הַשֹּׁכֵ֥ב עִמָּ֛הּ לַאֲבִ֥י <span class=\"mam-kq-trivial\">הַֽנַּעֲרָ֖<\/span> חֲמִשִּׁ֣ים כָּ֑סֶף וְלֽוֹ־תִהְיֶ֣ה לְאִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔הּ לֹא־יוּכַ֥ל שַׁלְּחָ֖הּ כׇּל־יָמָֽיו׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיִתֵּן גַּבְרָא דְּיִשְׁכֻּב עִמַּהּ לַאֲבוּהָא דְעוּלֶמְתָּא חַמְשִׁין סִלְעִין דִּכְסַף וְלֵיהּ תְּהֵי לְאִנְתּוּ חֳלַף דִּי עַנְיַהּ <b>לֵית לֵיהּ רְשׁוּ<\/b> לְמִפְטְרַהּ כָּל יוֹמוֹהִי:", "onk_en": "The man who had intercourse with her must give to the girl’s father fifty silver [shekels]; and she shall be his wife, since he oppressed her; he may not [<b>has no permission to<\/b>] divorce her all his life.", "pj": "וְיִתֵּן גַּבְרָא דְשַׁמֵּשׁ עִמָּהּ לְאָבוּהָא דְעוּלֵּימְתָּא דְמֵי בַּהֲתָהּ חַמְשִׁין סַלְעִין דִּכְסַף וְלֵיהּ תְּהֵי לְאִינְתּוּ חוֹלַף דְּעַנְיָיהּ לֵית לֵיהּ רְשׁוּ לְמִפְטְרָהּ בְּגִיטָא כָּל יוֹמוֹי", "pj_en": "then the man who lay with her shall give to her father, as a fine for her dishonour, fifty shekels of silver, and she shall be his wife, because he humbled her, nor shall he have power to put her away by divorcement all his days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 1, "aliyah": 3, "heb": "לֹא־יִקַּ֥ח אִ֖ישׁ אֶת־אֵ֣שֶׁת אָבִ֑יו וְלֹ֥א יְגַלֶּ֖ה כְּנַ֥ף אָבִֽיו׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא יִסַּב גְּבַר יָת אִתַּת אֲבוּהִי וְלָא יְגַלֵּי כַּנְפָא דַאֲבוּהִי:", "onk_en": "A man may not marry his father’s wife, and may not expose the edge of his father’s garment.", "pj": "לָא יִסַּב גְּבַר יַת אִתְּתָא דְּאָנִיס אוֹ דְשַׁרְגִיג אָבוֹי וְכָל דְּכֵן אִתַּת אָבוֹי וְלָא יְגַלֵי כַנְפָא דְגַלֵּי אָבוֹי", "pj_en": "A man should not take a wife who is bowed down (or violated), or who hath had intercourse with his father, much less his father’s wife, nor disclose the skirt that covereth his father.", "tj": "", "tj_en
