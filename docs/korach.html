ן לְמֵימָר אַתּוּן גְרַמְתּוּן דִין מוֹתָא עַל עַמָא דַיְיָ", "pj_en": "But on the following day the whole congregation murmured against Mosheh and Aharon, saying: You have been the occasion of the judgment of death against the people of the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 7, "aliyah": 3, "heb": "וַיְהִ֗י בְּהִקָּהֵ֤ל הָֽעֵדָה֙ עַל־מֹשֶׁ֣ה וְעַֽל־אַהֲרֹ֔ן וַיִּפְנוּ֙ אֶל־אֹ֣הֶל מוֹעֵ֔ד וְהִנֵּ֥ה כִסָּ֖הוּ הֶעָנָ֑ן וַיֵּרָ֖א כְּב֥וֹד יְהֹוָֽה׃", "onk": "וַהֲוָה בְּאִתְכַּנָּשׁוּת כְּנִשְׁתָּא עַל משֶׁה וְעַל אַהֲרֹן וְאִתְפְּנִיאוּ לְמַשְׁכַּן זִמְנָא וְהָא חֲפָהִי עֲנָנָא וְאִתְגְּלִי יְקָרָא דַיְיָ:", "onk_en": "When the congregation assembled against Moshe and Aharon, they turned to the Tent of Meeting and behold! The cloud covered it, and the Glory of Adonoy appeared.", "pj": "וַהֲוָה בְּאִתְכַּנָשׁוּת כְּנִישְׁתָּא עַל משֶׁה וְעַל אַהֲרן לְמִקְטַלְהוֹן וְאִתְפְּנִיוּ לְמַשְׁכַּן זִמְנָא וְהָא חַפְיֵיהּ עֲנַן אִיקַר שְׁכִינְתָּא וְאִתְגְלֵי תַמָן אִיקָרָא דַיְיָ", "pj_en": "And it was, that when the congregation had gathered against Mosheh and Aharon to kill them, they looked towards the Tabernacle of Ordinance, and, behold, the Cloud of the Glory of the Shekinah covered it, and the Glory of the Lord was revealed there.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 8, "aliyah": 3, "heb": "וַיָּבֹ֤א מֹשֶׁה֙ וְאַהֲרֹ֔ן אֶל־פְּנֵ֖י אֹ֥הֶל מוֹעֵֽד׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעָל משֶׁה וְאַהֲרֹן לָקֳדָם מַשְׁכַּן זִמְנָא:", "onk_en": "Moshe and Aharon came to the front of the Tent of Meeting.", "pj": "וְעָאל משֶׁה וְאַהֲרן מִן קֳדָם קְהָלָא לִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And Mosheh and Aharon went from the congregation to the door of the tabernacle.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 9, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 10, "aliyah": 4, "heb": "הֵרֹ֗מּוּ מִתּוֹךְ֙ הָעֵדָ֣ה הַזֹּ֔את וַאֲכַלֶּ֥ה אֹתָ֖ם כְּרָ֑גַע וַֽיִּפְּל֖וּ עַל־פְּנֵיהֶֽם׃", "onk": "<b>אִתְפְּרָשׁוּ<\/b> מִגּוֹ כְּנִשְׁתָּא הָדָא וְאֵשֵׁצֵי יָתְהוֹן כְּשָׁעָה וּנְפָלוּ עַל אַפֵּיהוֹן:", "onk_en": "“Remove [<b>separate<\/b>] yourselves from this congregation and I shall annihalate them in an instant,” and they fell upon their faces.", "pj": "אִתְפְּרָשׁוּ מִגוֹ כְּנִשְׁתָּא הֲדָא וְאֵישֵׁיצֵי יַתְהוֹן כְּשָׁעָה זְעֵירָא וְאִתְרְכִינוּ בִּצְלוֹ עַל אַפֵּיהוֹן", "pj_en": "Separate from the midst of this congregation, and I will consume them at once. But they bowed themselves on their faces in prayer.", "tj": "אִתְפְּרָשׁוּ מִן בֵּינֵי עַם כְּנִשְׁתָּא הָדָא וְאֵשֵׁיצֵי יַתְהוֹן כְּקָלִיל זְעֵיר וְאִתְרָכִינוּ בִּצְלוֹ עַל אַפֵּיהוֹן:", "tj_en": "Separate from the people of this congregation, and I will destroy them in a brief moment. But they bowed down on their faces in prayer.", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 11, "aliyah": 4, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל־אַהֲרֹ֗ן קַ֣ח אֶת־הַ֠מַּחְתָּ֠ה וְתֶן־עָלֶ֨יהָ אֵ֜שׁ מֵעַ֤ל הַמִּזְבֵּ֙חַ֙ וְשִׂ֣ים קְטֹ֔רֶת וְהוֹלֵ֧ךְ מְהֵרָ֛ה אֶל־הָעֵדָ֖ה וְכַפֵּ֣ר עֲלֵיהֶ֑ם כִּֽי־יָצָ֥א הַקֶּ֛צֶף מִלִּפְנֵ֥י יְהֹוָ֖ה הֵחֵ֥ל הַנָּֽגֶף׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן סַב יָת מַחְתִּיתָא וְהַב עֲלַהּ אֶשָּׁתָא מֵעִלָּוֵי מַדְבְּחָא וְשַׁו קְטֹרֶת <b>בּוּסְמַיָּא<\/b> וְאוֹבִיל בִּפְרִיעַ לִכְנִשְׁתָּא וְכַפֵּר עֲלֵיהוֹן אֲרֵי נְפַק רָגְזָא מִן קֳדָם יְיָ שָׁרֵי מוֹתָנָא:", "onk_en": "Moshe said to Aharon: “Take the firepan and put fire from atop the altar on it and place [<b>fragrant<\/b>] incense on it, and go quickly to the congregation and atone for them, for anger has come forth from before Adonoy; the plague has commenced.”", "pj": "וַאֲמַר משֶׁה לְאַהֲרן סַב יַת מַחְתְּיָא וְהַב עֲלָהּ אֵישָׁתָא מֵעִילַוֵי מַדְבְּחָא וְשַׁוִי קְטוֹרֶת בּוּסְמִין עַל אֵישָׁתָא וְאוֹבִיל בִּפְרִיעַ לְוַת כְּנִישְׁתָּא וְכַפֵּר אַמְטוּלְהוֹן אֲרוּם נְפַק מְחַבְּלָא דְאִתְכָּלוּ בְּחוֹרֵב דִשְׁמֵיהּ קֶצֶף מִן קָדָם יְיָ בִּהוּרְמָנָא שָׁרֵי לְקַטְלָא", "pj_en": "And Mosheh said to Aharon, Take the censer, put fire in it from the altar, and sweet incense on the fire; bear it quickly into the congregation, and make atonement for them: for a destruction like that which consumed them in Horeb, whose name is Burning, hath begun by commandment to kill, from the presence of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>וכפר עליהם.<\/b> רָז זֶה מָסַר לוֹ מַלְאַךְ הַמָּוֶת כְּשֶׁעָלָה לָרָקִיעַ, שֶׁהַקְּטֹרֶת עוֹצֵר הַמַּגֵּפָה, כִּדְאִיתָא בְמַסֶּכֶת שַׁבָּת (דף פ\"ט):", "rashi_en": "וכפר עליהם AND MAKE AN EXPIATION FOR THEM — This secret the Angel of Death communicated to him (Moses) when he went up unto heaven to receive the Torah, viz., that the incense holds back the plague — as is related in Treatise Shabbat 89a."}, {"ch": 17, "v": 12, "aliyah": 4, "heb": "וַיִּקַּ֨ח אַהֲרֹ֜ן כַּאֲשֶׁ֣ר&thinsp;<b>׀<\/b> דִּבֶּ֣ר מֹשֶׁ֗ה וַיָּ֙רׇץ֙ אֶל־תּ֣וֹךְ הַקָּהָ֔ל וְהִנֵּ֛ה הֵחֵ֥ל הַנֶּ֖גֶף בָּעָ֑ם וַיִּתֵּן֙ אֶֽת־הַקְּטֹ֔רֶת וַיְכַפֵּ֖ר עַל־הָעָֽם׃", "onk": "וּנְסִיב אַהֲרֹן כְּמָא דִי מַלִּיל משֶׁה וּרְהַט לְגוֹ קְהָלָא וְהָא שָׁרֵי מוֹתָנָא בְּעַמָּא וִיהַב יָת קְטֹרֶת בּוּסְמַיָּא וְכַפַּר עַל עַמָּא:", "onk_en": "Aharon took, just as Moshe spoke, and he ran to the middle of the assembly and behold! The plague had commenced among the people. He put on incense and he atoned for the people.", "pj": "וּנְסֵיב אַהֲרן הֵיכְמָא דְמַלֵיל משֶׁה וּרְהַט לְמִיצַע קְהָלָא וְהָא שָׁרֵי קֶצֶף מְחַבְּלָא לְחַבְּלָא בְּעַמָא וִיהַב יַת קְטוֹרֶת בּוּסְמִין וְכַפֵּר עַל עַמָא", "pj_en": "And Aharon took, as Mosheh had said, and ran into the midst of the congregation, and, behold the destructive burning had begun to destroy the people: but he put on incense, and made atonement for the people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 13, "aliyah": 4, "heb": "וַיַּעֲמֹ֥ד בֵּֽין־הַמֵּתִ֖ים וּבֵ֣ין הַֽחַיִּ֑ים וַתֵּעָצַ֖ר הַמַּגֵּפָֽה׃", "onk": "וְקָם בֵּין מֵתַיָּא וּבֵין חַיַּיָּא <b>וְאִתְכְּלִי<\/b> מוֹתָנָא:", "onk_en": "He stood between the dead and between the living and the plague was halted [<b>ceased<\/b>].", "pj": "וְקָם לֵיהּ אַהֲרן בִּצְלוֹי בְּמַצַע וְעָבַד מְחִיצוּתָא בְּמַחְתְּיָיתָא בֵּינֵי מֵתַיָא וּבֵינֵי חַיַיָא וְאִתְכְּלִיאַת מוֹתָנָא", "pj_en": "And Aharon stood in the midst, between the dead and the living with the censer, and interceded in prayer; and the plague was restrained.", "tj": "", "tj_en": "", "rashi": "<b>ויעמד בין המתים וגו'.<\/b> אָחַז אֶת הַמַּלְאָךְ וְהֶעֱמִידוֹ עַל כָּרְחוֹ, אָמַר לוֹ הַמַּלְאָךְ, הַנַּח לִי לַעֲשׂוֹת שְׁלִיחוּתִי, אָמַר לוֹ מֹשֶׁה צִוַּנִי לְעַכֵּב עַל יָדְךָ, אָמַר לוֹ אֲנִי שְׁלוּחוֹ שֶׁל מָקוֹם וְאַתָּה שְׁלוּחוֹ שֶׁל מֹשֶׁה, אָמַר לוֹ אֵין מֹשֶׁה אוֹמֵר כְּלוּם מִלִּבּוֹ אֶלָּא מִפִּי הַגְּבוּרָה, אִם אֵין אַתָּה מַאֲמִין, הֲרֵי הַקָּבָּ\"ה וּמֹשֶׁה אֶל פֶּתַח אֹהֶל מוֹעֵד, בֹּא עִמִּי וּשְׁאַל, וְזֶהוּ שֶׁנֶּאֱמַר <b>וישב אהרן אל משה;<\/b> דָּ\"אַ, לָמָּה בַקְּטֹרֶת? לְפִי שֶׁהָיוּ יִשְׂרָאֵל מְלִיזִים וּמְרַנְּנִים אַחַר הַקְּטֹרֶת לוֹמַר סַם הַמָּוֶת הוּא — עַל יָדוֹ מֵתוּ נָדָב וַאֲבִיהוּא, עַל יָדוֹ נִשְׂרְפוּ חֲמִשִּׁים וּמָאתַיִם אִישׁ — אָמַר הַקָּבָּ\"ה, תִּרְאוּ שֶׁעוֹצֵר מַגֵּפָה הוּא וְהַחֵטְא הוּא הַמֵּמִית (מכילתא שמות י\"ז):", "rashi_en": "ויעמד בין המתים וגו׳ AND HE STOOD BETWEEN THE DEAD [AND THE LIVING] — He (Aaron) seized the Angel of Death and stopped him despite himself. The angel said to him, “Let me be, so that I may carry out my commission!” He (Aaron) answered him, “Moses has bidden me prevent you”. The angel replied, “I am the messenger of the Omnipresent whilst you are but the messenger of Moses!” Aaron retorted, “Moses does not say anything out of his own mind, but only at the command of the Almighty. If you do not believe me, behold, the Holy One, blessed be He, and Moses are at the entrance of the appointed tent; come with me and ask them!” This is the meaning of what is stated (v. 15): And Aaron returned unto Moses (i.e. returned together with the Angel of Death) (cf. Midrash Tanchuma, Tetzaveh 15 at end of תצוה). Another explanation is: Wherefore was the plague stayed by means of the incense? Because the Israelites were traducing and speaking ill of the incense, saying, “It is a deadly poison: through it Nadab and Abihu died; through it the two hundred and fifty men were burnt!” therefore the Holy One, blessed be He, said, You will see that it is also a means for restraining the plague, and it is only sin that brings death” (Mekhilta on Exodus 17:5)."}, {"ch": 17, "v": 14, "aliyah": 4, "heb": "וַיִּהְי֗וּ הַמֵּתִים֙ בַּמַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּשְׁבַ֣ע מֵא֑וֹת מִלְּבַ֥ד הַמֵּתִ֖ים עַל־דְּבַר־קֹֽרַח׃", "onk": "וַהֲווֹ דְּמִיתוּ בְּמוֹתָנָא אַרְבְּעַת עֲשַׁר אַלְפִין וּשְׁבַע מְאָה בַּר מִדְּמִיתוּ עַל <b>פְּלֻגְתָּא<\/b> דְקֹרַח:", "onk_en": "The dead in the plague totaled fourteen thousand seven hundred, excluding those who died due to Korach’s rebellion [<b>division<\/b>].", "pj": "וַהֲווֹ סְכוּם דְמִיתוּ בְּמוֹתָנָא אַרְבֵּיסַר אַלְפִין וּשְׁבַע מְאָה בַּר מִדְמִיתוּ עַל פְּלוּגְתָּא דְקרַח", "pj_en": "But the number who had died by the plague was fourteeen thousand and seven hundred, beside those who had died in the schism of Korach.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 15, "aliyah": 4, "heb": "וַיָּ֤שׇׁב אַהֲרֹן֙ אֶל־מֹשֶׁ֔ה אֶל־פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְהַמַּגֵּפָ֖ה נֶעֱצָֽרָה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתָב אַהֲרֹן לְמשֶׁה לִתְרַע מַשְׁכַּן זִמְנָא וּמוֹתָנָא אִתְכְּלִי:", "onk_en": "Aharon returned to Moshe to the entrance of the Tent of Meeting and the plague was halted.", "pj": "וְתַב אַהֲרן לְוַת משֶׁה לִתְרַע מַשְׁכַּן זִמְנָא וּמוֹתָנָא אִתְכַּלְיַית", "pj_en": "And Aharon returned to Mosheh at the door of the tabernacle; and the plague was stayed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 16, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 17, "aliyah": 5, "heb": "דַּבֵּ֣ר&thinsp;<b>׀<\/b> אֶל־בְּנֵ֣י יִשְׂרָאֵ֗ל וְקַ֣ח מֵֽאִתָּ֡ם מַטֶּ֣ה מַטֶּה֩ לְבֵ֨ית אָ֜ב מֵאֵ֤ת כׇּל־נְשִֽׂיאֵהֶם֙ לְבֵ֣ית אֲבֹתָ֔ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת אִ֣ישׁ אֶת־שְׁמ֔וֹ תִּכְתֹּ֖ב עַל־מַטֵּֽהוּ׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְסַב מִנְּהוֹן חֻטְרָא חֻטְרָא לְבֵית אַבָּא מִן כָּל רַבְרְבָנֵיהוֹן לְבֵית אֲבָהַתְהוֹן תְּרֵי עֲשַׂר חֻטְרִין גְּבַר יָת שְׁמֵיהּ תִּכְתּוֹב עַל חֻטְרֵיהּ:", "onk_en": "“Speak to Bnei Yisroel and take from among them a staff, a staff for each father’s [tribal] house, from all the leaders according to their fathers’ houses, twelve staffs; and you shall write each man’s name on his staff.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְסַב מִנְהוֹן חוּטְרָא חוּטְרָא לְבֵית אַבָּא מִלְוַת כָּל אֲמַרְכְּלֵיהוֹן לְבֵית אַבְהַתְהוֹן תְּרֵיסַר חוּטְרִין גְבַר יַת שְׁמֵיהּ תִּכְתּוֹב עַל חוּטְרֵיהּ", "pj_en": "Speak with the sons of Israel, and take of them severally a rod, according to the house of their fathers; twelve rods; and upon each rod thou shalt inscribe its (tribe) name.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 18, "aliyah": 5, "heb": "וְאֵת֙ שֵׁ֣ם אַהֲרֹ֔ן תִּכְתֹּ֖ב עַל־מַטֵּ֣ה לֵוִ֑י כִּ֚י מַטֶּ֣ה אֶחָ֔ד לְרֹ֖אשׁ בֵּ֥ית אֲבוֹתָֽם׃", "onk": "וְיָת שְׁמָא דְאַהֲרֹן תִּכְתּוֹב עַל חֻטְרָא דְלֵוִי אֲרֵי חֻטְרָא חַד לְרֵישׁ בֵּית אֲבָהַתְהוֹן:", "onk_en": "You shall write the name of Aharon on the staff of Levi, for, [there is] one staff for the head of their fathers’ house.", "pj": "וְיַת שְׁמָא דְאַהֲרן תִּכְתּוֹב עַל חוּטְרָא דְלֵוִי אֲרוּם חוּטְרָא חָד לְרֵישׁ בֵּית אַבְהַתְהוֹן", "pj_en": "But on the rod of Levi thou shalt write the name of Aharon: for there is but one rod for each head of their father's house.", "tj": "", "tj_en": "", "rashi": "<b>כי מטה אחד.<\/b> אַעַ\"פִּ שֶׁחִלַּקְתִּים לִשְׁתֵּי מִשְׁפָּחוֹת, מִשְׁפַּחַת כְּהֻנָּה לְבַד וּלְוִיָּה לְבַד, מִכָּל מָקוֹם שֵׁבֶט אֶחָד הוּא:", "rashi_en": "כי מטה אחד FOR ONE STAFF SHALL BE (FOR THE HEAD OF THE HOUSE OF THEIR FATHERS) — i.e. although I have divided them into two families, the family of the priests apart, and that of the Levites apart, yet it is only one tribe, [and they shall therefore have but one staff]."}, {"ch": 17, "v": 19, "aliyah": 5, "heb": "וְהִנַּחְתָּ֖ם בְּאֹ֣הֶל מוֹעֵ֑ד לִפְנֵי֙ הָֽעֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָכֶ֖ם שָֽׁמָּה׃", "onk": "וְתַצְנְעִנּוּן בְּמַשְׁכַּן זִמְנָא קֳדָם סַהֲדוּתָא דִּי אֲזַמֵּן <b>מֵימְרִי<\/b> לְכוֹן תַּמָּן:", "onk_en": "You shall leave them inside the Tent of Meeting before the testimony where there I [<b>My word<\/b>] meet you.", "pj": "וְתַצְנְעִינוּן בְּמַשְׁכַּן זִמְנָא קֳדָם סַהֲדוּתָא דְאֵיזַמֵן מֵימְרִי לְכוֹן תַּמָן", "pj_en": "And thou shalt lay them up in the tabernacle before the testimony, where My Word is appointed to meet you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 20, "aliyah": 5, "heb": "וְהָיָ֗ה הָאִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר־בּ֖וֹ מַטֵּ֣הוּ יִפְרָ֑ח וַהֲשִׁכֹּתִ֣י מֵֽעָלַ֗י אֶת־תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵיכֶֽם׃", "onk": "וִיהֵי גַּבְרָא דְּאִתְרְעֵי בֵיהּ חֻטְרֵיהּ יִנְעֵי וַאֲנִיחַ מִן <b>קֳדָמַי<\/b> יָת תּוּרְעֲמַת בְּנֵי יִשְׂרָאֵל דִּי אִנּוּן מִתְרַעֲמִין עֲלֵיכוֹן:", "onk_en": "It shall be that the man whom I choose, his staff shall blossom; and I will abate from Myself [<b>before Me<\/b>] the complaints of Bnei Yisroel that they complain against you.”", "pj": "וִיהֵי גַבְרָא דְאִתְרְעֵי בֵּיהּ לְשַׁמָשָׁא קֳדָמַי חוּטְרֵיהּ יִנְעֵי וְאִישְׁדֵיךְ מִנִי יַת תּוּרְעֲמוּת בְּנֵי יִשְרָאֵל דְהִינוּן מִתְרַעֲמִין עֲלֵיכוֹן", "pj_en": "And the man whose rod germinateth shall be he whom I approve to minister before Me; and I will make the murmurings of the sons of Israel with which they have murmured against you to cease from Me.", "tj": "", "tj_en": "", "rashi": "<b>והשכתי.<\/b> כְּמוֹ \"וַיָּשֹׁכּוּ הַמָּיִם\" (בראשית ח'), \"וַחֲמַת הַמֶּלֶךְ שָׁכָכָה\" (אסתר ז'):", "rashi_en": "והשכתי AND I WILL CAUSE TO CEASE — This word is the same as in (Genesis 8:1) “and the waters abated (וישכו)”; (Esther 7:10) “and the wrath of the king was abated (שככה)”."}, {"ch": 17, "v": 21, "aliyah": 5, "heb": "וַיְדַבֵּ֨ר מֹשֶׁ֜ה אֶל־בְּנֵ֣י יִשְׂרָאֵ֗ל וַיִּתְּנ֣וּ אֵלָ֣יו&thinsp;<small>׀<\/small>&thinsp;כׇּֽל־נְשִׂיאֵיהֶ֡ם מַטֶּה֩ לְנָשִׂ֨יא אֶחָ֜ד מַטֶּ֨ה לְנָשִׂ֤יא אֶחָד֙ לְבֵ֣ית אֲבֹתָ֔ם שְׁנֵ֥ים עָשָׂ֖ר מַטּ֑וֹת וּמַטֵּ֥ה אַהֲרֹ֖ן בְּת֥וֹךְ מַטּוֹתָֽם׃", "onk": "וּמַלִּיל משֶׁה עִם בְּנֵי יִשְׂרָאֵל וִיהָבוּ לֵיהּ כָּל רַבְרְבָנֵיהוֹן חֻטְרָא לְרַבָּא חַד חֻטְרָא לְרַבָּא חַד לְבֵית אֲבָהַתְהוֹן תְּרֵי עֲשַׂר חֻטְרִין וְחֻטְרָא דְאַהֲרֹן בְּגוֹ חֻטְרֵיהוֹן:", "onk_en": "Moshe spoke to Bnei Yisroel and all the leaders gave to him a staff for each leader; a staff for each leader, according to their fathers’ house, twelve staffs, and the staff of Aharon [was] among their staffs.", "pj": "וּמַלֵיל משֶׁה עִם בְּנֵי יִשְרָאֵל וִיהָבוּ לֵיהּ כָּל אֲמַרְכְּלֵיהוֹן חוֹטֶר לַאֲמַרְכּוֹל חַד חוֹטֶר לַאֲמַרְכּוֹל חַד לְבֵית אַבְהַתְהוֹן תְּרֵיסַר חוּטְרִין וְחוֹטֶר אַהֲרן בִּמְצִיעוּת חוּטְרֵיהוֹן", "pj_en": "Mosheh spake, therefore, with the sons of Israel, and the chiefs of them gave him severally their rods, according to the house of their fathers, twelve rods; and Aharon's rod was among theirs.", "tj": "", "tj_en": "", "rashi": "<b>בתוך מטותם.<\/b> הִנִּיח בָּאֶמְצַע, שֶׁלֹּא יֹאמְרוּ, מִפְּנֵי שֶׁהִנִּיחוֹ בְצַד שְׁכִינָה פָּרַח (תנחומא אחרי מות):", "rashi_en": "בתוך מטותם [AND THE STAFF OF AARON WAS] IN THE MIDST OF THEIR STAVES — He placed Aarons staff in the middle (בתוך) in order that people should not say, “It is only because he placed it at the side where the Shechinah is that it blossomed” (Midrash Tanchuma, Achrei Mot 8 on אחרי מות)."}, {"ch": 17, "v": 22, "aliyah": 5, "heb": "וַיַּנַּ֥ח מֹשֶׁ֛ה אֶת־הַמַּטֹּ֖ת לִפְנֵ֣י יְהֹוָ֑ה בְּאֹ֖הֶל הָעֵדֻֽת׃", "onk": "וְאַצְנַע משֶׁה יָת חֻטְרַיָּא קֳדָם יְיָ בְּמַשְׁכְּנָא דְּסַהֲדוּתָא:", "onk_en": "Moshe placed the staffs before Adonoy in the Tent of the Testimony.", "pj": "וְאַצְנַע משֶׁה יַת חוּטְרַיָא קֳדָם יְיָ בְּמַשְׁכְּנָא דְסַהֲדוּתָא", "pj_en": "And Mosheh laid up the rods before the Lord in the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 23, "aliyah": 5, "heb": "וַיְהִ֣י מִֽמׇּחֳרָ֗ת וַיָּבֹ֤א מֹשֶׁה֙ אֶל־אֹ֣הֶל הָעֵד֔וּת וְהִנֵּ֛ה פָּרַ֥ח מַטֵּֽה־אַהֲרֹ֖ן לְבֵ֣ית לֵוִ֑י וַיֹּ֤צֵֽא פֶ֙רַח֙ וַיָּ֣צֵֽץ צִ֔יץ וַיִּגְמֹ֖ל שְׁקֵדִֽים׃", "onk": "וַהֲוָה בְיוֹמָא דְבַתְרוֹהִי וְעַל משֶׁה לְמַשְׁכְּנָא דְסַהֲדוּתָא וְהָא נְעָא חֻטְרָא דְאַהֲרֹן לְבֵית לֵוִי וְאַפֵּק לַבְלְבִין וְאָנֵץ נֵץ וְכָפֵת שִׁגְדִּין", "onk_en": "It was on the next day, Moshe came inside the Tent of the Testimony, and behold! The staff of Aharon blossomed for the house of Levi, a blossom came forth, and bloomed buds and bore ripe almonds.", "pj": "וַהֲוָה מִיוֹמָא חוֹרָן וְעָאל משֶׁה לְמַשְׁכְּנָא דְסַהֲדוּתָא וְהָא נְעָא חוֹטֶר אַהֲרן לְבֵית לֵוִי וְאַפֵּיק לִבְלוּבִין וְאָנֵיץ נִצִין בֵּיהּ בְּלֵילְיָא גְמַר וַעֲבַד לוּזִין", "pj_en": "And it came to pass, the day after, when Mosheh went into the tabernacle of the testimony, that, behold, the rod of Aharon had germinated; it had shot forth branches, blossomed with flowers, and, in the same night, produced and ripened almonds.", "tj": "וַהֲוָה מִן יוֹמָא דְבַתְרָא וְעַל משֶׁה לְמַשְׁכְּנָא דְסַהֲדוּתָא וְהָא אַפְרַח חוּטְרָא דְאַהֲרן לְבַיְיתֵיהּ דְלֵוִי וְאַפֵּיק פְּרָחִין וַאֲנֵיץ נִיצִין וְחָסִיל לוּזִין בַּר לוּזַיָא:", "tj_en": "And the day following Mosheh went into the tabernacle of testimony, and, behold, the rod of Aharon, of his house of Levi, had germinated, put forth buds, bloomed with flowers, and ripened almonds, the fruit of the almond.", "rashi": "<b>ויצא פרח.<\/b> כְּמַשְׁמָעוֹ:<br><br><b>ציץ.<\/b> הוּא חֲנָטַת הַפְּרִי כְּשֶׁהַפֶּרַח נוֹפֵל:<br><br><b>ויגמל שקדים.<\/b> כְּשֶׁהֻכַּר הַפְּרִי הֻכַּר שֶׁהֵן שְׁקֵדִים, לְשׁוֹן \"וַיִּגְדַּל הַיֶּלֶד וַיִּגָּמַל\" (בראשית כ\"א), וְלָשׁוֹן זֶה מָצוּי בִּפְרִי הָאִילָן, כְּמוֹ \"וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה\" (ישעיהו י\"ח), וְלָמָּה שְׁקֵדִים? הוּא הַפְּרִי הַמְמַהֵר לְהַפְרִיחַ מִכָּל הַפֵּרוֹת, אַף הַמְעוֹרֵר עַל הַכְּהֻנָּה פֻּרְעֲנוּתוֹ מְמַהֶרֶת לָבֹא, כְּמוֹ שֶׁמָּצִינוּ בְעֻזִּיָּהוּ \"וְהַצָּרַעַת זָרְחָה בְמִצְחוֹ\" (דברי הימים ב' כ\"ו); תַּרְגּוּמוֹ \"וְכָפִית שִׁגְדִּין\", כְּמִין אֶשְׁכּוֹל שְׁקֵדִים יַחַד כְּפוּתִים זֶה עַל זֶה:", "rashi_en": "ויצא פרח AND IT BROUGHT FORTH A BLOSSOM — Take this as what it literally implies.<br><br>ציץ is the first stage in the growth of the fruit when the blossom has fallen off.<br><br>ויגמל שקדים AND RIPENED INTO ALMONDS — This means that when the fruit was recognisable as such it could be recognised that they were almonds. The verb has the same meaning as in (Genesis 21:8) “And the child grew ויגמל, and became a full child” (i.e., able to do without its mother’s milk). This expression is frequently used of the fruit of trees, as e.g. (Isaiah 18:5) “And the blossom becometh a ripening (גמל) grape” (cf. Rashi on Genesis 40:10). — But why did it bring forth almonds? Because it is a fruit that blossoms earlier than all other fruits; so, too, the punishment of him who sets himself in opposition to the constituted priesthood comes quickly, just as we find stated in the case of Uzziah (II Chronicles 26:19) “And the leprosy instantly broke out in his forehead”. — Its translation in the Targum is: וכפת שגדין, meaning that it produced a kind of cluster of almonds, knotted together one upon the other (Aramaic כפת denotes “tied”)."}, {"ch": 17, "v": 24, "aliyah": 5, "heb": "וַיֹּצֵ֨א מֹשֶׁ֤ה אֶת־כׇּל־הַמַּטֹּת֙ מִלִּפְנֵ֣י יְהֹוָ֔ה אֶֽל־כׇּל־בְּנֵ֖י יִשְׂרָאֵ֑ל וַיִּרְא֥וּ וַיִּקְח֖וּ אִ֥ישׁ מַטֵּֽהוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאַפֵּק משֶׁה יָת כָּל חֻטְרַיָּא מִן קֳדָם יְיָ לְוָת כָּל בְּנֵי יִשְׂרָאֵל <b>וְאִשְׁתְּמוֹדָעוּ<\/b> וּנְסִיבוּ גְּבַר חֻטְרֵיהּ:", "onk_en": "Moshe then brought out all the staffs from before Adonoy to all Bnei Yisroel, and each (man) saw [<b>recognized<\/b>], and retrieved his staff.", "pj": "וְהַנְפַּק משֶׁה יַת כָּל חוּטְרַיָא מִן קֳדָם יְיָ לְכָל בְּנֵי יִשְרָאֵל וְאִשְׁתְּמוֹדָעוּ וּנְסִיבוּ גְבַר חוּטְרֵיהּ", "pj_en": "And Mosheh brought out all the rods from before the Lord to all the sons of Israel, who recognised and took severally their rods.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 25, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה הָשֵׁ֞ב אֶת־מַטֵּ֤ה אַהֲרֹן֙ לִפְנֵ֣י הָעֵד֔וּת לְמִשְׁמֶ֥רֶת לְא֖וֹת לִבְנֵי־מֶ֑רִי וּתְכַ֧ל תְּלוּנֹּתָ֛ם מֵעָלַ֖י וְלֹ֥א יָמֻֽתוּ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אָתֵב יָת חֻטְרָא דְאַהֲרֹן לָקֳדָם סַהֲדוּתָא לְמַטְּרָא לְאָת לְעַמָּא סַרְבָּנָא וִיסוּפַן תּוּרְעֲמַתְהוֹן מִן <b>קֳדָמַי<\/b> וְלָא יְמוּתוּן:", "onk_en": "Adonoy said to Moshe, “Return the staff of Aharon before the (Ark of) Testimony to be preserved as a symbol to the rebellious people, so that their complaint will end [<b>from before Me<\/b>] and they not die.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אָתֵיב יַת חוּטְרָא דְאַהֲרן קֳדָם סַהֲדוּתָא לְמַטָרָא לְאָת לִבְנַיָא סַרְבָנַיָא וִיסוּפַן תּוּרְעֲמַתְהוֹן מִן קֳדָמַי וְלָא יְמוּתוּן", "pj_en": "And the Lord said to Mosheh, Take back the rod of Aharon, before the testimony, to be kept for a sign for the rebellious children, that their murmurings may cease from before Me, lest they die.", "tj": "", "tj_en": "", "rashi": "<b>למשמרת לאות.<\/b> לְזִכָּרוֹן שֶׁבָּחַרְתִּי בְּאַהֲרֹן לְכֹהֵן וְלֹא יִלּוֹנוּ עוֹד עַל הַכְּהֻנָּה:<br><br><b>ותכל תלונתם.<\/b> כְּמוֹ וּתְכַלֶּה תְּלֻנּוֹתָם; לָשׁוֹן זֶה שֵׁם מִפְעָל יָחִיד לְשׁוֹן נְקֵבָה, כְּמוֹ תְלֻנָּתָם, מרמור\"יש בלעז; וְיֵשׁ חִלּוּק בֵּין תְּלֻנּוֹתָם לִתְלֻנָּתָם, תְּלֻנָּתָם תְּלֻנָּה אַחַת, תְּלֻנּוֹתָם שֵׁם דָּבָר בִּלְשׁוֹן יָחִיד וַאֲפִלּוּ הֵם תְּלֻנּוֹת הַרְבֵּה:", "rashi_en": "למשמרת לאות TO BE KEPT AS A SIGN — i.e. as a reminder that I have chosen Aaron to be the priest and that they should therefore not murmur any more against the priesthood.<br><br>ותכל תלונתם is the same as וּתְכַלֶּה תלונתם, AND THOU SHALT MAKE AN END OF THEIR MURMURING. This form (תלנֹתם) is a nomen actionis (שם מפעל), singular number, feminine gender, the same as is תלונָתם; in O. F. murmures. But there is a difference in sense between תלנֹתם and תלונָתם. The word תלונָתם denotes a single act of murmuring; תלנתם is a noun with singular meaning although there may be many acts of murmuring."}, {"ch": 17, "v": 26, "aliyah": 6, "heb": "וַיַּ֖עַשׂ מֹשֶׁ֑ה כַּאֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֹת֖וֹ כֵּ֥ן עָשָֽׂה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲבַד משֶׁה כְּמָא דִּי פַקִּיד יְיָ יָתֵיהּ כֵּן עֲבָד:", "onk_en": "Moshe did (this), as Adonoy commanded him—so he did.", "pj": "וַעֲבַד משֶׁה הֵיכְמָא דְפַקֵיד יְיָ יָתֵיהּ הֵיכְדֵין עָבַד", "pj_en": "And Mosheh did so; as the Lord commanded so did he.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 27, "aliyah": 6, "heb": "וַיֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל־מֹשֶׁ֖ה לֵאמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥נוּ אָבָֽדְנוּ׃", "onk": "וַאֲמָרוּ בְּנֵי יִשְׂרָאֵל לְמשֶׁה לְמֵימָר הָא מִנָּנָא <b>קְטָלַת חַרְבָּא הָא מִנָּנָא בְּלַעַת אַרְעָא וְהָא מִנָּנָא דְּמִיתוּ בְמוֹתָנָא<\/b>:", "onk_en": "Bnei Yisroel said [the following] to Moshe: “Behold, we perish, we are lost—we are all lost [<b>killed by sword, some of us swallowed by the earth, some of us perish by plague<\/b>].", "pj": "וַאֲמָרוּ בְּנֵי יִשְרָאֵל לְמשֶׁה לְמֵימָר הָא מִינַן אִישְׁתֵּיצִיאוּ בְּשַׁלְהוֹבִית אֵישָׁתָא וּמִנַן אִתְבְּלָעוּ בְּאַרְעָא וְאָבָדוּ הָא אֲנַחְנָא חֲשִׁיבִין כְּאִילוּ אָבַדְנָא כּוּלָנָא", "pj_en": "And the sons of Israel spake with Mosheh, saying: Behold, some of us have been consumed with the flaming fire; some of us have been swallowed up by the earth, and have perished! Behold, we are accounted as if all of us are to be destroyed.", "tj": "וְאָמְרִין בְּנֵי יִשְרָאֵל לְמֵימָר הָא סַפְנָן וּכִדְנַן כּוּלָנָא אִישְׁתֵּיצִינָן אִית מִינָן דִי מִית בְּמַגֵיפְתָּא אִית מִינָן דִי פְתָחַת אַרְעָא יַת פּוּמָהּ וּבְלָעַת יַתְהוֹן:", "tj_en": "And the sons of Israel spake, saying: Behold, we are consumed, and are all of us as if destroyed. Some of us have died of the plague, and some of us the earth, opening her mouth, hath swallowed up.", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 28, "aliyah": 6, "heb": "כֹּ֣ל הַקָּרֵ֧ב&thinsp;<small>׀<\/small>&thinsp;הַקָּרֵ֛ב אֶל־מִשְׁכַּ֥ן יְהֹוָ֖ה יָמ֑וּת הַאִ֥ם תַּ֖מְנוּ לִגְוֺֽעַ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כֹּל דְּקָרֵב מִקְרַב לְמַשְׁכְּנָא דַיְיָ מָאִית הָא אֲנַחְנָא סַיְפִין לִמְמָת:", "onk_en": "Anyone approaching, who comes close to the Mishkon of Adonoy will die—have we been consigned to die?”", "pj": "כָּל דְקָרֵיב מִיקְרַב לְמַשְׁכְּנָא דַיְיָ מָאִית הַבְּרַם סַפְנָא לְמִשְׁתֵּיצְיָא", "pj_en": "Any one who approaches the tabernacle must die: are we not doomed to destruction?", "tj": "", "tj_en": "", "rashi": "<b>כל הקרב הקרב וגו'.<\/b> אֵין אָנוּ יְכוֹלִין לִהְיוֹת זְהִירִין בְּכָךְ, כֻּלָּנוּ רַשָּׁאִין לְהִכָּנֵס לַחֲצַר אֹהֶל מוֹעֵד, וְאֶחָד שֶׁיַּקְרִיב עַצְמוֹ יוֹתֵר מֵחֲבֵרוֹ וְיִכָּנֵס לְתוֹךְ אֹהֶל מוֹעֵד יָמוּת:<br><br><b>האם תמנו לגוע.<\/b> שֶׁמָּא הֻפְקַרְנוּ לְמִיתָה?:", "rashi_en": "כל הקרב הקרב וגו׳ WHOSOEVER APPROACHETH [UNTO THE DWELLING OF THE LORD SHALL DIE] — The meaning is: “We cannot be cautious enough in this matter: we are all of us allowed to enter into the court of the appointed tent, but one who betakes himself nearer than his fellow and goes into the appointed tent itself will die! <br><br>האם תמנו לגוע means are we perhaps constantly to be freely exposed to the danger of death?"}, {"ch": 18, "v": 1, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶֽל־אַהֲרֹ֔ן אַתָּ֗ה וּבָנֶ֤יךָ וּבֵית־אָבִ֙יךָ֙ אִתָּ֔ךְ תִּשְׂא֖וּ אֶת־עֲוֺ֣ן הַמִּקְדָּ֑שׁ וְאַתָּה֙ וּבָנֶ֣יךָ אִתָּ֔ךְ תִּשְׂא֖וּ אֶת־עֲוֺ֥ן כְּהֻנַּתְכֶֽם׃", "onk": "וַאֲמַר יְיָ לְאַהֲרֹן אַתְּ וּבְנָיךְ וּבֵית אָבוּךְ עִמָּךְ תְּסַלְּחוּן עַל חוֹבֵי מַקְדְּשָׁא וְאַתְּ וּבְנָיךְ עִמָּךְ תְּסַלְּחוּן עַל חוֹבֵי כְהֻנַּתְכוֹן:", "onk_en": "Adonoy said to Aharon: “You, your sons, and your father’s house with you will bear the sin of the Sanctuary, and you, and your sons with you will bear the sin of your <i>kehunah<\/i>.", "pj": "וַאֲמַר יְיָ לְאַהֲרן אַנְתְּ וּבְנָךְ וּבֵית אַבָּךְ עִמָךְ תְּקַבְּלוּן חוֹבֵי קוּדְשַׁיָא אִין לָא מִזְדַהֲרִין בְּאַסְקוּתְהוֹן וְאַנְתְּ וּבְנָךְ עִמָךְ תְקַבְּלוּן יַת חוֹבֵי כְּהוּנַתְכוֹן אִין לָא מִזְדַהֲרִין בְּאַפְרָשׁוּתְהוֹן", "pj_en": "And the Lord said unto Aharon, Thou, and thy sons, and the house of thy fathers with thee, shall bear the iniquity of the consecrated things, when you nave not been heedful in offering them; and thou and thy sons with thee shall bear the iniquity of your priesthood, when you have not been heedful of their separations.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אל אהרן.<\/b> לְמֹשֶׁה אָמַר שֶׁיֹּאמַר לְאַהֲרֹן, לְהַזְהִירוֹ עַל תַּקָּנַת יִשְׂרָאֵל שֶׁלֹּא יִכָּנְסוּ לַמִּקְדָּשׁ:<br><br><b>אתה ובניך ובית אביך.<\/b> הֵם בְּנֵי קְהָת אֲבִי עַמְרָם:<br><br><b>תשאו את עון המקדש.<\/b> עֲלֵיכֶם אֲנִי מַטִּיל עֹנֶשׁ הַזָּרִים שֶׁיֶּחֶטְאוּ בְעִסְקֵי הַדְּבָרִים הַמְקֻדָּשִׁים הַמְּסוּרִים לָכֶם, הוּא הָאֹהֶל וְהָאָרוֹן וְהַשֻּׁלְחָן וּכְלֵי הַקֹּדֶשׁ — אַתֶּם תֵּשְׁבוּ וְתַזְהִירוּ עַל כָּל זָר הַבָּא לִגַּע:<br><br><b>ואתה ובניך.<\/b> הַכֹּהֲנִים:<br><br><b>תשאו את עון כהנתכם.<\/b> שֶׁאֵינָהּ מְסוּרָה לַלְוִיִּם, וְתַזְהִירוּ הַלְוִיִּם הַשּׁוֹגְגִים שֶׁלֹּא יִגְּעוּ אֲלֵיכֶם בַּעֲבוֹדַתְכֶם:", "rashi_en": "ויאמר ה' אל אהרן AND GOD SAID UNTO AARON — i.e. He said it to Moses that he in turn should speak to Aaron to admonish him regarding the precautions to be taken for the benefit of the Israelites in order that they might not enter the Sanctuary (cf. Rashi on Leviticus 1:1 s. v. אליו and Note thereon).<br><br>אתה ובניך ובית אביך THOU, AND THY SONS, AND THY FATHERS HOUSE [… SHALL BEAR THE INIQUITY] — “And thy father’s house” refers to the sons of Kohath the father of Amram (whose charge it was to carry and to watch over the most holy vessels; cf. chapter Numbers IV.).<br><br>תשאו את עון המקדש [THOU, AND THY SONS, …] SHALL BEAR THE INIQUITY OF THE SANCTUARY — upon you I impose the punishment for any strangers who may inadvertently sin in respect to the sacred objects (המקדש) which are entrusted to you, — which are the tent, the Ark, the table and the holy vessels; you have to sit down (i.e. wait there and be in readiness) and give warning to any stranger who may be about to touch the holy articles.<br><br>ואתה ובניך AND THOU AND THY SONS, the priests,<br><br>תשאו את עון כהנתכם SHALL BEAR THE INIQUITY OF THY PRIESTHOOD — for it is not a charge given to the Levites; you must therefore warn the Levites who might do so inadvertently not to come near to you whilst you perform your service."}, {"ch": 18, "v": 2, "aliyah": 6, "heb": "וְגַ֣ם אֶת־אַחֶ֩יךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֙יךָ֙ הַקְרֵ֣ב אִתָּ֔ךְ וְיִלָּו֥וּ עָלֶ֖יךָ וִישָֽׁרְת֑וּךָ וְאַתָּה֙ וּבָנֶ֣יךָ אִתָּ֔ךְ לִפְנֵ֖י אֹ֥הֶל הָעֵדֻֽת׃", "onk": "וְאַף יָת אַחָיךְ שִׁבְטָא דְלֵוִי שִׁבְטָא דְאָבוּךְ קָרֵב לְוָתָךְ וְיִתּוֹסְפוּן עֲלָךְ וִישַׁמְּשֻׁנָּךְ וְאַתְּ וּבְנָיךְ עִמָּךְ קֳדָם מַשְׁכְּנָא דְסַהֲדוּתָא:", "onk_en": "Also, your brothers, the tribe of Levi—the tribe of your father—bring to you, and they shall join you, and serve you, you and your sons with you, before the Tent of Testimony.", "pj": "וְאוּף יַת אָחָךְ שִׁבְטָא דְלֵוִי דְמִתְקְרֵי עַל שְׁמָא דְעַמְרָם אַבָּךְ קָרֵיב לְוָתָךְ וְיִתְחַבְּרוּן לְוָתָךְ וִישַׁמְשׁוּנָךְ וְאַנְתְּ וּבְנָךְ עִמָךְ תְּקוּמוּן קֳדָם מַשְׁכְּנָא דְסַהֲדוּתָא", "pj_en": "And thy brethren also of the tribe of Levi, who are called by the name of Amram thy father, shalt thou bring near to thee, that they may consociate with and minister to thee. But thou, and thy sons with thee, (only) shall stand before the tabernacle of the testimony.", "tj": "", "tj_en": "", "rashi": "<b>וגם אחיך.<\/b> בְּנֵי גֵרְשׁוֹן וּבְנֵי מְרָרִי:<br><br><b>וילוו.<\/b> וְיִתְחַבְּרוּ אֲלֵיכֶם, לְהַזְהִיר גַּם אֶת הַזָּרִים מִלִּקְרַב אֲלֵיהֶם:<br><br><b>וישרתוך.<\/b> בִּשְׁמִירַת הַשְּׁעָרִים וּלְמַנּוֹת מֵהֶם גִּזְבָּרִין וַאֲמַרְכָּלִין (ספרי):", "rashi_en": "וגם את אחיך AND ALSO THY BRETHREN — i.e. the sons of Gershon and the sons of Merari.<br><br>וילוו means THAT THEY MAY JOIN THEMSELVES UNTO THEE to warn also the strangers (the ordinary Israelites) not to come near to them. <br><br>וישרתוך AND THEY SHALL MINISTER UNTO THEE by guarding the Temple gates and by appointing from among them (cf. Arakhin 11b) keepers of the Temple treasury and superintendents over these (Sifrei Bamidbar 116:1)."}, {"ch": 18, "v": 3, "aliyah": 6, "heb": "וְשָֽׁמְרוּ֙ מִֽשְׁמַרְתְּךָ֔ וּמִשְׁמֶ֖רֶת כׇּל־הָאֹ֑הֶל אַךְ֩ אֶל־כְּלֵ֨י הַקֹּ֤דֶשׁ וְאֶל־הַמִּזְבֵּ֙חַ֙ לֹ֣א יִקְרָ֔בוּ וְלֹֽא־יָמֻ֥תוּ גַם־הֵ֖ם גַּם־אַתֶּֽם׃", "onk": "וְיִטְּרוּן מַטַּרְתָּךְ וּמַטְּרַת כָּל מַשְׁכְּנָא בְּרַם לְמָנֵי קוּדְשָׁא וּלְמַדְבְּחָא לָא יִקְרְבוּן וְלָא יְמוּתוּן אַף אִנּוּן אַף אַתּוּן:", "onk_en": "They shall guard their duties to you and all the duties of the Tent, but to the holy furniture or to the Altar they must not approach, that neither they, nor you, shall die.", "pj": "וְיִטְרוּן מַטַרְתָּךְ וּמַטְרַת כָּל מַשְׁכְּנָא בְּרַם לְמָאנֵי קוּדְשָׁא וּלְמַדְבְּחָא לָא יִקְרְבוּן וְלָא יְמוּתוּן אוּף הִינוּן אוּף אַתּוּן", "pj_en": "And they shall keep thy charge, and have charge of all the tabernacle; yet to the vessels of the sanctuary and to the altar they are not to come near, lest both they and you die.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 4, "aliyah": 6, "heb": "וְנִלְו֣וּ עָלֶ֔יךָ וְשָֽׁמְר֗וּ אֶת־מִשְׁמֶ֙רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְכֹ֖ל עֲבֹדַ֣ת הָאֹ֑הֶל וְזָ֖ר לֹא־יִקְרַ֥ב אֲלֵיכֶֽם׃", "onk": "וְיִתּוֹסְפוּן עֲלָךְ וְיִטְּרוּן יָת מַטְּרַת מַשְׁכַּן זִמְנָא לְכָל פָּלְחַן מַשְׁכְּנָא וְחִלּוֹנַי לָא יִקְרַב לְוָתְכוֹן:", "onk_en": "They shall join you and guard the duties of the Tent of Meeting—all the service of the Tent, but a commoner, [a non-<i>kohein<\/i>] should not approach you.", "pj": "וְיִזְדַמְנוּן לְוָתָךְ מִלְבַּר וְיִטְרוּן יַת מַטְרַת מַשְׁכַּן זִמְנָא לְכָל פּוּלְחַן מַשְׁכְּנָא וְחִילוֹנֵי לָא יִקְרַב לְוַתְכוֹן", "pj_en": "And they shall have appointment from thee without, and keep charge of the tabernacle of ordinance for all its service; and a stranger shall not come near you.", "tj": "", "tj_en": "", "rashi": "<b>וזר לא יקרב אליכם.<\/b> אֶתְכֶם אֲנִי מַזְהִיר עַל כָּךְ:", "rashi_en": "וזר לא יקרב אליכם AND A LAYMAN SHALL NOT APPROACH UNTO YOU — It is you whom I admonish concerning this."}, {"ch": 18, "v": 5, "aliyah": 6, "heb": "וּשְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַקֹּ֔דֶשׁ וְאֵ֖ת מִשְׁמֶ֣רֶת הַמִּזְבֵּ֑חַ וְלֹֽא־יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל־בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְתִטְּרוּן יָת מַטְּרַת קוּדְשָׁא וְיָת מַטְּרַת מַדְבְּחָא וְלָא יְהֵי עוֹד רָגְזָא עַל בְּנֵי יִשְׂרָאֵל:", "onk_en": "You shall discharge the sacred duties and the duties of the Altar, so that there will be no more wrath on Bnei Yisroel.", "pj": "וְתִטְרוּן יַת מַטְרַת קוּדְשָׁא וְיַת מַטְרַת מַדְבְּחָא וְלָא יְהֵי תוּב רוּגְזָא דַהֲוָה עַל בְּנֵי יִשְרָאֵל", "pj_en": "And you shall keep the charge of the sanctuary and of the altar, that there may be no more the wrath that hath been upon the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ולא יהיה עוד קצף.<\/b> כְּמוֹ שֶׁהָיָה כְבָר, שֶׁנֶּאֱמַר (במדבר י\"ז) \"כִּי יָצָא הַקֶּצֶף\" (ספרי):", "rashi_en": "ולא יהיה עוד קצף THAT THERE BE NO ANGER ANY MORE as there has been already, as it is said, (Numbers 17:11) “For there is anger gone [forth from the Lord]” (Sifrei Bamidbar 116:1)."}, {"ch": 18, "v": 6, "aliyah": 6, "heb": "וַאֲנִ֗י הִנֵּ֤ה לָקַ֙חְתִּי֙ אֶת־אֲחֵיכֶ֣ם הַלְוִיִּ֔ם מִתּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָכֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽיהֹוָ֔ה לַעֲבֹ֕ד אֶת־עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃", "onk": "וַאֲנָא הָא קָרֵיבִית יָת אֲחֵיכוֹן לֵוָאֵי מִגּוֹ בְּנֵי יִשְׂרָאֵל לְכוֹן מַתְּנָא יְהִיבִין <b>קֳדָם<\/b> יְיָ לְמִפְלַח יָת פָּלְחַן מַשְׁכַּן זִמְנָא:", "onk_en": "Behold, I have brought your brothers the Levites from among Bnei Yisroel, given to you as a gift—for [<b>before<\/b>] Adonoy—to perform the work of the Tent of Meeting.", "pj": "וַאֲנָא הָא קְרֵיבִית יַת אֲחוּכוֹן לֵיוָאֵי מִגוֹ בְּנֵי יִשְרָאֵל לְכוֹן מַתָּנָא יְהִיבִין קֳדָם יְיָ לְמִפְלַח יַת פּוּלְחַן מַשְׁכַּן זִמְנָא", "pj_en": "And, behold, I have taken your brethren the Levites from among the sons of Israel; to you they are given, a gift before the Lord, to perform the work of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>לכם מתנה נתנים.<\/b> יָכוֹל לַעֲבוֹדַתְכֶם שֶׁל הֶדְיוֹט, תַּ\"ל \"לַה'\", כְּמוֹ שֶׁמְּפֹרָשׁ לְמַעְלָה, לִשְׁמֹר מִשְׁמֶרֶת גִּזְבָּרִין וַאֲמַרְכָּלִין:", "rashi_en": "לכם מתנה נתתים TO YOU THEY ARE GIVEN AS A GIFT — I might think that they are given unto you for your private work! It, however, states, “[to you they are given as a gift] for the Lord” — meaning, as explained above (v. 2), — to keep the charge of Temple treasuries and superintendents (Sifrei Bamidbar 116:2)."}, {"ch": 18, "v": 7, "aliyah": 6, "heb": "וְאַתָּ֣ה וּבָנֶ֣יךָ אִ֠תְּךָ֠ תִּשְׁמְר֨וּ אֶת־כְּהֻנַּתְכֶ֜ם לְכׇל־דְּבַ֧ר הַמִּזְבֵּ֛חַ וּלְמִבֵּ֥ית לַפָּרֹ֖כֶת וַעֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת־כְּהֻנַּתְכֶ֔ם וְהַזָּ֥ר הַקָּרֵ֖ב יוּמָֽת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאַתְּ וּבְנָיךְ עִמָּךְ תִּטְּרוּן יָת כְּהֻנַּתְכוֹן לְכָל פִּתְגַּם מַדְבְּחָא וּלְמִגָּו לְפָרוּכְתָּא וְתִפְלְחוּן פָּלְחַן מַתְּנָא אֵיהַב יָת כְּהֻנַּתְכוֹן וְחִלּוֹנַי דְּיִקְרַב יִתְקְטָל:", "onk_en": "You and your sons with you shall guard your <i>kehunah<\/i> [duties] regarding the Altar and all that is within the Curtain—you shall serve—the service, as a gift, I give the <i>kehunah<\/i> to you, and the commoner who approaches shall be killed.”", "pj": "וְאַנְתְּ וּבְנָךְ עִמָךְ תִּנְטְרוּן יַת כְּהוּנַתְכוֹן לְכָל פִּתְגַם מַדְבְּחָא וּלְמִגֵיו לְפַרְגוֹדָא וְתִפְלְחוּן לְפוּם עַדְבַיָא כְּפוּלְחָנָא כֵּן מֵיכַל מַתָּנָה אֶתֵּן בִּרְבוּתָא יַת כְּהוּנַתְכוֹן וְחִילוֹנֵי דְיִקְרַב יִתְקְטֵיל", "pj_en": "But thou, and thy sons with thee, shall keep the charge of your priesthood in all things that pertain to the altar, and (those) within the veil, and shall minister by lots, according to the service. So, provision of food have I given you, on account of the anointing of your priesthood; and the stranger who cometh near shall die.", "tj": "", "tj_en": "", "rashi": "<b>עבדת מתנה.<\/b> בְּמַתָּנָה נְתַתִּיהָ לָכֶם:", "rashi_en": "עבדת מתנה [I HAVE GIVEN YOUR PRIESTHOOD UNTO YOU] AS A SERVICE OF GIFT — This means as a gift have I given it to you, [and the stranger that comes near shall die]."}, {"ch": 18, "v": 8, "aliyah": 6, "heb": "וַיְדַבֵּ֣ר יְהֹוָה֮ אֶֽל־אַהֲרֹן֒ וַאֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְךָ֔ אֶת־מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑י לְכׇל־קׇדְשֵׁ֣י בְנֵֽי־יִ֠שְׂרָאֵ֠ל לְךָ֨ נְתַתִּ֧ים לְמׇשְׁחָ֛ה וּלְבָנֶ֖יךָ לְחׇק־עוֹלָֽם׃", "onk": "וּמַלִּיל יְיָ עִם אַהֲרֹן וַאֲנָא הָא יְהָבִית לָךְ יָת מַטְּרַת אַפְרָשׁוּתָי לְכָל קוּדְשַׁיָּא דִבְנֵי יִשְׂרָאֵל לָךְ יְהַבְתִּנּוּן לִרְבוּ וְלִבְנָיךְ לִקְיַם עֳלָם:", "onk_en": "Adonoy spoke to Aharon: “Behold I have given you the guarding of my <i>terumah<\/i>-gifts, and all the hallowed things of Bnei Yisroel, to you and your children I give them for consecration, as a portion forever.", "pj": "וּמַלֵיל יְיָ עִם אַהֲרן וַאֲנָא בְּחֶדְוָא יְהָבִית לָךְ יַת מַטְרַת אַפְרָשׁוּתִי חַלְתָא וּבִכּוּרַיָא וְכָל קוּדְשַׁיָא דִבְנֵי יִשְרָאֵל לָךְ יְהַבְתִּינוּן לִרְבוּ וְלִבְנָךְ לִקְיַים עֲלָם", "pj_en": "And the Lord said to Aharon, And I have been pleased to give you the charge of My separated offerings; the cakes of the firstfruits, and all the consecrated things of the children of Israel, to thee have I given them, on account of the anointing, and to thy sons, by an everlasting statute.", "tj": "", "tj_en": "", "rashi": "<b>ואני הנה נתתי לך.<\/b> בְּשִׂמְחָה, לְשׁוֹן שִׂמְחָה הוּא זֶה, כְּמוֹ \"הִנֵּה הוּא יֹצֵא לִקְרָאתֶךָ וְרָאֲךָ וְשָׂמַח בְּלִבּוֹ\" (שמות ד'); מָשָׁל לְמֶלֶךְ שֶׁנָּתַן שָׂדֶה לְאוֹהֲבוֹ, וְלֹא כָתַב וְלֹא חָתַם וְלֹא הֶעֱלָה בְעַרְכָּאִין, בָּא אֶחָד וְעִרְעֵר עַל הַשָּׂדֶה, אָמַר לוֹ הַמֶּלֶךְ כָּל מִי שֶׁיִּרְצֶה יָבֹא וִיעַרְעֵר לְנֶגְדְּךָ, הֲרֵינִי כוֹתֵב וְחוֹתֵם לְךָ וּמַעֲלֶה בְעַרְכָּאִין, אַף כָּאן, לְפִי שֶׁבָּא קֹרַח וְעִרְעֵר כְּנֶגֶד אַהֲרֹן עַל הַכְּהֻנָּה, בָּא הַכָּתוּב וְנָתַן לוֹ כ\"ד מַתְּנוֹת כְּהֻנָּה בִּבְרִית מֶלַח עוֹלָם, וְלְכָךְ נִסְמְכָה פָרָשָׁה זוֹ לְכָאן (ספרי):<br><br><b>משמרת תרומתי.<\/b> שֶׁאַתָּה צָרִיךְ לְשָׁמְרָן בְּטָהֳרָה:<br><br><b>למשחה.<\/b> לִגְדֻלָּה (שם):", "rashi_en": "ואני הנה נתתי לך AND I, BEHOLD, I HAVE ALSO GIVEN THEE [THE CHARGE OF MINE HEAVE OFFERING] with pleasure. This is suggested by the word “Behold”, for this is an expression used when something is done with pleasure, just as in, (Exodus 4:14) “Behold, he goeth forth to meet thee and when he will see thee he will rejoice in his heart!” A parable! This may be compared to a king who presented a field to his friend, but he did not write or seal a deed of gift nor did he record it in the court. When a man came and laid claim to the field, the king said to him, “It seems that anyone who wishes to do so may come and claim against you; behold, I will write and seal a deed of gift to you, and record it in the court! So here, too, because Korah came and made a claim against Aaron to the Priesthood, Scripture (God) came and gave him the twenty-four “gifts” of the priesthood as an everlasting covenant of salt (i.e. an enduring covenant). For this reason is this section recording the gifts of the priests placed here after that which narrates Korah’s rebellion (Sifrei Bamidbar 117:1).<br><br>משמרת תרומתי [I HAVE GIVEN UNTO YOU] THE KEEPING OF MY HEAVE OFFERINGS — This means that you have to keep them in a state of purity (to guard them against uncleanness). <br><br>למשחה means as a distinction (cf. Onkelos; Sifrei Bamidbar 117:2; Zevachim 91a)."}, {"ch": 18, "v": 9, "aliyah": 6, "heb": "זֶֽה־יִהְיֶ֥ה לְךָ֛ מִקֹּ֥דֶשׁ הַקֳּדָשִׁ֖ים מִן־הָאֵ֑שׁ כׇּל־קׇ֠רְבָּנָ֠ם לְֽכׇל־מִנְחָתָ֞ם וּלְכׇל־חַטָּאתָ֗ם וּלְכׇל־אֲשָׁמָם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔י קֹ֣דֶשׁ קׇֽדָשִׁ֥ים לְךָ֛ ה֖וּא וּלְבָנֶֽיךָ׃", "onk": "דֵּין יְהֵי לָךְ מִקּוֹדֶשׁ קוּדְשַׁיָּא <b>מוֹתַר<\/b> מִן אֶשָּׁתָא כָּל קוּרְבָּנֵיהוֹן לְכָל מִנְחַתְהוֹן וּלְכָל חַטְוַתְהוֹן וּלְכָל אֲשַׁמְהוֹן דִּי יְתִיבוּן <b>קֳדָמַי<\/b> קוֹדֶשׁ קוּדְשִׁין דִּי לָךְ הוּא וְלִבְנָיךְ:", "onk_en": "This is yours from the most holy [<b>that remain<\/b>] from the fire, [of] all their sacrifices—their <i>minchah<\/i>-offerings, their sin-offerings and their guilt-offerings which they return to [<b>before<\/b>] Me shall be most holy to you and your sons.", "pj": "דֵין יְהֵי לָךְ מִקוֹדֶשׁ קוּדְשַׁיָא מַה דְמִשְׁתַּיֵיר מֵעָלָתָא דְעָנָא מִן אֵישָׁתָא כָּל קוּרְבַּנְהוֹן לְכָל מִנְחַתְהוֹן וּלְכָל חַטְוַותְהוֹן וּלְכָל אֲשַׁמְהוֹן דִיְתִיבִין קֳדָמַי קוֹדֶשׁ קוּדְשִׁין דִילָךְ הוּא וְדִבְנָךְ", "pj_en": "They shall be to thee most sacred; whatsoever remaineth of the sheep offered by fire, all their oblations, of all their minchas, of all their sin offerings, and of all their trespass offerings which they present before Me, they are most sacred for thee and for thy sons.", "tj": "", "tj_en": "", "rashi": "<b>מן האש.<\/b> לְאַחַר הַקְטָרַת הָאִשִּׁים:<br><br><b>כל קרבנם.<\/b> כְּגוֹן זִבְחֵי שַׁלְמֵי צִבּוּר:<br><br><b>מנחתם חטאתם ואשמתם.<\/b> כְּמַשְׁמָעוֹ:<br><br><b>אשר ישיבו לי.<\/b> זֶה גֶּזֶל הַגֵּר (שם; זבחים מ\"ד):", "rashi_en": "מן האש FROM THE FIRE — i.e., after the burning of the portions given over the fire. (The words are taken to mean: from the time when the fire has operated).<br><br>כל קרבנם EVERY OFFERING OF THEIRS — for instance the sacrifices of communal feast offerings.<br><br>מנחתם חטאתם ואשמם EVERY MEAL OFFERING OF THEIRS, AND EVERY SIN OFFERING OF THEIRS, AND EVERY GUILT OFFERING OF THEIRS — all these offerings should be understood in their usual meanings.<br><br>אשר ישיבו לי WHICH THEY SHALL RENDER (more lit., which they shall return) UNTO ME — This refers to property wrongfully taken from a proselyte (which, when he has no legal heir, reverts to the priests; cf. Rashi on v. 8) (Sifrei Bamidbar 117:2; Zevachim 44b)."}, {"ch": 18, "v": 10, "aliyah": 6, "heb": "בְּקֹ֥דֶשׁ הַקֳּדָשִׁ֖ים תֹּאכְלֶ֑נּוּ כׇּל־זָכָר֙ יֹאכַ֣ל אֹת֔וֹ קֹ֖דֶשׁ יִֽהְיֶה־לָּֽךְ׃", "onk": "בְּקֹדֶשׁ קוּדְשִׁין תֵּכְלֻנֵּיהּ כָּל דְּכוּרָא יֵיכוּל יָתֵיהּ קוּדְשָׁא יְהֵי לָךְ:", "onk_en": "You shall eat it in the supremely holy (place), every male may eat it—it shall be holy to you.", "pj": "בְּקוֹדֶשׁ קוּדְשַׁיָא תֵּיכְלוּנֵיהּ כָּל דְכוּרָא יֵיכוֹל יָתֵיהּ בִּרְבוּתָא קוּדְשָׁא יְהֵי לָךְ", "pj_en": "Thou mayest eat it in the sanctuary; every male may eat thereof; on account of the holy anointing it shall be thine.", "tj": "", "tj_en": "", "rashi": "<b>בקדש הקדשים תאכלנו וגו'.<\/b> לִמֵּד עַל קָדְשֵׁי קֳדָשִׁים שֶׁאֵין נֶאֱכָלִין אֶלָּא בָּעֲזָרָה לְזִכְרֵי כְהֻנָּה:", "rashi_en": "בקדש הקדשים תאכלנו וגו׳ IN THE MOST HOLY PLACE THOU SHALT EAT IT etc. — This teaches with reference to the sacrifices holy in the highest degree that they must be eaten only in the fore-court and only by male priests (cf. Sifrei Bamidbar 117:2)."}, {"ch": 18, "v": 11, "aliyah": 6, "heb": "וְזֶה־לְּךָ֞ תְּרוּמַ֣ת מַתָּנָ֗ם לְכׇל־תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְךָ֣ נְתַתִּ֗ים וּלְבָנֶ֧יךָ וְלִבְנֹתֶ֛יךָ אִתְּךָ֖ לְחׇק־עוֹלָ֑ם כׇּל־טָה֥וֹר בְּבֵיתְךָ֖ יֹאכַ֥ל אֹתֽוֹ׃", "onk": "וְדֵין לָךְ אַפְרָשׁוּת מַתְּנַתְהוֹן לְכָל אֲרַמוּת בְּנֵי יִשְׂרָאֵל לָךְ יְהַבְתִּנּוּן וְלִבְנָיךְ וְלִבְנָתָיךְ עִמָּךְ לִקְיַם עֳלָם כָּל דִּדְכֵי בְּבֵיתָךְ יֵיכוּל יָתֵיהּ:", "onk_en": "Their <i>terumah<\/i>-gift is yours, of all of the wave-offerings of Bnei Yisroel I give to you and to your sons and daughters that are with you as an everlasting portion; all those ritually pure in your house may eat it.", "pj": "וְדֵין דְזָכִיתִי לָךְ אַפְרָשׁוּת מַתְּנַתְהוֹן לְכָל אֲרָמוּת בְּנֵי יִשְרָאֵל לָךְ יְהַבְתִּינוּן וְלִבְנָךְ וְלִבְנָתָךְ עִמָךְ לִקְיַים עֲלָם כָּל דְיִדְכֵּי בְּבֵיתָךְ יֵיכוּל יָתֵיהּ", "pj_en": "And this is what I have set apart to thee of their separated minchas, and of all the uplifted things of the sons of Israel, to thee have I given them, and to thy sons and thy daughters with thee by an everlasting statute. Whoever is clean in thy house may eat of it.", "tj": "", "tj_en": "", "rashi": "<b>תרומת מתנם.<\/b> הַמּוּרָם מִן הַתּוֹדָה וּמֵהַשְּׁלָמִים וּמֵאֵיל נָזִיר:<br><br><b>לכל תנופת.<\/b> שֶׁהֲרֵי אֵלּוּ טְעוּנִין תְּנוּפָה:<br><br><b>כל טהור.<\/b> וְלֹא טְמֵאִים; דָּ\"אַ: כָּל טָהוֹר לְרַבּוֹת אִשְׁתּוֹ:", "rashi_en": "תרומת מתנם [AND THIS IS THINE:] THE HEAVE OFFERING OF THEIR GIFTS (i.e. of offerings given of their free will) — that which is set apart from the thanksgiving offering (cf. Leviticus 7:34), and from the festival offerings and from the ram of the Nazarite (Numbers 6:17).<br><br>לכל תנופת [AND THIS IS THINE: THE HEAVE OFFERING OF THEIR GIFT] AS REGARDS ALL THAT FORMS A WAVE OFFERING [OF THE CHILDREN OF ISRAEL] — That the above named offerings are intended is evident, for, you see, it is these that require waving (Sifrei Bamidbar 117:2).<br><br>כל טהור EVERY ONE THAT IS CLEAN [IN THY HOUSE SHALL EAT IT] — but not those who are unclean. Another explanation is: The expression “every one [in the house] that is clean” is intended to include his (the priest’s) wife (cf. Sifrei Bamidbar 117:2)."}, {"ch": 18, "v": 12, "aliyah": 6, "heb": "כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְכׇל־חֵ֖לֶב תִּיר֣וֹשׁ וְדָגָ֑ן רֵאשִׁיתָ֛ם אֲשֶׁר־יִתְּנ֥וּ לַֽיהֹוָ֖ה לְךָ֥ נְתַתִּֽים׃", "onk": "כָּל טוּב מְשַׁח וְכָל טוּב חֲמַר וְעִבּוּר רֵאשִׁיתְהוֹן דִּי יִתְּנוּן קֳדָם יְיָ לָךְ יְהַבְתִּנּוּן:", "onk_en": "The best of the oil, and the best of the wine and grain—their <i>terumah<\/i>-gift that they present to Adonoy—I have given to you.", "pj": "כָּל טוּב מְשַׁח זֵיתָא וְכָל טוּב חֲמַר עִינְבָא וְעִיבּוּר שֵׁירוּיֵיהוֹן דְיִתְּנוּן קֳדָם יְיָ לָךְ יְהַבְתִּינוּן", "pj_en": "All the best of the olive oil, of the grape wine, and of the wheat of their firstfruits which they present before the Lord, I have given unto thee.", "tj": "כָּל טוּב חִיטַיָיא וְכָל טוּב חֲמַר וּמִשְׁחָא שִׁירוּיַיתְהוֹן:", "tj_en": "All the best of the wheat, of the wine, and of the oil of their firstfruits.", "rashi": "<b>ראשיתם.<\/b> הִיא תְּרוּמָה גְדוֹלָה:", "rashi_en": "ראשיתם THE FIRST FRUITS OF THEM [WHICH THEY SHALL GIVE UNTO THE LORD; THEM I HAVE GIVEN THEE] — This refers to the “T’rumah Gedolah” (the priest’s portion of the produce which is the first portion to be set aside from the produce; cf. Deuteronomy 18:4)."}, {"ch": 18, "v": 13, "aliyah": 6, "heb": "בִּכּוּרֵ֞י כׇּל־אֲשֶׁ֧ר בְּאַרְצָ֛ם אֲשֶׁר־יָבִ֥יאוּ לַיהֹוָ֖ה לְךָ֣ יִהְיֶ֑ה כׇּל־טָה֥וֹר בְּבֵיתְךָ֖ יֹאכְלֶֽנּוּ׃", "onk": "בִּכּוּרֵי כָּל דִּי בְאַרְעֲהוֹן דִּי יַיְתוּן קֳדָם יְיָ דִּי לָךְ יְהֵי כָּל דִּדְכֵי בְּבֵיתָךְ יֵיכְלֻנֵּיהּ:", "onk_en": "The first fruits of all that is in their land, which they bring before Adonoy, shall be yours; all those ritually pure in your house may eat it.", "pj": "בִּכּוּרֵי דְכָל פֵּירֵי אִילָנֵי אַרְעֲהוֹן דְיִקְרְבוּן קֳדָם יְיָ דִילָךְ יְהֵי כָּל דִדְכֵי בְּבֵיתָךְ יֵיכְלוּנֵיהּ", "pj_en": "The firsts of all the trees of their ground which they present before the Lord shall be thine; every one who is clean in thy house may eat them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 14, "aliyah": 6, "heb": "כׇּל־חֵ֥רֶם בְּיִשְׂרָאֵ֖ל לְךָ֥ יִהְיֶֽה׃", "onk": "כָּל חֶרְמָא בְיִשְׂרָאֵל דִּי לָךְ יְהֵי:", "onk_en": "Everything consecrated in Israel shall be yours.", "pj": "כָּל דְמִגְמַר בְּיִשְרָאֵל דִילָךְ יְהֵי", "pj_en": "Every devoted thing in Israel shall be thine.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 15, "aliyah": 6, "heb": "כׇּל־פֶּ֣טֶר רֶ֠חֶם לְֽכׇל־בָּשָׂ֞ר אֲשֶׁר־יַקְרִ֧יבוּ לַֽיהֹוָ֛ה בָּאָדָ֥ם וּבַבְּהֵמָ֖ה יִֽהְיֶה־לָּ֑ךְ אַ֣ךְ&thinsp;<b>׀<\/b> פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽאָדָ֔ם וְאֵ֛ת בְּכֽוֹר־הַבְּהֵמָ֥ה הַטְּמֵאָ֖ה תִּפְדֶּֽה׃", "onk": "<b>כָּל פָּתַח וַלְדָּא<\/b> לְכָל בִּשְׂרָא דִּי יְקָרְבוּן קֳדָם יְיָ בֶּאֱנָשָׁא וּבִבְעִירָא יְהֵי לָךְ בְּרַם מִפְרַק תִּפְרוּק יָת בּוּכְרָא דֶאֱנָשָׁא וְיָת בּוּכְרָא דִבְעִירָא מְסַאֲבָא תִּפְרוֹק:", "onk_en": "Every firstling [<b>all that open the womb<\/b>] of every being which they offer before Adonoy—man or beast—shall be yours; but you must redeem the firstborn of man and redeem the firstborn of unclean beasts.", "pj": "כָּל פְּתַח וַלְדָא לְכָל בִּשְרָא בִּבְעִירָא דְיִקְרְבוּן מִינָהּ קֳדָם יְיָ כְּדִינָא דְאֵינָשָׁא כֵּן דִינָא בִּבְעִירָא לְמֶהֱוֵי דִילָךְ בְּרַם מִפְרַק תִּפְרוֹק יַת בּוּכְרָא דְאֵינָשָׁא בְּחַמְשָׁא סִלְעִין וְיַת בּוּכְרָא דִבְעִירָא מְסָאָבָא תִּפְרוֹק בְּאִמְרַיָא", "pj_en": "Whatever openeth the womb, of all flesh among animals which they offer before the Lord, as the regulation concerning men, so the regulation concerning cattle, it is to be thine: only thou art to redeem the firstborn of man by the five shekels, and the firstlings of the unclean animal thou shalt redeem with lambs.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 16, "aliyah": 6, "heb": "וּפְדוּיָו֙ מִבֶּן־חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּעֶ֨רְכְּךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא׃", "onk": "וּפוּרְקָנֵיהּ מִבַּר יַרְחָא תִּפְרוֹק בְּפֻרְסָנֵיהּ כְּסַף חֲמֵשׁ סִלְעִין בְּסִלְעֵי קוּדְשָׁא עַשְׂרִין מָעִין הוּא:", "onk_en": "Its redemption—from a month old you should redeem them—the valuation is five silver <i>sela’im<\/i> of holy silver <i>shekalim<\/i> which is twenty <i>gerah.<\/i>", "pj": "וּפִרְקוּנֵיהּ דְבַר נַשׁ מִבַּר יַרְחָא תִּפְרוֹק בִּסְכוּם עִלוֹיָיךְ כְּסַף חָמֵשׁ סִלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁא עַשְרִין מָעִין הוּא", "pj_en": "And the redemption of a man child of a month old thou shalt make, according to thy estimation of him, by five shekels of silver in the shekel of the sanctuary, which is twenty meahs.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 17, "aliyah": 6, "heb": "אַ֣ךְ בְּֽכוֹר־שׁ֡וֹר אֽוֹ־בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ־בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת־דָּמָ֞ם תִּזְרֹ֤ק עַל־הַמִּזְבֵּ֙חַ֙ וְאֶת־חֶלְבָּ֣ם תַּקְטִ֔יר אִשֶּׁ֛ה לְרֵ֥יחַ נִיחֹ֖חַ לַֽיהֹוָֽה׃", "onk": "בְּרַם בּוּכְרָא דְתוֹרָא אוֹ בוּכְרָא דְאִמְרָא אוֹ בוּכְרָא דְעִזָּא לָא תִפְרוּק קוּדְשָׁא אִנּוּן יָת דִּמְהוֹן תִּזְרוּק עַל מַדְבְּחָא וְיָת תַּרְבֵּיהוֹן תַּסֵּק קוּרְבַּן <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "However, a firstborn ox, a firstborn sheep or firstborn goat do not redeem because they are holy; sprinkle their blood on the altar and burn their fats as a fire-offering as a pleasing fragrance to [<b>accepted with pleasure before<\/b>] Adonoy.", "pj": "בְּרַם בּוּכְרָא דְתוֹרֵי אוֹ בוּכְרָא דְאִימְרֵי אוֹ בוּכְרָא דְעִזֵי לָא תִפְרוֹק מְטוֹל דְקוּדְשָׁא הִינוּן וְיַת אַדְמַתְהוֹן תִּדְרוֹק עַל מַדְבְּחָא וְיַת תַּרְבֵּיהוֹן תַּסִיק קוּרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "But the firstlings of oxen, of sheep, or of goats thou mayest not redeem, for they are sacred; but thou shalt sprinkle their blood upon the altar, and burn their fat for an oblation to be accepted before, the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 18, "aliyah": 6, "heb": "וּבְשָׂרָ֖ם יִהְיֶה־לָּ֑ךְ כַּחֲזֵ֧ה הַתְּנוּפָ֛ה וּכְשׁ֥וֹק הַיָּמִ֖ין לְךָ֥ יִהְיֶֽה׃", "onk": "וּבִשְׂרְהוֹן יְהֵי לָךְ כְּחַדְיָא דַאֲרָמוּתָא וּכְשׁוֹקָא דְיַמִּינָא לָךְ יְהֵי:", "onk_en": "Their flesh is yours; like the breast which is waved and like the right thigh—it shall be yours.", "pj": "וּבִשְרְהוֹן יְהֵי לָךְ לְמֵיכַל הֵי כְּחַדְיָא דַאֲרָמוּתָא וְהֵי כְשַׁקָא דְיַמִינָא דִילָךְ יְהֵי", "pj_en": "And their flesh shall be thine, for food; as the breast of the elevation, and as the right shoulder, it shall be thine.", "tj": "", "tj_en": "", "rashi": "<b>כחזה התנופה וכשוק הימין.<\/b> שֶׁל שְׁלָמִים שֶׁנֶּאֱכָלִין לַכֹּהֲנִים וְלִנְשֵׁיהֶם לִבְנֵיהֶם וּלְעַבְדֵיהֶם לִשְׁנֵי יָמִים וְלַיְלָה אֶחָד, אַף הַבְּכוֹר נֶאֱכָל לִשְׁנֵי יָמִים וְלַיְלָה אֶחָד:<br><br><b>לך יהיה.<\/b> בָּא רַבִּי עֲקִיבָא וְלִמֵּד, וְהוֹסִיף לְךָ הַכָּתוּב הֲוָיָה אַחֶרֶת, שֶׁלֹא תֹאמַר, כְּחָזֶה וְשׁוֹק שֶׁל תּוֹדָה שֶׁאֵינוֹ נֶאֱכָל אֶלָּא לְיוֹם וָלַיְלָה (זבחים נ\"ז):", "rashi_en": "כחזה התנופה וכשוק הימין [AND THE FLESH OF THEM (of the firstborn animals) SHALL BE TO YOU] AS THE WAVE BREAST AND THE RIGHT SHOULDER of the festival offerings which may be eaten by the priests, their wives and their sons and men-servants during a period of two days and one (the intervening) night, reckoning from the day of slaughtering; so, too, the flesh of the firstborn animal sacrifice may be eaten during two days and one night (Sifrei Bamidbar 118; Zevachim 57a).<br><br>לך יהיה IT SHALL BE THINE — Rabbi Akiba came and taught: By repeating the words לך יהיה Scripture adds another “status” (more lit., state of being; i.e., it intends the status implied in the first לך יהיה to be extended), in order that you should not say that it shall be to them even as the breast and shoulder of the thanksgiving offering, which may only be eaten during one day and the following night (Sifrei Bamidbar 118; Zevachim 57a)."}, {"ch": 18, "v": 19, "aliyah": 6, "heb": "כֹּ֣ל&thinsp;<b>׀<\/b> תְּרוּמֹ֣ת הַקֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי־יִשְׂרָאֵל֮ לַֽיהֹוָה֒ נָתַ֣תִּֽי לְךָ֗ וּלְבָנֶ֧יךָ וְלִבְנֹתֶ֛יךָ אִתְּךָ֖ לְחׇק־עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִפְנֵ֣י יְהֹוָ֔ה לְךָ֖ וּֽלְזַרְעֲךָ֥ אִתָּֽךְ׃", "onk": "כֹּל אַפְרָשׁוּת קוּדְשַׁיָּא דִּי יִפְרְשׁוּן בְּנֵי יִשְׂרָאֵל קֳדָם יְיָ יְהָבִית לָךְ וְלִבְנָיךְ וְלִבְנָתָיךְ עִמָּךְ לִקְיַם עֳלָם קְיַם מְלַח עֳלָם הוּא קֳדָם יְיָ לָךְ וְלִבְנָיךְ עִמָּךְ:", "onk_en": "All of the sacred <i>terumah<\/i>-gifts that Bnei Yisroel offer to Adonoy, I have given to you, your sons and daughters with you as an everlasting portion; an eternal covenant of salt before Adonoy to you and your children that are with you.”", "pj": "כָּל אַפְרָשׁוּת קוּדְשַׁיָא דִי יְקַדְשׁוּן בְּנֵי יִשְרָאֵל קֳדָם יְיָ יְהָבִית לָךְ וְלִבְנָךְ וְלִבְנָתָךְ עִמָךְ לִקְיַים עֲלָם וְלָא יִתְבַּטֵיל הֵי כְּמִלְחָא דִמְבַסִים בְּשַר קוּרְבָּנַיָא דִקְיַים עֲלָם הוּא קֳדָם יְיָ הֵיכְדֵין הוּא לָךְ וְלִבְנָךְ", "pj_en": "Every thing set apart of the sacred things which the sons of Israel consecrate to the Lord have I given to thee, to thy sons and thy daughters with thee, by a perpetual statute not to be abolished; as the salt which seasoneth the flesh of the oblation, because it is an everlasting statute before the Lord, so shall it be for thee and for thy children.", "tj": "", "tj_en": "", "rashi": "<b>כל תרומת הקדשים.<\/b> מֵחִבָּתָהּ שֶל פָּרָשָׁה זוֹ כְּלָלָהּ בַּתְּחִלָּה וּכְלָלָהּ בַּסּוֹף וּפָרַט בָּאֶמְצַע (עי' ספרי):<br><br><b>ברית מלח עולם.<\/b> כָּרַת בְּרִית עִם אַהֲרֹן בְּדָבָר הַבָּרִיא וּמִתְקַיֵּם וּמַבְרִיא אֶת אֲחֵרִים (שם):<br><br><b>ברית מלח.<\/b> כַּבְּרִית הַכְּרוּתָה לַמֶּלַח שֶׁאֵינוֹ מַסְרִיחַ לְעוֹלָם:", "rashi_en": "כל תרומת הקדשים ALL THE HEAVE OFFERINGS OF THE HOLY THINGS [… HAVE I GIVEN THEE] — Out of a feeling of affection for the contents of this section, Scripture comprehends it at first in a general statement (v. 11: וזה לכם תרומת וגו׳), and comprehends it also in a general statement at the end (in this verse) and enumerates the details in between (vv. 12—18) (Sifrei Bamidbar 118).<br><br>ברית מלח עולם [IT IS] A COVENANT OF SALT FOR EVER — This means that He made a covenant with Aaron by means of something which is wholesome and lasting and keeps other things wholesome (Sifrei Bamidbar 118).<br><br>ברית מלח A COVENANT OF SALT — Another explanation is that ברית מלח is equivalent to כברית מלח, and the meaning is: like the covenant that was made with salt that it will never decay."}, {"ch": 18, "v": 20, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶֽל־אַהֲרֹ֗ן בְּאַרְצָם֙ לֹ֣א תִנְחָ֔ל וְחֵ֕לֶק לֹא־יִהְיֶ֥ה לְךָ֖ בְּתוֹכָ֑ם אֲנִ֤י חֶלְקְךָ֙ וְנַחֲלָ֣תְךָ֔ בְּת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמַר יְיָ לְאַהֲרֹן בְּאַרְעֲהוֹן לָא תַחֲסִין וָחֳלַק לָא יְהֵי לָךְ בֵּינֵיהוֹן <b>מַתְּנַן דִּי יְהָבִית לָךְ<\/b> אִנּוּן חוּלְקָךְ וְאַחֲסַנְתָּךְ בְּגוֹ בְּנֵי יִשְׂרָאֵל:", "onk_en": "Adonoy said to Aharon: “You will have no inheritance in their land, and you will not have a share among them; I am [<b>the gift that I have given you is<\/b>] your inheritance and portion among Bnei Yisroel.", "pj": "וַאֲמַר יְיָ לְאַהֲרן בְּאַרְעֲהוֹן לָא תְקַבֵּל אַחְסָנָא כְּמִשְׁאַר שִׁבְטַיָא וְחוּלְקָא לָא יֶהֱוֵי לָךְ בֵּינֵיהוֹן אֲנָא חֶלְקָךְ וְאַחְסַנְתָּךְ בְּגוֹ בְּנֵי יִשְרָאֵל", "pj_en": "And the Lord said to Aharon, Thou wilt not receive a possession in their land as the rest of the tribes, nor wilt thou have a portion among them: I am thy Portion and thy Inheritance in the midst of the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>וחלק לא יהיה לך בתוכם.<\/b> אַף בַּבִּזָּה (שם):", "rashi_en": "וחלק לא יהיה לך בתוכם [THOU SHALT NOT INHERIT THEIR LAND,] NEITHER SHALT THOU HAVE ANY PORTION IN THE MIDST OF THEM even in the spoil (Sifrei Bamidbar 119:1)."}, {"ch": 18, "v": 21, "aliyah": 7, "heb": "וְלִבְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כׇּל־מַֽעֲשֵׂ֥ר בְּיִשְׂרָאֵ֖ל לְנַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָם֙ אֲשֶׁר־הֵ֣ם עֹֽבְדִ֔ים אֶת־עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְלִבְנֵי לֵוִי הָא יְהָבִית כָּל מַעַשְׂרָא בְיִשְׂרָאֵל לְאַחֲסָנָא חֲלַף פּוּלְחַנְהוֹן דִּי אִנּוּן פָּלְחִין יָת פּוּלְחַן מַשְׁכַּן זִמְנָא:", "onk_en": "Behold, I have given to the sons of Levi all the tithes in Israel for an inheritance in return for their service which they perform—the service of the Tent of Meeting.", "pj": "וְלִבְנוֹי דְלֵוִי הָא יְהָבִית יַת כָּל מַעַשְרָא בְּיִשְרָאֵל בְּאַחְסָנָא חוֹלַף פּוּלְחַנְהוֹן דְהִינוּן פַּלְחִין יַת פּוּלְחַן מַשְׁכְּנָא זִמְנָא", "pj_en": "And, behold, I have given to the sons of Levi all the tenths in Israel for a possession, on account of their service with which they serve in the work of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 22, "aliyah": 7, "heb": "וְלֹא־יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל־אֹ֣הֶל מוֹעֵ֑ד לָשֵׂ֥את חֵ֖טְא לָמֽוּת׃", "onk": "וְלָא יִקְרְבוּן עוֹד בְּנֵי יִשְׂרָאֵל לְמַשְׁכַּן זִמְנָא לְקַבָּלָא חוֹבָא לִמְמָת:", "onk_en": "Bnei Yisroel shall no longer approach the Tent of Meeting, to become guilty and die.", "pj": "וְלָא יְקַרְבוּן תּוּב בְּנֵי יִשְרָאֵל לְמַשְׁכַּן זִמְנָא לְקַבָּלָא חוֹבָא לִמְמָת", "pj_en": "And the sons of Israel shall no more come near the tabernacle to incur the sin unto death;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 23, "aliyah": 7, "heb": "וְעָבַ֨ד הַלֵּוִ֜י ה֗וּא אֶת־עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְהֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑ם חֻקַּ֤ת עוֹלָם֙ לְדֹרֹ֣תֵיכֶ֔ם וּבְתוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה׃", "onk": "וְיִפְלְחוּן לֵוָאֵי אִנּוּן יָת פּוּלְחַן מַשְׁכַּן זִמְנָא וְאִנּוּן יְקַבְּלוּן חוֹבֵיהוֹן קְיַם עֳלָם לְדָרֵיכוֹן וּבְגוֹ בְּנֵי יִשְׂרָאֵל לָא יַחְסְנוּן אַחֲסָנָא:", "onk_en": "The Levi[tes]—[they] shall perform the service of the Tent of Meeting and they will bear their guilt; it is an everlasting decree—throughout your generations—among Bnei Yisroel they (the Levites) shall have no inheritance.", "pj": "וְיִפְלְחוּן לֵיוָאֵי הִינוּן יַת פּוּלְחַן מַשְׁכַּן זִמְנָא וְהִינוּן יְקַבְּלוּן יַת חוֹבֵיהוֹן אִין לָא מִזְדַהֲרִין בְּפוּלְחַנְהוֹן קְיַים עֲלָם לְדָרֵיכוֹן וּבְגוֹ בְּנֵי יִשְרָאֵל לָא יַחְסְנוּן אַחְסָנָא", "pj_en": "but the Levites shall minister in the work of the tabernacle, and shall bear their sin if they be not diligent in their work. It is an everlasting statute for your generations; but among the sons of Israel they shall have no possession.", "tj": "", "tj_en": "", "rashi": "<b>והם.<\/b> הַלְוִיִּם — יִשְׂאוּ עֲוֹנָם שֶׁל יִשְׂרָאֵל, שֶׁעֲלֵיהֶם לְהַזְהִיר הַזָּרִים מִגֶּשֶׁת אֲלֵיהֶם:", "rashi_en": "והם [BUT THE LEVITES SHALL PERFORM THE SERVICE OF THE APPOINTED TENT] AND THEY SHALL BEAR THEIR INIQUITY — “They” means the Levites; they shall bear the iniquity of the children of Israel, because upon them (the Levites) lies the duty to warn them (the Israelites) not to come near unto them."}, {"ch": 18, "v": 24, "aliyah": 7, "heb": "כִּ֞י אֶת־מַעְשַׂ֣ר בְּנֵֽי־יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽיהֹוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַלְוִיִּ֖ם לְנַחֲלָ֑ה עַל־כֵּן֙ אָמַ֣רְתִּי לָהֶ֔ם בְּתוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי יָת מַעַשְׂרָא דִבְנֵי יִשְׂרָאֵל דִּי יַפְרְשׁוּן <b>קֳדָם<\/b> יְיָ אַפְרָשׁוּתָא יְהָבִית לְלֵוָאֵי לְאַחֲסָנָא עַל כֵּן אֲמָרִית לְהוֹן בְּגוֹ בְּנֵי יִשְׂרָאֵל לָא יַחְסְנוּן אַחֲסָנָא:", "onk_en": "For the tithe of Bnei Yisroel which they must set aside to [<b>before<\/b>] Adonoy as a <i>terumah<\/i>-gift I gave to the Levites as an inheritance; therefore, I told them: ‘among Bnei Yisroel they shall have no inheritance.’”", "pj": "אֲרוּם יַת מַעַשְרָא דִבְנֵי יִשְרָאֵל דְיִפְרְשׁוּן קֳדָם יְיָ אַפְרָשׁוּתָא יְהָבִית לְלֵיוָאֵי לְאַחְסָנָא בְגִין כֵּן לְהוֹן אַמְרִית דִבְגוֹ בְּנֵי יִשְרָאֵל לָא יַחְסְנוּן אַחְסָנָא", "pj_en": "Therefore the tenths of the children of Israel, which they set apart for a separation before the Lord, have I given to the Levites for a possession, because I have said to them that among the sons of Israel they shall possess no inheritance.", "tj": "", "tj_en": "", "rashi": "<b>אשר ירימו לה' תרומה.<\/b> הַכָּתוּב קְרָאוֹ תְּרוּמָה עַד שֶׁיַּפְרִישׁ מִמֶּנּוּ תְּרוּמַת מַעֲשֵׂר:", "rashi_en": "אשר ירימו לה׳ תרומה [BUT ALL THE TITHES OF THE CHILDREN OF ISRAEL] WHICH THEY HEAVE AS A HEAVE OFFERING UNTO THE LORD — Scripture terms it (the tithe) T’rumah (although it is not holy and may be eaten by a layman) until he (the Levite) sets apart from it the “heave offering of the tithe” (Sifrei Bamidbar 119:5)."}, {"ch": 18, "v": 25, "aliyah": 7, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 26, "aliyah": 7, "heb": "וְאֶל־הַלְוִיִּ֣ם תְּדַבֵּר֮ וְאָמַרְתָּ֣ אֲלֵהֶם֒ כִּֽי־תִ֠קְח֠וּ מֵאֵ֨ת בְּנֵֽי־יִשְׂרָאֵ֜ל אֶת־הַֽמַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָכֶ֛ם מֵאִתָּ֖ם בְּנַחֲלַתְכֶ֑ם וַהֲרֵמֹתֶ֤ם מִמֶּ֙נּוּ֙ תְּרוּמַ֣ת יְהֹוָ֔ה מַעֲשֵׂ֖ר מִן־הַֽמַּעֲשֵֽׂר׃", "onk": "וּלְלֵוָאֵי תְמַלֵּל וְתֵימַר לְהוֹן אֲרֵי תִסְּבוּן מִן בְּנֵי יִשְׂרָאֵל יָת מַעַשְׂרָא דִּי יְהָבִית לְכוֹן מִנְּהוֹן בְּאַחֲסַנְתְּכוֹן וְתַפְרְשׁוּן מִנֵּיהּ <b>אַפְרָשׁוּתָא<\/b> קֳדָם יְיָ מַעַשְׂרָא מִן מַעַשְׂרָא:", "onk_en": "“Speak to the Levites and say to them: ‘When you take the tithe from Bnei Yisroel, which I gave you from them for your inheritance, set aside from it the <i>terumah<\/i>-gift of [<b>separation before<\/b>] Adonoy, a tithe of the tithe.", "pj": "וּלְלֵיוָאֵי תְמַלֵיל וְתֵימַר לְהוֹן אֲרוּם תִּסְבוּן מִן בְּנֵי יִשְרָאֵל יַת מַעַשְרָא דִיהָבִית לְהוֹן בְּאַחְסַנְתְּהוֹן וְתִפְרְשׁוּן מִינֵיהּ אַפְרָשׁוּתָא קֳדָם יְיָ מַעַשְרָא מִגוֹ מַעַשְרָא", "pj_en": "Speak to the Levites, and bid them take from the sons of Israel the tenth which I have given them for their possession; and (then) shall you separate from it a separation before the Lord, a tenth from the tenth;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 27, "aliyah": 7, "heb": "וְנֶחְשַׁ֥ב לָכֶ֖ם תְּרוּמַתְכֶ֑ם כַּדָּגָן֙ מִן־הַגֹּ֔רֶן וְכַֽמְלֵאָ֖ה מִן־הַיָּֽקֶב׃", "onk": "וְתִתְחַשַּׁב לְכוֹן <b>אַפְרָשׁוּתְכוֹן<\/b> כְּעִבּוּרָא מִן אִדְרָא וְכַמְּלֵאָתָא מִן מַעְצַרְתָּא:", "onk_en": "Your <i>terumah<\/i>-gift [<b>separation<\/b>] will be considered the same as grain from the granary and [wine and oil of] fully ripened fruit from the cistern.", "pj": "וְאִתְחַשָׁב לְכוֹן אַפְרָשׁוּתְכוֹן הֵי כְּעִבּוּרָא מִן אִידְרָא וְהֵי כְּחַמְרָא דְמַלְיָתָא מִן מַעֲצַרְתָּא", "pj_en": "and your separation shall be reckoned to you as the corn from the threshing floor, and as the wine from the fulness of the winepress:", "tj": "", "tj_en": "", "rashi": "<b>ונחשב לכם תרומתכם כדגן מן הגרן.<\/b> תְּרוּמַת מַעֲשֵׂר שֶׁלָּכֶם אֲסוּרָה לְזָרִים וְלִטְמֵאִין, וְחַיָּבִין עָלֶיהָ מִיתָה וְחֹמֶשׁ כִּתְרוּמָה גְדוֹלָה שֶׁנִּקְרֵאת רֵאשִׁית דָּגָן מִן הַגֹּרֶן:<br><br><b>וכמלאה מן היקב.<\/b> תְּרוּמַת תִּירוֹשׁ וְיִצְהָר הַנִּטֶּלֶת מִן הַיְקָבִים:<br><br><b>מלאה.<\/b> לְשׁוֹן בִּשּׁוּל — תְּבוּאָה שֶׁנִּתְמַלֵּאת:<br><br><b>יקב.<\/b> הוּא הַבּוֹר שֶׁלִּפְנֵי הַגַּת שֶׁהַיַּיִן יוֹרֵד לְתוֹכוֹ, וְכָל לְשׁוֹן יֶקֶב חֲפִירַת קַרְקַע הוּא, וְכֵן \"יִקְבֵי הַמֶּלֶךְ\" (זכריה י\"ד), הוּא יָם אוֹקְיָנוֹס, חֲפִירָה שֶׁחָפַר מַלְכּוֹ שֶׁל עוֹלָם:", "rashi_en": "ונחשב לכם תרומתכם כדגן מן הגרן AND THIS YOUR HEAVE OFFERING SHALL BE RECKONED UNTO YOU AS THOUGH IT WERE THE CORN OF THE THRESHING FLOOR — i.e. the heave-offering of your tithe is forbidden to laymen and to unclean priests, and such of these as eat it of set purpose incur the death penalty, or, if they have eaten it inadvertently, pay in addition to the capital sum a fifth, just as in the case of “T’rumah Gedolah” (the T’rumah set apart by the ordinary Israelite) which is termed the “firstling of the corn” from the threshing floor.<br><br>וכמלאה מן היקב AND AS THE FULNESS OF THE WINE PRESS — the heave offering of wine and oil which is taken out of the wine-press.<br><br>מלאה is a term for “ripening”; it is the produce that becomes full.<br><br>יקב is the pit in front of the wine-press into which the wine runs. The expression יקב always denotes an excavation in the ground. Similar is (Zechariah 14:10) יקבי המלך, “the pits of the King”, that is, the ocean (cf. Rashi on that verse) — the cavity which the King of the Universe has excavated."}, {"ch": 18, "v": 28, "aliyah": 7, "heb": "כֵּ֣ן תָּרִ֤ימוּ גַם־אַתֶּם֙ תְּרוּמַ֣ת יְהֹוָ֔ה מִכֹּל֙ מַעְשְׂרֹ֣תֵיכֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵאֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּנְתַתֶּ֤ם מִמֶּ֙נּוּ֙ אֶת־תְּרוּמַ֣ת יְהֹוָ֔ה לְאַהֲרֹ֖ן הַכֹּהֵֽן׃", "onk": "כֵּן תַּפְרְשׁוּן אַף אַתּוּן אַפְרָשׁוּתָא קֳדָם יְיָ מִכֹּל מַעַשְׂרָתֵיכוֹן דִּי תִסְּבוּן מִן בְּנֵי יִשְׂרָאֵל וְתִתְּנוּן מִנֵּיהּ יָת <b>אַפְרָשׁוּתָא קֳדָם<\/b> יְיָ לְאַהֲרֹן כַּהֲנָא:", "onk_en": "So must you, too, set aside the <i>terumah<\/i>-gift of Adonoy from all your tithes which you take from Bnei Yisroel; give from them the <i>terumah<\/i>-gift of [<b>separation before<\/b>] Adonoy to Aharon the <i>kohein.<\/i>", "pj": "הֵיכְדֵין תִּפְרְשׁוּן לְחוֹד אַתּוּן אַפְרָשׁוּתָא קֳדָם יְיָ מִכָּל מַעַשְרֵיכוֹן דְתִסְבוּן מִן בְּנֵי יִשְרָאֵל וְתִתְּנוּן מִנֵיהּ אַפְרָשׁוּתָא קֳדָם יְיָ לְאַהֲרן כַּהֲנָא", "pj_en": "so shall you set apart your separation before the Lord from all your tenths, which you may receive from the sons of Israel, and give thereof a separation before the Lord unto Aharon the priest.", "tj": "", "tj_en": "", "rashi": "<b>כן תרימו גם אתם.<\/b> כְּמוֹ שֶׁיִּשְׂרָאֵל מְרִימִים מִגָּרְנָם וּמִיִּקְבֵיהֶם, תָּרִימוּ גַּם אַתֶּם מִמַּעֲשֵׂר שֶׁלָּכֶם, כִּי הוּא נַחֲלַתְכֶם:", "rashi_en": "כן תרימו גם אתם THUS YE ALSO SHALL HEAVE AN HEAVE OFFERING just as the ordinary Israelites set apart a heave offering, from the produce of their threshing floors and wine presses, so you Levites, also, shall set apart a heave offering from your tithes, for that is your inheritance (cf. v. 24)."}, {"ch": 18, "v": 29, "aliyah": 7, "heb": "מִכֹּל֙ מַתְּנֹ֣תֵיכֶ֔ם תָּרִ֕ימוּ אֵ֖ת כׇּל־תְּרוּמַ֣ת יְהֹוָ֑ה מִכׇּ֨ל־חֶלְבּ֔וֹ אֶֽת־מִקְדְּשׁ֖וֹ מִמֶּֽנּוּ׃", "onk": "מִכֹּל מַתְּנַתְכוֹן תַּפְרְשׁוּן יָת כָּל <b>אַפְרָשׁוּתָא<\/b> דַיְיָ מִכָּל שׁוּפְרֵיהּ יָת מַקְדְּשֵׁיהּ מִנֵּיהּ:", "onk_en": "From all your gifts you must set aside all of the <i>terumah<\/i>-gifts [<b>separations<\/b>] of Adonoy; from each thing—its finest part—the part that is to be consecrated.’", "pj": "מִכָּל מַתְּנָתֵיכוֹן תִּפְרְשׁוּן יַת אַפְרָשׁוּתָא קֳדָם יְיָ מִן כָּל שְׁפַר טוּבֵיהּ מִינֵיהּ וּבֵיהּ", "pj_en": "Of all your gifts you shall set apart a separation before the Lord, of all the finest and the best therein.", "tj": "", "tj_en": "", "rashi": "<b>מכל מתנתיכם תרימו את כל תרומת ה'.<\/b> בִּתְרוּמָה גְדוֹלָה הַכָּתוּב מְדַבֵּר, שֶׁאִם הִקְדִּים לֵוִי אֶת הַכֹּהֵן בַּכְּרִי וְקִבֵּל מַעְשְׂרוֹתָיו קֹדֶם שֶׁיִּטֹּל כֹּהֵן תְּרוּמָה גְדוֹלָה מִן הַכְּרִי, צָרִיךְ לְהַפְרִישׁ הַלֵּוִי מִן הַמַּעֲשֵׂר תְּחִלָּה אֶחָד מֵחֲמִשִּׁים לִתְרוּמָה גְדוֹלָה, וְיַחֲזֹר וְיַפְרִישׁ תְּרוּמַת מַעֲשֵׂר (ספרי):", "rashi_en": "מכל מתנתיכם תרימו את כל תרומת ה׳ OUT OF ALL YOUR GIFTS YOU SHALL HEAVE EVERY HEAVE OFFERING UNTO THE LORD — Scripture is speaking here of the “Terumah Gedolah” (not of תרומת מעשר, for this is dealt with in verse 28); the meaning is, that if the Levite came to the field before the priest, when the grain has been made into a heap (i.e., after it has been threshed, when it becomes subject to the law of Terumah), and received his tithes before the priest took the Terumah Gedolah from the heap, the Levite must first set apart the fiftieth part (the usual proportion of the crop which the Israelite gives to the priest) of the tithe as “Terumah Gedolah” and then again set apart the תרומת מעשר (i.e. the tithe of his tithe) (Shabbat 127b)."}, {"ch": 18, "v": 30, "aliyah": 7, "heb": "וְאָמַרְתָּ֖ אֲלֵהֶ֑ם בַּהֲרִֽימְכֶ֤ם אֶת־חֶלְבּוֹ֙ מִמֶּ֔נּוּ וְנֶחְשַׁב֙ לַלְוִיִּ֔ם כִּתְבוּאַ֥ת גֹּ֖רֶן וְכִתְבוּאַ֥ת יָֽקֶב׃", "onk": "וְתֵימַר לְהוֹן בְּאַפְרָשׁוּתְכוֹן יָת שׁוּפְרֵיהּ מִנֵּיהּ וְיִתְחַשַּׁב לְלֵוָאֵי כַּעֲלָלַת אִדְרָא וְכַעֲלָלַת מַעְצַרְתָּא:", "onk_en": "Say to them: ‘When you set aside the finest part of it, it will be considered for the Levites like the produce of the granary and the produce of the cistern.", "pj": "וְתֵימַר לְהוֹן לְכַהֲנַיָא בְּאַפְרָשׁוּתְכוֹן יַת שְׁפַר טוּבֵיהּ מִינֵיהּ וּבֵיהּ וְיִתְחַשֵׁב לְלֵיוָאֵי הֵי כְּאַפְרָשׁוּת עִבּוּרָא מִן גוֹ אִידְרָא וְהֵי כְּאַפְרָשׁוּת חַמְרָא מִגוֹ מַעֲצַרְתָּא", "pj_en": "And say thou to the priests, When you have set apart the finest and the best of it and in it, then shall it be reckoned to the Levites as the setting apart of corn from the threshing floor, and of wine from the winepress.", "tj": "", "tj_en": "", "rashi": "<b>בהרימכם את חלבו ממנו.<\/b> לְאַחַר שֶׁתָּרִימוּ תְרוּמַת מַעֲשֵׂר מִמֶּנּוּ:<br><br><b>ונחשב<\/b> הַמּוֹתָר לַלְוִיִּם חֻלִּין גְּמוּרִין:<br><br><b>כתבואת גרן לישראל<\/b>, שֶׁלֹּא תֹאמַר הוֹאִיל וּקְרָאוֹ הַכָּתוּב תְּרוּמָה — שֶׁנֶּאֱמַר \"כִּי אֶת מַעְשַׂר בְּנֵי יִשְׂרָאֵל אֲשֶׁר יָרִימוּ לַה' תְּרוּמָה\" — יָכוֹל יְהֵא כֻלּוֹ אָסוּר, תַּ\"ל \"וְנֶחְשַׁב לַלְוִיִּם כִּתְבוּאַת גֹּרֶן\", מַה שֶּׁל יִשְׂרָאֵל חֻלִּין, אַף שֶׁל לֵוִי חֻלִּין (עי' ספרי):", "rashi_en": "בהרימכם את חלבו ממנו WHEN YE HEAVE THE BEST THEREOF FROM IT — i.e. after you have heaved the תרומת מעשר (the priest’s share in the tithe) from it.<br><br>ונחשב THEN the remainder MAY BE ACCOUNTED by the Levites as profane (of a non-sacred character) in all respects.<br><br>כתבואת גרן AS THE PRODUCE OF THRESHING FLOOR is to the Israelites. [This is not a mere repetition of verse 27 but is stated in order that] you should not say: Since Scripture terms it (the tithe) “Terumah”, — as it is said, (verse 24) “But the tithes of the children of Israel which they heave as a תרומה unto the Lord” — I may conclude that it is all entirely forbidden to the Levites (just as “Terumah” is forbidden to them); Scripture therefore states, “it shall be accounted unto the Levites as the produce of the threshing floor”. How is it with the remainder of the Israelite’s produce after he has set apart the “Terumah”? It is profane (non-holy)! So, too, is the corresponding portion of the Levite’s tithe profane (cf. Sifrei Bamidbar 122)."}, {"ch": 18, "v": 31, "aliyah": 7, "heb": "וַאֲכַלְתֶּ֤ם אֹתוֹ֙ בְּכׇל־מָק֔וֹם אַתֶּ֖ם וּבֵֽיתְכֶ֑ם כִּֽי־שָׂכָ֥ר הוּא֙ לָכֶ֔ם חֵ֥לֶף עֲבֹֽדַתְכֶ֖ם בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "וְתֵיכְלוּן יָתֵיהּ בְּכָל אֲתַר אַתּוּן <b>וֶאֱנַשׁ בָּתֵּיכוֹן<\/b> אֲרֵי אַגְרָא הוּא לְכוֹן חֲלַף פָּלְחַנְכוֹן בְּמַשְׁכַּן זִמְנָא:", "onk_en": "You may consume it anywhere—you and [<b>the members of<\/b>] your household; since it is the reward for your service in the Tent of Meeting.", "pj": "וְתֵיכְלוּן יָתֵיהּ אַתּוּן כַּהֲנַיָא בְּכָל אֲתַר אַתּוּן וְאֵינַשׁ בָּתֵּיכוֹן אֲרוּם אַגְרָא הוּא לְכוֹן חִילוּפֵי פּוּלְחַנְכוֹן בְּמַשְׁכַּן זִמְנָא", "pj_en": "And you may eat it, you, the priests, in any place, you and the men of your house; for it is your remuneration for your service in the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>בכל מקום.<\/b> אֲפִלּוּ בְּבֵית הַקְּבָרוֹת (שם):", "rashi_en": "בכל מקום AND YE MAY EAT IN EVERY PLACE — even in a cemetery (Sifrei Bamidbar 122)."}, {"ch": 18, "v": 32, "aliyah": 7, "heb": "וְלֹֽא־תִשְׂא֤וּ עָלָיו֙ חֵ֔טְא בַּהֲרִֽימְכֶ֥ם אֶת־חֶלְבּ֖וֹ מִמֶּ֑נּוּ וְאֶת־קׇדְשֵׁ֧י בְנֵי־יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְלֹ֥א תָמֽוּתוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלָא תְקַבְּלוּן עֲלוֹהִי חוֹבָא בְּאַפְרָשׁוּתְכוֹן יָת שׁוּפְרֵיהּ מִנֵּיהּ וְיָת קוּדְשַׁיָּא דִבְנֵי יִשְׂרָאֵל לָא תַחֲלוּן וְלָא תְמוּתוּן:", "onk_en": "You will not bear a sin because of it, when you separate its best part; but sacred things of Bnei Yisroel you must not profane, and you will not die.”’", "pj": "וְלָא תְקַבְּלוּן עֲלוֹי חוֹבָא בִּזְמַן אַפְרָשׁוּתְכוֹן יַת שְׁפַר טוּבֵיהּ מִינֵיהּ וּבֵיהּ לְאוֹכְלֵי מִינֵיהּ לִדְסָאִיב וְיַת קוּדְשַּׁיָא דִבְנֵי יִשְ¦רָאֵל לָא תִפְסוּן וְלָא תְמוּתוּן", "pj_en": "And you shall not contract guilt by it, at what time you set apart the finest and best of it, by any one eating of it who is unclean; neither shall you profane the consecrated things of the children of Israel, lest you die.", "tj": "", "tj_en": "", "rashi": "<b>ולא תשאו עליו חטא וגו'.<\/b> הָא אִם לֹא תָרִימוּ תִּשְׂאוּ חֵטְא:<br><br><b>ולא תמותו.<\/b> הָא אִם תְּחַלְּלוּ תָּמוּתוּ:", "rashi_en": "ולא תשאו עליו חטא וגו׳ AND YE SHALL BEAR NO SIN BY REASON OF IT etc. — This implies: consequently if you do not set it aside you will bear sin on that account.<br><br>ולא תמותו LEST YE DIE — consequently if you do profane them you will die (Bekhorot 26b; cf. Rashi on Exodus 30:20 and Note thereon)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
