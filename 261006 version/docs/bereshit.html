ים, כַּאֲשֶׁר יֹאמַר הִקְדִים וְזֶה מוֹכִיחַ, וְעוֹד אַחֵר כִּי טֶרֶם תִּירְאוּן (שמות ט) עֲדַיִן לֹא תִירְאוּן, וְאַף זֶה תְפָרֵשׁ עֲדַיִן לֹא הָיָה בָאָרֶץ, כְּשֶׁנִּגְמְרָה בְרִיאַת הָעוֹלָם בַּשִּׁשִּׁי קֹדֶם שֶׁנִבְרָא אָדָם, וְכָל עֵשֶׂב הַשָּׂדֶה טֶרֶם יִצְמַח, עֲדַיִן לֹא צָמַח, וּבְג' שֶׁכָּתוּב תּוֹצֵא הָאָרֶץ, לֹא יָצְאוּ, אֶלָּא עַל פֶּתַח קַרְקַע עָמְדוּ עַד יוֹם שִׁשִּׁי:<br><br><b>כי לא המטיר.<\/b> וּמַ\"טַ לֹא הִמְטִיר? לְפִי שֶׁאָדָם אַיִן לַעֲבֹד אֶת הָאֲדָמָה, וְאֵין מַכִּיר בְּטוֹבָתָם שֶׁל גְּשָׁמִים, וּכְשֶׁבָּא אָדָם וְיָדַע שֶׁהֵם צֹרֶךְ לָעוֹלָם, הִתְפַּלֵּל עֲלֵיהֶם וְיָרְדוּ וְצָמְחוּ הָאִילָנוֹת וְהַדְּשָׁאִים:<br><br><b>ה' אלהים.<\/b> ה' הוּא שְׁמוֹ, אֱלֹהִים שֶׁהוּא שַׁלִּיט וְשׁוֹפֵט עַל כֹּל, וְכֵן פֵּרוּש זֶה בְּכָל מָקוֹם לְפִי פְּשׁוּטוֹ, ה' שֶׁהוּא אֱלֹהִים:", "rashi_en": "טרם יהיה בארץ  WAS NOT YET IN THE EARTH — Wherever טרם occurs in the Scriptures it means “not yet” and does not mean “before”. It cannot be made into a verbal form, saying הטרים as one says הקדים (verbal form of קדם) and this passage proves that this is the meaning and not \"before\" as well as another (Exodus 9:30), כי טרם תראון “that ye do not yet fear the Lord”. Therefore you must explain this verse also thus: “No plant of the field was yet in the earth” at the time when the creation of the world was completed on the sixth day before man was created, and וכל עשב השדה טרם יצמח means “and every herb of the field had not yet grown”. But as regards the third day of creation about which it is written “The earth brought forth etc.” this does not signify that they came forth above the ground but that they remained at the opening of the ground (i. e. just below the surface) until the sixth day (Chullin 60a).<br><br>כי לא המטיר BECAUSE GOD HAD NOT CAUSED IT TO RAIN — And what is the reason that God had not caused it to rain? כי אדם אין לעבוד את האדמה BECAUSE THERE WAS NO MAN TO TILL THE GROUND, and there was, therefore, no one to recognize the utility of rain. When Adam came (was created), however, and he realised that it was necessary for the world, he prayed for it and it fell, so that trees and verdure sprang forth.<br><br>ה' אלהים THE LORD GOD — The Lord (יהוה) is His Name, whereas אלהים signifies that He is Ruler and Judge over all. This, too, is its meaning, according to the plain sense, wherever it occurs: The Lord who is God (Ruler and Judge). "}, {"ch": 2, "v": 6, "aliyah": 2, "heb": "וְאֵ֖ד יַֽעֲלֶ֣ה מִן־הָאָ֑רֶץ וְהִשְׁקָ֖ה אֶֽת־כׇּל־פְּנֵ֥י הָֽאֲדָמָֽה׃", "onk": "וַעֲנָנָא הֲוָה סָלֵיק מִן אַרְעָא וְאַשְׁקֵי יָת כָּל אַפֵּי אַדְמְתָא:", "onk_en": "A mist rose up from the earth, and it watered the entire surface of the soil.", "pj": "וַעֲנַן יְקָרָא הֲוָה נָחִית מִתְּחוֹת כּוּרְסֵי יְקָרָא וּמְלֵי מַיָא מִן אוֹקְיָינוֹס וְהָדָר סַלִיק מִן אַרְעָא וּמָחִית מִטְרָא וּמַשְׁקֵי יַת כָּל אַפֵּי אַדְמָתָא", "pj_en": "But a cloud of glory descended from the throne of glory, and was filled with waters from the ocean, and afterward went up from the earth, and gave rain to come down and water all the face of the ground.", "tj": "", "tj_en": "", "rashi": "<b>ואד יעלה.<\/b> לְעִנְיַן בְּרִיאָתוֹ שֶׁל אָדָם, הֶעֱלָה הַתְּהוֹם וְהִשְׁקָה עֲנָנִים לִשְׁרוֹת הֶעָפָר וְנִבְרָא אָדָם, כְּגַבָּל זֶה, שֶׁנּוֹתֵן מַיִם וְאַחַ\"כַּ לָשׁ אֶת הָעִסָּה, אַף כָּאן, וְהִשְׁקָה, וְאַחַ\"כַּ וַיִּיצֶר:", "rashi_en": "ואד יעלה AND A MIST WENT UP — This has reference to the creation of Adam: viz., He caused the deep to rise and filled the clouds with water to moisten the dust, and man was created. It is like a kneader of bread who first pours in water and afterwards kneads the dough — similarly here: He first watered the ground and afterwards He formed man (Genesis Rabbah 14:1)."}, {"ch": 2, "v": 7, "aliyah": 2, "heb": "וַיִּ֩יצֶר֩ יְהֹוָ֨ה אֱלֹהִ֜ים אֶת־הָֽאָדָ֗ם עָפָר֙ מִן־הָ֣אֲדָמָ֔ה וַיִּפַּ֥ח בְּאַפָּ֖יו נִשְׁמַ֣ת חַיִּ֑ים וַיְהִ֥י הָֽאָדָ֖ם לְנֶ֥פֶשׁ חַיָּֽה׃", "onk": "וּבְרָא יְיָ אֱלֹהִים יָת אָדָם עַפְרָא מִן אַדְמְתָא וּנְפַח בְּאַפּוֹהִי נִשְׁמְתָא דְחַיֵּי וַהֲוַת בְּאָדָם לְרוּחַ <b>מְמַלְלָא<\/b>:", "onk_en": "Adonoy Elohim then formed the man, dust from the ground, and He blew into his nostrils the breath of life. And so man became a living [<b>speaking<\/b>] soul.", "pj": "וּבְרָא יְיָ אֱלהִים יַת אָדָם בִּתְּרֵין יִצְרִין וּדְבַר עַפְרָא מֵאֲתַר בֵּית מַקְדְשָׁא וּמֵאַרְבַּעַת רוּחֵי עַלְמָא וּפַתָכָא מִכָּל מֵימֵי עַלְמָא וּבַרְיֵהּ סוּמַק שְׁחִים וְחֵיוַר וְנָפַח בִּנְחוֹרוֹהִי נִשְׁמָתָא דְחַיֵי וַהֲוָת נִשְׁמָתָא בְּגוּפָא דְאָדָם לְרוּחַ מְמַלְלָא לְאַנְהָרוּת עַיְינִין וּלְמִצְתּוֹת אוּדְנִין", "pj_en": "And the Lord God created man in two formations; and took dust from the place of the house of the sanctuary, and from the four winds of the world, and mixed from all the waters of the world, and created him red, black, and white; and breathed into his nostrils the inspiration of life, and there was in the body of Adam the inspiration of a speaking spirit, unto the illumination of the eyes and the hearing of the ears.", "tj": "וַהֲוָה אָדָם נְפַשׁ דְחַיָה:", "tj_en": "And Adam became a soul of life.", "rashi": "<b>וייצר.<\/b> שְׁתֵּי יְצִירוֹת, יְצִירָה לָעוֹלָם הַזֶּה וִיצִירָה לִתְחִיַּת הַמֵּתִים, אֲבָל בַּבְּהֵמָה שֶׁאֵינָהּ עוֹמֶדֶת לַדִּין לֹא נִכְתַּב בִּיצִירָתָהּ שְׁנֵי יוֹדִי\"ן:<br><br><b>עפר מן האדמה.<\/b> צָבַר עֲפְרוֹ מִכָּל הָאֲדָמָה מֵאַרְבַּע רוּחוֹת, שֶׁכָּל מָקוֹם שֶׁיָּמוּת שָׁם תְּהֵא קוֹלַטְתּוֹ לִקְבוּרָה. דָּ\"אַ נָטַל עֲפָרוֹ מִמָּקוֹם שֶׁנֶּאֱמַר בּוֹ מִזְבַּח אֲדָמָה תַּעֲשֶׂה לִּי (שמות כ'), הַלְוַאי תִּהְיֶה לוֹ כַפָּרָה וְיוּכַל לַעֲמֹד:<br><br><b>ויפח באפיו.<\/b> עֲשָׂאוֹ מִן הַתַּחְתּוֹנִים וּמִן הָעֶלְיוֹנִים, גוּף מִן הַתַּחְתּוֹנִים וּנְשָׁמָה מִן הָעֶלְיוֹנִים, לְפִי שֶׁבְּיוֹם רִאשׁוֹן נִבְרְאוּ שָׁמַיִם וָאָרֶץ, בַּשֵּׁנִי בָּרָא רָקִיעַ לָעֶלְיוֹנִים, בַּשְּׁלִישִׁי תֵּרָאֶה הַיַּבָּשָׁה לַתַּחְתּוֹנִים, בָּרְבִיעִי בָּרָא מְאוֹרוֹת לָעֶלְיוֹנִים, בַּחֲמִישִׁי יִשְׁרְצוּ הַמַּיִם לַתַּחְתּוֹנִים, הֻזְקַק בַּשִּׁשִּׁי לִבְראוֹת בּוֹ בָעֶלְיוֹנִים וּבַתַּחְתּוֹנִים, וְאִם לָאו יֵשׁ קִנְאָה בְמַעֲשֵׂה בְרֵאשִׁית, שֶׁיִּהְיוּ אֵלּוּ רַבִּים עַל אֵלּוּ בִּבְרִיאַת יוֹם אֶחָד:<br><br><b>לנפש חיה.<\/b> אַף בְּהֵמָה וְחַיָּה נִקְרְאוּ נֶפֶשׁ חַיָּה, אַךְ זוֹ שֶׁל אָדָם חַיָּה שֶׁבְּכֻלָּן, שֶׁנִתּוֹסֵף בּוֹ דֵּעָה וְדִבּוּר:", "rashi_en": "וייצר AND GOD FORMED — Here the letter yod is written twice to intimate that there were two formations — a formation of man for this world, and a formation of man for resurrection; in the case of animals, however, which will not stand after death for judgment before God the word referring to their formation— ויצר —(Genesis 2:19) is not written with two yods (Midrash Tanchuma, Tazria 1).<br><br>עפר מן האדמה DUST OF THE EARTH — He gathered his dust (i. e. that from which he was made) from the entire earth — from its four corners — in order that wherever he might die, it should receive him for burial (Midrash Tanchuma, Pekudei 3). Another explanation: He took his dust from that spot on which the Holy Temple with the altar of atonement was in later times to be built of which it is said, (Exodus 20:24) “An altar of earth thou shalt make for Me” saying, “Would that this sacred earth may be an expiation for him so that he may be able to endure” (Genesis Rabbah 14:8).<br><br>ויפח באפיו AND BREATHED INTO HIS NOSTRILS — He made him of both, of earthly and of heavenly matter: the body of the earthly, and the soul of the heavenly. For on the first day were created heaven and earth, on the second, He created the firmament for the heavenly beings, on the third He said, “Let the dry land appear” — for the earthly beings, on the fourth He created the lights for the heavenly beings, on the fifth He said, “Let the waters swarm…” — for the earthly beings. Consequently on the sixth there had to be created a being composed of both, of heavenly and of earthly matter, for otherwise there would have been envy (lack of harmony) among the works of Creation, in that there would have been devoted to one class of them one day more of the Creation than to the others (Genesis Rabbah 12:8).<br><br>לנפש חיה A LIVING SOUL — Also cattle and beasts are called נפש חיה (1:20, 22, 24), but the נפש of man is the most highly developed of all of them, because to him was granted understanding and speech."}, {"ch": 2, "v": 8, "aliyah": 2, "heb": "וַיִּטַּ֞ע יְהֹוָ֧ה אֱלֹהִ֛ים גַּן־בְּעֵ֖דֶן מִקֶּ֑דֶם וַיָּ֣שֶׂם שָׁ֔ם אֶת־הָֽאָדָ֖ם אֲשֶׁ֥ר יָצָֽר׃", "onk": "וּנְצִיב יְיָ אֱלֹהִים גִּינְתָא בְעֵדֶן מִלְּקַדְמִין וְאַשְׁוֵי תַמָּן יָת אָדָם דִּי בְרָא:", "onk_en": "Adonoy Elohim planted a garden in Eden, to the east, and there He placed the man He had formed.", "pj": "וְאִתְנְצִיב בְּמֵימְרָא דַיְיָ אֱלהִים גִינוּנִיתָא מֵעֵדֶן לְצַדִיקַיָא קֳדָם בְּרִיַית עוֹלָם וְאַשְׁרֵי תַּמָן יַת אָדָם כַּד בַּרְיֵיהּ", "pj_en": "And a garden from the Eden of the just was planted by the Word of the Lord God before the creation of the world, and He made there to dwell the man when He had created him.", "tj": "", "tj_en": "", "rashi": "<b>מקדם.<\/b> בְּמִזְרָחוֹ שֶׁל עֵדֶן נָטַע אֶת הַגָּן. וְאִם תֹּאמַר, הֲרֵי כְבָר כָּתַב וַיִּבְרְָא אֶת הָאָדָם וְגוֹ', רָאִיתִי בִּבְרַיְתָא שֶׁל ר\"א בְּנוֹ שֶׁל רַ' יוֹסֵי הַגְּלִילִי מל\"ב מִדּוֹת שֶׁהַתּוֹרָה נִדְרֶשֶׁת, וְזוֹ אַחַת מֵהֶן, כְּלָל שֶׁלְּאַחֲרָיו מַעֲשֶׂה הוּא פְרָטוֹ שֶׁל רִאשׁוֹן, וַיִּבְרָא אֶת הָאָדָם זֶהוּ כְּלָל, סָתַם בְּרִיאָתוֹ מֵהֵיכָן וְסָתַם מַעֲשָׂיו, חָזַר וּפֵרֵשׁ וַיִּיצֶר ה' אֱלֹהִים וְגוֹ', וַיַּצְמַח לוֹ גַּן עֵדֶן וַיַּנִּיחֵהוּ בְּגַן עֵדֶן וַיַּפֵּל עָלָיו תַּרְדֵּמָה, הַשּׁוֹמֵעַ סָבוּר שֶׁהוּא מַעֲשֶׂה אַחֵר, וְאֵינוֹ אֶלָּא פְרָטוֹ שֶׁל רִאשׁוֹן; וְכֵן אֵצֶל הַבְּהֵמָה חָזַר וְכָתַב וַיִּצֶר ה' וגו' מִן הָאֲדָמָה כָּל חַיַּת הַשָּׂדֶה, כְּדֵי לְפָרֵשׁ וַיָּבֵא אֶל הָאָדָם לִקְרוֹת שֵׁם וּלְלַמֵּד עַל הָעוֹפוֹת שֶׁנִּבְרְאוּ מִן הָרְקָק:", "rashi_en": "מקדם EASTWARD — In the east of Eden He planted the garden. Should you say, however, it is already written, (1:27) “and He created the man etc.”, then I say that I have seen the Baraitha of R. Eliezer the son of R. José the Galilean, dealing with the thirty two rules of interpretation according to which the Torah (Agada) can be interpreted, and the following is one of them: when a general statement of an action is followed by a detailed account of it, the latter is a particularisation of the former: — “And He created the man” is a general statement, but it does not explicitly state whence he was created and what God did unto him. Now it repeats it and explains these things: “And the Lord God formed man”, “and He made to grow for him the garden of Eden”, and He caused a deep sleep to fall upon him.” He who hears this might think that it is a different account entirely, whereas it is nothing else but the details of the former general statement. Similarly with reference to the cattle the creation of which has been mentioned above (1:27). it resumes and writes, (2:19) “and out of the ground the Lord [God] formed every beast of the field etc.”, for the purpose of explaining “and He brought them unto the man to give them names”, and also to state that the fowls were created from the swamps. "}, {"ch": 2, "v": 9, "aliyah": 2, "heb": "וַיַּצְמַ֞ח יְהֹוָ֤ה אֱלֹהִים֙ מִן־הָ֣אֲדָמָ֔ה כׇּל־עֵ֛ץ נֶחְמָ֥ד לְמַרְאֶ֖ה וְט֣וֹב לְמַאֲכָ֑ל וְעֵ֤ץ הַֽחַיִּים֙ בְּת֣וֹךְ הַגָּ֔ן וְעֵ֕ץ הַדַּ֖עַת ט֥וֹב וָרָֽע׃", "onk": "וְאַצְמַח יְיָ אֱלֹהִים מִן אַרְעָא כָּל אִילַן דִּמְרַגֵּג לְמֶחֱזֵי וְטַב לְמֵיכַל וְאִילַן חַיָּא בִּמְצִיעוּת גִּינְתָא וְאִילַן <b>דְּאָכְלִין פֵּירוֹהִי<\/b> חַכִּימִין בֵּין טַב לְבִישׁ:", "onk_en": "Adonoy Elohim made grow out of the soil every tree that is pleasant to look at, and good for [producing] food; the Tree of Life in the middle of the Garden, and the Tree (of) [<b>from which the fruit if eaten gives<\/b>] Knowledge [of what is] good and evil.", "pj": "וְרַבֵּי יְיָ אֱלהִים מִן אַדְמָתָא כָּל אִילַן דִמְרַגֵג לְמֵיחֲמֵי וְטַב לְמֵיכָל וְאִילָן חַיָיא בִּמְצִיעוּת גִינוּנִיתָא רוּמֵיהּ מַהֲלֵךְ חֲמֵש מְאָה שְׁנִין וְאִילַן דְאָכְלֵי פֵירוֹהִי יַדְעִין בֵּין טַב לְבִישׁ", "pj_en": "And the Lord God made to grow from the ground every tree that was desirable to behold and good to eat, and the tree of life in the midst of the garden, whose height was a journey of five hundred years, and the tree of whose fruit they who ate would distinguish between good and evil.", "tj": "וְאִילָן דַעֲתָּא כָּל מָן דְאָכַל מִינֵיהּ מַפְרִשׁ בֵּין טַב לְבִישׁ:", "tj_en": "And the tree of knowledge, of which any one who ate would distinguish between good and evil.", "rashi": "<b>ויצמח.<\/b> לְעִנְיַן הַגַּן הַכָּתוּב מְדַבֵּר:<br><br><b>בתוך הגן.<\/b> בָּאֶמְצַע:", "rashi_en": "ויצמח AND HE CAUSED TO GROW — The verse speaks here only with reference to the garden (Genesis Rabbah 13:1)<br><br>בתוך הגן IN THE MIDST OF THE GARDEN — means in the very centre of the garden. "}, {"ch": 2, "v": 10, "aliyah": 2, "heb": "וְנָהָר֙ יֹצֵ֣א מֵעֵ֔דֶן לְהַשְׁק֖וֹת אֶת־הַגָּ֑ן וּמִשָּׁם֙ יִפָּרֵ֔ד וְהָיָ֖ה לְאַרְבָּעָ֥ה רָאשִֽׁים׃", "onk": "וְנַהֲרָא הֲוָה נָפִיק מֵעֵדֶן לְאַשְׁקָאָה יָת גִּינְתָא וּמִתַּמָּן יִתְפָּרִשׁ וַהֲוֵי לְאַרְבְּעָה רֵישֵׁי נַהֲרִין:", "onk_en": "A river went out of Eden to water the Garden, and from there it separated and became four headwaters.", "pj": "וְנַהֲרָא נָפִיק מֵעֵדֶן לְאַשְׁקָאָה יַת גִינוּנִיתָא וּמִתַּמָן מִתְפְּרֵשׁ וַהֲוָה לְאַרְבַּעַת רֵישֵׁיהּ נַהֲרִין", "pj_en": "And a river went forth from Eden, to water the garden, and from thence was separated, and became four heads of rivers (or four chief rivers).", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 11, "aliyah": 2, "heb": "שֵׁ֥ם הָֽאֶחָ֖ד פִּישׁ֑וֹן ה֣וּא הַסֹּבֵ֗ב אֵ֚ת כׇּל־אֶ֣רֶץ הַֽחֲוִילָ֔ה אֲשֶׁר־שָׁ֖ם הַזָּהָֽב׃", "onk": "שׁוּם חָד פִּישׁוֹן הוּא מַקִּיף יָת כָּל אֲרַע דַּחֲוִילָה דִּי תַמָּן דַּהֲבָא:", "onk_en": "The name of the first is Pishon which surrounds all the land of Chavilah, where there is gold.", "pj": "שׁוּם חַד פִּישׁוֹן הוּא דְמַקִיף יַת כָּל אֲרַע הִינְדִקֵי דְתַמָן דַהֲבָא", "pj_en": "The name of the first is Phishon; that is it which compasseth all the land of Hindiki, where there is gold.", "tj": "", "tj_en": "", "rashi": "<b>פישון.<\/b> הוּא נִילוּס נְהַר מִצְרַיִם, וְעַל שֵׁם שֶׁמֵּימָיו מִתְבָּרְכִין וְעוֹלִין וּמַשְׁקִין אֶת הָאָרֶץ נִקְרָא פִישׁוֹן כְּמוֹ וּפָשׁוּ פָּרָשָׁיו (חבקוק א') דָּ\"אַ פִּישׁוֹן, שֶׁהוּא מְגַדֵּל פִּשְׁתָּן, שֶׁנֶּאֱמַר עַל מִצְרַיִם (ישעיהו י\"ט) וּבֹשׁוּ עֹבְדֵי פִשְׁתִּים:", "rashi_en": "פישון PISHON — This is the Nile, the River of Egypt. Because its waters grow plentiful and rise and water the land, it is called Pishon, the name being of the same root as the verb in (Habakkuk 1:8) ופשו פרשיו “and their horsemen increased”; another interpretation of the name Pishon is: it is so called because it grows flax (פשתן) (Genesis Rabbah 16:2) for it is said with reference to Egypt (Isaiah 19:9) “Moreover they that work in combed flax, shall be ashamed.” "}, {"ch": 2, "v": 12, "aliyah": 2, "heb": "וּֽזְהַ֛ב הָאָ֥רֶץ הַהִ֖וא ט֑וֹב שָׁ֥ם הַבְּדֹ֖לַח וְאֶ֥בֶן הַשֹּֽׁהַם׃", "onk": "וְדַהֲבָא דְאַרְעָא הַהִיא טָב תַּמָן בְּדָלְחָא וְאַבְנֵי בוּרְלָא:", "onk_en": "The gold of that land is good. Also found there is bdellium and onyx stones.", "pj": "וְדַהֲבָא דְאַרְעָא הַהוּא בָּחִיר תַּמָן בִּידִילְחָא וְאַבְנִין טָבִין דְבוּרְלִין", "pj_en": "And the gold of that land is choice. There is the bedilcha, and the precious stones of byrils.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 13, "aliyah": 2, "heb": "וְשֵֽׁם־הַנָּהָ֥ר הַשֵּׁנִ֖י גִּיח֑וֹן ה֣וּא הַסּוֹבֵ֔ב אֵ֖ת כׇּל־אֶ֥רֶץ כּֽוּשׁ׃", "onk": "וְשׁוּם נַהֲרָא תִנְיָנָא גִּיחוֹן הוּא מַקִּיף יָת כָּל אַרְעָא דְכוּשׁ:", "onk_en": "The name of the second river is Gichon. It surrounds all the land of Kush.", "pj": "וְשׁוּם נַהֲרָא תִּנְיָינָא גִיחוֹן הוּא דְמַקִיף יַת כָּל אַרְעָא דְכוּשׁ", "pj_en": "And the name of the second river is Gichon; that is it which encompasseth all the land of Koosh.", "tj": "", "tj_en": "", "rashi": "<b>גיחון.<\/b> שֶׁהָיָה הוֹלֵךְ וְהוֹמֶה, וְהֶמְיָתוֹ גְדוֹלָה מְאֹד, כְּמוֹ כִי יִגַּח (שמות כ\"א), שֶׁמְּנַגֵּחַ וְהוֹלֵךְ וְהוֹמֶה:", "rashi_en": "גיחון GICHON — It is so called because it flows on with a roar, its roaring being very noisy,—similar in meaning to (Exodus 21:28) וכי יגח “And if an [ox] gore” — for when it gores it rushes on roaring (Berakhot 59b.). "}, {"ch": 2, "v": 14, "aliyah": 2, "heb": "וְשֵׁ֨ם הַנָּהָ֤ר הַשְּׁלִישִׁי֙ חִדֶּ֔קֶל ה֥וּא הַֽהֹלֵ֖ךְ קִדְמַ֣ת אַשּׁ֑וּר וְהַנָּהָ֥ר הָֽרְבִיעִ֖י ה֥וּא פְרָֽת׃", "onk": "וְשׁוּם נַהֲרָא תְּלִיתָאָה <b>דִּיגְלַת<\/b> הוּא מְהַלֵּךְ לְמַדִּינְחָא דְאַתּוּר וְנַהֲרָא רְבִיעָאָה הוּא פְרָת:", "onk_en": "The name of the third river is Chidekel[<b>Diglas<\/b>], which flows to the east of Ashur. The fourth river is P’ras.", "pj": "וְשׁוּם נַהֲרָא תְּלִיתָאָה דִיגְלַת הוּא דִמְהֲלִיךְ לְמִידְנַח אַתּוּר וְנַהֲרָא רְבִיעָאָה הוּא פְּרָת", "pj_en": "And the name of the third river is Diglath; that is it which goeth to the east of Athoor. And the fourth river is Pherath.", "tj": "", "tj_en": "", "rashi": "<b>חדקל.<\/b> שֶׁמֵּימָיו חַדִּין וְקַלִּין:<br><br><b>פרת.<\/b> שֶׁמֵּימָיו פָּרִין וְרָבִין וְמַבְרִין אֶת הָאָדָם: <b>כוש ואשור.<\/b> עֲדַיִן לֹא הָיוּ, וְכָתַב הַמִּקְרָא עַל שֵׁם הֶעָתִיד:<br><br><b>קדמת אשור.<\/b> לְמִזְרָחָהּ שֶׁל אַשּׁוּר:<br><br><b>הוא פרת.<\/b> הֶחָשׁוּב עַל כֻּלָּם, הַנִּזְכָּר עַל שֵׁם א\"י:", "rashi_en": "חדקל TIGRIS — It is called חדקל because its waters are pungent in taste (חד) and light in weight (קל) (Berakhot 59b). <br><br>פרת EUPHRATES — It is called פרת because its waters grow (פרה) and increase and make men healthy (Berakhot 59b). כוש ואשור CUSH AND ASHUR did not then exist as countries, but Scripture writes with reference to the names which those districts would bear in the future (Ketubot 10b; Genesis Rabbah 16).<br><br>קדמת אשור means AT THE EAST OF ASHUR.<br><br>הוא פרת IS THE EUPHRATES — the most important of all, being mentioned in connection with the Land of Israel (Genesis Rabbah 16:3). <br><br>Este é Prat. O mais importante de todos, mencionado em relação à terra de Yisrael:"}, {"ch": 2, "v": 15, "aliyah": 2, "heb": "וַיִּקַּ֛ח יְהֹוָ֥ה אֱלֹהִ֖ים אֶת־הָֽאָדָ֑ם וַיַּנִּחֵ֣הוּ בְגַן־עֵ֔דֶן לְעׇבְדָ֖הּ וּלְשׇׁמְרָֽהּ׃", "onk": "וּדְבַר יְיָ אֱלֹהִים יָת אָדָם וְאַשְׁרֵיהּ בְּגִינְתָא דְעֵדֶן לְמִפְלְחַהּ וּלְמִטְרַהּ:", "onk_en": "Adonoy Elohim took the man, and put him in the Garden of Eden, to work it and to preserve it.", "pj": "וּדְבַר יְיָ אֱלהִים יַת אָדָם מִן טַוָר פּוּלְחָנָא אָתַר דְאִתְבַּרְיָא מִתַּמָן וְאַשְׁרֵהּ בְּגִינוּנִיתָא דְעֵדֶן לְמֶהֱוֵי פְּלַח בְּאוֹרַיְתָא וּלְמִנְטַר פִּקוּדָהָא", "pj_en": "And the Lord God took the man from the mountain of worship, where he had been created, and made him dwell in the garden of Eden, to do service in the law, and to keep its commandments.", "tj": "וּנְסִיב יְיָ אֱלהִים יַת אָדָם וְאַשְׁרֵי בְּגִנְתָא דְעֵדֶן וְאַצְנַע יָתֵיהּ לְמֶהֱוֵי פְּלַח בְּאוֹרַיְיתָא וּלְמִטוֹר:", "tj_en": "And the Lord God took the man, and made him dwell in the Garden of Eden; and set him to do service in the law, and to keep it.", "rashi": "<b>ויקח.<\/b> לְקָחוֹ בִדְבָרִים נָאִים וּפִתָּהוּ לִכָּנֵס (בראשית רבה):", "rashi_en": "ויקח AND HE TOOK — He took him with kind words and induced him to enter (Genesis Rabbah 16:5). "}, {"ch": 2, "v": 16, "aliyah": 2, "heb": "וַיְצַו֙ יְהֹוָ֣ה אֱלֹהִ֔ים עַל־הָֽאָדָ֖ם לֵאמֹ֑ר מִכֹּ֥ל עֵֽץ־הַגָּ֖ן אָכֹ֥ל תֹּאכֵֽל׃", "onk": "וּפַקִּיד יְיָ אֱלֹהִים עַל אָדָם לְמֵימָר מִכֹּל אִילַן גִּינְתָא מֵיכַל תֵּיכוּל:", "onk_en": "Adonoy Elohim commanded the man, saying, You may certainly eat from every tree in the Garden.", "pj": "וּפַקֵיד יְיָ אֱלהִים עַל אָדָם לְמֵימָר מִכּל אִילַן גִינוּנִיתָא מֵיכַל תֵּיכוּל", "pj_en": "And the Lord God commanded Adam, saying, Of every tree of the garden eating thou mayest eat.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 17, "aliyah": 2, "heb": "וּמֵעֵ֗ץ הַדַּ֙עַת֙ ט֣וֹב וָרָ֔ע לֹ֥א תֹאכַ֖ל מִמֶּ֑נּוּ כִּ֗י בְּי֛וֹם אֲכׇלְךָ֥ מִמֶּ֖נּוּ מ֥וֹת תָּמֽוּת׃", "onk": "וּמֵאִילָן <b>דְּאָכְלִין פֵּירוֹהִי חַכִּימִין<\/b> בֵּין טַב לְבִישׁ לָא תֵיכוּל מִנֵּהּ אֲרֵי בְּיוֹמָא דְתֵיכוּל מִנֵּהּ מֵימַת תְּמוּת:", "onk_en": "But from the Tree (of) [<b>from which the fruit if eaten gives<\/b>] Knowledge of what is good and evil, you shall not eat from it, for on the day you eat from it, you will certainly die.", "pj": "וּמֵאִילַן דְאָכְלִין פֵּירוֹהִי חַכְּמִין לְמִידַע בֵּין טַב לְבִישׁ לָא תֵיכוּל מִנֵיהּ אֲרֵי בְּיוֹמָא דְתֵיכוּל מִנֵיהּ תְּהֵי חַיָיב קְטוֹל", "pj_en": "But of the tree of whose fruit they who eat (become) wise to know between good and evil, thou shalt not eat: for in the day that thou eatest thou wilt be guilty of death.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 18, "aliyah": 2, "heb": "וַיֹּ֙אמֶר֙ יְהֹוָ֣ה אֱלֹהִ֔ים לֹא־ט֛וֹב הֱי֥וֹת הָֽאָדָ֖ם לְבַדּ֑וֹ אֶֽעֱשֶׂה־לּ֥וֹ עֵ֖זֶר כְּנֶגְדּֽוֹ׃", "onk": "וַאֲמַר יְיָ אֱלֹהִים לָא <b>תַקִּין<\/b> לְמֶהֱוֵי אָדָם בִּלְחוֹדוֹהִי אַעֲבֵד לֵהּ סְמַךְ לְקִבְלֵהּ:", "onk_en": "Adonoy Elohim said, It is not good [<b>fitting<\/b>] for the man to be alone. I will make a helper for him.", "pj": "וַאֲמַר יְיָ אֱלהִים לָא תַקִין דִיהֵי אָדָם דָמִיךְ בִּלְחוֹדוֹהִי אַעֲבֵיד לֵיהּ אִתָּא דִתְהֵי סְמִיךְ כְּקִבְלֵיהּ", "pj_en": "And the Lord God said, It is not right that Adam should be sleeping alone: I will make unto him a wife who may be a helper before him.", "tj": "אַעֲבֵיד לֵיהּ בַּר זוֹג כַּד נָפִיק בֵּיהּ:", "tj_en": "I will make for him a yoke-fellow, going forth with him.", "rashi": "<b>לא טוב היות וגו'.<\/b> שֶׁלֹּא יֹאמְרוּ שְׁתֵּי רָשׁוּיוֹת הֵן, הַקָּבָּ\"ה יָחִיד בָעֶלְיוֹנִים וְאֵין לוֹ זוּג, וְזֶה יָחִיד בַתַּחְתּוֹנִים וְאֵין לוֹ זוּג (בראשית רבה):<br><br><b>עזר כנגדו.<\/b> זָכָה – עֵזֶר; לֹא זָכָה – כְּנֶגְדּוֹ לְהִלָּחֵם:", "rashi_en": "'לא טוב היות וגו IT IS NOT GOOD etc. — I shall make an help meet for him in order that people may not say that there are two Deities, the Holy One, blessed be He, the only One among the celestial Beings without a mate, and this one (Adam), the only one among the terrestrial beings, without a mate (Pirkei D'Rabbi Eliezer 12).<br><br>עזר כנגדו A HELP MEET FOR HIM — (כנגדו literally, opposite, opposed to him) If he is worthy she shall be a help to him; if he is unworthy she shall be opposed to him, to fight him (Yevamot 63a)."}, {"ch": 2, "v": 19, "aliyah": 2, "heb": "וַיִּ֩צֶר֩ יְהֹוָ֨ה אֱלֹהִ֜ים מִן־הָֽאֲדָמָ֗ה כׇּל־חַיַּ֤ת הַשָּׂדֶה֙ וְאֵת֙ כׇּל־ע֣וֹף הַשָּׁמַ֔יִם וַיָּבֵא֙ אֶל־הָ֣אָדָ֔ם לִרְא֖וֹת מַה־יִּקְרָא־ל֑וֹ וְכֹל֩ אֲשֶׁ֨ר יִקְרָא־ל֧וֹ הָֽאָדָ֛ם נֶ֥פֶשׁ חַיָּ֖ה ה֥וּא שְׁמֽוֹ׃", "onk": "וּבְרָא יְיָ אֱלֹהִים מִן אַרְעָא כָּל חֵוַת בְּרָא וְיָת כָּל עוֹפָא דִּשְׁמַיָּא וְאַיְתֵהּ לְוַת אָדָם לְמֶחֱזֵי מַה יִּקְרֵי לֵהּ וְכֹל דִּי הֲוָה קָרֵי לֵהּ אָדָם נַפְשָׁא חַיְתָא הוּא שְׁמֵהּ:", "onk_en": "Adonoy Elohim formed from the ground, every beast of the field, and every bird of the heaven, and brought them to the man, to see what he would call them. Whatever the man called [each] living creature, that is its name.", "pj": "וּבְרָא יְיָ אֱלהִים מִן אַדְמְתָא כָּל חֵיוַת בְּרָא וְיַת כָּל עוֹפָא דִשְׁמַיָא וְאַיְיתֵי לְוַת אָדָם לְמֵחְמֵי מַה יְהֵי קָרֵי לֵיהּ שׁוּם וְכָל דְקָרֵי לֵיהּ אָדָם נַפְשָׁא מִן חַיְיתָא הוּא שְׁמֵיהּ", "pj_en": "And the Lord God created from the earth every beast of the field, and every fowl of the heavens, and brought them to Adam, to see by what name he would call it. And whatever Adam called the living animal, that was its name.", "tj": "", "tj_en": "", "rashi": "<b>וייצר מן האדמה.<\/b> הִיא יְצִירָה הִיא עֲשִׂיָּה הָאֲמוּרָה לְמַעְלָה וַיַּעַשׂ אֱלֹהִים אֶת חַיַּת הָאָרֶץ וְגוֹ', אֶלָּא בָא וּפֵרֵשׁ שֶׁהָעוֹפוֹת נִבְרְאוּ מִן הָרְקָק, לְפִי שֶׁאָמַר לְמַעְלָה מִן הַמַּיִּם נִבְרְאוּ וְכָאן אָמַר מִן הָאָרֶץ נִבְרְאוּ (חולין כ\"ז), וְעוֹד לִמֶּדְךָ כָּאן שֶׁבִּשְׁעַת יְצִירָתָן מִיָּד בּוֹ בַיּוֹם הֱבִיאָם אֶל הָאָדָם לִקְרוֹת לָהֶם שֵׁם. וּבְדִבְרֵי אַגָּדָה יְצִירָה זוֹ לְשׁוֹן רִדּוּי וְכִבּוּשׁ, כְּמוֹ כִּי תָצוּר אֶל עִיר (דברים כ\"ד), שֶׁכְּבָשָׁן תַּחַת יָדוֹ שֶׁל אָדָם (בראשית רבה):<br><br><b>וכל אשר יקרא לו האדם נפש חיה וגו'.<\/b> סָרְסֵהוּ וּפָרְשֵׁהוּ, כֹּל נֶפֶשׁ חַיָּה אֲשֶׁר יִקְרָא לוֹ הָאָדָם שֵׁם, הוּא שְׁמוֹ לְעוֹלָם:", "rashi_en": "ויצר מן האדמה NOW OUT OF THE GROUND THE ETERNAL GOD HAD FORMED — The formation spoken of here is the creation mentioned above (1:25) “And God made the beast of the earth etc.” and this statement comes (is repeated) here to point out that the fowls were created from the swamps; for above it is said that they were created from the waters and here it states that they were created from the earth. Furthermore it teaches you here that when they were created, immediately — on the very same day — He brought them to Adam to give them names (Chullin 27b); and in the statement of the Agada (Genesis Rabbah 17:4) we are told that this expression יצירה means domination and subjugation, like (Deuteronomy 20:19) כי תצור אל עיר “when thou shalt besiege a city\", for He subjugated them under the power of Adam.<br><br>וכל אשר יקרא לו האדם נפש חיה וגו — Invert it (the phrases of the sentence) and then explain it thus: every living creature to which Adam should give a name — that should remain its name forever."}, {"ch": 2, "v": 20, "aliyah": 3, "heb": "וַיִּקְרָ֨א הָֽאָדָ֜ם שֵׁמ֗וֹת לְכׇל־הַבְּהֵמָה֙ וּלְע֣וֹף הַשָּׁמַ֔יִם וּלְכֹ֖ל חַיַּ֣ת הַשָּׂדֶ֑ה וּלְאָדָ֕ם לֹֽא־מָצָ֥א עֵ֖זֶר כְּנֶגְדּֽוֹ׃", "onk": "וּקְרָא אָדָם שְׁמָהָן לְכָל בְּעִירָא וּלְעוֹפָא דִּשְׁמַיָּא וּלְכָל חֵוַת בְּרָא וּלְאָדָם לָא אַשְׁכַּח סָמֵךְ לְקִבְלֵהּ:", "onk_en": "The man gave names to every animal, to the birds of the heaven, and to every beast of the field, but the man did not find a helper for himself.", "pj": "וּקְרָא אָדָם שְׁמָהָן לְכָל בְּעִירָא וּלְכָל עוֹפָא דִשְמַיָא וּלְכָל חֵיוַת בְּרָא וּלְאָדָם לָא אַשְׁכַּח עַד הַשְׁתָּא סְמִיךְ כְּקִבְלֵיהּ", "pj_en": "And Adam called the names of all cattle, and all fowl of the heavens, and all beasts of the field. But for Adam was not found as yet a helper before him.", "tj": "וּלְאָדָם לָא אַשְׁכַּח בַּר זוֹג כַּד נָפִיק בֵּיהּ:", "tj_en": "And for Adam was not found a yoke-fellow going forth with him.", "rashi": "<b>ולאדם לא מצא עזר. ויפל ה' אלהים תרדמה.<\/b> כְּשֶׁהֱבִיאָן הֱבִיאָן לְפָנָיו כָּל מִין וָמִין זָכָר וּנְקֵבָה, אָמַר לְכֻלָּם יֵשׁ בֶּן זוּג וְלִי אֵין בֶּן זוּג, מִיָּד וַיַּפֵּל (בראשית רבה):", "rashi_en": "ולאדם לא מצא עזר… ויפל ה' אלהים תרדמה FOR THE MAN HE HAD NOT FOUND A HELP MEET FOR HIM … AND THE ETERNAL GOD CAUSED AN OVERPOWERING SLEEP TO FALL — When He brought them, He brought them before him male and female of each and every kind. Thereupon he said: all these have a mate, but I have no mate! Immediately He caused to fall [an overpowering sleep upon him] (Genesis Rabbah 17:4)."}, {"ch": 2, "v": 21, "aliyah": 3, "heb": "וַיַּפֵּל֩ יְהֹוָ֨ה אֱלֹהִ֧ים&thinsp;<small>׀<\/small>&thinsp;תַּרְדֵּמָ֛ה עַל־הָאָדָ֖ם וַיִּישָׁ֑ן וַיִּקַּ֗ח אַחַת֙ מִצַּלְעֹתָ֔יו וַיִּסְגֹּ֥ר בָּשָׂ֖ר תַּחְתֶּֽנָּה׃", "onk": "וּרְמָא יְיָ אֱלֹהִים שִׁינְתָא עַל אָדָם וּדְמֵךְ וּנְסִיב חֲדָא מֵעִלְעוֹהִי <b>וּמְלֵי<\/b> בִשְׂרָא תְּחוֹתַהּ:", "onk_en": "Adonoy Elohim caused unconsciousness to fall upon the man and he slept. He took one of his ribs and closed over [<b>filled<\/b>] flesh in its place.", "pj": "וּרְמָא יְיָ אֱלֹהִים שִׁינְתָא עַמִיקְתָּא עֲלוֹי אָדָם וְדָמַךְ וּנְסִיב חֲדָא מֵעִלְעוֹהִי הוּא עִלָעָה תְּלִיסְרִית דְמִן סְטַר יְמִינָא וְאָחַד בְּבִשְרָא", "pj_en": "And the Lord God threw a deep slumber upon Adam, and he slept. And He took one of his ribs, it was the thirteenth rib of the right side, and closed it up with flesh.", "tj": "", "tj_en": "", "rashi": "<b>מצלעותיו.<\/b> מִסְּטָרָיו, כְּמוֹ וּלְצֶלַע הַמִּשְׁכָּן (שמות כ\"ו), זֶהוּ שֶׁאָמְרוּ שְׁנֵי פַרְצוּפִים נִבְרְאוּ (עירובין י\"ז):<br><br><b>ויסגור.<\/b> מְקוֹם הַחֲתָךְ:<br><br><b>ויישן ויקח.<\/b> שֶׁלֹּא יִרְאֶה חֲתִיכַת הַבָּשָׂר שֶׁמִּמֶּנוּ נִבְרֵאת וְתִתְבַּזֶּה עָלָיו:", "rashi_en": "מצלעותיו OF HIS RIBS — The word means of his sides, similar to (Exodus 26:20) ולצלע המשכן “and for the second side of the tabernacle”; this has a bearing upon what they (the Sages) say, (Eruvin 18a): They were created with two faces (sides).<br><br>ויסגור AND HE CLOSED UP the place where it was cut (Berakhot 61b).<br><br>ויישן ויקח AND HE SLEPT AND then HE TOOK in order that he should not see the piece of flesh out of which she was created, for she might be despised by him (Sanhedrin 39a). "}, {"ch": 2, "v": 22, "aliyah": 3, "heb": "וַיִּ֩בֶן֩ יְהֹוָ֨ה אֱלֹהִ֧ים&thinsp;<small>׀<\/small>&thinsp;אֶֽת־הַצֵּלָ֛ע אֲשֶׁר־לָקַ֥ח מִן־הָֽאָדָ֖ם לְאִשָּׁ֑ה וַיְבִאֶ֖הָ אֶל־הָֽאָדָֽם׃", "onk": "וּבְנָא יְיָ אֱלֹהִים יָת עִלְעָא דִּנְסִיב מִן אָדָם לְאִתְּתָא וְאַיְתַהּ לְוַת אָדָם:", "onk_en": "Adonoy Elohim built the rib that He took from the man into a woman, and He brought her to the man.", "pj": "וּבְנָא יְיָ אֱלֹהִים יַת עִלָאָה דְנָסַב מִן אָדָם לְאִיתְּתָא וְאַתְיָהּ לְוַת אָדָם", "pj_en": "And the Lord God builded the rib which he had taken from Adam into a woman; and He brought her to Adam.", "tj": "", "tj_en": "", "rashi": "<b>ויבן.<\/b> כְּבִִנְיָן, רְחָבָה מִלְּמַטָּה וּקְצָרָה מִלְּמַעְלָה לְקַבֵּל הַוָּלָד כְּאוֹצָר שֶׁל חִטִּים, שֶׁהוּא רָחָב מִלְּמַטָה וְקָצָר מִלְּמַעְלָה שֶׁלֹּא יַכְבִּיד מַשָּׂאוֹ עַל קִירוֹתָיו:<br><br><b>ויבן את הצלע לאשה.<\/b> לִהְיוֹת אִשָּׁה, כְּמוֹ וַיַּעַשׂ אוֹתוֹ גִדְעוֹן לְאֵפוֹד (שופטים ח'), לִהְיוֹת אֵפוֹד:", "rashi_en": "ויבן AND HE FORMED (literally, He built) — as a structure, wide below and narrower above for bearing the child, just as a wheat-store is wide below and narrower above so that its weight should not strain the walls (Berakhot 61a).<br><br>ויבן את הצלע לאשה AND HE MADE THE RIB INTO A WOMAN — לאשה means that is should become a woman, like (Judges 8:21) “and Gideon made it לאפוד ” i. e., that it should become an ephod."}, {"ch": 2, "v": 23, "aliyah": 3, "heb": "וַיֹּ֘אמֶר֮ הָֽאָדָם֒ זֹ֣את הַפַּ֗עַם עֶ֚צֶם מֵֽעֲצָמַ֔י וּבָשָׂ֖ר מִבְּשָׂרִ֑י לְזֹאת֙ יִקָּרֵ֣א אִשָּׁ֔ה כִּ֥י מֵאִ֖ישׁ לֻֽקְחָה־זֹּֽאת׃", "onk": "וַאֲמַר הָאָדָם הֲדָא זִמְנָא גַּרְמָא מִגַּרְמַי וּבִסְרָא מִבִּסְרִי לְדָא יִתְקְרֵי אִתְּתָא אֲרֵי <b>מִבַּעְלָא<\/b> נְסִיבָא דָא:", "onk_en": "The man said: This at last is bone of my bones and flesh of my flesh. This shall be called Woman, for from Man [<b>husband<\/b>] was she taken.", "pj": "וַאֲמַר אָדָם הֲדָא זִמְנָא וְלָא תּוּב תִּתְבְּרִי אִתְּתָא מִן גְבַר הֵיכְמָא דְאִתְבְרִיאַת דָא מִנִי גַרְמָא מִגְרָמַיי וּבִשְרָא מִבִּשְרִי לְדָא חָמֵי לְמִיקְרָא אִתָּא אֲרוּם מִגְבַר אִיתְנְסִיבַת דָא", "pj_en": "And Adam said, This time, and not again, is woman created from man. Thus, because she is created from me, (she is) bone of my bone, and flesh of my flesh. This it is fit to call Woman, because from man she was taken.", "tj": "", "tj_en": "", "rashi": "<b>זאת הפעם.<\/b> מְלַמֵּד שֶׁבָּא אָדָם עַל כָּל בְּהֵמָה וְחַיָּה, וְלֹא נִתְקָרְרָה דַעְתּוֹ בָּהֶם (יבמות ס\"ג):<br><br><b>לזאת יקרא אשה כי מאיש וגו'.<\/b> לָשׁוֹן נוֹפֵל עַל לָשׁוֹן מִכָּאן שֶׁנִּבְרָא הָעוֹלָם בִּלְשׁוֹן הַקֹּדֶשׁ (בראשית רבה):", "rashi_en": "זאת הפעם THIS NOW — This teaches that Adam endeavoured to find a companion among all cattle and beasts, but found no satisfaction except in Eve (Yevamot 63a).<br><br>לזאת יקרא אשה כי מאיש וגו THIS SHALL BE CALLED WOMAN, BECAUSE THIS WAS TAKEN OUT OF MAN — Here we have a kind of play upon words (the words אשה and איש sounding similar): hence we may learn that the language used at the time of the Creation was the Holy Tongue (Hebrew) (Genesis Rabbah 18:4)."}, {"ch": 2, "v": 24, "aliyah": 3, "heb": "עַל־כֵּן֙ יַֽעֲזׇב־אִ֔ישׁ אֶת־אָבִ֖יו וְאֶת־אִמּ֑וֹ וְדָבַ֣ק בְּאִשְׁתּ֔וֹ וְהָי֖וּ לְבָשָׂ֥ר אֶחָֽד׃", "onk": "עַל כֵּן יִשְׁבּוֹק גְּבַר <b>בֵּית מִשְׁכְּבֵי<\/b> אַבוּהִי וְאִמֵּהּ וְיִדְבַּק בְּאִתְּתֵהּ וִיהוֹן לְבִסְרָא חָד:", "onk_en": "Therefore, a man shall leave [<b>the house where<\/b>] his father and his mother [<b>sleep<\/b>], and cling to his wife, and they shall become one flesh.", "pj": "בְּגִין כֵּן יִשְׁבּוֹק גְבַר וּמִתְפְּרַשׁ מִן בֵּית מְדַמְכֵיהּ דְאָבוֹהִי וּדְאִימֵיהּ וְיִתְחַבֵּר בְּאִינְתְּתֵיהּ וִיהוֹן תַּרְוֵויהוֹן לְבִישְרָא חָד", "pj_en": "Therefore a man shall leave, and be separate from the house of the bed of his father and of his mother, and shall consociate with his wife, and both of them shall be one flesh.", "tj": "עַל כֵּן יִשְׁבּוֹק גְבַר בֵּית מְדַמְכָא דְאָבוּי וְאִמוֹי:", "tj_en": "Therefore a man shall leave the house of the bed of his father and his mother.", "rashi": "<b>על כן יעזב איש.<\/b> רוּחַ הַקֹּדֶשׁ אוֹמְרָה כֵן לֶאֱסֹר עַל בְּנֵי נֹחַ הָעֲרָיוֹת (סנהדרין נ\"ז):<br><br><b>לבשר אחד.<\/b> הַוָּלָד נוֹצָר עַל יְדֵי שְׁנֵיהֶם וְשָׁם נַעֲשֶׁה בְשָׂרָם אֶחָד (שם נ\"ח):", "rashi_en": "על כן יעזב איש THEREFORE A MAN LEAVETH — The Divine Spirit says this, thus prohibiting immoral relationship to the “Sons of Noah” also (Sanhedrin 57b).<br><br>לבשר אחד ONE FLESH — Both parents are united in the child. "}, {"ch": 2, "v": 25, "aliyah": 3, "heb": "וַיִּֽהְי֤וּ שְׁנֵיהֶם֙ עֲרוּמִּ֔ים הָֽאָדָ֖ם וְאִשְׁתּ֑וֹ וְלֹ֖א יִתְבֹּשָֽׁשׁוּ׃", "onk": "וַהֲווֹ תַרְוֵיהוֹן עַרְטִילָאִין אָדָם וְאִתְּתֵהּ וְלָא מִתְכַּלְמִין:", "onk_en": "The two of them were naked, the man and his wife, and they were not ashamed.", "pj": "וַהֲווֹ תַּרְוֵויהוֹן חַכִּימִין אָדָם וְאִינְתְּתֵיהּ וְלָא אַמְתִּינוּ בִּיקָרֵיהוֹן", "pj_en": "And both of them were wise, Adam and his wife; but they were not faithful (or truthful) in their glory.", "tj": "וְלָא הֲווֹ יָדְעִין מַה הוּא בַהֲתָתָא:", "tj_en": "And they knew not what is shame.", "rashi": "<b>ולא יתבוששו.<\/b> שֶׁלֹּא הָיוּ יוֹדְעִים דֶרֶךְ צְנִיעוּת לְהַבְחִין בֵּין טוֹב לָרָע, וְאַעַ\"פִּ שֶׁנִּתְּנָה בוֹ דֵּעָה לִקְרוֹת לוֹ שֵׁמוֹת, לֹא נִתַּן בּוֹ יֵצֶר הָרָע עַד אָכְלוֹ מִן הָעֵץ וְנִכְנַס בּוֹ יֵצֶר הָרָע וְיָדַע מַה בֵּין טוֹב לָרָע (בראשית רבה):", "rashi_en": "ולא יתבוששו AND THEY WERE NOT ASHAMED — for they did not know what modestly meant, so as to distinguish between good and evil. Although he (Adam) had been endowed with knowledge to give names to all creatures, yet the evil inclination did not become an active principle in him until he had eaten of the tree, when it entered into him and he became aware of the difference between good and evil."}, {"ch": 3, "v": 1, "aliyah": 3, "heb": "וְהַנָּחָשׁ֙ הָיָ֣ה עָר֔וּם מִכֹּל֙ חַיַּ֣ת הַשָּׂדֶ֔ה אֲשֶׁ֥ר עָשָׂ֖ה יְהֹוָ֣ה אֱלֹהִ֑ים וַיֹּ֙אמֶר֙ אֶל־הָ֣אִשָּׁ֔ה אַ֚ף כִּֽי־אָמַ֣ר אֱלֹהִ֔ים לֹ֣א תֹֽאכְל֔וּ מִכֹּ֖ל עֵ֥ץ הַגָּֽן׃", "onk": "וְחִוְיָא הֲוָה חַכִּים מִכֹּל חֵוַת בְּרָא דִּי עֲבַד יְיָ אֱלֹהִים וַאֲמַר לְאִתְּתָא <b>בְּקוּשְׁטָא<\/b> אֲרֵי אֲמַר יְיָ לָא תֵיכְלוּן מִכֹּל אִילַן גִּינְתָא:", "onk_en": "The serpent was more cunning than any beast of the field which Adonoy Elohim made; and it said to the woman, Did Elohim even [<b>truly<\/b>] say that you should not eat from all the trees of the Garden?", "pj": "וְחִוְיָא הֲוָה חַכִּים לְבִישׁ מִכָּל חֵיוַת בְּרָא דְעָבַד יְיָ אֱלֹהִים וַאֲמַר לְאִתְּתָא הַקֻשְׁטָא דְאָמַר יְיָ אֱלֹהִים לָא תֵיכְלוּן מִכָּל אִילַן גִינוּנִיתָא", "pj_en": "And the serpent was wiser unto evil than all the beasts of the field which the Lord God had made. And he said to the woman, Is it truth that the Lord God hath said, You shall not eat of every tree of the garden?", "tj": "", "tj_en": "", "rashi": "<b>והנחש היה ערום.<\/b> מָה עִנְיָן זֶה לְכָאן? הָיָה לוֹ לִסְמֹךְ וַיַּעַשׂ לְאָדָם וּלְאִשְׁתּוֹ כָּתְנוֹת עוֹר וַיַּלְבִּשֵׁם, אֶלָּא לִמֶּדְךָ מֵאֵיזוֹ עֵצָה קָפַץ הַנָּחַשׁ עֲלֵיהֶם, רָאָה אוֹתָם עֲרֻמִּים וְעוֹסְקִים בְּתַשְׁמִישׁ לְעֵין כֹּל וְנִתְאַוָּה לָהּ:<br><br><b>ערום מכל.<\/b> לְפִי עָרְמָתוֹ וּגְדֻלָּתוֹ הָיְתָה מַפָּלָתוֹ, עָרוּם מִכֹּל, אָרוּר מִכֹּל (בראשית רבה):<br><br><b>אף כי אמר וגו'.<\/b> שֶׁמָּא אָמַר לָכֶם לֹא תֹאכְלוּ מִכֹּל וְגוֹ', וְאַעַ\"פִּ שֶׁרָאָה אוֹתָם אוֹכְלִים מִשְּׁאָר פֵּרוֹת, הִרְבָּה עָלֶיהָ דְבָרִים כְּדֵי שֶׁתְּשִׁיבֶנּוּ וְיָבֹא לְדַבֵּר בְּאוֹתוֹ הָעֵץ:", "rashi_en": "והנחש היה ערום AND THE SERPENT WAS MORE SUBTLE — What connection is there between the following narrative and the statement just made? The latter should have been followed by: “and He [the Lord God] made for Adam and his wife garments of skin and clothed them” (3:21), but Scripture informs you with what plan the serpent assailed them: he saw them naked and unashamed and he coveted her (Eve) (Genesis Rabbah 18:6).<br><br>ערום מכל MORE SUBTLE THAN ALL — Corresponding with his subtleness and his greatness was his downfall; “more subtle than all” — “more cursed than all” (see 3:14). (Genesis Rabbah 19:1).<br><br>‘אף כי אמר וגו ALTHOUGH GOD HATH SAID — The meaning is, “Perhaps He has said unto you” ‘לא תאכלו מכל וגו YE SHALL NOT EAT OF EVERY TREE OF THE GARDEN — And although he saw them eating of the other fruits yet he entered into a long conversation with her so that she should answer him, and so that he might then have an opportunity to talk about that particular tree. "}, {"ch": 3, "v": 2, "aliyah": 3, "heb": "וַתֹּ֥אמֶר הָֽאִשָּׁ֖ה אֶל־הַנָּחָ֑שׁ מִפְּרִ֥י עֵֽץ־הַגָּ֖ן נֹאכֵֽל׃", "onk": "וַאֲמָרַת אִתְּתָא לְחִוְיָא מִפֵּירֵי אִילַן גִּינְתָא נֵיכוּל:", "onk_en": "The woman said to the serpent, From the fruit of the trees of the Garden we may eat.", "pj": "וַאֲמָרַת אִתְּתָא לְחִיוְיָא מִשַׁאַר פֵּירֵי אִילַן גִינוּנִיתָא אִית לָן רְשׁוּ לְמֵיכַל", "pj_en": "And the woman said to the serpent, From the rest of the fruits of the trees of the garden we have power to eat;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 3, "aliyah": 3, "heb": "וּמִפְּרִ֣י הָעֵץ֮ אֲשֶׁ֣ר בְּתוֹךְ־הַגָּן֒ אָמַ֣ר אֱלֹהִ֗ים לֹ֤א תֹֽאכְלוּ֙ מִמֶּ֔נּוּ וְלֹ֥א תִגְּע֖וּ בּ֑וֹ פֶּן־תְּמֻתֽוּן׃", "onk": "וּמִפֵּירֵי אִילָנָא דִּי בִמְצִיעוּת גִּינְתָא אֲמַר יְיָ לָא תֵיכְלוּן מִנֵּהּ וְלָא תְקַרְבוּן בֵּהּ דִּילְמָא תְּמוּתוּן:", "onk_en": "But of the fruit of the tree that is in the middle of the Garden, Elohim said, You shall not eat from it, neither shall you touch it, lest you die.", "pj": "וּמִפֵּירֵי אִלָנָא דְבִמְצִיעוּת גִינוּנִיתָא אָמַר יְיָ לָא תֵיכְלוּן מִנֵיהּ וְלָא תְקַרְבוּן בֵּיהּ דִלְמָא תְּמוּתוּן", "pj_en": "but of the fruit of the tree which is in the midst of the garden the Lord hath said, You shall not eat of it, nor approach it, lest you die.", "tj": "", "tj_en": "", "rashi": "<b>ולא תגעו בו.<\/b> הוֹסִיפָה עַל הַצִּוּוּי, לְפִיכָךְ בָּאָה לִידֵי גֵרָעוֹן, הוּא שֶׁנֶּאֱמַר אַל תּוֹסְףְּ עַל דְּבָרָיו (משלי ל'):", "rashi_en": "ולא תגעו בו NEITHER SHALL YE TOUCH IT — She added to God’s command (which did not forbid touching the tree, but only eating of its fruit) therefore she was led to diminish from it. It is to this that the text refers (Proverbs 30:6): “Add thou not unto His words” (Genesis Rabbah 19:3). "}, {"ch": 3, "v": 4, "aliyah": 3, "heb": "וַיֹּ֥אמֶר הַנָּחָ֖שׁ אֶל־הָֽאִשָּׁ֑ה לֹֽא־מ֖וֹת תְּמֻתֽוּן׃", "onk": "וַאֲמַר חִוְיָא לְאִיתְּתָא לָא מוּת תְּמוּתוּן:", "onk_en": "The serpent said to the woman, You certainly will not die.", "pj": "בֵּיהּ הוּא שַׁעְתָּא אָמַר חִוְיָא דִלְטוּר עַל בַּרְיֵהּ וְאָמַר לְאִתְּתָא לָא מְמַת תְּמוּתוּן בְּרַם כָּל אוֹמָנָא סָנֵי בַּר אוֹמָנוּתֵיהּ", "pj_en": "In that hour the serpent spake accusation against his Creator, and said to the woman, Dying you will not die; for every artificer hateth the son of his art:", "tj": "", "tj_en": "", "rashi": "<b>לא מות תמותון.<\/b> דְּחָפָהּ עַד שֶׁנָּגְעָה בוֹ, אָמַר לָהּ כְּשֵׁם שֶׁאֵין מִיתָה בִנְגִיעָה, כָּךְ אֵין מִיתָה בַאֲכִילָה (בראשית רבה):", "rashi_en": "לא מות תמתון YE SHALL NOT SURELY DIE — He pushed her until she touched it. He then said to her, “Just as there is no death in touching it, so there is no death in eating it” (Genesis Rabbah 19:3). "}, {"ch": 3, "v": 5, "aliyah": 3, "heb": "כִּ֚י יֹדֵ֣עַ אֱלֹהִ֔ים כִּ֗י בְּיוֹם֙ אֲכׇלְכֶ֣ם מִמֶּ֔נּוּ וְנִפְקְח֖וּ עֵֽינֵיכֶ֑ם וִהְיִיתֶם֙ כֵּֽאלֹהִ֔ים יֹדְעֵ֖י ט֥וֹב וָרָֽע׃", "onk": "אֲרֵי <b>גַּלֵּי קֳדָם<\/b> יְיָ אֲרֵי בְּיוֹמָא דְּתֵיכְלוּן מִנֵּהּ וְיִתְפַּתְּחַן עֵינֵיכוֹן וּתְהוֹן כְּרַבְרְבִין חַכִּימִין בֵּין טַב לְבִישׁ:", "onk_en": "For [<b>it is revealed before<\/b>] Elohim (knows) that on the day you will eat from it, your eyes will be opened, and you will become as gods [<b>great ones<\/b>], knowing what is good and what is evil.", "pj": "אֲרוּם גְלֵי קֳדָם יְיָ אֲרוּם בְּיוֹמָא דְתֵיכְלוּן מִנֵיהּ וְתֶהֱווֹן כְּמַלְאָכִין רַבְרְבִין דְחַכְּמִין לְמִנְדַע בֵּין טַב לְבִישׁ", "pj_en": "for it is manifest before the Lord, that in the day that you eat of it, you will be as the great angels, who are wise to know between good and evil.", "tj": "", "tj_en": "", "rashi": "<b>כי ידע.<\/b> כָּל אֻמָּן שׂוֹנֵא אֶת בְּנֵי אֻמָּנוּתוֹ, מִן הָעֵץ אָכַל וּבָרָא אֶת הָעוֹלָם (בראשית רבה):<br><br><b>והייתם כאלהים.<\/b> יוֹצְרֵי עוֹלָמוֹת (בראשית רבה):", "rashi_en": "כי ידע FOR [GOD] KNOWS — Every artisan detests his fellow-artisans (“Two of a trade never agree”). The serpent suggested to her: God ate of the tree and created the world (Genesis Rabbah 19:4) so if you eat ...<br><br> והייתם כאלהים YE WILL BE AS GOD — Creators of worlds."}, {"ch": 3, "v": 6, "aliyah": 3, "heb": "וַתֵּ֣רֶא הָֽאִשָּׁ֡ה כִּ֣י טוֹב֩ הָעֵ֨ץ לְמַאֲכָ֜ל וְכִ֧י תַֽאֲוָה־ה֣וּא לָעֵינַ֗יִם וְנֶחְמָ֤ד הָעֵץ֙ לְהַשְׂכִּ֔יל וַתִּקַּ֥ח מִפִּרְי֖וֹ וַתֹּאכַ֑ל וַתִּתֵּ֧ן גַּם־לְאִישָׁ֛הּ עִמָּ֖הּ וַיֹּאכַֽל׃", "onk": "וַחֲזַת אִתְּתָא אֲרֵי טַב אִילַן לְמֵיכָל וַאֲרֵי <b>אַסֵּי<\/b> הוּא לְעַיְנִין וּמְרַגֵּג אִילָנָא <b>לְאִסְתַּכָּלָא בֵהּ<\/b> וּנְסֵיבַת מֵאִבֵּהּ וַאֲכָלַת וִיהָבַת אַף לְבַעְלַהּ עִמַּהּ וַאֲכָל:", "onk_en": "The woman saw that the tree was good for food, and that it was tempting [<b>healing<\/b>] to the eyes, and that the tree was appealing [<b>to look at<\/b>] as a means of [obtaining] wisdom. She took of its fruit and she ate, and she also gave it to her husband with her, and he ate.", "pj": "וְחָמַת אִתְּתָא יַת סַמָאֵל מַלְאָךְ מוֹתָא וּדְחִילַת וְיַדְעַת אֲרוּם טַב אִילָנָא לְמֵיכַל וַאֲרוּם אָסוּ הוּא לִנְהוֹרָא דְעַיְינִין וּמְרַגֵג אִילָנָא לְאִיסְתַּכְּלָא בֵּיהּ וּנְסִיבַת מֵאִיבֵּיהּ וַאֲכָלַת וִיהָבִית אַף לְבַּעֲלָהּ עִמָהּ וְאָכָל", "pj_en": "And the woman beheld Sammael, the angel of death, and was afraid; yet she knew that the tree was good to eat, and that it was medicine for the enlightenment of the eyes, and desirable tree by means of which to understand. And she took of its fruit, and did eat; and she gave to her husband with her, and he did eat.", "tj": "", "tj_en": "", "rashi": "<b>ותרא האשה.<\/b> רָאֲתָה דְבָרָיו שֶׁל נָחָשׁ וְהֶנְאוּ לָהּ וְהֶאֱמִינַתּוּ (בראשית רבה):<br><br><b>כי טוב העץ.<\/b> לִהְיוֹת כֵּאלֹהִים:<br><br><b>וכי תאוה הוא לעינים.<\/b> כְּמוֹ שֶׁאָמַר לָהּ וְנִפְקְחוּ עֵינֵיכֶם:<br><br><b>ונחמד להשכיל.<\/b> כְּמוֹ שֶׁאָמַר לָהּ יוֹדְעֵי טוֹב וָרָע:<br><br><b>ותתן גם לאישה.<\/b> שֶׁלֹּא תָמוּת הִיא וְיִחְיֶה הוּא, וְיִשָּׂא אַחֶרֶת:<br><br><b>גם.<\/b> לְרַבּוֹת בְּהֵמָה וְחַיָּה:", "rashi_en": "ותרא האשה AND THE WOMAN SAW — She approved the words of the serpent — they pleased her and she believed him (Genesis Rabbah 19:3).<br><br>כי טוב העץ THAT THE TREE WAS GOOD to make her become like God.<br><br>וכי תאוה היא לעינים AND THAT IT WAS A DELIGHT TO THE EYES — even as he had said to her: “then your eyes shall be opened”.<br><br>ונחמד להשכיל AND IT WAS TO BE DESIRED TO MAKE ONE WISE — even as he had said to her: “knowing good and evil”.<br><br>ותתן גם לאשה AND SHE GAVE ALSO TO HER HUSBAND so that she should not die and he remain alive to take another wife (Genesis Rabbah 19:5).<br><br>The word גם, also, may be understood to include cattle and beasts (that is, that she gave to these and also to her husband) (Genesis Rabbah 19:5)."}, {"ch": 3, "v": 7, "aliyah": 3, "heb": "וַתִּפָּקַ֙חְנָה֙ עֵינֵ֣י שְׁנֵיהֶ֔ם וַיֵּ֣דְע֔וּ כִּ֥י עֵֽירֻמִּ֖ם הֵ֑ם וַֽיִּתְפְּרוּ֙ עֲלֵ֣ה תְאֵנָ֔ה וַיַּעֲשׂ֥וּ לָהֶ֖ם חֲגֹרֹֽת׃", "onk": "וְאִתְפַּתָּחָא עֵינֵי תַרְוֵיהוֹן וִידָעוּ אֲרֵי עַרְטִילָאִין אִינוּן וְחַטִּיטוּ לְהוֹן טַרְפֵי תְאֵנִין וַעֲבָדוּ לְהוֹן זְרָזִין:", "onk_en": "The eyes of both of them were opened, and they realized that they were naked. They sewed together fig leaves, and made for themselves loincloths.", "pj": "וְאִתְנַהֲרָן עֵינֵי תַּרְוֵויהוֹן וִידָעוּ אֲרוּם עַרְטִילָאִין אִינוּן דְאִיתְעַרְטְלוּ מִן לְבוּשׁ טוּפְרָא דְאִיתְבְּרִיאוּ בֵּיהּ וַהֲווֹ חַמְיַין בְּהַתַתְהוֹן וְחַטִיטוּ לְהוֹן מְטַרְפֵי תֵּנִין וַעֲבָדוּ לְהוֹן קִמוּרִין", "pj_en": "And the eyes of both were enlightened, and they knew that they were naked, divested of the purple robe in which they had been created. And they saw the sight of their shame, and sewed to themselves the leaves of figs, and made to them cinctures.", "tj": "וְעָבָדוּ לְהוֹן אִיצְטַלְוָון:", "tj_en": "And they made to them vestments.", "rashi": "<b>ותפקחנה וגו'.<\/b> לְעִנְיַן הַחָכְמָה דִּבֵּר הַכָּתוּב וְלֹא לְעִנְיַן רְאִיָּה מַמָּשׁ, וְסוֹף הַמִּקְרָא מוֹכִיחַ:<br><br><b>וידעו כי עירמים הם.<\/b> אַף הַסּוּמָא יוֹדֵעַ כְּשֶׁהוּא עָרוּם, אֶלָּא מַהוּ וַיֵּדְעוּ כִּי עֵירֻמִּם הֵם? מִצְוָה אַחַת הָיְתָה בְיָדָם וְנִתְעַרְטְלוּ הֵימֶנָּה (בראשית רבה):<br><br><b>עלה תאנה.<\/b> הוּא הָעֵץ שֶׁאָכְלוּ מִמֶּנּוּ, בַּדָּבָר שֶׁנִּתְקַלְקְלוּ בּוֹ נִתַּקְּנוּ (סנהדרין ע'), אֲבָל שְׁאָר הָעֵצִים מְנָעוּם מִלִּטֹּל עַלֵּיהֶם. וּמִפְּנֵי מָה לֹא נִתְפַּרְסֵם הָעֵץ? שֶׁאֵין הַקָּבָּ\"ה חָפֵץ לְהוֹנוֹת בְּרִיָּה, שֶׁלֹּא יַכְלִימוּהָ וְיֹאמְרוּ זֶהוּ שֶׁלָּקָה הָעוֹלָם עַל יָדוֹ, מִדְרַשׁ רַבִּי תַנְחוּמָא:", "rashi_en": "‘ותפקחנה וגו [AND THE EYES OF BOTH OF THEM] WERE UNCLOSED — Scripture speaks here with reference to intelligence (the mind’s eye) and not with reference to actual seeing; the end of the verse proves this for it states,<br><br>וידעו כי ערומים הם AND THEY KNEW THAT THEY WERE NAKED — Even a blind person knows when he is naked! What then does “and they knew that they were naked” signify? One charge had been entrusted to them and they now knew they had stripped themselves of it (Genesis Rabbah 19:6).<br><br>עלה תאנה FIG LEAVES — This was the tree of which they had eaten; by the very thing through which their ruin had been caused was some improvement effected in their condition (Sanhedrin 70b). The other trees however prevented them from taking of their leaves. And why is not the name of the tree clearly mentioned? Because the Holy One, blessed be He, never wishes to grieve anything He has created: hence its name is not mentioned in order that it might not be put to shame by people saying, “This is the tree through which the world suffered” (Midrash R. Tanchuma 1:4:14)."}, {"ch": 3, "v": 8, "aliyah": 3, "heb": "וַֽיִּשְׁמְע֞וּ אֶת־ק֨וֹל יְהֹוָ֧ה אֱלֹהִ֛ים מִתְהַלֵּ֥ךְ בַּגָּ֖ן לְר֣וּחַ הַיּ֑וֹם וַיִּתְחַבֵּ֨א הָֽאָדָ֜ם וְאִשְׁתּ֗וֹ מִפְּנֵי֙ יְהֹוָ֣ה אֱלֹהִ֔ים בְּת֖וֹךְ עֵ֥ץ הַגָּֽן׃", "onk": "וּשְׁמָעוּ יָת קַל <b>מֵימְרָא דַּ<\/b>יְיָ אֱלֹהִים מְהַלֵּךְ בְּגִינְתָא <b>לִמְנַח<\/b> יוֹמָא וְאִיטַמַּר אָדָם וְאִתְּתֵהּ מִן קֳדָם יְיָ אֱלֹהִים בְּגוֹ אִילַן גִּינְתָא:", "onk_en": "They heard the voice of [<b>the Word of<\/b>] Adonoy Elohim moving in the Garden at the breeze [<b>in the evening<\/b>] of the day. The man and his wife hid themselves from [the Presence of] Adonoy Elohim among the trees of the Garden.", "pj": "וּשְׁמָעוּ יַת קַל מֵימְרָא דַיְיָ אֱלהִים מְטַיֵיל בְּגִינוּנִיתָא לִמְנַח יוֹמָא מְטַיִיל בְּגִינָתָא לְתוּקְפָא דְיוֹמָא וְאִיטְמַר אָדָם וְאִנְתְּתֵיהּ מִן קֳדָם יְיָ אֱלהִים בִּמְצִיעוּ אִילוֹנֵי גִינוּנִיתָא", "pj_en": "And they heard the voice of the Word of the Lord God walking in the garden in the repose of the day; and Adam and his wife hid themselves from before the Lord God among the trees of the garden.", "tj": "", "tj_en": "", "rashi": "<b>וישמעו.<\/b> יֵשׁ מִדְרְשֵׁי אַגָּדָה רַבִּים וּכְבָר סִדְּרוּם רַבּוֹתֵינוּ עַל מְכוֹנָם בִּבְ\"רַ וּבִשְׁאָר מִדְרָשׁוֹת; וַאֲנִי לֹא בָאתִי אֶלָּא לִפְשׁוּטוֹ שֶׁל מִקְרָא וּלְאַגָּדָה הַמְיַשֶּׁבֶת דִּבְרֵי הַמִּקְרָא דָבָר דָּבוּר עַל אׇפְנָיו: <b>וישמעו.<\/b> מַה שָּׁמְעוּ? שָׁמְעוּ אֶת קוֹל הַקָּבָּ\"ה שֶׁהָיָה מִתְהַלֵּךְ בַּגַּן:<br><br><b>לרוח היום.<\/b> לְאוֹתוֹ רוּחַ שֶׁהַשֶּׁמֶשׁ בָּאָה לְשָׁם, וְזוֹ הִיא מַעֲרָבִית; שֶׁלִּפְנוֹת עֶרֶב חַמָּה בַּמַּעֲרָב, וְהֵם סָרְחוּ בָּעֲשִׂירִית (סנהדרין ל\"ח):", "rashi_en": "וישמעו AND THEY HEARD — There are many Midrashic explanations and our Teachers have already collected them in their appropriate places in Genesis Rabbah and in other Midrashim. I, however, am only concerned with the plain sense of Scripture and with such Agadoth that explain the words of Scripture in a manner that fits in with them. וישמעו AND THEY HEARD — What did they hear? They heard the sound of the Holy One, blessed be He, as He walked in the garden (see Genesis Rabbah 19:12).<br><br>לרוח היום IN THE WIND OF THE DAY — (רוח is used also in the meaning of direction,— north, east, — etc.) in that direction to which the sun travels (באה לשם) which is the west, for towards evening the sun is in the west, and they committed the sin in the tenth hour (Sanhedrin 38b)."}, {"ch": 3, "v": 9, "aliyah": 3, "heb": "וַיִּקְרָ֛א יְהֹוָ֥ה אֱלֹהִ֖ים אֶל־הָֽאָדָ֑ם וַיֹּ֥אמֶר ל֖וֹ אַיֶּֽכָּה׃", "onk": "וּקְרָא יְיָ אֱלֹהִים לְאָדָם וַאֲמַר לֵהּ אָן אָתְּ:", "onk_en": "Adonoy Elohim called to the man, and He said, Where are you?", "pj": "וּקְרָא יְיָ אֱלהִים לְאָדָם וַאֲמַר לֵיהּ הֲלָא כָּל עַלְמָא דִבְרֵיתִי גְלֵי קֳדָמַי חֲשׁוֹכָא כִּנְהוֹרָא וְאֵיךְ אַנְתְּ סְבַר בְּלִיבָּךְ לְאִיטַמְרָא מִן קֳדָמַי הֲלָא אֲתַר דְאַנְתְּ מִטְמַר בֵּיהּ אֲנָא חָמֵי וְאָן אִנוּן פִּקוּדַיָא דְפַקֵידְתָּךְ", "pj_en": "And the Lord God called to Adam, and said to him, Is not all the world which I have made manifest before Me; the darkness as the light? and how hast thou thought in thine heart to hide from before Me? The place where thou art concealed, do I not see? Where are the commandments that I commanded thee?", "tj": "וּקְרָא מֵימְרָא דַיְיָ אֱלהִים לְאָדָם וַאֲמַר לֵיהּ הָא עַלְמָא דְבָרִית גְלִי קֳדָמַי חֲשׁוֹכָא וּנְהוֹרָא גַלִיאוּ קֳדָמַי וְאֵיךְ אַתְּ סְבַר דְלֵית גְלֵי קֳדָמַי אַתְרָא דְאַתְּ בְּגַוֵיהּ הָן הוּא מִצְוָתָא דִפַקֵידִית יָתָךְ:", "tj_en": "Walking in the garden in the strength of the day...And the Word of the Lord God called to Adam, and said to him, Behold, the world which I have created is manifest before Me; and how thinkest thou that the place in the midst whereof thou art, is not revealed before Me? Where is the commandment that I taught thee?", "rashi": "<b>איכה.<\/b> יוֹדֵעַ הָיָה הֵיכָן הוּא אֶלָּא לִכָּנֵס עִמּוֹ בִּדְבָרִים, שֶׁלֹּא יְהֵא נִבְהָל לְהָשִׁיב אִם יַעֲנִישֵׁהוּ פִּתְאוֹם (בראשית רבה), וְכֵן בְּקַיִן אָמַר לוֹ אֵי הֶבֶל אָחִיךָ (בראשית ד), וְכֵן בְּבִלְעָם מִי הָאֲנָשִׁים הָאֵלֶּה עִמָּךְ (במדבר כ\"ב), לִכָּנֵס עִמָּהֶם בִּדְבָרִים, וְכֵן בְּחִזְקִיָּה בִּשְׁלוּחֵי מְרֹאדַךְ בַּלְאֲדָן:", "rashi_en": "איכה WHERE ART THOU — He knew where he was, but He asked this in order to open up a conversation with him that he should not become confused in his reply, if He were to pronounce punishment against him all of a sudden. Similarly in the case of Cain, He said to him, (4:9) “where is Abel thy brother?” Similarly with Balaam, (Numbers 22:9) “what men are these with thee?” — to open up a conversation with them; so, also, in the case of Hezekiah with reference to the messengers of Merodach-baladan (Isaiah 39:3). "}, {"ch": 3, "v": 10, "aliyah": 3, "heb": "וַיֹּ֕אמֶר אֶת־קֹלְךָ֥ שָׁמַ֖עְתִּי בַּגָּ֑ן וָאִירָ֛א כִּֽי־עֵירֹ֥ם אָנֹ֖כִי וָאֵחָבֵֽא׃", "onk": "וַאֲמַר יָת <b>קַל מֵימְרָךְ<\/b> שַׁמְעִית בְּגִינְתָא וּדְחֵילִית אֲרֵי עַרְטִילַאי אֲנָא וְאִיטַמָּרִית:", "onk_en": "He said, I heard Your voice [<b>the voice of Your Word<\/b>] in the Garden, and I was afraid because I was naked, so I hid myself.", "pj": "וַאֲמַר יַת קַל מֵימְרָךְ שְׁמָעִית בְּגִינוּנִיתָא וּדְחֵלִית אֲרוּם עַרְטִילָאִי אֲנָא וּמִצְוָתָא דְפַקֵדְתַּנִי אַעֲבָרִית מִינִי וְאַטְמֵרִית מִן כִּיסוּפָא", "pj_en": "And he said, The voice of Thy Word heard I in the garden, and I was afraid, because I am naked; and the commandment which Thou didst teach me, I have transgressed; therefore I hid myself from shame.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 11, "aliyah": 3, "heb": "וַיֹּ֕אמֶר מִ֚י הִגִּ֣יד לְךָ֔ כִּ֥י עֵירֹ֖ם אָ֑תָּה הֲמִן־הָעֵ֗ץ אֲשֶׁ֧ר צִוִּיתִ֛יךָ לְבִלְתִּ֥י אֲכׇל־מִמֶּ֖נּוּ אָכָֽלְתָּ׃", "onk": "וַאֲמַר מָן חַוֵי לָךְ אֲרֵי עַרְטִילַאי אָתְּ הֲמִן אִילָנָא דִּפַקֶּדְתָּךְ בְּדִיל דְּלָא לְמֵיכַל מִנֵּהּ אֲכָלְתְּ:", "onk_en": "And He said, Who told you that you were naked? From the tree whereof I commanded you not to eat of it, have you eaten?", "pj": "וַאֲמַר מַן חַוִי לָּךְ אֲרוּם עַרְטִילָאִי אַתְּ דִלְמָא מִן פֵּירֵי אִילָנָא דְפַקֵידְתָּךְ דְלָא לְמֵיכַל מִינֵיהּ אֲכַלְתְּ", "pj_en": "And He said, Who showed thee that thou art naked? Unless thou hast eaten of the fruit of the tree of which I commanded that thou shouldst not eat.", "tj": "", "tj_en": "", "rashi": "<b>מי הגיד לך.<\/b> מֵאַיִן לְךָ לָדַעַת מַה בֹּשֶׁת יֵשׁ בְּעוֹמֵד עָרֹם?<br><br><b>המן העץ.<\/b> בִּתְמִיהָ:", "rashi_en": "מי הגיד לך WHO TOLD THEE? — Whence has the knowledge come to you what shame there is in standing naked?<br><br>המן העץ HAST THOU EATEN OF THE TREE — The ' ה of the word המן expresses a question. "}, {"ch": 3, "v": 12, "aliyah": 3, "heb": "וַיֹּ֖אמֶר הָֽאָדָ֑ם הָֽאִשָּׁה֙ אֲשֶׁ֣ר נָתַ֣תָּה עִמָּדִ֔י הִ֛וא נָֽתְנָה־לִּ֥י מִן־הָעֵ֖ץ וָאֹכֵֽל׃", "onk": "וַאֲמַר הָאָדָם אִתְּתָא דִּיהַבְתָּ עִמִּי הִיא יַהֲבַת לִי מִן אִילָנָא וַאֲכָלִית:", "onk_en": "The man said, The woman that You gave to be with me—she gave me of the tree and I ate.", "pj": "וַאֲמַר אָדָם אִיתְּתָא דִיהַבְתְּ גַבַּיי הִיא יַהֲבַת לִי מִן פֵּירֵי אִילָנָא וַאֲכָלִית", "pj_en": "And Adam said, The woman whom Thou gavest to be with me, she gave me of the fruit of the tree, and I did eat.", "tj": "", "tj_en": "", "rashi": "<b>אשר נתתה עמדי.<\/b> כָּאן כָּפַר בַּטּוֹבָה (עבודה זרה ה):", "rashi_en": "אשר נתת עמדי WHOM THOU GAVEST TO BE WITH ME — Here he showed his ingratitude (Avodah Zarah 5b). "}, {"ch": 3, "v": 13, "aliyah": 3, "heb": "וַיֹּ֨אמֶר יְהֹוָ֧ה אֱלֹהִ֛ים לָאִשָּׁ֖ה מַה־זֹּ֣את עָשִׂ֑ית וַתֹּ֙אמֶר֙ הָֽאִשָּׁ֔ה הַנָּחָ֥שׁ הִשִּׁיאַ֖נִי וָאֹכֵֽל׃", "onk": "וַאֲמַר יְיָ אֱלֹהִים לְאִתְּתָא מַה דָּא עַבְדָת וַאֲמָרַת אִתְּתָא חִוְיָא אַטְעַיָנִי וַאֲכָלִית:", "onk_en": "Adonoy Elohim said to the woman, What is this that you have done? She said, The serpent deceived me, and I ate.", "pj": "וַאֲמַר יְיָ אֱלהִים לְאִיתְּתָא מַה דָא עָבַדְתְּ וַאֲמַרַת אִיתְּתָא חִוְיָא אַשְׁיַינִי בְּחוּכְמָתֵיהּ וְאַטְעַיְינִי בְּרִישְׁעוּתֵיהּ וַאֲכָלִית", "pj_en": "And the Lord God said to the woman, What hast thou done? And the woman said, The serpent beguiled me with his subtilty, and deceived me with his wickedness, and I ate.", "tj": "", "tj_en": "", "rashi": "<b>השיאני.<\/b> הִטְעַנִי, כְּמוֹ אַל יַשִּׁיא אֶתְכֶם חִזְקִיָּהוּ (דברי הימים ב' ל\"ב):", "rashi_en": "השיאני means HE DECEIVED ME; — we find the word in the same meaning in (2 Chronicles 32:15), “Now therefore let not Hezekiah beguile you” (Genesis Rabbah 19). "}, {"ch": 3, "v": 14, "aliyah": 3, "heb": "וַיֹּ֩אמֶר֩ יְהֹוָ֨ה אֱלֹהִ֥ים&thinsp;<small>׀<\/small>&thinsp;אֶֽל־הַנָּחָשׁ֮ כִּ֣י עָשִׂ֣יתָ זֹּאת֒ אָר֤וּר אַתָּה֙ מִכׇּל־הַבְּהֵמָ֔ה וּמִכֹּ֖ל חַיַּ֣ת הַשָּׂדֶ֑ה עַל־גְּחֹנְךָ֣ תֵלֵ֔ךְ וְעָפָ֥ר תֹּאכַ֖ל כׇּל־יְמֵ֥י חַיֶּֽיךָ׃", "onk": "וַאֲמַר יְיָ אֱלֹהִים לְחִוְיָא אֲרֵי עֲבַדְתָּ דָּא לִיט אַתְּ מִכָּל בְּעִירָא וּמִכֹּל חֵוַת בָּרָא עַל מְעָךְ תֵּיזִיל וְעַפְרָא תֵיכוּל כָּל יוֹמֵי חַיָּיךְ:", "onk_en": "Adonoy Elohim said to the serpent, Because you did this, cursed are you from among all animals and beasts of the field. On your belly you shall crawl. And dust you shall eat all the days of your life.", "pj": "וְאַיְתֵי יְיָ אֱלהִים תְּלָתֵיהוֹן לְדִינָא וַאֲמַר לְחִוְיָא אֲרוּם עָבַדְתְּ דָא לִיט אַתְּ מִכָּל בְּעִירָא וּמִכָּל חֵיוַת בְּרָא עַל מֵיעָךְ תְּהֵא מְטַיֵיל וְרַגְלָךְ יִתְקָצְּצוּן וּמִשְׁכָךְ תְּהֵי מִשְׁלַח חֲדָא לְשֵׁב שְׁנִין וַאֲרֵיסָא דְמוֹתָא בְּפֻמָךְ וְעַפְרָא תֵיכוֹל כָּל יוֹמֵי חַיָיךְ", "pj_en": "And the Lord God brought the three unto judgment; and He said to the serpent, Because thou hast done this, cursed art thou of all the cattle, and of all the beasts of the field: upon thy belly thou shalt go, and thy feet shall be cut off, and thy skin thou shalt cast away once in seven years; and the poison of death shall be in thy mouth, and dust shalt thou eat all the days of thy life.", "tj": "", "tj_en": "", "rashi": "<b>כי עשית זאת.<\/b> מִכָּאן שֶׁאֵין מְהַפְּכִים בִּזְכוּתוֹ שֶׁל מֵסִית, שֶׁאִלּוּ שְׁאָלוֹ לָמָּה עָשִׂיתָ זֹאת? הָיָה לוֹ לְהָשִׁיב דִּבְרֵי הָרַב וְדִבְרֵי הַתַּלְמִיד דִּבְרֵי מִי שׁוֹמְעִין? (סנהדרין כ\"ט):<br><br><b>מכל הבהמה ומכל חית השדה.<\/b> אִם מִבְּהֵמָה נִתְקַלֵּל מֵחַיָּה לֹא כָּל שֶׁכֵּן, הֶעֱמִידוּ רַבּוֹתֵינוּ מִדְרָשׁ זֶה בְמַסֶּכֶת בְּכוֹרוֹת (דף ח') לְלַמֵּד שֶׁיְּמֵי עִבּוּרוֹ שֶׁל נָחָשׁ שֶׁבַע שָׁנִים:<br><br><b>על גחונך תלך.<\/b> רַגְלַיִם הָיוּ לוֹ וְנִקְצְצוּ:", "rashi_en": "כי עשית זאת BECAUSE THOU HAST DONE THIS — From here we infer that we should not occupy ourselves with what may be in favour of one who seduces people to idolatry, for had He asked it, “Why hast thou done this?”, it could have answered Him, “When the words of the teacher and those of the pupil are contradictory, whose orders should be obeyed?” (Sanhedrin 29a). (i. e. if You told them one thing and I another, should they not have obeyed You?).<br><br>מכל הבהמה ומכל חית השדה FROM AMONG (or, MORE THAN) ALL CATTLE AND ALL THE BEASTS OF THE FIELD — If it was cursed more than the cattle whose period of gestation is longer than that of beasts does it not necessarily follow that it was cursed more than the beasts? Our Rabbis have definitely established the correctness of the following deduction in treatise Bekhorot 8a, that it (viz., the use of these apparently superfluous words “and more than all the beasts of the field”) teaches that the period of gestation of the serpent is seven years.<br><br>על גחנך תלך UPON THY BELLY SHALT THOU GO — It had feet but they were cut off (Genesis Rabbah 20:5). "}, {"ch": 3, "v": 15, "aliyah": 3, "heb": "וְאֵיבָ֣ה&thinsp;<b>׀<\/b> אָשִׁ֗ית בֵּֽינְךָ֙ וּבֵ֣ין הָֽאִשָּׁ֔ה וּבֵ֥ין זַרְעֲךָ֖ וּבֵ֣ין זַרְעָ֑הּ ה֚וּא יְשׁוּפְךָ֣ רֹ֔אשׁ וְאַתָּ֖ה תְּשׁוּפֶ֥נּוּ עָקֵֽב׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּדְבָבוּ אֱשַׁוֵּי בֵּינָךְ וּבֵין אִתְּתָא וּבֵין בְּנָךְ וּבֵין בְּנָהַהּ הוּא <b>יְהֵי דְּכִיר לָךְ מַה דִּעֲבַדְתָּ לֵהּ מִלְּקַדְמִין וְאַתְּ תְּהֵא נָטִיר לֵהּ לְסוֹפָא<\/b>:", "onk_en": "I will put hostility between you and the woman, and between your offspring and her offspring. He shall strike you on the head, and you shall strike him on the heel. [<b>He will remember you, what you did to him from the beginning, and you will expect him at the end<\/b>].", "pj": "וּדְבָבוּ אֵישַׁוֵי בֵּינָךְ וּבֵין אִתְּתָא בֵּין זַרְעֲיַת בְנָךְ וּבֵין זַרְעֲיַת בְּנָהָא וִיהֵי כַּד יְהוֹן בְּנָהָא דְאִתָּא נַטְרִין מִצְוָתָא דְאוֹרַיְיתָא יֶהֱוְיַן מְכַוְונִין וּמַחְיָין יָתָךְ עַל רֵישָׁךְ וְכַד שַׁבְקִין מִצְוָותָא דְאוֹרַיְיתָא תֶּהֱוֵי מִתְכַוֵין וּנְכִית יַתְהוֹן בְּעִקְבֵהוֹן בְּרַם לְהוֹן יְהֵא אָסוּ וְלָךְ לָא יְהֵי אָסוּ וַעֲתִידִין אִינוּן לְמֶעֱבַד שְׁפִיוּתָא בְּעִיקְבָא בְּיוֹמֵי מַלְכָּא מְשִׁיחָא", "pj_en": "And I will put enmity between thee and the woman, and between the seed of thy son, and the seed of her sons; and it shall be when the sons of the woman keep the commandments of the law, they will be prepared to smite thee upon thy head; but when they forsake the commandments of the law, thou wilt be ready to wound them in their heel. Nevertheless for them there shall be a medicine, but for thee there will be no medicine; and they shall make a remedy for the heel in the days of the King Meshiha.", "tj": "וִיהֵי כַּד יֶהֱוֵין בְּנַיָא דְאִתְּתָא לְעַיָן בְּאוֹרָיְיתָא וְעָבְדִין פִּקוּדַיָא יֶהֱוְיַן מִתְכַוְונִין וּמַחְיַין יָתָךְ לְרֵישָׁךְ וְקַטְלִין יָתָךְ וְכַד יִשְׁבְּקוּן בְּנַיָא דְאִיתְּתָא מִצְוָתָא דְאוֹרַיְיתָא וְלָא יַעַבְדוּן פִּקוּדַיָא תֶּהֱוֵי מִתְכַוִין וּנְכִית יַתְהוֹן בְּעִקְבֵהוֹן וּמַמְרַע יַתְהוֹן בְּרַם יֶהֱוֵי אָסוּ לִבְנָהָא דְאִתְּתָא וְלָךְ חִיוְיָא לָא יֶהֱוֵי אָסוּ בְּרַם עַתִידִין הִינוּן אִילֵין לְאִילֵין לְמַעֲבַּד שְׁפוּיָיתָא בְּעִיקְבָא בְּסוֹף עֵקֶב יוֹמַיָא בְּיוֹמוֹי דְמַלְכָּא מְשִׁיחָא:", "tj_en": "And it shall be when the sons of the woman consider the law, and perform (its) instructions, they will be prepared to smite thee on thy head to kill thee; and when the sons of the woman forsake the commandment of the law, and perform not (its) instructions, thou wilt be ready to wound them in their heel, and hurt them. Nevertheless there shall be a medicine for the sons of the woman, but for thee, serpent, there shall be no medicine: but it is to be that for these there shall be a remedy for the heel in the days of the king Meshiha.", "rashi": "<b>ואיבה אשית.<\/b> אַתָּה לֹא נִתְכַּוַּנְתָּ אֶלָּא שֶׁיָּמוּת אָדָם כְּשֶׁיּאֹכַל הוּא תְּחִלָּה וְתִשָּׂא אֶת חַוָּה, וְלֹא בָאתָ לְדַבֵּר אֶל חַוָּה תְּחִלָּה אֶלָּא לְפִי שֶׁהַנָּשִׁים קַלּוֹת לְהִתְפַּתּוֹת וְיוֹדְעוֹת לְפַתּוֹת אֶת בַּעְלֵיהֶן, לְפִיכָךְ וְאֵיבָה אָשִׁית:<br><br><b>ישופך.<\/b> יְכַתֶּתְךָ (סוטה ט') כְּמוֹ וָאֶכֹּת אֹתוֹ (דברים ט), וְתַרְגּוּמוֹ וְשָׁפִית יָתֵי':<br><br><b>ואתה תשופנו עקב.<\/b> לֹא יְהֵא לְךָ קוֹמָה וְתִשְּׁכֶנּוּ בַּעֲקֵבוֹ, וְאַף מִשָּׁם תְּמִיתֶנּוּ, וּלְשׁוֹן תְּשׁוּפֶנּוּ כְּמוֹ נָשַׁף בָּהֶם (ישעיהו מ') כְּשֶׁהַנָּחָשׁ בָּא לִנְשֹׁך הוּא נוֹשֵׁף כְּמִין שְׁרִיקָה וּלְפִי שֶׁהַלָּשׁוֹן נוֹפֵל עַל הַלָּשָוֹן כְּתִיב לְשׁוֹן נְשִׁיפָה בִשְׁנֵיהֶם:", "rashi_en": "ואיבה אשית AND I WILL SET ENMITY — Your sole intention was that Adam should die by eating it first and that you should then take Eve for yourself (Genesis Rabbah 20:5), and you came to speak to Eve first only because women are easily influenced and know how to influence their husbands; therefore “I shall put enmity [between thee and the woman]”.<br><br>הוא ישופך HE WILL BRUISE (or, POUND) THEE— Like (Deuteronomy 9:21), “And I beat in pieces” which Onkelos translates by ושפית “I pounded it.”<br><br>ואתה תשופנו עקב AND THOU SHALT BRUISE HIS HEEL — As you will have no height (not stand erect) you will be able to bite him only on the heel, but even at that spot you will kill him. The word תשופנו is of the same import as the verb in (Isaiah 40:24). נשף בהם “It bloweth upon them.” When a serpent comes to bite, it blows with a kind of hissing sound. Although the words ישופך and תשופנו have different meanings, since they constitute “a play upon words” by sounding similar, they are both used here. "}, {"ch": 3, "v": 16, "aliyah": 3, "heb": "אֶֽל־הָאִשָּׁ֣ה אָמַ֗ר הַרְבָּ֤ה אַרְבֶּה֙ עִצְּבוֹנֵ֣ךְ וְהֵֽרֹנֵ֔ךְ בְּעֶ֖צֶב תֵּֽלְדִ֣י בָנִ֑ים וְאֶל־אִישֵׁךְ֙ תְּשׁ֣וּקָתֵ֔ךְ וְה֖וּא יִמְשׇׁל־בָּֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לְאִתְּתָא אֲמַר אַסְגָּאָה אַסְגֵּי צַעֲרַיְכִי וְעִדּוּיַיְכִי בְּצְעַר תֵּלְדִי בְנִין וּלְוַת בַּעְלִךְ תְּהֵא תִּאוּבְתִּיךְ וְהוּא יִשְׁלַט בִּךְ:", "onk_en": "To the woman He said, I will greatly increase your sorrow and your pregnancy. You will give birth to children with pain. Your desire will be for your husband, and he will dominate you.", "pj": "לְאִינְתְּתָא אָמַר אַסְגָא אַסְגֵי סְגוּפַיִךְ בַּאֲדַם בְּתוּלִין וְעִידוּיֵךְ בְּצַעַר תַּלְדִין בְּנִין וּלְוַת בַּעֲלִיךְ תְּהֵי מַתְוָךְ וְהוּא יְהֵי שַׁלִיט בִּיךְ לְמִזְכֵּי וּלְמֶחְטֵי", "pj_en": "Unto the woman He said, Multiplying, I will multiply thy affliction by the blood of thy virginity, and by thy conception; in sorrow shalt thou bear children, and to thy husband shall be thy desire, and he will have rule over thee unto righteousness or unto sin.", "tj": "", "tj_en": "", "rashi": "<b>עצבונך.<\/b> זֶה צַעַר גִּדּוּל בָּנִים (עירובין ק'):<br><br><b>והרנך.<\/b> זֶה צַעַר הָעִבּוּר:<br><br><b>בעצב תלדי בנים.<\/b> זֶה צַעַר הַלֵּדָה:<br><br><b>ואל אישך תשוקתך.<\/b> לְתַשְׁמִישׁ, וְאַעַפִּ\"כֵּ אֵין לָךְ מֵצַח לְתָבְעוֹ בַּפֶּה, אֶלָּא הוּא יִמְשָׁל בָּךְ, הַכֹּל מִמֶּנּוּ וְלֹא מִמֵּךְ:<br><br><b>תשוקתך.<\/b> תַּאֲוָתֵךְ, כְּמוֹ נֶפֶשׁ שׁוֹקֵקָה (ישעיהו כ\"ט):", "rashi_en": "עצבנך THY PAIN — viz., the trouble of rearing children (Eruvin 100b).<br><br>והרונך AND THY CONCEPTION— viz., the pain of pregnancy.<br><br>בעצב תלדי בנים IN PAIN THOU SHALT BEAR CHILDREN — This refers to the pangs of childbirth (Eruvin 100b).<br><br>ואל אישך תשוקתך AND TO YOUR HUSBAND WILL BE YOUR DESIRE — for sexual relations. And, nonetheless, you will not have the temerity to proposition him with [your] mouth, but rather HE WILL RULE OVER YOU — everything will come from him and not from you.  <br><br>תשוקתך THY DESIRE — Similar to (Isaiah 29:8), ונפשו שוקקה “and his soul hath appetite”, (desires)."}, {"ch": 3, "v": 17, "aliyah": 3, "heb": "וּלְאָדָ֣ם אָמַ֗ר כִּֽי־שָׁמַ֘עְתָּ֮ לְק֣וֹל אִשְׁתֶּ֒ךָ֒ וַתֹּ֙אכַל֙ מִן־הָעֵ֔ץ אֲשֶׁ֤ר צִוִּיתִ֙יךָ֙ לֵאמֹ֔ר לֹ֥א תֹאכַ֖ל מִמֶּ֑נּוּ אֲרוּרָ֤ה הָֽאֲדָמָה֙ בַּֽעֲבוּרֶ֔ךָ בְּעִצָּבוֹן֙ תֹּֽאכְלֶ֔נָּה כֹּ֖ל יְמֵ֥י חַיֶּֽיךָ׃", "onk": "וּלְאָדָם אֲמַר אֲרֵי קַבֵּילְתָּ לְמֵימַר אִתְּתָךְ וַאֲכַלְתָּ מִן אִילָנָא דִּי פַקֵּידְתָּךְ לְמֵימַר לָא תֵיכוּל מִנֵּהּ לִיטָא אַרְעָא בְּדִילָךְ <b>בַּעֲמַל<\/b> תִּיכְלִינַהּ כָּל יוֹמֵי חַיָּיךְ:", "onk_en": "To the man He said, Because you listened to your wife, and ate from the tree which I commanded you, saying, Do not eat from it; the soil will be cursed because of you. In sorrow [<b>With toil<\/b>] you shall eat from it all the days of your life.", "pj": "וּלְאָדָם אָמַר אֲרוּם קְבֵלַת לְמֵימַר אִנְתְּתָךְ וְאָכָלְתְּ מִן פֵּירֵי אִילָנָא דְפַקִידְתָּךְ לְמֵימַר לָא תֵיכוּל מִנֵיהּ לוּטָא אַרְעָא בְּגִין דְלָא חַוִיאַת לָךְ חוֹבָךְ בַּעֲמַל תַּכְלִינָהּ כָּל יוֹמֵי חַיָיךְ", "pj_en": "But to Adam he said, Because thou hast hearkened to the word of thy wife, and hast eaten of the fruit of the tree, of which I commanded thee, saying, Thou shalt not eat of it, accursed is the ground, in that it did not show thee thy guilt; in labour shalt thou eat (of) it all the days of thy life.", "tj": "", "tj_en": "", "rashi": "<b>ארורה האדמה בעבורך.<\/b> מַעֲלָה לְךָ דְּבָרִים אֲרוּרִים, כְּגוֹן זְבוּבִים, פַּרְעוֹשִׁים וּנְמָלִים, מָשָׁל לְיוֹצֵא לְתַרְבּוּת רָעָה וְהַבְּרִיּוֹת מְקַלְּלוֹת שָׁדַיִם שֶׁיָּנַק מֵהֶם:", "rashi_en": "ארורה האדמה בעבורך CURSED BE THE GROUND FOR THY SAKE — It will produce to you cursed objects such as flies, fleas and ants; it may be compared to the case of one who gets into depraved ways, and people curse the breasts at which he was suckled (Genesis Rabbah 5:9). "}, {"ch": 3, "v": 18, "aliyah": 3, "heb": "וְק֥וֹץ וְדַרְדַּ֖ר תַּצְמִ֣יחַֽ לָ֑ךְ וְאָכַלְתָּ֖ אֶת־עֵ֥שֶׂב הַשָּׂדֶֽה׃", "onk": "וְכוּבִין וְאַטְדִּין תַּצְמַח לָךְ וְתֵיכוּל יָת עִסְבָּא דְחַקְלָא:", "onk_en": "It will grow thorns and thistles for you; and you will eat the herbs of the field.", "pj": "וְכוּבִין וְאַטְדִין תִּצְמַח וְתַרְבֵּי בְּדִילָךְ וְתֵיכוֹל יַת עִשְבָּא דְעַל אַפֵּי בְּרָא עָנֵי אָדָם וְאָמַר בְּבָעוּ רַחֲמִין מִן קֳדָמָךְ יְיָ דְלָא נִתְחַשֵׁב כִּבְּעִירָא דְנֵיכוֹל עִיסְבָּא דְאַפֵּי בְּרָא נֵיקוּם כְּעַן וְנִלְעֵי בְּלֵיעוּת יְדַיי וְנֵיכוֹל מָזוֹן מִן מְזוֹנָא דְאַרְעָא וּבְכֵן יִתְאַפְרֵשׁ כְּעַן קָדָמָךְ בֵּין בְּנֵי אֵינָשָׁא וּבֵין בְּנֵי בְּעִירָא", "pj_en": "And thorns and thistles will it put forth and increase on account of thee, and thou shalt eat the herb which is on the face of the field. And Adam answered: I pray, through mercies from before Thee, O Lord, that we may not be accounted as the cattle, to eat the herb of the face of the field. Let us stand up, and labour with the labour of the hands, and eat food of the food of the earth; and thus let there be distinction before Thee, between the children of men and the offspring of cattle.", "tj": "וְכוּבִין וְדַרְדַרִין תַּרְבֵּי לָךְ וְתֵיכוּל יַת עִשְבָּא דִבְאַפֵּי בְּרָא עָנֵי אָדָם וַאֲמַר בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ יְיָ לָא נִתְחַשֵׁב קֳדָמָךְ מִן בְּעִירָא לְמֵיכַל יַת עִישְבָּא דִבְאַפֵּי בְּרָא נֵיקוֹם כְּעַן וְנִלְעֵי מִלֵאוֹת יְדַיי וְנֵיכוֹל מָזוֹן מִן פֵּירֵי אַרְעָא וּבִכְדֵין יֶהֱוֵי מִפְרַשׁ קֳדָמָךְ בֵּין אֱנָשָׁא וּבֵין בְּעִירָא:", "tj_en": "And thorns and dardareen shall it increase to thee; and thou shalt eat the herb which is on the face of the field. Adam answered and said, I pray, through mercies from before Thee, O Lord, that we are not accounted before Thee as the cattle, to eat the herb which is on the face of the field. Let us now stand up, and labor with the labor of the hands, and eat food of the fruits of the earth; and in these things let there be distinction before Thee between the children of men and the cattle.", "rashi": "<b>וקוץ ודרדר תצמיח לך.<\/b> הָאָרֶץ כְּשֶׁתִּזְרָעֶנָּה מִינֵי זְרָעִים, תַּצְמִיחַ קוֹץ וְדַרְדַּר קֻנְדָּס וְעַכָּבִיּוֹת, וְהֵן נֶאֱכָלִין עַל יְדֵי תִקּוּן (ביצה ל\"ד):<br><br><b>ואכלת את עשב השדה.<\/b> וּמַה קְּלָלָה הִיא זוֹ? וַהֲלֹא בַּבְּרָכָה נֶאֱמַר לוֹ הִנֵּה נָתַתִּי לָכֶם אֶת כָּל עֵשֶׂב זֹרֵעַ זֶרַע וְגוֹ? אֶלָּא מָה אָמוּר כָּאן בְּרֹאשׁ הָעִנְיָן אֲרוּרָה הָאֲדָמָה בַּעֲבוּרֶךָ בְּעִצָּבוֹן תֹּאכְלֶנָּה, וְאַחַר הָעִצָּבוֹן וְקוֹץ וְדַרְדַּר תַּצְמִיחַ לָךְ, כְּשֶׁתִּזְרָעֶנָּה קִטְנִית אוֹ יַרְקוֹת גִּנָּה הִיא תַצְמִיחַ לְךָ קוֹצִים וְדַרְדָּרִים וּשְׁאָר עִשְׂבֵי הַשָׂדֶה וְעַל כָּרְחֲךָ תֹּאכְלֵם:", "rashi_en": "וקוץ ודרדר תצמיח לך THORNS ALSO AND THISTLES SHALL IT BRING FORTH TO THEE— תצמיח has for subject the earth; when you sow it with various kinds of grain, it shall bring forth thorns and thistles — artichokes and cardoon — which are fit for food only after special preparation (Genesis Rabbah 20:10).<br><br>ואכלת את עשב השדה AND THOU SHALT EAT THE HERB OF THE FIELD — What curse is involved here? Was he not told as a blessing, (1:29) “Behold I have given unto you every herb yielding seed”? But what is stated here at the beginning of this passage? “Cursed be the ground etc.… in toil shalt thou eat of it.” And after all your toil “thorns and thistles shall it bring forth to thee”. This means when you sow it with cereals and vegetables it shall bring forth for you thorns and thistles and other weeds, and you will perforce have to eat them for lack of other food (Pirkei DeRabbi Eliezer 14). "}, {"ch": 3, "v": 19, "aliyah": 3, "heb": "בְּזֵעַ֤ת אַפֶּ֙יךָ֙ תֹּ֣אכַל לֶ֔חֶם עַ֤ד שֽׁוּבְךָ֙ אֶל־הָ֣אֲדָמָ֔ה כִּ֥י מִמֶּ֖נָּה לֻקָּ֑חְתָּ כִּֽי־עָפָ֣ר אַ֔תָּה וְאֶל־עָפָ֖ר תָּשֽׁוּב׃", "onk": "בְּזִעֲתָא דְאַפָּךְ תֵּיכוּל לַחְמָא עַד דְּתִיתוּב לְאַרְעָא דְּמִנַּהּ <b>אִתְבְּרֵיתָא<\/b> אֲרֵי עַפְרָא אַתְּ וּלְעַפְרָא תְּתוּב:", "onk_en": "By the sweat of your face you will eat bread, until you return to the ground for from it [the ground] were you taken [<b>created<\/b>]. For you are dust and to dust you shall return.", "pj": "בְּלֵיעוֹת כַּף יְדָךְ תֵּיכוֹל מְזוֹנָא עַד דְתֵיהֲדוֹר לְעַפְרָא דְמִינָהּ אִיתְבְּרִיאַת אֲרוּם עַפְרָא אַנְתְּ וּלְעַפְרָא תְּתוּב דְמִן עַפְרָא אַנְתְּ עָתִיד לְמֵיקוּם לְמִתַּן דִינָא וְחוּשְׁבְּנָא עַל כָּל מַה דַעֲבַדְתְּ בְּיוֹם דִינָא רַבָּא", "pj_en": "By the labour of thy hands thou shalt eat food, until thou turn again to the dust from which thou wast created: for dust thou art, and unto dust thou shalt return; for from the dust it is to be that thou art to arise, to render judgment and reckoning for all that thou hast done, in the day of the great judgment.", "tj": "", "tj_en": "", "rashi": "<b>בזעת אפיך.<\/b> לְאַחַר שֶׁתִּטְרַח בּוֹ הַרְבֵּה:", "rashi_en": "בזעת אפיך IN THE SWEAT OF THY FACE — after you have taken all this great trouble. "}, {"ch": 3, "v": 20, "aliyah": 3, "heb": "וַיִּקְרָ֧א הָֽאָדָ֛ם שֵׁ֥ם אִשְׁתּ֖וֹ חַוָּ֑ה כִּ֛י הִ֥וא הָֽיְתָ֖ה אֵ֥ם כׇּל־חָֽי׃", "onk": "וּקְרָא אָדָם שׁוּם אִתְּתֵהּ חַוָּה אֲרֵי הִיא הֲוַת אִמָּא דְכָל <b>בְּנֵי אֱנָשָׁא<\/b>:", "onk_en": "The man called his wife’s name Chavah, [Eve] because she had become the mother of all living [<b>people<\/b>].", "pj": "וּקְרָא אָדָם שׁוּם אִיתְּתֵיהּ חַוָה אֲרוּם הִיא הֲוַת אִימָא דְכָל בְּנֵי נְשָׁא", "pj_en": "And Adam called the name of his wife Hava, because she is the mother of all the children of men.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא האדם.<\/b> חָזַר הַכָּתוּב לְעִנְיָנוֹ הָרִאשׁוֹן וַיִּקְרָא הָאָדָם שֵׁמוֹת, וְלֹא הִפְסִיק אֶלָּא לְלַמֶּדְךָ שֶׁעַל יְדֵי קְרִיאַת שֵׁמוֹת נִזְדַּוְּגָה לוֹ חַוָּה, כְּמוֹ שֶׁכָּתוּב וּלְאָדָם לֹא מָצָא עֵזֶר כְּנֶגְדּוֹ, לְפִיכָךְ, וַיַּפֵּל תַּרְדֵּמָה, וְעַל יְדֵי שֶׁכָּתַב וַיִּהְיוּ עֲרוּמִּים, סָמַךְ לוֹ פָּרָשַׁת הַנָּחָשׁ, לְהוֹדִיעֲךְ שֶׁמִּתּוֹךְ שֶׁרָאָה עֶרְוָתָהּ וְרָאָה אוֹתָם עֲסוּקִים בְּתַשְׁמִישׁ נִתְאַוָּה לָהּ וּבָא עֲלֵיהֶם בְּמַחֲשָׁבָה וּבְמִרְמָה:<br><br><b>חוה.<\/b> נוֹפֵל עַל לְשׁוֹן חַיָּה, שֶׁמְּחַיָּה אֶת וַלְדוֹתֶיהָ, כַּאֲשֶׁר תֹּאמַר מֶה הֹוֶה לָאָדָם (קהלת ב'), בִּלְשׁוֹן הָיָה:", "rashi_en": "ויקרא האדם AND THE MAN CALLED — Scripture now reverts to its previous topic (Genesis 2:20) beginning with “and the man gave names”. It broke it off (that is, interpolated the story of the serpent) only to tell you that through the giving of names Eve became his mate, as it is written (Genesis 2:20) “but for Adam there was not found a help meet for him,” and that therefore “the [Lord God] caused to fall a deep sleep upon him” and formed Eve. But because Scripture writes at the end of the story of creation of Eve (Genesis 2:25), “and they were both naked”, it therefore follows on with the passage dealing with the serpent, to inform you that because he saw her nakedness and that they displayed no feeling of shame in their actions, he desired her, and he came upon them with his evil plan and with deceit.<br><br>חוה EVE — חוה has the same sound as חיה (and similar meaning “life”) — she was so called because she gives life (birth) to her children; the interchange of ‘י and ‘ו is similar to that in (Ecclesiastes 2:22), מה הוה לאדם “for what hath a man”, where הוה is used in the sense of היה “to be.” "}, {"ch": 3, "v": 21, "aliyah": 3, "heb": "וַיַּ֩עַשׂ֩ יְהֹוָ֨ה אֱלֹהִ֜ים לְאָדָ֧ם וּלְאִשְׁתּ֛וֹ כׇּתְנ֥וֹת ע֖וֹר וַיַּלְבִּשֵֽׁם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲבַד יְיָ אֱלֹהִים לְאָדָם וּלְאִתְּתֵהּ <b>לְבוּשִׁין דִּיקָר עַל מְשַׁךְ בִּשְׂרֵיהוֹן<\/b> וְאַלְבִּישִׁינוּן:", "onk_en": "And Adonoy Elohim made for Adam and his wife leather coats [<b>garments of honor on the skin of their flesh<\/b>] and He clothed them.", "pj": "וְעָבַד יְיָ אֱלהִים לְאָדָם וּלְאִינְתְּתֵיהּ לְבוּשִׁין דִיקָר מִן מְשַׁךְ חִיוְיָא דְאַשְׁלַח מִנֵיהּ עַל מְשַׁךְ בִּשְרֵיהוֹן חֲלַף שׁוֹפְרֵיהוֹן דְאִשְׁתַּלְחוּ וְאַלְבֵּישִׁינוּן", "pj_en": "And the Lord God made to Adam and to his wife vestures of honour from the skin of the serpent, which he had cast from him, upon the skin of their flesh, instead of that adornment which had been cast away; and He clothed them.", "tj": "", "tj_en": "", "rashi": "<b>כתנות עור.<\/b> יֵשׁ דִּבְרֵי אַגָּדָה אוֹמְרִים חֲלָקִים כְּצִּפֹּרֶן הָיוּ מְדֻבָּקִים עַל עוֹרָן וְיֵ\"אֹ דָּבָר הַבָּא מִן הָעוֹר, כְּגוֹן צֶמֶר הָאַרְנָבִים שֶׁהוּא רַךְ וְחָם וְעָשָׂה לָהֶם כֻּתֳּנוֹת מִמֶּנּוּ:", "rashi_en": "כתנות עור GARMENTS FOR THE SKIN — There are Agadoth which say that they were smooth as fingernails, cleaving to their skin; whereas some say that they were made of material that comes from skin, as for example, the hair of hares which is soft and warm, and of this He made garments for them (Genesis Rabbah 20:12). "}, {"ch": 3, "v": 22, "aliyah": 4, "heb": "וַיֹּ֣אמֶר&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהִ֗ים הֵ֤ן הָֽאָדָם֙ הָיָה֙ כְּאַחַ֣ד מִמֶּ֔נּוּ לָדַ֖עַת ט֣וֹב וָרָ֑ע וְעַתָּ֣ה&thinsp;<b>׀<\/b> פֶּן־יִשְׁלַ֣ח יָד֗וֹ וְלָקַח֙ גַּ֚ם מֵעֵ֣ץ הַֽחַיִּ֔ים וְאָכַ֖ל וָחַ֥י לְעֹלָֽם׃", "onk": "וַאֲמַר יְיָ אֱלֹהִים הָא אָדָם הֲוָה <b>יְחִידַי בְּעַלְמָא מִנֵּהּ<\/b> לְמִידַע טַב וּבִישׁ וּכְעַן דִּילְמָא יוֹשִׁיט יְדֵהּ וְיִסַּב אַף מֵאִילָן חַיָּיא וְיֵכוּל וִיחֵי לְעָלָם:", "onk_en": "Adonoy Elohim said, Behold, the man has become like one of us [<b>unique. It is for him<\/b>] to know [what is] good and [what is] evil. Now he must be prevented from reaching out his hand and also taking from the Tree of Life and eat [from it] and live forever.", "pj": "וַאֲמַר יְיָ אֱלהִים לְמַלְאָכַיָא דִי מְשַׁמְשִׁין קֳדָמוֹי הָא אָדָם הֲוָה יְחִידִי בְּאַרְעָא הֵיכְמָא דַאֲנָא יְחִידִי בִּשְׁמֵי מְרוֹמָא וַעֲתִידִין לְמֵיקוּם מִינֵהּ דְיַדְעוּן לְמַפְרְשָׁא בֵּין טַב לְבִישׁ אִלוּ נָטַר מִצְוָותָא דִפְקִידְתֵּיהּ אִית הוּא חַי וְקַיָים בְּאִילָן חַיָיא עַד לְעַלְמִין וּכְדוֹן עַד דְלָא נְטַר מַה דְפַקִידְתֵּיהּ נִגְזוֹר עֲלוֹהִי וְנִטְרְדֵיהּ מִן גִנְתָא דְעֵדֶן קֳדָם עַד לָא יִפְשׁוֹט יְדֵיהּ וְיִסַב מִן פֵּירֵי אִילַן חַיָיא דְהָא אִין אָכִיל הוּא מִנֵיהּ הֲוֵי חַי וְקַיָם עַד לְעַלְמִין", "pj_en": "And the Lord God said to the angels who ministered before Him, Behold, Adam is sole on the earth, as I am sole in the heavens above; and it will be that they will arise from him who will know to discern between good and evil. Had he kept the commandments which I appointed to him, he would have lived and subsisted as the tree of life for ever. But now, because he hath not kept that which I prescribed, it is decreed against him that we keep him from the garden of Eden, before he reach forth his hand and take of the tree of life: for, behold, if he eat thereof, living he will live and subsist for ever.", "tj": "וַאֲמַר מֵימְרָא דַיְיָ אֱלהִים הָא אָדָם דְבָרִית יָתֵיהּ יְחִידִי בְּגוֹי עַלְמֵי הֵיךְ מַה דְאֲנָא יְחִידִי בִּשְׁמֵי מְרוֹמָא עֲתִידִין אוּמִין סַגִיאִין לְמֵיקַם מִינֵיהּ מִינֵיהּ תְקוּם אוּמָה דְיַדְעָה לְמִפְרְשָׁא בֵּין טַב לְבִישׁ וּכְדוּן טַב דְנִטְרוֹד יָתֵיהּ מִן גִינְתָא דְעֵדֶן מִן קֳדָם עַד לָא יִפְשׁוֹט יְדֵיהּ וְיִסַב לְחוֹד מִן פֵּירֵי אִילָנָא חַיָיא וְיֵכוֹל וְיֶחִי לַעֲלָם:", "tj_en": "And the Word of the Lord God said, Behold, Adam whom I have created is sole in my world, as I am sole in the heavens above. It is to be that a great people are to arise from him; from him will arise a people who will know how to discern between good and evil. And now it is good that we keep him from the garden of Eden before he stretch forth his hand and take also of the fruit of the tree of life, and eat, and live for ever.", "rashi": "<b>היה כאחד ממנו.<\/b> הֲרֵי הוּא יָחִיד בַּתַּחְתּוֹנִים כְּמוֹ שֶׁאֲנִי יָחִיד בָּעֶלְיוֹנִים, וּמַה הִיא יְחִידוּתוֹ? לָדַעַת טוֹב וָרָע, מַה שֶּׁאֵין כֵּן בִּבְהֵמָה וְחַיָּה<br><br><b>ועתה פן ישלח ידו.<\/b> וּמִשֶּׁיִּחְיֶה לְעוֹלָם הֲרֵי הוּא קָרוֹב לְהַטְעוֹת הַבְּרִיּוֹת אַחֲרָיו, וְלוֹמַר אַף הוּא אֱלוֹהַּ. וְיֵשׁ מִדְרְשֵׁי אַגָּדָה, אֲבָל אֵין מְיֻשָּׁבִין עַל פְּשׁוּטוֹ:", "rashi_en": "היה כאחד ממנו  IS BECOME LIKE ONE OF US (or, like the Being who is One, Unique amongst us) — Lo, he is unique among the terrestrial ones, even as I am unique among the celestial ones. And in what does his uniqueness consist? In knowing good and evil, which is not so in the case of cattle and beasts (Genesis Rabbah 21:5).<br><br>ועתה פן ישלח ידו AND NOW, LEST HE PUT FORTH HIS HAND… [AND EAT AND LIVE FOR EVER] — And if he does live forever he is likely to lead people astray, so that they may say, “He, also, is a god”; there are also Agadic Midrashim, but they are not in keeping with its (the verse’s) plain sense. "}, {"ch": 3, "v": 23, "aliyah": 4, "heb": "וַֽיְשַׁלְּחֵ֛הוּ יְהֹוָ֥ה אֱלֹהִ֖ים מִגַּן־עֵ֑דֶן לַֽעֲבֹד֙ אֶת־הָ֣אֲדָמָ֔ה אֲשֶׁ֥ר לֻקַּ֖ח מִשָּֽׁם׃", "onk": "וְשַׁלְּחֵהּ יְיָ אֱלֹהִים מִגִּינְתָא דְעֵדֶן לְמִפְלַח יַת אַדְמְתָא <b>דְּאִתְבְּרִי<\/b> מִתַּמָּן:", "onk_en": "[Therefore] Adonoy Elohim sent him out of the Garden of Eden, to till the soil from which he was taken [<b>created<\/b>].", "pj": "וְתַרְכֵיהּ יְיָ אֱלהִים מִגִנְתָא דְעֵדֶן וְאָזַל וְיָתִיב בְּטוּר מוֹרִיָה לְמִפְלַח יַת אַדְמָתָא דְאִתְבְּרִי מִתַּמָן", "pj_en": "And the Lord God removed him from the garden of Eden; and he went and dwelt on Mount Moriah, to cultivate the ground from which he had been created.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 24, "aliyah": 4, "heb": "וַיְגָ֖רֶשׁ אֶת־הָֽאָדָ֑ם וַיַּשְׁכֵּן֩ מִקֶּ֨דֶם לְגַן־עֵ֜דֶן אֶת־הַכְּרֻבִ֗ים וְאֵ֨ת לַ֤הַט הַחֶ֙רֶב֙ הַמִּתְהַפֶּ֔כֶת לִשְׁמֹ֕ר אֶת־דֶּ֖רֶךְ עֵ֥ץ הַֽחַיִּֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&
