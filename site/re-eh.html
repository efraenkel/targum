קְרֵבָה? הָא לָמַדְתָּ שֶׁבַע שָׁנִים לְמִנְיַן הַשְּׁמִטָּה (ספרי):", "rashi_en": "מקץ שבע שנים AT THE END OF SEVEN YEARS [THOU SHALT MAKE A REMISSION] — One might think that this means seven years after each individual loan! Scripture, however, states, (v. 9) “[Take heed unto thyself lest there be in thy heart a word of worthlessness, saying], The seventh year … approacheth [and thine eye be evil against thy brother and thou givest him nought]”! Now, if you say that the seven years spoken of here mean seven years after each individual loan, i.e., after the granting of the loan to each individual person, how can one say, at the time the request for a loan is being made, “it (the seventh year) is coming near?” Consequently you must learn from this that Scripture means seven years according to the reckoning of the Sh’mitta-period (Sifrei Devarim 111:8)."}, {"ch": 15, "v": 2, "aliyah": 6, "heb": "וְזֶה֮ דְּבַ֣ר הַשְּׁמִטָּה֒ שָׁמ֗וֹט כׇּל־בַּ֙עַל֙ מַשֵּׁ֣ה יָד֔וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּרֵעֵ֑הוּ לֹֽא־יִגֹּ֤שׂ אֶת־רֵעֵ֙הוּ֙ וְאֶת־אָחִ֔יו כִּֽי־קָרָ֥א שְׁמִטָּ֖ה לַיהֹוָֽה׃", "onk": "וְדֵין פִּתְגַּם שְׁמִטְּתָא דְּתַשְׁמֵט כָּל גְּבַר מָרֵי <b>רְשׁוּ<\/b> דִּי יַרְשֵׁי בְּחַבְרֵיהּ לָא יִתְבַּע מִן חַבְרֵיהּ וּמִן אֲחוּהִי אֲרֵי קְרָא שְׁמִטְּתָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "And this is the statement of <i>shemitah:<\/i> suspend every creditor’s hand from his loan to his neighbor; he will not claim [it] from his neighbor or his brother because it was proclaimed <i>shemitah<\/i> to [<b>before<\/b>] Adonoy.", "pj": "וְדֵין אַהֲוָויַת הִלְכַת שְׁמִיטָתָא אַשְׁמִיטוּ כָּל בַּר נַשׁ מָרֵי מְזוֹפְתָּא דְיִזוֹף בְּחַבְרֵיהּ לֵית לֵיהּ רְשׁוּ לִמְדַחֲקָא בְּחַבְרֵיהּ לְמִתְבּוֹעַ אוֹזְפוּתֵיהּ וְלָא מִן אָחוֹי בַּר יִשְרָאֵל אֲרוּם קָרָא בֵית דִּינָא שְׁמִיטָתָא קֳדָם יְיָ", "pj_en": "And this is the indication of the custom of the Release: Every man who is master of a loan, who lendeth to his neighbour, shall give remission. He shall not have power to coerce his neighbour in demanding his loan, nor of his brother, a son of Israel; because the beth din hath published the Release before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>שמוט כל בעל משה ידו.<\/b> שָׁמוֹט אֶת יָדוֹ שֶׁל כָּל בַּעַל מַשֶּׁה:", "rashi_en": "שמוט כל בעל משה ידו means as much as שמוט את ידו של כל בעל משה THERE SHALL BE A RELAXING OF THE HAND OF EVERY CREDITOR."}, {"ch": 15, "v": 3, "aliyah": 6, "heb": "אֶת־הַנׇּכְרִ֖י תִּגֹּ֑שׂ וַאֲשֶׁ֨ר יִהְיֶ֥ה לְךָ֛ אֶת־אָחִ֖יךָ תַּשְׁמֵ֥ט יָדֶֽךָ׃", "onk": "מִן <b>בַּר עַמְמִין<\/b> תִּתְבַּע וְדִי יְהֵי לָךְ עִם אָחוּךְ תַּשְׁמֵט יְדָךְ:", "onk_en": "You should demand payment from the stranger [<b>foreigner<\/b>], but what you have with your brother your hand will relinquish.", "pj": "יַת בַּר עַמְמִין תִּדְחוֹק וְדִינָא דִי יֶהֱוֵי לָךְ עִם אָחוּךְ תַּשְׁמֵיט יְדָךְ", "pj_en": "From a son of the Gentiles thou mayest exact, but the lawful right (dina) which is thine with thy brother thou shalt release with thine hand.", "tj": "", "tj_en": "", "rashi": "<b>את הנכרי תגש.<\/b> זוֹ מִצְוַת עֲשֵׂה (שם):", "rashi_en": "את הנכרי תגוש OF ANY ALIEN THOU MAYEST EXACT IT AGAIN — This implies a positive command (Sifrei Devarim 113:1)."}, {"ch": 15, "v": 4, "aliyah": 6, "heb": "אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה־בְּךָ֖ אֶבְי֑וֹן כִּֽי־בָרֵ֤ךְ יְבָֽרֶכְךָ֙ יְהֹוָ֔ה בָּאָ֕רֶץ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹֽתֵן־לְךָ֥ נַחֲלָ֖ה לְרִשְׁתָּֽהּ׃", "onk": "לְחוֹד אֲרֵי לָא יְהֵי בָךְ מִסְכֵּנָא אֲרֵי בָרָכָא יְבָרֵכִנָּךְ יְיָ בְּאַרְעָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא לְמֵירְתַהּ:", "onk_en": "End it [poverty], so that there will be no one, destitute among you when Adonoy will surely bless you in the land that Adonoy, your God, is giving you as territory to inherit.", "pj": "לְחוֹד אִין אַתּוּן עֲסִיקִין בְּמִצְוָתָא דְאוֹרַיְיתָא לָא יֶהֱוֵי בְכוֹן מַסְכְּנָא אֲרוּם בְּרָכָא יְבָרְכֵכוּן יְיָ בְּאַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן אַחְסָנָא לְמֵירְתָהּ", "pj_en": "If you will only be diligent in the precepts of the law, there will be no poor among you; for, blessing, the Lord will bless you in the land which the Lord your God will give you for a possession to inherit;", "tj": "", "tj_en": "", "rashi": "<b>אפס כי לא יהיה בך אביון.<\/b> וּלְהַלָּן הוּא אוֹמֵר \"כִּי לֹא יֶחְדַּל אֶבְיוֹן\"? אֶלָּא בִּזְמַן שֶׁאַתֶּם עוֹשִׂים רְצוֹנוֹ שֶׁל מָקוֹם אֶבְיוֹנִים בַּאֲחֵרִים וְלֹא בָכֶם, וּכְשֶׁאֵין אַתֶּם עוֹשִׂים רְצוֹנוֹ שֶׁל מָקוֹם אֶבְיוֹנִים בָּכֶם:<br><br><b>אביון.<\/b> דַּל מֵעָנִי, וּלְשׁוֹן אֶבְיוֹן שֶׁהוּא תָּאֵב לְכָל דָּבָר (עי' ויקרא רבה ל\"ד):", "rashi_en": "אפס כי לא יהיה בך אביון HOWBEIT THERE SHALL BE NO NEEDY AMONG YOU — But further on (v. 11) it states, “For the needy shall never cease out of the land”! But the explanation is: When you do the will of the Omnipresent the needy will be amongst the others and not amongst you, if, however, you do not the will of the Omnipresent, the needy will be amongst you (Sifrei Devarim 114:1).<br><br>אביון denotes a person who is more destitute than an עני. The term אביון (from the root אבה “to long for”, “to desire”; cf. Rashi on Exodus 23:6) denotes one who longs for everything (because he lacks everything) (Leviticus Rabbah 34:6)."}, {"ch": 15, "v": 5, "aliyah": 6, "heb": "רַ֚ק אִם־שָׁמ֣וֹעַ תִּשְׁמַ֔ע בְּק֖וֹל יְהֹוָ֣ה אֱלֹהֶ֑יךָ לִשְׁמֹ֤ר לַעֲשׂוֹת֙ אֶת־כׇּל־הַמִּצְוָ֣ה הַזֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּֽוֹם׃", "onk": "לְחוֹד אִם <b>קַבָּלָא תְקַבֵּל לְמֵימְרָא<\/b> דַּיְיָ אֱלָהָךְ לְמִטַּר לְמֶעְבַּד יָת כָּל תַּפְקֶדְתָּא הָדָא דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין:", "onk_en": "Only if you will listen to [<b>heed<\/b>] the voice [<b>word<\/b>] of Adonoy, your God, to guard to fulfill this entire <i>mitzvah<\/i> that I am commanding you today.", "pj": "לְחוֹד אִין קַבָּלָא תְקַבְּלוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן לְמִנְטוֹר וּלְמֶעֱבַד יַת כָּל תַּפְקֵידְתָּא הָדָא דַאֲנָא מְפַקֵּיד לְכוֹן יוֹמָא דֵין", "pj_en": "if, obeying, you will only obey the Word of the Lord your God, to observe and do all these commandments which I command you this day.", "tj": "", "tj_en": "", "rashi": "<b>רק אם שמוע תשמע.<\/b> אָז <b>לא יהיה בך אביון<\/b>:<br><br><b>שמוע תשמע.<\/b> שָׁמַע קִמְעָא מַשְׁמִיעִין אוֹתוֹ הַרְבֵּה (ספרי):", "rashi_en": "רק אם שמוע תשמע ONLY IF THOU WILT CAREFULLY HEARKEN [UNTO THE VOICE OF THE LORD THY GOD] — then לא יהיה בך אביון THERE SHALL BE NO NEEDY AMONGST YOU. <br><br>שמוע תשמע [IF] THOU WILT CAREFULLY HEARKEN — The repetition of the verbal form suggests: If one listens a little (if one shows the determination to obey) he is caused to listen to many things (he gradually becomes obedient to every divine command) (Sifrei Devarim 115:1; cf. Rashi on Deuteronomy 11:13)."}, {"ch": 15, "v": 6, "aliyah": 6, "heb": "כִּֽי־יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ בֵּֽרַכְךָ֔ כַּאֲשֶׁ֖ר דִּבֶּר־לָ֑ךְ וְהַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְאַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּמָֽשַׁלְתָּ֙ בְּגוֹיִ֣ם רַבִּ֔ים וּבְךָ֖ לֹ֥א יִמְשֹֽׁלוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי יְיָ אֱלָהָךְ בָּרְכָךְ כְּמָא דִּי מַלִּיל לָךְ וְתוֹזֵף לְעַמְמִין סַגִּיאִין וְאַתְּ לָא תְזוּף וְתִשְׁלוֹט בְּעַמְמִין סַגִּיאִין וּבָךְ לָא יִשְׁלְטוּן:", "onk_en": "When Adonoy, your God, blesses you just as He told you, you will grant loans to nations but you will not borrow; and you will rule over many nations, but over you they will not rule.", "pj": "אֲרוּם יְיָ אֱלָהָכוֹן בֵּירַכְכוֹן הֵיכְמָא דְמַלֵּיל לְכוֹן וּתְמַשְׁכְּנוּן עַמְמִין סַגִּיאִין וְאַתּוּן לָא תִתְמַשְׁכְּנוּן וְתִשְׁלְטוּן בְּעַמְמִין סַגִּיאִין וּבְכוֹן לָא יִשְׁלְטוּן", "pj_en": "For the Lord your God blesseth you, as He saith to you (that) you shall take from many nations, but they will not take from you; and you will have power over many nations, but they shall not have power over you.", "tj": "", "tj_en": "", "rashi": "<b>כאשר דבר לך.<\/b> וְהֵיכָן דִּבֵּר? (דברים כ\"ח) בָּרוּךְ אַתָּה בָּעִיר (ספרי):<br><br><b>והעבטת.<\/b> כָּל לְשׁוֹן הַלְוָאָה כְּשֶׁנּוֹפֵל עַל הַמַּלְוֶה נוֹפֵל בִּלְשׁוֹן מַפְעִיל, כְּגוֹן וְהִלְוִיתָ, וְהַעֲבַטְתָּ. וְאִם הָיָה אוֹמֵר וְעָבַטְתָּ הָיָה נוֹפֵל עַל הַלֹּוֶה, כְּמוֹ וְלָוִיתָ:<br><br><b>והעבטת גוים.<\/b> יָכוֹל שֶׁתְּהֵא לֹוֶה מִזֶּה וּמַלְוֶה לָזֶה, תַּ\"לֹ \"וְאַתָּה לֹא תַעֲבֹט\":<br><br><b>ומשלת בגוים רבים.<\/b> יָכוֹל גוֹיִם אֲחֵרִים מוֹשְׁלִים עָלֶיךָ, תַּ\"לֹ \"וּבְךָ לֹא יִמְשֹׁלוּ\" (שם):", "rashi_en": "כאשר דבר לך [FOR THE LORD GOD BLESSETH THEE] AS HE PROMISED THEE — and where did He promise you this? In the statement, (Deuteronomy 28:3—12) “Blessed shalt thou be in the city, etc.” (Sifrei Devarim 116:1).<br><br>והעבטת AND THOU SHALT LEND ON PLEDGE — In the case of every term that denotes transacting a loan when it refers to the lender, the Hiphil form is appropriate to it (to cause a person to do something: here, “you will make many people to be borrowers” i.e. you will lend to them), as for instance, והעבטת, והלוית; while if it stated וְעָבַטְתָּ (in the Kal), it would apply to the borrower, meaning “thou wilt borrow on pledge”, the same as ולוית (“and thou will borrow”, which in Kal refers to the borrower).<br><br>והעבטת גוים AND THOU SHALT LEND ON PLEDGE UNTO [MANY] NATIONS — One might think that you might do this in that you will borrow from one nation and lend to another! Scripture, however, states, “but you shall not borrow” (Sifrei Devarim 116:2).<br><br>ומשלת בגוים רבים AND THOU SHALT RULE OVER MANY NATIONS — One might think that at the very same time other nations will be ruling over you! Scripture, however, states, “but they shall not rule over you (Sifrei Devarim 116:3)."}, {"ch": 15, "v": 7, "aliyah": 6, "heb": "כִּֽי־יִהְיֶה֩ בְךָ֨ אֶבְי֜וֹן מֵאַחַ֤ד אַחֶ֙יךָ֙ בְּאַחַ֣ד שְׁעָרֶ֔יךָ בְּאַ֨רְצְךָ֔ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֣ן לָ֑ךְ לֹ֧א תְאַמֵּ֣ץ אֶת־לְבָבְךָ֗ וְלֹ֤א תִקְפֹּץ֙ אֶת־יָ֣דְךָ֔ מֵאָחִ֖יךָ הָאֶבְיֽוֹן׃", "onk": "אֲרֵי יְהֵי בָךְ מִסְכֵּנָא חַד מֵאַחָיךְ בַּחֲדָא מִקִּרְוָיךְ בְּאַרְעָךְ דַּיְיָ אֱלָהָךְ יָהֵב לָךְ לָא תַתְקֵף יָת לִבָּךְ וְלָא תִקְפֹּץ יָת יְדָךְ מֵאֲחוּךְ מִסְכֵּנָא:", "onk_en": "If there should be someone destitute in your midst among one of your brothers in one of your cities, in your land that Adonoy, your God, is giving you; do not harden your heart and do not close your hand against your destitute brother.", "pj": "וְאִין לֵיתֵיכוֹן עֲסִיקִין בְּמִצְוָותָא דְאוֹרַיְיתָא וְיֶהֱוֵי בְּכוֹן מַסְכְּנָא מֵחַד אָחוּךְ בַּחֲדָא מִן קִרְוָוךְ בְּאַרְעָךְ דַיְיָ אֱלָהָךְ יָהֵיב לָךְ לָא תִתְקַף יַת לְבָבָךְ וְלָא תִמְנַע יַת אִידָךְ מֵאָחוּךְ מַסְכְּנָא", "pj_en": "But if you be not diligent in the precepts of the law, and there be among you a poor man in one of thy cities of the land which the Lord thy God giveth thee, thou shalt not harden thy heart, nor hold back thy hand from thy poor brother;", "tj": "", "tj_en": "", "rashi": "<b>כי יהיה בך אביון.<\/b> הַתָּאֵב תָּאֵב קוֹדֵם:<br><br><b>מאחד אחיך.<\/b> אָחִיךָ מֵאָבִיךָ קוֹדֵם לְאָחִיךָ מֵאִמְּךָ:<br><br><b>שעריך.<\/b> עֲנִיֵּי עִירְךָ קוֹדְמִים לַעֲנִיֵּי עִיר אַחֶרֶת:<br><br><b>לא תאמץ.<\/b> יֵשׁ לְךָ אָדָם שֶׁמִּצְטַעֵר אִם יִתֵּן אִם לֹא יִתֵּן, לְכָךְ נֶאֱמַר \"לֹא תְאַמֵּץ\". יֵשׁ לְךָ שֶׁפּוֹשֵׁט אֶת יָדוֹ וְקוֹפְצָהּ, לְכָךְ נֶאֱמַר \"לֹא תִקְפֹּץ\" (שם):<br><br><b>מאחיך האביון.<\/b> אִם לֹא תִתֵּן לוֹ, סוֹפְךָ לִהְיוֹת אָחִיו שֶׁל אֶבְיוֹן (שם):", "rashi_en": "כי יהיה בך אביון IF THERE BE AMONG YOU A NEEDY MAN — The most needy has preference (Sifrei Devarim 116:4);<br><br>מאחד אחיך ONE OF THY BRETHREN — thy brother on thy fathers side has preference over thy brother on thy mother’s side (Sifrei Devarim 116:5);<br><br>שעריך [WITHIN ANY OF] THY GATES — this implies that the poor of thine own city have preference over the poor of another city (Sifrei Devarim 116:6; cf. Rashi on Exodus 22:24).<br><br>לא תאמץ THOU SHALT NOT MAKE [THY HEART] OBSTINATE — There are people who painfully deliberate whether they should give or not, therefore Scripture states, “thou shalt not make thy heart obstinate”; there again are people who stretch their hand forth (show readiness to give) but then close it, therefore it is written, “thou shalt not close thine hand” (Sifrei Devarim 116:10-11).<br><br>מאחיך מאביון [NOR CLOSE THINE HAND] FROM THY NEEDY BROTHER — If you will not give him you will become in the end a brother of the needy (become as needy as himself) (cf. Sifrei Devarim 116:12)."}, {"ch": 15, "v": 8, "aliyah": 6, "heb": "כִּֽי־פָתֹ֧חַ תִּפְתַּ֛ח אֶת־יָדְךָ֖ ל֑וֹ וְהַעֲבֵט֙ תַּעֲבִיטֶ֔נּוּ דֵּ֚י מַחְסֹר֔וֹ אֲשֶׁ֥ר יֶחְסַ֖ר לֽוֹ׃", "onk": "אֶלָּא מִפְתַּח תִּפְתַּח יָת יְדָךְ לֵיהּ וְאוֹזָפָא תּוֹזְפִנֵּיהּ <b>כְּמִסַּת<\/b> חֶסְרוֹנֵיהּ דְּיַחֲסִיר לֵיהּ:", "onk_en": "Rather, you must surely open your hand generously to him, and you must surely extend a loan to him to cover the wants [<b>the measure of that<\/b>] which he lacks.", "pj": "אֶלָא מִפְתַּח תִּפְתַּח יַת אִידָךְ לֵיהּ וּמוּזְפָא תוּזְפִינֵיהּ הֵי כְּמֵיסַת חוּסְרָנֵיהּ דְּיֶיחְסַר לֵיהּ", "pj_en": "but thou shalt open thy hand to him, and lend to him according to the measure of his want through which he is in need.", "tj": "", "tj_en": "", "rashi": "<b>פתח תפתח.<\/b> אֲפִלּוּ כַמָּה פְעָמִים (שם):<br><br><b>כי פתח תפתח.<\/b> הֲרֵי כִי מְשַׁמֵּשׁ בִּלְשׁוֹן אֶלָּא:<br><br><b>והעבט תעביטנו.<\/b> אִם לֹא רָצָה בְמַתָּנָה תֵּן לוֹ בְּהַלְוָאָה (עי' שם; כתובות ס\"ז):<br><br><b>די מחסרו.<\/b> וְאִי אַתָּה מְצֻוֶּה לְהַעֲשִׁירוֹ:<br><br><b>אשר יחסר לו.<\/b> אֲפִלּוּ סוּס לִרְכֹּב עָלָיו וְעֶבֶד לָרוּץ לְפָנָיו (שם):<br><br><b>לו.<\/b> זוֹ אִשָּׁה וְכֵן הוּא אוֹמֵר (בראשית ב') אֶעֱשֶׂה לּוֹ עֵזֶר כְּנֶגְדּוֹ (ספרי):", "rashi_en": "פתח תפתח [BUT] THOU SHALT SURELY OPEN [THINE HAND] — even many times (Sifrei Devarim 116:13).<br><br>כי פתח תפתח BUT THOU SHALT SURELY OPEN [THINE HAND] — Here, you see, the word כי has the meaning of “but” (whilst e.g.. in v. 7 it means “if”, in v. 10 “because”).<br><br>והעבט תעביטנו AND THOU SHALT LEND HIM ON PLEDGE — If he does not want a gift, give it to him as a loan (cf. Sifrei Devarim 116:14; Ketubot 67b).<br><br>די מחסרו [LEND HIM ON PLEDGE] SUFFICIENT FOR HIS NEED — but you are not commanded to make him rich.<br><br>אשר יחסר לו [SUFFICIENT FOR HIS NEED] IN THAT WHICH HE LACKETH — This implies: you must provide him even with a horse to ride on and a slave to run before him (if he was accustomed to such and now feels the lack of them) (Sifrei Devarim 116:16; Ketubot 67b).<br><br>לו — implies that you must help him even to get a wife; for so it states. אעשה לו עזר כנגדו “I will make a helpmate for him (לו)”  (Sifrei Devarim 116:17; Ketubot 67b)."}, {"ch": 15, "v": 9, "aliyah": 6, "heb": "הִשָּׁ֣מֶר לְךָ֡ פֶּן־יִהְיֶ֣ה דָבָר֩ עִם־לְבָבְךָ֨ בְלִיַּ֜עַל לֵאמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת־הַשֶּׁ֘בַע֮ שְׁנַ֣ת הַשְּׁמִטָּה֒ וְרָעָ֣ה עֵֽינְךָ֗ בְּאָחִ֙יךָ֙ הָֽאֶבְי֔וֹן וְלֹ֥א תִתֵּ֖ן ל֑וֹ וְקָרָ֤א עָלֶ֙יךָ֙ אֶל־יְהֹוָ֔ה וְהָיָ֥ה בְךָ֖ חֵֽטְא׃", "onk": "אִסְתַּמַּר לָךְ דִּילְמָא יְהֵי פִתְגָּם עִם לִבָּךְ בִּרְשַׁע לְמֵימַר קְרִיבָא שַׁתָּא שְׁבִיעֲתָא שַׁתָּא דִשְׁמִטְּתָא וְתַבְאֵשׁ עֵינָךְ בְּאָחוּךְ מִסְכֵּנָא וְלָא תִתֵּן לֵיהּ וְיִקְרֵי עֲלָךְ קֳדָם יְיָ וִיהֵי בָךְ חוֹבָא:", "onk_en": "Look out for yourself lest there be an evil thought in your mind, saying, ‘‘The seventh year is approaching, the <i>shemitah<\/i> year,’’ and you will look askance at your destitute brother and will not give him; and if he cries out concerning you to Adonoy, you will be regarded as sinful.", "pj": "אִסְתַּמָּרוּ לְכוֹן דִּלְמָא יְהֵי פִּתְגָם עִם לִבְּכוֹן דְּזָדָנוּתָא לְמֵימָר קְרֵיבַת שַׁתָּא שְׁבִיעֲתָא שַׁתָּא דִשְׁמִיטְתָא וְתִבְאַשׁ עֵינֵיכוֹן בְּאָחוּכוֹן מִסְכֵּנָא וְלָא תִתְּנוּן לֵיהּ וְיִקְבּוֹל עֲלֵיכוֹן קֳדָם יְיָ וִיהֵי בְּכוֹן חוֹבָא", "pj_en": "Beware lest there be a word in thy proud heart, saying: The seventh year, the year of release, is at hand, and your eye become evil toward your poor brother, so as to be not willing to give to him, and he cry against you to the Lord, and there be guilt upon you.", "tj": "", "tj_en": "", "rashi": "<b>וקרא עליך.<\/b> יָכוֹל מִצְוָה, תַּ\"לֹ וְלֹא יִקְרָא:<br><br><b>והיה בך חטא.<\/b> מִכָּל מָקוֹם, אֲפִלּוּ לֹא יִקְרָא. אִם כֵּן לָמָּה נֶאֱמַר \"וְקָרָא עָלֶיךָ\"? מְמַהֵר אֲנִי לִפָּרַע עַל יְדֵי הַקּוֹרֵא יוֹתֵר מִמִּי שֶׁאֵינוֹ קוֹרֵא (שם):", "rashi_en": "וקרא עליך AND HE CRY [UNTO THE LORD] AGAINST THEE — One might think this is a command (“he shall call against thee”). Scripture, however, states, (Deuteronomy 24:15) “[At his day thou shalt give him his hire … he is poor], so that he may not call against thee [unto the Lord]” (Sifrei Devarim 117:5).<br><br>והיה בך חטא AND IT BE SIN UNTO THEE — under any circumstances, even if he does not cry against thee. But if this be so, to what end is it written “and he cry against thee”? It suggests that I will make greater haste to punish thee because of him who cries, than because of one who does not cry (Sifrei Devarim 117:5)."}, {"ch": 15, "v": 10, "aliyah": 6, "heb": "נָת֤וֹן תִּתֵּן֙ ל֔וֹ וְלֹא־יֵרַ֥ע לְבָבְךָ֖ בְּתִתְּךָ֣ ל֑וֹ כִּ֞י בִּגְלַ֣ל&thinsp;<b>׀<\/b> הַדָּבָ֣ר הַזֶּ֗ה יְבָרֶכְךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּכׇֽל־מַעֲשֶׂ֔ךָ וּבְכֹ֖ל מִשְׁלַ֥ח יָדֶֽךָ׃", "onk": "מִתַּן תִּתֵּן לֵיהּ וְלָא יַבְאֵשׁ לִבָּךְ בְּמִתְּנָךְ לֵיהּ אֲרֵי בְּדִיל פִּתְגָּמָא הָדֵין יְבָרֵכִנָּךְ יְיָ אֱלָהָךְ בְּכָל עוֹבָדָךְ וּבְכֹל אוֹשָׁטוּת יְדָךְ:", "onk_en": "You must surely give him, and let your heart not hurt when you give him; for, as a consequence of this thing, Adonoy, your God, will bless you in all your work and in all your commerce.", "pj": "מִתַּן תִּתְּנוּן לֵיהּ וְלָא יִבְאַשׁ לִבְּכוֹן בְּתִתְּנְכוֹן לֵיהּ אֲרוּם מְטוּל פִּתְגָמָא הָדֵין יְבָרְכֵיכוֹן יְיָ אֱלָהָכוֹן בְּכָל עוֹבָדֵיכוֹן וּבְכָל אוֹשָׁטוּת יְדֵיכוֹן", "pj_en": "Giving you shall give to him, nor shall your heart be evil when you give to him; for on account of this matter the Lord your God will bless you in all your works that you put your hands unto.", "tj": "מִתַּן תִּתְּנוּן לֵיהּ לָא יִבְאַשׁ בְּאַפֵּיכוֹן בִּזְמַן תִּתְּנוּן לֵיהּ:", "tj_en": "Giving thou shalt give to him, nor let your looks be evil at the time you give to him.", "rashi": "<b>נתון תתן לו.<\/b> אֲפִלּוּ מֵאָה פְעָמִים:<br><br><b>לו.<\/b> בֵּינוֹ וּבֵינְךָ:<br><br><b>כי בגלל הדבר.<\/b> אֲפִלּוּ אָמַרְתָּ לִתֵּן, אַתָּה נוֹטֵל שְׂכַר הָאֲמִירָה עִם שְׂכַר הַמַּעֲשֶׂה (שם):", "rashi_en": "נתן תתן לו THOU SHALT SURELY GIVE HIM — even hundred times (Sifrei Devarim 117:6).<br><br>לו implies between him and you (privately) (Sifrei Devarim 117:7.)<br><br>כי בגלל הדבר הזה BECAUSE THAT FOR THIS THING [THE LORD THY GOD SHALL BLESS THEE] — (the word is taken in its literal sense of “word”, for it would have sufficed to state כי בגלל זה suggesting): even if you only say (intend) to give but are later unable to do so you will receive a reward for the mere saying (intention) together with the reward for the action (Sifrei Devarim 117:8)."}, {"ch": 15, "v": 11, "aliyah": 6, "heb": "כִּ֛י לֹא־יֶחְדַּ֥ל אֶבְי֖וֹן מִקֶּ֣רֶב הָאָ֑רֶץ עַל־כֵּ֞ן אָנֹכִ֤י מְצַוְּךָ֙ לֵאמֹ֔ר פָּ֠תֹ֠חַ תִּפְתַּ֨ח אֶת־יָדְךָ֜ לְאָחִ֧יךָ לַעֲנִיֶּ֛ךָ וּלְאֶבְיֹנְךָ֖ בְּאַרְצֶֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי לָא יִפְסוֹק מִסְכֵּנָא מִגּוֹ אַרְעָא עַל כֵּן אֲנָא מְפַקְּדָךְ לְמֵימַר מִפְתַּח תִּפְתַּח יָת יְדָךְ לַאֲחוּךְ לְעַנְיָךְ וּלְמִסְכֵּנָךְ בְּאַרְעָךְ:", "onk_en": "For the destitute will not cease to exist within the land; therefore I am commanding you saying, ‘‘Open your hand generously to your brother, to your indigent, and to your destitute in your land.’’", "pj": "אֲרוּם מְטוּל דְּלָא צַיְיתִין בֵּית יִשְרָאֵל בְּמִצְוָותָא דְאוֹרַיְיתָא לָא פַסְקִין מַסְכְּנִין מִגּוֹ אַרְעָא בְּגִין כֵּן אֲנָא מְפַקִידְכוֹן לְמֵימָר מִפְתַּח תִּפְתְּחוּן יַת יְדֵיכוֹן לְקָרִיבֵיכוֹן וּלְעַנְיֵי שִׁיבְבוּתְכוֹן וּלְמִסְכְּנֵי אַרְעֲכוֹן", "pj_en": "But forasmuch as the house of Israel will not rest in the commandments of the law, the poor will not cease in the land: therefore I command you, saying: You shall verily open your hands toward your neighbours, to the afflicted around you, and to the poor of your country.", "tj": "אִין נַטְרִין הִינוּן יִשְרָאֵל מִצְוָותָא דְאוֹרַיְיתָא לָא יֶהֱוֵי בְּהוֹן מִסְכְּנִין בְּרַם אִין שַׁבְקִין הִינוּן מִצְוָותָא דְאוֹרַיְיתָא אֲרוּם לָא פַסְקִין מַסְכְּנַיָא בְּגוֹ אַרְעָא בְּגִין כֵּן אֲנָא מְפַקֵד יַתְכוֹן לְמֵימָר מִפְתַּח תִּפְתְּחוּן יַת יְדֵיכוֹן לַאֲחֵיכוֹן מִסְכֵּינַיָא וְלִצְרִיכַיָא דְאִית בְּאַרְעֲכוֹן:", "tj_en": "If Israel would keep the precepts of the law, there would be no poor among them; but if they will forsake the precepts of the law, the poor shall not cease from the land: therefore I command you, saying: You shall verily open your hands to your poor brethren, and to the needy who will be in your land.", "rashi": "<b>על כן.<\/b> מִפְּנֵי כֵן:<br><br><b>לאמר.<\/b> עֵצָה לְטוֹבָתְךָ אֲנִי מַשִּׂיאֲךָ:<br><br><b>לאחיך לעניך.<\/b> לְאֵיזֶה אָח? לֶעָנִי:<br><br><b>לעניך.<\/b> בְּיוֹ\"ד אֶחָד — לְשׁוֹן עָנִי אֶחָד הוּא, אֲבָל עֲנִיֶּיךָ בִשְׁנֵי יוֹדִי\"ן — שְׁנֵי עֲנִיִּים:", "rashi_en": "על כן means מפני כן BECAUSE OF THIS. <br><br>לאמר suggests: I give you good advice for your own benefit (Sifrei Devarim 118:2).<br><br>לאחיך לעניך [THOU SHALT SURELY OPEN THINE HAND] UNTO THY BROTHER, TO THY POOR — open thine hand to thy brother, to which brother? To the poor one.<br><br>לעניך written with one Jod denotes one poor man, but ענייך with two Jods denotes two (or many) poor, i.e. it is a plural form."}, {"ch": 15, "v": 12, "aliyah": 6, "heb": "כִּֽי־יִמָּכֵ֨ר לְךָ֜ אָחִ֣יךָ הָֽעִבְרִ֗י א֚וֹ הָֽעִבְרִיָּ֔ה וַעֲבָֽדְךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּבַשָּׁנָה֙ הַשְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥נּוּ חׇפְשִׁ֖י מֵעִמָּֽךְ׃", "onk": "אֲרֵי יִזְדַּבַּן לָךְ אֲחוּךְ בַּר יִשְׂרָאֵל אוֹ בַּת יִשְׂרָאֵל וְיִפְלְחִנָּךְ שִׁית שְׁנִין וּבְשַׁתָּא שְׁבִיעֲתָא <b>תִּפְטְרִנֵּיהּ<\/b> בַּר חוֹרִין מֵעִמָּךְ:", "onk_en": "If your brother—Jew or Jewess—is sold to you and he serves you six years; then in the seventh year you are to send him free from you.", "pj": "אֲרוּם יִזְדַּבֵּן לְכוֹן אֲחוּכוֹן בַּר יִשְרָאֵל אוֹ בַת יִשְרָאֵל וְיִפְלִיחַנְכוֹן שִׁית שְׁנִין וּבְמַעֲלֵי שְׁבִיעֲתָא תִפְטְרוּנֵיהּ לְבַר חוֹרִין מִגַּבֵּיכוֹן", "pj_en": "If your brother, a son of Israel, or if a daughter of Israel, be sold to you, he shall serve you six years; and when the seventh comes, thou shalt send him from you free.", "tj": "", "tj_en": "", "rashi": "<b>כי ימכר לך.<\/b> עַל יְדֵי אֲחֵרִים, בִּמְכָרוּהוּ בֵּית דִּין בִּגְנֵבָתוֹ הַכָּתוּב מְדַבֵּר; וַהֲרֵי כְבָר נֶאֱמַר \"כִּי תִקְנֶה עֶבֶד עִבְרִי\" וּבִמְכָרוּהוּ בֵית דִּין הַכָּתוּב מְדַבֵּר? אֶלָּא מִפְּנֵי שְׁנֵי דְבָרִים שֶׁנִּתְחַדְּשׁוּ כָּאן, אֶחָד שֶׁכָּתוּב <b>או העבריה<\/b> אַף הִיא תֵצֵא בְּשֵׁשׁ. וְלֹא שֶׁמְּכָרוּהָ בֵית דִּין, שֶׁאֵין הָאִשָּׁה נִמְכֶּרֶת בִּגְנֵבָתָהּ, שֶׁנֶּאֱמַר \"בִּגְנֵבָתוֹ\" וְלֹא \"בִגְנֵבָתָהּ\" – אֶלָּא בִקְטַנָּה שֶׁמְּכָרָהּ אָבִיהָ, וְלִמֵּד כָּאן שֶׁאִם יָצְאוּ שֵׁשׁ שָׁנִים קֹדֶם שֶׁתָּבִיא סִימָנִין תֵּצֵא, וְעוֹד חִדֵּשׁ כָּאן <b>העניק תעניק<\/b>:", "rashi_en": "כי ימכר לך IF [THY BROTHER …] BE SOLD UNTO THEE by others (not one that sells himself as a servant on account of his destitution, of which case Scripture deals in Leviticus 25:46 ff); Scripture is speaking of one whom the court has sold for a theft that he has committed. But has it not already been stated. (Exodus 21:2) “If thou buyest an Hebrew servant” and there, too, Scripture speaks of one whom the court has sold (as proved by Rashi in his comment on that verse; Mekhilta)?!. But the repetition was necessary because of two new points that are stated here: the one is that it is here written “or an Hebrew woman”, that she, too, like a man-servant, goes free at the end of six years of servitude — it does not mean a woman whom the court had sold, for a woman cannot be sold by the court on account of a theft committed by her, since it states, (Exodus 22:2) that the thief shall be sold “for his theft” which implies: he for his theft, but not she for her theft (Sotah 23b); — but what Scripture is speaking of here is of a woman under age whom her father has sold as a handmaid, and it teaches you here that if six years of servitude terminate before the time that she shows signs of incipient puberty she goes free. And further it mentions a new point here, viz., “thou shalt furnish him (or her) liberally” (cf. Rashi on Exodus 30:4)."}, {"ch": 15, "v": 13, "aliyah": 6, "heb": "וְכִֽי־תְשַׁלְּחֶ֥נּוּ חׇפְשִׁ֖י מֵֽעִמָּ֑ךְ לֹ֥א תְשַׁלְּחֶ֖נּוּ רֵיקָֽם׃", "onk": "וַאֲרֵי תִפְטְרִנֵּיהּ <b>בַּר חוֹרִין<\/b> מֵעִמָּךְ לָא תִפְטְרִנֵּיהּ רֵיקָן:", "onk_en": "When you send him [<b>a<\/b>] free [<b>man<\/b>] from you, do not send him away empty-handed.", "pj": "וַאֲרוּם אִין תִּפְטְרוּנֵיהּ בַּר חוֹרֵי מִגַּבֵּיכוֹן לָא תִפְטְרוּנֵיהּ רֵיקָנָא", "pj_en": "And when thou lettest him go away from thee at liberty, thou shalt not send him away empty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 14, "aliyah": 6, "heb": "הַעֲנֵ֤יק תַּעֲנִיק֙ ל֔וֹ מִצֹּ֣אנְךָ֔ וּמִֽגׇּרְנְךָ֖ וּמִיִּקְבֶ֑ךָ אֲשֶׁ֧ר בֵּרַכְךָ֛ יְהֹוָ֥ה אֱלֹהֶ֖יךָ תִּתֶּן־לֽוֹ׃", "onk": "אַפְרָשָׁא תַפְרֵשׁ לֵיהּ מֵעָנָךְ וּמֵאִדְּרָךְ וּמִמַּעֲצַרְתָּךְ דִּי בָרְכָךְ יְיָ אֱלָהָךְ תִּתֶּן לֵיהּ:", "onk_en": "You must surely present him with a severance bonus from your flocks, and from your threshing area, and your wine cellar, whatever Adonoy, your God, has blessed you with are you to give him.", "pj": "מְדַחֲרָא תְדַחֲרוּן לֵיהּ מִן עַנְכוֹן מִן אִידְרֵיכוֹן וּמִן מַעֲצַרְתְּכוֹן דְּבָרִיכֵיכוֹן יְיָ אֱלָהָכוֹן תִּתְּנוּן לֵיהּ", "pj_en": "Comforting thou shalt comfort him out of your flocks, your floors, and your wine presses; as the Lord hath blessed you ye shall give to him.", "tj": "מְזַוְודָא תְּזַוְודוּן לֵיהּ:", "tj_en": "Thou shalt furnish him.", "rashi": "<b>העניק תעניק.<\/b> לְשׁוֹן עֲדִי בַּגֹּבַהּ וּבְמַרְאִית הָעַיִן, דָּבָר שֶׁיְּהֵא נִכָּר שֶׁהֱטִיבוֹתָ לוֹ; וְיֵשׁ מְפָרְשִׁים לְשׁוֹן הַטְעָנָה עַל צַוָּארוֹ:<br><br><b>מצאנך ומגרנך ומיקבך.<\/b> יָכוֹל אֵין לִי אֶלָּא אֵלּוּ בִּלְבַד, תַּ\"לֹ <b>אשר ברכך<\/b> – מִכָּל מַה שֶּׁבֵּרַכְךָ בּוֹרַאֲךָ. וְלָמָּה נֶאֶמְרוּ אֵלּוּ? מָה אֵלּוּ מְיֻחָדִים שֶׁהֵם בִּכְלַל בְּרָכָה אַף כָּל שֶׁהוּא בִּכְלַל בְּרָכָה, יָצְאוּ פְּרָדוֹת; וְלָמְדוּ רַבּוֹתֵינוּ בְמַסֶּכֶת קִדּוּשִׁין (דף י\"ז) בִּגְזֵרָה שָׁוָה כַּמָּה נוֹתֵן לוֹ מִכָּל מִין וָמִין:", "rashi_en": "הענק תעניק THOU SHALT FURNISH HIM LIBERALLY — The noun from the root ענק denotes an ornament worn high up on the body which thus easily comes within sight of the eye (i.e. is conspicuous), (cf. ענק, a giant, someone who towers on high) — i.e. you shall furnish him with something that will make it patent that you have been kind to him. There are some who explain the word הענק to mean loading on his (the servant’s) neck.<br><br>מצאנך מגרנך ומיקבך [THOU SHALT FURNISH HIM LIBERALLY] OUT OF THY FLOCK, AND OUT OF THY FLOOR, AND OUT OF THY WINE PRESS — One might think I have this duty in respect to these things only! Scripture, however, states “that wherewith the Lord thy God hath blessed thee [shalt thou give him]” implying, of all with which thy Creator hath blessed thee. Why, then, are these alone specifically mentioned? To teach you the following: How is it with these things? They have the characteristic that they come under the term of “blessing”, (i.e. they possess the power of propagating) so, too, you are obliged to furnish him only with such things that come under the term “blessing”, thus excluding mules, (because they are sterile) (Sifrei Devarim 119:3; Kiddushin 17a). — Our Rabbis have derived in Treatise Kiddushin 17a by reasoning from the analogous expressions found in certain texts (גז\"ש) what quantities one must give him of all the different kinds here mentioned."}, {"ch": 15, "v": 15, "aliyah": 6, "heb": "וְזָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֙יתָ֙ בְּאֶ֣רֶץ מִצְרַ֔יִם וַֽיִּפְדְּךָ֖ יְהֹוָ֣ה אֱלֹהֶ֑יךָ עַל־כֵּ֞ן אָנֹכִ֧י מְצַוְּךָ֛ אֶת־הַדָּבָ֥ר הַזֶּ֖ה הַיּֽוֹם׃", "onk": "וְתִדְכַּר אֲרֵי עַבְדָּא הֲוֵיתָא בְּאַרְעָא דְמִצְרַיִם וּפָרְקָךְ יְיָ אֱלָהָךְ עַל כֵּן אֲנָא מְפַקְּדָךְ יָת פִּתְגָּמָא הָדֵין יוֹמָא דֵין:", "onk_en": "Remember that you were a slave in the land of Egypt and Adonoy, your God, redeemed you; that is why I am commanding you this matter today.", "pj": "וְתֶהֱווֹן דְּכִירִין אֲרוּם מְשַׁעֲבְּדִין הֲוֵיתוּן בְּאַרְעָא דְמִצְרַיִם וּפְרַקְכוֹן יְיָ אֱלָהָכוֹן מְטוּל כֵּן אֲנָא מְפַקְדְּכוֹן לְמֶעֱבַד יַת פִּתְגָמָא הָדֵין יוֹמָא דֵין", "pj_en": "And be mindful that you were servants in the land of Mizraim, and that the Lord your God set you free; therefore I command you today that you do this thing.", "tj": "", "tj_en": "", "rashi": "<b>וזכרת כי עבד היית.<\/b> וְהֶעֱנַקְתִּי וְשָׁנִיתִי לְךָ מִבִּזַּת מִצְרַיִם וּבִזַּת הַיָּם, אַף אַתָּה הַעֲנֵק וּשְׁנֵה לוֹ (ספרי):", "rashi_en": "וזכרת כי עבד היית AND THOU SHALT REMEMBER THAT THOU WAST A SERVANT [IN THE LAND OF EGYPT] — and I loaded thee with good things, and did so a second time — from the spoil of the land of Egypt and from the spoil at the Red Sea; so you, too, load him once, and do it again for him (Sifrei Devarim 120:1)."}, {"ch": 15, "v": 16, "aliyah": 6, "heb": "וְהָיָה֙ כִּֽי־יֹאמַ֣ר אֵלֶ֔יךָ לֹ֥א אֵצֵ֖א מֵעִמָּ֑ךְ כִּ֤י אֲהֵֽבְךָ֙ וְאֶת־בֵּיתֶ֔ךָ כִּי־ט֥וֹב ל֖וֹ עִמָּֽךְ׃", "onk": "וִיהֵי אֲרֵי יֵימַר לָךְ לָא אֶפּוֹק מֵעִמָּךְ אֲרֵי רָחֲמָךְ וְיָת <b>אֱנַשׁ<\/b> בֵּיתָךְ אֲרֵי טַב לֵיהּ עִמָּךְ:", "onk_en": "Should he say to you, ‘‘I am not leaving you;’’ because he loves you and [<b>the members of<\/b>] your household, for he has it good with you.", "pj": "וִיהֵי אֲרוּם יֵימַר לָךְ לָא אֶפּוֹק מִן גַּבָּךְ אֲרוּם רַחֲמָךְ וְיַת אֵינַשׁ בֵּיתָךְ אֲרוּם טַב לֵיהּ דְּמִתְהָנֵי עִמָךְ", "pj_en": "But if he say to thee, I will not go out from thee, because I love thee and the men of thy house, and because it hath been good for him to be with thee,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 17, "aliyah": 6, "heb": "וְלָקַחְתָּ֣ אֶת־הַמַּרְצֵ֗עַ וְנָתַתָּ֤ה בְאׇזְנוֹ֙ וּבַדֶּ֔לֶת וְהָיָ֥ה לְךָ֖ עֶ֣בֶד עוֹלָ֑ם וְאַ֥ף לַאֲמָתְךָ֖ תַּעֲשֶׂה־כֵּֽן׃", "onk": "וְתִסַּב יָת מַרְצְעָא וְתִתֵּן בְּאֻדְנֵיהּ וּבְדָשָׁא וִיהֵי לָךְ <b>עִבֵד פָּלַח<\/b> לְעָלָם וְאַף לְאַמְתָךְ תַּעְבֶּד כֵּן:", "onk_en": "Take the awl and put it through his ear and the door, and he will become your perpetual slave [<b>ministering servant<\/b>]. And do the same to your maid-servant as well.", "pj": "וְתִסַּב יַת מַחְטָא וְתִנְעוֹץ בְּאוּדְנֵיהּ וּבִתְרַע בֵּית דִינָא וִיהֵי לָךְ עֶבֶד פְּלַח עַד יוֹבְלָא וְאוּף לְאַמְתָךְ תִּכְתּוֹב גֵט חֵירַר וְתִתֵּן לָהּ", "pj_en": "then thou shalt take an awl, and bore (or apply) it through his ear, and that to the door of the house of judgment, and he shall be thy serving servant until the Jubilee. And for thy handmaid also thou shalt write a certificate of release, and give it to her.", "tj": "", "tj_en": "", "rashi": "<b>עבד עולם.<\/b> יָכוֹל כְּמַשְׁמָעוֹ, תַּ\"לֹ \"וְשַׁבְתֶּם אִישׁ אֶל אֲחֻזָּתוֹ וְאִישׁ אֶל מִשְׁפַּחְתּוֹ תָּשֻׁבוּ\" (ויקרא כ\"ה), הָא לָמַדְתָּ שֶׁאֵין זֶה אֶלָּא עוֹלָמוֹ שֶׁל יוֹבֵל (מכילתא שמות כ\"א):<br><br><b>ואף לאמתך תעשה כן.<\/b> הַעֲנֵק לָהּ; יָכוֹל אַף לִרְצִיעָה הִשְׁוָה הַכָּתוּב אוֹתָהּ, תַּ\"לֹ (שמות כ\"א) \"וְאִם אָמֹר יֹאמַר הָעֶבֶד\" – עֶבֶד נִרְצָע וְאֵין אָמָה נִרְצַעַת (ספרי):", "rashi_en": "עבד עולם [AND HE SHALL BE THY] SERVANT עולם — One might think that עולם has here its usual meaning: for ever! Scripture, however, states, (Leviticus 25:10) “[And ye shall sanctify the fiftieth year and proclaim liberty throughout all the land unto all the inhabitants thereof] and ye shall return every man unto his family”. Consequently, you learn that it (what Scripture terms here עולם), can only mean the period until the termination of that Jubilee cycle (Mekhilta; cf. Rashi on that verse),<br><br>ואף לאמתך תעשה כן AND ALSO UNTO THY MAID SERVANT THOU SHALT DO LIKEWISE — i.e. furnish her out of thy property. One might think, however, that Scripture puts her on the same level with the man-servant concerning the piercing of the ear too! It however, states, (Exodus 21:5) “And if the man-servant (העבד) shall plainly say, [I love my lord … then … his lord shall bore his ear through with an awl]” — so you see that a man-servant must have his ear pierced, but a maid-servant does not have it pierced (Sifrei Devarim 122:6)."}, {"ch": 15, "v": 18, "aliyah": 6, "heb": "לֹא־יִקְשֶׁ֣ה בְעֵינֶ֗ךָ בְּשַׁלֵּֽחֲךָ֨ אֹת֤וֹ חׇפְשִׁי֙ מֵֽעִמָּ֔ךְ כִּ֗י מִשְׁנֶה֙ שְׂכַ֣ר שָׂכִ֔יר עֲבָֽדְךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּבֵֽרַכְךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּכֹ֖ל אֲשֶׁ֥ר תַּעֲשֶֽׂה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא יִקְשֵׁי בְעֵינָךְ בְּמִפְטְרָךְ יָתֵיהּ <b>בַּר חוֹרִין<\/b> מֵעִמָּךְ אֲרֵי <b>עַל חַד תְּרֵין<\/b> כַּאֲגַר אֲגִירָא פָּלְחָךְ שִׁית שְׁנִין וִיבָרֵכִנָּךְ יְיָ אֳלָהָךְ בְּכֹל דִּי תַעְבֵּד:", "onk_en": "Let it not seem difficult to you when you send him [<b>a<\/b>] free [<b>man<\/b>] from you, for double [<b>two for one<\/b>] the profit produced by the wage earner has he worked for you six years; and Adonoy, your God, will bless you in everything you do.", "pj": "לָא יִקְשֵׁי בְעֵינָךְ בְּמִפְטְרָךְ יָתֵיהּ לְבַר חוֹרִין מִן גַבָּךְ אֲרוּם בְּכוּפְלָא עַל אֲגַר אֲגִירָא פַּלְחָךְ שִׁית שְׁנִין וּבֵירְכָךְ מְטוּלֵיהּ יְיָ אֱלָהָךְ בְּכָל מַה דְּתֶעֱבַד", "pj_en": "It must not be a hardship in thy eyes when thou sendest him away from thee; for double the hire of an hireling hath he been of service to thee six years; and on his account the Lord thy God hath blessed thee in all that thou hast done.", "tj": "", "tj_en": "", "rashi": "<b>כי משנה שכר שכיר.<\/b> מִכָּאן אָמְרוּ עֶבֶד עִבְרִי עוֹבֵד בֵּין בַּיּוֹם וּבֵין בַּלַּיְלָה, וְזֶהוּ כִפְלַיִם שֶׁבַּעֲבוֹדַת שְׂכִירֵי יוֹם. וּמַהוּ עֲבוֹדָתוֹ בַלַּיְלָה? רַבּוֹ מוֹסֵר לוֹ שִׁפְחָה כְנַעֲנִית וְהַוְּלָדוֹת לָאָדוֹן (ספרי):", "rashi_en": "כי משנה שכר שכיר [IT SHALL NOT SEEM HARD UNTO THEE WHEN THOU LETTEST HIM GO FREE …] FOR [HE HATH BEEN WORTH] A DOUBLE HIRED SERVANT [UNTO THEE] — From here they (the Rabbis) derived the law that a Hebrew servant has to do service both by day and by night, and that is double as much as the labor of a man hired for day work only. And what is his service during the night? That his master gives him a Canaanite maid-servant with the object of raising children, and the children belong to the master (Sifrei Devarim 123:1; Kiddushin 15a)."}, {"ch": 15, "v": 19, "aliyah": 7, "heb": "כׇּֽל־הַבְּכ֡וֹר אֲשֶׁר֩ יִוָּלֵ֨ד בִּבְקָרְךָ֤ וּבְצֹֽאנְךָ֙ הַזָּכָ֔ר תַּקְדִּ֖ישׁ לַיהֹוָ֣ה אֱלֹהֶ֑יךָ לֹ֤א תַעֲבֹד֙ בִּבְכֹ֣ר שׁוֹרֶ֔ךָ וְלֹ֥א תָגֹ֖ז בְּכ֥וֹר צֹאנֶֽךָ׃", "onk": "כָּל בּוּכְרָא דִּי יִתְיְלִיד בְּתוֹרָךְ וּבְעָנָךְ דִּכְרִין תַּקְדֵּשׁ קֳדָם יְיָ אֱלָהָךְ לָא תִפְלַח בְּבוּכְרָא דְתוֹרָךְ וְלָא תֵגוֹז בּוּכְרָא דְעָנָךְ", "onk_en": "Every firstborn that is born in your cattle, and in your flocks—a male—you must consecrate to Adonoy, your God; you may not work with your first-born ox, or shear the first-born of your flocks.", "pj": "כָּל בּוּכְרָא דְאִתְיְלִיד בְּתוֹרָךְ וּבְעָנָךְ דּוּכְרַיָא תַּקְדֵּישׁ קֳדָם יְיָ אֱלָהָךְ לָא תִפְלוֹחַ בְּבִכּוּרֵי תּוֹרֵיכוֹן וְלָא תֵיגוֹז בִּכּוּרֵי עָנֵיכוֹן", "pj_en": "Every firstling male that cometh of thy herd and flock thou shalt consecrate before the Lord thy God. Thou shalt not work with the firstlings of your herd, nor shear the firstlings of your flocks;", "tj": "", "tj_en": "", "rashi": "<b>כל הבכור, תקדיש.<\/b> וּבְמָקוֹם אַחֵר (ויקרא כ\"ז) הוּא אוֹמֵר \"לֹא יַקְדִּישׁ אִישׁ אֹתוֹ\", הָא כֵיצַד? אֵינוֹ מַקְדִּישׁוֹ לְקָרְבָּן אַחֵר; וְכָאן לִמֵּד שֶׁמִּצְוָה לוֹמַר הֲרֵי אַתָּה קָדוֹשׁ לִבְכוֹרָה. דָּ\"אַ — אִי אֶפְשָׁר לוֹמַר \"תַּקְדִּישׁ\", שֶׁכְּבָר נֶאֱמַר \"לֹא יַקְדִּישׁ\", וְאִי אֶפְשָׁר לוֹמַר \"לֹא יַקְדִּישׁ\", שֶׁהֲרֵי כְבָר נֶאֱמַר \"תַּקְדִּישׁ\", הָא כֵיצַד? מַקְדִּישׁוֹ אַתָּה הֶקְדֵּשׁ עִלּוּי וְנוֹתֵן לַהֶקְדֵּשׁ כְּפִי טוֹבַת הֲנָאָה שֶׁבּוֹ (ערכין כ\"ט):<br><br><b>לא תעבד בבכור שורך ולא תגז וגו'.<\/b> אַף הַחִלּוּף לָמְדוּ רַבּוֹתֵינוּ שֶׁאָסוּר, אֶלָּא שֶׁדִּבֵּר הַכָּתוּב בַּהוֹוֶה (בכורות כ\"ה):", "rashi_en": "כל הבכור ... תקדיש ALL THE FIRSTLING MALES … THOU SHALT SANCTIFY [UNTO THE LORD] — But in another passage (Leviticus 27:26) it states, “[Only the firstborn of the beasts …] one shall not sanctify it”? How can these be reconciled? The latter passage means: he must not dedicate it as a different sacrifice (i.e. offer it as an עולה or שלמים instead of as a בכור), whilst here it teaches that it is a duty to say: “Thou art holy as a firstborn!” Another comment is: It is impossible to say that “thou shalt sanctify” is to be taken literally, for it already states in another passage “one shall not sanctify it”; it is, on the other hand, also impossible to take “one shall not sanctify it” literally, since it states “thou shalt sanctify it”. How can these be reconciled? In the following manner: by taking תקדיש in our verse to imply: “thou mayest dedicate” so far as the dedication of its value (הקדש עלוי) is concerned, and then he must give a sum corresponding to the טובת הנאה in it to the Temple treasury, but you must not dedicate it as far as the altar is concerned (i.e. dedicate it as any sacrifice other than as a בכור) (Arakhin 29a: cf. Sifrei Devarim 124:4).<br><br>לא תעבד בבכור שורך ולא תגז וגו׳ THOU SHALT NOT WORK WITH THE FIRSTLING OF THY HERD, NOR SHEAR [THE FIRSTLING OF THY FLOCK] — The converse case also (working with the firstborn sheep and using the hair of the firstborn calf) have our Rabbis derived to be forbidden, but Scripture merely speaks of what usually occurs (Sifrei Devarim 124:6; Bekhorot 25a)."}, {"ch": 15, "v": 20, "aliyah": 7, "heb": "לִפְנֵי֩ יְהֹוָ֨ה אֱלֹהֶ֤יךָ תֹאכְלֶ֙נּוּ֙ שָׁנָ֣ה בְשָׁנָ֔ה בַּמָּק֖וֹם אֲשֶׁר־יִבְחַ֣ר יְהֹוָ֑ה אַתָּ֖ה וּבֵיתֶֽךָ׃", "onk": "קֳדָם יְיָ אֱלָהָךְ תֵּיכְלִנֵּיהּ שַׁתָּא בְשַׁתָּא בְּאַתְרָא דִּי יִתִּרְעֵי יְיָ אַתְּ <b>וֶאֱנַשׁ<\/b> בֵּיתָךְ:", "onk_en": "Before Adonoy, your God, you must eat it, each year, in the place that Adonoy chooses, you and [<b>the members of<\/b>] your household.", "pj": "קֳדָם יְיָ אֱלָהָכוֹן תֵּיכְלִינֵיהּ שְׁנָא בִּשְׁנָא בְּאַתְרָא דְיִתְרְעֵי יְיָ אַתּוּן וְאֵינַשׁ בָּתֵּיכוֹן", "pj_en": "you shall eat thereof before the Lord your God from year to year, in the place which the Lord will choose, you and the men of your houses.", "tj": "", "tj_en": "", "rashi": "<b>לפני ה' אלהיך תאכלנו.<\/b> לַכֹּהֵן הוּא אוֹמֵר, שֶׁכְּבָר מָצִינוּ שֶׁהוּא מִמַּתְּנוֹת כְּהֻנָּה אֶחָד תָּם וְאֶחָד בַּעַל מוּם, שֶׁנֶּאֱמַר (במדבר י\"ח) וּבְשָׂרָם יִהְיֶה לָּךְ וְגוֹ' (בכ' כ\"ח):<br><br><b>שנה בשנה.<\/b> מִכָּאן שֶׁאֵין מַשְׁהִין אוֹתוֹ יוֹתֵר עַל שְׁנָתוֹ; יָכוֹל יְהֵא פָּסוּל מִשֶּׁעָבְרָה שְׁנָתוֹ, כְּבָר הֻקַּשׁ לְמַעֲשֵׂר, שֶׁנֶּאֱמַר (דברים י\"ד) וְאָכַלְתָּ לִפְנֵי ה' אֱלֹהֶיךָ מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ, מַה מַּעֲשֵׂר שֵׁנִי אֵינוֹ נִפְסָל מִשָּׁנָה לַחֲבֶרְתָּהּ אַף בְּכוֹר אֵינוֹ נִפְסָל, אֶלָּא שֶׁמִּצְוָה תּוֹךְ שְׁנָתוֹ (בכ' כ\"ז):<br><br><b>שנה בשנה.<\/b> אִם שְׁחָטוֹ בְּסוֹף שְׁנָתוֹ אוֹכְלוֹ אוֹתוֹ הַיּוֹם וְיוֹם אֶחָד מִשָּׁנָה אַחֶרֶת, לִמֵּד שֶׁנֶּאֱכָל לִשְׁנֵי יָמִים וְלַיְלָה אֶחָד (שם):", "rashi_en": "לפני ה׳ אלהיך תאכלנה THOU SHALT EAT IT BEFORE THE LORD THY GOD — Scripture is speaking to the priest (not to the owner to whom תקדיש in the previous verse refers), for we find already stated that it (the בכור) is one of the dues of the priests whether it is unblemished (and its blood and fat portions are to be sacrificed on the altar and the flesh eaten by the priests), or whether it is blemished (when it must not be offered on the altar), for it states, (Numbers 18:18) “and the flesh of them (the firstborn animals, both the blemished and the unblemished) shall be thine” (the priest’s) (cf. Bekhorot 28a).<br><br>שנה בשנה [THOU SHALT EAT IT BEFORE THE LORD …] YEAR BY YEAR — From here we derive the law that one should not defer it (i.e. sacrificing and eating it) beyond its first year (Bekhorot 28a). If so, one might think that it becomes invalid as a sacrifice as soon as its first year has passed! This is not the case, for it has been put in comparison with the second tithe, as it is said, (Deuteronomy 14:23; cf. Rashi on that verse): “and thou shalt eat before the Lord thy God the tithe of thy corn, of thy wine, and of thine oil, and the firstlings of thy herds, and thy flocks”. How is it in the case of the second tithe? It does not become invalid if left over from one year to the other (cf. Rashi on Deuteronomy 14:28 and 29), so, too, does the firstborn animal not become invalid under the same circumstances, only that it is a meritorious act to offer and consume it within its first year.<br><br>שנה בשנה (may also be translated A YEAR WITH ANOTHER YEAR) — If one slaughtered it at the end of its first year (an the last day) he may eat it that day and the first day of the next year. This teaches us that it (a firstborn animal) may in all cases be eaten on two successive days and the intervening night (cf. Sifrei Devarim 125; Bekhorot 27b)."}, {"ch": 15, "v": 21, "aliyah": 7, "heb": "וְכִֽי־יִהְיֶ֨ה ב֜וֹ מ֗וּם פִּסֵּ֙חַ֙ א֣וֹ עִוֵּ֔ר כֹּ֖ל מ֣וּם רָ֑ע לֹ֣א תִזְבָּחֶ֔נּוּ לַיהֹוָ֖ה אֱלֹהֶֽיךָ׃", "onk": "וַאֲרֵי יְהֵי בֵיהּ מוּמָא חֲגִיר אוֹ עֲוִיר כֹּל מוּם בִּישׁ לָא תִכְּסִנֵּיהּ <b>קֳדָם<\/b> יְיָ אֱלָהָךְ:", "onk_en": "And if it has a blemish—if it is crippled or blind—or has any severe blemish, do not slaughter it to Adonoy, your God.", "pj": "וַאֲרוּם יְהֵי בֵּיהּ מוּמָא חֲגִיר אוֹ סָמֵי כָּל מִדַּעַם בִּישׁ לָא תִכְסִינֵיהּ קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "But if there be any spot in it, if it be lame or blind, or have any blemish, you shall not sacrifice it before the Lord your God:", "tj": "", "tj_en": "", "rashi": "<b>מום.<\/b> כְּלָל:<br><br><b>פסח או עור.<\/b> פְּרָט:<br><br><b>כל מום רע.<\/b> חָזַר וְכָלַל — מַה הַפְּרָט מְפֹרָשׁ מוּם הַגָּלוּי וְאֵינוֹ חוֹזֵר, אַף כָּל מוּם שֶׁבַּגָּלוּי וְאֵינוֹ חוֹזֵר (שם ל\"ז):", "rashi_en": "מום [AND IF THERE BE] ANY BLEMISH [THEREIN, IF IT BE LAME, OR BLIND, OR HAVE ANY ILL BLEMISH, THOU SHALT NOT SACRIFICE IT …] — any blemish is a general statement,<br><br>פסח או עור LAME OR BLIND is a particularization,<br><br>כל מום רע ANY ILL BLEMISH — it again comprises them in a general statement. How is it with the blemishes particularised? They have the characteristic that each is a visible (external) blemish and the animal never returns naturally to its original condition (i.e. never becomes free from the blemish). So, too, the general statement includes all such blemishes that are visible and incurable [while in the case of a transitory blemish the animal may be sacrificed when the blemish has disappeared] (Bekhorot 37a; cf. Sifrei Devarim 126:2)."}, {"ch": 15, "v": 22, "aliyah": 7, "heb": "בִּשְׁעָרֶ֖יךָ תֹּאכְלֶ֑נּוּ הַטָּמֵ֤א וְהַטָּהוֹר֙ יַחְדָּ֔ו כַּצְּבִ֖י וְכָאַיָּֽל׃", "onk": "בְּקִרְוָיךְ תֵּיכְלִנֵּיהּ מְסָאָבָא וְדַכְיָא כַּחֲדָא <b>כִּבְסַר<\/b> טַבְיָא וְאַיְלָא:", "onk_en": "In your cities may you eat it; the ritually unclean and the clean together, like the [<b>meat of the<\/b>] deer and the gazelle.", "pj": "בְּקִרְוֵיכוֹן תֵּיכְלִינֵיהּ דִּמְסָאָב מִן לְמִקְרַב לְקוּדְשַׁיָא וְדִדְכֵי לְמִקְרַב לְקוּדְשַׁיָא כַּחֲדָא הֵי כִּבְשַר טַבְיָא וְאַיְלָא", "pj_en": "you may eat it in your cities; he who is unclean, (so) that he may not approach to holy things, and he who being clean may approach the holy, may alike (eat), as the flesh of the antelope or hart.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 23, "aliyah": 7, "heb": "רַ֥ק אֶת־דָּמ֖וֹ לֹ֣א תֹאכֵ֑ל עַל־הָאָ֥רֶץ תִּשְׁפְּכֶ֖נּוּ כַּמָּֽיִם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לְחוֹד יָת דְּמֵיהּ לָא תֵיכוּל עַל אַרְעָא תִשְׁדִּנֵּיהּ כְּמַיָּא:", "onk_en": "Only, do not eat its blood; spill it like water on the ground.", "pj": "לְחוֹד אַדְמֵיהּ לָא תֵיכְלוּן עַל אַרְעָא תֵישְׁדוּנֵיהּ הֵי כְמַיָא", "pj_en": "Only you shall not eat the blood; you shall pour it out upon the ground like water.", "tj": "", "tj_en": "", "rashi": "<b>רק את דמו לא תאכל.<\/b> שֶׁלֹּא תֹאמַר הוֹאִיל וְכֻלּוֹ הֶתֵּר הַבָּא מִכְּלַל אִסּוּר הוּא, שֶׁהֲרֵי קָדוֹשׁ וְנִשְׁחָט בַּחוּץ בְּלֹא פִדְיוֹן וְנֶאֱכָל, יָכוֹל יְהֵא אַף הַדָּם מֻתָּר, תַּלְמוּד לוֹמַר <b>רק את דמו לא תאכל<\/b>:", "rashi_en": "רק את דמו לא תאכל ONLY THOU SHALT NOT EAT THE BLOOD THEREOF — This prohibition appears to be redundant, since the blood of no animal may be eaten, but it is mentioned, in order that you should not think: since it (the blemished firstborn animal) is something that in every respect is permitted originally it belonged to a forbidden class of animals — for, you see, it was holy and yet it may be slaughtered outside the Temple, and may be eaten without redemption — and consequently you might think that its blood is also permitted, Scripture therefore states, “However thou shalt not eat its blood”."}, {"ch": 16, "v": 1, "aliyah": 7, "heb": "שָׁמוֹר֙ אֶת־חֹ֣דֶשׁ הָאָבִ֔יב וְעָשִׂ֣יתָ פֶּ֔סַח לַיהֹוָ֖ה אֱלֹהֶ֑יךָ כִּ֞י בְּחֹ֣דֶשׁ הָֽאָבִ֗יב הוֹצִ֨יאֲךָ֜ יְהֹוָ֧ה אֱלֹהֶ֛יךָ מִמִּצְרַ֖יִם לָֽיְלָה׃", "onk": "<b>טַר<\/b> יָת יַרְחָא דַאֲבִיבָא וְתַעְבֵּד פִּסְחָא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ אֲרֵי בְּיַרְחָא דַאֲבִיבָא אַפְּקָךְ יְיָ אֱלָהָךְ מִמִּצְרַיִם <b>וַעֲבַד לָךְ נִסִּין<\/b> בְּלֵילְיָא:", "onk_en": "Take heed of [<b>observe<\/b>] the month of spring, when you will celebrate <i>Pesach<\/i> for [<b>before<\/b>] Adonoy your God; for in the month of spring Adonoy, your God, took you out from Egypt [<b>and performed miracles for you<\/b>] at night.", "pj": "הֲווֹן זְהִירִין לְמִנְטוֹר זִמְנֵי מוֹעֲדַיָא לְעִבּוּרֵי שַׁתָּא וּלְמִנְטוֹר תְּקוּפְתָּא בְּיַרְחָא דְאַבִּיבָא לְמֶעֱבַד בֵּיהּ פִּסְחָא קֳדָם יְיָ אֱלָהָכוֹן אֲרוּם בְּיַרְחָא דְאַבִּיבָא אַפֵּיק יַתְכוֹן יְיָ אֱלָהָכוֹן מִמִּצְרַיִם וְתֵיכְלוּן יָתֵיהּ בְּלֵילְיָא", "pj_en": "Be mindful to keep the times of the festivals, with the intercalations of the year, and to observe the rotation thereof: in the month of Abiba to perform the pascha before the Lord your God, because in the month of Abiba the Lord your God brought you out of Mizraim; you shall eat it therefore by night.", "tj": "", "tj_en": "", "rashi": "<b>שמור את חדש האביב.<\/b> מִקֹּדֶם בּוֹאוֹ שְׁמֹר שֶׁיְּהֵא רָאוּי לְאָבִיב – לְהַקְרִיב בּוֹ אֶת מִנְחַת הָעֹמֶר, וְאִם לָאו עַבֵּר אֶת הַשָּׁנָה (עי' סנהדרין י\"א):<br><br><b>ממצרים לילה.<\/b> וַהֲלֹא בַּיּוֹם יָצְאוּ שֶׁנֶּאֱמַר (במדבר ל\"ג) מִמָּחֳרַת הַפֶּסַח יָצְאוּ בְנֵי יִשְׂרָאֵל וְגוֹ'? אֶלָּא לְפִי שֶׁבַּלַּיְלָה נָתַן לָהֶם פַּרְעֹה רְשׁוּת לָצֵאת, שֶׁנֶּאֱמַר (שמות י\"ב) וַיִּקְרָא לְמֹשֶׁה וּלְאַהֲרֹן לַיְלָה וְגוֹ' (בראשית ט'):", "rashi_en": "שמור את חדש האביב WATCH THE MONTH OF ABIB — This means: Before it comes watch whether it will be capable of producing ripe ears (אביב), so that one may offer the Omer meal-offering during it, and if not (i.e. if you observe that the ears will not be ripe by the 16th of Nisan), then intercalate the year (i.e. add a month to the winter-period, so that the month Abib falls later than it otherwise would, by which time the ears will be ripened) (cf. Sanhedrin 11b and Note 4 on p. 191 of Leviticus in the Silbermann edition of the Pentateuch).<br><br>ממצרים לילה [FOR IN THE MONTH OF ABIB THE LORD THY GOD BROUGHT THEE FORTH] FROM EGYPT BY NIGHT — But did they not go forth by day , as it is said, (Numbers 30:3) “on the morrow after the Passover the children of Israel went out … [in the sight of all the Egyptians]”? But it states that they went out by night because Pharaoh gave them permission to go forth by night, as it is said, (Exodus 12:31) “And he called for Moses and Aaron by night, [and said, Rise up, go forth from among my people etc.]” (cf. Sifrei Devarim 128:5; Berakhot 9a)."}, {"ch": 16, "v": 2, "aliyah": 7, "heb": "וְזָבַ֥חְתָּ פֶּ֛סַח לַיהֹוָ֥ה אֱלֹהֶ֖יךָ צֹ֣אן וּבָקָ֑ר בַּמָּקוֹם֙ אֲשֶׁר־יִבְחַ֣ר יְהֹוָ֔ה לְשַׁכֵּ֥ן שְׁמ֖וֹ שָֽׁם׃", "onk": "וְתִכּוֹס פִּסְחָא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ <b>מִן בְּנֵי עָנָא וְנִכְסַת קוּדְשַׁיָּא מִן תּוֹרֵי<\/b> בְּאַתְרָא דִּי יִתִּרְעֵי יְיָ לְאַשְׁרָאָה <b>שְׁכִנְתֵּיהּ<\/b> תַּמָּן:", "onk_en": "You shall slaughter the <i>pesach<\/i>-offering to [<b>before<\/b>] Adonoy, your God, flocks of ruminants [<b>young lambs<\/b>] and cattle [<b>sacred offerings of oxen<\/b>] in the place that Adonoy chooses to house His Presence [<b>Shechinah<\/b>] there.", "pj": "וְתִיכְסוּן פִּסְחָא קֳדָם יְיָ אֱלָהָכוֹן בֵּינֵי שִׁמְשָׁתָא וְעָאן וְתוֹרֵי לִמְחָר בִּכְרַן יוֹמָא לְחֶדְוַת חַגָּא בְּאַתְרָא דְיִתְרְעֵי יְיָ לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן", "pj_en": "But you shall sacrifice the pascha before the Lord your God between the suns; and the sheep and the bullocks on the morrow, on that same day to rejoice in the feast at the place which the Lord will choose to make His Shekinah to dwell there.", "tj": "", "tj_en": "", "rashi": "<b>וזבחת פסח לה' אלהיך צאן.<\/b> שֶׁנֶּאֱמַר (שמות י\"ב) מִן הַכְּבָשִׂים וּמִן הָעִזִּים תִּקָּחוּ:<br><br><b>ובקר.<\/b> תִּזְבַּח לַחֲגִיגָה, שֶׁאִם נִמְנוּ עַל הַפֶּסַח חֲבוּרָה מְרֻבָּה, מְבִיאִים עִמּוֹ חֲגִיגָה כְּדֵי שֶׁיְּהֵא נֶאֱכָל עַל הַשֹּׂבַע (פסחים ס\"ט); וְעוֹד לָמְדוּ רַבּוֹתֵינוּ דְּבָרִים הַרְבֵּה מִפָּסוּק זֶה:", "rashi_en": "וזבחת פסח לה' אלהיך צאן THOU SHALT THEREFORE SACRIFICE THE PASSOVER UNTO THE LORD THY GOD OF SHEEP, as it is said of the Passover offering, (Exodus 12:5) “Ye shall take it from the sheep or from the goats”,<br><br>— ובקר AND OXEN thou shalt slaughter as the חגיגה (the festival offering sacrificed on the fourteenth of Nisan in addition to the Passover offering); for if they have counted themselves (formed themselves) into too large a company for the Passover offering (so that one lamb will not suffice for them) they bring together with it a festival offering and this is eaten first, in order that it (the Passover sacrifice) can be eaten in satiety (i.e. after the appetite is satisfied; cf. Pesachim 69b, 70a). — And besides this our Rabbis derived many Halachic matters from this verse (cf. Sifrei Devarim 129; Berakhot 9a)."}, {"ch": 16, "v": 3, "aliyah": 7, "heb": "לֹא־תֹאכַ֤ל עָלָיו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל־עָלָ֥יו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְחִפָּז֗וֹן יָצָ֙אתָ֙ מֵאֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּ֗ר אֶת־י֤וֹם צֵֽאתְךָ֙ מֵאֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽיךָ׃", "onk": "לָא תֵיכוּל עֲלוֹהִי חֲמִיעַ שִׁבְעָא יוֹמִין תֵּיכוּל עֲלוֹהִי פַטִּיר לְחֵם עֹנִי אֲרֵי בִּבְהִילוּ נְפַקְתָּא מֵאַרְעָא דְמִצְרַיִם בְּדִיל דְּתִדְכַּר יָת יוֹמָא מִפְּקָךְ מֵאַרְעָא דְמִצְרַיִם כָּל יוֹמֵי חַיָּיךְ:", "onk_en": "Do not eat <i>chometz<\/i> on it; seven days are you to eat on it <i>matzos,<\/i> bread of anguish; since in haste you left the land of Egypt, so that you remember the day of your exodus from the land of Egypt all the days of your life.", "pj": "לָא תֵיכְלוּן עַל פִּסְחָא חֲמִיעַ שׁוּבְעָא יוֹמִין תֵּיכְלוּן לִשְׁמֵיהּ פַּטִּיר לַחֲמָא עַנְיָא אֲרוּם בִּבְהִילוּ נְפַקְתּוּן מֵאַרְעָא דְמִצְרַיִם מִן בִּגְלַל דְּתִידְכְּרוּן יַת יוֹם מַפְקְכוֹן מֵאַרְעָא דְמִצְרַיִם כָּל יוֹמֵי חַיֵּיכוֹן", "pj_en": "You shall not eat leavened bread with the pascha; seven days you shall eat unleavened bread unto His Name, the unleavened bread of humiliation; for with haste you went forth from the land of Mizraim; that you may remember the day of your outgoing from the land of Mizraim all the days of your life.", "tj": "", "tj_en": "", "rashi": "<b>לחם עני.<\/b> לֶחֶם שֶׁמַּזְכִּיר אֶת הָעֹנִי שֶׁנִּתְעַנּוּ בְּמִצְרַיִם (ספרי):<br><br><b>כי בחפזון יצאת.<\/b> וְלֹא הִסְפִּיק בָּצֵק לְהַחֲמִיץ וְזֶה יִהְיֶה לְךָ לְזִכָּרוֹן; וְחִפָּזוֹן לֹא שֶׁלְּךָ הָיָה אֶלָּא שֶׁל מִצְרַיִם, שֶׁכֵּן הוּא אוֹמֵר \"וַתֶּחֱזַק מִצְרַיִם עַל הָעָם וְגוֹ'\" (ספרי):<br><br><b>למען תזכר.<\/b> עַל יְדֵי אֲכִילַת הַפֶּסַח וְהַמַּצָּה <b>את יום צאתך<\/b>:", "rashi_en": "לחם עני THE BREAD OF AFFLICTION — i.e. bread that calls to mind the affliction to which they were subjected in Egypt (Sifrei Devarim 130:5).<br><br>כי בחפזון יצאת FOR THOU CAMEST FORTH [FROM THE LAND OF EGYPT] IN HASTE, and the dough therefore had no time to become leavened, and this (the eating of unleavened bread) shall be unto you as reminder of this. The haste, spoken of here, was not on thy part, but on Egypt’s part, for so it states, (Exodus 12:33) “And Egypt was urgent upon the people [hastening to send them out of the land]” (Sifrei Devarim 130:6; cf. Berakhot 9a).<br><br>למען תזכר THAT THOU MAYEST REMEMBER through the eating of the Passover sacrifice and the unleavened bread, את יום צאתך THE DAY WHEN THOU CAMEST FORTH [OUT OF THE LAND OF EGYPT]."}, {"ch": 16, "v": 4, "aliyah": 7, "heb": "וְלֹֽא־יֵרָאֶ֨ה לְךָ֥ שְׂאֹ֛ר בְּכׇל־גְּבֻלְךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְלֹא־יָלִ֣ין מִן־הַבָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּעֶ֛רֶב בַּיּ֥וֹם הָרִאשׁ֖וֹן לַבֹּֽקֶר׃", "onk": "וְלָא יִתְחֲזֵי לָךְ חֲמִיר בְּכָל תְּחוּמָךְ שִׁבְעָא יוֹמִין וְלָא יְבִית מִן בִּסְרָא דִּי תִכּוֹס בְּרַמְשָׁא בְּיוֹמָא קַדְמָאָה לְצַפְרָא:", "onk_en": "And no sourdough of yours may be seen in all of your boundary seven days; and none of the flesh may remain overnight which you slaughtered towards the evening of the first day—until morning.", "pj": "וְתִזְדַהֲרוּן מִקַּמֵּי פִּסְחָא דְלָא יִתְחָמֵי לְכוֹן חֲמִיר בְּכָל תְּחוּמְכוֹן שׁוּבְעָא יוֹמִין וְלָא יְבִית בַּר מִן בִּשְרָא דְתִכְסוּן בְּרַמְשָׁא בְּיוֹמָא קַמָּאָה לְצַפְרָא", "pj_en": "Take heed that in the beginning of the pascha there be no leaven seen among you within all your borders for seven days; and that none of the flesh which you sacrifice in the evening of the first day remain till the morning.", "tj": "", "tj_en": "", "rashi": "<b>ולא ילין מן הבשר אשר תזבח בערב ביום הראשון לבקר.<\/b> אַזְהָרָה לַמּוֹתִיר בְּפֶסַח דּוֹרוֹת, לְפִי שֶׁלֹּא נֶאֱמַר אֶלָּא בְּפֶסַח מִצְרַיִם; וְיוֹם רִאשׁוֹן הָאָמוּר כָּאן הוּא י\"ד בְּנִיסָן, כְּמָה דְּאַתְּ אָמַר \"אַךְ בַּיּוֹם הָרִאשׁוֹן תַּשְׁבִּיתוּ שְׂאוֹר מִבָּתֵּיכֶם\" (שמות י\"ב); וּלְפִי שֶׁנִּסְתַּלֵּק הַכָּתוּב מֵעִנְיָנוֹ שֶׁל פֶּסַח וְהִתְחִיל לְדַבֵּר בְּחֻקּוֹת שִׁבְעַת יָמִים, כְּגוֹן שִׁבְעַת יָמִים תֹּאכַל עָלָיו מַצּוֹת, וְלֹא יֵרָאֶה לְךָ שְׂאֹר בְּכָל גְּבֻלְךָ, הֻצְרַךְ לְפָרֵשׁ בְּאֵיזוֹ זְבִיחָה הוּא מַזְהִיר, שֶׁאִם כָּתַב וְלֹא יָלִין מִן הַבָּשָׂר אֲשֶׁר תִּזְבַּח בָּעֶרֶב לַבֹּקֶר הָיִיתִי אוֹמֵר שְׁלָמִים הַנִּשְׁחָטִים כָּל שִׁבְעָה כֻּלָּן בְּבַל תּוֹתִירוּ וְאֵינָן נֶאֱכָלִין אֶלָּא לְיוֹם וָלַיְלָה, לְכָךְ כָּתַב <b>בערב ביום הראשון.<\/b> דָּבָר אַחֵר בַּחֲגִיגַת י\"ד הַכָּתוּב מְדַבֵּר, וְלִמֵּד עָלֶיהָ שֶׁנֶּאֱכֶלֶת לִשְׁנֵי יָמִים, וְהָרִאשׁוֹן הָאָמוּר כָּאן בְּיוֹם טוֹב הָרִאשׁוֹן הַכָּתוּב מְדַבֵּר, וְכֵן מַשְׁמָעוּת הַמִּקְרָא – בְּשַׂר חֲגִיגָה אֲשֶׁר תִּזְבַּח בָּעֶרֶב לֹא יָלִין בְּיֹ\"טֹ הָרִאשׁוֹן עַד בָּקְרוֹ שֶׁל שֵׁנִי, אֲבָל נֶאֱכֶלֶת הִיא בְאַרְבָּעָה עָשָׂר וּבַחֲמִשָׁה עָשָׂר, וְכָךְ הִיא שְׁנוּיָה בְמַסֶּכֶת פְּסָחִים (דף ע\"א):", "rashi_en": "ולא ילין מן הבשר אשר תזבח בערב ביום הראשון לבקר NEITHER SHALL ANY OF THE FLESH, WHICH THOU HAST SACRIFIED THE FIRST DAY AT EVEN, REMAIN ALL NIGHT UNTIL THE MORNING — This is a prohibition addressed to one who might, in the case of the Passover sacrifice offered in later generations (i.e. after the first that was offered in Egypt), leave over night any of its flesh. And it was necessary to state this because so far it has been mentioned only with regard to that one Passover sacrifice that was offered in Egypt (פסח מצרים) (Exodus 12:10). — The “first day” spoken of here is the fourteenth day of Nisan (not the, fifteenth which is the first day of the Festival), just as you must explain that term in the passage (Exodus 12:15): “even the first day (ביום הראשון) ye shall put away leaven out of your houses” (cf. Rashi on that verse). — And because Scripture has digressed from the subject of the Passover Sacrifice with which this section begins and has begun to speak of the ordinances relating to the seven days of the festival, as, for instance, (v. 3) “seven days thou shalt eat unleavened bread therewith”, and (v. 4) “and there shall be no leaven seen with thee in all thy boundaries [seven days]”, it was compelled to specify with regard to which offering it states the prohibition of leaving the flesh over night. For if it had written only “neither shall any of the flesh which thou sacrificedst at even (not mentioning ביום הראשון) remain all night until the morning”, I might have thought that the peace offerings which are slaughtered during all the seven days all come under the prohibition of “and thou shalt not leave any of it until the morning” (Exodus 12:10), and may therefore be eaten one day and the following night only (which is not so); therefore it wrote “[neither shall any of the flesh, which thou sacrificedst] at even on the first day [remain all night]”. — Another explanation is that Scripture speaks here of the festival offering brought on the fourteenth of Nisan (חגיגת י״ד, not of the קרבן פסח) and that it teaches with reference to it that it may be eaten during two successive days and the intervening night (cf. however, Rashi on Exodus 7:14 and Note 2 thereon). As regards the first day” that is mentioned here — according to this explanation — Scripture is speaking of the first day of the festival (the fifteenth of Nisan), and what the verse implies is the following: None of the flesh of the festival offering which you slaughtered at even (i.e. towards eventide on the fourteenth of Nisan) shall remain on the first day of the festival until the morning of the second day of the festival (the sixteenth of Nisan), but it may be eaten on the fourteenth and the fifteenth (and the intervening night). So is it set forth in Treatise Pesachim 71b."}, {"ch": 16, "v": 5, "aliyah": 7, "heb": "לֹ֥א תוּכַ֖ל לִזְבֹּ֣חַ אֶת־הַפָּ֑סַח בְּאַחַ֣ד שְׁעָרֶ֔יךָ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֥ן לָֽךְ׃", "onk": "לֵית <b>לָךְ רְשׁוּ<\/b> לְמִכֹּס יָת פִּסְחָא בַּחֲדָא מִקִּרְוָיךְ דַּיְיָ אֱלָהָךְ יָהֵב לָךְ:", "onk_en": "You are forbidden [<b>have no permission<\/b>] to slaughter the <i>pesach<\/i> in any of your cities that Adonoy, your God, is giving you.", "pj": "לֵית לְכוֹן רְשׁוּ לְמִכּוֹס יַת פִּסְחָא בַּחֲדָא מִן קִירְוֵיכוֹן דַּיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן", "pj_en": "It will not be allowed you to eat the pascha in (any) one of your cities which the Lord your God giveth to you;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 6, "aliyah": 7, "heb": "כִּ֠י אִֽם־אֶל־הַמָּק֞וֹם אֲשֶׁר־יִבְחַ֨ר יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ לְשַׁכֵּ֣ן שְׁמ֔וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת־הַפֶּ֖סַח בָּעָ֑רֶב כְּב֣וֹא הַשֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְךָ֥ מִמִּצְרָֽיִם׃", "onk": "אֶלָּהֵן לְאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ לְאַשְׁרָאָה <b>שְׁכִנְתֵּיהּ<\/b> תַּמָּן תִּכּוֹס יָת פִּסְחָא בְּרַמְשָׁא כְּמֵעַל שִׁמְשָׁא זְמַן מִפְּקָךְ מִמִּצְרָיִם:", "onk_en": "Solely in the place that Adonoy, your God, chooses to house His Presence [<b>Shechinah<\/b>], there will you slaughter the <i>pesach<\/i> towards the afternoon, at sunset, at the time you left Egypt.", "pj": "אֱלָהֵן בְּאַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן תִּיכְסוּן יַת פִּסְחָא וּבְרַמְשָׁא בְּמֵיעֲלִית שִׁמְשָׁא תֵּיכְלוּנֵיהּ עַד פַּלְגוּת לֵילְיָא זְמַן שַׁרְיוּת פּוּרְקַנְכוֹן מִמִּצְרָיִם", "pj_en": "but in the place which the Lord your God will choose to make His Shekinah to dwell, there shall you sacrifice the pascha; and in the evening at the going down of the sun you may eat it until the middle of the night, the time when you began to go out of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>בערב כבוא השמש מועד צאתך ממצרים.<\/b> הֲרֵי שְׁלֹשָׁה זְמַנִּים חֲלוּקִים, בָּעֶרֶב מִשֵּׁשׁ שָׁעוֹת וּלְמַעְלָה זָבְחֵהוּ, וּכְבֹא הַשֶּׁמֶשׁ תֹּאכְלֵהוּ, וּמוֹעֵד צֵאתְךָ אַתָּה שׂוֹרְפֵהוּ, כְּלוֹמַר נַעֲשֶׂה נוֹתָר וְיֵצֵא לְבֵית הַשְּׂרֵפָה (ספרי; ברכות ט'):", "rashi_en": "בערב כבוא השמש מועד צאתך ממצרים [THERE THOU SHALT SACRIFICE THE PASSOVER] AT EVEN, AT THE GOING DOWN OF THE SUN, AT THE APPOINTED TIME THAT THOU CAME FORTH OUT OF EGYPT — But these are three different points of time! The explanation is: at evening, i.e. from the sixth hour (reckoning from six o’clock in the morning) and onwards you shall slaughter it (תזבח בערב); and when the sun goes down you shall eat it, and at the time when you left Egypt (in the early morning) you shall burn it — that is to say, if in the morning there is any flesh left, it becomes what is technically termed נותר and must be removed to the “place of burning” (not actually burnt, for this is not permissible on a festival) (Sifrei Devarim 133:1; cf. Berakhot 9a)."}, {"ch": 16, "v": 7, "aliyah": 7, "heb": "וּבִשַּׁלְתָּ֙ וְאָ֣כַלְתָּ֔ בַּמָּק֕וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהֹוָ֥ה אֱלֹהֶ֖יךָ בּ֑וֹ וּפָנִ֣יתָ בַבֹּ֔קֶר וְהָלַכְתָּ֖ לְאֹהָלֶֽיךָ׃", "onk": "וּתְבַשַּׁל וְתֵיכוּל בְּאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ בֵּיהּ וְתִתְפְּנֵי בְצַפְרָא וּתְהַךְ לְקִרְוָךְ:", "onk_en": "You shall cook [it] and eat [it] in the place that Adonoy, your God, chooses; and you may depart in the morning and go to your residence.", "pj": "וְתִטְווּן וְתֵיכְלוּן בְּאַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן בֵּיהּ וְתִתְפְּנֵי בְּצַפְרָא מֵיפַק חַגָא וּתְהַךְ לְקִרְוָוךְ", "pj_en": "And you shall dress and eat it in the place which the Lord your God will choose, and in the early morn (if need be) thou mayest return from the feast, and go to thy cities.", "tj": "", "tj_en": "", "rashi": "<b>ובשלת.<\/b> זֶהוּ צְלִי אֵשׁ, שֶׁאַף הוּא קָרוּי בִּשּׁוּל:<br><br><b>ופנית בבקר.<\/b> לְבָקְרוֹ שֶׁל שֵׁנִי, מְלַמֵּד שֶׁטָּעוּן לִינָה לֵיל שֶׁל מוֹצָאֵי י\"ט (ספרי; פסחים צ\"ה; חגיגה י\"ז):", "rashi_en": "ובשלת is identical with צלי אש “roast with fire” mentioned in Exodus 12:9, for it (roasting) also comes under the term בשול “cooking” (Mekhilta).<br><br>ופנית בבקר AND THOU SHALT TURN IN THE MORNING [AND GO INTO THY TENTS] — i.e. in the morning of the second day of the Passover week. — It teaches us that he (the pilgrim) is required to stay in Jerusalem during the night when the festival terminates (Sifrei Devarim 134:2; Pesachim 95b; Chagigah 17)."}, {"ch": 16, "v": 8, "aliyah": 7, "heb": "שֵׁ֥שֶׁת יָמִ֖ים תֹּאכַ֣ל מַצּ֑וֹת וּבַיּ֣וֹם הַשְּׁבִיעִ֗י עֲצֶ֙רֶת֙ לַיהֹוָ֣ה אֱלֹהֶ֔יךָ לֹ֥א תַעֲשֶׂ֖ה מְלָאכָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "שִׁתָּא יוֹמִין תֵּיכוּל פַּטִּירָא וּבְיוֹמָא שְׁבִיעָאָה <b>כְּנֵשׁ<\/b> קֳדָם יְיָ אֱלָהָךְ לָא תַעְבֵּד עִבִידָא:", "onk_en": "For six days you shall eat <i>matzos,<\/i> and on the seventh day, is one of withdrawal [<b>assembly<\/b>] for the sake of Adonoy, your God, do not do work.", "pj": "בְּיוֹמָא קַמָּא תְקַרְבוּן יַת עוֹמְרָא וְתֵיכְלוּן פַּטִּירֵי מַעֲלַלְתָּא עַתִּיקָא וְשִׁתָּא יוֹמִין דְּאִשְׁתְּיָירוּ תְּהוֹן מַרְשַׁן לְמֵיכוֹל פַּטוּרֵי מַעֲלַלְתָּא חֲדַתָּא וּבְיוֹמָא שְׁבִיעָאָה הַהוּא תְּהוֹן כְּנִישִׁין בְּתוּשְׁבְּחָא קֳדָם יְיָ אֱלָהָכוֹן לָא תַעַבְדוּן עִיבִידְתָּא", "pj_en": "On the first day thou shalt offer the omer, and eat unleavened cakes of the old corn; but in the six remaining days you may begin to eat unleavened cakes of the new corn, and on the seventh day you shall assemble with thanksgiving before the Lord your God; no work shall you perform.", "tj": "", "tj_en": "", "rashi": "<b>ששת ימים תאכל מצות.<\/b> וּבְמָקוֹם אַחֵר (שמות י\"ב) הוּא אוֹמֵר \"שִׁבְעַת יָמִים\"? שִׁבְעָה מִן הַיָּשָׁן וְשִׁשָּׁה מִן הֶחָדָשׁ (ספרי; מנחות ס\"ו); דָּ\"אַ — לִמֵּד עַל אֲכִילַת מַצָּה בַּשְּׁבִיעִי שֶׁאֵינָהּ חוֹבָה, וּמִכָּאן אַתָּה לָמֵד לְשֵׁשֶׁת יָמִים, שֶׁהֲרֵי שְׁבִיעִי בִּכְלָל הָיָה וְיָצָא מִן הַכְּלָל לְלַמֵּד שֶׁאֵין אֲכִילַת מַצָּה בּוֹ חוֹבָה אֶלָּא רְשׁוּת, וְלֹא לְלַמֵּד עַל עַצְמוֹ יָצָא, אֶלָּא לְלַמֵּד עַל הַכְּלָל כֻּלּוֹ יָצָא, מַה שְּׁבִיעִי רְשׁוּת אַף כֻּלָּם רְשׁוּת, חוּץ מִלַּיְלָה הָרִאשׁוֹן שֶׁהַכָּתוּב קְבָעוֹ חוֹבָה, שֶׁנֶּאֱמַר (שמות י\"ב) \"בָּעֶרֶב תֹּאכְלוּ מַצֹּת\" (מכילתא; פסחים ק\"כ):<br><br><b>עצרת לה' אלהיך.<\/b> עֲצֹר עַצְמְךָ מִן הַמְּלָאכָה; דָּ\"אַ — כְּנוּפְיָא שֶׁל מַאֲכָל וּמִשְׁתֶּה, לְשׁוֹן \"נַעְצְרָה נָּא אוֹתָךְ\" (שופטים י\"ג):", "rashi_en": "ששת ימים תאכל מצות SIX DAYS THOU SHALT EAT UNLEAVENED BREAD — But in another passage it states, (Exodus 12:15): “seven days [ye shall eat unleavened bread]’’! But the explanation is: seven days ye may eat Mazzoth prepared from the old produce and six days (out of the seven. i.e. the last six days, after the Omer has been offered and the new crop has become permitted as food) ye may eat Mazzoth prepared from the new crop (Sifrei Devarim 134:5). Another explanation is: It teaches regarding the eating of unleavened bread on the seventh day of Passover that it is not obligatory; and from here (from this law concerning the seventh day) you may derive the law for the other six days. For the seventh day was included in the general statement (“seven days, thou shalt eat unleavened bread’’), and in the text: “six days thou shall eat unleavened bread” it has left the general statement, to teach ... eating unleavened bread on it is not obligatory but optional. Now, according to the well-known rule, it did not leave the general statement in order to teach this regarding itself alone but regarding everything that is included in the general statement. Now how is it with the seventh day? It is optional as regards the eating of unleavened bread (as explained in the earlier portion of this comment)! This, too, according to the rule, applies also to everything that was included in the general statement, and therefore all the other days are also optional in this respect, with the exception, however, of the first night of Passover, for which Scripture has fixed it (the eating of unleavened bread) as an obligation, as it is said, (Exodus 22:18) “at evening ye shall eat unleavened bread” (Pesachim 120a; cf. also Rashi on Exodus 12:15).<br><br>עצרת לה' אלהיך [AND ON THE SEVENTH DAY SHALL BE] A RESTRICTION IN HONOR OF THE LORD — i.e., restrict yourself from work (Chagigh 18a). — Another explanation is that עצרת denotes a gathering for eating and drinking (a banquet), like the expression used (Judges 13:15) “Let us detain (נעצרה) thee [that we may make ready a kid for thee]”."}, {"ch": 16, "v": 9, "aliyah": 7, "heb": "שִׁבְעָ֥ה שָׁבֻעֹ֖ת תִּסְפׇּר־לָ֑ךְ מֵהָחֵ֤ל חֶרְמֵשׁ֙ בַּקָּמָ֔ה תָּחֵ֣ל לִסְפֹּ֔ר שִׁבְעָ֖ה שָׁבֻעֽוֹת׃", "onk": "שִׁבְעָא שָׁבוּעִין תִּמְנֵי לָךְ מִדְּשַׁרְיוּת מַגְּלָא בַּחֲצַד עוּמְרָא דַאֲרָמוּתָא תִּשְׁרֵי לְמִמְנֵי שִׁבְעָא שָׁבוּעִין:", "onk_en": "Seven weeks count for yourself; from the time the sickle begins felling the standing grain, begin to count seven weeks.", "pj": "שׁוּבְעָא שְׁבוּעִין תִּימְנוּן לְכוֹן מִזְמַן דְּתִשְׁרוּן לְמִשְׁלַח מַגְלָא לְמַחֲצוֹד בְּחַקְלָא בָּתַר חֲצַד עוֹמְרָא תֵּישְׁרוּן לְמִמְנֵי שׁוּבְעָא שְׁבוּעִין", "pj_en": "Seven weeks number to you; from the time when you begin to put the sickle to the harvest of the field after the reaping of the omer you shall begin to number the seven weeks.", "tj": "", "tj_en": "", "rashi": "<b>מהחל חרמש בקמה.<\/b> מִשֶּׁנִּקְצַר הָעֹמֶר שֶׁהוּא רֵאשִׁית הַקָּצִיר (עי' ספרי; מנחות ע\"א):", "rashi_en": "מהחל חרמש בקמה [BEGIN TO NUMBER SEVEN WEEKS] FROM THE TIME THOU BEGINNEST TO PUT THE SICKLE TO THE CORN — i.e. from when the “Omer” has been cut (from the sixteenth of Nisan) which is the first produce to be harvested (Leviticus 23:10) (cf. Sifrei Devarim 136:2-3; Menachot 71a)."}, {"ch": 16, "v": 10, "aliyah": 7, "heb": "וְעָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַיהֹוָ֣ה אֱלֹהֶ֔יךָ מִסַּ֛ת נִדְבַ֥ת יָדְךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּאֲשֶׁ֥ר יְבָרֶכְךָ֖ יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "וְתַעְבֵּד חַגָּא דְשָׁבוּעַיָּא <b>קֳדָם<\/b> יְיָ אֱלָהָךְ מִסַּת נִדְבַת יְדָךְ דִּי תִתֵּן כְּמָא דִי יְבָרֵכִנָּךְ יְיָ אֱלָהָךְ:", "onk_en": "You are to celebrate the festival of <i>Shovuos<\/i> for [<b>before<\/b>] Adonoy, your God, to the fullness of your open-handed gift that you can give, as Adonoy, your God, has blessed you.", "pj": "וְתַעַבְדוּן חֶדְוַת חַגָּא דְשָׁבוּעַיָיא קֳדָם יְיָ אֱלָהָכוֹן הֵי כְּמֵסַת נִדְבַת יְדֵיכוֹן הֵיכְמָא דְבָרְכֵיכוֹן יְיָ אֱלָהָכוֹן", "pj_en": "And you shall keep with joy the Festival of Weeks before the Lord your God, after the measure of the freewill offerings of your hands, according as the Lord your God shall have blessed you.", "tj": "", "tj_en": "", "rashi": "<b>מסת נדבת ידך.<\/b> דֵּי נִדְבַת יָדְךָ, הַכֹּל לְפִי הַבְּרָכָה הָבֵא שַׁלְמֵי שִׂמְחָה וְקַדֵּשׁ קְרוּאִים לֶאֱכֹל:", "rashi_en": "מסת נדבת ידך means sufficient (די) free-will offerings of thy hand (i.e. of thy possession) (cf. Targum on Deuteronomy 15:8, which renders די מחסרו by כמסת חסרונה); everything must be in accordance with the blessing which God has bestowed upon you (אשר יברכך): offer peace-offerings of rejoicing and invite guests for the meal."}, {"ch": 16, "v": 11, "aliyah": 7, "heb": "וְשָׂמַחְתָּ֞ לִפְנֵ֣י&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ אַתָּ֨ה וּבִנְךָ֣ וּבִתֶּ֘ךָ֮ וְעַבְדְּךָ֣ וַאֲמָתֶ֒ךָ֒ וְהַלֵּוִי֙ אֲשֶׁ֣ר בִּשְׁעָרֶ֔יךָ וְהַגֵּ֛ר וְהַיָּת֥וֹם וְהָאַלְמָנָ֖ה אֲשֶׁ֣ר בְּקִרְבֶּ֑ךָ בַּמָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לְשַׁכֵּ֥ן שְׁמ֖וֹ שָֽׁם׃", "onk": "וְתֶחֱדֵי <b>קֳדָם<\/b> יְיָ אֱלָהָךְ אַתְּ וּבְרָךְ וּבְרַתָּךְ וְעַבְדָּךְ וְאַמְתָךְ וְלֵוָאָה דִּי בְקִרְוָיךְ וְגִיּוֹרָא וְיִתַּמָּא וְאַרְמְלָא דִּי בֵינָךְ בְּאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ לְאַשְׁרָאָה <b>שְׁכִנְתֵּיהּ<\/b> תַּמָּן:", "onk_en": "You are to rejoice in the presence of [<b>before<\/b>] Adonoy, your God—you, and your son and your daughter, and your male slave and your female slave, and the Levite who is in your city, and the proselyte, and the orphan and the widow who are among you—in the place that Adonoy, your God, chooses to house His Presence [<b>Shechinah<\/b>] there.", "pj": "וְתֵיחְדוּן בְּחֶדְוַת חַגָא קֳדָם יְיָ אֱלָהָכוֹן אַתּוּן וּבְנֵיכוֹן וּבְנָתֵיכוֹן וְעַבְדֵיכוֹן וְאַמְהָתֵיכוֹן וְלֵוָאֵי דִי בְקִרְוֵיכוֹן וְגִיּוֹרָא וְיַתְמָא וְאַרְמַלְתָּא דִי בֵינֵיכוֹן בְּאַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן לְאַשְׁרָאָה שְׁכִינְתֵּיהּ תַּמָּן", "pj_en": "And you shall rejoice with the joy of the feast before the Lord your God, you and your sons, your daughters, your servants and handmaids, the Levites who are in your cities, and the stranger, the orphan, and the widow who are among you, at the place which the Lord your God will choose where to make His Shekinah to dwell.", "tj": "", "tj_en": "", "rashi": "<b>לוי גר יתום ואלמנה.<\/b> אַרְבָּעָה שֶׁלִּי כְּנֶגֶד אַרְבָּעָה שֶׁלְּךָ – <b>בנך ובתך ועבדך ואמתך<\/b>, אִם אַתָּה מְשַׂמֵּחַ אֶת שֶׁלִּי אֲנִי מְשַׂמֵּחַ אֶת שֶׁלְּךָ:", "rashi_en": "לוי גר יתום ואלמנה THE LEVITE THE STRANGER, THE FATHERLESS, THE WIDOW — these four are Mine, corresponding to four that are yours, viz., בנך ובתך ועבדך ואמתך THY SON, THY DAUGHTER, THY MAN-SERVANT AND THY MAID-SERVANT; if you gladden Mine, I will gladden yours (Midrash Tanchuma, Re'eh 18)."}, {"ch": 16, "v": 12, "aliyah": 7, "heb": "וְזָ֣כַרְתָּ֔ כִּי־עֶ֥בֶד הָיִ֖יתָ בְּמִצְרָ֑יִם וְשָׁמַרְתָּ֣ וְעָשִׂ֔יתָ אֶת־הַֽחֻקִּ֖ים הָאֵֽלֶּה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִדְכַּר אֲרֵי עַבְדָּא הֲוֵיתָא בְּמִצְרָיִם וְתִטַּר וְתַעְבֵּד יָת קְיָמַיָּא הָאִלֵּין:", "onk_en": "Remember that you were a slave in Egypt; you are to guard and celebrate these statutes.", "pj": "וְתֶהֱווֹן דְּכִירִין אֲרוּם מְשַׁעְבְּדִין הֲוֵיתוּן בְּמִצְרַיִם וְתִיטְרוּן וְתַעַבְדוּן יַת קְיָימַיָא הָאִלֵין", "pj_en": "Remember that you were servants in Mizraim; so shall you observe and perform these statutes.", "tj": "", "tj_en": "", "rashi": "<b>וזכרת כי עבד היית וגו'.<\/b> עַל מְנָת כֵּן פְּדִיתִיךָ, שֶׁתִּשְׁמֹר וְתַעֲשֶׂה אֶת הַחֻקִּים הָאֵלֶּה:", "rashi_en": "וזכרת כי עבד היית וגו׳ AND THOU SHALT REMEMBER THAT THOU WAST A SERVANT [IN EGYPT] — Only on this condition did I deliver you from Egypt: that you keep and do these statutes."}, {"ch": 16, "v": 13, "aliyah": 7, "heb": "חַ֧ג הַסֻּכֹּ֛ת תַּעֲשֶׂ֥ה לְךָ֖ שִׁבְעַ֣ת יָמִ֑ים בְּאׇ֨סְפְּךָ֔ מִֽגׇּרְנְךָ֖ וּמִיִּקְבֶֽךָ׃", "onk": "חַגָּא דִמְטַלַּיָּא תַּעְבֵּד לָךְ שִׁבְעָא יוֹמִין בְּמִכְנְשָׁךְ מֵאִדְּרָךְ וּמִמַּעֲצַרְתָּךְ:", "onk_en": "The festival of <i>Sukkos<\/i> celebrate for yourself seven days, when you harvest your threshing-floor and your wine-press.", "pj": "חַגָא דִמְטָלַיָא תַעַבְּדוּן לְכוֹן שׁוּבְעָא יוֹמִין בְּמִשְׁלַמְכוֹן לְמִכְנוֹשׁ עֲלַלְתָּא מֵאִידִירֵכוֹן וְחַמְרָא מִן מַעֲצַרְתֵּיכוֹן", "pj_en": "The Feast of Tabernacles you shall make to you seven days, when you will have completed to gather in the corn from your threshing floors, and the wine from your presses.", "tj": "", "tj_en": "", "rashi": "<b>באספך.<\/b> בִּזְמַן הָאָסִיף שֶׁאַתָּה מַכְנִיס לַבַּיִת פֵּרוֹת הַקַּיִץ; דָּ\"אַ — <b>באספך מגרנך ומיקבך<\/b>, לִמֵּד שֶׁמְּסַכְּכִין אֶת הַסֻּכָּה בִּפְסֹלֶת גֹּרֶן וְיֶקֶב (ראש השנה י\"ג; סוכה י\"ב):", "rashi_en": "באספך [THOU SHALT KEEP THE FESTIVAL OF TABERNACLES …] AFTER THAT THOU HAST GATHERED IN THE PRODUCE — i.e. at the usual harvest time, when thou bringest into the house the summer fruits. Another explanation is: באספך מגרנך ומיקבך teaches that one should cover the Succah only with the פסולת (lit., the chips, — that which falls off) of the barn and the wine-press [i.e. with vegetable matter] (Rosh Hashanah 13a; Sukkah 12a)."}, {"ch": 16, "v": 14, "aliyah": 7, "heb": "וְשָׂמַחְתָּ֖ בְּחַגֶּ֑ךָ אַתָּ֨ה וּבִנְךָ֤ וּבִתֶּ֙ךָ֙ וְעַבְדְּךָ֣ וַאֲמָתֶ֔ךָ וְהַלֵּוִ֗י וְהַגֵּ֛ר וְהַיָּת֥וֹם וְהָאַלְמָנָ֖ה אֲשֶׁ֥ר בִּשְׁעָרֶֽיךָ׃", "onk": "וְתֶחֱדֵי בְּחַגָּךְ אַתְּ וּבְרָךְ וּבְרַתָּךְ וְעַבְדָּךְ וְאַמְתָךְ וְלֵוָאָה וְגִיּוֹרָא וְיִתַּמָּא וְאַרְמְלָא דִּי בְקִרְוָיךְ:", "onk_en": "You are to rejoice during your festival—you and your son and your daughter, and your male slave and your female slave, and the Levite and the proselyte, and the orphan and the widow who are in your city.", "pj": "וְתֵיחְדוּן בְּחֶדְוַת חַגֵּיכוֹן בְּשָׁאוּבְתָּא וְחָלִילָא אַתּוּן וּבְנֵיכוֹן וּבְנָתֵיכוֹן וְאַמְהוֹתֵיכוֹן וְלֵיוָאָה וְגִיּוֹרָא וְיַתְמָא וְאַרְמַלְתָּא דִי בְקִרְוֵיכוֹן", "pj_en": "And you shall rejoice in the joy of your feasts with the clarinet and flute, you and your sons and daughters, your handmaids, the Levite, the stranger, the orphan, and the widow, who are in your cities.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 15, "aliyah": 7, "heb": "שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַיהֹוָ֣ה אֱלֹהֶ֔יךָ בַּמָּק֖וֹם אֲשֶׁר־יִבְחַ֣ר יְהֹוָ֑ה כִּ֣י יְבָרֶכְךָ֞ יְהֹוָ֣ה אֱלֹהֶ֗יךָ בְּכֹ֤ל תְּבוּאָֽתְךָ֙ וּבְכֹל֙ מַעֲשֵׂ֣ה יָדֶ֔יךָ וְהָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ׃", "onk": "שִׁבְעָא יוֹמִין תֵּחוֹג קֳדָם יְיָ אֱלָהָךְ בְּאַתְרָא דִּי יִתִּרְעֵי יְיָ אֲרֵי יְבָרֵכִנָּךְ יְיָ אֱלָהָךְ בְּכָל עֲלַלְתָּךְ וּבְכָל עוֹבָדֵי יְדָיךְ וּתְהֵי בְּרַם חָדֵי:", "onk_en": "Seven days are you to be festive for Adonoy, your God, in the place Adonoy chooses, for Adonoy, your God, will bless you in all your produce and in all your endeavors; and you shall experience pure joy.", "pj": "שׁוּבְעָא יוֹמָא תְּחַגּוּן קֳדָם יְיָ אֱלָהָכוֹן בְּאַתְרָא דְיִתְרְעֵי יְיָ אֲרוּם יְבָרֵיכְכוֹן יְיָ אֱלָהָכוֹן בְּכָל עֲלַלְתְּכוֹן וּבְכָל עוֹבָדֵי אִידֵיכוֹן וְתֶהֱווֹן בְּרַם חַדְוָן בְּאַצְלָחוּתָא", "pj_en": "Seven days you shall keep the feast before the Lord your God in the place which the Lord will choose, because the Lord your God will have blessed you in all your provision, and in all the work of your hands, and so shall you be joyful in prosperity.", "tj": "", "tj_en": "", "rashi": "<b>והיית אך שמח.<\/b> לְפִי פְשׁוּטוֹ אֵין זֶה לְשׁוֹן צִוּוּי אֶלָּא לְשׁוֹן הַבְטָחָה, וּלְפִי תַלְמוּדוֹ לָמְדוּ מִכָּאן לְרַבּוֹת לֵילֵי יוֹם טוֹב הָאַחֲרוֹן לְשִׂמְחָה (שם מ\"ח):", "rashi_en": "והיית אך שמח ONLY BE REJOICED — According to its plain sense this is not the expression of a command but expresses an assurance: “thou will be rejoicing”. But according to the Halachic interpretation they (the Rabbis) derived from here that the night before the last day of the festival (that preceding the eighth day) is to be included in the obligation of rejoicing (Sukkah 48a; cf. Sifrei Devarim 142:4)."}, {"ch": 16, "v": 16, "aliyah": 7, "heb": "שָׁל֣וֹשׁ פְּעָמִ֣ים&thinsp;<small>׀<\/small>&thinsp;בַּשָּׁנָ֡ה יֵרָאֶ֨ה כׇל־זְכוּרְךָ֜ אֶת־פְּנֵ֣י&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹהֶ֗יךָ בַּמָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּחַ֧ג הַמַּצּ֛וֹת וּבְחַ֥ג הַשָּׁבֻע֖וֹת וּבְחַ֣ג הַסֻּכּ֑וֹת וְלֹ֧א יֵרָאֶ֛ה אֶת־פְּנֵ֥י יְהֹוָ֖ה רֵיקָֽם׃", "onk": "תְּלַת זִמְנִין בְּשַׁתָּא יִתְחֲזֵי כָל דְּכוּרָךְ <b>קֳדָם<\/b> יְיָ אֱלָהָךְ בְּאַתְרָא דִּי יִתִּרְעֵי בְּחַגָּא דְפַטִּירַיָּא וּבְחַגָּא דְשָׁבוּעַיָּא וּבְחַגָּא דִמְטַלַּיָּא וְלָא יִתְחֲזֵי <b>קֳדָם<\/b> יְיָ רֵיקָנוּן:", "onk_en": "Three times a year are all your males to be seen in the presence of [<b>before<\/b>] Adonoy, your God, in the place that He chooses—in the festival of Matzos, and on the festival of Shovuos, and on the festival of Sukkos—and he shall not appear in the presence of [<b>before<\/b>] Adonoy empty-handed.", "pj": "תְּלַת זִימְנִין בְּשַׁתָּא יִתְחֲמוּן כָּל דְּכוּרֵיכוֹן קֳדָם יְיָ אֱלָהָכוֹן בְּאַתְרָא דְיִתְרְעֵי בְּחַגָּא דְפַטִּירַיָא וּבְחַגָּא דְשָׁבוּעַיָא וּבְחַגָּא דִמְטָלַיָא וְלֵיתֵיכוֹן רַשָּׁאִין לְמִתְחַמְיָא קֳדָם יְיָ אֱלָהָכוֹן רֵיקָנוּן מִכָּל מִצְוָתָא", "pj_en": "Three times in the year shall all your males appear before the Lord your God in the place that He will choose; at the Feast of the Unleavened, at the Feast of Weeks, and at the Feast of Tabernacles; nor must you appear before the Lord your God empty of any of the requirements;", "tj": "", "tj_en": "", "rashi": "<b>ולא יראה את פני ה' ריקם.<\/b> אֶלָּא הָבֵא עוֹלוֹת רְאִיָּה וְשַׁלְמֵי חֲגִיגָה:", "rashi_en": "ולא יראה את פני ה׳ ריקם AND THEY SHALL NOT APPEAR BEFORE THE LORD EMPTY, but — bring the burnt offerings that are obligatory when one appears before the Lord, and the peace offerings of the festival."}, {"ch": 16, "v": 17, "aliyah": 7, "heb": "אִ֖ישׁ כְּמַתְּנַ֣ת יָד֑וֹ כְּבִרְכַּ֛ת יְהֹוָ֥ה אֱלֹהֶ֖יךָ אֲשֶׁ֥ר נָֽתַן־לָֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "גְּבַר כְּמַתְּנַת יְדֵיהּ כְּבִרְכְּתָא דַּיְיָ אֱלָהָךְ דִּי יְהַב לָךְ:", "onk_en": "Everyone according to the gift appropriate to his means, according to the blessing of Adonoy, your God, that He gave you.", "pj": "גְּבַר הֵי כְּמֵיסַת מוֹהֲבוֹת יְדֵיהּ כְּבִרְכָתָא דַּיְיָ אֱלָהָכוֹן דִּיהַב לְכוֹן", "pj_en": "every one after the measure of the gifts of his hands, according to the blessing which the Lord your God hath bestowed upon you.", "tj": "", "tj_en": "", "rashi": "<b>איש כמתנת ידו.<\/b> מִי שֶׁיֵּשׁ לוֹ אוֹכְלִין הַרְבֵּה וּנְכָסִים מְרֻבִּין יָבִיא עוֹלוֹת מְרֻבּוֹת וּשְׁלָמִים מְרֻבִּים (ספרי; חגיגה ח'):", "rashi_en": "איש כמתנת ידו EVERY MAN [SHALL BRING] ACCORDING TO THE ABILITY OF HIS HAND TO GIVE — i.e. one who has a large household (lit., many eaters) and great possessions brings many burnt offerings and many peace offerings (Sifrei Devarim 143:10; Chagigah 8b)."}];
