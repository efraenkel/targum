<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פרשת במדבר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<header>
  <div class="title-row">
    <h1>פרשת במדבר</h1>

</header>

<main id="main"></main>

<script>
const SLUG = "bamidbar";
const DATA = [{"ch": 1, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֨ר יְהֹוָ֧ה אֶל־מֹשֶׁ֛ה בְּמִדְבַּ֥ר סִינַ֖י בְּאֹ֣הֶל מוֹעֵ֑ד בְּאֶחָד֩ לַחֹ֨דֶשׁ הַשֵּׁנִ֜י בַּשָּׁנָ֣ה הַשֵּׁנִ֗ית לְצֵאתָ֛ם מֵאֶ֥רֶץ מִצְרַ֖יִם לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בְּמַדְבְּרָא דְסִינַי בְּמַשְׁכַּן זִמְנָא בְּחַד לְיַרְחָא תִנְיָנָא בְּשַׁתָּא תִנְיֵתָא לְמִפַּקְהוֹן מֵאַרְעָא דְמִצְרַיִם לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe in the Sinai desert, in the Tent of Meeting, on the first [day] of the second month, in the second year of their exodus from the land of Egypt, saying:", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה בְּמַדְבְּרָא דְסִינַי בְּמַשְׁכַּן זִימְנָא בְּחַד לְיַרְחָא דְאִיָיר הוּא יַרְחָא תִּנְיָינָא דְמִן שַׁתָּא תִּנְיֵיתָא לִזְמַן מִפַּקְהוֹן מֵאַרְעָא דְמִצְרַיִם לְמֵימָר", "pj_en": "AND the Lord spake with Mosheh in the wilderness of Sinai, in the tabernacle of ordinance, on the first of the month Ijar, which was the second month of the second year from the time of their coming forth from the land of Mizraim, saying:", "tj": "", "tj_en": "", "rashi": "<b>וידבר. במדבר סיני באחד לחדש וגו'.<\/b> מִתּוֹךְ חִבָּתָן לְפָנָיו מוֹנֶה אוֹתָם כָּל שָׁעָה — כְּשֶׁיָּצְאוּ מִמִּצְרַיִם מְנָאָן, וּכְשֶׁנָּפְלוּ בָּעֵגֶל מְנָאָן לֵידַע מִנְיַן הַנּוֹתָרִים, כְּשֶׁבָּא לְהַשְׁרוֹת שְׁכִינָתוֹ עֲלֵיהֶם מְנָאָם, בְּאֶחָד בְּנִיסָן הוּקַם הַמִּשְׁכָּן וּבְאֶחָד בְּאִיָּר מְנָאָם:", "rashi_en": "וידבר… במדבר סיני … באחד לחדש וגו׳ AND [THE LORD] SPOKE [UNTO MOSES] IN THE DESERT OF SINAI … ON THE FIRST DAY OF THE [SECOND] MONTH … [TAKE YE THE SUM OF ALL THE CONGREGATION] etc. — Because they were dear to him, He counts them every now and then: when they went forth from Egypt He counted them (Exodus 12:37), when many of them fell in consequence of their having worshipped the golden calf He counted them to ascertain the number of those left (cf. Rashi Exodus 30:16); when he was about to make His Shechinah dwell amongst them (i. e. when He commanded them to make a Tabernacle), He again took their census; for on the first day of Nisan the Tabernacle was erected (Exodus 40:2) and shortly afterwards, on the first day of Iyar, He counted them."}, {"ch": 1, "v": 2, "aliyah": 1, "heb": "שְׂא֗וּ אֶת־רֹאשׁ֙ כׇּל־עֲדַ֣ת בְּנֵֽי־יִשְׂרָאֵ֔ל לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמ֔וֹת כׇּל־זָכָ֖ר לְגֻלְגְּלֹתָֽם׃", "onk": "קַבִּילוּ יָת <b>חֻשְׁבַּן<\/b> כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן כָּל דְּכוּרָא לְגֻלְגְּלַתְהוֹן:", "onk_en": "Take a head count [<b>the sum<\/b>] of the entire congregation of Bnei Yisroel according to their families to the house of their fathers counting the names of all males individually.", "pj": "קַבִּילוּ יַת חוּשְׁבַּן כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל לִגְנִיסַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן כָּל דְכוּרָא לְגֻלְגְלַתְהוֹן", "pj_en": "Take the account of the whole congregation of the Beni Israel, according to the families of their fathers' house, by the number of the names of all the males by their capitations.", "tj": "", "tj_en": "", "rashi": "<b>למשפחתם.<\/b> לֵידַע מִנְיַן כָּל שֵׁבֶט וָשֵׁבֶט:<br><br><b>לבית אבתם.<\/b> מִי שֶׁאָבִיו מִשֵּׁבֶט אֶחָד וְאִמּוֹ מִשֵּׁבֶט אַחֵר יָקוּם עַל שֵׁבֶט אָבִיו (עי' בבא בתרא ק\"ט):<br><br><b>לגלגלתם.<\/b> עַ\"יְ שְׁקָלִים — בֶּקַע לַגֻּלְגֹּלֶת:", "rashi_en": "למשפחתם — [TAKE YE THE SUM OF THE CONGREGATION …] AFTER THEIR FAMILIES — in order to ascertain the number of individuals in each tribe.<br><br>לבית אבתם BY THE HOUSE OF THEIR FATHERS — One whose father belongs to one tribe and his mother to another tribe shall take his stand with the tribe of his father (cf. Bava Batra 109b).<br><br>לגלגלתם BY THEIR POLLS — i. e. by means of shekels — “a beka a head (לגלגלת)”, as was prescribed on a previous occasion (Exodus 38:26)."}, {"ch": 1, "v": 3, "aliyah": 1, "heb": "מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כׇּל־יֹצֵ֥א צָבָ֖א בְּיִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛ם לְצִבְאֹתָ֖ם אַתָּ֥ה וְאַהֲרֹֽן׃", "onk": "מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כָּל <b>נָפֵק חֵילָא<\/b> בְּיִשְׂרָאֵל תִּמְנוּן יָתְהוֹן לְחֵילֵיהוֹן אַתְּ וְאַהֲרֹן:", "onk_en": "From twenty years old and above, all those eligible for the army [<b>who go to war<\/b>] of Israel, you shall count them according to their divisions, you and Aharon.", "pj": "מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא בְּיִשְרָאֵל תִּמְנוּן יַתְהוֹן לְחֵילֵיהוֹן אַנְתְּ וְאַהֲרן", "pj_en": "From each son twenty years and upwards, every one going out in the host in Israel; thou and Aharon number them by their hosts.", "tj": "", "tj_en": "", "rashi": "<b>כל יצא צבא.<\/b> מַגִּיד שֶׁאֵין יוֹצֵא בַּצָּבָא פָּחוּת מִבֶּן עֶשְׂרִים:", "rashi_en": "כל יצא צבא [FROM TWENTY YEARS OLD AND UPWARDS] ALL THAT GO FORTH TO THE HOST — This tells us that no one less than twenty years of age goes forth to the host (cf. Rashi on Exodus 30:14 and Note thereon)."}, {"ch": 1, "v": 4, "aliyah": 1, "heb": "וְאִתְּכֶ֣ם יִהְי֔וּ אִ֥ישׁ אִ֖ישׁ לַמַּטֶּ֑ה אִ֛ישׁ רֹ֥אשׁ לְבֵית־אֲבֹתָ֖יו הֽוּא׃", "onk": "וְעִמְּכוֹן יְהוֹן גַּבְרָא גַבְרָא לְשִׁבְטָא גְּבַר רֵישׁ לְבֵית אֲבָהָתוֹהִי הוּא:", "onk_en": "Along with you, there shall be one man for each tribe, each man shall be the head of his fathers’ house.", "pj": "וְעִמְכוֹן יְהוֹן גְבַר גְבַר לְשִׁבְטָא גְבַר רֵישׁ לְבֵית אַבְהָתוֹי הוּא", "pj_en": "And let there be with you a man of each tribe, a chief of his father's house.", "tj": "", "tj_en": "", "rashi": "<b>ואתכם יהיו.<\/b> כְּשֶׁתִּפְקְדוּ אוֹתָם יִהְיוּ עִמָּכֶם נְשִׂיא כָל שֵׁבֶט וָשֵׁבֶט:", "rashi_en": "ואתכם יהיו AND WITH YOU THERE SHALL BE [A MAN OF EVERY TRIBE] — when you number them there shall be with you the princes of each tribe."}, {"ch": 1, "v": 5, "aliyah": 1, "heb": "וְאֵ֙לֶּה֙ שְׁמ֣וֹת הָֽאֲנָשִׁ֔ים אֲשֶׁ֥ר יַֽעַמְד֖וּ אִתְּכֶ֑ם לִרְאוּבֵ֕ן אֱלִיצ֖וּר בֶּן־שְׁדֵיאֽוּר׃", "onk": "וְאִלֵּין שְׁמָהַת גֻּבְרַיָּא דִּי יְקוּמוּן עִמְּכוֹן לִרְאוּבֵן אֱלִיצוּר בַּר שְׁדֵיאוּר:", "onk_en": "These are the names of the men who shall stand along with you. For [the tribe of] Reuven, Elitzur the son of Shdeiur.", "pj": "וְאִלֵין שְׁמָהָיַית גוּבְרַיָא דִיקוּמוּן עִמְכוֹן לִרְאוּבֵן אַמַרְכּוֹל אֱלִיצוּר בַּר שְׁדֵיאוּר", "pj_en": "And these are the names of the men who shall stand with you. Of Reuben, Elizur bar Shedeur:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 6, "aliyah": 1, "heb": "לְשִׁמְע֕וֹן שְׁלֻמִיאֵ֖ל בֶּן־צוּרִֽישַׁדָּֽי׃", "onk": "לְשִׁמְעוֹן שְׁלֻמִיאֵל בַּר צוּרִישַׁדָּי:", "onk_en": "For [the tribe of] Shimon, Shlumiel the son of Tzurishadai.", "pj": "לְשִׁמְעוֹן אַמַרְכּוֹל שְׁלֻמִיאֵל בַּר צוּרִי שַׁדָי", "pj_en": "of Shemeon, the leader, Shelumiel bar Zuri-Shaddai:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 7, "aliyah": 1, "heb": "לִֽיהוּדָ֕ה נַחְשׁ֖וֹן בֶּן־עַמִּינָדָֽב׃", "onk": "לִיהוּדָה נַחְשׁוֹן בַּר עַמִּינָדָב:", "onk_en": "For [the tribe of] Yehudah, Nachshon the son of Aminadav.", "pj": "לִיהוּדָה אַמַרְכּוֹל נַחְשׁוֹן בַּר עַמִינָדָב", "pj_en": "the prince of Jehudah, Nachshon bar Amminadab:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 8, "aliyah": 1, "heb": "לְיִ֨שָּׂשכָ֔ר נְתַנְאֵ֖ל בֶּן־צוּעָֽר׃", "onk": "לְיִשָּׂשכָר נְתַנְאֵל בַּר צוּעָר:", "onk_en": "For [the tribe of] Yissachar, Nesanel the son of Tzu’ar.", "pj": "לִישָשׁכָר אַמַרְכּוֹל נְתַנְאֵל בַּר צוּעָר", "pj_en": "the prince of Issakar, Nathaniel bar Zuar:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 9, "aliyah": 1, "heb": "לִזְבוּלֻ֕ן אֱלִיאָ֖ב בֶּן־חֵלֹֽן׃", "onk": "לִזְבוּלֻן אֱלִיאָב בַּר חֵלֹּן:", "onk_en": "For [the tribe of] Zevulun, Eliav the son of Cheilon.", "pj": "לִזְבוּלֻן אַמַרְכּוֹל אֱלִיאָב בַּר חֵילוֹן", "pj_en": "the prince of Zebulon, Eliab bar Chelon:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 10, "aliyah": 1, "heb": "לִבְנֵ֣י יוֹסֵ֔ף לְאֶפְרַ֕יִם אֱלִישָׁמָ֖ע בֶּן־עַמִּיה֑וּד לִמְנַשֶּׁ֕ה גַּמְלִיאֵ֖ל בֶּן־פְּדָהצֽוּר׃", "onk": "לִבְנֵי יוֹסֵף לְאֶפְרַיִם אֱלִישָׁמָע בַּר עַמִּיהוּד לִמְנַשֶּׁה גַּמְלִיאֵל בַּר פְּדָהצוּר:", "onk_en": "For the sons of Yoseif, for [the tribe of] Ephraim, Elishamah the son of Amihud. For [the tribe of] Menasheh, Gamliel the son of Pedahtzur.", "pj": "לִבְנֵי יוֹסֵף לְאֶפְרַיִם אַמַרְכּוֹל אֱלִישָׁמָע בַּר עַמִיהוּד לִמְנַשֶׁה אַמַרְכּוֹל גַמְלִיאֵל בַּר פְּדָהצוּר", "pj_en": "the prince of the Beni Joseph, of Ephraim, Elishama bar Ammihud: the prince of Menasheh, Gamliel bar Pedazur:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 11, "aliyah": 1, "heb": "לְבִ֨נְיָמִ֔ן אֲבִידָ֖ן בֶּן־גִּדְעֹנִֽי׃", "onk": "לְבִנְיָמִן אֲבִידָן בַּר גִּדְעֹנִי:", "onk_en": "For [the tribe of] Binyamin, Avidan the son of Gid’oni.", "pj": "לְבִנְיָמִין אַמַרְכּוֹל אֲבִידָן בַּר גִדְעוֹנִי", "pj_en": "the prince of Benjamin, Abidan bar Gideoni:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 12, "aliyah": 1, "heb": "לְדָ֕ן אֲחִיעֶ֖זֶר בֶּן־עַמִּֽישַׁדָּֽי׃", "onk": "לְדָן אֲחִיעֶזֶר בַּר עַמִּישַׁדָּי:", "onk_en": "For [the tribe of] Don, Achiezer the son of Amishadai.", "pj": "לְדָן אַמַרְכּוֹל אֲחִיעֶזֶר בַּר עַמִישַׁדָי", "pj_en": "the prince of Dan, Achiezer bar Ammi-shadai:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 13, "aliyah": 1, "heb": "לְאָשֵׁ֕ר פַּגְעִיאֵ֖ל בֶּן־עׇכְרָֽן׃", "onk": "לְאָשֵׁר פַּגְעִיאֵל בַּר עָכְרָן:", "onk_en": "For [the tribe of] Asher, Pagi’el the son of Ochran.", "pj": "לְאָשֵׁר אַמַרְכּוֹל פַּגְעִיאֵל בַּר עָכְרָן", "pj_en": "the prince of Asher, Pagiel bar Achran:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 14, "aliyah": 1, "heb": "לְגָ֕ד אֶלְיָסָ֖ף בֶּן־דְּעוּאֵֽל׃", "onk": "לְגָד אֶלְיָסָף בַּר דְּעוּאֵל:", "onk_en": "For [the tribe of] Gad, Elyasaf the son of De’uel.", "pj": "לְגָד אַמַרְכּוֹל אֶלְיָסָף בַּר דְעוּאֵל", "pj_en": "the prince of Gad, Eljasaph bar Dehuel:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 15, "aliyah": 1, "heb": "לְנַ֨פְתָּלִ֔י אֲחִירַ֖ע בֶּן־עֵינָֽן׃", "onk": "לְנַפְתָּלִי אֲחִירַע בַּר עֵינָן:", "onk_en": "For [the tribe of] Naftali, Achira the son of Einan.", "pj": "לְנַפְתָּלִי אַמַרְכּוֹל אֲחִירַע בַּר עֵינָן", "pj_en": "the prince of Naphtali, Achira bar Enan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 16, "aliyah": 1, "heb": "אֵ֚לֶּה <span class=\"mam-kq\"><span class=\"mam-kq-k\">(קריאי)<\/span> <span class=\"mam-kq-q\">[קְרוּאֵ֣י]<\/span><\/span> הָעֵדָ֔ה נְשִׂיאֵ֖י מַטּ֣וֹת אֲבוֹתָ֑ם רָאשֵׁ֛י אַלְפֵ֥י יִשְׂרָאֵ֖ל הֵֽם׃", "onk": "אִלֵּין מְעַרְעֵי כְנִשְׁתָּא רַבְרְבֵי שִׁבְטֵי אֲבָהַתְהוֹן רֵישֵׁי אַלְפַיָּא דְיִשְׂרָאֵל אִנּוּן:", "onk_en": "These are the ones called from the congregation, the leaders of their fathers’ tribes; they are the heads of the thousands of Yisroel.", "pj": "אִלֵין מְזַמְנֵי עַם כְּנִישְׁתָּא רַבְרְבֵי שִׁבְטַיָא דְאַבְהַתְהוֹן רֵישֵׁי אַלְפַיָא דְיִשְרָאֵל הִינוּן", "pj_en": "These (were) the notables of the congregation of the people, chiefs of their fathers' tribes, heads of thousands in Israel these.", "tj": "", "tj_en": "", "rashi": "<b>אלה קרואי העדה.<\/b> הַנִּקְרָאִים לְכָל דְּבַר חֲשִׁיבוּת שֶׁבָּעֵדָה:", "rashi_en": "אלה קרואי העדה THESE WERE THOSE CALLED OF THE CONGREGATION — those who were called upon for every matter of importance that happened in the congregation."}, {"ch": 1, "v": 17, "aliyah": 1, "heb": "וַיִּקַּ֥ח מֹשֶׁ֖ה וְאַהֲרֹ֑ן אֵ֚ת הָאֲנָשִׁ֣ים הָאֵ֔לֶּה אֲשֶׁ֥ר נִקְּב֖וּ בְּשֵׁמֹֽת<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז בְּשֵׁמֽוֹת)<\/i>׃", "onk": "וּנְסֵב משֶׁה וְאַהֲרֹן יָת גֻּבְרַיָּא הָאִלֵּין דִּי אִתְפָּרָשׁוּ בִּשְׁמָהָן:", "onk_en": "Moshe and Aharon took these men who were designated by name.", "pj": "וּדְבַר משֶׁה וְאַהֲרן יַת גוּבְרַיָא הָאִלֵין דְאִתְפְּרָשׁוּ בִּשְׁמָהָן", "pj_en": "And Mosheh and Aharon took these men who are expressed by their names:", "tj": "", "tj_en": "", "rashi": "<b>האנשים האלה.<\/b> אֶת שְׁנֵים עָשָׂר נְשִׂיאִים הַלָּלוּ:<br><br><b>אשר נקבו.<\/b> לוֹ כָּאן <b>בשמות<\/b>:", "rashi_en": "האנשים האלה [AND MOSES AND AARON] TOOK THESE MEN — these twelve princes. <br><br>אשר נקבו WHO WERE MENTIONED to him (Moses) here בשמות BY NAME."}, {"ch": 1, "v": 18, "aliyah": 1, "heb": "וְאֵ֨ת כׇּל־הָעֵדָ֜ה הִקְהִ֗ילוּ בְּאֶחָד֙ לַחֹ֣דֶשׁ הַשֵּׁנִ֔י וַיִּתְיַֽלְד֥וּ עַל־מִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמ֗וֹת מִבֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָמַ֖עְלָה לְגֻלְגְּלֹתָֽם׃", "onk": "וְיָת כָּל כְּנִשְׁתָּא אַכְנָשׁוּ בְּחַד לְיַרְחָא תִנְיָנָא וְאִתְיַחֲסוּ עַל זַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא לְגֻלְגְּלַתְהוֹן:", "onk_en": "They gathered together the entire congregation on the first [day] of the second month and they were registered by family ancestry according to the house of their fathers. according to the number of names each man of twenty years and above; individually.", "pj": "וְיַת כָּל כְּנִישְׁתָּא כְּנָשׁוּ בְּחַד יוֹמָא לְיַרְחָא דְאִיָיר הוּא יַרְחָא תִּנְיָינָא וְאִתְיַיחְסוּ עַל זַרְעֲיַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא לְגוּלְגְלַתְהוֹן", "pj_en": "and they assembled all the congregation on the first day of the month Ijar, which is the second month, and recensed them by the families of their fathers' house, by the number of their names, from twenty years old and upward by their capitations.", "tj": "", "tj_en": "", "rashi": "<b>ויתילדו על משפחתם.<\/b> הֵבִיאוּ סִפְרֵי יִחוּסֵיהֶם וְעֵדֵי חֶזְקַת לֵדָתָם, כָּל אֶחָד וְאֶחָד לְהִתְיַחֵס עַל הַשֵּׁבֶט (עי' ילקוט תרפ\"ד):", "rashi_en": "ויתילדו על משפחותם THEY DECLARED THEIR PEDIGREES AFTER THEIR FAMILIES — They brought the records of their pedigree and witnesses to confirm the prevalent presumption regarding their parentage, so that each might establish his pedigree with regard to the particular tribe (cf. Yalkut Shimoni on Torah 684)."}, {"ch": 1, "v": 19, "aliyah": 1, "heb": "כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶׁ֑ה וַֽיִּפְקְדֵ֖ם בְּמִדְבַּ֥ר סִינָֽי׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כְּמָא דִי פַקֵּיד יְיָ יָת משֶׁה וּמְנִנּוּן בְּמַדְבְּרָא דְסִינָי:", "onk_en": "Just as Adonoy commanded Moshe. He counted them in the Sinai desert.", "pj": "הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה וּמְנָנוּן בְּמַדְבְּרָא דְסִינָי", "pj_en": "As the Lord commanded Mosheh, they numbered them in the wilderness of Sinai.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 20, "aliyah": 2, "heb": "וַיִּהְי֤וּ בְנֵֽי־רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֤ר שֵׁמוֹת֙ לְגֻלְגְּלֹתָ֔ם כׇּל־זָכָ֗ר מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "וַהֲווֹ בְנֵי רְאוּבֵן בּוּכְרָא דְיִשְׂרָאֵל תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן לְגֻלְגְּלַתְהוֹן כָּל דְּכוּרָא מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "These were the sons of Reuven, Yisroel’s firstborn, their births according to their families according to the house of their fathers. according to the number of individual names every male of twenty years and above, all who go forth into the army.", "pj": "וַהֲווֹ בְנֵי רְאוּבֵן בּוּכְרָא דְיִשְרָאֵל יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן לְגוּלְגְלַתְהוֹן כָּל דְכוּרָא מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "And the sons of Reuben, the first-born of Israel by the families of the generations of their fathers' house, in the number of their names by their polls, every male from twenty years old and upward, all going forth in the host,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 21, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה רְאוּבֵ֑ן שִׁשָּׁ֧ה וְאַרְבָּעִ֛ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דִרְאוּבֵן אַרְבְּעִין וְשִׁתָּא אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "Their nunbers, for the tribe of Reuven, is forty-six thousand five hundred.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דִרְאוּבֵן אַרְבְּעִין וְשִׁית אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "the sum of the tribe of Reuben, forty-six thousand Five hundred.", "tj": "סְכוּמְיֵיהוֹן:", "tj_en": "Their sum.", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 22, "aliyah": 2, "heb": "לִבְנֵ֣י שִׁמְע֔וֹן תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם פְּקֻדָ֗יו בְּמִסְפַּ֤ר שֵׁמוֹת֙ לְגֻלְגְּלֹתָ֔ם כׇּל־זָכָ֗ר מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "לִבְנֵי שִׁמְעוֹן תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן מִנְיָנוֹהִי בְּמִנְיַן שְׁמָהָן לְגֻלְגְּלַתְהוֹן כָּל דְּכוּרָא מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "For the sons of Shimon, their births according to their families according to the house of their fathers, his numbers according to the number of individual names every male of twenty years and above, all who go forth into the army.", "pj": "לִבְנוֹי דְשִׁמְעוֹן יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן לְגֻלְגְלַתְהוֹן כָּל דְכוּרָא מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "Of the families of the Beni Shemeon, after the generations of their fathers' house in the number of their names by their polls, every male from twenty years and upward, every one going forth in the host,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 23, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה שִׁמְע֑וֹן תִּשְׁעָ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וּשְׁלֹ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דְשִׁמְעוֹן חַמְשִׁין וְתִשְׁעָה אַלְפִין וּתְלַת מְאָה:", "onk_en": "Their numbers, for the tribe of Shimon, is fifty-nine thousand three hundred.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דְשִׁמְעוֹן חַמְשִׁין וְתִשְׁעָה אַלְפִין וּתְלַת מְאָה", "pj_en": "the sum of the tribe of Shemeon, fifty-nine thousand three hundred:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 24, "aliyah": 2, "heb": "לִבְנֵ֣י גָ֔ד תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמ֗וֹת מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "לִבְנֵי גָד תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "For the sons of Gad, their births according to their families according to the house of their fathers in a counting of names. From twenty years and above, all who go forth into the army.", "pj": "לִבְנוֹי דְגָד יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן לְגוּלְגְלַתְהוֹן כָּל דְכוּרָא מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "of the family of the Beni Gad, after the generation of their fathers' house, in the number of their names by their polls, every male from twenty years and upward,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 25, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה גָ֑ד חֲמִשָּׁ֤ה וְאַרְבָּעִים֙ אֶ֔לֶף וְשֵׁ֥שׁ מֵא֖וֹת וַחֲמִשִּֽׁים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דְגָד אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְשִׁית מְאָה וְחַמְשִׁין", "onk_en": "Their numbers, for the tribe of Gad, is forty-five thousand six hundred and fifty.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דְגָד אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְשִׁית מְאָה וְחַמְשִׁין", "pj_en": "the sum of the tribe of Dan, forty-five thousand six hundred and fifty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 26, "aliyah": 2, "heb": "לִבְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמֹ֗ת מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "לִבְנֵי יְהוּדָה תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "For the sons of Yehudah, their births according to their families according to the house of their fathers, in a counting of names. From twenty years and above, all who go forth into the army.", "pj": "לִבְנוֹי דִיהוּדָה יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן לְגוּלְגְלַתְהוֹן כָּל דְכוּרָא מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "of the family of the Beni Jehudah, after the generation of their fathers' house, in the number of their names by their polls, every male from twenty years and upward,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 27, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה יְהוּדָ֑ה אַרְבָּעָ֧ה וְשִׁבְעִ֛ים אֶ֖לֶף וְשֵׁ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דִיהוּדָה שַׁבְעִין וְאַרְבְּעָא אַלְפִין וְשִׁית מְאָה:", "onk_en": "Their numbers, for the tribe of Yehudah, is seventy-four thousand six hundred.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דִיהוּדָה אַרְבְּעָה וְשִׁבְעִין אַלְפִין וְשִׁית מְאָה", "pj_en": "The sum of the tribe of Jehudah seventy-four thousand six hundred:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 28, "aliyah": 2, "heb": "לִבְנֵ֣י יִשָּׂשכָ֔ר תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמֹ֗ת מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "לִבְנֵי יִשָּׂשכָר תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "For the sons of Yissachar, their births according to their families according to the house of their fathers, in a counting of names. From twenty years and above, all who go forth into the army.", "pj": "לִבְנוֹי דְיִשָשׁכָר יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן לְגוּלְגְלַתְהוֹן כָּל דְכוּרָא מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "of the family of the Beni Issakar, after the generation of their fathers' house, in the number of their names by their polls, every ָהָן מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "of the family of the Beni Benjamin, after the generation of their fathers' house, in the number of their names by their polls, every male from twenty years and upward,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 37, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה בִנְיָמִ֑ן חֲמִשָּׁ֧ה וּשְׁלֹשִׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דְבִנְיָמִן תְּלָתִין וְחַמְשָׁא אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "Their numbers for the tribe of Binyamin, is thirty-five thousand four hundred.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דְבִנְיָמִין תְּלָתִין וְחַמְשָׁא אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "The sum of the tribe of Benjamin, thirty five thousand four hundred:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 38, "aliyah": 2, "heb": "לִבְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמֹ֗ת מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "לִבְנֵי דָן תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "For the sons of Don, their births according to their families according to the house of their fathers, in a counting of names from twenty years and above, all who go forth into the army.", "pj": "לִבְנוֹי דְדָן יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "of the family of the Beni Dan, after the generation of their fathers' house, in the number of their names by their polls, every male from twenty years and upward,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 39, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה דָ֑ן שְׁנַ֧יִם וְשִׁשִּׁ֛ים אֶ֖לֶף וּשְׁבַ֥ע מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דְדָן שִׁתִּין וּתְרֵין אַלְפִין וּשְׁבַע מְאָה:", "onk_en": "Their numbers, for the tribe of Don, is sixty-two thousand seven hundred.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דְדָן שִׁתִּין וּתְרֵין אַלְפִין וּשְׁבַע מְאָה", "pj_en": "The sum of the tribe of Dan, sixty-two thousand seven hundred:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 40, "aliyah": 2, "heb": "לִבְנֵ֣י אָשֵׁ֔ר תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמֹ֗ת מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "לִבְנֵי אָשֵׁר תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהֲתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "For the sons of Asher, their births according to their families according to the house of their fathers, in a counting of names from twenty years and above, all who go forth into the army.", "pj": "לִבְנוֹי דְאָשֵׁר יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "of the family of the Beni Asher, after the generation of their fathers' house, in the number of their names by their polls, every male from twenty years and upward,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 41, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה אָשֵׁ֑ר אֶחָ֧ד וְאַרְבָּעִ֛ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דְאָשֵׁר אַרְבְּעִין וְחַד אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "Their numbers, for the tribe of Asher is forty-one thousand five hundred.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דְאָשֵׁר אַרְבְּעִין וְחַד אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "The sum of the tribe of Asher, forty-one thousand five hundred:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 42, "aliyah": 2, "heb": "בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם בְּמִסְפַּ֣ר שֵׁמֹ֗ת מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כֹּ֖ל יֹצֵ֥א צָבָֽא׃", "onk": "בְּנֵי נַפְתָּלִי תּוּלְדַתְהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כֹּל נָפֵק חֵילָא:", "onk_en": "The sons of Naftali, their births according to their families according to the house of their fathers, in a counting of names from twenty years and above, all who go forth into the army.", "pj": "בְּנוֹי דְנַפְתָּלִי יִחוּסֵיהוֹן לִגְנִיסַתְהוֹן לְבֵית אַבְהַתְהוֹן בְּמִנְיַן שְׁמָהָן מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא", "pj_en": "of the family of the Beni Naphtali, after the generation of their fathers' house, in the number of their names by their polls, every male from twenty years and upward,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 43, "aliyah": 2, "heb": "פְּקֻדֵיהֶ֖ם לְמַטֵּ֣ה נַפְתָּלִ֑י שְׁלֹשָׁ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִנְיָנֵיהוֹן לְשִׁבְטָא דְנַפְתָּלִי חַמְשִׁין וּתְלַת אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "Their numbers, for the tribe of Naftali is fifty-three thousand four hundred.", "pj": "סְכוּמְהוֹן לְשִׁבְטָא דְנַפְתָּלִי חַמְשִׁין וּתְלָתָא אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "The sum of the tribe of Naphtali, fifty-three thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 44, "aliyah": 2, "heb": "אֵ֣לֶּה הַפְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְאַהֲרֹן֙ וּנְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ־אֶחָ֥ד לְבֵית־אֲבֹתָ֖יו הָיֽוּ׃", "onk": "אִלֵּין מִנְיָנַיָּא דִּי מְנָא משֶׁה וְאַהֲרֹן וְרַבְרְבֵי יִשְׂרָאֵל תְּרֵין עֲשַׂר גֻּבְרִין גַּבְרָא חַד לְבֵית אֲבָהָתוֹהִי הֲווֹ:", "onk_en": "These are the numbers which were counted [by] Moshe, Aharon and the leaders of Israel, [being] twelve men, each man was the head of his fathers’ house.", "pj": "אִלֵין סְכוּמֵי מִנְיָינַיָא דִמְנָא משֶׁה וְאַהֲרן וְרַבְרְבֵי יִשְרָאֵל תְּרֵיסַר גוּבְרִין גַבְרָא חָד לְבֵית אַבְהָתוֹי הֲוָון", "pj_en": "These are the sums of the numbered ones which Mosheh and Aharon, and the princes of Israel, twelve men, a man for each house of their fathers, did number.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 45, "aliyah": 2, "heb": "וַיִּֽהְי֛וּ כׇּל־פְּקוּדֵ֥י בְנֵֽי־יִשְׂרָאֵ֖ל לְבֵ֣ית אֲבֹתָ֑ם מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה כׇּל־יֹצֵ֥א צָבָ֖א בְּיִשְׂרָאֵֽל׃", "onk": "וַהֲווֹ כָּל מִנְיָנֵי בְנֵי יִשְׂרָאֵל לְבֵית אֲבָהַתְהוֹן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כָּל נָפֵק חֵילָא בְּיִשְׂרָאֵל:", "onk_en": "All the numbers of Bnei Yisroel according to the house of their fathers, from twenty years and above, all who go forth into the army of Israel,", "pj": "וַהֲווֹ כָּל סְכוּמֵי מִנְיָינֵי בְנֵי יִשְרָאֵל לְבֵית אַבְהַתְהוֹן מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא כָּל נָפִיק חֵילָא בְּיִשְרָאֵל", "pj_en": "And all the sums of the numbered of Beni Israel, according to the house of their fathers, from twenty years old and upward, of every one who goeth forth with the host in Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 46, "aliyah": 2, "heb": "וַיִּֽהְיוּ֙ כׇּל־הַפְּקֻדִ֔ים שֵׁשׁ־מֵא֥וֹת אֶ֖לֶף וּשְׁלֹ֣שֶׁת אֲלָפִ֑ים וַחֲמֵ֥שׁ מֵא֖וֹת וַחֲמִשִּֽׁים׃", "onk": "וַהֲווֹ כָּל מִנְיָנַיָּא שִׁית מְאָה וּתְלָתָא אַלְפִין וַחֲמֵשׁ מְאָה וְחַמְשִׁין:", "onk_en": "All their numbers were six hundred and three thousand five hundred and fifty.", "pj": "וַהֲווֹ כָּל סְכוּמֵי שִׁית מְאָה וּתְלַת אַלְפִין וַחֲמֵשׁ מְאָה וְחַמְשִׁין", "pj_en": "And all the sums (of the numbered of the Beni Israel) were six hundred and three thousand five hundred and fifty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 47, "aliyah": 2, "heb": "וְהַלְוִיִּ֖ם לְמַטֵּ֣ה אֲבֹתָ֑ם לֹ֥א הׇתְפָּקְד֖וּ בְּתוֹכָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלֵוָאֵי לְשִׁבְטָא דַאֲבָהַתְהוֹן לָא אִתְמְנִיאוּ בֵּינֵיהוֹן:", "onk_en": "The Levites, according to the tribe of their fathers were not counted among them.", "pj": "וְלֵיוָאֵי לְשִׁבְטָא דַאֲבָהַתְהוֹן לָא אִתְמְנִיאוּ בֵּינֵיהוֹן", "pj_en": "But the Levites after their father's tribe were not numbered among them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 48, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "For the Lord had spoken with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 49, "aliyah": 2, "heb": "אַ֣ךְ אֶת־מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְאֶת־רֹאשָׁ֖ם לֹ֣א תִשָּׂ֑א בְּת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "בְּרַם יָת שִׁבְטָא דְלֵוִי לָא תִמְנֵי וְיָת חֻשְׁבַּנְהוֹן לָא <b>תְקַבֵּל<\/b> בְּגוֹ בְּנֵי יִשְׂראֵל:", "onk_en": "However, the tribe of Levi you shall not count and you shall not take [<b>accept<\/b>] their head count among Bnei Yisroel.", "pj": "בְּרַם יַת שִׁבְטָא דְלֵוִי לָא תִמְנֵי וְיַת חוּשְׁבַּנְהוֹן לָא תְקַבֵּל בְּגוֹ בְּנֵי יִשְרָאֵל", "pj_en": "Nevertheless, the tribe of Levi thou shalt not number, nor take their sum among the children of Israel:", "tj": "", "tj_en": "", "rashi": "<b>אך את מטה לוי לא תפקד.<\/b> כְּדַאי הוּא לִגְיוֹן שֶׁל מֶלֶךְ לִהְיוֹת נִמְנֶה לְבַדּוֹ (תנחומא); דָּ\"אַ, צָפָה הַקָּבָּ\"ה שֶׁעֲתִידָה לַעֲמֹד גְּזֵרָה עַל כָּל הַנִּמְנִין מִבֶּן עֶשְֹרִים שָׁנָה וָמַעְלָה שֶׁיָּמוּתוּ בַמִּדְבָּר, אָמַר אַל יִהְיוּ אֵלּוּ בִכְלָל, לְפִי שֶׁהֵם שֶׁלִּי, שֶׁלֹּא טָעוּ בָעֵגֶל (שם; בבא בתרא קכ\"א):", "rashi_en": "אך את מטה לוי לא תפקד ONLY THOU SHALT NOT NUMBER THE TRIBE OF LEVI — The legion of the King is worthy to be numbered by itself (cf. Midrash Tanchuma, Bamidbar 15). — Another explanation is: The Holy One, blessed be He, foresaw that a decree would once be made against all those that had been numbered from twenty years and upwards, viz., that they should die in the wilderness (Numbers 14:29). He therefore said: Let these (the Levites) not be included amongst those now counted, in which case they must die, because they are Mine, since they did not sin by worshipping the golden calf (cf. Numbers Rabbah 3:7; Bava Batra 121b)."}, {"ch": 1, "v": 50, "aliyah": 2, "heb": "וְאַתָּ֡ה הַפְקֵ֣ד אֶת־הַלְוִיִּם֩ עַל־מִשְׁכַּ֨ן הָעֵדֻ֜ת וְעַ֣ל כׇּל־כֵּלָיו֮ וְעַ֣ל כׇּל־אֲשֶׁר־לוֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת־הַמִּשְׁכָּן֙ וְאֶת־כׇּל־כֵּלָ֔יו וְהֵ֖ם יְשָׁרְתֻ֑הוּ וְסָבִ֥יב לַמִּשְׁכָּ֖ן יַחֲנֽוּ׃", "onk": "וְאַתְּ מַנִּי יָת לֵוָאֵי עַל מַשְׁכְּנָא דְסַהֲדוּתָא וְעַל כָּל מָנוֹהִי וְעַל כָּל דִּי לֵיהּ אִנּוּן יִטְּלוּן יָת מַשְׁכְּנָא וְיָת כָּל מָנוֹהִי וְאִנּוּן יְשַׁמְּשֻׁנֵּיהּ וּסְחוֹר סְחוֹר לְמַשְׁכְּנָא יִשְׁרוּן:", "onk_en": "You shall appoint the Levites to oversee the <i>Mishkon<\/i> of Testimony and over all of its utensils and over all that belongs to it. They shall carry the <i>Mishkon<\/i> and all its utensils, and they shall administer it, and they shall camp around the <i>Mishkon.<\/i>", "pj": "וְאַנְתְּ מַנֵי יַת לֵוָאֵי עַל מַשְׁכְּנָא דְסַהֲדוּתָא וְעַל כָּל מָנוֹי וְעַל כָּל דִילֵיהּ הִינוּן יִטְלוּן יַת מַשְׁכְּנָא וְיַת כָּל מָנוֹי וְהִינוּן יְשַׁמְשׁוּנֵיהּ וַחֲזוֹר חֲזוֹר לְמַשְׁכְּנָא יִשְׁרוּן", "pj_en": "but thou shalt appoint the Levites over the tabernacle of the testimony, and over all its vessels, and whatever things pertain unto it. They shall carry the tabernacle and all its vessels, and do service in it; and round about the tabernacle shall they dwell.", "tj": "", "tj_en": "", "rashi": "<b>ואתה הפקד את הלוים.<\/b> כְּתַרְגּוּמוֹ \"מַנִּי\", לְשׁוֹן מִנּוּי שְׂרָרָה עַל דָּבָר שֶׁהוּא מְמֻנֶּה עָלָיו, כְּמוֹ \"וְיַפְקֵד הַמֶּלֶךְ פְּקִידִים\" (אסתר ב'):", "rashi_en": "ואתה הפקד את הלוים BUT THOU SHALT APPOINT THE LEVITES OVERSEERS [OVER THE TABERNACLE etc.] — Understand the word הפקד as the Targum does: ,מני “appoint”; it (the word מני) is an expression for appointing a person to control that thing over which he has been appointed; similar is, (Esther 2:3) “and let the king appoint (ויפקד) officers”."}, {"ch": 1, "v": 51, "aliyah": 2, "heb": "וּבִנְסֹ֣עַ הַמִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹתוֹ֙ הַלְוִיִּ֔ם וּבַחֲנֹת֙ הַמִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖וֹ הַלְוִיִּ֑ם וְהַזָּ֥ר הַקָּרֵ֖ב יוּמָֽת׃", "onk": "וּבְמִטַּל מַשְׁכְּנָא יְפָרְקוּן יָתֵיהּ לֵוָאֵי וּבְמִשְׁרֵי מַשְׁכְּנָא יְקִימוּן יָתֵיהּ לֵוָאֵי וְחִלּוֹנַי דְּיִקְרַב יִתְקְטָל:", "onk_en": "When the <i>Mishkon<\/i> is to be moved the Levites shall take it down, and when the <i>Mishkon<\/i> is to rest [in one place] the Levites shall erect it, and the stranger who approaches, shall die.", "pj": "וּבְמֵיטַל מַשְׁכְּנָא יִפְרְקוּן יָתֵיהּ לֵיוָאֵי וּבְמֵישְׁרֵי מַשְׁכְּנָא יְקִימוּן יָתֵיהּ לֵיוָאֵי וְחִילוֹנַי דְיִקְרַב יִתְקְטֵיל בְּאֵישָׁא מְצַלְהֲבָא מִן קֳדָם יְיָ", "pj_en": "And when the tabernacle is to go forward, the Levites shall take it apart; and when the tabernacle is to be stationary, the Levites are to uprear it: the common person who draweth near will be slain by a flaming fire from before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>יורידו אתו.<\/b> כְּתַרְגּוּמוֹ \"יְפָרְקוּן\", כְּשֶׁבָּאִין לִסַּע בַּמִּדְבָּר מִמַּסָּע לְמַסָּע הָיוּ מְפָרְקִין אוֹתוֹ מֵהֲקָמָתוֹ, וְנוֹשְׂאִין אוֹתוֹ עַד מָקוֹם אֲשֶׁר יִשְׁכֹּן שָׁם הֶעָנָן, וְיַחֲנוּ שָׁם וּמְקִימִין אוֹתוֹ:<br><br><b>והזר הקרב.<\/b> לַעֲבוֹדָתָם זוֹ:<br><br><b>יומת.<\/b> בִּידֵי שָׁמַיִם:", "rashi_en": "יורידו אתו [AND WHEN THE DWELLING SETTETH FORWARD] THE LEVITES SHALL TAKE IT DOWN — Understand יורידו as the Targum does: they shall take it apart. Whenever they were about to set out on a journey in the wilderness from one station to another (cf. Rashi Exodus 40:38) they took the structure apart (lit., they took it apart from its state of being put up) and carried it to the place where the cloud afterwards abode, and there they encamped and erected it (the Tabernacle).<br><br>והזר הקרב AND THE LAYMAN THAT COMETH NIGH to this service of theirs,<br><br>יומת SHALL BE PUT TO DEATH by heaven (not by sentence of the court) (cf. Sanhedrin 84a)."}, {"ch": 1, "v": 52, "aliyah": 2, "heb": "וְחָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל־מַחֲנֵ֛הוּ וְאִ֥ישׁ עַל־דִּגְל֖וֹ לְצִבְאֹתָֽם׃", "onk": "וְיִשְׁרוּן בְּנֵי יִשְׂרָאֵל גְּבַר עַל מַשְׁרוֹהִי וּגְבַר עַל טִקְסֵיהּ לְחֵילֵיהוֹן:", "onk_en": "Bnei Yisroel shall camp, each man at his own camp and each man at his own banner, according to their divisions.", "pj": "וְיִשְׁרוּן בְּנֵי יִשְרָאֵל גְבַר עַל בֵּית מֵשְׁרוֹי וּגְבַר עַל טִקְסֵיהּ לְחֵילֵיהוֹן", "pj_en": "And the sons of Israel shall encamp every one by the place of his own company, every one under his standard according to their hosts.", "tj": "", "tj_en": "", "rashi": "<b>ואישׁ על דגלו.<\/b> כְּמוֹ שֶׁהַדְּגָלִים סְדוּרִים בְּסֵפֶר זֶה – שְׁלֹשָׁה שְׁבָטִים לְכָל דֶּגֶל:", "rashi_en": "ואיש על דגלו [AND THE CHILDREN OF ISRAEL SHALL ENCAMP, EVERY MAN BY HIS OWN CAMP] AND EVERY MAN BY HIS OWN STANDARD, just as the order of the banners is given in this Book (Numbers) — three tribes for every banner."}, {"ch": 1, "v": 53, "aliyah": 2, "heb": "וְהַלְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְמִשְׁכַּ֣ן הָעֵדֻ֔ת וְלֹֽא־יִהְיֶ֣ה קֶ֔צֶף עַל־עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְשָׁמְרוּ֙ הַלְוִיִּ֔ם אֶת־מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָעֵדֽוּת׃", "onk": "וְלֵוָאֵי יִשְׁרוּן סְחוֹר סְחוֹר לְמַשְׁכְּנָא דְסַהֲדוּתָא וְלָא יְהֵי רוּגְזָא עַל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל וְיִטְּרוּן לֵוָאֵי יָת מַטְּרַת מַשְׁכְּנָא דְסַהֲדוּתָא:", "onk_en": "The Levites shall camp around the <i>Mishkon<\/i> of the Testimony, so that there will not be anger upon the congregation of Bnei Yisroel, and the Levites shall be careful to preserve the <i>Mishkon<\/i> of Testimony.", "pj": "וְלֵיוָאֵי יִשְׁרוּן חֲזוֹר חֲזוֹר לְמַשְׁכְּנָא דְסַהֲדוּתָא וְלָא יְהֵי רוּגְזָא עַל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל וְיִטְרוּן לֵיוָאֵי יַת מַטְרַת מַשְׁכְּנָא דְסַהֲדוּתָא", "pj_en": "But the Levites shall encamp round about the tabernacle of the testimony, that there may not be wrath upon the congregation of the children of Israel; and the Levites shall keep charge of the tabernacle of testimony.", "tj": "", "tj_en": "", "rashi": "<b>ולא יהיה קצף.<\/b> אִם תַּעֲשׂוּ כְּמִצְוֹתַי לֹא יִהְיֶה קֶצֶף, וְאִם לָאו, שֶׁיִּכָּנְסוּ זָרִים בַּעֲבוֹדָתָם זוֹ, יִהְיֶה קֶצֶף, כְּמוֹ שֶׁמָּצִינוּ בְמַעֲשֵׂה קֹרַח (במדבר י\"ז), כִּי יָצָא הַקֶּצֶף וְגוֹ':", "rashi_en": "ולא יהיה קצף THAT THERE BE NO ANGER [UPON THE CONGREGATION] — If you act according to My commands there will be no anger, but if not, — i.e., that strangers take part in this their (the Levites’) service, there will be anger, just as we find at the incident with Korah (Numbers 17:11): “for there is anger gone forth [from the Lord]”."}, {"ch": 1, "v": 54, "aliyah": 2, "heb": "וַֽיַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠כֹ֠ל אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֶת־מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲבָדוּ בְּנֵי יִשְׂרָאֵל כְּכֹל דִּי פַקִּיד יְיָ יָת משֶׁה כֵּן עֲבָדוּ:", "onk_en": "Bnei Yisroel did according to all that Adonoy commanded Moshe; they did it [exactly].", "pj": "וַעֲבָדוּ בְּנֵי יִשְרָאֵל כְּכָל דְפַקֵיד יְיָ יַת משֶׁה הֵיכְדֵין עָבָדוּ", "pj_en": "And the sons of Israel did according to all that the Lord commanded Mosheh, so did they.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 1, "aliyah": 3, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר", "pj_en": "And the Lord spake with Mosheh and with Aharon, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 2, "aliyah": 3, "heb": "אִ֣ישׁ עַל־דִּגְל֤וֹ בְאֹתֹת֙ לְבֵ֣ית אֲבֹתָ֔ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִנֶּ֕גֶד סָבִ֥יב לְאֹֽהֶל־מוֹעֵ֖ד יַחֲנֽוּ׃", "onk": "גְּבַר עַל טִקְסֵיהּ בְּאַתְוָן לְבֵית אֲבָהַתְהוֹן יִשְׁרוּן בְּנֵי יִשְׂרָאֵל מִלָּקֳבֵל סְחוֹר סְחוֹר לְמַשְׁכַּן זִמְנָא יִשְׁרוּן:", "onk_en": "Each man at his own banner, with the insignia of their fathers’ houses shall Bnei Yisroel encamp, at a distance around the Tent of Meeting they shall encamp.", "pj": "גְבַר עַל טִיקְסֵיהּ בְּאַתְוָן דְמִסְתַּמְנִין עַל טִיקְסֵיהוֹן לְבֵית אֲבָהַתְהוֹן יִשְׁרוּן בְּנֵי יִשְרָאֵל מִלְקָבֵיל סְחוֹר סְחוֹר לְמַשְׁכַּן זִמְנָא יִשְׁרוּן", "pj_en": "Every man of the Beni Israel shall encamp by his standard, by the ensign which is signified upon the standards of their fathers' house over against the tabernacle of ordinance shall they encamp round about.", "tj": "", "tj_en": "", "rashi": "<b>באתת.<\/b> כָּל דֶּגֶל יִהְיֶה לוֹ אוֹת מַפָּה צְבוּעָה תְלוּיָה בוֹ, צִבְעוֹ שֶׁל זֶה לֹא כְצִבְעוֹ שֶׁל זֶה, צֶבַע כָּל אֶחָד כְּגוֹן אַבְנוֹ הַקְּבוּעָה בַחֹשֶׁן, וּמִתּוֹךְ כָּךְ יַכִּיר כָּל אֶחָד אֶת דִּגְלוֹ; דָּ\"אַ: בְּאוֹתוֹת לְבֵית אֲבוֹתָם, בְּאוֹת שֶׁמָּסַר לָהֶם יַעֲקֹב אֲבִיהֶם כְּשֶׁנְּשָׂאוּהוּ מִמִּצְרַיִם שֶׁנֶּאֱמַר (בראשית נ') \"וַיַּעֲשׂוּ בָנָיו לוֹ כֵּן כַּאֲשֶׁר צִוָּם, יְהוּדָה וְיִשָּׂשכָר וּזְבוּלוּן יִשָּׂאוּהוּ מִן הַמִּזְרָח, וּרְאוּבֵן וְשִׁמְעוֹן וְגָד מִן הַדָּרוֹם וְכוּ'\", כִּדְאִיתָא בְתַנְחוּמָא בְּפַרָשָׁה זוֹ:<br><br><b>מנגד.<\/b> מֵרָחוֹק מִיל, כְּמוֹ שֶׁנֶּאֱמַר בִּיהוֹשֻׁעַ \"אַךְ רָחוֹק יִהְיֶה בֵּינֵיכֶם וּבֵנָיו כְּאַלְפַּיִם אַמָּה\" (יהושע ג'), שֶׁיּוּכְלוּ לָבֹא בְּשַׁבָּת; מֹשֶׁה וְאַהֲרֹן וּבָנָיו וְהַלְוִיִּם חוֹנִים בְּסָמוּךְ לוֹ:", "rashi_en": "באתת [EVERY MAN OF THE CHILDREN OF ISRAEL SHALL ENCAMP BY HIS OWN STANDARD] WITH THE SIGNS [OF THEIR FATHERS’ HOUSES] — Each banner shall have a different sign — a piece of coloured cloth hanging on it, the colour of the one not being the same as the colour of another, but the colour of each tribe shall be like that of his stone that is fixed in the breastplate (of. Exodus 28:21), and by this means everybody will be able to recognise his banner . Another explanation of באתת לבית אבתם is: by the signs (i.e., following the signs) which their father Jacob gave them severally when they carried him out from Egypt, as it is said, (Genesis 50:12) “And his sons did unto him exactly as he had commanded them”. For he had commanded that Judah, Issachar and Zebulun should carry him, having their position at the east side of the bier, Reuben, Simeon and Gad at the south side, etc., — as it is related in Tanchuma on this section (Midrash Tanchuma, Bamidbar 12; cf. Rashi on Genesis 50:12).<br><br>מנגד AT SOME DISTANCE [AROUND THE APPOINTED TENT THEY SHALL ENCAMP] — at a distance of a mile (2000 cubits), for it is said, (Joshua 3:4) “Yet there shall be between you (the Israelites) and it (the Ark), about two thousand cubits”; the reason for this distance, which was that of a Sabbath day’s journey, was that they might be able to come unto the vicinity of the Tabernacle for instruction on Sabbath, for Moses, Aaron and his sons and the Levites were encamped quite close to it (Bemidbar Rabbah 2:9; cf. Exodus 33:7 and Rashi thereon)."}, {"ch": 2, "v": 3, "aliyah": 3, "heb": "וְהַחֹנִים֙ קֵ֣דְמָה מִזְרָ֔חָה דֶּ֛גֶל מַחֲנֵ֥ה יְהוּדָ֖ה לְצִבְאֹתָ֑ם וְנָשִׂיא֙ לִבְנֵ֣י יְהוּדָ֔ה נַחְשׁ֖וֹן בֶּן־עַמִּינָדָֽב׃", "onk": "וְדִי שְׁרַן קִדּוּמָא מַדִּינְחָא טֵקַס מַשְׁרִית יְהוּדָה לְחֵילֵיהוֹן וְרַבָּא לִבְנֵי יְהוּדָה נַחְשׁוֹן בַּר עַמִּינָדָב:", "onk_en": "Those whose camp is in the forefront, on the eastern side is the camp of the banner of Yehudah according to their divisions, and the leader of the sons of Yehudah is Nachshon the son of Aminadav.", "pj": "מַשְׁרִיתָא דְיִשְרָאֵל הֲוָה אוּרְכָּא תְּרֵיסַר מִילִין וּפוּתְיָהּ תְּרֵיסַר מִילִין וְדִישְׁרַן קִידוּמָא מַדִינְחָא טֵיקַס מַשְׁרִיתָא יְהוּדָה לְחֵילֵיהוֹן בְּאַרְבַּעְתֵּי מִילִין מְרַבְּעִין וְטִיקְסֵיהּ הֲוָה מִמֵילַת תְּלַת גְוָונִין כָּל קְבֵיל תְּלַת מַרְגַלְיָתָא דִבְחוּשְׁנָא סְמוּקָא וְיָרוּקָא וּבְרוֹקָא וּבֵיהּ חָקִיק וּמְפָרֵשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא יְהוּדָה יִשָשׁכָר וּזְבוּלוּן וּבִמְצִיעוּתֵיהּ כְּתִיב יְקוּם יְיָ וְיִתְבַּדְרוּן סַנְאָךְ וְיִעַרְקוּן בַּעֲלֵי דְבָבָךְ מִן קֳדָמָךְ וּבֵיהּ הֲוָה חָקִיק צוּרַת בַּר אַרְיְוָן מְטוֹל דְרַבָּא לִבְנֵי יְהוּדָה נַחְשׁוֹן בַּר עַמִינָדָב", "pj_en": "The length of the camp of Israel shall be twelve miles, and its breadth twelve miles. And they who encamp eastward to the sunrise shall be of the standard of the camp of Jehudah by their hosts, spreading over four miles. And his standard shall be of silk, of three colours, corresponding with (those of) the precious stones which are in the breastplate,--sardius, topaz, and carbuncle; and upon it shall be expressed and set forth the names of the three tribes of Jehudah, Issakar, and Zebulon; and in the midst shall be written : Arise, O Lord, and let Thine enemies be scattered, and Thine adversaries be driven away before Thee; and upon it shall be set forth the figure of a young lion. And the Rabba of the Beni Jehudah shall be Nachshon bar Amminadab.", "tj": "", "tj_en": "", "rashi": "<b>קדמה.<\/b> לְפָנִים הַקְּרוּיָה קֶדֶם: וְאֵיזוֹ זוֹ רוּחַ מִזְרָחִית, וְהַמַּעֲרָב קָרוּי אָחוֹר:", "rashi_en": "קדמה means IN FRONT, which is expressed by קדם; and which side is it? The east side (מזרחה), and accordingly the west is termed אחור, the back side of the world (cf. Rashi on Exodus 27:13 and Note thereon)."}, {"ch": 2, "v": 4, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם אַרְבָּעָ֧ה וְשִׁבְעִ֛ים אֶ֖לֶף וְשֵׁ֥שׁ מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן שַׁבְעִין וְאַרְבְּעָא אַלְפִין וְשִׁית מְאָה:", "onk_en": "Its division and their numbers is seventy-four thousand six hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטַיָא שׁוּבְעִין וְאַרְבָּעָה אַלְפִין וְשִׁית מְאָה", "pj_en": "And the sum of the hosts of that tribe was seventy-four thousand six hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 5, "aliyah": 3, "heb": "וְהַחֹנִ֥ים עָלָ֖יו מַטֵּ֣ה יִשָּׂשכָ֑ר וְנָשִׂיא֙ לִבְנֵ֣י יִשָּׂשכָ֔ר נְתַנְאֵ֖ל בֶּן־צוּעָֽר׃", "onk": "וְדִי שְׁרַן <b>סְמִיכִין<\/b> עֲלוֹהִי שִׁבְטָא דְיִשָּׂשכָר וְרַבָּא לִבְנֵי יִשָּׂשכָר נְתַנְאֵל בַּר צוּעָר:", "onk_en": "Those who camp along with [<b>near<\/b>] him are; the tribe of Yissachar, and the leader of the sons of Yissachar is Nesanel the son of Tzu’ar.", "pj": "וְדִישְׁרַן סְמוּכִין לֵיהּ שִׁבְטָא דִישָשכָר וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי יִשָשכָר נְתַנְאֵל בַּר צוּעָר", "pj_en": "And they who encamp next by him shall be the tribe of Issakar, and the Rabba appointed over the host of the Beni Issakar, Nathaniel bar Zuar:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 6, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדָ֑יו אַרְבָּעָ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנוֹהִי חַמְשִׁין וְאַרְבְּעָא אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "Its division and its numbers is fifty-four thousand four hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטַיָא חַמְשִׁין וְאַרְבָּעָה אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "and the sum of the host of the tribe fifty-four thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 7, "aliyah": 3, "heb": "מַטֵּ֖ה זְבוּלֻ֑ן וְנָשִׂיא֙ לִבְנֵ֣י זְבוּלֻ֔ן אֱלִיאָ֖ב בֶּן־חֵלֹֽן׃", "onk": "שִׁבְטָא דִּזְבוּלֻן וְרַבָּא לִבְנֵי זְבוּלֻן אֱלִיאָב בַּר חֵלוֹן:", "onk_en": "The tribe of Zevulun, and the leader of the sons of Zevulun is Eliav the son of Cheilon.", "pj": "שִׁבְטָא דִזְבוּלוּן וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי זְבוּלֻן אֱלִיאָב בַּר חֵילוֹן", "pj_en": "The tribe of Zebulon,--the Rabba, Eliab bar Chelon;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 8, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדָ֑יו שִׁבְעָ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנוֹהִי חַמְשִׁין וְשִׁבְעָא אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "Its division and its numbers is fifty-seven thousand four hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמֵיהוֹן דְשִׁבְטֵיהּ חַמְשִׁין וְשׁוּבְעָא אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "the number, fifty-seven thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 9, "aliyah": 3, "heb": "כׇּֽל־הַפְּקֻדִ֞ים לְמַחֲנֵ֣ה יְהוּדָ֗ה מְאַ֨ת אֶ֜לֶף וּשְׁמֹנִ֥ים אֶ֛לֶף וְשֵֽׁשֶׁת־אֲלָפִ֥ים וְאַרְבַּע־מֵא֖וֹת לְצִבְאֹתָ֑ם רִאשֹׁנָ֖ה יִסָּֽעוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל מִנְיָנַיָּא לְמַשְׁרִית יְהוּדָה מְאָה וּתְמָנָן וְשִׁתָּא אַלְפִין וְאַרְבַּע מְאָה לְחֵילֵיהוֹן בְּקַדְמֵיתָא נָטְלִין:", "onk_en": "The total numbers for the encampment of Yehudah is one hundred eighty-six thousand four hundred according to their divisions, [and] they travel [in the] first [position].", "pj": "כָּל מִנְיָינַיָא לְמַשִׁרְיַת יְהוּדָה מְאָה וּתְמָנָן וְשִׁתָּא אַלְפִין וְאַרְבַּע מְאָה לְחֵילְוַותְהוֹן בְּקַדְמֵיתָא נַטְלִין", "pj_en": "All the numbered ones of the camp of Jehudah, one hundred and eighty-six thousand four hundred, by their hosts; they shall go forward in front.", "tj": "", "tj_en": "", "rashi": "<b>ראשנה יסעו.<\/b> כְּשֶׁרוֹאִין הֶעָנָן מִסְתַּלֵּק, תּוֹקְעִין הַכֹּהֲנִים בַּחֲצוֹצְרוֹת, וְנוֹסֵעַ מַחֲנֵה יְהוּדָה תְחִלָּה, וּכְשֶׁהוֹלְכִין הוֹלְכִין כְּדֶרֶךְ חֲנִיָּתָן — הַלְוִיִּם וְהָעֲגָלוֹת בָּאֶמְצָע, דֶּגֶל יְהוּדָה בַּמִּזְרָח, וְשֶׁל רְאוּבֵן בַּדָּרוֹם, וְשֶׁל אֶפְרַיִם בַּמַּעֲרָב, וְשֶׁל דָּן בַּצָּפוֹן:", "rashi_en": "ראשנה יסעו THESE SHALL FIRST JOURNEY — When they saw the cloud departing, the priests blew the trumpets and the camp of Judah moved off first, but when marching, they marched retaining the positions in which they always encamped: the Levites and the wagons in the centre (v. 17), the division of Judah in the East (v. 8), that of Reuben in the South, Ephraim’s in the West (v. 19) and Dan’s in the North (v. 25)."}, {"ch": 2, "v": 10, "aliyah": 3, "heb": "דֶּ֣גֶל מַחֲנֵ֧ה רְאוּבֵ֛ן תֵּימָ֖נָה לְצִבְאֹתָ֑ם וְנָשִׂיא֙ לִבְנֵ֣י רְאוּבֵ֔ן אֱלִיצ֖וּר בֶּן־שְׁדֵיאֽוּר׃", "onk": "טֵקַס מַשְׁרִית רְאוּבֵן דָּרוֹמָא לְחֵילֵיהוֹן וְרַבָּא לִבְנֵי רְאוּבֵן אֱלִיצוּר בַּר שְׁדֵיאוּר:", "onk_en": "The banner of the camp of Reuven is on the south side, according to their divisions, and the leader of the sons of Reuven is Elitzur the son of Shdeiur.", "pj": "טֵיקַס מַשִׁרְיַת רְאוּבֵן דָרוֹמָא יִשְׁרוּן לְחֵילֵיהוֹן בְּאַרְבַּעְתֵּי מִילִין מְרַבְּעָן וְטִיקְסֵיהּ הֲוָה מִמֵילַת תְּלַת גַוְונִין כָּל קְבֵל תְּלַת מַרְגַלְיָיתָא דִבְחוּשְׁנָא אַזְמוֹרַד וְשַׁבְזִיז וְסַבְהֲלוֹם וּבֵיהּ חָקִיק וּמְפָרֵשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא רְאוּבֵן שִׁמְעוֹן גָד וּבִמְצִיעוּתֵיהּ כְּתִיב שְׁמַע יִשְרָאֵל יְיָ אֱלָהָנָא יְיָ אֶחָד וּבֵיהּ הֲוָה חָקִיק צוּרַת בַּר אַיָלָא וַהֲוָה חָמֵי לְמֶהֱוֵי בֵּיהּ צוּרַת בַּר תּוֹרֵי בְּרַם משֶׁה נְבִיאָה חַלְפֵיהּ מְטוֹל דְלָא יִדְכַּר לְהוֹן חוֹבַת עֵיגְלָא וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִרְאוּבֵן אֱלִיצוּר בַּר שְׁדֵיאוּר", "pj_en": "(By) the standard of the camp of Reuben they, shall encamp southward by their hosts, spreading over four miles. And his standard shall be of silk, of three colours, corresponding with (those of) the precious stones that are in the breastplate, azmorad, sapphire, and adamant: on it shall be expressed and set forth the names of the three tribes of Reuben, Shemeon, Gad; and in the midst of it be written, Hear, Israel, the Lord our God is One; and upon it shall be set forth the figure of a stag. Some would have thought there should have been upon it the figure of a young ox; but Mosheh the prophet altered it, that the sin of the calf might not be remembered against them. And the Rabba set over the host of the tribe Reuben was Elizur bar Shedeur.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 11, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדָ֑יו שִׁשָּׁ֧ה וְאַרְבָּעִ֛ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנוֹהִי אַרְבְּעִין וְשִׁתָּא אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "Its divisions and its numbers is forty-six thousand five hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ אַרְבְּעִין וְשִׁתָּא אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "And his host and the numbered of his tribe ___", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 12, "aliyah": 3, "heb": "וְהַחוֹנִ֥ם עָלָ֖יו מַטֵּ֣ה שִׁמְע֑וֹן וְנָשִׂיא֙ לִבְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן־צוּרִֽישַׁדָּֽי׃", "onk": "וְדִי שְׁרַן סְמִיכִין עֲלוֹהִי שִׁבְטָא דְשִׁמְעוֹן וְרַבָּא לִבְנֵי שִׁמְעוֹן שְׁלֻמִיאֵל בַּר צוּרִישַׁדָּי:", "onk_en": "Those who camp along with him are; the tribe of Shimon, and the leader of the tribe of Shimon is Shlumiel the son of Tzurishadai.", "pj": "וְדִישְׁרַן סְמִיכִין עֲלוֹהִי שִׁבְטָא דְשִׁמְעוֹן וְרַבָּא לִבְנֵי שִׁמְעוֹן שְׁלֻמִיאֵל בַּר צוּרִי שַׁדָי", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 13, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם תִּשְׁעָ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וּשְׁלֹ֥שׁ מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן חַמְשִׁין וּתְשַׁע אַלְפִין וּתְלַת מְאָה:", "onk_en": "Its division and their numbers is fifty-nine thousand three hundred;", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ חַמְשִׁין וּתְשַׁע אַלְפִין וּתְלַת מְאָה", "pj_en": "were fifty-nine thousand three hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 14, "aliyah": 3, "heb": "וּמַטֵּ֖ה גָּ֑ד וְנָשִׂיא֙ לִבְנֵ֣י גָ֔ד אֶלְיָסָ֖ף בֶּן־רְעוּאֵֽל׃", "onk": "וְשִׁבְטָא דְּגָד וְרַבָּא לִבְנֵי גָד אֶלְיָסָף בַּר רְעוּאֵל:", "onk_en": "The tribe of Gad, and the leader of the sons of Gad is Elyasaf the son of Re’uel.", "pj": "וְשִׁבְטָא דְגָד וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא בְּנֵי גָד אֶלְיָסָף בַּר רְעוּאֵל", "pj_en": "The tribe of Gad: the Rabba set over the host of the tribe of the Beni Gad was Eljasaph bar Dehuel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 15, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם חֲמִשָּׁ֤ה וְאַרְבָּעִים֙ אֶ֔לֶף וְשֵׁ֥שׁ מֵא֖וֹת וַחֲמִשִּֽׁים׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְשִׁית מְאָה וְחַמְשִׁין:", "onk_en": "Its division and their numbers is forty-five thousand six hundred fifty.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטָא אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְשִׁית מְאָה", "pj_en": "And his host and the number of his tribe, forty-five thousand six hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 16, "aliyah": 3, "heb": "כׇּֽל־הַפְּקֻדִ֞ים לְמַחֲנֵ֣ה רְאוּבֵ֗ן מְאַ֨ת אֶ֜לֶף וְאֶחָ֨ד וַחֲמִשִּׁ֥ים אֶ֛לֶף וְאַרְבַּע־מֵא֥וֹת וַחֲמִשִּׁ֖ים לְצִבְאֹתָ֑ם וּשְׁנִיִּ֖ם יִסָּֽעוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל מִנְיָנַיָּא לְמַשְׁרִית רְאוּבֵן מְאָה וְחַמְשִׁין וְחַד אַלְפִין וְאַרְבַּע מְאָה וְחַמְשִׁין לְחֵילֵיהוֹן בְּתִנְיֵתָא נָטְלִין:", "onk_en": "The total numbers for the encampment of Reuven is one hundred fifty-one thousand four hundred and fifty, according to their division, and they travel [in the] second [position].", "pj": "כָּל סְכוּם מִנְיָינָא לְמַשִׁרְיַת רְאוּבֵן מְאָה וְחַמְשִׁין וְחַד אַלְפִין וְאַרְבַּע מְאָה וְחַמְשִׁין לְחֵילֵיהוֹן בְּתִנְיֵיתָא נַטְלִין", "pj_en": "All the sum of the numbered ones of the camp of Reuben, one hundred and fifty one thousand four hundred and fifty by their hosts; and they went forward secondly,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 17, "aliyah": 3, "heb": "וְנָסַ֧ע אֹֽהֶל־מוֹעֵ֛ד מַחֲנֵ֥ה הַלְוִיִּ֖ם בְּת֣וֹךְ הַֽמַּחֲנֹ֑ת כַּאֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל־יָד֖וֹ לְדִגְלֵיהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְנָטֵל מַשְׁכַּן זִמְנָא מַשְׁרִית לֵוָאֵי בְּגוֹ מַשְׁרְיָתָא כְּמָא דְשָׁרַן כֵּן נָטְלִין גְּבַר עַל אַתְרֵיהּ לְטִקְסֵיהוֹן:", "onk_en": "The Tent of Meeting shall travel [along with] the camp of the Levites in the center of the [other] camps, just as they camp so shall they travel, each man in his place according to their [various] banners.", "pj": "וְיִטוֹל מַשְׁכַּן זִמְנָא מַשִׁרְיַת לֵיוָאֵי בְּגוֹ מַשִׁרְיָיתָא וּבֵית מַשִׁירְוֵיהוֹן בְּאַרְבַּעְתֵּי מִילִין מְרַבְּעַן בִּמְצִיעוּתָא הֲוָון נַטְלִין הֵיכְמָא דְשָׁרַן הֵיכְדֵין נַטְלִין גְבַר עַל תְּחוּמֵיהּ לְטִיקְסֵיהוֹן", "pj_en": "But the tabernacle shall go with the host of the Levites, in the midst of their host; and their camp spreadeth over four miles, in the midst are they to be: as they encamp, so shall they go, every man going in his appointed place, by their standard.", "tj": "", "tj_en": "", "rashi": "<b>ונסע אהל מועד.<\/b> לְאַחַר שְׁנֵי דְגָלִים הַלָּלוּ:<br><br><b>כאשר יחנו כן יסעו.<\/b> כְּמוֹ שֶׁפֵּרַשְׁתִּי, הֲלִיכָתָן כַּחֲנִיָּתָן, כָּל דֶּגֶל מְהַלֵּךְ לָרוּחַ הַקָּבוּעַ לוֹ:<br><br><b>על ידו.<\/b> עַל מְקוֹמוֹ, וְאֵין לְשׁוֹן יָד זָז מִמַּשְׁמָעוֹ, רוּחַ שֶׁל צִדּוֹ קָרוּי עַל יָדוֹ – הַסְּמוּכָה לוֹ לְכָל הוֹשָׁטַת יָדוֹ, אינשו\"ן איש\"א בְּלַעַז:", "rashi_en": "ונסע אהל מועד AND THE TENT OF MEETING SHALL SET FORWARD after these two divisions (those of Judah and Reuben), as is shown by the position of this statement in the narrative.<br><br>כאשר יחנו כן יסעו AS THEY ENCAMP SO SHALL THEY JOURNEY — just as I have explained (v. 9): their positions when marching shall be the same as when encamping — each division marches on that side that is assigned to it. <br><br>על ידו means, in his place. The term יד does not even in this sense lose its original meaning, viz., that of “hand’’ — the area at one’s side is termed על ידו “that which is by his hand”, being that which is closest to him, and always within the reach of his hand (and not beyond it); en son aise in O. F."}, {"ch": 2, "v": 18, "aliyah": 3, "heb": "דֶּ֣גֶל מַחֲנֵ֥ה אֶפְרַ֛יִם לְצִבְאֹתָ֖ם יָ֑מָּה וְנָשִׂיא֙ לִבְנֵ֣י אֶפְרַ֔יִם אֱלִישָׁמָ֖ע בֶּן־עַמִּיהֽוּד׃", "onk": "טֵקַס מַשְׁרִית אֶפְרַיִם לְחֵילֵיהוֹן מַעַרְבָא וְרַבָּא לִבְנֵי אֶפְרַיִם אֱלִישָׁמָע בַּר עַמִּיהוּד:", "onk_en": "The banner of the camp of Ephraim, according to their divisions is on the west side, and the leader of the sons of Ephraim is Elishamah the son of Amihud.", "pj": "טֵיקַס מַשִׁרְיַית אֶפְרַיִם לְחֵילֵיהוֹן מַעַרְבָא יִשְׁרוּן וּמַשִׁירְיַתְהוֹן בְאַרְבַּעְתֵּי מִילִין מְרַבְּעַן וְטִיקְסֵיהּ הֲוָה מִמֵילַת תְּלַת גְוָונִין כָּל קְבֵיל תְּלַת מַרְגַלְיָיתָא דִבְחוּשְׁנָא קַנְכִּירִין טַרְקִין וְעֵינְעֵיגַל וּבֵיהּ חָקִיק וּמְפָרָשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא אֶפְרַיִם וּמְנַשֶׁה וּבִנְיָמִין וּבִמְצִיעוּתֵיהּ כְּתִיב וַעֲנָנָא דַיְיָ עֲלֵיהוֹן בִּימָמָא בְּמַטְלֵיהוֹן מִן מַשְׁרִיתָא וּבֵיהּ הֲוָה חָקִיק צוּרַת רִיבָא וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי אֶפְרַיִם אֱלִישָׁמָע בַּר עַמִיהוּד", "pj_en": "The camp of Ephraim by the standard of their hosts shall pitch on the west; their camp spreadeth over four miles; and their standard is of silk of three colours, corresponding with the precious stones in the breastplate, ligure, agate, and amethyst; and upon it expressed and set forth the names of the three tribes, Ephraim, Menasheh and Benjamin, having written in the midst, And the Cloud of the Lord was over them, in the going forward of the host; and upon it was set forth the figure of a young man. And the Rabba set over the tribe of Ephraim, Elishama bar Ammihud;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 19, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם אַרְבָּעִ֥ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן אַרְבְּעִין אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "Its division and their numbers is forty-thousand five hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ אַרְבְּעִין אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "and the sum of his host, forty thousand five hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 20, "aliyah": 3, "heb": "וְעָלָ֖יו מַטֵּ֣ה מְנַשֶּׁ֑ה וְנָשִׂיא֙ לִבְנֵ֣י מְנַשֶּׁ֔ה גַּמְלִיאֵ֖ל בֶּן־פְּדָהצֽוּר׃", "onk": "<b>וְדִסְמִיכִין<\/b> עֲלוֹהִי שִׁבְטָא דִמְנַשֶּׁה וְרַבָּא לִבְנֵי מְנַשֶּׁה גַּמְלִיאֵל בַּר פְּדָהצוּר:", "onk_en": "Along with [<b>near<\/b>] him are; the tribe of Menashe, and the leader of the sons of Menashe is Gamliel the son of Pedahtzur.", "pj": "וְדִסְמִיכִין לֵיהּ שִׁבְטָא דִמְנַשֶׁה וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי מְנַשֶׁה גַמְלִיאֵל בַּר פְּדָהצוּר", "pj_en": "And next to him were the tribe of Menasheh: the Rabba, Gamliel bar Pedashur;", "tj": "", "tj_en": "", "rashi": "<b>ועליו.<\/b> כְּתַרְגּוּמוֹ \"וְדִסְמִיכִין עֲלוֹהִי\":", "rashi_en": "ועליו — Understand this as the Targum does: and those who were close to him were the tribe of Manasseh."}, {"ch": 2, "v": 21, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם שְׁנַ֧יִם וּשְׁלֹשִׁ֛ים אֶ֖לֶף וּמָאתָֽיִם׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן תְּלָתִין וּתְרֵין אַלְפִין וּמָאתָן:", "onk_en": "Its division and their numbers is thirty-two thousand two hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ תְּלָתִין וּתְרֵין אַלְפִין וּמָאתָן", "pj_en": "their number, thirty-two thousand two hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 22, "aliyah": 3, "heb": "וּמַטֵּ֖ה בִּנְיָמִ֑ן וְנָשִׂיא֙ לִבְנֵ֣י בִנְיָמִ֔ן אֲבִידָ֖ן בֶּן־גִּדְעֹנִֽי׃", "onk": "וְשִׁבְטָא דְּבִנְיָמִן וְרַבָּא לִבְנֵי בִנְיָמִן אֲבִידָן בַּר גִּדְעוֹנִי:", "onk_en": "The tribe of Binyamin, and the leader of the sons of Binyamin is Avidan the son of Gid’oni.", "pj": "וְשִׁבְטָא דְבִנְיָמִין וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי בִּנְיָמִין אֲבִידָן בַּר גִדְעוֹנִי", "pj_en": "Of the tribe of Benjamin the Rabba was Abidan bar Gideoni,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 23, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם חֲמִשָּׁ֧ה וּשְׁלֹשִׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן תְּלָתִין וְחַמְשָׁא אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "Its division and their numbers is thirty-five thousand four hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ תְּלָתִין וְחַמְשָׁא אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "and the number of his host thirty-five thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 24, "aliyah": 3, "heb": "כׇּֽל־הַפְּקֻדִ֞ים לְמַחֲנֵ֣ה אֶפְרַ֗יִם מְאַ֥ת אֶ֛לֶף וּשְׁמֹֽנַת־אֲלָפִ֥ים וּמֵאָ֖ה לְצִבְאֹתָ֑ם וּשְׁלִשִׁ֖ים יִסָּֽעוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל מִנְיָנַיָּא לְמַשְׁרִית אֶפְרַיִם מְאָה וְתַמְנֵי אַלְפִין וּמְאָה לְחֵילֵיהוֹן בִּתְלִיתֵתָא נָטְלִין:", "onk_en": "The total numbers for the camp of Ephraim is one hundred eight thousand one hundred according to their divisions, and they travel [in the] third [position].", "pj": "כָּל סְכוּם מִנְיָינַיָא לְמַשִׁרְיַת אֶפְרַיִם מְאָה וְתַמְנֵי אַלְפִין וּמְאָה לְחֵילֵיהוֹן בִּתְלִיתֵיתָא נָטְלִין", "pj_en": "The Sum of the camp of Ephraim was one hundred and eight thousand one hundred; and they went forward thirdly.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 25, "aliyah": 3, "heb": "דֶּ֣גֶל מַחֲנֵ֥ה דָ֛ן צָפֹ֖נָה לְצִבְאֹתָ֑ם וְנָשִׂיא֙ לִבְנֵ֣י דָ֔ן אֲחִיעֶ֖זֶר בֶּן־עַמִּֽישַׁדָּֽי׃", "onk": "טֵקַס מַשְׁרִית דָּן צִפּוּנָא לְחֵילֵיהוֹן וְרַבָּא לִבְנֵי דָן אֲחִיעֶזֶר בַּר עַמִּישַׁדָּי:", "onk_en": "The banner of the camp of Don is on the north side according to their divisions, and the leader of the sons of Don is Achiezer the son of Amishadai.", "pj": "טֵיקַס מַשִׁרְיַת דָן לְצִפּוּנָא לְחֵילֵיהוֹן וּבֵית מַשִׁירְיַתְהוֹן בְּאַרְבַּעְתֵּי מִילִין מְרַבְּעַן וְטִקְסֵיהּ הֲוָה מִמֵילַת תְּלַת גְוָונִין כָּל קְבֵיל תְּלַת מַרְגַלְיָיתָא דִבְחוּשְׁנָא כְּרוּם יַמָא וּבִירְלְוַות חַלָא וְאַפַּנְטוֹר וּבֵיהּ חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא דָן וְנַפְתָּלִי וְאָשֵׁר וּבִמְצִיעוּתֵיהּ חָקִיק וּמְפָרַשׁ וּבְמֵישְׁרוֹי יֵימַר תּוּב יְיָ שְׁרֵי בִיקָרָךְ בְּגוֹ רִיבְוַות אַלְפַיָא דְיִשְרָאֵל וּבֵיהּ הֲוָה חָקִיק צוּרַת חֵיוֵי חָרְמַן וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי דָן אֲחִיעֶזֶר בַּר עַמִישַׁדָי", "pj_en": "The standard of the camp of Dan shall be to the north with their hosts; and the space of their camp shall spread over four miles. His standard shall be of silk of three colours, corresponding with the stones in the breastplate, chrysolite, beryl, and jasper; in it shall be expressed and set forth the names of the three tribes, Dan, Naphtali, and Asher; and upon it shall be expressed: And in his encampment shall he say, Return, O Lord, and dwell in Thy glory in the midst of the myriads of Israel; and upon it shall also be set forth the figure of a basilisk serpent. (Gen. xlix. 17.) The Rabba set over the hosts of Dan was Achiezer bar Aminishaddai,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 26, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם שְׁנַ֧יִם וְשִׁשִּׁ֛ים אֶ֖לֶף וּשְׁבַ֥ע מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן שִׁתִּין וּתְרֵין אַלְפִין וּשְׁבַע מְאָה:", "onk_en": "Its division and their numbers is sixty-two thousand seven hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ שִׁתִּין וּתְרֵין אַלְפִין וּשְׁבַע מְאָה", "pj_en": "and the number of his tribe sixty-two thousand seven hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 27, "aliyah": 3, "heb": "וְהַחֹנִ֥ים עָלָ֖יו מַטֵּ֣ה אָשֵׁ֑ר וְנָשִׂיא֙ לִבְנֵ֣י אָשֵׁ֔ר פַּגְעִיאֵ֖ל בֶּן־עׇכְרָֽן׃", "onk": "וְדִי שְׁרַן סְמִיכִין עֲלוֹהִי שִׁבְטָא דְאָשֵׁר וְרַבָּא לִבְנֵי אָשֵׁר פַּגְעִיאֵל בַּר עָכְרָן:", "onk_en": "Those who camp with him are; the tribe of Asher, and the leader of the sons of Asher is Pagi’el the son of Ochran.", "pj": "וְדִישְׁרַן סְמִיכִין לֵיהּ שִׁבְטָא דְאָשֵׁר וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי אָשֵׁר פַּגְעִיאֵל בַּר עָכְרָן", "pj_en": "They who encamp next to him shall be the tribe of Asher; the Rabbi was Paghiel bar Achran,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 28, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם אֶחָ֧ד וְאַרְבָּעִ֛ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן אַרְבְּעִין וְחַד אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "Its divisions and their numbers is forty-one thousand five hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ אַרְבְּעִין וְחַד אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "and the numbers forty-one thousand five hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 29, "aliyah": 3, "heb": "וּמַטֵּ֖ה נַפְתָּלִ֑י וְנָשִׂיא֙ לִבְנֵ֣י נַפְתָּלִ֔י אֲחִירַ֖ע בֶּן־עֵינָֽן׃", "onk": "וְשִׁבְטָא דְּנַפְתָּלִי וְרַבָּא לִבְנֵי נַפְתָּלִי אֲחִירַע בַּר עֵינָן:", "onk_en": "The tribe of Naftali, and the leader of the sons of Naftali is Achira the son of Einan.", "pj": "וְשִׁבְטָא דְנַפְתָּלִי וְרַבָּא דַהֲוָה מְמַנֵי עַל חֵילְוַת שִׁבְטָא דִבְנֵי נַפְתָּלִי אֲחִירַע בַּר עֵינָן", "pj_en": "Of the tribe Naphtali, the Rabba, Achira bar Enan;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 30, "aliyah": 3, "heb": "וּצְבָא֖וֹ וּפְקֻדֵיהֶ֑ם שְׁלֹשָׁ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃", "onk": "וְחֵילֵיהּ וּמִנְיָנֵיהוֹן חַמְשִׁין וּתְלָתָא אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "Its divisions and their numbers is fifty-three thousand four hundred.", "pj": "וְחֵילֵיהּ וּסְכוּמְהוֹן דְשִׁבְטֵיהּ חַמְשִׁין וּתְלַת אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "and the numbers, fifty-three thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 31, "aliyah": 3, "heb": "כׇּל־הַפְּקֻדִים֙ לְמַ֣חֲנֵה דָ֔ן מְאַ֣ת אֶ֗לֶף וְשִׁבְעָ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וְשֵׁ֣שׁ מֵא֑וֹת לָאַחֲרֹנָ֥ה יִסְע֖וּ לְדִגְלֵיהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "כָּל מִנְיָנַיָּא לְמַשְׁרִית דָּן מְאָה וְחַמְשִׁין וְשִׁבְעָא אַלְפִין וְשִׁית מְאָה בְּבַתְרֵתָא נָטְלִין לְטִקְסֵיהוֹן:", "onk_en": "The total numbers for the encampment of Don is one hundred fifty-seven thousand six hundred and they travel [in the] last [position] according to their [various] banners.", "pj": "כָּל סְכוּם מִנְיָינַיָא לְמַשִׁרְיַית דָן מְאָה וְחַמְשִׁין וְשׁוּבְעָא אַלְפִין וְשִׁית מְאָה בְּבַתְרֵיתָא נַטְלִין לְטִיקְסֵיהוֹן", "pj_en": "The sum of the hosts of Dan was one hundred and fifty-seven thousand six hundred: and these went forward last with their ensigns.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 32, "aliyah": 3, "heb": "אֵ֛לֶּה פְּקוּדֵ֥י בְנֵֽי־יִשְׂרָאֵ֖ל לְבֵ֣ית אֲבֹתָ֑ם כׇּל־פְּקוּדֵ֤י הַֽמַּחֲנֹת֙ לְצִבְאֹתָ֔ם שֵׁשׁ־מֵא֥וֹת אֶ֙לֶף֙ וּשְׁלֹ֣שֶׁת אֲלָפִ֔ים וַחֲמֵ֥שׁ מֵא֖וֹת וַחֲמִשִּֽׁים׃", "onk": "אִלֵּין מִנְיָנֵי בְנֵי יִשְׂרָאֵל לְבֵית אֲבָהַתְהוֹן כָּל מִנְיָנֵי מַשְׁרְיָתָא לְחֵילֵיהוֹן שִׁית מְאָה וּתְלָתָא אַלְפִין וַחֲמֵשׁ מְאָה וְחַמְשִׁין:", "onk_en": "These are the numbers of Bnei Yisroel according to their fathers’ houses. The total numbers of the camps according to their divisions is six hundred three thousand five hundred fifty.", "pj": "אִלֵין סְכוּם מִנְיָנֵי בְּנֵי יִשְרָאֵל לְבֵית אֲבָהַתְהוֹן כָּל מִנְיָינֵי מַשִׁרְיָיתָא לְחֵילֵיהוֹן שִׁית מְאָה וּתְלָתָא אַלְפִין וַחֲמֵשׁ מְאָה וְחַמְשִׁין", "pj_en": "This is the amount of the numbers of the Beni Israel, according to the house of their fathers; all the sums of the camps by their hosts were six hundred and three thousand five hundred and fifty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 33, "aliyah": 3, "heb": "וְהַ֨לְוִיִּ֔ם לֹ֣א הׇתְפָּקְד֔וּ בְּת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וְלֵוָאֵי לָא אִתְמְנִיאוּ בְּגוֹ בְּנֵי יִשְׂרָאֵל כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "The Levites were not counted among Bnei Yisroel just as Adonoy commanded Moshe.", "pj": "וְלֵיוָאֵי לָא אִתְמְנִיאוּ בְּגוֹ בְנֵי יִשְרָאֵל הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "But the Levites were not numbered among the sons of Israel, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 34, "aliyah": 3, "heb": "וַֽיַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠כֹ֠ל אֲשֶׁר־צִוָּ֨ה יְהֹוָ֜ה אֶת־מֹשֶׁ֗ה כֵּֽן־חָנ֤וּ לְדִגְלֵיהֶם֙ וְכֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְמִשְׁפְּחֹתָ֖יו עַל־בֵּ֥ית אֲבֹתָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲבָדוּ בְּנֵי יִשְׂרָאֵל כְּכֹל דִּי פַקִּיד יְיָ יָת משֶׁה כֵּן שָׁרַן לְטִקְסֵיהוֹן וְכֵן נָטְלִי
