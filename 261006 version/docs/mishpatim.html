נָשִׁ֗ים וְנָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְיָצְא֣וּ יְלָדֶ֔יהָ וְלֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽאֲשֶׁ֨ר יָשִׁ֤ית עָלָיו֙ בַּ֣עַל הָֽאִשָּׁ֔ה וְנָתַ֖ן בִּפְלִלִֽים׃", "onk": "וַאֲרֵי יִנְצוּן גֻבְרִין וְיִמְחוּן אִתְּתָא מַעַדְיָא וְיִפְּקוּן וַלְדָהָא וְלָא יְהֵי מוֹתָא אִתְגְבָאָה יִתְגְבֵי כְּמָא דִי יְשַׁוִי עֲלוֹהִי בַּעֲלַהּ דְאִתְּתָא וְיִתֵּן עַל מֵימַר דַיָנַיָא:", "onk_en": "If men will fight and they strike a pregnant woman, causing her to miscarry, but there is no fatal injury [to the woman], he [the guilty one] is to be punished with a [monetary] penalty when the husband demands compensation. He shall pay as determined by the judges.", "pj": "וַאֲרוּם יִנְצוּן גַּבְרִין וְיִמְחוּן אִתְּתָא מְעַבְּרָא וְאַפִּילַת יַת וַולְדָהָא וְלָא יְהֵי בָהּ מוֹתָא מִתְקַנְסָא יִתְקְנֵיס דְּמֵי וַולְדָא הֵיכְמָא דִמְשַׁוֵי עֲלֵיהּ בַּעֲלֵיהּ דְּאִינְתְּתָא וְיִתֵּן עַל מֵימַר דַּיָינַיָא", "pj_en": "If men when striving strike a woman with child, and cause her to miscarry, but not to lose her life, the fine on account of the infant which the husband of the woman shall lay upon him, he shall pay according to the sentence of the judges.", "tj": "", "tj_en": "", "rashi": "<b>וכי ינצו אנשים.<\/b> זֶה עִם זֶה, וְנִתְכַּוֵּן לְהַכּוֹת אֶת חֲבֵרוֹ וְהִכָּה אֶת הָאִשָּׁה:<br><br><b>ונגפו.<\/b> אֵין נְגִיפָה אֶלָּא לְשׁוֹן דְּחִיפָה וְהַכָּאָה, כְּמוֹ פֶּן תִּגֹּף בָּאֶבֶן רַגְלֶךָ (תהילים צ\"א), בְּטֶרֶם יִתְנַגְּפוּ רַגְלֵיכֶם (ירמיהו י\"ג) וּלְאֶבֶן נֶגֶף (ישעיהו ח'):<br><br><b>ולא יהיה אסון.<\/b> בָּאִשָּׁה:<br><br><b>ענוש יענש.<\/b> לְשַׁלֵּם דְּמֵי וְלָדוֹת לַבַּעַל; שָׁמִין אוֹתָהּ כַּמָּה הָיְתָה רְאוּיָה לִמָּכֵר בַּשּׁוּק לְהַעֲלוֹת בְּדָמֶיהָ בִּשְׁבִיל הֶרְיוֹנָהּ:<br><br><b>ענש יענש.<\/b> יִגְבּוּ מָמוֹן מִמֶּנּוּ, כְּמוֹ וְעָנְשׁוּ אֹתוֹ מֵאָה כֶסֶף (דברים כ\"ב):<br><br><b>כאשר ישית עליו וגו'.<\/b> כְּשֶׁיִּתְבָּעֶנּוּ הַבַּעַל בְּבֵית דִּין לְהָשִׁית עָלָיו עֹנֶשׁ עַל כָּךְ:<br><br><b>ונתן.<\/b> הַמַּכֶּה דְּמֵי וְלָדוֹת:<br><br><b>בפללים<\/b> – עַל פִּי הַדַּיָּנִים (מכילתא):", "rashi_en": "וכי ינצו אנשים IF MEN STRIVE with each other and one intended to strike the other and inadvertently struck the woman (Sanhedrin 79b).<br><br>ונגפו AND HURT [A WOMAN WITH CHILD] — The root נגף always signifies “dashing against” and “striking”. Examples are: (Psalms 91:15) “lest thou dash (תגוף) thy foot against a stone”; (Jeremiah 13:16) “and before your feet dash (יתנגפו)”; (Isaiah 8:14) “but for a stone of dashing (נגף).<br><br>ולא יהיה אסון AND YET THERE BE NO MISCHIEF — no further mischief with the woman (Sanhedrin 79b).<br><br>ענוש יענש HE SHALL SURELY BE AMERCED to pay the value of the offspring to the husband. We estimate her value according to what she is worth if she were sold as a slave in the market giving her a higher value on account of her being with child (Bava Kamma 49a).<br><br>ענוש יענש (lit., he shall surely be punished) — It means that they shall exact money from him. ענוש is used here in the same sense as in, (Deuteronomy 22:19) “And they shall amerce (וענשו) him an hundred shekel of silver”.<br><br>כאשר ישית עליו וגו׳ means, when the husband will summons him before the Court that they should place upon him a fine for this (cf. Mekhilta),<br><br>ונתן THEN HE SHALL GIVE — i. e. the man that struck the woman shall give the value of the offspring.<br><br>בפללים ACCORDING TO THE DECISION OF THE JUDGES (Mekhilta)."}, {"ch": 21, "v": 23, "aliyah": 2, "heb": "וְאִם־אָס֖וֹן יִהְיֶ֑ה וְנָתַתָּ֥ה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ׃", "onk": "וְאִם מוֹתָא יְהֵא וְתִתֵּן נַפְשָׁא חֳלָף נַפְשָׁא:", "onk_en": "However if there is a fatal injury, you shall give [up] a life for a life.", "pj": "וְאִין מוֹתָא יְהֵי בָהּ וּתְדִינוּן נַפְשָׁא דִקְטוֹלָא חוֹלַף נַפְשָׁא דְאִתְּתָא", "pj_en": "But if death befall her, then thou shalt judge the life of the killer for the life of the woman.", "tj": "", "tj_en": "", "rashi": "<b>ואם אסון יהיה.<\/b> בָּאִשָּׁה:<br><br><b>ונתתה נפש תחת נפש.<\/b> רַבּוֹתֵינוּ חוֹלְקִים בַּדָּבָר, יֵשׁ אוֹמְרִים נֶפֶשׁ מַמָּשׁ, וְיֵשׁ אוֹמְרִים מָמוֹן אֲבָל לֹא נֶפֶשׁ מַמָּשׁ, שֶׁהַמִּתְכַּוֵּן לַהֲרֹג אֶת זֶה וְהָרַג אֶת זֶה פָּטוּר מִמִּיתָה, וּמְשַׁלֵּם לְיוֹרְשָׁיו דָּמָיו כְּמוֹ שֶׁהָיָה נִמְכָּר בַּשּׁוּק (שם):", "rashi_en": "ואם אסון יהיה AND IF THERE BE ANY FURTHER MISCHIEF — in the case of the woman,<br><br>ונתת נפש תחת נפש THEN THOU SHALT GIVE SOUL FOR SOUL. Our Rabbis differ as to the explanation of the word נפש the first time it occurs here. There are some who say that it actually signifies “life” (i. e. life for life), others say that it means monetary compensation but not literally life, and they say that this must be so because he who intends to kill a certain person and inadvertently kills another instead, (as is the case here), is exempt from the death penalty, and has only to pay to his heirs his value estimating this as though he were sold as a slave in the market (Sanhedrin 79a)."}, {"ch": 21, "v": 24, "aliyah": 2, "heb": "עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן יָ֚ד תַּ֣חַת יָ֔ד רֶ֖גֶל תַּ֥חַת רָֽגֶל׃", "onk": "עֵינָא חֳלָף עֵינָא שִׁנָא חֳלָף שִׁנָא יְדָא חֳלָף יְדָא רַגְלָא חֳלָף רַגְלָא:", "onk_en": "[Compensation of] an eye for an eye, [of] a tooth for a tooth, [of] a hand for a hand, [of] a foot for a foot.", "pj": "דְּמֵי עֵינָא חוֹלַף עֵינָא דְּמֵי שִׁינָא חוֹלַף שִׁינָא דְּמֵי יְדָא חוֹלַף יְדָא דְּמֵי רִיגְלָא חוֹלַף רִיגְלָא", "pj_en": "The value of an eye for an eye, the value of a tooth for a tooth, the value of a hand for a hand, the value of a foot for a foot,", "tj": "", "tj_en": "", "rashi": "<b>עין תחת עין.<\/b> סִמֵּא עֵין חֲבֵרוֹ נוֹתֵן לוֹ דְּמֵי עֵינוֹ כַּמָּה שֶׁפָּחֲתוּ דָּמָיו לִמְכֹּר בַּשּׁוּק, וְכֵן כֻּלָּם; וְלֹא נְטִילַת אֵבֶר מַמָּשׁ, כְּמוֹ שֶׁדָּרְשׁוּ רַבּוֹתֵינוּ בְּפֶרֶק הַחוֹבֵל (בבא קמא דף פ\"ג):", "rashi_en": "עין תחת עין EYE FOR EYE — If one blinded the eye of his fellow-man he has to pay him the value of his eye, i. e. he pays him how much his value would be diminished if he were to be sold as a slave in the market. In the same way all other cases are to be dealt with, but it does not mean the actual cutting off of the offender’s limb — just as our Rabbis have explained in the chapter beginning with the word החובל (Bava Kamma 84a)."}, {"ch": 21, "v": 25, "aliyah": 2, "heb": "כְּוִיָּה֙ תַּ֣חַת כְּוִיָּ֔ה פֶּ֖צַע תַּ֣חַת פָּ֑צַע חַבּוּרָ֕ה תַּ֖חַת חַבּוּרָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כְּוָאָה חֳלָף כְּוָאָה פִּדְעָא חֳלָף פִּדְעָא <b>מַשְׁקוֹפֵי<\/b> חֳלָף <b>מַשְׁקוֹפֵי<\/b>:", "onk_en": "[Compensation of] a burn for a burn, [of] a wound for a wound, [of] a bruise [<b>beating<\/b>] for a bruise [<b>beating<\/b>].", "pj": "דְּמֵי צַעַר מֵחֲרוֹךְ חוֹלַף מֵחֲרוֹךְ דְּמֵי פּוּדְעָא חוֹלַף פּוּדְעָא דְּמֵי הַלְכְשִׁישׁ חוֹלַף הַלְכְשִׁישׁ", "pj_en": "all equivalent of the pain of burning for burning, and of wounding for wounding, and of blow for blow.", "tj": "", "tj_en": "", "rashi": "<b>כויה תחת כויה.<\/b> מִכְוַת אֵשׁ; וְעַד עַכְשָׁו דִּבֵּר בְּחַבָּלָה שֶׁיֵּשׁ בָּהּ פְּחַת דָּמִים, וְעַכְשָׁיו בְּשֶׁאֵין בָּהּ פְּחַת דָּמִים אֶלָּא צַעַר, כְּגוֹן כְּוָאוֹ בִשְׁפוּד עַל צִפָּרְנָיו, אוֹמְדִים כַּמָּה אָדָם כַּיּוֹצֵא בָזֶה רוֹצֶה לִטֹּל לִהְיוֹת מִצְטַעֵר כָּךְ (בבא קמא פ\"ג):<br><br><b>פצע.<\/b> הִיא מַכָּה הַמּוֹצִיאָה דָם, שֶׁפָּצַע אֶת בְּשָׂרוֹ, נבר\"ורא בְּלַעַז; הַכֹּל לְפִי מַה שֶּׁהוּא – אִם יֵשׁ בּוֹ פְּחַת דָּמִים, נוֹתֵן נֶזֶק, וְאִם נָפַל לְמִשְׁכָּב, נוֹתֵן שֶׁבֶת וְרִפּוּי וּבֹשֶׁת וְצַעַר; וּמִקְרָא זֶה יָתֵר הוּא, וּבְהַחוֹבֵל דְּרָשׁוּהוּ רַבּוֹתֵינוּ לְחַיֵּב עַל הַצַּעַר אֲפִלּוּ בִמְקוֹם נֶזֶק – שֶׁאַף עַל פִּי שֶׁנּוֹתֵן לוֹ דְּמֵי יָדוֹ, אֵין פּוֹטְרִים אוֹתוֹ מִן הַצַּעַר, לוֹמַר, הוֹאִיל וְקָנָה יָדוֹ יֵשׁ עָלָיו לְחָתְכָהּ בְּכָל מַה שֶּׁיִּרְצֶה, אֶלָּא אוֹמְרִים, יֵשׁ לוֹ לְחָתְכָהּ בְּסַם, שֶׁאֵינוֹ מִצְטַעֵר כָּל כָּךְ, וְזֶה חֲתָכָהּ בְּבַרְזֶל וְצִעֲרוֹ:<br><br><b>חבורה.<\/b> הִיא מַכָּה שֶׁהַדָּם נִצְרָר בָּהּ וְאֵינוֹ יוֹצֵא, אֶלָּא שֶׁמַּאֲדִים הַבָּשָׂר כְּנֶגְדּוֹ, וּלְשׁוֹן חַבּוּרָה טק\"א בְּלַעַז, כְּמוֹ וְנָמֵר חֲבַרְבֻּרֹתָיו (ירמיהו י\"ג), וְתַרְגּוּמוֹ מַשְׁקוֹפֵי, לְשׁוֹן חֲבָטָה, בטדו\"רא בְּלַעַז, וְכֵן שְׁדוּפוֹת קָדִים (בראשית מ\"א), שְׁקִיפָן קִדּוּם – חֲבוּטוֹת בָּרוּחַ, וְכֵן עַל הַמַּשְׁקוֹף, עַל שֵׁם שֶׁהַדֶּלֶת נוֹקֵשׁ עָלָיו:", "rashi_en": "כויה תחת כויה BURNING FOR BURNING — כויה is a burn produced by fire. Up to here (i .e. v. 24) Scripture has spoken of a bodily injury that is attended by a decrease of the market-value of the person injured; here, however, it speaks of a case in which there is no decrease of value but pain alone: if, for instance, a man burns another on his nails with a hot spit, we estimate how much a person like him (the injured) would be willing to accept for undergoing a pain like this, and such an amount the other has to pay as indemnity (Bava Kamma 84b).<br><br>פצע is an injury which draws blood — the accused having crushed the other’s flesh; navrure in old French In such a case it all depends upon what happens: if any decrease in his market-value is caused the other pays him an indemnity (נזק); if he is confined to his bed, he has to pay for loss of time, for medical treatment, for the shame he feels at being somewhat disfigured and for the pain he has been made to suffer. This passage, (פצע תחת פצע), is apparently redundant, but our Rabbis explained in the chapter beginning with the word החובל (Bava Kamma 85b) that Scripture intends by this statement to make one liable to pay for pain inflicted even in a case when one has already paid damages (נזק) for decrease in one’s value — that although he has paid him the value of his hand, we do not exempt him from paying also for pain inflicted, arguing thus: Since he has, so to say, purchased his hand by paying its value, he was entitled to cut if off by whatever means he pleases; but we say that he ought to have removed it by means of a poisonous drug when he would not have suffered so much pain. He, however, cut if off by means of an iron instrument and caused him great pain; therefore he is bound to pay for pain inflicted also.<br><br>חבורה is a wound in which the blood is congealed but does not come out, only that the flesh on that spot becomes red. The word חבורה means tache in old French Similar is, (Jeremiah 13:23) “[Can an Ethiopian change his skin] or the leopard his spots (חברברתיו)”. The Targum renders it (חבורה) by משקופי, an expression denoting “beating”, batture in old French Similarly it translates (Genesis 41:6) שדופות קדים, “blasted with the east”, by שקיפן קדום, “beaten by the east wind”. So, too, the lintel it termed “משקוף” (from the root שקף “to beat upon”), as, e. g., in the expression על המשקוף, because the door beats against it."}, {"ch": 21, "v": 26, "aliyah": 2, "heb": "וְכִֽי־יַכֶּ֨ה אִ֜ישׁ אֶת־עֵ֥ין עַבְדּ֛וֹ אֽוֹ־אֶת־עֵ֥ין אֲמָת֖וֹ וְשִֽׁחֲתָ֑הּ לַֽחׇפְשִׁ֥י יְשַׁלְּחֶ֖נּוּ תַּ֥חַת עֵינֽוֹ׃", "onk": "וַאֲרֵי יִמְחֵי גְבַר יָת עֵינָא דְעַבְדֵהּ אוֹ יָת עֵינָא דְאַמְתֵהּ וִיחַבְּלִנַהּ לְבַר חוֹרִין יִפְטְרִנֵהּ חֳלָף עֵינֵהּ:", "onk_en": "If a man strikes the eye of his slave, or the eye of his female slave, and destroys [blinds] it, he shall set him [the slave] free as compensation for the eye.", "pj": "וַאֲרוּם יִמְחֵי גְּבַר יַת עֵינָא דְעַבְדֵיהּ כְּנַעֲנָאֵי אוֹ יַת עֵינָא דְאַמְתֵיהּ כְּנַעֲנִיתָא וְסָמִינָהּ לְבַר חוֹרִין יִפְטְרִינֵיהּ חוֹלַף עֵינֵיהּ", "pj_en": "And when a man strikes the eye of his Kenaanite servant or handmaid, and causeth blindness, he shall let him go free, on account of the eye.", "tj": "", "tj_en": "", "rashi": "<b>את עין עבדו.<\/b> כְּנַעֲנִי, אֲבָל עִבְרִי אֵינוֹ יוֹצֵא בְשֵׁן וְעַיִן, כְּמוֹ שֶׁאָמַרְנוּ לֹא תֵצֵא כְּצֵאת הָעֲבָדִים:<br><br><b>תחת עינו.<\/b> וְכֵן בְּכ\"ד רָאשֵׁי אֵבָרִים: אֶצְבְּעוֹת הַיָּדַיִם וְהָרַגְלַיִם, וּשְׁתֵּי אָזְנַיִם, וְהַחֹטֶם, וְרֹאשׁ הַגְּוִיָּה שֶׁהוּא גִּיד הָאַמָּה. וְלָמָּה נֶאֱמַר שֵׁן וְעַיִן? שֶׁאִם נֶאֱמַר עַיִן וְלֹא נֶאֱמַר שֵׁן, הָיִיתִי אוֹמֵר מָה עַיִן שֶׁנִּבְרָא עִמּוֹ אַף כָּל שֶׁנִּבְרָא עִמּוֹ, וַהֲרֵי שֵׁן לֹא נִבְרָא עִמּוֹ; וְאִם נֶאֱמַר שֵׁן וְלֹא נֶאֱמַר עַיִן, הָיִיתִי אוֹמֵר אֲפִלּוּ שֵׁן תִּינוֹק שֶׁיֵּשׁ לָהּ חֲלִיפִין, לְכָךְ נֶאֱמַר עַיִן (מכילתא):", "rashi_en": "את עין עבדו [AND IF A MAN SMITE] THE EYE OF HIS SERVANT — of a Canaanitish servant; but the Hebrew servant does not got free on account of his tooth or his eye having been knocked out by his master, as we have stated in our comment on the passage לא תצא כצאת העבדים (v. 7).<br><br>תחת עינו [HE SHALL LET HIM GO FREE] FOR HIS EYE’S SAKE — and similarly if he cuts off one of the twenty-four “tips of limbs” viz., the fingers, the toes, the two ears, the nose and the ראש הגויה, the membrum (cf. Mishnah Negaim 6:7). But why, since the precept is not applicable to eye and tooth alone but to twenty-four limbs, are both the eye and the tooth, mentioned? One would have stufficed! Because if only the eye were mentioned and not the tooth also, I might have said: What it the characteristic of the eye? It came into the world together with him! So, too, this law is applicable only to such limbs as came into the world together with him, but not to the tooth, for the tooth did not come into the world together with him. If, on the other hand, only the tooth had been mentioned and not the eye also, I might have said: the law applies even to a case when the master knocked out a child-slave’s tooth which grows again (more lit., which has a substitute) after a time. Therefore the eye is also mentioned to intimate that the law can be applied only when the master knocks out the tooth of his adult slave which, like the eye, does not grow again. (Kiddushin 24b)."}, {"ch": 21, "v": 27, "aliyah": 2, "heb": "וְאִם־שֵׁ֥ן עַבְדּ֛וֹ אֽוֹ־שֵׁ֥ן אֲמָת֖וֹ יַפִּ֑יל לַֽחׇפְשִׁ֥י יְשַׁלְּחֶ֖נּוּ תַּ֥חַת שִׁנּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִם שִׁנָא דְעַבְדֵהּ אוֹ שִׁנָא דְאַמְתֵהּ יַפֵּל לְבַר חוֹרִין יִפְטְרִנֵהּ חֳלָף שִׁנֵהּ:", "onk_en": "If [he knocks out] the tooth of his slave, or knocks out the tooth of his female slave, he shall set him [the slave] free as compensation for the tooth.", "pj": "וְאִין שִׁינָא דְעַבְדֵיהּ כְּנַעֲנָאֵי אוֹ שִׁינָא דְאַמְתֵיהּ כְּנַעֲנִיתָא יַפִּיל לְבַר חוֹרִין יִפְטְרִינֵיהּ חוֹלַף שִׁינֵיהּ", "pj_en": "And if he strike out the tooth of his Kenaanite man or maid-servant, he shall make the servant free on account of the tooth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 28, "aliyah": 2, "heb": "וְכִֽי־יִגַּ֨ח שׁ֥וֹר אֶת־אִ֛ישׁ א֥וֹ אֶת־אִשָּׁ֖ה וָמֵ֑ת סָק֨וֹל יִסָּקֵ֜ל הַשּׁ֗וֹר וְלֹ֤א יֵאָכֵל֙ אֶת־בְּשָׂר֔וֹ וּבַ֥עַל הַשּׁ֖וֹר נָקִֽי׃", "onk": "וַאֲרֵי יַגַח תּוֹרָא יָת גַבְרָא אוֹ יָת אִתְּתָא וִימוּת אִתְרְגָמָא יִתְרְגֵם תּוֹרָא וְלָא יִתְאָכֵל יָת בִּסְרֵהּ וּמָרֵהּ דְתוֹרָא יְהֵי זַכָּאָה:", "onk_en": "If an ox gores a man or woman and the victim dies, the ox shall be stoned [to death], and its flesh may not be eaten. The owner of the ox shall go unpunished.", "pj": "וַאֲרוּם יִנְגַשׁ תּוֹר יַת גְּבַר אוֹ יַת אִיתָא וִימוּת יִתְרְגָמָא יִתְרְגֵם תּוֹרָא וְלָא יִתְנְכֵס לְמֵיכוּל יַת בִּשְרֵיהּ וּמָרֵיהּ דְּתוֹרָא יְהֵי זַכְּאַי מִדִּין קְטוֹל וְאוּף מִדְמֵי עַבְדָא וְאַמְהוּ", "pj_en": "And if an ox goreth a man or woman to cause death, the ox must be stoned, but shall not be killed that his flesh may be eaten; and the owner of the ox shall be exempt from the condemnation of death, and also from the price of the servant or handmaid.", "tj": "", "tj_en": "", "rashi": "<b>וכי יגח שור.<\/b> אֶחָד שׁוֹר וְאֶחָד כָּל בְּהֵמָה וְחַיָּה וָעוֹף, אֶלָּא שֶׁדִּבֵּר הַכָּתוּב בַּהֹוֶה (בבא קמא נ\"ד):<br><br><b>ולא יאכל את בשרו.<\/b> מִמַּשְׁמָע שֶׁנֶּאֱמַר סָקוֹל יִסָּקֵל הַשּׁוֹר אֵינִי יוֹדֵעַ שֶׁהוּא נְבֵלָה וּנְבֵלָה אֲסוּרָה בַּאֲכִילָה? אֶלָּא מַה תַּלְמוּד לוֹמַר וְלֹא יֵאָכֵל אֶת בְּשָׂרוֹ? שֶׁאֲפִלּוּ שְׁחָטוֹ לְאַחַר שֶׁנִּגְמַר דִּינוֹ אָסוּר בַּאֲכִילָה, בַּהֲנָאָה מִנַּיִן? תַּ\"לֹ וּבַעַל הַשּׁוֹר נָקִי, כְּאָדָם הָאוֹמֵר לַחֲבֵרוֹ יָצָא פְּלוֹנִי נָקִי מִנְּכָסָיו וְאֵין לוֹ בָהֶם הַנָּאָה שֶׁל כְּלוּם, זֶהוּ מִדְרָשׁוֹ (בבא קמא מלכים א). וּפְשׁוּטוֹ כְמַשְׁמָעוֹ, לְפִי שֶׁנֶּאֱמַר בַּמּוּעָד וְגַם בְּעָלָיו יוּמָת, הֻצְרַךְ לוֹמַר בַּתָּם וּבַעַל הַשּׁוֹר נָקִי:", "rashi_en": "וכי יגח שור AND IF AN OX THRUST — This law applies to an ox as well to any other cattle, wild beast or fowl, but Scripture mentions the ox, because it speaks of what usually occurs (Bava Kamma 54b).<br><br>ולא יאכל את בשרו AND ITS FLESH SHALL NOT BE EATEN — From what is implied in the words “the ox shall surely be stoned” do I not know that it becomes carrion, and carrion of course is prohibited to be eaten? Why then is it stated, “and its flesh shall not be eaten”? It is to intimate that even if he slaughtered the animal according to regulation after sentence of stoning has been pronounced but before it had been carried out it is forbidden to be eaten. Whence may it be proved that under such circumstances it is prohibited to derive any other benefit from it? Scripture therefore states: “and the owner of the ox is נקי” — it is a phrase such as a man uses to his fellow: that man there has gone away “empty” (נקי) of all his property (he has nothing whatever left), and he has not the slightest benefit of it. This is how the Halachic Midrash explains it (Bava Kamma 41a). However, the real sense of ובעל השור נקי, is what it literally means: the owner of the ox shall be guiltless. Because Scripture says with reference to the מועד (an ox which inflicted injury three times in succession, and about which its owner must therefore be regarded as forewarned), (v. 29) “and his owner also shall be put to death”, it was forced to state with regard to the תם (a hitherto innocuous animal, having inflicted an injury for the first time) “the owner of the ox shall be guiltless”."}, {"ch": 21, "v": 29, "aliyah": 2, "heb": "וְאִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִתְּמֹ֣ל שִׁלְשֹׁ֗ם וְהוּעַ֤ד בִּבְעָלָיו֙ וְלֹ֣א יִשְׁמְרֶ֔נּוּ וְהֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַשּׁוֹר֙ יִסָּקֵ֔ל וְגַם־בְּעָלָ֖יו יוּמָֽת׃", "onk": "וְאִם תּוֹר נַגַח הוּא מֵאִתְּמַלֵי וּמִדְקַמוֹהִי וְיִתַּסְהֵד בְּמָרֵהּ וְלָא נַטְרֵהּ וְיִקְטוֹל גַבְרָא אוֹ אִתְּתָא תּוֹרָא יִתְרְגֵם וְאַף מָרֵהּ יִתְקְטֵל:", "onk_en": "But if the ox had gored yesterday and the day before, and a warning was given to its owner, but he had not taken proper precautions to guard it, and kills a man or a woman, the ox must be stoned, and the owner also shall die [by Divine decree].", "pj": "וְאִין תּוֹר נַגְשָׁן הוּא מֵאִתְמְלֵי וּמִדְקֳדָמוֹי וְאִתַּסְהַד עַל אַנְפֵּי מָרֵיהּ תְּלָתֵי זִמְנֵי וְלָא נַטְרֵיהּ וּמִבָּתַר כֵּן קָטֵל גַּבְרָא אוֹ אִיתָא תּוֹרָא יִתְרְגֵם וְאוּף מָרֵיהּ יִתְקְטֵיל בְּמִיתוּתָא דְמִשְׁתַּלְחָא עֲלוֹי מִן שְׁמַיָא", "pj_en": "But if the ox (had been wont) to gore yesterday and before, and it had been attested before his owner three times, and he (had neglected) to restrain him, the ox, when he killeth man or woman, shall be stoned, and his master also shall die with a death sent upon him from heaven.", "tj": "", "tj_en": "", "rashi": "<b>מתמל שלשם.<\/b> הֲרֵי שָׁלֹשׁ נְגִיחוֹת (מכילתא):<br><br><b>והועד בבעליו.<\/b> לְשׁוֹן הַתְרָאָה בְעֵדִים, כְּמוֹ הָעֵד הֵעִד בָּנוּ הָאִישׁ (בראשית מ\"ג):<br><br><b>והמית איש וגו'.<\/b> לְפִי שֶׁנֶּאֱמַר כִּי יִגַּח אֵין לִי אֶלָּא שֶׁהֱמִיתוֹ בִנְגִיחָה, הֱמִיתוֹ בִנְשִׁיכָה, דְּחִיפָה, בְּעִיטָה, מִנַּיִן? תַּלְמוּד לוֹמַר וְהֵמִית:<br><br><b>וגם בעליו יומת.<\/b> בִּידֵי שָׁמַיִם. יָכוֹל בִּידֵי אָדָם? תַּלְמוּד לוֹמַר מוֹת יוּמַת הַמַּכֶּה רוֹצֵחַ הוּא, עַל רְצִיחָתוֹ אַתָּה הוֹרְגוֹ וְאִי אַתָּה הוֹרְגוֹ עַל רְצִיחַת שׁוֹרוֹ (סנהדרין ט\"ו):", "rashi_en": "מתמל שלשם [BUT IF THE OX HAS BEEN WONT TO THRUST] YESTERDAY AND BEFORE YESTERDAY — Here you have including the present occasion the three times an ox must gore before it can be declared a מועד (Bava Kamma 23b).‎<br><br>והועד בבעליו AND IT HATH BEEN TESTIFIED TO HIS OWNER — הועד (from the root עוד) is an expression for warning through witnesses (Bava Kamma 24a), as in, (Genesis 43:3) “the man hath solemnly forewarned (הָעֵד הַעִד) us”.<br><br>והמית איש וגו׳ BUT HE HATH PUT TO DEATH A MAN [OR WOMAN] — Since it states, (v. 28) “If an ox gore (יגח) [a man or a woman, that he die]” I might say that I have only the law dealing with the case that it kills by pushing him with the horn (the root נגח being mainly used of thrusting with the horn, cf. e .g., Deuteronomy 33:17) but whence can the law be derived that it applies also to the case where it kills by biting, thrusting, or kicking? Scripture therefore states “he hath put to death [a man or a woman]” thus intimating that so long as death is caused by the animal it is liable to stoning.<br><br>וגם בעליו יומת AND HIS OWNER ALSO SHALL BE PUT TO DEATH by a visitation of God. You might perhaps think he shall be punished by human agency (the judges)! Scripture, however, states, (Numbers 35:21) “he that smote him (a human being) shall surely be put to death; for he is a murderer” — the force of these last words is to intimate that for a murder committed by himself you shall put him to death (i. e. he suffers death by human agency as is the law regarding a murderer), but you shall not put him to death on account of a murder committed by his ox; this must be left to God (Sanhedrin 15b; cf. also Mekhilta)."}, {"ch": 21, "v": 30, "aliyah": 2, "heb": "אִם־כֹּ֖פֶר יוּשַׁ֣ת עָלָ֑יו וְנָתַן֙ פִּדְיֹ֣ן נַפְשׁ֔וֹ כְּכֹ֥ל אֲשֶׁר־יוּשַׁ֖ת עָלָֽיו׃", "onk": "אִם מָמוֹן יְשַׁווּן עֲלוֹהִי וְיִתֵּן פּוּרְקַן נַפְשֵׁהּ כְּכֹל דִי יְשַׁווּן עֲלוֹהִי:", "onk_en": "When an atonement fine shall be imposed on him, he must give for the redemption of his soul whatever sum is imposed on him.", "pj": "בְּרַם אִין קְנָסָא דְמָמוֹנָא יִתְשַׁוֵּי עֲלוֹי וְיִתֵּן פּוּרְקַן נַפְשֵׁיהּ כְּכָל מַה דִּישַׁווּן עֲלוֹי סַנְהֶדְרִין דְּיִשְרָאֵל", "pj_en": "Yet if a fine of money be laid upon him, he may give a ransom for his life, according to what shall be imposed on him by the sanhedrin of Israel.", "tj": "", "tj_en": "", "rashi": "<b>אם כפר יושת עליו.<\/b> \"אִם\" זֶה אֵינוֹ תָלוּי, וַהֲרֵי הוּא כְּמוֹ \"אִם כֶּסֶף תַּלְוֶה\" – לְשׁוֹן אֲשֶׁר, זֶה מִשְׁפָּטוֹ שֶׁיָּשִׁיתוּ עָלָיו בֵּית דִּין כֹּפֶר:<br><br><b>ונתן פדין נפשו.<\/b> דְּמֵי נִזָּק דִּבְרֵי רַ' יִשְׁמָעֵאל, רַ' עֲקִיבָא אוֹמֵר דְּמֵי מַזִּיק (מכילתא):", "rashi_en": "אם כפר יושת עליו WHEN THERE BE SET ON HIM A RANSOM — This אם is not conditional (i. e. it does not mean “if” the heirs feel inclined to set on him a ransom) but it has the same meaning as in (Exodus 22:24) “When (אם) thou lendest money” where it has the meaning of אשר, “when” (for it is a duty to lend money to the poor and it is not optional). It is the law regarding him that the court should set on him a ransom.<br><br>ונתן פדיון נפשו HE SHALL GIVE THE RANSOM OF HIS SOUL — the value of the injured person; this is the view of R. Ishmael, R. Akiba, however, says that it means the value of the person who caused the injury (Mekhilta)."}, {"ch": 21, "v": 31, "aliyah": 2, "heb": "אוֹ־בֵ֥ן יִגָּ֖ח אוֹ־בַ֣ת יִגָּ֑ח כַּמִּשְׁפָּ֥ט הַזֶּ֖ה יֵעָ֥שֶׂה לּֽוֹ׃", "onk": "אוֹ לְבַר <b>יִשְׂרָאֵל<\/b> יַגַח <b>תּוֹרָא<\/b> אוֹ לְבַת <b>יִשְׂרָאֵל<\/b> יַגָח כְּדִינָא הָדֵין יִתְעֲבֵד לֵהּ:", "onk_en": "Whether it is a son [a minor lad] [<b>of Yisrael<\/b>] that is gored [<b>by the ox<\/b>] or a daughter [a minor girl] [<b>of Yisrael<\/b>] that it gored, this law shall apply to it.", "pj": "אִין בַּר יִשְרָאֵל יְנַגַּח תּוֹרָא אוֹ לְבַת יִשְרָאֵל יְנַגַּח כְּדִינָא הָדֵין יִתְעֲבֵד לֵיהּ", "pj_en": "Whether the ox hath gored a son or a daughter of Israel, according to that judgment it shall be done to him.", "tj": "", "tj_en": "", "rashi": "<b>או בן יגח.<\/b> בֵּן שֶׁהוּא קָטָן:<br><br><b>או בת.<\/b> שֶׁהִיא קְטַנָּה; לְפִי שֶׁנֶּאֱמַר וְהֵמִית אִישׁ אוֹ אִשָּׁה, יָכוֹל אֵינוֹ חַיָּב אֶלָּא עַל הַגְּדוֹלִים, תַּלְמוּד לוֹמַר אוֹ בֵן יִגָּח וְגוֹ', לְחַיֵּב עַל הַקְּטַנִּים כַּגְּדוֹלִים (שם):", "rashi_en": "או בן ינח WHETHER HE HAVE THRUST A SON — a son who is a minor;<br><br>או בת יגח OR HAVE THRUST A DAUGHTER, who is a minor. Since it states, (v. 29) “and hath put to death a man or a woman”, one might think that the owner is liable only for the death of adult persons, Scripture therefore states, “whether he have thrust a son etc.” to make him liable for the death of minors equally as for that of adults (Mekhilta)."}, {"ch": 21, "v": 32, "aliyah": 2, "heb": "אִם־עֶ֛בֶד יִגַּ֥ח הַשּׁ֖וֹר א֣וֹ אָמָ֑ה כֶּ֣סֶף&thinsp;<b>׀<\/b> שְׁלֹשִׁ֣ים שְׁקָלִ֗ים יִתֵּן֙ לַֽאדֹנָ֔יו וְהַשּׁ֖וֹר יִסָּקֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִם לְעַבְדָא יַגַח תּוֹרָא אוֹ לְאַמְתָא כְּסַף תְּלָתִין <b>סִלְעִין<\/b> יִתֵּן לְרִבּוֹנֵהּ וְתוֹרָא יִתְרְגֵם:", "onk_en": "If the ox gored a male or female slave, he must give thirty silver shekalim [<b>selaim<\/b>] to their master, and the ox must be stoned.", "pj": "בְּרַם אִין עֶבֶד כְּנַעֲנָאֵי נְגַשׁ תּוֹרָא אוֹ אַמְתָא כְּנַעֲנִיתָא כְּסַף תְּלָתִין סִלְעִין יִתֵּן לְמָרֵיהּ דְּעַבְדָא אוֹ דְאַמְתָא וְתוֹרָא יִתְרְגָם", "pj_en": "If an ox goreth a Kenaanite man-servant or handmaid, the master of the man or woman-servant shall give thirty sileen of silver, and the ox shall be stoned.", "tj": "", "tj_en": "", "rashi": "<b>אם עבד, או אמה.<\/b> כְּנַעֲנִיִּים:<br><br><b>שלשים שקלים יתן.<\/b> גְּזֵרַת הַכָּתוּב הוּא, בֵּין שֶׁהוּא שָׁוֶה אֶלֶף זוּז בֵּין שֶׁאֵינוֹ שָׁוֶה אֶלָּא דִּינָר. וְהַשֶּׁקֶל מִשְׁקָלוֹ אַרְבָּעָה זְהוּבִים שֶׁהֵם חֲצִי אֻנְקִיָא לְמִשְׁקָל הַיָּשָׁר שֶׁל קוֹלוֹנְיָ\"א:", "rashi_en": "אם עבד או אמה IF [AN OX SHALL THRUST] A MANSERVANT OR A MAIDSERVANT — Canaanitish servants (Mekhilta).<br><br>שלשים שקלים יתן HE SHALL GIVE THIRTY SHEKELS — This is the enactment of Scripture (and no reason is given) — the indemnity shall be thirty shekels whether the slave was worth a thousand zuz or was worth no more than one denar. A shekel weighs four gold coins, making half an ounce according to the correct weight of Cologne."}, {"ch": 21, "v": 33, "aliyah": 2, "heb": "וְכִֽי־יִפְתַּ֨ח אִ֜ישׁ בּ֗וֹר א֠וֹ כִּֽי־יִכְרֶ֥ה אִ֛ישׁ בֹּ֖ר וְלֹ֣א יְכַסֶּ֑נּוּ וְנָֽפַל־שָׁ֥מָּה שּׁ֖וֹר א֥וֹ חֲמֽוֹר׃", "onk": "וַאֲרֵי יִפְתַּח גְבַר גוֹב אוֹ אֲרֵי יִכְרֶה גְבַר גוֹב וְלָא יְכַסִנֵהּ וְיִפֵּל תַּמָן תּוֹרָא אוֹ חֲמָרָא:", "onk_en": "If a man uncovers a pit, or if a man digs a pit, and does not cover it, and an ox or a donkey falls into it;", "pj": "וַאֲרוּם יִפְתָּח אֵינַשׁ גּוּב אוֹ אֲרוּם יַחְפֵּס אֵינָשׁ גּוּב בְּשׁוּקָא וְלָא יְכַסִּינֵיהּ וּנְפוֹל תַּמָּן תּוֹרָא אוֹ חַמָרָא", "pj_en": "And if a man openeth a pit in the street, and doth not cover it, and an ox or an ass fall therein;", "tj": "", "tj_en": "", "rashi": "<b>וכי יפתח איש בור.<\/b> שֶׁהָיָה מְכֻסֶּה וְגִלָּהוּ:<br><br><b>או כי יכרה.<\/b> לָמָּה נֶאֱמַר? אִם עַל הַפְּתִיחָה חַיָּב עַל הַכְּרִיָּה לֹא כָל שֶׁכֵּן? אֶלָּא לְהָבִיא כוֹרֶה אַחַר כּוֹרֶה שֶׁהוּא חַיָּב (בבא קמא נ\"א):<br><br><b>ולא יכסנו.<\/b> הָא אִם כִּסָּהוּ פָּטוּר; וּבְחוֹפֵר בִּרְשׁוּת הָרַבִּים דִּבֵּר הַכָּתוּב:<br><br><b>שור או חמור.<\/b> הוּא הַדִּין לְכָל בְּהֵמָה וְחַיָּה, שֶׁבְּכָל מָקוֹם שֶׁנֶּאֱמַר שׁוֹר אוֹ חֲמוֹר אָנוּ לְמֵדִין אוֹתוֹ שׁוֹר שׁוֹר מִשַּׁבָּת, שֶׁנֶּאֱמַר לְמַעַן יָנוּחַ שׁוֹרְךָ וַחֲמֹרֶךָ (שמות כ\"ג), מַה לְּהַלָּן כָּל בְּהֵמָה וְחַיָּה כְּשׁוֹר – שֶׁהֲרֵי נֶאֱמַר בְּמָקוֹם אַחֵר וְכָל בְּהֶמְתֶּךָ (דברים ה') – אַף כָּאן כָּל בְּהֵמָה וְחַיָּה כְּשׁוֹר, וְלֹא נֶאֱמַר שׁוֹר וַחֲמוֹר אֶלָּא שׁוֹר וְלֹא אָדָם, חֲמוֹר וְלֹא כֵלִים (בבא קמא נ\"ג):", "rashi_en": "וכי יפתח איש בור AND IF A MAN SHALL OPEN A PIT which was covered over, and he now uncovered it.<br><br>או כי יכרה OR IF A MAN SHALL DIG [A PIT] — Why is this stated? If he becomes liable for opening one that already exists how much the more is he liable for digging a new one! However, it does not mean that he digs a pit from beginning to end but it is intended to include in this law a person who digs after another has dug (i. e. who deepens to a height of ten handbreaths a pit which another has already excavated to a depth less than this. Before he did this an animal which fell into the pit was unlikely to kill itself; now, however, such a fall may prove fatal) — that such a one alone becomes liable (cf. Bava Kamma 51a).<br><br>ולא יכסנו AND SHALL NOT COVER IT — if, however, he did cover it, though he did not fill it in with earth” he is not liable (Bava Kamma 50a). Scripture speaks of one who excavates a pit in a public thoroughfare (cf. Bava Kamma 49b).<br><br>שור או חמור AN OX OR AN ASS — This is the law also with respect to all cattle and beasts, because wherever the Torah prescribes something with regard to “ox or ass”, we derive it (the fact that it applies to all cattle and beasts) on the grounds of the verbal similarity of שור in the text in question with שור which occurs in the law prescribing the Sabbath rest, for — with regard to the latter — it is stated, (Exodus 23:12) “that thine ox and thine ass may rest”. Now how is it in the latter case? We know that all cattle and beasts are to be treated in this respect as the “ox”, because in another passage referring to Sabbath (Deuteronomy 5:14) it is expressly said “[thy ox and thy ass] and all thy cattle”! So here, too, all cattle and beasts are to be treated as the ox. The only reason why ox and ass are alone mentioned is to imply: “an ox” — but not a man, “an ass” — but not vessels (Bava Kamma 53b)."}, {"ch": 21, "v": 34, "aliyah": 2, "heb": "בַּ֤עַל הַבּוֹר֙ יְשַׁלֵּ֔ם כֶּ֖סֶף יָשִׁ֣יב לִבְעָלָ֑יו וְהַמֵּ֖ת יִֽהְיֶה־לּֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "מָרֵי דְגֻבָּא יְשַׁלֵם כַּסְפָּא יָתִיב לְמָרוֹהִי וּמֵיתָא יְהֵי דִילֵהּ:", "onk_en": "The owner of the pit must pay. He must compensate its owner with money, and the dead [animal] remains his [its original owner’s] possesion.", "pj": "מָרֵיהּ דְּגוֹבָא יְשַׁלֵּם כְּסַף יָתֵיב לְמָרֵיהּ דְּמֵי תּוֹרֵיהּ וְחַמְרֵיהּ וּנְבֵילְתָּא יְהֵי דִילֵיהּ", "pj_en": "the master of the pit shall deliver silver to give to its owner the price of the ox or the ass, and the dead body shall be his.", "tj": "", "tj_en": "", "rashi": "<b>בעל הבור.<\/b> בַּעַל הַתַּקָּלָה; אַעַ\"פִּ שֶׁאֵין הַבּוֹר שֶׁלּוֹ – שֶׁעֲשָׂאוֹ בִרְשׁוּת הָרַבִּים – עֲשָׂאוֹ הַכָּתוּב בְּעָלָיו לְהִתְחַיֵּב עָלָיו בִּנְזָקָיו:<br><br><b>כסף ישיב לבעליו.<\/b> יָשִׁיב לְרַבּוֹת שְׁוֵה כֶסֶף וַאֲפִלּוּ סֻבִּין (שם ז'):<br><br><b>והמת יהיה לו.<\/b> לַנִּזָּק; שָׁמִין אֶת הַנְּבֵלָה וְנוֹטְלָהּ בְּדָמִים וּמְשַׁלֵּם לוֹ הַמַּזִּיק עָלֶיהָ תַשְׁלוּמֵי נִזְקוֹ (בבא קמא י'):", "rashi_en": "בעל הבור THE OWNER OF THE PIT [SHALL PAY FOR IT] — This means the one who occasioned the damage. Although the pit was not his, — for he dug it in the public thoroughfare, — Scripture regards him as its “owner” (בעל הבור) in so far that he becomes responsible for the damage caused by it.<br><br>כסף ישיב לבעליו [THE OWNER OF THE PIT SHALL PAY FOR IT] AND RESTORE MONEY UNTO THE OWNER OF THEM — The word ישיב is apparently redundant; it would have sufficed to state ישלם כסף לבעליו but it is added to include as legal tender in this case even bran (i. e. the restitution need not be money so long as he actually restores something of money-value). (Bava Kamma 7a).<br><br>והמת יהיה לו AND THE DEAD BEAST SHALL BELONG TO HIM — to him who has suffered the loss. We assess the value of the carcass and he (the claimant) takes it at this value in part payment, and the man who caused the damage pays him in addition to this as much as will make up the whole loss he has suffered (Bava Kamma 10b)."}, {"ch": 21, "v": 35, "aliyah": 2, "heb": "וְכִֽי־יִגֹּ֧ף שֽׁוֹר־אִ֛ישׁ אֶת־שׁ֥וֹר רֵעֵ֖הוּ וָמֵ֑ת וּמָ֨כְר֜וּ אֶת־הַשּׁ֤וֹר הַחַי֙ וְחָצ֣וּ אֶת־כַּסְפּ֔וֹ וְגַ֥ם אֶת־הַמֵּ֖ת יֶֽחֱצֽוּן׃", "onk": "וַאֲרֵי יִגוֹף תּוֹר דִגְבַר יָת תּוֹרָא דְחַבְרֵהּ וִימוּת וִיזַבְּנוּן יָת תּוֹרָא חַיָא וִיפַלְגוּן יָת כַּסְפֵּהּ וְאַף יָת דְמֵי מֵיתָא יְפַלְגוּן:", "onk_en": "If a man’s ox injures his neighbor’s ox and it dies, they shall sell the live ox and divide the money received for it. They shall also divide [the value of] the dead animal.", "pj": "וַאֲרוּם יִנְגוֹף תּוֹר דִּגְבַר יַת תּוֹרָא דְּחַבְרֵיהּ וִימוּת וִיזַבְּנוּן יַת תּוֹרָה חַיָיא וְיִפְלְגוּן יַת דְּמֵיהּ וְאוּף יַת דְּמֵי מוֹתָא יִפְלְגוּן", "pj_en": "And when an ox woundeth his neighbour's ox, and he die, they shall sell the living ox, and divide the price, and the price of the dead one shall they also divide.", "tj": "", "tj_en": "", "rashi": "<b>וכי יגף.<\/b> יִדְחֹף; בֵּין בְּקַרְנָיו, בֵּין בְּגוּפוֹ, בֵּין בְּרַגְלוֹ, בֵּין שֶׁנְּשָׁכוֹ בְשִׁנָּיו, כֻּלָּן בִּכְלַל נְגִיפָה הֵם, שֶׁאֵין נְגִיפָה אֶלָּא לְשׁוֹן מַכָּה:<br><br><b>שור איש.<\/b> שׁוֹר שֶׁל אִישׁ:<br><br><b>ומכרו את השור וגו'.<\/b> בְּשָׁוִים הַכָּתוּב מְדַבֵּר – שׁוֹר שָׁוֶה מָאתַיִם שֶׁהֵמִית שׁוֹר שָׁוֶה מָאתַיִם – בֵּין שֶׁהַנְּבֵלָה שָׁוָה הַרְבֵּה, בֵּין שֶׁהִיא שָׁוָה מְעַט, כְּשֶׁנּוֹטֵל זֶה חֲצִי הַחַי וַחֲצִי הַמֵּת וְזֶה חֲצִי הַחַי וַחֲצִי הַמֵּת, נִמְצָא כָל אֶחָד מַפְסִיד חֲצִי נֶזֶק שֶׁהִזִּיקָה הַמִּיתָה; לִמְּדָנוּ שֶׁהַתָּם מְשַׁלֵּם חֲצִי נֶזֶק, שֶׁמִּן הַשָּׁוִין אַתָּה לָמֵד לְשֶׁאֵינָן שָׁוִין, כִּי דִּין הַתָּם לְשַׁלֵּם חֲצִי נֶזֶק – לֹא פָּחוֹת וְלֹא יוֹתֵר. אוֹ יָכוֹל אַף בְּשֶׁאֵינָן שָׁוִין בִּדְמֵיהֶן כְּשֶׁהֵן חַיִּים אָמַר הַכָּתוּב יֶחֱצוּ אֶת שְׁנֵיהֶם? אִם אָמַרְתָּ כֵן, פְּעָמִים שֶׁהַמַּזִּיק מִשְׂתַּכֵּר הַרְבֵּה, כְּשֶׁהַנְּבֵלָה שָׁוָה לִמָּכֵר לְנָכְרִים הַרְבֵּה יוֹתֵר מִדְּמֵי שׁוֹר הַמַּזִּיק, וְאִי אֶפְשָׁר שֶׁיֹּאמַר הַכָּתוּב שֶׁיְּהֵא הַמַּזִּיק נִשְׂכָּר; אוֹ פְעָמִים שֶׁהַנִּזָּק נוֹטֵל הַרְבֵּה יוֹתֵר מִדְּמֵי נֶזֶק שָׁלֵם – שֶׁחֲצִי דְּמֵי שׁוֹר הַמַּזִּיק שָׁוִין יוֹתֵר מִכָּל דְּמֵי שׁוֹר הַנִּזָּק – וְאִם אָמַרְתָּ כֵן, הֲרֵי תָם חָמוּר מִמּוּעָד. עַל כָּרְחֲךָ לֹא דִּבֵּר הַכָּתוּב אֶלָּא בְּשָׁוִין, וְלִמֶּדְךָ שֶׁהַתָּם מְשַׁלֵּם חֲצִי נֶזֶק, וּמִן הַשָּׁוִין תִּלְמֹד לְשֶׁאֵינָן שָׁוִין, שֶׁהַמִּשְׁתַּלֵּם חֲצִי נִזְקוֹ שָׁמִין לוֹ אֶת הַנְּבֵלָה, וּמַה שֶׁפָּחֲתוּ דָּמָיו בִּשְׁבִיל הַמִּיתָה, נוֹטֵל חֲצִי הַפְּחָת וְהוֹלֵךְ. וְלָמָה אָמַר הַכָּתוּב בַּלָּשׁוֹן הַזֶּה וְלֹא אָמַר יְשַׁלֵּם חֶצְיוֹ? לְלַמֵּד, שֶׁאֵין הַתָּם מְשַׁלֵּם אֶלָּא מִגּוּפוֹ, וְאִם נָגַח וּמֵת, אֵין נִּזָּק נוֹטֵל אֶלָּא הַנְּבֵלָה, וְאִם אֵינָהּ מַגַּעַת לַחֲצִי נִזְקוֹ יַפְסִיד; אוֹ שׁוֹר שָׁוֶה מָנֶה, שֶׁנָּגַח שׁוֹר שָׁוֶה חֲמֵשׁ מֵאוֹת זוּז, אֵינוֹ נוֹטֵל אֶלָּא אֶת הַשּׁוֹר, שֶׁלֹּא נִתְחַיֵּב הַתָּם לְחַיֵּב אֶת בְּעָלָיו לְשַׁלֵּם מִן הָעֲלִיָּה (בבא קמא ל\"ג):", "rashi_en": "וכי יגף AND IF [AN OX] HURT [AN OX OF HIS FELLOW-MAN] — יגף means to thrust; whether it injures by horns or the whole body, or whether it kicks with its foot or bites it with its teeth, all are included in the term נגף, for נגף means nothing else than מכה — the impact of one thing upon another (Mekhilta).<br><br>שור איש means שור של איש THE OX OF A MAN (i. e. שור is in construct state to the word איש).‎<br><br>ומכרו את השור וגו׳ THEN THEY SHALL SELL THE LIVE ONE — Scripture is speaking of a case when both animals are of the same value: an ox of the value of 200 zuz that killed another also valued at 200 zuz. Then whether the carcass is worth much or whether it is worth little, as soon as one takes one-half of the living animal and one-half of the dead, and the other takes one-half of the living animal and one-half of the dead, it follows that each of them suffers the loss of half the damage which the death of the animal has caused. Scripture teaches us that the תם (which is the animal spoken of here — one that inflicted injury for the first time) always pays half damages. For from what it states about animals of the same value you may gather the rule for such as are of different values — that the law regarding the תם is for its owner to pay half damages, neither more nor less. Or perhaps you might say that also of animals which were of unequal value when living Scripture states that both of them must be halved! But if you say this, you will find that sometimes the man who occasions the damage may benefit considerably — namely, when the carcass is worth when sold unto heathens much more than the value of the ox which inflicted the injury. And you must admit that it is impossible that Scripture should say that the man who occasioned the damage should benefit by it. Or it may sometimes happen that the claimant will receive much more than the value of the whole damage — namely, when one-half of the value of the defendant’s ox is worth more than the whole value of the claimant’s ox. Consequently if you still maintain this (that the animals are to be halved even when they are of different value), the result may well be that the case of the תם is more severely dealt with than that of the מועד (when the claimant gets full damages — but not more). You must therefore needs admit that Scripture speaks here only of animals that are of equal value, and that it teaches you that the owner of a תם has to pay half damages; and from what is said in respect to animals of equal value you may derive the law in respect of such as are of different values — that in any case when a person is paid half the damages caused to him we value the carcass for him (the claimant); and as regards the depreciation in value caused by its death — he must accept a sum equal to half of that depreciation together with the carcass and has to be satisfied (Hebrew: and goes his way). But why does Scripture use this mode of expression and does not simply say: he (the owner of the תם) shall pay the half? To teach you by the way that the תם pays only to the extent of its own value (Hebrew: from what can be obtained for its body). So in case it gores another and itself dies, the claimant gets at most the carcass of the ox that caused the damage, and if that does not amount to one-half of the damage, he has to suffer the loss. Or take another case: an ox of the value of one maneh (200 zuz) that gored an ox of the value of 500 zuz (so that the loss is more than the whole value of the ox that caused it). The claimant still does not get more than the living ox; and the defendant is not bound to make up the deficiency from his own money, for the תם is not responsible to such an extent as to make its owner liable to pay from his own property) (Bava Kamma 16b)."}, {"ch": 21, "v": 36, "aliyah": 2, "heb": "א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִתְּמ֣וֹל שִׁלְשֹׁ֔ם וְלֹ֥א יִשְׁמְרֶ֖נּוּ בְּעָלָ֑יו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַשּׁ֔וֹר וְהַמֵּ֖ת יִֽהְיֶה־לּֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אוֹ אִתְיְדַע אֲרֵי תוֹר נַגַח הוּא מֵאִתְּמַלֵי וּמִדְקַמוֹהִי וְלָא נָטְרֵהּ מָרֵהּ שַׁלָמָא יְשַׁלֵם תּוֹרָא חֲלַף תּוֹרָא וּמֵיתָא יְהֵא דִילֵהּ:", "onk_en": "If it was known that it was a goring ox from yesterday and the day before, but he had not taken proper precaution to guard it, then he must pay full compensation, an ox for an ox. The dead [animal] remains in the possession [of its owner].", "pj": "אִין אִישְׁתְּמוֹדַע אֲרוּם תּוֹר נַגְחָן הוּא מֵאִתְמְלֵי וּמִדְקֳדָמוֹי וְלָא נַטְרֵיהּ מָרֵיהּ שַׁלְמָא יְשַׁלֵם תּוֹרָא חוֹלַף תּוֹרָא וּנְבֵילְתָּא וּמוֹשְׁכָא יְהֵי דִילֵיהּ", "pj_en": "But if it hath been known that the ox was wont to gore in time past, and his master did not restrain him, he shall surely deliver ox for ox; but the carcase and the skin shall be his.", "tj": "", "tj_en": "", "rashi": "<b>או נודע.<\/b> אוֹ לֹא הָיָה תָם, אֶלָּא נוֹדַע כִּי שׁוֹר נַגָּח הוּא, הַיּוֹם וּמִתְּמוֹל שִׁלְשֹׁם הֲרֵי שָׁלֹשׁ נְגִיחוֹת:<br><br><b>שלם ישלם שור.<\/b> נֶזֶק שָׁלֵם:<br><br><b>והמת יהיה לו.<\/b> לַנִּזָּק; וְעָלָיו יַשְׁלִים הַמַּזִּיק עַד שֶׁיִּשְׁתַּלֵּם נִזָּק כָּל נִזְקוֹ:", "rashi_en": "או נודע means, OR it was not a תם but IT IS KNOWN THAT THE OX WAS WONT TO THRUST to-day yesterday and the day before yesterday — thus you have the three acts of goring required to make it a שלם ישלם שור (Bava Kamma 23b)<br><br>.מועד HE SHALL SURELY PAY AN OX [FOR THE OX] — i. e. the full damage.<br><br>והמת יהיה לו AND THE DEAD SHALL BELONG TO HIM — to the claimant (Bava Kamma 23b) as part of this full payment. In addition to it the defendant has to complete the amount until the claimant has been paid for his entire loss."}, {"ch": 21, "v": 37, "aliyah": 2, "heb": "כִּ֤י יִגְנֹֽב־אִישׁ֙ שׁ֣וֹר אוֹ־שֶׂ֔ה וּטְבָח֖וֹ א֣וֹ מְכָר֑וֹ חֲמִשָּׁ֣ה בָקָ֗ר יְשַׁלֵּם֙ תַּ֣חַת הַשּׁ֔וֹר וְאַרְבַּע־צֹ֖אן תַּ֥חַת הַשֶּֽׂה׃", "onk": "אֲרֵי יִגְנוּב גְבַר תּוֹר אוֹ אִמָר וְיִכְּסִנֵהּ אוֹ יְזַבְּנִנֵהּ חַמְשָׁא תוֹרִין יְשַׁלֵם חָלָף תּוֹרָא וְאַרְבַּע עָנָא חֳלָף אִמְרָא:", "onk_en": "If a man steals an ox or a sheep, and then slaughters or sells it, he must pay five oxen for each ox, and four sheep for each sheep.", "pj": "אֲרוּם יִגְנוֹב גְּבַר תּוֹר אוֹ אִימַר וְיִכְסִינֵיהּ אוֹ זַבִּינֵיהּ חַמְשָׁא תּוֹרָא יְשַׁלֵם חוֹלַף תּוֹר חַד מִן בִּגְלַל דְּבַטְלֵי מִן רַדְיֵיה וְאַרְבַּע עָנָא חוֹלַף אִימַר חַד מִן בִּגְלַל דְּאַקְטֵיהּ בִּגְנֵבוּתֵיהּ וְלֵית בָּהּ עִיבִידְתָּא", "pj_en": "When a man stealeth an ox or a sheep, and killeth or selleth it, five oxen shall he make good for one ox, because he hath hindered him from his ploughing; and four sheep for one, because he hath impoverished him by his theft, and not done service by it.", "tj": "", "tj_en": "", "rashi": "<b>חמשה בקר וגו'.<\/b> אָמַר רַ' יוֹחָנָן בֶּן זַכַּאי חָס הַמָּקוֹם עַל כְּבוֹדָן שֶׁל בְּרִיּוֹת – שׁוֹר שֶׁהוֹלֵךְ בְּרַגְלָיו וְלֹא נִתְבַּזָּה בּוֹ הַגַּנָּב לְנָשְׂאוֹ עַל כְּתֵפוֹ, מְשַׁלֵּם חֲמִשָּׁה, שֶׂה שֶׁנּוֹשְֹׁאוֹ עַל כְּתֵפוֹ, מְשַׁלֵּם אַרְבָּעָה הוֹאִיל וְנִתְבַּזָּה בוֹ. אָמַר רַבִּי מֵאִיר בֹּא וּרְאֵה כַּמָּה גָדוֹל כֹּחָהּ שֶׁל מְלָאכָה – שׁוֹר שֶׁבִּטְּלוֹ מִמְּלַאכְתּוֹ חֲמִשָּׁה, שֶׂה שֶׁלֹּא בִטְּלוֹ מִמְּלַאכְתּוֹ אַרְבָּעָה (מכילתא, בבא קמא ע\"ט):<br><br><b>תחת השור, תחת השה.<\/b> שְׁנָאָן הַכָּתוּב, לוֹמַר שֶׁאֵין מִדַּת תַּשְׁלוּמֵי אַרְבָּעָה וַחֲמִשָּׁה נוֹהֶגֶת אֶלָּא בְּשׁוֹר וְשֶׂה בִּלְבַד (בבא קמא ס\"ז):", "rashi_en": "חמשה בקר וגו׳ [HE SHALL PAY] FIVE OF THE HERD etc. — Rabban Jochanan ben Zaccai said, “The Omnipresent has much consideration for the honour of His creatures: when an ox — an animal that can walk by itself — has been stolen and sold or slaughtered, in which case the thief had not to degrade himself by carrying it on his shoulder, he has to pay fivefold restitution. In the case of a lamb, however, which he had to carry on his shoulder, he has to pay only the fourfold, because he was forced to degrade himself by carrying it”. Rabbi Meir said, “Come and see how great is the virtue of labour: In the case of the theft of an ox which he (the thief) withdrew from its labour, thereby causing a loss to its owner, he has to repay five oxen, in the case of a lamb which he has not withdrawn from its labour — only four (Bava Kamma 79b).<br><br>תחת השור … תחת השה FOR THE OX … FOR THE LAMB — The text repeats the words שור and שה unnecessarily (for it would have sufficed to state כי יגנוב איש שור וטבחו או מכרו חמשה בקר ישלם תחתיו וארבע הצאן תחת השה “And if a man shall steal an ox … then he shall pay five of the herd for it, or four sheep in place of the lamb”) to tell you that the rule providing for four-fold and five-fold restitution applies solely to the ox and the lamb (and not to any other cattle) (Bava Kamma 67b)."}, {"ch": 22, "v": 1, "aliyah": 2, "heb": "אִם־בַּמַּחְתֶּ֛רֶת יִמָּצֵ֥א הַגַּנָּ֖ב וְהֻכָּ֣ה וָמֵ֑ת אֵ֥ין ל֖וֹ דָּמִֽים׃", "onk": "אִם בְּמַחְתַּרְתָּא יִשְׁתְּכַח גַנָבָא וְיִתְמְחֵי וִימוּת לֵית לֵהּ דָם:", "onk_en": "If the thief is found [caught] while breaking in, and is struck and killed, there is no liability for his blood.", "pj": "אִין בַּחְרַכָּא דְכוֹתְלָא מִשְׁתְּכַח גַּנָבָא וְיִתְמְחֵי וִימוּת לֵית לֵיהּ חוֹבַת שְׁפִיכוּת אֲדַם זַכְּאַי", "pj_en": "If a thief be found in a window of the wall, and be smitten and die, there shall not be on his account the guilt of the shedding of innocent blood.", "tj": "", "tj_en": "", "rashi": "<b>אם במחתרת.<\/b> כְּשֶׁהָיָה חוֹתֵר אֶת הַבַּיִת:<br><br><b>אין לו דמים.<\/b> אֵין זוֹ רְצִיחָה, הֲרֵי הוּא כְמֵת מֵעִקָּרוֹ; כָּאן לִמְּדַתְךָ תוֹרָה \"אִם בָּא לְהָרְגְּךָ, הַשְׁכֵּם לְהָרְגוֹ\" וְזֶה לְהָרְגְּךָ בָּא, שֶׁהֲרֵי יוֹדֵעַ הוּא שֶׁאֵין אָדָם מַעֲמִיד עַצְמוֹ וְרוֹאֶה שֶׁנּוֹטְלִין מָמוֹנוֹ בְּפָנָיו וְשׁוֹתֵק, לְפִיכָךְ עַל מְנָת כֵּן בָּא שֶׁאִם יַעֲמֹד בַּעַל הַמָּמוֹן כְּנֶגְדוֹ יַהַרְגֶנּוּ (סנהדרין ע\"ב):", "rashi_en": "אם במחתרת means when he was breaking in into the house (i. e. in the very act of forcing an entry, but at no other moment).<br><br>אין לו דמים THERE SHALL NO GUILT OF BLOOD BE INCURRED FOR HIM — This is not regarded as a murder; it is as though he (the thief) has been dead from the beginning of his criminal act (אין לו דמים is taken to mean: he, the thief, had no blood — no vitality). Here the Torah teaches you the rule: “If one comes with the intention of killing you, be quick and kill him”. — And this burglar actually came with the intention of killing you, for he knew full well that no one can hold himself in check, looking on whilst people are stealing his property before his eyes and doing nothing. He (the thief) therefore obviously came with this purpose in view — that in case the owner of the property would resist him, he would kill him (Sanhedrin 72a)."}, {"ch": 22, "v": 2, "aliyah": 2, "heb": "אִם־זָרְחָ֥ה הַשֶּׁ֛מֶשׁ עָלָ֖יו דָּמִ֣ים ל֑וֹ שַׁלֵּ֣ם יְשַׁלֵּ֔ם אִם־אֵ֣ין ל֔וֹ וְנִמְכַּ֖ר בִּגְנֵבָתֽוֹ׃", "onk": "<b>אִם עֵינָא דְסָהֲדַיָא נְפָלַת עֲלוֹהִי<\/b> דְמָא לֵהּ שַׁלָמָא יְשַׁלֵם אִם לֵית לֵהּ וְיִזְדַבַּן בִּגְנֻבְתֵּהּ:", "onk_en": "If the sun shone on him [<b>eyes of witnesses fell upon him<\/b>], there is liability for his blood. He must make full restitution. If he does not have [the means to do so], he shall be sold [as a slave to pay] for his theft.", "pj": "אִין בָּרִיר פִּתְגָּמָא כְשִׁמְשָׁא דְּלָא לְמִיקְטוֹל נְפַשׁ עָאל וְקַטְלֵיהּ חוֹבַת שְׁפִיכוּת אֲדַם זַכְּאַי עֲלוֹי וְאִין אִישְׁתְּזִיב מִן יְדוֹי שַׁלָמָא יְשַׁלֵם אִין לֵית לֵיהּ מַה דִּמְשַׁלֵם וְיִזְדַּבֵּן לֵיהּ בֵּית דִּינָא מִן גְּנִיבוּתֵיהּ וְעַד שַׁתָּא דִשְׁמִיטְתָא", "pj_en": "If the thing be as clear as the sun that he was not entering to destroy life, and one hath killed him, the guilt of the shedding of innocent blood is upon him; and if spared from his hand, restoring he shall restore. If he have not wherewith to restore, the beth din shall sell him for his theft until the year of release.", "tj": "", "tj_en": "", "rashi": "<b>אם זרחה השמש עליו.<\/b> אֵין זֶה אֶלָּא כְמִין מָשָׁל: אִם בָּרוּר לְךָ הַדָּבָר שֶׁיֵּשׁ לוֹ שָׁלוֹם עִמְּךָ, כַּשֶּׁמֶשׁ הַזֶּה שֶׁהוּא שָׁלוֹם בָּעוֹלָם, כָּךְ פָּשׁוּט לְךָ שֶׁאֵינוֹ בָא לַהֲרֹג אֲפִלּוּ יַעֲמֹד בַּעַל הַמָּמוֹן כְּנֶגְדּוֹ, כְּגוֹן אָב הַחוֹתֵר לִגְנֹב מָמוֹן הַבֵּן, בְּיָדוּעַ שֶׁרַחֲמֵי הָאָב עַל הַבֵּן וְאֵינוֹ בָא עַל עִסְקֵי נְפָשׁוֹת (שם):<br><br><b>דמים לו.<\/b> כְּחַי הוּא חָשׁוּב, וּרְצִיחָה הִיא אִם יַהַרְגֶנוּ בַּעַל הַבַּיִת:<br><br><b>שלם ישלם.<\/b> הַגַּנָּב מָמוֹן שֶׁגָּנַב וְאֵינוֹ חַיָּב מִיתָה; וְאֻנְקְלוֹס שֶׁתִּרְגֵּם אִם עֵינָא דְּסַהֲדַיָּא נְפָלַת עֲלוֹהִי, לָקַח לוֹ שִׁטָּה אַחֶרֶת, לוֹמַר, שֶׁאִם מְצָאוּהוּ עֵדִים קֹדֶם שֶׁבָּא בַּעַל הַבַּיִת, וּכְשֶׁבָּא בַּעַל הַבַּיִת נֶגְדּוֹ הִתְרוּ בוֹ שֶׁלֹּא יַהַרְגֵהוּ, <b>דמים לו<\/b> – חַיָּב עָלָיו אִם הֲרָגוֹ, שֶׁמֵּאַחַר שֶׁיֵּשׁ רוֹאִים לוֹ, אֵין הַגַּנָּב הַזֶּה בָא עַל עִסְקֵי נְפָשׁוֹת, וְלֹא יַהֲרֹג אֶת בַּעַל הַמָּמוֹן:", "rashi_en": "אם זרחה השמש עליו IF THE SUN SHONE UPON HIM — This is only a metaphorical expression signifying: if the fact is clear to you that he is peaceably disposed towards you. The simile is: just as the sun brings peace (happiness) to the world so if it is evident to you that he did not come with the intention of killing, even if the owner of the property would resist him (Sanhedrin 72a), as, for instance, when a father breaks in to steal the money of his son, for it is certain that the father cherishes feelings of pity for his child and the matter of taking human life is not in his thoughts at all, — then<br><br>דמים לו, then he is to be regarded as a living man (cf. Rashi’s explanation of אין לו דמים v. 1.), and it is murder if the householder kills him.<br><br>שלם ישלם means the thief shall only restore the money he has stolen but is not subject to the death penalty. Onkelos who renders אם זרחה השמש עליו by, “If the eye of witnesses fall upon him” chose a different way of explaining the verse, namely, that if witnesses surprise him before the householder appears, and when the householder is going towards him they warn him not to kill him (the thief), then דמים לו, he is punishable if he kills him; for since there are people watching him the thief surely has no thought of taking human life and will not kill the owner of the property."}, {"ch": 22, "v": 3, "aliyah": 2, "heb": "אִֽם־הִמָּצֵא֩ תִמָּצֵ֨א בְיָד֜וֹ הַגְּנֵבָ֗ה מִשּׁ֧וֹר עַד־חֲמ֛וֹר עַד־שֶׂ֖ה חַיִּ֑ים שְׁנַ֖יִם יְשַׁלֵּֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִם אִשְׁתְּכָחָא יִשְׁתְּכַח בִּידֵהּ גְנֻבְתָּא מִתּוֹר עַד חֲמַר עַד אִמַר <b>כַּד אִנוּן חַיִין<\/b> עַל חַד תְּרֵין יְשַׁלֵם:", "onk_en": "If the stolen article is found in his hand [possession], whether it is an ox, donkey or sheep [<b>that is alive<\/b>], he must pay two live animals.", "pj": "אִין בְּסַהֲדַיָא מִשְׁתַּכְּחָא בִּרְשׁוּתֵיהּ גְּנִיבוּתֵיהּ מִן תּוֹר עַד חֲמוֹר עַד אִימַר כַּד הִינוּן קַיְימִין עַל חַד תְּרֵין יְשַׁלֵּם", "pj_en": "If before witnesses, the thing stolen was found in his possession, from an ox or an ass, unto a sheep alive, he shall restore two for one.", "tj": "", "tj_en": "", "rashi": "<b>המצא תמצא.<\/b> בִּרְשׁוּתוֹ, שֶׁלֹּא טָבַח וְלֹא מָכַר:<br><br><b>משור עד חמור.<\/b> כָּל דָּבָר בִּכְלַל תַּשְׁלוּמֵי כֶּפֶל, בֵּין שֶׁיֵּשׁ בּוֹ רוּחַ חַיִּים, בֵּין שֶׁאֵין בּוֹ רוּחַ חַיִּים, שֶׁהֲרֵי נֶאֱמַר בְּמִקְרָא אַחֵר \"עַל שֶׂה עַל שַׂלְמָה עַל כָּל אֲבֵדָה … יְשַׁלֵּם שְׁנַיִם לְרֵעֵהוּ\" (בבא קמא ס\"ב):<br><br><b>חיים שנים ישלם.<\/b> וְלֹא יְשַׁלֵּם לוֹ מֵתִים, אֶלָּא חַיִּים אוֹ דְּמֵי חַיִּים (מכילתא):", "rashi_en": "המצא תמצא IF THE THEFT BE CERTAINLY FOUND IN HIS HAND i. e. in his possession (Mekhilta), he having neither sold it nor slaughtered it he shall pay only double.<br><br>משור עד חמור WHETHER IT BE AN OX OR AN ASS — Every thing stolen whether it be animate or inanimate comes under the category of things for which two-fold compensation (“kefel”) must be made, for it is said in another verse, (8) “[for every matter of tresspass whether it be for ox, for ass…], for sheep, for raiment or for any lost thing … he shall pay double unto his fellow-man”(Bava Kamma 62b).<br><br>חיים שנים ישלם means, two living animals (חיים שנים) shall he pay and he shall not give dead animals in payment (Mekhilta) — but either living animals or the value of living animals."}, {"ch": 22, "v": 4, "aliyah": 3, "heb": "כִּ֤י יַבְעֶר־אִישׁ֙ שָׂדֶ֣ה אוֹ־כֶ֔רֶם וְשִׁלַּח֙ אֶת־<span class=\"mam-kq-trivial\">בְּעִירֹ֔ה<\/span> וּבִעֵ֖ר בִּשְׂדֵ֣ה אַחֵ֑ר מֵיטַ֥ב שָׂדֵ֛הוּ וּמֵיטַ֥ב כַּרְמ֖וֹ יְשַׁלֵּֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי יֹאכִיל גְבַר חֲקַל אוֹ כְרָם וִישַׁלַח יָת בְּעִירֵהּ וְיֵיכוּל בַּחֲקַל אָחֳרָן שְׁפַר חַקְלֵהּ וּשְׁפַר כַּרְמֵהּ יְשַׁלֵם:", "onk_en": "If he damages a field or vineyard with his animal—he lets his livestock loose, and [or] it feeds in another’s field—from his [own] prime field and prime vineyard he must compensate [the owner].", "pj": "אֲרוּם יִפְקַר גְּבַר חֲקִיל אוֹ כַּרְמָא וִישַׁלַח יַת בְּעִירֵיהּ וְיֵיכוּל בַּחֲקַל גְּבַר אוֹחֲרָן שְׁפַר חַקְלֵיהּ וּשְׁפַר כַּרְמֵיהּ יְשַׁלֵּם", "pj_en": "If a man break in upon a field or a vineyard, and send in his beast to feed in another man's field, the best of his field and the best of his vineyard he shall restore.", "tj": "", "tj_en": "", "rashi": "<b>כי יבער, את בעירה ובער.<\/b> כֻּלָּם לְשׁוֹן בְּהֵמָה, כְּמוֹ אֲנַחְנוּ וּבְעִירֵנוּ (במדבר כ'):<br><br><b>כי יבער.<\/b> יוֹלִיךְ בְּהֵמוֹתָיו בְּשָׂדֶה אוֹ בְכֶרֶם שֶׁל חֲבֵרוֹ, וְיַזִּיק אוֹתוֹ בְאַחַת מִשְּׁתֵי אֵלּוּ, אוֹ בְשִׁלּוּחַ בְּעִירוֹ אוֹ בְּבִעוּר, וּפֵרְשׁוּ רַבּוֹתֵינוּ \"וְשִׁלַּח\" הוּא נִזְקֵי מִדְרַךְ כַּף רֶגֶל, \"וּבִעֵר\" הוּא נִזְקֵי הַשֵּׁן, הָאוֹכֶלֶת וּמְבַעֶרֶת (בבא קמא ב'):<br><br><b>בשדה אחר.<\/b> בְּשָׂדֶה שֶׁל אִישׁ אַחֵר:<br><br><b>מיטב שדהו … ישלם.<\/b> שָׁמִין אֶת הַנֶּזֶק, וְאִם בָּא לְשַׁלֵּם לוֹ קַרְקַע דְּמֵי נִזְקוֹ, יְשַׁלֵּם לוֹ מִמֵּיטַב שְׂדוֹתָיו – אִם הָיָה נִזְקוֹ סֶלַע, יִתֵּן לוֹ שְׁוֵה סֶלַע מֵעִדִּית שֶׁיֵּשׁ לוֹ; לִמֶּדְךָ הַכָּתוּב שֶׁהַנְּזָקִין שָׁמִין לָהֶם בְּעִדִּית (מכילתא, בבא קמא ו'):", "rashi_en": "כי יבער … בעירה ובער All these terms are connected with the word בעיר which signifies “cattle”, as in (Numbers 20:4) אנחנו ובעירנו “we and our cattle\" .<br><br>כי יבער means accordingly, he takes his cattle into the field or the vineyard of his fellow-man and causes damage to him by one of these two ways: either by the mere fact that he lets his cattle go (tread) there (ושלח את בעירו), or by letting it graze there (ובער). Our Rabbis explained (Bava Kamma 2b), that ושלח refers to the damage done by “treading” (Rashi uses a Biblical phrase Deuteronomy 5:1. “treading of the hollow of the foot”) and ובער to the damage caused by the tooth that eats up and removes (מבערת) the crops (grazing).<br><br>בשדה אחר means בשדה של אחר IN THE FIELD OF ANOTHER MAN (not “in another field”, when it would be punctuated בְּשָׂדֶה, for בִּשְׁדֵה is the construct form).<br><br>מיטב שדהו … ישלם THE BEST OF HIS FIELD SHALL HE PAY — We assess the damage, and if the defendant proposes to make restitution to him for the damage he has suffered with “land’” then he has to pay him with the best of his fields. If for instance the damage amounted to a Sela he has to give him a Sela-worth of the best of the fields he possesses). Scripture teaches you that in cases of damages (which it is proposed to pay with land) we assess and collect them from the best land of the defendant (Mekhilta; Bava Kamma 6b)."}, {"ch": 22, "v": 5, "aliyah": 3, "heb": "כִּֽי־תֵצֵ֨א אֵ֜שׁ וּמָצְאָ֤ה קֹצִים֙ וְנֶאֱכַ֣ל גָּדִ֔ישׁ א֥וֹ הַקָּמָ֖ה א֣וֹ הַשָּׂדֶ֑ה שַׁלֵּ֣ם יְשַׁלֵּ֔ם הַמַּבְעִ֖ר אֶת־הַבְּעֵרָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי תִתַּפַּק נוּר וְיַשְׁכַּח כּוּבִין וְיֵיכוּל גְדִישִׁין אוֹ קֳמָא אוֹ חַקְלָא שַׁלָמָא יְשַׁלֵם דְאַדְלֵק יָת דְלֶקְתָּא:", "onk_en": "If a fire goes out of control and finds [catches on] thorns, and then consumes bound or standing grain or a field, full restitution must be made by the one who started the fire.", "pj": "אֲרוּם תִּתְפּוֹק נוּר וְתַשְׁכַּח כּוּבִין וְתִגְמַר גָּדִישׁ אוֹ מִדַּעַם דְּקָאִי אוֹ חֲקִיל שַׁלָמָא יְשַׁלִים מַאן דְּאַדְלִיק יַת דְּלֵיקְתָּא", "pj_en": "If fire break out, and catch thorns, and consume the sheaves, or whatever is standing, or the field, whoever kindled the fire shall surely restore.", "tj": "", "tj_en": "", "rashi": "<b>כי תצא אש.<\/b> אֲפִלּוּ מֵעַצְמָהּ (בבא קמא כ\"ב):<br><br><b>ומצאה קצים.<\/b> קרדו\"נש בְּלַעַז:<br><br><b>ונאכל גדיש.<\/b> שֶׁלִּחֲכָה בַּקּוֹצִים עַד שֶׁהִגִּיעָה לַגָּדִישׁ אוֹ לַקָּמָה הַמְחֻבֶּרֶת בַּקַּרְקַע:<br><br><b>או השדה.<\/b> שֶׁלִּחֲכָה אֶת נִירוֹ וְצָרִיךְ לָנִיר אוֹתָהּ פַּעַם שְׁנִיָּה (בבא קמא ס'):<br><br><b>שלם ישלם המבער.<\/b> אַעַ\"פִּ שֶׁהִדְלִיק בְּתוֹךְ שֶׁלּוֹ, וְהִיא יָצְאָה מֵעַצְמָהּ עַל יְדֵי קוֹצִים שֶׁמָּצְאָה, חַיָּב לְשַׁלֵּם, לְפִי שֶׁלֹּא שָׁמַר אֶת גַּחַלְתּוֹ שֶׁלֹּא תֵצֵא וְתַזִּיק:", "rashi_en": "כי תצא אש IF A FIRE GOETH FORTH — i. e. even if it goeth forth (extends) by itself (Bava Kamma 24b) from the field in which it has been lit into another persons field.<br><br>ומצאה קוצים AND CATCH IN THORNS —chardons in old French<br><br>ונאכל גדיש SO THAT THE STACKS OF CORN [OR THE STANDING CORN] BE CONSUMED, because it (the fire) licked up the thorns and gradually reached the stacks of corn or the standing corn, i. e. corn that is still attached to the ground.<br><br>או השדה OR THE FIELD — because it (the fire) liked up his furrow (the newly broken soil), so that it became hard and he (the owner) has to plough it again (Bava Kamma 60a).<br><br>שלם ישלם המבער HE THAT KINDLED [THE CONFLAGRATION] SHALL SURELY PAY — Although he has lit the fire on his own soil and it extended by itself through the thorns which it came across, he has to make restitution because he did not guard his fire (lit., burning coals) that it should not extend and cause damage."}, {"ch": 22, "v": 6, "aliyah": 3, "heb": "כִּֽי־יִתֵּן֩ אִ֨ישׁ אֶל־רֵעֵ֜הוּ כֶּ֤סֶף אֽוֹ־כֵלִים֙ לִשְׁמֹ֔ר וְגֻנַּ֖ב מִבֵּ֣ית הָאִ֑ישׁ אִם־יִמָּצֵ֥א הַגַּנָּ֖ב יְשַׁלֵּ֥ם שְׁנָֽיִם׃", "onk": "אֲרֵי יִתֵּן גְבַר לְחַבְרֵהּ כְּסַף אוֹ מָנִין לְמִטַר וְיִתְגַנְבוּן מִבֵּית גַבְרָא אִם יִשְׁתְּכַח גַנָבָא יְשַׁלֵם עַל חַד תְּרֵין:", "onk_en": "If a man gives his neighbor money or articles to safeguard and they are stolen from the house of the [watch]man, if the thief is found, he must pay double.", "pj": "אֲרוּם יִתֵּן גְּבַר לְחַבְרֵיהּ כְּסַף אוֹ מָאנִין לְמִנְטַר בְּלָא אֲגַר נְטִיר וּמִתְגַנְבִין מִן בֵּית גְּבַר אִין מִשְׁתְּכַּח גַּנְבָא אִיהוּ מְשַׁלֵּם עַל חַד תְּרֵין", "pj_en": "When a man confideth to his neighbour silver, or vessels to keep, without recompense for the care, and they be stolen from the man's house,", "tj": "", "tj_en": "", "rashi": "<b>וגנב מבית האיש.<\/b> לְפִי דְבָרָיו (שם ס\"ג):<br><br><b>אם ימצא הגנב ישלם.<\/b> הַגַּנָּב <b>שנים<\/b> לַבְּעָלִים:", "rashi_en": "וגנב מבית האיש AND IT BE STOLEN OUT OF THE MAN’S HOUSE — i. e. according to his statement),<br><br>אם ימצה הגנב ישלם IF THE THIEF BE FOUND HE — the thief — SHALL PAY שנים DOUBLE to the owner (to the bailor not to the bailee) (Bava Kamma 63b)."}, {"ch": 22, "v": 7, "aliyah": 3, "heb": "אִם־לֹ֤א יִמָּצֵא֙ הַגַּנָּ֔ב וְנִקְרַ֥ב בַּֽעַל־הַבַּ֖יִת אֶל־הָֽאֱלֹהִ֑ים אִם־לֹ֥א שָׁלַ֛ח יָד֖וֹ בִּמְלֶ֥אכֶת רֵעֵֽהוּ׃", "onk": "אִם לָא יִשְׁתְּכַח גַנָבָא וְיִתְקָרֵב מָרֵי דְבֵיתָא לִקֳדָם דַיָנַיָא אִם לָא אוֹשִׁיט יְדֵהּ <b>בְּמָא דִמְסַר לֵהּ חַבְרֵהּ<\/b>:", "onk_en": "If the thief is not found, the owner of the house [the watchman] must come before the judges [Beis Din], [to swear] that he did not lay a hand on his neighbor’s possessions [for his personal use] [<b>that which his neighbor handed over to him<\/b>].", "pj": "אִין לָא אִישְׁתַּכַּח גַּנְבָא וְיִתְקְרֵיב מָרֵיהּ בֵּיתָא לִקְדָם דַּיָינַיָא וְיוֹמֵי דְלָא אוֹשִׁיט יְדֵיהּ בְּעִיסְקָא דְחַבְרֵיהּ", "pj_en": "if the thief be found, he shall restore two for one. If the thief be not found, the master of the house shall be brought before the judges, and shall swear that he hath not put forth his own hand upon the property of his neighbour.", "tj": "", "tj_en": "", "rashi": "<b>אם לא ימצא הגנב.<\/b> וּבָא הַשּׁוֹמֵר הַזֶּה, שֶׁהוּא בַּעַל הַבַּיִת:<br><br><b>ונקרב.<\/b> אֶל הַדַּיָּנִין, לָדוּן עִם זֶה וְלִשָּׁבַע לוֹ שֶׁלֹּא שָׁלַח יָדוֹ בְּשֶׁלּוֹ (שם):", "rashi_en": "אם לא ימצא הגנב IF THE THIEF BE NOT FOUND then this bailee — who is בעל הבית “the owner of the house” for the time being (since the bailment is then in his possession although he is not really its owner) — shall come.<br><br>ונקרב אל AND SHALL APPROACH UNTO THE אלהים — the judges, to put his case against the other and to swear unto him that he has not put forth his hands against his property (Bava Kamma 63b)."}, {"ch": 22, "v": 8, "aliyah": 3, "heb": "עַֽל־כׇּל־דְּבַר־פֶּ֡שַׁע עַל־שׁ֡וֹר עַל־חֲ֠מ֠וֹר עַל־שֶׂ֨ה עַל־שַׂלְמָ֜ה עַל־כׇּל־אֲבֵדָ֗ה אֲשֶׁ֤ר יֹאמַר֙ כִּי־ה֣וּא זֶ֔ה עַ֚ד הָֽאֱלֹהִ֔ים יָבֹ֖א דְּבַר־שְׁנֵיהֶ֑ם אֲשֶׁ֤ר יַרְשִׁיעֻן֙ אֱלֹהִ֔ים יְשַׁלֵּ֥ם שְׁנַ֖יִם לְרֵעֵֽהוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עַל כָּל פִּתְגַם דְחוֹב עַל תּוֹר עַל חֲמַר עַל אִמָר עַל כְּסוּ עַל כָּל אֲבֶדְתָּא דִי יֵימַר אֲרֵי הוּא דֵין לִקֳדָם דַיָנַיָא יֵיעוֹל דִין תַּרְוֵיהוֹן דִי יְחַיְבוּן דַיָנַיָא יְשַׁלֵם עַל חַד תְּרֵין לְחַבְרֵהּ:", "onk_en": "In every question of dishonesty whether it involves an ox, a donkey, a sheep, a garment, or anything that was [allegedly] lost of which [a witness] says, “This is it!” the claims of both parties must be brought to [<b>before<\/b>] the judges. The one whom the judges find guilty, must pay double restitution to his neighbor.", "pj": "עַל כָּל מִדַּעַם דְּאִתְּבִיר בְּכוּסְיָא עַל תּוֹר עַל חֲמוֹר עַל אִימַר עַל כְּסוּי עַל כָּל אֲבִידְתָּא יוֹמֵי כַּד יֵימַר אֲרוּם הוּא דֵין וְכַד מִשְׁתַּכְּחָא גְנִיבוּתָא בָּתַר כֵּן בְּיַד גַּנָבָא קֳדָם דַּיָינַיָא יוֹעִיל דִּין תַּרְוֵויהוֹם דִּין מָרֵיהּ דְּבֵיתָא וְדִין גַּנְבָא וּלְמַאן דִּמְחַיְיבִין דַּיָינַיָא יְשַׁלֵּם גַּנְבָא עַל חַד תְּרֵין לְחַבְרֵיהּ", "pj_en": "And about whatever is injured covertly, whether ox, or ass, or sheep, or raiment, of whatever is (so) lost, he shall make oath when he saith that so it is; and when the thing stolen shall be afterward found in the hand of the thief, the cause of both shall be brought before the judges, the cause of the householder and the cause of the thief; and whom the judges shall condemn, the thief shall restore twofold to his neighbour.", "tj": "", "tj_en": "", "rashi": "<b>על כל דבר פשע.<\/b> שֶׁיִּמָּצֵא שַׁקְרָן בִּשְׁבוּעָתוֹ – שֶׁיָּעִידוּ עֵדִים שֶׁהוּא עַצְמוֹ גְּנָבוֹ – וְיַרְשִׁיעוּהוּ אֱלֹהִים עַל פִּי הָעֵדִים.<br><br><b>ישלם שנים לרעהו.<\/b> לִמֶּדְךָ הַכָּתוּב, שֶׁהַטּוֹעֵן בְּפִקָּדוֹן לוֹמַר נִגְנַב הֵימֶנּוּ, וְנִמְצָא שֶׁהוּא עַצְמוֹ גְּנָבוֹ, מְשַׁלֵּם תַּשְׁלוּמֵי כֶּפֶל; וְאֵימָתַי? בִּזְמַן שֶׁנִּשְׁבַּע וְאַחַ\"כָּ בָּאוּ עֵדִים, שֶׁכָּךְ דָּרְשׁוּ רַבּוֹתֵינוּ: וְנִקְרַב בַּעַל הַבַּיִת אֶל הָאֱלֹהִים, קְרִיבָה זוֹ שְׁבוּעָה הִיא, אַתָּה אוֹמֵר לִשְׁבוּעָה אוֹ אֵינוֹ אֶלָּא לַדִּין, שֶׁכֵּיוָן שֶׁבָּא לַדִּין וְכָפַר לוֹמַר נִגְנְבָה, מִיָּד יִתְחַיֵּב כֶּפֶל אִם בָּאוּ עֵדִים שֶׁהוּא בְיָדוֹ? נֶאֱמַר כָּאן שְׁלִיחוּת יָד וְנֶאֱמַר לְמַטָּה שְׁלִיחוּת יָד – שְׁבוּעַת ה' תִּהְיֶה בֵּין שְׁנֵיהֶם אִם לֹא שָׁלַח יָדוֹ – מַה לְּהַלָּן שְׁבוּעָה, אַף כָּאן שְׁבוּעָה (שם):<br><br><b>אשר יאמר כי הוא זה.<\/b> לְפִי פְשׁוּטוֹ אֲשֶׁר יֹאמַר הָעֵד כִּי הוּא זֶה שֶׁנִּשְׁבַּעְתָּ עָלָיו, הֲרֵי הוּא אֶצְלְךָ, עַד הַדַּיָּנִין יָבֹא דְּבַר שְׁנֵיהֶם, וְיַחְקְרוּ אֶת הָעֵדִים, אִם כְּשֵׁרִים הֵם וְיַרְשִׁיעוּהוּ לְשׁוֹמֵר זֶה, יְשַׁלֵּם שְׁנַיִם, וְאִם יַרְשִׁיעוּ אֶת הָעֵדִים, שֶׁנִּמְצְאוּ זוֹמְמִין, יְשַׁלְּמוּ הֵם שְׁנַיִם לַשּׁוֹמֵר. וְרַבּוֹתֵינוּ זִ\"לִ דָּרְשׁוּ כִּי הוּא זֶה לְלַמֵּד, שֶׁאֵין מְחַיְּבִין אוֹתוֹ שְׁבוּעָה אֶלָּא אִם כֵּן הוֹדָה בְּמִקְצָת, לוֹמַר כָּךְ וְכָךְ אֲנִי חַיָּב לְךָ, וְהַמּוֹתָר נִגְנַב מִמֶּנִּי (שם ק\"ז):", "rashi_en": "על כל דבר פשע FOR ALL MANNER OF TRESSPASS in which he (the bailee) is proved a liar in respect of his oath (i. e. is convicted of perjury), because witnesses testify that he himself has stolen it and the judges condemn him on the evidence of the witnesses,<br><br>ישלם שנים לרעהו HE SHALL PAY THE DOUBLE TO HIS FELLOW-MAN — Scripture teaches you that in a case of a bailment where one pleads that it has been stolen from him and it is proved that he himself has stolen it he is liable to pay “kefel” (twice the value of the article) to the owner. When, however, does this law hold good? In the case that he has taken an oath that it has been stolen from him and witnesses afterwards appear and testify to the contrary. For our Rabbis expound this phrase as follows: (Bava Kamma 63b) “and the owner of the house shall approach unto the judges” — this “approaching the judges” is an expression signifying the taking of an oath. You say that it means approaching the judges in order to take an oath, but perhaps this is not so, and it means that he approaches them to put his case, and that the meaning of the verse is. that as soon as the bailee appears before the court and denies any liability, saying, “it has been stolen” from me, he at once becomes liable to pay double if witnessess appear who testify that the bailment is still in his possession? You certainly cannot argue thus! For “conversion” (שליחות יד) is mentioned here and later on (v. 10) it is mentioned again: “Then shall the oath of the Lord be between the two of them, if he hath not put his hand (אם לא שלח ידו) unto his fellow-man’s goods”. — Now, what is the meaning of the phrase in the latter case? It is evident from what precedes it that it is a matter of taking an oath! So also here it is a matter of taking an oath. (Bava Kamma 63b).<br><br>אשר יאמר כי הוא זה means, according to the literal sense, any article about which the witness will say: “this is the very article” about which you have taken an oath that it has been stolen from you; see, it is actually in your possession! — then the matter of dispute between the two of them shall come before the judges. These shall examine the witnesses, and if they prove to be trustworthy and they (the judges) condemn this bailee, then he has to pay double. If, however, they condemn the witnesses because these are found to be “plotting” witnesses (זוממין) then shall they (the witnesses) pay double to the bailee. Our Rabbis, of blessed memory, however, explained that כי הוא זה tells us that no oath can be imposed upon him (the defendant) except if he admits a part of the other’s claim asserting, “So-and-so much I owe you, and the rest has been stolen from me” (according to this explanation the phrase כי הוא זה is not a statement of the witnesses but that of the bailee himself; i. e. he says, כי הוא זה, “it is this only” that you have to claim and not as much as you say) (Bava Kamma 107b)."}, {"ch": 22, "v": 9, "aliyah": 3, "heb": "כִּֽי־יִתֵּן֩ אִ֨ישׁ אֶל־רֵעֵ֜הוּ חֲמ֨וֹר אוֹ־שׁ֥וֹר אוֹ־שֶׂ֛ה וְכׇל־בְּהֵמָ֖ה לִשְׁמֹ֑ר וּמֵ֛ת אוֹ־נִשְׁבַּ֥ר אוֹ־נִשְׁבָּ֖ה אֵ֥ין רֹאֶֽה׃", "onk": "אֲרֵי יִתֵּן גְבַר לְחַבְרֵהּ חֲמַר אוֹ תוֹר אוֹ אִמָר וְכָל בְּעִירָא לְמִטָר וּמִית אוֹ אִתְּבַר אוֹ אִשְׁתְּבִי לֵית דְחָזֵי:", "onk_en": "If a man gives his neighbor, a donkey, an ox, a sheep, or any animal for safeguarding; and it dies, or is injured, or is captured, and there is no eyewitness,", "pj": "אֲרוּם יִתֵּן גְּבַר לְחַבְרֵיהּ חֲמוֹר אוֹ תּוֹר אוֹ אִימַר וְכָל בְּעִירָא לְמִנְטוֹר בְּלָא אֲגַר נְטִיר וִימוּת אוֹ אִיתְבִיר מִן חֵיוָא אוֹ אִישְׁתְּבֵי וְלֵית סָהִיד חָמֵי וּמַסְהִיד", "pj_en": "If a man deliver to his neighbour all ox, or a sheep, or any animal to keep, (if) he is to keep it without recompense, and it die, or be torn by wild beast, or be carried off, and no witness seeing who can testify it;", "tj": "", "tj_en": "", "rashi": "<b>כי יתן איש אל רעהו חמור או שור.<\/b> פָּרָשָׁה רִאשׁוֹנָה נֶאֶמְרָה בְּשׁוֹמֵר חִנָּם, לְפִיכָךְ פָּטַר בּוֹ אֶת הַגְּנֵבָה, כְּמוֹ שֶׁנֶּאֱמַר (פסוק ו) וְגֻנַּב מִבֵּית הָאִישׁ, אִם לֹא יִמָּצֵא הַגַּנָּב וְנִקְרַב בַּעַל הַבַּיִת לִשְׁבוּעָה, לָמַדְתָּ שֶׁפּוֹטֵר עַצְמוֹ בִּשְׁבוּעָה זוֹ. וּפָרָשָׁה זוֹ אֲמוּרָה בְּשׁוֹמֵר שָׂכָר, לְפִיכָךְ אֵינוֹ פָּטוּר אִם נִגְנְבָה, כְּמוֹ שֶׁכָּתוּב (פסוק יא) אִם גָּנֹב יִגָּנֵב מֵעִמּוֹ יְשַׁלֵּם, אֲבָל עַל הָאֹנֶס, כְּגוֹן מֵת מֵעַצְמוֹ, אוֹ נִשְׁבַּר אוֹ נִשְׁבָּה בְּחָזְקָה עַל יְדֵי לִסְטִים, וְאֵין רוֹאֶה שֶׁיָּעִיד בַּדָּבָר:", "rashi_en": "כי יתן איש אל רעהו חמור או שור IF A MAN GIVE UNTO HIS FELLOW-MAN AN ASS OR AN OX — The first section (v. 6—9) speaks of the gratuitous bailee and therefore (since the chattels are kept for the use of the bailor only) Scripture frees him of liability for theft, as it is written, (v. 6) “[If a man shall give … to keep] and it be stolen out of the man’s house, if the thief be not found, then the owner of the house shall approach the judges” to take an oath (cf. Rashi v. 7). You may learn from this that he (the bailee) frees himself from liability by this oath. This section (v. 9—12), however, speaks of a “bailee for payment” (שומר שכר) who is therefore not free from liability if the object has been stolen, as it is written, “but if it be certainly stolen from him, he shall pay [unto the owner thereof]” (Bava Metzia 94b). However, for any loss over which he has no control — if, for instance, the animal died a natural death or has been injured by a wild beast, or forcibly seized by robbers, and אין רואה NO ONE SEEING IT that could testify in this matter"}, {"ch": 22, "v": 10, "aliyah": 3, "heb": "שְׁבֻעַ֣ת יְהֹוָ֗ה תִּהְיֶה֙ בֵּ֣ין שְׁנֵיהֶ֔ם אִם־לֹ֥א שָׁלַ֛ח יָד֖וֹ בִּמְלֶ֣אכֶת רֵעֵ֑הוּ וְלָקַ֥ח בְּעָלָ֖יו וְלֹ֥א יְשַׁלֵּֽם׃", "onk": "מוֹמָתָא דַיְיָ תְּהֵי בֵּין תַּרְוֵיהוֹן אִם לָא אוֹשִׁיט יְדֵהּ בְּמָא דִמְסַר לֵהּ חַבְרֵהּ וִיקַבֵּל מָרֵהּ מִנֵהּ מוֹמָתָא וְלָא יְשַׁלֵם:", "onk_en": "an oath to Adonoy shall be between them, that he [the watcher] did not lay his hand on his neighbor’s possession [for his personal use] [<b>that which his neighbor handed over to him<\/b>]. The owner must accept it [the oath], and [the watcher] need not make restitution.", "pj": "מוֹמָתָא דַיְיָ תְּהֵי בֵּין תַּרְוֵיהוֹם יוֹמֵי דְלָא אוֹשִׁיט יְדֵיהּ בְּעִיסְקָא דְחַבְרֵיהּ וִיקַבֵּל מָארֵיהּ מִנֵיהּ מוֹמָתָא וְלָא יְשַׁלֵּם", "pj_en": "an oath of the Lord shall be between them both, that he hath not put forth his hand upon the property of his neighbour; and the owner of the thing shall accept his oath, and he shall not (be required to) make it good.", "tj": "", "tj_en": "", "rashi": "<b>שבעת ה' תהיה.<\/b> יִשָּׁבַע שֶׁכֵּן הוּא כִדְבָרָיו, וְהוּא לֹא שָׁלַח בָּהּ יָד לְהִשְׁתַּמֵּשׁ בָּהּ לְעַצְמוֹ, שֶׁאִם שָׁלַח בָּהּ יָד וְאַחַ\"כָּ נֶאֶנְסָה, חַיָּב בָּאֳנָסִים (בבא מציעא צ\"ד):<br><br><b>ולקח בעליו.<\/b> הַשְּׁבוּעָה:<br><br><b>ולא ישלם.<\/b> לוֹ הַשּׁוֹמֵר כְּלוּם (בבא קמא ק\"ו):", "rashi_en": "שבעת ה׳ תהיה THEN SHALL THE OATH OF THE LORD BE BETWEEN THEM BOTH — i. e. he (the bailee) must take an oath that the case was as he says (that it died or was injured or captured), and also that he had not previously put forth his hand against it (the object), using it for his own purposes. For if he had thus “put forth his hand” and afterwards some accident, as described, happened to it he is held liable for loss by accident (Bava Metzia 94b), since he has broken the terms of the contract. —<br><br>ולקח בעליו AND THE OWNER OF IT SHALL ACCEPT IT — i. e. shall accept the oath (Bava Kamma 106a),<br><br>ולא ישלם AND HE — the bailee — SHALL NOT PAY HIM (the bailor) anything, not even the capital (קרן)."}, {"ch": 22, "v": 11, "aliyah": 3, "heb": "וְאִם־גָּנֹ֥ב יִגָּנֵ֖ב מֵעִמּ֑וֹ יְשַׁלֵּ֖ם לִבְעָלָֽיו׃", "onk": "וְאִם אִתְגְנָבָא יִתְגְנֵב מֵעִמֵהּ יְשַׁלֵם לְמָרוֹהִי:", "onk_en": "But if it was indeed stolen from him, he must make restitution to its owner.", "pj": "וְאִין יִתְגַנְבָא יִתְגַנֵּב מִנֵיהּ דַּהֲוָה לֵיהּ עִמֵּיהּ אֲגַר נְטִיר יְשַׁלֵם לְמָרוֹי", "pj_en": "But if it be stolen from him who was to receive recompense for the care, he shall make it good to its owner.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 12, "aliyah": 3, "heb": "אִם־טָרֹ֥ף יִטָּרֵ֖ף יְבִאֵ֣הוּ עֵ֑ד הַטְּרֵפָ֖ה לֹ֥א יְשַׁלֵּֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אִם אִתְּבָרָא יִתְּבַר יַיְתִי סַהֲדִין <b>דִתְבִירָא<\/b> לָא יְשַׁלֵם:", "onk_en": "If it was torn apart [killed by wild beasts], he [the watcher] must provide witnesses [<b>that is was torn apart<\/b>]. He then need not pay for that which was torn apart.", "pj": "אִין אִתְבְּרָא יִתְבַּר מִן חֵיוַת בְּרָא מַיְיתֵי לֵיהּ סַהֲדִין אוֹ יַמְטִינֵיהּ עֵד גּוּפָא דִתְבִיר לָא יְשַׁלֵּם", "pj_en": "If it hath been torn by a wild beast, let him bring witnesses, or bring him to the carcase: because for that which is (so) torn he shall not make restitution.", "tj": "אִם יִתְקְטָלָא יִתְקְטֵיל יֵיתֵי לֵיהּ מִן אֵיבָרוֹי סָהַד קְטִילָא לָא יְשַׁלֵּם:", "tj_en": "If it hath been really killed, he shall bring of its members, as a testimony, and for that which is killed he shall not make restitution.", "rashi": "<b>אם טרף יטרף.<\/b> עַ\"יְ חַיָּה רָעָה:<br><br><b>יביאהו עד.<\/b> יָבִיא עֵדִים שֶׁנִּטְרְפָה בְאֹנֶס וּפָטוּר:<br><br><b>הטרפה לא ישלם.<\/b> אֵינוֹ אוֹמֵר טְרֵפָה לֹא יְשַׁלֵּם אֶלָּא הַטְּרֵפָה, יֵשׁ טְרֵפָה שֶׁהוּא מְשַׁלֵּם וְיֵשׁ טְרֵפָה שֶׁאֵינוֹ מְשַׁלֵּם; טְרֵפַת חָתוּל וְשׁוּעָל וּנְמִיָּה מְשַׁלֵּם, טְרֵפַת זְאֵב, אֲרִי, וְדֹב וְנָחָשׁ אֵינוֹ מְשַׁלֵּם; וּמִי לְחָשְׁךָ לָדוּן כֵּן? שֶׁהֲרֵי כָתוּב וּמֵת אוֹ נִשְׁבַּר אוֹ נִשְׁבָּה – מַה מִּיתָה שֶׁאֵין יָכוֹל לְהַצִּיל, אַף שֶׁבֶר וְשִׁבְיָה שֶׁאֵין יָכוֹל לְהַצִּיל (מכילתא):", "rashi_en": "אם טרף יטרף IF IT BE TORN IN PIECES — by wild beasts.<br><br>יביאהו עד THEN LET HIM BRING WITNESSES that it has been torn in pieces by accident and he shall be freed from liability.<br><br>הטרפה לא ישלם HE SHALL NOT PAY THAT WHICH HAS BEEN TORN — It does not say טרפה לא ישלם “one which has been torn he shall not pay for” — but it says “the torn one”, (the one mentioned here, viz., that which was torn without him being able to prevent it). Because there is a torn beast for which he has to pay and a torn beast for which he has not to pay. For an animal torn by a cat, a fox or a marten he has indeed to make restitution; but for one torn by a wolf, a lion, a bear or a serpent he is not liable to pay. But how do you come to make such a distinction (lit., who whispered to you to draw such a conclusion)? Because, you see, it states, “and if it die or be injured, or be captured”. Now what is the characteristic of natural death? One cannot save from it! Thus, also, the injury and the capture must be such that he was unable to save the animal from it (cf. Mekhilta)."}, {"ch": 22, "v": 13, "aliyah": 3, "heb": "וְכִֽי־יִשְׁאַ֥ל אִ֛ישׁ מֵעִ֥ם רֵעֵ֖הוּ וְנִשְׁבַּ֣ר אוֹ־מֵ֑ת בְּעָלָ֥יו אֵין־עִמּ֖וֹ שַׁלֵּ֥ם יְשַׁלֵּֽם׃", "onk": "וַאֲרֵי יִשְׁאַל גְבַר מִן חַבְרֵהּ וְיִתְּבַר אוֹ מִית מָרֵהּ לֵית עִמֵהּ שַׁלָמָא יְשַׁלֵם:", "onk_en": "If a man borrows something from his neighbor, and it becomes broken or dies; if the owner is not [involved] with him, he [the borrower] must make full restitution.", "pj": "וַאֲרוּם יִשְׁאַל גְּבַר מִדַּעַם מִן חַבְרֵיהּ וְיִתְבַּר מָנָא אוֹ מִית בְּעִירָא מָרֵיהּ לֵית עִמֵּיהּ שַׁלָּמָא יְשַׁלֵּם", "pj_en": "And if a man borrow anything of his neighbour, and the vessel be broken, or the animal die, and the owner be not with it, lie shall certainly make it good.", "tj": "", "tj_en": "", "rashi": "<b>וכי ישאל.<\/b> בָּא לְלַמֵּד עַל הַשּׁוֹאֵל שֶׁהוּא חַיָּב בָּאֳנָסִין:<br><br><b>בעליו אין עמו.<\/b> אִם בְּעָלָיו שֶׁל שׁוֹר אֵינוֹ עִם הַשּׁוֹאֵל בִּמְלַאכְתּוֹ (בבא מציעא צ\"ה):", "rashi_en": "וכי ישאל איש AND IF A MAN BORROWS — The purpose of this verse is to tell you that the borrower is liable for loss from whatever cause even from accident.<br><br>בעליו אין עמו THE OWNER THEREOF NOT BEING WITH IT (lit., with “him”) — i. e. if the owner of the ox is not employed with the borrower in his work (Bava Metzia 95b)."}, {"ch": 22, "v": 14, "aliyah": 3, "heb": "אִם־בְּעָלָ֥יו עִמּ֖וֹ לֹ֣א יְשַׁלֵּ֑ם אִם־שָׂכִ֣יר ה֔וּא בָּ֖א בִּשְׂכָרֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִם מָרֵהּ עִמֵהּ לָא יְשַׁלֵם אִם אֲגִירָא הוּא עַל בְּאַגְרֵהּ:", "onk_en": "If the owner is [involved] with him, then he [the borrower] need not make restitution. If it was hired, it [the ox] comes in its rental price.", "pj": "אִין מָרֵיהּ עִמֵּיהּ לָא יְשַׁלֵּם אִין אֲגִירָא הוּא עָאֵל פְּסֵידֵיהּ בְּאַגְרֵיהּ", "pj_en": "If the owner be with it, he shall not make it good: if it had been lent for profit, its loss came on account of its hire.", "tj": "", "tj_en": "", "rashi": "<b>אם בעליו עמו.<\/b> בֵּין שֶׁהוּא בְּאוֹתָהּ מְלָאכָה בֵּין שֶׁהוּא בִמְלָאכָה אַחֶרֶת, הָיָה עִמּוֹ בִּשְׁעַת שְׁאֵלָה אֵינוֹ צָרִיךְ לִהְיוֹת עִמּוֹ בִּשְׁעַת שְׁבִירָה וּמִיתָה (שם):<br><br><b>אם שכיר הוא.<\/b> אִם הַשּׁוֹר אֵינוֹ שָׁאוּל אֶלָּא שָׂכוּר, בָּא בִּשְׂכָרוֹ לְיַד הַשּׂוֹכֵר הַזֶּה, וְלֹא בִשְׁאֵלָה, וְאֵין כָּל הֲנָאָה שֶׁלּוֹ, שֶׁהֲרֵי עַ\"יְ שְׂכָרוֹ נִשְׁתַּמֵּשׁ, וְאֵין לוֹ מִשְׁפַּט שׁוֹאֵל לְהִתְחַיֵּב בָּאֳנָסִין; וְלֹא פֵּרֵשׁ מַה דִּינוֹ, אִם כְּשׁוֹמֵר חִנָּם אוֹ כְשׁוֹמֵר שָׂכָר, לְפִיכָךְ נֶחְלְקוּ בוֹ חַכְמֵי יִשְׂרָאֵל שׂוֹכֵר כֵּיצַד מְשַׁלֵּם, רַבִּי מֵאִיר אוֹמֵר כְּשׁוֹמֵר חִנָּם, רַ' יְהוּדָה אוֹמֵר כְּשׁוֹמֵר שָׂכָר (בבא מציעא צ\"ה):", "rashi_en": "אם בעליו עמו BUT IF THE OWNER THEREOF BE WITH IT (lit., with “him”) — whether he be employed in the very kind of work for which the animal has been borrowed, or whether he be employed in any other work of the borrower — provided that he (the owner) was employed by the borrower when the loan was effected it is not necessary, in order to free him from restitution that he should be employed by the bailee at the time when the injury or death took place (Bava Metzia 95b).<br><br>אם שכיר הוא IF IT BE HIRED — i. e. if the ox has not been borrowed but hired, בא בשכרו THEN IT CAME FOR ITS HIRE into the hand of this hirer and not by way of loan. For he does not get the entire benefit of the transaction since he is using it only because he has paid hire for it and consequently the owner benefits also; therefore the law applicable to a borrower does not apply in his case — that he should be held liable for loss by accident. Scripture, however, does not state explicity what his (the hirer’s) law actually is — whether he has to be treated as the gratuitous bailee (שומר חנם) or as the bailee for payment (שומר שכר), and therefore the Sages in Israel differ in their opinion as to how the hirer (שוכר) has to make restitution. R. Meir says he is responsible only as a gratuitous bailee, whilst R. Judah says, even as a bailee for payment (Bava Metzia 80b)."}, {"ch": 22, "v": 15, "aliyah": 3, "heb": "וְכִֽי־יְפַתֶּ֣ה אִ֗ישׁ בְּתוּלָ֛ה אֲשֶׁ֥ר לֹא־אֹרָ֖שָׂה וְשָׁכַ֣ב עִמָּ֑הּ מָהֹ֛ר יִמְהָרֶ֥נָּה לּ֖וֹ לְאִשָּֽׁה׃", "onk": "וַאֲרֵי יְשַׁדֵל גְבַר בְתֻלְתָּא דִּי לָא מְאַרְסָא וְיִשְׁכּוּב עִמַהּ <b>קַיָמָא יְקַיְמִנַהּ<\/b> לֵהּ לְאִנְתּוּ:", "onk_en": "If a man seduces a virgin who is not betrothed, and lies with her; he must give the dowry to acquire [<b>establish<\/b>] her as his wife.", "pj": "וַאֲרוּם יְשַׁרְגֵג גְּבַר בְּתוּלְתָּא דְלָא מְאַרְסָא וִישַׁמֵּשׁ עִמָּהּ מַפְרָנָא יַפְרִין יָתָהּ לֵיהּ לְאִינְתּוּ", "pj_en": "If a man seduce a virgin unbetrothed, and have criminal conduct with her, endowing, he shall endow her to be his wife.", "tj": "אֲרוּם יְשַׁרְגֵג גְּבַר בְּתוּלָה דְלָא אַרְסַת וִישַׁמֵּשׁ עִמָּהּ מַפְרָנָא יִפְרָן לֵיהּ לְאִתָּא:", "tj_en": "If a man seduce a virgin, unbetrothed, and have criminal conduct with her, endowing, he shall endow her to be a wife.", "rashi": "<b>וכי יפתה.<\/b> מְדַבֵּר עַל לִבָּהּ עַד שֶׁשּׁוֹמַעַת לוֹ, וְכֵן תַּרְגּוּמוֹ וַאֲרֵי יְשַׁדֵּל, שִׁדּוּל בִּלְשׁוֹן אֲרַמִּי כְּפִתּוּי בִּלְשׁוֹן עִבְרִי:<br><br><b>מהר ימהרנה.<\/b> יִפְסֹק לָהּ מֹהַר כְּמִשְׁפַּט אִישׁ לְאִשְׁתּוֹ – שֶׁכּוֹתֵב לָהּ כְּתֻבָּה וְיִשָּׂאֶנָּה (מכילתא):", "rashi_en": "וכי יפתה AND IF A MAN ENTICE [A VIRGIN] — i. e. if he speaks kindly to her until she submits to him. Thus does also the Targum take it: ארי ישדל “if a man persuades”, the root שדל (the Pael conjugation) in Aramaic being the equivalent of פִּתָּה in Hebrew.<br><br>מהר ימהרנה HE SHALL SURELY GIVE HER THE MARRIAGE PRICE — He shall assign her a marriage portion as is the practice of a man to do to his wife, i. e. he shall write her a Ketuba (marriage contract providing for a marriage portion) and shall marry her (Mekhilta)."}, {"ch": 22, "v": 16, "aliyah": 3, "heb": "אִם־מָאֵ֧ן יְמָאֵ֛ן אָבִ֖יהָ לְתִתָּ֣הּ ל֑וֹ כֶּ֣סֶף יִשְׁקֹ֔ל כְּמֹ֖הַר הַבְּתוּלֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִם מִצְבָּא לָא יִצְבֵּי אֲבוּהָא לְמִתְּנַהּ לֵהּ כַּסְפָּא יִתְקוֹל כְּמוֹהֲרֵי בְּתֻלְתָּא:", "onk_en": "If her father utterly refuses to give her to him, he must give [the father] the weight of silver equal to the dowry usually given to virgins.", "pj": "אִין לָא חַמְיָא לֵיהּ אוֹ דְלָא יִצְבֵי אָבוּהָא לְמִתְבָהּ לֵיהּ כְּסַף חַמְשִׁין סַלְעִין יִתְקְנֵס הֵי כְמִפְרוֹנִי בְּתוּלְתָּא", "pj_en": "If this doth not appear to him (to be desirable), or if her father be not willing to give her to him fifty sileen of silver shall be laid upon him, according to the endowment of a virgin.", "tj": "", "tj_en": "", "
