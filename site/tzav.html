<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;

  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 6, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 2, "aliyah": 1, "heb": "צַ֤ו אֶֽת־אַהֲרֹן֙ וְאֶת־בָּנָ֣יו לֵאמֹ֔ר זֹ֥את תּוֹרַ֖ת הָעֹלָ֑ה הִ֣וא הָעֹלָ֡ה עַל֩ <small>מ<\/small>וֹקְדָ֨הֿ<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי תימן מוֹקְדָ֨הֿ במ״ם רגילה)<\/i> עַל־הַמִּזְבֵּ֤חַ כׇּל־הַלַּ֙יְלָה֙ עַד־הַבֹּ֔קֶר וְאֵ֥שׁ הַמִּזְבֵּ֖חַ תּ֥וּקַד בּֽוֹ׃", "onk": "פַּקֵּד יָת אַהֲרֹן וְיָת בְּנוֹהִי לְמֵימָר דָּא אוֹרַיְתָא דַּעֲלָתָא הִיא עֲלָתָא עַל דְּמִתּוֹקְדָא עַל מַדְבְּחָא כָל לֵילְיָא עַד צַפְרָא וְאֶשָּׁתָא דְמַדְבְּחָא תְּהֵא יָקְדָא בֵיהּ:", "onk_en": "Command Aharon and his sons, saying; this is the law of the burnt-offering. It is the burnt-offering [which remains] on its pyre on the altar all night, until the morning, and the fire of the altar will be kept burning on it.", "pj": "פַּקֵיד יַת אַהֲרן וְיַת בְּנוֹי לְמֵימָר דָא אוֹרַיְיתָא דְעָלָתָא דְאַתְיָא לְמִכַפְּרָא עַל הִרְהוֹרֵי לִבָּא הִיא עֲלָתָא דְמִתְעַבְּדָא בְּעָלָתָא בְּטַוְורָא דְסִינַי וְקַיְמָא עַל אֲתַר בֵּית יְקִידְתָּא עַל מַדְבַּח כָּל לֵילְיָא עַד צַפְרָא בְּרַם אֵישָׁתָא דְמַדְבְּחָא תְּהֵי יוֹקְדָא בֵיהּ", "pj_en": "Instruct Aharon and his sons, saying, This is the law of the burnt offering which is brought to make atonement for the thoughts (errors) of the heart: it is a burnt offering, which is made in (the manner of) the burnt offering at Mount Sinai, and abideth upon the place of burning on the altar all the night until the morning: for the fire of the altar shall be burning in it.", "tj": "", "tj_en": "", "rashi": "<b>צו את אהרן.<\/b> אֵין צַו אֶלָּא לְשׁוֹן זֵרוּז מִיָּד וּלְדוֹרוֹת; אָמַר רַבִּי שִׁמְעוֹן, בְּיוֹתֵר צָרִיךְ הַכָּתוּב לְזָרֵז בְּמָקוֹם שֶׁיֵּשׁ בּוֹ חֶסְרוֹן כִּיס (ספרא):<br><br><b>זאת תורת העלה וגו'.<\/b> הֲרֵי הָעִנְיָן הַזֶּה בָּא לְלַמֵּד עַל הֶקְטֵר חֲלָבִים וְאֵבָרִים שֶׁיְּהֵא כָּשֵׁר כָּל הַלַּיְלָה, וּלְלַמֵּד עַל הַפְּסוּלִין אֵי זֶה אִם עָלָה יֵרֵד, וְאֵי זֶה אִם עָלָה לֹא יֵרֵד, שֶׁכָּל תּוֹרָה לְרַבּוֹת הוּא בָּא, לוֹמַר — תּוֹרָה אַחַת לְכָל הָעוֹלִים, וַאֲפִלוּ פְּסוּלִין, שֶׁאִם עָלוּ לֹא יֵרְדוּ (שם):<br><br><b>הוא העלה.<\/b> לְמַעֵט אֶת הָרוֹבֵעַ וְאֶת הַנִּרְבָּע וְכַיּוֹצֵא בָּהֶן, שֶׁלֹּא הָיָה פְּסוּלָן בַּקֹּדֶשׁ, שֶׁנִּפְסְלוּ קֹדֶם שֶׁבָּאוּ לָעֲזָרָה (שם ח):", "rashi_en": "צו את אהרן COMMAND AARON — The expression “Command …!” always implies urging on to carry out a command, implying too, that it comes into force at once, and is binding upon future generations (cf. Rashi on this passage in Kiddushin 29a). R. Simeon said: Especially must Scripture urge on the fulfilment of the commands in a case where monetary loss is involved (Sifra, Tzav, Chapter 1 1; Kiddushin 29a).<br><br>‎ 'וגו‎‎ ‎זאת תורת העולה  THIS IS THE LAW OF THE BURNT OFFERING: [SUCH BURNT OFFERING SHALL REMAIN ON THE FIRE-PLACE UPON THE ALTAR ALL NIGHT] — This paragraph (vv.1—2) is intended to teach, with reference to the burning of the fat-portions and limbs of sacrifices that it is permissible during the whole night (Megillah 21a); and to teach regarding disqualified sacrifices, which of them, if already brought up on the altar, must be taken down, and which, if brought up, need not be taken down. The latter case may happen, because the term, תורה wherever it occurs in Scripture as an introduction to a group of laws (cf. Leviticus 6:7, 18; 7:1,11 etc.) is intended as an all-inclusive term (to include all of the class mentioned); here it is intended to tell us: One law applies to all animals that may be brought up on the altar, even certain disqualified ones — that if these have once been brought up on the altar they shall not be taken down again (Sifra, Tzav, Chapter 1 7; Zevachim 27b).<br><br>הוא העולה — is intended to exclude from the general law of עולה male and female cattle with which sexual sin had been committed and the like (i. e. that even if they were put on the altar they must be taken down again), because their disqualification did not occur in the Holy Place, since they were dis-qualified before they came into the forecourt (Sifra, Tzav, Chapter 1 8)."}, {"ch": 6, "v": 3, "aliyah": 1, "heb": "וְלָבַ֨שׁ הַכֹּהֵ֜ן מִדּ֣וֹ בַ֗ד וּמִֽכְנְסֵי־בַד֮ יִלְבַּ֣שׁ עַל־בְּשָׂרוֹ֒ וְהֵרִ֣ים אֶת־הַדֶּ֗שֶׁן אֲשֶׁ֨ר תֹּאכַ֥ל הָאֵ֛שׁ אֶת־הָעֹלָ֖ה עַל־הַמִּזְבֵּ֑חַ וְשָׂמ֕וֹ אֵ֖צֶל הַמִּזְבֵּֽחַ׃", "onk": "וְיַלְבֵּשׁ כַּהֲנָא לְבוּשִׁין דְּבוּץ וּמִכְנְסִין דְּבוּץ יַלְבֵּשׁ עַל בִּסְרֵיהּ וְיַפְרֵשׁ יָת קִטְמָא דִּי תֵיכוּל אֶשָּׁתָא יָת עֲלָתָא עַל מַדְבְּחָא וִישַׁוִּנֵּיהּ בִּסְטַר מַדְבְּחָא:", "onk_en": "The <i>kohein<\/i> shall dress in his linen garment and he shall wear linen pants on his [body] skin; and he shall separate the ashes when the fire consumes the burnt-offering on the altar and place it next to the altar.", "pj": "וְיִלְבּוֹשׁ כַּהֲנָא לְבוּשִׁין דְבוּץ וְאַוַורְקְטִין דְבוּץ יִלְבּוֹשׁ עַל בִּישְרֵיהּ וְיִפְרוֹשׁ יַת קִיטְמָא דְתֵיכוּל אֵישָׁתָא יַת עֲלָתָא עַל מַדְבְּחָא וִישַׁוִינֵיהּ בִּצְטַר מַדְבְּחָא", "pj_en": "And the priest shall dress himself in vestments of linen, and put drawers of linen upon his flesh; and shall separate the ashes which the fire (maketh) in consuming the burnt offering upon the altar, and shall place them at the side of the altar.", "tj": "ומכנסי וְאַבַּרְסְקִין:", "tj_en": "Drawers.", "rashi": "<b>מדו בד.<\/b> הִיא הַכֻּתֹּנֶת, וּמָה תַּ\"ל מִדּוֹ? שֶׁתְּהֵא כְּמִדָּתוֹ (שם):<br><br><b>על בשרו.<\/b> שֶׁלֹּא יְהֵא דָּבָר חוֹצֵץ בֵּינְתַיִם (זבחים י\"ט):<br><br><b>והרים את הדשן.<\/b> הָיָה חוֹתֶה מְלֹא מַחְתָּה מִן הַמְאֻכָּלוֹת הַפְּנִימִיּוֹת וְנוֹתְנָן בְּמִזְרָחוֹ שֶׁל כֶּבֶשׁ (תמיד כ\"ח):<br><br><b>הדשן אשר תאכל האש את העלה.<\/b> וַעֲשָׂאַתָּה דֶּשֶׁן, מֵאוֹתוֹ דֶּשֶׁן יָרִים תְּרוּמָה <b>ושמו אצל המזבח<\/b>:<br><br>[<b>על המזבח.<\/b> מָצָא אֵבָרִים שֶׁעֲדַיִן לֹא נִתְאַכְּלוּ, מַחֲזִירָן עַל מִזְבֵּחַ לְאַחַר שֶׁחָתָה גֶּחָלִים אֵילָךְ וָאֵילָךְ וְנָטַל מִן הַפְּנִימִיּוֹת, שֶׁנֶּאֱמַר אֶת הָעֹלָה עַל הַמִּזְבֵּחַ]:", "rashi_en": "מדו בד HIS LINEN ROBE — this is what is elsewhere termed the כתונת, the undercoat; and why then is it here called מדו? To intimate that it (the כתונת) must be made to his measure (מדו from מדד to “measure”) (Sifra, Tzav, Chapter 2 1; Yoma 23b).<br><br>על בשרו [AND LINEN DRAWERS HE SHALL PUT] UPON HIS FLESH — This implies that nothing should interpose between them (cf. Sifra, Tzav, Chapter 2 3; Zevachim 19a).<br><br>והרים את הדשן AND HE SHALL TAKE UP THE ASHES — He raked a full pan of ashes from the innermost consumed mass of ashes and deposited them at the east side of the כבש (the inclined plane leading up to the altar) (Sifra, Tzav, Chapter 1 4 Yoma 20a; cf. Jerusalem Talmud Yoma 2:1).<br><br>העולה‎ את ‎‏ אשר תאכל האש‎הדשן ‎ [HE SHALL TAKE OUT] THOSE ASHES INTO WHICH THE FIRE HATH CONSUMED THE BURNT OFFERING — and thus has made it into ashes; from those ashes he shall take out a תרומה, a portion, ושמו אצל המזבח AND PUT IT BESIDE THE ALTAR.<br><br>[על המזבח [THE BURNT OFFERING] ON THE ALTAR — This implies that if he (the priest) finds any limbs of the burnt offering that were not yet consumed he shall put them back on the altar after having raked the coals hither and thither and having taken from the innermost ashes, because it states, העולה על המזבח ‎את ‎which implies: the burnt offering (i.e.so long as it can be called an עולה and not דשן) must be ‎on the altar] (Sifra, Tzav, Chapter 1 5; Yoma 45b; cf. Rashi there s. v. ‎אשר תאכל ‎ את העולה‎)."}, {"ch": 6, "v": 4, "aliyah": 1, "heb": "וּפָשַׁט֙ אֶת־בְּגָדָ֔יו וְלָבַ֖שׁ בְּגָדִ֣ים אֲחֵרִ֑ים וְהוֹצִ֤יא אֶת־הַדֶּ֙שֶׁן֙ אֶל־מִח֣וּץ לַֽמַּחֲנֶ֔ה אֶל־מָק֖וֹם טָהֽוֹר׃", "onk": "וְיַשְׁלַח יָת לְבוּשׁוֹהִי וְיִלְבַּשׁ לְבוּשִׁין אָחֳרָנִין וְיַפֵּק יָת קִטְמָא לְמִבָּרָא לְמַשְׁרִיתָא לַאֲתַר דְּכֵי:", "onk_en": "He shall [then] remove his garments and dress in other garments. He shall take out the ashes beyond the encampment, to a pure [undefiled] place.", "pj": "וִישַׁלַח יַת לְבוּשׁוֹי וְיִלְבַּשׁ לְבוּשִׁין חוֹרָנִין וִיהַנְפֵּק יַת קִיטְמָא לְמִיבָּרָא לְמַשְׁרִיתָא לַאֲתַר דְכֵי", "pj_en": "And he shall take off his vestments and put on other garments, and carry forth the ashes without the camp into a clean place.", "tj": "", "tj_en": "", "rashi": "<b>ופשט את בגדיו.<\/b> אֵין זוֹ חוֹבָה אֶלָּא דֶּרֶךְ אֶרֶץ, שֶׁלֹּא יְלַכְלֵךְ בְּהוֹצָאַת הַדֶּשֶׁן בְּגָדִים שֶׁהוּא מְשַׁמֵּשׁ בָּהֶן תָּמִיד — בְּגָדִים שֶׁבִּשֵּׁל בָּהֶן קְדֵרָה לְרַבּוֹ, אַל יִמְזֹג בָּהֶן כּוֹס לְרַבּוֹ, לְכָךְ וְלָבַשׁ בְּגָדִים אֲחֵרִים פְּחוּתִין מֵהֶם (ספרא):<br><br><b>והוציא את הדשן.<\/b> הַצָּבוּר בַּתַּפּוּחַ, כְּשֶׁהוּא הַרְבֵּה וְאֵין מָקוֹם לַמַּעֲרָכָה, מוֹצִיאוֹ מִשָּׁם; וְאֵין זֶה חוֹבָה לְכָל יוֹם, אֲבָל הַתְּרוּמָה חוֹבָה בְּכָל יוֹם (תמיד כ\"ח):", "rashi_en": "‎ ופשט את בגדיו ‎ AND HE SHALL PUT OFF HIS GARMENTS — This is not compulsory (cf., however, Nachmanides) but it is a matter of decency so that he should not, through removing the ashes, soil the garments in which he has regularly to minister at the altar; in the clothes he wore when he boiled the pot for his master (a menial task) he should not pour out a glass of wine for him (an honourable office). On this account it states: And he shall put on other garments — inferior to those in which he ministers at the altar (Yoma 23b; Shabbat 114a).<br><br>והוציא את הדשן AND HE SHALL BRING OUT THE ASHES that were heaped upon the ash-heap (not the ashes mentioned in v. 3). When it accumulated and there was no more room on the wood-pile (מערכה) he carried it out; this was not compulsory every day, whilst the תרומת הדשן (the taking out of the pan of ashes commanded in v. 3) was a daily duty (Yoma 20a)."}, {"ch": 6, "v": 5, "aliyah": 1, "heb": "וְהָאֵ֨שׁ עַל־הַמִּזְבֵּ֤חַ תּֽוּקַד־בּוֹ֙ לֹ֣א תִכְבֶּ֔ה וּבִעֵ֨ר עָלֶ֧יהָ הַכֹּהֵ֛ן עֵצִ֖ים בַּבֹּ֣קֶר בַּבֹּ֑קֶר וְעָרַ֤ךְ עָלֶ֙יהָ֙ הָֽעֹלָ֔ה וְהִקְטִ֥יר עָלֶ֖יהָ חֶלְבֵ֥י הַשְּׁלָמִֽים׃", "onk": "וְאֶשָּׁתָא עַל מַדְבְּחָא תְהֵי יָקְדָא בֵיהּ לָא תִטְּפֵי וְיַבְעַר עֲלַהּ כַּהֲנָא אָעַיָּא בִּצְפַר בִּצְפָר וְיַסְדַּר עֲלַּהּ עֲלָתָא וְיַסֵּק עֲלַהּ תַּרְבֵּי נִכְסַת <b>קוּדְשַׁיָּא<\/b>:", "onk_en": "The fire on the altar shall be kindled with it it shall not go out. The <i>kohein<\/i> shall burn logs upon it each and every morning and arrange the burnt-offering on it and burn upon it the fats of the peace[<b>sacred<\/b>]-offering.", "pj": "וְאֵישָׁתָא עַל מַדְבְּחָא תְהֵי יוֹקְדָא בֵיהּ לָא תִטְפֵי וְיַלְפֵי עֲלָהּ כַּהֲנָא אָעִין בִּצְפַר בִּצְפַר עַד אַרְבַּע שְׁעִין דְיוֹמָא וִיסַדֵר עֲלָהּ עֲלָתָא וְיַסֵיק עֲלָהּ תַרְבֵּי נִכְסַת קוּדְשַׁיָא", "pj_en": "But the fire upon the altar shall burn upon it unextinguished, and the priest shall lay wood upon it from morning to morning, at four hours of the day, and shall set in order the burnt offering upon it, and burn upon it the fat of the sanctified oblations.", "tj": "", "tj_en": "", "rashi": "<b>והאש על המזבח תוקד בו.<\/b> רִבָּה כָּאן יְקִידוֹת הַרְבֵּה — <b>על מוקדה, ואש המזבח תוקד בו, והאש על המזבח תוקד בו, אש תמיד תוקד על המזבח<\/b>, כֻּלָּן נִדְרְשׁוּ בְּמַסֶּכֶת יוֹמָא (דף מ\"ה), שֶׁנֶּחְלְקוּ רַבּוֹתֵינוּ בְּמִנְיַן הַמַּעֲרָכוֹת שֶׁהָיוּ שָׁם:<br><br><b>וערך עליה העלה.<\/b> עוֹלַת תָּמִיד הִיא תִּקְדֹּם (מנחות מ\"ט):<br><br><b>חלבי השלמים.<\/b> אִם יָבִיאוּ שָׁם שְׁלָמִים, וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן \"עָלֶיהָ\" — עַל עוֹלַת הַבֹּקֶר הַשְׁלֵם כָּל הַקָּרְבָּנוֹת כֻּלָּם, מִכָּאן שֶׁלֹּא יְהֵא דָּבָר מְאֻחָר לְתָמִיד שֶׁל בֵּין הָעַרְבָּיִם (ספרא):", "rashi_en": "והאש על המזבח תוקד בו AND THE FIRE ON THE ALTAR SHALL BE BLAZING IN IT — Scripture uses here (in this section) many expressions from the root יקד “to ignite”: (Leviticus 6:2) “on the fire-place (מוקדה); (Leviticus 6:2) “and the fire upon the altar shall be blazing (תוקד) on it”; (Leviticus 6:5) “and the fire upon the altar shall be blazing (תוקד) on it”; (Leviticus 6:6) “a continual fire shall be blazing (תוקד) upon the altar” — all these passages have been expounded in Treatise Yoma 45b where our Rabbis state their different opinions as to the number of מערכות (wood-piles — fire-places) that were there (on the altar).<br><br>וערך עליה העלה AND HE SHALL SET THE BURNT OFFERING IN ORDER UPON IT — The morning continual burnt offering had to come first (Menachot 49a; cf. also Sifra, Tzav, Chapter 2 10 and Rashi on Leviticus 3:5).<br><br> ‎‎‏ השלמים‎חלבי  [AND HE SHALL CAUSE TO ASCEND IN FUMES THERÈON] THE FAT OF THE PEACE OFFERINGS — if people are bringing peace offerings there that day (this is no command that peace offerings must be placed on the altar after the daily burnt offering; if, however, any are being sacrificed on a particular day, it must be done at this point of the day’s work). — Our Rabbis, however, derived from here the following Halacha, taking the word השלמים in the sense of השלם “to complete”, “to finish”: עליה upon it — upon the continual burnt offering of the morning — complete the offering of all sacrifices; it follows therefore that no thing should be offered later than the continual burnt offering brought in the afternoon (Yoma 33a; Pesachim 58)."}, {"ch": 6, "v": 6, "aliyah": 1, "heb": "אֵ֗שׁ תָּמִ֛יד תּוּקַ֥ד עַל־הַמִּזְבֵּ֖חַ לֹ֥א תִכְבֶּֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֶשָּׁתָא תְּדִירָא תְּהֵי יָקְדָא עַל מַדְבְּחָא לָא תִטְּפֵי:", "onk_en": "A continual fire shall be lit on the altar; it shall not go out.", "pj": "אֵישָׁתָא תְּדִירָא תְּהֵי יוֹקְדָא עַל מַדְבְּחָא לָא תִיטְפֵי", "pj_en": "The fire shall be ever burning upon the altar; it shall never be extinguished.", "tj": "", "tj_en": "", "rashi": "<b>אש תמיד.<\/b> אֵשׁ שֶׁנֶּאֱמַר בּוֹ תָּמִיד, הִיא שֶׁמַּדְלִיקִין בָּהּ אֶת הַנֵּרוֹת שֶׁנֶּאֱמַר בָּה לְהַעֲלֹת נֵר תָּמִיד (שמות כ\"ז), אַף הִיא מֵעַל מִזְבֵּחַ הַחִיצוֹן תּוּקַד (יומא מ\"ה):<br><br><b>לא תכבה.<\/b> הַמְכַבֶּה אֵשׁ עַל הַמִּזְבֵּחַ עוֹבֵר בִּשְׁנֵי לָאוִין:", "rashi_en": "אש תמיד — The redundant word תמיד (because it could have written  לא תכבה המזבח ‎אש תוקד על‎ ; for this, too, would imply that it must be continually burning since it states that it must never go out) intimates: The fire about the use of which the expression תמיד is used, viz., that by which the lamps of the Candelabrum were kindled, with reference to which it is said, (Exodus 27:20) “to light the lamps continually (תמיד), this, too) should be ignited from the fire on the outer altar Yoma 45b).<br><br>‎‎תכבה‏ ‎לא‎ IT SHALL NEVER GO OUT — One who extinguishes the fire on the altar transgresses two negative commands (this and that contained in v. 5)."}, {"ch": 6, "v": 7, "aliyah": 1, "heb": "וְזֹ֥את תּוֹרַ֖ת הַמִּנְחָ֑ה הַקְרֵ֨ב אֹתָ֤הּ בְּנֵֽי־אַהֲרֹן֙ לִפְנֵ֣י יְהֹוָ֔ה אֶל־פְּנֵ֖י הַמִּזְבֵּֽחַ׃", "onk": "וְדָא אוֹרַיְתָא דְּמִנְחָתָא דִּיקָרְבוּן יָתַהּ בְּנֵי אַהֲרֹן קֳדָם יְיָ לָקֳדָם מַדְבְּחָא:", "onk_en": "This is the law of the meal-offering. The sons of Aharon bring it before Adonoy, to the front of the altar.", "pj": "וְדָא אוֹרַיְיתָא דְמִנְחָתָא דְיִקְרְבוּן יָתָהּ בְּנֵי אַהֲרן כַּהֲנָא קֳדָם יְיָ לִקְדָם מַדְבְּחָא", "pj_en": "And this is the law of the Mincha, which the priests, the sons of Aharon, shall offer in the presence of the Lord before the altar.", "tj": "", "tj_en": "", "rashi": "<b>וזאת תורת המנחה.<\/b> תּוֹרָה אַחַת לְכֻלָּן — לְהַטְעִינָן שֶׁמֶן וּלְבוֹנָה הָאֲמוּרִין בָּעִנְיָן, שֶׁיָּכוֹל אֵין לִי טְעוּנוֹת שֶׁמֶן וּלְבוֹנָה אֶלָּא מִנְחַת יִשְֹרָאֵל שֶׁהִיא נִקְמֶצֶת, מִנְחַת כֹּהֲנִים שֶׁהִיא כָּלִיל מִנַּיִן? תַּ\"ל תּוֹרַת (ספרא):<br><br><b>הקרב אתה.<\/b> הִיא הַגָּשָׁה בְּקֶרֶן דְּרוֹמִית מַעֲרָבִית (שם):<br><br><b>לפני ה'.<\/b> הוּא מַעֲרָב שֶׁהוּא לְצַד אֹהֶל מוֹעֵד:<br><br><b>אל פני המזבח.<\/b> הוּא הַדָּרוֹם, שֶׁהוּא פָּנָיו שֶׁל מִזְבֵּחַ, שֶׁהַכֶּבֶשׁ נָתוּן לְאוֹתוֹ הָרוּחַ (סוטה י\"ד):", "rashi_en": "וזאת תורת המנחה AND THIS IS THE LAW OF THE MEAL OFFERING — one law for all meal-offerings (cf. Rashi on v. 2) — making requisite for them “oil” and “frankincense” which are prescribed in the previous section (Leviticus 2:1). This had to be intimated in some way here because I might think that there I have the law that meal offerings require oil and frankincense only if they belong to an ordinary Israelite since it is that alone of which a fistful (קומץ) had to be taken, (for the command to take the קומץ is preceded by the words ויצק עליה שמן ונתן עליה לבונה cf. Leviticus 2:1 and 2)! Whence can I know that the same applies to the meal-offering of priests which was entirely burnt (and of which therefore no קומץ was taken; cf. Rashi on v. 15)? Because Scripture states, תורת — “this is the general law of the meal-offering” (Sifra, Tzav, Section 2 3).<br><br>הקרב אתה [AARON AND HIS SONS SHALL] BRING IT — This means bringing near (not offering, i. e. burning, for this is mentioned later in v. 8) to the south-west corner of the altar.<br><br>לפני ה׳ BEFORE THE LORD — This is the west side of the altar which faced the direction of the “tent of meeting” in which the Lord revealed himself.<br><br>אל פני המזבח — This again implies the south side of the altar, because that was the ‎‎‎ אל פני המזבח, the front of the altar, since the ascent leading up to it was situated on that side (the combination therefore of both locations:'לפני ה and אל פני המזבח describes the south-west corner of the altar, as stated above) (Sotah 14b; Sifra, Tzav, Section 2 4)."}, {"ch": 6, "v": 8, "aliyah": 1, "heb": "וְהֵרִ֨ים מִמֶּ֜נּוּ בְּקֻמְצ֗וֹ מִסֹּ֤לֶת הַמִּנְחָה֙ וּמִשַּׁמְנָ֔הּ וְאֵת֙ כׇּל־הַלְּבֹנָ֔ה אֲשֶׁ֖ר עַל־הַמִּנְחָ֑ה וְהִקְטִ֣יר הַמִּזְבֵּ֗חַ רֵ֧יחַ נִיחֹ֛חַ אַזְכָּרָתָ֖הּ לַיהֹוָֽה׃", "onk": "וְיַפְרֵשׁ מִנֵּיהּ בְּקֻמְצֵיהּ מִסֻּלְתָּא דְמִנְחָתָא וּמִמִּשְׁחַהּ וְיָת כָּל לְבוּנְתָּא דִּי עַל מִנְחָתָא וְיַסֵּק לְמַדְבְּחָא <b>לְאִתְקַבָּלָא בְרַעֲוָא אַדְכַּרְתָּא קֳדָם<\/b> יְיָ:", "onk_en": "He shall separate from it, when he takes his fistful, from some of the meal-offerings fine flour and some of its oil and all the frankincense which is on the meal-offering. He shall burn, on the altar a pleasing fragrance [<b>to be accepted with favor<\/b>]; its memorial portion, to [<b>before<\/b>] Adonoy.", "pj": "וְיַפְרֵישׁ מִנֵיהּ בְּקוּמְצֵיהּ מִן סְמִידָא דְמִנְחָתָא וּמִן טוֹבָא עַל כָּל לְבוֹנְתָּא דְעַל מִנְחָתָא וְיַסֵיק לְמַדְבְּחָא לְאִתְקַבָּלָא בְּרַעֲוָא שְׁבַח אִדְכַּרְתָּהּ קֳדָם יְיָ", "pj_en": "And he shall separate his handful of the flour of the mincha, of the best thereof, with all the frankincense which is upon the mincha, and burn it at the altar to be received with favour, as a memorial of praise before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>והרים ממנו.<\/b> מִן הַמְחֻבָּר — שֶׁיְּהֵא עִשָּׂרוֹן שָׁלֵם בְּבַת אַחַת בִּשְׁעַת קְמִיצָה (ספרא):<br><br><b>בקמצו.<\/b> שֶׁלֹּא יַעֲשֶֹה מִדָּה לַקֹּמֶץ (שם):<br><br><b>מסלת המנחה ומשמנה.<\/b> מִכָּאן שֶׁקּוֹמֵץ מִמָּקוֹם שֶׁנִּתְרַבָּה שַׁמְנָהּ (סוטה י\"ד):<br><br><b>המנחה.<\/b> שֶׁלֹּא תְּהֵא מְעֹרֶבֶת בְּאַחֶרֶת (ספרא):<br><br><b>ואת כל הלבנה אשר על המנחה והקטיר.<\/b> מְלַקֵּט אֶת לְבוֹנָתָהּ לְאַחַר קְמִיצָה וּמַקְטִירוֹ; וּלְפִי שֶׁלֹּא פֵּרֵשׁ כֵּן אֶלָּא בְּאַחַת מִן הַמְּנָחוֹת בְּוַיִּקְרָא, הֻצְרַךְ לִשְׁנוֹת פָּרָשָׁה זוֹ, לִכְלֹל כָּל הַמְּנָחוֹת כְּמִשְׁפָּטָן:", "rashi_en": "והרים ממנו‎  AND HE SHALL TAKE UP FROM IT [IN HIS GRASP] — From it — from it as a united mass) — that there should be a full tenth part of an ephah at the same time in the vessel when he takes the fistful (Sifra, Tzav, Section 2 5; Menachot 24a).<br><br>בקמצו WITH HIS GRASP — This implies that he shall not make a measure for the קומץ (he must not use a measure that holds as much as his fist and in that remove the flour) (Sifra, Tzav, Section 2 5; Yoma 47a).<br><br>ומשמנה‎ מסלת המנחה‎  OF THE FLOUR OF THE MEAL OFFERING AND OF THE OIL THEREOF — From here we may derive that he takes the “fistful” (קומץ) from that spot where there is plenty of oil in it (Sotah 14b).<br><br>המנחה THE MEAL-OFFERING — This implies that it shall not be mixed up with another meal-offering (Sifra, Tzav, Section 2 5).<br><br>‎‏‎‎‏ הלבנה אשר על המנחה והקטיר‎ואת כל  AND ALL THE FRANKINCENSE WHICH IS UPON THE MEAL OFFERING HE SHALL CAUSE TO ASCEND IN FUMES — This means that the picks the frankincense off the meal-offering after the fistful has been taken from the latter and burns it (cf. Rashi on Leviticus 2:1). And because Scripture has stated this specifically only in the case of one of the meal offerings mentioned in ויקרא (Leviticus 2:2; viz., in the case of מנחת סולת, and it might therefore be applied to that special case only), it was compelled to state this paragraph here in order to include in a general rule all kinds of meal offerings as to all the regulations applicable to them."}, {"ch": 6, "v": 9, "aliyah": 1, "heb": "וְהַנּוֹתֶ֣רֶת מִמֶּ֔נָּה יֹאכְל֖וּ אַהֲרֹ֣ן וּבָנָ֑יו מַצּ֤וֹת תֵּֽאָכֵל֙ בְּמָק֣וֹם קָדֹ֔שׁ בַּחֲצַ֥ר אֹֽהֶל־מוֹעֵ֖ד יֹאכְלֽוּהָ׃", "onk": "וּדְאִשְׁתָּאַר מִנַּה יֵכְלוּן אַהֲרֹן וּבְנוֹהִי פַּטִּיר תִּתְאָכֵל בַּאֲתַר קַדִּישׁ בְּדָרַת מִשְׁכַּן זִמְנָא יֵכְלֻנַּהּ:", "onk_en": "Whatever remains from it shall be eaten by Aharon and his sons. It must be eaten as <i>matzoh,<\/i> in a sacred place. In the courtyard of the Tent of Meeting they shall eat it.", "pj": "וּמַה דְמִשְׁתַּיְירָא מִינָהּ יֵיכְלוּן אַהֲרן וּבְנוֹי פַּטִירֵי תִּתְאָכֵיל בַּאֲתַר קַדִישׁ בְּדָרַת מַשְׁכַּן זִמְנָא יֵיכְלֻנָהּ", "pj_en": "And that which remaineth of it shall Aharon and his sons eat; unleavened shall they eat it in the holy place, in the court of the tabernacle of ordinance shall they eat it.", "tj": "", "tj_en": "", "rashi": "<b>במקום קדש.<\/b> וְאֵיזֶהוּ? בַּחֲצַר אֹהֶל מוֹעֵד:", "rashi_en": "‏ ‏‏ קדוש‎במקום‏  [AS UNLEAVENED BREAD SHALL IT BE EATEN) IN A HOLY PLACE. — And which is this? בחצר אהל מועד IN THE ENCLOSURE OF THE TENT OF MEETING (Sifra, Tzav, Section 2 12)."}, {"ch": 6, "v": 10, "aliyah": 1, "heb": "לֹ֤א תֵאָפֶה֙ חָמֵ֔ץ חֶלְקָ֛ם נָתַ֥תִּי אֹתָ֖הּ מֵאִשָּׁ֑י קֹ֤דֶשׁ קׇֽדָשִׁים֙ הִ֔וא כַּחַטָּ֖את וְכָאָשָֽׁם׃", "onk": "לָא תִתְאֲפֵי חֲמִיעַ חֳלָקְהוֹן יְהָבִית יָתַהּ <b>מִקֻּרְבָּנָי<\/b> קֹדֶשׁ קוּדְשִׁין הִיא כְּחַטָּאתָא וְכַאֲשָׁמָא:", "onk_en": "It should not be baked [as] leavened. I have given it to them as their portion from my fire-offerings [<b>offerings<\/b>]. It is holy of holies [most holy], as [are] the sin-offering and as the guilt-offering.", "pj": "לָא תִתְאֲפֵי חֲמִיעַ חוּלַקְהוֹן מִן מוֹתַר מִנְחָתָא דִיהָבִית לְהוֹן מִקָרְבָּנַי קוֹדֶשׁ קוּדְשִׁין הִיא הֵי כְחַטָאתָא וְהֵי כְאַשָׁמָא", "pj_en": "Their portion of the residue of the mincha of My oblations given to them shall not be baked with leaven; it is most sacred, as the sin offering and as the trespass offering.", "tj": "", "tj_en": "", "rashi": "<b>לא תאפה חמץ חלקם.<\/b> אַף הַשְּׁיָרִים אֲסוּרִים בְּחָמֵץ (מנחות נ\"ה):<br><br><b>כחטאת וכאשם.<\/b> מִנְחַת חוֹטֵא הֲרֵי הִיא כְּחַטָּאת, לְפִיכָךְ קְמָצָהּ שֶׁלֹא לִשְׁמָהּ פְּסוּלָה, מִנְחַת נְדָבָה הֲרֵי הִיא כְּאָשָׁם, לְפִיכָךְ קְמָצָהּ שֶׁלֹּא לִשְׁמָהּ כְּשֵׁרָה (ספרא):", "rashi_en": "לא תאפה חמץ חלקם  IT SHALL NOT BE BAKEN AS ANYTHING LEAVENED FOR THEIR PORTION — The remains of the meal-offering which become the portion of the priests, are also forbidden to be baked in the form of leavened (Menachot 55a).<br><br>כחטאת וכאשם [IT IS MOST HOLY] AS THE SIN OFFERING OR THE GUILT OFFERING — the meal-offering of the sinner (v. 11) is as the sin-offering, therefore if he (the priest) takes the fistful out of it not as such (not having in mind that offering) it is invalid as is the sin-offering under such circumstances (cf. Rashi on 5:12); a free-will meal-offering (i.e. any of the other meal-offerings mentioned in ויקרא), however, is as the guilt-offering, therefore if he takes the fistful out of it not doing it as such, it is still valid (Sifra, Tzav, Chapter 3 3; Zevachim 11a)."}, {"ch": 6, "v": 11, "aliyah": 1, "heb": "כׇּל־זָכָ֞ר בִּבְנֵ֤י אַהֲרֹן֙ יֹֽאכְלֶ֔נָּה חׇק־עוֹלָם֙ לְדֹרֹ֣תֵיכֶ֔ם מֵאִשֵּׁ֖י יְהֹוָ֑ה כֹּ֛ל אֲשֶׁר־יִגַּ֥ע בָּהֶ֖ם יִקְדָּֽשׁ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "כָּל דְּכוּרָא בִּבְנֵי אַהֲרֹן יֵכְלֻנַּהּ קְיָם עָלָם לְדָרָתֵיכוֹן <b>מִקֻּרְבָּנַיָּא<\/b> דַיְיָ כֹּל דְּיִקְרַב בְּהוֹן יִתְקַדָּשׁ:", "onk_en": "Every male descendant of Aharon may eat it, an everlasting statute for all your descendants from the fire-offerings [<b>offerings<\/b>] of Adonoy. whatever shall touch them will become sacred.", "pj": "כָּל דְכוּרָא בִּבְנֵי אַהֲרן יֵיכְלֻנָהּ קְיַים עֲלַם לְדָרֵיכוֹן מִקוּרְבָּנַיָיא דַיְיָ כָּל דְיִקְרַב בְּהוֹן יִתְקַדָשׁ", "pj_en": "Every man of the sons of Aharon may eat of it. This is an everlasting statute for your generations concerning the oblations of the Lord: every one who toucheth them must be sanctified.", "tj": "", "tj_en": "", "rashi": "<b>כל זכר.<\/b> אֲפִלּוּ בַּעַל מוּם; לָמָּה נֶאֱמַר? אִם לַאֲכִילָה הֲרֵי כְּבָר אָמוּר, לֶחֶם אֱלֹהָיו מִקָּדְשֵׁי הַקֳּדָשִׁים וְגוֹ' (ויקרא כ\"א), אֶלָּא לְרַבּוֹת בַּעֲלֵי מוּמִין לְמַחֲלֹקֶת (ספרא):<br><br><b>כל אשר יגע וגו'.<\/b> קָדָשִׁים קַלִּים אוֹ חֻלִּין שֶׁיִּגְּעוּ בָּהּ וְיִבְלְעוּ מִמֶּנָּה:<br><br><b>יקדש.<\/b> לִהְיוֹת כָּמוֹהָ, שֶׁאִם פְּסוּלָה יִפָּסְלוּ, וְאִם כְּשֵׁרָה יֵאָכְלוּ כְּחֹמֶר הַמִּנְחָה (שם):", "rashi_en": "כל זכר ALL THE MALES [AMONG THE CHILDREN OF AARON SHALL EAT OF IT] — all the males: even one with a bodily blemish. But why is this stated at all? If you say: for the purpose of permitting the eating of the meal-offering to such a priest, then it is redundant, for you see, this has already been stated, (Leviticus 21:22) “He (the priest with a blemish) may eat of the bread of his God, both of the most holy [and of the holy]”! But it is intended to include the priests with bodily blemishes in the right of apportionment alluded to in the preceding verse: I have given it to them as their portion (i.e. that they may not only eat holy food if such is given to them by their fellow priests, but they are entitled to participate in the apportionment) (Sifra, Tzav, Chapter 3 5; Zevachim 102a).<br><br>כל אשר ‎'יגע וגו‎‎‏ WHATEVER TOUCHETH THEM — i. e. sacrifices holy in a minor degree or non-consecrated flesh (חולין) which touch it (the meal-offering) and absorb anything of it (Sifra, Tzav, Chapter 3 6; Zevachim 97b),<br><br>יקדש SHALL BECOME HOLY so as to be exactly like it (the מנחה) — that if it (the meal-offering) has become disqualified (as when e. g. it was not offered as such, לשמה), they (the holy things touching it) shall also become similarly disqualified, and if it is fit for eating they must be eaten only under the same stringency as the meal-offering (i.e., they must be eaten in a holy place (v. 9) and by males only; v. 11, etc.) (Sifra, Tzav, Chapter 3 6; Zevachim 97b)."}, {"ch": 6, "v": 12, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 13, "aliyah": 2, "heb": "זֶ֡ה קׇרְבַּן֩ אַהֲרֹ֨ן וּבָנָ֜יו אֲשֶׁר־יַקְרִ֣יבוּ לַֽיהֹוָ֗ה בְּיוֹם֙ הִמָּשַׁ֣ח אֹת֔וֹ עֲשִׂירִ֨ת הָאֵפָ֥ה סֹ֛לֶת מִנְחָ֖ה תָּמִ֑יד מַחֲצִיתָ֣הּ בַּבֹּ֔קֶר וּמַחֲצִיתָ֖הּ בָּעָֽרֶב׃", "onk": "דֵּין קֻרְבַּן אַהֲרֹן וּבְנוֹהִי דִּי יְקָרְבוּן <b>קֳדָם<\/b> יְיָ בְּיוֹמָא דְּ<b>רַבִּיאוּ<\/b> יָתֵיהּ חַד מִן עַסְרָא <b>בִתְלַת סְאִין<\/b> סֻלְתָּא מִנְחָתָא תְּדִירָא פַּלְגּוּתַהּ בְּצַפְרָא וּפַלְגּוּתַהּ בְּרַמְשָׁא:", "onk_en": "This is the offering of Aharon and his sons that they shall offer to [<b>before<\/b>] Adonoy on the day that he is anointed [<b>inaugurated to greatness<\/b>]; one tenth of an <i>ephah<\/i> [<b>which is three se’in<\/b>] of fine flour as a meal-offering, always [daily]. Half of it [he shall offer] in the morning and half of it [he shall offer] in the evening.", "pj": "דֵין קוּרְבָּנָא דְאַהֲרן וְדִבְנוֹי דִי יְקַרְבוּן קֳדָם יְיָ בְּיוֹמָא דְיִרְבּוּן יָתֵיהּ לְמִחְסַן כְּהוּנְתָּא רַבְּתָא חַד מִן עַשְרָא בִּתְלַת סְאִין סְמִידָא מִנְחָתָא פַּלְגוּתָא בְּצַפְרָא וּפַלְגוּתֵיהּ בְּרַמְשָׁא", "pj_en": "This is the oblation of Aharon and of his sons, which they are to offer before the Lord on the day that they anoint him, that he may possess the inheritance of the high priesthood. A tenth of three seahs of fine flour for a mincha, one half in the morning and a half at eventide.", "tj": "מְרַתְּחָא תָּעֵיל יָתָהּ וּמְרַסְקָא מִנְחַת רִיסוּקִין תְּקַרְבוּן רֵיחַ דְּרַעֲוָא לִשְׁמָא דַיְיָ:", "tj_en": "Fried shalt thou offer it; broken in pieces shalt thou offer the mincha, a sweet savour of acceptableness unto the Name of the Lord.", "rashi": "<b>זה קרבן אהרן ובניו.<\/b> אַף הַהֶדְיוֹטוֹת מַקְרִיבִין עֲשִׂירִית הָאֵפָה בַּיּוֹם שֶׁהֵן מִתְחַנְּכִין לָעֲבוֹדָה, אֲבָל כֹּהֵן גָּדוֹל בְּכָל יוֹם, שֶׁנֶּאֱמַר מִנְחָה תָּמִיד וְגוֹ' וְהַכֹּהֵן הַמָּשִׁיחַ תַּחְתָּיו מִבָּנָיו וְגוֹ' חָק עוֹלָם:", "rashi_en": "זה קרבן אהרון ובניו THIS IS THE OFFERING OF AARON AND HIS SONS — The ordinary priests, too, offer a tenth part of an ephah of flour on the day they are installed into the priestly service; the High Priest, however, offers one every day, as it is said, “a continual meal-offering, [half of it in the morning, and half thereof in the evening] etc. And the priest amongst his sons that is anointed in his stead (i. e. every high priest) [shall offer it]; it is a statute for ever” (Sifra, Tzav, Section 3 1-4; Menachot 51b)."}, {"ch": 6, "v": 14, "aliyah": 2, "heb": "עַֽל־מַחֲבַ֗ת בַּשֶּׁ֛מֶן תֵּעָשֶׂ֖ה מֻרְבֶּ֣כֶת תְּבִיאֶ֑נָּה תֻּפִינֵי֙ מִנְחַ֣ת פִּתִּ֔ים תַּקְרִ֥יב רֵֽיחַ־נִיחֹ֖חַ לַיהֹוָֽה׃", "onk": "עַל מַסְרֵיתָא בִּמְשַׁח תִּתְעֲבֵד רְבִיכָא תַיְתִנַּהּ תּוּפִינֵי מִנְחַת בִּצּוּעִין תְּקָרֵב <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "In a frying pan, with oil it shall be made; you shall bring it saturated, well-baked, a meal-offering of broken pieces, you shall bring a pleasing fragrance to [<b>it to be accepted with favor before<\/b>] Adonoy.", "pj": "עַל מַסְרִיתָא בִּמְשַׁח זֵיתָא פְּתִיכָא תִּתְעֲבֵיד מְטַגְנָא תָּעִיל יָתֵהּ מְרַסְקָא מִנְחַת רִיסוּקוּן תִּקְרַב לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "Thou shalt make it upon a pan, mixed with olive oil shalt thou offer it; in divided pieces shalt thou offer the mincha, to be received with acceptance before the Lord,", "tj": "", "tj_en": "", "rashi": "<b>מרבכת.<\/b> חֲלוּטָה בְּרוֹתְחִין כָּל צָרְכָּהּ (שם):<br><br><b>תפיני.<\/b> אֲפוּיָה אֲפִיּוֹת הַרְבֵּה — אַחַר חֲלִיטָתָהּ אוֹפָהּ בַּתַּנּוּר וְחוֹזֵר וּמְטַגְּנָהּ בַּמַּחֲבַת (מנחות נ'):<br><br><b>מנחת פתים.<\/b> מְלַמֵּד שֶׁטְּעוּנָה פְּתִיתָה:", "rashi_en": "מרבכת means, scalded with hot oil to saturation (cf. Sifra, Tzav, Chapter 4 6).<br><br>תפיני means, many times baken: after it has been scalded he bakes it in the oven and then again fries it in a pan (cf. Menachot 50b).<br><br>מנחת פתים THE BROKEN PIECES — This teaches that it requires breaking into pieces (cf. Sifra, Tzav, Chapter 4 6; Menachot 75b)."}, {"ch": 6, "v": 15, "aliyah": 2, "heb": "וְהַכֹּהֵ֨ן הַמָּשִׁ֧יחַ תַּחְתָּ֛יו מִבָּנָ֖יו יַעֲשֶׂ֣ה אֹתָ֑הּ חׇק־עוֹלָ֕ם לַיהֹוָ֖ה כָּלִ֥יל תׇּקְטָֽר׃", "onk": "וְכַהֲנָא <b>דִמְרַבָּא<\/b> תְחוֹתוֹהִי מִבְּנוֹהִי יַעְבֵּד יָתַהּ קְיָם עָלָם <b>קֳדָם<\/b> יְיָ גְּמִיר תִּתַּסָּק:", "onk_en": "The <i>kohein<\/i> who is anointed [<b>inaugurated to greatness<\/b>] in his stead from among his sons, he shall [also] do it; an everlasting statute to [<b>before<\/b>] Adonoy, it shall be entirely burnt.", "pj": "וְכַהֲנָא רַבָּא דְמִתְרַבֵּי בְּמִשְׁחָא וּבְרַם תְּחוֹתוֹי מִבְּנוֹי יְקוּמוּן לְכַהֲנִין אִיהוּ יַעֲבֵיד יָתָהּ קְיַים עֲלָם קֳדָם יְיָ גְמִירָא תִּתְסַדֵר וְתִיתְסַק", "pj_en": "And the high priest who is anointed with oil, (and also when (any one) of his sons who are constituted priests (is consecrated) in his place) shall perform this: it is an everlasting statute before the Lord: the whole shall be set in order and burned.", "tj": "", "tj_en": "", "rashi": "<b>המשיח תחתיו מבניו.<\/b> הַמָּשִׁיחַ מִבָּנָיו תַּחְתָּיו:<br><br><b>כליל תקטר.<\/b> אֵין נִקְמֶצֶת לִהְיוֹת שְׁיָרֶיהָ נֶאֱכָלִין אֶלָּא כֻּלָּהּ כָּלִיל, וְכֵן כָּל מִנְחַת כֹּהֵן שֶׁל נְדָבָה כָּלִיל תִּהְיֶה:", "rashi_en": "המשיח תחתיו מבניו is the same as המשיח מבניו תחתיו THE PRIEST THAT IS ANOINTED FROM AMONGST HIS SONS IN HIS STEAD.<br><br>כליל תקטר IT SHALL WHOLLY ASCEND IN FUMES — The קמץ (the altar's share) is not taken off from it so that there can be any remaining of it to be eaten by the priests, but the whole of it is burnt entire. Similarly the next verse points out that every free-will meal-offering of a priest (i. e. such offering in general) shall be wholly burnt (cf. Sifra, Tzav, Chapter 5 3). "}, {"ch": 6, "v": 16, "aliyah": 2, "heb": "וְכׇל־מִנְחַ֥ת כֹּהֵ֛ן כָּלִ֥יל תִּהְיֶ֖ה לֹ֥א תֵאָכֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְכָל מִנְחָתָא דְכַהֲנָא גְּמִיר תְּהֵי לָא תִתְאֲכֵל:", "onk_en": "Every meal-offering of a <i>kohein<\/i> shall be completely burnt and may not be eaten.", "pj": "וְכָל מִנְחָתָא דְכַהֲנָא גְמִירָא תִּתְסַדֵר וְתִיהֱוֵי לָא תִתְאַכָל", "pj_en": "For every mincha of the priest shall be wholly set in order and consumed: it shall not be eaten.", "tj": "", "tj_en": "", "rashi": "<b>כליל.<\/b> כֻּלָּהּ שָׁוָה לְגָבוֹהַּ:", "rashi_en": "כליל (connected with כל, all) means, all of it belongs alike to the Most High God (i. e. no part of it is given to the priests)."}, {"ch": 6, "v": 17, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 18, "aliyah": 2, "heb": "דַּבֵּ֤ר אֶֽל־אַהֲרֹן֙ וְאֶל־בָּנָ֣יו לֵאמֹ֔ר זֹ֥את תּוֹרַ֖ת הַֽחַטָּ֑את בִּמְק֡וֹם אֲשֶׁר֩ תִּשָּׁחֵ֨ט הָעֹלָ֜ה תִּשָּׁחֵ֤ט הַֽחַטָּאת֙ לִפְנֵ֣י יְהֹוָ֔ה קֹ֥דֶשׁ קׇֽדָשִׁ֖ים הִֽוא׃", "onk": "מַלֵּל עִם אַהֲרֹן וְעִם בְּנוֹהִי לְמֵימַר דָּא אוֹרַיְתָא דְּחַטָּאתָא בְּאֲתַר דִּי תִתְנְכֵס עֲלָתָא תִּתְנְכֵס חַטָּאתָא קֳדָם יְיָ קֹדֶשׁ קוּדְשִׁין הִיא:", "onk_en": "Speak to Aharon and his sons, saying: this is the law of the sin-offering. In the place where the burnt-offering is slaughtered, the sin-offering shall be slaughtered, before Adonoy; it is holy of holies [most holy].", "pj": "מַלֵיל עִם אַהֲרן וְעִם בְּנוֹי לְמֵימָר דָא אוֹרַיְיתָא דְחַטָאתָא בְּאַתְרָא דְתִתְנְכֵס עֲלָתָא תִּתְנְכֵס חַטָאתָא קֳדָם יְיָ קוֹדֶשׁ קוּדְשִׁין הוּא", "pj_en": "Speak with Aharon and with his sons, saying: This is the law of the sin offering which is to be killed in the place where the burnt offering is killed; it shall be slain as a sin offering before the Lord; it is most sacred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 19, "aliyah": 2, "heb": "הַכֹּהֵ֛ן הַֽמְחַטֵּ֥א אֹתָ֖הּ יֹאכְלֶ֑נָּה בְּמָק֤וֹם קָדֹשׁ֙ תֵּֽאָכֵ֔ל בַּחֲצַ֖ר אֹ֥הֶל מוֹעֵֽד׃", "onk": "כַּהֲנָא <b>דִּמְכַפֵּר בִּדְמַהּ<\/b> יֵיכְלִנַּהּ בַּאֲתַר קַדִּישׁ תִּתְאֲכֵל בְּדָרַת מַשְׁכַּן זִמְנָא:", "onk_en": "The <i>kohein<\/i> who offers it as a sin-offering [<b>atones with its blood<\/b>], shall eat it. It shall be eaten in a sacred place, in the Courtyard of the Tent of Meeting.", "pj": "כַּהֲנָא דִי מְכַפֵּר בְּאַדְמָא יֵיכְלוּנָהּ בַּאֲתַר קַדִישׁ תִּתְאָכֵל בְּדָרַת מַשְׁכַּן זִימְנָא", "pj_en": "The priest who maketh atonement with blood may eat of it in the holy place; it shall be eaten in the court of the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "<b>המחטא אתה.<\/b> הָעוֹבֵד עֲבוֹדוֹתֶיהָ — שֶׁהִיא נַעֲשֵׂית חַטָּאת עַל יָדוֹ:<br><br><b>המחטא אתה יאכלנה.<\/b> הָרָאוּי לַעֲבוֹדָה; יָצָא טָמֵא בִּשְׁעַת זְרִיקַת דָּמִים, שֶׁאֵינוֹ חוֹלֵק בַּבָּשָׂר; וְאִי אֶפְשָׁר לוֹמַר שֶׁאוֹסֵר שְׁאָר כֹּהֲנִים בַּאֲכִילָתָהּ חוּץ מִן הַזּוֹרֵק דָּמָהּ, שֶׁהֲרֵי נֶאֱמַר לְמַטָּה כָּל זָכָר בַּכֹּהֲנִים יֹאכַל אֹתָהּ (זבחים צ\"ט):", "rashi_en": "המחטא אתה means the priest who performs those rites connected with it (i. e. those connected with the sprinkling of the blood), he is called the מחטא because it is through him that it becomes a sin-offering.<br><br>המחטא אתה יאכלנה THE PRIEST THAT OFFERETH IT MAY EAT IT — i. e., the priest who is fitted to carry out the rite (so that the words denote: Any priest who may offer it as a sin-offering may eat of it; they do not refer to that priest alone who offered it). Thus there is excluded a priest who is unclean (and therefore unfitted) when the blood is sprinkled — that he has no share in the flesh. One cannot say that Scripture here forbids the eating of it to ANY priests (i. e. even to clean priests) except him who sprinkles the blood, because, you see, it is stated later on (v. 22), “All the males among the priests may eat thereof” (cf. Zevachim 99a)."}, {"ch": 6, "v": 20, "aliyah": 2, "heb": "כֹּ֛ל אֲשֶׁר־יִגַּ֥ע בִּבְשָׂרָ֖הּ יִקְדָּ֑שׁ וַאֲשֶׁ֨ר יִזֶּ֤ה מִדָּמָהּ֙ עַל־הַבֶּ֔גֶד אֲשֶׁר֙ יִזֶּ֣ה עָלֶ֔יהָ תְּכַבֵּ֖ס בְּמָק֥וֹם קָדֹֽשׁ׃", "onk": "כֹּל דִּי יִקְרַב בְּבִסְרַהּ יִתְקַדַּשׁ וְדִי יַדִּי מִדְּמַהּ עַל לְבוּשׁ דִּי יַדִּי עֲלַהּ תִּתְחַוָּר בַּאֲתַר קַדִּישׁ:", "onk_en": "Whatever shall touch its flesh shall become holy and when of its blood is sprinkled on the garment, whatever it is sprinkled upon, you shall wash in a sacred place.", "pj": "כָּל דִימְקַרֵב בְּבִישְרָהּ יִתְקַדֵשׁ וּדְיַדֵי מִן אַדְמָהּ עַל לְבוּשָׁא דְיַדִי עֲלָהּ תִּתְחַוָור בַּאֲתַר קַדִישׁ", "pj_en": "whosoever toucheth the flesh of it must be sanctified. And if any one let some of its blood fall upon a garment, (the garment so) bedropped shall be washed in the holy place.", "tj": "", "tj_en": "", "rashi": "<b>כל אשר יגע בבשרה.<\/b> כָּל דְּבַר אֹכֶל אֲשֶׁר יִגַּע וְיִבְלַע מִמֶּנָּה:<br><br><b>יקדש.<\/b> לִהְיוֹת כָּמוֹהָ — אִם פְּסוּלָה תִּפָּסֵל, וְאִם הִיא כְּשֵׁרָה, תֵּאָכֵל כַּחֹמֶר שֶׁבָּהּ:<br><br><b>ואשר יזה מדמה על הבגד.<\/b> וְאִם הֻזָּה מִדָּמָהּ עַל הַבֶּגֶד, אוֹתוֹ מְקוֹם הַדָּם שֶׁבַּבֶּגֶד אֲשֶׁר יִזֶּה עָלֶיה, תְּכַבֵּס בְּתוֹךְ הָעֲזָרָה:<br><br><b>אשר יזה.<\/b> יְהֵא נִזֶּה, כְּמוֹ וְלֹא יִטֶּה לָאָרֶץ מִנְלָם (איוב ט\"ו) — יְהֵא נָטוּי:", "rashi_en": "כל אשר יגע בבשרה WHATSOEVER SHALL TOUCH THE FLESH THEREOF [SHALL BECOME HOLY] — any article of food that shall touch it and absorb anything of it (cf. Sifra, Tzav, Section 4 5; Zevachim 97a and Rashi on v. 11),<br><br>יקדש SHALL BE HOLY, so as to become exactly like itself: if it (the sin-offering) has become invalid, it (the food touching it) also becomes disqualified, and if that be fit for eating this may be eaten only under the same stringency applying to it (the sin-offering).<br><br>ואשר יזה מדמה על הבגד means, and if there is splashed of the blood thereof on a garment, that blood-stained spot in the garment whereon it was splashed shalt thou wash in the forecourt (Sifra, Tzav, Chapter 6 3).<br><br>אשר יזה means, shall be splashed. It is the same as the verb in (Job. 15:29) “and their substance shall not be spread (יטה) on earth” (cf. Rashi on that verse)."}, {"ch": 6, "v": 21, "aliyah": 2, "heb": "וּכְלִי־חֶ֛רֶשׂ אֲשֶׁ֥ר תְּבֻשַּׁל־בּ֖וֹ יִשָּׁבֵ֑ר וְאִם־בִּכְלִ֤י נְחֹ֙שֶׁת֙ בֻּשָּׁ֔לָה וּמֹרַ֥ק וְשֻׁטַּ֖ף בַּמָּֽיִם׃", "onk": "וּמָן דַּחֲסַף דִּי תִתְבַּשֵּׁל בֵּיהּ יִתָּבָר וְאִם בְּמָנָא דִּנְחָשָׁא תִּתְבַּשֵּׁל וְיִתְמְרֵק וְיִשְׁתַּטֵּף בְּמַיָּא:", "onk_en": "An earthenware vessel in which it was cooked, must be broken. If it was cooked in a copper vessel, it must be scoured and rinsed with water.", "pj": "וְכָל מַאן דְפָחַר דְתִתְבַּשֵׁל בֵּיהּ יִתְבַּר מְטוֹל דְלָא יְבַשְׁלוּן בֵּיהּ חוּלֵי וְאִין בְּמָנָא דִנְחָשָׁא תִּתְבַּשֵׁל וְיִסְתְּפַן בְּגַרְגִישְׁתָּא וְיִשְׁתְּטִיף בְּמוֹי", "pj_en": "And every earthen vessel in which (the flesh of it) is boiled shall be broken, lest that which is common be boiled in it; or if it be boiled in a vessel of brass, it shall be scoured with potter's earth and washed in waters.", "tj": "", "tj_en": "", "rashi": "<b>ישבר.<\/b> לְפִי שֶׁהַבְּלִיעָה שֶׁנִּבְלַעַת בּוֹ נַעֲשֶׂה נוֹתָר, וְהוּא הַדִּין לְכָל הַקֳּדָשִׁים:<br><br><b>ומרק.<\/b> לְשׁוֹן תַּמְרוּקֵי הַנָּשִׁים (אסתר ב'), אשקור\"מנט בְּלַעַז:<br><br><b>ומרק ושטף.<\/b> לִפְלֹט אֶת בְּלִיעָתוֹ, אֲבָל כְּלִי חֶרֶס לִמֶּדְךָ הַכָּתוּב כָּאן שֶׁאֵינוֹ יוֹצֵא מִידֵי דָּפְיוֹ לְעוֹלָם (עבודה זרה ל\"ד):", "rashi_en": "ישבר [BUT AN EARTHEN VESSEL WHEREIN IT IS SODDEN] SHALL BE BROKEN — because the substance absorbed in it becomes what is known as נותר (the technical term for any portion of a sacrifice not eaten by the time prescribed for this) (cf. Avodah Zarah 76a). That, too, is the regulation applicable to all sacrifices (i. e. that an earthen vessel wherein they have been cooked must be broken). <br><br>ומרק — of the same root and meaning as the noun in (Esther 2:12) “the things for purifying (תמרוקי) women”; escourement in old French; English, scouring.<br><br>ומרק ושטף [AND IF IT BE SODDEN IN A COPPER POT] IT SHALL BE BOTH SCOURED AND RINSED [IN WATER] — in order that it should give out what it has absorbed: but as far as an earthen vessel is concerned Scripture teaches you that it can never get rid of its taint (lit., can never leave the grasp which its taint has on it) (Avodah Zarah 34a; Pesachim 30b). "}, {"ch": 6, "v": 22, "aliyah": 2, "heb": "כׇּל־זָכָ֥ר בַּכֹּהֲנִ֖ים יֹאכַ֣ל אֹתָ֑הּ קֹ֥דֶשׁ קׇֽדָשִׁ֖ים הִֽוא׃", "onk": "כָּל דְּכוּרָא בְכַהֲנַיָּא יֵכוּל יָתַהּ קֹדֶשׁ קוּדְשִׁין הִיא:", "onk_en": "Every male among the <i>kohanim<\/i> may eat it; it is holy of holies [=most holy].", "pj": "כָּל דְכוּרָא בְּכַהֲנַיָיא יֵיכוּל יָתָהּ קוֹדֶשׁ קוּדְשִׁין הוּא", "pj_en": "Every man of the priests may eat thereof; it is most sacred.", "tj": "", "tj_en": "", "rashi": "<b>כל זכר בכהנים יאכל אתה.<\/b> הָא לָמַדְתָּ שֶׁהַמְחַטֵּא אוֹתָהּ הָאָמוּר לְמַעְלָה לֹא לְהוֹצִיא שְׁאָר הַכֹּהֲנִים, אֶלָּא לְהוֹצִיא אֶת שֶׁאֵינוֹ רָאוּי לְחִטּוּי:", "rashi_en": "כל זכר בכהנים יאכלנה ALL MALES AMONG THE PRIESTS SHALL EAT THEREOF — Thus you learn that the statement “[the priest] that offers it for a sin-offering [shall eat it]” made above (v. 19) is not intended to exclude other priests (i. e. such as did not actually perform the rites of that sacrifice), but only to exclude from eating it those priests who were at that time unfit to bring it as a sin-offering (cf. Rashi on v. 19)."}, {"ch": 6, "v": 23, "aliyah": 2, "heb": "וְכׇל־חַטָּ֡את אֲשֶׁר֩ יוּבָ֨א מִדָּמָ֜הּ אֶל־אֹ֧הֶל מוֹעֵ֛ד לְכַפֵּ֥ר בַּקֹּ֖דֶשׁ לֹ֣א תֵאָכֵ֑ל בָּאֵ֖שׁ תִּשָּׂרֵֽף׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְכָל חַטָּאתָא דִּי יִתָּעַל מִדְּמַהּ לְמַשְׁכַּן זִמְנָא לְכַפָּרָא בְקוּדְשָׁא לָא תִתְאֲכֵל בְּנוּרָא תִּתּוֹקָד:", "onk_en": "Every sin-offering whose blood is to be brought inside the Tent of Meeting to bring about atonement inside the Sanctuary may not be eaten; it must be burned in fire.", "pj": "וְכָל חַטָאתָא דְאִיתְעַל מִן אַדְמָהּ לְמַשְׁכַּן זִימְנָא מְטוֹל לְכַפָּרָא בְּקוּדְשָׁא לָא תִיתְאַכֵיל בְּנוּרָא תִּיתּוֹקָד", "pj_en": "But no sin offering whose blood is carried into the tabernacle of ordinance to make atonement in the sanctuary may be eaten; it must be burned with fire.", "tj": "", "tj_en": "", "rashi": "<b>וכל חטאת וגו'.<\/b> שֶׁאִם הִכְנִיס מִדַּם חַטָּאת הַחִיצוֹנָה לִפְנִים פְּסוּלָה:<br><br><b>וכל.<\/b> לְרַבּוֹת שְׁאָר קָדָשִׁים (ספרא):", "rashi_en": "‎'וכל חטאת וגו‎ AND NO SIN OFFERING [WHEREOF ANY OF THE BLOOD IS BROUGHT INTO THE TENT OF MEETING SHALL BE EATEN] — This means, that if the priest brought any of the blood of an “external” sin-offering (one the blood of which has to be sprinkled on the outer altar) into the Interior it becomes invalid and must be burnt.<br><br>וכל AND ALL — The word “all” serves to include in this law other sacrifices too (Sifra, Tzav, Chapter 8 1; Zevachim 81b)."}, {"ch": 7, "v": 1, "aliyah": 2, "heb": "וְזֹ֥את תּוֹרַ֖ת הָאָשָׁ֑ם קֹ֥דֶשׁ קׇֽדָשִׁ֖ים הֽוּא׃", "onk": "וְדָא אוֹרַיְתָא דַּאֲשָׁמָא קֹדֶשׁ קוּדְשִׁין הוּא:", "onk_en": "This is the law of the guilt-offering; it is holy of holies [=most holy].", "pj": "וְדָא אוֹרַיְיתָא דְאַשְׁמָא קוֹדֶשׁ קוּדְשִׁין הוּא", "pj_en": "And this is the law of the Trespass Offering; it is most holy.", "tj": "", "tj_en": "", "rashi": "<b>קדש קדשים הוא.<\/b> הוּא קָרֵב וְאֵין תְּמוּרָתוֹ קְרֵבָה (ספרא):", "rashi_en": "קדש קדשים הוא [THIS THE LAW OF THE GUILT OFFERING] IT IS MOST HOLY — “It is most holy”; it may be offered, but an animal that is exchanged for it (cf. Leviticus 27:34) may not be offered (Sifra, Tzav, Section 5 2)."}, {"ch": 7, "v": 2, "aliyah": 2, "heb": "בִּמְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת־הָ֣עֹלָ֔ה יִשְׁחֲט֖וּ אֶת־הָאָשָׁ֑ם וְאֶת־דָּמ֛וֹ יִזְרֹ֥ק עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "בְאַתְרָא דִּי יִכְּסוּן יָת עֲלָתָא יִכְּסוּן יָת אֲשָׁמָא וְיָת דְּמֵיהּ יִזְרַק עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "In the place where they will slaughter the burnt-offering they shall slaughter the guilt-offering, and they shall sprinkle its blood all around the altar.", "pj": "בְּאַתְרָא דְיִכְסוּן יַת עֲלָתָא יִכְסוּן יַת אַשְׁמָא וְיַת אַדְמֵיהּ יִדְרוֹק עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "In the place where they kill the burnt sacrifice they shall kill the trespass offering, and the blood thereof shall he sprinkle upon the altar round about.", "tj": "", "tj_en": "", "rashi": "<b>ישחטו.<\/b> רִבָּה לָנוּ שְׁחִיטוֹת הַרְבֵּה; לְפִי שֶׁמָּצִינוּ אָשָׁם בְּצִבּוּר, נֶאֱמַר \"יִשְׁחֲטוּ\" — רַבִּים, וּתְלָאוֹ בְּעוֹלָה, לְהָבִיא עוֹלַת צִבּוּר לַצָּפוֹן:", "rashi_en": "שחטו THEY SHALL SLAUGHTER — By using the plural ישחטו Scripture speaks of “several slaughterers” in connection with the עולה ‎‎‎‎(ישחטו את עולה)‎ ” in order to include also the communal burnt-offering under the law that an עולה must be slaughtered on the north side of the altar. — Since we do not find a guilt-offering in the case of the whole community, the term ישחטו in the plural is used here (ישחטו את האשם) because Scripture brings it in connection with the עולה (i. e. since the plural is used of the עולה it balances it by the same expression in the next phrase) (cf. Sifra, Tzav, Section 5 3)."}, {"ch": 7, "v": 3, "aliyah": 2, "heb": "וְאֵ֥ת כׇּל־חֶלְבּ֖וֹ יַקְרִ֣יב מִמֶּ֑נּוּ אֵ֚ת הָֽאַלְיָ֔ה וְאֶת־הַחֵ֖לֶב הַֽמְכַסֶּ֥ה אֶת־הַקֶּֽרֶב׃", "onk": "וְיָת כָּל תַּרְבֵּיהּ <b>יַפְרֵשׁ<\/b> מִנֵּיהּ יָת אֲלִיתָא וְיָת תַּרְבָּא דְּחָפֵי יָת גַּוָּא:", "onk_en": "He shall bring [<b>separate<\/b>] all its fat from it; the [fat] tail, the fat covering the innards,", "pj": "וְיַת כָּל תַּרְבֵּיהּ יִקְרַב מִנֵיהּ יַת אָלִיתָא וְיַת תַּרְבָּא דַחֲפֵי יַת בְּנֵי גַוָוא", "pj_en": "And he shall offer all the fat thereof, and the tail, and the fat which covereth the inwards;", "tj": "", "tj_en": "", "rashi": "<b>ואת כל חלבו וגו'.<\/b> עַד כָּאן לֹא נִתְפָּרְשׁוּ אֵמוּרִין בָּאָשָׁם, לְכָךְ הֻצְרַךְ לְפָרְשָׁם כָּאן, אֲבָל חַטָּאת כְּבָר נִתְפָּרֵשׁ בָּהּ בְּפָרָשַׁת וַיִּקְרָא:<br><br><b>את האליה.<\/b> לְפִי שֶׁאָשָׁם אֵינוֹ בָּא אֶלָּא אַיִל אוֹ כֶּבֶשׂ, וְאַיִל וְכֶבֶשׂ נִתְרַבּוּ בְּאַלְיָה:", "rashi_en": "ואת ‎'כל חלבו וגו‎ [HE SHALL OFFER OF IT] ALL THE FAT etc. — So far the fat portions of the guilt offering that have to be offered have not yet been mentioned as having to be burnt (though the אשם itself has already been dealt with in Leviticus 5:15), Scripture therefore was compelled expressly to specify them here. So far, however, as the sin-offering is concerned, it (the burning of their fat) has already been mentioned in the Sedrah ויקרא (Leviticus ch. 4), therefore it was unnecessary to mention it in 6:18—23.<br><br>את האליה THE FAT TAIL — Because only a ram or a lamb can be offered as a guilt-offering and the altar’s share in the case of a ram and lamb has been augmented by the fat tail (cf. Leviticus 3:9), therefore it is here naturally mentioned as having to be burnt."}, {"ch": 7, "v": 4, "aliyah": 2, "heb": "וְאֵת֙ שְׁתֵּ֣י הַכְּלָיֹ֔ת וְאֶת־הַחֵ֙לֶב֙ אֲשֶׁ֣ר עֲלֵיהֶ֔ן אֲשֶׁ֖ר עַל־הַכְּסָלִ֑ים וְאֶת־הַיֹּתֶ֙רֶת֙ עַל־הַכָּבֵ֔ד עַל־הַכְּלָיֹ֖ת יְסִירֶֽנָּה׃", "onk": "וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבָּא דִּי עֲלֵיהֶן דִּי עַל גִּסְסַיָּא וְיָת חִצְרָא דְּעַל כַּבְדָּא עַל כָּלְיֵתָא יֶעְדִּנַּהּ:", "onk_en": "the two kidneys and the fat on them that are on the flanks. The lobe on the liver, he shall remove together with the kidneys.", "pj": "וְיַת תַּרְתֵּין כּוּלְיַין וְיַת תַּרְבָּא דַעֲלֵיהוֹן דְעַל כַּפְלֵי וְיַת חַצְרָא דְעַל כַּבְדָא דְעַל כּוּלְיָיתָא יַעֲדִינָהּ", "pj_en": "and the two kidneys, and the fat which is upon them, and upon the inwards. And the caul that is upon the liver upon the kidneys shall he take away;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 5, "aliyah": 2, "heb": "וְהִקְטִ֨יר אֹתָ֤ם הַכֹּהֵן֙ הַמִּזְבֵּ֔חָה אִשֶּׁ֖ה לַיהֹוָ֑ה אָשָׁ֖ם הֽוּא׃", "onk": "וְיַסֵּק יָתְהוֹן כַּהֲנָא לְמַדְבְּחָא <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ אֲשָׁמָא הוּא:", "onk_en": "The <i>kohein<\/i> shall burn them on the altar, a fire-offering to [<b>an offering before<\/b>] Adonoy; it is a guilt-offering.", "pj": "וְיַסִיק יַתְהוֹן כַּהֲנָא לְמַדְבְּחָא קָרְבָּנָא קֳדָם יְיָ אַשְׁמָא הוּא", "pj_en": "and the priest shall burn them at the altar, an oblation before the Lord: it is a trespass offering.", "tj": "", "tj_en": "", "rashi": "<b>אשם הוא.<\/b> עַד שֶׁיִּנָּתֵק שְׁמוֹ מִמֶּנּוּ, לִמֵּד עַל אָשָׁם שֶׁמֵּתוּ בְּעָלָיו אוֹ שֶׁנִּתְכַּפְּרוּ בְּעָלָיו, אַעַ\"פִּי שֶׁעוֹמֵד לִהְיוֹת דָּמָיו עוֹלֶה לְקַיִץ הַמִּזְבֵּחַ, אִם שְׁחָטוֹ סְתָם, אֵינוֹ כָּשֵׁר לְעוֹלָה קֹדֶם שֶׁנִּתַּק לִרְעִיָּה; וְאֵינוֹ בָּא לְלַמֵּד עַל הָאָשָׁם שֶׁיְּהֵא פָּסוּל שֶׁלֹּא לִשְׁמוֹ — כְּמוֹ שֶׁדָּרְשׁוּ הוּא הַכָּתוּב בַּחַטָּאת — לְפִי שֶׁאָשָׁם לֹא נֶאֱמַר בּוֹ אָשָׁם הוּא אֶלָּא לְאַחַר הַקְטָרַת אֵמוּרִין, וְהוּא עַצְמוֹ שֶׁלֹּא הֻקְטְרוּ אֵמוּרָיו כָּשֵׁר (זבחים ה'):", "rashi_en": "אשם הוא IT IS A GUILT OFFERING — it remains (הוא) a guilt offering until its appelation is removed from it. This teaches regarding a guilt-offering the owner of which has died, or the owner of which has been atoned for by another sacrifice, (e.g. if that originally destined for that purpose was lost and afterwards found), — that although its value (i. e. the animal bought from the proceeds of its sale) is destined to become a burnt-offering for the unemployed altar (lit., for the altar's summer time when there were not sufficient obligatory sacrifices for the altar), yet if one slaughtered it without a special designation) before it was condemned to pasture) it is not fit to become a burnt offering. — Scripture does not, by these words, intend to intimate concerning a guilt-offering that it becomes invalid if slaughtered not as such (but as some sacrifice other than a guilt offering — שלא לשמו) i. e., in the same sense as they (the Rabbis) explained the word הוא that is stated of a חטאת (Leviticus 4:24; cf. Rashi thereon), because in the case of אשם the limiting words אשם הוא are used only after mention of the burning of the fat pieces (not as in the case of חטאת, where חטאת הוא is stated after the command of slaughtering) and could therefore at most be taken as limitating the act of הקטרה in the sense that if this has been done שלא לשמה the sacrifice is invalid; this, however, is not a fact because הקטרה is not essential, and it itself (the אשם), even though the fat pieces have not been burnt at all, is nevertheless valid (Zevachim 5b; Menachot 4a)."}, {"ch": 7, "v": 6, "aliyah": 2, "heb": "כׇּל־זָכָ֥ר בַּכֹּהֲנִ֖ים יֹאכְלֶ֑נּוּ בְּמָק֤וֹם קָדוֹשׁ֙ יֵאָכֵ֔ל קֹ֥דֶשׁ קׇֽדָשִׁ֖ים הֽוּא׃", "onk": "כָּל דְּכוּרָא בְכַהֲנַיָּא יֵיכְלִנֵּיהּ בַּאֲתַר קַדִּישׁ יִתְאֲכָל קֹדֶשׁ קוּדְשִׁין הוּא:", "onk_en": "All males among the <i>kohanim<\/i> may eat it. It must be eaten in a sacred place; it is most holy.", "pj": "כָּל דְכוּרָא בְּכַהֲנַיָא יֵיכְלוּנֵיהּ בַּאֲתַר קַדִישׁ יִתְאַכֵל קוֹדֶשׁ קוּדְשִׁין הוּא", "pj_en": "Every man of the priests may eat of it, in the holy place shall it be eaten it is most sacred.", "tj": "", "tj_en": "", "rashi": "<b>קדש קדשים הוא.<\/b> בְּתוֹרַת כֹּהֲנִים הוּא נִדְרָשׁ:", "rashi_en": "קדש קרשים הוא IT IS MOST HOLY — In Torath Cohanim these words which appear to be a mere repetition of those in v. 1, are expounded (Sifra, Tzav, Chapter 9 10)."}, {"ch": 7, "v": 7, "aliyah": 2, "heb": "כַּֽחַטָּאת֙ כָּֽאָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָהֶ֑ם הַכֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר־בּ֖וֹ ל֥וֹ יִהְיֶֽה׃", "onk": "כְּחַטָּאתָא כַּאֲשָׁמָא אוֹרַיְתָא חֲדָא לְהוֹן כַּהֲנָא דִּי יְכַפֵּר בֵּיהּ דִּילֵיהּ יְהֵא:", "onk_en": "As the sin-offering is, so is the guilt-offering; one law applies to them both; the <i>kohein<\/i> who will bring about atonement with it, it shall belong to him.", "pj": "כְּהִלְכַת חַטָאתָא הֵיכְדֵין הִלְכַת אֲשָׁמָא אוֹרַיְיתָא חֲדָא לְהוֹן כַּהֲנָא דִי יְכַפֵּר בֵּיהּ דִילֵיהּ יְהֵי", "pj_en": "As the rite of the sin offering, so is the rite of the trespass; there is one law for them: the priest who maketh atonement with its blood shall have it.", "tj": "חַוְויָא חֲדָא:", "tj_en": "One rule", "rashi": "<b>תורה אחת להם.<\/b> בְּדָבָר זֶה:<br><br><b>הכהן אשר יכפר בו.<\/b> הָרָאוּי לְכַפָּרָה חוֹלֵק בּוֹ, פְּרָט לִטְבוּל יוֹם וּמְחֻסַּר כִּפּוּרִים וְאוֹנֵן (ספרא):", "rashi_en": "תורה אחת להם [AS THE SIN OFFERING IS SO IS THE GUILT OFFERING:] THERE IS ONE LAW FOR THEM in this (the following) respect:<br><br>that הכהן אשר יכפר בו THE PRIEST WHO MAKETH EXPIATION THEREWITH — i.e., who is fitted to effect expiation, shall have a share in it, thus excluding an unclean person who has bathed on a particular day but is awaiting sunset to be perfectly clean, one who lacks atonement (an unclean person who has bathed but has to await the next day to bring the sacrifice requisite for his complete restoration to cleanness), and one who is in the state of mourning during the period between the death and the burial of a near relative (Sifra, Tzav, Chapter 9 1)."}, {"ch": 7, "v": 8, "aliyah": 2, "heb": "וְהַ֨כֹּהֵ֔ן הַמַּקְרִ֖יב אֶת־עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽעֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַכֹּהֵ֖ן ל֥וֹ יִהְיֶֽה׃", "onk": "וְכַהֲנָא דִּמְקָרֵב יָת עֲלַת גְּבָר מְשַׁךְ עֲלָתָא דִּי יְקָרֵב לְכַהֲנָא דִּילֵיהּ יְהֵא:", "onk_en": "The <i>kohein<\/i> who brings a burnt-offering of an individual, the skin of the burnt-offering that he brought, shall belong to the <i>kohein,<\/i> it shall belong to him.", "pj": "וְכַהֲנָא דִמְקַרִיב יַת עוֹלַת גְבַר אוֹחֲרָן מְשַׁךְ עֲלָתָא דִיקְרֵיב לְכַהֲנָא דִילֵיהּ יְהֵי", "pj_en": "And when the priest offereth another man's burnt sacrifice, the skin of the burnt sacrifice which he offereth shall be the priest's.", "tj": "", "tj_en": "", "rashi": "<b>עור העלה אשר הקריב לכהן לו יהיה.<\/b> פְּרָט לִטְבוּל יוֹם וּמְחֻסַּר כִּפּוּרִים וְאוֹנֵן שֶׁאֵין חוֹלְקִים בָּעוֹרוֹת (שם):", "rashi_en": "עור העלה אשר הקריב לכהן לו יהיה [AND THE PRIEST THAT OFFERETH ANY MAN’S BURNT OFFERING] EVEN THE PRIEST SHALL HAVE TO HIMSELF THE SKIN OF THE BURNT OFFERING WHICH HE HATH OFFERED — thus excluding the טבול יום, the מחוסר כפורים and the אונן (cf. Rashi on v. 7) — that these have no share in the skins of burnt offerings (Sifra, Tzav, Chapter 9 5; Zevachim 103b)."}, {"ch": 7, "v": 9, "aliyah": 2, "heb": "וְכׇל־מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּתַּנּ֔וּר וְכׇל־נַעֲשָׂ֥ה בַמַּרְחֶ֖שֶׁת וְעַֽל־מַחֲבַ֑ת לַכֹּהֵ֛ן הַמַּקְרִ֥יב אֹתָ֖הּ ל֥וֹ תִֽהְיֶֽה׃", "onk": "וְכָל מִנְחָתָא דִּי תִתְאֲפֵי בְּתַנּוּרָא וְכָל דְּתִתְעֲבֵד <b>בְּרִדְתָּא<\/b> וְעַל מַסְרֵיתָא לְכַהֲנָא דִּמְקָרֵב יָתַהּ דִּילֵיהּ תְּהֵא:", "onk_en": "Every meal-offering that shall be baked in an oven and every one made in a deep pot [<b>which appears as if it has been ploughed out<\/b>] or frying pan, [belong] to the <i>kohein<\/i> who offers it; it shall belong to him.", "pj": "וְכָל מִנְחָתָא דְתִיתְאֲפֵי בְּתַנוּרָא וְכָל דְתִתְעֲבֵד בְּמַרְתְּחָא וְעַל מַסְרִיתָא לְכַהֲנָא דְמִקְרַב יָתָהּ דִילֵיהּ יְהֵי", "pj_en": "And every mincha which is baked in the oven, and every one that is made in a pot, or in a frying pan, or upon a dish, the priest who offereth it shall have it for his own.", "tj": "", "tj_en": "", "rashi": "<b>לכהן המקריב אתה וגו'.<\/b> יָכוֹל לוֹ לְבַדּוֹ, תַּ\"ל <b>לכל בני אהרן תהיה<\/b>, יָכוֹל לְכֻלָּן, תַּ\"ל <b>לכהן המקריב<\/b>, הָא כֵּיצַד? לְבֵית אָב שֶׁל יוֹם שֶׁמַּקְרִיבִין אוֹתָהּ (שם):", "rashi_en": "לכהן המקריב אתה וגו'‏‎‎‏‎‎ [AND EVERY MEAL OFFERING …] SHALL BE THE PRIEST’S THAT OFFERETH IT etc. — One might think it shall be his exclusively! Scripture, however, states (v. 10) לכל בני אהרן תהיה IT SHALL BELONG TO ALL THE SONS OF AARON; — one might think then, that it shall belong to all of them, which is, however, impossible, for Scripture states “[it shall be] the priest’s (that offereth it”! How then can these apparently contradictory passages be reconciled? By referring the text to the “family”) officiating on that day on which it (the מנחה) is offered (Sifra, Tzav, Chapter 10 2)."}, {"ch": 7, "v": 10, "aliyah": 2, "heb": "וְכׇל־מִנְחָ֥ה בְלוּלָֽה־בַשֶּׁ֖מֶן וַחֲרֵבָ֑ה לְכׇל־בְּנֵ֧י אַהֲרֹ֛ן תִּהְיֶ֖ה אִ֥ישׁ כְּאָחִֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְכָל מִנְחָתָא דְפִילָא בִמְשַׁח <b>וּדְלָא פִילָא<\/b> לְכָל בְּנֵי אַהֲרֹן תְּהֵי גְּבַר כְּאָחוֹהִי:", "onk_en": "Every meal-offering mixed with oil or dry [<b>not mixed<\/b>], shall belong to all the sons of Aharon, each equally.", "pj": "וְכָל מִנְחָתָא פְּתִיכָא בִּמְשָׁח וּמְנַגְבָא לְכָל בְּנֵי אַהֲרן תְּהֵי גְבַר כְּאָחוֹי", "pj_en": "And every mincha mixed with oil, or which is dry, shall be for any of the sons of Aharon, a man as his brother.", "tj": "", "tj_en": "", "rashi": "<b>בלולה בשמן.<\/b> זוֹ מִנְחַת נְדָבָה:<br><br><b>וחרבה.<\/b> זוֹ מִנְחַת חוֹטֵא וּמִנְחַת קְנָאוֹת שֶׁאֵין בָּהֶן שֶׁמֶן:", "rashi_en": "בלולה בשמן [AND EVERY MEAL OFFERING] MINGLED WITH OIL — This is the free-will meal-offering (Leviticus 2:1, 4, 5, 7);<br><br>וחרבה OR DRY — this is the meal-offering of the sinner (Leviticus 5:11) and the “meal-offering of jealousy” (Numbers 5:15) in which there was no oil."}, {"ch": 7, "v": 11, "aliyah": 3, "heb": "וְזֹ֥את תּוֹרַ֖ת זֶ֣בַח הַשְּׁלָמִ֑ים אֲשֶׁ֥ר יַקְרִ֖יב לַיהֹוָֽה׃", "onk": "וְדָא אוֹרַיְתָא דְּנִכְסַת <b>קוּדְשַׁיָּא<\/b> דִּי יְקָרֵב <b>קֳדָם<\/b> יְיָ:", "onk_en": "This is the law of the peace[<b>sacred<\/b>]-offering that one will bring to [<b>before<\/b>] Adonoy.", "pj": "וְדָא אוֹרַיְיתָא דְנִכְסַת קוּדְשַׁיָא דִי יִקְרַב קֳדָם יְיָ", "pj_en": "And this is the law of the Sanctified Victims which they may offer before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 12, "aliyah": 3, "heb": "אִ֣ם עַל־תּוֹדָה֮ יַקְרִיבֶ֒נּוּ֒ וְהִקְרִ֣יב&thinsp;<b>׀<\/b> עַל־זֶ֣בַח הַתּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּשֶּׁ֔מֶן וּרְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּשָּׁ֑מֶן וְסֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּשָּֽׁמֶן׃", "onk": "אִם עַל תּוֹדְתָא יְקָרְבִנֵּיהּ וִיקָרֵב עַל נִכְסַת תּוֹדְתָא גְּרִיצָן פַּטִּירָן דְּפִילָן בִּמְשַׁח וְאֶסְפּוֹגִין פַּטִּירִין דִּמְשִׁיחִין בִּמְשָׁח וְסֻלְתָּא רְבִיכָא גְּרִיצָן דְּפִילָן בִּמְשָׁח:", "onk_en": "If he brings it as thanksgiving offering he shall bring along with his thanksgiving offering <i>matzoh<\/i> [unleavened] loaves mixed with oil, <i>matzoh<\/i> [unleavened] wafers anointed with oil and loaves of saturated fine flour mixed with oil.", "pj": "אִין עַל תּוֹדָתָא יְקַרְבִינֵיהּ וְיִקְרַב עַל נִכְסַת תּוֹדָתָא גְרִיצִין פַּטִירַן פְּתִיכַן בִּמְשַׁח זֵיתָא וְעַרוּכִין פְּטִירִין מְשִׁיחִין בִּמְשַׁח זֵיתָא וְקִמְחָא מְטַגְנָא פְּתִיכָא בִּמְשַׁח זֵיתָא", "pj_en": "If he offer it for a thanksgiving let him offer with the oblation of thanks unleavened cakes mingled with olive oil, and unleavened wafers anointed with olive oil, and flour fried with a mixture of olive oil.", "tj": "", "tj_en": "", "rashi": "<b>אם על תודה יקריבנו.<\/b> אִם עַל דְּבַר הוֹדָאָה עַל נֵס שֶׁנַּעֲשָׂה לוֹ, כְּגוֹן יוֹרְדֵי הַיָּם וְהוֹלְכֵי מִדְבָּרוֹת וַחֲבוּשֵׁי בֵּית הָאֲסוּרִים וְחוֹלֶה שֶׁנִּתְרַפֵּא — שֶׁהֵן צְרִיכִין לְהוֹדוֹת, שֶׁכָּתוּב בָּהֶן יוֹדוּ לַה' חַסְדּוֹ וְנִפְלְאוֹתָיו לִבְנֵי אָדָם וְיִזְבְּחוּ זִבְחֵי תוֹדָה (תהילים ק\"ז) — אִם עַל אַחַת מֵאֵלֶּה נָדַר שְׁלָמִים הַלָּלוּ, שַׁלְמֵי תּוֹדָה הֵן, וּטְעוּנוֹת לֶחֶם הָאָמוּר בָּעִנְיָן, וְאֵין נֶאֱכָלִין אֶלָּא לְיוֹם וְלַיְלָה, כְּמוֹ שֶׁמְּפֹרָשׁ כָּאן:<br><br><b>והקריב על זבח התודה.<\/b> אַרְבָּעָה מִינֵי לֶחֶם — חַלּוֹת וּרְקִיקִין וּרְבוּכָה, שְׁלוֹשָׁה מִינֵי מַצָּה, וּכְתִיב עַל חַלֹּת לֶחֶם חָמֵץ וְגוֹ'; וְכָל מִין וָמִין עֶשֶׂר חַלּוֹת, כָּךְ מְפֹרָשׁ בִּמְנָחוֹת, וְשִׁעוּרָן חָמֵשׁ סְאִין יְרוּשַׁלְמִיּוֹת, שֶׁהֵן ו' מִדְבָּרִיּוֹת, כ' עִשָּׂרוֹן (מנחות ע\"ו):<br><br><b>מרבכת.<\/b> לֶחֶם חָלוּט בְּרוֹתְחִין כָּל צָרְכּוֹ:", "rashi_en": "אם על תודה יקריבנו IF HE OFFER IT FOR A THANKSGIVING — i.e., if he brings it on account of (על) a matter that requires thanksgiving (תודה): on account of a miraculous deliverance that was wrought for him, as being, for instance, one of those who have made a sea-voyage. or travelled in the wilderness, or had been kept in prison, or if he had been sick and was now healed, all of whom are bound to offer thanks-giving, since it is written with reference to them, (Psalms 107:8, 15, 21, 31) “Let them offer thanksgiving to the Lord for His goodness, and for His wonderful works to the children of men!” (cf. Rashi on those vv. and on vv. 4, 10, 17 and 23 of that chapter; see also Berakhot 54b) — if it is on account of one of these things that he vowed those peace offerings, they are “peace offerings for acknowledgement” and require the offering of bread that is mentioned in the section, and may not be eaten beyond a period of one day and one night as it is here set forth (v. 15) [whilst other שלמים may be eaten at any time during two days and the intervening night].<br><br>והקריב על זבח התודה [IF HE OFFER IT FOR AN ACKNOWLEDGEMENT] THEN HE SHALL OFFER WITH THE SACRIFICE OF ACKNOWLEDGEMENT four sorts of bread: cakes, wafers and cakes of flour saturated with oil — these being three kinds of unleavened bread; it further states (v. 13), “together with cakes of leavened bread [he shall offer his offering etc.]”, thus making four. Each kind consisted of ten cakes; thus is it explained in Treatise Menachoth 77a. And their total measure was five Seahs according to the Jerusalem standard, these being equal to six Seahs of the “wilderness” standard (i.e. in force at the period when the Israelites were in the wilderness) comprising 20 tenths of an ephah) (Menachot 76b).<br><br>מרבכת — bread scalded with oil, as much as is needed to saturate it."}, {"ch": 7, "v": 13, "aliyah": 3, "heb": "עַל־חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קׇרְבָּנ֑וֹ עַל־זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽיו׃", "onk": "עַל גְּרִיצָן דִּלְחֵם חֲמִיעַ יְקָרֵב קֻרְבָּנֵיהּ עַל נִכְסַת תּוֹדַת <b>קוּדְשׁוֹהִי<\/b>:", "onk_en": "With loaves of leavened bread he shall bring his offering, along with his peace[<b>sacred<\/b>]-offering of thanksgiving.", "pj": "עַל גְרִיצְתָּא דִלְחֵים חָמִיעַ יַקְרִיב קוּרְבָּנֵיהּ עַל נִיכְסַת תּוֹדַת קוּדְשׁוֹי", "pj_en": "Upon the cakes he shall offer his oblation of leavened bread with the hallowed sacrifice of thanksgiving.", "tj": "", "tj_en": "", "rashi": "<b>יקריב קרבנו על זבח.<\/b> מַגִּיד שֶׁאֵין הַלֶּחֶם קָדוֹשׁ קְדֻשַּׁת הַגּוּף — לִפָּסֵל בְּיוֹצֵא וּטְבוּל יוֹם וּמִלָּצֵאת לְחֻלִּין בְּפִדְיוֹן — עַד שֶׁיִּשָּׁחֵט הַזֶּבַח (ספרא):", "rashi_en": "יקריב קרבנו על זבח [WITH THE CAKES OF LEAVENED BREAD] HE SHALL OFFER HIS OFFERING WITH THE SACRIFICE — The word קרבנו is redundant (it would have sufficed to say על חלת לחם חמץ יקריבנו), it intimates that the bread is not holy as such (קדוש קדושת הגוף), that it should become invalid by being carried forth from the forecourt, or by the touch of טבול יום (see v. 7) and so as to become incapable of going forth from its holy status to that of non-holy (ordinary) food (as is the case with a sacrifice that is קדוש קדושת הגוף), before the sacrifice is slaughtered (Menachot 78b)"}, {"ch": 7, "v": 14, "aliyah": 3, "heb": "וְהִקְרִ֨יב מִמֶּ֤נּוּ אֶחָד֙ מִכׇּל־קׇרְבָּ֔ן תְּרוּמָ֖ה לַיהֹוָ֑ה לַכֹּהֵ֗ן הַזֹּרֵ֛ק אֶת־דַּ֥ם הַשְּׁלָמִ֖ים ל֥וֹ יִהְיֶֽה׃", "onk": "וִיקָרֵב מִנֵּיהּ חַד מִכָּל קוּרְבַּן אַפְרָשׁוּתָא קֳדָם יְיָ לְכַהֲנָא דִּיזְרַק יָת דַּם נִכְסַת קוּדְשַׁיָּא דִּילֵיהּ יְהֵי:", "onk_en": "From it, he shall bring one from each offering as separated portion to [<b>before<\/b>] Adonoy. To that <i>kohein<\/i> who sprinkles the blood of the peace[<b>sacred<\/b>]-offering, it shall belong to him.", "pj": "וְיַקְרִיב מִנֵיהּ חַד מִכָּל קוּרְבָּנָא אַפְרָשׁוּתָא קֳדָם יְיָ לְכַהֲנָא דְזָרִיק יַת אֲדַם נִכְסַת קוּדְשַׁיָא דִילֵיהּ יְהֵי", "pj_en": "And of it he shall present one as a seperation before the Lord; the priest who sprinkleth the blood of the hallowed sacrifice shall have it.", "tj": "", "tj_en": "", "rashi": "<b>אחד מכל קרבן.<\/b> לֶחֶם אֶחָד מִכָּל מִין וָמִין יִטֹּל תְּרוּמָה לַכֹּהֵן הָעוֹבֵד עֲבוֹדָתוֹ, וְהַשְּׁאָר נֶאֱכָל לַבְּעָלִים (מנחות ע\"ז); וּבָשָׂר לַבְּעָלִים חוּץ מֵחָזֶה וְשׁוֹק שֶׁבָּהּ, כְּמוֹ שֶׁמְּפֹרָשׁ לְמַטָּה תְּנוּפַת חָזֶה וְשׁוֹק בִּשְׁלָמִים, וְהַתּוֹדָה קְרוּיָה שְׁלָמִים:", "rashi_en": "אחד מכל קרבן [AND OF IT SHALL HE OFFER] ONE OUT OF EACH OFFERING [FOR A HEAVE OFFERING UNTO THE LORD] — one bread (piece) of each of these different kinds shall he take as a heave offering for the priest who performs the rite connected with it (the קרבן), and the rest may be eaten by the owner (Menachot 77b). The flesh of the sacrifice also belongs to the owner with the exception of the breast and the shoulder of it, just as the waving of the breast and the shoulder is expressly prescribed later on, (Leviticus 7:31 Leviticus 7:32) in the case of the “peace offerings”, thus making them become the portion of the priests (cf. Leviticus 7:31 Leviticus 7:32), and the sacrifice of acknowledgement comes under the term שלמים (Zevachim 4a)."}, {"ch": 7, "v": 15, "aliyah": 3, "heb": "וּבְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔יו בְּי֥וֹם קׇרְבָּנ֖וֹ יֵאָכֵ֑ל לֹֽא־יַנִּ֥יחַ מִמֶּ֖נּוּ עַד־בֹּֽקֶר׃", "onk": "וּבְסַר נִכְסַת תּוֹדַת <b>קוּדְשׁוֹהִי<\/b> בְּיוֹם קֻרְבָּנֵיהּ יִתְאֲכֵל לָא יַצְנַע מִנֵּיהּ עַד צַפְרָא:", "onk_en": "The flesh of his thanksgiving peace[<b>sacred<\/b>]-offering on the day of its sacrifice it may be eaten. He shall not leave over any of it until morning.", "pj": "וּבְשַר נִכְסַת תּוֹדַת קוּדְשׁוֹי בְּיוֹם קוּרְבָּנֵיהּ יִתְאָכֵיל לֵית אֶפְשַׁר לְאִצְטַנְעָא מִנֵיהּ עַד צַפְרָא", "pj_en": "And the flesh of his hallowed sacrifice of thanksgiving shall be eaten on the day when it is offered; none of it may be laid up (or covered up) until the morning.", "tj": "", "tj_en": "", "rashi": "<b>ובשר זבח תודת שלמיו.<\/b> יֵשׁ כָּאן רִבּוּיִין הַרְבֵּה, לְרַבּוֹת חַטָּאת וְאָשָׁם וְאֵיל נָזִיר וַחֲגִיגַת אַרְבָּעָה עָשָׂר שֶׁיִּהְיוּ נֶאֱכָלִין לְיוֹם וְלַיְלָה (ספרא):<br><br><b>ביום קרבנו יאכל.<\/b> וְכִזְמַן בְּשָׂרָהּ זְמַן לַחְמָהּ:<br><br><b>לא יניח ממנו עד בקר.<\/b> אֲבָל אוֹכֵל הוּא כָּל הַלַּיְלָה, אִם כֵּן לָמָּה אָמְרוּ עַד חֲצוֹת? כְּדֵי לְהַרְחִיק אָדָם מִן הָעֲבֵרָה (שם):", "rashi_en": "ובשר זבח תורת שלמיו AND THE FLESH OF THE SACRIFICE OF THE PEACE OFFERING FOR ACKNOWLEDGEMENT [SHALL BE EATEN THE SAME DAY] — There are here many apparently redundant words (רבויין); they are intended to include in this law the sin-offering, the guilt-offering, the Nazarite’s ram and the חגיגה (the festive offering of the pilgrims) brought on the fourteenth of Nisan — that these should be eaten only during one day (the day of slaughtering) and the following night, just as the תודה, and not two days and the intervening night as is the period assigned for שלמים - Sifra, Tzav, Chapter 12 1; Zevachim 36a) <br><br>ביום קרבנו יאכל [AND THE FLESH …] SHALL BE EATEN ON THE DAY THAT HIS OFFERING IS EATEN — and as the period prescribed for eating its flesh is the period during which its bread may be eaten (Sifra, Tzav, Chapter 12 1).<br><br>לא יניח ממנו עד בקר HE SHALL NOT LEAVE ANY OF IT TILL THE MORNING, but during the whole night he may eat of it. But if this be so why have they (the Rabbis) said, (Zevachim 55a) “The sacrifice of acknowledgement etc. … may only be eaten during the day and the following night till midnight”? As a precaution to keep people far from the possibility of sinning (cf. Berakhot 2a)."}, {"ch": 7, "v": 16, "aliyah": 3, "heb": "וְאִם־נֶ֣דֶר&thinsp;<b>׀<\/b> א֣וֹ נְדָבָ֗ה זֶ֚בַח קׇרְבָּנ֔וֹ בְּי֛וֹם הַקְרִיב֥וֹ אֶת־זִבְח֖וֹ יֵאָכֵ֑ל וּמִֽמׇּחֳרָ֔ת וְהַנּוֹתָ֥ר מִמֶּ֖נּוּ יֵאָכֵֽל׃", "onk": "וְאִם נִדְרָא אוֹ נְדַבְתָּא נִכְסַת קֻרְבְּנֵיהּ בְּיוֹמָא דִּי יְקָרֵב יָת נִכְסְתֵיהּ יִתְאֲכֵל וּבְיוֹמָא דְבַתְרוֹהִי וּדְאִשְׁתָּאַר מִנֵּיהּ יִתְאֲכֵל:", "onk_en": "If either a vow or a voluntary offering, are the sacrifices of his offerings, it shall be eaten on the day of his offering. And on the next day, the remnant of it may [also] be eaten.", "pj": "וְאִם נִדְרָא אוֹ נְדַבְתָּא נִכְסַת קוּרְבָּנֵיהּ בְּיוֹמָא דְיַקְרֵיב יַת נִכְסְתֵיהּ יִתְאֲכֵיל וּבְיוֹם מָחֳרָן וּמַה דְמִשְׁתַּיֵיר מִנֵּיהּ יִתְאֲכֵיל בְּפַנְיָא", "pj_en": "But if his hallowed sacrifice be a vow or a free-will gift, the sacrifice may be (partly) eaten on the day when it is offered, and the remainder may be eaten on the day following at evening.", "tj": "", "tj_en": "", "rashi": "<b>ואם נדר או נדבה.<\/b> שֶׁלֹּא הֱבִיאָהּ עַל הוֹדָאָה שֶׁל נֵס, אֵינָהּ טְעוּנָה לֶחֶם, וְנֶאֱכֶלֶת לִשְׁנֵי יָמִים כְּמוֹ שֶׁמְּפֹרָשׁ בָּעִנְיָן:<br><br><b>וממחרת והנותר ממנו<\/b> בָּרִאשׁוֹן <b>יאכל.<\/b> וי\"ו זוֹ יְתֵרָה הִיא, וְיֵשׁ כָּמוֹהָ הַרְבֵּה בַּמִּקְרָא, כְּגוֹן וְאֵלֶה בְנֵי צִבְעוֹן וְאַיָּה וַעֲנָה (בראשית ל\"ו), תֵּת וְקֹדֶשׁ וְצָבָא מִרְמָס (דניאל ח'):", "rashi_en": "ואם נדר או נדבה BUT IF [THE SACRIFICE OF HIS OFFERING BE] A VOW OR A FREE WILL OFFERING — i. e., that he does not bring it as an acknowledgement of some miraculous deliverance (cf. Rashi v. 12), then it does ‘not require the offering of bread and may be eaten during two days as is set forth in the section.<br><br>וממחרת והנותר ממנו AND ON THE MORROW ALSO THE REMAINDER OF IT — i. e. what remained on the first day, יאכל MAY BE EATEN; — this ו (that of והנותר) is redundant (the text being equivalent to וממחרת הנותר ממנו יאכל); there are many similar examples in Scripture: (Genesis 36:24) “And these are the sons of Zibean: And Ajah (ואיה) and Anah”; (Daniel 8:13): “to give and the Sanctuary (וקדש) and the host to be trampled under foot”."}, {"ch": 7, "v": 17, "aliyah": 3, "heb": "וְהַנּוֹתָ֖ר מִבְּשַׂ֣ר הַזָּ֑בַח בַּיּוֹם֙ הַשְּׁלִישִׁ֔י בָּאֵ֖שׁ יִשָּׂרֵֽף׃", "onk": "וּדְאִשְׁתָּאַר מִבְּסַר נִכְסְתָא בְּיוֹמָא תְּלִיתָאָה בְּנוּרָא יִתּוֹקָד:", "onk_en": "Whatever flesh is left over from the offering shall be burned in fire, on the third day.", "pj": "וּמַה דְמִשְׁתַּיֵיר מִבְּשַר נִכְסַת קוּדְשַׁיָא בְּיוֹמָא תְּלִיתָאָה בְּנוּרָא יִתּוֹקָד", "pj_en": "And what remaineth of the flesh of the hallowed sacrifice on the third day shall be burned in fire.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 18, "aliyah": 3, "heb": "וְאִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵ֠ל מִבְּשַׂר־זֶ֨בַח שְׁלָמָ֜יו בַּיּ֣וֹם הַשְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַמַּקְרִ֣יב אֹת֗וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖וֹ פִּגּ֣וּל יִהְיֶ֑ה וְהַנֶּ֛פֶשׁ הָאֹכֶ֥לֶת מִמֶּ֖נּוּ עֲוֺנָ֥הּ תִּשָּֽׂא׃", "onk": "וְאִם אִתְאֲכָלָא יִתְאֲכֵל מִבְּסַר נִכְסַת <b>קוּדְשׁוֹהִי<\/b> בְּיוֹמָא תְלִיתָאָה לָא יְהֵא לְרַעֲוָא דִּמְקָרֵב יָתֵיהּ לָא יִתְחֲשֵׁב לֵיהּ <b>מְרָחָק<\/b> יְהֵא וֶאֱנַשׁ דְּתֵיכוּל מִנֵּיהּ חוֹבֵיהּ יְקַבֵּל:", "onk_en": "If it will be eaten, of the flesh of the peace[<b>sacred<\/b>]-offering on the third day, it will not be favorably accepted. [As to] whoever brings it, it will not be credited to him; it is an abomination [<b>rejected<\/b>] and anyone who eats of it shall bear [the burden of] its iniquity.", "pj": "וְאִין יִתְאָכְלָא יִתְאָכֵיל מִבְּשַר נִכְסַת קוּדְשׁוֹי בְּיוֹמָא תְּלִיתָאָה לָא יִתְרְעֵי מַן דְמִקְרַב יָתֵיהּ לָא יִתְחַשֵׁב לֵיהּ לִזְכוּ פְסִיל יְהֵי וְאֵינַשׁ דְיֵכוֹל מִנֵיהּ חוֹבֵיהּ יְקַבֵּל", "pj_en": "If, eating, he will eat of the flesh of his hallowed sacrifice on the third day,
