b>] Adonoy.", "pj": "וְעֶשְרוֹנָא עֶשְרוֹנָא סְמִידָא לְמִנְחָתָא פְתִיכָא בִמְשַׁח זֵיתָא לְאִמְרָא חָד עֲלָתָא לְאִתְקַבָּלָא בְּרַעֲוָא קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "and one tenth of flour with olive oil for the mincha for each lamb of the burnt offering, an oblation to be received with favour before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 14, "aliyah": 5, "heb": "וְנִסְכֵּיהֶ֗ם חֲצִ֣י הַהִין֩ יִהְיֶ֨ה לַפָּ֜ר וּשְׁלִישִׁ֧ת הַהִ֣ין לָאַ֗יִל וּרְבִיעִ֥ת הַהִ֛ין לַכֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֙דֶשׁ֙ בְּחׇדְשׁ֔וֹ לְחׇדְשֵׁ֖י הַשָּׁנָֽה׃", "onk": "וְנִסְכֵּיהוֹן פַּלְגּוּת הִינָא יְהֵי לְתוֹרָא וְתַלְתּוּת הִינָא לְדִכְרָא וְרַבְעוּת הִינָא לְאִמְּרָא חַמְרָא דָּא עֲלַת <b>רֵישׁ יַרְחָא<\/b> בְּאִתְחַדָּתוּתֵיהּ <b>כֵּן לְכָל רֵישֵׁי יַרְחֵי<\/b> שַׁתָּא:", "onk_en": "Their libations [shall be], one half of a <i>hin<\/i> for (a) bull, one third of a <i>hin<\/i> for the ram, and one fourth of a <i>hin<\/i> for (the) lamb, of wine. This is the burnt-offering of each [Rosh] Chodesh [<b>new moon<\/b>], at its renewal throughout [<b>thus all<\/b>] the months [<b>new months<\/b>] of the year.", "pj": "וְנִיסוּכֵיהוֹן דְמִתְקְרַב עִמְהוֹן פַּלְגוּת הִינָא יְהֵי לְתוֹרָא וְתַלְתּוּת הִינָא לְדִכְרָא וְרַבְעוּת הִינָא לְאִמְרָא חֲמַר עִינְבֵי דָא עֲלָתָא תֶהֱוֵי מִתְקַרְבָא בְּכָל רֵישׁ יֶרַח וְיֶרַח בִּזְמַן אִתְחַדְתוּת כָּל רֵישֵׁי יַרְחֵי שַׁתָּא", "pj_en": "And for their libation to be offered with them, the half of a bin for a bullock, the third of a bin for the ram, and the fourth of a hin for a lamb, of the wine of grapes. This burnt sacrifice shall be offered at the beginning of every month in the time of the removal of the beginning of every month in the year;", "tj": "", "tj_en": "", "rashi": "<b>זאת עלת חדש בחדשו.<\/b> שֶׁאִם עָבַר יוֹמוֹ בָּטֵל קָרְבָּנוֹ וְשׁוּב אֵין לוֹ תַשְׁלוּמִין:", "rashi_en": "זאת עלת חדש בחדשו THIS IS THE BURNT OFFERING OF EVERY MONTH IN ITS MONTH — so that if its day is past its offering is cancelled, and there is no supplementary period for it (Sifrei Bamidbar 145:2)."}, {"ch": 28, "v": 15, "aliyah": 5, "heb": "וּשְׂעִ֨יר עִזִּ֥ים אֶחָ֛ד לְחַטָּ֖את לַיהֹוָ֑ה עַל־עֹלַ֧ת הַתָּמִ֛יד יֵעָשֶׂ֖ה וְנִסְכּֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִיר בַּר עִזֵּי חַד לְחַטָּאתָא קֳדָם יְיָ עַל עֲלָתָא תְדִירָא יִתְעֲבֵד וְנִסְכֵּיהּ:", "onk_en": "And [You shall also bring] one he-goat for a sin offering to Adonoy, in addition to the constant (daily) burnt-offering it shall be done, and its libation.", "pj": "וּצְפִיר בַּר עִזֵי חָד לְחַטָאתָא קֳדָם יְיָ עַל חוּסְרַן סִיהֲרָא עַל עוֹלַת תְּדִירָא תֶּעֱבַד וְנִיסוּכֵיהּ", "pj_en": "and one kid of the goats, for a sin offering before the Lord at the disappearing (failure) of the moon, with the perpetual burnt sacrifice shalt thou perform with its libation.", "tj": "", "tj_en": "", "rashi": "<b>ושעיר עזים וגו'.<\/b> כָּל שְׂעִירֵי הַמּוּסָפִין בָּאִין לְכַפֵּר עַל טֻמְאַת מִקְדָּשׁ וְקָדָשָׁיו, הַכֹּל כְּמוֹ שֶׁמְּפֹרָשׁ בְּמַסֶּכֶת שְׁבוּעוֹת (דף ט'), וְנִשְׁתַּנָּה שְׂעִיר רֹאשׁ חֹדֶשׁ שֶׁנֶּאֱמַר בּוֹ \"לַה'\"; לְלַמֶּדְךָ שֶׁמְּכַפֵּר עַל שֶׁאֵין בּוֹ יְדִיעָה לֹא בַתְּחִלָּה וְלֹא בַסּוֹף — שֶׁאֵין מַכִּיר בַּחֵטְא אֶלָּא הַקָּבָּ\"ה בִלְבָד, וּשְׁאָר הַשְּׂעִירִים לְמֵדִין מִמֶּנוּ; וּמִדְרָשׁוֹ בָּאַגָּדָה, אָמַר הַקָּבָּ\"ה הָבִיאוּ כַפָּרָה עָלַי עַל שֶׁמִּעַטְתִּי אֶת הַיָּרֵחַ (חולין ס'):<br><br><b>על עלת התמיד יעשה.<\/b> כָּל הַקָּרְבָּן הַזֶּה:<br><br><b>ונסכו.<\/b> אֵין \"וְנִסְכּוֹ\" מוּסָב עַל הַשָּׂעִיר, שֶׁאֵין נְסָכִים לְחַטָּאת:", "rashi_en": "ושעיר עזים וגו׳ AND ONE KID OF THE GOATS [FOR A SIN OFFERING] — All goats brought as additional offerings are intended to atone for those sins committed by causing uncleanness to the Sanctuary or its holy things, — all as is set forth in Treatise Shevuot 9a. The goat of the New Moon differs from other goats brought as additional offerings in the fact that the word לה׳ is stated of it: that it is a sin offering to the Lord. The Halachic explanation of this is: it is to teach you that it only makes atonement for uncleanness where there is no consciousness of having caused it either before or after it has been done (cf. Rashi on Leviticus 16:16 and Note thereon), so that no one is cognisant of the sin except the Holy One, blessed be He, alone. (It is a חטאת לה׳, a sin offering for a sin known only to God). And that the same applies to other goats (i. e., that they atone for uncleanness under the same conditions) we derive from the law about this goat. — But its Aggadic explanation is as follows: The Holy One, blessed be He, said, “Bring an atonement offering for My sake, because I diminished the size of the Moon\" (cf. Rashi on Genesis 1:16; Shevuot 9a, Chullin 60b).<br><br>על עלת התמיד יעשה BESIDES THE CONTINUAL BURNT OFFERING SHALL IT BE DONE — It means: shall all this sacrificial rite (not the kid of the goats just mentioned) be done,<br><br>ונסכו AND ITS DRINK OFFERING — the words “and its drink-offering” do not refer to the goat, because sin-offerings have no drink-offerings."}, {"ch": 28, "v": 16, "aliyah": 6, "heb": "וּבַחֹ֣דֶשׁ הָרִאשׁ֗וֹן בְּאַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַחֹ֑דֶשׁ פֶּ֖סַח לַיהֹוָֽה׃", "onk": "וּבְיַרְחָא קַדְמָאָה בְּאַרְבַּעַת עַשְׂרָא יוֹמָא לְיַרְחָא פִּסְחָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "In the first month—on the fourteenth day of the month [bring a] <i>Pesach<\/i> [offering] to [<b>before<\/b>] Adonoy.", "pj": "וּבְיַרְחָא דְנִיסָן בְּאַרְבֵּיסְרֵי יוֹמִין לְיַרְחָא נִכְסַת פִּסְחָא קֳדָם יְיָ", "pj_en": "And in the month of Nisan, on the fourteenth day of the month, is the sacrifice of the Pascha before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 17, "aliyah": 6, "heb": "וּבַחֲמִשָּׁ֨ה עָשָׂ֥ר י֛וֹם לַחֹ֥דֶשׁ הַזֶּ֖ה חָ֑ג שִׁבְעַ֣ת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃", "onk": "וּבְחַמְשַׁת עַשְׂרָא יוֹמָא לְיַרְחָא הָדֵין חַגָּא שַׁבְעָא יוֹמִין פַּטִיר יִתְאָכֵיל:", "onk_en": "The fifteenth day of that month is a festival, <i>matzohs<\/i> shall be eaten for seven days.", "pj": "וּבַחֲמֵישַׁת עֲשַר יוֹמִין לְיַרְחָא הָדֵין חַגָא שׁוּבְעָא יוֹמִין פַּטִירֵי יִתְאָכֵל", "pj_en": "On the fifteenth day of this month is a festival; seven days shall unleavened be eaten.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 18, "aliyah": 6, "heb": "בַּיּ֥וֹם הָרִאשׁ֖וֹן מִקְרָא־קֹ֑דֶשׁ כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃", "onk": "בְּיוֹמָא קַדְמָאָה מְעָרַע קַדִּישׁ כָּל עֲבִידַת פָּלְחַן לָא תַעְבְּדוּן:", "onk_en": "The first day shall be a sacred holiday, any work of consequence you must not do.", "pj": "בְּיוֹמָא קַמָאָה דְחַגָא מְאָרַע קַדִישׁ כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "On the first day of the festival a holy convocation; no servile work shall ye do;", "tj": "", "tj_en": "", "rashi": "<b>כל מלאכת עבדה.<\/b> אֲפִלּוּ מְלָאכָה הַצְּרִיכָה לָכֶם, כְּגוֹן דָּבָר הָאָבֵד, הַמֻּתָּר בְּחֻלּוֹ שֶׁל מוֹעֵד, אֲסוּרָה בְּי\"ט:", "rashi_en": "כל מלאכת עבדה [YE SHALL DO] NO SERVILE WORK — even work that is a necessity for you, as, for instance, a matter that may become lost (that cannot be postponed without irretrievable loss) and which is permissible on the intermediate days of Passover and Tabernacles (lit., the week days of the Festival) is forbidden on the Festival itself (see Rashi on Leviticus 23:8)."}, {"ch": 28, "v": 19, "aliyah": 6, "heb": "וְהִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽיהֹוָ֔ה פָּרִ֧ים בְּנֵי־בָקָ֛ר שְׁנַ֖יִם וְאַ֣יִל אֶחָ֑ד וְשִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָכֶֽם׃", "onk": "וּתְקָרְבוּן קוּרְבָּנָא עֲלָתָא <b>קֳדָם<\/b> יְיָ תּוֹרִין בְּנֵי תוֹרֵי תְּרֵין וּדְכַר חַד וְשַׁבְעָא אִמְּרִין בְּנֵי שְׁנָא שַׁלְמִין יְהוֹן לְכוֹן:", "onk_en": "You shall bring a burnt fire-offering to [<b>before<\/b>] Adonoy [consisting of] two young bulls, one ram, and seven yearling sheep. They shall [all] be without blemish.", "pj": "וּתְקַרְבוּן קָרְבָּנָא עֲלָתָא קֳדָם יְיָ תּוֹרִין בְּנֵי תוֹרֵי תְּרֵין וּדְכַר חָד וְשׁוּבְעָא אִמְרִין בְּנֵי שְׁנָא שַׁלְמִין יְהוֹן לְכוֹן", "pj_en": "but offer an oblation of a burnt sacrifice before the Lord, two young bullocks, one ram, and seven lambs of the year, unblemished, shall you have.", "tj": "", "tj_en": "", "rashi": "<b>פרים.<\/b> כְּנֶגֶד אַבְרָהָם שֶׁנֶּאֱמַר \"וְאֶל הַבָּקָר רָץ אַבְרָהָם\" (בראשית י\"ח):<br><br><b>אילים.<\/b> כְּנֶגֶד אֵילוֹ שֶׁל יִצְחָק:<br><br><b>כבשים.<\/b> כְּנֶגֶד יַעֲקֹב שֶׁנֶּאֱמַר \"וְהַכְּשָׂבִים הִפְרִיד יַעֲקֹב\" (שם ל'); בִּיסוֹדוֹ שֶׁל רַ' מֹשֶׁה הַדַּרְשָׁן רָאִיתִי זֹאת:", "rashi_en": "פרים BULLOCKS — in allusion to Abraham, as it is said, (Genesis 18:7) “And unto the herd (the bullock) Abraham ran”,<br><br>אילים RAMS — in allusion to the ram of Isaac (Genesis 22:13).<br><br>כבשים LAMBS — in allusion to Jacob, as it is said, (Genesis 30:40) “And the lambs did Jacob set aside”. I saw this in the work of R. Moses the Preacher (see Rashi on Numbers 7:21)."}, {"ch": 28, "v": 20, "aliyah": 6, "heb": "וּמִ֨נְחָתָ֔ם סֹ֖לֶת בְּלוּלָ֣ה בַשָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַפָּ֗ר וּשְׁנֵ֧י עֶשְׂרֹנִ֛ים לָאַ֖יִל תַּעֲשֽׂוּ׃", "onk": "וּמִנְחַתְהוֹן סֻלְתָּא דְּפִילָא בִמְשָׁח תְּלָתָא עִשְׂרוֹנִין לְתוֹרָא וּתְרֵין עִשְׂרוֹנִין לְדִכְרָא תַּעְבְּדוּן:", "onk_en": "Their meal-offering shall be fine flour mixed with [olive] oil, three tenths [of an <i>eiphah<\/i>] for each bull, two tenths [of an <i>eiphah<\/i>] for the ram,", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא פְּתִיכָא בִּמְשַׁח זֵיתָא תְּלָתָא עֶשְרוֹנִין לְתוֹרָא וּתְרֵין עֶשְרוֹנִין לְדִכְרָא תַעַבְדוּן", "pj_en": "And their minchas of wheat flour, mingled with olive oil, three tenths for each bullock, two tenths for the ram,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 21, "aliyah": 6, "heb": "עִשָּׂר֤וֹן עִשָּׂרוֹן֙ תַּעֲשֶׂ֔ה לַכֶּ֖בֶשׂ הָאֶחָ֑ד לְשִׁבְעַ֖ת הַכְּבָשִֽׂים׃", "onk": "עִשְׁרוֹנָא עִשְׂרוֹנָא תַּעְבֵּד לְאִמְּרָא חַד <b>כֵּן<\/b> לְשַׁבְעָא אִמְּרִין:", "onk_en": "and one tenth [of an <i>eiphah<\/i>] [<b>thus<\/b>] for each of the seven sheep.", "pj": "וְעִשְרוֹנָא עִשְרוֹנָא תַּעֲבֵיד לְאִימַר חָד הֵיכְדֵין לְשׁוּבְעָא אִמְרִין", "pj_en": "and for a single lamb a tenth, so for the seven;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 22, "aliyah": 6, "heb": "וּשְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְכַפֵּ֖ר עֲלֵיכֶֽם׃", "onk": "וּצְפִירָא דְחַטָּאתָא חַד לְכַפָּרָא עֲלֵיכוֹן:", "onk_en": "[You should also bring] one he-goat as a sin-offering, to make atonement for you,", "pj": "וּצְפִירָא דְחַטָאתָא חָד לְכַפָּרָא עֲלֵיכוֹן", "pj_en": "and one kid of the goats, to make an atonement for you:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 23, "aliyah": 6, "heb": "מִלְּבַד֙ עֹלַ֣ת הַבֹּ֔קֶר אֲשֶׁ֖ר לְעֹלַ֣ת הַתָּמִ֑יד תַּעֲשׂ֖וּ אֶת־אֵֽלֶּה׃", "onk": "בַּר מֵעֲלַת צַפְרָא דְּהִיא עֲלַת תְּדִירָא תַּעְבְּדוּן יָת אִלֵּין:", "onk_en": "in addition to the morning burnt-offering which is offered as a constant (daily) burnt-offering, you shall make these.", "pj": "בַּר מֵעֲלַת צַפְרָא דִי לְעָלָתָא תְּדִירָא תַּעַבְדוּן יַת אִלֵין קוּרְבָּנַיָא", "pj_en": "beside the burnt sacrifice of the morning, the perpetual burnt sacrifice, you shall make these offerings.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 24, "aliyah": 6, "heb": "כָּאֵ֜לֶּה תַּעֲשׂ֤וּ לַיּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ־נִיחֹ֖חַ לַיהֹוָ֑ה עַל־עוֹלַ֧ת הַתָּמִ֛יד יֵעָשֶׂ֖ה וְנִסְכּֽוֹ׃", "onk": "כָּאִלֵּין תַּעְבְּדוּן לְיוֹמָא שַׁבְעָא יוֹמִין לְחֵם קוּרְבַּן <b>דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ עַל עֲלָתָא תְדִירָא יִתְעֲבֵד וְנִסְכֵּיהּ:", "onk_en": "Like these, you shall make daily for seven days, food as a fire-offering of a pleasing aroma [<b>accepted willingly<\/b>] to [<b>before<\/b>] Adonoy, (it shall be offered) in addition to the constant (daily) burnt-offering and its libation.", "pj": "כְּאִלְיֵן קוּרְבָּנֵי יוֹמָא קַמָאָה תַעַבְדוּן כָּל יוֹמָא שׁוּבְעָא יוֹמִין דְחַגָא לְחֵים קָרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ עַל עֲלָתָא תְּדִירָא יִתְעֲבֵיד וְנִיסוּכֵיהּ", "pj_en": "According to these oblations of the first day you shall do daily through the seven days of the festival. It is the bread of the oblation which is received with favour before the Lord; it shall be made beside the perpetual burnt offering, with its libation.", "tj": "", "tj_en": "", "rashi": "<b>כאלה תעשו ליום.<\/b> שֶׁלֹּא יִהְיוּ פוֹחֲתִין וְהוֹלְכִין כְּפָרֵי הֶחָג (ספרי):", "rashi_en": "כאלו תעשו ליום LIKE THESE YE SHALL OFFER ON EACH DAY — Like these mentioned: this implies that they are not continuously to decrease in number on each day as do the bullocks brought on the Feast of Tabernacles (Numbers 29:12—34) (Sifrei Bamidbar 147:2)."}, {"ch": 28, "v": 25, "aliyah": 6, "heb": "וּבַיּוֹם֙ הַשְּׁבִיעִ֔י מִקְרָא־קֹ֖דֶשׁ יִהְיֶ֣ה לָכֶ֑ם כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבְיוֹמָא שְׁבִיעָאָה מְעָרַע קַדִּישׁ יְהֵי לְכוֹן כָּל עִבִידַת פּוּלְחַן לָא תַעְבְּדוּן:", "onk_en": "The seventh day shall be a sacred holiday to you, when you shall not do any work of consequence.", "pj": "וּבְיוֹמָא שְׁבִיעָאָה מְאָרַע קַדִישׁ יְהֵי לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "And on the seventh day you shall have a holy convocation; no servile work shall you do.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 26, "aliyah": 6, "heb": "וּבְי֣וֹם הַבִּכּוּרִ֗ים בְּהַקְרִ֨יבְכֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽיהֹוָ֔ה בְּשָׁבֻעֹ֖תֵיכֶ֑ם מִֽקְרָא־קֹ֙דֶשׁ֙ יִהְיֶ֣ה לָכֶ֔ם כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃", "onk": "וּבְיוֹמָא דְבִכּוּרַיָּא בְּקָרוֹבֵיכוֹן מִנְחֲתָא חֲדַתָּא קֳדָם יְיָ בְּעַצְרָתֵיכוֹן מְעָרַע קַדִּישׁ יְהֵי לְכוֹן כָּל עִבִידַת פּוּלְחַן לָא תַעְבְּדוּן:", "onk_en": "On the day of the first fruits when you bring a new meal-offering to Adonoy on your Festival of Weeks, there shall be a sacred holiday to you when you shall not do any work of consequence.", "pj": "וּבְיוֹמָא דְבִכּוּרַיָא בִּקְרוּבְכוֹן דוֹרָנָא מִן עֲלַלְתָּא חַדְתָּא קֳדָם יְיָ בַּעֲצַרְתְּכוֹן כַּד יִתְמְלוּן שִׁבְעָתֵי שְׁבוּעַיָא מְאָרַע קַדִישׁ יְהֵי לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "Likewise on the day of your firstlings, when you offer the gift from the new produce before the Lord in your ingatherings, after the seven weeks are completed, you shall have a holy convocation, no servile work shall you do;", "tj": "", "tj_en": "", "rashi": "<b>וביום הבכורים.<\/b> חַג הַשָּׁבוּעוֹת קָרוּי בִּכּוּרֵי קְצִיר חִטִּים עַל שֵׁם שְׁתֵּי הַלֶּחֶם, שֶׁהֵם רִאשׁוֹנִים לְמִנְחַת חִטִּים הַבָּאִים מִן הֶחָדָשׁ (מנחות פ\"ד):", "rashi_en": "וביום הבכורים AND ON THE DAY OF THE FIRSTLINGS — The Feast of Weeks is called the firstlings of the wheat harvest (Exodus 34:22) because of the two loaves (Leviticus 23:17) which were the first of the wheat meal offerings which were brought from the new grain (Menachot 84b)."}, {"ch": 28, "v": 27, "aliyah": 6, "heb": "וְהִקְרַבְתֶּ֨ם עוֹלָ֜ה לְרֵ֤יחַ נִיחֹ֙חַ֙ לַֽיהֹוָ֔ה פָּרִ֧ים בְּנֵי־בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה׃", "onk": "וּתְקָרְבוּן עֲלָתָא <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ תּוֹרִין בְּנֵי תוֹרֵי תְּרֵין וּדְכַר חַד שַׁבְעָא אִמְּרִין בְּנֵי שְׁנָא:", "onk_en": "You shall make a burnt-offering of a pleasing aroma [<b>accepted willingly<\/b>] to [<b>before<\/b>] Adonoy [consisting of] two young bulls, one ram, [and] seven yearling lambs.", "pj": "וּתְקַרְבוּן עֲלָתָא לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ תּוֹרִין בְּנֵי תּוֹרֵי תְּרֵין וּדְכַר חָד שׁוּבְעָא אִמְרִין בְּנֵי שְׁנָא", "pj_en": "but offer a burnt sacrifice to be received with favour before the Lord, two young bullocks, one ram, seven lambs of the year;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 28, "aliyah": 6, "heb": "וּמִ֨נְחָתָ֔ם סֹ֖לֶת בְּלוּלָ֣ה בַשָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַפָּ֣ר הָֽאֶחָ֔ד שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָאַ֖יִל הָאֶחָֽד׃", "onk": "וּמִנְחַתְהוֹן סֻלְתָּא דְּפִילָא בִמְשָׁח תְּלָתָא עִשְׂרוֹנִין לְתוֹרָא חַד תְּרֵין עִשְׂרוֹנִין לְדִכְרָא חָד:", "onk_en": "Their meal-offering [shall be] fine flour mixed with [olive] oil, three tenths [of an <i>eiphah<\/i>] for each bull, two tenths [of an <i>eiphah<\/i>] for the one ram,", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא פְּתִיכָא בִּמְשַׁח זֵיתָא תְּלָתָא עֶשְרוֹנִין לְתוֹרָא חָד תְּרֵין עֶשְרוֹנִין לְדִיכְרָא חָד", "pj_en": "also their mincha of wheaten flour mingled with olive oil, three tenths for each bullock, two tenths for the ram,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 29, "aliyah": 6, "heb": "עִשָּׂרוֹן֙ עִשָּׂר֔וֹן לַכֶּ֖בֶשׂ הָאֶחָ֑ד לְשִׁבְעַ֖ת הַכְּבָשִֽׂים׃", "onk": "עִשְׂרוֹנָא עִשְׁרוֹנָא לְאִמְּרָא חַד לְשַׁבְעָא אִמְּרִין:", "onk_en": "and one tenth [of an <i>eiphah<\/i>] for each of the seven lambs.", "pj": "עִשְרוֹנָא עִשְרוֹנָא לְאִימַר חָד כְּדֵין לְשׁוּבְעָא אִימְרִין", "pj_en": "a tenth to a lamb; so for the seven lambs", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 30, "aliyah": 6, "heb": "שְׂעִ֥יר עִזִּ֖ים אֶחָ֑ד לְכַפֵּ֖ר עֲלֵיכֶֽם׃", "onk": "צְפִיר בַּר עִזִּין חַד לְכַפָּרָא עֲלֵיכוֹן:", "onk_en": "[You should also bring] one he-goat to make atonement for you,", "pj": "צְפִיר בַּר עִזֵי חָד לְכַפָּרָא עֲלֵיכוֹן", "pj_en": "one kid of the goats to make an atonement for you;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 31, "aliyah": 6, "heb": "מִלְּבַ֞ד עֹלַ֧ת הַתָּמִ֛יד וּמִנְחָת֖וֹ תַּעֲשׂ֑וּ תְּמִימִ֥ם יִהְיוּ־לָכֶ֖ם וְנִסְכֵּיהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "בַּר מֵעֲלַת תְּדִירָא וּמִנְחָתֵיהּ תַּעְבְּדוּן שַׁלְמִין יְהוֹן לְכוֹן וְנִסְכֵּיהוֹן:", "onk_en": "in addition to bringing the constant (daily) burnt-offering and its meal- offering. [The sacrifices] shall be without blemish—and their libations.", "pj": "בַּר מִן עָלַת תְּדִירָא וּמִנְחָתֵיהּ תַּעַבְדוּן שַׁלְמִין יֶהֱווֹן לְכוֹן וַחֲמַר נִיסוּכֵיהוֹן", "pj_en": "beside the perpetual burnt offering you shall make these; they shall be unblemished, with their libation of wine.", "tj": "", "tj_en": "", "rashi": "<b>תמימם יהיו לכם ונסכיהם.<\/b> אַף הַנְּסָכִים יִהְיוּ תְמִימִים, לָמְדוּ רַבּוֹתֵינוּ מִכָּאן שֶׁהַיַּיִן שֶׁהֶעֱלָה קְמָחִין פָּסוּל לִנְסָכִים (שם פ\"ז):", "rashi_en": "תמימים יהיו לכם ונסכיהם THEY SHALL BE TO YOU WITHOUT BLEMISH, AND THEIR DRINK OFFERINGS — i.e. the drink offerings, too, shall be without blemish. Our Rabbis learned from this that wine upon which mold shows itself is unfit for drink-offerings (Menachot 87a)."}, {"ch": 29, "v": 1, "aliyah": 6, "heb": "וּבַחֹ֨דֶשׁ הַשְּׁבִיעִ֜י בְּאֶחָ֣ד לַחֹ֗דֶשׁ מִֽקְרָא־קֹ֙דֶשׁ֙ יִהְיֶ֣ה לָכֶ֔ם כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָכֶֽם׃", "onk": "וּבְיַרְחָא שְׁבִיעָאָה בְּחַד לְיַרְחָא מְעָרַע קַדִּישׁ יְהֵי לְכוֹן כָּל עִבִידַת פָּלְחַן לָא תַעְבְּדוּן יוֹם <b>יַבָּבָא יְהֵי לְכוֹן<\/b>:", "onk_en": "The first day of the seventh month shall be a sacred holiday to you when you shall not do any work of consequence. It shall be a day of sounding the ram’s horn [<b>wailing for you<\/b>].", "pj": "וּבְיַרְחָא שְׁבִיעָאָה הוּא יַרְחָא דְתִשְׁרֵי בְּחַד לְיַרְחָא מְאָרַע קַדִישׁ יְהֵי לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן יוֹם יַבָּבָא יְהֵי לְכוֹן לִמְעַרְבְבָא סַטָנָא דְאָתִי לִמְקַטְרְגָא לְכוֹן בְּקַל יַבְּבוּתְכוֹן", "pj_en": "And in the seventh month, the month of Tishri, on the first of the month you shall have a holy convocation, you may not do any servile work; it shall be to you a day for the sounding of the trumpet, that by the voice of your trumpets you may disturb Satana who cometh to accuse you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 2, "aliyah": 6, "heb": "וַעֲשִׂיתֶ֨ם עֹלָ֜ה לְרֵ֤יחַ נִיחֹ֙חַ֙ לַֽיהֹוָ֔ה פַּ֧ר בֶּן־בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי־שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם׃", "onk": "וְתַעַבְּדוּן עֲלָתָא <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ תּוֹר בַּר תּוֹרֵי חַד דְּכַר חַד אִמְּרִין בְּנֵי שְׁנָא שַׁבְעָא שַׁלְמִין:", "onk_en": "You shall bring a burnt-offering of a pleasing aroma [<b>accepted willingly<\/b>] to [<b>before<\/b>] Adonoy, [consisting of] one young bull, one ram, and seven yearling lambs, [all] without blemish.", "pj": "וְתַעַבְדוּן עֲלָתָא לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ תּוֹר בַּר תּוֹרֵי חָד דְכַר חָד אִימְרִין בְּנֵי שְׁנָא שִׁבְעָא שַׁלְמִין", "pj_en": "And you shall make a burnt sacrifice to be received with favour before the Lord; one young bullock, one ram, lambs of the year seven, unblemished;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 3, "aliyah": 6, "heb": "וּמִ֨נְחָתָ֔ם סֹ֖לֶת בְּלוּלָ֣ה בַשָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַפָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָאָֽיִל׃", "onk": "וּמִנְחַתְהוֹן סֻלְתָּא דְּפִילָא בִמְשָׁח תְּלָתָא עִשְׂרוֹנִין לְתוֹרָא תְּרֵין עִשְׂרוֹנִין לְדִכְרָא:", "onk_en": "Their meal-offering [shall be] fine flour mixed with [olive] oil, three tenths [of an <i>eiphah<\/i>] for the bull, two tenths [of an <i>eiphah<\/i>] for the one ram,", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא פְּתִיכָא בִּמְשַׁח זֵיתָא תְּלָתָא עֶשְרוֹנִין לְתוֹרָא וּתְרֵין עֶשְרוֹנִין לְדִיכְרָא", "pj_en": "and their mincha of wheaten flour mingled with olive oil, three tenths for the bullock, two tenths for the ram,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 4, "aliyah": 6, "heb": "וְעִשָּׂר֣וֹן אֶחָ֔ד לַכֶּ֖בֶשׂ הָאֶחָ֑ד לְשִׁבְעַ֖ת הַכְּבָשִֽׂים׃", "onk": "וְעִשְׂרוֹנָא חַד לְאִמְּרָא חַד לְשַׁבְעָא אִמְּרִין:", "onk_en": "and one tenth [of an <i>eiphah<\/i>] for each of the seven lambs.", "pj": "וְעִשְרוֹנָא חָד לְאִימְרָא חָד הֵיכְדֵין לְשׁוּבְעַת אִמְרִין", "pj_en": "and one tenth for each of the seven lambs;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 5, "aliyah": 6, "heb": "וּשְׂעִיר־עִזִּ֥ים אֶחָ֖ד חַטָּ֑את לְכַפֵּ֖ר עֲלֵיכֶֽם׃", "onk": "וּצְפִיר בַּר עִזֵּי חַד לְחַטָּאתָא לְכַפָּרָא עֲלֵיכוֹן:", "onk_en": "[You should also bring] one he-goat as a sin-offering to make atonement for you.", "pj": "וּצְפִיר בַּר עִזֵי חָד לְחַטָאתָא לִמְכַפְּרָא עֲלֵיכוֹן", "pj_en": "and one kid of the goats for a sin offering to make an atonement for you;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 6, "aliyah": 6, "heb": "מִלְּבַד֩ עֹלַ֨ת הַחֹ֜דֶשׁ וּמִנְחָתָ֗הּ וְעֹלַ֤ת הַתָּמִיד֙ וּמִנְחָתָ֔הּ וְנִסְכֵּיהֶ֖ם כְּמִשְׁפָּטָ֑ם לְרֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בַּר מֵעֲלַת יַרְחָא וּמִנְחָתַהּ וַעֲלַת תְּדִירָא וּמִנְחָתַהּ וְנִסְכֵּיהוֹן <b>כִּדְחָזֵי לְהוֹן<\/b> <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b> קֻרְבָּנָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Aside from the [Rosh] Chodesh burnt-offering and its meal-offering, and the constant (daily) burnt-offering and its required meal-offering and libations [<b>appropriate for them<\/b>], for a pleasing aroma [<b>accepted willingly<\/b>], a fire-offering to [<b>before<\/b>] Adonoy.", "pj": "בַּר מִן עָלַת רֵישׁ יַרְחָא וּמִנְחָתָהּ וְעוֹלַת תְּדִירָא וּמִנְחָתָהּ וְנִיסוּכֵיהוֹן כְּסֵדֶר דִינְהוֹן לְאִתְקַבָּלָא בְּרַעֲוָא קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "besides the sacrifice for the beginning of the month and its mincha, and the perpetual sacrifice and its mincha; and their libations according to the order of their appointments, an oblation to be received with favour before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>מלבד עלת החדש.<\/b> מוּסְפֵי רֹאשׁ חֹדֶשׁ שֶׁהוּא בְיוֹם רֹאשׁ הַשָּׁנָה:", "rashi_en": "מלבד עלת החדש BESIDES THE BURNT OFFERING OF THE NEW MOON — besides the additional offerings of the New Moon which is on the New Year Festival (the New Moon of the seventh month)."}, {"ch": 29, "v": 7, "aliyah": 6, "heb": "וּבֶעָשׂוֹר֩ לַחֹ֨דֶשׁ הַשְּׁבִיעִ֜י הַזֶּ֗ה מִֽקְרָא־קֹ֙דֶשׁ֙ יִהְיֶ֣ה לָכֶ֔ם וְעִנִּיתֶ֖ם אֶת־נַפְשֹׁתֵיכֶ֑ם כׇּל־מְלָאכָ֖ה לֹ֥א תַעֲשֽׂוּ׃", "onk": "וּבְעַשְׂרָא לְיַרְחָא שְׁבִיעָאָה הָדֵין מְעָרַע קַדִּישׁ יְהֵי לְכוֹן וּתְעַנּוּן יָת נַפְשָׁתֵיכוֹן כָּל עִבִידְתָּא לָא תַעַבְּדוּן:", "onk_en": "On the tenth day of this seventh month there shall be a sacred holiday to you, when you shall fast and not do any work.", "pj": "וּבְעַשְרָא יוֹמִין לְיַרְחָא שְׁבִיעָאָה הוּא יַרְחָא דְתִשְׁרֵי מְאָרַע קַדִישׁ יְהֵי לְכוֹן וּתְסַגְפוּן יַת נַפְשָׁתֵיכוֹן מִן מֵיכְלָא וּמִשְׁתַּיָא מִבֵּי בַּנֵי וְתַמְרוֹקָא מִסַנְדְלָא וְתַשְׁמִישׁ דְעָרִיס כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "And on the tenth of the seventh month, the month of Tishri, you shall have a holy convocation, and chasten your souls (by abstaining) from food and drink, the bath, friction, sandals, and the marriage bed; and you shall do no servile labour,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 8, "aliyah": 6, "heb": "וְהִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽיהֹוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן־בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי־שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָכֶֽם׃", "onk": "וּתְקָרְבוּן עֲלָתָא <b>קֳדָם<\/b> יְיָ <b>לְאִתְקַבָּלָא בְרַעֲוָא<\/b> תּוֹר בַּר תּוֹרֵי חַד דְּכַר חַד אִמְּרִין בְּנֵי שְׁנָא שַׁבְעָא שַׁלְמִין יְהוֹן לְכוֹן:", "onk_en": "You shall bring a burnt-offering [<b>before<\/b>] Adonoy, for a pleasing aroma [<b>accepted willingly<\/b>], [consisting of] one young bull, one ram, and seven yearling lambs. They shall [all] be without blemish.", "pj": "וּתְקַרְבוּן עֲלָתָא קֳדָם יְיָ לְאִתְקַרְבָא בְּרַעֲוָא תּוֹר חָד בַּר תּוֹרֵי דְכַר חָד אִמְרִין בְּנֵי שְׁנָא שׁוּבְעָא שַׁלְמִין יְהוֹן לְכוֹן", "pj_en": "but offer a sacrifice before the Lord to be received with favour; one young bullock, one ram, lambs of the year seven, unblemished, shall you have;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 9, "aliyah": 6, "heb": "וּמִ֨נְחָתָ֔ם סֹ֖לֶת בְּלוּלָ֣ה בַשָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַפָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָאַ֖יִל הָאֶחָֽד׃", "onk": "וּמִנְחַתְהוֹן סֻלְתָּא דְּפִילָא בִמְשָׁח תְּלָתָא עִשְׂרוֹנִין לְתוֹרָא תְּרֵין עִשְׂרוֹנִין לְדִכְרָא חָד:", "onk_en": "Their meal-offering [shall be] fine flour mixed with [olive] oil, three tenths [of an <i>eiphah<\/i>] for the bull, two tenths [of an <i>eiphah<\/i>] for the one ram,", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִנְטַיָא פְּתִיכָא בִמְשַׁח זֵיתָא תְּלָתָא עֶשְרוֹנִין לְתוֹרָא תְּרֵין עֶשְרוֹנִין לְדִכְרָא חָד", "pj_en": "and their mincha of wheat flour mingled with olive oil, three tenths for the bullock, two tenths for one ram,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 10, "aliyah": 6, "heb": "עִשָּׂרוֹן֙ עִשָּׂר֔וֹן לַכֶּ֖בֶשׂ הָאֶחָ֑ד לְשִׁבְעַ֖ת הַכְּבָשִֽׂים׃", "onk": "עִשְׂרוֹנָא עִשְׂרוֹנָא לְאִמְּרָא חַד לְשַׁבְעָא אִמְּרִין:", "onk_en": "and one tenth [of an <i>eiphah<\/i>] for each of the seven lambs.", "pj": "עִשְרוֹנָא עִשְרוֹנָא לְאִימְרָא חָד הֵיכְדֵין לְשׁוּבְעָא אִמְרִין", "pj_en": "a singIe tenth for a lamb, so for the seven lambs", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 11, "aliyah": 6, "heb": "שְׂעִיר־עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִלְּבַ֞ד חַטַּ֤את הַכִּפֻּרִים֙ וְעֹלַ֣ת הַתָּמִ֔יד וּמִנְחָתָ֖הּ וְנִסְכֵּיהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "צְפִיר בַּר עִזִּין חַד חַטָּאתָא בַּר מֵחַטָּאתָא דְכִפּוּרַיָּא וַעֲלַת תְּדִירָא וּמִנְחָתַהּ וְנִסְכֵּיהוֹן:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, aside from the atonement sin-offering, and the constant (daily) burnt-offering and its meal-offering, and their libations.", "pj": "צְפִיר בַּר עִזֵי חַד חַטָאתָא בַּר מִקָרְבַּן חַטָאת כִּפּוּרַיָא וְעָלַת תְּדִירָא וּמִנְחַתְהוֹן וַחֲמַר נִיסוּכֵיהוֹן", "pj_en": "one kid of the goats for a sin offering; beside the sin offering of the expiations, (Lev. xvi.,) and the perpetual sacrifice and their minchas, and the wine of their libations.", "tj": "", "tj_en": "", "rashi": "<b>מלבד חטאת הכפרים.<\/b> שָׂעִיר הַנַּעֲשֶׂה בִּפְנִים הָאָמוּר בְּאַחֲרֵי מוֹת, שֶׁגַּם הוּא חַטָּאת:<br><br><b>ועלת התמיד.<\/b> וּמִלְּבַד עוֹלַת הַתָּמִיד תַּעֲשׂוּ עוֹלוֹת הַלָּלוּ:<br><br><b>ונסכיהם.<\/b> מוּסָב עַל הַמּוּסָפִין הַכְּתוּבִים וְעַל תַּעֲשׂוּ, וְהוּא לְשׁוֹן צִוּוּי — מִלְּבַד עוֹלַת הַתָּמִיד וּמִנְחָתָהּ תַּעֲשׂוּ אֶת אֵלֶּה וְנִסְכֵּיהֶם, וְכֵן כָּל נִסְכֵּיהֶם הָאֲמוּרִים בְּכָל הַמּוֹעֲדוֹת חוּץ מִשֶּׁל קָרְבְּנוֹת הֶחָג, שֶׁכָּל וְנִסְכָּהּ, וְנִסְכֵּיהֶם, וּנְסָכֶיהָ שֶׁבָּהֶם מוּסַבִּים עַל הַתָּמִיד, וְאֵינָן לְשׁוֹן צִוּוּי, שֶׁהֲרֵי נִסְכֵּיהֶם שֶׁל מוּסָפִין כְּתוּבִין לְעַצְמָן בְּכָל יוֹם וָיוֹם:", "rashi_en": "מלבד חטאת הכפורים BESIDES THE SIN OFFERING OF EXPIATION — i.e. the goat whose rite was performed within the Holy of Holies, which is mentioned in the Sedrah אחרי מות — for it, too, was a חטאת, a sin offering, (Leviticus 16:9). <br><br>ועלת התמיד AND THE CONTINUAL BURNT OFFERING — This means: and besides the continual burnt offering, ye shall offer these burnt offerings mentioned in v. 8.<br><br>ונסכיהם AND THEIR DRINK OFFERINGS — This word refers to the additional offerings which have been written about (v. 8) and to the word תעשו (which Rashi has supplied). It expresses a command: [besides the sin offering of expiation and] besides the continual burnt offering [and its drink offering] ye shall offer these (mentioned in v. 8) and their drink-offerings. Similar, too, is the meaning every time the expression נסכיהם is mentioned in connection with the offerings of the Festivals (that it alludes to the drink-offerings brought with the additional sacrifices of that Festival), except when used of those of the Feast of Tabernacles, (vv. 17—38) where all such expressions, — ונסכה and ונסכיהם and ונסכיה — which occur in the paragraph about them refer to the תמיד (cf. e.g., v. 15: עלת התמיד מנחתה ונסכה). Nor do they there express a command, for, indeed, the drink offerings that accompany the additional offerings are written down separately for each day (i.e., are specifically commanded for each day, cf. e. g., v. 18: ומנחתם)."}, {"ch": 29, "v": 12, "aliyah": 7, "heb": "וּבַחֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַחֹ֣דֶשׁ הַשְּׁבִיעִ֗י מִֽקְרָא־קֹ֙דֶשׁ֙ יִהְיֶ֣ה לָכֶ֔ם כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְחַגֹּתֶ֥ם חַ֛ג לַיהֹוָ֖ה שִׁבְעַ֥ת יָמִֽים׃", "onk": "וּבְחַמְשַׁת עַשְׂרָא יוֹמָא לְיַרְחָא שְׁבִיעָאָה מְעָרַע קַדִּישׁ יְהֵי לְכוֹן כָּל עִבִידַת פּוּלְחָנָא לָא תַעַבְּדוּן וּתְחַגּוּן חַגָּא <b>קֳדָם<\/b> יְיָ שַׁבְעָא יוֹמִין:", "onk_en": "The fifteenth day of the seventh month shall be a sacred holiday to you, when you shall not do any work of consequence. You shall celebrate a festival to [<b>before<\/b>] Adonoy", "pj": "וּבַחֲמֵיסַר יוֹמָא לְיַרְחָא שְׁבִיעָאָה מְאָרַע קַדִישׁ יְהֵי לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן וּתְחַגוּן חַגָא דִמְטָלַיָא קֳדָם יְיָ שׁוּבְעָא יוֹמִין", "pj_en": "And on the fifteenth day of the seventh month you shall have a holy convocation, no servile work shall you do; but shall celebrate the Feast of Tabernacles before the Lord seven days,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 13, "aliyah": 7, "heb": "וְהִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֙חַ֙ לַֽיהֹוָ֔ה פָּרִ֧ים בְּנֵי־בָקָ֛ר שְׁלֹשָׁ֥ה עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי־שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִ֥ם יִהְיֽוּ׃", "onk": "וּתְקָרְבוּן עֲלָתָא קוּרְבַּן <b>דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ תּוֹרִין בְּנֵי תוֹרֵי תְּלַת עֲשַׂר דִּכְרִין תְּרֵין אִמְּרִין בְּנֵי שְׁנָא אַרְבְּעָא עֲשַׂר שַׁלְמִין יְהוֹן:", "onk_en": "You shall bring a burnt-offering, a fire-offering for a pleasing aroma [<b>accepted willingly<\/b>] to [<b>before<\/b>] Adonoy, [consisting of] thirteen young bulls, two rams, and fourteen yearling lambs. They shall [all] be without blemish.", "pj": "וּתְקַרְבוּן עֲלָתָא קֻרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ תּוֹרִין בְּנֵי תּוֹרֵי תַּלְתֵיסַר אָזְלִין כָּל יוֹמָא וְחַסְרִין סְכוּמְהוֹן שׁוּבְעִין עַל שׁוּבְעִין עַמְמִין וּמְקַרְבִין יַתְהוֹן תְּלֵיסַר מַטַרְתָּא דִכְרִין תְּרֵין דִמְקַרְבִין תְּרֵין מַטַרְתָּא אִמְרִין בְּנֵי שְׁנָא אַרְבֵּיסַר שַׁלְמִין דִמְקַרְבִין תַּמְנֵי מַטַרְתָּא שִׁיתָּא מִנְהוֹן מְקַרְבִין תְּרֵי תְּרֵי וּתְרֵין מִנְהוֹן חַד חַד שַׁלְמִין יְהוֹן", "pj_en": "and offer a sacrifice, an oblation to be received with favour before the Lord: thirteen young bullocks proceeding daily and diminishing their number, (in all) seventy for the seventy nations, and offering them by thirteen orders; two rams, which you shall offer by two orders; lambs of the year fourteen, unblemished, to be offered by eight orders, offering six of them, by two and two, and two of them one by one, they shall be perfect.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 14, "aliyah": 7, "heb": "וּמִ֨נְחָתָ֔ם סֹ֖לֶת בְּלוּלָ֣ה בַשָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַפָּ֣ר הָֽאֶחָ֗ד לִשְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָאַ֣יִל הָֽאֶחָ֔ד לִשְׁנֵ֖י הָאֵילִֽם׃", "onk": "וּמִנְחַתְהוֹן סוּלְתָּא דְּפִילָא בִמְשָׁח תְּלָתָא עִשְׂרוֹנִין לְתוֹרָא חַד לִתְלָתָא עֲשַׂר תּוֹרִין תְּרֵין עִשְׂרוֹנִין לְדִכְרָא חַד לִתְרֵין דִּכְרִין:", "onk_en": "Their meal-offering [shall be] fine flour mixed with [olive] oil, three tenths [of an <i>eiphah<\/i>] for the bull for each of the thirteen bulls, two tenths [of an <i>eiphah<\/i>] for the ram for each of the two rams,", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא פְּתִיכָא בִּמְשַׁח זֵיתָא תְּלָתָא עֶשְרוֹנִין לְתוֹרָא חַד לִתְּלֵיסַר תּוֹרִין תְּרֵין עֶשְרוֹנִין לְדִיכְרָא חָד לִתְרֵין דִיכְרִין", "pj_en": "Their mincha also of wheat flour, with olive oil, three tenths for each bullock of the thirteen, two tenths for each ram,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 15, "aliyah": 7, "heb": "וְעִשָּׂרוֹׄן֙ עִשָּׂר֔וֹן לַכֶּ֖בֶשׂ הָאֶחָ֑ד לְאַרְבָּעָ֥ה עָשָׂ֖ר כְּבָשִֽׂים׃", "onk": "וְעִשְׂרוֹנָא עִשְׂרוֹנָא לְאִמְּרָא חַד לְאַרְבְּעַת עֲשַׂר אִמְּרִין:", "onk_en": "and one tenth [of an <i>eiphah<\/i>] for the lamb for each of the fourteen lambs.", "pj": "וְעִשְרוֹנָא עִשְרוֹנָא לְאִימַר חַד לְאַרְבֵּיסַר אִימְרִין", "pj_en": "a single tenth for each of the fourteen lambs,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 16, "aliyah": 7, "heb": "וּשְׂעִיר־עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד מִנְחָתָ֖הּ וְנִסְכָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִיר בַּר עִזִּין חַד חַטָּאתָא בַּר מֵעֲלַת תְּדִירָא מִנְחָתַהּ וְנִסְכַּהּ:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and libation.", "pj": "וּצְפִיר בַּר עִזֵי חַד חַטָאתָא דִמְקָרֵב מַטַרְתָּא חַד בַּר מֵעָלַת תְּדִירָא וּסְמִידָא דְחִינְטַיָא לְמִנְחָתָא וַחֲמַר נִיסוּכָא", "pj_en": "and one kid of the goats for a sin offering, which shall be offered by one order, beside the perpetual sacrifice, the wheat flour for the mincha, and the wine of the libation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 17, "aliyah": 7, "heb": "וּבַיּ֣וֹם הַשֵּׁנִ֗י פָּרִ֧ים בְּנֵי־בָקָ֛ר שְׁנֵ֥ים עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי־שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם׃", "onk": "וּבְיוֹמָא תִנְיָנָא תּוֹרִין בְּנֵי תוֹרֵי תְּרֵי עֲשַׂר דִּכְרִין תְּרֵין אִמְּרִין בְּנֵי שְׁנָא אַרְבְּעָא עֲשַׂר שַׁלְמִין:", "onk_en": "On the second day [you shall bring] twelve young bulls, two rams, and fourteen yearling lambs, [all] without blemish,", "pj": "וּבְיוֹמָא תִּנְיָינָא דְחַגָא דִמְטָלַיָיא תִּקְרְבוּן תּוֹרִין בְּנֵי תּוֹרֵי תְּרֵיסַר לִתְרֵיסַר מַטַרְתָּא דִכְרִין תְּרֵין לִתְרֵי מַטַרְתָּא אִמְרִין בְּנֵי שְׁנָא אַרְבֵּיסַר שַׁלְמִין לְתִשְׁעַת מַטַרְתָּא חַמְשָׁא מִנְהוֹן מְקַרְבִין תְּרֵי תְּרֵי וְאַרְבַּע מִנְהוֹן חָד חָד", "pj_en": "On the second day of the Feast of Tabernacles you shall offer twelve young bullocks, by twelve orders; two rams, by two orders; fourteen lambs of the year unblemished by nine orders, five of them shall offer two by two, and four of them one by one.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 18, "aliyah": 7, "heb": "וּמִנְחָתָ֣ם וְנִסְכֵּיהֶ֡ם לַ֠פָּרִ֠ים לָאֵילִ֧ם וְלַכְּבָשִׂ֛ים בְּמִסְפָּרָ֖ם כַּמִּשְׁפָּֽט׃", "onk": "וּמִנְחַתְהוֹן וְנִסְכֵּיהוֹן לְתוֹרִין לְדִכְרִין וּלְאִמְּרִין בְּמִנְיָנֵיהוֹן כִּדְחָזֵי:", "onk_en": "together with their meal-offerings and their libitions for the bulls, rams, and the lambs, of the required number.", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא וַחֲמַר נִיסוּכֵיהוֹן מַה דִי תֶהֱווֹן מְקַרְבִין עִם תּוֹרַיָא עִם דִיכְרַיָא וְאִמְרַיָא בְּמִנְיָנֵיהוֹן כְּסֵדֶר דִינָא", "pj_en": "And their mincha of wheat flour, and the wine of their libation which shall be offered with the bullocks, rams, and lambs, by their number according to the order of their appointment;", "tj": "", "tj_en": "", "rashi": "<b>ומנחתם ונסכיהם לפרים.<\/b> פָּרֵי הֶחָג שִׁבְעִים הֵם כְּנֶגֶד שִׁבְעִים אֻמּוֹת, וּמִתְמַעֲטִים וְהוֹלְכִים, סִימָן כְּלָיָה הִיא לָהֶם, וּבִימֵי הַמִּקְדָּשׁ הָיוּ מְגִנִּים עֲלֵיהֶם מִן הַיִּסּוּרִין (סוכה נ\"ה):<br><br><b>ולכבשים.<\/b> כְּנֶגֶד יִשְׂרָאֵל שֶׁנִּקְרְאוּ \"שֶׂה פְזוּרָה\" (ירמיהו נ'), וְהֵם קְבוּעִים, וּמִנְיָנָם תִּשְׁעִים וּשְׁמוֹנָה, לְכַלּוֹת מֵהֶם תִּשְׁעִים וּשְׁמוֹנֶה קְלָלוֹת שֶׁבְּמִשְׁנֵה תוֹרָה; בַּשֵּׁנִי נֶאֱמַר וְנִסְכֵּיהֶם עַל שְׁנֵי תְמִידֵי הַיּוֹם, וְלֹא שִׁנָּה הַלָּשׁוֹן אֶלָּא לִדְרֹשׁ, כְּמוֹ שֶׁאָמְרוּ רַבּוֹתֵינוּ זִ\"לִ (ספרי; שבת ק\"נ) בַּשֵּׁנִי וְנִסְכֵּיהֶם, בַּשִּׁשִּׁי וּנְסָכֶיהָ, בַּשְּׁבִיעִי כְּמִשְׁפָּטָם, מֵ\"ם יוֹ\"ד מֵ\"ם הֲרֵי כָאן מַיִם, רֶמֶז לְנִסּוּךְ הַמַּיִם מִן הַתּוֹרָה בֶּחָג:", "rashi_en": "ומנחתם ונסכיהם לפרים AND THEIR MEAL OFFERING AND THEIR DRINK OFFERINGS FOR THE BULLOCKS — The bullocks offered on the Feast of Tabernacles are seventy in all, in allusion to the seventy nations of the world, and they gradually decrease in number each day, an omen to them of gradual annihilation, but during the period when the Temple existed and these sacrifices were offered they protected them against this misfortune (cf. Sukkah 55b).<br><br>ולכבשים AND FOR THE LAMBS — in allusion to the Israelites who are called ( 50:17) “scattered lambs”. — They (the lambs) are of fixed number each day (a symbol that the Israelites are fixed, imperishable), and their total is ninety-eight, serving to avert from them the ninety-eight curses which are set forth in Deuteronomy (Deuteronomy 28:15 ff.) — In the paragraph dealing with the second day of the Festival, it is said, (v. 19) ונסכיהם, and this is in reference to the two daily continual offerings (while the usual term is ונסכה corresponding to ומנחתה that precedes it), and it sometimes uses a modification of the terms usually employed in those paragraphs only in order that some teaching may be deduced from it, as our Rabbis, may their memory be for a blessing, said: in the case of the second day we have ונסכיהם, of the sixth ונסכיה, of the seventh כמשפטם (instead of the usual כמשפטה): the additional letters are מ and י and מ — so you have here מים, “water”, — a suggestion that the libation of water on Tabernacles is of Biblical origin (מן התורה) (Sifrei Bamidbar 150; Shabbat 103b)."}, {"ch": 29, "v": 19, "aliyah": 7, "heb": "וּשְׂעִיר־עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד וּמִנְחָתָ֖הּ וְנִסְכֵּיהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִיר בַּר עִזִּין חַד חַטָּאתָא בַּר מֵעֲלַת תְּדִירָא וּמִנְחָתַהּ וְנִסְכֵּיהוֹן:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and their libations.", "pj": "וּצְפִיר בַּר עִזֵי חָד לִמְטַרְתָּא חָד חַטָאתָא בַּר מֵעָלַת תְּדִירָא וּסְמִידָא דְחִינְטַיָא לְמִנְחַתְהוֹן וַחֲמַר נִיסוּכֵיהוֹן", "pj_en": "and one ram by one order, a sin offering, beside the perpetual sacrifice, and the wheat flour of their minchas, and their libations of wine.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 20, "aliyah": 7, "heb": "וּבַיּ֧וֹם הַשְּׁלִישִׁ֛י פָּרִ֥ים עַשְׁתֵּי־עָשָׂ֖ר אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי־שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם׃", "onk": "וּבְיוֹמָא תְלִיתָאָה תּוֹרִין חַד עֲשַׂר דִּכְרִין תְּרֵין אִמְּרִין בְּנֵי שְׁנָא אַרְבְּעָא עֲשַׂר שַׁלְמִין:", "onk_en": "On the third day [you shall bring] eleven young bulls, two rams, and fourteen yearling lambs, [all] without blemish,", "pj": "וּבְיוֹמָא תְלִיתָאָה דְחַגָא דִמְטָלַיָא תִּקְרְבוּן תּוֹרִין חַדְסַר לְחַדְסַר מַטַרְתָּא דִכְרִין תְּרֵין לִתְרֵין מַטַרְתָּא אִמְרִין בְּנֵי שְׁנָא אַרְבֵּיסַר שַׁלְמִין לַעֲשַר מַטַרְתָּא אַרְבְּעָא מִנְהוֹן מְקַרְבִין תְּרֵי תְּרֵי וְשִׁית מִנְהוֹן חָד חָד", "pj_en": "On the third day of the Feast of Tabernacles you shall offer twelve bullocks by twelve orders; two rams by two orders, fourteen unblemished lambs of the year, by ten orders; four of them shall offer two and two, and six of them one by one;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 21, "aliyah": 7, "heb": "וּמִנְחָתָ֣ם וְנִסְכֵּיהֶ֡ם לַ֠פָּרִ֠ים לָאֵילִ֧ם וְלַכְּבָשִׂ֛ים בְּמִסְפָּרָ֖ם כַּמִּשְׁפָּֽט׃", "onk": "וּמִנְחַתְהוֹן וְנִסְכֵּיהוֹן לְתוֹרִין לְדִכְרִין וּלְאִמְּרִין בְּמִנְיָנֵיהוֹן כִּדְחָזֵי:", "onk_en": "together with their meal-offerings and libations for the bulls, rams, and lambs, of the required number.", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא וַחֲמַר נִיסוּכֵיהוֹן מַה דִי תְקַרְבוּן עִם תּוֹרֵי וְדִכְרֵי וְאִמְרֵי בְּמִנְיָנֵיהוֹן כְּסֵדֶר דִינָא", "pj_en": "and their mincha of wheat flour, and their libations of wine, you shall offer with the bullocks, rams, and lambs, by the number in their appointed order;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 22, "aliyah": 7, "heb": "וּשְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד וּמִנְחָתָ֖הּ וְנִסְכָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִירָא דְחַטָּאתָא חַד בַּר מֵעֲלַת תְּדִירָא וּמִנְחָתַהּ וְנִסְכַּהּ:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and libation.", "pj": "וּצְפִירָא דְחַטָאתָא חַד לִמְטַרְתָּא חַד בַּר מִן עוֹלַת תְּדִירָא וּסְמִידָא דְחִינְטַיָא לְמִנְחָתָא וַחֲמַר נִיסוּכָהּ", "pj_en": "and one kid of the goats for a sin offering by one order; beside the perpetual sacrifice the wheat flour for the mincha, and its libation of wine.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 23, "aliyah": 7, "heb": "וּבַיּ֧וֹם הָרְבִיעִ֛י פָּרִ֥ים עֲשָׂרָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי־שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם׃", "onk": "וּבְיוֹמָא רְבִיעָאָה תּוֹרִין עַשְׂרָא דִּכְרִין תְּרֵין אִמְּרִין בְּנֵי שְׁנָא אַרְבְּעָא עֲשַׂר שַׁלְמִין:", "onk_en": "On the fourth day [you shall bring] ten young bulls, two rams, and fourteen yearling lambs, [all] without blemish,", "pj": "וּבְיוֹמָא רְבִיעָאָה דְחַגָא דִמְטָלַיָא תּוֹרֵי עַשְרָא לַעֲשַר מַטַרְתָּא דִכְרִין תְּרֵין לִתְרֵי מַטַרְתָּא אִמְרִין בְּנֵי שְׁנָא אַרְבֵּיסַר שַׁלְמִין לְחַדְסַר מַטַרְתָּא תְּלַת מִנְהוֹן מְקַרְבִין תְּרֵי תְּרֵי וְתַמְנֵי מִנְהוֹן מְקַרְבִין חָד חָד", "pj_en": "On the fourth day of the Feast of Tabernacles, ten young bullocks by ten orders; two rams by two orders; fourteen unblemished lambs of the year by twelve orders; three of them shall be offered at two times, and eight of them singly;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 24, "aliyah": 7, "heb": "מִנְחָתָ֣ם וְנִסְכֵּיהֶ֡ם לַ֠פָּרִ֠ים לָאֵילִ֧ם וְלַכְּבָשִׂ֛ים בְּמִסְפָּרָ֖ם כַּמִּשְׁפָּֽט׃", "onk": "מִנְחַתְהוֹן וְנִסְכֵּיהוֹן לְתוֹרִין לְדִכְרִין וּלְאִמְּרִין בְּמִנְיָנֵיהוֹן כִּדְחָזֵי:", "onk_en": "together with their meal-offerings and libations for the bulls, rams, and lambs, of the required number.", "pj": "מִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא וַחֲמַר נִיסוּכֵיהוֹן מַה דִי תְקַרְבוּן עִם תּוֹרֵי וְדִכְרֵי וְאִמְרֵי בְּמִנְיָנֵיהוֹן כְּסֵדֶר דִינָא", "pj_en": "their mincha of wheaten flour, and their libations of wine, which you shall offer with the bullocks, rams, and lambs by their number, after their appointed order,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 25, "aliyah": 7, "heb": "וּשְׂעִיר־עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד מִנְחָתָ֖הּ וְנִסְכָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִיר בַּר עִזִּין חַד חַטָּאתָא בַּר מֵעֲלַת תְּדִירָא מִנְחָתַהּ וְנִסְכַּהּ:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and libation.", "pj": "וּצְפִיר בַּר עִזֵי חַד לִמְטַרְתָּא חַד חַטָאתָא בַּר מִן עֲלַת תְּדִירָא וּסְמִידָא דְחִינְטַיָא לְמִנְחָתָא וַחֲמַר נִיסוּכָהּ", "pj_en": "and one kid for a sin offering, by one order; beside the perpetual sacrifice, the wheat flour for the mincha, and its libation of wine.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 26, "aliyah": 7, "heb": "וּבַיּ֧וֹם הַחֲמִישִׁ֛י פָּרִ֥ים תִּשְׁעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵֽי־שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם׃", "onk": "וּבְיוֹמָא חֲמִישָׁאָה תּוֹרִין תְּשַׁע דִּכְרִין תְּרֵין אִמְּרִין בְּנֵי שְׁנָא אַרְבְּעָא עֲשַׂר שַׁלְמִין:", "onk_en": "On the fifth day [you shall bring] nine young bulls, two rams, and fourteen yearling lambs, [all] without blemish,", "pj": "וּבְיוֹמָא חֲמִישָׁאָה דְחַגָא דִמְטָלַיָא תּוֹרִין תִּשְׁעָה לְתִשְׁעַת מַטַרְתָּא דִכְרִין תְּרֵין לִתְרֵי מַטַרְתָּא אִמְרִין בְּנֵי שְׁנָא אַרְבֵּיסַר שַׁלְמִין לִתְרֵיסַר מַטַרְתָּא תְּרֵי מִנְהוֹן מְקַרְבִין תְּרֵי תְּרֵי וְעַשְרָא מִנְהוֹן חָד חָד", "pj_en": "On the fifth day of the Feast of Tabernacles, nine young bullocks by nine orders; two rams by two orders lambs of the year fourteen, perfect by twelve orders two of them in a pair, twelve singly;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 27, "aliyah": 7, "heb": "וּמִנְחָתָ֣ם וְנִסְכֵּיהֶ֡ם לַ֠פָּרִ֠ים לָאֵילִ֧ם וְלַכְּבָשִׂ֛ים בְּמִסְפָּרָ֖ם כַּמִּשְׁפָּֽט׃", "onk": "וּמִנְחַתְהוֹן וְנִסְכֵּיהוֹן לְתוֹרִין לְדִכְרִין וּלְאִמְּרִין בְּמִנְיָנֵיהוֹן כִּדְחָזֵי:", "onk_en": "together with their meal-offerings and libations for the bulls, rams, and lambs, of the required number.", "pj": "וּסְמִידָא דְחִינְטַיָא לְמִנְחַתְהוֹן וַחֲמַר נִיסוּכֵיהוֹן מַה דִתְקַרְבוּן עִם תּוֹרֵי וְדִכְרֵי וְאִמְרֵי בְּמִנְיָנֵיהוֹן כְּסֵדֶר דִינָא", "pj_en": "and the wheat flour for their mincha, and the libation wine for the bullocks, the rams, and lambs by their number after the order of their appointment;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 28, "aliyah": 7, "heb": "וּשְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד וּמִנְחָתָ֖הּ וְנִסְכָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִירָא דְחַטָּאתָא חַד בַּר מֵעֲלַת תְּדִירָא וּמִנְחָתַהּ וְנִסְכַּהּ:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and libation.", "pj": "וּצְפִירָא דְחַטָאתָא חַד לִמְטַרְתָּא חֲדָא בַּר מִן עֲלַת תְּדִירָא וּסְמִידָא דְחִינְטָתָא לְמִנְחָתָא וַחֲמַר נִיסוּכָהּ", "pj_en": "and one kid for a sin offering by one order; beside the perpetual sacrifice and the wheat flour for the mincha, and the wine of its libation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 29, "aliyah": 7, "heb": "וּבַיּ֧וֹם הַשִּׁשִּׁ֛י פָּרִ֥ים שְׁמֹנָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי־שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם׃", "onk": "וּבְיוֹמָא שְׁתִיתָאָה תּוֹרִין תְּמַנְיָא דִּכְרִין תְּרֵין אִמְּרִין בְּנֵי שְׁנָא אַרְבְּעָא עֲשַׂר שַׁלְמִין:", "onk_en": "On the sixth day [you shall bring] eight young bulls, two rams, and fourteen yearling lambs, [all] without blemish,", "pj": "וּבְיוֹמָא שְׁתִיתָאֵי דְחַגָא דִמְטָלַיָא תּוֹרִין תְּמַנְיָא לְתַמְנֵי מַטַרְתָּא דִכְרִין תְּרֵין לִתְרֵי מַטַרְתָּא אִמְרִין בְּנֵי שְׁנָא אַרְבֵּיסַר שַׁלְמִין לִתְלֵיסַר מַטַרְתָּא חֲדָא מִנְהוֹן מְקַרְבָא תְּרֵי וּתְרֵיסַר מִנְהוֹן חָד חָד", "pj_en": "On the sixth day of the Feast of Tabernacles, eight young bullocks by eight orders; two rams by two orders; fourteen unblemished lambs of the year by thirteen orders; a pair of them together, and twelve of them singly.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 30, "aliyah": 7, "heb": "וּמִנְחָתָ֣ם וְנִסְכֵּיהֶ֡ם לַ֠פָּרִ֠ים לָאֵילִ֧ם וְלַכְּבָשִׂ֛ים בְּמִסְפָּרָ֖ם כַּמִּשְׁפָּֽט׃", "onk": "וּמִנְחַתְהוֹן וְנִסְכֵּיהוֹן לְתוֹרִין לְדִכְרִין וּלְאִמְּרִין בְּמִנְיָנֵיהוֹן כִּדְחָזֵי:", "onk_en": "together with their meal-offerings and libations for the bulls, rams, and lambs. of the required number.", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטַיָא וַחֲמַר נִיסוּכֵיהוֹן מַה דִתְקַרְבוּן עִם תּוֹרֵי וְדִכְרֵי וְאִמְרֵי בְּמִנְיָנֵיהוֹן כְּסֵדֶר דִינָא", "pj_en": "Their mincha of wheat flour, and their libation of wine you shall offer with the bullocks, rams, and lambs, by their number in the order appointed;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 31, "aliyah": 7, "heb": "וּשְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד מִנְחָתָ֖הּ וּנְסָכֶֽיהָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִירָא דְחַטָּאתָא חַד בַּר מֵעֲלַת תְּדִירָא מִנְחָתַהּ וְנִסְכָּהָא:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and libations.", "pj": "וּצְפִירָא דְחַטָאתָא חַד לִמְטַרְתָּא חֲדָא בַּר מִן עֲלַת תְּדִירָא וּסְמִידָא דְחִינְטָתָא לְמִנְחָתָא וַחֲמַר נִיסוּכָהּ וּצְלוּחִיתָא דְמַיָא הֲווֹן מְנַסְכִין בְּיוֹמָא דְחַגָא דִמְטָלַיָא דוּכְרָן טַב לִרְבִיעָא דְמִטְרָא", "pj_en": "and one kid for a sin offering by one order, besides the perpetual sacrifice, the wheat flour for the mincha, the wine of its libation, and a vase of water to be outpoured on the day of the Feast of Tabernacles in grateful acknowledgment (for a good memorial) of the showers of rain.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 32, "aliyah": 7, "heb": "וּבַיּ֧וֹם הַשְּׁבִיעִ֛י פָּרִ֥ים שִׁבְעָ֖ה אֵילִ֣ם שְׁנָ֑יִם כְּבָשִׂ֧ים בְּנֵי־שָׁנָ֛ה אַרְבָּעָ֥ה עָשָׂ֖ר תְּמִימִֽם׃", "onk": "וּבְיוֹמָא שְׁבִיעָאָה תּוֹרִין שַׁבְעָא דִּכְרִין תְּרֵין אִמְּרִין בְּנֵי שְׁנָא אַרְבְּעָא עֲשַׂר שַׁלְמִין:", "onk_en": "On the seventh day [you shall bring] seven young bulls, two rams, and fourteen yearling lambs, [all] without blemish,", "pj": "וּבְיוֹמָא שְׁבִיעָאָה דְחַגָא דִמְטָלַיָא תְּקַרְבוּן תּוֹרִין שׁוּבְעָא לִשְׁבַע מַטַרְתָּא דִכְרִין תְּרֵין לִתְרֵי מַטַרְתָּא אִמְרִין בְּנֵי שְׁנָא אַרְבֵּיסַר שַׁלְמִין לְאַרְבֵּיסַר מַטַרְתָּא סְכוּמְהוֹן דְכָל אִימְרַיָא תַּמְנֵי וְתִשְׁעִין לִמְכַפְּרָא עַל תַּמְנֵי וְתִשְׁעִין לְוָוטַיָא", "pj_en": "On the seventh day of the Feast of Tabernacles you shall offer seven bullocks by seven orders; two rams by two orders; fourteen unblemished lambs of the year by fourteen orders: the number of all these lambs ninety-eight, to make atonement against the ninety-eight maledictions.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 33, "aliyah": 7, "heb": "וּמִנְחָתָ֣ם וְנִסְכֵּהֶ֡ם לַ֠פָּרִ֠ים לָאֵילִ֧ם וְלַכְּבָשִׂ֛ים בְּמִסְפָּרָ֖ם כְּמִשְׁפָּטָֽם׃", "onk": "וּמִנְחַתְהוֹן וְנִסְכֵּיהוֹן לְתוֹרִין לְדִכְרִין וּלְאִמְּרִין בְּמִנְיָנֵיהוֹן כִּדְחָזֵי לְהוֹן:", "onk_en": "together with their meal-offerings and libations for the bulls, rams, and lambs. of their required number.", "pj": "וּמִנְחַתְהוֹן סְמִידָא דְחִינְטָתָא וַחֲמַר נִיסוּכֵיהוֹן מַה דִתְקַרְבוּן עִם תּוֹרֵי וְדִכְרֵי וְאִמְרֵי בְּמִנְיָנֵיהוֹן כְּסֵדֶר דִינְהוֹן", "pj_en": "And their mincha of wheat flour and libations of wine you shall offer with the bullocks, rains, and lambs, by their number,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 34, "aliyah": 7, "heb": "וּשְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד מִנְחָתָ֖הּ וְנִסְכָּֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּצְפִירָא דְחַטָּאתָא חַד בַּר מֵעֲלַת תְּדִירָא מִנְחָתַהּ וְנִסְכָּהּ:", "onk_en": "[You shall also bring] one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and libation.", "pj": "וּצְפִירָא דְחַטָאתָא חַד לִמְטַרְתָּא חֲדָא בַּר מִן עֲלַת תְּדִירָא וּסְמִידָא דְחִינְטַיָא לְמִנְחָתָא וַחֲמַר נִיסוּכָהּ", "pj_en": "according to the order appointed one kid by one order, beside the perpetual sacrifice, the wheat flour for the mincha, and its libation of wine.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 35, "aliyah": 7, "heb": "בַּיּוֹם֙ הַשְּׁמִינִ֔י עֲצֶ֖רֶת תִּהְיֶ֣ה לָכֶ֑ם כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃", "onk": "בְּיוֹמָא תְּמִינָאָה <b>כְּנִישׁוּ<\/b> תְהֵי לְכוֹן כָּל עִבִידַת פּוּלְחַן לָא תַעַבְּדוּן:", "onk_en": "On the eighth day shall be a [day of] restraint [<b>assembly<\/b>] for you, when you shall not do any work of consequence.", "pj": "בְּיוֹמָא תְמִינָאָה כְּנִישִׁין תֶּהֱווֹן בְּחֶדְוָא מִן מַטִילְכוֹן לְבָתֵּיכוֹן כְּנִישַׁת חֶדְוָא וְיוֹמָא טָבָא וְאִירוּעַ קַדִישׁ תֶּהֱוֵי לְכוֹן כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "And on the eighth day you shall gather together joyfully from your tabernacles, in your houses, a gladsome company, a festal day, and a holy convocation shall you have, no servile work shall you do", "tj": "", "tj_en": "", "rashi": "<b>עצרת תהיה לכם.<\/b> עֲצוּרִים בַּעֲשִׂיַּת מְלָאכָה; דָּ\"אַ, <b>עצרת<\/b> — עִצְרוּ מִלָּצֵאת, מְלַמֵּד שֶׁטָּעוּן לִינָה; וּמִדְרָשׁוֹ בַאַגָּדָה לְפִי שֶׁכָּל יְמוֹת הָרֶגֶל הִקְרִיבוּ כְנֶגֶד שִׁבְעִים אֻמּוֹת, וּבָאִין לָלֶכֶת, אָמַר לָהֶם הַמָּקוֹם בְּבַקָּשָׁה מִכֶּם עֲשׂוּ לִי סְעוּדָה קְטַנָּה כְּדֵי שֶׁאֵהָנֶה מִכֶּם (סוכה נ\"ה):", "rashi_en": "עצרת תהיה לכם ON THE EIGHTH DAY THERE SHALL BE A עצרת (RESTRICTION) FOR YOU — you are restricted in the doing of work. Another explanation of עצרת: Restrict yourselves from leaving Jerusalem: this teaches that this (the eighth day) requires that they should remain in Jerusalem overnight (that the pilgrims should not immediately at the termination of the seventh day begin their homeward journey) (Sifrei Bamidbar 151:1). And an explanation of it in the Agada is: because on all the seven days of the Festival they offered sacrifices corresponding in number to the seventy nations of the world, and they propose then to set forth on their way home, the Omnipresent says to them: ‘I beg of you make a small banquet for Me, so that I may have some pleasure from you exclusively” (Sukkah 55b)."}, {"ch": 29, "v": 36, "aliyah": 7, "heb": "וְהִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֙חַ֙ לַֽיהֹוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי־שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם׃", "onk": "וּתְקָרְבוּן עֲלָתָא קוּרְבַּן <b>דְּמִתְקַבַּל בְּרַעֲוָא קֳדָם<\/b> יְיָ תּוֹר חַד דְּכַר חַד אִמְּרִין בְּנֵי שְׁנָא שַׁבְעָא שַׁלְמִין:", "onk_en": "You shall bring a burnt-offering, a fire-offering for a pleasing aroma [<b>accepted willingly<\/b>] to [<b>before<\/b>] Adonoy, [consisting of] one young bull, one ram, and seven yearling lambs, [all] without blemish;", "pj": "וּתְקַרְבוּן עֲלָתָא קוּרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ קוּרְבָּנִין קָלִילָן תּוֹר חַד קֳדָם אֱלָהָא חַד דְכַר חַד לְעַמָא יְחִידָאֵי אִמְרִין בְּנֵי שְׁנָא שַׁבְעָא שַׁלְמִין לְחֶדְוַת שׁוּבְעָא יוֹמִין", "pj_en": "but offer a sacrifice an oblation to be received with favour before the Lord; light oblations; one bullock before the one God, one ram for the one people, lambs of the year unblemished, seven, for the joy of the seven days.", "tj": "", "tj_en": "", "rashi": "<b>פר אחד איל אחד.<\/b> אֵלּוּ כְנֶגֶד יִשְׂרָאֵל, הִתְעַכְּבוּ לִי מְעַט עוֹד, וּלְשׁוֹן חִבָּה הוּא זֶה, כְּבָנִים הַנִּפְטָרִים מֵאֲבִיהֶם וְהוּא אוֹמֵר לָהֶם קָשָׁה עָלַי פְּרֵדַתְכֶם, עַכְּבוּ עוֹד יוֹם אֶחָד, מָשָׁל לְמֶלֶךְ שֶׁעָשָׂה סְעוּדָה כוּ', כִּדְאִיתָא בְמַסֶּכֶת סֻכָּה (שם); וּבְמִדְרַשׁ רַבִּי תַנְחוּמָא: לִמְּדָה תוֹרָה דֶּרֶךְ אֶרֶץ שֶׁמִּי שֶׁיֵּשׁ לוֹ אַכְסְנַאי יוֹם רִאשׁוֹן יַאֲכִילֶנּוּ פְּטוּמוֹת, לְמָחָר יַאֲכִילֶנּוּ דָּגִים, לְמָחָר בְּשַׂר בְּהֵמָה, לְמָחָר מַאֲכִילוֹ קִטְנִית, לְמָחָר מַאֲכִילוֹ יָרָק, פּוֹחֵת וְהוֹלֵךְ כְּפָרֵי הֶחָג:", "rashi_en": "פר אחד איל אחד ONE BULLOCK, ONE RAM — these are an allusion to Israel who form one nation: “Stay with me a little longer”. And this conveys the idea of God’s affection for Israel — just like children who think to take leave of their father to whom he says, “Parting from you is very hard to me; stay one day more”. — A parable! It may be compared to the case of a king who made a banquet etc., as it is related in Treatise Sukkah 55b. And in the Midrash of R. Tanchuma 4:8:17 it states: The Torah teaches you a rule of conduct — that he who has a stranger staying with him should give him on the first day fattened poultry to eat, on the morrow he should give him fish to eat, on the next day animal flesh; on the following day he should give him pulse to eat, and on the next day vegetables, diminishing gradually, just as was the case with the bullocks on the Feast of Tabernacles."}, {"ch": 29, "v": 37, "aliyah": 7, "heb": "מִנְחָתָ֣ם וְנִסְכֵּיהֶ֗ם לַפָּ֨ר לָאַ֧יִל וְלַכְּבָשִׂ֛ים בְּמִסְפָּרָ֖ם כַּמִּשְׁפָּֽט׃", "onk": "מִנְחַתְהוֹן וְנִסְכֵּיהוֹן לְתוֹרָא לְדִכְרָא וּלְאִמְּרִין בְּמִנְיָנֵיהוֹן כִּדְחָזֵי:", "onk_en": "[together with] their meal-offerings and libations for the bull, ram, and lambs. of the required number.", "pj": "מִנְחַתְהוֹן סְמִידָא דְחִינְטָתָא וַחֲמַר נִיסוּכֵיהוֹן מַה דִתְקַרְבוּן עִם תּוֹרֵי וְדִכְרֵי וְאִמְרֵי בְּמִנְיָנֵיהוֹן כְּסֵדֶר דִינָא", "pj_en": "Their mincha of wheat flour, and their libations of wine which you shall offer with the bullocks, rams, and Iambs, by their number, after the order of their appointment;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 38, "aliyah": 7, "heb": "וּשְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִלְּבַד֙ עֹלַ֣ת הַתָּמִ֔יד וּמִנְחָתָ֖הּ וְנִסְכָּֽהּ׃", "onk": "וּצְפִירָא דְחַטָּאתָא חַד בַּר מֵעֲלַת תְּדִירָא וּמִנְחָתַהּ וְנִסְכַּהּ:", "onk_en": "And one he-goat as a sin-offering, in addition to [bringing] the constant (daily) burnt-offering with its meal-offering and libation.", "pj": "וּצְפִירָא דְחַטָאתָא חַד בַּר מִן עֲלַת תְּדִירָא וּסְמִידָא לְמִנְחָתָא וַחֲמַר נִיסוּכָהּ", "pj_en": "and one kid for a sin offering, beside the perpetual sacrifice, the flour for its mincha, and the wine for its libation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 39, "aliyah": 7, "heb": "אֵ֛לֶּה תַּעֲשׂ֥וּ לַיהֹוָ֖ה בְּמוֹעֲדֵיכֶ֑ם לְבַ֨ד מִנִּדְרֵיכֶ֜ם וְנִדְבֹתֵיכֶ֗ם לְעֹלֹֽתֵיכֶם֙ וּלְמִנְחֹ֣תֵיכֶ֔ם וּלְנִסְכֵּיכֶ֖ם וּלְשַׁלְמֵיכֶֽם׃", "onk": "אִלֵּין תַּעַבְּדוּן קֳדָם יְיָ בְּמוֹעֲדֵיכוֹן בַּר מִנִּדְרֵיכוֹן וְנִדְבַתְכוֹן לַעֲלָוַתְכוֹן וּלְמִנְחַתְכוֹן וּלְנִסְכֵּיכוֹן וּלְנִכְסַת קוּדְשֵׁיכוֹן:", "onk_en": "These you shall make to Adonoy on your festivals, aside from your vows and dedications, burnt-offerings and meal-offerings, and libations and peace-offerings.”", "pj": "אִלֵין תְּקַרְבוּן קֳדָם יְיָ בִּזְמַן מוֹעֲדֵיכוֹן בַּר מִנִדְרֵיכוֹן דִנְדַרְתּוּן בְּחַגָא דְתַיְיתוּן בְּחַגָא וּנְסִיכַתְכוֹן לַעֲלָוַותְכוֹן וּלְמִנְחָתֵיכוֹן וּלְנִיסוּכֵיכוֹן וּלְנִכְסַת קוּדְשֵׁיכוֹן", "pj_en": "These you shall offer before the Lord in the time of your festivals, beside your vows which you vow at the festival, and which you shall bring on the day of the feast, with your free-will oblation for your burnt sacrifice, your mincha, libations, and consecrated victims.", "tj": "", "tj_en": "", "rashi": "<b>אלה תעשו לה' במועדיכם.<\/b> דָּבָר הַקָּצוּב לְחוֹבָה:<br><br><b>לבד מנדריכם.<\/b> אִם בָּאתֶם לִדּוֹר קָרְבָּנוֹת בָּרֶגֶל, מִצְוָה הִיא בְּיֶדְכֶם, אוֹ נְדָרִים אוֹ נְדָבוֹת שֶׁנְּדַרְתֶּם כָּל הַשָּׁנָה, הַקְרִיבוּם בָּרֶגֶל, שֶׁמָּא יִקְשֶׁה לוֹ לַחֲזֹר וְלַעֲלוֹת לִירוּשָׁלַיִם וּלְהַקְרִיב נְדָרָיו וְנִמְצָא עוֹבֵר בְּבַל תְּאַחֵר:", "rashi_en": "אלה תעשו לה׳ במועדיכם THESE YE SHALL OFFER TO THE LORD ON YOUR APPOINTED FESTIVALS — as something that is laid down as a duty, <br><br>לבד מנדריכם BESIDES YOUR VOWS [AND YOUR FREEWILL OFFERINGS] — If on the Festival you wish to make a vow to bring a sacrifice, you have a duty ready at hand to your credit and you should bring it on that Festival; or in the case of vow-offerings and freewill offerings which you have vowed all the year, bring them on the Festival. — Perhaps it will be difficult for one to go up again to Jerusalem to bring his vow-offerings, and consequently he will transgress the command, (Deuteronomy 23:22) “Thou shalt not delay to pay it (thy vow)”."}, {"ch": 30, "v": 1, "aliyah": 7, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה אֶל־בְּנֵ֣י יִשְׂרָאֵ֑ל כְּכֹ֛ל אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר משֶׁה לִבְנֵי יִשְׂרָאֵל כְּכֹל דִּי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe spoke to Bnei Yisroel all that Adonoy had commanded him.", "pj": "וַאֲמַר משֶׁה לִבְנֵי יִשְרָאֵל כְּכָל מַה דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And Mosheh spake to the sons of Israel, according to all that the Lord had commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר משה אל בני ישראל.<\/b> לְהַפְסִיק הָעִנְיָן, דִּבְרֵי רַבִּי יִשְׁמָעֵאל, לְפִי שֶׁעַד כָּאן דְּבָרָיו שֶׁל מָקוֹם וּפָרָשַׁת נְדָרִים מַתְחֶלֶת בְּדִבּוּרוֹ שֶׁל מֹשֶׁה, הֻצְרַךְ לְהַפְסִיק תְּחִלָּה וְלוֹמַר שֶׁחָזַר מֹשֶׁה וְאֲמָרָהּ פָרָשָׁה זוֹ לְיִשְׂרָאֵל, שֶׁאִם לֹא כֵן, יֵשׁ בְּמַשְׁמַע שֶׁלֹּא אָמַר לָהֶם זוֹ, אֶלָּא בְּפָרָשַׁת נְדָרִים הִתְחִיל דְּבָרָיו:", "rashi_en": "ויאמר משה אל בני ישראל AND MOSES TOLD THE CHILDREN OF ISRAEL — This is stated to separate this subject (of sacrifies) from the following (vows). Such is the opinion of R. Ishmael. What it means is: since up to now we have the words of the Omnipresent to Moses (Numbers 28:1—2: “And the Lord said to Moses, ‘Command the children of Israel, etc.’ ”) and the chapter about vows that follows begins with an utterance of Moses (“And Moses spake”), it is necessary first to make a break by stating that Moses in turn told this section to Israel (“And Moses told etc.”), for if this were not done it would imply that he did not tell them this section about the sacrifices, but began his address with the chapter about vows (Sifrei Bamidbar 152)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
