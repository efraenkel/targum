<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 27, "v": 20, "aliyah": 1, "heb": "וְאַתָּ֞ה תְּצַוֶּ֣ה&thinsp;<b>׀<\/b> אֶת־בְּנֵ֣י יִשְׂרָאֵ֗ל וְיִקְח֨וּ אֵלֶ֜יךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַמָּא֑וֹר לְהַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׃", "onk": "וְאַתְּ תְּפַקֵּד יָת בְּנֵי יִשְׂרָאֵל וְיִסְּבוּן לָךְ מִשְׁחָא זֵיתָא דַכְיָא כָּתִישָׁא לְאַנְהָרָא לְאַדְלָקָא בוֹצִינַיָּא תְּדִירָא:", "onk_en": "You shall command the B’nei Yisrael and have them bring you clear olive oil, [made from olives that were] crushed for lighting, to keep the lamp burning constantly.", "pj": "ואתה וְאַנְתְּ תְּפַקֵיד יַת בְּנֵי יִשְרָאֵל וְיִסְבוּן לָךְ מִישְׁחָא דְזֵיתָא דַכְיָא כְּתִישָׁא לְאַנְהוֹרֵי לְאַדְלָקָא בּוֹצִינַיָא תְּדִירָא", "pj_en": "And thou shalt instruct the sons of Israel to bring the pure olive oil, beaten, for illumination, that the lamps may burn continually.", "tj": "", "tj_en": "", "rashi": "<b>ואתה תצוה. זך.<\/b> בְּלִי שְׁמָרִים, כְּמוֹ שֶׁשָּׁנִינוּ בִמְנָחוֹת מְגַרְגְּרוֹ בְרֹאשׁ הַזַּיִת וְכוּ':<br><br><b>כתית.<\/b> הַזֵּיתִים כּוֹתֵשׁ בַּמַּכְתֶּשֶׁת וְאֵינוֹ טוֹחֲנָן בָּרֵחַיִם, כְּדֵי שֶׁלֹּא יִהְיֶה בוֹ שְׁמָרִים, וְאַחַר שֶׁהוֹצִיא טִפָּה רִאשׁוֹנָה מַכְנִיסָן לָרֵחַיִם וְטוֹחֲנָן; וְהַשֶּׁמֶן הַשֵּׁנִי פָּסוּל לַמְּנוֹרָה וְכָשֵׁר לִמְנָחוֹת שֶׁנֶּאֱמַר כָּתִית לַמָּאוֹר – וְלֹא כָתִית לַמְּנָחוֹת (מנחות פ\"ו):<br><br><b>להעלות נר תמיד.<\/b> מַדְלִיק עַד שֶׁתְּהֵא שַׁלְהֶבֶת עוֹלָה מֵאֵלֶיהָ (שבת כ\"א):<br><br><b>תמיד.<\/b> כָּל לַיְלָה וְלַיְלָה קָרוּי תָּמִיד, כְּמוֹ שֶׁאַתָּה אוֹמֵר עֹלַת תָּמִיד וְאֵינָהּ אֶלָּא מִיּוֹם לְיוֹם; וְכֵן בְּמִנְחַת חֲבִתִּין נֶאֱמַר תָּמִיד וְאֵינָהּ אֶלָּא מַחֲצִיתָהּ בַּבֹּקֶר וּמַחֲצִיתָהּ בָּעֶרֶב, אֲבָל תָּמִיד הָאָמוּר בְּלֶחֶם הַפָּנִים מִשַּׁבָּת לְשַׁבָּת הוּא:", "rashi_en": "ואתה תצוה ... זך CLEAR — without lees; and this was effected not by straining the oil but as we learn in Treatise Menachoth 86a “He lets it (the olive) ripen on the top of the olive-tree etc.”<br><br>כתית BEATEN — he pounds the olives in a mortar and must not grind them in a mill, so that there may be no lees; and after he has thus extracted the first drop of oil he may bring them into the mill and grind them. The second oil (that obtained by grinding) is unfitted for use in the candelabrum but is permissible for the meal-offerings (which had to be mingled with oil) since it is said here, “Beaten for the light”, and hence it is not essential that it should be beaten for the meal-offerings (Menachot 86a; cf. Rashi on Exodus 29:40).<br><br>להעלות נר תמיד TO CAUSE THE LIGHT TO BURN (lit., to ascend) CONTINUALLY — he must enkindle it until the flame ascends by itself (Shabbat 21a).<br><br>תמיד CONTINUALLY — doing something every night, as is described here, may be termed תמיד, continually, just as you speak of (Numbers 27:6) “The continual (תמיד) burnt-offering”, although this was sacrificed only from day to day. So, too, in the case of the meal-offering made in a flat pan it is said, (Leviticus 6:13) that it should be brought continually (תמיד) and yet it was only brought thus: “Half of it in the morning, and half of it at evening”. However, the expression תמיד which is used in connection with the show-bread (Exodus 25:30) denotes the whole period without a break from Sabbath to Sabbath)."}, {"ch": 27, "v": 21, "aliyah": 1, "heb": "בְּאֹ֣הֶל מוֹעֵד֩ מִח֨וּץ לַפָּרֹ֜כֶת אֲשֶׁ֣ר עַל־הָעֵדֻ֗ת יַעֲרֹךְ֩ אֹת֨וֹ אַהֲרֹ֧ן וּבָנָ֛יו מֵעֶ֥רֶב עַד־בֹּ֖קֶר לִפְנֵ֣י יְהֹוָ֑ה חֻקַּ֤ת עוֹלָם֙ לְדֹ֣רֹתָ֔ם מֵאֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּמַשְׁכַּן זִמְנָא מִבָּרָא לְפָרֻכְתָּא דִּעַל סַהֲדוּתָא יְסַדַּר יָתֵיהּ אַהֲרֹן וּבְנוֹהִי מֵרַמְשָׁא עַד צַפְרָא קֳדָם יְיָ קְיָם עָלָם לְדָרֵיהוֹן מִן בְּנֵי יִשְׂרָאֵל:", "onk_en": "In the Tent of Meeting, outside the paroches, which is before the Testimony, Aharon and his sons shall arrange it [for the lamp to burn] from evening to morning before Adonoy. This is an everlasting statute for their generations of the B’nei Yisrael.", "pj": "בְּמַשְׁכַּן זִימְנָא מִבָּרָא לְפַרְגוֹדָא דְעַל סַהֲדוּתָא יְסַדֵּר יָתֵיהּ אַהֲרן וּבְנוֹי מִן רַמְשָׁא עַד צַפְרָא קֳדָם יְיָ קְיַים עֲלָם לְדָרֵיהוֹן מִן בְּנֵי יִשְרָאֵל", "pj_en": "In the tabernacle of the covenant, without the veil that is before the testimony, Aharon and his sons shall set it in order from evening until morning before the Lord, an everlasting statute to your generations of the house of Israel.", "tj": "", "tj_en": "", "rashi": "<b>מערב עד בקר.<\/b> תֵּן לָהּ מִדָּתָהּ שֶׁתְּהֵא דּוֹלֶקֶת מֵעֶרֶב וְעַד בֹּקֶר, וְשִׁעֲרוּ חֲכָמִים חֲצִי לֹג לְלֵילֵי טֵבֵת הָאֲרֻכִּין וְכֵן לְכָל הַלֵּילוֹת, וְאִם יִוָּתֵר אֵין בְּכָךְ כְּלוּם (מנחות פ\"ט):", "rashi_en": "מערב עד בקר FROM EVENING TO MORNING — Give it its due measure of oil so that it may burn from evening to morning. Our Rabbis estimated half a log of oil as sufficient for the nights of Tebeth which are long, and they ordained a similar quantity for every night of the year, and if any were left over on the shorter nights it did not matter (Menachot 89a)."}, {"ch": 28, "v": 1, "aliyah": 1, "heb": "וְאַתָּ֡ה הַקְרֵ֣ב אֵלֶ֩יךָ֩ אֶת־אַהֲרֹ֨ן אָחִ֜יךָ וְאֶת־בָּנָ֣יו אִתּ֗וֹ מִתּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְכַהֲנוֹ־לִ֑י אַהֲרֹ֕ן נָדָ֧ב וַאֲבִיה֛וּא אֶלְעָזָ֥ר וְאִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן׃", "onk": "וְאַתְּ קָרֵב לְוָתָךְ יָת אַהֲרֹן אָחוּךְ וְיָת בְּנוֹהִי עִמֵּיהּ מִגּוֹ בְּנֵי יִשְׂרָאֵל לְשַׁמָּשָׁא <b>קֳדָמָי<\/b> אַהֲרֹן נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר בְּנֵי אַהֲרֹן:", "onk_en": "And [now separate] and take unto you your brother, Aharon, and his sons with him, from among the B’nei Yisrael, to serve [<b>before<\/b>] Me [as kohanim]: Aharon, Nadav, Avihu, Elazar, and Isamar, the sons of Aharon.", "pj": "וְאַנְתְּ קְרַב לְוָותָךְ יַת אַהֲרן אָחוּךְ וְיַת בְּנוֹי עִמֵּיהּ מִגּוֹ בְּנֵי יִשְרָאֵל לְשַׁמָּשָׁא קֳדָמַי אַהֲרן נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר בְּנוֹי דְאַהֲרן", "pj_en": "And thou, bring near to thee Aharon thy brother, and his sons with him, from among the sons of Israel, to minister before Me: Aharon, Nadab, and Abihu, Elazar and Ithamar, the sons of Aharon.", "tj": "", "tj_en": "", "rashi": "<b>ואתה הקרב אליך.<\/b> לְאַחַר שֶׁתִּגָּמֵר מְלֶאכֶת הַמִּשְׁכָּן:", "rashi_en": "ואתה הקרב אליך AND THOU TAKE TO THEE after the work of the Tabernacle is finished."}, {"ch": 28, "v": 2, "aliyah": 1, "heb": "וְעָשִׂ֥יתָ בִגְדֵי־קֹ֖דֶשׁ לְאַהֲרֹ֣ן אָחִ֑יךָ לְכָב֖וֹד וּלְתִפְאָֽרֶת׃", "onk": "וְתַעְבֵּד לְבוּשֵׁי קוּדְשָׁא לְאַהֲרֹן אָחוּךְ לִיקָר וּלְתֻשְׁבְּחָן:", "onk_en": "Make sacred garments for your brother, Aharon, for honor and splendor.", "pj": "וְתַעֲבֵיד לְבוּשָׁא דְקוּדְשָׁא לְאַהֲרן אָחוּךְ לִיְקַר וּלְתוּשְׁבְּחָא", "pj_en": "And thou shalt make garments of holiness for Aharon thy brother, for glory and for praise.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 3, "aliyah": 1, "heb": "וְאַתָּ֗ה תְּדַבֵּר֙ אֶל־כׇּל־חַכְמֵי־לֵ֔ב אֲשֶׁ֥ר מִלֵּאתִ֖יו ר֣וּחַ חׇכְמָ֑ה וְעָשׂ֞וּ אֶת־בִּגְדֵ֧י אַהֲרֹ֛ן לְקַדְּשׁ֖וֹ לְכַהֲנוֹ־לִֽי׃", "onk": "וְאַתְּ תְּמַלֵּל עִם כָּל חַכִּימֵי לִבָּא דִּאַשְׁלֵמִית עִמֵּיהּ רוּחַ חָכְמְתָא וְיַעְבְּדוּן יָת לְבוּשֵׁי אַהֲרֹן לְקַדָּשׁוּתֵיהּ לְשַׁמָּשָׁא <b>קֳדָמַי<\/b>:", "onk_en": "Speak to all who are wise in heart, whom I have filled with the spirit of wisdom, and have them make Aharon’s garments, to sanctify him to serve [<b>before<\/b>] Me [as kohein].", "pj": "וְאַנְתְּ תְּמַלֵּיל עִם כָּל חַכִּימֵי לִבָּא דְאַשְׁלֵימִית עִמְהוֹן רוּחָא דְחָכְמְתָא וְעָבָדוּ יַת לְבוּשֵׁי אַהֲרן לְקַדְשׁוּתֵיהּ לְשַׁמָּשָׁא קֳדָמַי", "pj_en": "And thou shalt speak with all who are wise of heart, and whom I have filled with the spirit of wisdom, that they make the vestments of Aharon to consecrate him to minister before Me.", "tj": "", "tj_en": "", "rashi": "<b>לקדשו לכהנו לי.<\/b> לְקַדְּשׁוֹ לְהַכְנִיסוֹ בִּכְהֻנָּה עַ\"יְ הַבְּגָדִים שֶׁיְּהֵא כֹהֵן לִי, וּלְשׁוֹן כְּהֻנָּה שֵׁרוּת הוּא, שנטרי\"אה בְּלַעַז:", "rashi_en": "לקדשו לכהנו לי TO SANCTIFY HIM, TO APPOINT HIM AS PRIEST TO ME — to sanctify him, i. e. to instal him into the priesthood by means of the garments here specified, so that he may become priest unto Me. The expression of כהונה denotes service — serventrie in old French"}, {"ch": 28, "v": 4, "aliyah": 1, "heb": "וְאֵ֨לֶּה הַבְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְאֵפוֹד֙ וּמְעִ֔יל וּכְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְאַבְנֵ֑ט וְעָשׂ֨וּ בִגְדֵי־קֹ֜דֶשׁ לְאַהֲרֹ֥ן אָחִ֛יךָ וּלְבָנָ֖יו לְכַהֲנוֹ־לִֽי׃", "onk": "וְאִלֵּין לְבוּשַׁיָּא דִּי יַעְבְּדוּן חוּשְׁנָא וְאֵפוֹדָא וּמְעִילָא וְכִתּוּנָא מְרַמְּצָא מִצְנֶפְתָּא וְהֶמְיָנָא וְיַעְבְּדוּן לְבוּשֵׁי קוּדְשָׁא לְאַהֲרֹן אָחוּךְ וְלִבְנוֹהִי לְשַׁמָּשָׁא <b>קֳדָמַי<\/b>:", "onk_en": "These are the garments that they shall make: a breastplate, an eiphod, a robe, a checkered undershirt, a turban and a sash-belt. Have them make sacred garments for your brother Aharon, and for his sons, to serve [<b>before<\/b>] Me [as kohanim].", "pj": "וְאִלֵּין לְבוּשַׁיָא דְיַעַבְדוּן חוּשְׁנָא וְאֵיפוֹדָא וּמְעִילָא וְכִיתּוּנוּן מְרַמְצִין מַצִינְפַן וְקִימוֹרִין וְיַעַבְדוּן לְבוּשֵׁי קוּדְשָׁא לְאַהֲרן אָחוּךְ וְלִבְנוֹי לְשַׁמָּשָׁא קֳדָמַי", "pj_en": "And these are the vestments they shall make: the breastplate and ephoda, and the robe, and the embroidered tunics, the mitres and girdles; and they shall make the holy garments for Aharon thy brother, and for his sons, to minister before Me.", "tj": "", "tj_en": "", "rashi": "<b>חשן.<\/b> תַּכְשִׁיט כְּנֶגֶד הַלֵּב:<br><br><b>ואפוד.<\/b> לֹא שָׁמַעְתִּי וְלֹא מָצָאתִי בַּבָּרַיְתָא פֵּרוּשׁ תַּבְנִיתוֹ, וְלִבִּי אוֹמֵר לִי שֶׁהוּא חֲגוֹרָה לוֹ מֵאֲחוֹרָיו, רָחְבּוֹ כְּרֹחַב גַּב אִישׁ, כְּמִין סִינָר שֶׁקּוֹרִין פורצי\"נט בְּלַעַז, שֶׁחוֹגְרוֹת הַשָּׂרוֹת כְּשֶׁרוֹכְבוֹת עַל הַסּוּסִים, כָּךְ מַעֲשֵׂהוּ מִלְּמַטָּה, שֶׁנֶּאֱמַר וְדָוִד חָגוּר אֵפוֹד בָּד, לָמַדְנוּ שֶׁהָאֵפוֹד חֲגוֹרָה הִיא; וְאִי אֶפְשָׁר לוֹמַר שֶׁאֵין בּוֹ אֶלָּא חֲגוֹרָה לְבַדָּהּ, שֶׁהֲרֵי נֶאֱמַר וַיִּתֵּן עָלָיו אֶת הָאֵפֹד וְאַחַ\"כַּ וַיַּחְגֹּר אוֹתוֹ בְּחֵשֶׁב הָאֵפֹד וְתִרְגֵּם אֻנְקְלוֹס בְּהֶמְיַן אֵפוֹדָא, לָמַדְנוּ שֶׁהַחֵשֶׁב הוּא הֶחָגוֹר וְהָאֵפוֹד שֵׁם תַּכְשִׁיט לְבַדּוֹ; וְאִי אֶפְשָׁר לוֹמַר שֶׁעַל שֵׁם שְׁתֵּי הַכְּתֵפוֹת שֶׁבּוֹ הוּא קָרוּי אֵפוֹד, שֶׁהֲרֵי נֶאֱמַר שְׁתֵּי כִתְפוֹת הָאֵפוֹד, לָמַדְנוּ שֶׁהָאֵפוֹד שֵׁם לְבַד וְהַכְּתֵפוֹת שֵׁם לְבַד וְהַחֵשֶׁב שֵׁם לְבַד, לְכָךְ אֲנִי אוֹמֵר שֶׁעַל שֵׁם הַסִּינָר שֶׁל מַטָּה קָרוּי אֵפוֹד – עַל שֵׁם שֶׁאוֹפְדוֹ וּמְקַשְּׁטוֹ בוֹ – כְּמוֹ שֶׁנֶּ' וַיֶּאְפֹּד לוֹ בּוֹ, וְהַחֵשֶׁב הוּא חָגוּר שֶׁלְּמַעְלָה הֵימֶנּוּ וְהַכְּתֵפוֹת קְבוּעוֹת בּוֹ. וְעוֹד אוֹמֵר לִי לִבִּי שֶׁיֵּשׁ רְאָיָה שֶׁהוּא מִין לְבוּשׁ, שֶׁתִּרְגֵּם יוֹנָתָן וְדָוִד חָגוּר אֵפוֹד בָּד (שמואל ב ו') – כַּרְדּוּט דְּבוּץ, וְתִרְגֵּם כְּמוֹ כֵן מְעִילִים כַּרְדּוּטִין, בְּמַעֲשֵׂה תָּמָר אֲחוֹת אַבְשָׁלוֹם, כִּי כֵן תִּלְבַּשְׁנָה בְנוֹת הַמֶּלֶךְ הַבְּתוּלוֹת מְעִילִים (שם י\"ג):<br><br><b>מעיל.<\/b> הוּא כְּמִין חָלוּק, וְכֵן הַכֻּתֹּנֶת, אֶלָּא שֶׁהַכֻּתֹּנֶת סָמוּךְ לִבְשָׂרוֹ וּמְעִיל קָרוּי חָלוּק הָעֶלְיוֹן:<br><br><b>תשבץ.<\/b> עֲשׂוּיִין מִשְׁבְּצוֹת לְנוֹי, וְהַמִּשְׁבְּצוֹת הֵם כְּמִין גֻּמּוֹת הָעֲשׂוּיוֹת בְּתַכְשִׁיטֵי זָהָב לְמוֹשַׁב קְבִיעַת אֲבָנִים טוֹבוֹת וּמַרְגָּלִיּוֹת, כְּמוֹ שֶׁנֶּאֱמַר בְּאַבְנֵי הָאֵפוֹד מֻסַבֹּת מִשְׁבְּצוֹת זָהָב, וּבְלַעַז קוֹרְאִין אוֹתוֹ קשטו\"נש:<br><br><b>מצנפת.<\/b> כְּמִין כִּפַּת כּוֹבַע, שֶׁקּוֹרִין קופ\"יא בְּלַעַז, שֶׁהֲרֵי בְמָקוֹם אַחֵר קוֹרֵא לָהֶם מִגְבָּעוֹת וּמְתַרְגְּמִינָן כּוֹבָעִין:<br><br><b>ואבנט.<\/b> הִיא חֲגוֹרָה עַל הַכֻּתֹּנֶת וְהָאֵפוֹד חֲגוֹרָה עַל הַמְּעִיל, כְּמוֹ שֶׁמָּצִינוּ בְּסֵדֶר לְבִישָׁתָן וַיִּתֵּן עָלָיו אֶת הַכֻּתֹּנֶת וַיַּחְגֹּר אֹתוֹ בָּאַבְנֵט וַיַּלְבֵּשׁ אֹתוֹ אֶת הַמְּעִיל וַיִּתֵּן עָלָיו אֶת הָאֵפֹד:<br><br><b>בגדי קדש.<\/b> מִתְּרוּמָה הַמְקֻדֶּשֶׁת לִשְׁמִי יַעֲשֶׂה אוֹתָם:", "rashi_en": "חשן A BREAST-PLATE — an ornament borne in front of the heart.<br><br>ואפוד AND AN EPHOD — I have heard no tradition nor have I found in the Boraitha any description of its shape, but my own mind tells me that it was tied on behind him; its breadth was the same as the breadth of a man’s back like a kind of apron which is called pourceint in old French which ladies of rank tie on when they ride on horse-back. Such, as mentioned, was the way in which the lower part was made, as it is said, (II Samuel 6:14) “And David was girded with a linen ephod” — this informs us that the ephod was something tied on the body. It is, however, not possible to say that it consisted of a girdle only, because it is said (Leviticus 8:7) “And he put the ephod upon him”, and afterwards it is stated “and he girded him with the חשב of the ephod” and this Onkelos translated by “the girdle of the ephod.” This, therefore, informs us that the חשב is the girdle and the אפור is the name of the ornamental garment itself. Further, it is not possible to assert that it was on account of the two shoulder-straps that it was called אפוד (i. e. that the term אפוד applies to these two straps and the girdle to which they were attached) for it is said, (v. 27) “the two shoulder-pieces of the ephod” — this tells us that the ephod is a separate name, the shoulderpieces a separate name and the girdle a separate name (i. e. each of these is the name of separate articles). Consequently I say that it is called אפוד in reference to the apron-like garment which hung down and that it was so called because they bedecked him (אופדו) and ornamented him with it, as it is said, (Leviticus 8:7) “And he bedecked (ויאפוד) him with it.” The חשב was the girdle which was on the upper portion of it (the ephod), and the shoulder-pieces were attached to it. Further, my own mind tells me that there is evidence that it was a kind of garment, for Jonathan ben Uzziel translates (II Samuel 6:14) “And David was girded with a linen ephod” by “a linen כרדוט” and exactly similarly does he translate מעילים, “robes”, by כרדוטין in the story of Tamar, Absolom’s sister, (II Samuel 13:18) “For with such robes (מעילים) were the king’s daughters that were virgins apparelled”.<br><br>מעיל — This was a kind of shirt and so, too, the כתונת, except that the כתונת was worn immediately on the body and מעיל is a term for the outer shirt.<br><br>תשבץ A QUILTED [INNER GARMENT] — made with משבצות as ornaments. These משבצות were a kind of indentations which are made in gold ornaments as a setting in which to fix precious stones and pearls, as it is said of the stones of the ephod, (v. 11) “enclosed in settings (משבצות) of gold.” In old French they call them castons.<br><br>מצנפת — a kind of domed helmet which they call cofea in old French, for in another passage (v. 40) it calls them מגבעות which we translate in the Targum by כובעין, helmets.<br><br>ואבנט — This was a girdle upon the inner-garment, and the ephod was the girdle over the outer-garment, just as we find it stated in the description of the order in which they were donned: (Leviticus 8:7), “And he put upon him the inner-garment (כתנת) and girded him with the belt (אבנט) and clothed him with the mantle (מעיל) and put the ephod (אפוד) upon him.”<br><br>בגדי קדש lit., GARMENTS OF THE HOLY THING — i. e. from the heave-offering that is sanctified (מקדשת) to My Name shall they make them (Sifra, Acharei Mot, Chapter 1 10)."}, {"ch": 28, "v": 5, "aliyah": 1, "heb": "וְהֵם֙ יִקְח֣וּ אֶת־הַזָּהָ֔ב וְאֶת־הַתְּכֵ֖לֶת וְאֶת־הָֽאַרְגָּמָ֑ן וְאֶת־תּוֹלַ֥עַת הַשָּׁנִ֖י וְאֶת־הַשֵּֽׁשׁ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִנּוּן יִסְּבוּן יָת דַּהֲבָא וְיָת תִּכְלָא וְיָת אַרְגְּוָנָא וְיָת <b>צְבַע<\/b> זְהוֹרִי וְיָת בּוּצָא:", "onk_en": "They shall take the gold, the greenish-blue wool, the dark red wool the crimson [<b>colored<\/b>] wool, and the fine twined linen.", "pj": "וְהִינוּן יִסְבוּן מִן מָמוֹנְהוֹן יַת דַּהֲבָא וְיַת תִּכְלָא וְיַת אַרְגְּוָונָא וְיַת צְבַע זְהוֹרֵי וְיַת בּוּצָא", "pj_en": "And they shall take from their treasures gold, and hyacinth, and purple, and crimson, and fine linen.", "tj": "", "tj_en": "", "rashi": "<b>והם יקחו.<\/b> אוֹתָם חַכְמֵי לֵב שֶׁיַּעֲשׂוּ הַבְּגָדִים יְקַבְּלוּ מִן הַמִּתְנַדְּבִים אֶת הַזָּהָב וְאֶת הַתְּכֵלֶת לַעֲשׂוֹת מֵהֶן אֶת הַבְּגָדִים:", "rashi_en": "והם יקחו AND THEY SHALL TAKE — Those men, wise in heart (cf. v. 3), who are to make the garments shall receive from the donors את הזהב ואת התכלת THE GOLD AND THE BLUE PURPLE, in order to make the garments of them."}, {"ch": 28, "v": 6, "aliyah": 1, "heb": "וְעָשׂ֖וּ אֶת־הָאֵפֹ֑ד זָ֠הָ֠ב תְּכֵ֨לֶת וְאַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְשֵׁ֥שׁ מׇשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב׃", "onk": "וְיַעְבְּדוּן יָת אֵפוֹדָא דַּהֲבָא תִּכְלָא וְאַרְגְּוָנָא <b>צְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר עוֹבַד אֳמָן:", "onk_en": "They shall make the eiphod out of gold, greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, and fine twined linen, the work of a craftsman.", "pj": "וְיַעַבְדוּן יַת אֵיפוֹדָא תִּכְלָא וְאַרְגְּוָונָא צְבַע זְהוֹרֵי וּבוּץ שְׁזִיר עוֹבַד אוּמָן", "pj_en": "And they shall make the ephod of hyacinth, and purple, and crimson, and fine linen, twined, the work of the artificer.", "tj": "", "tj_en": "", "rashi": "<b>ועשו את האפד.<\/b> אִם בָּאתִי לְפָרֵשׁ מַעֲשֵׂה הָאֵפוֹד וְהַחֹשֶׁן עַל סֵדֶר הַמִּקְרָאוֹת, הֲרֵי פֵּרוּשָׁן פְּרָקִים, וְיִשְׁגֶה הַקּוֹרֵא בְּצֵרוּפָן, לְכָךְ אֲנִי כוֹתֵב מַעֲשֵׂיהֶם כְּמוֹת שֶׁהוּא, לְמַעַן יָרוּץ הַקּוֹרֵא בוֹ, וְאַחַר כָּךְ אֲפָרֵשׁ עַל סֵדֶר הַמִּקְרָאוֹת. הָאֵפוֹד עָשׂוּי כְּמִין סִינָר שֶׁל נָשִׁים רוֹכְבוֹת סוּסִים, וְחוֹגֵר אוֹתוֹ מֵאֲחוֹרָיו כְּנֶגֶד לִבּוֹ לְמַטָּה מֵאֲצִילָיו, רָחְבּוֹ כְּמִדַּת רֹחַב גַּבּוֹ שֶׁל אָדָם וְיוֹתֵר, וּמַגִּיעַ עַד עֲקֵבָיו, וְהַחֵשֶׁב מְחֻבָּר בְּרֹאשׁוֹ עַל פְּנֵי רָחְבּוֹ מַעֲשֵׂה אוֹרֵג, וּמַאֲרִיךְ לְכָאן וּלְכָאן כְּדֵי לְהַקִּיף וְלַחְגֹּר בּוֹ, וְהַכְּתֵפוֹת מְחֻבָּרוֹת בַּחֵשֶׁב, אֶחָד לְיָמִין וְאֶחָד לִשְׂמֹאל, מֵאֲחוֹרֵי הַכֹּהֵן, לִשְׁנֵי קְצוֹת רָחְבּוֹ שֶׁל סִינָר, וּכְשֶׁזּוֹקְפָן עוֹמְדוֹת לוֹ עַל שְׁתֵּי כְתֵפָיו, וְהֵן כְּמִין שְׁתֵּי רְצוּעוֹת עֲשׂוּיוֹת מִמִּין הָאֵפוֹד, אֲרֻכּוֹת כְּדֵי שִׁעוּר לְזָקְפָן אֵצֶל צַוָּארוֹ מִכָּאן וּמִכָּאן וְנִקְפָּלוֹת לְפָנָיו לְמַטָּה מִכְּתֵפָיו מְעַט, וְאַבְנֵי הַשֹּׁהַם קְבוּעוֹת בָּהֶם, אַחַת עַל כֶּתֶף יָמִין וְאַחַת עַל כֶּתֶף שְׂמֹאל, וְהַמִּשְׁבְּצוֹת נְתוּנוֹת בְּרָאשֵׁיהֶם לִפְנֵי כְּתֵפָיו, וּשְׁתֵּי עֲבוֹתוֹת הַזָּהָב תְּחוּבוֹת בִּשְׁתֵּי טַבָּעוֹת שֶׁבַּחֹשֶׁן, בִּשְׁנֵי קְצוֹת רָחְבּוֹ הָעֶלְיוֹן, אַחַת לְיָמִין וְאַחַת לִשְׂמֹאל, וּשְׁנֵי רָאשֵׁי הַשַּׁרְשֶׁרֶת תְּקוּעִין בַּמִּשְׁבֶּצֶת לַיָּמִין וְכֵן שְׁנֵי רָאשֵׁי הַשַּׁרְשֶׁרֶת הַשְּׂמָאלִית תְּקוּעִין בַּמִּשְׁבֶּצֶת שֶׁבְּכָתֵף שְׂמֹאל, נִמְצָא הַחֹשֶׁן תָּלוּי בְּמִשְׁבְּצוֹת הָאֵפוֹד עַל לִבּוֹ מִלְּפָנָיו, וְעוֹד שְׁתֵּי טַבָּעוֹת בִּשְׁנֵי קְצוֹת הַחֹשֶׁן בְּתַחְתִּיתוֹ, וּכְנֶגְדָּם שְׁתֵּי טַבָּעוֹת בִּשְׁתֵּי כִּתְפוֹת הָאֵפוֹד מִלְּמַטָּה, בְּרֹאשׁוֹ הַתַּחְתּוֹן הַמְּחֻבָּר בַּחֵשֶׁב; טַבְּעוֹת הַחֹשֶׁן אֶל מוּל טַבְּעוֹת הָאֵפוֹד שׁוֹכְבִים זֶה עַל זֶה, וּמְרַכְּסָן בִּפְתִיל תְּכֵלֶת תָּחוּב בְּטַבְּעוֹת הָאֵפוֹד וְהַחֹשֶׁן, שֶׁיְּהֵא תַּחְתִּית הַחֹשֶׁן דָּבוּק לְחֵשֶׁב הָאֵפוֹד וְלֹא יְהֵא נָד וְנִבְדָּל, הוֹלֵךְ וְחוֹזֵר:<br><br><b>זהב תכלת וארגמן תולעת שני ושש משזר.<\/b> חֲמֵשֶׁת מִינִים הַלָּלוּ שְׁזוּרִין בְּכָל חוּט וָחוּט; הָיוּ מְרַדְּדִין אֶת הַזָּהָב כְּמִין טַסִּין דַּקִּין וְקוֹצְצִין פְּתִילִים מֵהֶם, וְטוֹוִין אוֹתוֹ חוּט שֶׁל זָהָב עִם שִׁשָּׁה חוּטִין שֶׁל תְּכֵלֶת, וְחוּט שֶׁל זָהָב עִם שִׁשָּׁה חוּטִין שֶׁל אַרְגָּמָן, וְכֵן בְּתוֹלַעַת שָׁנִי וְכֵן בַּשֵּׁשׁ – שֶׁכָּל הַמִּינִין חוּטָן כָּפוּל שִׁשָּׁה וְחוּט שֶׁל זָהָב עִם כָּל אֶחָד וְאֶחָד – וְאַחַר כָּךְ שׁוֹזֵר אֶת כֻּלָּם כְּאֶחָד, נִמְצָא חוּטָן כָּפוּל כ\"ח, וְכֵן מְפֹרָשׁ בְּמַסֶּכֶת יוֹמָא, וְלָמֵד מִן הַמִּקְרָא הַזֶּה וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב וְקִצֵּץ פְּתִילִם לַעֲשׂוֹת – אֶת פְּתִילֵי הַזָּהָב – בְּתוֹךְ הַתְּכֵלֶת וּבְתוֹךְ הָאַרְגָּמָן וְגוֹ', לָמַדְנוּ שֶׁחוּט שֶׁל זָהָב שָׁזוּר עִם כָּל מִין וָמִין:<br><br><b>מעשה חשב.<\/b> כְּבָר פֵּרַשְׁתִּי שֶׁהוּא אֲרִיגַת שְׁתֵּי קִירוֹת, שֶׁאֵין צוּרוֹת שְׁנֵי עֲבָרֶיהָ דּוֹמוֹת זוֹ לָזוֹ:", "rashi_en": "ועשו את האפד AND THEY SHALL MAKE THE EPHOD — If I set myself to explain the making of the ephod and the breast-plate in the order of the verses, the description of them would be fragmentary and the reader might err in piecing the details together: therefore I shall write down how they were made, just as each of them was, in order that “he who runs may read” (may have a comprehensive idea of them in their entirety), and afterwards I shall explain it in the order of the verses. The ephod was made like that kind of apron of women who ride on horse-back. He (the priest) tied it on behind him opposite (at the height of) his heart below his elbows. Its breadth was equal to the measure of a man’s back and somewhat more (cf. Rashi, end of v. 26), and it reached to his heels. The belt was attached to its top edge along the whole of its width, being of weaver’s work (i. e. woven in one piece with the ephod) and it extended on both sides beyond the width of the ephod in order that it might go right round the body and gird on the ephod by means of it. The shoulder-pieces were attached to the belt, one on the right and one the left, behind the priest, at the two ends of the width of the apron, and when they were lifted up they stood (we should say “they lay”) upon his two shoulders, so that they were like two straps made of the same material as the ephod itself, and sufficiently long to lift them up to reach to his neck on both sides, and they hung over in front of him a little below his shoulders. The onyx stones were fixed in them, one on his right shoulder and one on his left shoulder, and the settings were placed in their ends in front of his shoulders on his breast. Two cords of gold were inserted through two rings which were on the breastplate at the two ends of its upper width (edge), one on the right and one on the left, and the two ends of the chain (or cord) were fixed in the setting on the right, and similarly the two ends of the left chain were fixed in the setting which was on the left shoulder. Consequently, the breast-plate hung in front of him over his heart from the settings of the ephod. Further, there were two rings at the two ends of the breast-plate on its lower edge, and opposite them two rings below on the two shoulder pieces of the ephod on the lower edge of each where this was joined to the belt. The under two rings on the breast-plate were opposite the rings on the ephod, lying one upon the other, and they fastened them (each pair of rings) together by a blue purple thread which was inserted through the rings in the ephod and breast-plate, so that the lower edge of the breast-plate should lie close to the belt of the ephod and should not move about and come apart from it, swinging to and fro.<br><br>זהב תכלת וארגמן תולעת שני ושש משזר OF GOLD, OF BLUE PURPLE, AND OF RED PURPLE, OF CRIMSON AND FINE TWISTED LINEN — The five materials were intertwined in every strand: they beat out the gold into the form of thin plates and from them they cut threads, and they wove that gold thread together with six threads of blue purple and a gold thread with six threads of red purple, and similarly with the crimson and similarly with the fine linen; because all the materials had their threads sixfold and there was a gold thread with each of them. Then they intertwined them all into one thread; it followed, therefore, that their thread was 28-fold. This is how it is explained in Treatise Yoma 72a and it is derived from the following verse: (Exodus 39:3) “And they beat out the gold into thin plates and cut it into threads to work the threads of gold in the blue purple and in the red purple, etc.” — this tells us that a gold thread was intertwined with each material.<br><br>מעשה חשב THE WORK OF AN ARTIST — I have already explained (Exodus 26:1) that this was weaving on both sides: that is, that the designs on both sides were not similar one to the other."}, {"ch": 28, "v": 7, "aliyah": 1, "heb": "שְׁתֵּ֧י כְתֵפֹ֣ת חֹֽבְרֹ֗ת יִֽהְיֶה־לּ֛וֹ אֶל־שְׁנֵ֥י קְצוֹתָ֖יו וְחֻבָּֽר׃", "onk": "תַּרְתֵּין כַּתְפִּין מְלַפְּפָן יְהוֹן לֵיהּ עַל תְּרֵין <b>סִטְרוֹהִי<\/b> וְיִתְלָפַף:", "onk_en": "It shall have two shoulder straps attached to it, they shall be attached at its two corners [<b>sides<\/b>].", "pj": "תַּרְתֵּין כַּתְפִין מְלַפְפִין יֶהֱוָן לֵיהּ לִתְרֵין סִטְרוֹי וְיִתְלָפֵף", "pj_en": "Two shoulder (pieces) shall it have, conjoined to its two sides, and (so) it shall be united.", "tj": "", "tj_en": "", "rashi": "<b>שתי כתפת וגו'.<\/b> הַסִּינָר מִלְּמַטָּה וְחֵשֶׁב הָאֵפוֹד הִיא הַחֲגוֹרָה, וּצְמוּדָה לוֹ מִלְמַעְלָה דֻּגְמַת סִינַר הַנָּשִׁים, וּמִגַּבּוֹ שֶׁל כֹּהֵן הָיוּ מְחֻבָּרוֹת בַּחֵשֶׁב שְׁתֵּי חֲתִיכוֹת כְּמִין שְׁתֵּי רְצוּעוֹת רְחָבוֹת, אַחַת כְּנֶגֶד כָּל כָּתֵף וְכָתֵף, וְזוֹקְפָן עַל שְׁתֵּי כִתְפוֹתָיו עַד שֶׁנִּקְפָּלוֹת לְפָנָיו כְּנֶגֶד הֶחָזֶה, וְעַ\"יְ חִבּוּרָן לְטַבְּעוֹת הַחֹשֶׁן נֶאֱחָזִין מִלְּפָנָיו כְּנֶגֶד לִבּוֹ שֶׁאֵין נוֹפְלוֹת, כְּמוֹ שֶׁמְּפֹרָשׁ בָּעִנְיָן, וְהָיוּ זְקוּפוֹת וְהוֹלְכוֹת כְּנֶגֶד כְּתֵפָיו וּשְׁתֵּי אַבְנֵי הַשֹׁהַם קְבוּעוֹת בָּהֶן אַחַת בְּכָל אַחַת:<br><br><b>אל שני קצותיו.<\/b> אֶל רָחְבּוֹ שֶׁל אֵפוֹד, שֶׁלֹּא הָיָה רָחְבּוֹ אֶלָּא כְּנֶגֶד גַּבּוֹ שֶׁל כֹּהֵן וְגָבְהוֹ עַד כְּנֶגֶד הָאֲצִילִים, שֶׁקּוֹרִין קודי\"ש בְּלַעַז, שֶׁנֶּ' לֹא יַחְגְּרוּ בַּיָּזַע (יחזקאל מ\"ד) – אֵין חוֹגְרִין בִּמְקוֹם זֵיעָה, לֹא לְמַעְלָה מֵאֲצִילֵיהֶם וְלֹא לְמַטָּה מִמָּתְנֵיהֶם אֶלָּא כְּנֶגֶד אֲצִילֵיהֶם:<br><br><b>וחבר.<\/b> הָאֵפוֹד עִם אוֹתָן שְׁתֵּי כִתְפוֹת הָאֵפוֹד יְחַבֵּר אוֹתָם בְּמַחַט לְמַטָּה בַּחֵשֶׁב, וְלֹא יֶאֶרְגֵם עִמּוֹ אֶלָּא אוֹרְגָם לְבַד וְאַחַר כָּךְ מְחַבְּרָם:", "rashi_en": "שתי כתפת וגו׳ TWO SHOULDER-PIECES, etc. — The apron was below and the חשב of the ephod was the belt, and this was joined to it on its top edge similar to the apron of ladies who ride on horseback. On the priest’s back there were joined to the belt two pieces like two wide straps, one opposite each shoulder. He lifted these up upon his two shoulders so that they hung down in front of him before his breast, and because they were joined to the rings in the breast-plate they were held fast in front of him upon his heart so that they could not fall off his shoulders backwards, just as is explained in this section (v. 28). Thus they lay on his back in an erect position and then passed over his shoulders and the two onyx stones were fixed on them, one stone upon each shoulder-piece.<br><br>אל שני קצותיו AT THE TWO EXTREMITIES THEREOF — on the width of the ephod; for its width was equal only to that of the priest’s back (and did not go entirely round his body, so that one may well speak of the two extremities of the ephod), and its height was up to the elbows — which they call coudes in old French — and not higher, because it is said (Ezekiel 44:18) “they shall not gird themselves (בַּיָּזַע),” i. e. they shall not gird themselves in the place where one perspires (במקום זיעה) namely, not higher than their elbows and not lower than their loins, but only by their elbows (Zevachim 18b).<br><br>וחבר IT — the ephod — SHALL BE JOINED with the two shoulder-pieces of the ephod: he shall join them below the belt with a needle and he shall not weave them together with it, but he must weave them separately and join them afterwards."}, {"ch": 28, "v": 8, "aliyah": 1, "heb": "וְחֵ֤שֶׁב אֲפֻדָּתוֹ֙ אֲשֶׁ֣ר עָלָ֔יו כְּמַעֲשֵׂ֖הוּ מִמֶּ֣נּוּ יִהְיֶ֑ה זָהָ֗ב תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֥שׁ מׇשְׁזָֽר׃", "onk": "וְהֶמְיַן <b>תִּקּוּנֵיהּ<\/b> דִּי עֲלוֹהִי כְּעוֹבָדוֹהִי מִנֵּיהּ יְהֵי דַּהֲבָא תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר:", "onk_en": "The eiphod’s belt [<b>that enhances it<\/b>], which is on it, shall be made in the same manner [as the eiphod]—it shall be woven with it. [with] gold, greenish blue wool, dark red wool, crimson [<b>colored<\/b>] wool and fine twined linen.", "pj": "וְהֶמְיַן טִיכוּתֵיהּ דְּעָלוֹי הֵי כְּעוּבְדֵיהּ מִנֵיהּ יְהֵי דַהֲבָא תִּיכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ שְׁזִיר", "pj_en": "And the ornamented girdle which is to be upon it shall be of the same work; of gold, hyacinth, purple, and crimson, and fine twined linen, shall it be.", "tj": "", "tj_en": "", "rashi": "<b>וחשב אפדתו.<\/b> וְחָגוֹר שֶׁעַל יָדוֹ הוּא מְאַפְּדוֹ וּמְתַקְּנֵהוּ לַכֹּהֵן וּמְקַשְּׁטוֹ:<br><br><b>אשר עליו.<\/b> לְמַעְלָה בִּשְׂפַת הַסִּינָר, הִיא הַחֲגוֹרָה:<br><br><b>כמעשהו.<\/b> כַּאֲרִיגַת הַסִּינָר מַעֲשֵׂה חוֹשֵׁב וּמֵחֲמֵשֶׁת מִינִים, כָּךְ אֲרִיגַת הַחֵשֶׁב מַעֲשֵׂה חוֹשֵׁב וּמֵחֲמֵשֶׁת מִינִין:<br><br><b>ממנו יהיה.<\/b> עִמּוֹ יִהְיֶה אָרוּג וְלֹא יַאַרְגֶנּוּ לְבַד וִיחַבְּרֶנּוּ:", "rashi_en": "וחשב אפדתו This signifies, and the girdle by means of which he bedecks it (the ephod) and puts it in order for the priest and adorns him (cf. Rashi on v. 4).<br><br>אשר עליו WHICH WAS UPON IT — above on the edge of the apron: this is therefore the girdle.<br><br>כמעשהו ACCORDING TO THE WORK THEREOF — as the weaving of the apron — the work of an artist and of the five materials — so the weaving of the belt, also, was the work of an artist and of the five materials.<br><br>ממנה יהיה IT SHALL BE OF THE SAME — it shall be woven together with it, and one shall not weave it separately, and join its afterwards."}, {"ch": 28, "v": 9, "aliyah": 1, "heb": "וְלָ֣קַחְתָּ֔ אֶת־שְׁתֵּ֖י אַבְנֵי־שֹׁ֑הַם וּפִתַּחְתָּ֣ עֲלֵיהֶ֔ם שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְתִסַּב יָת תַּרְתֵּין אַבְנֵי בוּרְלָא וְתִגְלוֹף עֲלֵיהֶן שְׁמָהַת בְּנֵי יִשְׂרָאֵל:", "onk_en": "Take two shoham [onyx] stones and engrave on them the names of the B’nei Yisrael.", "pj": "וְתִיסַב יַת תַּרְתֵּין מַרְגַלְיַין דְּבוּרְלָא וְתִגְלוֹף עֲלֵיהוֹן שְׁמָהַת בְּנֵי יִשְרָאֵל", "pj_en": "And thou shalt take two gems of onyx, and engrave upon them the names of the sons of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 10, "aliyah": 1, "heb": "שִׁשָּׁה֙ מִשְּׁמֹתָ֔ם עַ֖ל הָאֶ֣בֶן הָאֶחָ֑ת וְאֶת־שְׁמ֞וֹת הַשִּׁשָּׁ֧ה הַנּוֹתָרִ֛ים עַל־הָאֶ֥בֶן הַשֵּׁנִ֖ית כְּתוֹלְדֹתָֽם׃", "onk": "שִׁתָּא מִשְּׁמָהָתְהוֹן עַל אַבְנָא חֲדָא וְיָת שְׁמָהַת שִׁתָּא דְאִשְׁתָּאָרוּ עַל אַבְנָא תִנְיֵתָא כְּתוּלְדָתְהוֹן:", "onk_en": "Six of their names on the one stone, and the remaining six names on the second stone, in the order of their birth.", "pj": "שִׁיתָּא מִן קְצַת שְׁמָהַתְהוֹן עַל מַרְגַלְיָיא חֲדָא וְיַת שְׁמָהַת שִׁיתָּא דְמִשְׁתַּיְירִין עַל מַרְגְּלִיתָא תִּנְיָתָא מְסַדְרִין הֵי כְּיַלְדוּתְהוֹן", "pj_en": "Six of their names shall be engraven upon one gem, and the six remaining names upon the second gem; they shall be set in the order of their nativity.", "tj": "", "tj_en": "", "rashi": "<b>כתולדתם.<\/b> כַּסֵּדֶר שֶׁנּוֹלְדוּ – רְאוּבֵן, שִׁמְעוֹן, לֵוִי, יְהוּדָה, דָּן, נַפְתָלִי עַל הָאַחַת, וְעַל הַשְּׁנִיָּה גָּד, אָשֵׁר, יִשָּׂשכָר זְבוּלֻן, יוֹסֵף, בִּנְיָמִין מָלֵא, שֶׁכֵּן הוּא כָתוּב בִּמְקוֹם תּוֹלַדְתּוֹ, כ\"ה אוֹתִיּוֹת בְּכָל אַחַת וְאַחַת:", "rashi_en": "כתולדתם ACCORDING TO THEIR BIRTH — in the order in which they were born: Reuben, Simeon, Levi, Judah, Dan, Naphtali upon one, and upon the other Gad, Asher, Issachar, Zebulun, Joseph and Benjamin — the last name being written full (plene, with a י before the last letter, thus: בנימין) for that is how it is written in the passage that tells of his birth (Genesis 35:18). This gives twenty-five letters on each stone (cf. Sotah 36a)."}, {"ch": 28, "v": 11, "aliyah": 1, "heb": "מַעֲשֵׂ֣ה חָרַשׁ֮ אֶ֒בֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת־שְׁתֵּ֣י הָאֲבָנִ֔ים עַל־שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽם׃", "onk": "עוֹבַד אֳמַן אֶבֶן <b>טָבָא כְּתַב מְפָרַשׁ כִּגְלֹּף דְּעִזְקָא<\/b> תִּגְלוֹף יָת תַּרְתֵּין אַבְנַיָּא עַל שְׁמָהַת בְּנֵי יִשְׂרָאֵל מְשַׁקְּעָן מְרַמְּצָן דִּדְהַב תַּעְבֵּד יָתְהוֹן:", "onk_en": "The work of a skilled [<b>precious<\/b>] stone engraver, like the engraving of a signet [ring] [<b>written in script that is clear like they engrave a signet ring<\/b>] shall you engrave the two stones with the names of the B’nei Yisrael. In gold settings shall you place them.", "pj": "עוֹבַד אוּמַן יֶהֶוְיַין מַרְגְּלַיְיתָא גְּלוּף חָקִיק וּמְפָרֵשׁ הֵי כִּגְלוֹף דְּעִזְקָא תִּגְלוֹף יַת תַּרְתֵּין מַרְגְּלִיָיתָא עַל שְׁמָהַת בְּנֵי יִשְרָאֵל מַקְפַן בְּאוּמַנְוַתְהוֹן מְרַמְצָן דִּדְהַב תַּעֲבֵיד יַתְהוֹן", "pj_en": "The engraved gems shall be the work of the artificer, engraven, and the engraving be distinct as the engraving of a ring; thou shalt engrave the two gems according to the names of the sons of Israel in their work round about; inset in gold shalt thou make them.", "tj": "", "tj_en": "", "rashi": "<b>מעשה חרש אבן.<\/b> מַעֲשֵׂה אֻמָּן שֶׁל אֲבָנִים, חָרַשׁ זֶה דָּבוּק הוּא לַתֵּבָה שֶׁלְּאַחֲרָיו וּלְפִיכָךְ הוּא נָקוּד פַּתָּח בְּסוֹפוֹ, וְכֵן חָרַשׁ עֵצִים נָטָה קָו (ישעיהו מ\"ד) – חָרָשׁ שֶׁל עֵצִים, וְכֵן חָרַשׁ בַּרְזֶל מַעֲצָד, (שם), כָּל אֵלֶּה דְּבוּקִים וּפְתוּחִים:<br><br><b>פתוחי חתם.<\/b> כְּתַרְגּוּמוֹ כְּתַב מְפָרַשׁ כִּגְלֹף דְּעִזְקָא, חֲרוּצוֹת הָאוֹתִיּוֹת בְּתוֹכָן כְּמוֹ שֶׁחוֹרְצִין חוֹתְמֵי טַבָּעוֹת שֶׁהֵם לַחְתֹּם אִגְּרוֹת – כְּתָב נִכָּר וּמְפֹרָשׁ:<br><br><b>על שמת.<\/b> כְּמוֹ בִּשְׁמֹת:<br><br><b>מסבת משבצות.<\/b> מֻקָּפוֹת הָאֲבָנִים בְּמִשְׁבְּצוֹת זָהָב, שֶׁעוֹשֶׂה מוֹשַׁב הָאֶבֶן בְּזָהָב כְּמִין גֻּמָּא לְמִדַּת הָאֶבֶן וּמְשַׁקְּעָהּ בַּמִּשְׁבֶּצֶת, נִמְצֵאת הַמִּשְׁבֶּצֶת סוֹבֶבֶת אֶת הָאֶבֶן סָבִיב וּמְחַבֵּר הַמִּשְׁבְּצוֹת בְּכִתְפוֹת הָאֵפוֹד:", "rashi_en": "מעשה חרש אבן means THE WORK OF AN ARTIFICER IN STONES. This word חרש is in close connection (i. e. in the construct state) with the word that follows it and therefore it is punctuated with Patach in its last syllable. Similar is, (Isaiah 44:13) “The חָרַשׁ עצים stretcheth out a line” i. e. the worker in wood. So, also, (Isaiah 44:12) “the worker in (חָרַשׁ) iron maketh an axe.” All these examples of חָרַשׁ are in close connection with the words that follows them and are therefore punctuated with Patach.<br><br>פתוחי חותם LIKE THE ENGRAVINGS OF A SIGNET — Understand this as the Targum renders it: a distinct writing like the engraving of a signet-ring: the letters were incised in them just as one incises the seals of a ring which are used to seal letters — a clear and distinct writing.<br><br>על שמות — This is the same as בשמות “with the names of”.<br><br>מסבת משבצות SURROUNDED WITH SETTINGS [OF GOLD] — Thou shalt make the stones to be surrounded by gold settings: the meaning is that they should make as a setting for each stone a kind of indentation in the gold, of the same size as the stone and sink it in the setting; thus the setting surrounds the stone on all sides. That setting they attached to the shoulder-pieces of the ephod."}, {"ch": 28, "v": 12, "aliyah": 1, "heb": "וְשַׂמְתָּ֞ אֶת־שְׁתֵּ֣י הָאֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽאֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִבְנֵ֣י יִשְׂרָאֵ֑ל וְנָשָׂא֩ אַהֲרֹ֨ן אֶת־שְׁמוֹתָ֜ם לִפְנֵ֧י יְהֹוָ֛ה עַל־שְׁתֵּ֥י כְתֵפָ֖יו לְזִכָּרֹֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּתְשַׁוִּי יָת תַּרְתֵּין אַבְנַיָא עַל כִּתְפֵּי אֵפוֹדָא אַבְנֵי דָכְרָנָא לִבְנֵי יִשְׂרָאֵל וְיִטּוֹל אַהֲרֹן יָת שְׁמָהָתְהוֹן קֳדָם יְיָ עַל תְּרֵין כִּתְפּוֹהִי לְדָכְרָנָא:", "onk_en": "Set the two stones on the shoulder straps of the eiphod as remembrance stones for the B’nei Yisrael. Aharon shall bear their names before Adonoy, on his two shoulders as a remembrance.", "pj": "וּתְסַדֵּר יַת תַּרְתֵּין מַרְגָלִיָתָא עַל כִּתְפֵי אֵפוֹדָא מַרְגַלְיַית מְדַכְרַן זְכוּתָא לִבְנֵי יִשְרָאֵל וְיִטּוֹל אַהֲרן יַת שְׁמָהַת בְּנֵי יִשְרָאֵל עַל תְּרֵין כַּתְפוֹי לְדוּכְרָנָא", "pj_en": "And thou shalt fix the two gems upon the shoulders of the ephod, to be set for a memorial of righteousness for the sons, of Israel; and Aharon shall bear the names of the sons of Israel upon his two shoulders for a memorial.", "tj": "", "tj_en": "", "rashi": "<b>לזכרן.<\/b> שֶׁיְּהֵא רוֹאֶה הַקָּבָּ\"ה אֶת הַשְּׁבָטִים כְּתוּבִים לְפָנָיו וְיִזְכֹּר צִדְקָתָם:", "rashi_en": "לזכרון FOR A MEMORIAL — so that the Holy One, blessed be He, will see the names of the tribes written before Him and He will remember their righteousness (cf. Exodus Rabbah 38:8)."}, {"ch": 28, "v": 13, "aliyah": 2, "heb": "וְעָשִׂ֥יתָ מִשְׁבְּצֹ֖ת זָהָֽב׃", "onk": "וְתַעְבֵּד מְרַמְּצָן דִּדְהָב:", "onk_en": "Make gold settings,", "pj": "וְתַעֲבֵיד מְרַמְצָן דִּדְהַב", "pj_en": "And thou shalt make the sockets of gold.", "tj": "", "tj_en": "", "rashi": "<b>ועשית משבצת.<\/b> מִעוּט מִשְׁבְּצוֹת שְׁתַּיִם; וְלֹא פֵּרֵשׁ לְךָ עַתָּה בְּפָרָשָׁה זוֹ אֶלָּא מִקְּצָת צָרְכָּן, וּבְפָרָשַׁת הַחֹשֶׁן גּוֹמֵר לְךָ פֵּרוּשָׁן:", "rashi_en": "ועשית משבצת AND THOU SHALT MAKE SETTINGS — two settings, for the minimum number of settings (the plural) is two. In this section it explains to you only part of their purpose, whilst in the section dealing with the breast-plate it completes for you the explanation about them."}, {"ch": 28, "v": 14, "aliyah": 2, "heb": "וּשְׁתֵּ֤י שַׁרְשְׁרֹת֙ זָהָ֣ב טָה֔וֹר מִגְבָּלֹ֛ת תַּעֲשֶׂ֥ה אֹתָ֖ם מַעֲשֵׂ֣ה עֲבֹ֑ת וְנָתַתָּ֛ה אֶת־שַׁרְשְׁרֹ֥ת הָעֲבֹתֹ֖ת עַל־הַֽמִּשְׁבְּצֹֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתַרְתֵּין תִּכִּין דְּהַב דְּכֵי מְתַחְמָן תַּעְבֵּד יָתְהוֹן עוֹבַד גְּדִילוּ וְתִתֵּן יָת תִּכַּיָּא גְדִילָתָא עַל מְרַמְּצָתָא:", "onk_en": "and two chains of pure gold, you will make them for the ends, a braided work. and you will fasten the braided chain’s to the settings.", "pj": "וְתַרְתֵּין שִׁישְׁלַן דִּדְהַב דְּכֵי מְתַחְמָן תַּעֲבֵיד יַתְהוֹן עוֹבַד קְלִיעָא וְתִתֵּן יַת שׁוֹשִׁילְתָּא קְלִיעֲתָא עַל מְרַמְצָתָא", "pj_en": "And two chains of pure gold, measured shalt thou make them, of twisted work, and insert the twisted chains in the sockets.", "tj": "שִׁישְׁלָן:", "tj_en": "Chains.", "rashi": "<b>שרשרת זהב.<\/b> שַׁלְשְׁלָאוֹת:<br><br><b>מגבלת.<\/b> לְסוֹף גְּבוּל הַחֹשֶׁן תַּעֲשֶׂה אוֹתָם:<br><br><b>מעשה עבת.<\/b> מַעֲשֵׂה קְלִיעַת חוּטִין, וְלֹא מַעֲשֵׂה נְקָבִים וּכְפָלִים כְּאוֹתָן שֶׁעוֹשִׂין לְבוֹרוֹת, אֶלָּא כְּאוֹתָן שֶׁעוֹשִׂין לְעַרְדַּסְקָאוֹת שֶׁקּוֹרִין אנשנשוי\"רש בְּלַעַז:<br><br><b>ונתתה את שרשרת.<\/b> שֶׁל עֲבוֹתוֹת הָעֲשׂוּיוֹת מַעֲשֵׂה עֲבוֹת עַל מִשְׁבְּצוֹת הַלָּלוּ; וְלֹא זֶה הוּא מְקוֹם צַוָּאַת עֲשִׂיָּתָן שֶׁל שַׁרְשְׁרוֹת, וְלֹא צַוָּאַת קְבִיעָתָן, אֵין תַּעֲשֶׂה הָאָמוּר כָּאן לְשׁוֹן צִוּוּי, וְאֵין וְנָתַתָּה הָאָמוּר כָּאן לְשׁוֹן צִוּוּי, אֶלָּא לְשׁוֹן עָתִיד, כִּי בְּפָרָשַׁת הַחֹשֶׁן חוֹזֵר וּמְצַוֶּה עַל עֲשִׂיָּתָן וְעַל קְבִיעָתָן, וְלֹא נִכְתַּב כָּאן אֶלָּא לְהוֹדִיעַ מִקְּצַת צֹרֶךְ הַמִּשְׁבְצוֹת שֶׁצִּוָּה לַעֲשׂוֹת עִם הָאֵפוֹד, וְכָתַב לְךָ זֹאת לוֹמַר לְךָ הַמִּשְׁבְּצוֹת הַלָּלוּ יִזָּקְקוּ לְךָ, לִכְשֶׁתַּעֲשֶׂה שַׁרְשְׁרוֹת מִגְבָּלוֹת עַל הַחֹשֶׁן, תִּתְּנֵם עַל הַמִּשְׁבְּצוֹת הַלָּלוּ:", "rashi_en": "שרשרת זהב means CHAINS OF GOLD — the word being the same as שלשלאות (the letters ל and ר being interchangeable, as in ארמנות for אלמנות; cf. the Aramaic ארמלתא)<br><br>מגבלות means AT THE END OF THE BORDER (גבול) of the breast-plate תעשה אותם SHALT THOU MAKE THEM.<br><br>מעשה עבת OF CORD-LIKE WORK — made of plaited threads and not made of rings and hooks (somewhat like links) like those chains which are made for cisterns (to which the bucket is attached), but like those which are made for censers which are called encensiers in old French (cf. Rashi on Beitzah 22b).<br><br>ונתת את שרשרת — This means, AND THOU WILT PLACE THE CHAINS OF CORD-WORK — i. e. the chains made of cord-work — upon these settings. This is not the place where the command is laid down about making the chains nor is this the command about fixing them: the word תעשה used here does not express a command, nor does the word ונתת used here express a command, but these express the future tense. For in the chapter about the breast-plate He returns to this, and there He lays down the command about making them (v. 22) and fixing them (vv. 24—25). This is written here only to point out part of the purpose of the settings which He commanded to be made together with the ephod, and He wrote this here to tell you: these settings you will require — when you will make chains at the ends upon the breast-plate you shall put them upon these settings."}, {"ch": 28, "v": 15, "aliyah": 2, "heb": "וְעָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּמַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑נּוּ זָ֠הָ֠ב תְּכֵ֨לֶת וְאַרְגָּמָ֜ן וְתוֹלַ֧עַת שָׁנִ֛י וְשֵׁ֥שׁ מׇשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽוֹ׃", "onk": "וְתַעְבֵּד חשֶׁן דִּינָא עוֹבַד אֳמָן כְּעוֹבַד אֵפוֹדָא תַּעְבְּדִנֵּיהּ דַּהֲבָא תִּכְלָא וְאַרְגְּוָנָא וּצְבַע זְהוֹרִי וּבוּץ שְׁזִיר תַּעְבֵּד יָתֵיהּ:", "onk_en": "Make a breastplate of judgment, the work of a craftsman. Make it in the same manner you made the eiphod. [Out of] gold, greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool and fine twined linen, shall you make it.", "pj": "וְתַעֲבֵיד חוֹשֶׁן דִּינָא דְּבֵיהּ מְהוֹדַע דִּינֵיהוֹן דְּיִשְרָאֵל דְּאִתְכַּסֵּי מִן דַּיָינַיָא וְסִדְרֵי נַצְחַן קְרָבֵיהוֹן וּלְמִכַפְּרָא עַל דַּיָינַיָא עוֹבֵד אוּמַן הֵי עוֹבַד אֵפוֹדָא תַעַבְדִינֵיהּ דַּהֲבָא תִּיכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ שְׁזִיר תַּעֲבֵיד יָתֵיהּ", "pj_en": "And thou shalt make the BREASTPLATE OF JUDGMENT, by which are made known the judgments that are hidden from the judges; and the order of the victories of their battles, and amends that are made for the judges; the work of the artificer; as the work of the ephod, thou shalt make it; of gold, hyacinth, and purple, and crimson, and fine linen twined, thou shalt make it.", "tj": "", "tj_en": "", "rashi": "<b>חשן משפט.<\/b> שֶׁמְּכַפֵּר עַל קִלְקוּל הַדִּין. דָּ\"אַ, מִשְׁפָּט שֶׁמְּבָרֵר דְּבָרָיו וְהַבְטָחָתוֹ אֱמֶת, דריש\"נטנט בְּלַעַז; שֶׁהַמִּשְׁפָּט מְשַׁמֵּשׁ שָׁלֹשׁ לְשׁוֹנוֹת, דִּבְרֵי טַעֲנוֹת הַבַּעֲלֵי דִּינִים וּגְמַר הַדִּין וְעֹנֶשׁ הַדִּין, אִם עֹנֶשׁ מִיתָה, אִם עֹנֶשׁ מַכּוֹת, אִם עֹנֶשׁ מָמוֹן, וְזֶה מְשַׁמֵּשׁ לְשׁוֹן בֵּרוּר דְּבָרִים, שֶׁמְּפָרֵשׁ וּמְבָרֵר דְּבָרָיו:<br><br><b>כמעשה אפד.<\/b> מַעֲשֵׂה חוֹשֵׁב וּמֵחֲמֵשֶׁת מִינִין:", "rashi_en": "חשן משפט THE BREAST-PLATE OF JUDGMENT — it was so called because it atoned for any error in judgment (cf. Zevachim 88b; Jerusalem Talmud Yoma 7:5). Another explanation of why it is called “the breast-plate of משפט”, is because it makes its statements clear (definite — so that there can be no doubt about their meaning) and its promise is true; discerement in old French, (sentence of judgment). Because the word משפט is used in three senses: the contentions of the parties to the law-suit, the pronouncement of the sentence and the punishment attendant on the sentence, whether it be punishment of death or punishment of flagellation or punishment involving a monetary payment; here it is used in the sense of making its statements definite, so that this is the breast-plate with the Urim and Thummim which explains and makes its statement clear.<br><br>כמעשה אפד AFTER THE WORK OF THE EPHOD — the work of an artist and of the five materials."}, {"ch": 28, "v": 16, "aliyah": 2, "heb": "רָב֥וּעַ יִֽהְיֶ֖ה כָּפ֑וּל זֶ֥רֶת אׇרְכּ֖וֹ וְזֶ֥רֶת רׇחְבּֽוֹ׃", "onk": "מְרַבַּע יְהֵי עֵיף זֶרְתָּא אֻרְכֵּיהּ וְזֶרְתָּא פְתָיֵהּ:", "onk_en": "It shall be a doubled square, a span in its length and a span in its width.", "pj": "מְרַבַּע יְהֵי עֵיף זַרְתָּא אוּרְכֵּיהּ וְזַרְתָּא פּוּתְיֵיהּ", "pj_en": "Square shall it be, doubled; a span its length, and a span its breadth.", "tj": "פְּשַׁךְ:", "tj_en": "A handsbreadth.", "rashi": "<b>זרת ארכו וזרת רחבו.<\/b> כָּפוּל; וּמֻטָּל לוֹ לְפָנָיו כְּנֶגֶד לִבּוֹ, שֶׁנֶּאֱמַר וְהָיוּ עַל לֵב אַהֲרֹן, תָּלוּי בְּכִתְפוֹת הָאֵפוֹד הַבָּאוֹת מֵאֲחוֹרָיו עַל כְּתֵפָיו וְנִקְפָּלוֹת וְיוֹרְדוֹת לְפָנָיו מְעַט, וְהַחֹשֶׁן תָּלוּי בָּהֶן בְּשַׁרְשְׁרוֹת וְטַבָּעוֹת כְּמוֹ שֶׁמְּפֹרָשׁ בָּעִנְיָן:", "rashi_en": "זרת ארכו וזרת רחבו A SPAN IN LENGTH AND A SPAN IN WIDTH, being double (Exodus 39:9) and it lay on him in front over his heart, as it is said, (v. 30) “And they shall be upon Aaron’s heart.” It was suspended from the shoulder-pieces of the ephod which came from behind him upon his shoulders and hung over and fell down a little way in front of him, and the breast-plate was suspended from them by means of the chains and rings, as is explained in the section (vv. 22—29)."}, {"ch": 28, "v": 17, "aliyah": 2, "heb": "וּמִלֵּאתָ֥ בוֹ֙ מִלֻּ֣אַת אֶ֔בֶן אַרְבָּעָ֖ה טוּרִ֣ים אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּבָרֶ֔קֶת הַטּ֖וּר הָאֶחָֽד׃", "onk": "וְתַשְׁלֵם בֵּיהּ אַשְׁלָמוּת אַבְנָא אַרְבְּעָא סִדְרִין אֶבֶן <b>טָבָא סִדְרָא קַדְמָאָה<\/b> סַמְקָן יַרְקָן וּבַרְקָן סִדְרָא <b>חָד<\/b>:", "onk_en": "Fill it [the breastplate settings] with fillings of [mounted] stones. Their shall be four rows of [<b>precious<\/b>] stones: [<b>The first row:<\/b>] An odem [ruby], pitda [topaz], and a barekes [emerald], [shall be placed on] the first row [<b>one<\/b>].", "pj": "וְתַשְׁלֵים בֵּיהּ אַשְׁלָמוּת דְּמַרְגַּלְיָין טַבָאָן אַרְבְּעָא סִדְרִין דִּמַרְגַלְיָין טַבָאָן כָּל קָבֵיל אַרְבַּע טְרִיגוֹנִין דְּעַלְמָא סִדְרָא קַדְמָאָה סִמוּקְתָּא יַרְקְתָא וּבַרְקְתָא סִדְרָא חָד וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת שִׁבְטַיָא רְאוּבֵן שִׁמְעוֹן וְלֵוִי", "pj_en": "And thou shalt fill it with a fulness of precious stones: four rows of precious gems, answering to the four regions of the world. The first row, carnelian, topaz, carbuncle; and on them shall be engraven and expressed the names of the tribes Reuben, Shemeon, and Levi.", "tj": "וְתַשְׁלִים עִמֵּיהּ אַשְׁלִימוּ דְאַבְנָא אַרְבַּע סְדָרִין דְּאֶבֶן טָבָא סִידְרָא קַמְיָיתָא סַמְקָתָא וְיַרְקָתָא וּבַרְקָתָא כְּתַב מְפָרַשׁ עֲלֵיהוֹן שֵׁם שִׁבְטִין תְּלָתָא רְאוּבֵן שִׁמְעוֹן לֵוִי:", "tj_en": "And thou shalt fill it with a filling of stones, four rows of precious stone; the first row, carnelian, and topaz, and carbuncle; written with expression upon it (shall be) the name of the three tribes, Reuben, Shemeon, Levi.", "rashi": "<b>ומלאת בו.<\/b> עַל שֵׁם שֶׁהָאֲבָנִים מְמַלְּאוֹת גֻּמּוֹת הַמִּשְׁבְּצוֹת הַמְתֻקָּנוֹת לָהֶן, קוֹרֵא אוֹתָן בִּלְשׁוֹן מִלּוּאִים:", "rashi_en": "ומלאת בו AND THOU SHALT FILL IT [WITH FILLINGS OF STONES] — Because the stones fill the hollows of the settings which were specially made for them it calls them by the term מלואים “fillings”."}, {"ch": 28, "v": 18, "aliyah": 2, "heb": "וְהַטּ֖וּר הַשֵּׁנִ֑י נֹ֥פֶךְ סַפִּ֖יר וְיָהֲלֹֽם׃", "onk": "וְסִדְרָא תִּנְיָנָא אִזְמָרַגְדִּין וְשַׁבְזִיז וְסִבְהֲלוֹם:", "onk_en": "The second row: nofech [carbuncle], sapphire, and yahalom [diamond].", "pj": "וְשׁוּם סִדְרָא תִּנְיָנָא אִיזְמוֹרַד וְסַפִּירִינוּן וְכַדְכוֹדֵי וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלָתָא שִׁבְטַיָא יְהוּדָה דָּן וְנַפְתָּלִי", "pj_en": "And the name of the second row, smaragd, and sapphire and chalcedony; and upon them shall be engraven and expressed the names of the three tribes, Jehuda, Dan, and Naphtali.", "tj": "וְסִידְרָא תִּנְיָנָא כַּדְכְּדָנָא וְסִמְפּוּלְיָנָא וְעֵין עִיגְלָא כְּתַב מְפָרַשׁ עֲלֵיהוֹן שֵׁם שִׁבְטִין תְּלָתָא יְהוּדָה יִשָשׁכָר וּזְבוּלוּן:", "tj_en": "And the second row, carbuncle, and sapphire, and amethyst; in writing expressed upon them, the name of the three tribes, Jehudah, Issakar, and Zebulon.", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 19, "aliyah": 2, "heb": "וְהַטּ֖וּר הַשְּׁלִישִׁ֑י לֶ֥שֶׁם שְׁב֖וֹ וְאַחְלָֽמָה׃", "onk": "וְסִדְרָא תְּלִיתָאָה קַנְכִּירֵי טַרְקְיָא וְעֵין עֶגְלָא:", "onk_en": "The third row: leshem [opal], shevo [agate], and achlomo [amethyst].", "pj": "וְשׁוּם סִדְרָא תְּלִיתָאָה קַנְכִּירִינוּן וְעַרְקִין וְעֵין עֵיגָל וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלָתָא שִׁבְטַיָא גָּד וְאָשֵׁר וְיִשָשׁכָר", "pj_en": "And the name of the third row, ligure, and agate, and amethyst; and upon them shall be written and expressed the names of three tribes, Gad, and Asher, and Issakar.", "tj": "וְסִידְרָא תְּלִיתָאָה זוֹזוּן וּבִירְזְלִין וּזְמַרְגְּדִין כְּתַב מְפָרַשׁ עֲלֵיהוֹן שֵׁם שִׁבְטִין תְּלָתָא דָּן נַפְתָּלִי וְגָד:", "tj_en": "And third row, ligure, and beryl, and smaragd; written expressly upon them (shall be) the name of the three tribes, Dan, Naphtali, and Gad.", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 20, "aliyah": 2, "heb": "וְהַטּוּר֙ הָרְבִיעִ֔י תַּרְשִׁ֥ישׁ וְשֹׁ֖הַם וְיָשְׁפֵ֑ה מְשֻׁבָּצִ֥ים זָהָ֛ב יִהְי֖וּ בְּמִלּוּאֹתָֽם׃", "onk": "וְסִדְרָא רְבִיעָאָה כְּרוּם יַמָּא וּבוּרְלָא וּפַנְטֵרֵי מְרַמְּצָן דִּדְהַב יְהוֹן בְּאַשְׁלָמוּתְהוֹן:", "onk_en": "The fourth row: tarshish [chrysolite], shoham [onyx], and yoshfei [jasper]. [These stones] shall be placed in gold settings in their fullness.", "pj": "וְשׁוּם סִדְרָא רְבִיעָאָה כְּרוּם יַמָא רַבָּא וּבִירְלֵיוַות חַלָא וּמַרְגְּנִיַית אַפַּנְטוּרִין וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלָתָא שִׁבְטַיָא זְבוּלוּן יוֹסֵף וּבִנְיָמִין מְשַׁקְעִין בִּדְהַב יְהוֹן בְּאַשְׁלָמוּתְהוֹן", "pj_en": "And the name of the fourth row, chrysolite, onyx, and jasper; and upon them shall be written and expressed the names of three tribes, Zebulon, Joseph, and Benjamin. Set in gold shall they be, in their completeness.", "tj": "וְסִדְרָא רְבִיעָאָה כְּרוּם יַמָא בְּדוֹלְחָא וּמַרְגְּלִיתָא כְּתַב מְפָרַשׁ עֲלֵיהוֹן שֵׁם שִׁבְטִין תְּלָתָא אָשֵׁר יוֹסֵף וּבִנְיָמִין מְשַׁקְעִין דְהַב יֶהֱוַון בְּאַשְׁלָמוּתְהוֹן:", "tj_en": "And the fourth row, chrysolite, bdellium, and margelite. Written expressly upon them shall be the name of the three tribes, Asher, Joseph, and Benjamin: socketed in gold shall they be, in their completeness", "rashi": "<b>משבצים זהב יהיו.<\/b> הַטּוּרִים <b>במלואתם<\/b> – מֻקָּפִים מִשְׁבְּצוֹת זָהָב בְּעֹמֶק שִׁעוּר שֶׁיִּתְמַלֵּא בְּעֹבִי הָאֶבֶן, זֶהוּ לְשׁוֹן בְּמִלּוּאֹתָם, כְּשִׁעוּר מִלּוּי עָבְיָן שֶׁל אֲבָנִים יִהְיֶה עֹמֶק הַמִּשְׁבְּצוֹת, לֹא פָחוֹת וְלֹא יוֹתֵר:", "rashi_en": "משבצים זהב יהיו SET IN GOLD SHALL THEY — the rows — BE במלאותם IN THEIR SETTINGS — surrounded by gold settings in depth of such a size that each shall be filled by the thickness of the stone. This is the meaning of במלאותם, “in their fillings”: of such a size as will be filled by the thickness of the stones shall be the depth of the settings, neither more nor less."}, {"ch": 28, "v": 21, "aliyah": 2, "heb": "וְ֠הָאֲבָנִ֠ים תִּֽהְיֶ֜יןָ עַל־שְׁמֹ֧ת בְּנֵֽי־יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל־שְׁמֹתָ֑ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל־שְׁמ֔וֹ תִּֽהְיֶ֕יןָ לִשְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט׃", "onk": "וְאַבְנַיָּא יְהֶוְיָן עַל שְׁמָהַת בְּנֵי יִשְׂרָאֵל תַּרְתֵּי עֶסְרֵי עַל שְׁמָהַתְהוֹן <b>כְּתַב מְפָרַשׁ כִּגְלוֹף דְּעִזְקָא<\/b> גְּבַר עַל שְׁמֵיהּ תְּהֶוְיָן לִתְרֵין עֲסַר שִׁבְטִין:", "onk_en": "These stones shall have on them the names of the B’nei Yisrael, twelve of them by their names, each one’s name [<b>written in script that is clear like they engrave a signet ring<\/b>] engraved as on a signet [ring], representing the twelve tribes.", "pj": "וּמַרְגַּלְיָיתָא תֶהֶוְיָין מִתְנַסְבָן עַל שְׁמָהַת בְּנֵי יִשְרָאֵל הִינוּן תַּרְתֵּיסְרֵי עַל שְׁמָהַתְהוֹן גְּלִיף חָקִיק וּפָרַשׁ הֵי כִּגְלוֹף דְּעִזְקָא גְּבַר מַרְגָּלִיתֵיהּ עַל שְׁמֵיהּ תֶּהֶוְיַין לִתְרֵיסַר שִׁבְטִין", "pj_en": "And the jewels shall be taken according to the names of the sons of Israel, twelve are they according to their names, engraven and set forth as the engraving of a ring; the gem of each man according to his name: (so) shall they be for the twelve tribes.", "tj": "", "tj_en": "", "rashi": "<b>איש על שמו.<\/b> כְּסֵדֶר תּוֹלְדוֹתָם סֵדֶר הָאֲבָנִים, אֹדֶם לִרְאוּבֵן, פִּטְדָה לְשִׁמְעוֹן, וְכֵן כֻּלָּם:", "rashi_en": "איש על שמו EVERY ONE WITH HIS NAME — As the order in which they were born shall be the order of the stones: a sardius for Reuben, a topaz for Simeon, and so in the case of all of them."}, {"ch": 28, "v": 22, "aliyah": 2, "heb": "וְעָשִׂ֧יתָ עַל־הַחֹ֛שֶׁן שַֽׁרְשֹׁ֥ת גַּבְלֻ֖ת מַעֲשֵׂ֣ה עֲבֹ֑ת זָהָ֖ב טָהֽוֹר׃", "onk": "וְתַעְבֵּד עַל חוּשְׁנָא תִּכִּין מְתַחְמָן עוֹבַד גְּדִילוּ דְּהַב דְּכֵי:", "onk_en": "Make [two] twisted end-chains for the breastplate, braided work of pure gold.", "pj": "וְתַעֲבֵיד עַל חוּשְׁנָא שִׁישְׁלַן מְתַחְמָן עוֹבַד קְלִיעָא דִּדְהַב דְּכֵי", "pj_en": "And thou shalt make upon the breastplate measured chains of twisted work of pure gold,", "tj": "", "tj_en": "", "rashi": "<b>על החשן.<\/b> בִּשְׁבִיל הַחֹשֶׁן, לְקָבְעָם בְּטַבְּעוֹתָיו, כְּמוֹ שֶׁמְּפֹרָשׁ לְמַטָּה בָעִנְיָן:<br><br><b>שרשת.<\/b> לְשׁוֹן שָׁרְשֵׁי אִילָן, הַמְאַחֲזִין לָאִילָן לְהֵאָחֵז וּלְהִתָּקַע בָּאָרֶץ, אַף אֵלּוּ יִהְיוּ מְאַחֲזִין לַחֹשֶׁן שֶׁבָּהֶם יִהְיֶה תָלוּי בָּאֵפוֹד, וְהֵן שְׁתֵּי שַׁרְשְׁרוֹת הָאֲמוּרוֹת לְמַעְלָה בְּעִנְיַן הַמִּשְׁבְּצוֹת; וְאַף שַׁרְשְׁרוֹת פָּתַר מְנַחֵם בֶּן סָרוּק לְשׁוֹן שָׁרָשִׁים, וְאָמַר שֶׁהָרֵי\"שׁ יְתֵרָה כְּמוֹ מ\"ם שֶׁבְּשִׁלְשׁוֹם וּמ\"ם שֶׁבְּרֵיקָם, וְאֵינִי רוֹאֶה אֶת דְּבָרָיו, אֶלָּא שַׁרְשֶׁרֶת בִּלְשׁוֹן עִבְרִית כְּשַׁלְשֶׁלֶת בִּלְשׁוֹן מִשְׁנָה:<br><br><b>גבלת.<\/b> הוּא מִגְבָּלוֹת הָאָמוּר לְמַעְלָה, שֶׁתִּתְקָעֵם בַּטַּבָּעוֹת שֶׁיִּהְיוּ בִּגְבוּל הַחֹשֶׁן, וְכָל גְּבוּל לְשׁוֹן קָצֶה, אשומי\"יל בְּלַעַז:<br><br><b>מעשה עבת.<\/b> מַעֲשֵׂה קְלִיעָה:", "rashi_en": "על החשן means [AND THOU SHALT MAKE] FOR THE BREAST-PLATE (not upon it), — in order to fasten them (the plaited chains) on its rings, as is explained further on in the section.<br><br>שרשת — This is the same expression as the roots (שֹׁרֶשׁ) of a tree which hold the tree firm so that it may be held and kept fixed in the ground. Thus, also, these roots, as it were, shall hold the breast-plate firm because from them shall it hang on the ephod. These were really the two plaited chains which are mentioned above in the section on the settings (v. 14). Indeed, Menachem ben Seruk actually explained the word שרשרות as well in the sense of roots and he said that the second ר was redundant, just as the ם in שלשם and the ם in ריקם. I, however, do not agree with his statement, but I am of opinion that שַׁרְשֶׁרֶת in the Hebrew language is the equivalent of שַׁלְשֶׁלֶת in the Mishnaic language (Mishnah Kelim 14:3) (cf. Rashi on v. 14).<br><br>גבלת — This is the same as מגבלות used above, (v. 14) meaning that thou shalt fix them in the rings which will be on the border (גבול) of the breast-plate. Wherever the word גבול occurs it has the meaning of end; à sommel in old French<br><br>מעשה עבת means PLAITED WORK."}, {"ch": 28, "v": 23, "aliyah": 2, "heb": "וְעָשִׂ֙יתָ֙ עַל־הַחֹ֔שֶׁן שְׁתֵּ֖י טַבְּע֣וֹת זָהָ֑ב וְנָתַתָּ֗ אֶת־שְׁתֵּי֙ הַטַּבָּע֔וֹת עַל־שְׁנֵ֖י קְצ֥וֹת הַחֹֽשֶׁן׃", "onk": "וְתַעְבֵּד עַל חוּשְׁנָא תַּרְתֵּין עִזְקָן דִּדְהַב וְתִתֵּן יָת תַּרְתֵּין עִזְקָתָא עַל תְּרֵין <b>סִטְרֵי<\/b> חוּשְׁנָא:", "onk_en": "Make two gold ring’s for the breastplate, and set the two rings on the two [upper] corners [<b>sides<\/b>] for the breastplate.", "pj": "וְתַעֲבֵיד עַל חוּשְׁנָא תַּרְתֵּין עִזְקַן דִּדְהַב דְּכֵי וְתִתֵּן יַת תַּרְתֵּין עִזְקָתָא עַל תַּרְתֵּין סִטְרֵי חוּשְׁנָא", "pj_en": "and shalt make upon the breastplate two rings of pure gold, and put the two rings upon the two sides of the breastplate.", "tj": "", "tj_en": "", "rashi": "<b>על החשן.<\/b> לְצֹרֶךְ הַחֹשֶׁן – כְּדֵי לְקָבְעָם בּוֹ: וְלֹא יִתָּכֵן לוֹמַר שֶׁתְּהֵא תְּחִלַּת עֲשִׂיָּתָן עָלָיו, שֶׁאִם כֵּן מַה הוּא שֶׁחוֹזֵר וְאוֹמֵר וְנָתַתָּ אֶת שְׁתֵּי הַטַּבָּעוֹת וַהֲלֹא כְבָר נְתוּנִין בּוֹ? הָיָה לוֹ לִכְתֹּב בִּתְחִלַּת הַמִּקְרָא וְעָשִׂיתָ עַל קְצוֹת הַחֹשֶׁן שְׁתֵּי טַבְּעוֹת זָהָב, וְאַף בְּשַׁרְשְׁרוֹת צָרִיךְ אַתָּה לִפְתֹּר כֵּן:<br><br><b>על שני קצות החשן.<\/b> לִשְׁתֵּי פֵּאוֹת שֶׁכְּנֶגֶד הַצַּוָּאר, לַיְמָנִית וְלַשְּׂמָאלִית, הַבָּאִים מוּל כִּתְפוֹת הָאֵפוֹד:", "rashi_en": "על החשן means [AND THOU SHALT MAKE] FOR THE BREAST-PLATE (not upon it), — in order to fix them on it. And it would not be correct to say that this means that they should originally be made upon it (על), for if this were so why should it again say in this verse, “And thou shall put the two rings [on the two extremities]”? Would they not already have been lying upon it if they had been made together with the breast-plate? It should rather have written at the beginning of the verse, “And thou shalt make at the ends of the breast-plate two rings of gold.” In the case of chains, also, you must explain it similarly.<br><br>על שני קצת החשן ON THE TWO EXTREMITIES OF THE BREAST-PLATE — on its two corners that are close by his neck, on the right and on the left, which come opposite the shoulder-pieces of the ephod."}, {"ch": 28, "v": 24, "aliyah": 2, "heb": "וְנָתַתָּ֗ה אֶת־שְׁתֵּי֙ עֲבֹתֹ֣ת הַזָּהָ֔ב עַל־שְׁתֵּ֖י הַטַּבָּעֹ֑ת אֶל־קְצ֖וֹת הַחֹֽשֶׁן׃", "onk": "וְתִתֵּן יָת תַּרְתֵּין גְּדִילָן דִּדְהַב עַל תַּרְתֵּין עִזְקָתָא לְסִטְרֵי חוּשְׁנָא:", "onk_en": "Place [attach] the two gold-braided chains on the two rings, at the corners [<b>sides<\/b>] of the breastplate.", "pj": "וְתִתֵּן יַת תַּרְתֵּין קְלִיעַן דִּדְהַב עַל תַּרְתֵּין עִיזְקָתָא בְּסִיטְרֵי חוּשְׁנָא", "pj_en": "And thou shalt put the two golden chains upon the two rings in the sides of the breastplate,", "tj": "", "tj_en": "", "rashi": "<b>ונתתה את שתי עבתת הזהב.<\/b> הֵן הֵן שַׁרְשׁוֹת גַּבְלוּת הַכְּתוּבוֹת לְמַעְלָה, וְלֹא פֵּרֵשׁ מְקוֹם קִבּוּעָן בַּחֹשֶׁן, עַכְשָׁו מְפָרֵשׁ לְךָ שֶׁיְּהֵא תוֹחֵב אוֹתָן בַּטַּבָּעוֹת; וְתֵדַע לָךְ שֶׁהֵן הֵן הָרִאשׁוֹנוֹת, שֶׁהֲרֵי בְּפָרָשַׁת אֵלֶּה פְקוּדֵי לֹא הֻכְפְּלוּ:", "rashi_en": "ונתת את שתי עבתת הזהב AND THOU SHALT PUT THE TWO עבתת OF GOLD — These are the selfsame שרשרת גבלות “chains on the ends” which are written about above (v. 14). There, however, it did not specify the place where they were to be fixed on the breast-plate, stating only that the ends were to be put on the settings; now it tells you that one should insert them in the rings which were on the breast-plate. And you can be certain that these are identical with the former ones, because in the section אלה פקודי they are not mentioned twice (in two separate paragraphs)."}, {"ch": 28, "v": 25, "aliyah": 2, "heb": "וְאֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָעֲבֹתֹ֔ת תִּתֵּ֖ן עַל־שְׁתֵּ֣י הַֽמִּשְׁבְּצ֑וֹת וְנָתַתָּ֛ה עַל־כִּתְפ֥וֹת הָאֵפֹ֖ד אֶל־מ֥וּל פָּנָֽיו׃", "onk": "וְיָת תַּרְתֵּין גְּדִילָן <b>דְּעַל תַּרְתֵּין סִטְרוֹהִי<\/b> תִּתֵּן עַל תַּרְתֵּין מְרַמְּצָתָא וְתִתֵּן עַל כִּתְפֵּי אֵפוֹדָא לָקֳבֵל אַפּוֹהִי:", "onk_en": "The two ends of the two braided chains [<b>which are on its two sides<\/b>], you shall place [attach] to the two settings, and place them on the shoulder straps of the eiphod toward its face.", "pj": "וְיַת תַּרְתֵּין קְלִיעַן דְּעַל תְּרֵין סִיטְרוֹי תִּתֵּן עַל תַּרְתֵּין מְרַמְצָתָא וְתִתֵּן עַל כִּתְפֵי אֵפוֹדָא כָּל קְבֵיל אַנְפּוֹי", "pj_en": "and the two chains which are upon the two sides thou shalt put upon the two sockets, and set on the shoulders of the ephod against its front.", "tj": "", "tj_en": "", "rashi": "<b>ואת שתי קצות<\/b> שֶׁל <b>שתי עבתת<\/b>, שְׁנֵי רָאשֵׁיהֶם שֶׁל כָּל אַחַת.<br><br><b>תתן על שתי המשבצות.<\/b> הֵן הֵן הַכְּתוּבוֹת לְמַעְלָה, בֵּין פָּרָשַׁת הַחֹשֶׁן וּפָרָשַׁת הָאֵפוֹד, וְלֹא פֵּרֵשׁ אֶת צָרְכָּן וְאֶת מְקוֹמָן, עַכְשָׁו מְפָרֵשׁ שֶׁיִּתְקַע בָּהֶן רָאשֵׁי הָעֲבוֹתוֹת הַתְּחוּבוֹת בְּטַבְּעוֹת הַחֹשֶׁן לַיָּמִין וְלַשְּׂמֹאל אֵצֶל הַצַּוָּאר; שְׁנֵי רָאשֵׁי שַׁרְשֶׁרֶת הַיְמָנִית תּוֹקֵעַ בְּמִּשְׁבְּצוֹת שֶׁל יָמִין, וְכֵן בְּשֶׁל שְׂמֹאל שְׁנֵי רָאשֵׁי הַשַּׁרְשֶׁרֶת הַשְּׂמָאלִית:<br><br><b>ונתתה.<\/b> הַמִּשְׁבְּצוֹת<br><br><b>על כתפות האפוד<\/b>, אַחַת בְּזוֹ וְאַחַת בְּזוֹ, נִמְצְאוּ כִּתְפוֹת הָאֵפוֹד מַחֲזִיקִין אֶת הַחֹשֶׁן שֶׁלֹּא יִפֹּל, וּבָהֵן הוּא תָלוּי, וַעֲדַיִן שְׂפַת הַחֹשֶׁן הַתַּחְתּוֹנָה הוֹלֶכֶת וּבָאָה וְנוֹקֶשֶׁת עַל כְּרֵסוֹ וְאֵינָהּ דְּבוּקָה לוֹ יָפֶה, לְכָךְ הֻצְרַךְ עוֹד שְׁתֵּי טַבָּעוֹת לְתַחְתִּיתוֹ, כְּמוֹ שֶׁמְּפָרֵשׁ וְהוֹלֵךְ:<br><br><b>אל מול פניו.<\/b> שֶׁל אֵפוֹד, שֶׁלֹּא יִתֵּן הַמִּשְׁבְּצוֹת בְּעֵבֶר הַכְּתֵפוֹת שֶׁכְּלַפֵי הַמְּעִיל, אֶלָּא בָּעֵבֶר הָעֶלְיוֹן שֶׁכְּלַפֵּי הַחוּץ, וְהוּא קָרוּי מוּל פָּנָיו שֶׁל אֵפוֹד, כִּי אוֹתוֹ עֵבֶר שֶׁאֵינוֹ נִרְאֶה אֵינוֹ קָרוּי פָּנִים:", "rashi_en": "ואת שתי קצות means, AND THE TWO EXTREMITIES OF שתי עבתת THE TWO PLAITED CHAINS — (Rashi points out that קצות is in the construct state) — i. e. the two ends of each cord<br><br>תתן על שתי המשבצות THOU SHALT FASTEN IN THE TWO SETTINGS — These are the selfsame settings which are mentioned above in the paragraph that is placed between the section on the breast-plate and the section on the ephod. There it did not explain their purpose and their position; now, however, it explains that he should fix into them the ends of the plaited chains which had been inserted in the rings of the breast-plate on the right and on the left near the neck. The two ends of the right chain he fixed in the setting on the right, and similarly in that on the left he fixed the two ends of the left chain.<br><br>ונתת AND THOU SHALT PUT the settings.<br><br>על כתפות האפד ON THE SHOULDER-PIECES OF THE EPHOD, one setting on this shoulder-piece and one on that. Consequently the shoulder-pieces of the ephod hold the breast-plate up so that it may not fall, and from them did it hang. But the lower edge of the breast-plate would still come and go (swing to and fro) and strike against his stomach and would not lie closely upon it; therefore two more rings were needed for its lower edge, as it goes on to explain.<br><br>אל מול פניו IN THE FOREPART THEREOF — i. e. in the forepart of the ephod. meaning that he should not put the settings on that surface of the shoulder-pieces which faced the מעיל, but on the upper surface which faced the outside. It is that latter surface which is called the forepart of the ephod, because the surface which is not seen, being turned towards the מעיל, cannot be called the פנים, the front."}, {"ch": 28, "v": 26, "aliyah": 2, "heb": "וְעָשִׂ֗יתָ שְׁתֵּי֙ טַבְּע֣וֹת זָהָ֔ב וְשַׂמְתָּ֣ אֹתָ֔ם עַל־שְׁנֵ֖י קְצ֣וֹת הַחֹ֑שֶׁן עַל־שְׂפָת֕וֹ אֲשֶׁ֛ר אֶל־עֵ֥בֶר הָאֵפֹ֖ד<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז הָאֵפ֖וֹד)<\/i> בָּֽיְתָה׃", "onk": "וְתַעְבֵּד תַּרְתֵּין עִזְקָן דִּדְהַב וּתְשַׁוִּי יָתְהוֹן עַל תְּרֵין <b>סִטְרֵי<\/b> חוּשְׁנָא עַל סִפְתֵיהּ דִּי לְעִבְרָא דְאֵפוֹדָא מִלְּגָיו:", "onk_en": "Make two gold rings and set them on the two [lower] corners [<b>sides<\/b>] of the breastplate, on its edge that is on the inner side of the eiphod.", "pj": "וְתַעֲבֵיד תַּרְתֵּין עִזְקַן דִּדְהַב וְתִתֵּן יַתְהוֹן עַל תְּרֵין סִיטְרֵי חוּשְׁנָא עַל שִיפְמֵיהּ דִּלְעַבְרָא לְאֵפוֹדָא לְגֵיו", "pj_en": "And thou shalt make two golden rings, and fix them upon the two sides of the breastplate, in the border of it which is on the edge of the ephod inwardly.", "tj": "", "tj_en": "", "rashi": "<b>על שני קצות החשן.<\/b> הֵן שְׁתֵּי פֵאוֹתָיו הַתַּחְתּוֹנוֹת לַיָּמִין וְלַשְּׂמֹאל:<br><br><b>על שפתו אשר אל עבר האפוד ביתה.<\/b> הֲרֵי לְךָ שְׁנֵי סִימָנִין, הָאֶחָד שֶׁיִּתְּנֵם בִּשְׁנֵי קְצָווֹת שֶׁל תַּחְתִּיתוֹ שֶׁהוּא כְנֶגֶד הָאֵפוֹד, שֶׁעֶלְיוֹנוֹ אֵינוֹ כְנֶגֶד הָאֵפוֹד, שֶׁהֲרֵי סָמוּךְ לַצַּוָּאר הוּא וְהָאֵפוֹד נָתוּן עַל מָתְנָיו, וְעוֹד נָתַן סִימָן, שֶׁלֹּא יִקְבָּעֵם בְּעֵבֶר הַחֹשֶׁן שֶׁכְּלַפֵּי הַחוּץ, אֵלֶּא בָּעֵבֶר שֶׁכְּלַפֵּי פְּנִים, שֶׁנֶּאֱמַר בָּיְתָה, וְאוֹתוֹ הָעֵבֶר הוּא לְצַד הָאֵפוֹד, שֶׁחֵשֶׁב הָאֵפוֹד חוֹגְרוֹ הַכֹּהֵן וְנִקְפָּל הַסִּינָר לִפְנֵי הַכֹּהֵן עַל מָתְנָיו, וּקְצָת כְּרֵסוֹ מִכָּאן וּמִכָּאן עַד כְּנֶגֶד קְצוֹת הַחֹשֶׁן וּקְצוֹתָיו שׁוֹכְבִין עָלָיו:", "rashi_en": "על שני קצות החשן IN THE TWO EXTREMITIES OF THE BREAST-PLATE — These are its two lower corners on the right and on the left.<br><br>על שפתו אשר על עבר האפוד ביתה ON THE BORDER THEREOF WHICH IS ON THE OTHER SIDE OF THE EPHOD INWARD — Here you have two indications of the position of the rings: one, that he should place them on the two ends of the lower edge, for it was this which was over against the ephod, because its upper edge was not over against the ephod since it was close to the neck and the ephod was placed a little above his loins (consequently the upper edge of the breastplate which was near the priest’s neck was nowhere near the ephod which was girded round him just above the loins. See Rashi on v. 7). It gives another indication by the use of the word ביתה : that, he should not fix them on that side of the breast-plate which faced outside, but on that side which faced inward, because it is said ביתה, inward. It was that side which was turned toward the ephod, for the ends of the lower edge of that side of the breast-plate really lay upon the ephod since the priest tied the belt of the ephod around him and the apron was folded over in front of the priest upon his loins and upon a part of his stomach on both sides as far as against the ends of the breast-plate (i. e. the corners of the lower edge), the ends of which lay upon it."}, {"ch": 28, "v": 27, "aliyah": 2, "heb": "וְעָשִׂ֘יתָ֮ שְׁתֵּ֣י טַבְּע֣וֹת זָהָב֒ וְנָתַתָּ֣ה אֹתָ֡ם עַל־שְׁתֵּי֩ כִתְפ֨וֹת הָאֵפ֤וֹד מִלְּמַ֙טָּה֙ מִמּ֣וּל פָּנָ֔יו לְעֻמַּ֖ת מַחְבַּרְתּ֑וֹ מִמַּ֕עַל לְחֵ֖שֶׁב הָאֵפֽוֹד׃", "onk": "וְתַעְבֵּד תַּרְתֵּין עִזְקָן דִּדְהַב וְתִתֵּן יָתְהוֹן עַל תַּרְתֵּין כִּתְפֵּי אֵפוֹדָא מִלְּרַע מִלָּקֳבֵל אַפּוֹהִי לָקֳבֵל בֵּית לוֹפֵי מֵעִלָּוֵי לְהֶמְיַן אֵפוֹדָא:", "onk_en": "Make two gold rings and place them on the two shoulder straps of the eiphod, on the bottom, toward its face, a gainst where they are joined, above the eiphod’s belt.", "pj": "וְתַעֲבֵיד תַּרְתֵּין עִזְקַן דִּדְהַב וְתִתֵּן יַתְהוֹן עַל תְּרֵין כִּתְפֵי אֵפוֹדָא מִלְרַע מִקְבֵיל אַפּוֹי כָּל קְבֵיל בֵּית לוֹפֵי מֵעִילַוֵי לְהֶמְיַין אֵפוֹדָא", "pj_en": "And thou shalt make (likewise) two golden chains, and fix them upon the two shoulders of the ephod beneath, towards its front, towards the place of its conjoinment above the girdle of the ephod;", "tj": "", "tj_en": "", "rashi": "<b>על שתי כתפות מלמטה.<\/b> שֶׁהַמִּשְׁבְּצוֹת נְתוּנוֹת בְּרָאשֵׁי כִתְפוֹת הָאֵפוֹד הָעֶלְיוֹנִים הַבָּאִים עַל כְּתֵפָיו, כְּנֶגֶד גְּרוֹנוֹ, וְנִקְפָּלוֹת וְיוֹרְדוֹת לְפָנָיו, וְהַטַּבָּעוֹת צִוָּה לִתֵּן בְּרֹאשָׁן הַשֵּׁנִי, שֶׁהוּא מְחֻבָּר לָאֵפוֹד, וְהוּא שֶׁנֶּ' לְעֻמַּת מַחְבַּרְתּוֹ, סָמוּךְ לִמְקוֹם חִבּוּרָן בָּאֵפוֹד, לְמַעְלָה מִן הַחֲגוֹרָה מְעַט, שֶׁהַמַּחְבֶּרֶת לְעֻמַּת הַחֲגוֹרָה, וְאֵלּוּ נְתוּנִים מְעַט בְּגֹבַהּ זְקִיפַת הַכְּתֵפוֹת, הוּא שֶׁנֶּאֱמַר מִמַּעַל לְחֵשֶׁב הָאֵפוֹד, וְהֵן כְּנֶגֶד סוֹף הַחֹשֶׁן, וְנוֹתֵן פְּתִיל תְּכֵלֶת בְּאוֹתָן הַטַּבָּעוֹת וּבְטַבְּעוֹת הַחֹשֶׁן וְרוֹכְסָן בְּאוֹתוֹ פְּתִיל לְיָמִין וְלִשְׂמֹאל, שֶׁלֹּא יְהֵא תַחְתִּית הַחֹשֶׁן הוֹלֵךְ לְפָנִים וְחוֹזֵר לְאָחוֹר, וְנוֹקֵשׁ עַל כְּרֵסוֹ, וְנִמְצָא מְיֻשָּׁב עַל הַמְּעִיל יָפֶה:<br><br><b>ממול פניו.<\/b> בָּעֵבֶר הַחִיצוֹן:", "rashi_en": "על שתי כתפות האפוד מלמטה. ON THE TWO SHOULDER-PIECES OF THE EPHOD UNDERNEATH — underneath because the settings were placed on the upper ends of the shoulder-pieces of the ephod which came upon his shoulders beside his throat and which were folded over his shoulders and fell down in front of him; and the rings mentioned here He commanded to be put on the other end of each shoulder-piece which was joined on the ephod. This is the meaning of what is said לעמת מחברתו, “over against the joining thereof”, i. e. close by the spot where they were joined on to the ephod, namely, a little above the girdle, for the place of joining was over against the girdle. Thus these rings were placed a little above the place where the shoulder-straps began to rise from the girdle, and this is the meaning of what is said, “above the girdle of the ephod”. These were thus opposite (i. e. on a level with) the end (the lower edge) of the breastplate (but, of course, on the priest’s back, whilst the breast-plate lay in front of him). Now they placed a thread of blue purple in those rings and in the rings of the breast-plate and fastened them (the pair of rings) together by means of that thread on the right and on the left so that the lower edge of the breast-plate should not move forward and then return backward (should not move to and fro) and strike against his stomach. It followed, therefore, that it (the breast-plate) lay well upon the “Meil”.<br><br>ממול פניו TOWARDS THE FOREPART THEREOF — i. e. on the outer side."}, {"ch": 28, "v": 28, "aliyah": 2, "heb": "וְיִרְכְּס֣וּ אֶת־הַ֠חֹ֠שֶׁן <span class=\"mam-kq-trivial\">מִֽטַּבְּעֹתָ֞ו<\/span> אֶל־טַבְּעֹ֤ת הָאֵפוֹד֙ בִּפְתִ֣יל תְּכֵ֔לֶת לִֽהְי֖וֹת עַל־חֵ֣שֶׁב הָאֵפ֑וֹד וְלֹֽא־יִזַּ֣ח הַחֹ֔שֶׁן מֵעַ֖ל הָאֵפֽוֹד׃", "onk": "וְיֶחְדּוּן יָת חוּשְׁנָא מֵעִזְקְתֵיהּ לְעִזְקְתָא דְאֵפוֹדָא בְּחוּטָא דִתְכֶלְתָּא לְמֵהֱוֵי עַל הֶמְיַן אֵפוֹדָא וְלָא יִתְפָּרֵק חוּשְׁנָא מֵעִלָּוֵי אֵפוֹדָא:", "onk_en": "They shall bind the [lower] rings of the breastplate to the [lower] rings of the eiphod with a cord of greenish-blue wool, so that it [the breastplate] remains against the eiphod’s belt, so that the breastplate does not move from the eiphod.", "pj": "וִיטַכְּסוּן יַת חוּשְׁנָא מֵעִזְקָתֵיהּ לְעִזְקַת אֵיפוֹדָא בִּשְׁזִיר חוּטָא דְתִיכְלָא לְמֶהֱוֵי אֲדִיק עַל הֶמְיַין אֵפוֹדָא וְלָא יִתְפְּרֵק חוּשְׁנָא מֵעִילַוֵי אֵפוֹדָא", "pj_en": "and they shall unite the breastplate with its rings to the rings of the ephod, with twined ribbon, of hyacinth, to be joined upon the girdle of the ephod, that the breastplate may not be removed from the ephod.", "tj": "", "tj_en": "", "rashi": "<b>וירכסו.<\/b> לְשׁוֹן חִבּוּר; וְכֵן מֵרֻכְסֵי אִישׁ (תהילים ל\"א) – חִבּוּרֵי חֶבְלֵי רְשָׁעִים, וְכֵן וְהָרְכָסִים לְבִקְעָה (ישעיהו מ') – הָרִים הַסְּמוּכִים זֶה לָזֶה, שֶׁאִי אֶפְשָׁר לֵירֵד לַגַּיְא שֶׁבֵּינֵיהֶם אֶלָּא בְקֹשִׁי גָּדוֹל, שֶׁמִּתּוֹךְ סְמִיכָתָן הַגַּיְא זְקוּפָה וַעֲמֻקָּה – יְהֵא לְבִקְעַת מִישׁוֹר וְנוֹחָה לֵילֵךְ:<br><br><b>להיות על חשב האפוד.<\/b> לִהְיוֹת הַחֹשֶׁן דָּבוּק אֶל חֵשֶׁב הָאֵפוֹד:<br><br><b>ולא יזח.<\/b> לְשׁוֹן נִתּוּק; וּלְשׁוֹן עֲרָבִי הוּא כְּדִבְרֵי דּוּנָשׁ בֶּן לָבְרָט:", "rashi_en": "וירכסו — This is an expression for joining. Similar in meaning is, (Psalms 31:21) “[Thou hidest them] from the רֻכְסַי of men”, i. e. from the union of companies of wicked people. Similar is, (Isaiah 40:4) “And the רכסים shall become a plain” — i. e. the mountains which are close (almost joined) to one another so that it is not possible to descend into the valley between them except with great difficulty, since, in consequence of their closeness to each other, the valley is precipitous and deep — these רכסים, connected mountains, shall become a level plain and easy to travel upon.<br><br>להיות על חשב האפוד THAT IT MAY BE UPON THE GIRDLE OF THE EPHOD — that the breast-plate (not the ring) may be attached to the girdle of the ephod.<br><br>ולא יזח SO THAT [THE BREAST-PLATE] BE NOT LOOSENED — יזח is an expression for “breaking away”. It is an Arabic expression according to the opinion of Dunash ben Labrat."}, {"ch": 28, "v": 29, "aliyah": 2, "heb": "וְנָשָׂ֣א אַ֠הֲרֹ֠ן אֶת־שְׁמ֨וֹת בְּנֵֽי־יִשְׂרָאֵ֜ל בְּחֹ֧שֶׁן הַמִּשְׁפָּ֛ט עַל־לִבּ֖וֹ בְּבֹא֣וֹ אֶל־הַקֹּ֑דֶשׁ לְזִכָּרֹ֥ן לִפְנֵֽי־יְהֹוָ֖ה תָּמִֽיד׃", "onk": "וְיִטּוֹל אַהֲרֹן יָת שְׁמָהַת בְּנֵי יִשְׂרָאֵל בְּחשֶׁן דִּינָא עַל לִבֵּיהּ בְּמֵעֲלֵיהּ לְקוּדְשָׁא לְדוּכְרָנָא קֳדָם יְיָ תְּדִירָא:", "onk_en": "Aharon will thus carry the names of the B’nei Yisrael on the breastplate of judgment, over his heart, when he comes into the Holy [sanctuary], as a constant remembrance before Adonoy.", "pj": "וְיִטוֹל אַהֲרן יַת שְׁמָהַת בְּנֵי יִשְרָאֵל בְּחֹשֶׁן דִּינָא עַל לִבֵּיהּ בִּזְמַן מַעֲלֵיהּ לְקוּדְשָׁא לְדוּכְרָן טַב קֳדָם יְיָ תְּדִירָא", "pj_en": "And Aharon shall bear the names of the sons of Israel upon his heart what time he entereth into the sanctuary for a good memorial before the Lord continually.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 30, "aliyah": 2, "heb": "וְנָתַתָּ֞ אֶל־חֹ֣שֶׁן הַמִּשְׁפָּ֗ט אֶת־הָאוּרִים֙ וְאֶת־הַתֻּמִּ֔ים וְהָיוּ֙ עַל־לֵ֣ב אַהֲרֹ֔ן בְּבֹא֖וֹ לִפְנֵ֣י יְהֹוָ֑ה וְנָשָׂ֣א אַ֠הֲרֹ֠ן אֶת־מִשְׁפַּ֨ט בְּנֵי־יִשְׂרָאֵ֧ל עַל־לִבּ֛וֹ לִפְנֵ֥י יְהֹוָ֖ה תָּמִֽיד׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִתֵּן בְּחשֶׁן דִּינָא יָת אוּרַיָּא וְיָת תֻּמַּיָּא וִיהוֹן עַל לִבָּא דְאַהֲרֹן בְּמֵעֲלֵיהּ קֳדָם יְיָ וְיִטּוֹל אַהֲרֹן יָת דִּינָא דִבְנֵי יִשְׂרָאֵל עַל לִבֵּיהּ קֳדָם יְיָ תְּדִירָא:", "onk_en": "Place in the breastplate the Urim
