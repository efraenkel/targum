<style>

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }

.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }

footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }

<script>
const DATA = [{"ch": 28, "v": 10, "aliyah": 1, "heb": "וַיֵּצֵ֥א יַעֲקֹ֖ב מִבְּאֵ֣ר שָׁ֑בַע וַיֵּ֖לֶךְ חָרָֽנָה׃", "onk": "וּנְפַק יַעֲקֹב מִבְּאֵרָא דְשָׁבַע וַאֲזַל לְחָרָן:", "onk_en": "Yaakov left Beer Sheva and went toward Charan.", "pj": "ויצא חַמְשָׁא נִיסִין אִתְעֲבִידוּ לְיַעֲקב בִּזְמַן דִנְפַק מִן בֵּירָא דְשָׁבַע. נִיסָא קַמָא אִתְקַצְרוּ שְׁעוֹי דְיוֹמָא וּטְמַע שִׁימְשָׁא בְּלָא אִשׁוּנֵיהּ מִן קֳדָם דַהֲוָה דְבִירָא מִתְחַמָד לְמַלָלָא עִמֵיהּ. נִיסָא תִנְיָינָא אַרְבַּעְתֵּי אַבְנַיָא דְשַׁוִי אִיסָדוֹי אַשְׁכַּח יַתְהוֹן בְּצַפְרָא לְאַבְנָא חָדָא. נִיסָא תְּלִיתָאָה אַבְנָא דַהֲווֹ כָּל עֶדְרַיָא מִתְכַּנְשִׁין וּמְגַלְגְלִין לָהּ מֵעִילוֹי פֻּם בֵּירָא גִלְגַל יָתָהּ בַּחֲדָא מִן דְרָעוֹי. נִיסָא רְבִיעָאָה דְטָפַת בֵּירָא וּסְלִיקוּ מַיָא לְאַנְפּוֹי וַהֲוָת טַיְיפָא כָּל יוֹמִין דַהֲוָה בְּחָרָן. נִיסָא חֲמִישָׁאָה קָפְצַת אַרְעָא קוּמוֹי וּבְהַהוּא יוֹמָא דְנָפַק אָזַל לְחָרָן", "pj_en": "Five miracles were wrought for our father Jakob at the time that he went forth from Beersheba. The first sign: the hours of the day were shortened, and the sun went down before his time, forasmuch as the Word had desired to speak with him. The second sign: the four stones which Jakob had set for his pillow he found in the morning, had become one stone. Sign the third: the Stone which, when all the flocks were assembled, they rolled from the mouth of the well, he rolled away with one of his arms. The fourth sign: the well overflowed, and the water rose to the edge of it, and continued to overflow all the days that he was in Haran. The fifth sign: the country was shortened before him, so that in one day he went forth and came to Haran.", "tj": "חַמְשָׁא נִיסִין אִתְעֲבִידוּ לַאֲבוּנָן יַעֲקב בְּזִמְנָא דִנְפַק מִבְּאֵר שָׁבַע לְמֵיזַל לְחָרָן. נִיסָא קַדְמָאָה אִתְקַצְרוּ לֵיהּ שָׁעֵי דְיוֹמָא וּטְמָעַת לֵיהּ שִׁמְשָׁא דִי לָא בְאִישׁוּנָהּ מִן בִּגְלַל דַהֲוָה דְבוּרֵיהּ מִתְחַמְדָא לְמַלָלָא עִמֵיהּ. נִיסָא תִּנְיָנָא כֵּיוָן דְנָטַל אֲבוּנָן יַעֲקב רִגְלוֹי מִבְּאֵר שָׁבַע קָפְצַת אַרְעָא קֳדָמוֹי וְאִשְׁתְּכַּח יָתֵיב בְּחָרָן. נִיסָא תְּלִיתָאָה אַבְנַיָא דִנְסַב יַעֲקב אָבוּנָן בְּרַמְשָׁא וְשַׁוִי יַתְהוֹן תְּחוֹת יְסוֹדֵי רֵישֵׁיהּ וְכֵיוָן דְקָם בְּצַפְרָא אַשְׁכַּח דְכוּלְהוֹן לְאֶבֶן חֲדָא וְהוּא אַבְנָא דְאָקִים קְיָימָא קָמָא וְאָרִיק מְשַׁח עַל רֵישֵׁיהּ. נִיסָא רְבִיעָאָה דַהֲווֹן כָּל רַעְיָא מִתְכַּנְשִׁין עֲלָהּ דְאַבְנָא לִגְלָלָא יָתָהּ מֵעִילוֹי פּוּמָא דְבֵירָא וְלָא הֲווֹ יָכְלִין וְכֵיוָן דְאָתָא אֲבוּנָן יַעֲקב וַאֲרֵים יָתָהּ בַּחֲדָא יְדֵיהּ וְאַשְׁקֵי יַת עָנָא דְלָבָן אָחוֹי דְאִימוֹי. נִיסָא חֲמִישָׁיָא כֵּיוָן דַאֲרֵים אֲבוּנָן יַעֲקב יַת אַבְנָא מֵעִילַוֵי פּוּמָא דְבֵירָא טְפַת בֵּירָא וַהֲוַת טַיְיפָא עֶשְרִין שְׁנִין כָּל יוֹמִין דַהֲוָה אָבוּנָן יַעֲקב יָתֵיב בְּחָרָן. אִילֵין חַמְשָׁא נִיסַיָא אִתְעֲבִידוּ לַאֲבוּנָן יַעֲקב בְּזִמְנָא דִנְפַק מִבְּאֵר שָׁבַע לְמֵיזַל לְחָרָן:", "tj_en": "Five signs were wrought for our father Jakob at the time he went forth from Beersheba to go unto Haran. The first sign: the hours of the day were shortened for him, and the sun was hidden from him before its time, because His Word had desired to speak with him. The second sign: after our father Jakob had lifted up his feet from Beersheba, the country was shortened before him, and be found himself sitting in Haran. The third sign: the stones which Jakob our father had taken in the evening, and set as the resting-place of his head, when he had risen in the morning be found had all become one stone; and that is the stone which he set up in the first covenant, pouring oil upon the top of it. The fourth sign : when all the shepherds had gathered together at the stone to roll it from the mouth of the well, and could not, then came our father Jakob and lifted it with one hand, and watered the flock, of Laban his mother's brother. The fifth sign: after our father Jakob had lifted the stone from the mouth of the well, the well overflowed, and was overflowing twenty years; all the days that our father Jakob dwelt in Haran. These five signs were wrought for our father Jakob in the time when he departed from Beersheba to go to Charan.", "rashi": "<b>ויצא יעקב.<\/b> עַל יְדֵי שֶׁבִּשְׁבִיל שֶׁרָעוֹת בְּנוֹת כְּנַעַן בְּעֵינֵי יִצְחָק אָבִיו הָלַךְ עֵשָׂו אֶל יִשְׁמָעֵאל, הִפְסִיק הָעִנְיָן בְּפָרָשָׁתוֹ שֶׁל יַעֲקֹב, וּכְתִיב וַיַּרְא עֵשָׂו כִּי בֵרַךְ וְגוֹ', וּמִשֶּׁגָּמַר חָזַר לָעִנְיָן הָרִאשׁוֹן:<br><br><b>ויצא.<\/b> לֹא הָיָה צָרִיךְ לִכְתֹּב אֶלָּא וַיֵּלֶךְ יַעֲקֹב חָרָנָה, וְלָמָּה הִזְכִּיר יְצִיאָתוֹ? אֶלָּא מַגִּיד שֶׁיְּצִיאַת צַדִּיק מִן הַמָּקוֹם עוֹשָׂה רֹשֶׁם, שֶׁבִּזְמַן שֶׁהַצַּדִּיק בָּעִיר, הוּא הוֹדָהּ הוּא זִיוָהּ הוּא הֲדָרָהּ; יָצָא מִשָּׁם, פָּנָה הוֹדָהּ פָּנָה זִיוָהּ פָּנָה הֲדָרָהּ. וְכֵן וַתֵּצֵא מִן הַמָּקוֹם הָאָמוּר בְּנָעֳמִי וְרוּת (רות א'):<br><br><b>וילך חרנה.<\/b> יָצָא לָלֶכֶת לְחָרָן:", "rashi_en": "ויצא יעקב AND JACOB WENT OUT— Owing to the fact that it was because the daughters of Canaan were evil in the eyes of Isaac, his father, that Esau went to Ishmael, Scripture broke off the narrative contained, in the section dealing with Jacob, and wrote (verse 6 till verse 9), “Now Esau saw that Isaac had blessed [Jacob] etc., that the daughters of Canaan were evil in the eyes of Isaac and so he went to Ishmael” and when it finished this (the account of Esau’s further marriage) it resumes the previous subject.<br><br>ויצא [AND JACOB] WENT OUT—It need have written simply “And Jacob went to Haran’’; why then does it mention his departure from Beersheba? But it intends to tell us that the departure of a righteous person from his city makes an impression. As long as a righteous man is in his city he is its glory and splendour and beauty; when he leaves it, there depart also its glory, its splendour and its beauty. This, too, is the meaning of (Ruth 1:7) “And she went forth out of the place”, stated in reference to Naomi and Ruth (Genesis Rabbah 68:6).<br><br>וילך חרנה means he went out TO GO TO HARAN."}, {"ch": 28, "v": 11, "aliyah": 1, "heb": "וַיִּפְגַּ֨ע בַּמָּק֜וֹם וַיָּ֤לֶן שָׁם֙ כִּי־בָ֣א הַשֶּׁ֔מֶשׁ וַיִּקַּח֙ מֵאַבְנֵ֣י הַמָּק֔וֹם וַיָּ֖שֶׂם מְרַֽאֲשֹׁתָ֑יו וַיִּשְׁכַּ֖ב בַּמָּק֥וֹם הַהֽוּא׃", "onk": "וַעֲרַע בְּאַתְרָא וּבָת תַּמָּן אֲרֵי עַל שִׁמְשָׁא וּנְסִיב מֵאַבְנֵי אַתְרָא וְשַׁוִּי אִסָּדוֹהִי וּשְׁכִיב בְּאַתְרָא הַהוּא:", "onk_en": "He reached the place and spent the night there because the sun had set. He took some of the stones of that place, and arranged them around his head, and lay down [to sleep] in that place.", "pj": "וְצַלִי בַּאֲתַר בֵּי מוּקְדָשָׁא וּבַת תַּמָן אֲרוּם טְמַע שִׁמְשָׁא וּנְסֵיב אַרְבְּעָה מֵאַבְנֵי אַתְרָא קַדִישׁ וְשַׁוִי אִיסָדוֹי וּשְׁכִיב בְּאַתְרָא הַהוּא", "pj_en": "And he prayed in the place of the house of the sanctuary, and lodged there, because the sun had gone down. And he took four stones of the holy place, and set his pillow, and slept in that place.", "tj": "", "tj_en": "", "rashi": "<b>ויפגע במקום.<\/b> לֹא הִזְכִּיר הַכָּתוּב בְּאֵיזֶה מָקוֹם אֶלָּא בַּמָּקוֹם – הַנִּזְכָּר בְּמָקוֹם אַחֵר, הוּא הַר הַמּוֹרִיָּה, שֶׁנֶּאֱמַר בּוֹ וַיַּרְא אֶת הַמָּקוֹם מֵרָחֹק:<br><br><b>ויפגע.<\/b> כְּמוֹ וּפָגַע בִּירִיחוֹ וּפָגַע בְּדַבָּשֶׁת (יהושע ט\"ז וי\"ט) וְרַבּוֹתֵינוּ פֵּרְשׁוּ לְשׁוֹן תְּפִלָּה (ברכות כ\"ו), כְּמוֹ וְאַל תִּפְגַּע בִּי (ירמיהו ז'), וְלָמַדְנוּ שֶׁתִּקֵּן תְּפִלַּת עַרְבִית. וְשִׁנָּה הַכָּתוּב וְלֹא כָּתַב וַיִּתְפַּלֵּל, לְלַמֶּדְךָ שֶׁקָּפְצָה לוֹ הָאָרֶץ, כְּמוֹ שֶׁמְּפֹרָשׁ בְּפֶרֶק גִּיד הַנָּשֶׁה (חולין צ\"א):<br><br><b>כי בא השמש.<\/b> הָיָה לוֹ לִכְתֹּב וַיָּבֹא הַשֶּׁמֶשׁ וַיָּלֶן שָׁם, כִּי בָא הַשֶּׁמֶשׁ מַשְׁמַע שֶׁשָּׁקְעָה לוֹ חַמָּה פִּתְאוֹם, שֶׁלֹּא בְּעוֹנָתָהּ, כְּדֵי שֶׁיָּלִין שָׁם:<br><br><b>וישם מראשותיו.<\/b> עֲשָׂאָן כְּמִין מַרְזֵב סָבִיב לְרֹאשׁוֹ, שֶׁיָּרֵא מִפְּנֵי חַיּוֹת רָעוֹת; הִתְחִילוּ מְרִיבוֹת זוֹ אֶת זוֹ, זֹאת אוֹמֶרֶת עָלַי יָנִיחַ צַדִּיק אֶת רֹאשׁוֹ וְזֹאת אוֹמֶרֶת עָלַי יָנִיחַ; מִיָּד עֲשָׂאָן הַקָּבָּ\"ה אֶבֶן אַחַת, וְזֶהוּ שֶׁנֶּאֱמַר וַיִּקַּח אֶת הָאֶבֶן אֲשֶׁר שָׂם מְרַאֲשֹׁתָיו:<br><br><b>וישכב במקום ההוא.<\/b> לְשׁוֹן מִעוּט; בְּאוֹתוֹ מָקוֹם שָׁכַב אֲבָל י\"ד שָׁנִים שֶׁשִּׁמֵּשׁ בְּבֵית עֵבֶר לֹא שָׁכַב בַּלַּיְלָה, שֶׁהָיָה עוֹסֵק בַּתּוֹרָה:", "rashi_en": "ויפגע במקום AND HE LIGHTED UPON THE PLACE — Scripture does not mention which place, but by writing בַּמָקוֹם the place it refers to the place mentioned already in another passage, viz., Mount Moriah of which it is stated (Genesis 22:4) “And he saw the place (המקום) afar off”.<br><br>ויפגע AND HE LIGHTED — similar are (Joshua 16:7) “and it reached (ופגע) unto Jericho”, and (Joshua 19:11) “and reached (ופגע) to Dabesheth”. Our Rabbis explained it in the sense of “praying”, just as (Jeremiah 7:16) “Neither make intercession (תפגע) to me”. Thus we may learn that Jacob originated the custom of Evening Prayer. Scripture purposely changed the usual word for “praying”, not writing יתפלל, “And he prayed” (which would have been the more appropriate word, but ויפגע which means to hit upon a place unexpectedly), to teach you also that the ground shrunk before him (the journey was miraculously shortened) as it is explained in the Chapter גיד הנשה (Chullin 91b).<br><br>כי בא השמש BECAUSE THE SUN WAS SET — It should have written, “The sun set and he tarried there all night”, but the words “he tarried there all night because the sun set”, imply that the sun set unexpectedly — not at its proper time — just in order that he should tarry there over night).<br><br>וישם מראשתיו AND PUT THEM FOR A RESTING PLACE FOR HIS HEAD — He arranged them in the form of a drain-pipe around his head for he was afraid of wild beasts (Genesis Rabbah 68:11). They (the stones) began quarrelling with one another. One said, “Upon me let this righteous man rest his head”, and another said “Upon me let him rest it”. Whereupon the Holy One, blessed be He, straightway made them into one stone! This explains what is written (Genesis 28:18), “And he took the stone that he had put under his head” (Chullin 91b).<br><br>וישכב במקום ההוא AND [HE] LAY DOWN IN THAT PLACE —The word ההוא, that, has a limitative force: in that place he lay down to sleep, but during the previous fourteen years when he sat under his teachers in the School of Eber he never slept at night for he was incessantly engaged in the study of the Torah (Genesis Rabbah 68:11). "}, {"ch": 28, "v": 12, "aliyah": 1, "heb": "וַֽיַּחֲלֹ֗ם וְהִנֵּ֤ה סֻלָּם֙ מֻצָּ֣ב אַ֔רְצָה וְרֹאשׁ֖וֹ מַגִּ֣יעַ הַשָּׁמָ֑יְמָה וְהִנֵּה֙ מַלְאֲכֵ֣י אֱלֹהִ֔ים עֹלִ֥ים וְיֹרְדִ֖ים בּֽוֹ׃", "onk": "וַחֲלַם וְהָא סֻלְמָא <b>נָעִיץ<\/b> בְּאַרְעָא וְרֵישֵׁיהּ מָטֵי עַד צֵית שְׁמַיָּא וְהָא מַלְאָכַיָּא דַיְיָ סָלְקִין וְנָחֲתִין בֵּהּ:", "onk_en": "He dreamed, and behold a ladder was set up on [<b>planted in<\/b>] the earth and the top of it reached toward heaven; and behold angels of Elohim were ascending and descending on it.", "pj": "וַחֲלָם וְהָא סוּלְמָא קְבוּעַ בְּאַרְעָא וְרֵישֵׁיהּ מָטֵי עַד צֵית שְׁמַיָא וְהָא תְּרֵין מַלְאָכַיָא דַאֲזָלוּ לִסְדוֹם וְאִטְרְדוּ מִן מְחִיצַתְהוֹן מִן בִּגְלַל דְגַלְיָין מַסְטִירִין דְמָרֵי עַלְמָא וַהֲווֹ מַטְרִידִין וְאָזְלִין עַד זְמַן דְנָפַק יַעֲקב מִבֵּית אָבוֹי וְהִינוּן לָוָון יָתֵיהּ בְּחִיסְדָא עַד בֵּית אֵל וּבְהַהוּא יוֹמָא סַלְקִין לִשְׁמֵי מְרוֹמָא עָנִין וְאָמְרִין אִיתוּן חָמוֹן יַעֲקב חֲסִידָא דְאִיקוּנִין דִי לֵיהּ קְבִיעָא בְּכוּרְסֵי יְקָרָא דַהֲוֵיתוּן מִתְחַמְדִין לְמֶחֱמֵי יָתֵיהּ בְּכֵן שְׁאַר מַלְאָכַיָא קַדִישַׁיָא דַיְיָ נַחֲתִין לְמִסְתַּכְּלָא בֵּיהּ", "pj_en": "And he dreamed, and, behold, a ladder was fixed in the ground, and the top of it reached to the height of heaven. And, behold, the two angels who went unto Sedom, and who had been expelled from the midst of them, because they had revealed the secrets of the Lord of the world; and being cast forth they had walked till the time that Jakob went out from the house of his father, and had accompanied him with kindliness unto Bethel, in that day had ascended to the high heavens, and said, Come, see Jakob the pious, whose likeness is inlaid in the throne of glory, and whom you have so greatly desired to behold. Then the rest of the angels of the holy Lord descended to look upon him.", "tj": "וַחֲלָם וְהָא סוּלְמָא קְבִיעַ בְּאַרְעָא וְרֵישֵׁיהּ מָטֵי עַד צֵית שְׁמַיָא וְהָא מַלְאָכַיָא דִילַוָון יָתֵיהּ מִבֵּיתֵיהּ דְאָבוּי סְלִיקוּ לִמְבַשְרָא לְמַלְאֲכֵי מִרוֹמָא לְמֵימַר אָתוּן חָמוּן לְיַעֲקב גַבְרָא חֲסִידָא דְאִיקוֹנִין דִידֵיהּ בְּכוּרְסֵי דִיקָרָא דַהֲוֵיתוּן מִתְחַמְדִין לְמֵיחֲמֵיהּ יָתֵיהּ וְהָא מַלְאָכִין קַדִישִׁין מִן קֳדָם יְיָ סַלְקִין וְנַחֲתִין וּמִסְתַּכְּלִין בֵּיהּ:", "tj_en": "And he dreamed, and, behold, a ladder was fixed in the earth, and the summit of it reached to the height of heaven. And, behold, the angels who had accompanied him from the house of his father, ascended to make known to the angels on high, saying, Come, see Jakob the pious, whose likeness is in the throne of glory, and whom you have been desirous to see! And, behold, the holy angels from before the Lord ascended and descended, and looked upon him.", "rashi": "<b>עולים וירדים.<\/b> עוֹלִים תְּחִלָּה וְאַחַר כָּךְ יוֹרְדִים? מַלְאָכִים שֶׁלִּוּוּהוּ בָּאָרֶץ אֵין יוֹצְאִים חוּצָה לָאָרֶץ, וְעָלוּ לָרָקִיעַ וְיָרְדוּ מַלְאֲכֵי חוּצָה לָאָרֶץ לְלַוּוֹתוֹ:", "rashi_en": "עלים וירדים ASCENDING AND DESCENDING — It states first ascending and afterwards descending! Those angels who accompanied him in the land of Israel were not permitted to leave the Land: they ascended to Heaven and angels which were to minister outside the Land descended to accompany him (Genesis Rabbah 68:12). "}, {"ch": 28, "v": 13, "aliyah": 1, "heb": "וְהִנֵּ֨ה יְהֹוָ֜ה נִצָּ֣ב עָלָיו֮ וַיֹּאמַר֒ אֲנִ֣י יְהֹוָ֗ה אֱלֹהֵי֙ אַבְרָהָ֣ם אָבִ֔יךָ וֵאלֹהֵ֖י יִצְחָ֑ק הָאָ֗רֶץ אֲשֶׁ֤ר אַתָּה֙ שֹׁכֵ֣ב עָלֶ֔יהָ לְךָ֥ אֶתְּנֶ֖נָּה וּלְזַרְעֶֽךָ׃", "onk": "וְהָא <b>יְקָרָא דַ<\/b>יְיָ מְעַתַּד עִלָּווֹהִי וַאֲמַר אֲנָא יְיָ אֱלָהֵהּ דְּאַבְרָהָם אָבוּךְ וֵאֱלָהֵהּ דְּיִצְחָק אַרְעָא דִּי אַתְּ שָׁרֵי עֲלַהּ לָךְ אֶתְּנִנַּהּ וְלִבְנָךְ:", "onk_en": "And behold [<b>the Glory of<\/b>] Adonoy stood over him, and said, I am Adonoy, God of Avraham, your father, and God of Yitzchok. The land upon which you are lying, I will give to you and to your descendants.", "pj": "וְהָא יְקָרָא דַיְיָ מְעַתֵּד עִילוֹי וַאֲמַר לֵיהּ אֲנָא יְיָ אֱלָהֵיהּ דְאַבְרָהָם אָבוּךְ וֵאלָהֵיהּ דְיִצְחָק אַרְעָא דְאַנְתְּ שְׁכִיב עֲלָהּ לָךְ אֶתְּנִינָהּ וְלִבְנָךְ", "pj_en": "And, behold, the Glory of the Lord stood above him, and He said to him, I am the Lord the God of Abraham thy father, and the God of Izhak, The land on which thou art lying I will give to thee and to thy sons.", "tj": "", "tj_en": "", "rashi": "<b>נצב עליו.<\/b> לְשָׁמְרוֹ:<br><br><b>ואלהי יצחק.<\/b> אַעַ\"פִּ שֶׁלֹּא מָצִינוּ בַּמִּקְרָא שֶׁיִּחֵד הַקָּבָּ\"ה שְׁמוֹ עַל הַצַּדִּיקִים בְּחַיֵּיהֶם לִכְתֹּב אֱלֹהֵי פְּלוֹנִי, מִשּׁוּם שֶׁנֶּאֱמַר הֵן בִּקְדֹשָׁו לֹא יַאֲמִין (איוב ט\"ו), כָּאן יִחֵד שְׁמוֹ עַל יִצְחָק, לְפִי שֶׁכָּהוּ עֵינָיו וְכָלוּא בַבַּיִת, וַהֲרֵי הוּא כְמֵת וְיֵצֶר הָרָע פָּסַק מִמֶּנּוּ, תַּנְחוּמָא:<br><br><b>שכב עליה.<\/b> קִפֵּל הַקָּבָּ\"ה כָּל אֶרֶץ יִשְׂרָאֵל תַּחְתָּיו, רָמַז לוֹ שֶׁתְּהֵא נוֹחָה לִכָּבֵשׁ לְבָנָיו כְּד' אַמּוֹת שֶׁזֶּה מְקוֹמוֹ שֶׁל אָדָם (חולין שם):", "rashi_en": "נצב עליו STOOD ABOVE HIM to guard him (Genesis Rabbah 69:3).<br><br>ואלהי יצחק AND THE GOD OF ISAAC — Although we do not find in the Scriptures that God associates his Name with that of the righteous whilst they are yet alive by writing, “The God of so-and-so”, — because it is said (Job 15:15) “Behold He putteth no trust even in His holy ones” — here, however, He associated his Name with that of Isaac because his eyes had become dim and he was confined to the house, so that he might be regarded as dead and as though the evil inclination had already passed away from him and he was unlikely to sin any more (Midrash Tanchuma, Toldot 7).<br><br>שכב עליה THE LAND WHEREON THOU LIEST — The Holy One, blessed be He, rolled together the entire Land of Israel under him, thus intimating to him that it would be as easily conquered by his descendants (Chullin 91b) as a piece of land four cubits in length, which is the space covered by a person lying down (see Rashi, Chullin 91b, and the note of the ב\"ח thereon). "}, {"ch": 28, "v": 14, "aliyah": 1, "heb": "וְהָיָ֤ה זַרְעֲךָ֙ כַּעֲפַ֣ר הָאָ֔רֶץ וּפָרַצְתָּ֛ יָ֥מָּה וָקֵ֖דְמָה וְצָפֹ֣נָה וָנֶ֑גְבָּה וְנִבְרְכ֥וּ בְךָ֛ כׇּל־מִשְׁפְּחֹ֥ת הָאֲדָמָ֖ה וּבְזַרְעֶֽךָ׃", "onk": "וִיהוֹן בְּנָךְ <b>סַגִּיאִין<\/b> כְּעַפְרָא דְאַרְעָא <b>וְתִתְקֵף<\/b> לְמַעַרְבָא וּלְמָדִינְחָא וּלְצִפּוּנָא וּלְדָרוֹמָא וְיִתְבָּרְכוּן <b>בְּדִילָךְ<\/b> כֹּל זַרְעֲיַת אַרְעָא <b>וּבְדִיל<\/b> בְּנָךְ:", "onk_en": "Your descendants shall be [<b>many<\/b>] as the dust of the earth. You shall spread [<b>be strong<\/b>] to the west, to the east, to the north and to the south. Through [<b>Because of<\/b>] you shall be blessed all the families of the earth, and through [<b>because of<\/b>] your descendants.", "pj": "וִיהוֹן בְּנָךְ סַגִיאִין הֵי כְעַפְרָא דְאַרְעָא וְתַתְקִיף לִמְעַרְבָא וּלְמַדִינְחָא לְצִיפוּנָא וּלְדָרוֹמָא וְיִתְבָּרְכוּן בְּגִין זַכְוָותָךְ כָּל יְחוּסֵי אַרְעָא וּבְגִין זַכְוַות בְּנָךְ", "pj_en": "And thy sons shall be many as the dust of the earth, and shall become strong on the west and on the east, on the north and on the south: and all the kindreds of the earth shall through thy rightneousness and the righteousness of thy sons be blessed.", "tj": "", "tj_en": "", "rashi": "<b>ופרצת.<\/b> וְחָזַקְתָּ, כְּמוֹ וְכֵן יִפְרֹץ:", "rashi_en": "ופרצת means AND THOU SHALT BECOME STRONG, like (Exodus 1:12) “the more they became strong\". "}, {"ch": 28, "v": 15, "aliyah": 1, "heb": "וְהִנֵּ֨ה אָנֹכִ֜י עִמָּ֗ךְ וּשְׁמַרְתִּ֙יךָ֙ בְּכֹ֣ל אֲשֶׁר־תֵּלֵ֔ךְ וַהֲשִׁ֣בֹתִ֔יךָ אֶל־הָאֲדָמָ֖ה הַזֹּ֑את כִּ֚י לֹ֣א אֶֽעֱזׇבְךָ֔ עַ֚ד אֲשֶׁ֣ר אִם־עָשִׂ֔יתִי אֵ֥ת אֲשֶׁר־דִּבַּ֖רְתִּי לָֽךְ׃", "onk": "וְהָא <b>מֵימְרִי בְּסַעְדָּךְ<\/b> וְאֶטְּרִנָּךְ <b>בְּכָל אֲתַר<\/b> דִּי תְהַךְ וַאֲתֵיבִנָּךְ לְאַרְעָא הָדָא אֲרֵי לָא אֶשְׁבְּקִנָּךְ עַד דִּי אֶעְבֵּיד יָת דְּמַלֵּלִית לָךְ:", "onk_en": "Behold, I am with you [<b>My Word is your support<\/b>], and I will guard you wherever [<b>every place<\/b>] you go, and I will bring you back to this land. I will not forsake you until I have done that which I have spoken for you.", "pj": "וְהָא מֵימְרִי בְּסַעֲדָךְ וְאַטְרִינָךְ בְּכָל אֲתַר דִתְהַךְ וְאָתֵבִינָךְ לְאַרְעָא הָדָא אֲרוּם לָא אַשְׁבְּקִינָךְ עַד זְמַן דִי אַעֲבֵיד יַת דְמַלֵילִית לָךְ", "pj_en": "And, behold, My Word is for thy help, and will keep thee in every place where thou shalt go, and will bring thee (again) to this land; for I will not leave thee until the time when I have performed all that I have told thee.", "tj": "", "tj_en": "", "rashi": "<b>אנכי עמך.<\/b> לְפִי שֶׁהָיָה יָרֵא מֵעֵשָׂו וּמִלָּבָן:<br><br><b>עד אשר אם עשיתי.<\/b> אִם מְשַׁמֵּשׁ בִּלְשׁוֹן כִּי (גיטין צ'):<br><br><b>דברתי לך.<\/b> לְצָרְכְּךָ וְעָלֶיךָ; מַה שֶּׁהִבְטַחְתִּי לְאַבְרָהָם עַל זַרְעוֹ, לְךָ הִבְטַחְתִּיו וְלֹא לְעֵשָׂו, שֶׁלֹּא אָמַרְתִּי לוֹ כִּי יִצְחָק יִקָּרֵא לְךָ זָרַע אֶלָּא כִּי בְיִצְחָק, וְלֹא כָּל יִצְחָק, וְכֵן כָּל לִי וּלְךָ וְלוֹ וְלָהֶם הַסְּמוּכִים אֵצֶל דִּבּוּר מְשַׁמְּשִׁים לְשוֹן עַל, וְזֶה יוֹכִיחַ, שֶׁהֲרֵי עִם יַעֲקֹב לֹא דִבֵּר קֹדֶם לָכֵן:", "rashi_en": "אנכי עמך I AM WITH THEE — God promised him this because he was in terror of Esau and Laban.<br><br>עד אשר אם עשיתי UNTIL I HAVE DONE — The word אם is here used in the sense of כי (cf. Gittin 90a).<br><br>דברתי לך means I have spoken in thy interest and concerning thee: whatever I promised to Abraham regarding his seed it was in reference to you that I promised it and not in reference to Esau, for I did not say to him “Isaac shall be called thy seed” (which would have signified that all Isaac’s descendants would be regarded, also, as Abraham’s) but I said (21:12) ביצחק “In Isaac” and not all the issue of Isaac”. In the same way wherever לי or לך or לו or להם are used after a verbal form of דבר, they are used in the sense of “concerning”. This verse proves that this is so, since it cannot mean “I have spoken to thee” as He had never spoken to Jacob before this occasion."}, {"ch": 28, "v": 16, "aliyah": 1, "heb": "וַיִּיקַ֣ץ יַעֲקֹב֮ מִשְּׁנָתוֹ֒ וַיֹּ֕אמֶר אָכֵן֙ יֵ֣שׁ יְהֹוָ֔ה בַּמָּק֖וֹם הַזֶּ֑ה וְאָנֹכִ֖י לֹ֥א יָדָֽעְתִּי׃", "onk": "וְאִתְּעַר יַעֲקֹב מִשִּׁנְתֵּיהּ וַאֲמַר בְּקוּשְׁטָא (אִית) <b>יְקָרָא דַיְיָ שָׁרֵי<\/b> בְּאַתְרָא הָדֵין וַאֲנָא <b>לָא הֲוֵיתִי יְדָע<\/b>:", "onk_en": "Yaakov awoke from his sleep, and said, In truth, [<b>the Glory of<\/b>] Adonoy is [<b>dwells<\/b>] in this place, and I did not know it [<b>would not have known it<\/b>].", "pj": "וְאִיתְעַר יַעֲקב מִדַמְכֵיהּ וַאֲמַר בְּקוּשְׁטָא אִית יְקַר שְׁכִינְתָּא דַיְיָ שָׁרֵי בְּאַתְרָא הָדֵין וַאֲנָא לָא הֲוַת יְדָע", "pj_en": "And Jakob awoke from his sleep, and said, Verily the Glory of the Lord's Shekinah dwelleth in this place, and I knew it not.", "tj": "", "tj_en": "", "rashi": "<b>ואנכי לא ידעתי.<\/b> שֶׁאִם יָדַעְתִּי, לֹא יָשַׁנְתִּי בְּמָקוֹם קָדוֹשׁ כָּזֶה:", "rashi_en": "ואנכי לא ידעתי AND I KNEW IT NOT — for had I known it I would not have slept in such a holy place as this. "}, {"ch": 28, "v": 17, "aliyah": 1, "heb": "וַיִּירָא֙ וַיֹּאמַ֔ר מַה־נּוֹרָ֖א הַמָּק֣וֹם הַזֶּ֑ה אֵ֣ין זֶ֗ה כִּ֚י אִם־בֵּ֣ית אֱלֹהִ֔ים וְזֶ֖ה שַׁ֥עַר הַשָּׁמָֽיִם׃", "onk": "וּדְחִיל וַאֲמַר מָה דְּחִילוּ אַתְרָא הָדֵין <b>לֵית דֵּין אֲתַר הֶדְיוֹט אֶלָּהֵין אֲתַר דְּרַעֲוָא בֵיהּ מִן קֳדָם יְי<\/b>ָ וְדֵין תְּרַע <b>קֳבֵל<\/b> שְׁמַיָּא:", "onk_en": "He was afraid and said, How awesome is this place! This is none other than the house of Elohim [<b>not a regular place but a place where it is the will of Elohim to receive prayers<\/b>], and this is the gate of [<b>opposite<\/b>] heaven.", "pj": "וּדְחִיל וַאֲמַר מַה דָחִיל וּמְשַׁבַּח אַתְרָא הָדֵין לֵית דֵין אֲתַר חוֹל אֲרוּם אֱלָהֵן בֵּית מִקְדָשׁ לִשְׁמֵיהּ דַיְיָ וְדֵין כָּשַׁר לִצְלוֹ מְכֻוָון כָּל קְבֵיל תְּרַע שְׁמַיָא מְשַׁכְלַל תְּחוֹת כּוּרְסֵי יְקָרָא", "pj_en": "And he was afraid, and said, How dreadful and glorious is this place! This place is not common, but the sanctuary of the Name of the Lord, the proper spot for prayer, set forth before the gate of heaven and founded beneath the throne of glory.", "tj": "", "tj_en": "", "rashi": "<b>כי אם בית אלהים.<\/b> אָ\"רַ אֶלְעָזָר בְּשֵׁם רַבִּי יוֹסֵי בֶּן זִמְרָא, הַסֻּלָּם הַזֶּה עוֹמֵד בִּבְאֵר שֶׁבַע וְאֶמְצַע שִׁפּוּעוֹ מַגִּיעַ כְּנֶגֶד בֵּית הַמִּקְדָשׁ, שֶׁבְּאֵר שֶׁבַע עוֹמֵד בִּדְרוֹמָהּ שֶׁל יְהוּדָה, וִירוּשָׁלַיִם בִּצְפוֹנָהּ, בַּגְּבוּל שֶׁבֵּין יְהוּדָה וּבִנְיָמִין, וּבֵית אֵל הָיָה בַּצָּפוֹן שֶׁל נַחֲלַת בִּנְיָמִין, בַּגְּבוּל שֶׁבֵּין בִּנְיָמִין וּבֵין בְּנֵי יוֹסֵף; נִמְצָא סֻלָּם שֶׁרַגְלָיו בִּבְאֵר שֶׁבַע וְרֹאשׁוֹ בְּבֵית אֵל מַגִּיעַ אֶמְצַע שִׁפּוּעוֹ נֶגֶד יְרוּשָׁלַיִם; וּכְלַפֵּי שֶׁאָמְרוּ רַבּוֹתֵינוּ שֶׁאָמַר הַקָּבָּ\"ה צַדִּיק זֶה בָּא לְבֵית מְלוֹנִי וְיִפָּטֵר בְּלֹא לִינָה, וְאָמְרוּ יַעֲקֹב קְרָאָהּ לִירוּשָׁלַיִם בֵּית אֵל וְזוֹ לוּז הִיא וְלֹא יְרוּשָׁלַיִם, וּמֵהֵיכָן לָמְדוּ לוֹמַר כֵּן? אֲנִי אוֹמֵר שֶׁנֶּעֱקַר הַר הַמּוֹרִיָה וּבָא לְכָאן, וְזוֹ הִיא קְפִיצַת הָאָרֶץ הָאֲמוּרָה בִּשְׁחִיטַת חֻלִּין, שֶׁבָּא בֵּית הַמִּקְדָשׁ לִקְרָאתוֹ עַד בֵּית אֵל, וְזֶהוּ וַיִּפְגַּע בַּמָּקוֹם. וְאִם תֹּאמַר כְּשֶׁעָבַר יַעֲקֹב עַל בֵּית הַמִּקְדָשׁ, מַדּוּעַ לֹא עִכְּבוֹ שָׁם? אִיהוּ לָא יְהַב לִבֵּיהּ לְהִתְפַּלֵּל בַּמָּקוֹם שֶׁהִתְפַּלְּלוּ אֲבוֹתָיו, וּמִן הַשָּׁמַיִם יְעַכְּבוּהוּ? אִיהוּ עַד חָרָן אֲזַל, כִּדְאָמְרִינַן בְּפֶרֶק גִּיד הַנָּשֶׁה; וּקְרָא מוֹכִיחַ וַיֵּלֶךְ חָרָנָה; כִּי מְטָא לְחָרָן אָמַר, אֶפְשָׁר שֶׁעָבַרְתִּי עַל מָקוֹם שֶׁהִתְפַּלְּלוּ אֲבוֹתַי וְלֹא הִתְפַּלַּלְתִּי בּוֹ? יְהַב דַּעְתֵּיהּ לְמֶהֱדַר וְחָזַר עַד בֵּית אֵל וְקָפְצָה לוֹ הָאָרֶץ. הַאי בֵּית אֵל לֹא הַסָּמוּךְ לָעַי אֶלָּא לִירוּשָׁלַיִם, וְעַל שֵׁם יִהְיֶה בֵּית אֱלֹהִים קְרָאוֹ בֵּית אֵל, וְהוּא הַר הַמּוֹרִיָה שֶׁהִתְפַּלֵּל בּוֹ אַבְרָהָם, וְהוּא שָׂדֶה שֶׁהִתְפַּלֵּל בּוֹ יִצְחָק, כְּדִכְתִיב לָשׂוּחַ בַּשָּׂדֶה; דְּהָכִי אָמְרִינַן בִּפְסָחִים \"אֶל הַר ד' וְאֶל בֵּית אֱלֹהֵי יַעֲקֹב\" – מַאי שְׁנָא יַעֲקֹב? אֶלָּא לֹא כְּאַבְרָהָם שֶׁקְּרָאוֹ הַר, דִּכְתִיב בְּהַר ד' יֵרָאֶה, וְלֹא כְּיִצְחָק שֶׁקְּרָאוֹ שָׂדֶה, דִּכְתִיב לָשׂוּחַ בַּשָּׂדֶה, אֶלָּא כְּיַעֲקֹב שֶׁקְּרָאוֹ בַּיִת (עַ\"כַּ פֵּרַשִׁ\"י מְדֻיָּק):<br><br><b>מה נורא.<\/b> תַּרְגּוּם מַה דְּחִילוּ אַתְרָא הָדֵין, דְּחִילוּ שֵׁם דָּבָר הוּא, כְּמוֹ סוּכְלְתָנוּ וּכְסוּ לְמִלְבָּשׁ:<br><br><b>וזה שער השמים.<\/b> מְקוֹם תְּפִלָּה לַעֲלוֹת תְּפִלָּתָם הַשָּׁמַיְמָה. וּמִדְרָשׁוֹ, שֶׁבֵּית הַמִּקְדָשׁ שֶׁל מַעְלָה מְכֻוָּן כְּנֶגֶד בֵּית הַמִּקְדָשׁ שֶׁל מַטָּה:", "rashi_en": "כי אם בית אלהים THIS IS NONE OTHER THAN THE HOUSE OF GOD —R. Eleazar said in the name of R. José the son of Zimra: “This ladder stood in Beersheba and [the middle of]) its slope reached opposite the Temple” (Genesis Rabbah 69:7). For Beersheba is situated in the South of Judah, Jerusalem in the North of it on the boundary between Judah and Benjamin and Bethel in the North of Benjamin’s territory, on the border between the land of Benjamin and that of the children of Joseph. It follows, therefore, that a ladder whose foot is in Beersheba and whose top is in Bethel has the middle of its slope reaching opposite Jerusalem. Now as regards what our Rabbis stated (Chullin 91b) that the Holy One, blessed be He, said, “This righteous man has came to the place where I dwell (i.e., the Temple at Jerusalem, whilst from here it is evident that he had come to Luz) and shall he depart without staying here over night?”, and with regard to what they also said, (Pesachim 88a) “Jacob gave the name Bethel to Jerusalem”, whereas this place which he called Bethel was Luz and not Jerusalem, whence did they learn to make this statement (which implies that Luz is identical with Jerusalem)? I say that Mount Moriah was forcibly removed from its locality and came hither (to Luz), and that this is what is meant by the “shrinking” of the ground that is mentioned in the Treatise (Chullin 91b) — that the site of the Temple came towards him (Jacob) as far as Bethel and this too is what is meant by ויפגע במקום, “he lighted upon the place” (i.e., he “met” the place, as two people meet who are moving towards each other; cf. Rashi on Genesis 5:11). Now, since Jacob’s route must have been from Beersheba to Jerusalem and thence to Luz and Haran and consequently when he reached Luz he had passed Jerusalem, if you should ask, “When Jacob passed the Temple why did He not make him stop there?” — If it never entered his mind to pray at the spot where his fathers had prayed should Heaven force him to stop there to do so? Really he had reached as far as Haran as we say in the Chapter גיד הנשה (Chullin 91b), and Scripture itself proves this since it states, “And he went to Haran”. When he arrived at Haran he said, “Is it possible that I have passed the place where my fathers prayed without myself praying there?” He decided to return and got as far as Bethel where the ground \"shrank” for him. This Bethel is not the Bethel that is near Ai (cf. Genesis 12:8) but that which is near Jerusalem, and because he said of it, “It shall be the House of God”, he called it Bethel. This, too, is Mount Moriah, where Abraham prayed, and it is also the field in which Isaac offered prayer as it is written, “[Isaac went out] to meditate (i. e., to pray; cf. Genesis 24:63) in the field”. Thus, too, do we read in the Treatise (Pesachim 88a) in a comment on the verse Micah 4:2: “[O come ye and let us go up] to the mountain of the Lord (i.e. the mountain upon which the Temple is built) and to the house of the God of Jacob”. What particular reason is there for mentioning Jacob? But the text calls the Temple not as Abraham did who called it a mount, and not as Isaac did, who called it a field, but as Jacob did who called it Beth[el]—the House of God. (To here from “This Bethel” is to be found in a certain correct Rashi-text)<br><br>מה נורא HOW FEARFUL — In the Targum it is translated by “How דחילו is this place!” דחילו is a noun, like סוכלתנו which is the Targum of תבונה “understanding” (Deuteronomy 32:28), and [וכסו [למלבש which is the Targum of ובגד ללבש “and raiment to put on”) (Genesis 28:20)<br><br>וזה שער השמים AND THIS IS THE GATE OF HEAVEN — a place of prayer where their prayers would ascend to heaven (Pirkei DeRabbi Eliezer 35). The Midrash states (Genesis Rabbah 69:7) that the Heavenly Temple is situated immediately opposite the Earthly Temple (so that the Temple at Jerusalem-Bethel may be styled “the gate” to the Heavenly Temple)"}, {"ch": 28, "v": 18, "aliyah": 1, "heb": "וַיַּשְׁכֵּ֨ם יַעֲקֹ֜ב בַּבֹּ֗קֶר וַיִּקַּ֤ח אֶת־הָאֶ֙בֶן֙ אֲשֶׁר־שָׂ֣ם מְרַֽאֲשֹׁתָ֔יו וַיָּ֥שֶׂם אֹתָ֖הּ מַצֵּבָ֑ה וַיִּצֹ֥ק שֶׁ֖מֶן עַל־רֹאשָֽׁהּ׃", "onk": "וְאַקְדֵּים יַעֲקֹב בְּצַפְרָא וּנְסִיב יָת אַבְנָא דִּי שַׁוִּי אִסָּדוֹהִי וְשַׁוִּי יָתַהּ קָמָא וַאֲרִיק מִשְׁחָא עַל רֵישַׁהּ:", "onk_en": "Yaakov rose early in the morning and took the stone that he had placed at his head; and he set it as a monument, and poured oil on its top.", "pj": "וְאַקְדִים יַעֲקב בְּצַפְרָא וּנְסֵיב יַת אַבְנָא מִן דִשַׁוֵי אִיסָדוֹי וְשַׁוִי יָתָהּ קָמָא וְאָרִיק מִשְׁחָא עַל רֵישָׁהּ", "pj_en": "And Jakob arose in the morning, and took the stone which he had placed for his pillow, and set it standing, and poured oil on the top of it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 19, "aliyah": 1, "heb": "וַיִּקְרָ֛א אֶת־שֵֽׁם־הַמָּק֥וֹם הַה֖וּא בֵּֽית־אֵ֑ל וְאוּלָ֛ם ל֥וּז שֵׁם־הָעִ֖יר לָרִאשֹׁנָֽה׃", "onk": "וּקְרָא יָת שְׁמָא דְאַתְרָא הַהוּא בֵּית אֵל וּבְרַם לוּז שְׁמָא דְקַרְתָּא בְּקַדְמֵיתָא:", "onk_en": "He named that place Beis Eil, but Luz was the original name of the city.", "pj": "וּקְרָא שְׁמָא דְאַתְרָא הַהוּא בֵּית אֵל וּבְרַם לוּז שְׁמָא דְקַרְתָּא מִן קַדְמַת דְנָא", "pj_en": "And he called the name of that place Beth El; but Luz was the name of the city at the first.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 28, "v": 20, "aliyah": 1, "heb": "וַיִּדַּ֥ר יַעֲקֹ֖ב נֶ֣דֶר לֵאמֹ֑ר אִם־יִהְיֶ֨ה אֱלֹהִ֜ים עִמָּדִ֗י וּשְׁמָרַ֙נִי֙ בַּדֶּ֤רֶךְ הַזֶּה֙ אֲשֶׁ֣ר אָנֹכִ֣י הוֹלֵ֔ךְ וְנָֽתַן־לִ֥י לֶ֛חֶם לֶאֱכֹ֖ל וּבֶ֥גֶד לִלְבֹּֽשׁ׃", "onk": "וְקַיִּים יַעֲקֹב קְיָם לְמֵימָר אִם יְהֵא <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדִּי<\/b> וְיִטְּרִנַּנִי בְּאָרְחָא הָדֵין דִּי אֲנָא אָזֵל וְיִתֶּן לִי לַחֲמָא (<small>נ\"א<\/small> לְחֵם) לְמֵיכַל וּכְסוּ לְמִלְבָּשׁ:", "onk_en": "Yaakov made a vow, saying, If [<b>the Word of<\/b>] Elohim will be with me [<b>my support<\/b>], and guards me on this path that I am going, and gives me bread to eat and clothing to wear;", "pj": "וְקַיֵים יַעֲקב קְיָים לְמֵימָר אִין יְהִי מֵימְרָא דַיְיָ בְּסַעֲדִי וְיִטְרִנַנִי מִשְׁפִיכוֹת אֲדָם זַכְּאַי פּוּלְחָנָא נוּכְרָאָה וְגִילוּי עִרְיָתָא בְּאוֹרְחָא הָדֵין דַאֲנָא אָזִיל וְיִתֵּן לִי לְחֵם לְמֵיכוֹל וּכְסוּ לְמִילְבּוּשׁ", "pj_en": "And Jakob vowed a vow, saying, If the Word of the Lord will be my Helper, and will keep me from shedding innocent blood, and from strange worship, and from impure converse, in this way that I am going; and will give me bread to eat, and raiment to wear,", "tj": "", "tj_en": "", "rashi": "<b>אם יהיה אלהים עמדי.<\/b> אִם יִשְׁמֹר לִי הַבְטָחוֹת הַלָּלוּ שֶׁהִבְטִיחַנִי לִהְיוֹת עִמָּדִי, כְּמוֹ שֶׁאָמַר לִי וְהִנֵּה אָנֹכִי עִמָּךְ:<br><br><b>ושמרני.<\/b> כְּמוֹ שֶׁאָמַר לִי וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר תֵּלֵךְ:<br><br><b>ונתן לי לחם לאכל.<\/b> כְּמוֹ שֶׁאָמַר כִּי לֹא אֶעֱזָבְךָ, וְהַמְבַקֵּשׁ לֶחֶם הוּא קָרוּי נֶעֱזָב, שֶׁנֶּאֱמַר וְלֹא רָאִיתִי צַדִּיק נֶעֱזָב וְזַרְעוֹ מְבַקֶּשׁ לָחֶם (תהילים ל\"ז):", "rashi_en": "אם יהיה אלהים עמדי  IF GOD WILL BE WITH ME — if He will keep for me these promises which He has made me that He would be with me, even as He said to me (v. 15), “Behold, I am with thee” (Genesis Rabbah 70:4),<br><br>ושמרני AND IF HE WILL KEEP ME — even as He said to me (v. 15) “And I will keep thee whithersoever thou goest”, (Genesis Rabbah 70:4)<br><br>ונתן לי לחם לאכול AND IF HE WILL GIVE ME BREAD TO EAT — even as He said (v. 15) “For I will not forsake thee” (Genesis Rabbah 70:4), — for one who has to beg his bread is called “forsaken”, as it is said (Psalms 37:25) “I have not seen the righteous forsaken and his seed begging bread”."}, {"ch": 28, "v": 21, "aliyah": 1, "heb": "וְשַׁבְתִּ֥י בְשָׁל֖וֹם אֶל־בֵּ֣ית אָבִ֑י וְהָיָ֧ה יְהֹוָ֛ה לִ֖י לֵאלֹהִֽים׃", "onk": "וְאֵתוּב בִּשְׁלַם לְבֵית אַבָּא וִיהֵא <b>מֵימְרָא<\/b> דַיְיָ לִי לֵאלָהָא:", "onk_en": "And if I return in peace to my father’s house, and [<b>the Word of<\/b>] Adonoy will be my God;", "pj": "וְאֵיתוּב בִּשְׁלָם לְבֵיתֵיהּ דִאַבָּא וִיהֵי יְיָ לִי לֵאלָהָא", "pj_en": "and will bring me back in peace to my father's house; the Lord shall be my God:", "tj": "", "tj_en": "", "rashi": "<b>ושבתי.<\/b> כְּמוֹ שֶׁאָמַר לִי וַהֲשִׁבֹתִיךָ אֶל הָאֲדָמָה:<br><br><b>בשלום.<\/b> שָׁלֵם מִן הַחֵטְא, שֶׁלֹּא אֶלְמַד מִדַּרְכֵי לָבָן:<br><br><b>והיה ה' לי לאלהים.<\/b> שֶׁיָּחוּל שְׁמוֹ עָלַי מִתְּחִלָּה וְעַד סוֹף, שֶׁלֹּא יִמָּצֵא פְּסוּל בְּזַרְעִי, כְּמוֹ שֶׁנֶּאֱמַר אֲשֶׁר דִּבַּרְתִּי לָךְ; וְהַבְטָחָה זוֹ הִבְטִיחַ לְאַבְרָהָם, שֶׁנֶּאֱמַר לִהְיוֹת לְךָ לֵאלֹהִים וּלְזַרְעֲךָ אַחֲרֶיךָ (בראשית י״ז:ז׳):", "rashi_en": "ושבתי SO THAT I RETURN — even as He said (v. 15) “I will restore thee again into this land”  (Genesis Rabbah 70:4), <br><br>בשלום IN PEACE, perfectly free (שלם) from sin, not having learnt evil from Laban’s ways,<br><br>והיה ה' לי לאלהים AND IF THE LORD WILL BE MY GOD, in that His Name shall rest upon me from the beginning to the end: that no unworthy person shall be found in my descendants (Sifré, ואתחנן 31) — just as it is said (v. 15), “I will do that which I spake concerning thee”; and this promise He made to Abraham, as it is said (17:7) “To be a God unto thee and unto thy seed after thee”, "}, {"ch": 28, "v": 22, "aliyah": 1, "heb": "וְהָאֶ֣בֶן הַזֹּ֗את אֲשֶׁר־שַׂ֙מְתִּי֙ מַצֵּבָ֔ה יִהְיֶ֖ה בֵּ֣ית אֱלֹהִ֑ים וְכֹל֙ אֲשֶׁ֣ר תִּתֶּן־לִ֔י עַשֵּׂ֖ר אֲעַשְּׂרֶ֥נּוּ לָֽךְ׃", "onk": "וְאַבְנָא הָדָא דִּי שַׁוֵּיתִי קָמָא <b>תְּהֵי דִּי אֵהֵי פָלַח עֲלַהּ מִן קֳדָם יְיָ<\/b> וְכֹל דִּי תִּתֶּן לִי חַד מִן עַשְׂרָא אַפְרְשִׁנֵּיהּ <b>קֳדָמָךְ<\/b>:", "onk_en": "[Then] this stone which I have set [as] a monument will become a House of God [<b>place where I will worship upon it before God<\/b>], and of all that You give, I will surely give a tenth to [<b>before<\/b>] You.", "pj": "וְאַבְנָא הָדָא דִשַׁוִיתִי קָמָא תְּהֵי מְסַדְרָא בְּבֵי מוּקְדְשָׁא דַיְיָ וִיהוֹן דָרַיָא פַּלְחִין עֲלָהּ לִשְׁמָא דַיְיָ וְכָל דְתִתֵּן לִי חַד מִן עַסְרָא אַפְרְשִׁינֵיהּ קֳדָמָךְ", "pj_en": "and this stone which I have set (for) a pillar shall be ordained for the house of the sanctuary of the Lord, and upon it shall generations worship the Name of the Lord; and of all that Thou mayest give me, the tenth will I separate before Thee.", "tj": "", "tj_en": "", "rashi": "<b>והאבן הזאת.<\/b> כָּךְ תְּפָרֵשׁ וָי\"ו זוֹ שֶׁל וְהָאֶבֶן: אִם תַּעֲשֶׂה לִי אֶת אֵלֶּה, אֲנִי אֶעֱשֶׂה זֹאת:<br><br><b>והאבן הזאת אשר שמתי מצבה וגו'.<\/b> כְּתַרְגּוּמוֹ אֱהִי פָלַח עֲלָהּ קֳדָם ה', וְכֵן עָשָׂה בְשׁוּבוֹ מִפַּדַּן אֲרָם; כְּשֶׁאָמַר לוֹ קוּם עֲלֵה בֵית אֵל (שם ל\"ה י\"ד) מַה נֶּאֱמַר שָׁם? וַיַּצֵּב יַעֲקֹב מַצֵּבָה וַיַּסֵּךְ עָלֶיהָ נֶסֶךְ:", "rashi_en": "והאבן הזאת THEN THIS STONE — This is how you should explain the ו of והאבן: if He will do these things mentioned in Genesis 28:15 as He promised, then I, also, will do this:<br><br>והאבן הזאת אשר שמתי מצבה THEN THIS STONE WHICH I HAVE SET UP FOR A PILLAR etc. — Explain it as the Targum translates it: “I shall serve the Lord upon it” This, indeed, he did on his return from Padan-aram, when God said to him, (Genesis 35:1) “Arise, go up to Bethel”. What is stated there? “And Jacob set up a pillar … and he poured out a drink-offering thereon” (Genesis 35:14)."}, {"ch": 29, "v": 1, "aliyah": 2, "heb": "וַיִּשָּׂ֥א יַעֲקֹ֖ב רַגְלָ֑יו וַיֵּ֖לֶךְ אַ֥רְצָה בְנֵי־קֶֽדֶם׃", "onk": "וּנְטַל יַעֲקֹב רַגְלוֹהִי (<small>נ\"א<\/small> רִיגְלוֹהִי) וַאֲזַל לַאֲרַע בְּנֵי מָדִינְחָא:", "onk_en": "Yaakov [then] lifted his feet and went toward the land of the people of the East.", "pj": "וּנְטַל יַעֲקב בִּקְלִילוּתָא רִיגְלוֹי לְטַיְלָא וְאָזַל לְאַרְעָא בְּנֵי מַדִינְחָא", "pj_en": "And Jakob lifted up his feet lightly to proceed, and he came to the land of the children of the cast.", "tj": "", "tj_en": "", "rashi": "<b>וישא יעקב רגליו.<\/b> מִשֶּׁנִּתְבַּשֵּׂר בְּשׂוֹרָה טוֹבָה שֶׁהֻבְטַח בִּשְׁמִירָה נָשָׂא לִבּוֹ אֶת רַגְלָיו וְנַעֲשָׂה קַל לָלֶכֶת, כָּךְ מְפֹרָשׁ בִּבְ\"רַ:", "rashi_en": "וישא יעקב רגליו THEN JACOB LIFTED UP HIS FEET —As soon as he received the good tidings that he was assured of God’s protection his heart lifted up his feet and he walked swiftly. Thus is it explained in (Genesis Rabbah 70:8). "}, {"ch": 29, "v": 2, "aliyah": 2, "heb": "וַיַּ֞רְא וְהִנֵּ֧ה בְאֵ֣ר בַּשָּׂדֶ֗ה וְהִנֵּה־שָׁ֞ם שְׁלֹשָׁ֤ה עֶדְרֵי־צֹאן֙ רֹבְצִ֣ים עָלֶ֔יהָ כִּ֚י מִן־הַבְּאֵ֣ר הַהִ֔וא יַשְׁק֖וּ הָעֲדָרִ֑ים וְהָאֶ֥בֶן גְּדֹלָ֖ה עַל־פִּ֥י הַבְּאֵֽר׃", "onk": "וַחֲזָא וְהָא בֵירָא בְחַקְלָא וְהָא תַמָּן תְּלָתָא עֶדְרִין דְּעָן רְבִיעִין עֲלַהּ אֲרֵי מִן בֵּירָא הַהִיא מַשְׁקָן עֲדָרַיָּא וְאַבְנָא רַבְּתָא עַל פּוּמָא דְבֵירָא:", "onk_en": "He looked and [saw] a well in the field; and behold there were three flocks of sheep lying beside it, for from that well the flocks are watered. There was a large stone over the mouth of the well.", "pj": "וַחֲמָא וְהָא בֵּירָא בְּחַקְלָא וְהָא תַּמָן תְּלָתָא עֶדְרִין דְעָאן רְבִיעִין עֲלָהּ אֲרוּם מִן בֵּירָא הַהוּא מַשְׁקַן עֶדְרַיָא וְאַבְנָא רַבְּתָא מַחְתָא עַל פּוּם בֵּירָא", "pj_en": "And he looked and saw, and behold (there was) a well in a field, and behold there three flocks of sheep lying near it; because from that well they watered the flocks; and a great stone was laid upon the mouth of the well.", "tj": "", "tj_en": "", "rashi": "<b>ישקו העדרים.<\/b> מַשְׁקִים הָרוֹעִים אֶת הָעֲדָרִים, וְהַמִּקְרָא דִבֵּר בְּלָשׁוֹן קְצָרָה:", "rashi_en": "ישקו העדרים THEY GAVE THE DROVES DRINK —the shepherds used to water the flocks: this verse uses an elliptical phrase (omitting the subject “the shepherds”). "}, {"ch": 29, "v": 3, "aliyah": 2, "heb": "וְנֶאֶסְפוּ־שָׁ֣מָּה כׇל־הָעֲדָרִ֗ים וְגָלְל֤וּ אֶת־הָאֶ֙בֶן֙ מֵעַל֙ פִּ֣י הַבְּאֵ֔ר וְהִשְׁק֖וּ אֶת־הַצֹּ֑אן וְהֵשִׁ֧יבוּ אֶת־הָאֶ֛בֶן עַל־פִּ֥י הַבְּאֵ֖ר לִמְקֹמָֽהּ׃", "onk": "וּמִתְכַּנְּשִׁין לְתַמָּן כָּל עֲדָרַיָּא וּמְגַנְדְּרִין יָת אַבְנָא מֵעַל פּוּמָא דְבֵירָא וּמַשְׁקָן יָת עָנָא וּמְתִיבִין יָת אַבְנָא עַל פּוּמָא דְבֵירָא לְאַתְרַהּ:", "onk_en": "When all the flocks would gather, [the shepherds] would roll the stone from the well’s mouth, and water the sheep. They would [then] return the stone to its place over the mouth of the well.", "pj": "וּמִתְכַּנְשִׁין תַּמָן כָּל עֶדְרַיָא וּמְגַלְגְלִין יַת אַבְנָא מֵעַל פּוּם בֵּירָא וּמַשְׁקַן יַת עָנָא וּמְתִיבִין יַת אַבְנָא עַל פּוּם בֵּירָא לְאַתְרָהּ", "pj_en": "And they gathered the flocks there, and rolled the stone from the well's mouth, and watered the sheep, and set the stone on the mouth of the well in its place.", "tj": "", "tj_en": "", "rashi": "<b>ונאספו.<\/b> רְגִילִים הָיוּ לְהֵאָסֵף, לְפִי שֶׁהָיְתָה הָאֶבֶן גְּדוֹלָה:<br><br><b>וגללו.<\/b> וְגוֹלְלִים, וְתַרְגּוּמוֹ וּמְגַנְדְּרִין, כָּל לְשׁוֹן הוֹוֶה מִשְׁתַּנֶּה לְדַבֵּר בִּלְשׁוֹן עָתִיד וּבִלְשׁוֹן עָבָר, לְפִי שֶׁכָּל דָּבָר הַהוֹוֶה תָּמִיד כְּבָר הָיָה וְעָתִיד לִהְיוֹת:<br><br><b>והשיבו.<\/b> תַּרְגּוּמוֹ וּמְתִיבִין:", "rashi_en": "ונאספו [AND THITHER WERE ALL THE DROVES] GATHERED — they regularly gathered there because the stone was a heavy one<br><br>וגללו AND THEY ROLLED THE STONE — it means and they used to roll. In the Targum it is therefore translated by ומגנדרין (a participle). The idea of frequentative action is expressed indifferently by the imperfect (future) or the perfect (past) because every action that occurs continually, has already happened and will again happen,<br><br>והשיבו AND RESTORED [THE STONE] — In the Targum it is translated by ומתיבין(a participle) — and they were always putting back. "}, {"ch": 29, "v": 4, "aliyah": 2, "heb": "וַיֹּ֤אמֶר לָהֶם֙ יַעֲקֹ֔ב אַחַ֖י מֵאַ֣יִן אַתֶּ֑ם וַיֹּ֣אמְר֔וּ מֵחָרָ֖ן אֲנָֽחְנוּ׃", "onk": "וַאֲמַר לְהוֹן יַעֲקֹב אַחַי מְנָן אַתּוּן וַאֲמָרוּ מֵחָרָן אֲנָחְנָא:", "onk_en": "Yaakov said to them, My brothers, from where do you come? They said, We are from Charan.", "pj": "וַאֲמַר לְהוֹם יַעֲקב אַחַי מְנָן אַתּוּן וְאָמְרוּ מֵחָרָן אֲנָחְנָא", "pj_en": "And Jakob said to them, My brethren, whence are you? And they said, From Haran are we.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 5, "aliyah": 2, "heb": "וַיֹּ֣אמֶר לָהֶ֔ם הַיְדַעְתֶּ֖ם אֶת־לָבָ֣ן בֶּן־נָח֑וֹר וַיֹּאמְר֖וּ יָדָֽעְנוּ׃", "onk": "וַאֲמַר לְהוֹן הַיְדַעְתּוּן יָת לָבָן בַּר נָחוֹר וַאֲמָרוּ יְדַעְנָן:", "onk_en": "He said to them, Do you know Lavan, the son of Nachor? They said, We know him.", "pj": "וַאֲמַר לְהוֹם הַיְדַעְתּוּן יַת לָבָן בַּר נָחוֹר וְאָמְרוּ יָדַעְנָא", "pj_en": "And he said to them, Know you Laban bar Nachor? And they said, We know.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 6, "aliyah": 2, "heb": "וַיֹּ֥אמֶר לָהֶ֖ם הֲשָׁל֣וֹם ל֑וֹ וַיֹּאמְר֣וּ שָׁל֔וֹם וְהִנֵּה֙ רָחֵ֣ל בִּתּ֔וֹ בָּאָ֖ה עִם־הַצֹּֽאן׃", "onk": "וַאֲמַר לְהוֹן הַשְׁלַם לֵיהּ וַאֲמָרוּ שְׁלַם וְהָא רָחֵל בְּרַתֵּיהּ אָתְיָא עִם עָנָא:", "onk_en": "He said to them, Is he doing well? They said, He is doing well. Behold Rochel, his daughter, is coming with the sheep.", "pj": "וַאֲמַר לְהוֹם הַשְׁלַם לֵיהּ וַאֲמָרוּ שְׁלָם וְהָא רָחֵל בְּרַתֵּיהּ אַתְיָא עִם עָנָא", "pj_en": "And he said, Hath he peace? And they said, Peace; and, behold, Rahel his daughter cometh with the sheep.", "tj": "", "tj_en": "", "rashi": "<b>באה עם הצאן.<\/b> הַטַּעַם בָּאָלֶ\"ף וְתַרְגּוּמוֹ אָתְיָא; וְרָחֵל בָּאָה – הַטַּעַם לְמַעְלָה בַּבֵּי\"ת וְתַרְגּוּמוֹ אֲתָת; הָרִאשׁוֹן לְשׁוֹן עוֹשָׂה וְהַשֵּׁנִי לְשׁוֹן עָשְׂתָה:", "rashi_en": "באה עם הצאן IS COMING WITH THE FLOCK — The accent in the word באה is on the א, and the Targum is אתיא (a participle), “she is coming”; but in (v. 9) “And Rachel came (באה)”, the accent is on the first syllable, on the ב, and the Targum is אתת, “she came”. The former expresses the meaning “she is doing something” (a participle), the latter expresses the meaning “she has done something’ (a past tense). "}, {"ch": 29, "v": 7, "aliyah": 2, "heb": "וַיֹּ֗אמֶר הֵ֥ן עוֹד֙ הַיּ֣וֹם גָּד֔וֹל לֹא־עֵ֖ת הֵאָסֵ֣ף הַמִּקְנֶ֑ה הַשְׁק֥וּ הַצֹּ֖אן וּלְכ֥וּ רְעֽוּ׃", "onk": "וַאֲמַר הָא עוֹד יוֹמָא סַגִּי לָא עִדַּן לְמִכְנַשׁ בְּעִיר אַשְׁקוּ עָנָא וְאִזִּילוּ רְעוּ:", "onk_en": "He said to them, The day is yet long, it is not yet time for the sheep to be gathered, water the sheep and go pasture them.", "pj": "וַאֲמַר הָא עִידַן יוֹמָא סַגִי לָא עִידַן לְמִיכְנַשׁ בְּעִיר אַשְׁקוּ עָנָא וְאֵיזִילוּ רְעוּ", "pj_en": "And he said, Behold, the time of the day is great; it is not time to gather home the cattle; water the sheep, and let them go (again) to pasture.", "tj": "וְלָא אִישִׁין לְמַכְנְשָׁא:", "tj_en": "It is not time to gather.", "rashi": "<b>הן עוד היום גדול.<\/b> לְפִי שֶׁרָאָה אוֹתָם רוֹבְצִים, כַּסָּבוּר שֶׁרוֹצִים לֶאֱסֹף הַמִּקְנֶה הַבַּיְתָה וְלֹא יִרְעוּ עוֹד, אָמַר לָהֶן הֵן עוֹד הַיּוֹם גָּדוֹל, כְּלוֹמַר אִם שְׂכִירִים אַתֶּם לֹא שִׁלַּמְתֶּם פְּעֻלַּת הַיּוֹם, וְאִם הַבְּהֵמוֹת שֶׁלָּכֶם אַעַ\"פִּ כֵן לֹא עֵת הֵאָסֵף הַמִּקְנֶה וְגו' (בראשית רבה):", "rashi_en": "הן עוד היום גדול LO, IT IS YET HIGH DAY — Because he saw them lying down he thought that they wished to take the cattle home, and that they should not graze any longer. He, therefore, said to them, “Lo, it is yet high day” — meaning, if you are hired men you have not yet finished your day’s task, and if these are your own cattle, nevertheless — 'לא עת האסף המקנה וגו IT IS NOT YET TIME FOR THE CATTLET TO BE GATHERED TOGETHER TO TAKE THEM HOME (Genesis Rabbah 70:11). "}, {"ch": 29, "v": 8, "aliyah": 2, "heb": "וַיֹּאמְרוּ֮ לֹ֣א נוּכַל֒ עַ֣ד אֲשֶׁ֤ר יֵאָֽסְפוּ֙ כׇּל־הָ֣עֲדָרִ֔ים וְגָֽלְלוּ֙ אֶת־הָאֶ֔בֶן מֵעַ֖ל פִּ֣י הַבְּאֵ֑ר וְהִשְׁקִ֖ינוּ הַצֹּֽאן׃", "onk": "וַאֲמָרוּ לָא נִכּוּל עַד דִּי מִתְכַּנְּשִׁין כָּל עֲדָרַיָּא וִיגַנְדְּרוּן יָת אַבְנָא מֵעַל פּוּמָא דְבֵירָא וְנַשְׁקֵי עָנָא:", "onk_en": "They said, We cannot [do so] until all the flocks have gathered and [the shepherds] roll the stone from the mouth of the well. Then we can water the sheep.", "pj": "וַאֲמָרוּ לָא נֵיכוּל עַד דִי יִתְכַּנְשׁוּן כָּל עֶדְרַיָא וִיְגַלְגְלִין יַת אַבְנָא מֵעַל פּוּם בֵּירָא וְנַשְׁקֵי יַת עָנָא", "pj_en": "And they said, We cannot until all the flocks are gathered together, and we roll the stone from the mouth of the well and water the sheep.", "tj": "", "tj_en": "", "rashi": "<b>לא נוכל.<\/b> לְהַשְׁקוֹת, לְפִי שֶׁהָאֶבֶן גְּדוֹלָה:<br><br><b>וגללו.<\/b> זֶה מְתֻרְגָּם וִיגַנְדְּרוּן, לְפִי שֶׁהוּא לְשׁוֹן עָתִיד:", "rashi_en": "לא נוכל WE CANNOT — give them water because the stone is a heavy one.<br><br>וגללו AND THEY ROLL AWAY — This word is rendered in the Targum by ויגנדרון “and they will roll away” (whilst in Genesis 5:3 it is rendered by an Aramaic participle) because the verb has here a future meaning. "}, {"ch": 29, "v": 9, "aliyah": 2, "heb": "עוֹדֶ֖נּוּ מְדַבֵּ֣ר עִמָּ֑ם וְרָחֵ֣ל&thinsp;<b>׀<\/b> בָּ֗אָה עִם־הַצֹּאן֙ אֲשֶׁ֣ר לְאָבִ֔יהָ כִּ֥י רֹעָ֖ה הִֽוא׃", "onk": "עַד דְּהוּא מְמַלֵּל עִמְּהוֹן וְרָחֵל אָתַת עִם עָנָא דִּי לַאֲבוּהָ אֲרֵי רָעִיתָא הִיא:", "onk_en": "While he was still speaking with them, Rochel came with her father’s sheep, for she was a shepherdess.", "pj": "עַד דַהֲוָה מְמַלֵיל עִמְהוֹן וְרָחֵל אָתַת עִם עָנָא דִלְאָבוּהָ אֲרוּם רָעִיתָא הִיא בְּהַהוּא זִמְנָא אֲרוּם הֲוָה מַחֲתָא דַיְיָ בְּעָנָא דְלָבָן וְלָא אִשְׁתַּיְירוּ מִנְהוֹן אֱלָהֵן קַלִילִין וְתָרִיךְ רַעֲיָא דִילֵיהּ וּמַה דְאִשְׁתַּאֲרוּ שַׁוִי קֳדָם רָחֵל בְּרַתֵּיהּ", "pj_en": "While they were speaking with him, Rahel came with her father's sheep; for she was a shepherdess at that time, because there had been a plague from the Lord among the sheep of Laban, and but few of them were left, and he had dismissed his shepherds, and had put the remaining (flock) before Rahel his daughter.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 10, "aliyah": 2, "heb": "וַיְהִ֡י כַּאֲשֶׁר֩ רָאָ֨ה יַעֲקֹ֜ב אֶת־רָחֵ֗ל בַּת־לָבָן֙ אֲחִ֣י אִמּ֔וֹ וְאֶת־צֹ֥אן לָבָ֖ן אֲחִ֣י אִמּ֑וֹ וַיִּגַּ֣שׁ יַעֲקֹ֗ב וַיָּ֤גֶל אֶת־הָאֶ֙בֶן֙ מֵעַל֙ פִּ֣י הַבְּאֵ֔ר וַיַּ֕שְׁקְ אֶת־צֹ֥אן לָבָ֖ן אֲחִ֥י אִמּֽוֹ׃", "onk": "וַהֲוָה כַּד חֲזָא יַעֲקֹב יָת רָחֵל בַּת לָבָן אֲחוּהָא דְאִמֵּיהּ וְיָת עָנָא דְלָבָן אֲחוּהָא דְאִמֵּיהּ וּקְרֵב יַעֲקֹב וְגַנְדַּר יָת אַבְנָא מֵעַל פּוּמָא דְבֵירָא וְאַשְׁקֵי יָת עָנָא דְלָבָן אֲחוּהָא דְאִמֵּיהּ:", "onk_en": "When Yaakov saw Rochel, the daughter of Lavan, his mother’s brother, with the sheep of Lavan, his mother’s brother, he stepped near and rolled the stone from the mouth of the well. He then watered the sheep of Lavan, his mother’s brother.", "pj": "וַהֲוָה כְּדִי חָמָא יַעֲקב יַת רָחֵל בְּרַת לָבָן אֲחוּהָא דְאִמֵיהּ וְקָרֵב יַעֲקב וְגַלְגֵיל יַת אַבְנָא בַּחֲדָא מִן אֶדְרָעוֹי מֵעִילוֹי פּוּם בֵּירָא וְטָפַת בֵּירָא וּסְלִיקוּ מַיָא לְאַנְפּוֹי וְאַשְׁקֵי יַת עָנָא דְלָבָן אָחוּהָא דְאִימֵיהּ וַהֲוַת טַיְיפָא עַשְרִין שְׁנִין", "pj_en": "And it was when Jakob saw Rahel the daughter of Laban his mother's brother that Jakob went nigh, and rolled the stone with one of his arms from the mouth of the Well; and the well uprose, and the waters ascended to the top of it; and he watered the sheep of Laban his mothor's brother; and it uprose for twenty years.", "tj": "", "tj_en": "", "rashi": "<b>ויגש יעקב ויגל.<\/b> כְּמִי שֶׁמַּעֲבִיר אֶת הַפְּקָק מֵעַל פִּי צְלוֹחִית; לְהוֹדִיעֲךָ שֶׁכֹּחוֹ גָּדוֹל (בראשית רבה):", "rashi_en": "ויגש יעקב ויגל JACOB STEPPED NEAR AND ROLLED [THE STONE]- as easily as one draws the stopper from the mouth of a bottle — thus showing you how strong he was. (Bereishit Rabbah 70:12)"}, {"ch": 29, "v": 11, "aliyah": 2, "heb": "וַיִּשַּׁ֥ק יַעֲקֹ֖ב לְרָחֵ֑ל וַיִּשָּׂ֥א אֶת־קֹל֖וֹ וַיֵּֽבְךְּ׃", "onk": "וּנְשַׁק יַעֲקֹב לְרָחֵל וַאֲרֵם יָת קָלֵיהּ וּבְכָא:", "onk_en": "Yaakov kissed Rochel and cried in a loud voice.", "pj": "וּנְשַׁק יַעֲקב לְרָחֵל וַאֲרֵים יַת קָלֵיהּ וּבְכָא", "pj_en": "And Jakob kissed Rahel, and lifted up his voice and wept.", "tj": "", "tj_en": "", "rashi": "<b>ויבך.<\/b> לְפִי שֶׁצָּפָה בְרוּח הַקֹּדֶש שֶאֵינָהּ נִכְנֶסֶת עִמּוֹ לִקְבוּרָה. דָּ\"אַ לְפִי שֶׁבָּא בְּיָדַיִם רֵקָנִיּוֹת; אָמַר, אֱלִיעֶזֶר עֶבֶד אֲבִי אַבָּא הָיוּ בְיָדָיו נְזָמִים וּצְמִידִים וּמִגְדָּנוֹת וַאֲנִי אֵין בְּיָדִי כְלוּם; לְפִי שֶׁרָדַף אֶלִיפַז בֶּן עֵשָׂו בְּמִצְוַת אָבִיו אַחֲרָיו לְהָרְגוֹ וְהִשִּׂיגוֹ, וּלְפִי שֶׁגָּדַל אֶלִיפַז בְּחֵיקוֹ שֶׁל יִצְחָק, מָשַׁךְ יָדָיו. אָמַר לוֹ מָה אֱעֱשֶׂה לַצִּוּוּי שֶׁל אַבָּא? אָמַר לוֹ יַעֲקֹב טֹל מַה שֶּׁבְּיָדִי, וְהֶעָנִי חָשׁוּב כַּמֵּת:", "rashi_en": "ויבך AND HE WEPT- because he foresaw by the Holy Spirit that she would not be buried with him in the cave of Machpelah (Genesis Rabbah 70:12). Another explanation is: he wept because he came with empty hands. He thought: Eliezer, my grandfather’s servant, had with him rings, bracelets and all good things, whilst I have nothing with me (Genesis Rabbah 70:12). This was because Eliphaz Esau’s son pursued Jacob by his father’s order to kill him, and overtook him. But because Eliphaz had been brought up on Isaac’s lap, (cp. Deuteronomy Rabbah 2:13) he withheld his hand. He said to him (Jacob), “But what shall I do as regards my father’s order?” Jacob replied, “Take all I have and you can say that I am dead for a poor man may be accounted as dead\" (Nedarim 64b). "}, {"ch": 29, "v": 12, "aliyah": 2, "heb": "וַיַּגֵּ֨ד יַעֲקֹ֜ב לְרָחֵ֗ל כִּ֣י אֲחִ֤י אָבִ֙יהָ֙ ה֔וּא וְכִ֥י בֶן־רִבְקָ֖ה ה֑וּא וַתָּ֖רׇץ וַתַּגֵּ֥ד לְאָבִֽיהָ׃", "onk": "וְחַוִּי יַעֲקֹב לְרָחֵל אֲרֵי <b>בַר אֲחָה דְאָבוּהָ<\/b> הוּא וַאֲרֵי בַר רִבְקָה הוּא וּרְהָטַת וְחַוִּיאַת לְאָבוּהָ:", "onk_en": "Yaakov told Rochel that he was a relative of her father [<b>the son of her father’s sister<\/b>], that he was the son of Rivkah. She ran and told her father.", "pj": "וְתַנִי יַעֲקב לְרָחֵל אֲרוּם לְאִיתְקַרְבָא עִם אָבוּהָא אָתָא וּלְמֵיסַב חָדָא מִן בְּרַתּוֹי עָנְתָה רָחֵל וַאֲמָרַת לֵית אֶפְשַר לָךְ לְמֵיתַב עִמֵיהּ אֲרוּם גְבַר רַמְאַי הוּא אָמַר לָהּ יַעֲקב אֲנָא רַמְאַי וְחַכִּים יַתִּיר מִנֵיהּ וְלֵית לֵיהּ רְשׁוּ לְאַבְאָשָׁא לִי אֲרוּם מֵימְרָא דַיְיָ בְּסַעֲדִי וּכְדִי יָדְעַת אֲרוּם בַּר רִבְקָה הוּא וּרְהָטַת וְתַנִיאַת לְאָבוּהָא", "pj_en": "And Jakob told unto Rahel, that he was come to be with her father to take one of his daughters. And Rahel answered him Thou canst not dwell with him, for he is a man of cunning. And Jakob said to her, I am more cunning and wiser than he; nor can he do me evil, because the Word of the Lord is my Helper. And when she knew that he was the son of Rivekah, she ran and made it known to her father.", "tj": "", "tj_en": "", "rashi": "<b>כי אחי אביה הוא.<\/b> קָרוֹב לְאָבִיהָ, כְּמוֹ אֲנָשִׁים אַחִים אֲנָחְנוּ. וּמִדְרָשׁוֹ, אִם לְרַמָּאוּת הוּא בָא, גַם אֲנִי אָחִיו בְּרַמָּאוּת, וְאִם אָדָם כָּשֵׁר הוּא, גַּם אֲנִי בֶן רִבְקָה אֲחוֹתוֹ הַכְּשֵׁרָה:<br><br><b>ותגד לאביה.<\/b> לְפִי שֶׁאִמָּהּ מֵתָה, וְלֹא הָיָה לָהּ לְהַגִּיד אֶלָּא לוֹ (בראשית רבה):", "rashi_en": "כי אחי אביה הוא HE WAS HER FATHER’S BROTHER — near kin to her father, as (Genesis 13:8) “for we are men, brothers (אחים)” (i. e. near kin). A Midrashic explanation is that he meant: if he (Laban) intends to practice deceit upon me then I am his brother (a match for him) in deception; if, however, he is an honest man then I, too, am the son of his sister, the pious Rebekah (Genesis Rabbah 70:13).<br><br>ותגד לאביה AND SHE TOLD HER FATHER, because her mother was dead and she had no one to tell except him (Bereishit Rabbah 70:13)."}, {"ch": 29, "v": 13, "aliyah": 2, "heb": "וַיְהִי֩ כִשְׁמֹ֨עַ לָבָ֜ן אֶת־שֵׁ֣מַע&thinsp;<b>׀<\/b> יַעֲקֹ֣ב בֶּן־אֲחֹת֗וֹ וַיָּ֤רׇץ לִקְרָאתוֹ֙ וַיְחַבֶּק־לוֹ֙ וַיְנַשֶּׁק־ל֔וֹ וַיְבִיאֵ֖הוּ אֶל־בֵּית֑וֹ וַיְסַפֵּ֣ר לְלָבָ֔ן אֵ֥ת כׇּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃", "onk": "וַהֲוָה כַּד שְׁמַע לָבָן יָת שֵׁמַע יַעֲקֹב בַּר אֲחָתֵיהּ וּרְהַט לְקַדָּמוּתֵיהּ וְגַפֵּף לֵיהּ וְנַשִּׁיק לֵיהּ וְאַעֲלֵיהּ לְבֵיתֵיהּ וְאִשְׁתָּעִי לְלָבָן יָת כָּל פִּתְגָּמַיָּא הָאִלֵּין:", "onk_en": "When Lavan heard the news of Yaakov, his sister’s son, he ran to greet him. He embraced him and kissed him, and brought him to his house. [Yaakov] told Lavan all that had happened.", "pj": "וַהֲוָה כְּמִשְׁמַע לָבָן יַת שְׁמַע גְבוּרְתֵּיהּ וַחֲסִידוּתֵיהּ דְיַעֲקב בַּר אַחֲתֵיהּ הֵיךְ נְסֵיב יַת בְּכֵירוּתָא וְיַת סְדַר בִּרְכָתָא מִן יַד אָחוֹי וְהֵיךְ אִתְגְלֵי לֵיהּ יְיָ בְּבֵית אֵל וְהֵיךְ גָדַר יַת אַבְנָא וְהֵיךְ טָפַת בֵּירָא וּסְלֵיקַת לְאַנְפּוֹי וּרְהַט לִקְדָמוּתֵיהּ וְגָפֵיף לֵיהּ וּנְשֵׁיק לֵיהּ וְאַעֲלֵיהּ לְבֵיתֵיהּ וְתָנֵי לְלָבָן יַת כָּל פִּתְגָמַיָא הָאִילֵין", "pj_en": "And it was when Laban heard the account of the strength and piety of Jakob the son of his sister; how he had taken the birthright and the order of blessing from the hand of his brother, and how the Lord had revealed Himself to him at Bethel; how the stone had been removed, and how the well had upflowed and risen to the brink; he ran to meet him and embrace him, and kissed him and led him into his house; and he related to Laban all these things.", "tj": "", "tj_en": "", "rashi": "<b>וירץ לקראתו.<\/b> כַּסָּבוּר מָמוֹן הוּא טָעוּן, שֶׁהֲרֵי עֶבֶד הַבַּית בָּא לְכָאן בַּעֲשָׂרָה גְמַלִּים טְעוּנִים:<br><br><b>ויחבק.<\/b> כְּשֶׁלֹּא רָאָה עִמּוֹ כְלוּם, אָמַר שֶׁמָּא זְהוּבִים הֵבִיא וְהִנָּם בְּחֵיקוֹ:<br><br><b>וינשק לו.<\/b> אָמַר שֶׁמָּא מַרְגָּלִיוֹת הֵבִיא וְהֵם בְּפִיו, בְּ\"רַ:<br><br><b>ויספר ללבן.<\/b> שֶׁלֹּא בָא אֶלָּא מִתּוֹך אֹנֶס אָחִיו, וְשֶׁנָּטְלוּ מָמוֹנוֹ מִמֶּנּוּ:", "rashi_en": "וירץ לקראתו HE RAN TOWARDS HIM — thinking that he was laden with money, for the servant of that household (Eliezer) had come there with ten camels fully laden (Bereishit Rabbah 70:13).<br><br>ויחבק AND EMBRACED HIM — When he saw that he had nothing with him, he thought, “Perhaps he has brought gold coins and they are hidden away in his bosom!”<br><br>וינשק לו HE KISSED HIM — he thought, “Perhaps he has brought pearls (or precious stones, in general) and they are in his mouth!” (Genesis Rabbah 70:13)<br><br>ויספר ללבן HE TOLD LABAN that he had come only because he was forced to do so by his brother, and that all his money had been taken from him. "}, {"ch": 29, "v": 14, "aliyah": 2, "heb": "וַיֹּ֤אמֶר לוֹ֙ לָבָ֔ן אַ֛ךְ עַצְמִ֥י וּבְשָׂרִ֖י אָ֑תָּה וַיֵּ֥שֶׁב עִמּ֖וֹ חֹ֥דֶשׁ יָמִֽים׃", "onk": "וַאֲמַר לֵיהּ לָבָן בְּרַם <b>קָרִיבִי<\/b> וּבִשְׂרִי אָתְּ וִיתֵיב עִמֵּיהּ יְרַח יוֹמִין:", "onk_en": "Lavan said to him, Nevertheless, you are my bone [<b>relative<\/b>] and flesh. [Yaakov] lived with him for a month.", "pj": "וַאֲמַר לֵיהּ לָבָן בְּרַם קְרִיבִי וְדָמִי לִי אַנְתְּ וִיתֵיב עִמֵיהּ יְרַח יוֹמִין", "pj_en": "And Laban said to him, Truly thou art my near one and my blood; and he dwelt with him a month of days.", "tj": "", "tj_en": "", "rashi": "<b>אך עצמי ובשרי.<\/b> מֵעַתָּה אֵין לִי לְאָסְפְּךָ הַבַּיְתָה, הוֹאִיל וְאֵין בְּיָדְךָ כְלוּם, אֶלָּא מִפְּנֵי קוּרְבָה אֲטַפֵּל בְּךָ חֹדֶש יָמִים, וְכֵן עָשָׂה, וְאַף זוֹ לֹא לְחִנָּם, שֶׁהָיָה רוֹעֶה צֹאנוֹ:", "rashi_en": "אך עצמי ובשרי SURELY THOU ART MY BONE AND MY FLESH — Really, I have no reason to take you into my house, since you have brought nothing with you; but because of our relationship I will put up with you for “the space of a month”. Thus, indeed, he did, but even this was not for nothing, for he tended Laban’s sheep. "}, {"ch": 29, "v": 15, "aliyah": 2, "heb": "וַיֹּ֤אמֶר לָבָן֙ לְיַעֲקֹ֔ב הֲכִי־אָחִ֣י אַ֔תָּה וַעֲבַדְתַּ֖נִי חִנָּ֑ם הַגִּ֥ידָה לִּ֖י מַה־מַּשְׂכֻּרְתֶּֽךָ׃", "onk": "וַאֲמַר לָבָן לְיַעֲקֹב הֲמִדְּאָחִי אַתְּ וְתִפְלְחִנַּנִי מַגָּן חַוִּי לִי מָה אַגְרָךְ:", "onk_en": "Lavan said to Yaakov, Just because you are my relative, must you work for me without pay? Tell me, [what should] your wages [be]?", "pj": "וַאֲמַר לָבָן לְיַעֲקב הַמִדְאָחִי אַנְתְּ חָשִׁיב וְתִפְלְחִינַנִי מַגַן תַּנִי לִי מַן יְהִי אַגְרָךְ", "pj_en": "And Laban said to Jakob, Though thou art reputed my brother, shouldst thou serve me for nothing? Tell me, what shall be thy wages?", "tj": "", "tj_en": "", "rashi": "<b>הכי אחי אתה.<\/b> לְשׁוֹן תֵּמַהּ, וְכִי בִּשְׁבִיל שֶׁאָחִי אַתָּה תַּעַבְדֵנִי חִנָּם:<br><br><b>ועבדתני.<\/b> כְּמוֹ וְתַעַבְדֵנִי; וְכֵן כָּל תֵּבָה שֶׁהִיא לְשׁוֹן עָבָר הוֹסִיף וָי\"ו בְּרֹאשָׁהּ, וְהִיא הוֹפֶכֶת הַתֵּבָה לְהַבָּא:", "rashi_en": "הכי אחי אתה This is a question: — IS IT BECAUSE THOU ART MY BROTHER THAT THOU SHOULDST SERVE ME FOR NOUGHT?<br><br>ועבדתני is the same in sense as ותעבדני THAT THOU SHOULDST SERVE ME. So, too, in the case of every verb in the past tense, if one adds as prefix a ו it may change the verb to the future."}, {"ch": 29, "v": 16, "aliyah": 2, "heb": "וּלְלָבָ֖ן שְׁתֵּ֣י בָנ֑וֹת שֵׁ֤ם הַגְּדֹלָה֙ לֵאָ֔ה וְשֵׁ֥ם הַקְּטַנָּ֖ה רָחֵֽל׃", "onk": "וּלְלָבָן תַּרְתֵּין בְּנָן שׁוּם רַבְּתָא לֵאָה וְשׁוּם זְעֶרְתָּא רָחֵל:", "onk_en": "Lavan had two daughters. The name of the older one was Leah, and the name of the younger one was Rochel.", "pj": "וּלְלָבָן הֲווֹן תַּרְתֵּין בְּנָן שׁוּם רַבְּתָא לֵאָה וְשׁוּם זְעִירְתָּא רָחֵל", "pj_en": "And Laban had two daughters, the name of the elder Leah, and the name of the younger Rahel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 17, "aliyah": 2, "heb": "וְעֵינֵ֥י לֵאָ֖ה רַכּ֑וֹת וְרָחֵל֙ הָֽיְתָ֔ה יְפַת־תֹּ֖אַר וִיפַ֥ת מַרְאֶֽה׃", "onk": "וְעֵינֵי לֵאָה <b>יָאֲיָן<\/b> וְרָחֵל הֲוַת שַׁפִּירָא בְרֵיוָא וְיָאֲיָא בְחֶזְוָא:", "onk_en": "The eyes of Leah were tender [<b>beautiful<\/b>]. Rochel was of beautiful form and of beautiful appearance.", "pj": "וְעֵינֵי לֵאָה הֲוַון צִירְנַיְיתָן דִבַכְיָא וּבָעֲיָא מִן קֳדָם יְיָ דְלָא יַזְמָן לָהּ לְעֵשָו רַשִׁיעָא וְרָחֵל הֲוַות יָאַיָא בְּרֵיוָא וְשַׁפִּירָא בְּחֵיזְוָא", "pj_en": "And the eyes of Leah were moist, (or dropping, running,) from weeping and praying before the Lord that he would not destine her for Esau the wicked; and Rahel was beautiful in appearance, and of a fair countenance.", "tj": "וְעֵינֵי דְלֵאָה הֲוָון רַכִּיכַן עַל דַהֲוַת בַּכְיָא וּמַצְלָא דְלָא תִיסוּק בְּמַזְלֵיהּ דְעֵשָו וְרָחֵל הֲוָת יָיָא בְּרֵיוָא וְשַׁפִּירָא בְּחֶזְוָא:", "tj_en": "And the eyes of Leah were tender, for she had wept and prayed that she might not be brought up in the lot of Esau; and Rahel was beautiful in appearance, and of fair countenance.", "rashi": "<b>רכות.<\/b> שֶׁהָיְתָה סְבוּרָה לַעֲלוֹת בְּגוֹרָלוֹ שֶׁל עֵשָׂו וּבוֹכָה, שֶׁהָיוּ הַכֹּל אוֹמְרִים שְׁנֵי בָנִים לְרִבְקָה וּשְׁתֵּי בָנוֹת לְלָבָן, הַגְּדוֹלָה לַגָּדוֹל וְהַקְּטַנָּה לַקָּטָן (בבא בתרא קכ\"ג):<br><br><b>תאר.<\/b> הוּא צוּרַת הַפַּרְצוּף, לְשׁוֹן יְתָאֲרֵהוּ בַשֶּׂרֶד: (ישעיהו מ\"ד, י\"ג), קונ\"פאש בלע\"ז:<br><br><b>מראה.<\/b> הוּא זִיו קְלַסְתֵּר:", "rashi_en": "רכות TENDER — She thought she would have to fall to the lot of Esau and she therefore wept continually, because everyone said, “Rebekah has two sons, Laban has two daughters — the elder daughter for the elder son, the younger daughter for the younger son” (Genesis Rabbah 70:16).<br><br>תאר FORM — this denotes the shape (outline) of the face, just as the verb formed from the same root in (Isaiah 44:13) “he marks it out (יתארחו) with a pencil” old French compas.<br><br>מראה OF BEAUTIFUL APPEARANCE — this denotes the beauty of her features (a good complexion)."}, {"ch": 29, "v": 18, "aliyah": 3, "heb": "וַיֶּאֱהַ֥ב יַעֲקֹ֖ב אֶת־רָחֵ֑ל וַיֹּ֗אמֶר אֶֽעֱבׇדְךָ֙ שֶׁ֣בַע שָׁנִ֔ים בְּרָחֵ֥ל בִּתְּךָ֖ הַקְּטַנָּֽה׃", "onk": "וּרְחֵם יַעֲקֹב יָת רָחֵל וַאֲמַר אֶפְלְחִנָּךְ שְׁבַע שְׁנִין בְּרָחֵל בְּרַתָּךְ זְעֶרְתָּא:", "onk_en": "Yaakov loved Rochel. and he said, I will work for you seven years for Rochel, your younger daughter.", "pj": "וּרְחַם יַעֲקב יַת רָחֵל וַאֲמַר אֶפְלְחִינָךְ שֵׁב שְׁנִין בְּגִין רָחֵל בְּרַתָּךְ זְעֵירְתָּא", "pj_en": "And Jakob loved Rahel; and he said, I will serve thee seven years for Rahel thy Younger daughter.", "tj": "", "tj_en": "", "rashi": "<b>אעבדך שבע שנים.<\/b> הֵם יָמִים אֲחָדִים שֶׁאָמְרָה לוֹ אִמּוֹ וְיָשַׁבְתָּ עִמּוֹ יָמִים אֲחָדִים (בראשית רבה); וְתֵדַע שֶׁכֵּן הוּא, שֶׁהֲרֵי כְתִיב וַיִּהְיוּ בְעֵינָיו כְּיָמִים אֲחָדִים (בראשית כ\"ט):<br><br><b>ברחל בתך הקטנה.<\/b> כָּל הַסִּימָנִים הַלָּלוּ לָמָּה? לְפִי שֶׁהוּא יוֹדֵעַ בּוֹ שֶׁהוּא רַמַּאי, אָמַר לוֹ, אֶעֱבָדְךָ בְרָחֵל, וְשֶׁמָּא תֹּאמַר רָחֵל אֲחֶרֶת מִן הַשּׁוּק, תַּלְמוּד לוֹמַר בִּתְּךָ, וְשֶׁמָּא תֹּאמַר אַחֲלִיף לְלֵאָה שְׁמָהּ וְאֶקְרָא שְׁמָהּ רָחֵל, תַּלְמוּד לוֹמַר הַקְּטַנָּה; וְאַף עַל פִּי כֵן לֹא הוֹעִיל, שֶׁהֲרֵי רִמָּהוּ:", "rashi_en": "אעבדך שבע שנים I WILL SERVE THEE SEVEN YEARS — These are the “few days” of which his mother had spoken to him (27:44)): “And thou shalt tarry with him a few days”. You can see that this is so, for it is written (v. 20) “And they (the seven years) were in his eyes (i.e. according to his view) the few days” of which his mother had spoken (Genesis Rabbah 70:17).<br><br>ברחל בתך הקטנה (literally, for Rachel, thy daughter, the younger one) — What reason was there for mentioning all these detailed descriptions of Rachel? Because he (Jacob) knew that he (Laban) was a deceiver. He said to him, “I will serve thee for Rachel”: and should you say that I mean any other Rachel out of the street, therefore I say “your daughter”. Should you say, “I will change Leah’s name and call her Rachel”, I say “your younger one”. In spite of this, however, all these precautions did not avail, for he did actually deceive him (Genesis Rabbah 70:17). "}, {"ch": 29, "v": 19, "aliyah": 3, "heb": "וַיֹּ֣אמֶר לָבָ֗ן ט֚וֹב תִּתִּ֣י אֹתָ֣הּ לָ֔ךְ מִתִּתִּ֥י אֹתָ֖הּ לְאִ֣ישׁ אַחֵ֑ר שְׁבָ֖ה עִמָּדִֽי׃", "onk": "וַאֲמַר לָבָן טַב דְּאֶתֵּן יָתַהּ לָךְ מִדְּאֶתֵּן יָתַהּ לִגְבַר אָחֳרָן תִּיב עִמִּי:", "onk_en": "Lavan said, Better that I give her to you than I should give her to another man. [Remain] living with me.", "pj": "וַאֲמַר לָבָן בִּרְמִיוּ טַב דְאֶתֵּן יָתָהּ לָךְ מִן דְאֶתֵּן יָתָהּ לִגְבַר אוֹחֲרָן תִּיב עִמִי", "pj_en": "And Laban said with deceit, It is better that I give her to thee, than to another man abide with me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 20, "aliyah": 3, "heb": "וַיַּעֲבֹ֧ד יַעֲקֹ֛ב בְּרָחֵ֖ל שֶׁ֣בַע שָׁנִ֑ים וַיִּהְי֤וּ בְעֵינָיו֙ כְּיָמִ֣ים אֲחָדִ֔ים בְּאַהֲבָת֖וֹ אֹתָֽהּ׃", "onk": "וּפְלַח יַעֲקֹב בְּרָחֵל שְׁבַע שְׁנִין וַהֲווֹ בְעֵינוֹהִי כְּיוֹמִין זְעִירִין כַּד רְחֵים יָתַהּ:", "onk_en": "Yaakov worked seven years for Rochel, but they seemed to him like a few days, so much did he love her.", "pj": "וּפְלַח יַעֲקב בְּגִין רָחֵל שֵׁב שְׁנִין וַהֲווֹ דַמְיַין בְּעֵינוֹי כְּיוֹמִין קַלִילִין מִדְרָחִים יָתָהּ", "pj_en": "And Jakob served for Rahel seven years; and they seemed in his eyes as a few days, because he loved her.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 21, "aliyah": 3, "heb": "וַיֹּ֨אמֶר יַעֲקֹ֤ב אֶל־לָבָן֙ הָבָ֣ה אֶת־אִשְׁתִּ֔י כִּ֥י מָלְא֖וּ יָמָ֑י וְאָב֖וֹאָה אֵלֶֽיהָ׃", "onk": "וַאֲמַר יַעֲקֹב לְלָבָן הַב יָת אִתְּתִי אֲרֵי אַשְׁלֵמִית יוֹמֵי <b>פָלְחָנִי<\/b> וְאֵעוֹל לְוָתַהּ:", "onk_en": "Yaakov said to Lavan, Give me my wife, for my term [<b>of labor<\/b>] is completed; and thus I will consummate the marriage with her.", "pj": "וַאֲמַר יַעֲקב לְלָבָן הַב יַת אִנְתְּתִי אֲרוּם אַשְׁלִימוּ יוֹמֵי פּוּלְחָנִי וְאֵיעוֹל לְוָותָהּ", "pj_en": "And Jakob said to Laban, Give me my wife: for the days of my service are completed, and I will go in with her.", "tj": "", "tj_en": "", "rashi": "<b>מלאו ימי.<\/b> שֶׁאָמְרָה לִי אִמִּי, וְעוֹד מָלְאוּ יָמַי, שֶׁהֲרֵי אֲנִי בֶן פ\"ד שָׁנָה וְאֵימָתַי אַעֲמִיד י\"ב שְׁבָטִים? וְזֶהוּ שֶׁאָמַר וְאָבוֹאָה אֵלֶיהָ, וְהֲלֹא קַל שֶׁבַּקַּלִּים אֵינוֹ אוֹמֵר כֵּן? אֶלָּא לְהוֹלִיד תּוֹלָדוֹת אָמַר כֵּן:", "rashi_en": "מלאו ימי MY DAYS ARE FULFILLED — which my mother told me to remain with you. And another explanation is: MY DAYS ARE FULFILLED for I am now eighty-four years old and when shall I beget twelve tribes? That is what he meant by adding “that I may go in unto her”; for surely even the commonest of people would not use such an expression. But he said this because his mind was intent upon having issue (to fulfil his mission of rearing children who would carry on the religious traditions of his fathers) (Genesis Rabbah 70:18). "}, {"ch": 29, "v": 22, "aliyah": 3, "heb": "וַיֶּאֱסֹ֥ף לָבָ֛ן אֶת־כׇּל־אַנְשֵׁ֥י הַמָּק֖וֹם וַיַּ֥עַשׂ מִשְׁתֶּֽה׃", "onk": "וּכְנַשׁ לָבָן יָת כָּל אֲנָשֵׁי אַתְרָא וַעֲבַד מִשְׁתְּיָא:", "onk_en": "Lavan gathered all the local people and he made a [wedding] feast.", "pj": "וּכְנַשׁ לָבָן יַת כָּל אִינְשֵׁי אַתְרָא וְעָבַד לְהוֹן שֵׁירוּי עָנֵי וַאֲמַר לְהוֹם הָא שֵׁב שְׁנִין דְאָתָא יַעֲקב גַבָּן בֵּירָא לָא חָסְרוּ וּבֵית שַׁקְיוּתָן סְגוֹ וּכְדוּן אִיתוּ נִתְיְעַט עֲלֵיהּ עֵיטָא דְרַמִיוּ דִי יַמְתַּן לְגַבָּן וַעֲבָדוּ לֵיהּ עֵיטָא דְרַמְיוּ לְאַתְאָבָא לֵיהּ לֵאָה חוֹלַף רָחֵל", "pj_en": "And Laban gathered all the men of the place, and made them a feast. Answering he said to them, Behold, seven years since Jakob came to us the wells have not failed and the watered places are multiplied: and now come, let us counsel against him cunning counsel, that he may remain with us. And they gave him cunning counsel that he should take Leah to him instead of Rahel.", "tj": "וּכְנַשׁ לָבָן יַת כָּל עַמָא דְאַתְרָא וַעֲבַד שֵׁירוּי עָנֵי לָבָן וַאֲמַר לְהוֹן הָא שְׁבַע שְׁנִין אִית לֵיהּ לְגַבְרָא צַדִיקָא הָדֵין מִן דַאֲתָא לְוָותָן שַׁקְוָותָן לָא חָסְרוּ וּמַבּוּעִינָן סַגְיָין וּכְדוּן אָתוּן הָבוּ לִי עֵצָה דְנִכְבּוֹש יָתֵיהּ גַבָּן עוֹד שְׁבַע שְׁנִין וִיהָבוּ לֵיהּ עֵצָה דִרְמִיוּ לְמִסְבָהּ לֵיהּ לְלֵאָה חֲלַף רָחֵל:", "tj_en": "And Laban gathered all the people of the place, and made a feast. And Laban answered and said to them, Behold seven years are from the coming of this just man to us; our waterings have not failed, and our springs are many: and now come, give me counsel how we may settle (or subject) him among us yet seven years. And they gave him cunning counsel to take Leah to him instead of Rahel.", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 23, "aliyah": 3, "heb": "וַיְהִ֣י בָעֶ֔רֶב וַיִּקַּח֙ אֶת־לֵאָ֣ה בִתּ֔וֹ וַיָּבֵ֥א אֹתָ֖הּ אֵלָ֑יו וַיָּבֹ֖א אֵלֶֽיהָ׃", "onk": "וַהֲוָה בְרַמְשָׁא וּדְבַר יָת לֵאָה בְרַתֵּיהּ וְאָעֵיל יָתַהּ לְוָתֵיהּ וְעַל לְוָתַהּ:", "onk_en": "When it was evening, he took Leah, his daughter, and brought her to him [Yaakov]. He consummated the marriage with her.", "pj": "וַהֲוָה בְרַמְשָׁא וּדְבַר יַת לֵאָה בְּרַתֵּיהּ וְאָעֵיל יָתָהּ לְוָתֵיהּ וְעַל לְוָותָהּ", "pj_en": "And it was in the evening that he brought Leah his daughter, and introduced her to him, and he went in with her.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 24, "aliyah": 3, "heb": "וַיִּתֵּ֤ן לָבָן֙ לָ֔הּ אֶת־זִלְפָּ֖ה שִׁפְחָת֑וֹ לְלֵאָ֥ה בִתּ֖וֹ שִׁפְחָֽה׃", "onk": "וִיהַב לָבָן לַהּ יָת זִלְפָּה אַמְתֵיהּ לְלֵאָה בְרַתֵּיהּ לְאַמְהוּ:", "onk_en": "Lavan gave Zilpah, his servant to her, to Leah, his daughter as a handmaid.", "pj": "וִיהַב לָבָן לֵיהּ יַת זִלְפָּה בְּרַתֵּיהּ דִילֵידַת לֵיהּ פְּלַקְתֵּיהּ וּמָסְרָה לְלֵאָה בְּרַתֵּיהּ לְאַמְהוּ", "pj_en": "And Laban gave to him Zilpha his daughter, whom his concubine had borne to him, and he delivered her to Leah his daughter to be her handmaid.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 25, "aliyah": 3, "heb": "וַיְהִ֣י בַבֹּ֔קֶר וְהִנֵּה־הִ֖וא לֵאָ֑ה וַיֹּ֣אמֶר אֶל־לָבָ֗ן מַה־זֹּאת֙ עָשִׂ֣יתָ לִּ֔י הֲלֹ֤א בְרָחֵל֙ עָבַ֣דְתִּי עִמָּ֔ךְ וְלָ֖מָּה רִמִּיתָֽנִי׃", "onk": "וַהֲוָה בְצַפְרָא וְהָא הִיא לֵאָה וַאֲמַר לְלָבָן מָה דָא עֲבַדְתָּ לִּי הֲלָא בְרָחֵל פְּלָחִית עִמָּךְ וּלְמָא שַׁקַּרְתָּ בִּי:", "onk_en": "When it was morning, behold it was Leah! He [Yaakov] said to Lavan, What have you done to me? Did I not work with you for Rochel? Why did you deceive me?", "pj": "וַהֲוָה לְעִידוּנֵי צַפְרָא וְאִסְתַּכֵּל בָּהּ וְהָא הִיא לֵאָה דְכוּלָה לֵילְיָא הֲוָה חָשִׁיב דְרָחֵל הִיא מִן בִּגְלַל דְמָסְרַת לָהּ רָחֵל כָּל מִלַיָא דְמָסַר לָהּ יַעֲקב וְכַד חָמָא כֵּן אָמַר לְלָבָן מַה דָא עָבַדְתְּ לִי הֲלָא בְּגִין רָחֵל פְּלָחִית עִמָךְ וּלְמָא שָׁקַרְתְּ בִּי", "pj_en": "And it was the time of the morning and he saw her, and behold, she was Leah, whom all the night he had thought to be Rahel; because Rahel had delivered to her all the things with which Jakob had presented her. But when he saw this, he said to Laban, what is this that thou hast done to me? Was it not for Rahel that I served with thee? Why hast thou deceived me?", "tj": "", "tj_en": "", "rashi": "<b>ויהי בבקר והנה היא לאה.<\/b> אֲבָל בַּלַּיְלָה לֹא הָיְתָה לֵאָה, לְפִי שֶׁמָּסַר יַעֲקֹב סִימָנִים לְרָחֵל, וּכְשֶׁרָאֲתָה רָחֵל שֶׁמַּכְנִיסִין לוֹ לֵאָה אָמְרָה: עַכְשָׁו תִּכָּלֵם אֲחוֹתִי, עָמְדָה וּמָסְרָה לָהּ אוֹתָן סִימָנִים (מגילה י\"ג):", "rashi_en": "ויהי בבקר והנה הוא לאה AND IT CAME TO PASS, THAT IN THE MORNING, BEHOLD, IT WAS LEAH —But at night it was not Leah (i. e. he failed to recognise that it was Leah) because Jacob had given Rachel certain secret signs by which they could at all times recognise one another, and when Rachel saw that they were about to bring Leah to him for the marriage ceremony, she thought, “My sister may now be put to shame”, and she therefore readily transmitted these signs to her (Megillah 13b). "}, {"ch": 29, "v": 26, "aliyah": 3, "heb": "וַיֹּ֣אמֶר לָבָ֔ן לֹא־יֵעָשֶׂ֥ה כֵ֖ן בִּמְקוֹמֵ֑נוּ לָתֵ֥ת הַצְּעִירָ֖ה לִפְנֵ֥י הַבְּכִירָֽה׃", "onk": "וַאֲמַר לָבָן לָא אִתְעֲבֵד כְּדֵין בְּאַתְרָנָא לְמִתַּן זְעֶרְתָּא קֳדָם רַבְּתָא:", "onk_en": "Lavan said, It is not done so in our place, to give the younger [daughter in marriage] before the firstborn.", "pj": "וַאֲמַר לָבָן לָא מִתְעֲבֵיד כְּדֵין בְּאַתְרִין לְמִיתַּן זְעֵירְתָּא קֳדָם רַבְּתָא", "pj_en": "And Laban said, It is not so done in our place, to give the younger before the elder.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 27, "aliyah": 3, "heb": "מַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וְנִתְּנָ֨ה לְךָ֜ גַּם־אֶת־זֹ֗את בַּעֲבֹדָה֙ אֲשֶׁ֣ר תַּעֲבֹ֣ד עִמָּדִ֔י ע֖וֹד שֶֽׁבַע־שָׁנִ֥ים אֲחֵרֽוֹת׃", "onk": "אַשְׁלִים שְׁבוּעֲתָא דְדָא וְנִתֵּן לָךְ אַף יָת דָּא בְּפָלְחָנָא דִּי תִפְלַח עִמִּי עוֹד שְׁבַע שְׁנִין אָחֳרָנִין:", "onk_en": "Complete the [marriage] week for this one. We will then give you the other also—in return for the work that you will do with me for another seven years.", "pj": "אַשְׁלִים כְּדוּן שִׁבְעָתֵי יוֹמֵי מִשְׁתַּיָא דְדָא וְנִיתַּן לָךְ אוּף יַת דָא בְּפוּלְחָנָא דְתִפְלַח עִמִי תוּב שֵׁב שְׁנִין אוֹחֲרָנִין", "pj_en": "Fulfil now the seven days of the feast of this, and I will give thee also that for the service which thou shalt serve with me yet seven other years.", "tj": "אַשְׁלִים שִׁבְעָתֵי יוֹמֵי מִשְׁתּוּתָא דְלֵאָה וְאֶתֵּן:", "tj_en": "Fulfil the seven days of this feast of Leah, and I will give.", "rashi": "<b>מלא שבע זאת.<\/b> דָּבוּק הוּא, שֶׁהֲרֵי נָקוּד בַּחֲטָף, שָׁבוּעַ שֶׁל זֹאת, וְהֵן שִׁבְעַת יְמֵי הַמִּשְׁתֶּה, בְּתַלְמוּד יְרוּשׁ' בְּמוֹעֵד קָטָן (וְאִ\"אֶ לוֹמַר שָׁבוּעַ מַמָּשׁ, שֶׁאִם כֵּן הָיָה צָרִיךְ לְהִנָּקֵד בְּפַתָּח הַשִּׁי\"ן; וְעוֹד שֶׁשָּׁבוּעַ לְשׁוֹן זָכָר, כְּדִכְתִיב שִׁבְעָה שָׁבֻעֹת תִּסְפָּר לָךְ, לְפִיכָךְ אֵין מַשְׁמַע שָׁבוּעַ אֶלָּא שִׁבְעָה, שטיי\"נא בְּלַעַז):<br><br><b>ונתנה לך.<\/b> לְשׁוֹן רַבִּים, כְּמוֹ נֵרְדָה וְנָבְלָה וְנִשְׂרְפָה (בראשית י\"א), אַף זֶה לְשׁוֹן וְנִתֵּן:<br><br><b>גם את זאת.<\/b> מִיָּד לְאַחַר שִׁבְעַת יְמֵי הַמִּשְׁתֶּה, וְתַעֲבֹד לְאַחַר נִשּׂוּאֶיהָ:", "rashi_en": "מלא שבע זאת FULFIL THE WEEK OF THIS ONE — The word is in the construct state for it is punctuated with Sheva, so that the meaning is “the seven days of this woman”, referring to the seven days of the marriage feast. Such is the statement in the Talmud Yerushalmi Moed Katan 1:7. It is impossible to say that it means an actual week, (i. e. a calendar week), so that it would mean “finish this week” in the sense “wait until this week be ended”) — for, if so, the ש should be punctuated with Patach (Rashi terms our Kametz a Patach) for the noun must be in the absolute state. Then, again, the word שָׁבֻעַ is masculine — as it is written (Deuteronomy 16:9) “Seven (שבעה) weeks shalt thou number unto thyself” (and here we should have had שָׁבֻעַ זֶה). Consequently the word שבוע can only mean “a period of seven days” old French septaine (cf. Rashi on Exodus 10:22).<br><br>ונתנה לך AND WE WILL GIVE THEE — The verb is plural 1st pers. like (נרדה) (Genesis 11:7) “let us go down”, ונבלה “and let us confuse and (Genesis 11:3) ונשרפה “and let us burn\": so, also here, it is a form of וְנִתֵּן “and we will give”.<br><br>גם את זאת THIS ONE ALSO we shall give to you immediately after the seven days of the marriage-feast and you may serve for her after marriage with her. "}, {"ch": 29, "v": 28, "aliyah": 3, "heb": "וַיַּ֤עַשׂ יַעֲקֹב֙ כֵּ֔ן וַיְמַלֵּ֖א שְׁבֻ֣עַ זֹ֑את וַיִּתֶּן־ל֛וֹ אֶת־רָחֵ֥ל בִּתּ֖וֹ ל֥וֹ לְאִשָּֽׁה׃", "onk": "וַעֲבַד יַעֲקֹב כֵּן וְאַשְׁלֵים שְׁבוּעֲתָא דְדָא וִיהַב לֵיהּ יָת רָחֵל בְּרַתֵּיהּ לֵיהּ לְאִנְתּוּ:", "onk_en": "Yaakov did so, and he completed the [marriage] week for this one [Leah]. He [Lavan] then gave Rochel, his daughter to him as a wife.", "pj": "וְעָבַד יַעֲקב כְּדֵין וְאַשְׁלִים שִׁבְעָתֵי יוֹמֵי מִשְׁתַּיָא דְלֵאָה וִיהַב לֵיהּ יַת רָחֵל בְּרַתֵּיהּ לְאִנְתּוּ", "pj_en": "And Jakob did so, and fulfilled the seven days of the feast of Leah, and he gave him Rahel his daughter to wife.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 29, "aliyah": 3, "heb": "וַיִּתֵּ֤ן לָבָן֙ לְרָחֵ֣ל בִּתּ֔וֹ אֶת־בִּלְהָ֖ה שִׁפְחָת֑וֹ לָ֖הּ לְשִׁפְחָֽה׃", "onk": "וִיהַב לָבָן לְרָחֵל בְּרַתֵּיהּ יָת בִּלְהָה אַמְתֵיהּ לַהּ לְאַמְהוּ:", "onk_en": "To his daughter, Rochel, Lavan gave his servant Bilhah, to be her handmaid.", "pj": "וִיהַב לָבָן לְרָחֵל בְּרַתֵּיהּ יַת בִּלְהָה בְּרַתֵּיהּ דִילִידַת לֵיהּ פִּילְקָתֵיהּ וּמַסְרָהּ לָהּ לְאַמְהוּ", "pj_en": "And Laban gave to Rahel his daughter Bilhah, whom his concubine bare him, and he delivered her unto her to be her handmaid.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 30, "aliyah": 3, "heb": "וַיָּבֹא֙ גַּ֣ם אֶל־רָחֵ֔ל וַיֶּאֱהַ֥ב גַּֽם־אֶת־רָחֵ֖ל מִלֵּאָ֑ה וַיַּעֲבֹ֣ד עִמּ֔וֹ ע֖וֹד שֶֽׁבַע־שָׁנִ֥ים אֲחֵרֽוֹת׃", "onk": "וְעַל אַף לְוַת רָחֵל וּרְחֵים אַף יָת רָחֵל מִלֵּאָה וּפְלַח עִמֵּיהּ עוֹד שְׁבַע שְׁנִין אָחֳרָנִין:", "onk_en": "He [Yaakov] also consummated his marriage with Rochel. He loved Rochel more than Leah, and he worked with [Lavan] additionally, another seven years.", "pj": "וְעַל אוּף לְוַת רָחֵל וְרָחֵים אוּף יַת רָחֵל מִלֵאָה וּפְלַח עִמֵיהּ בְּגִינָהּ תּוּב שֵׁב שְׁנִין אוֹחֲרָנִין", "pj_en": "And he went in also unto Rahel; and he loved Rahel also more than Leah. And he served with him for her yet seven other years.", "tj": "", "tj_en": "", "rashi": "<b>עוד שבע שנים אחרות.<\/b> אֲחֵרוֹת הִקִּישָׁן לָרִאשׁוֹנוֹת, מָה רִאשׁוֹנוֹת בֶּאֱמוּנָה אַף הָאַחֲרוֹנוֹת בֶּאֱמוּנָה, וְאַעַ\"פִּ שֶׁבְּרַמָּאוּת בָּא עָלָיו (בראשית רבה):", "rashi_en": "עוד שבע שנים אחרות YET SEVEN OTHER YEARS — Scripture adds the apparently redundant word אחרות another seven years, for the purpose of comparing them to the preceding seven years. — Even as he had worked faithfully during the earlier period (not anticipating any deception on Laban’s part), so he worked faithfully during the latter period, although he (Laban) had practised this deception on him (Genesis Rabbah 70:20). "}, {"ch": 29, "v": 31, "aliyah": 3, "heb": "וַיַּ֤רְא יְהֹוָה֙ כִּֽי־שְׂנוּאָ֣ה לֵאָ֔ה וַיִּפְתַּ֖ח אֶת־רַחְמָ֑הּ וְרָחֵ֖ל עֲקָרָֽה׃", "onk": "וַחֲזָא יְיָ אֲרֵי שְׂנִיאֲתָא לֵאָה <b>וִיהַב לַהּ עִדּוּי<\/b> וְרָחֵל עַקְרָא:", "onk_en": "Adonoy saw that Leah was the hated one, and He opened her womb [<b>allowed her to conceive<\/b>]. Rochel remained barren.", "pj": "וּגְלֵי קֳדָם יְיָ אֲרוּם לָא הֲוַת לֵאָה רְחִימְתָּא בְּאַנְפֵּי יַעֲקב וַאֲמַר בְּמֵימְרֵיה לְמִיתַּן לָהּ בְּנִין וְרָחֵל הֲוַת עַקְרָה", "pj_en": "And it was revealed before the Lord that Leah was not loved in the sight of Jakob; and He said in His Word that sons should be given her, and that Rahel should be barren.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 32, "aliyah": 3, "heb": "וַתַּ֤הַר לֵאָה֙ וַתֵּ֣לֶד בֵּ֔ן וַתִּקְרָ֥א שְׁמ֖וֹ רְאוּבֵ֑ן כִּ֣י אָֽמְרָ֗ה כִּֽי־רָאָ֤ה יְהֹוָה֙ בְּעׇנְיִ֔י כִּ֥י עַתָּ֖ה יֶאֱהָבַ֥נִי אִישִֽׁי׃", "onk": "וְעַדִּיאַת לֵאָה וִילִידַת בָּר וּקְרַת שְׁמֵיהּ רְאוּבֵן אֲרֵי אֲמֶרֶת אֲרֵי <b>גְלִי קֳדָם יְיָ<\/b> עֻלְבּוֹנִי אֲרֵי כְעַן יִרְחֲמִנַּנִי בַעְלִי:", "onk_en": "Leah conceived and gave birth to a son. She named him Reuvein, as she said, Adonoy has seen my affliction [<b>was revealed before Adonoy<\/b>]; for now my husband will love me.", "pj": "וְאִתְעֲבָּרַת לֵאָה וִילֵידַת בַּר וּקְרַת יַת שְׁמֵיהּ רְאוּבֵן אֲרוּם גְלֵי קֳדָם יְיָ עוּלְבָּנִי אֲרוּם כְּדוּן יְרַחֲמִינַנִי בַּעֲלִי וְהֵיכְמָא דְאִתְגְלֵי קֳדָם יְיָ עוּלְבָּנִי הֵיכְדֵין יֶהֱוֵי גְלֵי קֳדָמוֹי עוּלְבַּנְהוֹן דְבָנַי כַּד יְהוֹן מִשְׁתַּעְבְּדִין בְּאַרְעָא דְמִצְרָאֵי", "pj_en": "And Leah conceived and bare a son, and called his name Reuben: for she said, My affliction was manifest before the Lord, therefore now will my husband love me; for my affliction hath been manifested before the Lord as will be the affliction of my children before the Lord when they shall be enslaved in the land of the Mizraee.", "tj": "", "tj_en": "", "rashi": "(<b>ותקרא שמו ראובן<\/b> רַבּוֹתֵינוּ פֵּרְשׁוּ, אָמְרָה רְאוּ מַה בֵּין בְּנִי לְבֶן חָמִי שֶׁמָּכַר הַבְּכוֹרָה לְיַעֲקֹב, וְזֶה לֹא מְכָרָהּ לְיוֹסֵף וְלֹא עִרְעֵר עָלָיו, וְלֹא עוֹד שֶׁלֹּא עִרְעֵר עָלָיו אֶלָּא שֶׁבִּקֵּשׁ לְהוֹצִיאוֹ מִן הַבּוֹר) (ברכות ז'):", "rashi_en": "ותקרא שמו ראובן AND SHE CALLED HIS NAME REUBEN — Our Rabbis explained it thus: she said, “See (ראו) the difference between (בין) my son and my father-in-law’s son who himself sold the birthright to Jacob and yet wished to kill h
