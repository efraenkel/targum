<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 6, "v": 2, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר אֱלֹהִ֖ים אֶל־מֹשֶׁ֑ה וַיֹּ֥אמֶר אֵלָ֖יו אֲנִ֥י יְהֹוָֽה׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וַאֲמַר לֵיהּ אֲנָא יְיָ:", "onk_en": "Elohim spoke to Moshe and said to him, “I am Adonoy.", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה וַאֲמַר לֵיהּ אֲנָא יְיָ הוּא דְאִתְגְלֵיתִי עֲלָךְ בְּגוֹ סַנְיָא וַאֲמָרִית לָךְ אֲנָא יְיָ", "pj_en": "AND the Lord spake with Mosheh, and said to him, I am the Lord who revealed Myself to thee in the midst of the bush, and said to thee, I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>וידבר אלהים אל משה.<\/b> דִּבֵּר אִתּוֹ מִשְׁפָּט, עַל שֶׁהִקְשָׁה לְדַבֵּר וְלוֹמַר \"לָמָה הֲרֵעֹתָה לָעָם הַזֶּה\":<br><br><b>ויאמר אליו אני ה'.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר טוֹב לַמִּתְהַלְּכִים לְפָנַי, וְלֹא לְחִנָּם שְׁלַחְתִּיךָ כִּי אִם לְקַיֵּם דְּבָרִי שֶׁדִּבַּרְתִּי לָאָבוֹת הָרִאשׁוֹנִים. וּבַלָּשׁוֹן הַזֶּה מָצִינוּ שֶׁהוּא נִדְרָשׁ בְּכַמָּה מְקוֹמוֹת אֲנִי ה' נֶאֱמָן לְהִפָּרַע – כְּשֶׁהוּא אָמוּר אֵצֶל עֹנֶשׁ – כְּגוֹן \"וְחִלַּלְתָּ אֶת שֵׁם אֱלֹהֶיךָ אֲנִי ה'\" (ויקרא י״ט:י״ב), וּכְשֶׁהוּא אוֹמֵר אֵצֶל קִיּוּם מִצְווֹת – כְּגוֹן \"וּשְׁמַרְתֶּם מִצְוֹתַי וַעֲשִׂיתֶם אוֹתָם אֲנִי ה'\" (שם כ\"ב) – נֶאֱמָן לִתֵּן שָׂכָר:", "rashi_en": "וידבר אלהים אל משה AND GOD SPOKE UNTO MOSES — He took him to task because he had spoken so censoriously when he said, (Exodus 5:22) “Wherefore hast thou done so evil to this people”.<br><br>ויאמר אליו אני ה׳ AND HE SAID UNTO HIM, I AM THE LORD, Who am faithful to recompense with a full reward those who walk before Me. Nor have I sent you with no purpose in view (cf. 5:22), but to fulfil the promise which I made to the early patriarchs. In this sense we find that the phrase is to be explained in many passages: אני ה׳ signifies, I am the Lord, Who am faithful to exact punishment — when it is spoken in reference to a matter that demands punishment, as, for instance, (Leviticus 19:12) “And thou profanest the name of thy God; I am the Lord”; and when it is spoken in reference to observing the Divine commands — as in, (Leviticus 22:31) “Ye shall keep my commandments and do them; I am the Lord” — it signifies, “I am the Lord Who am faithful to give reward.”"}, {"ch": 6, "v": 3, "aliyah": 1, "heb": "וָאֵרָ֗א אֶל־אַבְרָהָ֛ם אֶל־יִצְחָ֥ק וְאֶֽל־יַעֲקֹ֖ב בְּאֵ֣ל שַׁדָּ֑י וּשְׁמִ֣י יְהֹוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָהֶֽם׃", "onk": "וְאִתְגְּלֵיתִי לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב בְּאֵל שַׁדָּי וּשְׁמִי יְיָ לָא הוֹדָעִית לְהוֹן:", "onk_en": "I revealed Myself to Avraham, to Yitzchok, and to Yaakov as Almighty Shaddai, but My Name Adonoy I did not make known to them.", "pj": "וְאִיתְגְלֵיתִי לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב בְּאֵל שַׁדָי וּשְׁמִי יְיָ בְּרַם בְּאַפֵּי שְׁכִינְתִּי לָא אִתְיְדִיעַת לְהוֹן", "pj_en": "And I was revealed unto Abraham, and to Izhak, and to Jakob, as EI-Shaddai; but My Name Ye-ya, as it discovereth My Glory,* was not known to them. *Or, in the face of My Shekinah", "tj": "וְאִיתְגְלִי בְּמֵימְרִי עַל אַבְרָהָם עַל יִצְחָק וְעַל יַעֲקב בֶּאֱלָהָא שְׁמַיָא וְשׁוּם מֵימְרָא דַיְיָ לָא אוֹדָעִית לְהוֹן:", "tj_en": "And the Lord was revealed in His Word unto Abraham, to Izhak, and to Jakob, as the God of Heaven; but the Name of the Word of the Lord was not known to them.", "rashi": "<b>וארא.<\/b> אֶל הָאָבוֹת:<br><br><b>באל שדי.<\/b> הִבְטַחְתִּים הַבְטָחוֹת וּבְכֻלָּן אָמַרְתִּי לָהֶם אֲנִי אֵל שַׁדַּי:<br><br><b>ושמי ה' לא נודעתי להם.<\/b> לֹא הוֹדַעְתִּי אֵין כְּתִיב כָּאן אֶלָּא לֹא נוֹדַעְתִּי, לֹא נִכַּרְתִּי לָהֶם בְּמִדַת אֲמִתּוּת שֶׁלִּי, שֶׁעָלֶיהָ נִקְרָא שְׁמִי ה', נֶאֱמָן לְאַמֵּת דְּבָרַי, שֶׁהֲרֵי הִבְטַחְתִּים וְלֹא קִיַּמְתִּי:", "rashi_en": "וארא AND I APPEARED — to the patriarchs.<br><br>באל שדי BY THE NAME OF GOD ALMIGHTY — I made certain promises to them and in the case of all of these I said unto them, “I am God Almighty”.<br><br>ושמי ה׳ לא נודעתי להם BUT BY MY NAME THE LORD WAS I NOT KNOWN TO THEM — It is not written here לא הודעתי [My name the Lord] I did not make known to them, but לא נודעתי [by My name, the Lord], was I not known [unto them] — i. e. I was not recognised by them in My attribute of “keeping faith”, by reason of which My name is called ה׳, which denotes that I am certain to substantiate My promise, for, indeed, I made promises to them but did not fulfill them [during their lifetime]."}, {"ch": 6, "v": 4, "aliyah": 1, "heb": "וְגַ֨ם הֲקִמֹ֤תִי אֶת־בְּרִיתִי֙ אִתָּ֔ם לָתֵ֥ת לָהֶ֖ם אֶת־אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵיהֶ֖ם אֲשֶׁר־גָּ֥רוּ בָֽהּ׃", "onk": "וְאַף אֲקֵימִית יָת קְיָמִי עִמְּהוֹן לְמִתַּן לְהוֹן יָת אַרְעָא דִכְנָעַן יָת אַרְעָא תּוֹתָבוּתְהוֹן דְּאִתּוֹתָבוּ בַהּ:", "onk_en": "I also established My covenant with them, to give them the land of Canaan, the land of their sojourning where they lived as strangers.", "pj": "וּלְחוֹד אַקֵימִית יַת קְיָימִי עִמְהוֹן לְמִתַּן לְהוֹן יַת אַרְעָא דִכְנָעַן יַת אַרַע תּוֹתָבוּתְהוֹן דְאִיתּוֹתְבוּ בָהּ", "pj_en": "And I confirmed also My covenant with them, to give them the land of Kenaan, the land of their sojourning in which they were sojourners.", "tj": "", "tj_en": "", "rashi": "<b>וגם הקמתי את בריתי וגו'.<\/b> וְגַם כְּשֶׁנִּרְאֵיתִי לָהֶם בְּאֵל שַׁדַּי הִצַּבְתִּי וְהֶעֱמַדְתִּי בְרִיתִי בֵּינִי וּבֵינֵיהֶם,<br><br><b>לתת להם ארץ כנען.<\/b> לְאַבְרָהָם בְּפָרָשַׁת מִילָה נֶאֱמַר \"אֲנִי אֵל שַׁדַּי וְגוֹ' וְנָתַתִּי לְךָ וּלְזַרְעֲךָ אַחֲרֶיךָ אֵת אֶרֶץ מְגֻרֶיךָ\" (בראשית י\"ז), לְיִצְחָק \"כִּי לְךָ וּלְזַרְעֲךָ אֶתֵּן אֶת כָּל הָאֲרָצֹת הָאֵל וַהֲקִמֹתִי אֶת הַשְּׁבֻעָה אֲשֶׁר נִשְׁבַּעְתִּי לְאַבְרָהָם\" (שם כ\"ו), וְאוֹתָהּ שְׁבוּעָה שֶׁנִּשְׁבַּעְתִּי לְאַבְרָהָם בְּאֵל שַׁדַּי אָמַרְתִּי לְיַעֲקֹב – \"אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה וְגוֹ' וְאֶת הָאָרֶץ אֲשֶׁר וְגוֹ'\" (שם ל\"ה), הֲרֵי שֶׁנָּדַרְתִּי לָהֶם וְלֹא קִיַּמְתִּי:", "rashi_en": "וגם הקמתי את בריתי וגו׳ Then, ALSO, when I appeared unto them by the name of God Almighty I ESTABLISHED and set up MY COVENANT between Myself and them<br><br>לתת להם את ארץ כנען TO GIVE THEM THE LAND OF CANAAN — Of Abraham it is stated in the chapter that contains the commandment of the Circumcision, (Genesis 17:1, and 17:8) “[The Lord appeared to Abraham and said unto him], I am God Almighty etc., and I will give to thee and to thy seed after thee the land of thy sojourning”. Of Isaac it is stated, (Genesis 26:3) “[The Lord appeared unto him and said], For unto thee and unto thy seed I will give all these countries, and I will establish the oath which I sware unto Abraham, thy father”, and that oath here referred to which I sware to Abraham I uttered by the name of God Almighty. Of Jacob it is stated, (Genesis 35:9, 11, 12) “[And God appeared unto Jacob … and God said unto him], I am God Almighty; be fruitful and multiply, … the land which I gave [Abraham and Isaac to thee I will give it] etc.” So you see that I made certain vows to them and I have not yet fulfilled them."}, {"ch": 6, "v": 5, "aliyah": 1, "heb": "וְגַ֣ם&thinsp;<b>׀<\/b> אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת־נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑ם וָאֶזְכֹּ֖ר אֶת־בְּרִיתִֽי׃", "onk": "וְאַף <b>קֳדָמַי<\/b> שְׁמִיעַ יָת קְבֵילַת בְּנֵי יִשְׂרָאֵל דִּי מִצְרָאֵי מַפְלְחִין בְּהוֹן וְדָכִירְנָא יָת קְיָמִי:", "onk_en": "And also [<b>before Me<\/b>] I have heard the groaning of the B’nei Yisrael, that the Egyptians are enslaving them, [<b>has been heard before Me<\/b>] and I have remembered My covenant.", "pj": "וּלְחוֹד עָל קֳדָמַי יַת אֲנֵיק בְּנֵי יִשְרָאֵל דְמִצְרָאֵי מְשַׁעֲבְּדוּן יַתְהוֹן וּדְכִירְנָא יַת קְיָימִי", "pj_en": "And now cometh before Me the groaning of the sons of Israel, because the Mizraee do enslave them; and I remember My covenant.", "tj": "", "tj_en": "", "rashi": "<b>וגם אני.<\/b> כְּמוֹ שֶׁהִצַּבְתִּי וְהֶעֱמַדְתִּי הַבְּרִית יֵשׁ עָלַי לְקַיֵּם, לְפִיכָךְ <b>שמעתי את נאקת בני ישראל<\/b> הַנּוֹאֲקִים, <b>אשר מצרים מעבדים אתם ואזכר<\/b> אוֹתוֹ הַבְּרִית, כִּי בִּבְרִית בֵּין הַבְּתָרִים אָמַרְתִּי לוֹ \"וְגַם אֶת הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי\" (בראשית ט\"ו):", "rashi_en": "וגם אני — Since I established and set up My covenant it is incumbent upon Me to fulfil it; therefore, שמעתי את נאקת בני ישראל I HAVE HEARD THE GROANING OF THE CHILDREN OF ISRAEL who groan (complain) אשר מצרים מעבדים אתם THAT THE EGYPTIANS ARE ENSLAVING THEM, ואזכר AND I REMEMBER that covenant which I have already made with them; because at the covenant “between the pieces” I said to him, (Genesis 15:14) “And also against that nation whom they shall serve will I pronounce judgment.”"}, {"ch": 6, "v": 6, "aliyah": 1, "heb": "לָכֵ֞ן אֱמֹ֥ר לִבְנֵֽי־יִשְׂרָאֵל֮ אֲנִ֣י יְהֹוָה֒ וְהוֹצֵאתִ֣י אֶתְכֶ֗ם מִתַּ֙חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְהִצַּלְתִּ֥י אֶתְכֶ֖ם מֵעֲבֹדָתָ֑ם וְגָאַלְתִּ֤י אֶתְכֶם֙ בִּזְר֣וֹעַ נְטוּיָ֔ה וּבִשְׁפָטִ֖ים גְּדֹלִֽים׃", "onk": "בְּכֵן אֱמַר לִבְנֵי יִשְׂרָאֵל אֲנָא יְיָ וְאַפֵּיק יָתְכוֹן <b>מִגּוֹ דְחוֹק<\/b> פָּלְחַן <b>מִצְרָאֵי<\/b> וֶאֱשֵׁיזֵב יָתְכוֹן מִפָּלְחָנְהוֹן וְאֶפְרוֹק יָתְכוֹן בִּדְרָעָא מְרָמָא וּבְדִינִין רַבְרְבִין:", "onk_en": "Therefore say to the B’nei Yisrael, ‘I am Adonoy. I will bring you out from under [<b>amongst<\/b>] the [<b>heavy<\/b>] burdens of Egypt [<b>the Egyptians<\/b>], and I will save you from their slavery. I will redeem you with an outstretched arm, and with acts of great judgments.", "pj": "בְּכֵן אֵימַר לִבְנֵי יִשְרָאֵל אֲנָא הוּא יְיָ וְאַפֵּיק יַתְכוֹן מִגוֹ דְחוֹק פּוּלְחַן מִצְרָאֵי וְאֵישֵׁיזִיב יַתְכוֹן מִפּוּלְחַנְהוֹן וְאֶפְרוֹק יַתְכוֹן בִּדְרַע מְרוֹמָא וּבְדִינִין רַבְרְבִין", "pj_en": "Therefore say to the sons of Israel, I am the Lord; and I will bring you forth from the oppressive bondage of the Mizraee, and will deliver you from your servitude, and save you with an uplifted arm, and by great judgments.", "tj": "", "tj_en": "", "rashi": "<b>לכן.<\/b> עַל פִּי אוֹתָהּ הַשְּׁבוּעָה:<br><br><b>אמר לבני ישראל אני ה'.<\/b> הַנֶּאֱמָן בְּהַבְטָחָתִי:<br><br><b>והוצאתי אתכם.<\/b> כִּי כֵן הִבְטַחְתִּי: \"וְאַחֲרֵי כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל\" (שם):<br><br><b>סבלת.<\/b> טֹרַח מַשָּׂא מִצְרַיִם:", "rashi_en": "לכן THEREFORE, i. e. in accordance with the tenor of that oath (cf. Exodus Rabbah 6)<br><br>אמר לבני ישראל אני ה׳ SAY UNTO THE CHILDREN OF ISRAEL, I AM THE LORD Who am faithful in My promise,<br><br>והוצאתי אתכם AND I WILL BRING YOU OUT, — for so did I promise them: (Genesis 15:14) “and afterwards shall they go out with great substance”.<br><br>סבלת מצרים means the encumbrance of the burdens of Egypt."}, {"ch": 6, "v": 7, "aliyah": 1, "heb": "וְלָקַחְתִּ֨י אֶתְכֶ֥ם לִי֙ לְעָ֔ם וְהָיִ֥יתִי לָכֶ֖ם לֵֽאלֹהִ֑ים וִֽידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהֹוָה֙ אֱלֹ֣הֵיכֶ֔ם הַמּוֹצִ֣יא אֶתְכֶ֔ם מִתַּ֖חַת סִבְל֥וֹת מִצְרָֽיִם׃", "onk": "<b>וֶאֱקָרֵיב<\/b> יָתְכוֹן <b>קֳדָמַי<\/b> לְעַמָּא וְאֶהֱוֵי לְכוֹן לֶאֱלָהּ וְתִדְּעוּן אֲרֵי אֲנָא יְיָ אֱלָהָכוֹן דְּאַפֵּיק יָתְכוֹן <b>מִגּוֹ דְחוֹק<\/b> פָּלְחַן מִצְרָיִם:", "onk_en": "I will take [<b>bring<\/b>] you to Myself [<b>before Me<\/b>] as a people, and I will be to you Elohim. You will know that I am Adonoy, your God Who is bringing you out from under [<b>amongst<\/b>] the [<b>heavy<\/b>] burdens of Egypt.", "pj": "וַאֲקַרֵב יַתְכוֹן קֳדָמַי לְעַם וְאֶהֱוֵי לְכוֹן לֶאֱלָהָא וְתֵידְעוּן אֲרוּם אֲנָא יְיָ אֳלָהָכוֹן דְאַנְפֵּיק יַתְכוֹן מִגוֹ דְחוֹק פּוּלְחַן מִצְרָאֵי", "pj_en": "And I will bring you nigh before Me to be a people, and I will be a God unto you, and you shall know that I am the Lord your God who hath led you forth from the hard service of the Mizraee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 8, "aliyah": 1, "heb": "וְהֵבֵאתִ֤י אֶתְכֶם֙ אֶל־הָאָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֙אתִי֙ אֶת־יָדִ֔י לָתֵ֣ת אֹתָ֔הּ לְאַבְרָהָ֥ם לְיִצְחָ֖ק וּֽלְיַעֲקֹ֑ב וְנָתַתִּ֨י אֹתָ֥הּ לָכֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהֹוָֽה׃", "onk": "וְאָעֵיל יָתְכוֹן לְאַרְעָא <b>דִּי קַיֵּמִית בְּמֵימְרִי<\/b> לְמִתַּן יָתַהּ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב וְאֶתֵּן יָתַהּ לְכוֹן יְרֻתָּא אֲנָא יְיָ:", "onk_en": "I will bring you to the land regarding which I raised My hand [in oath] [<b>swore with My Word<\/b>] that I would give it to Avraham, Yitzchok and Yaakov, and I will give it to you as an inheritance. I am Adonoy.’”", "pj": "וְאָעִיל יַתְכוֹן דְקַיְימִית בְּמֵימְרִי לְמִתַּן יָתָהּ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב וְאֶתֵּן יָתָהּ לְכוֹן יְרוּתָא אֲנָא יְיָ", "pj_en": "And I will bring you into the land which I covenanted by My Word to give unto Abraham, to Izhak, and to Jakob; and I will give it to you for an inheritance. I Am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>נשאתי את ידי.<\/b> הֲרִימוֹתִיהָ לְהִשָּׁבַע בְּכִסְאִי:", "rashi_en": "נשאתי את ידי I HAVE LIFTED UP MY HAND — I have lifted it up to swear by My Throne."}, {"ch": 6, "v": 9, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר מֹשֶׁ֛ה כֵּ֖ן אֶל־בְּנֵ֣י יִשְׂרָאֵ֑ל וְלֹ֤א שָֽׁמְעוּ֙ אֶל־מֹשֶׁ֔ה מִקֹּ֣צֶר ר֔וּחַ וּמֵעֲבֹדָ֖ה קָשָֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמַלֵּיל משֶׁה כֵּן לִבְנֵי יִשְׂרָאֵל וְלָא <b>קַבִּילוּ<\/b> מִן משֶׁה מִמַּעְיַק רוּחָא וּמִפָּלְחָנָא <b>דַּהֲוָה קָשְׁיָא עֲלֵיהוֹן<\/b>:", "onk_en": "Moshe spoke [these words] to the B’nei Yisrael, but they would not listen to [<b>obey<\/b>] Moshe because of [their] shortness of wind and [<b>the<\/b>] hard labor [<b>that was hard upon them<\/b>].", "pj": "וּמַלֵיל משֶׁה כְּדֵין עִם בְּנֵי יִשְרָאֵל וְלָא קַבִּילוּ מִן משֶׁה מִקְפִּידוּת רוּחָא וּמִפּוּלְחָנָא נוּכְרָאָה קַשְׁיָא דִי בִּידֵיהוֹן", "pj_en": "And Mosheh spake according to this to the sons of Israel; but they received not from Mosheh, through anxiety of spirit, and from the strange and hard service which was upon their hands.", "tj": "מַקְפִּידוֹת:", "tj_en": "From anxiety.", "rashi": "<b>ולא שמעו אל משה.<\/b> לֹא קִבְּלוּ תַנְחוּמִין:<br><br><b>מקצר רוח.<\/b> כָּל מִי שֶׁהוּא מֵצֵר, רוּחוֹ וּנְשִׁימָתוֹ קְצָרָה, וְאֵינוֹ יָכוֹל לְהַאֲרִיךְ בִּנְשִׁימָתוֹ: קָרוֹב לְעִנְיָן זֶה שָׁמַעְתִּי בְּפָרָשָׁה זוֹ מֵרַבִּי בָּרוּךְ בְּרַבִּי אֱלִיעֶזֶר, וְהֵבִיא לִי רְאָיָה מִמִּקְרָא זֶה, \"בַּפַּעַם הַזֹּאת אוֹדִיעֵם אֶת יָדִי וְאֶת גְּבוּרָתִי וְיָדְעוּ כִּי שְׁמִי ה'\" (ירמיהו ט\"ז) – לָמַדְנוּ כְּשֶׁהַקָּבָּ\"ה מְאַמֵּן אֶת דְּבָרָיו אֲפִלּוּ לְפֻרְעָנוּת מוֹדִיעַ שֶׁשְּׁמוֹ ה', וְכָל שֶׁכֵּן הַאֲמָנָה לְטוֹבָה. וְרַבּוֹתֵינוּ דְרָשׁוּהוּ לְעִנְיָן שֶׁל מַעְלָה, שֶׁאָמַר מֹשֶׁה לָמָה הֲרֵעֹתָה, אָמַר לוֹ הַקָּבָּ\"ה \"חֲבַל עַל דְּאָבְדִין וְלָא מִשְׁתַּכְּחִין\" – יֵשׁ לִי לְהִתְאוֹנֵן עַל מִיתַת הָאָבוֹת, הַרְבֵּה פְּעָמִים נִגְלֵיתִי אֲלֵיהֶם בְּאֵל שַׁדַּי וְלֹא אָמְרוּ לִי מַה שִּׁמְךָ, וְאַתָּה אָמַרְתָּ מַה שְּׁמוֹ, מָה אֹמַר אֲלֵיהֶם:<br><br><b>וגם הקמתי וגו'.<\/b> וּכְשֶׁבִּקֵּשׁ אַבְרָהָם לִקְבֹּר אֶת שָׂרָה לֹא מָצָא קֶבֶר עַד שֶׁקָּנָה בְדָמִים מְרֻבִּים, וְכֵן בְּיִצְחָק עִרְעֲרוּ עָלָיו עַל הַבְּאֵרוֹת אֲשֶׁר חָפַר, וְכֵן יַעֲקֹב וַיִּקֶן אֶת חֶלְקַת הַשָּׂדֶה, לִנְטוֹת אָהֳלוֹ, וְלֹא הִרְהֲרוּ אַחַר מִדּוֹתַי, וְאַתָּה אָמַרְתָּ לָמָה הֲרֵעֹתָה? וְאֵין הַמִּדְרָשׁ מִתְיַשֵּׁב אַחַר הַמִּקְרָא מִפְּנֵי כַמָּה דְבָרִים, אַחַת, שֶׁלֹּא נֶאֱמַר וּשְׁמִי ה' לֹא שָׁאֲלוּ לִי, וְאִם תֹּאמַר לֹא הוֹדִיעָם שֶׁכָּךְ שְׁמוֹ, הֲרֵי תְּחִלָּה כְּשֶׁנִּגְלָה לְאַבְרָהָם בֵּין הַבְּתָרִים נֶאֱמַר \"אֲנִי ה' אֲשֶׁר הוֹצֵאתִיךָ מֵאוּר כַּשְׂדִים\" (בראשית ט\"ו), וְעוֹד הֵיאַךְ הַסְּמִיכָה נִמְשֶׁכֶת בִּדְבָרִים שֶׁהוּא סוֹמֵךְ לְכָאן <b>וגם אני שמעתי וגו' לכן אמר לבני ישראל<\/b>? לְכָךְ אֲנִי אוֹמֵר יִתְיַשֵּׁב הַמִּקְרָא עַל פְּשׁוּטוֹ, דִּבּוּר דָּבוּר עַל אָפְנָיו, וְהַדְּרָשָׁה תִדָּרֵשׁ, שֶׁנֶּאֱמַר \"הֲלוֹא כֹה דְבָרִי כָּאֵשׁ נְאֻם ה' וּכְפַטִּישׁ יְפוֹצֵץ סָלַע\" (ירמיהו כ\"ג) – מִתְחַלֵּק לְכַמָּה נִיצוֹצוֹת (סנהדרין ל\"ד):", "rashi_en": "ולא שמעו אל משה BUT THEY HEARKENED NOT TO MOSES — they did not accept his words of comfort.<br><br>מקצר רוח THROUGH ANGUISH (lit. shortness) OF SPIRIT — If one is in anguish his breath comes in short gasps and he cannot draw long breaths. In a somewhat similar manner to this I heard this section expounded by Rabbi Baruch the son of Rabbi Eliezer, and he cited the following verse to me in proof of his explanation: (Jeremiah 16:21) “This once will I cause them to know My hand and My might, and they shall know that My Name is the Lord”. Rabbi Baruch said: we may learn from this text that when the Holy One, blessed be He, fulfils His words, even when it is a matter of punishment, He makes it known that His Name is the Lord; and, of course, this is all the more so, when He fulfils His words in a matter of bestowing reward. — Our Rabbis explained it (this section) as having reference to what precedes it — that Moses said (5:22): “Wherefore hast thou done so evil [to this people]”. Whereupon God said to him, “Alas, for those that are gone (i. e. the patriarchs) and are no more to be found! I really have reason to deplore the death of the patriarchs. Many a time did I reveal Myself to them by the name ‘God Almighty’, and not once did they ask Me, What is Thy Name? (i. e. what is the name that describes Thy true essence); but thou hast at once said (Exodus 3:13) “[If they ask] ‘what is His name’, what shall I say unto them?!” (Exodus Rabbah 6:4; Sanhedrin 111a).<br><br>וגם הקמתי וגו׳ ALSO I SET UP [MY COVENANT WITH THEM TO GIVE THEM THE LAND OF CANAAN], and yet when Abraham wished to bury Sarah he could not obtain a grave until he purchased one at a high price. So, too, in the case of Isaac, people strove with him for possession of the wells which he had dug. Similarly, of Jacob it is stated, (Genesis 33:19) “He purchased a parcel of field,” in which to pitch his tent. Yet none of them criticised My dealings with them, whilst you say “Wherefore hast Thou done so evil [to this people!]” — But this Midrashic exposition does not fit in with the text for several reasons. Firstly, because Scripture does not state “And they did not ask of Me regarding my Name, the Lord”. And if you say in refutation of my objection that they did not mean that ושמי ה' לא נודעתי actually signifies that they did not ask what is My Name, but it means “He did not tell them that this was His Name and yet they did not ask Him what it was”, then I reply that these words cannot mean that He did not tell them His name, for at the very first when He revealed Himself to Abraham at the Covenant “between the pieces’’ it is said, (Genesis 15:7) “I am the Lord (אני ה׳) who brought thee out from Ur of the Chaldees”. Further (secondly), how does the context run on to the statements which Scripture places after the above verses, viz., “And I have also heard etc.” and “Wherefore say unto the children of Israel etc.”? Therefore I say: let Scripture be explained in its literal sense so that each statement fits into its proper setting, but the Midrashic exposition may also be given, if you like, as it is said (Jeremiah 23:29) “Is not my word like as fire, saith the Lord, and like a hammer which, by the force of its own blow, the rock at which it strikes shatters in pieces”."}, {"ch": 6, "v": 10, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying,", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake to Mosheh saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 11, "aliyah": 1, "heb": "בֹּ֣א דַבֵּ֔ר אֶל־פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽישַׁלַּ֥ח אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל מֵאַרְצֽוֹ׃", "onk": "עוּל מַלֵּיל לְוָת פַּרְעֹה מַלְכָּא דְמִצְרָיִם וִישַׁלַּח יָת בְּנֵי יִשְׂרָאֵל מֵאַרְעֵיהּ:", "onk_en": "“Come, speak to Pharaoh, king of Egypt, that he send the B’nei Yisrael out of his land.”", "pj": "עוּל מַלֵיל עִם פַרְעה מַלְכָּא דְמִצְרָיִם וְיִפְטוֹר יַת בְּנֵי יִשְרָאֵל מֵאַרְעֵיהּ", "pj_en": "Go in, speak with Pharoh, the king of Mizraim, that he release the children of Israel from his land.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 12, "aliyah": 1, "heb": "וַיְדַבֵּ֣ר מֹשֶׁ֔ה לִפְנֵ֥י יְהֹוָ֖ה לֵאמֹ֑ר הֵ֤ן בְּנֵֽי־יִשְׂרָאֵל֙ לֹֽא־שָׁמְע֣וּ אֵלַ֔י וְאֵיךְ֙ יִשְׁמָעֵ֣נִי פַרְעֹ֔ה וַאֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמַלִּיל משֶׁה קֳדָם יְיָ לְמֵימָר הָא בְנֵי יִשְׂרָאֵל לָא <b>קַבִּילוּ<\/b> מִנִּי וְאֶכְדֵּין <b>יְקַבֵּל<\/b> מִנִּי פַרְעֹה וַאֲנָא <b>יַקִּיר מַמְלָל<\/b>:", "onk_en": "Moshe spoke before Adonoy, saying, “Behold the B’nei Yisrael have not listened to [<b>obeyed<\/b>] me, how then will Pharaoh listen to [<b>accept<\/b>] me—I whose lips are covered [<b>am heavy of speech<\/b>].”", "pj": "וּמַלֵיל משֶׁה קֳדָם יְיָ לְמֵימָר הָא בְּנֵי יִשְרָאֵל לָא קַבִּילוּ מִינִי וְהֵיכְדֵין יְקַבֵּיל מִינִי פַּרְעה וַאֲנָא קְשֵׁי מַמְלֵיל", "pj_en": "And Mosheh said before the Lord, Behold, the sons of Israel do not hearken to me; how then will Pharoh hearken to me, and I a man difficult of speech?", "tj": "", "tj_en": "", "rashi": "<b>ואיך ישמעני פרעה.<\/b> זֶה אֶחָד מֵעֲשָׂרָה קַל וָחֹמֶר שֶׁבַּתּוֹרָה (בראשית רבה צ\"ב):<br><br><b>ערל שפתים.<\/b> אֲטוּם שְׂפָתַיִם; וְכֵן כָּל לְשׁוֹן עָרְלָה אֲנִי אוֹמֵר שֶׁהוּא אָטוּם, \"עֲרֵלָה אָזְנָם\" (ירמיהו ו') – אֲטוּמָה מִשְּׁמֹעַ, \"עַרְלֵי לֵב\" (שם ט') – אֲטוּמִים מֵהָבִין, \"שְׁתֵה גַּם אַתָּה וְהֵעָרֵל\" (חבקוק ב') – וְהֵאָטֵם מִשִּׁכְרוּת כּוֹס הַקְּלָלָה, \"עָרְלַת בָּשָׂר\" – שֶׁהַגִּיד אָטוּם וּמְכֻסֶּה בָהּ, \"וַעֲרַלְתֶּם עָרְלָתוֹ\" (ויקרא י\"ט) – עֲשׂוּ לוֹ אֹטֶם וּכְסוּי אִסּוּר שֶׁיַּבְדִּיל בִּפְנֵי אֲכִילָתוֹ, \"שָׁלֹשׁ שָׁנִים יִהְיֶה לָכֶם עֲרֵלִים\" (שם) – אָטוּם וּמְכֻסֶּה וּמֻבְדָּל מִלְּאָכְלוֹ:", "rashi_en": "ואיך ישמעני פרעה HOW THAN SHALL PHARAOH HEAR ME? — This is one of the ten inferences from minor to major which are found in the Bible (Genesis Rabbah 92:7).<br><br>ערל שפתים OF UNCIRCUMCISED LIPS — It really means obstructed as regards the lips. So, too, in respect to all forms derived from ערל I say that they signify obstructed. E. g. (Jeremiah 6:10) “their ear is עֲרֵלָה — stopped up so that it will not hear; (Jeremiah 9:25) “עַרְלִי in heart” — their hearts are closed so that they will not understand; (Habakkuk 2:16) “Drink thou, also וְהֵעָרֵל” — and become thou closed up (in thy senses) through intoxication caused by the cup of curse mentioned in that passage; the foreskin (ערלה) of the flesh is so called because the membrum is closed up and covered by it; (Leviticus 19:23) וערלתם ערלתו signifies, make for it (the tree) a closure (אוטם) and cover by means of an inhibition that will prove a barrier against eating it; (Leviticus 19:23 “Three years shall it be to you as ערלים” — it shall be closed up and covered and barred so that it many not be eaten."}, {"ch": 6, "v": 13, "aliyah": 1, "heb": "וַיְדַבֵּ֣ר יְהֹוָה֮ אֶל־מֹשֶׁ֣ה וְאֶֽל־אַהֲרֹן֒ וַיְצַוֵּם֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאֶל־פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְהוֹצִ֥יא אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל מֵאֶ֥רֶץ מִצְרָֽיִם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן וּפַקֵּדִנּוּן לְוָת בְּנֵי יִשְׂרָאֵל וּלְוָת  פַּרְעֹה מַלְכָּא דְמִצְרָיִם לְאַפָּקָא יָת בְּנֵי יִשְׂרָאֵל מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "Adonoy [then] spoke to Moshe and Aharon, commanding them regarding the B’nei Yisrael and Pharaoh, king of Egypt, to bring out the B’nei Yisrael from the land of Egypt.", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן וְאַזְהַרִינוּן עַל בְּנֵי יִשְרָאֵל וְשַׁלְחִינוּן לְוַת פַּרְעה מַלְכָּא דְמִצְרַיִם לְאַפָּקָא יַת בְּנֵי יִשְרָאֵל מֵאַרְעָא דְמִצְרַיִם", "pj_en": "And the Lord spake with Mosheh and with Aharon, and gave them admonition for the sons of Israel, and sent them to Pharoh, king of Mizraim, to send forth the children of Israel from the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>וידבר ה' אל משה ואל אהרן.<\/b> לְפִי שֶׁאָמַר מֹשֶׁה אֲנִי עֲרַל שְׂפָתַיִם, צֵרֵף לוֹ הַקָּבָּ\"ה אֶת אַהֲרֹן לִהְיוֹת לוֹ לְפֶה וּלְמֵלִיץ:<br><br><b>ויצום אל בני ישראל.<\/b> צִוָּם עֲלֵיהֶם לְהַנְהִיגָם בְּנַחַת וְלִסְבֹּל אוֹתָם (שמות רבה):<br><br><b>ואל פרעה מלך מצרים.<\/b> צִוָּם עָלָיו לַחֲלֹק לוֹ כָבוֹד בְּדִבְרֵיהֶם, זֶה מִדְרָשׁוֹ (שם); וּפְשׁוּטוֹ, צִוָּם עַל דְּבַר יִשְׂרָאֵל וְעַל שְׁלִיחוּתוֹ אֶל פַּרְעֹה; וּדְבַר הַצִּוּוּי מַהוּ, מְפֹרָשׁ בְּפָרָשָׁה שְׁנִיָּה לְאַחַר סֵדֶר הַיַּחַס, אֶלָּא מִתּוֹךְ שֶׁהִזְכִּיר מֹשֶׁה וְאַהֲרֹן, הִפְסִיק הָעִנְיָן בְּ<b>אלה ראשי בית אבתם<\/b> לְלַמְּדֵנוּ הֵיאַךְ נוֹלְדוּ מֹשֶׁה וְאַהֲרֹן וּבְמִי נִתְיַחֲסוּ:", "rashi_en": "וידבר ה' אל משה ואהרן AND THE LORD SPAKE UNTO MOSES AND UNTO AARON — because Moses had said, “I am of uncircumcised lips”. The Holy One, blessed be He, associated Aaron with him to be his mouth-piece and spokesman.<br><br>ויצום אל בני ישראל signifies that HE GAVE THEM A CHARGE regarding them; viz., to deal with them in a gentle manner and to be patient with them (Exodus Rabbah 7:3)<br><br>ואל פרעה מלך מצרים signifies that He charged them with regard to PHARAOH, KING OF EGYPT, viz., that they should show respect to him in all that they spoke. This is a Midrashic explanation (Exodus Rabbah 7:3; Midrash Tanchuma, Vaera 2); but the real meaning is: He gave them a command with regard to Israel and with regard to His mission on which he had sent them to Pharaoh. And what the purport of this command was is explained in the second section from here (vv. 29—31) after the order of genealogy set forth in the next passage. It properly should follow here, but because Scripture has mentioned Moses and Aaron here, it interrupts the narrative by interpolating the section beginning (v. 14), “These are the heads of their fathers’ houses”, in order to inform us how Moses and Aaron were born (who were their parents) and with whom they are connected by descent."}, {"ch": 6, "v": 14, "aliyah": 2, "heb": "אֵ֖לֶּה רָאשֵׁ֣י בֵית־אֲבֹתָ֑ם בְּנֵ֨י רְאוּבֵ֜ן בְּכֹ֣ר יִשְׂרָאֵ֗ל חֲנ֤וֹךְ וּפַלּוּא֙ חֶצְרֹ֣ן וְכַרְמִ֔י אֵ֖לֶּה מִשְׁפְּחֹ֥ת רְאוּבֵֽן׃", "onk": "אִלֵּין רֵישֵׁי בֵית אֲבָהָתְהוֹן בְּנֵי רְאוּבֵן בּוּכְרָא דְיִשְׂרָאֵל חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי אִלֵּין זַרְעֲיַת רְאוּבֵן:", "onk_en": "These are the heads of their paternal households: the sons of Reuvein, the first-born of Yisrael [are]: Chanoch, Pallu, Chetzron and Carmi. These are the families of Reuvein.", "pj": "אִלֵין רֵישֵׁי בֵית אֲבָהַתְהוֹן בְּנוֹי דִרְאוּבֵן בּוּכְרָא דְיִשְרָאֵל חֲנוֹךְ וּפַלוּא חֶצְרוֹן וְכַרְמִי אִלֵין יֵיחוּסִין דִרְאוּבֵן", "pj_en": "These are the heads of the house of their fathers. The sons of Reuben, the firstborn of Israel, Hanok and Phallu, Hezron and Karmi; these are the race of Reuben.", "tj": "", "tj_en": "", "rashi": "<b>אלה ראשי בית אבתם.<\/b> מִתּוֹךְ שֶׁהֻזְקַק לְיַחֵס שִׁבְטוֹ שֶׁל לֵוִי עַד מֹשֶׁה וְאַהֲרֹן בִּשְׁבִיל מֹשֶׁה וְאַהֲרֹן, הִתְחִיל לְיַחֲסָם דֶּרֶךְ תּוֹלְדוֹתָם מֵרְאוּבֵן. וּבְפְסִיקְתָּא רַבָּתִי רָאִיתִי, לְפִי שֶׁקִּנְטְרָם יַעֲקֹב אָבִינוּ לִשְׁלוֹשָׁה שְׁבָטִים הַלָּלוּ בִּשְׁעַת מוֹתוֹ, חָזַר הַכָּתוּב וְיִחֲסָם כָּאן לְבַדָּם, לוֹמַר שֶׁחֲשׁוּבִים הֵם:", "rashi_en": "אלה ראשי בית אבתם THESE ARE THE HEADS OF THEIR FATHERS’ HOUSES — Since it (Scripture) finds itself compelled to give the genealogy of the tribe of Levi as far as Moses and Aaron because of Moses and Aaron, it begins to give the genealogy of the tribes in the order of their birth commencing from Reuben. And in Pesikta Rabbati 7 (on Numbers 7:12) I have seen the statement, that because their father Jacob reproached these three tribes in the hour of his death Scripture again enumerates here their genealogy alone of all the tribes to indicate that they nevertheless were men of worth."}, {"ch": 6, "v": 15, "aliyah": 2, "heb": "וּבְנֵ֣י שִׁמְע֗וֹן יְמוּאֵ֨ל וְיָמִ֤ין וְאֹ֙הַד֙ וְיָכִ֣ין וְצֹ֔חַר וְשָׁא֖וּל בֶּן־הַֽכְּנַעֲנִ֑ית אֵ֖לֶּה מִשְׁפְּחֹ֥ת שִׁמְעֽוֹן׃", "onk": "וּבְנֵי שִׁמְעוֹן יְמוּאֵל וְיָמִין וְאֹהַד וְיָכִין וְצֹחַר וְשָׁאוּל בַּר כְּנַעֲנֵיתָא אִלֵּין זַרְעֲיַת שִׁמְעוֹן:", "onk_en": "The sons of Shimon: Yemuel, Yamin, Ohad, Yachin, Tzochar and Shaul, the son of the Canaanite woman. These are the families of Shimon.", "pj": "וּבְנוֹי דְשִׁמְעוֹן יְמוּאֵל וְיָמִין וְאוֹהַד וְיָכִין וְצוֹחַר וְשָׁאוּל הוּא זִמְרִי דְאַשְׁאִיל נַפְשֵׁיהּ לִזְנוּתָא הֵי בִּכְנַעֲנָאֵי אִלֵין יֵיחוּסִין דְשִׁמְעוֹן", "pj_en": "And the sons of Shimeon, Jemuel, and Jamin, and Ohad, and Jakin, and Sochar, and Shaul (he is Zimri, who yielded himself unto fornication, as among the Kenaanaee); these are the race of Shimeon.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 16, "aliyah": 2, "heb": "וְאֵ֨לֶּה שְׁמ֤וֹת בְּנֵֽי־לֵוִי֙ לְתֹ֣לְדֹתָ֔ם גֵּרְשׁ֕וֹן וּקְהָ֖ת וּמְרָרִ֑י וּשְׁנֵי֙ חַיֵּ֣י לֵוִ֔י שֶׁ֧בַע וּשְׁלֹשִׁ֛ים וּמְאַ֖ת שָׁנָֽה׃", "onk": "וְאִלֵּין שְׁמָהַת בְּנֵי לֵוִי לְתוּלְדָתְהוֹן גֵּרְשׁוֹן וּקְהָת וּמְרָרִי וּשְׁנֵי חַיֵּי לֵוִי מְאָה וּתְלָתִין וּשְׁבַע שְׁנִין:", "onk_en": "These are the names of the sons of Leivi, according to their generations: Gershon, Kehos, and Merari. The years of Leivi’s life were one hundred and thirty-seven years.", "pj": "וְאִלֵין שְׁמָהַת בְּנוֹי דְלֵוִי לְיִיחוּסֵיהוֹן גֵרְשׁוֹן וּקְהָת וּמְרָרִי וּשְׁנֵי חַיוֹי דְלֵוִי מְאָה וּתְלָתִין וּשְׁבַע שְׁנִין חַיָיא עַד דְחָמָא יַת משֶׁה וְיַת אַהֲרן פְּרִיקַיָיא דְיִשְרָאֵל", "pj_en": "And these are the names of the sons of Levi, according to their race: Gershon, and Kehath, and Merari. And the years of the life of Levi a hundred and thirty and seven years: he lived to see Mosheh and Aharon the deliverers of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ושני חיי לוי וגו'.<\/b> לָמָּה נִמְנוּ שְׁנוֹתָיו שֶׁל לֵוִי? לְהוֹדִיעַ כַּמָּה יְמֵי הַשִּׁעְבּוּד; שֶׁכָּל זְמַן שֶׁאֶחָד מִן הַשְּׁבָטִים קַיָּם לֹא הָיָה שִׁעְבּוּד (שמות רבה א'), שֶׁנֶּאֱמַר \"וַיָּמָת יוֹסֵף וְכָל אֶחָיו\" (שמות א), וְאַחַר כָּךְ \"וַיָּקָם מֶלֶךְ חָדָשׁ\", וְלֵוִי הֶאֱרִיךְ יָמִים עַל כֻּלָּם:", "rashi_en": "ושני חיי לוי וגו׳ AND THE YEARS OF THE LIFE OF LEVI WERE etc. — Why is the number of the years of Levi mentioned? In order to tell us how long the period of slavery lasted — because so long as even one of the sons of Jacob (lit. the tribes) remained alive there was no slavery imposed upon the Israelites, as it is said, (Exodus 1:6) “And Joseph died and all his brethren”, and afterwards it is stated (Exodus 1:8), “Now there arose a king” (who enslaved them); and Levi lived the longest of all of them (Seder Olam 3)."}, {"ch": 6, "v": 17, "aliyah": 2, "heb": "בְּנֵ֥י גֵרְשׁ֛וֹן לִבְנִ֥י וְשִׁמְעִ֖י לְמִשְׁפְּחֹתָֽם׃", "onk": "בְּנֵי גֵרְשׁוֹן לִבְנִי וְשִׁמְעִי לְזַרְעֲיָתְהוֹן:", "onk_en": "The sons of Gershon: Livni and Shimi, and their families [descending from them].", "pj": "בְּנוֹי דְגֵרְשׁוֹם לִבְנִי וְשִׁמְעִי לְיִיחוּסֵיהוֹן", "pj_en": "And the sons of Gershon, Libni and Shemei, according to their generations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 18, "aliyah": 2, "heb": "וּבְנֵ֣י קְהָ֔ת עַמְרָ֣ם וְיִצְהָ֔ר וְחֶבְר֖וֹן וְעֻזִּיאֵ֑ל וּשְׁנֵי֙ חַיֵּ֣י קְהָ֔ת שָׁלֹ֧שׁ וּשְׁלֹשִׁ֛ים וּמְאַ֖ת שָׁנָֽה׃", "onk": "וּבְנֵי קְהָת עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל וּשְׁנֵי חַיֵּי קְהָת מְאָה וּתְלָתִין וּתְלַת שְׁנִין:", "onk_en": "The sons of Kehos: Amram, Yitzhar, Chevron and Uzziel. The years of Kehos’s life were one hundred and thirty-three years.", "pj": "וּבְנוֹי דִקְהָת עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִיאֵל וּשְׁנֵי חַיוֹי דִקְהָת חֲסִידָא מְאָה וּתְלָתִין וּתְלַת שְׁנִין חַיָיא עַד דְחָמָא יַת פִּינְחָס הוּא אֵלִיָהוּ כַּהֲנָא רַבָּא דְעָתִיד לְמִשְׁתַּלְחָא לְגָלוּתָא דְיִשְרָאֵל בְּסוֹף יוֹמַיָא", "pj_en": "And the sons of Kehath, Amram, and Jitshar, and Hebron, and Uzziel. And the years of the life of Kehath the saint, a hundred and thirty and three years. He lived to see Phinehas, who is Elijah, the Great Priest, who is to be sent to the captivity of Israel at the end of the days.", "tj": "", "tj_en": "", "rashi": "<b>ושני חיי קהת, ושני חיי עמרם וגו'.<\/b> מֵחֶשְׁבּוֹן זֶה אָנוּ לְמֵדִים עַל מוֹשַׁב בְּנֵי יִשְׂרָאֵל אַרְבַּע מֵאוֹת שָׁנָה שֶׁאָמַר הַכָּתוּב (בראשית ט״ו:י״ג), שֶׁלֹּא בְאֶרֶץ מִצְרַיִם לְבַדָּהּ הָיוּ, אֶלָּא מִיּוֹם שֶׁנּוֹלַד יִצְחָק; שֶׁהֲרֵי קְהָת מִיּוֹרְדֵי מִצְרַיִם הָיָה, חֲשֹׁב כָּל שְׁנוֹתָיו וּשְׁנוֹת עַמְרָם וּשְׁמוֹנִים שֶׁל מֹשֶׁה, לֹא תִמְצָאֵם אַרְבַּע מֵאוֹת שָׁנָה, וְהַרְבֵּה שָׁנִים נִבְלָעִים לַבָּנִים בִּשְׁנֵי הָאָבוֹת:", "rashi_en": "ושני חיי קהת … ושני חיי עמרם וגו׳ AND THE YEARS OF THE LIFE OF KOHATH WERE etc. … AND THE YEARS OF THE LIFE OF AMRAM WERE etc. — From these numbers we may gather regarding the period of residence of the children of Israel, — viz., four hundred years, of which Scripture speaks, that these four hundred years were not passed in Egypt alone, but that they date from the day of Isaac’s birth. You know that Kohath was one of those who went down to Egypt; now reckon all his years (133) although really we should not take into account the years he lived before he went down to Egypt, and the years of Amram, his son (137), and the eighty years of Moses, the latter’s son, which he had attained when the Israelites left Egypt, and you will not find them totaling to four hundred, and in this calculation many years of the sons’ ages are included in those of their fathers (i. e. in such a calculation one must deduct in each instance the father’s age when his son was born since this number is included in the total age of each of these persons) (cf. Rashi on Exodus 12:40)"}, {"ch": 6, "v": 19, "aliyah": 2, "heb": "וּבְנֵ֥י מְרָרִ֖י מַחְלִ֣י וּמוּשִׁ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת הַלֵּוִ֖י לְתֹלְדֹתָֽם׃", "onk": "וּבְנֵי מְרָרִי מַחְלִי וּמוּשִׁי אִלֵּין זַרְעֲיַת לֵוִי לְתוּלְדָתְהוֹן:", "onk_en": "The sons of Merari: Machli and Mushi. These are the families of the Levites according to their [descending] generation.", "pj": "וּבְנוֹי דִמְרָרִי מַחְלִי וּמוּשִׁי אִלֵין יְחוּסִין דְלֵוִי לִגְנִסְתְּהוֹן", "pj_en": "And the sons of Merari, Mahali and Mushi; these are the race of Levi according to the generations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 20, "aliyah": 2, "heb": "וַיִּקַּ֨ח עַמְרָ֜ם אֶת־יוֹכֶ֤בֶד דֹּֽדָתוֹ֙ ל֣וֹ לְאִשָּׁ֔ה וַתֵּ֣לֶד ל֔וֹ אֶֽת־אַהֲרֹ֖ן וְאֶת־מֹשֶׁ֑ה וּשְׁנֵי֙ חַיֵּ֣י עַמְרָ֔ם שֶׁ֧בַע וּשְׁלֹשִׁ֛ים וּמְאַ֖ת שָׁנָֽה׃", "onk": "וּנְסִיב עַמְרָם יָת יוֹכֶבֶד <b>אֲחַת אֲבוּהִי<\/b> לֵיהּ לְאִנְתּוּ וִילִידַת לֵיהּ יָת אַהֲרֹן וְיָת משֶׁה וּשְׁנֵי חַיֵּי עַמְרָם מְאָה וּתְלָתִין וּשְׁבַע שְׁנִין:", "onk_en": "Amram took his aunt [<b>father’s sister<\/b>] Yocheved for his wife and she bore him Aharon and Moshe. The years of Amram’s life were one hundred and thirty-seven years.", "pj": "וּנְסֵיב עַמְרָם יַת יוֹכֶבֶד חֲבִבָתֵיהּ לֵיהּ לְאִנְתּוּ וִילֵידַת לֵיהּ יַת אַהֲרן וְיַת משֶׁה וּשְׁנֵי חַיוֹי דְעַמְרָם חֲסִידָא מְאָה וּתְלָתִין וּשְׁבַע שְׁנִין חַיָיא עַד דְחָמָא יַת בְּנֵי רְחַבְיָא בַּר גֵרְשׁוֹם בַּר משֶׁה", "pj_en": "And Amram took Jokeved his cousin to wife, and she bare him Aharon and Mosheh; and the years of Amram the saint were a hundred and thirty and seven years. He lived to see the children of Rechabia bar Gershom bar Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>יוכבד דודתו.<\/b> אַחַת אֲבוּהִי, בַּת לֵוִי אֲחוֹת קְהָת:", "rashi_en": "יוכבד דדתו JOCHEBED HIS AUNT — The Targum has: his father’s sister; she was daughter of Levi (cf. Exodus 2:1) and sister of Kohath."}, {"ch": 6, "v": 21, "aliyah": 2, "heb": "וּבְנֵ֖י יִצְהָ֑ר קֹ֥רַח וָנֶ֖פֶג וְזִכְרִֽי׃", "onk": "וּבְנֵי יִצְהָר קֹרַח וָנֶפֶג וְזִכְרִי:", "onk_en": "The sons of Yitzhar: Korach, Nefeg and Zichri.", "pj": "וּבְנוֹי דְיִצְהָר קרַח וָנֶפֶג וְזִכְרִי", "pj_en": "And the sons of Jitshar (were) Korah, and Nepheg, and Zichri.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 22, "aliyah": 2, "heb": "וּבְנֵ֖י עֻזִּיאֵ֑ל מִֽישָׁאֵ֥ל וְאֶלְצָפָ֖ן וְסִתְרִֽי׃", "onk": "וּבְנֵי עֻזִּיאֵל מִישָׁאֵל וְאֶלְצָפָן וְסִתְרִי:", "onk_en": "The sons of Uzziel: Mishaeil, Eltzaphan and Sisri.", "pj": "וּבְנוֹי דְעֻזִיאֵל מִישָׁאֵל וְאֶלְצָפָן וְסִתְרִי", "pj_en": "And the sons of Uzziel, Mishael, and Elsaphan, and Sithri.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 23, "aliyah": 2, "heb": "וַיִּקַּ֨ח אַהֲרֹ֜ן אֶת־אֱלִישֶׁ֧בַע בַּת־עַמִּינָדָ֛ב אֲח֥וֹת נַחְשׁ֖וֹן ל֣וֹ לְאִשָּׁ֑ה וַתֵּ֣לֶד ל֗וֹ אֶת־נָדָב֙ וְאֶת־אֲבִיה֔וּא אֶת־אֶלְעָזָ֖ר וְאֶת־אִֽיתָמָֽר׃", "onk": "וּנְסִיב אַהֲרֹן יָת אֱלִישֶׁבַע בַּת עַמִּינָדָב אֲחָתֵיהּ דְּנַחְשׁוֹן לֵיהּ לְאִנְתּוּ וִילִידַת לֵיהּ יָת נָדָב וְיָת אֲבִיהוּא יָת אֶלְעָזָר וְיָת אִיתָמָר:", "onk_en": "Aharon took Elisheva, daughter of Aminadav, sister of Nachshon, for a wife, and she bore him Nadav, Avihu, Elazar and Isamar.", "pj": "וּנְסֵיב אַהֲרן יַת אֱלִישֶׁבַע בְּרַת עַמִינָדָב אֲחָתֵיהּ דְנַחֲשׁוֹן לֵיהּ לְאִנְתּוּ וִילֵידַת לֵיהּ יַת נָדָב וְיַת אֲבִיהוּא יַת אֶלְעָזָר וְיַת אִיתָמָר", "pj_en": "And Aharon took Elisheba, daughter of Aminadab, sister of Nachshon, Unto him to wife, and she bare him Nadab and Abihu, Elasar and Ithamar.", "tj": "", "tj_en": "", "rashi": "<b>אחות נחשון.<\/b> מִכָּאן לָמְדוּ, הַנּוֹשֵׂא אִשָּׁה צָרִיךְ לִבְדֹק בְאַחֶיהָ (בבא בתרא ק\"י):", "rashi_en": "אחות נחשון THE SISTER OF NAASHON — Hence they (the Rabbis) learned (i.e. from the fact that Scripture states who her brother was when it mentions her marriage to Aaron) that he who is about to take a wife should strictly investigate who her brothers are (Bava Batra 110a)."}, {"ch": 6, "v": 24, "aliyah": 2, "heb": "וּבְנֵ֣י קֹ֔רַח אַסִּ֥יר וְאֶלְקָנָ֖ה וַאֲבִיאָסָ֑ף אֵ֖לֶּה מִשְׁפְּחֹ֥ת הַקׇּרְחִֽי׃", "onk": "וּבְנֵי קֹרַח אַסִּיר וְאֶלְקָנָה וַאֲבִיאָסָף אִלֵּין זַרְעֲיַת קֹרַח:", "onk_en": "The sons of Korach: Assir, Elkanah and Aviasaf. These are the families of the Korachites.", "pj": "וּבְנוֹי דְקרַח אַסִיר וְאֶלְקָנָה וַאֲבִיאָסָף אִלֵין יֵיחוּסֵי דְקרַח", "pj_en": "And the sons of Korah, Assir, and Elkanah, and Abiasaph: these are the race of Korah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 25, "aliyah": 2, "heb": "וְאֶלְעָזָ֨ר בֶּֽן־אַהֲרֹ֜ן לָקַֽח־ל֨וֹ מִבְּנ֤וֹת פּֽוּטִיאֵל֙ ל֣וֹ לְאִשָּׁ֔ה וַתֵּ֥לֶד ל֖וֹ אֶת־פִּֽינְחָ֑ס אֵ֗לֶּה רָאשֵׁ֛י אֲב֥וֹת הַלְוִיִּ֖ם לְמִשְׁפְּחֹתָֽם׃", "onk": "וְאֶלְעָזָר בַּר אַהֲרֹן נְסִיב לֵיהּ מִבְּנַת פּוּטִיאֵל לֵיהּ לְאִנְתּוּ וִילִידַת לֵיהּ יָת פִּינְחָס אִלֵּין רֵישֵׁי אֲבָהַת לֵיוָאֵי לְזַרְעֲיָתְהוֹן:", "onk_en": "Elazar, son of Aharon took, for himself one of the daughters of Putieil, for a wife, and she bore him Pinchas. These are the heads of the Levites’ patriarchs according to their families.", "pj": "וְאֶלְעָזָר בַּר אַהֲרן נְסִיב לֵיהּ מִבְּרַתּוֹי דְיִתְרוֹ הוּא פּוּטִיאֵל לֵיהּ לְאִנְתּוּ וִילֵידַת לֵיהּ יַת פִּינְחָס אִלֵין רֵישֵׁי אַבְהַת לֵיוָאֵי ְיִיחוּסֵיהוֹן", "pj_en": "And Elasar bar Aharon took unto him a wife from the daughters of Jethro who is Putiel, and she bare him Phinehas. These are the heads of the fathers of the Levites, according to their generations.", "tj": "", "tj_en": "", "rashi": "<b>מבנות פוטיאל.<\/b> מִזֶּרַע יִתְרוֹ שֶׁפִּטֵּם עֲגָלִים לַעֲ\"זָ, וּמִזֶּרַע יוֹסֵף שֶׁפִּטְפֵּט בְּיִצְרוֹ (סוטה מ\"ג):", "rashi_en": "מבנות פוטיאל ONE OF THE DAUGHTERS OF PUTIEL — of the family of Jethro (cf. Rashi on Exodus 4:18) who used to fatten (פטם) calves for idolatrous sacrifice, and of the family of Joseph who overcame (פטפט, who talked or argued with) his passion (Sotah 43a; Bava Batra 109b)."}, {"ch": 6, "v": 26, "aliyah": 2, "heb": "ה֥וּא אַהֲרֹ֖ן וּמֹשֶׁ֑ה אֲשֶׁ֨ר אָמַ֤ר יְהֹוָה֙ לָהֶ֔ם הוֹצִ֜יאוּ אֶת־בְּנֵ֧י יִשְׂרָאֵ֛ל מֵאֶ֥רֶץ מִצְרַ֖יִם עַל־צִבְאֹתָֽם׃", "onk": "הוּא אַהֲרֹן וּמשֶׁה דִּי אֲמַר יְיָ לְהוֹן אַפִּיקוּ יָת בְּנֵי יִשְׂרָאֵל מֵאַרְעָא דְמִצְרַיִם עַל חֵילֵיהוֹן:", "onk_en": "This is [the lineage of] Aharon and Moshe to whom Adonoy had said, “Bring the B’nei Yisrael out of the land of Egypt with their multitudes.”", "pj": "אִיהוּ אַהֲרן וּמשֶׁה דַאֲמַר יְיָ לְהוֹן הַנְפִּיקוּ יַת בְּנֵי יִשְרָאֵל פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם עַל חֵילֵיהוֹן", "pj_en": "These are Aharon and Mosheh, to whom the Lord said, Bring forth the sons of Israel free from the land of Mizraim, according to their hosts;", "tj": "", "tj_en": "", "rashi": "<b>הוא אהרן ומשה.<\/b> אֵלּוּ שֶׁהֻזְכְּרוּ לְמַעְלָה, שֶׁיָּלְדָה יוֹכֶבֶד לְעַמְרָם. <b>הוא אהרן ומשה.<\/b> יֵשׁ מְקוֹמוֹת שֶׁמַּקְדִּים אַהֲרֹן לְמֹשֶׁה וְיֵשׁ מְקוֹמוֹת שֶׁמַּקְדִּים מֹשֶׁה לְאַהֲרֹן, לוֹמַר לְךָ שֶׁשְּׁקוּלִין כְּאֶחָד:<br><br><b>על צבאתם.<\/b> בְּצִבְאוֹתָם, כָּל צְבָאָם לְשִׁבְטֵיהֶם; יֵשׁ עַל שֶׁאֵינוֹ אֶלָּא בִמְקוֹם אוֹת אַחַת, \"וְעַל חַרְבְּךָ תִחְיֶה\" (בראשית כ\"ז), כְּמוֹ בְּחַרְבְּךָ, \"עֲמַדְתֶּם עַל חַרְבְּכֶם\" (יחזקאל ל\"ג) – בְּחַרְבְּכֶם:", "rashi_en": "הוא אהרן ומשה THESE ARE THAT AARON AND MOSES who are mentioned above where it states (v. 20) that Jochebed bore them to Amram. הוא אהרן ומשה There are some passages where Scripture mentions Aaron before Moses (as here) and other passages where it mentions Moses before Aaron; this is done in order to indicate that they were equal in all respects (more lit., that they weighed alike) (Mekhilta).<br><br>על צבאתם — This is the same as בצבאותם with their hosts — all their hosts according to their tribes. Sometimes the word על is merely used in place of a single letter (ב as a prefix); e. g., (Genesis 27:40) “על חרבך shalt thou live” which is the same as בחרבך, by thy sword; (Ezekiel 33:26) “Ye stand על חרבכם” which is the same as בחרבכם, by your sword."}, {"ch": 6, "v": 27, "aliyah": 2, "heb": "הֵ֗ם הַֽמְדַבְּרִים֙ אֶל־פַּרְעֹ֣ה מֶֽלֶךְ־מִצְרַ֔יִם לְהוֹצִ֥יא אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל מִמִּצְרָ֑יִם ה֥וּא מֹשֶׁ֖ה וְאַהֲרֹֽן׃", "onk": "אִנּוּן דְּמַלְּלִין עִם פַּרְעֹה מַלְכָּא דְמִצְרַיִם לְאַפָּקָא יָת בְּנֵי יִשְׂרָאֵל מִמִּצְרָיִם הוּא משֶׁה וְאַהֲרֹן:", "onk_en": "They are the ones who spoke to Pharaoh, king of Egypt, to bring the B’nei Yisrael out of Egypt. These are Moshe and Aharon.", "pj": "הִינוּן דְמַלְלִין עִם פַּרְעה מַלְכָּא דְמִצְרַיִם לְהַנְפָּקָא יַת בְּנֵי יִשְרָאֵל מִמְצְרַיִם הוּא משֶׁה נְבִיָא וְאַהֲרן כַּהֲנָא", "pj_en": "-these are they who spake with Pharoh, king of Mizraim, that he should send out the sons of Israel from Mizraim; it is Mosheh the prophet, and Aharon the priest.", "tj": "", "tj_en": "", "rashi": "<b>הם המדברים וגו'.<\/b> הֵם שֶׁנִּצְטַוּוּ, הֵם שֶׁקִּיְּמוּ:<br><br><b>הוא משה ואהרן.<\/b> הֵם בִּשְׁלִיחוּתָם וּבְצִדְקָתָם מִתְּחִלָּה וְעַד סוֹף (מגילה י\"א):", "rashi_en": "הם המדברים וגו׳ THESE ARE THEY WHO SPAKE TO PHARAOH — It was they who received the command to speak to Pharaoh (cf. v. 26), and it was they who carried it out by actually speaking to him (cf. e.g. Exodus 7:7).<br><br>הוא משה ואהרן THESE ARE MOSES AND AARON — they remained always the same in carrying out their mission and in their integrity from beginning to end (cf. Megillah 11a)."}, {"ch": 6, "v": 28, "aliyah": 2, "heb": "וַיְהִ֗י בְּי֨וֹם דִּבֶּ֧ר יְהֹוָ֛ה אֶל־מֹשֶׁ֖ה בְּאֶ֥רֶץ מִצְרָֽיִם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲוָה בְּיוֹמָא דְמַלִּיל יְיָ עִם משֶׁה בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "It was the day when Adonoy spoke to Moshe in the land of Egypt.", "pj": "וַהֲוָה בְּיוֹמָא דְמַלֵיל יְיָ עִם משֶׁה בְּאַרְעָא דְמִצְרַיִם הֲוָה אַהֲרן מָצִית אוּדְנֵיהּ וְשָׁמַע מַה דְמַלֵיל עִמֵיהּ", "pj_en": "And it was in the day when the Lord spake with Mosheh in the land of Mizraim, that Aharon gave a listening ear, and heard what He spake with him.", "tj": "", "tj_en": "", "rashi": "<b>ויהי ביום דבר וגו'.<\/b> מְחֻבָּר לַמִּקְרָא שֶׁלְּאַחֲרָיו:", "rashi_en": "And it came to pass on the day that the Lord spoke unto Moses in the land of Egypt: [This is connected with the following verse]"}, {"ch": 6, "v": 29, "aliyah": 3, "heb": "וַיְדַבֵּ֧ר יְהֹוָ֛ה אֶל־מֹשֶׁ֥ה לֵּאמֹ֖ר אֲנִ֣י יְהֹוָ֑ה דַּבֵּ֗ר אֶל־פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כׇּל־אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽיךָ׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימַר אֲנָא יְיָ מַלֵּל עִם פַּרְעֹה מַלְכָּא דְמִצְרַיִם יָת כָּל דִּי אֲנָא מְמַלֵּל עִמָּךְ:", "onk_en": "Adonoy spoke to Moshe saying, “I am Adonoy. Speak to Pharaoh, king of Egypt, all that I am speaking to you.”", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר אֲנָא הוּא יְיָ מַלֵיל עִם פַרְעה מַלְכָּא דְמִצְרַיִם יַת כָּל דַאֲנָא מְמַלֵיל עִמָךְ", "pj_en": "And the Lord spake with Mosheh, and said to him, I am the Lord. Say to Pharoh, king of Mizraim all that I tell thee.", "tj": "", "tj_en": "", "rashi": "<b>וידבר ה'.<\/b> הוּא הַדִּבּוּר עַצְמוֹ הָאָמוּר לְמַעְלָה <b>בא דבר אל פרעה מלך מצרים<\/b>, אֶלָּא מִתּוֹךְ שֶׁהִפְסִיק הָעִנְיָן כְּדֵי לְיַחֲסָם, חָזַר עָלָיו לְהַתְחִיל בּוֹ:<br><br><b>אני ה'.<\/b> כְּדַאי אֲנִי לְשָׁלְחֲךָ וּלְקַיֵּם דִּבְרֵי שְׁלִיחוּתִי:", "rashi_en": "וידבר ה׳ AND THE LORD SPAKE — This is the self-same command which was mentioned before, viz., (v. 11) “Go in, speak unto Pharaoh, king of Egypt”, but because it (Scripture) broke off the narrative in order to record their genealogy it now reverts to it and begins it anew.<br><br>אני ה׳ I AM THE LORD — I am powerful enough to send you and to carry out the matter on which I have sent you."}, {"ch": 6, "v": 30, "aliyah": 3, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה לִפְנֵ֣י יְהֹוָ֑ה הֵ֤ן אֲנִי֙ עֲרַ֣ל שְׂפָתַ֔יִם וְאֵ֕יךְ יִשְׁמַ֥ע אֵלַ֖י פַּרְעֹֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר משֶׁה קֳדָם יְיָ הָא אֲנָא <b>יַקִּיר מַמְלָל<\/b> וְאֶכְדֵּין <b>יְקַבֵּל<\/b> מִנִּי פַּרְעֹה:", "onk_en": "Moshe said before Adonoy, “Behold, I have covered lips [<b>am heavy of speech<\/b>]. How will Pharaoh listen to [<b>accept<\/b>] me?”", "pj": "וַאֲמַר משֶׁה קֳדָם יְיָ הָאֲנָא קָשֵׁי מַמְלֵל וְאֵכְדֵין יְקַבֵּל מִנִי פַּרְעה", "pj_en": "And Mosheh said before the Lord, Behold, I am difficult in speaking; how then will Pharoh hearken to me?", "tj": "", "tj_en": "", "rashi": "<b>ויאמר משה לפני ה'.<\/b> הִיא הָאֲמִירָה שֶׁאָמַר לְמַעְלָה <b>הן בני ישראל לא שמעו אלי<\/b>, וְשָׁנָה הַכָּתוּב כָּאן, כֵּיוָן שֶׁהִפְסִיק הָעִנְיָן; וְכֵן הִיא הַשִּׁיטָה, כְּאָדָם הָאוֹמֵר \"נַחֲזֹר עַל הָרִאשׁוֹנוֹת\":", "rashi_en": "ויאמר משה לפני ה׳ AND MOSES SAID BEFORE THE LORD — This is the statement which he made above, (v. 12), “Behold, the children of Israel have not hearkened unto me”. Scripture repeats it here, because it broke off the narrative for the reason already given. So is the method of the historian — just as a person who says, “let us return to the previous subject”."}, {"ch": 7, "v": 1, "aliyah": 3, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥יךָ אֱלֹהִ֖ים לְפַרְעֹ֑ה וְאַהֲרֹ֥ן אָחִ֖יךָ יִהְיֶ֥ה נְבִיאֶֽךָ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה חֲזֵי <b>מַנֵּיתָךְ רַב<\/b> לְפַרְעֹה וְאַהֲרֹן אָחוּךְ יְהֵי מְתֻרְגְּמָנָךְ:", "onk_en": "Adonoy said to Moshe, “See, I have made [<b>appointed<\/b>] you a god [<b>master<\/b>] to Pharaoh, and Aharon, your brother will be your spokesman.", "pj": "וַאֲמַר יְיָ לְמשֶׁה לְמָא אַנְתְּ מִסְתְּפֵי חָמֵי דִכְבַר שַׁוִית יָתָךְ דְחִילָא לְפַרְעה כְּאִילוּ אֱלָהָא דִילֵיהּ וְאַהֲרן אָחוּךְ יְהֵא נְבִיָא דִילָךְ", "pj_en": "But the Lord said to Mosheh, Wherefore art thou fearful? Behold, I have set thee a terror to Pharoh, as if thou wast his God, and Aharon thy brother shall be thy prophet.", "tj": "", "tj_en": "", "rashi": "<b>נתתיך אלהים לפרעה.<\/b> שׁוֹפֵט וְרוֹדֶה, לִרְדּוֹתוֹ בְמַכּוֹת וְיִסּוּרִין:<br><br><b>יהיה נביאך.<\/b> כְּתַרְגּוּמוֹ – \"מְתֻרְגְּמָנָךְ\". וְכֵן כָּל לְשׁוֹן נְבוּאָה אָדָם הַמַּכְרִיז וּמַשְׁמִיעַ לָעָם דִּבְרֵי תוֹכָחוֹת, וְהוּא מִגִּזְרַת \"נִיב שְׂפָתָיִם\" (ישעיהו נ\"ז), \"יָנוּב חָכְמָה\" (משלי י'), \"וַיְכַל מֵהִתְנַבּוֹת\" דִּשְׁמוּאֵל (א' י'); וּבְלַעַז קוֹרְאִין לוֹ פרידיכ\"ר:", "rashi_en": "נתתיך אלהים לפרעה This signifies I have made thee a judge and castigator — to castigate him with plagues and pains.<br><br>יהיה נביאך [AARON] SHALL BE THY PROPHET — This must be understood as the Targum takes it: thy interpreter. Similarly, wherever this term of נבואה is mentioned it refers to a man who publicly proclaims and utters to the people words of reproof. It is of the same derivation as, (Isaiah 57:19) “utterance (ניב) of the lips”; (Proverbs 10:31) “it utters (ינוב) wisdom”; (I Samuel 10:13) “he made an end of proclaiming (התנבות)”, which is in the book of Samuel. In old French we call him predicar; English preacher."}, {"ch": 7, "v": 2, "aliyah": 3, "heb": "אַתָּ֣ה תְדַבֵּ֔ר אֵ֖ת כׇּל־אֲשֶׁ֣ר אֲצַוֶּ֑ךָּ וְאַהֲרֹ֤ן אָחִ֙יךָ֙ יְדַבֵּ֣ר אֶל־פַּרְעֹ֔ה וְשִׁלַּ֥ח אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל מֵאַרְצֽוֹ׃", "onk": "אַתְּ תְּמַלֵּל יָת כָּל דִּי אֲפַקְּדִנָּךְ וְאַהֲרֹן אָחוּךְ יְמַלֵּל עִם פַּרְעֹה וִישַׁלַּח יָת בְּנֵי יִשְׂרָאֵל מֵאַרְעֵיהּ:", "onk_en": "You will speak all that I command you and Aharon, your brother, will speak to Pharaoh, that he send the B’nei Yisrael out of his land.", "pj": "אַנְתְּ תְּמַלֵיל לְאַהֲרן יַת כָּל דְאִיפַקְדִינָךְ וְאַהֲרן אָחוּךְ יְמַלֵיל לְפַרְעה וְיִפְטוֹר יַת בְּנֵי יִשְרָאֵל מֵאַרְעֵיהּ", "pj_en": "Thou shalt speak to Aharon that which I command thee, and Aharon thy brother shall speak to Pharoh, that he release the sons of Israel from his land.", "tj": "", "tj_en": "", "rashi": "<b>אתה תדבר.<\/b> פַּעַם אַחַת כָּל שְׁלִיחוּת וּשְׁלִיחוּת כְּפִי שֶׁשְּׁמַעְתּוֹ מִפִּי, וְאַהֲרֹן אָחִיךָ יַמְלִיצֶנּוּ וְיַטְעִימֶנּוּ בְּאָזְנֵי פַרְעֹה:", "rashi_en": "אתה תדבר THOU SHALT SPEAK once, every separate message just as you have heard it from My mouth, and your brother Aaron shall express it in eloquent language and explain it in Pharaoh’s hearing."}, {"ch": 7, "v": 3, "aliyah": 3, "heb": "וַאֲנִ֥י אַקְשֶׁ֖ה אֶת־לֵ֣ב פַּרְעֹ֑ה וְהִרְבֵּיתִ֧י אֶת־אֹתֹתַ֛י וְאֶת־מוֹפְתַ֖י בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲנָא אַקְשֵׁי יָת לִבָּא דְפַרְעֹה וְאַסְגֵּיתִי יָת אַתְוָתַי וְיָת מוֹפְתַי בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "I will harden Pharaoh’s heart, [in order to] increase My signs and wonders in the land of Egypt.", "pj": "וַאֲנָא אַקְשֵׁי יַת יִצְרָא דְלִבָּא דְפַרְעה וְאַסְגֵי יַת אַתְוָותַי וְיַת תִמְהַיַי בְּאַרְעָא דְמִצְרָיִם", "pj_en": "But I will harden the disposition of Pharoh's heart to multiply My signs and My wonders in the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ואני אקשה.<\/b> מֵאַחַר שֶׁהִרְשִׁיעַ וְהִתְרִיס כְּנֶגְדִּי, וְגָלוּי לְפָנַי שֶׁאֵין נַחַת רוּחַ בָּאֻמּוֹת לָתֵת לֵב שָׁלֵם לָשׁוּב, טוֹב שֶׁיִּתְקַשֶּׁה לִבּוֹ, לְמַעַן הַרְבּוֹת בּוֹ אוֹתוֹתַי, וְתַכִּירוּ אַתֶּם אֶת גְּבוּרָתִי. וְכֵן מִדָּתוֹ שֶׁל הַקָּבָּ\"ה, מֵבִיא פֻּרְעָנוּת עַל הָאֻמּוֹת כְּדֵי שֶׁיִּשְׁמְעוּ יִשְׂרָאֵל וְיִירְאוּ, שֶׁנֶּאֱ' \"הִכְרַתִּי גוֹיִם נָשַׁמּוּ פִּנּוֹתָם … אָמַרְתִּי אַךְ תִּירְאִי אוֹתִי תִּקְחִי מוּסָר\" (צפניה ג'); וְאַעַפִּ\"כֵ בְּחָמֵשׁ מַכּוֹת הָרִאשׁוֹנוֹת לֹא נֶאֱמַר וַיְחַזֵּק ה' אֶת לֵב פַּרְעֹה, אֶלָּא וַיֶּחֱזַק לֵב פַּרְעֹה (תנחומא):", "rashi_en": "ואני אקשה AND I WILL ALLOW [PHARAOH’S HEART] TO HARDEN — Since he has wickedly resisted Me, and it is manifest to Me that the heathen nations find no spiritual satisfaction in setting their whole heart to return to Me penitently, it is better that his heart should be hardened in order that My signs may be multiplied against him so that ye may recognise My divine power. Such, indeed, is the method of the Holy One, blessed be He: He brings punishment upon the nations so that Israel may hear of it and fear Him, as it is said, (Zephaniah 3:6, 3:7) “I have cut off nations, their corners are desolate etc. … I said: Surely thou wilt fear Me, thou wilt receive correction” (cf. Yevamot 63a). Nevertheless, in the case of the first five plagues it is not stated, “The Lord hardened Pharaoh’s heart” but “Pharaoh’s heart was hardened” (Midrash Tanchuma, Vaera 3)."}, {"ch": 7, "v": 4, "aliyah": 3, "heb": "וְלֹֽא־יִשְׁמַ֤ע אֲלֵכֶם֙ פַּרְעֹ֔ה וְנָתַתִּ֥י אֶת־יָדִ֖י בְּמִצְרָ֑יִם וְהוֹצֵאתִ֨י אֶת־צִבְאֹתַ֜י אֶת־עַמִּ֤י בְנֵֽי־יִשְׂרָאֵל֙ מֵאֶ֣רֶץ מִצְרַ֔יִם בִּשְׁפָטִ֖ים גְּדֹלִֽים׃", "onk": "וְלָא <b>יְקַבֵּל<\/b> מִנְּכוֹן פַּרְעֹה וְאֶתֵּן יָת <b>מָחַת גְּבֻרְתִּי<\/b> בְּמִצְרָיִם וְאַפֵּיק יָת חֵילִי יָת עַמִּי בְנֵי יִשְׂרָאֵל מֵאַרְעָא דְמִצְרַיִם בְּדִינִין רַבְרְבִין:", "onk_en": "[Thus] Pharaoh will not listen to [<b>accept<\/b>] you. But then I will display My hand [<b>the blow of My power<\/b>] against Egypt, and I will bring My multitude, My people, the B’nei Yisrael out of the land of Egypt with great acts of judgment.", "pj": "וְלָא יְקַבֵּל מִנְכוֹן פַּרְעה וְאִיגָרֵי בְּהוֹן גִירִין דִקְטוֹל וְאֶתֵּן מְחַת גְבוּרַת יְדִי בְּמִצְרָיִם וְאַפֵּיק יַת עַמִי בְּנֵי יִשְרָאֵל פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם בְּדִינִין רַבְרְבִין", "pj_en": "Nor will Pharoh hearken to you. But I will shoot among them the arrows of death, and inflict the plagues of My mighty hand upon Mizraim, and will bring out the sons of Israel free from among them.", "tj": "", "tj_en": "", "rashi": "<b>את ידי.<\/b> יָד מַמָּשׁ, לְהַכּוֹת בָּהֶם:", "rashi_en": "את ידי this must be translated literally, “hand”, (not “power”) I will lay My hand upon Egypt to smite them."}, {"ch": 7, "v": 5, "aliyah": 3, "heb": "וְיָדְע֤וּ מִצְרַ֙יִם֙ כִּֽי־אֲנִ֣י יְהֹוָ֔ה בִּנְטֹתִ֥י אֶת־יָדִ֖י עַל־מִצְרָ֑יִם וְהוֹצֵאתִ֥י אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל מִתּוֹכָֽם׃", "onk": "וְיִדְּעוּן מִצְרַיִם אֲרֵי אֲנָא יְיָ כַּד אָרֵים יָת <b>מָחַת גְּבֻרְתִּי<\/b> עַל מִצְרָיִם וְאַפֵּיק יָת בְּנֵי יִשְׂרָאֵל מִבֵּינֵיהוֹן:", "onk_en": "Egypt will then know that I am Adonoy when I send forth My hand [<b>the blow of My power<\/b>] over Egypt and bring out the B’nei Yisrael from among them.”", "pj": "וְיִנְדְעוּן מִצְרָאֵי אֲרוּם אֲנָא הוּא יְיָ כַּד אָרִים יַת מְחַת גְבוּרְתִּי עַל מִצְרָיִם וְאַנְפֵּיק יַת בְּנֵי יִשְרָאֵל פְּרִיקִין מִבֵּינֵיהוֹן", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 6, "aliyah": 3, "heb": "וַיַּ֥עַשׂ מֹשֶׁ֖ה וְאַהֲרֹ֑ן כַּאֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֹתָ֖ם כֵּ֥ן עָשֽׂוּ׃", "onk": "וַעֲבַד משֶׁה וְאַהֲרֹן כְּמָא דִפַקִּיד יְיָ יָתְהוֹן כֵּן עֲבָדוּ:", "onk_en": "Moshe and Aharon did so. They did exactly as Adonoy commanded them.", "pj": "וַעֲבַד משֶׁה וְאַהֲרן הֵיכְמָא דְפַקֵיד יְיָ יַתְהוֹן הֵיכְדֵין עָבָדוּ", "pj_en": "And Mosheh and Aharon did as the Lord commanded them, even so did they.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 7, "aliyah": 3, "heb": "וּמֹשֶׁה֙ בֶּן־שְׁמֹנִ֣ים שָׁנָ֔ה וְאַֽהֲרֹ֔ן בֶּן־שָׁלֹ֥שׁ וּשְׁמֹנִ֖ים שָׁנָ֑ה בְּדַבְּרָ֖ם אֶל־פַּרְעֹֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמשֶׁה בַּר תְּמָנָן שְׁנִין וְאַהֲרֹן בַּר תְּמָנָן וּתְלָת שְׁנִין בְּמַלָּלוּתְהוֹן עִם פַּרְעֹה:", "onk_en": "Moshe was eighty years old and Aharon was eighty-three years old when they spoke to Pharaoh.", "pj": "וּמשֶׁה בַּר תַּמְנָן שְׁנִין וְאַהֲרן בַּר תַּמְנָן וּתְלַת שְׁנִין בְּמַלָלוּתְהוֹן עִם פַּרְעה", "pj_en": "And Mosheh was the son of eighty years, and Aharon the son of eighty and three years, at their speaking with Pharoh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 8, "aliyah": 4, "heb": "וַיֹּ֣אמֶר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy said to Moshe and Aharon, saying:", "pj": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרן לְמֵימָר", "pj_en": "And the Lord spake to Mosheh and to Aharon, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 9, "aliyah": 4, "heb": "כִּי֩ יְדַבֵּ֨ר אֲלֵכֶ֤ם פַּרְעֹה֙ לֵאמֹ֔ר תְּנ֥וּ לָכֶ֖ם מוֹפֵ֑ת וְאָמַרְתָּ֣ אֶֽל־אַהֲרֹ֗ן קַ֧ח אֶֽת־מַטְּךָ֛ וְהַשְׁלֵ֥ךְ לִפְנֵֽי־פַרְעֹ֖ה יְהִ֥י לְתַנִּֽין׃", "onk": "אֲרֵי יְמַלֵּל לְוָתְכוֹן פַּרְעֹה לְמֵימַר הָבוּ לְכוֹן אָתָא וְתֵימַר לְאַהֲרֹן סַב יָת חוּטְרָךְ וּרְמֵי קֳדָם פַּרְעֹה יְהִי לְתַנִּינָא:", "onk_en": "“When Pharaoh speaks to you, saying, ‘Give yourselves [credibility by displaying] a marvel;’ you [Moshe] should then say to Aharon, ‘Take your rod and throw it down before Pharaoh.’ It will become a serpent.’”", "pj": "אֲרוּם יְמַלֵיל עִמְכוֹן פַּרְעה לְמֵימַר הָבוּ לְכוֹן תִּימְהָא וְתֵימַר לְאַהֲרן סַב יַת חוּטְרָךְ וּטְלוֹק יָתֵיהּ קֳדָם פַּרְעה יְהֵי לְחִיוִי חוּרְמַן אֲרוּם עֲתִידִין כָּל דַיְירֵי אַרְעָא לְמִשְׁמַע קַל צְוָוחַתְהוֹן דְמִצְרַיִם בְּתַבְרוּתִי יַתְהוֹן הֵיכְמָא דִשְׁמָעַן כָל בִּרְיָיתָא יַת קַל צְוָוחַת חִוְיָא כַּד אִיתְעַרְטִיל מִן שֵׁירוּיָא", "pj_en": "When Pharoh talketh with you, saying, Give us a miracle, thou shalt say to Aharon, Take thy rod, and cast it down before Pharoh, and it shall become a basilisk-serpent; for all the inhabiters of the earth shall hear the voice of the shriek of Mizraim when I shatter them, as all the creatures heard the shriek of the serpent when made naked at the beginning.", "tj": "וּטְלַק קֳדָם פַּרְעה:", "tj_en": "And throw down before Pharoh.", "rashi": "<b>מופת.<\/b> אוֹת, לְהוֹדִיעַ שֶׁיֵּשׁ צְרוֹךְ בְּמִי שֶׁשּׁוֹלֵחַ אֶתְכֶם:", "rashi_en": "מופת A WONDER — a sign to prove that there is power in Him who is sending you."}, {"ch": 7, "v": 10, "aliyah": 4, "heb": "וַיָּבֹ֨א מֹשֶׁ֤ה וְאַהֲרֹן֙ אֶל־פַּרְעֹ֔ה וַיַּ֣עֲשׂוּ כֵ֔ן כַּאֲשֶׁ֖ר צִוָּ֣ה יְהֹוָ֑ה וַיַּשְׁלֵ֨ךְ אַהֲרֹ֜ן אֶת־מַטֵּ֗הוּ לִפְנֵ֥י פַרְעֹ֛ה וְלִפְנֵ֥י עֲבָדָ֖יו וַיְהִ֥י לְתַנִּֽין׃", "onk": "וְעַל משֶׁה וְאַהֲרֹן לְוָת פַּרְעֹה וַעֲבָדוּ כֵן כְּמָא דְּפַקֵּיד יְיָ וּרְמָא אַהֲרֹן יָת חוּטְרֵיהּ קֳדָם פַּרְעֹה וְקָדָם עַבְדּוֹהִי וַהֲוָה לְתַנִּינָא:", "onk_en": "Moshe and Aharon came to Pharaoh and they did exactly as Adonoy commanded [them]. Aharon threw his rod before Pharaoh and before his servants and it became a serpent.", "pj": "וְאָעֵל משֶׁה וְאַהֲרן לְוַת פַּרְעה וְעָבָדוּ הֵיכְדֵין הֵיכְמָא דְפַקֵיד יְיָ וּטְלַק אַהֲרן יַת חוּטְרֵיהּ קֳדָם מֵיחְמֵי פַּרְעה וְקָדָם מֵיחְמֵי עַבְדוֹי וַהֲוָה לְחוּרְמָנָא", "pj_en": "And Mosheh and Aharon went in unto Pharoh, and did as the Lord had commanded. And Aharon threw down the rod before the sight of Pharoh, and before the sight of his servants, and it became a basilisk.", "tj": "", "tj_en": "", "rashi": "<b>לתנין.<\/b> נָחָשׁ:", "rashi_en": "לתנין means A SERPENT."}, {"ch": 7, "v": 11, "aliyah": 4, "heb": "וַיִּקְרָא֙ גַּם־פַּרְעֹ֔ה לַֽחֲכָמִ֖ים וְלַֽמְכַשְּׁפִ֑ים וַיַּֽעֲשׂ֨וּ גַם־הֵ֜ם חַרְטֻמֵּ֥י מִצְרַ֛יִם בְּלַהֲטֵיהֶ֖ם כֵּֽן׃", "onk": "וּקְרָא אַף פַּרְעֹה לְחַכִּימַיָּא וּלְחָרָשַׁיָּא וַעֲבָדוּ אַף אִנּוּן חָרָשֵׁי מִצְרַיִם בְּלַחֲשֵׁיהוֹן כֵּן:", "onk_en": "Pharaoh too called [his] wise men and magicians. The sorcerers of Egypt also did likewise with their magic art.", "pj": "וּקְרָא לְחוֹד פַּרְעה לְחַכִּימַיָא וּלְחַרְשַׁיָא וַעֲבָדוּ לְחוֹד הִינוּן יֵנִיס וְיִמְבְּרֵיס חַרְשִׁין דִבְמִצְרַיִם בְּלַחֲשֵׁי קוּסְמֵיהוֹן הֵיכְדֵין", "pj_en": "But Pharoh called the hachems and magicians; and they also, Janis and Jamberes, magicians of Mizraim, did the same by their burnings of divination.", "tj": "", "tj_en": "", "rashi": "<b>בלהטיהם.<\/b> בְּלַחֲשֵׁיהוֹן; וְאֵין לוֹ דִּמְיוֹן בַּמִּקְרָא; וְיֵשׁ לְדַמּוֹת לוֹ \"לַהַט הַחֶרֶב הַמִּתְהַפֶּכֶת\" (בראשית ג') – דּוֹמֶה שֶׁהִיא מִתְהַפֶּכֶת עַל יְדֵי לַחַשׁ:", "rashi_en": "בלהטיהם The Targum renders this by בלחשיהון: with their secret spells. There is no other example of this word in the Bible. One may compare it to the first word in (Genesis 3:24) “the להט of the sword that turned round” — it appeared to turn round through some magic spell."}, {"ch": 7, "v": 12, "aliyah": 4, "heb": "וַיַּשְׁלִ֙יכוּ֙ אִ֣ישׁ מַטֵּ֔הוּ וַיִּהְי֖וּ לְתַנִּינִ֑ם וַיִּבְלַ֥ע מַטֵּֽה־אַהֲרֹ֖ן אֶת־מַטֹּתָֽם׃", "onk": "וּרְמוֹ גְּבַר חוּטְרֵיהּ וַהֲווֹ לְתַנִּינַיָּא וּבְלַע חֻטְרָא דְאַהֲרֹן יָת חֻטְרֵיהוֹן:", "onk_en": "When each man threw down his rod they (the rods) became serpents, and Aharon’s rod swallowed their rods.", "pj": "וּטְלָקוּן אֵינַשׁ חוּטְרֵיהּ וַהֲווֹ לְחָרְמָנִין וּמִן יַד אִתְהֲפִּיכוּ לְמֶהֱוֵי כְּמִן שֵׁירוּיָא וּבְלַע חוּטְרָא דְאַהֲרן יַת חוּטְרֵיהוֹן", "pj_en": "They threw down each man his rod, and they became basilisks; but were forthwith changed to be what they were at first; and the rod of Aharon swallowed up their rods.", "tj": "", "tj_en": "", "rashi": "<b>ויבלע מטה אהרן.<\/b> מֵאַחַר שֶׁחָזַר וְנַעֲשָׂה מַטֶּה, בָּלַע אֶת כֻּלָּן (שבת צ\"ז):", "rashi_en": "ויבלע מטה אהרן BUT AARON’S STAFF SWALLOWED (It states that the staff swallowed) — after it had again become a staff it swallowed all of them (Shabbat 97 a; Exodus Rabbah 9:7)."}, {"ch": 7, "v": 13, "aliyah": 4, "heb": "וַיֶּֽחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְלֹ֥א שָׁמַ֖ע אֲלֵהֶ֑ם כַּאֲשֶׁ֖ר דִּבֶּ֥ר יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִתַּקַּף לִבָּא דְפַרְעֹה וְלָא <b>קַבִּיל<\/b> מִנְּהוֹן כְּמָא דִּמַלִּיל יְיָ:", "onk_en": "Pharaoh’s heart [remained] hard and he did not listen to [<b>accept<\/b>] them, just as Adonoy had foretold.", "pj": "וְאִיתְקַף יִצְרָא דְלִבָּא דְפַרְעה וְלָא קַבֵּיל מִנְהוֹן הֵיכְמָא דְמַלֵל יְיָ", "pj_en": "And the disposition Pharoh's heart was hardened, and he would not hearken to them, as the Lord had said.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 14, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְשַׁלַּ֥ח הָעָֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אִתְיַקַּר (<small>לפרש\"י<\/small> יַקִּיר) לִבָּא דְפַרְעֹה סָרִיב לְשַׁלָּחָא עַמָּא:", "onk_en": "Adonoy said to Moshe, “Pharaoh’s heart is heavy [unmoved]. He refuses to let the people go.", "pj": "וַאֲמַר יְיָ לְמשֶׁה אִיתְקַף יִצְרָא דְלִבָּא דְפַרְעה מְסָרֵב לְמִפְטוֹר יַת עַמָא", "pj_en": "And the Lord said to Mosheh, The disposition of Pharoh's heart is obdurated in refusing to release the people.", "tj": "", "tj_en": "", "rashi": "<b>כבד.<\/b> תַּרְגוּמוֹ יַקִּיר וְלֹא אִתְיַקַּר, מִפְּנֵי שֶׁהוּא שֵׁם דָּבָר, כְּמוֹ \"כִּי כָבֵד מִמְּךָ הַדָּבָר\" (שמות י\"ח):", "rashi_en": "כבד — This word should be translated in the Targum by יקיר (his heart is hard — an adjective) and not by אתיקר (his heart has become Hard — a verb, as is given in some editions of Onkelos) because it is an adjective, just as (Exodus 18:18) “the thing is too heavy (כָּבֵד) for thee”."}, {"ch": 7, "v": 15, "aliyah": 4, "heb": "לֵ֣ךְ אֶל־פַּרְעֹ֞ה בַּבֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַמַּ֔יְמָה וְנִצַּבְתָּ֥ לִקְרָאת֖וֹ עַל־שְׂפַ֣ת הַיְאֹ֑ר וְהַמַּטֶּ֛ה אֲשֶׁר־נֶהְפַּ֥ךְ לְנָחָ֖שׁ תִּקַּ֥ח בְּיָדֶֽךָ׃", "onk": "אִזֵּיל לְוָת פַּרְעֹה בְּצַפְרָא הָא נָפֵיק לְמַיָּא וְתִתְעַתַּד לְקַדָּמוּתֵיהּ עַל כֵּיף נַהֲרָא וְחֻטְרָא דְּאִתְהֲפִיךְ לְחִוְיָא תִּסַּב בִּידָךְ:", "onk_en": "Go to Pharaoh in the morning when he goes out to the water, and stand there to meet him by the bank of the river. The rod that was turned into a snake, take in your hand.", "pj": "אִיזֵיל לְוַת פַּרְעה בְּצַפְרָא הָא נָפֵיק לְמִנְטוֹר קוּסְמִין עִילַוֵי מַיָא הֵי כְּאַמְגוֹשָׁא וְתִתְעַתַּד לְקָדָמוּתֵיהּ עַל גֵיף נַהֲרָא וּבְרַם חוּטְרָא דְאַהֲרן דְאִתְהֲפִיךְ לְחִיוֵי תִּיסֵב בִּידָךְ", "pj_en": "Go unto Pharoh in the morning: behold, he cometh forth to observe divinations at the water as a magician; so shalt thou prepare thee to meet him on the bank of the river, and Aharon's rod that was changed to be a serpent thou shalt take in thy hand.", "tj": "לְמִתְקוֹרְרָא עַל מַיָא:", "tj_en": "To refresh himself at the river.", "rashi": "<b>הנה יצא המימה.<\/b> לִנְקָבָיו; שֶׁהָיָה עוֹשֶׂה עַצְמוֹ אֱלוֹהַּ וְאוֹמֵר שֶׁאֵינוֹ צָרִיךְ לִנְקָבָיו, וּמַשְׁכִּים וְיוֹצֵא לַנִּילוּס וְעוֹשֶׂה שָׁם צְרָכָיו (תנחומא):", "rashi_en": "הנה יצא המימה LO, HE GOETH OUT UNTO THE WATER to ease himself. For he claimed to be a god and asserted that because of his divine power he did not need to ease himself; and therefore he used to rise early and go to the Nile and there eased himself in secret (Midrash Tanchuma, Vaera 14; Exodus Rabbah 9:8)."}, {"ch": 7, "v": 16, "aliyah": 4, "heb": "וְאָמַרְתָּ֣ אֵלָ֗יו יְהֹוָ֞ה אֱלֹהֵ֤י הָעִבְרִים֙ שְׁלָחַ֤נִי אֵלֶ֙יךָ֙ לֵאמֹ֔ר שַׁלַּח֙ אֶת־עַמִּ֔י וְיַֽעַבְדֻ֖נִי בַּמִּדְבָּ֑ר וְהִנֵּ֥ה לֹא־שָׁמַ֖עְתָּ עַד־כֹּֽה׃", "onk": "וְתֵימַר לֵיהּ יְיָ אֱלָהָא דִיהוּדָאֵי שַׁלְּחַנִי לְוָתָךְ לְמֵימַר שַׁלַּח יָת עַמִּי וְיִפְלְחוּן <b>קֳדָמַי<\/b> בְּמַדְבְּרָא וְהָא לָא <b>קַבֵּילְתָּא<\/b> עַד כְּעָן:", "onk_en": "Say to him, “Adonoy, God of the Hebrews, sent me to you to say [to you], ‘Send out My people that they may worship [<b>before<\/b>] Me in the wilderness. Behold, thus far you have not listened [<b>accepted<\/b>].", "pj": "וְתֵימַר לֵיהּ יְיָ אֱלָהָא דִיהוּדָאֵי שַׁדְרַנִי לְוָתָךְ לְמֵימַר פְּטוֹר יַת עַמִי וְיִפְלְחוּן קֳדָמַי בְּמַדְבְּרָא וְהָא לָא קַבֵּילְתָּ עַד כְּדוּן", "pj_en": "And thou shalt say to him, The Lord God of the Jehudaee hath sent me unto thee, saying Release My people, that they may serve Me in the desert; and, behold, as yet thou bast not hearkened.", "tj": "", "tj_en": "", "rashi": "<b>עד כה.<\/b> עַד הֵנָּה; וּמִדְרָשׁוֹ: עַד שֶׁתִּשְׁמַע מִמֶּנִּי מַכַּת בְּכוֹרוֹת שֶׁאֶפְתַּח בָּהּ בְּ\"כֹה\" אָמַר ה' כַּחֲצוֹת הַלַּיְלָה (שמות י״א:ד׳):", "rashi_en": "עד כה means UNTIL NOW. A Midrashic explanation (taking this sentence to mean, “thou wilt not hearken until (עד) thou hearest the word “כה”) is: until thou hearest from me the announcement of the slaughter of the first-born, which I will begin with the words, (Exodus 11:4) “Thus (כה) saith the Lord, About midnight etc.”"}, {"ch": 7, "v": 17, "aliyah": 4, "heb": "כֹּ֚ה אָמַ֣ר יְהֹוָ֔ה בְּזֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהֹוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה&thinsp;<b>׀<\/b> בַּמַּטֶּ֣ה אֲשֶׁר־בְּיָדִ֗י עַל־הַמַּ֛יִם אֲשֶׁ֥ר בַּיְאֹ֖ר וְנֶהֶפְכ֥וּ לְדָֽם׃", "onk": "כִּדְנַן אֲמַר יְיָ בְּדָא תִדַּע אֲרֵי אֲנָא יְיָ הָא אֲנָא מָחֵי בְּחֻטְרָא דִּי בִידִי עַל מַיָּא דִּי בְנַהֲרָא וְיִתְהַפְּכוּן לִדְמָא:", "onk_en": "This is what Adonoy has said, ‘By this you will know that I am Adonoy. Behold, with the rod that is in my hand, I will strike the water of the river and it will turn into blood.", "pj": "כִּדְנָא אֲמַר יְיָ בְּדָא סִימָנָא תִנְדַע אֲרוּם אֲנָא יְיָ הָא אֲנָא מָחֵי בְּחוּטְרָא דְבִידִי עַל מוֹי דִי בְנַהֲרָא וְיִתְהַפְּכִין לְאַדְמָא", "pj_en": "Thus saith the Lord: By this sign thou shalt know that I am the Lord. Behold, with the rod that is in my hand, I will smite the waters of the river, and they shall be changed into blood.", "tj": "", "tj_en": "", "rashi": "<b>ונהפכו לדם.<\/b> לְפִי שֶׁאֵין גְּשָׁמִים יוֹרְדִים בְּמִצְרַיִם וְנִילוּס עוֹלֶה וּמַשְׁקֶה אֶת הָאָרֶץ וּמִצְרַיִם עוֹבְדִים לַנִּילוּס, לְפִיכָךְ הִלְקָה אֶת יִרְאָתָם וְאַחַ\"כָּ הִלְקָה אוֹתָם (תנחומא):", "rashi_en": "ונהפכו לדם AND THEY SHALL BE TURNED INTO BLOOD — Because rain does not fall in Egypt but the Nile rises and irrigates the land and the Egyptians on this account worshipped the Nile, therefore God first smote their deity and afterwards smote them (Exodus Rabbah 9:9)."}, {"ch": 7, "v": 18, "aliyah": 4, "heb": "וְהַדָּגָ֧ה אֲשֶׁר־בַּיְאֹ֛ר תָּמ֖וּת וּבָאַ֣שׁ הַיְאֹ֑ר וְנִלְא֣וּ מִצְרַ֔יִם לִשְׁתּ֥וֹת מַ֖יִם מִן־הַיְאֹֽר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְנוּנֵי דִי בְנַהֲרָא תְּמוּת וּסְרִי נַהֲרָא וְיִלְאוּן מִצְרָאֵי לְמִשְׁתֵּי מַיָּא מִן נַהֲרָא:", "onk_en": "The fish that is in the river will die, and the river will become polluted. The Egyptians will weary themselves [trying to purify] drinking water from the river.’”", "pj": "וְנוּנֵי דִבְנַהֲרָא יְמוּתִין וְיִסְרֵי נַהֲרָא וְיִשְׁתַּלְהוֹן מִצְרָאֵי לְמִשְׁתֵּי מוֹי מִן נַהֲרָא", "pj_en": "And the fish that are in the river shall die, and the river become foul, and the Mizraee shall desist from drinking water from the river.", "tj": "", "tj_en": "", "rashi": "<b>ונלאו מצרים.<\/b> לְבַקֵּשׁ רְפוּאָה לְמֵי הַיְאוֹר שֶׁיִּהְיוּ רְאוּיִין לִשְׁתּוֹת:", "rashi_en": "ונלאו מצרים THE EGYPTIANS SHALL WEARY THEMSELVES in seeking a cure for the waters of the river that they may become fitted for drinking."}, {"ch": 7, "v": 19, "aliyah": 4, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל־אַהֲרֹ֡ן קַ֣ח מַטְּךָ֣ וּנְטֵֽה־יָדְךָ֩ עַל־מֵימֵ֨י מִצְרַ֜יִם עַֽל־נַהֲרֹתָ֣ם&thinsp;<b>׀<\/b> עַל־יְאֹרֵיהֶ֣ם וְעַל־אַגְמֵיהֶ֗ם וְעַ֛ל כׇּל־מִקְוֵ֥ה מֵימֵיהֶ֖ם וְיִֽהְיוּ־דָ֑ם וְהָ֤יָה דָם֙ בְּכׇל־אֶ֣רֶץ מִצְרַ֔יִם וּבָעֵצִ֖ים וּבָאֲבָנִֽים׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֱמַר לְאַהֲרֹן טוֹל חֻטְרָךְ וַאֲרֵים יְדָךְ עַל מַיָּא דְמִצְרַיִם עַל נַהֲרֵיהוֹן עַל אֲרִתֵּיהוֹן וְעַל אַגְמֵיהוֹן וְעַל כָּל בֵּית כְּנִישׁוּת מֵימֵיהוֹן וִיהוֹן דְּמָא וִיהֵי דְמָא בְּכָל אַרְעָא דְמִצְרַיִם וּבְמָנֵי אָעָא וּבְמָנֵי אַבְנָא:", "onk_en": "Adonoy said to Moshe, “Say to Aharon, ‘Take your rod and extend your hand over the waters of Egypt—over their rivers, over their canals, over their lakes, and over every place where their water is gathered, and it [the water] will become blood. There will be blood throughout all the land of Egypt, [even] in [vessels] of wood and [vessels] of stone.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֵימַר לְאַהֲרן סַב חוּטְרָךְ וַאֲרֵים יְדָךְ עַל מוֹי דְמִצְרָאֵי עַל נַהֲרֵיהוֹן עַל פַּצִידֵיהוֹן עַל שִׁיקְיֵיהוֹן וְעַל כָּל כְּנִישׁוּת מֵימֵיהוֹן וִיהוֹן דְמָא בְּכָל אַרְעָא דְמִצְרַיִם וּבְמָאנֵי אָעָא וּבְמָאנֵי אַבְנָא", "pj_en": "And the Lord said to Mosheh, Tell Aharon, Take thy rod and stretch forth thy hand over the waters of the Mizraee over their rivers, Over their trenches, over their canals, and over every place for collecting their waters, and they will become blood; and there shall be blood in all the land of Mizraim, and in vessels of wood and in vessels of stone.", "tj": "וּבְעֵצִים וּבְסִיקַיָא:", "tj_en": "In vases.", "rashi": "<b>אמר אל אהרן.<\/b> לְפִי שֶׁהֵגֵן הַיְאוֹר עַל מֹשֶׁה כְּשֶׁנִּשְׁלַךְ לְתוֹכוֹ, לְפִיכָךְ לֹא לָקָה עַל יָדוֹ לֹא בַדָּם וְלֹא בַצְפַרְדְּעִים, וְלָקָה עַל יְדֵי אַהֲרֹן (שמות רבה):<br><br><b>נהרתם.<\/b> הֵם נְהָרוֹת הַמּוֹשְׁכִים, כְּעֵין נְהָרוֹת שֶׁלָּנוּ:<br><br><b>יאריהם.<\/b> הֵם בְּרֵכוֹת נִגָּרִים, הָעֲשׂוּיוֹת בִּידֵי אָדָם מִשְּׂפַת הַנָּהָר לַשָּׂדוֹת, וְנִילוּס מֵימָיו מִתְבָּרְכִים וְעוֹלֶה דֶּרֶךְ הַיְאוֹרִים וּמַשְׁקֶה הַשָּׂדוֹת:<br><br><b>אגמיהם.<\/b> קְבוּצַת מַיִם שֶׁאֵינָן נוֹבְעִין וְאֵין מוֹשְׁכִין, אֶלָּא עוֹמְדִין בְּמָקוֹם אֶחָד, וְקוֹרְין לוֹ אשטנ\"ק:<br><br><b>בכל ארץ מצרים.<\/b> אַף בַּמֶּרְחֲצָאוֹת וּבָאַמְבַּטָּאוֹת שֶׁבַּבָּתִּים:<br><br><b>ובעצים ובאבנים.<\/b> מַיִם שֶׁבִּכְלֵי עֵץ וּבִכְלֵי אֶבֶן:", "rashi_en": "אמר אל אהרן SAY UNTO AARON — Because the river had protected Moses when he was cast into it, therefore it was not smitten by him neither at the plague of blood nor at that of frogs, but it was smitten by Aaron (Exodus Rabbah 9:10).<br><br>נהרתם THEIR STREAMS — These are the flowing rivers, just like our rivers in France.<br><br>יאריהם — These are canals which convey water being made by human agency and extending from the river bank into the fields. The waters of the Nile increase in volume and rise by way of these canals and so irrigate the fields.<br><br>אגמיהם — A collection of waters that neither spring up from beneath the ground nor flow along, but which remain in one spot. In old French they call it étang.<br><br>בכל ארץ מצרים [THERE WILL BE BLOOD] THROUGHOUT ALL THE LAND OF EGYPT— also in their bathing establishments and in the baths in their houses.<br><br>ובעצים ובאבנים — the water which happened to be BOTH IN vessels of WOOD AND in vessels of STONE."}, {"ch": 7, "v": 20, "aliyah": 4, "heb": "וַיַּֽעֲשׂוּ־כֵן֩ מֹשֶׁ֨ה וְאַהֲרֹ֜ן כַּאֲשֶׁ֣ר&thinsp;<b>׀<\/b> צִוָּ֣ה יְהֹוָ֗ה וַיָּ֤רֶם בַּמַּטֶּה֙ וַיַּ֤ךְ אֶת־הַמַּ֙יִם֙ אֲשֶׁ֣ר בַּיְאֹ֔ר לְעֵינֵ֣י פַרְעֹ֔ה וּלְעֵינֵ֖י עֲבָדָ֑יו וַיֵּהָ֥פְכ֛וּ כׇּל־הַמַּ֥יִם אֲשֶׁר־בַּיְאֹ֖ר לְדָֽם׃", "onk": "וַעֲבָדוּ כֵן משֶׁה וְאַהֲרֹן כְּמָא דְּפַקִּיד יְיָ וַאֲרֵים בְּחֻטְרָא וּמְחָא יָת מַיָּא דִּי בְנַהֲרָא לְעֵינֵי פַרְעֹה וּלְעֵינֵי עַבְדּוֹהִי וְאִתְהֲפִיכוּ כָּל מַיָּא דִּי בְנַהֲרָא לִדְמָא:", "onk_en": "Moshe and Aharon did exactly as Adonoy commanded them. He [Aharon] lifted the rod and struck the water in the river before the eyes of Pharaoh and before the eyes of his [Pharaoh’s] servants, and all the water of the river turned into blood.", "pj": "וַעֲבָדוּ הֵיכְדֵין משֶׁה וְאַהֲרן הֵיכְמָא דְפַּקֵיד יְיָ וַאֲרֵים בְּחוּטְרָא וּמְחָא יַת מוֹי דִבְנַהֲרָא לְמֶחֱמֵי פַרְעה וּלְמֶחֱמֵי עַבְדוֹי וְאִיתְהֲפִּיכוּ כָּל מוֹי דִבְנַהֲרָא לְאַדְמָא", "pj_en": "And Mosheh and Aharon did so, as the Lord commanded; and he lifted up the rod, and smote the waters of the river in the sight of Pharoh, and in the sight of his servants; and all the waters of the river were turned into blood;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 21, "aliyah": 4, "heb": "וְהַדָּגָ֨ה אֲשֶׁר־בַּיְאֹ֥ר מֵ֙תָה֙ וַיִּבְאַ֣שׁ הַיְאֹ֔ר וְלֹא־יָכְל֣וּ מִצְרַ֔יִם לִשְׁתּ֥וֹת מַ֖יִם מִן־הַיְאֹ֑ר וַיְהִ֥י הַדָּ֖ם בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְנוּנֵי דִי בְנַהֲרָא מִיתוּ וּסְרִי נַהֲרָא וְלָא יְכִילוּ מִצְרָאֵי לְמִשְׁתֵּי
