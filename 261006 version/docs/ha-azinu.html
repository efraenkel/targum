&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וַֽאֲנִי֙ אַקְנִיאֵ֣ם בְּלֹא־עָ֔ם בְּג֥וֹי נָבָ֖ל אַכְעִיסֵֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִנּוּן אַקְנִיאוּ <b>קֳדָמַי בְּלָא דַחֲלָא<\/b> אַרְגִּיזוּ <b>קֳדָמַי בְּפָלְחַן<\/b> <b>טַעֲוָן<\/b> וַאֲנָא אַקְנִנּוּן בְּלָא עַם בְּעַמָּא <b>טַפְשָׁא<\/b> אַרְגֵּזִנּוּן:", "onk_en": "They have incited [<b>before<\/b>] Me [<b>without fear<\/b>] to vengeance with a non-god—have spited [<b>before<\/b>] Me with their [<b>serving<\/b>] idols; and I will incite them with a non-people, I shall anger them with a faithless [<b>foolish<\/b>] nation.", "pj": "הִינוּן אַקְנוּן קֳדָמוֹי בִּדְלָא אֱלָהָא אַרְגִיזוּ קֳדָמוֹי בְּהַבְלֵיהוֹן וַאֲנָא אַקְנִינוּן בְּאוּמָא דְלָא אוּמָא בְּבַּבְלָאֵי עַמָא טַפְּשָׁא נִרְגוֹז יַתְהוֹן", "pj_en": "They have made Me jealous by that which is not God, they have angered Me by their vanities: I also will provoke them to jealousy by a people which hath not been a people, by the foolish Babylonian people will I provoke them.", "tj": "אִינוּן אַקְנוּן יָתִי בְּטַעֲוָון דְלָא מַה אַכְעִיסוּ קֳדָמוֹי בְּמֶרְחֲקַתְהוֹן וַאֲנָא אַקְנֵי יַתְהוֹן בְּאוּמָא דְלָא אוּמָא בְּאוּמָא טִפְּשָׁא אַכְעִיס יַתְהוֹן:", "tj_en": "They have moved Me to jealousy by their idols in which there is nothing whatever, they have provoked Me by their abominations; but I also will move them to jealousy by a people which is not a people, by a foolish nation will I anger them.", "rashi": "<b>קנאוני.<\/b> הִבְעִירוּ חֲמָתִי:<br><br><b>בלא אל.<\/b> בְּדָבָר שֶׁאֵינוֹ אֱלוֹהַּ:<br><br><b>בלא עם.<\/b> בְּאֻמָּה שֶׁאֵין לָהּ שֵׁם, שֶׁנֶּאֱמַר (ישעיהו כ\"ג) הֵן אֶרֶץ כַּשְׂדִים זֶה הָעָם לֹא הָיָה, בְּעֵשָׂו הוּא אוֹמֵר (עובדיה א') בָּזוּי אַתָּה מְאֹד:<br><br><b>בגוי נבל אכעיסם.<\/b> אֵלּוּ הַמִּינִים, וְכֵן הוּא אוֹמֵר (תהילים י\"ד) אָמַר נָבָל בְּלִבּוֹ אֵין אֱלֹהִים (ספרי; יבמות ס\"ג):", "rashi_en": "קנאוני means, they made My anger glow (cf. Rashi on v. 16).<br><br>בלא אל means, with something that is not a god.<br><br>בלא עם [I WILL MOVE THEM TO JEALOUSY] WITH THOSE WHO ARE NOT A PEOPLE — i.e. with a nation that has no reputation, as it states e.g. of the Chaldeans (Isaiah 23:13), “Behold, the land of the Chaldeans, this people was not; [the Assyrians founded it …]”, and of Esau it states (Obadia 1:2) “Thou art greatly despicable”.<br><br>בגוי נבל אכעיסם I WILL PROVOKE THEM TO ANGER WITH A DEBASED NATION — these are the “Minim”, the heretics. So indeed, it states, (Psalms 14:1) “The heretic (נבל) hath said in his heart “There is no God” (Sifrei Devarim 320:10; Yevamot 63b)."}, {"ch": 32, "v": 22, "aliyah": 4, "heb": "כִּי־אֵשׁ֙ קָדְחָ֣ה בְאַפִּ֔י וַתִּיקַ֖ד עַד־שְׁא֣וֹל תַּחְתִּ֑ית&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וַתֹּ֤אכַל אֶ֙רֶץ֙ וִֽיבֻלָ֔הּ וַתְּלַהֵ֖ט מוֹסְדֵ֥י הָרִֽים׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי <b>קִדּוּם תַּקִּיף<\/b> כְּאֶשָּׁא נְפַק <b>מִקֳּדָמַי בִּרְגַז וְשֵׁצֵי<\/b> עַד שְׁאוֹל <b>אֲרָעִית וְאָסֵף<\/b> אַרְעָא וַעֲלַלְתַּהּ <b>וְשֵׁצִיַּת עַד סְיָפֵי<\/b> טוּרַיָּא:", "onk_en": "For a fire shall blaze in My anger, that will burn till the lowest grave; it shall consume the land and its produce, and enflame the bases of mountains. [<b>For a wind as strong as fire has gone out from before Me in anger, which will destroy to the depths of the earth. It will annihilate the land and its produce, and destroy up to the edges of the mountains.<\/b>]", "pj": "אֲרוּם קִידוֹם תַּקִיף כְּאֵישָׁא נְפַק מִן קֳדָמַי וּבְעָרַת בִּתְקוֹף רוּגְזִי וְאַיְקִידַת עַד שְׁיוֹל אַרְעַיָא וּסְיָיפַת אַרְעָא וַעֲלַלְתָּהּ וְשַׁלְהוֹבַת יְסוֹדֵי טַוְורַיָא", "pj_en": "For an east wind strong as fire shall go out before Me, and blaze in the might of My anger, and burn to the lowest hell; it shall consume the land with its produce, and set the foundations of the mountains in flame.", "tj": "אֲרוּם אֶשָא נַפְקַת בְּשַׁעַת רוּגְזִי וְאוֹקֵדַת עַד שִׁיוֹל אַרְעִיתָא וְתִכְלַת אַרְעָא וּמַלְיָהּ וּלְהָטַת יְסוֹדֵי טוּרַיָא:", "tj_en": "For a fire shall come forth in the hour of My wrath, and burn to the lowest hell, devouring the earth and its fullness, and setting in flame the foundations of the hills.", "rashi": "<b>קדחה.<\/b> בָּעֲרָה:<br><br><b>ותיקד.<\/b> בָּכֶם עַד הַיְסוֹד:<br><br><b>ותאכל ארץ ויבלה.<\/b> אַרְצְכֶם וִיבוּלָהּ (ספרי):<br><br><b>ותלהט.<\/b> יְרוּשָׁלַיִם הַמְיֻסֶּדֶת עַל הֶהָרִים, שֶׁנֶּאֱמַר (תהילים קכ\"ה) יְרוּשָׁלַיִם הָרִים סָבִיב לָהּ:", "rashi_en": "קדחה means, IT BURNS.<br><br>ותיקד AND IT SHALL BLAZE in your midst to the very foundations (Rashi merely supplies the words “in your midst” and paraphrases  עד שאול תחתית).<br><br>ותאכל ארץ ויבלה AND IT SHALL CONSUME THE LAND WITH HER INCREASE — i.e., your land and its produce (Rashi means that ארץ does not mean “the ground”, “the soil”).<br><br>ותלהט AND IT SHALL SET ON FIRE [THE FOUNDATIONS OF THE MOUNTAINS] — i.e. Jerusalem that is founded on the mountains, as it is said, (Psalms 125:2) “Jerusalem, mountains are round about it” (Sifrei Devarim 320:12)."}, {"ch": 32, "v": 23, "aliyah": 4, "heb": "אַסְפֶּ֥ה עָלֵ֖ימוֹ רָע֑וֹת חִצַּ֖י אֲכַלֶּה־בָּֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אָסֵף עֲלֵיהוֹן בִּישִׁין <b>מַכְתָּשַׁי<\/b> <b>אֱשֵׁצֵי<\/b> בְהוֹן:", "onk_en": "I shall amass iniquity against them, I shall deplete my arrows [<b>unleash My plagues<\/b>] against them.", "pj": "וְכַד הִינוּן יְהִיבִין בְּבָבֶל הִינוּן פְּלָחִין לְטַעֲוַותְהוֹן בְּגִין כֵּן אֲמָרִית בְּמֵימְרִי לִמְכַנְשָׁא עֲלֵיהוֹן בִּישְׁתָּא גִירֵי מְחַת פּוּרְעָנוּתִי אֲשֵׁיצֵי בְּהוֹן", "pj_en": "And when they dwell in Babel they will serve their idols; for I have spoken in My Word to array calamities against them, the plague-arrows of My vengeance to destroy them,", "tj": "אֲמָרִית בְּמֵימְרִי לְמֵיתַיָא עֲלֵיהוֹן בִּישִׁין גִירֵי פּוּרְעֲנוּתִין אֲגָרֵי בְּהוֹן:", "tj_en": "I have spoken in My Word to bring evil upon them, the arrows of My vengeance will I send among them:", "rashi": "<b>אספה עלימו רעות.<\/b> אַחְבִּיר רָעָה עַל רָעָה, לְשׁוֹן \"סְפוּ שָׁנָה עַל שָׁנָה\" (ישעיהו כ\"ט), \"סְפוֹת הָרָוָה\" (דברים כ\"ט), \"עֹלוֹתֵיכֶם סְפוּ עַל זִבְחֵיכֶם\" (ירמיהו ז'). דָּ\"אַ — <b>אספה<\/b> אֲכַלֶּה, כְּמוֹ \"פֶּן תִּסָּפֶה\" (בראשית י\"ט):<br><br><b>חצי אכלה בם.<\/b> כָּל חִצַּי אַשְׁלִים בָּהֶם, וּקְלָלָה זוֹ לְפִי הַפֻּרְעָנוּת לִבְרָכָה הִיא — חִצַּי כָּלִים וְהֵם אֵינָם כָּלִים (ספרי; סוטה ט'):", "rashi_en": "אספה עלימו רעות — This means, I will join evil to evil, אספה having the same meaning as in (Isaiah 29:1) “add ye (ספו) year to year”; (Deuteronomy 29:18) “in order to add (ספות) the drunkenness to the thirst”; (Jeremiah 7:21) “Add (ספו) your burnt offerings to your sacrifices”.  —  Another explanation of אספה: it means, “I will expend” (bring to an end so that there will be no more evils to bring upon them); similar to (Genesis 19:15) “lest thou be brought to an end (תספה).  <br><br>חצי אכלה בם means all my arrows I will use to the full against them (i.e., there will be no arrows left). This curse according to the wording in which the punishment is expressed, implies a blessing: My arrows will come to an end, but they themselves will not come to an end (i.e. they will never be exterminated) (Sifrei Devarim 321:2; Sotah 9a)."}, {"ch": 32, "v": 24, "aliyah": 4, "heb": "מְזֵ֥י רָעָ֛ב וּלְחֻ֥מֵי רֶ֖שֶׁף וְקֶ֣טֶב מְרִירִ֑י&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְשֶׁן־בְּהֵמֹת֙ אֲשַׁלַּח־בָּ֔ם עִם־חֲמַ֖ת זֹחֲלֵ֥י עָפָֽר׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "נִפִיחֵי כָפָן וַאֲכוּלֵי עוּף <b>וּכְתִישֵׁי רוּחִין בִּישָׁן<\/b> וְשֵׁן חֵיוַת <b>בָּרָא<\/b> אֱגָרֵי בְּהוֹן עִם חֲמַת <b>תַּנִּינַיָּא דְּזָחֲלִין בְּעַפְרָא<\/b>:", "onk_en": "Bloated with hunger, and embattled with demons and slashed by Meriri [<b>plagues caused by evil winds<\/b>]; and the teeth of animals will I send against them along with the venom of [<b>serpents that are<\/b>] dust-crawlers.", "pj": "אַגְלֵי יַתְהוֹן בְּמָדַי וּבְעֵלָם מִגוֹ שִׁבְיַת בָּבֶל אָעִיקוּ לְהוֹן דְבֵית אֲגַג דִי מְתִילִין לְשֵׁידִין מְנַפְחֵי כְפָן וּלְמַזִיקֵי אֲכִילֵי עוֹף וְלִבְנֵי טִהֲרִירֵי כְּתִישֵׁי רוּחִין בִּישִׁין וְלִילִין וּמְרַוְוחֵי רְוָוחִין בִּישִׁין וְעַכּוּ\"ם דִנְכִיתִין בְשִׁינֵיהוֹן הֵיךְ חֵיוַות בְּרָא אִיגְרֵי בְּהוֹן וַאֲטַלְטְלִינוּן בְּיַד אֲרַמָאֵי דְמַלְיָין אֲרִיסַן כְּחֵיוִין חוֹרְמָנַיָא זוֹחֲלוֹי דְעַפְרָא", "pj_en": "I will make them go into captivity in Media and Elam, in the captivity of Babel, the house of Agag who are like demons gaping with famine, and to corpses devoured by birds, and to stricken evil spirits of the noon, to Lillin and to spirits big with evil. And the Javanaee (Greeks) who bite with their teeth like wild beasts will I send against them, and will shake them by the hand of the Syrians venomous as basilisks, the serpents of the dust.", "tj": "מַנְפַח כְּפָן וַאֲכִילֵי עוֹף מְסָאָב מְרַוְוחֵי רוּחִין בִּישִׁין וְשֵׁן אַרְבַּעְתֵּי מַלְכְּוָותָא דְעַכּוּ\"ם דִמְתִילִין לְחֵיוַת בְּרָא אַגְרֵי בְּהוֹן עִם חֲמַתְהוֹן דְתַנִינַיָא זַחֲלַל עַפְרָא:", "tj_en": "gaping with famine, devoured by unclean fowl, filled with evil spirits, even the teeth of the four kingdoms, which are like wild beasts, will I send among them, with the poison of serpents, the reptiles of the earth.", "rashi": "<b>מזי רעב.<\/b> אֻנְקְלוֹס תִּרְגֵּם \"נְפִיחֵי כָפָן\", וְאֵין לִי עֵד מוֹכִיחַ עָלָיו, וּמִשְּׁמוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן מִטּוּלוּשָׂא שָׁמַעְתִּי שְׂעִירֵי רָעָב — אָדָם כָּחוּשׁ מְגַדֵּל שֵׂעָר עַל בְּשָׂרוֹ:<br><br><b>מזי.<\/b> לְשׁוֹן אֲרַמִּי שֵׂעָר — מִזַיָּא, \"דַּהֲוָה מְהַפֵּךְ בְּמִזַיָּא\" (מגילה י\"ח):<br><br><b>ולחמי רשף.<\/b> הַשֵּׁדִים נִלְחֲמוּ בָהֶם, שֶׁנֶּאֱמַר \"וּבְנֵי רֶשֶׁף יַגְבִּיהוּ עוּף\" (איוב ה'), וְהֵם שֵׁדִים:<br><br><b>וקטב מרירי.<\/b> וּכְרִיתוּת שֵׁד שֶׁשְּׁמוֹ מְרִירִי, <b>קטב<\/b> כְּרִיתָה, כְּמוֹ \"אֱהִי קָטָבְךָ שְׁאוֹל\" (הושע י\"ג):<br><br><b>ושן בהמת.<\/b> מַעֲשֶׂה הָיָה וְהָיוּ הָרְחֵלִים נוֹשְׁכִין וּמְמִיתִין (ספרי):<br><br><b>חמת זחלי עפר.<\/b> אֶרֶס נְחָשִׁים הַמְהַלְּכִים עַל גְּחוֹנָם עַל הֶעָפָר כַּמַּיִם הַזּוֹחֲלִים עַל הָאָרֶץ; זְחִילָה לְשׁוֹן מְרוּצַת הַמַּיִם עַל הֶעָפָר וְכֵן כָּל מְרוּצַת דָּבָר הַמְשַׁפְשֵׁף עַל הֶעָפָר וְהוֹלֵךְ:", "rashi_en": "מזי רעב — Onkelos rendered this by “swollen by famine”. I have, however, no convincing proof for this meaning. In the name of R. Moses the Preacher of Toulouse have heard that it is the same as שעירי רעב, “hairy through hunger”, for an emaciated person grows much hair on his flesh.<br><br>In the Aramaic language the term for hair is מזיא, as e.g. in the phrase (Megillah 18a) “who was busying himself with his hair (במזיא)\".<br><br>ולחמי רשף  This means, the demons fight with them (לחם means “to battle”), — as it states, (Job. 5:7) “As the בני רשף fly upwards”, and they are the demons (Berachot 5a).<br><br>וקטב מרירי means and the destruction caused by a demon whose name is מרירי. The word קטב denotes “cutting off”, “destruction”, as in (Hosea 13:14) “I will be thy destruction (קטבך) O grave”.<br><br>ושן בהמת [I WILL SEND FORTH] THE TEETH OF CATTLE [UPON THEM] (i.e., even the teeth of cattle, not only of wild beasts) — It indeed happened once that lambs bit people and caused their death (Sifrei Devarim 321:8; cf. Rashi on Leviticus 26:22).<br><br>חמת זחלי עפר THE FURY OF THOSE CRAWLING IN THE DUST — i.e. the poison of serpents that crawl on their bellies upon the ground as the water trickles (זחל) upon the ground. The root זחל properly denotes the passage of water upon the dust, and it is similarly used as here of the passage of anything that proceeds in a shuffling manner upon the ground."}, {"ch": 32, "v": 25, "aliyah": 4, "heb": "מִחוּץ֙ תְּשַׁכֶּל־חֶ֔רֶב וּמֵחֲדָרִ֖ים אֵימָ֑ה גַּם־בָּחוּר֙ גַּם־בְּתוּלָ֔ה יוֹנֵ֖ק עִם־אִ֥ישׁ שֵׂיבָֽה׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "מִבָּרָא תְּתַכֵּל חַרְבָּא וּמִתְּוָנַיָּא <b>חַרְגַּת מוֹתָא<\/b> אַף עוּלֵמֵיהוֹן אַף עוּלֵמָתְהוֹן יָנְקֵיהוֹן עִם אֱנַשׁ סָבֵיהוֹן:", "onk_en": "From without, the sword shall decimate, and from within chambers, terror [<b>the fear of death<\/b>]; both lad and lass, suckling and aged man.", "pj": "עַמָא דְגָלוּ מִבָּרָא לְאַרְעָא דְיִשְרָאֵל תַּתְכֵּיל יַתְהוֹן מָחַת חַרְבָּא וּדְמִשְׁתַּיְירִין בְּאַרְעָא דְיִשְרָאֵל בְּגוֹ קִיטוֹנֵי מִדַמִיכֵיהוֹן אִיגְרֵי בְּהוֹן חַרְגַת מוֹתָא אֵילֵךְ וְאֵילֵךְ יִשְׁתֵּיצוּן לְחוֹד עוֹלֵימֵיהוֹן וּלְחוֹד בְּתוּלַתְהוֹן יְנִיקַתְהוֹן עִם גוּבְרֵיהוֹן וְסָבֵיהוֹן", "pj_en": "A people who will come from beyond the land of Israel shall consume them with the stroke of the sword, and those who are left in the land of Israel will I throw into the terror of death, in the chambers here and there where they sleep; their young men shall perish, their maidens, their sucklings, with their men and their elders.", "tj": "מִן שׁוּקָא תַּתְכֵּל יַתְהוֹן חַרְבָּא וּמִן קִיטוּנֵי מִדְמָכֵיהוֹן אֵימָתָא דְמוֹתָא לְחוֹד עוּלֵימִין לְחוֹד בְּתוּלִין יַנְקִין עִם גַבְרִין סָבִין:", "tj_en": "In the street the sword will devour them; in the chambers where they sleep, the terrors of death; their young men and maidens, their infants and aged men.", "rashi": "<b>מחוץ תשכל חרב.<\/b> מִחוּץ לָעִיר תְּשַׁכְּלֵם חֶרֶב גְּיָסוֹת.<br><br><b>ומחדרים אימה.<\/b> כְּשֶׁבּוֹרֵחַ וְנִמְלָט חַדְרֵי לִבּוֹ נְקוּפִים עָלָיו מֵחֲמַת אֵימָה, וְהוּא מֵת וְהוֹלֵךְ בָּה (ספרי); דָּ\"אַ, <b>ומחדרים אימה<\/b> — בַּבַּיִת תִּהְיֶה אֵימַת דֶּבֶר, כְּמָה שֶׁנֶּאֱמַר (ירמיהו ט') \"כִּי עָלָה מָוֶת בְּחַלּוֹנֵינוּ\", וְכֵן תִּרְגֵּם אֻנְקְלוֹס; דָּ\"אַ, <b>מחוץ תשכל חרב<\/b> — עַל מַה שֶּׁעָשׂוּ בַחוּצוֹת, שֶׁנֶּאֱמַר \"וּמִסְפַּר חוּצוֹת יְרוּשָׁלַיִם שַׂמְתֶּם מִזְבְּחוֹת לַבֹּשֶׁת\" (שם י\"א); <b>ומחדרים אימה<\/b>, עַל מַה שֶּׁעָשׂוּ בְחַדְרֵי חֲדָרִים, שֶׁנֶּאֱמַר \"אֲשֶׁר זִקְנֵי בֵית יִשְׂרָאֵל עוֹשִׂים בַּחֹשֶׁךְ אִישׁ בְּחַדְרֵי מַשְׂכִּיתוֹ\" (יחזקאל ח'):", "rashi_en": "מחוץ תשכל חרב WITHOUT, THE SWORD SHALL BEREAVE — This means, outside the city will the sword of the hostile troops bereave them,<br><br>ומחדרים אימה AND WITHIN, DREAD — when one flees and escapes, the recesses (חדרים) of his heart will vehemently beat out of dread, and he will gradually die through this (Sifrei Devarim 321:11).  —  Another explanation of ומחדרים אימה: In the house there will be the fear of pestilence, as it says, (Jeremiah 9:20) “For the death is come up into our windows\" (cf. Bava Kamma 60b). So, too, did Onkelos translate it.  — Another explanation of this verse: מחוץ תשכל חרב — the sword shall destroy them on account of what they have done in the streets (חוצה; the prefix מ denotes the cause: on account of the streets), as it is said, (Jeremiah 11:13) “According to the number of the streets of Jerusalem have you set up altars to the shameful thing” (Sifrei Devarim 321:12);  ומחדרים אימה — on account of what they have done in the innermost chambers of their houses, as it is said, (Ezekiel 8:12) “[Have you seen] what the elders of the house of Israel do in the dark, every man in his marbled chambers?” (Sifrei Devarim 321:12)"}, {"ch": 32, "v": 26, "aliyah": 4, "heb": "אָמַ֖רְתִּי אַפְאֵיהֶ֑ם אַשְׁבִּ֥יתָה מֵאֱנ֖וֹשׁ זִכְרָֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲמָרִית <b>אֵחוּל רָגְזִי עֲלֵיהוֹן וֶאֱשֵׁצִנּוּן<\/b> אֱבַטַּל מִבְּנֵי אֲנָשָׁא דּוּכְרָנֵיהוֹן:", "onk_en": "I thought, ‘I shall abandon them,’ [<b>My anger will fall upon them and I will destroy them<\/b>], I would eliminate from mankind mention of them.", "pj": "אֲמָרִית בְּמֵימְרִי לְמֵיכְלֵי מִנְהוֹן רוּחַ קוּדְשִׁי אֲשַׁיֵיר בְּהוֹן קָלִיל כִּגְבַר דְחָצִיד חַקְלֵיהּ וּמְשַׁיֵיר אַרְעָא חֲדָא אַבְטוֹל מִסְפָּר יֵיחוּס אֱנוֹשׁ דוּכְרָנֵהוֹן", "pj_en": "I have spoken in My Word to withhold from them My Holy Spirit; I will make them weak; as a man who reaps his field leaveth but one upon the ground, so will I abolish their memory from the book of the genealogy of mankind;", "tj": "אֲמָרִית בְּמֵימְרִי לְמֵתַיָא עֲלֵיהוֹן רְגוֹז אֲבַטֵל מִן בְּנֵי אֱנָשָׁא דָכְרָנֵיהוֹן:", "tj_en": "I have spoken in My Word to bring wrath upon them and to cause their memorial to fail from among men;", "rashi": "<b>אמרתי אפאיהם.<\/b> אָמַרְתִּי בְלִבִּי אַפְאֶה אוֹתָם, וְיֵשׁ לְפָרֵשׁ <b>אפאיהם<\/b> אֲשִׁיתֵם פֵּאָה, לְהַשְׁלִיכָם מֵעָלַי הֶפְקֵר, וְדֻגְמָתוֹ מָצִינוּ בְעֶזְרָא (נחמיה ט') \"וַתִּתֵּן לָהֶם מַמְלָכוֹת וַעֲמָמִים וַתַּחְלְקֵם לְפֵאָה\" — לְהֶפְקֵר, וְכֵן חִבְּרוֹ מְנַחֵם. וְיֵשׁ פּוֹתְרִים אוֹתוֹ כְּתַרְגּוּמוֹ \"יָחוּל רוּגְזִי עֲלֵיהוֹן\", וְלֹא יִתָּכֵן, שֶׁאִם כֵּן הָיָה לוֹ לִכְתֹּב אֲאַפְאֵיהֶם, אַחַת לְשִׁמּוּשׁ וְאַחַת לִיסוֹד, כְּמוֹ \"אֲאַזֶּרְךָ\" (ישעיהו מ\"ה), \"אֲאַמִּצְכֶם בְּמוֹ פִי\" (איוב ט\"ו), וְהָאָלֶ\"ף הַתִּיכוֹנָה אֵינָהּ רְאוּיָה בוֹ כְלָל. וְאֻנְקְלוֹס תִּרְגֵּם אַחַר לְשׁוֹן הַבָּרַיְתָא הַשְּׁנוּיָה בְסִפְרֵי הַחוֹלֶקֶת תֵּבָה זוֹ לְשָׁלוֹשׁ תֵּבוֹת, אָמַרְתִּי אַף אֵי הֵם — אָמַרְתִּי בְאַפִּי אֶתְּנֵם כְּאִלּוּ אֵינָם שֶׁיֹּאמְרוּ רוֹאֵיהֶם עֲלֵיהֶם אַיֵּה הֵם:", "rashi_en": "אמרתי אפאיהם means, I said in my heart, “I will אפאה them”. One may explain אפאיהם to mean: I would make them as פאה, i.e. “as grain left in the corner of the field”, to cast them away from Me as something free to all. We find a similar idea to this in Ezra (Nehemiah 9:22), “And thou gavest them kingdoms and nations and didst set them aside as a corner (פאה)” — i.e., as free to all. Thus (under this meaning) did Menachem ben Seruk classify it. Others expound it as the Targum does: My wrath (אף) will fall upon them. This is, however, not correct, for if it were so (i.e., if אפאיהם were connected with אף) it ought to have written אֲאַפְאֵיהֶם with two Alephs, the one as a servile letter (a prefix) and the other as a root letter, just as in (Isaiah 45:5) אאזרך, “I girded thee”, and (Job 16:5) “I would strengthen you (אאמצכם) with my mouth” (in both these cases the first letter of the root is א as it is in אף), and the middle א (that after the פ) would not be proper to be in it at all. Onkelos, however (in connecting the word with אף, anger), rendered it according to the explanation of a Baraitha taught in Sifrei Devarim 322:1 which divides this word into three words, אמרתי אף אי הם, which means, I said in My anger (אף) I will make them as though they were not existent, i.e., that those who are looking for them would ask about them, “Where are they (אי הם)?\"."}, {"ch": 32, "v": 27, "aliyah": 4, "heb": "לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן־יְנַכְּר֖וּ צָרֵ֑ימוֹ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;פֶּן־יֹֽאמְרוּ֙ יָדֵ֣נוּ רָ֔מָה וְלֹ֥א יְהֹוָ֖ה פָּעַ֥ל כׇּל־זֹֽאת׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלּוּלָפוֹן רָגְזָא דְסָנְאָה כְּנִישׁ דִּילְמָא <b>יִתְרַבְרַב בְּעֵל דְּבָבָא<\/b> דִּילְמָא יֵימְרוּן יְדָנָא תְקִיפַת <b>לָנָא<\/b> וְלָא <b>מִן קֳדָם<\/b> יְיָ הֲוַת כָּל דָּא:", "onk_en": "Were it not for the enemy’s amassed rage, lest their oppressors estrange [<b>plot<\/b>]; lest they say, ‘Our armed might has prevailed, and not [<b>from before<\/b>] Adonoy has performed all this.’", "pj": "אִלוּלָפוֹן רוּגְזָא דְסַנָאָה דְחִיל דִלְמָא יִתְרַבְרְבוּן לְקִיבְלֵי מְעִיקֵיהוֹן דִלְמָא יֵימְרוּן יְדֵינָן מִתְפַּרְעוּן לָן מִבַּעֲלֵי דְבָבֵינָן וְלָא מִן קֳדָם יְיָ אִתְגַזָרַת כָּל דָא", "pj_en": "but for the wrath of the enemy, and that their oppressors would glorify themselves against Me, and say, Our hand hath taken vengeance upon our adversaries, and all this hath not been decreed by the Lord;", "tj": "אִלוּלֵי כַּעֲסָא דְסַנָאָה יִתְקַף דְלָא יִתְגַבְּרִין עֲלֵיהוֹן בַּעֲלֵי דְבָבֵיהוֹן וּדְלָא יֵימְרוּן יְדֵנָן אִתְפַּרְעָן לָן מִן בַּעֲלֵי דְבָבֵינָן וְלָא מִן קֳדָם יְיָ אִתְעֲבָדַת הָדָא:", "tj_en": "But that the wrath of the enemy would wax strong, that they could not prevail against their foes; and that they may not say, Our hand hath avenged us on our adversaries, and it hath not been done by the Lord;", "rashi": "<b>לולי כעס אויב אגור.<\/b> אִם לֹא שֶׁכַּעַס הָאוֹיֵב כָּנוּס עֲלֵיהֶם לְהַשְׁחִית, וְאִם יוּכַל לָהֶם וְיַשְׁחִיתֵם יִתְלֶה הַגְּדֻלָּה בּוֹ וּבֵאלֹהָיו וְלֹא יִתְלֶה הַגְּדֻלָּה בִּי, וְזֶהוּ שֶׁנֶּאֱמַר <b>פן ינכרו צרימו<\/b> — יְנַכְּרוּ הַדָּבָר לִתְלוֹת גְּבוּרָתָם בְּנָכְרִי שֶׁאֵין הַגְּדֻלָּה שֶׁלּוֹ — <b>פן יאמרו ידנו רמה וגו'<\/b>:", "rashi_en": "לולי כעס אויב אגור WERE IT NOT THAT THE WRATH OF THE ENEMY WAS אגור — i.e. were it not that the wrath of the enemy were heaped up (אגור) against them to destroy them, and if he does overpower them and destroy them, he will attribute the greatness to himself and to his god, and he will not attribute it to Me. That is the meaning of what is stated immediately afterwords: פן ינכרו צרימו — i.e. lest they treat the matter as arising from a stranger (ינכרו) by attributing their power to a stranger (נכרי) to whom the greatness, however, does not actually belong, פן יאמרו ידינו רמה וגו׳ LEST THEY SHOULD SAY, OUR HAND IS EXALTED etc."}, {"ch": 32, "v": 28, "aliyah": 4, "heb": "כִּי־ג֛וֹי אֹבַ֥ד עֵצ֖וֹת הֵ֑מָּה וְאֵ֥ין בָּהֶ֖ם תְּבוּנָֽה׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי עַם מְאַבְּדֵי עֵצָה אִנּוּן וְלֵית בְּהוֹן סוּכְלְתָנוּ:", "onk_en": "For those nations squander counsel, they lack intelligence.", "pj": "אֲרוּם אוּמָא מְאַבְּדָן עֵיטִין טָבָן הִנוּן וְלֵית בְּהוֹן סוּכְלְתָנוּ", "pj_en": "for they are a people lost to good counsel and void of understanding.", "tj": "אֲרוּם אוּמָא הָדָא אֲבִידֵי עֵיצָן בִּישָׁן אִינוּן וְלֵית בְּהוֹן סוּכְלְתָנוּ:", "tj_en": "for this people perish by evil counsels, and they are void of understanding.", "rashi": "<b>כי<\/b> אוֹתוֹ <b>גוי אבד עצות המה ואין בהם תבונה.<\/b> שֶׁאִלּוּ הָיוּ חֲכָמִים <b>ישכילו זאת איכה ירדף וגו'<\/b>:", "rashi_en": "כי FOR that nation גוי אבד עצות המה ואין בהם תבונה IS A NATION OF ERRING COUNSEL, NEITHER IS THERE ANY UNDERSTANDING IN THEM — for if they were wise (לו חכמו),‎ ישכילו זאת THEY WOULD UNDERSTAND THIS viz., איכה ירדף וגו׳ HOW COULD ONE PURSUE [A THOUSAND] etc."}, {"ch": 32, "v": 29, "aliyah": 5, "heb": "ל֥וּ חָכְמ֖וּ יַשְׂכִּ֣ילוּ זֹ֑את יָבִ֖ינוּ לְאַחֲרִיתָֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלּוּ חַכִּימוּ אִסְתַּכָּלוּ בְדָא סְבָרוּ <b>מָא יְהֵי<\/b> בְסוֹפֵיהוֹן:", "onk_en": "Were they wise they would grasp this, they would contemplate [<b>what will be<\/b>] their ending.", "pj": "אִלוּ הֲווֹ חַכִּימִין הֲווֹן מִסְתַּכְּלִין בְּאוֹרַיְיתָא וְהִינוּן מִתְבּוֹנְנִין מַה יְהֵי עָתִיד לְמֶהֱוֵי בְּסוֹפֵיהוֹן", "pj_en": "O that they were intelligent in the law, and that they understood what they will become in their latter end!", "tj": "אִלוּ חַכִּימוּ יִשְרָאֵל וְיַלִיפוּ אוֹרַיְיתָא אִתְבּוֹנְנוּ מַה הֲוֵי בְּאַחֲרָיוּתָא:", "tj_en": "If Israel were but wise, learning the law they would understand what shall be in their latter end.", "rashi": "<b>יבינו לאחריתם.<\/b> יִתְּנוּ לֵב לְהִתְבּוֹנֵן לְסוֹף פֻּרְעֲנוּתָם שֶׁל יִשְׂרָאֵל:", "rashi_en": "יבינו לאחריתם THEY WOULD CONSIDER THEIR LATTER END — i.e. they would set their heart to comprehend the ultimate reason for the misfortune of the Israelites,"}, {"ch": 32, "v": 30, "aliyah": 5, "heb": "אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּשְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;אִם־לֹא֙ כִּֽי־צוּרָ֣ם מְכָרָ֔ם וַֽיהֹוָ֖ה הִסְגִּירָֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֶכְדֵּין יִרְדּוֹף חַד אַלְפָא וּתְרֵין יֶעֱרְקוּן לְרִבּוֹתָא אֶלָּהֵן (אֲרֵי) תַּקִּיפְהוֹן <b>מְסָרִנּוּן<\/b> וַיְיָ <b>אַשְׁלֵמִנּוּן<\/b>:", "onk_en": "How can one pursue a thousand, and two make ten thousand flee? Unless their Almighty [lit. rock] has dealt them away [<b>handed them over<\/b>], and Adonoy has delivered them?", "pj": "הֵיכְדֵין יְהֵי סַנְאָה חַד רָדִיף אֶלֶף מִנְהוֹן וּתְרֵין יְעִירְקוּן לְרִבּוּתָא מִנְהוֹן אֱלָהֵן מְטוֹל דְתַקִיפְהוֹן מְסָרִינוּן וַיְיָ אַשְׁלֵימִינוּן", "pj_en": "How will one foe pursue a thousand of them, and two put ten thousand of them to flight, unless He who is their strength deliver them, and the Lord avenge them!", "tj": "כַּד הֲווּ יִשְרָאֵל לְעָיַין בְּאוֹרַיְיתָא וְנַטְרִין פִּיקוּדַיָא הֲוָה חַד מִנְהוֹן רָדִיף אֶלֶף וּתְרֵין מִנְהוֹן רִיבְוָותָא מְעַרְקִין עַל דְחָטוּן וְאַרְגְזוּן קֳדָמוֹי תַּקִיף שְׁבַק יַתְהוֹן בְּיַד בַּעֲלֵי דְבָבֵיהוֹן:", "tj_en": "When Israel was diligent in the law, and observed the commandments, one of them chased a thousand, and two of them put ten thousand to flight; but because they have sinned and vexed the Almighty to anger, He hath left them to the hand of their enemies.", "rashi": "<b>איכה ירדף אחד.<\/b> מִמֶּנּוּ <b>אלף<\/b> מִיִּשְׂרָאֵל:<br><br><b>אם לא כי צורם מכרם וה' הסגירם.<\/b> מְכָרָם וּמְסָרָם בְּיָדֵנוּ, דליב\"ר בְּלַעַז:", "rashi_en": "איכה ירדף אחד HOW ONE MAN of the nations COULD PURSUE אלף A THOUSAND of the Israelites.<br><br>אם לא כי צורם מכרם EXCEPT THAT THEIR ROCK HAD DELIVERED THEM — sold them and delivered them into our hands, 'delivrer' in old French (Eng. = deliver)."}, {"ch": 32, "v": 31, "aliyah": 5, "heb": "כִּ֛י לֹ֥א כְצוּרֵ֖נוּ צוּרָ֑ם וְאֹיְבֵ֖ינוּ פְּלִילִֽים׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי לָא כְתָקְפָּנָא תָּקְפְּהוֹן וּבַעֲלֵי דְבָבָנָא <b>הֲווֹ דַיָּנָנָא<\/b>:", "onk_en": "For their mighty one is not like our Almighty, yet our enemies sit in judgement [<b>became our judges<\/b>].", "pj": "אֲרוּם לָא כְתַקִיפְהוֹן דְיִשְרָאֵל טַעֲוַותְהוֹן דְעַמְמַיָא אֲרוּם תַּקִיפֵהוֹן דְיִשְרָאֵל כַּד יְחוֹבוּן מַיְיתִי עֲלֵיהוֹן פּוּרְעֲנוּתָא וְכַד פַּרְסִין יְדֵיהוֹן בִּצְלוֹ עָנֵי וּמְשֵׁזִיב יַתְהוֹן אֲבָל טַעֲוַותְהוֹן דְעַמְמַיָא עַכּוּ\"ם לֵית בְּהוֹן צְרוֹךְ וְעַל דִי אַרְגִיזְנָן קֳדָמוֹי וְלָא הֲדַרְנָן לְפוּלְחָנֵיהּ אִתְעֲבִידוּ בַּעֲלֵי דְבָבֵינָן סַהֲדֵינָן וְדַיָינֵינָן", "pj_en": "For the idols of the Gentiles are not as He who is the Strength of Israel; for the Strength of Israel, when they have sinned, bringeth punishment upon them; but when they stretch forth their hands in prayer, He answereth and delivereth them. But, the idols of the peoples of strange worships are of no use: but because we have provoked Him, and have not returned to His service, our adversaries are our witnesses and our judges.", "tj": "אֲרוּם לָא כְּרַחֲצוֹנָן רַחֲצוֹנֵיהוֹן דְאוּמַיָא עַל דַחֲטִינָן וְאַרְגְזִינָן קָדָמוֹהִי ^אִתְעֲבִידוּ בַּעֲלֵי דְבָבֵינָן דַיָינֵינָן:", "tj_en": "For the confidence of the nations is not as our confidence, but because we have sinned and provoked Him to anger, our adversaries are made our judges.", "rashi": "<b>כי לא כצורנו צורם.<\/b> כָּל זֶה הָיָה לָהֶם לָאוֹיְבִים לְהָבִין שֶׁהַשֵּׁם הִסְגִּירָם וְלֹא לָהֶם וְלֵאלֹהֵיהֶם הַנִּצָּחוֹן, שֶׁהֲרֵי עַד הֵנָּה לֹא יָכְלוּ כְּלוּם אֱלֹהֵיהֶם כְּנֶגֶד צוּרֵנוּ, כִּי לֹא כְסַלְעֵנוּ סַלְעָם; כָּל צוּר שֶׁבַּמִּקְרָא לְשׁוֹן סֶלַע:<br><br><b>ואיבינו פלילים.<\/b> וְעַכְשָׁו אוֹיְבֵינוּ שׁוֹפְטִים אוֹתָנוּ, הֲרֵי שֶׁצוּרֵנוּ מְכָרָנוּ לָהֶם:", "rashi_en": "כי לא כצורנו צורם FOR THEIR ROCK IS NOT AS OUR ROCK — all this the enemies should have understood, — that it is the Lord who delivered them (the Israelites) into their hands, and the victory is neither theirs nor their god’s, for until now their gods could achieve nothing against our Rock, “for not as our Rock is their Rock”. — The word צור wherever it occurs in Scripture is the equivalent of סלע, rock.<br><br>ואיבינו פלילים AND OUR ENEMIES ARE JUDGES — i.e. are now judges over us; it is evident therefore that our Rock must have delivered us over to them."}, {"ch": 32, "v": 32, "aliyah": 5, "heb": "כִּֽי־מִגֶּ֤פֶן סְדֹם֙ גַּפְנָ֔ם וּמִשַּׁדְמֹ֖ת עֲמֹרָ֑ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;עֲנָבֵ֙מוֹ֙ עִנְּבֵי־ר֔וֹשׁ אַשְׁכְּלֹ֥ת מְרֹרֹ֖ת לָֽמוֹ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי <b>כְפֻרְעֲנוּת עַמָּא<\/b> דִסְדוֹם <b>פֻּרְעֲנוּתְהוֹן וְלָקוּתְהוֹן כְּעַם<\/b> עֲמרָה <b>מָחָתְהוֹן בִּישִׁין כְּרֵישֵׁי חֶוְיָן<\/b> וְתֻשְׁלָמַת <b>עוֹבָדֵיהוֹן כִּמְרָרוּתְהוֹן<\/b>:", "onk_en": "For their grapevine is of the grapevine [<b>as the calamity of the nation<\/b>] of Sedom and from the fields [<b>the calamity and deficiency as the nation<\/b>] of Amorah; their grapes are grapes of bitter herbs. clusters galling to them. [<b>You hit them as bad as the heads of serpentss, and the retribution for their deeds will be as bitter.<\/b>]", "pj": "אֲרוּם עוֹבָדֵיהוֹן דְעַמָא הָאִלֵין דַמְיָין לְעוֹבָדֵי עַמָא דִסְדוֹם וַעֲצַתְהוֹן בִּישִׁין כְּעֵיצַתְהוֹן דְעַם עֲמוֹרָה מַחֲשַׁבְתְּהוֹן בִּישִׁין כְּרֵישֵׁי חִיוְנַיָא חוּרְמְנַיָא בְּגִין כֵּן תְּהוֹן תּוּשְׁלָמוּתְהוֹן מְתַכְלִן וּמְמַרְרִין לְהוֹן", "pj_en": "For the works of this people are like the works of the people of Sedom, and their evil counsels like those of the people of Amorah; their wicked thoughts are as serpents heads; bitter therefore to them is their punishment which maketh desolate.", "tj": "אֲרוּם עַמָא הָאִילֵין עוֹבָדֵיהוֹן מְדַמְיָין לְעוֹבָדָא עַמָא דִסְדוֹם וּמַחְשַׁבְתְּהוֹן מְדַמְיָא לְמַחְשַׁבְתֵּיהּ דְעַמָא דַעֲמוֹרָה עוֹבָדִין בִּישִׁין מְתַכְלִין וּמַרְרַן לְהוֹן:", "tj_en": "For the works of this people are like those of the people of Sedom, and their thoughts like those of the people of Amorah: their evil works make them desolate, and become bitter to them.", "rashi": "<b>כי מגפן סדם גפנם.<\/b> מוּסָב לְמַעְלָה — אָמַרְתִּי בְּלִבִּי אַפְאֵיהֶם וְאַשְׁבִּית זִכְרָם לְפִי שֶׁמַּעֲשֵׂיהֶם מַעֲשֵׂי סְדוֹם וַעֲמוֹרָה:<br><br><b>שדמת.<\/b> שְׂדֵה תְּבוּאָה, כְּמוֹ \"וּשְׁדֵמוֹת לֹא עָשָׂה אֹכֶל\" (חבקוק ג'), \"בְּשַׁדְמוֹת קִדְרוֹן\" (מלכים ב כ\"ג):<br><br><b>ענבי רוש.<\/b> עֵשֶׂב מַר:<br><br><b>אשכלת מררת למו.<\/b> מַשְׁקֶה מַר רָאוּי לָהֶם, לְפִי מַעֲשֵׂיהֶם פֻּרְעֲנוּתָם, וְכֵן תִּרְגֵּם אֻנְקְלוֹס \"וְתוּשְׁלָמַת עוֹבָדֵיהוֹן כִּמְרָרוּתְהוֹן\":", "rashi_en": "כי מגפן סדם גפנם FOR THEIR VINE IS OF THE VINE OF SODOM — This is to be connected with what is stated above, (v. 26, verses 27—31 being a parenthesis): “I said in My heart, I would scatter them into corners and make the remembrance of them cease…” because (כי) their doings are as the doings of Sodom and Gomorrah.<br><br>שדמת denotes fields of grain, as in (Habakkuk 3:17) “and the fields (שדמות) shall yield no corn”; (II Chronicles 23:4) “in the fields (בשדמות) of Kedron”.<br><br>ענבי רוש [THEIR GRAPES ARE] GRAPES OF רוש — The word denotes a bitter herb.<br><br>אשכלת ממרת למו BITTER CLUSTERS SHALL BE THEIRS — i.e. a bitter drink is what they deserve: according to their actions should be their punishment. Onkelos also renders it thus: “the recompense of their actions shall be according to their bitterness”."}, {"ch": 32, "v": 33, "aliyah": 5, "heb": "חֲמַ֥ת תַּנִּינִ֖ם יֵינָ֑ם וְרֹ֥אשׁ פְּתָנִ֖ים אַכְזָֽר׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "הָא <b>כְמָרַת<\/b> תַּנִּינַיָּא <b>כּס פֻּרְעֲנוּתְהוֹן<\/b> וּכְרֵישׁ פְּתָנֵי <b>חֶוְיָן<\/b> אַכְזְרָאִין:", "onk_en": "Like caustic [<b>poison of<\/b>] serpents’ venom is their wine [<b>the cup of their calamity<\/b>], and [like] the gall [<b>heads<\/b>] of adders, cruel.", "pj": "הֵי כִּמְרִירַתְהוֹן דְתַנִינַיָא כַּד הִינוּן הֲווֹן מִן חֲמָרֵהוֹן בְּגִין כֵּן יְהֵי מָרִיר כַּס דִלְוַוט דְיִשְׁתּוּן בְּיוֹם פּוּרְעֲנוּתְהוֹן וְהֵיךְ רֵישֵׁי פִּיתוּנַיָא הֵיכְדֵין אִינוּן אַכְזְרָאִין", "pj_en": "Behold as the bitterness of serpents when they come forth from their wines, (?) so shall be the bitter cup of the curse which they are to drink in the day of their punishment, and cruel as the head of asps.", "tj": "אֲרוּם עַמָא הָאִילֵין חֲמָתֵיהּ מְדַמְיָא לַחֲמָתֵיהּ דְתַנִינַיָא בִּזְמַן דְשַׁתְיַין חֲמַר וְרִיגְזֵיהוֹן מְדַמֵי לְרֵישֵׁי חִיוְיָא פִּתְמְנָאֵי וְאַכְזְרוּאֵי וּגְזָרָאֵי:", "tj_en": "For the poison of this people is like that of serpents what time they drink wine, and their malice like the head of asps and cruel reptiles.", "rashi": "<b>חמת תנינם יינם.<\/b> כְּתַרְגּוּמוֹ \"הָא כְמָרַת תַּנִּינַיָּא כֹּס פּוּרְעֲנוּתְהוֹן\", הִנֵּה כִמְרִירַת נְחָשִׁים כּוֹס מִשְׁתֵּה פֻּרְעֲנוּתָם:<br><br><b>וראש פתנים.<\/b> כּוֹסָם שֶׁהוּא <b>אכזר<\/b> לַנָּשׁוּךְ, אוֹיֵב אַכְזָרִי יָבֹא וְיִפָּרַע מֵהֶם:", "rashi_en": "חמת תנינים יינם THEIR WINE IS THE POISON OF DRAGONS — Understand this as the Targum does: הא כמרת תניניא כס פורענותהון which means: Behold, like the gall of serpents is the cup of the drink of their punishment.<br><br>וראש פתנים AND AS THE VENOM OF VIPERS is their cup — venom, which proves cruel (אכזר) to him who is bitten. The sense is: a cruel enemy will come and exact punishment from them."}, {"ch": 32, "v": 34, "aliyah": 5, "heb": "הֲלֹא־ה֖וּא כָּמֻ֣ס עִמָּדִ֑י חָת֖וּם בְּאוֹצְרֹתָֽי׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "הֲלָא <b>כָל עוֹבָדֵיהוֹן גְּלָן קֳדָמַי גְּנִיזִין לְיוֹם דִּינָא<\/b> בְּאוֹצְרָי:", "onk_en": "Is this not sequestered with Me, sealed in My treasuries. [<b>Are not all of their deeds revealed before Me, secreted away in my treasuries for the judgment day?<\/b>]", "pj": "הֲלָא עוֹבָדֵיהוֹן דְאִנוּן עַבְדִין בְּטוּמְרָא קֳדָמַי כּוּלְהוֹן גַלְיָין חֲתִימִין וּמְתַקְנֵי בְּאַפּוֹתִיקַיֵי", "pj_en": "Are not their secret works all known before Me? Sealed and laid up Are they in My treasury!", "tj": "הֲלָא הוּא כַּסָא דֵין פּוּרְעֲנוּתָא מְמַזֵג וּמְתַקֵן גַבִּי לְרַשִׁיעַיָא חָתִים בְּאוֹצָרָי לְיוֹם דִינָא רַבָּא:", "tj_en": "Is not this the cup of punishment, mixed and ordained for the wicked, sealed in My treasuries for the day of the great judgment?", "rashi": "<b>הלא הוא כמס עמדי.<\/b> כְּתַרְגּוּמוֹ, כִּסְבוּרִים הֵם שֶׁשָּׁכַחְתִּי מַעֲשֵׂיהֶם, כֻּלָּם גְּנוּזִים וּשְׁמוּרִים לְפָנַי:<br><br><b>הלא הוא.<\/b> פְּרִי גַפְנָם וּתְבוּאַת שַׁדְמוֹתָם — <b>כמס עמדי<\/b>:", "rashi_en": "הלא הוא כמס עמדי IS NOT THIS LAID UP IN STORE WITH ME — Understand this as the Targum has it: (“Are not all their doings open before me?”) — i.e., they believe that I have forgotten their doings, but really they are all stored up and kept with Me.<br><br>הלא הוא IS NOT THIS — the fruit of their vine and the produce of their fields (i.e. their doings) כמס עמדי STORED UP WITH ME?"}, {"ch": 32, "v": 35, "aliyah": 5, "heb": "לִ֤י נָקָם֙ וְשִׁלֵּ֔ם לְעֵ֖ת תָּמ֣וּט רַגְלָ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔ם וְחָ֖שׁ עֲתִדֹ֥ת לָֽמוֹ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>קֳדָמַי<\/b> פֻּרְעֲנוּתָא וַאֲנָא <b>אֲשַׁלֵּם<\/b> לְעִדָּן <b>דְּיִגְלוּן מֵאַרְעֲהוֹן<\/b> אֲרֵי קָרִיב יוֹם <b>תְּבָרְהוֹן וּמַבַּע דְּעָתִיד לְהוֹן<\/b>:", "onk_en": "Vengeance is [<b>before<\/b>] with Me, and I shall administer retribution at the time that they shall stumble [<b>will be exiled from their land<\/b>] for the day of their calamity [<b>ruin<\/b>] is close by, and destiny speeds towards them [<b>and that which is prepared for them makes haste<\/b>].", "pj": "קֳדָמַי פּוּרְעֲנוּתָא וַאֲנָא אַשְׁלִים לְעִדָן דְתִימוֹט רַגְלֵיהוֹן לְגָלוּתָא אֲרוּם קָרִיב לְמֵיתֵי יוֹם תְּבַרְהוֹן וּמִבְעָא בִּישָׁתָא דִמְעַתְּדָא לְהוֹן", "pj_en": "Vengeance lies before Me, and I will recompense them at the time when their foot shall move to the captivity; for the day of their destruction is coming near, and the evil which is prepared for them maketh haste.", "tj": "דִידִי הוּא נִקְמָתָא וַאֲנָא הוּא דִמְשַׁלֵם לְעִדָן דְתָמִיט רַגְלֵיהוֹן דְצַדִיקַיָא אֲרוּם קָרִיב הוּא יוֹמָא תְבָרֵיהוֹן דְרַשִׁיעַיָא וְאֵשָׁתָא דִגְהִנָם עֲתִידָא לְהוֹן וּמְזַרֵז וּמַיְיתֵי פּוּרְעֲנוּתָא עֲלֵיהוֹן:", "tj_en": "Vengeance is mine: I am He who repayeth; in the time when the foot of the righteous is moved; for the day of destruction for the wicked is nigh the fire of Gehinam. is prepared for them, and their punishment girdeth itself to come upon them.", "rashi": "<b>לי נקם ושלם.<\/b> עִמִּי נָכוֹן וּמְזֻמָּן פֻּרְעֲנוּת נָקָם, וִישַׁלֵּם לָהֶם כְּמַעֲשֵׂיהֶם, הַנָּקָם יְשַׁלֵּם לָהֶם גְּמוּלָם. וְיֵשׁ מְפָרְשִׁים <b>ושלם<\/b> שֵׁם דָּבָר, כְּמוֹ וְשִׁלּוּם וְהוּא מִגִּזְרַת \"וְהַדִּבֵּר אֵין בָּהֶם\" (ירמיהו ה') — כְּמוֹ וְהַדִּבּוּר. וְאֵימָתַי אֲשַׁלֵּם לָהֶם?<br><br><b>לעת תמוט רגלם.<\/b> כְּשֶׁתִּתֹּם זְכוּת אֲבוֹתָם שֶׁהֵן סְמוּכִים עָלָיו:<br><br><b>כי קרוב יום אידם.<\/b> מִשֶּׁאֶרְצֶה לְהָבִיא עֲלֵיהֶם יוֹם אֵידָם קָרוֹב וּמְזֻמָּן לְפָנַי לְהָבִיא עַל יְדֵי שְׁלוּחִים הַרְבֵּה:<br><br><b>וחש עתדת למו.<\/b> וּמַהֵר יָבוֹאוּ הָעֲתִידוֹת לָהֶם:<br><br><b>וחש.<\/b> כְּמוֹ \"יְמַהֵר יָחִישָׁה\" (ישעיהו ה'); עַד כָּאן הֵעִיד עֲלֵיהֶם מֹשֶׁה דִבְרֵי תּוֹכֵחָה לִהְיוֹת הַשִּׁירָה הַזֹּאת לְעֵד, כְּשֶׁתָּבֹא עֲלֵיהֶם הַפֻּרְעָנוּת יֵדְעוּ שֶׁאֲנִי הוֹדַעְתִּים מֵרֹאשׁ, מִכָּאן וָאֵילָךְ הֵעִיד עֲלֵיהֶם דִּבְרֵי תַנְחוּמִין שֶׁיָּבוֹאוּ עֲלֵיהֶם כִּכְלוֹת הַפֻּרְעָנוּת, כְּכֹל אֲשֶׁר אָמַר לְמַעְלָה, \"וְהָיָה כִי יָבֹאוּ עָלֶיךָ וְגוֹ' הַבְּרָכָה וְהַקְּלָלָה וְגוֹ' וְשָׁב ה' אֱלֹהֶיךָ אֶת שְׁבוּתְךָ וְגוֹ'\":", "rashi_en": "לי נקם ושלם means, with Me is prepared and held in readiness the punishment of vengeance, and it will recompense them according to their doings. As regards the word ושלם, it means that vengeance will pay them their recompense (וְשִׁלַּם is therefore a verb with the Vau conversive, the subject being the noun נקם which precedes it). — But some explain the word וְשִׁלַּם as a noun, having the same meaning as שִׁלּוּם “recompense”, when it would be of the same grammatical form as the noun in the phrase (Jeremiah 5:13) “And the דִּבֵּר is not in them”, where it has the meaning of דִּבּוּר, “Divine utterance”. And when will I recompense them?<br><br>לעת תמוט רגלם AT THE TIME WHEN THEIR FOOT SHALL TOTTER — i.e. when the merit of their ancestors upon which they are relying (which is, as it were, their foot, their support) will become exhausted.<br><br>כי קרוב יום אידם FOR THE DAY OF THEIR CALAMITY IS AT HAND — i.e. as soon as I shall desire to bring about the day of their calamity, it will be near at hand and held in readiness by Me — that I may bring it by any of the many agencies I have. <br><br>וחש עתדת למו means, AND THE THINGS THAT ARE TO COME (עתידות) UPON THEM WILL COME QUICKLY (חש).<br><br>וחש — The word חש has the same meaning as the verb in (Isaiah V. 19) “Let him make speed and hasten (יחישה)”. — So far Moses exhorted them with words of reproof, so that this song should be witness against them, i.e., that when the punishment would come upon them they would know (acknowledge) that I told them about this from the very beginning. From here onwards he exhorted them with a statement of the comfort that would come upon them when their punishment would have ended; this being similar to all that is stated above (30:1—2) “And it shall come to pass when [all these things] are come upon thee, the blessing and the curse, … then the Lord thy God will turn they captivity, etc.”"}, {"ch": 32, "v": 36, "aliyah": 5, "heb": "כִּֽי־יָדִ֤ין יְהֹוָה֙ עַמּ֔וֹ וְעַל־עֲבָדָ֖יו יִתְנֶחָ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;כִּ֤י יִרְאֶה֙ כִּֽי־אָ֣זְלַת יָ֔ד וְאֶ֖פֶס עָצ֥וּר וְעָזֽוּב׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי יְדִין יְיָ <b>דִּינָא<\/b> דְעַמֵּיהּ <b>וּפֻרְעֲנוּת<\/b> עַבְדוֹהִי <b>צַדִּיקַיָּא יִתְפְּרַע אֲרֵי גֱּלִי קֳדָמוֹהִי דִּבְעִדָּן דִּתִתְקֵף עֲלֵיהוֹן מָחַת סָנְאָה יְהוֹן מִטַּלְטְלִין וּשְׁבִיקִין<\/b>:", "onk_en": "When Adonoy administers justice against His people and He will reconsider about His servants; when He sees the power surging, and none are structured or fortified. [<b>When Hashem will decide the judgment of His people, and the cruelty to His just servants will be revenged; then it will be apparent before Him that when the clout of their enemies will grow stronger, they will be carried away and lost.<\/b>]", "pj": "אֲרוּם דָאִין מֵימְרָא דַיְיָ בִּרְחָמוֹן דִינָא דְעַמֵיהּ יִשְרָאֵל וְעַל בִּישָׁתָא דִגְזַר עַל עַבְדוֹהִי יְהֵי תָּהָן קֳדָמוֹי אֲרוּם גְלֵי קֳדָמוֹי דִבְעִידָן דִיחוֹבוּן וְתִתְקַף עֲלֵיהוֹן מָחַת סַנָאָה וְתִתְנַטֵל סָעִיד מִידֵיהוֹן וִיהוֹן פַּסְקִין מְהֵימְנַיָא מִדֵי עוֹבְדִין טָבִין וִיהוֹן מִיטַלְטְלִין וּשְׁבִיקִין", "pj_en": "For the Word of the Lord adjudgeth in His mercy the judgement of His people Israel, and for the evil He hath appointed upon His servants there shall be repentance before Him; for He knoweth that in the time when they have sinned the stroke of their enemies will be heavy upon them, and help have passed away from their hands, and the faithful will have failed with their good works and be scattered and forsaken.", "tj": "אֲרוּם דָאִין הוּא יְיָ דִינֵיהוֹן דְעַמָא בְנֵי יִשְרָאֵל וְעַל עַבְדוֹי צַדִיקַיָא הוּא מִתְנַחֵם אֲרוּם גְלֵי קֳדָמוֹי אֲרוּם מְטַת יְדֵיהוֹן דְצַדִיקַיָא וְאִנוּן שְׁבִיקִין וּרְטִישִׁין וְלֵית לְהוֹן דִסְעַד וְסָמִיךְ:", "tj_en": "For the Lord Himself will adjudge the judgment of the people of the children of Israel, and comfort His righteous servants; for it is manifest before Him that the hand of the righteous will waver, and that they will be forsaken and cast down, with none to help or support them.", "rashi": "<b>כי ידין ה' עמו.<\/b> כְּשֶׁיִּשְׁפֹּט אוֹתוֹ בְּיִסּוּרִין הַלָּלוּ הָאֲמוּרוֹת עֲלֵיהֶם, כְּמוֹ \"כִּי בָם יָדִין עַמִּים\" (איוב ל\"ו) — יְיַסֵּר עַמִּים. כִּי זֶה אֵינוֹ מְשַׁמֵּשׁ בִּלְשׁוֹן דְּהָא, לָתֵת טַעַם לַדְּבָרִים שֶׁל מַעְלָה, אֶלָּא לְשׁוֹן תְּחִלַּת דִּבּוּר, כְּמוֹ (ויקרא כ\"ה) \"כִּי תָבֹאוּ אֶל הָאָרֶץ\", כְּשֶׁיָּבֹאוּ עֲלֵיהֶם מִשְׁפָּטִים הַלָּלוּ וְיִתְנַחֵם הַקָּבָּ\"ה עַל עֲבָדָיו לָשׁוּב וּלְרַחֵם עֲלֵיהֶם:<br><br><b>יתנחם.<\/b> לְשׁוֹן הִפּוּךְ הַמַּחֲשָׁבָה לְהֵיטִיב אוֹ לְהָרַע:<br><br><b>כי יראה כי אזלת יד.<\/b> כְּשֶׁיִּרְאֶה כִּי יַד הָאוֹיֵב הוֹלֶכֶת וְחוֹזֶקֶת מְאֹד עֲלֵיהֶם, <b>ואפס<\/b> בָּהֶם <b>עצור ועזוב<\/b>:<br><br><b>עצור.<\/b> נוֹשַׁע עַל יְדֵי עוֹצֵר וּמוֹשֵׁל שֶׁיַּעֲצֹר בָּהֶם:<br><br><b>עזוב.<\/b> עַל יְדֵי עוֹזֵב; עוֹצֵר הוּא הַמּוֹשֵׁל הָעוֹצֵר בָּעָם שֶׁלֹּא יֵלְכוּ מְפֻזָּרִים בְּצֵאתָם לַצָּבָא עַל הָאוֹיֵב, בְּלַעַז מיינטינ\"דור; <b>עצור<\/b>, הוּא הַנּוֹשָׁע בְּמַעֲצוֹר הַמּוֹשֵׁל; <b>עזוב<\/b>, מְחֻזָּק, כְּמוֹ (נחום ג') \"וַיַּעַזְבוּ יְרוּשָׁלַיִם עַד הַחוֹמָה\"; \"אֵיךְ לֹא עֻזְּבָה עִיר תְּהִלָּה\" (ירמיהו מ\"ט), אינפורצדו\"ר:", "rashi_en": "כי ידין ה' עמו — This means, when He will sentence them to all these sufferings that are mentioned concerning them. The phrase has the same meaning as (Job 36:31) “For by them ידין nations”, i.e. He will chastise the nations. — This word כי has not the meaning of “because”, giving the reason for the preceding statements, but it is an expression (a particle) beginning a new a statement, as (Leviticus 25:2) “When (וכי) ye will come into the land” (cf. Rashi on that passage). The meaning is: When these judgment will come upon them, and the Lord will bethink Himself concerning His servants to have mercy on them again.<br><br>יתנחם HE WILL REPENT — This is an expression for changing one’s mind whether for good or for evil.<br><br>כי יראה כי אזלת יד WHEN HE SEETH THAT THEIR POWER IS GOING ON — i.e. when He sees that the power of the enemies is constantly becoming exceedingly stronger over them,ואפס AND THERE IS NOT among them עצור ועזוב.<br><br>עצור is one who is saved by a עוצר (a “restrainer”) and ruler who would restrain them, <br><br>עזוב means one saved by an עוזב. Now an עוצר is a ruler who keeps the people in check that they should not march in scattered groups when they go into war against the enemy, maintenue in old French, (Engl = maintainer). Consequently עצור (the passive) is one who is saved through the restraint of the ruler. עזוב is one who is strengthened, as (Nehemiah 3:8) “and they fortified (ויעזבו) Jerusalem unto the broad wall”; (Jer. 49:25) “How is this city of praise not helped (עזובה)!”. In old French anforcede, (English = fortified)."}, {"ch": 32, "v": 37, "aliyah": 5, "heb": "וְאָמַ֖ר אֵ֣י אֱלֹהֵ֑ימוֹ צ֖וּר חָסָ֥יוּ בֽוֹ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיֵימַר אָן <b>דַּחֲלָתְהוֹן תַּקִּיפָא<\/b> דַּהֲווֹ רְחִיצִין בֵּיהּ:", "onk_en": "He shall say, ‘‘Where is their god [<b>idol<\/b>] the rock [<b>mighty<\/b>] on which they relied for shelter?", "pj": "וְיֵימַר סַנְאָה הָאן הוּא דַחַלְתְּהוֹן דְיִשְרָאֵל תַּקִיפָא דִרְחִיצוּ בֵיהּ", "pj_en": "And the enemy will say, Where is the fear of Israel, their Strength in whom they confided,", "tj": "וַאֲמַר עֲתִידִין אוּמַיָא לְמֵימָר הָאן הוּא אֱלָהָא דְיִשְרָאֵל תַּקִיפָא דְאִתְרַחֲצוּ בֵּיהּ:", "tj_en": "For the Gentiles will say, Behold, the God of Israel is strong in whom they put their trust;", "rashi": "<b>ואמר.<\/b> הַקָּבָּ\"ה עֲלֵיהֶם <b>אי אלהימו<\/b> שֶׁעָבְדוּ:<br><br><b>צור חסיו בו.<\/b> הַסֶּלַע שֶׁהָיוּ מִתְכַּסִּין בּוֹ מִפְּנֵי הַחַמָּה וְהַצִּנָּה, כְּלוֹמַר שֶׁהָיוּ בְטוּחִין בּוֹ לְהָגֵן עֲלֵיהֶם מִן הָרָעָה:", "rashi_en": "ואמר AND HE, the Omnipresent, WILL SAY with regard to them  אי אלהימו WHERE ARE THEIR GODS which they served.<br><br>צור חסיו בו THE ROCK IN WHOM THEY TRUSTED — i.e. the rock beneath which they sought shelter (more lit., with which they covered themselves) from the heat and the cold; that is to say, “in which they trusted” that it would protect them against evil."}, {"ch": 32, "v": 38, "aliyah": 5, "heb": "אֲשֶׁ֨ר חֵ֤לֶב זְבָחֵ֙ימוֹ֙ יֹאכֵ֔לוּ יִשְׁתּ֖וּ יֵ֣ין נְסִיכָ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;יָק֙וּמוּ֙ וְיַעְזְרֻכֶ֔ם יְהִ֥י עֲלֵיכֶ֖ם סִתְרָֽה׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דִּי תְרַב נִכְסָתְהוֹן הֲווֹ אָכְלִין שָׁתָן חֲמַר נִסְכֵּיהוֹן יְקוּמוּן כְּעַן וִיסַעֲדוּנְכוֹן יְהוֹן עֲלֵיכוֹן מָגֵן:", "onk_en": "They ate the fat of their sacrifices, they drank the wine of their libation? Let them arise and help you, let them serve as your shield.", "pj": "דִתְרֵיב נִכְסַתְהוֹן הֲווֹן אָכְלִין שָׁתָן חֲמַר נִיסוּכֵיהוֹן יְקוּמוּן כְּדוֹן וִיסַעֲדוּנְכוֹן יְהֵי עֲלֵיכוֹן מֵגִין בְּמֵימְרֵיהּ", "pj_en": "who ate the fat of their sacrifices, and drank the wine of their libations? Let Him now rise up and help you, let Him shield you by His Word.", "tj": "דַהֲווֹן מַקְרִיבִין קֳדָמוֹי תַּרְבֵּי נִכְסֵי קוּרְבָּנֵיהוֹן וַחֲמַר נִיסוּכֵיהוֹן הֲווֹן מַקְרִיבִין קֳדָמוֹי יְקוּם כְּעַן וְיִפְרוֹק יַתְהוֹן דִיהֱוָון עֲלֵיהוֹן כְּמָגִינָא:", "tj_en": "they brought before Him the fat of their sacrifices, and the wine of their libations; let Him who (once) was over them as a shield rise up now and deliver them.", "rashi": "<b>אשר חלב זבחימו.<\/b> הָיוּ אוֹתָן אֱלֹהוֹת אוֹכְלִים, שֶׁהָיוּ מַקְרִיבִים לִפְנֵיהֶם, וְשׁוֹתִין <b>יין נסיכם<\/b>:<br><br><b>יהי עליכם סתרה.<\/b> אוֹתוֹ הַצּוּר יִהְיֶה לָכֶם מַחֲסֶה וּמִסְתּוֹר:", "rashi_en": "אשר חלב זבחימו THE FAT OF WHOSE SACRIFICES THEY, i.e. these gods — used to eat, which they offered to them, and which used to drink יין נסיכם THE WINE OF THEIR DRINK OFFERING.<br><br>יהי עליכם סתרה LET IT BE YOUR PROTECTION — i.e., let that rock (v. 37) be a refuge and shelter to you."}, {"ch": 32, "v": 39, "aliyah": 5, "heb": "רְא֣וּ&thinsp;<b>׀<\/b> עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְאֵ֥ין אֱלֹהִ֖ים עִמָּדִ֑י&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;אֲנִ֧י אָמִ֣ית וַאֲחַיֶּ֗ה מָחַ֙צְתִּי֙ וַאֲנִ֣י אֶרְפָּ֔א&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְאֵ֥ין מִיָּדִ֖י מַצִּֽיל׃", "onk": "חֲזוֹ כְּעַן אֲרֵי אֲנָא אֲנָא הוּא וְלֵית אֱלָהּ בַּר מִנִּי אֲנָא מֵמִית וּמְחַיֵּי מָחֵינָא וְאַף מַסֵּינָא וְלֵית מִן יְדִי מְשֵׁזֵב:", "onk_en": "Now observe! For it is I! I am the One! and no god matches Me; I put to death and make live, I smite and I heal and no one can rescue from My grasp.", "pj": "כַּד יִתְגְלֵי מֵימְרָא דַיְיָ לְמִפְרוֹק יַת עַמֵיהּ יֵימַר לְכָל עַמְמַיָא חֲמוֹן כְּדוֹן אֲרוּם אֲנָא הוּא דַהֲוֵויתִי וַהֲוִית וַאֲנָא הוּא דְעָתִיד לְמֶהֱוֵי וְלֵית אֱלָהָא חוֹרַן בַּר מִינִי אֲנָא בְּמֵימְרִי מֵמִית וּמָחֵי מָחִיתִי יַת עַמָא בֵּית יִשְרָאֵל וַאֲנָא אָסֵי יַתְהוֹן בְּסוֹף יוֹמַיָא וְלֵית דִמְשֵׁזִיב מִן יְדַי גוֹג וּמַשִׁרְיָיתֵיהּ לִמְסַדְרָא סִדְרֵי קְרָבָא עִמְהוֹן", "pj_en": "When the Word of the Lord shall reveal Himself to redeem His people, He will say to all the nations: Behold now, that I am He who Am, and Was, and Will Be, and there is no other God beside Me: I, in My Word, kill and make alive; I smite the people of the Beth Israel, and I will heal them at the end of the days; and there will be none who can deliver them from My hand, Gog and his armies whom I have permitted to make war against them.", "tj": "חֲמוּ אֲרוּם כְּדוֹן אֲנָא בְּמֵימְרִי הוּא וְלֵית אֱלָהָא אוֹחֲרָן בַּר מִינִי אֲנָא הוּא דִמְמִית חַיָין בְּעַלְמָא הָדֵין וּמְחַיֵי מֵתַיָא לְעָלְמָא דְאָתֵי אֲנָא הוּא דְמָחֵי וַאֲנָא הוּא דְמַסֵי וְלֵית דִמְשֵׁזִיב מִן יְדָי:", "tj_en": "See now that I in My Word am He, and there is no other God beside Me. I kill the living in this world, and make alive the dead in the world that cometh; I am He who smiteth, and I am He who healeth; and there is none who can deliver from My hand.", "rashi": "<b>ראו עתה.<\/b> הָבִינוּ מִן הַפֻּרְעָנוּת שֶׁהֵבִיא עֲלֵיכֶם וְאֵין לָכֶם מוֹשִׁיעַ, וּמִן הַתְּשׁוּעָה שֶׁאוֹשִׁיעֲכֶם וְאֵין מוֹחֶה בְיָדִי:<br><br><b>אני אני הוא.<\/b> אֲנִי לְהַשְׁפִּיל וַאֲנִי לְהָרִים:<br><br><b>ואין אלהים עמדי.<\/b> עוֹמֵד כְּנֶגְדִּי לִמְחוֹת:<br><br><b>עמדי.<\/b> דֻּגְמָתִי וְכָמוֹנִי:<br><br><b>ואין מידי מציל.<\/b> הַפּוֹשְׁעִים בִּי:", "rashi_en": "ראו עתה SEE NOW — Realise now from the punishment which I have brought upon you and from which there was no one to save you, and, on the other hand, from the help which I will render you and there will be none who can prevent Me,<br><br>אני אני הוא [THAT] IT IS I, EVEN I — I am He Who have the power to abase (make low) and it is I who have the power to raise,<br><br>ואין אלהים עמדי AND THERE IS NO GOD WITH ME — i.e. standing against Me to prevent this. <br><br>עמדי means, who is my equal and like Me.<br><br>ואין מידי מציל AND THERE IS NONE WHO CAN DELIVER OUT OF MY HAND those who rebel against Me."}, {"ch": 32, "v": 40, "aliyah": 6, "heb": "כִּֽי־אֶשָּׂ֥א אֶל־שָׁמַ֖יִם יָדִ֑י&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְאָמַ֕רְתִּי חַ֥י אָנֹכִ֖י לְעֹלָֽם׃", "onk": "אֲרֵי <b>אֲתְקֵנִית<\/b> בִּשְׁמַיָּא <b>בֵּית שְׁכִנְתִּי<\/b> וַאֲמָרִית קַיָּם אֲנָא לְעָלְמִין:", "onk_en": "For I shall lift My hand heavenward [<b>I have prepared the heavens a place for My Shechinah<\/b>], and I shall say, ‘I live forever.’", "pj": "אֲרוּם זְקָפִית בִּשְׁבוּעָה יַת יְדַי בִּשְׁמַיָא וַאֲמָרִית הֵיכְמָא דַאֲנָא קַיָים הֵיכְדֵין לָא אַבְטִיל שְׁבוּעָתִי לְעַלְמִין", "pj_en": "I have lifted My hand with an oath to heaven, and have said, As I exist, I will not abolish My oath forever.", "tj": "אֲרוּם זְקִיפִית יְדַי בִּשְׁבוּעַיָא לִשְׁמַיָא וַאֲמָרִית חַי וְקַיָים אֲנָא בְּמֵימְרִי לַעֲלָם:", "tj_en": "For I have uplifted My hand with an oath to heaven, and said, I live, and My Word subsisteth for ever.", "rashi": "<b>כי אשא אל שמים ידי.<\/b> כִּי בַחֲרוֹן אַפִּי אֶשָּׂא יָדִי אֶל עַצְמִי בִּשְׁבוּעָה:<br><br><b>ואמרתי חי אנכי.<\/b> לְשׁוֹן שְׁבוּעָה הוּא, אֲנִי נִשְׁבָּע <b>חי אנכי<\/b>:", "rashi_en": "כי אשא אל שמים ידי FOR I SHALL LIFT UP MY HAND TO HEAVEN — This means; for in My wrath I shall lift up My hand to Myself in an oath.<br><br>ואמרתי חי אנכי — This is the expression of an oath: I SWEAR AS TRUE AS I LIVE [FOR EVER].\n"}, {"ch": 32, "v": 41, "aliyah": 6, "heb": "אִם־שַׁנּוֹתִי֙ בְּרַ֣ק חַרְבִּ֔י&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְתֹאחֵ֥ז בְּמִשְׁפָּ֖ט יָדִ֑י אָשִׁ֤יב נָקָם֙ לְצָרָ֔י&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְלִמְשַׂנְאַ֖י אֲשַׁלֵּֽם׃", "onk": "<b>אִם עַל חַד תְּרֵין כְּחֵזוּ בַרְקָא מִסּוֹף שְׁמַיָּא<\/b> וְעַד <b>סוֹף שְׁמַיָּא תִּתְגְּלִי<\/b> חַרְבִּי וְתִתְקֵף בְּדִינָא יְדִי אָתֵב <b>פֻּרְעֲנוּתָא<\/b> לְסָנְאַי <b>וּלְבַעֲלֵי דְבָבַי<\/b> אֱשַׁלֵּם:", "onk_en": "If I whet My saber to a gleam, and hold judgement in My grasp. I shall wreak vengeance on My foes and My spiters will I pay. [<b>When My sword shall be revealed as a twofold lightning from one end of the heavens to the other, My hand will hold fast to judgment and I will visit calamity upon My enemies, and I will repay my adversaries.<\/b>]", "pj": "אִין שְׁנִינָא הִיא בְּרַק סַיְיפִי וְתִתְקֵיף בְּדִינָא יְדַי אַחֲזוֹר פּוּרְעֲנוּתָא לִמְעִיקֵי עַמִי וּלְסַנְאֵיהוֹן אַשְׁלִים אֲגַר עוֹבָדֵיהוֹן בִּישַׁיָא", "pj_en": "If I whet my sword, as lightning it will prevail in the judgment of My hand. I will return retribution on them who afflict My people, and repay to their enemies the hire of their wickedness. I will make My arrows drunk with the blood of their slain, and the captivity of their hosts shall be the punishment of My people’s foes.", "tj": "אִם אֲשַׁנֵי בִּבְרָקָא חַרְבִּי וְתִתְקֵיף בְּדִינָא יְדַי יְמִינִי אַחֲזוֹר נִקְמָתָא לְשַנְאוֹי וּלְבַעֲלֵי דְבָבֵיהוֹן דְעַמִי אֲשַׁלֵם גְמָלֵיהוֹן לְהוֹן בִּישַׁיָא:", "tj_en": "If I whet My sword as lightning, My right hand will prevail in judgment. I will render punishment upon the adversaries of My people, I will repay them for their evil deeds.", "rashi": "<b>אם שנותי ברק חרבי.<\/b> אִם אֲשַׁנֵּן אֶת לַהַב חַרְבִּי לְמַעַן הֱיוֹת לָהּ בָּרָק, שפלנ\"דור:<br><br><b>ותאחז במשפט ידי.<\/b> לְהַנִּיחַ מִדַּת רַחֲמִים מֵאוֹיְבַי שֶׁהֵרֵעוּ לָכֶם \"אֲשֶׁר אֲנִי קָצַפְתִּי מְעָט וְהֵמָּה עָזְרוּ לְרָעָה\" (זכריה א טו), וְתֹאחֵז יָדִי אֶת מִדַּת הַמִּשְׁפָּט לְהַחֲזִיק בָּהּ וְלִנְקֹם נָקָם:<br><br><b>אשיב נקם וגו'.<\/b> לָמְדוּ רַבּוֹתֵינוּ בָּאַגָּדָה מִתּוֹךְ לְשׁוֹן הַמִּקְרָא שֶׁאָמַר <b>ותאחז במשפט ידי<\/b> — לֹא כְמִדַּת בָּשָׂר וָדָם מִדַּת הַקָּבָּ\"ה, מִדַּת בָּשָׂר וָדָם זוֹרֵק חֵץ וְאֵינוֹ יָכוֹל לַהֲשִׁיבוֹ, וְהַקָּבָּ\"ה זוֹרֵק חִצָּיו וְיֵשׁ בְּיָדוֹ לַהֲשִׁיבָם כְּאִלּוּ אוֹחֲזָן בְּיָדוֹ, שֶׁהֲרֵי בָרָק הוּא חִצּוֹ שֶׁנֶּאֱמַר כָּאן <b>ברק חרבי ותאחז במשפט ידי<\/b>, וְהַמִּשְׁפָּט הַזֶּה לְשׁוֹן פֻּרְעָנוּת הוּא, בְלַעַז יושטיצ\"א:", "rashi_en": "אם שנותי ברק חרבי means, IF I SHALL WHET THE BLADE OF MY SWORD, so that it shall have a flash (ברק); splendeur in old French<br><br>ותאחז במשפט ידי AND MY HAND TAKE HOLD ON JUDGMENT — i.e., on strict justice, relinquishing (i.e. withdrawing) My attribute of mercy from My enemies who have done so much evil unto you, —  “I was angry only a little, but they helped to do harm” (Zechariah 1:15). — but My hand shall grasp the attribute of justice to hold fast to it in order to take vengeance.<br><br>אשיב נקם וגו׳ I WILL RENDER VENGEANCE [TO MY ADVERSARIES]. — Our Rabbis derived in the Agada from the wording of the text which states, “And My hand shall hold the משפט fast”, that the nature of the Holy One, blessed be He, is not like the nature of human beings: The nature of a human being is that when he shoots an arrow he cannot bring it back (i.e., cannot check its flight); the Holy One, blessed be He, however, shoots His arrows and it is in His power to bring them back as though He is still holding them in hand, for, you see, lightning is His arrow, for it states here ברק חרבי, “Lightning is my weapon, and my hand holds fast to משפט\" (Mekhilta). This משפט (i.e., משפט according to this explanation) has the meaning of punishment, in old French justicia, the execution of justice (the third definition given by Rashi on Exodus 28:15 of this word)"}, {"ch": 32, "v": 42, "aliyah": 6, "heb": "אַשְׁכִּ֤יר חִצַּי֙ מִדָּ֔ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְחַרְבִּ֖י תֹּאכַ֣ל בָּשָׂ֑ר מִדַּ֤ם חָלָל֙ וְשִׁבְיָ֔ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;מֵרֹ֖אשׁ פַּרְע֥וֹת אוֹיֵֽב׃", "onk": "אֱרַוֵּי גִּירַי מִדְּמָא וְחַרְבִּי <b>תִּקְטוֹל בְּעַמְמַיָּא<\/b> מִדַּם קְטִילָן וְשִׁבְיָן <b>לְאַעְדָּאָה כִתְרִין מֵרֵישׁ סָנְאָה<\/b> וּבְעֵל דְּבָבָא:", "onk_en": "I shall make My arrows drunk with blood and My saber shall consume flesh [<b>kill among the nations<\/b>]; for the blood of the slaughtered and the captives, for the original savagery of the enemy [<b>to remove the crowns from the heads of enemies and adversaries<\/b>].’’", "pj": "אֵירַוֵי גִירְרַי מִן אֲדַם קְטוֹלֵיהוֹן וּסְיָיפַי תִגְמוֹר בִּשְרֵיהוֹן מִדַם קְטִילִין וְשִׁיבִין מִשֵׁירוֹי פּוּרְעָנוּת סַנְאֵיהוֹן דְעַמִי", "pj_en": "I will make My arrows drunk with their blood, and My sword shall consume their flesh; with the blood of the destroyers of My people, their captives, and the chieftains of their hosts.", "tj": "אַרִוֵוי גִירַי מִן אַדְמֵיהוֹן וְחַרְבִּי תִּתְכַּל בְּבִשְרֵהוֹן מִן אֲדַם קְטוֹלֵיהוֹן דְעַמִי וְשִׁבְיֵיהוֹן מִן רֵישֵׁי גִבּוֹרֵיהוֹן פּוּלְמַרְכֵיהוֹן:", "tj_en": "I will make My arrows drunk with their blood, and My sword shall consume their flesh; with the blood of the destroyers of My people, their captives, and the chieftains of their hosts.", "rashi": "<b>אשכיר חצי מדם.<\/b> הָאוֹיֵב:<br><br><b>וחרבי תאכל<\/b> בְּשָׂרָם:<br><br><b>מדם חלל ושביה.<\/b> זֹאת תִּהְיֶה לָהֶם מֵעֲוֹן דַּם חַלְלֵי יִשְׂרָאֵל וְשִׁבְיָה שֶׁשָּׁבוּ מֵהֶם:<br><br><b>מראש פרעות אויב.<\/b> מִפֶּשַׁע תְּחִלַּת פִּרְצוֹת הָאוֹיֵב, כִּי כְּשֶׁהַקָּבָּ\"ה נִפְרָע מִן הָאֻמּוֹת פּוֹקֵד עֲלֵיהֶם עֲוֹנָם וַעֲוֹנוֹת אֲבוֹתֵיהֶם מֵרֵאשִׁית פִּרְצָה שֶׁפָּרְצוּ בְיִשְׂרָאֵל:", "rashi_en": "אשכיר חצי מדם I WILL MAKE MY ARROWS DRUNK WITH BLOOD of the enemy,<br><br>וחרבי תאכל AND MY SWORD SHALL DEVOUR their FLESH.<br><br>מדם חלל ושביה FROM THE BLOOD OF THE SLAIN AND THE CAPTIVE i.e., this will happen to them because of the sin of those slain in Israel (i.e., on account of their blood; מדם), and because of the captives they have made amongst them,<br><br>מראש פרעות אויב — because of the sin of even the very first (ראש) breach (פרעות) made by the enemy (פרצות = פרעות); because when the Holy One, blessed be He, exacts punishment from the heathen nations for the wrongs they have inflicted upon Israel, He visits on them their own sin and the sins of their ancestors, from the very first breach they have made in Israel (Sifrei Devarim 332:5)."}, {"ch": 32, "v": 43, "aliyah": 6, "heb": "הַרְנִ֤ינוּ גוֹיִם֙ עַמּ֔וֹ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;כִּ֥י דַם־עֲבָדָ֖יו יִקּ֑וֹם וְנָקָם֙ יָשִׁ֣יב לְצָרָ֔יו&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וְכִפֶּ֥ר אַדְמָת֖וֹ עַמּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>שַׁבָּחוּ<\/b> עַמְמַיָּא עַמֵּיהּ אֲרֵי <b>פֻּרְעֲנוּת<\/b> עַבְדוֹהִי <b>צַדִּיקַיָּא יִתְפְּרַע וּפֻרְעֲנוּת<\/b> יָתֵיב לְסָנְאוֹהִי וִיכַפַּר עַל אַרְעֵיהּ וְעַל עַמֵּיהּ:", "onk_en": "Let the nations extol His people for He shall avenge the blood [<b>calamities<\/b>] of His [<b>just<\/b>] servants and wreak vengeance [<b>calamity<\/b>] on His enemies and reconcile His land, His people.", "pj": "שַׁבְּחוּ אוּמַיָא עַמֵיהּ בֵּית יִשְרָאֵל אֲרוּם אֲדַם עַבְדוֹי דְאִשְׁתַּיְדֵי הוּא פָּרְעוּ נְטַר וּנְקָמָה דְפוּרְעָנוּתָא יַחֲזוֹר עַל בַּעֲלֵי דְבָבוֹי וְהוּא בְּמֵימְרֵיהּ יְכַפֵּר עַל אַנְפֵּי אַרְעֵיהּ וְעַמֵיהּ", "pj_en": "Rejoice, ye nations, (and) ye people of Beth Israel; for the blood of His servants which was shed, He hath avenged. He hath kept (in mind) and returned just vengeance upon His adversaries, and by His Word will He make Atonement for His land, and for His people.", "tj": "קַלְסוּ קֳדָמוֹי עַמָא שַׁבָּחוּ יָתֵיהּ עַמֵיהּ דְבֵית יִשְרָאֵל אֲרוּם עֶלְבּוֹן עַבְדוֹי צַדִיקַיָא הוּא תְבַע וְנִקְמָתָא יַחֲזִיר לְבַעֲלֵי דְבָבוֹי וּבְחוֹבֵי עַמָא לַקְיֵיהּ אַרְעָא וִיכַפֵּר עַל אַרְעֵיהּ וְעַל עַמֵיהּ:", "tj_en": "Let the nations give praise before Him, let the people of Beth Israel glorify Him; for He bath made inquisition for the trouble of His righteous servants, and brought vengeance upon His enemies; for the sins of His people He smote the land; but He will make Atonement for the land, and for His people.", "rashi": "<b>הרנינו גוים עמו.<\/b> לְאוֹתוֹ הַזְּמַן יְשַׁבְּחוּ הָאֻמּוֹת אֶת יִשְׂרָאֵל, רְאוּ מַה שִּׁבְחָהּ שֶׁל אֻמָּה זוֹ, שֶׁדָּבְקוּ בְּהַקָּבָּ\"ה בְּכָל הַתְּלָאוֹת שֶׁעָבְרוּ עֲלֵיהֶם וְלֹא עֲזָבוּהוּ, יוֹדְעִים הָיוּ בְּטוּבוֹ וּבְשִׁבְחוֹ:<br><br><b>כי דם עבדיו יקום.<\/b> שְׁפִיכוּת דְּמֵיהֶם, כְּמַשְׁמָעוֹ:<br><br><b>ונקם ישיב לצריו.<\/b> עַל הַגָּזֵל וְעַל הֶחָמָס, כָּעִנְיָן שֶׁנֶּאֱמַר (יואל ד') \"מִצְרַיִם לִשְׁמָמָה תִהְיֶה וֶאֱדוֹם לְמִדְבַּר שְׁמָמָה תִּהְיֶה מֵחֲמַס בְּנֵי יְהוּדָה\", וְאוֹמֵר (עובדיה י') \"מֵחֲמַס אָחִיךָ יַעֲקֹב וְגוֹ'\" (עי' ספרי):<br><br><b>וכפר אדמתו עמו.<\/b> וִיפַיֵּס אַדְמָתוֹ וְעַמּוֹ עַל הַצָּרוֹת שֶׁעָבְרוּ עֲלֵיהֶם וְשֶׁעָשָׂה לָהֶם הָאוֹיֵב:<br><br><b>וכפר.<\/b> לְשׁוֹן רִצּוּי וּפִיּוּס, כְּמוֹ (בראשית לב, כא) \"אֲכַפְּרָה פָנָיו\" — אַנְחִינֵיהּ לְרוּגְזֵיהּ:<br><br><b>וכפר אדמתו<\/b> וּמַה הִיא אַדְמָתוֹ? <b>עמו.<\/b> כְּשֶׁעַמּוֹ מִתְנַחֲמִים אַרְצוֹ מִתְנַחֶמֶת, וְכֵן הוּא אוֹמֵר \"רָצִיתָ ה' אַרְצֶךָ\", בַּמֶּה רָצִיתָ אַרְצֶךָ? \"שַׁבְתָּ שְׁבִית יַעֲקֹב\" (תהילים פ\"ה).<br><br>בְּפָנִים אֲחֵרִים הִיא נִדְרֶשֶׁת בְּסִפְרֵי וְנֶחְלְקוּ בָהּ רַבִּי יְהוּדָה וְרַבִּי נְחֶמְיָה, רַבִּי יְהוּדָה דוֹרֵשׁ כֻּלָּהּ כְּנֶגֶד יִשְׂרָאֵל, וְרַבִּי נְחֶמְיָה דוֹרֵשׁ אֶת כֻּלָּה כְּנֶגֶד הָאֻמּוֹת, רַבִּי יְהוּדָה דוֹרְשָׁהּ כְּלַפֵּי יִשְׂרָאֵל — (כו) <b>אמרתי אפאיהם<\/b> כְּמוֹ שֶׁפֵּרַשְׁתִּי, עַד (כז) <b>ולא ה' פעל כל זאת.<\/b> (כח) <b>כי גוי אבד עצות המה.<\/b> אָבְדוּ תוֹרָתִי שֶׁהִיא לָהֶם עֵצָה נְכוֹנָה, <b>ואין בהם תבונה<\/b> לְהִתְבּוֹנֵן (ל) <b>איכה ירדף אחד<\/b> מִן הָאֻמּוֹת <b>אלף<\/b> מֵהֶם, <b>אם לא כי צורם מכרם.<\/b> (לא) <b>כי לא כצורנו צורם<\/b> הַכֹּל כְּמוֹ שֶׁפֵּרַשְׁתִּי עַד תַּכְלִית. וְרַ' נְחֶמְיָה דוֹרְשָׁהּ כְּלַפֵּי הָאֻמּוֹת, <b>כי גוי אבד עצות המה<\/b>, כְּמוֹ שֶׁפֵּרַשְׁתִּי תְחִלָּה עַד <b>ואיבינו פלילים<\/b>:<br><br>(לב) <b>כי מגפן סדם גפנם.<\/b> שֶׁל אֻמּוֹת:<br><br><b>ומשדמת עמרה וגו'.<\/b> וְלֹא יָשִׂימוּ לִבָּם לִתְלוֹת הַגְּדֻלָּה בִּי:<br><br><b>ענבמו ענבי רוש.<\/b> הוּא שֶׁאָמַר <b>לולי כעס אויב אגור<\/b> עַל יִשְׂרָאֵל לְהַרְעִילָם וּלְהַמְרִירָם, לְפִיכָךְ <b>אשכלת מררת למו<\/b> לְהַלְעִיט אוֹתָם עַל מַה שֶּׁעָשׂוּ לְבָנַי:<br><br>(לג) <b>חמת תנינם יינם.<\/b> מוּכָן לְהַשְׁקוֹתָם עַל מַה שֶּׁעוֹשִׂין לָהֶם:<br><br>(לד) <b>כמס עמדי.<\/b> אוֹתוֹ הַכּוֹס, שֶׁנֶּאֱמַר (תהילים ע\"ה) \"כִּי כוֹס בְּיַד ה' וְגוֹ'\":<br><br>(לה) <b>לעת תמוט רגלם.<\/b> כָּעִנְיָן שֶׁנֶּאֱמַר \"תִּרְמְסֶנָּה רֶגֶל\" (ישעיהו כ\"ו):<br><br>(לו) <b>כי ידין ה' עמו.<\/b> בְּלָשוֹן זֶה מְשַׁמֵּשׁ <b>כי ידין<\/b> בִּלְשוֹן דְּהָא, וְאֵין יָדִין לְשוֹן יִסּוּרִין אֶלָּא כּמוֹ כִּי יָרִיב אֶת רִיבָם מִיַּד עוֹשְׁקֵיהֶם. <b>כי יראה כי אזלת יד וגו'<\/b>:<br><br>(לז) <b>ואמר אי אלהימו.<\/b> הָאוֹיֵב יֹאמַר אֵי אֱלֹהֵימוֹ שֶׁל יִשְׂרָאֵל? כְּמוֹ שֶׁאָמַר טִיטוּס הָרָשָׁע כְּשֶׁגִּדֵּר אֶת הַפָּרֹכֶת (גיטין נ\"ו), כָּעִנְיָן שֶׁנֶּאֱמַר (מיכה ז'): וְתֵרֶא אֹיַבְתִּי וּתְכַסֶּהָ בוּשָׁה הָאוֹמְרָה אֵלַי אַיּוֹ ה' אֱלֹהָיִךְ\":<br><br>(לט) <b>ראו עתה כי אני וגו'.<\/b> אָז יְגַלֶּה הַקָּבָּ\"ה יְשׁוּעָתוֹ וְיֹאמַר <b>ראו עתה כי אני אני הוא<\/b>, מֵאִתִּי בָּאת עֲלֵיהֶם הָרָעָה וּמֵאִתִּי תָבֹא עֲלֵיהֶם הַטּוֹבָה:<br><br><b>ואין מידי מציל.<\/b> שֶׁיַּצִּיל אֶתְכֶם מִן הָרָעָה אֲשֶר אָבִיא עֲלֵיכֶם:<br><br>(מ) <b>כי אשא אל שמים ידי.<\/b> כְּמוֹ כִּי נָשָׂאתִי — תָּמִיד אֲנִי מַשְׁרֶה מְקוֹם שְׁכִינָתִי בַשָּׁמַיִם, כְּתַרְגּוּמוֹ, אֲפִלּוּ חַלָּש לְמַעְלָה וְגִבּוֹר לְמַטָּה אֵימַת עֶלְיוֹן עַל הַתַּחְתּוֹן וְכָל שֶׁכֵּן שֶׁגִּבּוֹר לְמַעְלָה וְחַלָּשׁ מִלְּמַטָּה:<br><br><b>ידי.<\/b> מְקוֹם שְׁכִינָתִי, כְּמוֹ \"אִישׁ עַל יָדוֹ\" (במדבר ב'), וְהָיָה בְיָדִי לְהִפָּרַע מִכֶּם, אֲבָל אָמַרְתִּי שֶׁחַי אָנֹכִי לְעוֹלָם, אֵינִי מְמַהֵר לִפָּרַע לְפִי שֶׁיֵּשׁ לִי שָׁהוּת בַּדָּבָר, אֲנִי חַי לְעוֹלָם וּבְדוֹרוֹת אַחֲרוֹנִים אֲנִי נִפְרָע מֵהֶם וְהַיְכֹלֶת בְּיָדִי לִפָּרַע מִן הַמֵּתִים וּמִן הַחַיִּים; מֶלֶךְ בָּשָׂר וָדָם שֶׁהוּא הוֹלֵךְ לָמוּת מְמַהֵר נִקְמָתוֹ לְהִפָּרַע בְּחַיָּיו כִּי שֶׁמָּא יָמוּת הוּא אוֹ אוֹיְבוֹ וְנִמְצָא שֶׁלֹּא רָאָה נִקְמָתוֹ מִמֶּנּוּ אֲבָל אֲנִי חַי לְעוֹלָם, וְאִם יָמוּתוּ הֵם וְאֵינִי נִפְרָע בְּחַיֵּיהֶם, אֶפָּרַע בְּמוֹתָם:<br><br>(מא) <b>אם שנותי ברק חרבי.<\/b> הַרְבֵּה אִם יֵשׁ שֶׁאֵינָם תְּלוּיִן, כְּשֶׁאֲשַׁנֵּן <b>ברק חרבי ותאחז במשפט ידי<\/b>, כֻּלּוֹ כְּמוֹ שֶׁפֵּרַשְׁתִּי לְמַעְלָה:", "rashi_en": "הרנינו גוים עמו SING ALOUD, O YE NATIONS, OF HIS PEOPLE — At that time (when I shall take vengeance on them) the nations will praise Israel (Sifrei Devarim 333:2): “See, how praiseworthy is this people, — that they have cleaved to the Holy One, blessed be He, amidst all the troubles which have passed over them, and have not forsaken Him, for they had constantly experienced His goodness and His excellence”.<br><br>כי דם עבדיו יקם FOR HE WILL AVENGE THE BLOOD OF HIS SERVANTS — i.e., the shedding of their blood, as the phrase usually implies.<br><br>ונקם ישיב לצריו AND HE WILL RENDER VENGEANCE TO HIS ADVERSARIES for their robbery and their violence, just as it is stated, (Joel 4:19) “Egypt shall be a desolation and Edom shall be a desolate wilderness, for the violence against the children of Judah …”, and it states in another passage (Obadiah 10) “For the violence against thy brother Jacob [shame shall cover thee]” (cf. Sifrei Devarim 333:3).<br><br>וכפר אדמתו עמו means, and He will appease His land and His people for the miseries that have passed over them and for that which the enemy has caused them.<br><br>וכפר is an expression denoting appeasing and calming, as e.g. (Genesis 32:21) אכפרה פניו which is rendered in the Targum by “I will appease his anger” (cf. Rashi on that verse).<br><br>וכפר אדמתו AND HE WILL PROPITIATE HIS LAND — and what is His land? עמו HIS PEOPLE — when His people receives comfort His land, too, receives comfort, and so, too, it states, (Psalms 85:2) “Thou hast been favourable, O Lord, unto Thy land” — whereby hast Thou been favourable unto Thy land? The words that follow in the text give the answer: “Thou hast brought back the captivity of Jacob” (Thy people). <br><br>— In a different manner is it (the section from v. 26 onwards) expounded in Sifrei, and there is a difference of opinion regarding it between R. Judah and R. Nehemiah. R. Judah expounds the whole of it as having reference to Israel, whilst R. Nehemiah refers the whole of it as referring to the other nations (Sifrei Devarim 327). R. Judah explains it as referring to Israel as follows: (26) אמרתי אפאיהם in the same manner as I have explained it, up to (27) כי גוי אבד עצות המה (28) .ולא ה' פעל כל זאת FOR THEY ARE A NATION LOSING COUNSEL, i.e., they have lost My Torah, which was a fitting counsel for them, ואין בהם תבונה AND THERE IS NO UNDERSTANDING IN THEM to consider,# (30) איכה ירדף אחד HOW ONE MAN of the nations COULD PURSUE אלף A THOUSAND of them, אם לא כי צורם מכרם EXCEPT THAT THEIR ROCK HAD DELIVERED THEM into their power.# (31) כי לא כצורנו צורם — all as I have explained, right up to the end. — R. Nehemiah expounds it as referring to the other nations as follows: (28) כי גוי אבד עצות המה — This he explains as I have explained it at first up to (31): ואיבינו פלילים<br><br>— (‎32) כי מגפן סדם גפנם FOR AS THE VINE OF SODOM IS THEIR VINE — i.e. the vine of the other nations.<br><br>ומשדמת עמרה AND OF THE FIELDS OF GOMORRAH etc., — and they do not set their mind to attribute the greatness to Me.<br><br>ענבמו ענבי רוש THEIR GRAPES ARE GRAPES OF GALL — This is what it stated above לולא כעס אויב אגור WERE IT NOT THAT THE ANGER OF THE ENEMY IS HEAPED UP against Israel to destroy them (cf. Rashi’s explanation of אגור above) — so, too, here: \"their grapes are grapes of gall”, to make them (the Israelites) reel and to embitter their lives, and therefore אשכלות מררות למו BITTER CLUSTERS ARE FOR THEM to make them swallow them for what they have done to My children.<br><br>(33) חמת תנינם יינם WINE OF DRAGONS IS THEIR WINE — i.e., the wine prepared to give them to drink for what they have done to them (יינם “their wine” is not the wine which they prepare, but that which is prepared for them).<br><br>(34) כמס עמדי IS IT NOT LAID WITH ME — “it” means that cup (which is implied in the word יינם, “the wine prepared for them”), as it states. (Psalms 75:9) “For in the hand of the Lord is a cup … [and the dregs thereof all the wicked of the earth shall drink them]”.<br><br>(35) לעת תמוט רגלם AT THE TIME THEIR FOOT (i.e., of the enemies) SHALL TOTTER — this is similar to what is said, (Isaiah 26:6) “The foot shall tread it down”.<br><br>(36) כי ידין ה׳ עמו — In this explanation, in the phrase כי ידין the word כי is used in the meaning of “because” (not as in the former explanation where it means “when”), and ידין is not an expression for sufferings (the meaning it was given above) but it means as much as: For He (God) will plead their cause (take their parts) against the power of their oppressors, כי יראה כי אזלת יד וגו׳, when He sees that the hand of the enemy waxes mighty, etc.<br><br>(37) ואמר אי אלהימו AND HE SAYS WHERE IS THEIR GOD — i.e., when the enemy (cf. this with Rashi’s previous explanation) will say, “Where is the God of Israel?” — even as Titus, the wicked, asked, when he pierced the curtain of the Holy of Holies (cf. Gittin 56b), just as it is said, (Micah 7:10) “Then my enemy shall see it, and shame shall cover her who said unto Me, Where is the Lord, thy God?”<br><br>(39) ראו עתה כי אני וגו׳ means, then the Lord will display His saving power and will say, SEE NOW, THAT IT IS I, EVEN I — from Me came the evil upon them (the Israelites) and from Me will good come upon them.<br><br>ואין מידי מציל AND THERE IS NONE THAT CAN DELIVER OUT OF MY HAND — i.e. that can deliver you (the nations) from the evil which I shall now bring upon you.<br><br>(40) כי אשא אל שמים ידי — The first two words (continuing this exposition) are as much as כי נשאתי, “Because I have lifted up”, and the text means: everlasting I made the heaven the dwelling-place of My Glory, — as the Targum takes it (“For I have established in heaven the place of My Divine Glory”) — therefore there will surely be none that can deliver you, for even when the weak person is above and the strong below, the fear of him that is above lies upon him that is below; how much more is this so when “I”, the strong, am above and you, the weak, are below.<br><br>— ידי means the place of My Divine Glory, as (Numbers 2:17) “every man by his place (ידו)”, — therefore I had the power to punish you immediately, but I said that I shall live forever, therefore I need not hasten to exact punishment, because I have time for this matter: I live for ever and in later generations can punish them, for I have the power to exact punishment both from the living and the dead. A human king who is always going to die (may die at any moment), takes quick vengeance to punish during his lifetime, because either he or his enemy may die with the result that he would never exact his vengeance from him; but I live for ever, and if they (My enemies) should die and I shall not have exacted punishment from them during their lifetime, I can exact it when they are dead.<br><br>(41) אם שנותי ברק חרבי — There are many instances where the particle אם is not used conditionally (i.e., it does not signify “if”). Here, also: when I shall whet ברק חרבי MY GLITTERING SWORD AND MY HAND SHALL HOLD FAST ON JUSTICE, etc., etc., all as I have explained above."}, {"ch": 32, "v": 44, "aliyah": 7, "heb": "וַיָּבֹ֣א מֹשֶׁ֗ה וַיְדַבֵּ֛ר אֶת־כׇּל־דִּבְרֵ֥י הַשִּׁירָֽה־הַזֹּ֖את בְּאׇזְנֵ֣י הָעָ֑ם ה֖וּא וְהוֹשֵׁ֥עַ בִּן־נֽוּן׃", "onk": "וַאֲתָא משֶׁה וּמַלִּיל יָת כָּל פִּתְגָּמֵי תֻשְׁבַּחְתָּא הָדָא <b>קֳדָם<\/b> עַמָּא הוּא וְהוֹשֵׁעַ בַּר נוּן:", "onk_en": "Moshe came and he spoke all the words of this song in the hearing of [<b>before<\/b>] the people; he and Hoshe’a, the son of Nun.", "pj": "וְאָתָא משֶׁה מִן מַשְׁכַּן בֵּית אוּלְפָנָא וּמַלֵיל יַת כָּל פִּתְגָמֵי תּוּשְׁבַּחְתָּא הֲדָא בְּמִשְׁמָעֵיהוֹן דְעַמָא הוּא וְהוֹשֵׁעַ בַּר נוּן", "pj_en": "And Mosheh came from the tabernacle of the house of instruction, and spake all the words of this hymn, in the hearing of the people, he and Jehoshua bar Nun.", "tj": "וַאֲתָא משֶׁה וּמַלֵיל יַת כָּל שְׁבַח פִּתְגָמֵי שִׁירָתָא הֲדָא בְּמִשְׁמָעֵיהוֹן דְעַמָא הוּא וְהוֹשֵׁעַ בַּר נוּן:", "tj_en": "And Mosheh came and spake all the praise of the words of this hymn in the hearing of the people, be and Hoshea bar Nun.", "rashi": "<b>הוא והושע בן נון.<\/b> שַׁבָּת שֶׁל דְּיוֹזְגִי הָיְתָה, נִטְּלָה רְשׁוּת מִזֶּה וְנִתְּנָה לָזֶה, הֶעֱמִיד לוֹ מֹשֶׁה מְתֻרְגְּמָן לִיהוֹשֻׁעַ שֶׁיְּהֵא דוֹרֵשׁ בְּחַיָּיו, כְּדֵי שֶׁלֹּא יֹאמְרוּ יִשְׂרָאֵל בְּחַיֵּי רַבְּךָ לֹא הָיָה לְךָ לְהָרִים רֹאשׁ; וְלָמָּה קוֹרְאֵהוּ כָּאן הוֹשֵׁעַ? לוֹמַר שֶׁלֹּא זָחָה דַעְתּוֹ עָלָיו שֶׁאַעַ\"פִּ שֶׁנִּתְּנָה לוֹ גְּדֻלָּה הִשְׁפִּיל עַצְמוֹ כַּאֲשֶׁר מִתְּחִלָּתוֹ (עי' ספרי):", "rashi_en": "הוא והושע בן נון HE AND HOSHEA THE SON OF NUN — It was the Sabbath of transmission of office (lit., “of two pairs” of judges): authority was taken from one and given to the other (Sotah 13b). Moses appointed a Meturgeman for Joshua that he (Joshua) should hold in public an Halachic discourse during his (Moses') lifetime in order that the Israelites should not say to him, “During your teacher’s lifetime you did not dare to raise your head!” — And why does it (Scripture) here call him Hosea (since his name had long since been changed to that of Joshua — cf. Numbers 13:16)? In order to indicate that he did not become haughty, for although this dignity had been conferred upon him, he assumed a humble bearing as at the commencement of his career (cf. Sifrei Devarim 334:3)."}, {"ch": 32, "v": 45, "aliyah": 7, "heb": "וַיְכַ֣ל מֹשֶׁ֗ה לְדַבֵּ֛ר אֶת־כׇּל־הַדְּבָרִ֥ים הָאֵ֖לֶּה אֶל־כׇּל־יִשְׂרָאֵֽל׃", "onk": "וְשֵׁצִי משֶׁה לְמַלָּלָא יָת כָּל פִּתְגָּמַיָּא הָאִלֵּין עִם כָּל יִשְׂרָאֵל:", "onk_en": "When Moshe finished speaking all these words to all of Yisroel,", "pj": "וּפְסַק משֶׁה מִן לְמַלָלָא יַת כָּל דְבִירַיָא הָאִלֵין עִם כָּל יִשְרָאֵל", "pj_en": "And Mosheh made an end of speaking all these words with all Israel,", "tj": "וְאַשְׁלִים משֶׁה לְמַלָלָא יַת כָּל פִּתְגָמַיָא הָאִילֵין עִם כָּל יִשְרָאֵל:", "tj_en": "And Mosheh ended speaking all these words with all Israel,", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 46, "aliyah": 7, "heb": "וַיֹּ֤אמֶר אֲלֵהֶם֙ שִׂ֣ימוּ לְבַבְכֶ֔ם לְכׇ֨ל־הַדְּבָרִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י מֵעִ֥יד בָּכֶ֖ם הַיּ֑וֹם אֲשֶׁ֤ר תְּצַוֻּם֙ אֶת־בְּנֵיכֶ֔ם לִשְׁמֹ֣ר לַעֲשׂ֔וֹת אֶת־כׇּל־דִּבְרֵ֖י הַתּוֹרָ֥ה הַזֹּֽאת׃", "onk": "וַאֲמַר לְהוֹן שַׁוּוּ לִבְּכוֹן לְכָל פִּתְגָּמַיָּא דִי אֲנָא מַסְהֵד בְּכוֹן יוֹמָא דֵין דִּי תְפַקְּדֻנּוּן יָת בְּנֵיכוֹן לְמִטַּר לְמֶעְבַּד יָת כָּל פִּתְגָּמֵי אוֹרַיְתָא הָדָא:", "onk_en": "He said to them, ‘‘Focus your thoughts on all the statements that I am bringing to witness against you today; which you are to command to your sons to guard and to fulfill all the statements of this Torah.", "pj": "וַאֲמַר לְהוֹן שַׁווּן לִבְּכוֹן לְכָל פִּתְגָמַיָא דַאֲנָא מַסְהִיד בְּכוֹן יוֹמָנָא דְתַפְקְדוּנוּן יַת בְּנֵיכוֹן מְטוֹל לְמִינְטוֹר וּלְמֶעֱבַד יַת כָּל פִּתְגָמֵי אוֹרַיְיתָא הָדָא", "pj_en": "and said to them: Apply your heart to all the words with which I bear witness to you this day, that you may dictate them to your children, so that they may observe and do all the words of this law.", "tj": "וַאֲמַר לְהוֹן שַׁווּ לְבָבֵיכוֹן לְכָל פִּתְגָמִין דִי אֲנָא מַסְהִיד בְּכוֹן יוֹמָא הָדֵין דִי תִפְקְדוּן יַתְהוֹן יַת בְּנֵיכוֹן לְמִיטַר לְמֶעֱבַד יַת כָּל מִילֵי שְׁבַח אוֹרַיְיתָא הֲדָא:", "tj_en": "and said to them: Set your heart unto all the words with which I bear witness to you this day, and which you shall teach your children, that they may observe and do all the glorious words of this law.", "rashi": "<b>שימו לבבכם.<\/b> צָרִיךְ אָדָם שֶׁיִּהְיוּ עֵינָיו וְלִבּוֹ וְאָזְנָיו מְכֻוָּנִים לְדִבְרֵי תוֹרָה, וְכֵן הוּא אוֹמֵר \"בֶּן אָדָם רְאֵה בְעֵינֶיךָ וּבְאָזְנֶיךָ שְׁמַע וְשִׂים לִבְּךָ\" (יחזקאל מ'); וַהֲרֵי דְבָרִים קַל וָחֹמֶר וּמַה תַּבְנִית הַבַּיִת שֶׁהוּא נִרְאֶה לָעֵינַיִם וְנִמְדָד בְּקָנֶה צָרִיךְ אָדָם שֶׁיִּהְיוּ עֵינָיו וְאָזְנָיו וְלִבּוֹ מְכֻוָּנִין, לְהָבִין דִּבְרֵי תוֹרָה שֶׁהֵן כַּהֲרָרִין תְּלוּיִין בִּשְׂעָרָה עַל אַחַת כַּמָּה וְכַמָּה (ספרי):", "rashi_en": "שימו לבבכם SET YOUR HEARTS [UNTO ALL THE WORDS WHICH I TESTIFY AGAINST YOU THIS DAY] — Indeed, it is necessary for a man that his eyes, his heart and his ears, should all be attentively directed to the words of the Torah, for so it states, (Ezekiel 40:4) “Son of man, behold with thine eyes, and hear with thine ears, and set thine heart [upon all that I shall show thee]” (viz., the plan of the Temple). If in the case of the model of the Temple, which was being made visible to the eyes and was being measured by a rod, it was necessary for a man, according to Scripture, that his eyes, his ears and his heart be attentive, then in order to understand the words of the Torah which are like mountains suspended on a hair (i.e., numerous laws are derived from a single word of the Torah), how much the more is this necessary!"}, {"ch": 32, "v": 47, "aliyah": 7, "heb": "כִּ֠י לֹא־דָבָ֨ר רֵ֥ק הוּא֙ מִכֶּ֔ם כִּי־ה֖וּא חַיֵּיכֶ֑ם וּבַדָּבָ֣ר הַזֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל־הָ֣אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת־הַיַּרְדֵּ֛ן שָׁ֖מָּה לְרִשְׁתָּֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי לָא פִתְגָּם רֵקָא הוּא מִנְּכוֹן אֲרֵי הוּא חַיֵּיכוֹן וּבְפִתְגָּמָא הָדֵין תּוֹרְכוּן יוֹמִין עַל אַרְעָא דִּי אַתּוּן עָבְרִין יָת יַרְדְּנָא תַּמָּן לְמֵירְתַהּ:", "onk_en": "For it is not a futile thing for you, for it is your life; and by this matter will you live long on the land that you are crossing the Yardein there to inherit.’’", "pj": "אֲרוּם לֵית פִּתְגָם רֵיקָם בְּאוֹרַיְיתָא אֱלָהֵן לִדְעַבְרִין עֲלָהּ אֲרוּם הוּא חַיֵיכוֹן וּבְפִתְגָמֵי הָדֵין תּוֹרְכוּן יוֹמִין עַל אַרְעָא דְאַתּוּן עָבְרִין יַת יוֹרְדְנָא תַמָן לְמֵירְתָהּ", "pj_en": "For there is no vain word in the law, unless to them who transgress it; for it is your life, and by this word you will prolong days upon the land that you pass over Jordan to inherit.", "tj": "אֲרוּם לֵית פִּתְגַם רֵיקָן הוּא מִנְכוֹן אֲרוּם הוּא חַיֵיכוֹן וּבְפִתְגָמָא הָדֵין תִּסְגוּן יוֹמִין עַל אַרְעָא דִי אַתּוּן עָבְרִין יַת יַרְדְנָא תַּמָן לְמֵירַת יָתָהּ:", "tj_en": "For it is not a vain word to you, because it is your life, and by this word you will multiply days upon the land that you pass over Jordan to inherit.", "rashi": "<b>כי לא דבר רק הוא מכם.<\/b> לֹא לְחִנָּם אַתֶּם יְגֵעִים בָּהּ, כִּי הַרְבֵּה שָׂכָר תָּלוּי בָּהּ, <b>כי הוא חייכם;<\/b> דָּ\"אַ — אֵין לְךָ דָבָר רֵיקָן בַּתּוֹרָה שֶׁאִם תִּדְרְשֶׁנּוּ שֶׁאֵין בּוֹ מַתַּן שָׂכָר, תֵּדַע לְךָ שֶׁכֵּן אָמְרוּ חֲכָמִים \"וַאֲחוֹת לוֹטָן תִּמְנָע\" (בראשית ל\"ו) \"וְתִמְנַע הָיְתָה פִילֶגֶשׁ וְגוֹ'\", לְפִי שֶׁאָמְרָה אֵינִי כְדַאי לִהְיוֹת לוֹ אִשָּׁה הַלְוַאי וְאֶהְיֶה פִילַגְשׁוֹ, וְכָל כָּךְ לָמָּה? לְהוֹדִיעַ שִׁבְחוֹ שֶׁל אַבְרָהָם שֶׁהָיוּ שִׁלְטוֹנִים וּמְלָכִים מִתְאַוִּים לִדַּבֵּק בְּזַרְעוֹ (ספרי):", "rashi_en": "כי לא דבר רק הוא מכם FOR IT IS NOT A VAIN THING FOR YOU — it is not for nothing that you are to occupy yourselves laboriously with it. because much reward depends on it, כי הוא חייכם FOR IT IS YOUR LIFE (life is the reward). Another explanation: There is not one empty (ריק i.e., apparently superfluous) word in the Torah that, if you properly expound it, has not a grant of reward attached to it for doing so. You can know this, for so did our Rabbis say: It states (Genesis 36:22) “And Lotan’s sister was Timna”; (Genesis 36:32) “and Timna was concubine [to Eliphaz, Esau’s son]”. Why is this stated? Because she (Timna) said, “If I am unworthy to become his (Elphaz's) wife, would that I would become his concubine!”. And why all this (why does Scripture enter into all these details of her birth and marriage; of what interest is it to us)? To tell you in what distinction Abraham was held — that rulers and kings (Lotan was one of the chieftains of Seir, cf. Genesis 36:20—21) were eager to connect themselves by marriage to his descendants (Sifrei Devarim 336:1; cf. Rashi on Genesis 36:12)."}, {"ch": 32, "v": 48, "aliyah": 7, "heb": "וַיְדַבֵּ֤ר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה בְּעֶ֛צֶם הַיּ֥וֹם הַזֶּ֖ה לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה בִּכְרַן יוֹמָא הָדֵין לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe at the very height of that day, saying,", "pj": "וּמַלֵיל יְיָ עִם משֶׁה בְּשַׁבְעָא בְּיַרְחָא דְאָדָר בִּכְרַן יוֹמָא הָדֵין לְמֵימָר", "pj_en": "And the Lord spake with Mosheh on the seventh of the month Adar, on the same day, saying,", "tj": "וּמַלֵיל מֵימְרָא דַיְיָ עִם משֶׁה הֵיךְ זְמַן יוֹמָא הָדֵין לְמֵימָר:", "tj_en": "", "rashi": "<b>וידבר ה' אל משה בעצם היום הזה.<\/b> בִּשְׁלוֹשָׁה מְקוֹמוֹת נֶאֱמַר בְּעֶצֶם הַיּוֹם הַזֶּה, נֶאֱמַר בְּנֹחַ \"בְּעֶצֶם הַיּוֹם הַזֶּה בָּא נֹחַ וְגוֹ'\" (בראשית ז') — בְּמַרְאִית אוֹרוֹ שֶׁל יוֹם, לְפִי שֶׁהָיוּ בְנֵי דוֹרוֹ אוֹמְרִים בְּכָךְ וְכָךְ אִם אָנוּ מַרְגִּישִׁין בּוֹ, אֵין אָנוּ מַנִּיחִין אוֹתוֹ לִכָּנֵס בַּתֵּבָה, וְלֹא עוֹד אֶלָּא אָנוּ נוֹטְלִין כַּשִּׁילִין וְקַרְדֻּמּוֹת וּמְבַקְּעִין אֶת הַתֵּבָה, אָמַר
