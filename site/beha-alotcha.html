ake them to the Tent of Meeting, and they shall stand there with you.", "pj": "וַאֲמַר יְיָ לְמשֶׁה כְּנוֹשׁ לִשְׁמִי שׁוּבְעִין גוּבְרִין זַכָּאִין מִסָבֵי יִשְרָאֵל דִיְדַעְתְּ דְהִינוּן הֲווֹ סָבֵי עַמָא וְסַרְכוֹי בְּמִצְרַיִם וְתִדְבַּר יַתְהוֹן לְמַשְׁכַּן זִמְנָא וְיִתְעַתְּדוּן תַּמָן עִמָךְ", "pj_en": "Then spake the Lord unto Mosheh, Gather together in My name seventy righteous men of the elders of Israel, whom thou knowest to be elders of the people, and who were set over them in Mizraim, and bring them to the taberncle to stand there with thee.", "tj": "", "tj_en": "", "rashi": "<b>אספה לי.<\/b> הֲרֵי תְשׁוּבָה לִתְלוּנָתְךָ שֶׁאָמַרְתָּ לֹא אוּכַל אָנֹכִי לְבַדִּי; וְהַזְּקֵנִים הָרִאשׁוֹנִים הֵיכָן הָיוּ? וַהֲלֹא אַף בְּמִצְרַיִם יָשְׁבוּ עִמָּהֶם, שֶׁנֶּאֱמַר (שמות ג') \"לֵךְ וְאָסַפְתָּ אֶת זִקְנֵי יִשְׂרָאֵל\"? אֶלָּא בְּאֵשׁ תַּבְעֵרָה מֵתוּ; וּרְאוּיִים הָיוּ לְכָךְ מִסִּינַי, דִּכְתִיב \"וַיֶּחֱזוּ אֶת הָאֱלֹהִים\" (שם כ\"ד) — שֶׁנָּהֲגוּ קַלּוּת רֹאשׁ כְּנוֹשֵׁךְ פִּתּוֹ וּמְדַבֵּר בִּפְנֵי הַמֶּלֶךְ, וְזֶהוּ \"וַיֹּאכְלוּ וַיִּשְׁתּוּ\", וְלֹא רָצָה הַקָּבָּ\"ה לִתֵּן אֲבֵלוּת בְּמַתַּן תּוֹרָה וּפָרַע לָהֶם כָּאן (תנחומא):<br><br><b>אשר ידעת כי הם וגו'.<\/b> אוֹתָן שֶׁאַתָּה מַכִּיר שֶׁנִּתְמַנּוּ עֲלֵיהֶם שׁוֹטְרִים בְּמִצְרַיִם בַּעֲבוֹדַת פֶּרֶךְ וְהָיוּ מְרַחֲמִים עֲלֵיהֶם וּמֻכִּים עַל יָדָם, שֶׁנֶּאֱמַר \"וַיֻּכּוּ שֹׁטְרֵי בְנֵי יִשְׂרָאֵל\" (שמות ה'), עַתָּה יִתְמַנּוּ בִגְדֻלָּתָן כְּדֶרֶךְ שֶׁנִּצְטַעֲרוּ בְּצָרָתָן (עי' ספרי):<br><br><b>ולקחת אתם.<\/b> קָחֵם בִּדְבָרִים, \"אַשְׁרֵיכֶם שֶׁנִּתְמַנִּיתֶם פַּרְנָסִים עַל בָּנָיו שֶׁל מָקוֹם\":<br><br><b>והתיצבו שם עמך.<\/b> כְּדֵי שֶׁיִּרְאוּ יִשְׂרָאֵל וְיִנְהֲגוּ בָהֶם גְּדֻלָּה וְכָבוֹד, וְיֹאמְרוּ חֲבִיבִין אֵלּוּ שֶׁנִּכְנְסוּ עִם מֹשֶׁה לִשְׁמֹעַ דִּבּוּר מִפִּי הַקָּבָּ\"ה (שם):", "rashi_en": "אספה לי GATHER UNTO ME [SEVENTY MEN OF THE ELDERS OF ISRAEL] — \"This\" — the Lord said — “is the reply to your complaint which you uttered (v. 14) I am not able to bear all this people alone”’ (cf. Sifrei Bamidbar 92). But where were the first elders, that God commanded him to gather elders anew? Had they not sat as judges together with them (with Moses and Aaron) in Egypt, as it is stated, (Exodus 3:16) “Go and gather the elders of Israel together”? But these had died by the consuming fire of Taberah (v. 3). They really had deserved this for their conduct at Sinai, as it is said, (Exodus 24:11) \"And they beheld God” which means, that they comported themselves irreverently towards God — like a person who nibbles his bread and at the same time addresses the king — for this is the meaning of the words, “[And they saw God] and ate and drank”. The Holy One, blessed be He, however, did not wish to give any cause for mourning at the joyous event of the Lawgiving, and therefore punished them here (at Taberah) (Midrash Tanchuma, Beha'alotcha 16).<br><br>אשר ידעת כי הם וגו׳ WHOM THOU KNOWEST TO BE [THE ELDERS OF THE PEOPLE, AND BAILIFFS OVER THEM] — i.e. them whom thou knowest to have been appointed officers (שמרים) over them (the Israelites) in Egypt in connection with the rigorous labour imposed on them, but they pitied them and were smitten by the Egyptian taskmasters on their account — as it is said, (Exodus 5:14) “and the officers of (שמד) the children of Israel were smitten”. Now they were to become officers in their greatness (now when the Israelites had become great) just as they had suffered when they (the Israelites) were in distress (cf. Sifrei Bamidbar 92).<br><br>ולקחת אתם AND TAKE THEM [UNTO THE APPOINTED TENT] — win them over with fine words: “Happy are you that you are appointed chiefs over the children of the Omnipresent God” (cf. Sifrei Bamidbar 92).<br><br>והתיצבו שם עמך AND LET THEM PLACE THEMSELVES THERE WITH THEE, in order that the Israelites may see it and do them high esteem and honour, saying, “Beloved indeed must these be since they may enter together with Moses to hear Divine utterance from the mouth of the Holy One, blessed be He!” (Sifrei Bamidbar 92)."}, {"ch": 11, "v": 17, "aliyah": 6, "heb": "וְיָרַדְתִּ֗י וְדִבַּרְתִּ֣י עִמְּךָ֮ שָׁם֒ וְאָצַלְתִּ֗י מִן־הָר֛וּחַ אֲשֶׁ֥ר עָלֶ֖יךָ וְשַׂמְתִּ֣י עֲלֵיהֶ֑ם וְנָשְׂא֤וּ אִתְּךָ֙ בְּמַשָּׂ֣א הָעָ֔ם וְלֹא־תִשָּׂ֥א אַתָּ֖ה לְבַדֶּֽךָ׃", "onk": "<b>וְאֶתְגְּלֵי<\/b> וֶאֱמַלֵּל עִמָּךְ תַּמָּן וַאֲרַבֵּי מִן רוּחָא דַּעֲלָךְ וֶאֱשַׁוֵּי עֲלֵיהוֹן וִיסוֹבְרוּן עִמָּךְ בְּמַטּוּל עַמָּא וְלָא תְסוֹבַר אַתְּ בִּלְחוֹדָךְ:", "onk_en": "I will descend [<b>appear<\/b>] and speak there with you, and I will make greater the spirit which is upon you, and place it on them, and they will bear, along with you, the burden of the people so that you need not bear it alone.", "pj": "וְאִתְגְלִי בְּאִיקַר שְׁכִינְתִּי וַאֲמַלֵל עִמָךְ תַּמָן וַאֲרַבֵּי מִן רוּחַ נְבוּאָה דְעַלָךְ וְאֶשַׁוֵי עֲלֵיהוֹן וְיִטְעִינוּן עִמָךְ בְּטוּרְחָא דְעַמָא וְלָא תִטְעוֹן אַנְתְּ בִּלְחוֹדָךְ", "pj_en": "And I will be revealed in the glory of My Shekinah, and will speak with thee there, and will amplify the spirit of prophecy that is upon thee, and bestow it upon them; and they shall sustain with thee the burden of the people, that thou mayest not bear it alone.", "tj": "", "tj_en": "", "rashi": "<b>וירדתי.<\/b> זוֹ אַחַת מֵעֶשֶׂר יְרִידוֹת הַכְּתוּבוֹת בַּתּוֹרָה (שם):<br><br><b>ודברתי עמך.<\/b> וְלֹא עִמָּהֶם (שם):<br><br><b>ואצלתי.<\/b> כְּתַרְגּוּמוֹ \"וַאֲרַבֵּי\", כְּמוֹ \"וְאֶל אֲצִילֵי בְּנֵי יִשְֹרָאֵל\" (שמות כ\"ד):<br><br><b>ושמתי עליהם.<\/b> לְמָה מֹשֶׁה דוֹמֶה בְאוֹתָהּ שָׁעָה? לְנֵר שֶׁמּוּנַח עַל גַּבֵּי מְנוֹרָה וְהַכֹּל מַדְלִיקִין הֵימֶנּוּ וְאֵין אוֹרוֹ חָסֵר כְּלוּם (ספרי):<br><br><b>ונשאו אתך.<\/b> הַתְנֵה עִמָּהֶם עַל מְנָת שֶׁיְּקַבְּלוּ עֲלֵיהֶם טֹרַח בָּנַי, שֶׁהֵם טַרְחָנִים וְסַרְבָנִים (שם):<br><br><b>ולא תשא אתה לבדך.<\/b> הֲרֵי תְשׁוּבָה לְמַה שֶּׁאָמַרְתָּ לֹא אוּכַל אָנֹכִי לְבַדִּי:", "rashi_en": "וירדתי AND I WILL COME DOWN [AND SPEAK WITH THEE THERE] This is one of the ten instances of the use of the term “coming down” written in the Torah to describe a Divine manifestation on earth (Sifrei Bamidbar 93).<br><br>ודברתי עמך AND I WILL SPEAK WITH THEE but not with them (Sifrei Bamidbar 93). <br><br>ואצלתי — Understand this as the Targum does: AND I SHALL MAKE GREAT. Similar is (Exodus 24:11) “And upon the great men of (אצילי) the children of Israel [He laid not his hands]”.<br><br>ושמתי עליהם AND I WILL PUT IT UPON THEM — What was Moses like to at that moment? He was like to a light that is placed in a candlestick at which everybody lights his lamps and yet its illuminating power is not the least diminished (Sifrei Bamidbar 93).<br><br>ונשאו אתך AND THEY SHALL BEAR [THE BURDEN OF THE PEOPLE] WITH THEE — stipulate with them that they shall join you on the understanding that they take upon themselves the burden of my children — because they are troublesome people and refractory (Sifrei Bamidbar 92).<br><br>ולא תשא אתה לבדך THAT THOU BEAR IT NOT THYSELF ALONE — Here you have the answer to what you have said, (Numbers 11:14) “I am not able [to bear all this people] alone” (cf. Sifrei Bamidbar 93; Rashi on Numbers 11:16). "}, {"ch": 11, "v": 18, "aliyah": 6, "heb": "וְאֶל־הָעָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְמָחָר֮ וַאֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּאׇזְנֵ֨י יְהֹוָ֜ה לֵאמֹ֗ר מִ֤י יַאֲכִלֵ֙נוּ֙ בָּשָׂ֔ר כִּי־ט֥וֹב לָ֖נוּ בְּמִצְרָ֑יִם וְנָתַ֨ן יְהֹוָ֥ה לָכֶ֛ם בָּשָׂ֖ר וַאֲכַלְתֶּֽם׃", "onk": "וּלְעַמָּא תֵימַר אִזְדַּמְּנוּ לִמְחַר וְתֵיכְלוּן בִּסְרָא אֲרֵי בְּכֵיתוּן <b>קֳדָם<\/b> יְיָ לְמֵימַר מָן יֵכְלִנָּנָא בִּסְרָא אֲרֵי טַב לָנָא בְּמִצְרָיִם וְיִתֵּן יְיָ לְכוֹן בִּסְרָא וְתֵיכְלוּן:", "onk_en": "You shall say to the people, prepare yourselves for the morrow and you shall eat meat, for you have cried in the ears of [<b>before<\/b>] Adonoy, saying: “Who will feed us meat; we had it good in Egypt;” [now] Adonoy gives you meat and you shall eat.", "pj": "וּלְוַת עַמָא תֵּימַר אִזְדַמְנוּ לִמְחַר וְתֵיכְלוּן בִּשְרָא אֲרוּם בְּכִיתוּן קֳדָם יְיָ לְמֵימַר מַן יַסְפִינָנָא בִּישְרָא אֲרוּם טַב לָנָא בְּמִצְרַיִם וְיִתֵּן יְיָ לְכוֹן בִּישְרָא וְתֵיכְלוּן", "pj_en": "And say thou to the people, Make ready against the morrow that you may eat flesh; because you have lamented before the Lord, saying, Who will give us flesh to eat? for it was better with us in Mizraim. The Lord therefore will give you flesh that you may eat.", "tj": "", "tj_en": "", "rashi": "<b>התקדשו.<\/b> הַזְמִינוּ עַצְמְכֶם לְפֻרְעָנוּת, וְכֵן הוּא אוֹמֵר (ירמיהו י\"ב) \"וְהַקְדִּשֵׁם לְיוֹם הֲרֵגָה\" (ספרי):", "rashi_en": "התקדשו means, prepare yourselves to receive punishment. Similarly it states, (Jeremiah 12:3) “and prepare them (והקדשם) for the day of slaughter” (Sifrei Bamidbar 94; cf. Rashi on Exodus 19:10)."}, {"ch": 11, "v": 19, "aliyah": 6, "heb": "לֹ֣א י֥וֹם אֶחָ֛ד תֹּאכְל֖וּן וְלֹ֣א יוֹמָ֑יִם וְלֹ֣א&thinsp;<b>׀<\/b> חֲמִשָּׁ֣ה יָמִ֗ים וְלֹא֙ עֲשָׂרָ֣ה יָמִ֔ים וְלֹ֖א עֶשְׂרִ֥ים יֽוֹם׃", "onk": "לָא יוֹמָא חַד תֵּיכְלוּן וְלָא תְרֵין יוֹמִין וְלָא חַמְשָׁא יוֹמִין וְלָא עַשְׂרָא יוֹמִין וְלָא עַשְׂרִין יוֹמִין:", "onk_en": "Not for one day will you be eating and not for two days; not for five days, not for ten days, and not for twenty days.", "pj": "לָא יוֹמָא חָד תֵּיכְלוּן וְלָא תְּרֵין יוֹמִין וְלָא חַמְשָׁא יוֹמִין וְלָא עַשְרָא יוֹמִין וְלָא עַשְרִין יוֹמִין", "pj_en": "You shall not eat it one day, nor two days, nor five, nor ten, nor twenty days;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 20, "aliyah": 6, "heb": "עַ֣ד&thinsp;<b>׀<\/b> חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר־יֵצֵא֙ מֵֽאַפְּכֶ֔ם וְהָיָ֥ה לָכֶ֖ם לְזָרָ֑א יַ֗עַן כִּֽי־מְאַסְתֶּ֤ם אֶת־יְהֹוָה֙ אֲשֶׁ֣ר בְּקִרְבְּכֶ֔ם וַתִּבְכּ֤וּ לְפָנָיו֙ לֵאמֹ֔ר לָ֥מָּה זֶּ֖ה יָצָ֥אנוּ מִמִּצְרָֽיִם׃", "onk": "עַד יְרַח יוֹמִין עַד דִּי <b>תְקוֹצוּן<\/b> בֵּיהּ וִיהֵי לְכוֹן לְתַקְלָא חֲלַף דְּקַצְתּוּן יָת <b>מֵימְרָא<\/b> דַיְיָ <b>דִּשְׁכִנְתֵּיהּ שַׁרְיַת<\/b> בֵּינֵיכוֹן וּבְכֵיתוּן קֳדָמוֹהִי לְמֵימַר לְמָא דְנַן נְפַקְנָא מִמִּצְרָיִם:", "onk_en": "But rather for a month of days, until it comes out of your nostrils [<b>will disgust you<\/b>] and it will be repulsive to you; [this is] because you have rejected [<b>the word of<\/b>] Adonoy Who[<b>’s Shechinah dwells<\/b>] is among you, and you have cried before Him, saying: “Why have we come out from Egypt?”", "pj": "עַד יֶרַח יוֹמִין עַד דְתִפּוֹק סַרְיוּתָא מִנְחִירֵיכוֹן וְתֶהֱוֵי לְכוֹן לְרִיחוּק חוֹלַף דְקַצְתּוּן בְּמֵימְרָא דַיְיָ דְאִיקַר שְׁכִינְתֵּיהּ שַׁרְיָא בֵּינֵיכוֹן וּבְכִיתוּן קֳדָמוֹי לְמֵימָר לְמָא דְנַן נַפְקָנָא מִמִצְרָיִם", "pj_en": "for a month of days, until the smell of it cometh forth from your nostrils, and it become a loathing to you; because you have been contemptuous against the Word of the Lord, whose glorious Shekinah dwelleth among you, and because you have wept before Him, saying, Why should we have come out from Mizraim?", "tj": "", "tj_en": "", "rashi": "<b>עד חדש ימים.<\/b> זוֹ בַכְּשֵׁרִים, שֶׁמִּתְמַצִּין עַל מִטּוֹתֵיהֶן וְאַחַר כָּךְ נִשְׁמָתָן יוֹצְאָה, וּבָרְשָׁעִים הוּא אוֹמֵר \"הַבָּשָׂר עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם\" (פסוק ל\"ג), כָּךְ הִיא שְׁנוּיָה בְסִפְרֵי, אֲבָל בִּמְכִילְתָּא שְׁנוּיָה חִלּוּף, הָרְשָׁעִים אוֹכְלִים וּמִצְטַעֲרִין שְׁלֹשִׁים יוֹם, וְהַכְּשֵׁרִים הַבָּשָׂר עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם (עי' יומא ע\"ה):<br><br><b>עד אשר יצא מאפכם.<\/b> כְּתַרְגּוּמוֹ \"דִי תְקוֹצוּן בֵּיהּ\", יְהֵא דוֹמֶה לָכֶם כְּאִלּוּ אֲכַלְתֶּם מִמֶּנּוּ יוֹתֵר מִדַּאי עַד שֶׁיּוֹצֵא וְנִגְעָל לַחוּץ דֶּרֶךְ הָאָף:<br><br><b>והיה לכם לזרא.<\/b> שֶׁתִּהְיוּ מְרַחֲקִין אוֹתוֹ יוֹתֵר מִמַּה שֶּׁקֵּרַבְתֶּם, וּבְדִבְרֵי רַבִּי מֹשֶׁה הַדַּרְשָׁן רָאִיתִי שֶׁיֵּשׁ לָשׁוֹן שֶׁקּוֹרִין לַחֶרֶב זָרָא:<br><br><b>את ה' אשר בקרבכם.<\/b> אִם לֹא שֶׁנָּטַעְתִּי שְׁכִינָתִי בֵינֵיכֶם, לֹא גָבַהּ לְבַבְכֶם לִכָּנֵס לְכָל הַדְּבָרִים הַלָּלוּ (ספרי):", "rashi_en": "עד חדש ימים BUT EVEN A WHOLE MONTH [SHALL YE EAT] — This was said in reference to the comparatively virtuous, who languish on their beds and only afterwards their soul departs from them; in reference to the wicked, however, it states, (v. 33) “and while the flesh was yet between their teeth [the wrath of the Lord glowed against the people]”. Thus is it taught in the Sifrei Bamidbar 94. But in the Mechilta d'Rabbi Yishmael 16:13:1 (on Exodus 16:13) just the opposite is taught: the wicked ate the flesh and were in agony thirty days, while as for the comparatively virtuous, “the flesh was yet between their teeth, etc.” (they suffered no prolonged agony, but died immediately).<br><br>עד אשר יצא מאפכם UNTIL IT COME OUT AT YOUR NOSTRILS — Understand this as the Targum does: until that you feel a loathing for it; i.e. it will seem to you that you have eaten more than enough of it, so that it will come out and be ejected by way of the nose.<br><br>והיה לכם לזרא AND BECOME SOMETHING STRANGE UNTO YOU — This means, that you will cast it away from you even more readily than you previously welcomed it (Sifrei Bamidbar 94). But in the work of Rabbi Moses the Preacher, I have seen it stated that there exists a language in which they call a sword \"זרא\". <br><br>את ה’ אשר בקרבכם [BECAUSE THAT YE HAVE SCORNED] THE LORD WHO IS AMONG YOU — The latter words appear superfluous, but they are taken to suggest: Unless I had planted my Shechinah among you your heart would not have become so arrogant as to engage in all these matters (Sifrei Bamidbar 94)."}, {"ch": 11, "v": 21, "aliyah": 6, "heb": "וַיֹּ֘אמֶר֮ מֹשֶׁה֒ שֵׁשׁ־מֵא֥וֹת אֶ֙לֶף֙ רַגְלִ֔י הָעָ֕ם אֲשֶׁ֥ר אָנֹכִ֖י בְּקִרְבּ֑וֹ וְאַתָּ֣ה אָמַ֗רְתָּ בָּשָׂר֙ אֶתֵּ֣ן לָהֶ֔ם וְאָכְל֖וּ חֹ֥דֶשׁ יָמִֽים׃", "onk": "וַאֲמַר משֶׁה שִׁית מְאָה אַלְפִין גַּבְרָא רִגְלָאָה עַמָּא דִּי אֲנָא בֵינֵיהוֹן וְאַתְּ אֲמַרְתְּ בִּסְרָא אֶתֵּן לְהוֹן וְיֵיכְלוּן יְרַח יוֹמִין:", "onk_en": "Moshe said: “The people are six hundred thousand on foot that I am among and You say that I will give them meat, to eat it for a month of days?", "pj": "וַאֲמַר משֶׁה שִׁית מְאָה אַלְפִין גַבְרִין רִגְלְיַין עַמָא דַאֲנָא שָׁרֵי בֵּינֵיהוֹן וְאַנְתְּ אַמְרַתְּ בִּישְרָא אֶתֵּן לְהוֹן וְיֵיכְלוּן יֶרַח יוֹמִין", "pj_en": "But Mosheh said, Six hundred thousand footmen are the people among whom I dwell, and Thou hast said, I will give them flesh to eat for a month of days!", "tj": "", "tj_en": "", "rashi": "<b>שש מאות אלף רגלי.<\/b> לֹא חָשׁ לִמְנוֹת אֶת הַפְּרָט שְׁלֹשֶׁת אֲלָפִים הַיְתֵרִים; וְרַבִּי מֹשֶׁה הַדַּרְשָׁן פֵּרֵשׁ, שֶׁלֹּא בָכוּ אֶלָּא אוֹתָן שֶׁיָּצְאוּ מִמִּצְרַיִם:", "rashi_en": "שש מאות אלף רגלי [THE PEOPLE AMONGST WHOM I AM ARE] SIX HUNDRED THOUSAND FOOTMEN — He was not particular to mention also the odd number — the remaining three thousand. But Rabbi Moses the Preacher explained that the number 600,000 is exact because only those who went forth from Egypt wept (since only they could have said, (v. 5) “We remember the fish which we did eat in Egypt”, and they who left Egypt are described, as here, by the term רגלי added to the number 600,000; cf. Exodus 12:37)."}, {"ch": 11, "v": 22, "aliyah": 6, "heb": "הֲצֹ֧אן וּבָקָ֛ר יִשָּׁחֵ֥ט לָהֶ֖ם וּמָצָ֣א לָהֶ֑ם אִ֣ם אֶֽת־כׇּל־דְּגֵ֥י הַיָּ֛ם יֵאָסֵ֥ף לָהֶ֖ם וּמָצָ֥א לָהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "הֲעָן וְתוֹרִין יִתְנַכְּסוּן לְהוֹן הַיְסַפְּקוּן לְהוֹן אִם יָת כָּל נוּנֵי יַמָּא יִתְכַּנְּשׁוּן לְהוֹן הַיְסַפְּקוּן לְהוֹן:", "onk_en": "Will sheep and cattle be slaughtered for them would that be sufficient for them? If all the fish of the sea would be gathered for them, would that be sufficient for them?”", "pj": "הַעֲנָא דִבְעֲרָב וְתוֹרֵי דִבְנָבָט יִתְנַכְסוּן לְהוֹן וִיסַפְּקוּן לְהוֹן אִין יַת כָּל נוּנֵי דְיַמָא רַבָּא יִתְכַּנְשׁוּן לְהוֹן וִיסַפְּקוּן לְהוֹן", "pj_en": "Shall the flocks of Araby or the cattle of Nabatea be killed for them to satisfy them, or all the fishes of the Great Sea be collected, that they may have enough?", "tj": "", "tj_en": "", "rashi": "<b>הצאן ובקר ישחט.<\/b> זֶה אֶחָד מֵאַרְבָּעָה דְּבָרִים שֶׁהָיָה רַבִּי עֲקִיבָא דּוֹרֵשׁ וְאֵין רַבִּי שִׁמְעוֹן דּוֹרֵשׁ כְּמוֹתוֹ, רַבִּי עֲקִיבָא אוֹמֵר <b>שש מאות אלף רגלי ואתה אמרת בשר אתן להם ואכלו חדש ימים הצאן ובקר<\/b>, הַכֹּל כְּמַשְׁמָעוֹ, מִי מַסְפִּיק לָהֶם? כָּעִנְיָן שֶׁנֶּאֱמַר (ויקרא כ\"ה) \"וּמָצָא כְּדֵי גְאֻלָּתוֹ\". וְאֵיזוֹ קָשָׁה, זוֹ אוֹ שִׁמְעוּ נָא הַמֹּרִים? אֶלָּא לְפִי שֶׁלֹּא אָמַר בָּרַבִּים, חִסֵּךְ לוֹ הַכָּתוּב וְלֹא נִפְרַע מִמֶּנּוּ, וְזוֹ שֶׁל מְרִיבָה הָיְתָה בְּגָלוּי, לְפִיכָךְ לֹא חִסֵּךְ לוֹ הַכָּתוּב; רַבִּי שִׁמְעוֹן אוֹמֵר, חַס וְשָׁלוֹם, לֹא עָלְתָה עַל דַּעְתּוֹ שֶׁל אוֹתוֹ צַדִיק כָּךְ, מִי שֶׁכָּתוּב בּוֹ \"בְּכָל בֵּיתִי נֶאֱמָן הוּא\" (במדבר י\"ב) יֹאמַר אֵין הַמָּקוֹם מַסְפִּיק לָנוּ? אֶלָּא כָּךְ אָמַר, <b>שש מאות אלף רגלי וגו' ואתה אמרת בשר אתן<\/b> לְחֹדֶשׁ יָמִים, וְאַחַר כָּךְ תַּהֲרֹג אֻמָּה גְדוֹלָה כָּזוֹ, <b>הצאן ובקר ישחט להם<\/b> כְּדֵי שֶׁיֵּהָרְגוּ וּתְהִי אֲכִילָה זוֹ מַסְפַּקְתָּן עַד עוֹלָם? וְכִי שִׁבְחֲךָ הוּא זֶה? אוֹמְרִים לוֹ לַחֲמוֹר טֹל כֹּר שְׂעוֹרִים וְנַחְתֹּךְ רֹאשְׁךָ? הֱשִׁיבוֹ הַקָּבָּ\"ה, וְאִם לֹא אֶתֵּן יֹאמְרוּ שֶׁקָּצְרָה יָדִי, הֲטוֹב בְּעֵינֶיךָ שֶׁיַּד ה' תִּקְצַר בְּעֵינֵיהֶם? יֹאבְדוּ הֵם וּמֵאָה כַּיּוֹצֵא בָהֶם וְאַל תְּהִי יָדִי קְצָרָה לִפְנֵיהֶם אֲפִלּוּ שָׁעָה אַחַת:", "rashi_en": "הצאן והבקר ישחט SHALL THE FLOCKS AND HERDS BE SLAUGHTERED [FOR THEM TO SUFFICE THEM?] — This is one of those four things (Biblical passages) which R. Akiba interpreted in a certain way but R. Simeon did not interpret them similarly. Rabbi Akiba says: שש מאות אלף רגלי ... ואתה אמרת בשר אתן להם ואכלו חדש ימים הצאן ובקר — all this is to be taken literally and the words ומצא להם should be rendered by “would it suffice for them?”, in the same sense as we find this word used in (Leviticus 25:26) “and he have sufficient (ומצא כדי) for redeeming it\" (ומצא להם is taken as the equivalent of ומצא כדי להם). Now — R. Akiba continued — which case was worse? This or that when Moses exclaimed, (Numbers 20:10) Hear now, ye rebels!?” Obviously this case here was worse, only because he did not utter his doubt in public, Scripture (God) showed some regard for him and did not punish him, whilst that sin at Meriba took place in public, therefore Scripture does not show any regard for him. Rabbi Simeon, however, says: “God forbid!” — “Such an idea never entered the mind of that righteous man! He of whom Scripture writes, (Numbers 12:7) ‘He is faithful in all my house’ — would he have said, ‘The Omnipresent cannot supply sufficient for us!’ But what he said was this: ‘[the people, amongst whom I am, are] six hundred thousand footmen; and Thou hast said, I will give them flesh, for a whole month — and then You want to kill a nation so great as this is?! Shall the flocks and the herds be slaughtered for them that they (the people) should immediately be killed, and this eating should be their last (lit., should satisfy them for ever: ומצא להם)?! Is this Your praise? Do people say to an ass, take (eat) this Kor of barley and then we will cut off thy head!’? The Holy One, blessed be He, thereupon said to him, ‘But if I do not give them flesh, they will say that My hand has waxed short; would it be pleasing to you that the hand of the Lord should appear in their eyes to have waxed short? — Let them and a hundred like them perish but let not My hand appear to them to have waxed short even for a single moment’!” (Tosefta Sotah 6:4)"}, {"ch": 11, "v": 23, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה הֲיַ֥ד יְהֹוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲיִקְרְךָ֥ דְבָרִ֖י אִם־לֹֽא׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה <b>הֲמֵימְרָא<\/b> דַיְיָ <b>יִתְעַכָּב<\/b> כְּעַן תֶּחֱזֵי הַיְעַרְעִנָּךְ פִּתְגָּמִי אִם לָא:", "onk_en": "Adonoy said to Moshe: “Has [<b>can<\/b>] the Hand [<b>word<\/b>] of Adonoy become short [<b>be restrained<\/b>]? Now you will see if My words will occur unto you or not.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה הַאֶפְשַׁר דְאִית קֳדָם יְיָ מַחְסוֹר כְּדוֹן תֶּחֱמֵי הַיְאַרְעִינָךְ פִּתְגָמִי אִין לָא", "pj_en": "And the Lord said to Mosheh, Can any thing fail before the Lord? Now shalt thou see whether what I have said to thee shall come to pass or not.", "tj": "", "tj_en": "", "rashi": "<b>עתה תראה היקרך דברי.<\/b> רַבָּן גַּמְלִיאֵל בְּנוֹ שֶׁל רַבִּי יְהוּדָה הַנָּשִׂיא אוֹמֵר, אִי אֶפְשָׁר לַעֲמֹד עַל הַטָּפֵל, מֵאַחַר שֶׁאֵינָן מְבַקְשִׁים אֶלָּא עֲלִילָה, לֹא תַסְפִּיק לָהֶם, סוֹפָן לָדוּן אַחֲרֶיךָ: אִם אַתָּה נוֹתֵן לָהֶם בְּשַׂר בְּהֵמָה גַסָּה, יֹאמְרוּ דַּקָּה בִקַּשְׁנוּ, וְאִם אַתָּה נוֹתֵן לָהֶם דַּקָּה, יֹאמְרוּ גַּסָּה בִקַּשְׁנוּ, חַיָּה וָעוֹף בִּקַּשְׁנוּ, דָּגִים וַחֲגָבִים בִּקַּשְׁנוּ, אָמַר לוֹ, אִם כֵּן יֹאמְרוּ שֶׁקָּצְרָה יָדִי, אָמַר לְפָנָיו, הֲרֵינִי הוֹלֵךְ וּמְפַיְּסָן, אָמַר לוֹ <b>עתה תראה היקרך דברי<\/b> — שֶׁלֹּא יִשְׁמְעוּ לְךָ. הָלַךְ מֹשֶׁה לְפַיְּסָן, אָמַר לָהֶם <b>היד ה' תקצר<\/b>, \"הֵן הִכָּה צוּר וַיָּזוּבוּ מַיִם וְגוֹ' הֲגַם לֶחֶם יוּכַל תֵּת\" (תהלים ע\"ח), אָמְרוּ, פְּשָׁרָה הִיא זוֹ, אֵין בּוֹ כֹּחַ לְמַלֹּאות שְׁאֵלָתֵנוּ; וְזֶהוּ שֶׁנֶּאֱמַר <b>ויצא משה וידבר אל העם<\/b>, כֵּיוָן שֶׁלֹּא שָׁמְעוּ לוֹ, <b>ויאסף שבעים איש וגו'<\/b> (עי' ספרי):", "rashi_en": "עתה תראה היקרך דברי THOU SHALT SEE NOW WHETHER MY WORD SHALL COME TO PASS UNTO THEE [OR NOT]. — R. Gamliel, the son of R. Judah ha-Nasi said, “The dialogue took the following course: Moses said, “One can never understand a babbler! (One can never fathom his meaning.) Since they are merely seeking a pretext You will never satisfy them (the meaning of the text is: If all the cattle in the world were slaughtered for them, ומצא להם, would this suffice them, i. e., would they be satisfied with that?), in the end they will always argue against You. If You give them flesh of large cattle (oxen) they will say ‘We wanted that of small cattle (sheep)’; if You will give them flesh of sheep, they will say We wanted that of oxen’, or, ‘we wanted wild beasts (venison) and fowls’, ‘we wanted fish and locusts!’ Thereupon He said to him, ‘If that be so and I give them nothing at all, they will say that My hand has waxed short!’ “Moses thereupon said, “I will go and appease them”. He answered him: “Thou shalt see now whether My word shall come to pass unto thee — for they will not listen to thee”. Moses went to appease them and said to them, “Is the hand of the Lord waxed short? Behold, he continued with the words used later by the Psalmist, (Psalms 78:20): “He smote the rock that the waters gushed out, etc. Surely then he can give bread also [and can provide flesh for His people!]”. But they (the Israelites) said: “This what you have said is only a compromise (a way of satisfying us). He has really no power to grant our request!” This is what Scripture means by: “and Moses went out and spake to the people [the words of the Lord]” (i.e. he told them the words used by the Lord only with a different implication). Since, however, they would not listen to him, he gathered the seventy men of the elders [of the people] etc.” (cf. Sifrei Bamidbar 95:1; Tosefta Sota 6:4)."}, {"ch": 11, "v": 24, "aliyah": 6, "heb": "וַיֵּצֵ֣א מֹשֶׁ֔ה וַיְדַבֵּר֙ אֶל־הָעָ֔ם אֵ֖ת דִּבְרֵ֣י יְהֹוָ֑ה וַיֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִזִּקְנֵ֣י הָעָ֔ם וַֽיַּעֲמֵ֥ד אֹתָ֖ם סְבִיבֹ֥ת הָאֹֽהֶל׃", "onk": "וּנְפַק משֶׁה וּמַלִּיל לְעַמָּא יָת פִּתְגָּמַיָּא דַיְיָ וּכְנֵשׁ שַׁבְעִין גַּבְרָא מִסָּבֵי עַמָּא וַאֲקֵם יָתְהוֹן סְחוֹר סְחוֹר לְמַשְׁכְּנָא:", "onk_en": "Moshe went out and spoke the words of Adonoy to the people, and he gathered seventy men from the elders of the people and he had them stand around the Tent.", "pj": "וּנְפַק משֶׁה מִמַשְׁכַּן בֵּית שְׁכִינְתָּא וּמַלֵיל עִם עַמָא יַת פִּתְגָמַיָא דַיְיָ וּכְנַשׁ שׁוּבְעִין גוּבְרִין מִסָבֵי יִשְרָאֵל וְאָקִים יַתְהוֹן חֲזוֹר חֲזוֹר לְמַשְׁכְּנָא", "pj_en": "Then Mosheh went forth from the tabernacle, the house of the Shekinah, and told the people the words of the Lord. And he called together the seventy men, the elders of Israel, and placed them around the tabernacle.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 25, "aliyah": 6, "heb": "וַיֵּ֨רֶד יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;בֶּעָנָן֮ וַיְדַבֵּ֣ר אֵלָיו֒ וַיָּ֗אצֶל מִן־הָר֙וּחַ֙ אֲשֶׁ֣ר עָלָ֔יו וַיִּתֵּ֕ן עַל־שִׁבְעִ֥ים אִ֖ישׁ הַזְּקֵנִ֑ים וַיְהִ֗י כְּנ֤וֹחַ עֲלֵיהֶם֙ הָר֔וּחַ וַיִּֽתְנַבְּא֖וּ וְלֹ֥א יָסָֽפוּ׃", "onk": "<b>וְאִתְגְּלִי<\/b> יְיָ בַּעֲנָנָא וּמַלִּיל עִמֵּיהּ וְרַבִּי מִן רוּחָא דִּי עֲלוֹהִי וִיהַב עַל שַׁבְעִין גַּבְרָא סָבַיָּא וַהֲוָה כַּד שְׁרַת עֲלֵיהוֹן רוּחָא <b>דִנְבוּאָה<\/b> וּמִתְנַבְּאִין וְלָא פַסְקִין:", "onk_en": "Adonoy descended [<b>appeared<\/b>] in a cloud and spoke to him, and He magnified the spirit which was upon him and He gave it unto the seventy men, [who were] the elders. When the spirit [<b>of prophecy<\/b>] came to rest upon them they prophesied, and they did not cease.", "pj": "וְאִתְגְלֵי יְיָ בַּעֲנַן אִיקַר שְׁכִינְתָּא וּמַלֵיל עִמֵיהּ וְרַבֵּי מִן נְבוּאָה דַעֲלוֹי וּמשֶׁה לָא חָסַר מִדַעַם וִיהַב עַל שׁוּבְעִין גוּבְרִין סָבַיָא וַהֲוָה כַּד שְׁרַת עֲלֵיהוֹן רוּחַ נְבוּאָה וּמִתְנַבָּן וְלָא פָּסְקִין", "pj_en": "And the Lord was revealed in the glorious Cloud of the Shekinah, and spake with him. And He made enlargement of the (Spirit of) prophecy that was upon him, so that Mosheh lost nothing thereof, but He gave unto the seventy men, the elders: and it was that when the Spirit of prophecy rested upon them, they prophesied, and ceased not.", "tj": "", "tj_en": "", "rashi": "<b>ולא יספו.<\/b> לֹא נִתְנַבְּאוּ אֶלָּא אוֹתוֹ הַיּוֹם לְבַדּוֹ, כָּךְ מְפֹרָשׁ בְּסִפְרֵי, וְאֻנְקְלוֹס תִּרְגֵּם \"וְלָא פָסְקִין\", שֶׁלֹּא פָסְקָה נְבוּאָה מֵהֶם:", "rashi_en": "ולא יספו [AND THEY PROPHESIED] BUT DID NOT CONTINUE (to prophesy) — i. e. they prophesied only that day alone. Thus is the phrase explained in Siphre. Onkelos, however, rendered renders it  ולא פסקין “and they did not cease”, meaning that the gift of prophecy never again departed from them (cf. Sanhedrin 17a and Rashi on Deuteronomy 5:19)."}, {"ch": 11, "v": 26, "aliyah": 6, "heb": "וַיִּשָּׁאֲר֣וּ שְׁנֵֽי־אֲנָשִׁ֣ים&thinsp;<small>׀<\/small>&thinsp;בַּֽמַּחֲנֶ֡ה שֵׁ֣ם הָאֶחָ֣ד&thinsp;<small>׀<\/small>&thinsp;אֶלְדָּ֡ד וְשֵׁם֩ הַשֵּׁנִ֨י מֵידָ֜ד וַתָּ֧נַח עֲלֵהֶ֣ם הָר֗וּחַ וְהֵ֙מָּה֙ בַּכְּתֻבִ֔ים וְלֹ֥א יָצְא֖וּ הָאֹ֑הֱלָה וַיִּֽתְנַבְּא֖וּ בַּֽמַּחֲנֶֽה׃", "onk": "וְאִשְׁתָּאָרוּ תְּרֵין גֻּבְרִין בְּמַשְׁרִיתָא שׁוּם חָד אֶלְדָּד וְשׁוּם תִּנְיָנָא מֵידָד וּשְׁרַת עֲלֵיהוֹן רוּחָא <b>דִנְבוּאָה<\/b> וְאִנּוּן בִּכְתִיבַיָּא וְלָא נְפָקוּ לְמַשְׁכְּנָא וְאִתְנַבִּיאוּ בְּמַשְׁרִיתָא:", "onk_en": "Two people remained in the camp; one’s name was Eldad and the second one’s name was Meidad. The spirit [<b>of prophecy<\/b>] rested upon them; they were among those inscribed, and they did not go out to the Tent, and they prophesied in the camp.", "pj": "וְאִשְׁתְּיָירוּ תְּרֵין גוּבְרִין בְּמַשְׁרִיתָא שְׁמֵיהּ דְחָד אֶלְדָד וּשְׁמֵיהּ דְתִנְיַין מֵידָד בְּנוֹי דְאֶלְצָפָן בַּר פַּרְנָךְ דִילֵידַת לֵיהּ יוֹכֶבֶד בְּרַת לֵוִי בִּזְמַן דְפַּטְרָהּ עַמְרָם גַבְרָהּ וְאִתְנְסִיבַת לֵיהּ עַד דְלָא יְלֵידַת יַת משֶׁה וּשְׁרַת עֲלֵיהוֹן רוּחַ נְבוּאָה אֶלְדָד הֲוָה מִתְנַבֵּי וַאֲמַר הָא משֶׁה מִתְכְּנִישׁ מִן עַלְמָא וִיהוֹשֻׁע בַּר נוּן מְשַׁמֵשׁ מַשְׁרִיתָא קָאִי מִן בַּתְרֵיהּ וּמְדַבֵּר עַמָא בֵּית יִשְרָאֵל וּמֵיעַל יַתְהוֹן לְאַרַע כְּנַעֲנָאֵי וּמַחֲסִין יָתָהּ לְהוֹן מֵידָד הֲוָה מִתְנַבֵּי וַאֲמַר הָא סִלְוֵי סַלְקִין מִן יַמָא וְחַפְיָין כָּל מַשְׁרִיתָא דְיִשְרָאֵל וְיֶהֱוֵי לְעַמָא לְתוּקְלָא בְּרַם תְּרֵיהוֹן כַּחֲדָא מִתְנַבִּין וְאָמְרִין הָא מַלְכָּא סְלִיק מִן אַרְעָא דְמָגוֹג בְּסוֹף יוֹמַיָא וּמַכְנַשׁ מַלְכִין קִטְרֵי תַגִין וְאַפַרְכִין לוֹבְשֵׁי שִרְיוֹנִין וְכָל עַמְמַיָא יִשְׁתַּמְעוּן לֵיהּ וּמְסַדְרִין קְרָבָא בְּאַרְעָא דְיִשְרָאֵל עַל בְּנֵי גַלְוָתָא בְּרַם קִירִיס אִיטִימוֹס לְהוֹן בְּשַׁעַת אֲנִיקִין וּמִקְטַל כֻּלְהוֹן בִּיקִידַת נִשְׁמָתָא בְּשַׁלְהוֹבִית אֵשָׁתָא דְנַפְקָא מִתְּחוֹת כּוּרְסֵי יְקָרָא וְנָפְלִין פִּגְרֵיהוֹן עַל טַוְורַיָא דְאַרְעָא דְיִשְרָאֵל וְיֵיתוּן כָּל חֵיוַת בָּרָא וְצִיפְרֵי שְׁמַיָא וְיֵיכְלוּן גוּשְׁמֵיהוֹן וּמִבָּתַר כְּדֵין יֵיחוֹן כָּל מֵתַיָא דְיִשְרָאֵל וְיִתְפַּנְקוּן מִן טַוְורָא דְאִצְטְנַע לְהוֹן מִן שֵׁירוּיָא וִיקַבְּלוּן אֲגַר עוֹבָדֵיהוֹן וְהִינוּן הֲווֹן מִן סָבַיָא דִסְלִיקוּ בִּפְטִיקַיָא כְּתוֹבַיָא וְלָא נַפְקָן לְמַשְׁכְּנָא דְאִיטַמָרוּ לְמֵעֲרוֹק מִן רַבָּנוּתָא וְאִתְנַבִּיאוּ בְּמַשְׁרִיתָא", "pj_en": "But two men had remained in the camp; the name of the one Eldad, and the name of the second Medad, the sons of Elizaphan bar Parnak, whom Jokebed the daughter of Levi bare to him when Amram her husband had put her away; and to whom she had been espoused before she gave birth to Mosheh. And the Spirit of prophecy resting upon them, Eldad prophe­sied, and said: Behold, Mosheh shall be gathered from the world; and Jehoshua bar Nun, the minister of the camps, will be established after him, and will lead the people of the house of Israel into the land of Kenaan, and make it their inheritance. Medad prophesied, and said: Behold, quails come up from the sea, and cover all the camp of Israel; but they will be to the people (a cause of) an offence. And both of them prophesied together, and said: Behold, a king will arise from the land of Magog, at the end of the days, and will assemble kings crowned with crowns, and captains wearing armour, and him will all nations obey. And they will set battle in array in the land of Israel against the children of the captivity; but already is it provided that in the hour of distresses all of them shall perish by the burning blast of the flame that cometh forth from beneath the Throne of Glory; and their carcases shall fall upon the mountains of the land of Israel, and the wild beasts of the field and the fowls of the sky shall come and consume their dead bodies. And afterward will all the dead of Israel live (again), and be feasted from the ox which hath been set apart for them from the beginning, and they shall receive the reward of their works. And they were of the elders who stood in the registers among them; but they had not gone forth to the tabernacle, but had hidden to escape from the dignity; yet they prophesied in the camp.", "tj": "וְאִשְׁתַּיְירוּ תְּרֵין גוּבְרִין בְּמַשְׁרִיתָא שְׁמֵיהּ דְחַד מִנְהוֹן אֶלְדָד וּשְׁמֵיהּ דְתִנְיָינָא מֵידָד וּשְׁרַת עֲלֵיהוֹן רוּחַ קוּדְשָׁא אֶלְדָד הֲוָה מִתְנַבֵּא וַאֲמַר הָא משֶׁה נְבִיָיא סַפְרֵיהוֹן דְיִשְרָאֵל מִתְכְּנַשׁ מִגוֹ עַלְמָא וִיהוֹשֻׁעַ בַּר נוּן תַּלְמִידוֹ מְשַׁמֵשׁ מַשְׁרִיתָא מִן בַּתְרֵיהּ וּמֵידָד מִתְנַבֵּא וַאֲמַר הָא סַלְוָון סְלֵק מִן יַמָא וַהֲוֵי תַקָלָא לִבְנֵי יִשְרָאֵל וְתַרְוֵיהוֹן הַוְיָין מִתְנַבְּיָין כַּחֲדָא וְאָמְרִין בְּסוֹף עֲקַב יוֹמַיָא גוֹג וּמָגוֹג וְחַיָילוּתֵיהּ סַלְקִין לִירוּשְׁלֵם וּבְיָדוֹי דְמַלְכָּא מְשִׁיחָא אִינוּן נָפְלִין וְשׁוּבַע שְׁנִין דְיוֹמִין יַדְלִיקוּ בְּנֵי יִשְרָאֵל מִן מָנֵי זְיָינֵיהוֹן לְחוּרְשָׁא לָא יִפְקוּן וְאִילָן לָא יְקוּצוּן וְאִינוּן הֲווֹ מִשַׁבְעִין חַכִּימַיָא וְלָא נְפָקוּ שַׁבְעִין חַכִּימַיָא מִן מַשְׁכְּנָא עַד אֶלְדָד וּמֵידָד מִתְנַבָּן בְּמַשְׁרִיתָא:", "tj_en": "And there remained two men in the camp: the name of one of them Eldad, the name of the second Medad, upon whom rested the Holy Spirit. Eldad prophesied, and said: Lo, Mosheh, the prophet, the scribe of Israel, will be gathered from the world, and Jehoshua bar Nun, his disciple, minister of the camps, will succeed. Medad prophesied, and said: Behold, quails come up from the sea; but they will be an offence to the children of Israel. Both of them prophesied together, and said: At the end, the end of the days, will Gog and Magog and his host come up against Jerusalem; but by the hand of the King Meshiha they will fall, and seven years of days will the children of Israel kindle their fire with their weapons of war, not going into the wilderness, nor cutting down the trees. And they were of the seventy sages, who went not from the tabernacle, while Eldad and Medad prophesied in the camp.", "rashi": "<b>וישארו שני אנשים.<\/b> מֵאוֹתָן שֶׁנִּבְחֲרוּ, אָמְרוּ אֵין אָנוּ כְּדַאי לִגְדֻלָּה זוֹ (עי' סנהדרין י\"ז):<br><br><b>והמה בכתבים.<\/b> בַּמְבֹרָרִים שֶׁבָּהֶם לְסַנְהֶדְרִין, וְנִכְתְּבוּ כֻלָּם נְקוּבִים בְּשֵׁמוֹת וְעַ\"יְ גּוֹרָל, לְפִי שֶׁהַחֶשְׁבּוֹן עוֹלֶה לְי\"ב שְׁבָטִים שִׁשָּׁה שִׁשָּׁה לְכָל שֵׁבֶט וָשֵׁבֶט, חוּץ מִשְּׁנֵי שְׁבָטִים שֶׁאֵין מַגִּיעַ אֲלֵיהֶם אֶלָּא חֲמִשָּׁה חֲמִשָּׁה, אָמַר מֹשֶׁה אֵין שֵׁבֶט שׁוֹמֵעַ לִי לִפְחוֹת מִשִּׁבְטוֹ זָקֵן אֶחָד, מֶה עָשָׂה, נָטַל ע\"ב פְתָקִין וְכָתַב עַל שִׁבְעִים \"זָקֵן\" וְעַל שְׁנַיִם חָלָק וּבֵרֵר מִכָּל שֵׁבֶט וָשֵׁבֶט שִׁשָּה, וְהָיוּ ע\"ב, אָמַר לָהֶם, טְלוּ פִתְקֵיכֶם מִתּוֹךְ קַלְפִּי, מִי שֶׁעָלָה בְיָדוֹ \"זָקֵן\" נִתְקַדֵּשׁ, מִי שֶׁעָלָה בְיָדוֹ חָלָק אָמַר לוֹ, הַמָּקוֹם לֹא חָפֵץ בָּךְ (ספרי; סנהדרין י\"ז):", "rashi_en": "וישארו שני אנשים BUT THERE REMAINED TWO MEN [IN THE CAMP] — i. e. two of them that had been selected. They remained, in the camp because they said, “We are not worthy of this distinction” (Sifrei Bamidbar 95:2).<br><br>והמה בכתובים [BUT THERE REMAINED TWO MEN IN THE CAMP] … AND THEY WERE AMONGST THEM THAT WERE WRITTEN — i.e. they were amongst those of them (of the people) who had been selected to constitute the Sanhedrion. For all these were written down, mentioned expressly by their names, but the requisite number was chosen by lot, because the calculation gives for twelve tribes, six elders for each tribe, with the exception of two tribes to each of which there would belong only five elders. Moses said, “No tribe will listen to me to have one elder less for his tribe!” What did he do? He took seventy-two tablets and wrote on seventy of them the word “Elder” and on two he left the surface blank. He then selected six men of each tribe so that there were altogether 72. He said to them, “Draw your tablets from the urn”. He in whose hand there came up a tablet bearing the inscription “Elder” was set apart as a member of the Sanhedrion, whilst to him in whose hand there came up a blank tablet, he said, “The Omnipresent does not require you” (Sifrei Bamidbar 95:2; Sanhedrin 17a)."}, {"ch": 11, "v": 27, "aliyah": 6, "heb": "וַיָּ֣רׇץ הַנַּ֔עַר וַיַּגֵּ֥ד לְמֹשֶׁ֖ה וַיֹּאמַ֑ר אֶלְדָּ֣ד וּמֵידָ֔ד מִֽתְנַבְּאִ֖ים בַּֽמַּחֲנֶֽה׃", "onk": "וּרְהַט עוּלֵמָא וְחַוִּי לְמשֶׁה וַאֲמַר אֶלְדָּד וּמֵידָד מִתְנַבְּאִין בְּמַשְׁרִיתָא:", "onk_en": "The youth ran and told Moshe, and said: “Eldad and Meidad are prophesying in the camp.”", "pj": "וּרְהַט טַלְיָא חַד וּתְנֵי לְמשֶׁה וַאֲמַר אֶלְדָד וּמֵידָד מִתְנַבְּיָין הָכֵין בְּמַשְׁרִיתָא", "pj_en": "And a certain young man ran, and told to Mosheh, and said: Eldad and Medad are prophesying thus in the camp.", "tj": "", "tj_en": "", "rashi": "<b>וירץ הנער.<\/b> יֵ\"א גֵּרְשׁוֹם בֶּן מֹשֶׁה הָיָה (עי' ילקוט):", "rashi_en": "וירץ הנער THERE RAN THE LAD — There are some who say that it was Gershom, the son of Moses (Midrash Tanchuma, Beha'alotcha 12)."}, {"ch": 11, "v": 28, "aliyah": 6, "heb": "וַיַּ֜עַן יְהוֹשֻׁ֣עַ בִּן־נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִבְּחֻרָ֖יו וַיֹּאמַ֑ר אֲדֹנִ֥י מֹשֶׁ֖ה כְּלָאֵֽם׃", "onk": "וַאֲתֵב יְהוֹשֻׁעַ בַּר נוּן מְשֻׁמְּשָׁנֵיהּ דְמשֶׁה מֵעוּלֵמוּתֵיהּ וַאֲמַר רִבּוֹנִי משֶׁה <b>אֲסָרִנּוּן<\/b>:", "onk_en": "Yehoshua the son of Nun answered, [he being] the attendant of Moshe, from his youth, and he said: “My master Moshe, destroy [<b>bind<\/b>] them!”", "pj": "וְאָתֵיב יְהוֹשֻׁעַ בַּר נוּן מְשׁוּמְשָׁנֵיהּ דְמשֶׁה וַאֲמַר רִבּוֹנִי משֶׁה בָּעֵי רַחֲמִין מִן קֳדָם יְיָ וּכְלִי מִנְהוֹן רוּחַ נְבוּאָתָא", "pj_en": "And Jehoshua bar Nun, the minister of Mosheh, answered and said: Ribboni Mosheh, pray for mercy before the Lord, that the Spirit of prophecy may be withheld from them.", "tj": "", "tj_en": "", "rashi": "<b>כלאם.<\/b> הַטֵּל עֲלֵיהֶם צָרְכֵי צִבּוּר וְהֵם כָּלִים מֵאֲלֵיהֶם; דָּ\"אַ, תְּנֵם אֶל בֵּית הַכֶּלֶא, לְפִי שֶׁהָיוּ מִתְנַבְּאִים מֹשֶׁה מֵת וִיהוֹשֻׁעַ מַכְנִיס אֶת יִשְׂרָאֵל לָאָרֶץ (עי' ספרי):", "rashi_en": "כלאם — (This is taken as the equivalent of כַּלֵּם, “destroy them”, “make an end of them”; cf. Rashi on Exodus 17:9) — He meant: cast upon them the responsibility for public affairs and they will of themselves soon come to an end (through the worry and anxiety this entails). — Another explanation is: that the word means put them into prison (כלא). He said this because they were prophesying, “Moses will die and Joshua will bring Israel into the Land” (cf. Sifrei Bamidbar 96; Sanhedrin 17a)."}, {"ch": 11, "v": 29, "aliyah": 6, "heb": "וַיֹּ֤אמֶר לוֹ֙ מֹשֶׁ֔ה הַֽמְקַנֵּ֥א אַתָּ֖ה לִ֑י וּמִ֨י יִתֵּ֜ן כׇּל־עַ֤ם יְהֹוָה֙ נְבִיאִ֔ים כִּי־יִתֵּ֧ן יְהֹוָ֛ה אֶת־רוּח֖וֹ עֲלֵיהֶֽם׃", "onk": "וַאֲמַר לֵיהּ משֶׁה הֲקִנְאָתִי אַתְּ מְקַנֵּי לִי רְעֵינָא פוֹן דִּיהוֹן כָּל עַמָּא דַיְיָ נְבִיאָין אֲרֵי יִתֵּן יְיָ יָת רוּחַ נְבוּאֲתֵיהּ עֲלֵיהוֹן:", "onk_en": "Moshe said to him, “Are you vengeful for me? Would (that) it be that all Adonoy’s people were prophets, that Adonoy would give His Spirit upon them.”", "pj": "וַאֲמַר לֵיהּ משֶׁה הֲמִן בִּגְלַל דְאִתְנַבּוּ עָלַי דַאֲנָא מִתְכְּנַשׁ מִן עַלְמָא וְאַנְתְּ מְשַׁמֵשׁ מִן בַּתְרַיי אַנְתְּ מְקַנֵי לִי רְעֵינָא פּוֹן דִיהוֹן כָּל עַמָא דַיְיָ נְבִייָן אֲרוּם יִתֵּן יְיָ יַת רוּחַ נְבִיאוּתֵיהּ עֲלֵיהוֹן", "pj_en": "But Mosheh said to him, Because they prophesy concerning me that I am to be gathered from the world, and that thou art to minister after me, art thou jealous for my sake? I would that all the Lord's people were prophets, and that He would bestow the Spirit of prophecy upon them.", "tj": "", "tj_en": "", "rashi": "<b>המקנא אתה לי.<\/b> הֲקִנְאָתִי אַתָּה מְקַנֵּא:<br><br><b>לי.<\/b> כְּמוֹ בִּשְׁבִילִי; כָּל לְשׁוֹן קִנְאָה אָדָם הַנּוֹתֵן לֵב עַל הַדָּבָר, אוֹ לִנְקֹם, אוֹ לַעֲזֹר, אנפר\"מנט בְּלַעַז, אוֹחֵז בְּעֹבִי הַמַּשָּׂא:", "rashi_en": "המקנא אתה לי means, “art thou envying where I should envy”.<br><br>לי — the word לי meaning the same as בשבילי, “for my sake”. Wherever an expression of the root קנא is used it implies that a person sets his heart on the matter, whether it be to take vengeance or to help; — emportement in O. F. (English = zeal) — he holds the thickest (heaviest) part of the load (i.e. he takes the responsibility for carrying out a matter)."}, {"ch": 11, "v": 30, "aliyah": 7, "heb": "וַיֵּאָסֵ֥ף מֹשֶׁ֖ה אֶל־הַֽמַּחֲנֶ֑ה ה֖וּא וְזִקְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְאִתְכְּנֵשׁ משֶׁה לְמַשְׁרִיתָא הוּא וְסָבֵי יִשְׂרָאֵל:", "onk_en": "Moshe entered into the camp, he and the elders of Israel.", "pj": "וְאִתְכְּנַשׁ משֶׁה לְמַשְׁרִיתָא הוּא וְכָל סָבֵי יִשְרָאֵל", "pj_en": "And Mosheh proceeded to the camp, he and all the elders of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ויאסף משה.<\/b> מִפֶּתַח אֹהֶל מוֹעֵד:<br><br><b>אל המחנה.<\/b> נִכְנְסוּ אִישׁ לְאָהֳלוֹ:<br><br><b>ויאסף.<\/b> לְשׁוֹן כְּנִיסָה אֶל הַבַּיִת, כְּמוֹ \"וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ\" (דברים כב, ב), וְאָב לְכֻלָּם \"יִצְבֹּר וְלֹא יֵדַע מִי אֹסְפָם\" (תהלים לט, ז), מְלַמֵּד שֶׁלֹא הֵבִיא עֲלֵיהֶם פֻּרְעָנוּת עַד שֶׁנִּכְנְסוּ הַצַּדִּיקִים אִישׁ לְאָהֳלוֹ (ספרי):", "rashi_en": "ויאסף משה AND MOSES [AND THE ELDERS OF ISRAEL] RETIRED from the entrance of the appointed tent. <br><br>אל המחנה INTO THE CAMP — i.e. they each went into his tent in the camp. ...<br><br>אסף — ויאסף is a term for “bringing into the house”, as, (Deuteronomy 22:2) “thou shalt bring it (ואספתו) into thine house”, The passage that proves that this is so in all cases (lit., the father of all) is, (Psalms 39:7) “he heapeth up riches, and knoweth not who shall gather them in (אוספם)” (from which it is evident that אסף must denote not “gathering together” for this is implied in יצבר, but bringing it into one’s house, taking possession of a thing). The fact that Scripture first relates that Moses and the elders entered their tents and afterwards that punishment fell upon the people teaches us that He (God) did not bring the punishment upon them before these righteous men had retired each into his tent (Sifrei Bamidbar 96)."}, {"ch": 11, "v": 31, "aliyah": 7, "heb": "וְר֜וּחַ נָסַ֣ע&thinsp;<b>׀<\/b> מֵאֵ֣ת יְהֹוָ֗ה וַיָּ֣גׇז שַׂלְוִים֮ מִן־הַיָּם֒ וַיִּטֹּ֨שׁ עַל־הַֽמַּחֲנֶ֜ה כְּדֶ֧רֶךְ י֣וֹם כֹּ֗ה וּכְדֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽמַּחֲנֶ֑ה וּכְאַמָּתַ֖יִם עַל־פְּנֵ֥י הָאָֽרֶץ׃", "onk": "וְרוּחָא נְטַל מִן <b>קֳדָם<\/b> יְיָ וְאַפְרַח שְׂלָיו מִן יַמָּא וּרְמָא עַל מַשְׁרִיתָא כְּמַהֲלַךְ יוֹמָא לְכָא וּכְמַהֲלַךְ יוֹמָא לְכָא סְחוֹר סְחוֹר לְמַשְׁרִיתָא וּכְרוּם תַּרְתֵּין אַמִּין עַל אַפֵּי אַרְעָא:", "onk_en": "From [<b>before<\/b>] Adonoy there gusted a wind and He caused quail to fly from the sea and spread them over the camp, about a day’s journey from this side and about a day’s journey from that side, around the camp, and about two <i>amo¯s<\/i> above the ground’s surface.", "pj": "וְרוּחָא דְעַלְעוּלָא נְפָקַת וּנְטָלַת בְּרוּגְזָא מִן קֳדָם יְיָ וּבְעָא לְמִשְׁטְפֵיהּ לְעַלְמָא אִילוּלֵי זְכוּתָא דְמשֶׁה וְאַהֲרן וּנְתֵיב בְּיַמָא רַבָּא וְאַפְרַח שַלְוֵי מִן יַמָא רַבָּא וּשְׁרָא עַל דֵין דִזְעֵיר בְּמַשְׁרִיָתָא כְּמַהֲלַךְ יוֹמָא לְצִיפּוּנָא וּכְמַהֲלַךְ יוֹמָא לְדָרוֹמָא וּכְרוּם תַּרְתֵּין אַמִין הֲוָה פָּרַח עַל אַנְפֵּי אַרְעָא וַהֲווֹ מְהַלְכִין בְּהוֹן עַד פְּרַתְהוֹן מְטוּל דְלָא יִלְעוּן בִּזְמַן מְכַנְשְׁהוֹן יַתְהוֹן", "pj_en": "And the wind of a tempest went forth, and came violently from before the Lord, so as to have swept the world away, but for the righteousness of Mosheh and Aharon: and it blew over the Great Sea, and made the quails fly from the Great Sea, and settle wherever there was place in the camp, as a day's journey northward and southward, and at the height as of two cubits; they flew upon the face of the ground, and went upon their bellies, so that (the people) were not wearied while they collected them.", "tj": "", "tj_en": "", "rashi": "<b>ויגז.<\/b> וַיַּפְרִיחַ, וְכֵן \"כִּי גָז חִישׁ\" (תהילים צ'), וְכֵן \"נָגוֹזּוּ וְעָבָר\" (נחום א'):<br><br><b>ויטש.<\/b> וַיַּפְשֵׁט, כְּמוֹ \"וְהִנֵּה נְטֻשִׁים עַל פְּנֵי כָל הָאָרֶץ\" (שמואל א ל'), \"וּנְטַשְׁתִּיךָ הַמִּדְבָּרָה\" (יחזקאל כ\"ט):<br><br><b>וכאמתים.<\/b> פּוֹרְחוֹת בַּגֹּבַהּ, עַד שֶׁהֵן כְּנֶגֶד לִבּוֹ שֶׁל אָדָם, כְּדֵי שֶׁלֹּא יְהֵא טוֹרֵחַ בַּאֲסִיפָתָן לֹא לְהַגְבִּיהַּ וְלֹא לִשְׁחוֹת (ספרי):", "rashi_en": "ויגז means “and he caused to fly”; similar is, (Psalms 90:10) “for it flies away (גז)”; so, also, (Nahum 1:12) “they shall fly off (נגוזו) and it shall pass away”. <br><br>ויטש means “and he spread them abroad” (while flying), as (I Samuel 30:16) “and behold, they were spread abroad (נטושים) upon all the earth”; (Ezekiel 29:5) “and I have spread thee about (ונטשתיך) the wilderness”.<br><br>וכאמתים AND ABOUT TWO CUBITS [HIGH UPON THE FACE OF THE EARTH] — This means that they were flying at a height (of two cubits from the ground) so that they reached just up to a man’s breast, in order that there should be no trouble in gathering them, either to stretch upwards or to bend down to pick them up (Sifrei Bamidbar 97)."}, {"ch": 11, "v": 32, "aliyah": 7, "heb": "וַיָּ֣קׇם הָעָ֡ם כׇּל־הַיּוֹם֩ הַה֨וּא וְכׇל־הַלַּ֜יְלָה וְכֹ֣ל&thinsp;<b>׀<\/b> י֣וֹם הַֽמׇּחֳרָ֗ת וַיַּֽאַסְפוּ֙ אֶת־הַשְּׂלָ֔ו הַמַּמְעִ֕יט אָסַ֖ף עֲשָׂרָ֣ה חֳמָרִ֑ים וַיִּשְׁטְח֤וּ לָהֶם֙ שָׁט֔וֹחַ סְבִיב֖וֹת הַֽמַּחֲנֶֽה׃", "onk": "וְקָם עַמָּא כָּל יוֹמָא הַהוּא וְכָל לֵילְיָא וְכֹל יוֹמָא דְבַתְרוֹהִי וּכְנָשׁוּ יָת שְׂלָיו דְּאַזְעַר כְּנַשׁ עַשְׂרָא דְגוֹרִין וּשְׁטָחוּ לְהוֹן מַשְׁטִיחִין סְחוֹר סְחוֹר לְמַשְׁרִיתָא:", "onk_en": "The people arose all of that day, the entire night and the entire next day, and they gathered the quail. He who gathered the least amount, gathered ten heaps and they spread them for themselves around the camp.", "pj": "וְקָמוּ מְחַסְרֵי הֵימְנוּתָא דִי בְּעַמָא כָּל יוֹמָא הַהוּא וְכָל לֵילְיָא וְכָל יוֹמָא דְבַתְרוֹי וּכְנָשׁוּ יַת סַלְוֵי דִקְטִיעַ וּדְחַגִיר כְּנַשׁ עַשְרָא כִּרְוַויַן וּשְׁטָחוּ לְהוֹן מַשְׁטִיחִין חִזְרָנוּת מַשְׁרִיתָא", "pj_en": "And they who had been wanting in faith arose: and all that day, and all the night, and all the day that followed, they gathered the quails; even he who was lame and infirm gathered ten korin, and they spread them abroad round about the camps.", "tj": "עֲשַ¦ר כּוּרְוַון:", "tj_en": "Ten korin.", "rashi": "<b>הממעיט.<\/b> מִי שֶׁאוֹסֵף פָּחוֹת מִכֻּלָּם, הָעֲצֵלִים וְהַחִגְּרִים, <b>אסף עשרה חמרים<\/b> (שם):<br><br><b>וישטחו.<\/b> עָשׂוּ אוֹתָן מַשְׁטִיחִין מַשְׁטִיחִין (שם):", "rashi_en": "הממעיט means, HE THAT GATHERED LEAST of all — the indolent and the lame. אסף עשרה חמרים GATHERED TEN HOMERS (Numbers 11:32) (Sifrei Bamidbar 98). <br><br>וישטחו means, they spread them out in numerous layers (Sifrei Bamidbar 98; Yoma 75b)."}, {"ch": 11, "v": 33, "aliyah": 7, "heb": "הַבָּשָׂ֗ר עוֹדֶ֙נּוּ֙ בֵּ֣ין שִׁנֵּיהֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְאַ֤ף יְהֹוָה֙ חָרָ֣ה בָעָ֔ם וַיַּ֤ךְ יְהֹוָה֙ בָּעָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃", "onk": "בִּסְרָא עַד כְּעַן בֵּין שִׁנֵּיהוֹן עַד לָא פְסַק וְרָגְזָא דַיְיָ תְּקֵיף בְּעַמָּא וּקְטַל יְיָ בְּעַמָּא קְטוֹל סַגִּי לַחֲדָא:", "onk_en": "The meat was still between their teeth before it was [even] finished, when the wrath of Adonoy was incited upon the people, and Adonoy smote the people an enormous blow.", "pj": "רַשִׁיעַיָא הֲווֹן אָכְלִין מִן בִּשְרָא וּלְמַאן דְיַהֲבִית לְהוֹן לָא הֲווֹן מְכָרְכִין בִּישְרָא עַד כְּדוֹן הֲוָה בֵּינֵי כַּכֵיהוֹן עַד לָא פָסַק וְרוּגְזָא דַיְיָ תַּקִיף בְּרִשְׁעֵי עַמָא וּקְטֵיל יְיָ בְּעַמָא קְטוֹל סַגִי לַחֲדָא", "pj_en": "The wicked ate of the flesh, yet offered no thanksgiving to Him who had given it to them: but while the flesh was between their teeth, and not consumed, the anger of the Lord waxed strong against the evil people, and the Lord slew the people with a very great mortality.", "tj": "", "tj_en": "", "rashi": "<b>טרם יכרת.<\/b> כְּתַרְגּוּמוֹ \"עַד לָא פְסַק\"; דָּ\"אַ, אֵינוֹ מַסְפִּיק לְפָסְקוֹ בְּשִׁנָּיו עַד שֶׁנִּשְׁמָתוֹ יוֹצְאָה:", "rashi_en": "טרם יכרת Translate this as the Targum does: עד דלא פסק whilst it (the flesh, the supply of flesh) had not yet ceased. Another explanation is: one had not yet time to bite it through with his teeth before his soul departed (Sifrei Bamidbar 98)."}, {"ch": 11, "v": 34, "aliyah": 7, "heb": "וַיִּקְרָ֛א אֶת־שֵֽׁם־הַמָּק֥וֹם הַה֖וּא קִבְר֣וֹת הַֽתַּאֲוָ֑ה כִּי־שָׁם֙ קָֽבְר֔וּ אֶת־הָעָ֖ם הַמִּתְאַוִּֽים׃", "onk": "וּקְרָא יָת שְׁמָא דְאַתְרָא הַהוּא <b>קִבְרֵי דִמְשַׁאֲלֵי<\/b> אֲרֵי תַמָּן קְבָרוּ יָת עַמָּא דְּשָׁאִילוּ:", "onk_en": "He called the name of that place Kivros Hataavoh [<b>Graves of the Demanders<\/b>], for it was there that they buried the people who had these cravings.", "pj": "וּקְרָא יַת שׁוּם אַתְרָא הַהוּא קִבְרֵי דִמְשַׁיְילֵי בִּישְרָא אֲרוּם תַּמָן קְבָרוּ יַת עַמָא דְשַׁיְילוּ בִּישְרָא", "pj_en": "And he called the name of that place, The Graves of the Desirers of Flesh; for there they buried the people who had desired flesh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 35, "aliyah": 7, "heb": "מִקִּבְר֧וֹת הַֽתַּאֲוָ֛ה נָסְע֥וּ הָעָ֖ם חֲצֵר֑וֹת וַיִּהְי֖וּ בַּחֲצֵרֽוֹת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "מִקִּבְרֵי דִמְשַׁאֲלֵי נְטָלוּ עַמָּא לַחֲצֵרוֹת וַהֲווֹ בַּחֲצֵרוֹת:", "onk_en": "From Kivros Hataavoh the people journeyed to Chatzeiros, and they stayed in Chatzeiros.", "pj": "וּמִן קִבְרֵי דִמְשַׁיְילֵי בִּישְרָא נְטָלוּ עַמָא לַחֲצֵרוֹת וַהֲווֹן בַּחֲצֵרוֹת", "pj_en": "And from the Graves of the Desirers the people journeyed to Hatseroth, and they were in Hatseroth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 1, "aliyah": 7, "heb": "וַתְּדַבֵּ֨ר מִרְיָ֤ם וְאַהֲרֹן֙ בְּמֹשֶׁ֔ה עַל־אֹד֛וֹת הָאִשָּׁ֥ה הַכֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי־אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח׃", "onk": "וּמַלֵּלַת מִרְיָם וְאַהֲרֹן בְּמשֶׁה עַל עֵסַק אִתְּתָא <b>שַׁפִּרְתָּא<\/b> דִּי נְסִיב אֲרֵי אִתְּתָא <b>שַׁפִּרְתָּא<\/b> דִנְסִיב <b>רָחִיק<\/b>:", "onk_en": "Miriam and Aharon spoke about Moshe concerning the Cushite [<b>fair<\/b>] woman that he married, for, he married [<b>sent away<\/b>] a Cushite [<b>fair<\/b>] woman.", "pj": "וְאִשְׁתְּעִיוּ מִרְיָם וְאַהֲרן בְּמשֶׁה פִּתְגָמִין דְלָא מְהַגְנִין עַל עֵיסַק אִתְּתָא כּוּשְׁיָיתָא דְאַסְבוֹהִי כוּשָׁאֵי לְמשֶׁה בְּמֵיעַרְקֵיהּ מִן קֳדָם פַּרְעה וְרִיחְקָהּ אֲרוּם לְאִיתָא אַסְבוֹהִי יַת מַלְכְּתָא דְכוּשׁ וְרָחִיק מִינָהּ", "pj_en": "And Miriam and Aharon spake against Mosheh words that were not becoming with respect to the Kushaitha whom the Kushaee had caused Mosheh to take when he had fled from Pharoh, but whom he had sent away because they had given him the queen of Kush, and he had sent her away.", "tj": "וְאִשְׁתָּעוּ מִרְיָם וְאַהֲרן בְּמשֶׁה עַל עֵיסַק אִיתָא כּוּשְׁיָיתָא דִנְסִיב וְהָא לָא אִיתָא כּוּשְׁיָיתָא הֲוָת צִפּוֹרָה אִתַּת משֶׁה אֶלָא הֵיךְ מַה דְהַדֵין כּוּשְׁיָא מְשַׁנֵי בִּשְרֵיהּ מִכָּל בִּרְיָיתָא כֵּן הֲוָת צִפּוֹרָה אִתַּת משֶׁה יָאֶה בְּרֵיוָהּ וְשַׁפִּירָא בְחִזְוָהּ וּמְשַׁנְיָא בְּעוֹבָדַיָא טָבָא מִכָּל נְשַׁיָא דְדָרַיָא הַהוּא:", "tj_en": "And Miriam and Aharon spake against Mosheh about the Kushaitha whom he had taken. But observe, the Kushite wife was not Zipporah, the wife of Mosheh, but a certain Kushaitha, of a flesh different from every creature: whereas Zipporah, the wife of Mosheh, was of a comely form and beautiful countenance, and more abundant in good works than all the women of her age.", "rashi": "<b>ותדבר.<\/b> אֵין דִּבּוּר בְּכָל מָקוֹם אֶלָּא לָשׁוֹן קָשָׁה, וְכֵן הוּא אוֹמֵר \"דִּבֶּר הָאִישׁ אֲדֹנֵי הָאָרֶץ אִתָּנוּ קָשׁוֹת\" (בראשית מ\"ב), וְאֵין אֲמִירָה בְּכָל מָקוֹם אֶלָּא לְשׁוֹן תַּחֲנוּנִים, וְכֵן הוּא אוֹמֵר \"וַיֹּאמַר אַל נָא אַחַי תָּרֵעוּ\" (בראשית י\"ט), \"וַיֹּאמֶר שִׁמְעוּ נָא דְבָרָי\" (פסוק ו), כָּל נָא לְשׁוֹן בַּקָּשָׁה (ספרי):<br><br><b>ותדבר מרים ואהרן.<\/b> הִיא פָתְחָה בְדִּבּוּר תְּחִלָּה, לְפִיכָךְ הִקְדִּימָהּ הַכָּתוּב, וּמִנַּיִן הָיְתָה יוֹדַעַת מִרְיָם שֶׁפֵּרֵשׁ מֹשֶׁה מִן הָאִשָּׁה? רַבִּי נָתָן אוֹמֵר מִרְיָם הָיְתָה בְצַד צִפּוֹרָה בְּשָׁעָה שֶׁנֶּאֱמַר לְמֹשֶׁה אֶלְדָּד וּמֵידָד מִתְנַבְּאִים בַּמַּחֲנֶה, כֵּיוָן שֶׁשָּׁמְעָה צִפּוֹרָה, אָמְרָה אוֹי לְנְשׁוֹתֵיהֶן שֶׁל אֵלּוּ אִם הֵם נִזְקָקִים לִנְבוּאָה, שֶׁיִּהְיוּ פוֹרְשִׁין מִנְּשׁוֹתֵיהֶן כְּדֶרֶךְ שֶׁפֵּרֵשׁ בַּעְלִי מִמֶּנִּי, וּמִשָּׁם יָדְעָה מִרְיָם וְהִגִּידָה לְאַהֲרֹן; וּמַה מִּרְיָם שֶׁלֹּא נִתְכַּוְּנָה לִגְנוּתוֹ כָּךְ נֶעֶנְשָׁה, קַל וָחֹמֶר לִמְסַפֵּר בִּגְנוּתוֹ שֶׁל חֲבֵרוֹ (ספרי):<br><br><b>האשה הכשית.<\/b> מַגִּיד שֶׁהַכֹּל מוֹדִים בְּיָפְיָהּ כְּשֵׁם שֶׁהַכֹּל מוֹדִים בְּשַׁחֲרוּתוֹ שֶׁל כּוּשִׁי (שם):<br><br><b>כושית.<\/b> בְּגִימַטְרִיָּא יְפַת מַרְאֶה:<br><br><b>על אדות האשה.<\/b> עַל אוֹדוֹת גֵּרוּשֶׁיהָ:<br><br><b>כי אשה כשית לקח.<\/b> מַה תַּ\"ל? אֶלָּא יֵשׁ לְךְ אִשָּׁה נָאָה בְּיָפְיָהּ וְאֵין נָאָה בְמַעֲשֶׂיהָ, בְּמַעֲשֶׂיהָ וְלֹא בְיָפְיָהּ, אֲבָל זֹאת נָאָה בַכֹּל:<br><br><b>האשה הכשית.<\/b> עַל שֵׁם נוֹיָהּ נִקְרֵאת כּוּשִׁית, כְּאָדָם הַקּוֹרֵא אֶת בְּנוֹ נָאֶה כּוּשִׁי, כְּדֵי שֶׁלֹּא תִּשְׁלֹט בּוֹ עַיִן רָעָה:<br><br><b>כי אשה כשית לקח.<\/b> וְעַתָּה גֵּרְשָׁהּ:", "rashi_en": "ותדבר AND [MIRIAM AND AARON] SPAKE — The term דבר in every passage where it is used implies harsh language, for so it states, (Genesis 42:30) “The man, the lord of the land spake (דבר) roughly to us”. The term אמר, however, is always an expression denoting supplication, for so it states, (Genesis 19:7) “And he said (ויאמר) ‘I beg of you (נא), my brethren, do not so wickedly” ; (verse 6 of this chapter) “And He said (ויאמר), Hear, I pray you (נא), My words’ — for the word נא always expresses supplication (Sifrei Bamidbar 99).<br><br>ותדבר מרים ואהרן AND MIRIAM AND AARON SPAKE — She opened the conversation, therefore Scripture mentions her first. And whence did Miriam know that Moses had separated himself from his wife (for this was the statement she made; cf. Rashi below)? R. Nathan answered: “Miriam was beside Zipporah When it was told to Moses, ‘Eldad and Medad are prophesying in the camp’ (Numbers 11:27). When Zipporah heard this, she exclaimed, Woe to the wives of these if they have anything to do with prophecy, for they will separate from their wives just has my husband has separated from me!” It was from this that Miriam knew about it, and she told it to Aaron. Now what was the case with Miriam who had no intention to disparage him? She was punished thus severely! How much the more will this be so in the case of one who intentionally speaks in disparagement of this fellow”! (Sifrei Bamidbar 99).<br><br>האשה הכשית THE CUSHITE WOMAN — This tells us that all agreed as to her beauty just as all agree as to the blackness of an Aethopian (cf. Sifrei Bamidbar 99).<br><br>כושית — The numerical value of this word (736) is the same as that of יפת מראה, a woman of beautiful appearance.<br><br>על אדות האשה BECAUSE OF THE [CUSHITE] WOMAN — because of her having been divorced by Moses (cf. Note on next passage).<br><br>כי אשה כשית לקח FOR HE HAD MARRIED A CUSHITE WOMAN — What is the force of this statement? (It appears superfluous; since על אדות וכו has been explained to refer to Moses having divorced his Cushite wife, it is unnecessary to state afterwards that he had married her)! But it is made to suggest the following: You may find a woman who is pleasant an account of her beauty but who is not pleasant by reason of her deeds (conduct); or one pleasant because of her conduct but not because of her beauty. This woman, however, was pleasant in every respect (Sifrei Bamidbar 99).<br><br>האשה הכשית THE CUSHITE WOMAN — Because of her beauty-she was called, “the Aethiopian” just as a man calls his handsome son “Moor”, in order that the evil eye should have no power over him (Midrash Tanchuma, Tzav 13).<br><br>כי אשה כשית לקח THAT HE HAD MARRIED A CUSHITE (a beautiful) WOMAN, and had now divorced her."}, {"ch": 12, "v": 2, "aliyah": 7, "heb": "וַיֹּאמְר֗וּ הֲרַ֤ק אַךְ־בְּמֹשֶׁה֙ דִּבֶּ֣ר יְהֹוָ֔ה הֲלֹ֖א גַּם־בָּ֣נוּ דִבֵּ֑ר וַיִּשְׁמַ֖ע יְהֹוָֽה׃", "onk": "וַאֲמָרוּ הַלְחוֹד בְּרַם בְמשֶׁה מַלִּיל יְיָ הֲלָא אַף עִמָּנָא מַלִּיל <b>וּשְׁמִיעַ קֳדָם<\/b> יְיָ:", "onk_en": "They said: “Is it only to Moshe that Adonoy has spoken? Did He not also speak with us?” and [<b>it was heard before<\/b>] Adonoy heard.", "pj": "וְאָמְרוּ הַלְחוֹד בְּרַם עִם משֶׁה מַלֵיל יְיָ דְאִתְפְּרַשׁ מִתַּשְׁמִישׁ דְעָרִיס הֲלָא אוֹף עִמָנָא מַלֵיל וּשְׁמִיעַ קֳדָם יְיָ", "pj_en": "And they said, Hath the Lord spoken only with Mosheh, that he should be separated from the married life? Hath He not spoken with us also? And it was heard before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>הרק אך.<\/b> עִמּוֹ לְבַדּוֹ דִּבֶּר ה':<br><br><b>הלא גם בנו.<\/b> וְלֹא פֵרַשְׁנוּ מִדֶּרֶךְ אֶרֶץ (ספרי):", "rashi_en": "הרק אך FOR HAS INDEED THE LORD SPOKEN with him alone.<br><br>הלא גם בנו HAS HE NOT ALSO [SPOKEN] WITH US, and we have not separated from our spouses! (Sifrei Bamidbar 100). "}, {"ch": 12, "v": 3, "aliyah": 7, "heb": "וְהָאִ֥ישׁ מֹשֶׁ֖ה <span class=\"mam-kq-trivial\">עָנָ֣ו<\/span> מְאֹ֑ד מִכֹּל֙ הָֽאָדָ֔ם אֲשֶׁ֖ר עַל־פְּנֵ֥י הָאֲדָמָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְגַבְרָא משֶׁה עִנְוְתָן לַחֲדָא מִכֹּל אֱנָשָׁא דִּי עַל אַפֵּי אַרְעָא:", "onk_en": "The man, Moshe [was] most humble, more so than any other person on the face of the earth.", "pj": "וְגַבְרָא משֶׁה עִנְוְותָן בְּדַעֲתֵּיהּ לַחֲדָא מִן כָּל בְּנֵי נְשָׁא דְעַל אַנְפֵּי אַרְעָא וְלָא חָשׁ לְמִלֵיהוֹן", "pj_en": "But the man Mosheh was more bowed down in his mind than all the children of men upon the face of the earth; neither cared he for their words.", "tj": "", "tj_en": "", "rashi": "<b>ענו.<\/b> שָׁפָל וְסַבְלָן:", "rashi_en": "ענו means, humble and patient."}, {"ch": 12, "v": 4, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה פִּתְאֹ֗ם אֶל־מֹשֶׁ֤ה וְאֶֽל־אַהֲרֹן֙ וְאֶל־מִרְיָ֔ם צְא֥וּ שְׁלׇשְׁתְּכֶ֖ם אֶל־אֹ֣הֶל מוֹעֵ֑ד וַיֵּצְא֖וּ שְׁלׇשְׁתָּֽם׃", "onk": "וַאֲמַר יְיָ בִּתְכֵּף לְמשֶׁה וּלְאַהֲרֹן וּלְמִרְיָם פּוּקוּ תְלָתֵיכוֹן לְמַשְׁכַּן זִמְנָא וּנְפָקוּ תְּלָתֵיהוֹן:", "onk_en": "Adonoy said, suddenly, to Moshe, Aharon and Miriam: “Come out, all three of you, to the Tent of Meeting,” and the three of them went out.", "pj": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרן וּלְמִרְיָם פּוּקוּ תְּלָתֵיכוֹן לְמַשְׁכַּן זִמְנָא וּנְפָקוּ תְּלָתֵיהוֹן", "pj_en": "And the Lord said to Mosheh, to Aharon, and to Miriam, Come forth, you three, to the tabernacle. And those three went forth.", "tj": "", "tj_en": "", "rashi": "<b>פתאם.<\/b> נִגְלָה עֲלֵיהֶם פִּתְאֹם וְהֵם טְמֵאִין בְּדֶרֶךְ אֶרֶץ, וְהָיוּ צוֹעֲקִים \"מַיִם מַיִם\" לְהוֹדִיעָם שֶׁיָּפֶה עָשָׂה מֹשֶׁה שֶׁפֵּרֵשׁ מִן הָאִשָּׁה, מֵאַחַר שֶׁנִּגְלֵית עָלָיו שְׁכִינָה תָּדִיר וְאֵין עֵת קְבוּעָה לַדִּבּוּר (עי' ילקוט):<br><br><b>צאו שלשתכם.<\/b> מַגִּיד שֶׁשְּׁלָשְׁתָּן נִקְרְאוּ בְדִבּוּר אֶחָד מַה שֶּׁאִי אֶפְשָׁר לַפֶּה לוֹמַר וְלָאֹזֶן לִשְׁמֹעַ (ספרי):", "rashi_en": "פתאם SUDDENLY — He revealed himself to them suddenly just when they were unclean as a result of marital intercourse, so that they cried; “Water, water!” (for purification). He did this to give them to understand that Moses had acted rightly in that he had separated from his wife, since the Shechinah used to reveal Itself to him at all times and there was no definite time fixed for the Divine communication (Midrash Tanchuma, Tzav 13).<br><br>צאו שלשתכם GO OUT YOU THREE [UNTO THE APPOINTED TENT] — This tells us that the names of all three of them were mentioned as one utterance, something that is impossible for a human mouth to articulate and a human ear to catch (Sifrei Bamidbar 102)."}, {"ch": 12, "v": 5, "aliyah": 7, "heb": "וַיֵּ֤רֶד יְהֹוָה֙ בְּעַמּ֣וּד עָנָ֔ן וַֽיַּעֲמֹ֖ד פֶּ֣תַח הָאֹ֑הֶל וַיִּקְרָא֙ אַהֲרֹ֣ן וּמִרְיָ֔ם וַיֵּצְא֖וּ שְׁנֵיהֶֽם׃", "onk": "<b>וְאִתְגְּלִי<\/b> יְיָ בְּעַמּוּדָא דַעֲנָנָא וְקָם בִּתְרַע מַשְׁכְּנָא וּקְרָא אַהֲרֹן וּמִרְיָם וּנְפָקוּ תַּרְוֵיהוֹן:", "onk_en": "Adonoy descended [<b>appeared<\/b>] in a pillar of cloud and He stood at the entrance of the Tent, and He called [to] Aharon and Miriam, and both of them went out.", "pj": "וְאִתְגְלֵי יְקָרָא דַיְיָ בְּעַמוּדָא דַעֲנַן יְקָרָא וְקָם בִּתְרַע מַשְׁכְּנָא וּקְרָא אַהֲרן וּמִרְיָם וּנְפָקוּ תַּרְוֵיהוֹן", "pj_en": "And the Glory of the Lord was revealed in the Cloud of Glory, and He stood at the door of the tabernacle, and called Aharon and Miriam: and those two came forth.", "tj": "", "tj_en": "", "rashi": "<b>בעמוד ענן.<\/b> יָצָא יְחִידִי שֶׁלֹּא כְמִדַּת בָּשָׂר וָדָם, מֶלֶךְ בָּשָׂר וָדָם כְּשֶׁיּוֹצֵא לַמִּלְחָמָה יוֹצֵא בְּאֻכְלוּסִים וּכְשֶׁיּוֹצֵא לְשָׁלוֹם יוֹצֵא בְמוּעָטִין, וּמִדַּת הַקָּבָּ\"ה יוֹצֵא לַמִּלְחָמָה יְחִידִי, שֶׁנֶּאֱמַר \"אִישׁ מִלְחָמָה\" (שמות ט\"ו), וְיוֹצֵא לְשָׁלוֹם בְּאֻכְלוּסִין, שֶׁנֶּאֱמַר (תהילים ס\"ח) \"רֶכֶב אֱלֹהִים רִבֹּתַיִם אַלְפֵי שִׁנְאָן\" (ספרי):<br><br><b>ויקרא אהרן ומרים.<\/b> שֶׁיִּהְיוּ נִמְשָׁכִין וְיוֹצְאִין מִן הֶחָצֵר לִקְרַאת הַדִּבּוּר:<br><br><b>ויצאו שניהם.<\/b> וּמִפְּנֵי מָה מְשָׁכָן וְהִפְרִישָן מִמֹּשֶׁה? לְפִי שֶׁאוֹמְרִים מִקְצָת שִׁבְחוֹ שֶׁל אָדָם בְּפָנָיו וְכֻלּוֹ שֶׁלֹּא בְּפָנָיו, וְכֵן מָצִינוּ בְּנֹחַ, שֶׁלֹא בְּפָנָיו נֶאֱמַר \"אִישׁ צַדִּיק תָּמִים\" (בראשית ו'), וּבְפָנָיו נֶאֱמַר \"כִּי אֹתְךָ רָאִיתִי צַדִּיק לְפָנַי\" (שם ז'); דָּ\"אַ, שֶׁלֹּא יִשְׁמַע בִּנְזִיפָתוֹ שֶׁל אַהֲרֹן (ספרי):", "rashi_en": "בעמוד ענן [AND THE LORD CAME DOWN] IN THE COLUMN OF THE CLOUD — He came alone to punish them, not as is the manner of human beings: when a human king goes to war, he goes with numerous troops, but when he goes forth peaceably, he goes forth with only a few. But the manner of the Holy One, blessed be He, is that He goes to war alone — as it is said, (Exodus 15:3) “The Lord alone is the man of war, but He goes forth for peace accompanied by His hosts, as it is said, (Psalms 68:18) “The chariots of God are twenty thousands, even thousands of angels of peace (שנאן)” (Sifrei Bamidbar 102).<br><br>ויקרא אהרן ומרים AND HE CALLED: “AARON AND MIRIAM!” — that they should proceed further, and go forth from the court towards God (more lit., the Divine Speech) (Sifrei Bamidbar 102).<br><br>ויצאו שניהם AND THEY BOTH WENT FORTH — And why did He bid them go further and so separate them from Moses? Because there is a rule that one should utter only a part of a man’s good qualities in his presence, but that the whole of them should be told only in his absence. Similarly we find in the case of Noah, that in his absence (i.e. when Scripture speaks about him) it says of him: “a righteous and whole-hearted man” (Genesis 6:9), whilst in his presence (i.e. where God is speaking to Noah) it states, (Genesis 7:1) “for thee I have seen righteous before me”, (and it does not add: whole-hearted) (Sifrei Bamidbar 102). — Another explanation is: God bid only Aaron and Miriam to draw near in order that he (Moses) should not hear the reprimand administered to Aaron."}, {"ch": 12, "v": 6, "aliyah": 7, "heb": "וַיֹּ֖אמֶר שִׁמְעוּ־נָ֣א דְבָרָ֑י אִם־יִֽהְיֶה֙ נְבִ֣יאֲכֶ֔ם יְהֹוָ֗ה בַּמַּרְאָה֙ אֵלָ֣יו אֶתְוַדָּ֔ע בַּחֲל֖וֹם אֲדַבֶּר־בּֽוֹ׃", "onk": "וַאֲמַר שְׁמָעוּ כְעַן פִּתְגָּמָי אִם יְהוֹן לְכוֹן נְבִיאִין אֲנָא יְיָ בְּחֶזְיָן אֲנָא <b>מִתְגְּלִי<\/b> לְהוֹן בְּחֶלְמִין אֲנָא מְמַלֵּל עִמְּהוֹן:", "onk_en": "He said: “Please listen to My words. If there will be a prophet among you, [I,] Adonoy, will make [<b>reveal<\/b>] Myself known to him in a vision; in a dream I will speak to him.", "pj": "וַאֲמַר שִׁמְעוּ בְּבָעוּ פִּתְגָמָי עַד דַאֲמַלֵיל אִין יֶהֱווֹן כָּל נְבִיָא דְקָמוּ מִן יוֹמַת עַלְמָא מִתְמַלֵיל עִמְהוֹן הֵיכְמָא דְמִתְמַלֵיל עִם משֶׁה דְמֵימְרָא דַיְיָ בְּחֵזְיוּ לְוַתְהוֹן מִתְגְלֵי בְּחֶלְמָא מְמַלֵילְנָא עִמְהוֹן", "pj_en": "And He said, Hear now My words, while I speak. Have any of the prophets who have arisen from the days of old been spoken with as Mosheh hath been? To those (prophets) the Word of the Lord hath been revealed in apparition, speaking with them in a dream.", "tj": "", "tj_en": "", "rashi": "<b>שמעו נא דברי.<\/b> אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה (שם):<br><br><b>אם יהיה נביאכם.<\/b> אִם יִהְיוּ לָכֶם נְבִיאִים:<br><br><b>ה' במראה אליו אתודע.<\/b> שְׁכִינַת שְׁמִי אֵין נִגְלֵית עָלָיו בְּאַסְפַּקְלַרְיָא הַמְּאִירָה אֶלָּא בַּחֲלוֹם וְחִזָּיוֹן:", "rashi_en": "שמעו נא דברי HEAR, I PRAY YOU, MY WORDS — The word נא is always an expression of entreaty (Sifrei Bamidbar 103).<br><br>אם יהיה נביאכם means, IF THERE WOULD BE PROPHETS TO YOU (i.e. if you had a prophet — if you could show one to me). <br><br>ה׳ במראה אליו אתודע This means: the Shechinah (the Divine Glory) of my Name does not reveal Itself unto him in a “transparent glass” (i.e. a direct revelation), but in dreams and visions (cf. Sifrei Bamidbar 103)."}, {"ch": 12, "v": 7, "aliyah": 7, "heb": "לֹא־כֵ֖ן עַבְדִּ֣י מֹשֶׁ֑ה בְּכׇל־בֵּיתִ֖י נֶאֱמָ֥ן הֽוּא׃", "onk": "לָא כֵן עַבְדִּי משֶׁה בְּכָל בֵּיתִי מְהֵימָן הוּא:", "onk_en": "That is not the case with My servant, Moshe; in My entire house he is trusted.", "pj": "לָא כְדֵין אָרְחָא דְמשֶׁה עַבְדִי בְּכָל בֵּית יִשְרָאֵל עַמִי מְהֵימָן הוּא", "pj_en": "Not so is the way with Mosheh My servant; in all the house of Israel My people he is faithful.", "tj": "לֵית כְּוַת עַבְדִי משֶׁה בְּכָל קוֹמְטִיטוֹן רֵישׁ לְבִילְרִין קוֹמְטִיטוֹן דִידִי הֵימָן הוּא:", "tj_en": "Not so is My servant Mosheh among all the company (of the prophets), the chief of the chiefs of My court, faithful is he.", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 8, "aliyah": 7, "heb": "פֶּ֣ה אֶל־פֶּ֞ה אֲדַבֶּר־בּ֗וֹ וּמַרְאֶה֙ וְלֹ֣א בְחִידֹ֔ת וּתְמֻנַ֥ת יְהֹוָ֖ה יַבִּ֑יט וּמַדּ֙וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְדַבֵּ֖ר בְּעַבְדִּ֥י בְמֹשֶֽׁה׃", "onk": "<b>מַמְלַל עִם מַמְלַל<\/b> מַלֶּלְנָא עִמֵּיהּ בְּחֵזוּ וְלָא בְחִדְוָן וּדְמוּת <b>יְקָרָא<\/b> דַיְיָ מִסְתַּכָּל וּמָא דֵין לָא דְחֶלְתּוּן לְמַלָּלָא בְּעַבְדִּי בְמשֶׁה:", "onk_en": "Mouth [<b>speaker<\/b>] to mouth [<b>speaker<\/b>] I speak to [<b>with<\/b>] him, in a vision and not in riddles; he gazes at the [<b>glorious<\/b>] likeness of Adonoy; so why are you not afraid to speak about My servant, about Moshe?”", "pj": "מַמְלַל עִם מַמְלַל מַלֵילִית עִמֵיהּ דְיִתְפְּרַשׁ מִתַּשְׁמִישׁ דְעָרִיס וְחֵיזוּ וְלָא בְּטוּמְרָא מִתְגְלֵינָא לֵיהּ בְּאַסָנָא וּדְמוּ דְבָתַר שְׁכִינְתִּי חָזֵי וּמָא דֵין לָא דְחַלְתּוּן לְאִשְׁתְּעוֹיֵי כַּהֲלֵין מִלַיָא בְּעַבְדִי בְמשֶׁה", "pj_en": "Speaker with speaker have I spoken with him, who hath separated himself from the married life; but in vision, and not with mystery, revealed I Myself to him at the bush, and he beheld the likeness of My Shekinah. And why have you not feared to speak such words of My servant Mosheh?", "tj": "", "tj_en": "", "rashi": "<b>פה אל פה.<\/b> אָמַרְתִּי לוֹ לִפְרֹשׁ מִן הָאִשָּׁה (שם), וְהֵיכָן אָמַרְתִּי לוֹ? בְּסִינַי — \"לֵךְ אֱמֹר לָהֶם שׁוּבוּ לָכֶם לְאָהֳלֵיכֶם וְאַתָּה פֹּה עֲמֹד עִמָּדִי\" (דברים ה'):<br><br><b>ומראה ולא בחדת.<\/b> מַרְאֶה זֶה מַרְאֵה דִבּוּר, שֶׁאֲנִי מְפָרֵשׁ לוֹ דִּבּוּרִי בְּמַרְאִית פָּנִים שֶׁבּוֹ, וְאֵינִי סוֹתְמוֹ לוֹ בְחִידוֹת, כָּעִנְיָן שֶׁנֶּאֱמַר לִיחֶזְקֵאל (יחזקאל י\"ז), \"חוּד חִידָה\" וְגוֹ'; יָכוֹל מַרְאֵה שְׁכִינָה? תַּ\"ל (שמות ל\"ג), \"לֹא תוּכַל לִרְאֹת אֶת פָּנָי\" (ספרי):<br><br><b>ותמנת ה' יביט.<\/b> זֶה מַרְאֵה אֲחוֹרַיִם, כָּעִנְיָן שֶׁנֶּאֱמַר (שמות ל\"ג), \"וְרָאִיתָ אֶת אֲחֹרָי\" (ספרי):<br><br><b>בעבדי במשה.<\/b> אֵינוֹ אוֹמֵר בְּעַבְדִּי מֹשֶׁה, אֶלָּא בְּעַבְדִּי בְמֹשֶׁה — בְּעַבְדִּי אַעַ\"פִּ שֶׁאֵינוֹ מֹשֶׁה, בְּמֹשֶׁה אֲפִלּוּ אֵינוֹ עַבְדִּי כְּדַאי הֱיִיתֶם לִירוֹא מִפָּנָיו, וְכָל שֶׁכֵּן שֶׁהוּא עַבְדִּי, וְעֶבֶד מֶלֶךְ מֶלֶךְ, וְהָיָה לָכֶם לוֹמַר אֵין הַמֶּלֶךְ אוֹהֲבוֹ חִנָּם, וְאִם תֹּאמְרוּ אֵינִי מַכִּיר בְּמַעֲשָׂיו — זוֹ קָשָׁה מִן הָרִאשׁוֹנָה (שם):", "rashi_en": "פה אל פה MOUTH TO MOUTH [I HAVE SPOKEN WITH HIM] — I have Myself told him to separate from his wife. And where did I tell him this? On Sinai, when I said to him, (Deuteronomy 5:27 Deuteronomy 5:28) “Go, say to them (to the people), ‘Get you into your tents (rejoin your wives). But as for thee, remain thou here by Me, [and I will speak unto thee]’” (Shabbat 87a; cf. Sifrei Bamidbar 103).<br><br>ומראה ולא בחידת AND IN A מראה AND NOT IN RIDDLES — When it says מראה, this refers to the clearness of the Divine communication, i.e. that I express My communication unto him in the clearest form in which it can be put and do not obscure it in riddles, as e.g. was the manner in which it was said to Ezekiel: (Ezekiel 17:2), “Put forth a riddle etc.” — One might, however, think that it refers to the “appearance of the Shechinah” (i.e. that he saw God)! It, however, states, (Exodus 33:20) “Thou cannot see My face” (Sifrei Bamidbar 103).<br><br>ותמנת ה' יביט AND THE SIMILITUDE OF THE LORD DID HE BEHOLD — This refers to beholding the after-effects of God’s Providence, just as it is stated, (Exodus 33:22 Exodus 33:23) “[And it shall be when My glory passeth by] thou shalt see what is behind Me” (Sifrei Bamidbar 103).<br><br>בעבדי במשה [WHY WERE YE NOT AFRAID TO SPEAK] AGAINST MY SERVANT, AGAINST MOSES — It does not state “against My servant Moses”, but “against My servant, against Moses”, which suggests: why were ye not afraid to speak against My servant, even though he were not a Moses; and why were ye not afraid to speak against a Moses — even though he were not My servant — in either of these cases you ought to have feared him! How much the more ought you to be afraid to speak against him (Moses) he being also My servant — and the servant of a king is a king (a noble person) himself! You should have said: The King does not love him without reason! — But if you reply that I am not cognizant of his doings (i. e. that I love him though he does not deserve it, since I am not aware of his treatment of his wife) — then this statement is even worse than your previous one (Midrash Tanchuma, Tzav 13; cf. Sifrei Bamidbar 103)."}, {"ch": 12, "v": 9, "aliyah": 7, "heb": "וַיִּֽחַר־אַ֧ף יְהֹוָ֛ה בָּ֖ם וַיֵּלַֽךְ׃", "onk": "וּתְקִיף רָגְזָא דַיְיָ בְּהוֹן וְאִסְתַּלָּק:", "onk_en": "Adonoy’s anger flared against them and He left.", "pj": "וְאִסְתַּלֵק אִיקַר שְׁכִינְתָּא דַיְיָ מִנְהוֹן וְאָזִיל", "pj_en": "And the glory of the Lord's Shekinah ascended, and went.", "tj": "", "tj_en": "", "rashi": "<b>ויחר אף ה' בם וילך.<\/b> מֵאַחַר שֶׁהוֹדִיעָם סִרְחוֹנָם גָּזַר עֲלֵיהֶם נִדּוּי, קַ\"וָ לְבָשָׂר וָדָם, שֶׁלֹּא יִכְעֹס עַל חֲבֵרוֹ עַד שֶׁיּוֹדִיעֶנּוּ סִרְחוֹנוֹ (ספרי):", "rashi_en": "ויחר אף ה’ בם וילך AND THE WRATH OF THE LORD GLOWED AGAINST THEM; AND HE WENT AWAY — Only after He had informed them of their offence did He decree “excommunication’ against them. All the more so should a human being not display anger against his fellow before he informs him of his offense (Sifrei Bamidbar 104)."}, {"ch": 12, "v": 10, "aliyah": 7, "heb": "וְהֶעָנָ֗ן סָ֚ר מֵעַ֣ל הָאֹ֔הֶל וְהִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּשָּׁ֑לֶג וַיִּ֧פֶן אַהֲרֹ֛ן אֶל־מִרְיָ֖ם וְהִנֵּ֥ה מְצֹרָֽעַת׃", "onk": "וַעֲנָנָא אִסְתַּלַּק מֵעִלָּוֵי מַשְׁכְּנָא וְהָא מִרְיָם חַוְּרָא כְּתַלְגָּא וְאִתְפְּנִי אַהֲרֹן לְוָת מִרְיָם וְהָא סְגִירָת:", "onk_en": "The cloud departed from atop the Tent and behold! Miriam became afflicted with <i>tzora’as<\/i> white as snow; and Aharon turned towards Miriam and behold, she was afflicted with <i>tzora’as.<\/i>", "pj": "וַעֲנַן אִיקַר שְׁכִינְתָּא דַיְיָ אִסְתַּלֵק מֵעִילַוֵי מַשְׁכְּנָא וְהָא מִרְיָם לָקַת בְּצוּרְעָא וְאִסְתַּכֵּל אַהֲרן לְוַת מִרְיָם וְהָא לָקַת בְּצוּרְעָא", "pj_en": "And the glorious Cloud of the Lord's Shekinah went up from above the tabernacle; and, behold, Miriam was seized with the leprosy. And Aharon looked upon Miriam, and, behold, she had been smitten with leprosy.", "tj": "", "tj_en": "", "rashi": "<b>והענן סר.<\/b> וְאַחֲ\"כַּ <b>והנה מרים מצרעת כשלג<\/b>, מָשָׁל לְמֶלֶךְ שֶׁאָמַר לְפֵדָגוֹג, רְדֵה אֶת בְּנִי, אֲבָל לֹא תִרְדֶּנּוּ עַד שֶׁאֵלֵךְ מֵאֶצְלְךָ, שֶׁרַחֲמַי עָלָיו (שם):", "rashi_en": "והענן סר AND THE CLOUD DEPARTED, and only afterwards, ומרים מצרעת כשלג BEHOLD, MIRIAM BECAME LEPROUS, WHITE AS SNOW. A parable! This may be compared to a king who said to his son’s tutor, “Chastise my son, but do not do so until I go away from you, because I feel pity for him” (Sifrei Bamidbar 105)."}, {"ch": 12, "v": 11, "aliyah": 7, "heb": "וַיֹּ֥אמֶר אַהֲרֹ֖ן אֶל־מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔י אַל־נָ֨א תָשֵׁ֤ת עָלֵ֙ינוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַאֲשֶׁ֥ר חָטָֽאנוּ׃", "onk": "וַאֲמַר אַהֲרֹן לְמשֶׁה בְּבָעוּ רִבּוֹנִי לָא כְעַן תְּשַׁוִּי עֲלָנָא חוֹבָא דְּאִטְפַּשְׁנָא וְדִי סְרָחְנָא:", "onk_en": "Aharon said to Moshe: “Oh, my master please do not put iniquity upon us for what we have foolishly done and for what we have transgressed.", "pj": "וַאֲמַר אַהֲרן לְמשֶׁה בְּמָטוּ מִינָךְ רִבּוֹנִי לָא תְשַׁוֵי עֲלָנָא חוֹבָא דֵי אִיטַפַּשְׁנָא וְדִי סְרַחֲנָא", "pj_en": "And Aharon said to Mosheh, I beseech of thee, my lord, not to lay upon us the sin we have foolishly committed, and by which we have transgressed.", "tj": "דְאִשְׁתְּלִינָן:", "tj_en": "That we have sinned.", "rashi": "<b>נואלנו.<\/b> כְּתַרְגּוּמוֹ, לְשׁוֹן אֱוִיל:", "rashi_en": "נואלנו — Understand this as the Targum does: (we have acted foolishly); it is associated in meaning with אויל “a fool”."}, {"ch": 12, "v": 12, "aliyah": 7, "heb": "אַל־נָ֥א תְהִ֖י כַּמֵּ֑ת אֲשֶׁ֤ר בְּצֵאתוֹ֙ מֵרֶ֣חֶם אִמּ֔וֹ וַיֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽוֹ׃", "onk": "לָא כְעַן <b>תִּתְרַחַק דָּא מִבֵּינָנָא אֲרֵי אֲחָתָנָא הִיא צַלִּי כְעַן עַל בִּסְרָא מִיתָא הָדֵין דִּי בַהּ וְיִתַּסִּי<\/b>:", "onk_en": "Please let her not be like the dead [<b>separated from among us for she is our sister<\/b>]; That, since he came from his mother’s womb, it would be as half of his own flesh was consumed [<b>pray now for this dead flesh which is in her, so she will be healed<\/b>].”", "pj": "בְּבָעוּ מִינָךְ לָא תֶהֱוֵי מִרְיָם אַחֲתָן מְצָרְעָא מְסָאֲבָא בְּאָהֵילָא כְּמֵיתָא דְהִיא מְדַמְיָא לְוַלְדָא דְאִישְׁלַם בִּמְעֵי אִמֵיהּ תִּשְׁעָא יַרְחִין וְכֵיוָן דְיִמְטָא קִיצָא לְמִפּוֹק לְעַלְמָא וְאִתְאָכִיל פַּלְגוּת בִּישְרֵיהּ בִּזְמַן דְיַתְבָא אִמֵיהּ עַל מַתְבְּרָא וִימוּת וַלְדָא וּמַפְקָא יָתֵיהּ חַיְתָא כַּד מְחַתֵּיךְ הֵיכְדֵין כַּד הֲוֵינָן בְּאַרְעָא דְמִצְרַיִם הֲוַת מִרְיָם אַחֲתָן חַמְיָא יָתָן בְּגָלוּתָן וּבְטִלְטוּלָן וּבְשִׁעֲבּוּדָן וּכְדוּ מְטַת זִמְנָא לְמִפַּק וּלְמֵירוּת יַת אַרְעָא דְיִשְרָאֵל הָא כְדוּן הִיא מִתְמְנָעָא מִינָן בְּמָטוּ מִינָךְ רִבּוֹנִי צַלִי כְעַן עֲלָהּ וְלָא נוֹבְדָא זְכוּתָא מִגוֹ קְהָלָא", "pj_en": "I entreat thee that Miriam, our sister, may not be defiled with leprosy in the tent, as the dead, for it is with her as with the infant which, having well fulfilled the time of the womb, perishes at the birth: so Miriam was with us in the land of Mizraim, seeing us in our captivity, our dispersion, our servitude; but now, when the time hath come for our going forth to possess the land of Israel behold she is kept back from us. I entreat thee, my lord, to pray for her, that her righteousness may not come to nought among the congregation.", "tj": "לָא בְּבָעוּ תֶּהֱוֵי מִרְיָם אֲחַתְנָן מְצָרְעָא מְטַמְאָה בְּאָהֳלָה כְּמֵיתָא אֲרוּם הֵיךְ מַה דְהָדֵין וַלְדָא דַהֲוָה בְּמֵעַיָא דְאִמֵיהּ תִּשְׁעָה יַרְחִין בְּמַיָא וּבְאֵישָׁתָא וְלָא מַנְזִיק וְכֵיוַן דִי מְטָא קִיצֵיהּ לְמִפּוֹק מִן מְעוֹי דְאִמֵיהּ אִתְאָכִיל פַּלְגוּת בִּשְרֵיהּ כֵּן הֲוַת מִרְיָם אֲחַתְנָן מְטַרְפָא עִמָנָא בְּמַדְבָּרַיָא וַהֲוַת עִמָן בְּעַקְנָא וְכֵיוַן דְיִמְטָא קִיצִין לְמֵיעַל לְאַרְעָא דְיִשְרָאֵל לְמָא הִיא מִתְמְנַע מִינָן צַלִי כְעַן עַל בִּישְרָא מֵיתֵי וְיֵיחֵי וְלָא נֵיבַד זַכְוָותָא:", "tj_en": "Let not Miriam, our sister, be a leper, polluted in the tent as one dead. For it is with her as with the infant who hath passed nine months in its mother's womb, in water and in heat, without injury, but which after all perishes at the birth. So was Miriam, our sister, carried away with us into the desert, and with us in our trouble; but now the time hath come that we may enter into the land of Israel, why should she be kept from us? Pray now for the dead body that it may live, and that her righteousness may not fail.", "rashi": "<b>אל נא תהי.<\/b> אֲחוֹתֵנוּ זוֹ:<br><br><b>כמת.<\/b> שֶׁהַמְּצֹרָע חָשׁוּב כַּמֵּת, מַה מֵּת מְטַמֵּא בְּבִיאָה אַף מְצֹרָע מְטַמֵּא בְּבִיאָה (שם):<br><br><b>אשר בצאתו מרחם אמו.<\/b> אִמֵּנוּ הָיָה לוֹ לוֹמַר, אֶלָּא שֶׁכִּנָּה הַכָּתוּב, וְכֵן חֲצִי בְשָׂרוֹ, חֲצִי בְשָׂרֵנוּ הָיָה לוֹ לוֹמַר, אֶלָּא שֶׁכִּנָּה הַכָּתוּב, מֵאַחַר שֶׁיָּצְתָה מֵרֶחֶם אִמֵּנוּ, הִיא לָנוּ כְּאִלּוּ נֶאֱכַל חֲצִי בְשָׂרֵנוּ, כָּעִנְיָן שֶׁנֶּאֱמַר \"כִּי אָחִינוּ בְשָׂרֵנוּ הוּא\" (בראשית ל\"ז), וּלְפִי מַשְׁמָעוֹ, אַף הוּא נִרְאֶה כֵן, אֵין רָאוּי לְאָח לְהַנִּיחַ אֶת אֲחוֹתוֹ לִהְיוֹת כַּמֵּת:<br><br><b>אשר בצאתו.<\/b> מֵאַחַר שֶׁיָּצָא זֶה מֵרֶחֶם אִמּוֹ שֶׁל זֶה, שֶׁיֵּשׁ כֹּחַ בְּיָדוֹ לַעֲזֹר וְאֵינוֹ עוֹזְרוֹ — הֲרֵי נֶאֱכָל <b>חצי בשרו<\/b>, שֶׁאָחִיו בְּשָׂרוֹ הוּא; דָּ\"אַ, <b>אל נא תהי כמת<\/b> — אִם אֵינְךָ רוֹפְאָהּ בִּתְפִלָּה, מִי מַסְגִּירָהּ, מִי מְטַהֲרָהּ? אֲנִי אִ\"אֶ לִרְאוֹתָהּ, שֶׁאֲנִי קָרוֹב וְאֵין קָרוֹב רוֹאֶה אֶת הַנְּגָעִים, וְכֹהֵן אַחֵר אֵין בָּעוֹלָם, וְזֶהוּ <b>אשר בצאתו מרחם אמו<\/b>:", "rashi_en": "אל נא תהי LET NOT our sister BE —<br><br>כמת AS ONE WHO IS DEAD — Aaron said this because a leper may be regarded as dead. How is it in the case of a corpse? It makes one unclean through entering a room in which it lies, So too, does the leper make a person unclean through his entering the place where he is (cf. Sifrei Bamidbar 105). <br><br>אשר בצאתו מרחם אמו It ought to have stated “אמנו” “of our mother’s womb”, only that Scripture modified the expression. Similarly חצי בשרו — it ought to have said חצי בשרנו “the half of our flesh is consumed”, only that Scripture modified the expression (Scripture uses these expressions with the suffix of the third person singular instead of the first person plural, because it wishes to avoid an ominous expression referring to Aaron and Moses). — The meaning is: Since she came forth from the womb of our own mother she in her present state is to us as though the half of our flesh were consumed. It is the same idea as is expressed in the words, (Genesis 37:27) “for he is our brother, our own flesh” (Sifrei Bamidbar 105). — And even according to what the text literally implies (without assuming any modification) it appears to have that meaning: \"It is not right for a brother to allow his sister to remain as a dead person\". <br><br> אשר בצאתו — since he (the dead person) also come out of the womb of the mother of this man who possessed the power to help him and does not help him, — then, indeed, the half of his own flesh becomes consumed if the other perishes, since one’s brother is one’s own flesh. — Another explanation of אל נא תהי כמת in the sense of “Do not let her remain a leper” is: If you (Moses) do not heal her by your prayer, who will put her in quarantine as a leper (cf. Leviticus 13:4) who will ultimately declare her clean? It is impossible for me to examine her as to the character of her leprosy, since I am a near relative and a near relative may not examine the leprous plagues of his kin, (Sifrei Bamidbar 105; cf. Mishnah Negaim 2:5) and there is no other priest in The world who is not her relative. This is alluded to in the words אשר כצאתו מרחם אמו — “since he (the only person who could declare her clean) has come out of the same womb\"."}, {"ch": 12, "v": 13, "aliyah": 7, "heb": "וַיִּצְעַ֣ק מֹשֶׁ֔ה אֶל־יְהֹוָ֖ה לֵאמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְצַלִּי משֶׁה קֳדָם יְיָ לְמֵימָר אֱלָהָא בְּבָעוּ אַסֵּי כְעַן יָתָהּ:", "onk_en": "Moshe cried out [in prayer] to Adonoy, saying: “Please, God, please heal her.”", "pj": "וְצַלִי משֶׁה וּבְעָא רַחֲמִין קֳדָם יְיָ לְמֵימָר בְּבָעוּ בְּרַחֲמִין אֱלָהָא רַחֲמָנָא בְּבָעוּ אֱלָהָא דְשַׁלִיט בְּנִשְׁמַת כָּל בִּישְרָא אַסֵי בְּבָעוּ לָהּ", "pj_en": "And Mosheh did pray, and seek mercy before the Lord, saying: I pray through the compassions of the merciful God, O Eloha, who hast power over the life of all flesh, heal her, I beseech thee.", "tj": "אֱלָהָא דְמַסֵי כָּל בִּשְרָא אָסֵי יָתָהּ:", "tj_en": "O Eloha, who healest all flesh, heal her.", "rashi": "<b>אל נא רפא נא לה.<\/b> בָּא הַכָּתוּב לְלַמֶּדְךָ דֶּרֶךְ אֶרֶץ, שֶׁהַשּׁוֹאֵל דָּבָר מֵחֲבֵרוֹ צָרִיךְ לוֹמַר שְׁנַיִם אוֹ שְׁלֹשָׁה דִבְרֵי תַחֲנוּנִים וְאַ\"כַּ יְבַקֵּשׁ שְׁאֵלוֹתָיו (ספרי):<br><br><b>לאמר.<\/b> מַה תַּ\"ל ? אָמַר לוֹ הֲשִׁיבֵנִי אִם אַתָּה מְרַפֵּא אוֹתָהּ אִם לָאו עַד שֶׁהֱשִׁיבוֹ וְאָבִיהָ יָרֹק יָרַק וְגוֹ'; רַאֶבֶּ\"עֲ אוֹמֵר בְּאַרְבָּעָה מְקוֹמוֹת בִּקֵּשׁ מֹשֶׁה מִלִּפְנֵי הַקָּבָּ\"ה לַהֲשִׁיבוֹ אִם יַעֲשֶׂה שְׁאֵלוֹתָיו אִם לָאו: כַּיּוֹצֵא בוֹ, \"וַיְדַבֵּר מֹשֶׁה לִפְנֵי ה' לֵאמֹר\" וְגוֹ' (שמות ו'), מַה תַּ\"ל \"לֵאמֹר\"? הֲשִׁיבֵנִי אִם גּוֹאֲלָם אַתָּה אִם לָאו עַד שֶׁהֱשִׁיבוֹ \"עַתָּה תִרְאֶה\" וְגוֹ', כַּיּוֹצֵא בוֹ, \"וַיְדַבֵּר מֹשֶׁה לִפְנֵי ה' לֵאמֹר יִפְקֹד ה' אֱלֹהֵי הָרוּחֹת לְכָל בָּשָׂר\" (במדבר כ\"ז), הֱשִׁיבוֹ \"קַח לְךָ\", כַּיּוֹצֵא בוֹ \"וָאֶתְחַנַּן אֶל ה' בָּעֵת הַהִוא לֵאמֹר\" (דברים ג'), הֱשִׁיבוֹ \"רַב לָךְ\" (ספרי):<br><br><b>רפא נא לה.<\/b> מִפְּנֵי מָה לֹא הֶאֱרִיךְ מֹשֶׁה בִּתְפִלָּה? שֶׁלֹּא יִהְיוּ יִשְׂרָאֵל אוֹמְרִים, אֲחוֹתוֹ עוֹמֶדֶת בְּצָרָה וְהוּא עוֹמֵד וּמַרְבֶּה בִתְפִלָּה (ספרי) (דָּ\"אַ, שֶׁלֹּא יֹאמְרוּ יִשְׂרָאֵל, בִּשְׁבִיל אֲחוֹתוֹ הוּא מַאֲרִיךְ בִּתְפִלָּה אֲבָל בִּשְׁבִילֵנוּ אֵינוֹ מַאֲרִיךְ בִּתְפִלָּה):", "rashi_en": "אל נא רפא נא לה HEAL HER NOW, O GOD, I BESEECH THEE — Scripture intends to teach you by this form of prayer the correct attitude in social life — that if one is asking a favour of his fellow man he should first say two or three words of supplication and then solicit the favour (Sifrei Bamidbar 105).<br><br>לאמר SAYING (more lit., to say, i.e. that he should say) — What is the force of this word? It means “to say” i.e. that God should say, viz., he (Moses) said to Him, “Answer me whether you are going to heal her or not”, — until at length He replied: “If her father had but spit in her face etc.” Rabbi Eleazer, the son of Azariah, said: In four instances Moses asked the Holy One, blessed be He, to tell him whether He would fulfil his request or not. Similar to the case here is, (Exodus 6:12): “And Moses spoke before the Lord, saying, “[Behold, the children of Israel have not hearkened unto me; how then shall Pharaoh hearken to me]”. What is the force of the word לאמר? — “Answer me whether you will redeem them or not”. Until at length the Lord said unto him, (Exodus 6:1) “Now shalt thou see [What I will do to Pharaoh]”. Similar to this is: (Numbers 27:15—18) “and Moses spake unto the Lord,
