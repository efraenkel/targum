תְּ תְּמַלֵּיל עִם בְּנֵי יִשְרָאֵל לְמֵימַר בְּרַם יַת יוֹמֵי שַׁבַּיָא דִי לִי תִנְטְרוּן אֲרוּם אָת הוּא בֵּין מֵימְרִי וּבֵינֵיכוֹן לְדָרֵיכוֹן לְמִידוֹעַ אֲרוּם אֲנָא הוּא יְיָ מְקַדִּישְׁכוֹן", "pj_en": "Also, speak thou with the sons of Israel, saying, Ye shall keep the day of My Sabbaths indeed; for it is a sign between My Word and you, that you may know that I am the Lord who sanctify you.", "tj": "", "tj_en": "", "rashi": "<b>ואתה דבר אל בני ישראל.<\/b> וְאַתָּה אַעַ\"פִּ שֶׁהִפְקַדְתִּיךָ לְצַוּוֹתָם עַל מְלֶאכֶת הַמִּשְׁכָּן, אַל יֵקַל בְּעֵינֶיךָ לִדְחוֹת אֶת הַשַּׁבָּת מִפְּנֵי אוֹתָהּ מְלָאכָה:<br><br><b>אך את שבתתי תשמרו.<\/b> אַעַ\"פִּ שֶׁתִּהְיוּ רְדוּפִין וּזְרִיזִין בִּזְרִיזוּת הַמְּלָאכָה, שַׁבָּת אַל תִּדָּחֶה מִפָּנֶיהָ, כָּל אַכִין וְרַקִּין מִעוּטִין – לְמַעֵט שַׁבָּת מִמְּלֶאכֶת הַמִּשְׁכָּן:<br><br><b>כי אות הוא ביני וביניכם.<\/b> אוֹת גְּדֻלָּה הִיא בֵינֵינוּ, שֶׁבָּחַרְתִּי בָכֶם בְּהַנְחִילִי לָכֶם אֶת יוֹם מְנוּחָתִי לִמְנוּחָה:<br><br><b>לדעת.<\/b> הָאֻמּוֹת בָּהּ <b>כי אני ה' מקדשכם<\/b>:", "rashi_en": "ואתה דבר אל בני ישראל SPEAK THOU ALSO UNTO THE CHILDREN OF ISRAEL — AND thou, although I have given thee charge to command them concerning the work of the Tabernacle let it not appear a light thing to thee to set the Sabbath aside on account of that work.<br><br>אך את שבתתי תשמרו BUT NEVERTHELESS MY SABBATHS SHALL YE KEEP — Even though you be anxious and alert to do the work promptly the Sabbath nevertheless you must not set aside on its account. The words אך and רק wherever they occur in Scripture have limitative force (Rosh Hashanah 17b; cf. Rashi on Rosh Hashanah 17b on אכין ורקין). Here Scripture intends by the word אך to except the Sabbath from the days on which the work of the Tabernacle may be done.<br><br>כי אות היא ביני וביניכם FOR IT IS A SIGN BETWEEN ME AND YOU — There is a mark of distinction in the relation that exists between us, viz., the fact that I have chosen you by letting you inherit for rest that day on which “I” rested.<br><br>לדעת TO KNOW — (not, “for you to know”, but) for the nations of the world to know through it, כי אני ה' מקדשכם THAT I AM THE LORD THAT DOTH SANCTIFY YOU."}, {"ch": 31, "v": 14, "aliyah": 1, "heb": "וּשְׁמַרְתֶּם֙ אֶת־הַשַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָכֶ֑ם מְחַֽלְלֶ֙יהָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כׇּל־הָעֹשֶׂ֥ה בָהּ֙ מְלָאכָ֔ה וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מִקֶּ֥רֶב עַמֶּֽיהָ׃", "onk": "וְתִטְּרוּן יָת שַׁבְּתָא אֲרֵי קוּדְשָׁא הִיא לְכוֹן מְחַלְּלִנַּהּ אִתְקְטָלָא יִתְקְטֵל אֲרֵי כָּל דְּיַעְבֶּד בַּהּ עִבִידָא וְיִשְׁתֵּצֵי אֲנָשָׁא הַהוּא מִגּוֹ עַמֵּיהּ:", "onk_en": "You shall [therefore] preserve the Shabbos for it is sacred to you. Anyone who profanes it shall be put to death, for whoever does work on it [Shabbos] shall be cut off [spiritually] from the midst of his people.", "pj": "וְתִנְטְרוּן יַת שַׁבְּתָא אֲרוּם קוּדְשָׁא הִיא לְכוֹן דְּיַפְסִינָהּ אִיתְקְטָלָא יִתְקְטֵיל אֲרוּם כָּל מַאן דְּיַעֲבֵיד בָּהּ עִיבִידְתָּא וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא מֵעַמֵּיהּ", "pj_en": "Ye shall keep the Sabbath, because it is holy to you; whosoever profaneth it, dying he shall die; whoso doeth work therein, that man shall be destroyed from his people.", "tj": "", "tj_en": "", "rashi": "<b>מות יומת.<\/b> אִם יֵשׁ עֵדִים וְהַתְרָאָה:<br><br><b>ונכרתה.<\/b> בְּלֹא הַתְרָאָה (מכילתא):<br><br><b>מחלליה.<\/b> הַנּוֹהֵג בָּהּ חֹל בִּקְדֻשָּׁתָהּ:", "rashi_en": "מות יומת SHALL SURELY BE PUT TO DEATH by the judges if there are witnesses testifying to the desecration and if the warning required by law had been given to the culprit immediately before he committed the offence.<br><br>ונכרתה SHALL BE CUT OFF [FROM AMONG HIS PEOPLE] by God, if no such warning had been given (Mekhilta).<br><br>מחלליה means, whosoever treats it as חול, ordinary, in so far as its sanctity is concerned."}, {"ch": 31, "v": 15, "aliyah": 1, "heb": "שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּבַיּ֣וֹם הַשְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַיהֹוָ֑ה כׇּל־הָעֹשֶׂ֧ה מְלָאכָ֛ה בְּי֥וֹם הַשַּׁבָּ֖ת מ֥וֹת יוּמָֽת׃", "onk": "שִׁתָּא יוֹמִין יִתְעֲבֵד עִבִידָא וּבְיוֹמָא שְׁבִיעָאָה שְׁבַת שַׁבְּתָא קוּדְשָׁא <b>קֳדָם<\/b> יְיָ כָּל דְּיַעְבֵּד עִבִדְתָּא בְּיוֹמָא דְשַׁבְּתָא אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "You may do work on [the] six days [of the week] but the seventh day is a Shabbos of complete rest, it is sacred to [<b>before<\/b>] Adonoy. Whoever does work on the day of Shabbos shall be put to death.", "pj": "שִׁיתָּא יוֹמִין יִתְעֲבֵיד עִיבִידְתָּא וּבְיוֹמָא שְׁבִיעָאָה שַׁבָּת שַׁבְּתָא קוּדְשָׁא קֳדָם יְיָ כָּל מַאן דְּיַעֲבֵיד עִיבִידְתָּא בְּיוֹמָא דְשַׁבְּתָא אִתְקְטָלָא יִתְקְטֵיל בְּמַטְלוּת אַבְנִין", "pj_en": "Six days ye shall do work; but the seventh day is Sabbath, the holy Sabbath before the Lord. Whoso doeth work upon the Sabbath, dying he shall die, by the casting of stones.", "tj": "", "tj_en": "", "rashi": "<b>שבת שבתון.<\/b> מְנוּחַת מַרְגּוֹעַ וְלֹא מְנוּחַת עֲרָאִי:<br><br><b>קדש לה'.<\/b> שְׁמִירַת קְדֻשָּׁתָהּ לִשְׁמִי וּבְמִצְוָתִי:", "rashi_en": "שבת שבתון denotes, reposeful rest and not rest of a casual character.<br><br>‘קדש לה HOLINESS TO THE LORD — The observance of its holiness shall be (it shall be kept holy) to the glory of My Name and by My command (because I have commanded it)."}, {"ch": 31, "v": 16, "aliyah": 1, "heb": "וְשָׁמְר֥וּ בְנֵֽי־יִשְׂרָאֵ֖ל אֶת־הַשַּׁבָּ֑ת לַעֲשׂ֧וֹת אֶת־הַשַּׁבָּ֛ת לְדֹרֹתָ֖ם בְּרִ֥ית עוֹלָֽם׃", "onk": "וְיִטְּרוּן בְּנֵי יִשְׂרָאֵל יָת שַׁבְּתָא לְמֶעְבַּד יָת שַׁבְּתָא לְדָרֵיהוֹן קְיַם עָלָם:", "onk_en": "The B’nei Yisrael shall preserve the Shabbos, to maintain the Shabbos for their generations, as an everlasting covenant.", "pj": "וְיִנְטְרוּן בְּנֵי יִשְרָאֵל יַת שַׁבְּתָא לְמֶעֱבַד תַּפְנוּקֵי שַׁבְּתָא לְדָרֵיהוֹן קְיַים עֲלָם", "pj_en": "The sons of Israel shall therefore keep the Sabbath, to perform the delightful exercises of the Sabbath; (it is) for your generations an everlasting statute;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 17, "aliyah": 1, "heb": "בֵּינִ֗י וּבֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְעֹלָ֑ם כִּי־שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהֹוָה֙ אֶת־הַשָּׁמַ֣יִם וְאֶת־הָאָ֔רֶץ וּבַיּוֹם֙ הַשְּׁבִיעִ֔י שָׁבַ֖ת וַיִּנָּפַֽשׁ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בֵּין <b>מֵימְרִי<\/b> וּבֵין בְּנֵי יִשְׂרָאֵל אָת הִיא לְעָלָם אֲרֵי שִׁתָּא יוֹמִין עֲבַד יְיָ יָת שְׁמַיָּא וְיָת אַרְעָא וּבְיוֹמָא שְׁבִיעָאָה שְׁבַת וְנָח:", "onk_en": "Between Me [<b>My Word<\/b>] and between the B’nei Yisrael it is an everlasting sign; for in six days Adonoy made the heavens and the earth, and on the seventh day, He abstained from work and He rested.”", "pj": "בֵּין מֵימְרִי וּבֵין בְּנֵי יִשְרָאֵל אָת הִיא לְעַלָם אֲרוּם בְּשִׁיתָּא יוֹמִין בְּרָא יְיָ וְשַׁכְלֵיל יַת שְׁמַיָא וְיַת אַרְעָא וּבְיוֹמָא שְׁבִיעָאָה שְׁבָת וְנָח", "pj_en": "between My Word and the sons of Israel it is a sign for ever. For in six days the Lord created and perfected the heavens and the earth; and in the seventh day He rested and refreshed.", "tj": "", "tj_en": "", "rashi": "<b>וינפש.<\/b> כְּתַרְגּוּמוֹ וְנָח, וְכָל לְשׁוֹן נֹפֶשׁ הוּא לְשׁוֹן נֶפֶשׁ, שֶׁמֵּשִׁיב נַפְשׁוֹ וּנְשִׁימָתוֹ בְּהַרְגִּיעוֹ מִטֹּרַח הַמְּלָאכָה; וּמִי שֶׁכָּתוּב בּוֹ לֹא יִיעַף וְלֹא יִיגָע (ישעיה מ'), וְכָל פָּעֳלוֹ בְמַאֲמָר, הִכְתִּיב מְנוּחָה בְּעַצְמוֹ? לְשַׂבֵּר הָאֹזֶן מַה שֶּׁהִיא יְכוֹלָה לִשְׁמֹעַ:", "rashi_en": "וינפש AND WAS REFRESHED — Take it as the Targum renders it: ונח “and He rested”. Every form of נפש is derived from the noun נֶפֶש, soul; the idea is, that one calms his soul and takes breath when one reposes after the toil of labour. — And He of Whom it is written, (Isaiah 40:28) “[… the Lord, the Creator of the ends of the earth] fainteth not nor is He weary”, and Whose every action is accomplished by His mere command had the term “repose” written of (ascribed to) Himself in order to make comprehensible to the human ear what it can understand."}, {"ch": 31, "v": 18, "aliyah": 2, "heb": "וַיִּתֵּ֣ן אֶל־מֹשֶׁ֗ה כְּכַלֹּתוֹ֙ לְדַבֵּ֤ר אִתּוֹ֙ בְּהַ֣ר סִינַ֔י שְׁנֵ֖י לֻחֹ֣ת הָעֵדֻ֑ת לֻחֹ֣ת אֶ֔בֶן כְּתֻבִ֖ים בְּאֶצְבַּ֥ע אֱלֹהִֽים׃", "onk": "וִיהַב לְמשֶׁה כַּד שֵׁיצֵי לְמַלָּלָא עִמֵּיהּ בְּטוּרָא דְסִינַי תְּרֵין לוּחֵי סַהֲדוּתָא לוּחֵי אַבְנָא כְּתִיבִין בְּאֶצְבְּעָא דַיְיָ:", "onk_en": "And He [Adonoy] gave to Moshe—when He finished speaking with him on Mount Sinai—two Tablets of the Testimony. They were stone tablets, written with God’s finger.", "pj": "וִיהַב לְמשֶׁה כַּד פָּסַק לְמַלָּלָא עִמֵּיהּ בְּטַוְורָא דְסִינַי תְּרֵין לוּחֵי סַהֲדוּתָא לוּחֵי דְאֶבֶן סַפִּירִינוּן מִכּוּרְסֵי יְקָרָא מַתְקַלְהוֹן אַרְבְּעִין סְאִין כְּתִיבִין בְּאֶצְבְּעָא דַיְיָ", "pj_en": "And He gave to Mosheh, when He had finished to speak with him in Mount Sinai, the two tablets of the testimony, tablets of sapphire-stone from the throne of glory, weighing forty sein, inscribed by the finger of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ויתן אל משה וגו'.<\/b> אֵין מֻקְדָּם וּמְאֻחָר בַּתּוֹרָה – מַעֲשֵׂה הָעֵגֶל קֹדֶם לְצִוּוּי מְלֶאכֶת הַמִּשְׁכָּן יָמִים רַבִּים הָיָה – שֶׁהֲרֵי בְי\"ז בְּתַמּוּז נִשְׁתַּבְּרוּ הַלּוּחוֹת, וּבְיוֹם הַכִּפּוּרִים נִתְרַצָּה הַקָּבָּ\"ה לְיִשְׂרָאֵל, וּלְמָחֳרָת הִתְחִילוּ בְנִדְבַת הַמִּשְׁכָּן וְהוּקַם בְּאֶחָד בְּנִיסָן (תנחומא):<br><br><b>ככלתו.<\/b> ככלתו כְּתִיב – חָסֵר – שֶׁנִּמְסְרָה לוֹ תּוֹרָה בְּמַתָּנָה כְּכַלָּה לֶחָתָן, שֶׁלֹּא הָיָה יָכוֹל לִלְמֹד כֻּלָּהּ בִּזְמַן מֻעָט כָּזֶה. דָּבָר אַחֵר, מַה כַּלָּה מִתְקַשֶּׁטֶת בְּכ\"ד קִשּׁוּטִין – הֵן הָאֲמוּרִים בְּסֵפֶר יְשַׁעְיָה – אַף תַּלְמִיד חָכָם צָרִיךְ לִהְיוֹת בָּקִי בְּכ\"ד סְפָרִים:<br><br><b>לדבר אתו.<\/b> הַחֻקִּים וְהַמִּשְׁפָּטִים שֶׁבִּוְאֵלֶּה הַמִּשְׁפָּטִים:<br><br><b>לדבר אתו.<\/b> מְלַמֵּד שֶׁהָיָה מֹשֶׁה שׁוֹמֵעַ מִפִּי הַגְּבוּרָה וְחוֹזְרִין וְשׁוֹנִין אֶת הַהֲלָכָה שְׁנֵיהֶם יַחַד:<br><br><b>לחת.<\/b> לחת כְּתִיב שֶׁהָיוּ שְׁתֵּיהֶן שָׁווֹת (שם):", "rashi_en": "ויתן אל משה וגו׳ AND HE GAVE UNTO MOSES etc. — There is no “earlier” or “later” (no chronological order) in the events related in the Torah: in fact the incident of the golden calf (related in ch. 32) happened a considerable time before the command regarding the work of the Tabernacle was given (ch. 25 and the following chapters). For on the seventeenth of Tammuz were the Tablets broken (when the people were worshipping the calf) and on the Day of Atonement God became reconciled with Israel (after Moses had prayed 80 days for forgivenness; so that it is very unlikely that the command for the building of the Tabernacle should have been given before that day) and on the next day, the eleventh of Tishri (cf. Rashi on Exodus 33:11, at end of comment on ושב אל המחנה), they began to bring their contributions for the Tabernacle which was set up on the first of Nisan. (From the seventeenth of Tammuz until the eleventh of Tishri are almost three months — ימים רבים) (Midrash Tanchuma, Ki Tisa 31).<br><br>ככלתו WHEN HE FINISHED [SPEAKING] — The word ככלתו is written defectively (without a ו after the ל) to intimate that the Torah was handed over to Moses as a gift (note the word ויתן), complete in every respect, even as the bride (the word ככלתו is taken to be connected with “כלה”, bride) is handed over to the bridegroom completely equipped with all she requires — for in a period brief as this which Moses spent on the mountain, he must have been unable to learn in its entirety every law to be derived from it. Another explanation why the word is written defective is: just as a bride (כלה) bedecks herself with 24 ornaments — those which are mentioned in the book of Isaiah (ch. 3) — so a scholar (תלמיד חכם) ought to be thoroughly versed in the contents of the 24 books of Scripture (Midrash Tanchuma, Ki Tisa 16).<br><br>לדבר אתו TO SPEAK WITH HIM the statutes and the judgments contained in the section beginning with ואלה המשפטים (ch. Exodus 21 ff.).<br><br>לדבר אתו TO SPEAK “WITH” HIM — The use of the word אתו “with him” teaches us that Moses first heard the laws from the mouth of the Almighty and that then they both again repeated each Halacha together (Exodus Rabbah 41:5).<br><br>לחת TABLETS — The word is written defectively לחת (without a ו between ח and ת), thus intimating that they were both alike in every respect (Exodus Rabbah 41:6)."}, {"ch": 32, "v": 1, "aliyah": 2, "heb": "וַיַּ֣רְא הָעָ֔ם כִּֽי־בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָרֶ֣דֶת מִן־הָהָ֑ר וַיִּקָּהֵ֨ל הָעָ֜ם עַֽל־אַהֲרֹ֗ן וַיֹּאמְר֤וּ אֵלָיו֙ ק֣וּם&thinsp;<b>׀<\/b> עֲשֵׂה־לָ֣נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְפָנֵ֔ינוּ כִּי־זֶ֣ה&thinsp;<b>׀<\/b> מֹשֶׁ֣ה הָאִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֙נוּ֙ מֵאֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה־הָ֥יָה לֽוֹ׃", "onk": "וַחֲזָא עַמָּא אֲרֵי אוֹחַר משֶׁה לְמֵחַת מִן טוּרָא וְאִתְכְּנֵשׁ עַמָּא עַל אַהֲרֹן וַאֲמָרוּ לֵיהּ קוּם עֲבֵד לָנָא דַחֲלָן דִּיְהָכוּן קֳדָמָנָא אֲרֵי דֵין משֶׁה גַבְרָא דִּי אַסְּקָנָא מֵאַרְעָא דְמִצְרַיִם לָא יְדַעְנָא מָה הֲוָה לֵיהּ:", "onk_en": "[When] the people saw that Moshe was late in coming down from the mountain, they gathered against Aharon, and said to him, “Arise, make us gods that will lead us, for this Moshe, the man who brought us up from the land of Egypt, we do not know what happened to him.”", "pj": "וַחֲמָא עַמָּא אֲרוּם אִשְׁתְּהֵי משֶׁה לְמֵיחוּת מִן טַוְורָא וְאִתְכְּנֵישׁ עַמָּא עַל אַהֲרן כַּד חֲמוּן דְּעָבַר זִימְנָא דְקָבַע לְהוֹן וַאֲזַל סַטָנָא וְאַטְעִינוּן וְהָדַר לִבְּהוֹן זְחוֹחִין וַאֲמַרוּ לֵיהּ קוּם עִיבַד לָנָא דַחֲלַן דִּי טַיְילִן קָדָמָנָא אֲרוּם דֵּין משֶׁה גַבְרָא דְאַסְקָנָא מֵאַרְעָא דְמִצְרַיִם אִשְׁתַּלְהַב בְּטַוְורָא דְאֵשָׁא מְצַלְהֲבָא מִן קֳדָם יְיָ לָא אִשְׁתְּמוֹדְעָנָא מַה הֲוָה לֵיהּ בְּסֵיפֵיהּ", "pj_en": "But the people saw that Mosheh delayed to come down from the mount, and the people gathered together unto Aharon, when they saw that the time he had appointed to them had passed; and Satana had come, and caused them to err, and perverted their hearts with pride. And they said to him, Arise, make us gods that shall go before us; for as for this Mosheh the man who brought us up from the land of Mizraim, he may have been consumed in the mountain by the fire which flameth from before the Lord, (and) we know not what hath befallen him in his end.", "tj": "", "tj_en": "", "rashi": "<b>כי בשש משה.<\/b> כְּתַרְגּוּמוֹ, לְשׁוֹן אִחוּר, וְכֵן בֹּשֵׁשׁ רִכְבּוֹ (שופטים ה'), וַיָּחִילוּ עַד בּוֹשׁ (שם ג'); כִּי כְּשֶׁעָלָה מֹשֶׁה לָהָר אָמַר לָהֶם לְסוֹף אַרְבָּעִים יוֹם אֲנִי בָא בְּתוֹךְ שֵׁשׁ שָׁעוֹת, כִּסְבוּרִים הֵם שֶׁאוֹתוֹ יוֹם שֶׁעָלָה מִן הַמִּנְיָן הוּא, וְהוּא אָמַר לָהֶם שְׁלֵמִים – אַרְבָּעִים יוֹם וְלֵילוֹ עִמּוֹ – וְיוֹם עֲלִיָּתוֹ אֵין לֵילוֹ עִמּוֹ, שֶׁהֲרֵי בְז' בְּסִיוָן עָלָה, נִמְצָא יוֹם אַרְבָּעִים בְּשִׁבְעָה עָשָׂר בְּתַמּוּז. בְּי\"ו בָּא שָׂטָן וְעִרְבֵּב אֶת הָעוֹלָם, וְהֶרְאָה דְּמוּת חֹשֶׁךְ וַאֲפֵלָה וְעִרְבּוּבְיָה, לוֹמַר וַדַּאי מֵת מֹשֶׁה לְכָךְ בָּא עִרְבּוּבְיָא לָעוֹלָם, אָמַר לָהֶם מֵת מֹשֶׁה, שֶׁכְּבָר בָּאוּ שֵׁשׁ שָׁעוֹת וְלֹא בָּא וְכוּ' כִּדְאִיתָא בְמַסֶּכֶת שַׁבָּת (דף פ\"ט); וְאִי אֶפְשָׁר לוֹמַר שֶׁלֹא טָעוּ אֶלָּא בְּיוֹם הַמְעֻנָּן בֵּין קֹדֶם חֲצוֹת בֵּין לְאַחַר חֲצוֹת, שֶׁהֲרֵי לֹא יָרַד מֹשֶׁה עַד יוֹם הַמָּחֳרָת, שֶׁנֶּאֱמַר וַיַּשְׁכִּימוּ מִמָּחֳרָת וַיַּעֲלוּ עֹלֹת:<br><br><b>אשר ילכו לפנינו.<\/b> אֱלוֹהוֹת הַרְבֵּה אִוּוּ לָהֶם (סנהדרין ס\"ג):<br><br><b>כי זה משה האיש.<\/b> כְּמִין דְּמוּת מֹשֶׁה הֶרְאָה לָהֶם הַשָּׂטָן, שֶׁנּוֹשְׂאִים אוֹתוֹ בַּאֲוִיר רְקִיעַ הַשָּׁמָיִם (שבת פ\"ט):<br><br><b>אשר העלנו מארץ מצרים.<\/b> וְהָיָה מוֹרֶה לָנוּ דֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ, עַתָּה צְרִיכִין אָנוּ לֶאֱלוֹהוֹת אֲשֶׁר יֵלְכוּ לְפָנֵינוּ:", "rashi_en": "כי בשש משה [AND WHEN THE PEOPLE SAW] THAT MOSES DELAYED LONG — Understand (בשש as the Targum does, as an expression denoting “lateness”.. Similar are: (Judges 5:28) “[Why is] his chariot so long (בשש) [in coming]?”; (Judges 3:25) “And they waited until it was late (עד בוש)”. For when Moses ascended the mountain he said to them (to the Israelites): at the end of a period of forty days (i. e. on the fortieth day) I shall return during the first six hours of the day (before noon). They thought that the day on which he ascended the mountain (the seventh of Sivan) was to be included in this number (thus — Sivan having 30 days — he was expected back before noon on the sixteenth of Tammuz). In fact, however, he had said to them “after forty days” meaning complete days — forty days, each day together with its night that precedes it — (as is the customary Jewish reckoning; cf. Genesis 1:5: ויהי ערב ויהי בקר). Now, as regards the day of this ascent, its night was not part of it that it can be reckoned as a complete day, for he ascended on the seventh of Sivan early in the morning (cf. Rashi on Exodus 19:3); it follows therefore that the fortieth day really fell on the seventeenth of Tammuz and not as the people had believed on the sixteenth. On the sixteenth of Tammuz Satan came and threw the world into confusion, giving it the appearance of darkness, gloom and disorder that people should say: “Surely Moses is dead, and that is why confusion has come into the world!” He said to them, “Yes, Moses is dead, for six hours (noon) has already come (בשש = ‎בא שש) and he has not returned etc.” — as is related in Treatise Shabbat 89a (cf. Rashi and Tosafot there and Tosafot on Bava Kamma 82a ד\"ה כדי). One cannot, however, say that they erred only on account of it being a cloudy day, their mistake consisting in not being able to distinguish between forenoon and afternoon, and that thus they were correct in their supposition that he was to return on the sixteenth of Tammuz; for this assumes that he really returned on the day when they made the calf, but that they were under the impression that noon was past — for, as a matter of fact, Moses did not come down until the following day (the day after they had made the calf), for it is said (v. 6) “And they rose up early in the morrow, and brought up burnt offerings”— and only after wards the Lord said to Moses (v. 7) “Go, go down; for thy people … have corrupted themselves”.<br><br>אשר ילכו לפנינו [MAKE US GODS] WHICH SHALL GO BEFORE US — They wished to have many gods (the words אלהים is to be taken as plural since the verb ילכו is plural; cf. Sanhedrin 63a).<br><br>כי זה משה האיש FOR AS FOR THIS MOSES — This Moses implies that Satan showed them something that looked like Moses being carried on a bier in the air high above in the skies (cf. Shabbat 89a).<br><br>אשר העלנו מארץ מצרים [THAT MAN] THAT BROUGHT US UP OUT OF THE LAND OF EGYPT, and who used to show us the way we had to go; now that he is dead we need gods which shall go before us."}, {"ch": 32, "v": 2, "aliyah": 2, "heb": "וַיֹּ֤אמֶר אֲלֵהֶם֙ אַהֲרֹ֔ן פָּֽרְקוּ֙ נִזְמֵ֣י הַזָּהָ֔ב אֲשֶׁר֙ בְּאׇזְנֵ֣י נְשֵׁיכֶ֔ם בְּנֵיכֶ֖ם וּבְנֹתֵיכֶ֑ם וְהָבִ֖יאוּ אֵלָֽי׃", "onk": "וַאֲמַר לְהוֹן אַהֲרֹן פְּרִיקוּ קָדָשֵׁי דְדַהֲבָא דִּי בְּאוּדְנֵי נְשֵׁיכוֹן בְּנֵיכוֹן וּבְנָתֵיכוֹן וְאַיְתִיּוּ לְוָתִי:", "onk_en": "Aharon said to them, “Remove the golden rings which are on the ears of your wives, your sons, and your daughters and bring them to me.”", "pj": "וַאֲמַר לְהוֹן אַהֲרן פְּרִיקוּ קָדָשֵׁי דְדַהֲבָא דִבְאוּדְנֵי נְשֵׁיכוֹן בְּנֵיכוֹן וּבְנָתֵיכוֹן וְאַיְיתוּ לְוָתִי", "pj_en": "And Aharon said to them, Deliver the golden rings that are in the ears of your wives, your sons, and your daughters, and bring them to me.", "tj": "", "tj_en": "", "rashi": "<b>באזני נשיכם.<\/b> אָמַר אַהֲרֹן בְּלִבּוֹ: הַנָּשִׁים וְהַיְלָדִים חָסִים עַל תַּכְשִׁיטֵיהֶן, שֶׁמָּא יִתְעַכֵּב הַדָּבָר וּבְתוֹךְ כָּךְ יָבֹא מֹשֶׁה, וְהֵם לֹא הִמְתִּינוּ וּפָרְקוּ מֵעַל עַצְמָן:<br><br><b>פרקו.<\/b> לְשׁוֹן צִוּוּי, מִגִּזְרַת פָּרֵק לְיָחִיד, כְּמוֹ בָּרְכוּ מִגִּזְרַת בָּרֵךְ:", "rashi_en": "באזני נשיכם [BREAK OFF THE GOLDEN PENDANTS], WHICH ARE IN THE EARS OF YOUR WIVES — Aaron said to himself: women and children have a love for their ornaments; perhaps the matter will be delayed because they will hesitate to give their ornaments, and in the meantime Moses may arrive. They (the men), however, did not wait until the women and children made up their minds but they took the ornaments off themselves (cf. v. 3: they took off the pendants which were in their ears; there is no reference to the pendants belonging to the women) (Midrash Tanchuma, Ki Tisa 21).<br><br>פרקו is an imperative plural derived from פרק which is used for the singular, just as בָּרְכוּ is derived from בָּרֵךְ‎ (פרקו and ברכו are both masculine imperative Piel)."}, {"ch": 32, "v": 3, "aliyah": 2, "heb": "וַיִּתְפָּֽרְקוּ֙ כׇּל־הָעָ֔ם אֶת־נִזְמֵ֥י הַזָּהָ֖ב אֲשֶׁ֣ר בְּאׇזְנֵיהֶ֑ם וַיָּבִ֖יאוּ אֶֽל־אַהֲרֹֽן׃", "onk": "וְאִתְפְּרִיקוּ כָּל עַמָּא יָת קָדָשֵׁי דְדַהֲבָא דִּי בְאוּדְנֵיהוֹן וְאַיְתִיּוּ לְאַהֲרֹן:", "onk_en": "All the people removed the golden rings which were on their ears, and brought them to Aharon.", "pj": "וְסָרִיבוּ נְשַׁיָא לְמִיתַּן תַּכְשִׁיטֵיהוֹן לְגַבְרֵיהוֹן וּמִן יַד פְּרִיקוּ כָּל עַמָּא יַת קָדָשֵׁי דְדַהֲבָא דִי בְאוּדְנֵיהוֹן וְאַיְיתִיוּ לְאַהֲרן", "pj_en": "And their wives denied themselves to give their ornaments to their husbands; and all the people at once delivered up the golden rings which were in their ears, and brought them to Aharon.", "tj": "", "tj_en": "", "rashi": "<b>ויתפרקו.<\/b> לְשׁוֹן פְּרִיקַת מַשָּׂא, כְּשֶׁנְטָלוּם מֵאָזְנֵיהֶם נִמְצְאוּ הֵם מְפֹרָקִים מִנִּזְמֵיהֶם, דישקריי\"ר בְּלַעַז:<br><br><b>את נזמי.<\/b> כְּמוֹ מִנִּזְמֵי, כְּמוֹ כְּצֵאתִי אֶת הָעִיר (שמות ט') – מִן הָעִיר:", "rashi_en": "ויתפרקו AND [ALL THE PEOPLE] BRAKE OFF — פרק is a term denoting “unloading a burden”. Being a transitive verb one would expect ויפרקו instead of the reflexive form ויפרקו but when they took them (the pendants) off their ears they themselves became unloaded from their pendants and therefore ויתפרקו “they unloaded themselves”, is the appropriate word to use; décharger in old French, English discharge.<br><br>את נזמי is the same as מנזמי, (they unloaded themselves from their pendants), (את having the same meaning as מן), similar to (Exodus 9:29) “As soon as I am gone out את העיר”, which means מן העיר, from the city."}, {"ch": 32, "v": 4, "aliyah": 2, "heb": "וַיִּקַּ֣ח מִיָּדָ֗ם וַיָּ֤צַר אֹתוֹ֙ בַּחֶ֔רֶט וַֽיַּעֲשֵׂ֖הוּ עֵ֣גֶל מַסֵּכָ֑ה וַיֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֙יךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּךָ מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וּנְסִיב מִידֵיהוֹן וְצַר יָתֵיהּ בְּזִיפָא וְעָבְדֵיהּ עֵגֶל מַתְּכָא וַאֲמָרוּ אִלֵּין דַּחַלְתָּךְ יִשְׂרָאֵל דִּי אַסְּקוּךְ מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "He took them from their hands, and formed it with [a goldsmith’s] engraving tool, and made it into a molten calf. They [then] said, “These, Yisrael, are your gods who brought you up from the land of Egypt.", "pj": "וּנְסֵיב מִידֵיהוֹן וְצַר יָתֵיהּ בְּשׁוֹשִׁיפָא וּרְמָא יָתֵיהּ בְּטוּפְרָא וְעַבְדֵיהּ עֵיגַל מַתְּכָא וַאֲמָרוּ אִלֵּין דַּחַלְתָּךְ יִשְרָאֵל דְּהַנְפָקוּךְ מֵאַרְעָא דְמִצְרָיִם", "pj_en": "And he took them from their hands, and bound them in a wrapper, and wrought it with a tool, having made a molten calf; and he said, These, Israel, are thy gods, which brought thee forth from the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ויצר אתו בחרט.<\/b> יֵשׁ לְתַרְגְּמוֹ בִשְׁנֵי פָנִים, הָאֶחָד וַיָּצַר – לְשׁוֹן קְשִׁירָה, בַּחֶרֶט – לְשׁוֹן סוּדָר, כְּמוֹ וְהַמִּטְפָּחוֹת וְהָחֲרִיטִים (ישעיהו ג'), וַיָּצַר כִּכְּרַיִם כֶּסֶף בִּשְׁנֵי חֲרִטִים (מלכים ב ה'), וְהַשֵּׁנִי וַיָּצַר – לְשׁוֹן צוּרָה, בַּחֶרֶט – כְּלֵי אֻמָּנוּת הַצּוֹרְפִין שֶׁחוֹרְצִין וְחוֹרְתִין בּוֹ צוּרוֹת בְּזָהָב, כְּעֵט סוֹפֵר הַחוֹרֵת אוֹתִיּוֹת בְּלוּחוֹת וּפִנְקָסִין, כְּמוֹ וּכְתֹב עָלָיו בְּחֶרֶט אֱנוֹשׁ (ישעיהו ח'), וְזֶהוּ שֶׁתִּרְגֵּם אֻנְקְלוֹס וְצַר יָתֵיהּ בְּזִיפָא, לְשׁוֹן זִיּוּף, הוּא כְּלִי אֻמָּנוּת שֶׁחוֹרְצִין בּוֹ בְּזָהָב אוֹתִיּוֹת וּשְׁקֵדִים, שֶׁקּוֹרִין בְּלַעַז ניי\"ל, וּמְזַיְּפִין עַל יָדוֹ חוֹתָמוֹת:<br><br><b>עגל מסכה.<\/b> כֵּיוָן שֶׁהִשְׁלִיכוֹ לָאוּר בְּכוּר, בָּאוּ מְכַשְּׁפֵי עֵרֶב רַב שֶׁעָלוּ עִמָּהֶם מִמִּצְרַיִם וַעֲשָׂאוּהוּ בִכְשָׁפִים; וְיֵשׁ אוֹמְרִים מִיכָה הָיָה שָׁם, שֶׁיָּצָא מִתּוֹךְ דִּמּוֹסֵי בִּנְיָן שֶׁנִּתְמַעֵךְ בּוֹ בְּמִצְרַיִם, וְהָיָה בְיָדוֹ שֵׁם וְטַס שֶׁכָּתַב בּוֹ מֹשֶׁה \"עֲלֵה שׁוֹר\" \"עֲלֵה שׁוֹר\" לְהַעֲלוֹת אֲרוֹנוֹ שֶׁל יוֹסֵף מִתּוֹךְ נִילוּס – וְהִשְׁלִיכוֹ לְתוֹךְ הַכּוּר וְיָצָא הָעֵגֶל (תנחומא):<br><br><b>מסכה.<\/b> לְשׁוֹן מַתֶּכֶת; דָּ\"אַ קכ\"ה קַנְטְרִין זָהָב הָיוּ בוֹ כְּגִימַטְרִיָּא שֶׁל מַסֵּכָה (שם):<br><br><b>אלה אלהיך.<\/b> וְלֹא נֶאֱמַר אֵלֶּה אֱלֹהֵינוּ, מִכָּאן שֶׁעֵרֶב רַב שֶׁעָלוּ מִמִּצְרַיִם הֵם שֶׁנִּקְהֲלוּ עַל אַהֲרֹן וְהֵם שֶׁעֲשָׂאוּהוּ, וְאַחַר כָּךְ הִטְעוּ אֶת יִשְׂרָאֵל אַחֲרָיו (שם):", "rashi_en": "ויצר אתו בחרט — One can translate this in two ways. The one is: to take ויצר in the sense of “tying up” (Hiphil of צרר) and בחרט in the sense of “a garment”, similar to (Isaiah 3:22) “and the mantles and the scarfs (והחריטים)”; ‎(2 Kings 5:23) “and bound (ויצר) two talents of silver in two cloths (חריטים)”. The other way is: to take ויצר in the sense of “forming figures” (Hiphil of צור) and חרט as denoting goldsmiths’ tool with which they engrave and cut figures into gold, like a writer’s stylus that incises letters on boards and tablets, as we find it in, (Isaiah 8:1) ‘‘[Take a great roll] and write on it with a man’s pen (חרט)”. This (the second explanation) is what Onkelos means when he renders the passage by וצר יתיה בזיפא and he formed it with a “זיפא”, a term which is connected with the word זיוף “forgery”. It is a tool with which letters and modelled figures are engraved in gold — a kind of work which they term niel in old French (cf. Rashi and our Note on Exodus 25:33), and by means of which seals are forged (מזיפין)‎.<br><br>עגל מסכה A MOLTEN CALF — As soon as he (Aaron) had thrown it (the gold) into the fire in a melting pot the magicians amongst the mixed multitude who had come up with them from Egypt came and made it (the golden calf) by their magic art. There are some who say that Micah the idolator mentioned in Judges ch. 17, was there, who had been drawn forth from the foundations of a building in Egypt where he was nearly crushed. He had in his possession a “supernatural name” (שם) and a plate upon which Moses had written: “Come up, ox, come up, ox!” in order to raise the coffin of Joseph who is compared to an ox (cf. Deuteronomy 33:17) out of the Nile, and he cast it (the plate) into the melting pot and the calf (the young ox) came out (ויצא העגל הזה) (Midrash Tanchuma, Ki Tisa 19).<br><br>מסכה MOLTEN is a term connected with מתכת, molten metal (ס and ת being interchanged in these words). Another explanation is: there were used in it (for making the golden calf) 125 talents of gold, corresponding to the numerical value of מסכה, which is 125 (Midrash Tanchuma, Ki Tisa 19).<br><br>אלה אלהיך THESE ARE THY GODS, [O ISRAEL] — It does not state that they said “these are our gods, [O Israel]”; hence we may learn that it was the mixed multitude which came up from Egypt that gathered themselves together against Aaron, and it was they who made it and afterwards led Israel astray after it (Midrash Tanchuma, Ki Tisa 19)."}, {"ch": 32, "v": 5, "aliyah": 2, "heb": "וַיַּ֣רְא אַהֲרֹ֔ן וַיִּ֥בֶן מִזְבֵּ֖חַ לְפָנָ֑יו וַיִּקְרָ֤א אַֽהֲרֹן֙ וַיֹּאמַ֔ר חַ֥ג לַיהֹוָ֖ה מָחָֽר׃", "onk": "וַחֲזָא אַהֲרֹן וּבְנָא מַדְבְּחָא קֳדָמוֹהִי וּקְרָא אַהֲרֹן וַאֲמַר חַגָּא <b>קֳדָם<\/b> יְיָ מְחָר:", "onk_en": "[When] Aharon saw [this], he built an altar before it. Aharon then called out and said: “Tomorrow will be a festival to [<b>before<\/b>] Adonoy.”", "pj": "וַחֲמָא אַהֲרן יַת חוּר נְכִיס קֳדָמוֹי וּדְחִיל וּבְנָא מַדְבְּחָא קֳדָמוֹי וּקְרָא בְּקַל עָצִיב וַאֲמַר חַגָּא דַיְיָ מְחַר מִנִּכְסַת קְטוֹל בַּעֲלֵי דְבָבוֹי אִלֵּין דְּכָּפְרִין בְּמָרֵיהוֹן וּפָרְגוּ עִיקַר שְׁכִינְתֵּיהּ יְיָ בְּעִיגְלָא הָדֵין", "pj_en": "For Aharon had seen Hur slain before him, and was afraid; and he builded an altar before him, and Aharon cried with doleful voice, and said, Let there be a feast before the Lord tomorrow, of the sacrifice of the slain of these adversaries who have denied their Lord, and have changed the glory of the Shekinah of the Lord for this calf.", "tj": "וַחֲמָא אַהֲרן יַת חוּר נְכִיס קֳדָמוֹי וּדְחֵיל וּבְנָא מַדְבְּחָא קֳדָמוֹי וּקְרָא אַהֲרן וַאֲמַר חֲגָא:", "tj_en": "And Aharon saw Hur slain before him, and was afraid; and he builded an altar before him, and Aharon cried and said, A feast.", "rashi": "<b>וירא אהרן.<\/b> שֶׁהָיָה בוֹ רוּחַ חַיִּים, שֶׁנֶּאֱמַר בְּתַבְנִית שׁוֹר אֹכֵל עֵשֶׂב (תהלים ק\"ו), וְרָאָה שֶׁהִצְלִיחַ מַעֲשֵׂה שָׂטָן וְלֹא הָיָה לוֹ פֶּה לִדְחוֹתָם לְגַמְרֵי:<br><br><b>ויבן מזבח.<\/b> לִדְחוֹתָם:<br><br><b>ויקרא חג לה' מחר.<\/b> וְלֹא הַיּוֹם, שֶׁמָּא יָבֹא מֹשֶׁה קֹדֶם שֶׁיַּעַבְדוּהוּ, זֶהוּ פְּשׁוּטוֹ; וּמִדְרָשׁוֹ, בְּוַיִּקְרָא רַבָּה, דְּבָרִים הַרְבֵּה רָאָה אַהֲרֹן – רָאָה חוּר בֶּן אֲחוֹתוֹ שֶׁהָיָה מוֹכִיחָם וַהֲרָגוּהוּ, וְזֶהוּ וַיִּבֶן מִזְבֵּחַ לְפָנָיו – וַיָּבֶן מִזָּבוּחַ לְפָנָיו – וְעוֹד רָאָה וְאָמַר מוּטָב שֶׁיִּתָּלֶה בִי הַסֵּרָחוֹן וְלֹא בָהֶם, וְעוֹד רָאָה וְאָמַר אִם הֵם בּוֹנִים אֶת הַמִּזְבֵּחַ, זֶה מֵבִיא צְרוֹר וְזֶה מֵבִיא אֶבֶן וְנִמְצֵאת מְלַאכְתָּן עָשׂוּי בְּבַת אַחַת, מִתּוֹךְ שֶׁאֲנִי בוֹנֶה אוֹתוֹ וַאֲנִי מִתְעַצֵּל בִּמְלַאכְתִּי, בֵּין כָּךְ וּבֵין כָּךְ מֹשֶׁה בָא:<br><br><b>חג לה'.<\/b> בְּלִבּוֹ הָיָה לַשָּׁמַיִם, בָּטוּחַ הָיָה שֶׁיָּבֹא מֹשֶׁה וְיַעַבְדוּ אֶת הַמָּקוֹם:", "rashi_en": "וירא אהרן AND WHEN AARON SAW that there was the breath of life in it — as it is said with reference to the golden calf, (Psalms 106:20) “[They changed their glory] into a similitude of an ox that ate grass” — and he realized that Satan’s work had succeeded and that he had no argument (lit., mouth) to put them (the people) entirely off.<br><br>ויבן מזבח HE BUILDED AN ALTAR to put them off.<br><br>ויקרא חג לה׳ מחר AND CALLED OUT … TO-MORROW IS A FESTIVAL TO THE LORD — to-morrow, not to-day, for he hoped that Moses might return before they would worship it (the calf). This is the plain meaning of the verse. The Midrashic explanation of it in Leviticus Rabbah 10:3 (— it supplies an object to the verb וירא —) is: Aaron saw many things; he saw Hur, his sister’s son, who had reprimanded them, and whom they had killed. This is the meaning of ויבן מזבח, viz., וַיָבֶן, he realized (taking the word as from the root בון, to understand, to realize) מִזָּבוּחַ לפניו from him who lay slaughtered before him (מזבח is vowelled to be read as מִזָּבוּחַ) what would happen to him if he offered resistance. A further explanation of וירא אהרן in the Midrash is: He saw what the situation was and said: It is better that the offence should attach itself to me than to them. And yet a further Midrashic explanation of וירא is: He looked into the matter and said: If they build this altar themselves, one will bring a clod and another a stone and the result will be that their work will be accomplished all at once; through myself building it and being dilatory in my work, in the meantime Moses may come.<br><br>חג לה׳ A FESTIVAL TO THE LORD — not to the golden calf. In his heart it (the feast) was for Heaven (the Lord). He felt confident that Moses would return by the morrow and that they would worship the Omnipresent (Leviticus Rabbah 10:3)."}, {"ch": 32, "v": 6, "aliyah": 2, "heb": "וַיַּשְׁכִּ֙ימוּ֙ מִֽמׇּחֳרָ֔ת וַיַּעֲל֣וּ עֹלֹ֔ת וַיַּגִּ֖שׁוּ שְׁלָמִ֑ים וַיֵּ֤שֶׁב הָעָם֙ לֶֽאֱכֹ֣ל וְשָׁת֔וֹ וַיָּקֻ֖מוּ לְצַחֵֽק׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאַקְדִּימוּ בְּיוֹמָא דְבַתְרוֹהִי וְאַסִּיקוּ עֲלָוָן וְקָרִיבוּ נִכְסִין <b>וְאַסְחַר<\/b> עַמָּא לְמֵיכַל וּלְמִשְׁתֵּי וְקָמוּ לְחַיָּכָא:", "onk_en": "They arose early the next morning, and offered burnt-offerings and brought peace-offerings. The people then sat down [<b>reclined<\/b>] to eat and drink, and got up to amuse themselves.", "pj": "וְאַקְדִימוּ מִיּוֹמָא מָחְרָא וְאַסִיקוּ עֲלָוָון וּקְרִיבוּ נִיכְסִין וְאַסְחַר עַמָא לְמֵיכוֹל וּלְמִישְׁתֵּי וְקָמוּ לְהוֹן לִמְגַחֲכָא בְּפוּלְחָנָא נוּכְרָאָה", "pj_en": "And on the day following, they arose, and sacrificed burnt-offerings; and the people sat around to eat and to drink, and rose up to disport themselves with strange service.", "tj": "וְקָמוּ לְהוֹן מְגַחְכִין בְּפוּלְחָנָא נוּכְרָאָה:", "tj_en": "And they rose up to disport themselves with strange service.", "rashi": "<b>וישכימו.<\/b> הַשָּׂטָן זֵרְזָם, כְּדֵי שֶׁיֶּחֶטְאוּ:<br><br><b>לצחק.<\/b> יֵשׁ בְּמַשְׁמַע הַזֶּה גִּלּוּי עֲרָיוֹת, כְּמוֹ שֶׁנֶּ' לְצַחֶק בִּי (בראשית ל\"ט), וּשְׁפִיכוּת דָּמִים, כְּמוֹ שֶׁנֶּ' יָקוּמוּ נָא הַנְּעָרִים וִישַׂחֲקוּ לְפָנֵינוּ (שמואל ב ב'), אַף כָּן נֶהֱרַג חוּר (שמות רבה):", "rashi_en": "וישכימו AND THEY ROSE UP EARLY [IN THE MORNING] — Satan made them zealous in order that they might sin, for later on in the forenoon Moses actually came down from the mountain.<br><br>לצחק TO PLAY — There is implied in this term besides idolatry also sexual immorality, — as we find the word used in, (Genesis 39:17) “to mock (לצחק) me” where unchastity is meant as is evident from the context — and blood-shed, as it is said, (II Samuel 2:14) “Let the young men arise and play (וישחקו) before me; [and they caught every one his fellow by the head and thrust his sword in his fellows side]”— here, too, Hur was assassinated (Midrash Tanchuma 3:9:20)."}, {"ch": 32, "v": 7, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֑ה לֶךְ־רֵ֕ד כִּ֚י שִׁחֵ֣ת עַמְּךָ֔ אֲשֶׁ֥ר הֶעֱלֵ֖יתָ מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה אִזֵל חוּת אֲרֵי חַבִּיל עַמָּךְ דִּי אַסֶּקְתָּא מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "Adonoy spoke to Moshe, “Go down, for your people have become corrupt—those whom you brought up out of the land of Egypt.", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה אִיזֵיל חוּת מִן רְבוּת יְקָרָךְ דְּלָא יְהָבִית לָךְ רְבוּתָא אֱלָהֵן בְּגִין יִשְרָאֵל וּכְדוּן חַבִּילוּ עוֹבָדֵיהוֹן עַמָּךְ דְּאַפֵּיקְתָּא מֵאַרְעָא דְמִצְרָיִם", "pj_en": "And the Lord said to Mosheh, Descend from the greatness of thine honour; for I have not given thee greatness except on account of Israel. But now thy people, whom thou didst bring up from the land of Mizraim, have corrupted their works;", "tj": "", "tj_en": "", "rashi": "<b>וידבר.<\/b> לְשׁוֹן קֹשִׁי הוּא, כְּמוֹ וַיְדַבֵּר אִתָּם קָשׁוֹת (בראשית מ\"ב):<br><br><b>לך רד.<\/b> מִגְּדֻלָּתְךָ – לֹא נָתַתִּי לְךָ גְּדֻלָּה אֶלָּא בִשְׁבִילָם (ברכות ל\"ב), בְּאוֹתָהּ שָׁעָה נִתְנַדָּה מֹשֶׁה מִפִּי בֵית דִּין שֶׁל מַעְלָה (תנחומא):<br><br><b>שחת עמך.<\/b> שִׁחֵת הָעָם לֹא נֶאֱמַר, אֶלָּא עַמְּךָ – עֵרֶב רַב שֶׁקִּבַּלְתָּ מֵעַצְמְךָ וְגִיַּרְתָּם וְלֹא נִמְלַכְתָּ בִּי, וְאָמַרְתָּ טוֹב שֶׁיִּדְבְּקוּ גֵרִים בַּשְּׁכִינָה – הֵם שִׁחֲתוּ וְהִשְׁחִיתוּ (שמות רבה):", "rashi_en": "וידבר AND [THE LORD] SAID — This term דבר when not followed by a word of the root אמר implies censorious speech, as (Genesis 42:7) “And he spake (וידבר) roughly (קשות) unto them”.<br><br>לך רד GO, GO DOWN from your high position; I have given you distinction only for their sake! (Berakhot 32a). At that moment Moses was excommunicated by a decree of the heavenly court (Midrash Tanchuma, Ki Tisa 22).<br><br>שחת עמך THY PEOPLE HAVE CORRUPTED THEMSELVES — It does not say the people have corrupted but “thy” people — the mixed multitude whom you received of your own accord and accepted as proselytes without consulting Me. You thought it a good thing that proselytes should be attached to the Shechina — now they have corrupted themselves and have corrupted others (Exodus Rabbah 42:6)."}, {"ch": 32, "v": 8, "aliyah": 2, "heb": "סָ֣רוּ מַהֵ֗ר מִן־הַדֶּ֙רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔ם עָשׂ֣וּ לָהֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַיִּשְׁתַּֽחֲווּ־לוֹ֙ וַיִּזְבְּחוּ־ל֔וֹ וַיֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֙יךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּךָ מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "סָטוּ בִּפְרִיעַ מִן אוֹרְחָא דִּי פַקֶּדְתִּנּוּן עֲבָדוּ לְהוֹן עֵגַל מַתְּכָא וּסְגִידוּ לֵיהּ וְדַבָּחוּ לֵיהּ וַאֲמָרוּ אִלֵּין דַּחַלְתָּךְ יִשְׂרָאֵל דִּי אַסְּקוּךְ מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "They have departed quickly from the way that I commanded them, they have made for themselves a molten calf. They have prostrated themselves to it and offered sacrifices to it, and have said, ‘These, Yisrael, are your gods who brought you up out of the land of Egypt.’”", "pj": "סָטוּ בִּפְרִיעַ מִן אוֹרְחָא דְפַקֵידְתִּינוּן בְּסִינַי לָא תַעַבְּדוּן לְכוֹן צְלַם וְצוּרָה וְכָל דְּמוּ וּכְדוֹן עָבְדוּ לְהוֹן עֵיגַל מַתְּכָא וּסְגִידוּ לֵיהּ וְדַבְּחוּ לֵיהּ וְאַכְרִיזוּ קֳדָמוֹי אִלֵּין דַּחַלְתָּךְ יִשְרָאֵל דְאַסְקוּךְ מֵאַרְעָא דְמִצְרָיִם", "pj_en": "quickly have they declined from the way which I taught them in Sinai, (that) ye shall not make yourselves image, or figure, or any similitude; for now have they made to them a molten calf, and have worshipped it, and sacrificed to it, and proclaimed before it, These are thy gods, Israel, which brought thee up from the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 9, "aliyah": 2, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֑ה רָאִ֙יתִי֙ אֶת־הָעָ֣ם הַזֶּ֔ה וְהִנֵּ֥ה עַם־קְשֵׁה־עֹ֖רֶף הֽוּא׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה <b>גְּלֵי קֳדָמַי<\/b> עַמָּא הָדֵין וְהָא עַמָּא קְשֵׁי קְדַל הוּא:", "onk_en": "Adonoy said to Moshe, “I have seen [observed] this people [<b>are revealed before Me<\/b>], and behold they are a stiff-necked people.", "pj": "וַאֲמַר יְיָ לְמשֶׁה גְּלֵי קֳדָמָי זְדוֹנְהוֹן דְּעַמָּא הָדֵין וְהָא עַם קְשֵׁי קְדַל הוּא", "pj_en": "And the Lord said to Mosheh, The pride of this people is manifest before Me, and, behold, it is a people of hard neck.", "tj": "", "tj_en": "", "rashi": "<b>קשה ערף.<\/b> מַחֲזְרִין קְשִׁי עָרְפָּם לְנֶגֶד מוֹכִיחֵיהֶם וּמְמָאֲנִים לִשְׁמֹעַ:", "rashi_en": "קשה ערף STIFF-NECKED — They turn their stiffened necks towards those who reprove them (i e. they turn their back upon them) and refuse to listen."}, {"ch": 32, "v": 10, "aliyah": 2, "heb": "וְעַתָּה֙ הַנִּ֣יחָה לִּ֔י וְיִֽחַר־אַפִּ֥י בָהֶ֖ם וַאֲכַלֵּ֑ם וְאֶֽעֱשֶׂ֥ה אוֹתְךָ֖ לְג֥וֹי גָּדֽוֹל׃", "onk": "וּכְעַן <b>הַנַּח בָּעוּתָךְ מִן קֳדָמַי<\/b> וְיִתְקֵף רוּגְזִי בְהוֹן וְאֵישֵׁיצִנּוּן וְאֶעְבֵּד יָתָךְ לְעַם סַגִּי:", "onk_en": "Now leave Me alone [<b>leave your prayer from before Me<\/b>] and My wrath will blaze against them and destroy them. I will then make you into a great nation.”", "pj": "וּכְדוּן אַנַח בְּעוּתָךְ וְלָא תַפְגִין עֲלֵיהוֹן קֳדָמַי וְאַרְתַח רְגַז אֵשָׁתָא תַקִיפְתָּא בְּהוֹן וְאֵשֵׁיצִינוּן וְאֶעְבַּד יָתָךְ לְעַם סַגִי", "pj_en": "And now, cease from thy prayer, and cry not for them before Me; for I will let My anger burn like strong fire against them, and consume them, and I will make thee a great people.", "tj": "", "tj_en": "", "rashi": "<b>הניחה לי.<\/b> עֲדַיִן לֹא שָׁמַעְנוּ שֶׁהִתְפַּלֵּל מֹשֶׁה עֲלֵיהֶם וְהוּא אוֹמֵר הַנִּיחָה לִּי? אֶלָּא כָּאן פָּתַח לוֹ פֶּתַח וְהוֹדִיעוֹ שֶׁהַדָּבָר תָּלוּי בּוֹ – שֶׁאִם יִתְפַּלֵּל עֲלֵיהֶם לֹא יְכַלֵּם (ברכות ל\"ב):", "rashi_en": "הניחה לי LET ME ALONE — So far we have not heard that Moses had prayed on their behalf and yet He says “let Me alone!” which implies a refusal to his entreaty! But by saying this He opened the door to him (offered him a suggestion) intimating to him that if he prayed for them He would not destroy them (Shemot Rabbah 42:9; cf. also Berakhot 32a)."}, {"ch": 32, "v": 11, "aliyah": 2, "heb": "וַיְחַ֣ל מֹשֶׁ֔ה אֶת־פְּנֵ֖י יְהֹוָ֣ה אֱלֹהָ֑יו וַיֹּ֗אמֶר לָמָ֤ה יְהֹוָה֙ יֶחֱרֶ֤ה אַפְּךָ֙ בְּעַמֶּ֔ךָ אֲשֶׁ֤ר הוֹצֵ֙אתָ֙ מֵאֶ֣רֶץ מִצְרַ֔יִם בְּכֹ֥חַ גָּד֖וֹל וּבְיָ֥ד חֲזָקָֽה׃", "onk": "<b>וְצַלִּי<\/b> משֶׁה קֳדָם יְיָ אֱלָהֵיהּ וַאֲמַר לְמָא יְיָ יִתְקֵף רוּגְזָךְ בְּעַמָּךְ דִּי אַפֶּקְתָּא מֵאַרְעָא דְמִצְרַיִם בְּחֵיל רַב וּבִידָא תַקִּיפָא:", "onk_en": "Moshe implored [<b>prayed<\/b>] before the Presence of Adonoy, his God, and he said, “Adonoy! Why should Your wrath blaze against Your people whom You brought out from the land of Egypt with great power and with a mighty hand?", "pj": "וְאִתְחַלְחַל משֶׁה מִן רְתִיתָא וּשְׁרֵי לְצַלָּאָה קֳדָם יְיָ אֱלָהֵיהּ וַאֲמַר לְמָא יְיָ יִתְקוֹף רוּגְזָךְ בְּעַמָּךְ דְּהַנְפָּקַת מֵאַרְעָא דְמִצְרַיִם בְּחֵיל רַב וּבִידָא תַקִיפָא", "pj_en": "And Mosheh was shaken with fear, and began to pray before the Lord his God; and he said, Wherefore should Thy wrath, O Lord, prevail against Thy people whom Thou didst bring up from the land of Mizraim, with great power and with a mighty hand.", "tj": "", "tj_en": "", "rashi": "<b>למה ה' יחרה אפך.<\/b> כְּלוּם מִתְקַנֵּא אֶלָּא חָכָם בְּחָכָם, גִּבּוֹר בְּגִבּוֹר:", "rashi_en": "למה ה‘ יחרה אפך WHEREFORE, O LORD, DOTH THY WRATH GLOW [AGAINST THY PEOPLE] — Does anyone become jealous of another, except a wise man of a wise man or a hero of a hero?! (Avodah Zarah 55a)"}, {"ch": 32, "v": 12, "aliyah": 2, "heb": "לָ֩מָּה֩ יֹאמְר֨וּ מִצְרַ֜יִם לֵאמֹ֗ר בְּרָעָ֤ה הֽוֹצִיאָם֙ לַהֲרֹ֤ג אֹתָם֙ בֶּֽהָרִ֔ים וּ֨לְכַלֹּתָ֔ם מֵעַ֖ל פְּנֵ֣י הָֽאֲדָמָ֑ה שׁ֚וּב מֵחֲר֣וֹן אַפֶּ֔ךָ וְהִנָּחֵ֥ם עַל־הָרָעָ֖ה לְעַמֶּֽךָ׃", "onk": "לְמָא יֵימְרוּן מִצְרָאֵי לְמֵימַר בְּבִישְׁתָּא אַפֶּקְתִּנּוּן לְקַטָּלָא יָתְהוֹן <b>בֵּינֵי<\/b> טוּרַיָּא וּלְשֵׁיצָיוּתְהוֹן מֵעַל אַפֵּי אַרְעָא תּוּב מִתְּקוֹף רוּגְזָךְ וְאָתֵיב מִן בִּישְׁתָּא דְּמֶלֶּלְתָּא לְמֶעְבַּד לְעַמָּךְ:", "onk_en": "Why should Egypt be able to say, ‘He brought them out with evil intent, to kill them in [<b>between<\/b>] the mountains, and to annihilate them from the face of the earth?’ Turn from [withdraw] Your blazing wrath, and reconsider the [intent of doing] evil to Your people.", "pj": "לְמָא דֵין יֵימְרוּן מִצְרָאֵי דְמִשְׁתַּיְירִין לְמֵימָר בְּבִישָׁא אַנְפֵּיקִינוּן לְקַטְלָא יַתְהוֹן בֵּינֵי טַוְורַיָא תָּבוֹר וְחֶרְמוֹן וְשִירְיוֹן וְסִינַי וּבְגִין לְשֵׁיצָאָה יַתְהוֹן מֵעַל אַנְפֵּי אַרְעָא תּוּב מִתְקוֹף רוּגְזָךְ וִיהֱוֵי תוֹהוּ קֳדָמָךְ עַל בִּישְׁתָּא דְמַלֵּילַת לְמֶעְבַּד לְעַמָּךְ", "pj_en": "Why should the Mizraee who are remaining say, It was for evil that He led them out, to kill them among the mountains of Tabor and Hermon, and Sirion and Sinai, and to destroy them from the face of the earth? Turn from Thy strong anger, and let there be relenting before Thee over the evil that Thou hast threatened to do unto Thy people.", "tj": "", "tj_en": "", "rashi": "<b>והנחם.<\/b> הִתְעַשֵּׁת מַחֲשָׁבָה אַחֶרֶת – לְהֵיטִיב לָהֶם<br><br><b>על הרעה.<\/b> אֲשֶׁר חָשַׁבְתָּ לָהֶם:", "rashi_en": "והנחם AND REPENT — form another resolution, viz., to do them good,<br><br>על הרעה INSTEAD OF THE EVIL You have thought to bring upon them."}, {"ch": 32, "v": 13, "aliyah": 2, "heb": "זְכֹ֡ר לְאַבְרָהָם֩ לְיִצְחָ֨ק וּלְיִשְׂרָאֵ֜ל עֲבָדֶ֗יךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָהֶם֮ בָּךְ֒ וַתְּדַבֵּ֣ר אֲלֵהֶ֔ם אַרְבֶּה֙ אֶֽת־זַרְעֲכֶ֔ם כְּכוֹכְבֵ֖י הַשָּׁמָ֑יִם וְכׇל־הָאָ֨רֶץ הַזֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְזַרְעֲכֶ֔ם וְנָחֲל֖וּ לְעֹלָֽם׃", "onk": "אִדְכַּר לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל עַבְדָּיךְ דִּי קַיֶּמְתָּא לְהוֹן <b>בְּמֵימְרָךְ<\/b> וּמַלֶּלְתָּא עִמְּהוֹן אַסְגֵּי יָת בְּנֵיכוֹן כְּכוֹכְבֵי שְׁמַיָּא וְכָל אַרְעָא הָדָא דִּי אֲמָרִית אֶתֵּן לִבְנֵיכוֹן וְיַחְסְנוּן לַעֲלָם:", "onk_en": "Remember Avraham, Yitzchok and Yisrael, Your servants, to whom You swore by Your Self [<b>Word<\/b>], and said to them, ‘I will make your descendants as numerous as the stars of the heaven; and all this land of which I have spoken, I will give to your descendants, and they will inherit it forever.’”", "pj": "הֱוֵי דְכִיר לְאַבְרָהָם לְיִצְחָק וּלְיִשְרָאֵל עַבְדָךְ דְּקַיֵּימְתָּא לְהוֹן בְּמֵימְרָךְ וּמַלֵּילְתָּא לְהוֹן אַסְגֵי יַת בְּנֵיכוֹן הֵי כְּכוֹכְבֵי שְׁמַיָא וְכָל אַרְעָא הָדָא דַאֲמָרִית לְכוֹן אֵיתֵּן לִבְנֵיכוֹן וְיֶחְסְנוּן לְעָלָם", "pj_en": "Remember Abraham, and Izhak, and Israel, Thy servants, to whom Thou didst swear in Thy Word and didst say to them, I will multiply your children as the stars of the heavens, and all this land of which I have told you will I give to your sons, and they shall inherit for ever.", "tj": "", "tj_en": "", "rashi": "<b>זכר לאברהם.<\/b> אִם עָבְרוּ עַל עֲשֶׂרֶת הַדִּבְּרוֹת, אַבְרָהָם אֲבִיהֶם נִתְנַסָּה בַעֲשָׂרָה נִסְיוֹנוֹת וַעֲדַיִן לֹא קִבֵּל שְׂכָרוֹ, תְּנֵהוּ לוֹ וְיֵצְאוּ עֲשָׂרָה בַעֲשָׂרָה (תנחומא):<br><br><b>לאברהם ליצחק ולישראל.<\/b> אִם לִשְׂרֵפָה הֵם, זְכֹר לְאַבְרָהָם שֶׁמָּסַר עַצְמוֹ לִשָּׂרֵף עָלֶיךָ בְּאוּר כַּשְׂדִים, אִם לַהֲרִיגָה, זְכֹר לְיִצְחָק שֶׁפָּשַׁט צַוָּארוֹ לַעֲקֵדָה, אִם לְגָלוּת, זְכֹר לְיַעֲקֹב שֶׁגָּלָה לְחָרָן, וְאִם אֵינָן נִצּוֹלִין בִּזְכוּתָן, מָה אַתָּה אוֹמֵר לִי וְאֶעֱשֶה אוֹתְךָ לְגוֹי גָּדוֹל? וְאִם כִּסֵּא שֶׁל ג' רַגְלַיִם אֵינוֹ עוֹמֵד לְפָנֶיךָ בִשְׁעַת כַּעַסְךָ, קַל וָחֹמֶר לְכִסֵּא שֶׁל רֶגֶל אַחַת (ברכות ל\"ב):<br><br><b>אשר נשבעת להם בך.<\/b> לֹא נִשְׁבַּעְתָּ לָהֶם בְּדָבָר שֶׁהוּא כָּלֶה – לֹא בַשָּׁמַיִם וְלֹא בָאָרֶץ וְלֹא בֶהָרִים וְלֹא בַּגְּבָעוֹת – אֶלָּא בְךָ, שֶׁאַתָּה קַיָּם וּשְׁבוּעָתְךָ קַיֶּמֶת לְעוֹלָם, שֶׁנֶּ' בִּי נִשְׁבַּעְתִּי נְאֻם ה' (בראשית כ\"ב), וּלְיִצְחָק נֶאֱמַר וַהֲקִמֹתִי אֶת הַשְּׁבוּעָה אֲשֶׁר נִשְׁבַּעְתִּי לְאַבְרָהָם אָבִיךָ (שם), וּלְיַעֲקֹב נֶאֱמַר אֲנִי אֵל שַׁדַּי פְּרֵה וּרְבֵה (שם ל\"ה) – נִשְׁבַּע לוֹ בְּאֵל שַׁדַּי:", "rashi_en": "זכור לאברהם (lit., remember for Abraham) — If they have transgressed the Ten Commandments, their father Abraham was tried by ten trials and has not yet received his reward for them. Give it to him now — remember for him this merit — and let the ten trials he successfully withstood countervail the infringement of the Ten Commandments (Midrash Tanchuma, Ki Tisa 24; Shemot Rabbah 44:4).<br><br>לאברהם ליצחק ולישראל REMEMBER FOR ABRAHAM, FOR ISAAC, AND FOR ISRAEL — If they are to be punished with death by burning, remember for Abraham his merit that he gave himself over to be burnt for Your sake (for the sanctification of the Divine Name) in Ur (in the fire) of the Chaldees; if with death by the sword, remember for Isaac the merit that he stretched forth his neck to the knife on the occasion of the “Binding”. If by exile, remember for Jacob the merit that he went into exile to Haran (leaving the paternal roof in order to fulfil his father’s command). If, however, they cannot be saved by their ancestors merit what is the good of You saying to me, “and I will make of thee a great nation”? — if a chair with three legs (the merits of the three patriarchs) cannot stand before You in the moment of Your wrath, how much the less a chair with only one leg (the merits of myself alone) (Berakhot 32a).<br><br>אשר נשבעת להם בך TO WHOM THOU SWAREST BY THINE OWN SELF — Thou didst not swear to them by a thing which is perishable — neither by the heavens nor by the earth, nor by the mountains, nor by the hills — but by Thy very Self, Who endurest forever and Whose oath endures for ever. For it is stated that God said to Abraham, (Genesis 22:16, 17) “By Myself have I sworn saith the Lord … [I will greatly multiply thy seed]”; to Isaac it was said, (Genesis 26:3, 4) “and I will perform the oath which I sware by Myself unto Abraham thy father … [and I will multiply thy seed]”; and to Jacob it was said, (Genesis 35:11) “I am God Almighty, be fruitful and multiply”; thus to him also God swore by Himself — by God Almighty (Shemot Rabbah 44:23)."}, {"ch": 32, "v": 14, "aliyah": 2, "heb": "וַיִּנָּ֖חֶם יְהֹוָ֑ה עַל־הָ֣רָעָ֔ה אֲשֶׁ֥ר דִּבֶּ֖ר לַעֲשׂ֥וֹת לְעַמּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתַב יְיָ מִן בִּישְׁתָא דִּי מַלֵּיל לְמֶעְבַּד לְעַמֵּיהּ:", "onk_en": "Adonoy reconsidered the [intent of doing] evil that He had said He would do to His people.", "pj": "וַהֲוָה תוֹהוּ מִן קֳדָם יְיָ עַל בִּישְׁתָּא דְחָשִׁיב לְמֶעְבַּד לְעַמֵּיהּ", "pj_en": "And there was relenting before the Lord over the evil which He had thought to do unto His people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 15, "aliyah": 2, "heb": "וַיִּ֜פֶן וַיֵּ֤רֶד מֹשֶׁה֙ מִן־הָהָ֔ר וּשְׁנֵ֛י לֻחֹ֥ת הָעֵדֻ֖ת בְּיָד֑וֹ לֻחֹ֗ת כְּתֻבִים֙ מִשְּׁנֵ֣י עֶבְרֵיהֶ֔ם מִזֶּ֥ה וּמִזֶּ֖ה הֵ֥ם כְּתֻבִֽים׃", "onk": "וְאִתְפְּנֵי וּנְחַת משֶׁה מִן טוּרָא וּתְרֵין לוּחֵי סַהֲדוּתָא בִּידֵיהּ לוּחֵי כְּתִיבִין מִתְּרֵין עִבְרֵיהוֹן מִכָּא וּמִכָּא אִנּוּן כְּתִיבִין:", "onk_en": "Moshe turned and went down from the mountain with the two Tablets of the Testimony in his hand. They were tablets written on both sides, the writing was [visible] from either side.", "pj": "וְאִתְפְּנֵי וּנְחַת משֶׁה מִן טַוְורָא וּתְרֵין לוּחֵי סַהֲדוּתָא בִּידֵיהּ לוּחִין כְּתוּבִין מִתְּרֵין צִיטְרֵיהוֹן מִיכָּא וּמִיכָּא אִינוּן כְּתִיבִין", "pj_en": "And Mosheh turned, and went down from the mount, and the two tables of the testimony were in his hands, inscribed on their two sides, here and there were they inscribed.", "tj": "", "tj_en": "", "rashi": "<b>משני עבריהם.<\/b> הָיוּ הָאוֹתִיּוֹת נִקְרָאוֹת, וּמַעֲשֵׂה נִסִּים הוּא (שבת ק\"ד):", "rashi_en": "משני עבריהם ON BOTH THEIR SIDES could the letters be read, and this constituted a miraculous piece of work (Shabbat 104a)."}, {"ch": 32, "v": 16, "aliyah": 2, "heb": "וְהַ֨לֻּחֹ֔ת מַעֲשֵׂ֥ה אֱלֹהִ֖ים הֵ֑מָּה וְהַמִּכְתָּ֗ב מִכְתַּ֤ב אֱלֹהִים֙ ה֔וּא חָר֖וּת עַל־הַלֻּחֹֽת׃", "onk": "וְלוּחַיָּא עוֹבָדָא דַיְיָ אִנּוּן וּכְתָבָא כְּתָבָא דַיְיָ הוּא מְפָרַשׁ עַל לוּחַיָּא:", "onk_en": "The Tablets were the work of God, and the writing was the writing of God, engraved upon the Tablets.", "pj": "וְלוּחַיָא עוּבְדָא דַיְיָ הִינִין וּכְתָבָא כְּתָבָא דַיְיָ הוּא חָקִיק וּמְפָרַשׁ עַל לוּחַיָא", "pj_en": "And the tables were the work of the Lord, and the writing was the Lord's writing, inscribed and manifested upon the tables.", "tj": "", "tj_en": "", "rashi": "<b>מעשה אלהים המה.<\/b> כְּמַשְׁמָעוֹ – הוּא בִּכְבוֹדוֹ עֲשָׂאָן; דָּ\"אַ, כְּאָדָם הָאוֹמֵר לַחֲבֵרוֹ כָּל עֲסָקָיו שֶׁל פְּלוֹנִי בִּמְלָאכָה פְּלוֹנִית, כָּךְ כָּל שַׁעֲשׁוּעָיו שֶׁל הַקָּבָּ\"ה בַּתּוֹרָה:<br><br><b>חרות.<\/b> לְשׁוֹן חרת וחרט אֶחָד הוּא, שְׁנֵיהֶם לְשׁוֹן חִקּוּק, אנטלי\"יר בְּלַעַז:", "rashi_en": "מעשה אלהים המה [THE TABLETS WERE] THE WORK OF GOD — This means what it literally implies: God Himself (Hebrew: in His glory) made them. Another explanation (taking מעשה in the sense of “occupation”) is: Just as a man says to his fellow, “All that Mr. So-and-so occupies himself with is only with such-and-such a work”, so is the delight of the Holy One, blessed be He, confined to the Torah alone (cf. Proverbs 8:31 the whole of which chapter is taken as a description of God’s relation to the Torah) (Midrash Tanchuma, Ki Tisa 16).<br><br>חרות — The expressions חרת (which occurs only here in Scriptures) and חרט have the same meaning, both of them signifying engraving; entailler in old French"}, {"ch": 32, "v": 17, "aliyah": 2, "heb": "וַיִּשְׁמַ֧ע יְהוֹשֻׁ֛עַ אֶת־ק֥וֹל הָעָ֖ם בְּרֵעֹ֑ה וַיֹּ֙אמֶר֙ אֶל־מֹשֶׁ֔ה ק֥וֹל מִלְחָמָ֖ה בַּֽמַּחֲנֶֽה׃", "onk": "וּשְׁמַע יְהוֹשֻׁעַ יָת קַל עַמָּא כַּד מְיַבְּבִין וַאֲמַר לְמשֶׁה קַל קְרָבָא בְּמַשְׁרִיתָא:", "onk_en": "Yehoshua heard the voice of the people rejoicing, and he said to Moshe, “There is a sound of battle in the camp.”", "pj": "וּשְׁמַע יְהוֹשֻׁעַ יַת קַל עַמָּא כַּד מְיַבְּבִין בְּחֶדְוָא קֳדָם עִיגְלָא וַאֲמַר לְמשֶׁה קַל סִידְרֵי קְרָבָא בְּמַשְׁרִיתָא", "pj_en": "And Jehoshua heard the voice of the people exulting with joy before the calf. And he said to Mosheh, There is the voice of battle in the camp.", "tj": "מְבַעֲשִׁין:", "tj_en": "Doing evil.", "rashi": "<b>ברעה.<\/b> בַּהֲרִיעוֹ, שֶׁהָיוּ מְרִיעִים וּשְׂמֵחִים וְצוֹחֲקִים:", "rashi_en": "ברעה means WHEN THEY WERE SHOUTING for they were shouting for joy and making merry."}, {"ch": 32, "v": 18, "aliyah": 2, "heb": "וַיֹּ֗אמֶר אֵ֥ין קוֹל֙ עֲנ֣וֹת גְּבוּרָ֔ה וְאֵ֥ין ק֖וֹל עֲנ֣וֹת חֲלוּשָׁ֑ה ק֣וֹל עַנּ֔וֹת אָנֹכִ֖י שֹׁמֵֽעַ׃", "onk": "וַאֲמַר לָא קַל <b>גִּבָּרִין דְּנַצְחִין בִּקְרָבָא<\/b> וְאַף לָא קַל <b>חַלָּשִׁין דְּמִתַּבְּרִין<\/b> קַל <b>דִּמְחַיְּכִין<\/b> אֲנָא שְׁמָע:", "onk_en": "But he [Moshe] said, “It is not the sound of strength [song of victory] [<b>the mighty who are victorious in war<\/b>], nor is it the sound of weakness [song of defeat] [<b>the weak who are broken<\/b>]. It is a sound of song [<b>the rejoicers<\/b>] that I hear.”", "pj": "וַאֲמַר לָא קַל גִּיבָּרִין דְּנַצְחִין בְּסִידְרֵי קְרָבָא וְלָא קַל חֲלָשִׁין דְּמִתְנַצְחִין מִן בַּעֲלֵי דְבָבֵיהוֹן בְּסִדְרֵי קְרָבָא קַל פַּלְחֵי פּוּלְחָנָא נוּכְרָאָה וּמְגַחֲכָן קַדְמָאָה אֲנָא שְׁמַע", "pj_en": "But he said, It is not the voice of the strong, who are victorious in battle, nor the voice of the weak, who are overcome by their adversaries in the fight; but the voice of them who serve with strange service, and who make merriment before it, that I hear.", "tj": "קַל מְקַלְסִין בְּפוּלְחָנָא נוּכְרָאָה:", "tj_en": "The voice of them who praise in strange service.", "rashi": "<b>אין קול ענות גבורה.<\/b> אֵין קוֹל הַזֶּה נִרְאֶה קוֹל עֲנִיַּת גִּבּוֹרִים הַצּוֹעֲקִים \"נִצָּחוֹן\" וְלֹא קוֹל חַלָּשִׁים שֶׁצּוֹעֲקִים \"וַי אָנוּסָה\":<br><br><b>קול ענות.<\/b> קוֹל חֵרוּפִין וְגִדּוּפִין, הַמְעַנִּין אֶת נֶפֶשׁ שׁוֹמְעָן כְּשֶׁנֶּאֱמָרִין לוֹ:", "rashi_en": "אין קול ענות גבורה IT IS NOT THE VOICE OF THE CRY OF MASTERY —This sound does not seem to be the sound of the utterance of victors who cry, “Victory!” nor is it the sound of the defeated who cry, “Alas — let me flee!”.<br><br>קול ענות means, the sound of blasphemy and cursing (Shemot Rabbah 41:1) which distress (עַנֵּה to vex, to grieve) the soul of him who hears them — even when they are only related to him."}, {"ch": 32, "v": 19, "aliyah": 2, "heb": "וַֽיְהִ֗י כַּאֲשֶׁ֤ר קָרַב֙ אֶל־הַֽמַּחֲנֶ֔ה וַיַּ֥רְא אֶת־הָעֵ֖גֶל וּמְחֹלֹ֑ת וַיִּֽחַר־אַ֣ף מֹשֶׁ֗ה וַיַּשְׁלֵ֤ךְ <span class=\"mam-kq-trivial\">מִיָּדָו֙<\/span> אֶת־הַלֻּחֹ֔ת וַיְשַׁבֵּ֥ר אֹתָ֖ם תַּ֥חַת הָהָֽר׃", "onk": "וַהֲוָה כַּד קָרִיב לְמַשְׁרִיתָא וַחֲזָא יָת עֶגְלָא וְחִנְגִּין וּתְקֵיף רוּגְזָא דְמשֶׁה וּרְמָא מִידוֹהִי יָת לוּחַיָּא וְתַבַּר יָתְהוֹן <b>בְּשִׁפּוֹלֵי<\/b> טוּרָא:", "onk_en": "As he [Moshe] approached the camp, he saw the calf and the dancing. Moshe’s anger blazed, and he threw down the Tablets that were in his hands and smashed them beneath [<b>at the bottom of<\/b>] the mountain.", "pj": "וַהֲוָה כַּד קָרֵיב משֶׁה לְמַשְׁרִיתָא וַחֲמָא יַת עִיגְלָא וְחִינְגִין בִּידֵיהוֹן דְּרַשִׁיעַיָא מְחַנְגִין וּמְגַחֲנִין קֳדָמוֹי וְסִטְנָא הֲוָה בְּגַוֵּיהּ מְטַפֵּז וּמְשַׁוֵּור קֳדָם עַמָּא וּמִן יַד תְּקַף רָתַח רוּגְזֵיהּ דְּמשֶׁה וּטְלַק מִן יְדוֹי יַת לוּחַיָא וּתְבַר יַתְהוֹן בְּשִׁיפּוּלֵי טַוְורָא בְּרַם כְּתָבָא קַדִּישָׁא דִי בְּהוֹן הֲוָה פָּרַח וְטַיַיס לְאַוֵיר שְׁמַיָיא וַהֲוָה צָוַוח וַאֲמַר חֲבַל עַל עַמָּא דְשָׁמְעוּ בְּסִינַי מִן פּוּם קוּדְשָׁא לָא תַעַבְדוּן לְכוֹן צְלַם וְצוּרָה וְכָל דְּמוּי וּלְסוֹף אַרְבְּעִין יוֹמִין עֲבָדוּ עֵיגַל מַתְּכָא דְלֵית בֵּיהּ מַשָׁשָׁא", "pj_en": "And it was when Mosheh came near the camp, and saw the calf, and the instruments of music in the hands of the wicked, who were dancing and bowing before it, and Satana among them dancing and leaping before the people, the wrath of Mosheh was suddenly kindled, and he cast the tables from his hands, and brake them at the foot of the mountain;- the holy writing that was on them, however, flew, and was carried away into the air of the heavens;- and he cried, and said, Woe upon the people who heard at Sinai from the mouth of the Holy One, Thou shalt not make to thyself an image, or figure, or any likeness,- and yet, at the end of forty days, make a useless molten calf!", "tj": "", "tj_en": "", "rashi": "<b>וישלך מידו וגו'.<\/b> אָמַר: מַה פֶּסַח שֶׁהוּא אֶחָד מִן הַמִּצְווֹת, אָמְרָה תוֹרָה כָּל בֶּן נֵכָר לֹא יֹאכַל בּוֹ (שמות י\"ב), הַתּוֹרָה כֻּלָּהּ כָּאן וְכָל יִשְׂרָאֵל מְשֻׁמָּדִים וְאֶתְּנֶנָּה לָהֶם? (שבת פ\"ז):<br><br><b>תחת ההר.<\/b> לְרַגְלֵי הָהָר:", "rashi_en": "וישלך מידו AND HE CAST [THE TABLETS] OUT OF HIS HAND — He said: “What is the law regarding the Paschal lamb which is only one of the commandments? The Torah states: (Exodus 12:43) “No stranger shall eat thereof”! (cf. Rashi on that verse: a stranger means one who has enstranged himself by his doings from his Father in heaven — an apostate). “But the whole Torah is here (written on the tablets) and all the Israelites are apostates, can I possibly give it (the Torah) to them?!” (Shabbat 87a).<br><br>תחת ההר BENEATH THE MOUNTAIN — i. e. at the foot of the mountain."}, {"ch": 32, "v": 20, "aliyah": 2, "heb": "וַיִּקַּ֞ח אֶת־הָעֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַיִּשְׂרֹ֣ף בָּאֵ֔שׁ וַיִּטְחַ֖ן עַ֣ד אֲשֶׁר־דָּ֑ק וַיִּ֙זֶר֙ עַל־פְּנֵ֣י הַמַּ֔יִם וַיַּ֖שְׁקְ אֶת־בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּנְסֵיב יָת עֶגְלָא דִי עֲבָדוּ וְאוֹקֵד בְּנוּרָא וְשַׁף עַד דַּהֲוָה דַקִּיק וּזְרָא עַל אַפֵּי מַיָּא וְאַשְׁקֵי יָת בְּנֵי יִשְׂרָאֵל:", "onk_en": "He took the calf that they had made, and burned it in fire, and ground it into fine powder. He then scattered it on the water, and made the B’nei Yisrael drink it.", "pj": "וּנְסִיב יַת עִיגְלָא דַעֲבָדוּ וְאוֹקֵד בְּנוּרָא וְשַׁף עַד דַּהֲוָה דָּקִיק וְדָרֵי עַל אַנְפֵּי מוֹי דְנַחֲלָא וְאַשְׁקֵי יַת בְּנֵי יִשְרָאֵל וְכָל מַאן דְּיָהַב תַּמָּן כָּל מָאנָא דְדַהֲבָא הֲוָה סִימָא נַפְקָא בְּאַנְפָּא", "pj_en": "And he took the calf which they had made, and burned it in fire, and bruised it into powder, and cast (it) upon the face of the water of the stream, and made the sons of Israel drink; and whoever had given thereto any trinket of gold, the sign of it came forth upon his nostrils.", "tj": "", "tj_en": "", "rashi": "<b>ויזר.<\/b> לְשׁוֹן נִפּוּץ, וְכֵן יְזֹרֶה עַל נָוֵהוּ גָפְרִית (איוב י\"ח), וְכֵן כִּי חִנָּם מְזֹרָה הָרָשֶׁת (משלי א'), שֶׁזּוֹרִין בָּהּ דָּגָן וְקִטְנִיּוֹת:<br><br><b>וישק את בני ישראל.<\/b> נִתְכַּוֵּן לְבָדְקָן כְּסוֹטוֹת; שָׁלֹשׁ מִיתוֹת נִדּוֹנוּ שָׁם, אִם יֵשׁ עֵדִים וְהַתְרָאָה בְּסַיִף – כְּמִשְׁפַּט אַנְשֵׁי עִיר הַנִּדַּחַת שֶׁהֵן מְרֻבִּין – עֵדִים בְּלֹא הַתְרָאָה בְּמַגֵּפָה, שֶׁנֶּאֱמַר וַיִּגֹּף ה' אֶת הָעָם, לֹא עֵדִים וְלֹא הַתְרָאָה בְּהִדְרוֹקָן, שֶׁבְּדָקוּם הַמַּיִם וְצָבוּ בִטְנֵיהֶם (יומא ס\"ו):", "rashi_en": "ויזר AND STREWED IT — The verb זרה denotes scattering about, similar to, (Job 18:15) “Brimstone shall be scattered (יזרה) upon his habitation”; (Proverbs 1:17) “Surely in vain the net is strewn (מזורה) [in the sight of any bird]” where this expression is used because people usually bestrew it (the net) with grain and pulse.<br><br>וישק את בני ישראל AND HE GAVE THE CHILDREN OF ISRAEL TO DRINK OF IT — He intended to put them to the test as faithless wives were tried (cf. Numbers 5:12—31) (Avodah Zarah 44a). Three different death-penalties were inflicted there: It there were witnesses to the act of idolatry and a legal warning had preceded the deed the offender was put to death by the sword (cf. vv. 27, 28) as was the regulation regarding the inhabitants of an apostate city (Deuteronomy 13:13—18) when there were many (as was the case here; a single idolator, however, was subject to the death by stoning; cf. Deuteronomy 17:2—5). If there were witnesses but there had been no caution, they were destroyed by the plague, as it is said, (v. 35) “And the Lord plagued the people”. In cases where there were neither witnesses nor warning they were punished by dropsy — for the water which Moses gave them to drink put them to the test and if they were guilty their bellies swelled (cf. Yoma 66b)."}, {"ch": 32, "v": 21, "aliyah": 2, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ אֶֽל־אַהֲרֹ֔ן מֶֽה־עָשָׂ֥ה לְךָ֖ הָעָ֣ם הַזֶּ֑ה כִּֽי־הֵבֵ֥אתָ עָלָ֖יו חֲטָאָ֥ה גְדֹלָֽה׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן מָה עֲבַד לָךְ עַמָּא הָדֵין אֲרֵי אַיְתֵיתָא עֲלוֹהִי חוֹבָא רַבָּא:", "onk_en": "Moshe then said to Aharon, “What did this people do to you that you brought upon them such a great sin?”", "pj": "וַאֲמַר משֶׁה לְאַהֲרן מַה עָבַד לָךְ עַמָּא הָדֵין אֲרוּם אָתֵיתָא עֲלוֹי חוֹבָא רַבָּא", "pj_en": "And Mosheh said unto Aharon, What did this people to thee, that thou hast brought upon them a great sin?", "tj": "", "tj_en": "", "rashi": "<b>מה עשה לך העם.<\/b> כַּמָּה יִסּוּרִים סָבַלְתָּ שֶׁיִּסְּרוּךָ עַד שֶׁלֹּא תָבִיא עֲלֵיהֶם חֵטְא זֶה:", "rashi_en": "מה עשה לך העם הזה WHAT DID THIS PEOPLE UNTO THEE How many pains must you have endured — it must be that they inflicted suffering on you, before you brought this sin upon them!"}, {"ch": 32, "v": 22, "aliyah": 2, "heb": "וַיֹּ֣אמֶר אַהֲרֹ֔ן אַל־יִ֥חַר אַ֖ף אֲדֹנִ֑י אַתָּה֙ יָדַ֣עְתָּ אֶת־הָעָ֔ם כִּ֥י בְרָ֖ע הֽוּא׃", "onk": "וַאֲמַר אַהֲרֹן לָא יִתְקֵף רוּגְזָא דְרִבּוֹנִי אַתְּ יְדַעַתְּ יָת עַמָּא אֲרֵי בְּבִישׁ הוּא:", "onk_en": "Aharon said, “Let not the wrath of my master blaze. You know that the people are set on evil.", "pj": "וַאֲמַר אַהֲרן לָא יִתְקֵיף רוּגְזָא דְרִבּוֹנִי אַנְתְּ יַדְעָת יַת עַמָּא אֲרוּם בְּנֵי צַדִּיקַיָא אִינוּן בְּרַם יִצְרָא בִּישָׁא הוּא דְאַטְעִינוּן", "pj_en": "And Aharon said, Let not my lord's anger be strong: thou knowest the people, that they are the children of the Just; but evil concupiscence hath made them to err:", "tj": "", "tj_en": "", "rashi": "<b>כי ברע הוא.<\/b> בְּדֶרֶךְ רַע הֵם הוֹלְכִין תָּמִיד, וּבְנִסְיוֹנוֹת לִפְנֵי הַמָּקוֹם:", "rashi_en": "כי ברע הוא [THOU KNOWEST THE PEOPLE] THAT THEY ARE SET ON EVIL — They always go on the wrong way and with temptations, before the Omnipresent."}, {"ch": 32, "v": 23, "aliyah": 2, "heb": "וַיֹּ֣אמְרוּ לִ֔י עֲשֵׂה־לָ֣נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְפָנֵ֑ינוּ כִּי־זֶ֣ה&thinsp;<b>׀<\/b> מֹשֶׁ֣ה הָאִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֙נוּ֙ מֵאֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה־הָ֥יָה לֽוֹ׃", "onk": "וַאֲמָרוּ לִי עִבֵיד לָנָא דַּחֲלַן דִּי יְהָכָן קֳדָמָנָא אֲרֵי דֵין משֶׁה גַּבְרָא דִּי אַסְּקָנָא מֵאַרְעָא דְמִצְרַיִם לָא יְדַעְנָא מַה הֲוָה לֵיהּ:", "onk_en": "They said to me, ‘Make gods for us that will lead us for this Moshe, the man who brought us up from the land of Egypt, we do not know what happened to him.’", "pj": "וַאֲמָרוּ לִי עִיבַד לָנָא דַחֲלָן דִּיטַיְילוּן קֳדָמָנָא אֲרוּם דֵּין משֶׁה גַבְרָא דְאַסְקָנָא מֵאַרְעָא דְמִצְרַיִם אִישְׁתַּלְהַב בְּטַוְורָא בְּאֵישָׁא מְצַלְהֲבָא מִן קֳדָם יְיָ וְלָא אִשְׁתְּמוֹדַעֲנָא מַה הֲוָה לֵיהּ בְּסֵיפֵיהּ", "pj_en": "and they said to me, Make us gods that may go before us; for this Mosheh, the man who brought us up from the land of Mizraim, is consumed in the mountain, by the flaming fire from before the Lord, and we know not what hath been done to him in his end.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 24, "aliyah": 2, "heb": "וָאֹמַ֤ר לָהֶם֙ לְמִ֣י זָהָ֔ב הִתְפָּרָ֖קוּ וַיִּתְּנוּ־לִ֑י וָאַשְׁלִכֵ֣הוּ בָאֵ֔שׁ וַיֵּצֵ֖א הָעֵ֥גֶל הַזֶּֽה׃", "onk": "וַאֲמָרִית לְהוֹן לְמָן דַּהֲבָא פָּרִיקוּ וִיהָבוּ לִי וּרְמִיתֵיהּ בְּנוּרָא וּנְפַק עֶגְלָא הָדֵין:", "onk_en": "I said to them, ‘Who has gold?’ They removed [their gold] and gave it to me. I threw it into the fire, and this calf emerged.”", "pj": "וַאֲמָרִית לְהוֹן לְמַאן אִית דְּהַב פְּרִיקוּ וִיהָבוּ לִי וּטְלֵיקְתֵיהּ בְּנוּרָא וְעָאַל סִטְנָא בְּגַוֵּיהּ וּנְפַק מִינֵיהּ דְּמוּת עֵיגְלָא הָדֵין", "pj_en": "And I said to them, Whoever hath gold, let him deliver and give it to me; and I cast it into the fire, and Satana entered into it, and there came out of it the similitude of this calf!", "tj": "", "tj_en": "", "rashi": "<b>ואמר להם.<\/b> דָּבָר אֶחָד – \"לְמִי זָהָב\" לְבַד – וְהֵם מִהֲרוּ וְהִתְפָּרְקוּ וַיִּתְּנוּ לִי:<br><br><b>ואשלכהו באש.<\/b> וְלֹא יָדַעְתִּי שֶׁיֵּצֵא הָעֵגֶל הַזֶּה, וְיָצָא:", "rashi_en": "ואמר להם AND I SAID UNTO THEM one single thing, — simply, “Who has any gold?” — but they hastened and broke it off from themselves and gave it to me.<br><br>ואשלכהו באש AND I CAST IT INTO THE FIRE, and I did not know that this (i. e. this living) calf would come out, ויצא — BUT IT DID COME OUT."}, {"ch": 32, "v": 25, "aliyah": 2, "heb": "וַיַּ֤רְא מֹשֶׁה֙ אֶת־הָעָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי־פְרָעֹ֣ה אַהֲרֹ֔ן לְשִׁמְצָ֖ה בְּקָמֵיהֶֽם׃", "onk": "וַחֲזָא משֶׁה יָת עַמָּא אֲרֵי <b>בְטִיל<\/b> הוּא אֲרֵי <b>בָטֵילִנּוּן<\/b> אַהֲרֹן <b>לַאֲסָבוּתְהוֹן שׁוּם בִּישׁ לְדָרֵיהוֹן<\/b>:", "onk_en": "Moshe saw [the bad traits of] the people for they were [now] exposed [<b>rejected<\/b>]; for Aharon had allowed them to be exposed [<b>nullified them<\/b>], and now they would be disgraced among their adversaries [<b>to make them take a bad name for themselves for their generations<\/b>].", "pj": "וַחֲמָא משֶׁה יַת עַמָּא אֲרוּם פְּרִיעִין הִינוּן אֲרוּם פְּרִיעוּ עַל יְדוֹי דְאַהֲרן יַת כְּלִילָא קַדִּישָׁא דַהֲוָה בְּרֵישֵׁיהוֹן וַהֲוָה שְׁמָא רַבָּא וְיַקִּירָא חָקִיק וּמְפָרַשׁ בֵּיהּ וּנְפַק טִבְּהוֹן בִּישׁ בְּעַמְמֵי אַרְעָא וְקָנוּן בְּהוֹן שׁוּם בִּישׁ לְדָרֵיהוֹן", "pj_en": "And Mosheh saw that the people were naked; for they had been stripped by the hand of Aharon of the holy crown which was upon their head, inscribed and beautified with the great and glorious Name; and that their evil report would go forth among the nations of the earth, and they would get to them an evil name unto their generations.", "tj": "וַחֲמָא משֶׁה יַת עַמָּא אֲרוּם פְּרִיעִין אִינוּן אֲרוּם פְּרָעוּ כְלִילָא דְדַהֲבָא דַהֲוָה בְּרֵישֵׁיהוֹן דַּהֲוָה שְׁמָא מְפַרְשָׁא חָקִיק עֲלֵיהוֹן מִן טוּרָא דְחוֹרֵב:", "tj_en": "And Mosheh saw the people that they were uncovered; for they had been stripped of the golden crown which was upon their head, whereon the Name had been engraven and set forth, at Mount Horeb.", "rashi": "<b>פרע.<\/b> מְגֻלֶּה; נִתְגַּלָּה שִׁמְצוֹ וּקְלוֹנוֹ, כְּמוֹ וּפָרַע אֶת רֹאשׁ הָאִשָּׁה (במדבר ה'):<br><br><b>לשמצה בקמיהם.<\/b> לִהְיוֹת לָהֶם הַדָּבָר הַזֶּה לִגְנוּת בְּפִי כָּל הַקָּמִים עֲלֵיהֶם:", "rashi_en": "פרע means UNCOVERED — its (the people’s) shame and disgrace were revealed; the word has the same meaning as in (Numbers 5:18) “[and the priest shall uncover (ופרע) the woman’s head”.<br><br>לשמצה בקמיהם means, that this thing would become an ignominy for them in the mouth of all who will rise against them."}, {"ch": 32, "v": 26, "aliyah": 2, "heb": "וַיַּעֲמֹ֤ד מֹשֶׁה֙ בְּשַׁ֣עַר הַֽמַּחֲנֶ֔ה וַיֹּ֕אמֶר מִ֥י לַיהֹוָ֖ה אֵלָ֑י וַיֵּאָסְפ֥וּ אֵלָ֖יו כׇּל־בְּנֵ֥י לֵוִֽי׃", "onk": "וְקָם משֶׁה בִּתְרַע מַשְׁרִיתָא וַאֲמַר מָן <b>דַּחֲלַיָּא<\/b> דַיְיָ יֵיתוּן לְוָתִי וְאִתְכַּנָּשׁוּ לְוָתֵיהּ כָּל בְּנֵי לֵוִי:", "onk_en": "Moshe stood at the entrance of the camp and said, “Whoever is for [<b>fears<\/b>] Adonoy, [come] to me.” All the sons of Leivi gathered to him.", "pj": "וְקָם משֶׁה בִּתְרַע סַנְהֶדְרִין דְּמַשְׁרִיתָא וַאֲמַר מַאן הוּא דַחֲלַיָא דַיְיָ יֵיתוּן לְוָותִי וְאִתְכְּנָשׁוּ לְוָותֵיהּ כָּל בְּנוֹי דְּלֵוִי", "pj_en": "And Mosheh stood in the sanhedrin gate of the camp, and said, Who feareth the Lord, let him come to me. And there gathered to him all the sons of Levi.", "tj": "", "tj_en": "", "rashi": "<b>מי לה' אלי.<\/b> יָבֹא אֵלַי:<br><br><b>כל בני לוי.<\/b> מִכָּאן שֶׁכָּל הַשֵּׁבֶט כָּשֵׁר (יומא ס\"ו):", "rashi_en": "מי לה' אלי means, WHOEVER IS FOR THE LORD let him come TO ME.<br><br>כל בני לוי ALL THE SONS OF LEVI — All the sons — from this we may gather that all the tribe of Levi remained worthy men (consequently “slay every man his brother” in the next verse can refer only to one who was his brother from the same mother, as explained by Rashi there) (Yoma 66b)."}, {"ch": 32, "v": 27, "aliyah": 2, "heb": "וַיֹּ֣אמֶר לָהֶ֗ם כֹּֽה־אָמַ֤ר יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ־חַרְבּ֖וֹ עַל־יְרֵכ֑וֹ עִבְר֨וּ וָשׁ֜וּבוּ מִשַּׁ֤עַר לָשַׁ֙עַר֙ בַּֽמַּחֲנֶ֔ה וְהִרְג֧וּ אִֽישׁ־אֶת־אָחִ֛יו וְאִ֥ישׁ אֶת־רֵעֵ֖הוּ וְאִ֥ישׁ אֶת־קְרֹבֽוֹ׃", "onk": "וַאֲמַר לְהוֹן כִּדְנַן אֲמַר יְיָ אֱלָהָא דְיִשְׂרָאֵל שַׁוּוּ גְבַר חַרְבֵּיהּ עַל יַרְכֵּיהּ עִבַרוּ וְתוּבוּ מִתְּרַע לִתְרַע בְּמַשְׁרִיתָא וּקְטוּלוּ גְבַר יָת אָחוּהִי וּגְבַר יָת חַבְרֵיהּ וֶאֱנַשׁ יָת קָרִיבֵיהּ:", "onk_en": "He said to them, “This is what Adonoy, God of Yisrael has said, ‘Let each man put his sword on his hip and pass through from gate to gate in the camp. Let each man kill [even] his brother, each man his friend, each man his relative.", "pj": "וַאֲמַר לְהוֹן כִּדְנַן אָמַר יְיָ אֱלָהָא דְיִשְרָאֵל כָּל מַאן דְּדָבַח לְטַעֲוַת עַמְמַיָא יִתְקְטֵל בְּסַיְיפָא וּכְדוּן עִיבְרוּ וְתוּבוּ מִתְּרַע סַנְהֶדְרִין לִתְרַע בֵּי דִינָא בְּמַשְׁרִיתָא וּבְעוֹי מִן קֳדָם יְיָ דְיִשְׁתְּבֵיק לְכוֹן חוֹבָא דָא וְאִתְפְּרָעוּ מִן רַשִׁיעַיָא פַּלְחֵי פּוּלְחָנָא נוּכְרָאָה וּקְטִילוּ אֲפִלּוּ גְבַר יַת אָחוֹי וּגְבַר יַת חַבְרֵיהּ וְאֵינַשׁ יַת קָרִיבֵיהּ", "pj_en": "And he said to them, Thus hath said the Lord, the God of Israel, Whosoever hath sacrificed to the idols of the Gentiles, let him be slain with the sword. And now, go, pass through from the gate of the sanhedrin to the gate of the house of judgment, in the camp, and with prayer before the Lord that He will forgive you this sin, take vengeance upon the wicked workers of strange worship and slay, even a man his brother, and a man his companion, and a man his neighbour.", "tj": "", "tj_en": "", "rashi": "<b>כה אמר וגו'.<\/b> וְהֵיכָן אָמַר? זֹבֵחַ לָאֱלֹהִים יָחֳרָם (שמות כ\"ב) – כָּךְ שְׁנוּיָה בִּמְכִילְתָּא:<br><br><b>אחיו.<\/b> מֵאִמּוֹ וְהוּא יִשְׂרָאֵל (יומא ס\"ו):", "rashi_en": "כה אמר הי וגו׳ THUS SAITH THE LORD etc. — Where did he say so? In the command, (Exodus 22:19) “He that sacrificeth unto any god shall utterly be destroyed”. Thus is it stated in the Mechilta.<br><br>אחיו HIS BROTHER from the same mother, but from a different father, and who was therefore an ordinary Israelite and not a Levite (Yoma 66b)."}, {"ch": 32, "v": 28, "aliyah": 2, "heb": "וַיַּֽעֲשׂ֥וּ בְנֵֽי־לֵוִ֖י כִּדְבַ֣ר מֹשֶׁ֑ה וַיִּפֹּ֤ל מִן־הָעָם֙ בַּיּ֣וֹם הַה֔וּא כִּשְׁלֹ֥שֶׁת אַלְפֵ֖י אִֽישׁ׃", "onk": "וַעֲבָדוּ בְנֵי לֵוִי כְּפִתְגָּמָא דְמשֶׁה וּנְפַל מִן עַמָּא בְּיוֹמָא הַהוּא כִּתְלָתָא אַלְפִין גַּבְרָא:", "onk_en": "The sons of Leivi did as Moshe said. On that day those that fell from among the people, numbered approximately three thousand men.", "pj": "וְעָבָדוּ בְנֵי לֵוִי הֵי כְּפִתְגָמָא דְמשֶׁה וּנְפָלוּ מִן עַמָּא דַּהֲוָה סִימָן בְּאַפֵּיהוֹן בִּקְטִילַת סָיְיפָא בְּיוֹמָא הַהוּא כְּמִנְיַן תְּלָתָא אַלְפִין גַּבְרָא", "pj_en": "And the sons of Levi did according to the word of Mosheh; and of the people who had the mark in their nostrils there fell that day by the slaughter of the sword about the number of three thousand men.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 29, "aliyah": 2, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֗ה מִלְא֨וּ יֶדְכֶ֤ם הַיּוֹם֙ לַֽיהֹוָ֔ה כִּ֛י אִ֥ישׁ בִּבְנ֖וֹ וּבְאָחִ֑יו וְלָתֵ֧ת עֲלֵיכֶ֛ם הַיּ֖וֹם בְּרָכָֽה׃", "onk": "וַאֲמַר משֶׁה <b>קָרִיבוּ יֶדְכוֹן קֻרְבָּנָא<\/b> יוֹמָא דֵין <b>קֳדָם<\/b> יְיָ אֲרֵי גְּבַר בִּבְרֵיהּ וּבְאָחוּהִי וּלְאַיְתָאָה עֲלֵיכוֹן יוֹמָא דֵין בִּרְכָן:", "onk_en": "Moshe said, “Consecrate yourselves [<b>Your hands have offered a sacrifice<\/b>] today to [<b>before<\/b>] Adonoy—for each man killed [even] his son and brothers—that He may bestow a blessing upon you today.”", "pj": "וַאֲמַר משֶׁה קְרִיבוּ קוּרְבָּנֵכוֹן עַל שְׁפִיכוּת אַדְמָא דִי בִידֵיכוֹן וְיִתְכַּפֵּר לְכוֹן קֳדָם יְיָ אֲרוּם נְגַעֲתּוּן גְּבַר בִּבְרֵיהּ וּבְאָחוֹי וּלְאַיְיתָאָה עֲלֵיכוֹן יוֹמָא דֵין בִּרְכָתָא", "pj_en": "And Mosheh said, Offer your oblation for the shedding of the blood that is upon your hands, and make atonement for yourselves before the Lord, because you have smitten a man his son or his brother, and that you may bring a blessing upon you this day.", "tj": "", "tj_en": "", "rashi": "<b>מלאו ידכם.<\/b> אַתֶּם הַהוֹרְגִים אוֹתָם – בְּדָבָר זֶה תִּתְחַנְּכוּ לִהְיוֹת כֹּהֲנִים לַמָּקוֹם:<br><br><b>כי איש.<\/b> מִכֶּם יְמַלֵּא יָדוֹ <b>בבנו ובאחיו<\/b>:", "rashi_en": "מלאו ידכם CONSECRATE YOURSELVES — You who are killing them (your own relatives) will by this very act install yourselves as priests of the Omnipresent God,<br><br>כי איש FOR EVERY MAN among you will consecrate himself בבנו ובאחיו BY HIS SON AND HIS BROTHER (by their death at his hand)."}, {"ch": 32, "v": 30, "aliyah": 2, "heb": "וַֽיְהִי֙ מִֽמׇּחֳרָ֔ת וַיֹּ֤אמֶר מֹשֶׁה֙ אֶל־הָעָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְעַתָּה֙ אֶֽעֱלֶ֣ה אֶל־יְהֹוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְכֶֽם׃", "onk": "וַהֲוָה בְּיוֹמָא דְבַתְרוֹהִי וַאֲמַר משֶׁה לְעַמָּא אַתּוּן חַבְתּוּן חוֹבָא רַבָּא וּכְעַן אֶסַּק <b>קֳדָם<\/b> יְיָ מָאִים אֲכַפֵּר עַל חוֹבֵיכוֹן:", "onk_en": "The next day Moshe said to the people, “You have committed a great sin. Now I will go up to [<b>before<\/b>] Adonoy, perhaps I will gain atonement for your sin.”", "pj": "וַהֲוָה בְּיוֹמָא אָחְרִי וַאֲמַר משֶׁה לְעַמָּא אַתּוּן חַבְתּוּן חוֹבָא רַבָּא וּכְדוּן אֵיסַק וְאַצְלֵי קֳדָם יְיָ הַלְוַאי אֵיכַפֵּר עַל חוֹבֵיכוֹן", "pj_en": "And it came to pass on the day following, that Mosheh said to the people, You have sinned a great sin; but now I will go up and will pray before the Lord, if haply I may obtain forgiveness of your sin.", "tj": "", "tj_en": "", "rashi": "<b>אכפרה בעד חטאתכם.<\/b> אָשִׂים כֹּפֶר וְקִנּוּחַ וּסְתִימָה לְנֶגֶד חַטַּאתְכֶם, לְהַבְדִּיל בֵּינֵיכֶם וּבֵין הַחֵטְא:", "rashi_en": "אכפרה בעד חטאתכם [PERADVENTURE] I SHALL MAKE AN EXPIATION FOR YOUR SIN — i. e. I shall put an effacing and a wiping off and a covering in front of your sin, to serve as a barrier between you and your sin."}, {"ch": 32, "v": 31, "aliyah": 2, "heb": "וַיָּ֧שׇׁב מֹשֶׁ֛ה אֶל־יְהֹוָ֖ה וַיֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָעָ֤ם הַזֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַיַּֽעֲשׂ֥וּ לָהֶ֖ם אֱלֹהֵ֥י זָהָֽב׃", "onk": "וְתַב משֶׁה <b>לִקֳדָם<\/b> יְיָ וַאֲמָר בְּבָעוּ חַב עַמָּא הָדֵין חוֹבָא רַבָּא וַעֲבָדוּ לְהוֹן דַּחֲלַן דִּדְהָב:", "onk_en": "Moshe returned to [<b>before<\/b>] Adonoy and said, “I beseech You! This people have committed a great sin and have made a god of gold.", "pj": "וְתַב משֶׁה וְצַלִּי קֳדָם יְיָ וַאֲמַר בְּמָטוּ מִינָךְ רִבּוֹן כָּל עָלְמַיָא גְּלֵי קֳדָמָךְ חֲשׁוֹכָא הֵי כִנְהוֹרָא וּכְדוֹן חַב עַמָּא הָדֵין חוֹבָא רַבָּא וְעָבָדוּ לְהוֹן דַּחֲלָן דִּדְהַב", "pj_en": "And Mosheh returned, and prayed before the Lord, and said, I supplicate of Thee, Thou Lord of all the world, before whom the darkness is as the light! Now have this people sinned a great sin, and have made to them gods of gold;", "tj": "", "tj_en": "", "rashi": "<b>אלהי זהב.<\/b> אַתָּה הוּא שֶׁגָּרַמְתָּ לָהֶם, שֶׁהִשְׁפַּעְתָּ לָהֶם זָהָב וְכָל חֶפְצָם, מַה יַּעֲשׂוּ שֶׁלֹּא יֶחֶטְאוּ? מָשָׁל לְמֶלֶךְ שֶׁהָיָה מַאֲכִיל וּמַשְׁקֶה אֶת בְּנוֹ וּמְקַשְּׁטוֹ וְתוֹלֶה לוֹ כִּיס בְּצַוָּארוֹ וּמַעֲמִידוֹ בְּפֶתַח בֵּית זוֹנוֹת, מַה יַּעֲשֶׂה הַבֵּן שֶׁלֹּא יֶחֱטָא:", "rashi_en": "אלהי זהב GODS OF GOLD — Moses emphasized the word “gold” as some excuse for their sin: It is You who have caused them to do this, for You gave them gold in abundance and everything they wished; what else were they likely to do if not to sin? A parable: this may be compared to a king who provides his son with food and drink, attires him with beautiful garments and hangs a money-bag round his neck and then deliberately places him at the door of a house of ill-fame! What else is the son likely to do if not to sin!? (Berakhot 32a)"}, {"ch": 32, "v": 32, "aliyah": 2, "heb": "וְעַתָּ֖ה אִם־תִּשָּׂ֣א חַטָּאתָ֑ם וְאִם־אַ֕יִן מְחֵ֣נִי נָ֔א מִֽסִּפְרְךָ֖ אֲשֶׁ֥ר כָּתָֽבְתָּ׃", "onk": "וּכְעַן אִם שַׁבְקַת לְחוֹבֵיהוֹן וְאִם לָא מְחֵנִי כְעַן מִסִּפְרָךְ דִּי כְתַבְתָּא:", "onk_en": "Now if You would bear [forgive] their sin, and if not, blot me out from Your book that You have written.”", "pj": "וּכְדוֹן אִין תִּשְׁבּוֹק לְחוֹבֵיהוֹן שְׁבוֹק וְאִין לָא מְחֵינִי כְּדוֹן מִן סֵפֶר צַדִּיקַיָא דְּכָתַבְתָּא לִשְׁמִי בְּגַוֵּיהּ", "pj_en": "but now, if Thou wilt forgive their sin, forgive; but if not, blot me, I pray, from the book of the just, in the midst of which Thou hast written my name.", "tj": "", "tj_en": "", "rashi": "<b>ועתה אם תשא חטאתם.<\/b> הֲרֵי טוֹב – אֵינִי אוֹמֵר לְךָ מְחֵנִי, וְאִם אַיִן מְחֵנִי; וְזֶה מִקְרָא קָצָר, וְכֵן הַרְבֵּה:<br><br><b>מספרך.<\/b> מִכָּל הַתּוֹרָה כֻּלָּהּ, שֶׁלֹּא יֹאמְרוּ עָלַי שֶׁלֹּא הָיִיתִי כְדַאי לְבַקֵּשׁ עֲלֵיהֶם רַחֲמִים:", "rashi_en": "ועתה אם תשא חטאתם YET NOW, IF THOU WILT FORGIVE THEIR SIN — well and good: then I do not suggest to You, “Blot me out [of Thy book], ואם אין מחני BUT IF NOT, BLOT ME OUT.” This is an elliptical sentence, the words “Well and good” being omitted; of such there are many in Scripture.<br><br>מספרך OF THY BOOK — of the entire book of the Torah; that people should not say about me that I was not worthy enough to pray effectively for them."}, {"ch": 32, "v": 33, "aliyah": 2, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֑ה מִ֚י אֲשֶׁ֣ר חָֽטָא־לִ֔י אֶמְחֶ֖נּוּ מִסִּפְרִֽי׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה מָן דִּי חַב <b>קֳדָמַי<\/b> אֶמְחִנֵּיהּ מִסִפְרִי:", "onk_en": "Adonoy said to Moshe, “Those who have sinned against [<b>before<\/b>] Me, I will blot out from My book.", "pj": "וַאֲמַר יְיָ לְמשֶׁה לָא חֲמֵי לְמִימְחֵי שְׁמָךְ אֱלָהֵן מַאן דְּחַב קֳדָמַי אַמְחִינֵיהּ מִסִּפְרִי", "pj_en": "And the Lord said to Mosheh, It is not right that I should blot out thy name; but whosoever sinneth before Me, him will I blot from My book.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 34, "aliyah": 2, "heb": "וְעַתָּ֞ה לֵ֣ךְ&thinsp;<b>׀<\/b> נְחֵ֣ה אֶת־הָעָ֗ם אֶ֤ל אֲשֶׁר־דִּבַּ֙רְתִּי֙ לָ֔ךְ הִנֵּ֥ה מַלְאָכִ֖י יֵלֵ֣ךְ לְפָנֶ֑יךָ וּבְי֣וֹם פׇּקְדִ֔י וּפָקַדְתִּ֥י עֲלֵהֶ֖ם חַטָּאתָֽם׃", "onk": "וּכְעַן אִזֵּיל דַּבַּר יָת עַמָּא לַאֲתַר דִּי מַלֵּלִית לָךְ הָא מַלְאָכִי יְהַךְ קֳדָמָךְ וּבְיוֹם אַסְעָרוּתִי וְאַסְעַר עֲלֵיהוֹן חוֹבֵיהוֹן:", "onk_en": "And now, go, lead the people to [the place] of which I have spoken to you. Behold, My angel will go before you. However on the day when I take account of them, I will take their sin into account.", "pj": "וּכְדוּן אִיזֵיל דְּבַר יַת עַמָּא לַאֲתַר דְּמַלֵּילִית לָךְ הָא מַלְאָכִי יְטַיֵּיל קֳדָמָךְ וּבְיוֹם אַסְעָרוּתִי וְאַסְעַר עֲלֵיהוֹן חוֹבֵיהוֹן", "pj_en": "But now, go lead the people to the place of which I have told thee; behold, My angel shall proceed before thee; but in the day of My visitation I will visit upon them their sin.", "tj": "", "tj_en": "", "rashi": "<b>אל אשר דברתי לך.<\/b> יֵשׁ כָּאן לָךְ אֵצֶל דִּבּוּר בִּמְקוֹם אֵלֶיךָ, וְכֵן לְדַבֶּר לוֹ עַל אֲדֹנִיָּהוּ (מלכים א ב׳:י״ט):<br><br><b>הנה מלאכי.<\/b> וְלֹא אֲנִי:<br><br><b>וביום פקדי וגו'.<\/b> עַתָּה שָׁמַעְתִּי אֵלֶיךָ מִלְּכַלּוֹתָם יַחַד, וְתָמִיד תָּמִיד כְּשֶׁאֶפְקֹד עֲלֵיהֶם עֲוֹנוֹתֵיהֶם וּפָקַדְתִּי עֲלֵיהֶם מְעַט מִן הֶעָוֹן הַזֶּה עִם שְׁאָר הָעֲוֹנוֹת; וְאֵין פֻּרְעָנוּת בָּאָה עַל יִשְׂרָאֵל שֶׁאֵין בָּהּ קְצָת מִפִּרְעוֹן עֲוֹן הָעֵגֶל (סנהדרין ק\"ב):", "rashi_en": "אל אשר דברתי לך OF WHICH I HAVE SPOKEN UNTO THEE — Here we have an instance of לך connected with the verb דבר being used in place of אליך (i. e. where לך actually means speaking to, not as its usual meaning it, speaking “concerning” someone or “in the interest of” someone as often pointed out by Rashi; cf. e. g., Rashi’s comment on Genesis 28:15). Similar is, (1 Kings 2:19) “to speak unto him (לדבר לו) for Adonijah” (cf. Rashi on that verse).<br><br>הנה מלאכי BEHOLD, MINE ANGEL [SHALL GO BEFORE THEE] — My messenger, not Myself.<br><br>וביום פקדי וגו׳ AND IN THE DAY WHEN I VISIT [I WILL VISIT THEIR SIN UPON THEM] — At present I listen to you and will refrain from consuming them all at once — but ever and ever throughout the ages, when I am visiting them for their sins I shall visit them at the same time for a little of this sin in addition to their other sins for which I am then punishing them. Indeed no punishment ever comes upon Israel in which there is not part payment for the sin of the golden calf (cf. Sanhedrin 102a)."}, {"ch": 32, "v": 35, "aliyah": 2, "heb": "וַיִּגֹּ֥ף יְהֹוָ֖ה אֶת־הָעָ֑ם עַ֚ל אֲשֶׁ֣ר עָשׂ֣וּ אֶת־הָעֵ֔גֶל אֲשֶׁ֥ר עָשָׂ֖ה אַהֲרֹֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּמְחָא יְיָ יָת עַמָּא עַל דִּי אִשְׁתַּעְבָּדוּ לְעֶגְלָא דִּי עֲבַד אַהֲרֹן:", "onk_en": "Adonoy then struck the people with a plague because they had made [worshiped] the calf that Aharon made.", "pj": "וַחֲבַל מֵימְרָא דַיְיָ יַת עַמָּא עַל דְּגָחְנָן לְעִגְלָא דְעָבַד אַהֲרן", "pj_en": "And the Word of the Lord plagued the people, because they had bowed themselves to the calf that Aharon had made.", "tj": "", "tj_en": "", "rashi": "<b>ויגף ה' את העם.<\/b> מִיתָה בִידֵי שָׁמַיִם לְעֵדִים בְּלֹא הַתְרָאָה:", "rashi_en": "ויגף ה' את העם AND THE LORD PLAGUED THE PEOPLE — This was death inflicted by the heavenly Judge on those to whose offence there had been witnesses but no legal caution (cf. Rashi on v. 20)."}, {"ch": 33, "v": 1, "aliyah": 2, "heb": "וַיְדַבֵּ֨ר יְהֹוָ֤ה אֶל
