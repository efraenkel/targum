ו וּשְׁתֵּ֣י טַבָּעֹ֗ת עַל־צַלְעוֹ֙ הָֽאֶחָ֔ת וּשְׁתֵּי֙ טַבָּעֹ֔ת עַל־צַלְע֖וֹ הַשֵּׁנִֽית׃", "onk": "וְאַתִּיךְ לֵיהּ אַרְבַּע עִזְקַן דִּדְהַב עַל אַרְבַּע זִוְיָתֵיהּ וְתַרְתֵּין עִזְקַן עַל סִטְרֵיהּ חַד וְתַרְתֵּין עִזְקַן עַל סִטְרֵיהּ תִּנְיֵתָא:", "onk_en": "He cast four gold rings on its (the ark’s) four corners, two rings on one side and two rings on the other side.", "pj": "וְאַתִּיךְ לֵיהּ אַרְבַּע עִזְקַן דִּדְהַב עַל אַרְבַּע אִסְתַּוָורוֹי וְתַרְתֵּין עִזְקַן עַל סִטְרֵיהּ חָד וְתַרְתֵּין עִזְקַן עַל סִטְרֵיהּ תִּנְיָינָא", "pj_en": "And he cast for it four golden rings upon its four corners; two rings upon one side of it, and two rings upon its second side.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 4, "aliyah": 5, "heb": "וַיַּ֥עַשׂ בַּדֵּ֖י עֲצֵ֣י שִׁטִּ֑ים וַיְצַ֥ף אֹתָ֖ם זָהָֽב׃", "onk": "וַעֲבַד אֲרִיחֵי דְּאָעֵי שִׁטִּין וַחֲפָא יָתְהוֹן דַּהֲבָא:", "onk_en": "He made two poles of acacia wood, and overlaid them with gold.", "pj": "וְעָבַד אֲרִיחֵי דְקִיסָא שִׁיטָא וַחֲפָא יַתְהוֹן דַּהֲבָא", "pj_en": "And he made the staves of it of sitta wood, and covered them with gold,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 5, "aliyah": 5, "heb": "וַיָּבֵ֤א אֶת־הַבַּדִּים֙ בַּטַּבָּעֹ֔ת עַ֖ל צַלְעֹ֣ת הָאָרֹ֑ן לָשֵׂ֖את אֶת־הָאָרֹֽן׃", "onk": "וְאָעֵל יָת אֲרִיחַיָּא בְּעִזְקָתָא עַל סִטְרֵי אֲרוֹנָא לְמִטַּל יָת אֲרוֹנָא:", "onk_en": "He placed the poles in the rings on the sides of the ark, so that the ark can be carried with them.", "pj": "וְאָעֵיל יַת אֲרִיחַיָא בְּעִזְקָתָא עַל סִטְרָא דַאֲרוֹנָא לְמֵיטַל יַת אֲרוֹנָא", "pj_en": "and put the staves into the rings upon the sides of the ark, to carry the ark.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 6, "aliyah": 5, "heb": "וַיַּ֥עַשׂ כַּפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָחֵ֙צִי֙ אׇרְכָּ֔הּ וְאַמָּ֥ה וָחֵ֖צִי רׇחְבָּֽהּ׃", "onk": "וַעֲבַד כַּפֻּרְתָּא דְּהַב דְּכֵי תַּרְתֵּין אַמִּין וּפַלְגָּא אֻרְכַּהּ וְאַמְּתָא וּפַלְגָּא פְּתָיַהּ:", "onk_en": "He made a cover (for the ark) of pure gold, two and one-half amohs long, and one and one-half amohs wide.", "pj": "וְעָבַד כַּפּוּרְתָּא דִדְהַב דְּכֵי תַּרְתֵּין אַמִּין וּפַלְגָא אוּרְכָּא וְאַמְתָא וּפַלְגָא פּוּתְיָא בְּרַם סוּמְכָא הֲוַת פּוּשְׁכָא", "pj_en": "And he made the MERCY SEAT of pure gold; two cubits and a half the length, and a cubit and half its breadth; but its thickness was a span.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 7, "aliyah": 5, "heb": "וַיַּ֛עַשׂ שְׁנֵ֥י כְרֻבִ֖ים זָהָ֑ב מִקְשָׁה֙ עָשָׂ֣ה אֹתָ֔ם מִשְּׁנֵ֖י קְצ֥וֹת הַכַּפֹּֽרֶת׃", "onk": "וַעֲבַד תְּרֵין כְּרוּבִין דִּדְהָב נְגִיד עֲבַד יָתְהוֹן מִתְּרֵין סִטְרֵי כַפֻּרְתָּא:", "onk_en": "He made two golden Cherubim. He hammered them out of the two ends of the (ark) cover.", "pj": "וְעָבַד תְּרֵין כְּרוּבִין דִּדְהַב דְּכֵי נְגִיד עָבַד יַתְהוֹן מִתְּרֵין סִטְרֵי כַּפּוּרְתָּא", "pj_en": "And he made two kerubin of pure gold, beaten made be them, on the two sides of the mercy seat.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 8, "aliyah": 5, "heb": "כְּרוּב־אֶחָ֤ד מִקָּצָה֙ מִזֶּ֔ה וּכְרוּב־אֶחָ֥ד מִקָּצָ֖ה מִזֶּ֑ה מִן־הַכַּפֹּ֛רֶת עָשָׂ֥ה אֶת־הַכְּרֻבִ֖ים מִשְּׁנֵ֥י <span class=\"mam-kq\"><span class=\"mam-kq-k\">(קצוותו)<\/span> <span class=\"mam-kq-q\">[קְצוֹתָֽיו]<\/span><\/span>׃", "onk": "כְּרוּבָא חַד <b>מִסִּטְרָא<\/b> מִכָּא וּכְרוּבָא חַד <b>מִסִּטְרָא<\/b> מִכָּא מִן כַּפֻּרְתָּא עֲבַד יָת כְּרוּבַיָּא מִתְּרֵין <b>סִטְרוֹהִי<\/b>:", "onk_en": "One Cherub out of one end [<b>side<\/b>], and one Cherub out of the other end [<b>side<\/b>]. From the (same piece of gold as the) cover itself, he made the Cherubim on its two ends [<b>sides<\/b>].", "pj": "כְּרוּבָא חָד מִסִטְרָא מִכָּא וּכְרוּבָא חָד מִסִטְרָא מִכָּא נְגִידִין וְאַדִּיקִין הֲווֹן כְּרוּבַיָא וְלָא מִתְפַּרְשִׁין מִן כַּפּוּרְתָּא אֲרוּם בְּחוּכְמַת רוּחַ נְבוּאָה עָבַד יַת כְּרוּבַיָא מִתְּרֵין סִטְרוֹי", "pj_en": "One keruba on this side, and one keruba on that side, of beaten work; and the kerubin were face to face. They were not separated from the mercy seat; but by the wisdom of the Spirit of prophecy, he made the kerubin on its two sides.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 9, "aliyah": 5, "heb": "וַיִּהְי֣וּ הַכְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְמַ֗עְלָה סֹֽכְכִ֤ים בְּכַנְפֵיהֶם֙ עַל־הַכַּפֹּ֔רֶת וּפְנֵיהֶ֖ם אִ֣ישׁ אֶל־אָחִ֑יו אֶ֨ל־הַכַּפֹּ֔רֶת הָי֖וּ פְּנֵ֥י הַכְּרֻבִֽים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲווֹ כְרוּבַיָּא פְּרִיסָן גַּדְפֵיהוֹן לְעֵלָּא נָטְלִין בְּגַדְפֵיהוֹן עַל כַּפֻּרְתָּא וְאַפֵּיהוֹן חַד לָקֳבֵל חַד לָקֳבֵל כַּפֻּרְתָּא הֲווֹ אַפֵּי כְרוּבַיָּא:", "onk_en": "The Cherubim had their wings spread upward, sheltering the cover with their wings, and they faced one another, the Cherubim’s faces were (inclined) toward the cover.", "pj": "וַהֲווֹן כְּרוּבַיָא פְּרִיסִין גַּדְפֵיהוֹן בַּהֲדֵי רֵישֵׁיהוֹן לְעֵילָא מְטַלְלִין בְּגַדְפֵיהוֹן עַל כַּפּוּרְתָּא וְאַפֵּיהוֹן חַד לִקְבֵיל חָד כָּל קֳבֵיל כַּפּוּרְתָּא הֲווֹן אַנְפֵּי כְּרוּבַיָא", "pj_en": "And the kerubaia spread forth their wings, with their heads upward, overshadowing the mercy seat with their wings, and their faces were toward each other, over against the mercy seat were the faces of the kerubaia.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 10, "aliyah": 5, "heb": "וַיַּ֥עַשׂ אֶת־הַשֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אׇרְכּוֹ֙ וְאַמָּ֣ה רׇחְבּ֔וֹ וְאַמָּ֥ה וָחֵ֖צִי קֹמָתֽוֹ׃", "onk": "וַעֲבַד יָת פָּתוֹרָא דְּאָעֵי שִׁטִּין תַּרְתֵּין אַמִּין אֻרְכֵּיהּ וְאַמְּתָא פְתָיֵהּ וְאַמְּתָא וּפַלְגָּא רוּמֵיהּ:", "onk_en": "He made a table out of acacia wood, two amohs long, one amoh wide, and one and one-half amohs high.", "pj": "וְעָבַד יַת פָּתוֹרָא דְקִיסֵי שִׁיטָא תַּרְתֵּין אַמִּין אוּרְכֵּיהּ וְאַמְתָא פּוּתְיֵהּ וְאַמְתָא וּפַלְגָא רוּמֵיהּ", "pj_en": "And he made the TABLE of sitta wood, two cubits its length, and a cubit its breadth, and a cubit and half its height.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 11, "aliyah": 5, "heb": "וַיְצַ֥ף אֹת֖וֹ זָהָ֣ב טָה֑וֹר וַיַּ֥עַשׂ ל֛וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃", "onk": "וַחֲפָא יָתֵיהּ דְּהַב דְּכֵי וַעֲבַד לֵיהּ דֵּיר דִּדְהַב סְחוֹר סְחוֹר:", "onk_en": "He overlaid it with pure gold, and he made a crown-like rim around it.", "pj": "וַחֲפָא יָתֵיהּ דְּהַב דְּכֵי וְעָבַד לֵיהּ דֵּיר דִּדְהַב חֲזוֹר חֲזוֹר", "pj_en": "And he covered it with pure gold, and made for it a golden crown round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 12, "aliyah": 5, "heb": "וַיַּ֨עַשׂ ל֥וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וַיַּ֧עַשׂ זֵר־זָהָ֛ב לְמִסְגַּרְתּ֖וֹ סָבִֽיב׃", "onk": "וַעֲבַד לֵיהּ גְּדַנְפָא <b>רוּמֵיהּ<\/b> פּוּשְׁכָא סְחוֹר סְחוֹר וַעֲבַד דֵּיר דִּדְהַב לִגְדַנְפֵיהּ סְחוֹר סְחוֹר:", "onk_en": "He made a ledge of a tefach [<b>high<\/b>] around (the table), and he made a gold crown-like rim around the ledge.", "pj": "וְעָבַד לֵיהּ גִּפּוּף רוּמֵיהּ פּוּשְׁכָא חֲזוֹר חֲזוֹר וְעָבַד דֵּיר דִּדְהַב לְגַפוּפֵיהּ חֲזוֹר חֲזוֹר", "pj_en": "And he made a border for it, its height a span round about. And he made a crown of gold for the border round about.", "tj": "גִּיפוּף פְּשַׁךְ חֲזַר וּמַקַּף וְעָבֵיד כְּלִיל דִּדְהַב לְגַפּוּפָא חֲזוֹר וּמַקַּף:", "tj_en": "A border, a span around, and he made a coronal of gold for the surrounding border.", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 13, "aliyah": 5, "heb": "וַיִּצֹ֣ק ל֔וֹ אַרְבַּ֖ע טַבְּעֹ֣ת זָהָ֑ב וַיִּתֵּן֙ אֶת־הַטַּבָּעֹ֔ת עַ֚ל אַרְבַּ֣ע הַפֵּאֹ֔ת אֲשֶׁ֖ר לְאַרְבַּ֥ע רַגְלָֽיו׃", "onk": "וְאַתִּיךְ לֵיהּ אַרְבַּע עִזְקַן דִּדְהַב וִיהַב יָת עִזְקָתָא עַל אַרְבַּע זִוְיָתָא דִּי לְאַרְבַּע רַגְלוֹהִי:", "onk_en": "He cast for it (the table) four gold rings, and placed the rings on the four corners that are on its four legs.", "pj": "וְאַתִּיךְ לֵיהּ אַרְבַּע עִזְקַן דִּדְהַב וִיהַב יַת עִזְקָתָא עַל אַרְבַּע זִוְיָתָא דִלְאַרְבַּע רִגְלוֹי", "pj_en": "And he cast for it four golden rings, and set the rings upon the four corners of its four feet.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 14, "aliyah": 5, "heb": "לְעֻמַּת֙ הַמִּסְגֶּ֔רֶת הָי֖וּ הַטַּבָּעֹ֑ת בָּתִּים֙ לַבַּדִּ֔ים לָשֵׂ֖את אֶת־הַשֻּׁלְחָֽן׃", "onk": "לָקֳבֵל גְּדַנְפָא הֲווֹ עִזְקָתָא אַתְרָא לַאֲרִיחַיָּא לְמִטַּל יָת פָּתוֹרָא:", "onk_en": "The rings were against the ledge as houses (receptacles) for the poles with which to carry the table.", "pj": "כָּל קְבֵיל גִּפּוֹף הֲוָאָה עִזְקָתָא אַתְרָא לַאֲרִיחַיָא לְמֵיטַל יַת פָּתוֹרָא", "pj_en": "Over agaagainst the border were the rings, the place for the staves in carrying the table.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 15, "aliyah": 5, "heb": "וַיַּ֤עַשׂ אֶת־הַבַּדִּים֙ עֲצֵ֣י שִׁטִּ֔ים וַיְצַ֥ף אֹתָ֖ם זָהָ֑ב לָשֵׂ֖את אֶת־הַשֻּׁלְחָֽן׃", "onk": "וַעֲבַד יָת אֲרִיחַיָּא דְּאָעֵי שִׁטִּין וַחֲפָא יָתְהוֹן דַּהֲבָא לְמִטַּל יָת פָּתוֹרָא:", "onk_en": "He made the poles out of acacia wood, and overlaid them with gold with which to carry the table.", "pj": "וַעֲבַד יַת אֲרִיחַיָא דְקִיסֵי שִׁיטָא וַחֲפָא יַתְהוֹן דַּהֲבָא לְמֵיטַל יַת פָּתוֹרָא", "pj_en": "And he made the staves of sitta wood, and covered them with gold, for carrying the table.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 16, "aliyah": 5, "heb": "וַיַּ֜עַשׂ אֶֽת־הַכֵּלִ֣ים&thinsp;<b>׀<\/b> אֲשֶׁ֣ר עַל־הַשֻּׁלְחָ֗ן אֶת־קְעָרֹתָ֤יו וְאֶת־כַּפֹּתָיו֙ וְאֵת֙ מְנַקִּיֹּתָ֔יו וְאֶ֨ת־הַקְּשָׂוֺ֔ת אֲשֶׁ֥ר יֻסַּ֖ךְ בָּהֵ֑ן זָהָ֖ב טָהֽוֹר׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲבַד יָת מָנַיָּא דִּי עַל פָּתוֹרָא יָת מָגִיסוֹהִי וְיָת בָּזִיכוֹהִי וְיָת מְכִילָתֵיהּ וְיָת קַשְׂוָתָא דִּי יִתְנַסַּךְ בְּהוֹן דְּהַב דְּכֵי:", "onk_en": "He made the vessels that were on the table, its dishes (bread shapes), its spoons (incense bowls), its supports, and its half-hollow tubes by which they (the breads) are covered, out of pure gold.", "pj": "וַעֲבַד יַת מָנַיָא דְעַל פָּתוֹרָא יַת פְּיַלְוָותֵיהּ וְיַת בָּזִיכוֹי וְיַת מְכִילָתֵיהּ וְיַת קַסְוָותָא דִמְחַפְיַין בְּהוֹן דִּדְהַב דְּכֵי", "pj_en": "And he made the vessels to be upon the table, its dishes, and its bowls, and its measures, and its cups for the lavings of pure gold.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 17, "aliyah": 6, "heb": "וַיַּ֥עַשׂ אֶת־הַמְּנֹרָ֖ה זָהָ֣ב טָה֑וֹר מִקְשָׁ֞ה עָשָׂ֤ה אֶת־הַמְּנֹרָה֙ יְרֵכָ֣הּ וְקָנָ֔הּ גְּבִיעֶ֛יהָ כַּפְתֹּרֶ֥יהָ וּפְרָחֶ֖יהָ מִמֶּ֥נָּה הָיֽוּ׃", "onk": "וַעֲבַד יָת מְנַרְתָּא דְּהַב דְּכֵי נְגִיד עֲבַד יָת מְנַרְתָּא שִׁידַהּ וּקְנַהּ כַּלִידָהָא חֵזוּרָהָא וְשׁוֹשַׁנָּהָא מִנַּהּ הֲווֹ:", "onk_en": "He made the menorah (out) of pure gold. The menorah was made by hammering (its form out of a solid piece of gold). Its base, its shaft, its cups, its knobs, and its flowers were of it (the same piece of gold).", "pj": "וַעֲבַד יַת מְנַרְתָּא דִּדְהַב דְּכֵי נְגִיד עֲבַד יַת מְנַרְתָּא בָּסִיס דִּידָהּ וּקְנָהָא כַּלִידָהָא חֲזוֹרְיָיהָא וְשׁוֹשַׁנְהָא מִינָהּ הֲווֹן", "pj_en": "And he made the CANDELABRUM of pure gold, beaten made he the candelabrum; its base and its shaft, its cups, its apples, and its lilies were of the same.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 18, "aliyah": 6, "heb": "וְשִׁשָּׁ֣ה קָנִ֔ים יֹצְאִ֖ים מִצִּדֶּ֑יהָ שְׁלֹשָׁ֣ה&thinsp;<b>׀<\/b> קְנֵ֣י מְנֹרָ֗ה מִצִּדָּהּ֙ הָֽאֶחָ֔ד וּשְׁלֹשָׁה֙ קְנֵ֣י מְנֹרָ֔ה מִצִּדָּ֖הּ הַשֵּׁנִֽי׃", "onk": "וְשִׁתָּא קְנִין נָפְקִין מִסִּטְרָהָא תְּלָתָא קְנֵי מְנַרְתָּא מִסִּטְרַהּ חַד וּתְלָתָא קְנֵי מְנַרְתָּא מִסִּטְרַהּ תִּנְיָנָא:", "onk_en": "Six branches extended from its sides, three branches of the menorah from one of its sides, and three branches of the menorah from the second side.", "pj": "וְשִׁתָּא קְנִין נַפְקִין מִסִטְרָהָא תְּלָתָא קְנֵי מְנַרְתָּא מִסִּטְרָא חָד וּתְלָתָא קְנֵי מְנַרְתָּא מִסִּטְרָא תִּנְיָנָא", "pj_en": "And six branches came forth from its sides; three branches of the candelabrum on one side, and three branches of the candelabrum on the second side.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 19, "aliyah": 6, "heb": "שְׁלֹשָׁ֣ה גְ֠בִעִ֠ים מְֽשֻׁקָּדִ֞ים בַּקָּנֶ֣ה הָאֶחָד֮ כַּפְתֹּ֣ר וָפֶ֒רַח֒ וּשְׁלֹשָׁ֣ה גְבִעִ֗ים מְשֻׁקָּדִ֛ים בְּקָנֶ֥ה אֶחָ֖ד כַּפְתֹּ֣ר וָפָ֑רַח כֵּ֚ן לְשֵׁ֣שֶׁת הַקָּנִ֔ים הַיֹּצְאִ֖ים מִן־הַמְּנֹרָֽה׃", "onk": "תְּלָתָא כַלִּידִין מְצַיְּרִין בְּקַנְיָא חַד חֵזוּר וְשׁוֹשַׁן וּתְלָתָא כַלִּידִין מְצַיְּרִין בְּקַנְיָא חַד חֵזוּר וְשׁוֹשָׁן כֵּן לְשִׁתָּא קְנִין דְּנָפְקִין מִן מְנַרְתָּא:", "onk_en": "Three cups were engraved in almond-shaped patterns, on one branch with a knob and a flower, and three cups were engraved in almond-shaped patterns, on one branch with a knob and a flower. So was (the form) of each of the six branches that extended from (the shaft) of the menorah.", "pj": "תְּלָתָא כַּלִידִין מְשַׁקְעִין בְּצִיּוֹרֵיהֶן בְּקַנְיָא חָד חֲזוֹר וְשׁוֹשַׁן וּתְלָתָא כַּלִידִין מְשַׁקְעִין בְּצִיּוֹרֵיהֶן בְּקַנְיָא חָד חֲזוֹר וְשׁוֹשַׁן הֵיכְדֵין לְשִׁתָּא קְנִין דְּנַפְקִין מִן מְנַרְתָּא", "pj_en": "Three embossed cups with their figurations on one branch, with the apple and lily, and three embossed cups with their figurations on the other branch, with the apple and lily; so the six branches which proceeded from the candelabrum.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 20, "aliyah": 6, "heb": "וּבַמְּנֹרָ֖ה אַרְבָּעָ֣ה גְבִעִ֑ים מְשֻׁ֨קָּדִ֔ים כַּפְתֹּרֶ֖יהָ וּפְרָחֶֽיהָ׃", "onk": "וּבִמְנַרְתָּא אַרְבְּעָא כַלִּידִין מְצַיְּרִין חֵזּוּרָהָא וְשׁוֹשַׁנָּהָא:", "onk_en": "The (shaft of the) menorah had four cups, engraved in almond shaped patterns, with their knobs and their flowers.", "pj": "וּבִמְנַרְתָּא אַרְבָּעָא כַּלִידִין מְשַׁקְעִין בְּצִיּוּרֵיהֶן חִיזוּרָהָא וְשׁוֹשַׁנָהָא", "pj_en": "And upon the candelabrum, four embossed cups with their figurations of apples and lilies.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 21, "aliyah": 6, "heb": "וְכַפְתֹּ֡ר תַּ֩חַת֩ שְׁנֵ֨י הַקָּנִ֜ים מִמֶּ֗נָּה וְכַפְתֹּר֙ תַּ֣חַת שְׁנֵ֤י הַקָּנִים֙ מִמֶּ֔נָּה וְכַפְתֹּ֕ר תַּֽחַת־שְׁנֵ֥י הַקָּנִ֖ים מִמֶּ֑נָּה לְשֵׁ֙שֶׁת֙ הַקָּנִ֔ים הַיֹּצְאִ֖ים מִמֶּֽנָּה׃", "onk": "וְחֵזוּר תְּחוֹת תְּרֵין קְנִין מִנַּהּ וְחֵזוּר תְּחוֹת תְּרֵין קְנִין מִנַּהּ וְחֵזוּר תְּחוֹת תְּרֵין קְנִין מִנַּהּ לְשִׁתָּא קְנִין דְּנָפְקִין מִנַּהּ:", "onk_en": "There was a knob under the two branches extending from it, and a (second) knob under the (second) two branches extending from it, and a (third) knob under the (third) two branches extending from it. (This held true) for the six branches that extended from it (the menorah’s shaft).", "pj": "וְחֵיזוּר תְּחוֹת תְּרֵין קְנִין דְּמִינָהּ וְחֵיזוּר תְּחוֹת תְּרֵין קְנִין דְּמִינָהּ וְחֵיזוּר תְּחוֹת תְּרֵין קְנִין דְּמִינָהּ לְשִׁתָּא קְנִין דְּנַפְקִין מִינָהּ", "pj_en": "And an apple (was) under two branches of the same, and an apple under two branches of the same, and an apple under two branches of the same, for the six branches that proceeded from it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 22, "aliyah": 6, "heb": "כַּפְתֹּרֵיהֶ֥ם וּקְנֹתָ֖ם מִמֶּ֣נָּה הָי֑וּ כֻּלָּ֛הּ מִקְשָׁ֥ה אַחַ֖ת זָהָ֥ב טָהֽוֹר׃", "onk": "חֵזוּרֵיהוֹן וּקְנֵיהוֹן מִנַּהּ הֲווֹ כֻּלַהּ נְגִידָא חֲדָא דְּהַב דְּכֵי:", "onk_en": "Their knobs and their branches were made out of (the menorah) itself. It was all made of a single hammered work of pure gold.", "pj": "חִיזוּרֵיהוֹן וּקְנֵיהוֹן מִינָהּ הֲווֹ כּוּלָה נְגִידָא חֲדָא דִדְהַב דְּכֵי", "pj_en": "Their apples and their branches were of the same, all of it one beaten work of pure gold:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 23, "aliyah": 6, "heb": "וַיַּ֥עַשׂ אֶת־נֵרֹתֶ֖יהָ שִׁבְעָ֑ה וּמַלְקָחֶ֥יהָ וּמַחְתֹּתֶ֖יהָ זָהָ֥ב טָהֽוֹר׃", "onk": "וַעֲבַד יָת בּוֹצִינָהָא שִׁבְעָא וְצִבְיְתָהָא וּמַחִתְּיְתָהָא דְּהַב דְּכֵי:", "onk_en": "He made seven lamps (for the menorah), and its tongs and its (ash) scoops, of pure gold.", "pj": "וַעֲבַד יַת בּוֹצִינָהָא שַׁבְעָא וּמַלְקְטְיָיהָא וּמַחְתְּיָיהָא דִדְהַב דְּכֵי", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 24, "aliyah": 6, "heb": "כִּכָּ֛ר זָהָ֥ב טָה֖וֹר עָשָׂ֣ה אֹתָ֑הּ וְאֵ֖ת כׇּל־כֵּלֶֽיהָ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "כִּכְּרָא דְּהַב דְּכֵי עֲבַד יָתַהּ וְיָת כָּל מָנָהָא:", "onk_en": "He made it out of a kikar of pure gold, together with all its vessels.", "pj": "קַנְטִינָר דִּדְהַב דְּכֵי עָבַד יָתָהּ וְיַת כָּל מָנָהָא", "pj_en": "of a talent of pure gold made he it, and all its vessels.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 25, "aliyah": 6, "heb": "וַיַּ֛עַשׂ אֶת־מִזְבַּ֥ח הַקְּטֹ֖רֶת עֲצֵ֣י שִׁטִּ֑ים אַמָּ֣ה אׇרְכּוֹ֩ וְאַמָּ֨ה רׇחְבּ֜וֹ רָב֗וּעַ וְאַמָּתַ֙יִם֙ קֹֽמָת֔וֹ מִמֶּ֖נּוּ הָי֥וּ קַרְנֹתָֽיו׃", "onk": "וַעֲבַד יָת מַדְבְּחָא דִקְטֹרֶת <b>בּוּסְמַיָּא<\/b> דְאָעֵי שִׁטִּין אַמְּתָא אֻרְכֵּיהּ וְאַמְּתָא פְתָיֵהּ מְרַבַּע וְתַרְתֵּין אַמִּין רוּמֵיהּ מִנֵּיהּ הֲווֹ קַרְנוֹהִי:", "onk_en": "He made the [<b>spice<\/b>] incense altar out of acacia wood, one amoh long and one amoh wide, it was square, and two amohs high. Its horn-like elevations were of one piece with it.", "pj": "וַעֲבַד יַת מַדְבְּחָא דִקְטוֹרֶת בּוּסְמַיָא מִן קִיסֵי שִׁיטָא אַמְתָא אוּרְכֵּיהּ וְאַמְתָא פּוּתְיֵיהּ מְרַבַּע וְתַרְתֵּין אַמִּין רוּמֵיהּ מִינֵיהּ הֲווֹן קַרְנוֹי זְקִיפִין", "pj_en": "And he made the ALTAR OF SWEET INCENSE of sitta wood, a cubit its length, and a cubit its breadth, foursquare, and two cubits was its height; its two upright horns were of the same.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 26, "aliyah": 6, "heb": "וַיְצַ֨ף אֹת֜וֹ זָהָ֣ב טָה֗וֹר אֶת־גַּגּ֧וֹ וְאֶת־קִירֹתָ֛יו סָבִ֖יב וְאֶת־קַרְנֹתָ֑יו וַיַּ֥עַשׂ ל֛וֹ זֵ֥ר זָהָ֖ב סָבִֽיב׃", "onk": "וַחֲפָא יָתֵיהּ דְּהַב דְּכֵי יָת אִגָּרֵיהּ וְיָת כָּתְלוֹהִי סְחוֹר סְחוֹר וְיָת קַרְנוֹהִי וַעֲבַד לֵיהּ דֵּיר דִּדְהַב סְחוֹר סְחוֹר:", "onk_en": "He overlaid it with pure gold, on its top, its walls all around, and its horn-like elevations. He made a gold crown-like rim all around it.", "pj": "וַחֲפָא יָתֵיהּ דְּהַב דְּכֵי יַת אִיגְרֵיהּ וְיַת כּוֹתְלוֹי חֲזוֹר חֲזוֹר וְיַת קַרְנוֹי וְעָבַד לֵיהּ דֵּיר דִּדְהַב חֲזוֹר חֲזוֹר", "pj_en": "And he overlaid it with pure gold, its top and its sides round about, and its horns; and he made for it a golden crown round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 27, "aliyah": 6, "heb": "וּשְׁתֵּי֩ טַבְּעֹ֨ת זָהָ֜ב עָֽשָׂה־ל֣וֹ&thinsp;<b>׀<\/b> מִתַּ֣חַת לְזֵר֗וֹ עַ֚ל שְׁתֵּ֣י צַלְעֹתָ֔יו עַ֖ל שְׁנֵ֣י צִדָּ֑יו לְבָתִּ֣ים לְבַדִּ֔ים לָשֵׂ֥את אֹת֖וֹ בָּהֶֽם׃", "onk": "וְתַרְתֵּין עִזְקַן דִּדְהַב עֲבַד לֵיהּ מִלְּרַע לְדֵירֵיהּ עַל תַּרְתֵּין זִוְיָתֵיהּ עַל תְּרֵין סִטְרוֹהִי לְאַתְרָא לַאֲרִיחַיָּא לְמִטַּל יָתֵיהּ בְּהוֹן:", "onk_en": "He made two gold rings for it under its crown-like rim on two of its corners, on its two opposite sides, to house the poles with which to carry it.", "pj": "וְתַרְתֵּין עִזְקַן דִּדְהַב עָבַד לֵיהּ מִלְרַע לְדֵירֵיהּ עַל תְּרֵין זִיוְיָתֵיהּ עַל תְּרֵין סִיטְרוֹי לְאַתְרָא לַאֲרִיחַיָא לְמֵיטוֹל יָתֵהּ בְּהוֹן", "pj_en": "And two golden rings he made for it under its crown, at its two corners, upon its two sides, to be the place of the staves by which to carry it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 28, "aliyah": 6, "heb": "וַיַּ֥עַשׂ אֶת־הַבַּדִּ֖ים עֲצֵ֣י שִׁטִּ֑ים וַיְצַ֥ף אֹתָ֖ם זָהָֽב׃", "onk": "וַעֲבַד יָת אֲרִיחַיָּא דְּאָעֵי שִׁטִּין וַחֲפָא יָתְהוֹן דַּהֲבָא:", "onk_en": "He made the poles out of acacia wood and overlaid them with gold.", "pj": "וַעֲבַד יַת אֲרִיחַיָא דְקִיסֵי שִׁיטָא וַחֲפָא יַתְהוֹן דַּהֲבָא", "pj_en": "And the staves be made of sitta wood, and overlaid them with gold.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 29, "aliyah": 6, "heb": "וַיַּ֜עַשׂ אֶת־שֶׁ֤מֶן הַמִּשְׁחָה֙ קֹ֔דֶשׁ וְאֶת־קְטֹ֥רֶת הַסַּמִּ֖ים טָה֑וֹר מַעֲשֵׂ֖ה רֹקֵֽחַ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַעֲבַד יָת מִשְׁחָא דִרְבוּתָא קוּדְשָׁא וְיָת קְטֹרֶת בּוּסְמַיָּא דְּכֵי עוֹבַד בּוּסְמָנוּ:", "onk_en": "He made the sacred anointing oil and the pure perfumed incense, according to the work of the perfumer.", "pj": "וַעֲבַד יַת מִשְׁחָא דִרְבוּתָא קוּדְשָׁא וְיַת קְטוֹרֶת בּוּסְמַיָא דְכֵי עוֹבַד בּוּסְמָנוּ", "pj_en": "And he made the sacred oil of anointing, and the pure sweet incense, the work of the perfumer.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 1, "aliyah": 7, "heb": "וַיַּ֛עַשׂ אֶת־מִזְבַּ֥ח הָעֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אׇרְכּ֜וֹ וְחָֽמֵשׁ־אַמּ֤וֹת רׇחְבּוֹ֙ רָב֔וּעַ וְשָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽוֹ׃", "onk": "וַעֲבַד יָת מַדְבְּחָא דַעֲלָתָא דְּאָעֵי שִׁטִּין חֲמֵשׁ אַמִּין אֻרְכֵּיהּ וַחֲמֵשׁ אַמִּין פְּתָיֵהּ מְרַבַּע וּתְלָתָא אַמִּין רוּמֵיהּ:", "onk_en": "He made the burnt-offering altar out of acacia wood. It was five amohs long and five amohs wide, it was square, and three amohs high.", "pj": "וַעֲבַד יַת מַדְבְּחָא דְעָלָתָא דְקִיסֵי שִׁיטָא חֲמֵשׁ אַמִּין אוּרְכֵּיהּ וַחֲמֵשׁ אַמִּין פּוּתְיֵהּ מְרַבַּע וּתְלַת אַמִּין רוּמֵיהּ", "pj_en": "And he made the ALTAR OF BURNT OFFERING of Sitta wood; five cubits its length, and five cubits its breadth, four-square, and three cubits its height.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 2, "aliyah": 7, "heb": "וַיַּ֣עַשׂ קַרְנֹתָ֗יו עַ֚ל אַרְבַּ֣ע פִּנֹּתָ֔יו מִמֶּ֖נּוּ הָי֣וּ קַרְנֹתָ֑יו וַיְצַ֥ף אֹת֖וֹ נְחֹֽשֶׁת׃", "onk": "וַעֲבַד קַרְנוֹהִי עַל אַרְבַּע זִוְיָתֵיהּ מִנֵּיהּ הֲווֹ קַרְנוֹהִי וַחֲפָא יָתֵיהּ נְחָשָׁא:", "onk_en": "He made its raised projections on its four corners. Its raised projections were one piece with it, and he overlaid it with copper.", "pj": "וְעָבַד קַרְנוֹי עַל אַרְבַּע זִוְיָיתֵיהּ מִנֵיהּ הֲוָואָה קַרְנוֹי זְקִיפִין לְעֵיל וַחֲפָא יָתֵיהּ נְחָשָׁא", "pj_en": "And he made horns upon its four corners; of the same were its horns stretching upward; and he covered it with brass.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 3, "aliyah": 7, "heb": "וַיַּ֜עַשׂ אֶֽת־כׇּל־כְּלֵ֣י הַמִּזְבֵּ֗חַ אֶת־הַסִּירֹ֤ת וְאֶת־הַיָּעִים֙ וְאֶת־הַמִּזְרָקֹ֔ת אֶת־הַמִּזְלָגֹ֖ת וְאֶת־הַמַּחְתֹּ֑ת כׇּל־כֵּלָ֖יו עָשָׂ֥ה נְחֹֽשֶׁת׃", "onk": "וַעֲבַד יָת כָּל מָנֵי מַדְבְּחָא יָת פְּסַכְתֵּרָוָתָא וְיָת מַגְרוֹפְיָתָא וְיָת מִזְרְקָתָא יָת צִנּוּרְיָתָא וְיָת מַחְתְּיָתָא כָּל מָנוֹהִי עֲבַד נְחָשָׁא:", "onk_en": "He made all the vessels of the altar, its pots, its scoops, its basins, its flesh-hooks, and its fire pans. He made all of its vessels out of copper.", "pj": "וְעָבַד יַת כָּל מָנֵי מַדְבְּחָא יַת דּוּדְוָתַיָא וְיַת מִגְרוֹפְיָתָא וְיַת מִזְרְקַיָא וְיַת מַשִׁילְיָתָא וְיַת מַחְתְּיָתָא לְכָל מָנוֹי עָבַד נְחָשָׁא", "pj_en": "And he made all the vessels of the altar; the pots, and the cleaners, and the basins, and the fleshhooks, and the pans, all its vessels made he of brass.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 4, "aliyah": 7, "heb": "וַיַּ֤עַשׂ לַמִּזְבֵּ֙חַ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת תַּ֧חַת כַּרְכֻּבּ֛וֹ מִלְּמַ֖טָּה עַד־חֶצְיֽוֹ׃", "onk": "וַעֲבַד לְמַדְבְּחָא סְרָדָא עוֹבַד מְצַדְתָּא דִנְחָשָׁא תְּחוֹת סוֹבָבֵיהּ מִלְּרַע עַד פַּלְגֵּיהּ:", "onk_en": "He made for the altar a grate of copper netting, under its rim extending downward, (so that the grate reached) to the middle of the altar.", "pj": "וַעֲבַד לְמַדְבְּחָא קַנְקַל עוֹבַד מְצַרְתָּא דִנְחָשָׁא תְּחוֹת סוֹבְבֵיהּ מִלְרַע עַד פַּלְגֵיהּ מְטוֹל לְקַבָּלָא גוּמְרַיָא וְגַרְמַיָא דְנָפְלִין מִן מַדְבְּחָא", "pj_en": "And he made the grate of the altar, of brasen network under the border beneath, reaching to the middle of it, to receive the cinders and bones that fell from the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 5, "aliyah": 7, "heb": "וַיִּצֹ֞ק אַרְבַּ֧ע טַבָּעֹ֛ת בְּאַרְבַּ֥ע הַקְּצָוֺ֖ת לְמִכְבַּ֣ר הַנְּחֹ֑שֶׁת בָּתִּ֖ים לַבַּדִּֽים׃", "onk": "וְאַתִּיךְ אַרְבַּע עִזְקָתָא בְּאַרְבַּע <b>סִטְרָתָא<\/b> לִסְרָדָא דִנְחָשָׁא אַתְרָא לַאֲרִיחַיָּא:", "onk_en": "He cast four rings on the four corners [<b>sides<\/b>]of the copper grating to house the poles.", "pj": "וְאַתֵּיךְ אַרְבַּע עִזְקַן בְּאַרְבַּע זִוְיָתֵיהּ לְקַנְקַל דִּנְחָשָׁא אַתְרָא לַאֲרִיחַיָא", "pj_en": "And he cast four rings, for the four corners of the grate, of brass, (to be) places for the staves.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 6, "aliyah": 7, "heb": "וַיַּ֥עַשׂ אֶת־הַבַּדִּ֖ים עֲצֵ֣י שִׁטִּ֑ים וַיְצַ֥ף אֹתָ֖ם נְחֹֽשֶׁת׃", "onk": "וַעֲבַד יָת אֲרִיחַיָּא דְּאָעֵי שִׁטִּין וַחֲפָא יָתְהוֹן נְחָשָׁא:", "onk_en": "He made the poles of acacia wood, and overlaid them with copper.", "pj": "וַעֲבַד יַת אֲרִיחַיָא דְקִיסֵי שִׁיטָא וַחֲפָא יַתְהוֹן נְחָשָׁא", "pj_en": "And he made the staves of sitta wood, and coated them with brass.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 7, "aliyah": 7, "heb": "וַיָּבֵ֨א אֶת־הַבַּדִּ֜ים בַּטַּבָּעֹ֗ת עַ֚ל צַלְעֹ֣ת הַמִּזְבֵּ֔חַ לָשֵׂ֥את אֹת֖וֹ בָּהֶ֑ם נְב֥וּב לֻחֹ֖ת עָשָׂ֥ה אֹתֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאָעֵיל יָת אֲרִיחַיָּא בְּעִזְקָתָא עַל סִטְרֵי מַדְבְּחָא לְמִטַּל יָתֵיהּ בְּהוֹן חֲלִיל לוּחִין עֲבַד יָתֵיהּ:", "onk_en": "He placed the poles into the rings that were on the (two) sides of the altar to carry it with them. He made it a hollow structure constructed from boards.", "pj": "וְהַנְעַל יַת אֲרִיחַיָא בְּעִזְקָתָא עַל סְטַר מַדְבְּחָא לְמִטַּל יָתֵיהּ בְּהוֹן חֲלִיל לוּחִין מְלֵי עַפְרָא עֲבַד יָתֵיהּ", "pj_en": "And he put the staves into the rings, upon the sides of the altar, to carry it by them: hollow with boards, and filled with earth made he it.", "tj": "", "tj_en": "", "rashi": "<b>נבוב לחת.<\/b> נָבוּב הוּא חָלוּל, וְכֵן וְעָבְיוֹ אַרְבַּע אֶצְבָּעוֹת נָבוּב (ירמיהו נ\"ב):<br><br><b>נבוב לחת.<\/b> הַלּוּחוֹת שֶׁל עֲצֵי שִׁטִּים לְכָל רוּחַ, וְהֶחָלָל בָּאֶמְצַע:", "rashi_en": "נבוב לחות HOLLOW WITH TABLETS — נבוב signifies hollow, similar to, (Jeremiah 52:21) “And the thickness thereof was four fingers: it was hollow (נבוב)‎”.<br><br>נבוב לחת — The word נבוב being in the construct state and subordinate to לחות the meaning of the verse is: He made it (the altar) out of the hollow space formed by the tablets i. e. the planks of Shittim wood mentioned in v. 1 were oil all sides and the hollow space in the middle (thus the hollow space itself — which was filled with earth — formed the altar. Unlike the golden altar it had no roof; cf. Rashi on Exodus 27:8)."}, {"ch": 38, "v": 8, "aliyah": 7, "heb": "וַיַּ֗עַשׂ אֵ֚ת הַכִּיּ֣וֹר נְחֹ֔שֶׁת וְאֵ֖ת כַּנּ֣וֹ נְחֹ֑שֶׁת בְּמַרְאֹת֙ הַצֹּ֣בְאֹ֔ת אֲשֶׁ֣ר צָֽבְא֔וּ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַעֲבַד יָת כִּיוֹרָא נְחָשָׁא וְיָת בְּסִיסֵיהּ נְחָשָׁא בְּמֶחְזְיַן נְשַׁיָּא <b>דְּאָתְיָן לְצַלָּאָה<\/b> בִּתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "He made the basin out of copper and its base out of copper, from the mirrors of the women who had gathered [<b>come to pray<\/b>] at the entrance of the Tent of Meeting.", "pj": "וַעֲבַד יַת כִּיּוֹרָא דִנְחָשָׁא וְיַת בְּסִיסֵיהּ דִּנְחָשָׁא מִן אַסְפַּקְלִירֵי נְחָשָׁא נְשַׁיָא צְנִיעוּתָא וּבְעִידַן דְּאָתוּן לְצַלָּאָה בִּתְרַע מַשְׁכַּן זִמְנָא הֲוָאָן קַיְימִין עַל קָרְבַּן אַדְמוּתְהוֹן וּמְשַׁבְּחָן וּמוֹדָן וְתַיְיבִין לְגוּבְרֵיהוֹן וְיָלְדַן בְּנִין צַדִּיקִין בִּזְמַן דְּמִדְכַן מִן סוֹאָבוֹת דִּמְהוֹן", "pj_en": "And he made the brasen Laver, and its foundation of brass, from the brasen mirrors of the pious women, who, at the season, came to pray at the door of the tabernacle of appointment, standing with their oblations, giving thanks and confession, and returning to their husbands, the mothers of righteous children, who had been purified from the uncleanness of their blood.", "tj": "וַעֲבַד יַת כִּיּוֹרָא דִנְחָשָׁא וְיַת בְּסִיס דִּידֵיהּ דִּנְחַשׁ בְּחֶזְיַת נְשַׁיָא צְנִיעֲתָא דַהֲוָון צְנִיעַן בִּתְרַע מַשְׁכַּן זִימְנָא:", "tj_en": "And he made the laver of brass, and the base thereof of brass, with, the mirrors of the pious women who were devout at the gate of the tabernacle of appointment.", "rashi": "<b>במראת הצבאת.<\/b> בְּנוֹת יִשְׂרָאֵל הָיוּ בְיָדָן מַרְאוֹת שֶׁרוֹאוֹת בָּהֶן כְּשֶׁהֵן מִתְקַשְּׁטוֹת, וְאַף אוֹתָן לֹא עִכְּבוּ מִלְּהָבִיא לְנִדְבַת הַמִּשְׁכָּן, וְהָיָה מוֹאֵס מֹשֶׁה בָּהֶן מִפְּנֵי שֶׁעֲשׂוּיִם לְיֵצֶר הָרָע, אָמַר לוֹ הַקָּבָּ\"ה קַבֵּל, כִּי אֵלּוּ חֲבִיבִין עָלַי מִן הַכֹּל, שֶׁעַל יְדֵיהֶם הֶעֱמִידוּ הַנָּשִׁים צְבָאוֹת רַבּוֹת בְּמִצְרַיִם; כְּשֶׁהָיוּ בַעְלֵיהֶם יְגֵעִים בַּעֲבוֹדַת פֶּרֶךְ, הָיוּ הוֹלְכוֹת וּמוֹלִיכוֹת לָהֶם מַאֲכָל וּמִשְׁתֶּה, וּמַאֲכִילוֹת אוֹתָם וְנוֹטְלוֹת הַמַּרְאוֹת, וְכָל אַחַת רוֹאָה עַצְמָהּ עִם בַּעְלָהּ בַּמַּרְאָה, וּמְשַׁדַּלְתּוֹ בִדְבָרִים, לוֹמַר אֲנִי נָאָה מִמְּךָ, וּמִתּוֹךְ כָּךְ מְבִיאוֹת לְבַעְלֵיהֶן לִידֵי תַאֲוָה וְנִזְקָקוֹת לָהֶם וּמִתְעַבְּרוֹת וְיוֹלְדוֹת שָׁם, שֶׁנֶּאֱמַר תַּחַת הַתַּפּוּחַ עוֹרַרְתִּיךָ (שיר השירים ח'), וְזֶה שֶׁנֶּאֱמַר בְּמַרְאֹת הַצּוֹבְאוֹת. וְנַעֲשָׂה הַכִּיּוֹר מֵהֶם, שֶׁהוּא לָשׂוּם שָׁלוֹם בֵּין אִישׁ לְאִשְׁתּוֹ – לְהַשְׁקוֹת מִמַּיִם שֶׁבְּתוֹכוֹ לְמִי שֶׁקִּנֵּא לָהּ בַּעְלָהּ וְנִסְתְּרָה; וְתֵדַע לְךָ שֶׁהֵן מַרְאוֹת מַמָּשׁ, שֶׁהֲרֵי נֶאֱמַר וּנְחֹשֶׁת הַתְּנוּפָה שִׁבְעִים כִּכָּר וְגוֹ', וַיַּעַשׂ בָּהּ וְגוֹמֵר, וְכִיּוֹר וְכַנּוֹ לֹא הֻזְכְּרוּ שָׁם, לָמַדְתָּ שֶׁלֹּא הָיָה נְחֹשֶׁת שֶׁל כִּיּוֹר מִנְּחֹשֶׁת הַתְּנוּפָה, כָּךְ דָּרַשׁ רַבִּי תַּנְחוּמָא, וְכֵן תִּרְגֵּם אֻנְקְלוֹס בְּמֶחְזְיָת נְשַׁיָא וְהוּא תַרְגּוּם שֶׁל מַרְאוֹת, מירוריי\"ש בְּלַעַז. וְכֵן מָצִינוּ וְהַגִּלְיוֹנִים (ישעיה ג') – מְתַרְגְּמִינָן מֶחְזְיָתָא:<br><br><b>אשר צבאו.<\/b> לְהָבִיא נִדְבָתָן:", "rashi_en": "במראת הצבאת OF THE MIRRORS OF THE WOMEN CROWDING — The Israelitish women possessed mirrors of copper into which they used to look when they adorned themselves. Even these did they not hesitate to bring as a contribution towards the Tabernacle. Now Moses was about to reject them since they were made to pander to their vanity, but the Holy One, blessed be He, said to him, “Accept them; these are dearer to Me than all the other contributions, because through them the women reared those huge hosts in Egypt!” For when their husbands were tired through the crushing labour they used to bring them food and drink and induced them to eat. Then they would take the mirrors, and each gazed at herself in her mirror together with her husband, saying endearingly to him, “See, I am handsomer than you!” Thus they awakened their husbands’ affection and subsequently became the mothers of many children, at it is said, (Song 8:5) “I awakened thy love under the apple-tree”, (referring to the fields where the men worked). This is what it refers to when it states, מראות הצבאת “the mirrors of the women who reared the hosts (צבאות)” (Midrash Tanchuma, Pekudei 9). And it was for this reason that the laver was made of them (the mirrors) — because it served the purpose of promoting peace between man and wife viz., by giving of its waters to be drunk by a woman whose husband had shown himself jealous of her and who nevertheless had associated with another (cf. Numbers ch. V) thus affording her an opportunity to prove her innocence (cf. Sotah 15b). You may know that the מראות mentioned in the text were really mirrors (and that the word does not mean visions, or appearance, etc.), for it is said, (v. 29) “And the copper of the wave-offering was seventy talents etc. … and therewith he made [the sockets etc.]” — the laver, however, and its base are not mentioned there amongst the articles made from that copper; hence you may learn that the copper of which the laver was made was not a part of the copper of the weave-offering, which is the only copper mentioned as having been contributed by the people. Thus did R. Tanchuma 2:11:9 explain the term מראת הצבאת. And so does Onkelos also render it: במחזית נשיא, and this first word is the Targum translation of מראות, in the sense of mireors in old French, for we find that for the word (Isaiah 3:23) “And the גליונים”, which are mirrors, we have in the Targum the same word מחזיתא.<br><br>אשר צבאו [THE WOMEN] WHO CAME IN CROWDS to bring their contribution."}, {"ch": 38, "v": 9, "aliyah": 7, "heb": "וַיַּ֖עַשׂ אֶת־הֶחָצֵ֑ר לִפְאַ֣ת&thinsp;<b>׀<\/b> נֶ֣גֶב תֵּימָ֗נָה קַלְעֵ֤י הֶֽחָצֵר֙ שֵׁ֣שׁ מׇשְׁזָ֔ר מֵאָ֖ה בָּאַמָּֽה׃", "onk": "וַעֲבַד יָת דַּרְתָּא לְרוּחַ עֵבַר דָּרוֹמָא סְרָדֵי דַרְתָּא דְבוּץ שְׁזִיר מְאָה בְאַמִּין:", "onk_en": "He made the enclosure (for the mishkon). On the south side the curtains for the enclosure were made of fine, twined linen, one hundred amohs long.", "pj": "וַעֲבַד יַת דָּרְתָא לְרוּחַ עִיבַר דָּרוֹמָא וִילַוֵי דָרְתָא דְבוּץ שְׁזִיר מְאָה אַמִּין", "pj_en": "And he made the court; on the southern side, the curtains of the court (made he) with fine linen, a hundred cubits,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 10, "aliyah": 7, "heb": "עַמּוּדֵיהֶ֣ם עֶשְׂרִ֔ים וְאַדְנֵיהֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָעַמּוּדִ֛ים וַחֲשֻׁקֵיהֶ֖ם כָּֽסֶף׃", "onk": "עַמּוּדֵיהוֹן עֶסְרִין וְסַמְכֵיהוֹן עֶסְרִין נְחָשָׁא וָוֵי עַמּוּדַיָּא וְכִבּוּשֵׁיהוֹן כְּסָף:", "onk_en": "It had twenty pillars and twenty copper sockets. The hooks and bands of the pillars were of silver.", "pj": "עַמּוּדֵיהוֹן עַשְרִין וְחוֹמְרֵיהוֹן עַשְרִין דִּנְחָשָׁא וָוֵי עַמּוּדַיָא וְכִבּוּשֵׁיהוֹן דִּכְסָף", "pj_en": "their pillars twenty, and their bases twenty, of brass; the hooks of the pillars and their rods were of silver.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 11, "aliyah": 7, "heb": "וְלִפְאַ֤ת צָפוֹן֙ מֵאָ֣ה בָֽאַמָּ֔ה עַמּוּדֵיהֶ֣ם עֶשְׂרִ֔ים וְאַדְנֵיהֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָֽעַמּוּדִ֛ים וַחֲשֻׁקֵיהֶ֖ם כָּֽסֶף׃", "onk": "וּלְרוּחַ צִפּוּנָא מְאָה אַמִּין עַמּוּדֵיהוֹן עֶסְרִין וְסַמְכֵיהוֹן עֶסְרִין נְחָשָׁא וָוֵי עַמּוּדַיָּא וְכִבּוּשֵׁיהוֹן דִּכְסָף:", "onk_en": "On the north side, (its length was) one hundred amohs. It had twenty pillars and twenty copper sockets. The hooks and bands of the pillars were of silver.", "pj": "וּלְרוּחַ צִפּוּנָא מְאָה אַמִּין עַמּוּדֵיהוֹן עַשְרִין וְחוֹמְרֵיהוֹן עַשְרִין דִּנְחָשָׁא וָוֵי עַמּוּדַיָא וְכִבּוּשֵׁיהוֹן דִּכְסָף", "pj_en": "And on the north side, a hundred cubits, their pillars twenty, and their bases twenty, of brass; the hooks of the pillars and their rods were of silver.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 12, "aliyah": 7, "heb": "וְלִפְאַת־יָ֗ם קְלָעִים֙ חֲמִשִּׁ֣ים בָּֽאַמָּ֔ה עַמּוּדֵיהֶ֣ם עֲשָׂרָ֔ה וְאַדְנֵיהֶ֖ם עֲשָׂרָ֑ה וָוֵ֧י הָעַמֻּדִ֛ים וַחֲשׁוּקֵיהֶ֖ם כָּֽסֶף׃", "onk": "וּלְרוּחַ מַעַרְבָא סְרָדִין חַמְשִׁין בְּאַמִּין עַמּוּדֵיהוֹן עַסְרָא וְסַמְכֵיהוֹן עַסְרָא וָוֵי עַמּוּדַיָּא וְכִבּוּשֵׁיהוֹן דִּכְסָף:", "onk_en": "On the west side, the curtains were of fifty amohs. It had ten pillars and ten sockets. The hooks and bands of the pillars were of silver.", "pj": "וּלְרוּחַ מַעַרְבָא וִילַוַן חַמְשִׁין אַמִּין עַמּוּדֵיהוֹן עַשְרָא וְחוֹמְרֵיהוֹן עַשְרָא וָוֵי עַמּוּדַיָא וְכִבּוּשֵׁיהוֹן דִּכְסָף", "pj_en": "And the curtains of the western side, fifty cubits, their pillars ten, and their bases ten; the hooks of the pillars, and their rods, were of silver.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 13, "aliyah": 7, "heb": "וְלִפְאַ֛ת קֵ֥דְמָה מִזְרָ֖חָה חֲמִשִּׁ֥ים אַמָּֽה׃", "onk": "וּלְרוּחַ קִדּוּמָא מָדִינְחָא חַמְשִׁין אַמִּין:", "onk_en": "(The width of the enclosure) on the east side was fifty amohs.", "pj": "וּלְרוּחַ קִידוּמָא מַדִנְחָא חַמְשִׁין אַמִּין", "pj_en": "And on the east side, eastward, fifty cubits.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 14, "aliyah": 7, "heb": "קְלָעִ֛ים חֲמֵשׁ־עֶשְׂרֵ֥ה אַמָּ֖ה אֶל־הַכָּתֵ֑ף עַמּוּדֵיהֶ֣ם שְׁלֹשָׁ֔ה וְאַדְנֵיהֶ֖ם שְׁלֹשָֽׁה׃", "onk": "סְרָדִין חֲמֵשׁ עֶסְרֵי אַמִּין לְעִבְרָא עַמּוּדֵיהוֹן תְּלָתָא וְסַמְכֵיהוֹן תְּלָתָא:", "onk_en": "Curtains fifteen amohs long were on one flank (of the entrance). They had three pillars and three sockets.", "pj": "וִילַוַן חֲמֵיסְרֵי אַמִּין לְעִבְרָא עַמּוּדֵיהוֹן תְּלָתָא וְחוֹמְרֵיהוֹן תְּלָתָא", "pj_en": "And the curtains were fifteen cubits on a side; their pillars three, and their bases three.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 15, "aliyah": 7, "heb": "וְלַכָּתֵ֣ף הַשֵּׁנִ֗ית מִזֶּ֤ה וּמִזֶּה֙ לְשַׁ֣עַר הֶֽחָצֵ֔ר קְלָעִ֕ים חֲמֵ֥שׁ עֶשְׂרֵ֖ה אַמָּ֑ה עַמֻּדֵיהֶ֣ם שְׁלֹשָׁ֔ה וְאַדְנֵיהֶ֖ם שְׁלֹשָֽׁה׃", "onk": "וּלְעִבְרָא תִנְיֵתָא מִכָּא וּמִכָּא לִתְרַע דַּרְתָּא סְרָדִין חֲמֵשׁ עֶסְרֵי אַמִּין עַמּוּדֵיהוֹן תְּלָתָא וְסַמְכֵיהוֹן תְּלָתָא", "onk_en": "The other flank, on either side of the gate to the enclosure (there also were) curtains fifteen amohs long. They (too) had three pillars and three sockets.", "pj": "וּלְעִבְרָא תִּנְיָינָא מִכָּא וּמִכָּא לִתְרַע דָּרְתָּא וִילַוַן חֲמֵיסְרֵי אַמִּין עַמּוּדֵיהוֹן תְּלָתָא וְחוֹמְרֵיהוֹן תְּלָתָא", "pj_en": "And for the second side of the door of the court, here and there, at the gate of the court, curtains fifteen cubits, their pillars three and their bases three.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 16, "aliyah": 7, "heb": "כׇּל־קַלְעֵ֧י הֶחָצֵ֛ר סָבִ֖יב שֵׁ֥שׁ מׇשְׁזָֽר׃", "onk": "כָּל סְרָדֵי דְדַרְתָּא סְחוֹר סְחוֹר דְּבוּץ שְׁזִיר:", "onk_en": "All curtains around the enclosure were made of twined, fine linen.", "pj": "כָּל וִילַוֵי דָרְתָא חֲזוֹר חֲזוֹר דְּבוּץ שְׁזִיר", "pj_en": "All the curtains of the court round about were of fine linen twined.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 17, "aliyah": 7, "heb": "וְהָאֲדָנִ֣ים לָֽעַמֻּדִים֮ נְחֹ֒שֶׁת֒ וָוֵ֨י הָֽעַמּוּדִ֜ים וַחֲשׁוּקֵיהֶם֙ כֶּ֔סֶף וְצִפּ֥וּי רָאשֵׁיהֶ֖ם כָּ֑סֶף וְהֵם֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף כֹּ֖ל עַמֻּדֵ֥י הֶחָצֵֽר׃", "onk": "וְסַמְכַיָּא לְעַמּוּדַיָּא נְחָשָׁא וָוֵי עַמּוּדַיָּא וְכִבּוּשֵׁיהוֹן דִּכְסַף וְחִפּוּי רֵישֵׁיהוֹן דִּכְסָף וְאִנּוּן מְכַבְּשִׁין דִּכְסַף כָּל עַמּוּדֵי דַרְתָּא:", "onk_en": "The sockets for the pillars were of copper, the hooks and bands of the pillars were of silver, and the covering of their tops was of silver. All pillars of the enclosure had silver bands.", "pj": "וְחוֹמְרַיָא לַעֲמוּדַיָא דִנְחָשָׁא וָוֵי עַמּוּדַיָא וְכִבּוּשֵׁיהוֹן כְּסַף וְחִפּוּי רֵישֵׁיהוֹן כְּסָף וְהִינוּן מְכַבְּשִׁין כְּסַף הֵיכְדֵין הֲווֹ מִתְעַבְּדִין כָּל עַמּוּדֵי דָרְתָא", "pj_en": "And the bases of the pillars were of brass, the hooks of the pillars and their rods of silver, and the overlaying of their capitals silver, and the rods silver; so were made all the pillars of the court.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 18, "aliyah": 7, "heb": "וּמָסַ֞ךְ שַׁ֤עַר הֶחָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֣שׁ מׇשְׁזָ֑ר וְעֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְקוֹמָ֤ה בְרֹ֙חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְעֻמַּ֖ת קַלְעֵ֥י הֶחָצֵֽר׃", "onk": "וּפְרָסָא דִּתְרַע דַּרְתָּא עוֹבַד צַיָּר תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר וְעֶסְרִין אַמִּין אֻרְכָּא וְרוּמָא בְּפוּתְיָא חֲמֵשׁ אַמִּין לָקֳבֵל סְרָדֵי דַרְתָּא:", "onk_en": "The screen at the entrance of the enclosure was the work of an embroiderer. It was made of greenish blue wool, dark red wool, crimson [<b>colored<\/b>] wool, and twined, fine linen. It was twenty amohs long and the height in the width was five amohs, corresponding to the curtains of the enclosure.", "pj": "וּפְרָסָא דִתְרַע דָּרְתָא עוֹבַד צִיּוּר מַחְטָא דְתִכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ שְׁזִיר וְעֶשְרִין אַמִּין אוּרְכָּא וְרוּמֵיהּ בְּפוּתְיָהּ חֲמֵשׁ אַמִּין כָּל קֳבֵיל וִילַוֵי דָרְתָא", "pj_en": "And the hanging for the gate of the court was made of embroidered work in hyacinth, and purple, and crimson, and fine linen twined; and twenty cubits (was) the length, and the height on its breadth five cubits, corresponding with the curtains of the court.", "tj": "", "tj_en": "", "rashi": "<b>לעמת קלעי החצר.<\/b> כְּמִדַּת קַלְעֵי הֶחָצֵר:", "rashi_en": "לעמת קלעי החצר [AND THE SCREEN…] ANSWERING TO THE HANGINGS OF THE ENCLOSURE — i. e. according to the measure of the height of the hangings of the enclosure."}, {"ch": 38, "v": 19, "aliyah": 7, "heb": "וְעַמֻּֽדֵיהֶם֙ אַרְבָּעָ֔ה וְאַדְנֵיהֶ֥ם אַרְבָּעָ֖ה נְחֹ֑שֶׁת וָוֵיהֶ֣ם כֶּ֔סֶף וְצִפּ֧וּי רָאשֵׁיהֶ֛ם וַחֲשֻׁקֵיהֶ֖ם כָּֽסֶף׃", "onk": "וְעַמּוּדֵיהוֹן אַרְבְּעָא וְסַמְכֵיהוֹן אַרְבְּעָא נְחָשָׁא וָוֵיהוֹן דִּכְסַף וְחִפּוּי רֵישֵׁיהוֹן וְכִבּוּשֵׁיהוֹן דִּכְסָף:", "onk_en": "(The screen) had four pillars and four copper sockets, silver hooks, and their tops and bands were overlaid with silver.", "pj": "וְעַמּוּדֵיהוֹן אַרְבְּעָא וְחוֹמְרֵיהוֹן אַרְבְּעָא דִנְחָשָׁא וָוֵיהוֹן כְּסַף וְחִפּוּי רֵישֵׁיהוֹן וְכִבּוּשֵׁיהוֹן כְּסָף", "pj_en": "And their pillars four, and their bases four, of brass; their hooks silver, and the overlaying of their capitals, and their rods, silver.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 20, "aliyah": 7, "heb": "וְֽכׇל־הַיְתֵדֹ֞ת לַמִּשְׁכָּ֧ן וְלֶחָצֵ֛ר סָבִ֖יב נְחֹֽשֶׁת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְכָל סִכַּיָּא לְמַשְׁכְּנָא וּלְדַרְתָּא סְחוֹר סְחוֹר דִּנְחָשָׁא:", "onk_en": "All the stakes of the mishkon and the surrounding enclosure were made of copper.", "pj": "וְכָל מַתַּחְיָא לְמַשְׁכְּנָא וּלְדָרְתָא חֲזוֹר חֲזוֹר דִּנְחָשָׁא", "pj_en": "But all the pins of the tabernacle, and of the court round about, were of brass.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];
const LABELS = { onk: "אונקלוס", pj: "יונתן", yer: "ירושלמי", rashi: "רש״י" };
const ALIYAH_LETTERS = {1:'א',2:'ב',3:'ג',4:'ד',5:'ה',6:'ו',7:'ז',8:'ח',9:'ט',10:'י'};
const CH_LETTERS = {"1": "א׳", "2": "ב׳", "3": "ג׳", "4": "ד׳", "5": "ה׳", "6": "ו׳", "7": "ז׳", "8": "ח׳", "9": "ט׳", "10": "י׳", "11": "י״א", "12": "י״ב", "13": "י״ג", "14": "י״ד", "15": "ט״ו", "16": "ט״ז", "17": "י״ז", "18": "י״ח", "19": "י״ט", "20": "כ׳", "21": "כ״א", "22": "כ״ב", "23": "כ״ג", "24": "כ״ד", "25": "כ״ה", "26": "כ״ו", "27": "כ״ז", "28": "כ״ח", "29": "כ״ט", "30": "ל׳", "31": "ל״א", "32": "ל״ב", "33": "ל״ג", "34": "ל״ד", "35": "ל״ה", "36": "ל״ו", "37": "ל״ז", "38": "ל״ח", "39": "ל״ט", "40": "מ׳", "41": "מ״א", "42": "מ״ב", "43": "מ״ג", "44": "מ״ד", "45": "מ״ה", "46": "מ״ו", "47": "מ״ז", "48": "מ״ח", "49": "מ״ט", "50": "נ׳", "51": "נ״א", "52": "נ״ב", "53": "נ״ג", "54": "נ״ד", "55": "נ״ה", "56": "נ״ו", "57": "נ״ז", "58": "נ״ח", "59": "נ״ט", "60": "ס׳", "61": "ס״א", "62": "ס״ב", "63": "ס״ג", "64": "ס״ד", "65": "ס״ה", "66": "ס״ו", "67": "ס״ז", "68": "ס״ח", "69": "ס״ט", "70": "ע׳", "71": "ע״א", "72": "ע״ב", "73": "ע״ג", "74": "ע״ד", "75": "ע״ה", "76": "ע״ו", "77": "ע״ז", "78": "ע״ח", "79": "ע״ט", "80": "פ׳", "81": "פ״א", "82": "פ״ב", "83": "פ״ג", "84": "פ״ד", "85": "פ״ה", "86": "פ״ו", "87": "פ״ז", "88": "פ״ח", "89": "פ״ט", "90": "צ׳", "91": "צ״א", "92": "צ״ב", "93": "צ״ג", "94": "צ״ד", "95": "צ״ה", "96": "צ״ו", "97": "צ״ז", "98": "צ״ח", "99": "צ״ט", "100": "ק׳", "101": "ק״א", "102": "ק״ב", "103": "ק״ג", "104": "ק״ד", "105": "ק״ה", "106": "ק״ו", "107": "ק״ז", "108": "ק״ח", "109": "ק״ט", "110": "ק״י", "111": "קי״א", "112": "קי״ב", "113": "קי״ג", "114": "קי״ד", "115": "קט״ו", "116": "קט״ז", "117": "קי״ז", "118": "קי״ח", "119": "קי״ט", "120": "ק״כ", "121": "קכ״א", "122": "קכ״ב", "123": "קכ״ג", "124": "קכ״ד", "125": "קכ״ה", "126": "קכ״ו", "127": "קכ״ז", "128": "קכ״ח", "129": "קכ״ט", "130": "ק״ל", "131": "קל״א", "132": "קל״ב", "133": "קל״ג", "134": "קל״ד", "135": "קל״ה", "136": "קל״ו", "137": "קל״ז", "138": "קל״ח", "139": "קל״ט", "140": "ק״מ", "141": "קמ״א", "142": "קמ״ב", "143": "קמ״ג", "144": "קמ״ד", "145": "קמ״ה", "146": "קמ״ו", "147": "קמ״ז", "148": "קמ״ח", "149": "קמ״ט", "150": "ק״נ"};

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
