<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 1, "v": 1, "aliyah": 1, "heb": "וַיִּקְרָ֖<small>א<\/small> אֶל־מֹשֶׁ֑ה וַיְדַבֵּ֤ר יְהֹוָה֙ אֵלָ֔יו מֵאֹ֥הֶל מוֹעֵ֖ד לֵאמֹֽר׃", "onk": "וּקְרָא לְמשֶׁה וּמַלֵּיל יְיָ עִמֵּיהּ מִמַּשְׁכַּן זִמְנָא לְמֵימָר:", "onk_en": "And He called to Moshe, and Adonoy spoke to him from the Tent of Meeting, saying:", "pj": "ויקרא וַהֲוָה כֵּיוַן דְאַשְׁלִים משֶׁה לְמִיקְמָא יַת מַשְׁכְּנָא חָשִׁיב משֶׁה וְאַיְידִין בְּלִבֵּיהּ וַאֲמַר טַוְורָא דְסִינָי דַהֲוָה רִיבּוּיֵיהּ רִבּוּי דְשַׁעְתָּא וְקִדוּשֵׁיהּ קִדוּשׁ דִתְלַת יוֹמִין לָא הֲוָה אֶפְשַׁר לִי דְאִיסוּק לְוָתֵיהּ עַד זְמַן דַהֲוָה דִבּוּרָא מִתְמַלֵיל עִמִי בְּרַם מַשְׁכַּן זִמְנָא הָדֵין דְרִבּוּיֵיהּ רִבּוּי לְעָלַם וְקִדוּשֵׁיהּ קִידוּשׁ לְעָלַם מִן דִינָא הֲוָה דְלָא אֵיעוּל לְגַוֵּיהּ עַד זְמַן דִי יִתְמַלֵיל עִמִי מִן קֳדָם יְיָ וּבְכֵן קָרָא דִבּוּרָא דַייָ לְמשֶׁה וּמַלֵיל מֵימְרָא דַיְיָ עִמֵיהּ מִן מַשְׁכַּן זִמְנָא לְמֵימָר", "pj_en": "And it was when Mosheh had completed to erect the tabernacle that Mosheh reasoned and judged in his heart, and said: To Mount Sinai, whose excellency is the excellence only of an hour and its holiness the holiness but of three days, I could not ascend till the time that the word was spoken to me; but the excellence of this the tabernacle of ordinance is an eternal excellency, and its holiness an everlasting holiness; therefore is it right that I should not enter within it until the time that I am spoken with from before the Lord. Then did the word of the Lord call unto Mosheh and the Word of the Lord spake with him from the tabernacle of ordinance saying:", "tj": "וַיִּקְרָא וַהֲוָה כַּד כֵּיוַן דְּאַשְׁלִים משֶׁה לְמִקְמָא יַת מַשְׁכְּנָא וְרַבֵּי יָתֵיהּ וְקַדִּישׁ יָתֵיהּ וְיַת כָּל מָנוֹי וְחָשִׁיב משֶׁה בְּלִבֵּיהּ וַאֲמַר טוּרָא דְסִינָי דְּרִיבּוּיֵיהּ רִיבּוּי שָׁעָה וְקִידוּשֵׁיהּ קִידוּשׁ שָׁעָה לָא סְלִיקִית לְגַוֵיהּ עַד זְמַן דִּי יִתְאֲמַר לִי מִן קָדָם יְיָ בְּרַם מַשְׁכַּן זִמְנָא דְרִיבּוּיֵיהּ רִבּוּי עֲלַם וְקִידוּשֵׁיהּ קִידוּשׁ עֲלַם דִּינָא הוּא דְלָא נֵיעוּל לְגַוֵיהּ עַד זְמַן דְּיִתְאַמַּר לִי מִן קָדָם יְיָ וּקְרָא דִבְּרָא דַיְיָ לְמשֶׁה וְכָל מֵימְרָא דַיְיָ הֲוָה עִמֵיהּ מִן מַשְׁכַּן זִמְנָא לְמֵימָר:", "tj_en": "And it was when Mosheh had completed to erect the tabernacle to anoint it, and sanctify it, and all its vessels, that Mosheh reasoned in his heart, and said: Within Mount Sinai, whose majesty was the majesty of an hour, and its holiness the holiness of an hour, I might not ascend till the time which was bidden me from before the Lord; nor into the tabernacle of ordinance, whose majesty is an eternal majesty, and its holiness an everlasting holiness, is it right for me to enter till the time that I am bidden from before the Lord. And the Word of the Lord called to Mosheh; for the Word of the Lord was altogether with him, from the tabernacle of ordinance, saying:", "rashi": "<b>ויקרא אל משה.<\/b> לְכָל דִּבְּרוֹת וּלְכָל אֲמִירוֹת וּלְכָל צִוּוּיִים קָדְמָה קְרִיאָה, לְשׁוֹן חִבָּה, לָשׁוֹן שֶׁמַּלְאֲכֵי הַשָּׁרֵת מִשְׁתַּמְּשִׁין בּוֹ, שֶׁנֶּאֱמַר וְקָרָא זֶה אֶל זֶה (ישעיהו ו'), אֲבָל לִנְבִיאֵי אֻמּוֹת הָעוֹלָם נִגְלָה עֲלֵיהֶן בִּלְשׁוֹן עֲרָאִי וְטֻמְאָה, שֶׁנֶּאֱמַר וַיִּקָּר אֱלֹהִים אֶל בִּלְעָם (במדבר כ\"ג):<br><br><b>ויקרא אל משה.<\/b> הַקּוֹל הוֹלֵךְ וּמַגִּיעַ לְאָזְנָיו וְכָל יִשְֹרָאֵל לֹא שׁוֹמְעִין; יָכוֹל אַף לְהַפְסָקוֹת הָיְתָה קְרִיאָה, תַּ\"ל וַיְדַבֵּר — לְדִבּוּר הָיְתָה קְרִיאָה וְלֹא לְהַפְסָקוֹת, וּמֶה הָיוּ הַפְסָקוֹת מְשַׁמְּשׁוֹת? לִתֵּן רֶוַח לְמֹשֶׁה לְהִתְבּוֹנֵן בֵּין פָּרָשָׁה לְפָרָשָׁה וּבֵין עִנְיָן לְעִנְיָן; קַ\"וָ לְהֶדְיוֹט הַלּוֹמֵד מִן הַהֶדְיוֹט:<br><br><b>אליו.<\/b> לְמַעֵט אֶת אַהֲרֹן; רַ' יְהוּדָה אוֹמֵר י\"ג דִּבְּרוֹת נֶאֶמְרוּ בַּתּוֹרָה לְמֹשֶׁה וּלְאַהֲרֹן וּכְנֶגְדָּן נֶאֶמְרוּ י\"ג מִעוּטִין, לְלַמֶּדְךָ שֶׁלֹּא לְאַהֲרֹן נֶאֶמְרוּ אֶלָּא לְמֹשֶׁה שֶׁיֹּאמַר לְאַהֲרֹן, וְאֵלּוּ הֵן י\"ג מִעוּטִין: לְדַבֵּר אִתּוֹ, מִדַּבֵּר אֵלָיו, וַיְדַבֵּר אֵלָיו (במדבר ז'), וְנוֹעַדְתִּי לְךָ (שמות כ\"ה) — כֻּלָּן בְּתוֹרַת כֹּהֲנִים. יָכוֹל יִשְׁמְעוּ אֶת קוֹל הַדִּבּוּר תַּ\"לֹ קוֹל לוֹ, קוֹל אֵלָיו, מֹשֶׁה שׁוֹמֵעַ וְכָל יִשְֹרָאֵל לֹא שָׁמְעוּ:<br><br><b>מאהל מועד.<\/b> מְלַמֵּד שֶׁהָיָה הַקּוֹל נִפְסָק וְלֹא הָיָה יוֹצֵא חוּץ לָאֹהֶל; יָכוֹל מִפְּנֵי שֶׁהַקּוֹל נָמוּךְ, תַּ\"ל אֶת הַקּוֹל, מַהוּ הַקּוֹל? הוּא הַקּוֹל הַמְפֹרָשׁ בִּתְהִלִּים קוֹל ה' בַּכֹּחַ קוֹל ה' בֶּהָדָר קוֹל ה' שֹׁבֵר אֲרָזִים (תהילים כ\"ט), אִם כֵּן לָמָּה נֶאֱמַר מֵאֹהֶל מוֹעֵד? מְלַמֵּד שֶׁהָיָה הַקּוֹל נִפְסָק. כַּיּוֹצֵא בּוֹ וְקוֹל כַּנְפֵי הַכְּרוּבִים נִשְׁמַע עַד הֶחָצֵר הַחִיצֹנָה (יחזקאל י'), יָכוֹל שֶׁהַקּוֹל נָמוּךְ תַּ\"ל כְּקוֹל אֵל שַׁדַּי בְּדַבְּרוֹ, אִם כֵּן לָמָּה נֶאֱמַר עַד הֶחָצֵר הַחִיצֹנָה? שֶׁכֵּוָּן שֶׁמַּגִּיעַ שָׁם הָיָה נִפְסָק:<br><br><b>מאהל מועד לאמר.<\/b> יָכוֹל מִכָּל הַבַּיִת, תַּ\"ל מֵעַל הַכַּפֹּרֶת, יָכוֹל מֵעַל הַכַּפֹּרֶת כֻּלָּהּ, תַּ\"ל מִבֵּין שְׁנֵי הַכְּרֻבִים:<br><br><b>לאמר.<\/b> צֵא וֶאֱמֹר לָהֶם דִּבְרֵי כִּבּוּשִׁין — בִּשְׁבִילְכֶם הוּא נִדְבָּר עִמִּי; שֶׁכֵּן מָצִינוּ שֶׁכָּל ל\"ח שָׁנָה שֶׁהָיוּ יִשְֹרָאֵל בַּמִּדְבָּר כִּמְנֻדִּים, מִן הַמְרַגְּלִים וָאֵילַךְ, לֹא נִתְיַחֵד הַדִּבּוּר עִם מֹשֶׁה, שֶׁנֶּאֱמַר וַיְהִי כַאֲשֶׁר תַּמּוּ כָּל אַנְשֵׁי הַמִּלְחָמָה לָמוּת … וַיְדַבֵּר ה' אֵלַי לֵאמֹר (דברים ב'), אֵלַי הָיָה הַדִּבּוּר. דָּ\"אַ צֵא וֶאֱמֹר לָהֶן דְּבָרַי וַהֲשִׁיבֵנִי אִם יְקַבְּלוּם, כְּמָה שֶׁנֶּאֱמַר וַיָּשֶׁב מֹשֶׁה אֶת דִּבְרֵי הָעָם וְגוֹ' (שמות י\"ט):", "rashi_en": "ויקרא אל משה AND [THE LORD] CALLED UNTO MOSES — All oral communications of the Lord to Moses whether they are introduced by דבר or by אמר or by צו were preceded by a call (to prepare him for the forthcoming address) (cf Sifra, Vayikra Dibbura d'Nedavah, Chapter 1 1-2). It is a way of expressing affection, the mode used by the ministering angels when addressing each other, as it is said (Isaiah 6:3) “And one called unto another [and said, Holy, holy, holy is the Lord of hosts]”. To the prophets of the nations of the world, however, God revealed himself in a manner which Scripture describes by an expression ordinarily used for denoting events of a casual character and of uncleanness, as it is said, (Numbers 23:4) “and God happened to meet (ויקר) Balaam” (the term ויקר, from the root ,קרה, is connected with מִקְרֶה which denotes “chance”, “occurrence”, and has also the meaning of “uncleanness”, by analogy with Deuteronomy 23:11: ‎לא יהיה טהור  מקרה לילה) (cf. Bereishit Rabbah 52:5).<br><br>ויקרא אל משה AND HE CALLED UNTO MOSES — This implies that the Voice went on and reached his (Moses’s) ears only but all the other Israelites did not hear it). One might think that for the subsections there was also such a call! It, however, states, “[And the Lord called unto Moses] and spake (וידבר) [to him]”, thus intimating that a דבור, a complete section had (was preceded by) a call (e. g., in our text chapters 1—4), but not the subsections. And what purpose did these subsections serve (i. e., why are the larger sections broken up into smaller ones)? To give Moses an interval for reflection between one division and another and between one subject and another — something which is all the more necessary for an ordinary man receiving instruction from an ordinary man (Sifra, Vayikra Dibbura d'Nedavah, Chapter 1 9).<br><br>אליו TO HIM — This is intended to exclude Aaron. Rabbi Judah said, “Thirteen communications in the Torah are stated, according to the wording of the text, to have been spoken to Moses and Aaron together; but corresponding to these there are thirteen which include expressions with a limitative force to teach you that they were spoken not to Aaron but to Moses only, with the view that he should communicate them to Aaron. The following are the thirteen limitations: (Numbers 7:89) “[And when Moses had come into the appointed tent] that He might speak with him, [then he heard the Voice] speaking unto him … [from between the two cherubim]: and he spoke unto him”; (Exodus 25:22) “and there I will be met by thee”; — all the thirteen instances you will find in Torath Cohanim (Sifra, Vayikra Dibbura d'Nedavah, Chapter 2 1. — I might, however, think that they (Aaron and all Israel) heard at least the sound of the Divine utterance (הדבור), even though they could not distinguish the words! However, in the text, Numbers 7:89: וישמע את הקול מדבר אליו,where it might have said לו‎...‎ ה]קול], it says אליו‎‎… ‎ה]קול], “And he heard the voice (הקול) uttering itself (מדבר) right up to him (אליו)” — consequently Moses alone heard the utterance, and all Israel did not hear it) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 2 8). <br><br>מאהל מועד FROM THE APPOINTED TENT — This teaches us that the Voice broke off and did not issue beyond the appointed tent. One might think that this was so because the Voice was a very low one! Scripture, however, states, (Numbers 7:89) “[when he entered the tent he heard] the Voice”. What does it mean by the Voice? It was the Voice that is so minutely described in Psalms, (29:4, 5) “The voice of the Lord is powerful; the voice of the Lord is full of majesty. The voice of the Lord breaketh the cedars. But if this be so (that it was a very powerful voice), why does Scripture state, “[and the Lord spoke to him] from the appointed tent” (מאהל מועד and does not state באהל מועד)? Because it intends to tell us that the Voice broke off and that it was heard only in the tent). A similar case we have in Ezekiel that a powerful sound uttered within the Temple was not heard outside: (Ezekiel 10:5) “And the sound of the cherubims’ wings was heard up to the outer court”. One might think then that the sound was a very low one! Scripture, however, continues “as the Voice of the Almighty God when He speaketh”! If this was so why, then, does Scripture state, “[it was heard] up to the outer court only”? Because when it (the sound) reached there it broke off (Sifra, Vayikra Dibbura d'Nedavah, Chapter 2 10-11).<br><br>מאהל מועד לאמר [AND THE LORD … SPOKE UNTO HIM] OUT OF THE APPOINTED TENT, SAYING — One might think from this that the Lord spoke to him from the entire house (i.e. from any part of the appointed tent)! Scripture, however, states, (Numbers 6:89) “[and he heard the Voice speaking unto him] from off the covering”. From this, again, one might think that he heard the Voice coming from off the entire covering (from any part of it)! Scripture, however, continues, “from between the two cherubim”. Consequently the words מאהל מועד cannot denote the place from which the Lord spoke to Moses, but the area within which the Voice was heard (Sifra, Vayikra Dibbura d'Nedavah, Chapter 2 12). <br><br>לאמר SAYING — This implies “Go and speak to them words that will bring them to a subdued frame of mind):‘It is for your sake that He communicates with me’!” And indeed we find this was so; for all the thirty — eight years during which Israel in the wilderness were placed, as it were, under excommunication — from the time of the incident of the spies and onwards — there was no intimate conversation of God with Moses, for it is said, (Deuteronomy 2:16, 17) “So it came to pass, when were consumed all the men of war (i. e. the men who had waged war immediately after the return of the spies; cf. Numbers 14:40—45. It was they and their generation who wandered in the wilderness as though excommunicated) … that the Lord spake unto me, saying, …” — only then was a divine communication again made to me (Sifra). Another explanation of לאמר is that it means “to speak to God”: it implies, “Go and tell them My commands and bring Me back word whether they will accept them, as it is said, (Exodus 19:8) “And Moses returned the words of the people unto the Lord (Sifra, Vayikra Dibbura d'Nedavah, Chapter 2 13)."}, {"ch": 1, "v": 2, "aliyah": 1, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם אָדָ֗ם כִּֽי־יַקְרִ֥יב מִכֶּ֛ם קׇרְבָּ֖ן לַֽיהֹוָ֑ה מִן־הַבְּהֵמָ֗ה מִן־הַבָּקָר֙ וּמִן־הַצֹּ֔אן תַּקְרִ֖יבוּ אֶת־קׇרְבַּנְכֶֽם׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֱנַשׁ אֲרֵי יְקָרֵיב מִנְּכוֹן קֻרְבָּנָא <b>קֳדָם<\/b> יְיָ מִן בְּעִירָא מִן תּוֹרֵי וּמִן עָנָא תְּקָרְבוּן יָת קֻרְבַּנְכוֹן:", "onk_en": "Speak to Bnei Yisroel and say to them; [if] a man among you will bring an offering to [<b>before<\/b>] Adonoy; of animals, cattle or sheep you should bring your offering.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֵינַשׁ דִי יִקְרַב מִנְכוֹן וְלָא מִן מוּמְרַיָא פַּלְחֵי אֱלִילְיָא קָרְבָּנָא קֳדָם יְיָ מִן בְּעִירָא דַכְיָא מִן תּוֹרֵי וּמִן עָנָא וְלָא מִן חַיְתָא תְקַרְבוּן יַת קָרְבָּנֵיכוֹן", "pj_en": "Speak with the sons of Israel, and say to them: If a man of you,-but not of the rebellious worshippers of idols,-bring an oblation before the Lord, (it must be) from the clean cattle, from the oxen or from the sheep; but not from the wild beasts may you offer your oblations.", "tj": "", "tj_en": "", "rashi": "<b>אדם כי יקריב מכם.<\/b> כְּשֶׁיַּקְרִיב; בְּקָרְבְּנוֹת נְדָבָה דִּבֵּר הָעִנְיָן:<br><br><b>אדם.<\/b> לָמָּה נֶאֱמַר? מָה אָדָם הָרִאשׁוֹן לֹא הִקְרִיב מִן הַגָּזֵל — שֶׁהַכֹּל הָיָה שֶׁלּוֹ — אַף אַתֶּם לֹא תַּקְרִיבוּ מִן הַגָּזֵל (ויקרא רבה):<br><br><b>הבהמה.<\/b> יָכוֹל אַף חַיָּה בִּכְלָל, תַּ\"לֹ בָּקָר וָצֹאן:<br><br><b>מן הבהמה.<\/b> וְלֹא כֻּלָּהּ — לְהוֹצִיא אֶת הָרוֹבֵעַ וְאֶת הַנִּרְבָּע:<br><br><b>מן הבקר.<\/b> לְהוֹצִיא אֶת הַנֶּעֱבָד:<br><br><b>מן הצאן.<\/b> לְהוֹצִיא אֶת הַמֻּקְצָה:<br><br><b>ומן הצאן.<\/b> לְהוֹצִיא אֶת הַנּוֹגֵחַ שֶׁהֵמִית; כְּשֶׁהוּא אוֹמֵר לְמַטָּה מִן הָעִנְיָן מִן הַבָּקָר — שֶׁאֵין תַּ\"ל — לְהוֹצִיא אֶת הַטְּרֵפָה (ספרא):<br><br><b>תקריבו.<\/b> מְלַמֵּד שֶׁשְּׁנַיִם מִתְנַדְּבִים עוֹלָה בְּשֻׁתָּפוּת:<br><br><b>קרבנכם.<\/b> מְלַמֵּד שֶׁהִיא בָּאָה נִדְבַת צִבּוּר, הִיא עוֹלַת קַיִץ הַמִּזְבֵּחַ, הַבָּאָה מִן הַמּוֹתָרוֹת (שבועות י\"ב):", "rashi_en": "אדם כי יקריב מכם IF A MAN OF YOU OFFER [AN OFFERING] — This means, when he offers: Scripture is speaking here of free — will offerings (cf. Sifra, Vayikra Dibbura d'Nedavah, Section 2 4).<br><br>אדם — Why is this term for “man” employed here? Since אדם also means Adam, its use suggests the following comparison: what was the characteristic of the first man (אדם הראשון)? He did not offer sacrifice of anything acquired by way of robbery, since everything was his! So you, too, shall not offer anything acquired by way of robbery (Leviticus Rabbah 2:7).<br><br>הבהמה [OF] THE BEASTS — One might think that wild beasts are also included! Scripture, however,’ goes on to state, “even of cattle or of sheep” (Sifra, Vayikra Dibbura d'Nedavah, Section 2 6).<br><br>מן הבהמה OF THE BEASTS — but not all of them: the phrase, “some of the beasts”) is used in order to exclude male and female animals with which sexual sin has been committed (Sifra, Vayikra Dibbura d'Nedavah, Section 2 7).<br><br>מן הבקר OF THE CATTLE — This serves to exclude an animal which has been worshipped as a god (Sifra, Vayikra Dibbura d'Nedavah, Section 2 9).<br><br>מן הצאן OF THE SHEEP — This serves to exclude an animal set aside for the purpose of being offered to an idol (Sifra, Vayikra Dibbura d'Nedavah, Section 2 11).<br><br>ומן הצאן AND OF THE SHEEP — The ו prefixed to the word is intended to exclude a goring ox that has killed a man. — When Scripture again says lower down in the section, (v. 3)  מן הבקר, “of the cattle”, — which word מן it was unnecessary to use, (it would have sufficed to say: 'אם עולה קרבנו זכר וכו) — it is intentionally used to exclude a טרפה (an animal afflicted with a fatal organic disease) (Sifra, Vayikra Dibbura d'Nedavah, Section 2 11).<br><br>תקריבו YE SHALL OFFER [YOUR OFFERING] — The plural תקריבו teaches us that two (or more) persons may bring a burnt offering as a free — will gift in partnership (Sifra, Vayikra Dibbura d'Nedavah, Chapter 3 1).<br><br>קרבנכם YOUR OFFERING — This teaches us) that it (the עולה) may also be offered as a free-will gift of the community (not of individuals only). This was the burnt offering bearing the name of “the summer - fruit offering”) of the altar which had to be supplied from the surplus of the levy upon the people (cf. Shevuot 12a, Shevuot 12b)."}, {"ch": 1, "v": 3, "aliyah": 1, "heb": "אִם־עֹלָ֤ה קׇרְבָּנוֹ֙ מִן־הַבָּקָ֔ר זָכָ֥ר תָּמִ֖ים יַקְרִיבֶ֑נּוּ אֶל־פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ יַקְרִ֣יב אֹת֔וֹ לִרְצֹנ֖וֹ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "אִם עֲלָתָא קֻרְבָּנֵיהּ מִן תּוֹרֵי דְּכַר שְׁלִים יְקָרְבִנֵּיהּ לִתְרַע מַשְׁכַּן זִמְנָא יְקָרֵב יָתֵיהּ לְרַעֲוָא לֵיהּ קֳדָם יְיָ:", "onk_en": "If his offering is a burnt-offering of cattle he shall bring an unblemished male; to the entrance of the Tent of Meeting he shall bring it, that it be favorably accepted from him before Adonoy.", "pj": "אִין עֲלָתָא הוּא קוּרְבָּנֵיהּ מִן תּוֹרֵי דְּכַר שְׁלִים יְקַרְבִינֵיהּ לִתְרַע מַשְׁכַּן זִמְנָא יַקְרִיב יָתֵיהּ לְרַעֲוָא עֲלוֹי קֳדָם יְיָ", "pj_en": "If his oblation be a burnt offering of oxen, he shall bring a male unblemished to the door of the tabernacle of ordinance, and offer him to be accepted for himself before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>זכר.<\/b> וְלֹא נְקֵבָה; כְּשֶׁהוּא אוֹמֵר זָכָר לְמַטָּה — שֶׁאֵין תַּ\"לֹ — זָכָר וְלֹא טֻמְטוּם וְאַנְדְּרוֹגִינוֹס:<br><br><b>תמים.<\/b> בְּלֹא מוּם:<br><br><b>אל פתח אהל מועד.<\/b> מְטַפֵּל בַּהֲבָאָתוֹ עַד הָעֲזָרָה; מַהוּ אוֹמֵר יַקְרִיב יַקְרִיב? אֲפִלּוּ נִתְעָרְבָה עוֹלַת רְאוּבֵן בְּעוֹלַת שִׁמְעוֹן יַקְרִיב כָּל אֶחָד לְשֵׁם מִי שֶׁהוּא, וְכֵן עוֹלָה בְּחֻלִּין, יִמָּכְרוּ הַחֻלִּין לְצָרְכֵי עוֹלוֹת, וַהֲרֵי הֵן כֻּלָּן עוֹלוֹת, וְתִקְרַב כָּל אֶחָד לְשֵׁם מִי שֶׁהוּא; יָכוֹל אֲפִלּוּ נִתְעָרְבָה בִּפְסוּלִין אוֹ בְּשֶׁאֵינוֹ מִינוֹ, תַּלְמוּד לוֹמַר \"יַקְרִיבֶנּוּ\" (ספרא):<br><br><b>יקריב אתו.<\/b> מְלַמֵּד שֶׁכּוֹפִין אוֹתוֹ, יָכוֹל בְּעַל כָּרְחוֹ, תַּלְמוּד לוֹמַר \"לִרְצוֹנוֹ\", הָא כֵּיצַד? כּוֹפִין אוֹתוֹ עַד שֶׁיֹּאמַר רוֹצֶה אֲנִי (שם):<br><br><b>לפני ה' וסמך.<\/b> אֵין סְמִיכָה בְּבָמָה (שם):", "rashi_en": "זכר A MALE, but not a female. When Scripture mentions again lower down. (v. 10) that the sacrifice shall be זכר, a male, — which appears unnecessary to state, — it intends to say: a male, but not an animal whose sex is indeterminate or which is a hermaphrodite (Sifra, Vayikra Dibbura d'Nedavah, Section 3 9; Bekhorot 41b).<br><br>תמים means WITHOUT BLEMISH,<br><br>אל פתח אהל מועד [HE SHALL BRING IT NEAR] UNTO THE ENTRANCE OF THE APPOINTED TENT — He himself must attend to bringing it right up to the forecourt (where it is handed over to the priests). What is the force of Scripture using the term יקריב twice (יקריבנו and יקריב אתו; it might suffice to say:‎תמים זכר ‎'יקריבנו אל פתח אהל מועד לרצונו וכו‎)?! It is intended to intimate that even in case the burnt offering of Reuben has become mixed up with that of Simeon so that they cannot be identified, nevertheless each must bring one of the animals to the forecourt on behalf of him to whom it really belongs). Similarly if a burnt offering has been mixed up with non-consecrated animals, the non — consecrated ones must be sold for עולה purposes (they are sold to people who have voluntarily undertaken to offer an עולה), and thus all of them become burnt offerings and each is now brought on behalf of him to whom it belongs (cf. Mishna Zevachim 8:1). One might think that this must also be done if it (an animal intended to be a burnt offering) became mixed up with animals unfit for sacrifice (with those mentioned above as excluded from the category of sacrifices) or with a different kind of sacrifices (e.g., peace — offerings)! Scripture. however, states,יקריבנו, “he shall bring it) (Sifra, Vayikra Dibbura d'Nedavah, Section 3 13).<br><br>יקריב אתו HE SHALL OFFER IT — This apparently superfluous word (אתו) teaches us that they (the בי\"ד) must put pressure upon him to bring it if he is remiss in bringing the sacrifice he had promised. One might think that this means that they shall force him against his will! Scripture, however, states, לרצונו “[he must bring it] so that it shall be favourably accepted for him”. How is this possible? They press him until he says, “I wish to do it” (Sifra, Vayikra Dibbura d'Nedavah, Section 3 15).<br><br>‎'לפני ה‎ וסמך [HE SHALL OFFER] IT …] BEFORE THE LORD (4) AND HE SHALL LAY [HIS HAND UPON THE HEAD OF THE SACRIFICE] - This implies that there is no \"laying of hands\" upon an animal sacrifice on a private \"high place\" (במה; at the time when sacrifice was permissible on such) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 4 1) "}, {"ch": 1, "v": 4, "aliyah": 1, "heb": "וְסָמַ֣ךְ יָד֔וֹ עַ֖ל רֹ֣אשׁ הָעֹלָ֑ה וְנִרְצָ֥ה ל֖וֹ לְכַפֵּ֥ר עָלָֽיו׃", "onk": "וְיִסְמוֹךְ יְדֵיהּ עַל רֵישׁ עֲלָתָא וְיִתְרְעֵי לֵיהּ לְכַפָּרָא עֲלוֹהִי:", "onk_en": "He shall lay his hand on the head of the burnt-offering and it will be favorably accepted from him to achieve his atonement.", "pj": "וְיִסְמוֹךְ בְּתוּקְפָא יַד יְמִינֵיהּ עַל רֵישׁ עֲלָתָא מְטוּל דְיִתְרְעֵי לֵיהּ לְכַפָּרָא עֲלוֹי", "pj_en": "And he shall lay his right hand with firmness upon the head of the sacrifice, that it may be acceptable from him to propitiate on his behalf.", "tj": "", "tj_en": "", "rashi": "<b>על ראש העלה.<\/b> לְהָבִיא עוֹלַת חוֹבָה לִסְמִיכָה וּלְהָבִיא עוֹלַת הַצֹּאן (שם):<br><br><b>העלה.<\/b> פְּרָט לְעוֹלַת הָעוֹף (שם):<br><br><b>ונרצה לו.<\/b> עַל מָה הוּא מְרַצֶּה לוֹ? אִם תֹּאמַר עַל כָּרֵתוֹת וּמִיתוֹת בֵּית דִּין אוֹ מִיתָה בִּידֵי שָׁמַיִם אוֹ מַלְקוּת, הֲרֵי עָנְשָׁן אָמוּר, הָא אֵינוֹ מְרַצֶּה אֶלָּא עַל עֲשֵֹה וְעַל לָאו שֶׁנִּתַּק לַעֲשֵֹה (שם):", "rashi_en": "על ראש העולה UPON THE HEAD OF THE BURNT OFFERING — This is intended to include an obligatory burnt offering also in the law of סמיכה (laying hands on the head of the sacrifice) as well as to include a sheep that is offered as a free — will burnt offering (Sifra, Vayikra Dibbura d'Nedavah, Chapter 4 3-5).<br><br>העלה THE BURNT OFFERING — This implies the exclusion of a bird offered as a burnt offering (Sifra, Vayikra Dibbura d'Nedavah, Chapter 4 7).<br><br>‎ ונרצה לו AND PROPITIATION SHALL BE EFFECTED FOR HIM — For what kind of sins does it (the עולת נדבה) effect propitiation for him? Should you say, “for such as make him liable to excision, or to execution by the court, or to the death penalty through the Heavenly Judge, or to lashes, surely, you see that the punishment for those sins is expressly stated and it is that and not the sacrifice which effects propitiation! Consequently it can only propitiate for the neglect of a positive command and for the transgression of  “a prohibition transformed into a positive command” (לאו הניתק לעשה, a prohibitive law the transgression of which can be repaired by a succeeding act) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 4 8)."}, {"ch": 1, "v": 5, "aliyah": 1, "heb": "וְשָׁחַ֛ט אֶת־בֶּ֥ן הַבָּקָ֖ר לִפְנֵ֣י יְהֹוָ֑ה וְ֠הִקְרִ֠יבוּ בְּנֵ֨י אַהֲרֹ֤ן הַכֹּֽהֲנִים֙ אֶת־הַדָּ֔ם וְזָרְק֨וּ אֶת־הַדָּ֤ם עַל־הַמִּזְבֵּ֙חַ֙ סָבִ֔יב אֲשֶׁר־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיִכּוֹס יָת בַּר תּוֹרֵי קֳדָם יְיָ וִיקָרְבוּן בְּנֵי אַהֲרֹן כָּהֲנַיָּא יָת דְּמָא וְיִזְרְקוּן יָת דְּמָא עַל מַדְבְּחָא סְחוֹר סְחוֹר דִּי בִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "He shall slaughter the calf before Adonoy and the sons of Aharon, the <i>kohanim,<\/i> will bring the blood and they will sprinkle the blood all around the altar, which is at the entrance of the Tent of Meeting.", "pj": "וְיִכּוֹס טַבְּחָא בְּבֵית מַטְבְּחַיָא יַת בַּר תּוֹרֵי קֳדָם יְיָ וְיִקְרְבוּן בְּנֵי אַהֲרן כַּהֲנָא יַת אַדְמָא בְּמָנַיָא וְיִדְרְקוּן יַת אַדְמָא בְּמִזְרְקַיָא עַל מַדְבְּחָא חֲזוֹר חֲזוֹר דְבִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And the slayer shall kill the ox at the place of slaughter before the Lord, and the sons of Aharon the priest shall bring the blood in vessels, and sprinkle the blood which is in the basins round about the altar that is at the door of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>ושחט והקריבו, הכהנים.<\/b> מִקַּבָּלָה וָאֵילַךְ מִצְוַת כְּהֻנָּה — לִמֵּד עַל הַשְּׁחִיטָה שֶׁכְּשֵׁרָה בְּזָר (שם):<br><br><b>לפני ה'.<\/b> בַּעֲזָרָה:<br><br><b>והקריבו.<\/b> זוֹ קַבָּלָה, שֶׁהִיא הָרִאשׁוֹנָה, וּמַשְׁמָעָהּ לְשׁוֹן הוֹלָכָה, לָמַדְנוּ שְׁתֵּיהֶן:<br><br><b>בני אהרן.<\/b> יָכוֹל חֲלָלִים, תַּ\"ל הַכֹּהֲנִים:<br><br><b>את הדם וזרקו את הדם.<\/b> מַה תַּ\"ל דָּם דָּם שְׁנֵי פְּעָמִים? לְהָבִיא אֶת שֶׁנִּתְעָרֵב בְּמִינוֹ אוֹ בְּשֶׁאֵינוֹ מִינוֹ, יָכוֹל אַף בִּפְסוּלִים אוֹ בְּחַטָּאוֹת הַפְּנִימִיּוֹת אוֹ בְּחַטָּאוֹת הַחִיצוֹנִיּוֹת, שֶׁאֵלּוּ לְמַעְלָה וְהִיא לְמַטָּה, תַּ\"ל בְּמָקוֹם אַחֵר דָּמוֹ (זבחים פ\"א):<br><br><b>וזרקו.<\/b> עוֹמֵד לְמַטָּה וְזוֹרֵק מִן הַכְּלִי לְכֹתֶל הַמִּזְבֵּחַ לְמַטָּה מִחוּט הַסִּקְרָא כְּנֶגֶד הַזָּוִיּוֹת, לְכָךְ נֶאֱמַר סָבִיב — שֶׁיְּהֵא הַדָּם נָתוּן בְּאַרְבַּע רוּחוֹת הַמִּזְבֵּחַ; אוֹ יָכוֹל יַקִּיפֶנּוּ כְּחוּט, תַּ\"ל וְזָרְקוּ וְאִי אֶפְשַׁר לְהַקִּיף בִּזְרִיקָה, אִי וְזָרְקוּ יָכוֹל בִּזְרִיקָה אַחַת, תַּ\"ל סָבִיב, הָא כֵּיצַד? נוֹתֵן שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע (ספרא):<br><br><b>אשר פתח אהל מועד.<\/b> וְלֹא בִּזְמַן שֶׁהוּא מְפֹרָק (שם):", "rashi_en": "הכהנים …‎ושחט  …והקריבו  AND HE SHALL SLAUGHTER … AND THE PRIESTS SHALL OFFER [THE BLOOD] — All the rites from “receiving the blood in a vessel” (which is implied in והקריבו) and onwards are the duty of the priesthood. This teaches about the slaughtering that it is valid even if performed by a layman (Sifra, Vayikra Dibbura d'Nedavah, Section 4 2; Zevachim 32a). <br><br>'‎לפני ה‎‎‎  means in the forecourt.<br><br>והקריבו AND [THE PRIESTS] SHALL OFFER [THE BLOOD] — This must refer to “receiving the blood in a vessel”, since this is the first rite mentioned after the slaughtering of the animal, but really it implies the bringing of the blood to the altar; we thus learn that both of them (receiving of the blood and bringing it to the altar) as well as all the succeeding rites are priestly duties (cf. Zevachim 4a):<br><br>בני אהרן — One might think that these duties may be performed also by חללים (priests who have lost their priestly status for reasons connected with their birth or marriage)! Scripture, however, adds הכהנים, the priests (i.e. they must not only be descendants of Aaron but also “priests” — fit for priesthood, and חללים are excluded from priestly functions) (Sifra, Vayikra Dibbura d'Nedavah, Section 4 6).<br><br>את הדם …וזרקו את הדם [AND THE PRIESTS … SHALL OFFER] THE BLOOD AND SHALL SPRINKLE THE BLOOD — Why does Scripture use the word דם twice (instead of saying והקריבו את הדם וזרקוהו)? In order to include in the command of sprinkling also the blood of an עולה which has been commingled with blood of the same kind of sacrifice (i. e. with the blood of another burnt offering) or with that of a different kind (that of a peace — offering or a guilt — offering). One might think that this law applies also if it has been commingled with that of sacrifices unfit for sacrifice or with that of sin — offerings whose blood has to be sprinkled in the “Interior’ (the Holy Place) or with that of sin — offerings whose blood has to be sprinkled outside (in the court), although these (i. e., the blood of the (חטאות פנימיות וחיצוניות)  has to be sprinkled above the red line (that marks the division between the upper and the lower halves of the altar) and it (the blood of the עולה) below! Scripture, however, states of an עולה in another place (v. 11) ‘‘[and he shall sprinkle] its blood (דמו)” (cf. Sifra, Vayikra Dibbura d'Nedavah, Section 4 7-8; Zevachim 81).<br><br>וזרקו AND [THE PRIESTS] … SHALL DASH [THE BLOOD ROUND ABOUT] — He (the priest) stands below and dashes the blood from the vessel upon the altar wall below the red line over against the two diagonally opposite corners (the north — east and the south — west corners so that there is blood on the four sides). That is what Scripture means when it says, סביב, “round about” — that the blood shall be put upon all the four sides of the altar. Or I might think that it means he (the priest) shall place it (the blood) right round the altar as a line! Scripture, however, states, וזרקו, “and they shall dash [the blood]” (i. e. fling it; cf. Exodus 9:8; thus implying that he must be standing some distance away), and it is impossible to put it right round the altar by flinging it against it. — The explanation given above as to how it was actually done is arrived at by the following argument: If we go only by the meaning of the word וזרקו alone, one might have thought that it would suffice with one “flinging” only (that we need merely fling the blood against one side of the altar)! Scripture, however, adds סביב, “round about”! How then can this be done? He makes two flingings but in such a manner that they virtually constitute four, as stated above). (Sifra, Vayikra Dibbura d'Nedavah, Section 4 9)<br><br>אשר פתח אוהל מועד {AND THEY SHALL SPRINKLE THE BLOOD ROUND ABOUT THE ALTAR} THAT IS BY THE ENTRANCE OF THE APPOINTED TENT — but not at times when it (the appointed tent) had already been dismantled, even though the altar itself were still in position, for then it is not by the entrance of the appointed tent (Sifra, Vayikra Dibbura d'Nedavah, Section 4 14)."}, {"ch": 1, "v": 6, "aliyah": 1, "heb": "וְהִפְשִׁ֖יט אֶת־הָעֹלָ֑ה וְנִתַּ֥ח אֹתָ֖הּ לִנְתָחֶֽיהָ׃", "onk": "וְיַשְׁלַח יָת עֲלָתָא וִיפַלֵּג יָתַהּ <b>לְאֶבְרָהָא<\/b>:", "onk_en": "He shall skin the burnt-offering and cut it into its pieces [<b>limbs<\/b>].", "pj": "וְיַשְׁלַח יַת מַשְׁכָא מִן עֲלָתָא וְיִפְסַג יָתָהּ לְפִסְגָהָא", "pj_en": "And he shall take away the skin from the sacrifice, and divide him according to his members.", "tj": "וְיַחְלֵישׁ יַת עֲלָתָא וְיִפְסַג יָתָהּ לְפִסְגָהָא:", "tj_en": "And he shall skin the holocaust, and divide him by his members.", "rashi": "<b>והפשיט וגו'.<\/b> מַה תַּלְמוּד לוֹמַר הָעוֹלָה? לְרַבּוֹת אֶת כָּל הָעוֹלוֹת לְהֶפְשֵׁט וְנִתּוּחַ:<br><br><b>אתה לנתחיה.<\/b> וְלֹא נְתָחֶיהָ לִנְתָחִים (ספרא):", "rashi_en": "'‎והפשיט וגו‎ AND HE SHALL FLAY [THE BURNT OFFERING] — Why does it state “the burnt offering” (instead of merely saying, והפשיטה, “and he shall flay it”)? In order to include all burnt offerings (i. e. all עולות בהמה, whether they be free — will or obligatory, whether they are taken מן הבקר or מן הצאן, whether brought by a man or by a woman, by a free Israelite or by an Israelite עבד) in the law of flaying and dismembering (Sifra, Vayikra Dibbura d'Nedavah, Chapter 5 2; cf. Note 3 on העולה v. 4).<br><br>אתה לנתחיה AND HE SHALL SEVER IT INTO ITS PIECES — he shall sever it etc. but not its pieces again into smaller pieces (Sifra, Vayikra Dibbura d'Nedavah, Chapter 5 7)."}, {"ch": 1, "v": 7, "aliyah": 1, "heb": "וְ֠נָתְנ֠וּ בְּנֵ֨י אַהֲרֹ֧ן הַכֹּהֵ֛ן אֵ֖שׁ עַל־הַמִּזְבֵּ֑חַ וְעָרְכ֥וּ עֵצִ֖ים עַל־הָאֵֽשׁ׃", "onk": "וְיִתְּנוּן בְּנֵי אַהֲרֹן כַּהֲנָא אֶשָּׁתָא עַל מַדְבְּחָא וִיסַדְּרוּן אָעַיָּא עַל אֶשָּׁתָא:", "onk_en": "The sons of Aharon the <i>kohein<\/i> shall place [ignite] a fire on the altar and they shall arrange logs on the fire.", "pj": "וִינָתְנוּן בְּנֵי אַהֲרן אֵשָׁתָא עַל מַדְבְּחָא וִיסַדְרוּן קֵיסִין עַל אֵישָׁתָא", "pj_en": "And the sons of Aharon the priest shall put fire upon the altar, and lay wood in order upon the fire;", "tj": "", "tj_en": "", "rashi": "<b>ונתנו … אש.<\/b> אַעַ\"פִּי שֶׁהָאֵשׁ יוֹרֶדֶת מִן הַשָּׁמַיִם מִצְוָה לְהָבִיא מִן הַהֶדְיוֹט (שם):<br><br><b>בני אהרן הכהן.<\/b> כְּשֶׁהוּא בְּכִהוּנוֹ, הָא אִם עָבַד בְּבִגְדֵי כֹּהֵן הֶדְיוֹט עֲבוֹדָתוֹ פְּסוּלָה:", "rashi_en": "אש … ‎ונתנו AND [THE SONS OF AARON …] SHALL PUT FIRE [ON THE ALTAR] — Although the fire descended from heaven, it was nevertheless a religious duty to bring also some fire of profane origin (Sifra, Vayikra Dibbura d'Nedavah, Chapter 5 10; Yoma 21b; cf. Rashi on Leviticus 10:2 and Note thereon).<br><br>בני אהרן הכהן THE SONS OF AARON THE PRIEST — They shall place the fire on the altar as sons of Aaron the priest: implying that Aaron should always minister in his priestly dignity (i. e. when attired in his priestly garments), consequently if he officiated in the garments of an ordinary priest his service is invalid (Sifra, Vayikra Dibbura d'Nedavah, Chapter 5 9; Zevachim 18a)."}, {"ch": 1, "v": 8, "aliyah": 1, "heb": "וְעָרְכ֗וּ בְּנֵ֤י אַהֲרֹן֙ הַכֹּ֣הֲנִ֔ים אֵ֚ת הַנְּתָחִ֔ים אֶת־הָרֹ֖אשׁ וְאֶת־הַפָּ֑דֶר עַל־הָעֵצִים֙ אֲשֶׁ֣ר עַל־הָאֵ֔שׁ אֲשֶׁ֖ר עַל־הַמִּזְבֵּֽחַ׃", "onk": "וִיסַדְּרוּן בְּנֵי אַהֲרֹן כָּהֲנַיָּא יָת <b>אֶבְרַיָּא<\/b> יָת רֵישָׁא וְיָת תַּרְבָּא עַל אָעַיָּא דִּי עַל אֶשָׁתָא דִּי עַל מַדְבְּחָא:", "onk_en": "The sons of Aharon, the <i>kohanim,<\/i> shall arrange the pieces [<b>limbs<\/b>], the head and the fat on the logs which are on the fire that is on the altar.", "pj": "וִיסַדְרוּן בְּנֵי אַהֲרן כַּהֲנַיָא יַת פַּסְגַיָא יַת רֵישָׁא וְיַת פְּרִיסוּתָא דְתַרְבָּא עַל קֵיסִין דְעַל אֵישָׁתָא דְעַל מַדְבְּחָא", "pj_en": "and the priests the sons of Aharon shall lay the members in order and the heart and the covering of the fat upon the wood that is on the fire upon the altar.", "tj": "", "tj_en": "", "rashi": "<b>בני אהרן הכהנים.<\/b> כְּשֶׁהֵם בְּכִהוּנָם, הָא כֹּהֵן הֶדְיוֹט שֶׁעָבַד בִּשְׁמוֹנָה בְּגָדִים עֲבוֹדָתוֹ פְּסוּלָה (זבחים י\"ח):<br><br><b>את הנתחים את הראש.<\/b> לְפִי שֶׁאֵין הָרֹאשׁ בִּכְלַל הֶפְשֵׁט, שֶׁכְּבָר הֻתַּז בִּשְׁחִיטָה, לְפִיכָךְ הֻצְרַךְ לִמְנוֹתוֹ לְעַצְמוֹ (חולין כ\"ז):<br><br><b>ואת הפדר.<\/b> לָמָּה נֶאֱמַר? לְלַמֶּדְךָ שֶׁמַּעֲלֵהוּ עִם הָרֹאשׁ וּמְכַסֶּה בּוֹ אֶת בֵּית הַשְּׁחִיטָה, וְזֶהוּ דֶּרֶךְ כָּבוֹד שֶׁל מַעְלָה (שם):<br><br><b>אשר על המזבח.<\/b> שֶׁלֹּא יִהְיוּ הַגְּזִירִין יוֹצְאִין חוּץ לַמַּעֲרָכָה (ספרא):", "rashi_en": "בני אהרן הכהנים THE SONS OF AARON THE PRIESTS — i e. only as priests : when they are ministering in their priestly dignity; but if an ordinary priest officiates in the eight garments of the High Priest his service is invalid (Sifra, Vayikra Dibbura d'Nedavah, Chapter 5 9; Zevachim 18a).<br><br>את הראש את הנתחים [AND THE PRIESTS … SHALL SET] THE PIECES, THE HEAD etc. [IN ORDER] — Since the head was not included in the law prescribing flaying (v. 6) as it was already as good as cut off by the act of slaughter, it therefore was necessary to enumerate it separately here since Scripture wishes every part of the animal to be put on the altar (cf. Sifra, Vayikra Dibbura d'Nedavah, Chapter 6 3; Chullin 27a).<br><br>ואת הפדר AND THE FAT — Why is this mentioned separately (is it not included in the word הנתחים)? In order to teach you that he must bring it up on the altar together with the head, and that with it he must cover the throat of the animal (בית השחיטה, lit., the place where the act of slaughter was performed). This (covering the cut in the throat) was done in way of regard for God on high (Chullin 27a).<br><br>אשר על המזבח WHICH IS UPON THE ALTAR — upon the altar: this implies that the logs of wood must not project beyond the woodpile (מערכה) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 6 5)."}, {"ch": 1, "v": 9, "aliyah": 1, "heb": "וְקִרְבּ֥וֹ וּכְרָעָ֖יו יִרְחַ֣ץ בַּמָּ֑יִם וְהִקְטִ֨יר הַכֹּהֵ֤ן אֶת־הַכֹּל֙ הַמִּזְבֵּ֔חָה עֹלָ֛ה אִשֵּׁ֥ה רֵֽיחַ־נִיח֖וֹחַ לַֽיהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְגַוֵיהּ וּכְרָעוֹהִי יְחַלֵּל בְּמַיָּא וְיַסֵּק כַּהֲנָא יָת כּוֹלָא לְמַדְבְּחָא עֲלָתָא <b>קֻרְבַּן דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "He shall wash its innards and its legs in water; and the <i>kohein<\/i> shall burn it all on the altar [for the purpose of] a burnt-offering, a fire-offering [<b>an offering<\/b>] of pleasing fragrance to [<b>which is accepted with favor before<\/b>] Adonoy.", "pj": "וּכְרִיסָא וְרִיגְלוֹי יְחַלֵיל בְּמַיָא וְיִסַק כַּהֲנָא יַת כּוֹלָא לְמַדְבְּחָא עֲלָתָא הוּא קָרְבַּן דְמִתְקַבֵּיל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "And he shall wash the inwards and his legs with water; and the priest shall offer the whole upon the altar of burnt offering an oblation to be accepted with grace before the Lord.", "tj": "ירחץ יִשְׁזָג:", "tj_en": "And he shall wash.", "rashi": "<b>עלה.<\/b> לְשֵׁם עוֹלָה יַקְטִירֶנּוּ:<br><br><b>אשה.<\/b> כְּשֶׁיִּשְׁחֲטֶנּוּ יְהֵי שׁוֹחֲטוֹ לְשֵׁם הָאֵשׁ; וְכָל אִשֶּׁה לְשׁוֹן אֵשׁ, פוש\"ייר בְּלַעַז:<br><br><b>ניחוח.<\/b> נַחַת רוּחַ לְפָנַי, שֶׁאָמַרְתִּי וְנַעֲשָֹה רְצוֹנִי (שם):", "rashi_en": "עלה [AND THE PRIEST SHALL CAUSE ALL TO ASCEND IN FUMES ON THE ALTAR, TO BE] A BURNT OFFERING — i. e. only with the intention that it should be an עולה shall he burn it (and not that it should be an offering of another class. The words are to be translated: he shall burn it as an עולה) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 6 10).<br><br>אשה AS A FIRE OFFERING — When he slaughters it he shall slaughter it with the intention of making a fire of it (i. e. having in mind the fact that it is to become a prey to the flames, not that it will become charred flesh) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 6 10). The word אשה wherever it occurs, is connected with אש, feuchère in O. F. <br><br>ניחוח (of the root נוח, “to repose”, “to draw satisfaction from …”) — an odour of ניחוח: one that causes satisfaction to Me by the knowledge that I gave commands and that My will was executed (Sifra, Vayikra Dibbura d'Nedavah, Chapter 6 10; Zevachim 46b)."}, {"ch": 1, "v": 10, "aliyah": 1, "heb": "וְאִם־מִן־הַצֹּ֨אן קׇרְבָּנ֧וֹ מִן־הַכְּשָׂבִ֛ים א֥וֹ מִן־הָעִזִּ֖ים לְעֹלָ֑ה זָכָ֥ר תָּמִ֖ים יַקְרִיבֶֽנּוּ׃", "onk": "וְאִם מִן עָנָא קֻרְבָּנֵיהּ מִן אִמְּרַיָּא אוֹ מִן בְּנֵי עִזַיָּא לַעֲלָתָא דְּכַר שְׁלִים יְקָרְבִינֵיהּ:", "onk_en": "If his offering is from flocks of sheep—of lambs or of goats—for a burnt-offering, he shall bring an unblemished male.", "pj": "וְאִין מִן בְּנֵי עָנָא קוּרְבָּנֵיהּ מִן אִמְרַיָא אוֹ מִן בְּנֵי עִיזַיָא לַעֲלָתָא דְכַר שְׁלִים יְקַרְבִינֵיהּ", "pj_en": "And if his oblation be of the flock, whether of the lambs or of the young goats, he shall bring a male unblemished.", "tj": "", "tj_en": "", "rashi": "<b>ואם מן הצאן.<\/b> וי\"ו מוֹסִיף עַל עִנְיָן רִאשׁוֹן, וְלָמָּה הֻפְסַק? לִתֵּן רֶוַח לְמֹשֶׁה לְהִתְבּוֹנֵן בֵּין פָּרָשָׁה לְפָרָשָׁה (שם):<br><br><b>מן הצאן, מן הכשבים, מן העזים.<\/b> הֲרֵי אֵלּוּ ג' מִעוּטִין — פְּרָט לְזָקֵן וּלְחוֹלֶה וְלִמְזֹהָם (שם):", "rashi_en": "ואם מן הצאן AND IF [HIS OFFERING BE] OF THE SHEEP — The ו (of אם) adds something to the former subject (i. e. shows that this is a continuation of it). Why, then, is there a break between the two paragraphs (i. e. why does the following form a separate paragraph)? In order to give Moses an interval between the one section and the next section to reflect upon what has already been said (Sifra, Vayikra Dibbura d'Nedavah, Section 5 1).<br><br>מן הצאן, מן הכבשים, מן העזים — You have here these three words of limitating force (the three — fold “מן”; cf. Note on v. 1); they serve respectively to exclude an old, a sick and a malodorous animal from those that may be sacrificed (Sifra, Vayikra Dibbura d'Nedavah, Section 5 2; Bekhorot 41a)."}, {"ch": 1, "v": 11, "aliyah": 1, "heb": "וְשָׁחַ֨ט אֹת֜וֹ עַ֣ל יֶ֧רֶךְ הַמִּזְבֵּ֛חַ צָפֹ֖נָה לִפְנֵ֣י יְהֹוָ֑ה וְזָרְק֡וּ בְּנֵי֩ אַהֲרֹ֨ן הַכֹּהֲנִ֧ים אֶת־דָּמ֛וֹ עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְיִכּוֹס יָתֵיהּ עַל צִדָּא דְמַדְבְּחָא צִפּוּנָא קֳדָם יְיָ וְיִזְרְקוּן בְּנֵי אַהֲרֹן כָּהֲנַיָּא יָת דְּמֵיהּ עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He shall slaughter it on the north side of the altar before Adonoy; and the sons of Aharon, the <i>kohanim,<\/i> will sprinkle its blood all around the altar.", "pj": "וְיִכּוֹס יָתֵיהּ טַבְּחָא עַל שִׁיפּוּלֵי מַדְבְּחָא בִּסְטַר צִיפּוּנָא קֳדָם יְיָ וְיִדְרְקוּן בְּנֵי אַהֲרן כַּהֲנַיָא יַת אַדְמֵיהּ בְּמִזְרְקַיָא עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And the slayer shall kill it at the foot of the altar on the north side, before the Lord, and the priests the sons of Aharon shall sprinkle the blood that is in the basins upon the altar round about.", "tj": "", "tj_en": "", "rashi": "<b>על ירך המזבח.<\/b> עַל צַד הַמִּזְבֵּחַ:<br><br><b>צפנה לפני ה'.<\/b> וְאֵין צָפוֹן בְּבָמָה (שם):", "rashi_en": "על ירך המזבח means ON THE SIDE OF THE ALTAR (cf. Rashi on Exodus 40:22).<br><br>'צפנה לפני ה NORTHWARD BEFORE THE LORD — but the law of slaughtering northward is not necessarily applicable in the case of a “Bamah” (i. e. an animal offered on a “Bamah” as an עולה need not be slaughtered at its north side, for it states here: northward before the Lord, the last words being used only of the Tabernacle and the Temple; cf. Zevachim 119b and Rashi on 'לפני ה‎ וסמך, v. 3)."}, {"ch": 1, "v": 12, "aliyah": 1, "heb": "וְנִתַּ֤ח אֹתוֹ֙ לִנְתָחָ֔יו וְאֶת־רֹאשׁ֖וֹ וְאֶת־פִּדְר֑וֹ וְעָרַ֤ךְ הַכֹּהֵן֙ אֹתָ֔ם עַל־הָֽעֵצִים֙ אֲשֶׁ֣ר עַל־הָאֵ֔שׁ אֲשֶׁ֖ר עַל־הַמִּזְבֵּֽחַ׃", "onk": "וִיפַלֵּג יָתֵיהּ <b>לְאֵבָרוֹהִי<\/b> וְיָת רֵישֵׁיהּ וְיָת תַּרְבֵּיהּ וְיַסְדַּר כַּהֲנָא יָתְהוֹן עַל אָעַיָּא דִּי עַל אֶשָּׁתָא דִּי עַל מַדְבְּחָא:", "onk_en": "He shall sever it into its pieces [<b>limbs<\/b>]—and its head, and [remove] its fats; and the <i>kohein<\/i> shall arrange them on the logs which are on the fire that is on the altar.", "pj": "וּפַיְיסִיג יָתֵיהּ לְפַסְגוֹי וְיַת רֵישֵׁיהּ וְיַת גוּפֵיהּ וִיסַדֵר כַּהֲנָא יַתְהוֹן עַל קֵיסִין דְעַל אֵישָׁתָא דְעַל מַדְבְּחָא", "pj_en": "And he shall divide it by its members, its head and its body, and the priest shall set them in order on the wood which is upon the fire on the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 13, "aliyah": 1, "heb": "וְהַקֶּ֥רֶב וְהַכְּרָעַ֖יִם יִרְחַ֣ץ בַּמָּ֑יִם וְהִקְרִ֨יב הַכֹּהֵ֤ן אֶת־הַכֹּל֙ וְהִקְטִ֣יר הַמִּזְבֵּ֔חָה עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְגַוָּא וּכְרָעַיָּא יְחַלֵּל בְּמַיָּא וִיקָרֵב כַּהֲנָא יָת כּוֹלָא וְיַסֵּק לְמַדְבְּחָא עֲלָתָא הוּא <b>קֻרְבַּן דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "He shall wash the innards and feet in water and the <i>kohein<\/i> shall bring it all and burn it on the altar. It is a burnt-offering; a fire-offering [<b>an offering<\/b>] of pleasing fragrance to [<b>which is accepted with favor before<\/b>] Adonoy.", "pj": "וּכְרֵיסָא וְרִיגְלוֹי יְחַלֵיל בְּמַיָא וִיקָרֵיב כַּהֲנָא יַת כּוֹלָא וְיַסֵיק לְמַדְבְּחָא עֲלָתָא הוּא קוּרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "And the inwards and his legs he shall wash with water, and the priest shall offer the whole and burn it at the altar of burnt sacrifice; it is an offering to be received with grace before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 14, "aliyah": 2, "heb": "וְאִ֧ם מִן־הָע֛וֹף עֹלָ֥ה קׇרְבָּנ֖וֹ לַֽיהֹוָ֑ה וְהִקְרִ֣יב מִן־הַתֹּרִ֗ים א֛וֹ מִן־בְּנֵ֥י הַיּוֹנָ֖ה אֶת־קׇרְבָּנֽוֹ׃", "onk": "וְאִם מִן עוֹפָא עֲלָתָא קֻרְבָּנֵיהּ קֳדָם יְיָ וִיקָרֵב מִן שַׁפְנִינַיָּא אוֹ מִן בְּנֵי יוֹנָה יָת קֻרְבָּנֵיהּ:", "onk_en": "If his burnt-offering to [<b>before<\/b>] Adonoy is of fowl, he shall bring either turtledoves or the young pigeons [as] his offering.", "pj": "וְאִם מִן עוֹפָא עֲלָתָא קוּרְבָּנֵיהּ קֳדָם יְיָ וִיקָרֵב מִן שַׁפְנִינַיָא אוֹ מִן בְּנֵי יוֹנַיָא יַת קוּרְבָּנֵיהּ בְּרַם שַׁפְנִינַיָא יַקְרִיב מִן רַבְרְבִין וּבְנֵי יוֹנַיָא מִן גוֹזְלִין", "pj_en": "And if his oblation before the Lord be of birds he shall bring his oblation from the turtle doves or the young Of pigeons; but of the turtle doves he shall bring the largest, and of the pigeons the young ones.", "tj": "", "tj_en": "", "rashi": "<b>מן העוף.<\/b> וְלֹא כָּל הָעוֹף; לְפִי שֶׁנֶּאֱמַר תָּמִים זָכָר בַּבָּקָר בַּכְּשָׂבִים וּבָעִזִּים — תַּמּוּת וְזַכְרוּת בִּבְהֵמָה וְאֵין תַּמּוּת וְזַכְרוּת בְּעוֹפוֹת — יָכוֹל אַף מְחֻסַּר אֵבֶר, תַּ\"ל מִן הָעוֹף (שם):<br><br><b>תרים.<\/b> גְּדוֹלִים וְלֹא קְטַנִּים:<br><br><b>בני יונה.<\/b> קְטַנִּים וְלֹא גְּדוֹלִים:<br><br><b>מן התרים או מן בני היונה.<\/b> פְּרָט לִתְחִלַּת הַצִּהוּב שֶׁבָּזֶה וְשֶׁבָּזֶה שֶׁהוּא פָּסוּל, שֶׁגָּדוֹל הוּא אֵצֶל בְּנֵי יוֹנָה וְקָטָן אֵצֶל תּוֹרִים (חולין כ\"ב):", "rashi_en": "מן העוף [AND IF A BURNT OFFERING … BE] OF FOWLS — of (i.e. of some of) but not of every description of fowls (cf. Rashi on Leviticus 1.2 and Rashi on Leviticus 1:10). Since Scripture states, (Leviticus 22:19) “[Ye shall offer, to be accepted for you,] a male without blemish (תמים זכר) of the oxen, of the sheep and of the goats”, it is evident (cf. Rashi on Leviticus 1.2 and Rashi on Leviticus 1:10) that unblemished condition and male sex in sacrifices are required only in the case of cattle, but unblemished condition and male sex are not required in the case of fowls. If, then, the condition of the fowl is immaterial one might think that a fowl may be brought as a sacrifice even if it lacks a limb! Scripture therefore states: “of fowls” — but not all fowls (Sifra, Emor, Section 7 2; Kiddushin 24b).<br><br>התרים TURTLEDOVES — Grown-up ones only may be offered but not young ones.<br><br>בני יונה YOUNG DOVES — Young doves only may be offered but not grown-up ones (Sifra, Vayikra Dibbura d'Nedavah, Chapter 8 4; Chullin 22a).<br><br>מן התרים או מן בני היונה  OF TURTLEDOVES AND OF YOUNG DOVES — The word מן is intended to exclude birds in the first stage of their plumage becoming golden-coloured in the case of the one as of the other, for this stage makes the bird unfit for sacrifice, since such a bird is a grown-up one in the case of בני יונה and a young one in the case of תורים (Sifra, Vayikra Dibbura d'Nedavah, Chapter 8 5; Chullin 22b)."}, {"ch": 1, "v": 15, "aliyah": 2, "heb": "וְהִקְרִיב֤וֹ הַכֹּהֵן֙ אֶל־הַמִּזְבֵּ֔חַ וּמָלַק֙ אֶת־רֹאשׁ֔וֹ וְהִקְטִ֖יר הַמִּזְבֵּ֑חָה וְנִמְצָ֣ה דָמ֔וֹ עַ֖ל קִ֥יר הַמִּזְבֵּֽחַ׃", "onk": "וִיקָרְבִנֵיהּ כַּהֲנָא לְמַדְבְּחָא וְיִמְלוֹק יָת רֵישֵׁיהּ וְיַסֵּק לְמַדְבְּחָא וְיִתִּמְצֵי דְמֵיהּ עַל כּוֹתֶל מַדְבְּחָא:", "onk_en": "The <i>kohein<\/i> shall bring it near the altar and nip off its head [with his fingernail] and burn it on the altar; and its blood shall be squeezed out onto the wall of the altar.", "pj": "וִיקַרְבִינֵיהּ כַּהֲנָא לְמַדְבְּחָא וְיַחֲזוֹם יַת רֵישֵׁיהּ וְיַסֵיק לְמַדְבְּחָא וְיִתְמְצֵי אַדְמֵיהּ עַל כּוֹתֶל מַדְבְּחָא", "pj_en": "And the priest shall offer it upon the altar, and shall wring off its head, and burn upon the altar, and press out its blood at the side of the altar.", "tj": "וְיַקְרִיב יָתֵיהּ כַּהֲנָא עַל גַּבֵּי מַדְבְּחָא וְיַעֲזֵם רֵישֵׁיהּ וְיִסַדֵר עַל גַּבֵּי מַדְבְּחָא וְיִמְצֵי דְּמֵיהּ עַל שִׁיפּוֹלֵי מַדְבְּחָא:", "tj_en": "And the priest shall bring it to the side of the altar, and twist off its head, and lay it in order upon the altar, and press out its blood at the bottom of the altar.", "rashi": "<b>והקריבו.<\/b> אֲפִלּוּ פְּרֵדָה אַחַת יָבִיא (ספרא):<br><br><b>הכהן, ומלק.<\/b> אֵין מְלִיקָה בִּכְלִי אֶלָּא בְּעַצְמוֹ שֶׁל כֹּהֵן, קוֹצֵץ בְּצִפָּרְנוֹ מִמּוּל הָעֹרֶף וְחוֹתֵךְ מַפְרַקְתּוֹ עַד שֶׁמַּגִּיעַ לַסִּימָנִין וְקוֹצְצָן (שם):<br><br><b>ונמצה דמו.<\/b> לְשׁוֹן מִיץ אַפַּיִם (משלי ל'), כִּי אָפֵס הַמֵּץ (ישעיהו ט\"ז), כּוֹבֵשׁ בֵּית הַשְּׁחִיטָה עַל קִיר הַמִּזְבֵּחַ וְהַדָּם מִתְמַצֶּה וְיוֹרֵד (זבחים ס\"ה):<br><br><b>ומלק, והקטיר, ונמצה.<\/b> אֶ\"לֹ כֵּן מֵאַחַר שֶׁהוּא מַקְטִיר הוּא מוֹצֶה? אֶלָּא מַה הַקְטָרָה הָרֹאשׁ בְּעַצְמוֹ וְהַגּוּף בְּעַצְמוֹ, אַף מְלִיקָה כֵּן. וּפְשׁוּטוֹ שֶׁל מִקְרָא מְסֹרָס הוּא — וּמָלַק וְהִקְטִיר, וְקֹדֶם הַקְטָרָה וְנִמְצָה דָמוֹ כְּבָר:", "rashi_en": "והקריבו [AND THE PRIEST] SHALL OFFER IT — It — even a single bird he may offer (not necessarily more than one, as might be assumed from the plural  תורים and  בני יונה) (Sifra, Vayikra Dibbura d'Nedavah, Section 7 1; Zevachim 65a).<br><br>הכהן … ומלק THE PRIEST SHALL … NIP OFF [ITS HEAD] — The nipping of the bird’s head must not be done with an instrument but by the priest’s very self:) he nips with his finger-nail close by the nape, cuts right through the neck-bone until he comes to the “organs” (the wind pipe and the gullet) and cuts them through too (Sifra, Vayikra Dibbura d'Nedavah, Section 7 3; Zevachim 65a).<br><br>ונמצה דמו AND THE BLOOD THEREOF SHALL BE WRUNG OUT — The word  ונמצה is connected in meaning with (Proverbs 30:33) “the pressing out (מיץ) of wrath”; (Isaiah 16:4) “for extortion (המץ) is at an end). — He presses the place where the neck has been cut (בית השחיטה) against the wall and the blood thus drains itself out) and runs down the wall (cf. Sifra, Vayikra Dibbura d'Nedavah, Section 7 7; Zevachim 64b).<br><br>ומלק … והקטיר …ונמצה AND HE SHALL NIP OFF … AND CAUSE IT TO ASCEND IN FUMES … AND [THE BLOOD] SHALL BE WRUNG OUT — Is it possible to say so? Since he has burnt it can he squeeze the blood out?! But the wording is intended to suggest the following: How is it with the burning of the sacrifice? The head is separate and the body is separate (since it states here ומלק את ראשו והקטיר, and in v. 17 it is enjoined והקטיר אתו i. e. the body; vv. 16—17 speaking of the rites performed on the body)! So, too, the nipping has to be thus (i. e. has to have the effect of severing the head from the body so that it may be burnt apart from the body; the מליקה accordingly denotes here complete severance, whilst in 5:8 this is forbidden. The translation therefore is: and he shall nip off the head so that he may burn it on the altar) (Sifra, Vayikra Dibbura d'Nedavah, Section 7 5; Zevachim 65a). According to the literal sense of the verse, however, the wording is inverted: he shall nip off [the head] and burn it, and before the burning the blood shall have been pressed out already (ונמצה has therefore a future-perfect meaning: “and its blood shall have been pressed out”)."}, {"ch": 1, "v": 16, "aliyah": 2, "heb": "וְהֵסִ֥יר אֶת־מֻרְאָת֖וֹ בְּנֹצָתָ֑הּ וְהִשְׁלִ֨יךְ אֹתָ֜הּ אֵ֤צֶל הַמִּזְבֵּ֙חַ֙ קֵ֔דְמָה אֶל־מְק֖וֹם הַדָּֽשֶׁן׃", "onk": "וְיַעֲדֵּי יָת זְפָקֵיהּ בְּ<b>אוּכְלֵיהּ<\/b> וְיִרְמֵי יָתַהּ לִסְטַר מַדְבְּחָא קִידוּמָא לַאֲתַר <b>דְּמוֹשְׁדִין<\/b> קִטְמָא:", "onk_en": "He shall remove its crop [together] with its feathers [<b>excrement<\/b>] and throw it beside the altar, eastward, to the place of [<b>where they throw<\/b>] the ashes.", "pj": "וְיַעֲדֵי יַת זְרוֹקְפֵיהּ בִּלְקָטֵיהּ וְיִטְלַק יָתָהּ לִסְטַר מַדְבְּחָא קִידוּמָא בַּאֲתַר דְמוֹקְדִין קִיטְמָא", "pj_en": "And he shall remove its gullet and the contents thereof, and throw it by the eastern side of the altar in the place where they burn the cinders.", "tj": "וְיַעֲבֵר יַת קוּרְקָבָנֵיהּ בִנְטָשָׁא וְיַטְלֵק יָתָהּ סְמִיךְ לְמַדְבְּחָא מַדִּינְחָא לַאֲתַר בֵּית שְׁפִיכוּת קִיטְמָא:", "tj_en": "And he shall remove its ventricle with the dung, and throw it by, on the east of the altar at the place where the cinders are emptied.", "rashi": "<b>מראתו.<\/b> מְקוֹם הָרְעִי, זֶה הַזֶּפֶק (ספרא):<br><br><b>בנצתה.<\/b> עִם בְּנֵי מֵעֶיהָ, וְנוֹצָה לְשׁוֹן דָּבָר הַמָּאוּס, כְּמוֹ כִּי נָצוּ גַּם נָעוּ (איכה ד'), וְזֶהוּ שֶׁתִּרְגֵּם אֻנְקְלוֹס בְּאוּכְלֵיהּ; וְזֶהוּ מִדְרָשׁוֹ שֶׁל אַבָּא יוֹסֵי בֶּן חָנָן שֶׁאָמַר נוֹטֵל אֶת הַקֻּרְקְבָן עִמָּהּ; וְרַבּוֹתֵינוּ זִ\"לִ אָמְרוּ קוֹדֵר סְבִיב הַזֶּפֶק בְּסַכִּין כְּעֵין אֲרֻבָּה וְנוֹטְלוֹ עִם הַנּוֹצָה שֶׁעַל הָעוֹר (ספרא); בְּעוֹלַת בְּהֵמָה שֶׁאֵינָהּ אוֹכֶלֶת אֶלָּא בְּאֵבוּס בְּעָלֶיהָ, נֶאֱמַר וְהַקֶּרֶב וְהַכְּרָעַיִם יִרְחַץ בַּמָּיִם וְהִקְטִיר, וּבָעוֹף שֶׁנָּזוֹן מִן הַגָּזֵל, נֶאֱמַר וְהִשְלִיךְ אֶת הַמֵּעַיִם, שֶׁאָכַל מִן הַגָּזֵל (ויקרא רבה ג'):<br><br><b>אצל המזבח קדמה.<\/b> בְּמִזְרָחוֹ שֶׁל כֶּבֶשׁ (ספרא):<br><br><b>אל מקום הדשן.<\/b> מָקוֹם שֶׁנּוֹתְנִין שָׁם תְּרוּמַת הַדֶּשֶׁן בְּכָל בֹּקֶר וְדִשּׁוּן מִזְבֵּחַ הַפְּנִימִי וְהַמְּנוֹרָה, וְכֻלָּם נִבְלָעִים שָׁם בִּמְקוֹמָן:", "rashi_en": "מראתו [AND HE SHALL REMOVE] ITS CROP — The word is connected in meaning with the word רעי in Rabbinical Hebrew (or the Biblical ראי; cf. Nahum 3:6); it thus denotes the place of the רעי, the digested food, i. e. the crop (Sifra, Vayikra Dibbura d'Nedavah, Section 7 9). <br><br>בנצתה means together with its entrails (not with its feathers which meaning the word נוצה usually has). The word נוצה is really an expression for anything that is loathsome. Similar is (Lamentations 4:15) “[depart, depart, touch not:] for they are become loathsome (נצו) and are fled away”.) That is also what Onkelos means when he translates באוכליה, “with the digested food” found in the entrails (excrement). This, too, is the interpretation of the verse given by Abba José ben Chanan who states: he removes the stomach (being the organ which contains digested food) together with it (the crop). But our Rabbis, of blessed memory, taking נוצה; in its usual sense of “feathers”, say: with a knife he cuts out around the crop an opening like a flap and removes it together with the feathers on the skin (of that spot) (Sifra, Vayikra Dibbura d'Nedavah, Section 7 9; Zevachim 65a). — In the case of the burnt offering of the cattle which eats only from the crib of its owner it is stated, (v. 13) “But he shall lave the inwards and the legs with water: and [the priest] shall offer it”; in the case of a fowl, however, which feeds itself from what it picks up of other people’s property (lit., “of robbery”) it states, “he shall cast the entrails away”, because it (the bird) eats that which is stolen (Leviticus Rabbah 3 4).<br><br>אצל המזבח קדמה BESIDE THE ALTAR ON THE EAST — i. e. at the east of the כבש (the inclined ascent leading to the top of the altar which was on the south of the altar) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 9 3).<br><br>אל מקום הדשן BY THE PLACE OF THE ASHES — i. e. that place where they deposited the ashes removed from the altar (תרומת הדשן) each morning (cf. Rashi on Leviticus 6:3, 4) and the ashes removed from the inner altar and the candelabrum (Meilah 12a;Sifra, Vayikra Dibbura d'Nedavah, Chapter 9 3). All these miraculously sunk there in their place (i. e. on the very spot where they were deposited) (Yoma 21a)."}, {"ch": 1, "v": 17, "aliyah": 2, "heb": "וְשִׁסַּ֨ע אֹת֣וֹ בִכְנָפָיו֮ לֹ֣א יַבְדִּיל֒ וְהִקְטִ֨יר אֹת֤וֹ הַכֹּהֵן֙ הַמִּזְבֵּ֔חָה עַל־הָעֵצִ֖ים אֲשֶׁ֣ר עַל־הָאֵ֑שׁ עֹלָ֣ה ה֗וּא אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיפָרֵיק יָתֵיהּ בְּגַדְפוֹהִי לָא יַפְרֵישׁ וְיַסֵּק יָתֵיהּ כַּהֲנָא לְמַדְבְּחָא עַל אָעַיָּא דִּי עַל אֶשָּׁתָא עֲלָתָא הוּא <b>קֻרְבָּן דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "He shall rip it apart by its wings, not completely dividing it. The <i>kohein<\/i> shall burn it on the altar, on the logs which are on the fire; it is a burnt-offering, a fire-offering [<b>an offering<\/b>] of pleasing fragrance to [<b>which is accepted with favor before<\/b>] Adonoy.", "pj": "וְיִתְלַע יָתֵיהּ בְּגַדְפוֹי לָא יַפְרִישׁ גַדְפוֹי מִנֵיהּ וְיַסִיק יָתֵיהּ כַּהֲנָא לְמַדְבְּחָא עַל קֵיסִין דְעַל אֵישָׁתָא עֲלָתָא הוּא קָרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֲדָם יְיָ", "pj_en": "And he shall cut it between its wings, but not to sever the wings from it; and the priest shall burn it at the altar upon the wood which is on the fire: it is a sacrifice, an oblation to be received with favour before the Lord.", "tj": "וְיִתְלַע יָתֵיהּ בְּכַנְפוֹי לָא יַפְרִישׁ וִיסַדֵר יָתֵיהּ כַּהֲנָא עַל גַּבֵּי מַדְבְּחָא עַל קֵיסַיָא דְאִית עַל אֵשָׁתָא:", "tj_en": "And he shall cut it through its wings, but not to dissever; and the priest shall lay it in order upon the, altar, on the wood that is upon the fire.", "rashi": "<b>ושסע.<\/b> אֵין שִׁסּוּעַ אֶלָּא בַּיָּד, וְכֵן הוּא אוֹמֵר בְּשִׁמְשׁוֹן וַיְשַׁסְּעֵהוּ כְּשַׁסַּע הַגְּדִי וְגוֹ' (שופטים י\"ד):<br><br><b>בכנפיו.<\/b> עִם כְּנָפָיו — אֵינוֹ צָרִיךְ לִמְרֹט כַּנְפֵי נוֹצָתוֹ:<br><br><b>בכנפיו.<\/b> נוֹצָה מַמָּשׁ; וַהֲלֹא אֵין לְךָ הֶדְיוֹט שֶׁמֵּרִיחַ רֵיחַ כְּנָפַיִם נִשְֹרָפִים וְאֵין נַפְשׁוֹ קָצָה עָלָיו, וְלָמָּה אָמַר הַכָּתוּב יַקְרִיב? כְּדֵי שֶׁיְּהֵא הַמִּזְבֵּחַ שָֹבֵעַ וּמְהֻדָּר בְּקָרְבָּנוֹ שֶׁל עָנִי (ויק\"ר ג'):<br><br><b>לא יבדיל.<\/b> אֵינוֹ מְפָרְקוֹ לְגַמְרֵי, לִשְׁתֵּי חֲתִיכוֹת, אֶלָּא קוֹרְעוֹ מִגַּבּוֹ; נֶאֱמַר בָּעוֹף רֵיחַ נִיחוֹחַ וְנֶאֱמַר בַּבְּהֵמָה רֵיחַ נִיחוֹחַ, לוֹמַר לְךָ אֶחָד הַמַּרְבֶּה וְאֶחָד הַמַּמְעִיט וּבִלְבַד שֶׁיְּכַוֵּן אֶת לִבּוֹ לַשָּׁמַיִם (ספרא):", "rashi_en": "ושסע AND HE SHALL CLEAVE [IT] — The term שסע is used only for rending with the hands. Similarly it states in the story of Samson (Judges 14:6) “and he rent him (וישסעהו) as he would have rent a kid” (Zevachim 65b).<br><br>בכנפיו means: he shall rend it together with its feathers he need not pluck out the feathers that form its plumage before doing so. <br><br>בכנפיו means actually the feathers (not the wings). But surely you will not find even a common sort of man who can smell the odour of burnt feathers without being disgusted with it! Why, then, does Scripture say that it shall be offered with the feathers? In order that the altar should appear full up, as it were, and adorned with the sacrifice of the poor (since the bird with its feathers makes a finer show than without them) (Leviticus Rabbah 3:5).<br><br>לא יבדיל BUT HE SHALL NOT SEPARATE IT — he must not break it entirely into two pieces, but only rends it from behind. — It is stated here of a bird-offering “a pleasing odour [to the Lord]” and it is stated (v. 13) of an animal-sacrifice “a pleasing odour [to the Lord]”, to tell you: whether one offers much or little it is equally pleasing to God provided that he directs his heart to Heaven (Sifra, Vayikra Dibbura d'Nedavah, Section 9 7; Menachot 110a)."}, {"ch": 2, "v": 1, "aliyah": 2, "heb": "וְנֶ֗פֶשׁ כִּֽי־תַקְרִ֞יב קׇרְבַּ֤ן מִנְחָה֙ לַֽיהֹוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קׇרְבָּנ֑וֹ וְיָצַ֤ק עָלֶ֙יהָ֙ שֶׁ֔מֶן וְנָתַ֥ן עָלֶ֖יהָ לְבֹנָֽה׃", "onk": "וֶאֱנַשׁ אֲרֵי יְקָרֵב קֻרְבַּן מִנְחָתָא <b>קֳדָם<\/b> יְיָ סוּלְתָּא יְהֵי קֻרְבָּנֵיהּ וִירִיק עֲלָהּ מִשְׁחָא וְיִתֵּן עֲלָהּ לְבוֹנְתָּא:", "onk_en": "When a person brings a meal-offering to [<b>before<\/b>] Adonoy, his offering shall be of fine flour; he shall pour oil upon it and place frankincense upon it.", "pj": "וּבַר נַשׁ אֲרוּם יִקְרַב קָרְבַּן מִנְחָתָא קֳדָם יְיָ קִמְחָא סְמִידָא יְהֵי קוּרְבָּנֵיהּ וְיָרִיק עֲלָהּ מִשְׁחָא וְיִתֵּן עֲלָהּ לְבוֹנְתָּא", "pj_en": "But when a man will offer the oblation of mincha before the Lord, his oblation shall be of flour, and he shall pour oil upon it, and put incense thereon,", "tj": "", "tj_en": "", "rashi": "<b>ונפש כי תקריב.<\/b> לֹא נֶאֱמַר נֶפֶשׁ בְּכָל קָרְבְּנוֹת נְדָבָה אֶלָּא בַּמִּנְחָה, מִי דַּרְכּוֹ לְהִתְנַדֵּב מִנְחָה? עָנִי. אָמַר הַקָּבָּ\"ה, מַעֲלֶה אֲנִי עָלָיו כְּאִלּוּ הִקְרִיב נַפְשׁוֹ (מנחות ק\"ד):<br><br><b>סלת יהיה קרבנו.<\/b> הָאוֹמֵר הֲרֵי עָלַי מִנְחָה סְתָם, מֵבִיא מִנְחַת סֹלֶת, שֶׁהִיא הָרִאשׁוֹנָה שֶׁבַּמְּנָחוֹת וְנִקְמֶצֶת כְּשֶׁהִיא סֹלֶת, כְּמוֹ שֶׁמְּפֹרָשׁ בָּעִנְיָן; לְפִי שֶׁנֶּאֶמְרוּ כָּאן חֲמִשָּׁה מִינֵי מְנָחוֹת, וְכֻלָּן בָּאוֹת אֲפוּיוֹת קֹדֶם קְמִיצָה חוּץ מִזּוֹ, לְכָךְ קְרוּיָה מִנְחַת סֹלֶת:<br><br><b>סלת.<\/b> אֵין סֹלֶת אֶלָּא מִן הַחִטִּין, שֶׁנֶּאֱמַר סֹלֶת חִטִּים (שמות כ\"ט), וְאֵין מִנְחָה פְּחוּתָה מֵעִשָּׂרוֹן, שֶׁנֶּאֱמַר וְעִשָּׂרוֹן סֹלֶת … לְמִנְחָה (ויקרא י\"ד) — עִשָּׂרוֹן לְכָל מִנְחָה:<br><br><b>ויצק עליה שמן.<\/b> עַל כֻּלָּהּ:<br><br><b>ונתן עליה לבנה.<\/b> עַל מִקְצָתָהּ — מַנִּיחַ קֹמֶץ לְבוֹנָה עָלֶיהָ לְצַד אֶחָד. וּמָה רָאִיתָ לוֹמַר כֵּן? שֶׁאֵין רִבּוּי אַחַר רִבּוּי בַּתּוֹרָה אֶלָּא לְמַעֵט; דָּ\"אַ: שֶׁמֶן עַל כֻּלָּהּ, מִפְּנֵי שֶׁהוּא נִבְלָל עִמָּהּ וְנִקְמָץ עִמָּהּ, כְּמוֹ שֶׁנֶּאֱמַר מִסָּלְתָּהּ וּמִשַּׁמְנָהּ, וּלְבוֹנָה עַל מִקְצָתָהּ, שֶׁאֵינָהּ נִבְלֶלֶת עִמָּהּ וְלֹא נִקְמֶצֶת עִמָּהּ, שֶׁנֶּאֱמַר עַל כָּל לְבֹנָתָהּ, שֶׁלְּאַחַר שֶׁקָּמַץ מְלַקֵּט אֶת הַלְּבוֹנָה כֻּלָּהּ מֵעָלֶיהָ וּמַקְטִירָהּ (ספרא):<br><br><b>ויצק, ונתן, והביאה.<\/b> מְלַמֵּד שֶׁיְּצִיקָה וּבְלִילָה כְּשֵׁרִים בְּזָר (שם):", "rashi_en": "ונפש כי תקריב AND WHEN A PERSON (or “A SOUL”) WILL OFFER — Nowhere is the word נפש employed in connection with free-will offerings except in connection with the meal-offering. For who is it that usually brings a meal-offering? The poor man! The Holy One, blessed be He, says, as it were, I will regard it for him as though he brought his very soul (נפש) as an offering (Menachot 104b).<br><br>סלת יהיה קרבנו [AND WHEN A PERSON WILL OFFER A MEAL OFFERING] HIS OFFERING SHALL BE OF SIFTED FINE FLOUR — i. e. if one says, “I take upon myself the obligation to bring a מנחה”, without further defining it, he must bring that which is termed “the meal-offering of fine sifted flour” (מנחת סלת) which is that mentioned first among the different meal-offerings) since the קומץ is taken from it whilst it is yet flour (whilst in the case of other meal-offerings this is done after they have been baked), as is explained further on in this section (cf. Menachot 104b). — Because there are five different meal-offerings enumerated here all of which had to be brought ready baked beforẹ the קמץ was taken of them with the exception of this, therefore this alone is technically termed “a meal-offering of flour’ (though the others too had to be made of sifted fine flour).<br><br>סלת — The term סלת always denotes “fine flour of wheat”, as it is said, (Exodus 29:2) “fine flour (סלת) of wheat” (Sifra, Vayikra Dibbura d'Nedavah, Chapter 10 2). No meal-offering is ever less than one tenth part of an ephah of flour, as it said, (Leviticus 14:21) “and one tenth deal of flour … for a meal-offering”, i. e. there must be a tenth part for every kind of meal-offering (cf. Menachot 99a).<br><br>ויצק עליה שמן AND HE SHALL POUR OIL UPON IT — upon the whole of it (of the flour) (Sifra, Vayikra Dibbura d'Nedavah, Chapter 10 14),<br><br>ונתן עליה לבנה AND PUT FRANKINCENSE THEREON — upon a part of it: he lays a fistful of frankincense upon one side of it. And what reason have you (lit., what do you see) to say so? Because there is a rule: when in the Torah a רבוי, i. e. a term usually intended to include a particular detail) follows one of a similarly inclusive character, the latter implies a restriction). Another explanation of why I say that oil has to be poured upon the whole meal-offering is, because it (the oil) has to be mingled with it (the מנחה) and has to undergo the קמיצה (the taking of a fistful of the mass) together with it, as it is stated, “[and he shall take thereout by grasping a fistful] of the flour thereof and of the oil thereof”; frankincense, however, has to be put only upon a part of it, since it is not mingled with it and has not to undergo the קמיצה together with it, because it is said immediately afterwards, “besides (i. e. in addition to) all the frankincense thereof” (cf. Rashi on that passage), — which implies that after he had taken the קמץ he picks all the frankincense from off it and offers it (Sifra, Vayikra Dibbura d'Nedavah, Chapter 10 14-18; cf. also Sota 14b)<br><br>. … ויצק ונתן … והביאה AND HE SHALL POUR … AND HE SHALL PUT … AND then HE SHALL BRING IT [TO AARONS SONS] — This teaches us that the pouring of the oil and the mingling it (with the flour) is valid even if done by non-priests (Sifra, Vayikra Dibbura d'Nedavah, Chapter 10 19: Menachot 9a)."}, {"ch": 2, "v": 2, "aliyah": 2, "heb": "וֶֽהֱבִיאָ֗הּ אֶל־בְּנֵ֣י אַהֲרֹן֮ הַכֹּהֲנִים֒ וְקָמַ֨ץ מִשָּׁ֜ם מְלֹ֣א קֻמְצ֗וֹ מִסׇּלְתָּהּ֙ וּמִשַּׁמְנָ֔הּ עַ֖ל כׇּל־לְבֹנָתָ֑הּ וְהִקְטִ֨יר הַכֹּהֵ֜ן אֶת־אַזְכָּרָתָהּ֙ הַמִּזְבֵּ֔חָה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַיהֹוָֽה׃", "onk": "וְיַיְתִנָּהּ לְוָת בְּנֵי אַהֲרֹן כָּהֲנַיָּא וְיִקְמוֹץ מִתַּמָּן מְלֵי קֻמְצֵיהּ מִסֻּלְתָּא וּמִמִּשְׁחַהּ עַל כָּל לְבוֹנְתָּהּ וְיַסֵּק כַּהֲנָא יָת אַדְכַּרְתָּהּ לְמַדְבְּחָא <b>קֻרְבַּן דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "He shall bring it to the sons of Aharon, the <i>kohanim<\/i>; from there, [a <i>kohein<\/i>] takes his fistful—from its flour and oil—with all its frankincense. The <i>kohein<\/i> shall burn its memorial portion on the altar, a fire-offering [<b>an offering<\/b>] of pleasing fragrance to [<b>which is accepted with favor before<\/b>] Adonoy.", "pj": "וְיַיְתִינָהּ לְוַת בְּנֵי אַהֲרן כַּהֲנַיָא וְיִקְמוֹץ מִתַּמָן מְלֵי קוּמְצֵיהּ מִן קִמְחָא סְמִידָא וּמִן טוּב מִשְׁחָא עַל כָּל לְבוֹנְתָּא וְיַסִיק כַּהֲנָא יַת שְׁפַר אַדְכַּרְתָּא לְמַדְבְּחָא קָרְבָּנָא דְמִתְקַבֵּיל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "and bring it to the priests the sons of Aharon; and he shall take from thence his hand full of the meal and of the best of the oil, with all the frankincense; and the priest shall burn the goodly memorial at the altar, an oblation to be accepted with grace before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>הכהנים וקמץ.<\/b> מִקְּמִיצָה וָאֵילָךְ מִצְוַת כְּהֻנָּה (שם):<br><br><b>וקמץ משם.<\/b> מִמָּקוֹם שֶׁרַגְלֵי הַזָּר עוֹמְדוֹת; לְלַמֶּדְךָ שֶׁהַקְּמִיצָה כְּשֵׁרָה בְּכָל מָקוֹם בָּעֲזָרָה, אַף בְּי\"א אַמָּה שֶׁל מְקוֹם דְּרִיסַת רַגְלֵי יִשְֹרָאֵל (יומא ט\"ז):<br><br><b>מלא קמצו.<\/b> יָכוֹל מְבֹרָץ — מְבַצְבֵּץ וְיוֹצֵא לְכָל צַד, תַּ\"לֹ בְּמָקוֹם אַחֵר וְהֵרִים מִמֶּנּוּ בְּקֻמְצוֹ (ויקרא ו') — לֹא יְהֵא כָּשֵׁר אֶלָּא מַה שֶּׁבְּתוֹךְ הַקֹּמֶץ, אִי בְּקֻמְצוֹ יָכוֹל חָסֵר, תַּ\"לֹ מְלֹא, הָא כֵּיצַד? חוֹפֶה שְׁלוֹשׁ אֶצְבְּעוֹתָיו עַל פַּס יָדוֹ, וְזֶהוּ קֹמֶץ בְּמַשְׁמַע לָשׁוֹן הָעִבְרִית (מנחות י\"א):<br><br><b>על כל לבנתה.<\/b> לְבַד כָּל הַלְּבוֹנָה יְהֵא הַקֹּמֶץ מָלֵא:<br><br><b>לבנתה והקטיר.<\/b> אַף הַלְּבוֹנָה בְּהַקְטָרָה:<br><br><b>מלא קמצו מסלתה ומשמנה.<\/b> הָא אִם קָמַץ וְעָלָה בְּיָדוֹ גַּרְגֵּר מֶלַח אוֹ קֹרֶט לְבוֹנָה פְּסוּלָה (שם ו'):<br><br><b>אזכרתה.<\/b> הַקֹּמֶץ הָעוֹלֶה לְגָבוֹהַּ הוּא זִכְרוֹן הַמִּנְחָה — שֶׁבּוֹ נִזְכָּר בְּעָלֶיהָ לְטוֹבָה וּלְנַחַת רוּחַ:", "rashi_en": "הכהנים וקמץ [AND HE SHALL BRING UNTO …] THE PRIESTS: AND HE SHALL TAKE A FISTFUL — from the קמיצה (the taking of the fistful) and onwards is the duty of the priesthood (Menachot 9a).<br><br>וקמץ משם AND HE SHALL TAKE A FISTFUL FROM THERE — from the place where the feel of the layman may stand; and this is stated in order to teach you that the קמיצה is valid at whatever place in the fore-court it is carried out, even in that eleven cubits) which are the area where the feet of the ordinary Israelites may tread (cf. Yoma 16b).<br><br>מלא קמצו HIS FISTFUL — One might think that it (the fist) may be full to overflowing — that it may burst through his fist and come out on every side! Scripture, however, states in another passage, (Leviticus 6:8) “and he shall take from it in his closed hand [some of the flour … and burn it on the altar)”, which shows that only that is fitted to be burnt which is within his closed hand. If, then, he has to take what is בקמצו, within his closed hand, one might assume that it may be defective (underfull)? Scripture, however, states here, מלא, “his full [closed hand]”. How then does he do it that it shall be neither overfull nor underfull? After placing his hand in the vessel containing the meal-offering he (the priest) bends his three fingers (those next to his thumb) at full length over on to the palm of his hand, removing with his thumb and little finger all the flour that shows outside these three fingers. This is the literal meaning that the word קמץ has in the Hebrew language (Sifra, Vayikra Dibbura d'Nedavah, Section 9 6; Menachot 11a; Yoma 47a).<br><br>‎ על כל לבנתה‎‎ [HIS FISTFUL OF FLOUR …] BESIDES ALL THE FRANKINCENSE — i. e. apart from all the frankincense shall his fist be full.<br><br>לבנתה והקטיר ITS FRANK-INCENSE. AND HE SHALL BURN — The frankincense too comes  under the law of burning (cf. Sifra, Vayikra Dibbura d'Nedavah, Section 9 10).<br><br>מלא קמצו מסלתה ומשמנה [AND HE SHALL TAKE THEREOUT] HIS HANDFUL OF THE FLOUR THEREOF AND OF THE OIL THEREOF — Consequently if when he takes the handful of the flour a grain of salt (for salt was mingled with every offering; cf. v. 13) or a particle of frankincense comes into his hand with the flour it (the offering) is invalid (Sifra, Vayikra Dibbura d'Nedavah, Section 9 10; Menachot 6a).<br><br>אזכרתה THE MEMORIAL PORTION THEREOF — The handful of flour that is offered to the Most High God forms the memorial portion of the meal-offering, being that part of it through which the owner is remembered for good and for having caused satisfaction to the Lord."}, {"ch": 2, "v": 3, "aliyah": 2, "heb": "וְהַנּוֹתֶ֙רֶת֙ מִן־הַמִּנְחָ֔ה לְאַהֲרֹ֖ן וּלְבָנָ֑יו קֹ֥דֶשׁ קׇֽדָשִׁ֖ים מֵאִשֵּׁ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּדְאִשְׁתָּאַר מִן מִנְחָתָא לְאַהֲרֹן וְלִבְנוֹהִי קוֹדֶשׁ קוּדְשִׁין מִ<b>קֻּרְבָּנַיָּא<\/b> דַיְיָ:", "onk_en": "Whatever remains of the meal-offering belongs to Aharon and his sons; [it is] holy of holies of the fire-offerings [<b>offerings<\/b>] of Adonoy.", "pj": "וּמַה דְמִשְׁתַּיֵיר מִן מִנְחָתָא יְהֵא לְאַהֲרן וְלִבְנוֹי קוֹדֶשׁ קוּדְשִׁין מִקוּרְבָּנַיָא דַיְיָ", "pj_en": "And what remaineth of the mincha shall be Aharon's and his sons, most holy among the oblations of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לאהרן ולבניו.<\/b> כֹּהֵן גָּדוֹל נוֹטֵל חֵלֶק בָּרֹאשׁ שֶׁלֹּא בְּמַחֲלֹקֶת וְהַהֶדְיוֹט בְּמַחֲלֹקֶת (ספרא):<br><br><b>קדש קדשים.<\/b> הִיא לָהֶם:<br><br><b>מאשי ה'.<\/b> אֵין לָהֶם חֵלֶק בָּהּ אֶלָּא לְאַחַר מַתְּנוֹת הָאִשִּׁים (שם):", "rashi_en": "לאהרן ולבניו AND THAT WHICH IS LEFT OF THE MEAL OFFERING] SHALL BE AARON’S AND HIS SONS’ — The High Priest takes a portion first, just as he pleases, without having to take part in the equal division of the מנחה, whilst the ordinary priest shares in an equal division (Sifra, Vayikra Dibbura d'Nedavah, Chapter 11 1; Yoma 14a and Yoma 17b).<br><br>קדש קדשים MOST HOLY is it for them.<br><br>'מאשי ה OF THE FIRE OFFERING OF THE LORD — they have no portion in it (in what is left) except after the gifts (the prescribed quantity) for the fire (i. e. the קומץ) have been offered (Sifra, Vayikra Dibbura d'Nedavah, Chapter 11 2)."}, {"ch": 2, "v": 4, "aliyah": 2, "heb": "וְכִ֥י תַקְרִ֛ב קׇרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּשֶּׁ֔מֶן וּרְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּשָּֽׁמֶן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲרֵי תְּקָרֵיב קֻרְבַּן מִנְחָתָא מַאֲפֵה תַנּוּרָא סוּלְתָּא גְּרִיצָן פַּטִּירָן דְּפִילָן בִּמְשַׁח וְאַסְפּוֹגִין פַּטִּירִין דִּמְשִׁיחִין בִּמְשָׁח:", "onk_en": "And when you bring a meal-offering that has been baked in an oven, [it shall be unleavened] matzoh-loaves of fine flour mixed with oil, or [unleavened] matzoh wafers smeared with oil.", "pj": "וַאֲרוּם תַּקְרִיב קָרְבַּן מִנְחָתָא דְמִתְאַפֵי בְּתַנוּרָא סְמִידָא גְרִיצִין פַּטִירִין פְּתִיכַן בִּמְשָׁח וּסְפוּגִין פַּטִירִין דִמְשִׁיחִין בִּמְשָׁח", "pj_en": "And when thou wilt offer the oblation of a mincha of that which is baked in the oven, it shall be cakes of flour, unleavened and mixed with oil, and wafers unleavened, which are anointed with oil.", "tj": "", "tj_en": "", "rashi": "<b>וכי תקריב וגו'.<\/b> שֶׁאָמַר הֲרֵי עָלַי מִנְחַת מַאֲפֵה תַּנּוּר; וְלִמֵּד הַכָּתוּב שֶׁיָּבִיא אוֹ חַלּוֹת אוֹ רְקִיקִין, הַחַלּוֹת בְּלוּלוֹת וְהָרְקִיקִין מְשׁוּחִין; וְנֶחְלְקוּ רַבּוֹתֵינוּ בִּמְשִׁיחָתָן, יֵשׁ אוֹמְרִים מוֹשְׁחָן וְחוֹזֵר וּמוֹשְׁחָן עַד שֶׁכָּלֶה כָּל הַשֶּׁמֶן שֶׁבַּלֹּג — שֶׁכָּל הַמְּנָחוֹת טְעוּנוֹת לֹג שֶׁמֶן — וְיֵשׁ אוֹמְרִים מוֹשְׁחָן כְּמִין \"כִי\" וּשְׁאָר הַשֶּׁמֶן נֶאֱכָל בִּפְנֵי עַצְמוֹ לַכֹּהֲנִים (מנחות ע\"ה); מַה תַּ\"ל בַּשֶּׁמֶן בַּשֶּׁמֶן שְׁנֵי פְּעָמִים? לְהַכְשִׁיר שֶׁמֶן שֵׁנִי וּשְׁלִישִׁי הַיּוֹצֵא מִן הַזֵּיתִים, וְאֵין צָרִיךְ שֶׁמֶן רִאשׁוֹן אֶלָּא לַמְּנוֹרָה שֶׁנֶּאֱמַר בּוֹ זָךְ (שמות כ\"ז), וְשָׁנִינוּ בִּמְנָחוֹת כָּל הַמְּנָחוֹת הָאֲפוּיוֹת לִפְנֵי קְמִיצָתָן וְנִקְמָצוֹת עַל יְדֵי פְּתִיתָה, כֻּלָּן בָּאוֹת עֶשֶֹר עֶשֶֹר חַלּוֹת, וְהָאָמוּר בָּה רְקִיקִין בָּאָה עֲשָׂרָה רְקִיקִין (מנחות ע\"ו):", "rashi_en": "וכי  ‎‎'ו גו‎תקריב‎‎‎‎‎ AND IF THOU OFFER [AN OFFERING OF AN OBLATION BAKEN IN THE OVEN] in that one said, “I take upon myself the obligation to bring a meal-offering taken in the oven. Scripture teaches you that he may bring either cakes or wafers, the cakes being mingled with oil and the wafers being anointed with oil (Sifra, Vayikra Dibbura d'Nedavah, Section 10 2). Our Rabbis are of different opinions as to their anointing. Some hold that they smeared them with oil and then repeatedly smeared them until the oil in the log was at an end, for every kind of meal-offering required a log of oil: whilst others hold that they smeared them onl
