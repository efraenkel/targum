ּ וַיַּרְא? רָאָה בְאַסְפַּקְלַרְיָא שֶׁל קֹדֶשׁ שֶׁעֲדַיִן יֵשׁ לוֹ שֶׁבֶר בְּמִצְרַיִם; וְלֹא הָיְתָה נְבוּאָה מַמָּשׁ לְהוֹדִיעוֹ בְּפֵרוּשׁ שֶׁזֶּה יוֹסֵף:<br><br><b>למה תתראו.<\/b> לָמָּה תַּרְאוּ עַצְמְכֶם בִּפְנֵי בְנֵי יִשְׁמָעֵאל וּבְנֵי עֵשָׂו כְּאִלּוּ אַתֶּם שְׂבֵעִים? בְּאוֹתָהּ שָׁעָה עֲדַיִן הָיָה לָהֶם תְּבוּאָה (תענית י'). וְלִי נִרְאֶה פְּשׁוּטוֹ לָמָּה תִּתְרָאוּ, לָמָּה יְהְיוּ הַכֹּל מִסְתַּכְּלִין בָּכֶם וּמַתְמִיהִים בָּכֶם, שֶׁאֵין אַתֶּם מְבַקְּשִׁים לָכֶם אֹכֶל בְּטֶרֶם שֶׁיִּכְלֶה מַה שֶּׁבְּיֶדְכֶם. וּמִפִּי אַחֵרִים שָׁמַעְתִּי, שֶׁהוּא לְשׁוֹן כְּחִישָׁה, לָמָּה תִּהְיוּ כְּחוּשִׁים בָּרָעָב, וְדוֹמֶה לוֹ וּמַרְוֶה גַּם הוּא יוֹרֶא (משלי י\"א):", "rashi_en": "וירא יעקב כי יש שבר כמצרים AND JACOB SAW THAT THERE WAS A SALE OF CORN IN EGYPT — How did he see it? Surely he did not see but he heard it, as it is said (v. 2) “Behold, I have heard ... What, then, is meant by “And Jacob saw”? He saw in a holy dim vision that there was שֶׂבֶר hope for him in Egypt, but it was not a true prophetic vision telling him plainly that it was Joseph in whom his hope lay (Genesis Rabbah 91:6).<br><br>למה תתראו WHY DO YE LOOK UPON ONE ANOTHER? — Why do you show yourselves (pretend) before the children of Ishmael and the children of Esau as though you have plenty to eat (Taanit 10b). For at that time they still had some grain. I am of opinion that the real meaning of למה תתראו is: Why should every one gaze at you and wonder at you because you do not search for food before what you have in your possession comes to an end. From others I have heard that it has the meaning of leanness: why should you become lean through hunger? A similar use of the verb as that in the first explanation is (Proverbs 11:25) “And he that satisfieth abundantly shall be satisfied (יורא) also himself”. "}, {"ch": 42, "v": 2, "aliyah": 4, "heb": "וַיֹּ֕אמֶר הִנֵּ֣ה שָׁמַ֔עְתִּי כִּ֥י יֶשׁ־שֶׁ֖בֶר בְּמִצְרָ֑יִם רְדוּ־שָׁ֙מָּה֙ וְשִׁבְרוּ־לָ֣נוּ מִשָּׁ֔ם וְנִחְיֶ֖ה וְלֹ֥א נָמֽוּת׃", "onk": "וַאֲמַר הָא שְׁמָעִית אָמְרִין אֲרֵי אִית <b>עִיבוּרָא<\/b> מִזְדַּבַּן בְּמִצְרָיִם חוּתוּ תַמָּן וּזְבוּנוּ לָנָא מִתַּמָּן וְנֵחֵי וְלָא נְמוּת:", "onk_en": "He said, Behold, I have heard that there is food [<b>grain<\/b>] for sale in Egypt. Go down there and buy for us from there, so that we will live and not die.", "pj": "וַאֲמַר הָא שְׁמָעִית אֲרוּם אִית עִיבּוּרָא מִזְדַבֵּן בְּמִצְרַיִם חוּתוּ תַּמָן וְזַבּוּנוּ לָנָא מִן תַּמָן וְנֵחֵי וְלָא נְמוּת", "pj_en": "And he said, Behold, I have heard that corn is sold in Mizraim: go down thither and buy for us from thence, that we may live and not die.", "tj": "", "tj_en": "", "rashi": "<b>רדו שמה.<\/b> וְלֹא אָמַר לְכוּ, רֶמֶז לְמָאתַיִם וְעֶשֶׂר שָׁנִים שֶׁנִּשְׁתַּעְבְּדוּ לְמִצְרַיִם כְּמִנְיַן רד\"ו:", "rashi_en": "רדו שמה GO DOWN THITHER — He did not say to them לכו “Go ye” but רדו an allusion to the 210 years during which Israel was to be enslaved in Egypt corresponding to the numerical value of (רד״ו (210 (Genesis Rabbah 91:2). "}, {"ch": 42, "v": 3, "aliyah": 4, "heb": "וַיֵּרְד֥וּ אֲחֵֽי־יוֹסֵ֖ף עֲשָׂרָ֑ה לִשְׁבֹּ֥ר בָּ֖ר מִמִּצְרָֽיִם׃", "onk": "וּנְחָתוּ אֲחֵי יוֹסֵף עַסְרָא לְמִזְבַּן עִיבוּרָא מִמִּצְרָיִם:", "onk_en": "Yoseif’s ten brothers went down to buy grain from Egypt.", "pj": "וּנְחָתוּ אֲחֵי יוֹסֵף עֲשָרָה לְמִיזְבּוֹן עִיבּוּרָא מִמִצְרָיִם", "pj_en": "And the ten brothers of Joseph went down to buy corn from Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>וירדו אחי יוסף.<\/b> וְלֹא כָתַב בְּנֵי יַעֲקֹב, מְלַמֵּד שֶׁהָיוּ מִתְחָרְטִים בִּמְכִירָתוֹ וְנָתְנוּ לִבָּם לְהִתְנַהֵג עִמּוֹ בְּאַחְוָה וְלִפְדּוֹתוֹ בְּכָל מָמוֹן שֶׁיִּפְסְקוּ עֲלֵיהֶם:<br><br><b>עשרה.<\/b> מַה תַּלְמוּד לוֹמַר, וַהֲלֹא כְתִיב וְאֶת בִּנְיָמִין אֲחִי יוֹסֵף לֹא שָׁלַח? אֶלָּא לְעִנְיַן הָאַחְוָה הָיוּ חֲלוּקִין לְי' שֶׁלֹּא הָיְתָה אַהֲבַת כֻּלָּם וְשִׂנְאַת כֻּלָּם שָׁוָה לוֹ; אֲבָל לְעִנְיַן לִשְׁבֹּר בָּר כֻּלָּם לֵב אֶחָד לָהֶם (בראשית רבה):", "rashi_en": "וירדו אחי יוסף AND JOSEPH S BRETHREN WENT DOWN — It does not call them “the sons of Jacob” (as in 5:5), thus suggesting that they regretted having sold him and that they had made up their mind to behave towards him in a brotherly manner and to redeem him at whatever price people might fix for them to pay (Midrash Tanchuma, Miketz 8).<br><br>עשרה TEN — What is the mention of this number intended to tell us? Is it not written (Genesis 42:4) “but Benjamin, Joseph’s brother did he not send” (and we therefore know that only ten brothers went to Egypt)? But it means to suggest that so far as their feeling of brotherhood towards Joseph was concerned they were divided into ten, because the love and hatred that all of them bore him were not alike, where as in regard to buying corn they were at one and united (Genesis Rabbah 91:2). "}, {"ch": 42, "v": 4, "aliyah": 4, "heb": "וְאֶת־בִּנְיָמִין֙ אֲחִ֣י יוֹסֵ֔ף לֹא־שָׁלַ֥ח יַעֲקֹ֖ב אֶת־אֶחָ֑יו כִּ֣י אָמַ֔ר פֶּן־יִקְרָאֶ֖נּוּ אָסֽוֹן׃", "onk": "וְיָת בִּנְיָמִין אֲחוּהִי דְיוֹסֵף לָא שְׁלַח יַעֲקֹב עִם אֲחוּהִי אֲרֵי אֲמַר דִּלְמָא יְעַרְעִנֵּיהּ <b>מוֹתָא<\/b>:", "onk_en": "But Binyamin, Yoseif’s brother, Yaakov did not send along with his brothers, for he [Yaakov] said, Misfortune [<b>Death<\/b>] might befall him.", "pj": "וְיַת בִּנְיָמִין אָחוֹי דְיוֹסֵף לָא שָׁדַר יַעֲקב עִם אָחוֹי אֲרוּם אָמַר הָא הוּא טַלְיָא וּמִסְתָּפִינָא דִלְמָא יְאַרְעִינֵיהּ מוֹתָא", "pj_en": "But Benjamin, Joseph's brother, Jakob sent not down with his brethren; for he said, Behold, he is a youth, and I fear lest death should befall him.", "tj": "", "tj_en": "", "rashi": "<b>פן יקראנו אסון.<\/b> וּבַבַּיִת לֹא יִקְרָאֶנּוּ? אָמַר רַבִּי אֱלִיעֶזֶר בֶּן יַעֲקֹב, מִכָּאן שֶׁהַשָּׂטָן מְקַטְרֵג בִּשְׁעַת הַסַּכָּנָה (בראשית רבה):", "rashi_en": "פן יקראנו אסון LEST MISCHIEF BEFALL HIM — And at home could not mischief befall him?! Rabbi Eliezer the son of Jacob said: We may infer from this that Satan accuses a man at the time of danger (Midrash Tanchuma, Vayigash 1)."}, {"ch": 42, "v": 5, "aliyah": 4, "heb": "וַיָּבֹ֙אוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לִשְׁבֹּ֖ר בְּת֣וֹךְ הַבָּאִ֑ים כִּֽי־הָיָ֥ה הָרָעָ֖ב בְּאֶ֥רֶץ כְּנָֽעַן׃", "onk": "וַאֲתוֹ בְּנֵי יִשְׂרָאֵל לְמִזְבַּן <b>עִיבוּרָא<\/b> בְּגוֹ עָלַיָּא אֲרֵי הֲוָה כַפְנָא בְּאַרְעָא דִכְנָעַן:", "onk_en": "The sons of Yisrael came to buy [<b>grain<\/b>] among the others who came, for there was famine in the land of Canaan.", "pj": "וְאָתוּ בְּנֵי יִשְרָאֵל כָּל חַד בְּתַרְעָא חַד דְלָא יִשְׁלוֹט בְּהוֹן עַיְינָא בִּישָׁא כַּד יַיעֲלוּן כַּחֲדָא לְמִזְבּוּן בֵּינֵי כְנַעֲנָאֵי דְעָאלוֹן לְמִזְבּוּן אֲרוּם הֲוָת כַּפְנָא בְּאַרְעָא דִכְנָעַן", "pj_en": "And the sons of Israel went every one by one door, lest the evil eye should have sway over them, as they went together to buy among the Kenaanites who went also to buy; because the famine was in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "<b>בתוך הבאים.<\/b> מַטְמִינִין עַצְמָם שֶׁלֹּא יַכִּירוּם, לְפִי שֶׁצִּוָּה לָהֶם אֲבִיהֶם שֶׁלֹּא יִתְרָאוּ כֻּלָּם בְּפֶתַח א', אֶלָּא שֶׁיִּכָּנֵס כָּל א' בְּפִתְחוֹ, כְּדֵי שֶׁלֹּא תִּשְׁלֹט בָּהֶם עַיִן הָרָע, שֶׁכֻּלָּם נָאִים וְכֻלָּם גִּבּוֹרִים:", "rashi_en": "בתוך הבאים AMONG THOSE THAT CAME — They hid themselves in the crowd that people should not recognize them, for their father had bidden them not to show themselves all at one entrance to the city but that each should enter by a different gate in order that the evil eye should not have power over them (i.e. that they should not attract the envious attention of the people) for they were all handsome and stalwart men (Midrash Tanchuma 1.:10:6). "}, {"ch": 42, "v": 6, "aliyah": 4, "heb": "וְיוֹסֵ֗ף ה֚וּא הַשַּׁלִּ֣יט עַל־הָאָ֔רֶץ ה֥וּא הַמַּשְׁבִּ֖יר לְכׇל־עַ֣ם הָאָ֑רֶץ וַיָּבֹ֙אוּ֙ אֲחֵ֣י יוֹסֵ֔ף וַיִּשְׁתַּֽחֲווּ־ל֥וֹ אַפַּ֖יִם אָֽרְצָה׃", "onk": "וְיוֹסֵף הוּא דְּשַׁלִּיט עַל אַרְעָא הוּא דְזַבִּין <b>עִיבוּרָא<\/b> לְכָל עַמָּא דְאַרְעָא וַאֲתוֹ אֲחֵי יוֹסֵף וּסְגִידוּ לֵיהּ עַל אַפַּיָּא עַל אַרְעָא:", "onk_en": "Yoseif was the ruler over the land; he was the one who sold [<b>grain<\/b>] to all the people of the land. Yoseif’s brothers came and they prostrated themselves to him with their faces to the ground.", "pj": "וְיוֹסֵף הוּא הֲוָה שַׁלִיט עַל אַרְעָא וִידַע דְאָחוֹי עָלִין לְמִזְבּוּן מַנֵי נְטוּרִין בְּתַרְעֵי קַרְתָּא לְמִכְתּוֹב כָּל דְעָלִיל בְּיוֹמָא הַהוּא שְׁמֵיהּ וְשֵׁם אָבוֹי וְהוּא הֲוָה מְזַבֵּן עִיבּוּרָא לְכָל עַמָא דְאַרְעָא וְאָתוּ אֲחֵי יוֹסֵף וּבְלָשׁוּ בִּסְרַטְיָיתָא וּבְפַלְטְיָיתָא וּבְבָתֵּי פוּנְדַקְתָּא וְלָא אַשְׁכְּחוּהוּ וְעָלוּ לְבַיְיתֵיהּ וּסְגָדוּ לֵיהּ עַל אַפֵּיהוֹם עַל אַרְעָא", "pj_en": "And Joseph was ruler over the land; and he knew that his brethren had come to buy; for he had appointed notaries at the gates of the city to register daily, of every one who came, his name and the name of his father; and he it was who sold corn to all the people of the land. And the brethren of Joseph came. And they looked through all the streets, and public places, and hospices, but could not find Him. And they came unto his house, and worshipped him with their faces to the ground.", "tj": "", "tj_en": "", "rashi": "<b>וישתחוו לו אפים.<\/b> נִשְׁתַּטְּחוּ לוֹ עַל פְּנֵיהֶם, וְכֵן כָּל הִשְׁתַּחֲוָאָה פִּשּׁוּט יָדַיִם וְרַגְלַיִם הוּא:", "rashi_en": "וישתחוו לו אפים means THEY PROSTRATED THEMSELVES ON THEIR FACES— Similarly wherever various forms of this verb (שחה) in the Hithpael occur it implies stretching out the hands and feet when a person casts himself on the ground in the act of prostration (Megillah 22b). "}, {"ch": 42, "v": 7, "aliyah": 4, "heb": "וַיַּ֥רְא יוֹסֵ֛ף אֶת־אֶחָ֖יו וַיַּכִּרֵ֑ם וַיִּתְנַכֵּ֨ר אֲלֵיהֶ֜ם וַיְדַבֵּ֧ר אִתָּ֣ם קָשׁ֗וֹת וַיֹּ֤אמֶר אֲלֵהֶם֙ מֵאַ֣יִן בָּאתֶ֔ם וַיֹּ֣אמְר֔וּ מֵאֶ֥רֶץ כְּנַ֖עַן לִשְׁבׇּר־אֹֽכֶל׃", "onk": "וַחֲזָא יוֹסֵף יָת אֲחוֹהִי וְאִשְׁתְּמוֹדְעִנּוּן <b>וְחַשִּׁיב מָה דְמַלֵּיל<\/b> לְהוֹן וּמַלִּיל עִמְּהוֹן קַשְׁיָא וַאֲמַר לְהוֹן מְנָן אֲתֵיתוּן וַאֲמָרוּ מֵאַרְעָא דִכְנַעַן לְמִזְבַּן <b>עִיבוּרָא<\/b>:", "onk_en": "Yoseif saw his brothers and he recognized them, but he acted like a stranger [<b>considered what he should say<\/b>] to them. He spoke harshly to them, and said to them, Where did you come from? They said, From the land of Canaan to buy food [<b>grain<\/b>].", "pj": "וַחֲמָא יוֹסֵף יַת אָחוֹי וְאִשְׁתְּמוֹדָעִינוּן וְאִתְעֲבֵיד בְּעֵינֵיהוֹם כַּחֲלוֹנָאֵי וּמַלֵיל עִמְהוֹם מִילִין קַשְׁיָין וְאָמַר לְהוֹם מְנָן אָתֵתוּן וַאֲמָרוּ מֵאַרְעָא דִכְנָעַן לְמִזְבַּן עִיבּוּרָא", "pj_en": "And Joseph saw his brethren, and recognised them; but he made himself as a stranger in their eyes, and spake hard words to them, and said to them, Whence come yon? And they said, From the land of Kenaan, to buy corn.", "tj": "", "tj_en": "", "rashi": "<b>ויתנכר אליהם.<\/b> נַעֲשָׂה לָהֶם כְּנָכְרִי בִּדְבָרִים לְדַבֵּר קָשׁוֹת:", "rashi_en": "ויתנכר אליהם HE MADE HIMSELF STRANGE UNTO THEM — He made himself like a נכרי a stranger to them in his conversation, speaking harshly (Genesis Rabbah 91:7). "}, {"ch": 42, "v": 8, "aliyah": 4, "heb": "וַיַּכֵּ֥ר יוֹסֵ֖ף אֶת־אֶחָ֑יו וְהֵ֖ם לֹ֥א הִכִּרֻֽהוּ׃", "onk": "וְאִשְׁתְּמוֹדַע יוֹסֵף יָת אֲחוֹהִי וְאִנּוּן לָא אִשְׁתְּמוֹדְעֵיהּ:", "onk_en": "Yoseif recognized his brothers, but they did not recognize him.", "pj": "וְאִשְׁתְּמוֹדַע יוֹסֵף יַת אָחוּהִי דְכַד אִתְפְּרַשׁ מִנְהוֹם הֲוָה לְהוֹם רוֹשָׁם דְקַן וְאִינוּן לָא אִשְׁתְּמוֹדְעוֹהִי דְלָא הֲוָה לֵיהּ רוֹשָׁם דְקַן וְהַהוּא שַׁעְתָּא אִית לֵיהּ", "pj_en": "Now Joseph recognised his brethren, because, when separated from them, they had the token of the beard; but they did not recognise him, because (at that time) he had not the token of the beard, and at this hour he had it.", "tj": "", "tj_en": "", "rashi": "<b>ויכר יוסף וגו'.<\/b> לְפִי שֶׁהִנִּיחָם חֲתוּמֵי זָקָן:<br><br><b>והם לא הכרהו.<\/b> שֶׁיָּצָא מֵאֶצְלָם בְּלֹא חֲתִימַת זָקָן, וְעַכְשָׁו בָּא בַחֲתִימַת זָקָן (כתובות כ\"ז):<br><br>וּמִ\"אַ <b>ויכר יוסף את אחיו<\/b> כְּשֶׁנִּמְסְרוּ בְיָדוֹ הִכִּיר שֶׁהֵם אֶחָיו וְרִחֵם עֲלֵיהֶם, וְהֵם לֹא הִכִּירוּהוּ כְּשֶׁנָּפַל בְּיָדָם לִנְהֹג בּוֹ אַחְוָה:", "rashi_en": "'ויכר יוסף וגו AND JOSEPH RECOGNISED HIS BRETHREN etc. — because, when he left them they were full-bearded (Yevamot 88a).<br><br>והם לא הכירהו BUT THEY RECOGNISED HIM NOT — because when he left them he had no beard whereas now he had grown a beard.<br><br>A Midrashic explanation is: ויכר יוסף את אחיו JOSEPH RECOGNISED HIS BRETHREN — Now that they were in his power he recognised them as his brothers and had pity on them, והם לא הכירהו but when he fell into their power, “they did not recognize him” as their brother, by acting towards him in brotherly manner (Genesis Rabbah 91:7). "}, {"ch": 42, "v": 9, "aliyah": 4, "heb": "וַיִּזְכֹּ֣ר יוֹסֵ֔ף אֵ֚ת הַחֲלֹמ֔וֹת אֲשֶׁ֥ר חָלַ֖ם לָהֶ֑ם וַיֹּ֤אמֶר אֲלֵהֶם֙ מְרַגְּלִ֣ים אַתֶּ֔ם לִרְא֛וֹת אֶת־עֶרְוַ֥ת הָאָ֖רֶץ בָּאתֶֽם׃", "onk": "וּדְכִיר יוֹסֵף יָת חֶלְמַיָּא דִּי חֲלִים לְהוֹן וַאֲמַר לְהוֹן מְאַלְלִין אַתּוּן לְמֶחֱזֵי יָת <b>בִּדְקָא דְאַרְעָא<\/b> אֲתֵיתוּן:", "onk_en": "Yoseif recalled the dreams that he had dreamt about them, and said to them, You are spies. You have come to see where the land is exposed [<b>the defective part of the land<\/b>].", "pj": "וּדְכִיר יוֹסֵף יַת חֶלְמַיָיא דְחָלַם עֲלֵיהוֹם וַאֲמַר לְהוֹם אַלִילֵי אַתּוּן לְמֶחֱמֵי יָת עִרְיָת מַטְעִיתָא דְאַרְעָא אֲתֵיתוּן לְמֶחְמֵי", "pj_en": "And Joseph remembered the dreams he had dreamed of them. And he said to them, You are spies: to see the nakedness of the shame of the land are you come.", "tj": "", "tj_en": "", "rashi": "<b>אשר חלם להם.<\/b> עֲלֵיהֶם; וְיָדַע שֶׁנִּתְקַיְּמוּ שֶׁהֲרֵי הִשְׁתַּחֲווּ לוֹ:<br><br><b>ערות הארץ.<\/b> גִּלּוּי הָאָרֶץ – מֵהֵיכָן הִיא נוֹחָה לִכָּבֵשׁ, כְּמוֹ אֶת מְקֹרָהּ הֶעֱרָה (ויקרא כ'), וּכְמוֹ עֵרֹם וְעֶרְיָה (יחזקאל ט\"ז) וְכֵן כָּל עֶרְוָה שֶׁבַּמִּקְרָא לְ' גִּלּוּי, וְתַ\"אֻ בִּדְקָא דְּאַרְעָא, כְּמוֹ בֶּדֶק הַבַּיִת (מלכים ב י\"ב), רְעוּעַ הַבַּיִת, אֲבָל לֹא דִּקְדֵּק לְפָרְשׁוֹ אַחַר לְשׁוֹן הַמִּקְרָא:", "rashi_en": "אשר חלם להם WHICH HE HAD DREAMED OF THEM — להם means “about them”. He then knew that they (the dreams) were being fulfilled, for they (his brothers) had bowed down to him.<br><br>ערות הארץ means THE NAKEDNESS OF THE LAND — from which side it might easily be conquered. Of similar meaning are, (Leviticus 20:18) “He hath made naked (הערה) her fountain”; (Ezekiel 16:7), “naked and עריה) bare”. Indeed all forms of this root ערה signify “uncovering”). Onkelos renders it by “the breach (בדקא) of the land”, similar to (2 Kings 12:6), “the breach (בדק) of the house”— the defective places in the house — but he was not particular to translate according to the wording of the text (i.e. literally). "}, {"ch": 42, "v": 10, "aliyah": 4, "heb": "וַיֹּאמְר֥וּ אֵלָ֖יו לֹ֣א אֲדֹנִ֑י וַעֲבָדֶ֥יךָ בָּ֖אוּ לִשְׁבׇּר־אֹֽכֶל׃", "onk": "וַאֲמָרוּ לֵיהּ לָא רִבּוֹנִי וְעַבְדָיךְ עַלּוּ לְמִזְבַּן <b>עִיבוּרָא<\/b>:", "onk_en": "They said to him, No my master. Your servants have come to buy food [<b>grain<\/b>].", "pj": "וַאֲמָרוּ לֵיהּ לָא רִבּוֹנִי וְעַבְדָךְ אָתָן לְמִזְבַּן עִיבּוּרָא", "pj_en": "And they answered him, No, my lord, thy servants are come to buy corn:", "tj": "", "tj_en": "", "rashi": "<b>לא אדני.<\/b> לֹא תֹאמַר כֵּן, שֶׁהֲרֵי עֲבָדֶיךָ בָּאוּ לִשְׁבָּר אֹכֶל:", "rashi_en": "לא אדני NAY, MY LORD — do not say this, for behold ועבדיך באו לשבר אכל THY SERVANTS HAVE COME TO BUY FOOD. "}, {"ch": 42, "v": 11, "aliyah": 4, "heb": "כֻּלָּ֕נוּ בְּנֵ֥י אִישׁ־אֶחָ֖ד נָ֑חְנוּ כֵּנִ֣ים אֲנַ֔חְנוּ לֹא־הָי֥וּ עֲבָדֶ֖יךָ מְרַגְּלִֽים׃", "onk": "כֻּלָּנָא בְּנֵי גַבְרָא חַד נָחְנָא כֵּיוָנֵי אֲנַחְנָא לָא הֲווֹ עַבְדָיךְ אַלִּילֵי:", "onk_en": "We are all the sons of one man. We are honest [men]. Your servants have never been spies.", "pj": "כֻּלָנָא בְּנֵי גַבְרָא חָד נַחְנָא מְהֶמְנֵי אֲנַחְנָא לָא הֲווֹ עַבְדָךְ אַלִילֵי", "pj_en": "we are all the sons of one man; we are true; thy servants are not spies.", "tj": "", "tj_en": "", "rashi": "<b>כלנו בני איש אחד נחנו.<\/b> נִצְנְצָה בָהֶם רוּחַ הַקֹּדֶשׁ וּכְלָלוּהוּ עִמָּהֶם, שֶׁאַף הוּא בֶּן אֲבִיהֶם:<br><br><b>כנים.<\/b> אֲמִתִּיִּים, כְּמוֹ כֵּן דִּבַּרְתָּ (שמות י'), כֵּן בְּנוֹת צְלָפְחָד דֹּבְרֹת (במדבר כ\"ז), וְעֶבְרָתוֹ לֹא כֵן בַּדָּיו (ישעיהו ט\"ז):", "rashi_en": "כלנו בני איש אחד נחנו WE ARE ALL ONE MAN’S SONS — The Holy Spirit was enkindled in them and they included him with themselves (by using the word “We”) that he, also, was the son of their father (Genesis Rabbah 91:7).<br><br>כנים means TRUE MEN — Similar examples of כן in sense of true, right, are (Exodus 10:29) “Thou hast spoken right (כן)”; (Numbers 27:7) “The daughters of Zelophechad speak (כן) right”; (Isaiah 16:6) “and his wrath, his untruthful (לא־כן) boastings”. "}, {"ch": 42, "v": 12, "aliyah": 4, "heb": "וַיֹּ֖אמֶר אֲלֵהֶ֑ם לֹ֕א כִּֽי־עֶרְוַ֥ת הָאָ֖רֶץ בָּאתֶ֥ם לִרְאֽוֹת׃", "onk": "וַאֲמַר לְהוֹן לָא אֲרֵי <b>בִדְקָא דְאַרְעָא<\/b> אֲתֵיתוּן לְמֶחֱזֵי:", "onk_en": "He said to them, No, You have come to see where the land is exposed [<b>the defective part of the land<\/b>].", "pj": "וַאֲמַר לְהוֹן לָא אֱלָהֵן עֶרְיַת מַטְעַיַית אַרְעָא אֲתֵיתוּן לְמֶחְמֵי", "pj_en": "But he said to them, No, but to see the nakedness of the shame of the land are you come.", "tj": "", "tj_en": "", "rashi": "<b>כי ערות הארץ באתם לראות.<\/b> שֶׁהֲרֵי נִכְנַסְתֶּם בְּי' שַׁעֲרֵי הָעִיר, לָמָּה לֹא נִכְנַסְתֶּם בְּשַׁעַר א'? (בראשית רבה):", "rashi_en": "כי ערות הארץ באתם לראות BUT TO SEE THE NAKEDNESS OF THE LAND YE ARE COME — I still insist that you are spies, for what you have just said bears this out for you have entered by ten different gates of the city; why did you not all enter by the same gate if you are really brothers and travelled together? (Genesis Rabbah 91:6). "}, {"ch": 42, "v": 13, "aliyah": 4, "heb": "וַיֹּאמְר֗וּ שְׁנֵ֣ים עָשָׂר֩ עֲבָדֶ֨יךָ אַחִ֧ים&thinsp;<small>׀<\/small>&thinsp;אֲנַ֛חְנוּ בְּנֵ֥י אִישׁ־אֶחָ֖ד בְּאֶ֣רֶץ כְּנָ֑עַן וְהִנֵּ֨ה הַקָּטֹ֤ן אֶת־אָבִ֙ינוּ֙ הַיּ֔וֹם וְהָאֶחָ֖ד אֵינֶֽנּוּ׃", "onk": "וַאֲמָרוּ תְּרֵין עֲסַר עַבְדָיךְ אַחִין אֲנַחְנָא בְּנֵי גַבְרָא חַד בְּאַרְעָא דִכְנָעַן וְהָא זְעֵירָא עִם אָבוּנָא יוֹמָא דֵין וְחַד לֵיתוֹהִי:", "onk_en": "They said, Your servants are twelve brothers, the sons of one man in the land of Canaan. Behold the youngest one is this day with our father, and one is no more.", "pj": "וַאֲמָרוּ תְּרֵיסַר עַבְדָךְ אַחִין אֲנַחְנָא בְּנֵי גַבְרָא חָד בְּאַרְעָא דִכְנָעַן וְהָא זְעֵירָא עִם אָבוּנָא יוֹמָא דֵין וְחַד נְפַק מִלְוָותָן וְלֵית אֲנַחְנָא יָדְעִין מַה הֲוָה בְּסֵיפֵיהּ", "pj_en": "They answered, Thy servants are twelve brothers, the sons of one man, in the land of Kenaan; and, behold, the youngest is tojday with our father, and one went from us, and we know not what hath been in his end!", "tj": "", "tj_en": "", "rashi": "<b>ויאמרו שנים עשר עבדיך וגו'.<\/b> וּבִשְׁבִיל אוֹתוֹ א' שֶׁאֵינֶנּוּ נִתְפַּזַּרְנוּ בָעִיר לְבַקְּשׁוֹ:", "rashi_en": "'ויאמרו שנים עשר עבדיך וגו AND THEY SAID, THY SERVANTS WERE TWELVE BRETHREN — [AND ONE IS NO MORE], and it is on account of that one who is no more that we dispersed ourselves through the city in order that we might search for him (Genesis Rabbah 91:6). "}, {"ch": 42, "v": 14, "aliyah": 4, "heb": "וַיֹּ֥אמֶר אֲלֵהֶ֖ם יוֹסֵ֑ף ה֗וּא אֲשֶׁ֨ר דִּבַּ֧רְתִּי אֲלֵכֶ֛ם לֵאמֹ֖ר מְרַגְּלִ֥ים אַתֶּֽם׃", "onk": "וַאֲמַר לְהוֹן יוֹסֵף הוּא דִּי מַלֵּילִית עִמְּכוֹן לְמֵימַר מְאַלִּילֵי אַתּוּן:", "onk_en": "Yoseif said to them, That is just what I said to you, saying: you are spies.", "pj": "וַאֲמַר לְהוֹם יוֹסֵף הוּא דְמַלֵילִית עִמְכוֹן לְמֵימַר אַלִילֵי אַתּוּן", "pj_en": "And Joseph said to them, This is what I have spoken to you, saying, You are spies.", "tj": "", "tj_en": "", "rashi": "<b>הוא אשר דברתי.<\/b> הַדָּבָר אֲשֶׁר דִּבַּרְתִּי שֶׁאַתֶּם מְרַגְּלִים, הוּא הָאֱמֶת וְהַנָּכוֹן, זֶהוּ לְפִי פְשׁוּטוֹ. וּמִדְרָשׁוֹ אָמַר לָהֶם וְאִלּוּ מְצָאתֶם אוֹתוֹ וְיִפְסְקוּ עֲלֵיכֶם מָמוֹן הַרְבֵּה, תִּפְדּוּהוּ? אָמְרוּ לוֹ הֵן, אָמַר לָהֶם וְאִם יֹאמְרוּ לָכֶם שֶׁלֹּא יַחֲזִירוּהוּ בְשׁוּם מָמוֹן, מַה תַּעֲשׂוּ? אָמְרוּ לוֹ לְכָךְ בָּאנוּ, לַהֲרֹג אוֹ לֵהָרֵג, אָמַר לָהֶם הוּא אֲשֶׁר דִּבַּרְתִּי אֲלֵיכֶם, לַהֲרֹג בְּנֵי הָעִיר בָּאתֶם, מְנַחֵשׁ אֲנִי בְּגָבִיעַ שֶׁלִּי שֶׁשְּׁנַיִם מִכֶּם הֶחֱרִיבוּ כְּרַךְ גָּדוֹל שֶׁל שְׁכֶם:", "rashi_en": "הוא אשר דברתי THAT IS IT THAT I SPAKE UNTO YOU — The statement which I made — that you are spies — is true and certain. This is the meaning according to the literal sense of the words. A Midrashic explanation is: he said to them, “And if you find him (your brother) and they demand of YOU a large sum, would you redeem him?” They answered him, “Certainly!” He asked them, “If they tell you that they will not restore him to you for any sum of money, what would you do?” They replied, “That is what we have come for — to kill or to be killed”. Whereupon he retorted:הוא אשר דברתי אליכם THAT IS JUST WHAT I SAID TO YOU — you have come to kill the people of this city. I have divined by my goblet that two of you destroyed the great city of Shechem (Genesis Rabbah 91:7). "}, {"ch": 42, "v": 15, "aliyah": 4, "heb": "בְּזֹ֖את תִּבָּחֵ֑נוּ חֵ֤י פַרְעֹה֙ אִם־תֵּצְא֣וּ מִזֶּ֔ה כִּ֧י אִם־בְּב֛וֹא אֲחִיכֶ֥ם הַקָּטֹ֖ן הֵֽנָּה׃", "onk": "בְּדָא תִּתְבַּחֲנוּן חֵי פַרְעֹה אִם תִּפְּקוּן מִכָּא אֶלָּהֵין בְּמֵתֵי אֲחוּכוֹן זְעֵירָא הָכָא:", "onk_en": "You shall be tested in this manner. By Pharaoh’s life, you shall not leave from here unless your youngest brother comes here.", "pj": "בַּהֲדָא מִילָא תִּתְבָּחֲרוּן חַיֵי דְפַרְעה אִין תִּפְקוּן מִיכָּא אֱלָהֵן בִּדְיֵיתֵי אֲחוּכוֹן קַלִילָא הָכָא", "pj_en": "By that word you shall be proved. (By) the life of Pharoh you shall not go hence unless your youngest brother be brought hither.", "tj": "", "tj_en": "", "rashi": "<b>חי פרעה.<\/b> אִם יִחְיֶה פַּרְעֹה. כְּשֶׁהָיָה נִשְׁבָּע לַשֶּׁקֶר, הָיָה נִשְׁבָּע בְּחַיֵּי פַרְעֹה:<br><br><b>אם תצאו מזה.<\/b> מִן הַמָּקוֹם הַזֶּה:", "rashi_en": "חי פרעה BY THE LIFE OF PHARAOH — If Pharaoh lives! Whenever he swore for the sake of appearance (literally, falsely) he swore by Pharaoh’s life (Genesis Rabbah 91:7).<br><br>אם תצאו מזה YE SHALL NOT GO FORTH FROM THIS i.e. from this place."}, {"ch": 42, "v": 16, "aliyah": 4, "heb": "שִׁלְח֨וּ מִכֶּ֣ם אֶחָד֮ וְיִקַּ֣ח אֶת־אֲחִיכֶם֒ וְאַתֶּם֙ הֵאָ֣סְר֔וּ וְיִבָּֽחֲנוּ֙ דִּבְרֵיכֶ֔ם הַֽאֱמֶ֖ת אִתְּכֶ֑ם וְאִם־לֹ֕א חֵ֣י פַרְעֹ֔ה כִּ֥י מְרַגְּלִ֖ים אַתֶּֽם׃", "onk": "שְׁלָחוּ מִנְּכוֹן חַד וִידַבֵּר יָת אֲחוּכוֹן וְאַתּוּן הִתְאַסְּרוּן וְיִתְבַּחֲנוּן פִּתְגָּמֵיכוֹן הַקְשׁוֹט <b>אַתּוּן אָמְרִין<\/b> וְאִם לָא חֵי פַרְעֹה אֲרֵי מְאַלִּילֵי אַתּוּן:", "onk_en": "Send one of you and let him bring your brother. You will remain locked up and your words will be tested whether there is [<b>you speak<\/b>] any truth with you. If not, by Pharaoh’s life, you are spies.", "pj": "פַּטְרוּ מִנְכוֹן חַד וְיִדְבַּר יַת אֲחוּכוֹן וְאַתּוּן תִּתְאָסְרוּן וְיִתְבָּחֲרוּן פִּתְגָמֵיכוֹן אִין קוּשְׁטָא עִמְכוֹן וְאִין לָא חַיֵי דְפַרְעה אֲרוּם אַלִלֵי אַתּוּן", "pj_en": "Send one of you, and bring your brother; but you shall be bound, and your words be proved if the truth is with you: and if not, (by) the life of Pharoh you are spies.", "tj": "", "tj_en": "", "rashi": "<b>האמת אתכם.<\/b> אִם אֱמֶת אִתְּכֶם, לְפִיכָךְ הֵ\"א נָקוּד פַּתָּח, שֶׁהוּא כְמוֹ בִלְשׁוֹן תֵּמַהּ <b>ואם לא<\/b> תְבִיאוּהוּ, <b>חי פרעה, כי מרגלים אתם<\/b>:", "rashi_en": "האמת אתכם means WHETHER THERE BE TRUTH IN YOU — therefore the ה has the vowel Patach, because it is a kind of question. And if you do not (ואם לא) bring) him חי פרעה כי מרגלים אתם BY THE LIFE OF PHARAOH, SURELY YOU ARE SPIES. "}, {"ch": 42, "v": 17, "aliyah": 4, "heb": "וַיֶּאֱסֹ֥ף אֹתָ֛ם אֶל־מִשְׁמָ֖ר שְׁלֹ֥שֶׁת יָמִֽים׃", "onk": "וּכְנַשׁ יָתְהוֹן (לְבֵית) לְמַטְּרָא תְּלָתָא יוֹמִין:", "onk_en": "He [then] put them together in prison for three days.", "pj": "וּכְנַשׁ יַתְהוֹם לְבֵית מַטְרָא תְּלָתָא יוֹמִין", "pj_en": "And he kept them together in the house of confinement three days.", "tj": "", "tj_en": "", "rashi": "<b>משמר.<\/b> בֵּית הָאֲסוּרִים:", "rashi_en": "משמר WARD — the prison-house."}, {"ch": 42, "v": 18, "aliyah": 4, "heb": "וַיֹּ֨אמֶר אֲלֵהֶ֤ם יוֹסֵף֙ בַּיּ֣וֹם הַשְּׁלִישִׁ֔י זֹ֥את עֲשׂ֖וּ וִֽחְי֑וּ אֶת־הָאֱלֹהִ֖ים אֲנִ֥י יָרֵֽא׃", "onk": "וַאֲמַר לְהוֹן יוֹסֵף בְּיוֹמָא תְלִיתָאָה דָּא עִיבִידוּ וְקַיִּימוּ <b>מִן קֳדָם יְיָ<\/b> אֲנָא דָחֵל:", "onk_en": "Yoseif said to them on the third day, Do this and live. [<b>From before God<\/b>] I fear God.", "pj": "וַאֲמַר לְהוֹם יוֹסֵף בְּיוֹמָא תְּלִיתָאָה דָא עִיבִידוּ וְאִתְקַיְימוּ מִן קֳדָם יְיָ אֲנָא דָחִיל", "pj_en": "And Joseph said to them on the third day, This do, that you may live; for I fear the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 19, "aliyah": 5, "heb": "אִם־כֵּנִ֣ים אַתֶּ֔ם אֲחִיכֶ֣ם אֶחָ֔ד יֵאָסֵ֖ר בְּבֵ֣ית מִשְׁמַרְכֶ֑ם וְאַתֶּם֙ לְכ֣וּ הָבִ֔יאוּ שֶׁ֖בֶר רַעֲב֥וֹן בָּתֵּיכֶֽם׃", "onk": "אִם כֵּיוָנֵי אַתּוּן אֲחוּכוֹן חַד יִתְאַסַּר בְּבֵית מַטַּרְתְּכוֹן וְאַתּוּן אִיזִילוּ אוֹבִילוּ <b>עִיבוּרָא דְּחַסִּיר בְּ<\/b>בָתֵּיכוֹן:", "onk_en": "If you are honest, one of your brothers will be imprisoned in your place of guarding, and you [the others] go bring food for your famished [<b>grain that is lacking in your<\/b>] households.", "pj": "אִם מְהֵמְנִין אַתּוּן אֲחוּכוֹן חַד יִתְאַסַר בְּבֵית מַטְרַתְכוֹן וְאַתּוּן אִיזִילוּ אוֹבִילוּ עִיבּוּרָא דִזְבַּנְתּוּן לִכְפֵינֵי בָתֵּיכוֹן", "pj_en": "If you are true, let one of your brothers be bound in the house of your confinement and go you, carry the corn, that you may buy for the hunger of your house,", "tj": "", "tj_en": "", "rashi": "<b>בבית משמרכם.<\/b> שֶׁאַתֶּם אֲסוּרִים בּוֹ עַכְשָׁו:<br><br><b>ואתם לכו הביאו.<\/b> לְבֵית אֲבִיכֶם:<br><br><b>שבר רעבון בתיכם.<\/b> מַה שֶּׁקְּנִיתֶם לְרַעֲבוֹן אַנְשֵׁי בָתֵּיכֶם:", "rashi_en": "בבית משמרכם (literally, in the house of your ward) — the house in which you are at present imprisoned.<br><br>ואתם לכו הביאו BUT YE, GO, CARRY to your father’s house.<br><br>שבר רעבון בתיכם CORN FOR THE FAMINE OF YOUR HOUSES — what you have purchased for the hunger of the people in your houses."}, {"ch": 42, "v": 20, "aliyah": 5, "heb": "וְאֶת־אֲחִיכֶ֤ם הַקָּטֹן֙ תָּבִ֣יאוּ אֵלַ֔י וְיֵאָמְנ֥וּ דִבְרֵיכֶ֖ם וְלֹ֣א תָמ֑וּתוּ וַיַּעֲשׂוּ־כֵֽן׃", "onk": "וְיָת אֲחוּכוֹן זְעֵירָא תַּיְתוּן לְוָתִי וִיהֵימְנוּן פִּתְגָּמֵיכוֹן וְלָא תְמוּתוּן וַעֲבָדוּ כֵן:", "onk_en": "Bring your youngest brother to me, so that your words will be verified, and you will not die. They decided to do so.", "pj": "וְיַת אֲחוּכוֹן קַלִילָא תַּיְיתוּן לְוָותִי וְיִתְהֵימִנוּן פִּתְגָמֵיכוֹן וְלָא תְמוּתוּן וַעֲבָדוּ כֵן", "pj_en": "and bring your youngest brother to me, that your words may be verified, and you may not die. And they did so.", "tj": "", "tj_en": "", "rashi": "<b>ויאמנו דבריכם.<\/b> יִתְאַמְּתוּ וְיִתְקַיְּמוּ; כְּמוֹ אָמֵן אָמֵן (במדבר ה'), וּכְמוֹ, יֵאָמֶן נָא דְּבָרְךָ (מלכים א ח'):", "rashi_en": "ויאמנו דבריכם— means so shall your words be verified and confirmed. Other examples are, (Numbers 5:22) “It is true, it is true (אמן אמן)”, and (1 Kings 8:26) “Let thy word, I pray thee, be verified (יאמן).”"}, {"ch": 42, "v": 21, "aliyah": 5, "heb": "וַיֹּאמְר֞וּ אִ֣ישׁ אֶל־אָחִ֗יו אֲבָל֮ אֲשֵׁמִ֣ים&thinsp;<small>׀<\/small>&thinsp;אֲנַ֘חְנוּ֮ עַל־אָחִ֒ינוּ֒ אֲשֶׁ֨ר רָאִ֜ינוּ צָרַ֥ת נַפְשׁ֛וֹ בְּהִתְחַֽנְנ֥וֹ אֵלֵ֖ינוּ וְלֹ֣א שָׁמָ֑עְנוּ עַל־כֵּן֙ בָּ֣אָה אֵלֵ֔ינוּ הַצָּרָ֖ה הַזֹּֽאת׃", "onk": "וַאֲמָרוּ גְּבַר לַאֲחוּהִי בְּקוּשְׁטָא חַיָּבִין אֲנַחְנָא עַל אָחוּנָא דִּי חֲזֵינָא עָקַת נַפְשֵׁיהּ כַּד הֲוָה מִתְחַנֶּן לָנָא וְלָא <b>קַבֵּלְנָא<\/b> מִנֵּיהּ עַל כֵּן אֲתָא (<small>נ\"א<\/small> אָתֵת) לְוָתָנָא עַקְתָא הָדָא:", "onk_en": "They said to one another, In truth, we are guilty regarding our brother. We saw the anguish of his soul when he pleaded with us and we did not listen [<b>obey him<\/b>]. That is why this trouble has come upon us.", "pj": "וַאֲמָרוּ גְבַר לְאָחוֹי בְּקוּשְׁטָא חַיָיבִין אֲנַחְנָא עַל אָחוּנָא דְחָמֵינָא אַנִיקֵי דְנַפְשֵׁיהּ כַּד הֲוָה מְפַיֵיס לָנָא וְלָא קַבֵּילְנָא מִנֵיהּ בְּגִין כֵּן אָתַת לָנָא עַקְתָא הָדָא", "pj_en": "And they said, a man to his brother, In truth we are guilty concerning our brother, when we saw the distress of his soul, when be entreated us, and we would not hearken to him; therefore hath this affliction come upon us.", "tj": "", "tj_en": "", "rashi": "<b>אבל.<\/b> כְּתַרְגּוּמוֹ בְּקוּשְׁטָא, וְרָאִיתִי בִּבְ\"רַ לִישְׁנָא דְרוֹמָאָה הוּא אֲבָל – בְּרַם:<br><br><b>באה אלינו.<\/b> טַעֲמוֹ בַּבֵּי\"ת, לְפִי שֶׁהוּא בִּלְשׁוֹן עָבָר, שֶׁכְּבָר בָּאָה, וְתַרְגּוּמוֹ אֲתַת לָנָא:", "rashi_en": "אבל VERILY — It is to be understood as the Targum renders it: בקושטא “in truth”. I have seen a statement in (Genesis Rabbah 91:8) that in the Roman (Latin) language אבל means ברם (verum) truly, indeed.<br><br>באה אלינו [THIS DISTRESS] HAS COME UPON US — The word באה has the accent upon the ב because it is the perfect tense — for it had already come upon them. The Targum therefore renders it by אתת which is a perfect tense in Aramaic — it has come. "}, {"ch": 42, "v": 22, "aliyah": 5, "heb": "וַיַּ֩עַן֩ רְאוּבֵ֨ן אֹתָ֜ם לֵאמֹ֗ר הֲלוֹא֩ אָמַ֨רְתִּי אֲלֵיכֶ֧ם&thinsp;<small>׀<\/small>&thinsp;לֵאמֹ֛ר אַל־תֶּחֶטְא֥וּ בַיֶּ֖לֶד וְלֹ֣א שְׁמַעְתֶּ֑ם וְגַם־דָּמ֖וֹ הִנֵּ֥ה נִדְרָֽשׁ׃", "onk": "וַאֲתֵיב רְאוּבֵן יָתְהוֹן לְמֵימַר הֲלָא אֲמָרִית לְוָתְכוֹן לְמֵימַר לָא תְחוֹבוּן (<small>נ\"א<\/small> תֶחְטָאוּן) בְּעוּלֵימָא וְלָא <b>קַבֶּלְתּוּן<\/b> וְאַף דְּמֵיהּ הָא מִתְבְּעֵי:", "onk_en": "Reuvein answered them saying, Did I not say to you to the following: Do not sin against the lad, but you did not listen [<b>obey<\/b>]; and now his blood is being avenged.", "pj": "עָנָא יַתְהוֹם רְאוּבֵן וְאָמַר הֲלָא אֲמָרִית לְכוֹן לְמֵימַר לָא תֵיחְטוּן בְּטַלְיָא וְלָא קַבֵּילְתּוּן מִינִי וְאוּף אַדְמֵיהּ הָא מִתְבָּעֵי מִינָן", "pj_en": "And Reuben answered them and said, Did I not tell you, saying, Do not sin against the youth? But you would not listen to me; and thus, behold, his blood is required of us.", "tj": "", "tj_en": "", "rashi": "<b>וגם דמו.<\/b> אֵתִין וְגַמִּין רִבּוּיִין – דָּמוֹ וְגַם דַּם הַזָּקֵן:", "rashi_en": "וגם דמו ALSO HIS BLOOD [IS REQUIRED] — the particles את and גם extend the scope of the clause; here it implies “his blood and also the blood of his old father” (Genesis Rabbah 91:8). "}, {"ch": 42, "v": 23, "aliyah": 5, "heb": "וְהֵם֙ לֹ֣א יָֽדְע֔וּ כִּ֥י שֹׁמֵ֖עַ יוֹסֵ֑ף כִּ֥י הַמֵּלִ֖יץ בֵּינֹתָֽם׃", "onk": "וְאִנּוּן לָא יָדְעוּן אֲרֵי שְׁמִיעַ יוֹסֵף אֲרֵי מְתֻרְגְּמָן הֲוָה בֵינֵיהוֹן:", "onk_en": "They did not know that Yoseif listened [understood], because the interpreter was between them.", "pj": "וְאִינוּן לָא הֲווֹ יָדְעִין אֲרוּם שָׁמַע הֲוָה יוֹסֵף בְּלִישַׁן בֵּית קוּדְשָׁא אֲרוּם הֲוָה מְנַשֶׁה לִמְתוּרְגְמָן בֵּינֵיהוֹם", "pj_en": "But they knew not that Joseph understood (heard) the holy language; for Menasheh was interpreter between them.", "tj": "וְהִינוּן לָא הֲווּ יָדְעִין אֲרוּם הֲוָה שְׁמִיעִי יוֹסֵף בִּלְשַׁן בֵּית קוּדְשָׁא אֲרוּם הֵיךְ כִּמְתוּרְגְמַן הֲוָה מְנַשֶׁה קָאִים בֵּינֵהוֹן:", "tj_en": "But they knew not that Joseph heard in the holy language; for as an interpeter Menasheh stood between them.", "rashi": "<b>והם לא ידעו כי שמע יוסף.<\/b> מֵבִין לְשׁוֹנָם, וּבְפָנָיו הָיוּ מְדַבְּרִים כֵּן:<br><br><b>כי המליץ בינתם.<\/b> כִּי כְּשֶׁהָיוּ מְדַבְּרִים עִמּוֹ הָיָה הַמֵּלִיץ בֵּינֵיהֶם הַיּוֹדֵעַ לָשׁוֹן עִבְרִי וְלָשׁוֹן מִצְרִי, וְהָיָה מֵלִיץ דִּבְרֵיהֶם לְיוֹסֵף וְדִבְרֵי יוֹסֵף לָהֶם, לְכָךְ הָיוּ סְבוּרִים שֶׁאֵין יוֹסֵף מַכִּיר בְּלָשׁוֹן עִבְרִי:<br><br><b>המליץ.<\/b> זֶה מְנַשֶּׁה:", "rashi_en": "והם לא ידעו כי שמע יוסף AND THEY KNEW NOT THAT JOSEPH שמע UNDERSTOOD their language, and they said this in his presence.<br><br>כי המליץ בינתם FOR THE INTERPRETER WAS BETWEEN THEM — for when they had spoken to him there was an interpreter between them who knew both the Hebrew and the Egyptian languages. He interpreted their words to Joseph and Joseph’s words to them. Consequently they were under the impression that Joseph did not understand the Hebrew language.<br><br>המליץ THE INTERPRETER — This was Manasseh (Genesis Rabbah 91:8). "}, {"ch": 42, "v": 24, "aliyah": 5, "heb": "וַיִּסֹּ֥ב מֵֽעֲלֵיהֶ֖ם וַיֵּ֑בְךְּ וַיָּ֤שׇׁב אֲלֵהֶם֙ וַיְדַבֵּ֣ר אֲלֵהֶ֔ם וַיִּקַּ֤ח מֵֽאִתָּם֙ אֶת־שִׁמְע֔וֹן וַיֶּאֱסֹ֥ר אֹת֖וֹ לְעֵינֵיהֶֽם׃", "onk": "וְאִסְתַּחַר מֵעִלָּוֵיהוֹן וּבְכָא וְתָב לְוָתְהוֹן וּמַלֵּיל עִמְּהוֹן וּדְבַר מִלְּוָתְהוֹן יָת שִׁמְעוֹן וַאֲסַר יָתֵיהּ לְעֵינֵיהוֹן:", "onk_en": "He turned away from them and cried. He returned to them and spoke to them. He took Shimon from them, and had him bound before their eyes.", "pj": "וְחָזַר מִלְוַותְהוֹם וּבְכָא וְתַב לְוַותְהוֹם וּמַלֵיל עִמְהוֹן וּדְבַר מִלְוַותְהוֹם יַת שִׁמְעוֹן דְיָעַט לְמִקְטְלֵיהּ וְכָפַת יָתֵיהּ קָמֵיהוֹן", "pj_en": "And he withdrew from them and wept, and returned and, spake with them. And from them he took Shimeon, who had counselled them to kill him, and bound him before them.", "tj": "", "tj_en": "", "rashi": "<b>ויסב מעליהם.<\/b> נִתְרַחֵק מֵעֲלֵיהֶם שֶׁלֹּא יִרְאוּהוּ בּוֹכֶה:<br><br><b>ויבך.<\/b> לְפִי שֶׁשָּׁמַע שֶׁהָיוּ מִתְחָרְטִין:<br><br><b>את שמעון.<\/b> הוּא הִשְׁלִיכוֹ לַבּוֹר, הוּא שֶׁאָמַר לְלֵוִי הִנֵּה בַּעַל הַחֲלֹמוֹת הַלָּזֶה בָּא (בראשית רבה). דָּבָר אַחֵר נִתְכַּוֵּן יוֹסֵף לְהַפְרִידוֹ מִלֵּוִי, שֶׁמָּא יִתְיָעֲצוּ שְׁנֵיהֶם לַהֲרֹג אוֹתוֹ:<br><br><b>ויאסר אתו לעיניהם.<\/b> לֹא אֲסָרוֹ אֶלָּא לְעֵינֵיהֶם, וְכֵיוָן שֶׁיָּצְאוּ הוֹצִיאוֹ וְהֶאֱכִילוֹ וְהִשְׁקָהוּ (בראשית רבה):", "rashi_en": "ויסב מעליהם AND HE TURNED AWAY FROM THEM — He moved some distance away from them so that they should not see him weeping.<br><br>ויבך AND HE WEPT because he heard that they regretted their past conduct to him.<br><br>את שמען SIMEON — he had cast him into the pit and it was he who had said to Levi “Behold, this dreamer cometh” (Tanchuma Yashan 1:10:17). Another explanation is: It was Joseph’s intention to separate him from Levi lest the two of them might conspire to kill him.<br><br>ויאסור אתו לעיניהם AND HE BOUND HIM BEFORE THEIR EYES — He only kept him in bonds whilst he was before their eyes, but as soon as they departed he freed him and gave him food and drink (Genesis Rabbah 91:8). "}, {"ch": 42, "v": 25, "aliyah": 5, "heb": "וַיְצַ֣ו יוֹסֵ֗ף וַיְמַלְא֣וּ אֶת־כְּלֵיהֶם֮ בָּר֒ וּלְהָשִׁ֤יב כַּסְפֵּיהֶם֙ אִ֣ישׁ אֶל־שַׂקּ֔וֹ וְלָתֵ֥ת לָהֶ֛ם צֵדָ֖ה לַדָּ֑רֶךְ וַיַּ֥עַשׂ לָהֶ֖ם כֵּֽן׃", "onk": "וּפַקִּיד יוֹסֵף וּמְלוֹ יָת מָנֵיהוֹן עִיבוּרָא וְלַאֲתָבָא כַסְפֵּיהוֹן גְּבַר לְסַקֵּיהּ וּלְמִתַּן לְהוֹן זְוָדִין לְאָרְחָא וַעֲבַד לְהוֹן כֵּן:", "onk_en": "Yoseif gave orders—and their vessels were filled with grain, and each one’s money was replaced in his sack; and they were given provisions for the journey. This is what he did for them.", "pj": "וּפְקִיד יוֹסֵף לְעַבְדוֹי וּמְלַן יַת מָנֵיהוֹן עִיבּוּרָא וּלְאָתָבָא כַּסְפֵּיהוֹן דִגְבַר לְגוֹ שַקֵיהּ וּלְמִיתַּן לְהוֹן זְוָודִין לְאָרְחָא וְעָבַד לְהוֹם כֵּן", "pj_en": "And Joseph commanded his servant to fill their vehicles with corn, and to return each man's money in his sack, and to give them provisions for the way. And he did so for them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 26, "aliyah": 5, "heb": "וַיִּשְׂא֥וּ אֶת־שִׁבְרָ֖ם עַל־חֲמֹרֵיהֶ֑ם וַיֵּלְכ֖וּ מִשָּֽׁם׃", "onk": "וּנְטָלוּ יָת עִיבוּרְהוֹן עַל חֲמָרֵיהוֹן וַאֲזָלוּ מִתַּמָּן:", "onk_en": "They placed their purchases of grain on their donkeys and they departed from there.", "pj": "וּנְטָלוּ יַת עִיבּוּרֵיהוֹן עַל חַמְרֵיהוֹן וַאֲזָלוּ מִתַּמָן", "pj_en": "And they laid their corn upon their asses and went thence.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 27, "aliyah": 5, "heb": "וַיִּפְתַּ֨ח הָאֶחָ֜ד אֶת־שַׂקּ֗וֹ לָתֵ֥ת מִסְפּ֛וֹא לַחֲמֹר֖וֹ בַּמָּל֑וֹן וַיַּרְא֙ אֶת־כַּסְפּ֔וֹ וְהִנֵּה־ה֖וּא בְּפִ֥י אַמְתַּחְתּֽוֹ׃", "onk": "וּפְתַח חַד יָת סַקֵּיהּ לְמִתַּן כִּסְתָא לַחֲמָרֵיהּ בְּבֵית מְבָתָא וַחֲזָא יָת כַּסְפֵּיהּ וְהָא הוּא בְּפוּם טוֹעֲנֵיהּ:", "onk_en": "The one opened his sack, to feed his donkey where they stayed overnight, and he saw his money, for behold it was in the opening of his bag.", "pj": "וּפְתַח לֵוִי דְאִשְׁתָּאֵר בִּלְחוֹדֵיהּ מִשִׁמְעוֹן חַבְרֵיהּ יַת שַקֵיהּ לְמִתַּן אַסְפַּסְתָּא לְחַמְרֵיהּ בְּבֵי מִבְתוֹתָא וַחֲמָא יַת כַּסְפֵּיהּ וְהָא הוּא בְּפוּם טוֹנֵיהּ", "pj_en": "Levi, who had been left without Shimeon his companion, opened his sack to give food to his ass at the place of lodging, and saw his money: behold, it was in the mouth of his pannier.", "tj": "", "tj_en": "", "rashi": "<b>ויפתח האחד.<\/b> הוּא לֵוִי, שֶׁנִּשְׁאַר יָחִיד מִשִּׁמְעוֹן בֶּן זוּגוֹ:<br><br><b>במלון.<\/b> בַּמָּקוֹם שֶׁלָּנוּ בַּלַּיְלָה:<br><br><b>אמתחתו.<\/b> הוּא שַׂק:", "rashi_en": "ויפתח האחד literally, AND THE ONE OPENED HIS SACK — This was Levi who remained alone (one) being without Simeon his companion (cf Targum Jonathan).<br><br>במלון means the place where they stayed over night — THE INN.<br><br>אמתחתו is the sack (שק) just mentioned."}, {"ch": 42, "v": 28, "aliyah": 5, "heb": "וַיֹּ֤אמֶר אֶל־אֶחָיו֙ הוּשַׁ֣ב כַּסְפִּ֔י וְגַ֖ם הִנֵּ֣ה בְאַמְתַּחְתִּ֑י וַיֵּצֵ֣א לִבָּ֗ם וַיֶּֽחֶרְד֞וּ אִ֤ישׁ אֶל־אָחִיו֙ לֵאמֹ֔ר מַה־זֹּ֛את עָשָׂ֥ה אֱלֹהִ֖ים לָֽנוּ׃", "onk": "וַאֲמַר לַאֲחוֹהִי אִתּוֹתַב כַּסְפִּי וְאַף הָא בְטוֹעֲנִי וּנְפַק <b>מַדַּע<\/b> לִבְּהוֹן וּתְוָהוּ גְּבַר לַאֲחוּהִי לְמֵימַר מָה דָא עֲבַד יְיָ לָנָא:", "onk_en": "He said to his brothers. My money has been returned, and behold it is also in my bag. [<b>The understanding of their<\/b>] Their hearts failed [<b>left<\/b>] them and they trembled, saying one to another, What is this that Elohim has done to us?", "pj": "וַאֲמַר לְאָחוֹהִי אִיתּוֹתַב כַּסְפִּי וְאוּף הָא בְּטוֹנִי וּנְפַק מַנְדַע לִבְּהוֹן וְתַוְהוּ גְבַר לְאָחוּהִי לְמֵימַר מַה דָא עָבַד יְיָ וְלָא בְּחוֹבָא דִילָנָא", "pj_en": "And he said to his brothers, My money is returned, behold, it is in my pannier. And knowledge failed from their hearts, and each wondered with his brother, saying, What is this which the Lord hath done, and not for sin of ours ?", "tj": "", "tj_en": "", "rashi": "<b>וגם הנה באמתחתי.<\/b> גַּם הַכֶּסֶף בּוֹ עִם הַתְּבוּאָה:<br><br><b>מה זאת עשה אלהים לנו.<\/b> לַהֲבִיאֵנוּ לִידֵי עֲלִילָה זוֹ, שֶׁלֹּא הוּשַׁב אֶלָּא לְהִתְעוֹלֵל עָלֵינוּ:", "rashi_en": "וגם הנה באמתחתי AND, LO, IT IS EVEN IN MY SACK — the money also (גם) is in it together with the grain.<br><br>מה זאת עשה אלהים לנו WHAT IS THIS THAT GOD HATH DONE UNTO US by bringing us into the danger of this accusation? For the money can only have been put back into our sacks in order to bring an accusation against us. "}, {"ch": 42, "v": 29, "aliyah": 5, "heb": "וַיָּבֹ֛אוּ אֶל־יַעֲקֹ֥ב אֲבִיהֶ֖ם אַ֣רְצָה כְּנָ֑עַן וַיַּגִּ֣ידוּ ל֔וֹ אֵ֛ת כׇּל־הַקֹּרֹ֥ת אֹתָ֖ם לֵאמֹֽר׃", "onk": "וַאֲתוֹ לְוַת יַעֲקֹב אֲבוּהוֹן אַרְעָא דִכְנָעַן וְחַוִּיאוּ לֵיהּ יָת כָּל דִּאֲרָעָן יָתְהוֹן לְמֵימָר:", "onk_en": "They came to their father Yaakov, to the land of Canaan, and they told him all that had happened to them, saying,", "pj": "וְאָתוּ לְוַת יַעֲקב אֲבוּהוֹן לְאַרְעָא דִכְנָעַן וְתַנִיאוּ לֵיהּ יַת כָּל דְאָרַע יַתְהוֹם לְמֵימָר", "pj_en": "And they came to Jakob their father in the land of Kenaan, and related to him all that had befallen them, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 30, "aliyah": 5, "heb": "דִּ֠בֶּ֠ר הָאִ֨ישׁ אֲדֹנֵ֥י הָאָ֛רֶץ אִתָּ֖נוּ קָשׁ֑וֹת וַיִּתֵּ֣ן אֹתָ֔נוּ כִּֽמְרַגְּלִ֖ים אֶת־הָאָֽרֶץ׃", "onk": "מַלֵּיל גַּבְרָא רִבּוֹנָא דְאַרְעָא עִמָּנָא קַשְׁיָן וִיהַב יָתָנָא כִּמְאַלִּילֵי יָת אַרְעָא:", "onk_en": "The man, the master of the land spoke to us harshly; and considered us as spies of the land.", "pj": "מַלֵיל גַבְרָא רִבּוֹנָא דְאַרְעָא עִמָנָא מִלִין קָשִׁין וּבְזִי יָתָן כִּמְאַלְלֵי אַרְעָא", "pj_en": "The man the lord of the land spake with us harshly, and treated us as spies of the country:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 31, "aliyah": 5, "heb": "וַנֹּ֥אמֶר אֵלָ֖יו כֵּנִ֣ים אֲנָ֑חְנוּ לֹ֥א הָיִ֖ינוּ מְרַגְּלִֽים׃", "onk": "וַאֲמַרְנָא לֵיהּ כֵּיוָנֵי אֲנָחְנָא לָא הֲוֵינָא מְאַלִּילֵי:", "onk_en": "We said to him, We are honest people, we have never been spies.", "pj": "וְאָמַרְנָא לֵיהּ מְהֵימְנֵי אֲנָן לָא הֲוֵינָא אַלִילֵי", "pj_en": "but we said to him, We are faithful men, not spies.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 32, "aliyah": 5, "heb": "שְׁנֵים־עָשָׂ֥ר אֲנַ֛חְנוּ אַחִ֖ים בְּנֵ֣י אָבִ֑ינוּ הָאֶחָ֣ד אֵינֶ֔נּוּ וְהַקָּטֹ֥ן הַיּ֛וֹם אֶת־אָבִ֖ינוּ בְּאֶ֥רֶץ כְּנָֽעַן׃", "onk": "תְּרֵין עֲסַר אֲנַחְנָא אַחִין בְּנֵי אָבוּנָא חַד לֵיתוֹהִי וּזְעֵירָא יוֹמָא דֵין עִם אָבוּנָא בְּאַרְעָא דִכְנָעַן:", "onk_en": "We are twelve brothers, sons of our [the same] father. One is no more, and the youngest is this day with our father in the land of Canaan.", "pj": "תְּרֵיסַר אֲנַחְנָא אַחִין בְּנֵי אָבוּנָא חַד לֵית אֲנָן יָדְעִין מַה הֲוָה בְּסוֹפֵיהּ וְקַלִילָא יוֹמָא דֵין עִם אָבוּנָא בְּאַרְעָא דִכְנָעַן", "pj_en": "We are twelve brothers, sons of our father; of one, we know not what was his end, and the youngest is tojday with our father in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 33, "aliyah": 5, "heb": "וַיֹּ֣אמֶר אֵלֵ֗ינוּ הָאִישׁ֙ אֲדֹנֵ֣י הָאָ֔רֶץ בְּזֹ֣את אֵדַ֔ע כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֲחִיכֶ֤ם הָֽאֶחָד֙ הַנִּ֣יחוּ אִתִּ֔י וְאֶת־רַעֲב֥וֹן בָּתֵּיכֶ֖ם קְח֥וּ וָלֵֽכוּ׃", "onk": "וַאֲמַר לָנָא גַּבְרָא רִבּוֹנָא דְאַרְעָא בְּדָא אִדַּע אֲרֵי כֵיוָנֵי אַתּוּן אֲחוּכוֹן חַד שְׁבוּקוּ לְוָתִי וְיָת <b>עִיבוּרָא דְחַסִּיר בְּ<\/b>בָתֵּיכוֹן סִיבוּ וֶאֱזִילוּ:", "onk_en": "The man, the master of the land, said to us, This is how I shall know that you are honest. Leave one of your brothers with me, and take food for your famished [<b>grain that is lacking in your<\/b>] households and go.", "pj": "וַאֲמַר לָנָא גַבְרָא רִיבּוֹנֵי אַרְעָא בְּדָא אִנְדַע אֲרוּם מְהֵימְנֵי אַתּוּן אֲחוּכוֹן חַד שְׁבוּקִי עִמִי וְיַת דְצָרִיךְ לִכְפוּנֵי בָּתֵּיכוֹן סוּבוּ וְטַיְילוּ", "pj_en": "And the man, the lord of the land said to us, By this I shall know that you are true. Leave me one of your brothers with me, and what is needed by the hunger of your houses take, and go,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 34, "aliyah": 5, "heb": "וְ֠הָבִ֠יאוּ אֶת־אֲחִיכֶ֣ם הַקָּטֹן֮ אֵלַי֒ וְאֵֽדְעָ֗ה כִּ֣י לֹ֤א מְרַגְּלִים֙ אַתֶּ֔ם כִּ֥י כֵנִ֖ים אַתֶּ֑ם אֶת־אֲחִיכֶם֙ אֶתֵּ֣ן לָכֶ֔ם וְאֶת־הָאָ֖רֶץ תִּסְחָֽרוּ׃", "onk": "וְאַיְתִיאוּ יָת אֲחוּכוֹן זְעֵירָא לְוָתִי וְאִדַּע אֲרֵי לָא מְאַלִּילֵי אַתּוּן אֲרֵי כֵיוָנֵי אַתּוּן יָת אֲחוּכוֹן אֶתֵּן לְכוֹן וְיָת אַרְעָא תַּעְבְּדוּן בַּהּ סְחוֹרְתָּא:", "onk_en": "Bring your youngest brother to me, and then I will know that you are not spies, but that you are honest men. I will return your brother to you, and you will [again] do business in the land.", "pj": "וְאַיְתִיאוּ יַת אֲחוּכוֹן קַלִילָא לְוָתִי וְאִנְדַע אֲרוּם לָא אַלִילֵי אַתּוּן אֶלָא מְהֵימְנִי אַתּוּן יַת אֲחוּכוֹן אֶתֵּן לְכוֹן וְיַת אַרְעָא תִּתְגְרוּן בִּפְרַגְמַטְיָא", "pj_en": "and bring your youngest brother to me, and I shall know that you are not spies, but faithful. I will (then) restore your brother to you, and you shall transact business in the land.", "tj": "", "tj_en": "", "rashi": "<b>ואת הארץ תסחרו.<\/b> תְּסוֹבְבוּ; וְכָל לְשׁוֹן סוֹחֲרִים וּסְחוֹרָה עַל שֵׁם שֶׁמְּחַזְרִים וְסוֹבְבִים אַחַר הַפְּרַקְמַטְיָא:", "rashi_en": "ואת הארץ תסחרו AND YE SHALL TRAVEL IN THE LAND — It means literally, “ye may travel round the land”. All such words as סוחרים merchants, סחורה merchandise, are derived from this root סחר to go round, because the merchants travel round looking for merchandise. "}, {"ch": 42, "v": 35, "aliyah": 5, "heb": "וַיְהִ֗י הֵ֚ם מְרִיקִ֣ים שַׂקֵּיהֶ֔ם וְהִנֵּה־אִ֥ישׁ צְרוֹר־כַּסְפּ֖וֹ בְּשַׂקּ֑וֹ וַיִּרְא֞וּ אֶת־צְרֹר֧וֹת כַּסְפֵּיהֶ֛ם הֵ֥מָּה וַאֲבִיהֶ֖ם וַיִּירָֽאוּ׃", "onk": "וַהֲוָה אִנּוּן מְרִיקִין סַקֵּיהוֹן וְהָא גְבַר צְרִיר כַּסְפֵּיהּ בְּסַקֵּיהּ וַחֲזוֹ יָת צְרָרֵי כַסְפֵּיהוֹן אִנּוּן וַאֲבוּהוֹן וּדְחִילוּ:", "onk_en": "They were emptying their sacks, and behold each man’s bundle of money was in his sack. They saw their bundles of money—they and their father and they were afraid.", "pj": "וַהֲוָה כַּד אִינוּן מְרִיקִין דִיסַקְיֵיהוֹן וְהָא גְבַר קְטַר כַּסְפֵּיהּ בְּדִיסְקְיֵיהּ וְחָמוֹן יַת קִטְרֵי כַּסְפֵּיהוֹן הִינוּן וַאֲבוּהוֹן וּדְחִילוּ עַל שִׁמְעוֹן דְשָׁבְקוּ תַּמָן", "pj_en": "And it was as they emptied their baggages, behold, every man's bundle of money was in his baggage; and they and their father saw the bundles of money, and they were afraid on account of Shimeon whom they had left there.", "tj": "", "tj_en": "", "rashi": "<b>צרור כספו.<\/b> קֶשֶׁר כַּסְפּוֹ:", "rashi_en": "צרור כספו means HIS BUNDLE OF MONEY."}, {"ch": 42, "v": 36, "aliyah": 5, "heb": "וַיֹּ֤אמֶר אֲלֵהֶם֙ יַעֲקֹ֣ב אֲבִיהֶ֔ם אֹתִ֖י שִׁכַּלְתֶּ֑ם יוֹסֵ֤ף אֵינֶ֙נּוּ֙ וְשִׁמְע֣וֹן אֵינֶ֔נּוּ וְאֶת־בִּנְיָמִ֣ן תִּקָּ֔חוּ עָלַ֖י הָי֥וּ כֻלָּֽנָה׃", "onk": "וַאֲמַר לְהוֹן יַעֲקֹב אֲבוּהוֹן יָתִי אַתְכֶּלְתּוּן יוֹסֵף <b>לֵיתוֹהִי<\/b> וְשִׁמְעוֹן לָא הֲוָה הָכָא (לֵיתוֹהִי) וְיָת בִּנְיָמִן תִּדְבְּרוּן עֲלַי הֲווֹ כָלְּהוֹן:", "onk_en": "Yaakov, their father, said to them, You have deprived me of children; Yoseif is no more [<b>not here<\/b>], Shimon is no more, and you would take Binyamin: All this has happened to me.", "pj": "וַאֲמַר לְהוֹם יַעֲקב אֲבוּהוֹן יָתִי אִתְכָּלְתּוּן יוֹסֵף אֲמַרְתּוּן חֵיוְתָא בִּישְׁתָּא אַכְלְתֵיהּ וְשִׁמְעוֹן אֲמַרְתּוּן מַלְכָּא דְאַרְעָא כַּפְתֵיהּ וְיַת בִּנְיָמִין בַּעֲיַין אַתּוּן לְמִיסַב עָלַי הֲוָאָה צוּקְתָא דְכוּלְהוֹן", "pj_en": "And Jakob their father said to them, Me have you bereaved! Of Joseph you said, An evil beast hath devoured him; of Shimeon you have said, The king of the land hath bound him; and Benjamin you seek to take away: upon me is the anguish of all of them.", "tj": "וַאֲמַר לְהוֹן יַעֲקב אֲבוּהוֹן יָתִי תְכֶלְתּוּן יוֹסֵף מִן שָׁעָא דִשְׁלָחִית יָתֵיהּ לְוַתְכוֹן לֵית אֲנָא יָדַע מַה הֲוָה בְּסוֹפֵיהּ וְיַת בִּנְיָמִין אַתּוּן בַּעֲיָין לְמִיסַב וְעָלַי הִינוּן לְמוֹקְמָא תְּרֵי עֲשַר שִׁבְטִין:", "tj_en": "And Jakob their father said to them Me have you bereaved of Joseph. From the hour that I sent him to you I have not known what was his end; and Benjamin you are seeking to take. Yet by me are to arise the twelve tribes.", "rashi": "<b>אתי שכלתם.<\/b> מְלַמֵּד שֶׁחֲשָׁדָן שֶׁמָּא הֲרָגוּהוּ אוֹ מְכָרוּהוּ כְיוֹסֵף:<br><br><b>שכלתם.<\/b> כָּל מִי שֶׁבָּנָיו אֲבוּדִים קָרוּי שַׁכּוּל:", "rashi_en": "אתי שכלתם ME YE HAVE BEREAVED OF CHILDREN — The inference is that he suspected them of having slain or sold him (Simeon) as they had done to Joseph (Genesis Rabbah 91:9).<br><br>שכלתם YE HAVE BEREAVED — any-one whose children are lost to him may be called (שכול) bereaved."}, {"ch": 42, "v": 37, "aliyah": 5, "heb": "וַיֹּ֤אמֶר רְאוּבֵן֙ אֶל־אָבִ֣יו לֵאמֹ֔ר אֶת־שְׁנֵ֤י בָנַי֙ תָּמִ֔ית אִם־לֹ֥א אֲבִיאֶ֖נּוּ אֵלֶ֑יךָ תְּנָ֤ה אֹתוֹ֙ עַל־יָדִ֔י וַאֲנִ֖י אֲשִׁיבֶ֥נּוּ אֵלֶֽיךָ׃", "onk": "וַאֲמַר רְאוּבֵן לְוַת אֲבוּהִי לְמֵימַר יָת תְּרֵין בְּנַי תְּמִית אִם לָא אַיְתִנֵּיהּ לְוָתָךְ הַב יָתֵיהּ עַל יְדִי וַאֲנָא אֲתֵבִנֵּיהּ לָךְ:", "onk_en": "Reuvein spoke to his father saying, Put my two sons to death if I do not bring him [Binyamin] back to you. Give him into my hands, and I will return him to you.", "pj": "וַאֲמַר רְאוּבֵן לְאָבוֹי לְמֵימַר יַת תְּרֵין בְּנַיי תִּקְטוֹל בְּשַׁמַתָּא אִין לָא אִיתִינֵיהּ לְוָותָךְ הַב יָתֵיהּ עַל יְדַיי וַאֲנָא אָתֵיבִנֵיהּ לָךְ", "pj_en": "And Reuben spake to his father, saying Slay my two sons with a curse if I do not bring him to thee. Give him into my hand, and I will restore him to thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 42, "v": 38, "aliyah": 5, "heb": "וַיֹּ֕אמֶר לֹֽא־יֵרֵ֥ד בְּנִ֖י עִמָּכֶ֑ם כִּֽי־אָחִ֨יו מֵ֜ת וְה֧וּא לְבַדּ֣וֹ נִשְׁאָ֗ר וּקְרָאָ֤הוּ אָסוֹן֙ בַּדֶּ֙רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ־בָ֔הּ וְהוֹרַדְתֶּ֧ם אֶת־שֵׂיבָתִ֛י בְּיָג֖וֹן שְׁאֽוֹלָה׃", "onk": "וַאֲמַר לָא יֵחוֹת בְּרִי עִמְּכוֹן אֲרֵי אֲחוּהִי מִית וְהוּא בִּלְחוֹדוֹהִי אֶשְׁתָּאַר וִיעַרְעִנֵּיהּ <b>מוֹתָא<\/b> בְּאָרְחָא דִּי תְהָכוּן בַּהּ וְתַחֲתוּן יָת שִׂיבְתִי בְּדָווֹנָא לִשְׁאוֹל:", "onk_en": "He [Yaakov] said, My son will not go down with you; for his brother is dead, and only he remains. Should misfortune [<b>death<\/b>] befall him on the way you are going, you will bring my white head down to the grave in sorrow.", "pj": "וַאֲמַר לָא יֵיחוּת בְּרִי עִמְכוֹן אֲרֵי אָחוֹי מִית וְהוּא בִּלְחוֹדוֹי אִשְׁתַּיֵיר מִן אִמֵיהּ וִיאַרְעִינֵיהּ מוֹתָא בְּאָרְחָא דְתַהֲכוּן בָּהּ וְתַחֲתוֹן יַת סֵיבָתִי בְּדָווּי לְבֵי קְבוּרְתָּא", "pj_en": "But he said, My son shall not go down with you; for his brother is dead, and he alone remains of his mother; and if death should befall him in the way that you go, you will bring down my age with mourning to the grave.", "tj": "", "tj_en": "", "rashi": "<b>לא ירד בני עמכם.<\/b> לֹא קִבֵּל דְּבָרָיו שֶׁל רְאוּבֵן, אָמַר בְּכוֹר שׁוֹטֶה הוּא זֶה, הוּא אוֹמֵר לְהָמִית בָּנָיו, וְכִי בָנָיו הֵם וְלֹא בָּנַי? (בראשית רבה):", "rashi_en": "לא ירד בני עמכם MY SON SHALL NOT GO DOWN WITH YOU — He did not accept Reuben’s offer. He said, “What a fool is this oldest son of mine! He suggests that I should kill his sons. Are they his only and not mine also?” (Genesis Rabbah 91:9)"}, {"ch": 43, "v": 1, "aliyah": 5, "heb": "וְהָרָעָ֖ב כָּבֵ֥ד בָּאָֽרֶץ׃", "onk": "וְכַפְנָא תַּקִּיף בְּאַרְעָא:", "onk_en": "The famine was severe in the land.", "pj": "וְכַפְנָא תַּקִיף בְּאַרְעָא", "pj_en": "But the famine was strong in the land.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 2, "aliyah": 5, "heb": "וַיְהִ֗י כַּאֲשֶׁ֤ר כִּלּוּ֙ לֶאֱכֹ֣ל אֶת־הַשֶּׁ֔בֶר אֲשֶׁ֥ר הֵבִ֖יאוּ מִמִּצְרָ֑יִם וַיֹּ֤אמֶר אֲלֵיהֶם֙ אֲבִיהֶ֔ם שֻׁ֖בוּ שִׁבְרוּ־לָ֥נוּ מְעַט־אֹֽכֶל׃", "onk": "וַהֲוָה כַּד סַפִּיקוּ (שֵׁצִיאוּ <small>עי' רש\"י<\/small>) לְמֵיכַל יָת <b>עִיבוּרָא<\/b> דְּאַיְתִיאוּ מִמִּצְרָיִם וַאֲמַר לְהוֹן אֲבוּהוֹן תּוּבוּ זְבוּנוּ לָנָא זְעֵיר עִיבוּרָא:", "onk_en": "When they had finished eating [<b>entirely comsumed<\/b>] the food [<b>grain<\/b>] that they had brought from Egypt, their father said to them, Go back and buy a little food [<b>grain<\/b>] for us.", "pj": "וַהֲוָה כַּד פָּסְקוּ לְמֵיכוּל יַת עִיבּוּרָא דְאַיְיתוּ מִמִצְרַיִם וַאֲמַר לְהוֹן אֲבוּהוֹן תּוּבוּ זַבִּינוּ לָנָא קַלִילוּ עִיבּוּרָא", "pj_en": "And it was when they had finished eating the corn they had brought from Mizraim, their father said to them, Return and buy us a little corn.", "tj": "", "tj_en": "", "rashi": "<b>כאשר כלו לאכל.<\/b> יְהוּדָה אָמַר לָהֶם הַמְתִּינוּ לַזָּקֵן עַד שֶׁתִּכְלֶה פַת מִן הַבַּיִת (בראשית רבה):<br><br><b>כאשר כלו.<\/b> כַּד שֵׁצִיאוּ, וְהַמְתַרְגֵּם כַּד סַפִּיקוּ טוֹעֶה; כַּאֲשֶׁר כִּלּוּ הַגְּמַלִּים לִשְׁתּוֹת מְתֻרְגָּם כַּד סַפִּיקוּ – כְּשֶׁשָּׁתוּ דֵי סִפּוּקָם הוּא גְמַר שְׁתִיָּתָם; אֲבָל זֶה כַּאֲשֶׁר כִּלּוּ לֶאֱכֹל, כַּאֲשֶׁר תַּם הָאֹכֶל הוּא, וּמְתַרְגְּמִינָן כַּד שֵׁצִיאוּ:", "rashi_en": "כאשר כלו לאכל WHEN THEY HAD EATEN UP — Judah said to them: Leave the old man alone until the house will run short of bread (Midrash Tanchuma, Miketz 8).<br><br>כאשר כלו WHEN THEY HAD FINISHED [EATING THE GRAIN] — The Targum renders it by כד שציאו which means “when they finished” in the sense of making an end of doing an action. He who has the reading in the Targum כד ספיקו “when they had enough” is in error. The words (24:22) כאשר כלו הגמלים לשתות “when the camels had finished drinking” are rightly rendered in the Targum כד ספיקו which means “when they had drunk sufficient for their needs”, for that was the end of their drinking. Here, however, this phrase “when they had finished eating” refers to the time when the food came to an end, and we should render it in the Targum by כד שציאו when they had finished (which means finishing in the sense of nothing being left over). "}, {"ch": 43, "v": 3, "aliyah": 5, "heb": "וַיֹּ֧אמֶר אֵלָ֛יו יְהוּדָ֖ה לֵאמֹ֑ר הָעֵ֣ד הֵעִד֩ בָּ֨נוּ הָאִ֤ישׁ לֵאמֹר֙ לֹֽא־תִרְא֣וּ פָנַ֔י בִּלְתִּ֖י אֲחִיכֶ֥ם אִתְּכֶֽם׃", "onk": "וַאֲמַר לֵיהּ יְהוּדָה לְמֵימָר אַסְהָדָא אַסְהֵד בָּנָא גַבְרָא לְמֵימַר לָא תֶחֱזוּן אַפַּי אֶלָּהֵין כַּד אֲחוּכוֹן עִמְּכוֹן:", "onk_en": "Yehudah spoke to him saying, The man warned us repeatedly, saying, You had better not see my face unless your brother is with you.", "pj": "וַאֲמַר לֵיהּ יְהוּדָה לְמֵימַר מְסַהֲדָא אַסְהִיד בְּנָא גַבְרָא לְמֵימַר לָא תֵיחְמוּן סְבַר אַפַּי בִּדְלֵית אֲחוּכוֹן זְעֵירָא עִמְכוֹן", "pj_en": "And Jehuda spake to him, saying, The man attesting attested to us saying, You shall not see the sight of my face unless your youngest brother be with you.", "tj": "", "tj_en": "", "rashi": "<b>העד העד.<\/b> לְשׁוֹן הַתְרָאָה שֶׁסְּתָם הַתְרָאָה מַתְרֶה בוֹ בִּפְנֵי עֵדִים, וְכֵן הַעִדֹתִי בַּאֲבוֹתֵיכֶם (ירמיהו י\"א); רֵד הָעֵד בָּעָם (שמות י\"ט):<br><br><b>לא תראו פני בלתי אחיכם אתכם.<\/b> לֹא תִרְאוּנִי בְלֹא אֲחִיכֶם אִתְּכֶם; וְאֻנְקְלוֹס תִּרְגֵּם אֶלָּהֵן כַּד אֲחוּכוֹן עִמְּכוֹן, יִשֵּׁב הַדָּבָר עַל אָפְנוֹ וְלֹא דִּקְדֵּק לְתַרְגֵּם אַחַר לְשׁוֹן הַמִּקְרָא:", "rashi_en": "העד העד [THE MAN] DID SOLEMNLY PROTEST UNTO US — The Hebrew is an expression signifying warning and it is derived from the root עוד to bear witness, because a warning is, as a rule, given in the presence of witnesses. Other examples are (Jeremiah 11:7) “I earnestly forewarned (העדותי) your fathers”, and (Exodus 19:21) “Go, warn (העד) the people.<br><br>“לא תראו מני בלתי אחיכם אתכם means YE SHALL NOT SEE ME IF YOUR BROTHER BE NOT WITH YOU — Onkelos renders it by אלהין כד אחוכון עמכון ,“except when your brother is with you” adding the word כד when, to which there is no corresponding word in the Hebrew text. He gave the explanation of the word (בלתי) correctly, but he was not particular to translate according to the exact expression used in the text. "}, {"ch": 43, "v": 4, "aliyah": 5, "heb": "אִם־יֶשְׁךָ֛ מְשַׁלֵּ֥חַ אֶת־אָחִ֖ינוּ אִתָּ֑נוּ נֵרְדָ֕ה וְנִשְׁבְּרָ֥ה לְךָ֖ אֹֽכֶל׃", "onk": "אִם אִיתָךְ מְשַׁלַּח יָת אָחוּנָא עִמָּנָא נֵיחוֹת וְנִזְבֵּן לָךְ עִיבוּרָא:", "onk_en": "If you will send our brother with us, we will go down and buy food [<b>grain<\/b>] for you.", "pj": "אִין אִיתָךְ מְשַׁדֵר יַת אָחוּנָא עִמָנָא נֵיחוֹת וְנִזְבּוֹן לָךְ עִבּוּרָא", "pj_en": "If thou wilt send our brother with us, we will go down and buy corn for thee;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 5, "aliyah": 5, "heb": "וְאִם־אֵינְךָ֥ מְשַׁלֵּ֖חַ לֹ֣א נֵרֵ֑ד כִּֽי־הָאִ֞ישׁ אָמַ֤ר אֵלֵ֙ינוּ֙ לֹֽא־תִרְא֣וּ פָנַ֔י בִּלְתִּ֖י אֲחִיכֶ֥ם אִתְּכֶֽם׃", "onk": "וְאִם לֵיתָךְ מְשַׁלַּח לָא נֵיחוֹת אֲרֵי גַבְרָא אֲמַר לָנָא לָא תֶחֱזוּן אַפַּי אֶלָּהֵין כַּד אֲחוּכוֹן עִמְּכוֹן:", "onk_en": "But if you will not send [him] we will not go down; for the man said to us, You had better not see my face unless your brother is with you.", "pj": "וְאִין לַיְיתָךְ מְשַׁדֵר לָא נֵיחוֹת אֲרוּם גַבְרָא אָמַר לָנָא לָא תֵיחְמוֹן סְבַר אַפַּיי בִּדְלֵית אֲחוּכוֹן עִמְכוֹן", "pj_en": "but if thou wilt not send (him), we will not go down; for the man told us, You shall not see the sight of my face unless your brother be with you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 6, "aliyah": 5, "heb": "וַיֹּ֙אמֶר֙ יִשְׂרָאֵ֔ל לָמָ֥ה הֲרֵעֹתֶ֖ם לִ֑י לְהַגִּ֣יד לָאִ֔ישׁ הַע֥וֹד לָכֶ֖ם אָֽח׃", "onk": "וַאֲמַר יִשְׂרָאֵל לְמָה אַבְאֶשְׁתּוּן לִי לְחַוָּאָה לְגַבְרָא הַעַד כְּעַן לְכוֹן אָחָא:", "onk_en": "Yisrael said, Why did you do such harm to me, by telling the man that you had another brother.", "pj": "וַאֲמַר יִשְרָאֵל לְמָא אַבְאֵישְׁתּוּן לִי לְחַוָואָה לְגַבְרָא הַעַד כְּדוֹן אִית לְכוֹן אָחָא", "pj_en": "And Israel said, Why did you do me evil in showing the man that you had yet a brother?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 7, "aliyah": 5, "heb": "וַיֹּאמְר֡וּ שָׁא֣וֹל שָֽׁאַל־הָ֠אִ֠ישׁ לָ֣נוּ וּלְמֽוֹלַדְתֵּ֜נוּ לֵאמֹ֗ר הַע֨וֹד אֲבִיכֶ֥ם חַי֙ הֲיֵ֣שׁ לָכֶ֣ם אָ֔ח וַנַּ֨גֶּד־ל֔וֹ עַל־פִּ֖י הַדְּבָרִ֣ים הָאֵ֑לֶּה הֲיָד֣וֹעַ נֵדַ֔ע כִּ֣י יֹאמַ֔ר הוֹרִ֖ידוּ אֶת־אֲחִיכֶֽם׃", "onk": "וַאֲמָרוּ מִשְׁאַל שָׁאֵל גַּבְרָא לָנָא וּלְיַלָּדוּתָנָא לְמֵימַר הַעַד כְּעַן אֲבוּכוֹן קַיָּם הַאִית לְכוֹן אָחָא וְחַוֵּינָא לֵיהּ עַל מֵימַר פִּתְגָּמַיָּא הָאִלֵּין הֲמִדַּע הֲוֵינָא יָדְעִין אֲרֵי יֵימַר אוֹחִיתוּ יָת אֲחוּכוֹן:", "onk_en": "They said, The man asked us repeatedly, about ourselves and about our family, saying. Is your father still alive? Do you have a brother? We told him according to his words. Could we have known that he would say, Bring your brother down?", "pj": "וַאֲמָרוּ מִישְׁאַל שְׁאֵיל גַבְרָא לָנָא וּלְיִחוּסָנָא לְמֵימָר הַעַד כְּדוּן אֲבוּכוֹן קַיָים הַאִית לְכוֹן אָחָא וּתְנֵינָא לֵיהּ עַל מֵימָר פִּתְגָמַיָיא הָאִלֵין הֲמֵידַע הֲוֵינָא יָדְעִין דְיֵימַר אָחִיתוּ יַת אֲחוּכוֹן", "pj_en": "And they said, The man demanding demanded (to know) about us, and about our family, saying Is your father yet living? Have you a brother? And we informed him according to the word of these things. Could we know that be would say, Bring your brother down?", "tj": "", "tj_en": "", "rashi": "<b>לנו ולמולדתנו.<\/b> לְמִשְׁפְּחוֹתֵנוּ. וּמִדְרָשׁוֹ אֲפִלּוּ עֲצֵי עֲרִיסוֹתֵנוּ גִּלָּה לָנוּ:<br><br><b>ונגד לו.<\/b> שֶׁיֵּשׁ לָנוּ אָב וְאָח:<br><br><b>על פי הדברים האלה.<\/b> עַל פִּי שְׁאֵלוֹתָיו אֲשֶׁר שָׁאַל, הֻזְקַקְנוּ לְהַגִּיד:<br><br><b>כי יאמר.<\/b> אֲשֶׁר יֹאמַר, כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן אִם וְאִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר; הֲרֵי זֶה שִׁמּוּשׁ אֶחָד מֵאַרְבַּע לְשׁוֹנוֹתָיו שֶׁמְּשַׁמֵּשׁ כִּי, וְהוּא אִם, שֶׁהֲרֵי כִּי זֶה כְמוֹ אִם, כְּמוֹ עַד אִם דִּבַּרְתִּי דְּבָרָי (בראשית כ״ד:ל״ג):", "rashi_en": "לנו ולמולדתנו CONCERNING OURSELVES AND CONCERNING OUR KINDRED — concerning our families. A Midrashic comment based upon the meaning of מולדת, “birth” — He asked of us concerning the circumstances of our birth — is: he could even tell us of what kind of wood our cradles were made (Genesis Rabbah 91:10).<br><br>ונגד לו AND WE TOLD HIM that we had a father and a brother.<br><br>על פי הדברים האלה ACCORDING TO THE TENOR OF THESE WORDS — we were forced to tell him according to the tenor of the questions he put to us.<br><br>כי יאמר THAT HE WOULD SAY — The word כי is used here in the sense of אשר “that”. The word כי may be used in the sense of אם and אם may be used in the sense of אשר; therefore this (i.e. אשר) is one of the four meanings in which כי, according to the Rabbis, is used, viz., אם (Rosh Hashanah 3a), for the word כי here has the same meaning as אם, as in (24:33) עד אם דברתי דברי “until that I have spoken my words” (where אם is the same as כי or אשר)."}, {"ch": 43, "v": 8, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יְהוּדָ֜ה אֶל־יִשְׂרָאֵ֣ל אָבִ֗יו שִׁלְחָ֥ה הַנַּ֛עַר אִתִּ֖י וְנָק֣וּמָה וְנֵלֵ֑כָה וְנִֽחְיֶה֙ וְלֹ֣א נָמ֔וּת גַּם־אֲנַ֥חְנוּ גַם־אַתָּ֖ה גַּם־טַפֵּֽנוּ׃", "onk": "וַאֲמַר יְהוּדָה לְיִשְׂרָאֵל אֲבוּהִי שְׁלַח עוּלֵימָא עִמִּי וְנֵקוּם וְנֵזֵיל וְנֵיחֵי וְלָא נְמוּת אַף אֲנַחְנָא אַף אַתְּ אַף טַפְלָנָא:", "onk_en": "Yehudah said to his father, Yisrael, Send the lad with me, and we will get up and go; let us live and not die, we, you and our children.", "pj": "וַאֲמַר יְהוּדָה לְיִשְרָאֵל אָבוֹי שָׁדַר טַלְיָא עִמִי וְנֵיקוֹם וְנֵיזֵיל וְנֵיחֵי וְלָא נְמוּת אוּף אֲנַן אוּף אַנְתְּ אוּף טַפְלָנָא", "pj_en": "And Jehuda said to Israel his father, Send the youth with me, that we may arise and go; and that we may live and not die, both we, and you, and our little ones.", "tj": "", "tj_en": "", "rashi": "<b>ונחיה.<\/b> נִצְנְצָה בוֹ רוּחַ הַקֹּדֶשׁ, עַל יְדֵי הֲלִיכָה זוֹ תְחִי רוּחֲךָ, שֶׁנֶּאֱמַר וַתְּחִי רוּחַ יַעֲקֹב אֲבִיהֶם (בראשית מ\"ה):<br><br><b>ולא נמות.<\/b> בָּרָעָב; בִּנְיָמִין סָפֵק יִתָּפֵשׂ סָפֵק לֹא יִתָּפֵשׂ, וְאָנוּ כֻּלָּנוּ מֵתִים בָּרָעָב אִם לֹא נֵלֵךְ, מוּטָב שֶׁתַּנִּיחַ אֶת הַסָּפֵק וְתִתְפֹּשׂ אֶת הַוַּדַּאי:", "rashi_en": "ונחיה THAT WE MAY LIVE — (literally, and we shall live). The spirit of prophecy was enkindled within him. He said: owing to this journey your spirit will live again, which indeed happened, as it is said, (Genesis 45:27) “And the spirit of Jacob, their father, revived”.<br><br>ולא נמות AND THAT WE MAY NOT DIE of hunger. As for Benjamin it is doubtful whether he will be seized or whether he will not be seized, but as for us, we shall certainly all die of hunger if we do not go. It is better that you should let go what is doubtful and snatch at what is certain (Genesis Rabbah 91:6). "}, {"ch": 43, "v": 9, "aliyah": 5, "heb": "אָֽנֹכִי֙ אֶֽעֶרְבֶ֔נּוּ מִיָּדִ֖י תְּבַקְשֶׁ֑נּוּ אִם־לֹ֨א הֲבִיאֹתִ֤יו אֵלֶ֙יךָ֙ וְהִצַּגְתִּ֣יו לְפָנֶ֔יךָ וְחָטָ֥אתִֽי לְךָ֖ כׇּל־הַיָּמִֽים׃", "onk": "אֲנָא מְעָרַבְנָא בֵיהּ מִן יְדִי תִּבְעִנֵּיהּ אִם לָא אַיְתִנֵּיהּ לָךְ וַאֲקֵימִנֵּיהּ קֳדָמָךְ וְאֵהֵי <b>חָטֵי<\/b> לָךְ כָּל יוֹמַיָּא:", "onk_en": "I will be security for him. You will demand him from my hand. If I do not bring him to you, and set him before you, I will have sinned [<b>be a sinner<\/b>] to you for all time.", "pj": "אֲנָא מְעַרַבְנָא בֵּיהּ מִן יְדַי תַּבְעִינֵיהּ אִין לָא אַיְיתִינֵיהּ לְוָתָךְ וַאַקִימִינֵיהּ לְקָמָךְ וְנִתְחַיֵיב קָמָךְ כָּל יוֹמַיָא", "pj_en": "I will be surety for him: of my hand shalt thou require him. If I bring him not to thee again, and set him before thee, the guilt be upon me before thee all days.", "tj": "נֶהֱוֵי מְרַחִיק מִן מִשְׁאַל בִּשְׁלָמָא דְאַבָּא כָּל יוֹמַיָא:", "tj_en": "I will be afar off from the salutation of my father all days.", "rashi": "<b>והצגתיו לפניך.<\/b> שֶׁלֹּא אֲבִיאֶנּוּ אֵלֶיךָ מֵת, כִּי אִם חַי:<br><br><b>וחטאתי לך כל הימים.<\/b> לָעוֹלָם הַבָּא:", "rashi_en": "והצגתיו לפניך AND SET HIM BEFORE THEE — for I will not bring him back to you dead but alive.<br><br>וחטאתי לך כל הימים THEN SHALL I HAVE SINNED AGAINST THEE ALL THE DAYS — also in the world to come (Genesis Rabbah 91:10). "}, {"ch": 43, "v": 10, "aliyah": 5, "heb": "כִּ֖י לוּלֵ֣א הִתְמַהְמָ֑הְנוּ כִּֽי־עַתָּ֥ה שַׁ֖בְנוּ זֶ֥ה פַעֲמָֽיִם׃", "onk": "אֲרֵי אִלּוּלָפוֹן בְּדָא אִתְעַכָּבְנָא אֲרֵי כְעַן תַּבְנָא דְּנַן תַּרְתֵּין זִמְנִין:", "onk_en": "If we had not hesitated until now, we could have been there and back twice.", "pj": "אֲרוּם אִילוּלֵי פוֹן שְׁהִינָא אֲרוּם כְּדוֹן תַּבְנָא דְנַן תַּרְתֵּין זִמְנִין", "pj_en": "For unless we had thus delayed, we should already have returned these two times.", "tj": "", "tj_en": "", "rashi": "<b>לולא התמהמנו<\/b> עַל יָדְךָ, כְּבָר הָיִינוּ שָׁבִים עִם שִׁמְעוֹן וְלֹא נִצְטַעַרְתָּ כָּל הַיָּמִים הַלָּלוּ:", "rashi_en": "לולא התמהמהנו EXCEPT WE HAD LINGERED — through you, we would have already come back with Simeon and you would not have had this anxiety all these days. "}, {"ch": 43, "v": 11, "aliyah": 5, "heb": "וַיֹּ֨אמֶר אֲלֵהֶ֜ם יִשְׂרָאֵ֣ל אֲבִיהֶ֗ם אִם־כֵּ֣ן&thinsp;<small>׀<\/small>&thinsp;אֵפוֹא֮ זֹ֣את עֲשׂוּ֒ קְח֞וּ מִזִּמְרַ֤ת הָאָ֙רֶץ֙ בִּכְלֵיכֶ֔ם וְהוֹרִ֥ידוּ לָאִ֖ישׁ מִנְחָ֑ה מְעַ֤ט צֳרִי֙ וּמְעַ֣ט דְּבַ֔שׁ נְכֹ֣את וָלֹ֔ט בׇּטְנִ֖ים וּשְׁקֵדִֽים׃", "onk": "וַאֲמַר לְהוֹן יִשְׂרָאֵל אֲבוּהוֹן אִם כֵּן הָכָא דָּא עִיבִידוּ סִיבוּ מִדִּמְשַׁבַּח בְּאַרְעָא בְּמָנֵיכוֹן וְאוֹחִיתוּ לְגַבְרָא תִּקְרֻבְתָּא זְעֵיר קְטַף וּזְעֵיר דְּבַשׁ שְׁעַף וּלְטוֹם בָּטְנִין וְשִׁגְדִין:", "onk_en": "Their father Yisrael said to them, If so, here, this is what you must do: Take of the best fruits of the land in your vessels, and take an offering to the man, a little balsam, a little honey, gum, labdanum, pistachios and almonds.", "pj": "וַאֲמַר לְהוֹם יִשְרָאֵל אֲבוּהוֹם אִין כְּדוֹן הוּא דָא עִיבִידוּ סְבוּ מִמַה דִמְשַׁבַּח בְּאַרְעָא וְהָבוּ בְּמָנֵיכוֹן וְאָחִיתוּ לְגַבְרָא דוֹרוֹנָא קָלִיל שְרָף קְטָף וְקָלִיל דְבַשׁ שַׁעֲוָה וּלְטוֹם מְשַׁח דְבוּטְנִין וּמְשַׁח דְלוּזִין", "pj_en": "And Israel their father said to them, If it must be so, do this: Take of the praiseworthy things of the land, and put them in your vessels, and carry down the man a present, a little gum and a little honey, wax and ladanum, the oil of nuts, and the oil of almonds,", "tj": "", "tj_en": "", "rashi": "<b>אפוא.<\/b> לְשׁוֹן יֶתֶר הוּא, לְתַקֵּן מִלָּה בְלָשׁוֹן עִבְרִי, אִם כֵּן אֶזְדַּקֵּק לַעֲשׂוֹת, שֶׁאֶשְׁלָחֶנּוּ עִמָּכֶם, צָרִיךְ אֲנִי לַחֲזֹר וּלְבַקֵּשׁ אַיֵּה פֹה תַקָּנָה וְעֵצָה לְהַשִּׂיאֲכֶם, וְאוֹמֵר אֲנִי <b>זאת עשו<\/b>:<br><br><b>מזמרת הארץ.<\/b> מִדִּמְשַׁבַּח בְּאַרְעָא – שֶׁהַכֹּל מְזַמְּרִים עָלָיו כְּשֶׁהוּא בָא לָעוֹלָם:<br><br><b>נכאת.<\/b> שַׁעֲוָה:<br><br><b>בטנים.<\/b> לֹא יָדַעְתִּי מַה הֵם, וּבְפֵרוּשֵׁי א\"ב שֶׁל רַבִּי מָכִיר רָאִיתִי פשט\"ציאס וְדוֹמֶה לִי שֶׁהֵם אֲפַרְסְקִין:", "rashi_en": "אפוא NOW — This is really a redundant word used in Hebrew for stylistic purposes. If it be so that I am compelled to do this — that I must send him with you — I must endeavour to seek where (אי) there is here (פה) some measure and plan to propose to you and therefore, I say: “Do this”.<br><br>מזמרת הארץ OF THE CHOICE PRODUCTS OF THE LAND — This is rendered in the Targum by “Take of that which is praised in the land” — that about which people sing its praise (מזמרים) when it comes into existence (Genesis Rabbah 91:11).<br><br>נכאת is WAX (Genesis Rabbah 91:11; cf. 37:25).<br><br>בטנים PISTACHIO-NUTS — I do not know what these are. but in the definitions given in the Dictionary of R. Machir I have read that they are Pistachios; I think that they are peaches. "}, {"ch": 43, "v": 12, "aliyah": 5, "heb": "וְכֶ֥סֶף מִשְׁנֶ֖ה קְח֣וּ בְיֶדְכֶ֑ם וְאֶת־הַכֶּ֜סֶף הַמּוּשָׁ֨ב בְּפִ֤י אַמְתְּחֹֽתֵיכֶם֙ תָּשִׁ֣יבוּ בְיֶדְכֶ֔ם אוּלַ֥י מִשְׁגֶּ֖ה הֽוּא׃", "onk": "וְכַסְפָּא עַל חַד תְּרֵין סִיבוּ בְיֶדְכוֹן וְיָת כַּסְפָּא דְּאִתּוֹתַב בְּפוּם טוֹעֲנֵיכוֹן תְּתִיבוּן בְּיֶדְכוֹן מָאִים שָׁלוּ הוּא:", "onk_en": "Take double the money in your hands; and the money that was returned in the opening of your bags return by your own hands. Perhaps it was an oversight.", "pj": "וְכַסְפָּא עַל חַד תְּרֵין סִיבוּ בִּידֵיכוֹן וְיַת כַּסְפָּא דְאִיתּוֹתַב בְּפוּם טוֹעֲנֵיכוֹן תְּתוּבוּן בִּידֵיכוֹן דִילְמָא בְּשָׁלוּ הֲוָה", "pj_en": "and money two upon one take in your hands, even the money that was returned in the mouth of your baggage, take back in your hands; perhaps it was done in error.", "tj": "בְּכֵיפְלָא:", "tj_en": "Double", "rashi": "<b>וכסף משנה.<\/b> פִּי שְׁנַיִם כָּרִאשׁוֹן:<br><br><b>קחו בידכם.<\/b> לִשְׁבֹּר אֹכֶל, שֶׁמָּא הוּקַר הַשַּׁעַר:<br><br><b>אולי משגה הוא.<\/b> שֶׁמָּא הַמְמֻנֶּה עַל הַבַּיִת שְׁכָחוֹ שׁוֹגֵג:", "rashi_en": "וכסף משנה AND DOUBLE MONEY — twice as much as at first.<br><br>קחו בידכם TAKE IN YOUR HAND to buy food: perhaps the market-price has risen (Genesis Rabbah 91:11).<br><br>אולי משגה הוא PERADVENTURE IT WAS AN OVERSIGHT — perhaps the man in charge of the house forgot it inadvertently). "}, {"ch": 43, "v": 13, "aliyah": 5, "heb": "וְאֶת־אֲחִיכֶ֖ם קָ֑חוּ וְק֖וּמוּ שׁ֥וּבוּ אֶל־הָאִֽישׁ׃", "onk": "וְיָת אֲחוּכוֹן דְּבָרוּ וְקוּמוּ תּוּבוּ לְוַת גַּבְרָא:", "onk_en": "Take your brother, get up and return to the man.", "pj": "וְיַת אֲחוּכוֹן דְבָרוּ וְקוּמוּ תוּבוּ לְוַת גַבְרָא", "pj_en": "And take Benjamin your brother, and arise, return to the man,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 14, "aliyah": 5, "heb": "וְאֵ֣ל שַׁדַּ֗י יִתֵּ֨ן לָכֶ֤ם רַחֲמִים֙ לִפְנֵ֣י הָאִ֔ישׁ וְשִׁלַּ֥ח לָכֶ֛ם אֶת־אֲחִיכֶ֥ם אַחֵ֖ר וְאֶת־בִּנְיָמִ֑ין וַאֲנִ֕י כַּאֲשֶׁ֥ר שָׁכֹ֖לְתִּי שָׁכָֽלְתִּי׃", "onk": "וְאֵל שַׁדַּי יִתֵּן לְכוֹן רַחֲמִין לָקֳדָם גַּבְרָא וְיִפְטַר לְכוֹן יָת אֲחוּכוֹן אָחֳרָנָא וְיָת בִּנְיָמִין וַאֲנָא כְּמָא דְאִתְכֵּלִית תְּכֵלִית:", "onk_en": "May the Almighty, Shaddai, grant you compassion in the presence of the man, that he may release to you your other brother along with Binyamin. If I have been bereft of my children, I will be bereft.", "pj": "וְאֵל שַׁדַי יִתֵּן לְכוֹן רַחֲמִין קֳדָם גַבְרָא וְיִפְטוֹר לְכוֹן יַת אֲחוּכוֹן חוֹרָנָא וְיַת בִּנְיָמִין וַאֲנָא הָא כְּבַר אִתְבַּשְרִית בְּרוּחַ קוּדְשָׁא אֲרוּם אִין אִיתְכְּלִית עַל יוֹסֵף אִיתְכַּל עַל שִׁמְעוֹן וְעַל בִּנְיָמִין", "pj_en": "and God the Almighty give you mercies before the man, that he may release to you your other brother, and Benjamin: and I, behold, I am now certified by the Holy Spirit that if I am bereaved of Joseph, I shall also be bereaved of Shimeon and of Benjamin.", "tj": "וַאֲנָא הֵיךְ מַה דִי לָא תְּכָלִית עַל יוֹסֵף בְּרִי כֵּן לָא אוֹסִיף לְמִתְכְּלָא לָא עַל שִׁמְעוֹן וְלָא עַל בִּנְיָמִין:", "tj_en": "And I, behold, if I be not bereaved of my son Joseph, so shall I not add to be bereaved of Shimeon and of Benjamin.", "rashi": "<b>ואל שדי.<\/b> מֵעַתָּה אֵינְכֶם חֲסֵרִים כְּלוּם אֶלָּא תְפִלָּה, הֲרֵינִי מִתְפַּלֵּל עֲלֵיכֶם:<br><br><b>אל שדי.<\/b> שֶׁדַּי בִּנְתִינַת רַחֲמָיו וּכְדַי הַיְכֹלֶת בְּיָדוֹ לִתֵּן, יִתֵּן לָכֶם רַחֲמִים, זֶהוּ פְשׁוּטוֹ. וּמִדְרָשׁוֹ מִי שֶׁאָמַר לָעוֹלָם דַּי, יֹאמַר דַּי לְצָרוֹתַי, שֶׁלֹּא שָׁקַטְתִּי מִנְּעוּרַי, צָרַת לָבָן, צָרַת עֵשָׂו, צָרַת רָחֵל, צָרַת דִּינָה, צָרַת יוֹסֵף, צָרַת שִׁמְעוֹן, צָרַת בִּנְיָמִין:<br><br><b>ושלח לכם.<\/b> וְיִפְטַר לְכוֹן כְּתַרְגּוּמוֹ – יִפְטְרֶנּוּ מֵאֱסוּרָיו, לְשׁוֹן לַחָפְשִׁי יְשַׁלְּחֶנּוּ (שמות כ\"א), וְאֵינוֹ נוֹפֵל בַּתַּרְגּוּם לְשׁוֹן וַיִּשְׁלַח, שֶׁהֲרֵי לְשָׁם הֵם הוֹלְכִים אֶצְלוֹ:<br><br><b>את אחיכם.<\/b> זֶה שִׁמְעוֹן:<br><br><b>אחר.<\/b> רוּחַ הַקֹּדֶשׁ נִזְרְקָה בוֹ, לְרַבּוֹת יוֹסֵף (בראשית רבה):<br><br><b>ואני.<\/b> עַד שׁוּבְכֶם אֶהְיֶה שַׁכּוּל מִסָּפֵק:<br><br><b>כאשר שכלתי.<\/b> מִיּוֹסֵף וּמִשִּׁמְעוֹן:<br><br><b>שכלתי.<\/b> מִבִּנְיָמִין:", "rashi_en": "ואל שדי AND GOD ALMIGHTY — Now you lack nothing except prayer, and therefore I pray for you (Genesis Rabbah 91:11).<br><br>אל שדי God שֶׁ-דַּי who gives plenteous mercy and in whose hand is sufficient power to give — may He give you mercy. This is the real meaning of the words. A Midrashic explanation is: He who said to the Universe, “Enough!”, may He say “Enough!” to my troubles. I have had no rest since my youth — trouble through Laban, trouble through Esau, the trouble of Rachel, the trouble of Dinah, the trouble of Joseph, the trouble of Simeon, the trouble of Benjamin (Genesis Rabbah 92:1).<br><br>ושלח לכם means AND MAY HE RELEASE UNTO YOU, as the Targum renders it — may He release him from his bonds. It has the same meaning as (Exodus 21:26) “He shall let him go, יְשַׁלְּחֶנוּ (Piel) free”. It would not have been correct to translate it in the Targum by “and may he send to you your other brother”, because, as a matter of fact, they were going there where he was.<br><br>את אחיכם YOUR BROTHER — This refers to Simeon.<br><br>אחר THE OTHER ONE — The spirit of prophecy was diffused upon him so that he included Joseph also (Genesis Rabbah 92:3).<br><br>ואני AND AS FOR ME — until you return I shall feel myself bereaved of my children being in constant suspense.<br><br>כאשר שכלתי means EVEN AS I AM BEREAVED of Joseph and of Simeon<br><br>שכלתי I SHALL BE BEREAVED of Benjamin."}, {"ch": 43, "v": 15, "aliyah": 5, "heb": "וַיִּקְח֤וּ הָֽאֲנָשִׁים֙ אֶת־הַמִּנְחָ֣ה הַזֹּ֔את וּמִשְׁנֶה־כֶּ֛סֶף לָקְח֥וּ בְיָדָ֖ם וְאֶת־בִּנְיָמִ֑ן וַיָּקֻ֙מוּ֙ וַיֵּרְד֣וּ מִצְרַ֔יִם וַיַּֽעַמְד֖וּ לִפְנֵ֥י יוֹסֵֽף׃", "onk": "וּנְסִיבוּ גֻבְרַיָּא יָת תִּקְרֻבְתָּא הָדָא וְעַל חַד תְּרֵין כַּסְפָּא נְסִיבוּ בִידֵיהוֹן וּדְבָרוּ יָת בִּנְיָמִן וְקָמוּ וּנְחָתוּ לְמִצְרַיִם וְקָמוּ קֳדָם יוֹסֵף:", "onk_en": "The men took that offering, and they took double money in their hands, and [they took] Binyamin. They rose and went down to Egypt, and they stood before Yoseif.", "pj": "וּנְסִיבוּ גוּבְרַיָא יַת דוֹרוֹנָא הָדָא וְעַל חַד תְּרֵין כַּסְפָּא נְסִיבוּ בִּידֵיהוֹן וּדְבָרוּ יַת בִּנְיָמִין וּנְחָתוּ לְמִצְרַיִם וְאִיתְעַתְּדוּ קֳדָם יוֹסֵף", "pj_en": "The men took the present, and the money two for one in their hands, and they took Benjamin, and went down to Mizraim, and stood before Joseph.", "tj": "", "tj_en": "", "rashi": "<b>ואת בנימין.<\/b> מְתַּרְגְּמִינַן וּדְבָרוּ יָת בִּנְיָמִין, לְפִי שֶׁאֵין לְקִיחַת הַכֶּסֶף וּלְקִיחַת הָאָדָם שָׁוָה בְלָשׁוֹן אֲרַמִּי; בְּדָבָר הַנִּקָּח בַּיָּד מְתַרְגְּמִינָן וּנְסִיב, וְדָבָר הַנִּקָּח בְּהַנְהָגַת דְּבָרִים, מְתַרְגְּמִינָן וּדְבַר:", "rashi_en": "ואת בנימין [AND THEY TOOK DOUBLE MONEY] AND BENJAMIN — We render this in the Targum by ודברו ית בנימן “and they led Benjamin away”, because the same expression cannot be used in Aramaic for taking money and for taking a person. In the case of a thing that can be taken in the hand the Targum uses ונסיב “and he carried” for the Hebrew verb לקח, whilst in the case of a person who is taken by persuasion (literally, by leading him with words) the Targum uses ודבר and he led away. "}, {"ch": 43, "v": 16, "aliyah": 6, "heb": "וַיַּ֨רְא יוֹסֵ֣ף אִתָּם֮ אֶת־בִּנְיָמִין֒ וַיֹּ֙אמֶר֙ לַֽאֲשֶׁ֣ר עַל־בֵּית֔וֹ הָבֵ֥א אֶת־הָאֲנָשִׁ֖ים הַבָּ֑יְתָה וּטְבֹ֤חַ טֶ֙בַח֙ וְהָכֵ֔ן כִּ֥י אִתִּ֛י יֹאכְל֥וּ הָאֲנָשִׁ֖ים בַּֽצׇּהֳרָֽיִם׃", "onk": "וַחֲזָא יוֹסֵף עִמְּהוֹן יָת בִּנְיָמִין וַאֲמַר לְדִי מְמַנָּא עַל בֵּיתֵיהּ אָעֵיל יָת גֻּבְרַיָּא לְבֵיתָא וּנְכוֹס נִכְסָתָא וְאַתְקֵין אֲרֵי עִמִּי יֵיכְלוּן גֻּבְרַיָּא <b>בְּשֵׁירוּתָא<\/b>:", "onk_en": "When Yoseif saw Binyamin with them he said to the one in charge of his house, Bring these men to the house. Slaughter an animal and prepare it, for these men shall dine with me at noon [<b>the morning meal<\/b>].", "pj": "וַחֲמָא יוֹסֵף עִמְהוֹן יַת בִּנְיָמִין וַאֲמַר לִמְנַשֶׁה דִמְמַנָא אַפִּיטְרוֹפּוֹס עַל בֵּיתֵיהּ אָעֵיל יַת גוּבְרַיָא לְבֵיתָא וּפְרַע בֵּית נִיכְסְתָא וְסַב גִידָא נַשְׁיָא וְאַתְקַן תַּבְשִׁילָא בְּאַפֵּיהוֹן אֲרוּם עִמִי יֵיכְלוּן גוּבְרַיָא בְּאִישׁוֹן שֵׁירוּתָא דְטִיהֲרָא", "pj_en": "And Joseph saw Benjamin with them: and he said to Menasheh whom he had made superintendent over his house, Bring the men into the house, and unloose the house of slaughter, and take out the sinew that shrank, and prepare meat before them; for the man shall eat with me at the time of the noonjday meal.", "tj": "", "tj_en": "", "rashi": "<b>וטבח טבח והכן.<\/b> כְּמוֹ וְלִטְבֹּחַ טֶבַח וּלְהָכִין, וְאֵין טְבֹחַ לְשׁוֹן צִוּוּי, שֶׁהָיָה לוֹ לוֹמַר וּטְבַח:<br><br><b>בצהרים.<\/b> זֶה מְתֻרְגָּם בְּשֵׁירוּתָא, שֶׁהוּא לְשׁוֹן סְעוּדָה רִאשׁוֹנָה בְלָשׁוֹן אֲרַמִּי וּבְלַעַז דיזנ\"ר, וְיֵשׁ הַרְבֵּה בַּתַּלְמוּד, שָׁדָא לְכַלְבָּא שֵׁירוּתֵהּ; בָּצַע אַכּוּלָּא שֵׁירוּתָא, אֲבָל כָּל תַּרְגּוּם שֶׁל צָהֳרַיִם טִיהֲרָא:", "rashi_en": "וטבח טבח והכן AND SLAUGHTER THE BEASTS AND MAKE READY — The Hebrew is the same as ולטבח טבח ולהכין (infinitives) “and to slaughter… and to prepare”. The word וּטְבֹחַ is not an imperative, for this should be וּטְבַח (as from שָׁלַח the imperative is שְׁלַח). <br><br>בצהרים AT NOON — This word is rendered in the Targum by בשירותא which in Aramaic denotes the first meal during the day ; in old French disner. It occurs frequently in the Talmud: (Taanit 11a, lib) “He threw the dog שירותיה his meal; (Berakhot 39b) “he cut bread for the whole of שירותא his meal.” But wherever צהרים means noon it is translated in the Targum by טיהרא."}, {"ch": 43, "v": 17, "aliyah": 6, "heb": "וַיַּ֣עַשׂ הָאִ֔ישׁ כַּֽאֲשֶׁ֖ר אָמַ֣ר יוֹסֵ֑ף וַיָּבֵ֥א הָאִ֛ישׁ אֶת־הָאֲנָשִׁ֖ים בֵּ֥יתָה יוֹסֵֽף׃", "onk": "וַעֲבַד גַּבְרָא כְּמָא דִּי אֲמַר יוֹסֵף וְאָעֵיל גַּבְרָא יָת גֻּבְרַיָּא לְבֵית יוֹסֵף:", "onk_en": "The man did as Yoseif said, and the man brought the men to the house of Yoseif.", "pj": "וְעָבַד גַבְרָא הֵיכְמָא דְאָמַר יוֹסֵף וְאָעֵיל גַבְרָא יַת גוּבְרַיָא לְבֵית יוֹסֵף", "pj_en": "And the man did as Joseph had said, and the man brought the men into Joseph's house.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 18, "aliyah": 6, "heb": "וַיִּֽירְא֣וּ הָֽאֲנָשִׁ֗ים כִּ֣י הֽוּבְאוּ֮ בֵּ֣ית יוֹסֵף֒ וַיֹּאמְר֗וּ עַל־דְּבַ֤ר הַכֶּ֙סֶף֙ הַשָּׁ֤ב בְּאַמְתְּחֹתֵ֙ינוּ֙ בַּתְּחִלָּ֔ה אֲנַ֖חְנוּ מֽוּבָאִ֑ים לְהִתְגֹּלֵ֤ל עָלֵ֙ינוּ֙ וּלְהִתְנַפֵּ֣ל עָלֵ֔ינוּ וְלָקַ֧חַת אֹתָ֛נוּ לַעֲבָדִ֖ים וְאֶת־חֲמֹרֵֽינוּ׃", "onk": "וּדְחִילוּ גֻבְרַיָּא אֲרֵי אִתַּעֲלוּ לְבֵית יוֹסֵף וַאֲמָרוּ עַל עֵסַק כַּסְפָּא דְּאִתּוֹתַב בְּטוֹעֲנָנָא בְּקַדְמֵיתָא אֲנַחְנָא מִתַּעֲלִין <b>לְאִתְרַבְרָבָא עֲלָנָא<\/b> וּ<b>לְאִסְתַּקָּפָא<\/b> עֲלָנָא וּ<b>לְמִקְנֵי<\/b> יָתָנָא לְעַבְדִּין <b>וּלְמִדְבַּר<\/b> יָת חֲמָרָנָא:", "onk_en": "The men were afraid because they had been brought to Yoseif’s house, and they said, Because of the money that was returned in our bags previously are we being brought [here]; that he may turn on [<b>act as a lord over<\/b>] us and come down on [<b>libel<\/b>] us, and take [<b>acquire<\/b>] us for slaves along with [<b>and take<\/b>] our donkeys.", "pj": "וּדְחִילוּ גוּבְרַיָא אֲרוּם אִיתְעֲלוּ לְבֵית יוֹסֵף וַאֲמָרוּ עַל עֵיסַק כַּסְפָּא דְתַב לְטוֹנָנָא בְּקַדְמֵיתָא אֲנַן מִתְעֲלִין לְמִתְעַקְפָא עֲלָן וּלְמִדְיָינָא עֲלָן וּלְמִקְנֵי יָתָן לְעַבְדִין וּלְמֵיסַב יַת חַמְרָנָא", "pj_en": "The men feared when they were brought into Joseph's house, and said, For the money that was returned in our sacks at the first are we brought in, that be may find occasion against us and condemn us, and sell us for slaves, and take our asses.", "tj": "", "tj_en": "", "rashi": "<b>וייראו האנשים.<\/b> כָּתוּב הוּא בִּשְׁנֵי יוֹדִ\"ין, וְתַרְגּוּמוֹ וּדְחִילוּ:<br><br><b>כי הובאו בית יוסף.<\/b> וְאֵין דֶּרֶךְ שְׁאָר הַבָּאִים לִשְׁבֹּר בָּר לָלוּן בְּבֵית יוֹסֵף, כִּי אִם בְּפֻנְדְּקָאוֹת שֶׁבָּעִיר: <b>וייראו.<\/b> שֶׁאֵין זֶה אֶלָּא לְאָסְפָם אֶל מִשְׁמָר:<br><br><b>אנחנו מובאים.<\/b> אֶל תּוֹךְ הַבַּיִת הַזֶּה:<br><br><b>להתגלל.<\/b> לִהְיוֹת מִתְגַּלְגֶּלֶת עָלֵינוּ עֲלִילַת הַכֶּסֶף וְלִהְיוֹתָהּ נוֹפֶלֶת עָלֵינוּ; וְאֻנְקְלוֹס שֶׁתִּרְגֵּם וּלְאִסְתַּקָּפָא עֲלָנָא הוּא לְשׁוֹן לְהִתְעוֹלֵל, כְּדִמְתַרְגְּמִינָן עֲלִילַת דְּבָרִים – תַּסְקוּפֵי מִלִּין, וְלֹא תִרְגְּמוֹ אַחַר לְשׁוֹן הַמִּקְרָא וּלְהִתְגּוֹלֵל שֶׁתִּרְגֵּם לְאִתְרַבְרָבָא, הוּא לְשוֹן גֻּלַּת הַזָּהָב (קהלת י\"ב), וְהֻצַּב גֻּלְּתָה הֹעֲלָתָה (נחום ב'), שֶׁהוּא לְשׁוֹן מַלְכוּת:", "rashi_en": "וייראו האנשים  AND THE MEN WERE AFRAID — The word ויראו is written with two yods and its translation in the Targum is ודחילו and they were afraid.<br><br>כי הובאו בית יוסף BECAUSE THEY WERE BROUGHT INTO JOSEPH S HOUSE, and it was not usual for other people who came to buy corn to stay overnight in Joseph’s house but in the inns of the city. וייראו AND THEY WERE AFRAID, because this could be only for the purpose of putting them in prison.<br><br>אנחנו מובאים WE HAVE BEEN BROUGHT inside this house.<br><br>להתגלל means THAT THERE MAY BE ROLLED UPON US an accusation regarding the money AND THAT THIS MAY FALL UPON US. And according to Onkelos who rendered ולהתנפל עלינו by ולאסתקפא עלנא, it signifies seeking an occasion — just as we render in the Targum the words (Deuteronomy 12:17) עלילת דברים, which mean a pretext, by תסקופי מלין “intrigues” — but he did not translate it literally. The word ולהתגלל which he translated by לאתרברבא “to play the lord over us” he takes as connected in meaning with (Ecclesiastes 12:6) “the bowl of (גלת) gold”, and (Nahum 2:8) “And Huzzab the queen (גלתה) is carried away”, where these words from the root גלל denote symbolically royal rank."}, {"ch": 43, "v": 19, "aliyah": 6, "heb": "וַֽיִּגְּשׁוּ֙ אֶל־הָאִ֔ישׁ אֲשֶׁ֖ר עַל־בֵּ֣ית יוֹסֵ֑ף וַיְדַבְּר֥וּ אֵלָ֖יו פֶּ֥תַח הַבָּֽיִת׃", "onk": "וּקְרִיבוּ לְוַת גַּבְרָא דִּי מְמַנָּא עַל בֵּית יוֹסֵף וּמַלִּילוּ עִמֵּיהּ בִּתְרַע בֵּיתָא:", "onk_en": "They approached the man, who was in charge of Yoseif’s house, and they spoke to him at the entrance to the house.", "pj": "וּקְרִיבוּ לְוַת גַבְרָא דִי מְמַנָא אַפִּיטְרוֹפּוֹס עַל בֵּית יוֹסֵף וּמַלִילוּ עִמֵיהּ בִּתְרַע בֵּיתֵיהּ", "pj_en": "And they drew near the man who had been appointed intendant over Joseph's house, and spake with him at the gate of the house.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 43, "v": 20, "aliyah": 6, "heb": "וַיֹּאמְר֖וּ בִּ֣י אֲדֹנִ֑י יָרֹ֥ד יָרַ֛דְנוּ בַּתְּחִלָּ֖ה לִשְׁבׇּר־אֹֽכֶל׃", "onk": "וַאֲמָרוּ בְּבָעוּ רִבּוֹנִי מֵיחַת נְחֵתְנָא בְּקַדְמֵיתָא לְמִזְבַּן <b>עִיבוּרָא<\/b>:", "onk_en": "They said, Please, my master, we came down the first time to buy food [<b>grain<\/b>].", "pj": "וַאֲמָרוּ בְּמָטוּ מִינָךְ רִבּוֹנִי מִיחַת נְחִיתְנָא בְּקַדְמֵיתָא לְמִזְבַּן עִיבּוּרָא", "pj_en": "And they said, We entreat you, my lord: we indeed came down at first to buy corn.", "tj": "", "tj_en": "", "rashi": "<b>בי אדני.<\/b> לְשׁוֹן בַּעְיָא וְתַחֲנוּנִים הוּא, בְלָשׁוֹן אֲרַמִּי בַּיָּ
