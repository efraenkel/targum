הִי וְקַבֵּל <b>לְמֵימְרֵהּ<\/b> לָא תְסָרֵב לְקִבְלֵהּ אֲרֵי לָא יִשְׁבּוֹק לְחוֹבֵיכוֹן אֲרֵי <b>בִ<\/b>שְׁמִי <b>מֵימְרֵהּ<\/b>:", "onk_en": "Be careful in his presence and heed [obey] his voice [<b>word<\/b>]. Do not rebel against him; for he cannot bear [pardon] your transgression, as [<b>in<\/b>] My Name is in him [<b>his word<\/b>].", "pj": "אִיזְדַהַר מִן קֳדָמוֹי וְקַבֵּיל לְמֵימְרֵיהּ לָא תְסָרֵיב עַל מִילוֹי אֲרוּם לָא יִשְׁבּוֹק לְחוֹבֵיכוֹן אֲרוּם בִּשְׁמִי מֵימְרֵיהּ", "pj_en": "Be circumspect before Him, and obey His word, and be not rebellious against His words; for He will not forgive your sins, because His word is in My Name.", "tj": "", "tj_en": "", "rashi": "<b>אל תמר בו.<\/b> לְשׁוֹן הַמְרָאָה, כְּמוֹ אֲשֶׁר יַמְרֶה אֶת פִּיךָ (יהושע א'):<br><br><b>כי לא ישא לפשעכם.<\/b> אֵינוֹ מְלֻמָּד בְּכָךְ, שֶׁהוּא מִן הַכַּת שֶׁאֵין חוֹטְאִין, וְעוֹד שֶׁהוּא שָׁלִיחַ וְאֵינוֹ עוֹשֶׂה אֶלָּא שְׁלִיחוּתוֹ:<br><br><b>כי שמי בקרבו.<\/b> מְחֻבָּר לְרֹאשׁ הַמִּקְרָא – <b>השמר מפניו כי שמי<\/b> מְשֻׁתָּף בּוֹ. וְרַבּוֹתֵינוּ אָמְרוּ זֶה מְטַטְרוֹן שֶׁשְּׁמוֹ כְשֵׁם רַבּוֹ, מְטַטְרוֹן בְּגִימַטְרִיָּא שַׁדַּי (סנהדרין ל\"ח):", "rashi_en": "אל תמר בו EXASPERATE HIM NOT — This verb is a term denoting rebellion (המראה), similar to, (Joshua 1:18) “Whosoever he be that rebel (ימרה) against thy commandment”.<br><br>כי לא ישא לפשעכם FOR HE WILL NOT PARDON YOUR TRESPASS — He is not accustomed to it (to sin) for he is one of a class of beings who never sin. Besides he is only a messenger and only carries out the mission entrusted to him (i. e. he has no right to pardon you, for this is My prerogative: it is his only to insist upon obedience to My commands) (Midrash Tanchuma, Mishpatim 18).<br><br>כי שמי בקרבו FOR MY NAME IS IN HIM — This passage must be connected with the beginning of the verse: Take heed of him etc. — for (כי) My Name is associated with his (i. e. whatever he does, he does in My Name). Our Rabbis said that he (the angel) is Mattatron (מטטרון) whose name is even as the name of his Master, for מטטרון has the numerical value of שדי “the Almighty” (Sanhedrin 38b)."}, {"ch": 23, "v": 22, "aliyah": 6, "heb": "כִּ֣י אִם־שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּקֹל֔וֹ וְעָשִׂ֕יתָ כֹּ֖ל אֲשֶׁ֣ר אֲדַבֵּ֑ר וְאָֽיַבְתִּי֙ אֶת־אֹ֣יְבֶ֔יךָ וְצַרְתִּ֖י אֶת־צֹרְרֶֽיךָ׃", "onk": "אֲרֵי אִם קַבָּלָא תְקַבֵּל לְמֵימְרֵהּ וְתַעְבֵּד כֹּל דֶאֱמַלֵל וְאֶסְנֵי יָת סָנְאָךְ וְאָעִיק לְדִמְעִיקִין לָךְ:", "onk_en": "But if you truly listen to [obey] his voice [<b>word<\/b>], and do all that I speak, then I will be an enemy to your enemies, and attack those who attack you.", "pj": "אֲרוּם אִין קַבָּלָא תְקַבֵּיל לְמֵימְרֵיהּ וְתַעֲבֵיד כָּל דַּאֲמַלֵּיל עַל יְדוֹי וְאַסְגֵי יַת סַנְאָךְ וְאָעִיק לְמֵיעִיקְיָךְ", "pj_en": "For if thou wilt indeed hearken to His Word, and do all that I speak by Him, I will be the enemy of thy enemy, and will trouble them who trouble thee.", "tj": "", "tj_en": "", "rashi": "<b>וצרתי.<\/b> כְּתַרְגּוּמוֹ וְאָעִיק:", "rashi_en": "וצרתי — render this as the Targum does: I will distress."}, {"ch": 23, "v": 23, "aliyah": 6, "heb": "כִּֽי־יֵלֵ֣ךְ מַלְאָכִי֮ לְפָנֶ֒יךָ֒ וֶהֱבִֽיאֲךָ֗ אֶל־הָֽאֱמֹרִי֙ וְהַ֣חִתִּ֔י וְהַפְּרִזִּי֙ וְהַֽכְּנַעֲנִ֔י הַחִוִּ֖י וְהַיְבוּסִ֑י וְהִכְחַדְתִּֽיו׃", "onk": "אֲרֵי יְהַךְ מַלְאָכִי קֳדָמָךְ וְיָעֵלִנָךְ לְוָת אֱמוֹרָאֵי וְחִתָּאֵי וּפְרִיזָאֵי וּכְנַעֲנָאֵי חִוָאֵי וִיבוּסָאֵי וֶאֱשֵׁצִנוּן:", "onk_en": "My messenger will go before you, and will bring you into [the land of] the Emorites, the Chittites, the Perizzites, the Canaanites, Chivites, and the Yevusites, and I will then annihilate them.", "pj": "אֲרוּם יְטַיֵיל מַלְאָכִי קֳדָמָךְ וְיֵעָלִינָךְ לְוַת אֱמוֹרָאֵי וְחִיתָּאֵי וּפְרִיזָאֵי וּכְנַעֲנָאֵי חִיוָאֵי וִיבוּסָאֵי וְאֵישֵׁיצִינוּן", "pj_en": "For My Angel shall go before thee, and bring thee to the Amoraee, and Pherizaee, and Kenaanaee, Hivaee, and Jebusaee; and I will destroy them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 24, "aliyah": 6, "heb": "לֹֽא־תִשְׁתַּחֲוֶ֤ה לֵאלֹֽהֵיהֶם֙ וְלֹ֣א תׇֽעׇבְדֵ֔ם וְלֹ֥א תַעֲשֶׂ֖ה כְּמַֽעֲשֵׂיהֶ֑ם כִּ֤י הָרֵס֙ תְּהָ֣רְסֵ֔ם וְשַׁבֵּ֥ר תְּשַׁבֵּ֖ר מַצֵּבֹתֵיהֶֽם׃", "onk": "לָא תִסְגוּד <b>לְטַעֲוָתְהוֹן<\/b> וְלָא תִפְלְחִנוּן וְלָא תַעְבֵּד כְּעוֹבָדֵיהוֹן אֲרֵי פַגָרָא תְּפַגְרִנוּן וְתַבָּרָא תְתַבַּר קָמָתְהוֹן:", "onk_en": "You must not prostrate yourself to their [<b>false<\/b>] gods, nor serve [sacrifice to] them. You must not adopt their customs. You must totally destroy [their idols] and completely break down their monuments.", "pj": "לָא תִסְגְּדוּן לְטַעֲוַותְהוֹן וְלָא תִפְלְחִינוּן וְלָא תַעַבְדוּן כְּעוֹבְדֵיהוֹן בִּישַׁיָּיא אֲרוּם מְפַכְרָא תִּפְכַר בֵּית סְגוּדְהוֹן וְתִבְרָא תְּתַבֵּר קָמְתֵי צִילְמֵיהוֹן", "pj_en": "Thou shalt not worship their idols, nor serve them, nor do after their evil works; but thou shalt utterly demolish the house of their worship, and break the statues of their images.", "tj": "", "tj_en": "", "rashi": "<b>הרס תהרסם.<\/b> לְאוֹתָם אֱלוֹהוּת:<br><br><b>מצבתיהם.<\/b> אֲבָנִים שֶׁהֵם מַצִּיבִין לְהִשְׁתַּחֲווֹת לָהֶם:", "rashi_en": "הרס תהרסם [BUT] THOU SHALT UTTERLY OVERTHROW THEM — those gods.<br><br>מצבתיהם THEIR MONUMENTS — stones which they set up (root נצב) before which to prostrate themselves."}, {"ch": 23, "v": 25, "aliyah": 6, "heb": "וַעֲבַדְתֶּ֗ם אֵ֚ת יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם וּבֵרַ֥ךְ אֶֽת־לַחְמְךָ֖ וְאֶת־מֵימֶ֑יךָ וַהֲסִרֹתִ֥י מַחֲלָ֖ה מִקִּרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִפְלְחוּן <b>קֳדָם<\/b> יְיָ אֱלָהֲכוֹן וִיבָרֵךְ יָת <b>מֵיכְלָךְ<\/b> וְיָת <b>מִשְׁתְּיָךְ<\/b> וְאַעְדִי מַרְעִין <b>בִּישִׁין<\/b> מִבֵּינָךְ:", "onk_en": "You must serve [<b>before<\/b>] Adonoy, your God, and He will bless your bread [<b>food<\/b>] and your water [<b>drink<\/b>]. I will eliminate [<b>bad<\/b>] sickness from your midst.", "pj": "וְתִפְלְחוּן קֳדָם יְיָ אֱלָהָכוֹן וִיבָרֵךְ יַת מְזוֹנֵי מֵיכְלָךְ וּמִשְׁתַּיָּיךְ וְאַעֲדֵי מְחַת מָרִירְתָּא מִגַּוָּוךְ", "pj_en": "And you shall do service before the Lord our God and He will bless the provision of thy food and thy drinks, and remove the bitter plague from among thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 26, "aliyah": 7, "heb": "לֹ֥א תִהְיֶ֛ה מְשַׁכֵּלָ֥ה וַעֲקָרָ֖ה בְּאַרְצֶ֑ךָ אֶת־מִסְפַּ֥ר יָמֶ֖יךָ אֲמַלֵּֽא׃", "onk": "לָא תְהֵי מְתַכְּלָא וְעַקְרָא בְּאַרְעָךְ יָת מִנְיַן יוֹמָיךְ אַשְׁלִים:", "onk_en": "No woman will suffer miscarriage or remain childless in your land. I will cause the number of your days to be full.", "pj": "לָא תְהֵי תַּכְלָא וְעַקְרָא בְּאַרְעָךְ יַת מִנְיַין יוֹמֵי חַיָּיךְ אֲשַׁלֵּם מִיּוֹמָא לְיוֹמָא", "pj_en": "None shall be abortive or barren in thy land; the number of the days of thy life I will fulfil from day to day.", "tj": "", "tj_en": "", "rashi": "<b>לא תהיה משכלה.<\/b> אִם תַּעֲשֶׂה רְצוֹנִי:<br><br><b>משכלה.<\/b> מַפֶּלֶת נְפָלִים אוֹ קוֹבֶרֶת אֶת בָּנֶיהָ קְרוּיָה מְשַׁכֵּלָה:", "rashi_en": "לא תהיה משכלה THERE SHALL NOTHING BE BEREAVED OF YOUNG, if you will act according to My will.<br><br>משכלה BEREAVED OF YOUNG — A woman who miscarries or who buries her children at a very early age is called משכלה."}, {"ch": 23, "v": 27, "aliyah": 7, "heb": "אֶת־אֵֽימָתִי֙ אֲשַׁלַּ֣ח לְפָנֶ֔יךָ וְהַמֹּתִי֙ אֶת־כׇּל־הָעָ֔ם אֲשֶׁ֥ר תָּבֹ֖א בָּהֶ֑ם וְנָתַתִּ֧י אֶת־כׇּל־אֹיְבֶ֛יךָ אֵלֶ֖יךָ עֹֽרֶף׃", "onk": "יָת אֵימְתִי אֲשַׁלַח קֳדָמָךְ וְאִיתְבַּר (נ\"א וֶאֱשַׁגֵשׁ) יָת כָּל עַמָא דְאַתְּ אָתֵי <b>לַאֲגָחָא בְּהוֹן<\/b> וְאֶמְסַר יָת כָּל בַּעֲלֵי דְבָבָךְ <b>קֳדָמָךְ<\/b> מְחַזְרֵי קְדָל:", "onk_en": "I will send My dread ahead of you, and I will bring panic to all the people among whom you will come [<b>to fight against<\/b>]. I will make all your enemies turn their backs to [<b>before<\/b>] you.", "pj": "יַת אֵימְתִי אֲשַׁדֵּר קֳדָמָךְ וָאֶשְׁגַשׁ יַת כָּל עַמְמַיָא דְאַנְתְּ אָתֵי לְסַדְרָא בְּהוֹן סִדְרֵי קְרָבָא וְאִיתֵּין יַת כָּל בַּעֲלֵי דְבָבָךְ קֳדָמָךְ מְחַזְרֵי קְדָל", "pj_en": "My terror will I send before thee, and will perturb all the peoples to whom thou comest, that thou mayest wage battle against them; and I will make all thy enemies turn back before thee.", "tj": "", "tj_en": "", "rashi": "<b>והמתי.<\/b> כְּמוֹ וְהָמַמְתִּי, וְתַרְגּוּמוֹ וֶאֱשַׁגֵּשׁ. וְכֵן כָּל תֵּבָה שֶׁפֹּעַל שֶׁלָּהּ בְּכֶפֶל אוֹת אַחֲרוֹנָה, כְּשֶׁתֵּהָפֵךְ לְדַבֵּר בִּלְשׁוֹן פָּעַלְתִּי, יֵשׁ מְקוֹמוֹת שֶׁנּוֹטֵל אוֹת הַכְּפוּלָה וּמַדְגִּישׁ אֶת הָאוֹת וְנוֹקְדוֹ בִּמְלָאפוּם כְּגוֹן וְהַמֹּתִי מִגִּזְרַת וְהָמַם גִּלְגַּל עֶגְלָתוֹ (ישעיהו כ\"ח), וְסַבּוֹתִי (קהלת ב'), מִגִּזְרַת וְסָבַב בֵּית אֵל (שמואל א ז׳:ט״ז), דַּלֹּתִי (תהילים קט\"ז), מִגִּזְרַת דָּלְלוּ וְחָרְבוּ (ישעיהו י\"ט), עַל כַּפַּיִם חַקֹּתִיךְ (ישעיהו מ״ט:ט״ז), מִגִּזְרַת חִקְקֵי לֵב (שופטים ה'), אֶת מִי רַצּוֹתִי (שמואל א י״ב:ג׳), מִגִּזְרַת רִצַּץ עָזַב דַּלִּים (איוב כ'). וְהַמְתַרְגֵּם וְהַמֹּתִי וְאֶקְטַל, טוֹעֶה הוּא, שֶׁאִלּוּ מִגִּזְרַת מִיתָה הָיָה, אֵין הֵ\"א שֶׁלָּהּ בְּפַתָּח וְלֹא מֵ\"ם שֶׁלָּהּ מֻדְגֶּשֶׁת וְלֹא נְקוּדָה מְלָאפוּם, אֶלָּא וְהֵמַתִּי כְּגוֹן וְהֵמַתָּה אֶת הָעָם הַזֶּה (במדבר י״ד:ט״ו), וְהַתָּי\"ו מֻדְגֶּשֶׁת לְפִי שֶׁתָּבֹא בִּמְקוֹם שְׁתֵּי תָוִי\"ן, הָאַחַת נִשְׁרֶשֶׁת – לְפִי שֶׁאֵין מִיתָה בְּלֹא תָי\"ו – וְהָאַחֶרֶת מְשַׁמֶּשֶׁת, כְּמוֹ אָמַרְתִּי, חָטָאתִי, עָשִׂיתִי, וְכֵן וְנָתַתִּי הַתָּי\"ו מֻדְגֶּשֶׁת, שֶׁהִיא בָאָה בִּמְקוֹם שְׁתַּיִם, לְפִי שֶׁהָיָה צָרִיךְ שָׁלֹשׁ תָּוִי\"ן – שְׁתַּיִם לִיסוֹד, כְּמוֹ בְּיוֹם תֵּת ה' (יהושע י'), מַתַּת אֱלֹהִים הִיא (קהלת ג'), וְהַשְּׁלִישִׁית לְשִׁמּוּשׁ:<br><br><b>ערף.<\/b> שֶׁיָּנוּסוּ מִפָּנֶיךָ וְיַהַפְכוּ לְךָ עָרְפָּם:", "rashi_en": "והמתי I WILL CONFOUND — This is equivalent to וְהָמַמְתִּי (i. e. the root is המם). Its rendering in the Targum is ואשנש “and I will confound”. Similar is every verb the root of which has its last letter doubled (verbs ע\"ע): when it is changed (conjugated) to express the idea of “I have done something” (i. e. the first person singular perfect of the Kal; the same really applies to some inflected forms of other conjugations also) there are occasions when one omits the doubled letter (it is actually the first of the two similar letters) and dageshes the remaining letter of these two and vowels it with מלאפום (our חולם). Examples are: וְהַמֹּתִי which is of the same derivation as, (Isaiah 28:28) “and the wheel of his cart makes a confused noise (המם)”; (Ecclesiastes 2:20) וְסַבֹּתִי, “and I turned about” which is of the same derivation as, (I Samuel 7:16) “and he went round (וסבב) to Bethel”; (Psalms 116:6) דַלֹּתִי “I was low”, of the same derivation as, (Isaiah 19:6) “The waters shall become low (דללו) and dried up”; (Isaiah 49:16) “I have graven thee (חַקֹּתִיךְ) upon the palms of my hand”, of the same derivation as, (Judges 5:15) “things engraved (חקקי) in the heart”; (I Samuel 12:3) את מי רַצֹּתִי “whom have I crushed”, of the same derivation as, (Job 20:19) “because he hath crushed (רצץ) and hath forsaken the poor”. He, however, who translates it in the Targum by וְאֶקְטַל , is in error. For if it were derived from the root denoting death (מות), the ה in it would not be vowelled with Patach and its מ would not be dageshed nor vowelled with חולם, but it would read וְהַמַתִּי, as, (Numbers 14:15) “Now if Thou shalt kill (וְהַמַתָּ) this people”, the ת being dageshed because it would come in place of two ת’s, one being a root-letter — for no form of מות can be written without at least one ת (that in the root) — and the other being a servile letter (part of the suffix), just as תִּי in אמר-תי and חמא-תי and עשי-תי. Similarly with נתתי: the second ת is dageshed because it comes in the place of two ת’s — since it (the word) really requires three ת’s, two for the root, as in, (Joshua 10:12) “the day when the Lord giveth (תת)”, and in, (Ecclesiastes 3:13) “it is the gift (מתת) of God”, — and the third as a servile letter.<br><br>ערף NAPE OF THE NECK — i. e. they will flee before you and so turn the napes of their necks to you."}, {"ch": 23, "v": 28, "aliyah": 7, "heb": "וְשָׁלַחְתִּ֥י אֶת־הַצִּרְעָ֖ה לְפָנֶ֑יךָ וְגֵרְשָׁ֗ה אֶת־הַחִוִּ֧י אֶת־הַֽכְּנַעֲנִ֛י וְאֶת־הַחִתִּ֖י מִלְּפָנֶֽיךָ׃", "onk": "וְאֶשְׁלַח יָת עֲרָעִיתָא קֳדָמָךְ וּתְתָרֵךְ יָת חִוָאֵי יָת כְּנַעֲנָאֵי וְיָת חִתָּאֵי מִן קֳדָמָךְ:", "onk_en": "I will send [deadly] hornets ahead of you, and they will drive out the Chivites, the Canaanites, and the Chittites from before you.", "pj": "וְאֵשַׁדַּר יַת אוּרְעִיתָא קֳדָמָךְ וּתְתָרֵךְ יַת חִיוָאֵי וְיַת כְּנַעֲנָאֵי וְיַת חִיתָּאֵי מִן קֳדָמָךְ", "pj_en": "And I will send the hornet before thee to drive out the Hivaee, and Kenaanaee, and Hitaee, from before thee.", "tj": "", "tj_en": "", "rashi": "<b>הצרעה.<\/b> מִין שֶׁרֶץ הָעוֹף, וְהָיְתָה מַכָּה אוֹתָם בְּעֵינֵיהֶם וּמַטִּילָה בָהֶם אֶרֶס וְהֵם מֵתִים. וְהַצִּרְעָה לֹא עָבְרָה אֶת הַיַּרְדֵּן, וְהַחִתִּי וְהַכְּנַעֲנִי הֵם אֶרֶץ סִיחוֹן וְעוֹג, לְפִיכָךְ מִכָּל שֶׁבַע אֻמּוֹת לֹא מָנָה כָאן אֶלָּא אֵלּוּ, וְחִוִּי אַעַ\"פִּ שֶׁהוּא מֵעֵבֶר הַיַּרְדֵּן וָהָלְאָה, שָׁנוּ רַבּוֹתֵינוּ בְמַסֶּכֶת סוֹטָה (דף ל\"ו), עַל שְׂפַת הַיַּרְדֵּן עָמְדָה וְזָרְקָה בָהֶם מָרָה:", "rashi_en": "הצרעה THE HORNETS — This is a kind of insect which wounded their eyes and injected poison in them, so that they died. The hornets did not cross the Jordan and the Hittite and the Canaanite whom Scripture mentions here as being driven out by them were the inhabitants of the land of Sichon and Og (on the east side of the Jordan). It is for this reason that Scripture enumerates here of all the seven nations that Israel fought against when entering Palestine only these two (cf. Joshua 24:12, where the text expressly states that the peoples driven out by the hornets were those of שני מלכי האמרי, “of the two kings of the Amorites” who are identical with Sihon and Og). But the Hivites lived on the other bank of the Jordan and somewhat beyond it and yet it states here that the hornets would drive them out! They were indeed driven out by the hornets, for our Rabbis have explained in Treatise Sotah 36a that the hornets placed themselves on the east bank of the Jordan and from there cast the poison against them."}, {"ch": 23, "v": 29, "aliyah": 7, "heb": "לֹ֧א אֲגָרְשֶׁ֛נּוּ מִפָּנֶ֖יךָ בְּשָׁנָ֣ה אֶחָ֑ת פֶּן־תִּהְיֶ֤ה הָאָ֙רֶץ֙ שְׁמָמָ֔ה וְרַבָּ֥ה עָלֶ֖יךָ חַיַּ֥ת הַשָּׂדֶֽה׃", "onk": "לָא אֱתָרֵכִנוּן מִן קֳדָמָךְ בְּשַׁתָּא חֲדָא דִילְמָא תְהֵי אַרְעָא צַדְיָא וְתִסְגֵי עֲלָךְ חֵיוַת בָּרָא:", "onk_en": "I will not drive them out in a single year, lest the land become desolate, and the beasts of the field multiply against you.", "pj": "לָא אֵיתָרֵיכִינוּן מִן קֳדָמָךְ בְּשַׁתָּא חֲדָא דִלְמָא תְהֵי אַרְעָא צַדְיָא וְיִסְגוּן עֲלָךְ חֵיוַת בָּרָא כַּד יֵיתוּן לְמֵיכוּל פִּיגְרֵיהוֹן וְיִנְזְקוּן בָּךְ", "pj_en": "I will not expel them before thee in one year, lest the land become a wilderness, and the beasts of the field multiply upon thee, when they come to eat their carcasses, and injure thee.", "tj": "", "tj_en": "", "rashi": "<b>שממה.<\/b> רֵקָנִית מִבְּנֵי אָדָם, לְפִי שֶׁאַתֶּם מְעַט וְאֵין בָּכֶם כְּדֵי לְמַלֹּאות אוֹתָהּ:<br><br><b>ורבה עליך.<\/b> וְתִרְבֶּה עָלֶיךָ:", "rashi_en": "שממה DESOLATE — empty of human beings, for you are but few and not sufficient to fill it all up.<br><br>ורבה עליך means, [LEST THE ANIMALS OF THE FIELD] MULTIPLY AGAINST THEE."}, {"ch": 23, "v": 30, "aliyah": 7, "heb": "מְעַ֥ט מְעַ֛ט אֲגָרְשֶׁ֖נּוּ מִפָּנֶ֑יךָ עַ֚ד אֲשֶׁ֣ר תִּפְרֶ֔ה וְנָחַלְתָּ֖ אֶת־הָאָֽרֶץ׃", "onk": "זְעֵיר זְעֵיר אֱתָרֵכִנוּן מִן קֳדָמָךְ עַד דְתִסְגֵי וְתַחְסֵן יָת אַרְעָא:", "onk_en": "Little by little I will drive them from before you, until you have increased and occupy the land.", "pj": "קָלִיל קָלִיל אֵיתָרְכִינוּן מִן קֳדָמָךְ עַד דִּי תִסְגֵי וְתֶחֱסִין יַת אַרְעָא", "pj_en": "By little and little I will drive them out before thee, until thou art increased, and inherit the land.", "tj": "", "tj_en": "", "rashi": "<b>עד אשר תפרה.<\/b> תִּרְבֶּה, לְשׁוֹן פְּרִי, כְּמוֹ פְּרוּ וּרְבוּ (בראשית א'):", "rashi_en": "עד אשר תפרה UNTIL THOU BE FRUITFUL — i. e. until you become many. תפרה is of the same root and meaning as no fruit, as, (Genesis 1:28) פרו ורבו “be fruitful and multiply”."}, {"ch": 23, "v": 31, "aliyah": 7, "heb": "וְשַׁתִּ֣י אֶת־גְּבֻלְךָ֗ מִיַּם־סוּף֙ וְעַד־יָ֣ם פְּלִשְׁתִּ֔ים וּמִמִּדְבָּ֖ר עַד־הַנָּהָ֑ר כִּ֣י&thinsp;<b>׀<\/b> אֶתֵּ֣ן בְּיֶדְכֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָאָ֔רֶץ וְגֵרַשְׁתָּ֖מוֹ מִפָּנֶֽיךָ׃", "onk": "וֶאֱשַׁוֵי יָת תְּחוּמָךְ מִיַמָא דְסוּף וְעַד יַמָא דִפְלִשְׁתָּאֵי וּמִמַדְבְּרָא עַד פְּרָת אֲרֵי אֶמְסַר בִּידֵיכוֹן יָת יָתְבֵי אַרְעָא וּתְתָרֵכִנוּן מִן קֳדָמָךְ:", "onk_en": "I will set your borders from the Reed Sea to the Philistine Sea, and from the desert to the [Euphrates] river, for I will deliver into your hands all the inhabitants of the land, and you will drive them away before you.", "pj": "וַאֲשַׁוֵי יַת תְּחוּמָךְ מִן יַמָא דְסוּף עַד יַמָא דִפְלִשְׁתָּאֵי וּמִן מַדְבְּרָא וְעַד פְּרָת אֲרוּם אֶמְסוֹר בְּיֶדְכוֹן יַת כָּל יַתְבֵי אַרְעָא וְאַנְתְּ תְּתָרֵיכִינוּן מִן קֳדָמָךְ", "pj_en": "And I will set thy boundary from the sea of Suph, to the sea of the Philistaee, and from the desert unto the Pherat; for I will deliver into your hand all the inhabitants of the land, and thou shalt drive them out from before thee.", "tj": "", "tj_en": "", "rashi": "<b>ושתי.<\/b> לְשׁוֹן הֲשָׁתָה, וְהַתָּי\"ו מֻדְגֶּשֶׁת מִפְּנֵי שֶׁבָּאָה תַּחַת שְׁתַּיִם, שֶׁאֵין שִׁיתָה בְּלֹא תָי\"ו, וְהָאַחַת לְשִׁמּוּשׁ:<br><br><b>עד הנהר.<\/b> פְּרָת:<br><br><b>וגרשתמו.<\/b> וּתְגָרְשֵׁם:", "rashi_en": "ושתי is of the root שית or שות. The ת is dageshed, because it comes in place of two ת’s (ושת-תי) — one is necessary because no grammatical form of שות can be without the ת of the root, and the other is a servile letter (part of the suffix).<br><br>עד הנהר UNTO THE RIVER — the Euphrates.<br><br>וגרשתמו means AND THOU SHALT DRIVE THEM OUT."}, {"ch": 23, "v": 32, "aliyah": 7, "heb": "לֹֽא־תִכְרֹ֥ת לָהֶ֛ם וְלֵאלֹֽהֵיהֶ֖ם בְּרִֽית׃", "onk": "לָא תִגְזַר לְהוֹן <b>וּלְטַעֲוָתְהוֹן<\/b> קְיָם:", "onk_en": "Do not make a pact with them or with their [<b>false<\/b>] gods.", "pj": "לָא תִגְזְרוּן לְהוֹן וּלְטַעֲוַותְהוֹן קְיָים", "pj_en": "Thou shalt make no covenant with them, nor with their idols.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 33, "aliyah": 7, "heb": "לֹ֤א יֵשְׁבוּ֙ בְּאַרְצְךָ֔ פֶּן־יַחֲטִ֥יאוּ אֹתְךָ֖ לִ֑י כִּ֤י תַעֲבֹד֙ אֶת־אֱלֹ֣הֵיהֶ֔ם כִּֽי־יִהְיֶ֥ה לְךָ֖ לְמוֹקֵֽשׁ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא יֵתְבוּן בְּאַרְעָךְ דִילְמָא יְחַיְבוּן יָתָךְ <b>קֳדָמָי<\/b> אֲרֵי תִפְלַח יָת טַעֲוָתְהוֹן אֲרֵי יְהוֹן לָךְ לְתַקְלָא:", "onk_en": "Do not allow them to live in your land, since they may cause you to sin to [<b>before<\/b>] Me; that you [might] worship their [<b>false<\/b>] gods, and this would be a [fatal] trap to you.", "pj": "לָא תַעֲבֵיד לְהוֹן שְׁכוּנַן בְּאַרְעָךְ דִּלְמָא יַטְעִינָךְ וִיחַיְיבוּן יָתָךְ קֳדָמַי אֲרוּם תִּפְלַח יַת טַעֲוַותְהוֹן אֲרוּם יְהוֹן לָךְ לְתוּקְלָא", "pj_en": "Thou shalt not let them dwell in thy land, lest they cause thee to err, and to sin before Me, when thou dost worship their idols; for they will be a stumbling-block to thee.", "tj": "", "tj_en": "", "rashi": "<b>כי תעבד וגו'.<\/b> הֲרֵי אֵלּוּ כִּי מְשַׁמְּשִׁין בִּמְקוֹם אֲשֶׁר, וְכֵן בְּכַמָּה מְקוֹמוֹת, וְזֶהוּ לְשׁוֹן אִי שֶׁהוּא אֶחָד מֵאַרְבַּע לְשׁוֹנוֹת שֶׁהַכִּי מְשַׁמֵּשׁ, וְגַם מָצִינוּ בְּהַרְבֵּה מְקוֹמוֹת אִם מְשַׁמֵּשׁ בִּלְשׁוֹן אֲשֶׁר, כְּמוֹ וְאִם תַּקְרִיב מִנְחַת בִּכּוּרִים (ויקרא ב'), שֶׁהִיא חוֹבָה:", "rashi_en": "כי תעבד וגו׳ FOR IF THOU SERVE etc. — Both particles כי in this verse have the meaning of אשר “that”. It has this meaning in several passages. This is really the sense of the Aramaic word אי (Hebrew אם) which itself is one of the four meanings in which כי is used (cf. Gittin 90a. where the four usages of כי are given). In fact we find אם (‎אי) used in many passages in the sense of אשר, e. g., (Leviticus 2:14) ואם תקריב where it certainly should not be translated “if” — but ”when thou offer an offering of thy first-fruits”, for this offering is not optional but is obligatory (cf. Rashi on that verse)."}, {"ch": 24, "v": 1, "aliyah": 7, "heb": "וְאֶל־מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל־יְהֹוָ֗ה אַתָּה֙ וְאַהֲרֹן֙ נָדָ֣ב וַאֲבִיה֔וּא וְשִׁבְעִ֖ים מִזִּקְנֵ֣י יִשְׂרָאֵ֑ל וְהִשְׁתַּחֲוִיתֶ֖ם מֵרָחֹֽק׃", "onk": "וּלְמשֶׁה אֲמַר סַק לִ<b>קֳדָם<\/b> יְיָ אַתְּ וְאַהֲרֹן נָדָב וַאֲבִיהוּא וְשִׁבְעִין מִסָבֵי יִשְׂרָאֵל וְתִסְגְדוּן מֵרָחִיק:", "onk_en": "He [God] had said to Moshe, ‘Go up to [the Presence of] [<b>before<\/b>] Adonoy, you, Aharon, Nadav, Avihu, and seventy of the elders of [the B’nei] Yisrael, and prostrate yourselves at a distance.", "pj": "וּלְוַת משֶׁה אָמַר מִיכָאֵל סַרְכַן חָכְמְתָא בְּיוֹמָא שְׁבִיעָאָה לְיַרְחָא סַק קֳדָם יְיָ אַנְתְּ וְאַהֲרן נָדָב וַאֲבִיהוּא וְשׁוּבְעִין מִסָּבֵי יִשְרָאֵל וְתִסְגְּדוּן מֵרָחִיק", "pj_en": "And Michael, the Prince of Wisdom, said to Mosheh on the seventh day of the month, Come up before the Lord, thou and Aharon, Nadab and Abihu, and seventy of the elders of Israel, and worship at a distance.", "tj": "", "tj_en": "", "rashi": "<b>ואל משה אמר.<\/b> פָּרָשָׁה זוֹ נֶאֶמְרָה קֹדֶם עֲשֶׂרֶת הַדִּבְּרוֹת, בְּד' בְּסִיוָן נֶאֱמְרָה לוֹ עֲלֵה (שבת פ\"ח):", "rashi_en": "ואל משה אמר AND UNTO MOSES HE SAID — This section was spoken before the Ten Commandments were given (i. e. אמר is the pluperfect); it was the fourth of Sivan when “Come up” was said to him (Shabbat 88a)."}, {"ch": 24, "v": 2, "aliyah": 7, "heb": "וְנִגַּ֨שׁ מֹשֶׁ֤ה לְבַדּוֹ֙ אֶל־יְהֹוָ֔ה וְהֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְהָעָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽוֹ׃", "onk": "וְיִתְקְרֵב משֶׁה בִלְחוֹדוֹהִי לִ<b>קֳדָם<\/b> יְיָ וְאִנוּן לָא יִתְקָרְבוּן וְעַמָא לָא יִסְקוּן עִמֵהּ:", "onk_en": "Moshe alone shall approach [the Presence of] [<b>before<\/b>] Adonoy, but they must not approach, and the people must not go up with him.”", "pj": "וְיִתְקָרֵב משֶׁה בִּלְחוֹדוֹי קֳדָם יְיָ וְהִינוּן לָא יִתְקַרְבוּן וְעַמָּא לָא יִסְקוּן עִמֵּיהּ", "pj_en": "And Mosheh alone shall approach before the Lord; but they shall not draw nigh, nor may the people come up with him.", "tj": "", "tj_en": "", "rashi": "<b>ונגש משה לבדו.<\/b> אֶל הָעֲרָפֶל:", "rashi_en": "ונגש משה לבדו AND MOSES ALONE SHALL STEP NEAR unto the thick darkness (cf. Exodus 20:18)."}, {"ch": 24, "v": 3, "aliyah": 7, "heb": "וַיָּבֹ֣א מֹשֶׁ֗ה וַיְסַפֵּ֤ר לָעָם֙ אֵ֚ת כׇּל־דִּבְרֵ֣י יְהֹוָ֔ה וְאֵ֖ת כׇּל־הַמִּשְׁפָּטִ֑ים וַיַּ֨עַן כׇּל־הָעָ֜ם ק֤וֹל אֶחָד֙ וַיֹּ֣אמְר֔וּ כׇּל־הַדְּבָרִ֛ים אֲשֶׁר־דִּבֶּ֥ר יְהֹוָ֖ה נַעֲשֶֽׂה׃", "onk": "וַאֲתָא משֶׁה וְאִשְׁתָּעִי לְעַמָא יָת כָּל פִּתְגָמַיָא דַיְיָ וְיָת כָּל דִינַיָא וַאֲתֵיב כָּל עַמָא קָלָא חַד וַאֲמָרוּ כָּל פִּתְגָמַיָא דִי מַלִיל יְיָ נַעְבֵּד:", "onk_en": "Moshe came and told the people all the words of Adonoy, and all the laws. The people responded with one voice and said, “All the words that Adonoy has spoken, we will do.”", "pj": "וְאָתָא משֶׁה וְאִשְׁתָּעֵי לְעַמָּא יַת כָּל פִּתְגָּמַיָא דַיְיָ וְיַת כָּל דִּינַיָיא וְאָתֵיב כָּל עַמָּא קָלָא חָד וַאֲמָרוּ כָּל דְּמַלֵּיל יְיָ נַעֲבֵיד", "pj_en": "And Mosheh came and set before the people all the words of the Lord, and all the judgments. And all the people answered with one voice, and said, All that the Lord hath spoken we will do.", "tj": "", "tj_en": "", "rashi": "<b>ויבא משה ויספר לעם.<\/b> בּוֹ בַיּוֹם:<br><br><b>את כל דברי ה'.<\/b> מִצְוַת פְּרִישָׁה וְהַגְבָּלָה:<br><br><b>ואת כל המשפטים.<\/b> שֶׁבַע מִצְווֹת שֶׁנִּצְטַוּוּ בְנֵי נֹחַ, וְשַׁבָּת וְכִבּוּד אָב וָאֵם וּפָרָה אֲדֻמָּה וְדִינִין שֶׁנִּתְּנוּ לָהֶם בְּמָרָה (סנהדרין נ\"ו):", "rashi_en": "ויבא משה ויספר לעם AND MOSES CAME AND RELATED TO THE PEOPLE — on that same day (the 4th of Sivan).<br><br>את כל דברי ה׳ ALL THE WORDS OF THE LORD — the commands concerning their keeping apart from women and the setting of bounds at Mount Sinai.<br><br>ואת כל המשפטים AND ALL THE JUDGMENTS which had been ordained before the Sinaitic legislation: the seven commands given to the “Sons of Noah” (the non-Israelite world), the law of the Sabbath, of filial respect, of the “red heifer” and regarding the administration of justice, all of which had been given to them already in Marah (cf. Sanhedrin 56b)."}, {"ch": 24, "v": 4, "aliyah": 7, "heb": "וַיִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כׇּל־דִּבְרֵ֣י יְהֹוָ֔ה וַיַּשְׁכֵּ֣ם בַּבֹּ֔קֶר וַיִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָהָ֑ר וּשְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִשְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּכְתַב משֶׁה יָת כָּל פִּתְגָמַיָא דַיְיָ וְאַקְדֵם בְּצַפְרָא וּבְנָא מַדְבְּחָא <b>בְּשִׁפּוֹלֵי<\/b> טוּרָא וְתַרְתָּא עֶשְׂרֵי קָמָן לִתְרֵי עֲסַר שִׁבְטַיָא דְיִשְׂרָאֵל:", "onk_en": "Moshe wrote down all the words of Adonoy. He arose early in the morning, and built an altar beneath [<b>at the foot of<\/b>] the mountain, and [also] twelve monuments [pillars] for the twelve tribes of [the B’nei] Yisrael.", "pj": "וּכְתַב משֶׁה יַת כָּל פִּתְגָמַיָא דַיְיָ וְאַקְדֵים בְּצַפְרָא וּבְנָא מַדְבְּחָא בְּשִׁיפּוֹלֵי טוּרָא וּתְרֵי סְרֵי קָמָן לִתְרֵי סְרֵי שִׁבְטַיָא דְיִשְרָאֵל", "pj_en": "And Mosheh wrote the words of the Lord, and arose in the morning and builded an altar at the lower part of the mountain; and twelve pillars for the twelve tribes of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ויכתב משה.<\/b> מִבְּרֵאשִׁית וְעַד מַתַּן תּוֹרָה, וְכָתַב מִצְווֹת שֶׁנִּצְטַוּוּ בְמָרָה:<br><br><b>וישכם בבקר.<\/b> בַּחֲמִשָּׁה בְּסִיוָן:", "rashi_en": "ויכתב משה AND MOSES WROTE [ALL THE WORDS OF THE LORD] — from בראשית up to (but not including) the account of the Giving of the Torah and he wrote down the commandments that were given to them in Marah (cf. Mekhilta on Exodus 19:10).<br><br>וישכם בבקר AND ROSE UP EARLY IN THE MORNING — on the fifth of Sivan (cf. Rashi on Exodus 19:11) (Shabbat 88a)."}, {"ch": 24, "v": 5, "aliyah": 7, "heb": "וַיִּשְׁלַ֗ח אֶֽת־נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַֽיַּעֲל֖וּ עֹלֹ֑ת וַֽיִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַיהֹוָ֖ה פָּרִֽים׃", "onk": "וּשְׁלַח יָת בּוּכְרֵי בְּנֵי יִשְׂרָאֵל וְאַסִיקוּ עֲלָוָן וְקָרִיבוּ נִכְסַת קוּדְשִׁין <b>קֳדָם<\/b> יְיָ תּוֹרִין:", "onk_en": "He sent the youths [first-born] of B’nei Yisrael and they offered burnt-offerings, and sacrificed oxen as peace-offerings to [<b>before<\/b>] Adonoy.", "pj": "וְשַׁדַּר יַת בּוּכְרֵי בְּנֵי יִשְרָאֵל אֲרוּם עַד הַהִיא שַׁעְתָּא הֲוַות פּוּלְחָנָא בְּבוּכְרַיָא דְעַד כְּדוֹן לָא אִיתְעֲבֵיד מַשְׁכַּן זִמְנָא וְעַד כְּדוֹן לָא אִתְיְיהִיבַת כְּהוּנְתָּא לְאַהֲרן וְאַסִיקוּ עֲלַוָון וְנִכְסַת קוּדְשִׁין קֳדָם יְיָ תּוֹרִין", "pj_en": "And he sent the firstborn of the sons of Israel,-for until that hour had the firstborn had the (office of performing) worship, the tabernacle of ordinance not (as yet) being made, nor the priesthood given unto Aharon; and they offered burnt offerings and consecrated oblations of oxen before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>את נערי.<\/b> הַבְּכוֹרוֹת:", "rashi_en": "את נערי THE LADS — the first-born sons (Zevachim 115b; Onkelos)."}, {"ch": 24, "v": 6, "aliyah": 7, "heb": "וַיִּקַּ֤ח מֹשֶׁה֙ חֲצִ֣י הַדָּ֔ם וַיָּ֖שֶׂם בָּאַגָּנֹ֑ת וַחֲצִ֣י הַדָּ֔ם זָרַ֖ק עַל־הַמִּזְבֵּֽחַ׃", "onk": "וּנְסִיב משֶׁה פַּלְגוּת דְמָא וְשַׁוִי בְּמִזְרְקַיָא וּפַלְגוּת דְמָא זְרַק עַל מַדְבְּחָא:", "onk_en": "Moshe took half the blood and put it in the basins, and [the other] half the blood he sprinkled on the altar.", "pj": "וּנְסֵיב משֶׁה פַּלְגוּת אֲדָם נִכְסָא וְשַׁוִי בְּמִזְרְקַיָא וּפַלְגוּת אֲדָם נִכְסָא דָרַק עַל מַדְבְּחָא", "pj_en": "And Mosheh took half of the blood of the offering, and put it in basins, and half of the blood of the offering he sprinkled upon the altar.", "tj": "", "tj_en": "", "rashi": "<b>ויקח משה את חצי הדם.<\/b> מִי חִלְּקוֹ? מַלְאָךְ בָּא וְחִלְּקוֹ (ויקרא רבה ו'):<br><br><b>באגנת.<\/b> שְׁתֵּי אַגָּנוֹת, אֶחָד לַחֲצִי דַּם עוֹלָה וְאֶחָד לַחֲצִי דָּם שְׁלָמִים לְהַזּוֹת אוֹתָם עַל הָעָם. וּמִכָּאן לָמְדוּ רַבּוֹתֵינוּ שֶׁנִּכְנְסוּ אֲבוֹתֵינוּ לַבְּרִית בְּמִילָה וּטְבִילָה וְהַזָּאַת דָּמִים, שֶׁאֵין הַזָּאָה בְּלֹא טְבִילָה (כריתות ט'):", "rashi_en": "ויקח משה חצי הדם AND MOSES TOOK THE HALF OF THE BLOOD — Who divided it into halves? An angel came down and divided it (Leviticus Rabbah 6:5).<br><br>באגנת IN BASONS — There were two basons, one for holding the half of the blood of the burnt offering and the other for holding the half of the blood of the peace offerings, in order to sprinkle it (both bloods) on the people. From here have our Rabbis inferred (Keritot 9a) that our ancestors entered into the covenant with God by means of circumcision, immersion and sprinkling of blood — and although immersion is not mentioned in this paragraph it must have taken place, for no sprinkling is effective without immersion preceding it (cf. Tosafot Yevamot 46b ד\"ה דאין הזאה בלא טבילה).‎"}, {"ch": 24, "v": 7, "aliyah": 7, "heb": "וַיִּקַּח֙ סֵ֣פֶר הַבְּרִ֔ית וַיִּקְרָ֖א בְּאׇזְנֵ֣י הָעָ֑ם וַיֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר־דִּבֶּ֥ר יְהֹוָ֖ה נַעֲשֶׂ֥ה וְנִשְׁמָֽע׃", "onk": "וּנְסִיב סִפְרָא דִקְיָמָא וּקְרָא <b>קֳדָם<\/b> עַמָא וַאֲמָרוּ כֹּל דִי מַלִיל יְיָ נַעְבֵּד <b>וּנְקַבֵּל<\/b>:", "onk_en": "He then took the Book of the Covenant, and read it in the ears of [<b>before<\/b>] the people. They said, “All that Adonoy has spoken, we will do and we will listen [<b>obey<\/b>].”", "pj": "וּנְסֵיב סִפְרָא דְקַיָימָא דְאוֹרַיְיתָא וּקְרָא קֳדָם עַמָא וְאָמָרוּ כָּל פִּתְגָמַיָא דְמַלֵּיל יְיָ נַעֲבֵיד וּנְקַבֵּיל", "pj_en": "And he took the Book of the Covenant of the Law and read before the people; and they said, All the words which the Lord hath spoken we will perform and obey.", "tj": "", "tj_en": "", "rashi": "<b>ספר הברית.<\/b> מִבְּרֵאשִׁית וְעַד מַתַּן תּוֹרָה וּמִצְווֹת שֶׁנִּצְטַוּוּ בְמָרָה:", "rashi_en": "ספר הברית THE BOOK OF THE COVENANT — the book which we have said contained the part of the Torah from בראשית till the “Giving of the Torah” including the Commandments that were given to them at Marah (Mekhilta; cf. Rashi on v. 4)."}, {"ch": 24, "v": 8, "aliyah": 7, "heb": "וַיִּקַּ֤ח מֹשֶׁה֙ אֶת־הַדָּ֔ם וַיִּזְרֹ֖ק עַל־הָעָ֑ם וַיֹּ֗אמֶר הִנֵּ֤ה דַֽם־הַבְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהֹוָה֙ עִמָּכֶ֔ם עַ֥ל כׇּל־הַדְּבָרִ֖ים הָאֵֽלֶּה׃", "onk": "וּנְסִיב משֶׁה יָת דְמָא וּזְרַק עַל <b>מַדְבְּחָא לְכַפָּרָא עַל<\/b> עַמָא וַאֲמַר הָא דֵין דָם קְיָמָא דִגְזַר יְיָ עִמְכוֹן עַל כָּל פִּתְגָמַיָא הָאִלֵין:", "onk_en": "Moshe then took the blood and cast it on the [<b>Altar to atone on behalf of the<\/b>] people, and he said, “Behold, this is the blood of the covenant which Adonoy has made with you regarding all these words.”", "pj": "וּנְסֵיב משֶׁה יַת פַּלְגוּת דְּמָא דִבְמִזְרְקַיָא וְדָרֵיק עַל מַדְבְּחָא לְכַפָּרָא עַל עַמָּא וַאֲמַר הָא דֵין אֲדַם קְיָימָא דִגְזַר יְיָ עִמְכוֹן עַל כָּל פִּתְגָמַיָא הָאִילֵן", "pj_en": "And Mosheh took half of the blood which was in the basins, and sprinkled upon the altar, to expiate the people, and said, Behold, this is the blood of the Covenant which the Lord hath made with you upon all these words.", "tj": "", "tj_en": "", "rashi": "<b>ויזרק.<\/b> עִנְיַן הַזָּאָה, וְתַרְגּוּמוֹ וּזְרַק עַל מַדְבְּחָא לְכַפָּרָא עַל עַמָּא:", "rashi_en": "ויזרק means sprinkling — he sprinkled it on the people (not he threw it against the people, as this word might imply; cf. e. g., Exodus 9:8: וזרקו משה השמימה). The Targum, however, renders it by: and he poured it (the blood) upon the altar as atonement for (על) the people, adding the words “upon the altar”, and taking על העם to denote “on behalf of the people”, i. e. he poured it out to atone for the people."}, {"ch": 24, "v": 9, "aliyah": 7, "heb": "וַיַּ֥עַל מֹשֶׁ֖ה וְאַהֲרֹ֑ן נָדָב֙ וַאֲבִיה֔וּא וְשִׁבְעִ֖ים מִזִּקְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּסְלֵיק משֶׁה וְאַהֲרֹן נָדָב וַאֲבִיהוּא וְשִׁבְעִין מִסָבֵי יִשְׂרָאֵל", "onk_en": "Moshe and Aharon then went up along with Nadav and Avihu, and seventy of the elders of [the B’nei] Yisrael.", "pj": "וּסְלֵיק משֶׁה וְאַהֲרן נָדָב וַאֲבִיהוּא וְשִׁבְעִין מִסָּבֵי יִשְרָאֵל", "pj_en": "And Mosheh and Aharon, Nadab and Abihu, and seventy of the elders of Israel, went up.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 10, "aliyah": 7, "heb": "וַיִּרְא֕וּ אֵ֖ת אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וְתַ֣חַת רַגְלָ֗יו כְּמַעֲשֵׂה֙ לִבְנַ֣ת הַסַּפִּ֔יר וּכְעֶ֥צֶם הַשָּׁמַ֖יִם לָטֹֽהַר׃", "onk": "וַחֲזוֹ יָת <b>יְקַר<\/b> אֱלָהָא דְיִשְׂרָאֵל וּתְחוֹת <b>כָּרְסָא יְקָרֵהּ<\/b> כְּעוֹבַד <b>אֶבֶן טָבָא וּכְמֶחֱזֵי<\/b> שְׁמַיָא לְבָרִירוּ:", "onk_en": "They saw [a vision of] the [<b>Glory of the<\/b>] God of Yisrael, and under His feet [<b>the throne of His Glory<\/b>] [there was something] like a brickwork of sapphire [<b>precious stone<\/b>], and it was like the essence [<b>image<\/b>] of heaven in purity.", "pj": "וּזְקָפוּ נָדָב וַאֲבִיהוּא יַת עֵינֵיהוֹן וְחָמוּן יַת אִיקַר אֱלָהָא דְיִשְרָאֵל וּתְחוֹת אַפִּיפּוּרִין דְּרִיגְלוֹי דְמַיְצַע תְּחוֹת כּוּרְסֵיהּ הֵי כְעוֹבַד אַבַן סַפִּירִינוּן מִידְכַּר שִׁעֲבּוּדָא דְשַׁעְבִּידוּ מִצְרָאֵי יַת בְּנֵי יִשְרָאֵל בְּטִינָא וּבְלִיבְנִין וַהֲווֹן נְשַׁיָא בָּטְשָׁן יַת טִינָא עִם גּוּבְרֵיהוֹן הֲוַת תַּמָּן רִיבָא מְפַנְקָתָא מַעְבַּרְתָּא וְאַפִּילַת יַת עוּבְרָא וְאִיתְבַּטַּשׁ עִם טִינָא נָחָת גַּבְרִיאֵל וְעָבַד מִנֵיהּ לְבֵינְתָא וְאַסְקֵיהּ לִשְׁמֵי מְרוֹמָא וְאַתְקְנֵיהּ גִּילוּגְדַק תְּחוֹת אַפִּיפּוּרִין דְּמָרֵי עַלְמָא זִיוֵיהּ הֵי כְּעוֹבַד אֲבַן טָבָא וְהֵי כִּתְקוּף שְׁפַר שְׁמַיָא כַּד הִינוּן בְּרִירִין מִן עֲנָנַיָא", "pj_en": "And Nadab and Abihu lifted up their eyes, and saw the glory of the God of Israel; and under the footstool of His feet which was placed beneath His throne, was like the work of sapphire stone a memorial of the servitude with which the Mizraee had made the children of Israel to serve in clay and bricks, (what time) there were women treading clay with their husbands; the delicate young woman with child was also there, and made abortive by being beaten down with the clay. And thereof did Gabriel, descending, make brick, and, going up to the heavens on high, set it, a footstool under the cathedra of the Lord of the world whose splendour was as the work of a precious stone, and as the power of the beauty of the heavens when they are clear from clouds.", "tj": "אִיפוּפְרִין דְּרִיגְלוֹי כְּעוֹבַד לָבָן דְּסַפִּירִינוּן וּכְחֵיזוּ שְׁמַיָא כַּד הֲווֹ נַקְיָין מִן עֲנָנַיָא:", "tj_en": "The footstool of His feet as the work of pure sapphire stones, and as the aspect of the heavens when they are cleared from clouds.", "rashi": "<b>ויראו את אלהי ישראל.<\/b> נִסְתַּכְּלוּ וְהֵצִיצוּ וְנִתְחַיְּבוּ מִיתָה, אֶלָּא שֶׁלֹּא רָצָה הַקָּבָּ\"ה לְעַרְבֵּב שִׂמְחַת הַתּוֹרָה וְהִמְתִּין לְנָדָב וַאֲבִיהוּא עַד יוֹם חֲנֻכַּת הַמִּשְׁכָּן, וְלַזְּקֵנִים עַד וַיְהִי הָעָם כְּמִתְאוֹנְנִים, וַתִּבְעַר בָּם אֵשׁ ה' וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה (במדבר י\"א) – בַּקְּצִינִים שֶׁבַּמַּחֲנֶה (תנחומא):<br><br><b>כמעשה לבנת הספיר.<\/b> הִיא הָיְתָה לְפָנָיו בִּשְׁעַת הַשִּׁעְבּוּד, לִזְכֹּר צָרָתָן שֶׁל יִשְׂרָאֵל שֶׁהָיוּ מְשֻׁעְבָּדִים בְּמַעֲשֵׂה לְבֵנִים (ויקרא רבה):<br><br><b>וכעצם השמים לטהר.<\/b> מִשֶּׁנִּגְאֲלוּ הָיָה אוֹר וְחֶדְוָה לְפָנָיו:<br><br><b>וכעצם.<\/b> כְּתַרְגּוּמוֹ, לְשׁוֹן מַרְאֶה:<br><br><b>לטהר.<\/b> לְשׁוֹן בָּרוּר וְצָלוּל:", "rashi_en": "ויראו את אלהי ישראל NOW THEY SAW THE GOD OF ISRAEL — They gazed intently and failing in this they peeped in their attempt to catch a glimpse of the Supreme Being, and thereby made themselves liable to death. But it was only because God did not wish to disturb the joy caused by the Giving of the Torah, that He did not punish them instantly, but waited (postponed the punishment) for Nadab and Abihu until the day when the Tabernacle was dedicated, when they were stricken with death, and for the elders until the event of which the text relates, (Numbers 11:16) “And when the people complained …. and the fire of the Lord burned among them and destroyed בקצה המחנה” — those who were the קצינים “nobles” of the camp (Midrash Tanchuma, Beha'alotcha 16).<br><br>כמעשה לבנת הספיר AS IT WERE THE BRICKWORK OF SAPPHIRE — This had been before Him during the period of Egyptian slavery as a symbol of Israel’s woes — for they were subjected to do brick-work (cf. Jerusalem Talmud Succah 6:3; Leviticus Rabbah 23:8).<br><br>וכעצם השמים לטהר AND AS IT WERE AS THE BODY OF HEAVEN FOR PURITY — This implies that as soon as they (the Israelites) were delivered there was radiance and rejoicing before Him.<br><br>וכעצם — Translate it as the Targum does: “as the appearance”.<br><br>לטהר means FOR BRIGHTNESS AND CLEARNESS."}, {"ch": 24, "v": 11, "aliyah": 7, "heb": "וְאֶל־אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑וֹ וַיֶּֽחֱזוּ֙ אֶת־הָ֣אֱלֹהִ֔ים וַיֹּאכְל֖וּ וַיִּשְׁתּֽוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּלְרַבְרְבֵי בְּנֵי יִשְׂרָאֵל <b>לָא הֲוָה נִזְקָא וַחֲזוֹ יָת יְקָרָא<\/b> דַיְיָ וַהֲווֹ <b>חָדָן בְּקָרְבָּנֵיהוֹן דְאִתְקַבָּלוּ בְּרַעֲוָא כְּאִלוּ<\/b> אָכְלִין וְשָׁתָן:", "onk_en": "But against the nobility of the B’nei Yisrael, He [God] did not send His hand [<b>there was no damage<\/b>]. They envisioned [<b>saw the Glory of<\/b>] God, and they [<b>rejoiced in their sacrifices which were accepted graciously as if they<\/b>] ate and drank.", "pj": "וּלְוַת נָדָב וַאֲבִיהוּא עוּלֵמַיָא שַׁפִּירַיָא לָא שָׁדַר מַחְתֵּיהּ בְּהַהוּא שַׁעְתָּא בְּרַם אִתְנַטְרָא לְהוֹן לְיוֹם תְּמִינַיָא לְאַשְׁלָמוּתָא לְאַסְעָרָא עֲלֵיהוֹן וְחָמוֹן יַת אִיקַר שְׁכִינְתָּא דַיְיָ וַהֲווֹן חָדָן בְּקוּרְבָּנֵיהוֹן דְּאִתְקַבָּלוּ בְּרַעֲוָא הֵי כְאָכְלִין וְהֵי כְשַׁתְיָין", "pj_en": "But upon Nadab and Abihu, the comely young men, was the stroke not sent in that hour, but it awaited them on the eighth day for a retribution to destroy them; but they saw the glory of the Shekinah of the Lord, and rejoiced that their oblations were received with favour, [as if they] did eat and drink.", "tj": "", "tj_en": "", "rashi": "<b>ואל אצילי.<\/b> הֵם נָדָב וַאֲבִיהוּא וְהַזְּקֵנִים:<br><br><b>לא שלח ידו.<\/b> מִכְּלָל שֶׁהָיוּ רְאוּיִים לְהִשְׁתַּלֵּחַ בָּהֶם יָד (תנחומא, ויקרא רבה כ'):<br><br><b>ויחזו את האלהים.<\/b> הָיוּ מִסְתַּכְּלִין בּוֹ בְּלֵב גַּס מִתּוֹךְ אֲכִילָה וּשְׁתִיָּה, כָּךְ מִדְרַשׁ תַּנְחוּמָא, וְאֻנְקְלוֹס לֹא תִרְגֵּם כֵּן.<br><br><b>אצילי.<\/b> לְשׁוֹן גְּדוֹלִים, כְּמוֹ וּמֵאֲצִילֶיהָ קְרָאתִיךָ (ישעיהו מ\"א), וַיָּאצֶל מִן הָרוּחַ (במדבר י\"א), שֵׁשׁ אַמּוֹת אַצִּילָה (יחזקאל מ\"א):", "rashi_en": "ואל אצילי AND UPON THE NOBLES — these were Nadab and Abihu and the elders —<br><br>לא שלח ידו HE LAID NOT HIS HAND — This implies that they well deserved that God should stretch forth His hand against them (Midrash Tanchuma, Beha'alotcha 16).<br><br>ויחזו את האלהים AND THEY BEHELD GOD [AND DID EAT AND DRINK] — They gazed at him intimately as though their association with Him were a matter of eating and drinking. Thus does the Midrash Tanchuma, Beha'alotcha 16 explain it. Onkelos, however, does not translate the passage this way (i. e. he does not take it in a depreciative sense that Nadab and Abihu and the elders acted improperly. His translation is: they beheld God’s Glory and rejoiced in their offerings which were accepted as though they were eating and drinking). —<br><br>אצילי means “the great men”, as, (Isaiah 41:9) “I called thee from the chief men (אציליה) thereof”; (Numbers 11:17) “And he increased (ויאצל) some of the spirit” (cf. Rashi on Numbers 11:17 and Onkelos on 11:25); (Ezekiel 41:8) “six cubits in its size (largeness) (אצילה‎)”."}, {"ch": 24, "v": 12, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛י הָהָ֖רָה וֶהְיֵה־שָׁ֑ם וְאֶתְּנָ֨ה לְךָ֜ אֶת־לֻחֹ֣ת הָאֶ֗בֶן וְהַתּוֹרָה֙ וְהַמִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְהוֹרֹתָֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה סַק <b>לִקֳדָמַי<\/b> לְטוּרָא וֶהֱוֵי תַמָן וְאֶתֵּן לָךְ יָת לוּחֵי אַבְנָא וְאוֹרַיְתָא וְתַפְקֶדְתָּא דִכְתָבִית  לְאַלוּפֵיהוֹן:", "onk_en": "Adonoy then said to Moshe, “Come up to [<b>before<\/b>] Me to the mountain and remain there. I will give you the tablets of stone, the Torah and the commandment, which I have written [in order] to teach them.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה סוֹק קֳדָמַי לְטַוְורָא וַהֲוֵי תַמָּן וְאֵיתַּן לָךְ יַת לוּחֵי אַבְנָא דִּבְּהוֹן רָמוּז שְׁאָר פִּתְגָמֵי אוֹרַיְיתָא וְשִׁית מְאָה וּתְלֵיסְרֵי פִקּוּדַיָיא דִכְתָבִית לְאַלּוּפֵיהוֹן", "pj_en": "And the Lord said to Mosheh, Ascend before Me at the mount, and I will there give thee the tables of stone on which I have set forth the rest of the words of the Law, and the six hundred and thirteen precepts which I have written for their instruction.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אל משה.<\/b> לְאַחַר מַתַּן תּוֹרָה:<br><br><b>עלה אלי ההרה והיה שם.<\/b> אַרְבָּעִים יוֹם:<br><br><b>את לחת האבן והתורה והמצוה אשר כתבתי להורתם.<\/b> כָּל שֵׁשׁ מֵאוֹת וּשְׁלֹשׁ עֶשְׂרֵה מִצְווֹת בִּכְלַל עֲשֶׂרֶת הַדִּבְּרוֹת הֵן, וְרַבֵּנוּ סְעַדְיָה פֵּרֵשׁ בָּאַזְהָרוֹת שֶׁיָּסַד לְכָל דִּבּוּר וְדִבּוּר מִצְווֹת הַתְּלוּיוֹת בּוֹ:", "rashi_en": "ויאמר ה’ אל משה AND THE LORD SAID TO MOSES — after the Giving of the Law,<br><br>עלה אלי ההרה והיה שם COME UP TO ME INTO THE MOUNTAIN AND REMAIN THERE forty days.<br><br>את לחת האבן והתורה והמצוה אשר כתבתי להורתם [AND I WILL GIVE THEE] THE TABLETS OF STONE, AND THE LAW, AND THE COMMANDMENT WHICH I HAVE WRITTEN TO TEACH THEM — All the six hundred and thirteen commandments are implicitly contained in the Ten Commandments and may therefore be regarded as having been written on the tablets. Rabbi Saadia specified in the אזהרות which he has composed those commandments which may be associated with each of the Ten Commandments."}, {"ch": 24, "v": 13, "aliyah": 7, "heb": "וַיָּ֣קׇם מֹשֶׁ֔ה וִיהוֹשֻׁ֖עַ מְשָׁרְת֑וֹ וַיַּ֥עַל מֹשֶׁ֖ה אֶל־הַ֥ר הָאֱלֹהִֽים׃", "onk": "וְקָם משֶׁה וִיהוֹשֻׁעַ מְשֻׁמְשָׁנֵהּ וּסְלֵיק משֶׁה לְטוּרָא <b>דְאִתְגְלִי עֲלוֹהִי יְקָרָא<\/b> דַיְיָ:", "onk_en": "Moshe and Yehoshua, his attendant, set out, but [only] Moshe went up to the mountain [<b>upon which the Glory<\/b>] of God [<b>was revealed<\/b>].", "pj": "וְקָם משֶׁה וִיהוֹשֻׁעַ מְשׁוּמְשָׁנֵיהּ וּסְלֵיק משֶׁה לְטַוְורָא דְאִיתְגְּלֵי עֲלוֹי יְקַר שְׁכִינְתָּא דַיְיָ", "pj_en": "And Mosheh arose and Jehoshua his minister; and Mosheh went up to the mountain on which was revealed the glory of the Shekinah of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ויקם משה ויהושע משרתו.<\/b> לֹא יָדַעְתִּי מַה טִּיבוֹ שֶׁל יְהוֹשֻׁעַ כָּאן, וְאוֹמֵר אֲנִי, שֶׁהָיָה הַתַּלְמִיד מְלַוֶּה לָרַב עַד מְקוֹם הַגְבָּלַת תְּחוּמֵי הָהָר שֶׁאֵינוֹ רַשַּׁאי לֵילֵךְ מִשָּׁם וָהָלְאָה, וּמִשָּׁם וַיַּעַל מֹשֶׁה לְבַדּוֹ אֶל הַר הָאֱלֹהִים, וִיהוֹשֻׁעַ נָטָה שָׁם אָהֳלוֹ וְנִתְעַכֵּב שָׁם כָּל אַרְבָּעִים יוֹם, שֶׁכֵּן מָצִינוּ כְּשֶׁיָּרַד מֹשֶׁה וַיִּשְׁמַע יְהוֹשֻׁעַ אֶת קוֹל הָעָם בְּרֵעֹה (שמות ל״ב:י״ז), לָמַדְנוּ שֶׁלֹּא הָיָה יְהוֹשֻׁעַ עִמָּהֶם:", "rashi_en": "ויקם משה ויהושע משרתו AND MOSES ROSE AND HIS MINISTER JOSHUA — I am not sure in what capacity Joshua appears here, but I think that as a disciple he was accompanying the teacher as far as the place where the bounds of the mountain were marked out, whence onward he was not permitted to proceed. From that point ויעל משה MOSES alone ASCENDED אל הר האלהים THE MOUNTAIN OF GOD, whilst Joshua pitched his tent there and stayed there during the whole forty days which Moses spent on the mountain. For thus we find that when Moses came down from the mountain it states, (Exodus 32:17) “and Joshua heard the voice of the people that they shouted” — from which we may infer that he was not with them in the camp."}, {"ch": 24, "v": 14, "aliyah": 7, "heb": "וְאֶל־הַזְּקֵנִ֤ים אָמַר֙ שְׁבוּ־לָ֣נוּ בָזֶ֔ה עַ֥ד אֲשֶׁר־נָשׁ֖וּב אֲלֵיכֶ֑ם וְהִנֵּ֨ה אַהֲרֹ֤ן וְחוּר֙ עִמָּכֶ֔ם מִי־בַ֥עַל דְּבָרִ֖ים יִגַּ֥שׁ אֲלֵהֶֽם׃", "onk": "וּלְסָבַיָא אֲמַר אוֹרִיכוּ לָנָא הָכָא עַד דִנְתוּב לְוָתְכוֹן וְהָא אַהֲרֹן וְחוּר עִמְכוֹן מָן דְאִית לֵהּ דִינָא יִתְקְרֵב <b>לִקֳדָמֵיהוֹן<\/b>:", "onk_en": "He [Moshe] said to the elders, “Wait here for us until we return to you, and Aharon and Chur will be with you. Whoever has a claim can approach [<b>before<\/b>] them.”", "pj": "וּלְחַכִּימַיָא אָמַר אַמְתִּינוּן לָנָא הָכָא עַד זְמַן דִּנְתוֹב לְוַותְכוֹן וְהָא אַהֲרן וְחוּר עִמְכוֹן מַאן דְּאִית לֵיהּ עֵיסַק דִּינָא יִתְקְרֵב לְוַותְהוֹן", "pj_en": "And to the sages he had said, Expect us here, at the time of our return to you; and, behold, Aharon and Hur are with you; if there be any matter of judgment, bring it to them.", "tj": "", "tj_en": "", "rashi": "<b>ואל הזקנים אמר.<\/b> בְּצֵאתוֹ מִן הַמַּחֲנֶה:<br><br><b>שבו לנו בזה.<\/b> וְהִתְעַכְּבוּ כָּאן עִם שְׁאָר הָעָם בַּמַּחֲנֶה, לִהְיוֹת נְכוֹנִים לִשְׁפֹּט לְכָל אִישׁ רִיבוֹ:<br><br><b>חור.<\/b> בְּנָהּ שֶׁל מִרְיָם הָיָה וְאָבִיו כָּלֵב בֶּן יְפֻנֶּה, שֶׁנֶּאֱמַר וַיִּקַּח לוֹ כָלֵב אֶת אֶפְרָת וַתֵּלֶד לוֹ אֶת חוּר (דהי\"א ב'), אֶפְרָת זוֹ מִרְיָם כִּדְאִיתָא בְּסוֹטָה:<br><br><b>מי בעל דברים.<\/b> מִי שֶׁיֵּשׁ לוֹ דִּין:", "rashi_en": "ואל הזקנים אמר BUT UNTO THE ELDERS HE SAID when he left the camp (אמר in the sequence of verbs which we find here denotes the pluperfect; the translation therefore is: and to the elders he had said).<br><br>שבו לנו בזה ABIDE YE HERE FOR US and stay ye with all the other people in the camp so as to be ready to decide his dispute for each man.<br><br>חור [AND] HUR — He was the son of Miriam and his father was Caleb the son of Jephunneh, as it is said, (1 Chr. 2:9) “Caleb took unto him Ephrath, who bare him Hur”; and Ephrath is identical with Miriam, as it is stated in Treatise Sotah 11b.<br><br>מי בעל דברים HE WHO HAS ANY MATTER TO DO — i. e. he who has any law-suit."}, {"ch": 24, "v": 15, "aliyah": 7, "heb": "וַיַּ֥עַל מֹשֶׁ֖ה אֶל־הָהָ֑ר וַיְכַ֥ס הֶעָנָ֖ן אֶת־הָהָֽר׃", "onk": "וּסְלֵק משֶׁה לְטוּרָא וַחֲפָא עֲנָנָא יָת טוּרָא:", "onk_en": "Moshe went up to the mountain, and the cloud covered the mountain.", "pj": "וּסְלֵיק משֶׁה לְטַוְורָא וַחֲפָא עֲנַן יְקָרָא יַת טַוְורָא", "pj_en": "And Mosheh went up into the mount, and the Cloud of Glory covered the mount.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 16, "aliyah": 7, "heb": "וַיִּשְׁכֹּ֤ן כְּבוֹד־יְהֹוָה֙ עַל־הַ֣ר סִינַ֔י וַיְכַסֵּ֥הוּ הֶעָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַיִּקְרָ֧א אֶל־מֹשֶׁ֛ה בַּיּ֥וֹם הַשְּׁבִיעִ֖י מִתּ֥וֹךְ הֶעָנָֽן׃", "onk": "וּשְׁרָא יְקָרָא דַיְיָ עַל טוּרָא דְסִינַי וַחֲפָהִי עֲנָנָא שִׁתָּא יוֹמִין וּקְרָא לְמשֶׁה בְּיוֹמָא שְׁבִיעָאָה מִגוֹ עֲנָנָא:", "onk_en": "The glory of Adonoy rested on Mount Sinai, and the cloud covered it for six days. On the seventh day, He called to Moshe from the midst of the cloud.", "pj": "וּשְׁרָא אִיקַר שְׁכִינְתָּא דַיְיָ עַל טַוְורָא דְסִינַי וַחֲפָהִי עֲנַן יְקָרָא שִׁיתָּא יוֹמִין וּקְרָא לְמשֶׁה בְּיוֹמָא שְׁבִיעָאָה מִגּוֹ עֲנָנָא", "pj_en": "And the glory of the Lord's Shekinah abode upon the mountain of Sinai, and the Cloud of Glory covered it six days. And on the seventh day He called to Mosheh from the midst of the Cloud.", "tj": "", "tj_en": "", "rashi": "<b>ויכסהו הענן.<\/b> רַבּוֹתֵינוּ חוֹלְקִים בַּדָּבָר, יֵשׁ מֶהֵם אוֹ' אֵלּוּ שִׁשָּׁה יָמִים שֶׁמֵּר\"ח (עַד עֲצֶרֶת יוֹם מַתַּן תּוֹרָה):<br><br><b>ויכסהו הענן.<\/b> לָהָר:<br><br><b>ויקרא אל משה ביום השביעי<\/b> לוֹמַר עֲשֶׂרֶת הַדִּבְּרוֹת, וּמֹשֶׁה וְכָל בְּנֵי יִשְׂרָאֵל עוֹמְדִים, אֶלָּא שֶׁחָלַק הַכָּתוּב כָּבוֹד לְמֹשֶׁה; וְיֵ\"אֹ <b>ויכסהו הענן<\/b> לְמֹשֶׁה <b>ששת ימים<\/b> לְאַחַר עֲשֶׂרֶת הַדִּבְּרוֹת, וְהֵם הָיוּ בִּתְחִלַּת אַרְבָּעִים יוֹם שֶׁעָלָה מֹשֶׁה לְקַבֵּל לוּחוֹת, וְלִמֶּדְךָ שֶׁכָּל הַנִּכְנָס לְמַחֲנֵה שְׁכִינָה טָעוּן פְּרִישָׁה שִׁשָּׁה יָמִים (יומא ג'):", "rashi_en": "ויכסהו הענן AND THE CLOUD COVERED IT (lit., “him”) [SIX DAYS] — Our Rabbis are of different opinions as to what this passage means. Some of them hold that these were the six days from the first of Sivan (until the Feast of Weeks, the day of the Giving of the Law) —<br><br>and that the word ויכסהו in the phrase ויכסהו הענן “the cloud covered him” or covered “it” means that it covered the mountain.<br><br>ויקרא אל משה ביום השביעי AND HE CALLED UNTO MOSES ON THE SEVENTH DAY of Sivan to utter the Ten Commandments. It is true that Moses and all Israel were standing there but the text states, “He called unto Moses” merely to give special honour to Moses calling him by name. Others, however, say that the passage means: AND THE CLOUD COVERED HIM — Moses, FOR SIX DAYS after the Ten Commandments had been given. These were at the beginning of the forty days which Moses spent on Mount Sinai when he went up to receive the Tablets, and Scripture teaches you that whosoever enters the camp of the Divine Majesty (here the mountain and later on the Holy of Holies) requires separation from others (must live in seclusion) for six days (Yoma 4a)."}, {"ch": 24, "v": 17, "aliyah": 7, "heb": "וּמַרְאֵה֙ כְּב֣וֹד יְהֹוָ֔ה כְּאֵ֥שׁ אֹכֶ֖לֶת בְּרֹ֣אשׁ הָהָ֑ר לְעֵינֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְחֵיזוּ יְקָרָא דַיְיָ <b>כְּחֵיזוּ<\/b> אֶשָׁא אָכְלָא בְּרֵישׁ טוּרָא לְעֵינֵי בְּנֵי יִשְׂרָאֵל:", "onk_en": "The appearance of Adonoy’s glory was like [<b>the appearance of<\/b>] a consuming flame at the top to the mountain; before the eyes of the B’nei Yisrael.", "pj": "וְחֵיזוּ זִיו יִקְרָא דַיְיָ הֵי כְאֵשָׁא בָעֲרָא וְזִיקוּקֵי אֵשָׁא אָכְלָא אֵשָׁא וַהֲווֹ חָמָן וּתְמֵהִין בְּנֵי יִשְרָאֵל", "pj_en": "And the appearance of the splendour of the glory of the Lord was as burning fire with flashes of devouring fire; and the sons of Israel beheld and were awe-struck.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 18, "aliyah": 7, "heb": "וַיָּבֹ֥א מֹשֶׁ֛ה בְּת֥וֹךְ הֶעָנָ֖ן וַיַּ֣עַל אֶל־הָהָ֑ר וַיְהִ֤י מֹשֶׁה֙ בָּהָ֔ר אַרְבָּעִ֣ים י֔וֹם וְאַרְבָּעִ֖ים לָֽיְלָה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְעַל משֶׁה בְּגוֹ עֲנָנָא וּסְלֵיק לְטוּרָא וַהֲוָה משֶׁה בְּטוּרָא אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן:", "onk_en": "And Moshe came into the midst of the cloud. and went up into the mountain. Moshe remained on the mountain for forty days and forty nights.", "pj": "וְעָאל משֶׁה בְּגוֹ עֲנָנָא וּסְלֵיק לְטַוְורָא וַהֲוָה משֶׁה בְּטַוְורָא אַלִיף פִּתְגָמֵי אוֹרַיְיתָא מִן פּוּם קוּדְשָׁא יְהֵי שְׁמֵיהּ מְשַׁבַּח אַרְבְּעִין יְמָמִין וְאַרְבָּעִין לֵילְוָון", "pj_en": "And Mosheh entered into the midst of the Cloud, and ascended the mountain; and Mosheh was upon the mountain forty days and forty nights, learning the words of the Law from the mouth of the Holy One, whose Name be praised.", "tj": "", "tj_en": "", "rashi": "<b>בתוך הענן.<\/b> עָנָן זֶה כְּמִין עָשָׁן הוּא, וְעָשָׂה לוֹ הַקָּבָּ\"ה לְמֹשֶׁה שְׁבִיל בְּתוֹכוֹ (שם ד'):", "rashi_en": "בתוך הענן INTO THE MIDST OF THE CLOUD — This cloud was thick like smoke and God made a path for Moses through it (Yoma 4b)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
