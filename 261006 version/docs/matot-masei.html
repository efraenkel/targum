he captives, both of man and beast, and take their amount, thou and Elazar the priest, and the chiefs of the fathers of the congregation;", "tj": "", "tj_en": "", "rashi": "<b>שא את ראש.<\/b> קַח אֶת הַחֶשְׁבּוֹן:", "rashi_en": "שאו את ראש means, TAKE THE CENSUS."}, {"ch": 31, "v": 27, "aliyah": 2, "heb": "וְחָצִ֙יתָ֙ אֶת־הַמַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַמִּלְחָמָ֔ה הַיֹּצְאִ֖ים לַצָּבָ֑א וּבֵ֖ין כׇּל־הָעֵדָֽה׃", "onk": "וּתְפַלֵּג יָת דְּבַרְתָּא בֵּין גַּבְרֵי <b>מְגִיחֵי קְרָבָא<\/b> דִּנְפָקוּ לְחֵילָא וּבֵין כָּל כְּנִשְׁתָּא:", "onk_en": "Divide in half the spoils seized among those who took the war in hand [<b>waged war<\/b>], who went into the army, and the entire community.", "pj": "וּתְפַלֵיג יַת דְבַרְתָּא בֵּין גוּבְרַיָא בְּלוּשַׁיָא דְאַחֲדוּ יַת עָדִיתָא בְּאַגְחוּת קְרָבָא דִנְפָקוּ לְחֵילָא וּבֵין כָּל כְּנִשְׁתָּא", "pj_en": "and divide the spoil between the men of war who took the spoil in the conflict of battle, having gone forth with the host, and between all the congregation;", "tj": "", "tj_en": "", "rashi": "<b>וחצית את המלקוח בין תפשי המלחמה וגו'.<\/b> חֶצְיוֹ לָאֵלּוּ וְחֶצְיוֹ לָאֵלּוּ:", "rashi_en": "וחצית את המלקוח בין תפשי המלחמה וגו׳ AND THOU SHALT DIVIDE THE PREY INTO TWO PARTS: BETWEEN THEM THAT TOOK THE WAR UPON THEMSELVES, etc. — half of it for these and half of it for those."}, {"ch": 31, "v": 28, "aliyah": 2, "heb": "וַהֲרֵמֹתָ֨ מֶ֜כֶס לַֽיהֹוָ֗ה מֵאֵ֞ת אַנְשֵׁ֤י הַמִּלְחָמָה֙ הַיֹּצְאִ֣ים לַצָּבָ֔א אֶחָ֣ד נֶ֔פֶשׁ מֵחֲמֵ֖שׁ הַמֵּא֑וֹת מִן־הָאָדָם֙ וּמִן־הַבָּקָ֔ר וּמִן־הַחֲמֹרִ֖ים וּמִן־הַצֹּֽאן׃", "onk": "<b>וְתַפְרֵשׁ<\/b> נְסִיבָא קֳדָם יְיָ מִן גַּבְרֵי מְגִיחֵי קְרָבָא דִּנְפָקוּ לְחֵילָא חַד נַפְשָׁא מֵחֲמֵשׁ מְאָה מִן אֱנָשָׁא וּמִן תּוֹרֵי וּמִן חֲמָרֵי וּמִן עָנָא:", "onk_en": "Levy [<b>separate<\/b>] a tribute to Adonoy from the people of the army who went out to war, one living being out of five hundred from the people, cattle, donkeys and sheep.", "pj": "וְתַפְרֵישׁ נְסִיבָא לִשְׁמָא דַיְיָ מִן גוּבְרֵי מְגִיחֵי קְרָבָא דִנְפָקוּ לְחֵילָא חֲדָא בַּת נְשָׁא מֵחֲמֵשׁ מְאָה הֵיכְדֵין מֵאֱנָשָׁא מִן תּוֹרֵי וּמִן חַמְרֵי וּמִן עָנָא", "pj_en": "and separate that which is to be given up to the Name of the Lord by the men of war who went forth with the host: one woman out of five hundred; so, likewise, of oxen, asses, and sheep.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 29, "aliyah": 2, "heb": "מִמַּֽחֲצִיתָ֖ם תִּקָּ֑חוּ וְנָתַתָּ֛ה לְאֶלְעָזָ֥ר הַכֹּהֵ֖ן תְּרוּמַ֥ת יְהֹוָֽה׃", "onk": "מִפַּלְגּוּתְהוֹן תִּסְּבוּן וְתִתֵּן לְאֶלְעָזָר כַּהֲנָא אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Take this from their half and give it to Elozor the <i>kohein<\/i> as a gift to [<b>before<\/b>] Adonoy.", "pj": "מִן פְּלוּגְתְּהוֹן דְהוּא חוֹלַק גַבְרֵי מַגִיחֵי קְרָבָא תִּסְבוּן וְתִתְּנוּן לְאֶלְעָזָר כַּהֲנָא אַפְרָשׁוּתָא לִשְׁמָא דַיְיָ", "pj_en": "From their half, the portion of the men of war, shalt thou take them, and give to Elazar the priest, as a separation unto the Name of the Lord;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 30, "aliyah": 2, "heb": "וּמִמַּחֲצִ֨ת בְּנֵֽי־יִשְׂרָאֵ֜ל תִּקַּ֣ח&thinsp;<b>׀<\/b> אֶחָ֣ד&thinsp;<b>׀<\/b> אָחֻ֣ז מִן־הַחֲמִשִּׁ֗ים מִן־הָאָדָ֧ם מִן־הַבָּקָ֛ר מִן־הַחֲמֹרִ֥ים וּמִן־הַצֹּ֖אן מִכׇּל־הַבְּהֵמָ֑ה וְנָתַתָּ֤ה אֹתָם֙ לַלְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהֹוָֽה׃", "onk": "וּמִפַּלְגּוּת בְּנֵי יִשְׂרָאֵל תִּסַּב חַד דְּאִתַּחַד מִן חַמְשִׁין מִן אֱנָשָׁא מִן תּוֹרֵי מִן חֲמָרֵי וּמִן עָנָא מִכָּל בְּעִירָא וְתִתֵּן יָתְהוֹן לְלֵוָאֵי נָטְרֵי מַטְּרַת מַשְׁכְּנָא דַיְיָ:", "onk_en": "And from the half of the Bnei Yisroel, take one part out of fifty, of the people, cattle, donkeys, sheep, and of all the other animals, and give it to the Levites who are entrusted with the <i>Mishkon<\/i> of Adonoy.”", "pj": "וּמִפַּלְגוּת דִבְנֵי יִשְרָאֵל תִּיסַב חַד דִמִיתַחַד מִן חַמְשִׁין מִן בַּת נְשָׁא וּמִן תּוֹרֵי וּמִן חַמְרֵי וּמִן כָּל בְּעִירָא וְתִתֵּן יַתְהוֹן לְלֵיוָאֵי נַטְרֵי מַטְרַת מַשְׁכְּנָא דַיְיָ", "pj_en": "but of the half (falling to) the children of Israel thou shalt take one out of fifty of the women, and of the oxen, the asses, and of all the cattle, and give them to the Levites who keep charge of the Lord's tabernacle;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 31, "aliyah": 2, "heb": "וַיַּ֣עַשׂ מֹשֶׁ֔ה וְאֶלְעָזָ֖ר הַכֹּהֵ֑ן כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וַעֲבַד משֶׁה וְאֶלְעָזָר כַּהֲנָא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe and Elozor the <i>kohein<\/i> did as Adonoy commanded Moshe.", "pj": "וַעֲבַד משֶׁה וְאֶלְעָזָר כַּהֲנָא הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "and Mosheh and Elazar the priest did as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 32, "aliyah": 2, "heb": "וַֽיְהִי֙ הַמַּלְק֔וֹחַ יֶ֣תֶר הַבָּ֔ז אֲשֶׁ֥ר בָּזְז֖וּ עַ֣ם הַצָּבָ֑א צֹ֗אן שֵׁשׁ־מֵא֥וֹת אֶ֛לֶף וְשִׁבְעִ֥ים אֶ֖לֶף וַחֲמֵ֥שֶׁת אֲלָפִֽים׃", "onk": "וַהֲוָה דְּבַרְתָּא שְׁאָר בִּזָּא דִּי בְזוֹ עַמָּא דִי <b>נְפָקוּ לְחֵילָא<\/b> עָנָא שִׁית מְאָה וְשַׁבְעִין וְחַמְשָׁא אַלְפִין:", "onk_en": "The spoil was—in addition to the booty that was taken by the [<b>those who served in the<\/b>] army: 675,000", "pj": "וַהֲוָה סְכוּם דְבַרְתָּא שִׁיוּר בִּזְתָא דְבָזוּ עַמָא דִנְפָקוּ לְחֵילָא מִנְיַין עָנָא שִׁית מְאָה וְשׁוּבְעִין וְחַמְשָׁא אַלְפִין", "pj_en": "And the amount of the prey, the rest of the spoil which had been taken by the people who went forth in the host,-the number of the sheep was six hundred and seventy-five thousand;", "tj": "", "tj_en": "", "rashi": "<b>ויהי המלקוח יתר הבז.<\/b> לְפִי שֶׁלֹּא נִצְטַוּוּ לְהָרִים מֶכֶס מִן הַמִּטַּלְטְלִין אֶלָּא מִן הַמַּלְקוֹחַ, כָּתַב אֶת הַלָּשׁוֹן הַזֶּה <b>ויהי המלקוח<\/b>, שֶׁבָּא לִכְלַל חֲלֻקָּה וְלִכְלַל מֶכֶס, שֶׁהָיָה עוֹדֵף עַל בַּז הַמִּטַּלְטְלִין <b>אשר בזזו עם הצבא איש לו<\/b> וְלֹא בָא לִכְלַל חֲלֻקָּה — מִסְפַּר הַצֹּאן וְגוֹ':", "rashi_en": "ויהי המלקוח יתר הבז AND THE PREY, OVER AND ABOVE THE BOOTY … WAS [SIX HUNDRED THOUSAND etc.] — Because they had not been commanded (v. 28) to levy a tribute from the movables but only from the מלקוח (the men and cattle; cf. Rashi on v. 11) it (Scripture) writes this expression: ויהי המלקוח, that which came under the law of being divided (v. 27) and which also came under the law of tribute — which was over and above (יתר) the booty of the movables, אשר בזזו עם הצבא איש לו WHICH THE MEN OF THE HOST HAD PLUNDERED, EACH FOR HIMSELF, and which did not come under the law of being divided, — the number of sheep was etc. (i.e. צאן at the beginning of the second half of the verse means: the number of sheep)."}, {"ch": 31, "v": 33, "aliyah": 2, "heb": "וּבָקָ֕ר שְׁנַ֥יִם וְשִׁבְעִ֖ים אָֽלֶף׃", "onk": "וְתוֹרֵי שַׁבְעִין וּתְרֵין אַלְפִין:", "onk_en": "72,000 cattle,", "pj": "וְתוֹרֵי שׁוּבְעִין וּתְרֵין אַלְפִין", "pj_en": "oxen, seventy-two thousand;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 34, "aliyah": 2, "heb": "וַחֲמֹרִ֕ים אֶחָ֥ד וְשִׁשִּׁ֖ים אָֽלֶף׃", "onk": "וַחֲמָרֵי שִׁתִּין וְחַד אַלְפִין:", "onk_en": "61,000 donkeys,", "pj": "וַחֲמָרֵי שִׁיתִין וְחַד אַלְפִין", "pj_en": "asses, sixty-one thousand; persons,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 35, "aliyah": 2, "heb": "וְנֶ֣פֶשׁ אָדָ֔ם מִ֨ן־הַנָּשִׁ֔ים אֲשֶׁ֥ר לֹֽא־יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר כׇּל־נֶ֕פֶשׁ שְׁנַ֥יִם וּשְׁלֹשִׁ֖ים אָֽלֶף׃", "onk": "וְנַפְשָׁא דֶאֱנָשָׁא מִן נְשַׁיָּא דִּי לָא יְדָעָא מִשְׁכְּבֵי דְכוּרָא כָּל נַפְשָׁתָא תְּלָתִין וּתְרֵין אַלְפִין:", "onk_en": "And the number of women who did not have intimate relations with a man all the souls amounted to 32,000.", "pj": "וְנַפְשַׁת אֵינָשָׁא מִן נְשַׁיָא דְלָא יָדְעוּ תַּשְׁמִישׁ דְכוּרָא כָּל נַפְשָׁתָא תְּלָתִין וּתְרֵין אַלְפִין", "pj_en": "the women who had not known man, all the persons thirty-two thousand.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 36, "aliyah": 2, "heb": "וַתְּהִי֙ הַֽמֶּחֱצָ֔ה חֵ֕לֶק הַיֹּצְאִ֖ים בַּצָּבָ֑א מִסְפַּ֣ר הַצֹּ֗אן שְׁלֹשׁ־מֵא֥וֹת אֶ֙לֶף֙ וּשְׁלֹשִׁ֣ים אֶ֔לֶף וְשִׁבְעַ֥ת אֲלָפִ֖ים וַחֲמֵ֥שׁ מֵאֽוֹת׃", "onk": "וַהֲוַת פַּלְגּוּתָא חוּלַק גֻּבְרַיָּא דִּי נְפָקוּ לְחֵילָא מִנְיַן עָנָא תְּלַת מְאָה וּתְלָתִין וּשְׁבַע אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "The half-portion of those who went in the army, the amount of sheep [was] 337,500", "pj": "וַהֲוַת פַּלְגוּתָא חוּלַק גוּבְרַיָא דִי נְפָקוּ לְחֵילָא סְכוּם עָנָא תְּלַת מְאָה וּתְלָתִין וְשׁוּבְעָא אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "And the half of the portion for the men who had gone to the war, the number of the sheep was three hundred and thirty-seven thousand five hundred;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 37, "aliyah": 2, "heb": "וַיְהִ֛י הַמֶּ֥כֶס לַֽיהֹוָ֖ה מִן־הַצֹּ֑אן שֵׁ֥שׁ מֵא֖וֹת חָמֵ֥שׁ וְשִׁבְעִֽים׃", "onk": "וַהֲוָה נְסִיבָא <b>קֳדָם<\/b> יְיָ מִן עָנָא שִׁית מְאָה שַׁבְעִין וְחָמֵשׁ:", "onk_en": "The tribute to [<b>before<\/b>] Adonoy from the sheep, amounted to 675.", "pj": "וַהֲוַת סְכוּם נְסִיבָא לִשְׁמָא דַיְיָ מִן עָנָא שִׁית מְאָה שׁוּבְעִין וַחֲמֵשׁ", "pj_en": "and the amount of that brought up for the Name of the Lord was of sheep six hundred and seventy-five;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 38, "aliyah": 2, "heb": "וְהַ֨בָּקָ֔ר שִׁשָּׁ֥ה וּשְׁלֹשִׁ֖ים אָ֑לֶף וּמִכְסָ֥ם לַיהֹוָ֖ה שְׁנַ֥יִם וְשִׁבְעִֽים׃", "onk": "וְתוֹרֵי תְּלָתִין וְשִׁתָּא אַלְפִין וּנְסִיבְהוֹן <b>קֳדָם<\/b> יְיָ שַׁבְעִין וּתְרֵין:", "onk_en": "From the 36,000 cattle the tribute to [<b>before<\/b>] Adonoy amounted to 72.", "pj": "וּסְכוּם תּוֹרֵי תְּלָתִין וְשִׁתָּא אַלְפִין וּסְכוּם נְסִיבַתְהוֹן לִשְׁמָא דַיְיָ שׁוּבְעִין וּתְרֵין", "pj_en": "oxen thirty-six thousand, those for the Name of the Lord seventy-two;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 39, "aliyah": 2, "heb": "וַחֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַחֲמֵ֣שׁ מֵא֑וֹת וּמִכְסָ֥ם לַֽיהֹוָ֖ה אֶחָ֥ד וְשִׁשִּֽׁים׃", "onk": "וַחֲמָרֵי תְּלָתִין אַלְפִין וַחֲמֵשׁ מְאָה וּנְסִיבְהוֹן <b>קֳדָם<\/b> יְיָ שִׁתִּין וְחָד:", "onk_en": "From the 30,500 donkeys the tribute to [<b>before<\/b>] Adonoy amounted to 61.", "pj": "וְחַמְרֵי תְּלָתִין אַלְפִין וַחֲמֵשׁ מְאָה וּסְכוּם נְסִיבַתְהוֹן לִשְׁמָא דַיְיָ שִׁתִּין וְחָד", "pj_en": "asses thirty thousand five hundred, for the Name of the Lord sixty-one; persons sixteen thousand, for the Name of the Lord _", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 40, "aliyah": 2, "heb": "וְנֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָ֑לֶף וּמִכְסָם֙ לַֽיהֹוָ֔ה שְׁנַ֥יִם וּשְׁלֹשִׁ֖ים נָֽפֶשׁ׃", "onk": "וְנַפְשָׁא דֶאֱנָשָׁא שִׁתָּא עֲשַׂר אַלְפִין וּנְסִיבְהוֹן <b>קֳדָם<\/b> יְיָ תְּלָתִין וּתְרֵין נַפְשִׁין:", "onk_en": "From the 16,000 people the tribute to [<b>before<\/b>] Adonoy amounted to 32 people.", "pj": "וּבְנַת נְשָׁא שִׁיתְּסַר אַלְפִין וּסְכוּם נְסִיבַתְהוֹן לִשְׁמָא דַיְיָ תְּלָתִין וּתְרֵין נַפְשָׁן", "pj_en": "_ thirty-two.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 41, "aliyah": 2, "heb": "וַיִּתֵּ֣ן מֹשֶׁ֗ה אֶת־מֶ֙כֶס֙ תְּרוּמַ֣ת יְהֹוָ֔ה לְאֶלְעָזָ֖ר הַכֹּהֵ֑ן כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וִיהַב משֶׁה יָת נְסִיב אַפְרָשׁוּתָא <b>קֳדָם<\/b> יְיָ לְאֶלְעָזָר כַּהֲנָא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe gave the tribute as a gift to [<b>before<\/b>] Adonoy, to Elozor the <i>kohein,<\/i> as Adonoy had commanded Moshe.", "pj": "וִיהַב משֶׁה יַת סְכוּם נְסִיבַת אַפְרָשׁוּתָא דַיְיָ לְאֶלְעָזָר כַּהֲנָא הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And Mosheh gave the number separated to the Name of the Lord unto Elazar the priest, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 42, "aliyah": 2, "heb": "וּמִֽמַּחֲצִ֖ית בְּנֵ֣י יִשְׂרָאֵ֑ל אֲשֶׁר֙ חָצָ֣ה מֹשֶׁ֔ה מִן־הָאֲנָשִׁ֖ים הַצֹּבְאִֽים׃", "onk": "וּמִפַּלְגּוּת בְּנֵי יִשְׂרָאֵל דִּי פְּלַג משֶׁה מִן גַּבְרַיָּא דִּי <b>נְפָקוּ לְחֵילָא<\/b>:", "onk_en": "From the half [designated] for Bnei Yisroel that Moshe divided from the men of the [<b>who served in the<\/b>] army:", "pj": "וּמִפַּלְגוּת בְּנֵי יִשְרָאֵל דִי פַלֵיג משֶׁה מִן גוּבְרַיָא דִנְפָקוּ לְחֵילָא", "pj_en": "And the half part for the children of Israel which Mosheh divided from the men's who went forth to the war,", "tj": "", "tj_en": "", "rashi": "<b>וממחצית בני ישראל אשר חצה משה.<\/b> לָעֵדָה, וְהוֹצִיאָהּ לָהֶם <b>מן האנשים הצבאים<\/b>:", "rashi_en": "וממחצית בני ישראל אשר חצה משה AND OF THE CHILDREN OF ISRAEL’S HALF WHICH MOSES DIVIDED among the congregation and which he had taken for them,  מן האנשים הצבאים FROM THE MEN THAT WARRED."}, {"ch": 31, "v": 43, "aliyah": 2, "heb": "וַתְּהִ֛י מֶחֱצַ֥ת הָעֵדָ֖ה מִן־הַצֹּ֑אן שְׁלֹשׁ־מֵא֥וֹת אֶ֙לֶף֙ וּשְׁלֹשִׁ֣ים אֶ֔לֶף שִׁבְעַ֥ת אֲלָפִ֖ים וַחֲמֵ֥שׁ מֵאֽוֹת׃", "onk": "וַהֲוַת פַּלְגּוּת כְּנִשְׁתָּא מִן עָנָא תְּלַת מְאָה וּתְלָתִין וְשַׁבְעָא אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "The community’s half consisted of 337,500 sheep,", "pj": "וַהֲוָה סְכוּם פַּלְגוּת כְּנִשְׁתָּא מִן עָנָא תְּלַת מְאָה וּתְלָתִין וְשׁוּבְעָא אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "the amount was three hundred and thirty-seven thousand five hundred sheep,", "tj": "", "tj_en": "", "rashi": "<b>ותהי מחצת העדה.<\/b> כָּךְ וְכָךְ:", "rashi_en": "ותהי מחצית העדה THE CONGREGATION’S HALF WAS so-and-so in number (as stated in the second half of this verse and in vv. 44—46)."}, {"ch": 31, "v": 44, "aliyah": 2, "heb": "וּבָקָ֕ר שִׁשָּׁ֥ה וּשְׁלֹשִׁ֖ים אָֽלֶף׃", "onk": "וְתוֹרֵי תְּלָתִין וְשִׁתָּא אַלְפִין:", "onk_en": "36,000 cattle,", "pj": "וּסְכוּם תּוֹרֵי תְּלָתִין וְשִׁית אַלְפִין", "pj_en": "thirty-six thousand oxen,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 45, "aliyah": 2, "heb": "וַחֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃", "onk": "וַחֲמָרֵי תְּלָתִין אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "30,500 donkeys,", "pj": "וּסְכוּם חַמְרֵי תְּלָתִין אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "thirty thousand five hundred asses,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 46, "aliyah": 2, "heb": "וְנֶ֣פֶשׁ אָדָ֔ם שִׁשָּׁ֥ה עָשָׂ֖ר אָֽלֶף׃", "onk": "וְנַפְשָׁא דֶאֱנָשָׁא שִׁתָּא עֲשַׂר אַלְפִין:", "onk_en": "and 16,000 people.", "pj": "וּבְנַת נְשָׁא שִׁיתְּסַר אַלְפִין", "pj_en": "and sixteen thousand women.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 47, "aliyah": 2, "heb": "וַיִּקַּ֨ח מֹשֶׁ֜ה מִמַּחֲצִ֣ת בְּנֵֽי־יִשְׂרָאֵ֗ל אֶת־הָֽאָחֻז֙ אֶחָ֣ד מִן־הַחֲמִשִּׁ֔ים מִן־הָאָדָ֖ם וּמִן־הַבְּהֵמָ֑ה וַיִּתֵּ֨ן אֹתָ֜ם לַלְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֙רֶת֙ מִשְׁכַּ֣ן יְהֹוָ֔ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וּנְסִיב משֶׁה מִפַּלְגּוּת בְּנֵי יִשְׂרָאֵל יָת דְּאִתַּחַד חַד מִן חַמְשִׁין מִן אֱנָשָׁא וּמִן בְּעִירָא וִיהַב יָתְהוֹן לְלֵוָאֵי נָטְרֵי מַטְּרַת מַשְׁכְּנָא דַיְיָ כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe took from Bnei Yisroel’s half, one part out of the fifty, from the people and from the animals, and gave them to the Levites who are entrusted with the <i>Mishkon<\/i> of Adonoy; as Adonoy had commanded Moshe.", "pj": "וּנְסֵיב משֶׁה מִפַּלְגוּת בְּנֵי יִשְרָאֵל יַת דְמִיתָחַד חַד מִן חַמְשִׁין מִן בְּנַת נְשָׁא וּמִן בְּעִירָא וִיהַב יַתְהוֹן לְלֵיוָאֵי נַטְרֵי מַטְרַת מַשְׁכְּנָא דַיְיָ הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And Mosheh took from the half part for the children of Israel of that which had been captured, one out of fifty, whether of man or beast, and gave it to the Levites who kept charge of the tabernacle of the Lord, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויקח משה וגו'.<\/b>", "rashi_en": "ויקח משה וגו׳ AND MOSES TOOK [FROM THIS HALF OF THE CHILDREN OF ISRAEL ONE PART OUT OF EACH FIFTY] etc. "}, {"ch": 31, "v": 48, "aliyah": 2, "heb": "וַֽיִּקְרְבוּ֙ אֶל־מֹשֶׁ֔ה הַפְּקֻדִ֕ים אֲשֶׁ֖ר לְאַלְפֵ֣י הַצָּבָ֑א שָׂרֵ֥י הָאֲלָפִ֖ים וְשָׂרֵ֥י הַמֵּאֽוֹת׃", "onk": "וְקָרִיבוּ לְוָת משֶׁה דִּי מְמַנַּן עַל אַלְפֵי חֵילָא רַבָּנֵי אַלְפִין וְרַבָּנֵי מָאֲוָתָא:", "onk_en": "The army officers approached Moshe—the officers who were over divisions of the thousands and the officers of the thousands, and the officers of the hundreds.", "pj": "וְקָרִיבוּ לְוַת משֶׁה אִסְטַרְטִיגִין דִמְמַנָן עַל אַלְפֵי חֵילָא רַבָּנֵי אַלְפִין וְרַבָּנֵי מַאֲוָתָא", "pj_en": "And the officers who had been appointed over the thousands of the host, the captains of thousands and of hundreds, drew near to Mosheh,", "tj": "", "tj_en": "", "rashi": "<b>הפקדים.<\/b> הַמְמֻנִּים:", "rashi_en": "הפקדים means THOSE WHO WERE APPOINTED (not those who were counted, as e.g. in Numbers  3:39)."}, {"ch": 31, "v": 49, "aliyah": 2, "heb": "וַיֹּֽאמְרוּ֙ אֶל־מֹשֶׁ֔ה עֲבָדֶ֣יךָ נָֽשְׂא֗וּ אֶת־רֹ֛אשׁ אַנְשֵׁ֥י הַמִּלְחָמָ֖ה אֲשֶׁ֣ר בְּיָדֵ֑נוּ וְלֹא־נִפְקַ֥ד מִמֶּ֖נּוּ אִֽישׁ׃", "onk": "וַאֲמָרוּ לְמשֶׁה עַבְדָּיךְ קַבִּילוּ יָת חֻשְׁבַּן גַּבְרֵי מְגִיחֵי קְרָבָא <b>דִּי עִמָּנָא<\/b> וְלָא שְׁגָא מִנָּנָא אֱנָשׁ:", "onk_en": "And they said to Moshe: “Your servants have taken a census of the soldiers who went out to war [<b>who are with us<\/b>] and not one of us is missing.", "pj": "וַאֲמָרוּ לְמשֶׁה עַבְדָךְ קַבִּילוּ יַת סְכוּם גוּבְרֵי מַגִיחֵי קְרָבָא דִי עִמָנָא וְלָא שָׁגָא מִינָנָא אֵינַשׁ", "pj_en": "and they said to Mosheh, Thy servants have taken the account of the men of war who have been with us, and not any of them are wanting.", "tj": "", "tj_en": "", "rashi": "<b>ולא נפקד.<\/b> לֹא נֶחְסַר, וְתַרְגּוּמוֹ \"לָא שְׁגָא\", אַף הוּא בִּלְשׁוֹן אֲרַמִי חִסָּרוֹן, כְּמוֹ \"אָנֹכִי אֲחַטֶּנָּה\" (בראשית ל\"א) תַרְגּוּמוֹ \"דַּהֲוַת שָׁגְיָא מִמִּנְיָנָא\", וְכֵן \"כִּי יִפָּקֵד מוֹשָׁבֶךָ\" (שמואל א כ') — יֶחְסַר מְקוֹם מוֹשָׁבְךָ, אִישׁ הָרָגִיל לֵישֵׁב שָׁם, וְכֵן \"וַיִּפָּקֵד מְקוֹם דָּוִד\" (שם) — נֶחְסַר מְקוֹמוֹ וְאֵין אִישׁ יוֹשֵׁב שָׁם:", "rashi_en": "ולא נפקד means THERE IS NOT LACKING. Its translation in the Targum is לא שגא which, too, in the Aramaic language means “lacking”, just as the words (Genesis 31:39) אנכי אחטנה “I will make good the shortage”, are translated in the Targum by דהות שגיא ממנינא that which was lacking of the number (cf. Rashi on that verse), and so, too, is (I Samuel 20:18) “For thy seat יִפָּקֵד”, i.e., the place where you sat will lack the man who usually sat there. And similar is (I Samuel 20:15) “וַיִפָּקֵד the place of David” — his place lacked, and no man sat there."}, {"ch": 31, "v": 50, "aliyah": 2, "heb": "וַנַּקְרֵ֞ב אֶת־קׇרְבַּ֣ן יְהֹוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי־זָהָב֙ אֶצְעָדָ֣ה וְצָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְכוּמָ֑ז לְכַפֵּ֥ר עַל־נַפְשֹׁתֵ֖ינוּ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְקָרֶבְנָא יָת קוּרְבָּנָא דַיְיָ גְּבַר דְּאַשְׁכַּח מַאן דִּדְהָב שִׁירִין וְשִׁבְּכִין עִזְקָן קַדָּשִׁין וּמָחוֹךְ לְכַפָּרָא עַל נַפְשָׁתָנָא קֳדָם יְיָ:", "onk_en": "We have therefore brought an offering for Adonoy. Any man who found a gold article—an anklet, or a bracelet, a ring, earring or clasp [has dedicated it for Adonoy] to atone for ourselves before Adonoy.”", "pj": "וְקָרִיבְנָא דוֹרוֹנָא לִשְׁמָא דַיְיָ כֵּיוַן דְמָסַר יְיָ יַת מִדְיָנָאֵי בִידֵינָן וּכְבַשְׁנָן יַת אַרְעֲהוֹן וְיַת מְדִינַתְהוֹן וַהֲוֵינָן עַיְילִין לִטְרַקְלִינֵיהוֹן וְחַמְיַין בְּנָתֵיהוֹן יָאֲתָא חַטְיָיתָא מְפַרְנְקָתָא וְכָל גְבַר דַהֲוָה מַשְׁכַּח עֲלֵיהוֹן מָאנִין דִדְהַב הֲוָה שָׁרֵי כְּלִילַיָא מִן רֵישֵׁיהוֹן קַדִישַׁיָא מִן אוּדְנֵיהוֹן קַטְלַיָא מִן צַוְורֵיהוֹן שִׁירַיָא מִן אֶדְרָעֵיהוֹן עִזְקָתָא מִן אֶצְבְּעָתֵיהוֹן מְחוּכְיָא מִבֵּית חַדְיֵיהוֹן וּבְכָל דָא חַס לָן לְמִיתְלֵי עֵינָן בָּן וְלָא אִסְתַּכְּלוּן בַּחֲדָא מִנְהוֹן דְלָא לִמְחַיְיבָא בַּחֲדָא מִנְהוֹן וְלָא נְמוּת בְּמִתוּתָא דְמַיְיתוּן בָּהּ רַשִׁיעַיָא לְעַלְמָא דְאָתֵי וְדָא יַידְכַּר לָן לְיוֹם דִינָא רַבָּא לִמְכַפְּרָא עַל נַפְשָׁתָן קֳדָם יְיָ", "pj_en": "And we have brought a gift unto the Name of the Lord, forasmuch as the Lord hath delivered the Midianites into our hands, and we have been able to subdue their land and their cities. And we entered into their chambers, and there saw their daughters, fair, tender, and delicate; and every man who found on them jewels of gold, loosened the coronets from their heads, the earrings from their ears, the necklaces from their necks, the bracelets from their arms, the rings from their fingers, and the brooches from their bosoms;-but in all this we abstained from lifting our eyes upon themselves, or gazing on one of them, lest we should sin with any one of them, and die the death which the wicked die in the world to come. And may this be had in memorial for us in the day of the great judgment, to make propitiation for our souls before the Lord.", "tj": "וְקָרִיבְנָן יַת קוּרְבָּנָא דַיְיָ כַּד הֲוֵינָן עָלִין בְּבָתֵּיהוֹן דְמַלְכַיָא מִדְיָנָאֵי וּבְקִיטוּנֵי מְדַמְכְהוֹן וַהֲוֵינָן חַמְיַין תַּמָן בְּנָתֵיהוֹן דְמַלְכַיָא מִדְיָנָאֵי יָאֲיָין וּמְפַרְנְקָתָא וַהֲוֵינָן נַסְבִין מִנְהוֹן קוּרַיָא דְדַהֲבָא מִן רֵישֵׁיהוֹן וְקַדְשַׁיָא מֵאוּדְנְהוֹן וְעִזְקַיָא מֵאֶצְבְּעָתָא וְעִקְלַיָא מֵאֶזְרָעֵיהוֹן וּמְעוֹכַיָא מִן בֵּית חֲדֵיהוֹן חַס לָן משֶׁה רַבָּן לָא אִסְתַּכֵּל חָד מִינָן בַּחֲדָא מִנְהוֹן וְלָא אִתְיַחַד חַד מִינָן בַּחֲדָא מִנְהוֹן דְלָא נֶהֱוֵי שׁוּתָּף עִמָהּ בְּגֵיהִנָם לְעַלְמָא דְאָתֵי הִיא תְקוּם לָן בְּיוֹם דִינָא רַבָּא לְכַפָּרָא עַל נַפְשָׁתָנָא קֳדָם יְיָ:", "tj_en": "And we have brought the oblation of the Lord. When we entered into the houses of the Midianite kings, and into their sleeping-chambers, and saw there the fair and delicate daughters of the Midianite kings, we took from their beads their golden coronets, the earrings from their ears, the rings from their fingers, the bracelets from their arms, and the jewels from their bosoms; yet, Mosheh our master! far was it from us, not one of us was united with any one of them, neither will he be companion with her in Gehinnom. In the world to come may it stand to us, in the day of the great judgment, to propitiate for our souls before the Lord.", "rashi": "<b>אצעדה.<\/b> אֵלּוּ צְמִידִים שֶׁל רֶגֶל:<br><br><b>וצמיד.<\/b> שֶׁל יָד:<br><br><b>עגיל.<\/b> נִזְמֵי אֹזֶן:<br><br><b>וכומז.<\/b> דְּפוּס שֶׁל בֵּית הָרֶחֶם, לְכַפֵּר הִרְהוּר הַלֵּב שֶׁל בְּנוֹת מִדְיָן (שבת ס\"ד):", "rashi_en": "אצעדה — These are BANDS FOR THE FOOT (anklets).<br><br>וצמיד are BANDS FOR THE HAND (bracelets).<br><br>עגיל are EARRINGS.<br><br>וכומז is an ornament in the form of the womb — to atone for the thoughts their hearts had entertained for the daughters of Midian (Shabbat 64a)."}, {"ch": 31, "v": 51, "aliyah": 2, "heb": "וַיִּקַּ֨ח מֹשֶׁ֜ה וְאֶלְעָזָ֧ר הַכֹּהֵ֛ן אֶת־הַזָּהָ֖ב מֵֽאִתָּ֑ם כֹּ֖ל כְּלִ֥י מַעֲשֶֽׂה׃", "onk": "וּנְסִיב משֶׁה וְאֶלְעָזָר כַּהֲנָא יָת דַּהֲבָא מִנְּהוֹן כָּל מַאן דְּעוֹבָדָא:", "onk_en": "Moshe and Elozor the <i>kohein<\/i> took the gold from them, every fashioned article.", "pj": "וּנְסֵיב משֶׁה וְאֶלְעָזָר כַּהֲנָא יַת דַהֲבָא מִנְהוֹן כָּל מָאן דְעוּבְדָא", "pj_en": "And Mosheh and Elazar the priest took the gold from them, every article fabricated;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 52, "aliyah": 2, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> כׇּל־זְהַ֣ב הַתְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֙ימוּ֙ לַֽיהֹוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע־מֵא֥וֹת וַחֲמִשִּׁ֖ים שָׁ֑קֶל מֵאֵת֙ שָׂרֵ֣י הָֽאֲלָפִ֔ים וּמֵאֵ֖ת שָׂרֵ֥י הַמֵּאֽוֹת׃", "onk": "וַהֲוָה כָּל דְּהַב אַפְרָשׁוּתָא דִּי אַפְרִישׁוּ קֳדָם יְיָ שִׁתָּא עֲשַׂר אַלְפִין שְׁבַע מְאָה וְחַמְשִׁין סִלְעִין מִן רַבָּנֵי אַלְפִין וּמִן רַבָּנֵי מָאֲוָתָא:", "onk_en": "All the gold of the offering that they set apart for Adonoy was 16,750 <i>shekolim,<\/i> from the officers who were over divisions of the thousands and from the officers who were over divisions of the hundreds.", "pj": "וַהֲוָה סְכוּם כָּל דְהַב אַפְרָשׁוּתָא דְאַפְרָשׁוּ לִשְׁמָא דַיְיָ שִׁיתְּסַר אַלְפִין וּשְׁבַע מְאָה וְחַמְשִׁין סַלְעִין מִן רַבָּנֵי אַלְפִין וּמִן רַבָּנֵי מַאֲוָותָא", "pj_en": "and the sum of all the gold of the separation which they had separated unto the Name of the Lord was sixteen thousand seven hundred and fifty shekels, from the captains of thousands and of hundreds.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 53, "aliyah": 2, "heb": "אַנְשֵׁי֙ הַצָּבָ֔א בָּזְז֖וּ אִ֥ישׁ לֽוֹ׃", "onk": "גַּבְרֵי דְּחֵילָא בָּזוּ גְּבַר לְנַפְשֵׁיהּ:", "onk_en": "The men of war, took booty for themselves.", "pj": "גוּבְרִין דְחֵילָא בְּזָזוּ גְבַר לְנַפְשֵׁיהּ", "pj_en": "For the men of the host had taken spoil, every man for himself.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 54, "aliyah": 2, "heb": "וַיִּקַּ֨ח מֹשֶׁ֜ה וְאֶלְעָזָ֤ר הַכֹּהֵן֙ אֶת־הַזָּהָ֔ב מֵאֵ֛ת שָׂרֵ֥י הָאֲלָפִ֖ים וְהַמֵּא֑וֹת וַיָּבִ֤אוּ אֹתוֹ֙ אֶל־אֹ֣הֶל מוֹעֵ֔ד זִכָּר֥וֹן לִבְנֵֽי־יִשְׂרָאֵ֖ל לִפְנֵ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּנְסִיב משֶׁה וְאֶלְעָזָר כַּהֲנָא יָת דַּהֲבָא מִן רַבָּנֵי אַלְפִין וּמָאֲוָתָא וְאַיְתִיאוּ יָתֵיהּ לְמַשְׁכַּן זִמְנָא דָּכְרָנָא לִבְנֵי יִשְׂרָאֵל קֳדָם יְיָ:", "onk_en": "Moshe and Elozor the <i>kohein<\/i> took the gold from the officers who were over divisions of the thousands and the hundreds, and they brought it to the Tent of Meeting as a remembrance for Bnei Yisroel before Adonoy.", "pj": "וּנְסֵיב משֶׁה וְאֶלְעָזָר כַּהֲנָא יַת דַהֲבָא מִן רַבָּנֵי אַלְפִין וּמַאֲוָותָא וְאַיְתִיאוּ יָתֵיהּ לְמַשְׁכַּן זִמְנָא דוּכְרָנָא טָבָא לִבְנֵי יִשְרָאֵל קֳדָם יְיָ", "pj_en": "And Mosheh and Elazar the priest took the gold from the captains of thousands and of hundreds, and brought it into the tabernacle of ordinance, a good memorial of the sons of Israel before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 1, "aliyah": 3, "heb": "וּמִקְנֶ֣ה&thinsp;<b>׀<\/b> רַ֗ב הָיָ֞ה לִבְנֵ֧י רְאוּבֵ֛ן וְלִבְנֵי־גָ֖ד עָצ֣וּם מְאֹ֑ד וַיִּרְא֞וּ אֶת־אֶ֤רֶץ יַעְזֵר֙ וְאֶת־אֶ֣רֶץ גִּלְעָ֔ד וְהִנֵּ֥ה הַמָּק֖וֹם מְק֥וֹם מִקְנֶֽה׃", "onk": "וּבְעִיר סַגִּי הֲוָה לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד תַּקִּיף לַחֲדָא וַחֲזוֹ יָת אֲרַע יַעְזֵר וְיָת אֲרַע גִּלְעָד וְהָא אַתְרָא אֲתַר <b>כְּשַׁר<\/b> לְבֵית בְּעִיר:", "onk_en": "Very large herds belonged to the children (tribes) of Reuvein and Gad—[an] extremely large [number]; and they saw the land of Ya’zeir and the land of Gilad, and behold, the region was an area [<b>suited<\/b>] for livestock.", "pj": "וּבְעִירֵי סַגְיָא הֲווֹן לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד תַּקִיף לַחֲדָא וְחָמוּן יַת אַרְעָא דְמִכְוַור וְיַת אֲרַע גִלְעָד וְהָא אַתְרָא אֲתַר כָּשַׁר לְבֵית בְּעִיר", "pj_en": "Now the sons of Reuben and of Gad possessed much cattle, exceeding much: and they surveyed the land of Mikvar and of Gilead, and, behold, it was a region suitable for cattle folds.", "tj": "וְחָמוֹן יַת אַרְעָא דְמִכְוַור וְיַת אַרְעָא דְגִלְעָד וְהָא אַתְרָא אֲתַר דְנִכְסִין הוּא:", "tj_en": "And they saw the land of Mikvar and of Gilead, and, behold, it was a place of wealth.", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 2, "aliyah": 3, "heb": "וַיָּבֹ֥אוּ בְנֵֽי־גָ֖ד וּבְנֵ֣י רְאוּבֵ֑ן וַיֹּאמְר֤וּ אֶל־מֹשֶׁה֙ וְאֶל־אֶלְעָזָ֣ר הַכֹּהֵ֔ן וְאֶל־נְשִׂיאֵ֥י הָעֵדָ֖ה לֵאמֹֽר׃", "onk": "וַאֲתוֹ בְנֵי גָד וּבְנֵי רְאוּבֵן וַאֲמָרוּ לְמשֶׁה וּלְאֶלְעָזָר כַּהֲנָא וּלְרַבְרְבֵי כְּנִשְׁתָּא לְמֵימָר:", "onk_en": "The tribes of Reuvein and Gad came and spoke to Moshe and to Elozor the <i>kohein,<\/i> and to the princes of the community, saying:", "pj": "וַאֲתוֹ בְנֵי גָד וּבְנֵי רְאוּבֵן וַאֲמָרוּ לְמשֶׁה וּלְאֶלְעָזָר כַּהֲנָא וּלְרַבְרְבֵי כְּנִישְׁתָּא לְמֵימָר", "pj_en": "And the sons of Gad and Reuben came and spoke to Mosheh, Elazar, and the princes of the congregation, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 3, "aliyah": 3, "heb": "עֲטָר֤וֹת וְדִיבֹן֙ וְיַעְזֵ֣ר וְנִמְרָ֔ה וְחֶשְׁבּ֖וֹן וְאֶלְעָלֵ֑ה וּשְׂבָ֥ם וּנְב֖וֹ וּבְעֹֽן׃", "onk": "<b>מַכְלֶלְתָּא וּמַלְבֶּשְׁתָּא וְכוּמְרִין וּבֵית נִמְרִין וּבֵית חוּשְׁבָּנָא וּבַעֲלֵי דְבָבָא וְכִימָא וְסִיעַת בֵּית קְבֻרְתָּא דְמשֶׁה<\/b> וּבְעוֹן:", "onk_en": "“Ataros, Divon, Ya’zeir, [<b>Machlelta and Malbeshta and Kumrin,<\/b>] Nimrah [<b>Beis Nimrin<\/b>], Cheshbon [<b>Beis Chushbana<\/b>], Elalei [<b>Baalei Debaba<\/b>], Sevam [<b>Kima<\/b>], Nevo [<b>Moshe’s burial place<\/b>] and Be’on,", "pj": "מַכְלֶלְתָּא וּמַדְבֶּשְׁתָּא מַכְוַור וּבֵית נִמְרֵי וּבֵית חוּשְׁבָּנֵי מַעֲלַת מְרָא שִׁירַן וּבֵית קְבוּרְתֵּיהּ דְמשֶׁה וּבְעוֹן", "pj_en": "Makelta, Madbeshta, Mikvar, Beth Nimre, Beth Hoshbane, Maalath Meda, Shiran, Beth Kebureth, de Moshe, and Behon,", "tj": "מַכְלֶלְתָּא מַדְבֶּשְׁתָּא וּמַכְוַור וּבֵית נִמְרִין וְחֶשְׁבּוֹן וְאֶלְעָלֵה וּשְבָם וּנְבוֹ וּבְעָן:", "tj_en": "Makalta, Madbeshta, Mikvar, Beth Nimrin, Heshbon, Elhala, Shebam, Nebo, and Behan,", "rashi": "<b>עטרות ודיבן וגו'.<\/b> מֵאֶרֶץ סִיחוֹן וְעוֹג הָיוּ:", "rashi_en": "עטרות ודיבון וגו׳ ATOROTH AND DIBON etc. — These belonged to the land of Sihon and Og."}, {"ch": 32, "v": 4, "aliyah": 3, "heb": "הָאָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהֹוָה֙ לִפְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְלַֽעֲבָדֶ֖יךָ מִקְנֶֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אַרְעָא דִּי מְחָא יְיָ יָת יָתְבָהָא קֳדָם כְּנִשְׁתָּא דְיִשְׂרָאֵל אֲרַע <b>כָּשְׁרָא<\/b> לְבֵית בְּעִיר הִיא וּלְעַבְדָּיךְ אִית בְּעִיר:", "onk_en": "the land that Adonoy struck down [<b>its inhabitants<\/b>] before Bnei Yisroel, is an area [<b>suited<\/b>] for livestock; and your servants have livestock.”", "pj": "אַרְעָא דְכָבַשׁ יְיָ וּמְחָא יַתְבָהָא קֳדָם כְּנִישְׁתָּא דְיִשְרָאֵל אֲרַע כָּשַׁר לְבֵית בְּעִיר הִיא וּלְעַבְדָךְ אִית בְּעִיר", "pj_en": "the land which the Lord hath subdued, and whose inhabitants he hath smitten before the congregation of Israel, is a land suitable for cattle, and thy servants have cattle.", "tj": "מקנה נִכְסִין:", "tj_en": "Wealth.", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 5, "aliyah": 3, "heb": "וַיֹּאמְר֗וּ אִם־מָצָ֤אנוּ חֵן֙ בְּעֵינֶ֔יךָ יֻתַּ֞ן אֶת־הָאָ֧רֶץ הַזֹּ֛את לַעֲבָדֶ֖יךָ לַאֲחֻזָּ֑ה אַל־תַּעֲבִרֵ֖נוּ אֶת־הַיַּרְדֵּֽן׃", "onk": "וַאֲמָרוּ אִם אַשְׁכַחְנָא רַחֲמִין בְּעֵינָיךְ תִּתְיְהִיב יָת אַרְעָא הָדָא לְעַבְדָּיךְ לְאַחֲסָנָא לָא תְעַבְרִנָּנָא יָת יַרְדְּנָא:", "onk_en": "They said: “If we have found favor in your eyes, let this land be given to your servants as a possession. Do not bring us over the Yardein.”", "pj": "וַאֲמָרוּ אִין אַשְׁכַּחְנָא רַחֲמִין קֳדָמָךְ תִּתְיְהַב אַרְעָא הֲדָא לְעַבְדָךְ לְאַחְסָנָא לָא תַעַבְרִינָנָא יַת יוֹרְדָנָא", "pj_en": "They said therefore, If we have found grace before thee, let this land be given to thy servants for a possession, and let us not pass over Jordan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 6, "aliyah": 3, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה לִבְנֵי־גָ֖ד וְלִבְנֵ֣י רְאוּבֵ֑ן הַאַֽחֵיכֶ֗ם יָבֹ֙אוּ֙ לַמִּלְחָמָ֔ה וְאַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה׃", "onk": "וַאֲמַר משֶׁה לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן הַאֲחֵיכוֹן יֵעֲלוּן לִקְרָבָא וְאַתּוּן תֵּיתְבוּן הָכָא:", "onk_en": "Moshe said to the children (tribes) of Gad and Reuvein: “Should your brothers go out to war while you settle here?", "pj": "וַאֲמַר משֶׁה לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן הַאֲחֵיכוֹן יֵיתוּן לִקְרָבָא וְאַתּוּן תֵּיתְבוּן הָכָא", "pj_en": "But Mosheh said to the sons of Gad and Reuben, Shall your brethren go to the war, and you sit down here?", "tj": "", "tj_en": "", "rashi": "<b>האחיכם.<\/b> לְשׁוֹן תְּמִיהָה הוּא:", "rashi_en": "האחיכם SHALL YOUR BRETHREN — This denotes a question. (i.e., the ה prefixed is the interrogative particle)."}, {"ch": 32, "v": 7, "aliyah": 3, "heb": "וְלָ֣מָּה <span class=\"mam-kq\"><span class=\"mam-kq-k\">(תנואון)<\/span> <span class=\"mam-kq-q\">[תְנִיא֔וּן]<\/span><\/span> אֶת־לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽעֲבֹר֙ אֶל־הָאָ֔רֶץ אֲשֶׁר־נָתַ֥ן לָהֶ֖ם יְהֹוָֽה׃", "onk": "וּלְמָא תוֹנוּן יָת לִבָּא דִבְנֵי יִשְׂרָאֵל מִלְּמֶעְבַּר לְאַרְעָא דִּיהַב לְהוֹן יְיָ:", "onk_en": "Why do you dishearten Bnei Yisroel from crossing over to the land that Adonoy has given them?", "pj": "וּלְמָא תְבַטְלוּן רַעֲוַת בְּנֵי יִשְרָאֵל מִלְמֵעִיבַּר לְאַרְעָא דִיהַב לְהוֹן יְיָ", "pj_en": "And why should you enfeeble the will of the sons of Israel from going over to the land which the Lord hath given to them?", "tj": "וּלְמָא תִּתְבְּרוּן:", "tj_en": "And why do you break?", "rashi": "<b>ולמה תניאון.<\/b> תָּסִירוּ וְתַמְנִיעוּ לִבָּם מֵעֲבֹר, שֶׁיִּהְיוּ סְבוּרִים שֶׁאַתֶּם יְרֵאִים לַעֲבֹר מִפְּנֵי הַמִּלְחָמָה וְחֹזֶק הֶעָרִים וְהָעָם:", "rashi_en": "ולמה תניאון means AND WHY WILL YE TURN ASIDE AND WITHHOLD their heart from passing over? — because they will think that you are afraid to pass over on account of the prospect of war and the strength of the cities and the peoples."}, {"ch": 32, "v": 8, "aliyah": 3, "heb": "כֹּ֥ה עָשׂ֖וּ אֲבֹתֵיכֶ֑ם בְּשׇׁלְחִ֥י אֹתָ֛ם מִקָּדֵ֥שׁ בַּרְנֵ֖עַ לִרְא֥וֹת אֶת־הָאָֽרֶץ׃", "onk": "כְּדֵין עֲבָדוּ אֲבָהַתְכוֹן כַּד שְׁלָחִית יָתְהוֹן <b>מֵרְקַם גֵּיאָה<\/b> לְמֶחֱזֵי יָת אַרְעָא:", "onk_en": "This is what your fathers did when I sent them from Kadeish Barnei’a [<b>Rekam Geyah<\/b>] to look at the land.", "pj": "הֵיכְדֵין עָבָדוּ אַבְהַתְכוֹן כַּד שְׁלָחִית יַתְהוֹן מֵרְקָם גֵיאָה לְמֶיחֱמֵי יַת אַרְעָא", "pj_en": "So did your fathers when I sent them from Rekem Giah to survey the land:", "tj": "", "tj_en": "", "rashi": "<b>מקדש ברנע.<\/b> כָּךְ שְׁמָהּ, וּשְׁתֵּי קָדֵשׁ הָיוּ:", "rashi_en": "מקדש ברנע FROM KADESH-BARNEA — this was its name. There were two places called Kadesh (therefore this one is distinguished from the other by being called Kadesh-Barnea)."}, {"ch": 32, "v": 9, "aliyah": 3, "heb": "וַֽיַּעֲל֞וּ עַד־נַ֣חַל אֶשְׁכּ֗וֹל וַיִּרְאוּ֙ אֶת־הָאָ֔רֶץ וַיָּנִ֕יאוּ אֶת־לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְבִלְתִּי־בֹא֙ אֶל־הָאָ֔רֶץ אֲשֶׁר־נָתַ֥ן לָהֶ֖ם יְהֹוָֽה׃", "onk": "וּסְלִיקוּ עַד נַחְלָא דְאִתְכָּלָא וַחֲזוֹ יָת אַרְעָא וְאוֹנִיאוּ יָת לִבָּא דִּבְנֵי יִשְׂרָאֵל <b>בְּדִיל דְּלָא לְמֵעַל<\/b> לְאַרְעָא דִּיהַב לְהוֹן יְיָ:", "onk_en": "They went up to Nachal Eshkol and saw the land. They then disheartened Bnei Yisroel from coming [<b>so as not to go up<\/b>] into the land that Adonoy has given them.", "pj": "וּסְלִיקוּ עַד נַחֲלָא דְאִתְכְּלָא וַחֲמוּן יַת אַרְעָא וּבְטִילוּ רְעוּת לִבָּא דְיִשְרָאֵל בְּגִין דְלָא לְמֵיעַל לְאַרְעָא דִיהַב לְהוֹן יְיָ", "pj_en": "they went up to the brook of Ethkela, and saw the land, but enfeebled the will of Israel's heart, that they would not enter into the land which the Lord had given to them.", "tj": "וּסְלִיקוּ עַד סְגוֹלָה וַחֲמוֹן יַת אַרְעָא:", "tj_en": "They went unto Segola, and saw the land.", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 10, "aliyah": 3, "heb": "וַיִּֽחַר־אַ֥ף יְהֹוָ֖ה בַּיּ֣וֹם הַה֑וּא וַיִּשָּׁבַ֖ע לֵאמֹֽר׃", "onk": "וּתְקֵף רוּגְזָא דַיְיָ בְּיוֹמָא הַהוּא וְקַיֵּים לְמֵימָר:", "onk_en": "Adonoy displayed His anger on that day and He swore, saying:", "pj": "וּתְקֵיף רוּגְזָא דַיְיָ בְּיוֹמָא הַהוּא וְקַיֵים לְמֵימָר", "pj_en": "And the anger of the Lord was that day moved, and He sware, saying", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 11, "aliyah": 3, "heb": "אִם־יִרְא֨וּ הָאֲנָשִׁ֜ים הָעֹלִ֣ים מִמִּצְרַ֗יִם מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה אֵ֚ת הָאֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְאַבְרָהָ֥ם לְיִצְחָ֖ק וּֽלְיַעֲקֹ֑ב כִּ֥י לֹא־מִלְא֖וּ אַחֲרָֽי׃", "onk": "אִם יֶחֱזוּן גֻּבְרַיָּא דִּסְלִיקוּ מִמִּצְרַיִם מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא יָת אַרְעָא דִּי קַיֵּמִית לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב אֲרֵי לָא אַשְׁלִימוּ בָּתַר <b>דַּחַלְתִּי<\/b>:", "onk_en": "’None of the men who came up from Egypt will see—those who are twenty years and above—the land that I swore to Avraham, Yitzchok and Yaakov, for they did not follow Me fully [<b>fear Me<\/b>].", "pj": "אִין יֶחֱמוּן גוּבְרַיָא דִסְלִיקוּ מִמִצְרַיִם מִבַּר עֶשְרִין שְׁנִין וּלְעֵילָא יַת אַרְעָא דְקַיֵימִית לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב אֲרוּם לָא שְׁלִימוּ בָּתַר דַחַלְתִּי", "pj_en": "If these men who came out of Mizraim from twenty years old and upward shall see the land which I covenanted to Abraham, Izhak, and Jakob, because they have not fully (walked) according to My fear;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 12, "aliyah": 3, "heb": "בִּלְתִּ֞י כָּלֵ֤ב בֶּן־יְפֻנֶּה֙ הַקְּנִזִּ֔י וִיהוֹשֻׁ֖עַ בִּן־נ֑וּן כִּ֥י מִלְא֖וּ אַחֲרֵ֥י יְהֹוָֽה׃", "onk": "אֱלָהֵן כָּלֵב בַּר יְפֻנֶּה קְנִזָּאָה וִיהוֹשֻׁעַ בַּר נוּן אֲרֵי אַשְׁלִימוּ בָּתַר <b>דַּחַלְתָּא<\/b> דַיְיָ:", "onk_en": "Except for Kaleiv, son of Yefuneh, the Kenizite, and Yehoshua, son of Nun, because they followed [<b>the fear of<\/b>] Adonoy fully.’", "pj": "אֱלָהֵן כָּלֵב בַּר יְפוּנֶה קְנִיזָאָה וִיהוֹשֻׁעַ בַּר נוּן אֲרוּם שְׁלִימוּ בָּתַר דַחַלְתָּא דַיְיָ", "pj_en": "except Kaleb bar Jephunneh the Kenezite, and Jehoshua bar Nun, for they have fully (walked) after the fear of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>הקנזי.<\/b> חוֹרְגוֹ שֶׁל קְנַז הָיָה וְיָלְדָה לוֹ אִמּוֹ שֶׁל כָּלֵב אֶת עָתְנִיאֵל (סוטה י\"א):", "rashi_en": "הקנזי [CALEB THE SON OF JEPHUNNEH] THE KENEZITE — He (Caleb) was the stepson of Kenaz (and therefore he is termed here the Kenezite), and Caleb's mother bore Othniel to him (to Kenaz) (and for this reason Othniel, the son of Kenaz is described in Joshua 15:17 as Caleb’s brother) (Sotah 11b)."}, {"ch": 32, "v": 13, "aliyah": 3, "heb": "וַיִּֽחַר־אַ֤ף יְהֹוָה֙ בְּיִשְׂרָאֵ֔ל וַיְנִעֵם֙ בַּמִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד־תֹּם֙ כׇּל־הַדּ֔וֹר הָעֹשֶׂ֥ה הָרַ֖ע בְּעֵינֵ֥י יְהֹוָֽה׃", "onk": "וּתְקֵף רוּגְזָא דַיְיָ בְּיִשְׂרָאֵל וְטָרְדִנּוּן בְּמַדְבְּרָא אַרְבְּעִין שְׁנִין עַד דְּסַף כָּל דָּרָא דַּעֲבִיד דְּבִישׁ <b>קֳדָם<\/b> יְיָ:", "onk_en": "Adonoy displayed anger against Yisroel and He made them wander in the wilderness for forty years, until the end (death) of the entire generation that had done evil in the eyes of [<b>before<\/b>] Adonoy.", "pj": "וּתְקֵיף רוּגְזָא דַיְיָ בְּיִשְרָאֵל וְטַלְטְלִינוּן בְּמַדְבְּרָא אַרְבְּעִין שְׁנִין עַד דְסַף כָּל דָרָא דְעָבַד דְבִישׁ קֳדָם יְיָ", "pj_en": "And the anger of the Lord was moved against Israel, and He made them wander in the wilderness forty years, until all that generation which did evil before the Lord have been consumed.", "tj": "", "tj_en": "", "rashi": "<b>וינעם.<\/b> וַיְטַלְטְלֵם, מִן \"נָע וָנָד\" (בראשית ד):", "rashi_en": "וינעם means, AND HE MOVED THEM ABOUT; the word is of the same root as נע in (Genesis 4:12) “a wanderer (נע) and a vagabond”."}, {"ch": 32, "v": 14, "aliyah": 3, "heb": "וְהִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵיכֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִסְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף־יְהֹוָ֖ה אֶל־יִשְׂרָאֵֽל׃", "onk": "וְהָא קַמְתּוּן חֲלַף אֲבָהַתְכוֹן <b>תַּלְמִידֵי<\/b> גֻּבְרַיָּא חַיָּבַיָא לְאוֹסָפָא עוֹד עַל <b>תְּקוֹף<\/b> רוּגְזָא דַיְיָ לְיִשְׂרָאֵל:", "onk_en": "Behold, you have now risen in the place of your fathers as a group [<b>disciples<\/b>] of sinners, to add to the [<b>mighty<\/b>] wrath of Adonoy against Yisroel.", "pj": "וְהָא קַמְתּוּן בָּתַר אַבְהַתְכוֹן תַּלְמִידֵי גוּבְרַיָא חַיָיבַיָא לְמוֹסְפָא תּוּב עַל תְּקוֹף רוּגְזָא דַיְיָ עַל יִשְרָאֵל", "pj_en": "And, behold, you are risen up after your fathers, disciples of wicked men, to increase yet the anger of the Lord against Israel.", "tj": "תִּסְגוּן גוּבְרִין חַיָיבִין לְמִסְפָה עוֹד עַל תְּקוֹף רוּגְזָא:", "tj_en": "You have multiplied the men of sin yet to increase the strength of His displeasure.", "rashi": "<b>לספות.<\/b> כְּמוֹ \"סְפוּ שָׁנָה עַל שָׁנָה\" (ישעיהו כ\"ט), \"עֹלוֹתֵיכֶם סְפוּ\" וְגוֹ' (ירמיהו ז'), לְשׁוֹן תּוֹסֶפֶת:", "rashi_en": "לספות is similar in meaning to the verbs in (Isaiah 29:1): “add (ספו) year to year”; ( 7:21): “add (ספו) your burnt-offerings” — an expression denoting adding (The translation is: to add even more to the Lord’s fierce anger against Israel)."}, {"ch": 32, "v": 15, "aliyah": 3, "heb": "כִּ֤י תְשׁוּבֻן֙ מֵֽאַחֲרָ֔יו וְיָסַ֣ף ע֔וֹד לְהַנִּיח֖וֹ בַּמִּדְבָּ֑ר וְשִֽׁחַתֶּ֖ם לְכׇל־הָעָ֥ם הַזֶּֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי תְתוּבוּן מִבָּתַר <b>דַּחַלְתֵּיהּ<\/b> וְיוֹסֵף עוֹד <b>לְאַחֲרוּתְהוֹן<\/b> בְּמַדְבְּרָא וּתְחַבְּלוּן לְכָל עַמָּא הָדֵין:", "onk_en": "If you will turn away from following [<b>fearing<\/b>] Him, He will again place [<b>delay<\/b>] them in the wilderness. and you will destroy this entire nation.”", "pj": "אֲרוּם תְּתוּבוּן מִבָּתַר דַחַלְתֵּיהּ וְיוֹסֵף תּוּב לְאוֹחֲרוֹתֵיהוֹן בְּמַדְבְּרָא וּתְחַבְּלוּן לְכָל עַמָא הָדֵין", "pj_en": "For if you go back from fearing Him, He will still make them abide in the wilderness, and so will you destroy all this people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 16, "aliyah": 3, "heb": "וַיִּגְּשׁ֤וּ אֵלָיו֙ וַיֹּ֣אמְר֔וּ גִּדְרֹ֥ת צֹ֛אן נִבְנֶ֥ה לְמִקְנֵ֖נוּ פֹּ֑ה וְעָרִ֖ים לְטַפֵּֽנוּ׃", "onk": "וְקָרִיבוּ לְוָתֵיהּ וַאֲמָרוּ חַטְרִין דְּעָן נִבְנֵי לִבְעִירָנָא הָכָא וְקִרְוִין לְטַפְלָנָא:", "onk_en": "They (the tribes of Reuvein and Gad) approached him (Moshe) and said: “We will build enclosures for our flocks here and cities for our children.", "pj": "וּקְרִיבוּ לְוָותֵיהּ וְאָמָרוּ דִירִין דְעָאן נִבְנֵי לִבְעִירָנָא הָכָא וְקִירְוִין לְטַפְלָנָא", "pj_en": "And they drew near to him, and said, We will build sheepfolds for our flocks, and towns for our families;", "tj": "", "tj_en": "", "rashi": "<b>נבנה למקננו פה.<\/b> חָסִים הָיוּ עַל מָמוֹנָם יוֹתֵר מִבְּנֵיהֶם וּבְנוֹתֵיהֶם, שֶׁהִקְדִּימוּ מִקְנֵיהֶם לְטַפָּם. אָמַר לָהֶם מֹשֶׁה \"לֹא כֵן, עֲשׂוּ הָעִקָּר עִקָּר וְהַטָּפֵל טָפֵל, בְּנוּ לָכֶם תְּחִלָּה עָרִים לְטַפְּכֶם וְאַחַר כֵּן גְּדֵרוֹת לְצֹאנְכֶם\" (תנחומא):", "rashi_en": "נבנה למקננו פה WE WILL BUILD [SHEEP FOLDS] FOR OUR CATTLE HERE — They paid more regard to their property than to their sons and daughters, because they mentioned their cattle before their children. Moses said to them, “Not so! Make the chief thing the chief thing and what is subordinate subordinate. First build cities for your little ones and afterwards enclosures for your flocks” (cf. v. 24) (Midrash Tanchuma, Matot 7)."}, {"ch": 32, "v": 17, "aliyah": 3, "heb": "וַאֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִפְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם־הֲבִֽיאֹנֻ֖ם אֶל־מְקוֹמָ֑ם וְיָשַׁ֤ב טַפֵּ֙נוּ֙ בְּעָרֵ֣י הַמִּבְצָ֔ר מִפְּנֵ֖י יֹשְׁבֵ֥י הָאָֽרֶץ׃", "onk": "וַאֲנַחְנָא נִזְדָּרֵז מַבְעִין קֳדָם בְּנֵי יִשְׂרָאֵל עַד דִּי נְעֵלִנּוּן לְאַתְרֵיהוֹן וְיֵתְבוּן טַפְלָנָא בְּקִרְוִין כְּרִיכִין מִן קֳדָם יָתְבֵי אַרְעָא:", "onk_en": "We will then arm ourselves rapidly, and will be ready to go before Bnei Yisroel until we have brought them to their place. Our children will dwell in fortified cities because of the inhabitants of the land.", "pj": "וַאֲנַחְנָא נִזְדְרַז מַבְעִין בְּגוֹ בְּנֵי יִשְרָאֵל עַד דִנְעִילוּנוּן לְאַתְרֵיהוֹן וְיֵתְבוּן טַפְלָנָא בְּקִרְוֵי חַקְלָא מִן קֳדָם יַתְבֵי אַרְעָא", "pj_en": "but we will go armed among the sons of Israel until we have brought them into their place: but our families shall dwell in towns defended against the inhabitants of the land.", "tj": "בְּקִרְוִין תְּלוּלִין מִן קֳדָם דְמָרֵי אַרְעָא:", "tj_en": "In cities fortified against the (former) masters of the land.", "rashi": "<b>ואנחנו נחלץ חשים.<\/b> נִזְדַּיֵּן מְהִירִים, כְּמוֹ \"מַהֵר שָׁלָל חָשׁ בַּז\" (ישעיהו ח'), \"יְמַהֵר יָחִישָׁה\" (שם ה'):<br><br><b>לפני בני ישראל.<\/b> בְּרָאשֵׁי גְּיָסוֹת, מִתּוֹךְ שֶׁגִּבּוֹרִים הָיוּ, שֶׁכֵּן נֶאֱמַר בְּגָד (דברים ל\"ג) \"וְטָרַף זְרוֹעַ אַף קָדְקֹד\"; וְאַף מֹשֶׁה חָזַר וּפֵרֵשׁ לָהֶם בְּאֵלֶּה הַדְּבָרִים (דברים ג') \"וָאֲצַו אֶתְכֶם בָּעֵת הַהִוא וְגוֹ' חֲלוּצִים תַּעַבְרוּ לִפְנֵי אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל כָּל בְּנֵי חָיִל\", וּבִירִיחוֹ כְּתִיב (יהושע ו') \"וְהֶחָלוּץ עוֹבֵר (הֹלֵךְ) לִפְנֵיהֶם\" — זֶה רְאוּבֵן וְגָד שֶׁקִּיְּמוּ תְנָאָם:<br><br><b>וישב טפנו.<\/b> בְּעוֹדֵנוּ אֵצֶל אַחֵינוּ:<br><br><b>בערי המבצר.<\/b> שֶׁנִּבְנֶה עַכְשָׁו:", "rashi_en": "ואנחנו נחלץ חשים means, AND WE SHALL ARM OURSELVES SPEEDILY, the last word being the same as in (Isaiah 8:3): “the spoil hasteth, the prey speedeth (חש)” and in (Isaiah 5:19), “Let Him make haste, let Him speed.\" <br><br>לפני בני ישראל BEFORE THE CHILDREN OF ISRAEL - i.e. at the head of the troops, because they were mighty men; for thus is it said of Gad, (Deuteronomy 30:20): “He teareth the arm, with the crown of the head”. Moses distinctly stated this to them in Sedrah אלה הדברים (Deuteronomy 3:18): “And I commanded you at that time … Ye shall pass over armed before the children of Israel, all ye men of valour”. And regarding the siege of Jericho it is written, (Joshua 6:13): “And the armed men (החלוץ) went before them”— this refers to the tribes of Reuben and Gad who thus fulfilled the conditions they had laid down.<br><br>וישב טפנו AND OUR LITTLE ONES SHALL STAY, so long as we are with our brethren waging war,<br><br>בערי המבצר IN THE FORTIFIED CITIES which we will now build (cf. v. 16 with v. 36)."}, {"ch": 32, "v": 18, "aliyah": 3, "heb": "לֹ֥א נָשׁ֖וּב אֶל־בָּתֵּ֑ינוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽוֹ׃", "onk": "לָא נְתוּב לְבֵיתָנָא עַד דְּיַחְסְנוּן בְּנֵי יִשְׂרָאֵל גְּבַר אַחֲסַנְתֵּיהּ:", "onk_en": "We will not return to our homes until each person of Bnei Yisroel takes possession of his hereditary property.", "pj": "לָא נְתוּב לְבָתָּנָא עַד דְיַחְסְנוּן בְּנֵי יִשְרָאֵל גְבַר אַחֲסַנְתֵּיהּ", "pj_en": "We will not return to our homes until the sons of Israel possess every one his inheritance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 19, "aliyah": 3, "heb": "כִּ֣י לֹ֤א נִנְחַל֙ אִתָּ֔ם מֵעֵ֥בֶר לַיַּרְדֵּ֖ן וָהָ֑לְאָה כִּ֣י בָ֤אָה נַחֲלָתֵ֙נוּ֙ אֵלֵ֔ינוּ מֵעֵ֥בֶר הַיַּרְדֵּ֖ן מִזְרָֽחָה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי לָא נַחְסִין עִמְּהוֹן מֵעִבְרָא לְיַרְדְּנָא וּלְהָלָא אֲרֵי קַבֵּלְנָא אַחֲסַנְתָּנָא לָנָא מֵעִבְרָא לְיַרְדְּנָא מַדִּינְחָא:", "onk_en": "But we do not want to take possession with them across the Yardein and beyond, for, our inheritance came to us to the east of the Yardein.”", "pj": "אֲרוּם לָא נַחְסִין עִמְהוֹן מֵעִיבְרָא לְיוֹרְדְנָא וּלְהָלָא אֲרוּם מָטַת אַחְסַנְתָּנָא לָנָא מֵעִיבְרָא דְיוֹרְדְנָא מַדִינְחָא", "pj_en": "For we will not inherit with them over the Jordan and beyond; for our inheritance cometh to us beyond Jordan eastward.", "tj": "", "tj_en": "", "rashi": "<b>מעבר לירדן והלאה.<\/b> בָּעֵבֶר הַמַּעֲרָבִי:<br><br><b>כי באה נחלתנו.<\/b> כְּבָר קִבַּלְנוּהָ בָּעֵבֶר הַמִּזְרָחִי:", "rashi_en": "מעבר לירדן וגו׳ ON THE SIDE OF THE JORDAN AND YONDER — i.e., on the western side.<br><br>כי באה נחלתנו FOR OUR INHERITANCE HAS COME [TO US] — This means: by that time we shall have already received it on the eastern side."}, {"ch": 32, "v": 20, "aliyah": 4, "heb": "וַיֹּ֤אמֶר אֲלֵיהֶם֙ מֹשֶׁ֔ה אִֽם־תַּעֲשׂ֖וּן אֶת־הַדָּבָ֣ר הַזֶּ֑ה אִם־תֵּחָ֥לְצ֛וּ לִפְנֵ֥י יְהֹוָ֖ה לַמִּלְחָמָֽה׃", "onk": "וַאֲמַר לְהוֹן משֶׁה אִם תַּעְבְּדוּן יָת פִּתְגָּמָא הָדֵין אִם תִּזְדָּרְזוּן קֳדָם <b>עַמָּא<\/b> דַיְיָ לִקְרָבָא:", "onk_en": "Moshe said to them: “If you will do this, if you will arm yourselves before [<b>the nation of<\/b>] Adonoy and go forth to the war,", "pj": "וַאֲמַר לְהוֹן משֶׁה אִין תַּעַבְדוּן יַת פִּתְגָמָא הָדֵין אִין תִּזְדַרְזוּן קֳדָם עַמָא דַיְיָ לְאַגָחָא קְרָבָא", "pj_en": "And Mosheh said to them, If you will perform this thing; if you will go forth armed before the people of the Lord to the war,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 21, "aliyah": 4, "heb": "וְעָבַ֨ר לָכֶ֧ם כׇּל־חָל֛וּץ אֶת־הַיַּרְדֵּ֖ן לִפְנֵ֣י יְהֹוָ֑ה עַ֧ד הוֹרִישׁ֛וֹ אֶת־אֹיְבָ֖יו מִפָּנָֽיו׃", "onk": "וְיַעֲבֵּר לְכוֹן כָּל דִּמְזָרֵז יָת יַרְדְּנָא קֳדָם <b>עַמָּא<\/b> דַיְיָ עַד דִּיתָרֵךְ יָת בַּעֲלֵי דְבָבוֹהִי מִן קֳדָמוֹהִי:", "onk_en": "and every armed man will cross the Yardein, before [<b>the nation of<\/b>] Adonoy, until He has driven His enemies before Him,", "pj": "וִיעִיבַר לְכוֹן כָּל דִמְזַרֵז יַת יוֹרְדְנָא קֳדָם עַמָא דַיְיָ לְאַגָחָא קְרָבָא עַד דְיִתָרֵךְ יַת בַּעֲלֵי דְבָבוֹי מִן קֳדָמוֹי", "pj_en": "if some of you armed will pass over Jordan before the Lord's people to go on with the war until He hath driven out the enemy before Him,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 22, "aliyah": 4, "heb": "וְנִכְבְּשָׁ֨ה הָאָ֜רֶץ לִפְנֵ֤י יְהֹוָה֙ וְאַחַ֣ר תָּשֻׁ֔בוּ וִהְיִיתֶ֧ם נְקִיִּ֛ם מֵיְהֹוָ֖ה וּמִיִּשְׂרָאֵ֑ל וְ֠הָיְתָ֠ה הָאָ֨רֶץ הַזֹּ֥את לָכֶ֛ם לַאֲחֻזָּ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְתִתְכְּבֵשׁ אַרְעָא קֳדָם <b>עַמָּא<\/b> דַיְיָ וּבָתַר כֵּן תְּתוּבוּן וּתְהוֹן זַכָּאִין מִן <b>קֳדָם<\/b> יְיָ וּמִיִּשְׂרָאֵל וּתְהֵי אַרְעָא הָדָא לְכוֹן לְאַחֲסָנָא קֳדָם יְיָ:", "onk_en": "and the land is conquered before [<b>the nation of<\/b>] Adonoy—afterwards you will return. You will then be vindicated from [<b>before<\/b>] Adonoy and from Yisroel, and this land will become yours permanently, before Adonoy.", "pj": "וְתִתְכְּבַשׁ אַרְעָא קֳדָם עַמָא דַיְיָ וּמִן בָּתַר כְּדֵין תְּתוּבוּן וּתְהוֹן זַכָּאִין מִן קֳדָם יְיָ וּמִיִשְרָאֵל וּתְהֵי אַרְעָא הָדָא לְכוֹן לְאַחְסָנָא קֳדָם יְיָ", "pj_en": "and the land be subdued before the people of the Lord, then afterwards you shall return, and be acquitted before the Lord and by Israel; and this land shall be yours for an inheritance before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 23, "aliyah": 4, "heb": "וְאִם־לֹ֤א תַעֲשׂוּן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַיהֹוָ֑ה וּדְעוּ֙ חַטַּאתְכֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְכֶֽם׃", "onk": "וְאִם לָא תַעַבְּדוּן כֵּן הָא חַבְתּוּן <b>קֳדָם<\/b> יְיָ וְתִדְעוּן חוֹבַתְכוֹן דִּי תַשְׁכַּח יָתְכוֹן:", "onk_en": "But if you will not do this, behold, you will have sinned against [<b>before<\/b>] Adonoy and you must realize that your sin will find you!", "pj": "וְאִין לָא תַעַבְדוּן יַת פִּתְגָמָא הָדֵין הָא חַבְתּוּן קֳדָם יְיָ אֱלָהָכוֹן וּדְעוּ חוֹבַתְכוֹן דְתֶאֱרַע יַתְכוֹן", "pj_en": "But if you will not perform this, behold, ye will have sinned before the Lord your God, and know that your sin will meet you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 24, "aliyah": 4, "heb": "בְּנֽוּ־לָכֶ֤ם עָרִים֙ לְטַפְּכֶ֔ם וּגְדֵרֹ֖ת לְצֹנַאֲכֶ֑ם וְהַיֹּצֵ֥א מִפִּיכֶ֖ם תַּעֲשֽׂוּ׃", "onk": "בְּנוּ לְכוֹן קִרְוִין לְטַפְלְכוֹן וְחַטְרִין לְעַנְכוֹן וּדְיִפּוֹק מִפּוּמְכוֹן תַּעַבְּדוּן:", "onk_en": "Build for yourselves cities for your children and enclosures for your sheep. But what you have expressed verbally, you must fulfill.”", "pj": "בְּנוּ לְכוֹן קוּרְיַין לְטַפְלְכוֹן וְדִירִין לְעַנְכוֹן וּדְנָפִיק מִפּוּמְכוֹן תַּעַבְדוּן", "pj_en": "Build (then) cities for your little ones and folds for your sheep, and do that which hath proceeded from your mouth.", "tj": "בְּנוּ לְכוֹן קִרְוִין לְטַפְלֵיכוֹן וְדִיכְוַן לְעַנְכוֹן וּמַה דִנְפַק מִפּוּמְכוֹן תַּעַבְדוּן:", "tj_en": "Build cities for your little ones and folds for your sheep, and do that which hath come out of your mouth.", "rashi": "<b>לצנאכם.<\/b> תֵּבָה זוֹ מִגִּזְרַת \"צֹנֶה וַאֲלָפִים כֻּלָּם\" (תהלים ח') שֶׁאֵין בּוֹ אָלֶ\"ף מַפְסִיק בֵּין נוּ\"ן לַצָּדִ\"י, וְאָלֶ\"ף שֶׁבָּא כָאן אַחַר הַנּוּ\"ן בִּמְקוֹם הֵ\"א שֶׁל צֹנֶה הוּא; מִיסוֹדוֹ שֶׁל רַ' מֹשֶׁה הַדַּרְשָׁן לָמַדְתִּי כֵן:<br><br><b>והיצא מפיכם תעשו.<\/b> לְגָבוֹהַּ, שֶׁקִּבַּלְתֶּם עֲלֵיכֶם לַעֲבֹר לַמִּלְחָמָה עַד כִּבּוּשׁ וְחִלּוּק, שֶׁמֹּשֶׁה לֹא בִּקֵּשׁ מֵהֶם אֶלָּא \"וְנִכְבְּשָׁה … וְאַחַר תָּשׁוּבוּ\" וְהֵם קִבְּלוּ עֲלֵיהֶם \"עַד הִתְנַחֵל\", הֲרֵי הוֹסִיפוּ לְהִתְעַכֵּב שֶׁבַע שֶׁחָלְקוּ, וְכֵן עָשׂוּ:", "rashi_en": "לצנאכם FOR YOUR SHEEP — This word is from the noun form which is found in (Psalms 8:8): “Sheep (צנה) and oxen, all of them”, where, too, there is no א intervening between the נ and the צ. The א which here comes after the נ is in place of the ה of צנה (and לצנאכם is not the same form as לצאנכם with an inversion of the א and נ). I learned this from the work of R. Moses the Preacher.<br><br>והיצא מפיכם תעשו AND DO THAT WHICH HATH GONE OUT FROM YOUR MOUTH, as a vow to the Most High God (cf. Numbers 30:3), because you have taken it upon yourselves to pass over for war until the end of the subjugation and division of the land; — for Moses asked of them only, (v. 22): “Let [the land] be subdued and afterwards ye may return”, but they undertook, (v. 18): “[we will not return to our houses] until [the children of Israel] have inherited”, so you see that they made an additional promise, to stay on the western side the seven years during which they were dividing the land. And so, indeed, they did (cf. Joshua XXII.)."}, {"ch": 32, "v": 25, "aliyah": 4, "heb": "וַיֹּ֤אמֶר בְּנֵי־גָד֙ וּבְנֵ֣י רְאוּבֵ֔ן אֶל־מֹשֶׁ֖ה לֵאמֹ֑ר עֲבָדֶ֣יךָ יַעֲשׂ֔וּ כַּאֲשֶׁ֥ר אֲדֹנִ֖י מְצַוֶּֽה׃", "onk": "וַאֲמָרוּ בְנֵי גָד וּבְנֵי רְאוּבֵן לְמשֶׁה לְמֵימָר עַבְדָּיךְ יַעְבְּדוּן כְּמָא דִּי רִבּוֹנִי מְפַקֵּד:", "onk_en": "The tribe of Gad and Reuvein said to Moshe saying: “Your servants will do as my master instructs.", "pj": "וַאֲמָרוּ בְּנֵי גָד וּבְנֵי רְאוּבֵן בְּאַסְכָּמוּתָא חֲדָא לְמשֶׁה לְמֵימָר עַבְדָךְ יַעַבְדוּן כָּל דְרִבּוֹנִי מְפַקֵיד", "pj_en": "And the sons of Gad and Reuben spake to Mosheh with one consent, saying, Thy servants will do whatever my lord hath commanded:", "tj": "", "tj_en": "", "rashi": "<b>ויאמר בני גד.<\/b> כֻּלָּם כְּאִישׁ אֶחָד:", "rashi_en": "ויאמר בני גד AND THE CHILDREN OF GAD SAID, all of them as one man (ויאמר is the singular form of the verb, whilst the subject בגי גד is the plural; cf. Rashi on Exodus 19:2 s. v.)."}, {"ch": 32, "v": 26, "aliyah": 4, "heb": "טַפֵּ֣נוּ נָשֵׁ֔ינוּ מִקְנֵ֖נוּ וְכׇל־בְּהֶמְתֵּ֑נוּ יִֽהְיוּ־שָׁ֖ם בְּעָרֵ֥י הַגִּלְעָֽד׃", "onk": "טַפְלָנָא נְשָׁנָא גֵּיתָנָא וְכָל בְּעִירָנָא יְהוֹן תַּמָּן בְּקִרְוֵי גִלְעָד:", "onk_en": "Our children, wives, cattle and all livestock will remain there in the cities of Gil’ad.", "pj": "טַפְלָנָא נְשָׁנָא גֵיתָנָא וְכָל בְּעִירָנָא יְהוֹן תַּמָן בְּקוּרְוֵי גִלְעָד", "pj_en": "our children, wives, flocks, and all our cattle shall be here in the cities of Gilead;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 27, "aliyah": 4, "heb": "וַעֲבָדֶ֨יךָ יַֽעַבְר֜וּ כׇּל־חֲל֥וּץ צָבָ֛א לִפְנֵ֥י יְהֹוָ֖ה לַמִּלְחָמָ֑ה כַּאֲשֶׁ֥ר אֲדֹנִ֖י דֹּבֵֽר׃", "onk": "וְעַבְדָּיךְ יַעְבְּרוּן כָּל דִמְזָרֵז חֵילָא קֳדָם <b>עַמָּא<\/b> דַיְיָ לִקְרָבָא כְּמָא דִי רִבּוֹנִי מְמַלֵּל:", "onk_en": "And your servants will cross over—all those in the army—before [<b>the nation of<\/b>] Adonoy, to the war, as my master commands.”", "pj": "וְעַבְדָךְ יְעִיבְרוּן כָּל דִמְזָרֵז חֵילָא קֳדָם עַמָא דַיְיָ לִקְרָבָא הֵיכְמָא דְרִבּוֹנִי מְמַלֵיל", "pj_en": "but thy servants will go over, every one armed for the host, before the people of the Lord to the war, as my lord hath said.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 28, "aliyah": 4, "heb": "וַיְצַ֤ו לָהֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַכֹּהֵ֔ן וְאֵ֖ת יְהוֹשֻׁ֣עַ בִּן־נ֑וּן וְאֶת־רָאשֵׁ֛י אֲב֥וֹת הַמַּטּ֖וֹת לִבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּפַקִּיד לְהוֹן משֶׁה יָת אֶלְעָזָר כַּהֲנָא וְיָת יְהוֹשֻׁעַ בַּר נוּן וְיָת רֵישֵׁי אֲבָהַת שִׁבְטַיָּא לִבְנֵי יִשְׂרָאֵל:", "onk_en": "Moshe commanded to them, Elozor the <i>kohein,<\/i> Yehoshua, son of Nun, and the heads of the tribes of Bnei Yisroel.", "pj": "וּפַקֵיד עֲלֵיהוֹן משֶׁה יַת אֶלְעָזָר כַּהֲנָא וְיַת יְהוֹשֻׁעַ בַּר נוּן וְיַת רֵישֵׁי אַבְהַת שִׁבְטַיָא לִבְנֵי יִשְרָאֵל", "pj_en": "And Mosheh commanded concerning them Elazar the priest, and Jehoshua bar Nun, and the heads of the tribes of the Beni Israel,", "tj": "", "tj_en": "", "rashi": "<b>ויצו להם.<\/b> כְּמוֹ עֲלֵיהֶם, וְעַל תְּנָאָם מִנָּה אֶלְעָזָר וִיהוֹשֻׁעַ, כְּמוֹ \"ה' יִלָּחֵם לָכֶם\" (שמות י\"ד):", "rashi_en": ". ויצו להם AND HE GAVE CHARGE — This is the same as, and he gave charge concerning them. The words imply: and to watch over the fulfilment of the agreement they had made he appointed Eleazar and Joshua. The use of the ל in להם here is the same as in (Exodus 14:14): “The Lord will fight לכם for you.\""}, {"ch": 32, "v": 29, "aliyah": 4, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵהֶ֗ם אִם־יַעַבְר֣וּ בְנֵי־גָ֣ד וּבְנֵי־רְאוּבֵ֣ן&thinsp;<small>׀<\/small>&thinsp;אִ֠תְּכֶ֠ם אֶֽת־הַיַּרְדֵּ֞ן כׇּל־חָל֤וּץ לַמִּלְחָמָה֙ לִפְנֵ֣י יְהֹוָ֔ה וְנִכְבְּשָׁ֥ה הָאָ֖רֶץ לִפְנֵיכֶ֑ם וּנְתַתֶּ֥ם לָהֶ֛ם אֶת־אֶ֥רֶץ הַגִּלְעָ֖ד לַאֲחֻזָּֽה׃", "onk": "וַאֲמַר משֶׁה לְהוֹן אִם יַעְבְּרוּן בְּנֵי גָד וּבְנֵי רְאוּבֵן עִמְּכוֹן יָת יַרְדְּנָא כָּל דִּמְזָרַז לִקְרָבָא קֳדָם <b>עַמָּא<\/b> דַיְיָ וְתִתְכְּבֵשׁ אַרְעָא קֳדָמֵיכוֹן וְתִתְּנוּן לְהוֹן יָת אַרְעָא דְגִלְעָד לְאַחֲסָנָא:", "onk_en": "Moshe said to them: “If the tribe of Gad and Reuvein will cross the Yardein with you, every man that is armed for battle before [<b>the nation of<\/b>] Adonoy, and the land is conquered before you, you shall give them the land of Gil’ad as a permanent possession.", "pj": "וַאֲמַר לְהוֹן משֶׁה אִין יְעִיבְרוּן בְּנֵי גָד וּבְנֵי רְאוּבֵן עִמְכוֹן יַת יוֹרְדְנָא כָּל דִמְזָרֵז לִקְרָבָא קֳדָם עַמָא דַיְיָ וְתִתְכְּבֵשׁ אַרְעָא קֳדָמֵיכוֹן וְתִתְּנוּן לְהוֹן יַת אַרַע גִלְעָד לְאַחְסָנָא", "pj_en": "and said to them: If the sons of Gad and of Reuben go over the Jordan with you, every one armed for the war, before the people of the Lord, and the land be subdued before you, then shall you give to them the land of Gilead for a possession.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 30, "aliyah": 4, "heb": "וְאִם־לֹ֧א יַֽעַבְר֛וּ חֲלוּצִ֖ים אִתְּכֶ֑ם וְנֹֽאחֲז֥וּ בְתֹכְכֶ֖ם בְּאֶ֥רֶץ כְּנָֽעַן׃", "onk": "וְאִם לָא יַעְבְּרוּן מְזָרְזִין עִמְּכוֹן וְיַחְסְנוּן בֵּינֵיכוֹן בְּאַרְעָא דִכְנָעַן:", "onk_en": "But if they do not cross over with you, armed for battle, then they shall take possession among you in the land of Canaan.”", "pj": "וְאִין לָא יְעִיבְרוּן מְזַרְזִין עִמְכוֹן וְיַחְסְנוּן בֵּינֵיכוֹן בְּאַרְעָא דִכְנָעַן", "pj_en": "But if they will not pass over armed with you, then they shall receive an inheritance among you in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 31, "aliyah": 4, "heb": "וַיַּֽעֲנ֧וּ בְנֵי־גָ֛ד וּבְנֵ֥י רְאוּבֵ֖ן לֵאמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהֹוָ֛ה אֶל־עֲבָדֶ֖יךָ כֵּ֥ן נַעֲשֶֽׂה׃", "onk": "וַאֲתִיבוּ בְנֵי גָד וּבְנֵי רְאוּבֵן לְמֵימָר יָת דִּי מַלִּיל יְיָ לְעַבְדָּיךְ כֵּן נַעְבֵּד:", "onk_en": "The tribes of Gad and Reuvein answered, saying: “As Adonoy has spoken to your servants, so shall we do.", "pj": "וְאָתִיבוּ בְנֵי גָד וּבְנֵי רְאוּבֵן וַאֲמָרוּ יַת כָּל דְמַלֵיל יְיָ לְעַבְדָךְ הֵיכְדֵין נַעֲבֵיד", "pj_en": "But the sons of Gad and Reuben answered and said: Whatsoever the Lord hath spoken to thy servants so will we do.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 32, "aliyah": 4, "heb": "נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִפְנֵ֥י יְהֹוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְאִתָּ֙נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔נוּ מֵעֵ֖בֶר לַיַּרְדֵּֽן׃", "onk": "נַחְנָא נְעִבַר מְזָרְזִין קֳדָם <b>עַמָּא<\/b> דַיְיָ לְאַרְעָא דִכְנָעַן וְעִמָּנָא אֲחוּדַת אַחֲסַנְתָּנָא מֵעִבְרָא לְיַרְדְּנָא:", "onk_en": "We will cross over armed for battle before [<b>the nation of<\/b>] Adonoy, to the land of Canaan, and we shall [then] have our permanent inheritance on this side of the Yardein.”", "pj": "נַחְנָא נְעִיבַר מְזַרְזִין קֳדָם עַמָא לְאַרְעָא דִכְנָעַן וְעִמָנָא אֲחִידַת אַחֲסַנְתָּנָא מֵעִיבְרָא לְיוֹרְדְנָא", "pj_en": "We will go over armed before the Lord's people into the land of Kenaan, that our inheritance may be on this side the Jordan.", "tj": "", "tj_en": "", "rashi": "<b>ואתנו אחזת נחלתנו.<\/b> כְּלוֹמַר בְּיָדֵינוּ וּבִרְשׁוּתֵנוּ תְהִי אֲחֻזַּת נַחֲלָתֵנוּ מֵעֵבֶר הַזֶּה:", "rashi_en": "ואתנו אחזת נחלתנו AND LET POSSESSION OF OUR INHERITANCE BE WITH US [ON THIS SIDE OF THE JORDAN] — it is as much as to say: (ואתנו) in our hands and in our ownership let the possession of our inheritance be on this side."}, {"ch": 32, "v": 33, "aliyah": 4, "heb": "וַיִּתֵּ֣ן לָהֶ֣ם&thinsp;<small>׀<\/small>&thinsp;מֹשֶׁ֡ה לִבְנֵי־גָד֩ וְלִבְנֵ֨י רְאוּבֵ֜ן וְלַחֲצִ֣י&thinsp;<b>׀<\/b> שֵׁ֣בֶט&thinsp;<b>׀<\/b> מְנַשֶּׁ֣ה בֶן־יוֹסֵ֗ף אֶת־מַמְלֶ֙כֶת֙ סִיחֹן֙ מֶ֣לֶךְ הָֽאֱמֹרִ֔י וְאֶ֨ת־מַמְלֶ֔כֶת ע֖וֹג מֶ֣לֶךְ הַבָּשָׁ֑ן הָאָ֗רֶץ לְעָרֶ֙יהָ֙ בִּגְבֻלֹ֔ת עָרֵ֥י הָאָ֖רֶץ סָבִֽיב׃", "onk": "וִיהַב לְהוֹן משֶׁה לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן וּלְפַלְגּוּת שִׁבְטָא דִּמְנַשֶּׁה בַר יוֹסֵף יָת מַלְכְּוַת סִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה וְיָת מַלְכְּוַת עוֹג מַלְכָּא <b>דְמַתְנָן<\/b> אַרְעָא לְקִרְוָהָא בִּתְחוּמִין קִרְוֵי אַרְעָא סְחוֹר סְחוֹר:", "onk_en": "Moshe gave to them—to the tribe of Gad, to the tribe of Reuvein and to half the tribe of Menashe son of Yoseif—the empire of Sichon, king of the Emorites and the empire of Og, king of the Bashan [<b>Masnon<\/b>], the land along with the cities within their borders, even the cities of the surrounding land.", "pj": "וִיהַב לְהוֹן משֶׁה לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן וּלְפַלְגוּת שִׁבְטָא דִמְנַשֶׁה בַר יוֹסֵף יַת מַלְכוּת סִיחוֹן מַלְכָּא דֶאֱמוֹרָאֵי וְיַת מַלְכוּת עוֹג מַלְכָּא דְמַתְנָן אַרְעָא לְקוּרְיָיהָא בִּתְחוּמֵי קוּרְיֵי אַרְעָא חֲזוֹר חֲזוֹר", "pj_en": "And Mosheh gave to them, the sons of Gad and of Reuben, and to the half tribe of Menasheh bar Joseph, the kingdom. of Sihon king of the Amoraee, and the kingdom of Og king of Mathnan, the land with its cities by the limits of the cities of the land round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 34, "aliyah": 4, "heb": "וַיִּבְנ֣וּ בְנֵי־גָ֔ד אֶת־דִּיבֹ֖ן וְאֶת־עֲטָרֹ֑ת וְאֵ֖ת עֲרֹעֵֽר׃", "onk": "וּבְנוֹ בְנֵי גָד יָת דִּיבוֹן וְיָת עֲטָרוֹת וְיָת עֲרֹעֵר:", "onk_en": "The sons of Gad built up Divon, Ataros, Aro’eir,", "pj": "וּבְנוֹ בְנֵי גָד יַת מַדְבֶּשְׁתָּא וְיַת מַכְלֶלְתָּא וְיַת לְחָיַית", "pj_en": "And the sons of Gad built (rebuilt) Madbashta and Maklalta and Lechaiath,", "tj": "וּבְנוֹ בְּנֵי גָד יַת דְבֶשְׁתָּא וְיַת מַכְלֶלְתָּא וְיַת לְחָיָת:", "tj_en": "And the sons of Gad built Debeshta, and Maklalta, and Lechaiath,", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 35, "aliyah": 4, "heb": "וְאֶת־עַטְרֹ֥ת שׁוֹפָ֛ן וְאֶת־יַעְזֵ֖ר וְיׇגְבְּהָֽה׃", "onk": "וְיָת עַטְרוֹת שׁוֹפָן וְיָת יַעְזֵר <b>וְרָמָתָא<\/b>:", "onk_en": "Atros Shofan, Yazeir, Yogbehah [<b>the Heights<\/b>],", "pj": "וְיַת מַכְלְלַת שׁוֹפָנָא וְיַת מַכְוַור גְרָמָתָא", "pj_en": "and Maklelath, Shophena, and Mikvar Geramatha,", "tj": "וְיַת מַכְלֶלְתָּא דְשׁוֹפָּן וְיַת מַכְוַור וְיַת יָגְבְּהָה:", "tj_en": "And Maklalta of Shophan, and Makvar, and Jegbeha,", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 36, "aliyah": 4, "heb": "וְאֶת־בֵּ֥ית נִמְרָ֖ה וְאֶת־בֵּ֣ית הָרָ֑ן עָרֵ֥י מִבְצָ֖ר וְגִדְרֹ֥ת צֹֽאן׃", "onk": "וְיָת בֵּית נִמְרָה וְיָת בֵּית הָרָן קִרְוִין כְּרִיכָן וְחַטְרִין דְּעָן:", "onk_en": "Beis Nimrah, and Beis Haran as fortified cities and sheep pens.", "pj": "וְיַת כְּרַכָּא תַּקִיפָא בְּבֵית נִמְרִין וְיַת בֵּית הָרַן קוֹרְיֵי חַקְרָא וּגְדִירִין דְעָאן", "pj_en": "and the strong city of Beth Nimrin, and Beth Haran, fenced cities (with) folds for sheep.", "tj": "", "tj_en": "", "rashi": "<b>ערי מבצר וגדרת צאן.<\/b> זֶה סוֹף פָּסוּק מוּסָב עַל תְּחִלַּת הָעִנְיָן — וַיִּבְנוּ בְנֵי גָד אֶת הֶעָרִים הַלָּלוּ לִהְיוֹת עָרֵי מִבְצָר וְגִדְרֹת צֹאן:", "rashi_en": "ערי מבצר וגדרת צאן FORTIFIED CITIES AND ENCLOSURES FOR SHEEP — This end of the verse is to be connected back with the beginning of the paragraph (v. 24): And the children of Gad built these cities to be fortified cities and enclosures for sheep."}, {"ch": 32, "v": 37, "aliyah": 4, "heb": "וּבְנֵ֤י רְאוּבֵן֙ בָּנ֔וּ אֶת־חֶשְׁבּ֖וֹן וְאֶת־אֶלְעָלֵ֑א וְאֵ֖ת קִרְיָתָֽיִם׃", "onk": "וּבְנֵי רְאוּבֵן בְּנוֹ יָת חֶשׁבּוֹן וְיָת אֶלְעָלֵא וְיָת קִרְיָתָיִם:", "onk_en": "The tribe of Reuvein built up Cheshbon, El’alei, Kiryasayim,", "pj": "וּבְנֵי רְאוּבֵן בָּנוּ יַת בֵּית חוּשְׁבְּנֵי וְיַת מַעֲלַת מָרָא וְיַת קַרְתָּא דִתְרֵין שׁוֹקְהָא מְכַבְּשָׁן בְּמַרְמֵירָא הִיא בַיְרֵישָׁא", "pj_en": "And the sons of Reuben built (rebuilt) Beth Heshbon and Mahalath Mera, and the city of the two streets paved with marble which is Beresha,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 38, "aliyah": 4, "heb": "וְאֶת־נְב֞וֹ וְאֶת־בַּ֧עַל מְע֛וֹן מֽוּסַבֹּ֥ת שֵׁ֖ם וְאֶת־שִׂבְמָ֑ה וַיִּקְרְא֣וּ בְשֵׁמֹ֔ת אֶת־שְׁמ֥וֹת הֶעָרִ֖ים אֲשֶׁ֥ר בָּנֽוּ׃", "onk": "וְיָת נְבוֹ וְיָת בַּעַל מְעוֹן מַקְּפַן שְׁמָהָן וְיָת שִׂבְמָה וּקְרוֹ בִשְׁמָהָן יָת שְׁמָהַת קִרְוַיָּא דִּי בְנוֹ:", "onk_en": "Nevo, Ba’al Me’on—their names having been changed, and Sivmah. They retained the names of the other cities that they built.", "pj": "וְיַת בֵּית קְבוּרְתֵּיהּ דְמשֶׁה וְיַת קַרְתָּא דְבָלָק דְפָגְרוּ מִתַּמָן טָעוּת פְּעוֹר בְּמָדוֹר בֵּית בַּמְסַיָא וְיַת קַרְתָּא דְמַקְפָן שׁוּרָהָא גְלִיף שְׁמָהַת גוּבְרַיָא וְיַת שִׁירַן וּבָתַר דְבָנִינוּן קְרוֹ לְהוֹן שְׁמָהָן כְּשׁוּם גוּבְרַיָא דִבְנוּנוּן", "pj_en": "and the place of the sepulchre of Mosheh, and (rebuilt) the city of Balak, destroying out of it the idol of Peor, in the house of his high places, and the city whose walls surrounded it, inscribed with the names of his heroes, and Shiran. And after they had built them they called their names after the names of the men who had built them.", "tj": "", "tj_en": "", "rashi": "<b>ואת נבו ואת בעל מעון מוסבת שם.<\/b> נְבוֹ וּבַעַל מְעוֹן שְׁמוֹת עֲ\"זָ הֵם, וְהָיוּ הָאֱמוֹרִיִּים קוֹרִים עָרֵיהֶם עַל שֵׁם עֲ\"זָ שֶׁלָּהֶם, וּבְנֵי רְאוּבֵן הֵסֵבּוּ אֶת שְׁמָם לְשֵׁמוֹת אֲחֵרִים, וְזֶהוּ <b>מוסבת שם<\/b> — נְבוֹ וּבַעַל מְעוֹן מוּסַבּוֹת לְשֵׁם אַחֵר:<br><br><b>ואת שבמה.<\/b> בָּנוּ שִׂבְמָה, וְהִיא שְׂבָם הָאֲמוּרָה לְמַעְלָה:", "rashi_en": "ואת נבו ואת בעל מעון מוסבת שם AND NEBO AND AND BAAL-MEON, THEIR NAMES BEING CHANGED — Nebo and Baal-Meon were names of idols, and the Ammonites used to call their cities by the names of their gods. The children of Reuben therefore changed their names into other names. This is the meaning of מוסבת שם: Nebo and Baal-Meon were changed to other names.<br><br>ואת שבמה AND SIBMAH — i.e., they built (cf. v. 37) Sibmah also. This is identical with Sebam that is mentioned above (v. 3)."}, {"ch": 32, "v": 39, "aliyah": 4, "heb": "וַיֵּ֨לְכ֜וּ בְּנֵ֨י מָכִ֧יר בֶּן־מְנַשֶּׁ֛ה גִּלְעָ֖דָה וַֽיִּלְכְּדֻ֑הָ וַיּ֖וֹרֶשׁ אֶת־הָאֱמֹרִ֥י אֲשֶׁר־בָּֽהּ׃", "onk": "וַאֲזָלוּ בְּנֵי מָכִיר בַּר מְנַשֶּׁה לְגִלְעָד וְכִבְשׁוּהָ וְתָרִיךְ יָת אֱמוֹרָאָה דִי בַהּ:", "onk_en": "The sons of Machir, son of Menashe, went to Gil’ad and captured it, and drove out the Amorites who were in it.", "pj": "וַאֲזָלוּ בְּנֵי מָכִיר בַּר מְנַשֶׁה לְגִלְעָד וְכַבְּשׁוּהָ וּתְרִיכוּ יַת אֱמוֹרָאֵי דְבָהּ", "pj_en": "And the sons of Makir bar Menasheh went to Gilead and subdued it, and drave out the Amoraee who were therein.", "tj": "", "tj_en": "", "rashi": "<b>ויורש.<\/b> כְּתַרְגּוּמוֹ \"וְתָרִיךְ\", שֶׁתֵּבַת ריש מְשַׁמֶּשֶׁת שְׁתֵּי מַחֲלָקוֹת, לְשׁוֹן יְרֻשָּׁה וּלְשׁוֹן הוֹרָשָׁה שֶׁהוּא טֵרוּד וְתֵרוּךְ:", "rashi_en": "ויורש — Understand this as the Targum does “AND HE DROVE OUT”, for the expression ריש is used in two different meanings, in the sense of ירושה (the Kal), “inheriting”, and in the sense of הורשה (the Hiphil) which denotes driving away and expelling (see Rashi on Numbers 14:24)."}, {"ch": 32, "v": 40, "aliyah": 4, "heb": "וַיִּתֵּ֤ן מֹשֶׁה֙ אֶת־הַגִּלְעָ֔ד לְמָכִ֖יר בֶּן־מְנַשֶּׁ֑ה וַיֵּ֖שֶׁב בָּֽהּ׃", "onk": "וִיהַב משֶׁה יָת גִּלְעָד לְמָכִיר בַּר מְנַשֶּׁה וִיתֵב בַּהּ:", "onk_en": "Moshe gave the Gil’ad to Machir, son of Menashe, and he settled in it.", "pj": "וִיהַב משֶׁה יַת גִלְעָד לְמָכִיר בַּר מְנַשֶׁה וִיתֵב בָּהּ", "pj_en": "And Mosheh gave Gilead to Makir bar Menasheh, and he dwelt in it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 41, "aliyah": 4, "heb": "וְיָאִ֤יר בֶּן־מְנַשֶּׁה֙ הָלַ֔ךְ וַיִּלְכֹּ֖ד אֶת־חַוֺּתֵיהֶ֑ם וַיִּקְרָ֥א אֶתְהֶ֖ן חַוֺּ֥ת יָאִֽיר׃", "onk": "וְיָאִיר בַּר מְנַשֶּׁה אֲזַל וּכְבַשׁ יָת כַּפְרָנֵיהוֹן וּקְרָא יָתְהֶן כַּפְרָנֵי יָאִיר:", "onk_en": "Yair, son of Menashe, went and conquered their villages and called them Chavos Yair.", "pj": "וְיָאִיר בַּר מְנַשֶׁה אָזַל וּכְבַשׁ יַת כַּפְרָנֵיהוֹן וּקְרָא יַתְהוֹן כּוּפְרָנֵי יָאִיר", "pj_en": "And Jair bar Menasheh went and subdued their villages, and called them the villages of Jair.", "tj": "", "tj_en": "", "rashi": "<b>חותיהם.<\/b> כַּפְרָנֵיהוֹן:<br><br><b>ויקרא אתהן חות יאיר.<\/b> לְפִי שֶׁלֹּא הָיוּ לוֹ בָנִים קְרָאַתָם בִּשְׁמוֹ לְזִכָּרוֹן:", "rashi_en": "חותיהם This is rendered in the Targum by THEIR VILLAGES.<br><br>ויקרא אתהן חות יאיר AND HE CALLED THEM “THE VILLAGES OF JAIR” — Because he had no children, he named them after himself, as a memorial."}, {"ch": 32, "v": 42, "aliyah": 4, "heb": "וְנֹ֣בַח הָלַ֔ךְ וַיִּלְכֹּ֥ד אֶת־קְנָ֖ת וְאֶת־בְּנֹתֶ֑יהָ וַיִּקְרָ֧א לָ֦הֿ נֹ֖בַח בִּשְׁמֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְנֹבַח אֲזַל וּכְבַשׁ יָת קְנַת וְיָת כַּפְרָנָהָא וּקְרָא לַהּ נֹבַח בִּשְׁמֵיהּ:", "onk_en": "Novach went and conquered Kenas and its suburbs, and called it Novach, after his own name.", "pj": "וְנוֹבַח אָזַל וּכְבַשׁ יַת קְנָת וְיַת כּוּפְרָנָהָא וּקְרָא לָהּ נוֹבַח עַל שְׁמֵיהּ", "pj_en": "And Nobach went and subdued Kenath and its villages, and called it Nobach, after his own name.", "tj": "", "tj_en": "", "rashi": "<b>ויקרא לה נבח.<\/b> \"לָה\" אֵינוֹ מַפִּיק הֵ\"א, וְרָאִיתִי בִיסוֹדוֹ שֶׁל רַ' מֹשֶׁה הַדַּרְשָׁן לְפִי שֶׁלֹּא נִתְקַיֵּם לָהּ שֵׁם זֶה לְפִיכָךְ הוּא רָפֶה, שֶׁמַּשְׁמָעוּת מִדְרָשׁוֹ כְּמוֹ לֹא; וּתְמֵהַנִי מַה יִּדְרֹשׁ בִּשְׁתֵּי תֵבוֹת הַדּוֹמוֹת לָהּ \"וַיֹּאמֶר לָה בֹעַז\" (רות ב'), \"לִבְנוֹת לָה בַיִת\" (זכריה ה'):", "rashi_en": "ויקרא לה נבח AND HE CALLED IT NOBAH — The word לה has no Mappik in the ה (as the word לָהּ \"to it\", usually has). Now I have seen the following in the work of R. Moses the Preacher: Because this name did not remain permanently to it, therefore the letter ה is weak (without a Mappik), — the implication of his explanation being that it (the word לה) is the same as לא “not”. But I wonder what explanation he will give of the two words similar to it, (Ruth 2:14): “And Boaz said לָה\", and (Zechariah 5:11): “to build a house לָה”."}, {"ch": 33, "v": 1, "aliyah": 4, "heb": "אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי־יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵאֶ֥רֶץ מִצְרַ֖יִם לְצִבְאֹתָ֑ם בְּיַד־מֹשֶׁ֖ה וְאַהֲרֹֽן׃", "onk": "אִלֵּין מַטְּלָנֵי בְנֵי יִשְׂרָאֵל דִּי נְפָקוּ מֵאַרְעָא דְמִצְרַיִם לְחֵילֵיהוֹן בִּידָא דְמשֶׁה וְאַהֲרֹן:", "onk_en": "These are the journeys of Bnei Yisroel who went out of Egypt in organized groups under the leadership of Moshe and Aharon.", "pj": "אלה אִלֵין מַטְלָנֵי בְנֵי יִשְרָאֵל דִי נְפָקוּ מֵאַרַע דְמִצְרַיִם לְחֵילְוַתְהוֹן כַּד אִתְעֲבִידוּ לְהוֹן נִיסִין עַל יַד משֶׁה וְאַהֲרן", "pj_en": "These are the journeys of the Beni Israel who came out from Mizraim by their hosts, after the miracles had been wrought for them by the hand of Mosheh and Aharon.", "tj": "", "tj_en": "", "rashi": "<b>אלה מסעי.<\/b> לָמָּה נִכְתְּבוּ הַמַּסָּעוֹת הַלָּלוּ? לְהוֹדִיעַ חֲסָדָיו שֶׁל מָקוֹם, שֶׁאַעַ\"פִּ שֶׁגָּזַר עֲלֵיהֶם לְטַלְטְלַם וְלַהֲנִיעָם בַּמִּדְבָּר, לֹא תֹאמַר שֶׁהָיוּ נָעִים וּמְטֻלְטָלִים מִמַּסָּע לְמַסָּע כָּל אַרְבָּעִים שָׁנָה וְלֹא הָיְתָה לָהֶם מְנוּחָה, שֶׁהֲרֵי אֵין כָּאן אֶלָּא אַרְבָּעִים וּשְׁתַּיִם מַסָּעוֹת, צֵא מֵהֶם י\"ד שֶׁכֻּלָּם הָיוּ בְּשָׁנָה רִאשׁוֹנָה קֹדֶם גְּזֵרָה, מִשֶּׁנָּסְעוּ מֵרַעְמְסֵס עַד שֶׁבָּאוּ לְרִתְמָה שֶׁמִּשָּׁם נִשְׁתַּלְּחוּ מְרַגְּלִים, שֶׁנֶּאֱמַר \"וְאַחַר נָסְעוּ הָעָם מֵחֲצֵרוֹת\" וְגוֹ' (במדבר י\"ב), \"שְׁלַח לְךָ אֲנָשִׁים\" וְגוֹ' (שם י\"ג), וְכָאן (פסוק י\"ח) הוּא אוֹמֵר \"וַיִּסְעוּ מֵחֲצֵרֹת וַיַּחֲנוּ בְּרִתְמָה\", לָמַדְתָּ שֶׁהִיא בְמִדְבַּר פָּארָן; וְעוֹד הוֹצֵא מִשָּׁם ח' מַסָּעוֹת שֶׁהָיוּ לְאַחַר מִיתַת אַהֲרֹן — מֵהֹר הָהָר עַד עַרְבוֹת מוֹאָב — בִּשְׁנַת הָאַרְבָּעִים, נִמְצָא שֶׁכָּל שְׁמוֹנֶה וּשְׁלֹשִׁים שָׁנָה לֹא נָסְעוּ אֶלָּא עֶשְׂרִים מַסָּעוֹת, זֶה מִיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה. וְרַבִּי תַנְחוּמָא דָרַשׁ בּוֹ דְּרָשָׁה אַחֶרֶת: מָשָׁל לְמֶלֶךְ שֶׁהָיָה בְנוֹ חוֹלֶה וְהוֹלִיכוֹ לְמָקוֹם רָחוֹק לְרַפֹּאתוֹ, כֵּיוָן שֶׁהָיוּ חוֹזְרִין הִתְחִיל אָבִיו מוֹנֶה כָל הַמַּסָּעוֹת, אָמַר לוֹ, כָּאן יָשַׁנְנוּ, כָּאן הוֹקַרְנוּ, כָּאן חָשַׁשְׁתָּ אֶת רֹאשְׁךָ וְכוּ':", "rashi_en": "אלה מסעי THESE ARE THE JOURNEYS (STAGES) [OF THE CHILDREN OF ISRAEL] — Why are these stations recorded here? In order to make known the loving acts of the Omnipresent: that although He had decreed against them to make them move about and wander in the wilderness, you should not think that they wandered and moved about without cessation from one station to another station all the forty years, and that they had no rest, for you see that there are here only forty-two stages. Deduct from them fourteen, all of which were their stopping places in the first year after they left Egypt, before the decree was made, viz., from the time when they journeyed from Rameses until when they came to Rithmah whence the spies were sent out — as it is said. (Numbers 12:16): “And afterwards the people journeyed from Hazeroth, [and encamped in the wilderness of Paran], whereupon the Lord said unto Moses, (Numbers 13:2) \"Send thee men [who may search out the land]”; and here (v. 18) it states, “and they journeyed from Hazeroth and they encamped in Rithmah”, so you learn that it (Rithmah) is in the wilderness of Paran. — Further deduct from them the eight stages which were after Aaron’s death viz., those from Mount Hor to the plains of Moab in the fourtieth year (v. 38). It follows that during the whole of the thirty eight years they made only twenty journeys. This is excerpted from the work of R. Moses the Preacher. — R. Tanchuma gave another explanation of it (of the question why these stages are here recorded). A parable! It may be compared to the case of a king whose son was ill and whom he took to a distant place to cure him. When they returned home the father began to enumerate all the stages, saying to him, “Here we slept, here we caught cold, here you had the head-ache, etc.” (Midrash Tanchuma 4:10:3."}, {"ch": 33, "v": 2, "aliyah": 4, "heb": "וַיִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת־מוֹצָאֵיהֶ֛ם לְמַסְעֵיהֶ֖ם עַל־פִּ֣י יְהֹוָ֑ה וְאֵ֥לֶּה מַסְעֵיהֶ֖ם לְמוֹצָאֵיהֶֽם׃", "onk": "וּכְתַב משֶׁה יָת מַפְּקָנֵיהוֹן לְמַטְּלָנֵיהוֹן עַל מֵימְרָא דַיְיָ וְאִלֵּין מַטְּלָנֵיהוֹן לְמַפְּקָנֵיהוֹן:", "onk_en": "Moshe recorded their departures for their journeys according to Adonoy’s command; these were the departure for their journeys.", "pj": "וּכְתַב משֶׁה יַת מַפְקָנֵיהוֹן לְמַטְלָנֵיהוֹן עַל מֵימַר דַיְיָ וְאִלְיֵין מַטְלָנֵיהוֹן לְמַפְקָנֵיהוֹן", "pj_en": "And Mosheh recorded their outgoings by their journeys by the Word of the Lord; and these are their journeys by their goings forth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 3, "aliyah": 4, "heb": "וַיִּסְע֤וּ מֵֽרַעְמְסֵס֙ בַּחֹ֣דֶשׁ הָרִאשׁ֔וֹן בַּחֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַחֹ֣דֶשׁ הָרִאשׁ֑וֹן מִֽמׇּחֳרַ֣ת הַפֶּ֗סַח יָצְא֤וּ בְנֵֽי־יִשְׂרָאֵל֙ בְּיָ֣ד רָמָ֔ה לְעֵינֵ֖י כׇּל־מִצְרָֽיִם׃", "onk": "וּנְטָלוּ מְרַעְמְסֵס בְּיַרְחָא קַדְמָאָה בְּחַמְשָׁא עַשְׂרָא יוֹמָא לְיַרְחָא קַדְמָאָה מִבָּתַר יוֹמָא דְפִּסְחָא נְפָקוּ בְנֵי יִשְׂרָאֵל <b>בְּרֵישׁ גְּלֵי<\/b> לְעֵינֵי כָּל מִצְרָאֵי:", "onk_en": "They journeyed from Ra’meses in the first month—on the fifteenth day of the first month—on the day after the [Korban] <i>Pesach,<\/i> Bnei Yisroel left triumphantly [<b>publicly<\/b>] before the eyes of all Egyptians.", "pj": "וּנְטָלוּ מִן פִּילוּסִין בְּיַרְחָא דְנִיסָן בַּחֲמֵשַׁת עַסְרָא יוֹמָא לְיַרְחָא קַדְמָאָה מִבָּתַר דְאָכְלוּ נִכְסַת פִּסְחָא נְפָקוּ בְּנֵי יִשְרָאֵל בְּרֵישׁ גְלֵי לְמֵחְמֵיהוֹן דְכָל מִצְרָאֵי", "pj_en": "They departed from Pelusin in the month of Nisan, on the fifteenth day of the month; after they had eaten the sacrifice of the Pascha did the children of Israel go forth, with uncovered head, in sight of all the Mizraee.", "tj": "וּנְטָלוּ מִן פִּלוּסִין בְּיַרְחָא קַדְמָאָה:", "tj_en": "And they went out from Pelusin in the first month.", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 4, "aliyah": 4, "heb": "וּמִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהֹוָ֛ה בָּהֶ֖ם כׇּל־בְּכ֑וֹר וּבֵאלֹ֣הֵיהֶ֔ם עָשָׂ֥ה יְהֹוָ֖ה שְׁפָטִֽים׃", "onk": "וּמִצְרָאֵי מְקַבְּרִין יָת דִּי קְטַל יְיָ בְּהוֹן כָּל בּוּכְרָא <b>וּבְטַעֲוַתְהוֹן<\/b> עֲבַד יְיָ דִּינִין:", "onk_en": "Egypt was burying that which Adonoy had struck among them—all their firstborn—and on their idols [<b>abominations<\/b>] Adonoy had inflicted punishments.", "pj": "וּמִצְרָאֵי מְקַבְּרִין יַת דְקָטַל יְיָ בְּהוֹן כָּל בּוּכְרָא וּבְטַעֲוַותְהוֹן עָבַד מֵימַר דַיְיָ דִינִין טַעֲוַות מַתְּכָא הֲווֹ מִתְרַכְּכִין טַעֲוַות אַבְנָא מִתְגַדְעִין טַעֲוַות פַּחְרָא מִתְעַבְּדִין בְּקִיקִין טַעֲוִוין דְעָא מִתְעַבְּדִין קְטוֹם וְדִבְעִירֵי מַיְיתוּן", "pj_en": "And the Mizraee buried those whom the Lord had killed among them, even all the first-born; and upon their idols did the Word of the Lord do judgments; their molten idols were dissolved, their idols of stone were mutilated, their idols of earthenware broken in pieces, their wooden idols turned to ashes, and their cattle gods were slain with death.", "tj": "", "tj_en": "", "rashi": "<b>ומצרים מקברים.<\/b> טְרוּדִים בְּאֶבְלָם:", "rashi_en": "ומצרים מקברים AND THIS EGYPTIANS WERE BURYING [ALL THEIR FIRSTBORN] — they were busily occupied in their mourning."}, {"ch": 33, "v": 5, "aliyah": 4, "heb": "וַיִּסְע֥וּ בְנֵֽי־יִשְׂרָאֵ֖ל מֵרַעְמְסֵ֑ס וַֽיַּחֲנ֖וּ בְּסֻכֹּֽת׃", "onk": "וּנְטָלוּ בְנֵי יִשְׂרָאֵל מֵרַעְמְסֵס וּשְׁרוֹ בְּסֻכֹּת:", "onk_en": "Bnei Yisroel journeyed from Ra’meses and camped in Succos.", "pj": "וּנְטָלוּ בְּנֵי יִשְרָאֵל מִן פִּילוּסִין וּשְׁרוֹ בְּסֻכּוֹת אַתְרָא דְאִתְחַפִּיאוּ שִׁבְעַת עֲנָנֵי יְקָרָא", "pj_en": "And the sons of Israel went forth from Pelusin, and encamped in Sukkoth, a place where they were protected by seven glorious clouds.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 6, "aliyah": 4, "heb": "וַיִּסְע֖וּ מִסֻּכֹּ֑ת וַיַּחֲנ֣וּ בְאֵתָ֔ם אֲשֶׁ֖ר בִּקְצֵ֥ה הַמִּדְבָּֽר׃", "onk": "וּנְטָלוּ מִסֻּכֹּת וּשְׁרוֹ בְאֵתָם דִּי בִּסְטַר מַדְבְּרָא:", "onk_en": "They journeyed from Succos and camped in Eisom which is on the edge of the wilderness.", "pj": "וּנְטָלוּ מִסֻכּוֹת וּשְׁרוֹ בְּאֵיתָם דְבִסְטַר מַדְבְּרָא", "pj_en": "And they removed from Sukkoth, and encamped in Etham, on the side of the wilderness.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 7, "aliyah": 4, "heb": "וַיִּסְעוּ֙ מֵֽאֵתָ֔ם וַיָּ֙שׇׁב֙ עַל־פִּ֣י הַחִירֹ֔ת אֲשֶׁ֥ר עַל־פְּנֵ֖י בַּ֣עַל צְפ֑וֹן וַֽיַּחֲנ֖וּ לִפְנֵ֥י מִגְדֹּֽל׃", "onk": "וּנְטָלוּ מֵאֵתָם וְתָב עַל פּוּם חִירָתָא דִּי קֳדָם בְּעֵל צְפוֹן וּשְׁרוֹ קֳדָם מִגְדֹּל:", "onk_en": "They journeyed from Eisom and turned back to Pi Hachiros facing Ba’al Tzefon, and they camped by Migdol.", "pj": "וּנְטָלוּ מֵאֵיתָם וְתָבוּ עַל פּוּמֵי חִירָתָא מְרַבְעָתָא דִקְדָם טַעֲוַות צְפוֹן וּשְׁרוֹ קֳדָם מִגְדוֹל", "pj_en": "They removed from Etham, and returned unto Pumey Hiratha, which lie in front of the idol of Zephon, and encamped before Migdol.", "tj": "וּנְטָלוּ מֵאֵיתָן וְחָזְרוּ לְפּוּנְדְקֵי חֵירָתָא דְאִית עַל אַפֵּי טַעֲוָותָא:", "tj_en": "And removing from Etham. they returned to the caravansaries of Hiratha, which are in front of the idols.", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 8, "aliyah": 4, "heb": "וַיִּסְעוּ֙ מִפְּנֵ֣י הַֽחִירֹ֔ת וַיַּֽעַבְר֥וּ בְתוֹךְ־הַיָּ֖ם הַמִּדְבָּ֑רָה וַיֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּמִדְבַּ֣ר אֵתָ֔ם וַֽיַּחֲנ֖וּ בְּמָרָֽה׃", "onk": "וּנְטָלוּ מִן <b>פּוּם<\/b> חִירָתָא וַעֲבָרוּ בְּגוֹ יַמָּא לְמַדְבְּרָא וַאֲזָלוּ מַהֲלַךְ תְּלָתָא יוֹמִין בְּמַדְבְּרָא דְאֵתָם וּשְׁרוֹ בְּמָרָה:", "onk_en": "They journeyed from before [<b>Pi<\/b>] Hachiros and crossed amidst the sea toward the wilderness. They traveled for three days in the wilderness of Eisom, and camped in Moroh.", "pj": "וּנְטָלוּ מִפּוֹרוֹקֵי חֵירָתָא וַעֲבָרוּ בְּגוֹ יַמָא וּנְפָקוּ מִן יַמָא וַאֲזָלוּ עַל כֵּיף יַמָא כְּנִישִׁין אוּנְכִין וּמַרְגַלְיַין וַאֲזָלוּ מִבָּתַר כְּדֵין מַהֲלַךְ תְּלָתָא יוֹמִין בְּמַדְבְּרָא דְאֵיתָם וּשְׁרוֹ בְּמָרָה", "pj_en": "And from the caravansaries of Hiratha they removed, and passed through the midst of the sea, and went upon the shore of the sea, collecting onyx stones and pearls. Afterwards they proceeded three days' journey in the wilderness of Etham, and encamped in Marah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"
