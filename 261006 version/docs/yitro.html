<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "yitro";
const DATA = [{"ch": 18, "v": 1, "aliyah": 1, "heb": "וַיִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כׇּל־אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְמֹשֶׁ֔ה וּלְיִשְׂרָאֵ֖ל עַמּ֑וֹ כִּֽי־הוֹצִ֧יא יְהֹוָ֛ה אֶת־יִשְׂרָאֵ֖ל מִמִּצְרָֽיִם׃", "onk": "וּשְׁמַע יִתְרוֹ <b>רַבָּא<\/b> דְמִדְיָן חֲמוּהִי דְמשֶׁה יַת כָּל דִי עֲבַד יְיָ לְמשֶׁה וּלְיִשְׂרָאֵל עַמֵהּ אֲרֵי אַפִּיק יְיָ יָת יִשְׂרָאֵל מִמִצְרָיִם:", "onk_en": "Yisro heard—priest [<b>minister<\/b>] of Midian, Moshe’s father-in-law—about all that Elohim had done for Moshe and for His people Yisrael, that Adonoy brought Yisrael out of Egypt.", "pj": "וישמע וּשְׁמַע יִתְרוֹ אוֹנוֹס מִדְיָן חָמוּי דְמשֶׁה יַת כָּל מַאן דְּעָבִיד יְיָ לְמשֶׁה וּלְיִשְרָאֵל עַמֵּיהּ אֲרוּם אַפֵּיק יְיָ יַת יִשְרָאֵל מִמִּצְרָיִם", "pj_en": "And Jethro, prince of Midian, the father-in-law of Mosheh, heard all that the Lord had done for Mosheh and for Israel His people, and that the Lord had brought forth Israel from Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>וישמע יתרו.<\/b> מַה שְּׁמוּעָה שָׁמַע וּבָא? קְרִיעַת יַם סוּף וּמִלְחֶמֶת עֲמָלֵק:<br><br><b>יתרו.<\/b> שֶׁבַע שֵׁמוֹת נִקְרְאוּ לוֹ: רְעוּאֵל, יֶתֶר, יִתְרוֹ, חוֹבָב, חֶבֶר, קֵינִי, פּוּטִיאֵל; יֶתֶר, עַל שֵׁם שֶׁיִּתֵּר פָּרָשָׁה אַחַת בַּתּוֹרָה \"וְאַתָּה תֶחֱזֶה\"; יִתְרוֹ, לִכְשֶׁנִּתְגַּיֵּר וְקִיֵּם הַמִּצְווֹת, הוֹסִיפוֹ לוֹ אוֹת אֶחָד עַל שְׁמוֹ; חוֹבָב, שֶׁחִבֵּב אֶת הַתּוֹרָה; חוֹבָב הוּא יִתְרוֹ שֶׁנֶּאֱמַר \"מִבְּנֵי חוֹבָב חֹתֵן מֹשֶׁה\" (שופטים ד'), וְיֵשׁ אוֹמְרִים רְעוּאֵל אָבִיו שֶׁל יִתְרוֹ, וּמַהוּ אוֹמֵר \"וַתָּבֹאנָה אֶל רְעוּאֵל אֲבִיהֶן\"? שֶׁהַתִּינוֹקוֹת קוֹרִין לַאֲבִי אֲבִיהֶן אַבָּא. בְּסִפְרֵי:<br><br><b>חתן משה.<\/b> כָּאן הָיָה יִתְרוֹ מִתְכַּבֵּד בְּמֹשֶׁה – אֲנִי חוֹתֵן הַמֶּלֶךְ, וּלְשֶׁעָבַר הָיָה מֹשֶׁה תוֹלֶה הַגְּדֻלָּה בְּחָמִיו, שֶׁנֶּאֱמַר \"וַיָּשָׁב אֶל יֶתֶר חוֹתְנוֹ\" (שמות ד'):<br><br><b>למשה ולישראל.<\/b> שָׁקוּל מֹשֶׁה כְּנֶגֶד כָּל יִשְׂרָאֵל (מכילתא):<br><br><b>את כל אשר עשה.<\/b> לָהֶם בִּירִידַת הַמָּן וּבַבְּאֵר וּבַעֲמָלֵק:<br><br><b>כי הוציא ה' וגו'.<\/b> זוֹ גְּדוֹלָה עַל כֻּלָּם (שם):", "rashi_en": "וישמע יתרו AND JETHRO HEARD — What was the particular report which he heard so that he came? — The division of the Red Sea and the war with Amalek (cf. (Mekhilta; Zevachim 116a).<br><br>יתרו JETHRO — He was called by seven names: Reuel, Jether, Jethro, Hobab, Heber, Keni and Putiel. He was called Jether (from יִתֵּר “to add”) because he added (it was through him that there was added) a section to the Torah; viz., that beginning at (21 ff.) “Moreover thou shalt provide”. Jethro — so was he called because when he became a proselyte and fulfilled the divine precepts one more letter was added to his name (יתר). Hobab — because he loved (חִבֵּב) the Torah (cf. Mekhilta). — Hobab is certainly identical with Jethro, as it is said, (Judges 4:11) “of the sons of Hobab, the father-in-law of Moses” and therefore it is correct to say that Hobab is one of his names. But as to Reuel there are some who say that he is not identical with Jethro, but that he was Hobab’s (Jethro’s) father, as may be seen from Numbers 10:29. Then what, according to this view, would be the meaning of (Exodus 2:18) “And they came to Reuel, their father” (from which it would appear that Reuel and Jethro are the same)? It means their grandfather, for children call their grandfather: father. This is to be found in Sifrei Bamidbar 78 (on Numbers 10:29).<br><br>חתן משה MOSES’ FATHER-IN-LAW — Here Jethro prided himself on his relationship to Moses: I, the father-in-law of the king. Previously, however, Moses had made whatever greatness he had hinge upon his relationship to his father-in-law, the chieftain of Midian, as it is said, (Exodus 4:18) “And he returned to Jethro, his father-in-law” (Mekhilta).<br><br>למשה ולישראל TO MOSES AND TO ISRAEL — Moses alone is of equal in importance to all Israel (Mekhilta).<br><br>את כל אשר עשה ALL THAT [GOD] HAD DONE for them through the falling of the Manna and through the well (cf. Rashi on Numbers 21:17) and by the defeat of Amalek.<br><br>כי הוציא ה׳ וגו׳ THAT THE LORD HAD BROUGHT FORTH etc. — this was greater than all other things, and is therefore singled out for mention (cf. Mekhilta)."}, {"ch": 18, "v": 2, "aliyah": 1, "heb": "וַיִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת־צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽיהָ׃", "onk": "וּדְבַר יִתְרוֹ חֲמוּהִי דְמשֶׁה יָת צִפֹּרָה אִתַּת משֶׁה בָּתַר דְפַטְרַהּ:", "onk_en": "Moshe’s father-in-law, Yisro took Moshe’s wife, Tzipporah, after he had sent her back [home],", "pj": "וּדְבַר יִתְרוֹ חָמוּי דְמשֶׁה יַת צִפּוֹרָה אִנְתְּתֵיהּ דְּמשֶׁה בָּתַר דְּשַׁלְּחָהּ מִלְּוָתֵיהּ כַּד הֲוָה אָזִיל לְמִצְרָיִם", "pj_en": "And Jethro the father-in-law of Mosheh took Zipporah his wife, whom Mosheh had sent back from him after going into Mizraim,", "tj": "", "tj_en": "", "rashi": "<b>אחר שלוחיה.<\/b> כְּשֶׁאָמַר לוֹ הַקָּבָּ\"ה בְּמִדְיָן לֵךְ שֻׁב מִצְרָיִם וַיִּקַּח מֹשֶׁה אֶת אִשְׁתּוֹ וְאֶת בָּנָיו וְגוֹ' וְיָצָא אַהֲרֹן לִקְרָאתוֹ וַיִּפְגְּשֵׁהוּ בְּהַר הָאֱלֹהִים (שמות ד'), אָמַר לוֹ מִי הֵם הַלָּלוּ? אָמַר לוֹ זוֹ הִיא אִשְׁתִּי שֶׁנָּשָׂאתִי בְּמִדְיָן וְאֵלּוּ בָנַי, אָמַר לוֹ וְהֵיכָן אַתָּה מוֹלִיכָן? אָמַר לוֹ לְמִצְרַיִם, אָמַר לוֹ עַל הָרִאשׁוֹנִים אָנוּ מִצְטַעֲרִים וְאַתָּה בָא לְהוֹסִיף עֲלֵיהֶם אָמַר לָהּ לְכִי לְבֵית אָבִיךְ, נָטְלָה שְׁנֵי בָנֶיהָ וְהָלְכָה לָהּ (מכילתא):", "rashi_en": "אחר שלוחיה AFTER HIS HAVING SENT HER AWAY — When God said to him in Midian, (Exodus 4:19, 20) “Go, return to Egypt … and Moses took his wife and his sons etc…. and Aaron went forth towards him and met him at the Mount of God”, he (Aaron) said to him, “Who are these?” He answered him, “This is my wife whom I married in Midian and these are my children”. He, thereupon, asked him, “Whither are you taking them?” He replied, “To Egypt”. Where-upon he said to him, “We have cause to grieve over the former ones (the Israelites already there), and you propose to add to their number!” Moses therefore said to her, “Return to your father’s house” — she took her two sons and went away (Mekhilta)."}, {"ch": 18, "v": 3, "aliyah": 1, "heb": "וְאֵ֖ת שְׁנֵ֣י בָנֶ֑יהָ אֲשֶׁ֨ר שֵׁ֤ם הָֽאֶחָד֙ גֵּֽרְשֹׁ֔ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּאֶ֖רֶץ נׇכְרִיָּֽה׃", "onk": "וְיָת תְּרֵין בְּנָהָא דִי שׁוּם חַד גֵרְשֹׁם אֲרֵי אֲמַר דַיָר הֲוֵיתִי בְּאַרְעָא נוּכְרָאָה:", "onk_en": "along with her two sons. The name of one was Gershom, because he [Moshe] had said, “I was a stranger in an alien land.”", "pj": "וְיַת תְּרֵין בְּנָהָא דְּשׁוּם חָד גֵּרְשׁוֹם אֲרוּם אָמַר דַּיָּיר הֲוֵיתִי בְּאַרְעָא נוּכְרָאָה דְלָא דִידִי הוּא", "pj_en": "and his two sons, the name of the one of whom was Gershom, Because He had said, I am a dweller in a strange land which is not mine;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 4, "aliyah": 1, "heb": "וְשֵׁ֥ם הָאֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי־אֱלֹהֵ֤י אָבִי֙ בְּעֶזְרִ֔י וַיַּצִּלֵ֖נִי מֵחֶ֥רֶב פַּרְעֹֽה׃", "onk": "וְשׁוּם חַד אֱלִיעֶזֶר אֲרֵי אֱלָהָא דְאַבָּא הֲוָה בְסַעְדִי וְשֵׁזְבַנִי מֵחַרְבָּא דְפַרְעֹה:", "onk_en": "The name of the [other] one was Eliezer, because the God of my father was my help, and rescued me from the sword of Pharaoh.", "pj": "וְשׁוּם חָד אֱלִיעֶזֶר אֲרוּם אֱלָהָא דְאַבָּא הֲוָה בְּסַעֲדֵי וְשֵׁיזְבַנִי מֵחַרְבָּא דְפַרְעה", "pj_en": "and the name of the other Eliezer, For (he had said) the God of my fathers was my helper, and saved me from the sword of Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>ויצלני מחרב פרעה.<\/b> כְּשֶׁגִּלּוּ דָּתָן וַאֲבִירָם עַל דְּבַר הַמִּצְרִי וּבִקֵּשׁ לַהֲרֹג אֶת מֹשֶׁה נַעֲשָׂה צַוָּארוֹ כְּעַמּוּד שֶׁל שַׁיִשׁ (שם):", "rashi_en": "ויצלני מחרב פרעה AND HE DELIVERED ME FROM THE SWORD OF PHARAOH — When Dathan and Abiram made the disclosure regarding the matter of the Egyptian whom Moses had killed and Pharaoh wished to slay Moses, his neck became as a column of marble so that the sword was powerless against him (Shemot Rabbah 1:31; cf. Rashi on Exodus 2:15)."}, {"ch": 18, "v": 5, "aliyah": 1, "heb": "וַיָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּבָנָ֥יו וְאִשְׁתּ֖וֹ אֶל־מֹשֶׁ֑ה אֶל־הַמִּדְבָּ֗ר אֲשֶׁר־ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָאֱלֹהִֽים׃", "onk": "וַאֲתָא יִתְרוֹ חֲמוּהִי דְמשֶׁה וּבְנוֹהִי וְאִתְּתֵהּ לְוָת משֶׁה לְמַדְבְּרָא דִי הוּא שָׁרֵי תַמָן לְטוּרָא <b>דְאִתְגְלֵי עֲלוֹהִי יְקָרָא דַ<\/b>יְיָ:", "onk_en": "Moshe’s father-in-law, Yisro came, along with his [Moshe’s] sons, and wife, to Moshe, to the desert where he was camped near the mountain [<b>upon which the Glory<\/b>] of God [<b>was revealed<\/b>].", "pj": "וְאָתָא יִתְרוֹ חָמוֹי דְמשֶׁה וּבְנוֹי דְמשֶׁה וְאִנְתְּתֵיהּ לְוַת משֶׁה לְמַדְבְּרָא דְהוּא שָׁרֵי תַּמָּן סְמִיךְ לְטַוְורָא דְאִתְגְּלֵי עֲלוֹי יְקָרָא דַיְיָ לְמשֶׁה מִן שֵׁירוּיָא", "pj_en": "And Jethro the father-in-law of Mosheh, and the sons of Mosheh, and his wife came to Mosheh at the desert in which be was sojourning hard by the mountain upon which the glory of the Lord was revealed to Mosheh at the beginning.", "tj": "", "tj_en": "", "rashi": "<b>אל המדבר.<\/b> אַף אָנוּ יוֹדְעִים שֶׁבַּמִּדְבָּר הָיוּ אֶלָּא בְּשִׁבְחוֹ שֶׁל יִתְרוֹ דִּבֵּר הַכָּתוּב, שֶׁהָיָה יוֹשֵׁב בִּכְבוֹדוֹ שֶׁל עוֹלָם וּנְדָבוֹ לִבּוֹ לָצֵאת אֶל הַמִּדְבָּר, מְקוֹם תֹּהוּ לִשְׁמֹעַ דִּבְרֵי תוֹרָה (שם):", "rashi_en": "אל המדבר INTO THE DESERT — Indeed we know that they were in the wilderness, and it appears unnecessary to state that Jethro came to Moses there. But by stressing this Scripture is speaking in praise of Jethro: that he was living amidst all the splendour that the world could provide, and nevertheless his heart prompted him to go forth into the desert, a waste place (Mekhilta), to hearken to the words of the Torah."}, {"ch": 18, "v": 6, "aliyah": 1, "heb": "וַיֹּ֙אמֶר֙ אֶל־מֹשֶׁ֔ה אֲנִ֛י חֹתֶנְךָ֥ יִתְר֖וֹ בָּ֣א אֵלֶ֑יךָ וְאִ֨שְׁתְּךָ֔ וּשְׁנֵ֥י בָנֶ֖יהָ עִמָּֽהּ׃", "onk": "וַאֲמַר לְמשֶׁה אֲנָא חֲמוּךְ יִתְרוֹ אָתֵי לְוָתָךְ וְאִתְּתָךְ וּתְרֵין בְּנָהָא עִמַהּ:", "onk_en": "He said to Moshe, “I, your father-in-law, Yisro, am coming to you along with your wife; her two sons are with her.”", "pj": "וַאֲמַר לְמשֶׁה אָנָא חָמוּךְ יִתְרוֹ אָתֵי לְוָותָךְ לְאִתְגַיְירָא וְאִין לָא תְקַבֵּל יָתִי בְּגִינִי תְּקַבֵּיל בְּגִין אִנְתְּתָךְ וּתְרֵין בְּנָהָא דְעִמָהּ", "pj_en": "And he said to Mosheh, I, thy father-in-law Jethro, have come to thee to be a proselyte; and if thou wilt not receive me on my own account, receive me for the sake of thy wife and of her two sons who are with her.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר אל משה.<\/b> עַ\"יְ שָׁלִיחַ (שם):<br><br><b>אני חתנך יתרו וגו'.<\/b> אִם אֵין אַתָּה יוֹצֵא בְגִינִי, צֵא בְגִין אִשְׁתְּךָ, וְאִם אֵין אַתָּה יוֹצֵא בְגִין אִשְׁתְּךָ, צֵא בְגִין שְׁנֵי בָנֶיהָ (שם):", "rashi_en": "ויאמר אל משה AND HE SAID UNTO MOSES through a messenger (Mekhilta).<br><br>אני חתנך יתרו וגו I, THY FATHER-IN-LAW, JETHRO etc. — If you will not come out for my own sake, come out for the sake of your wife; and if you will not come out for your wife’s sake, come out for the sake of your two sons (Mekhilta)."}, {"ch": 18, "v": 7, "aliyah": 1, "heb": "וַיֵּצֵ֨א מֹשֶׁ֜ה לִקְרַ֣את חֹֽתְנ֗וֹ וַיִּשְׁתַּ֙חוּ֙ וַיִּשַּׁק־ל֔וֹ וַיִּשְׁאֲל֥וּ אִישׁ־לְרֵעֵ֖הוּ לְשָׁל֑וֹם וַיָּבֹ֖אוּ הָאֹֽהֱלָה׃", "onk": "וּנְפַק משֶׁה לְקַדָמוּת חֲמוּהִי וּסְגִיד וּנְשִׁיק לֵהּ וּשְׁאִילוּ גְבַר לְחַבְרֵהּ לִשְׁלָם וְעַלוּ לְמַשְׁכְּנָא:", "onk_en": "Moshe went out to greet his father-in-law. He prostrated himself and [then] kissed him. They asked after each other’s well being, and went into the tent.", "pj": "וּנְפַק משֶׁה מִתְּחוֹת עֲנָנָא יְקָרָא לִקְדָמוּת חָמוֹי וּסְגִיד וּנְשֵׁיק לֵיהּ וְגַיְירֵיהּ וְשַׁיְילוּ גְּבַר לְחַבְרֵיהּ לִשְׁלָם וְאָתוּ לְמַשְׁכַּן בֵּית אוּלְפָנָא", "pj_en": "And Mosheh came forth from under the cloud of glory to meet his father-in-law, and did obeisance, and kissed him and made him a proselyte; and they asked of each other's welfare, and came to the tabernacle, the house of instruction.", "tj": "", "tj_en": "", "rashi": "<b>ויצא משה.<\/b> כָּבוֹד גָּדוֹל נִתְכַּבֵּד יִתְרוֹ בְּאוֹתָהּ שָׁעָה, כֵּיוָן שֶׁיָּצָא מֹשֶׁה, יָצָא אַהֲרֹן נָדָב וַאֲבִיהוּא, וּמִי הוּא שֶׁרָאָה אֶת אֵלּוּ יוֹצְאִין וְלֹא יֵצֵא? (תנחומא):<br><br><b>וישתחו וישק לו.<\/b> אֵינִי יוֹדֵעַ מִי הִשְׁתַּחֲוָה לְמִי, כְּשֶׁהוּא אוֹמֵר אִישׁ לְרֵעֵהוּ, מִי הַקָּרוּי \"אִישׁ\" – מֹשֶׁה, שֶׁנֶּאֱמַר \"וְהָאִישׁ מֹשֶׁה\" (במדבר י\"ב):", "rashi_en": "ויצא משה AND MOSES WENT OUT — Great honour, indeed, did Jethro receive at that moment, for as soon as Moses went out to Jethro, Aaron, Nadab and Abihu went out, and who was it that saw these go out and would not himself go out? (Midrash Tanchuma, Vayigash 7)<br><br>וישתחו וישק לו AND HE PROSTRATED HIMSELF AND KISSED HIM — From the wording of this statement I do not know who prostrated himself to whom! But when it states in the next words: איש לרעהו, “a man to his fellow”, it becomes quite evident; for which of the two is called by the appellation איש, “man”? — This was Moses, as it is said, (Numbers 12:3) “And the man, Moses”. (Thus it was the man (איש) Moses, who bowed down to his fellow (Mekhilta)."}, {"ch": 18, "v": 8, "aliyah": 1, "heb": "וַיְסַפֵּ֤ר מֹשֶׁה֙ לְחֹ֣תְנ֔וֹ אֵת֩ כׇּל־אֲשֶׁ֨ר עָשָׂ֤ה יְהֹוָה֙ לְפַרְעֹ֣ה וּלְמִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כׇּל־הַתְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַם בַּדֶּ֔רֶךְ וַיַּצִּלֵ֖ם יְהֹוָֽה׃", "onk": "וְאִשְׁתָּעִי משֶׁה לַחֲמוּהִי יָת כָּל דִי עֲבַד יְיָ לְפַרְעֹה וּלְמִצְרָאֵי עַל עֵסַק יִשְׂרָאֵל יָת כָּל עַקְתָא דִי אַשְׁכַּחְתִּנוּן בְּאָרְחָא וְשֵׁזְבָנוּן יְיָ:", "onk_en": "Moshe told his father-in-law all that Adonoy had done to Pharaoh and to Egypt for the sake of Yisrael; including all the hardship that had befallen them on the way, and [how] Adonoy had rescued them.", "pj": "וְתַנִי משֶׁה לְחָמוֹי יַת כָּל מַה דְּעָבַד יְיָ לְפַרְעה וּלְמִצְרָאֵי עַל עֵיסַק יִשְרָאֵל יַת כָּל עַקְתָא דְאַשְׁכְּחַתְנוּן בְּאָרְחָא עַל יַמָא דְסוּף וּבְמָרָה וּבִרְפִידִים וְהֵיךְ אַגַח עִמְהוֹן עֲמָלֵק וְשֵׁיזְבִינוּן יְיָ", "pj_en": "And Mosheh recounted to his father-in-law all that the Lord had done to Pharoh and to the Mizraee on behalf of Israel; all the hardship they had found in the way, at the sea of Suph, and at Marah, and at Rephidim, and how Amalek had fought with them, and the Lord had delivered them.", "tj": "", "tj_en": "", "rashi": "<b>ויספר משה לחתנו.<\/b> לִמְשֹׁךְ אֶת לִבּוֹ לְקָרְבוֹ לַתּוֹרָה (מכילתא):<br><br><b>את כל התלאה.<\/b> שֶׁעַל הַיָּם וְשֶׁל עֲמָלֵק:<br><br><b>התלאה.<\/b> לָמֶ\"ד אָלֶ\"ף מִן הַיְסוֹד שֶׁל תֵּבָה, וְהַתָּי\"ו הוּא תִּקּוּן וִיסוֹד הַנּוֹפֵל מִמֶּנּוּ לִפְרָקִים; וְכֵן תְּרוּמָה, תְּנוּפָה, תְּקוּמָה, תְּנוּאָה:", "rashi_en": "ויספר משה לחתנו AND MOSES RELATED TO HIS FATHER-IN-LAW [ALL THAT THE LORD HAD DONE] — in order to allure his heart that he might attach him to the Torah (Mekhilta).<br><br>את כל התלאה ALL THE TRAVAIL that they had experienced at the Red Sea, and that caused by Amalek (Mekhilta).<br><br>התלאה — The ל and א are part of the primary form of the word and the ת is a formative letter and a part of the primary form of the noun which sometimes is omitted from it. Similar examples are תרומה and תנופה and תקומה and תנואה."}, {"ch": 18, "v": 9, "aliyah": 1, "heb": "וַיִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כׇּל־הַטּוֹבָ֔ה אֲשֶׁר־עָשָׂ֥ה יְהֹוָ֖ה לְיִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖וֹ מִיַּ֥ד מִצְרָֽיִם׃", "onk": "וַחֲדִי יִתְרוֹ עַל כָּל טַבְתָא דִי עֲבַד יְיָ לְיִשְׂרָאֵל דִי שֵׁזְבֵיהּ מִידָא דְמִצְרָאֵי:", "onk_en": "Yisro rejoiced over all the good that Adonoy had done for Yisrael; that He had rescued them from the hand of Egypt.", "pj": "וּבְדַח יִתְרוֹ עַל כָּל טַבְתָא דְעָבַד יְיָ לְיִשְרָאֵל דִּיהַב לְהוֹן מַנָא וּבֵירָא וְדִי שֵׁיזְבִינִין מִן יְדָא דְמִצְרָאֵי", "pj_en": "And Jethro rejoiced over all the good which the Lord had done unto Israel, and that He had given them manna, and the well, and that he had saved them from the hand of the Mizraee.", "tj": "", "tj_en": "", "rashi": "<b>ויחד יתרו.<\/b> וַיִּשְׂמַח יִתְרוֹ, זֶהוּ פְּשׁוּטוֹ. וּמִ\"אַ נַעֲשָׂה בְשָׂרוֹ חִדּוּדִין חִדּוּדִין, מֵצֵר עַל אִבּוּד מִצְרַיִם, הַינוּ דְּאָמְרֵי אִינָשֵׁי \"גִּיּוֹרָא עַד עֲשָׂרָה דָּרֵי לָא תְבַזֵּי אֲרַמָּאָה בְּאַפֵּיהּ\":<br><br><b>על כל הטובה.<\/b> טוֹבַת הַמָּן וְהַבְּאֵר וְהַתּוֹרָה, וְעַל כֻּלָּן <b>אשר הצילו מיד מצרים;<\/b> עַד עַכְשָׁו לֹא הָיָה עֶבֶד יָכוֹל לִבְרֹחַ מִמִּצְרַיִם, שֶׁהָיְתָה הָאָרֶץ מְסֻגֶּרֶת, וְאֵלּוּ יָצְאוּ שִׁשִּׁים רִבּוֹא (מכילתא):", "rashi_en": "ויחד יתרו AND JETHRO REJOICED — This is its literal meaning. A Midrashic comment is: his flesh became full of prickles (חדודין — his flesh crept with horror) — he felt grieved at the destruction of Egypt. That is what people say (what the common proverb says): A proselyte even though his heathen descent dates from as far back as the tenth generation, do not speak slightingly of an Aramean (any non-Jew) in his presence (Sanhedrin 94a).<br><br>על כל הטובה FOR ALL THE GOODNESS — the goodness in giving the Manna and the well and the Torah — and he rejoiced above all these (more especially), אשר הצילו מיד מצרים THAT HE HAD DELIVERED THEM OUT OF THE HAND OF EGYPT — Until now no slave had ever been able to escape from Egypt because that land was closely shut in on all sides, but these had gone forth six hundred thousand in number (cf. Mekhilta)."}, {"ch": 18, "v": 10, "aliyah": 1, "heb": "וַיֹּ֘אמֶר֮ יִתְרוֹ֒ בָּר֣וּךְ יְהֹוָ֔ה אֲשֶׁ֨ר הִצִּ֥יל אֶתְכֶ֛ם מִיַּ֥ד מִצְרַ֖יִם וּמִיַּ֣ד פַּרְעֹ֑ה אֲשֶׁ֤ר הִצִּיל֙ אֶת־הָעָ֔ם מִתַּ֖חַת יַד־מִצְרָֽיִם׃", "onk": "וַאֲמַר יִתְרוֹ בְּרִיךְ יְיָ דִי שֵׁזִיב יָתְכוֹן מִידָא דְמִצְרָאֵי וּמִידָא דְפַרְעֹה דִי שֵׁזִיב יָת עַמָא מִתְּחוֹת <b>מַרְוַת מִצְרָאֵי<\/b>:", "onk_en": "Yisro said, “Blessed is Adonoy Who rescued you from the hand of Egypt, and from the hand of Pharaoh; Who rescued the people from under the hand [<b>domination<\/b>] of Egypt [<b>the Egyptians<\/b>].", "pj": "וַאֲמַר יִתְרוֹ בְּרִיךְ שְׁמָא דַיְיָ דְּשֵׁזִיב יַתְכוֹן מִן יְדָא דְמִצְרָאֵי וּמִן יְדָא דְפַרְעה דְּשֵׁזִיב יַת עַמָּא מִתְּחוֹת מַרְוַת מִצְרָאֵי", "pj_en": "And Jethro said, Blessed be the Name of the Lord who hath saved you from the hand of the Mizraee, and from the hand of Pharoh, and hath saved the people from under the tyranny of the Mizraee.", "tj": "", "tj_en": "", "rashi": "<b>אשר הציל אתכם מיד מצרים.<\/b> אֻמָּה קָשָׁה:<br><br><b>ומיד פרעה.<\/b> מֶלֶךְ קָשֶׁה:<br><br><b>מתחת יד מצרים.<\/b> כְּתַרְגּוּמוֹ – לְשׁוֹן רִדּוּי וּמָרוּת; הַיָּד שֶׁהָיוּ מַכְבִּידִים עֲלֵיהֶם הִיא הָעֲבוֹדָה:", "rashi_en": "אשר הציל אתכם מיד מצרים WHO HATH DELIVERED YOU OUT OF THE HAND OF EGYPT, a hard people,<br><br>ומיד פרעה AND OUT OF THE HAND OF PHARAOH, a hard monarch.<br><br>מתחת יד מצרים — Translate this as the Targum does: from beneath the authority of Egypt, taking יד as an expression of domination and authority; “the hand” spoken of here is the hand which they imposed heavily upon them — referring to the hard bondage."}, {"ch": 18, "v": 11, "aliyah": 1, "heb": "עַתָּ֣ה יָדַ֔עְתִּי כִּֽי־גָד֥וֹל יְהֹוָ֖ה מִכׇּל־הָאֱלֹהִ֑ים כִּ֣י בַדָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵיהֶֽם׃", "onk": "כְּעַן יְדַעְנָא אֲרֵי <b>רַב יְיָ וְלֵית אֱלָהּ בַּר מִנֵהּ<\/b> אֲרֵי <b>בְּפִתְגָמָא דִי חַשִׁיבוּ מִצְרָאֵי לְמִדַן יָת יִשְׂרָאֵל בֵּהּ דָנִנוּן<\/b>:", "onk_en": "Now I know that Adonoy is greater than all the gods, [<b>great, and there is no god besides Him,<\/b>] because [<b>with<\/b>] the very thing [<b>through which the Egyptians<\/b>] they plotted [<b>to punish Yisrael<\/b>] came upon them [<b>they themselves were punished<\/b>].”", "pj": "כְּדוֹן חַכִּימַת אֲרוּם תַּקִיף הוּא יְיָ עַל כָּל אֱלָהַיָא אֲרוּם בְּפִתְגָמָא דְאַרְשִׁיעוּ מִצְרָאֵי לְמֵידַן יַת יִשְרָאֵל בְּמַיָא עֲלֵיהוֹן הָדַר דִּינָא לְאִיתְדָנָא בְּמַיָא", "pj_en": "Now have I known that the Lord is stronger than all gods; for by the very thing by which the Mizraee wickedly would have punished Israel by (drowning them in) the sea, upon themselves came the punishment, in being punished in the sea.", "tj": "", "tj_en": "", "rashi": "<b>עתה ידעתי.<\/b> מַכִּירוֹ הָיִיתִי לְשֶׁעָבַר וְעַכְשָׁו בְּיוֹתֵר:<br><br><b>מכל האלהים.<\/b> מְלַמֵּד שֶׁהָיָה מַכִּיר בְּכָל עֲ\"זָ שֶׁבָּעוֹלָם, שֶׁלֹּא הִנִּיחַ עֲ\"זָ שֶׁלֹּא עֲבָדָהּ (מכילתא):<br><br><b>כי בדבר אשר זדו עליהם.<\/b> כְּתַרְגּוּמוֹ – בַּמַּיִם דִּמּוּ לְאַבְּדָם וְהֵם נֶאֶבְדוּ בַּמַּיִם:<br><br><b>אשר זדו.<\/b> אֲשֶׁר הִרְשִׁיעוּ. וְרַבּוֹתֵינוּ דְּרָשׁוּהוּ לְשׁוֹן וַיָּזֶד יַעֲקֹב נָזִיד, בַּקְּדֵרָה אֲשֶׁר בִּשְּׁלוּ בָּהּ נִתְבַּשְּׁלוּ (סוטה י\"א):", "rashi_en": "עתה ידעתי NOW I KNOW — I indeed knew Him formerly, but now I know Him even more (cf. Mekhilta).<br><br>מכל האלהים [GREATER] THAN ALL THE GODS — This tells us that he had a full knowledge of every idol in the world — that he left no idol unworshipped by him (Mekhilta).<br><br>כי בדבר אשר זדו עליהם — Understand this as the Targum does for by that very thing with which the Egyptians thought to judge Israel were they themselves judged — they had thought to destroy them by water and they were themselves destroyed by water (cf. Mekhilta).<br><br>אשר זדו means in which they had shown themselves wicked. Our Rabbis, however, explained it in the same sense as the root which we find in (Genesis 25:29) “And Jacob was boiling (ויזד) pottage (נזיד) (lit., something boiled)” — in the pot wherein they had boiled, therein were they themselves boiled (Sotah 11a)."}, {"ch": 18, "v": 12, "aliyah": 1, "heb": "וַיִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּזְבָחִ֖ים לֵֽאלֹהִ֑ים וַיָּבֹ֨א אַהֲרֹ֜ן וְכֹ֣ל&thinsp;<b>׀<\/b> זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶאֱכׇל־לֶ֛חֶם עִם־חֹתֵ֥ן מֹשֶׁ֖ה לִפְנֵ֥י הָאֱלֹהִֽים׃", "onk": "<b>וְקָרִיב<\/b> יִתְרוֹ חֲמוּהִי דְמשֶׁה עֲלָוָן וְנִכְסַת קוּדְשִׁין <b>קֳדָם<\/b> יְיָ וַאֲתָא אַהֲרֹן וְכֹל סָבֵי יִשְׂרָאֵל לְמֵיכַל לַחְמָא עִם חֲמוּהִי דְמשֶׁה <b>קֳדָם<\/b> יְיָ:", "onk_en": "[Then] Yisro, Moshe’s father-in-law, brought [<b>offered<\/b>] a burnt-offering and [peace]-offerings to [<b>before<\/b>] God. Aharon and all the elders of Yisrael came to eat bread with [Yisro,] Moshe’s father-in-law, before God.", "pj": "וּנְסַב יִתְרוֹ עַלְוָון וְנִכְסַת קוּדְשִׁין קֳדָם יְיָ וְאָתָא אַהֲרן וְכָל סָבֵי יִשְרָאֵל לְמֵיכוֹל לַחֲמָא עִם חָמוֹי דְמשֶׁה קֳדָם יְיָ וּמשֶׁה הֲוָה קָאִי וּמְשַׁמֵּשׁ קֳדָמֵיהוֹן", "pj_en": "And Jethro took burnt offerings and holy sacrifices before the Lord, and Aharon and all the elders of Israel came to eat bread with the father-in-law of Mosheh before the Lord; and Mosheh stood and ministered before them.", "tj": "", "tj_en": "", "rashi": "<b>עלה.<\/b> כְּמַשְׁמָעָהּ, שֶׁהִיא כֻּלָּהּ כָּלִיל:<br><br><b>וזבחים.<\/b> שְׁלָמִים:<br><br><b>ויבא אהרן וגו'.<\/b> וּמֹשֶׁה הֵיכָן הָלַךְ? וַהֲלֹא הוּא שֶׁיָּצָא לִקְרָאתוֹ וְגָרַם לוֹ אֶת כָּל הַכָּבוֹד? אֶלָּא שֶׁהָיָה עוֹמֵד וּמְשַׁמֵּשׁ לִפְנֵיהֶם (מכילתא):<br><br><b>לפני האלהים.<\/b> מִכָּאן שֶׁהַנֶּהֱנֶה מִסְּעוּדָה שֶׁתַּלְמִידֵי חֲכָמִים מְסֻבִּין בָּהּ, כְּאִלּוּ נֶהֱנֶה מִזִּיו הַשְּׁכִינָה (ברכות ס\"ד):", "rashi_en": "עלה — Translate this according to its usual meaning: a burnt-offering, which was burnt entire and completely.<br><br>וזבחים AND SACRIFICES — i. e. peace-offerings.<br><br>ויבא אהרן וגו׳ AND AARON CAME, etc. — But where had Moses gone? Was it not he who had gone out to meet him and had been the cause of all the honour shown to him? But the explanation why he is not mentioned as having come to eat bread with Jethro is that he was standing by and waiting upon them (Mekhilta).<br><br>לפני האלהים BEFORE GOD — From this statement that they were “before God” we may learn that one who takes part in (more lit., who has enjoyment from) a meal at which scholars sit may be regarded as though he has enjoyment from the splendour of the Shechina (Berakhot 64a; cf. Mekhilta)."}, {"ch": 18, "v": 13, "aliyah": 2, "heb": "וַֽיְהִי֙ מִֽמׇּחֳרָ֔ת וַיֵּ֥שֶׁב מֹשֶׁ֖ה לִשְׁפֹּ֣ט אֶת־הָעָ֑ם וַיַּעֲמֹ֤ד הָעָם֙ עַל־מֹשֶׁ֔ה מִן־הַבֹּ֖קֶר עַד־הָעָֽרֶב׃", "onk": "וַהֲוָה מִיוֹמָא דְבַתְרוֹהִי וִיתֵיב משֶׁה לְמִדַן יָת עַמָא וְקָם עַמָא עִלָוֹהִי דְמשֶׁה מִן צַפְרָא עַד רַמְשָׁא:", "onk_en": "It was on the following day [that] Moshe sat to judge the people and the people stood around Moshe from morning until evening.", "pj": "וַהֲוָה בְּיוֹמָא דְבָתַר יוֹמָא דְכִפּוּרֵי וִיתֵיב משֶׁה לְמֵידַן יַת עַמָּא וְקָם עַמָּא קֳדָם משֶׁה מִן צַפְרָא עַד רַמְשָׁא", "pj_en": "And the day after, the day of reconciliation, Mosheh sat to judge the people: and the people stood before Mosheh from morning till evening.", "tj": "", "tj_en": "", "rashi": "<b>ויהי ממחרת.<\/b> מוֹצָאֵי יוֹם הַכִּפּוּרִים הָיָה, כָּךְ שָׁנִינוּ בְּסִפְרֵי וּמַהוּ מִמָּחֳרָת? לְמָחֳרַת רִדְתּוֹ מִן הָהָר; וְעַל כָּרְחֲךָ אִי אֶפְשָׁר לוֹמַר אֶלָּא מִמָּחֳרַת יוֹם הַכִּפּוּרִים, שֶׁהֲרֵי קֹדֶם מַתַּן תּוֹרָה אִ\"אֶ לוֹמַר \"וְהוֹדַעְתִּי אֶת חֻקֵּי וְגוֹ'\", וּמִשֶּׁנִּתְּנָה תּוֹרָה עַד יֹהַ\"כִּ לֹא יָשַׁב מֹשֶׁה לִשְׁפֹּט אֶת הָעָם, שֶׁהֲרֵי בְי\"ז בְּתַמּוּז יָרַד וְשָׁבַר אֶת הַלֻּחוֹת וּלְמָחָר עָלָה בְּהַשְׁכָּמָה וְשָׁהָה שְׁמוֹנִים יוֹם וְיָרַד בְּיֹהַ\"כּ; וְאֵין פָּרָשָׁה זוֹ כְתוּבָה כַּסֵּדֶר, שֶׁלֹּא נֶאֱמַר וַיְהִי מִמָּחֳרָת עַד שָׁנָה שְׁנִיָּה – אַף לְדִבְרֵי הָאוֹמֵר יִתְרוֹ קֹדֶם מַתַּן תּוֹרָה בָּא, שִׁלּוּחוֹ אֶל אַרְצוֹ לֹא הָיָה אֶלָּא עַד שָׁנָה שְׁנִיָּה – שֶׁהֲרֵי נֶאֱמַר כָּאן וַיְשַׁלַּח מֹשֶׁה אֶת חֹתְנוֹ, וּמָצִינוּ בְמַסַּע הַדְּגָלִים שֶׁאָמַר לוֹ מֹשֶׁה \"נֹסְעִים אֲנַחְנוּ אֶל הַמָּקוֹם וְגוֹ'\"(במדבר י כט), אַל נָא תַּעֲזֹב אֹתָנוּ\" (שם לא), וְאִם זוֹ קֹדֶם מַתַּן תּוֹרָה, מִשֶּׁשִּׁלְּחוֹ וְהָלַךְ הֵיכָן מָצִינוּ שֶׁחָזַר? וְאִם תֹּאמַר, שָׁם לֹא נֶאֱמַר יִתְרוֹ אֶלָּא חוֹבָב, וּבְנוֹ שֶׁל יִתְרוֹ הָיָה, הוּא חוֹבָב הוּא יִתְרוֹ, שֶׁהֲרֵי כָתוּב \"מִבְּנֵי חֹבָב חֹתֵן מֹשֶׁה\" (שופטים ד'):<br><br><b>וישב משה וגו' ויעמד העם.<\/b> יוֹשֵׁב כְּמֶלֶךְ וְכֻלָּן עוֹמְדִים, וְהֻקְשָׁה הַדָּבָר לְיִתְרוֹ שֶׁהָיָה מְזַלְזֵל בִּכְבוֹדָן שֶׁל יִשְׂרָאֵל וְהוֹכִיחוֹ עַל כָּךְ, שֶׁנֶּאֱמַר (פסוק יד) מַדּוּעַ אַתָּה יוֹשֵׁב לְבַדֶּךָ וְכֻלָּם נִצָּבִים:<br><br><b>מן הבקר עד ערב.<\/b> אֶפְשָׁר לוֹמַר כֵּן? אֶלָּא כָּל דַּיָּן שֶׁדָּן דִּין אֱמֶת לַאֲמִתּוֹ אֲפִלּוּ שָׁעָה אַחַת, מַעֲלֶה עָלָיו הַכָּתוּב כְּאִלּוּ עוֹסֵק בַּתּוֹרָה כָּל הַיּוֹם וּכְאִלּוּ נַעֲשֶׂה שֻׁתָּף לְהַקָּבָּ\"ה בְּמַעֲשֵׂה בְרֵאשִׁית, שֶׁנֶּאֱמַר בּוֹ וַיְהִי עֶרֶב וְגוֹ' (שבת י'):", "rashi_en": "ויהי ממחרת AND IT CAME TO PASS ON THE MORROW — This was really the day after the Day of Atonement: so have we learnt in Siphré (Mekhilta). Since the Day of Atonement is not mentioned anywhere in this section that deals with the Giving of the Law what is the force of ממחרת? i. e. in relation to what particular day in the history of the Law-giving is the term ממחרת, “on the morrow”, used? It means the morrow after he (Moses) descended from the Mount Sinai, and you must admit that it is impossible to say that this was any other day but the morrow after the Day of Atonement because, before the giving of the Torah, one could not say, (v. 16) “and I do make them know the statutes [of God and His laws]” (which are part of the Torah), and from the day when the Torah was given until the Day of Atonement Moses did not sit down to judge the people, since immediately after the Torah was given he ascended the mountain and descended only on the seventeenth of Tammuz when he broke the tablets in pieces. On the next day he again ascended the mountain early in the morning and stayed there eighty days, descending on the Day of Atonement (cf. Tanchuma כי תשא, Rashi on 33:11, Deuteronomy 9:18 and 10:1). Consequently this section is not written (placed) in its chronological order, for this paragraph commencing with ויהי ממחרת and ending with “Moses let his father-in-law go and he (Jethro) went his way into his own land” was not said before the second year after the Exodus. For even according to the view of one who says that Jethro came to Moses before the giving of the Torah (Avodah Zarah 24a) his dismissal into his own land did not take place until the second year, for it is stated here (v. 27) “Moses let his father-in-law go”, and we find in the account of Israel’s journey through the wilderness beneath their banners (which according to Numbers 10:11 began in the second year) that Moses said to him, (Numbers 10:29, 31) “We are journeying etc…. Forsake us not, I pray thee”. Now if this incident happened before the giving of the Torah (including Jethro’s departure) where do we find it related that he returned after he had let him go and he had taken departure? And if you object that there (in the section in Numbers which Rashi has quoted as evidence that Jethro’s departure took place in the second year) it does not mention Jethro at all but Hobab, and that the latter was not Jethro but the son of Jethro, then I reply that Hobab is identical with Jethro and not his son, because it is written, (Judges 4:11) “of the sons of Hobab, the father-in-law of Moses”.<br><br>וישב משה וגו׳ ויעמד העם MOSES SAT … AND THE PEOPLE STOOD He was sitting like a king and they all stood, and the thing was distasteful to Jethro in that he made light of the respect due to Israel. He therefore reproved him for this, as it is said (v. 14) “Why sittest thou only” — and they all stand! (Mekhilta)<br><br>מן הבקר עד הערב FROM MORNING UNTO EVENING — Is it really possible to say so — that Moses sat the whole day long? But the explanation is that any judge who gives a rightful decision as truth demands it, even though he spends but one hour on it, Scripture accounts it to him as though he had occupied himself with the Torah the whole day long, and as though he became co-partner with the Holy One, blessed be He, in the work of the Creation of which it is stated, “It was evening and it was morning” (cf. Mekhilta; Shabbat 10a)."}, {"ch": 18, "v": 14, "aliyah": 2, "heb": "וַיַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כׇּל־אֲשֶׁר־ה֥וּא עֹשֶׂ֖ה לָעָ֑ם וַיֹּ֗אמֶר מָֽה־הַדָּבָ֤ר הַזֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָעָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְבַדֶּ֔ךָ וְכׇל־הָעָ֛ם נִצָּ֥ב עָלֶ֖יךָ מִן־בֹּ֥קֶר עַד־עָֽרֶב׃", "onk": "וַחֲזָא חֲמוּהִי דְמשֶׁה יָת כָּל דִי הוּא עָבֵד לְעַמָא וַאֲמַר מָה פִתְגָמָא הָדֵין דִי אַתְּ עָבֵד לְעַמָא מָה דֵין אַתְּ יָתֵב בִּלְחוֹדָךְ וְכָל עַמָא קָיְמִין עִלָוָךְ מִן צַפְרָא עַד רַמְשָׁא:", "onk_en": "When Moshe’s father-in-law saw all that he did for the people, he said, “What is this that you are doing for the people? Why are you sitting by yourself and [letting] the people stand around you from morning until evening?”", "pj": "וַחֲמָא חָמוֹי דְמשֶׁה יַת כָּל דְּהוּא טָרַח וְעָבֵיד לְעַמֵּיהּ וַאֲמַר מַה פִּתְגָמָא הָדֵין דְּאַנְתְּ עָבֵיד לְעַמָּא מַה דֵּין אַנְתְּ יָתֵב לְבִלְחוֹדָךְ לְמִידוּן וְכָל עַמָּא קַיְימִין קֳדָמָךְ מִן צַפְרָא עַד רַמְשָׁא", "pj_en": "And the father-in-law of Mosheh saw how much he toiled and laboured for his people; and he said, What thing is this that thou art doing to the people? Why dost thou sit alone to judge, and all the people stand before thee from morning until evening?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 15, "aliyah": 2, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה לְחֹתְנ֑וֹ כִּֽי־יָבֹ֥א אֵלַ֛י הָעָ֖ם לִדְרֹ֥שׁ אֱלֹהִֽים׃", "onk": "וַאֲמַר משֶׁה לַחֲמוּהִי אֲרֵי אָתָן לְוָתִי עַמָא לְמִתְבַּע אוּלְפַן מִן <b>קֳדָם<\/b> יְיָ:", "onk_en": "Moshe said to his father-in-law, “Because the people come to me to seek [instruction from] God.", "pj": "וַאֲמַר משֶׁה לְחָמוֹי אֲרוּם אַתְיָין לְוָותִי עַמָא לְמִתְבּוֹעַ אוּלְפַן מִן קֳדָם יְיָ", "pj_en": "And Mosheh said to his father-in-law, Because the people come to me to inquire for instruction from before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>כי יבא.<\/b> כְּמוֹ כִּי בָא, לְשׁוֹן הֹוֶה:<br><br><b>לדרש אלהים.<\/b> כְּתַרְגּוּמוֹ \"לְמִתְבַּע אֻלְפַּן\" – לִשְׁאֹל תַּלְמוּד מִפִּי הַגְּבוּרָה:", "rashi_en": "כי יבא — This is the same as כי בא because the people comes”, the imperfect tense expressing continuous action.<br><br>לדרש אלהים TO ENQUIRE OF GOD — Understand this as the Targum does: למתבע אלפן, to seek instruction from the mouth of the Almighty."}, {"ch": 18, "v": 16, "aliyah": 2, "heb": "כִּֽי־יִהְיֶ֨ה לָהֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔י וְשָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּבֵ֣ין רֵעֵ֑הוּ וְהוֹדַעְתִּ֛י אֶת־חֻקֵּ֥י הָאֱלֹהִ֖ים וְאֶת־תּוֹרֹתָֽיו׃", "onk": "כַּד הֲוֵי לְהוֹן דִינָא אָתָן לְוָתִי וְדָאִינָא בֵּין גַבְרָא וּבֵין חַבְרֵהּ וּמְהוֹדַעְנָא לְהוֹן יָת קְיָמַיָא דַיְיָ וְיָת אוֹרָיָתֵהּ:", "onk_en": "Whenever they have a problem, they come to me, and I judge between man and his neighbor. I impart to them God’s statutes and His laws.”", "pj": "אֲרוּם יְהֵי לְהוֹן דִּינָא אָתָאָן לְוָותִי וְדַיֵּינָא בֵּין גַּבְרָא וּבֵין חַבְרֵיהּ וּמְהוֹדַעְנָא לְהוֹן יַת קְיָמַיָא דַיְיָ וְיַת אוֹרַיְיתֵיהּ", "pj_en": "When they have a matter for judgment, they come to me, and I judge between a man and his fellow, and make them to know the statutes and the law of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>כי יהיה להם דבר בא.<\/b> מִי שֶׁהָיָה לוֹ הַדָּבָר – בָּא אֵלַי:", "rashi_en": "כי יהיה להם דבר בא WHEN THEY HAVE A MATTER THEY COME (lit., “he comes”) — “He”, viz., who has the matter comes to me."}, {"ch": 18, "v": 17, "aliyah": 2, "heb": "וַיֹּ֛אמֶר חֹתֵ֥ן מֹשֶׁ֖ה אֵלָ֑יו לֹא־טוֹב֙ הַדָּבָ֔ר אֲשֶׁ֥ר אַתָּ֖ה עֹשֶֽׂה׃", "onk": "וַאֲמַר חֲמוּהִי דְמשֶׁה לֵהּ לָא תַקִין פִּתְגָמָא דְאַתְּ עָבֵד:", "onk_en": "Moshe’s father-in-law said to him, “What you are doing is not good.", "pj": "וַאֲמַר חָמוּי דְמשֶׁה לֵיהּ לָא תַקִין פִּתְגָמָא דְאַנְתְּ עָבִיד", "pj_en": "And the father-in-law of Mosheh said to him, This thing that thou art doing is not well ordered;", "tj": "", "tj_en": "", "rashi": "<b>ויאמר חתן משה.<\/b> דֶּרֶךְ כָּבוֹד קוֹרְאוֹ הַכָּתוּב חוֹתְנוֹ שֶׁל מֶלֶךְ:", "rashi_en": "ויאמר חתן משה AND MOSES’ FATHER-IN-LAW SAID — By way of honour Scripture describes him as the father-in-law of the king."}, {"ch": 18, "v": 18, "aliyah": 2, "heb": "נָבֹ֣ל תִּבֹּ֔ל גַּם־אַתָּ֕ה גַּם־הָעָ֥ם הַזֶּ֖ה אֲשֶׁ֣ר עִמָּ֑ךְ כִּֽי־כָבֵ֤ד מִמְּךָ֙ הַדָּבָ֔ר לֹא־תוּכַ֥ל עֲשֹׂ֖הוּ לְבַדֶּֽךָ׃", "onk": "מִלְאָה תִלְאֶה אַף אַתְּ אַף עַמָא הָדֵין דִעִמָךְ אֲרֵי יַקִיר מִנָךְ פִּתְגָמָא לָא תִכּוֹל לְמֶעְבְּדֵהּ בִּלְחוֹדָךְ:", "onk_en": "You are going to wear yourself out, you too and this people that is with you. This [activity] is too heavy for you. You cannot do it alone.", "pj": "מִיתַר תִּינְתַר אוּף אַנְתְּ אוּף אַהֲרן וּבְנוֹי וְסָבַיָא דְעִמָּךְ אֲרוּם יַקִּיר מִינָךְ פִּתְגָּמָא לָא תֵיכוֹל לְמֶעְבְּדֵיהּ בִּלְחוֹדָךְ", "pj_en": "thou wilt verily wear thyself away. Aharon also, and his sons, and the elders of thy people, because the thing is heavier than thou art, able to do by thyseIf, (should take part in it.)", "tj": "", "tj_en": "", "rashi": "<b>נבל תבל.<\/b> כְּתַרְגּוּמוֹ, וּלְשׁוֹנוֹ לְשׁוֹן כְּמִישָׁה, פלייש\"טרא בְּלַעַז, כְּמוֹ \"וְהֶעָלֶה נָבֵל\" (ירמיהו ח'), \"כִּנְבֹל עָלֶה מִגֶּפֶן\" (ישעיהו ל\"ד), שֶׁהוּא כָמוּשׁ עַל יְדֵי חַמָּה וְעַל יְדֵי קֶרַח וְכֹחוֹ תָּשׁ וְנִלְאֶה:<br><br><b>גם אתה.<\/b> לְרַבּוֹת אַהֲרֹן וְחוּר וְשִׁבְעִים זְקֵנִים:<br><br><b>כי כבד ממך.<\/b> כָּבְדּוֹ רַב יוֹתֵר מִכֹּחֲךָ:", "rashi_en": "נבל תבל — Explain this as the Targum does: thou will certainly become weary. Its meaning expresses the idea of withering, old French flestre, just as. (Jeremiah 8:13) “and the leaf is withered (נבל)”; (Isaiah 34:4) “as withereth (כנבל) the leaf from off the vine” — the meaning being that it becomes shrivelled through the heat and through the frost, and so its strength diminishes and it becomes, as it were, weary, and falls from off the vine (מגפן)‎.<br><br>גם אתה THOU ALSO — The word גם “also” was added in order to include Aaron and Hur and the seventy elders (cf. Mekhilta).<br><br>כי כבד ממך FOR [THIS THING] IS TOO HEAVY FOR THEE — its weight is far more than thy strength can bear."}, {"ch": 18, "v": 19, "aliyah": 2, "heb": "עַתָּ֞ה שְׁמַ֤ע בְּקֹלִי֙ אִיעָ֣צְךָ֔ וִיהִ֥י אֱלֹהִ֖ים עִמָּ֑ךְ הֱיֵ֧ה אַתָּ֣ה לָעָ֗ם מ֚וּל הָֽאֱלֹהִ֔ים וְהֵבֵאתָ֥ אַתָּ֛ה אֶת־הַדְּבָרִ֖ים אֶל־הָאֱלֹהִֽים׃", "onk": "כְּעַן <b>קַבֵּל מִנִי<\/b> אֲמַלְכִנָךְ <b>וִיהֵי מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדָךְ<\/b> הֱוֵי אַתְּ לְעַמָא <b>(תְּבַע) אוּלְפַן מִן קֳדָם יְיָ<\/b> וּתְהֵי מַיְתִי אַתְּ יָת פִּתְגָמַיָא לִ<b>קֳדָם<\/b> יְיָ:", "onk_en": "Now listen to my voice [<b>obey me<\/b>]. I will give you advice and [<b>the Word of<\/b>] God [<b>will<\/b>] be with you [<b>your support<\/b>]. You must be God’s representative [<b>ask instruction from before God<\/b>] for the people, and bring the[ir] problems to [<b>before<\/b>] God.", "pj": "כְּדוֹן קַבֵּיל מִינִי אִימְלְכִינָךְ וִיהֵי מֵימְרָא דַיְיָ בְּסַעֲדָךְ הֲוֵי אַנְתְּ לְעַמָּא תְּבַע אוּלְפַן מִן קֳדָם יְיָ וְתַיְתֵי אַנְתְּ יַת פִּתְגָמָא דִילְהוֹן קֳדָם יְיָ", "pj_en": "Now hearken to me and I will advise thee; and may the Word of the Lord be thy helper! When thou art with the people who seek instruction from before the Lord, thou shouldst take their affair before the Lord,", "tj": "", "tj_en": "", "rashi": "<b>איעצך ויהי אלהים עמך.<\/b> בָּעֵצָה; אָמַר לוֹ צֵא הִמָּלֵךְ בַּגְּבוּרָה (מכילתא):<br><br><b>היה אתה לעם מול האלהים.<\/b> שָׁלִיחַ וּמֵלִיץ בֵּינוֹתָם לַמָּקוֹם וְשׁוֹאֵל מִשְׁפָּטִים מֵאִתּוֹ:<br><br><b>את הדברים.<\/b> דִּבְרֵי רִיבוֹתָם:", "rashi_en": "איעצך ויהי אלהים עמך I WILL GIVE THEE COUNSEL BUT LET GOD BE WITH THEE in considering this counsel. This is really what he said to him: Go and consult with the Almighty as regards the counsel I give you (Mekhilta).<br><br>היה אתה לעם מול האלהים BE THOU FOR THE PEOPLE TO GOD-WARD — be thou the agent and intermediary between them and the Omnipresent, and be thou the one who enquires of Him regarding the judgments.<br><br>את הדברים [AND THOU SHALT BRING] THE MATTERS — i. e. the matters of their strife."}, {"ch": 18, "v": 20, "aliyah": 2, "heb": "וְהִזְהַרְתָּ֣ה אֶתְהֶ֔ם אֶת־הַחֻקִּ֖ים וְאֶת־הַתּוֹרֹ֑ת וְהוֹדַעְתָּ֣ לָהֶ֗ם אֶת־הַדֶּ֙רֶךְ֙ יֵ֣לְכוּ בָ֔הּ וְאֶת־הַֽמַּעֲשֶׂ֖ה אֲשֶׁ֥ר יַעֲשֽׂוּן׃", "onk": "וְתַזְהַר יָתְהוֹן יָת קְיָמַיָא וְיָת אוֹרַיְתָא וּתְהוֹדַע לְהוֹן יָת אוֹרְחָא דִיְהָכוּן בַּהּ וְיָת עוֹבָדָא דִיַעְבְּדוּן:", "onk_en": "You shall enlighten them as to the statutes and laws, and impart to them the path in which they must walk, and the deeds they must do.", "pj": "וְתַזְהַר יַתְהוֹן יַת קְיָימַיָא וְיַת אוֹרַיְיתָא וּתְהוֹדַע לְהוֹן יַת צְלוֹתָא דְיֵיצְלוּן בְּבֵית כְּנִשְׁתְּהוֹן וְיַת אוֹרְחָא דְּיַבְקְרוּן לְמָרִיעִין וּדְיַהֲכוּן לְמִיקְבּוֹר מֵתַיָא וּלְמִגְמוֹל בָּהּ חִיסְדָא וְיַת עוּבְדָא וְשׁוּרַת דִּינָא וּדְיַעַבְדוּן מִלְגַו לְשׁוּרָתָא לְרַשִׁיעַיָין", "pj_en": "and give them counsel about the statutes and laws, make them understand the prayer they are to offer in the house of congregation, the manner of visiting the sick, of burying the dead, of being fruitful In doing good, and in the work and process of justice, and how to conduct themselves among the wicked.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 21, "aliyah": 2, "heb": "וְאַתָּ֣ה תֶחֱזֶ֣ה מִכׇּל־הָ֠עָ֠ם אַנְשֵׁי־חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְשַׂמְתָּ֣ עֲלֵהֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְשָׂרֵ֥י עֲשָׂרֹֽת׃", "onk": "וְאַתְּ תֶּחֶזֵי מִכָּל עַמָא גֻבְרִין דְחֵילָא דַחֲלַיָא דַיְיָ גֻבְרִין דִקְשׁוֹט דְסָנָן <b>לְקַבָּלָא<\/b> מָמוֹן וּתְמַנֵי עֲלֵיהוֹן רַבָּנֵי אַלְפִין רַבָּנֵי מָאוָתָא רַבָּנֵי חַמְשִׁין וְרַבָּנֵי עִשׂוֹרְיָתָא:", "onk_en": "You must seek out from among all the people capable, God-fearing men, men of truth, who despise [<b>accepting<\/b>] gain. You must then appoint them over [the people] as officers of thousands, officers of hundreds, officers of fifties and officers of tens.", "pj": "וְאַנְתְּ בְּרוֹר מִכָּל עַמָא גִיבְרֵי חֵילָא דַחֲלַיָא דַיְיָ גּוּבְרִין דִּקְשׁוֹט דְּסָנַן לְקַבְּלָא מָמוֹן שִׁיקְרָא וּתְמַנֵי עֲלֵיהוֹן רַבָּנֵי אַלְפִין רַבָּנֵי מַאֲוָותָא רַבָּנֵי חוּמְשִׁין רַבָּנֵי עִשּׂוּרְיָיתָא", "pj_en": "But thou shouldst elect from all the people men of ability who fear the Lord, upright men who hate to receive the mammon of dishonesty, and superappoint them to be heads of thousands, of hundreds, of fifties, and of tens.", "tj": "", "tj_en": "", "rashi": "<b>ואתה תחזה.<\/b> בְּרוּחַ הַקֹּדֶשׁ שֶׁעָלֶיךָ:<br><br><b>אנשי חיל.<\/b> עֲשִׁירִים, שֶׁאֵין צְרִיכִין לְהַחֲנִיף וּלְהַכִּיר פָּנִים (שם):<br><br><b>אנשי אמת.<\/b> אֵלּוּ בַּעֲלֵי הַבְטָחָה, שֶׁהֵם כְּדַאי לִסְמֹךְ עַל דִּבְרֵיהֶם, שֶׁעַל יְדֵי כֵן יִהְיוּ דִבְרֵיהֶם נִשְׁמָעִין:<br><br><b>שנאי בצע.<\/b> שֶׁשּׂוֹנְאִין אֶת מָמוֹנָם בַּדִּין, כְּהַהִיא דְּאָמְרִינָן: כָּל דַיָּנָא דְּמַפְּקִין מָמוֹנָא מִינֵּיהּ בְּדִינָא לָאו דַּיָּנָא הוּא (בבא בתרא נ\"ח):<br><br><b>שרי אלפים.<\/b> הֵם הָיוּ שֵׁשׁ מֵאוֹת שָׂרִים לְשֵׁשׁ מֵאוֹת אֶלֶף:<br><br><b>שרי מאות.<\/b> שֵׁשׁ אֲלָפִים הָיוּ:<br><br><b>שרי חמשים.<\/b> י\"ב אֶלֶף:<br><br><b>שרי עשרת.<\/b> שִׁשִּׁים אֶלֶף:", "rashi_en": "ואתה תחזה MOREOVER THOU SHALT PROVIDE through the Holy Spirit that is upon thee (Mekhilta),<br><br>אנשי חיל MEN OF ABILITY (but חיל may mean “wealth” and in this sense the words would mean) — rich men who will not need to flatter or to show favour (cf. Mekhilta).<br><br>אנשי אמת MEN OF TRUTH — These are people commanding confidence (Mekhilta); who are deserving that one should rely upon their words — appoint these as judges because on account of this their words will be listened to.<br><br>שנאי בצע HATING LUCRE — men who hate (pay no regard to) their property when it is to be made the matter of a law-suit (Mekhilta), in accordance with what we say: Any judge from whom one has to wring the money he owes only by means of a law-suit is no fitting judge (Bava Batra 58b).<br><br>שרי אלפים OFFICERS OF THOUSANDS — there were six hundred such officers for the six hundred thousand men of Israel.<br><br>שרי מאות OFFICERS OF HUNDREDS — there were six thousand of them.<br><br>שרי חמשים OFFICERS OF FIFTIES — twelve thousand.<br><br>שרי עשרת OFFICERS OF TENS — sixty thousand (Mekhilta, Sanhedrin 18a)."}, {"ch": 18, "v": 22, "aliyah": 2, "heb": "וְשָׁפְט֣וּ אֶת־הָעָם֮ בְּכׇל־עֵת֒ וְהָיָ֞ה כׇּל־הַדָּבָ֤ר הַגָּדֹל֙ יָבִ֣יאוּ אֵלֶ֔יךָ וְכׇל־הַדָּבָ֥ר הַקָּטֹ֖ן יִשְׁפְּטוּ־הֵ֑ם וְהָקֵל֙ מֵֽעָלֶ֔יךָ וְנָשְׂא֖וּ אִתָּֽךְ׃", "onk": "<b>וִי<\/b>דוּנוּן יָת עַמָא בְּכָל עִדַן וִיהֵי כָּל פִּתְגַם רַב יַיְתוּן לְוָתָךְ וְכָל פִּתְגַם זְעֵיר יְדוּנוּן אִנוּן וְיִקְלוּן מִנָךְ וִיסוֹבְרוּן עִמָךְ:", "onk_en": "Let them [<b>They shall<\/b>] judge the people at all times. Every major problem they will bring to you, and every minor problem they shall judge by themselves. It will [thus] be easier for you since they will bear the burden with you.", "pj": "וִידִינוּן יַת עַמָּא בְּכָל עִידַן וִיהֵי כָּל פִּתְגַּם רַב יֵיתוּן לְוָותָךְ וְכָל פִּתְגַּם קָלִיל יִדוֹנוּן הִינוּן וִיקִילוּן מִן מְטוֹל דְּעָלָךְ וִיסוֹבְרוּן עִמָךְ", "pj_en": "And let them judge the people at all times, and every great matter bring to thee, but every little thing let them judge themselves, that they may lighten the burden that is upon thee, and bear it with thee.", "tj": "", "tj_en": "", "rashi": "<b>ושפטו.<\/b> וִידוּנוּן, לְשׁוֹן צִוּוּי:<br><br><b>והקל מעליך.<\/b> דָּבָר זֶה לְהָקֵל מֵעָלֶיךָ: <b>והקל.<\/b> כְּמוֹ \"וְהַכְבֵּד אֶת לִבּוֹ\" (שמות ח'), \"וְהַכּוֹת אֶת מוֹאָב\" (מלכים ב ג'), לְשׁוֹן הֹוֶה:", "rashi_en": "ושפטו — Onkelos translates this by וידונון AND LET THEM JUDGE (not “and they judged”, as in v. 26) — the word expresses a command.<br><br>והקל מעליך lit., AND TO LIGHTEN the burden FROM OFF YOU — this thing will serve to lighten it from off you. והקל — the grammatical form is similar to (Exodus 8:11) ”and to harden (והכבד) his heart”; (2 Kings 3:24) “and to smite (והכות) Moab” — both of which words are infinitives expressing present time."}, {"ch": 18, "v": 23, "aliyah": 2, "heb": "אִ֣ם אֶת־הַדָּבָ֤ר הַזֶּה֙ תַּעֲשֶׂ֔ה וְצִוְּךָ֣ אֱלֹהִ֔ים וְיָֽכׇלְתָּ֖ עֲמֹ֑ד וְגַם֙ כׇּל־הָעָ֣ם הַזֶּ֔ה עַל־מְקֹמ֖וֹ יָבֹ֥א בְשָׁלֽוֹם׃", "onk": "אִם יָת פִּתְגָמָא הָדֵין תַּעְבֵּד וִיפַקְדִנָךְ יְיָ וְתִכּוֹל לְמֵיקָם וְאַף כָּל עַמָא הָדֵין עַל אַתְרֵהּ <b>יְהַךְ<\/b> בִּשְׁלָם:", "onk_en": "If you do this and God commands you [to do so], you will be able to survive, and also this entire people will come [<b>go<\/b>] to their place in peace.”", "pj": "אִין יַת פִּתְגָמָא הָדֵין תַּעֲבֵיד דְּתֵיהֵי פָנֵי מִן דִּינָא וְיַפְקְדִינָךְ יְיָ פְּקוּדַיָא וְתֵיכוּל לְמֵיקָם לְמִשְׁמָעֵהוֹן וְאוּף אַהֲרן וּבְנוֹי וְכָל סָבַיָא דְעַמָא הָדֵין עַל אֲתַר בֵּי דִינְהוֹן יֵיתוּן בִּשְׁלָם", "pj_en": "If thou wilt do this, and exempt thyself from judging (every case) as the Lord shall give thee instruction, thou wilt be able to continue to hear them; and Aharon also and his sons, and all the elders of this people, will resort to the place of Judgment in peace.", "tj": "", "tj_en": "", "rashi": "<b>וצוך אלהים ויכלת עמד.<\/b> הִמָּלֵךְ בַּגְּבוּרָה, אִם מְצַוֶּה אוֹתְךָ לַעֲשׂוֹת כֵּן, תּוּכַל עֲמֹד, וְאִם יְעַכֵּב עַל יָדְךָ לֹא תוּכַל לַעֲמֹד (מכילתא):<br><br><b>וגם כל העם הזה.<\/b> אַהֲרֹן נָדָב וַאֲבִיהוּא וְשִׁבְעִים זְקֵנִים הַנִּלְוִים עַתָּה עִמְּךָ (שם):", "rashi_en": "וצוך אלהים ויכלת עמד This implies: Consult the Almighty; if He commands thee to do this, thou wilt be able to stand, and if He prevents thee thou wilt be unable to stand (Mekhilta).<br><br>וגם כל העם הזה AND ALL THIS PEOPLE ALSO — Aaron, Nadab and Abihu and the seventy elders who are now associated with you (Mekhilta)."}, {"ch": 18, "v": 24, "aliyah": 3, "heb": "וַיִּשְׁמַ֥ע מֹשֶׁ֖ה לְק֣וֹל חֹתְנ֑וֹ וַיַּ֕עַשׂ כֹּ֖ל אֲשֶׁ֥ר אָמָֽר׃", "onk": "<b>וְקַבִּיל<\/b> משֶׁה <b>לְמֵימְרָא<\/b> דַחֲמוּהִי וַעֲבַד כֹּל דִי אֲמָר:", "onk_en": "Moshe listened to [<b>accepted<\/b>] the voice [<b>word<\/b>] of his father-in-law and he did all that he said.", "pj": "וְקַבֵּל משֶׁה לְמֵימָר חָמוֹי וְעָבַד כָּל דְּאָמַר", "pj_en": "And Mosheh hearkened to his father-in-law, and did all that he had said.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 25, "aliyah": 3, "heb": "וַיִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי־חַ֙יִל֙ מִכׇּל־יִשְׂרָאֵ֔ל וַיִּתֵּ֥ן אֹתָ֛ם רָאשִׁ֖ים עַל־הָעָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְשָׂרֵ֥י עֲשָׂרֹֽת׃", "onk": "וּבְחַר משֶׁה גֻבְרִין דְחֵילָא מִכָּל יִשְׂרָאֵל וּמַנִי יָתְהוֹן רֵישִׁין עַל עַמָא רַבָּנֵי אַלְפִין רַבָּנֵי מָאוָתָא רַבָּנֵי חַמְשִׁין וְרַבָּנֵי עִשׂוֹרְיָתָא:", "onk_en": "Moshe chose capable men from among all Yisrael, and appointed them leaders over the people; officers of thousands, officers of hundreds, officers of fifties and officers of tens.", "pj": "וּבְחַר משֶׁה גִיבָּרֵי חֵילָא מִכָּל יִשְרָאֵל וּמַנֵי יַתְהוֹן רֵישִׁין עַל עַמָא רַבָּנֵי אַלְפִין שִׁית מְאָה רַבָּנֵי מַאֲוָותָא שִׁית אַלְפִין רַבָּנֵי חוּמְשִׁין תְּרֵיסַר אַלְפִין וְרַבָּנֵי עִישׁוֹרְיָיתָא שִׁית רִבְוָון", "pj_en": "And Mosheh selected able men from all Israel, and appointed them chief, over the people, rabbans of thousands, six hundred; rabbans of hundreds, six thousand; rabbans of fifties, twelve thousand; and rabbans of tens, six Myriads.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 26, "aliyah": 3, "heb": "וְשָׁפְט֥וּ אֶת־הָעָ֖ם בְּכׇל־עֵ֑ת אֶת־הַדָּבָ֤ר הַקָּשֶׁה֙ יְבִיא֣וּן אֶל־מֹשֶׁ֔ה וְכׇל־הַדָּבָ֥ר הַקָּטֹ֖ן יִשְׁפּוּט֥וּ הֵֽם׃", "onk": "<b>וְ<\/b>דַיְנִין יָת עַמָא בְּכָל עִדָן יָת פִּתְגַם קָשֵׁי מַיְתִין לְוָת משֶׁה וְכָל פִּתְגַם זְעֵיר דָיְנִין אִנוּן:", "onk_en": "They judged [<b>would judge<\/b>] the people at all times. The difficult problems, they would bring to Moshe, and the simple problems they would judge by themselves.", "pj": "וַהֲווֹן דַּיְינִין יַת עַמָא בְּכָל עִידַן יַת פִּתְגַם קְשֵׁי מַיְיתוּן לְוַת משֶׁה וְכָל פִּתְגַם קָלִיל דַּיְינִין הִינוּן", "pj_en": "And they judged the people at all times; a bard case they, brought to Mosheh; but every light matter they judged it.", "tj": "", "tj_en": "", "rashi": "<b>ושפטו.<\/b> וְדָיְנִין יָת עַמָּא:<br><br><b>יביאון.<\/b> מָיְתִין:<br><br><b>ישפוטו הם.<\/b> כְּמוֹ יִשְׁפְּטוּ, וְכֵן \"לֹא תַעֲבוּרִי\" (רות ב'), כְּמוֹ לֹא תַעַבְרִי, וְתַרְגּוּמוֹ דָּיְנִין אִינּוּן; מִקְרָאוֹת הָעֶלְיוֹנִים הֵם לְשׁוֹן צִוּוּי, לְכָךְ מְתֻרְגָּמִין וִידוּנוּן, יַיְתוּן, יְדוּנוּן, וּמִקְרָאוֹת הַלָּלוּ לְשׁוֹן עֲשִׂיָּה:", "rashi_en": "ושפטו — Onkelos translates by ודינין ית עמא “and they were judging the people” (cf. Rashi on v. 22).<br><br>יביאון — Onkelos translates this by מיתין (participle) “they were bringing” (or “they always brought”).<br><br>יִשְׁפּוּטוּ הֵם — This is the same as יִשְׁפְּטוּ; similar is (Ruth 2:8) לֹא תַעֲבוּרִי which is the same as לֹא תַעַבְרִי. Its translation in the Targum is דינין אינון “they were judging”. The above verses (i. e. the verbs in v. 22) express the command and consequently they are translated by וידונון and ייתון and ידונון, “and let them judge”, and “let them bring”, and “let them judge”; but these verses express the doing of what was commanded (they state that the command was actually carried out)."}, {"ch": 18, "v": 27, "aliyah": 3, "heb": "וַיְשַׁלַּ֥ח מֹשֶׁ֖ה אֶת־חֹתְנ֑וֹ וַיֵּ֥לֶךְ ל֖וֹ אֶל־אַרְצֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְשַׁלַח משֶׁה יָת חֲמוּהִי וַאֲזַל לֵהּ לְאַרְעֵהּ:", "onk_en": "Moshe sent his father-in-law off, and he [Yisro] went on his way to his land.", "pj": "וּפְטַר משֶׁה יַת חָמוֹי וְאָזַל לֵיהּ לְגַיְירָא כָּל בְּנֵי אַרְעֵיהּ", "pj_en": "And Mosheh parted from his father-in-law, and he went, and himself made proselytes of all the children of his land.", "tj": "", "tj_en": "", "rashi": "<b>וילך לו אל ארצו.<\/b> לְגַיֵּר בְּנֵי מִשְׁפַּחְתּוֹ (מכילתא):", "rashi_en": "וילך לו אל ארצו AND HE WENT HIS WAY INTO HIS OWN LAND, for the purpose of making proselytes of the members of his family (Mekhilta)."}, {"ch": 19, "v": 1, "aliyah": 4, "heb": "בַּחֹ֙דֶשׁ֙ הַשְּׁלִישִׁ֔י לְצֵ֥את בְּנֵי־יִשְׂרָאֵ֖ל מֵאֶ֣רֶץ מִצְרָ֑יִם בַּיּ֣וֹם הַזֶּ֔ה בָּ֖אוּ מִדְבַּ֥ר סִינָֽי׃", "onk": "בְּיַרְחָא תְּלִיתָאָה לְמִפַּק בְּנֵי יִשְׂרָאֵל מֵאַרְעָא דְמִצְרָיִם בְּיוֹמָא הָדֵין אֲתוֹ לְמַדְבְּרָא דְסִינָי:", "onk_en": "In the third month of the Bnei Yisrael’s departure from the land of Egypt, on that very day they came to the desert of Sinai.", "pj": "בְּיַרְחָא תְּלִיתָאָה לְאַפְקוּת בְּנֵי יִשְרָאֵל מֵאַרְעָא דְמִצְרַיִם בְּיוֹמָא הָדֵין בְּחַד לְיַרְחָא אָתוּ לְמַדְבְּרָא דְסִינָי", "pj_en": "In the third month of the Exodus of the sons of Israel from the land of Mizraim, on that day, the first of the month, came they to the desert;", "tj": "", "tj_en": "", "rashi": "<b>ביום הזה.<\/b> בְּרֹאשׁ חֹדֶשׁ; לֹא הָיָה צָרִיךְ לִכְתֹּב אֶלָּא בַּיּוֹם הַהוּא, מַהוּ בַּיּוֹם הַזֶּה? שֶׁיִּהְיוּ דִּבְרֵי תוֹרָה חֲדָשִׁים עָלֶיךָ כְּאִלּוּ הַיּוֹם נְתָנָם (ברכות ס\"ג):", "rashi_en": "ביום הזה THE SAME (lit., this) DAY — on the day of the New Moon. (Mekhilta; Shabbat 86b). It ought not to write ביום הזה, but ביום ההוא, “on that day”; what, then, is the force of the words “on this day”? Since they refer to the day when the Israelites came to Sinai to receive the Torah they imply that the commands of the Torah should be to you each day as something new (not antiquated and something of which you have become tired), as though He had only given them to you for the first time on the day in question (Yalkut Shimoni on Torah 273; cf. Berakhot 63b)."}, {"ch": 19, "v": 2, "aliyah": 4, "heb": "וַיִּסְע֣וּ מֵרְפִידִ֗ים וַיָּבֹ֙אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽיַּחֲנ֖וּ בַּמִּדְבָּ֑ר וַיִּֽחַן־שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָהָֽר׃", "onk": "וּנְטָלוּ מֵרְפִידִים וַאֲתוֹ לְמַדְבְּרָא דְסִינָי וּשְׁרוֹ בְּמַדְבְּרָא וּשְׁרָא תַמָן יִשְׂרָאֵל לָקֳבֵל טוּרָא:", "onk_en": "They had journeyed from Rephidim and had come to the desert of Sinai, and camped in the desert. Yisrael camped there opposite the mountain.", "pj": "וּנְטָלוּ מֵרְפִידִים וְאָתוֹ לְמַדְבְּרָא דְסִינַי וּשְׁרוֹ בְּמַדְבְּרָא וּשְׁרָא תַּמָן יִשְרָאֵל בְּלֵב מְיַיחֵד כָּל קְבֵיל טַוְורָא", "pj_en": "for they had journeyed from Rephidim, and had come to the desert of Sinai and Israel encamped there in the desert, of one heart, nigh to the mountain.", "tj": "", "tj_en": "", "rashi": "<b>ויסעו מרפידים.<\/b> מַה תָּ\"לֹ לַחֲזֹר וּלְפָרֵשׁ מֵהֵיכָן נָסְעוּ, וַהֲלֹא כְבָר כָּתַב שֶׁבִּרְפִידִים הָיוּ חוֹנִים, בְּיָדוּעַ שֶׁמִּשָּׁם נָסְעוּ? אֶלָּא לְהַקִּישׁ נְסִיעָתָן מֵרְפִידִים לְבִיאָתָן לְמִדְבַּר סִינַי, מַה בִּיאָתָן לְמִדְבַּר סִינַי בִּתְשׁוּבָה, אַף נְסִיעָתָן מֵרְפִידִים בִּתְשׁוּבָה (מכילתא):<br><br><b>ויחן שם ישראל.<\/b> כְּאִישׁ אֶחָד בְּלֵב אֶחָד, אֲבָל שְׁאָר כָּל הַחֲנִיּוֹת בְּתַרְעוֹמוֹת וּבְמַחֲלֹקֶת:<br><br><b>נגד ההר.<\/b> לְמִזְרָחוֹ, וְכָל מָקוֹם שֶׁאַתָּה מוֹצֵא נֶגֶד, פָּנִים לַמִּזְרָח (שם):", "rashi_en": "ויסעו מרפידים AND THEY JOURNEYED FROM REPHIDIM — What does Scripture teach us by again expressly stating from where they set forth on the journey, for is it not already written (Exodus 17:1) that they had encamped at Rephidim and it is therefore evident that they set forth from there?! But Scripture repeats it in order to make a comparison with the character of their journey from Rephidim to that of their arrival in the wilderness of Sinai! How was it in the case of their arrival in the wilderness of Sinai? They were in a state of penitence (as shown by the unanimity with which they encamped before the mountain: cf. Rashi on the end of this verse)! Thus, too, their setting forth from Rephidim was in a state of repentance for the sin they had committed there (see Exodus 17:2) (Mekhilta).<br><br>ויחן שם ישראל AND THERE ISRAEL ENCAMPED as one man and with one mind — but all their other encampments were made in a murmuring spirit and in a spirit of dissension (Mekhilta).<br><br>נגד ההר BEFORE THE MOUNTAIN — i. e. at its east side (Mekhilta), for wherever you find the word נגד referring to a locality it signifies with the face towards the east of the place mentioned."}, {"ch": 19, "v": 3, "aliyah": 4, "heb": "וּמֹשֶׁ֥ה עָלָ֖ה אֶל־הָאֱלֹהִ֑ים וַיִּקְרָ֨א אֵלָ֤יו יְהֹוָה֙ מִן־הָהָ֣ר לֵאמֹ֔ר כֹּ֤ה תֹאמַר֙ לְבֵ֣ית יַעֲקֹ֔ב וְתַגֵּ֖יד לִבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּמשֶׁה סְלֵק <b>קֳדָם<\/b> יְיָ וּקְרָא לֵהּ יְיָ מִן טוּרָא לְמֵימַר כִּדְנַן תֵּימַר לְבֵית יַעֲקֹב וּתְחַוִי לִבְנֵי יִשְׂרָאֵל:", "onk_en": "Moshe went up to [<b>before<\/b>] [the Presence of] God, and Adonoy called to him from the mountain, saying, “This is what you shall say to the House of Yaakov, and tell to the Bnei Yisrael.", "pj": "וּמשֶׁה סְלִיק בְּיוֹמָא תִנְיָנָא לְרֵישׁ טַוְורָא וּקְרָא לֵיהּ יְיָ מִן טַוְורָא לְמֵימָר כִּדְנָא תֵימַר לִנְשַׁיָא דְבֵית יַעֲקב וְתַתְנֵי לְבֵית יִשְרָאֵל", "pj_en": "And Mosheh on the second day went up to the summit of the mount; and the Lord called to him from the mount, saying, This shalt thou speak to the [women] of the house of Jakob, and instruct the house of Israel.", "tj": "וּמשֶׁה סְלִיק לְמִיתְבַּע אוּלְפַן מִן קֳדָם יְיָ וְקָדָם לֵיהּ דִּיבְרָא דַיְיָ מִן טוּרָא לְמֵימָר כִּדְנַן תֵימַר לְאֶינָשֵׁי בֵיתֵיהּ דְּיַעֲקב וְתַתְנֵי אוּלְפַן לִכְנִשְׁתְּהוֹן דִּבְנֵי יִשְרָאֵל:", "tj_en": "And Mosheh went up to seek instruction from before the Lord; and the Word of the Lord anticipated him from the mountain, saying, Thus shalt thou speak to the men of the house of Jakob, and teach the congregation of the sons of Israel.", "rashi": "<b>ומשה עלה.<\/b> בַּיּוֹם הַשֵּׁנִי; וְכָל עֲלִיּוֹתָיו בְּהַשְׁכָּמָה הָיוּ, שֶׁנֶּאֱמַר \"וַיַּשְׁכֵּם מֹשֶׁה בַבֹּקֶר\" (שמות ל\"ד):<br><br><b>כה תאמר.<\/b> בַּלָּשׁוֹן הַזֶּה וְכַסֵּדֶר הַזֶּה:<br><br><b>לבית יעקב.<\/b> אֵלּוּ הַנָּשִׁים, תֹּאמַר לָהֶן בְּלָשׁוֹן רַכָּה (מכילתא):<br><br><b>ותגיד לבני ישראל.<\/b> עֳנָשִׁין וְדִקְדּוּקִים פָּרֵשׁ לַזְּכָרִים, דְּבָרִים הַקָּשִׁין כְּגִידִין (שבת פ\"ז):", "rashi_en": "ומשה עלה AND MOSES WENT UP on the second day of the month (Mekhilta); for all his ascents to the mountain were made early in the morning, as it is stated (Exodus 34:4) “And Moses rose up early in the morning [and went up unto mount Sinai]” (Shabbat 86b).<br><br>כה תאמר THUS SHALT THOU SAY — Thus, i. e. in this (the Hebrew) language (cf. Mekhilta) and in this form of words.<br><br>לבית יעקב TO THE HOUSE OF JACOB — This denotes the women — to them you shall speak in gentle language (Mekhilta).<br><br>ותגיד לבני ישראל AND TELL THE CHILDREN (lit., the sons) OF ISRAEL — explain to the men the punishments and the details of the commandments in words that are as hard (distasteful) as wormwood (גידין) (cf. Shabbat 87a; Midrash לקח טוב‎)."}, {"ch": 19, "v": 4, "aliyah": 4, "heb": "אַתֶּ֣ם רְאִיתֶ֔ם אֲשֶׁ֥ר עָשִׂ֖יתִי לְמִצְרָ֑יִם וָאֶשָּׂ֤א אֶתְכֶם֙ עַל־כַּנְפֵ֣י נְשָׁרִ֔ים וָאָבִ֥א אֶתְכֶ֖ם אֵלָֽי׃", "onk": "אַתּוּן חֲזִתּוּן דִי עֲבָדִית לְמִצְרָיִם וּנְטָלִית (נ\"א <b>וְאַטְלִית<\/b>) יָתְכוֹן <b>כִּדְ<\/b>עַל גַדְפֵי נִשְׁרִין <b>וְקָרֵבִית<\/b> יָתְכוֹן <b>לְפָלְחָנִי<\/b>:", "onk_en": "‘You saw what I did to Egypt; and [how] I carried [<b>transported<\/b>] you [<b>as if<\/b>] on wings of eagles, and brought you [<b>close<\/b>] to Me [<b>My worship<\/b>].", "pj": "אַתּוּן חֲמִיתוּן מַה דִּי עֲבָדִית לְמִצְרָאֵי וּטְעָנִית יַתְכוֹן עַל עֲנָנִין הֵי כְּעַל גַּדְפֵי נִשְׁרִין מִן פִּילוּסִין וְאוֹבֵילִית יַתְכוֹן לְאַתַר בֵּית מוּקְדָּשָׁא לְמֶעֱבַד תַּמָּן פִּסְחָא וּבְהַהוּא לֵילְיָא אֲתֵיבִית יַתְכוֹן לְפִילוּסִין וּמִתַּמָּן קְרִיבִית יַתְכוֹן לְאוּלְפַן אוֹרַיְיתִי", "pj_en": "Ye have seen what I did to the Mizraee; and how I bare you upon the clouds as upon eagles' wings from Pelusin, to take you to the place of the sanctuary, there to solemnize the Pascha; and in the same night brought you back to Pelusin, and from thence have brought you nigh, to (receive) the doctrine of My law.", "tj": "אַתּוּן חֲמִיתוּן יַת מַה דְּאִפְרָעִית מִן מִצְרָאֵי וּסְבָלִית יַתְכוֹן עַל עֲנָנִין קְלִילִין הֵיךְ עַל כַּנְפֵי נִשְׁרִין וּקְרֵיבִית יַתְכוֹן לְאוּלְפַן ארַיְיתִי:", "tj_en": "You have seen what vengeance I have taken of the Mizraee, and (how) I bare you upon the light clouds as upon eagles' wings, and brought you nigh to the doctrine of My law.", "rashi": "<b>אתם ראיתם.<\/b> לֹא מַסֹּרֶת הִיא בְיֶדְכֶם, לֹא בִדְבָרִים אֲנִי מְשַׁגֵּר לָכֶם, לֹא בְעֵדִים אֲנִי מֵעִיד עֲלֵיכֶם, אֶלָּא <b>אתם ראיתם אשר עשיתי למצרים<\/b>, עַל כַּמָּה עֲבֵרוֹת הָיוּ חַיָּבִין לִי קֹדֶם שֶׁנִּזְדַּוְּגוּ לָכֶם וְלֹא נִפְרַעְתִּי מֵהֶם אֶלָּא עַל יֶדְכֶם (מכילתא):<br><br><b>ואשא אתכם.<\/b> זֶה הַיּוֹם שֶׁבָּאוּ יִשְׂרָאֵל לְרַעְמְסֵס, שֶׁהָיוּ יִשְׂרָאֵל מְפֻזָּרִין בְּכָל אֶרֶץ גֹּשֶׁן, וּלְשָׁעָה קַלָּה כְּשֶׁבָּאוּ לִסַּע וְלָצֵאת, נִקְבְּצוּ כֻּלָּם לְרַעְמְסֵס, וְאֻנְקְלוֹס תִּרְגֵּם וָאֶשָּׂא כְּמוֹ וָאַסִּיעַ אֶתְכֶם – \"וְאַטֵּלִית יָתְכוֹן\", תִּקֵּן אֶת הַדָּבָר דֶּרֶךְ כָּבוֹד לְמַעְלָה:<br><br><b>על כנפי נשרים.<\/b> כַּנֶּשֶׁר הַנּוֹשֵׂא גּוֹזָלָיו עַל כְּנָפָיו, שֶׁכָּל שְׁאָר הָעוֹפוֹת נוֹתְנִים אֶת בְּנֵיהֶם בֵּין רַגְלֵיהֶם, לְפִי שֶׁמִּתְיָרְאִין מֵעוֹף אַחֵר שֶׁפּוֹרֵחַ עַל גַּבֵּיהֶם, אֲבָל הַנֶּשֶׁר הַזֶּה אֵינוֹ מִתְיָרֵא אֶלָּא מִן הָאָדָם שֶׁמָּא יִזְרֹק בּוֹ חֵץ, לְפִי שֶׁאֵין עוֹף פּוֹרֵחַ עַל גַּבָּיו, לְכָךְ נוֹתְנוֹ עַל כְּנָפָיו, אוֹמֵר מוּטָב יִכָּנֵס הַחֵץ בִּי וְלֹא בִּבְנִי, אַף אֲנִי עָשִׂיתִי כֵן: \"וַיִּסַּע מַלְאַךְ הָאֱלֹהִים וְגוֹ', וַיָּבֹא בֵּין מַחֲנֵה מִצְרַיִם וְגוֹ'\" (שמות י\"ד), וְהָיוּ מִצְרַיִם זוֹרְקִים חִצִּים וְאַבְנֵי בָּלִיסְטְרָאוֹת וְהֶעָנָן מְקַבְּלָם:<br><br><b>ואבא אתכם אלי.<\/b> כְּתַרְגּוּמוֹ:", "rashi_en": "אתם ראיתם YE HAVE SEEN — It is not a tradition in your possession, not in written words do I send a message to you, not by means of eye-witnesses do I attest this to you, but you yourselves have seen אשר עשיתי למצרים WHAT I DID UNTO EGYPT — on account of many sins were they liable to Me for punishment before they came into contact with you, but I did not exact punishment from them except on your account (cf. Mekhilta).<br><br>ואשא אתכם AND I BARE YOU [ON EAGLES’ WINGS] — This happened on that day when the Israelites came to Rameses (the place where they all assembled on the night when they left Egypt) (Mekhilta), because the Israelites were living dispersed throughout the whole district of Goshen and in one brief moment — when they came there to set out and to leave Egypt — they all gathered together at Rameses. Onkelos translates ואשא as though it were [וְאַסִּיעַ [אתכם — viz., ואטלית יתכון “and I made you travel” (cf. the Targum on וַיַּסַע Exodus 15:22); he adapted the expression in a manner that is consonant with the respect due to the Most High God.<br><br>על כנפי נשרים UPON EAGLES’ WINGS — as an eagle which bears its fledglings upon its wings. Scripture uses this metaphor because all other birds place their young between their feet since they are afraid of another bird that flies above them, but the eagle fears none except man — apprehending that perhaps he may cast an arrow at it — since no bird can fly above it; therefore he places it (its young) upon its wings, saying, “Better that the arrow should pierce me than my young!” (Mekhilta). — “I, too”, said God, “did thus”: (Exodus 14:19, 20) “And the angel of God … journeyed etc…. And he came between the camp of Egypt etc.” … and the Egyptians were casting arrows and stone missiles and the cloud caught these (cf. Rashi on these verses).<br><br>ואבא אתכם אלי AND I BROUGHT YOU UNTO MYSELF — Explain this as the Targum does: “and I have brought you near to My service”."}, {"ch": 19, "v": 5, "aliyah": 4, "heb": "וְעַתָּ֗ה אִם־שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּקֹלִ֔י וּשְׁמַרְתֶּ֖ם אֶת־בְּרִיתִ֑י וִהְיִ֨יתֶם לִ֤י סְגֻלָּה֙ מִכׇּל־הָ֣עַמִּ֔ים כִּי־לִ֖י כׇּל־הָאָֽרֶץ׃", "onk": "וּכְעַן אִם <b>קַבָּלָא תְקַבְּלוּן לְמֵימְרִי<\/b> וְתִטְרוּן יָת קְיָמִי וּתְהוֹן קֳדָמַי <b>חַבִּיבִין<\/b> מִכָּל עַמְמַיָא אֲרֵי דִי לִי כָּל אַרְעָא:", "onk_en": "And now if you listen diligently [<b>obey<\/b>] to My voice [<b>Word<\/b>], and preserve My covenant; you shall be [<b>more<\/b>] beloved before Me than My special treasure among all the peoples, for all the earth is Mine.", "pj": "וּכְדוּן אִין קַבָּלָא תְּקַבְּלוּן לְמֵימְרִי וְתִנְטְרוּן יַת קְיָימַי וּתְהוֹן קֳדָמַי חֲבִיבִין מִכָּל עַמְמַיָא דְעַל אַפֵּי אַרְעָא", "pj_en": "And now, if you will truly hearken to My Word and keep My covenant, you shall be more beloved before Me than all the peoples on the face of the earth.", "tj": "וּכְדוֹן אִם מִשְׁמָע תִשְׁמְעוּן בְּקַל מֵימְרִי וְתִטְרוֹן יַת קְיָמַי וּתְהַוּוּן לִשְׁמִי לְעַם אוֹחֲרָן וַחֲבִיבִין הֵיךְ סְגוּלָה מִן כָּל אוּמַיָא אֲרוּם לִשְׁמָא דַיְיָ הִיא כָּל אַרְעָא:", "tj_en": "And now, if you will truly hearken to the voice of My Word, and will keep My covenant, you shall be unto My Name a distinct people, and beloved as a precious treasure above all peoples; for all the earth is to the Name of the Lord.", "rashi": "<b>ועתה.<\/b> אִם עַתָּה תְקַבְּלוּ עֲלֵיכֶם, יֶעֱרַב לָכֶם מִכָּאן וָאֵילָךְ, שֶׁכָּל הַתְחָלוֹת קָשׁוֹת (מכילתא):<br><br><b>ושמרתם את בריתי.<\/b> שֶׁאֶכְרֹת עִמָּכֶם עַל שְׁמִירַת הַתּוֹרָה:<br><br><b>סגלה.<\/b> אוֹצָר חָבִיב, כְּמוֹ \"וּסְגֻלַּת מְלָכִים\" (קהלת ב') – כְּלֵי יְקָר וַאֲבָנִים טוֹבוֹת שֶׁהַמְּלָכִים גּוֹנְזִים אוֹתָם, כָּךְ אַתֶּם תִּהְיוּ לִי סְגֻלָּה מִשְּׁאָר אֻמּוֹת; וְלֹא תֹאמְרוּ אַתֶּם לְבַדְּכֶם שֶׁלִּי וְאֵין לִי אֲחֵרִים עִמָּכֶם וּמַה יֵּשׁ לִי עוֹד שֶׁתְּהֵא חִבַּתְכֶם נִכֶּרֶת:<br><br><b>כי לי כל הארץ<\/b> וְהֵם בְּעֵינַי וּלְפָנַי לִכְלוּם:", "rashi_en": "ועתה AND NOW — if you will now take upon yourselves the observance of My commandments, it will be pleasant (easy) to you from now and henceforth, for every beginning is difficult (Mekhilta).<br><br>ושמרתם את בריתי AND KEEP MY COVENANT which I shall make with you regarding the observance of the Torah (cf. (Mekhilta).<br><br>סגלה means a cherished treasure, the same as (Ecclesiastes 2:8) “and treasures (וסגלת) of kings” — costly vessels and precious stones which kings store up. In the same manner shall ye be unto Me a cherished treasure more than other peoples (Mekhilta) . Now do not say that ye alone belong to Me and that I have no other peoples together with (besides) you, and what else, therefore, have I by which the special love I bear you can be made evident; this is not so,<br><br>כי לי כל הארץ FOR ALL THE EARTH IS MINE, but in My eyes and before Me they are as nought."}, {"ch": 19, "v": 6, "aliyah": 4, "heb": "וְאַתֶּ֧ם תִּהְיוּ־לִ֛י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַדְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל־בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְאַתּוּן תְּהוֹן <b>קֳדָמַי מַלְכִין<\/b> כָּהֲנִין וְעַם קַדִישׁ אִלֵין פִּתְגָמַיָא דִי תְמַלֵל עִם בְּנֵי יִשְׂרָאֵל:", "onk_en": "You will be to [<b>before<\/b>] Me a kingdom of [<b>kings and<\/b>] kohanim, and a holy nation.’ These are the words that you shall speak to the Bnei Yisrael.”", "pj": "וְאַתּוּן תְּהוֹן קֳדָמַי מַלְכִין קְטִירֵי כְּלִילָא וְכַהֲנִין מְשַׁמְשִׁין וְעַם קַדִּישׁ אִלֵין פִּתְגָמַיָא דִּתְמַלֵּיל עִם בְּנֵי יִשְרָאֵל", "pj_en": "And before Me you shall be crowned kings, and sanctified priests, and a holy people. These are the words thou shalt speak to the sons of Israel.", "tj": "וְאַתּוּן תְּהַוָון לִשְׁמִי מַלְכִין וְכַהֲנִין וְאוּמָא קַדִּישָׁא אִלֵין דִּבְּרַיָיא דִּי תְמַלֵּיל:", "tj_en": "And to My Name shall you be kings and priests and a holy people. These are the words thou shalt speak.", "rashi": "<b>ואתם תהיו לי ממלכת כהנים.<\/b> שָׂרִים, כְּמָה דְּאַתְּ אָמַר \"וּבְנֵי דָּוִד כֹּהֲנִים\" (שמואל ב ח'):<br><br><b>אלה הדברים.<\/b> לֹא פָּחוֹת וְלֹא יוֹתֵר (מכילתא):", "rashi_en": "ואתם תהיו לי ממלכת כהנים AND YE SHALL BE UNTO ME A KINGDOM OF כהנים — i. e. princes, just as you say, (II Samuel 8:18) “And the sons of David were princes (כהנים)”, which cannot denote priests since his sons were of the tribe of Judah and not of Levi, the priestly tribe.<br><br>אלה הדברים THESE ARE THE WORDS — these neither fewer nor more (Mekhilta)."}, {"ch": 19, "v": 7, "aliyah": 5, "heb": "וַיָּבֹ֣א מֹשֶׁ֔ה וַיִּקְרָ֖א לְזִקְנֵ֣י הָעָ֑ם וַיָּ֣שֶׂם לִפְנֵיהֶ֗ם אֵ֚ת כׇּל־הַדְּבָרִ֣ים הָאֵ֔לֶּה אֲשֶׁ֥ר צִוָּ֖הוּ יְהֹוָֽה׃", "onk": "וַאֲתָא משֶׁה וּקְרָא לְסָבֵי עַמָא וְסַדַר קֳדָמֵיהוֹן יָת כָּל פִּתְגָמַיָא הָאִלֵין דְּפַקְדֵיהּ יְיָ:", "onk_en": "Moshe came [back] and called for the elders of the people. He presented to them all these words which Adonoy had commanded him.", "pj": "וְאָתָא משֶׁה בְּיוֹמָא הַהוּא וּקְרָא לְסָבֵי עַמָא וּסְדַר קֳדָמֵיהוֹן יַת כָּל פִּתְגָמַיָא הָאִלֵּין דְּפַקְדֵיהּ יְיָ", "pj_en": "And Mosheh came that day, and called the elders of the people, and set in order before them all these words which the Lord had commanded.", "tj": "וְאָתָא משֶׁה וּקְרָא לְחַכִּימַיָא דְיִשְרָאֵל וּסְדַר קֳדָמֵיהוֹן יַת כָּל דִּבְרַיָא הָאִלֵּין דְּפַקֵיד יָתֵיהּ מֵימְרָא דַיְיָ:", "tj_en": "And Mosheh came and called the sages of Israel and set in order before them all these words which the Word of the Lord had commanded him.", "rashi": "", "rashi_en": ""}, {"ch": 19, "v": 8, "aliyah": 5, "heb": "וַיַּעֲנ֨וּ כׇל־הָעָ֤ם יַחְדָּו֙ וַיֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר־דִּבֶּ֥ר יְהֹוָ֖ה נַעֲשֶׂ֑ה וַיָּ֧שֶׁב מֹשֶׁ֛ה אֶת־דִּבְרֵ֥י הָעָ֖ם אֶל־יְהֹוָֽה׃", "onk": "וַאֲתִיבוּ כָל עַמָא כַּחֲדָא וַאֲמָרוּ כֹּל דִי מַלִיל יְיָ נַעְבֵּד וַאֲתֵיב משֶׁה יָת פִּתְגָמֵי עַמָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "All the people responded in unison, and said, “All that Adonoy has spoke, we will do.” Moshe brought the words of the people to [<b>before<\/b>] Adonoy.", "pj": "וְאָתִיבוּ כָּל עַמָּא כַּחֲדָא וַאֲמָרוּ כָּל דְּמַלֵּיל יְיָ נַעֲבֵיד וְאָתֵיב משֶׁה יַת פִּתְגָמֵי עַמָּא קֳדָם יְיָ", "pj_en": "And all the people responded together, and said, All that the Lord hath spoken we will do. And Mosheh carried back the words of the people before the Lord.", "tj": "וְעַנְיָין כָּל עַמָּא כַּחֲדָא בְּלִבְּהוֹן שְׁלֵימָא וַאֲמָרוּ כָּל דִּי מַלֵּיל מֵימְרָא דַיְיָ נַעֲבֵיד וַחֲזַר משֶׁה יַת פִּתְגָמֵי עַמָּא בִּצְלוֹי קֳדָם יְיָ:", "tj_en": "And all the people answered together in the fulness of their heart, and said, All that the Word of the Lord hath spoken, we will do. And Mosheh returned the words of the people in prayer before the Lord.", "rashi": "<b>וישב משה את דברי העם וגו'.<\/b> בְּיוֹם הַמָּחֳרָת, שֶׁהוּא שְׁלִישִׁי, שֶׁהֲרֵי בְּהַשְׁכָּמָה עָלָה; וְכִי צָרִיךְ הָיָה מֹשֶׁה לְהָשִׁיב? אֶלָּא בָּא הַכָּתוּב לְלַמֶּדְךָ דֶּרֶךְ אֶרֶץ מִמֹּשֶׁה, שֶׁלֹּא אָמַר הוֹאִיל וְיוֹדֵעַ מִי שֶׁשְּׁלָחַנִי אֵינִי צָרִיךְ לְהָשִׁיב (שבת פ\"ז):", "rashi_en": "וישב משה את דברי העם וגו׳ AND MOSES RETURNED THE WORDS OF THE PEOPLE [UNTO THE LORD] on the next day, which was the third of the month, for he never ascended the mountain to God except early in the morning (Shabbat 86a). But was it really necessary for Moses to deliver the reply to God; God is Omniscient! — But the explanation is that Scripture intends to teach you good manners from the example of Moses: for he did not say, “Since He who sent me knows the reply there is no need for me to report it” (Mekhilta)."}, {"ch": 19, "v": 9, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י בָּ֣א אֵלֶ֘יךָ֮ בְּעַ֣ב הֶֽעָנָן֒ בַּעֲב֞וּר יִשְׁמַ֤ע הָעָם֙ בְּדַבְּרִ֣י עִמָּ֔ךְ וְגַם־בְּךָ֖ יַאֲמִ֣ינוּ לְעוֹלָ֑ם וַיַּגֵּ֥ד מֹשֶׁ֛ה אֶת־דִּבְרֵ֥י הָעָ֖ם אֶל־יְהֹוָֽה׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה הָא אֲנָא <b>מִתְגְלִי<\/b> לָךְ בְּעֵיבָא דַעֲנָנָא בְּדִיל דְיִשְׁמַע עַמָא בְּמַלָלוּתִי עִמָךְ וְאַף בָּךְ יְהֵימְנוּן לְעָלָם וְחַוִי משֶׁה יָת פִּתְגָמֵי עַמָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Adonoy said to Moshe, “Behold, I will come [<b>become revealed<\/b>] to you in a thick cloud, so that the people will hear when I speak to you, and they will also believe in you forever.” Moshe told Adonoy the words of the people [<b>before (Adonoy)<\/b>].", "pj": "וַאֲמַר יְיָ לְמשֶׁה בְּיוֹמָא תְּלִיתָאָה הָא אֲנָא מִתְגְּלֵי עֲלָךְ בְּעֵיבָא דַּעֲנַן יְקָרָא מִן בִּגְלַל דְּיִשְׁמְעוּן עַמָּא בְּמַלָּלוּתִי עִמָּךְ וְאוּף בָּךְ יְהֵימְנוּן לְעָלַם וְתַנִי משֶׁה יַת פִּתְגָּמֵי עַמָּא קֳדָם יְיָ", "pj_en": "And the Lord said to Mosheh, Behold, on the third day I will reveal Myself to thee in the depth of the cloud of glory, that the people may hear while I speak with thee, and may believe in thee forever. And Mosheh delivered the words of the people before the Lord.", "tj": "וַאֲמַר מֵימְרָא דַיְיָ לְמשֶׁה הָא מֵימְרִי מִתְגְּלֵי לָךְ בְּעַבְיָא דַּעֲנָנָא מִן בִּגְלַל דְּיִשְׁמְעוּן עַמָּא בְּמַלָּלוּתִי עִמָּךְ וּלְחוֹד בָּךְ מִילִי נְבוּאָתֵךְ משֶׁה עַבְדִי יְהֵימְנוּן לְעָלַם וְתַנִי משֶׁה יַת פִּתְגָּמֵי עַמָּא בִּצְלוֹי קֳדָם יְיָ:", "tj_en": "And the Word of the Lord said to Mosheh, Behold, My Word will be revealed to thee in the thickness of the cloud, that the people may hear while I speak with thee, and may
