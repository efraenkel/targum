it shall not be accepted of him who offered it, nor reckoned to him for righteousness; it will be a profane thing, and the man who eateth of it shall bear his sin.", "tj": "פִּגּוּל פְּסוּל יְהֵי:", "tj_en": "It will be a profane thing.", "rashi": "<b>ואם האכל יאכל וגו'.<\/b> בִּמְחַשֵּׁב בַּשְּׁחִיטָה לְאָכְלוֹ בַּשְּׁלִישִׁי הַכָּתוּב מְדַבֵּר; יָכוֹל אִם אָכַל מִמֶּנּוּ בַּשְּׁלִישִׁי יִפָּסֵל לְמַפְרֵעַ, תַּלְמוּד לוֹמַר הַמַּקְרִיב אֹתוֹ לֹא יֵחָשֵׁב — בִּשְׁעַת הַקְרָבָה הוּא נִפְסָל וְאֵינוֹ נִפְסָל בַּשְּׁלִישִׁי; וְכֵן פֵּרוּשׁוֹ: בִּשְׁעַת הַקְרָבָתוֹ לֹא תַּעֲלֶה זֹאת בְּמַחֲשָׁבָה, וְאִם חִשֵּׁב פִּגּוּל יִהְיֶה (זבחים כ\"ט):<br><br><b>והנפש האכלת ממנו.<\/b> אֲפִלּוּ בְּתוֹךְ הַזְּמַן <b>עונה תשא<\/b>:", "rashi_en": "אם האכל יאכל וגו' ‏ AND IF ANY [OF THE FLESH] SHOULD BE EATEN AT ALL [ON THE THIRD DAY) — Scripture is speaking of one who has the intention whilst slaughtering thė sacrifice to eat it (the flesh) on the third day. One might think that what the text really means is, that if one has eaten of it on the third day it becomes disqualified retrospectively (i. e., that it is regarded as having been invalid from the moment that it was offered)! Scripture, however, states, “As for him that offereth it, there shall be no מחשבה to him” implying that at the time when it is offered it can become disqualified, and that it cannot become disqualified on the third day (Sifra, Tzav, Section 8 1). And the following is its meaning (that of the text): At the time when it is offered, this shall not enter the mind of any priest performing a rite with it, to eat of it on the third day, and if he does harbour such a thought, it becomes פגול, an abominable thing,<br><br>והנפש האכלת ממנו AND THE SOUL THAT EATETH OF IT even within this period (of three days), עונה תשא SHALL BEAR ITS INIQUITY."}, {"ch": 7, "v": 19, "aliyah": 3, "heb": "וְהַבָּשָׂ֞ר אֲשֶׁר־יִגַּ֤ע בְּכׇל־טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּאֵ֖שׁ יִשָּׂרֵ֑ף וְהַ֨בָּשָׂ֔ר כׇּל־טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר׃", "onk": "וּבְסַר <b>קוּדְשָׁא<\/b> דִּי יִקְרַב בְּכָל מְסָאָב לָא יִתְאֲכֵל בְּנוּרָא יִתּוֹקָד וּבְסַר <b>קוּדְשָׁא<\/b> כָּל דִּי דְכֵי <b>לְקוּדְשָׁא<\/b> יֵיכוּל בְּסַר <b>קוּדְשָׁא<\/b>:", "onk_en": "The flesh [of [<b>the sacred<\/b>] offerings] that will touch any unclean [thing] may not be eaten; it shall be burned in fire. [As to] the [pure] [<b>sacred<\/b>] flesh, every [ritually] pure person [<b>fitting for the sacred<\/b>] may eat [the] [<b>sacred<\/b>] meat.", "pj": "וּבְשַר קוּדְשַׁיָא דִי יִקְרַב בְּכָל מְסָאָב לֵית אֶפְשַׁר דְמִיתְאָכֵיל בְּנוּרָא יִתּוֹקָד וּבְשַר קוּדְשָׁא כָּל דְיִדְכֵּי לְקוּדְשָׁא יֵיכוּל בְּשַר קוּדְשָׁא", "pj_en": "And if the flesh of things hallowed touch any uncleanness, it must not be eaten, but be burned in fire; but (as to) flesh that is consecrated, every one who is clean by sanctification may eat the hallowed flesh.", "tj": "", "tj_en": "", "rashi": "<b>והבשר.<\/b> שֶׁל קֹדֶשׁ שְׁלָמִים <b>אשר יגע בכל טמא לא יאכל<\/b>:<br><br><b>והבשר.<\/b> לְרַבּוֹת אֵבֶר שֶׁיָּצָא מִקְצָתוֹ — שֶׁהַפְּנִימִי מֻתָּר (ספרא):<br><br><b>כל טהור יאכל בשר.<\/b> מַה תַּ\"ל? לְפִי שֶׁנֶּאֱמַר וְדַם זְבָחֶיךָ יִשָּׁפֵךְ וְגוֹ' וְהַבָּשָֹר תֹּאכֵל (דברים י\"ב), יָכוֹל לֹא יֹאכְלוּ שְׁלָמִים אֶלָּא הַבְּעָלִים, לְכָךְ נֶאֱמַר כָּל טָהוֹר יֹאכַל בָּשָֹר (ספרא):<br><br>(<b>והבשר כל טהור יאכל בשר.<\/b> כְּלוֹמַר, כָּל מַה שֶּׁאָסַרְתִּי לְךָ בְּחַטָּאת וְאָשָׁם, שֶׁאִם יָצְאוּ חוּץ לַקְּלָעִים אֲסוּרִין — כְּמוֹ שֶׁכָּתוּב בַּחֲצַר אֹהֶל מוֹעֵד יֹאכְלוּהָ (ויקרא ו') — בְּבָשָׂר זֶה אֲנִי אוֹמֵר לְךָ כָּל טָהוֹר יֹאכַל בָּשָׂר אֲפִלּוּ בְּכָל הָעִיר):", "rashi_en": "והבשר AND THE FLESH of the sacred animals constituting peace-offerings (not that of פגול mentioned in v. 18, for this may not be eaten even though it does not touch an unclean thing), אשר יגע בכל טמא לא יאכל THAT TOUCHETH ANY UNCLEAN THING SHALL NOT BE EATEN. <br><br>והבשר — The word והבשר the second time it occurs in this verse is redundant (it should have stated: כל טהור יאכל בשר) but it is intended to include in the law mentioned here, the limb of a sacrifice that went forth (was brought out) in part from the place where it had to be eaten (in the case of שלמים, from Jerusalem, in that of קדשי קדשים, from the forecourt) — that the part that remained inside is permitted to be eaten (cf. Sifra, Tzav, Section 9 6).<br><br>כל טהור יאכל בשר ALL THAT ARE CLEAN MAY EAT FLESH — Why is this stated? Why should it not be assumed that a clean person may eat of the sacrifices? But, since it is stated, (Deuteronomy 12:27) “and the blood of thy sacrifices shall be poured upon the altar …, but the flesh thou mayest eat”, I might have thought, that as it speaks of thy sacrifices and states “thou mayest eat”, only the owner of the sacrifices may eat the peace-offerings! For this reason it is stated here: “all that are clean may eat flesh” (Sifra, Tzav, Section 9 7).<br><br>[והבשר כל טהור יאכל בשר ‎AND AS FOR THE FLESH ALL THAT ARE CLEAN MAY EAT FLESH — This is as much as to say: all that I have told thee (some editions read: שאסרתי לך, — “that I have forbidden thee”), is only in the case of the sin-offering and a guilt-offering: that if these went forth (were carried forth) without the hangings of the forecourt they are forbidden (נפסלים ביוצא), as it is said, (Leviticus 6:19) “in the enclosure of the tent of meeting”) shall they eat it”; but with regard to this flesh (that of שלמים) I tell thee, “all that are clean may eat flesh” even amidst all the people (some editions read: בכל העיר, “in the whole city”, which is what “amidst all the people” is intended to mean)]."}, {"ch": 7, "v": 20, "aliyah": 3, "heb": "וְהַנֶּ֜פֶשׁ אֲשֶׁר־תֹּאכַ֣ל בָּשָׂ֗ר מִזֶּ֤בַח הַשְּׁלָמִים֙ אֲשֶׁ֣ר לַיהֹוָ֔ה וְטֻמְאָת֖וֹ עָלָ֑יו וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵעַמֶּֽיהָ׃", "onk": "וֶאֱנַשׁ דִּי תֵיכוּל בִּסְרָא מִנִּכְסַת <b>קוּדְשַׁיָּא דִּי קֳדָם<\/b> יְיָ וְסוֹבְתֵיהּ עֲלוֹהִי וְיִשְׁתֵּיצֵי אֱנָשָׁא הַהִיא מֵעַמַּהּ:", "onk_en": "The person who eats of the flesh of the peace[<b>sacred<\/b>]-offering belonging to [<b>which is before<\/b>] Adonoy while his uncleaness is yet on him, that persons soul shall be cut off from its people.", "pj": "וּבַר נַשׁ דְיֵיכוֹל בִּסְרָא מִנִכְסַת קוּדְשַׁיָא דְמִתְקַרְבִין קֳדָם יְיָ וּסְאוֹבְתֵיהּ עֲלוֹי וְיִשְׁתְּצֵי בַּר נְשָׁא הַהוּא מֵעַמֵיהּ", "pj_en": "But the man who eateth of the flesh of the hallowed sacrifice that is offered before the Lord with his uncleanness upon him, that man shall be destroyed from among his people.", "tj": "", "tj_en": "", "rashi": "<b>וטמאתו עליו.<\/b> בְּטֻמְאַת הַגּוּף הַכָּתוּב מְדַבֵּר, אֲבָל טָהוֹר שֶׁאָכַל אֶת הַטָּמֵא אֵינוֹ עָנוּשׁ כָּרֵת אֶלָּא אַזְהָרַת <b>והבשר אשר יגע בכל טמא וגו';<\/b> וְאַזְהָרַת טָמֵא שֶׁאָכַל אֶת הַטָּהוֹר אֵינָהּ מְפֹרֶשֶׁת בַּתּוֹרָה, אֶלָּא חֲכָמִים לְמָדוּהָ בִּגְזֵרָה שָׁוָה; שָׁלוֹשׁ כָּרֵתוֹת אֲמוּרוֹת בְּאוֹכְלֵי קָדָשִׁים בְּטֻמְאַת הַגּוּף, וּדְרָשׁוּם רַבּוֹתֵינוּ בִּשְׁבוּעוֹת אַחַת לִכְלָל, וְאַחַת לִפְרָט, וְאַחַת לְלַמֵּד עַל קָרְבָּן עוֹלֶה וְיוֹרֵד שֶׁלֹּא נֶאֱמַר אֶלָּא עַל טֻמְאַת מִקְדָּשׁ וְקָדָשָׁיו:", "rashi_en": "וטמאתו עליו [BUT THE SOUL THAT EATETH OF THE FLESH OF THE SACRIFICES …] HAVING ITS (or HIS) UNCLEANNESS UPON IT (or HIM) — Scripture is speaking here of the uncleanness of the person (i.e., the words mean: And the soul (person) that eateth of the flesh of the שלמים whilst his uncleanness is upon him; it does not mean: the person who eateth the flesh whilst its uncleanness is upon it) (Sifra, Tzav, Chapter 14 3; Zevachim 43b; cf. Rashi on Leviticus 22:3). But a clean person who eats unclean sacrificial flesh is not punished with excision, as is the case here, but only for transgressing the prohibition in v. 19:“And the flesh, that toucheth any unclean thing [shall not be eaten]”, for which the punishment is lashes. The prohibition referring to the case of “an unclean person who eats holy things” for which our text states the punishment is not expressly mentioned in the Torah but the Sages derived it by means of a verbal analogy (ג\"ש) (Makkot 14b). — Three times is the punishment of excision stated in the Torah with reference to people eating holy sacrifices in a state of bodily uncleanness, (here, in v. 21 and in Leviticus 22:3), and our Rabbis explained them in Treatise Shevuot 7a as follows: one is intended as a general statement, the other as referring to a particular case and the third is intended to teach about the קרבן עולה ויורד (the sacrifice of higher or lesser value according to monetary circumstances of him who offers it; Leviticus 5:2, 3), that it is prescribed only as an atonement for communicating uncleanness to the Temple or sacred food by entering the former or eating the latter in a state of uncleanness (cf. Rashi on Leviticus 22:3 and Note thereon)."}, {"ch": 7, "v": 21, "aliyah": 3, "heb": "וְנֶ֜פֶשׁ כִּֽי־תִגַּ֣ע בְּכׇל־טָמֵ֗א בְּטֻמְאַ֤ת אָדָם֙ א֣וֹ&thinsp;<b>׀<\/b> בִּבְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּכׇל־שֶׁ֣קֶץ טָמֵ֔א וְאָכַ֛ל מִבְּשַׂר־זֶ֥בַח הַשְּׁלָמִ֖ים אֲשֶׁ֣ר לַיהֹוָ֑ה וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵעַמֶּֽיהָ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br><sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(אין פרשה בספרי ספרד ואשכנז)<\/i>", "onk": "וֶאֱנַשׁ אֲרֵי תִקְרַב בְּכָל מְסָאָב בְּסוֹאֲבַת אֱנָשָׁא אוֹ בִּבְעִירָא מְסָאֲבָא אוֹ בְּכָל שִׁקְצָא מְסָאָב וְיֵיכוּל מִבְּסַר <b>נִכְסַת<\/b> קוּדְשַׁיָּא דִּי <b>קֳדָם<\/b> יְיָ וִישְׁתֵּיצֵי אֱנָשָׁא הַהִיא מֵעַמַּהּ:", "onk_en": "A person who touches anything unclean, be it the impurities of man or an unclean animal, or any unclean creeping creature and then eats some flesh of the peace[<b>sacred<\/b>]-offering belonging to [<b>which is before<\/b>] Adonoy, that persons soul shall be cut off from its people.", "pj": "וּבַר נַשׁ אֲרוּם יַקְרִיב בְּכָל מְסָאָב בְּסוֹאֲבוֹת אֵינָשָׁא אוֹ בִּבְעִירָא מְסָאֲבָא אוֹ בְּכָל שִׁיקוּץ מְסָאָב וְיֵיכוּל מִבְּשַר נִכְסַת קוּדְשַׁיָא דְמִתְקַרְבִין קֳדָם יְיָ וְיִשְׁתְּצֵי בַּר נְשָׁא הַהוּא מֵעַמֵיהּ", "pj_en": "The man also who toucheth any unclean thing, whether the uncleanness of man, or of unclean beasts, or any unclean reptile, and eateth of the flesh of the hallowed sacrifices offered before the Lord, that man shall be cut off from his people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 22, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 23, "aliyah": 3, "heb": "דַּבֵּ֛ר אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר כׇּל־חֵ֜לֶב שׁ֥וֹר וְכֶ֛שֶׂב וָעֵ֖ז לֹ֥א תֹאכֵֽלוּ׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל לְמֵימָר כָּל תְּרַב תּוֹר וְאִמָּר וְעִזָּא לָא תֵיכְלוּן:", "onk_en": "Speak to Bnei Yisroel, saying: any fat of oxen, sheep or goats you must not eat.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל לְמֵימָר כָּל תְּרַב תּוֹר וְאִימַר וְעִיזָא לָא תֵיכְלוּן", "pj_en": "Speak with the sons of Israel, saying: You may not eat any fat of oxen, or sheep, or goats;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 24, "aliyah": 3, "heb": "וְחֵ֤לֶב נְבֵלָה֙ וְחֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְכׇל־מְלָאכָ֑ה וְאָכֹ֖ל לֹ֥א תֹאכְלֻֽהוּ׃", "onk": "וּתְרַב נְבִילָא וּתְרַב תְּבִירָא יִתְעֲבֵד לְכָל עִבִדְתָּא וּמֵיכַל לָא תֵיכְלֻנֵּיהּ:", "onk_en": "The fat of an improperly slaughtered animal and the fat of a fatally wounded animal may be used for any purpose, but you are surely not permitted to eat it.", "pj": "וּתְרֵיב חֵיוָא דִמְקַלְקְלָא בְּשַׁעַת נִיכְסְתָא וּדְמִיתְנַבְלָא בְּמוֹתָנָא וּתְרֵיב חֵיוָא תְבִירָא אֶפְשַׁר דְיִתְעֲבֵיד לְכָל עִיבִידְתָּא בְּרַם תְּרֵיב חֵיוָא דִמְכַשְׁרָא יִתְסַק עַל מַדְבְּחָא וּמֵיכַל לָא תֵיכְלוּנֵיהּ", "pj_en": "but the fat of an animal which corrupteth in the hour of sacrifice, or which dieth a dead thing by death, or the fat of a beast that is torn, may be used in any work; but the fat of an animal that is in a right (condition) shall be burned upon the altar, and shall in no wise be eaten.", "tj": "", "tj_en": "", "rashi": "<b>יעשה לכל מלאכה.<\/b> בָּא וְלִמֵּד עַל הַחֵלֶב שֶׁאֵינוֹ מְטַמֵּא טֻמְאַת נְבֵלוֹת:<br><br><b>ואכל לא תאכלהו.<\/b> אָמְרָה תּוֹרָה, יָבֹא אִסּוּר נְבֵלָה וּטְרֵפָה וְיָחוּל עַל אִסּוּר חֵלֶב, שֶׁאִם אֲכָלוֹ יִתְחַיֵּב אַף עַל לָאו שֶׁל נְבֵלָה, וְלֹא תֹּאמַר אֵין אִסּוּר חָל עַל אִסּוּר (זבחים ע'):", "rashi_en": "יעשה לכל מלאכה [AND THE FAT OF CARRION AND THE FAT OF THAT WHICH IS TORN] MAY BE USED IN ANY WORK — Scripture comes and teaches you with regard to חלב (the forbidden fat) of carrion that it does not acquire the “uncleanness of carrion” (‎‏טומאת נבלות), i.e. that whilst the flesh is unclean (cf. Leviticus 11:39) the fat (חלב) does not acquire this uncleanness (cf. Sifra, Tzav, Section 10 5; Pesachim 23a, b).<br><br>תאכלוה ‎לא ‎‏ ואכל[AND THE FAT OF CARRION … MAY BE USED IN ANY WORK] BUT YE SHALL IN NO WISE EAT OF IT — By these words it is not intended to forbid the eating of the חלב of a נבלה and טרפה because it is חלב for this has already been forbidden in Leviticus 3:17, but the Torah in effect says here: The prohibition of eating נבלה or טרפה shall come and fall upon (shall form an additional prohibition to) that of חלב — that if one eats it (the חלב of נבלה or of טרפה) he becomes liable to the punishment for transgressing the prohibition of נבלה also, (or of טרפה also), and you should not say: No prohibition can be super-imposed upon another prohibition already existing (Zevachim 70a)."}, {"ch": 7, "v": 25, "aliyah": 3, "heb": "כִּ֚י כׇּל־אֹכֵ֣ל חֵ֔לֶב מִ֨ן־הַבְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛נָּה אִשֶּׁ֖ה לַיהֹוָ֑ה וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הָאֹכֶ֖לֶת מֵֽעַמֶּֽיהָ׃", "onk": "אֲרֵי כָּל דְּיֵכוּל תַּרְבָּא מִן בְּעִירָא דִּי יְקָרְבוּן מִנַּהּ <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ וְיִשְׁתֵּיצֵי <b>אֱנָשָׁא<\/b> דִי תֵיכוּל מֵעַמַּהּ:", "onk_en": "For, anyone who eats fat of an animal from which is offered a fire-offering to [<b>as offering before<\/b>] Adonoy, the soul [<b>person<\/b>] who ate it shall be cut off from its people.", "pj": "אֲרוּם כָּל דְיֵיכוֹל תְּרֵיב מִן בְּעִירָא דְמִתְכַּשְׁרָא לְמִיקְרַב מִנֵיהּ קָרְבָּנָא קֳדָם יְיָ וְיִשְׁתְּצֵי בַּר נְשָׁא הַהוּא דְיֵיכוֹל יַת תַּרְבָּא מֵעַמֵיהּ", "pj_en": "For he who eateth (the fat) of an animal that is fit to be offered as an oblation before the Lord, that man who eateth the fat shall be cut off from his people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 26, "aliyah": 3, "heb": "וְכׇל־דָּם֙ לֹ֣א תֹאכְל֔וּ בְּכֹ֖ל מוֹשְׁבֹתֵיכֶ֑ם לָע֖וֹף וְלַבְּהֵמָֽה׃", "onk": "וְכָל דְּמָא לָא תֵיכְלוּן בְּכָל מוֹתְבָנֵיכוֹן דְּעוֹפָא וְדִבְעִירָא:", "onk_en": "You shall not eat any blood, in all your dwelling places, be it of fowl or of beast.", "pj": "וְכָל אַדְמָא לָא תֵיכְלוּן בְּכָל מוֹתְבָנֵיכוֹן לְעוֹפָא וְלִבְעִירָא", "pj_en": "In none of your dwellings shall you eat the blood whether of bird or of beast.", "tj": "", "tj_en": "", "rashi": "<b>בכל מושבתיכם.<\/b> לְפִי שֶׁהִיא חוֹבַת הַגּוּף וְאֵינָהּ חוֹבַת קַרְקַע נוֹהֶגֶת בְּכָל מוֹשָׁבוֹת, וּבְמַסֶּכֶת קִדּוּשִׁין בְּפֶרֶק א' מְפֹרָשׁ לָמָּה הֻצְרַךְ לוֹמַר:<br><br><b>לעוף ולבהמה.<\/b> פְּרָט לְדַם דָּגִים וַחֲגָבִים (כריתות כ'):", "rashi_en": "בכל מושבתיכם [YE SHALL EAT NO BLOOD …] IN ALL YOUR HABITATIONS — Since this is a personal duty (חובת הגוף) and not a duty depending upon Palestinian soil it applies wherever Israelites are settled). In Treatise Kiddushin, first chapter, (Kiddushin 37b) it is explained why it is necessary to use this term (i. e. to add ‎בכל משבתיכם).<br><br>לעוף ולבהמה ‎Excluded [from this prohibition is] the blood of fish and locusts. "}, {"ch": 7, "v": 27, "aliyah": 3, "heb": "כׇּל־נֶ֖פֶשׁ אֲשֶׁר־תֹּאכַ֣ל כׇּל־דָּ֑ם וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מֵֽעַמֶּֽיהָ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br><sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(אין פרשה בספרי תימן)<\/i>", "onk": "כָּל אֱנָשָׁא דִי תֵיכוּל כָּל דְּמָא וְיִשְׁתֵּיצֵי <b>אֱנָשָׁא<\/b> הַהִיא מֵעַמַּהּ:", "onk_en": "Any person who eats any blood, that soul [<b>person<\/b>] shall be cut off from its people.", "pj": "כָּל בַּר נַשׁ דְיֵיכוֹל כָּל אֲדָם מִן דְכָל חַי וְיִשְׁתְּצֵי בַּר נְשָׁא הַהוּא מֵעַמֵיהּ", "pj_en": "Every man who eateth the blood of any living thing, that man shall be cut off from his people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 28, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 29, "aliyah": 3, "heb": "דַּבֵּ֛ר אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר הַמַּקְרִ֞יב אֶת־זֶ֤בַח שְׁלָמָיו֙ לַיהֹוָ֔ה יָבִ֧יא אֶת־קׇרְבָּנ֛וֹ לַיהֹוָ֖ה מִזֶּ֥בַח שְׁלָמָֽיו׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל לְמֵימָר דִּמְקָרֵב יָת נִכְסַת <b>קוּדְשׁוֹהִי קֳדָם<\/b> יְיָ יַיְתִי יָת קֻרְבָּנֵיהּ <b>לָקֳדָם<\/b> יְיָ מִנִּכְסַת <b>קוּדְשׁוֹהִי<\/b>:", "onk_en": "Speak to Bnei Yisroel, saying: Whoever shall bring the sacrifice of his peace[<b>sacred<\/b>]-offering to [<b>before<\/b>] Adonoy, he shall bring his offering to [<b>before<\/b>] Adonoy from his peace[<b>sacred<\/b>]-offering.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל לְמֵימָר כָּל מַאן דְמִקְרַב יַת נִכְסַת קוּדְשׁוֹי קֳדָם יְיָ יַיְתֵי בְּגַרְמֵיהּ יַת קוּרְבָּנֵיהּ לִקְדָם יְיָ מִן נִכְסַת קוּדְשׁוֹי", "pj_en": "Speak with the sons of Israel, saying: Whosoever presenteth his hallowed sacrifice before the Lord, shall himself bring the oblation of his hallowed sacrifice unto the presence of the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 30, "aliyah": 3, "heb": "יָדָ֣יו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהֹוָ֑ה אֶת־הַחֵ֤לֶב עַל־הֶֽחָזֶה֙ יְבִיאֶ֔נּוּ אֵ֣ת הֶחָזֶ֗ה לְהָנִ֥יף אֹת֛וֹ תְּנוּפָ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "יְדוֹהִי תַיְתוּן יָת <b>קֻרְבָּנַיָּא<\/b> דַיְיָ יָת תַּרְבָּא עַל חֶדְיָא יַיְתִנֵּיהּ יָת חֶדְיָא לַ<b>אֲרָמָא<\/b> יָתֵיהּ <b>אֲרוּמָא<\/b> קֳדָם יְיָ:", "onk_en": "His hands shall bring the fire-offerings [<b>offerings<\/b>] of Adonoy; he shall bring the fat on the breast and the breast [itself] to wave [<b>lift<\/b>] them [<b>up<\/b>] as a wave-offering [<b>an uplifted-offering<\/b>] before Adonoy.", "pj": "יְדוֹי יַיְתִין יַת קוּרְבָּנַיָא דַיְיָ דִי יַפְרֵשׁ מִנִכְסַת קוּדְשֵׁיהּ יַת תַּרְבָּא שׁוּמְנוּנִיתָא דְעַל חַדְיָא וְיַת חַדְיָא כַּד מַחְתָּךְ בִּתְרֵין עִילְעִין מִיכָּא וּתְרֵין עִלְעִין מִיכָּא לִקֳבֵיל אַפְקוֹתָא יַיְתִינֵהּ לַאֲרָמָא יָתֵיהּ אֲרָמָא קֳדָם יְיָ", "pj_en": "His hands shall bring the oblations of the Lord which he would set apart as his hallowed sacrifice, the fat, the fatness that is upon the breast, and the breast cut out with two ribs here and two ribs there at the top, shall be bring to be uplifted, an elevation before the Lord.", "tj": "יְדוֹי יִתְעֲלָן יַת קוּרְבָּנַיָא דַיְיָ יַת תַּרְבָּא דְעַל נְיָעָא יְהַב יָתֵיהּ וְיַת נְיָעָא לְמִנְפָא יָתֵיהּ אַנְפּוֹי קֳדָם יְיָ:", "tj_en": "His own hands shall bring in the oblation of the Lord: the fat which is upon the breast he shall give it, and the breast, to wave it a wave offering before the Lord.", "rashi": "<b>ידיו תביאינה וגו'.<\/b> שֶׁתְּהֵא יַד הַבְּעָלִים מִלְּמַעְלָה, וְהַחֵלֶב וְהֶחָזוֹת נְתוּנִין בָּהּ, וְיַד כֹּהֵן מִלְּמַטָּה וּמְנִיפָן (מנחות ס\"א):<br><br><b>את אשי ה'.<\/b> וּמָה הֵן הָאִשִּׁים?<br><br><b>את החלב על החזה יביאנו.<\/b> כְּשֶׁמְּבִיאוֹ מִבֵּית הַמִּטְבָּחַיִם נוֹתֵן חֵלֶב עַל הֶחָזֶה, וּכְשֶׁנּוֹתְנוֹ לְיַד הַכֹּהֵן הַמֵּנִיף נִמְצָא הֶחָזֶה לְמַעְלָה וְהַחֵלֶב לְמַטָּה, וְזֶהוּ הָאָמוּר בְּמָקוֹם אַחֵר שׁוֹק הַתְּרוּמָה וַחֲזֵה הַתְּנוּפָה עַל אִשֵּׁי הַחֲלָבִים יָבִיאוּ לְהָנִיף וְגוֹ' (ויקרא י'), וּלְאַחַר הַתְּנוּפָה נוֹתְנוֹ לַכֹּהֵן הַמַּקְטִיר, וְנִמְצָא הֶחָזֶה לְמַטָּה, וְזֶהוּ שֶׁנֶּאֱמַר וַיָּשִֹימוּ אֶת הַחֲלָבִים עַל הֶחָזוֹת וַיַּקְטֵר הַחֲלָבִים הַמִּזְבֵּחָה (שם ט'), לִמְּדָנוּ שֶׁשְּׁלוֹשָׁה כֹּהֲנִים זְקוּקִין לָהּ, כָּךְ מְפֹרָשׁ בִּמְנָחוֹת:<br><br><b>את החלב על החזה יביאנו.<\/b> וְאֶת הֶחָזֶה לָמָּה מֵבִיא? לְהָנִיף אוֹתוֹ הוּא מְבִיאוֹ וְלֹא שֶׁיְּהֵא הוּא מֵהָאִשִּׁים: לְפִי שֶׁנֶּאֱמַר <b>את אשי ה' את החלב על החזה<\/b> יָכוֹל שֶׁיְּהֵא אַף הֶחָזֶה לָאִשִּׁים, לְכָךְ נֶאֱמַר <b>את החזה להניף וגו'<\/b>:", "rashi_en": "'ידיו תביאינה וגו‎ HIS OWN HANDS NAMELY SHALL BRING [THE FIRE OFFERINGS OF THE LORD] — This means that the owner’s hand shall be above and the fat and the breasts shall be lying in it, and the priest’s hand shall be beneath (i. e. beneath the hand of the owner) — and thus does he wave them (Menachot 61b).<br><br>‎'את אשי ה‎ THE FIRE OFFERINGS OF THE LORD — and what are these fire-offerings that he shall bring?<br><br>‎החזה יביאנו‎ ‎‏ את החלב על‏THE FAT UPON THE BREAST SHALL HE BRING — When he (the first priest; see below) brings it from the slaughtering-place he places the fat upon the breast, and when he afterwards transfers it into the hand of the priest who is to do the waving it follows that the breast is on top and the fat beneath; — that is what Scripture states in another passage, (Leviticus 10:15) “The heave shoulder and the wave breasts shall they bring upon (על) the fire-offerings of the fat, to wave it for a wave offering etc.” (i. e. during the waving the חזה ושוק shall be on top). After the waving he (that priest) transfers it to the priest who is to burn it on the altar, when consequently the breast is again beneath; — that is what Scripture states, (Leviticus 9:20) “And they put the fat upon the breasts, and he burnt the fat at the altar”. Thus we learn that three priests are required for it (for the rite of waving). Thus is it explained in Treatise Menachot 62a.<br><br>את החלב על החזה יביאנה THE BREAST WITH THE FAT, IT SHALL HE BRING — And to what end does he bring the breast? This is stated in the words that follow: “[As for the breast], להניף אותו for the purpose of waving it” shall he bring it, and not that it, too, should become part of the fire offerings. But because it states את אשי ה' את החלב על החזה \"‎the fire-offerings of the Lord — the fat with the breast”, I might think that the breast also belongs to the fire-offerings, Scripture therefore continues: 'את החזה להניף וגו, “he brings the breast to wave it, etc.”"}, {"ch": 7, "v": 31, "aliyah": 3, "heb": "וְהִקְטִ֧יר הַכֹּהֵ֛ן אֶת־הַחֵ֖לֶב הַמִּזְבֵּ֑חָה וְהָיָה֙ הֶֽחָזֶ֔ה לְאַהֲרֹ֖ן וּלְבָנָֽיו׃", "onk": "וְיַסֵּק כַּהֲנָא יָת תַּרְבָּא לְמַדְבְּחָא וִיהֵי חֶדְיָא לְאַהֲרֹן וְלִבְנוֹהִי:", "onk_en": "The <i>kohein<\/i> shall burn the fat on the altar and the breast shall belong to Aharon and to his sons.", "pj": "וְיִסַק כַּהֲנָא יַת תַּרְבָּא לְמַדְבְּחָא וִיהֵי חַדְיָא לְאַהֲרן וְלִבְנוֹי", "pj_en": "And the priest shall burn the fat upon the altar, and the breast shall be for Aharon and for his sons.", "tj": "החזה נְיָיעָא:", "tj_en": "The breast.", "rashi": "<b>והקטיר הכהן את החלב.<\/b> וְאַחַ\"כַּ <b>והיה החזה לאהרן<\/b>, לִמְּדָנוּ שֶׁאֵין הַבָּשָׂר נֶאֱכָל בְּעוֹד שֶׁהָאֵמוּרִים לְמַטָּה מִן הַמִּזְבֵּחַ (ספרא):", "rashi_en": "והקטיר הכהן את החלב AND THE PRIEST SHALL CAUSE THE FAT TO ASCEND IN FUMES [AT THE ALTAR] and only afterwards,  והיה החזה לאהרן  SHALL THE BREAST BE AARON’S [AND HIS SONS] — This teaches us that the flesh of the sacrifices may not be eaten so long as the fat portions are below the altar (have not yet been placed upon it and burnt) (Sifra, Tzav, Chapter 16 4; Pesachim 59b)."}, {"ch": 7, "v": 32, "aliyah": 3, "heb": "וְאֵת֙ שׁ֣וֹק הַיָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַכֹּהֵ֑ן מִזִּבְחֵ֖י שַׁלְמֵיכֶֽם׃", "onk": "וְיָת שׁוֹקָא דְיַמִּינָא תִּתְּנוּן אַפְרָשׁוּתָא לְכַהֲנָא מִנִּכְסַת <b>קוּדְשֵׁיכוֹן<\/b>:", "onk_en": "The right thigh you shall give as a separated portion to the <i>kohein,<\/i> from your peace[<b>sacred<\/b>]-offerings.", "pj": "וְיַת שַׁקָא דְיַמִינָא מִן כַּתְפָא וְעַד דְרוֹעָא תִּתְּנוּן אַפְרָשׁוּתָא לְכַהֲנָא מִנִכְסַת קוּדְשֵׁיכוֹן", "pj_en": "And the right shoulder of your hallowed sacrifice from the side unto the extremity (deroa, arm) you shall give as a separation unto the priest.", "tj": "", "tj_en": "", "rashi": "<b>שוק.<\/b> מִן הַפֶּרֶק שֶׁל אַרְכֻּבָּה הַנִּמְכֶּרֶת עִם הָרֹאשׁ עַד הַפֶּרֶק הָאֶמְצָעִי שֶׁהוּא סֹבֶךְ שֶׁל רֶגֶל (חולין קל\"ד):", "rashi_en": "שוק is that limb of the right rear-leg extending from the knee-joint, the bone and blesh of which are usually sold as offal together with the head, unto the middle joint which is what is known as the סובך of the leg (the סובד is the small bone between that middle joint and the thigh-bone; consequently the שוק spoken of in connection with שלמים is the middle one of the three limbs that form an animal’s leg) (Chullin 134b)."}, {"ch": 7, "v": 33, "aliyah": 3, "heb": "הַמַּקְרִ֞יב אֶת־דַּ֧ם הַשְּׁלָמִ֛ים וְאֶת־הַחֵ֖לֶב מִבְּנֵ֣י אַהֲרֹ֑ן ל֧וֹ תִהְיֶ֛ה שׁ֥וֹק הַיָּמִ֖ין לְמָנָֽה׃", "onk": "דִּמְקָרֵב יָת דַּם נִכְסַת <b>קוּדְשַׁיָּא<\/b> וְיָת תַּרְבָּא מִבְּנֵי אַהֲרֹן דִּילֵיהּ תְּהֵי שׁוֹקָא דְיַמִּינָא לָחֳלָק:", "onk_en": "Whoever offers the blood of the peace[<b>sacred<\/b>]-offering and the fat who is of the sons of Aharon, the right thigh shall belong to him as a portion.", "pj": "מַאן דִמְקַרֵב יַת אֲדַם נִכְסַת קוּדְשַׁיָא וְיַת תְּרֵיב מִן בְּנֵי אַהֲרן דִילֵיהּ תְּהֵי שַׁקָא דְיַמִינָא לְחוּלַק", "pj_en": "He of the sons of Aharon who offereth the blood and the fat of the hallowed sacrifice shall have the right shoulder as his portion.", "tj": "", "tj_en": "", "rashi": "<b>המקריב את דם השלמים וגו'.<\/b> מִי שֶׁהוּא רָאוּי לִזְרִיקָתוֹ וּלְהַקְטִיר חֲלָבָיו, יָצָא טָמֵא בִּשְׁעַת זְרִיקַת דָּמִים אוֹ בִּשְׁעַת הֶקְטֵר חֲלָבִים שֶׁאֵינוֹ חוֹלֵק בַּבָּשָׂר (ספרא):", "rashi_en": "‎'וגו‎‎‎‎‎‎‎‏‎ השלמים ‎  ‏‏‎דם‎ ‎את ‎‎המקריב‎ [HE AMONG THE SONS OF AARON] THAT OFFERETH THE BLOOD OF THE PEACE-OFFERINGS [AND THE FAT SHALL HAVE THE SHOULDER OF THE RIGHT SIDE FOR HIS PART] — “He that offereth the blood” means: he who is fitted to perform the sprinkling of it and to burn the fat portions, — thus excluding a priest who was unclean at the time when the blood was sprinkled, or the fat portions were burnt — that he does not share in the flesh (Sifra, Tzav, Chapter 16 8; Zevachim 98b)."}, {"ch": 7, "v": 34, "aliyah": 3, "heb": "כִּי֩ אֶת־חֲזֵ֨ה הַתְּנוּפָ֜ה וְאֵ֣ת&thinsp;<b>׀<\/b> שׁ֣וֹק הַתְּרוּמָ֗ה לָקַ֙חְתִּי֙ מֵאֵ֣ת בְּנֵֽי־יִשְׂרָאֵ֔ל מִזִּבְחֵ֖י שַׁלְמֵיהֶ֑ם וָאֶתֵּ֣ן אֹ֠תָ֠ם לְאַהֲרֹ֨ן הַכֹּהֵ֤ן וּלְבָנָיו֙ לְחׇק־עוֹלָ֔ם מֵאֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "אֲרֵי יָת חֶדְיָא דַ<b>אֲרָמוּתָא<\/b> וְיָת שׁוֹקָא דְ<b>אַפְרָשׁוּתָא<\/b> נְסֵבִית מִן בְּנֵי יִשְׂרָאֵל מִנִּכְסַת <b>קוּדְשֵׁיהוֹן<\/b> וִיהָבִית יָתְהוֹן לְאַהֲרֹן כַּהֲנָא וְלִבְנוֹהִי לִקְיָם עָלָם מִן בְּנֵי יִשְׂרָאֵל:", "onk_en": "Because the breast wave[<b>uplifted<\/b>]-offering and the thigh [that is] the uplifted [<b>separated<\/b>] portion I have taken from Bnei Yisroel. from their peace[<b>sacred<\/b>]-offerings and I have given them to Aharon the <i>kohein<\/i> and to his sons, as an everlasting statute, from Bnei Yisroel.", "pj": "אֲרוּם יַת חַדְיָא דַאֲרָמוּתָא וְיַת שׁוֹקָא דְאַפְרָשׁוּתָא נְסֵיבִית מִן בְּנֵי יִשְרָאֵל מִן נִכְסַת קוּדְשֵׁיהוֹן וִיהָבִית יַתְהוֹן לְאַהֲרן כַּהֲנָא וְלִבְנוֹי לִקְיַים עֲלָם מִן בְּנֵי יִשְרָאֵל", "pj_en": "For the uplifted breast and the shoulder of separation have I taken of your hallowed sacrifice, and given them to Aharon the priest and to his sons by an everlasting statute, from the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>תנופה, תרומה.<\/b> מוֹלִיךְ וּמֵבִיא מַעֲלֶה וּמוֹרִיד (מנחות ס\"ב):", "rashi_en": "תנופה … .תרומה WAVE [BREAD AND] HEAVE [SHOULDER] — This implies that he (the priest) moved them to and fro in a horizontally direction (תנופה) and moves them up and down (תרומה) (Sifra, Tzav, Chapter 16 3; cf. Rashi on Exodus 29:27 and Note thereon)."}, {"ch": 7, "v": 35, "aliyah": 3, "heb": "זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּמִשְׁחַ֣ת בָּנָ֔יו מֵאִשֵּׁ֖י יְהֹוָ֑ה בְּיוֹם֙ הִקְרִ֣יב אֹתָ֔ם לְכַהֵ֖ן לַיהֹוָֽה׃", "onk": "דָּא <b>רְבוּת<\/b> אַהֲרֹן וּ<b>רְבוּת<\/b> בְּנוֹהִי <b>מִקֻּרְבָּנַיָּא<\/b> דַּיְיָ בְּיוֹמָא דִּיְקָרְבוּן יָתְהוֹן לְשַׁמָּשָׁא קֳדָם יְיָ:", "onk_en": "This is [for] the anointing [<b>inauguration to greatness<\/b>] of Aharon and [for] the anointing [<b>inauguration to greatness<\/b>] of his sons from the fire-offering [<b>offerings<\/b>] of Adonoy, on the day He brought them to serve before Adonoy,", "pj": "דָא רְבוּתָא דְאַהֲרן וּרְבוּתָא דִבְנוֹי עַל כָּל אֲחוּהוֹן לֵיוָאֵי דְיֵיכְלוּן מִקוּרְבָּנַיָא דַיְיָ בְּיוֹמָא דִיְקָרְבוּן יַתְהוֹן לְשַׁמָשָׁא קֳדָם יְיָ", "pj_en": "This pertaineth to the consecration of Aharon and to the consecration of his sons over all the Levites their brethren, that they may eat of the Lord's oblations in the day that they present them to minister before the Lord;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 36, "aliyah": 3, "heb": "אֲשֶׁר֩ צִוָּ֨ה יְהֹוָ֜ה לָתֵ֣ת לָהֶ֗ם בְּיוֹם֙ מׇשְׁח֣וֹ אֹתָ֔ם מֵאֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל חֻקַּ֥ת עוֹלָ֖ם לְדֹרֹתָֽם׃", "onk": "דִּי פַּקִּיד יְיָ לְמִתַּן לְהוֹן בְּיוֹמָא דְּ<b>רַבִּי<\/b> יָתְהוֹן מִן בְּנֵי יִשְׂרָאֵל קְיָם עָלָם לְדָרֵיהוֹן:", "onk_en": "that Adonoy commanded to give to them, on the day He anointed [<b>inaugurated<\/b>] them [<b>to greatness<\/b>], from Bnei Yisroel, an everlasting statute for all their descendants.", "pj": "דְפַקֵיד יְיָ לְמִנְתַּן לְהוֹם בְּיוֹמָא דְרַבֵּי יַתְהוֹן מֵעִם בְּנֵי יִשְרָאֵל קְיַם עֲלָם לְדָרֵיהוֹן", "pj_en": "which the Lord commanded to be given them in the day of their consecration from among the sons of Israel, by an everlasting statute to your generations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 37, "aliyah": 3, "heb": "זֹ֣את הַתּוֹרָ֗ה לָֽעֹלָה֙ לַמִּנְחָ֔ה וְלַֽחַטָּ֖את וְלָאָשָׁ֑ם וְלַ֨מִּלּוּאִ֔ים וּלְזֶ֖בַח הַשְּׁלָמִֽים׃", "onk": "דָּא אוֹרַיְתָא לַעֲלָתָא לְמִנְחָתָא וּלְחַטָּאתָא וְלַאֲשָׁמָא וּ<b>לְקֻרְבָּנַיָּא<\/b> וּלְנִכְסַת <b>קוּדְשַׁיָּא<\/b>:", "onk_en": "This is the law for the burnt-offering, the meal-offering, the sin-offering and the guilt-offering; for the installation-sacrifices [<b>sacrifices<\/b>] and for the peace[<b>sacred<\/b>]-offering,", "pj": "דָא אוֹרַיְיתָא לַעֲלָתָא דְאַתְיָא לְכַפָּרָא עַל הִרְהוּרֵי לִבָּא לְמִנְחָתָא וּלְחַטָאתָא וּלְאֲשָׁמָא וּלְאַשְׁלְמוּתָא וּלְנִכְסַת קוּדְשַׁיָא", "pj_en": "This is the law of the burnt offering which is brought to atone for the thoughts of the heart; of the mincha, of the sin offering, of the trespass offering, and of the peace offering, or the hallowed sacrifices", "tj": "", "tj_en": "", "rashi": "<b>ולמלואים.<\/b> לְיוֹם חִנּוּךְ הַכְּהֻנָּה:", "rashi_en": "ולמלואים AND FOR THE CONSECRATION OFFERING that was offered on the day that they were installed in the priestly office (cf. Exodus 28:41)."}, {"ch": 7, "v": 38, "aliyah": 3, "heb": "אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֶת־מֹשֶׁ֖ה בְּהַ֣ר סִינָ֑י בְּי֨וֹם צַוֺּת֜וֹ אֶת־בְּנֵ֣י יִשְׂרָאֵ֗ל לְהַקְרִ֧יב אֶת־קׇרְבְּנֵיהֶ֛ם לַיהֹוָ֖ה בְּמִדְבַּ֥ר סִינָֽי׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "דִּי פַקִּיד יְיָ יָת משֶׁה בְּטוּרָא דְסִינָי בְּיוֹמָא דִפַקְּדֵיהּ יָת בְּנֵי יִשְׂרָאֵל לְקָרָבָא יָת קֻרְבָּנְהוֹן <b>קֳדָם<\/b> יְיָ בְּמַדְבְּרָא דְסִינָי:", "onk_en": "that Adonoy commanded Moshe on Mount Sinai, on the day that he commanded Bnei Yisroel to bring their offerings to [<b>before<\/b>] Adonoy in the desert of Sinai.", "pj": "דְפַקֵיד יְיָ יַת משֶׁה בְּטַוְורָא דְסִינַי בְּיוֹמָא דְפַקֵיד יַת בְּנֵי יִשְרָאֵל לְקָרָבָא קוּרְבָּנֵיהוֹן קֳדָם יְיָ בְּמַשְׁכְּנָא דְעָבָדוּ לֵיהּ בְּמַדְבְּרָא דְסִינָי", "pj_en": "which the Lord commanded Mosheh in Mount Sinai, in the day that he commanded the sons of Israel to offer their oblations before the Lord in the tabernacle that he made unto him in the wilderness of Sinai.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 1, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, to say:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 2, "aliyah": 4, "heb": "קַ֤ח אֶֽת־אַהֲרֹן֙ וְאֶת־בָּנָ֣יו אִתּ֔וֹ וְאֵת֙ הַבְּגָדִ֔ים וְאֵ֖ת שֶׁ֣מֶן הַמִּשְׁחָ֑ה וְאֵ֣ת&thinsp;<b>׀<\/b> פַּ֣ר הַֽחַטָּ֗את וְאֵת֙ שְׁנֵ֣י הָֽאֵילִ֔ים וְאֵ֖ת סַ֥ל הַמַּצּֽוֹת׃", "onk": "<b>קָרֵב<\/b> יָת אַהֲרֹן וְיָת בְּנוֹהִי עִמֵּיהּ וְיָת לְבוּשַׁיָּא וְיָת מִשְׁחָא דִ<b>רְבוּתָא<\/b> וְיָת תּוֹרָא דְחַטָּאתָא וְיָת תְּרֵין דִּכְרִין וְיָת סַלָּא דְפַטִּירַיָּא:", "onk_en": "Take [<b>Bring<\/b>] Aharon [<b>near<\/b>], along with his sons, the garments, the anointing oil [<b>of inaugurating to greatness<\/b>], the bull for the sin-offering, the two rams and a basket of <i>matzos<\/i>.", "pj": "קְרֵיב יַת אַהֲרן דְאִתְרַחֵק עַל עוֹבְדָא דְעֵיגְלָא וְטוֹל יַת לְבוּשַׁיָא דְפַקֵידְתָּךְ וְיַת מִשְׁחָא דִרְבוּתָא וְיַת תּוֹרָא דְחַטָאתָא וְיַת תְּרֵין דִכְרִין וְיַת סַלָא דְפַטִירַיָא", "pj_en": "Bring near Aharon who is afar off on account of the work of the calf; and take the vestments that I commanded thee, and the oil of consecration, and the bullock, and the two rams, with the basket of unleavened cakes.", "tj": "", "tj_en": "", "rashi": "<b>קח את אהרן.<\/b> פָּרָשָׁה זוֹ נֶאֶמְרָה שִׁבְעַת יָמִים קֹדֶם הֲקָמַת הַמִּשְׁכָּן, שֶׁאֵין מֻקְדָּם וּמְאֻחָר בַּתּוֹרָה:<br><br><b>קח את אהרן.<\/b> קָחֶנּוּ בִדְבָרִים וּמָשְׁכֵהוּ:<br><br><b>ואת פר החטאת וגו'.<\/b> אֵלּוּ הָאֲמוּרִים בְּעִנְיַן צַוָּאַת הַמִּלּוּאִים בִּוְאַתָּה תְּצַוֶּה, וְעַכְשָׁיו בְּיוֹם רִאשׁוֹן לַמִּלּוּאִים חָזַר וְזֵרְזוֹ בִשְׁעַת מַעֲשֶֹה:", "rashi_en": "קח את אהרן TAKE AARON — This section was spoken seven days before the final erection of the Tabernacle and so should have been placed before Exodus XL., but a transposition of this kind is quite customary in the Bible, because there is no “earlier” or “later” (no chronological order) in the Torah.<br><br>קח את אהרן means win him over with fine words and draw him on (cf. Rashi on Exodus 14:6) (Sifra, Tzav, Mechilta d'Miluim 1 2)).<br><br>ואת פר החטאת וגו'‏‎‎‎‎‎ AND THE BULLOCK FOR THE SIN OFFERING [AND THE TWO RAMS] etc. — These are the sacrifices mentioned in the section containing the command about the installation ceremony — in the Scriptural Reading beginning with the words, ואתה תצוה (see Exodus 29) and now, on the first day of the installation ceremony He again admonished him (Moses) regarding this when the time for performing the command arrived."}, {"ch": 8, "v": 3, "aliyah": 4, "heb": "וְאֵ֥ת כׇּל־הָעֵדָ֖ה הַקְהֵ֑ל אֶל־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיָת כָּל כְּנִשְׁתָּא כְּנֵשׁ לִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "Assemble the entire congrega-tion at the entrance of the Tent of Meeting.", "pj": "וְיַת כָּל כְּנִישְׁתָּא כְּנוֹשׁ לִתְרַע מַשְׁכַּן זִימְנָא", "pj_en": "And let all the congregation gather together at the gate of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>הקהל אל פתח אהל מועד.<\/b> זֶה אֶחָד מִן הַמְּקוֹמוֹת שֶׁהֶחֱזִיק מֻעָט אֶת הַמְרֻבֶּה (ויקרא רבה י'):", "rashi_en": "הקהל אל פתח אהל מועד AND ASSEMBLE THOU [THE WHOLE CONGREGATION), UNTO THE ENTRANCE OF THE TENT OF MEETING — This is one of the instances where the lesser comprised the greater (the small area accommodated the whole congregation) (Leviticus Rabbah 10 9)."}, {"ch": 8, "v": 4, "aliyah": 4, "heb": "וַיַּ֣עַשׂ מֹשֶׁ֔ה כַּֽאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֹת֑וֹ וַתִּקָּהֵל֙ הָֽעֵדָ֔ה אֶל־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וַעֲבַד משֶׁה כְּמָא דִי פַּקִּיד יְיָ יָתֵיהּ וְאִתְכְּנִישַׁת כְּנִשְׁתָּא לִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "Moshe did that which Adonoy commanded him and the congregation was assembled at the entrance of the Tent of Meeting.", "pj": "וַעֲבַד משֶׁה הֵיכְמָא דְפַקֵיד יְיָ וְאִתְכְּנִישַׁת כְּנִישְׁתָּא בְּעֶשְרִין וּתְלָתָא יוֹמִין לְיַרְחָא דְאָדָר לִתְרַע מַשְׁכַּן זִימְנָא", "pj_en": "And Mosheh did as the Lord commanded, and the congregation assembled on the twenty and third of the days of the month of Adar, at the gate of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 5, "aliyah": 4, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה אֶל־הָעֵדָ֑ה זֶ֣ה הַדָּבָ֔ר אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה לַעֲשֽׂוֹת׃", "onk": "וַאֲמַר משֶׁה לִכְנִשְׁתָּא דֵּין פִּתְגָּמָא דִּי פַקִּיד יְיָ לְמֶעְבָּד:", "onk_en": "Moshe said to the congregation, This is the edict that Adonoy commanded to do.", "pj": "וַאֲמַר משֶׁה לִכְנִישְׁתָּא דֵין פִּתְגָמָא דְפַקֵיד יְיָ לְמֶעֱבַד", "pj_en": "And Mosheh said to the congregation: This is the thing which the Lord hath commanded to be done.", "tj": "", "tj_en": "", "rashi": "<b>זה הדבר.<\/b> דְּבָרִים שֶׁתִּרְאוּ שֶׁאֲנִי עוֹשֶׂה לִפְנֵיכֶם, צִוַּנִי הַקָּבָּ\"ה לַעֲשׂוֹת, וְאַל תֹּאמְרוּ לִכְבוֹדִי וְלִכְבוֹד אָחִי אֲנִי עוֹשֶֹׁה; כָּל הָעִנְיָן הַזֶּה פֵּרַשְׁתִּי בְּ\"וְאַתָּה תְּצַוֶּה\":", "rashi_en": "זה הדבר THIS IS THE THING [WHICH THE LORD COMMANDED ME TO DO] — The things you will see me doing in your presence has the Holy One, blessed be He, bidden me do, and do not think I am doing them for my own glory and for my brother’s glory. — The whole of this matter treated in the present chapter I have already explained in the Scriptural Reading beginning with the words,  ‎‏ ואתה תצוה ‏‎(Exodus ch. XXIX.)."}, {"ch": 8, "v": 6, "aliyah": 4, "heb": "וַיַּקְרֵ֣ב מֹשֶׁ֔ה אֶֽת־אַהֲרֹ֖ן וְאֶת־בָּנָ֑יו וַיִּרְחַ֥ץ אֹתָ֖ם בַּמָּֽיִם׃", "onk": "וְקָרִיב משֶׁה יָת אַהֲרֹן וְיָת בְּנוֹהִי וְאַסְחֵי יָתְהוֹן בְּמַיָּא:", "onk_en": "Moshe brought Aharon and his sons near and bathed them in water.", "pj": "וְקָרֵיב משֶׁה יַת אַהֲרן וְיַת בְּנוֹי וְאַסְחֵי יַתְהוֹן בְּמוֹי", "pj_en": "And Mosheh took Aharon and his sons, and washed them with water.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 7, "aliyah": 4, "heb": "וַיִּתֵּ֨ן עָלָ֜יו אֶת־הַכֻּתֹּ֗נֶת וַיַּחְגֹּ֤ר אֹתוֹ֙ בָּֽאַבְנֵ֔ט וַיַּלְבֵּ֤שׁ אֹתוֹ֙ אֶֽת־הַמְּעִ֔יל וַיִּתֵּ֥ן עָלָ֖יו אֶת־הָאֵפֹ֑ד וַיַּחְגֹּ֣ר אֹת֗וֹ בְּחֵ֙שֶׁב֙ הָֽאֵפֹ֔ד וַיֶּאְפֹּ֥ד ל֖וֹ בּֽוֹ׃", "onk": "וִיהַב עֲלוֹהִי יָת כִּתּוּנָא וְזָרֵז יָתֵיהּ בְּהֶמְיָנָא וְאַלְבֵּשׁ יָתֵיהּ יָת מְעִילָא וִיהַב עֲלוֹהִי יָת אֵפוֹדָא וְזָרֵז יָתֵיהּ בְּהֶמְיַן אֵפוֹדָא וְאַתְקֵן לֵיהּ בֵּיהּ:", "onk_en": "He placed the tunic on him, girded him with the sash, dressed him in the robe, placed the <i>ephod<\/i> on him girded him with the <i>ephod<\/i>-sash and tightened it for him.", "pj": "וְסַדֵר עֲלוֹי יַת כִּיתּוּנָא וְזָרֵיז יָתֵיהּ בִּקְמוּרָא וְאַלְבֵּישׁ יָתֵיהּ יַת מִנְטַר מְעִילָא וִיהַב עֲלוֹי יַת אֵיפוֹדָא וְזָרִיז יָתֵיהּ בְּהֶמְיַן אֵיפוֹדָא וְאַתְקִין לֵיהּ בֵּיהּ", "pj_en": "And he set in order upon him the vestment, and girded him with the girdle, and clothed him with the mantle robe, and put upon him the ephod, and bound him with the band of the ephod, and ordained him therewith.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 8, "aliyah": 4, "heb": "וַיָּ֥שֶׂם עָלָ֖יו אֶת־הַחֹ֑שֶׁן וַיִּתֵּן֙ אֶל־הַחֹ֔שֶׁן אֶת־הָאוּרִ֖ים וְאֶת־הַתֻּמִּֽים׃", "onk": "וְשַׁוִּי עֲלוֹהִי יָת חוּשְׁנָא וִיהַב בְּחוּשְׁנָא יָת אוּרַיָּא וְיָת תֻּמַיָּא:", "onk_en": "He put the breastplate on him and he placed in the breastplate the <i>urim<\/i> and the <i>tumim.<\/i>", "pj": "וְשַׁוִי עֲלוֹי יַת חוּשְׁנָא וְסַדֵר בְּחוּשְׁנָא יַת אוּרַיָיא וְיַת תּוּמַיָא", "pj_en": "And he set the breast plate upon him, and ordered in the breastplate the uraia and the tummaia.", "tj": "", "tj_en": "", "rashi": "<b>את האורים.<\/b> כְּתָב שֶׁל שֵׁם הַמְפֹרָשׁ:", "rashi_en": "את האורים THE URIM — an inscription bearing the Proper Name of the Lord (cf. Rashi on Exodus XXV 3:30)."}, {"ch": 8, "v": 9, "aliyah": 4, "heb": "וַיָּ֥שֶׂם אֶת־הַמִּצְנֶ֖פֶת עַל־רֹאשׁ֑וֹ וַיָּ֨שֶׂם עַֽל־הַמִּצְנֶ֜פֶת אֶל־מ֣וּל פָּנָ֗יו אֵ֣ת צִ֤יץ הַזָּהָב֙ נֵ֣זֶר הַקֹּ֔דֶשׁ כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וְשַׁוִּי יָת מִצְנֶפְתָּא עַל רֵישֵׁיהּ וְשַׁוִּי עַל מִצְנֶפְתָּא לָקֳבֵל אַפּוֹהִי יָת צִיצָא דְדַהֲבָא כְּלִילָא דְקוּדְשָׁא כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "He placed the turban on his head and he placed, on the front of the turban, the golden plate, the crown of holiness, just as Adonoy commanded Moshe.", "pj": "וְשַׁוֵי יַת מִצְנַפְתָּא עַל רֵישֵׁיהּ וְשַׁוֵי עַל מִצְנַפְתָּא כָּל קְבֵיל אַנְפּוֹי יַת צִיצָא דְדַהֲבָא כְּלִילָא דְקוּדְשָׁא הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And, he put the mitre upon his head, and set upon the mitre over his forehead the plate of gold, the diadem of holiness, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>וישם על המצנפת.<\/b> פְּתִילֵי תְכֵלֶת הַקְּבוּעִים בַּצִּיץ נָתַן עַל הַמִּצְנֶפֶת, נִמְצָא הַצִּיץ תָּלוּי בַּמִּצְנֶפֶת:", "rashi_en": "וישם על המצנפת UPON THE MITRE … DID HE PUT [THE GOLDEN PLATE] — Threads of blue purple that were: fastened on the Plate he put over the mitre, consequently the Plate hung from the mitre mid would be “against his face” (upon his forehead) as stated here (cf. Rashi on Exodus 28:37)."}, {"ch": 8, "v": 10, "aliyah": 4, "heb": "וַיִּקַּ֤ח מֹשֶׁה֙ אֶת־שֶׁ֣מֶן הַמִּשְׁחָ֔ה וַיִּמְשַׁ֥ח אֶת־הַמִּשְׁכָּ֖ן וְאֶת־כׇּל־אֲשֶׁר־בּ֑וֹ וַיְקַדֵּ֖שׁ אֹתָֽם׃", "onk": "וּנְסִיב משֶׁה יָת מִשְׁחָא דִ<b>רְבוּתָא<\/b> וְ<b>רַבִּי<\/b> יָת מַשְׁכְּנָא וְיָת כָּל דִּי בֵיהּ וְקַדִּישׁ יָתְהוֹן:", "onk_en": "Moshe took the anointing-oil [<b>of inaugurating to greatness<\/b>] and anointed [<b>inaugurated<\/b>] the Tabernacle [<b>to greatness<\/b>] and everything inside it and sanctified them.", "pj": "וּנְסֵיב משֶׁה יַת מִשְׁחָא דִרְבוּתָא וְרַבֵּי יַת מַשְׁכְּנָא וְיַת כָּל דְבֵיהּ וְקַדִישׁ יָתֵיהּ", "pj_en": "And Mosheh took the oil of consecration, and anointed the tabernacle, and sanctified it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 11, "aliyah": 4, "heb": "וַיַּ֥ז מִמֶּ֛נּוּ עַל־הַמִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַיִּמְשַׁ֨ח אֶת־הַמִּזְבֵּ֜חַ וְאֶת־כׇּל־כֵּלָ֗יו וְאֶת־הַכִּיֹּ֛ר וְאֶת־כַּנּ֖וֹ לְקַדְּשָֽׁם׃", "onk": "וְאַדִּי מִנֵּיהּ עַל מַדְבְּחָא שְׁבַע זִמְנִין וְ<b>רַבִּי<\/b> יָת מַדְבְּחָא וְיָת כָּל מָנוֹהִי וְיָת כִּיּוֹרָא וְיָת בְּסִיסֵיהּ לְקַדָּשׁוּתְהוֹן:", "onk_en": "He sprinkled some of it on the altar seven times; he anointed [<b>inaugurated to greatness<\/b>] the altar and all its utensils, the washing basin and its base, to sanctify them.", "pj": "וְאַדֵי מִנֵיהּ עַל מַדְבְּחָא שְׁבַע זִימְנִין וְרַבֵּי יַת מַדְבְּחָא וְיַת כָּל מְנוֹי וְיַת כִּיּוֹרָא וְיַת בְּסִיסֵיהּ לְקַדָשׁוּתְהוֹן", "pj_en": "And he sprinkled upon the altar seven times, and sanctified the altar and all its vessels, and the laver and its foundation to sanctify them.", "tj": "", "tj_en": "", "rashi": "<b>ויז ממנו על המזבח.<\/b> לֹא יָדַעְתִּי הֵיכָן נִצְטַוָּה בַּהַזָּאוֹת הַלָּלוּ:", "rashi_en": "ויז ממנו על המזבח AND HE SPRINKLED THEREOF UPON THE ALTAR — I do not know where he was given any command about these sprinklings (cf., however Nachmanides)."}, {"ch": 8, "v": 12, "aliyah": 4, "heb": "וַיִּצֹק֙ מִשֶּׁ֣מֶן הַמִּשְׁחָ֔ה עַ֖ל רֹ֣אשׁ אַהֲרֹ֑ן וַיִּמְשַׁ֥ח אֹת֖וֹ לְקַדְּשֽׁוֹ׃", "onk": "וַאֲרִיק מִמִּשְׁחָא דִ<b>רְבוּתָא<\/b> עַל רֵישָׁא דְאַהֲרֹן וְ<b>רַבִּי<\/b> יָתֵיהּ לְקַדָּשׁוּתֵיהּ:", "onk_en": "He poured some of the anointing-oil [<b>which inaugurates to greatness<\/b>] on Aharons head and anointed [<b>inaugurated<\/b>] him [<b>to greatness<\/b>], to sanctify him.", "pj": "וְאָרִיק מִן מִשְׁחָא דִרְבוּתָא עַל רֵישׁ אַהֲרן וְרַבֵּי יָתֵיהּ בָּתַר דְאַלְבְּשֵׁיהּ מְטוֹל לְקַדָשׁוּתֵיהּ", "pj_en": "And he poured of the oil of consecration upon Aharon's head, and anointed him after he had invested him, to sanctify him.", "tj": "", "tj_en": "", "rashi": "<b>ויצק, וימשח.<\/b> בַּתְּחִלָּה יוֹצֵק עַל רֹאשׁוֹ וְאַחַר כָּךְ נוֹתֵן בֵּין רִיסֵי עֵינָיו וּמוֹשֵׁךְ בְּאֶצְבָּעוֹ מִזֶּה לָזֶה (הוריות י\"ב):", "rashi_en": "וימשח … ‎‏ ויצק‎ AND HE POURED [THE ANOINTING OIL UPON AARON'S HEAD] AND ANOINTED |HIM| — First he poured some oil upon his head and afterwards he put a drop between his eyebrows, and he drew the oil with his finger from this place to that (this drawing the oil from one place to the other was the anointing here spoken of) (Keritot 5b; Horayot 12a; cf. also Rashi on Exodus 29:7)."}, {"ch": 8, "v": 13, "aliyah": 4, "heb": "וַיַּקְרֵ֨ב מֹשֶׁ֜ה אֶת־בְּנֵ֣י אַהֲרֹ֗ן וַיַּלְבִּשֵׁ֤ם כֻּתֳּנֹת֙ וַיַּחְגֹּ֤ר אֹתָם֙ אַבְנֵ֔ט וַיַּחֲבֹ֥שׁ לָהֶ֖ם מִגְבָּע֑וֹת כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וְקָרִיב משֶׁה יָת בְּנֵי אַהֲרֹן וְאַלְבֵּשִׁנּוּן כִּתּוּנִין וְזָרֵז יָתְהוֹן הֶמְיָנִין וְאַתְקֵן לְהוֹן כּוֹבָעִין כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe brought near the sons of Aharon and dressed them in tunics, girded them with sashes, and tied high turbans for them [to wear], just as Adonoy commanded Moshe.", "pj": "וְקָרֵיב משֶׁה יַת אַהֲרן וְיַת בְּנוֹי וְאַלְבְּשִׁינוּן כִּתּוּנִין וְזָרִיז יַתְהוֹן קְמוּרִין וּחְבַשׁ לְהוֹן כּוֹבְעִין הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And Mosheh brought near Aharon and his sons, and clothed them with vestments, and girded them with girdles, and decked them with mitres, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויחבש.<\/b> לְשׁוֹן קְשִׁירָה:", "rashi_en": "ויחבש — This is a term meaning binding."}, {"ch": 8, "v": 14, "aliyah": 5, "heb": "וַיַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽחַטָּ֑את וַיִּסְמֹ֨ךְ אַהֲרֹ֤ן וּבָנָיו֙ אֶת־יְדֵיהֶ֔ם עַל־רֹ֖אשׁ פַּ֥ר הַֽחַטָּֽאת׃", "onk": "וְקָרֵב יָת תּוֹרָא דְחַטָּאתָא וּסְמַךְ אַהֲרֹן וּבְנוֹהִי יָת יְדֵיהוֹן עַל רֵישׁ תּוֹרָא דְחַטָּאתָא:", "onk_en": "He brought near the sin-offering bullock and Aharon and his sons laid their hands on the head of the sin-offering bullock.", "pj": "וְקָרֵיב יַת תּוֹרָא דְחַטָאתָא וְסָמַךְ אַהֲרן וּבְנוֹי יַת יְדֵיהוֹן יְמִינִין עַל רֵישׁ תּוֹרָא דְחַטָאתָא דִילְהוֹן", "pj_en": "And he brought the bullock for the sin offering, and Aharon and his sons laid their right hands upon the head of the bullock, for their sin offering.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 15, "aliyah": 5, "heb": "וַיִּשְׁחָ֗ט וַיִּקַּ֨ח מֹשֶׁ֤ה אֶת־הַדָּם֙ וַ֠יִּתֵּ֠ן עַל־קַרְנ֨וֹת הַמִּזְבֵּ֤חַ סָבִיב֙ בְּאֶצְבָּע֔וֹ וַיְחַטֵּ֖א אֶת־הַמִּזְבֵּ֑חַ וְאֶת־הַדָּ֗ם יָצַק֙ אֶל־יְס֣וֹד הַמִּזְבֵּ֔חַ וַֽיְקַדְּשֵׁ֖הוּ לְכַפֵּ֥ר עָלָֽיו׃", "onk": "וּנְכֵס וּנְסִיב משֶׁה יָת דְּמָא וִיהַב עַל קַרְנַת מַדְבְּחָא סְחוֹר סְחוֹר בְּאֶצְבְּעֵיהּ וְדַכִּי יָת מַדְבְּחָא וְיָת דְּמָא אֲרִיק לִיסוֹדָא דְמַדְבְּחָא וְקַדְּשֵׁיהּ לְכַפָּרָא עֲלוֹהִי:", "onk_en": "He slaughtered it; and Moshe took the blood and put it atop the corners of the altar all around with his finger and he purified the altar. He poured the blood into the base of the altar and sanctified it, to atone upon it.", "pj": "וּנְכַס משֶׁה יַת תּוֹרָא וּנְסֵיב משֶׁה יַת אַדְמָא וִיהַב עַל קַרְנַת מַדְבְּחָא חֲזוֹר חֲזוֹר בְּאֶצְבְּעֵיהּ וְרַבֵּי יַת מַדְבְּחָא מִן כָּל סְפַק אָנוֹס וְחָטוּפִין מְטוֹל דְחָשִׁיב בִּלְבָבֵיהּ דִלְמָא נְסִיבָא סַרְכַיָא דִבְנֵי יִשְרָאֵל אַפְרָשׁוּתָא מִן אָחֵיהוֹן בְּאוֹנְסָא וּקְרִיבוּ לַעֲבִידַת מַשְׁכְּנָא אוֹ דִילְמָא הִישְׁתְּכַּח בִּבְנֵי יִשְרָאֵל דְלָא הֲוָה בְּלִבֵּיהּ לְמֵיתַיָא לַעֲבִידְתָּא וְשָׁמַע קַל כְּרוּזָא וְאִיסְתְּפֵי וְאַיְיתִי בְּלָא צְבוֹ מְטוֹל כֵּן דְכֵי יָתֵיהּ בַּאֲדַם תּוֹרָא וְיַת מוֹתַר אַדְמָא אָרִיק לִיסוֹדָא דְמַדְבְּחָא וְקַדְשֵׁיהּ לְכַפָּרָא עֲלוֹי", "pj_en": "And Mosheh killed the bullock: and Mosheh took the blood and put it upon the horns of the altar round about with his finger, and anointed the altar (to expiate it) from all double-mindedness, constraint, and force, from the thoughts of his heart, should any one of the princes of the sons of Israel have taken his separation from his brethren by violence, and brought it for the work of the tabernacle, or lest any one was found among the children of Israel who had it not in his heart to bring for the work, but heard the voice of the crier, and was constrained, and brought without willingness; therefore cleansed he it with the blood of the bullock, and poured the rest of the blood at the foot of the altar, and sanctified it to make atonement thereon.", "tj": "", "tj_en": "", "rashi": "<b>ויחטא את המזבח.<\/b> חִטְּאוֹ וְטִהֲרוֹ מִזָּרוּת לִכָּנֵס לִקְדֻשָּׁה:<br><br><b>ויקדשהו.<\/b> בַּעֲבוֹדָה זוֹ:<br><br><b>לכפר עליו.<\/b> מֵעַתָּה כָּל הַכַּפָּרוֹת:", "rashi_en": "ויחטא את המזבח AND HE PURIFIED THE ALTAR — He cleansed and purified it from anything “strange” (alien to the sacred purpose for which the altar was intended) that may have happened to it, so that it might enter into a state of holiness (cf. Rashi on Exodus 19:36).<br><br>ויקדשהו AND HE SANCTIFIED IT by this rite.<br><br>לכפר עליו THAT ONE MIGHT MAKE EXPIATION UPON IT from that time onward with all atonement sacrifices (i. e. that all atonement sacrifices might henceforth be offered upon it; the meaning is not that he sanctified it so that he might now offer an atonement offering for it or upon it)."}, {"ch": 8, "v": 16, "aliyah": 5, "heb": "וַיִּקַּ֗ח אֶֽת־כׇּל־הַחֵ֘לֶב֮ אֲשֶׁ֣ר עַל־הַקֶּ֒רֶב֒ וְאֵת֙ יֹתֶ֣רֶת הַכָּבֵ֔ד וְאֶת־שְׁתֵּ֥י הַכְּלָיֹ֖ת וְאֶֽת־חֶלְבְּהֶ֑ן וַיַּקְטֵ֥ר מֹשֶׁ֖ה הַמִּזְבֵּֽחָה׃", "onk": "וּנְסִיב יָת כָּל תַּרְבָּא דִּי עַל גַּוָּא וְיָת חֲצַר כַּבְדָּא וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבְּהֶן וְאַסֵּק משֶׁה לְמַדְבְּחָא:", "onk_en": "He took all the fat on the innards, the lobe of the liver, the two kidneys and their fats and Moshe burned [them] on the altar.", "pj": "וּנְסֵיב יַת כָּל תַּרְבָּא דְעַל בְּנֵי גַוָוא וְיַת חֲצַר כַּבְדָא וְיַת תַּרְתֵּין כּוּלְיַין וְיַת תַּרְבֵּיהוֹן וְאַסֵיק משֶׁה לְמַדְבְּחָא", "pj_en": "And he took all the fat that was on the inwards, and the caul of the liver, and the two kidneys with their fat, and Mosheh burned them at the altar.", "tj": "", "tj_en": "", "rashi": "<b>הכבד.<\/b> לְבַד הַכָּבֵד, שֶׁהָיָה נוֹטֵל מְעַט מִן הַכָּבֵד עִמָּהּ:", "rashi_en": "הכבד [AND THE LOBE OF] THE LIVER — i. e. he took it (the lobe) besides some of the liver — it means that he took a little of the liver with it (the lobe)."}, {"ch": 8, "v": 17, "aliyah": 5, "heb": "וְאֶת־הַפָּ֤ר וְאֶת־עֹרוֹ֙ וְאֶת־בְּשָׂר֣וֹ וְאֶת־פִּרְשׁ֔וֹ שָׂרַ֣ף בָּאֵ֔שׁ מִח֖וּץ לַֽמַּחֲנֶ֑ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וְיָת תּוֹרָא וְיָת מַשְׁכֵּיהּ וְיָת בִּסְרֵיהּ וְיָת אָכְלֵיהּ אוֹקִיד בְּנוּרָא מִבָּרָא לְמַשְׁרִיתָא כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "The bullock, its skin, its flesh and its waste [that are in its intestines], he burned in fire, beyond the encampment, just as Adonoy commanded Moshe.", "pj": "וְיַת תּוֹרָא וְיַת מוֹשְׁכָא וְיַת בִּישְרֵיהּ וְיַת רַעֲיֵהּ אוֹקֵד בְּנוּרָא מִבָּרָא לְמַשְׁרִיתָא הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "But the bullock, and the skin, and his flesh, and his offal, he burned in fire without the camp, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 18, "aliyah": 5, "heb": "וַיַּקְרֵ֕ב אֵ֖ת אֵ֣יל הָעֹלָ֑ה וַֽיִּסְמְכ֞וּ אַהֲרֹ֧ן וּבָנָ֛יו אֶת־יְדֵיהֶ֖ם עַל־רֹ֥אשׁ הָאָֽיִל׃", "onk": "וְקָרִיב יָת דִּכְרָא דַעֲלָתָא וּסְמָכוּ אַהֲרֹן וּבְנוֹהִי יָת יְדֵיהוֹן עַל רֵישׁ דִּכְרָא:", "onk_en": "He brought the burnt-offering ram and Aharon and his sons laid their hands on the rams head.", "pj": "וּקְרֵיב יַת דְכַר עֲלָתָא וּסְמָכוּ אַהֲרן וּבְנוֹי יַת יַד יְמִינֵיהוֹן עַל רֵישׁ דִיכְרָא", "pj_en": "And he took the ram for the burnt offering, and Aharon and his sons laid their right hand upon the head of the ram.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 19, "aliyah": 5, "heb": "וַיִּשְׁחָ֑ט וַיִּזְרֹ֨ק מֹשֶׁ֧ה אֶת־הַדָּ֛ם עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וּנְכֵס וּזְרַק משֶׁה יָת דְּמָא עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He slaughtered it; and Moshe sprinkled the blood all around the altar.", "pj": "וּנְכַס יַת דִיכְרָא וּדְרַק משֶׁה יַת אַדְמָא עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And he killed the ram; and Mosheh sprinkled the blood upon the altar round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 20, "aliyah": 5, "heb": "וְאֶ֨ת־הָאַ֔יִל נִתַּ֖ח לִנְתָחָ֑יו וַיַּקְטֵ֤ר מֹשֶׁה֙ אֶת־הָרֹ֔אשׁ וְאֶת־הַנְּתָחִ֖ים וְאֶת־הַפָּֽדֶר׃", "onk": "וְיָת דִּכְרָא פַּלֵּיג לְאֶבְרוֹהִי וְאַסֵּק משֶׁה יָת רֵישָׁא וְיָת אֵבָרַיָּא וְיָת תַּרְבָּא:", "onk_en": "He severed the rams limbs; and Moshe burned the head and the severed limbs and the fat.", "pj": "וְיַת דִיכְרָא פַּסִיג לְפַסְגוֹי וְאַסֵיק משֶׁה יַת רֵישָׁא וְיַת פַּתְגוֹיָא וְיַת תַּרְבָּא", "pj_en": "And he divided the ram after its parts, and Mosheh burned the head and the parts and the fat.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 21, "aliyah": 5, "heb": "וְאֶת־הַקֶּ֥רֶב וְאֶת־הַכְּרָעַ֖יִם רָחַ֣ץ בַּמָּ֑יִם וַיַּקְטֵר֩ מֹשֶׁ֨ה אֶת־כׇּל־הָאַ֜יִל הַמִּזְבֵּ֗חָה עֹלָ֨ה ה֤וּא לְרֵֽיחַ־נִיחֹ֙חַ֙ אִשֶּׁ֥ה הוּא֙ לַיהֹוָ֔ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וְיָת גַּוָּא וְיָת כְּרָעַיָּא חַלִּיל בְּמַיָּא וְאַסֵּק משֶׁה יָת כָּל דִּכְרָא לְמַדְבְּחָא עֲלָתָא הוּא <b>לְאִתְקַבָּלָא בְרַעֲוָא קֻרְבָּנָא הוּא קֳדָם<\/b> יְיָ כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "He washed the innards and feet in water; and Moshe burned the entire ram on the altar. It is a burnt-offering; for a pleasing fragrance [<b>to be accepted with favor<\/b>], a fire-offering to [<b>an offering before<\/b>] Adonoy, just as Adonoy commanded Moshe.", "pj": "וְיַת בְּנֵי גַּוָוא וְיַת רִיגְלָאָה חֲלִיל בְּמוֹי וְאַסֵיק משֶׁה יַת כָּל דִיכְרָא לְמַדְבְּחָא עֲלָתָא הוּא לְאִתְקַבָּלָא בְּרַעֲוָא קָרְבָּנָא הוּא קֳדָם יְיָ הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And the inwards and the feet he washed with water; and Mosheh burned the ram at the altar, a burnt sacrifice to be received with acceptance, an oblation before the Lord, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 22, "aliyah": 6, "heb": "וַיַּקְרֵב֙ אֶת־הָאַ֣יִל הַשֵּׁנִ֔י אֵ֖יל הַמִּלֻּאִ֑ים וַֽיִּסְמְכ֞וּ אַהֲרֹ֧ן וּבָנָ֛יו אֶת־יְדֵיהֶ֖ם עַל־רֹ֥אשׁ הָאָֽיִל׃", "onk": "וְקָרִיב יָת דִּכְרָא תִנְיָנָא דְּכַר <b>קֻרְבָּנַיָּא<\/b> וּסְמָכוּ אַהֲרֹן וּבְנוֹהִי יָת יְדֵיהוֹן עַל רֵישׁ דִּכְרָא:", "onk_en": "He brought the second ram, the ram for the installation-offering [<b>offerings<\/b>]; and Aharon and his sons laid their hands on the rams head.", "pj": "וּקְרֵיב יַת דִכְרָא תִּנְיָינָא דְכַר אַשְׁלָמוּתָא דִשְׁלִים בְּכוּלָא וּסְמָכוּ אַהֲרן וּבְנוֹי יַת יְדֵיהוֹן עַל רֵישׁ דִכְרָא", "pj_en": "And he brought the second ram, the ram of completion which completed all; and Aharon and his sons laid their hand upon the head of the ram.", "tj": "", "tj_en": "", "rashi": "<b>איל המלאים.<\/b> אֵיל הַשְּׁלָמִים, שֶׁמִּלּוּאִים לְשׁוֹן שְׁלָמִים, שֶׁמְּמַלְּאִין וּמַשְׁלִימִין אֶת הַכֹּהֲנִים בִּכְהֻנָּתָם:", "rashi_en": "איל המלאים — This means the same as איל השלמים, for the word מלואים is synonymous with the word שלמים; this term is used to describe the ram because by means of it they set the priest fully (ממלאין) and completely (משלימין) in their priestly office (cf. Sifra, Tzav, Mechilta d'Miluim 1 20)."}, {"ch": 8, "v": 23, "aliyah": 6, "heb": "וַיִּשְׁחָ֓ט&thinsp;<b>׀<\/b> וַיִּקַּ֤ח מֹשֶׁה֙ מִדָּמ֔וֹ וַיִּתֵּ֛ן עַל־תְּנ֥וּךְ אֹֽזֶן־אַהֲרֹ֖ן הַיְמָנִ֑ית וְעַל־בֹּ֤הֶן יָדוֹ֙ הַיְמָנִ֔ית וְעַל־בֹּ֥הֶן רַגְל֖וֹ הַיְמָנִֽית׃", "onk": "וּנְכֵס וּנְסִיב משֶׁה מִן דְּמָא וִיהַב עַל <b>רוּם אוּדְנָא<\/b> דְאַהֲרֹן דְּיַמִּינָא וְעַל אִלְיוֹן יְדֵיהּ דְּיַמִּינָא וְעַל אִלְיוֹן רַגְלֵיהּ דְּיַמִּינָא:", "onk_en": "He slaughtered it; and Moshe took some of its blood and he put it on [<b>the upper part of<\/b>] Aharons right earlobe [<b>ear<\/b>], on the thumb of his right hand and the big toe of his right foot.", "pj": "וּנְכֵיס יַת דִיכְרָא וּנְסֵיב משֶׁה מִן אַדְמֵיהּ וִיהַב עַל חַסְחוֹס אוּדְנָא דְאַהֲרן דְהוּא גְדֵירָא דִמְצִיעָאָה דְאוֹדַן יְמִינָא וְעַל פּוּרְקָא מִיצְעָא דְיַדֵיהֶן דְיַמִינָא וְעַל פּוּרְקָא מְצִיעָאָה דְרִגְלֵיהּ יְמִינָא", "pj_en": "And he killed the ram, and Mosheh took of its blood, and put it upon the etremity of Aharon's ear, the middle cartilage of the right ear, and upon the middle joint of his right foot.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 24, "aliyah": 6, "heb": "וַיַּקְרֵ֞ב אֶת־בְּנֵ֣י אַהֲרֹ֗ן וַיִּתֵּ֨ן מֹשֶׁ֤ה מִן־הַדָּם֙ עַל־תְּנ֤וּךְ אׇזְנָם֙ הַיְמָנִ֔ית וְעַל־בֹּ֤הֶן יָדָם֙ הַיְמָנִ֔ית וְעַל־בֹּ֥הֶן רַגְלָ֖ם הַיְמָנִ֑ית וַיִּזְרֹ֨ק מֹשֶׁ֧ה אֶת־הַדָּ֛ם עַל־הַֽמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְקָרִיב יָת בְּנֵי אַהֲרֹן וִיהַב משֶׁה מִן דְּמָא עַל <b>רוּם אוּדְנֵהוֹן<\/b> דְּיַמִּינָא וְעַל אִלְיוֹן יְדֵיהוֹן דְּיַמִּינָא וְעַל אִלְיוֹן רַגְלֵהוֹן דְּיָמִּינָא וּזְרַק משֶׁה יָת דְּמָא עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "He brought the sons of Aharon; and Moshe put some blood on [<b>the upper part of<\/b>] their right earlobes [<b>ears<\/b>] and on the thumbs of their right hands and on the big toes of their right feet. Moshe sprinkled the blood all around the altar.", "pj": "וּקְרֵיב יַת בְּנֵי אַהֲרן וִיהַב משֶׁה מִן אַדְמָא עַל גְדֵירָא מִיצְעָא דְאוּדְנֵיהוֹן יְמִינָא וְעַל פּוּרְקָא מִיצְעָא דְיַדֵיהוֹן יְמִינָא וְעַל פּוּרְקָא מִיצְעָא דְרִיגְלֵיהוֹן דְיַמִינָא וּדְרַק משֶׁה יַת כָּל מוֹתַר אַדְמָא עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And he brought the sons of Aharon, and Mosheh put of the blood upon the middle cartilage of their right ears, and upon the middle joint of their right feet, and Mosheh poured out all the remaining blood upon the altar round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 25, "aliyah": 6, "heb": "וַיִּקַּ֞ח אֶת־הַחֵ֣לֶב וְאֶת־הָֽאַלְיָ֗ה וְאֶֽת־כׇּל־הַחֵ֘לֶב֮ אֲשֶׁ֣ר עַל־הַקֶּ֒רֶב֒ וְאֵת֙ יֹתֶ֣רֶת הַכָּבֵ֔ד וְאֶת־שְׁתֵּ֥י הַכְּלָיֹ֖ת וְאֶֽת־חֶלְבְּהֶ֑ן וְאֵ֖ת שׁ֥וֹק הַיָּמִֽין׃", "onk": "וּנְסִיב יָת תַּרְבָּא וְיָת אֲלִיתָא וְיָת כָּל תַּרְבָּא דִּי עַל גַּוָּא וְיָת חֲצַר כַּבְדָּא וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבְּהֶן וְיָת שׁוֹקָא דְיַמִּינָא:", "onk_en": "He took the fat and the fat tail, all the fat on the innards, the lobe of the liver, the two kidneys and their fats and the right thigh.", "pj": "וּנְסֵיב יַת תַּרְבָּא וְיַת אֲלִיתָא וְיַת כָּל תַּרְבָּא דְעַל בְּנֵי גַוָוא וְיַת חֲצַר כַּבְדָא וְיַת תַּרְתֵּין כּוּלְיָין וְיַת תַּרְבֵּיהוֹן וְיַת שַׁקָא דְיַמִינָא", "pj_en": "And he took the fat, and the tail, and all the fat which was upon the inwards, and the caul of the liver, and the two kidneys, and their fat, and the right shoulder;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 26, "aliyah": 6, "heb": "וּמִסַּ֨ל הַמַּצּ֜וֹת אֲשֶׁ֣ר&thinsp;<b>׀<\/b> לִפְנֵ֣י יְהֹוָ֗ה לָ֠קַ֠ח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽחַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְרָקִ֣יק אֶחָ֑ד וַיָּ֙שֶׂם֙ עַל־הַ֣חֲלָבִ֔ים וְעַ֖ל שׁ֥וֹק הַיָּמִֽין׃", "onk": "וּמִסַּלָּא דְפַטִּירַיָּא דִּי קֳדָם יְיָ נְסִיב גְּרִצְתָּא פַטִּירָא חֲדָא וּגְרִצְתָּא דִלְחֵם מְשַׁח חֲדָא וְאֶסְפּוֹג חָד וְשַׁוִּי עַל תַּרְבַּיָּא וְעַל שׁוֹקָא דְיַמִּינָא:", "onk_en": "From the basket of <i>matzos<\/i> which [was] before Adonoy he took one <i>matzoh<\/i> loaf, one oil-bread and one wafer and he placed them on the fats and on the right thigh.", "pj": "וּמִסַלָא דְפַטִירַיָא דִקְדָם יְיָ נְסֵיב גְרִיצְתָּא פַּטִירְתָּא חֲדָא וּגְרִיצְתָּא דִלְחֵים פְּתִיךְ בִּמְשַׁח חֲדָא וַעֲרוֹךְ חַד וְשַׁוֵי עַל תַּרְבַּיָא וְעַל שַׁקָא דְיַמִינָא", "pj_en": "and from the basket of unleavened cakes which was before the Lord he took one unleavened cake of bread mixed with oil, and one wafer, and put it upon the fat and upon the right shoulder,", "tj": "", "tj_en": "", "rashi": "<b>וחלת לחם שמן.<\/b> הִיא רְבוּכָה שֶׁהָיָה מַרְבֶּה בָּהּ שֶׁמֶן כְּנֶגֶד הַחַלּוֹת וְהָרְקִיקִין, כָּךְ מְפֹרָשׁ בִּמְנָחוֹת (דף פ\"ט):", "rashi_en": "וחלת לחם שמן AND A CAKE OF OILED BREAD — This was a scalded cake, and it is called “oiled bread” because he used a large quantity of oil for it, equal to that which he used for the cakes and wafers together. So is it explained in Treatise Menachot 78a (also Menachot 89a)."}, {"ch": 8, "v": 27, "aliyah": 6, "heb": "וַיִּתֵּ֣ן אֶת־הַכֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְעַ֖ל כַּפֵּ֣י בָנָ֑יו וַיָּ֧נֶף אֹתָ֛ם תְּנוּפָ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וִיהַב יָת כֹּלָּא עַל יְדֵי אַהֲרֹן וְעַל יְדֵי בְנוֹהִי <b>וַאֲרֵם<\/b> יָתְהוֹן <b>אֲרָמָא<\/b> קֳדָם יְיָ:", "onk_en": "He put them all on Aharons palms and on the palms of his sons and he waved [<b>lifted<\/b>] them [<b>up<\/b>] as a wave-offering [<b>an uplifted-offering<\/b>] before Adonoy.", "pj": "וְסַדֵר יַת כּוֹלָא עַל יְדֵי אַהֲרן וְעַל יְדֵי בְנוֹי וַאֲרֵים יַתְהוֹן אֲרָמָא קֳדָם יְיָ", "pj_en": "and laid the whole in order upon Aharon's hands, and upon the hands of his sons, lifted them up, an elevation before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 28, "aliyah": 6, "heb": "וַיִּקַּ֨ח מֹשֶׁ֤ה אֹתָם֙ מֵעַ֣ל כַּפֵּיהֶ֔ם וַיַּקְטֵ֥ר הַמִּזְבֵּ֖חָה עַל־הָעֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְרֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַיהֹוָֽה׃", "onk": "וּנְסִיב משֶׁה יָתְהוֹן מֵעַל יְדֵיהוֹן וְאַסֵּק לְמַדְבְּחָא עַל עֲלָתָא <b>קֻרְבָּנַיָּא אִנּוּן לְאִתְקַבָּלָא בְרַעֲוָא קֻרְבָּנָא<\/b> הוּא קֳדָם יְיָ:", "onk_en": "Moshe took them from their palms and he burned them on the altar in addition to the burnt-offering; they are installation-offerings for a pleasing fragrance [<b>offerings to be accepted with favor<\/b>], it is a fire-offering to [<b>an offering before<\/b>] Adonoy.", "pj": "וּנְסֵיב משֶׁה יַתְהוֹן מֵעַל יְדֵיהוֹן וְאַסֵיק עַל מַדְבְּחָא עַל עֲלָתָא קָרְבָּן אַשְׁלָמוּתָא הִינוּן דִשְׁלִימוּן בְּכוֹלָא מְטוּל לְאִתְקַבְּלָא בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "And Mosheh took them from off their hands, and burned (them) upon the altar with the burnt sacrifice; a completing offering were they to complete all, to be received with acceptance before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ויקטר המזבחה.<\/b> מֹשֶׁה שִׁמֵּשׁ כָּל שִׁבְעַת יְמֵי הַמִּלּוּאִים בְּחָלוּק לָבָן (עבודה זרה ל\"ד):<br><br><b>על העלה.<\/b> אַחַר הָעוֹלָה, וְלֹא מָצִינוּ שׁוֹק שֶׁל שְׁלָמִים קָרֵב בְּכָל מָקוֹם חוּץ מִזֶּה:", "rashi_en": "ויקטר המזבחה [AND MOSES TOOK THEM FROM OFF THEIR HANDS] AND CAUSED THEM TO ASCEND IN FUMES AT THE ALTAR — Moses (though a non-priest) was officiating during the seven days of installation [in a white garment] (Avodah Zarah 34a). <br><br>על העלה [AND MOSES … CAUSED THEM TO ASCEND IN FUMES] על העלה — after the burnt offering (על is taken in the sense of besides, in addition to the burnt offering. Hence he burnt it after the burnt offering). We do not find in any passage, that the shoulder of peace-offerings was burnt except in the case of this alone (cf. Rashi on Exodus 29:22)."}, {"ch": 8, "v": 29, "aliyah": 6, "heb": "וַיִּקַּ֤ח מֹשֶׁה֙ אֶת־הֶ֣חָזֶ֔ה וַיְנִיפֵ֥הוּ תְנוּפָ֖ה לִפְנֵ֣י יְהֹוָ֑ה מֵאֵ֣יל הַמִּלֻּאִ֗ים לְמֹשֶׁ֤ה הָיָה֙ לְמָנָ֔ה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וּנְסִיב משֶׁה יָת חֶדְיָא <b>וַאֲרִימֵיהּ אֲרָמָא<\/b> קֳדָם יְיָ מִדְּכַר <b>קֻרְבָּנַיָּא<\/b> לְמשֶׁה הֲוָה לָחֳלָק כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe took the breast and waved [<b>lifted<\/b>] it [<b>up<\/b>] [as] a wave-offering [<b>an uplifted-offering<\/b>] before Adonoy. From the ram for the installation-offering [<b>offerings<\/b>]—that was the portion of Moshe—just as Adonoy commanded Moshe.", "pj": "וּנְסֵיב משֶׁה יַת חַדְיָא וַאֲרִימֵיהּ אֲרָמָא קֳדָם יְיָ מִדְכַר קוּרְבָּנַיָא אִתְפְּרַשׁ לְמשֶׁה הֲוָה לְחוּלַק הֵי כְּמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And he took the breast, and uplifted it, an elevation before the Lord: of the oblation-ram that was the separated portion of Mosheh, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 30, "aliyah": 7, "heb": "וַיִּקַּ֨ח מֹשֶׁ֜ה מִשֶּׁ֣מֶן הַמִּשְׁחָ֗ה וּמִן־הַדָּם֮ אֲשֶׁ֣ר עַל־הַמִּזְבֵּ֒חַ֒ וַיַּ֤ז עַֽל־אַהֲרֹן֙ עַל־בְּגָדָ֔יו וְעַל־בָּנָ֛יו וְעַל־בִּגְדֵ֥י בָנָ֖יו אִתּ֑וֹ וַיְקַדֵּ֤שׁ אֶֽת־אַהֲרֹן֙ אֶת־בְּגָדָ֔יו וְאֶת־בָּנָ֛יו וְאֶת־בִּגְדֵ֥י בָנָ֖יו אִתּֽוֹ׃", "onk": "וּנְסִיב משֶׁה מִמִּשְׁחָא <b>דִרְבוּתָא<\/b> וּמִן דְּמָא דִּי עַל מַדְבְּחָא וְאַדִּי עַל אַהֲרֹן עַל לְבוּשׁוֹהִי וְעַל בְּנוֹהִי וְעַל לְבוּשֵׁי בְנוֹהִי עִמֵּיהּ וְקַדִּישׁ יָת אַהֲרֹן יָת לְבוּשׁוֹהִי וְיָת בְּנוֹהִי וְיָת לְבוּשֵׁי בְנוֹהִי עִמֵּיהּ:", "onk_en": "Moshe took some anointing-oil [<b>which inaugurates to greatness<\/b>] and some blood that was on the altar and sprinkled it on Aharon, on his garments, and on his sons and on his sons garments with him. He sanctified Aharon and his garments and his sons and his sons garments with him.", "pj": "וּנְסֵיב משֶׁה מִמִשְׁחָא דִרְבוּתָא וּמִן אַדְמָא דְעַל מַדְבְּחָא וְאַדִי עַל אַהֲרן וְעַל לְבוּשׁוֹי וְעַל בְּנוֹי וְעַל לְבוּשֵׁי בְנוֹי עִמֵיהּ וְקַדִישׁ יַת אַהֲרן וְיַת לְבוּשׁוֹי וְיַת בְּנוֹי וְיַת לְבוּשֵׁי בְנוֹי עִמֵיהּ", "pj_en": "And Mosheh took the consecrating oil, and of the blood which was upon the altar, and sprinkled upon Aharon, and upon his vestments, and on his sons, and on their vestments with him; and sanctified Aharon and his vestments, and his sons and their vestments with him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 31, "aliyah": 7, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶל־אַהֲרֹ֣ן וְאֶל־בָּנָ֗יו בַּשְּׁל֣וּ אֶת־הַבָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְשָׁם֙ תֹּאכְל֣וּ אֹת֔וֹ וְאֶ֨ת־הַלֶּ֔חֶם אֲשֶׁ֖ר בְּסַ֣ל הַמִּלֻּאִ֑ים כַּאֲשֶׁ֤ר צִוֵּ֙יתִי֙ לֵאמֹ֔ר אַהֲרֹ֥ן וּבָנָ֖יו יֹאכְלֻֽהוּ׃", "onk": "וַאֲמַר משֶׁה לְאַהֲרֹן וְלִבְנוֹהִי בַּשִּׁילוּ יָת בִּסְרָא בִּתְרַע מַשְׁכַּן זִמְנָא וְתַמָּן תֵּיכְלוּן יָתֵיהּ וְיָת לַחְמָא דִּי בְּסַל <b>קֻרְבָּנַיָּא<\/b> כְּמָא דִי פַקֵּדִית לְמֵימַר אַהֲרֹן וּבְנוֹהִי יֵיכְלֻנֵּיהּ:", "onk_en": "Moshe said to Aharon and to his sons Cook the flesh at the entrance of the Tent of Meeting and you shall eat it there [with] the bread that is in the installation basket [<b>of sacrifices<\/b>] just as I commanded, saying; Aharon and his sons shall eat them.", "pj": "וַאֲמַר משֶׁה לְאַהֲרן וְלִבְנוֹי בְּשִׁילוּ יַת בְּשַר קוּרְבָּנַיָא בְּדוֹדְוָותַיָא בִּתְרַע מַשְׁכַּן זִימְנָא וְתַמָן תֵיכְלוּן יָתֵיהּ וְיַת לַחְמָא דִבְסַל קוּרְבָּנַיָא הֵי כְמָא דְפַקֵידִית לְמֵימָר אַהֲרן וּבְנוֹהִי יֵיכְלוּנֵיהּ", "pj_en": "And Mosheh said to Aharon and to his sons, Boil the flesh of the oblations in pots at the door of the tabernacle of ordinance, and there shall you eat it with the bread which is in the basket of oblation, according to the precept which was spoken; Aharon and his sons shall eat it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 32, "aliyah": 7, "heb": "וְהַנּוֹתָ֥ר בַּבָּשָׂ֖ר וּבַלָּ֑חֶם בָּאֵ֖שׁ תִּשְׂרֹֽפוּ׃", "onk": "וּדְאִשְׁתָּאַר בְּבִשְׂרָא וּבְלַחְמָא בְּנוּרָא תּוֹקְדוּן:", "onk_en": "Whatever flesh and bread is left over, you shall burn them in fire.", "pj": "וּמַה דְמִשְׁתַּיֵיר בְּבִישְרָא וּבְלַחְמָא בְּנוּרָא תּוֹקְדוּן", "pj_en": "And what remaineth of the flesh, and of the bread, you shall burn with fire.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 33, "aliyah": 7, "heb": "וּמִפֶּ֩תַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵיכֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת־יֶדְכֶֽם׃", "onk": "וּמִתְּרַע מַשְׁכַּן זִמְנָא לָא תִפְּקוּן שִׁבְעָא יוֹמִין עַד יוֹם מִשְׁלַם יוֹמֵי <b>קֻרְבָּנֵיכוֹן<\/b> אֲרֵי שִׁבְעָא יוֹמִין <b>יְקָרֵב יָת קֻרְבָּנְכוֹן<\/b>:", "onk_en": "From the entrance of the Tent of Meeting you shall not go out for seven days until the time that your days of installation [<b>sacrifices<\/b>] are complete, because for seven days your hands [<b>sacrifices<\/b>] will be filled [<b>offered<\/b>].", "pj": "וּמִתְּרַע מַשְׁכְּנָא לָא תִפְקוּן שׁוּבְעָא יוֹמִין עַד יוֹם מִישְׁלַם יוֹמֵי אַשְׁלָמְנוּתְכוֹן אֲרוּם שׁוּבְעָא יוֹמִין יִתוֹקָם מַשְׁכְּנָא וְיִתְפְּרֵק וְיִתְקָרֵב קוּרְבַּנְכוֹן", "pj_en": "And from the door of the tabernacle you shall not go forth seven days, until the day that your consecration be completed, (because in seven days is the tabernacle set up and taken in pieces,) and your oblation be offered.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 8, "v": 34, "aliyah": 7, "heb": "כַּאֲשֶׁ֥ר עָשָׂ֖ה בַּיּ֣וֹם הַזֶּ֑ה צִוָּ֧ה יְהֹוָ֛ה לַעֲשֹׂ֖ת לְכַפֵּ֥ר עֲלֵיכֶֽם׃", "onk": "כְּמָא דִי עֲבַד בְּיוֹמָא הָדֵין פַּקִּיד יְיָ לְמֶעְבַּד לְכַפָּרָא עֲלֵיכוֹן:", "onk_en": "Just as you have done on this day, Adonoy commanded him to do, to bring about atonement.", "pj": "הֵי כְמָא דְעָבַד וְסָדַר יַת סֵדֶר קוּרְבָּנַיָא בְּיוֹמָא הָדֵין הֵיכְדֵין פַּקֵיד יְיָ לְמֶעֱבַד אַתּוּן בָּתַר יוֹמֵי אַשְׁלָמוּתָא לִמְכַפְּרָא עֲלֵיכוֹן", "pj_en": "(So did he, and ordained the order of the oblations on that day.) Likewise the Lord hath commanded to be done by you after the days of consecration, to make atonement for you.", "tj": "", "tj_en": "", "rashi": "<b>צוה ה' לעשת.<\/b> כָּל שִׁבְעַת הַיָּמִים; וְרַבּוֹתֵינוּ דָרְשׁוּ, <b>לעשת<\/b> — זֶה מַעֲשֵׂה פָרָה, <b>לכפר<\/b> — זֶה מַעֲשֵׂה יוֹם הַכִּפּוּרִים, וּלְלַמֵּד שֶׁכֹּהֵן גָּדוֹל טָעוּן פְּרִישָׁה קֹדֶם יוֹם הַכִּפּוּרִים שִׁבְעַת יָמִים, וְכֵן הַכֹּהֵן הַשּׂוֹרֵף אֶת הַפָּרָה (ספרא):", "rashi_en": "צוה ה' לעשת [AS HE HATH DONE THIS DAY, SO] THE LORD HATH COMMANDED TO DO all the seven days). But our Rabbis explained as follows: לעשת, “so hath the Lord commanded to do” — this refers to the “Red Heifer” (Numbers ch. XIX.); and לכפר, “to perform a cleansing ceremony” — this refers to Yom-Kippur. And thus these words, they say, are intended to intimate that the High Priest requires separating from his family during seven days before Yom-Kippur, and similarly the priest who burns the Red Heifer (Sifra, Tzav, Mechilta d'Miluim 1 37; Yoma 2a; Yoma 3b)."}, {"ch": 8, "v": 35, "aliyah": 7, "heb": "וּפֶ֩תַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָלַ֙יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּשְׁמַרְתֶּ֛ם אֶת־מִשְׁמֶ֥רֶת יְהֹוָ֖ה וְלֹ֣א תָמ֑וּתוּ כִּי־כֵ֖ן צֻוֵּֽיתִי׃", "onk": "וּבִתְרַע מַשְׁכַּן זִמְנָא תֵּיתְבוּן יְמָם וְלֵילֵי שִׁבְעָא יוֹמִין וְתִטְּרוּן יָת מַטְּרַת <b>מֵימְרָא<\/b> דַיְיָ וְלָא תְמוּתוּן אֲרֵי כֵן אִתְפַּקָּדִית:", "onk_en": "At the entrance of the Tent of Meeting you shall sit day and night for seven days and keep the charge of [<b>the Word of<\/b>] Adonoy and you will not die, because I have been thus commanded.", "pj": "וּבִתְרַע מַשְׁכַּן זִימְנָא תֵּיתְבוּן יוֹמָם וְלֵילֵי שׁוּבְעָא יוֹמִין וְתִטְרוּן יַת מַטְרַת מֵימְרָא דַיְיָ וְלָא תְמוּתוּן אֲרוּם הֵיכְדֵין אִיתְפַּקֵדִית", "pj_en": "And at the door of the tabernacle of ordinance you shall reside day and night seven days, and watch the vigils of the Word of the Lord, that you may not die, for thus it hath been commanded.", "tj": "", "tj_en": "", "rashi": "<b>ולא תמותו.<\/b> הָא אִם לֹא תַעֲשׂוּ כֵן הֲרֵי אַתֶּם חַיָּבִים מִיתָה:", "rashi_en": "ולא תמותו [THEREFORE SHALL YE ABIDE AT THE ENTRANCE OF THE APPOINTED TENT DAY AND NIGHT. SEVEN DAYS] … THAT YE DIE NOT — Consequently if you will not do thus, you become liable to the death penalty."}, {"ch": 8, "v": 36, "aliyah": 7, "heb": "וַיַּ֥עַשׂ אַהֲרֹ֖ן וּבָנָ֑יו אֵ֚ת כׇּל־הַדְּבָרִ֔ים אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה בְּיַד־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַעֲבַד אַהֲרֹן וּבְנוֹהִי יָת כָּל פִּתְגָּמַיָּא דִּי פַקִּיד יְיָ בִּידָא דְמשֶׁה:", "onk_en": "Aharon and his sons fulfilled all the edicts that Adonoy commanded through Moshe.", "pj": "וַעֲבַד אַהֲרן וּבְנוֹי יַת כָּל פִּתְגָמַיָא דְפַּקֵיד יְיָ בִּידָא דְמשֶׁה", "pj_en": "And Aharon and his sons did all the things which the Lord had commanded by the hand of Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויעש אהרן ובניו.<\/b> לְהַגִּיד שִׁבְחָן, שֶׁלֹא הִטּוּ יָמִין וּשְֹמֹאל:", "rashi_en": "ויעש אהרן ובניו SO AARON AND HIS SONS DID [ALL THE THINGS] — This is stated to tell their praise — that they did not turn to the right nor to the left (cf. Sifra, Tzav, Mechilta d'Miluim 1 38)."}];
const LABELS = { onk: "אונקלוס", pj: "יונתן", yer: "ירושלמי", rashi: "רש״י" };

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
