<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "toldot";
const DATA = [{"ch": 25, "v": 19, "aliyah": 1, "heb": "וְאֵ֛לֶּה תּוֹלְדֹ֥ת יִצְחָ֖ק בֶּן־אַבְרָהָ֑ם אַבְרָהָ֖ם הוֹלִ֥יד אֶת־יִצְחָֽק׃", "onk": "וְאִלֵּין תּוּלְדַת יִצְחָק בַּר אַבְרָהָם אַבְרָהָם אוֹלִיד יָת יִצְחָק:", "onk_en": "And these are the descendants of Yitzchok son of Avraham. Avraham was the father of Yitzchok.", "pj": "ואלה וְאִלֵין תּוּלְדַת יִצְחָק בַּר אַבְרָהָם וּמִן בִּגְלַל דַהֲוָה אִיקוּנִין דְיִצְחָק מְדַמְיַין לְאִיקוּנִין דְאַבְרָהָם הֲווֹן בְּנֵי נְשָׁא אָמְרִין בְּקוּשְׁטָא אַבְרָהָם אוֹלִיד יַת יִצְחָק", "pj_en": "These are the generations of Izhak bar Abraham. And because the appearance of Izhak resembled the appearance of Abraham, the sons of men said, In truth Abraham begat Izhak.", "tj": "וְאִלֵין יֵיחוּס תּוּלְדַת:", "tj_en": "", "rashi": "<b>ואלה תולדות יצחק.<\/b> יַעֲקֹב וְעֵשָׂו הָאֲמוּרִים בַּפָּרָשָׁה:<br><br><b>אברהם הוליד את יצחק.<\/b> עַל יְדֵי שֶׁכָּתַב הַכָּתוּב יִצְחָק בֶּן אַבְרָהָם הֻזְקַק לוֹמַר אַבְרָהָם הוֹלִיד אֶת יִצְחָק; לְפִי שֶׁהָיוּ לֵיצָנֵי הַדּוֹר אוֹמְרִים מֵאֲבִימֶלֶךְ נִתְעַבְּרָה שָׂרָה, שֶׁהֲרֵי כַּמָּה שָׁנִים שָׁהֲתָה עִם אַבְרָהָם וְלֹא נִתְעַבְּרָה הֵימֶנּוּ; מֶה עָשָׂה הַקָּבָּ\"ה? צָר קְלַסְתֵּר פָּנָיו שֶׁל יִצְחָק דּוֹמֶה לְאַבְרָהָם, וְהֵעִידוּ הַכֹּל אַבְרָהָם הוֹלִיד אֶת יִצְחָק, וְזֶהוּ שֶׁכָּתוּב כָּאן יִצְחָק בֶּן אַבְרָהָם, שֶׁהֲרֵי עֵדוּת יֵשׁ שֶׁאַבְרָהָם הוֹלִיד אֶת יִצְחָק:", "rashi_en": "ואלה תולדות יצחק AND THESE ARE THE PROGENY OF ISAAC — viz, Jacob and Esau who are spoken of in this section.<br><br>אברהם הוליד את יצחק ABRAHAM BEGAT ISAAC — Just because Scripture wrote, “Isaac, son of Abraham” it felt compelled to say “Abraham begat Isaac”, because the cynics of that time said, “Sarah became with child of Abimelech. See how many years she lived with Abraham without becoming with child”. What did the Holy One, blessed be He, do? He shaped Isaac’s facial features exactly similar to those of Abraham’s, so that everyone had to admit that Abraham begat Isaac. This is what is stated here: that Isaac was the son of Abraham, for there is evidence that Abraham begat Isaac (Midrash Tanchuma, Toldot 1)."}, {"ch": 25, "v": 20, "aliyah": 1, "heb": "וַיְהִ֤י יִצְחָק֙ בֶּן־אַרְבָּעִ֣ים שָׁנָ֔ה בְּקַחְתּ֣וֹ אֶת־רִבְקָ֗ה בַּת־בְּתוּאֵל֙ הָֽאֲרַמִּ֔י מִפַּדַּ֖ן אֲרָ֑ם אֲח֛וֹת לָבָ֥ן הָאֲרַמִּ֖י ל֥וֹ לְאִשָּֽׁה׃", "onk": "וַהֲוָה יִצְחָק בַּר אַרְבְּעִין שְׁנִין כַּד נְסֵיב יָת רִבְקָה בַּת בְּתוּאֵל אֲרַמָּאָה מִפַּדַּן אֲרָם אֲחָתֵיהּ דְּלָבָן אֲרַמָּאָה לֵיהּ לְאִנְתּוּ:", "onk_en": "Yitzchok was forty years old when he took Rivkah, the daughter of Besueil, the Aramite, of Padan Aram, sister of Lavan, the Aramite, for a wife.", "pj": "וַהֲוָה יִצְחָק בַּר אַרְבְּעִין שְׁנִין בְּמִסְבֵיהּ יַת רִבְקָה בְּרַת בְּתוּאֵל אֲרָמָאָה דְמִן פַּדַן אֲרָם אַחְתֵיהּ דְלָבָן אֲרָמָאָה לֵיהּ לְאִנְתּוּ", "pj_en": "And Izhak was the son of forty years when he took Rivekah, the daughter of Bethuel the Aramite, who was of Padan Aram, the sister of Laban the Aramite, unto him for a wife.", "tj": "", "tj_en": "", "rashi": "<b>בן ארבעים שנה.<\/b> שֶׁהֲרֵי כְּשֶׁבָּא אַבְרָהָם מֵהַר הַמּוֹרִיָּה נִתְבַּשֵּׂר שֶׁנּוֹלְדָה רִבְקָה, וְיִצְחָק הָיָה בֶּן ל\"ז שָׁנָה, שֶׁהֲרֵי בּוֹ בַּפֶּרֶק מֵתָה שָׂרָה, וּמִשֶּׁנּוֹלַד יִצְחָק עַד הָעֲקֵדָה שֶׁמֵּתָה שָׂרָה, ל\"ז שָׁנָה הָיוּ – כִּי בַּת צ' הָיְתָה כְּשֶׁנּוֹלַד יִצְחָק, וּבַת קכ\"ז כְּשֶׁמֵּתָה – שֶׁנֶּאֱמַר וַיִּהְיוּ חַיֵּי שָׂרָה וְגוֹ' הֲרֵי לְיִצְחָק ל\"ז שָׁנִים, וּבוֹ בַפֶּרֶק נוֹלְדָה רִבְקָה; הִמְתִּין לָהּ עַד שֶׁתְּהֵא רְאוּיָה לְבִיאָה ג' שָׁנִים וּנְשָׂאָהּ:<br><br><b>בת בתואל מפדן ארם אחות לבן.<\/b> וְכִי עֲדַיִן לֹא נִכְתַּב שֶׁהִיא בַּת בְּתוּאֵל וַאֲחוֹת לָבָן וּמִפַּדַּן אֲרָם? אֶלָּא לְהַגִּיד שִׁבְחָהּ, שֶׁהָיְתָה בַּת רָשָׁע וַאֲחוֹת רָשָׁע וּמְקוֹמָהּ אַנְשֵׁי רֶשַׁע וְלֹא לָמְדָה מִמַּעֲשֵׂיהֶם:<br><br><b>מפדן ארם.<\/b> עַל שֵׁם שֶׁשְּׁנֵי אֲרָם הָיוּ, אֲרַם נַהֲרַיִם וַאֲרַם צוֹבָה, קוֹרֵא אוֹתוֹ פַּדָּן, לְשׁוֹן צֶמֶד בָּקָר, תַּרְגּוּם פַּדָּן תּוֹרִין; וְיֵשׁ פּוֹתְרִין פַּדַּן אֲרָם כְּמוֹ שְׂדֵה אֲרָם, שֶׁבִּלְשׁוֹן יִשְׁמָעֵאל קוֹרִין לְשָׂדֶה פַדַּן:", "rashi_en": "בן ארבעים שנה FORTY YEARS OLD — For when Abraham came from Mount Moriah he received the news that Rebecca was born (22:20). Isaac was then thirty-seven years old, because at that time Sarah died and from the birth of Isaac until the Binding — when Sarah died — there were 37 years since she was 90 years old when Isaac was born and 127 when she died, as it is said, (23:1) “And the life of Sarah was [one hundred and twenty seven years]” — thus Isaac was then 37 years old. At that period Rebecca was born and he waited until she was fit for marriage — 3 years — and then married her (Seder Olam).<br><br>בת בתואל מפדן ארם אחות לבן THE DAUGHTER OF BETHUEL THE SYRIAN OF PADAN-ARAM, THE SISTER TO LABAN —Has it not already been written that she was the daughter of Bethuel and sister of Laban of Padanaram? But we are told these facts once more to proclaim her praise — she was the daughter of a wicked man, sister of a wicked man, and her native place was one of wicked people, and yet she did not learn from their doings (Genesis Rabbah 63:4).<br><br>מפדן ארם FROM PADAN-ARAM — Because there were two Arams — Aram-Naharaim (Mesopotamia) and Aram-Zoba — it is called Padan-aram, (Padan meaning pair). It has the same meaning as צמד in the phrase צמד בקר (Samuel 11:7) which we know signifies a pair of oxen and which is translated in the Targum by פדן תורין a Padan of oxen, so that we see that Padan means a pair. Some, however, explain Padan-aram to be the same as (Hosea 12:13) “the field (country) of Aram”, because in the Arabic language a field is called Padan. "}, {"ch": 25, "v": 21, "aliyah": 1, "heb": "וַיֶּעְתַּ֨ר יִצְחָ֤ק לַֽיהֹוָה֙ לְנֹ֣כַח אִשְׁתּ֔וֹ כִּ֥י עֲקָרָ֖ה הִ֑וא וַיֵּעָ֤תֶר לוֹ֙ יְהֹוָ֔ה וַתַּ֖הַר רִבְקָ֥ה אִשְׁתּֽוֹ׃", "onk": "וְצַלִּי יִצְחָק <b>קֳדָם<\/b> יְיָ <b>לָקֳבֵל<\/b> אִתְּתֵיהּ אֲרֵי עֲקָרָה הִיא וְקַבֵּל צְלוֹתֵיהּ יְיָ וְעַדִּיאַת רִבְקָה אִתְּתֵיהּ:", "onk_en": "Yitzchok prayed to [<b>before<\/b>] Adonoy across from [<b>opposite<\/b>] his wife, for she was barren. Adonoy granted his prayer and his wife, Rivkah, conceived.", "pj": "וַאֲזַל יִצְחָק לְטַוָור פּוּלְחָנָא אֲתַר דְכַפְתֵיהּ אֲבוֹי וְהָפַךְ יִצְחָק בִּצְלוּתֵיהּ דַעֲתֵּיה דְקֻבָּ\"ה מִמַה דִגְזַר עַל אִנְתְּתֵיהּ אֲרוּם עַקְרָא הֲוַת גַבֵּיהּ עֶשְרִין וְתַרְתֵּין שְׁנִין וְאִתְהֲפִּיךְ בְּגִינֵיהּ דַעֲתֵּיה דְקֻבָּ\"ה מִמַה דִגְזַר עֲלֵיהּ דְאַף הוּא הֲוָה עָקָר וְאִתְרָוַח וְאִתְעַבָּרַת רִבְקָה אִנְתְּתֵיהּ", "pj_en": "And Izhak went to the mountain of worship, the place where his father had bound him. And Izhak in his prayer turned the attention of the Holy One, blessed be He! from that which He had decreed concerning him who had been childless. And he was enlarged, and Rivekah his wife was with child.", "tj": "", "tj_en": "", "rashi": "<b>ויעתר.<\/b> הִרְבָּה וְהִפְצִיר בִּתְפִלָּה:<br><br><b>ויעתר לו.<\/b> נִתְפַּצֵּר וְנִתְפַּיֵּס וְנִתְפַּתָּה לוֹ. וְאוֹמֵר אֲנִי, כָּל לְשׁוֹן עֶתֶר לְשׁוֹן הַפְצָרָה וְרִבּוּי הוּא, וְכֵן וַעֲתַר עֲנַן הַקְּטֹרֶת (יחז' ח') – מַרְבִּית עֲלִיַּת הֶעָשָׁן, וְכֵן וְהַעְתַּרְתֶּם עָלַי דִּבְרֵיכֶם (שם ל\"ה), וְכֵן וְנַעְתָּרוֹת נְשִׁיקוֹת שׂוֹנֵא (משלי כ\"ז) – דּוֹמוֹת לִמְרֻבּוֹת וְהִנָּם לְמַשָּׂא; אנקרי\"שרא בלע\"ז:<br><br><b>לנכח אשתו.<\/b> זֶה עוֹמֵד בְּזָוִית זוֹ וּמִתְפַּלֵּל וְזוֹ עוֹמֶדֶת בְּזָוִית זוֹ וּמִתְפַּלֶּלֶת:<br><br><b>ויעתר לו.<\/b> לוֹ וְלֹא לָהּ, שֶׁאֵין דּוֹמָה תְפִלַּת צַדִּיק בֶּן צַדִּיק לִתְפִלַּת צַדִּיק בֶּן רָשָׁע, לְפִיכָךְ לוֹ וְלֹא לָהּ (יבמות ס\"ד):", "rashi_en": "וַיֶּעְתַּר AND ISAAC ENTREATED —He prayed much and urgently.<br><br>וַיֵּעָתֶר לו WAS ENTREATED OF HIM — He let himself be urged, conciliated and influenced by him. I say that wherever this root עתר occurs it has the meaning of heaping up and increasing. E. g., (Ezekiel 8:11) “And a thick (עתר) cloud of incense” which means an abundance of ascending smoke; (Ezekiel  35:13) “You have multiplied (העתרתם) your words against me”; (Proverbs 27:6) “The kisses of an enemy are importunate (נעתרות)”—they appear to be too many and therefore they are burdensome. old French encresser; English to increase.<br><br>לנכח אשתו FACING HIS WIFE — He stood in one corner and prayed whilst she stood in the other corner and prayed (Genesis Rabbah 63:5).<br><br>ויעתר לו [AND THE LORD] WAS ENTREATED OF HIM — of him and not of her, because there is no comparison between the prayer of a righteous person who is the son of a righteous person and the prayer of a righteous person the child of a wicked-person — therefore God allowed himself to be entreated of him and not of her (Yevamot 64a)."}, {"ch": 25, "v": 22, "aliyah": 1, "heb": "וַיִּתְרֹֽצְצ֤וּ הַבָּנִים֙ בְּקִרְבָּ֔הּ וַתֹּ֣אמֶר אִם־כֵּ֔ן לָ֥מָּה זֶּ֖ה אָנֹ֑כִי וַתֵּ֖לֶךְ לִדְרֹ֥שׁ אֶת־יְהֹוָֽה׃", "onk": "וְדַחֲקִין בְּנַיָּא בִּמְעָהָא וַאֲמֶרֶת אִם כֵּן לְמָה דְנָן אָנָא וַאֲזָלַת <b>לְמִתְבַּע אוּלְפַן מִן קֳדָם<\/b> יְיָ:", "onk_en": "The children clashed [<b>pressed<\/b>] inside her, and [when this happened] she said, If this is so, why did I desire this? She [then] went to inquire of [<b>to ask for instruction from before<\/b>] Adonoy.", "pj": "וְאַדְחִיקוּ בְּנַיָא בְּמֵיעָהָא הֵי כְּגוּבְרִין עָבְדוּ קְרָבָא וַאֲמָרַת אִם כְּדֵין הוּא צַעֲרָא דִילִדְתָּא לְמָא דֵין לִי בְּנִין וַאֲזָלַת לְבֵי מֶדְרָשָׁא דְשֵׁם רַבָּא לְמִבְעֵיהּ רַחֲמִין מִן קֳדָם יְיָ", "pj_en": "And the children pressed in her womb as men doing battle. And she said, If this is the anguish of a mother, what then are children to me? And she went into the school of Shem Rabba to supplicate mercy before the Lord.", "tj": "וְאַדְחַקוּ בְּנַיָא בְּמֵעֶיהָ וַאֲמָרַת אִין כְּדֵין הוּא צַעֲרֵיהוֹן דִילִידְתָּא לְמָה כְּעַן לִי הֲיָין לְמֶהֱוֵי לִי בְּנִין וַאֲזָלַת לְמִתְבּוֹעַ רַחֲמִין מִן קָדָם יְיָ בְּבֵית מֶדְרָשׁוֹי דְשֵׁם רַבָּא:", "tj_en": "And the children pressed in her womb, and she said, If such be the anguish of a mother, what now is life, that children are to be mine? And she went to supplicate mercy before the Lord in the beth midrash of Shem Rabba.", "rashi": "<b>ויתרוצצו.<\/b> עַ\"כָּ הַמִּקְרָא הַזֶּה אוֹמֵר דָּרְשֵׁנִי, שֶׁסָּתַם מַה הִיא רְצִיצָה זוֹ וְכָתַב אִם כֵּן לָמָּה זֶּה אָנֹכִי? רַבּוֹתֵינוּ דְּרָשׁוּהוּ לְשׁוֹן רִיצָה; כְּשֶׁהָיְתָה עוֹבֶרֶת עַל פִּתְחֵי תּוֹרָה שֶׁל שֵׁם וָעֵבֶר יַעֲקֹב רָץ וּמְפַרְכֵּס לָצֵאת, עוֹבֶרֶת עַל פֶּתַח עֲבוֹדַת אֱלִילִים, עֵשָׂו מְפַרְכֵּס לָצֵאת. דָּבָר אַחֵר מִתְרוֹצְצִים זֶה עִם זֶה וּמְרִיבִים בְּנַחֲלַת שְׁנֵי עוֹלָמוֹת.<br><br><b>ותאמר אם כן.<\/b> גָּדוֹל צַעַר הָעִבּוּר.<br><br><b>למה זה אנכי.<\/b> מִתְאַוָּה וּמִתְפַּלֶּלֶת עַל הֵרָיוֹן:<br><br><b>ותלך לדרוש.<\/b> לְבֵית מִדְרָשׁוֹ שֶׁל שֵׁם:<br><br><b>לדרוש את ה'.<\/b> שֶׁיַּגִּיד לָהּ מַה תְּהֵא בְּסוֹפָהּ:", "rashi_en": "ויתרצצו AND [THE CHILDREN] STRUGGLED — You must admit that this verse calls for a Midrashic interpretation since it leaves unexplained what this struggling was about and it states that she exclaimed “If it be so, wherefore did I desire this” (i.e. she asked whether this was the normal course of child-bearing, feeling that something extraordinary was happening). Our Rabbis explain that the word ויתרוצצו has the meaning of running, moving quickly: whenever she passed by the doors of the Torah (i. e. the Schools of Shem and Eber) Jacob moved convulsively in his efforts to come to birth, but whenever she passed by the gate of a pagan temple Esau moved convulsively in his efforts to come to birth (Genesis Rabbah 63:6). Another explanation is: they struggled with one another and quarrelled as to how they should divide the two worlds as their inheritance (Yalkut Shimoni on Torah 111:2).<br><br>ותאמר אם כן means AND SHE SAID, “IF the pain of pregnancy be so great,<br><br>למה זה אנכי WHY IS IT that I longed and prayed to become pregnant?” (Genesis Rabbah 63:6).<br><br>ותלך לדרש AND SHE WENT TO ENQUIRE at the school of Shem (Genesis Rabbah 63:6).<br><br>'לדרש את ה, TO ENQUIRE OF THE LORD, that He might tell her what would happen to her at the end. "}, {"ch": 25, "v": 23, "aliyah": 1, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה לָ֗הּ שְׁנֵ֤י <span class=\"mam-kq\"><span class=\"mam-kq-k\">(גיים)<\/span> <span class=\"mam-kq-q\">[גוֹיִם֙]<\/span><\/span> בְּבִטְנֵ֔ךְ וּשְׁנֵ֣י לְאֻמִּ֔ים מִמֵּעַ֖יִךְ יִפָּרֵ֑דוּ וּלְאֹם֙ מִלְאֹ֣ם יֶֽאֱמָ֔ץ וְרַ֖ב יַעֲבֹ֥ד צָעִֽיר׃", "onk": "וַאֲמַר יְיָ לַהּ תְּרֵין עַמְמִין בִּמְעַיְכִי וְתַרְתֵּין מַלְכְּוָן מִמֵּעַיְכִי יִתְפָּרְשָׁן וּמַלְכוּ מִמַּלְכוּ יִתְקַף וְרַבָּא יִשְׁתַּעְבִּיד לִזְעִירָא:", "onk_en": "Adonoy said to her, Two nations are in your womb, and two Kingdoms will separate from within you. One government will be mightier than the other, but the greater one will serve the smaller one.", "pj": "וַאֲמַר יְיָ לָהּ תְּרֵין עַמְמִין בִּמְעַיְיכִי וּתְרֵין מַלְכְּוָן מִמַעַיְיכִי יִתְפַּרְשׁוּן וּמַלְכוּ מִמַלְכוּ יְיהִי אַלִים וְרַבָּא יֶהֱוֵי מִשְׁתַּעֲבֵּיד לִזְעֵירָא אִם בְּנוֹי דִזְעֵירָא נַטְרִין פִּקוּדַיָא דְאוֹרַיְתָא", "pj_en": "And the Lord said to her, Two peoples are in thy womb, and two kingdoms from thy womb shall be separated; and one kingdom shall be stronger than the other, and the elder shall serve the younger, if the children of the younger will keep the commandments of the Law.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' לה.<\/b> עַל יְדֵי שָׁלִיחַ; לְשֵׁם נֶאֱמַר בְּרוּחַ הַקֹּדֶשׁ וְהוּא אָמַר לָהּ (בראשית רבה):<br><br><b>שני גוים בבטנך.<\/b> גיים כְּתִיב; אֵלּוּ אַנְטוֹנִינוּס וְרַבִּי, שֶׁלֹּא פָסְקוּ מֵעַל שֻׁלְחָנָם לֹא צְנוֹן וְלֹא חֲזֶרֶת לֹא בִימוֹת הַחַמָּה וְלֹא בִימוֹת הַגְּשָׁמִים (עבודה זרה י\"א):<br><br><b>ושני לאמים.<\/b> אֵין לְאֹם אֶלָּא מַלְכוּת:<br><br><b>ממעיך יפרדו.<\/b> מִן הַמֵּעַיִם הֵם נִפְרָדִים זֶה לְרִשְׁעוֹ וְזֶה לְתֻמּוֹ:<br><br><b>מלאם יאמץ.<\/b> לֹא יִשְׁווּ בִּגְדֻלָּה, כְּשֶׁזֶּה קָם זֶה נוֹפֵל, וְכֵן הוּא אוֹמֵר אִמָּלְאָה הָחֳרָבָה (יחזקאל כ\"ו), לֹא נִתְמַלְּאָה צוֹר אֶלָּא מֵחֻרְבָּנָהּ שֶׁל יְרוּשָׁלַיִם:", "rashi_en": "ויאמר ה' לה AND THE ETERNAL SAID UNTO HER through a messenger: it was told to Shem by holy inspiration and he told it to her (Genesis Rabbah 63:7).<br><br>שני גויים בבטנך TWO NATIONS ARE IN THY WOMB —The word is written גיים (exalted, noble persons), an allusion to Antoninus and Rabbi (Rabbi Judah the Prince) from whose table neither radish nor lettuce was absent neither in summer nor in winter (Avodah Zarah 11a)<br><br>ושני לאמים AND TWO RACES — The word לאם always denotes a people that has all the characteristics of a kingdom (Avodah Zarah 2b)<br><br>ממעיך יפרדו  SHALL BE PARTED FROM THY BOWELS —as soon as they leave thy body they will take each a different course — one to his wicked ways, the other to his plain life (Genesis 5:27)<br><br>מלאם יאמץ SHALL BE STRONGER THAN THE OTHER RACE —They will never be equally great at the same time: when one rises the other will fall. Thus it says, (Ezekiel 26:2) “[Because Tyre (colonised by Esau) says about Jerusalem] I shall be filled with her that is laid waste” — Tyre became full (powerful) only through the ruin of Jerusalem (Megillah 6a). "}, {"ch": 25, "v": 24, "aliyah": 1, "heb": "וַיִּמְלְא֥וּ יָמֶ֖יהָ לָלֶ֑דֶת וְהִנֵּ֥ה תוֹמִ֖ם בְּבִטְנָֽהּ׃", "onk": "וּשְׁלִימוּ יוֹמָהָא לְמֵילָד וְהָא תְיוּמִין בִּמְעָהָא:", "onk_en": "When her days of pregnancy were completed, behold, there were twins in her womb.", "pj": "וּשְׁלִימוּ מָאתָן וְשׁוּבְעִין יוֹמֵי עִבּוּרָהָא לְמֵילַד וְהָא תְיוֹמִין בִּמְעָהָא", "pj_en": "And the two hundred and seventy days of her being with child were completed to bring forth; and, behold, twins were in her womb.", "tj": "", "tj_en": "", "rashi": "<b>וימלאו ימיה.<\/b> אֲבָל בְּתָמָר כְּתִיב וַיְהִי בְּעֵת לִדְתָּהּ (בראשית ל״ח:כ״ז), שֶׁלֹּא מָלְאוּ יָמֶיהָ, כִּי לְז' חֳדָשִׁים יְלָדָתַם:<br><br><b>והנה תומם.<\/b> חָסֵר, וּבְתָמָר תְּאוֹמִים מָלֵא, לְפִי שֶׁשְּׁנֵיהֶם צַדִּיקִים; אֲבָל כָּאן אֶחָד צַדִּיק וְאֶחָד רָשָׁע:", "rashi_en": "וימלאו ימיה AND WHEN HER DAYS TO BEAR WERE FULL — But in the case of Tamar it is written, (37:27) “And it came to pass at the time of her travail”, for her days were not fulfilled as she gave birth to them (her children) at the end of seven months.<br><br>והנה תומם BEHOLD, THERE WERE TWINS — The word for twins is written defective (without א and י) whilst in the case of Tamar it is written תאומים (with א and י); because in the latter case both children proved righteous whilst here one was righteous and the other wicked (Genesis Rabbah 63:8). "}, {"ch": 25, "v": 25, "aliyah": 1, "heb": "וַיֵּצֵ֤א הָרִאשׁוֹן֙ אַדְמוֹנִ֔י כֻּלּ֖וֹ כְּאַדֶּ֣רֶת שֵׂעָ֑ר וַיִּקְרְא֥וּ שְׁמ֖וֹ עֵשָֽׂו׃", "onk": "וּנְפַק קַדְמָאָה סִמּוֹק כֻּלֵּיהּ כִּגְלִים (<small>נ\"א<\/small> כִּכְלָן) דִּשְׂעָר וּקְרוֹ שְׁמֵיהּ עֵשָׂו:", "onk_en": "The first one came out with a reddish complexion, covered completely with what was like a hairy robe, and they named him Eisov.", "pj": "וּנְפַק קַדְמָאָה סוּמוּקְרַיי כּוּלֵיהּ כְּכִילַן דְשֵיעַר וּקְרוֹי שְׁמֵיהּ עֵשָו מִן בִּגְלַל דְאִתְיְלִיד כּוּלֵיהּ גְמִיר בְּשֵעָר רֵישָׁא וְדִיקְנָא וְשִׁינִין וְכַּכִין", "pj_en": "And the first came forth wholly red, as a garment of hair: and they called his name Esau, because he was born altogether complete, with the hair of the head, and the beard, and teeth, and grinders.", "tj": "וּנְפַק קַדְמַיָא סַמְקִרָיי כּוּלֵיהּ כִכְלַן דִשְעָר וּקְרוּן שְׁמֵיהּ עֵשָו:", "tj_en": "And the first came forth wholly red, as a garment of hair: and they called his name Esau.", "rashi": "<b>אדמוני.<\/b> סִימָן הוּא שֶׁיְּהֵא שׁוֹפֵךְ דָּמִים (בראשית רבה):<br><br><b>כלו כאדרת שער.<\/b> מָלֵא שֵׂעָר כְּטַלִּית שֶׁל צֶמֶר הַמְלֵאָה שֵׂעָר, פלוקי\"דא בלע\"ז:<br><br><b>ויקראו שמו עשו.<\/b> הַכֹּל קָרְאוּ לוֹ כֵן, לְפִי שֶׁהָיָה נַעֲשֶׂה וְנִגְמָר בִּשְׂעָרוֹ כְבֶן שָׁנִים הַרְבֵּה:", "rashi_en": "אדמוני RED — a sign that he would always be shedding blood (Genesis Rabbah 63:8).<br><br>כלו כאדרת שער means full of hair like a woolen garment that is full of hair. (Old French floche; English flock).<br><br>ויקרא שמו עשו AND THEY CALLED HIS NAME ESAU — every one called him thus because he was made (עשה means to make) and fully developed with hair as a lad several years old."}, {"ch": 25, "v": 26, "aliyah": 1, "heb": "וְאַֽחֲרֵי־כֵ֞ן יָצָ֣א אָחִ֗יו וְיָד֤וֹ אֹחֶ֙זֶת֙ בַּעֲקֵ֣ב עֵשָׂ֔ו וַיִּקְרָ֥א שְׁמ֖וֹ יַעֲקֹ֑ב וְיִצְחָ֛ק בֶּן־שִׁשִּׁ֥ים שָׁנָ֖ה בְּלֶ֥דֶת אֹתָֽם׃", "onk": "וּבָתַר כֵּן נְפַק אֲחוּהִי וִידֵיהּ אֲחִידָא בְּעִקְבָא דְעֵשָׂו וּקְרָא שְׁמֵיהּ יַעֲקֹב וְיִצְחָק בַּר שִׁתִּין שְׁנִין כַּד יְלִידַת יָתְהוֹן:", "onk_en": "After that his brother came out, his hand grasping the heel of Eisov, and he [Yitzchok] named him Yaakov. Yitzchok was sixty years old when she [Rivkah] gave birth to them.", "pj": "וּבָתַר כְּדֵין נְפַק אָחוֹי וִידֵיהּ אֲחִידָא בַּעֲקֵיבָא דְעֵשָו וּקְרָא שְׁמֵיהּ יַעֲקב וְיִצְחָק בַּר שִׁתִּין שְׁנִין כַּד יְלֵידַת יַתְהוֹם", "pj_en": "Afterward came forth his brother, and his hand had hold on the heel of Esau. And they called his name Jakob (Yaakov). And Izhak was a son of sixty years when he beget them.", "tj": "", "tj_en": "", "rashi": "<b>ואחרי כן יצא אחיו וגו'.<\/b> שָׁמַעְתִּי מִ\"אַ הַדּוֹרְשׁוֹ לְפִי פְּשׁוּטוֹ, בְּדִין הָיָה אוֹחֵז בּוֹ לְעַכְּבוֹ, יַעֲקֹב נוֹצַר מִטִּפָּה רִאשׁוֹנָה וְעֵשָׂו מִן הַשְּׁנִיָּה; צֵא וּלְמַד מִשְּׁפוֹפֶרֶת שֶׁפִּיהָ קְצָרָה, תֵּן לָהּ שְׁתֵּי אֲבָנִים זוֹ אַחַר זוֹ – הַנִּכְנֶסֶת רִאשׁוֹנָה תֵּצֵא אַחֲרוֹנָה וְהַנִּכְנֶסֶת אַחֲרוֹנָה תֵּצֵא רִאשׁוֹנָה; נִמְצָא עֵשָׂו הַנּוֹצָר בָּאַחֲרוֹנָה יָצָא רִאשׁוֹן וְיַעֲקֹב שֶׁנּוֹצַר רִאשׁוֹנָה יָצָא אַחֲרוֹן, וְיַעֲקֹב בָּא לְעַכְּבוֹ, שֶׁיְּהֵא רִאשׁוֹן לְלֵדָה כְּרִאשׁוֹן לִיצִירָה, וְיִפְטֹר אֶת רַחְמָהּ וְיִטֹּל אֶת הַבְּכוֹרָה מִן הַדִּין:<br><br><b>בעקב עשו.<\/b> סִימָן שֶׁאֵין זֶה מַסְפִּיק לִגְמֹר מַלְכוּתוֹ עַד שֶׁזֶּה עוֹמֵד וְנוֹטְלָהּ הֵימֶנּוּ:<br><br><b>ויקרא שמו יעקב.<\/b> הַקָּבָּ\"ה; דָּ\"אַ אָבִיו קָרָא לוֹ יַעֲקֹב עַל שֵׁם אֲחִיזַת הֶעָקֵב:<br><br><b>בן ששים שנה.<\/b> י' שָׁנִים מִשֶּׁנְּשָׂאָהּ עַד שֶׁנַּעֲשֵׂית בַּת י\"ג שָׁנָה וּרְאוּיָה לְהֵרָיוֹן, וְי' שָׁנִים הַלָּלוּ צָפָה וְהִִמְתִּין לָהּ, כְּמוֹ שֶׁעָשָׂה אָבִיו לְשָׂרָה; כֵּיוָן שֶׁלֹּא נִתְעַבְּרָה, יָדַע שֶׁהִיא עֲקָרָה, וְהִתְפַּלֵּל עָלֶיהָ (יבמות ס\"ד), וְשִׁפְחָה לֹא רָצָה לִשָּׂא, לְפִי שֶׁנִּתְקַדֵּשׁ בְּהַר הַמּוֹרִיָּה לִהְיוֹת עוֹלָה תְמִימָה:", "rashi_en": "ואחרי כן יצא אחיו וגו AND AFTERWARDS HIS BROTHER CAME OUT, ETC. — I have heard a homiletical midrash that expounds it according to its simple meaning: It was with justice that he was grabbing him to hold him back. Jacob was conceived from the first drop and Esau from the second. Go and learn from a tube with a narrow opening - put in it two stones, one after the other. The one that goes in first will come out last, and the one that goes in last will come out first. It comes out that Esau, who was conceived last, came out first, and Jacob, who was conceived first, came out last. And [so] Jacob came to hold him back, so that the first for birth would be the same as the first for conception; and he would open [his mother's] womb and take the first-born status with justice (see Genesis Rabbah 63:8).  <br><br>בעקב עשו ESAU’S HEEL — a sign that this one (Esau) will hardly have time to complete his period of domination before the other would rise and take it (his power) from him<br><br>ויקרא שמו יעקב AND HE CALLED HIS NAME JACOB — The Holy One, blessed be He, thus named him (Midrash Tanchuma, Shemot 4). [Some versions add: He said to them (to those who gave Esau that name cf. Genesis 5:25): You have given your first-born a name, I, too, will give my son, my firstborn, (cf. Exodus 4:23) a name. That is what is written, “And He called his name, Jacob” (Genesis 26:26).] Another explanation is: his father called him Jacob because he was grasping Esau’s heel.<br><br>בן ששים שנה THREESCORE YEARS OLD — Ten years passed from the time when he married her until she became thirteen years old and capable of child-bearing, and a further ten years he hopefully waited as his father did in regard to Sarah. When even then she did not become with child he realised that she was barren and he prayed for her. But He did not wish to take a maidservant as a second wife because he had been sanctified on Mount Moriah to be a burnt-offering without blemish. "}, {"ch": 25, "v": 27, "aliyah": 1, "heb": "וַֽיִּגְדְּלוּ֙ הַנְּעָרִ֔ים וַיְהִ֣י עֵשָׂ֗ו אִ֛ישׁ יֹדֵ֥עַ צַ֖יִד אִ֣ישׁ שָׂדֶ֑ה וְיַעֲקֹב֙ אִ֣ישׁ תָּ֔ם יֹשֵׁ֖ב אֹהָלִֽים׃", "onk": "וּרְבִיּוּ עוּלֵמַיָּא וַהֲוָה עֵשָׂו <b>גְּבַר נַחְשִׁירְכָן גְּבַר נָפֵק לְחַקְלָא<\/b> וְיַעֲקֹב גְּבַר שְׁלִים <b>מְשַׁמֵּשׁ בֵּית אוּלְפָנָא<\/b>:", "onk_en": "The lads grew up. Eisov became a skilled trapper [<b>an idle man<\/b>], a man of the field [<b>a man going out to the field<\/b>]. Yaakov was a wholesome man, living in tents [<b>serving in the house of study<\/b>].", "pj": "וְרָבִיאוּ טַלְיָא וַהֲוָה עֵשָו גְבַר נַחְשִׁירְכָן לְמִצוֹד עוֹפַן וְחֵיוַון גְבַר נְפִיק חֲקַל קְטֵיל נַפְשִׁין דְהוּא קָטַל יַת נִמְרוֹד וְיַת חֲנוֹךְ בְּרֵיהּ וְיַעֲקב גְבַר שְׁלִים בְּעוֹבָדוֹי וּמְשַׁמֵשׁ בְּבֵית מֶדְרָשָׁא דְעֵבֶר תְּבַע אוּלְפַן מִן קֳדָם יְיָ", "pj_en": "And the lads grew; and Esau was a man of idleness to catch birds and beasts, a man going forth into the field to kill lives, as Nimrod had killed, and Hanok his son. But Jakob was a man peaceful in his words, a minister of the instruction-house of Eber, seeking instruction before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ויגדלו … ויהי עשו.<\/b> כָּל זְמַן שֶׁהָיוּ קְטַנִּים, לֹא הָיוּ נִכָּרִים בְּמַעֲשֵׂיהֶם, וְאֵין אָדָם מְדַקְדֵּק בָּהֶם מַה טִּיבָם; כֵּיוָן שֶׁנַּעֲשׂוּ בְנֵי שְׁלשׁ עֶשְׂרֵה שָׁנָה, זֶה פֵּרֵשׁ לְבָתֵּי מִדְרָשׁוֹת וְזֶה פֵּרֵשׁ לַעֲ\"זָ:<br><br><b>ידע ציד.<\/b> לָצוּד וּלְרַמּוֹת אֶת אָבִיו בְּפִיו וְשׁוֹאֲלוֹ אַבָּא, הַאֵיךְ מְעַשְּׂרִין אֶת הַמֶּלַח וְאֶת הַתֶּבֶן? כַּסָּבוּר אָבִיו שֶׁהוּא מְדַקְדֵּק בְּמִצְוֹת (תנחומא):<br><br><b>איש שדה.<\/b> כְּמַשְׁמָעוֹ, אָדָם בָּטֵל וְצוֹדֶה בְקַשְׁתּוֹ חַיּוֹת וְעוֹפוֹת:<br><br><b>תם.<\/b> אֵינוֹ בָקִי בְכָל אֵלֶּה, כְּלִבּוֹ כֵּן פִּיו, מִי שֶׁאֵינוֹ חָרִיף לְרַמּוֹת קָרוּי תָּם:<br><br><b>ישב אהלים.<\/b> אָהֳלוֹ שֶׁל שֵׁם וְאָהֳלוֹ שֶׁל עֵבֶר:", "rashi_en": "ויגדלו… ויהי עשו AND THEY GREW … AND ESAU WAS — So long as they were young they could not be distinguished by what they did and no one paid much attention to their characters, but when they reached the age of thirteen, one went his way to the houses of learning and the other went his way to the idolatrous temples (Genesis Rabbah 63:10).<br><br>יודע ציד A CUNNING HUNTER literally, understanding hunting — understanding how to entrap and deceive his father with his mouth. He would ask him, “Father how should salt and straw be tithed”? (Genesis Rabbah 63:10) (although he knew full well that these are not subject to the law of tithe). Consequently his father believed him to be very punctilious in observing the divine ordinances.<br><br>איש שדה A MAN OF THE FIELD — Explain it literally (i.e., not in a Midrashic manner): a man without regular occupation, hunting beasts and birds with his bow.<br><br>תם A PLAIN MAN — not expert in all these things: as his heart was his mouth (his thoughts and his words tallied). One who is not ingenious in deceiving people is called תם plain, simple.<br><br>יושב אהלים DWELLING IN TENTS — the tent of Shem and the tent of Eber (Genesis Rabbah 63:10). "}, {"ch": 25, "v": 28, "aliyah": 1, "heb": "וַיֶּאֱהַ֥ב יִצְחָ֛ק אֶת־עֵשָׂ֖ו כִּי־צַ֣יִד בְּפִ֑יו וְרִבְקָ֖ה אֹהֶ֥בֶת אֶֽת־יַעֲקֹֽב׃", "onk": "וּרְחֵם יִצְחָק יָת עֵשָׂו אֲרֵי מִצֵּידֵיהּ הֲוָה אָכִיל וְרִבְקָה רְחֵימַת יָת יַעֲקֹב:", "onk_en": "Yitzchok loved Eisov because he ate of his trappings, but Rivkah loved Yaakov.", "pj": "וְרָחֵים יִצְחָק יַת עֵשָו אֲרוּם מִלֵי רַמְיוּתָא בְּפוּמֵיהּ וְרִבְקָה רְחֵימַת יַת יַעֲקב", "pj_en": "And Izhak loved Esau, for words of deceit were in his mouth; but Rivekah loved Jakob.", "tj": "", "tj_en": "", "rashi": "<b>בפיו.<\/b> כְּתַרְגּוּמוֹ בְּפִיו שֶׁל יִצְחָק. וּמִדְרָשׁוֹ בְּפִיו שֶׁל עֵשָׂו, שֶׁהָיָה צָד אוֹתוֹ וּמְרַמֵּהוּ בִדְבָרָיו:", "rashi_en": "בפיו [THERE WAS HUNTING] IN HIS MOUTH — Understand this as the Targum renders it: in Isaac’s mouth (i. e. Isaac ate the venison he brought home). But its Midrashic explanation is: there was hunting in Esau’s mouth, meaning that he used to entrap and deceive him by his words (Genesis Rabbah 63:10). "}, {"ch": 25, "v": 29, "aliyah": 1, "heb": "וַיָּ֥זֶד יַעֲקֹ֖ב נָזִ֑יד וַיָּבֹ֥א עֵשָׂ֛ו מִן־הַשָּׂדֶ֖ה וְה֥וּא עָיֵֽף׃", "onk": "וּבַשִּׁיל יַעֲקֹב תַּבְשִׁילָא וַאֲתָא (<small>נ\"א <\/small> וְעַל) עֵשָׂו מִן חַקְלָא וְהוּא מְשַׁלְּהֵי:", "onk_en": "Yaakov was simmering a pottage when Eisov came in from the field, exhausted.", "pj": "וּבְהַהוּא יוֹמָא דְמִית אַבְרָהָם בָּשִׁיל יַעֲקב תַּבְשִׁילֵי דִטְלוֹפְחֵי וַאֲזַל לְנַחֲמָא לְאָבוֹי וְאָתָא עֵשָו מִן בָּרָא וְהוּא מְשַׁלְהֵי אֲרוּם חֲמֵשׁ עֲבֵרְיַן עֲבַר בְּהַהוּא יוֹמָא פְּלַח פּוּלְחָנָא נוּכְרָאָה שָׁפַךְ אַדְמָה זַכְיָא וְעָל עַל עוּלֵימְתָּא מְאַרְשָא וְכָּפַר בְּחַיֵי עַלְמָא דְאָתֵי וּבְזָא יַת בְּכֵירוּתָא", "pj_en": "On the day that Abraham died, Jakob dressed pottage of lentiles, and was going to comfort his father. And Esau came from the wilderness, exhausted; for in that day he had committed five transgressions: he had worshipped with strange worship, he had shed innocent blood, he had gone in unto a betrothed damsel, he had denied the life of the world to come, and had despised the birthright.", "tj": "", "tj_en": "", "rashi": "<b>ויזד.<\/b> לְשׁוֹן בִּשּׁוּל, כְּתַרְגּוּמוֹ:<br><br><b>והוא עיף.<\/b> בִּרְצִיחָה, כְּמָה דְּתֵימָא כִּי עָיְפָה נַפְשִׁי לְהֹרְגִים (ירמיהו ד') (בראשית רבה):", "rashi_en": "ויזד means boiling, as the Targum renders it.<br><br>והוא עיף AND HE WAS FAINT through murdering people, just as you mention faintness in connection with murder, (Jeremiah 4:31) ‘‘For my soul fainteth before the murderers” (Genesis Rabbah 63:12)."}, {"ch": 25, "v": 30, "aliyah": 1, "heb": "וַיֹּ֨אמֶר עֵשָׂ֜ו אֶֽל־יַעֲקֹ֗ב הַלְעִיטֵ֤נִי נָא֙ מִן־הָאָדֹ֤ם הָאָדֹם֙ הַזֶּ֔ה כִּ֥י עָיֵ֖ף אָנֹ֑כִי עַל־כֵּ֥ן קָרָֽא־שְׁמ֖וֹ אֱדֽוֹם׃", "onk": "וַאֲמַר עֵשָׂו לְיַעֲקֹב אַטְעֵמְנִי <b>כְעַן<\/b> מִן סִמּוֹקָא סִמּוֹקָא הָדֵין אֲרֵי מְשַׁלְּהֵי אָנָא עַל כֵּן קְרָא שְׁמֵיהּ אֱדוֹם:", "onk_en": "Eisov said to Yaakov, Please [<b>Now<\/b>] give me a swallow of this red [pottage], for I am exhausted. He was therefore named Edom [Red].", "pj": "וַאֲמַר עֵשָו לְיַעֲקב אַטְעִים יָתִי כְּדוֹן מִן תַּבְשִׁילָא סִמוּקָא סִמוּקָא הָדֵין אֲרוּם מְשַׁלְהֵי אֲנָא בְּגִין כֵּן קְרָא שְׁמֵיהּ אֱדוֹם", "pj_en": "And Esau said to Jakob, Let me now taste that red pottage, for I am faint, -- therefore he called his name Edom.", "tj": "", "tj_en": "", "rashi": "<b>הלעיטני.<\/b> אֶפְתַּח פִּי וּשְׁפֹךְ הַרְבֵּה לְתוֹכָהּ, כְּמוֹ שֶׁשָּׁנִינוּ אֵין אוֹבְסִין אֶת הַגָּמָל אֲבָל מַלְעִיטִין אוֹתוֹ:<br><br><b>מן האדם האדם.<\/b> עֲדָשִׁים אֲדֻמּוֹת, וְאוֹתוֹ הַיּוֹם מֵת אַבְרָהָם, שֶׁלֹּא יִרְאֶה אֶת עֵשָׂו בֶּן בְּנוֹ יוֹצֵא לְתַרְבּוּת רָעָה, וְאֵין זוֹ שֵׂיבָה טוֹבָה שֶׁהִבְטִיחוֹ הַקָּבָּ\"ה; לְפִיכָךְ קִצֵּר הַקָּבָּ\"ה ה' שָׁנִים מִשְּׁנוֹתָיו, שֶׁיִּצְחָק חַי ק\"פ שָׁנָה וְזֶה קע\"ה, וּבִשֵּׁל יַעֲקֹב עֲדָשִׁים לְהַבְרוֹת אֶת הָאָבֵל. וְלָמָּה עֲדָשִׁים? שֶׁדּוֹמוֹת לְגַלְגַּל, שֶׁהָאֲבֵלוּת גַּלְגַּל הַחוֹזֵר בָּעוֹלָם (וְעוֹד מָה עֲדָשִׁים אֵין לָהֶם פֶּה, כָּךְ הָאָבֵל אֵין לוֹ פֶה, שֶׁאָסוּר לְדַבֵּר, וּלְפִיכָךְ הַמִּנְהָג לְהַבְרוֹת הָאָבֵל בִּתְחִלַּת מַאֲכָלוֹ בֵּיצִים, שֶׁהֵם עֲגֻלִּים וְאֵין לָהֶם פֶּה, כָּךְ אָבֵל אֵין לוֹ פֶה, כִּדְאָמְרִינַן בְּמוֹעֵד קָטָן (מועד קטן כא:) אָבֵל כָּל שְׁלֹשָׁה יָמִים הָרִאשׁוֹנִים אֵינוֹ מֵשִׁיב שָׁלוֹם לְכָל אָדָם וְכָ\"שֶׁ שֶׁאֵינוֹ שׁוֹאֵל בַּתְּחִלָּה, מִג' וְעַד ז' מֵשִׁיב וְאֵינוֹ שׁוֹאֵל וְכוּ'; בְּרַשִׁ\"י יָשָׁן):", "rashi_en": "הלעיטני LET ME SWALLOW — I will open my mouth and you pour a lot in. The word is really used of feeding animals as we find the word in the Mishna, (Shabbat 155b) “One may not fatten up a camel on the Sabbath but one may put food (מלעיטין) into its mouth. ”<br><br>מן האדם האדם הזה FROM THIS RED, EVEN THIS RED THING —red lentils. On that day Abraham had died in order that he might not see his grandson Esau falling into degenerate ways. This would not have been the “good old age” (cf. 25:8) which God had promised him; therefore the Holy One, blessed be He, cut his life short by five years — for Isaac lived 180 years and he only one hundred and seventy five. Jacob was boiling lentils to provide the customary first meal for the immediate mourners. Why should lentils be the mourner’s food? Because they are round like a wheel and mourning (sorrow) is a wheel that revolves in the world (it touches everyone sooner or later as a revolving wheel touches every spot in turn) (Bava Batra 16b). And a further reason is: just as lentils have no mouth — (the word mouth פה is used in Hebrew of a serrated edge) — so, too, mourners have no mouth (appear dumb), for speech (greeting others) is forbidden to them. For this reason, also, it is customary to give eggs to a mourner as his first meal, because they are round and have no mouth (serrated edge) and similarly a mourner has no mouth (may not greet others), just as we say in Moed Katan 21b. “A mourner during the first three days (of the week of mourning) may not respond to the greeting of any person — it follows, of course, that he may not be the first to greet anyone — and from the third to the seventh day he may respond to a greeting but may not be the first to offer a greeting etc.” From “And a further reason” is to be found in an old Rashi text. "}, {"ch": 25, "v": 31, "aliyah": 1, "heb": "וַיֹּ֖אמֶר יַעֲקֹ֑ב מִכְרָ֥ה כַיּ֛וֹם אֶת־בְּכֹרָתְךָ֖ לִֽי׃", "onk": "וַאֲמַר יַעֲקֹב זַבִּין <b>כְּיוֹם דִּלְהֵן<\/b> יָת בְּכֵרוּתָךְ לִי:", "onk_en": "Yaakov said, As of this day [<b>Like this day<\/b>], sell your birthright to me.", "pj": "וַאֲמַר יַעֲקב זַבִּין יוּמָנָא כְּיוֹם דִאַנְתְּ עָתִיד לְמֵיחְסָן יַת בְּכֵירוּתָךְ לִי", "pj_en": "And Jakob said, Sell today, as (on this very) day, what thou wouldst hereafter appropriate, thy birthright, unto me.", "tj": "", "tj_en": "", "rashi": "<b>מכרה כיום.<\/b> כְּתַרְגּוּמוֹ כְּיוֹם דִּלְהֵן, כַּיּוֹם שֶׁהוּא בָרוּר, כָךְ מְכֹר לִי מְכִירָה בְרוּרָה:<br><br><b>בכרתך.<\/b> לְפִי שֶׁהָעֲבוֹדָה בַּבְּכוֹרוֹת, אָמַר יַעֲקֹב אֵין רָשָׁע זֶה כְדַאי שֶׁיַּקְרִיב לְהַקָּבָּ\"ה:", "rashi_en": "מכרה כיום SELL ME THIS DAY (literally, like the day) — Explain it as the Targum renders it “as this day”: just as this day is certain, so make me a sure sale.<br><br>בכרתך THY BIRTHRIGHT — Because the sacrificial service was then carried out by the first-born sons, Jacob said, “This wicked man is unworthy to sacrifice to the Holy One, blessed be He” (Genesis Rabbah 63:13). "}, {"ch": 25, "v": 32, "aliyah": 1, "heb": "וַיֹּ֣אמֶר עֵשָׂ֔ו הִנֵּ֛ה אָנֹכִ֥י הוֹלֵ֖ךְ לָמ֑וּת וְלָמָּה־זֶּ֥ה לִ֖י בְּכֹרָֽה׃", "onk": "וַאֲמַר עֵשָׂו הָא אֲנָא אָזֵל לִמְמָת וּלְמָה דְּנָן לִי בְּכֵרוּתָא:", "onk_en": "Eisov said, Here I am going to die, what [good] is this birthright to me.", "pj": "וַאֲמַר עֵשָו הָא אֲנָא אַזִיל לִמְמַת וְלֵית אֲנָא חֲיַי תּוּב בְּעָלַם אָחְרַן וְלָמָה דְנַן לִי בְּכֵרוּתָא וְחוּלְקָא בְעָלְמָא דְאַתְּ אָמַר", "pj_en": "And Esau said, Behold, I am going to die, and in another world I shall have no life; and what then to me is the birthright, or the portion in the world of which thou speakest?", "tj": "", "tj_en": "", "rashi": "<b>הנה אנכי הולך למות.<\/b> (מִתְנוֹדֶדֶת וְהוֹלֶכֶת הִיא הַבְּכוֹרָה שֶׁלֹּא תְהֵא כָל עֵת הָעֲבוֹדָה בַּבְּכוֹרוֹת, כִּי שֵׁבֶט לֵוִי יִטֹּל אוֹתָהּ, וְעוֹד) אָמַר עֵשָׂו: מַה טִּיבָהּ שֶׁל עֲבוֹדָה זוֹ? אָמַר לוֹ: כַּמָּה אַזְהָרוֹת וָעֳנָשִׁין וּמִיתוֹת תְּלוּיִין בָּהּ כְּאוֹתָהּ שֶׁשָּׁנִינוּ, אֵלּוּ הֵן שֶׁבְּמִיתָה: שְׁתוּיֵי יַיִן וּפְרוּעֵי רֹאשׁ; אָמַר: אֲנִי הוֹלֵךְ לָמוּת עַל יָדָהּ, אִם כֵּן מַה חֵפֶץ לִי בָהּ?", "rashi_en": "הנה אנכי הולך למות BEHOLD I AM IN PERIL TO DIE — The birthright is something unstable, for not always will the sacrificial duties be performed by the first-born, for the tribe of Levi will assume this. Further Esau said: What is the nature of this Service? Jacob replied, “Many prohibitions and punishments and many acts involving even the punishment of death are associated with it — just as we read in the Mishna, (Sanhedrin 22b): The following priests are liable to death: those who carry out their duties after having drunk too much wine and those who officiate long-haired. He said: If I am going to die through it, why should I desire it."}, {"ch": 25, "v": 33, "aliyah": 1, "heb": "וַיֹּ֣אמֶר יַעֲקֹ֗ב הִשָּׁ֤בְעָה לִּי֙ כַּיּ֔וֹם וַיִּשָּׁבַ֖ע ל֑וֹ וַיִּמְכֹּ֥ר אֶת־בְּכֹרָת֖וֹ לְיַעֲקֹֽב׃", "onk": "וַאֲמַר יַעֲקֹב קַיֵּם לִי כְּיוֹם דִּלְהֵן וְקַיִּים לֵיהּ וְזַבִּין יָת בְּכֵרוּתֵיהּ לְיַעֲקֹב:", "onk_en": "Yaakov said, Swear to me as of this day [<b>like this day<\/b>]. He swore to him, and sold his birthright to Yaakov.", "pj": "וַאֲמַר יַעֲקב קַיֵים לִי כְּיוֹם דֵיהִי וְקַיֵים לֵיהּ וְזַבִּין יַת בְּכֵירוּתֵיהּ לְיַעֲקב", "pj_en": "And Jakob said, Swear to me today that so it shall be. And he sware to him, and sold his birthright to Jakob.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 34, "aliyah": 1, "heb": "וְיַעֲקֹ֞ב נָתַ֣ן לְעֵשָׂ֗ו לֶ֚חֶם וּנְזִ֣יד עֲדָשִׁ֔ים וַיֹּ֣אכַל וַיֵּ֔שְׁתְּ וַיָּ֖קׇם וַיֵּלַ֑ךְ וַיִּ֥בֶז עֵשָׂ֖ו אֶת־הַבְּכֹרָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַעֲקֹב יְהַב לְעֵשָׂו לְחֵם וְתַבְשִׁיל דִּטְלוֹפְחִין וַאֲכַל וּשְׁתִי וְקָם וַאֲזָל וְשָׁט עֵשָׂו יָת בְּכֵרוּתָא:", "onk_en": "Yaakov then gave Eisov bread and a pottage of lentils. He [Eisov] ate and drank, got up and left. [Thus] Eisov scorned the birthright.", "pj": "וְיַעֲקב נָתַן לְעֵשָו לֶחֶם וְתַבְשִׁיל דִטְלוֹפְחִי וְאָכַל וּשְׁתִי וְקָם וַאֲזַל וְשַׁט עֵשָו יַת בְּכֵירוּתָא וְחוֹלַק עַלְמָא דְאָתִי", "pj_en": "And Jakob gave to Esau bread and pottage fo lentiles. And he ate and drank, and arose and went. And Esau scorned the birthright, and the portion of the world that commeth.", "tj": "וְקָם וַאֲזַל וּבְזֵי עֵשָו יַת בְּכוֹרוֹתָא וְאִפַס חוּלְקֵיהּ בְּעַלְמָא דְאָתֵי וְכָפַר בִּתְחִיַית מֵתַיָא:", "tj_en": "And he arose, and went. And Esau despised the birthright, and vilified the portion in the world that cometh, and denied the resurrection of the dead.", "rashi": "<b>ויבז עשו.<\/b> הֵעִיד הַכָּתוּב עַל רִשְׁעוֹ שֶׁבִּזָּה עֲבוֹדָתוֹ שֶׁל מָקוֹם:", "rashi_en": "ויבז עשו THUS ESAU DESPISED—Scripture testifies to his wickedness: that he despised the Service of the Omnipresent!"}, {"ch": 26, "v": 1, "aliyah": 1, "heb": "וַיְהִ֤י רָעָב֙ בָּאָ֔רֶץ מִלְּבַד֙ הָרָעָ֣ב הָרִאשׁ֔וֹן אֲשֶׁ֥ר הָיָ֖ה בִּימֵ֣י אַבְרָהָ֑ם וַיֵּ֧לֶךְ יִצְחָ֛ק אֶל־אֲבִימֶ֥לֶךְ מֶֽלֶךְ־פְּלִשְׁתִּ֖ים גְּרָֽרָה׃", "onk": "וַהֲוָה כַפְנָא בְּאַרְעָא בַּר מִכַּפְנָא קַדְמָאָה דִּי הֲוָה בְּיוֹמֵי אַבְרָהָם וַאֲזַל יִצְחָק לְוַת אֲבִימֶלֶךְ מַלְכָּא דִפְלִשְׁתָּאֵי לִגְרָר:", "onk_en": "There was a famine in the land, aside from the first famine that was in the days of Avraham. Yitzchok went to Avimelech, king of the Philistines, in Gerar.", "pj": "וַהֲוָה כַּפְנָא תַקִיף בְּאַרְעָא דִכְנָעַן בַּר מִכַּפְנָא קַדְמָאָה דַהֲוָה בְּיוֹמוֹי דְאַבְרָהָם וַאֲזַל יִצְחָק לְוַת אֲבִימֶלֶךְ מַלְכָּא דִפְלִישְׁתָּאֵי לִגְרָר", "pj_en": "And there was a mighty famine in the land of Kenaan, besides the former famine which had been in the days of Abraham; and Izhak went to Abimelek king of the Philistaee at Gerar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 2, "aliyah": 1, "heb": "וַיֵּרָ֤א אֵלָיו֙ יְהֹוָ֔ה וַיֹּ֖אמֶר אַל־תֵּרֵ֣ד מִצְרָ֑יְמָה שְׁכֹ֣ן בָּאָ֔רֶץ אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "onk": "<b>וְאִתְגְּלִי<\/b> לֵיהּ יְיָ וַאֲמַר לָא תֵחוֹת לְמִצְרָיִם שְׁרֵי בְאַרְעָא דִּי אֵימַר לָךְ:", "onk_en": "Adonoy appeared [<b>became revealed<\/b>] to him and said, Do not go down to Egypt. Settle in the land that I will make known to you.", "pj": "וַהֲוָה בִּלְבָבֵיהּ דְיִצְחָק לְמֵיחוֹת לְמִצְרַיִם וְאִתְגְלֵי לֵיהּ יְיָ וַאֲמַר לָא תֵיחוּת לְמִצְרַיִם שְׁרֵי בְּאַרְעָא דְאֵימַר לָךְ", "pj_en": "It had been in Izhak's heart to go down to Mizraim; but the Lord appeared to him, and said, Go not down to Mizraim; dwell in the land as I have told thee;", "tj": "", "tj_en": "", "rashi": "<b>אל תרד מצרימה.<\/b> שֶׁהָיָה דַּעְתּוֹ לָרֶדֶת מִצְרַיְמָה, כְּמוֹ שֶׁיָּרַד אָבִיו בִּימֵי הָרָעָב; אָמַר לוֹ: אַל תֵּרֵד מִצְרָיְמָה, שֶׁאַתָּה עוֹלָה תְמִימָה, וְאֵין חוּצָה לָאָרֶץ כְּדַאי לְךָ:", "rashi_en": "אל תרד מצרימה GO NOT DOWN INTO EGYPT — Because he thought of going down to Egypt as his father had gone down in time of famine. He said to him, “Do not go down to Egypt for you are a burnt-offering without blemish and residence outside the Holy Land is not befitting you” (Genesis Rabbah 64:3)."}, {"ch": 26, "v": 3, "aliyah": 1, "heb": "גּ֚וּר בָּאָ֣רֶץ הַזֹּ֔את וְאֶֽהְיֶ֥ה עִמְּךָ֖ וַאֲבָרְכֶ֑ךָּ כִּֽי־לְךָ֣ וּֽלְזַרְעֲךָ֗ אֶתֵּן֙ אֶת־כׇּל־הָֽאֲרָצֹ֣ת הָאֵ֔ל וַהֲקִֽמֹתִי֙ אֶת־הַשְּׁבֻעָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לְאַבְרָהָ֥ם אָבִֽיךָ׃", "onk": "דּוּר בְּאַרְעָא הָדָא <b>וִיהֵי מֵימְרִי בְסַעְדָּךְ וְאֵבָרֵכִנָּךְ<\/b> אֲרֵי לָךְ וְלִבְנָךְ אֶתֵּן יָת כָּל אַרְעָתָא הָאִלֵּין וְאָקֵם יָת קְיָמָא דִּי קַיֵּמִית לְאַבְרָהָם אֲבוּךְ:", "onk_en": "Stay temporarily in this land and I will be with you and bless you [<b>My Word will be your support and I will bless you<\/b>], for to you and your descendants I will give all these lands. I will [thus] keep the oath that I swore to Avraham, your father.", "pj": "דוּר בְּאַרְעָא הֲדָא וִיהֵי מֵימְרִי בְּסַעֲדָךְ וַאֲבָרֵיכִנָךְ אֲרוּם לָךְ וְלִבְנָךְ אֶתֵּן יַת כָּל אַרְעָתָא הָאִלֵין וַאֲקַיֵים יַת קְיָימָא דְקַיֵימִית לְאַבְרָהָם אָבוּךְ", "pj_en": "sojourn in the land, and My Word shall be for thy help, and I will bless thee; for to the end to thy sons will I give all these lands, and I will establish the covenant which I have covenanted with Abraham thy father.", "tj": "", "tj_en": "", "rashi": "<b>האל.<\/b> כְּמוֹ הָאֵלֶּה:", "rashi_en": "האל is the same as האלה THESE. "}, {"ch": 26, "v": 4, "aliyah": 1, "heb": "וְהִרְבֵּיתִ֤י אֶֽת־זַרְעֲךָ֙ כְּכוֹכְבֵ֣י הַשָּׁמַ֔יִם וְנָתַתִּ֣י לְזַרְעֲךָ֔ אֵ֥ת כׇּל־הָאֲרָצֹ֖ת הָאֵ֑ל וְהִתְבָּרְכ֣וּ בְזַרְעֲךָ֔ כֹּ֖ל גּוֹיֵ֥י הָאָֽרֶץ׃", "onk": "וְאַסְגֵּי יָת בְּנָךְ סַגִּיאִין כְּכוֹכְבֵי שְׁמַיָּא וְאֶתֵּן לִבְנָךְ יָת כָּל אַרְעָתָא הָאִלֵּין וְיִתְבָּרְכוּן <b>בְּדִיל<\/b> בְּנָךְ כֹּל עַמְמֵי אַרְעָא:", "onk_en": "I will make your descendants [as numerous] as the stars of the heavens, and I will give your descendants all these lands. Through [<b>Because of<\/b>] your descendants shall be blessed all the nations of the world.", "pj": "וְאַסְגֵי יַת בְּנָךְ הֵי כְּכוֹכְבֵי שְׁמַיָא וְאֶתֵּן לִבְנָךְ יַת כָּל אַרְעָתָא הָאִלֵין וְיִתְבָּרְכוּן בְּגִין בְּנָךְ כָּל עַמְמֵי אַרְעָא", "pj_en": "And I will multiply thy sons as the stars of the heavens, and will give to thy sons all these lands, and through thy sons shall all the nations of the earth be blessed;", "tj": "", "tj_en": "", "rashi": "<b>והתברכו בזרעך.<\/b> אָדָם אוֹמֵר לִבְנוֹ יְהֵא זַרְעֲךָ כְּזַרְעוֹ שֶׁל יִצְחָק, וְכֵן בְּכָל הַמִּקְרָא, וְזֶה אָב לְכֻלָּן בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ וְגוֹ' (בראשית מ״ח:כ׳); וְאַף לְעִנְיַן הַקְּלָלָה מָצִינוּ כֵן וְהָיְתָה הָאִשָּׁה לְאָלָה (במדבר ה'), שֶׁהַמְקַלֵּל שׂוֹנְאוֹ אוֹמֵר תְּהֵא כִּפְלוֹנִית, וְכֵן וְהִנַּחְתֶּם שִׁמְכֶם לִשְׁבוּעָה לִבְחִירַי (ישעיהו ס\"ה), שֶׁהַנִּשְׁבָּע אוֹמֵר אֱהֵא כִפְלוֹנִי אִם עָשִׂיתִי כָּךְ וְכָךְ:", "rashi_en": "והתברכו בזרעך AND IN THY SEED SHALL BLESS THEMSELVES — A man will say to his son, “May your seed be as the seed of Isaac”. Such is the meaning of this phrase wherever it occurs in the entire Scriptures. The following passage is that from which this meaning may be derived for all such passages: (48:20) “By thee shall all Israel bless their children saying, “May God make thee [as Ephraim and Manasseh]”. So, too, in the case of a curse do we find a similar idea: (Numbers 5:27) “And the woman shall become a curse”, meaning that one who curses his enemy will say “May you be like such and such a woman”. Similar, also, is (Isaiah 65:15) “And ye shall leave your name for a curse unto mine elect”, meaning that one who takes an oath will say “May I be like such-and-such a person if I have really done so-and-so”. "}, {"ch": 26, "v": 5, "aliyah": 1, "heb": "עֵ֕קֶב אֲשֶׁר־שָׁמַ֥ע אַבְרָהָ֖ם בְּקֹלִ֑י וַיִּשְׁמֹר֙ מִשְׁמַרְתִּ֔י מִצְוֺתַ֖י חֻקּוֹתַ֥י וְתוֹרֹתָֽי׃", "onk": "חֳלַף דִּי <b>קַבִּיל<\/b> אַבְרָהָם <b>בְּמֵימְרִי<\/b> וּנְטַר מַטְּרַת מֵימְרִי פִּקּוֹדַי קְיָמַי וְאוֹרָיָתָי:", "onk_en": "[All this is] because Avraham listened to [<b>accepted<\/b>] My voice [<b>Word<\/b>], and minded My mandate [<b>the mandate of My Word<\/b>], My commandments, My decrees and My teachings.", "pj": "חוֹלַף דִי קַבֵּיל אַבְרָהָם בְּמֵימְרִי וְנָטַר מַטְרַת מֵימְרִי פִּיקוּדַי קְיָימַי וְאוֹרַיְיתָי", "pj_en": "on account that Abraham obeyed My Word, and kept the keeping of My word, My statutes, My covenants, and My laws.", "tj": "", "tj_en": "", "rashi": "<b>שמע אברהם בקולי.<\/b> כְּשֶׁנִּסִּיתִי אוֹתוֹ:<br><br><b>וישמר משמרתי.<\/b> גְּזֵרוֹת לְהַרְחָקָה עַל הָאַזְהָרוֹת שֶׁבַּתּוֹרָה, כְּגוֹן שְׁנִיּוֹת לָעֲרָיוֹת וּשְׁבוּת לַשַּׁבָּת (יבמות כ\"א):<br><br><b>מצותי.<\/b> דְּבָרִים שֶׁאִלּוּ לֹא נִכְתְּבוּ רְאוּיִן הֵם לְהִצְטַוּוֹת, כְּגוֹן גֶּזֶל וּשְׁפִיכוּת דָּמִים:<br><br><b>חקותי.<\/b> דְּבָרִים שֶׁיֵּצֶר הָרָע וְאֻמּוֹת הָעוֹלָם מְשִׁיבִין עֲלֵיהֶם, כְּגוֹן אֲכִילַת חֲזִיר וּלְבִישַׁת שַׁעַטְנֵז, שֶׁאֵין טַעַם בַּדָּבָר, אֶלָּא גְּזֵרַת הַמֶּלֶךְ וְחֻקּוֹתָיו עַל עֲבָדָיו:<br><br><b>ותורתי.<\/b> לְהָבִיא תּוֹרָה שֶׁבְּעַל פֶּה הֲלָכָה לְמֹשֶׁה מִסִּינַי (בראשית רבה):", "rashi_en": "שמע אברהם בקלי ABRAHAM HEARKENED TO MY VOICE when I put him to the test.<br><br>וישמר משמרתי AND KEPT MY CHARGE — This refers to precautionary measures which are intended to make us avoid the infringement of Biblical prohibitions: such are the Rabbinical inhibition of marriage between relatives in the second degree and the Rabbinical regulations regarding not doing certain acts on the Sabbath (cf. Yevamot 21a).<br><br>מצותי MY COMMANDMENTS — those matters which, had they not been written in the Torah, we would nevertheless hold that they are fitting matters to be the subject of a commandment, such as robbery and murder (cf. Yoma 67b).<br><br>חקותי MY ORDINANCES — matters which our evil inclination and the heathen nations argue against the necessity of prohibiting, such as the eating of swine’s flesh and the wearing of garments made of a mixture of wool and linen — things for which there are no apparent reasons but which are the King’s decrees and enactments imposed on His subjects (Yoma 67b).<br><br>ותורתי AND MY LAWS — The plural serves to include with the written Law also the Oral Law which prescribes commands that are an ancient institution given by God to Moses from Sinai (cf. Genesis Rabbah 64:4)."}, {"ch": 26, "v": 6, "aliyah": 2, "heb": "וַיֵּ֥שֶׁב יִצְחָ֖ק בִּגְרָֽר׃", "onk": "וִיתֵב יִצְחָק בִּגְרָר:", "onk_en": "Yitzchok [thus] settled in Gerar.", "pj": "וְיָתֵיב יִצְחָק בִּגְרָר", "pj_en": "And Izhak dwelt in Gerar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 7, "aliyah": 2, "heb": "וַֽיִּשְׁאֲל֞וּ אַנְשֵׁ֤י הַמָּקוֹם֙ לְאִשְׁתּ֔וֹ וַיֹּ֖אמֶר אֲחֹ֣תִי הִ֑וא כִּ֤י יָרֵא֙ לֵאמֹ֣ר אִשְׁתִּ֔י פֶּן־יַֽהַרְגֻ֜נִי אַנְשֵׁ֤י הַמָּקוֹם֙ עַל־רִבְקָ֔ה כִּֽי־טוֹבַ֥ת מַרְאֶ֖ה הִֽוא׃", "onk": "וּשְׁאִילוּ אֲנָשֵׁי אַתְרָא (<small>ס\"א<\/small> עַל עֵיסַק אִתְּתֵיהּ) לְאִתְּתֵיהּ וַאֲמַר אֲחָתִי הִיא אֲרֵי דְחִיל לְמֵימַר אִתְּתִי דִּלְמָא יִקְטְלֻנַּנִי אֲנָשֵׁי אַתְרָא עַל רִבְקָה אֲרֵי שַׁפִּירַת חֵיזוּ הִיא:", "onk_en": "The local men asked about his wife, and he said, She is my sister. He was afraid to say, [she is] my wife, lest the local men kill me for Rivkah, for she is so good looking.", "pj": "וּשְׁאִילוּ אִינְשֵׁי אַתְרָא עַל אִינְתְּתֵיהּ וַאֲמַר אַחְתִי הִיא אֲרוּם דָחִיל לְמֵימָר לָהּ אִינְתְּתִי אֲרוּם חָשִׁיב בְּלִבֵּיהּ דִלְמָא יִקְטְלוּנַנִי אִינְשֵי אַתְרָא עַל עֵיסַק רִבְקָה אֲרוּם שַׁפִּירָא חֵיזוּ הִיא", "pj_en": "And the man of the place inquired concerning his wife; and he said, She is my sister: for he reasoned in his heart, Lest the men of the place should kill me for Rivekah, because she was of beautiful appearance.", "tj": "", "tj_en": "", "rashi": "<b>לאשתו.<\/b> עַל אִשְׁתּוֹ, כְּמוֹ אִמְרִי לִי אָחִי הוּא (בראשית כ׳:י״ג):", "rashi_en": "לאשתו means CONCERNING HIS WIFE, just as (20:13) “Say about me (לי), He is my brother”."}, {"ch": 26, "v": 8, "aliyah": 2, "heb": "וַיְהִ֗י כִּ֣י אָֽרְכוּ־ל֥וֹ שָׁם֙ הַיָּמִ֔ים וַיַּשְׁקֵ֗ף אֲבִימֶ֙לֶךְ֙ מֶ֣לֶךְ פְּלִשְׁתִּ֔ים בְּעַ֖ד הַֽחַלּ֑וֹן וַיַּ֗רְא וְהִנֵּ֤ה יִצְחָק֙ מְצַחֵ֔ק אֵ֖ת רִבְקָ֥ה אִשְׁתּֽוֹ׃", "onk": "וַהֲוָה כַּד סְגִיאוּ לֵיהּ תַּמָּן יוֹמַיָּא וְאִסְתְּכִי אַבִימֶלֶךְ מַלְכָּא דִפְלִשְׁתָּאֵי מִן חֲרַכָּא וַחֲזָא וְהָא יִצְחָק מְחַיִּיךְ עִם רִבְקָה אִתְּתֵיהּ:", "onk_en": "Once, after [Yitzchok] had been there a long while, Avimelech, king of the Philistines, looked at the window, and he saw, and behold, Yitzchok was amusing himself with Rivkah, his wife.", "pj": "וַהֲוָה כַּד סְגוֹ לֵיהּ תַּמָן יוֹמַיָא לְמִשְׁרֵי וְאוֹדִיק אֲבִימֶלֶךְ מַלְכָּא דִפְלִשְׁתָּאֵי מִן חֲרַכָּא וַחֲמָא וַהֲוָה יִצְחָק חָאִיךְ עִם רִבְקָה אִנְתְּתֵיהּ", "pj_en": "And it was when days had increased to him in abiding there, that Abimelek the king of the Philistaee looked from a window, and beheld, and Izhak was disporting with Rivekah his wife.", "tj": "וְאָדִיק:", "tj_en": "And he looked.", "rashi": "<b>כי ארכו.<\/b> אָמַר, מֵעַתָּה אֵין לִי לִדְאֹג, מֵאַחַר שֶׁלֹּא אֲנָסוּהָ עַד עַכְשָׁו, וְלֹא נִזְהַר לִהְיוֹת נִשְׁמָר:<br><br><b>וישקף אבימלך וגומר.<\/b> רָאָהוּ מְשַׁמֵּשׁ מִטָּתוֹ:", "rashi_en": " <br><br>וישקף אבימלך וגומר AND AVIMELEKH  OBSERVED, ET CETERA — He saw him having sexual relations (Genesis Rabbah 64:5)."}, {"ch": 26, "v": 9, "aliyah": 2, "heb": "וַיִּקְרָ֨א אֲבִימֶ֜לֶךְ לְיִצְחָ֗ק וַיֹּ֙אמֶר֙ אַ֣ךְ הִנֵּ֤ה אִשְׁתְּךָ֙ הִ֔וא וְאֵ֥יךְ אָמַ֖רְתָּ אֲחֹ֣תִי הִ֑וא וַיֹּ֤אמֶר אֵלָיו֙ יִצְחָ֔ק כִּ֣י אָמַ֔רְתִּי פֶּן־אָמ֖וּת עָלֶֽיהָ׃", "onk": "וּקְרָא אֲבִימֶלֶךְ לְיִצְחָק וַאֲמַר בְּרַם הָא אִתְּתָךְ הִיא וְאֶכְדֵּין אֲמַרְתָּ אֲחָתִי הִיא וַאֲמַר לֵיהּ יִצְחָק אֲרֵי אֲמָרִית דִּלְמָא אֵימוּת עֲלַהּ:", "onk_en": "Avimelech called Yitzchok and he said, But she is your wife. How could you have said, She is my sister? Yitzchok said to him, Because I said, I might die because of her.", "pj": "וּקְרָא אֲבִימֶלֶךְ לְיִצְחָק וַאֲמַר בְּרַם הָא אִנְתְּתָךְ הִיא וְהֵיכְדֵין אָמַרְתְּ אֲחָתִי הִיא וַאֲמַר לֵיהּ יִצְחָק אֲרוּם אֲמָרִית בִּלְבָבִי דִלְמָא אִתְקְטֵיל בְּגִינָהּ", "pj_en": "And Abimelek called Izhak, and said, Nevertheless she is thy wife; and why hast thou said, She is my sister? And Izhak answered him, Because I said in my heart, Lest they kill me on her account.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 10, "aliyah": 2, "heb": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ מַה־זֹּ֖את עָשִׂ֣יתָ לָּ֑נוּ כִּ֠מְעַ֠ט שָׁכַ֞ב אַחַ֤ד הָעָם֙ אֶת־אִשְׁתֶּ֔ךָ וְהֵבֵאתָ֥ עָלֵ֖ינוּ אָשָֽׁם׃", "onk": "וַאֲמַר אֲבִימֶלֶךְ מָה דָּא עֲבַדְתָּ לָנָא כִּזְעֵר פּוֹן שָׁכִיב <b>דִּמְיָחֵד בְּעַמָּא<\/b> עִם אִתְּתָךְ וְאַיְתֵיתָא עֲלָנָא חוֹבָא:", "onk_en": "Avimelech said, What have you done to us? One of the people [<b>The unique one among the people<\/b>] could have easily slept with your wife, and you would have brought guilt upon us.", "pj": "וַאֲמַר אֲבִימֶלֶךְ מָא דָא עָבַדְתְּ לָנָא כִּזְעֵיר פּוֹן שְׁכִיב מַלְכָּא דְמֵיחַד בְּעַמָא עִם אִנְתְּתָךְ וְאַיְיתֵיתָא עִלָנָא חוֹבָא", "pj_en": "And Abimelek said, Why hast thou done this to us? It might have been that the king, who is the principal of the people, had lain with thy wife, and thou wouldst have brought guilt upon us.", "tj": "וַאֲמַר אֲבִימֶלֶךְ מַה הוּא דָא דַעֲבַדְתָּא לָן הָא קָלֵיל זְעֵיר אִילוּ שִׁימֵשׁ חָד טַלְיָא עִם אִתְּתָךְ וַהֲוֵית מַיְיתִית עַלָנָא חוֹבָא רַבָּא:", "tj_en": "And Abimelek said to him, What is this that thou hast done to us? Very possibly might one of the young men have lain with thy wife, and there would have been great guilt brought upon us.", "rashi": "<b>אחד העם.<\/b> הַמְיֻחָד בָּעָם, זֶה הַמֶּלֶךְ:<br><br><b>והבאת עלינו אשם.<\/b> אִם שָׁכַב כְּבָר, הֵבֵאתָ עָלֵינוּ אָשָׁם:", "rashi_en": "אחד העם ONE OF THE PEOPLE — the one singled out from the people — viz., the king (cf. Targum).<br><br>והבאת עלינו אשם AND YOU WOULD HAVE BROUGHT GUILT UPON US — If he had lain with her already, YOU WOULD HAVE BROUGHT GUILT UPON US."}, {"ch": 26, "v": 11, "aliyah": 2, "heb": "וַיְצַ֣ו אֲבִימֶ֔לֶךְ אֶת־כׇּל־הָעָ֖ם לֵאמֹ֑ר הַנֹּגֵ֜עַ בָּאִ֥ישׁ הַזֶּ֛ה וּבְאִשְׁתּ֖וֹ מ֥וֹת יוּמָֽת׃", "onk": "וּפַקִּיד אֲבִימֶלֶךְ יָת כָּל עַמָּא לְמֵימָר <b>דְּיַנְזֵק<\/b> בְּגַבְרָא הָדֵין וּבְאִתְּתֵיהּ אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Avimelech [then] commanded all his people, saying, Whoever touches [<b>injures<\/b>] this man or his wife, shall die.", "pj": "וּפְקִיד אֲבִימֶלֶךְ יַת כָּל עַמָא לְמֵימַר דְיִקְרַב לְבִישׁ בְּגַבְרָא הָדֵין וּבְאִנְתְּתֵיהּ אִתְקְטָלָא יִתְקְטֵל", "pj_en": "And Abimelek instructed all the people, Whoever shall go near to injure this man or his wife, shall verily be put to death.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 12, "aliyah": 2, "heb": "וַיִּזְרַ֤ע יִצְחָק֙ בָּאָ֣רֶץ הַהִ֔וא וַיִּמְצָ֛א בַּשָּׁנָ֥ה הַהִ֖וא מֵאָ֣ה שְׁעָרִ֑ים וַֽיְבָרְכֵ֖הוּ יְהֹוָֽה׃", "onk": "וּזְרַע יִצְחָק בְּאַרְעָא הַהִיא וְאַשְׁכַּח בְּשַׁתָּא הַהִיא עַל חַד מְאָה <b>בִדְשַׁעֲרוֹהִי<\/b> וּבָרְכֵיהּ יְיָ:", "onk_en": "Yitzchok planted in that land, and in that year he reaped a hundred fold [<b>more than that which they estimated<\/b>], for Adonoy had blessed him.", "pj": "וּזְרַע יִצְחָק לִצְדַקְתָּא בְּאַרְעָא הַהוּא וְאַשְׁכַּח בְּשַׁתָּא הַהוּא עַל חַד מְאָה בִּדְשַׁעֲרוֹי וּבָרְכֵיהּ יְיָ", "pj_en": "And Izhak sowed unto righteousness in that land, and found in that year a hundred for one, according to his measure. And the Lord blessed him,", "tj": "", "tj_en": "", "rashi": "<b>בארץ ההוא.<\/b> אַעַ\"פִּ שֶׁאֵינוֹ חֲשׁוּבָה כְּאֶרֶץ יִשְׂרָאֵל עַצְמָהּ, כְּאֶרֶץ שִׁבְעָה גוֹיִם (בראשית רבה):<br><br><b>בשנה ההיא.<\/b> אַעַ\"פִּ שֶׁאֵינָהּ כְּתִקְנָהּ, שֶׁהָיְתָה שְׁנַת רְעָבוֹן (בראשית רבה):<br><br><b>בארץ ההיא בשנה ההיא.<\/b> שְׁנֵיהֶם לָמָּה? לוֹמַר, שֶׁהָאָרֶץ קָשָׁה וְהַשָּׁנָה קָשָׁה:<br><br><b>מאה שערים.<\/b> שֶׁאֲמָדוּהָ כַּמָּה רְאוּיָה לַעֲשׂוֹת, וְעָשְׂתָה עַל אַחַת שֶׁאֲמָדוּהָ מֵאָה. וְרַבּוֹתֵינוּ אָמְרוּ אֹמֶד זֶה לְמַעַשְׂרוֹת הָיָה:", "rashi_en": "בארץ ההוא IN THAT LAND although it (Gerar) had not the sacred importance of Erez Yisroel proper — i. e., as the territory of the seven nations, and is therefore not as fertile as the Holy Land (cf. Ketubot 112a).<br><br>בשנה ההיא IN THAT YEAR although it was not a normal year, being a year of famine.<br><br>בארץ ההיה בשנה ההיא  In that land and in that year. — Why is there mention of the two — that land and that year? To tell you that that soil was hard and that year was a hard one (Genesis Rabbah 64:6).<br><br>מאה שערים AN HUNDREDFOLD — for they had estimated how much it should have yielded and it yielded one hundred for every measure which they had estimated. Our Rabbis said that the estimate was made for the purpose of the tithe (Genesis Rabbah 64:6)."}, {"ch": 26, "v": 13, "aliyah": 3, "heb": "וַיִּגְדַּ֖ל הָאִ֑ישׁ וַיֵּ֤לֶךְ הָלוֹךְ֙ וְגָדֵ֔ל עַ֥ד כִּֽי־גָדַ֖ל מְאֹֽד׃", "onk": "וּרְבָא גַבְרָא וַאֲזַל אֲזִיל (<small>נ\"א<\/small> סָגֵי) <b>וְרָבֵי<\/b> עַד דִּי רְבָא לַחֲדָא:", "onk_en": "The man prospered. He continued to prosper [<b>and increase<\/b>] until he became very great.", "pj": "וּרְבָא גַבְרָא וְאָזַל אָזֵיל וּרְבֵי עַד דִי רַבָּא לַחֲדָא", "pj_en": "and the man increased, and went forward increasing until he was very great.", "tj": "", "tj_en": "", "rashi": "<b>כי גדל מאוד.<\/b> שֶׁהָיוּ אוֹמְרִים זֶבֶל פִּרְדּוֹתָיו שֶׁל יִצְחָק וְלֹא כַסְפּוֹ וּזְהָבוֹ שֶׁל אֲבִימֶלֶךְ (בראשית רבה):", "rashi_en": "כי גדל מאד UNTIL HE BECAME VERY GREAT — so that people used to say, “Rather the dung of Isaac’s mules than all Abimelech’s gold and silver’’(Genesis Rabbah 64:7). "}, {"ch": 26, "v": 14, "aliyah": 3, "heb": "וַֽיְהִי־ל֤וֹ מִקְנֵה־צֹאן֙ וּמִקְנֵ֣ה בָקָ֔ר וַעֲבֻדָּ֖ה רַבָּ֑ה וַיְקַנְא֥וּ אֹת֖וֹ פְּלִשְׁתִּֽים׃", "onk": "וַהֲוָה לֵיהּ גֵּיתֵי עָנָא וְגֵיתֵי תוֹרִין וּפָלְחָנָא (<small>נ\"א<\/small> וַעֲבוּדָה) סַגְיָא וְקַנִּיאוּ בֵיהּ פְּלִשְׁתָּאֵי:", "onk_en": "He owned flocks of sheep, herds of cattle, and many slaves, and the Philistines were jealous of him.", "pj": "וַהֲווֹ לֵיהּ גֵיתֵי עָאן תוֹרִין וּפוּלְחָנָא סַגִיאָה וְקַנִיאוּ יָתֵיהּ פְּלִשְׁתָּאֵי", "pj_en": "And he had flocks of sheep, and herds of cattle, and great cultivation; and the Philistaee envied him.", "tj": "", "tj_en": "", "rashi": "<b>ועבדה רבה.<\/b> פְּעֻלָּה רַבָּה בִּלְשׁוֹן לע\"ז אוברי\"נא, עֲבוֹדָה מַשְׁמָע עֲבוֹדָה אַחַת; עֲבֻדָּה מַשְׁמָע פְּעֻלָּה רַבָּה:", "rashi_en": "וְעֲבֻדָּה רבה means a great many things to do (i. e. great undertakings) O. F. ouvraine. The word עֲבוׂדָה denotes one thing to be done whereas עֲבֻדָּה denotes many things to be done (a collective noun)"}, {"ch": 26, "v": 15, "aliyah": 3, "heb": "וְכׇל־הַבְּאֵרֹ֗ת אֲשֶׁ֤ר חָֽפְרוּ֙ עַבְדֵ֣י אָבִ֔יו בִּימֵ֖י אַבְרָהָ֣ם אָבִ֑יו סִתְּמ֣וּם פְּלִשְׁתִּ֔ים וַיְמַלְא֖וּם עָפָֽר׃", "onk": "וְכָל בֵּירִין דִּי חֲפָרוּ עַבְדֵי אֲבוּהִי בְּיוֹמֵי אַבְרָהָם אֲבוּהִי טַמּוֹנוּן פְּלִשְׁתָּאֵי וּמְלֹּאנוּן עַפְרָא:", "onk_en": "All the wells that his father’s servants had dug in the days of his father, Avraham—the Philistines plugged them, and filled them with earth.", "pj": "וְכָל בֵּירִין דַחֲפָרוּ עַבְדֵי אָבוֹי בְּיוֹמֵי אַבְרָהָם אָבוֹי טְמוּנִינוּן פְּלִשְׁתָּאֵי וּמְלוֹנוּן עַפְרָא", "pj_en": "And all the wells which the servants of his father had digged in the days of Abraham his father, the Philistaee stopped up and filled with earth.", "tj": "", "tj_en": "", "rashi": "<b>סתמום פלשתים.<\/b> מִפְּנֵי שֶׁאָמְרוּ תַּקָּלָה הֵם לָנוּ מִפְּנֵי הַגְּיָסוֹת הַבָּאוֹת עָלֵינוּ, טַמּוֹנוּן פְּלִשְׁתָּאֵי לְשׁוֹן סְתִימָה, וּבִלְשׁוֹן הַתַּלְמוּד מְטַמְטֵם אֶת הַלֵּב:", "rashi_en": "סתמום פלשתים THE PHILISTINES STOPPED THEM, saying, “They may become a source of danger to us because of marauding troops that may invade us” (i.e.,they may invade our country to obtain possession of the wells, or if they invade us for any other reason they will be able to find a supply of water). (Tosafot Sotah 10.) The rendering of the Targum טמונין means “stopping up” and we find it in the language of the Talmud (Pesachim 42a) “Chokes up (מטמטם) the heart”. "}, {"ch": 26, "v": 16, "aliyah": 3, "heb": "וַיֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל־יִצְחָ֑ק לֵ֚ךְ מֵֽעִמָּ֔נוּ כִּֽי־עָצַ֥מְתָּ מִמֶּ֖נּוּ מְאֹֽד׃", "onk": "וַאֲמַר אֲבִימֶלֶךְ לְיִצְחָק אִזֵּל מֵעִמָּנָא אֲרֵי תְקֵפְתָּא מִנָּנָא לַחֲדָא:", "onk_en": "Avimelech said to Yitzchok, Go away from us. You have become much more powerful than us.", "pj": "וַאֲמַר אֲבִימֶלֶךְ לְיִצְחָק אִיזֵל מֵעִמָנָא אֲרֵי תַקִיפְתָּא מִינָנָא בְּנִיכְסִין לַחֲדָא", "pj_en": "And Abimelek said to Izhak, Go from us; for thou art stronger than we in riches very much.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 17, "aliyah": 3, "heb": "וַיֵּ֥לֶךְ מִשָּׁ֖ם יִצְחָ֑ק וַיִּ֥חַן בְּנַֽחַל־גְּרָ֖ר וַיֵּ֥שֶׁב שָֽׁם׃", "onk": "וַאֲזַל מִתַּמָּן יִצְחָק וּשְׁרָא בְנַחֲלָא דִגְרָר וִיתֵב תַּמָּן:", "onk_en": "Yitzchok went away from there. He camped in the valley of Gerar and settled there.", "pj": "וַאֲזַל מִתַּמָן יִצְחָק וּשְׁרָא בְּנַחֲלָא דִגְרָר וְיָתֵב תַּמָן", "pj_en": "And Izhak went thence, and sojourned in the vale of Gerar, and dwelt there.", "tj": "", "tj_en": "", "rashi": "<b>בנחל גרר.<\/b> רָחוֹק מִן הָעִיר:", "rashi_en": "בנחל גרר IN THE VALLEY OF GERAR — far away from the city. "}, {"ch": 26, "v": 18, "aliyah": 3, "heb": "וַיָּ֨שׇׁב יִצְחָ֜ק וַיַּחְפֹּ֣ר&thinsp;<b>׀<\/b> אֶת־בְּאֵרֹ֣ת הַמַּ֗יִם אֲשֶׁ֤ר חָֽפְרוּ֙ בִּימֵי֙ אַבְרָהָ֣ם אָבִ֔יו וַיְסַתְּמ֣וּם פְּלִשְׁתִּ֔ים אַחֲרֵ֖י מ֣וֹת אַבְרָהָ֑ם וַיִּקְרָ֤א לָהֶן֙ שֵׁמ֔וֹת כַּשֵּׁמֹ֕ת אֲשֶׁר־קָרָ֥א לָהֶ֖ן אָבִֽיו׃", "onk": "וְתָב יִצְחָק וְחָפַר יָת בֵּירֵי דְמַיָּא דִּי חֲפָרוּ בְּיוֹמֵי אַבְרָהָם אֲבוּהִי וְטַמּוֹנוּן פְּלִשְׁתָּאֵי בָּתַר דְּמִית אַבְרָהָם וּקְרָא לְהֵן שְׁמָהָן כִּשְׁמָהָן דִּי הֲוָה קָרֵי לְהֵן אֲבוּהִי:", "onk_en": "Yitzchok returned and excavated the wells of water which were dug in the days of his father, Avraham, and were plugged by the Philistines after Avraham’s death. He gave them the same names that his father had given them.", "pj": "וְתַב יִצְחָק וַחֲפַר יַת בֵּירִין דְמוֹי דִי חֲפָרוּ עַבְדֵי אָבוֹי בְּיוֹמֵי אַבְרָהָם אָבוֹי וּטְמוּנִינוּן פְּלִשְׁתָּאֵי בָּתַר דְמִית אַבְרָהָם וּקְרָא לְהוֹן שְׁמָהָן הֵי כִּשְׁמָהָן דִי הֲוָה קָרֵי לְהוֹן אָבוֹי", "pj_en": "And Izhak digged again the wells of water which the servants of his father had digged in the days of Abraham his father, and which the Philistaee had stopped after Abraham was dead; and he called them by the names his father had called them.", "tj": "", "tj_en": "", "rashi": "<b>וישב ויחפר.<\/b> הַבְּאֵרוֹת אֲשֶׁר חָפְרוּ בִּימֵי אַבְרָהָם אָבִיו וּפְלִשְׁתִּים סִתְּמוּם, מִקֹּדֶם שֶׁנָּסַע יִצְחָק מִגְּרָר, חָזַר וַחֲפָרָן:", "rashi_en": "וישב ויחפר AND ISAAC DIGGED AGAIN — those wells which they had dug in the days of his father Abraham and which the Philistines had stopped up before Isaac left Gerar he once again dug. "}, {"ch": 26, "v": 19, "aliyah": 3, "heb": "וַיַּחְפְּר֥וּ עַבְדֵֽי־יִצְחָ֖ק בַּנָּ֑חַל וַיִּ֨מְצְאוּ־שָׁ֔ם בְּאֵ֖ר מַ֥יִם חַיִּֽים׃", "onk": "וַחֲפָרוּ עַבְדֵי יִצְחָק בְּנַחֲלָא וְאַשְׁכָּחוּ תַמָּן בֵּירָא דְּמַיִּין <b>נָבְעִין<\/b>:", "onk_en": "Yitzchok’s servants dug in the valley and found there a well of spring [<b>flowing<\/b>] water.", "pj": "וַחֲפָרוּ עַבְדֵי יִצְחָק בִּסְפַר נַחְלָא וְאַשְׁכְּחוּ תַמָן בִּיר מוֹי נַבְעִין", "pj_en": "And the servants of Izhak digged in the border of the vale, and found there a well of flowing water.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 20, "aliyah": 3, "heb": "וַיָּרִ֜יבוּ רֹעֵ֣י גְרָ֗ר עִם־רֹעֵ֥י יִצְחָ֛ק לֵאמֹ֖ר לָ֣נוּ הַמָּ֑יִם וַיִּקְרָ֤א שֵֽׁם־הַבְּאֵר֙ עֵ֔שֶׂק כִּ֥י הִֽתְעַשְּׂק֖וּ עִמּֽוֹ׃", "onk": "וּנְצוֹ רַעֲוָתָא דִגְרָר עִם רַעֲוָתָא דְיִצְחָק לְמֵימַר דִּי לָנָא מַיָּא וּקְרָא שְׁמָא דְבֵירָא עִסְקָא אֲרֵי אִתְעַסִּיקוּ עִמֵּיהּ:", "onk_en": "The shepherds of Gerar argued with the shepherds of Yitzchok, saying, the water is ours. He named the well Eisek [Quarrel], because they had quarreled with him.", "pj": "וּנְצוֹ רַעֲוָותָא דִגְרָר עִם רַעֲוָותָא דְיִצְחָק לְמֵימַר דִי לָנָא מַיָא וַהֲוָה צְבוּ מִן שְׁמַיָא וִיבֵישַׁת וּבְכֵן אַהֲדָרוּ יָתָהּ לְיִצְחָק וְנָבְעַת וּקְרָא שְׁמָא דְבֵירָא עֵסֶק אֲרוּם אִתְעַסְקוּ עֲלָהּ עִמֵיהּ", "pj_en": "And the shepherds of Gerar contended with Izhak's shepherds, saying, The water is ours. And it was the will of Heaven, and it dried. But when they returned to Izhak, it flowed. And he called the name of the well (Esek) Contention, because (etheseku) they had quarrelled with him on account of it.", "tj": "", "tj_en": "", "rashi": "<b>עשק.<\/b> עִרְעוּר:<br><br><b>כי התעשקו עמו.<\/b> נִתְעַשְּׂקוּ עִמּוֹ עָלֶיהָ בִּמְרִיבָה וְעִרְעוּר:", "rashi_en": "עשק means DISPUTE.<br><br>כי התעשקו עמו means THEY ENGAGED WITH HIM about it in strife and DISPUTE."}, {"ch": 26, "v": 21, "aliyah": 3, "heb": "וַֽיַּחְפְּרוּ֙ בְּאֵ֣ר אַחֶ֔רֶת וַיָּרִ֖יבוּ גַּם־עָלֶ֑יהָ וַיִּקְרָ֥א שְׁמָ֖הּ שִׂטְנָֽה׃", "onk": "וַחֲפָרוּ בֵּירָא אָחֳרִי וּנְצוֹ אַף עֲלַהּ וּקְרָא שְׁמַהּ שִׂטְנָה:", "onk_en": "They dug another well and they also argued about it. He named the well Sitnah [Obstruction].", "pj": "וַחֲפָרוּ בִּיר אוֹחֲרֵי וּנְצוֹ אוּף עֲלָהּ וִיבֵשַׁת וְתוּ לָא נַבְעַת וּקְרָא שְׁמָהּ שִטְנָה", "pj_en": "And they digged another well; and they contended for it also; and it dried, and did not flow again. And he called the name of it (Sitnah) Accusation.", "tj": "", "tj_en": "", "rashi": "<b>שטנה.<\/b> נושימנ\"ט:", "rashi_en": "שטנה old French nuisement; English hindrance."}, {"ch": 26, "v": 22, "aliyah": 3, "heb": "וַיַּעְתֵּ֣ק מִשָּׁ֗ם וַיַּחְפֹּר֙ בְּאֵ֣ר אַחֶ֔רֶת וְלֹ֥א רָב֖וּ עָלֶ֑יהָ וַיִּקְרָ֤א שְׁמָהּ֙ רְחֹב֔וֹת וַיֹּ֗אמֶר כִּֽי־עַתָּ֞ה הִרְחִ֧יב יְהֹוָ֛ה לָ֖נוּ וּפָרִ֥ינוּ בָאָֽרֶץ׃", "onk": "וְאִסְתַּלַּק מִתַּמָּן וַחֲפַר בֵּירָא אָחֳרִי וְלָא נְצוֹ עֲלַהּ וּקְרָא שְׁמַהּ רְחֹבוֹת וַאֲמַר אֲרֵי כְעַן אַפְתֵּי יְיָ לָנָא וְנִיפּוּשׁ (<small>נ\"א<\/small> וְיַפְשִׁנָּנָא) בְּאַרְעָא:", "onk_en": "He moved away from there and he dug another well, and there was no argument over it. He named it Rechovos [Wide Spaces], and said, For now Adonoy has made room for us, and we shall be fruitful in the land.", "pj": "וְאִסְתַּלֵק מִתַּמָן וַחֲפַר בִּיר אוֹחֲרִי וְלָא נִצוּ עֲלָהּ הֵי כְּקַדְמָאֵי וּקְרָא שְׁמָהּ רַוְוחָתָא וְאָמַר אֲרוּם כְּדוּן אַרְוַוח יְיָ לָנָא וְיַפְשִׁנָנָא בְּאַרְעָא", "pj_en": "And he removed from thence and digged another well, and for that they did not contend as formerly, and he called the name of it (Ravchatha) Spaciousness; for he said, Now hath the Lord given us space to spread us abroad in the land.", "tj": "", "tj_en": "", "rashi": "<b>ופרינו בארץ.<\/b> כְּתַרְגּוּמוֹ וְנֵיפוּשׁ בְּאַרְעָא:", "rashi_en": "ופרינו בארץ WE SHALL BE FRUITFUL IN THE LAND — as the Targum translates it וניפוש and we shall increase in the land). "}, {"ch": 26, "v": 23, "aliyah": 4, "heb": "וַיַּ֥עַל מִשָּׁ֖ם בְּאֵ֥ר שָֽׁבַע׃", "onk": "וְאִסְתַּלַּק מִתַּמָּן בְּאֵר שָׁבַע:", "onk_en": "From there he went to Beer Sheva.", "pj": "וּסְלִיק מִתַּמָן לְבֵירָא דְשָׁבַע", "pj_en": "And he went up from thence unto Beersheba.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 24, "aliyah": 4, "heb": "וַיֵּרָ֨א אֵלָ֤יו יְהֹוָה֙ בַּלַּ֣יְלָה הַה֔וּא וַיֹּ֕אמֶר אָנֹכִ֕י אֱלֹהֵ֖י אַבְרָהָ֣ם אָבִ֑יךָ אַל־תִּירָא֙ כִּֽי־אִתְּךָ֣ אָנֹ֔כִי וּבֵֽרַכְתִּ֙יךָ֙ וְהִרְבֵּיתִ֣י אֶֽת־זַרְעֲךָ֔ בַּעֲב֖וּר אַבְרָהָ֥ם עַבְדִּֽי׃", "onk": "<b>וְאִתְגְּלִי<\/b> לֵיהּ יְיָ בְּלֵילְיָא הַהוּא וַאֲמַר אֲנָא אֱלָהֵהּ דְּאַבְרָהָם אֲבוּךְ לָא תִדְחַל אֲרֵי <b>בְסַעְדָּךְ מֵימְרִי<\/b> וֶאֱבָרֵכִנָּךְ וְאַסְגֵּי יָת בְּנָךְ בְּדִיל אַבְרָהָם עַבְדִּי:", "onk_en": "Adonoy appeared [<b>became revealed<\/b>] to him that night and said, I am the God of your father, Avraham. Do not fear for I am with you [<b>My Word is your support<\/b>]. I will bless you and make your descendants numerous, because of My servant, Avraham.", "pj": "וְאִתְגְלֵי לֵיהּ יְיָ בְּלֵילָא הַהוּא וַאֲמַר אֲנָא אֱלָהָא דְאַבְרָהָם אָבוּךְ לָא תִדְחַל אֲרוּם בְּסַעֲדָךְ מֵימְרִי וַאֲבָרְכִנָךְ וְאַסְגֵי יַת בְּנָךְ בְּגִין זַכְוָותָא דְאַבְרָהָם עַבְדִי", "pj_en": "And the Lord appeared to him that night, and said, I am the God of Abraham thy father: fear not; for My Word is for thy help, and I will bless thee, and multiply thy sons for the righteousness' sake of Abraham My servant.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 25, "aliyah": 4, "heb": "וַיִּ֧בֶן שָׁ֣ם מִזְבֵּ֗חַ וַיִּקְרָא֙ בְּשֵׁ֣ם יְהֹוָ֔ה וַיֶּט־שָׁ֖ם אׇהֳל֑וֹ וַיִּכְרוּ־שָׁ֥ם עַבְדֵי־יִצְחָ֖ק בְּאֵֽר׃", "onk": "וּבְנָא תַמָּן מַדְבְּחָא <b>וְצַלִּי בִּ<\/b>שְׁמָא דַיְיָ וּפְרַס תַּמָּן מַשְׁכְּנֵיהּ וּכְרוֹ תַמָּן עַבְדֵי יִצְחָק בֵּירָא:", "onk_en": "He [Yitzchok] built an altar there, and proclaimed [<b>prayed in<\/b>] the Name of Adonoy. He set up his tent there, and Yitzchok’s servants dug a well there.", "pj": "וּבְנָא תַמָן מַדְבְּחָא וְצַלֵי בִּשְׁמָא דַיְיָ וּפְרַס תַּמָן מַשְׁכְּנֵיהּ וַחֲפָסוּ תַּמָן עַבְדֵי יִצְחָק בֵּירָא", "pj_en": "And he builded there an altar, and prayed in the name of the Lord. And he spread his tabernacle there, and the servants of Izhak digged there a well.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 26, "aliyah": 4, "heb": "וַאֲבִימֶ֕לֶךְ הָלַ֥ךְ אֵלָ֖יו מִגְּרָ֑ר וַאֲחֻזַּת֙ מֵֽרֵעֵ֔הוּ וּפִיכֹ֖ל שַׂר־צְבָאֽוֹ׃", "onk": "וַאֲבִימֶלֶךְ אֲזַל לְוָתֵיהּ מִגְּרָר וְסִיעַת מְרַחֲמוֹהִי וּפִיכֹל רַב חֵילֵיהּ:", "onk_en": "Avimelech came to Yitzchok from Gerar along with a group of friends and Pichol, his general.", "pj": "וְכַד נְפַק יִצְחָק מִגְרָר אִתְיַבְּשָׁן בֵּירֵיהוֹן וְאִילָנֵיהוֹן לָא עָבְדוּ פֵירִין וְאַרְגִישׁוּ דִבְגִין דְתָרִיכוּ יָתֵיהּ הֲוָה לְהוֹן כָּל דָא וְאָזַל אֲבִימֶלֶךְ לְוָותֵיהּ מִגְרָר וְאַתְקֵיף בְּרַחֲמוֹי לְמֵיזַל עִמֵיהּ וּפִכל רַב חֵילֵיהּ", "pj_en": "And when Izhak went forth from Gerar the wells dried up, and the trees made no fruit; and they felt that it was because they had driven him away, all these things had befallen them. And Abimelek went to him from Gerar, and took his friends to go with him, and Phikol the chief of his host.", "tj": "", "tj_en": "", "rashi": "<b>ואחזת מרעהו.<\/b> כְּתַרְגּוּמוֹ וְסִיעַת מֵרַחֲמוֹהִי, סִיעַת מֵאוֹהֲבָיו. וְיֵשׁ פּוֹתְרִין מֵרֵעֵהוּ מ' מִיסוֹד הַתֵּבָה, כְּמוֹ שְׁלֹשִׁים מֵרֵעִים דְּשִׁמְשׁוֹן, כְּדֵי שֶׁתִּהְיֶה תֵּבַת וַאֲחֻזַּת דְּבוּקָה; אֲבָל אֵין דֶּרֶךְ אֶרֶץ לְדַבֵּר עַל הַמַּלְכוּת כֵּן, סִיעַת אוֹהֲבָיו, שֶׁאִם כֵּן, כָּל סִיעַת אוֹהֲבָיו הוֹלִיךְ עִמּוֹ, וְלֹא הָיָה לוֹ אֶלָּא סִיעָה אַחַת שֶׁל אוֹהֲבִים – לָכֵן יֵשׁ לְפָתְרוֹ בַּלָּשׁוֹן הָרִאשׁוֹן; וְאַל תִּתְמַהּ עַל תָּי\"ו שֶׁל אֲחֻזַּת וְאַעַ\"פִּ שֶׁאֵין תֵּבָה סְמוּכָה, יֵשׁ דֻּגְמָתָהּ בַּמִּקְרָא עֶזְרָת מִצָּר (תהילים ס'), וּשְׁכֻרַת וְלֹא מִיָּיִן (ישעיהו נ\"א):<br><br><b>אחזת.<\/b> לְשׁוֹן קְבִיצָה וַאֲגֻדָּה שֶׁנֶּאֱחָזִין יַחַד:", "rashi_en": "ואחזת מרעהו —as the Targum renders it: וסיעת מרחמוחי which means a company formed from his friends, the מ meaning from סיעת ממאוהביו. There are some who explain that in מרעהו the מ is part of the noun מרע — just like (Judges 14:11) “Thirty companions (מרעים)” in the narrative of Samson — in order that the word ואחזת should be taken to be the construct state to מרעהו (the company of his friends). But it would not be a polite thing to speak thus of a king — the company of his friends — for if this were the meaning it would imply that he (Abimelech) took with him the whole company of his friends and that he had no more than one group of friends. For this reason it should be interpreted in the first way (that אחזת is not construct). And you need not be surprised at the ת of אחזת although the word is not in the construct state, for we have similar cases in Scripture: (Psalms 60:13) “help (עזרת) against the adversary”, and (Isaiah 51:21) “Drunken, (שכרת) but not with wine”.<br><br>אחזת signifies a collection and band, and a band is so called because the people who constitute it are held נאחזין together."}, {"ch": 26, "v": 27, "aliyah": 4, "heb": "וַיֹּ֤אמֶר אֲלֵהֶם֙ יִצְחָ֔ק מַדּ֖וּעַ בָּאתֶ֣ם אֵלָ֑י וְאַתֶּם֙ שְׂנֵאתֶ֣ם אֹתִ֔י וַתְּשַׁלְּח֖וּנִי מֵאִתְּכֶֽם׃", "onk": "וַאֲמַר לְהוֹן יִצְחָק מָה דֵּין אֲתֵיתוּן לְוָתִי וְאַתּוּן סְנֵיתוּן יָתִי וְשַׁלַּחְתּוּנִי מִלְּוָתְכוֹן:", "onk_en": "Yitzchok said to them, Why have you come to me? You hate me and drove me away from you.", "pj": "וַאֲמַר לְהוֹן יִצְחָק מַה דֵין אָתֵיתוּן לְוָותִי דְאַצְלֵי עֲלֵיכוֹן וְאַתּוּן סְנֵיתוּן יָתִי וְתָרַכְתּוּנִי מִלְוַתְכוֹן", "pj_en": "And Izhak said to them, Why come you to me that I should pray for you, when you have hated me, and driven me from you?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 28, "aliyah": 4, "heb": "וַיֹּאמְר֗וּ רָא֣וֹ רָאִ֘ינוּ֮ כִּֽי־הָיָ֣ה יְהֹוָ֣ה&thinsp;<small>׀<\/small>&thinsp;עִמָּךְ֒ וַנֹּ֗אמֶר תְּהִ֨י נָ֥א אָלָ֛ה בֵּינוֹתֵ֖ינוּ בֵּינֵ֣ינוּ וּבֵינֶ֑ךָ וְנִכְרְתָ֥ה בְרִ֖ית עִמָּֽךְ׃", "onk": "וַאֲמָרוּ מֶחֱזָא חֲזֵינָא אֲרֵי הֲוָה <b>מֵימְרָא דַיְיָ בְּסַעְדָּךְ<\/b> וַאֲמַרְנָא <b>תִּתְקַיַּם כְּעַן מוֹמָתָא דִּהֲוָה בֵין אֲבָהָתָנָא<\/b> בֵּינָנָא וּבֵינָךְ וְנִגְזַר קְיָם עִמָּךְ:", "onk_en": "They said, We have indeed seen that Adonoy is with you [<b>the Word of Adonoy is your support<\/b>], and we said, Let there now be an oath between us, [<b>Let the oath that was between our fathers now be established<\/b>] between ourselves and you, and let us make a covenant with you;", "pj": "וַאֲמָרוּ מַחְמָא חֲמִינָא אֲרוּם הֲוָה מֵימְרָא דַיְיָ בְּסַעֲדָךְ דְבִזְכוּתָךְ הֲוַות לָן כָּל טַבְתָא וּכְדוּ נְפַקְתָּא מִן אַרְעָן יַבִּישׁוּ בֵירָן וְאִילָנָא לָא עָבְדוּ פֵירִין וְאָמַרְנָא נְהַדְרִינֵיהּ לְוָותָנָא וְתִתְקַיֵים כְּדוֹן מוֹמָתָא דַהֲוָות בֵּינָן וּמְ
