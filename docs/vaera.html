 "onk": "לְחוֹד בְּאַרְעָא דְגשֶׁן דִּי תַמָּן בְּנֵי יִשְׂרָאֵל לָא הֲוָא בַּרְדָּא:", "onk_en": "Only in the land of Goshen where the B’nei Yisrael were, there was no hail.", "pj": "לְחוֹד בְּאַרְעָא דְגשֶׁן דְתַמָן בְּנֵי יִשְרָאֵל לָא הֲוָה בַרְדָא", "pj_en": "Only in the land of Goshen, where the children of Israel were, there was no hail.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 27, "aliyah": 7, "heb": "וַיִּשְׁלַ֣ח פַּרְעֹ֗ה וַיִּקְרָא֙ לְמֹשֶׁ֣ה וּֽלְאַהֲרֹ֔ן וַיֹּ֥אמֶר אֲלֵהֶ֖ם חָטָ֣אתִי הַפָּ֑עַם יְהֹוָה֙ הַצַּדִּ֔יק וַאֲנִ֥י וְעַמִּ֖י הָרְשָׁעִֽים׃", "onk": "וּשְׁלַח פַּרְעֹה וּקְרָא לְמשֶׁה וּלְאַהֲרֹן וַאֲמַר לְהוֹן חָבִית זִמְנָא הָדָא יְיָ זַכָּאָה וַאֲנָא וְעַמִּי חַיָּבִין:", "onk_en": "Pharaoh sent, and called for Moshe and Aharon, and he said to them, “This time I have sinned. Adonoy is the righteous One and I and my people are the sinners.", "pj": "וְשַׁדַר פַּרְעה פּוּלִין לְמִקְרֵי לְמשֶׁה וּלְאַהֲרן וַאֲמַר לְהוֹן חָבִית בְּזִמְנָא הָדָא יְדָעִית דַיְיָ הוּא אֱלָהָא זַכָּאָה וּבְרַם אֲנָא וְעַמִי חַיָיבִין בְּכָל מַחְתָא וּמַחְתָא", "pj_en": "And Pharoh sent certain to call Mosheh and Aharon; and he said to them, This time I have sinned. I know that the Lord is a righteous God, and that I and my people have deserved every one of these plagues.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 28, "aliyah": 7, "heb": "הַעְתִּ֙ירוּ֙ אֶל־יְהֹוָ֔ה וְרַ֕ב מִֽהְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּבָרָ֑ד וַאֲשַׁלְּחָ֣ה אֶתְכֶ֔ם וְלֹ֥א תֹסִפ֖וּן לַעֲמֹֽד׃", "onk": "צַלּוֹ <b>קֳדָם<\/b> יְיָ <b>וְסַגִּי קֳדָמוֹהִי רְוַח דְּלָא יְהוֹן עֲלָנָא קָלִין דִּלְוַט כְּאִלֵּין מִן קֳדָם יְיָ וּבַרְדָּא<\/b> וְאֶשְׁלַח יָתְכוֹן וְלָא תוֹסְפוּן לְאִתְעַכָּבָא:", "onk_en": "Pray to [<b>before<\/b>] Adonoy [<b>for there is much relief before Him, so that there will be no thunders of anger like these upon us from before God, nor hail.<\/b>] There has been enough of God’s thunder and hail. I will send you out without further delay.”", "pj": "צְלוֹי קֳדָם יְיָ וִיהִי סַגִי קָדָמוֹי מִלְמֶהֱוֵי קָלִין דִלְוָוט מִן קֳדָם יְיָ וּבַרְדָן וְאֶפְטוֹר יַתְכוֹן וְלָא תוֹסְפוּן לְאִתְעַכָּבָא", "pj_en": "Intercede before the Lord, that with Him it may be enough, and there may be no more maledictory thunders nor hail from the presence of the Lord; and I will release you, and no longer hinder.", "tj": "", "tj_en": "", "rashi": "<b>ורב.<\/b> דַּי לוֹ בְּמַה שֶּׁהוֹרִיד כְּבָר:", "rashi_en": "ורב AND IT IS ENOUGH — let it suffice Him with what He has brought down already."}, {"ch": 9, "v": 29, "aliyah": 7, "heb": "וַיֹּ֤אמֶר אֵלָיו֙ מֹשֶׁ֔ה כְּצֵאתִי֙ אֶת־הָעִ֔יר אֶפְרֹ֥שׂ אֶת־כַּפַּ֖י אֶל־יְהֹוָ֑ה הַקֹּל֣וֹת יֶחְדָּל֗וּן וְהַבָּרָד֙ לֹ֣א יִֽהְיֶה־ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַיהֹוָ֖ה הָאָֽרֶץ׃", "onk": "וַאֲמַר לֵיהּ משֶׁה כְּמִפְּקִי מִן קַרְתָּא אֶפְרוֹשׂ יְדַי <b>בִּצְלוֹ קֳדָם<\/b> יְיָ קָלַיָּא יִתְמַנְּעוּן וּבַרְדָּא לָא יְהֵי עוֹד בְּדִיל דְּתִדַּע אֲרֵי דַיְיָ אַרְעָא:", "onk_en": "Moshe said to him, “When I leave the city, I will spread my hands [<b>in prayer<\/b>] to [<b>before<\/b>] Adonoy. The thunder will cease and their will be no more hail, so that you will know that the earth belongs to Adonoy.", "pj": "וַאֲמַר לֵיהּ משֶׁה כְּמִפְקִי סְמִיךְ לְקַרְתָּא אֶפְרוֹשׁ יַת יְדַי בִּצְלוֹי קֳדָם יְיָ קָלַיָיא יִתְמַנְעוּן וּבַרְדָא לָא יְהִי תוּב מִן בִּגְלַל דְתִנְדַע אֲרוּם דַיְיָ הִיא אַרְעָא", "pj_en": "And Mosheh said to him, When I have gone out from thee into the city, I will outspread my hands in prayer before the Lord, and the thunders shall cease, and there shall be no more hail; that you may know that the earth is the Lord's.", "tj": "", "tj_en": "", "rashi": "<b>כצאתי את העיר.<\/b> מִן הָעִיר, אֲבָל בְּתוֹךְ הָעִיר לֹא הִתְפַּלֵּל לְפִי שֶׁהָיְתָה מְלֵאָה גִּלּוּלִים (שמות רבה):", "rashi_en": "כצאתי את העיר — This is the same as מן העיר [AS SOON AS I AM GONE OUT] FROM THE CITY. But he did not pray within the city because it was full of idols (Exodus Rabbah 12:5)."}, {"ch": 9, "v": 30, "aliyah": 7, "heb": "וְאַתָּ֖ה וַעֲבָדֶ֑יךָ יָדַ֕עְתִּי כִּ֚י טֶ֣רֶם תִּֽירְא֔וּן מִפְּנֵ֖י יְהֹוָ֥ה אֱלֹהִֽים׃", "onk": "וְאַתְּ וְעַבְדָּיךְ יְדַעְנָא אֲרֵי עַד כְּעַן לָא <b>אִתְכְּנַעְתּוּן מִן קֳדָם<\/b> יְיָ אֱלֹּהִים:", "onk_en": "But regarding you and your servants, I know that you are not yet in fear of [<b>humbled from before<\/b>] Adonoy, Elohim.", "pj": "וְאַנְתְּ וְעַבְדָךְ חַכִּימִית אֲרוּם עַד לָא תִפְטְרוּן עַמָא תְּהוֹן דַחֲלִין מִן קֳדָם יְיָ אֱלהִים", "pj_en": "But I know that thou and thy servants release the people, they will have to be afraid before the Lord God.", "tj": "", "tj_en": "", "rashi": "<b>טרם תיראון.<\/b> עֲדַיִן לֹא תִירְאוּן; וְכֵן כָּל טֶרֶם שֶׁבַּמִּקְרָא \"עֲדַיִן לֹא\" הוּא, וְאֵינוֹ לְשׁוֹן קֹדֶם, \"טֶרֶם יִשְׁכָּבוּ\" (בראשית י\"ט) – עַד לָא שְׁכִיבוּ, \"טֶרֶם יִצְמָח\" (שם ב') – עַד לָא צְמַח. אַף זֶה כֵן הוּא – יָדַעְתִּי כִּי עֲדַיִן אֵינְכֶם יְרֵאִים, וּמִשֶּׁתִּהְיֶה הָרְוָחָה תַעַמְדוּ בְּקִלְקוּלְכֶם:", "rashi_en": "טרם תראון means YE DO NOT YET FEAR. Wherever occurs in Scripture it signifies ״not yet”, and does not mean “before”. For example: (Genesis 19:4) טרם ישכבו, which the Targum renders by “whilst yet they had not lain down”; (Genesis 2:5) טרם יצמח which the Targum renders by “not yet sprung forth”. This, too, has the same meaning: I know that ye do not yet fear the Lord, and that as soon as there will be respite you will continue in your moral corruption."}, {"ch": 9, "v": 31, "aliyah": 7, "heb": "וְהַפִּשְׁתָּ֥ה וְהַשְּׂעֹרָ֖ה נֻכָּ֑תָה כִּ֤י הַשְּׂעֹרָה֙ אָבִ֔יב וְהַפִּשְׁתָּ֖ה גִּבְעֹֽל׃", "onk": "וְכִתָּנָא וְסַעֲרֵי לְקוֹ אֲרֵי סַעְרַנְיָא אַבִּיבִין וְכִתָּנָא גַּבְעוֹלִין:", "onk_en": "The flax and barley have been broken since the barley was ripe, and the flax had formed into stalks.", "pj": "וְכִתְּנָא וְסַרְתָּא לָקוּן אֲרוּם סַרְתָּא הֲוָות כְּסִירָא וְכִיתְנָא עָבַד פּוּקְלִין", "pj_en": "And the flax and the barley were beaten down, because the barley was in the ear, and the flax was making pods.", "tj": "וְכִתָּנָא הֲוַת גַבְעוּלִין וְאִתָּרַת נִצָהּ:", "tj_en": "The flax was (making) pods, for it had cast its flowers.", "rashi": "<b>והפשתה והשערה נכתה.<\/b> נִשְׁבְּרָה, לְשׁוֹן \"פַּרְעֹה נְכֹה\" (מלכים ב כ\"ג), \"נְכָאִים\" (ישעיהו ט\"ז), וְכֵן לֹא נֻכּוּ; וְלֹא יִתָּכֵן לְפָרְשׁוֹ לְשׁוֹן הַכָּאָה, שֶׁאֵין נו\"ן בִּמְקוֹם ה\"א לְפָרֵשׁ נֻכָּתָה כְּמוֹ הֻכָּתָה, נֻכּוּ כְּמוֹ הֻכּוּ, אֶלָּא הַנּו\"ן שֹׁרֶשׁ בַּתֵּבָה וַהֲרֵי הוּא מִגִּזְרַת \"וְשֻׁפּוּ עַצְמוֹתָיו\" (איוב ל\"ג):<br><br><b>כי השערה אביב.<\/b> כְּבָר בִּכְּרָה וְעוֹמֶדֶת בְּקָשְׁיָהּ, וְנִשְׁתַּבְּרוּ וְנָפְלוּ, וְכֵן הַפִּשְׁתָּה גָּדְלָה כְבָר, וְהֻקְשָׁה לַעֲמֹד בְּגִבְעוֹלֶיהָ:<br><br><b>השערה אביב.<\/b> עָמְדָה בְּאִבֶּיהָ, לְשׁוֹן \"בְּאִבֵּי הַנָּחַל\" (שיר ו'):", "rashi_en": "והפשתה והשערה נכתה AND THE FLAX AND THE BARLEY נכתה — i. e. were broken; it has the same meaning as in, (2 Kings 23:29) “Pharaoh-Necho (נכה)”, which denotes Pharaoh the lame i. e. broken in so far as the power of his legs is concerned (cf. II Samuel 9:3); (Isaiah 16:7) “brocken (נכאים)”, and so too לא נכו (v. 32), “they were not broken”. It would not be correct to explain that it is connected in meaning with the word that signifies “smiting”, הכאה, for a נ cannot take the place of a ה that one may explain נֻכָּתָה as being equivalent to הֻכָּתָה, and נֻכּוּ to הֻכּוּ, but the נ is a root-letter in the verb, and the word נֻכּוּ is of the same grammatical form as the verb in, (Job. 33:21) “and all his bones are laid bare” שֻׁפּוּ (i. e. Pual of כי השערה אביב<br><br>כי השערה אביב FOR THE BARLEY WAS IN THE EAR — it had produced its first ears and it stood on its stalks; these were therefore broken and fell. So, too, the flax had already grown and had become hard enough to stand in its capsules.<br><br>השערה אביב means [THE BARLEY] STOOD IN RIPE STATE, similar in meaning to, (Song 6:11) “[to look at] the ripe plants (באבי] of the valley”."}, {"ch": 9, "v": 32, "aliyah": 7, "heb": "וְהַחִטָּ֥ה וְהַכֻּסֶּ֖מֶת לֹ֣א נֻכּ֑וּ כִּ֥י אֲפִילֹ֖ת הֵֽנָּה׃", "onk": "וְחִטָּאָה וְכֻנְתַּיָּא לָא לְקוֹ אֲרֵי אֲפִילָתָא אִנּוּן:", "onk_en": "But neither the wheat or the spelt were broken since they are late in sprouting.”", "pj": "וְחִיטַיָא וְכוּנְתַּיָא לָא לָקוּן אֲרוּם לְקִישָׁן הִינוּן", "pj_en": "But the wheat and the spelt were not smitten, because they are later.", "tj": "", "tj_en": "", "rashi": "<b>כי אפילת הנה.<\/b> מְאֻחָרוֹת, וַעֲדַיִן הָיוּ רַכּוֹת וִיכוֹלוֹת לַעֲמֹד בִּפְנֵי קָשֶׁה; וְאַעַ\"פִּ שֶׁנֶּאֱמַר \"וְאֵת כָּל עֵשֶׂב הַשָּׂדֶה הִכָּה הַבָּרָד\", יֵשׁ לְפָרֵשׁ פְּשׁוּטוֹ שֶׁל מִקְרָא בַּעֲשָׂבִים הָעוֹמְדִים בְּקִלְחָם, הָרְאוּיִם לִלְקוֹת בַּבָּרָד. וּבְמִדְרַשׁ רַבִּי תַּנְחוּמָא יֵשׁ מֵרַבּוֹתֵינוּ שֶׁנֶּחְלְקוּ עַל זֹאת, וְדָרְשׁוּ <b>כי אפילת<\/b>, פִּלְאֵי פְלָאוֹת נַעֲשׂוּ לָהֶם שֶׁלֹּא לָקוּ:", "rashi_en": "כי אפילת הנה means FOR THEY WERE LATE in growing and they were still soft and able to resist the blow of anything hard. It is true that it is stated, (v. 25) “and every herb of the field did the hail smite”, but one must explain the real meaning of that verse as referring to herbs that stood on their stalks and were therefore liable to be broken by the hail. In the Midrash of Rabbi Tanchuma 2:2:16 some of our Rabbis differed in their explanation of this, and explained the words כי אפילת to signify that most remarkable wonders (פלאי פלאות) happened to them in that they were not smitten."}, {"ch": 9, "v": 33, "aliyah": 7, "heb": "וַיֵּצֵ֨א מֹשֶׁ֜ה מֵעִ֤ם פַּרְעֹה֙ אֶת־הָעִ֔יר וַיִּפְרֹ֥שׂ כַּפָּ֖יו אֶל־יְהֹוָ֑ה וַֽיַּחְדְּל֤וּ הַקֹּלוֹת֙ וְהַבָּרָ֔ד וּמָטָ֖ר לֹא־נִתַּ֥ךְ אָֽרְצָה׃", "onk": "וּנְפַק משֶׁה מִלְּוָת פַּרְעֹה יָת קַרְתָּא וּפְרַשׂ יְדוֹהִי בִּצְלוֹ <b>קֳדָם<\/b> יְיָ וְיִתְמַנְּעוּן קָלַיָּא וּבַרְדָּא וּמִטְרָא <b>דַהֲוָה נָחִית<\/b> לָא מְטָא עַל אַרְעָא:", "onk_en": "Moshe [then] left Pharaoh’s presence, and left the city. He spread his hands [in prayer] to [<b>before<\/b>] Adonoy. The thunder ceased, and the hail and the rain [<b>which had descended<\/b>] did not reach the earth.", "pj": "וּנְפַק משֶׁה וְאַהֲרן מִלְוַת פַּרְעה סְמִיךְ לְקַרְתָּא וּפְרַס יְדוֹי בִּצְלוֹי קֳדָם יְיָ וְאִתְמְנָעוּ קָלִין דִלְוָוט וּבַרְדָא וּמִטְרָא דַהֲוָה נָחִית לָא מָטָא עַל אַרְעָא", "pj_en": "And Mosheh and Aharon went out from Pharoh to the suburb, and he stretched out his hands in prayer before the Lord, and the thunders of the curse were withheld, and the hail and rain that were descending came not on the earth.", "tj": "", "tj_en": "", "rashi": "<b>לא נתך.<\/b> לֹא הִגִּיעַ, וְאַף אוֹתָן שֶׁהָיוּ בָּאֲוִיר לֹא הִגִּיעוּ לָאָרֶץ; וְדוֹמֶה לוֹ: \"וַתִּתַּךְ עָלֵינוּ הָאָלָה וְהַשְּׁבוּעָה\" (דניאל ט') דְּעֶזְרָא – וַתַּגִּיעַ עָלֵינוּ. וּמְנַחֵם בֶּן סָרוּק חִבְּרוֹ בְּחֵלֶק \"כְּהִתּוּךְ כֶּסֶף\" (יחזקאל כ\"ב), לְשׁוֹן יְצִיקַת מַתֶּכֶת, וְרוֹאֶה אֲנִי אֶת דְּבָרָיו, כְּתַרְגּוּמוֹ וְיָצַק – וְאַתִּיךְ, לָצֶקֶת – לְאַתָּכָא. אַף זֶה לֹא נִתַּךְ לָאָרֶץ – לֹא הוּצַק לָאָרֶץ:", "rashi_en": "לא נתך means [RAIN] DID NOT REACH the earth (i. e. no fresh rain came down) — that rain, too, which was alredy in the air at the moment when Moses was praying remained there and did not reach the ground. In a similar sense is “ותתך עלינו the curse and the oath” — a passage in the book of Ezra (really, Daniel 9:11) — which signifies, “the curse and the oath have reached us”. But Menachem ben Seruk classified it in the same section as, (Ezekiel 22:22) “כהתוך כסף” which has the meaning of melting (pouring forth) metal. I agree with his opinion, because in the Targum we render ויצק, (Onkelos Exodus 38:5) “And he cast (metal)”, by ואתיך, and (Onkelos Exodus 38:27) לצקת, “to cast (metal)” by לאתכא, each of these Aramaic words being of the same root as our word נתך. Therefore לא נתך ארצה would mean: rain was not poured out to the ground."}, {"ch": 9, "v": 34, "aliyah": 7, "heb": "וַיַּ֣רְא פַּרְעֹ֗ה כִּֽי־חָדַ֨ל הַמָּטָ֧ר וְהַבָּרָ֛ד וְהַקֹּלֹ֖ת וַיֹּ֣סֶף לַחֲטֹ֑א וַיַּכְבֵּ֥ד לִבּ֖וֹ ה֥וּא וַעֲבָדָֽיו׃", "onk": "וַחֲזָא פַרְעֹה אֲרֵי אִתְמְנַע מִטְרָא וּבַרְדָּא וְקָלַיָּא וְאוֹסֵף לְמֶחֱטֵי וְיַקְּרֵיהּ לְלִבֵּיהּ הוּא וְעַבְדּוֹהִי:", "onk_en": "[When] Pharaoh saw that the rain, and the hail and the thunder ceased, he continued his sin[ful ways]. He and his servants hardened their hearts.", "pj": "וַחֲמָא פַּרְעה אֲרוּם אִתְמְנַע מִטְרָא וּבַרְדָא וְקָלַיָיא דִלְוָוט פָּסְקוּ וְאוֹסִיף לְמֶחֱטֵי וִיקָרֵיהּ לְיִצְרָא דְלִבֵּיהּ הוּא וְעַבְדוֹי", "pj_en": "And Pharoh saw that the rain and hail and the thunders of the curse had ended, and he added to sin, and made strong the design of his heart, both he and his servants.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 9, "v": 35, "aliyah": 7, "heb": "וַיֶּֽחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְלֹ֥א שִׁלַּ֖ח אֶת־בְּנֵ֣י יִשְׂרָאֵ֑ל כַּאֲשֶׁ֛ר דִּבֶּ֥ר יְהֹוָ֖ה בְּיַד־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִתַּקַּף לִבָּא דְפַרְעֹה וְלָא שַׁלַּח יָת בְּנֵי יִשְׂרָאֵל כְּמָא דִי מַלֵּיל יְיָ בִּידָא דְּמשֶׁה:", "onk_en": "Pharaoh’s heart was strengthened, and he did not send the B’nei Yisrael out. This was just as Adonoy had spoken through Moshe.", "pj": "וְאִיתְקַף יִצְרָא דְלִבָּא דְפַרְעה וְלָא פְטַר יַת בְּנֵי יִשְׁרָאֵל הֵיכְמָא דְמַלֵיל יְיָ בִּידָא דְמשֶׁה", "pj_en": "And Pharoh's heart was made obstinate, and he would not release the children of Israel, as the Lord had said through Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
