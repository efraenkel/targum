ִין הֲוַת בְּבֵיתֵיהּ דִיהוּדָה וְלָא הֲוָה יְהוּדָה רָחֵים יָתָהּ", "pj_en": "And Jehuda saw her; but she seemed in his face as an harlot, because she had provoked him to anger in his house, and Jehuda did not love her.", "tj": "אֲרוּם צִמְצְמַת אַפָּהָא:", "tj_en": "For she had enwrapped her face.", "rashi": "<b>ויחשבה לזונה.<\/b> לְפִי שֶׁיּוֹשֶׁבֶת בְּפָרָשַׁת דְּרָכִים:<br><br><b>כי כסתה פניה.<\/b> וְלֹא יָכוֹל לִרְאוֹתָהּ וּלְהַכִּירָהּ. וּמִדְרַשׁ רַבּוֹתֵינוּ <b>כי כסתה פניה<\/b>, כְּשֶׁהָיְתָה בְּבֵית חָמִיהָ הָיְתָה צְנוּעָה, לְפִיכָךְ לֹא חֲשָׁדָהּ:", "rashi_en": "ויחשבה לזונה AND HE THOUGHT HER TO BE AN HARLOT, because she was sitting at the cross-roads.<br><br>כי כסתה פניה FOR SHE HAD COVERED HER FACE — so that he could not see her face and thus recognize her. A Midrashic explanation of our Rabbis is that כי כסתה פניה means BECAUSE SHE ALWAYS COVERED HER FACE: when she had stayed in her father-in-law’s house she had shown herself a modest woman, and therefore he did not suspect her (of being the woman who was sitting there for that evil purpose) (Sotah 10b). "}, {"ch": 38, "v": 16, "aliyah": 4, "heb": "וַיֵּ֨ט אֵלֶ֜יהָ אֶל־הַדֶּ֗רֶךְ וַיֹּ֙אמֶר֙ הָֽבָה־נָּא֙ אָב֣וֹא אֵלַ֔יִךְ כִּ֚י לֹ֣א יָדַ֔ע כִּ֥י כַלָּת֖וֹ הִ֑וא וַתֹּ֙אמֶר֙ מַה־תִּתֶּן־לִ֔י כִּ֥י תָב֖וֹא אֵלָֽי׃", "onk": "וּסְטָא לְוָתַהּ לְאָרְחָא וַאֲמַר הָבִי <b>כְעַן<\/b> אֵיעוֹל לְוָתִיךְ אֲרֵי לָא יְדַע אֲרֵי כַלְּתֵיהּ הִיא וַאֲמֶרֶת מַה תִּתֵּן לִי אֲרֵי תֵיעוֹל לְוָתִי:", "onk_en": "He turned aside to her on the road, and said, Please [<b>Now<\/b>], let me be with you, for he did not know that she was his daughter-in-law. She said, What will you give me for the privilege of being with me?", "pj": "וּסְטָא לְוָותָהּ לְאָרְחָא וַאֲמַר הֲבִי כְּדוֹן אֵיעוֹל לְוָותִיךְ אֲרוּם לָא יָדַע אֲרוּם כַּלְתֵיהּ הִיא וַאֲמָרַת מַה תִתֵּן לִי אֲרוּם תֵיעוֹל לְוָתִי", "pj_en": "And he inclined to her in the way and said, Let me now go in with thee: for he knew not that she was his daughter--in--law. And she said What wilt thou give me to go in with me?", "tj": "", "tj_en": "", "rashi": "<b>ויט אליה אל הדרך.<\/b> מִדֶּרֶךְ שֶׁהָיָה בָהּ, נָטָה אֶל הַדֶּרֶךְ אֲשֶׁר הִיא בָּהּ, וּבִלְשׁוֹן לַעַז דשטורנ\"יר:<br><br><b>הבה נא.<\/b> הָכִינִי עַצְמֵךְ וְדַעְתֵּךְ לְכָךְ. כָּל לְשׁוֹן הָבָה לְשׁוֹן הַזְמָנָה הוּא, חוּץ מִמָּקוֹם שֶׁיֵּשׁ לְתַרְגְּמוֹ בִּלְשׁוֹן נְתִינָה, וְאַף אוֹתָן שֶׁל הַזְמָנָה קְרוֹבִים לִלְשׁוֹן נְתִינָה הֵם:", "rashi_en": "ויט אליה אל הדרך AND HE TURNED UNTO HER BY THE WAY — from the road he was following he turned to the road where she was. In old French détourner; English to turn aside.<br><br>הבה נא COME, I PRAY THEE — Prepare yourself and your mind for this. Wherever הבה occurs it signifies “preparing oneself”, except in any passage where it must necessarily be translated by “giving”. And, indeed, those signifying “preparation” have almost the meaning of  “giving”. (ערבון (17— means a PLEDGE. "}, {"ch": 38, "v": 17, "aliyah": 4, "heb": "וַיֹּ֕אמֶר אָנֹכִ֛י אֲשַׁלַּ֥ח גְּדִֽי־עִזִּ֖ים מִן־הַצֹּ֑אן וַתֹּ֕אמֶר אִם־תִּתֵּ֥ן עֵרָב֖וֹן עַ֥ד שׇׁלְחֶֽךָ׃", "onk": "וַאֲמַר אֲנָא אֲשַׁלַּח גַּדְיָא בַר עִזֵּי מִן עָנָא וַאֲמֶרֶת אִם תִּתֵּן מַשְׁכּוֹנָא עַד דְּתִשְׁלָח:", "onk_en": "He said, I will send you a kid from the flock. She said, [Only] if you give me some security until you send it.", "pj": "וַאֲמַר אֲנָא אֲשַׁדֵר גִידֵי בַּר עִיזֵי מִן עָנָא וַאֲמָרַת אִין תִּתֵּן מַשְׁכּוֹנָא עַד דְתִשְׁדַר", "pj_en": "And he said, I will send thee a kid of the goats from the flock. And she said, If thou wilt give me a pledge until thou shalt have sent.", "tj": "", "tj_en": "", "rashi": "<b>ערבון.<\/b> מַשְׁכּוֹן:", "rashi_en": "ערבון means a PLEDGE. "}, {"ch": 38, "v": 18, "aliyah": 4, "heb": "וַיֹּ֗אמֶר מָ֣ה הָעֵֽרָבוֹן֮ אֲשֶׁ֣ר אֶתֶּן־לָךְ֒ וַתֹּ֗אמֶר חֹתָֽמְךָ֙ וּפְתִילֶ֔ךָ וּמַטְּךָ֖ אֲשֶׁ֣ר בְּיָדֶ֑ךָ וַיִּתֶּן־לָ֛הּ וַיָּבֹ֥א אֵלֶ֖יהָ וַתַּ֥הַר לֽוֹ׃", "onk": "וַאֲמַר מָה מַשְׁכּוֹנָא דִּי אֶתֵּן לָךְ וַאֲמֶרֶת עִזְקְתָךְ וְשׁוֹשִׁפָּךְ וְחוּטְרָךְ דִּי בִידָךְ וִיהַב לַהּ וְעַל לְוָתַהּ וְעַדִּיאַת לֵיהּ:", "onk_en": "He said, What security shall I give you? She said, Your signet ring, your wrap, and your staff that is in your hand. He gave them to her and was with her, and she became pregnant by him.", "pj": "וַאֲמַר מַה מַשְׁכּוֹנָא דְאֶתֵּן לִיךְ וַאֲמָרַת סִיטוּמְתָּךְ וְחוּטְיָיךְ וְחוּטְרָךְ דְבִידָךְ וִיהַב לָהּ וְעַל לְוָותָהּ וְאִתְעַבָּרַת לֵיהּ", "pj_en": "And he said, What pledge shall I give thee? And she answered, Thy seal, and thy mantle, and thy staff which is in thy hand. And he gave (them) to her, and went in with her; and she conceived by him.", "tj": "", "tj_en": "", "rashi": "<b>חתמך ופתילך.<\/b> עִזְקְתָךְ וְשׁוֹשִׁיפָּךְ – טַבַּעַת שֶׁאַתָה חוֹתֵם בָּהּ וְשִׂמְלָתְךָ שֶׁאַתָּה מִתְכַּסֶּה בָהּ:<br><br><b>ותהר לו.<\/b> גִּבּוֹרִים כַּיּוֹצֵא בוֹ, צַדִּיקִים כַּיּוֹצֵא בוֹ.", "rashi_en": "חתמך ופתילך THY SIGNET AND THY STRING — The Targum renders it by “Thy signet and thy cloak” — the ring which you use as a seal and the cloak with which you cover yourself<br><br>ותהר לו AND SHE CONCEIVED BY HIM (לו, to him) — she conceived men who were strong, similar to himself, and men who were righteous, similar to himself (Genesis Rabbah 85:9). "}, {"ch": 38, "v": 19, "aliyah": 4, "heb": "וַתָּ֣קׇם וַתֵּ֔לֶךְ וַתָּ֥סַר צְעִיפָ֖הּ מֵעָלֶ֑יהָ וַתִּלְבַּ֖שׁ בִּגְדֵ֥י אַלְמְנוּתָֽהּ׃", "onk": "וְקָמַת וַאֲזָלַת וְאַעְדִּיאַת עֵיפַהּ מִנַּהּ וּלְבֵישַׁת לְבוּשֵׁי אַרְמְלוּתַהּ:", "onk_en": "She got up and went away. She took off her veil, and put on her widow’s garb.", "pj": "וְקָמַת וְאָזְלַת וְעָדַת רְדִידָהּ מִנָהּ וּלְבִישַׁת לְבוּשֵׁי אַרְמְלוּתָהּ", "pj_en": "And she arose and went, and put her veil from her, and put on the dress of her widowhood.", "tj": "רְדִידָה:", "tj_en": "Her veil.", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 20, "aliyah": 4, "heb": "וַיִּשְׁלַ֨ח יְהוּדָ֜ה אֶת־גְּדִ֣י הָֽעִזִּ֗ים בְּיַד֙ רֵעֵ֣הוּ הָֽעֲדֻלָּמִ֔י לָקַ֥חַת הָעֵרָב֖וֹן מִיַּ֣ד הָאִשָּׁ֑ה וְלֹ֖א מְצָאָֽהּ׃", "onk": "וְשַׁדַּר יְהוּדָה יָת גַּדְיָא בַר עִזֵּי בִּידָא רַחֲמֵיהּ עֲדֻלָּמָאָה לְמִסַּב מַשְׁכּוֹנָא מִידָא דְאִתְּתָא וְלָא אַשְׁכְּחַהּ:", "onk_en": "Yehudah sent the goat-kid with his friend the Adullamite, to retrieve the security from the woman, but he could not find her.", "pj": "וְשַׁדַר יְהוּדָה יַת גִידֵי בַּר עִזֵי בְּיַד רַחֲמֵיהּ עֲדוּלְמָאָה לְמִסַב מַשְׁכּוֹנָא מִידָא דְאִיתְּתָא וְלָא אַשְׁכְּחָה", "pj_en": "And Jehuda sent the kid of the goats by the hand of his friend the Adullemite, to bring back the pledge from the hand of the woman; but he found her not.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 21, "aliyah": 4, "heb": "וַיִּשְׁאַ֞ל אֶת־אַנְשֵׁ֤י מְקֹמָהּ֙ לֵאמֹ֔ר אַיֵּ֧ה הַקְּדֵשָׁ֛ה הִ֥וא בָעֵינַ֖יִם עַל־הַדָּ֑רֶךְ וַיֹּ֣אמְר֔וּ לֹא־הָיְתָ֥ה בָזֶ֖ה קְדֵשָֽׁה׃", "onk": "וּשְׁאִיל יָת אֲנָשֵׁי אַתְרַהּ לְמֵימַר אָן מְקַדִּשְׁתָּא הִיא בְעַיְנִין עַל אָרְחָא וַאֲמָרוּ לֵית הָכָא מְקַדִּשְׁתָּא:", "onk_en": "He asked the men of her place, Where is the harlot that was at the junction, on the road? They said, There was [<b>is<\/b>] no harlot here.", "pj": "וּשְׁאַל יַת אִינְשֵׁי אַתְרָהּ לְמֵימַר הָאַן מַטְעִיתָא דְהִיא בִּסְכוֹת עַיְינִין עַל אוֹרְחָא וַאֲמָרוּ לָא הֲוָת הָכָא מַטְעִיתָא", "pj_en": "And he asked the men of the place, saying, Where is the harlot who was in the sight of the eyes by the way? And they said, There is no harlot here.", "tj": "", "tj_en": "", "rashi": "<b>הקדשה.<\/b> מְקֻדֶּשֶׁת וּמְזֻמֶּנֶת לִזְנוּת:", "rashi_en": "הקדשה— means a woman who is devoted to, (מקדשת) and who is ever ready for illicit intercourse. "}, {"ch": 38, "v": 22, "aliyah": 4, "heb": "וַיָּ֙שׇׁב֙ אֶל־יְהוּדָ֔ה וַיֹּ֖אמֶר לֹ֣א מְצָאתִ֑יהָ וְגַ֨ם אַנְשֵׁ֤י הַמָּקוֹם֙ אָֽמְר֔וּ לֹא־הָיְתָ֥ה בָזֶ֖ה קְדֵשָֽׁה׃", "onk": "וְתָב לְוַת יְהוּדָה וַאֲמַר לָא אַשְׁכְּחִיתַהּ וְאַף אֲנָשֵׁי אַתְרָא אֲמָרוּ <b>לֵית הָכָא<\/b> מְקַדִּשְׁתָּא:", "onk_en": "He returned to Yehudah and said, I did not find her, and the men of her place also said that there was [<b>is<\/b>] no harlot there [<b>here<\/b>].", "pj": "וְתַב לְוַת יְהוּדָה וַאֲמַר לָא אַשְׁכְּחִיתָהּ וְאוּף אִינְשֵׁי אַתְרָא אֲמָרוּ לָא הֲוַת הָכָא מַטְעִיתָא", "pj_en": "And he returned to Jehuda and said, I could not find her: and the men of the place also said that no harlot was there.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 23, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהוּדָה֙ תִּֽקַּֽח־לָ֔הּ פֶּ֖ן נִהְיֶ֣ה לָב֑וּז הִנֵּ֤ה שָׁלַ֙חְתִּי֙ הַגְּדִ֣י הַזֶּ֔ה וְאַתָּ֖ה לֹ֥א מְצָאתָֽהּ׃", "onk": "וַאֲמַר יְהוּדָה תִּסַּב לַהּ דִּילְמָא <b>נְהֵי לְחוֹךְ<\/b> הָא שַׁדָּרִית גַּדְיָא הָדֵין וְאַתְּ לָא אַשְׁכְּחִתַּהּ:", "onk_en": "Yehudah said, Let her take it, lest we are humiliated [<b>become a laughingstock<\/b>]. Behold I sent her this kid, and you could not find her.", "pj": "וַאֲמַר יְהוּדָה תִּסַב לָהּ מַשְׁכּוֹנְיָא דִילְמָא נֶהֱוֵי לִגְחוּךְ הָא שַׁדְרִית יַת גַדְיָא הָדֵין וְאַנְתְּ לָא אַשְׁכַּחְתָּהּ", "pj_en": "And Jehuda said, Lest she should have taken the pledge, lest we become a laughing stock, behold, I have sent this goat, and thou canst not find her.", "tj": "", "tj_en": "", "rashi": "<b>תקח לה.<\/b> יִהְיֶה שֶׁלָּהּ מַה שְּׁבְּיָדָהּ:<br><br><b>פן נהיה לבוז.<\/b> אִם תְּבַקְּשֶׁנָּה עוֹד יִתְפַּרְסֵם הַדָּבָר וְיִהְיֶה גְּנַאי, כִּי מֶה עָלַי לַעֲשׂוֹת עוֹד לְאַמֵּת דְּבָרַי:<br><br><b>הנה שלחתי הגדי הזה.<\/b> לְפִי שֶׁרִמָּה יְהוּדָה אֶת אָבִיו בִּגְדִי עִזִּים שֶׁהִטְבִּיל כְּתֹנֶת יוֹסֵף בְּדָמוֹ, רִמּוּהוּ גַּם הוּא בִּגְדִי עִזִּים (בראשית רבה):", "rashi_en": "תקח לה Let that remain hers which she has in her possession (i.e. LET HER KEEP IT).<br><br>פן נהיה לבוז LEST WE BECOME A SCORN — if you seek her further the matter will become public and disgrace will follow, for what more can I do to redeem my promise? (for I have sent this kid etc and I can do no more).<br><br>הנה שלחתי את הגדי הזה BEHOLD, I SENT THIS KID — Because Judah had deceived his father through a kid of the goats — for he had dipped Joseph’s coat in its blood — therefore he, too, was deceived through a kid of the goats (Genesis Rabbah 85:9). "}, {"ch": 38, "v": 24, "aliyah": 4, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> כְּמִשְׁלֹ֣שׁ חֳדָשִׁ֗ים וַיֻּגַּ֨ד לִֽיהוּדָ֤ה לֵאמֹר֙ זָֽנְתָה֙ תָּמָ֣ר כַּלָּתֶ֔ךָ וְגַ֛ם הִנֵּ֥ה הָרָ֖ה לִזְנוּנִ֑ים וַיֹּ֣אמֶר יְהוּדָ֔ה הוֹצִיא֖וּהָ וְתִשָּׂרֵֽף׃", "onk": "וַהֲוָה כִּתְלָתוּת יַרְחַיָּא וְאִתְחַוָּא לִיהוּדָה לְמֵימַר זַנִּיאַת תָּמָר כַּלְּתָךְ וְאַף הָא מַעְדְּיָא לִזְנוּתָא וַאֲמַר יְהוּדָה אַפְּקוּהַ וְתִתּוֹקָד:", "onk_en": "About three months later, Yehudah was told, Tamar, your daughter-in-law, has been promiscuous, moreover, her promiscuity has resulted in pregnancy. Yehudah said, Take her out and let her be burned.", "pj": "וַהֲוָה בִּזְמַן תְּלַת יַרְחִין אִשְׁתְּמוֹדְעָא דִמְעַבְּרָא הִיא וְאִיתְנֵי לִיהוּדָה לְמֵימַר זַנְיָית תָּמָר כַּלְתֵךְ וְאוּף הָא מְעַבְּרָא לִזְנוּ וַאֲמַר יְהוּדָה הֲלָא בַּת כָּהֵן הִיא הַנְפָקוּהָא וְתִתּוֹקָד", "pj_en": "And it was at the time of three months, that she was known to be with child: and it was told to Jehuda, saying Tamar thy daughter--in--law hath committed fornication and, behold, she is with child by fornication. And Jehuda said, Is she not the daughter of a priest. Let her be brought forth and burned.", "tj": "", "tj_en": "", "rashi": "<b>כמשלש חדשים.<\/b> רֻבּוֹ שֶׁל רִאשׁוֹן וְרֻבּוֹ שֶׁל אַחֲרוֹן וְאֶמְצָעִי שָׁלֵם (נדה מ\"נ). וּלְשׁוֹן כְּמִשְׁלֹשׁ חֳדָשִׁים כְּהִשְׁתַּלֵּשׁ הַחֳדָשִׁים, כְּמוֹ וּמִשְׁלֹחַ מָנוֹת (אסתר ט'), מִשְׁלוֹחַ יָדָם (ישעיהו י\"א), וְכֵן תִּרְגֵּם אֻנְקְלוֹס כִּתְלָתוּת יַרְחַיָּא:<br><br><b>הרה לזנונים.<\/b> שֵׁם דָּבָר, מְעֻבֶּרֶת כְּמוֹ אִשָּׁה הָרָה, וּכְמוֹ בָּרָה כַּחַמָּה:<br><br><b>ותשרף.<\/b> אָמַר אֶפְרַיִם מִקְשָׁאָה מִשּׁוּם רַבִּי מֵאִיר, בִּתּוֹ שֶׁל שֵׁם הָיְתָה, שֶׁהוּא כֹהֵן, לְפִיכָךְ דָּנוּהָ בִשְׂרֵפָה:", "rashi_en": "כמשלש חדשים ABOUT THREE MONTHS AFTER — the greater part of the first, the greater part of the third and the entire middle (second) one (Genesis Rabbah 85:10). The expression כמשלש חדשים signifies “when the months repeated themselves three times”. The word משלש is similar in form to (Ester 9:19) “and sending (ומשלח) portions”; (Isaiah 11:14), “sending (משלח) forth their hand”. Onkelos renders it similarly כתלתות ירחיא (where תלתות is the infinitive of תַּלַּת “when the months become three”).<br><br>הרה לזנונים SHE IS WITH CHILD BY HARLOTRY — The word הרה is an adjective, meaning pregnant, like (Exodus 21:22) “a pregnant (הרה) woman” (where הרה can be only an adjective) and as (Song. 7:10) “Clear (ברה) as the sun” (where ברה is an adjective; Rashi perhaps quotes this example to prove also that הרה is from root הרר just as ברה is from ברר) <br><br>ותשרף AND LET HER BE BURNT — Ephraim the Disputant said in the name of Rabbi Meir: She was the daughter of Shem who was a priest (see Rashi on Genesis 14:18) on this account they sentenced her to be burnt (cf. Leviticus 21:9) (Genesis Rabbah 85:10). "}, {"ch": 38, "v": 25, "aliyah": 4, "heb": "הִ֣וא מוּצֵ֗את וְהִ֨יא שָׁלְחָ֤ה אֶל־חָמִ֙יהָ֙ לֵאמֹ֔ר לְאִישׁ֙ אֲשֶׁר־אֵ֣לֶּה לּ֔וֹ אָנֹכִ֖י הָרָ֑ה וַתֹּ֙אמֶר֙ הַכֶּר־נָ֔א לְמִ֞י הַחֹתֶ֧מֶת וְהַפְּתִילִ֛ים וְהַמַּטֶּ֖ה הָאֵֽלֶּה׃", "onk": "הִיא מִתַּפְּקָא וְהִיא שְׁלָחַת לַחֲמוּהָא לְמֵימַר לִגְבַר דִּי אִלֵּין דִּילֵיהּ <b>מִנֵּיהּ<\/b> אֲנָא מַעְדְּיָא וַאֲמֶרֶת אִשְׁתְּמוֹדַע <b>כְּעַן<\/b> לְמָן עִזְקְתָא וְשׁוֹשִׁפָּא וְחוּטְרָא הָאִלֵּין:", "onk_en": "She was being taken out, and she sent [word] to her father-in-law saying, By the man to whom these belong [<b>from him<\/b>] am I pregnant. She said, Please [<b>Now<\/b>] recognize to whom this signet, wrap and staff belong.", "pj": "תָּמָר מִתְאַפְקָא לְאִיתּוֹקְדָא וּבְעַת תְּלַת מַשְׁכּוֹנְיָא וְלָא אַשְׁכַּחְתְּנוּן תָּלַת עֵינָהָא לִשְׁמֵי מְרוֹמָא וְכֵן אָמְרַת בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ יְיָ עֲנֵי יָתִי בַּהֲדָא שַׁעְתָּא אַנַנְקִי וְאַנְהָר עַיְינִי וְאַשְׁכַּח תְּלַת סַהֲדֵי וַאֲנָא מְקַיְימָא לָךְ מִן חַרְצְיַי תְּלָתָא קַדִישַׁיָיא דְמִקַדְשִׁין שְׁמָךְ וְנַחְתִין לְאַתּוּן נוּרָא בְּבִקְעַת דוּרָא בֵּיהּ שַׁעְתָּא רָמַז קוּדְשָׁא בְּרִיךְ הוּא לְמִיכָאֵל וְאַנְהַר עַיְינָהּ וְאַשְׁכַּחְתּוּן וּנְסִיבַת יַתְהוֹן וְטַלְקַת יַתְהוֹן קָמֵי רִיגְלֵי דַיָינַיָא וַאֲמַרַת גַבְרָא דְאִלֵין מַשְׁכּוֹנְיָא דִידֵיהּ מִינֵיהּ אֲנָא מְעַבְּרָא וְאַף עַל גַב דַאֲנָא יָקְדָא לֵית אֲנָא מְפַרְסְמָא לֵיהּ בְּרָם מָרֵי עַלְמָא יִתֵּן בִּלְבָבֵיהּ דְיַכִּיר יַתְהוֹם וִישֵׁיזִיב יָתִי מִן דִינָא רַבָּא הָדֵין וְכֵיוַן דְחָמָא יַתְהוֹם יְהוּדָה אַכֵּר יַתְהוֹם בְּכֵן אָמַר בְּלִבֵּיהּ טַב לִי בָּהִית בְּעַלְמָא הָדֵין דְהוּא עָלַם עֲבִיר וְלָא נַבְהִית בְּאַנְפֵּי אַבְהָתִי צַדִיקַיָא בְּעַלְמָא דְאָתֵי טַב לִי יַקִיד בְּעַלְמָא הָדֵין בְּאֵישָׁא טַפְיָא וְלָא נֵיקַד בְּעַלְמָא דְאָתֵי בְּאֵישָׁא אָכְלָא אֵשָׁא דְמֵיכְלָא קָבֵיל מֵיכְלָא הוּא לְפוּם דְאַמָרִית לְיַעֲקב אַבָּא אַכַּר כְּדוֹן פַּרְגוֹדָא דִבְרָךְ לְפוּם כֵּן צְרָכִית לְמִשְׁמַע בְּבֵי דִינָא לְמַן אִינוּן סִיטוּמְתָּא וְחוֹטְיָא וְחוֹטְרַיָא הָאִלֵין", "pj_en": "Tamar was brought forth to be burned, and she searched for the three pledges, but found them not. Uplifiting her eyes to the heavens above, she thus said, Mercy I implore from Thee, O Lord: answer Thou me in this hour of need, and enlighten mine eyes to find the three witnesses; and I will dedicate unto Thee from my loins three saints who shall sanctify Thy name, and descend to the furnace of fire in the plain of Dura. In that hour the Holy One, blessed be He, signed to Michael, who enlightened her eyes, that she found (the witnesses) and took and cast them before the, feet of the judges, and said, The man to whom these pledges belong is he by whom I am with child. Yet though I may be burned I do not make him manifest: nevertheless the Lord of the world will cause him in his heart to acknowledged them, and will deliver me from this great judgment. Now when Jehuda saw them, he recognised them, and said in his heart, It is better for me to be ashamed in this world that passeth away, than be ashamed in the faces of my righteous fathers in the world to come. It is better that I burn in this world by a fire that is extinguished, than burn in the world to come with fire devouring fire. For measure is set against measure. This is according to that which I said to Jakob my father, Know now the robe of thy son; so am I now constrained to hear at the place of judgment, Whose are this seal and mantle and staff ?", "tj": "תָּמָר נַפְקַת לְמִיתּוֹקְדָא בְּנוּרָא וּבָעֵת תְּלָתָא סַהֲדֵי וְלָא אַשְׁכְּחַת יַתְהוֹן תָּלַת עַיְינָא לִמְרוֹמָא וַאֲמָרַת בְּבָעוּ בְּרַחֲמֵי מִן קֳדָמָךְ יְיָ אַתְּ הוּא יְיָ אֱלהִים דְעֲנֵי לַעֲיָיקַיָא בְּשַׁעַת עֲקַתְהוֹן עָנֵי יָתִי בַּהֲדָא שַׁעְתָּא דְהוּא שַׁעַת אֲנַנְקֵי וַאֲנָא מְקַיִמְנָא לָךְ תְּלָתָא צַדִיקִין בְּבִקְעַת דוּרָא חֲנַנְיָה מִישָׁאֵל וַעֲזַרְיָה בָּהּ בְּשַׁעְתָּא שְׁמַע מֵימְרֵיהּ דַיְיָ קַל צְלוֹתָהּ וַאֲמַר לְמִיכָאֵל חוּת וְהַב יַתְהוֹן לְהַנְהָרִין עֵינֵיהּ כַּד הֲוָה חֲמַת יַתְהוֹן נְסִיבַת יַתְהוֹן וְטַלְקַת יַתְהוֹן קֳדָם רִגְלוֹי דְדַיְינַיָא וַאֲמָרַת לְהוֹן גַבְרָא דְאִילֵין דִידֵיהּ מִנֵיהּ אֲנָא מְעַבְּרָא אַף עַל גַב דִיקִידָה לֵית אֲנָא מְפַרְסַיָא לֵיהּ בְּרַם רְחִיצָא אֲנָא בְּרִבּוֹן כָּל עַלְמַיָא יְיָ דְהוּא סָהִיד בֵּינִי וּבֵינֵיהּ דִיהַב בְּלִבֵּיהּ דְגַבְרָא דְאִלֵין דִידֵיהּ דְיַחְכִּים לְמַן עִזְקָתֵיהּ וְשׁוֹשִׁיפָא וְחוּטְרָא הָאִילֵין:", "tj_en": "Tamar was brought forth to be burned with fire; and she sought the three witnesses but found them not. She lifted up her eyes on high and said For mercy I pray before the Lord. Thou art He, o Lord God, who answerest the afflicted in the hour of their affliction ; answer me in this the hour of my affliction, and I will dedicate to thee three saints in the valley of Dura, Hananya, Mishael, and Azarya. In that hour the Word of the Lord heard the voice of her supplication and said to Mikael, Descend, and let her eyes have light....When she saw them, she took them, and cast before the feet of the judges, saying, By the man to whom these belong I am with child. But though I may be burned, I declare him not, but confide in the Ruler of all the world, the Lord who is witness between me and him, that He will give to the heart of the man to whom these belong, to acknowledge whose are these his ring, and mantle, and staff.", "rashi": "<b>הוא מוצאת.<\/b> לְהִשָּׂרֵף:<br><br><b>והיא שלחה אל חמיה.<\/b> לֹא רָצְתָה לְהַלְבִּין פָּנָיו וְלוֹמַר מִמְּךָ אֲנִי מְעֻבֶּרֶת, אֶלָּא לְאִישׁ אֲשֶׁר אֵלֶּה לּוֹ, אָמְרָה אִם יוֹדֶה יוֹדֶה מֵעַצְמוֹ, וְאִם לָאו, יִשְׂרְפוּנִי, וְאַל אַלְבִּין פָּנָיו. מִכָּאן אָמְרוּ נוֹחַ לוֹ לָאָדָם שֶׁיַּפִּילוּהוּ לְכִבְשַׁן הָאֵשׁ וְאַל יַלְבִּין פְּנֵי חֲבֵרוֹ בָּרַבִּים:<br><br><b>הכר נא.<\/b> אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה – הַכֵּר נָא בוֹרַאֲךָ, וְאַל תְּאַבֵּד שָׁלֹשׁ נְפָשׁוֹת:", "rashi_en": "הוא מוצאת WHEN SHE WAS BROUGHT FORTH to be burnt.<br><br>והיא שלחה אל חמיה SHE SENT TO HER FATHER-IN-LAW — she did not wish to put him to shame in public by saying “It is by thee that I am with child”, but she said only “By the man whose these are”. She thought: “if he is to acknowledge it, let him acknowledge it voluntarily, and if not, let them burn me and let me not put him to shame in public”. From this passage our Rabbis derived the teaching: Far better that a man should let himself be cast into a fiery furnace (even as Tamar was ready to be burnt to death) and let him not publicly put his fellow to shame (Sotah 10b).<br><br>הכר נא RECOGNISE, I PRAY THEE — The word נא is used as an expression of entreaty: Acknowledge (הכר) I beg of you, your Creator and do not destroy three lives (Genesis Rabbah 85:11). "}, {"ch": 38, "v": 26, "aliyah": 4, "heb": "וַיַּכֵּ֣ר יְהוּדָ֗ה וַיֹּ֙אמֶר֙ צָֽדְקָ֣ה מִמֶּ֔נִּי כִּֽי־עַל־כֵּ֥ן לֹא־נְתַתִּ֖יהָ לְשֵׁלָ֣ה בְנִ֑י וְלֹֽא־יָסַ֥ף ע֖וֹד לְדַעְתָּֽהּ׃", "onk": "וְאִשְׁתְּמוֹדַע יְהוּדָה וַאֲמַר זַכָּאָה מִנִּי <b>מַעְדְּיָא<\/b> אֲרֵי עַל כֵּן לָא יְהָבִתַּהּ לְשֵׁלָה בְרִי וְלָא אוֹסִיף עוֹד לְמִידְעַהּ:", "onk_en": "Yehudah recognized them and said, She is righteous, [it is] from me [<b>that she conceived<\/b>], inasmuch that I did not give her to my son Sheilah. He was not intimate with her any more.", "pj": "וְאַכֵּר יְהוּדָה וַאֲמַר זַכְיָא הִיא תָמָר מִינִי אִתְעַבָּרַת וּבְרַת קָלָא נַפְלַת מִשְׁמַיָיא וַאֲמַרַת דְמִן קֳדָמַי הֲוָה פִּתְגָמָא וְאִשְׁתְּזָבוּ תַּרְוֵיהוֹם מִן דִינָא וַאֲמַר בְּגִין דְלָא יְהַבְתָּהּ לְשֵׁלָה בְּרִי אִירַע יָתִי כְּדוֹן וְלָא אוֹסֵף תּוּב לְמֵידְעָהּ בְּמִשְׁכְּבָא", "pj_en": "And Jehuda, acknowledged and said, Tamar is innocent; she is with child by me. And the Bath kol fell from heaven, and said, From before Me was this thing done, and let both be delivered from judgment. And Jehuda said, Because I gave her not to Shela my son, hath this happened to me. But he added not to know her again.", "tj": "וְחַכֵּם יְהוּדָה תְּלָתָא סַהֲדוֹי וְקָם עַל רִיגְלוֹי וַאֲמַר בְּבָעוּ מִנְכוֹן אַחַי וֶאֱנָשֵׁי בַּיְיתֵיהּ דְאַבָּא קַבִּילוּ מִנִי בִּמְכִילָא דְאִינַשׁ מְכִיל בָּהּ מִתְכִּיל לֵיהּ בֵּין מְכִילָא טָבָא בֵּין מְכִילָא בִּישָׁא וְטוֹבוֹי דְכָל אִינַשׁ דִמְגַלֵי עוֹבְדוֹי עַל דִנְסִיבַת פַּרְגוֹדָא דְיוֹסֵף אָחִי וְאִצְבָּעִית יָתָהּ בְּאִידְמָא דִצְפִירָא וְקָרִיבִית יָתָהּ קֳדָם רִיגְלִי דְאַבָּא וַאֲמַר לֵיהּ חַכִּים כְּעַן הַפַּרְגוֹד דִבְרָךְ הוּא דָא אִילָא מְכִילָא לְקָבֵיל מְכִילָא סִדְרִין לְקָבֵיל סִדְרִין טַב לִי בָּהִית בְּעַלְמָא הָדֵין וְלָא בָּהִית לְעַלְמָא דַאֲתִי טַב לִי יָקַד בְּאֵישָׁא טַפְיָא וְלֵית אֲנָא יְקִיד בְּאֵישָׁא אָכְלָא אֵישָׁא זַכְּאַי הִיא תָּמָר כַּלָתִי בְּדִינָא מִנִי הִיא מְעַבְּרָא חַס לָהּ לְתָמָר כַּלָתִי לֵית הִיא מְעַבְּרָא בְּנִין דִזְנוּ בְּגִין כְּדֵין לָא אַסְבִית יָתָהּ לְשֵׁלָה בְּרִי בְּרַת קָלָא נַפְקַת מִן שְׁמַיָא וַאֲמָרַת תְּרֵיכוֹן זַכְוָן בְּדִינָא מִן קֳדָם יְיָ הֲוַת פִּתְגָמָא וְלָא אוֹסִיף תּוּב לְמֵיחֲכּוּם יָתָהּ:", "tj_en": "And Jehuda recognised the three witnesses, and arose upon his feet and said, I pray you, my brethren, and ye men of the house of my fathers, to hear me. With the measure that a man measureth shall it be measured to him; whether good measure of evil; and blessed is every man who confesseth his works. because I took the coat of Joseph my brother and dipped it into the blood of a goat, and brought it before the feet of my father and said to him, Know now whether this be thy son's coat or not, the measure is according to the measure, and the rule to the rule. Better is it for me to blush in this world than to blush in the world to come; better to burn with a fire that goes out, than to burn in the fire devouring fire. Let Tamar my daughter-in-law be spared. She hath not conceived a child by fornication, but because I did not give to her Shela my son. The Bath kol came foth from heaven, and said, Both of you are acquitted in the judgment. The thing was from the Lord. And he added not to know her.", "rashi": "<b>צדקה.<\/b> בִּדְבָרֶיהָ:<br><br><b>ממני.<\/b> הִיא מְעֻבֶּרֶת. וְרַבּוֹתֵינוּ ז\"ל דָּרְשׁוּ שֶׁיָּצְאָה בַת קוֹל וְאָמְרָה מִמֶּנִּי וּמֵאִתִּי יָצְאוּ הַדְּבָרִים, לְפִי שֶׁהָיְתָה צְנוּעָה בְּבֵית חָמִיהָ, גָּזַרְתִּי שֶׁיֵּצְאוּ מִמֶּנָּה מְלָכִים, וּמִשֵּׁבֶט יְהוּדָה גָּזַרְתִּי לְהַעֲמִיד מְלָכִים בְּיִשְׂרָאֵל:<br><br><b>כי על כן לא נתתיה.<\/b> כִּי בְּדִין עָשְׂתָה, עַל אֲשֶׁר לֹא נְתַתִּיהָ לְשֵׁלָה בְנִי:<br><br><b>ולא יסף עוד.<\/b> יֵשׁ אוֹמְרִים לֹא הוֹסִיף, וְיֵשׁ אוֹמְרִים לֹא פָסַק. וַחֲבֵרוֹ גַּבֵּי אֶלְדָּד וּמֵידָד, וְלֹא יָסָפוּ, וּמְתַרְגְּמִינָן וְלָא פְּסָקוּ:", "rashi_en": "צדקה SHE IS RIGHTEOUS (right) in what she has said<br><br>ממני FROM ME is she with child. Our Rabbis, of blessed memory, explained this to mean that a Bath-kol came forth and said the word ממני — from Me and by My agency have these things happened: because she proved herself a modest woman whilst in her father-in-law’s house I have ordained that kings shall be descended from her, and I have already ordained that I would raise up kings in Israel from the tribe of Judah (Genesis Rabbah 85:11) (therefore I have brought it about that these two persons who are to be the ancestors of kings should unite to become so).<br><br>כי על כן לא נתתיה BECAUSE THAT I GAVE HER NOT — For (כי) she has acted rightly, because (על כן) I did not give her to Shelah, my son.<br><br>ולא יסף עוד AND HE KNEW HER AGAIN NO MORE — Some explain that ולא יסף means he did not continue to know her (Sifrei Bamidbar 88): others explain that it means he did not cease to know her (Sotah 10b). An exactly similar instance occurs in reference to Eldad and Medad (Numbers 11:25), where ולא יספו which some translate “and they did not continue to prophesy” is translated in the Targum by “and they did not cease to prophesy”. "}, {"ch": 38, "v": 27, "aliyah": 4, "heb": "וַיְהִ֖י בְּעֵ֣ת לִדְתָּ֑הּ וְהִנֵּ֥ה תְאוֹמִ֖ים בְּבִטְנָֽהּ׃", "onk": "וַהֲוָה בְּעִדַּן דְּמֵילְדַהּ וְהָא תְיוֹמִין בִּמְעָהָא:", "onk_en": "When the time came for her to give birth, there were twins in her womb.", "pj": "וַהֲוָה בְּעִידַן מֵלְדָהּ וְהָא תְיוּמִין בִּמְעָהָא", "pj_en": "But it was in the time of her giving birth, that, behold, twins were in her womb.", "tj": "", "tj_en": "", "rashi": "<b>בעת לדתה.<\/b> וּבְרִבְקָה הוּא אוֹמֵר וַיִּמְלְאוּ יָמֶיהָ לָלֶדֶת? לְהַלָּן לִמְלֵאִים וְכָאן לַחֲסֵרִים:<br><br><b>והנה תאומים.<\/b> מָלֵא, וּלְהַלָּן תּוֹמִם חָסֵר, לְפִי שֶׁהָאֶחָד רָשָׁע, אֲבָל אֵלּוּ שְׁנֵיהֶם צַדִּיקִים:", "rashi_en": "בעת לדתה AT THE TIME OF HER BEARING — But in the case of Rebecca Scripture says (25:24) “And when her days to give birth were fulfilled” — in the latter case the months of pregnancy were complete, here, however, they were short of the full term (Genesis Rabbah 85:13).<br><br>והנה תאומים AND BEHOLD TWINS — Here the word is written plene (with א and י whilst there (in the case of Rebecca) it is written defective (תומם without these letters) because one (viz., Esau) was wicked, but here both were righteous (Genesis Rabbah 85:13). "}, {"ch": 38, "v": 28, "aliyah": 4, "heb": "וַיְהִ֥י בְלִדְתָּ֖הּ וַיִּתֶּן־יָ֑ד וַתִּקַּ֣ח הַמְיַלֶּ֗דֶת וַתִּקְשֹׁ֨ר עַל־יָד֤וֹ שָׁנִי֙ לֵאמֹ֔ר זֶ֖ה יָצָ֥א רִאשֹׁנָֽה׃", "onk": "וַהֲוָה בְּמֵילְדַהּ וִיהַב יְדָא וּנְסִיבַת חַיְתָא וּקְטָרַת עַל יְדֵיהּ זְהוֹרִיתָא לְמֵימַר דֵּין נְפַק קַדְמָאָה:", "onk_en": "As she was giving birth, one of them put out his hand. The midwife took it and tied a scarlet thread on his hand, saying, This one emerged first.", "pj": "וַהֲוָה בְּמוֹלְדָהּ וּפָשַׁט יוֹלְדָא יַת יְדֵיהּ וּנְסִיבַת חַיְיתָא וּקְטָרַת עַל יְדֵיהּ חוּט זְהוֹרִי לְמֵימָר דֵין נְפַק בְּקַדְמֵיתָא", "pj_en": "And it was in being born that the child stretched forth his hand; and the midwife took it, and bound it with a scarlet thread, saying, This came the first.", "tj": "", "tj_en": "", "rashi": "<b>ויתן יד.<\/b> הוֹצִיא הָאֶחָד יָדוֹ לַחוּץ, וּלְאַחַר שֶׁקָּשְׁרָה עַל יָדוֹ הַשָּׁנִי הֶחֱזִירָהּ:", "rashi_en": "ויתן יד THE ONE PUT OUT HIS HAND — one stretched forth his hand outside, and after she had bound the scarlet thread upon his hand he drew it back. "}, {"ch": 38, "v": 29, "aliyah": 4, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> כְּמֵשִׁ֣יב יָד֗וֹ וְהִנֵּה֙ יָצָ֣א אָחִ֔יו וַתֹּ֕אמֶר מַה־פָּרַ֖צְתָּ עָלֶ֣יךָ פָּ֑רֶץ וַיִּקְרָ֥א שְׁמ֖וֹ פָּֽרֶץ׃", "onk": "וַהֲוָה כַּד אֲתֵיב יְדֵיהּ וְהָא נְפַק אֲחוּהִי וַאֲמֶרֶת מָה תְקוֹף <b>סַגִּי<\/b> עֲלָךְ לְמִתְקָף וּקְרָא שְׁמֵיהּ פָּרֶץ:", "onk_en": "When he put back his hand, behold his brother emerged, and she said, With what [<b>great<\/b>] strength you have pushed yourself. He named him Peretz.", "pj": "וַהֲוָה כַּד אָתֵיב יוֹלְדָא יַת יְדֵיהּ וְהָא נְפַק אָחוֹי וַאֲמַרַת מַה תְּקוֹף סַגִי תְּקִיפְתָּא וְעָלָךְ אִית לְמִיתְקוֹף דְאַנְתְּ עָתִיד לְמֶחֱסַן מַלְכְּוָותָא וּקְרַת שְׁמֵיהּ פָּרֶץ", "pj_en": "And after the child had withdrawn his hand, behold, his brother came forth, and she said, With what great power hast thou prevailed, and for thee will it be to prevail; for thou wilt possess the kingdom. And she called his name Pharets.", "tj": "", "tj_en": "", "rashi": "<b>פרצת.<\/b> חָזַקְתָּ עָלֶיךָ חֹזֶק:", "rashi_en": "פרצת THOU HAST BURST FORTH — What a strong effort hast thou made!"}, {"ch": 38, "v": 30, "aliyah": 4, "heb": "וְאַחַר֙ יָצָ֣א אָחִ֔יו אֲשֶׁ֥ר עַל־יָד֖וֹ הַשָּׁנִ֑י וַיִּקְרָ֥א שְׁמ֖וֹ זָֽרַח׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבָתַר כֵּן נְפַק אֲחוּהִי דִּי עַל יְדֵיהּ זְהוֹרִיתָא וּקְרָא שְׁמֵיהּ זָרַח:", "onk_en": "Then his brother emerged—the one upon whose hand was the scarlet thread. He named him Zorach.", "pj": "וּבָתַר כְּדֵין נְפַק אָחוֹי דְעַל יְדֵיהּ קָטִיר חוּט זְהוֹרֵי וּקְרַת שְׁמֵיהּ זָרַח", "pj_en": "And afterward came forth his brother, upon whose hand was bound the scarlet thread, and she called his name Zarach.", "tj": "", "tj_en": "", "rashi": "<b>אשר על ידו השני.<\/b> אַרְבַּע יָדוֹת כְּתוּבוֹת כָּאן כְּנֶגֶד אַרְבָּעָה חֲרָמִים שֶׁמָּעַל עָכָן שֶׁיָּצָא מִמֶּנּוּ. וְיֵשׁ אוֹמְרִים כְּנֶגֶד אַרְבָּעָה דְבָרִים שֶׁלָּקַח, אַדֶּרֶת שִׁנְעָר וּשְׁתֵּי חֲתִיכוֹת כֶּסֶף שֶׁל מָאתַיִם שְׁקָלִים וּלְשׁוֹן זָהָב, בְּרֵאשִׁית רַבָּה:<br><br><b>ויקרא שמו זרח.<\/b> עַל שֵׁם זְרִיחַת מַרְאִית הַשָּׁנִי:", "rashi_en": "אשר על ידו השני THAT HAD THE SHINING RED THREAD UPON HIS HAND — The word יד is written here four times corresponding to the four acts of sacrilege which Achan, who was a descendant of Zarah, committed with his hand. Others say these correspond to the four things which he took with his hand of the spoil of Jericho: a Babylon garment, two hundred shekels, and a wedge of gold (Genesis Rabbah 85:14).<br><br>ויקרא שמו זרח AND HIS NAME WAS CALLED ZARAH — (bright, shining), because of the bright colour of the scarlet thread."}, {"ch": 39, "v": 1, "aliyah": 5, "heb": "וְיוֹסֵ֖ף הוּרַ֣ד מִצְרָ֑יְמָה וַיִּקְנֵ֡הוּ פּוֹטִיפַר֩ סְרִ֨יס פַּרְעֹ֜ה שַׂ֤ר הַטַּבָּחִים֙ אִ֣ישׁ מִצְרִ֔י מִיַּד֙ הַיִּשְׁמְעֵאלִ֔ים אֲשֶׁ֥ר הוֹרִדֻ֖הוּ שָֽׁמָּה׃", "onk": "וְיוֹסֵף אִתָּחַת לְמִצְרָיִם וּזְבָנֵיהּ פּוֹטִיפַר רַבָּא דְפַרְעֹה רַב קָטוֹלַיָּא גְּבַר מִצְרָאָה מִידָא <b>דַּעֲרָבָאֵי<\/b> דִּי אֲחִתוֹהִי לְתַמָּן:", "onk_en": "Yoseif was brought down to Egypt. He was purchased by Potiphar—an officer of Pharaoh, the chief of the slaughterers, an Egyptian—from the Yishmaelites [<b>Arabs<\/b>] who had brought him down there.", "pj": "וְיוֹסֵף אִיתָּחַת לְמִצְרַיִם וְזַבְּנֵיהּ פּוֹטִיפַר עַל דְחַמְיֵיהּ שַׁפִּיר בְּגִין לְמֶעֱבַד עִמֵיהּ מִשְׁכְּבֵיהּ דְכוּרָא וּמִן יַד אִתְגְזַר עֲלוֹי וְיָבִישׁוּ שַׁעַבְזוֹי וְאִסְתָּרַס וְהוּא רַבָּאֵי דְפַרְעה רַב סַפּוֹקְלַטוֹרְיָא גְבַר מִצְרָאֵי בְּעַרְבְנוּתָא מִן עַרְבָאֵי דְאַחֲתוֹהִי לְתַמָן", "pj_en": "But Joseph was brought down into Mizraim; and Potiphar, … a man of Mizraim, a chief of Pharoh, a chief of the executioners, bought him with the pledge of the Arabians who had brought him down thither.", "tj": "", "tj_en": "", "rashi": "<b>ויוסף הורד.<\/b> חוֹזֵר לְעִנְיָן רִאשׁוֹן, אֶלָּא שֶׁהִפְסִיק בּוֹ כְּדֵי לִסְמֹךְ יְרִידָתוֹ שֶׁל יְהוּדָה לִמְכִירָתוֹ שֶׁל יוֹסֵף לוֹמַר שֶׁבִּשְׁבִילוֹ הוֹרִידוּהוּ מִגְּדֻלָּתוֹ, וְעוֹד כְּדֵי לִסְמֹךְ מַעֲשֵׂה אִשְׁתּוֹ שֶׁל פּוֹטִיפַר לְמַעֲשֵׂה תָמָר לוֹמַר לְךָ, מַה זּוֹ לְשֵׁם שָׁמַיִם אַף זוֹ לְשֵׁם שָׁמַיִם, שֶׁרָאֲתָה בְאִצְטְרוֹלוֹגִין שֶׁלָּהּ שֶׁעֲתִידָה לְהַעֲמִיד בָּנִים מִמֶּנּוּ, וְאֵינָהּ יוֹדַעַת אִם מִמֶּנָּה אִם מִבִּתָּהּ:", "rashi_en": "ויוסף הורד AND JOSEPH WAS BROUGHT DOWN — It (Scripture) now reverts to the original subject (and consequently it states ויוסף הורד “Joseph had been brought down to Egypt” before the events last mentioned); it interrupted it only in order to connect the account of the degradation of Judah (Genesis 38:1) with that of the sale of Joseph, thus suggesting that it was on account of him (i.e. Joseph — Judah’s part in the sale of Joseph — ) that they (his brothers) degraded him from his high position. A further reason why this narrative of Judah and Tamar is interpolated here is to place in juxtaposition the story of Potiphar’s wife and the story of Tamar, suggesting that just as this woman (Tamar) acted out of pure motives so also the other (Potiphar’s wife) acted out of pure motives, for she foresaw by her astrological speculations that she was destined to be the ancestress of children by him (Joseph) — but she did not know whether these children were to be hers or her daughter’s (Genesis Rabbah 85:2). "}, {"ch": 39, "v": 2, "aliyah": 5, "heb": "וַיְהִ֤י יְהֹוָה֙ אֶת־יוֹסֵ֔ף וַיְהִ֖י אִ֣ישׁ מַצְלִ֑יחַ וַיְהִ֕י בְּבֵ֖ית אֲדֹנָ֥יו הַמִּצְרִֽי׃", "onk": "וַהֲוָה <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדֵּיהּ<\/b> דְּיוֹסֵף וַהֲוָה גְּבַר מַצְלָח וַהֲוָה בְּבֵית רִבּוֹנֵיהּ מִצְרָאָה:", "onk_en": "[<b>The Word of<\/b>] Adonoy was with Yoseif[<b>’s support<\/b>], and he was successful. He was [a servant] in the house of his master, the Egyptian.", "pj": "וַהֲוָה מֵימְרָא דַיְיָ בְּסַעֲדָא דְיוֹסֵף וַהֲוָה גְבַר מַצְלָח וַהֲוָה בְּבֵית רִבּוֹנֵיהּ מִצְרָאֵי", "pj_en": "And the Word of the Lord was Joseph's Helper, and he became a prosperous man in the house of his Mizraite master.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 3, "aliyah": 5, "heb": "וַיַּ֣רְא אֲדֹנָ֔יו כִּ֥י יְהֹוָ֖ה אִתּ֑וֹ וְכֹל֙ אֲשֶׁר־ה֣וּא עֹשֶׂ֔ה יְהֹוָ֖ה מַצְלִ֥יחַ בְּיָדֽוֹ׃", "onk": "וַחֲזָא רִבּוֹנֵיהּ אֲרֵי <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדֵּיהּ<\/b> וְכֹל דִּי הוּא עָבֵד יְיָ מַצְלַח בִּידֵיהּ:", "onk_en": "His master saw that [<b>the Word of<\/b>] Adonoy was with him [<b>supported him<\/b>], and that whatever he did, Adonoy made it succeed through his hand.", "pj": "וַחֲמָא רִבּוֹנֵיהּ אֲרוּם מֵימְרָא דַיְיָ הֲוָה בְּסַעֲדֵיהּ וְכָל דְהוּא עָבִיד יְיָ מַצְלַח בִּידֵיהּ", "pj_en": "And his master saw that the Word of the Lord was his Helper, and that the Lord prospered in his hand all that he did;", "tj": "", "tj_en": "", "rashi": "<b>כי ה' אתו.<\/b> שֵׁם שָׁמַיִם שָׁגוּר בְּפִיו:", "rashi_en": "כי ה‘ אתו THAT THE LORD WAS WITH HIM — the name of God was a familiar word in his mouth (Midrash Tanchuma, Vayeshev 8)."}, {"ch": 39, "v": 4, "aliyah": 5, "heb": "וַיִּמְצָ֨א יוֹסֵ֥ף חֵ֛ן בְּעֵינָ֖יו וַיְשָׁ֣רֶת אֹת֑וֹ וַיַּפְקִדֵ֙הוּ֙ עַל־בֵּית֔וֹ וְכׇל־יֶשׁ־ל֖וֹ נָתַ֥ן בְּיָדֽוֹ׃", "onk": "וְאַשְׁכַּח יוֹסֵף רַחֲמִין בְּעֵינוֹהִי וְשַׁמֵּשׁ יָתֵיהּ וּמַנְיֵהּ עַל בֵּיתֵיהּ וְכָל דִּי אִית לֵיהּ מְסַר בִּידֵיהּ:", "onk_en": "Yoseif found favor in his eyes, and he served him personally. He appointed him supervisor over his household, and all that he possessed he placed in his hand.", "pj": "וְאַשְׁכַּח יוֹסֵף רַחֲמִין בְּעֵינוֹי וְשַׁמֵשׁ יָתֵיהּ וּמַנְיֵיהּ אַפַּטְרוֹפּוֹס עַל בַּיְיתֵיהּ וְכָל דְאִית לֵיהּ מָסַר בִּידֵיהּ", "pj_en": "and Joseph found favour in his eyes, and he served him, and he appointed him superintendent over his house, and all that he had he delivered in his hands.", "tj": "וּמַנֵי יָתֵיהּ אַפִּיטְרוֹפּוֹס:", "tj_en": "And he appointed him superintendent.", "rashi": "<b>וכל יש לו.<\/b> הֲרֵי לָשׁוֹן קָצָר, חָסֵר \"אֲשֶׁר\":", "rashi_en": "וכל יש לו AND ALL THAT HE HAD — This is an elliptical phrase — the word אשר is omitted after."}, {"ch": 39, "v": 5, "aliyah": 5, "heb": "וַיְהִ֡י מֵאָז֩ הִפְקִ֨יד אֹת֜וֹ בְּבֵית֗וֹ וְעַל֙ כׇּל־אֲשֶׁ֣ר יֶשׁ־ל֔וֹ וַיְבָ֧רֶךְ יְהֹוָ֛ה אֶת־בֵּ֥ית הַמִּצְרִ֖י בִּגְלַ֣ל יוֹסֵ֑ף וַיְהִ֞י בִּרְכַּ֤ת יְהֹוָה֙ בְּכׇל־אֲשֶׁ֣ר יֶשׁ־ל֔וֹ בַּבַּ֖יִת וּבַשָּׂדֶֽה׃", "onk": "וַהֲוָה מֵעִדַּן דְּמַנֵּי יָתֵיהּ בְּבֵיתֵיהּ וְעַל כָּל דִּי אִית לֵיהּ וּבָרִיךְ יְיָ יָת בֵּית מִצְרָאָה בְּדִיל יוֹסֵף וַהֲוָה בִּרְכְּתָא דַיְיָ בְּכָל דִּי אִית לֵיהּ בְּבֵיתָא וּבְחַקְלָא:", "onk_en": "From the time he appointed him supervisor over his household and over all that he possessed, Adonoy blessed the house of the Egyptian for Yoseif’s sake. The blessing of Adonoy was in all that he possessed, in the house and in the field.", "pj": "וַהֲוָה מֵעִידָן דְמַנְיֵיהּ אַפַּטְרוֹפּוֹס עַל בַּיְיתֵיהּ וְעַל כָּל דְאִית לֵיהּ וּבְרִיךְ יְיָ יַת בֵּית מִצְרָאֵי בְּגִין זְכוּתֵיהּ דְיוֹסֵף וַהֲוָה בִּירְכָתָא דַיְיָ בְּכָל מַה דְאִית לֵיהּ בְּבֵיתָא וּבְחַקְלָא", "pj_en": "And it was from the time he appointed him superintendent over his house, and over all that he had, the Lord prospered the house of the Mizraite for the sake of the righteousness of Joseph, and the blessing of the Lord was on all that he had in the house and in the field.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 6, "aliyah": 5, "heb": "וַיַּעֲזֹ֣ב כׇּל־אֲשֶׁר־לוֹ֮ בְּיַד־יוֹסֵף֒ וְלֹא־יָדַ֤ע אִתּוֹ֙ מְא֔וּמָה כִּ֥י אִם־הַלֶּ֖חֶם אֲשֶׁר־ה֣וּא אוֹכֵ֑ל וַיְהִ֣י יוֹסֵ֔ף יְפֵה־תֹ֖אַר וִיפֵ֥ה מַרְאֶֽה׃", "onk": "וּשְׁבַק כָּל דִּי לֵיהּ בִּידָא דְיוֹסֵף וְלָא יְדַע עִמֵּיהּ מִדַּעַם אֶלָּהֵין לַחְמָא דִּי הוּא אָכֵל וַהֲוָה יוֹסֵף שַׁפִּיר בְּרֵיוָא וְיָאֵי בְחֶזְוָא:", "onk_en": "He left everything he possessed in the hand of Yoseif. He did not concern himself with anything about him, except for the bread he ate. Yoseif was well-built and good looking.", "pj": "וּשְׁבַק כָּל דְאִית לֵיהּ בִּידָא דְיוֹסֵף וְלָא יְדַע עִמֵיהּ מִדַעַם אֱלָהֵן אִנְתְּתֵיהּ דִשְׁכִיב גַבָּהּ וַהֲוָה יוֹסֵף שַׁפִּיר בְּרֵיוָא וְיָאִי בְּחֶזְוָא", "pj_en": "And he left all that he had in Joseph's hand, and took no knowledge of anything of his, except his wife with whom he lay. And Joseph was of goodly form and beautiful aspect.", "tj": "", "tj_en": "", "rashi": "<b>ולא ידע אתו מאומה.<\/b> לֹא הָיָה נוֹתֵן לִבּוֹ לִכְלוּם:<br><br><b>כי אם הלחם.<\/b> הִיא אִשְׁתּוֹ, אֶלָּא שֶׁדִּבֵּר בְּלָשׁוֹן נְקִיָּה:<br><br><b>ויהי יוסף יפה תואר.<\/b> כֵּיוָן שֶׁרָאָה עַצְמוֹ מוֹשֵׁל, הִתְחִיל אוֹכֵל וְשׁוֹתֶה וּמְסַלְסֵל בְּשַׂעֲרוֹ, אָמַר הַקָּבָּ\"ה אָבִיךָ מִתְאַבֵּל וְאַתָּה מְסַלְסֵל בִּשְׂעָרְךָ, אֲנִי מְגָרֶה בְךָ אֶת הַדֹּב, מִיָּד:", "rashi_en": "AND HE KNEW NOT AUGHT HE HAD — he paid no attention to anything.<br><br>כי אם הלחם SAVE THE BREAD — this means his wife, but Scripture uses here a euphemism (Genesis Rabbah 86:6) (cf. Joseph’s own words in Genesis 39:9).<br><br>ויהי יוסף יפה תאר AND JOSEPH WAS OF BEAUTIFUL FORM — As soon as he saw that he was ruler (in the house) he began to eat and drink and curl his hair. The Holy One, blessed be He, said to him, “Your father is mourning and you curl your hair! I will let a bear loose against you” (Midrash Tanchuma, Vayeshev 8). Immediately."}, {"ch": 39, "v": 7, "aliyah": 6, "heb": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וַתִּשָּׂ֧א אֵֽשֶׁת־אֲדֹנָ֛יו אֶת־עֵינֶ֖יהָ אֶל־יוֹסֵ֑ף וַתֹּ֖אמֶר שִׁכְבָ֥ה עִמִּֽי׃", "onk": "וַהֲוָה בָּתַר פִּתְגָּמַיָּא הָאִלֵּין וּזְקָפַת אִתַּת רִבּוֹנֵיהּ יָת עֵינָהָא לְיוֹסֵף וַאֲמֶרֶת שְׁכוּב עִמִּי:", "onk_en": "After these events, his master’s wife cast her eyes upon Yoseif, and she said, Be with me.", "pj": "וַהֲוָה בָּתַר פִּתְגָמַיָא הָאִלֵין וּזְקָפַת אִתַּת רִבּוֹנֵיהּ יַת עֵינָהּ בְּיוֹסֵף וַאֲמָרַת שְׁכוֹב עִמִי", "pj_en": "And it was after these things that the wife of his master lifted up her eyes to Joseph, and said, Lie with me.", "tj": "", "tj_en": "", "rashi": "<b>ותשא אשת אדוניו וגו'.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר אַחַר סָמוּךְ:", "rashi_en": "ותשא אשת אדניו HIS LORD’S WIFE LIFTED UP HER EYES etc. — wherever אחר is used and not אחרי it means immediately after (Genesis Rabbah 44:5). "}, {"ch": 39, "v": 8, "aliyah": 6, "heb": "וַיְמָאֵ֓ן&thinsp;<b>׀<\/b> וַיֹּ֙אמֶר֙ אֶל־אֵ֣שֶׁת אֲדֹנָ֔יו הֵ֣ן אֲדֹנִ֔י לֹא־יָדַ֥ע אִתִּ֖י מַה־בַּבָּ֑יִת וְכֹ֥ל אֲשֶׁר־יֶשׁ־ל֖וֹ נָתַ֥ן בְּיָדִֽי׃", "onk": "וְסָרֵיב וַאֲמַר לְוַת אִתַּת רִבּוֹנֵיהּ הָא רִבּוֹנִי לָא יְדַע עִמִּי מָה דִבְבֵיתָא וְכָל דִּי אִית לֵיהּ מְסַר בִּידִי:", "onk_en": "He refused and said to his master’s wife, Behold, my master knows nothing about what I am doing in the house, and all that he possess, he has placed in my hands.", "pj": "וְסָרִיב לְמִקַרְבַיָא לְגַבָּה וַאֲמַר לְאִתַּת רִבּוֹנֵיהּ הָא רִבּוֹנִי לָא יְדַע עִמִי מִדַעַם מַה בְּבֵיתָא וְכָל דְאִית לֵיהּ מָסַר בִּידִי", "pj_en": "But he refused to come near her, and said to his master's wife, Behold, my master taketh no knowledge of what is with me in the house, and all he hath he delivereth into my hand;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 9, "aliyah": 6, "heb": "אֵינֶ֨נּוּ גָד֜וֹל בַּבַּ֣יִת הַזֶּה֮ מִמֶּ֒נִּי֒ וְלֹֽא־חָשַׂ֤ךְ מִמֶּ֙נִּי֙ מְא֔וּמָה כִּ֥י אִם־אוֹתָ֖ךְ בַּאֲשֶׁ֣ר אַתְּ־אִשְׁתּ֑וֹ וְאֵ֨יךְ אֶֽעֱשֶׂ֜ה הָרָעָ֤ה הַגְּדֹלָה֙ הַזֹּ֔את וְחָטָ֖אתִי לֵֽאלֹהִֽים׃", "onk": "לֵיתוֹהִי רַב בְּבֵיתָא הָדֵין מִנִּי וְלָא מְנַע מִנִּי מִדַּעַם אֶלָּהֵין יָתִיךְ בְּדִיל אַתְּ אִתְּתֵיהּ וְאֶכְדֵּין אֶעְבֵּיד בִּישְׁתָא רַבְּתָא הָדָא וְאֵחוֹב <b>קֳדָם<\/b> יְיָ:", "onk_en": "No one in this house is greater than me. He has not withheld anything from me other than you, for you are his wife. How can I do such a great evil, and sin against [<b>before<\/b>] God.", "pj": "לַיְיתֵיהּ רַב בְּבֵיתָא הָדֵין מִינִי וְלָא מְנַע מִנִי מִדַעַם אֱלָהֵין יָתָךְ מִן בִּגְלַל דְאַנְתְּ אִינְתְּתֵיהּ וְאֵיכְדֵין אֶעֱבִיד בִּשְׁתָּא רַבְּתָא הָדָא וְאֵחוּב קֳדָם יְיָ", "pj_en": "there is none in the house greater than I nor hath he restricted me from anything but thyself, because thou art his wife: and how can I do this great wickedness, and become guilty before the Lord ?", "tj": "", "tj_en": "", "rashi": "<b>וחטאתי לאלהים.<\/b> בְּנֵי נֹחַ נִצְטַוּוּ עַל הָעֲרָיוֹת:", "rashi_en": "וחטאתי לאלהים AND SIN AGAINST GOD — The “Sons of Noah” (בני נח) were subject to the command which forbade immorality (Sanhedrin 56b). "}, {"ch": 39, "v": 10, "aliyah": 6, "heb": "וַיְהִ֕י כְּדַבְּרָ֥הּ אֶל־יוֹסֵ֖ף י֣וֹם&thinsp;<small>׀<\/small>&thinsp;י֑וֹם וְלֹא־שָׁמַ֥ע אֵלֶ֛יהָ לִשְׁכַּ֥ב אֶצְלָ֖הּ לִהְי֥וֹת עִמָּֽהּ׃", "onk": "וַהֲוָה כַּד מַלֵּילַת עִם יוֹסֵף יוֹם יוֹם וְלָא <b>קַבִּיל<\/b> מִנַּהּ לְמִשְׁכַּב לְוָתַהּ לְמֶהֱוֵי עִמַּהּ:", "onk_en": "Even though she spoke to Yoseif every day, he would not listen to [<b>obey<\/b>] her, to lie next to her, [nor] to be with her.", "pj": "וַהֲוָה כְּדֵי מַלִילַת עִם יוֹסֵף יוֹמָא דֵין וְיוֹם מָחְרָא וְלָא קַבֵּיל מִינָהּ לְמִשְׁכּוּב גַבָּהּ לְמֶהֱוֵי מִתְחַיֵיב עִמָהּ בְּיוֹם דִינָא רַבָּא לְעַלְמָא דְאָתֵי", "pj_en": "And it was when she spake with Joseph this day and the next, and be hearkened not to her to lie with her, lest with her be should be condemned in the day of the great judgment of the world to come;", "tj": "", "tj_en": "", "rashi": "<b>לשכב אצלה.<\/b> אֲפִלּוּ בְלֹא תַשְׁמִישׁ:<br><br><b>להיות עמה.<\/b> לָעוֹלָם הַבָּא:", "rashi_en": "לשכב אצלה TO LIE BY HER — even without sinning (Genesis Rabbah 87:6).<br><br>להיות עמה  TO BE WITH HER, in the world to come (Gehinnom) (Genesis Rabbah 87:6). "}, {"ch": 39, "v": 11, "aliyah": 6, "heb": "וַֽיְהִי֙ כְּהַיּ֣וֹם הַזֶּ֔ה וַיָּבֹ֥א הַבַּ֖יְתָה לַעֲשׂ֣וֹת מְלַאכְתּ֑וֹ וְאֵ֨ין אִ֜ישׁ מֵאַנְשֵׁ֥י הַבַּ֛יִת שָׁ֖ם בַּבָּֽיִת׃", "onk": "וַהֲוָה בְּיוֹמָא הָדֵין וְעַל לְבֵיתָא <b>לְמִבְדַּק בְּכִתְבֵי חָשְׁבְּנֵיהּ<\/b> וְלֵית אֱנַשׁ מֵאֲנָשֵׁי בֵיתָא תַּמָּן בְּבֵיתָא:", "onk_en": "It was on such a day, that he came to the house to do his work [<b>examine the recordings of his accounts<\/b>]. No man of the household was there in the house.", "pj": "וַהֲוָה בְּיוֹמָא הָדֵין וְעַל לְבֵיתָא לְמֵיבְחוּשׁ בְּפִנְקְסֵי חוּשְׁבָּנֵיהּ וְלֵית אֱנַשׁ מֵאִינְשֵׁי בֵיתָא תַּמָן בְּבֵיתָא", "pj_en": "it was on a certain day that he entered the house to examine the tablets of his accounts, and there was no man of the house within;", "tj": "", "tj_en": "", "rashi": "<b>ויהי כהיום הזה.<\/b> כְּלוֹמַר וַיְהִי כַּאֲשֶׁר הִגִּיעַ יוֹם מְיֻחָד, יוֹם צְחוֹק, יוֹם אֵיד שֶׁלָּהֶם, שֶׁהָלְכוּ כֻּלָּם לְבֵית עֲ\"זָ, אָמְרָה אֵין לִי יוֹם הָגוּן לְהִזָּקֵק לְיוֹסֵף כְּהַיּוֹם הַזֶּה, אָמְרָה לָהֶם חוֹלָה אֲנִי וְאֵינִי יְכוֹלָה לֵילֵךְ (תַּנְחוּמָא):<br><br><b>לעשות מלאכתו.<\/b> רַב וּשְׁמוּאֵל, חַד אָמַר מְלַאכְתּוֹ מַמָּשׁ, וְחַד אָמַר לַעֲשׂוֹת צְרָכָיו עִמָּהּ, אֶלָּא שֶׁנִּרְאֵית לוֹ דְּמוּת דְּיוּקְנוֹ שֶׁל אָבִיו וכו' כִּדְאִיתָא בְּמַסֶּכֶת סוֹטָה (דף ל\"ו):", "rashi_en": "ויהי כהיום הזה AND IT CAME TO PASS ON A CERTAIN DAY — This means as much as “and it came to pass when a certain distinguished day arrived” — a day of merriment, a day of their sacred feast when they all went to the temple of their idols, — she said), “I shall find no day fitting to associate with Joseph as this day”. She therefore told her attendants I am sick and cannot go to the temple (Sotah 36b).<br><br>לעשות מלאכתו TO DO HIS WORK — Rab and Samuel differ as to what this means. One holds that it means, his actual house-work; the other that it means to associate with her, but a vision of his father’s face appeared to him and he resisted temptation and did not sin as is stated in Treatise Sotah 36b."}, {"ch": 39, "v": 12, "aliyah": 6, "heb": "וַתִּתְפְּשֵׂ֧הוּ בְּבִגְד֛וֹ לֵאמֹ֖ר שִׁכְבָ֣ה עִמִּ֑י וַיַּעֲזֹ֤ב בִּגְדוֹ֙ בְּיָדָ֔הּ וַיָּ֖נׇס וַיֵּצֵ֥א הַחֽוּצָה׃", "onk": "וַאֲחִדְתֵּיהּ בִּלְבוּשֵׁיהּ לְמֵימַר שְׁכוּב עִמִּי וְשָׁבְקֵיהּ לִלְבוּשֵׁיהּ בִּידַהּ וַעֲרַק וּנְפַק <b>לְשׁוּקָא<\/b>:", "onk_en": "She grabbed him by his garment, saying, Be with me. He left his garment in her hand, and fled, and he went outside [<b>to the marketplace<\/b>].", "pj": "וְאַחַדְתֵּיהּ בִּלְבוּשֵׁיהּ לְמֵימַר שְׁכוּב עִמִי וְשַׁבְקֵיהּ לִלְבוּשֵׁיהּ בִּידָהּ וְאָפַק לְשׁוּקָא", "pj_en": "that she caught him by his garment, saying, Lie with me: and he left his garment in her hand, and went forth into the street.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 13, "aliyah": 6, "heb": "וַֽיְהִי֙ כִּרְאוֹתָ֔הּ כִּֽי־עָזַ֥ב בִּגְד֖וֹ בְּיָדָ֑הּ וַיָּ֖נׇס הַחֽוּצָה׃", "onk": "וַהֲוָה כַּד חֲזַת אֲרֵי שָׁבְקֵיהּ לִלְבוּשֵׁיהּ בִּידַהּ וַעֲרַק לְשׁוּקָא:", "onk_en": "It was when she saw that he left his garment in her hand and had fled outside [<b>to the marketplace<\/b>],", "pj": "וַהֲוָה כְּדִי חָמַת אֲרוּם שָׁבַק לִלְבוּשֵׁיהּ בִידָהּ וְאָפַק לְשׁוּקָא", "pj_en": "And when she saw that he had left his garment in her hand, and had gone forth into the street,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 14, "aliyah": 6, "heb": "וַתִּקְרָ֞א לְאַנְשֵׁ֣י בֵיתָ֗הּ וַתֹּ֤אמֶר לָהֶם֙ לֵאמֹ֔ר רְא֗וּ הֵ֥בִיא לָ֛נוּ אִ֥ישׁ עִבְרִ֖י לְצַ֣חֶק בָּ֑נוּ בָּ֤א אֵלַי֙ לִשְׁכַּ֣ב עִמִּ֔י וָאֶקְרָ֖א בְּק֥וֹל גָּדֽוֹל׃", "onk": "וּקְרַת לַאֲנָשֵׁי בֵיתַהּ וַאֲמֶרֶת לְהוֹן לְמֵימַר חֲזוֹ אַיְתִי לָנָא גַּבְרָא עִבְרָאָה לְחַיָּכָא בָנָא עַל לְוָתִי לְמִשְׁכַּב עִמִּי וּקְרֵית בְּקָלָא רַבָּא:", "onk_en": "that she called to the men of the household and said to them, See, he brought us a Hebrew man to mock us. He came to be with me, and I called out in a loud voice.", "pj": "וְרָמַת חֶלְבּוֹנָא דְבֵיעָתָא בְּדַרְגְשָׁא וּקְרַת לְאַנְשֵׁי בֵיתָהּ וַאַמַרַת חָמוּן שִׁכְבַת זַרְעָא דְאַטִיל דֵין דְאַיְיתִי רִיבּוֹנְכוֹן לָנָא גְבַר עִבְרָאֵי לְמִגְחוֹךְ בָּנָא עַל לְוָתִי לְמִשְׁכּוֹב עִמִי וּקְרִית בְּקָלָא רָמָא", "pj_en": "that she called the men of the house and said, See this, ___ which the Hebrew man hath done whom your master hath brought to mock us. He came in to lie with me, and I cried with a high voice.", "tj": "", "tj_en": "", "rashi": "<b>ראו הביא לנו.<\/b> הֲרֵי זֶה לָשׁוֹן קְצָרָה – הֵבִיא לָנוּ, וְלֹא פֵּרֵשׁ מִי הֱבִיאוֹ, וְעַל בַּעֲלָהּ אוֹמֶרֶת כֵּן:<br><br><b>עברי.<\/b> מֵעֵבֶר הַנָּהָר, מִבְּנֵי עֵבֶר (בראשית רבה):", "rashi_en": "ראו הביא לנו SEE, HE HATH BROUGHT IN UNTO US — This is an elliptical phrase: “he hath brought in to us” without stating plainly who brought him in She was referring to her husband. <br><br>עברי A HEBREW — is one who came from the other side (עבר) of the river Euphrates, being at the same time of the sons of Eber (אדניו)."}, {"ch": 39, "v": 15, "aliyah": 6, "heb": "וַיְהִ֣י כְשׇׁמְע֔וֹ כִּֽי־הֲרִימֹ֥תִי קוֹלִ֖י וָאֶקְרָ֑א וַיַּעֲזֹ֤ב בִּגְדוֹ֙ אֶצְלִ֔י וַיָּ֖נׇס וַיֵּצֵ֥א הַחֽוּצָה׃", "onk": "וַהֲוָה כַד שְׁמַע אֲרֵי אֲרֵימִית קָלִי וּקְרֵית וְשָׁבְקֵיהּ לִלְבוּשֵׁיהּ לְוָתִי וַעֲרַק וּנְפַק <b>לְשׁוּקָא<\/b>:", "onk_en": "When he heard that I raised my voice and cried out, he left his garment with me, and fled and went outside [<b>to the marketplace<\/b>].", "pj": "וַהֲוָהּ כַד שָׁמַע אֲרוּם אֲרֵימִית קָלִי וּקְרִית וְשָׁבַק יַת לְבוּשֵׁיהּ לְוָתִי וְאָפַק לְשׁוּקָא", "pj_en": "And when he heard that I lifted up my voice, he left his garment with me, and went forth into the street.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 16, "aliyah": 6, "heb": "וַתַּנַּ֥ח בִּגְד֖וֹ אֶצְלָ֑הּ עַד־בּ֥וֹא אֲדֹנָ֖יו אֶל־בֵּיתֽוֹ׃", "onk": "וַאֲחִתְּתֵיהּ לִלְבוּשֵׁיהּ לְוָתַהּ עַד דְּעַל רִבּוֹנֵיהּ לְבֵיתֵיהּ:", "onk_en": "She laid his garment near her until his master came home.", "pj": "וְאַנְחַת לְבוּשֵׁיהּ גַבָּהּ עַד דְעַל רִבּוֹנֵיהּ לְבַיְיתֵיהּ", "pj_en": "And she let the garment remain until his master came into his house;", "tj": "", "tj_en": "", "rashi": "<b>אדניו.<\/b> שֶׁל יוֹסֵף:", "rashi_en": "אדניו HIS MASTER — Joseph’s master (not the master or owner of the garment). "}, {"ch": 39, "v": 17, "aliyah": 6, "heb": "וַתְּדַבֵּ֣ר אֵלָ֔יו כַּדְּבָרִ֥ים הָאֵ֖לֶּה לֵאמֹ֑ר בָּֽא־אֵלַ֞י הָעֶ֧בֶד הָֽעִבְרִ֛י אֲשֶׁר־הֵבֵ֥אתָ לָּ֖נוּ לְצַ֥חֶק בִּֽי׃", "onk": "וּמַלֵּילַת עִמֵּיהּ כְּפִתְגָּמַיָּא הָאִלֵּין לְמֵימָר עַל לְוָתִי עַבְדָא עִבְרָאָה דִּי אַיְתֵיתָא לָנָא לְחַיָּכָא בִי:", "onk_en": "She spoke to him [her husband] according to these words, saying, The Hebrew slave came to me—the same one you brought into us—[he came to] mock me.", "pj": "וּמַלִילַת לֵיהּ כְּפִתְגָמַיָא הָאִלֵין לְמֵימַר עַל לְוָתִי עַבְדָא עִבְרָאֵי דְאַיְיתֵיתָא לָנָא לְמִגְחוֹךְ בִּי", "pj_en": "and she spake to him according to these words, saying The Hebrew servant whom thou broughtest to us came in to me to mock me.", "tj": "", "tj_en": "", "rashi": "<b>בא אלי.<\/b> לְצַחֶק בִּי הָעֶבֶד הָעִבְרִי אֲשֶׁר הֵבֵאתָ לָּנוּ:", "rashi_en": "בא אלי —The sentence means: the Hebrew servant whom thou hast brought unto us came to me to have his sport with me. "}, {"ch": 39, "v": 18, "aliyah": 6, "heb": "וַיְהִ֕י כַּהֲרִימִ֥י קוֹלִ֖י וָאֶקְרָ֑א וַיַּעֲזֹ֥ב בִּגְד֛וֹ אֶצְלִ֖י וַיָּ֥נׇס הַחֽוּצָה׃", "onk": "וַהֲוָה כַּד אֲרֵימִית קָלִי וּקְרֵית וְשָׁבְקֵיהּ לִלְבוּשֵׁיהּ לְוָתִי וַעֲרַק <b>לְשׁוּקָא<\/b>:", "onk_en": "When I raised my voice and cried out, he left his garment with me and fled outside [<b>to the marketplace<\/b>].", "pj": "וַהֲוָה כַּד אֲרֵימִית קָלִי וּקְרֵית וְשַׁבְקֵיהּ לִלְבוּשֵׁיהּ לְוָתִי וְעָרִיק לְשׁוּקָא", "pj_en": "", "tj": "וַהֲוָה כַּד אַרְעִימִית קָלִי:", "tj_en": "And it was when I thundered with my voice.", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 19, "aliyah": 6, "heb": "וַיְהִי֩ כִשְׁמֹ֨עַ אֲדֹנָ֜יו אֶת־דִּבְרֵ֣י אִשְׁתּ֗וֹ אֲשֶׁ֨ר דִּבְּרָ֤ה אֵלָיו֙ לֵאמֹ֔ר כַּדְּבָרִ֣ים הָאֵ֔לֶּה עָ֥שָׂה לִ֖י עַבְדֶּ֑ךָ וַיִּ֖חַר אַפּֽוֹ׃", "onk": "וַהֲוָה כַד שְׁמַע רִבּוֹנֵיהּ יָת פִּתְגָּמֵי אִתְּתֵיהּ דִּי מַלֵּילַת עִמֵּיהּ לְמֵימַר כְּפִתְגָּמַיָּא הָאִלֵּין עֲבַד לִי עַבְדָּךְ וּתְקֵף רָגְזֵיהּ:", "onk_en": "When his master heard the words of his wife which she spoke to him, saying, Your slave did such things to me, he became furious.", "pj": "וַהֲוָה כְּדִי שְׁמַע רִבּוֹנֵיהּ יַת פִּתְגָמֵי אִנְתְּתֵיהּ דְמַלִילַת עִמֵיהּ לְמֵימַר כְּפִתְגָמַיָא הָאִלֵין עָבַד לִי עַבְדָךְ וּתְקֵיף רוּגְזֵיהּ", "pj_en": "And when his master heard the words which his wife spake with him, saying, According to these things did thy servant to me, his wrath became strong.", "tj": "", "tj_en": "", "rashi": "<b>ויהי כשמע אדניו וגו'.<\/b> בִּשְׁעַת תַּשְׁמִישׁ אָמְרָה לוֹ כֵן, וְזֶהוּ שֶׁאָמְרָה כַּדְּבָרִים הָאֵלֶּה עָשָׂה לִי עַבְדֶּךָ, עִנְיְנֵי תַשְׁמִישׁ כָּאֵלֶּה:", "rashi_en": "ויהי כשמע אדניו AND IT CAME TO PASS WHEN HIS LORD HEARD etc. — She said this when he was alone with her, caressing her. This is what she meant by כדברים האלה “things like these did thy servant do to me” — caresses such as these. "}, {"ch": 39, "v": 20, "aliyah": 6, "heb": "וַיִּקַּח֩ אֲדֹנֵ֨י יוֹסֵ֜ף אֹת֗וֹ וַֽיִּתְּנֵ֙הוּ֙ אֶל־בֵּ֣ית הַסֹּ֔הַר מְק֕וֹם אֲשֶׁר־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[אֲסִירֵ֥י]<\/span> <span class=\"mam-kq-k\">(אסורי)<\/span><\/span> הַמֶּ֖לֶךְ אֲסוּרִ֑ים וַֽיְהִי־שָׁ֖ם בְּבֵ֥ית הַסֹּֽהַר׃", "onk": "וּנְסִיב רִבּוֹנֵיהּ דְּיוֹסֵף יָתֵיהּ <b>וּמַנְּיֵהּ<\/b> לְבֵית אֲסִירֵי אֲתַר דִּי אֲסִירֵי מַלְכָּא אֲסִירִין וַהֲוָה תַמָּן בְּבֵית אֲסִירֵי:", "onk_en": "Yoseif’s master took him and placed him in [<b>appointed him over<\/b>] the prison, the place where the king’s prisoners were jailed. He remained there in the prison.", "pj": "וּנְסִיב עֵטָתָא רִבּוֹנֵיהּ דְיוֹסֵף מִן כּוּמְרָנַיָא דְבַדְקַן דְחֶלְבּוֹנָא הוּא וְלָא קְטַל יָתֵיהּ וְיַהֲבֵיהּ בְּבֵי אֲסִירֵי אָתַר דַאֲסִירֵי מַלְכָּא אֲסִירִין וַהֲוָה תַמָן בְּבֵית אֲסִירֵי", "pj_en": "And Joseph's master took counsel of the priests, who ____ put him not to death, but delivered him into the house of the bound, where the king's prisoners were bound; and he was there in the house of the bound.", "tj": "בְּבֵית חֲבוּשָׁה:", "tj_en": "In the prison house.", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 21, "aliyah": 6, "heb": "וַיְהִ֤י יְהֹוָה֙ אֶת־יוֹסֵ֔ף וַיֵּ֥ט אֵלָ֖יו חָ֑סֶד וַיִּתֵּ֣ן חִנּ֔וֹ בְּעֵינֵ֖י שַׂ֥ר בֵּית־הַסֹּֽהַר׃", "onk": "וַהֲוָה <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדֵּיהּ<\/b> דְּיוֹסֵף וּנְגַד לֵיהּ חִסְדָּא וִיהָבֵיהּ לְרַחֲמִין בְּעֵינֵי רַב בֵּית אַסִירֵי:", "onk_en": "[<b>The Word of<\/b>] Adonoy was with Yoseif[<b>’s support<\/b>], and extended kindness to him, granting him favor in the eyes of the prison chief.", "pj": "וַהֲוָה מֵימְרָא דַיְיָ בְּסַעֲדֵיהּ דְיוֹסֵף וּנְגַד עֲלֵיהּ חִיסְדָא וִיהַב רַחֲמוּתֵיהּ בְּעֵינֵי רַב בֵּית אֲסִירֵי", "pj_en": "And the Word of the Lord was Joseph's Helper, and extended mercy to him, and gave him favour in the eyes of the captain of the prison.", "tj": "", "tj_en": "", "rashi": "<b>ויט אליו חסד.<\/b> שֶׁהָיָה מְקֻבָּל לְכָל רוֹאָיו, לְשׁוֹן \"כַּלָּה נָאָה וַחֲסוּדָה\" שֶׁבַּמִּשְׁנָה:", "rashi_en": "ויט אליו חסד AND CAUSED HIM TO FIND FAVOUR — so that he was liked by all who saw him. We have the expression חסד in a like sense in the Mishna (Baraitha): “a handsome bride liked by all (חסודה)” (Ketubot 17a). "}, {"ch": 39, "v": 22, "aliyah": 6, "heb": "וַיִּתֵּ֞ן שַׂ֤ר בֵּית־הַסֹּ֙הַר֙ בְּיַד־יוֹסֵ֔ף אֵ֚ת כׇּל־הָ֣אֲסִירִ֔ם אֲשֶׁ֖ר בְּבֵ֣ית הַסֹּ֑הַר וְאֵ֨ת כׇּל־אֲשֶׁ֤ר עֹשִׂים֙ שָׁ֔ם ה֖וּא הָיָ֥ה עֹשֶֽׂה׃", "onk": "<b>וּמַנֵּי<\/b> רַב בֵּית אֲסִירֵי <b>בִּידָא<\/b> דְיוֹסֵף יָת כָּל אֲסִירַיָּא דִּי בְּבֵית אֲסִירֵי וְיָת כָּל דִּי עָבְדִין תַּמָּן עַל <b>מֵימְרֵיהּ הֲוָה מִתְעֲבֵד<\/b>:", "onk_en": "The prison chief gave [<b>appointed<\/b>] Yoseif [<b>to be in<\/b>] control over all the prisoners in the prison, and everything that had to be done there, he was the one who did it [<b>it was done by his word<\/b>].", "pj": "וּמַנִי רַב בֵּית אֲסִירֵי בְּיַד יוֹסֵף יַת כָּל אֲסִירַיָא דִבְבֵית אֲסִירֵי וְיַת כָּל דְעָבְדִין תַּמָן הוּא מִפְקָד לְמֶעֱבַד", "pj_en": "And the captain of the prison confided all the prisoners who were in the house to Joseph's hands, and whatsoever was done there he commanded to be done.", "tj": "", "tj_en": "", "rashi": "<b>הוא היה עושה.<\/b> כְּתַרְגּוּמוֹ בְּמֵימְרֵהּ הֲוָה מִתְעֲבֵיד:", "rashi_en": "הוא היה עושה HE WAS THE DOER OF IT — understand this as the Targum does: it was done at his command. "}, {"ch": 39, "v": 23, "aliyah": 6, "heb": "אֵ֣ין&thinsp;<b>׀<\/b> שַׂ֣ר בֵּית־הַסֹּ֗הַר רֹאֶ֤ה אֶֽת־כׇּל־מְא֙וּמָה֙ בְּיָד֔וֹ בַּאֲשֶׁ֥ר יְהֹוָ֖ה אִתּ֑וֹ וַֽאֲשֶׁר־ה֥וּא עֹשֶׂ֖ה יְהֹוָ֥ה מַצְלִֽיחַ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לֵית רַב בֵּית אֲסִירֵי <b>חָזֵי יָת כָּל סָרְחָן<\/b> בִּידֵיהּ בְּדִי <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדֵּיהּ<\/b> וְדִי הוּא עָבֵד יְיָ מַצְלָח:", "onk_en": "The prison chief did not have to look after anything that was under [<b>see any offense committed by<\/b>] his hand, because [<b>the Word of<\/b>] Adonoy was with him [<b>his support<\/b>] and whatever he did, Adonoy made him succeed.", "pj": "לֵית צְרוֹךְ לְרַב בֵּית אֲסִירֵי לְמִנְטַר יַת יוֹסֵף כְּאוֹרַח כָּל אֲסִירַיָא אֲרוּם לָא חָמֵי יַת כָּל סוּרְחַן בִּידֵיהּ בְּגִין דְמֵימַר דַיְיָ הֲוָה בְּסַעֲדֵיהּ וּדְהוּא עֲבִיד יְיָ מַצְלָח", "pj_en": "It was not needful for the captain of the prison to watch Joseph, after the custom of all prisoners, because he saw that there was no fault in his hands; for the Word of the Lord was his Helper, and that which he did the Lord made it to prosper.", "tj": "", "tj_en": "", "rashi": "<b>באשר ה' אתו.<\/b> בִּשְׁבִיל שֶׁה' אִתּוֹ:", "rashi_en": "באשר ה' אתו — means BECAUSE THE LORD WAS WITH HIM (i.e. באשר means because)."}, {"ch": 40, "v": 1, "aliyah": 7, "heb": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה חָ֥טְא֛וּ מַשְׁקֵ֥ה מֶֽלֶךְ־מִצְרַ֖יִם וְהָאֹפֶ֑ה לַאֲדֹנֵיהֶ֖ם לְמֶ֥לֶךְ מִצְרָֽיִם׃", "onk": "וַהֲוָה בָּתַר פִּתְגָּמַיָּא הָאִלֵּין סְרָחוּ שָׁקְיָא מַלְכָּא דְמִצְרַיִם וְנַחְתּוֹמָא לְרִבּוֹנֵיהוֹן לְמַלְכָּא דְמִצְרָיִם:", "onk_en": "After these events, an offense was committed by the Egyptian king’s butler and baker against their master, the king of Egypt.", "pj": "וַהֲוָה בָּתַר פִּתְגָמַיָא הָאִלֵין וְאִתְחַוָוא לְמֵימַר סָרְחוּ רַב מְזוּגַיָא דְמַלְכָּא דְמִצְרַיִם וְרַב נַחֲתּוֹמַיָא וְאִתְיַעֲטוּ לְמִירְמֵי סַמָא דְמוֹתָא בְּמֵיכְלֵיהּ וּבְמַשְׁקַיֵיהּ לְמִיקְטַל לְרִיבּוֹנְהוֹם לְמַלְכָּא דְמִצְרָיִם", "pj_en": "And after these things it was shown, saying The chief of the butlers of the king of Mizraim, and the chief of the bakers, have offended; having taken counsel to throw the poison of death into his food, and into his drink, to kill their master the king of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>אחר הדברים האלה.<\/b> לְפִי שֶׁהִרְגִּילָה אוֹתָהּ אֲרוּרָה אֶת הַצַּדִּיק בְּפִי כֻלָּם לְדַבֵּר בּוֹ וּלְגַנּוֹתוֹ, הֵבִיא לָהֶם הַקָּבָּ\"ה סֻרְחָנָם שֶׁל אֵלּוּ, שֶׁיִּפְנוּ אֲלֵיהֶם וְלֹא אֵלָיו, וְעוֹד שֶׁתָּבֹא הָרְוָחָה לַצַּדִּיק עַל יְדֵיהֶם:<br><br><b>חטאו.<\/b> זֶה נִמְצָא זְבוּב בְּפַיְילִי פּוֹטֵירִין שֶׁלּוֹ, וְזֶה נִמְצָא צְרוֹר בִּגְלוּסְקִין שֶׁלּוֹ:<br><br><b>והאפה.<\/b> אֶת פַּת הַמֶּלֶךְ, וְאֵין לְשׁוֹן אֲפִיָּה אֶלָּא בְּפַת, וּבְלַעַז פישטו\"ר:", "rashi_en": "אחר הדברים האלה AFTER THESE THINGS — Because this malignant woman made the righteous man (Joseph) a familiar topic of conversation with every one so that he was spoken about discreditably the Holy One, blessed be He, brought about the offences of these men in order that people should turn their attention to them and not to him (Genesis Rabbah 88:1), and also in order that relief should come to the righteous man by their agency (Genesis Rabbah 88:3).<br><br>חטאו HAD SINNED — in the case of the one, a fly was found in the goblet of aromatic wine, in the case of the other, a pebble was found in the loaves he baked (Genesis Rabbah 88:2).<br><br>והאפה AND THE BAKER of the king’s bread. The root (אפה) is only used of baking bread. old French pistor; English, kneader."}, {"ch": 40, "v": 2, "aliyah": 7, "heb": "וַיִּקְצֹ֣ף פַּרְעֹ֔ה עַ֖ל שְׁנֵ֣י סָרִיסָ֑יו עַ֚ל שַׂ֣ר הַמַּשְׁקִ֔ים וְעַ֖ל שַׂ֥ר הָאוֹפִֽים׃", "onk": "וּרְגֵז פַּרְעֹה עַל תְּרֵין רַבְרְבָנוֹהִי עַל רַב שָׁקֵי וְעַל רַב נַחְתּוֹמֵי:", "onk_en": "Pharaoh was enraged at his two officials, the chief butler and the chief baker.", "pj": "וּכְנַס פַּרְעה כְּדִי שָׁמַע עַל תְּרֵין רַבְרְבָנוֹי עַל רַב שָׁקֵי וְעַל רַב נַחְתּוֹמֵי", "pj_en": "And Pharoh was angry when he heard concerning his two servants, the chief cup--bearer and the chief baker.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 3, "aliyah": 7, "heb": "וַיִּתֵּ֨ן אֹתָ֜ם בְּמִשְׁמַ֗ר בֵּ֛ית שַׂ֥ר הַטַּבָּחִ֖ים אֶל־בֵּ֣ית הַסֹּ֑הַר מְק֕וֹם אֲשֶׁ֥ר יוֹסֵ֖ף אָס֥וּר שָֽׁם׃", "onk": "וִיהַב יָתְהוֹן בְּמַטְּרָא בֵּית רַב קָטוֹלַיָּא לְבֵית אֲסִירֵי אֲתַר דִּי יוֹסֵף אָסִיר תַּמָּן:", "onk_en": "He placed them under guard in the house of the chief executioner, in the prison, where Yoseif was imprisoned.", "pj": "וִיהַב יַתְהוֹם בְּמַטְרָא בֵּי רַב סְפּוֹקְלַטוֹרְיָא לְבֵית אֲסִירֵי אַתְרָא דְיוֹסֵף אֲסִיר תַּמָן", "pj_en": "And he gave them in ward in the house of the chief executioner, the prison house where Joseph was confined.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 4, "aliyah": 7, "heb": "וַ֠יִּפְקֹ֠ד שַׂ֣ר הַטַּבָּחִ֧ים אֶת־יוֹסֵ֛ף אִתָּ֖ם וַיְשָׁ֣רֶת אֹתָ֑ם וַיִּהְי֥וּ יָמִ֖ים בְּמִשְׁמָֽר׃", "onk": "וּמַנִּי רַב קָטוֹלַיָּא יָת יוֹסֵף עִמְּהוֹן וְשַׁמֵּשׁ יָתְהוֹן וַהֲווֹ יוֹמִין בְּמַטְּרָא:", "onk_en": "The chief of the slaughterers appointed Yoseif to be with them and he served them. They were under guard for a period of time.", "pj": "וּמַנִי רַב סְפּוֹקְלַטוֹרְיָא יַת יוֹסֵף עִמְהוֹן וְשַׁמֵשׁ יַתְהוֹם וַהֲווֹ יוֹמִין בְּבֵית מַטְרָא", "pj_en": "And the chief executioner intrusted Joseph with them, and he served them, and they were certain days in the house of custody.", "tj": "", "tj_en": "", "rashi": "<b>ויפקד שר הטבחים את יוסף.<\/b> לִהְיוֹת אִתָּם:<br><br><b>ויהיו ימים במשמר.<\/b> שְׁנֵים עָשָׂר חֹדֶשׁ:", "rashi_en": "ויפקד שר הטבחים את יוסף AND THE OFFICER OF THE EXECUTIONERS APPOINTED JOSEPH — to be WITH THEM (i.e. supply the word להיות to complete the sense).<br><br>ויהיו ימים במשמר AND THEY WERE A YEAR IN WARD —  ימים  means twelve months (cf. Rashi on Genesis 24:55). "}, {"ch": 40, "v": 5, "aliyah": 7, "heb": "וַיַּֽחַלְמוּ֩ חֲל֨וֹם שְׁנֵיהֶ֜ם אִ֤ישׁ חֲלֹמוֹ֙ בְּלַ֣יְלָה אֶחָ֔ד אִ֖ישׁ כְּפִתְר֣וֹן חֲלֹמ֑וֹ הַמַּשְׁקֶ֣ה וְהָאֹפֶ֗ה אֲשֶׁר֙ לְמֶ֣לֶךְ מִצְרַ֔יִם אֲשֶׁ֥ר אֲסוּרִ֖ים בְּבֵ֥ית הַסֹּֽהַר׃", "onk": "וַחֲלָמוּ חֶלְמָא תַּרְוֵיהוֹן גְּבַר חֶלְמֵיהּ בְּלֵילְיָא חַד גְּבַר כְּפוּשְׁרַן חֶלְמֵיהּ שָׁקְיָא וְנַחְתּוֹמָא דִּי לְמַלְכָּא דְמִצְרַיִם דִּי אֲסִירִין בְּבֵית אֲסִירֵי:", "onk_en": "The two of them had a dream. Each of them had his dream on the same night, each man according to the interpretation of his dream, the butler and the baker of the king of Egypt, who were imprisoned in the prison.", "pj": "וְחָלְמוּ חֵילְמָא תְּרֵיהוֹן גְבַר חַלְמֵיהּ בְּלֵילְיָא חַד גְבַר חֶלְמֵיהּ וּפוֹשְׁרָן חֵילְמָא דְחַבְרֵיהּ מְזוֹגָא וְנַחְתּוֹמָא דִי לְמַלְכָּא דְמִצְרַיִם דַאֲסִירִין בְּבֵית אֲסִירֵי", "pj_en": "And they dreamed a dream, both of them, each man his dream in one night, each man his own dream, and the interpretation of his companion's dream, the butler and the baker of the king of Mizraim who were confined in the prison.", "tj": "", "tj_en": "", "rashi": "<b>ויחלמו חלום שניהם.<\/b> וַיַּחַלְמוּ שְׁנֵיהֶם חֲלוֹם, זֶהוּ פְשׁוּטוֹ, וּמִדְרָשׁוֹ כָּל א' חָלַם חֲלוֹם שְׁנֵיהֶם – שֶׁחָלַם אֶת חֲלוֹמוֹ וּפִתְרוֹן חֲבֵרוֹ, וְזֶהוּ שֶׁנֶּאֱמַר וַיַּרְא שַׂר הָאֹפִים כִּי טוֹב פָּתָר:<br><br><b>איש כפתרון חלומו.<\/b> כָּל אֶחָד חָלַם חֲלוֹם הַדּוֹמֶה לְפִתְרוֹן הֶעָתִיד לָבֹא עֲלֵיהֶם:", "rashi_en": "ויחלמו חלום שניהם means AND BOTH OF THEM DREAMED A DREAM — This is the real meaning (that שניהם is the subject of ויחלמו and is not to be connected with חלום). A Midrashic explanation is, taking חלום as construct case: each dreamed the dream of both of them — i.e. he dreamed his own dream and the interpretation of the other’s dream. This is what it means when it states (v. 16) “And the chief baker saw that he had interpreted well”). (Genesis Rabbah 88:4; Berakhot 55a).<br><br>איש כפתרון חלמו EACH MAN ACCORDING TO THE INTERPRETATION OF HIS DREAM — each dreamed a dream consistent with the interpretation which foretold the future that was to befall them. "}, {"ch": 40, "v": 6, "aliyah": 7, "heb": "וַיָּבֹ֧א אֲלֵיהֶ֛ם יוֹסֵ֖ף בַּבֹּ֑קֶר וַיַּ֣רְא אֹתָ֔ם וְהִנָּ֖ם זֹעֲפִֽים׃", "onk": "וַאֲתָא לְוָתְהוֹן יוֹסֵף בְּצַפְרָא וַחֲזָא יָתְהוֹן וְהָא אִנּוּן נְסִיסִין:", "onk_en": "Yoseif came to them in the morning, and he saw them, and behold they were troubled.", "pj": "וְאָתָא לְוַתְהוֹן יוֹסֵף בְּצַפְרָא וַחֲמָא יַתְהוֹם וְהָא אִינוּן כְּנִיסִין", "pj_en": "And Joseph came to them in the morning, and saw them, and, behold, they were troubled.", "tj": "", "tj_en": "", "rashi": "<b>זעפים.<\/b> עֲצֵבִים כְּמוֹ סַר וְזָעֵף (מלכים א כ'), זַעַף ה' אֶשָּׂא (מיכה ז'):", "rashi_en": "זעפים means SAD. Similar are (1 Kings 20:43) “sullen and displeased (וזעף)”; (Micah 7:9) “I will bear the displeasure (זעף) of the Lord (the sadness which the Lord has imposed on me).’"}, {"ch": 40, "v": 7, "aliyah": 7, "heb": "וַיִּשְׁאַ֞ל אֶת־סְרִיסֵ֣י פַרְעֹ֗ה אֲשֶׁ֨ר אִתּ֧וֹ בְמִשְׁמַ֛ר בֵּ֥ית אֲדֹנָ֖יו לֵאמֹ֑ר מַדּ֛וּעַ פְּנֵיכֶ֥ם רָעִ֖ים הַיּֽוֹם׃", "onk": "וּשְׁאֵל יָת רַבְרְבֵי פַרְעֹה דִּי עִמֵּיהּ בְּמַטְּרָא בֵּית רִבּוֹנֵיהּ לְמֵימָר מָא דֵין אַפֵּיכוֹן בִּישִׁין יוֹמָא דֵין:", "onk_en": "He asked Pharaoh’s officials, who were with him, under guard in his master’s house, saying, Why do you look so bad today?", "pj": "וּשְׁאַל יַת רַבְרְבֵי פַרְעה דְעִמֵיהּ בְּמַטְרַת בֵּיתָא דְרִבּוֹנֵיהּ לְמֵימָר מָדֵין סְבַר אַפֵּיכוֹן בִּיש יוֹמָא דֵין מִכָּל יוֹמַיָא דִהֲוֵיתוּן הָכָא", "pj_en": "And Joseph asked the chiefs of Pharoh who were with him in the custody of his master's house, saying, Why is the look of your faces more evil today than all the other days that you have been here?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 8, "aliyah": 7, "heb": "וַיֹּאמְר֣וּ אֵלָ֔יו חֲל֣וֹם חָלַ֔מְנוּ וּפֹתֵ֖ר אֵ֣ין אֹת֑וֹ וַיֹּ֨אמֶר אֲלֵהֶ֜ם יוֹסֵ֗ף הֲל֤וֹא לֵֽאלֹהִים֙ פִּתְרֹנִ֔ים סַפְּרוּ־נָ֖א לִֽי׃", "onk": "וַאֲמָרוּ לֵיהּ חֶלְמָא חֲלֵמְנָא וּפָשַׁר לֵית לֵיהּ וַאֲמַר לְהוֹן יוֹסֵף הֲלָא <b>מִן קֳדָם יְיָ<\/b> פּוּשְׁרַן <b>חֶלְמַיָּא<\/b> אִשְׁתָּעוּ <b>כְעַן<\/b> לִי:", "onk_en": "They said to him, We had a dream, and there is no interpreter of it. Yoseif said to them, Do not [<b>Are<\/b>] interpretations [<b>of dreams<\/b>] belong to [<b>not from<\/b>] God. Tell them to me, please [<b>now<\/b>].", "pj": "וַאֲמָרוּ לֵיהּ חֵילְמָא חֲלֵימְנָא וּפְשַׁר לֵית לֵיהּ וַאֲמַר לְהוֹן יוֹסֵף הֲלָא מִן קֳדָם יְיָ פּוּשְׁרַן חֶלְמַיָיא אִשְׁתְּעוּ כְּדוֹן לִי", "pj_en": "And they said to him, We have dreamed a dream, and there is no interpreter for it. And Joseph answered, Are not the interpretations of dreams from tile Lord? Tell it now to me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 9, "aliyah": 7, "heb": "וַיְסַפֵּ֧ר שַֽׂר־הַמַּשְׁקִ֛ים אֶת־חֲלֹמ֖וֹ לְיוֹסֵ֑ף וַיֹּ֣אמֶר ל֔וֹ בַּחֲלוֹמִ֕י וְהִנֵּה־גֶ֖פֶן לְפָנָֽי׃", "onk": "וְאִשְׁתָּעִי רַב שָׁקֵי יָת חֶלְמֵיהּ לְיוֹסֵף וַאֲמַר לֵיהּ בְּחֶלְמִי וְהָא גוּפְנָא קֳדָמָי:", "onk_en": "The butler told his dream to Yoseif. He said to him, In my dream, behold a grape vine was before me.", "pj": "וְאִשְׁתְּעֵי רַב מְזוֹגַיָא יַת חֶלְמֵיהּ לְיוֹסֵף וַאֲמַר לֵיהּ חָמֵי הֲוִית בְּחֶלְמִי וְהָא גוּפְנָא קֳדָמָי", "pj_en": "And the chief of the butlers related his dream to Joseph, and said to him, I saw in my dream, and, behold, a vine was before me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 10, "aliyah": 7, "heb": "וּבַגֶּ֖פֶן שְׁלֹשָׁ֣ה שָׂרִיגִ֑ם וְהִ֤וא כְפֹרַ֙חַת֙ עָלְתָ֣ה נִצָּ֔הּ הִבְשִׁ֥ילוּ אַשְׁכְּלֹתֶ֖יהָ עֲנָבִֽים׃", "onk": "וּבְגוּפְנָא תְּלָתָא שִׁבְשִׁין וְהִיא <b>כַד<\/b> אַפְרַחַת <b>אַפֵּקַת לַבְלְבִין<\/b> וַאֲנִיצַת נֵץ בַּשִּׁילוּ אִתְכְּלָתָהָא עִנְּבִין:", "onk_en": "On the vine there were three branches, as [<b>when<\/b>] if budding, [<b>it brought out blossoms and<\/b>] its [<b>the<\/b>] blossoms blooming, and its clusters ripening into grapes.", "pj": "וּבְגוּפְנָא תְּלָתֵי מְצוֹגְיָא וְהוּא כְדִי אַפְרַחַת אַפֵּיקַת לַבְלוֹבָהָא וּמִן יַד בָּשְׁלוּ סְגוֹלְיָהָא הֲווֹ עֲנָבִין", "pj_en": "And in the vine were three branches; and as it sprouted it brought forth buds, and immediately they ripened into clusters, and became grapes.", "tj": "", "tj_en": "", "rashi": "<b>שריגם.<\/b> זְמוֹרוֹת אֲרוּכוֹת, שֶׁקּוֹרִין ווידי\"ץ בְּלַעַז:<br><br><b>והוא כפרחת.<\/b> דּוֹמֶה לְפוֹרַחַת וְהִיא כְפוֹרַחַת – נִדְמָה לִי בַּחֲלוֹמִי כְאִלּוּ הִיא פוֹרַחַת, וְאַחַר הַפֶּרַח עָלְתָה נִצָּה, וְנַעֲשׂוּ סְמָדַר, אשפנ\"יר בְּלַעַז, וְאַחַר כָּךְ הִבְשִׁילוּ, וְהִיא כַּד אַפְרַחַת אַפֵּקַת לַבְלְבִין עַ\"כַּ תַּרְגּוּם שֶׁל פּוֹרַחַת נֵץ גָּדוֹל מִפֶּרַח כְּדִכְתִיב וּבֹסֶר גֹּמֵל יִהְיֶה נִצָּה (ישעיהו י\"ח), וּכְתִיב וַיֹּצֵא פֶרַח, וַהֲדַר וַיָּצֵץ צִיץ (במדבר י\"ז):", "rashi_en": "שריגם BRANCHES — long branches called in old French. vitis.<br><br>והיא כפרחת means AND IT WAS AS THOUGH IT BUDDED — it seemed to me in my dream as though it budded, and after the bud its blossom sprang up — i.e. it began to flower; old French spanier — and after that the clusters brought forth ripe grapes. The Targum has והיא כד אפרחת אפיקת לבלבין “and it, when it budded, brought forth blossoms”, These words (ע״כ, abbreviation for עד כאן “till here”. The abbreviation is employed to show where a quotation ends.) are the translation of the word פרחת\"” only. A נץ is larger than a פרח (i.e. נץ is a later stage of the bud), as it is written (Isaiah 18:5) “and the blossom (נצה) becometh a ripening grape”, and it is written (Numbers 17:23) “And it brought forth buds (פרח)” and afterwards it states “it brought forth (ציץ) blossoms”. "}, {"ch": 40, "v": 11, "aliyah": 7, "heb": "וְכ֥וֹס פַּרְעֹ֖ה בְּיָדִ֑י וָאֶקַּ֣ח אֶת־הָֽעֲנָבִ֗ים וָֽאֶשְׂחַ֤ט אֹתָם֙ אֶל־כּ֣וֹס פַּרְעֹ֔ה וָאֶתֵּ֥ן אֶת־הַכּ֖וֹס עַל־כַּ֥ף פַּרְעֹֽה׃", "onk": "וְכַסָּא דְפַרְעֹה בִּידִי וּנְסֵיבִת יָת עִנְּבַיָּא וְעַצָּרִית יָתְהוֹן לְכַסָּא דְפַרְעֹה וִיהָבִית יָת כַּסָּא עַל יְדָא דְפַרְעֹה:", "onk_en": "Pharaoh’s cup was in my hand. I took the grapes and squeezed them into Pharaoh’s cup. I then placed the cup into Pharaoh’s hand.", "pj": "חָמֵי הֲוֵית עַד דְיַהֲבִין כַּסָא דְפַרְעה בִּידִי וּנְסֵיבִית יַת עִנְבַיָיא וְעַצְרִית יַתְהוֹן לְכַסָא דְפַרְעה וִיהָבִית יַת כַּסָא עַל יְדָא דְפַרְעה", "pj_en": "And I gave the cup of Pharoh into my hand, and I took the grapes, and expressed them into Pharoh's cup, and gave the cup into Pharoh's hand.", "tj": "", "tj_en": "", "rashi": "<b>ואשחט.<\/b> כְּתַרְגּוּמוֹ וַעֲצָרִית, וְהַרְבֵּה יֵשׁ בִּלְשׁוֹן מִשְׁנָה:", "rashi_en": "ואשחט translate it as the Targum AND I PRESSED — The word occurs frequently in the Mishna (but only here in the Bible). "}, {"ch": 40, "v": 12, "aliyah": 7, "heb": "וַיֹּ֤אמֶר לוֹ֙ יוֹסֵ֔ף זֶ֖ה פִּתְרֹנ֑וֹ שְׁלֹ֙שֶׁת֙ הַשָּׂ֣רִגִ֔ים שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃", "onk": "וַאֲמַר לֵיהּ יוֹסֵף דֵּין פִּשְׁרָנֵיהּ תְּלָתָא שִׁבְשִׁין תְּלָתָא יוֹמִין אִנּוּן:", "onk_en": "Yoseif said to him, This is its interpretation: The three branches are three days.", "pj": "וַאֲמַר לֵיהּ יוֹסֵף דֵין סוֹף פּוֹשְׁרָנָא דְחֶלְמָא תְּלָתֵי מְצוֹגְיָא תְּלָתֵי אַבְהַת עַלְמָא אִינוּן אַבְרָהָם יִצְחָק וְיַעֲקב דְמִן בְּנֵי בְנֵיהוֹן עֲתִידִין לְמִישְׁתַּעְבְּדָא לְמִצְרַיִם בְּטִינָא וּבְלִיבְנָא וּבְכָל פּוּלְחָנָהָא בְּאַנְפֵּי בְרָא וּמִן בָּתַר כְּדוֹן מִתְפָּרְקִין עַל יַד תְּלַת רַעֲיָין וְדִי אֲמַרְתְּ נְסִיבִית יַת עִינְבַיָיא וְעַצְרִית יַתְהוֹם לְכַסָא דְפַרְעה וִיהָבִית יַת כַּסָא לִידָא דְפַרְעה הוּא פְיָילָא דְרוּגְזָא דְעָתִיד פַּרְעה שָׁתֵי בְּעִקְבָא וְאַתְּ רַב מְזוֹגַיָא תְּקַבֵּל אֲגַר טַב עַל חֶלְמָךְ טַב דְחָלַמְתָּא וּפוֹשְרָנֵיהּ דֵין הוּא לָךְ תְּלָתֵי מְצוֹגְיָיא תְּלָתָא יוֹמִין הִינוּן לְפוּרְקָנָךְ", "pj_en": "And Joseph said to him, This is the end of the interpretations of the dream. The three branches are the three Fathers of the world, Abraham, Izhak, and Jakob, the children of whose sons are to be enslaved in Mizraim in clay and brick (work,) and in all labour of the face of the field: but afterwards shall the be delivered by the hand of three shepherds. As thou hast said, I took the grapes and expressed them into Pharoh's cup, and gave the cup Into Pharoh's hand: It is the vial of wrath which Paroh (himself) is to drink at the last. But thou, the chief butler shalt receive a good reward concerning the good dream which thou hast dreamed; and the interpretation of it, to thyself, is this: The three branches are three days until thy liberation.", "tj": "וַאֲמַר לֵיהּ יוֹסֵף דֵין הוּא פִּתְרוֹנֵיהּ דְחֵלְמָא תְּלְתָא שַׁרְבִטַּיָּא אִנּוּן תְּלָתָא אֲבְהָתֵי עַלְמָא אַבְרָהָם יִצְחָק וְיַעֲקב דְּמִן בְּנֵי בְנֵיהוֹן עֲתִידִין לְמִשְׁתַּעְבְּדָא בְּאַרְעָא דְמִצְרַיִם וַעֲתִידִין לְמִתְפָּרְקָא עַל יְדֵי תְּלָתָא פַּרְנָסִין מְהֵימְנִין וְאִנּוּן מְתִילִין כִּסְגּוֹלַיָיא וְדִי אָמְרַת נְסֵבִית יַת עִינְבַיָּא וַעֲצָרִית יַתְהוֹן בְּכַסָּא דְפַרְעה וִיהָבִית יַת כַּסָּא לְגוֹ כַף יְדוֹהִי דְפַרְעה הוּא כַּסָּא דְפוּרְעָנוּתָא דְּפַרְעה עָתִיד לְמִשְׁתֵּי בְּעִקְּבָא. וְאַתְּ רַב מְזוֹגַיָּא לָא מוֹבְדִין אַגְרָךְ דִּי חֲלַמְתְּ חִלְמָא טָבָא הָדֵין בְּרַם פִּתְרוֹנֵהּ דְחֶלְמָא לָא הֲוָה יוֹסֵף אָמַר לֵהּ יוֹמִין בָּתַר דֵין פָּתַר לֵיה יוֹסֵף הֵיךְ מַה דְּהַוָה שְׁפַר בְּאַפּוֹי וַאֲמַר לֵהּ יוֹסֵף תְּלָתָא שַׁרְבִטַּיָּא תְּלָתָא יוֹמִין אִנוּן:", "tj_en": "And Joseph said, This is the interpretations of the dream : The three branches are the three Fathers of the world, Abraham, Izhak, and Jakob the children of whose sons will be enslaved in the land of Mizriam and will be delivered by the band of three faithful pastors, who may be likened to the clusters. And whereas thou hast said, I took the grapes and expressed them into the cup of Pharoh and gave the cup into Pharoh's hand: It is the cup of retribution which Pharoh is to drink at the last. As to thyself, the chief of the butlers, thou wilt not lose thy reward; for this dream which thou hast dreamed is good. Nevertheless the interpretation of the dream (as relating to himself) Joseph had not told him; but afterwards he explained it, when it pleased him. And Joseph said to him, The three branches are three days.", "rashi": "<b>שלשת ימים הם.<\/b> סִימָן הֵם לְךָ לִשְׁלֹשֶׁת יָמִים, וְיֵשׁ מִדְרְשֵׁי אַגָּדָה הַרְבֵּה (חולין צ\"ב):", "rashi_en": "שלשת ימים ARE THREE DAYS — They are a symbol to you of three days. There are many Midrashic explanations of these words (cf. Chullin 92a). "}, {"ch": 40, "v": 13, "aliyah": 7, "heb": "בְּע֣וֹד&thinsp;<b>׀<\/b> שְׁלֹ֣שֶׁת יָמִ֗ים יִשָּׂ֤א פַרְעֹה֙ אֶת־רֹאשֶׁ֔ךָ וַהֲשִֽׁיבְךָ֖ עַל־כַּנֶּ֑ךָ וְנָתַתָּ֤ כוֹס־פַּרְעֹה֙ בְּיָד֔וֹ כַּמִּשְׁפָּט֙ הָֽרִאשׁ֔וֹן אֲשֶׁ֥ר הָיִ֖יתָ מַשְׁקֵֽהוּ׃", "onk": "<b>בְּסוֹף<\/b> תְּלָתָא יוֹמִין <b>יַדְבְּרִנָּךְ<\/b> פַּרְעֹה יָת רֵישָׁךְ וִיתֵיבִנָּךְ עַל שִׁמּוּשָׁךְ וְתִתֵּן כַּסָּא דְפַרְעֹה בִּידֵיהּ כְּהִלְכְתָא קַדְמָאָה דִּי הֲוֵיתָא מַשְׁקֵי לֵיהּ:", "onk_en": "In another [<b>At the end of<\/b>] three days, Pharaoh will lift [<b>take<\/b>] your head, and restore you to your position. You will place Pharaoh’s cup in his hand, as was your previous practice when you were his butler.", "pj": "בְּסוֹף תְּלָתֵי יוֹמִין יֵיעוּל קֳדָם פַּרְעה דוּכְרָנָךְ וְיָרִים יַת רֵישָׁךְ בִּיקָר וִיתֵבִינָךְ עַל שִׁמוּשָׁךְ וְתִתֵּן כַּסָא דְפַרְעה בִּידֵיהּ כְּהִלְכָתָא קַדְמָאָה דַהֲוִית מְזוֹגֵיהּ", "pj_en": "At the end of three days the memory of thee will come before Pharoh and he will lift up thy head with honour, and restore thee to thy service, and thou wilt give the cup of Pharoh into his hand, according to thy former custom in pouring out for him.", "tj": "", "tj_en": "", "rashi": "<b>ישא פרעה את ראשך.<\/b> לְ' חֶשְׁבּוֹן, כְּשֶׁיִּפְקֹד שְׁאָר עֲבָדָיו לְשָׁרֵת לְפָנָיו בַּסְּעוּדָה, יִמְנֶה אוֹתְךָ עִמָּהֶם:<br><br><b>כנך.<\/b> בָּסִיס שֶׁלְּךָ וּמוֹשָׁבְךָ:", "rashi_en": "ישא פרעה את ראשך PHARAOH SHALL LIFT UP THY HEAD — The words נשא ראש denote to count (cf. Exodus 30:12). When he musters his other servants to wait upon him during the meal he will count you also among them. <br><br>כנך means THY POST and thy place. "}, {"ch": 40, "v": 14, "aliyah": 7, "heb": "כִּ֧י אִם־זְכַרְתַּ֣נִי אִתְּךָ֗ כַּאֲשֶׁר֙ יִ֣יטַב לָ֔ךְ וְעָשִֽׂיתָ־נָּ֥א עִמָּדִ֖י חָ֑סֶד וְהִזְכַּרְתַּ֙נִי֙ אֶל־פַּרְעֹ֔ה וְהוֹצֵאתַ֖נִי מִן־הַבַּ֥יִת הַזֶּֽה׃", "onk": "אֶלָּהֵן תִּדְכְּרִנַּנִי עִמָּךְ כַּד יֵיטַב לָךְ וְתַעְבֵּד <b>כְּעַן<\/b> עִמִּי <b>טִיבוּ<\/b> וְתִדְכַּר עָלַי <b>קֳדָם<\/b> פַּרְעֹה וְתַפְּקִנַּנִי מִן <b>בֵּית אֲסִירָא<\/b> הָדֵין:", "onk_en": "But remember me when things go well with you. Please [<b>Now<\/b>] deal kindly with me [<b>with goodness<\/b>], and mention me to [<b>before<\/b>] Pharaoh, and take me out of this house [<b>prison<\/b>].", "pj": "שְׁבַק יוֹסֵף יַת רוֹחֲצָנֵיהּ דִלְעֵיל וְנָקַט רוֹחֲצָנֵיהּ דְבַר נַשׁ וַאֲמַר לְרַב מְזוֹגַיָא אֱלָהֵן תִּדְכְּרִינַנִי עִמָךְ כַּד יִיטַב לָךְ וְתֶעֱבַד כְּדוֹן עִמִי טִיבוּ וְתִידְכַּר עָלַי קֳדָם פַּרְעה וּתְהַנְפְקִינַנִי מִן בֵּית אֲסִירֵי הָדֵין", "pj_en": "Joseph, leaving his higher trust and retaining confidence in a man, said to the chief butler, But be thou mindful of me when it shall be well with thee, and act kindly by me, and remember me before Paharoh and obtain my deliverance from this prison house.", "tj": "", "tj_en": "", "rashi": "<b>כי אם זכרתני אתך.<\/b> אֲשֶׁר אִם זְכַרְתַּנִי אִתְּךָ, מֵאַחַר שֶׁיִּיטַב לְךָ כְּפִתְרוֹנִי:<br><br><b>ועשית נא עמדי חסד.<\/b> אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה:", "rashi_en": "כי אם זכרתני אתך means: You will be restored to your post and will have great influence (cf. Nehemia’s position as cupbearer at the Persian court), so that. (כי) if (אם) thou at all bear me in mind after it is well with thee as I have interpreted.<br><br>ועשית נא עמדי חסד THEN SHOW KINDNESS I PRAY THEE UNTO ME — The word נא is an expression of entreaty. "}, {"ch": 40, "v": 15, "aliyah": 7, "heb": "כִּֽי־גֻנֹּ֣ב גֻּנַּ֔בְתִּי מֵאֶ֖רֶץ הָעִבְרִ֑ים וְגַם־פֹּה֙ לֹא־עָשִׂ֣יתִֽי מְא֔וּמָה כִּֽי־שָׂמ֥וּ אֹתִ֖י בַּבּֽוֹר׃", "onk": "אֲרֵי מִגְנַב גְּנֵבְנָא מֵאַרְעָא דְעִבְרָאֵי וְאַף הָכָא לָא עֲבָדִית מִדַּעַם אֲרֵי שַׁוִּיאוּ יָתִי <b>בְּבֵית אֲסִירֵי<\/b>:", "onk_en": "I was kidnaped from the land of the Hebrews, and here I have also done nothing that they should have put me in this dungeon [<b>prison<\/b>].", "pj": "אֲרוּם מִגְנַב אִתְגַנֵיבִית מִן אַרְעָא דְעִיבְרָאֵי וְאוּף הָכָא לָא עֲבָדִית מִדַעַם בִּישׁ אֲרוּם שַׁוִיאוּ יָתִי בְּבֵית אֲסִירֵי", "pj_en": "For I was verily carried away dishonestly from the land of the Hivraee and here also I have done nothing evil, that they should put me in prison.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 16, "aliyah": 7, "heb": "וַיַּ֥רְא שַׂר־הָאֹפִ֖ים כִּ֣י ט֣וֹב פָּתָ֑ר וַיֹּ֙אמֶר֙ אֶל־יוֹסֵ֔ף אַף־אֲנִי֙ בַּחֲלוֹמִ֔י וְהִנֵּ֗ה שְׁלֹשָׁ֛ה סַלֵּ֥י חֹרִ֖י עַל־רֹאשִֽׁי׃", "onk": "וַחֲזָא רַב נַחְתּוֹמֵי אֲרֵי יָאוּת פָּשַׁר וַאֲמַר לְיוֹסֵף אַף אֲנָא בְּחֶלְמִי וְהָא תְּלָתָא סַלִּין דְּחִירוּ עַל רֵישִׁי:", "onk_en": "The chief baker saw that he interpreted well. He said to Yoseif, I, too, dreamed. Behold there were three fancy baskets on my head.", "pj": "וַחֲמָא רַב נַחְתּוֹמֵי אֲרוּם יָאוּת פָּשָׁר דְהוּא חָמָא פּוּשְׁרַן חֵילְמָא דְחַבְרֵיהּ וְשָׁרֵי לְמַלָלָא בִּלְשׁוֹן רוּגְזָא וַאֲמַר לְיוֹסֵף אוּף אֲנָא הַוִית חָמֵי בְּחֶלְמִי וְהָא תְּלָתָא סַלִין דְפִיתָּא נַקְיָא עַל רֵישִׁי", "pj_en": "And the chief baker, when he understood the interpretation of his companion's dream, seeing that he had interpreted well, began to speak with an impatient tongue, and said to Joseph, I also saw in my dream, and, behold, three baskets of fine cakes were upon my head.", "tj": "וְהָא תְּלָתָא סַלִין דְרִיפְתָּא קַקְבָּטִין עַל רֵישִׁי:", "tj_en": "And, behold, three baskets of hot loaves were upon my head", "rashi": "<b>סלי חורי.<\/b> סַלִּים שֶׁל נְצָרִים קְלוּפִים חוֹרִין חוֹרִין, וּבִמְקוֹמֵנוּ יֵשׁ הַרְבֵּה, וְדֶרֶךְ מוֹכְרֵי פַת כִּסָּנִין, שֶׁקּוֹרִין אובל\"יש בְּלַעַז, לְתִתָּם בְּאוֹתָם סַלִּים:", "rashi_en": "In our country there are many such baskets and sellers of fancy rolls — old French oublies — usually put them in these baskets. "}, {"ch": 40, "v": 17, "aliyah": 7, "heb": "וּבַסַּ֣ל הָֽעֶלְי֗וֹן מִכֹּ֛ל מַאֲכַ֥ל פַּרְעֹ֖ה מַעֲשֵׂ֣ה אֹפֶ֑ה וְהָע֗וֹף אֹכֵ֥ל אֹתָ֛ם מִן־הַסַּ֖ל מֵעַ֥ל רֹאשִֽׁי׃", "onk": "וּבְסַלָּא עִלָּאָה מִכֹּל מֵיכַל פַּרְעֹה עוֹבַד נַחְתּוֹם וְעוֹפָא אָכֵל יָתְהוֹן מִן סַלָּא מֵעִלָּוֵי רֵישִׁי:", "onk_en": "In the top basket there were various kinds of food for Pharaoh, consisting of baked goods, and the bird was eating them from the basket that was on my head.", "pj": "וּבְסַלָא עִלָאָה מִכָּל תַּפְנוּקֵי מֵיכַל פַּרְעה עוֹבַד נַחְתּוֹם וְעוֹפָא אָכִיל יַתְהוֹם מִן סַלָא מֵעִילַוֵי רֵישִׁי", "pj_en": "and in the upper basket of all delicious meat for Pharoh made by the confectioner and the birds ate them from the basket upon my head.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 18, "aliyah": 7, "heb": "וַיַּ֤עַן יוֹסֵף֙ וַיֹּ֔אמֶר זֶ֖ה פִּתְרֹנ֑וֹ שְׁלֹ֙שֶׁת֙ הַסַּלִּ֔ים שְׁלֹ֥שֶׁת יָמִ֖ים הֵֽם׃", "onk": "וַאֲתֵב יוֹסֵף וַאֲמַר דֵּין פִּשְׁרָנֵיהּ תְּלָתָא סַלִּין תְּלָתָא יוֹמִין אִנּוּן:", "onk_en": "Yoseif replied and said, This is its interpretation: The three baskets represent three days.", "pj": "וְאָתֵיב יוֹסֵף וְאָמַר דֵין הוּא פ
