<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const DATA = [{"ch": 29, "v": 9, "aliyah": 1, "heb": "אַתֶּ֨ם נִצָּבִ֤ים הַיּוֹם֙ כֻּלְּכֶ֔ם לִפְנֵ֖י יְהֹוָ֣ה אֱלֹהֵיכֶ֑ם רָאשֵׁיכֶ֣ם שִׁבְטֵיכֶ֗ם זִקְנֵיכֶם֙ וְשֹׁ֣טְרֵיכֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃", "onk": "אַתּוּן קָיְמִין יוֹמָא דֵין כָּלְּכוֹן קֳדָם יְיָ אֱלָהֲכוֹן רֵישֵׁיכוֹן שִׁבְטֵיכוֹן סָבֵיכוֹן וְסָרְכֵיכוֹן כֹּל אֱנַשׁ יִשְׂרָאֵל:", "onk_en": "‘‘You stand, this day all of you before Adonoy, your God; your tribal chieftains, your elders and your law officers, every man of Yisroel.", "pj": "אתם אָמַר משֶׁה נְבִיָא לָא בְטוּמְרָא אֲנָא מַסְהִיד בְּכוֹן אֱלָהֵן כַּד אַתּוּן מְעַתְּדוּן יוֹמָנָא כּוּלְכוֹן קֳדָם יְיָ אֱלָהָכוֹן רֵישֵׁי סַנְהֶדְרִין דִלְכוֹן וַאֲמַרְכְּלֵי שִׁבְטֵיכוֹן סָבֵיכוֹן וְסַרְכֵיכוֹן כָּל אֵינַשׁ יִשְרָאֵל", "pj_en": "MOSHEH the prophet said: I have called you not in secret, but while standing this day all of you before the Lord your God; the princes of your sanhedrin, the chiefs of your tribes, your elders and your officers, all men of Israel,", "tj": "", "tj_en": "", "rashi": "<b>אתם נצבים.<\/b> מְלַמֵּד שֶׁכִּנְּסָם מֹשֶׁה לִפְנֵי הַקָּבָּ\"ה בְּיוֹם מוֹתוֹ לְהַכְנִיסָם בַּבְּרִית:<br><br><b>ראשיכם שבטיכם.<\/b> רָאשֵׁיכֶם לְשִׁבְטֵיכֶם:<br><br><b>זקניכם ושטריכם.<\/b> הֶחָשׁוּב חָשׁוּב קוֹדֵם, וְאַחַר כָּךְ <b>כל איש ישראל<\/b>:", "rashi_en": "אתם נצבים YE ARE STANDING THIS DAY [ALL OF YOU BEFORE THE LORD] — This teaches that Moses assembled them in the presence of the Omnipresent on the day of his death, in order to initiate them into a covenant with Him.<br><br>ראשיכם שבטיכם means as much as ראשיכם לשבטיכם YOUR HEADS OF YOUR TRIBES.<br><br>זקניכם ושטריכם YOUR ELDERS AND YOUR OFFICERS — The more prominent were in front (i.e. they stood before the Lord in the order of their rank), and afterwards: “all the men of Israel”."}, {"ch": 29, "v": 10, "aliyah": 1, "heb": "טַפְּכֶ֣ם נְשֵׁיכֶ֔ם וְגֵ֣רְךָ֔ אֲשֶׁ֖ר בְּקֶ֣רֶב מַחֲנֶ֑יךָ מֵחֹטֵ֣ב עֵצֶ֔יךָ עַ֖ד שֹׁאֵ֥ב מֵימֶֽיךָ׃", "onk": "טַפְלְכוֹן נְשֵׁיכוֹן וְגִיּוֹרָךְ דִּי בְּגוֹ מַשְׁרִיתָיךְ מִלָּקֵט אָעָיךְ עַד מְלֵי מַיָּיךְ:", "onk_en": "Your young, your wives, and your convert who is within your camps; from your wood cutters to the water drawers.", "pj": "טַפְלְכוֹן וּנְשֵׁיכוֹן וְגִיוֹרֵיכוֹן דִי בְּגוֹ מַשִׁירְוַיֵיכוֹן מִקְטוֹעַ קִיסֵיכוֹן עַד מִלוּאֵי מֵימֵיכוֹן", "pj_en": "your little ones, your wives, and your sojourners who are in your camps, from the hewer of your wood to the filler of your water,", "tj": "טַפְלֵיכוֹן נְשֵׁיכוֹן וְגִיוֹרֵיכוֹן דְאִית בְּגוֹ מַשִׁירְיָתֵיכוֹן מִקְטוּעֵי קֵיסֵיכוֹן עַד מִילוֹי מֵימֵיכוֹן:", "tj_en": "Your little ones, wives, and sojourners within your camps, from the hewer of your wood to the filler of your water,", "rashi": "<b>מחטב עציך.<\/b> מְלַמֵּד שֶׁבָּאוּ כְנַעֲנִיִּים לְהִתְגַּיֵּר בִּימֵי מֹשֶׁה כְּדֶרֶךְ שֶׁבָּאוּ גִּבְעוֹנִים בִּימֵי יְהוֹשֻׁעַ, וְזֶהוּ הָאָמוּר בַּגִּבְעוֹנִים (יהושע ט') \"וַיַּעֲשׂוּ גַם הֵמָּה בְּעָרְמָה\", וּנְתָנָם מֹשֶׁה חוֹטְבֵי עֵצִים וְשׁוֹאֲבֵי מַיִם (עי' תנחומא):", "rashi_en": "מחטב עציך FROM THE WOODCUTTER [UNTO THE DRAWER OF THE WATER] — This teaches that some of the Canaanites came in Moses' days to become proselytes just as the Gibeonites came in the days of Joshua, — and this is the meaning of what is stated of the Gibeonites, (Joshua 9:4) “And they also acted cunningly”; — and Moses made them woodcutters and drawers of water (cf. Midrash Tanchuma, Nitzavim 2)."}, {"ch": 29, "v": 11, "aliyah": 1, "heb": "לְעׇבְרְךָ֗ בִּבְרִ֛ית יְהֹוָ֥ה אֱלֹהֶ֖יךָ וּבְאָלָת֑וֹ אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ כֹּרֵ֥ת עִמְּךָ֖ הַיּֽוֹם׃", "onk": "לְאָעָלוּתָךְ בִּקְיָמָא דַייָ אֱלָהָךְ וּבְמוֹמָתֵיהּ דִּי יְיָ אֱלָהָךְ גְּזַר עִמָּךְ יוֹמָא דֵין:", "onk_en": "For your passage into the covenant of Adonoy, your God, and His oath-curse, that Adonoy, your God, is making with you today.", "pj": "לְאַעֲלוּתְכוֹן בִּקְיָימָא דַיְיָ אֱלָהָכוֹן וּלְאַזְהְרוֹתְכוֹן בְּמוֹמָתֵיהּ דַיְיָ אֱלָהָכוֹן גְזַר עִמְכוֹן יוֹמָנָא", "pj_en": "that you may enter into the covenant of the Lord your God, and may have in remembrance the oath which the Lord your God doth ratify with you this day:", "tj": "מִלְעָבְרְכוֹן בְּקַיָימָא דַיְיָ אֱלָהָכוֹן וּבִשְׁבוּעֲתָא דַיְיָ אֱלָהָכוֹן מְקַיֵים עִמְכוֹן יוֹמָא דֵין:", "tj_en": "that you may not transgress the covenant of the Lord your God, nor the oath which He confirmeth with you this day:", "rashi": "<b>לעברך.<\/b> לִהְיוֹתְךָ עוֹבֵר בַּבְּרִית, וְלֹא יִתָּכֵן לְפָרְשׁוֹ כְּמוֹ לְהַעֲבִירְךָ, אֶלָּא כְּמוֹ לַעֲשֹׂתְכֶם אֹתָם:<br><br><b>לעברך בברית.<\/b> דֶּרֶךְ הַעֲבָרָה כָּךְ: הָיוּ כוֹרְתֵי בְרִיתוֹת עוֹשִׂין מְחִצָּה מִכָּאן וּמְחִצָּה מִכָּאן וְעוֹבְרִים בֵּינְתַּיִם, כְּמוֹ שֶׁנֶּאֱמַר \"הָעֵגֶל אֲשֶׁר כָּרְתוּ לִשְׁנַיִם וַיַּעַבְרוּ בֵּין בְּתָרָיו\" (ירמיהו ל\"ד):", "rashi_en": "לעברך means THAT THOU SHOULDEST PASS [INTO THE COVENANT]. It would not, however, be correct to explain it as meaning “to make thee pass” (when the suffix would be objective), but it must be explained like (Deuteronomy 4:14) לעשתכם אתם, “that ye may do them”.<br><br>לעברך בברית THAT THOU SHOULDEST PASS INTO THE COVENANT — The way of “passing” was as follows: those who made a covenant used to make a partition (i.e. used to place objects in a straight line) on one side and a partition on the other and passed between them, as it is said, (Jeremiah 34:18—20) “[And I will give the men which have not performed the words of the covenant which they made before Me] when they cut the calf in two, and passed between the parts thereof … [into the hands of their enemies]”."}, {"ch": 29, "v": 12, "aliyah": 1, "heb": "לְמַ֣עַן הָקִֽים־אֹתְךָ֩ הַיּ֨וֹם&thinsp;<small>׀<\/small>&thinsp;ל֜וֹ לְעָ֗ם וְה֤וּא יִֽהְיֶה־לְּךָ֙ לֵֽאלֹהִ֔ים כַּאֲשֶׁ֖ר דִּבֶּר־לָ֑ךְ וְכַאֲשֶׁ֤ר נִשְׁבַּע֙ לַאֲבֹתֶ֔יךָ לְאַבְרָהָ֥ם לְיִצְחָ֖ק וּֽלְיַעֲקֹֽב׃", "onk": "בְּדִיל לַאֲקָמָא יָתָךְ יוֹמָא דֵין <b>קֳדָמוֹהִי<\/b> לְעַמָּא וְהוּא יְהֵי לָךְ לֶאֱלָהּ כְּמָא דִי מַלִּיל לָךְ וּכְמָא דִי קַיִּים לַאֲבָהָתָךְ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב:", "onk_en": "In order to sustain you today [<b>before Him<\/b>] as His people, and He will be for you a God as He promished you and as He promised your forefathers Avrohom, Yitzchok, and Yaakov.", "pj": "מִן בִּגְלַל לְקַיָימָא יַתְכוֹן יוֹמָנָא לֵיהּ לְאוּמָא בְּרִירָא וְהוּא יֶהֱוֵי לְכוֹן לֶאֱלָהָא הֵיכְמָא דְמַלֵיל לְכוֹן וְהֵיכְמָא דְקַיֵים לְאַבְהַתְכוֹן לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב", "pj_en": "that you may stand today before Him a purified people; and that He may be a God to you, as He hath spoken to you, and as He did swear unto Abraham, Izhak, and Jakob.", "tj": "", "tj_en": "", "rashi": "<b>למען הקים אתך היום לו לעם.<\/b> כָּל כָּךְ הוּא נִכְנָס לִטְרֹחַ לְמַעַן קַיֵּם אוֹתְךָ לְפָנָיו לְעָם:<br><br><b>והוא יהיה לך לאלהים.<\/b> לְפִי שֶׁדִּבֵּר לְךְ וְנִשְׁבַּע לַאֲבוֹתֶיךָ שֶׁלֹּא לְהַחֲלִיף אֶת זַרְעָם בְּאֻמָּה אַחֶרֶת, לְכָךְ הוּא אוֹסֵר אֶתְכֶם בַּשְּׁבוּעוֹת הַלָּלוּ שֶׁלֹּא תַקְנִיטוּהוּ, אַחַר שֶׁהוּא אֵינוֹ יָכוֹל לְהִבָּדֵל מִכֶּם. עַד כָּאן פֵּרַשְׁתִּי פְּשׁוּטָהּ שֶׁל פָּרָשָׁה. וּמִדְרַשׁ אַגָּדָה: לָמָּה נִסְמְכָה פָרָשַׁת אַתֶּם נִצָּבִים לַקְּלָלוֹת? לְפִי שֶׁשָּׁמְעוּ יִשְׂרָאֵל מֵאָה קְלָלוֹת חָסֵר שְׁתַּיִם חוּץ מִמ\"ט שֶׁבְּתוֹרַת כֹּהֲנִים, הוֹרִיקוּ פְנֵיהֶם וְאָמְרוּ מִי יוּכַל לַעֲמֹד בָּאֵלּוּ? הִתְחִיל מֹשֶׁה לְפַיְּסָם — <b>אתם נצבים היום<\/b>, הַרְבֵּה הִכְעַסְתֶּם לַמָּקוֹם וְלֹא עָשָׂה אִתְּכֶם כְּלָיָה וַהֲרֵי אַתֶּם קַיָּמִים לְפָנָיו:<br><br><b>היום.<\/b> כַּיּוֹם הַזֶּה שֶׁהוּא קַיָּם וְהוּא מַאֲפִיל וּמֵאִיר, כָּךְ הֵאִיר לָכֶם וְכָךְ עָתִיד לְהָאִיר לָכֶם, וְהַקְּלָלוֹת וְהַיִּסּוּרִין מְקַיְּמִין אֶתְכֶם וּמַצִּיבִין אֶתְכֶם לְפָנָיו; וְאַף הַפָּרָשָׁה שֶׁל מַעְלָה מִזּוֹ פִּיּוּסִין הֵם, אַתֶּם רְאִיתֶם אֵת כָּל אֲשֶׁר עָשָׂה; דָּבָר אַחֵר — <b>אתם נצבים<\/b>, לְפִי שֶׁהָיוּ יִשְׂרָאֵל יוֹצְאִין מִפַּרְנָס לְפַרְנָס — מִמֹּשֶׁה לִיהוֹשֻׁעַ — לְפִיכָךְ עָשָׂה אוֹתָם מַצֵּבָה כְּדֵי לְזָרְזָם; וְכֵן עָשָׂה יְהוֹשֻׁעַ (יהושע כ\"ד) וְכֵן שְׁמוּאֵל (שמואל א י\"ב) \"הִתְיַצְּבוּ וְאִשָּׁפְטָה אִתְּכֶם\", כְּשֶׁיָּצְאוּ מִיָּדוֹ וְנִכְנְסוּ לְיָדוֹ שֶׁל שָׁאוּל (עי' תנחומא):", "rashi_en": "למען הקים אתך היום לו לעם THAT HE MAY ESTABLISH THEE TO-DAY FOR A PEOPLE UNTO HIMSELF — He undertakes so much trouble (in making another covenant with you) in order that He may keep (הקים) you for a people in His presence,<br><br>והוא יהיה לך לאלהים SINCE HE MUST BE UNTO THEE A GOD, because He has promised it unto you and has sworn unto your fathers not to exchange their descendants for another nation. For this reason He binds you by these oaths not to provoke Him to anger since He, on His part, cannot dissociate Himself from you. — Thus far I have given an exposition according to the literal sense of the chapter. An Agadic explanation, however, is: Why is the section beginning with the words, “Ye are standing this day” put in juxtaposition to the curses in the previous chapter? Because when Israel heard these ninety-eight curses besides the forty-nine that are contained in Torath-Cohanim (Leviticus 26:14 ff.), their faces turned pale (they were horrified), and they exclaimed, “Who can possibly stand against these?!” Therefore Moses began to calm them: “See, you are standing today before the Lord!” — many a time have you provoked the Omnipresent to anger and yet He has not made an end to you, but you still continue in His presence (Midrash Tanchuma, Nitzavim 1).<br><br>היום THIS DAY — like the “day” which endures for ever, for though it becomes dark for a period it shines again, (cf. Midrash Tanchuma, Nitzavim 1, Sanhedrin 110b); so has He made you shine (i.e. given you periods when you have had nought but happiness) and will again make you shine; and it is just the curses and the sufferings that give you permanence and stability (נצבים) before Him. — So, too, the section preceding this (1 ff. which follows immediately after the curses) consists of comforting words: “Ye have seen all the Lord did [before your eyes in the land of Egypt unto Pharaoh, etc.]”.  — Another explanation of אתם נצבים: Because the Israelites were now passing from one leader to another, from Moses to Joshua, therefore he (Moses) made them stand in ranks (מצבה) that he might address admonitions to them. Similarly did Joshua (cf. Joshua 24:1) and similarly did Samuel, who said, (I Samuel 12:7): “Now therefore take your stand (התיצבו) that I may reason with you before the Lord”, when they were leaving his hand (leadership) and were coming under the hand of Saul (cf. Midrash Tanchuma, Nitzavim 1)."}, {"ch": 29, "v": 13, "aliyah": 1, "heb": "וְלֹ֥א אִתְּכֶ֖ם לְבַדְּכֶ֑ם אָנֹכִ֗י כֹּרֵת֙ אֶת־הַבְּרִ֣ית הַזֹּ֔את וְאֶת־הָאָלָ֖ה הַזֹּֽאת׃", "onk": "וְלָא עִמְּכוֹן בִּלְחוֹדֵיכוֹן אֲנָא גְּזַר יָת קְיָמָא הָדָא וְיָת מוֹמָתָא הָדָא:", "onk_en": "And not with you alone am I making this covenant and this oath-curse.", "pj": "וְלָא עִמְכוֹן בִּלְחוֹדֵיכוֹן אֲנָא גְזַר יַת קְיָימָא הָדָא וּמַסְהִיד יַת מוֹמָתָא הָדָא", "pj_en": "And not with you only do I ratify this covenant, and attest this adjuration;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 14, "aliyah": 1, "heb": "כִּי֩ אֶת־אֲשֶׁ֨ר יֶשְׁנ֜וֹ פֹּ֗ה עִמָּ֙נוּ֙ עֹמֵ֣ד הַיּ֔וֹם לִפְנֵ֖י יְהֹוָ֣ה אֱלֹהֵ֑ינוּ וְאֵ֨ת אֲשֶׁ֥ר אֵינֶ֛נּוּ פֹּ֖ה עִמָּ֥נוּ הַיּֽוֹם׃", "onk": "אֲרֵי יָת <b>מָן<\/b> דְּאִיתוֹהִי הָכָא עִמָּנָא קָאֵם יוֹמָא דֵין קֳדָם יְיָ אֱלָהָנָא וְיָת דִּי לֵיתוֹהִי הָכָא עִמָּנָא יוֹמָא דֵין:", "onk_en": "But with whoever is here with us standing today in the presence of Adonoy, our God, and with those who are not here with us today.", "pj": "אֲרוּם יַת כָּל דָרַיָא דְקָמוּן מִן יוֹמֵי עַלְמָא כֻּלְהוֹן הִנוּן דְקַיְימִין הָכָא עִמָנָא יוֹמָנָא קֳדָם יְיָ אֱלָהָנָא וְיַת כָּל דָרַיָא דַעֲתִידִין לְמֵיקוּם עַד סוֹף כָּל עַלְמָא כּוּלְהוֹן הִינוּן קַיְימִין הָכָא עִמָן יוֹמָנָא", "pj_en": "but all the generations which have arisen from the days of old stand with us today before the Lord our God, and all the generations which are to arise unto the end of the world, all of them stand with us here this day.", "tj": "אֲרוּם כָּל דָרַיָא דִי קָמוּ מִן יְמוֹת עַלְמָא וְעַד כְּדוֹן עִמָךְ קַיָימִין הָכָא יוֹמָא דֵין קֳדָם יְיָ אֱלָהָכוֹן וְיַת כָּל דָרַיָא דַעֲתִידִין לְמֵיקוּם מִן בַּתְרָן (י\"ג כּוּלְהוֹן) כְּאִילוּ קַיָימִין הָכָא עִמָן יוֹמָא דֵין:", "tj_en": "All the generations which have arisen from the days of old until now stand with thee to-day before the Lord your God, and all the generations which are to arise after us stand also here with us to-day.", "rashi": "<b>ואת אשר איננו פה.<\/b> וְאַף עִם דּוֹרוֹת הָעֲתִידִים לִהְיוֹת:", "rashi_en": "ואת אשר איננו פה [NOT WITH YOU ALONE DO I MAKE THIS COVENANT … BUT WITH HIM THAT STANDETH HERE …] AND ALSO WITH HIM THAT IS NOT HERE — i.e. with the generations that will be in future (i.e. Moses is not referring to persons who happened to be absent from the assembly, for it states, v. 10, that all were present: “You are standing this day all of you before the Lord”) (Midrash Tanchuma, Nitzavim 3)."}, {"ch": 29, "v": 15, "aliyah": 1, "heb": "כִּֽי־אַתֶּ֣ם יְדַעְתֶּ֔ם אֵ֥ת אֲשֶׁר־יָשַׁ֖בְנוּ בְּאֶ֣רֶץ מִצְרָ֑יִם וְאֵ֧ת אֲשֶׁר־עָבַ֛רְנוּ בְּקֶ֥רֶב הַגּוֹיִ֖ם אֲשֶׁ֥ר עֲבַרְתֶּֽם׃", "onk": "אֲרֵי אַתּוּן יְדַעְתּוּן יָת דִּיתֵבְנָא בְּאַרְעָא דְמִצְרָיִם וְיָת דִּי עֲבַרְנָא בְּגוֹ עַמְמַיָּא דִּי עֲבַרְתּוּן:", "onk_en": "For you are aware how we lived in the land of Egypt, and how we passed through the nations whom you passed through.", "pj": "אֲרוּם אַתּוּן יְדַעְתּוּן סְכוּם שְׁנַיָא דְיָתִיבְנָא בְּאַרְעָא דְמִצְרַיִם וּגְבוּרָן דְעָבַד לָנָא בֵּינֵי עַמְמַיָא דַעֲבַרְתּוּן", "pj_en": "For you know the number of the years that we dwelt in the land of Mizraim, and the mighty works which were wrought for us among the nations through which you have passed.", "tj": "", "tj_en": "", "rashi": "<b>כי אתם ידעתם וגו'.<\/b> לְפִי שֶׁרְאִיתֶם הָאֻמּוֹת, וְשֶׁמָּא הִשִּׂיא לֵב אֶחָד מִכֶּם אוֹתוֹ לָלֶכֶת אַחֲרֵיהֶם, <b>פן יש בכם וגו'<\/b>, לְפִיכָךְ אֲנִי צָרִיךְ לְהַשְׁבִּיעֲכֶם:", "rashi_en": "כי אתם ידעתם וגו׳ FOR YE KNOW [HOW WE HAVE ABODE IN THE LAND OF EGYPT] etc. — The meaning of these verses is: Because you have seen the conduct of the other nations, and perhaps the heart of one of you might beguile him to follow them, — as it goes on to state, “Lest there should be among you a man, or a woman … [whose heart turneth away this day from the Lord]”, — on this account I must place you under an oath."}, {"ch": 29, "v": 16, "aliyah": 1, "heb": "וַתִּרְאוּ֙ אֶת־שִׁקּ֣וּצֵיהֶ֔ם וְאֵ֖ת גִּלֻּלֵיהֶ֑ם עֵ֣ץ וָאֶ֔בֶן כֶּ֥סֶף וְזָהָ֖ב אֲשֶׁ֥ר עִמָּהֶֽם׃", "onk": "וַחֲזֵתוּן יָת שִׁקּוּצֵיהוֹן וְיָת טַעֲוָתְהוֹן אָעָא וְאַבְנָא כַּסְפָּא וְדַהֲבָא דִּי עִמְּהוֹן:", "onk_en": "Where you observed their abominations and their loathsomeness [idols], wood and stone, silver and gold, that they owned.", "pj": "וְחָמִתּוּן יַת מְרַחְקַתְהוֹן וְיַת טַעֲוָון דִלְהוֹן דְמִן קֵיסָא וְאַבְנָא דְרַמְיָין בְּאוֹשְׁקְקֵי וְטַעֲוָון דִכְסַף וּדְהַב דִיהִיבִין עִמְהוֹן בְּבָתַּיָא אַחֲדִין דָמִין בַּתְרֵיהוֹן דְלָא יִתְגַנְבוּן", "pj_en": "You have seen their abominations, and their idols of wood and stone which they have set forth in the streets, and the idols of silver and gold that they have placed with themselves in the houses, shutting the doors after them lest they should be stolen.", "tj": "וַחֲמִיתּוּן יַת מַקְשֵׁיצַתְהוֹן וְיַת מַרְחִקַתְהוֹן טַעֲוָון דְקֵיסַיָא וְטַעֲוָון דְאַבְנַיָא טַעֲוָון דִכְסַף וְטַעֲוָון דִדְהַב טַעֲוָותָא דְקֵיסָא וּדְאַבְנָא הֲווֹן מְטַלְקִין יַתְהוֹן בְּשׁוּקַיָיא וְטַעֲוָותָא דְכַסְפָּא וְדַהֲבָא הֲווֹן יְהִיבִין עִמְהוֹן בְּגוֹ בֵּיתָא דַחֲלִין מִנְהוֹן דְלָא יִתְגַנְבוּן:", "tj_en": "You have seen their hateful things and their abominations, the idols of wood and stone, of silver and gold; idols of wood and stone set forth in the streets, but those of silver and gold kept with themselves in the house because they were afraid they would be stolen.", "rashi": "<b>ותראו את שקוציהם.<\/b> עַל שֵׁם שֶׁהֵם מְאוּסִים כַּשְּׁקָצִים:<br><br><b>גלליהם.<\/b> שֶׁמֻּסְרָחִים וּמְאוּסִין כַּגָּלָל:<br><br><b>עץ ואבן.<\/b> אוֹתָן שֶׁל עֵצִים וְשֶׁל אֲבָנִים רְאִיתֶם בַּגָּלוּי, לְפִי שֶׁאֵין הַגּוֹי יָרֵא שֶׁמָּא יִגָּנְבוּ, אֲבָל שֶׁל כֶּסֶף וְזָהָב <b>עמהם<\/b>, בְּחַדְרֵי מַשְׂכִּיתָם הֵם, לְפִי שֶׁהֵם יְרֵאִים שֶׁמָּא יִגָּנְבוּ (תנחומא):", "rashi_en": "ותראו את שקוציהם AND YE HAVE SEEN THEIR ABOMINABLE THINGS — Idols are so termed because they are loathsome like unclean things that are held in abomination.<br><br>גלליהם THEIR IDOLS — thus termed because they are detestable (lit., malodorous) and loathsome like dung (גלל).<br><br>עץ ואבן [AND YE HAVE SEEN … THEIR IDOLS] WOOD AND STONE — Those of wood and stone you have seen exposed openly, because the heathen was not afraid lest they might be stolen; those of gold and silver, however, ARE WITH THEM (עמהם), in their “marbled halls” (cf. Rashi on Ezekel 8:12 whence he borrowed this expression), because they were afraid they might be stolen (Midrash Tanchuma, Nitzavim 3)."}, {"ch": 29, "v": 17, "aliyah": 1, "heb": "פֶּן־יֵ֣שׁ בָּ֠כֶ֠ם אִ֣ישׁ אֽוֹ־אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ־שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨וֹ פֹנֶ֤ה הַיּוֹם֙ מֵעִם֙ יְהֹוָ֣ה אֱלֹהֵ֔ינוּ לָלֶ֣כֶת לַעֲבֹ֔ד אֶת־אֱלֹהֵ֖י הַגּוֹיִ֣ם הָהֵ֑ם פֶּן־יֵ֣שׁ בָּכֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְלַעֲנָֽה׃", "onk": "דִּילְמָא אִית בְּכוֹן גְּבַר אוֹ אִתְּתָא אוֹ <b>זַרְעִית<\/b> אוֹ שִׁבְטָא דִּי לִבֵּיהּ פָּנֵי יוֹמָא דֵין <b>מִדַּחַלְתָּא<\/b> דַּיְיָ אֱלָהָנָא לְמֵהַךְ לְמִפְלַח יָת <b>טַעֲוַת<\/b> <b>עַמְמַיָּא<\/b> הָאִנּוּן דִּילְמָא אִית בְּכוֹן <b>גְּבַר מְהַרְהַר חֶטְאִין אוֹ זָדוֹן<\/b>:", "onk_en": "Perhaps there is among you a man or a woman or a family [<b>offspring<\/b>] or a tribe whose thoughts stray today from [being] with [<b>the fear of<\/b>] Adonoy, our God, to go serve the gods [<b>idols<\/b>] of those nations; lest there is within you a root producing gall and bitter fruit [<b>a man who imagines sin or evil<\/b>].", "pj": "אִזְדַהֲרוּן דִלְמָא אִית בְּכוֹן הַשְׁתָּא וְלָא יֶהֱוֵי בָּתַר דְנָא בַּר נַשׁ אוֹ אִיתָא אוֹ גְנִיסָא אוֹ שִׁיבְטָא דְלִבֵּיהּ מִתְפְּנֵי לְמִטְעֵי יוֹמָנָא מִדַחַלְתָּא דַיְיָ אֱלָהָנָא לְמִפְלַח יַת טַעֲוַות עַמְמַיָא הָאִינוּן דִלְמָא אִית בְּכוֹן טְעוּ דְשָׁרִישׁ דְלִבֵּיהּ מְהַרְהַר עֲלוֹי בָּתַר חִיטָאֵיהּ דְשֵׁירוֹי חִיטָאֵיהּ חוֹלִי וְסוֹפֵיהּ מְרִיר כְּאַגְרָנַיָא דְמוֹתָא", "pj_en": "Beware, then, lest there be among you now or hereafter a man, woman, family, or tribe, whose heart may be turned away to wander any day from the service of the Lord our God to worship the idols of those nations; or lest there be among you the error which striketh root (in them) whose heart wandereth after his sin; for the beginning of sin may be sweet, but its end is bitter as the deadly wormwood;", "tj": "דְלָא יֶהֱוֵי לְכוֹן גְבַר אוֹ אִתְּתָא אוֹ זַרְעָא אוֹ שִׁבְטָא דְלִבֵּיהּ סָטֵי יוֹמָא דֵין מִן קֳדָם יְיָ אֱלָהֵן לְמֵזַל לְמִפְלַח יַת טַעֲוָותָא דְעַמְמַיָא הָאִנוּן דִלְמָא יֶהֱוֵי בְּכוֹן גְבַר דְלִבֵּיהּ מְהַרְהֵר בְּחֶטְאָה דְהוּא מְדַמֵי לְשׁוֹרֶשׁ קְבִיעָא בְּאַרְעָא אֲרוּם רֵישֵׁיהּ חֲלֵי כְּדֻבְשָׁא וְסוֹפֵיהּ מָרִיר כְּלַעֲנָתָא דְמוֹתָא:", "tj_en": "Lest there be among you man or woman, family or tribe, whose heart is turned away this day from the Lord our God to go and worship the idols of these people, or there be a man among you whose heart pondereth upon sin, which is like a root struck into the earth; for its beginning may be sweet as honey, but its end will be bitter as the deadly wormwood;", "rashi": "<b>פן יש בכם.<\/b> שֶׁמָּא <b>יש בכם<\/b>:<br><br><b>אשר לבבו פנה היום.<\/b> מִלְּקַבֵּל עָלָיו הַבְּרִית:<br><br><b>שרש פרה ראש ולענה.<\/b> שֹׁרֶשׁ מְגַדֵּל עֵשֶׂב מַר כַּגִּידִין שֶׁהֵם מָרִים, כְּלוֹמַר — מַפְרֶה וּמַרְבֶּה רֶשַׁע בְּקִרְבְּכֶם:", "rashi_en": "פן יש בכם means PERHAPS (שמא = פן) THERE IS AMONG YOU,<br><br>אשר לבבו פנה היום [A MAN …] WHOSE HEART TURNETH AWAY THIS DAY from accepting the covenant upon himself,<br><br>שרש פרה ראש ולענה [PERHAPS THERE IS AMONG YOU] A ROOT THAT IS FRUITFUL IN POISONOUS HERB AND WORMWOOD — i.e. a root that brings forth herbs bitter as wormwood-plants, which are very bitter. The meaning is: Lest there be a man or woman or family or tribe that fruitfully produces and increases wickedness in your midst."}, {"ch": 29, "v": 18, "aliyah": 1, "heb": "וְהָיָ֡ה בְּשׇׁמְעוֹ֩ אֶת־דִּבְרֵ֨י הָאָלָ֜ה הַזֹּ֗את וְהִתְבָּרֵ֨ךְ בִּלְבָב֤וֹ לֵאמֹר֙ שָׁל֣וֹם יִֽהְיֶה־לִּ֔י כִּ֛י בִּשְׁרִר֥וּת לִבִּ֖י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָרָוָ֖ה אֶת־הַצְּמֵאָֽה׃", "onk": "וִיהֵי בְּמִשְׁמְעֵיהּ יָת פִּתְגָּמֵי מוֹמָתָא הָדָא <b>וִיחַשַּׁב בְּלִבֵּיהּ<\/b> לְמֵימַר שְׁלָמָא יְהֵי לִי אֲרֵי <b>בְּהַרְהוֹר<\/b> לִבִּי אֲנָא אָזֵל בְּדִיל <b>לְאוֹסָפָא לֵיהּ חֶטְאֵי שָׁלוּתָא עַל זְדָנוּתָא<\/b>:", "onk_en": "When he hears the statements of this oath-curse, he will imagine self-blessings [<b>think to himself<\/b>], saying, ‘‘Peace will be my lot when I shall follow what my thoughts envision,’’ so that the unintentional may be added to the sinful [<b>I will add unintentional sins to the intentional<\/b>].", "pj": "וִיהֵי בְּמִשְׁמְעֵיהּ יַת פִּתְגָמֵי מוֹמָתָא הָדָא וְיִתְיָיאֵשׁ בְּלִבֵּיהּ לְמֵימָר שְׁלָמָא יְהֵא לִי אֲרוּם בִּתְקוֹף יִצְרָא בִישָׁא דְלִבִּי אֵיזִיל מִן בִּגְלַל לְמוֹסְפָא חוֹבֵי שָׁלוּתָא עַל זְדוֹנוֹתָא", "pj_en": "or it be that when he heareth the words of this curse he become reprobate in his heart, saying: I shall have peace, though I go on in the strength of the evil desires of my heart: so that he will add presumption to the sins of ignorance.", "tj": "", "tj_en": "", "rashi": "<b>והתברך בלבבו.<\/b> לְשׁוֹן בְּרָכָה, יַחֲשֹׁב בְּלִבּוֹ בִּרְכַּת שָׁלוֹם לְעַצְמוֹ לֵאמֹר, לֹא יְבוֹאוּנִי קְלָלוֹת הַלָּלוּ, אַך <b>שלום יהיה לי<\/b>:<br><br><b>והתברך.<\/b> בנדי\"רא שו\"יא בְּלַעַז, כְּמוֹ וְהִתְגַּלָּח, וְהִתְפַּלֵּל:<br><br><b>בשררות לבי אלך.<\/b> בְּמַרְאִית לִבִּי, כְּמוֹ (במדבר כ\"ד) \"אֲשׁוּרֶנּוּ וְלֹא קָרוֹב\", כְּלוֹמַר, מַה שֶּׁלִּבִּי רוֹאֶה לַעֲשׂוֹת:<br><br><b>למען ספות הרוה.<\/b> לְפִי שֶׁאוֹסִיף לוֹ פֻּרְעָנוּת עַל מַה שֶּׁעָשָׂה עַד הֵנָּה בְשׁוֹגֵג, וְהָיִיתִי מַעֲבִיר עֲלֵיהֶם, וְגוֹרֵם עַתָּה שֶׁאֲצָרְפֵם עִם הַמֵּזִיד וְאֶפָּרַע מִמֶּנּוּ הַכֹּל, וְכֵן תִּרְגֵּם אֻנְקְלוֹס \"בְּדִיל לְאוֹסָפָא לֵהּ חֶטְאֵי שָׁלוּתָא עַל זְדָנוּתָא\" — שֶׁאוֹסִיף לוֹ אֲנִי הַשְּׁגָגוֹת עַל הַזְּדוֹנוֹת:<br><br><b>הרוה.<\/b> שׁוֹגֵג, שֶׁהוּא עוֹשֶׂה כְאָדָם שִׁכּוֹר שֶׁהוּא עוֹשֶׂה שֶׁלֹּא מִדַּעַת:<br><br><b>הצמאה.<\/b> שֶׁהוּא עוֹשֶׂה מִדַּעַת וּבְתַאֲוָה:", "rashi_en": "והתברך בלבבו AND HE BLESS HIMSELF IN HIS HEART — The word והתברך has the meaning of “blessing”. In his heart he will imagine for himself a blessing of peace, saying, “These curses will not come upon me, I shall have peace”.<br><br>והתברך is benoir soi in old French, i.e. the verb is reflexive like והתגלח, “he shall shave himself”, והתפלל, he shall pray lit., he shall make himself the object of intercession.<br><br>בשררות לבי אלך means IN THE VIEWS OF MY HEART WILL I WALK, שררות being of a root which means to look, to see, as (Numbers 25:17): “I shall see him (אשרנו), but not now”; it is as much as to say, I will follow what my heart sees good to do.<br><br>למען ספות הרוה TO ADD DRUNKENNESS [TO THE THIRST] — In order that I may add punishment for him even for the sins he has committed until now inadvertently (for which the figurative expression in this sentence is הרוה, drunkenness: cf. the following passage in Rashi), and which I used to overlook; — but now he causes Me to combine them with those committed with premeditation and to exact punishment from him for everything. Onkelos, too, rendered it in a similar sense: “in order to add for him the sins of inadvertence to those of premeditation”, which can only mean. “In order that “I” may add sins of inadvertence to those of presumption”.<br><br>הרוה DRUNKENNESS figuratively describes the condition of a שוגג, one who acts inadvertently. The expression is an apt one because he acts like a drunken man who does things unwittingly,<br><br>הצמאה THE THIRST aptly describes the attitude of one who acts wittingly and out of desire."}, {"ch": 29, "v": 19, "aliyah": 1, "heb": "לֹא־יֹאבֶ֣ה יְהֹוָה֮ סְלֹ֣חַֽ לוֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף־יְהֹוָ֤ה וְקִנְאָתוֹ֙ בָּאִ֣ישׁ הַה֔וּא וְרָ֤בְצָה בּוֹ֙ כׇּל־הָ֣אָלָ֔ה הַכְּתוּבָ֖ה בַּסֵּ֣פֶר הַזֶּ֑ה וּמָחָ֤ה יְהֹוָה֙ אֶת־שְׁמ֔וֹ מִתַּ֖חַת הַשָּׁמָֽיִם׃", "onk": "לָא יֵיבֵי יְיָ לְמִשְׁבַּק לֵיהּ אֲרֵי בְּכֵן <b>יִתְקֵף רָגְזָא<\/b> דַיְיָ וְחֶמְתֵיהּ בְּגַבְרָא הַהוּא <b>וְיִדְבְּקוּן<\/b> בֵּיהּ כָּל לְוָטַיָּא דִּכְתִיבִין בְּסִפְרָא הָדֵין וְיִמְחֵי יְיָ יָת שְׁמֵיהּ מִתְּחוֹת שְׁמַיָּא:", "onk_en": "Adonoy will be unwilling to forgive him, because then Adonoy’s nostrils will fume [<b>anger will be aroused<\/b>] and His vengeful fury will enflame against [<b>cleave to<\/b>] that man, and there will cling to him the entire oath-curse written in this book; and Adonoy will eliminate his name from beneath the sky.", "pj": "לָא יְהֵי רַעֲוָא מִן קֳדָם יְיָ לְמִשְׁבַּק לֵיהּ אֲרוּם בְּכֵן יִתְקוֹף רוּגְזָא דַיְיָ וְחֵימְתֵיהּ בְּבַר נְשָׁא הַהוּא וְתָחֵיל בֵּיהּ כָּל פִּתְגָמֵי לְוָוטַיָא דִכְתִיבִין בְּסִפְרָא הָדֵין וְיִמְחֵי יְיָ יַת שׁוּם דוּכְרָנֵיהּ מִתְּחוֹת שְׁמַיָא", "pj_en": "It will not be pleasing to the Lord to forgive him; for the Lord’s anger and indignation will wax hot against that man, and all the words of the curses written in this book will rest upon him, and the Lord will blot out the memorial of his name from under the heavens.", "tj": "", "tj_en": "", "rashi": "<b>יעשן אף ה'.<\/b> עַל יְדֵי כַעַס הַגּוּף מִתְחַמֵּם וְהֶעָשָׁן יוֹצֵא מִן הָאַף, וְכֵן (שמואל ב כ״ב:ט׳) \"עָלָה עָשָׁן בְּאַפּוֹ\", וְאַף עַל פִּי שֶׁאֵין זוֹ לִפְנֵי הַמָּקוֹם, הַכָּתוּב מַשְׁמִיעַ אֶת הָאֹזֶן כְּדֶרֶךְ שֶׁהִיא רְגִילָה וִיכוֹלָה לִשְׁמֹעַ כְּפִי דֶרֶךְ הָאָרֶץ:<br><br><b>וקנאתו.<\/b> לְשׁוֹן חֵמָה, אנפרטמי\"נט, אֲחִיזַת לְבִישַׁת נְקָמָה וְאֵינוֹ מַעֲבִיר עַל הַמִּדָּה:", "rashi_en": "יעשן אף ה׳ THE ANGER OF THE LORD SHALL SMOKE [AGAINST THAT MAN] — Through anger the body becomes heated and smoke, as it were, issues from the nostrils. And thus does it state, (Psalms 18:9) “Smoke rose up in his nostril”. Although this idea is not really applicable to God, Scripture makes the human ear hear the matter (i.e. it tells it to him) in the manner that it is accustomed and able to understand according to the ordinary course of the world (i.e. when speaking of God it uses language that properly is applicable only to human beings because this the only language we have at our command).<br><br>וקנאתו — This is a term denoting wrath, emportment in old French; it means: retaining one’s hold on the 'garment of vengeance', and not forgoing one’s right to punish."}, {"ch": 29, "v": 20, "aliyah": 1, "heb": "וְהִבְדִּיל֤וֹ יְהֹוָה֙ לְרָעָ֔ה מִכֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּכֹל֙ אָל֣וֹת הַבְּרִ֔ית הַכְּתוּבָ֕ה בְּסֵ֥פֶר הַתּוֹרָ֖ה הַזֶּֽה׃", "onk": "וְיַפְרְשִׁנֵּיהּ יְיָ לְבִישָׁא מִכֹּל שִׁבְטַיָּא דְיִשְׂרָאֵל כְּכֹל לְוָטֵי קְיָמָא דִּכְתִיבִין בְּסִפְרָא דְאוֹרַיְתָא הָדֵין:", "onk_en": "And Adonoy will seperate him for harm from all the tribes of Yisroel, in accord with all the oath-curses of the covenant inscribed in this Torah scroll.", "pj": "וְיַפְרִישִׁינֵיהּ יְיָ לְבִישָׁא מִכָּל שִׁבְטַיָא דְיִשְרָאֵל הֵי כְּכָל לְוָוטֵי קְיָימָא דִכְתִיבִין בְּסִפְרָא הָדֵין", "pj_en": "And the Lord will separate him unto evil, from all the tribes of Israel, according to all the maledictions of the covenant which are written in this book.", "tj": "", "tj_en": "", "rashi": "<b>הכתובה בספר התורה הזה.<\/b> וּלְמַעְלָה הוּא אוֹמֵר \"גַּם כָּל חֳלִי וְכָל מַכָּה … בְּסֵפֶר הַתּוֹרָה הַזֹּאת\"? הַזֹּאת — לְשׁוֹן נְקֵבָה מוּסָב אֶל הַתּוֹרָה, הַזֶּה — לְשׁוֹן זָכָר מוּסָב אֶל הַסֵּפֶר, וְעַל יְדֵי פִסּוּק הַטְּעָמִים הֵן נֶחֱלָקִין לִשְׁתֵּי לְשׁוֹנוֹת, בְּפָרָשַׁת הַקְּלָלוֹת הַטִּפְּחָא נְתוּנָה תַּחַת בְּסֵפֶר, וְהַתּוֹרָה הַזֹּאת דְּבוּקִים זֶה לָזֶה, לְכָךְ אָמַר הַזֹּאת, וְכָאן הַטִּפְּחָא נְתוּנָה תַּחַת הַתּוֹרָה, נִמְצָא סֵפֶר הַתּוֹרָה דְּבוּקִים זֶה לָזֶה, לְפִיכָךְ לְשׁוֹן זָכָר נוֹפֵל אַחֲרָיו, שֶׁהַלָּשׁוֹן נוֹפֵל עַל הַסֵּפֶר:", "rashi_en": "הכתובה בספר התורה הזה — Above, however, (Deuteronomy 28:61) it says: And every sickness and every plague … [which is not written] הזאת) בספר התורה הזאת the feminine form, whilst here we have הזה, the masculine)?! But the explanation is: הזאת, the feminine form, refers to the feminine word התורה, whilst הזה, the masculine form, refers to the masculine word הספר in our text. Through the division into clauses by means of the tonic accents (which serve also as marks of interpunctuation) they (the two phrases) are shown to be two different expressions: in the chapter containing the curses (ch. Deuteronomy 28:61) the Tipcha (a disjunctive accent) is placed beneath the word בספר, and the words התורה הזאת are connected one with the other, therefore it says הזאת, the feminine form, (since it has to be connected with a feminine noun), whilst here the Tipcha is placed beneath the word התורה, and consequently the words ספר התורה are connected one with the other (i.e. they form one phrase), — therefore it is a masculine word that is applicable after it, because the term (the pronoun) refers to הספר (which is masculine)."}, {"ch": 29, "v": 21, "aliyah": 1, "heb": "וְאָמַ֞ר הַדּ֣וֹר הָאַחֲר֗וֹן בְּנֵיכֶם֙ אֲשֶׁ֤ר יָק֙וּמוּ֙ מֵאַ֣חֲרֵיכֶ֔ם וְהַ֨נׇּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵאֶ֣רֶץ רְחוֹקָ֑ה וְ֠רָא֠וּ אֶת־מַכּ֞וֹת הָאָ֤רֶץ הַהִוא֙ וְאֶת־תַּ֣חֲלֻאֶ֔יהָ אֲשֶׁר־חִלָּ֥ה יְהֹוָ֖ה בָּֽהּ׃", "onk": "וְיֵימַר דָּרָא בַתְרָאָה בְּנֵיכוֹן דִּי יְקוּמוּן מִבַּתְרֵיכוֹן <b>וּבַר עַמְמִין<\/b> דְּיֵיתֵי מֵאַרְעָא רְחִיקָא וְיֶחֱזוּן יָת מְחָתָא דְּאַרְעָא הַהִיא וְיָת מַרְעָהָא דִּי אַמְרַע יְיָ בַּהּ:", "onk_en": "The latter generation will say—your children who will arise after you and the stranger [<b>foreign alien<\/b>] who will come from a distant land; and they will see the plagues of that land and its illnesses that Adonoy has harmed it with.", "pj": "וְיֵימְרוּן דָרַיָא בַּתְרָאֵי בְּנֵיכוֹן דִי יְקוּמוּן מִן בַּתְרֵיכוֹן וּבַר עַמְמֵי דְיֵיתֵי מֵאַרַע רְחִיקָא וְיֶחְמוּן יַת מַחֲוָותָא דְאַרְעָא הַהִיא וְיַת מַרְעָהָא דְגָרֵי יְיָ בָּהּ", "pj_en": "And the generations of your children who will arise after you, and the stranger who will come from a far-off land, when they see the plagues of that land, and the afflictions which the Lord will have sent upon it,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 22, "aliyah": 1, "heb": "גׇּפְרִ֣ית וָמֶ֘לַח֮ שְׂרֵפָ֣ה כׇל־אַרְצָהּ֒ לֹ֤א תִזָּרַע֙ וְלֹ֣א תַצְמִ֔חַ וְלֹא־יַעֲלֶ֥ה בָ֖הּ כׇּל־עֵ֑שֶׂב כְּֽמַהְפֵּכַ֞ת סְדֹ֤ם וַעֲמֹרָה֙ אַדְמָ֣ה <span class=\"mam-kq\"><span class=\"mam-kq-k\">(וצביים)<\/span> <span class=\"mam-kq-q\">[וּצְבוֹיִ֔ם]<\/span><\/span> אֲשֶׁר֙ הָפַ֣ךְ יְהֹוָ֔ה בְּאַפּ֖וֹ וּבַחֲמָתֽוֹ׃", "onk": "גָּפְרֵתָא וּמִלְחָא יְקִידַת כָּל אַרְעַהּ לָא תִזְרַע וְלָא תַצְמַח וְלָא יִסַּק בַּהּ כָּל עֶסְבָּא כְּמַהְפֶּכְתָּא דִּסְדֹם וַעֲמֹרָה אַדְמָה וּצְבוֹיִם דִּי הֲפַךְ יְיָ <b>בְּרָגְזֵיהּ<\/b> וּבְחֶמְתֵיהּ:", "onk_en": "Sulfur and salt, all its land, will be burnt, it will not be seeded, and it will not sprout, and no grass will grow there; like the overturning of Sodom and Amoroh, Admoh and Tzevoyim, which Adonoy overturned in His anger and His wrath.", "pj": "כּוּבְרֵיתָא וּמִלְחָא עִם אֵשָׁא מְצַלְהֲבָא תְּהֵי יָקְדָא כָּל אַרְעָא לָא תִתְכַּשַׁר לְבַר זְרַע וְלָא תַרְבֵּי צְמָחִין וְלָא יִסַק בָּהּ כָּל עִשְבָּא תִּשְׁתְּקַע הֵיךְ תְּהַפְכָנוּתָא דִסְדוֹם וַעֲמוֹרָא אַדְמָה וּצְבוֹיִים דְהָפַךְ מֵימְרָא דַיְיָ בְּרוּגְזֵיהּ וּבִכְלִיתֵיהּ", "pj_en": "the whole land burnt with brimstone, salt, and fierce heat, no longer fit for sowing, nor productive of a blade of any springing herbage; ruined, as Sedom and Amorah, Admah and Zeboim, were overthrown by the Word of the Lord in His wrath and indignation;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 23, "aliyah": 1, "heb": "וְאָֽמְרוּ֙ כׇּל־הַגּוֹיִ֔ם עַל־מֶ֨ה עָשָׂ֧ה יְהֹוָ֛ה כָּ֖כָה לָאָ֣רֶץ הַזֹּ֑את מֶ֥ה חֳרִ֛י הָאַ֥ף הַגָּד֖וֹל הַזֶּֽה׃", "onk": "וְיֵימְרוּן כָּל עַמְמַיָּא עַל מֶה עֲבַד יְיָ כְּדֵין לְאַרְעָא הָדָא מָא <b>תְקוֹף רָגְזָא<\/b> רַבָּא הָדֵין:", "onk_en": "And all the nations will say, ‘‘For what did Adonoy do so to this land? Why the vigor of this great [<b>aroused<\/b>] anger?’’", "pj": "וְיֵימְרוּן כָּל עַמְמַיָא מְטוּל מַה עָבַד יְיָ הֵיכְנָא לְאַרְעָא הָדָא מַה הֲוָה תְּקוֹף רוּגְזָא רַבָּא הָדֵין", "pj_en": "then all people will say, Why hath the Lord done so unto this land? What meaneth the strength of this great anger?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 24, "aliyah": 1, "heb": "וְאָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָזְב֔וּ אֶת־בְּרִ֥ית יְהֹוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔ם בְּהוֹצִיא֥וֹ אֹתָ֖ם מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְיֵימְרוּן עַל דִּשְׁבָקוּ יָת קְיָמָא דַיְיָ אֱלָהָא דַאֲבָהָתְהוֹן דִּי גְּזַר עִמְּהוֹן בְּאַפָּקוּתֵיהּ יָתְהוֹן מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "And they will reply, ‘‘Because they forsook the covenant of Adonoy, the God of their forefathers, which He made with them when He took them out of the land of Egypt.", "pj": "וְיֵימְרוּן מְטוּל דִשְׁבָקוּ יַת קְיָימָא דַיְיָ אֱלָהָא דְאַבְהַתְהוֹן דְגָזַר עִמְהוֹן בְּאַפְקוּתֵיהּ יַתְהוֹן מֵאַרְעָא דְמִצְרָיִם", "pj_en": "And they will say, Because they forsook the covenant of the Lord, the God of their fathers, which He made with them when He brought them out of the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 25, "aliyah": 1, "heb": "וַיֵּלְכ֗וּ וַיַּֽעַבְדוּ֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַיִּֽשְׁתַּחֲו֖וּ לָהֶ֑ם אֱלֹהִים֙ אֲשֶׁ֣ר לֹֽא־יְדָע֔וּם וְלֹ֥א חָלַ֖ק לָהֶֽם׃", "onk": "וַאֲזָלוּ וּפְלָחוּ <b>לְטַעֲוַת עַמְמַיָּא<\/b> וּסְגִידוּ לְהוֹן <b>דַּחֲלָן<\/b> דִּי לָא יְדָעֻנּוּן וְלָא <b>אוֹטִיבָא<\/b> לְהוֹן:", "onk_en": "And they went and served other gods and prostrated themselves to them; gods unknown to them and [which] He had not apportioned to them.", "pj": "וַאֲזָלוּ בָּתַר יִצְרָא בִּישָׁא וּפְלָחוּ לְטַעֲוַות עַמְמַיָא וְסַגִידוּ לְהוֹן דַחֲלָן דְלָא יַדְעִינוּן וְלָא אִתְפַלְגוּן לְהוֹן", "pj_en": "But they went after their evil desires, and served the gods of the Gentiles, and worshipped gods which they had not known nor had any part with.", "tj": "", "tj_en": "", "rashi": "<b>לא ידעם.<\/b> לֹא יָדְעוּ בָהֶם גְּבוּרַת אֱלֹהוּת:<br><br><b>ולא חלק להם.<\/b> לֹא נְתָנָם לְחֶלְקָם; וְאֻנְקְלוֹס תִּרְגֵּם \"וְלָא אוֹטִיבָא לְהוֹן\", לֹא הֵטִיבוּ לָהֶם שׁוּם טוֹבָה; וְלָשׁוֹן לֹא חָלַק — אוֹתוֹ אֱלוֹהַּ שֶׁבָּחֲרוּ לָהֶם לֹא חָלַק לָהֶם שׁוּם נַחֲלָה וְשׁוּם חֵלֶק:", "rashi_en": "לא ידעום [FOR THEY … SERVED OTHER GODS] WHOM THEY KNEW NOT — i.e. in whom they had never experienced any Divine power.<br><br>ולא חלק להם means, He did not give them (the gods) to be their portion (cf. Rashi on Deuteronomy 4:19). Onkelos, however, renders it by לא אוטיבא להון, i.e. they did not bestow upon them any good. As for the expression לא חלק, Onkelos took it thus, explaining also the singular form of the verb: that god which they have chosen for themselves has never given them any חלק, any inheritance or portion."}, {"ch": 29, "v": 26, "aliyah": 1, "heb": "וַיִּחַר־אַ֥ף יְהֹוָ֖ה בָּאָ֣רֶץ הַהִ֑וא לְהָבִ֤יא עָלֶ֙יהָ֙ אֶת־כׇּל־הַקְּלָלָ֔ה הַכְּתוּבָ֖ה בַּסֵּ֥פֶר הַזֶּֽה׃", "onk": "<b>וּתְקֵף<\/b> <b>רָגְזָא<\/b> דַיְיָ בְּאַרְעָא הַהִיא לְאַיְתָאָה עֲלַהּ יָת כָּל לְוָטַיָּא דִּכְתִיבִין בְסִפְרָא הָדֵין:", "onk_en": "And Adonoy became furious with that land, [causing Him] to bring on it the entire curse written in this book.", "pj": "וּתְקֵיף רוּגְזָא דַיְיָ בְּאַרְעָא הַהִיא לְאַיְתַיָא עֲלָהּ יַת כָּל לְוָוטַיָא דִכְתִיבִין בְּסִפְרָא הָדֵין", "pj_en": "And the anger of the Lord waxed strong against this land, to bring upon it all the curses written in this book.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 27, "aliyah": 1, "heb": "וַיִּתְּשֵׁ֤ם יְהֹוָה֙ מֵעַ֣ל אַדְמָתָ֔ם בְּאַ֥ף וּבְחֵמָ֖ה וּבְקֶ֣צֶף גָּד֑וֹל וַיַּשְׁ<big>לִ<\/big>כֵ֛ם אֶל־אֶ֥רֶץ אַחֶ֖רֶת כַּיּ֥וֹם הַזֶּֽה׃", "onk": "וְטַלְטְלִנּוּן יְיָ מֵעַל אַרְעֲהוֹן בִּרְגַז וּבֶחֶמָה (וּבְחֵמְתָא) <b>וּבִתְקוֹף רְגַז וְאַגְלִנּוּן<\/b> לְאַרְעָא אָחֳרִי כְּיוֹמָא הָדֵין:", "onk_en": "And Adonoy forced them away from their land with anger and wrath and great fury [<b>aroused anger<\/b>]; and He cast [<b>exile<\/b>] them into another land like this day.", "pj": "וְטַלְטְלִינוּן יְיָ מֵעִלַוֵי אַרְעֲהוֹן בִּרְגוֹז וּבִכְלוּ וּבִתְקוֹף רַב וְטַלְקִינוּן בְּגָלוּתָא לְאַרַע חוֹרַן כִּזְמַן יוֹמָא הָדֵין", "pj_en": "And the Lord hath made them to wander forth from their country with anger, indignation, and wrath, and hath cast them into captivity in another land until this day.", "tj": "", "tj_en": "", "rashi": "<b>ויתשם ה'.<\/b> כְּתַרְגּוּמוֹ \"וְטַלְטְלִינוּן\", וְכֵן \"הִנְנִי נֹתְשָׁם מֵעַל אַדְמָתָם\" (ירמיהו י\"ב):", "rashi_en": "ויתשם ה׳ — Understand this as the Targum has it: וטלטלינון, “and He cast them out”. Similar is, (Jeremiah 12:14) “Behold, I cast them out (נתשם) from their land”."}, {"ch": 29, "v": 28, "aliyah": 1, "heb": "הַנִּ֨סְתָּרֹ֔ת לַיהֹוָ֖ה אֱלֹהֵ֑ינוּ וְהַנִּגְלֹ֞ת לָ֤ׄנׄוּׄ וּׄלְׄבָׄנֵ֙ׄיׄנׄוּ֙ׄ עַׄד־עוֹלָ֔ם לַעֲשׂ֕וֹת אֶת־כׇּל־דִּבְרֵ֖י הַתּוֹרָ֥ה הַזֹּֽאת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דְּמִטַּמְּרָן קֳדָם יְיָ אֱלָהָנָא וּדְמִגָּלְיָן לָנָא וְלִבְנָנָא עַד עֳלָם לְמֶעְבַּד יָת כָּל פִּתְגָּמֵי אוֹרַיְתָא הָדָא:", "onk_en": "The hidden [matters] are Adonoy’s, our God’s, and the revealed [matters] are ours and our children’s forever, to perform all the statements of this Torah.", "pj": "טְמִירְתָּא גַלְיַין קֳדָם יְיָ אֱלָהָנָא וְהוּא יִפְרַע מִנְהוֹן וְגַלְיָיתָא יִתְמַסְרָן לָנָא וְלִבְנָנָא עַד עַלְמָא לְמֶעֱבַד לְהוֹן דִינָא מְטוּל לְקַיָימָא יַת כָּל פִּתְגָמֵי אוֹרַיְיתָא הָדָא", "pj_en": "The secret things are manifest before the Lord our God, and He will take vengeance for them; but the things that are revealed are delivered unto us and to our children for ever, to perform by them the thing that is right, for the confirmation of all the words of this law.", "tj": "", "tj_en": "", "rashi": "<b>הנסתרת לה' אלהינו.<\/b> וְאִם תֹּאמְרוּ מַה בְּיָדֵנוּ לַעֲשׂוֹת? אַתָּה מַעֲנִישׁ אֶת הָרַבִּים עַל הִרְהוּרֵי הַיָּחִיד, שֶׁנֶּאֱמַר \"פֶּן יֵשׁ בָּכֶם אִישׁ וְגוֹ'\", וְאַחַר כָּךְ \"וְרָאוּ אֶת מַכּוֹת הָאָרֶץ הַהִוא\", וַהֲלֹא אֵין אָדָם יוֹדֵעַ טְמוּנוֹתָיו שֶׁל חֲבֵרוֹ אֵין אֲנִי מַעֲנִישׁ אֶתְכֶם עַל הַנִּסְתָּרוֹת, שֶׁהֵן לַה' אֱלֹהֵינוּ, וְהוּא יִפָּרַע מֵאוֹתוֹ יָחִיד, אֲבָל \"הַנִּגְלוֹת לָנוּ וּלְבָנֵינוּ\" לְבָעֵר הָרָע מִקִּרְבֵּנוּ, וְאִם לֹא נַעֲשֶׂה דִּין בָּהֶם יֵעָנְשׁוּ הָרַבִּים. נָקוּד עַל <b>לנו ולבנינו<\/b> לִדְרֹשׁ שֶׁאַף עַל הַנִּגְלוֹת לֹא עָנַשׁ אֶת הָרַבִּים עַד שֶׁעָבְרוּ אֶת הַיַּרְדֵּן, מִשֶּׁקִּבְּלוּ עֲלֵיהֶם אֶת הַשְּׁבוּעָה בְּהַר גְּרִזִים וּבְהַר עֵיבָל וְנַעֲשׂוּ עֲרֵבִים זֶה לָזֶה (סוטה ל\"ז; עי' סנהדרין מ\"ג):", "rashi_en": "הנסתרת לה' אלהינו THE SECRET THINGS BELONG UNTO THE LORD OUR GOD — And if you say, “But what can we do? Thou threatenest the many (the whole community) with punishment because of the sinful thoughts of one individual, as it is said, (v. 17): “Lest there should be among you a man, [or a woman or a family … whose heart turneth away this day from the Lord …]”, and afterwards it states, (v. 21) “And they will see the plagues of that land”. But surely no man can know the secret thoughts of his fellow! Now, I reply: I do not threaten to punish you because of secret thoughts for these belong to the Lord our God and He will exact punishment from that individual; but those things which are revealed belong to us and to our children that we may put away the evil from our midst; and if we do not execute judgment upon them, the whole community will be punished. — There are dots on the words לנו ולבננו to suggest that even for the revealed sins (those committed openly), He did not punish the community until they had crossed the Jordan — from the moment when they took upon themselves the oath on Mount Gerizim and Mount Ebal and had thus become responsible for one another (Sanhedrin 43b; cf. Sotah 37b)."}, {"ch": 30, "v": 1, "aliyah": 2, "heb": "וְהָיָה֩ כִֽי־יָבֹ֨אוּ עָלֶ֜יךָ כׇּל־הַדְּבָרִ֣ים הָאֵ֗לֶּה הַבְּרָכָה֙ וְהַקְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְפָנֶ֑יךָ וַהֲשֵׁבֹתָ֙ אֶל־לְבָבֶ֔ךָ בְּכׇ֨ל־הַגּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲךָ֛ יְהֹוָ֥ה אֱלֹהֶ֖יךָ שָֽׁמָּה׃", "onk": "וִיהֵי אֲרֵי יֵיתוּן עֲלָךְ כָּל פִּתְגָּמַיָּא הָאִלֵּין בִּרְכַן וּלְוָטִין דִּי יְהָבִית קֳדָמָךְ וּתְתוּב לְלִבָּךְ בְּכָל עַמְמַיָּא דִּי אַגְלָךְ יְיָ אֱלָהָךְ לְתַמָּן:", "onk_en": "When it happens that there come upon you all these statements, the blessing and the curse that I have set before you; and you will restore to your perception amid all the nations where Adonoy, your God, has exiled you.", "pj": "וִיהֵי כַד יֵיתוּן עִילַוֵיכוֹן יַת כָּל פִּתְגָמַיָא הָאִילֵן בִּירְכַן וְחִילוּפֵהוֹן דְסַדָרִית קֳדָמֵיכוֹן וְתֵיתְבוּן עַל לִבְּכוֹן לְמֵיתַב לְפוּלְחָנִי בְּכָל גַלְוַות עַמְמַיָא דְאַגְלֵי יַתְכוֹן יְיָ לְתַמָן", "pj_en": "And it will be, when all these words of blessings, or their contraries, which I have set in order before you shall have come upon you, you will be converted in your hearts to return unto My fear, in all the dispersions (among) the nations where the Lord will have scattered you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 2, "aliyah": 2, "heb": "וְשַׁבְתָּ֞ עַד־יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ וְשָׁמַעְתָּ֣ בְקֹל֔וֹ כְּכֹ֛ל אֲשֶׁר־אָנֹכִ֥י מְצַוְּךָ֖ הַיּ֑וֹם אַתָּ֣ה וּבָנֶ֔יךָ בְּכׇל־לְבָבְךָ֖ וּבְכׇל־נַפְשֶֽׁךָ׃", "onk": "וּתְתוּב <b>לְדַחַלְתָּא<\/b> דַיְיָ אֱלָהָךְ <b>וּתְקַבַּל לְמֵימְרֵיהּ<\/b> כְּכֹל דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין אַתְּ וּבְנָיךְ בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ:", "onk_en": "You will return to [<b>the fear of<\/b>] Adonoy, your God, and obey Him [<b>accept His word<\/b>] exactly as I am commanding you today, you and your sons, wholeheartedly and with your whole being.", "pj": "טוּבֵיכוֹן דְצַדִיקַיָא מָרֵי תְּתוּבָא דְכַד תְּחוֹבוּן וּתְתוּבוּן מַטְיָא תְּיוּבְתְּכוֹן עַד כּוּרְסֵי יְקָרָא דַיְיָ אֱלָהָכוֹן אִין תְּקַבְּלוּן לְמֵימְרֵיהּ כְּכָל מַה דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא אַתּוּן וּבְנֵיכוֹן בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן", "pj_en": "The upright of you will be favoured with a blessed repentance; and though you have sinned, yet shall your repentance come up unto the glorious throne of the Lord your God, if you will hearken to His Word according to all that I have commanded you this day, you, and your children, with all your heart and with all your soul.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 3, "aliyah": 2, "heb": "וְשָׁ֨ב יְהֹוָ֧ה אֱלֹהֶ֛יךָ אֶת־שְׁבוּתְךָ֖ וְרִחֲמֶ֑ךָ וְשָׁ֗ב וְקִבֶּצְךָ֙ מִכׇּל־הָ֣עַמִּ֔ים אֲשֶׁ֧ר הֱפִֽיצְךָ֛ יְהֹוָ֥ה אֱלֹהֶ֖יךָ שָֽׁמָּה׃", "onk": "וִיתוּב יְיָ אֱלָהָךְ יָת שָׁבֵי <b>גַלְוָתָךְ<\/b> וִירַחַם עֲלָךְ וִיתוּב וְיִכְנְשִׁנָּךְ מִכָּל עַמְמַיָּא דִּי יְבַדְּרִנָּךְ יְיָ אֱלָהָךְ לְתַמָּן:", "onk_en": "Adonoy, your God, will bring back your returnees [<b>of your exile<\/b>] and will be merciful toward you; and He will return and gather you from all the peoples that Adonoy, your God, has dispersed you there.", "pj": "וִיקַבֵּיל מֵימְרֵיהּ בְּרַעֲוָא יַת תְּיוּבְתְּכוֹן וִירַחֵם עֲלֵיכוֹן וִיתוּב וְיִכְנוֹשׁ יַתְכוֹן מִכָּל עַמְמַיָא דְבַדַר יְיָ אֱלָהָכוֹן יַתְכוֹן לְתַמָן", "pj_en": "And His Word will accept your repentance with favour, and will have mercy upon you, and He will gather you again from all the nations whither the Lord your God had scattered you.", "tj": "", "tj_en": "", "rashi": "<b>ושב ה' אלהיך את שבותך.<\/b> הָיָה לוֹ לִכְתֹּב \"וְהֵשִׁיב\" אֶת שְׁבוּתְךָ, רַבּוֹתֵינוּ לָמְדוּ מִכָּאן כִּבְיָכוֹל שֶׁהַשְּׁכִינָה שְׁרוּיָה עִם יִשְׂרָאֵל בְּצָרַת גָּלוּתָם, וּכְשֶׁנִּגְאָלִין הִכְתִּיב גְּאֻלָּה לְעַצְמוֹ — שֶׁהוּא יָשׁוּב עִמָּהֶם. וְעוֹד יֵשׁ לוֹמַר שֶׁגָּדוֹל יוֹם קִבּוּץ גָּלֻיּוֹת וּבְקֹשִׁי, כְּאִלּוּ הוּא עַצְמוֹ צָרִיךְ לִהְיוֹת אוֹחֵז בְּיָדָיו מַמָּשׁ אִישׁ אִישׁ מִמְּקוֹמוֹ, כָּעִנְיָן שֶׁנֶּאֱמַר (ישעיהו כ\"ז) \"וְאַתֶּם תְּלֻקְּטוּ לְאַחַד אֶחָד בְּנֵי יִשְׂרָאֵל\", וְאַף בְּגָלֻיּוֹת שְׁאָר הָאֻמּוֹת מָצִינוּ כֵן (ירמיהו מ\"ח) \"וְשַׁבְתִּי שְׁבוּת מוֹאָב\":", "rashi_en": "ושב ה' אלהיך את שבותך THEN THE LORD THY GOD WILL TURN THY CAPTIVITY — To express this idea it ought to have written והשיב את שבותך, “then He will bring back thy captivity”. But our Rabbis learned from this that, if one can say so of God, His Divine presence dwells with Israel in all the misery of their exile, so that when they are redeemed (i.e. when He speaks of their being redeemed), He makes Scripture write “Redemption” of Himself (i.e. He makes it state that He will be redeemed) — that He will return with them (Megillah 29a). Furthermore the following may be said in explaining the strange form ושב ... את, — that the day of the gathering of the exiles is so important and is attended with such difficulty that it is as though He (God) Himself must actually seize hold of each individual’s hands dragging him from his place (so that God Himself returns with the exile), as it is said, (Isaiah 27:12) “And ye shall be gathered one by one, O ye children of Israel”. We find, however, the same expression in connection with the gathering of the exiles of other nations also, as e.g. (Jeremiah 48:47):  ושבתי שבות מואב  \"And I shall bring back the exiles of Moab\"."}, {"ch": 30, "v": 4, "aliyah": 2, "heb": "אִם־יִהְיֶ֥ה נִֽדַּחֲךָ֖ בִּקְצֵ֣ה הַשָּׁמָ֑יִם מִשָּׁ֗ם יְקַבֶּצְךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ וּמִשָּׁ֖ם יִקָּחֶֽךָ׃", "onk": "אִם יְהֵי גַלְוָתָךְ בִּסְיָפֵי שְׁמַיָּא מִתַּמָּן יִכְנְשִׁנָּךְ יְיָ אֱלָהָךְ וּמִתַּמָּן <b>יְקָרְבִנָּךְ<\/b>:", "onk_en": "If your exiled one will be at the edge of the heavens, from there will Adonoy, your God, gather you and from there will He take you [<b>bring you near<\/b>].", "pj": "אִין יְהוֹן מְבַדְרֵיכוֹן בִּסְיָפֵי שְׁמַיָא מִתַּמָן יִכְנוֹשׁ יַתְכוֹן מֵימְרָא דַיְיָ אֱלָהָכוֹן עַל יְדוֹי דְאֵלִיָהוּ כַּהֲנָא רַבָּא וּמִתַּמָן יְקָרֵב יַתְכוֹן עַל יְדוֹי דְמַלְכָּא מְשִׁיחָא", "pj_en": "Though you may be dispersed unto the ends of the heavens, from thence will the Word of the Lord gather you together by the hand of Elijah the great priest, and from thence will He bring you by the hand of the King Meshiha.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 5, "aliyah": 2, "heb": "וֶהֱבִיאֲךָ֞ יְהֹוָ֣ה אֱלֹהֶ֗יךָ אֶל־הָאָ֛רֶץ אֲשֶׁר־יָרְשׁ֥וּ אֲבֹתֶ֖יךָ וִֽירִשְׁתָּ֑הּ וְהֵיטִֽבְךָ֥ וְהִרְבְּךָ֖ מֵאֲבֹתֶֽיךָ׃", "onk": "וְיָעֵלִנָּךְ יְיָ אֱלָהָךְ לְאַרְעָא דִּירִיתוּ אֲבָהָתָךְ וְתֵרְתַהּ וְיוֹטֶב לָךְ וְיַסְגִּנָּךְ מֵאֲבָהָתָךְ:", "onk_en": "And Adonoy, your God, will bring you to the land that your forefathers inherited and you will inherit it; and He will benefit you and multiply you more than your forefathers.", "pj": "וְיָעֵלִינְכוֹן מֵימְרָא דַיְיָ אֱלָהָכוֹן לְאַרְעָא דְיָרִיתוּ אַבְהַתְכוֹן וְתֵרְתָהּ וְיוֹטֵב לְכוֹן וְיַסְגִינְכוֹן יַתִּיר מִן אַבְהַתְכוֹן", "pj_en": "And the Word of the Lord your God will bring you into the land which your fathers possessed by inheritance, and you shall possess it, and He will bless you and increase you more than your fathers.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 6, "aliyah": 2, "heb": "וּמָ֨ל יְהֹוָ֧ה אֱלֹהֶ֛יךָ אֶת־לְבָבְךָ֖ וְאֶת־לְבַ֣ב זַרְעֶ֑ךָ לְאַהֲבָ֞ה אֶת־יְהֹוָ֧ה אֱלֹהֶ֛יךָ בְּכׇל־לְבָבְךָ֥ וּבְכׇל־נַפְשְׁךָ֖ לְמַ֥עַן חַיֶּֽיךָ׃", "onk": "<b>וְיֶעְדֵּי<\/b> יְיָ אֱלָהָךְ יָת <b>טַפְשׁוּת<\/b> לִבָּךְ וְיָת טַפְשׁוּת לִבָּא דִבְנָיךְ לְמִרְחַם יָת יְיָ אֱלָהָךְ בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ בְּדִיל חַיָּיךְ:", "onk_en": "And Adonoy, your God, will circumcise [<b>remove the foolishness from<\/b>] your heart and the heart of your descendants, to love Adonoy, your God, wholeheartedly and with all your being in order that you live.", "pj": "וְיַעֲדֵי יְיָ אֱלָהָכוֹן יַת טִפְּשׁוּת לִבְּכוֹן וְיַת טִפְּשׁוּת לִבָּא דִבְנֵיכוֹן אֲרוּם יְבַטֵל יִצְרָא בִּישָׁא מִן עַלְמָא וְיִבְרֵי יִצְרָא טָבָא דִי יַמְלְכִינְכוֹן לְמִירְחַם יַת יְיָ אֱלָהָכוֹן בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן מִן בִּגְלַל דְיוֹגְדוּן חַיֵיכוֹן עַד עַלְמִין", "pj_en": "And the Lord your God will take away the foolishness of your heart, and of your children’s heart; for He will abolish evil desire from the world, and create good desire, which will give you the dictate to love the Lord your God with all your heart and soul, that your lives may flow on for evermore.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 7, "aliyah": 3, "heb": "וְנָתַן֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ אֵ֥ת כׇּל־הָאָל֖וֹת הָאֵ֑לֶּה עַל־אֹיְבֶ֥יךָ וְעַל־שֹׂנְאֶ֖יךָ אֲשֶׁ֥ר רְדָפֽוּךָ׃", "onk": "וְיִתֵּן יְיָ אֱלָהָךְ יָת כָּל לְוָטַיָּא הָאִלֵּין עַל בַּעֲלֵי <b>דְבָבָךְ<\/b> וְעַל סָנְאָךְ דִּי רְדָפוּךְ:", "onk_en": "Adonoy, your God, will place all these oath-curses upon your enemies and upon your foes who chased you.", "pj": "וְיִגְרֵי מֵימְרָא דַיְיָ אֱלָהָכוֹן יַת לְוָוטַיָא הָאִלֵין עַל בַּעֲלֵי דְבָבֵיכוֹן דְאָעִיקוּ יַתְכוֹן בְּגַלְוַותְכוֹן וְעַל סַנְאֵיכוֹן דְרָדָפוּ מִן בַּתְרֵיכוֹן עַד דִי אָנְסוּ יַתְכוֹן", "pj_en": "And the Word of the Lord your God will send these curses upon your enemies who have oppressed you in your captivities, and such as have hated and persecuted, to destroy you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 8, "aliyah": 3, "heb": "וְאַתָּ֣ה תָשׁ֔וּב וְשָׁמַעְתָּ֖ בְּק֣וֹל יְהֹוָ֑ה וְעָשִׂ֙יתָ֙ אֶת־כׇּל־מִצְוֺתָ֔יו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּֽוֹם׃", "onk": "וְאַתְּ תְּתוּב <b>וּתְקַבַּל בְּמֵימְרָא<\/b> דַיְיָ וְתַעְבֵּד יָת כָּל פִּקּוּדוֹהִי דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין:", "onk_en": "And you will turn back and obey [<b>accept the word of<\/b>] Adonoy; and you will perform all His commandments that I am commanding you today.", "pj": "וְאַתּוּן תְּתוּבוּן וּתְקַבְּלוּן לְמֵימְרָא דַיְיָ וְתַעַבְדוּן יַת כָּל פִּקוּדוֹי דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא", "pj_en": "But you shall return, and be obedient to the Word of the Lord, and do all His commandments that I command you this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 9, "aliyah": 3, "heb": "וְהוֹתִֽירְךָ֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ בְּכֹ֣ל&thinsp;<b>׀<\/b> מַעֲשֵׂ֣ה יָדֶ֗ךָ בִּפְרִ֨י בִטְנְךָ֜ וּבִפְרִ֧י בְהֶמְתְּךָ֛ וּבִפְרִ֥י אַדְמָתְךָ֖ לְטֹבָ֑ה כִּ֣י&thinsp;<b>׀<\/b> יָשׁ֣וּב יְהֹוָ֗ה לָשׂ֤וּשׂ עָלֶ֙יךָ֙ לְט֔וֹב כַּאֲשֶׁר־שָׂ֖שׂ עַל־אֲבֹתֶֽיךָ׃", "onk": "וְיוֹתְרִנָּךְ יְיָ אֱלָהָךְ בְּכֹל עוֹבָדֵי יְדָךְ <b>בְּוַלְדָּא<\/b> דִמְעָךְ וּבְוַלְדָּא דִבְעִירָךְ <b>וּבְאִבָּא<\/b> דְאַרְעָךְ לְטָבָא אֲרֵי יְתוּב יְיָ לְמֶחֱדֵי עֲלָךְ לְטָב כְּמָא דִי חֲדִי עַל אֲבָהָתָךְ:", "onk_en": "Adonoy, your God, will give you surplus in all your endeavors, in the fruit [<b>offspring<\/b>] of your belly, and in the offspring of your animals, and in the produce [<b>fruit<\/b>] of your soil—for benefit; for Adonoy will return to rejoice over you for benefit as He rejoiced over your forefathers.", "pj": "וִישַׁיְירִינְכוֹן יְיָ אֱלָהָכוֹן לְטָבָא דְתַצְלְחוּן בְּכָל עוֹבָדֵי יְדֵיכוֹן בְּוַולְדָא דִמְעֵיכוֹן וּבְוַולְדָא דִבְעִירְכוֹן וּבְפֵירֵי אַרְעֲכוֹן לְטָבָא אֲרוּם יְתוּב מֵימְרָא דַיְיָ לְמֵיחֲדֵי אַמְטוּלְכוֹן לְאוֹטָבָא לְכוֹן הֵיכְמָא דְחָדֵי עַל אַבְהַתְכוֹן", "pj_en": "And the Lord your God will make you to abound in good; for you shall prosper in all the works of your hands, in the offspring of thy womb, the increase of thy cattle, and the produce of your land, for good; for the Word of the Lord will return, to rejoice over you, to bless you, as He rejoiced over your fathers,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 10, "aliyah": 3, "heb": "כִּ֣י תִשְׁמַ֗ע בְּקוֹל֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לִשְׁמֹ֤ר מִצְוֺתָיו֙ וְחֻקֹּתָ֔יו הַכְּתוּבָ֕ה בְּסֵ֥פֶר הַתּוֹרָ֖ה הַזֶּ֑ה כִּ֤י תָשׁוּב֙ אֶל־יְהֹוָ֣ה אֱלֹהֶ֔יךָ בְּכׇל־לְבָבְךָ֖ וּבְכׇל־נַפְשֶֽׁךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי <b>תְקַבַּל בְּמֵימְרָא<\/b> דַּייָ אֱלָהָךְ לְמִטַּר פִּקּוּדוֹהִי וּקְיָמוֹהִי דִּכְתִיבִין בְּסִפְרָא דְאוֹרַיְתָא הָדֵין אֲרֵי תְתוּב קֳדָם יְיָ אֱלָהָךְ בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ:", "onk_en": "When you obey [<b>accept the word of<\/b>] Adonoy, your God, to guard His commandments and His statutes, written in this Torah scroll; when you turn back to Adonoy, your God, wholeheartedly and with all your being.", "pj": "אֲרוּם תְּקַבְּלוּן לְמֵימְרָא דַיְיָ אֱלָהָכוֹן לְמִינְטַר פִּקוּדוֹי וּקְיָימוֹי דִכְתִיבִין בְּסֵפֶר אוֹרַיְיתָא הָדֵין אֲרוּם תְּתוּבוּן לִדְחַלְתָּא דַיְיָ אֱלָהָכוֹן בְּכָל לִבְּכוֹן וּבְכָל נַפְשְׁכוֹן", "pj_en": "if you will hearken to the Word of the Lord your God in keeping His commandments and statutes which are written in the book of this law, when you have returned to the fear of the Lord your God with all your heart and with all your soul.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 11, "aliyah": 3, "heb": "כִּ֚י הַמִּצְוָ֣ה הַזֹּ֔את אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּךָ֖ הַיּ֑וֹם לֹא־נִפְלֵ֥את הִוא֙ מִמְּךָ֔ וְלֹ֥א רְחֹקָ֖ה הִֽוא׃", "onk": "אֲרֵי תַּפְקֶדְתָּא הָדָא דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין לָא מַפְרְשָׁא הִיא מִנָּךְ וְלָא רְחִיקָא הִיא:", "onk_en": "For this <i>mitzvah<\/i> that I am commanding you today; it is not abstruse to you nor is it distant.", "pj": "אֲרוּם תַּפְקֵידְתָּא הָדָא דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא לָא מְכַסְיָא הִיא מִנְכוֹן וְלָא רְחִיקָא הִיא", "pj_en": "For this commandment which I command you today is not hidden from you, nor afar off.", "tj": "", "tj_en": "", "rashi": "<b>לא נפלאת הוא ממך.<\/b> לֹא מְכֻסָּה הִיא מִמְּךָ, כְּמוֹ שֶׁנֶּאֱמַר (דברים י\"ז) \"כִּי יִפָּלֵא\" — אֲרֵי יִתְכַּסֵּי, (איכה א') \"וַתֵּרֶד פְּלָאִים\" — וַתֵּרֶד בְּמַטְמוֹנִיּוֹת, מְכֻסָּה, חֲבוּשָׁה בְּטָמוּן:", "rashi_en": "לא נפלאת הוא ממך [FOR THIS COMMANDMENT …] IS NOT נפלאת FROM YOU i.e. is not concealed from you, just as it is said, (Deuteronomy 17:8): כי יפלא which is rendered in the Targum by “If there be concealed [from thee]”; and (Lamentations 1:9): ותרד פלאים which means, she went down into concealment, i.e. being covered and bound in the place of concealment."}, {"ch": 30, "v": 12, "aliyah": 3, "heb": "לֹ֥א בַשָּׁמַ֖יִם הִ֑וא לֵאמֹ֗ר מִ֣י יַעֲלֶה־לָּ֤נוּ הַשָּׁמַ֙יְמָה֙ וְיִקָּחֶ֣הָ לָּ֔נוּ וְיַשְׁמִעֵ֥נוּ אֹתָ֖הּ וְנַעֲשֶֽׂנָּה׃", "onk": "לָא בִשְׁמַיָּא הִיא לְמֵימָר מָן יִסַּק לָנָא לִשְׁמַיָּא וְיִסְּבַהּ לָנָא וְיַשְׁמְעִנָּנָא יָתַהּ וְנַעְבְּדִנַּהּ:", "onk_en": "It is not in heaven, [for you] to say, ‘‘Who will go up to heaven for us, and acquire it for us, and inform us of it, and we will fulfill it?’’", "pj": "לָא בִשְׁמַיָא הִיא לְמֵימָר מַן יִסוֹק בְּדִילָנָא בִּשְׁמַיָא וְיִסְבִינָהּ לָנָא וְיַשְׁמַע יָתָהּ לָנָא וְנַעַבְדִינָהּ", "pj_en": "It is not in the heavens, that thou shouldst say, Who will ascend for us into heaven, and bring it to us to make us hear, that we may do it?", "tj": "לָא בִשְׁמַיָא הִיא אוֹרַיְיתָא לְמֵימָר אַלְוַוי מָן אִין הֲוָה לָן חַד כְּמשֶׁה נְבִיָא דִי יִסוֹק לִשְׁמַיָא וְיֵיתֵי יָתָהּ לָן וְיַשְׁמַע יַת פִּיקוּדַיָא וְנַעֲבֵד יַתְהוֹן:", "tj_en": "The law is not in the heavens, that thou shouldst say, O that we had one like Mosheh the prophet to ascend into heaven, and bring it to us, and make us hear its commands, that we may do them!", "rashi": "<b>לא בשמים הוא.<\/b> שֶׁאִלּוּ הָיְתָה בַשָּׁמַיִם, הָיִיתָ צָרִיךְ לַעֲלוֹת אַחֲרֶיהָ לְלָמְדָהּ:", "rashi_en": "לא בשמים הוא IT IS NOT IN HEAVEN — for were it in heaven it would still be your duty to go up after it and to learn it (Eruvin 55a)."}, {"ch": 30, "v": 13, "aliyah": 3, "heb": "וְלֹא־מֵעֵ֥בֶר לַיָּ֖ם הִ֑וא לֵאמֹ֗ר מִ֣י יַעֲבׇר־לָ֜נוּ אֶל־עֵ֤בֶר הַיָּם֙ וְיִקָּחֶ֣הָ לָּ֔נוּ וְיַשְׁמִעֵ֥נוּ אֹתָ֖הּ וְנַעֲשֶֽׂנָּה׃", "onk": "וְלָא מֵעִבְרָא לְיַמָּא הִיא לְמֵימַר מָן יֵעִבַר לָנָא לְעִבְרָא דְיַמָּא וְיִסְּבַהּ לָנָא וְיַשְׁמְעִנָּנָא יָתַהּ וְנַעְבְּדִנַּהּ:", "onk_en": "Nor is it overseas, [for you] to say, ‘‘Who will travel overseas for us, and acquire it for us, and inform us of it, and we will fulfill it?’’", "pj": "וְלָא מִן הַאָל לְעִיבַר יַמָא רַבָּא הִיא לְמֵימָר מַאן יְעִיבַר בְּדִילָנָא לְעִיבַר יַמָא רַבָּא וְיִסְבִינָהּ לָנָא וְיַשְׁמַע יָתָהּ לָן וְנַעַבְדִינָהּ", "pj_en": "Neither is it beyond the great sea, that thou shouldst say, Who will go beyond the sea for us, and fetch it for us to make us hear, that we may do it?", "tj": "וְלָא מֵעֵבֶר יַמָא רַבָּא הִיא אוֹרַיְיתָא לְמֵימָר אַלְוַוי הֲוָה לָן חַד כְּיוֹנָה נְבִיָא דְיֵיחוֹת לְעוֹמְקֵי יַמָא רַבָּא וְיֵיתֵי יָתָהּ לָן וְיַשְׁמַע יַת פִּקוּדַיָא וְנַעֲבֵד יַתְהוֹן:", "tj_en": "Neither is the law beyond the great sea, that thou shouldst say, O that we had one like Jonah the prophet, who could descend into the depths of the sea, and bring it to us, and make us hear its commands, that we may do them!", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 14, "aliyah": 3, "heb": "כִּֽי־קָר֥וֹב אֵלֶ֛יךָ הַדָּבָ֖ר מְאֹ֑ד בְּפִ֥יךָ וּבִֽלְבָבְךָ֖ לַעֲשֹׂתֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי קָרִיב לָךְ פִּתְגָּמָא לַחֲדָא בְּפוּמָךְ וּבְלִבָּךְ לְמֶעְבְּדֵיהּ:", "onk_en": "For the matter is extremely close to you; in your mouth and in your mind to fulfill it.", "pj": "אֲרוּם קָרִיב לְכוֹן פִּתְגָמָא בְּבֵית מֶדְרָשֵׁיכוֹן פְּתָחוּ פֻּמְכוֹן לְמֶהֱוֵי הַגְיַין בְּהוֹן בְּרֵירוּ לִבְּכוֹן לְמֶעֱבַד יַתְהוֹן", "pj_en": "For the word {pitgama} is nigh you, in your schools; open your mouth, that you may meditate on it; purify your hearts, that you may perform it.", "tj": "אֲרוּם קָרִיב הוּא לְוַותְכוֹן פִּתְגַם לַחֲדָא בְּפוּמְכוֹן לְמֶהֱוַן הַגְיַין בָּהּ וּבִלְבָבֵיכוֹן לְמֶעֱבַד יָתָהּ:", "tj_en": "For the word is very nigh you, in your mouth, that you may meditate upon it, and in your hearts, that you may perform it.", "rashi": "<b>כי קרוב אליך.<\/b> הַתּוֹרָה נִתְּנָה לָכֶם בִּכְתָב וּבְעַל פֶּה:", "rashi_en": "כי קרוב אליך BUT [THE WORD] IS [VERY] NEAR UNTO YOU — the Torah has been given to you in writing and orally."}, {"ch": 30, "v": 15, "aliyah": 4, "heb": "רְאֵ֨ה נָתַ֤תִּי לְפָנֶ֙יךָ֙ הַיּ֔וֹם אֶת־הַֽחַיִּ֖ים וְאֶת־הַטּ֑וֹב וְאֶת־הַמָּ֖וֶת וְאֶת־הָרָֽע׃", "onk": "חֲזֵי דִיהָבִית קֳדָמָךְ יוֹמָא דֵין יָת חַיֵּי וְיָת טַבְתָא וְיָת מוֹתָא וְיָת בִּישָׁא:", "onk_en": "See, I have placed before you today life and good, and death and bad.", "pj": "חָמוּן דִי סַדָרִית קֳדָמֵיכוֹן יוֹמָנָא יַת אָרְחָא דְחַיֵי דְבֵיהּ מִשְׁתְּלַם אֲגַר טַב לְצַדִיקַיָא וְיַת אָרְחָא דְמוֹתָא דְבֵיהּ מִשְׁתְּלַם אֲגַר בִּישׁ לְרַשִׁיעַיָא", "pj_en": "Behold, I have set before you this day the way of life, wherein is the recompense of the reward of good unto the righteous, and the way of death, wherein is the retribution of the wages of evil unto the wicked.", "tj": "חֲזוֹן הָא שַׁוִית קֳדָמֵיכוֹן יוֹמָא הָדֵין יַת אוֹרְחָא דְחַיָיא דְהִיא אוֹרְחָא טַבְתָא וְיַת אוֹרְחָא דְמִיתוּתָא דְהִיא אוֹרְחָא בִּישָׁתָא:", "tj_en": "See, behold, I have set before you this day the way of life, which is the path of the good, and the way of death, which is the path of the evil.", "rashi": "<b>את החיים ואת הטוב.<\/b> זֶה תָּלוּי בָּזֶה — אִם תַּעֲשֶׂה טוֹב הֲרֵי לְךָ חַיִּים, וְאִם תַּעֲשֶׂה רַע הֲרֵי לְךָ הַמָּוֶת, וְהַכָּתוּב מְפָרֵשׁ וְהוֹלֵךְ הֵיאַךְ:", "rashi_en": "את החיים ואת הטוב LIFE AND GOOD — the one is dependent upon the other: if you do good, behold, there is life for you, and if you do evil, behold, there is death for you. Scripture goes on to explain how this is:"}, {"ch": 30, "v": 16, "aliyah": 4, "heb": "אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּךָ֮ הַיּוֹם֒ לְאַהֲבָ֞ה אֶת־יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ לָלֶ֣כֶת בִּדְרָכָ֔יו וְלִשְׁמֹ֛ר מִצְוֺתָ֥יו וְחֻקֹּתָ֖יו וּמִשְׁפָּטָ֑יו וְחָיִ֣יתָ וְרָבִ֔יתָ וּבֵֽרַכְךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ בָּאָ֕רֶץ אֲשֶׁר־אַתָּ֥ה בָא־שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין לְמִרְחַם יָת יְיָ אֱלָהָךְ לִמְהַךְ בְּאָרְחָן <b>דְּתָקְנָן קֳדָמוֹהִי<\/b> וּלְמִטַּר פִּקּוּדוֹהִי וּקְיָמוֹהִי וְדִינוֹהִי וְתֵיחֵי וְתִסְגֵּי וִיבָרֵכִנָּךְ יְיָ אֱלָהָךְ בְּאַרְעָא דִּי אַתְּ עָלֵל לְתַמָּן לְמֵירְתַהּ:", "onk_en": "For which I command you this day, to love Adonoy, your God, to go in His ways [<b>proper before Him<\/b>] and to guard His commandments and His statutes and His laws; and you will live and you will flourish, and Adonoy, your God, will bless you in the land that you are coming there to inherit.", "pj": "דַאֲנָא מְפַקֵיד לְכוֹן יוֹמָנָא לְמִרְחַם יַת יְיָ אֱלָהָךְ וְלִמְהַךְ בְּאוֹרְחַן דְתַקְנָן קֳדָמוֹי וּלְמִנְטַר פִּקוּדוֹי וּקְיָימוֹי וְדִינוֹי וְתֵיחוּן וְתִסְגוּן וִיבָרֵכִינְכוֹן יְיָ אֱלָהָךְ בְּאַרְעָא דְאַתּוּן עָלְלִין לְתַמָן לְמֵירְתָהּ", "pj_en": "For I teach you today to love the Lord your God, and to walk in the ways that are right before Him, and to keep His commandments, statutes, and judgments, and live and multiply; that the Lord your God may bless you in the land into which you are entering to possess it.", "tj": "", "tj_en": "", "rashi": "<b>אשר אנכי מצוך היום לאהבה.<\/b> הֲרֵי הַטּוֹב, וּבוֹ תָלוּי <b>וחיית ורבית<\/b>, הֲרֵי הַחַיִּים:", "rashi_en": "אשר אנכי מצוך היום לאהבה IN THAT I COMMAND THEE THIS DAY TO LOVE [THE LORD THY GOD] — You have here a description of the “good”, and upon this depends וחיית ורבית THAT YOU MAY LIVE AND INCREASE — here you have life."}, {"ch": 30, "v": 17, "aliyah": 4, "heb": "וְאִם־יִפְנֶ֥ה לְבָבְךָ֖ וְלֹ֣א תִשְׁמָ֑ע וְנִדַּחְתָּ֗ וְהִֽשְׁתַּחֲוִ֛יתָ לֵאלֹהִ֥ים אֲחֵרִ֖ים וַעֲבַדְתָּֽם׃", "onk": "וְאִם יִפְנֵי לִבָּךְ וְלָא <b>תְקַבֵּל<\/b> וְתִטְעֵי וְתִסְגּוּד <b>לְטַעֲוַת עַמְמַיָּא<\/b> וְתִפְלְחִנּוּן:", "onk_en": "But if your heart strays and you do not listen [<b>accept<\/b>], and you are misled, and you prostrate yourself to other gods [<b>idols of the nations<\/b>] and worship them.", "pj": "וְאִין יְהַרְהַר לִבְּכוֹן וְלָא תְקַבְּלוּן וְתִטְעוּן וְתִסְגְדוּן לְטַעֲוַות עַמְמַיָא וְתִפְלְחוּנוּן", "pj_en": "But if you think in your heart that you will not obey, but will go astray to worship the idols of the nations, and serve them,", "tj": "", "tj_en": "", "rashi": "<b>ואם יפנה לבבך.<\/b> הֲרֵי הָרָע:", "rashi_en": "ואם יפנה לבבך BUT IF THINE HEART TURN AWAY — here you have evil,"}, {"ch": 30, "v": 18, "aliyah": 4, "heb": "הִגַּ֤דְתִּי לָכֶם֙ הַיּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּן לֹא־תַאֲרִיכֻ֤ן יָמִים֙ עַל־הָ֣אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת־הַיַּרְדֵּ֔ן לָב֥וֹא שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "<b>חַוֵּיתִי<\/b> לְכוֹן יוֹמָא דֵין אֲרֵי מֵיבַד תֵּיבְדוּן לָא תוֹרְכוֹן יוֹמִין עַל אַרְעָא דִּי אַתְּ עָבֵר יָת יַרְדְּנָא לְמֵעַל לְתַמָּן לְמֵירְתַהּ:", "onk_en": "I tell [<b>have shown<\/b>] you today that you shall certainly perish; you will not remain long on the land that you are crossing the Yardein to come there to inherit.", "pj": "חֲוֵיתִי לְכוֹן יוֹמָנָא אֲרוּם מֵיבַד תֵּיבְדוּן וְלָא תֵגְדוֹן יוֹמִין עַל אַרְעָא דְאַתּוּן עָבְרִין יַת יוֹרְדְנָא לְמֵיעַל לְתַמָן לְמֵירְתָהּ", "pj_en": "I proclaim to you this day, that you will perish, and will not prolong your days on the land to which you are to pass over the Jordan to possess it.", "tj": "", "tj_en": "", "rashi": "<b>כי אבד תאבדון.<\/b> הֲרֵי הַמָּוֶת:", "rashi_en": "כי אבד תאבדון [I TELL YOU THIS DAY] THAT YE SHALL PERISH — here you have death."}, {"ch": 30, "v": 19, "aliyah": 4, "heb": "הַעִדֹ֨תִי בָכֶ֣ם הַיּוֹם֮ אֶת־הַשָּׁמַ֣יִם וְאֶת־הָאָ֒רֶץ֒ הַחַיִּ֤ים וְהַמָּ֙וֶת֙ נָתַ֣תִּי לְפָנֶ֔יךָ הַבְּרָכָ֖ה וְהַקְּלָלָ֑ה וּבָֽחַרְתָּ֙ בַּחַיִּ֔ים לְמַ֥עַן תִּֽחְיֶ֖ה אַתָּ֥ה וְזַרְעֶֽךָ׃", "onk": "אַסְהֵדִית בְּכוֹן יוֹמָא דֵין יָת שְׁמַיָּא וְיָת אַרְעָא חַיֵּי וּמוֹתָא יְהָבִית קֳדָמָךְ בִּרְכָן וּלְוָטִין וְתִתִּרְעֵי בְּחַיֵּי בְּדִיל דְּתֵיחֵי אַתְּ וּבְנָיךְ:", "onk_en": "I invoke, as witnesses against you this day, heaven and earth: Life and death have I placed before you, blessing and curse; you choose life in order that you live, you and your descendants,", "pj": "לָא סַהֲדִין דְעָבְרִין מִן עַלְמָא אֲנָא מַסְהִיד בְּכוֹן יוֹמָנָא אֱלָהֵן שְׁמַיָא וְאַרְעָא חַיֵי וּמוֹתָא סַדָרִית קוּמֵיכוֹן בִּרְכָתָא וְחִילוּפָהּ וּתְתֵירְעוּן בְּאָרְחָא דְחַיֵי הִיא אוֹרַיְיתָא מִן בִּגְלַל דְתֵיחוּן בְּחַיֵי עַלְמָא דְאָתֵי אַתּוּן וּבְנֵיכוֹן", "pj_en": "I attest this day, not only you, who are to pass away from this world, but the heavens and the earth, that I have set before you life and death, blessing and its reverse. Choose therefore the way of life, even the law, that you and your children may live the life of the world to come;", "tj": "", "tj_en": "", "rashi": "<b>העדתי בכם היום את השמים ואת הארץ.<\/b> שֶׁהֵם קַיָּמִים לְעוֹלָם, וְכַאֲשֶׁר תִּקְרֶה אֶתְכֶם הָרָעָה יִהְיוּ עֵדִים שֶׁאֲנִי הִתְרֵיתִי בָכֶם בְּכָל זֹאת; דָּבָר אַחֵר — <b>העדתי בכם היום את השמים וגו'<\/b>, אָמַר לָהֶם הַקָּדוֹשׁ בָּרוּךְ הוּא לְיִשְׂרָאֵל, הִסְתַּכְּלוּ בַשָּׁמַיִם שֶׁבָּרָאתִי לְשַׁמֵּשׁ אֶתְכֶם, שֶׁמָּא שִׁנּוּ אֶת מִדָּתָם? שֶׁמָּא לֹא עָלָה גַּלְגַּל חַמָּה מִן הַמִּזְרָח וְהֵאִיר לְכָל הָעוֹלָם כָּעִנְיָן שֶׁנֶּאֱמַר (קהלת א') \"וְזָרַח הַשֶּׁמֶשׁ וּבָא הַשָּׁמֶשׁ\"? הִסְתַּכְּלוּ בָאָרֶץ שֶׁבָּרָאתִי לְשַׁמֵּשׁ אֶתְכֶם, שֶׁמָּא שִׁנְּתָה מִדָּתָהּ? שֶׁמָּא זְרַעְתֶּם אוֹתָהּ וְלֹא צָמְחָה אוֹ שֶׁמָּא זְרַעְתֶּם חִטִּים וְהֶעֶלְתָה שְׂעוֹרִים? וּמָה אֵלּוּ שֶׁנַּעֲשׂוּ לֹא לְשָׂכָר וְלֹא לְהֶפְסֵד, אִם זוֹכִין אֵין מְקַבְּלִין שָׂכָר וְאִם חוֹטְאִין אֵין מְקַבְּלִין פֻּרְעָנוּת, לֹא שִׁנּוּ אֶת מִדָּתָם, אַתֶּם שֶׁאִם זְכִיתֶם תְּקַבְּלוּ שָׂכָר וְאִם חֲטָאתֶם תְּקַבְּלוּ פֻּרְעָנוּת, עַל אַחַת כַּמָּה וְכַמָּה (ספרי דברים ל\"ב):<br><br><b>ובחרת בחיים.<\/b> אֲנִי מוֹרֶה לָכֶם שֶׁתִּבְחֲרוּ בְּחֵלֶק הַחַיִּים, כְּאָדָם הָאוֹמֵר לִבְנוֹ, בְּחַר לְךָ חֵלֶק יָפֶה בְנַחֲלָתִי, וּמַעֲמִידוֹ עַל חֵלֶק הַיָּפֶה וְאוֹמֵר לוֹ אֶת זֶה בְּרֹר לְךָ, וְעַל זֶה נֶאֱמַר (תהילים ט\"ז) \"ה' מְנָת חֶלְקִי וְכוֹסִי אַתָּה תּוֹמִיךְ גּוֹרָלִי\" — הִנַּחְתָּ יָדִי עַל גּוֹרָל הַטּוֹב לוֹמַר אֶת זֶה קַח לְךָ:", "rashi_en": "העדתי בכם היום את השמים ואת הארץ I CALL AS WITNESSES AGAINST YOU THE HEAVEN AND THE EARTH, which exist for ever, and when evil will befall you they will be witnesses that I have warned you regarding all this (cf. Targum Jonathan on). Another explanation of העדתי בכם את השמים וגו׳ I CALL THE HEAVEN [AND THE EARTH] AS WITNESSES AGAINST YOU: The Holy One, blessed be He, said to Israel, “Look at the heavens which I have created to be at your service; have they perhaps ever changed their character? Has the orb of the sun perhaps ever failed to rise in the East and to give light to the whole world, just as is stated, (Ecclesiastes 1:4—5) “And the sun riseth, and the sun goeth down [and hasteth to its place where it arises]”?! Look at the earth which I have created to be at your service! Has it perhaps ever changed its character? Have you perhaps sown it and it did not bring forth, or have you sown wheat and it brought forth barley?! Now how is it with these that have been made neither with the end in view that they should receive a reward nor that they should suffer a loss — for if they act meritoriously (if they follow the natural laws by which they are governed) they receive no reward and if they were to fail they would receive no punishment? They have never changed their character! You, who if you act meritoriously do receive a reward and if you sin do receive punishment, how much the more so should you obey the commands of your Maker! (Sifrei Devarim 306:1).<br><br>ובחרת בחיים THEREFORE CHOOSE THE LIFE — I show you these (“I set life and death before thee) in order that you may choose the portion of life. It is like a man who says to his son, “Choose for yourself a good portion of my real estate”, and sets him in the best portion saying to him, “Choose  this!” And concerning this it states, (Psalms 16:5) “The Lord is the portion of my inheritance and my cup, אתה תומיך גורלי”, i.e. “You place my hand on the good lot, saying, ‘Choose this!'”"}, {"ch": 30, "v": 20, "aliyah": 4, "heb": "לְאַֽהֲבָה֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ לִשְׁמֹ֥עַ בְּקֹל֖וֹ וּלְדׇבְקָה־ב֑וֹ כִּ֣י ה֤וּא חַיֶּ֙יךָ֙ וְאֹ֣רֶךְ יָמֶ֔יךָ לָשֶׁ֣בֶת עַל־הָאֲדָמָ֗ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהֹוָ֧ה לַאֲבֹתֶ֛יךָ לְאַבְרָהָ֛ם לְיִצְחָ֥ק וּֽלְיַעֲקֹ֖ב לָתֵ֥ת לָהֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לְמִרְחַם יָת יְיָ אֱלָהָךְ <b>לְקַבָּלָא לְמֵימְרֵיהּ<\/b> <b>וּלְאִתְקָרָבָא לְדַחַלְתֵּיהּ<\/b> אֲרֵי הוּא חַיָּיךְ וְאוֹרָכוּת יוֹמָיךְ לְמִתַּב עַל אַרְעָא דִּי קַיִּים יְיָ לַאֲבָהָתָךְ לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב לְמִתַּן לְהוֹן:", "onk_en": "To love Adonoy, your God, to obey Him [<b>accept His word<\/b>] and to cling to [<b>the fear of<\/b>] Him; for He is your life and your longevity, to live on the soil that Adonoy swore to your forefathers—to Avrohom, to Yitzchok, and to Yaakov—to give them.", "pj": "לְמִירְחַם יַת יְיָ אֱלָהָכוֹן לְקַבָּלָא לְמֵימְרֵיהּ וּלְמִקְרַב לִדְחַלְתֵּיהּ אֲרוּם אוֹרַיְיתָא דְאַתּוּן עֲסִיקִין בָּהּ הִיא חַיֵיכוֹן בְּעַלְמָא הָדֵין וְאוֹגְדוּת יוֹמֵיכוֹן בְּעַלְמָא דְאָתֵי וְתִתְכַּנְשׁוּן בְּסוֹף גַלְוָותָא וְתֵיתְבוּן עַל אַרְעָא דְקַיֵים יְיָ לְאַבְהַתְכוֹן לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב לְמִתַּן לְהוֹן", "pj_en": "that you may love the Lord thy God, to obey His Word, and keep close unto His fear; for the law in which you occupy yourselves will be your life in this world, and the prolongment of your days in the world that cometh; and you shall be gathered together at the end of the scattering, and dwell upon the land which the Lord sware to your fathers, to Abraham, Izhak, and Jakob, to give it unto them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 1, "aliyah": 4, "heb": "וַיֵּ֖לֶךְ מֹשֶׁ֑ה וַיְדַבֵּ֛ר אֶת־הַדְּבָרִ֥ים הָאֵ֖לֶּה אֶל־כׇּל־יִשְׂרָאֵֽל׃", "onk": "וַאֲזַל משֶׁה וּמַלִּיל יָת פִּתְגָּמַיָּא הָאִלֵּין עִם כָּל יִשְׂרָאֵל:", "onk_en": "Moshe went and he addressed these statements to all of Yisroel.", "pj": "וילך וַאֲזַל משֶׁה לְמַשְׁכַּן בֵּית אוּלְפָנָא וּמַלֵיל יַת פִּתְגָמַיָא הָאִלֵין עִם כָּל יִשְרָאֵל", "pj_en": "AND Mosheh went into the tabernacle of the house of instruction, and spake these words unto all Israel,", "tj": "", "tj_en": "", "rashi": "<b>וילך משה.<\/b> וגו':\n", "rashi_en": ""}, {"ch": 31, "v": 2, "aliyah": 4, "heb": "וַיֹּ֣אמֶר אֲלֵהֶ֗ם בֶּן־מֵאָה֩ וְעֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַיּ֔וֹם לֹא־אוּכַ֥ל ע֖וֹד לָצֵ֣את וְלָב֑וֹא וַֽיהֹוָה֙ אָמַ֣ר אֵלַ֔י לֹ֥א תַעֲבֹ֖ר אֶת־הַיַּרְדֵּ֥ן הַזֶּֽה׃", "onk": "וַאֲמַר לְהוֹן בַּר מְאָה וְעֶשְׂרִין שְׁנִין אֲנָא יוֹמָא דֵין לֵית אֲנָא יָכִיל עוֹד לְמִפַּק וּלְמֵעָל וַיְיָ אֲמַר לִי לָא תְעִבַּר יָת יַרְדְּנָא הָדֵין:", "onk_en": "He said to them, ‘‘I am 120 years old today, I cannot any longer go forth and return; for Adonoy has said to me, ‘You will not cross this Yardein.’", "pj": "וַאֲמַר לְהוֹן בַּר מְאָה וְעֶשְרִין שְׁנִין אֲנָא יוֹמָנָא לֵית אֲנָא יָכִיל תּוּב לְמִפַּק וּלְמֵיעַל וּמֵימְרָא דַיְיָ אֲמַר לִי לָא תְעִיבַר יַת יוֹרְדְנָא הָדֵין", "pj_en": "and said to them: I am the son of a hundred and twenty years this day. I am no more able to go out and come in, and the Word of the Lord hath said to me: Thou shalt not go over this Jordan.", "tj": "", "tj_en": "", "rashi": "<b>וילך משה וגו', אנכי היום.<\/b> הַיּוֹם מָלאוּ יָמַי וּשְׁנוֹתַי, בְּיוֹם זֶה נוֹלַדְתִּי וּבְיוֹם זֶה אָמוּת (סוטה י\"ג):<br><br><b>לא אוכל עוד לצאת ולבוא.<\/b> יָכוֹל שֶׁתָּשַׁשׁ כֹּחוֹ, תַּלְמוּד לוֹמַר \"לֹא כָהֲתָה עֵינוֹ וְלא נָס לֵחֹה\", אֶלָּא מַהוּ <b>לא אוכל<\/b>? אֵינִי רַשַּׁאי, שֶׁנִּטְּלָה מִמֶּנִּי הָרְשׁוּת וְנִתְּנָה לִיהוֹשֻׁעַ. דָּ\"אַ — <b>לצאת ולבוא.<\/b> בְּדִבְרֵי תוֹרָה, מְלַמֵּד שֶׁנִּסְתְּמוּ מִמֶּנּוּ מָסוֹרוֹת וּמַעְיְנוֹת הַחָכְמָה (סוטה י\"ג):<br><br><b>וה' אמר אלי.<\/b> זֶהוּ פֵּרוּשׁ <b>לא אוכל עוד לצאת ולבוא<\/b> — לְפִי שֶׁה' <b>אמר אלי<\/b>:", "rashi_en": "וילך משה וגו' ... אנכי היום AND MOSES WENT ... I AM [HUNDRED AND TWENTY YEARS OLD] THIS DAY — Today my days and my years become full: for on this day (the seventh of Adar; cf. Rashi on Deuteronomy 1:3) I was born and on this day I must die (Sotah 13b).<br><br> לא אוכל עוד לצאת ולבוא I CAN NO LONGER GO OUT AND COME IN — One might think that this was because his physical strength failed him! Scripture, however, states (Deuteronomy 34:7) “His eye was not dim nor his natural force abated!” What then is the meaning of לא אוכל? It means: “I am not permitted” (cf. Rashi on Deuteronomy 12:17 and Deuteronomy 2
