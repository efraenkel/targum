 הַקָּבָּ\"ה הֲרֵינִי מַכְנִיסוֹ בַּחֲצִי הַיּוֹם וְכָל מִי שֶׁיֵּשׁ בְּיָדוֹ כֹחַ לִמְחוֹת יָבֹא וְיִמְחֶה; בְּמִצְרַיִם נֶאֱמַר \"בְּעֶצֶם הַיּוֹם הַזֶּה הוֹצִיא ה'\" (שמות י\"ב), לְפִי שֶׁהָיוּ מִצְרִיִּים אוֹמְרִים בְּכָךְ וְכָךְ אִם אָנוּ מַרְגִּישִׁין בָּהֶם, אֵין אָנוּ מַנִּיחִין אוֹתָם לָצֵאת, וְלֹא עוֹד אֶלָּא אָנוּ נוֹטְלִין סְיָפוֹת וּכְלֵי זַיִן וְהוֹרְגִין בָּהֶם, אָמַר הַקָּבָּ\"ה הֲרֵינִי מוֹצִיאָן בַּחֲצִי הַיּוֹם וְכָל מִי שֶׁיֵּשׁ בּוֹ כֹחַ לִמְחוֹת יָבֹא וְיִמְחֶה; אַף כָּאן בְּמִיתָתוֹ שֶׁל מֹשֶׁה נֶאֱמַר \"בְּעֶצֶם הַיּוֹם הַזֶּה\", לְפִי שֶׁהָיוּ יִשְׂרָאֵל אוֹמְרִים בְּכָךְ וְכָךְ אִם אָנוּ מַרְגִּישִׁין בּוֹ — אֵין אָנוּ מַנִּיחִין אוֹתוֹ, אָדָם שֶׁהוֹצִיאָנוּ מִמִּצְרַיִם וְקָרַע לָנוּ אֶת הַיָּם וְהוֹרִיד לָנוּ אֶת הַמָּן וְהֵגִיז לָנוּ אֶת הַשְּׂלָו וְהֶעֱלָה לָנוּ אֶת הַבְּאֵר וְנָתַן לָנוּ אֶת הַתּוֹרָה, אֵין אָנוּ מַנִּיחִין אוֹתוֹ, אָמַר הַקָּבָּ\"ה הֲרֵינִי מַכְנִיסוֹ בַחֲצִי הַיּוֹם וְכוּ' (ספרי):", "rashi_en": "וידבר ה' אל משה בעצם היום הזה AND THE LORD SPAKE TO MOSES THAT SELF SAME DAY — In three places in Scripture the expression בעצם היום הזה is used. It states in the narrative of Noah (Genesis 7:12) בעצם היום הזה entered Noah … [into the ark]” — which means in the glare of full daylight. Because his contemporaries said: By this and by that we swear; (cf. Note 2 on Deuteronomy 1:1): If we notice him about to do so we will not let him enter the ark, and not only that, but we will take axes and hatchets and we will split the ark in pieces. Thereupon the Holy One, blessed be He, said, “See, I will let him enter at midday and anyone who has power to prevent it, let him come and prevent it!” Of Egypt, too, it states, (Exodus All. 11) “The selfsame day the Lord did bring [the children of Israel out of the land of Egypt]”: because the Egyptians said: By this and by that! If we notice them about to do so, we will not let them leave, and not only that, but we will take swords and other weapons and will kill them. Thereupon said the Holy One, blessed be He, “See, I will bring them forth in the middle of the day, and anyone who has power to prevent it, let him come and prevent it!” Here, too, regarding Moses’ death, it states בעצם היום הזה, because the children of Israel said, By this and by that! If we notice him about to ascend the mountain, we will not let him do so, — the man who brought us out of Egypt, and divided the Red Sea for us, and brought the Manna down for us, and brought a flight of quails for us, and made the “well” rise, and gave us the Torah: we will not permit him to go!” Thereupon the Holy One, blessed be He, said, “Behold, I will bring him unto his resting place in the middle of the day, etc.” (Sifrei Devarim 337; cf. Rashi on Genesis 17:23)."}, {"ch": 32, "v": 49, "aliyah": 7, "heb": "עֲלֵ֡ה אֶל־הַר֩ הָעֲבָרִ֨ים הַזֶּ֜ה הַר־נְב֗וֹ אֲשֶׁר֙ בְּאֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל־פְּנֵ֣י יְרֵח֑וֹ וּרְאֵה֙ אֶת־אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִבְנֵ֥י יִשְׂרָאֵ֖ל לַאֲחֻזָּֽה׃", "onk": "סַק לְטוּרָא דַעֲבָרָאֵי הָדֵין טוּרָא דִנְבוֹ דִּי בְאַרְעָא דְמוֹאָב דִּי עַל אַפֵּי יְרֵחוֹ וַחֲזֵי יָת אַרְעָא דִכְנַעַן דִּי אֲנָא יָהֵב לִבְנֵי יִשְׂרָאֵל לְאַחֲסָנָא:", "onk_en": "‘‘Go up to this Mount Ho’avorim, Mount Nevo, which is in the land of Moav, that faces Yereicho; and see the land of Canaan that I am giving to Bnei Yisroel as inheritance.", "pj": "וַהֲוָה כֵיוַן דַאֲמַר לֵיהּ מֵימְרָא דַיְיָ סוּק לְטַוָור עִבְרָאֵי הָדֵין טַוְורָא דִנְבוֹ חָשֵׁב בְּלִבֵּיהּ וַאֲמַר דִלְמָא דַמְיָיא מְסוּקְתָא דָא לִמְסוּקְתָא דְטַוְורָא דְסִינַי אָמַר אִיזֵל וְאִיקְדֵישׁ יַת עַמָא אָמַר לֵיהּ מֵימְרָא דַיְיָ לָא כָּל הֵיאֵךְ אֱלָהֵן סוֹק וַחֲמֵי יַת אַרְעָא דִכְנָעַן דַאֲנָא יָהֵיב לִבְנֵי יִשְרָאֵל לְאַחְסָנָא", "pj_en": "It was when the Word of the Lord had said to him, Go up to this mount Ibraee, the mountain of Nebo, and he thought in his heart, and said, Perhaps this up-going will be like that to Mount Sinai; and he said, I will go and sanctify the people; but the Word of the Lord said to him, Not so at all, but, Go thou up and view the land of Kenaan, which I have given to the children of Israel for an inheritance.", "tj": "סַק לְטוּרָא דַעֲבָרָאֵי הָדֵין טוּרָא דִנְבוֹ דְאִית בְּאַרְעָא דְמוֹאָב דְאִית בְּלִקֳבֵל יְרֵחוֹ וַחֲמֵי יַת אַרְעָא דִכְנָעַן דַאֲנָא יְהַב לִבְנֵי יִשְרָאֵל לְאַחֲסָנָא:", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 50, "aliyah": 7, "heb": "וּמֻ֗ת בָּהָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּה וְהֵאָסֵ֖ף אֶל־עַמֶּ֑יךָ כַּֽאֲשֶׁר־מֵ֞ת אַהֲרֹ֤ן אָחִ֙יךָ֙ בְּהֹ֣ר הָהָ֔ר וַיֵּאָ֖סֶף אֶל־עַמָּֽיו׃", "onk": "וּמוּת בְּטוּרָא דִּי אַתּ סָלֵק לְתַמָּן וְתִתְכְּנֵשׁ לְעַמָּךְ כְּמָא דְמִית אַהֲרן אֲחוּךְ בְּהוֹר טוּרָא וְאִתְכְּנִישׁ לְעַמֵּיהּ:", "onk_en": "And die on the mountain upon which you are going up and be gathered unto your people, just as your brother Aharon died in Hor Hohor and was gathered unto his people.", "pj": "וּשְׁכוֹב בְּטַוְורָא דְאַנְתְּ סָלֵיק לְתַמָן וְאִתְכְּנֵשׁ לְעַמָךְ אוּף אַנְתְּ הֵיכְמָא דְשָׁכַב אַהֲרן אָחוּךְ בְּטַוְורוֹס אוּמָנוֹס וְאִתְכְּנַשׁ לְעַמֵיהּ מִן יַד פָּתַח משֶׁה פּוּמֵיהּ בִּצְלוֹתָא וְכֵן אָמַר רִבּוֹנֵיהּ דְעַלְמָא בְּבָעוּ מִנָךְ לָא אֱהִי מְתִיל כְּבַר נַשׁ דַהֲוָה לֵיהּ בִּיר יְחִידָאֵי וְאִשְׁתְּבֵי אָזַל פַּרְקֵיהּ בְּמָמוֹן סַגִי אַלְפֵיהּ חָכְמָתָא וְאוּמָנוּתָא קַדִישׁ לֵיהּ אִיתָא נְצִיב אַבְוַורְנְקִי דְמַלְכַיָא בְּנָא לֵיהּ בֵּית חֲתָנוּתָא אַתְקִין לֵיהּ פּוּרְיָינָא וְקָטַר לֵיהּ גְנָנָא בְּגַוֵיהּ זַמִין לֵיהּ שׁוּשְׁבִינֵי אַפָא פִּתֵּיהּ נְכַס נִיכְסֵיהּ מְזַג חַמְרֵיהּ כֵּיוַון דְמָטָא לְמֶחֱדֵי בְּרֵיהּ עִם אִנְתְּתֵיהּ וּבָעוּ שׁוּשְׁבִינֵי לְמִכְרַךְ רִפְתָּא אִתְּבַע הַהוּא בַּר נַשׁ לְבֵי דִינָא קַמֵי מַלְכָּא וְאִתְקְנֵס דִין קְטוֹל וְלָא דָלוּ מִנֵיהּ עַד דְחָמֵי בְּחֶדְוָות בְּרֵיהּ הֵיכְדֵין אֲנָא טְרָחִית בְּעַמָא הָדֵין אַפִּיקִית יַתְהוֹן בְּמֵימְרָךְ מִמִצְרַיִם אַלִיפִית יַתְהוֹן אוֹרַיְיתָךְ בָּנִיתִי לְהוֹן מַשְׁכְּנָא לִשְׁמָךְ וְכַד מָטָא זִמְנָא לְמֵיעֲבַר יַת יוֹרְדְנָא לְמֵירוֹת יַת אַרְעָא אֲנָא מִתְקְנַס לִמְמַת אִי נִיחָא לְקַמָךְ דַלֵי מִנִי וְאֶעֱבוֹר יַת יוֹרְדְנָא וְאֶחֱמֵי בְּטוּבָתָא דְיִשְרָאֵל וּמִבָּתַר כְּדֵין אֵימוּת", "pj_en": "And thou shalt sleep in the mountain to which thou goest up, and be gathered to thy people, even thou, as Aharon thy brother hath slept in the mountain of Omanos, and hath been gathered unto his people. Mosheh at once opened his mouth in prayer, and said, Lord of all the world, I entreat that I may not be as a man who had one only son, who being in captivity, he went and redeemed him with great price; he taught him wisdom and art, espoused him to a wife, planted for him a royal bower, builded him a marriage house, prepared for him the bed, invited his companions, baked his bread, slew his victims, and mixed his wine; yet, when the time came for his son to make glad with his wife, and the guests were about to consecrate the feast; then was that man required to go to the house of judgment, before the king and be punished with the judgment of death; neither would the delay to execute his sentence that he might see the happiness of his son. So have I laboured for this people; I have led them by Thy Word out of Mizraim, and builded for this people; I have taught them Thy law builded for them the tabernacle to Thy Name; but now that the time hath come to pass the Jordan, I am punished with death! Let it please Thee to withhold from me this sentence until I have passed the Jordan, to see the good of Israel before I die.", "tj": "וְתִתְכְּנִישׁ בְּטוּרָא דְאַתְּ סָלִיק לְתַמָן וְתִתְכְּנִישׁ בִּשְׁלָם לְוַת עַמָךְ הֵיךְ מַה דְאִתְכְּנִישׁ אַהֲרן אָחוּךְ בְּהוֹר טוּרָא וְאִתְכְּנַשׁ בִּשְׁלָם לְוַת ^עַמֵיהּ:", "tj_en": "", "rashi": "<b>כאשר מת אהרן אחיך.<\/b> בְּאוֹתָהּ מִיתָה שֶׁרָאִיתָ וְחָמַדְתָּ אוֹתָהּ, שֶׁהִפְשִׁיט מֹשֶׁה אֶת אַהֲרֹן בֶּגֶד רִאשׁוֹן וְהִלְבִּישׁוֹ לְאֶלְעָזָר וְכֵן שֵׁנִי וְכֵן שְׁלִישִׁי וְרָאָה בְּנוֹ בִּכְבוֹדוֹ, אָמַר לוֹ מֹשֶׁה, אַהֲרֹן אָחִי עֲלֵה לַמִּטָּה וְעָלָה, פְּשֹׁט יָדְךָ וּפָשַׁט, פְּשֹׁט רַגְלְךָ וּפָשַׁט, עֲצֹם עֵינֶיךָ וְעָצַם, קְמֹץ פִּיךָ וְקָמַץ, וְהָלַךְ לוֹ. אָמַר מֹשֶׁה — אַשְׁרֵי מִי שֶׁמֵּת בְּמִיתָה זוֹ (ספרי):", "rashi_en": "כאשר מת אהרן אחיך [AND DIE] … AS AARON THY BROTHER DIED — i.e., and die by that death which you witnessed and for which you longed. For Moses stripped Aaron (before the latter’s death) of his first (i.e., the upper) garment, similarly the second, and similarly the third, and attired Elazar with them, and thus he (Aaron) beheld his son in his new dignity. Moses then said to him, “Aaron, my brother, ascend the bier”, and he ascended; — “Stretch out your hand”, and he stretched it out; — “Stretch out your leg”, and he stretched it out; “Close your eyes”, and he closed them; — “Close your mouth”, and he closed it, and thus did he pass away! Thereupon Moses said, “Happy is he who will die a death like this!” (Sifrei Devarim 339:3; cf. Rashi on Numbers 20:26)."}, {"ch": 32, "v": 51, "aliyah": 7, "heb": "עַל֩ אֲשֶׁ֨ר מְעַלְתֶּ֜ם בִּ֗י בְּתוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בְּמֵֽי־מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר־צִ֑ן עַ֣ל אֲשֶׁ֤ר לֹֽא־קִדַּשְׁתֶּם֙ אוֹתִ֔י בְּת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "עַל דִּי <b>שַׁקַּרְתּוּן בְּמֵימְרִי<\/b> בְּגוֹ בְּנֵי יִשְׂרָאֵל בְּמֵי מַצּוּת <b>רְקָם<\/b> מַדְבְּרָא דְצִן עַל דִּי לָא קַדִּשְׁתּוּן יָתִי בְּגוֹ בְּנֵי יִשְׂרָאֵל:", "onk_en": "Because you were unfaithful [<b>untrue<\/b>] to Me [<b>My word<\/b>] amid Bnei Yisroel at the waters of argument at Kodeish [<b>Rekom<\/b>] in the Tzin wilderness; because of [the fact] that you did not sanctify Me amid Bnei Yisroel.", "pj": "אָתִיב לֵיהּ מָרֵי עַלְמָא וְכֵן אָמַר מִן בִּגְלַל דְשַׁקַרְתּוּן בְּמֵימְרִי בִּמְצַע בְּנֵי יִשְרָאֵל בְּמוֹי מַצוֹת רְקַם מַדְבְּרָא דְצִין מְטוֹל דְלָא קַדִישְׁתּוּן יָתִי בִּמְצַע בְּנֵי יִשְרָאֵל", "pj_en": "The Lord of the world answered him, and said: Because thou didst prevaricate with My Word In the midst of the children of Israel, at the Waters of Contention at Rekem in the desert of Zin, and didst not sanctify Me among them;", "tj": "עַל דְסָרֵיבְתּוּן בְּשֵׁם מֵימְרִי בְּגוֹ בְּנֵי יִשְרָאֵל בְּמֵי מַצוּתָא רְקָם בְּמַדְבְּרָא דְצִין עַל דְלָא קַדִישְׁתּוּן יָתִי בְּגוֹ בְּנֵי יִשְרָאֵל:", "tj_en": "Because you were rebellious towards the Name of My Word, among the Beni Israel, at the Waters of Contention in Rekem in the desert of Zin; forasmuch as you did not sanctify Me in the midst of them,", "rashi": "<b>על אשר מעלתם בי.<\/b> גְּרַמְתֶּם לִמְעֹל בִּי:<br><br><b>על אשר לא קדשתם אותי.<\/b> גְּרַמְתֶּם לִי שֶׁלֹּא אֶתְקַדֵּשׁ, אָמַרְתִּי לָכֶם \"וְדִבַּרְתֶּם אֶל הַסֶּלַע\" (במדבר כ') וְהֵם הִכּוּהוּ וְהֻצְרְכוּ לְהַכּוֹתוֹ פַעֲמַיִם, וְאִלּוּ דִּבְּרוּ עִמּוֹ וְנָתַן מֵימָיו בְּלֹא הַכָּאָה, הָיָה מִתְקַדֵּשׁ שֵׁם שָׁמַיִם, שֶׁהָיוּ יִשְׂרָאֵל אוֹמְרִים וּמַה הַסֶּלַע שֶׁאֵינוֹ לְשָׂכָר וְלֹא לְפֻרְעָנוּת, אִם זָכָה אֵין לוֹ מַתַּן שָׂכָר וְאִם חָטָא אֵינוֹ לוֹקֶה, כָּךְ מְקַיֵּם מִצְוַת בּוֹרְאוֹ, אָנוּ לֹא כָּל שֶׁכֵּן:", "rashi_en": "על אשר מעלתם בי BECAUSE YE TRESPASSED AGAINST ME — i.e., because you made the people to trespass against Me.<br><br>על אשר לא קדשתם אותי BECAUSE YE SANCTIFIED ME NOT — i.e. because you brought it about that I was not sanctified; I said to you, ‘Speak to the rock!” They, however, smote it and had therefore to smite it twice. Had they, however, spoken to it, and it had given forth its water without being smitten, the Name of the Heaven would have been sanctified; for the Israelites would have said, “How is it with the rock which is subject neither to reward nor to punishment, for when it acts meritoriously it receives no reward and when it sins it is not punished? It fulfils so obediently the command of its Creator! — how much the more should we do so!”"}, {"ch": 32, "v": 52, "aliyah": 7, "heb": "כִּ֥י מִנֶּ֖גֶד תִּרְאֶ֣ה אֶת־הָאָ֑רֶץ וְשָׁ֙מָּה֙ לֹ֣א תָב֔וֹא אֶל־הָאָ֕רֶץ אֲשֶׁר־אֲנִ֥י נֹתֵ֖ן לִבְנֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי מִקֳּבֵל תֶּחֱזֵי יָת אַרְעָא וּלְתַמָּן לָא תֵעוּל לְאַרְעָא דִּי אֲנָא יָהֵב לִבְנֵי יִשְׂרָאֵל:", "onk_en": "For from afar will you see the land but you will not come there to the land that I am giving to Bnei Yisroel.’’", "pj": "אֲרוּם מִקָבֵיל תֶּחֱמֵי יַת אַרְעָא וְתַמָן לָא תֵיעוּל לְאַרְעָא דַאֲנָא יָהִיב לִבְנֵי יִשְרָאֵל", "pj_en": "therefore thou mayest look over against it, but shalt not enter into the land that I give unto the children of Israel.", "tj": "אֲרוּם בִּלְקָבֵל תֶּחֱמֵי יַת אַרְעָא וְתַמָן לָא תֵיעוּל לְאַרְעָא דִי אֲנָא יָהִיב לִבְנֵי יִשְרָאֵל:", "tj_en": "therefore thou mayest look over against it, but shalt not enter into the land which I give to the children of Israel.", "rashi": "<b>כי מנגד.<\/b> מֵרָחוֹק:<br><br><b>תראה וגו'.<\/b> אִם לֹא תִרְאֶנָּה עַכְשָׁו, לֹא תִרְאֶנָּה עוֹד בְּחַיֶּיךָ, עַל כֵּן אֲנִי אוֹמֵר לְךָ עֲלֵה וּרְאֵה:<br><br><b>ושמה לא תבוא.<\/b> וְיָדַעְתִּי כִּי חֲבִיבָה הִיא לְךָ, עַל כֵּן אֲנִי אוֹמֵר לְךָ עֲלֵה וּרְאֵה:", "rashi_en": "כי מנגד means, BECAUSE FROM THE DISTANCE.<br><br>תראה וגו׳ YOU SHALL SEE [THE LAND] etc. — If you do not see it now, you will not see it at any time during your lifetime,<br><br>ושמה לא תבוא SINCE YOU SHALL NOT COME THERE — for I know that it is dear unto you, therefore I tell you (v. 49) “Ascend and see it!”."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
