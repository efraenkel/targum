 have to pay tribute and poll-taxes to the priests of the idols."}, {"ch": 28, "v": 65, "aliyah": 6, "heb": "וּבַגּוֹיִ֤ם הָהֵם֙ לֹ֣א תַרְגִּ֔יעַ וְלֹא־יִהְיֶ֥ה מָנ֖וֹחַ לְכַף־רַגְלֶ֑ךָ וְנָתַן֩ יְהֹוָ֨ה לְךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְכִלְי֥וֹן עֵינַ֖יִם וְדַאֲב֥וֹן נָֽפֶשׁ׃", "onk": "וּבְעַמְמַיָּא הָאִנּוּן לָא תְנוּחַ וְלָא יְהֵא מְנָח לְפַרְסַת רַגְלָךְ וְיִתֵּן יְיָ לָךְ תַּמָּן לֵב דָּחֵל <b>וְחַשְׁכַת<\/b> עַיְנִין <b>וּמַפְּחַן<\/b> נְפָשׁ:", "onk_en": "And among those nations you will not be tranquil and there will be no rest for the sole of your foot; and Adonoy will give you there a fearful heart and pining eyes and disillusioned spirit.", "pj": "וְאִין יִתְפְּלֵג דַעְתְּכוֹן לְמִפְלַח לְטַעֲוַותְהוֹן וְאִיגְרֵי בֵּינֵיכוֹן וּבֵינֵי עַמְמַיָא הָאִינוּן וְלָא תְּנוּחוּן וְלָא יֶהֱוֵי מַנַח לְפִירְסַת רִגְלֵיכוֹן וְיִתֵּן מֵימְרָא דַיְיָ לְכוֹן תַּמָן לִבָּא דַחֲלָא דְמֵחַשְׁכָן עַיְינִין וּמַפְחַת נְפָשׁ", "pj_en": "And if your mind be divided to worship their idols, He will send (that) between you and those nations that you shall have no repose or rest for the sole of your feet, and will give you there a fearful heart which darkens the eyes and wears out the soul.", "tj": "וְיִתֵּן לְכוֹן תַּמָן לֵב דָחִיל יְסוֹף עֵינֵיכוֹן וְדָאִיב נְפָשׁ:", "tj_en": "", "rashi": "<b>לא תרגיע.<\/b> לֹא תָנוּחַ, כְּמוֹ \"וְזֹאת הַמַּרְגֵּעָה\" (ישעיהו כ\"ח):<br><br><b>לב רגז.<\/b> לֵב חָרֵד, כְּתַרְגּוּמוֹ \"דָּחֵל\", כְּמוֹ (ישעיהו י\"ד) \"שְׁאוֹל מִתַּחַת רָגְזָה לָךְ\" (שמות ט\"ו) \"שָׁמְעוּ עַמִּים יִרְגָּזוּן\", (שמואל ב כ\"ב) \"מוֹסְדוֹת הַשָּׁמַיִם יִרְגָּזוּ\":<br><br><b>וכליון עינים.<\/b> מְצַפֶּה לִישׁוּעָה וְלֹא תָבֹא:", "rashi_en": "לא תרגיע means, THOU SHALT FIND NO REST, as (Isaiah 28:12) “This is the rest (המרגעה) <br><br>לב רגז means, A TREMBLING HEART, as the Targum has it: דחל, fearing. It is similar in meaning to (Isaiah 14:9) “The nether-world from beneath trembleth (רגזה) for thee”; (Exodus 15:14) “The peoples have heard, they trembled”; (II Samuel 22:8) “The foundations of heaven trembled”.<br><br>וכליון עינים AND A FAILING OF THE EYES — The phrase is used of one who expectantly looks for help and it does not come (cf. v. 32)."}, {"ch": 28, "v": 66, "aliyah": 6, "heb": "וְהָי֣וּ חַיֶּ֔יךָ תְּלֻאִ֥ים לְךָ֖ מִנֶּ֑גֶד וּפָֽחַדְתָּ֙ לַ֣יְלָה וְיוֹמָ֔ם וְלֹ֥א תַאֲמִ֖ין בְּחַיֶּֽיךָ׃", "onk": "וִיהוֹן חַיָּיךְ תְּלָן לָךְ מִקֳּבֵל וּתְהֵי <b>תָוֵה<\/b> לֵילְיָא וִימָמָא וְלָא תְהֵימִין בְּחַיָּיךְ:", "onk_en": "Your life will dangle before you, and you will be in fear [<b>afraid<\/b>] night and day, and will have no faith in your living.", "pj": "וִיהוֹן חַיֵיכוֹן תַּלְיַין לְכוֹן מִקְבֵיל וְתֶהֱווֹן דַחֲלִין יֵימָם וְלֵילֵי וְלָא תְהֵימְנוּן בְּחַיֵיכוֹן", "pj_en": "And your life will be in suspense; you will be in dread day and night, and have no assurance of your life.", "tj": "", "tj_en": "", "rashi": "<b>חייך תלאים לך.<\/b> עַל הַסָּפֵק, כָּל סָפֵק קָרוּי תָּלוּי, שֶׁמָּא אָמוּת הַיּוֹם בַּחֶרֶב הַבָּאָה עָלֵינוּ. וְרַבּוֹתֵינוּ דָרְשׁוּ זֶה הַלּוֹקֵחַ תְּבוּאָה מִן הַשּׁוּק:<br><br><b>ולא תאמין בחייך.<\/b> זֶה הַסּוֹמֵךְ עַל הַפַּלְטֵר (עי' מנחות ק\"ג):", "rashi_en": "חייך תלאים לך THY LIFE SHALL HANG BEFORE THEE — because of uncertainty. — Anything that is uncertain may be termed תלוי (“hanging”); You will always be saying: “Perhaps I shall die to-day through the sword that is coming upon us”. — Our Rabbis interpreted this to refer to one who is obliged to buy produce in the market (who does not possess any of his own),<br><br>ולא תאמין בחייך AND THOU SHALT HAVE NONE ASSURANCE OF THY LIFE — this they refer to one who must rely on the baker (cf. Menachot 103b)."}, {"ch": 28, "v": 67, "aliyah": 6, "heb": "בַּבֹּ֤קֶר תֹּאמַר֙ מִֽי־יִתֵּ֣ן עֶ֔רֶב וּבָעֶ֥רֶב תֹּאמַ֖ר מִֽי־יִתֵּ֣ן בֹּ֑קֶר מִפַּ֤חַד לְבָֽבְךָ֙ אֲשֶׁ֣ר תִּפְחָ֔ד וּמִמַּרְאֵ֥ה עֵינֶ֖יךָ אֲשֶׁ֥ר תִּרְאֶֽה׃", "onk": "בְּצַפְרָא תֵימַר מָן יִתֵּן רַמְשָׁא וּבְרַמְשָׁא תֵימַר מָן יִתֵּן צַפְרָא <b>מִתַּוְהוּת<\/b> לִבָּךְ דִּי תְהֵי <b>תָוֵה<\/b> וּמֵחֵזוּ עֵינָיךְ דִּי תְהֵי חָזֵי:", "onk_en": "In the morning you will say, ‘‘Would that it were evening,’’ and in the evening you will say, ‘‘Would that it were morning,’’ from the fear [<b>fright<\/b>] in your heart that you will fear [<b>be afraid<\/b>] and from the sights of your eyes that you will see.", "pj": "בְּצַפְרָא תֶהֱווֹן אָמְרִין לְוַאי דִיהֵי רַמְשָׁא דְעָקַן מְאַרְכָן שְׁעֵי יוֹמָא בְּאַפֵּיכוֹן וּבְרַמְשָׁא תֶּהֱווֹן אָמְרִין לְוַאי דִיהֵי צַפְרָא דְעָקַן מְאַרְכָן שְׁעֵי לֵילְיָא בְּאַפֵּיכוֹן מִתַּוְוהִית לִבְּכוֹן דְתֶהֱווֹן תַּוָון וּמִן מֵחְמֵי עֵינֵיכוֹן דְאַתּוּן חַמְיָין פּוּרְעֲנוּתָא וְדַחֲלוּן", "pj_en": "In the morning you will say, O that it were evening! for afflictions will make the hours of the day longer before you; and at evening you will say, O that it were morning! for afflictions will make the hours of the night longer before you, because of the terror of your heart; for you will be in stupor by a vision of your eyes, which you will see for punishment, and be terrified.", "tj": "", "tj_en": "", "rashi": "<b>בבקר תאמר מי יתן ערב.<\/b> וְיִהְיֶה הָעֶרֶב שֶׁל אֶמֶשׁ:<br><br><b>ובערב תאמר מי יתן בקר.<\/b> שֶׁל שַׁחֲרִית, שֶׁהַצָּרוֹת מִתְחַזְּקוֹת תָּמִיד וְכָל שָׁעָה מְרֻבָּה קִלְלָתָהּ מִשֶּׁלְּפָנֶיהָ (עי' סוטה מ\"ט):", "rashi_en": "בבקר תאמר מי יתן ערב IN THE MORNING THOU SHALT SAY, WOULD IT WERE EVEN! — i.e. would that it were again yesterday evening,<br><br>ובערב תאמר מי יתן בקר AND AT EVEN THOU SHALT SAY, WOULD IT WERE MORNING! — i.e. the morning of today, because the misery will constantly grow more severe, and the curse of each hour will be greater than that of the preceding (cf. Sotah 49a)."}, {"ch": 28, "v": 68, "aliyah": 6, "heb": "וֶהֱשִֽׁיבְךָ֨ יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;מִצְרַ֘יִם֮ בׇּאֳנִיּוֹת֒ בַּדֶּ֙רֶךְ֙ אֲשֶׁ֣ר אָמַ֣רְתִּֽי לְךָ֔ לֹא־תֹסִ֥יף ע֖וֹד לִרְאֹתָ֑הּ וְהִתְמַכַּרְתֶּ֨ם שָׁ֧ם לְאֹיְבֶ֛יךָ לַעֲבָדִ֥ים וְלִשְׁפָח֖וֹת וְאֵ֥ין קֹנֶֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיָתֵיבִנָּךְ יְיָ מִצְרַיִם בִּסְפִינָן בְּאָרְחָא דִּי אֲמָרִית לָךְ לָא תוֹסֵף עוֹד לְמֵחְזְיַהּ <b>וְתִזְדַּבְּנוּן<\/b> תַּמָּן לְּבַעֲלֵי דְבָבָךְ לְעַבְדִּין וּלְאַמְהָן וְלֵית דְּקַנֵה:", "onk_en": "Adonoy will send you back to Egypt on ships, along the route that I told you, ‘‘You are not to see it again,’’ and there you will attempt to sell yourselves [<b>be sold<\/b>] to your enemies as slaves and as maidservants but no one will buy.", "pj": "וְיַגְלִינְכוֹן מֵימְרָא דַיְיָ לְמִצְרַיִם בְּאִילְפַיָא בְּגוֹ יַמָא דְסוּף בְּאָרְחָא דַעֲבַרְתּוּן וַאֲמָרִית לְכוֹן לָא תֵיסְפוּן תּוּב לְמֶחֱמֵי יָתָהּ וְתִזְדַבְּנוּן תַּמָן בְּשֵׁירוּיָא לְבַעֲלֵי דְבָבֵיכוֹן בְּדָמִין יַקִירִין הֵיךְ מָרֵי אוּמְנָוָון וּמִן בָּתַר כְּדֵין בְּדָמִין זוֹלִין כְּעַבְדִין וְאַמְהָן עַד דְתִיזַלְזְלִין לְמִשְׁתַּעַבְּדָא מַגָן וְלֵית דְמַכְנִישׁ", "pj_en": "And the Word of the Lord will bring you captive to Mizraim in ships through the Sea of Suph, by the way you passed over, of which I said to you, No more shall you see it. And there will you be sold to your enemies, at the beginning for a dear price, as artificers, and afterward at a cheap price, as servants and handmaids, until you be worthless and (be consigned) to unpriced labour, and there be none who will take you.", "tj": "וְיַחְזוֹר יַתְכוֹן מֵימְרָא דַיְיָ לְמִצְרַיִם בְּלִבְרָנַיָיא בְּאוֹרְחָא דִי אֲמָרִית לְכוֹן לָא תוֹסְפוּן עוֹד לְמֶחֱמֵי יָתָהּ:", "tj_en": "And the Word of the Lord will cause you to return into Mizraim in galleys, by the way of which I said to you, Ye shall see it no more.", "rashi": "<b>באניות.<\/b> בִּסְפִינוֹת — בַּשִּׁבְיָה:<br><br><b>והתמכרתם שם לאיביך.<\/b> אַתֶּם מְבַקְשִׁים לִהְיוֹת נִמְכָּרִים לָהֶם לַעֲבָדִים וְלִשְׁפָחוֹת:<br><br><b>ואין קנה.<\/b> כִּי יִגְזְרוּ עָלֶיךָ הֶרֶג וְכִלָּיוֹן:<br><br><b>והתמכרתם.<\/b> בְּלַעַז איפורוונדרי\"ץ וו\"ש, וְלֹא יִתָּכֵן לְפָרֵשׁ \"וְהִתְמַכַּרְתֶּם\" בִּלְשׁוֹן וְנִמְכַּרְתֶּם עַל יְדֵי מוֹכְרִים אֲחֵרִים מִפְּנֵי שֶׁנֶּאֱמַר אַחֲרָיו \"וְאֵין קוֹנֶה\":", "rashi_en": "באניות [AND THE LORD WILL BRING THEE INTO EGYPT AGAIN] באניות — the latter word means, in ships, i.e. He will bring you again into captivity to Egypt.<br><br>והתמכרתם שם לאיביך means, you will seek to be sold to them for slaves and handmaids (i.e. YOU WILL OFFER YOURSELVES FOR SALE),<br><br>ואין קנה AND NO MAN WILL BUY YOU — because they will pass upon you the doom of death and extermination.<br><br>והתמכרתם — “et pour vendrez yous” in old French It would not, however, be correct to explain והתמכרתם in the sense of ונמכרתם “and you will be sold” — i.e. by sellers other than yourselves, for it adds afterwards: “but no one will buy you”."}, {"ch": 28, "v": 69, "aliyah": 6, "heb": "אֵ֩לֶּה֩ דִבְרֵ֨י הַבְּרִ֜ית אֲֽשֶׁר־צִוָּ֧ה יְהֹוָ֣ה אֶת־מֹשֶׁ֗ה לִכְרֹ֛ת אֶת־בְּנֵ֥י יִשְׂרָאֵ֖ל בְּאֶ֣רֶץ מוֹאָ֑ב מִלְּבַ֣ד הַבְּרִ֔ית אֲשֶׁר־כָּרַ֥ת אִתָּ֖ם בְּחֹרֵֽב׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אִלֵּין פִּתְגָּמֵי קְיָמָא דִּי פַקִּיד יְיָ יָת משֶׁה לְמִגְזַר עִם בְּנֵי יִשְׂרָאֵל בְּאַרְעָא דְמוֹאָב בַּר מִקְּיָמָא דִּי גְזַר עִמְּהוֹן בְּחֹרֵב:", "onk_en": "These are the statements of the covenant that Adonoy commanded Moshe to ratify with Bnei Yisroel in the land of Moav, beside the covenant that he had made with them at Choreiv.", "pj": "אִלֵין פִּתְגָמֵי קְיָימָא דְפַקֵיד יְיָ יַת משֶׁה לְמִגְזוֹר עִם בְּנֵי יִשְרָאֵל בְּאַרְעָא דְמוֹאָב בַּר מִן קַיָמָא דְגָזַר עִמְהוֹן בְּחוֹרֵב", "pj_en": "These are the words of the covenant which the Lord commanded Mosheh to ratify with the children of Israel in the land of Moab, besides that covenant which He ratified with them at Horeb.", "tj": "", "tj_en": "", "rashi": "<b>לכרת את בני ישראל.<\/b> שֶׁיְּקַבְּלוּ עֲלֵיהֶם אֶת הַתּוֹרָה בְּאָלָה וּבִשְׁבוּעָה:<br><br><b>מלבד הברית.<\/b> קְלָלוֹת שֶׁבְּתוֹרַת כֹּהֲנִים שֶׁנֶּאֶמְרוּ בְסִינַי:", "rashi_en": "לכרת את בני ישראל [THE COVENANT WHICH THE LORD COMMANDED …] TO MAKE WITH THE CHILDREN OF ISRAEL — that they will take upon themselves the observance of the Torah under an imprecation and oath (cf. Deuteronomy 29:11).<br><br>מלבד הברית BESIDES THE COVENANT — i.e. the curses in Torath Cohanim (Leviticus 26:14 ff.) which were spoken at Sinai (Horeb)."}, {"ch": 29, "v": 1, "aliyah": 7, "heb": "וַיִּקְרָ֥א מֹשֶׁ֛ה אֶל־כׇּל־יִשְׂרָאֵ֖ל וַיֹּ֣אמֶר אֲלֵהֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כׇּל־אֲשֶׁר֩ עָשָׂ֨ה יְהֹוָ֤ה לְעֵֽינֵיכֶם֙ בְּאֶ֣רֶץ מִצְרַ֔יִם לְפַרְעֹ֥ה וּלְכׇל־עֲבָדָ֖יו וּלְכׇל־אַרְצֽוֹ׃", "onk": "וּקְרָא משֶׁה לְכָל יִשְׂרָאֵל וַאֲמַר לְהוֹן אַתּוּן חֲזֵתוּן יָת כָּל דִּי עֲבַד יְיָ לְעֵינֵיכוֹן בְּאַרְעָא דְמִצְרַיִם לְפַרְעֹה וּלְכָל עַבְדוֹהִי וּלְכָל אַרְעֵיהּ:", "onk_en": "Moshe called to all of Yisroel and said to them, ‘‘You have seen everything that Adonoy did as you watched, in the land of Egypt, to Pharoah and to all his attendants and to his entire land.", "pj": "וּקְרָא משֶׁה לְכָל יִשְרָאֵל וְאָמַר לְהוֹן אַתּוּן חֲמִיתוּן יַת כָּל מַחְוָותָא דְעָבַד מֵימְרָא דַיְיָ לְעֵינֵיכוֹן בְאַרְעָא דְמִצְרַיִם לְפַרְעה וּלְכָל עַבְדוֹי וּלְכָל יַתְבֵי אַרְעֵיהּ", "pj_en": "And Mosheh called to all Israel, and said to them: You have seen all the plagues which the Word of the Lord wrought in the land of Mizraim on Pharoh and all his servants, and all the inhabitants of that land;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 2, "aliyah": 7, "heb": "הַמַּסּוֹת֙ הַגְּדֹלֹ֔ת אֲשֶׁ֥ר רָא֖וּ עֵינֶ֑יךָ הָאֹתֹ֧ת וְהַמֹּפְתִ֛ים הַגְּדֹלִ֖ים הָהֵֽם׃", "onk": "נִסֵּי רַבְרְבַיָּא דִּי חֲזָאָה עֵינָיךְ אָתַיָּא וּמוֹפְתַיָּא רַבְרְבַיָּא הָאִנּוּן:", "onk_en": "The great miracles that you witnessed, those great signs and wonders.", "pj": "נִסִין רַבְרְבִין דַחֲמִיתוּן בְּעֵינֵיכוֹן אָתַיָא וְתִמְהַיָא רַבְרְבַיָא הָאִינוּן", "pj_en": "those great temptations, signs, and wonders which you saw with your eyes.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 3, "aliyah": 7, "heb": "וְלֹא־נָתַן֩ יְהֹוָ֨ה לָכֶ֥ם לֵב֙ לָדַ֔עַת וְעֵינַ֥יִם לִרְא֖וֹת וְאׇזְנַ֣יִם לִשְׁמֹ֑עַ עַ֖ד הַיּ֥וֹם הַזֶּֽה׃", "onk": "וְלָא יְהַב יְיָ לְכוֹן לִבָּא לְמִדַּע וְעַיְנִין לְמֶחֱזֵי וְאֻדְנִין לְמִשְׁמַע עַד יוֹמָא הָדֵין:", "onk_en": "Yet Adonoy did not grant you a knowledgeable mind and eyes to see, and ears to hear until this day.", "pj": "וְלָא יְהַב מֵימְרָא דַיְיָ לְכוֹן לִבָּא לְמִנְשֵׁי אֱלָהֵן לְמִנְדַע וְעַיְינִין לְמִרְמְזָא אֱלָהֵין לְמֶחֱמֵי וְאוּדְנִין לְטַמְטְמָא אֱלָהֵין לְצַיְיתָא וְאַתּוּן נְשִׁיתוּן אוֹרַיְיתָא דְלִבְּכוֹן וּרְמַזְתּוּן בְּעַיְינֵיכוֹן וְטַמְטַמְתּוּן אוּדְנֵיכוֹן בִּזְמַן יוֹמָא הָדֵין", "pj_en": "And the Word of the Lord hath given you a heart not to forget, but to understand; eyes, not to blink, but to see; ears, not to be stopped, but to listen with: yet you have forgotten the law with your heart, and have blinked with your eyes, and have stopped your ears, unto the time of this day.", "tj": "", "tj_en": "", "rashi": "<b>ולא נתן ה' לכם לב לדעת.<\/b> לְהַכִּיר אֶת חַסְדֵי הַקָּבָּ\"ה וְלִדַּבֵּק בּוֹ:<br><br><b>עד היום הזה.<\/b> שָׁמַעְתִּי שֶׁאוֹתוֹ הַיּוֹם שֶׁנָּתַן מֹשֶׁה סֵפֶר הַתּוֹרָה לִבְנֵי לֵוִי, כְּמוֹ שֶׁכָּתוּב (דברים ל\"א) \"וַיִּתְּנָהּ אֶל הַכֹּהֲנִים בְּנֵי לֵוִי\", בָּאוּ כָל יִשְׂרָאֵל לִפְנֵי מֹשֶׁה וְאָמְרוּ לוֹ מֹשֶׁה רַבֵּנוּ, אַף אָנוּ עָמַדְנוּ בְסִינַי וְקִבַּלְנוּ אֶת הַתּוֹרָה וְנִתְּנָה לָנוּ, וּמָה אַתָּה מַשְׁלִיט אֶת בְּנֵי שִׁבְטְךָ עָלֶיהָ וְיֹאמְרוּ לָנוּ יוֹם מָחָר לֹא לָכֶם נִתְּנָה, לָנוּ נִתְּנָה, וְשָׂמַח מֹשֶׁה עַל הַדָּבָר, וְעַל זֹאת אָמַר לָהֶם \"הַיּוֹם הַזֶּה נִהְיֵיתָ לְעָם וְגוֹ'\", הַיּוֹם הַזֶּה הֵבַנְתִּי שֶׁאַתֶּם דְּבֵקִים וַחֲפֵצִים בַּמָּקוֹם:", "rashi_en": "ולא נתן ה' לכם לב לדעת YET THE LORD HATH NOT GIVEN YOU A HEART TO KNOW — i.e. to understand the loving-kindnesses of the Omnipresent and to cleave unto Him.<br><br>עד היום הזה UNTO THIS DAY — I have heard that on the day when Moses gave the Book of the Law to the sons of Levi, as it is written, (Deuteronomy 31:9) “And he gave it to the priests the sons of Levi”, all Israel came before Moses and said to him: Teacher Moses, we, too, stood at Sinai and accepted the Torah, and it was given to us; why, then, do you give the people of your tribe control over it, that they may tomorrow say to us, “Not to you was it given, but to us was it given”? Moses rejoiced at this matter and in reference to this he said to them, (Deuteronomy 27:9) “This day have you become the people [of the Lord thy God]”, meaning, Only this day have I come to understand that you are attached to and have a desire for the Omnipresent."}, {"ch": 29, "v": 4, "aliyah": 7, "heb": "וָאוֹלֵ֥ךְ אֶתְכֶ֛ם אַרְבָּעִ֥ים שָׁנָ֖ה בַּמִּדְבָּ֑ר לֹֽא־בָל֤וּ שַׂלְמֹֽתֵיכֶם֙ מֵעֲלֵיכֶ֔ם וְנַעַלְךָ֥ לֹֽא־בָלְתָ֖ה מֵעַ֥ל רַגְלֶֽךָ׃", "onk": "וְדַבָּרִית יָתְכוֹן אַרְבְּעִין שְׁנִין בְּמַדְבְּרָא לָא בְלִיאַת כְּסוּתְכוֹן מִנְּכוֹן וּמְסָנָךְ לָא עֲדוֹ מֵעַל רַגְלָךְ:", "onk_en": "I have led you forty years in the wilderness, your garments have not worn out on you and your shoes have not worn out on your feet.", "pj": "וַהֲלִיכִית יַתְכוֹן אַרְבְּעִין שְׁנִין בְּמַדְבְּרָא לָא בָלְמוּ כְסוּתְכוֹן מֵעִילַוֵי גוּשְׁמֵיכוֹן וְסַנְדְלֵיכוֹן לָא אִיטָלְעוּ מֵעִילַוֵי רִיגְלֵיכוֹן", "pj_en": "And I have led you forty years in the wilderness; your garments have not become old upon your bodies, nor your shoes worn away from your feet.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 5, "aliyah": 7, "heb": "לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְיַ֥יִן וְשֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֙עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "לַחְמָא לָא אֲכַלְתּוּן וַחֲמַר חֲדַת וְעַתִּיק לָא שְׁתֵיתוּן בְּדִיל דְּתִדְּעוּן אֲרֵי אֲנָא יְיָ אֱלָהֲכוֹן:", "onk_en": "Bread have you not eaten, neither fresh nor aged wine have you drunk, in order that you know that I, Adonoy, am your God.", "pj": "לַחֲמָא דְעִיבּוּרָא לָא אֲכַלְתּוּן וַחֲמַר וּמֵירַת לָא שְׁתִיתוּן וַהֲוַת אוֹרַיְיתָא תְּדִירָא מִסְתְּרָא בְּמֶדְרָשֵׁיכוֹן מְטוֹל דְתִתְעַסְקוּן בָּהּ וְתִנְדְעוּן אֲרוּם אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "You have not eaten leavened bread, nor drunk wine new or old; and My law hath been diligently delivered in your schools, that you might be occupied therein, and you might know that I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 6, "aliyah": 7, "heb": "וַתָּבֹ֖אוּ אֶל־הַמָּק֣וֹם הַזֶּ֑ה וַיֵּצֵ֣א סִיחֹ֣ן מֶֽלֶךְ־חֶ֠שְׁבּ֠וֹן וְע֨וֹג מֶלֶךְ־הַבָּשָׁ֧ן לִקְרָאתֵ֛נוּ לַמִּלְחָמָ֖ה וַנַּכֵּֽם׃", "onk": "וַאֲתֵתוּן לְאַתְרָא הָדֵין וּנְפַק סִיחוֹן מַלְכָּא דְחֶשְׁבּוֹן וְעוֹג מַלְכָּא <b>דְמַתְנָן<\/b> לָקֳדָמוּתָנָא לַאֲגָחָא <b>קְרָבָא<\/b> וּמְחוֹנוּן:", "onk_en": "Then when you came to this place, Sichon, king of Cheshbon, came out—and Og, king of Boshon [<b>Masnon<\/b>]—toward us to wage war and we smote them.", "pj": "וְאָתֵיתוּן לְאַתְרָא הָדֵין וּנְפַק סִיחוֹן מַלְכָּא דְחוּשְׁבְּנָא וְעוֹג מַלְכָּא דְמַתְנָן לִקְדָמוּתָנָא לְסִדְרֵי קְרָבָא וּמְחוּנוּן", "pj_en": "And you came to this place; and Sihon king of Heshbon and Og king of Mathnan came out to meet us in battle array, and we smote them,", "tj": "", "tj_en": "", "rashi": "<b>ותבאו אל המקום הזה.<\/b> עַתָּה אַתֶּם רוֹאִים עַצְמְכֶם בִּגְדֻלָּה וְכָבוֹד, אַל תְּבַעֲטוּ בַמָּקוֹם וְאַל יָרוּם לְבַבְכֶם <b>ושמרתם את דברי הברית הזאת;<\/b> דָּ\"אַ — <b>ולא נתן ה' לכם לב לדעת<\/b> שֶׁאֵין אָדָם עוֹמֵד עַל סוֹף דַּעְתּוֹ שֶׁל רַבּוֹ וְחָכְמַת מִשְׁנָתוֹ עַד אַרְבָּעִים שָׁנָה, וּלְפִיכָךְ לֹא הִקְפִּיד עֲלֵיכֶם הַמָּקוֹם עַד הַיּוֹם הַזֶּה, אֲבָל מִכָּאן וָאֵילָךְ יַקְפִּיד, וּלְפִיכָךְ <b>ושמרתם את דברי הברית הזאת<\/b> וְגוֹ' (עבודה זרה ה'):", "rashi_en": "ותבאו אל המקום הזה AND YOU CAME TO THIS PLACE — Now you see yourselves in greatness and glory (you have defeated Sihon and Og); do not rebel against the Omnipresent nor let your hearts be proud,  ושמרתם את דברי הברית הזאת BUT KEEP THE WORDS OF THIS COVENANT. — Another explanation of AND THE LORD HAS NOT GIVEN YOU A HEART TO UNDERSTAND [UNTO THIS DAY] — for no-one can fathom the depths of his teacher’s mind nor the wisdom of his teaching until after forty years of study under him. Therefore the Omnipresent has not dealt with you so strictly until this day (after forty years’ instruction of the Torah), but from now and onward He will deal strictly with you — therefore ושמרתם את דברי הברית הזאת וגו׳ KEEP THE WORDS OF THIS COVENANT etc. (Avodah Zarah 5b)."}, {"ch": 29, "v": 7, "aliyah": 7, "heb": "וַנִּקַּח֙ אֶת־אַרְצָ֔ם וַנִּתְּנָ֣הּ לְנַחֲלָ֔ה לָראוּבֵנִ֖י וְלַגָּדִ֑י וְלַחֲצִ֖י שֵׁ֥בֶט הַֽמְנַשִּֽׁי׃", "onk": "וּנְסִבְנָא יָת אַרְעֲהוֹן וִיהָבִנַּהּ לְאַחֲסָנָא <b>לְשִׁבְטָא<\/b> דִרְאוּבֵן <b>וּלְשִׁבְטָא<\/b> דְגָד וּלְפַלְגּוּת שִׁבְטָא דִמְנַשֶּׁה:", "onk_en": "And we took the their land and gave it as territory to the [<b>tribe of the<\/b>] Reuvenites and to the [<b>tribe of the<\/b>] Gaddites, and to half the tribe of the Menashians.", "pj": "וּכְבַשְׁנָן יַת אַרְעֲהוֹן וִיהָבָנָא אַחֲסָנָא לְשֵׁיבַט רְאוּבֵן וּלְשֵׁיבַט גָד וּלְפַלְגוּת שֵׁיבַט מְנַשֶׁה", "pj_en": "and subdued their land, and gave it for an inheritance to the tribe of Reuben, Gad, and the half tribe of Menasheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 8, "aliyah": 7, "heb": "וּשְׁמַרְתֶּ֗ם אֶת־דִּבְרֵי֙ הַבְּרִ֣ית הַזֹּ֔את וַעֲשִׂיתֶ֖ם אֹתָ֑ם לְמַ֣עַן תַּשְׂכִּ֔ילוּ אֵ֖ת כׇּל־אֲשֶׁ֥ר תַּעֲשֽׂוּן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִטְּרוּן יָת פִּתְגָּמֵי קְיָמָא הָדָא וְתַעְבְּדוּן יָתְהוֹן בְּדִיל דְּתִצְלְחוּן יָת כָּל דִּי תַעְבְּדוּן:", "onk_en": "You are to guard the tenets of this covenant and fulfill them, in order that you succeed in everything that you do.’’", "pj": "וְתִנְטְרוּן יַת פִּתְגָמֵי קְיָימָא הָדָא וְתַעַבְדוּן יַתְהוֹן מִן בִּגְלַל דְתַצְלְחוּן יַת כָּל דְתַעַבְדוּן", "pj_en": "Keep, therefore, the words of this covenant and perform it, that you may have prosperity in all that you do.", "tj": "וְתִטְרוּן יַת מִילֵי שְׁבַח אוֹרַיְיתָא הָדָא וְתַעַבְדוּן יַתְהוֹן מִן בִּגְלַל דְתִתְבּוֹנְנוּן יַת כָּל מַה דְמִתְעַבְּדִין:", "tj_en": "And you shall keep the words of this covenant and perform them that you may prosper in all that you do.", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
