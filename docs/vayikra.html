b>]-offering. The <i>kohein<\/i> will atone for him, for his transgression and he will be pardoned.", "pj": "וְיַת כָּל תַּרְבֵּיהּ יַסֵיק לְמַדְבְּחָא הֵי כִתְרֵיב נִיכְסַת קוּדְשַׁיָא וִיכַפֵּר עֲלוֹי כַּהֲנָא מֵחוֹבְתֵיהּ וְיִשְׁתְּבֵיק לֵיהּ", "pj_en": "And all the fat he shall burn at the altar, as was the fat of the sanctified oblations; and the priest shall atone for him on account of his sin, and it shall be forgiven him.", "tj": "", "tj_en": "", "rashi": "<b>כחלב זבח השלמים.<\/b> כְּאוֹתָן אֵמוּרִין הַמְפֹרָשִׁים בְּעֵז הָאָמוּר אֵצֶל שְׁלָמִים:", "rashi_en": "כחלב זבח השלמים [AND HE SHALL CAUSE ALL ITS FAT TO ASCEND IN FUMES], AS THE FAT OF THE SACRIFICE OF PEACE OFFERINGS — i. e. as those fat portions which are specified in the case of the goat that is mentioned among the peace-offerings (Leviticus 3:14, 15)."}, {"ch": 4, "v": 27, "aliyah": 6, "heb": "וְאִם־נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִשְׁגָגָ֖ה מֵעַ֣ם הָאָ֑רֶץ בַּ֠עֲשֹׂתָ֠הּ אַחַ֨ת מִמִּצְוֺ֧ת יְהֹוָ֛ה אֲשֶׁ֥ר לֹא־תֵעָשֶׂ֖ינָה וְאָשֵֽׁם׃", "onk": "וְאִם אֱנַשׁ חַד יֵחוֹב בְּשָׁלוּ מֵעַמָּא דְאַרְעָא בְּמֶעְבְּדַהּ חַד מִפִּקּוּדַיָּא דַיְיָ דִּי לָא <b>כַשְׁרִין<\/b> לְאִתְעֲבָדָא וְיֵחוֹב:", "onk_en": "If a person should unwittingly sin [and he is] one of the ordinary people, by transgressing one of the commandments of Adonoy that should [<b>is<\/b>] not [<b>fitting to<\/b>] be done and he incurs guilt,", "pj": "וְאִין בַּר נַשׁ חַד יֵיחוֹב בְּשָׁלוּ מִן עַמָא דְאַרְעָא בְּמַעֲבְדֵיהּ חַד מִן פִּקוּדַיָא דַיְיָ דְלָא כַשְׁרִין לְאִתְעֲבָדָא וְיִתְחַיֵיב", "pj_en": "And if a man of the people of the land sin through ignorance in doing (against) one of the commandments of the Lord what was not right to do, and he hath sinned;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 28, "aliyah": 6, "heb": "א֚וֹ הוֹדַ֣ע אֵלָ֔יו חַטָּאת֖וֹ אֲשֶׁ֣ר חָטָ֑א וְהֵבִ֨יא קׇרְבָּנ֜וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל־חַטָּאת֖וֹ אֲשֶׁ֥ר חָטָֽא׃", "onk": "אוֹ אִתְיְדַע לֵיהּ חוֹבְתֵיהּ דִּי חָב וְיַיְתִי קֻרְבָּנֵיהּ צְפִירַת עִזִּין שְׁלֶמְתָּא נְקוּבְתָּא עַל חוֹבְתֵיהּ דִּי חָב:", "onk_en": "or, if his sin becomes known to him—which he committed. He shall bring [as] his offering an unblemished she-goat for his sin which he committed.", "pj": "אוֹ אִשְׁתְּמוֹדַע לֵיהּ חוֹבְתֵיהּ דְחַב וְיַיְתֵי יַת קוּרְבָּנֵיהּ צְפִירְתָּא דְעִזֵי שְׁלִימְתָּא מְטוֹל חוֹבְתֵיהּ דְחַב", "pj_en": "if his sin that he hath sinned be made known to him, he shall bring for his oblation an unblemished female of the goats for the sin that he hath sinned;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 29, "aliyah": 6, "heb": "וְסָמַךְ֙ אֶת־יָד֔וֹ עַ֖ל רֹ֣אשׁ הַֽחַטָּ֑את וְשָׁחַט֙ אֶת־הַ֣חַטָּ֔את בִּמְק֖וֹם הָעֹלָֽה׃", "onk": "וְיִסְמוֹךְ יָת יְדֵיהּ עַל רֵישׁ חַטָּאתָא וְיִכּוֹס יָת חַטָּאתָא בַּאֲתַר דַּעֲלָתָא:", "onk_en": "He shall lay his hand on the head of the sin-offering and slaughter the sin-offering in the [same] place as the burnt-offering.", "pj": "וְיִסְמוֹךְ יַד יְמִינֵיהּ עַל רֵישׁ חַטָאתָא וְיִכּוֹס יַת חַטָאתָא בְּאַתְרָא דַעֲלָתָא", "pj_en": "and he shall lay his right hand on the head of the sin offering and kill the sin offering at the place of burnt sacrifice;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 30, "aliyah": 6, "heb": "וְלָקַ֨ח הַכֹּהֵ֤ן מִדָּמָהּ֙ בְּאֶצְבָּע֔וֹ וְנָתַ֕ן עַל־קַרְנֹ֖ת מִזְבַּ֣ח הָעֹלָ֑ה וְאֶת־כׇּל־דָּמָ֣הּ יִשְׁפֹּ֔ךְ אֶל־יְס֖וֹד הַמִּזְבֵּֽחַ׃", "onk": "וְיִסַּב כַּהֲנָא מִדְמַהּ בְּאֶצְבְּעֵיהּ וְיִתֵּן עַל קַרְנַת מַדְבְּחָא דַעֲלָתָא וְיָת כָּל דְּמַהּ יֵשׁוֹד לִיסוֹדָא דְּמַדְבְּחָא:", "onk_en": "The <i>kohein<\/i> shall take from its blood with his finger and put it atop the corners of the altar of the burnt-offering. He shall spill all the [remaining] blood into the base of the altar.", "pj": "וְיִסַב כַּהֲנָא מִן אַדְמָא בְּאֶצְבְּעֵיהּ וְיִתֵּן עַל קַרְנַת מַדְבְּחָא דַעֲלָתָא וְיַת כָּל אַדְמָא יֵישׁוֹד לִיסוֹדָא דְמַדְבְּחָא", "pj_en": "and the priest shall take of the blood with his fingers and put it on the horns of the altar of burnt sacrifice, and pour out all the blood at the foundation of the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 31, "aliyah": 6, "heb": "וְאֶת־כׇּל־חֶלְבָּ֣הּ יָסִ֗יר כַּאֲשֶׁ֨ר הוּסַ֣ר חֵ֘לֶב֮ מֵעַ֣ל זֶ֣בַח הַשְּׁלָמִים֒ וְהִקְטִ֤יר הַכֹּהֵן֙ הַמִּזְבֵּ֔חָה לְרֵ֥יחַ נִיחֹ֖חַ לַיהֹוָ֑ה וְכִפֶּ֥ר עָלָ֛יו הַכֹּהֵ֖ן וְנִסְלַ֥ח לֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת כָּל תַּרְבַּהּ יֶעְדֵּי כְּמָא דִי מִתַּעְדָּא תְרַב מֵעַל נִכְסַת <b>קוּדְשַׁיָּא<\/b> וְיַסֵּק כַּהֲנָא לְמַדְבְּחָא <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ וִיכַפֵּר עֲלוֹהִי כַּהֲנָא וְיִשְׁתְּבֵק לֵיהּ:", "onk_en": "He shall remove all its fat in the same manner as was removed the fat from the peace[<b>sacred<\/b>]-offering. The <i>kohein<\/i> shall burn it on the altar as a pleasing fragrance to [<b>to be accepted with favor before<\/b>] Adonoy. And the <i>kohein<\/i> will atone for him and he will be pardoned.", "pj": "וְיַת כָּל תַּרְבֵּיהּ יַעֲדֵי הֵיכְמָא דְאִיתְעָדָא תְּרֵיב מֵעִלַוֵי נִכְסַת קוּדְשַׁיָא וְיִסַק כַּהֲנָא לְמַדְבְּחָא לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ וִיכַפֵּר עֲלוֹי כַּהֲנָא וְיִשְׁתְּבֵיק לֵיהּ", "pj_en": "And he shall remove all her fat, as the fat of the consecrated sacrifices was taken off, and the priest shall burn it at the altar, to be received with acceptance before the Lord; and the priest shall atone for him, and he shall be forgiven.", "tj": "", "tj_en": "", "rashi": "<b>כאשר הוסר חלב מעל זבח השלמים.<\/b> כְּאֵמוּרֵי עֵז הָאֲמוּרִים בַּשְּׁלָמִים:", "rashi_en": "כאשר הוסר הלב מעל זבח השלמים [AND HE SHALL REMOVE ALL THE FAT] AS THE FAT IS REMOVED FROM OFF THE SACRIFICE OF PEACE OFFERINGS — i.e. as the fat portions of the goat which are mentioned in the case of peace offerings (cf. previous verse)."}, {"ch": 4, "v": 32, "aliyah": 6, "heb": "וְאִם־כֶּ֛בֶשׂ יָבִ֥יא קׇרְבָּנ֖וֹ לְחַטָּ֑את נְקֵבָ֥ה תְמִימָ֖ה יְבִיאֶֽנָּה׃", "onk": "וְאִם אִימַר יַיְתִי קֻרְבָּנֵיהּ לְחַטָּאתָא נֻקְבָּא שְׁלֶמְתָּא יַיְתִנַּהּ:", "onk_en": "If he brings a sheep as his offering as a sin-offering, he shall bring an unblemished female.", "pj": "וְאִין אִימַר יַיְתֵי קוּרְבָּנֵיהּ לְחַטָאתָא נוּקְבָא שְׁלִימְתָּא יַיְתִינָהּ", "pj_en": "But if he bring a lamb as his offering for sin, he shall bring a female, unblemished;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 33, "aliyah": 6, "heb": "וְסָמַךְ֙ אֶת־יָד֔וֹ עַ֖ל רֹ֣אשׁ הַֽחַטָּ֑את וְשָׁחַ֤ט אֹתָהּ֙ לְחַטָּ֔את בִּמְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת־הָעֹלָֽה׃", "onk": "וְיִסְמוֹךְ יָת יְדֵיהּ עַל רֵישׁ חַטָּאתָא וְיִכּוֹס יָתַהּ לְחַטָּאתָא בְּאַתְרָא דִּי יִכּוֹס יָת עֲלָתָא:", "onk_en": "He shall lay his hand on the head of the sin-offering and slaughter it as a sin-offering, in the [same] place where he slaughters the burnt-offering.", "pj": "וְיִסְמוֹךְ יַד יְמִינֵיהּ עַל רֵישׁ חַטָאתָא וְיִכּוֹס יָתָהּ מְטוֹל קוּרְבַּן חַטָאתָא בְּאַתְרָא דְּיִכּוֹס יַת עֲלָתָא", "pj_en": "and lay his right hand on the head of the sin offering, and kill it as an oblation for sin, at the place of burnt sacrifice.", "tj": "", "tj_en": "", "rashi": "<b>ושחט אתה לחטאת.<\/b> שֶׁתְּהֵא שְׁחִיטָתָהּ לְשֵׁם חַטָּאת (זבחים ז'):", "rashi_en": "אותה ‎‏ושחט‎ ‎לחטאת‎ AND HE SHALL SLAUGHTER IT FOR A SIN-OFFERING — This means that its slaughtering shall be for the purpose of (with the intention of making it) a sin-offering (Zevachim 7b)."}, {"ch": 4, "v": 34, "aliyah": 6, "heb": "וְלָקַ֨ח הַכֹּהֵ֜ן מִדַּ֤ם הַֽחַטָּאת֙ בְּאֶצְבָּע֔וֹ וְנָתַ֕ן עַל־קַרְנֹ֖ת מִזְבַּ֣ח הָעֹלָ֑ה וְאֶת־כׇּל־דָּמָ֣הּ יִשְׁפֹּ֔ךְ אֶל־יְס֖וֹד הַמִּזְבֵּֽחַ׃", "onk": "וְיִסַּב כַּהֲנָא מִדְּמָא דְחַטָּאתָא בְּאֶצְבְּעֵיהּ וְיִתֵּן עַל קַרְנַת מַדְבְּחָא דַעֲלָתָא וְיָת כָּל דְּמַהּ יֵשׁוֹד לִיסוֹדָא דְּמַדְבְּחָא:", "onk_en": "The <i>kohein<\/i> shall take some blood from the sin-offering with his finger and put it atop the corners of the altar of the burnt-offering. He shall spill all its [remaining] blood into the base of the altar.", "pj": "וְיִסַב כַּהֲנָא מִן אֲדַם חַטָאתָא בְּאֶצְבְּעֵיהּ וְיִתֵּן עַל קַרְנַת מַדְבְּחָא דְעָלָתָא וְיַת כָּל אַדְמָא יֵישׁוֹד לִיסוֹדָא דְמַדְבְּחָא", "pj_en": "And the priest shall take of the blood of the sin offering, and put it upon the horns of the altar of burnt sacrifice, and pour out all the blood at the foundation of the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 35, "aliyah": 6, "heb": "וְאֶת־כׇּל־חֶלְבָּ֣הּ יָסִ֗יר כַּאֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב־הַכֶּ֘שֶׂב֮ מִזֶּ֣בַח הַשְּׁלָמִים֒ וְהִקְטִ֨יר הַכֹּהֵ֤ן אֹתָם֙ הַמִּזְבֵּ֔חָה עַ֖ל אִשֵּׁ֣י יְהֹוָ֑ה וְכִפֶּ֨ר עָלָ֧יו הַכֹּהֵ֛ן עַל־חַטָּאת֥וֹ אֲשֶׁר־חָטָ֖א וְנִסְלַ֥ח לֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת כָּל תַּרְבַּהּ יֶעְדֵּי כְּמָא דִי מִתַּעְדָּא תְרַב אִמְּרָא מִנִּכְסַת <b>קוּדְשַׁיָּא<\/b> וְיַסֵּק כַּהֲנָא יָתְהוֹן לְמַדְבְּחָא עַל <b>קֻרְבְּנַיָּא<\/b> דַיְיָ וִיכַפֵּר עֲלוֹהִי כַּהֲנָא עַל חוֹבְתֵיהּ דִּי חָב וְיִשְׁתְּבֵק לֵיהּ:", "onk_en": "He shall remove all its fat in the same manner as was removed the fat of the lamb of the peace[<b>sacred<\/b>]-offering. The <i>kohein<\/i> shall burn them on the altar on the fires [<b>offerings<\/b>] of Adonoy. The <i>kohein<\/i> will atone for him, for his sin which he committed and he will be pardoned.", "pj": "וְיַת כָּל תַּרְבָּא יַעֲדֵי הֵיכְמָא דְאִתְעֲדָא תְּרֵיב אִימַר מְנִיכְסַת קוּדְשַׁיָא וְיַסִיק יַתְהוֹן כַּהֲנָא לְמַדְבְּחָא עַל קוּרְבָּנַיָא דַיְיָ וִיכַפֵּר עֲלוֹי כַּהֲנָא עַל חוֹבְתֵיהּ דְחַב וְיִשְׁתְּבֵק לֵיהּ", "pj_en": "And all the fat he shall remove, as the fat of the lamb of the sanctified victims was removed, and the priest shall burn it at the altar with the oblations of the Lord, and the priest shall make atonement for him on account of the sin that he hath sinned, and it shall be forgiven him.", "tj": "", "tj_en": "", "rashi": "<b>כאשר יוסר חלב הכשב.<\/b> שֶׁנִּתְרַבּוּ אֵמוּרָיו בָּאַלְיָה, אַף חַטָּאת כְּשֶׁהִיא בָּאָה כִּבְשָׂה טְעוּנָה אַלְיָה עִם הָאֵמוּרִין:<br><br><b>על אשי ה'.<\/b> עַל מְדוּרוֹת הָאֵשׁ הָעֲשׂוּיוֹת לַשֵּׁם, פוא\"ייליש בְּלַעַז:", "rashi_en": "כאשר יוסר חלב הכבש [AND HE SHALL REMOVE ALL THE FAT THEREOF] AS THE FAT OF THE LAMB IS REMOVED — the fat portions of which have been augmented by the addition of the fat-tail (cf. v. 9): thus, too, does a sin-offering, whenever it is brought as she-lamb, require the fat-tail to be removed together with the other fat portions (cf. Sifra, Vayikra Dibbura d'Chovah, Chapter 11 4).<br><br>על אשי ה׳ means upon the fire-pyres which are made for the Lord; foailles in O. F."}, {"ch": 5, "v": 1, "aliyah": 6, "heb": "וְנֶ֣פֶשׁ כִּֽי־תֶחֱטָ֗א וְשָֽׁמְעָה֙ ק֣וֹל אָלָ֔ה וְה֣וּא עֵ֔ד א֥וֹ רָאָ֖ה א֣וֹ יָדָ֑ע אִם־ל֥וֹא יַגִּ֖יד וְנָשָׂ֥א עֲוֺנֽוֹ׃", "onk": "וֶאֱנַשׁ אֲרֵי יֵחוֹב וְיִשְׁמַע קַל מוֹמֵי וְהוּא סָהִיד אוֹ חֲזָא אוֹ יְדָע אִם לָא יְחַוִּי וִיקַבֵּל חוֹבֵיהּ:", "onk_en": "If a person sins, and heard an oath [demanding his testimony] [in a case where] he is a witness; [for] he either saw or knew [something relevant], if he does not testify, he will bear [the burden of] his iniquity.", "pj": "וּבַר נַשׁ אֲרוּם יֵיחוֹב וְיִשְׁמַע קַל אוֹמָאָה דִלְוָוט וְאִיהוּ סָהִיד אוֹ חָמָא חַד מֵעָלְמָא דְעָבַר עַל פִּתְגָמָא מוֹמָתָא אוֹ יְדַע בְּחַבְרֵיהּ דְבָטִיל שְׁבוּעָה וּלְוַוט אִין לָא יְחַוֵי יְקַבֵּיל חוֹבֵיהּ", "pj_en": "When a man shall have sinned, and heard the voice of the oath of execration, or have been himself a witness, or shall have seen that cue of the world hath transgressed against the words of an oath, or shall have known that his companion hath sworn or imprecated vainly, if he show it not, he shall bear his sin.", "tj": "", "tj_en": "", "rashi": "<b>ושמעה קול אלה.<\/b> בְּדָבָר שֶׁהוּא עֵד בּוֹ — שֶׁהִשְׁבִּיעוּהוּ שְׁבוּעָה, שֶׁאִם יוֹדֵעַ לוֹ בְּעֵדוּת, שֶׁיָּעִיד לוֹ (ספרא):", "rashi_en": "‎‏‎ קול האלה ‎ה‎ושמע‎ [AND IF A SOUL SIN] AND HEAR THE VOICE OF AN OATH in a matter to which he was witness, i. e. that he (the person interested in the evidence) called upon him (the witness) by an oath that if he knows any evidence favourable to him he should testify for him before the court (cf. Sifra); if he does not tell it, he bears his iniquity."}, {"ch": 5, "v": 2, "aliyah": 6, "heb": "א֣וֹ נֶ֗פֶשׁ אֲשֶׁ֣ר תִּגַּע֮ בְּכׇל־דָּבָ֣ר טָמֵא֒ אוֹ֩ בְנִבְלַ֨ת חַיָּ֜ה טְמֵאָ֗ה א֚וֹ בְּנִבְלַת֙ בְּהֵמָ֣ה טְמֵאָ֔ה א֕וֹ בְּנִבְלַ֖ת שֶׁ֣רֶץ טָמֵ֑א וְנֶעְלַ֣ם מִמֶּ֔נּוּ וְה֥וּא טָמֵ֖א וְאָשֵֽׁם׃", "onk": "אוֹ אֱנַשׁ דִּי יִקְרַב בְּכֹל מִדַּעַם מְסָאָב אוֹ בְנִבְלַת חַיְתָא מְסָאָבָא אוֹ בְּנִבְלַת בְּעִירָא מְסָאָבָא אוֹ בְּנִבְלַת רִחֲשָׁא מְסָאָב וִיהֵי מְכַסָּא מִנֵּיהּ וְהוּא מְסָאָב וְחָב:", "onk_en": "Or, if a person touches anything impure either the carcass of an impure wild animal, or the carcass of an impure animal of pasture, or the carcass of an impure creeping animal; and this [impurity] was concealed from him, he is impure and incurs guilt.", "pj": "אוֹ בַר נַשׁ דִי יִקְרַב בְּכָל מִדַעַם דִמְסָאֵיב אוֹ בְּנִיבְלַת חֵיוָא מְסָאַבְתָּא אוֹ בְּנִיבְלַת בְּעִירָא מְסָאַבְתָּא אוֹ בְּנִיבְלַת רְחֵישׁ מְסָאַב וְיִתְכַסֵי מִנֵּיהּ וְהוּא מְסָאֵב וְיִקְרַב בְּכָל קוּדְשַׁיָא וְיִתְחַיֵיב", "pj_en": "Or if a man touch anything, unclean, whether the carcase of an unclean beast, or a carcase of unclean cattle, or the carcase of an unclean reptile, and it be hidden from him, and he, being unclean, shall touch any consecrated thing, he is guilty.", "tj": "", "tj_en": "", "rashi": "<b>או נפש אשר תגע וגו'.<\/b> וּלְאַחַר הַטֻּמְאָה הַזּוֹ יֹאכַל קָדָשִׁים אוֹ יִכָּנֵס לַמִּקְדָּשׁ, שֶׁהוּא דָּבָר שֶׁזְּדוֹנוֹ כָּרֵת; בְּמַסֶּכֶת שְׁבוּעוֹת (דף י\"ד) נִדְרַשׁ כֵּן:<br><br><b>ונעלם ממנו.<\/b> הַטֻּמְאָה:<br><br><b>ואשם.<\/b> בַּאֲכִילַת קֹדֶשׁ אוֹ בְּבִיאַת מִקְדָּשׁ:", "rashi_en": "'או נפש אשר תגע וגו‎‎ OR IF A SOUL TOUCH [ANY UNCLEAN THING] etc., and after acquiring this uncleanness eats holy things or enters the Sanctuary, this being something which if done willfully is subject to the penalty of excision — thus is it explained in Treatise Shevuot 14b.<br><br>עלם ממנו‎ונ AND IT WAS HIDDEN FROM HIM — the uncleanness was hidden from him (escaped his notice, not the fact that the things he ate were holy or that the place he entered was the Sanctuary. The translation therefore is “and it — the fact that he was unclean — escaped his notice, but he actually was unclean”) (Sifra, Vayikra Dibbura d'Chovah, Chapter 13 7; cf. Shevuot 14b).<br><br>‎ם‎‎‏ואש AND HE INCUR GUILT through eating sacred food or entering the Sanctuary."}, {"ch": 5, "v": 3, "aliyah": 6, "heb": "א֣וֹ כִ֤י יִגַּע֙ בְּטֻמְאַ֣ת אָדָ֔ם לְכֹל֙ טֻמְאָת֔וֹ אֲשֶׁ֥ר יִטְמָ֖א בָּ֑הּ וְנֶעְלַ֣ם מִמֶּ֔נּוּ וְה֥וּא יָדַ֖ע וְאָשֵֽׁם׃", "onk": "אוֹ אֲרֵי יִקְרַב בְּסוֹאֲבַת אֱנָשָׁא לְכָל סוֹבְתֵיהּ דִּי יִסְתָּאַב בַּהּ וִיהֵי מְכַסָּא מִנֵּיהּ וְהוּא יָדַע וְחָב:", "onk_en": "Or, if he touches the impurities of man whatever that impurity may be that causes impurity and this [impurity] was concealed from him; [when] he realizes [he is impure], he incurs guilt.", "pj": "אוֹ אֲרוּם יִקְרַב בְּסוֹאֲבִית אֵינָשָׁא לְכָל סוֹבְתֵיהּ דְמִסְתָּאֵב בָּהּ וְיִתְכַסֵי מִנֵּיהּ וְיִקְרַב בְּכָל קוּדְשַׁיָא וּמִן בָּתַר כְּדֵין אִתְגְלֵי לֵיהּ וְאִיהוּ יָדַע דִמְסָאַב וְלָא אִידְכֵּי וְיִתְחַיֵיב", "pj_en": "Or if he touch the uncleanness of a man, even whatever uncleanness that defileth him, and it be hidden from him, and he touch anything consecrated, after that it is discovered by him, and he knoweth that he is defiled and not clean, he shall be guilty.", "tj": "", "tj_en": "", "rashi": "<b>בטמאת אדם.<\/b> זוֹ טֻמְאַת מֵת:<br><br><b>לכל טמאתו.<\/b> לְרַבּוֹת טֻמְאַת מַגַּע זָבִין וְזָבוֹת:<br><br><b>אשר יטמא.<\/b> לְרַבּוֹת הַנּוֹגֵעַ בְּבוֹעֵל נִדָּה:<br><br><b>בה.<\/b> לְרַבּוֹת בּוֹלֵעַ נִבְלַת עוֹף טָהוֹר (ספרא):<br><br><b>ונעלם.<\/b> וְלֹא יָדַע שֶׁשָּׁכַח הַטֻּמְאָה:<br><br><b>ואשם.<\/b> בַּאֲכִילַת קֹדֶשׁ אוֹ בְּבִיאַת מִקְדָּשׁ:", "rashi_en": "בטמאת אדם [OR IF HE TOUCHES] THE UNCLEANNESS OF MAN — This refers to uncleanness resulting from a corpse (i. e. it implies both touching the corpse itself or touching anyone who has come in contact with the corpse) (Sifra, Vayikra Dibbura d'Chovah, Chapter 13 8).<br><br>לכל טמאתו WHATSOEVER UNCLEANNESS OF HIM IT BE — This is intended to include in this law the uncleanness resulting from touching men or women who have a flux (and those in similar physical condition e. g. ‎'וכו‎ יולדת ‎ נדה‎) Sifra, Vayikra Dibbura d'Chovah, Chapter 13 8.<br><br>‎‏אשר יטמא‎ — these apparently redundant words are intended to include in this law one who touches a man who had intercourse with a ה‎‏נד and has not yet immersed himself (cf. Leviticus 15:24) (Sifra, Vayikra Dibbura d'Chovah, Chapter 13 8).<br><br>בה — is intended to include in this law one who swallows the carrion of a clean bird (Sifra, Vayikra Dibbura d'Chovah, Chapter 13 8).<br><br>והוא ידע … ‎ונעלם AND IT WAS HIDDEN [FROM HIM], BUT HE KNOWETH afterwards) that he had forgotten his state of uncleanness.<br><br>ואשם AND HAD INCURRED GUILT by eating sacred food or by entering the Sanctuary in this state."}, {"ch": 5, "v": 4, "aliyah": 6, "heb": "א֣וֹ נֶ֡פֶשׁ כִּ֣י תִשָּׁבַע֩ לְבַטֵּ֨א בִשְׂפָתַ֜יִם לְהָרַ֣ע&thinsp;<b>׀<\/b> א֣וֹ לְהֵיטִ֗יב לְ֠כֹ֠ל אֲשֶׁ֨ר יְבַטֵּ֧א הָאָדָ֛ם בִּשְׁבֻעָ֖ה וְנֶעְלַ֣ם מִמֶּ֑נּוּ וְהוּא־יָדַ֥ע וְאָשֵׁ֖ם לְאַחַ֥ת מֵאֵֽלֶּה׃", "onk": "אוֹ אֱנַשׁ אֲרֵי יְקַיֵּם לְפָרָשָׁא בְסִפְוָן לְאַבְאָשָׁא אוֹ לְאוֹטָבָא לְכֹל דִּי יְפָרֵשׁ אֱנָשָׁא בְּקִיּוּם וִיהֵי מְכַסָּא מִנֵּיהּ וְהוּא יָדַע וְחָב לַחֲדָא מֵאִלֵּין:", "onk_en": "Or, if a person swears, orally expressing to do harm [that he will do something which is to his detriment] or to do good [that he will do something that is to his benefit]. Regarding all a person will expresses in an oath and [that oath] was concealed from himself, when he realizes [his sin] and he incurs guilt, for any one of these [aforementioned sins].", "pj": "אוֹ בַר נַשׁ אֲרוּם יוֹמֵי לְפָרָשָׁא בְּשִׁיפְוָון לְאַבְאָשָׁא אוֹ לְאוֹטָבָא לְכָל גִוַון דִיפָרֵשׁ אֵינָשָׁא לִדְהָוֵוה וְלִדְעָתִיד לְמֵיתֵי בְּאוֹמָתָא וּמְשַׁקֵיר בֵּיהּ וְיִתְכַסֵי מִינֵיהּ וּמִבָּתַר דְעָבַד אִיתְגְלֵי לֵיהּ וְאִיהוּ יָדַע דְשַׁקָר וְלָא תַב וְאִתְחַיֵיב לַחֲדָא מִן אִילֵין", "pj_en": "Or if a man shall swear to make declaration with his lips to do evil or good upon any matter upon which a man may affirm, whether of the present or the future, that he can make declaration by oath, and he falsify therein, and it be hidden from him, but afterward it be discovered to him and he know that he hath falsified, and he repent not; though he hath become guilty in any one of these,", "tj": "לְמַבְאִישָׁא אוֹ לְמֵיטָבָא:", "tj_en": "To do evil or good", "rashi": "<b>בשפתים.<\/b> וְלֹא בַּלֵּב (שם):<br><br><b>להרע.<\/b> לְעַצְמוֹ:<br><br><b>או להיטיב.<\/b> לְעַצְמוֹ, כְּגוֹן אֹכַל וְלֹא אֹכַל, אִישַׁן וְלֹא אִישַׁן (שבועות כ\"ז):<br><br><b>לכל אשר יבטא.<\/b> לְרַבּוֹת לְשֶׁעָבַר:<br><br><b>ונעלם ממנו.<\/b> וְעָבַר עַל שְׁבוּעָתוֹ, כָּל אֵלֶּה בְּקָרְבָּן עוֹלֶה וְיוֹרֵד, כַּמְּפֹרָשׁ כָּאן, אֲבָל שְׁבוּעָה שֶׁיֵּשׁ בָּהּ כְּפִירַת מָמוֹן אֵינָהּ בְּקָרְבָּן זוֹ אֶלָּא בְּאָשָׁם:", "rashi_en": "בשפתים [OR IF A SOUL SWEAR, PRONOUNCING] WITH HIS LIPS [FOR HARM, OR FOR GOOD] — with his lips but not merely in his heart (Sifra, Vayikra Dibbura d'Chovah, Section 9 2; Shevuot 26b).<br><br>להרע TO DO HARM to himself,<br><br>או להטיב OR TO DO GOOD to himself, — as for instance, if he swears: “I shall eat” (which is להטיב), or, “I shall not eat” (להרע), “I shall sleep” (להטיב) or, “I shall not sleep” (להרע) (cf. Shevuot 27a).<br><br>לכל אשר יבטא WHATSOEVER IT BE THAT A MAN PRONOUNCETH [WITH AN OATH] whatsoever it be: — this is intended to include the case where the oath refers to something that happened in the past (e.g., he swore, “I have eaten” etc. but he has not) (Sifra, Vayikra Dibbura d'Chovah, Section 9 8; Shevuot 26a).<br><br>‎‏ונעלם ממנו AND IT BE HID FROM HIM (he forgot that he had taken such an oath) and consequently he violated his oath. — All these cases come under the law of “a sacrifice of higher or lesser value” (according to pecuniary conditions), as is set forth here (vv. 6—13): but an oath which involves the false repudiation of a claim to money does not come under the law of this sacrifice but under that of a guilt-offering (v. 25)."}, {"ch": 5, "v": 5, "aliyah": 6, "heb": "וְהָיָ֥ה כִֽי־יֶאְשַׁ֖ם לְאַחַ֣ת מֵאֵ֑לֶּה וְהִ֨תְוַדָּ֔ה אֲשֶׁ֥ר חָטָ֖א עָלֶֽיהָ׃", "onk": "וִיהֵי אֲרֵי יֵחוֹב לַחֲדָא מֵאִלֵּין וִיוַדִּי דִּי חָב עֲלַהּ:", "onk_en": "It shall be that when he incurs guilt for any of these [aforementioned sins] he shall confess that which he transgressed.", "pj": "וִיהֵי אֲרוּם יֵיחוֹב בְּחָדָא מֵאַרְבַּעֲתֵּי אִלֵין וּבָתַר כֵּן תָּהֵא וְיוֹדִי חוֹבָתָא דְחַב עֲלָהּ", "pj_en": "if he shall have (thus) sinned in any one of these four things, but afterwards repent, he shall make confession of the sin by which he hath sinned.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 6, "aliyah": 6, "heb": "וְהֵבִ֣יא אֶת־אֲשָׁמ֣וֹ לַיהֹוָ֡ה עַ֣ל חַטָּאתוֹ֩ אֲשֶׁ֨ר חָטָ֜א נְקֵבָ֨ה מִן־הַצֹּ֥אן כִּשְׂבָּ֛ה אֽוֹ־שְׂעִירַ֥ת עִזִּ֖ים לְחַטָּ֑את וְכִפֶּ֥ר עָלָ֛יו הַכֹּהֵ֖ן מֵחַטָּאתֽוֹ׃", "onk": "וְיַיְתִי יָת אַשְׁמֵיהּ <b>קֳדָם<\/b> יְיָ עַל חוֹבְתֵיהּ דִּי חָב נְקוּבְתָא מִן עָנָא אִמְּרָתָא אוֹ צְפִירַת עִזִּין לְחַטָאתָא וִיכַפֵּר עֲלוֹהִי כַּהֲנָא מֵחוֹבְתֵיהּ:", "onk_en": "He shall bring his guilt-offering to [<b>before<\/b>] Adonoy for his sin that he committed a female of the sheep, a lamb or a she-goat as a sin-offering. The <i>kohein<\/i> will atone for him, for his sin.", "pj": "וְיַיְתִי יַת קָרְבַּן אַשְׁמֵיהּ לִקְדָם יְיָ מְטוֹל חוֹבְתֵיהּ דְחַב נוּקְבָא מִן עָנָא אִימַרְתָּא אוֹ צְפִירְתָּא דְעִיזֵי לְחַטָאתָא וִיכַפֵּר עֲלוֹי כַּהֲנָא מִן חוֹבָתֵיהּ", "pj_en": "And he shall bring the oblation of his trespass offering to the Presence of the Lord for the sin that he hath sinned, a female lamb of the flock, or a kid of the goats, for a sin offering; and the priest shall atone for him (that he may be absolved) from his sin.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 7, "aliyah": 6, "heb": "וְאִם־לֹ֨א תַגִּ֣יעַ יָדוֹ֮ דֵּ֣י שֶׂה֒ וְהֵבִ֨יא אֶת־אֲשָׁמ֜וֹ אֲשֶׁ֣ר חָטָ֗א שְׁתֵּ֥י תֹרִ֛ים אֽוֹ־שְׁנֵ֥י בְנֵֽי־יוֹנָ֖ה לַֽיהֹוָ֑ה אֶחָ֥ד לְחַטָּ֖את וְאֶחָ֥ד לְעֹלָֽה׃", "onk": "וְאִם לָא תִמְטֵי יְדֵיהּ כְּמִסַּת שֵׂיתָא וְיַיְתִי יָת חוֹבְתֵיהּ דִּי חָב תַּרְתֵּין שַׁפְנִינִין אוֹ תְרֵין בְּנֵי יוֹנָה <b>קֳדָם<\/b> יְיָ חַד לְחַטָּאתָא וְחַד לַעֲלָתָא:", "onk_en": "If his means are not sufficient for [the acquisition of] a sheep, then he shall bring for his guilt-offering,—[he] who has sinned,—two turtledoves or two young pigeons to [<b>before<\/b>] Adonoy one for a sin-offering and one for a burnt-offering.", "pj": "וְאִין לָא תֶאֱרַע יְדֵיהּ כְּמֵיסַת לְמַיְיתַיָא אִימְרָא וְיַיְתֵי יַת קָרְבַּן אַשְׁמֵיהּ דְחַב תְּרֵין שַׁפְנִינִין רַבְרְבִין אוֹ תְּרֵין גוֹזְלִין בְּנֵי יוֹנַיָא קֳדָם יְיָ חַד לְחַטָאתָא וְחַד לַעֲלָתָא", "pj_en": "But if his hand find not sufficiency to bring a lamb, let him bring, as an offering for the trespass that he hath committed, two large turtle doves or two young pigeons before the Lord; one for a sin offering, and one for a burnt sacrifice.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 8, "aliyah": 6, "heb": "וְהֵבִ֤יא אֹתָם֙ אֶל־הַכֹּהֵ֔ן וְהִקְרִ֛יב אֶת־אֲשֶׁ֥ר לַחַטָּ֖את רִאשׁוֹנָ֑ה וּמָלַ֧ק אֶת־רֹאשׁ֛וֹ מִמּ֥וּל עׇרְפּ֖וֹ וְלֹ֥א יַבְדִּֽיל׃", "onk": "וְיַיְתִי יָתְהוֹן לְוָת כַּהֲנָא וִיקָרֵב יָת דִּי לְחַטָּאתָא קַדְמֵיתָא וְיִמְלוֹק יָת רֵישֵׁיהּ מִלָּקֳבֵל קְדָלֵיהּ וְלָא יַפְרֵשׁ:", "onk_en": "He shall bring them to the <i>kohein<\/i> and he shall bring that which is for a sin-offering first. He [the <i>kohein<\/i>] shall shear its head [with his fingernail] opposite of its neck, but not separate [the head] completely.", "pj": "וְיַיְתֵי יַתְהוֹן לְוַת כַּהֲנָא וְיִקְרַב יַת מַאן דְאִתְבְּחַר לְחַטָאתָא בְּשֵׁרוּייָא וְיַחֲזוֹם יַת רֵישֵׁיהּ לִקְבֵיל קוּדְלֵיהּ וְלָא יַפְרֵישׁ רֵישֵׁיהּ מִן קְדָלֵיהּ", "pj_en": "And he shall bring them to the priest, who shall offer that which he may choose for the sin offering first: and lie shall wring its head near to the spine, but not separate its head from the neck;", "tj": "", "tj_en": "", "rashi": "<b>והקריב את אשר לחטאת ראשונה.<\/b> חַטָּאת קוֹדֶמֶת לָעוֹלָה (ספרא); לְמָה הַדָּבָר דּוֹמֶה? לִפְרַקְלִיט שֶׁנִּכְנָס לְרַצּוֹת, רִצָּה פְּרַקְלִיט, נִכְנָס דּוֹרוֹן אַחֲרָיו (זבחים ז'):<br><br><b>ולא יבדיל.<\/b> אֵינוֹ מוֹלֵק אֶלָּא סִימָן אֶחָד (חולין כ\"א):<br><br><b>ערף.<\/b> הוּא גֹּבַהּ הָרֹאשׁ הַמַּשְׁפִּיעַ לְצַד הַצַּוָּאר:<br><br><b>ממול ערפו.<\/b> מוּל הָרוֹאֶה אֶת הָעֹרֶף, וְהוּא אֹרֶךְ כָּל אֲחוֹרֵי הַצַּוָּאר (שם י\"ט):", "rashi_en": "והקריב את אשר לחטאת ראשונה AND HE SHALL OFFER THAT WHICH IS FOR A SIN-OFFERING FIRST — This verse establishes the general rule that the sin-offering is always sacrificed before the burnt-offering. — To what may this be compared? To the case of an advocate (in our case the חטאת) who went in to the king to obtain pardon for his client. When the advocate has gained that pardon, then the present (עולה) is brought in after him (Zevachim 7b).<br><br>ולא יבדיל [AND HE SHALL NIP ITS HEAD …] BUT SHALL NOT SEPARATE IT — i.e. he nips only one organ (either the gullet or the windpipe) (Chullin 21a).<br><br>עורף is the surface of the head which slopes down towards the neck);<br><br>‎‏מול עורף is the part bordering on it which sees the עורף (the part next to the עורף and within sight of it) — that is, the length of the whole back of the throat (Sifra, Vayikra Dibbura d'Chovah, Chapter 18 7: Chullin 19b)."}, {"ch": 5, "v": 9, "aliyah": 6, "heb": "וְהִזָּ֞ה מִדַּ֤ם הַחַטָּאת֙ עַל־קִ֣יר הַמִּזְבֵּ֔חַ וְהַנִּשְׁאָ֣ר בַּדָּ֔ם יִמָּצֵ֖ה אֶל־יְס֣וֹד הַמִּזְבֵּ֑חַ חַטָּ֖את הֽוּא׃", "onk": "וְיַדִּי מִדְּמָא דְחַטָּאתָא עַל כֹּתֶל מַדְבְּחָא וּדְאִשְׁתָּאַר בִּדְמָא יִתִּמְצֵי לִיסוֹדָא דְמַדְבְּחָא חַטָּאתָא הוּא:", "onk_en": "He shall sprinkle some blood of the sin-offering on to the wall of the altar. And the remaining blood shall be squeezed into the base of the altar; it is a sin-offering.", "pj": "וְיַדֵי מִן אֲדַם חַטָאתָא עַל כּוֹתַל מַדְבְּחָא וּדְאִשְׁתַּיֵיר בְּאַדְמָא יִתְמְצֵי לִיסוֹדָא דְמַדְבְּחָא חַטָאתָא הוּא", "pj_en": "and he shall sprinkle some of the blood upon the side of the altar, and pour out the remainder of the blood at the foot of the altar: it is a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>והזה מדם החטאת.<\/b> בָּעוֹלָה לֹא הִטְעִין אֶלָּא מִצּוּי, וּבַחַטָּאת הַזָּאָה וּמִצּוּי, אוֹחֵז בָּעֹרֶף וּמַתִּיז, וְהַדָּם נִתָּז וְהוֹלֵךְ לַמִּזְבֵּחַ:<br><br><b>חטאת הוא.<\/b> לִשְׁמָהּ כְּשֵׁרָה, שֶׁלֹא לִשְׁמָהּ פְּסוּלָה (ספרא):", "rashi_en": "והזה מדם החטאת AND HE SHALL SPRINKLE OF THE BLOOD OF THE SIN-OFFERING [… AND THE REMAINDER OF THE BLOOD SHALL BE WRUNG OUT] — In the case of a burnt-offering of a fowl Scripture  requires only the wringing out of the blood (Leviticus 1:15), whilst in the case of the sin-offering it requires sprinkling and wringing out: standing quite near to the altar, he grasps the nape and makes the blood spurt out and thus the blood spurts forth in a jet and goes in the direction of the altar (cf. Zevachim 64b).<br><br>חטאת הוא IT IS A SIN-OFFERING — These apparently redundant words intimate: if the sprinkling and wringing of the blood are done for the purpose of (i.e. having in mind that it is) a sin-offering it is valid; if it is not done for this purpose (i.‎e. that the officiating priest has another sacrifice in mind) it is invalid (cf. Sifra, Vayikra Dibbura d'Chovah, Chapter 18 9 and Rashi on Leviticus 4:24)."}, {"ch": 5, "v": 10, "aliyah": 6, "heb": "וְאֶת־הַשֵּׁנִ֛י יַעֲשֶׂ֥ה עֹלָ֖ה כַּמִּשְׁפָּ֑ט וְכִפֶּ֨ר עָלָ֧יו הַכֹּהֵ֛ן מֵחַטָּאת֥וֹ אֲשֶׁר־חָטָ֖א וְנִסְלַ֥ח לֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיָת תִּנְיָנָא יַעְבֵּד עֲלָתָא כִּדְחָזֵי וִיכַפֵּר עֲלוֹהִי כַּהֲנָא מֵחוֹבְתֵיהּ דִּי חָב וְיִשְׁתְּבֵק לֵיהּ:", "onk_en": "He shall do (offer) the second [turtledove pigeon] as a burnt-offering, as prescribed. The <i>kohein<\/i> will atone from him, for his sin that he committed and he will be pardoned.", "pj": "וְיַת עוֹף תִּנְיָין יַעֲבֵיד עֲלָתָא הֵי כְּהִילְכַת עוֹפָא דְאִתְבְּחַר בְּשֵׁירוּיָא לְחַטָאתָא וְלָא כְּהִלְכַת חַטָאתָא דְתוֹרָא דְאִימַר בַּר עִיזֵי וִיכַפֵּר עֲלוֹי כַּהֲנָא מֵחוֹבְתֵיהּ דְחַב וְיִשְׁתְּבֵיק לֵיהּ", "pj_en": "And of the second bird he shall make a burnt sacrifice, according to the rite with the bird which he had chosen for the sin offering, and not according to the rite for the bullock, or the lamb, or the young goat. And the priest shall expiate him from the sin that he hath sinned, and it shall be forgiven him.", "tj": "", "tj_en": "", "rashi": "<b>כמשפט.<\/b> כַּדָּת הָאָמוּר בְּעוֹלַת הָעוֹף שֶׁל נְדָבָה בְּרֹאשׁ הַפָּרָשָׁה:", "rashi_en": "כמשפט [AND THE SECOND HE SHALL OFFER FOR A BURNT-OFFERING] ACCORDING TO THE REGULATION — according to the law that is mentioned with regard to a free-will burnt-offering of fowls at the beginning of the section (Leviticus 1:14) (cf. Sifra, Vayikra Dibbura d'Chovah, Chapter 18 10; Chullin 21a)."}, {"ch": 5, "v": 11, "aliyah": 7, "heb": "וְאִם־לֹא֩ תַשִּׂ֨יג יָד֜וֹ לִשְׁתֵּ֣י תֹרִ֗ים אוֹ֮ לִשְׁנֵ֣י בְנֵי־יוֹנָה֒ וְהֵבִ֨יא אֶת־קׇרְבָּנ֜וֹ אֲשֶׁ֣ר חָטָ֗א עֲשִׂירִ֧ת הָאֵפָ֛ה סֹ֖לֶת לְחַטָּ֑את לֹא־יָשִׂ֨ים עָלֶ֜יהָ שֶׁ֗מֶן וְלֹא־יִתֵּ֤ן עָלֶ֙יהָ֙ לְבֹנָ֔ה כִּ֥י חַטָּ֖את הִֽוא׃", "onk": "וְאִם לָא תַדְבֵּק יְדֵיהּ לְתַּרְתֵּין שַׁפְנִינִין אוֹ לִתְרֵין בְּנֵי יוֹנָה וְיַיְתִי יָת קֻרְבָּנֵיהּ דִּי חָב חַד מִן עַסְרָא <b>בִתְלַת סְאִין<\/b> סֻלְתָּא לְחַטָּאתָא לָא יְשַׁוִּי עֲלַהּ מִשְׁחָא וְלָא יִתֵּן עֲלַהּ לְבֻנְתָּא אֲרֵי חַטָּאתָא הִיא:", "onk_en": "If his means are not sufficient for the acquisition of two turtledoves or two young pigeons, he shall bring as his offering,—[he] who has sinned,—one tenth of an epha [<b>which is three se’in<\/b>] of fine flour as a sin-offering. He shall not put oil upon it, nor shall he place frankincense upon it, for it is a sin-offering.", "pj": "וְאִין לָא תֶאֱרַע יְדֵיהּ כְּמֵיסַת לְמַיְיתָיָא תְּרֵין שַׁפְנִינִין רַבְרְבִין אוֹ תְּרֵין גוֹזָלִין בְּנֵי יוֹנַיָא וְיַיְתֵי יַת קוּרְבָּנֵיהּ דְחַב חַד מִן עַשְרָא בִּתְלַת סְאִין סְמִידָא לְחַטָאתָא לָא יִשְׁוֵי עֲלָהּ מִשְׁחָא וְלָא יִתֵּן עֲלָהּ לְבוֹנְתָּא אֲרוּם חַטָאתָא הוּא", "pj_en": "But if his hand find not sufficiency to bring two large turtle doves or two young pigeons, let him bring as an oblation for sin a tenth part of three sein of flour for a sin offering; but let him not put oil thereon nor frankincense, for it is a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>כי חטאת הוא.<\/b> וְאֵין בַּדִּין שֶׁיְּהֵא קָרְבָּנוֹ מְהֻדָּר (מנחות ו'):", "rashi_en": "כי חטאת הוא [HE SHALL PUT NO OIL UPON IT, NEITHER SHALL HE PUT ANY FRANKINCENSE THEREON:] FOR IT IS A SIN-OFFERING — a sinner’s offering, and therefore it is not proper that his offering should be embellished by oil and frankincense (Menachot 6a)."}, {"ch": 5, "v": 12, "aliyah": 7, "heb": "וֶהֱבִיאָהּ֮ אֶל־הַכֹּהֵן֒ וְקָמַ֣ץ הַכֹּהֵ֣ן&thinsp;<small>׀<\/small>&thinsp;מִ֠מֶּ֠נָּה מְל֨וֹא קֻמְצ֜וֹ אֶת־אַזְכָּרָתָהּ֙ וְהִקְטִ֣יר הַמִּזְבֵּ֔חָה עַ֖ל אִשֵּׁ֣י יְהֹוָ֑ה חַטָּ֖את הִֽוא׃", "onk": "וְיַיְתִנַּהּ לְוָת כַּהֲנָא וְיִקְמוֹץ כַּהֲנָא מִנַּהּ מְלֵי קֻמְצֵיהּ יָת אִדְכַּרְתַּהּ וְיַסֵּק לְמַדְבְּחָא עַל <b>קֻרְבָּנַיָּא<\/b> דַיְיָ חַטָּאתָא הִיא:", "onk_en": "He shall bring it to the <i>kohein<\/i> and the <i>kohein<\/i> shall take a fistful from it [as] its memorial portion and burn it on the altar on the fires [<b>offerings<\/b>] of Adonoy; it is a sin-offering.", "pj": "וְיַיְתִינָהּ לְוַת כַּהֲנָא וְיִקְמוֹץ כַּהֲנָא מִינָהּ מְלֵי קוֹמְצֵיהּ יַת שְׁבַח אַדְכַּרְתָּא וְיִסַק לְמַדְבְּחָא עַל קוּרְבָּנַיָא דַיְיָ חַטָאתָא הוּא", "pj_en": "And he shall bring it to the priest, and the priest shall take a handful for a commendable memorial thereof, and burn it at the altar with the oblations of the Lord: it is a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>חטאת הוא.<\/b> נִקְמְצָה וְנִקְטְרָה לִשְׁמָהּ כְּשֵׁרָה, שֶׁלֹּא לִשְׁמָהּ פְּסוּלָה:", "rashi_en": "חטאת הוא IT IS A SIN-OFFERING — Here, too, the apparently redundant words intimate: if the קמץ has been taken from it and has been burnt for the purpose of (i.e. having in mind that it is) a sin-offering it is valid; if, however, this was done not for its purpose (i. e. the priest had another offering in mind when officiating) it is invalid (Sifra, Vayikra Dibbura d'Chovah, Chapter 19 9)."}, {"ch": 5, "v": 13, "aliyah": 7, "heb": "וְכִפֶּר֩ עָלָ֨יו הַכֹּהֵ֜ן עַל־חַטָּאת֧וֹ אֲשֶׁר־חָטָ֛א מֵֽאַחַ֥ת מֵאֵ֖לֶּה וְנִסְלַ֣ח ל֑וֹ וְהָיְתָ֥ה לַכֹּהֵ֖ן כַּמִּנְחָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיכַפֵּר עֲלוֹהִי כַּהֲנָא עַל חוֹבְתֵיהּ דִּי חָב מֵחֲדָא מֵאִלֵּין וְיִשְׁתְּבֵק לֵיהּ וּתְהֵי לְכַהֲנָא כְּמִנְחָתָא:", "onk_en": "The <i>kohein<\/i> will atone for him, for his sin that he committed in one of these [three] ways and he will be pardoned. [The remaining portion] shall belong to the <i>kohein<\/i> as a meal-offering.", "pj": "וִיכַפֵּר עֲלוֹי כַּהֲנָא עַל חוֹבְתֵיהּ דְחַב מֵחַד מֵאִלֵין וְיִשְׁתְּבֵיק לֵיהּ וּתְהֵי לְכַהֲנָא כְּמִנְחָתָא", "pj_en": "And the priest shall atone for his sin that he hath sinned, and it shall be forgiven him. And the remainder shall be a mincha to the priest.", "tj": "", "tj_en": "", "rashi": "<b>על חטאתו אשר חטא.<\/b> כָּאן שִׁנָּה הַכָּתוּב, שֶׁהֲרֵי בַּעֲשִׁירוּת וּבְדַלּוּת נֶאֱמַר מֵחַטָּאתוֹ, וְכָאן בְּדַלֵּי דַּלּוּת נֶאֱמַר עַל חַטָּאתוֹ, דִּקְדְּקוּ רַבּוֹתֵינוּ מִכָּאן, שֶׁאִם חָטָא כְּשֶׁהוּא עָשִׁיר וְהִפְרִישׁ מָעוֹת לְכִשְׂבָּה אוֹ שְׂעִירָה וְהֶעֱנִי, יָבִיא מִמִּקְצָתָן שְׁתֵּי תּוֹרִים, הִפְרִישׁ מָעוֹת לִשְׁתֵּי תּוֹרִים וְהֶעֱנִי, יָבִיא מִמִּקְצָתָן עֲשִׂירִית הָאֵפָה, הִפְרִישׁ מָעוֹת לַעֲשִׂירִית הָאֵפָה וְהֶעֱשִׁיר, יוֹסִיף עֲלֵיהֶן וְיָבִיא קָרְבַּן עָשִׁיר, לְכָךְ נֶאֱמַר כָּאן עַל חַטָּאתוֹ:<br><br><b>מאחת מאלה.<\/b> מֵאַחַת מִשָּׁלוֹשׁ כַּפָּרוֹת הָאֲמוּרוֹת בָּעִנְיָן — אוֹ בַּעֲשִׁירוּת אוֹ בְּדַלּוּת אוֹ בְּדַלֵּי דַּלּוּת; וּמָה תַּלְמוּד לוֹמַר? שֶׁיָּכוֹל הַחֲמוּרִים שֶׁבָּהֶם יִהְיוּ בְּכִשְׂבָּה אוֹ שְׂעִירָה, וְהַקַּלִּין יִהְיוּ בְּעוֹף, וְהַקַּלִּין שֶׁבַּקַּלִין יִהְיוּ בַּעֲשִׂירִית הָאֵפָה, תַּלְמוּד לוֹמַר מֵאַחַת מֵאֵלֶּה, לְהַשְׁווֹת קַלִּין לַחֲמוּרִין לְכִשְׂבָּה וּשְׂעִירָה אִם הִשִּׂיגָה יָדוֹ, וְאֶת הַחֲמוּרִין לַקַּלִּין לַעֲשִׂירִית הָאֵפָה בְּדַלֵּי דַּלּוּת (ספרא):<br><br><b>והיתה לכהן כמנחה.<\/b> לְלַמֵּד עַל מִנְחַת חוֹטֵא שֶׁיִּהְיוּ שְׁיָרֶיהָ נֶאֱכָלִין, זֶהוּ לְפִי פְּשׁוּטוֹ; וְרַבּוֹתֵינוּ דָּרְשׁוּ: \"וְהָיְתָה לַכֹּהֵן\" — וְאִם חוֹטֵא זֶה כֹּהֵן הוּא, תְּהֵא כִּשְׁאָר מִנְחַת נִדְבַת כֹּהֵן, שֶׁהִיא בְּכָלִיל תִּהְיֶה לֹא תֵאָכֵל (ספרא):", "rashi_en": "‎אשר חטא  על חטאתו  [AND THE PRIEST SHALL MAKE EXPIATION ON HIS BEHALF] FOR THE SIN THAT HE HATH SINNED — Here Scripture varies the expression, for in the case of affluence (v. 6) and narrow means (v. 10) it is stated, “[and the priest shall make expiation for him] מחטאתו”, whilst here, in the case of utter destitution, it is stated מחטאתו) על חטאתו may mean: something from his sin-offering, i. e., a part of it, whilst על חטאתו implies something in addition to his sin-offering)! Our Rabbis from the niceties of the text derived from here the law that if one sinned whilst he was a rich man and set apart money for a she-lamb or a she-goat (the sacrifice prescribed for a well-to-do person; cf. v. 6), but then became impoverished somewhat, he has only to bring (purchase) from a part of it (the money) two turtledoves (or two young pigeons, the offering prescribed for the poor) and may retain the balance for his own use: if, being a poor mạn, he has set apart money for two turtledoves and then was reduced to even greater poverty, he has only to bring from a part of it a tenth of an ephah of flour; hence the use of the word מחטאתו in the sense explained above. If, on the other hand, being only of moderate means, he has set apart money only for a tenth of an ephah of flour, but became rich afterwards, he must add to it and bring the offering prescribed for a rich man. For this reason it is stated here על חטאתו — in addition to what was intended for his sin-offering (Keritot 27b).<br><br>מאחת מאלה [AND THE PRIEST SHALL MAKE EXPIATION FOR HIM] BY MEANS OF ONE OF THESE — i. e. by means of one of the three expiating sacrifices mentioned in this section: either by means of the offering prescribed for affluence or by that for poverty or by that for utter destitution (i. e., in the case of the offerings brought for each of the three sins mentioned above (vv. 1, 2—3 and 4) the offering must be brought according to the circumstances of the wrong-doer). But why is this stated? (i. e., why does it not merely state‎ אשר חטא ונסלח לו ‎ חטאתו הכהן על  ‎וכפר עליו‎  since the different sacrifices have been mentioned previously)? But Scripture uses this term “by means of one of these”, because I might think that the most serious sins amongst them (i. e. those mentioned in vv. 2—3, which, if done wilfully, are subject to the penalty of כרת) should be atoned for by a she-lamb or a she-goat: the lighter ones (v. 1) by a fowl, and the lightest of all (v. 4) by a tenth part of an ephah of flour! Scripture, however, states, “[and he shall make expiation for him] by one of these” — in order to put on the same level the light sins with the most serious with regard to the duty of offering a she-lamb or a she-goat, if he (the offender) possesses the means. And, on the other hand, to put on the same level the most serious sins with the lighter in respect to the duty of bringing a tenth part of an ephah of flour as an offering in case of utter destitution (Sifra, Vayikra Dibbura d'Chovah, Chapter 19 10).<br><br>והיתה לכהן כמנחה AND IT SHALL BE THE PRIEST’S, JUST AS A MEAL-OFFERING — This is intended to teach with regard to the meal-offering of a sinner (i. e. a meal-offering brought as an expiation for the sins mentioned above) that what is left of it after the קמץ has been burnt may be eaten by the priests just as the remains of the free-will offering (cf. Leviticus 2:3). This is what the statement means according to its literal sense. Our Rabbis, however, explained והיתה לכהן to imply: that if this sinner be a priest, then it shall be as any other meal-offering brought as a free-will offering by a priest which comes under the law: (Leviticus 6:16) “[For every meal-offering of the priest] shall be wholly burnt; it shall not be eaten”. (The words are to be construed thus:והיתה לכהן, but if it be a priest’s, כמנחה then it shall be exactly like any voluntary meal-offering that he brings) (cf. Sifra, Vayikra Dibbura d'Chovah, Chapter 19 11; Menachot 73b)."}, {"ch": 5, "v": 14, "aliyah": 7, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 15, "aliyah": 7, "heb": "נֶ֚פֶשׁ כִּֽי־תִמְעֹ֣ל מַ֔עַל וְחָֽטְאָה֙ בִּשְׁגָגָ֔ה מִקׇּדְשֵׁ֖י יְהֹוָ֑ה וְהֵבִיא֩ אֶת־אֲשָׁמ֨וֹ לַֽיהֹוָ֜ה אַ֧יִל תָּמִ֣ים מִן־הַצֹּ֗אן בְּעֶרְכְּךָ֛ כֶּֽסֶף־שְׁקָלִ֥ים בְּשֶֽׁקֶל־הַקֹּ֖דֶשׁ לְאָשָֽׁם׃", "onk": "אֱנַשׁ אֲרֵי <b>יְשַׁקַּר<\/b> שְׁקַר וְיֵחוֹב בְּשָׁלוּ מִקוּדְשַׁיָּא דַיְיָ וְיַיְתִי יָת אַשְׁמֵיהּ <b>קֳדָם<\/b> יְיָ דְכַר שְׁלִים מִן עָנָא בְּפֻרְסָנֵיהּ כְּסַף <b>סִלְעִין<\/b> בְּסִלְעֵי קוּדְשָׁא לַאֲשָׁמָא:", "onk_en": "If a person wrongfully deviates [<b>lies<\/b>] and unwittingly sins [by using the] sacred property of Adonoy, he shall bring his guilt-offering to [<b>before<\/b>] Adonoy, an unblemished ram, from the sheep, based on the valuation of holy silver shekalim [<b>selaim<\/b>], for a guilt-offering.", "pj": "בַּר נַשׁ אֲרוּם יְשַׁקֵר שְׁקַר וְיֵיחוֹב בְּשָׁלוּ וְיִתְהֲנִי מִן קוּדְשַׁיָא דַיְיָ וְיַיְתֵי יַת קוּרְבַּן אַשְׁמֵיהּ לִקְדָם יְיָ דְכַר שְׁלִים מִן עֲנָא בְּעִילוּיָיהּ כְּסַף הֵי כִּדְמֵי הַיְנִית קוּדְשָׁא דְאִתְהֲנֵי סִילְעִין בְּסִלְעֵי קוּדְשָׁא לְקָרְבַּן אֲשָׁמָא", "pj_en": "When a man falsifieth with falsity and sinneth, though with inadvertence, in making misuse of the holy things of the Lord, he shall bring the oblation for his trespass to the presence of the Lord, an unblemished ram from the flock, with an estimation in silver according to the value of the holy thing which hath been misappropriated, in shekels, after the shekels of the sanctuary, for a trespass offering.", "tj": "", "tj_en": "", "rashi": "<b>כי תמעל מעל.<\/b> אֵין מְעִילָה בְּכָל מָקוֹם אֶלָּא שִׁנּוּי, וְכֵן הוּא אוֹמֵר וַיִּמְעֲלוּ בֵאלֹהֵי אֲבֹתֵיהֶם וַיִּזְנוּ אַחֲרֵי אֱלֹהֵי עַמֵּי הָאָרֶץ (דהי\"א ה'), וְכֵן הוּא אוֹמֵר בְּסוֹטָה וּמָעֲלָה בוֹ מָעַל (במדבר ה'):<br><br><b>וחטאה בשגגה מקדשי ה'.<\/b> שֶׁנֶּהֱנָה מִן הַהֶקְדֵּשׁ; וְהֵיכָן הֻזְהַר? נֶאֱמַר כָּאן חֵטְא, וְנֶאֱמַר לְהַלָּן חֵטְא בִּתְרוּמָה, וְלֹא יִשְֹאוּ עָלָיו חֵטְא (ויקרא כ\"ב), מַה לְּהַלָּן הִזְהִיר, אַף כָּאן הִזְהִיר; אִי מַה לְּהַלָּן לֹא הִזְהִיר אֶלָּא עַל הָאוֹכֵל, אַף כָּאן לֹא הִזְהִיר אֶלָּא עַל הָאוֹכֵל, תַּ\"לֹ תִמְעֹל מַעַל — רִבָּה (ספרא):<br><br><b>מקדשי ה'.<\/b> הַמְיֻחָדִים לַשֵּׁם, יָצְאוּ קָדָשִׁים קַלִּים (שם):<br><br><b>איל.<\/b> לְשׁוֹן קָשֶׁה, כְּמוֹ וְאֶת אֵילֵי הָאָרֶץ לָקָח (יחזקאל י\"ז), אַף כָּאן קָשֶׁה — בֶּן שְׁתֵּי שָׁנִים (ספרא):<br><br><b>בערכך כסף שקלים.<\/b> שֶׁיְּהֵא שָׁוֶה שְׁתֵּי סְלָעִים:", "rashi_en": "כי תמעל מעל — The term מעל everywhere in Scripture denotes “changing”. Similarly it stales, (I Chronicles 5:25) “And they committed a מעל against the God of their fathers; for they went a whoring after the gods of the people of the land” (i. e. they exchanged Him for their gods). And similarly it states of the faithless wife, (Numbers 5:12) “[If any man’s wife go aside] and commit a מעל in respect to him” (i. e. she changes her relationship to him for one to another man) (Sifra, Vayikra Dibbura d'Chovah, Section 11 1; Meilah 18a).<br><br>‎'‎‎וחטאה כשגגה מקדשי ה‎‎ AND SIN IN ERROR, CONCERNING THE HOLY THINGS OF THE LORD — i. e. that one has derived some benefit from (made use of) a holy thing. And where is this prohibited, that Scripture should describe it here as sin? But the expression חטא is mentioned here and חטא is mentioned further on in the case of misuse of תרומה (Leviticus 22:9): “[They — the priests — shall therefore keep my charge] not to eat תרומה when they are in a state of uncleanness: (see Rashi thereon), lest they bear sin (חטא) for it”. How is it there? Scripture forbids it! (See Rashi on Leviticus 22:10). So here, too, by the term וחטאה it forbids it. (The translation is therefore: If a person commit a מעל, whereby it would be sinning even though it be in error). But if you should argue that the analogy may be put thus: How is it there? Scripture imposes the prohibition only upon one who would eat Terumah, so, too, here it imposes a prohibition only upon one who would eat of sacred things (‎וחטאה … ‎'מקדשי ה‎)! But Scripture uses here the double expression: תמעל מעל, and thereby it enlarges the scope of the prohibition to include a benefit (הנאה) of any description (Sifra, Vayikra Dibbura d'Chovah, Section 11 2; Meilah 18b).<br><br>מקדשי ה׳ CONCERNING THE HOLY THINGS OF THE LORD — i.e. those which are specially assigned to the Lord; therefore sacrifices holy in a minor degree are excluded from this law (Sifra, Vayikra Dibbura d'Chovah, Chapter 20 1).<br><br>איל is an expression for “strong”, “mighty”, as in (Ezekiel 17:13) “he hath also taken the mighty of (אילי) the land”.Here, too, איל means a ram which has grown strong, i. e. one two years old (Sifra, Vayikra Dibbura d'Chovah, Chapter 20 6; cf. Rashi on Genesis 31:38).<br><br>בערכך כסף שקלים WITH THE VALUATION IN SHEKELS OF SILVER — This (the plural שקלים) implies that it must have the value of at least two shekels (cf. Keritot 10b)."}, {"ch": 5, "v": 16, "aliyah": 7, "heb": "וְאֵ֣ת אֲשֶׁר֩ חָטָ֨א מִן־הַקֹּ֜דֶשׁ יְשַׁלֵּ֗ם וְאֶת־חֲמִֽישִׁתוֹ֙ יוֹסֵ֣ף עָלָ֔יו וְנָתַ֥ן אֹת֖וֹ לַכֹּהֵ֑ן וְהַכֹּהֵ֗ן יְכַפֵּ֥ר עָלָ֛יו בְּאֵ֥יל הָאָשָׁ֖ם וְנִסְלַ֥ח לֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת דִּי חָב מִן קוּדְשָׁא יְשַׁלֵּם וְיָת חֻמְשֵׁיהּ יוֹסֵף עֲלוֹהִי וְיִתֵּן יָתֵיהּ לְכַהֲנָא וְכַהֲנָא יְכַפֵּר עֲלוֹהִי בְּדִכְרָא דַאֲשָׁמָא וְיִשְׁתְּבֵק לֵיהּ:", "onk_en": "That which he sinned [making use] of the sacred property, he shall pay for and add an additional fifth to that [amount] and give it to the <i>kohein.<\/i> The <i>kohein<\/i> will atone for him with the guilt-offering ram and he will be pardoned.", "pj": "וְיַת הַנְיַית קוּדְשָׁא דְחַב מִן קוּדְשָׁא יַשְׁלִים וְיַת חוּמְשֵׁיהּ דְדָמוֹי יוֹסִיף עֲלוֹי וְיִתֵּן יָתֵיהּ לְכַהֲנָא וּבְרַם כַּהֲנָא יְכַפֵּר עֲלוֹי בְּדִיכְרָא דַאֲשָׁמָא וְיִשְׁתְּבֵיק לֵיהּ", "pj_en": "And the misuse of the holy thing by which he sinned, (the perversion of what was) sanctified, he shall make good, and shall add the fifth of its value unto it, and bring it to the priest who shall atone for him with the ram of the trespass offering, and it shall be forgiven him.", "tj": "", "tj_en": "", "rashi": "<b>ואת אשר חטא מן הקדש ישלם.<\/b> קֶרֶן וְחֹמֶשׁ לַהֶקְדֵּשׁ:", "rashi_en": "הקדש ישלם‎ מן ‎חטא‎‎ אשר‎ ואת‎  AND FOR THAT WHEREIN HE HATH SINNED IN THE HOLY THING HE SHALL PAY both the principal and the additional fifth to the Temple treasury (cf. Keritot 26b)."}, {"ch": 5, "v": 17, "aliyah": 7, "heb": "וְאִם־נֶ֙פֶשׁ֙ כִּ֣י תֶֽחֱטָ֔א וְעָֽשְׂתָ֗ה אַחַת֙ מִכׇּל־מִצְוֺ֣ת יְהֹוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְלֹֽא־יָדַ֥ע וְאָשֵׁ֖ם וְנָשָׂ֥א עֲוֺנֽוֹ׃", "onk": "וְאִם אֱנַשׁ אֲרֵי יֵחוֹב וְיַעְבֵּד חֲדָא מִכָּל פִּקּוֹדַיָּא דַיְיָ דִּי לָא <b>כָשְׁרִין<\/b> לְאִתְעֲבָדָא וְלָא יָדַע וְיֵחוֹב וִיקַבֵּל חוֹבֵיהּ:", "onk_en": "If a person sins and did [transgress] one of the commandments of Adonoy that should [<b>is<\/b>] not [<b>fitting to<\/b>] be done, [however,] he is uncertain [that he sinned], and he [nevertheless] incurs guilt and will bear [the burden of] his iniquity.", "pj": "וְאִין בַּר נַשׁ אֲרוּם יֵיחוּב וְיַעֲבֵד חֲדָא מִכָּל פִּקוּדַיָיא דַיְיָ דְלָא כַשְׁרִין לְאִתְעוֹבָדָא וְלָא יְדַע וְאִתְחַיֵיב וִיקַבֵּל חוֹבֵיהּ", "pj_en": "If a man sin, and do against any one of all the commandments of the Lord that which is not right to do, though he knew it not, he hath sinned, and shall bear his guilt;", "tj": "", "tj_en": "", "rashi": "<b>ולא ידע ואשם, והביא.<\/b> הָעִנְיָן הַזֶּה מְדַבֵּר בְּמִי שֶׁבָּא סְפֵק כָּרֵת לְיָדוֹ וְלֹא יָדַע אִם עָבַר עָלָיו אִם לָאו, כְּגוֹן חֵלֶב וְשֻׁמָּן לְפָנָיו, וּכְסָבוּר שְׁתֵּיהֶן הֶתֵּר וְאָכַל אֶת הָאֶחָד, אָמְרוּ לוֹ אַחַת שֶׁל חֵלֶב הָיְתָה, וְלֹא יָדַע אִם זוֹ שֶׁל חֵלֶב אָכַל, הֲרֵי זֶה מֵבִיא אָשָׁם תָּלוּי, וּמֵגֵן עָלָיו כָּל זְמַן שֶׁלֹּא נוֹדַע לוֹ שֶׁוַּדַּאי חָטָא, וְאִם נוֹדַע לוֹ לְאַחַר זְמַן, יָבִיא חַטָּאת (כריתות כ\"ב):<br><br><b>ולא ידע ואשם ונשא עונו.<\/b> רַבִּי יוֹסֵי הַגְּלִילִי אוֹמֵר, הֲרֵי הַכָּתוּב עָנַשׁ אֶת מִי שֶׁלֹּא יָדַע, עַל אַחַת כַּמָּה וְכַמָּה שֶׁיַּעֲנִישׁ אֶת מִי שֶׁיָּדַע, רַבִּי יוֹסֵי אוֹמֵר, אִם נַפְשְׁךָ לֵידַע מַתַּן שְֹכָרָן שֶׁל צַדִּיקִים, צֵא וּלְמַד מֵאָדָם הָרִאשׁוֹן שֶׁלֹּא נִצְטַוָּה אֶלָּא עַל מִצְוַת לֹא תַעֲשֶׂה וְעָבַר עָלֶיהָ, רְאֵה כַּמָּה מִיתוֹת נִקְנְסוּ עָלָיו וּלְדוֹרוֹתָיו. וְכִי אֵיזוֹ מִדָּה מְרֻבָּה שֶׁל טוֹבָה אוֹ שֶׁל פֻּרְעָנוּת? הֱוֵי אוֹמֵר מִדָּה טוֹבָה, אִם מִדַּת פֻּרְעָנוּת מְעוּטָה, רְאֵה כַּמָּה מִיתוֹת נִקְנְסוּ לוֹ וּלְדוֹרוֹתָיו, מִדָּה טוֹבָה הַמְרֻבָּה הַיּוֹשֵׁב לוֹ מִן הַפִּגּוּלִין וְהַנּוֹתָרוֹת וְהַמִּתְעַנֶּה בְּיוֹם הַכִּפּוּרִים — עַאַכַּ\"וְ שֶׁיִּזְכֶּה לוֹ וּלְדוֹרוֹתָיו וּלְדוֹרוֹת דּוֹרוֹתָיו עַד סוֹף כָּל הַדּוֹרוֹת; רַבִּי עֲקִיבָא אוֹמֵר, הֲרֵי הוּא אוֹמֵר עַל פִּי שְׁנַיִם עֵדִים אוֹ שְׁלֹשָׁה וְגוֹ' (דברים י\"ז), אִם מִתְקַיֶּמֶת הָעֵדוּת בִּשְׁנַיִם, לָמָּה פֵּרֵט לְךָ הַכָּתוּב ג'? אֶלָּא לְהָבִיא שְׁלִישִׁי לְהַחֲמִיר עָלָיו וְלַעֲשׂוֹת דִּינוֹ כַּיּוֹצֵא בָּאֵלּוּ לְעִנְיַן עֹנֶשׁ בַּהֲזָמָה; אִם כָּךְ עָנַשׁ הַכָּתוּב לַנִּטְפָּל לְעוֹבְרֵי עֲבֵרָה כְּעוֹבְרֵי עֲבֵרָה, עַל אַחַת כַּמָּה וְכַמָּה שֶׁיְּשַׁלֵּם שָֹכָר טוֹב לַנִּטְפָּל לְעוֹשֵׂי מִצְוָה כְּעוֹשֵׂי מִצְוָה (סנהדרין ט'); רַבִּי אֶלְעָזָר בֶּן עֲזַרְיָה אוֹמֵר, כִּי תִקְצֹר קְצִירְךָ בְשָׂדֶךָ וְשָׁכַחְתָּ עֹמֶר בַּשָּׂדֶה הֲרֵי הוּא אוֹמֵר לְמַעַן יְבָרֶכְךָ וְגוֹ' (דברים כ\"ד) — קָבַע הַכָּתוּב בְּרָכָה לְמִי שֶׁבָּאת עַל יָדוֹ מִצְוָה בְּלֹא יָדַע — אֱמֹר מֵעַתָּה, הָיְתָה סֶלַע צְרוּרָה בִּכְנָפָיו וְנָפְלָה הֵימֶנּוּ וּמְצָאָהּ הֶעָנִי וְנִתְפַּרְנֵס בָּהּ, הֲרֵי הַקָּבָּ\"ה קוֹבֵעַ לוֹ בְּרָכָה (ספרא):", "rashi_en": "ולא ידע ואשם … והביא [AND IF A SOUL SIN, AND DO ANY OF THESE THINGS WHICH SHOULD NOT BE DONE …] AND HE DOES NOT DISCOVER THAT HE IS GUILTY … HE SHALL BRING [A RAM … FOR A GUILT OFFERING] — This paragraph (vv. 17—19) is speaking of a person to whom there has occurred a כרת ‎ספק (i. e. it is speaking of a person who is doubtful whether he has inadvertently committed an act of such a character as to be punishable with כרת if done willfully), and he does not know whether he has actually committed a sinful act or not. For instance: חלב (fat forbidden to be eaten under the penalty of כרת) and permitted fat (שומן) lay before him, and he believed that both were permissible food (i. e. that both were שומן), and he ate one of them. Afterwards, however, people told him that one of these was חלב, but he does not know whether he had eaten that which was חלב. Then such a one has to bring an אשם תלוי (the guilt-offering for a doubtful sin, lit., the guilt-offering in suspense, from תלה to “be in suspense”); and this protects him against punishment so long as he does not become cognisant that he has undoubtedly sinned, and if he becomes cognisant of this after a time he has to bring a sin-offering (cf. Keritot 22b, 23a).<br><br> ‎ו אשם ונשא עונו‎‎ולא ידע  AND HE DOES NOT DISCOVER THAT HE IS GUILTY, AND BEARETH HIS INIQUITY — R. José the Galilean said, “See, Scripture (God) punishes him who has no sure knowledge that he has sinned (in as much as it requires him to bring a guilt-offering); how much the more does it follow that He will punish him who does know that he is sinning and yet wilfully does it. — R. José said, “If you wish to know the reward prepared for the righteous, go and learn from the case of Adam Horishon, who was charged only with a negative command (not to eat from the עץ הדעת) and who transgressed it, — see how many kinds of death-penalties were on this account decreed as a punishment against himself and all his descendants! Now, which measure is greater, — that of good (of reward), or that of punishment? You must admit that it is that of reward (cf. Rashi on Exodus 20:6). If, then, the measure of punishment is the lesser, consider that if so many kinds of death-penalties were decreed as a punishment against himself and his descendants, surely, in the case of the measure of good which is the greater one, if a person refrains from eating sacrifices which have become abominable (פגול) or which have been left over beyond the prescribed time (נותר), or if he fasts on Yom Kippur, how much the more certain is it that he will acquire merit for himself and for his descendants and the descendants of his descendants until the end of all generations! — R. Akiba said, “See, it states, (Deuteronomy 19:15) “at the mouth of two witnesses, or, at the mouth of three witnesses [shall the matter be established]. — But if evidence can be established by two witnesses, why does Scripture afterwards specifically state that this may be done by three? But it is to bring the third witness under the law there stated — to be severe with him and to make his sentence exactly like that of these (the first two witnesses) in respect to punishment in case of “plotting” (evidence that is rebutted by proof that the witness was not present on the occasion to which he has testified; see Rashi on Deuteronomy 19:16). Now, if Scripture exacts punishment so severely from one who has only joined himself with sinners (he is so described because as a single witness he could not hope that his evidence would be effective), just as it does from the sinners themselves, how much the more certain is it that He will give a reward to him who attaches himself to those who practise meritorious deeds just as it does to those who themselves practise meritorious deeds! (Sanhedrin 9a; Makkot 5b). — R. Eleazar b. Azariah said: In Deuteronomy (24:19) Scripture states, “When thou reapest thy harvest in thy field, and hast forgotten a sheaf in the field, [thou shalt not return to take it; it shall be for the stranger, for the fatherless etc.]”, and, you see, it states immediately afterwards: “that the Lord thy God may bless thee etc.” Scripture (God) thus gives the assurance of a blessing to one through whom a meritorious deed came about (the feeding of the stranger, etc.), without himself knowing about it (since he forgot to remove the sheaf from the field)! You must now admit that if a Sela was tied up in the skirt of one’s garment and it fell from it and a poor man finds it and supports himself by it the Holy One, blessed be He gives the assurance of a blessing to him (to the man who has lost the Sela) (Sifra, Vayikra Dibbura d'Chovah, Section 12 7-13)."}, {"ch": 5, "v": 18, "aliyah": 7, "heb": "וְ֠הֵבִ֠יא אַ֣יִל תָּמִ֧ים מִן־הַצֹּ֛אן בְּעֶרְכְּךָ֥ לְאָשָׁ֖ם אֶל־הַכֹּהֵ֑ן וְכִפֶּר֩ עָלָ֨יו הַכֹּהֵ֜ן עַ֣ל שִׁגְגָת֧וֹ אֲשֶׁר־שָׁגָ֛ג וְה֥וּא לֹֽא־יָדַ֖ע וְנִסְלַ֥ח לֽוֹ׃", "onk": "וְיַיְתִי דְּכַר שְׁלִים מִן עָנָא בְּפֻרְסָנֵיהּ לַאֲשָׁמָא לְוָת כַּהֲנָא וִיכַפֵּר עֲלוֹהִי כַהֲנָא עַל שָׁלוּתֵיהּ דְּאִשְׁתְּלִי וְהוּא לָא יָדַע וְיִשְׁתְּבֵק לֵיהּ:", "onk_en": "He shall bring an unblemished ram, from the sheep, based on the valuation as a guilt-offering, to the <i>kohein.<\/i> The <i>kohein<\/i> will atone for him, for the error which he did unintentionally, and he did not know, and he will be pardoned.", "pj": "וְיַיְתֵי דְכַר שְׁלִים מִן עָנָא בְּעִילוֹיֵי לְאַשְׁמָא לְוַת כַּהֲנָא וִיכַפֵּר עֲלוֹי כַּהֲנָא עַל שָׁלוּתֵיהּ דְאִישְׁתְּלֵי וְהוּא לָא יְדַע וְחַב וְיִשְׁתְּבֵיק לֵיהּ", "pj_en": "but (when he hath discovered it), let him bring a ram unblemished from the flock according to his estimation for a trespass offering unto the priest; and the priest shall atone for him for the ignorance with which he erred ignorantly and sinned, and it shall be forgiven him.", "tj": "", "tj_en": "", "rashi": "<b>בערכך לאשם.<\/b> בָּעֵרֶךְ הָאָמוּר לְמַעְלָה:<br><br><b>אשר שגג והוא לא ידע.<\/b> הָא אִם יָדַע לְאַחַר זְמַן, לֹא נִתְכַּפֵּר לוֹ בְּאָשָׁם זֶה עַד שֶׁיָּבִיא חַטָּאת, הָא לְמָה זֶה דּוֹמֶה? לְעֶגְלָה עֲרוּפָה שֶׁנִּתְעָרְפָה וְאַחַר כָּךְ נִמְצָא הַהוֹרֵג, הֲרֵי זֶה יֵהָרֵג (שם):", "rashi_en": "‎ לאשם  בערכך  [HE SHALL BRING A RAM …] ACCORDING TO THE VALUATION FOR A GUILT OFFERING — i. e. according to the value stated above (v. 15, viz., at least 2 shekels).<br><br>‎ידע‎ והוא לא‎‎ אשר שגג  [AND THE PRIEST SHALL MAKE EXPIATION FOR HIM CONCERNING HIS ERROR] WHEREIN HE ERRED AND DISCOVERED IT NOT — Consequently if it came to his knowledge after a time that he has sinned, he is not atoned for by this guilt-offering which he has already bought, but remains unatoned until he brings a sin-offering. To what may this be compared? To the law of the Heifer whose neck was to be broken (as a kind of expiation when it was unknown who has committed the murder) when, on some particular occasion, its neck was actually broken and the murderer was afterwards found — when he surely has to be put to death (Sifra, Vayikra Dibbura d'Chovah, Chapter 21 2)."}, {"ch": 5, "v": 19, "aliyah": 7, "heb": "אָשָׁ֖ם ה֑וּא אָשֹׁ֥ם אָשַׁ֖ם לַיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲשָׁמָא הוּא עַל חוֹבְתֵיהּ <b>דְּהוּא חָב אֲשָׁמָא יְקָרֵב<\/b> קֳדָם יְיָ:", "onk_en": "It is a guilt-offering [for] he certainly incurred guilt [<b>for his sin which he committed he shall bring a guilt-offering<\/b>] before Adonoy.", "pj": "קוּרְבַּן אַשְׁמָא הוּא כָּל דְאִתְחַיֵיב לְקָרְבַּן אַשְׁמָא יַיְתֵי קוּרְבַּן לְאַשְׁמָא לִשְׁמֵיהּ דַיְיָ עַל חוֹבְתֵיהּ דְחָב", "pj_en": "It is an oblation for trespass. Whosoever hath become guilty, a trespass oblation let him bring, an oblation for trespass unto the Name of the Lord, for the sin that he hath sinned.", "tj": "", "tj_en": "", "rashi": "<b>אשם הוא אשם אשם.<\/b> הָרִאשׁוֹן כֻּלּוֹ קָמוּץ, שֶׁהוּא שֵׁם דָּבָר, וְהָאַחֲרוֹן חֶצְיוֹ קָמָץ וְחֶצְיוֹ פַּתָּח שֶׁהוּא לְשׁוֹן פָּעַל; וְאִם תֹּאמַר מִקְרָא שֶׁלֹּא לְצֹרֶךְ הוּא, כְּבָר דָּרוּשׁ הוּא בְּתוֹרַת כֹּהֲנִים, <b>אשם אשם<\/b> — לְהָבִיא אֲשַׁם שִׁפְחָה חֲרוּפָה שֶׁיְּהֵא אַיִל בֶּן שְׁתֵּי סְלָעִים, יָכוֹל שֶׁאֲנִי מְרַבֶּה אֲשַׁם נָזִיר וַאֲשַׁם מְצֹרָע, תַּלְמוּד לוֹמַר הוּא (שם):", "rashi_en": "אשם הוא אשם אשם — The first of these similar words is entirely (i. e. both syllables) punctuated with Kametz because it is a noun, whilst the last is punctuated half with Kametz and half with Patach, because it expresses the idea “he has done something” (i. e. it is a verb in the Kal, 3rd person masc. sing, perfect). — And if you say, surely this is a verse that is unnecessary, since it has stated in the previous verse, “he shall bring the ram for a guilt-offering”, then I reply that it has already been expounded in Torath Cohanim as follows; אשם אשם — this repetition is intended to include in the law of אשם תלוי also the אשם שפחה חרופה (the guilt-offering for dishonouring a maid-servant betrothed to another man; cf. Leviticus 19:12), viz., that it must be a ram of the value of two Sela’im. One might think that I include also the guilt-offering brought by a Nazarite (cf. Numbers 6:12) and the guilt-offering brought by a leper (cf. Leviticus 14:12)! Scripture, however, states “הוא” (Sifra, Vayikra Dibbura d'Chovah, Chapter 21 7)."}, {"ch": 5, "v": 20, "aliyah": 7, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 21, "aliyah": 7, "heb": "נֶ֚פֶשׁ כִּ֣י תֶחֱטָ֔א וּמָעֲלָ֥ה מַ֖עַל בַּיהֹוָ֑ה וְכִחֵ֨שׁ בַּעֲמִית֜וֹ בְּפִקָּד֗וֹן אֽוֹ־בִתְשׂ֤וּמֶת יָד֙ א֣וֹ בְגָזֵ֔ל א֖וֹ עָשַׁ֥ק אֶת־עֲמִיתֽוֹ׃", "onk": "אֱנַשׁ אֲרֵי יֵחוֹב וִישַׁקַּר <b>שְׁקַר קֳדָם<\/b> יְיָ וִיכַדֵב בְּחַבְרֵיהּ בּפִקְּדוֹנָא אוֹ בְשֻׁתָּפוּת יְדָא אוֹ בִגְזֵלָא אוֹ אַנִּיס יָת חַבְרֵיהּ:", "onk_en": "If a person sins and wrongfully deviates [<b>lies<\/b>] from [<b>before<\/b>] Adonoy and denies to his friend the possession of a keepsake placed in his trust or, a deposit [regarding money that was loaned or in partnership,] or theft [claiming that something was stolen,] or, oppressed [he withheld wages from] his friend.", "pj": "בַּר נַשׁ אֲרוּם יֵיחוֹב וְיִשְׁקַר שִׁיקְרִין לְשׁוּם מֵימְרָא דַיְיָ וְיִכְפּוֹר בְּחַבְרֵיהּ בְּפִקְדוֹנָא דְאַפְקֵיד גַבֵּיהּ אוֹ בְּשׁוּתָּפוּת יְדָא אוֹ בִגְזוֹלָא אוֹ דְיִטְלוֹם יַת חַבְרֵיהּ", "pj_en": "When a man sinneth and falsifieth with falsehoods unto the Name of the Word of the Lord, or denieth to his neighbour the deposit which hath been deposited with him, whether in partnership of hands, or by rapine, or reckless dealing with his neighbour;", "tj": "", "tj_en": "", "rashi": "<b>נפש כי תחטא.<\/b> אָמַר רַבִּי עֲקִיבָא, מַה תַּ\"ל וּמָעֲלָה מַעַל בַּה'? לְפִי שֶׁכָּל הַמַּלְוֶה וְהַלֹּוֶה וְהַנּוֹשֵֹׁא וְהַנּוֹתֵן אֵינוֹ עוֹשֶׂה אֶלָּא בְּעֵדִים וּבִשְׁטָר, לְפִיכָךְ בִּזְמַן שֶׁהוּא מְכַחֵשׁ, מְכַחֵשׁ בָּעֵדִים וּבַשְּׁטָר, אֲבָל הַמַּפְקִיד אֵצֶל חֲבֵרוֹ אֵינוֹ רוֹצֶה שֶׁתֵּדַע בּוֹ נְשָׁמָה אֶלָּא שְׁלִישִׁי שֶׁבֵּינֵיהֶם, לְפִיכָךְ כְּשֶׁהוּא מְכַחֵשׁ מְכַחֵשׁ בַּשְּׁלִישִׁי שֶׁבֵּינֵיהֶם (שם):<br><br><b>בתשומת יד.<\/b> שֶׁשָּׂם בְּיָדוֹ מָמוֹן לְהִתְעַסֵּק אוֹ בְּמִלְוֶה:<br><br><b>או בגזל.<\/b> שֶׁגָּזַל מִיָּדוֹ כְּלוּם:<br><br><b>או עשק.<\/b> הוּא שְֹכַר שָֹכִיר (שם):", "rashi_en": "ונפש כי תחטא IF A SOUL SIN [AND COMMIT FAITHLESSNESS AGAINST THE LORD] — R. Akiba said, What is the force of  ‎‎‎מעל בה׳‎‎ ומעלה  here, where it does not speak of betraying “holy things of the Lord” as in v. 15, but of betraying one’s neighbour? Because whoever lends or borrows money or does business with another, does it as a rule only in the presence of witnesses or by a document, therefore when he repudiates the matter, he repudiates the witnesses or the document; but he who deposits something with his neighbour does not wish any living soul to know about it except the Third Being (God) who is between them; therefore when he repudiates the deposit, he is repudiating the Third Being who is between them (Sifra, Vayikra Dibbura d'Chovah, Chapter 22 4).<br><br>בתשומת יד A CHARGE — He denies that he has put (שָׂם) money into his (the neighbour’s) hand (יד, i. e. that he has put money at his disposal) for the purpose of doing business in partnership or as a loan (cf. Onkelos and Sifra, Vayikra Dibbura d'Chovah, Chapter 22 6).<br><br>או בגזל OR A THING TAKEN AWAY BY VIOLENCE — He denies that he has violently taken something from his possession,<br><br>או עשק OR HATH WRONGED [HIS NEIGHBOUR] — This refers to withholding the wages of a hired man (cf. Leviticus 19:13; see also Sifra, Vayikra Dibbura d'Chovah, Chapter 22 6 and Bava Kamma 103b)."}, {"ch": 5, "v": 22, "aliyah": 7, "heb": "אֽוֹ־מָצָ֧א אֲבֵדָ֛ה וְכִ֥חֶשׁ בָּ֖הּ וְנִשְׁבַּ֣ע עַל־שָׁ֑קֶר עַל־אַחַ֗ת מִכֹּ֛ל אֲשֶׁר־יַעֲשֶׂ֥ה הָאָדָ֖ם לַחֲטֹ֥א בָהֵֽנָּה׃", "onk": "אוֹ אַשְׁכַּח אֲבֵדְתָּא וִיכַדֵּב בַּהּ וְאִשְׁתְּבַע עַל שִׁקְרָא עַל חֲדָא מִכֹּל דִּי יַעְבֵּד אֱנָשָׁא לְמֵיחַב בְּהֵן:", "onk_en": "Or, if he found a lost item and denies it and swears falsely in any of all these [aforementioned instances], whatever someone will do to sin in these instances.", "pj": "אוֹ אַשְׁכַּח אֲבִדְתָּא וְיִכְפּוֹר בָּהּ וְאִשְׁתְּבַע עַל שִׁיקְרָא עַל חַדָא מִכָּל דְיַעֲבֵיד אֵינָשָׁא לְאִתְחַיָיבָא בְּהוֹן", "pj_en": "or if he find a thing that hath been lost and denieth it, and sweareth falsely about any one of all these by which a mail in doing them shall become guilty,", "tj": "", "tj_en": "", "rashi": "<b>וכחש בה.<\/b> שֶׁכָּפַר <b>על אחת מכל<\/b> אֵלֶּה <b>אשר יעשה האדם לחטא<\/b> וּלְהִשָּׁבַע עַל שֶׁקֶר לִכְפִירַת מָמוֹן:", "rashi_en": "וכחש בה AND DENIETH IT — i.e. that he denies על אחת מכל REGARDING ONE OF ALL these things (those mentioned above), אשר יעשה האדם לחטא THAT A MAN DOETH (is apt to do, cf. Numbers 5:7, said of a similar case ‎מכל חטאת האדם)  TO SIN and to swear falsely with the object of repudiating a money claim."}, {"ch": 5, "v": 23, "aliyah": 7, "heb": "וְהָיָה֮ כִּֽי־יֶחֱטָ֣א וְאָשֵׁם֒ וְהֵשִׁ֨יב אֶת־הַגְּזֵלָ֜ה אֲשֶׁ֣ר גָּזָ֗ל א֤וֹ אֶת־הָעֹ֙שֶׁק֙ אֲשֶׁ֣ר עָשָׁ֔ק א֚וֹ אֶת־הַפִּקָּד֔וֹן אֲשֶׁ֥ר הׇפְקַ֖ד אִתּ֑וֹ א֥וֹ אֶת־הָאֲבֵדָ֖ה אֲשֶׁ֥ר מָצָֽא׃", "onk": "וִיהֵי אֲרֵי יֶחֱטֵי וְיֵחוֹב וְיָתֵב יָת גְּזֵלָא דִּי גְזַל אוֹ יָת עֻשְׁקָא דִּי עֲשַׁק אוֹ יָת פִּקְּדוֹנָא דִּי אִתְפָּקַּד לְוָתֵיהּ אוֹ יָת אֲבֵדְתָּא דִּי אַשְׁכַּח:", "onk_en": "It shall be that when he [realizes his] sin and incurs guilt, he shall return the stolen property that he stole, or, the wages that he withheld or, whatever keepsake that was placed in his trust or, the lost item which he found.", "pj": "וִיהֵי אִין יֵיחְטֵי וְיִתְחַיֵיב וְיוֹמֵי וִיתִיב יַת גְזוֹלָא דְגָזַל אוֹ יַת עֵצְיָא דִי עֲצָא אוֹ יַת פִּקְדוֹנָא דִי אִתְפַּקֵיד גַבֵּיהּ אוֹ יַת אַבֵדְתָּא דְאַשְׁכַּח", "pj_en": "he who shall thus transgress, and sin, and swear, shall restore what he hath robbed with robbery or injured by injury, or the deposit that was deposited with him, or the lost thing which he had found,", "tj": "אוֹ עֲצָה יַת חַבְרֵיהּ:", "tj_en": "Or shall be contumacious (or slanderous) with his neighbor;", "rashi": "<b>כי יחטא ואשם.<\/b> כְּשֶׁיַּכִּיר בְּעַצְמוֹ לָשׁוּב בִּתְשׁוּבָה, וּבְדַעְתּוֹ לְהִתְוַדּוֹת כִּי חָטָא וְאָשֵׁם:", "rashi_en": "יחטא ואשם‎‎ כי‎ means when he comes to a recognition of himself (recognises his duty) to repent of his sin and makes up his mind to confess that he has sinned and has incurred guilt)."}, {"ch": 5, "v": 24, "aliyah": 7, "heb": "א֠וֹ מִכֹּ֞ל אֲשֶׁר־יִשָּׁבַ֣ע עָלָיו֮ לַשֶּׁ֒קֶר֒ וְשִׁלַּ֤ם אֹתוֹ֙ בְּרֹאשׁ֔וֹ וַחֲמִשִׁתָ֖יו יֹסֵ֣ף עָלָ֑יו לַאֲשֶׁ֨ר ה֥וּא ל֛וֹ יִתְּנֶ֖נּוּ בְּי֥וֹם אַשְׁמָתֽוֹ׃", "onk": "אוֹ מִכֹּל דִּי יִשְׁתְּבַע עֲלוֹהִי לְשִׁקְרָא וִישַׁלֵּם יָתֵיהּ בְּרֵישֵׁיהּ וְחֻמְשֵׁיהּ יוֹסֵף עֲלוֹהִי לְדִי הוּא דִילֵיהּ יִתְּנִנֵּיהּ בְּיוֹמָא דְחוֹבְתֵיהּ:", "onk_en": "Or, anything about which he will swear falsely. He shall pay its price and add an additional fifth to that [amount] to whomever that object belongs he shall give it on the day of his guilt-offering.", "pj": "אוֹ מִכָּל מִדַעַם דְאִשְׁתְּבַע עֲלוֹי לְשִׁיקְרָא וְיַשְׁלִים יָתֵיהּ בְּרֵישֵׁיהּ וְחוֹמֶשׁ דְמוֹי יוֹסֵף עֲלוֹי לְמָרֵיהּ וְהוּא דִילֵיהּ יִתְּנִינָהּ בְּיוֹמָא דִתְהָא עַל חוֹבְתֵיהּ", "pj_en": "or whatsoever about which he had sworn with falsehood, he shall make good in the capital, and shall add a fifth of its value thereto, and deliver it to its owner on the day that he maketh penance for his sin.", "tj": "", "tj_en": "", "rashi": "<b>בראשו.<\/b> הוּא הַקֶּרֶן, רֹאשׁ הַמָּמוֹן:<br><br><b>וחמשתיו.<\/b> רִבְּתָה הַתּוֹרָה חֲמִישִׁיּוֹת הַרְבֵּה לְקֶרֶן אַחַת, שֶׁאִם כָּפַר בַּחֹמֶשׁ וְנִשְׁבַּע וְהוֹדָה, חוֹזֵר וּמֵבִיא חֹמֶשׁ עַל אוֹתוֹ חֹמֶשׁ, וְכֵן מוֹסִיף וְהוֹלֵךְ עַד שֶׁיִּתְמַעֵט הַקֶּרֶן הַנִּשְׁבָּע לוֹ פָּחוֹת מִשָּׁוֶה פְּרוּטָה (בבא קמא ק\"ג):<br><br><b>לאשר הוא לו.<\/b> לְמִי שֶׁהַמָּמוֹן שֶׁלּוֹ (שם):", "rashi_en": "בראשו — This means the principal — the capital (ראש) money.<br><br>וחמשתיו [AND HE SHALL ADD] THE FIFTH PART [MORE THERETO) — By using the plural וחמשתיו the Torah includes in this law of restitution the many additional fifths possible in respect to one principal — that if he denies the fifth (i. e. he asserts that he has repaid both capital and fifth, but has not really paid the latter, for which a claim is now made against him) and takes an oath that he has paid it, but afterwards admits the claim, then he must now bring (pay) a fifth in addition to this fifth (a fifth of the original fifth which now has become the קרן in addition to it), and so he keeps on adding a fifth to the original fifth until the principal about which he takes an oath becomes less in value than a P’rutah (Sifra, Vayikra Dibbura d'Chovah, Section 13 12; Bava Kamma 103a).<br><br>לאשר הוא לו [AND HE SHALL ADD THE FIFTH PART MORE THERETO AND GIVE IT] UNTO HIM TO WHOM IT APPERTAINETH — i. e. to him whose is the money (Sifra, Vayikra Dibbura d'Chovah, Section 13 12; Bava Kamma 108; also Bava Kamma 103a)."}, {"ch": 5, "v": 25, "aliyah": 7, "heb": "וְאֶת־אֲשָׁמ֥וֹ יָבִ֖יא לַיהֹוָ֑ה אַ֣יִל תָּמִ֧ים מִן־הַצֹּ֛אן בְּעֶרְכְּךָ֥ לְאָשָׁ֖ם אֶל־הַכֹּהֵֽן׃", "onk": "וְיָת אַשְׁמַהּ יַיְתִי לָקֳדָם יְיָ דְּכַר שְׁלִים מִן עָנָא בְּפֻרְסָנֵיהּ לַאֲשָׁמָא לְוָת כַּהֲנָא:", "onk_en": "He shall bring his guilt-offering to [<b>before<\/b>] Adonoy an unblemished ram, from the sheep based on the valuation, as a guilt-offering to the <i>kohein.<\/i>", "pj": "וְיַת קוּרְבַּן אֲשָׁמֵיהּ יַיְתֵי לִקְדָם יְיָ דְכַר שְׁלִים מִן עָנָא בְּעִילוּיָיהּ לְאַשְׁמָא לְוַת כַּהֲנָא", "pj_en": "And he shall bring an oblation for his trespass to the presence of the Lord; a male unblemished from the flock, according to its estimation for the trespass, (shall he bring) unto the priest.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 26, "aliyah": 7, "heb": "וְכִפֶּ֨ר עָלָ֧יו הַכֹּהֵ֛ן לִפְנֵ֥י יְהֹוָ֖ה וְנִסְלַ֣ח ל֑וֹ עַל־אַחַ֛ת מִכֹּ֥ל אֲשֶֽׁר־יַעֲשֶׂ֖ה לְאַשְׁמָ֥ה בָֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיכַפֵּר עֲלוֹהִי כַהֲנָא <b>קֳדָם<\/b> יְיָ וְיִשְׁתְּבֵק לֵיהּ עַל חֲדָא מִכֹּל דִּי יַעְבֵּד לְמֵיחַב בַּהּ:", "onk_en": "The <i>kohein<\/i> will atone for him before Adonoy and he will be pardoned for anything that he will do through which guilt incurs.", "pj": "וִיכַפֵּר עֲלוֹי כַּהֲנָא קֳדָם יְיָ וְיִשְׁתְּבֵיק לֵיהּ עַל חֲדָא מִכּל דְיַעֲבֵיד לְאִתְחַיֵיב בָּהּ", "pj_en": "And the priest shall atone for him before the Lord, and it shall be forgiven him concerning any one of all these which he may have done and become guilty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
