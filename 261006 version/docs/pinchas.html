<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פרשת פנחס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>פרשת פנחס</h1>
    <div class="icon-btns">
      <button class="icon-btn" id="exportBtn" aria-label="ייצוא קטעים מסומנים">📤</button>
      <button class="icon-btn" id="offlineBtn" aria-label="שמירה לקריאה ללא אינטרנט">✈️</button>
      <button class="icon-btn" id="fontBtn" aria-label="הגדרות גופן">Aa</button>
      <button class="icon-btn" id="themeBtn" aria-label="החלף ערכת צבעים">🌓</button>
    </div>
  </div>
  <div class="offline-tip" id="offlineTip">
    לשמירה לקריאה בלי אינטרנט (למשל לפני טיסה): בכרום, לחצו על התפריט (⋮)
    למעלה ובחרו <b>הורדה</b> — הדף יישמר ויהיה זמין גם בלי חיבור.

    <div class="export-row">
      <button class="export-btn" id="copyBtn">העתק ללוח</button>
      <button class="export-btn" id="downloadBtn">הורד כקובץ</button>
    </div>
    <div class="export-msg" id="exportMsg"></div>
  </div>
  <div class="topnav">
    <a class="idx" href="index.html">⌂ כל הפרשות</a>
    <a href="chukat-balak.html">‹ Chukat-Balak</a>
    <a href="matot-masei.html">Matot-Masei ›</a>
  </div>
  <p class="subtitle">Numbers 25:10 – 30:1 · מתוך ספריית ספריא</p>
  <div class="chips">
    <button class="chip chip-onk" data-key="onk" data-on="true">אונקלוס</button>
    <button class="chip chip-pj" data-key="pj" data-on="true">יונתן (פסבדו)</button>
    <button class="chip chip-yer" data-key="yer" data-on="true">ירושלמי</button>
    <button class="chip chip-rashi" data-key="rashi" data-on="false">רש״י</button>
    <button class="chip chip-en" data-key="en" data-on="false">English</button>
    <button class="chip chip-bm" data-key="bm" data-on="false">★ מסומנים</button>
  </div>
  <div class="panel" id="panel">
    <div class="panel-row">
      <span class="panel-label">גופן</span>
      <select id="fontSelect">
        <option value="'David Libre', serif">David Libre (ברירת מחדל, קריא)</option>
        <option value="'Frank Ruhl Libre', serif">Frank Ruhl Libre (אחיד עם הפסוק)</option>
        <option value="'Noto Sans Hebrew', sans-serif">Noto Sans (ללא תגים, הכי ברור)</option>
        <option value="'Noto Rashi Hebrew', serif">Noto Rashi (כתב רש״י מסורתי)</option>
      </select>
    </div>
    <div class="panel-row">
      <span class="panel-label">גודל טקסט</span>
      <div class="size-stepper">
        <button class="size-btn" id="sizeDown">א-</button>
        <button class="size-btn" id="sizeUp">א+</button>
      </div>
    </div>
  </div>
  <div class="pos-indicator" id="posIndicator"></div>
  <div class="chapter-nav" id="chapterNav"></div>
  <div class="aliyah-nav" id="aliyahNav"></div>
</header>
<div id="spacer"></div>
<main id="main"></main>
<footer>נוצר אוטומטית · Pinchas · 2027-07-24</footer>

<script>
const SLUG = "pinchas";
const DATA = [{"ch": 25, "v": 10, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying.", "pj": "וידבר יי וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "AND the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 11, "aliyah": 1, "heb": "פִּֽינְחָ֨ס<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז נהוג לכתוב פִּֽ<small>י<\/small>נְחָ֨ס ביו״ד זעירא)<\/i> בֶּן־אֶלְעָזָ֜ר בֶּן־אַהֲרֹ֣ן הַכֹּהֵ֗ן הֵשִׁ֤יב אֶת־חֲמָתִי֙ מֵעַ֣ל בְּנֵֽי־יִשְׂרָאֵ֔ל בְּקַנְא֥וֹ אֶת־קִנְאָתִ֖י בְּתוֹכָ֑ם וְלֹא־כִלִּ֥יתִי אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל בְּקִנְאָתִֽי׃", "onk": "פִּינְחָס בַּר אֶלְעָזָר בַּר אַהֲרֹן כַּהֲנָא אֲתֵב יָת חֵימְתִי מֵעַל בְּנֵי יִשְׂרָאֵל בִּדְקַנֵּי יָת קִנְאָתִי בֵּינֵיהוֹן וְלָא שֵׁיצֵיתִי יָת בְּנֵי יִשְׂרָאֵל בְּקִנְאָתִי:", "onk_en": "“Pinchas, the son of Elozor, [and grand] son of Aharon the <i>kohein,<\/i> has turned My anger away from Bnei Yisroel by his vengeance for Me among them, so that I did not destroy Bnei Yisroel in My vengeance.", "pj": "פִּנְחָס קַנָאָה בַּר אֶלְעָזָר בַּר אַהֲרן כַּהֲנָא אָתֵיב יַת רִתְחִי מֵעַל בְּנֵי יִשְרָאֵל בִּזְמַן דְקַנֵי יַת קִנְאָתָא וְקָטִיל חַיָיבָא דְבֵינֵיהוֹן וְאַמְטוּלֵיהּ לָא שֵׁיצְיַית יַת בְּנֵי יִשְרָאֵל בְּקִנְאָתִי", "pj_en": "Phinehas the zealous, the son of Elazar bar Aharon, the priest, hath turned away mine anger from the children of Israel, in that, when zealous with My zeal, he hath slain the sinners who were among them; and for his sake I have not destroyed the children of Israel in My indignation.", "tj": "", "tj_en": "", "rashi": "<b>פינחס בן אלעזר בן אהרן הכהן.<\/b> לְפִי שֶׁהָיוּ הַשְּׁבָטִים מְבַזִּים אוֹתוֹ — הַרְאִיתֶם בֶּן פּוּטִי זֶה שֶׁפִּטֵּם אֲבִי אִמּוֹ עֲגָלִים לַעֲ\"זָ וְהָרַג נְשִׂיא שֵׁבֶט מִיִּשְׂרָאֵל? לְפִיכָךְ בָּא הַכָּתוּב וְיִחֲסוֹ אַחַר אַהֲרֹן (סנהדרין פ\"ב):<br><br><b>בקנאו את קנאתי.<\/b> בְּנָקְמוֹ אֶת נִקְמָתִי — בְּקָצְפּוֹ אֶת הַקֶּצֶף שֶׁהָיָה לִי לִקְצֹף; כָּל לְשׁוֹן קִנְאָה הוּא הַמִּתְחָרֶה לִנְקֹם נִקְמַת דָּבָר, אנפרט\"מנט בְּלַעַ\"ז:", "rashi_en": "פינחס בן אלעזר בן אהרן הכהן PHINEAS THE SON OF ELEAZAR THE SON OF AARON THE PRIEST — Because the tribes spoke disparagingly of him, saying, “Have you seen this grandson of Puti the father of whose mother used to fatten (פטם) calves for idolatrous sacrifices (see Exodus 6:25 that Eleazar his father had married a daughter of Putiel who is identified with Jethro; see Rashi on that verse and Exodus 18:1), and he has dared to slay a prince of one of Israel’s tribes!”, therefore Scripture comes and connects his genealogy with Aaron (Sanhedrin 82b).<br><br>בקנאו את קנאתי means “when he executed my vengeance” (more lit., when he avenged my avenging) — when he displayed the anger that I should have displayed. The expression קנאה always denotes glowing with anger to execute vengeance for a thing; in O. F. emportment (cf. Rashi on 11:29)."}, {"ch": 25, "v": 12, "aliyah": 1, "heb": "לָכֵ֖ן אֱמֹ֑ר הִנְנִ֨י נֹתֵ֥ן ל֛וֹ אֶת־בְּרִיתִ֖י שָׁלֽוֹם<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בספרי ספרד ואשכנז וי״ו קטיעא)<\/i>׃", "onk": "בְּכֵן אֱמַר הָא אֲנָא <b>גְזַר<\/b> לֵיהּ יָת קְיָמִי שְׁלָם:", "onk_en": "Therefore tell [him], that I give [<b>decree for<\/b>] him My covenant [of] peace.", "pj": "בִּשְׁבוּעָא אֵימַר לֵיהּ מִן שְׁמִי הָאֲנָא גָזַר לֵיהּ יַת קְיָמִי שְׁלַם וְאַעְבְּדִינֵיהּ מַלְאָךְ קְיַים וְיֵיחֵי לְעַלְמָא לִמְבַשְרָא גְאוּלְתָּא בְּסוֹף יוֹמַיָא", "pj_en": "Swearing by My Name, I say to him, Behold, I decree to him My covenant of peace, and will make him an angel of the covenant, that he may ever live, to announce the Redemption at the end of the days.", "tj": "בִּשְׁבוּעָא אֲזִיל משֶׁה וַאֲמַר לְפִינְחָס הָא אֲנָא יְהַב לֵיהּ:", "tj_en": "With the oath went Mosheh, and said unto Phinehas, Behold, I give to him.", "rashi": "<b>את בריתי שלום.<\/b> שֶׁתְּהֵא לוֹ לִבְרִית שָׁלוֹם, כְּאָדָם הַמַּחֲזִיק טוֹבָה וְחַנּוֹת לְמִי שֶׁעוֹשֶׂה עִמּוֹ טוֹבָה, אַף כָּאן פֵּרֵשׁ לוֹ הַקָּבָּ\"ה שְׁלוֹמוֹתָיו:", "rashi_en": "את בריתי שלום [I GIVE TO HIM] MY COVENANT — PEACE — This means: I give him my covenant that it should be to him as a covenant of peace; just like a man who shows gratitude and friendliness to one who has done him a kindness. So here, too, the Holy One, blessed be He, expressed to him His peaceful feelings towards him."}, {"ch": 25, "v": 13, "aliyah": 1, "heb": "וְהָ֤יְתָה לּוֹ֙ וּלְזַרְע֣וֹ אַחֲרָ֔יו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽאלֹהָ֔יו וַיְכַפֵּ֖ר עַל־בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּתְהֵי לֵיהּ וְלִבְנוֹהִי בַתְרוֹהִי קְיַם כְּהֻנַּת עֳלָם חֲלַף דִּי קַנֵּי <b>קֳדָם<\/b> אֱלָהֵיהּ וְכַפַּר עַל בְּנֵי יִשְׂרָאֵל:", "onk_en": "It shall be for him and his descendants after him a covenant of eternal <i>kehunah<\/i> because he was zealous for [<b>before<\/b>] his God and made atonement for Bnei Yisroel.”", "pj": "וְחוֹלַף דְחַסְדוֹהִי לְמֵימָר הֲלָא בַּר פּוּטִי מִדְיָנָאָה הוּא הָא אֲנָא מְיַחְסִינֵיהּ לִכְהוּנְתָּא רַבְּתָא וְחוֹלַף דְאָחַד רוּמְחָא בִּדְרָעֵיהּ וּמְחָא לְמִדְיָנֵיתָא לְבֵית בַּהֲתַת קֵיבְתָהּ וְצַלֵי בְּפוּמֵיהּ עַל עַמָא בֵּית יִשְרָאֵל יִזְכּוּן כַּהֲנַיָא לִתְלַת מַתְּנָן דְרוֹעָא וְלָעָא וְקֵיבְתָא וּתְהֵי לֵיהּ וְלִבְנוֹי בַּתְרוֹי קְיַים רְבוּת עֲלָם חוֹלַף דְקַנֵי לֶאֱלָהֵיהּ וְכַפֵּר עַל בְּנֵי יִשְרָאֵל", "pj_en": "And because they defamed him, saying, Is he not the son of Phuti, the Midianite? behold, I will make him to possess the high priesthood; and because he took the lance with his arm, and struck the Midianitess in her body, and prayed with his mouth for the people of the house of Israel, the priests shall be held worthy of the three gifts of the shoulder, the cheek-bone, and the inwards; and it shall be to him, and to his sons after him, an everlasting covenant of consecration, because he was zealous for the Lord, and propitiated for the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>והיתה לו.<\/b> בְרִיתִי זֹאת:<br><br><b>ברית כהנת עולם.<\/b> שֶׁאַף עַל פִּי שֶׁכְּבָר נִתְּנָה כְהֻנָּה לְזַרְעוֹ שֶׁל אַהֲרֹן, לֹא נִתְּנָה אֶלָּא לְאַהֲרֹן וּלְבָנָיו שֶׁנִּמְשְׁחוּ עִמּוֹ וּלְתוֹלְדוֹתֵיהֶן שֶׁיּוֹלִידוּ אַחַר הַמְשָׁחָתָן, אֲבָל פִּינְחָס שֶׁנּוֹלַד קֹדֶם לָכֵן וְלֹא נִמְשַׁח לֹא בָא לִכְלַל כְּהֻנָּה עַד כָּאן; וְכֵן שָׁנִינוּ בִזְבָחִים (דף ק\"א) לֹא נִתְכַּהֵן פִּינְחָס עַד שֶׁהֲרָגוֹ לְזִמְרִי:<br><br><b>לאלהיו.<\/b> בִּשְׁבִיל אֱלֹהָיו, כְּמוֹ \"הַמְקַנֵּא אַתָּה לִי\" (במדבר י\"א), \"וְקִנֵּאתִי לְצִיּוֹן\" (זכריה ח') — בִּשְׁבִיל צִיּוֹן:", "rashi_en": "והיתה לו AND IT SHALL BE UNTO HIM —  this covenant of Mine shall be unto him —<br><br>‎ברית כהנת עולם A COVENANT OF AN EVERLASTING PRIESTHOOD — for although the priesthood had already been given to Aaron’s descendants (cf. Exodus 28:40-41), it was given only to Aaron and his sons who had been anointed together with him and to their offspring whom they might beget after they had been anointed. But Phineas who had been born prior to that and had not been anointed, had not as yet attained the status of priesthood until now. So, too, do we read in Zevachim 101b: Phineas did not become a priest until he had slain Zimri.<br><br>לאלהיו means [HE WAS ZEALOUS] FOR THE SAKE OF HIS GOD, just as, (Numbers 11:29) “Are you zealous for My sake (לי)?” and (Zechariah 8:2) “I am zealous לציון\", i.e., for Zion’s sake."}, {"ch": 25, "v": 14, "aliyah": 1, "heb": "וְשֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַמֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת־הַמִּדְיָנִ֔ית זִמְרִ֖י בֶּן־סָל֑וּא נְשִׂ֥יא בֵֽית־אָ֖ב לַשִּׁמְעֹנִֽי׃", "onk": "וְשׁוּם גַּבְרָא בַר יִשְׂרָאֵל קְטִילָא דִּי אִתְקְטֵל עִם מִדְיָנֵיתָא זִמְרִי בַּר סָלוּא רַב בֵּית אַבָּא לְבֵית שִׁמְעוֹן:", "onk_en": "The name of the slain Israelite man, who was killed along with the Midianite woman, was Zimri, son of Salu, leader of a paternal house of Shimon.", "pj": "וְשׁוּם גַבְרָא בַּר יִשְרָאֵל קְטִילָא דְאִתְקְטֵיל עִם מִדְיָינֵיתָא זִמְרִי בַּר סָלוּא רַב בֵּית אַבָּא לְשֵׁבֶט שִׁמְעוֹן", "pj_en": "Now the name of the man of Israel who was slain with the Midianitha was Zimri bar Salu, a chief of the house of his fathers of the tribe of Shemeon.", "tj": "", "tj_en": "", "rashi": "<b>ושם איש ישראל וגו'.<\/b> בְּמָקוֹם שֶׁיִּחֵס אֶת הַצַּדִּיק לְשֶׁבַח, יִחֵס אֶת הָרָשָׁע לִגְנַאי (תנחומא):<br><br><b>נשיא בית אב לשמעני.<\/b> לְאֶחָד מֵחֲמֵשֶׁת בָּתֵּי אָבוֹת שֶׁהָיוּ לְשֵׁבֶט שִׁמְעוֹן; דָּ\"אַ — לְהוֹדִיעַ שִׁבְחוֹ שֶׁל פִּינְחָס, שֶׁאַף עַל פִּי שֶׁזֶּה הָיָה נָשִׂיא, לֹא מָנַע אֶת עַצְמוֹ מִלְּקַנֵּא לְחִלּוּל הַשֵּׁם, לְכָךְ הוֹדִיעֲךָ הַכָּתוּב מִי הוּא הַמֻּכֶּה:", "rashi_en": "ושם איש ישראל וגו׳ AND THE NAME OF THE ISRAELITE [WHO WAS SMITTEN] — Wherever it gives the genealogy of a good man in praise of him, it gives the genealogy of a bad man mentioned in the same story to disparage him (Midrash Tanchuma, Pinchas 2).<br><br>נשיא בית אב לשמעני A PRINCE OF A FATHER’S HOUSE AMONGST THE SIMEONITES — of one of the five 'father’s houses'  which were of the tribe of Simeon. — Another explanation: This is stated to tell the praiseworthiness of Phineas: that although this man was a prince he did not refrain from showing his zeal against the profanation of the Divine Name — on this account Scripture tells you who it was (a prince!) that was smitten by him."}, {"ch": 25, "v": 15, "aliyah": 1, "heb": "וְשֵׁ֨ם הָֽאִשָּׁ֧ה הַמֻּכָּ֛ה הַמִּדְיָנִ֖ית כׇּזְבִּ֣י בַת־צ֑וּר רֹ֣אשׁ אֻמּ֥וֹת בֵּֽית־אָ֛ב בְּמִדְיָ֖ן הֽוּא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְשׁוּם אִתְּתָא דְאִתְקְטִילַת מִדְיָנֵתָא כָּזְבִּי בַת צוּר רֵישׁ אֻמֵּי בֵּית אַבָּא בְּמִדְיָן הוּא:", "onk_en": "The name of the slain Midianite woman was Kozbi, daughter of Tzur, the national leader of a paternal house in Midian.", "pj": "וְשׁוּם אִתְּתָא קְטִילְתָּא מִדְיָינֵיתָא כָּזְבִּי בְּרַת צוּר דְמִתְקַרְיָיא שְׁלוֹנָאֵי בְּרַת בָּלָק רֵישׁ אוּמָא דְמוֹאָב בְּמִדְיָן בֵּית מוֹתְבֵיהּ הוּא", "pj_en": "And the name of the Midianite woman who was killed was Kosbi, daughter of Zur, who was called Shelonae, a daughter of Balak, the prince of the people of Moab, whose dwelling-place was in Midian.", "tj": "", "tj_en": "", "rashi": "<b>ושם האשה המכה וגו'.<\/b> לְהוֹדִיעֲךָ שִׂנְאָתָן שֶׁל מִדְיָנִים — שֶׁהִפְקִירוּ בַּת מֶלֶךְ לִזְנוּת כְּדֵי לְהַחֲטִיא אֶת יִשְׂרָאֵל (שם):<br><br><b>ראש אמות.<\/b> אֶחָד מֵחֲמֵשֶׁת מַלְכֵי מִדְיָן \"אֶת אֱוִי וְאֶת רֶקֶם וְאֶת צוּר\" וְגוֹ' (במדבר ל״א:ח׳), וְהוּא הָיָה חָשׁוּב מִכֻּלָּם, שֶׁנֶּאֱמַר \"רֹאשׁ אֻמּוֹת\", וּלְפִי שֶׁנָּהַג בִּזָּיוֹן בְּעַצְמוֹ לְהַפְקִיר בִּתּוֹ, מְנָאוֹ שְׁלִישִׁי (שם):<br><br><b>בית אב.<\/b> חֲמִשָּׁה בָתֵּי אָבוֹת הָיוּ לְמִדְיָן: \"עֵיפָה וָעֵפֶר וַחֲנֹךְ וַאֲבִידָע וְאֶלְדָּעָה\" (בראשית כ\"ה), וְזֶה הָיָה מֶלֶךְ לְאֶחָד מֵהֶם:", "rashi_en": "ושם האשה המכה וגו׳ AND THE NAME OF THE [MIDIANITISH] WOMAN WHO WAS SMITTEN etc. — This is stated to show you the hatred the Midianites bore to Israel — that they abandoned even a princess to prostitution in order to make Israel sin (Midrash Tanchuma, Pinchas 2).<br><br>ראש אמות [HE WAS] THE HEAD OF THE PEOPLE — He was one of the five kings of Midian, Evi and Rekem and Zur etc. (31:8). He, however, was the most important of all of them, as it is said, “the head of the people”, but because he made himself despicable by abandoning his daughter to prostitution it enumerates him not first but only third (Midrash Tanchuma, Pinchas 2).<br><br>בית אב — Midian had five fathers’ houses: Ephah and Epher, and Hanoch, and Abida and Eldoah (Genesis 25:4) — and this man was king of one of them."}, {"ch": 25, "v": 16, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 17, "aliyah": 1, "heb": "צָר֖וֹר אֶת־הַמִּדְיָנִ֑ים וְהִכִּיתֶ֖ם אוֹתָֽם׃", "onk": "אָעֵק יָת מִדְיָנָאֵי וְתִקְטוֹל יָתְהוֹן:", "onk_en": "“Antagonize the Midianites and kill them,", "pj": "אָעֵיק יַת מִדְיָנָאֵי וְתִקְטוֹל יַתְהוֹן", "pj_en": "Trouble the Midianites and slay them,", "tj": "", "tj_en": "", "rashi": "<b>צרור.<\/b> כְּמוֹ זָכוֹר, שָׁמוֹר, לְשׁוֹן הוֹוֶה — עֲלֵיכֶם לְאַיֵּב אוֹתָם:", "rashi_en": "צרור — This grammatical form is similar to זכור and שמור: it expresses the idea of continuous present action — You must [constantly] show enmity toward them."}, {"ch": 25, "v": 18, "aliyah": 1, "heb": "כִּ֣י צֹרְרִ֥ים הֵם֙ לָכֶ֔ם בְּנִכְלֵיהֶ֛ם אֲשֶׁר־נִכְּל֥וּ לָכֶ֖ם עַל־דְּבַר־פְּע֑וֹר וְעַל־דְּבַ֞ר כׇּזְבִּ֨י בַת־נְשִׂ֤יא מִדְיָן֙ אֲחֹתָ֔ם הַמֻּכָּ֥ה בְיוֹם־הַמַּגֵּפָ֖ה עַל־דְּבַר־פְּעֽוֹר׃", "onk": "אֲרֵי מְעִיקִין אִנּוּן לְכוֹן בְּנִכְלֵיהוֹן דִּי נְכִילוּ לְכוֹן עַל עֵסַק פְּעוֹר וְעַל עֵסַק כָּזְבִּי בַת רַבָּא דְמִדְיָן אֲחַתְהוֹן דְּאִתְקְטִילַת בְּיוֹמָא דְמוֹתָנָא עַל עֵסַק פְּעוֹר:", "onk_en": "for they antagonized you with their guiles in the matter of Pe’or, and in the matter of Kozbi the daughter of a Midianite prince, their sister, who was killed on the day of the plague that resulted from Pe’or.”", "pj": "אֲרוּם עַיְיקוּן הִינוּן לְכוֹן בְּעֵיטַת רַמְיוּתֵיהוֹן דְרַמְיַין לְכוֹן עַל עֵיסַק פְּעוֹר וְעַל עֵיסַק כָּזְבִּי בְּרַת רַבָּא דְמִדְיָן אֲחַתְהוֹן דְאִתְקְטִילַת בְּיוֹמָא דְמוֹתָנָא עַל עֵיסַק פְּעוֹר", "pj_en": "because they troubled you by their deceitful counsels when they beguiled you in the matter of Peor, and of Kosbi their sister, daughter of the prince of Midian, who was slain in the day of the plague for the matter of Peor.", "tj": "בנכליהם בְּשִׁקְרֵיהוֹן:", "tj_en": "For their false dealings.", "rashi": "<b>כי צוררים הם לכם וגו' על דבר פעור.<\/b> שֶׁהִפְקִירוּ בְּנוֹתֵיהֶם לִזְנוּת, כְּדֵי לְהַטְעוֹתְכֶם אַחַר פְּעוֹר. וְאֶת מוֹאָב לֹא צִוָּה לְהַשְׁמִיד, מִפְּנֵי רוּת שֶׁהָיְתָה עֲתִידָה לָצֵאת מֵהֶם, כִּדְאָמְרִינַן בְּבָבָא קַמָּא (לח ב):", "rashi_en": "כי צררים הם לכם וגו׳ על דבר פעור FOR THEY SHOWED THEMSELVES YOUR ENEMIES etc. IN THE MATTER OF PEOR — i.e., in that they abandoned their daughters to prostitution in order to lead you astray after Peor; but He did not command them to destroy the Moabites — on account of Ruth who would later on issue from them, just as we state in Bava Kamma 38b."}, {"ch": 26, "v": 1, "aliyah": 1, "heb": "וַיְהִ֖י אַחֲרֵ֣י הַמַּגֵּפָ֑ה&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה וְאֶ֧ל אֶלְעָזָ֛ר בֶּן־אַהֲרֹ֥ן הַכֹּהֵ֖ן לֵאמֹֽר׃", "onk": "וַהֲוָה בָּתַר מוֹתָנָא וַאֲמַר יְיָ לְמשֶׁה וּלְאֶלְעָזָר בַּר אַהֲרֹן כַּהֲנָא לְמֵימָר:", "onk_en": "It was after the plague. Adonoy spoke to Moshe and Elozor, son of Aharon the <i>kohein,<\/i> saying:", "pj": "וַהֲוָה בָּתַר מוֹתָנָא אִתְגוֹלְלוּ רַחֲמֵי שְׁמַיָא לְמִתְפַּרְעָא פּוּרְעָנוּת דִין עַמֵיהּ וַאֲמַר יְיָ לְמשֶׁה וּלְאֶלְעָזָר בַּר אַהֲרן כַּהֲנָא לְמֵימָר", "pj_en": "And it came to pass after the plague, that the compassions of the heavens were turned to avenge His people with judgment. And the Lord spake to Mosheh and Elazar bar Aharon the priest, saying:", "tj": "", "tj_en": "", "rashi": "<b>ויהי אחרי המגפה וגו'.<\/b> מָשָׁל לְרוֹעֶה שֶׁנִּכְנְסוּ זְאֵבִים לְתוֹךְ עֶדְרוֹ וְהָרְגוּ בָהֶן וְהוּא מוֹנֶה אוֹתָן לֵידַע מִנְיַן הַנּוֹתָרוֹת; דָּבָר אַחֵר — כְּשֶׁיָּצְאוּ מִמִּצְרַיִם וְנִמְסְרוּ לְמֹשֶׁה נִמְסְרוּ לוֹ בְּמִנְיָן, עַכְשָׁו שֶׁקָּרַב לָמוּת וּלְהַחֲזִיר צֹאנוֹ מַחֲזִירָן בְּמִנְיָן (תנחומא):", "rashi_en": "ויהי אחרי המגפה AND IT CAME TO PASS AFTER THE PESTILENCE [THAT THE LORD SPOKE TO MOSES … TAKE THE SUM OF ALL THE CONGREGATION] — A parable! This may be compared to the case of a shepherd amongst whose flock wolves found their way and slew some of them, and he counted them to discover the number of those that were left. — Another explanation: When they left Egypt and were entrusted to Moses' care, they were entrusted to him by number, now when he is close to death and has to hand back his sheep, he hands them back by number (Midrash Tanchuma, Pinchas 4)."}, {"ch": 26, "v": 2, "aliyah": 1, "heb": "שְׂא֞וּ אֶת־רֹ֣אשׁ&thinsp;<b>׀<\/b> כׇּל־עֲדַ֣ת בְּנֵי־יִשְׂרָאֵ֗ל מִבֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָמַ֖עְלָה לְבֵ֣ית אֲבֹתָ֑ם כׇּל־יֹצֵ֥א צָבָ֖א בְּיִשְׂרָאֵֽל׃", "onk": "<b>קַבִּילוּ<\/b> יָת חֻשְׁבַּן כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא לְבֵית אֲבָהַתְהוֹן כָּל נָפֵק חֵילָא בְּיִשְׂרָאֵל:", "onk_en": "“[<b>Take the<\/b>] count [<b>of<\/b>] the whole community of Bnei Yisroel twenty years of age and above, according to their paternal house, every one who is fit for duty in the army of Yisroel.”", "pj": "קַבִּילוּ יַת סְכוּם חוּשְׁבַּן כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא לְבֵית אַבְהַתְהוֹן כָּל נָפִיק חֵילָא בְּיִשְרָאֵל", "pj_en": "Take the sum of the account of the whole congregation of the Beni Israel, from twenty years old and upward, according to the house of their fathers, of every one who goeth forth with the host in Israel.", "tj": "", "tj_en": "", "rashi": "<b>לבית אבתם.<\/b> עַל שֵׁבֶט הָאָב יִתְיַחֲסוּ וְלֹא אַחַר הָאֵם (בבא בתרא ק\"ט):", "rashi_en": "לבית אבתם [TAKE THE SUM OF THE CONGREGATION] ACCORDING TO THEIR FATHERS’ HOUSE — after their fathers’ tribes shall they reckon their descent, and not after their mothers’ (Bava Batra 109b)."}, {"ch": 26, "v": 3, "aliyah": 1, "heb": "וַיְדַבֵּ֨ר מֹשֶׁ֜ה וְאֶלְעָזָ֧ר הַכֹּהֵ֛ן אֹתָ֖ם בְּעַֽרְבֹ֣ת מוֹאָ֑ב עַל־יַרְדֵּ֥ן יְרֵח֖וֹ לֵאמֹֽר׃", "onk": "וּמַלִּיל משֶׁה וְאֶלְעָזָר כַּהֲנָא אֲמָרוּ <b>לְמִמְנֵי<\/b> יָתְהוֹן בְּמֵישְׁרַיָּא דְמוֹאָב עַל יַרְדֵּנָא דִירֵחוֹ לְמֵימָר:", "onk_en": "Moshe and Elozor the <i>kohein<\/i> spoke with [<b>to count<\/b>] them on the plains of Moav, by the Yardein near Yereicho, saying:", "pj": "וּמַלֵיל משֶׁה וְאֶלְעָזָר כַּהֲנָא עִם אֲמַרְכְּלַיָא וַאֲמַר לְמִמְנֵי יַתְהוֹן בְּמֵישְׁרַיָא דְמוֹאָב עַל יַרְדְנָא דִירֵיחוֹ לְמֵימָר", "pj_en": "And Mosheh and Elazar the priest spake with the leaders, and commanded that they should number them in the plain of Moab, by the Jordan (over against) Jericho, saying", "tj": "", "tj_en": "", "rashi": "<b>וידבר משה ואלעזר הכהן אתם.<\/b> דִּבְּרוּ עִמָּם עַל זֹאת שֶׁצִּוָּה הַמָּקוֹם לִמְנוֹתָם:<br><br><b>לאמר.<\/b> אָמְרוּ לָהֶם צְרִיכִים אַתֶּם לִמָּנוֹת <b>מבן עשרים שנה ומעלה<\/b>:", "rashi_en": "וידבר משה ואלעזר הכהן אתם AND MOSES AND ELEAZAR THE PRIEST SPOKE WITH THEM — They spoke with them (אתם; cf.  5:5) regarding this: that the Omnipresent had (given command to count them.<br><br>לאמר SAYING they said to them (what they said to them was): You must be counted FROM TWENTY YEARS OLD AND UPWARDS."}, {"ch": 26, "v": 4, "aliyah": 1, "heb": "מִבֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָמָ֑עְלָה כַּאֲשֶׁר֩ צִוָּ֨ה יְהֹוָ֤ה אֶת־מֹשֶׁה֙ וּבְנֵ֣י יִשְׂרָאֵ֔ל הַיֹּצְאִ֖ים מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה וּבְנֵי יִשְׂרָאֵל דִּי נְפָקוּ מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "“[Count those] twenty years of age and above, as Adonoy commanded Moshe and Bnei Yisroel who had left Egypt.”", "pj": "מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה וּבְנֵי יִשְרָאֵל דְנָפְקוּ מֵאַרְעָא דְמִצְרָיִם", "pj_en": "(You are to number them) from a son of twenty years and upward, as the Lord commanded Mosheh and the sons of Israel when they came out of the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>כאשר צוה וגו'.<\/b> שֶׁיְּהֵא מִנְיָנָם מִבֶּן עֶשְֹרִים שָׁנָה וָמַעְלָה, שֶׁנֶּאֱמַר \"כָּל הָעֹבֵר עַל הַפְּקֻדִים\" וגו' (שמות ל'):", "rashi_en": "מבן עשרים שנה ומעלה כאשר צוה וגו׳ FROM TWENTY YEARS OLD AND ONWARDS, EVEN AS [THE LORD] HAS COMMANDED [MOSES AND THE CHILDREN OF ISRAEL, WHO CAME FORTH FROM EGYPT] that the counting of them (of those who came out from Egypt) should be from twenty years old and upwards, as it is said. (Exodus 30:14): “Every one that passeth amongst them that are numbered [shall be from twenty years old and upwards]”."}, {"ch": 26, "v": 5, "aliyah": 2, "heb": "רְאוּבֵ֖ן בְּכ֣וֹר יִשְׂרָאֵ֑ל בְּנֵ֣י רְאוּבֵ֗ן חֲנוֹךְ֙ מִשְׁפַּ֣חַת הַחֲנֹכִ֔י לְפַלּ֕וּא מִשְׁפַּ֖חַת הַפַּלֻּאִֽי׃", "onk": "רְאוּבֵן בּוּכְרָא דְיִשְׂרָאֵל בְּנֵי רְאוּבֵן חֲנוֹךְ זַרְעִית חֲנוֹךְ לְפַלּוּא זַרְעִית פַּלּוּא:", "onk_en": "Reuvein, [was] Yisroel’s firstborn; the descendants of Reuvein are: the Chanochite family from Chanoch, the Paluite family from Palu,", "pj": "רְאוּבֵן בּוּכְרָא דְיִשְרָאֵל בְּנוֹי דִרְאוּבֵן חֲנוֹךְ גְנִיסַת חֲנוֹךְ לְפַלוּא גְנִיסַת פַּלוּא", "pj_en": "Reuben, the first-born of Israel: the sons of Reuben, Hanok, the family of Hanok; of Phallu, the family of Phallu;", "tj": "", "tj_en": "", "rashi": "<b>משפחת החנכי.<\/b> לְפִי שֶׁהָיוּ הָאֻמּוֹת מְבַזִּין אוֹתָם וְאוֹמְרִים מָה אֵלּוּ מִתְיַחֲסִין עַל שִׁבְטֵיהֶם? סְבוּרִים הֵם שֶׁלֹּא שָׁלְטוּ הַמִּצְרִיִּים בְּאִמּוֹתֵיהֶם? אִם בְּגוּפָם הָיוּ מוֹשְׁלִים, קַל וָחֹמֶר בִּנְשׁוֹתֵיהֶם, לְפִיכָךְ הִטִּיל הַקָּבָּ\"ה שְׁמוֹ עֲלֵיהֶם — ה\"א מִצַּד זֶה וְיוֹ\"ד מִצַּד זֶה — לוֹמַר, מֵעִיד אֲנִי עֲלֵיהֶם שֶׁהֵם בְּנֵי אֲבוֹתֵיהֶם, וְזֶה הוּא שֶׁמְּפֹרָשׁ עַל יְדֵי דָוִד (תהילים קכ\"ב) \"שִׁבְטֵי יָהּ עֵדוּת לְיִשְׂרָאֵל\" — הַשֵּׁם הַזֶּה מֵעִיד עֲלֵיהֶם לְשִׁבְטֵיהֶם, לְפִיכָךְ בְּכֻלָּם כָּתַב הַחֲנֹכִי, הַפַּלֻּאִי, אֲבָל בְּיִמְנָה לֹא הֻצְרַךְ לוֹמַר \"מִשְׁפַּחַת הַיִּמְנִי\" לְפִי שֶׁהַשֵּׁם קָבוּעַ בּוֹ — יוֹ\"ד בָּרֹאשׁ וה\"א בַּסּוֹף (ילקוט שמעוני):", "rashi_en": "משפחת החנכי THE FAMILY OF THE HANOCHITES — Because the heathen nations spoke slightingly of Israel, saying, “How can these trace their descent by their tribes? Do they think that the Egyptians did not overmaster their mothers? If they showed themselves master of their bodies, it is quite certain that they did so over those of their wives!”. On this account the Holy One, blessed be He, set His name upon them: the letter ה on one side of their name and the letter י on the other side (חנכיה), to intimate: I bear testimony for them that they are the sons of their reputed fathers (and not of the Egyptians) (Shir HaShirim Rabbah 4:12). This it is that is expressed by David, (Psalms 122:4) שבטי יה עדות לישראל: “that the tribes bear the name of the Lord (יה) is a testimony regarding Israel” — this Divine Name (יה) bears testimony regarding their tribes (i.e. that they rightly attach themselves to those tribes to which they claim to belong). On this account in the case of all of them it is written החנכי and הפלואי but in the case of ימנה (v. 44) it was not felt necessary to state “of the family of הימני”, because the Divine Name is already attached to it — the י at the beginning and the ה at the end (ימנה) (Yalkut Shimoni on Torah 773)."}, {"ch": 26, "v": 6, "aliyah": 2, "heb": "לְחֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽחֶצְרוֹנִ֑י לְכַרְמִ֕י מִשְׁפַּ֖חַת הַכַּרְמִֽי׃", "onk": "לְחֶצְרוֹן זַרְעִית חֶצְרוֹן לְכַרְמִי זַרְעִית כַּרְמִי:", "onk_en": "the Chetzronite family from Chetzron and the Karmite family from Karmi.", "pj": "לְחֶצְרוֹן גְנִיסַת חֶצְרוֹן לְכַרְמִי גְנִיסַת כַּרְמִי", "pj_en": "of Hezron, the family of Hezron; of Karmi, the family of Karmi.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 7, "aliyah": 2, "heb": "אֵ֖לֶּה מִשְׁפְּחֹ֣ת הָראוּבֵנִ֑י וַיִּהְי֣וּ פְקֻדֵיהֶ֗ם שְׁלֹשָׁ֤ה וְאַרְבָּעִים֙ אֶ֔לֶף וּשְׁבַ֥ע מֵא֖וֹת וּשְׁלֹשִֽׁים׃", "onk": "אִלֵּין זַרְעֲיַת רְאוּבֵן וַהֲווֹ מִנְיָנֵיהוֹן אַרְבְּעִין וּתְלָתָא אַלְפִין וּשְׁבַע מְאָה וּתְלָתִין:", "onk_en": "These are Reuvein’s families and they numbered forty-three thousand, and seven hundred and thirty.", "pj": "אִלֵין גְנִיסְתָּא דִרְאוּבֵן וַהֲווֹ סְכוּמֵיהוֹן אַרְבְּעִין וּתְלַת אַלְפִין וּשְׁבַע מְאָה וּתְלָתִין", "pj_en": "These are the families of Reuben, and their numbers were forty-three thousand seven hundred and thirty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 8, "aliyah": 2, "heb": "וּבְנֵ֥י פַלּ֖וּא אֱלִיאָֽב׃", "onk": "וּבְנֵי פַלּוּא אֱלִיאָב:", "onk_en": "Palu’s son[s were] was Eliav.", "pj": "וּבְנוֹי דְפַלוּא אֱלִיאָב", "pj_en": "And the sons of Phallu Eliab;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 9, "aliyah": 2, "heb": "וּבְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְדָתָ֣ן וַאֲבִירָ֑ם הֽוּא־דָתָ֨ן וַאֲבִירָ֜ם <span class=\"mam-kq\"><span class=\"mam-kq-k\">(קרואי)<\/span> <span class=\"mam-kq-q\">[קְרִיאֵ֣י]<\/span><\/span> הָעֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל־מֹשֶׁ֤ה וְעַֽל־אַהֲרֹן֙ בַּעֲדַת־קֹ֔רַח בְּהַצֹּתָ֖ם עַל־יְהֹוָֽה׃", "onk": "וּבְנֵי אֱלִיאָב נְמוּאֵל וְדָתָן וַאֲבִירָם הוּא דָתָן וַאֲבִירָם מְעַרְעֵי כְנִשְׁתָּא דְּאִתְכְּנָשׁוּ עַל משֶׁה וְעַל אַהֲרֹן בִּכְנִשְׁתָּא דְקֹרַח בְּאִתְכַּנּוֹשֵׁיהוֹן עַל יְיָ:", "onk_en": "Eliav’s sons were Nemueil, Dasan and Aviram. They are Dasan and Aviram, the communal leaders, who incited against Moshe and Aharon in the assembly of Korach when they incited against Adonoy.", "pj": "וּבְנוֹי דֶאֱלִיאָב נְמוּאֵל וְדָתָן וַאֲבִירָם הוּא דָתָן וַאֲבִירָם מְעַרְעֵי כְנִשְׁתָּא דְאִתְכַּנָשׁוּ וּפְלִיגוּ עַל משֶׁה וְעַל אַהֲרן בִּכְנִישְׁתָּא דְקרַח בִּזְמַן דְאִתְכַּנָשׁוּ וּפְלִיגוּ עַל יְיָ", "pj_en": "the sons of Eliab, Nemuel, and Dathan, and Abiram. The same were Dathan and Abiram who brought together the congregation that gathered and made the division against Mosheh and Aharon in the congregation of Korach, when they gathered together and made division against the Lord,", "tj": "", "tj_en": "", "rashi": "<b>אשר הצו.<\/b> אֶת יִשְׂרָאֵל <b>על משה<\/b>:<br><br><b>בהצתם.<\/b> אֶת הָעָם <b>על ה'<\/b>:<br><br><b>הצו.<\/b> הִשִּׂיאוּ אֶת יִשְׂרָאֵל לָרִיב עַל מֹשֶׁה, לְשׁוֹן הִפְעִילוּ:", "rashi_en": "אשר הצו WHO INCITED — i.e., who incited Israel, על משה AGAINST MOSES,<br><br>בהצתם WHEN THEY INCITED the people AGAINST THE LORD.<br><br>הצו means they persuaded Israel to strive against Moses — it is a grammatical form denoting “they caused someone to do something\"."}, {"ch": 26, "v": 10, "aliyah": 2, "heb": "וַתִּפְתַּ֨ח הָאָ֜רֶץ אֶת־פִּ֗יהָ וַתִּבְלַ֥ע אֹתָ֛ם וְאֶת־קֹ֖רַח בְּמ֣וֹת הָעֵדָ֑ה בַּאֲכֹ֣ל הָאֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּמָאתַ֙יִם֙ אִ֔ישׁ וַיִּהְי֖וּ לְנֵֽס׃", "onk": "וּפְתָחַת אַרְעָא יָת פּוּמָהּ וּבְלָעַת יָתְהוֹן וְיָת קֹרַח בְּמוֹתָא דִכְנִשְׁתָּא כַּד אֲכָלַת אֶשָּׁתָא יָת מָאתָן וְחַמְשִׁין גַּבְרָא וַהֲווֹ לְאָת:", "onk_en": "The earth opened its mouth and swallowed them and Korach when that assembly died; when fire consumed the two hundred and fifty men; they became a symbol.", "pj": "וּפְתָחַת אַרְעָא יַת פּוּמָהּ וּבְלָעַת יַתְהוֹן וְיַת קרַח כַּד מִיתוּ כְנִישַׁת רַשִׁיעֵי כַּד אָכְלַת אֵישָׁתָא יַת מָאתָן וְחַמְשִׁין גוּבְרִין וַהֲווֹ לְנִיסָיוֹן", "pj_en": "and the earth opened her mouth and swallowed them and Korach, when the congrergation of the wicked died, when the fire devoured the two hundred and fifty men, and they were made an example.", "tj": "", "tj_en": "", "rashi": "<b>ויהיו לנס.<\/b> לְאוֹת וּלְזִכָּרוֹן, \"לְמַעַן אֲשֶׁר לֹא יִקְרַב אִישׁ זָר\" (במדבר י\"ז) לַחֲלֹק עוֹד עַל הַכְּהֻנָּה:", "rashi_en": "ויהיו לנס AND THEY BECAME A נס — a sign and a reminder in order that no stranger should bring himself near to raise further dispute concerning the priesthood (cf. Numbers 17:5)."}, {"ch": 26, "v": 11, "aliyah": 2, "heb": "וּבְנֵי־קֹ֖רַח לֹא־מֵֽתוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבְנֵי קֹרַח לָא מִיתוּ:", "onk_en": "But the sons of Korach did not die.", "pj": "וּבְנוֹי דְקרַח לָא הֲווֹ בְּעֵיטָתָא דַאֲבוּהוֹן וַאֲזָלוּ בָּתַר אוּלְפָנָא דְמשֶׁה נְבִיָא לָא מִיתוּ בְּמוֹתָנָא וְלָא לָקוּ בִּיקֵידְתָּא וְלָא טָמְעוּ בִּבְלִיעַת אַרְעָא", "pj_en": "But the sons of Korach were not in the counsel of their father, but followed the doctrine of Mosheh the prophet; and therefore they died not by the plague, nor were smitten by the fire, nor engulphed in the yawning of the earth.", "tj": "וּבְנוֹי דְקרַח עַל דְלָא הֲווֹ בַּעֲצָתֵיהּ דַאֲבוּהוֹן לָא מִיתוּ:", "tj_en": "But the sons of Korach, who were not in the counsel of their father did not die.", "rashi": "<b>ובני קרח לא מתו.<\/b> הֵם הָיוּ בָעֵצָה תְּחִלָּה, וּבִשְׁעַת הַמַּחֲלֹקֶת הִרְהֲרוּ תְשׁוּבָה בְלִבָּם, לְפִיכָךְ נִתְבַּצֵּר לָהֶם מָקוֹם גָּבוֹהַ בַּגֵיהִנּוֹם וְיָשְׁבוּ שָׁם (סנהדרין ק\"י):", "rashi_en": "ובני קרח לא מתו BUT THE SONS OF KORAH DID NOT DIE — They were in the plot originally, but at the moment when the rebellion broke out they had thoughts of repentance in their hearts; therefore a high spot was fenced round for them in Gehinnom and they stayed there (Sanhedrin 110a)."}, {"ch": 26, "v": 12, "aliyah": 2, "heb": "בְּנֵ֣י שִׁמְעוֹן֮ לְמִשְׁפְּחֹתָם֒ לִנְמוּאֵ֗ל מִשְׁפַּ֙חַת֙ הַנְּמ֣וּאֵלִ֔י לְיָמִ֕ין מִשְׁפַּ֖חַת הַיָּמִינִ֑י לְיָכִ֕ין מִשְׁפַּ֖חַת הַיָּכִינִֽי׃", "onk": "בְּנֵי שִׁמְעוֹן לְזַרְעֲיַתְהוֹן לִנְמוּאֵל זַרְעִית נְמוּאֵל לְיָמִין זַרְעִית יָמִין לְיָכִין זַרְעִית יָכִין:", "onk_en": "The descendants of Shimon by their families are: the Nemuelite family from Nemuel, the Yaminite family from Yamin, the Yachinite family from Yachin,", "pj": "בְּנוֹי דְשִׁמְעוֹן לִגְנִיסַתְהוֹן לִנְמוּאֵל גְנִיסַת נְמוּאֵל לְיָמִין גְנִיסַת יָמִין לְיָכִין גְנִיסַת יָכִין", "pj_en": "The Beni Shemeon with their families, of Nemuel, the family of Nemuel; of Jamin, the family of Jamin; of Jakin, the family of  Jakin.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 13, "aliyah": 2, "heb": "לְזֶ֕רַח מִשְׁפַּ֖חַת הַזַּרְחִ֑י לְשָׁא֕וּל מִשְׁפַּ֖חַת הַשָּׁאוּלִֽי׃", "onk": "לְזֶרַח זַרְעִית זָרַח לְשָׁאוּל זַרְעִית שָׁאוּל:", "onk_en": "the Zarchite family from Zerach, [and] the Shaulite family from Shaul.", "pj": "לְזֶרַח גְנִיסַת זֶרַח לְשָׁאוּל גְנִיסַת שָׁאוּל", "pj_en": "Of Zerach, the family of Zerach; of Shaul, the family of Shaul.", "tj": "", "tj_en": "", "rashi": "<b>לזרח.<\/b> הוּא צֹחַר, לְשׁוֹן צֹהַר, אֲבָל מִשְׁפַּחַת אֹהַד בָּטְלָה, וְכֵן חָמֵשׁ מִשֵּׁבֶט בִּנְיָמִין, שֶׁהֲרֵי בַּעֲשָׂרָה בָנִים יָרַד לְמִצְרַיִם וְכָאן לֹא מָנָה אֶלָּא חֲמִשָּׁה, וְכֵן אֶצְבּוֹן לְגָד, הֲרֵי שֶׁבַע מִשְׁפָּחוֹת (תנחומא); וּמָצָאתִי בְתַלְמוּד יְרוּשַׁלְמִי שֶׁכְּשֶׁמֵּת אַהֲרֹן נִסְתַּלְּקוּ עַנְנֵי כָבוֹד, וּבָאוּ הַכְּנַעֲנִים לְהִלָּחֵם בְּיִשְׂרָאֵל, וְנָתְנוּ לֵב לַחֲזֹר לְמִצְרַיִם, וְחָזְרוּ לַאֲחוֹרֵיהֶם שְׁמוֹנֶה מַסָּעוֹת — מֵהֹר הָהָר לְמוֹסֵרָה — שֶׁנֶּאֱמַר \"וּבְנֵי יִשְׂרָאֵל נָסְעוּ מִבְּאֵרֹת בְּנֵי יַעֲקָן מוֹסֵרָה שָׁם מֵת אַהֲרֹן\" (דברים י'), וַהֲלֹא בְהֹר הָהָר מֵת וּמִמּוֹסֵרָה עַד הֹר הָהָר שְׁמוֹנֶה מַסָּעוֹת יֵשׁ לְמַפְרֵעַ? אֶלָּא שֶׁחָזְרוּ לַאֲחוֹרֵיהֶם וְרָדְפוּ בְנֵי לֵוִי אַחֲרֵיהֶם לְהַחֲזִירָם וְהָרְגוּ מֵהֶם שֶׁבַע מִשְׁפָּחוֹת, וּמִבְּנֵי לֵוִי נָפְלוּ אַרְבַּע מִשְׁפָּחוֹת: מִשְׁפַּחַת שִׁמְעִי וְעֻזִּיאֵלִי, וּמִבְּנֵי יִצְהָר לֹא נִמְנוּ כָּאן אֶלָּא מִשְׁפַּחַת הַקָּרְחִי, וְהָרְבִיעִית לֹא יָדַעְתִּי מַה הִיא (תלמוד ירושלמי סוטה א'); וְרַבִּי תַּנְחוּמָא דָרַשׁ שֶׁמֵּתוּ בַּמַּגֵּפָה בִּדְבַר בִּלְעָם, אֲבָל לְפִי הַחִסָּרוֹן שֶׁחָסַר מִשֵּׁבֶט שִׁמְעוֹן בְּמִנְיָן זֶה מִמִּנְיָן הָרִאשׁוֹן שֶׁבְּמִדְבַּר סִינַי, נִרְאֶה שֶׁכָּל כ\"ד אֶלֶף נָפְלוּ מִשִּׁבְטוֹ שֶׁל שִׁמְעוֹן:", "rashi_en": "לזרח OF ZERAH — He is identical with Zohar (mentioned in Exodus 6:15 as a son of Simeon), which is an expression equivalent to צהר, shining (a synonym of זרח). However, the family of אהוד (mentioned there) had ceased to exist by now. The same was the case with five families of the tribe of Benjamin, for with ten sons did Benjamin go down to Egypt and here it enumerates only five. Similarly with Ezbon of the tribe of Gad. So you have seven families that had become extinct (cf. Midrash Tanchuma, Pinchas 5). — And I have found in the Talmud Yerushalmi Yoma 1:2 the reason why these seven families were now extinct: that when Aaron died the clouds of glory departed and the Canaanites came to wage war against Israel. These therefore set their hearts on returning to Egypt and turned back eight stages from Mount Hor to Moserah, as it is said, (Deuteronomy 10:6) “And the children of Israel journeyed from Bene Jaakon to Moserah; there Aaron died”. But did he not die at Mount Hor and from Moserah to Mount Hor there were eight stages in a backward direction? But the explanation is that they turned back, and the Levites pursued them to force them to return and slew of them seven families. And besides these, of the sons of Levi there fell four families: the families of Shimei and Uzzieli, and of the three sons of Izhar (Exodus 6:21) only the family of one son, Korah, is enumerated here, v. 58, so that the family of Izhar may be regarded as extinct — making three families missing. And as regards the fourth family I do not know which of those mentioned in 3:21, 27, 33, it was that had become extinct by now (Talmud Yerushalmi Sotah 1:10; Yoma 1:1). But Rabbi Tanchuma (Midrash Tanchuma, Pinchas 5) explained that they (the families not mentioned here) died by the plague in the matter of Balaam. But this can hardly be so, because according to the deficiency that shows itself in the tribe of Simeon in this census, as compared with the first census in the wilderness of Sinai (1:23), it would appear that all the twenty four thousand who died of that plague (Numbers 25:9) must have fallen from the tribe of Simeon."}, {"ch": 26, "v": 14, "aliyah": 2, "heb": "אֵ֖לֶּה מִשְׁפְּחֹ֣ת הַשִּׁמְעֹנִ֑י שְׁנַ֧יִם וְעֶשְׂרִ֛ים אֶ֖לֶף וּמָאתָֽיִם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעֲיַת שִׁמְעוֹן עַשְׂרִין וּתְרֵין אַלְפִין וּמָאתָן:", "onk_en": "These are the families of Shimon—twenty- two thousand and two hundred.", "pj": "אִלֵין גְנִיסְתָּא דְשִׁמְעוֹן עַשְרִין וּתְרֵין אַלְפִין וּמָאתָן", "pj_en": "These are the families of Shemeon, twenty-two thousand two hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 15, "aliyah": 2, "heb": "בְּנֵ֣י גָד֮ לְמִשְׁפְּחֹתָם֒ לִצְפ֗וֹן מִשְׁפַּ֙חַת֙ הַצְּפוֹנִ֔י לְחַגִּ֕י מִשְׁפַּ֖חַת הַֽחַגִּ֑י לְשׁוּנִ֕י מִשְׁפַּ֖חַת הַשּׁוּנִֽי׃", "onk": "בְּנֵי גָד לְזַרְעֲיַתְהוֹן לִצְפוֹן זַרְעִית צְפוֹן לְחַגִּי זַרְעִית חַגִּי לְשׁוּנִי זַרְעִית שׁוּנִי:", "onk_en": "The descendants of Gad by their families are: The Tzefonite family from Tzefon, the Chagite family from Chagi, the Shunite family from Shuni,", "pj": "בְּנוֹי דְגָד לִגְנִיסַתְהוֹן לִצְפוֹן גְנִיסַת צְפוֹן לְחַגִי גְנִיסַת חַגִי לְשׁוּנִי גְנִיסַת שׁוּנִי", "pj_en": "Of Gad, with the families, of Zephon, the family of of Zephon; of Haggi, the family of Haggi; of Suni, the family of Suni.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 16, "aliyah": 2, "heb": "לְאׇזְנִ֕י מִשְׁפַּ֖חַת הָאׇזְנִ֑י לְעֵרִ֕י מִשְׁפַּ֖חַת הָעֵרִֽי׃", "onk": "לְאָזְנִי זַרְעִית אָזְנִי לְעֵרִי זַרְעִית עֵרִי:", "onk_en": "the Oznite family from Ozni, the Eirite family from Eiri,", "pj": "לְאָזְנִי גְנִיסַת אָזְנִי לְעֵרִי גְנִיסַת עֵרִי", "pj_en": "Of Ozni, the family of Ozni; of Heri, the family of Heri.", "tj": "", "tj_en": "", "rashi": "<b>לאזני.<\/b> אוֹמֵר אֲנִי שֶׁזּוֹ מִשְׁפַּחַת אֶצְבּוֹן (בראשית מ\"ו), וְאֵינִי יוֹדֵעַ לָמָּה לֹא נִקְרֵאת מִשְׁפַּחְתּוֹ עַל שְׁמוֹ:", "rashi_en": "לאזני OF OZNI — I say (cf. Rashi on v. 13) that this is the family of Ezbon, (Genesis 46:16), but I do not know why his family was not called directly by his name."}, {"ch": 26, "v": 17, "aliyah": 2, "heb": "לַאֲר֕וֹד מִשְׁפַּ֖חַת הָאֲרוֹדִ֑י לְאַ֨רְאֵלִ֔י מִשְׁפַּ֖חַת הָאַרְאֵלִֽי׃", "onk": "לַאֲרוֹד זַרְעִית אֲרוֹדִי לְאַרְאֵלִי זַרְעִית אַרְאֵלִי:", "onk_en": "the Arodite family from Arod, and the Areilite family from Areili.", "pj": "לַאֲרוֹד גְנִיסַת אֲרוֹד לְאַרְאֵלִי גְנִיסַת אַרְאֵלִי", "pj_en": "Of Arod, the family of Arod; of Areli, the family of Areli.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 18, "aliyah": 2, "heb": "אֵ֛לֶּה מִשְׁפְּחֹ֥ת בְּנֵֽי־גָ֖ד לִפְקֻדֵיהֶ֑ם אַרְבָּעִ֥ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעֲיַת בְּנֵי גָד לְמִנְיָנֵיהוֹן אַרְבְּעִין אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "These are the families of Gad’s descendants and they numbered forty thousand and five hundred.", "pj": "אִלֵין גְנִיסַת בְּנֵי גָד לִסְכוּמְהוֹן אַרְבְּעִין אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "These are the families of Gad, and their numbers were forty thousand five hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 19, "aliyah": 2, "heb": "בְּנֵ֥י יְהוּדָ֖ה עֵ֣ר וְאוֹנָ֑ן וַיָּ֥מׇת עֵ֛ר וְאוֹנָ֖ן בְּאֶ֥רֶץ כְּנָֽעַן׃", "onk": "בְּנֵי יְהוּדָה עֵר וְאוֹנָן וּמִית עֵר וְאוֹנָן בְּאַרְעָא דִכְנָעַן:", "onk_en": "The sons of Yehudah are Eir and Onan; Eir and Onan died in the land of Canaan.", "pj": "בְּנוֹי דִיהוּדָה עֵר וְאוֹנָן וּמִיתוּ עֵר וְאוֹנָן עַל חוֹבֵיהוֹן בְּאַרְעָא דִכְנָעַן", "pj_en": "Of Jehudah, Her and Onan. But Her and Onan died, on account of their sins, in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 20, "aliyah": 2, "heb": "וַיִּהְי֣וּ בְנֵי־יְהוּדָה֮ לְמִשְׁפְּחֹתָם֒ לְשֵׁלָ֗ה מִשְׁפַּ֙חַת֙ הַשֵּׁ֣לָנִ֔י לְפֶ֕רֶץ מִשְׁפַּ֖חַת הַפַּרְצִ֑י לְזֶ֕רַח מִשְׁפַּ֖חַת הַזַּרְחִֽי׃", "onk": "וַהֲווֹ בְנֵי יְהוּדָה לְזַרְעֲיַתְהוֹן לְשֵׁלָה זַרְעִית שֵׁלָה לְפֶרֶץ זַרְעִית פֶּרֶץ לְזֶרַח זַרְעִית זָרַח:", "onk_en": "The descendants of Yehudah by their families are: The Sheilanite family from Sheila, the Partzite family from Peretz, the Zarchite family from Zerach.", "pj": "וַהֲווֹ בְּנֵי יְהוּדָה לִגְנִיסַתְהוֹן לְשֵׁלָה גְנִיסַת שֵׁלָה לְפֶרֶץ גְנִיסַת פֶּרֶץ לְזֶרַח גְנִיסַת זָרַח", "pj_en": "Of the Beni Jehudah with their families, of Shela, the family of Shela; of Pherez, the family of Pherez; of Zerach, the family of Zerach.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 21, "aliyah": 2, "heb": "וַיִּהְי֣וּ בְנֵי־פֶ֔רֶץ לְחֶצְרֹ֕ן מִשְׁפַּ֖חַת הַֽחֶצְרֹנִ֑י לְחָמ֕וּל מִשְׁפַּ֖חַת הֶחָמוּלִֽי׃", "onk": "וַהֲווֹ בְנֵי פֶרֶץ לְחֶצְרוֹן זַרְעִית חֶצְרוֹן לְחָמוּל זַרְעִית חָמוּל:", "onk_en": "The descendants of Peretz were: The Chetzronite family from Chetzron, and the Chamulite family from Chamul.", "pj": "וַהֲווֹ בְּנֵי פֶרֶץ לְחֶצְרוֹן גְנִיסַת חֶצְרוֹן לְחָמוּל גְנִיסַת חָמוּל", "pj_en": "The sons of Pherez, of Hezron, the family of Hezron; of Amul the family of Amul.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 22, "aliyah": 2, "heb": "אֵ֛לֶּה מִשְׁפְּחֹ֥ת יְהוּדָ֖ה לִפְקֻדֵיהֶ֑ם שִׁשָּׁ֧ה וְשִׁבְעִ֛ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעֲיַת יְהוּדָה לְמִנְיָנֵיהוֹן שַׁבְעִין וְשִׁתָּא אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "These are the families of Yehudah and they numbered seventy-six thousand and five hundred.", "pj": "אִלֵין גְנִיסְתָּא דִיהוּדָה לִסְכוּמְהוֹן שׁוּבְעִין וְשִׁיתָּא אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "The numbers of the families of Jehudah, seventy-six thousand five hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 23, "aliyah": 2, "heb": "בְּנֵ֤י יִשָּׂשכָר֙ לְמִשְׁפְּחֹתָ֔ם תּוֹלָ֕ע מִשְׁפַּ֖חַת הַתּוֹלָעִ֑י לְפֻוָ֕ה מִשְׁפַּ֖חַת הַפּוּנִֽי׃", "onk": "בְּנֵי יִשָׂשכָר לְזַרְעֲיַתְהוֹן תּוֹלָע זַרְעִית תּוֹלָע לְפֻוָּה זַרְעִית פֻּוָה:", "onk_en": "The descendants of Yissachar by their families are: The Tolaite family from Tola, the Punite family from Puva,", "pj": "בְּנוֹי דִישָשׁכָר לִגְנִיסַתְהוֹן תּוֹלָע גְנִיסַת תּוֹלָע לְפֻוָה גְנִיסַת פֻּוָה", "pj_en": "Of Issakar, with their families, of Thola, the family of Thola; of Puah, the family of Puah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 24, "aliyah": 2, "heb": "לְיָשׁ֕וּב מִשְׁפַּ֖חַת הַיָּשֻׁבִ֑י לְשִׁמְרֹ֕ן מִשְׁפַּ֖חַת הַשִּׁמְרֹנִֽי׃", "onk": "לְיָשׁוּב זַרְעִית יָשׁוּב לְשִׁמְרוֹן זַרְעִית שִׁמְרוֹן:", "onk_en": "the Yashuvite family from Yashuv, and the Shimronite family from Shimron.", "pj": "לְיָשׁוּב גְנִיסַת יָשׁוּב לְשִׁמְרוֹן גְנִיסַת שִׁמְרוֹן", "pj_en": "Of Jashub, the family of Jashub; of Shimron, the family of Shimron.", "tj": "", "tj_en": "", "rashi": "<b>לישוב.<\/b> הוּא יוֹב הָאָמוּר בְּיוֹרְדֵי מִצְרַיִם, כִּי כָל הַמִּשְׁפָּחוֹת נִקְרְאוּ עַל שֵׁם יוֹרְדֵי מִצְרַיִם, וְהַנּוֹלָדִין מִשָּׁם וָהָלְאָה לֹא נִקְרְאוּ הַמִּשְׁפָּחוֹת עַל שְׁמָם, חוּץ מִמִּשְׁפְּחוֹת אֶפְרַיִם וּמְנַשֶּׁה שֶׁנּוֹלְדוּ כֻלָּם בְּמִצְרַיִם, וְאַרְדְּ וְנַעֲמָן בְּנֵי בֶלַע בֶּן בִּנְיָמִין; וּמָצָאתִי בִיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן, שֶׁיָּרְדָה אִמָּן מִמִּצְרַיִם כְּשֶׁהָיְתָה מְעֻבֶּרֶת מֵהֶם, לְכָךְ נֶחְלְקוּ לְמִשְׁפָּחוֹת כְּחֶצְרוֹן וְחָמוּל שֶׁהָיוּ בְנֵי בָנִים לִיהוּדָה, וְחֶבֶר וּמַלְכִּיאֵל שֶׁהָיוּ בְנֵי בָנִים שֶׁל אָשֵׁר; וְאִם אַגָּדָה הִיא הֲרֵי טוֹב, וְאִם לָאו, אוֹמֵר אֲנִי שֶׁהָיוּ לְבֶלַע בְּנֵי בָנִים הַרְבֵּה, וּמִשְּׁנַיִם הַלָּלוּ, אַרְדְּ וְנַעֲמָן, יָצְאָה מִכָּל אֶחָד מִשְׁפָּחָה רַבָּה, וְנִקְרְאוּ תוֹלְדוֹת שְׁאָר הַבָּנִים עַל שֵׁם בֶּלַע, וְתוֹלְדוֹת הַשְּׁנַיִם הַלָּלוּ נִקְרְאוּ עַל שְׁמָם, וְכֵן אֲנִי אוֹמֵר בִּבְנֵי מָכִיר שֶׁנֶּחְלְקוּ לִשְׁתֵּי מִשְׁפָּחוֹת, אַחַת נִקְרֵאת עַל שְׁמוֹ, וְאַחַת נִקְרֵאת עַל שֵׁם גִּלְעָד בְּנוֹ; חָמֵשׁ מִשְׁפָּחוֹת חָסְרוּ מִבָּנָיו שֶׁל בִּנְיָמִין, כָּאן נִתְקַיְּמָה מִקְצַת נְבוּאַת אִמּוֹ שֶׁקְּרָאַתּוּ בֶן אוֹנִי — בֶּן אֲנִינוּתִי, וּבְפִילֶגֶשׁ בְּגִבְעָה (שופטים כ') נִתְקַיְּמָה כֻּלָּה. זוֹ מָצָאתִי בִיסוֹדוֹ שֶׁל רַ' מֹשֶׁה הַדַּרְשָׁן:", "rashi_en": "לישוב OF JASHUB — He must be identical with Job (Genesis 46:13) who is mentioned amongst those who went down to Egypt, for all the families were called by the names of those who went down to Egypt. But as for those who were born from that time and onwards their families were not called by their own names, except the families of Ephraim and Manasseh, both of whom wore born in Egypt, and Ard and Naaman, the sons of Bela the son of Benjamin (v. 40). And I have found in the work of R. Moses the Preacher why this was so in the case of the two latter — that their mother went down to Egypt when she was already pregnant with them so that they may be regarded as being among those who went down to Egypt, and on this account they formed separate families, just as Chamul and Chezron who were grandchildren of Judah (v. 21), and Cheber and Malkiel who were Asher’s grandchildren (v. 45). If this is an Agada, well and good; but if not, then I say that Bela had many grandchildren and that from these two, Ard and Naaman, there issued from each a large family, and the offspring of the other sons were called after Bela’s name, but the offspring of these two were called after their name. So, too, I say about the sons of Machir who formed two different families, one called after his name, and one called after the name of Gilead, his son, because it was a very large family. Five families are missing from Benjamin’s sons as stated before: here (i.e., by the fact that five of the families had become extinct) there was fulfilled part of his mother’s prophecy which is alluded to in the fact that she called him Ben Oni (my unfortunate son), (Genesis 35:18), whilst by the incident of the concubine in Gibea (Judges 20:35), the whole of it was fulfilled for practically the entire tribe was exterminated. This I found in the work of R. Moses the Preacher."}, {"ch": 26, "v": 25, "aliyah": 2, "heb": "אֵ֛לֶּה מִשְׁפְּחֹ֥ת יִשָּׂשכָ֖ר לִפְקֻדֵיהֶ֑ם אַרְבָּעָ֧ה וְשִׁשִּׁ֛ים אֶ֖לֶף וּשְׁלֹ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעֲיַת יִשָׂשׂכָר לְמִנְיָנֵיהוֹן שִׁתִּין וְאַרְבְּעָא אַלְפִין וּתְלַת מְאָה:", "onk_en": "These are the families of Yissachar and they numbered sixty-four thousand and three hundred.", "pj": "אִלֵין גְנִיסַת יִשָשׁכָר לִסְכוּמְהוֹן שִׁיתִּין וְאַרְבַּע אַלְפִין וּתְלַת מְאָה", "pj_en": "The numbers of the families of Issakar, sixty-four thousand three hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 26, "aliyah": 2, "heb": "בְּנֵ֣י זְבוּלֻן֮ לְמִשְׁפְּחֹתָם֒ לְסֶ֗רֶד מִשְׁפַּ֙חַת֙ הַסַּרְדִּ֔י לְאֵל֕וֹן מִשְׁפַּ֖חַת הָאֵלֹנִ֑י לְיַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַיַּחְלְאֵלִֽי׃", "onk": "בְּנֵי זְבוּלֻן לְזַרְעֲיַתְהוֹן לְסֶרֶד זַרְעִית סֶרֶד לְאֵלוֹן זַרְעִית אֵלוֹן לְיַחְלְאֵל זַרְעִית יַחְלְאֵל:", "onk_en": "The descendants of Zevulun by their families are: The Sardite family from Sered, the Eilonite family from Eilon, [and] the Yachle’eilite family from Yachle’eil.", "pj": "בְּנוֹי דִזְבוּלוּן לִגְנִיסַתְהוֹן לְסֶרֶד גְנִיסַת סֶרֶד לְאֵלוֹן גְנִיסַת אֵלוֹן לְיַחְלְאֵל גְנִיסַת יַחְלְאֵל", "pj_en": "Of Zebulon, with their families, of Sered, the family of Sered; of Elon, the family of Elon; of Jahleel, the family of Jahleel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 27, "aliyah": 2, "heb": "אֵ֛לֶּה מִשְׁפְּחֹ֥ת הַזְּבוּלֹנִ֖י לִפְקֻדֵיהֶ֑ם שִׁשִּׁ֥ים אֶ֖לֶף וַחֲמֵ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעֲיַת זְבוּלֻן לְמִנְיָנֵיהוֹן שִׁתִּין אַלְפִין וַחֲמֵשׁ מְאָה:", "onk_en": "These are the families of Zevulun and they numbered sixty thousand and five hundred.", "pj": "אִלֵין גְנִיסַת זְבוּלֻן לִסְכוּמְהוֹן שִׁיתִּין אַלְפִין וַחֲמֵשׁ מְאָה", "pj_en": "The numbers of the families of Zebulon, sixty thousand five hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 28, "aliyah": 2, "heb": "בְּנֵ֥י יוֹסֵ֖ף לְמִשְׁפְּחֹתָ֑ם מְנַשֶּׁ֖ה וְאֶפְרָֽיִם׃", "onk": "בְּנֵי יוֹסֵף לְזַרְעֲיַתְהוֹן מְנַּשֶּׁה וְאֶפְרָיִם:", "onk_en": "The descendants of Yoseif by their families are: Menashe and Ephraim.", "pj": "בְּנוֹי דְיוֹסֵף לִגְנִיסַתְהוֹן מְנַשֶׁה וְאֶפְרָיִם", "pj_en": "Of Joseph, with their families, Menasheh and Ephraim;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 29, "aliyah": 2, "heb": "בְּנֵ֣י מְנַשֶּׁ֗ה לְמָכִיר֙ מִשְׁפַּ֣חַת הַמָּכִירִ֔י וּמָכִ֖יר הוֹלִ֣יד אֶת־גִּלְעָ֑ד לְגִלְעָ֕ד מִשְׁפַּ֖חַת הַגִּלְעָדִֽי׃", "onk": "בְּנֵי מְנַשֶּׁה לְמָכִיר זַרְעִית מָכִיר וּמָכִיר אוֹלִיד יָת גִּלְעָד לְגִלְעָד זַרְעִית גִּלְעָד:", "onk_en": "The descendants of Menashe are: The Machirite family from Machir; Machir’s son was Gil’ad, the Gil’adite family from Gil’ad.", "pj": "בְּנוֹי דִמְנַשֶׁה לְמָכִיר גְנִיסַת מָכִיר וּמָכִיר אוֹלִיד יַת גִלְעָד לְגִלְעָד גְנִיסַת גִלְעָד", "pj_en": "the Beni Menasheh, of Makir, the family of Makir, and Makir begat Gilead; of Gilead, the family of Gilead.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 30, "aliyah": 2, "heb": "אֵ֚לֶּה בְּנֵ֣י גִלְעָ֔ד אִיעֶ֕זֶר מִשְׁפַּ֖חַת הָאִֽיעֶזְרִ֑י לְחֵ֕לֶק מִשְׁפַּ֖חַת הַֽחֶלְקִֽי׃", "onk": "אִלֵּין בְּנֵי גִּלְעָד אִיעֶזֶר זַרְעִית אִיעֶזֶר לְחֵלֶק זַרְעִית חֵלֶק:", "onk_en": "The descendants of Gil’ad are: The I’ezerite family from I’ezer, the Chelkite family from Cheilek,", "pj": "אִלֵין בְּנוֹי דְגִלְעָד אִיעֶזֶר גְנִיסַת אִיעֶזֶר לְחֵלֶק גְנִיסַת חֵלֶק", "pj_en": "These are the sons of Gilead, of Thezar, the family of Theazar; of Helek, the family of Helek.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 31, "aliyah": 2, "heb": "וְאַ֨שְׂרִיאֵ֔ל מִשְׁפַּ֖חַת הָאַשְׂרִֽאֵלִ֑י וְשֶׁ֕כֶם מִשְׁפַּ֖חַת הַשִּׁכְמִֽי׃", "onk": "וְאַשְׂרִיאֵל זַרְעִית אַשְׂרִיאֵלִי וְשֶׁכֶם זַרְעִית שֶׁכֶם:", "onk_en": "the Asrieilite family from Asrieil, the Shechemite family from Shechem,", "pj": "וְאַשְרִיאֵל גְנִיסַת אַשְרִיאֵל וְשֶׁכֶם גְנִיסַת שֶׁכֶם", "pj_en": "Of Asriel, the family of Asriel; of Shekem, the family of Shekem.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 32, "aliyah": 2, "heb": "וּשְׁמִידָ֕ע מִשְׁפַּ֖חַת הַשְּׁמִידָעִ֑י וְחֵ֕פֶר מִשְׁפַּ֖חַת הַֽחֶפְרִֽי׃", "onk": "וּשְׁמִידָע זַרְעִית שְׁמִידָע וְחֵפֶר זַרְעִית חֵפֶר:", "onk_en": "the Shemidaite family from Shemida, and the Chefrite family from Cheifer.", "pj": "וּשְׁמִידָע גְנִיסַת שְׁמִידָע וְחֵפֶר גְנִיסַת חֵפֶר", "pj_en": "Of Shemida, the family of Shemida; of Hepher, the family of Hepher.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 33, "aliyah": 2, "heb": "וּצְלׇפְחָ֣ד בֶּן־חֵ֗פֶר לֹא־הָ֥יוּ ל֛וֹ בָּנִ֖ים כִּ֣י אִם־בָּנ֑וֹת וְשֵׁם֙ בְּנ֣וֹת צְלׇפְחָ֔ד מַחְלָ֣ה וְנֹעָ֔ה חׇגְלָ֥ה מִלְכָּ֖ה וְתִרְצָֽה׃", "onk": "וּצְלָפְחָד בַּר חֵפֶר לָא הֲווֹ לֵיהּ בְּנִין אֶלָּהֵן בְּנָן וְשׁוּם בְּנַת צְלָפְחָד מַחְלָה וְנוֹעָה חָגְלָה מִלְכָּה וְתִרְצָה:", "onk_en": "Tzelofchad the son of Cheifer had no sons, only daughters; The name[s] of Tzelofchad’s daughters were Machlah, No’ah, Choglah, Milkah and Sirtzah.", "pj": "וּצְלָפְחָד בַּר חֵפֶר לָא הֲווֹ לֵיהּ בְּנִין אֱלָהֵן בְּנָן וְשׁוּם בְּנַת צְלָפְחָד מַחְלָה נוֹעָה חָגְלָה מִלְכָּה וְתִרְצָה", "pj_en": "But Zelophehad bar Hepher had no sons, but daughters only; and the names of the daughters of Zelophebad were, Mahelah, Nohah, Hogelah, Milchah, and Thirzah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 34, "aliyah": 2, "heb": "אֵ֖לֶּה מִשְׁפְּחֹ֣ת מְנַשֶּׁ֑ה וּפְקֻ֣דֵיהֶ֔ם שְׁנַ֧יִם וַחֲמִשִּׁ֛ים אֶ֖לֶף וּשְׁבַ֥ע מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעִית מְנַשֶּׁה וּמִנְיָנֵיהוֹן חַמְשִׁין וּתְרֵין אַלְפִין וּשְׁבַע מְאָה:", "onk_en": "These are the families of Menashe and they numbered fifty-two thousand and seven hundred.", "pj": "אִלֵין גְנִיסַת מְנַשֶׁה וּסְכוּמְהוֹן חַמְשִׁין וּתְרֵין אַלְפִין וּשְׁבַע מְאָה", "pj_en": "These are the families of Menasheh, and their number fifty-two thousand seven hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 35, "aliyah": 2, "heb": "אֵ֣לֶּה בְנֵי־אֶפְרַ֘יִם֮ לְמִשְׁפְּחֹתָם֒ לְשׁוּתֶ֗לַח מִשְׁפַּ֙חַת֙ הַשֻּׁ֣תַלְחִ֔י לְבֶ֕כֶר מִשְׁפַּ֖חַת הַבַּכְרִ֑י לְתַ֕חַן מִשְׁפַּ֖חַת הַֽתַּחֲנִֽי׃", "onk": "אִלֵּין בְּנֵי אֶפְרַיִם לְזַרְעֲיַתְהוֹן לְשׁוּתֶלַח זַרְעִית שׁוּתֶלַח לְבֶכֶר זַרְעִית בֶּכֶר לְתַחַן זַרְעִית תָּחַן:", "onk_en": "The descendants of Ephraim by their families are: The Shusalchite family from Shuselach, the Bachrite family from Becher, and the Tachanite family from Tachan.", "pj": "אִלֵין בְּנֵי אֶפְרַיִם לִסְכוּמְהוֹן לְשׁוּתֶלַח גְנִיסַת שׁוּתֶלַח לְבֶכֶר גְנִיסַת בֶּכֶר לְתַחַן גְנִיסַת תַּחַן", "pj_en": "The Beni Ephraim by their numbers, of Shuthelah, the family of Shutelah; of Bekir, the family of Bekir; of Tachan, the family of Tachan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 36, "aliyah": 2, "heb": "וְאֵ֖לֶּה בְּנֵ֣י שׁוּתָ֑לַח לְעֵרָ֕ן מִשְׁפַּ֖חַת הָעֵרָנִֽי׃", "onk": "וְאִלֵּין בְּנֵי שׁוּתָלַח לְעֵרָן זַרְעִית עֵרָן:", "onk_en": "These are the sons of Shuselach: The Eiranite family from Eiran.", "pj": "וְאִלֵין בְּנֵי שׁוּתֶלַח לְעֵרָן גְנִיסַת עֵרָן", "pj_en": "The sons of Shuthelah, of Heran, the family of Heran.", "tj": "", "tj_en": "", "rashi": "<b>ואלה בני שותלח וגו'.<\/b> שְׁאָר בְּנֵי שׁוּתֶלַח נִקְרְאוּ תוֹלְדוֹתֵיהֶם עַל שֵׁם שׁוּתֶלַח, וּמֵעֵרָן יָצְאָה מִשְׁפָּחָה רַבָּה וְנִקְרֵאת עַל שְׁמוֹ, וְנֶחְשְׁבוּ בְנֵי שׁוּתֶלַח לִשְׁתֵּי מִשְׁפָּחוֹת, צֵא וַחֲשֹׁב וְתִמְצָא בְּפָרָשָׁה זוֹ חֲמִשִּׁים וְשֶׁבַע מִשְׁפָּחוֹת וּמִבְּנֵי לֵוִי שְׁמוֹנֶה הֲרֵי שִׁשִּׁים וְחָמֵשׁ, וְזֶהוּ שֶׁנֶּאֱמַר \"כִּי אַתֶּם הַמְעַט\" וְגוֹ' — ה\"א מְעַט, חָמֵשׁ אַתֶּם חֲסֵרִים מִמִּשְׁפְּחוֹת כָּל הָעַמִּים, שֶׁהֵן שִׁבְעִים. אַף זוֹ הֵבַנְתִּי מִיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן, אַךְ הֻצְרַכְתִּי לִפְחֹת וּלְהוֹסִיף בִּדְבָרָיו:", "rashi_en": "ואלה בני שותלח וגו׳ AND THESE ARE THE SONS OF SHUTHELAH etc. — As for the other sons of Shuthelah their offspring were called after Shuthelah’s name; but out of Eron there issued a large family which was therefore called after his own name so that the children of Shuthelah were reckoned as two different families (the family of Shuthelah and the family of Eron). — Go and reckon and you will find in this section fifty seven families, and of the sons of Levi eight, so that there are sixty five in all. This is the meaning of what is said, (Deuteronomy 7:7): “For you are the least (המעט) [of all the peoples etc.].” The word המעט may be taken to signify: you are five (ה) less (מעט) than the families of all the nations, who are seventy in number. This, also, I understand from the work of R. Moses the Preacher, only that I have been compelled to omit from or add to his words."}, {"ch": 26, "v": 37, "aliyah": 2, "heb": "אֵ֣לֶּה מִשְׁפְּחֹ֤ת בְּנֵי־אֶפְרַ֙יִם֙ לִפְקֻ֣דֵיהֶ֔ם שְׁנַ֧יִם וּשְׁלֹשִׁ֛ים אֶ֖לֶף וַחֲמֵ֣שׁ מֵא֑וֹת אֵ֥לֶּה בְנֵי־יוֹסֵ֖ף לְמִשְׁפְּחֹתָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעֲיַת בְּנֵי אֶפְרַיִם לְמִנְיָנֵיהוֹן תְּלָתִין וּתְרֵין אַלְפִין וַחֲמֵשׁ מְאָה אִלֵּין בְּנֵי יוֹסֵף לְזַרְעֲיַתְהוֹן:", "onk_en": "These are the families of Ephraim’s descendants, and they numbered thirty-two thousand and five hundred; these are the descendants of Yoseif by their families.", "pj": "אִלֵין גְנִיסַת בְּנוֹי דְאֶפְרַיִם לִסְכוּמְהוֹן תְּלָתִין וּתְרֵין אַלְפִין וַחֲמֵשׁ מְאָה אִלֵין בְּנוֹי דְיוֹסֵף לִגְנִיסַתְהוֹן", "pj_en": "These are the families of Ephraim, and  their numbers thirty-two thousand five hundred, these are the families of Joseph.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 38, "aliyah": 2, "heb": "בְּנֵ֣י בִנְיָמִן֮ לְמִשְׁפְּחֹתָם֒ לְבֶ֗לַע מִשְׁפַּ֙חַת֙ הַבַּלְעִ֔י לְאַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽאַשְׁבֵּלִ֑י לַאֲחִירָ֕ם מִשְׁפַּ֖חַת הָאֲחִירָמִֽי׃", "onk": "בְּנֵי בִנְיָמִן לְזַרְעֲיַתְהוֹן לְבֶלַע זַרְעִית בֶּלַע לְאַשְׁבֵּל זַרְעִית אַשְׁבֵּל לַאֲחִירָם זַרְעִית אֲחִירָם:", "onk_en": "The descendants of Binyamin by their families were: The Balite family from Bela, the Ashbelite family from Ashbeil, the Achiramite family from Achiram,", "pj": "בְּנוֹי דְבִנְיָמִין לִגְנִיסַתְהוֹן לְבֶלַע גְנִיסַת בֶּלַע לְאַשְׁבֵּל גְנִיסַת אַשְׁבֵּל לַאֲחִירָם גְנִיסַת אֲחִירָם", "pj_en": "The families of Benjamin with their families, of Bela, the family of Bela; of Ashbel, the family of Ashbel; of Ahiram, the family of Ahiram.", "tj": "", "tj_en": "", "rashi": "<b>לאחירם.<\/b> הוּא אֵחִי שֶׁיָּרַד לְמִצְרַיִם, וּלְפִי שֶׁנִּקְרָא עַל שֵׁם יוֹסֵף שֶׁהָיָה אָחִיו וְרָם מִמֶּנּוּ נִקְרָא אֲחִירָם:", "rashi_en": "לאחירם OF AHIRAM — He is identical with Ehi (אחי) who went down to Egypt (Genesis 46:21), and because he was called after Joseph’s name (Sotah 36b), who was his (Benjamin’s) brother (אח) and greater, (רם) than he, he was also called Achiram. "}, {"ch": 26, "v": 39, "aliyah": 2, "heb": "לִשְׁפוּפָ֕ם מִשְׁפַּ֖חַת הַשּׁוּפָמִ֑י לְחוּפָ֕ם מִשְׁפַּ֖חַת הַחוּפָמִֽי׃", "onk": "לִשְׁפוּפָם זַרְעִית שְׁפוּפָם לְחוּפָם זַרְעִית חוּפָם:", "onk_en": "the Shufamite family from Shfufam, and the Chufamite family from Chufam.", "pj": "לִשְׁפוּפָם גְנִיסַת שְׁפוּפָם לְחוּפָם גְנִיסַת חוּפָם", "pj_en": "Of Shephuphia, the family of Shephuphia; of Hupham, the family of Hupham.", "tj": "", "tj_en": "", "rashi": "<b>לשפופם.<\/b> הוּא מֻפִּים, עַל שֵׁם שֶׁהָיָה יוֹסֵף שָׁפוּף בֵּין הָאֻמּוֹת:", "rashi_en": "\n לשפופם OF SHEFUFAM - he was identical with Muppim, but was so called also after Joseph because Joseph became enfeebled (שפוף) through his sufferings among the nations."}, {"ch": 26, "v": 40, "aliyah": 2, "heb": "וַיִּהְי֥וּ בְנֵי־בֶ֖לַע אַ֣רְדְּ וְנַעֲמָ֑ן מִשְׁפַּ֙חַת֙ הָֽאַרְדִּ֔י לְנַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽנַּעֲמִֽי׃", "onk": "וַהֲווֹ בְנֵי בֶלַע אַרְדְּ וְנַעֲמָן זַרְעִית הָאַרְדִּי לְנַעֲמָן זַרְעִית נַעֲמִי:", "onk_en": "The sons of Bela were Ard and Na’aman [giving rise to] the Ardite family, and the Na’amite family from Na’aman.", "pj": "וַהֲווֹ בְּנוֹי דְבֶלַע אַרְדְ וְנַעֲמָן גְנִיסַת אַרְדְ לְנַעֲמָן גְנִיסַת נַעֲמָן", "pj_en": "The sons of Bela, Ared and Naaman; the family of Ared; of Naaman, the family of Naaman.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 41, "aliyah": 2, "heb": "אֵ֥לֶּה בְנֵי־בִנְיָמִ֖ן לְמִשְׁפְּחֹתָ֑ם וּפְקֻ֣דֵיהֶ֔ם חֲמִשָּׁ֧ה וְאַרְבָּעִ֛ים אֶ֖לֶף וְשֵׁ֥שׁ מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין בְּנֵי בִנְיָמִן לְזַרְעֲיַתְהוֹן וּמִנְיָנֵיהוֹן אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְשִׁית מְאָה:", "onk_en": "These are the descendants of Binyamin by their families, and they numbered forty-five thousand and six hundred.", "pj": "אִלֵין בְּנוֹי דְבִנְיָמִן לִגְנִיסַתְהוֹן וּסְכוּמְהוֹן אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְשִׁית מְאָה", "pj_en": "These are the Beni Benjamin with their families, and their number forty-five thousand six hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 42, "aliyah": 2, "heb": "אֵ֤לֶּה בְנֵי־דָן֙ לְמִשְׁפְּחֹתָ֔ם לְשׁוּחָ֕ם מִשְׁפַּ֖חַת הַשּׁוּחָמִ֑י אֵ֛לֶּה מִשְׁפְּחֹ֥ת דָּ֖ן לְמִשְׁפְּחֹתָֽם׃", "onk": "אִלֵּין בְּנֵי דָן לְזַרְעֲיַתְהוֹן לְשׁוּחָם זַרְעִית שׁוּחָם אִלֵּין זַרְעֲיַת דָּן לְזַרְעֲיַתְהוֹן:", "onk_en": "These are the descendants of Don by their families: The Shuchamite family from Shucham, these are Don’s families.", "pj": "אִלֵין בְּנֵי דְדָן לִגְנִיסַתְהוֹן לְשׁוּחָם גְנִיסַת שׁוּחָם אִלֵין גְנִיסַת דָן לִגְנִיסַתְהוֹן", "pj_en": "The Beni Dan, with their families, of Shuham, the family of Shuham; These are the families of Beni Dan.", "tj": "", "tj_en": "", "rashi": "<b>לשוחם.<\/b> הוּא חֻשִׁים:", "rashi_en": "לשוחם OF SHUHAM — he is identical with Hushim (Genesis 46:23)."}, {"ch": 26, "v": 43, "aliyah": 2, "heb": "כׇּל־מִשְׁפְּחֹ֥ת הַשּׁוּחָמִ֖י לִפְקֻדֵיהֶ֑ם אַרְבָּעָ֧ה וְשִׁשִּׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "כָּל זַרְעֲיַת שׁוּחָם לְמִנְיָנֵיהוֹן שִׁתִּין וְאַרְבַּע אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "All Shuchamite families numbered sixty-four thousand and four hundred.", "pj": "כָּל גְנִיסַת שׁוּחָם לִסְכוּמְהוֹן שִׁיתִּין וְאַרְבְּעָא אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "The whole family of Shuham, their number sixty-four thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 44, "aliyah": 2, "heb": "בְּנֵ֣י אָשֵׁר֮ לְמִשְׁפְּחֹתָם֒ לְיִמְנָ֗ה מִשְׁפַּ֙חַת֙ הַיִּמְנָ֔ה לְיִשְׁוִ֕י מִשְׁפַּ֖חַת הַיִּשְׁוִ֑י לִבְרִיעָ֕ה מִשְׁפַּ֖חַת הַבְּרִיעִֽי׃", "onk": "בְּנֵי אָשֵׁר לְזַרְעֲיַתְהוֹן לְיִמְנָה זַרְעִית יִמְנָה לְיִשְׁוִי זַרְעִית יִשְׁוִי לִבְרִיעָה זַרְעִית בְּרִיעָה:", "onk_en": "The descendants of Asher by their families are: The Yimnite family from Yimnah, the Yishvite family from Yishvi, [and] the Bri’ite family from Briah .", "pj": "בְּנוֹי דְאָשֵׁר לִגְנִיסַתְהוֹן לְיִמְנָה גְנִיסַת יִמְנָה לְיִשְׁוָה גְנִיסַת יִשְׁוָה לִבְרִיעָה גְנִיסַת בְּרִיעָא", "pj_en": "Those of Asher with their families, of Jimnah, the family of Jimnah; of Jishvah, the family of Jishvah; of Beriah, the family of Beriah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 45, "aliyah": 2, "heb": "לִבְנֵ֣י בְרִיעָ֔ה לְחֶ֕בֶר מִשְׁפַּ֖חַת הַֽחֶבְרִ֑י לְמַ֨לְכִּיאֵ֔ל מִשְׁפַּ֖חַת הַמַּלְכִּיאֵלִֽי׃", "onk": "לִבְנֵי בְרִיעָה לְחֵבֶר זַרְעִית חֵבֶר לְמַלְכִּיאֵל זַרְעִית מַלְכִּיאֵל:", "onk_en": "The descendants of Briah are: The Chevronite family from Chever, the Malkieilite family from Malkieil.", "pj": "לִבְנוֹי דִבְרִיעָה לְחֵבֶר גְנִיסַת חֵבֶר לְמַלְכִּיאֵל גְנִיסַת מַלְכִּיאֵל", "pj_en": "and of the sons of Beriah, of Heber the family of Heber; of Malkiel, the family of Malkiel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 46, "aliyah": 2, "heb": "וְשֵׁ֥ם בַּת־אָשֵׁ֖ר שָֽׂרַח׃", "onk": "וְשׁוּם בַּת אָשֵׁר סָרַח:", "onk_en": "The name of Asher’s daughter was Serach.", "pj": "וְשׁוּם בְּרַת אָשֵׁר סָרַח דְאַדְבְּרַת בְּשִׁיתִּין רִיבְוָן מַלְאָכִין וְאִיתְעָלַת לְגִנְתָא דְעֵדֶן בְּחַיָיהָא מִן בִּגְלַל דְבַשְרַת יַת יַעֲקב דְעַד כְּדוּן יוֹסֵף קְיַים", "pj_en": "The name of the daughter of Asher was Sarach, who was conducted by six myriads of angels, and taken into the Garden of Eden alive, because she had made known to Jacob that Joseph was living.", "tj": "", "tj_en": "", "rashi": "<b>ושם בת אשר שרח.<\/b> לְפִי שֶׁהָיְתָה קַיֶּמֶת בְּחַיֶּיהָ מְנָאָהּ כָּאן (סדר עולם):", "rashi_en": "ושם בת אשר שרח AND THE NAME OF THE DAUGHTER OF ASHER WAS SERAH — Because she still remained alive after all these long years (Sotah 13a) it exceptionally mentions her here (Seder Olam 9)."}, {"ch": 26, "v": 47, "aliyah": 2, "heb": "אֵ֛לֶּה מִשְׁפְּחֹ֥ת בְּנֵי־אָשֵׁ֖ר לִפְקֻדֵיהֶ֑ם שְׁלֹשָׁ֧ה וַחֲמִשִּׁ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין זַרְעֲיַת בְּנֵי אָשֵׁר לְמְנְיְנֵיהוֹן חַמְשִׁין וּתְלָתָא אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "These are the families of Asher and they numbered fifty-three thousand and four hundred.", "pj": "אִלֵין גְנִיסַת בְּנוֹי דְאָשֵׁר לִסְכוּמְהוֹן חַמְשִׁין וּתְלַת אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "These are the families of Asher, their numbers fifty three thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 48, "aliyah": 2, "heb": "בְּנֵ֤י נַפְתָּלִי֙ לְמִשְׁפְּחֹתָ֔ם לְיַ֨חְצְאֵ֔ל מִשְׁפַּ֖חַת הַיַּחְצְאֵלִ֑י לְגוּנִ֕י מִשְׁפַּ֖חַת הַגּוּנִֽי׃", "onk": "בְּנֵי נַפְתָּלִי לְזַרְעֲיַתְהוֹן לְיַחְצְאֵל זַרְעִית יַחְצְאֵל לְגוּנִי זַרְעִית גּוּנִי:", "onk_en": "The descendants of Naftali by their families are: the Yachtze’eilite family from Yachtze’eil, the Gunite family from Guni,", "pj": "בְּנוֹי דְנַפְתָּלִי לִגְנִיסַתְהוֹן לְיַחְצְאֵל גְנִיסַת יַחְצְאֵל לְגוּנִי גְנִיסַת גוּנִי", "pj_en": "The Beni Naphtali, according to their families, of Jaczeel, the family of Jaczeel; of Guni, the family of Guni.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 49, "aliyah": 2, "heb": "לְיֵ֕צֶר מִשְׁפַּ֖חַת הַיִּצְרִ֑י לְשִׁלֵּ֕ם מִשְׁפַּ֖חַת הַשִּׁלֵּמִֽי׃", "onk": "לְיֵצֶר זַרְעִית יֵצֶר לְשִׁלֵּם זַרְעִית שִׁלֵּם:", "onk_en": "the Yitzrite family from Yeitzer, and the Shileimite family from Shileim.", "pj": "לְיֵצֶר גְנִיסַת יֵצֶר לְשִׁלֵם גְנִיסַת שִׁלֵם", "pj_en": "Of Jezer, the family of Jezer; of Shillem, the family of Shillem.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 50, "aliyah": 2, "heb": "אֵ֛לֶּה מִשְׁפְּחֹ֥ת נַפְתָּלִ֖י לְמִשְׁפְּחֹתָ֑ם וּפְקֻ֣דֵיהֶ֔ם חֲמִשָּׁ֧ה וְאַרְבָּעִ֛ים אֶ֖לֶף וְאַרְבַּ֥ע מֵאֽוֹת׃", "onk": "אִלֵּין זַרְעֲיַת נַפְתָּלִי לְזַרְעֲיַתְהוֹן וּמִנְיָנֵיהוֹן אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְאַרְבַּע מְאָה:", "onk_en": "These are the families of Nafatli and they numbered forty-five thousand and four hundred.", "pj": "אִלֵין גְנִיסַת נַפְתָּלִי לִגְנִיסַתְהוֹן וּסְכוּמְהוֹן אַרְבְּעִין וְחַמְשָׁא אַלְפִין וְאַרְבַּע מְאָה", "pj_en": "The Beni Naphtali, according to their families, and their number forty-five thousand four hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 51, "aliyah": 2, "heb": "אֵ֗לֶּה פְּקוּדֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל שֵׁשׁ־מֵא֥וֹת אֶ֖לֶף וָאָ֑לֶף שְׁבַ֥ע מֵא֖וֹת וּשְׁלֹשִֽׁים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אִלֵּין מִנְיָנֵי בְּנֵי יִשְׂרָאֵל שִׁית מְאָה וְחַד אַלְפִין שְׁבַע מְאָה וּתְלָתִין:", "onk_en": "The total number of Bnei Yisroel was six hundred and one thousand, seven hundred and thirty.", "pj": "אִלֵין סְכוּמֵי בְּנֵי יִשְרָאֵל שִׁית מְאָה וְחַד אַלְפִין וּשְׁבַע מְאָה וּתְלָתִין", "pj_en": "These are the numbers of the sons of Israel, six hundred and one thousand seven hundred and thirty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 52, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying.", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 26, "v": 53, "aliyah": 3, "heb": "לָאֵ֗לֶּה תֵּחָלֵ֥ק הָאָ֛רֶץ בְּנַחֲלָ֖ה בְּמִסְפַּ֥ר שֵׁמֽוֹת׃", "onk": "לְאִלֵּין תִּתְפְּלֵג אַרְעָא בְּאַחֲסָנָא בְּמִנְיַן שְׁמָהָן:", "onk_en": "“The land shall be apportioned among these, as an inheritance according to the number of names.", "pj": "לְאִלֵין שִׁבְטַיָא תִּתְפַּלֵג אַרְעָא בְּאַחֲסָנָא בְּמִנְיַן שְׁמָהָן", "pj_en": "Unto these tribes shall the land be divided by inheritances according to their names.", "tj": "", "tj_en": "", "rashi": "<b>לאלה תחלק הארץ.<\/b> וְלֹא לַפְּחוּתִים מִבֶּן עֶשְׂרִים אַעַ\"פִּ שֶׁבָּאוּ לִכְלַל עֶשְׂרִים בְּטֶרֶם חִלּוּק הָאָרֶץ; שֶׁהֲרֵי שֶׁבַע שָׁנִים כָּבְשׁוּ וְשֶׁבַע חִלְּקוּ, לֹא נָטְלוּ חֵלֶק בָּאָרֶץ אֶלָּא אֵלּוּ שֵׁשׁ מֵאוֹת אֶלֶף וָאֶלֶף, וְאִם הָיוּ לְאֶחָד מֵהֶם שִׁשָּׁה בָנִים לֹא נָטְלוּ אֶלָּא חֵלֶק אֲבִיהֶם לְבַדּוֹ (בבא בתרא קי\"ז):", "rashi_en": "לאלה תחלק הארץ TO THESE THE LAND SHALL BE DIVIDED, and not to any who are now less than twenty years old; even though they become included among those who are twenty before the division of the land, — for they were seven years in conquering it and seven years did they take in dividing it — for no one received a portion in the land except these 601,000 and if one of these had six sons, they received only their father’s portion (cf. Bava Batra 117a)."}, {"ch": 26, "v": 54, "aliyah": 3, "heb": "לָרַ֗ב תַּרְבֶּה֙ נַחֲלָת֔וֹ וְלַמְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑וֹ אִ֚ישׁ לְפִ֣י פְקֻדָ֔יו יֻתַּ֖ן נַחֲלָתֽוֹ׃", "onk": "לְסַגִּיאֵי תַּסְגּוּן אַחֲסַנְתְּהוֹן וְלִזְעִירֵי תַּזְעֲרוּן אַחֲסַנְתְּהוֹן גְּבַר לְפוּם מִנְיָנוֹהִי תִּתְיְהַב אַחֲסַנְתֵּיהּ:", "onk_en": "To the large [tribe], increase their inheritance, and to the small, diminish their inheritance; each person, according to his number, shall be given his inheritance.", "pj": "לְשִׁבְטָא דְעַמֵיהּ סַגִי תִּסְגוּן אַחְסַנְתְּהוֹן וּלְשִׁבְטָא דְעַמֵיהּ זְעֵיר תַּזְעֵיר אַחְסַנְתְּהוֹן גְבַר לְפוּם סְכוּמְהוֹן יִתְיְהַב אַחְסַנְתֵּיהּ", "pj_en": "To that tribe whose people are many thou shalt make their inheritance large, and to the tribe whose people are few thou shalt give a smaller inheritance; to each his heritage shall be given according to the number of his names.", "tj": "", "tj_en": "", "rashi": "<b>לרב תרבה נחלתו.<\/b> לְשֵׁבֶט שֶׁהָיָה מְרֻבֶּה בְּאֻכְלוּסִין נָתְנוּ חֵלֶק רַב, וְאַף עַל פִּי שֶׁלֹא הָיוּ הַחֲלָקִים שָׁוִים, שֶׁהֲרֵי הַכֹּל לְפִי רִבּוּי הַשֵּׁבֶט חָלְקוּ הַחֲלָקִים, לֹא עָשׂוּ אֶלָּא עַ\"יְ גוֹרָל, וְהַגּוֹרָל הָיָה עַל פִּי רוּחַ הַקֹּדֶשׁ, כְּמוֹ שֶׁמְּפֹרָשׁ בְּבָבָא
