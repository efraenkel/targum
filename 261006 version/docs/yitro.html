ָת עֲלָוָתָךְ וְיָת נִכְסַת קוּדְשָׁךְ מִן עָנָךְ וּמִן תּוֹרָךְ בְּכָל אַתְרָא דִי <b>אַשְׁרֵי יָת שְׁכִנְתִּי לְתַמָן אֶשְׁלַח בִּרְכְּתִי<\/b> לָךְ וֶאֱבָרֵכִנָךְ:", "onk_en": "Make an earthen altar for [<b>before<\/b>] Me and slaughter your burnt-offerings near it, your peace-offerings, your sheep and your cattle. In every place wherever I permit My Name to be mentioned [<b>rest My Shechina<\/b>], I will come [<b>there I will send my blessing<\/b>] to you and bless you.", "pj": "מַדְבַּח אַדְמְתָא תַעֲבֵיד לִשְׁמִי וּתְהֵי דַבַּח עֲלוֹי יַת עַלְוָותָךְ וְיַת נִכְסַת קוּדְשָׁךְ מִן עָנָךְ וּמִן תּוֹרָךְ בְּכָל אַתְרָא דְאַשְׁרֵי שְׁכִינְתִּי וְאַנְתְּ פְּלַח קֳדָמַי תַּמָּן אֲשַׁלַח עֲלָךְ בִּרְכָתִי וְאֵיבָרֵיכִינָךְ", "pj_en": "An altar of earth ye shall make to My Name, and sacrifice upon it thy burnt offerings and thy sanctified oblations from thy sheep and from thy oxen. And in every place where My Shekinah shall dwell, and thou worship before Me, there will I send My blessing upon thee, and will bless thee.", "tj": "מַדְבַּח קָבִיעַ בְּאַרְעָא תַעַבְדוּן לִשְׁמִי וְתִקְרְבוּן עֲלוֹי יַת עַלְוַותְכוֹן וְיַת נִכְסַת קוּדְשֵׁיכוֹן יַת עַנְכוֹן וְיַת תּוֹרֵיכוֹן בְּכָל אֲתַר דְּתִדְכְּרוּן יַת שְׁמִי קַדִּישָׁא מֵימְרִי מִתְגְּלֵי עֲלֵיכוֹן וּמְבָרֵךְ יַתְכוֹן:", "tj_en": "An altar grounded in the earth shalt thou make unto My name, and shalt offer upon it your burnt offerings and sacred oblations, your sheep and your oxen. In every place in which ye shall memorialize My holy Name, My Word shall be revealed to you, and bless you.", "rashi": "<b>מזבח אדמה.<\/b> מְחֻבָּר בַּאֲדָמָה, שֶׁלֹּא יִבְנֶנּוּ עַל גַּבֵּי עַמּוּדִים אוֹ עַל גַּבֵּי בָּסִיס; דָּ\"אַ שֶׁהָיָה מְמַלֵּא אֶת חֲלַל מִזְבַּח הַנְּחֹשֶׁת אֲדָמָה בִּשְׁעַת חֲנִיָּתָן (שם):<br><br><b>תעשה לי.<\/b> שֶׁתְּהֵא תְּחִלַּת עֲשִׂיָּתוֹ לִשְׁמִי:<br><br><b>וזבחת עליו.<\/b> אֶצְלוֹ, כְּמוֹ וְעָלָיו מַטֵּה מְנַשֶּׁה (במדבר ב'), אוֹ אֵינוֹ אֶלָּא עָלָיו מַמָּשׁ? תַּ\"לֹ הַבָּשָׂר וְהַדָּם עַל מִזְבַּח ה' אֱלֹהֶיךָ (דברים י\"ב), וְאֵין שְׁחִיטָה בְּרֹאשׁ הַמִּזְבֵּחַ:<br><br><b>את עלתיך ואת שלמיך.<\/b> אֲשֶׁר מִצֹּאנְךָ וּמִבְּקָרֶךָ: (<b>את צאנך ואת בקרך.<\/b> פֵּרוּשׁ לְאֶת עוֹלֹתֶיךָ וְאֶת שְׁלָמֶיךָ:)<br><br><b>בכל המקום אשר אזכיר את שמי.<\/b> אֲשֶׁר אֶתֵּן לְךָ רְשׁוּת לְהַזְכִּיר שֵׁם הַמְפֹרָשׁ שֶׁלִּי, שָׁם <b>אבוא אליך וברכתיך<\/b> – אַשְׁרֶה שְׁכִינָתִי עָלֶיךָ; מִכָּאן אַתָּה לָמֵד שֶׁלֹּא נִתַּן רְשׁוּת לְהַזְכִּיר שֵׁם הַמְפֹרָשׁ אֶלָּא בְּמָקוֹם שֶׁהַשְּׁכִינָה בָאָה שָׁם, וְזֶהוּ בֵית הַבְּחִירָה, שָׁם נָתַן רְשׁוּת לַכֹּהֲנִים לְהַזְכִּיר שֵׁם הַמְפֹרָשׁ בִּנְשִׂיאַת כַּפַּיִם לְבָרֵךְ אֶת הָעָם (סוטה ל\"ח):", "rashi_en": "מזבח אדמה AN ALTAR OF EARTH [SHALT THOU MAKE] — i. e. an altar attached to the earth, meaning, that they should not build an altar upon columnes or upon a base but it must rest upon the actual ground. Another explanation is, that one should fill the hollow interior of the copper altar (Exodus 27:8) with earth at the time when they encamp, and then erect it for the purpose of sacrifice (Mekhilta).<br><br>תעשה לי THOU SHALT MAKE FOR ME — this implies that from its very beginning it shall be made for My Name (i. e. for the service of Me).<br><br>וזבחת עליו AND THOU SHALT SACRIFICE (slaughter) עליו — i. e. near it, in the same sense as, (Numbers 2:20) “and by him (ועליו) the tribe of Manasseh”. Or perhaps this is not the meaning, but it means “[thou shalt slaughter] upon it”, in its literal sense? This cannot be so, because it states, (Deuteronomy 12:27) “[And thou shalt offer thy burnt offerings] as regards the flesh and the blood upon the altar of the Lord thy God”, but the slaughtering shall not be on the top of the altar (Mekhilta).<br><br>את עלתיך ואת שלמיך THY BURNT OFFERINGS AND THY FEAST OFFERINGS which are from (belong to) thy flocks and thy herds. [את צאנך ואת בקרך are thus a further explanation of the words את עלתיך ואת שלמיך‎].<br><br>בכל המקום אשר אזכיר את שמי IN ALL PLACES WHERE I MENTION MY NAME — This means: where I will give you permission to mention My Proper Name, there אבא אליך וברכתיך I WILL COME TO THEE AND I WILL BLESS THEE — I will make My Shechina rest upon thee. From this you may learn that He did not give any permission to mention (pronounce) His Proper Name except in the place where the Shechina would come — and this is the Chosen House (another term for the Temple at Jerusalem). He gave permission to the priests to pronounce His Proper Name there whilst lifting up their hands to bless the people (cf. Mekhilta; Sotah 38a; and Rashi on Numbers 6:27)."}, {"ch": 20, "v": 22, "aliyah": 7, "heb": "וְאִם־מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה־לִּ֔י לֹֽא־תִבְנֶ֥ה אֶתְהֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּךָ֛ הֵנַ֥פְתָּ עָלֶ֖יהָ וַתְּחַֽלְלֶֽהָ׃", "onk": "וְאִם מַדְבַּח אַבְנִין תַּעְבֵּד <b>קֳדָמַי<\/b> לָא תִבְנֵי יָתְהוֹן פְּסִילָן דִלְמָא תְרִים חַרְבָּךְ עֲלַהּ וּתְחַלְלִנַהּ:", "onk_en": "When you build a stone altar for [<b>before<\/b>] Me, do not build it out of hewn stone, lest you lift your sword on it, you will [therewith] have profaned it.", "pj": "וְאִם מַדְבַּח אַבְנִין תַּעֲבֵיד לִשְׁמִי לָא תִבְנֵי יַתְהוֹן חֲצִיבִין דְּאִין אֲרֵימַת פַּרְזְלָא דְמִנֵיהּ מִתְעֲבֵיד סְיָיפָא עַל אַבְנָא אַפִיסְתָּא יָתָהּ", "pj_en": "But if thou wilt make an altar of stones unto My Name, thou shalt not build them sculptured; for if thou lift up iron, from which the sword is made, upon the stone, thou wilt profane it.", "tj": "וְאִם מַדְבַּח אַבְנִין תַּעַבְדוּן לִשְׁמִי לָא תִבְנֵי יַתְהוֹן חֲצִיבִין אֲרוּם פַּרְזְלָא חַרְבָּא מִתְעַבִיד מִנֵיהּ אִי עַבְרַת פַּרְזְלָא עֲלוֹי אַפִיסַת יָתֵיהּ:", "tj_en": "But if you make an altar of stones unto My Name, you shall not build it with sculptured ones, because the sword is made of iron. If thou workest with iron upon it, thou wilt profane it.", "rashi": "<b>ואם מזבח אבנים.<\/b> רַבִּי יִשְׁמָעֵאל אוֹמֵר כָּל אִם וְאִם שֶׁבַּתּוֹרָה רְשׁוּת חוּץ מִג', וְאִם מִזְבַּח אֲבָנִים תַּעֲשֶׂה לִּי, הֲרֵי אִם זֶה מְשַׁמֵּשׁ בִּלְשׁוֹן כַּאֲשֶׁר – וְכַאֲשֶׁר תַּעֲשֶׂה לִי מִזְבַּח אֲבָנִים <b>לא תבנה אתהן גזית<\/b>, שֶׁהֲרֵי חוֹבָה עָלֶיךָ לִבְנוֹת מִזְבַּח אֲבָנִים, שֶׁנֶּאֱמַר אֲבָנִים שְׁלֵמוֹת תִּבְנֶה (דברים כ\"ז) – וְכֵן אִם כֶּסֶף תַּלְוֶה (שמות כ\"ב), חוֹבָה הוּא, שֶׁנֶּאֱמַר וְהַעֲבֵט תַּעֲבִיטֶנּוּ (דברים ט\"ו) – וְאַף זֶה מְשַׁמֵּשׁ בִּלְשׁוֹן כַּאֲשֶׁר – וְכֵן וְאִם תַּקְרִיב מִנְחַת בִּכּוּרִים (ויקרא ב'), זוֹ מִנְחַת הָעֹמֶר שֶׁהִיא חוֹבָה, וְעַל כָּרְחֲךָ אֵין אִם הַלָּלוּ תְּלוּיִין אֶלָּא וַדָּאִין, וּבִלְשׁוֹן כַּאֲשֶׁר הֵם מְשַׁמְּשִׁים:<br><br><b>גזית.<\/b> לְשׁוֹן גְּזִיזָה, שֶׁפּוֹסְלָן וּמְכַתְּתָן בְּבַרְזֶל:<br><br><b>כי חרבך הנפת עליה.<\/b> הֲרֵי כִּי זֶה מְשַׁמֵּשׁ בִּלְשׁוֹן פֶּן, שֶׁהוּא דִּילְמָא – פֶּן תָּנִיף חַרְבְּךָ עָלֶיהָ:<br><br><b>ותחללה.<\/b> הָא לָמַדְתָּ שֶׁאִם הֵנַפְתָּ עָלֶיהָ בַּרְזֶל חִלַּלְתָּ, שֶׁהַמִּזְבֵּחַ נִבְרָא לְהַאֲרִיךְ יָמָיו שֶׁל אָדָם וְהַבַּרְזֶל נִבְרָא לְקַצֵּר יָמָיו שֶׁל אָדָם, אֵין זֶה בַּדִּין שֶׁיּוּנַף הַמְקַצֵּר עַל הַמַּאֲרִיךְ (מכילתא). וְעוֹד שֶׁהַמִּזְבֵּחַ מֵטִיל שָׁלוֹם בֵּין יִשְׂרָאֵל לַאֲבִיהֶם שֶׁבַּשָּׁמַיִם, לְפִיכָךְ לֹא יָבֹא עָלָיו כּוֹרֵת וּמְחַבֵּל; וַהֲרֵי דְּבָרִים קַל וָחֹמֶר, וּמָה אֲבָנִים שֶׁאֵינָן רוֹאוֹת וְלֹא שׁוֹמְעוֹת וְלֹא מְדַבְּרוֹת, עַל יְדֵי שֶׁמְּטִילוֹת שָׁלוֹם אָמְרָה תּוֹרָה וְלֹא תָנִיף עֲלֵיהֶם בַּרְזֶל, הַמֵּטִיל שָׁלוֹם בֵּין אִישׁ לְאִשְׁתּוֹ, בֵּין מִשְׁפָּחָה לְמִשְׁפָּחָה, בֵּין אָדָם לַחֲבֵרוֹ, עַל אַחַת כַּמָּה וְכַמָּה שֶׁלֹּא תְבוֹאֵהוּ פֻּרְעָנוּת (שם):", "rashi_en": "ואם מזבח אבנים AND IF (according to Rashi, AND WHEN) [THOU WILT MAKE ME] AN ALTAR OF STONES — Rabbi Ishmael said: Every time the word אם it used in the Torah it refer to some action the doing of which is optional, except in three instances. Here: ואם מזבח אבנים תעשה לי — you see that this אם is used in the sense of כאשר, “when”, the meaning being: “And when thou makest me an altar of stone, לא תבנה אתהן גזית THOU SHALT NOT BUILD IT OF HEWN STONE, for, as a matter of fact, it is obligatory upon thee to build an altar of stone, as it is said, (Deuteronomy 27:6) “of whole stones thou shalt build [the altar of the Lord thy God]”. Similarly, (Exodus 22:24) אם כסף תלוה את עמי is obligatory and signifies: “when (אם) thou lendest My people money”, and not, “if thou lendest”, because it is said, (Deuteronomy 15:8) “And thou shalt surely lend him”; consequently this אם also is used in the sense of כאשר “when”. Similarly, (Leviticus 2:14) ואם תקריב מנחת בכורים, for this refers to the meal-offering of the Omer which is obligatory and therefore the trantlation is, “And when (ואם) thou offerest the meal-offering of first-fruits”, and not, “if thou offerest”. You must therefore admit that these instances of אם are not conditional, meaning “if”, but they are absolute, and that they are used in the sense of כאשר, “when” (Mekhilta; Yalkut Shimoni on Torah 306; cf. Rashi on Leviticus 2:14).<br><br>גזית — This has the meaning of cutting (גזיזה), the stones being thus called because one hews them and cuts them with an iron tool (Mekhilta).<br><br>כי חרבך הנפת עליה — This word כי is used here in the sense of פן, which signifies “perhaps it may be” (and it does not mean “because”) — “perhaps it may happen that thou liftest up thy iron tool above it”.<br><br>ותחללה THEN THOU HAST PROFANED IT — Thus you may learn that if thou liftest up thy iron tool above it thou profanest it. The reason of this is, because the altar is created (its purpose is) to lengthen man’s days and iron has been created (one of its purposes is) to shorten man’s days, it is not right that an object which shortens man’s life should be lifted up above that which lengthens it (Mekhilta, Middoth 3:4). And a further reason is: because the altar makes peace between Israel and their Father in Heaven, and therefore there should not come upon it anything that cuts and destroys. Now, the following statement follows logically, à fortiori: How is it in the case of stones which cannot see nor hear nor speak? Because that they promote peace Scripture ordains, “Thou shalt not lift up against them any iron tool!” Then in the case of one who makes peace between a man and his wife, between family and family, between a man and his fellow, how much more certain is it that punishment will not come upon him (Mekhilta)."}, {"ch": 20, "v": 23, "aliyah": 7, "heb": "וְלֹֽא־תַעֲלֶ֥ה בְמַעֲלֹ֖ת עַֽל־מִזְבְּחִ֑י אֲשֶׁ֛ר לֹֽא־תִגָּלֶ֥ה עֶרְוָתְךָ֖ עָלָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלָא תִסַק בְּדַרְגִין עַל מַדְבְּחִי דִי לָא תִתְגְלֵי עֶרְיְתָךְ עֲלוֹהִי:", "onk_en": "Do not go up to My altar with steps, so that your nakedness not be revealed on it.’”", "pj": "וְאַתּוּן כַּהֲנַיָא דְקַיְימִין לְמִשַׁמְשָׁא קֳדָמַי לָא תִסְקוּן בְּמַסוּקְיָין עַל מַדְבְּחִי אֱלָהֵן בְּגִשְׁרַיָא דְלָא תִּתְחַמֵי עִירְיָתָךְ עֲלוֹי", "pj_en": "And you, the priests, who stand to minister before Me, shall not ascend to My altar by steps, but by (sloping) bridges; that thy shame may not be seen thereupon.", "tj": "וְאַתּוּן כַּהֲנַיָא בְּנוֹי דְאַהֲרן דְּקַיְימִין וּמְשַׁמְשִׁין עַל גַּבֵּי מַדְבְּחִי לָא תִסְגוּן בְּדַרְגִין עַל מַדְבְּחִי דְּלָא תִתְגְלֵי עֶרְיָתָךְ עֲלוֹי:", "tj_en": "You also, the priests, the sons of Aharon, who stand and minister beside Mine altar, shall not ascend by steps unto Mine altar, lest your shame be disclosed upon it.", "rashi": "<b>ולא תעלה במעלת.<\/b> כְּשֶׁאַתָּה בוֹנֶה כֶבֶשׁ לַמִּזְבֵּחַ לֹא תַעֲשֵׂהוּ מַעֲלוֹת מַעֲלוֹת, אשקלו\"נש בְּלַעַז, אֶלָּא חָלָק יְהֵא וּמְשֻׁפָּע:<br><br><b>אשר לא תגלה ערותך.<\/b> שֶׁעַל יְדֵי הַמַּעֲלוֹת אַתָּה צָרִיךְ לְהַרְחִיב פְּסִיעוֹתֶיךָ; וְאַעַ\"פִּ שֶׁאֵינוֹ גִּלּוּי עֶרְוָה מַמָּשׁ, שֶׁהֲרֵי כְתִיב וַעֲשֵׂה לָהֶם מִכְנְסֵי בָד, מִכָּל מָקוֹם הַרְחָבַת הַפְּסִיעוֹת קָרוֹב לְגִלּוּי עֶרְוָה הוּא, וְאַתָּה נוֹהֵג בָּם מִנְהַג בִּזָּיוֹן; וַהֲרֵי דְּבָרִים קַ\"וָ, וּמָה אֲבָנִים הַלָּלוּ שֶׁאֵין בָּהֶם דַּעַת לְהַקְפִּיד עַל בִּזְיוֹנָן, אָמְרָה תוֹרָה הוֹאִיל וְיֵשׁ בָּהֶם צֹרֶךְ לֹא תִנְהַג בָּהֶם מִנְהַג בִּזָּיוֹן, חֲבֵרְךָ שֶׁהוּא בִדְמוּת יוֹצֶרְךָ, וּמַקְפִּיד עַל בִּזְיוֹנוֹ, עַל אַחַת כַּמָּה וְכַמָּה:", "rashi_en": "ולא תעלה במעלות AND THOU SHALT NOT GO UP BY STEPS [TO MY ALTAR] — When thou buildest an ascent to the altar thou shalt not construct it of steps, échelons in old French, but it shall be even (i. e. the surface shall be unbroken) and sloping (cf. Rashi on Exodus 27:5).<br><br>אשר לא תגלה ערותך THAT THY NAKEDNESS BE NOT UNCOVERED — because on account of these steps you will have to take large paces and so spread the legs. Now, although this would not be an actual uncovering of one’s nakedness (of the parts usually kept covered), since it is written, (Exodus 28:42) “And thou shalt make for them (the priests) linen breeches [to cover the flesh of their nakedness]”, still the taking of large paces is near enough to uncovering one’s nakedness that it may be described as such, and you would then be treating them (the stones of the altar) in a manner that implies disrespect. Now the following statement follows logically à fortiori: How is it in the case of stones which have no sense (feeling) to be particular about any disrespect shown to them? Scripture ordains that since they serve some useful purpose you should not treat them in a manner that implies disrespect! Then in the case of your fellow-man who is made in the image of your Creator and who is particular about any disrespect shown to him, how much more certain is it that you should not treat him disrespectfully! (Mekhilta)"}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
