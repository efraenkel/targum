b>] should occur among men and they bring it to court and they judge them and they determine who is righteous and they convict the villain.", "pj": "אֲרוּם יְהֵי תִיגְרָא בֵּין תְּרֵין גּוּבְרַיָא וְיִתְקַרְבוּן לְוַת דִּינָא וִידוֹנוּן יַתְהוֹן וְיִכְרְעוּן לִזְכוּתָא יַת זַכָּאָה וּלְחוֹבָא יַת חַיָּיבָא", "pj_en": "If there be a controversy, between two men, then they shall come to the judges, and they shall judge them, and give the decision (or outweighing of) righteousness to the innocent, and of condemnation to the guilty.", "tj": "", "tj_en": "", "rashi": "<b>כי יהיה ריב.<\/b> סוֹפָם לִהְיוֹת נִגָּשִׁים אֶל הַמִּשְׁפָּט. אֱמֹר מֵעַתָּה אֵין שָׁלוֹם יוֹצֵא מִתּוֹךְ מְרִיבָה, מִי גָּרַם לְלוֹט לִפְרֹשׁ מִן הַצַּדִּיק? הֱוֵי אוֹמֵר זוֹ מְרִיבָה:<br><br><b>והרשיעו את הרשע.<\/b> יָכוֹל כָּל הַמִּתְחַיְּבִין בַּדִּין לוֹקִין, תַּלְמוּד לוֹמַר — <b>והיה אם בן הכות הרשע.<\/b> פְּעָמִים לוֹקֶה וּפְעָמִים אֵינוֹ לוֹקֶה. וּמִי הוּא הַלּוֹקֶה? לְמֹד מִן הָעִנְיָן, \"לֹא תַחְסֹם שׁוֹר בְּדִישׁוֹ\" — לָאו שֶׁלֹּא נִתַּק לַעֲשֵׂה (עי' ספרי; מכות י\"ג):", "rashi_en": "כי יהיה ריב IF THERE BE A QUARREL [BETWEEN MEN] they will in the end have to approach the judges (because of a bodily injury inflicted by one on the other, since Scripture goes on to state, “and if the wicked man be worthy of lashes”, a punishment that can only follow, in the case of a quarrel, upon one of the parties receiving a blow). You must thus come to the conclusion that nothing good can come out of a quarrel. Just think: what was it that caused Lot to leave the righteous man (Abraham)? You must admit it was a mere quarrel (cf. Genesis 13:7—11; Sifrei Devarim 286:1).<br><br>והרשיעו את הרשע THEY SHALL CONDEMN THE WICKED — One might think that all who are found guilty in a law-suit are punished with lashes; Scripture, however, goes on to state, והיה אם בן הכות הרשע AND IT SHALL BE, IF THE WICKED MAN BE WORTHY TO BE BEATEN, [… THAT THE JUDGE SHALL SMITE HIM] — “if”: you learn, therefore, that sometimes he receives lashes and sometimes he does not receive lashes. Who it is that may be punished with lashes can be learnt from the context: (v. 4) “Thou shalt not muzzle the ox when he treadeth out the corn” — which is לאו שלא נתק לעשה a prohibition which is not attached to a positive command (cf. Sifrei Devarim 286:4; Makkot 13b)."}, {"ch": 25, "v": 2, "aliyah": 7, "heb": "וְהָיָ֛ה אִם־בִּ֥ן הַכּ֖וֹת הָרָשָׁ֑ע וְהִפִּיל֤וֹ הַשֹּׁפֵט֙ וְהִכָּ֣הוּ לְפָנָ֔יו כְּדֵ֥י רִשְׁעָת֖וֹ בְּמִסְפָּֽר׃", "onk": "וִיהֵי אִם בַּר חַיָּבָא <b>לְאַלְקָאָה<\/b> חַיָּבָא וְיִרְמִנֵּיהּ דַּיָּנָא וְיַלְקִנֵּיהּ קֳדָמוֹהִי <b>כְּמִסַּת<\/b> חוֹבְתֵיהּ בְּמִנְיָן:", "onk_en": "Should the wicked one deserve flogging, the judge shall incline him and have him flogged before him in the amount befitting his crime, with the number near.", "pj": "וִיהֵי אִין מִתְחַיֵּיב לְמִלְקֵי חַיָּיבָא וְיִרְבְּעִינֵיהּ דַּיָינָא וְיַלְקִינֵיהּ קֳדָמוֹי כְּמֵיסַת חִיּוּבֵיהּ בְּדִינֵיהּ", "pj_en": "And if the wicked deserve stripes, the judge shall make him lie down, and they shall scourge him in his presence by his judgment, according to the measure of his guilt.", "tj": "וְיֶהֱוֵי אִין צָרִיךְ חַיָּיבָא לְמִילְקֵי וְיִרְבְּעֵי יָתֵיהּ דַּיָּנָא וְיִמְחֵי יָתֵיהּ קֳדָמוֹי כְּמֵיסַת חוֹבָתֵיהּ בְּמִנְיָן:", "tj_en": "And if it be needful to scourge the guilty, the judge shall make him lie down, and they shall smite him in his presence, according to the measure of his guilt, by number.", "rashi": "<b>והפילו השפט.<\/b> מְלַמֵּד שֶׁאֵין מַלְקִין אוֹתוֹ לֹא עוֹמֵד וְלֹא יוֹשֵׁב אֶלָּא מֻטֶּה (מכות כ\"ב):<br><br><b>לפניו כדי רשעתו.<\/b> וּלְאַחֲרָיו כְּדֵי שְׁתַּיִם, מִכָּאן אָמְרוּ מַלְקִין אוֹתוֹ שְׁתֵּי יָדוֹת מִלְּאַחֲרָיו וּשְׁלִישׁ מִלְּפָנָיו (ספרי; מכות כ\"ב):<br><br><b>במספר.<\/b> וְאֵינוֹ נָקוּד בַּמִּסְפָּר, לִמֵּד שֶׁהִיא דְבוּקָה, לוֹמַר בְּמִסְפַּר אַרְבָּעִים וְלֹא אַרְבָּעִים שְׁלֵמִים, אֶלָּא מִנְיָן שֶׁהוּא סוֹכֵם וּמַשְׁלִים לְאַרְבָּעִים וְהֵם אַרְבָּעִים חָסֵר אַחַת (שם):", "rashi_en": "והפילו השפט AND THE JUDGE SHALL CAUSE HIM TO FALL DOWN — This teaches that one is not lashed whilst standing or sitting but only when bending (Makkot 22b).<br><br>לפניו כדי רשעתו [AND THE JUDGE SHALL … SMITE HIM] IN FRONT ACCORDING TO HIS WICKEDNESS (כדי רשעתו may mean “as much as is sufficient for his wickedness”, i.e., for one part of his wickedness, רשעתו being singular) — in front (on his chest) corresponding to one part of his wickedness, and on his back corresponding to two parts: hence they (the Rabbis) derived that one must give him (anyone sentenced to lashes) two-thirds on his back and one third on his chest (Sifrei Devarim 286:6; Makkot 22b, 23a).<br><br>בְּמספר BY A NUMBER — but it (the word) is not punctuated בַּמספר by the number; this shows that it is connected with the following word, to read בְּמִסְפַּר ארבעים [“he shall smite him”] … by the number of forty, (i.e. by the number leading to forty), not, however, a full forty, but a number that leads up to the full total of forty, i.e., forty less one (Makkot 22a)."}, {"ch": 25, "v": 3, "aliyah": 7, "heb": "אַרְבָּעִ֥ים יַכֶּ֖נּוּ לֹ֣א יֹסִ֑יף פֶּן־יֹסִ֨יף לְהַכֹּת֤וֹ עַל־אֵ֙לֶּה֙ מַכָּ֣ה רַבָּ֔ה וְנִקְלָ֥ה אָחִ֖יךָ לְעֵינֶֽיךָ׃", "onk": "אַרְבְּעִין יַלְקִנֵּיהּ לָא יוֹסֵף דִּילְמָא יוֹסֵף לְאַלְקָיוּתֵיהּ עַל אִלֵּין מָחָא רַבָּא וְיֵקַל אֲחוּךְ לְעֵינָיךְ:", "onk_en": "Forty is he to have him flogged, he may not add; lest he additionally flog him over these, a great flogging, when your brother will be slighted before you.", "pj": "אַרְבְּעִין יַצְלִיף וְחָסִיר חַד יַלְקִינֵיהּ לָא יַשְׁלִים דִּלְמָא יוֹסִיף לְמִלְקֵיהּ עַל תְּלָתִין וְתֵשַׁע אִלֵּין מַלְקוּת יַתִּיר וְיִסְתַּכֵּן וְלָא יִתְבַּזֵי אָחוּךְ וְאַנְתְּ חָמֵי לֵיהּ", "pj_en": "Forty (stripes) may be laid upon him, but with one less shall he be beaten, (the full number) shall not be completed, lest he should add to smite him beyond those thirty and nine, exorbitantly, and he be in danger; and that thy brother may not be made despicable in thy sight.", "tj": "", "tj_en": "", "rashi": "<b>לא יסיף.<\/b> מִכָּאן אַזְהָרָה לַמַּכֶּה אֶת חֲבֵרוֹ (עי' כתובות ל\"ג):<br><br><b>ונקלה אחיך.<\/b> כָּל הַיּוֹם קוֹרְאוֹ רָשָׁע, וּמִשֶּׁלָּקָה קְרָאוֹ אָחִיךָ:", "rashi_en": "לא יסיף HE SHALL NOT EXCEED — From here is derived the prohibition referring to one who strikes his fellow man (Sanhedrin 86b; cf. Ketubot 33a).<br><br>ונקלה אחיך WHEN THY BROTHER SHOULD SEEM VILE [UNTO THEE] — All the time it has been calling him “wicked” (vv. 1 and 2), but as soon as he has received the lashes it calls him “thy brother”! (Sifrei Devarim 286:14)."}, {"ch": 25, "v": 4, "aliyah": 7, "heb": "לֹא־תַחְסֹ֥ם שׁ֖וֹר בְּדִישֽׁוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תֵחוֹד <b>פּוּם<\/b> תּוֹרָא בִּדְיָשֵׁיהּ:", "onk_en": "You may not muzzle [<b>the mouth of<\/b>] an ox while it threshes.", "pj": "לָא תְזַמְמוּן פּוּם תּוֹרָא בְּשַׁעַת דָּרְכֵיהּ בְּרַם יְבִימְתָּא דְאִיתְרְעַת קַמֵּיהּ לָקֵי שִׁיחְנָא וּדְלֵי חָמֵי לָא תִזְמָמוּנָהּ לֵיהּ", "pj_en": "You shall not muzzle the mouth of the ox in the time of his treading out; nor the wife of the (deceased) brother, who would be mated with one smitten with an ulcer, and who is poorly related, shalt thou tie up with him.", "tj": "עַמִּי יִשְרָאֵל לָא תְזַמְמוּן תּוֹרָא בְּשַׁעַת דּוֹרְכֵיהּ:", "tj_en": "Sons of Israel, My people, you shall not muzzle the ox in the hour of his treading.", "rashi": "<b>לא תחסם שור.<\/b> דִּבֵּר הַכָּתוּב בַּהֹוֶה, וְהוּא הַדִּין לְכָל בְּהֵמָה חַיָּה וְעוֹף הָעוֹשִׂים בִּמְלָאכָה שֶׁהִיא בִּדְבַר מַאֲכָל; אִם כֵּן לָמָּה נֶאֱמַר שׁוֹר? לְהוֹצִיא אֶת הָאָדָם (ספרי; בבא מציעא פ\"ח):<br><br><b>בדישו.<\/b> יָכוֹל יַחְסְמֶנּוּ מִבַּחוּץ? תַּלְמוּד לוֹמַר \"לֹא תַחְסֹם שׁוֹר\" — מִכָּל מָקוֹם; וְלָמָּה נֶאֱמַר דַּיִשׁ? לוֹמַר לְךָ מַה דַּיִשׁ מְיֻחָד דָּבָר שֶׁלֹּא נִגְמְרָה מְלַאכְתּוֹ וְגִדּוּלוֹ מִן הָאָרֶץ, אַף כָּל כַּיּוֹצֵא בוֹ, יָצָא הַחוֹלֵב וְהַמְגַבֵּן וְהַמְחַבֵּץ שֶׁאֵין גִּדּוּלוֹ מִן הָאָרֶץ, יָצָא הַלָּשׁ וְהַמְקַטֵּף שֶׁנִּגְמְרָה מְלַאכְתּוֹ לְחַלָּה, יָצָא הַבּוֹדֵל בִּתְמָרִים וּבִגְרוֹגְרוֹת שֶׁנִּגְמְרָה מְלַאכְתָּן לַמַּעֲשֵׂר (ספרי; ב\"מ פ\"ט):", "rashi_en": "לא תחסם שור THOU SHALT NOT MUZZLE THE OX [WHEN HE TREADETH OUT THE CORN] — Scripture is speaking of what usually occurs, but the same law applies to any cattle, non-domesticated beast and fowl that are doing some work that is connected with food. But if so why does it (Scripture) state “ox”? To exclude a human being from being subject to this law! (i.e. that if he restrains a workman from eating whilst engaged on some operation connected with food, the master is exempt from flagellation usually inflicted on one who transgresses a negative commandment) (Bava Metzia 88b).<br><br>בדישו WHEN HE TREADETH OUT THE CORN — One might think that one might muzzle it previous to that (lit., outside, i.e., before it starts working)! Scripture, however, states, “thou shalt not muzzle an ox” — which implies thou shalt not muzzle it under any circumstances (Bava Metzia 90b). Then why is threshing mentioned?. In order to tell you the following: What is threshing? Its characteristic is that it is done on a thing the work on which is not yet complete to make it liable to tithing and the giving of Challah, and which grows from the ground. So, too, this prohibition applies only to all operations which have similar characteristics: Thus there are excluded from the prohibition “not to muzzle” (i.e. you may restrain from eating) workmen who are engaged in milking, in cheese-making, or in pressing the moisture out of thick milk, all of which operations are done on things which do not grow from the ground; there are excluded, also, the workmen who are engaged in kneading, or in breaking the dough up into pieces for baking, for the work on it is then completed so that it becomes liable to Challah. There are also excluded the workmen engaged in separating dates and figs from the mass, for the work on them is then completed so that they become liable to tithing (Bava Metzia 89a)."}, {"ch": 25, "v": 5, "aliyah": 7, "heb": "כִּֽי־יֵשְׁב֨וּ אַחִ֜ים יַחְדָּ֗ו וּמֵ֨ת אַחַ֤ד מֵהֶם֙ וּבֵ֣ן אֵֽין־ל֔וֹ לֹֽא־תִהְיֶ֧ה אֵֽשֶׁת־הַמֵּ֛ת הַח֖וּצָה לְאִ֣ישׁ זָ֑ר יְבָמָהּ֙ יָבֹ֣א עָלֶ֔יהָ וּלְקָחָ֥הּ ל֛וֹ לְאִשָּׁ֖ה וְיִבְּמָֽהּ׃", "onk": "אֲרֵי יֵתְבוּן אַחִין כַּחֲדָא וִימוּת חַד מִנְּהוֹן וּבַר לֵית לֵיהּ לָא תְהֵי אִתַּת מֵתָנָא לְבָרָא לִגְבַר אוֹחֲרָן (נ\"א חִלּוֹנָי) יְבָמַהּ יֵעוּל עֲלַהּ וְיִסְּבַהּ לֵיהּ לְאִנְתּוּ וְיִבְּמַהּ:", "onk_en": "If brothers reside together, and one of them dies having no son, let the wife of the dead man not marry outside [the family] to a strange man; her brother-in-law will consummate with her thus marrying her to be his wife, and perform levirate marriage with her.", "pj": "כַּד דַּיְירִין בְּעַלְמָא הָדֵין שָׁעָה חֲדָא אַחִין מִן אַבָּא דִּמְיַחֲדִין בְּאַחְסַנְתָּא לָא תֶהֱוֵי אִתַּת שְׁכִיבָא הֶפְקֵרָא בְּשׁוּקָא לִגְבַר חִילוֹנָאֵי יְבָמָהּ יֵיעוּל עֲלָהּ וְיִסְבִּינָהּ לֵיהּ לְאִינְתּוּ וְיַבֵּם יָתָהּ", "pj_en": "When brethren from the (same) father inhabit this world at the same time, and have the same inheritance, the wife of one of them, who may have died, shall not go forth into the street to marry a stranger; her brother-in-law shall go to her, and take her to wife, and become her husband.", "tj": "", "tj_en": "", "rashi": "<b>כי ישבו אחים יחדו.<\/b> שֶׁהָיְתָה לָהֶם יְשִׁיבָה אַחַת בָּעוֹלָם, פְּרָט לְאֵשֶׁת אָחִיו שֶׁלֹּא הָיָה בְעוֹלָמוֹ (ספרי; יבמות י\"ז):<br><br><b>יחדו.<\/b> הַמְיֻחָדִים בַּנַּחֲלָה, פְּרָט לְאָחִיו מִן הָאֵם (שם):<br><br><b>ובן אין לו.<\/b> עַיֵּן עָלָיו, בֵּן אוֹ בַת אוֹ בֵן הַבֵּן אוֹ בַת הַבֵּן אוֹ בֵן הַבַּת אוֹ בַת הַבַּת (עי' יבמות כ\"ב):", "rashi_en": "כי ישבו אחים יחדו IF BRETHREN ABIDE TOGETHER, [AND ONE OF THEM DIE … THE WIFE OF THE DEAD SHALL NOT MARRY ABROAD] — This does not mean that they abide in one city but that they have one “abiding” in the world (that they were living at the same time) thus excluding from the operation of this law the wife of one’s brother who never was in his “world” (i.e. a woman may not marry her brother-in-law who was born after her husband’s death) (Sifrei Devarim 288:2; Yevamot 17b).<br><br>יחדו TOGETHER — means reciprocally associated (מיוחדים) in the law of inheritance (i.e. that they become the heirs of one another), thus excluding from the duty of יבום the brother on the mother’s side (Sifrei Devarim 288:2).<br><br>ובן אין לו AND HE HAS NO SON — The last two words suggest עין עליו, investigate about him whether he has descendants of any kind — a son, or a daughter, or a son’s son or a son’s daughter, or a daughter’s son or daughter’s daughter (cf. Yevamot 22b)."}, {"ch": 25, "v": 6, "aliyah": 7, "heb": "וְהָיָ֗ה הַבְּכוֹר֙ אֲשֶׁ֣ר תֵּלֵ֔ד יָק֕וּם עַל־שֵׁ֥ם אָחִ֖יו הַמֵּ֑ת וְלֹֽא־יִמָּחֶ֥ה שְׁמ֖וֹ מִיִּשְׂרָאֵֽל׃", "onk": "וִיהֵי בוּכְרָא דִּי תְלִיד יְקוּם עַל שְׁמָא דַאֲחוּהִי מֵתָנָא וְלָא יִתִּמְחֵי שְׁמֵיהּ מִיִּשְׂרָאֵל:", "onk_en": "It shall be that the firstborn, when she is capable of bearing children, shall be established in place of his deceased brother, so that his name may not be obliterated from Yisroel.", "pj": "וִיהֵי בּוּכְרָא דְתוֹלִיד יְקוּם בְּאַחְסַנְתָּא עַל שׁוּם אָחוֹי שְׁכִיבָא וְלָא יִתְמְחֵי שְׁמֵיהּ מִיִּשְרָאֵל", "pj_en": "And the first-born whom she beareth shall stand in the inheritance in the name of the deceased brother, that his name may not be blotted out from Israel.", "tj": "", "tj_en": "", "rashi": "<b>והיה הבכור.<\/b> גְּדוֹל הָאַחִים הוּא מְיַבֵּם אוֹתָהּ (ספרי; יבמות כ\"ד):<br><br><b>אשר תלד.<\/b> פְּרָט לְאַיְלוֹנִית שֶׁאֵינָהּ יוֹלֶדֶת:<br><br><b>יקום על שם אחיו.<\/b> זֶה שֶׁיִּבֵּם אֶת אִשְׁתּוֹ יִטֹּל נַחֲלַת הַמֵּת בְּנִכְסֵי אָבִיו:<br><br><b>ולא ימחה שמו.<\/b> פְּרָט לְאֵשֶׁת סָרִיס שֶׁשְּׁמוֹ מָחוּי (יבמות כ\"ד):", "rashi_en": "והיה הבכור AND IT SHALL BE THE FIRSTBORN … — It is the eldest brother who is to perform the duty of levirate marriage (Sifrei Devarim 289:1; Yevamot 24a).<br><br>אשר תלד WHOM SHE WILL BEAR — This excludes from the operation of this law a sterile woman, since she cannot bear children (Sifrei Devarim 289:2).<br><br>יקום על שם אחיו HE SHALL SUCCEED IN THE NAME OF HIS BROTHER — he who has married his (the deceased brother’s) wife shall receive the portion of the dead brother in his father’s property (Sifrei Devarim 289:3).<br><br>ולא ימחה שמו THAT HIS NAME BE NOT WIPED OUT [OF ISRAEL] — thus excluding from the levirate marriage the wife of a castrate, whose name is anyhow wiped out (Sifrei Devarim 289:5; Yevamot 24a)."}, {"ch": 25, "v": 7, "aliyah": 7, "heb": "וְאִם־לֹ֤א יַחְפֹּץ֙ הָאִ֔ישׁ לָקַ֖חַת אֶת־יְבִמְתּ֑וֹ וְעָלְתָה֩ יְבִמְתּ֨וֹ הַשַּׁ֜עְרָה אֶל־הַזְּקֵנִ֗ים וְאָֽמְרָה֙ מֵאֵ֨ן יְבָמִ֜י לְהָקִ֨ים לְאָחִ֥יו שֵׁם֙ בְּיִשְׂרָאֵ֔ל לֹ֥א אָבָ֖ה יַבְּמִֽי׃", "onk": "וְאִם לָא יִצְבֵי גַבְרָא לְמִסַּב יָת יְבִמְתֵּיהּ וְתִסַּק יְבִמְתֵּיהּ לִתְרַע <b>בֵּית דִּינָא לָקֳדָם<\/b> סָבַיָּא וְתֵימַר <b>לָא צָבֵי<\/b> יְבָמִי לַאֲקָמָא לַאֲחוּהִי שְׁמָא בְּיִשְׂרָאֵל לָא אָבֵי לְיַבָּמוּתִי:", "onk_en": "But if the man will not want to marry his sister-in-law; his sister-in-law must go up to the portal [<b>of the court<\/b>], to [<b>before<\/b>] the judges, and say, ‘‘My brother-in-law refuses [<b>does not agree<\/b>] to establish for his brother a name in Yisroel; he is unwilling to do perform levirate marriage with me.’’", "pj": "וְאִם לָא יִצְבֵי גַבְרָא לְמֵיסַב יַת יְבִימְתֵּיהּ וְתִיסַק יְבִימְתֵּיהּ לִתְרַע בֵּי דִינָא קֳדָם חַמְשָׁא חַכִּימִין וִיהוֹן תְּלָתָא לְדַיְינִין וּתְרֵין לְסַהֲדִין וְתֵימַר בְּלִישַׁן בֵּית קוּדְשָׁא קֳדָמֵיהוֹן מְסָרֵב יְבָמִי לְמִקְמָא לְאָחוֹי שְׁמָא בְּיִשְרָאֵל לָא צָבֵי לְיַבָּמוּתִי", "pj_en": "But if the man be not willing, to take his sister-in-law, then shall his sister-in-law go up to the gate of the beth din before five of the sages, three of whom shall be judges and two of them witnesses, and let her say before them in the holy language: My husband’s brother refuseth to keep up the name of his brother in Israel, he not being willing to marry me.", "tj": "", "tj_en": "", "rashi": "<b>השערה.<\/b> כְּתַרְגּוּמוֹ — לִתְרַע בֵּית דִּינָא:", "rashi_en": "השערה — Translate this as the Targum does: to the gate of the court."}, {"ch": 25, "v": 8, "aliyah": 7, "heb": "וְקָֽרְאוּ־ל֥וֹ זִקְנֵי־עִיר֖וֹ וְדִבְּר֣וּ אֵלָ֑יו וְעָמַ֣ד וְאָמַ֔ר לֹ֥א חָפַ֖צְתִּי לְקַחְתָּֽהּ׃", "onk": "וְיִקְרוּן לֵיהּ סָבֵי קַרְתֵּיהּ וִימַלְּלוּן עִמֵּיהּ וִיקוּם וְיֵימַר לָא רְעֵנָא לְמִסְבַּהּ:", "onk_en": "The judges of his city will call him and converse with him. He shall stand and say, ‘‘I do not want to marry her.’’", "pj": "וְיִקְרוֹן לֵיהּ חַכִּימֵי קַרְתֵּיהּ וִימַלְלוּן עִמֵּיהּ מִילְכָּא קְשִׁיטָא וִיקוּם בְּבֵי דִינָא וְיֵימַר בְּלִישָׁן בֵּית קוּדְשָׁא לָא רָעֵינָא לְמִיסְבָּהּ", "pj_en": "And the elders of his city shall call him and speak with him, with true counsel; and he may rise up in the house of justice, and say in the holy tongue, I am not willing to take her.", "tj": "", "tj_en": "", "rashi": "<b>ועמד.<\/b> בַּעֲמִידָה (ספרי):<br><br><b>ואמר.<\/b> בִּלְשׁוֹן הַקֹּדֶשׁ, וְאַף הִיא דְּבָרֶיהָ בִּלְשׁוֹן הַקֹּדֶשׁ (יבמות ק\"ו; ספרי):", "rashi_en": "ועמד AND HE SHALL STAND [AND SAY] — He must say this standing (Sifrei Devarim 290:3).<br><br>יאמר AND HE SHALL SAY — in the Holy Language. She, too, has to make her statements in the Holy Language (Yevamot 106b; cf. Sifrei Devarim 291:6)."}, {"ch": 25, "v": 9, "aliyah": 7, "heb": "וְנִגְּשָׁ֨ה יְבִמְתּ֣וֹ אֵלָיו֮ לְעֵינֵ֣י הַזְּקֵנִים֒ וְחָלְצָ֤ה נַעֲלוֹ֙ מֵעַ֣ל רַגְל֔וֹ וְיָרְקָ֖ה בְּפָנָ֑יו וְעָֽנְתָה֙ וְאָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָאִ֔ישׁ אֲשֶׁ֥ר לֹא־יִבְנֶ֖ה אֶת־בֵּ֥ית אָחִֽיו׃", "onk": "וְתִתְקְרַב יְבִמְתֵּיהּ לְוָתֵיהּ לָקֳדָם סָבַיָּא וְתַשְׁרֵי סֵינֵיהּ מֵעַל רַגְלֵיהּ וְתֵרוֹק בְּאַנְפּוֹהִי וְתָתֵב וְתֵימַר כְּדֵין יִתְעֲבֵד לִגְבַר דִּי לָא יִבְנֵי יָת בֵּיתָא דַאֲחוּהִי:", "onk_en": "And his sister-in-law will approach him in the sight of the judges, and she will remove his shoe from upon his foot, and spit before him; and she will say aloud, ‘‘This is done to the man who will not build his brother’s family.’’", "pj": "וְתִתְקָרֵיב יְבִימְתֵּיהּ לְוָתֵיהּ לִקֳדָם חַכִּימַיָא וִיהֵי נָעֵיל בְּרִיגְלֵיהּ דִּיבִימָהּ סַנְדְּלָא דְּלֵיהּ עֲקֵיבָא דְחַיֵּיט בִּשְׁנָצֵי וּבְפוּם סַנְדְּלָא שְׁנָצֵי קְטוּרִין וִיחַכֵּם רִיגְלֵיהּ בְּאַרְעָא וּתְקִים אִינְתְּתָא וְתִשְׁרֵי שְׁנָצֵי וְתִשְׁלוֹף סַנְדְּלֵיהּ מֵעִלַּוֵי רִיגְלֵיהּ וּמִן בָּתַר כְּדֵין תֵּירוֹק קֳדָמוֹי רוֹקָא נְפִישָׁא דְמִתְחַמֵּי לְחַכִּימַיָא וּתְתִיב וְתֵימַר כְּדֵין חָמֵי לְאִתְעוֹבָדָא לְגַבְרָא דְּלָא יִבְנֶה יַת בֵּיתָא דְאָחוֹי", "pj_en": "Then shall his sister-in-law come to him before the sages, and there shall be a shoe upon the foot of the brother-in-law, a heeled sandal whose lachets are tied, the latchets at the opening of the sandal being fastened; and he shall stamp on the ground with his foot; and the woman shall arise and untie the latchet, and draw off the sandal from his foot, and afterward spit before him, as much spittle as may be seen by the sages, and shall answer and say, So is it fit to be done to the man who would not build up the house of his brother.", "tj": "", "tj_en": "", "rashi": "<b>וירקה בפניו.<\/b> עַל גַּבֵּי קַרְקַע (שם):<br><br><b>אשר לא יבנה.<\/b> מִכָּאן לְמִי שֶׁחָלַץ שֶׁלֹּא יַחֲזֹר וִייַבֵּם, דְּלָא כְתִיב \"אֲשֶׁר לֹא בָנָה\", אֶלָּא \"אֲשֶׁר לֹא יִבְנֶה\", כֵּיוָן שֶׁלֹּא בָנָה — שׁוּב לֹא יִבְנֶה (יבמות י'; עי' ספרי):", "rashi_en": "וירקה בפניו THEN SHE SHALL SPIT BEFORE HIS FACE — on the ground (not in his face) (Yevamot 106b).<br><br>אשר לא יבנה [SO SHALL IT BE DONE UNTO THAT MAN] THAT WILL NOT BUILD UP [HIS BROTHER’S HOUSE] — from here the Rabbis derived the law that one who has once given his deceased brothers wife חליצה shall not afterwards marry her, for it does not state “[Thus shall it be done to the man] who hath not built up his brother’s house”, but אשר לא יבנה: “[Thus shall be done to the man] that he shall never build up” — because he has not built up, he shall never after build it up (Yevamot 10b; cf. Sifrei Devarim 291:8)."}, {"ch": 25, "v": 10, "aliyah": 7, "heb": "וְנִקְרָ֥א שְׁמ֖וֹ בְּיִשְׂרָאֵ֑ל בֵּ֖ית חֲל֥וּץ הַנָּֽעַל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיִתְקְרֵי שְׁמֵיהּ בְּיִשְׂרָאֵל בֵּית שְׁרִי סֵינָא:", "onk_en": "And it will be entitled in Yisroel, the house of the divestiture of the shoe.", "pj": "וְכָל דְּקַיְימִין תַּמָּן יִכְרְזוּן עֲלוֹי וְיִקְרוּן שְׁמֵיהּ בְּיִשְרָאֵל בֵּי שְׁלִיף סַנְדְּלָא", "pj_en": "And all who are standing there shall exclaim against him, and call his name in Israel the House of the Unshod.", "tj": "וְיִתְקְרֵי שְׁמֵיהּ בְּיִשְרָאֵל בַּיְתָא שְׁלוּפֵי סַנְדְּלָא וּמְבַטְלֵי מִצְוָתֵיהּ דִּיבָמָה:", "tj_en": "And his name in Israel shall be called the House of him whose shoe was loosed, and who made void the law of Yeboom.", "rashi": "<b>ונקרא שמו וגו'.<\/b> מִצְוָה עַל כָּל הָעוֹמְדִים שָׁם לוֹמַר \"חֲלוּץ הַנַּעַל\" (ספרי; יבמות ק\"ו):", "rashi_en": "תקרא שמו וגו׳ AND HIS NAME SHALL BE CALLED [IN ISRAEL “THE HOUSE OF HIM THAT HATH HIS SHOE LOOSED”] — It is a duty of all those standing there to exclaim: חלוץ הנעל  “O, you who have had your shoe drawn off!” (Sifrei Devarim 291:10; Yevamot 106b)."}, {"ch": 25, "v": 11, "aliyah": 7, "heb": "כִּֽי־יִנָּצ֨וּ אֲנָשִׁ֤ים יַחְדָּו֙ אִ֣ישׁ וְאָחִ֔יו וְקָֽרְבָה֙ אֵ֣שֶׁת הָֽאֶחָ֔ד לְהַצִּ֥יל אֶת־אִישָׁ֖הּ מִיַּ֣ד מַכֵּ֑הוּ וְשָׁלְחָ֣ה יָדָ֔הּ וְהֶחֱזִ֖יקָה בִּמְבֻשָֽׁיו׃", "onk": "אֲרֵי יִנְצוּן גֻּבְרִין כַּחֲדָא גְּבַר וַאֲחוּהִי וְתִתְקְרֵב אִתַּת חַד לְשֵׁזָבָא יָת בַּעֲלַהּ מִיַּד מָחוּהִי וְתוֹשֵׁט יְדַהּ וְתִתְקֵף <b>בְּבֵית בַּהַתְּתֵיהּ<\/b>:", "onk_en": "If men engage in an altercation—a man and his brother—and the wife of one approaches to save her husband from his assailant, and she puts out her hand and grasps his genitals [<b>the place of his shame<\/b>],", "pj": "אֲרוּם מִתְגַּרְיָין בְּנֵי אֱנָשָׁא כַּחֲדָא גְּבַר וְחַבְרֵיהּ וְתִתְקָרֵב אִתַּת חַד מִנְהוֹן לְשֵׁיזָבָא יַת בַּעֲלָהּ מִיַּד מְחָהִי וְתוֹשִׁיט יְדָהּ וְתִתְקֵיף בְּבֵית בְּהַתְתֵיהּ", "pj_en": "While men are striving together, if the wife of one of them approach to rescue her husband from the hand of him who smiteth him, and putting forth her hand layeth hold of the place of his shame,", "tj": "וְתִפְשׁוֹט יְדָהּ וְתִתְקֵף בְּבֵית קִיטְמֵיהּ:", "tj_en": "If she put forth her hand, and lay hold by the place of his shame.", "rashi": "<b>כי ינצו אנשים.<\/b> סוֹפוֹ לָבֹא לִידֵי מַכּוֹת, כְּמוֹ שֶׁנֶּאֱמַר <b>מיד מכהו<\/b>, אֵין שָׁלוֹם יוֹצֵא מִתּוֹךְ יְדֵי מַצּוּת (ספרי):", "rashi_en": "כי ינצו אנשים WHEN MEN STRIVE TOGETHER, they will in the end come to blows, as it goes on to state “[and the wife approacheth to deliver her husband]” out of the hand of him who smiteth him: No good can come out of a quarrel (Sifrei Devarim 292:1; cf. Rashi on v. 1)."}, {"ch": 25, "v": 12, "aliyah": 7, "heb": "וְקַצֹּתָ֖ה אֶת־כַּפָּ֑הּ לֹ֥א תָח֖וֹס עֵינֶֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּתְקוּץ יָת יְדַהּ לָא תְחוּס עֵינָךְ:", "onk_en": "You shall sever her hand; you are not to have compassion.", "pj": "וְתִקְטְעוּן יַת פִּיסַת יְדָהּ לָא תְחוּסַן עֵינֵיכוֹן", "pj_en": "you shall cut off her hand; your eyes shall not pity.", "tj": "", "tj_en": "", "rashi": "<b>וקצתה את כפה.<\/b> מָמוֹן דְּמֵי בָשְׁתּוֹ, הַכֹּל לְפִי הַמְבַיֵּשׁ וְהַמִּתְבַּיֵּשׁ; אוֹ אֵינוֹ אֶלָּא יָדָהּ מַמָּשׁ? נֶאֱמַר כָּאן \"לֹא תָחוֹס\", וְנֶאֱמַר לְהַלָּן בְּעֵדִים זוֹמְמִים (דברים י\"ט) \"לֹא תָחוֹס\", מַה לְּהַלָן מָמוֹן אַף כָּאן מָמוֹן (ספרי; עי' בבא קמא כ\"ח):", "rashi_en": "וקצת את כפה THEN THOU SHALT HEW OFF HER HAND — i.e., she must pay money that is the equivalent of the shame to which he has been put (Bava Kamma 28a), all according to the social position of the person who put him to shame and of him who was shamed (Bava Kamma 83b). But perhaps this is not the meaning, but that you should cut off her hand, literally?! It states, however, here לא תחוס, “thine eye shall not pity her” and it states there (Deuteronomy 19:21) in the laws concerning the plotting witnesses “thou shalt not pity them”; now, what is the case there? It is monetary compensation (see Rashi on that passage)! So, too, monetary compensation is here intended (Sifrei Devarim 293:2)."}, {"ch": 25, "v": 13, "aliyah": 7, "heb": "לֹֽא־יִהְיֶ֥ה לְךָ֛ בְּכִֽיסְךָ֖ אֶ֣בֶן וָאָ֑בֶן גְּדוֹלָ֖ה וּקְטַנָּֽה׃", "onk": "לָא יְהֵי לָךְ בְּכִיסָךְ מַתְקַל וּמַתְקָל רַבְּתָא וּזְעֶרְתָּא:", "onk_en": "You are not to have for yourself in your pouch varying weight-stones, large and small.", "pj": "לָא יֶהֱוֵי לְכוֹן בְּנַרְתֵּיקֵיכוֹן מַתְקְלִין דִּנְכִיל מַתְקְלִין רַבְרְבִין לְמֶהֱוֵי זַבִּין בְּהוֹן וּמַתְקְלִין זְעִירִין לְמֶהֱוֵי מְזַבִּין בְּהוֹן", "pj_en": "You shall not have in your bag weights that are deceitful; great weights to buy with, and less weights to sell with.", "tj": "לָא יֶהֱוֵי בְּכִיסְכוֹן מַתְקְלִין זְעִירִין לְמֶהֱוֵי מְזַבֵּן בְּהוֹן וּמַתְקְלִין רַבְרְבִין לְמֶהֱוֵי זַבָּן:", "tj_en": "", "rashi": "<b>אבן ואבן.<\/b> מִשְׁקָלוֹת:<br><br><b>גדולה וקטנה.<\/b> גְּדוֹלָה שֶׁמַּכְחֶשֶׁת אֶת הַקְּטַנָּה, שֶׁלֹּא יְהֵי נוֹטֵל בַּגְּדוֹלָה וּמַחֲזִיר בַּקְּטַנָּה (ספרי):", "rashi_en": "אבן ואבן [THOU SHALT NOT HAVE IN THY BAG] DIVERSE STONES — i.e., weights.<br><br>גדולה וקטנה A GREAT AND A SMALL — i.e. thou shalt not have a large one that contradicts the small one, — that one must not buy (lit., take) goods by the larger and sell (lit., give it back) by the smaller (Sifrei Devarim 294:1). "}, {"ch": 25, "v": 14, "aliyah": 7, "heb": "לֹא־יִהְיֶ֥ה לְךָ֛ בְּבֵיתְךָ֖ אֵיפָ֣ה וְאֵיפָ֑ה גְּדוֹלָ֖ה וּקְטַנָּֽה׃", "onk": "לָא יְהֵי לָךְ בְּבֵיתָךְ מְכִילָא וּמְכִילָא רַבְּתָא וּזְעֶרְתָּא:", "onk_en": "You shall not have in your house varying measures, large and small.", "pj": "לָא יֶהֱוֵי לְכוֹן בְּבָתֵּיכוֹן מְכִילַן דִּנְכִיל מְכִילַן רַבְרְבִין לְמֶהֱוֵי זַבִּין בְּהוֹן וּמְכִילַן זְעִירִין לְמֶהֱוֵי מְזַבִּין בְּהוֹן", "pj_en": "Nor shall you have in your houses measures that deceive; great measures to buy with, and less measures to sell with.", "tj": "לָא יֶהֱוֵי לְכוֹן בְּבָתֵּיכוֹן מְכִילָן וּמְכִילָן מְכִילָא רַבָּא לְמֶהֱוֵי זַבָּן בְּהוֹן וּמְכִילָא זְעֵירָא לְמֶהֱוֵי מְזַבֵּן בְּהוֹן:", "tj_en": "You shall not have in your houses measures and measures; great ones for buying with, and small ones to sell with.", "rashi": "<b>לא יהיה לך.<\/b> אִם עָשִׂיתָ כֵּן, לֹא יִהְיֶה לְךָ כְּלוּם (עי' שם):", "rashi_en": "  לא יהיה לך THOU SHALT NOT HAVE — This suggests: if YOU do so (if you have false weights), לא יהיה לך you will have nothing (you will become impoverished, being deprived of your property, as you have deprived others of theirs) (cf. Sifrei Devarim 294:3)."}, {"ch": 25, "v": 15, "aliyah": 7, "heb": "אֶ֣בֶן שְׁלֵמָ֤ה וָצֶ֙דֶק֙ יִֽהְיֶה־לָּ֔ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָצֶ֖דֶק יִֽהְיֶה־לָּ֑ךְ לְמַ֙עַן֙ יַאֲרִ֣יכוּ יָמֶ֔יךָ עַ֚ל הָֽאֲדָמָ֔ה אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֥ן לָֽךְ׃", "onk": "<b>מַתְקְלִין<\/b> שָׁלְמִין דִּקְשׁוֹט יְהוֹן לָךְ <b>מְכִילָן<\/b> שָׁלְמִין דִּקְשׁוֹט יְהוֹן לָךְ בְּדִיל דְּיוֹרְכוּן יוֹמָיךְ עַל אַרְעָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ:", "onk_en": "A fully accurate, just weight, you shall have, you are to have whole and honest measures; in order that you live long on the land that Adonoy, your God, is giving you.", "pj": "מַתְקְלִין שַׁלְמִין וּמִסְחֲאָתָא דִקְשׁוֹט יֶהֱוֵי לְכוֹן מְכִילַן שַׁלְמִין וּקְסָטִין דִּקְשׁוֹט יֶהֱוֵי לְכוֹן מִן בִּגְלַל דְּיִסְגוּן יוֹמֵיכוֹן עַל אַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן", "pj_en": "Perfect weights, and true balances shalt thou have, perfect measures and scales that are true shall be yours, that your days may be multiplied on the land which the Lord your God giveth you.", "tj": "", "tj_en": "", "rashi": "<b>אבן שלמה וצדק יהיה לך.<\/b> אִם עָשִׂיתָ כֵּן, יִהְיֶה לְךָ הַרְבֵּה:", "rashi_en": "אבן שלמה וצדק יהיה לך THOU SHALT HAVE A PERFECT AND JUST WEIGHT — This again suggests: if you will do this, (using just weights and measures), you will have (יהיה לך) much (cf. Sifrei Devarim 294:3)."}, {"ch": 25, "v": 16, "aliyah": 7, "heb": "כִּ֧י תוֹעֲבַ֛ת יְהֹוָ֥ה אֱלֹהֶ֖יךָ כׇּל־עֹ֣שֵׂה אֵ֑לֶּה כֹּ֖ל עֹ֥שֵׂה עָֽוֶל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי <b>מְרָחָק קֳדָם<\/b> יְיָ אֱלָהָךְ כָּל עָבֵד אִלֵּין כֹּל עָבֵד <b>שְׁקַר<\/b>:", "onk_en": "Because [<b>distanced from before<\/b>] Adonoy, your God’s abomination, are all who do these [things]; all who do falsehood.", "pj": "אֲרוּם מְרַחֵק קֳדָם יְיָ אֱלָהָכוֹן כָּל דְּעָבֵיד אִלֵּין נִיכְלַיָא כָּל דְּעָבֵיד שִׁיקְרָא בִּפְרַקְמַטְיָא", "pj_en": "For whosoever committeth these frauds, every one who acteth falsely in trade, is an abomination before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 25, "v": 17, "aliyah": 7, "heb": "זָכ֕וֹר אֵ֛ת אֲשֶׁר־עָשָׂ֥ה לְךָ֖ עֲמָלֵ֑ק בַּדֶּ֖רֶךְ בְּצֵאתְכֶ֥ם מִמִּצְרָֽיִם׃", "onk": "הֲוֵי דְכִיר יָת דִּי עֲבַד לָךְ עֲמָלֵק בְּאָרְחָא בְּמִפָּקְכוֹן מִמִּצְרָיִם:", "onk_en": "Remember what Amalek perpetrated against you on the way when you were going out of Egypt.", "pj": "הֲווֹ דְּכִירִין יַת דְּעָבָדוּ לְכוֹן דְּבֵית עֲמָלֵק בְּאָרְחָא בְּמִפַּקְכוֹן מִמִּצְרָיִם", "pj_en": "Keep in mind what the house of Amalek did unto you in the way, on your coming up out of Mizraim;", "tj": "", "tj_en": "", "rashi": "<b>זכור את אשר עשה לך.<\/b> אִם שִׁקַּרְתָּ בְמִדּוֹת וּבְמִשְׁקָלוֹת הֱוֵי דוֹאֵג מִגֵּרוּי הָאוֹיֵב, שֶׁנֶּאֱמַר (משלי י\"א) \"מֹאזְנֵי מִרְמָה תּוֹעֲבַת ה'\", וּכְתִיב בַּתְרֵיהּ \"בָּא זָדוֹן וַיָּבֹא קָלוֹן\" (תנחומא):", "rashi_en": "זכור את אשר עשה לך REMEMBER WHAT [AMALEK] DID UNTO THEE — If you use false weights and measures then you must apprehend the provocation of the enemy, as it states (Proverbs 11:1): “A false balance is an abomination to the Lord, etc.”, and there is written immediately after this (v. 2): “If intentional sin comes, shame comes”(Midrash Tanchuma, Ki Teitzei 8)."}, {"ch": 25, "v": 18, "aliyah": 7, "heb": "אֲשֶׁ֨ר קָֽרְךָ֜ בַּדֶּ֗רֶךְ וַיְזַנֵּ֤ב בְּךָ֙ כׇּל־הַנֶּחֱשָׁלִ֣ים אַֽחֲרֶ֔יךָ וְאַתָּ֖ה עָיֵ֣ף וְיָגֵ֑עַ וְלֹ֥א יָרֵ֖א אֱלֹהִֽים׃", "onk": "דִּי <b>עָרְעָךְ<\/b> בְּאָרְחָא <b>וְקָטֵל<\/b> בָּךְ כָּל דַּהֲווֹ <b>מִתְאַחֲרִין<\/b> בַּתְרָךְ וְאַתְּ מְשַׁלְהֵי וְלָאֵי וְלָא דָחֵיל <b>מִן קֳדָם<\/b> יְיָ:", "onk_en": "When they chanced upon [<b>overtook<\/b>] you en route struck down [<b>killed<\/b>] your appendage—all the feeble ones behind you—and you were exhausted and wearied, and they had no fear of [<b>before<\/b>] God.", "pj": "דְּאַרְעוּ יַתְכוֹן בְּאָרְחָא וַהֲוָה קָטִיל בְּכוֹן כָּל דַּהֲוָה מְהַרְהֵר לְמִסְטֵי בָּתַר מֵימְרִי הִינוּן גּוּבְרַיָא מִשִּׁבְטָא דְבֵית דָּן דַּהֲוָה בִידֵיהוֹן פּוּלְחָנָא נוּכְרָאָה וַהֲוָה עֲנָנָא פָּלִיט יַתְהוֹן וּדְבֵית עֲמָלֵק מְקַבֵּל יַתְהוֹן וְקָטַע בֵּית גִּבָּרֵיהוֹן וְשָׁדֵי לְעֵילָא וְאַתּוּן בֵּית יִשְרָאֵל הֲוֵיתוּן לְעִיַין וּמְשַׁלְהִין מִסּוּגֵי שִׁעֲבּוּדָא דְמִצְרָאֵי וּמִן דְּלוּחֵי גְּלִילֵי יַמָּא דַּעֲבַרְתּוּן בְּמִצְעֵיהוֹן וְלָא דַחֲלוּן בֵּית עֲמָלֵק מִן קֳדָם יְיָ", "pj_en": "how they overtook you in the way, and slew every one of those among you who were thinking to go aside from My Word; the men of the tribe of the house of Dan, in whose hands were idols (or things of strange worship), and the clouds overcast them, and they of the house of Amalek took them and mutilated them, and they were cast up: but you, O house of Israel, were faint and weary from great servitude of the Mizraee, and the terrors of the waves of the sea through the midst of which you had passed. Nor were the house of Amalek afraid before the Lord.", "tj": "דְּאַרְעוּ יַתְכוֹן בְּאוֹרְחָא וַהֲווֹן מְקַטְלִין בְּכוֹן כָּל דַּהֲוָה לִבְּהָא מְהַרְהֵר בָּתַר מֵימְרִי הֲוָה עֲנָנָא פַּלִּיט יָתֵיהּ וּדְבֵית עֲמָלֵק מְקַבְּלִין יָתֵיהּ וּמְקַטְלִין יָתֵיהּ וְאַתּוּן עַמָּא בְּנֵי יִשְרָאֵל לַהֲיִין וּמְשַׁלְהֲיָין וְלָא דַּחֲלוּ דְּבֵית עֲמָלֵק מִן קֳדָם יְיָ:", "tj_en": "Who overtook you in the way, and slew among you those who were thinking to desist from My Word, the cloud overcast him, and they of the house of Amalek took him and slew him. But you, people of the sons of Israel, were weary and faint; nor were they of the house of Amalek afraid before the Lord.", "rashi": "<b>אשר קרך בדרך.<\/b> לְשׁוֹן מִקְרֶה; דָּבָר אַחֵר — לְשׁוֹן קֶרִי וְטֻמְאָה שֶׁהָיָה מְטַמְּאָן בְּמִשְׁכַּב זְכוּר; דָּ\"אַ — לְשׁוֹן קֹר וְחֹם, צִנֶּנְךָ וְהִפְשִׁירְךָ מֵרְתִיחָתְךָ, שֶׁהָיוּ כָל הָאֻמּוֹת יְרֵאִים לְהִלָּחֵם בָּכֶם וּבָא זֶה וְהִתְחִיל וְהֶרְאָה מָקוֹם לַאֲחֵרִים; מָשָׁל לְאַמְבָּטִי רוֹתַחַת שֶׁאֵין כָּל בְּרִיָּה יְכוֹלָה לֵירֵד בְּתוֹכָהּ, בָּא בֶן בְּלִיַּעַל אֶחָד קָפַץ וְיָרַד לְתוֹכָהּ, אַעַ\"פִּ שֶׁנִּכְוָה הֵקֵרָהּ אוֹתָהּ בִּפְנֵי אֲחֵרִים (תנחומא):<br><br><b>ויזנב בך.<\/b> מַכַּת זָנָב, חוֹתֵךְ מִילוֹת וְזוֹרֵק כְּלַפֵּי מַעְלָה (תנחומא):<br><br><b>כל הנחשלים אחריך.<\/b> חַסְרֵי כֹחַ מֵחֲמַת חֶטְאָם, שֶׁהָיָה הֶעָנָן פּוֹלְטָן (תנחומא):<br><br><b>ואתה עיף ויגע.<\/b> עָיֵף בַּצָּמָא, דִּכְתִיב \"וַיִּצְמָא שָׁם הָעָם לַמַּיִם\" (שמות י\"ז) וּכְתִיב אַחֲרָיו \"וַיָּבֹא עֲמָלֵק\":<br><br><b>ויגע.<\/b> בַּדֶּרֶךְ:<br><br><b>ולא ירא.<\/b> עֲמָלֵק <b>אלהים<\/b> מִלְּהָרַע לְךָ:", "rashi_en": "אשר קרך בדרך HOW HE MET THEE BY THE WAY — The word קרך is connected in meaning with מקרה “a sudden happening”, i.e., he came against thee by surprise. Another explanation is: it is connected in meaning with the term קרי, nocturnal pollution and uncleanness, because he polluted them by pederasty. Yet another explanation is that it is connected in meaning with the expression קור in the phrase קור וחום “cold and heat” and it means: he made you cold and lukewarm after the boiling heat you had before. For all the nations were afraid to war against you and this one came and began to point out the way to others. A parable! It may be compared to a boiling hot bath into which no living creature could descend. A good-for-nothing came, and sprang down into it; although he scalded himself he made it appear cold to others (Midrash Tanchuma, Ki Teitzei 9).<br><br>ויזנב בך means, smiting the membrum; he cut off the membra and threw them up provocatively towards Heaven (God) (Midrash Tanchuma, Ki Teitzei 10).<br><br>כל הנחשלים אחריך [AND HE SMOTE THE HINDMOST OF THEE] EVEN THOSE THAT WERE FEEBLE BEHIND THEE — i.e., those who were enfeebled because of their sins and whom the clouds had expelled from the protection they afforded (Midrash Tanchuma, Ki Teitzei 10).<br><br>ואתה עיף ויגע AND THOU WAST FAINT AND WEARY — faint through thirst, for it is written, (Exodus 17:3) “And the people thirsted there for water” and it is written immediately afterwards (v. 8) “Then came Amalek”. <br><br>ויגע AND WEARY — from the journey (Midrash Tanchuma, Ki Teitzei 10).<br><br>ולא ירא AND HE FEARED NOT — Amalek feared not אלהים GOD so as to refrain from harming you (Sifrei Devarim 296:7)."}, {"ch": 25, "v": 19, "aliyah": 7, "heb": "וְהָיָ֡ה בְּהָנִ֣יחַ יְהֹוָ֣ה אֱלֹהֶ֣יךָ&thinsp;<small>׀<\/small>&thinsp;לְ֠ךָ֠ מִכׇּל־אֹ֨יְבֶ֜יךָ מִסָּבִ֗יב בָּאָ֙רֶץ֙ אֲשֶׁ֣ר יְהֹוָה־אֱ֠לֹהֶ֠יךָ נֹתֵ֨ן לְךָ֤ נַחֲלָה֙ לְרִשְׁתָּ֔הּ תִּמְחֶה֙ אֶת־זֵ֣כֶר עֲמָלֵ֔ק מִתַּ֖חַת הַשָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיהֵי כַּד יְנִיחַ יְיָ אֱלָהָךְ לָךְ מִכָּל בַּעֲלֵי דְבָבָךְ מִסְּחוֹר סְחוֹר בְּאַרְעָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא לְמֵירְתַהּ תִּמְחֵי יָת דּוּכְרָנָא דַעֲמָלֵק מִתְּחוֹת שְׁמַיָּא לָא תִּתִּנְשֵׁי:", "onk_en": "When Adonoy, your God, has given you repose from all your enemies around, in the land that Adonoy, your God, is giving you as territory to inherit, you shall obliterate the memory of Amalek from beneath the sky; do not forget.", "pj": "וִיהֵי כַּד יָנִיחַ יְיָ אֱלָהָכוֹן לְכוֹן מִן כָּל בַּעֲלֵי דְבָבֵיכוֹן מִן חֲזוֹר חֲזוֹר בְּאַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן אַחֲסָנָא לְמֵירְתָהּ תִּמְחוּן יַת דּוּכְרָנָא דַעֲמָלֵק מִתְּחוֹת שְׁמַיָא וַאֲפִילוּ לְיוֹמֵי מַלְכָּא מְשִׁיחָא לָא תִתְנְשֵׁי", "pj_en": "Therefore, when the Lord hath given you rest from all your enemies round about in the land that the Lord Your God giveth you to inherit for a possession, you shall blot out the memory of Amalek from under the heavens; but of the days of the King Meshiha you shall not be unmindful.", "tj": "", "tj_en": "", "rashi": "<b>תמחה את זכר עמלק.<\/b> מֵאִישׁ עַד אִשָּׁה מֵעוֹלֵל וְעַד יוֹנֵק מִשּׁוֹר וְעַד שֶׂה (שמואל א ט\"ו), שֶׁלֹּא יְהֵא שֵׁם עֲמָלֵק נִזְכָּר אֲפִלּוּ עַל הַבְּהֵמָה, לוֹמַר בְּהֵמָה זוֹ מִשֶּׁל עֲמָלֵק הָיְתָה (פסיק' זוטר'):", "rashi_en": "תמחה את זכר עמלק THOU SHALT WIPE AWAY THE REMEMBRANCE OF AMALEK, — both man and woman, infant and suckling, ox and sheep (a quotation from I Samuel 15:3, stating how the Amalekites were to be destroyed), so that the name of Amalek should never again be mentioned even in connection with a beast, in that one could say: “This beast belonged to Amalek” (Pesikta Zutrata)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
