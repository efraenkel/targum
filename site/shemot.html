<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const DATA = [{"ch": 1, "v": 1, "aliyah": 1, "heb": "וְאֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל הַבָּאִ֖ים מִצְרָ֑יְמָה אֵ֣ת יַעֲקֹ֔ב אִ֥ישׁ וּבֵית֖וֹ בָּֽאוּ׃", "onk": "וְאִלֵין שְׁמָהַת בְּנֵי יִשְׂרָאֵל דְעַלוּ לְמִצְרָיִם עִם יַעֲקֹב גְבַר וֶאֱנַשׁ בֵּיתֵהּ עַלוּ:", "onk_en": "These are the names of the B’nei Yisrael who came to Egypt. Each man with his household who came with Yaakov.", "pj": "וְאִילֵין שְׁמָהַת בְּנֵי יִשְרָאֵל דְעָלוּ לְמִצְרַיִם עִם יַעֲקב גְבַר עִם אֱנַשׁ בֵּיתֵיהּ עָלוּ", "pj_en": "AND these are the names of the sons of Israel who went into Mizraim with Jakob, each with the men of his house entered in:", "tj": "", "tj_en": "", "rashi": "<b>ואלה שמות בני ישראל.<\/b> אַעַ\"פִּ שֶׁמְּנָאָן בְּחַיֵּיהֶם בִּשְׁמוֹתָם, חָזַר וּמְנָאָם בְּמִיתָתָם, לְהוֹדִיעַ חִבָּתָם, שֶׁנִּמְשְׁלוּ לְכוֹכָבִים, שֶׁמּוֹצִיאָם וּמַכְנִיסָם בְּמִסְפַּר וּבִשְׁמוֹתָם (שמות רבה), שֶׁנֶּ' \"הַמּוֹצִיא בְמִסְפָּר צְבָאָם לְכֻלָּם בְּשֵׁם יִקְרָא\" (ישעיהו מ'):", "rashi_en": "ואלה שמות בני ישראל NOW THESE ARE THE NAMES OF THE CHILDREN OF ISRAEL — Although scripture has already enumerated them by name whilst they were living, when they went down into Egypt (Genesis 46:8-27), it again enumerates them when it tells us of their death, thus showing how dear they were to God — that they are compared to the stars which also God brings out and brings in by number and name when they cease to shine, as it is said, (Isaiah 40:26) “He bringeth out their host by number, He calleth them all by name” (Exodus Rabbah 1:3; Tanchuma Yashan 1:1:2)."}, {"ch": 1, "v": 2, "aliyah": 1, "heb": "רְאוּבֵ֣ן שִׁמְע֔וֹן לֵוִ֖י וִיהוּדָֽה׃", "onk": "רְאוּבֵן שִׁמְעוֹן לֵוִי וִיהוּדָה:", "onk_en": "Reuvein, Shimon, Leivi and Yehudah.", "pj": "רְאוּבֵן שִׁמְעוֹן לֵוִי וִיהוּדָה", "pj_en": "Reuben, Shimeon, Levi, and Jehudah;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 3, "aliyah": 1, "heb": "יִשָּׂשכָ֥ר זְבוּלֻ֖ן וּבִנְיָמִֽן׃", "onk": "יִשָּׂשׂכָר זְבוּלֻן וּבִנְיָמִין:", "onk_en": "Yissachar, Zevulun, and Binyamin.", "pj": "יִשָשׁכָר זְבוּלֻן וּבִנְיָמִין", "pj_en": "Issakar, Zebulon, and Benjamin;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 4, "aliyah": 1, "heb": "דָּ֥ן וְנַפְתָּלִ֖י גָּ֥ד וְאָשֵֽׁר׃", "onk": "דָן וְנַפְתָּלִי גָד וְאָשֵׁר:", "onk_en": "Don, Naftali, Gad and Asher.", "pj": "דָן וְנַפְתָּלִי גָד וְאָשֵׁר", "pj_en": "Dan and Naphtali; Gad and Asher.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 5, "aliyah": 1, "heb": "וַֽיְהִ֗י כׇּל־נֶ֛פֶשׁ יֹצְאֵ֥י יֶֽרֶךְ־יַעֲקֹ֖ב שִׁבְעִ֣ים נָ֑פֶשׁ וְיוֹסֵ֖ף הָיָ֥ה בְמִצְרָֽיִם׃", "onk": "וַהֲוָה כָּל נַפְשָׁתָא נַפְקֵי יַרְכָּא דְיַעֲקֹב שַׁבְעִין נַפְשָׁן וְיוֹסֵף <b>דַהֲוָה<\/b> בְּמִצְרָיִם:", "onk_en": "All the souls that emanated from the loins of Yaakov, [numbered] seventy souls, [including] Yoseif who was [<b>already<\/b>] in Egypt.", "pj": "וַהֲוָה סְכוּם כָּל נַפְשָׁתָא נַפְקֵי יַרְכָא דְיַעֲקב שׁוּבְעִין נַפְשָׁתָא עִם יוֹסֵף וּבְנוֹהִי דַהֲוָה בְּמִצְרַיִם", "pj_en": "And the number of all the souls coming from the thigh of Jakob, seventy souls, with Joseph and his sons, who were in Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ויוסף היה במצרים.<\/b> וַהֲלֹא הוּא וּבָנָיו הָיוּ בִּכְלַל שִׁבְעִים, וּמַה בָּא לְלַמְּדֵנוּ? וְכִי לֹא הָיִינוּ יוֹדְעִים שֶׁהוּא הָיָה בְּמִצְרַיִם? אֶלָּא לְהוֹדִיעֲךָ צִדְקָתוֹ שֶׁל יוֹסֵף, הוּא יוֹסֵף הָרוֹעֶה אֶת צֹאן אָבִיו, הוּא יוֹסֵף שֶׁהָיָה בְּמִצְרַיִם, וְנַעֲשָׂה מֶלֶךְ, וְעוֹמֵד בְּצִדְקוֹ (שמות רבה):", "rashi_en": "ויוסף היה במצרים lit., AND JOSEPH WAS IN EGYPT — But were not he and his sons included in the seventy? What, then, is this statement intended to tell us? Do we not know that he was in Egypt? But its purpose is to inform you of Joseph’s righteousness: this is the same Joseph who tended his father’s sheep; this is the same Joseph who was in Egypt and became king there, and yet he remained steadfast in his righteousness, and the change from a humble position to exalted rank in Egypt caused no deterioration in his character (cf. Sifrei האזינו; Exodus Rabbah 1:7)."}, {"ch": 1, "v": 6, "aliyah": 1, "heb": "וַיָּ֤מׇת יוֹסֵף֙ וְכׇל־אֶחָ֔יו וְכֹ֖ל הַדּ֥וֹר הַהֽוּא׃", "onk": "וּמִית יוֹסֵף וְכָל אַחוֹהִי וְכֹל דָרָא הַהוּא:", "onk_en": "Yoseif died. All his brothers and all that generation [also died.]", "pj": "וּמִית יוֹסֵף וּבַתְרֵיהּ מִיתוּ כָּל אֲחוֹהִי וְכָל דָרָא הַהוּא", "pj_en": "And Joseph died, and after him died all his brethren, and all that generation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 7, "aliyah": 1, "heb": "וּבְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽיִּשְׁרְצ֛וּ וַיִּרְבּ֥וּ וַיַּֽעַצְמ֖וּ בִּמְאֹ֣ד מְאֹ֑ד וַתִּמָּלֵ֥א הָאָ֖רֶץ אֹתָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבְנֵי יִשְׂרָאֵל נְפִישׁוּ וְאִתְיַלָדוּ וּסְגִיאוּ וּתְקִיפוּ לַחֲדָא לַחֲדָא וְאִתְמְלִיאַת אַרְעָא מִנְהוֹן:", "onk_en": "The B’nei Yisrael were fruitful and prolific, and their population multiplied. They were exceedingly mighty, and the land was filled with them.", "pj": "וּבְנוֹי דְיִשְרָאֵל נְפִישׁוּ וְאִתְיְלִידוּ וּסְגוּ וְאִתְקִיפוּן לַחֲדָא לַחֲדָא וְאִתְמְלִיאַת אַרְעָא מִנְהוֹן", "pj_en": "And the souls of Israel increased, and multiplied children, and became strong, and prevailed greatly, and the land was filled with them.", "tj": "", "tj_en": "", "rashi": "<b>פרו.<\/b> שלא הפילו נשותיהם ולא מתו כשהם קטנים: <br><br><b>וישרצו.<\/b> שֶׁהָיוּ יוֹלְדוֹת שִׁשָּׁה בְּכָרֵס אֶחָד (שם):", "rashi_en": "That there women did not miscarry and did not die when they were young.<br><br>וישרצו AND THEY INCREASED ABUNDANTLY (more lit., they swarmed, a word used of the prolificness of reptiles) — they bore six children at one birth (the six words from פרו to מאד suggest or imply the number six) (Midrash Tanchuma, Shemot 5)."}, {"ch": 1, "v": 8, "aliyah": 1, "heb": "וַיָּ֥קׇם מֶֽלֶךְ־חָדָ֖שׁ עַל־מִצְרָ֑יִם אֲשֶׁ֥ר לֹֽא־יָדַ֖ע אֶת־יוֹסֵֽף׃", "onk": "וְקָם מַלְכָּא חַדְתָּא עַל מִצְרָיִם דְלָא <b>מְקַיֵם גְזֵרַת<\/b> יוֹסֵף:", "onk_en": "A new king came into power over Egypt, who did not know [<b>fulfill<\/b>] Yoseif[<b>’s decree<\/b>].", "pj": "וְקָם מִלִיךְ חָדַת כְּמִין שֵׁירוּיָא עַל מִצְרַיִם דְלָא חֲכִּים יַת יוֹסֵף וְלָא הֲלִיךְ בְּנִימוּסוֹי", "pj_en": "And there arose a new king (other) than he who was formerly over Mizraim, who took no knowledge of Joseph, and walked not in his laws.", "tj": "וְקָם מַלְכָּא בְּשֵׁירוּי עַל מִצְרַיִם דְלָא חֲכִּים יַת יוֹסֵף וְלָא הֲלִיךְ בְּנִימוּסוֹי:", "tj_en": "And a king arose (different from him who was) formerly over Mizraim, who took no knowledge of Joseph, and walked not in his laws.", "rashi": "<b>ויקם מלך חדש.<\/b> רַב וּשְׁמוּאֵל, חַד אָמַר חָדָשׁ מַמָּשׁ, וְחַד אָמַר שֶׁנִּתְחַדְּשׁוּ גְּזֵרוֹתָיו:<br><br><b>אשר לא ידע.<\/b> עָשָׂה עַצְמוֹ כְּאִלּוּ לֹא יְדָעוֹ (סוטה י\"א):", "rashi_en": "ויקם מלך חדש NOW THERE AROSE A NEW KING — Rab and Samuel (two Amoraim or Talmudical teachers) differed in their interpretation of these words. One said that he was really a new king; the other said that it was the same king but he made new edicts (Sotah 11a).<br><br>אשר לא ידע WHO KNEW NOT [JOSEPH] — he comported himself as though he did not know him (Sotah 11a)."}, {"ch": 1, "v": 9, "aliyah": 1, "heb": "וַיֹּ֖אמֶר אֶל־עַמּ֑וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְעָצ֖וּם מִמֶּֽנּוּ׃", "onk": "וַאֲמַר לְעַמֵהּ הָא עַמָא בְּנֵי יִשְׂרָאֵל סָגָן וְתַקִיפִין מִנָנָא:", "onk_en": "He said to his people, “Behold, the people of the B’nei Yisrael are becoming too numerous and strong for us.", "pj": "וַאֲמַר לְעַמֵיהּ הָא עַמָא בֵּית יִשְרָאֵל סַגִיאִין וְתַקְפִין יַתִּיר מִינָן", "pj_en": "And he said to his people, Behold now, the people of the house of Israel are many, and are stronger than we.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 10, "aliyah": 1, "heb": "הָ֥בָה נִֽתְחַכְּמָ֖ה ל֑וֹ פֶּן־יִרְבֶּ֗ה וְהָיָ֞ה כִּֽי־תִקְרֶ֤אנָה מִלְחָמָה֙ וְנוֹסַ֤ף גַּם־הוּא֙ עַל־שֹׂ֣נְאֵ֔ינוּ וְנִלְחַם־בָּ֖נוּ וְעָלָ֥ה מִן־הָאָֽרֶץ׃", "onk": "הָבוּ נִתְחַכַּם <b>לְהוֹן<\/b> דִלְמָא יִסְג<b>וּן<\/b> וִיהֵי אֲרֵי יְעַרְעִנָנָא קְרָב וְיִתּוֹסְפ<b>וּן<\/b> אַף <b>אִנוּן<\/b> עַל סַנְאָנָא וִיגִיחוּן בָּנָא <b>קְרָב וְיִסְקוּן<\/b> מִן אַרְעָא:", "onk_en": "Come let us deal wisely with him [<b>them<\/b>]. Lest he [<b>they<\/b>] increase so much, that, if there is war, he [<b>they<\/b>] will join our enemies and fight [<b>a war<\/b>] against us, driving us [<b>and they will go up<\/b>] from the land.", "pj": "אִיתוֹן כְּדוֹן נִתְיַעַט עֲלֵיהוֹן בְּהִלֵן דִינִין נַזְעַר יַתְהוֹן קֳדָם עַד לָא יִסְגוֹן וְיֶהֱוֵי אֲרוּם יָתָן סִדְרֵי קְרָבָא וְיִתּוֹסְפוּן לְחוֹד הִינוּן עַל סַנְאֵינָן וִישֵׁיצוּן יָתָנָא וְלָא יְשַׁיְירוּן מִינָן אוּף לָא חָד וּמִן בָּתַר כְּדֵין יִפְקוּן לְהוֹן מִן אַרְעָא", "pj_en": "Come, let us take counsel against them in these matters, to diminish them that they multiply not, so as that, should war be arrayed against us, they be not added to our adversaries, and destroy us that not one of us be left, and they afterward go forth from the land.", "tj": "וְיִקְטְלוּן יָתָן וְיִסְקוּן לְהוֹן בִּשְׁלָם מִן אַרְעָא:", "tj_en": "And they kill us, and go up in peace from the land.", "rashi": "<b>הבה נתחכמה.<\/b> כָּל הָבָה לְשׁוֹן הֲכָנָה וְהַזְמָנָה לְדָבָר הוּא, כְּלוֹמַר, הַזְמִינוּ עַצְמְכֶם לְכָךְ:<br><br><b>נתחכמה לו.<\/b> לָעָם; נִתְחַכְּמָה מַה לַּעֲשׂוֹת לוֹ. וְרַבּוֹתֵינוּ דָרְשׁוּ נִתְחַכֵּם לְמוֹשִׁיעָן שֶׁל יִשְׂרָאֵל לְדוּנָם בַּמַּיִם, שֶׁכְּבָר נִשְׁבַּע שֶׁלֹּא יָבִיא מַבּוּל לָעוֹלָם (שם):<br><br><b>ועלה מן הארץ.<\/b> עַל כָּרְחֵנוּ. וְרַבּוֹתֵינוּ דָרְשׁוּ כְּאָדָם שֶׁמְּקַלֵּל עַצְמוֹ וְתוֹלֶה קִלְלָתוֹ בַּאֲחֵרִים (שם), וַהֲרֵי הוּא כְּאִלּוּ כָתַב וְעָלִינוּ מִן הָאָרֶץ – וְהֵם יִירָשׁוּהָ:", "rashi_en": "הבה נתחכמה COME ON, LET US DEAL WISELY — Wherever הבה is used it has the meaning of preparing oneself and making oneself ready to do a particular matter; it signifies as much as: get yourself ready for this (cf. Rashi on Genesis 11:4 and Rashi on Genesis 38:16).<br><br>נתחכמה לו LET US DEAL WISELY WITH THEM (לו more lit., with him) — i. e. with the people (the word לו, which is singular, refers to עם used in the preceding verse in the phrase עם בני ישראל): let us consider wisely what to do to them. Our Rabbis, however, explained that the singular לו refers to God, and that the words mean: “let us use our wisdom against Him who would show Himself Israel’s deliverer, by sentencing them to death by water, since He has already sworn that He will not bring another flood upon the world, and He will therefore be unable to punish us ‘measure for measure’, as is His way.”)<br><br>ועלה מן הארץ AND HE WILL GO UP OUT OF THE LAND, against our will. Our Rabbis explained that they spoke like a person who is pronouncing a curse against himself but attaches the curse to others (because he does not wish to use an ominous expression of himself), so that it is as though Scripture wrote “and we shall have to go up out of the land” and they will take possession of it (Sotah 11a)."}, {"ch": 1, "v": 11, "aliyah": 1, "heb": "וַיָּשִׂ֤ימוּ עָלָיו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖וֹ בְּסִבְלֹתָ֑ם וַיִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְפַרְעֹ֔ה אֶת־פִּתֹ֖ם וְאֶת־רַעַמְסֵֽס׃", "onk": "וּמַנִיאוּ <b>עֲלֵיהוֹן<\/b> שִׁלְטוֹנִין <b>מַבְאִישִׁין<\/b> בְּדִיל לְעַנוֹאֵ<b>הוֹן בְּפָלְחָנְהוֹן<\/b> וּבְנוֹ קִרְוֵי בֵית אוֹצָרָא לְפַרְעֹה יָת פִּיתוֹם וְיָת רַעַמְסֵס:", "onk_en": "They appointed conscription [<b>cruel<\/b>] officers over him [<b>them<\/b>] to oppress him [<b>them<\/b>] with their burdens [<b>work<\/b>]. He [B’nei Yisrael] built supply cities for Pharaoh, Pisom and Ramseis.", "pj": "וְשַׁווּן עֲלֵיהוֹן רַבְרְבָנִין מְפַלְחָנִין מִן בִּגְלַל לְמִצְעֲרָא יַתְהוֹן בְּשִׁעֲבּוּדְהוֹן וּבִנְיַין קוּרְיַין תְלִילִין לְשׁוּם בֵּית אוֹצְרוֹי דְפַרְעה יַת טָאנֵיס וְיַת פִּילוּסִין", "pj_en": "And they set over them work-masters to afflict them in their servitude; and they builded walled cities to become Pharoh's treasure-places, Tanis and Pilusin.", "tj": "יַת טָנִיס וְיַת פִּילוּסִין:", "tj_en": "Tanis and Pilusin.", "rashi": "<b>עליו.<\/b> עַל הָעָם:<br><br><b>מסים.<\/b> לְשׁוֹן מַס, שָׂרִים שֶׁגּוֹבִין מֵהֶם הַמַּס, וּמַהוּ הַמַּס? שֶׁיִּבְנוּ עָרֵי מִסְכְּנוֹת לְפַרְעֹה:<br><br><b>למען ענתו בסבלתם.<\/b>‬ שֶׁל מִצְרַיִם:<br><br><b>ערי מסכנות.<\/b> כְּתַרְגּוּמוֹ, וְכֵן \"לֶךְ בֹּא אֶל הַסּוֹכֵן הַזֶּה\" (ישעיהו כ\"ב) – גִּזְבָּר הַמְמֻנֶּה עַל הָאוֹצָרוֹת:<br><br><b>את פתם ואת רעמסס.<\/b> שֶׁלֹּא הָיוּ רְאוּיוֹת מִתְּחִלָּה לְכָךְ, וַעֲשָׂאוּם חֲזָקוֹת וּבְצוּרוֹת לְאוֹצָר:", "rashi_en": "עליו [THEREFORE THEY DID SET] OVER THEM (עליו over him) i. e. over the people.<br><br>מסים has the meaning of tribute (מס), a forced levy of labour, so that שרי מסים are the officers who exact the tribute of labour from them. And what was this tribute? That they should build store-cities for Pharaoh.<br><br>למען ענותו בסבלותם TO AFFLICT THEM WITH THEIR BURDENS — i. e. the burdens of the Egyptians.<br><br>ערי מסכנות — Translate this as the Targum does: CITIES WHICH ARE PLACES FOR TREASURES; similarly we have, (Isaiah 22:15) “Go, get thes unto this steward (הסוכן)” — the treasurer appointed over the stores (Exodus Rabbah 2:1).<br><br>את פתם ואת רעמסס PITHOM AND RAMESES — These cities already existed but were not adapted originally for this purpose; now they strengthened them and fortified them to serve as store-cities."}, {"ch": 1, "v": 12, "aliyah": 1, "heb": "וְכַאֲשֶׁר֙ יְעַנּ֣וּ אֹת֔וֹ כֵּ֥ן יִרְבֶּ֖ה וְכֵ֣ן יִפְרֹ֑ץ וַיָּקֻ֕צוּ מִפְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וּכְמָא דִמְעַנַן <b>לְהוֹן<\/b> כֵּן סָגָן וְכֵן <b>תַּקְפִין<\/b> וַעֲקַת לְמִצְרָאֵי מִן קֳדָם בְּנֵי יִשְׂרָאֵל:", "onk_en": "But the more [the Egyptians] oppressed him [<b>them<\/b>], the more [the B’nei Yisrael] increased and spread [<b>became strong<\/b>]. [The Egyptians] came to loathe the B’nei Yisrael.", "pj": "וְהֵיכְמָא דִמְעַנְיַין לְהוֹן הֵיכְדֵין הֲווֹן סָגַן וְהֵיכְדַין הֲווֹן תַּקְפִין וְאִתְיַעֲקוּ מִצְרָאֵי בְּחַיֵיהוֹן מִן קֳדָם בְּנֵי יִשְרָאֵל", "pj_en": "But as much as they depressed them, so much they multiplied, and so much they prevailed, and the Mizraee were troubled in their lives before the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>וכאשר יענו אתו.<\/b> בְּכָל מַה שֶּׁהֵם נוֹתְנִין לֵב לְעַנּוֹת, כֵּן לֵב הַקָּבָּ\"ה לְהַרְבּוֹת וּלְהַפְרִיץ:<br><br><b>כן ירבה.<\/b> כֵּן רָבָה וְכֵן פָּרַץ. וּמִדְרָשׁוֹ, רוּחַ הַקֹּדֶשׁ אוֹמֶרֶת כֵּן, אַתֶּם אוֹמְרִים פֶּן יִרְבֶּה וַאֲנִי אוֹמֵר כֵּן יִרְבֶּה (סוטה י\"א):<br><br><b>ויקצו.<\/b> קָצוּ בְחַיֵּיהֶם. וְרַבּוֹתֵינוּ דָרְשׁוּ כְּקוֹצִים הָיוּ בְּעֵינֵיהֶם (שם):", "rashi_en": "וכאשר יענו אתו AND AS THEY AFFLICTED THEM — In whatsoever matter it was that they set their hearts upon afflicting them so was the heart of the Holy One, blessed be He, set upon multiplying them and making them grow apace.<br><br>כן ירבה signifies: so they multiplied and so they grew apace (i. e. God’s determination was carried out, the imperfect tenses of the verbs denoting the continuance of the increase and growth). This is the real meaning; but there is a Midrashic explanation of these imperfect tenses: The Holy spirit (God) said this: You say פן ירבה, “lest they increase”, but “I” say כן ירבה, “thus will they assuredly increase” (Sotah 11a).<br><br>ויקצו the word means, THEY WERE WEARY OF THEIR LIVES. Our Rabbis explained that it means that they were as thorns (קוצים) in their eyes (cf. Sotah 11a)."}, {"ch": 1, "v": 13, "aliyah": 1, "heb": "וַיַּעֲבִ֧דוּ מִצְרַ֛יִם אֶת־בְּנֵ֥י יִשְׂרָאֵ֖ל בְּפָֽרֶךְ׃", "onk": "וְאַפְלָחוּ מִצְרָאֵי יָת בְּנֵי יִשְׂרָאֵל בְּקַשְׁיוּ:", "onk_en": "The Egyptians enslaved the B’nei Yisrael, with body-breaking labor.", "pj": "וְשַׁעֲבִּידוּ מִצְרָאֵי יַת בְּנֵי יִשְרָאֵל בְּקַשְׁיוּ", "pj_en": "And the Mizraee enslaved the sons of Israel,", "tj": "", "tj_en": "", "rashi": "<b>בפרך.<\/b> בַּעֲבוֹדָה קָשָׁה, הַמְפָרֶכֶת אֶת הַגּוּף וּמְשַׁבַּרְתּוֹ (שם):", "rashi_en": "בפרך means with hard service which crushes (מפרכת) the body and shatters it (cf. Sotah 11b)."}, {"ch": 1, "v": 14, "aliyah": 1, "heb": "וַיְמָרְר֨וּ אֶת־חַיֵּיהֶ֜ם בַּעֲבֹדָ֣ה קָשָׁ֗ה בְּחֹ֙מֶר֙ וּבִלְבֵנִ֔ים וּבְכׇל־עֲבֹדָ֖ה בַּשָּׂדֶ֑ה אֵ֚ת כׇּל־עֲבֹ֣דָתָ֔ם אֲשֶׁר־עָבְד֥וּ בָהֶ֖ם בְּפָֽרֶךְ׃", "onk": "וְאַמְרָרוּ יָת חַיֵיהוֹן בְּפָלְחָנָא קָשְׁיָא בְּטִינָא וּבְלִבְנִין וּבְכָל פָּלְחָנָא בְּחַקְלָא יָת כָּל פָּלְחָנְהוֹן דְאַפְלָחוּ בְהוֹן בְּקַשְׁיוּ:", "onk_en": "They made their lives bitter with harsh labor involving mortar and bricks, and all kinds of work in the fields. All the work they made them do [was intended] to break them.", "pj": "וְאַמְרָרוּ יַת חַיֵיהוֹן בְּפוּלְחָנָא קַשְׁיָא בְּטִינָא וּבְלִיבְנִין וּבְכָל פּוּלְחָנָא בְּאַנְפֵּי בָרָא יַת כָּל פּוּלְחַנְהוֹן הֲווֹן מְפַלְחִין בְּהוֹן בְּקַשְׁיוּ", "pj_en": "and made their lives bitter by hard service in clay and bricks, and all the labour of the face of the field; and in all the work which they made them do was hardness.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 15, "aliyah": 1, "heb": "וַיֹּ֙אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽמְיַלְּדֹ֖ת הָֽעִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽאַחַת֙ שִׁפְרָ֔ה וְשֵׁ֥ם הַשֵּׁנִ֖ית פּוּעָֽה׃", "onk": "וַאֲמַר מַלְכָּא דְמִצְרַיִם לְחַיָתָא יְהוּדַיָתָא דְשׁוּם חָדָא שִׁפְרָה וְשּׁוּם תִּנְיֵתָא פּוּעָה:", "onk_en": "The king of Egypt spoke to the Hebrew midwives. The name of one of them was Shifrah, and the name of the other was Puah.", "pj": "וַאֲמַר פַּרְעה דָמָךְ הֲוָה חָמֵי בְּחֵילְמֵיהּ וְהָא כָּל אַרְעָא דְמִצְרַיִם קַיְימָא בְּכַף מוֹדָנָא חֲדָא וְטַלְיָא בַּר אִימְרָתָא בְּכַף מוֹדָנָא חֲדָא וַהֲוַת כַּרְעָא כַּף מוֹדָנָא מְטַלְיָא בְּגַוָה מִן יַד שָׁדַר וּקְרָא כָּל חַרְשֵׁי מִצְרַיִם וְתָנֵי לְהוֹן יַת חוּלְמֵיהּ מִן יַד פַּתְחִין פּוּמְהוֹן יֵינִיס וְיִמְבְּרֵס רֵישֵׁי חַרְשַׁיָא וְאָמְרִין לְפַרְעה בִּיר חַד עָתִיד לְמֶהֱוֵי מִתְיְלִיד בִּכְנִישַׁתְהוֹן דְיִשְרָאֵל דְעַל יְדוֹ עֲתִידָא לִמְחַרְבָא כָּל אַרְעָא דְמִצְרַיִם וּבְגִין כֵּן אִתְיַעַט פַּרְעה מַלְכָּא דְמִצְרַיִם לְחַיָיתָא יְהוֹדַיְיתָא דִשְׁמָא דְחָדָא שִׁפְרָה הִיא יוֹכֶבֶד וּשְׁמָא דְתִּנְיֵיתָא פּוּעָה הִיא מִרְיָם בְּרַתָּה", "pj_en": "And Pharoh told that he, being asleep, had seen in his dream, and, behold, all the land of Mizraim was placed in one scale of a balance, and a lamb, the young of a sheep, was ill the other scale; and the scale with the lamb in it overweighed. Forthwith he sent and called all the magicians of Mizraim, and imparted to them his dream. Immediately Jannis and Jambres, the chief of the magicians, opened their mouth and answered Pharoh,?A certain child is about to be born in the congregation of Israel, by whose hand will be destruc-tion to all the land of Mizraim. Therefore did Pharoh, king of Mizraim, give counsel to the Jehudith midwives, the name of one of whom was Shifra, who is Jokeved, and the name of the other Puvah, who is Miriam her daughter.", "tj": "וַאֲמַר מַלְכָּא דְמִצְרַיִם לְיוֹלַדְתָּא עִיבְרַיְיתָא דִשְׁמָא דַחֲדָא שִׁפְרָה וְהִיא הֲוַת יוֹכֶבֶד וּשְׁמָא דְתִנְיֵיתָא פּוּעָה הִיא הֲוַת מִרְיָם:", "tj_en": "And the king of Mizraim told the Hebrew midwives, the name of the first of whom was Shifra, and she was Jokeved, and the name of the second Puvah, she was Miriam.", "rashi": "<b>למילדת.<\/b> הוּא לְשׁוֹן מוֹלִידוֹת, אֶלָּא שֶׁיֵּשׁ לָ' קַל וְיֵשׁ לָ' כָּבֵד, כְּמוֹ שׁוֹבֵר וּמְשַׁבֵּר, דּוֹבֵר וּמְדַבֵּר, כָּךְ מוֹלִיד וּמְיַלֵּד:<br><br><b>שפרה.<\/b> יוֹכֶבֶד, עַל שֵׁם שֶׁמְּשַׁפֶּרֶת אֶת הַוָּלָד (שם):<br><br><b>פועה.<\/b> זוֹ מִרְיָם, שֶׁפּוֹעָה וּמְדַבֶּרֶת וְהוֹגָה לַוָּלָד (שם), כְּדֶרֶךְ הַנָּשִׁים הַמְפַיְּסוֹת תִּינוֹק הַבּוֹכֶה.<br><br><b>פועה.<\/b> לְשׁוֹן צְעָקָה, כְּמוֹ \"כַּיּוֹלֵדָה אֶפְעֶה\" (ישעיה מ\"ב):", "rashi_en": "למילדת (the Piel participle) — This is synonymous with מולידות (the Hiphil participle, and both denote the women who assist the mother in bringing the child to birth). But some verbs are used in forms of a light conjugation (i. e. one which has no strong Dagesh as a characteristic) or in forms of a strong conjugation (one that has such a Dagesh), as e. g., שׁוֹבֵר (Kal) and מְשַׁבֵּר (Piel); דּוֹבֵר (Kal) and מְדַבֵּר (Piel). both having the same meaning; similarly here we may have מוליד (the Hiphil — without a strong Dagesh) or מְיַלֵּד (the Piel), both signifying one who helps to bring to birth.<br><br>שפרה SHIPHRAH — This was Jochebed; she bore this additional name because she used to put the babe after its birth into good physical condition (משפרת) by the care she bestowed upon it (Sotah 11b).<br><br>פועה PUAH — This was Miriam, and she bore this additional name because she used to Call aloud and speak and croon to the babe just as women do who soothe a child when it is crying (Sotah 11b).<br><br>פועה has the meaning of crying aloud, as (Isaiah 42:14) “I will cry (אפעה) like a travailing woman”."}, {"ch": 1, "v": 16, "aliyah": 1, "heb": "וַיֹּ֗אמֶר בְּיַלֶּדְכֶן֙ אֶת־הָֽעִבְרִיּ֔וֹת וּרְאִיתֶ֖ן עַל־הָאׇבְנָ֑יִם אִם־בֵּ֥ן הוּא֙ וַהֲמִתֶּ֣ן אֹת֔וֹ וְאִם־בַּ֥ת הִ֖וא וָחָֽיָה׃", "onk": "וַאֲמַר כַּד תֶּהֶוְיָן מוֹלְדָן יָת יְהוּדַיָתָא וְתֶחְזְיָן עַל מַתְבְּרָא אִם בַּר הוּא תִּקְטְלַן יָתֵהּ וְאִם בְּרַתָּא הִיא ותְקַיְמִנַהּ:", "onk_en": "He said, “When you deliver Hebrew women, you must look at the birthstool. If it is a boy, kill him; but if it is a girl, let her live.”", "pj": "וַאֲמַר כַּד תֶּהֱוְיַין מוֹלְדָן יַת יְהוֹדַיְיתָא וְתִיסְתְּכִין עַלוֹי מַתְבְּרָא אִין בִּיר דְכַר הוּא וְתִקְטְלוּן יָתֵיהּ וְאִין בְּרַתָּא נוּקְבָא הִיא וְתִתְקַיֵים", "pj_en": "And he said, When you attend Jehudith women, and see them bear, if it be a male child, you shall kill him; but if a daughter, you may let her live.", "tj": "", "tj_en": "", "rashi": "<b>בילדכן.<\/b> כְּמוֹ בְּהוֹלִידְכֶן:<br><br><b>על האבנים.<\/b> מוֹשַׁב הָאִשָּׁה הַיּוֹלֶדֶת, בְּמָקוֹם אַחֵר (ישעיהו ל\"ז), קוֹרְאוֹ מַשְׁבֵּר; וְכָמוֹהוּ \"עוֹשֶׂה מְלָאכָה עַל הָאָבְנָיִם\" (ירמיהו י\"ח), – מוֹשַׁב כְּלִי אֻמָּנוּת יוֹצֵר חֶרֶשׂ:<br><br><b>אם בן הוא וגו'.<\/b> לֹא הָיָה מַקְפִּיד אֶלָּא עַל הַזְּכָרִים, שֶׁאָמְרוּ לוֹ אִצְטַגְנִינָיו שֶׁעָתִיד לְהִוָּלֵד בֵּן הַמּוֹשִׁיעַ אוֹתָם:<br><br><b>וחיה.<\/b> וְתִחְיֶה:", "rashi_en": "בילדכן WHEN YE DO THE OFFICE OF A MIDWIFE — This word (the Piel) has the same force as בהולידכן (the Hiphil): when you assist them to give birth.<br><br>על האבנים UPON THE STOOLS — the seat for the woman in the act of childbirth; in another passage (Isaiah 37:3) Scripture terms it מַשְׁבֵּר. Similar is, (Jeremiah 18:3) “He was at work on the אבנים\" — the place of the vessels of (being produced by) the craftsmanship of the potter.<br><br>אם בן הוא וגו IF IT BE A SON etc. — He was particular only about the male children because his astrologers had told him that there was to be born to a Hebrew woman a son who would become their deliverer (Exodus Rabbah 1:18).<br><br>וחיה has the same meaning as ותחיה THEN SHE SHALL LIVE."}, {"ch": 1, "v": 17, "aliyah": 1, "heb": "וַתִּירֶ֤אןָ הַֽמְיַלְּדֹת֙ אֶת־הָ֣אֱלֹהִ֔ים וְלֹ֣א עָשׂ֔וּ כַּאֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵיהֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַתְּחַיֶּ֖יןָ אֶת־הַיְלָדִֽים׃", "onk": "וּדְחִילָא חַיָתָא מִן <b>קֳדָם<\/b> יְיָ וְלָא עֲבָדָא כְּמָא דְמַלִיל עִמְהֶן מַלְכָּא דְמִצְרָיִם וְקַיָמָא יָת בְּנַיָא:", "onk_en": "The midwives [however] feared [<b>from before<\/b>] Elohim and did not do as the Egyptian king had told them, and they kept the infant boys alive.", "pj": "דְחִילָא חַיְיתָא מִן קֳדָם יְיָ וְלָא עָבָדוּ הֵיכְמָא דְמַלֵל עִמְהוֹן מַלְכָּא דְמִצְרַיִם וְקַיָימָא יַת בְּנַיָיא", "pj_en": "But the midwives feared before the Lord, and would not do according to what the king of Mizraim had said to them, but they saved the children.", "tj": "", "tj_en": "", "rashi": "<b>ותחיין את הילדים.<\/b> מְסַפְּקוֹת לָהֶם מַיִם וּמָזוֹן. תַּרְגּוּם הָרִאשׁוֹן וְקַיָּמָא, וְהַשֵּׁנִי וְקַיֵּמְתֻּן, לְפִי שֶׁלְּשׁוֹן עָבָר לִנְקֵבוֹת רַבּוֹת תֵּבָה זוֹ וְכַיּוֹצֵא בָהּ מְשַׁמֶּשֶׁת לְשׁוֹן פָּעֲלוּ וּלְשׁוֹן פְּעַלְתֶּם, כְּגוֹן \"וַתֹּאמַרְןָ אִישׁ מִצְרִי\" (שמות ב'), (לְשׁוֹן עָבָר) כְּמוֹ וַיֹּאמְרוּ לִזְכָרִים, \"וַתְּדַבֵּרְנָה בְּפִיכֶם\" (ירמיהו מ\"ד), לְשׁוֹן דִּבַּרְתֶּן, כְּמוֹ וַתְּדַבְּרוּ לִזְכָרִים, וְכֵן \"וַתְּחַלְּלֶנָה אֹתִי אֶל עַמִּי\" (יחזקאל י\"ג), לְשׁוֹן עָבָר חִלַּלְתֶּן, כְּמוֹ וַתְּחַלְּלוּ לִזְכָרִים:", "rashi_en": "ותחיין את הילדים This may mean THEY MAINTAINED THE CHILDREN IN LIFE — they provided them with food (Sotah 11b). The Targum renders ותחיין the first time it occurs (i. e. in this verse) by וקימא (which means, “and they — the women — preserved the babes”). and the second time (Exodus 1:18) by וקימתן (which means, “and ye women have preserved etc.”) The Targum is able to distinguish between the two meanings of this word, but this cannot be done in Hebrew because in the Hebrew language in the case of fem. plur. this word and similar forms (ending in נָה or ןָ) are used in the sense of “they did something” (3rd person) and in the sense of “ye did something” (2nd person). For example: (Exodus 2:19) “And they (the daughters of Jethro) said, (וַתֹּאמַרְןָ) “An Egyptian man etc.”, which is the past tense (the Rashi text must read here לשון עָבַר) (imperf. with Vau conv.), just as one would use וַיֹאמְרוּ if one were speaking of men; (Jeremiah 54:25) “Ye women have spoken (ותדברנה) with your mouths”, having the same meaning as דברתן, and corresponding to ותדברו when used of men; (Ezekiel 13:19) “And ye (women) have profaned Me (ותחללנה) among My people” which is a past tense, the same as חללתן corresponding to ותחללו when used of men."}, {"ch": 1, "v": 18, "aliyah": 2, "heb": "וַיִּקְרָ֤א מֶֽלֶךְ־מִצְרַ֙יִם֙ לַֽמְיַלְּדֹ֔ת וַיֹּ֣אמֶר לָהֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַדָּבָ֣ר הַזֶּ֑ה וַתְּחַיֶּ֖יןָ אֶת־הַיְלָדִֽים׃", "onk": "וּקְרָא מַלְכָּא דְמִצְרַיִם לְחַיָתָא וַאֲמַר לְהֶן מָה דֵין עֲבַדְתּוּן יָת פִּתְגָמָא הָדֵין וְקַיֵמְתּוּן יָת בְּנַיָא:", "onk_en": "The king of Egypt called for the midwives and said to them, “Why did you do this? You let the infant boys live.”", "pj": "וּקְרָא מַלְכָּא דְמִצְרַיִם לְחַיָיתָא וַאֲמַר לְהוֹן לְמָה דֵין עֲבַדְתּוּן יַת פִּתְגָמָא הָדֵין וּקְיַימְתּוּן יַת בְּנַיָא", "pj_en": "And the king of Mizraim called the midwives, and said to them, Why have you done this thing, and have saved the children?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 19, "aliyah": 2, "heb": "וַתֹּאמַ֤רְןָ הַֽמְיַלְּדֹת֙ אֶל־פַּרְעֹ֔ה כִּ֣י לֹ֧א כַנָּשִׁ֛ים הַמִּצְרִיֹּ֖ת הָֽעִבְרִיֹּ֑ת כִּֽי־חָי֣וֹת הֵ֔נָּה בְּטֶ֨רֶם תָּב֧וֹא אֲלֵהֶ֛ן<sup class=\"footnote-marker\">*<\/sup><i class=\"footnote\">(בכתר ארם צובה היה כתוב אֲלֵיהֶ֛ן)<\/i> הַמְיַלֶּ֖דֶת וְיָלָֽדוּ׃", "onk": "וַאֲמָרָא חַיָתָא לְפַרְעֹה אֲרֵי לָא כִנְשַׁיָא מִצְרְיָתָא יְהוּדַיָתָא אֲרֵי חֲכִּימָן אִנוּן עַד לָא עַלַת לְוָתְהֶן חַיָתָא וִילִידָן:", "onk_en": "The midwives said to Pharaoh, “The Hebrew women are not like the Egyptians. They know how to deliver. Even before a midwife gets to them, they have already given birth.”", "pj": "וַאֲמָרַן חַיְיתָא לְפַרְעה אֲרוּם לָא כִנְשַׁיָא מִצְרַיְתָא יְהוּדַיְיתָא אֲרוּם זְרִיזִין וְחַכִּימִין בְּדַעֲתֵּיהֶן הִינוּן קֳדָם עַד לָא תֵיתֵי לְוַותְהוֹן חַיְיתָא הִינִין תַּלְיַין עֵינֵיהֶן בִּצְלוֹי מַצְלָן וּבַעֲיָין רַחֲמִין מִן קֳדָם אֲבוּהֶן דְבִשְׁמַיָא וְהוּא שָמַע בְּקַל צְלוֹתְהוֹן מִן יַד הִינִין מִתְעַנְיַין וִילִידַן וּפָרְקַן בִּשְׁלָם", "pj_en": "And the mid-wives said to Pharoh, The Jehudith women are not as the Mizraite, for they are sturdy (or, courageous) and wise-minded: before the midwife cometh to them they lift up their eyes in prayer, supplicating mercy before their Father who is in heaven, who heareth the voice of their prayer, and at once they are heard, and bring forth, and are delivered in peace.", "tj": "אֲרוּם חָיָין אִינוּן עַד לָא יֵיתֵי לְוַתְהוֹן יְלָדָתֵי אִינוּן מַצְלַן קֳדָם אֲבוּהוֹן דְבִשְׁמַיָא וְהוּא עָנֵי יַתְהוֹן וְאִינוּן יַלְדָן:", "tj_en": "Because they are vivacious, and before the midwife cometh to them they pray before their Father who is in heaven, and He answereth them, and they bring forth.", "rashi": "<b>כי חיות הנה.<\/b> בְּקִיאוֹת כַּמְיַלְּדוֹת, תַּרְגּוּם מְיַלְּדוֹת חַיָּתָא. וְרַבּוֹתֵינוּ דָּרְשׁוּ הֲרֵי הֵן מְשׁוּלוֹת כְּחַיּוֹת הַשָּׂדֶה (סוטה י\"א), שֶׁאֵינָן צְרִיכוֹת מְיַלְּדוֹת. וְהֵיכָן מְשׁוּלוֹת לְחַיּוֹת? גּוּר אַרְיֵה, זְאֵב יִטְרָף (בראשית מ\"ט), בְּכוֹר שׁוֹרוֹ (דברים ל\"ג), אַיָּלָה שְׁלֻחָה (בראשית מ\"ט), וּמִי שֶׁלֹּא נִכְתַּב בּוֹ, הֲרֵי הַכָּתוּב כְּלָלָן וַיְבָרֶךְ אוֹתָם (שם), וְעוֹד כְּתִיב מָה אִמְּךָ לְבִיָּא (יחזקאל י\"ט):", "rashi_en": "כי חיות הנה signifies they are just as skilful as midwives. The Aramaic for מילדות, midwives, is חיתא (hence the term חיות in this verse). Our Rabbis, however, (taking this word in the sense of animals) gave the following explanation (Sotah 11b): they have been compared to the beasts of the field which do not require the help of midwives. And where are they compared to animals? (Genesis 49:9) “Judah is a young lion”; (Genesis 27) “Benjamin is a wolf that leareth”; (Deuteronomy 33:17) “Joseph is the firstling of his ox”; (Genesis 49:21) “Naphtali is a hind sent forth”. As for the ancestors of those tribes about whom such a comparison is not expressly written Scripture implicitly includes them in the several blessings bestowed upon their brothers, (and thus they also are compared, as their brothers, to animals), for Scripture states, (Genesis 49:28) “And he blessed them etc.” (cf. Rashi on these words). Then, again, it is written, (Ezekiel 19:2) “How was thy mother a lioness!” (The prophet is addressing the princes of Israel as the representatives of the people, and by the term “thy mother” means the progenitors of the nation; the chapter proceeds to speak of the mother’s offspring as “whelps”)."}, {"ch": 1, "v": 20, "aliyah": 2, "heb": "וַיֵּ֥יטֶב אֱלֹהִ֖ים לַֽמְיַלְּדֹ֑ת וַיִּ֧רֶב הָעָ֛ם וַיַּֽעַצְמ֖וּ מְאֹֽד׃", "onk": "וְאוֹטֵיב יְיָ לְחַיָתָא וּסְגִי עַמָא וּתְקִיפוּ לַחֲדָא:", "onk_en": "Elohim was good to the midwives, and the people increased and were very mighty.", "pj": "וְאוֹטִיב יְיָ לְחַיְיתָא וּסְגוֹ עַמָא וּתְקִיפוּ לַחֲדָא", "pj_en": "And the Lord did good to the midwives, and the people multiplied and prevailed greatly.", "tj": "", "tj_en": "", "rashi": "<b>וייטב.<\/b> הֵטִיב לָהֶן. וְזֶה חִלּוּק בְּתֵבָה שֶׁיְּסוֹדָהּ שְׁתֵּי אוֹתִיּוֹת וְנָתַן לָהּ וָי\"ו יוֹ\"ד בְּרֹאשָׁהּ, כְּשֶׁהִיא בָאָה לְדַבֵּר לְשׁוֹן וַיַּפְעִיל הוּא נָקוּד הַיּוֹ\"ד בְּצֵירֵי, שֶׁהוּא קָמָץ קָטָן, כְּגוֹן וַיֵּיטֶב אֱלֹהִים לַמְיַלְּדֹת, \"וַיֶּרֶב בְּבַת יְהוּדָה\" (איכה ב'), – הִרְבָּה תַּאֲנִיָּה. וְכֵן \"וַיֶּגֶל הַשְּׁאֵרִית\" דִנְבוּזַרְאֲדָן (דברי הימים ב' ל\"ו), – הִגְלָה אֶת הַשְּׁאֵרִית, \"וַיֶּפֶן זָנָב אֶל זָנָב\" (שופטים ט\"ו) – הִפְנָה הַזְּנָבוֹת זוֹ לָזוֹ, כָּל אֵלּוּ לְשׁוֹן הִפְעִיל אֶת אֲחֵרִים; וּכְשֶׁהוּא מְדַבֵּר בִּלְשׁוֹן וַיִּפְעַל, הוּא נָקוּד הַיּוֹ\"ד בְּחִירִק, כְּגוֹן \"וַיִּיטַב בְּעֵינָיו\" (ויקרא י'), לְשׁוֹן הוּטַב, וְכֵן וַיִּרֶב הָעָם, – נִתְרַבָּה הָעָם, \"וַיִּגֶל יְהוּדָה\" (מלכים ב כ\"ה) – הָגְלָה יְהוּדָה, \"וַיִּפֶן כֹּה וָכֹה\" (שמות ב׳:י״ב) – הִפְנָה לְכָאן וּלְכָאן. וְאַל תְּשִׁיבֵנִי וַיֵּלֶךְ, וַיֵּשֶׁב, וַיֵּרֶד, וַיֵּצֵא, לְפִי שֶׁאֵינָן מִגִּזְרָתָן שֶׁל אֵלּוּ, שֶׁהֲרֵי הַיּוֹ\"ד יְסוֹד בָּהֶן, יֵלֵךְ, יֵשֵׁב, יֵרֵד, יֵצֵא – י' אוֹת שְׁלִישִׁית בּוֹ:<br><br><b>וייטב אלהים למילדת.<\/b> מַהוּ הַטּוֹבָה?:", "rashi_en": "וַיֵּיטָב means HE DID GOOD TO THEM. — The following is the difference between certain forms in a word (verb) whose root is two letters when one prefixes ו and י to them: when it intends to express the meaning “and he caused someone or something to do a particular action” (i. e. the 3rd masc. sing, imperf. Hiphil with Vau conversive), the י has the vowel Tzéré which is what we call Kametz Katan, as, (in this verse) “And God dealt well (וַיֶּיטָב) with the midwives” (to Rashi the root it טב; we take it as יטב); (Lamentations 2:5) “וַיָרָב for the daughter of Judah [mourning]” i. e. He increased (made great) the mourning; (root רֹב; we take it as רבה). Similarly (II Chronicles 36:20) “וַיָּגָל the remnant” which occurs in connection with Nebuzaradon, i. e. he caused the remnant to be exiled; (Judges 15:4) וַיָּפָן tail to tail”, i. e. he turned the tails one towards the other (more lit., he caused one tail to turn to the other) — all these express the meaning “he caused others to do something” (i. e. they are of the Hiphil conjugation). When, however, it speaks in the sense of “and he did something” (3rd masc. sing, imperf. Kal with Vau conv.), the י has the vowel Chirik. For example, (Leviticus 10:20) “וַיִיטַב in his eyes” — this means, “it was good”. Similarly (in this verse) the people”, i. e. the people became many; (2 Kings 25:21) “וַיִגָל Judah”, i. e. Judah became an exile; (2:12) “וַיִפֵן this way and that way”, i. e. he turned this way and that way. Do not answer me (do not raise an objection) by quoting the words וַיֵּלֶךְ and וַיֵּשֶׁב and וַיַרֶד and וַיֵּצֵא (saying that these verbal forms also have ו and י prefixed and the י has the vowel Tzéré and yet they are Kal, not Hiphil forms), because these are not of the same class of verbs as those above-mentioned, for the י is part of the root in them — in יֵלֵךְ and יֵשֵׁב and יֵרֵד and יֵצֵא, the י is a third root letter in each of these.<br><br>וייטב אלהים למילדת THEREFORE GOD DEALT WELL WITH THE MIDWIVES — What was the good He dealt out to them? The next verse gives the reply to this —"}, {"ch": 1, "v": 21, "aliyah": 2, "heb": "וַיְהִ֕י כִּֽי־יָרְא֥וּ הַֽמְיַלְּדֹ֖ת אֶת־הָאֱלֹהִ֑ים וַיַּ֥עַשׂ לָהֶ֖ם בָּתִּֽים׃", "onk": "וַהֲוָה כַּד דְחִילָא חַיָתָא מִן <b>קֳדָם<\/b> יְיָ וַעֲבַד לְהוֹן בָּתִּין:", "onk_en": "Because the midwives feared [<b>from before<\/b>] God, He gave them houses.", "pj": "וַהֲוָה כַּד דְחִילָא חַיְתָא מִן קֳדָם יְיָ וּקְנוּ לְהוֹן שׁוּם טַב לְדָרַיָא וּבְנָא לְהוֹן מֵימְרָא דַיְיָ בֵּית מַלְכוּתָא וּבֵית כְּהוּנְתָּא רַבְּתָא", "pj_en": "And forasmuch as the midwives feared before the Lord, they obtained for themselves a good name unto the ages; and the Word of the Lord up-builded for them a royal house, even the house of the high priesthood.", "tj": "אֲרוּם דְחִילַן יְלָדָתָא מִן קֳדָם יְיָ וְקַנְיָין לְהוֹן שׁוּם טַב בְּגוֹ דָרַיָא וַעֲבָדוּ לְהוֹן בָּתִּים בֵּיתָא דִלְוִיָא וּבֵיתָא דִכְהוּנְתָא רַבְּתָא:", "tj_en": ". Because the midwives feared before the Lord, they obtained for themselves a good name in the midst of the ages, and made unto themselves houses,? The house of the Levites and the house of the high priesthood.", "rashi": "<b>ויעש להם בתים.<\/b> בָּתֵּי כְהֻנָּה וּלְוִיָּה וּמַלְכוּת שֶׁקְּרוּיִין בָּתִּים, כְּמוֹ שֶׁכָּתוּב: \"לִבְנוֹת אֶת בֵּית ה' וְאֶת בֵּית הַמֶּלֶךְ\" (מלכים א ט׳:א׳), כְּהֻנָּה וּלְוִיָּה מִיּוֹכֶבֶד וּמַלְכוּת מִמִּרְיָם‪.‬ כִּדְאִיתָא בְּמַסֶּכֶת סוֹטָה:‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬‬", "rashi_en": "ויעש להם בתים HE MADE THEM HOUSES — houses (dynasties) of the priesthood and the Levites and of royalty which are all termed בתים, “houses”, as it is said, (1 Kings 9:1) “and Solomon built the house of the Lord and the house of the king”: “the house of the Lord” i. e. a dynasty of priests and Levites — from Jochebed (Shifrah); and “the house of the king”, i. e. a royal dynasty — from Miriam (Puah), just as it is stated in Treatise Sotah 11b."}, {"ch": 1, "v": 22, "aliyah": 2, "heb": "וַיְצַ֣ו פַּרְעֹ֔ה לְכׇל־עַמּ֖וֹ לֵאמֹ֑ר כׇּל־הַבֵּ֣ן הַיִּלּ֗וֹד הַיְאֹ֙רָה֙ תַּשְׁלִיכֻ֔הוּ וְכׇל־הַבַּ֖ת תְּחַיּֽוּן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּפַקִיד פַּרְעֹה לְכָל עַמֵהּ לְמֵימָר כָּל בְּרָא דְיִתְיְלִיד <b>לִיהוּדָאֵי<\/b> בְּנַהֲרָא תִּרְמֻנֵהּ וְכָל בְּרַתָּא תְּקַיְמוּן:", "onk_en": "Pharaoh then commanded all his people, saying, “Every boy who is born [<b>to the Hebrews<\/b>] must be thrown into the river; but every girl shall be allowed to live.”", "pj": "וְכַד חָמָא פַּרְעה כְּדֵין פַּקֵיד לְכָל עַמֵיהּ לְמֵימָר כָּל בִּיר דְכַר דְאִתְלִיד לִיהוּדָאֵי בְּנַהֲרָא תִּטְלוֹקְנֵיהּ וְכָל בְּרַתָּא תְּקַיְימוּן", "pj_en": "But when Pharoh saw this, he commanded all his people, saying, Every male child that is born to the Jehudaee you shall cast into the river; but every daughter you may spare.", "tj": "", "tj_en": "", "rashi": "<b>לכל עמו.<\/b> אַף עֲלֵיהֶם גָּזַר (סוטה י\"ב), יוֹם שֶׁנּוֹלַד מֹשֶׁה אָמְרוּ לוֹ אִצְטַגְנִינָיו, הַיּוֹם נוֹלָד מוֹשִׁיעָן, וְאֵין אָנוּ יוֹדְעִים אִם מִמִּצְרַיִם אִם מִיִּשְׂרָאֵל, וְרוֹאִין אָנוּ שֶׁסּוֹפוֹ לִלְקוֹת בַּמַּיִם, לְפִיכָךְ גָּזַר אוֹתוֹ הַיּוֹם אַף עַל הַמִּצְרִיִּים, שֶׁנֶּאֱמַר כָּל הַבֵּן הַיִּלּוֹד, וְלֹא נֶאֱמַר הַיִּלּוֹד לָעִבְרִים; וְהֵם לֹא הָיוּ יוֹדְעִים שֶׁסּוֹפוֹ לִלְקוֹת עַל מֵי מְרִיבָה:", "rashi_en": "לכל עמו This may be translated AND PHARAOH GAVE COMMAND REGARDING ALL (לכל) HIS PEOPLE — Regarding them, too, he made a decree (Sotah 12a). For on the day when Moses was born his astrologers said to him, “To-day their deliverer has been born, but we know not whether he is born of an Egyptian father or of an Israelite; but we see by our astrological art that he will ultimately suffer misfortune through water”. Pharaoh therefore made a decree that day regarding the Egyptians also, as it is said here, “Every son that is born [ye shall cast into the river]”, and it is not stated “[every son] who is born to the Hebrews”. They (the astrologers), however, were not aware that Moses was ultimately to suffer misfortune through the waters of Meribah and not through the waters of the Nile (Exodus Rabbah 1:18; Sotah 12a; cf. also Rashi on Numbers 20:13)."}, {"ch": 2, "v": 1, "aliyah": 2, "heb": "וַיֵּ֥לֶךְ אִ֖ישׁ מִבֵּ֣ית לֵוִ֑י וַיִּקַּ֖ח אֶת־בַּת־לֵוִֽי׃", "onk": "וַאֲזַל גַבְרָא מִדְבֵית לֵוִי וּנְסִיב יָת בַּת לֵוִי:", "onk_en": "A man of the house of Levi went and married the daughter of Levi.", "pj": "וַאֲזַל עַמְרָם גַבְרָא דְמִשֵׁבֶט לֵוִי וְאוֹתִיב בְּכִילְתָא וְגִינוּנָא דְהִלוּלָא יַת יוֹכֶבֶד אִנְתְּתֵיהּ דְתָרִיךְ מִן קֳדָם גְזֵירְתָּא דְפַרְעה וַהֲוַת בְּרַת מֵאָה וּתְלָתִין שְׁנִין כַּד אֲהַדְרָהּ לְוָותֵיהּ וְאִתְעֲבֵיד לָהּ נִיסָא וְהַדְרַת לְעַלֵימוֹתָא כְּמָא דַהֲוַת כַּד הִיא זְעֵירְתָּא מִקְרְיָיא בְּרַת לֵוִי", "pj_en": "And Amram, a man of the tribe of Levi, went and returned to live in marriage with Jokeved his wife, whom he had put away on account of the decree of Pharoh. And she was the daughter of a hundred and thirty years when he returned to her; but a miracle was wrought in her, and she returned unto youth as she was, when in her minority she was called the daughter of Levi.", "tj": "וַאֲזַל גַבְרָא מִשִׁבְטָא דִלֵוִי וּנְסַב יַת יוֹכֶבֶד חֲבִיבָתֵיהּ לֵיהּ לְאִתָּא:", "tj_en": "And there went a man of the tribe of Levi and took Jokeved, who was beloved of him, (or, who was related to him,) to wife.", "rashi": "<b>ויקח את בת לוי.<\/b> פָּרוּשׁ הָיָה מִמֶּנָּה מִפְּנֵי גְּזֵרַת פַּרְעֹה, וְהֶחֱזִירָהּ וְעָשָׂה בָהּ לִקּוּחִין שְׁנִיִּים, וְאַף הִיא נֶהֶפְכָה לִהְיוֹת נַעֲרָה; וּבַת ק\"ל שָׁנָה הָיְתָה, שֶׁנּוֹלְדָה בְּבוֹאָם לְמִצְרַיִם בֵּין הַחוֹמוֹת, וּמָאתַיִם וָעֶשֶׂר נִשְׁתַּהוּ שָׁם, וּכְשֶׁיָּצְאוּ הָיָה מֹשֶׁה בֶּן שְׁמוֹנִים שָׁנָה, אִם כֵּן כְּשֶׁנִּתְעַבְּרָה מִמֶּנּוּ הָיְתָה בַּת מֵאָה וּשְׁלוֹשִׁים וְקוֹרֵא אוֹתָהּ בַּת לֵוִי (עי' סוטה י\"ב, בבא בתרא קי\"ט ושמות רבה):", "rashi_en": "ויקח את בת לוי AND HE HAD TAKEN TO WIFE A DAUGHTER OF LEVI — He had lived apart from her in consequence of Pharaoh’s decree that the children should, on their birth, be drowned. Now he took her back and entered into a second marriage with her, and she also physically became young again. For really she was then 130 years old — for she was born “between the walls” when they were about to enter Egypt (cf. Rashi on Genesis 46:15) and they (the Israelites) remained there 210 years, and when they left Egypt Moses was 80 years old; consequently when she became pregnant with him she was 130 years old — and yet Scripture calls her בת לוי a young daughter of Levi (Sota 12a; Bava Batra 119b)."}, {"ch": 2, "v": 2, "aliyah": 2, "heb": "וַתַּ֥הַר הָאִשָּׁ֖ה וַתֵּ֣לֶד בֵּ֑ן וַתֵּ֤רֶא אֹתוֹ֙ כִּי־ט֣וֹב ה֔וּא וַֽתִּצְפְּנֵ֖הוּ שְׁלֹשָׁ֥ה יְרָחִֽים׃", "onk": "וְעַדִיאַת אִתְּתָא וִילִידַת בָּר וַחֲזַת יָתֵהּ אֲרֵי טַב הוּא וְאַטְמַרְתֵּהּ תְּלָתָא יַרְחִין:", "onk_en": "The woman conceived and bore a son. She saw that he was [exceptionally] good, and she kept him hidden for three months.", "pj": "וְאִיתְעֲבָּרַת אִיתְּתָא וִילֵדַת בִּיר בְּסוֹף שִׁיתָּא יַרְחִין וְחָמַת יָתֵיהּ אֲרוּם בַּר קְיוֹמֵי הוּא וְאַטְמַרְתֵּיהּ תְּלַת יַרְחִין דִסְכוּמְהוֹן תִּשְׁעָא", "pj_en": "And the woman conceived and bare a son at the end of six months; and she saw him to be a child of steadfastness, (or, of steadfast life,) and hid him three months, which made the number nine.", "tj": "", "tj_en": "", "rashi": "<b>כי טוב הוא.<\/b> כְּשֶׁנּוֹלַד נִתְמַלֵּא הַבַּיִת כֻּלּוֹ אוֹרָה (סוטה י\"ב):", "rashi_en": "כי טוב הוא THAT HE WAS GOODLY — When he was born the whole house became filled with light (Sotah 12a)."}, {"ch": 2, "v": 3, "aliyah": 2, "heb": "וְלֹא־יָכְלָ֣ה עוֹד֮ הַצְּפִינוֹ֒ וַתִּֽקַּֽח־לוֹ֙ תֵּ֣בַת גֹּ֔מֶא וַתַּחְמְרָ֥הֿ בַחֵמָ֖ר וּבַזָּ֑פֶת וַתָּ֤שֶׂם בָּהּ֙ אֶת־הַיֶּ֔לֶד וַתָּ֥שֶׂם בַּסּ֖וּף עַל־שְׂפַ֥ת הַיְאֹֽר׃", "onk": "וְלָא יְכֵילַת עוֹד לְאַטְמָרוּתֵהּ וּנְסֵיבַת לֵהּ תֵּבוּתָא דְגוֹמֶא וְחַפָּתַהּ בְּחֵמָרָא וּבְזִפְתָּא וְשַׁוִיאַת בַּהּ יָת רַבְיָא וְשַׁוִיתַהּ בְּיַעֲרָא עַל כֵּיף נַהֲרָא:", "onk_en": "When she could no longer hide him, she took a papyrus box and coated it with clay and tar. She placed the child in it, and placed it in the reeds near the bank of the river.", "pj": "וְלָא הֲוַת אֶפְשַׁר לָהּ תּוּב לְאַטְמַרְתֵּיהּ דְמִצְרַיִם מַרְגִישִׁין עֲלָהּ וּנְסִיבַת לֵיהּ תֵּיבוּתָא דְטוּנֵס וַחֲפָהָא בְּחֵימְרָא וּבְזֵיפָתָא וְשַׁוְיַית בְּגַווָהּ יַת טַלְיָא וְשַׁוְיָתֵיהּ בְּגוֹ גוּמַיָא עַל גֵיף נַהֲרָא", "pj_en": "But she could conceal him no longer, for the Mizraee had become aware of him. And she took an ark of papyrus, (tunes,) and coated it with bitumen and pitch, and placed the child within it, and laid him among the reeds on the bank of the river.", "tj": "וְשַׁוִיתֵיהּ בְּאֶפְרָה עַל גַב נַהֲרָא:", "tj_en": "", "rashi": "<b>ולא יכלה עוד הצפינו.<\/b> שֶׁמָּנוּ לָהּ הַמִּצְרִיִּים מִיּוֹם שֶׁהֶחֱזִירָהּ, וְהִיא יְלָדַתּוּ לְשִׁשָּׁה חֳדָשִׁים וְיוֹם אֶחָד (שם), שֶׁהַיּוֹלֶדֶת לְשִׁבְעָה יוֹלֶדֶת לִמְקֻטָּעִין (נדה ל\"ח), וְהֵם בָּדְקוּ אַחֲרֶיהָ לְסוֹף תִּשְׁעָה:<br><br><b>גמא.<\/b> גְּמִי בִּלְשׁוֹן מִשְׁנָה (שבת ע\"ח), וּבְלַעַז יונק\"ו, וְדָבָר רַךְ הוּא וְעוֹמֵד בִּפְנֵי רַךְ וּבִפְנֵי קָשֶׁה (סוטה י\"ב):<br><br><b>בחמר ובזפת.<\/b> זֶפֶת מִבַּחוּץ וְטִיט מִבִּפְנִים, כְּדֵי שֶׁלֹּא יָרִיחַ אוֹתוֹ צַדִּיק רֵיחַ רַע שֶׁל זֶפֶת (שם):<br><br><b>ותשם בסוף.<\/b> הוּא לְשׁוֹן אֲגַם, רושיי\"ל בְּלַעַז, וְדוֹמֶה לוֹ \"קָנֶה וָסוּף קָמֵלוּ\" (ישעיהו י\"ט):", "rashi_en": "ולא יכלה עוד הצפינו AND SHE COULD NO LONGER CONCEAL HIM, because the Egyptians calculated the period from when he (Amram) took her back. She, however, bore him after a term of six months and one day — for a woman who gives birth to a child in the seventh month may do so in incomplete months (i. e. the seventh month of pregnancy may not be completed) (Niddah 38b) — and they (the Egyptians) made enquiry regarding her at the end of nine months (the normal term of pregnancy, but in this case three months after the child’s birth; therefore “she could no longer conceal him”).<br><br>גמא PAPER-REED — In the language of the Mishna it is called גמי (Shabbat 78a), and in old French junc. It is a flexible substance that offers resistance to the pressure of both soft and hard things (Sotah 12a).<br><br>בחמר ובזפת — with pitch (זפת) outside, but with slime (חמר) inside, in order that that righteous child might not smell the disagreeable odour of the pitch (Sotah 12a).<br><br>ותשם בסוף AND SHE PUT IT IN THE FLAGS — It (סוף) has the same meaning as אגם. old French rosel. Another example of the word is (Isaiah 19:6) “And reeds and flags (סוף) shall wither”."}, {"ch": 2, "v": 4, "aliyah": 2, "heb": "וַתֵּתַצַּ֥ב אֲחֹת֖וֹ מֵרָחֹ֑ק לְדֵעָ֕ה מַה־יֵּעָשֶׂ֖ה לֽוֹ׃", "onk": "וְאִתְעַתָּדַת אֲחָתֵהּ מֵרָחִיק לְמִידַע מָה יִתְעֲבֵד לֵהּ:", "onk_en": "[The child’s] sister stood herself at a distance to see what would happen to him.", "pj": "וְאִתְעֲתָּדַת מִרְיָם אַחְתֵיהּ מֵרָחִיק לְאִתְחַכְּמָא מָה יִתְעֲבֵד לֵיהּ", "pj_en": "And Miriam his sister stood at a distance to take knowledge of what would be done to him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 5, "aliyah": 2, "heb": "וַתֵּ֤רֶד בַּת־פַּרְעֹה֙ לִרְחֹ֣ץ עַל־הַיְאֹ֔ר וְנַעֲרֹתֶ֥יהָ הֹלְכֹ֖ת עַל־יַ֣ד הַיְאֹ֑ר וַתֵּ֤רֶא אֶת־הַתֵּבָה֙ בְּת֣וֹךְ הַסּ֔וּף וַתִּשְׁלַ֥ח אֶת־אֲמָתָ֖הּ וַתִּקָּחֶֽהָ׃", "onk": "וּנְחָתַת בַּת פַּרְעֹה לְמִסְחֵי עַל נַהֲרָא וְעוּלֵימָתָהָא מְהַלְכָן עַל כֵּיף נַהֲרָא וַחֲזַת יָת תֵּבוּתָא בְּגוֹ יַעֲרָא וְאוֹשֵׁטַת יָת אַמְתַהּ וּנְסֵבְתַהּ:", "onk_en": "Pharaoh’s daughter went down to bathe by the river, while her maids walked along the river’s edge. She saw the box among the reeds and sent her maid and she fetched it.", "pj": "וְגָרֵי מֵימְרָא דַיְיָ צוּלְקָא דְשִׁחֲנָא וְטָרֵיב בִּשְרָא בְּאַרְעָא דְמִצְרַיִם וְנִחְתַת בְּרַתֵּיהּ דְפַרְעה לְאִתְקַרְרָא עַל נַהֲרָא וְעוּלֵימְתָּהָא אָזְלַן עַל גֵיף נַהֲרָא וַחֲמַת יַת תֵּיבוּתָא בְּגוֹ גוּמַיָיא וְאוֹשִׁיטַת יַת גַרְמִידָא וּנְסִיבְתָּא וּמִן יַד אִיתַּסְיַית מִן שִׁיחְנָא וּמִן טְרִיבָא", "pj_en": "And the Word of the Lord sent forth a burning sore and inflammation of the flesh upon the land of Mizraim; and the daughter of Pharoh came down to refresh herself at the river. And her handmaids, walking upon the bank of the river, saw the ark among the reeds, and put forth the arm and took it, and were immediately healed of the burning and inflammation.", "tj": "", "tj_en": "", "rashi": "<b>לרחץ על היאר.<\/b> סָרֵס הַמִּקְרָא וּפָרְשֵׁהוּ: <b>ותרד בת פרעה על היאר לרחץ בו<\/b>:<br><br><b>על יד היאר.<\/b> אֵצֶל הַיְאוֹר, כְמוֹ \"רְאוּ חֶלְקַת יוֹאָב אֶל יָדִי\" (שמואל ב י\"ד), וְהוּא לְשׁוֹן יָד מַמָּשׁ, שֶׁיַּד הָאָדָם סְמוּכָה לוֹ. וְרַבּוֹתֵינוּ אָמְרוּ, \"הוֹלְכוֹת\" לְשׁוֹן מִיתָה (סוטה י\"ב), כְּמוֹ \"הִנֵּה אָנֹכִי הוֹלֵךְ לָמוּת\" (בראשית כ\"ה) – הוֹלְכוֹת לָמוּת לְפִי שֶׁמִּחוּ בָהּ; וְהַכָּתוּב מְסַיְּעָן, כִּי לָמָּה לָנוּ לִכְתֹּב וְנַעֲרוֹתֶיהָ הוֹלְכוֹת:<br><br><b>את אמתה.<\/b> אֶת שִׁפְחָתָהּ. וְרַבּוֹתֵינוּ דָּרְשׁוּ (סוטה שם), לְשׁוֹן יָד, אֲבָל לְפִי דִּקְדּוּק לְשׁוֹן הַקֹּדֶשׁ הָיָה לוֹ לְהִנָּקֵד אַמָּתָהּ, דְּגוּשָׁה, וְהֵם דָּרְשׁוּ אֶת אֲמָתָהּ – אֶת יָדָהּ, וְנִשְׁתַּרְבְּבָה אַמָּתָהּ אַמּוֹת הַרְבֵּה:", "rashi_en": "לרחץ על היאר — Invert the order of the words in this verse and then explain it: “The daughter of Pharaoh went down על היאר, by the river, לרחץ to bathe in it”.<br><br>על יד היאר means BESIDE THE RIVER. Similar is (II Samuel 14:30) “See, the field of Joab is beside mine (על ידי)”. It really denotes even in this sense the actual hand, for a person’s hand is beside him (i. e. beside his body). Our Rabbis explained that the word הלכת “they were going” denotes dying, similar to (Genesis 25:32) “Behold I am going (הולך) to die” — they were going to their death because they attempted to prevent her from saving the child. Scripture, too, supports them in this explanation, for if this is not the meaning, why do we need that it should write “and her damsels were going”? (Scripture reports nothing as having happened because they were walking there. Why then stress this detail if it merely signifies that they were walking along the bank?).<br><br>את אמתה means her handmaid. Our Rabbis, however, explained it in the sense of hand (cf. Sotah 12b) — but according to the grammar of the Holy Language it should then have been written אַמָּתָה , dageshed in the מ. — And the reason why they explained את אמתה to mean את ידה “she stretched forth her hand” is because they hold that Scripture intentionally uses this term to indicate that her hand increased in length several cubits (אמה, a cubit) in order that she might more easily reach the cradle."}, {"ch": 2, "v": 6, "aliyah": 2, "heb": "וַתִּפְתַּח֙ וַתִּרְאֵ֣הוּ אֶת־הַיֶּ֔לֶד וְהִנֵּה־נַ֖עַר בֹּכֶ֑ה וַתַּחְמֹ֣ל עָלָ֔יו וַתֹּ֕אמֶר מִיַּלְדֵ֥י הָֽעִבְרִ֖ים זֶֽה׃", "onk": "וּפְתָחַת וַחֲזַת יָת רַבְיָא וְהָא עוּלֵימָא בָּכֵי וְחָסַת עֲלוֹהִי וַאֲמֶרֶת מִבְּנֵי יְהוּדָאֵי הוּא דֵין:", "onk_en": "She opened it and saw the child, and behold a boy was crying. She took pity on it, and said, “This is one of the Hebrew boys.”", "pj": "וּפְתָחַת וְחָמַת יַת רַבְיָא וְהָא טַלְיָא בָּכֵי וְחָסַת עֲלוֹי וַאֲמָרַת מִן בְּנֵי יְהוּדָאֵי הוּא דֵין", "pj_en": "And she opened, and saw the child, and, behold, the babe wept; and she had compassion upon him, and said, This is one of the children of the Jehudaee.", "tj": "", "tj_en": "", "rashi": "<b>ותפתח ותראהו.<\/b> אֶת מִי רָאֲתָה? <b>את הילד<\/b>, זֶהוּ פְּשׁוּטוֹ. וּמִדְרָשׁוֹ (שם), שֶׁרָאֲתָה עִמּוֹ שְׁכִינָה:<br><br><b>והנה נער בכה.<\/b> קוֹלוֹ כְּנַעַר (שם):", "rashi_en": "ותפתח ותראהו lit., AND SHE OPENED IT AND SHE SAW HIM — whom did she see? את הילד THE CHILD. This is the literal sense of the suffix in ותראהו. A Midrashic explanation is (taking את in the sense of “with”— she saw Him with the child): she saw the Shechina with him (cf. Sotah 12b).<br><br>והנה נער בכה lit., AND BEHOLD A BOY WEEPING — Although he was a ילד, “a child”, his voice was like that of a נער, a grown up boy (cf. Sotah 12b)."}, {"ch": 2, "v": 7, "aliyah": 2, "heb": "וַתֹּ֣אמֶר אֲחֹתוֹ֮ אֶל־בַּת־פַּרְעֹה֒ הַאֵלֵ֗ךְ וְקָרָ֤אתִי לָךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָעִבְרִיֹּ֑ת וְתֵינִ֥ק לָ֖ךְ אֶת־הַיָּֽלֶד׃", "onk": "וַאֲמֶרֶת אֲחָתֵהּ לְבַת פַרְעֹה הַאֵיזִיל וְאִקְרֵי לִיךְ אִתְּתָא מֵינִקְתָּא מִן יְהוּדַיָתָא וְתוֹנִיק לִיךְ יָת רַבְיָא:", "onk_en": "[The infant’s] sister said to Pharaoh’s daughter, “Shall I go and call to you a nursing [mother] from the Hebrew women to nurse the child for you?”", "pj": "וַאֲמָרַת אַחְתֵיהּ לְבַת פַּרְעה הַאִיזֵיל וְאִיקְרֵי לִיךְ אִיתְּתָא מֵנִיקְתָא יְהוּדַיְיתָא וְתוֹנִיק לִיךְ יַת רַבְיָא", "pj_en": "And his sister said to Pharoh's daughter, May I go and call for thee a nursing woman from the Jehudesses, to suckle the babe for thee?", "tj": "", "tj_en": "", "rashi": "<b>מן העברית.<\/b> שֶׁהֶחֱזִירַתּוּ עַל מִצְרִיּוֹת הַרְבֵּה לִינֹק וְלֹא יָנַק, לְפִי שֶׁהָיָה עָתִיד לְדַבֵּר עִם הַשְּׁכִינָה (שם):", "rashi_en": "מן העבריות OF THE HEBREWS — She expressly said, “shall I call a nurse of the Hebrews?” because she (Pharaoh’s daughter) had handed him to many Egyptian women to suckle him and he had refused to take suck — this was because he was destined to hold converse with the Shechina (Exodus Rabbah 1:21 and Sotah 12b)."}, {"ch": 2, "v": 8, "aliyah": 2, "heb": "וַתֹּֽאמֶר־לָ֥הּ בַּת־פַּרְעֹ֖ה לֵ֑כִי וַתֵּ֙לֶךְ֙ הָֽעַלְמָ֔ה וַתִּקְרָ֖א אֶת־אֵ֥ם הַיָּֽלֶד׃", "onk": "וַאֲמֶרֶת לַהּ בַּת פַּרְעֹה אֵיזִילִי וַאֲזָלַת עוּלֶמְתָּא וּקְרַת יָת אִמֵהּ דְרַבְיָא:", "onk_en": "“Go,” said Pharaoh’s daughter to her. The young girl went and called the child’s mother.", "pj": "וַאֲמָרַת לָהּ בְּרַת פַּרְעה אִיזִילִי וְאָזְלַת טַלְיָתָא וּקְרַת לְאִמֵיהּ דְרַבְיָא", "pj_en": "And Pharoh's daughter said, Go; and the damsel went and called the child's mother.", "tj": "", "tj_en": "", "rashi": "<b>ותלך העלמה.<\/b> הָלְכָה בִּזְרִיזוּת וְעַלְמוּת כְּעֶלֶם (שם):", "rashi_en": "ותלך העלמה AND THE YOUNG WOMAN WENT — she went eagerly and with vigour (עלמות) like a young man (עלם) (cf. Sotah 12b)."}, {"ch": 2, "v": 9, "aliyah": 2, "heb": "וַתֹּ֧אמֶר לָ֣הּ בַּת־פַּרְעֹ֗ה הֵילִ֜יכִי אֶת־הַיֶּ֤לֶד הַזֶּה֙ וְהֵינִקִ֣הוּ לִ֔י וַאֲנִ֖י אֶתֵּ֣ן אֶת־שְׂכָרֵ֑ךְ וַתִּקַּ֧ח הָאִשָּׁ֛ה הַיֶּ֖לֶד וַתְּנִיקֵֽהוּ׃", "onk": "וַאֲמֶרֶת לַהּ בַּת פַּרְעֹה אוֹבִילִי יָת רַבְיָא הָדֵין וְאוֹנְקִיהִי לִי וַאֲנָא אֶתֵּן יָת אַגְרָךְ וּנְסֵיבַת אִתְּתָא יָת רַבְיָא וְאוֹנִקְתֵּהּ:", "onk_en": "Pharaoh’s daughter said to her [the child’s mother], “Take this child and nurse him for me, and I will pay your fee.” The woman took the child and nursed it.", "pj": "וַאֲמָרַת לָהּ בְּרַת פַּרְעה אוֹבִילִי יַת רַבְיָא הָדֵין וְאוֹנִיקְתֵּיה לִי וַאֲנָא אִיתִּין יַת סוּטְרָךְ וּנְסִיבַת אִיתְּתָא יַת רַבְיָא וְאוֹנִיקְתֵּיהּ", "pj_en": "And the daughter of Pharoh said, Take this child and suckle it for me, and I will give thee thy wages And the woman took the child and suckled him.", "tj": "", "tj_en": "", "rashi": "<b>היליכי.<\/b> נִתְנַבְּאָה וְלֹא יָדְעָה מַה נִּתְנַבְּאָה – הֵי שֶׁלִּיכִי:", "rashi_en": "היליכי (the word may be explained as a compound of two Aramaic words, הי, here is, and ליכי, that which belongs to thee — thine own) — she prophesied without knowing what she was prophesying (unconsciously she stated the actual fact) — here is thine own (Exodus Rabbah 1:21 and Sotah 12b)."}, {"ch": 2, "v": 10, "aliyah": 2, "heb": "וַיִּגְדַּ֣ל הַיֶּ֗לֶד וַתְּבִאֵ֙הוּ֙ לְבַת־פַּרְעֹ֔ה וַֽיְהִי־לָ֖הּ לְבֵ֑ן וַתִּקְרָ֤א שְׁמוֹ֙ מֹשֶׁ֔ה וַתֹּ֕אמֶר כִּ֥י מִן־הַמַּ֖יִם מְשִׁיתִֽהוּ׃", "onk": "וּרְבָא רַבְיָא וְאַיְתִיתֵהּ לְבַת פַּרְעֹה וַהֲוָה לָהּ לְבָר וּקְרַת שְׁמֵהּ משֶׁה וַאֲמֶרֶת אֲרֵי מִן מַיָא שְׁחַלְתֵּהּ:", "onk_en": "When the child grew up, she brought him to Pharaoh’s daughter, and he became her son. She named him Moshe, for she said, “I drew him from the water.”", "pj": "וּרְבָא רַבְיָא וְאַיְיתִיתֵיהּ לִבְרַת פַּרְעה וַהֲוָה לָהּ חָבִיב הֵי כְּבִיר וּקְרַת שְׁמֵיהּ משֶה אֲרוּם אֲמָרַת מִן מוֹי דְנַהֲרָא שְׁחִילְתֵּיהּ", "pj_en": "And the child grew, and was brought to Pharoh's daughter, and he was beloved by her as a son; and she called his name Mosheh, Because, said she, I drew him out of the water of the river.", "tj": "דְלַיְתֵיהּ:", "tj_en": "I uplifted him.", "rashi": "<b>משיתהו.<\/b> שְׁחַלִיתֵהּ, הוּא לְשׁוֹן הוֹצָאָה בְּלָשׁוֹן אֲרַמִּי, \"כְּמִשְׁחַל בִּינְתָא מֵחֲלָבָא\", וּבְלְשׁוֹן עִבְרִי <b>משיתיהו<\/b> לְשׁוֹן הֲסִירוֹתִיו, כְּמוֹ לֹא יָמוּשׁ, לֹא מָשׁוּ, כָּךְ חִבְּרוֹ מְנַחֵם. וַאֲנִי אוֹמֵר שֶׁאֵינוֹ מִמַּחְבֶּרֶת מָשׁ וְיָמוּשׁ אֶלָּא מִגִּזְרַת מָשָׁה, וּלְשׁוֹן הוֹצָאָה הוּא, וְכֵן \"יַמְשֵׁנִי מִמַּיִם רַבִּים\", (שמואל ב כ\"ב), שֶׁאִלּוּ הָיָה מִמַּחְבֶּרֶת מָשׁ לֹא יִתָּכֵן לוֹמַר מְשִׁיתִיהוּ אֶלָּא הֲמִישׁוֹתִיהוּ, כַּאֲשֶׁר יֵאָמֵר מִן קָם הֲקִימוֹתִי, וּמִן שָׁב הֲשִׁיבוֹתִי, וּמִן בָּא הֲבִיאוֹתִי, אוֹ מַשְׁתִּיהוּ, כְּמוֹ \"וּמַשְׁתִּי אֶת עֲוֹן הָאָרֶץ\" (זכריה ג'), אֲבָל מָשִׁיתִי אֵינוֹ אֶלָּא מִגִּזְרַת תֵּבָה שֶׁפֹּעַל שֶׁלָּהּ מְיֻסָּד בְּהֵ\"א בְּסוֹף הַתֵּבָה, כְּגוֹן מָשָׁה, בָּנָה, עָשָׂה, צִוָּה, פָּנָה, כְּשֶׁיָּבֹא לוֹמַר בָּהֶם פָּעַלְתִּי, תָּבֹא הַיּוֹ\"ד בִּמְקוֹם הֵ\"א, כְּמוֹ בָּנִיתִי, עָשִׂיתִי, צִוִּיתִי:", "rashi_en": "משיתיהו The Targum renders this by שחלתיה which in the Aramaic language means drawing out. The word occurs in the Talmud, (Berakhot 8a) “as one draws out (משחל) a hair from milk”, and in the Hebrew language משיתיהו might be taken to mean “I have removed him”, just as, (Joshua 1:8) “it shall not depart (ימוש)”; (Numbers 14:44) “they did not depart (משו)”. Thus indeed did Menachem b. Seruk classify it (i. e. he put משיתיהו under the same root as מש and משו in the verses quoted; according to him a biliteral root מש, our ע\"ו root מוש). I, however, say, that it should not be classified together with מש and וימוש but that it is to be derived from משה, and that it means taking out, similar to (II Samuel 22:17) “He draws me out (ימשני) from many waters”. For if it were of the same class as מש, it would not be correct to say משיתיהו (in the Kal), but הֲמישׁוֹתִיהוּ a Hiphil form, (since this root in the Kal means “to depart” or “go away” and not “to make a thing go away”), just as from קם one says הֲקִימוֹתִי and from שב — הֲשִׁיבוֹתִי and from הֲבִיאוֹתִי — בא; or one must say מַשְתִּיהוּ (which is also a form from מוש used in a causative sense), just as, (Zechariah 3:9) “And I will remove (וּמַשְׁתִּי) the iniquity of that land”. But מָשִׁיתִי can only be derived from a word whose verbal form has a ה as a root letter at the end of the word, as e. g., משה and בנה and עשה and צוה and פנה. When it wishes to say in regard to these verbs, “I have done so-and-so” (a Kal), a י takes the place of the ה, as in בָּנִיתִי and עָשִׂיתִי and צִוִּיתִי."}, {"ch": 2, "v": 11, "aliyah": 3, "heb": "וַיְהִ֣י&thinsp;<b>׀<\/b> בַּיָּמִ֣ים הָהֵ֗ם וַיִּגְדַּ֤ל מֹשֶׁה֙ וַיֵּצֵ֣א אֶל־אֶחָ֔יו וַיַּ֖רְא בְּסִבְלֹתָ֑ם וַיַּרְא֙ אִ֣ישׁ מִצְרִ֔י מַכֶּ֥ה אִישׁ־עִבְרִ֖י מֵאֶחָֽיו׃", "onk": "וַהֲוָה בְּיוֹמַיָא הָאִנוּן וּרְבָא משֶׁה וּנְפַק לְוָת אַחוֹהִי וַחֲזָא בְּפָלְחַנְהוֹן וַחֲזָא גְבַר מִצְרִי מָחֵי לִגְבַר יְהוּדִי מֵאַחוֹהִי:", "onk_en": "It was in those days when Moshe was grown that he [began] to go out to his brethren, and he saw their burdens [hard labor]. [One day] he saw an Egyptian beating one of his Hebrew brethren.", "pj": "וַהֲוָה בְּיוֹמַיָא הָאִינוּן וּרְבָא משֶׁה וּנְפַק לְוַת אָחוֹהִי וַחֲמָא בַּאֲנֵיק נַפְשֵׁיהוֹן וּבְסוּגֵי פּוּלְחַנְהוֹן וַחֲמָא גְבַר מִצְרָאֵי מָחֵי גְבַר יְהוּדָאֵי מֵאֲחוֹי", "pj_en": "And in those days when Mosheh was grown up, he went forth to his brethren, and saw the anguish of their souls, and the greatness of their toil. And he saw a Mizraite man strike a Jewish man of his brethren;", "tj": "", "tj_en": "", "rashi": "<b>ויגדל משה.<\/b> וַהֲלֹא כְּבָר כָּתַב וַיִּגְדַּל הַיֶּלֶד? אָמַר רַבִּי יְהוּדָה בְּרַבִּי אִלְעַאי, הָרִאשׁוֹן לְקוֹמָה וְהַשֵּׁנִי לִגְדֻלָּה, שֶׁמִּנָּהוּ פַּרְעֹה עַל בֵּיתוֹ (ילקוט שמעוני):<br><br><b>וירא בסבלתם.<\/b> נָתַן עֵינָיו וְלִבּוֹ לִהְיוֹת מֵצֵר עֲלֵיהֶם (שמות רבה א'):<br><br><b>איש מצרי.<\/b> נוֹגֵשׂ הָיָה מְמֻנֶּה עַל שׁוֹטְרֵי יִשְׂרָאֵל וְהָיָה מַעֲמִידָם מִקְּרוֹת הַגֶּבֶר לִמְלַאכְתָּם (שם):<br><br><b>מכה איש עברי.<\/b> מַלְקֵהוּ וְרוֹדֵהוּ. וּבַעְלָהּ שֶׁל שְׁלוֹמִית בַּת דִּבְרִי הָיָה וְנָתַן עֵינָיו בָּהּ, וּבַלַּיְלָה הֶעֱמִידוֹ וְהוֹצִיאוֹ מִבֵּיתוֹ, וְהוּא חָזַר וְנִכְנַס לַבַּיִת וּבָא עַל אִשְׁתּוֹ, כִּסְבוּרָה שֶׁהוּא בַעְלָהּ, וְחָזַר הָאִישׁ לְבֵיתוֹ וְהִרְגִּישׁ בַּדָּבָר, וּכְשֶׁרָאָה אוֹתוֹ מִצְרִי שֶׁהִרְגִּישׁ בַּדָּבָר, הָיָה מַכֵּהוּ וְרוֹדֵהוּ כָּל הַיּוֹם (שם):", "rashi_en": "ויגדל משה AND MOSES WAS GROWN — But has it not already been written, (Exodus 2:10) “And the child grew”? Rabbi Judah the son of Eloai said: the first time it refers to growth in stature, the second time to greatness, — that Pharaoh appointed him to have charge over his palace (Tanchuma Yashan 2.2:17; cf. also Yalkut Shimoni on Torah 166:11).<br><br>וירא בסבלתם AND HE SAW THEIR BURDENS — he set his eyes and mind to share in their distress. (Exodus Rabbah 1:27)<br><br>איש מצרי AN EGYPTIAN MAN — This was one of the taskmasters appointed over the Israelite officers and he used to rouse them from their beds at cock-crow that they might proceed to their work (Exodus Rabbah 1:28 and Leviticus Rabbah 32:4).<br><br>מכה איש עברי SMITING A HEBREW MAN — beating and flogging him. The latter was the husband of Shelomith, the daughter of Dibri (see Leviticus 24:11), and the Egyptian taskmaster had set his fancy upon her. During the night he compelled him (her husband) to rise and made him leave the house. He, however, returned, entered the house and forced his attentions upon the woman, she believing it was her husband. The man returned and became aware of what had happened, and when the Egyptian perceived that he was aware of it he beat him and flogged him the whole day long (Exodus Rabbah 1:28)."}, {"ch": 2, "v": 12, "aliyah": 3, "heb": "וַיִּ֤פֶן כֹּה֙ וָכֹ֔ה וַיַּ֖רְא כִּ֣י אֵ֣ין אִ֑ישׁ וַיַּךְ֙ אֶת־הַמִּצְרִ֔י וַֽיִּטְמְנֵ֖הוּ בַּחֽוֹל׃", "onk": "וְאִתְפְּנֵי לְכָא וּלְכָא וַחֲזָא אֲרֵי לֵית גַבְרָא וּמְחָא יָת מִצְרָאָה וְטַמְרֵהּ בְּחָלָא:", "onk_en": "He [Moshe] looked all around and [when] he saw that no man was there [watching], he killed the Egyptian and hid his body in the sand.", "pj": "וְאִיסְתַּכֵּל משֶׁה בְחָכְמַת דַעְתֵּיהּ וְאִתְבּוֹנָן בְּכָל דַר וְדַר וְהָא לָא קָאִים מִן הַהוּא מִצְרָאֵי גְבַר גִיוֹר וְלָא דְעָבִיד תְּתוּבָא מִן בְּנֵי בְּנוֹי עַד עַלְמָא וּמְחָא יַת מִצְרָאֵי וְטַמְרֵיהּ בְּחָלָא", "pj_en": "and Mosheh turned, and considered in the wisdom of his mind, and understood that in no generation would there arise a proselyte from that Mizraite man, and that none of his children's children would ever be converted; and he smote the Mizraite, and buried him in the sand.", "tj": "וְאִסְתַּכֵּל משֶׁה בְּרוּחַ קוּדְשָׁא בִּתְרֵין עוּלֵימַיָא וְהָא לֵית גִיוֹרָא עָתִיד לְמֵיקוּם מֵהַהוּא מִצְרַיָא וּקְטַל יַת מִצְרַיָא וּטְמָן יָתֵיהּ בְּחָלָא:", "tj_en": "And Mosheh, by the Holy Spirit, considering both the young men, saw that, behold, no proselyte would ever spring from that Mizraite; and he killed him, and hid him in the sand.", "rashi": "<b>ויפן כה וכה.<\/b> רָאָה מֶה עָשָׂה לוֹ בַּבַּיִת וּמֶה עָשָׂה לוֹ בַשָּׂדֶה (שם). וּלְפִי פְּשׁוּטוֹ כְּמַשְׁמָעוֹ:<br><br><b>וירא כי אין איש.<\/b> עָתִיד לָצֵאת מִמֶּנּוּ שֶׁיִּתְגַּיֵּר (ת\"י):", "rashi_en": "ויפן כה וכה AND HE TURNED THIS WAY AND THAT WAY — he saw what he had done to him in the house and what he had done to him in the field (outside the house. viz., the beating to which he had subjected him) (Exodus Rabbah 1.28). But according to the literal meaning it must be explained in its ordinary sense: he turned this way and that way.<br><br>וירא כי אין איש AND HE SAW THAT THERE WAS NO MAN destined to issue from him, who would become an adherent of Israel’s religion (Exodus Rabbah 1:29; cf. Targum Jonathan on Exodus 2:12) ."}, {"ch": 2, "v": 13, "aliyah": 3, "heb": "וַיֵּצֵא֙ בַּיּ֣וֹם הַשֵּׁנִ֔י וְהִנֵּ֛ה שְׁנֵֽי־אֲנָשִׁ֥ים עִבְרִ֖ים נִצִּ֑ים וַיֹּ֙אמֶר֙ לָֽרָשָׁ֔ע לָ֥מָּה תַכֶּ֖ה רֵעֶֽךָ׃", "onk": "וּנְפַק בְּיוֹמָא תִנְיָנָא וְהָא תְּרֵין גֻבְרִין יְהוּדָאִין נָצָן וַאֲמַר לְחַיָבָא לְמָא אַתְּ מָחֵי לְחַבְרָךְ:", "onk_en": "He went out the next day, and behold two Hebrew men were quarreling. And he said to the wicked one, “Why are you beating your friend?”", "pj": "וּנְפַק בְּיוֹמָא תִּנְיָינָא וְאוֹדִיק וְהָא דָתָן וַאֲבִירָם גוּבְרִין יְהוּדָאִין נָצָן וְכַד חֲמָא דִי זְקַף דָתָן יְדֵיהּ עַל אֲבִירָם לְמִימְחֵיהּ אָמַר לֵיהּ לְמָא אַנְתְּ מָחֵי לְחַבְרָךְ", "pj_en": "And he went out the second day, and looked; and, behold, Dathan and Abiram, men of the Jehudaee contended; and seeing Dathan put forth his hand against Abiram to smite him, he said to him, Wherefore dost thou smite thy companion?", "tj": "", "tj_en": "", "rashi": "<b>שני אנשים עברים.<\/b> דָּתָן וַאֲבִירָם, הֵם שֶׁהוֹתִירוּ מִן הַמָּן (נדרים ס\"ד):<br><br><b>נצים.<\/b> מְרִיבִים:<br><br><b>למה תכה.<\/b> אַעַ\"פִּ שֶׁלֹּא הִכָּהוּ נִקְרָא רָשָׁע בַּהֲרָמַת יָד (סנהדרין נ\"ח):<br><br><b>רעך.<\/b> רָשָׁע כְּמוֹתְךָ (תנחומא):", "rashi_en": "שני אנשים עברים TWO MEN OF THE HEBREWS — viz., Dathan and Abiram (Nedarim 64b); it was they, too, who left over some of the manna (Exodus Rabbah 1:29).<br><br>נצים means quarelling.<br><br>למה תכה lit., WHEREFORE WILT THOU SMITE — Although he had not yet smitten him he is termed here רשע wicked, because he had merely raised his hand against him (Sanhedrin 58b).<br><br>רעך THY FELLOW (the word denotes one who is the equal of another) — who is as wicked as yourself (Exodus Rabbah 1:29)."}, {"ch": 2, "v": 14, "aliyah": 3, "heb": "וַ֠יֹּ֠אמֶר מִ֣י שָֽׂמְךָ֞ לְאִ֨ישׁ שַׂ֤ר וְשֹׁפֵט֙ עָלֵ֔ינוּ הַלְהׇרְגֵ֙נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּאֲשֶׁ֥ר הָרַ֖גְתָּ אֶת־הַמִּצְרִ֑י וַיִּירָ֤א מֹשֶׁה֙ וַיֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַדָּבָֽר׃", "onk": "וַאֲמַר מָן שַׁוְיָךְ לִגְבַר רַב וְדַיָן עֲלָנָא הַלְמִקְטְלִי אַתְּ אָמַר כְּמָא דִקְטַלְתָּ יָת מִצְרָאָה וּדְחִיל משֶׁה וַאֲמַר <b>בְּקוּשְׁטָא<\/b> אִתְיְדַע פִּתְגָמָא:", "onk_en": "He [the wicked one] said, “Who made you a man, officer and judge over us? Do you intend to kill me as you killed the Egyptian?” Moshe was frightened, and he said, “So [<b>Certainly<\/b>] the matter is known.”", "pj": "וַאֲמַר לֵיהּ דָתָן מַאן הוּא דְמַנֵי יָתָךְ לִגְבַר רַב וְדַיָין עֲלָנָא הֲלָא לְמִקְטְלִי אַנְתְּ אָמַר כְּמָא דִקְטַלְתָּ יַת מִצְרָאֵי וּדְחֵיל משֶׁה וַאֲמַר בְּקוּשְׁטָא אִתְפַּרְסַם פִּתְגָמָא", "pj_en": "And Dathan said to him, Who is he who hath appointed thee a chief man and a judge over us? Wilt thou kill me, said he, as thou didst the Mizraite? And Mosheh was afraid, and said, Verily, the thing has become known.", "tj": "", "tj_en": "", "rashi": "<b>מי שמך לאיש.<\/b> וְהִנֵה עוֹדְךָ נַעַר:<br><br><b>הלהרגני אתה אמר.<\/b> מִכָּאן אָנוּ לְמֵדִים שֶׁהֲרָגוֹ בַּשֵּׁם הַמְפֹרָשׁ (שמות רבה א'):<br><br><b>ויירא משה.<\/b> כִּפְשׁוּטוֹ. וּמִדְרָשׁוֹ: דָּאַג לוֹ עַל שֶׁרָאָה בְיִשְׂרָאֵל רְשָׁעִים דֵּלָטוֹרִין, אָמַר, מֵעַתָּה שֶׁמָּא אֵינָם רְאוּיִין לְהִגָּאֵל (שמות רבה א'):<br><br><b>אכן נודע הדבר.<\/b> כְּמַשְׁמָעוֹ. וּמִדְרָשׁוֹ, נוֹדַע לִי הַדָּבָר שֶׁהָיִיתִי תָּמֵהַּ עָלָיו, מֶה חָטְאוּ יִשְׂרָאֵל מִכָּל שִׁבְעִים אֻמּוֹת לִהְיוֹת נִרְדִּים בַּעֲבוֹדַת פֶּרֶךְ, אֲבָל רוֹאֶה אֲנִי שֶׁהֵם רְאוּיִים לְכָךְ (שמות רבה א'):", "rashi_en": "מי שמך לאיש WHO MADE THEE A PERSONAGE (lit., a man), and you are yet only a boy (Midrash Tanchuma, Shemot 10).<br><br>הלהרגני אתה אמר lit. WILT THOU SPEAK IN ORDER TO SLAY ME — From this we may learn that he had killed him by the mere utterance of the “Shem Hamephorash” (Midrash Tanchuma, Shemot 10; Exodus Rabbah 1:30).<br><br>ויירא משה AND MOSES FEARED — Explain it in its literal sense: he was afraid of Pharaoh. A Midrashic explanation is: he felt distressed because he saw that there were wicked men among the Israelites — common informers. He said: Since this is so (מעתה), perhaps they are not worthy to be delivered from bondage (Midrash Tanchuma, Shemot 10).<br><br>אכן נדע הדבר SURELY THE THING IS KNOWN — Explain it in its literal sense: the fact that I have killed the Egyptian is known. A Midrashic explanation is: now there is known to me that matter about which I have been puzzled — how has Israel sinned more than all the seventy nations, that they should be oppressed by this crushing servitude? But now I see that they deserve this (Exodus Rabbah 1:30)."}, {"ch": 2, "v": 15, "aliyah": 3, "heb": "וַיִּשְׁמַ֤ע פַּרְעֹה֙ אֶת־הַדָּבָ֣ר הַזֶּ֔ה וַיְבַקֵּ֖שׁ לַהֲרֹ֣ג אֶת־מֹשֶׁ֑ה וַיִּבְרַ֤ח מֹשֶׁה֙ מִפְּנֵ֣י פַרְעֹ֔ה וַיֵּ֥שֶׁב בְּאֶֽרֶץ־מִדְיָ֖ן וַיֵּ֥שֶׁב עַֽל־הַבְּאֵֽר׃", "onk": "וּשְׁמַע פַּרְעֹה יָת פִּתְגָמָא הָדֵין וּבְעָא לְמִקְטַל יָת משֶׁה וַעֲרַק משֶׁה מִן קֳדָם פַּרְעֹה וִיתֵיב בְּאַרְעָא דְמִדְיָן וִיתֵיב עַל בֵּירָא:", "onk_en": "Pharaoh heard about the matter, and he planned to kill Moshe. Moshe fled from Pharaoh, and resided in the land of Midian, and he sat [lived] near the well.", "pj": "וּשְׁמַע פַּרְעה יַת פִּתְגָמָא הָדֵין וּבְעָא לְמִקְטוֹל יַת משֶׁה וְעָרַק משֶׁה מִן קֳדָם פַּרְעה וִיתֵיב בְּאַרְעָא דְמִדְיָן וִיתֵב עַל בֵּירָא", "pj_en": "And Pharoh heard this thing, and sought to kill Mosheh; and Mosheh escaped before Pharoh, to dwell in the land of Midian. And he sat by a well.", "tj": "", "tj_en": "", "rashi": "<b>וישמע פרעה.<\/b> הֵם הִלְשִׁינוּ עָלָיו (שמות רבה א'):<br><br><b>ויבקש להרג את משה.<\/b> מְסָרוֹ לַקּוּסְטִינָר לְהָרְגוֹ וְלֹא שָׁלְטָה בוֹ הַחֶרֶב (שם), הוּא שֶׁאָמַר מֹשֶׁה \"וַיַּצִּלֵנִי מֵחֶרֶב פַּרְעֹה\" (שמות י״ח:ד׳):<br><br>(<b>וישב בארץ מדין.<\/b> נִתְעַכֵּב שָׁם; כְּמוֹ: \"וַיֵּשֶׁב יַעֲקֹב\" (בראשית ל\"ז):)<br><br><b>וישב על הבאר.<\/b> לְשׁוֹן יְשִׁיבָה. לָמַד מִיַּעֲקֹב שֶׁנִּזְדַּוֵּג לוֹ זִוּוּגוֹ מִן הַבְּאֵר (שמות רבה א'):", "rashi_en": "וישמע פרעה AND PHARAOH HEARD IT — they (Dathan and Abiram) slandered (denounced) him (Exodus Rabbah 1:31).<br><br>ויבקש להרג את משה AND HE SOUGHT TO SLAY MOSES — He handed him over to the executioner to slay him, but the sword proved powerless against him. It is to this that Moses referred when he said, (18:4) “And He delivered me from Pharaoh’s sword” (see Mechilta יתרו and Exodus Rabbah 1:31).<br><br>[וישב בארץ מדין AND HE ABODE IN THE LAND OF MIDIAN — the word וישב means he stayed there, as (Genesis 37:1) “And Jacob abode (וישב)‎”.]<br><br>וישב על הבאר — Here the word וישב has the meaning of sitting down. He learnt to sit at the well from Jacob whose marriage had been brought about by means of a well (Exodus Rabbah 1:32)."}, {"ch": 2, "v": 16, "aliyah": 3, "heb": "וּלְכֹהֵ֥ן מִדְיָ֖ן שֶׁ֣בַע בָּנ֑וֹת וַתָּבֹ֣אנָה וַתִּדְלֶ֗נָה וַתְּמַלֶּ֙אנָה֙ אֶת־הָ֣רְהָטִ֔ים לְהַשְׁק֖וֹת צֹ֥אן אֲבִיהֶֽן׃", "onk": "וּלְ<b>רַבָּא<\/b> דְמִדְיָן שְׁבַע בְּנָן וְאָתָאָה וּדְלָאָה וּמְלָאָה יָת רְהָטַיָא לְאַשְׁקָאָה עֲנָא דַאֲבוּהֵן:", "onk_en": "The priest [<b>minister<\/b>] of Midian had seven daughters. They came to draw water [from the well] and fill the troughs to water their father’s sheep.", "pj": "וּלְאוֹנֵיס דְמִדְיָן שְׁבַע בְּנָתָא וַאֲתוֹ וּדְלָאָה וּמְלָאָה יַת מוּרְכְוָותָא לְאַשְׁקָאָה יַת עָנָא דַאֲבוּהֶן", "pj_en": "And the priest of Midian had seven daughters; and they came and drew, and filled the watering-troughs, to give drink to the flocks of their father.", "tj": "", "tj_en": "", "rashi": "<b>ולכהן מדין.<\/b> רַב שֶׁבָּהֶן; וּפָרַשׁ לוֹ מֵעֲ\"זָ וְנִדּוּהוּ מֵאֶצְלָם (שם):<br><br><b>את הרהטים.<\/b> אֶת בְּרֵכוֹת מְרוּצוֹת הַמַּיִם הָעֲשׂוּיוֹת בָּאָרֶץ:", "rashi_en": "ולכהן מדין THE PRIEST OF MIDIAN — כהן signifies the chief amongst them (see Targ. Onkelos and Mekhilta יתרו); he had abandoned the idol-worship to which they were addicted and they banished him, driving him away from them (Exodus Rabbah 1:32).<br><br>את הרהטים THE GUTTERS — the troughs for the currents of water which are excavated in the ground."}, {"ch": 2, "v": 17, "aliyah": 3, "heb": "וַיָּבֹ֥אוּ הָרֹעִ֖ים וַיְגָרְשׁ֑וּם וַיָּ֤קׇם מֹשֶׁה֙ וַיּ֣וֹשִׁעָ֔ן וַיַּ֖שְׁקְ אֶת־צֹאנָֽם׃", "onk": "וַאֲתוֹ רָעַיָא וּטְרָדוּנוּן וְקָם משֶׁה וּפְרָקִנוּן וְאַשְׁקֵי יָת עַנְהֵן:", "onk_en": "Then the shepherds came and chased them away. Moshe got up and came to their aid, and then watered their sheep.", "pj": "וְאָתוּן רַעֲיָא וּטְרָדוּנִין וְקָם משֶׁה בְּכחַ גְבוּרְתֵּיהּ וּפְרָקִינִין וְאַשְׁקֵי יַת עַנְהֶן", "pj_en": "But the shepherds came and drave them away. And Mosheh arose in the power of his might, and rescued them, and gave the flocks drink.", "tj": "", "tj_en": "", "rashi": "<b>ויגרשום.<\/b> מִפְּנֵי הַנִּדּוּי (שם):", "rashi_en": "ויגרשם AND THEY DROVE THEM AWAY, because of the banishment into which their father and his family had been driven (Midrash Tanchuma, Shemot 11)."}, {"ch": 2, "v": 18, "aliyah": 3, "heb": "וַתָּבֹ֕אנָה אֶל־רְעוּאֵ֖ל אֲבִיהֶ֑ן וַיֹּ֕אמֶר מַדּ֛וּעַ מִהַרְתֶּ֥ן בֹּ֖א הַיּֽוֹם׃", "onk": "וַאֲתָאָה לְוַת רְעוּאֵל אֲבוּהֵן וַאֲמַר מָה דֵין אוֹחִיתוּן לְמֵיתֵי יוֹמָא דֵין:", "onk_en": "When they came to Reu’eil, their father, he said [to them], “How did you get to come [home] so early today?”", "pj": "וַאֲתָאָה לְוַת רְעוּאֵל אָבוּהָא דַאֲבוּהוֹן וַאֲמַר מַה דֵין אוֹחֵיתוּן לְמֵיתֵי יוֹמָא דֵין", "pj_en": "And they came to Reuel, their grandfather, who said to them, How is it that you are come (so) early today?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 19, "aliyah": 3, "heb": "וַתֹּאמַ֕רְןָ אִ֣ישׁ מִצְרִ֔י הִצִּילָ֖נוּ מִיַּ֣ד הָרֹעִ֑ים וְגַם־דָּלֹ֤ה דָלָה֙ לָ֔נוּ וַיַּ֖שְׁקְ אֶת־הַצֹּֽאן׃", "onk": "וַאֲמָרָא גַבְרָא מִצְרָאָה שֵׁזְבָנָא מִיַד רָעַיָא וְאַף מִדְלָא דְלָא לָנָא וְאַשְׁקֵי יָת עָנָא:", "onk_en": "They said, “An Egyptian rescued us from the hand of the shepherds; and he also drew [water] for us, and watered the sheep.”", "pj": "וְאָמָרָא גַבְרָא שֵׁיזְבָנָא מִן יְדָא דְרַעֲיָא לְחוֹד מִדוֹל חַד דָלָה לָן וְאַשְׁקֵי יַת עָנָא", "pj_en": "And they replied, A Mizraite man not only delivered us from the hand of the shepherds, but also himself drawing drew and watered the flock.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 20, "aliyah": 3, "heb": "וַיֹּ֥אמֶר אֶל־בְּנֹתָ֖יו וְאַיּ֑וֹ לָ֤מָּה זֶּה֙ עֲזַבְתֶּ֣ן אֶת־הָאִ֔ישׁ קִרְאֶ֥ן ל֖וֹ וְיֹ֥אכַל לָֽחֶם׃", "onk": "וַאֲמַר לִבְנָתֵיהּ וְאָן הוּא לְמָא דְנַן שְׁבַקְתִּין יָת גַבְרָא קְרַן לֵהּ וְיֵכוּל לַחְמָא:", "onk_en": "He said to his daughters, “And where is he? Why did you abandon the man? Call him and let him eat bread.”", "pj": "וַאֲמַר לִבְנָתֵיהּ דִבְרֵיהּ וְהָאן הוּא דְנַן שְׁבַקְתּוּן יַת גַבְרָא קְרֵין לֵיהּ וְיֵיכוּל לַחֲמָא", "pj_en": "And he said to his son's daughters, And where is he? Why did you leave the man? Call him, and let him eat bread.", "tj": "", "tj_en": "", "rashi": "<b>למה זה עזבתן.<\/b> הִכִּיר בּוֹ שֶׁהוּא מִזַּרְעוֹ שֶׁל יַעֲקֹב, שֶׁהַמַּיִם עוֹלִים לִקְרָאתוֹ (שמות רבה א'):<br><br><b>ויאכל לחם.<\/b> שֶׁמָּא יִשָּׂא אַחַת מִכֶּם; כְּמָה דְאַתְּ א
