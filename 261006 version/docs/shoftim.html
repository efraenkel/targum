<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>פרשת שופטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <div class="title-row">
    <h1>פרשת שופטים</h1>
    <div class="icon-btns">

      <button class="icon-btn" id="fontBtn" aria-label="הגדרות גופן">Aa</button>
      <button class="icon-btn" id="themeBtn" aria-label="החלף ערכת צבעים">🌓</button>

  <div class="topnav">

        <option value="'David Libre', serif">David Libre (ברירת מחדל, קריא)</option>
        <option value="'Frank Ruhl Libre', serif">Frank Ruhl Libre (אחיד עם הפסוק)</option>
        <option value="'Noto Sans Hebrew', sans-serif">Noto Sans (ללא תגים, הכי ברור)</option>
        <option value="'Noto Rashi Hebrew', serif">Noto Rashi (כתב רש״י מסורתי)</option>
      </select>

  <div class="aliyah-nav" id="aliyahNav"></div>
</header>
<div id="spacer"></div>
<main id="main"></main>

<script>
const SLUG = "shoftim";
const DATA = [{"ch": 16, "v": 18, "aliyah": 1, "heb": "שֹׁפְטִ֣ים וְשֹֽׁטְרִ֗ים תִּֽתֶּן־לְךָ֙ בְּכׇל־שְׁעָרֶ֔יךָ אֲשֶׁ֨ר יְהֹוָ֧ה אֱלֹהֶ֛יךָ נֹתֵ֥ן לְךָ֖ לִשְׁבָטֶ֑יךָ וְשָׁפְט֥וּ אֶת־הָעָ֖ם מִשְׁפַּט־צֶֽדֶק׃", "onk": "דַּיָּנִין וּפֻרְעָנִין תְּמַנֵּי לָךְ בְּכָל קִרְוָיךְ דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ לְשִׁבְטָיךְ וִידוּנוּן יָת עַמָּא <b>דִּין דִּקְשׁוֹט<\/b>:", "onk_en": "Judges and police officers you shall appoint for yourself in all of your cities that Adonoy, your God, is giving you for your tribes; who will judge the people righteous justice [<b>true judgment<\/b>].", "pj": "שופטים דַּיָּנִין קְשׁוּטִין וְסַרְכִין אַלִּימִין תְּמַנּוּן לְכוֹן בְּכָל קִירְוֵיכוֹן דַּיְיָ אֱלָהָכוֹן יָהִיב לְכוֹן לְשִׁבְטֵיכוֹן וִידוּנוּן יַת עַמָּא דִּין קְשׁוֹט", "pj_en": "UPRIGHT judges and efficient administrators you shall appoint in all your cities which the Lord your God will give you for your tribes, and they shall judge the people with true judgment.", "tj": "דַּיָּינִין וְסַרְכִין:", "tj_en": "Judges and administrators.", "rashi": "<b>שפטים ושטרים.<\/b> שׁוֹפְטִים – דַּיָּנִים הַפּוֹסְקִים אֶת הַדִּין, וְשׁוֹטְרִים – הָרוֹדִין אֶת הָעָם אַחַר מִצְוָתָם (שֶׁמַּכִּין וְכוֹפְתִין) בְּמַקֵּל וּבִרְצוּעָה עַד שֶׁיְּקַבֵּל עָלָיו אֶת דִּין הַשּׁוֹפֵט:<br><br><b>בכל שעריך.<\/b> בְּכָל עִיר וָעִיר:<br><br><b>לשבטיך.<\/b> מוּסָב עַל <b>תתן לך<\/b> – שׁוֹפְטִים וְשׁוֹטְרִים תִּתֶּן לְךָ לִשְׁבָטֶיךָ בְּכָל שְׁעָרֶיךָ אֲשֶׁר ה' אֱלֹהֶיךָ נֹתֵן לְךָ:<br><br><b>לשבטיך.<\/b> מְלַמֵּד שֶׁמּוֹשִׁיבִין דַּיָּנִין לְכָל שֵׁבֶט וָשֵׁבֶט וּבְכָל עִיר וָעִיר (ספרי; סנהדרין ט\"ז):<br><br><b>ושפטו את העם וגו'.<\/b> מַנֵּה דַּיָּנִין מֻמְחִים וְצַדִּיקִים לִשְׁפֹּט צֶדֶק (עי' ספרי):", "rashi_en": "שפטים ושטרים JUDGES AND BAILIFFS — שופטים are the judges who pronounce sentence, and שוטרים are those who chastise the people at their (the judges’) order [beating and binding the recalcitrant] with a stick and a strap until he accepts the judge’s sentence (Sanhedrin 16b and Rashi thereon; cf. Sifrei Devarim 144:6).<br><br>בכל שעריך IN ALL THY GATES — i.e. in each town (Sifrei Devarim 144:3).<br><br>לשבטיך THROUGHOUT THY TRIBES — This is to be connected with תתן לך, thus: judges and bailiffs shall you make yourself for your tribes in all all your cities that the Lord, your God, gives you.<br><br>לשבטיך THROUGHOUT THY TRIBES — This teaches that judges must be appointed for each tribe separately and each city separately (Sifrei Devarim 144:4; Sanhedrin 16b).<br><br>ושפטו את העם וגו׳ AND THEY SHALL JUDGE THE PEOPLE [WITH JUST JUDGMENT] — This means, appoint judges who are expert and righteous to give just judgment (cf. Sifrei Devarim 144:7)."}, {"ch": 16, "v": 19, "aliyah": 1, "heb": "לֹא־תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְלֹא־תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַשֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽיסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם׃", "onk": "לָא תַצְלֵי דִין לָא תִשְׁתְּמוֹדַע אַפִּין וְלָא תְקַבֵּל שֹׁחֲדָא אֲרֵי שֹׁחֲדָא מְעַוֵּר עֵינֵי חַכִּימִין <b>וּמְקַלְקֵל פִּתְגָּמִין תְּרִיצִין<\/b>:", "onk_en": "Do not pervert justice; do not display favoritism; and do not accept bribery, for bribery blinds the eyes of the wise and distorts words that are just [<b>perverts the words of justice<\/b>].", "pj": "לָא תֵיצְלוּן דִּינָא וְלָא תִסְבּוּן אַפִּין וְלָא תְקַבְּלוּן שׁוֹחֲדָא אֲרוּם שׁוֹחֲדָא מְסַמֵּי עֵינֵי חַכִּימַיָא דְנַסְבִין לֵיהּ דְּגָרִים לְהוֹן טִפְּשׁוּתָא וּמְעַרְבֵּב מִילִין זַכָּאִין בְּפוּם דַּיָּינַיָא בְּשַׁעַת דִּינֵיהוֹן", "pj_en": "You shall not set judgment aside, nor respect persons, nor take a gift, because a gift blindeth the eyes of the wise who take it; for it perverteth them to foolishness, and confuseth equitable words in the mouth of the judges in the hour of their decision", "tj": "לָא תִסְטוּן דִּינָא וְלָא תִסְבוּן אַפִּין וְלָא תִסְבוּן שׁוֹחַד דְּמָמוֹן אֲרוּם שׁוֹחֲדָא מְסַמֵּי עֵינוֹי דְחַכִּימַיָא וּמְקַלְקֵל מִילֵיהוֹן דְּזַכָּאִין בְּשַׁעַת דִּינֵיהוֹן:", "tj_en": "You shall not go astray in judgment, nor respect persons, nor take the wages of mammon; for a bribe blindeth the eyes of the wise, and depraveth their right words in the hour of their judgment.", "rashi": "<b>לא תטה משפט.<\/b> כְּמַשְׁמָעוֹ:<br><br><b>לא תכיר פנים.<\/b> אַף בִּשְׁעַת הַטְּעָנוֹת; אַזְהָרָה לַדַּיָּן שֶׁלֹּא יְהֵא רַךְ לָזֶה וְקָשֶׁה לָזֶה, אֶחָד עוֹמֵד וְאֶחָד יוֹשֵׁב, לְפִי שֶׁכְּשֶׁרוֹאֶה זֶה שֶׁהַדַּיָּן מְכַבֵּד אֶת חֲבֵרוֹ מִסְתַּתְּמִין טַעֲנוֹתָיו:<br><br><b>ולא תקח שחד.<\/b> אֲפִלּוּ לִשְׁפֹּט צֶדֶק (ספרי):<br><br><b>כי השחד יעור.<\/b> מִשֶּׁקִּבֵּל שֹׁחַד מִמֶּנּוּ אִי אֶפְשָׁר שֶׁלֹּא יַטֶּה אֶת לִבּוֹ אֶצְלוֹ לַהֲפֹךְ בִּזְכוּתוֹ:<br><br><b>דברי צדיקים.<\/b> דְּבָרִים הַמְצֻדָּקִים – מִשְׁפְּטֵי אֱמֶת:", "rashi_en": "לא תטה משפט means what it literally implies: THOU SHALT NOT PERVERT JUDGMENT.<br><br>ולא תכיר פנים AND THOU SHALT NOT RESPECT PERSONS — not even if it be only during the pleadings of the parties. This is an admonition addressed to the judge that he should not be lenient to one and harsh to the other, e.g. letting one stand and the other sit; because as soon as he (the party treated harshly) observes that the judge shows more respect to his fellow his ability to plead is hampered (i.e. he loses self-confidence and cannot present his case with assurance) (cf. Shevuot 30a).<br><br>ולא תקח שחד NEITHER TAKE BRIBERY — even if you mean to give a just judgment in favor of the giver (Sifrei Devarim 144:10; cf. Rashi on Exodus 23:8).<br><br>כי השחד יעור FOR BRIBERY DOES BLIND — As soon as he (the judge) has accepted a bribe from him (from one of the parties) it is impossible for him not to incline his heart to him trying to find something in his favor (Ketuvot 105b).<br><br>דברי צדיקם means, the words which have been described by the term “righteous” viz., the judgments of truth uttered on Sinai (cf. Rashi on Exodus 22:8 and Note thereon)."}, {"ch": 16, "v": 20, "aliyah": 1, "heb": "צֶ֥דֶק צֶ֖דֶק תִּרְדֹּ֑ף לְמַ֤עַן תִּֽחְיֶה֙ וְיָרַשְׁתָּ֣ אֶת־הָאָ֔רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֥ן לָֽךְ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "קֻשְׁטָא קֻשְׁטָא תְּהֵי רָדִיף בְּדִיל דְּתֵיחֵי וְתֵירַת יָת אַרְעָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ:", "onk_en": "Pursue absolute justice so that you may live and inherit the land that Adonoy, your God, is giving you.", "pj": "דִּין קְשׁוֹט וְדִין שְׁלַם בִּקְשׁוֹט תְּהֵי רָדִיף מִן בִּגְלַל דְּתֵיחוּן וְתֵירְתוּן יַת אַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן", "pj_en": "Upright and perfect judgment in truth shalt thou follow, that you may come to inherit the land which the Lord your God will give you.", "tj": "", "tj_en": "", "rashi": "<b>צדק צדק תרדף.<\/b> הַלֹּךְ אַחַר בֵּית דִּין יָפֶה (ספרי; סנהדרין ל\"ב):<br><br><b>למען תחיה וירשת.<\/b> כְּדַאי הוּא מִנּוּי הַדַּיָּנִין הַכְּשֵׁרִים לְהַחֲיוֹת אֶת יִשְׂרָאֵל וּלְהוֹשִׁיבָן עַל אַדְמָתָן (ספרי):", "rashi_en": "צדק צדק תרדף JUSTICE, JUSTICE SHALT THOU PURSUE — go to (search after) a reliable court (Sifrei Devarim 144:14; Sanhedrin 32b).<br><br>למען תחיה וירשת [JUSTICE, JUSTICE SHALT THOU PURSUE] THAT THOU MAYEST LIVE, AND INHERIT [THE LAND WHICH THE LORD THY GOD GIVETH THEE] — The appointment of honest judges is sufficient merit to keep Israel in life and to settle them in security in their land (Sifrei Devarim 144:15)."}, {"ch": 16, "v": 21, "aliyah": 1, "heb": "לֹֽא־תִטַּ֥ע לְךָ֛ אֲשֵׁרָ֖ה כׇּל־עֵ֑ץ אֵ֗צֶל מִזְבַּ֛ח יְהֹוָ֥ה אֱלֹהֶ֖יךָ אֲשֶׁ֥ר תַּעֲשֶׂה־לָּֽךְ׃", "onk": "לָא <b>תִצּוֹב<\/b> לָךְ אֲשֵׁרַת כָּל אִילָן בִּסְטַר מַדְבְּחָא דַּיְיָ אֱלָהָךְ דִּי תַעְבֶּד לָךְ:", "onk_en": "Do not plant an Asherah for yourself [or] any tree near the altar of Adonoy, your God, that you will make for yourself.", "pj": "הֵיכְמָא דְלֵיתֵיכוֹן רַשָּׁאִין לְמִנְצוֹב אֲשֵׁירָתָא לִסְטַר מַדְבְּחָא דַיְיָ הֵיכְדֵין לֵיתֵיכוֹן רַשָּׁאִין לִמְזַוְוגָא בְּדִינָא גַבְרָא טִפְּשָׁא עִם דַּיָינַיָא חַכִּימַיָא לְמַלִיפָא לְכוֹן יַת דְּתַעַבְּדוּן לְכוֹן", "pj_en": "As it is not allowed you to plant a grove by the side of the Lord’s altar, so is it not allowed you to associate in judgment a fool with a wise judge to teach that which you are to do.", "tj": "", "tj_en": "", "rashi": "<b>לא תטע לך אשרה.<\/b> לְחַיְּבוֹ עָלֶיהָ מִשְּׁעַת נְטִיעָתָהּ, וַאֲפִלּוּ לֹא עֲבָדָהּ עוֹבֵר בְּלֹא תַעֲשֶׂה עַל נְטִיעָתָהּ (שם):<br><br><b>לא תטע לך אשרה כל עץ אצל מזבח ה' אלהיך.<\/b> אַזְהָרָה לְנוֹטֵעַ אִילָן וּלְבוֹנֶה בַיִת בְּהַר הַבַּיִת:", "rashi_en": "לא תטע לך אשרה THOU SHALT NOT PLANT THEE AN ASHERA — This is intended to make one liable to punishment regarding it from the very moment that he plants it (the Ashera); even though he does not worship it he transgresses a negative command by the mere planting of it (Sifrei Devarim 145:1).<br><br>לא תטע לך אשרה כל עץ אצל מזבח ה' אלהיך THOU SHALT NOT PLANT THEE AN ASHERA, ANY TREE NEAR UNTO THE ALTAR OF THE LORD THY GOD — This is a prohibition addressed to one who would plant a tree or build a house on the Temple mount (הר הבית) (Sifrei Devarim 145:1)."}, {"ch": 16, "v": 22, "aliyah": 1, "heb": "וְלֹֽא־תָקִ֥ים לְךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהֹוָ֥ה אֱלֹהֶֽיךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְלָא תְקִים לָךְ קָמָא דִּי סָנֵי יְיָ אֱלָהָךְ:", "onk_en": "And do not erect for yourself a monument that Adonoy, your God, detests.", "pj": "וְהֵיכְמָא דְלֵיתֵיכוֹן רְשָׁאִין לְמִקְמָא קָמָא הֵיכְדֵין לֵיתֵיכוֹן רַשָּׁאִין לְמַנָאָה לְפַרְנָסָא גַּבְרָא זִידְנָא דְרַחֲקֵיהּ יְיָ אֱלָהָכוֹן", "pj_en": "As it is not for you to erect a statue, so are you not to appoint to be a governor a proud man, whom the Lord your God doth abhor.", "tj": "", "tj_en": "", "rashi": "<b>ולא תקים לך מצבה.<\/b> מַצֶּבֶת אֶבֶן אַחַת לְהַקְרִיב עָלֶיהָ אֲפִלּוּ לַשָּׁמַיִם:<br><br><b>אשר שנא.<\/b> מִזְבַּח אֲבָנִים וּמִזְבַּח אֲדָמָה צִוָּה לַעֲשׂוֹת, וְאֶת זוֹ שָׂנֵא, כִּי חֹק הָיְתָה לַכְּנַעֲנִיִּים, וְאַעַ\"פִּ שֶׁהָיְתָה אֲהוּבָה לוֹ בִּימֵי הָאָבוֹת, עַכְשָׁיו שְׂנֵאָהּ מֵאַחַר שֶׁעֲשָׂאוּהָ אֵלּוּ חֹק לַעֲבוֹדָה זָרָה (עי' שם):", "rashi_en": "ולא תקים לך מצבה NEITHER SHALT THOU RAISE ANY MONUMENT — i.e. a monument of one stone (cf. Rashi on Deuteronomy 12:3), not even in order to sacrifice on it to Heaven (to God).<br><br>אשר שנא WHICH [THE LORD THY GOD] HATETH — An altar of stones and an altar of earth He has commanded you to make; this, however, He hates, because it was a religious ordinance amongst the Canaanites. And although it was pleasing to Him in the days of our Patriarchs (cf. Genesis 28:18), now He hates it because these (Canaanites) made it an ordinance of an idolatrous character (cf. Sifrei Devarim 146)."}, {"ch": 17, "v": 1, "aliyah": 1, "heb": "לֹא־תִזְבַּח֩ לַיהֹוָ֨ה אֱלֹהֶ֜יךָ שׁ֣וֹר וָשֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה בוֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהֹוָ֥ה אֱלֹהֶ֖יךָ הֽוּא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תִכּוֹס <b>קֳדָם<\/b> יְיָ אֱלָהָךְ תּוֹר וְאִמָּר דִּי יְהֵי בֵיהּ מוּמָא כֹּל מִדַּעַם בִּישׁ <b>אֲרֵי מְרָחָק קֳדָם<\/b> יְיָ אֱלָהָךְ הוּא:", "onk_en": "Do not sacrifice to [<b>before<\/b>] Adonoy, your God, an ox or a lamb that has a blemish, any bad thing; for it is abominated [<b>distanced<\/b>] by [<b>before<\/b>] Adonoy, your God.", "pj": "לָא תִכְסוּן קֳדָם יְיָ אֱלָהָכוֹן תּוֹר וְאִימַר דִּיהֵי בֵיהּ מוּמָא אוֹ כָּל מִדַּעַם בִּישׁ דְּגָזִיל וְאָנִיס אֲרוּם מְרַחֵק קֳדָם יְיָ אֱלָהָכוֹן הוּא", "pj_en": "You shall not sacrifice before the. Lord your God a bullock or lamb which hath any blemish or evil in it, or which is torn or rent; for that is abominable before the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>לא תזבח … כל דבר רע.<\/b> אַזְהָרָה לַמְפַגֵּל בַּקֳּדָשִׁים עַ\"יְ דִּבּוּר רָע. וְעוֹד נִדְרְשׁוּ בוֹ שְׁאָר דְּרָשׁוֹת בִּשְׁחִיטַת קָדָשִׁים (זבחים ל\"ו):", "rashi_en": "לא תזבח ... כל דבר רע THOU SHALT NOT SACRIFICE [UNTO THE LORD THY GOD ANY OF THE HERD OR FLOCK WHEREIN IS BLEMISH OR] ANY EVIL THING — This is an admonition to one who would make sacrifices abominable through an evil utterance (דבר רע). (See Rashi on Leviticus 7:18; cf. Sifrei Devarim 147:5). Besides this, other Halachas have been derived from it in the Treatise on “The slaughtering of Sacrifices” (Zevachim 36)."}, {"ch": 17, "v": 2, "aliyah": 1, "heb": "כִּֽי־יִמָּצֵ֤א בְקִרְבְּךָ֙ בְּאַחַ֣ד שְׁעָרֶ֔יךָ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֣ן לָ֑ךְ אִ֣ישׁ אוֹ־אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת־הָרַ֛ע בְּעֵינֵ֥י יְהֹוָה־אֱלֹהֶ֖יךָ לַעֲבֹ֥ר בְּרִיתֽוֹ׃", "onk": "אֲרֵי יִשְׁתְּכַח בֵּינָךְ בַּחֲדָא מִקִּרְוָיךְ דַּיְיָ אֱלָהָךְ יָהֵב לָךְ גְּבַר אוֹ אִתְּתָא דִּי יַעְבֵּד יָת דְּבִישׁ <b>קֳדָם<\/b> יְיָ אֱלָהָךְ לְמֶעְבַּר עַל קְיָמֵיהּ:", "onk_en": "If there is found among you, in one of your cities that Adonoy, your God, is giving you, a man or a woman who does what is evil in the eyes of Adonoy, your God, by violating His covenant.", "pj": "אֲרוּם יִשְׁתַּכַּח בֵּינֵיכוֹן בַּחֲדָא מִן קוּרְיֵיכוֹן דַּיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן גְּבַר אוֹ אִיתָא דְּעָבַד דְּבִישׁ קֳדָם יְיָ אֱלָהָכוֹן לְמֵעִיבַר עַל קְיָימֵיהּ", "pj_en": "If there be found among you in one of your cities that the Lord your God will give you a man or woman who doth what is evil before the Lord your God in transgressing His covenant,", "tj": "", "tj_en": "", "rashi": "<b>לעבר בריתו.<\/b> אֲשֶׁר כָּרַת אִתְּכֶם שֶׁלֹּא לַעֲבֹד עֲבוֹדָה זָרָה:", "rashi_en": "לעבר בריתו TRANSGRESSING HIS COVENANT — i.e. the covenant which He made with you not to practise idolatry."}, {"ch": 17, "v": 3, "aliyah": 1, "heb": "וַיֵּ֗לֶךְ וַֽיַּעֲבֹד֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַיִּשְׁתַּ֖חוּ לָהֶ֑ם וְלַשֶּׁ֣מֶשׁ&thinsp;<b>׀<\/b> א֣וֹ לַיָּרֵ֗חַ א֛וֹ לְכׇל־צְבָ֥א הַשָּׁמַ֖יִם אֲשֶׁ֥ר לֹא־צִוִּֽיתִי׃", "onk": "וַאֲזַל וּפְלַח <b>לְטַעֲוַת עַמְמַיָּא<\/b> וּסְגִיד לְהוֹן וּלְשִׁמְשָׁא אוֹ לְסִיהֲרָא אוֹ לְכָל חֵילֵי שְׁמַיָּא דִּי לָא פַקֵּדִית:", "onk_en": "He goes and serves other gods [<b>idols of the nations<\/b>] and bows to them—whether to the sun or to the moon or to any of the host of heaven that I did not command.", "pj": "וַאֲזַל בָּתַר יִצְרָא בִּישָׁא וּפְלַח לְטַעֲוַות עַמְמַיָא וּסְגִיד לְהוֹן וּלְשִׁמְשָׁא אוֹ לְסִיהֲרָא אוֹ לְכָל חֵילָא שְׁמַיָא דְלָא פַקֵּידִית", "pj_en": "and, following after evil desire, shall serve the idols of the Gentiles, and worship them, or the sun, or the moon, or all the host of the heavens, which I have not commanded;", "tj": "", "tj_en": "", "rashi": "<b>אשר לא צויתי.<\/b> לְעָבְדָם (מגילה ט'):", "rashi_en": "אשר לא צויתי [AND HATH GONE AND SERVED OTHER GODS … EITHER THE SUN, OR MOON, OR ANY OF THE HOST OF HEAVEN] WHICH I HAVE NOT COMMANDED to worship them (Megillah 9b)."}, {"ch": 17, "v": 4, "aliyah": 1, "heb": "וְהֻֽגַּד־לְךָ֖ וְשָׁמָ֑עְתָּ וְדָרַשְׁתָּ֣ הֵיטֵ֔ב וְהִנֵּ֤ה אֱמֶת֙ נָכ֣וֹן הַדָּבָ֔ר נֶעֶשְׂתָ֛ה הַתּוֹעֵבָ֥ה הַזֹּ֖את בְּיִשְׂרָאֵֽל׃", "onk": "וִיחַוּוּן לָךְ וְתִשְׁמָע וְתִתְבַּע יָאוּת וְהָא קֻשְׁטָא כֵּוַן פִּתְגָּמָא אִתְעֲבִידַת תּוֹעֶבְתָּא הָדָא בְּיִשְׂרָאֵל:", "onk_en": "When you are told and you understand, you are to inquire thoroughly. If in fact the report is authenticated and accurate—this abomination was committed within Yisroel.", "pj": "וְאִתְחַוָא לְכוֹן וְתִשְׁמְעוּן וְתִיתְבְּעוּן יַת סַהֲדַיָא טַבְאוּת וְהָא קוּשְׁטָא כֵּיוַן פִּתְגָמָא אִתְעֲבִידַת תּוֹעֵבְתָּא הָדָא בֵּינֵיכוֹן", "pj_en": "and it be told you, and you hear and make inquiry by witnesses fairly; and, behold, if this word be true and certain, that such abomination is wrought among you,", "tj": "", "tj_en": "", "rashi": "<b>נכון.<\/b> מְכֻוָּן הָעֵדוּת:", "rashi_en": "נכון [AND, BEHOLD, IT BE TRUE, AND THE THING BE] CERTAIN — i.e. the evidence of the witnesses is in agreement (מְכֻוָּן‎)"}, {"ch": 17, "v": 5, "aliyah": 1, "heb": "וְהֽוֹצֵאתָ֣ אֶת־הָאִ֣ישׁ הַה֡וּא אוֹ֩ אֶת־הָאִשָּׁ֨ה הַהִ֜וא אֲשֶׁ֣ר עָ֠שׂ֠וּ אֶת־הַדָּבָ֨ר הָרָ֤ע הַזֶּה֙ אֶל־שְׁעָרֶ֔יךָ אֶת־הָאִ֕ישׁ א֖וֹ אֶת־הָאִשָּׁ֑ה וּסְקַלְתָּ֥ם בָּאֲבָנִ֖ים וָמֵֽתוּ׃", "onk": "וְתַפֵּק יָת גַּבְרָא הַהוּא אוֹ יָת אִתְּתָא הַהִיא דִּי עֲבָדוּ יָת פִּתְגָּמָא בִישָׁא הָדֵין <b>לִתְרַע בֵּית דִּינָךְ<\/b> יָת גַּבְרָא אוֹ יָת אִתְּתָא וְתִרְגְּמִנּוּן בְּאַבְנַיָּא וִימוּתוּן:", "onk_en": "You are to take out that man or that woman who did this evil thing to your city [<b>the door of your court<\/b>]—the man or the woman—and you are to stone them with stones so that they die.", "pj": "וְתִפְקוּן יַת גַּבְרָא הַהוּא אוֹ יַת אִנְתְּתָא הַהִיא דְּעָבְדוּ יַת פִּתְגָמָא בִּישָׁא הָדֵין לִתְרַע בֵּית דִּינֵיכוֹן יַת גַּבְרָא אוֹ יַת אִינְתְּתָא וּתְאַטְלוּנוּן בְּאַבְנַיָא וִימוּתוּן", "pj_en": "then you shall bring forth that man or woman who hath done this evil thing, unto the gate of your house of judgment, the man or the woman, and you shall stone them that they die.", "tj": "", "tj_en": "", "rashi": "<b>והוצאת את האיש ההוא אל שעריך וגו'.<\/b> הַמְתַרְגֵּם אֶל שְׁעָרֶיךָ \"לִתְרַע בֵּית דִּינָךְ\" טוֹעֶה, שֶׁכֵּן שָׁנִינוּ \"אֶל שְׁעָרֶיךָ\" — זֶה שַׁעַר שֶׁעָבַד בּוֹ, אוֹ אֵינוֹ אֶלָּא שַׁעַר שֶׁנִּדּוֹן בּוֹ? נֶאֱמַר \"שְׁעָרֶיךָ\" לְמַטָּה וְנֶאֱמַר \"שְׁעָרֶיךָ\" לְמַעְלָה, מַה שְּׁעָרֶיךָ הָאָמוּר לְמַעְלָה שַׁעַר שֶׁעָבַד בּוֹ, אַף שְׁעָרֶיךָ הָאָמוּר לְמַטָּה שַׁעַר שֶׁעָבַד בּוֹ, וְתַרְגּוּמוֹ \"לְקִרְוָיךְ\":", "rashi_en": "והוצאת את האיש ההוא אל שעריך וגו׳ THEN THOU SHALT BRING FORTH THAT MAN [OR THAT WOMAN WHO HAVE DONE THAT EVIL THING] UNTO THY GATES — He who renders אל שעריך in the Targum by לתרע בית דינך, unto the gate of thy court, is in error, for thus we have learned (Sifrei Devarim 148:2; Ketubot 45b): אל שעריך — this means the gate (the city) in which he has worshipped the idol. Or, perhaps this is not so, but it means the gate where he is being judged (the judges sat “at the gate of the city”; cf., e.g., Ruth 4:1 ff.)?! The term שעריך, however, is used below (i.e. here, which is the latter part of this section) and is used above (v. 2), and this suggests an analogy. What is the meaning of שעריך that is mentioned above? Evidently the gate (the city) wherein he served the idol! So, too, does שעריך mentioned below (in our verse) denote the gate in which he served the idol. The correct rendering in the Targum is therefore לקרויך “thou shalt bring him forth unto thy cities” (cf. Rashi on Deuteronomy 16:18)."}, {"ch": 17, "v": 6, "aliyah": 1, "heb": "עַל־פִּ֣י&thinsp;<b>׀<\/b> שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַמֵּ֑ת לֹ֣א יוּמַ֔ת עַל־פִּ֖י עֵ֥ד אֶחָֽד׃", "onk": "עַל מֵימַר תְּרֵין סַהֲדִין אוֹ תְּלָתָא סַהֲדִין יִתְקְטֵל <b>דְּחַיַּב קְטוֹל<\/b> לָא יִתְקְטֵל עַל מֵימַר סָהִיד חָד:", "onk_en": "By the speech of two witnesses or three witnesses is the guilty one [<b>the one sentenced to death<\/b>] to be executed; he is not to be executed by the oral testimonoy of one witness.", "pj": "עַל מֵימַר תְּרֵין סַהֲדִין אוֹ תְּלָתָא סַהֲדִין יִתְקְטֵיל דְּמִתְחַיֵּיב קָטוֹלָא לָא יִתְקְטֵיל עַל מֵימַר סָהִיד חָד", "pj_en": "Upon the word of two witnesses or of three he shall die who is guilty of death; they shall not be put to death on the word of one witness.", "tj": "", "tj_en": "", "rashi": "<b>שנים עדים או שלשה.<\/b> אִם מִתְקַיֶּמֶת עֵדוּת בִּשְׁנַיִם לָמָּה פֵּרֵט לְךָ בִשְׁלוֹשָׁה? לְהַקִּישׁ שְׁלוֹשָׁה לִשְׁנַיִם, מַה שְּׁנַיִם עֵדוּת אַחַת אַף שְׁלוֹשָׁה עֵדוּת אַחַת, וְאֵין נַעֲשִׂין זוֹמְמִין עַד שֶׁיִּזֹּמּוּ כֻלָּם (מכות ה'):", "rashi_en": "שנים עדים או שלשה [BY THE MOUTH OF] TWO WITNESSES OR THREE [WITNESSES, SHALL HE THAT IS WORTHY OF DEATH BE PUT TO DEATH] — But if evidence can be established by two witnesses to what end does it (Scripture) mention to you explicitly that it may be established by three? Scripture does so in order to compare the evidence of three witnesses to that of two (to make the same law apply to both cases). How is it in the case of two? Their evidence forms one testimony; so, too, does the evidence of three (or many) witnesses form one testimony and they cannot be declared “plotting witnesses” unless all of them are proved to be “plotting witnesses” (Makkot 5b)."}, {"ch": 17, "v": 7, "aliyah": 1, "heb": "יַ֣ד הָעֵדִ֞ים תִּֽהְיֶה־בּ֤וֹ בָרִאשֹׁנָה֙ לַהֲמִית֔וֹ וְיַ֥ד כׇּל־הָעָ֖ם בָּאַחֲרֹנָ֑ה וּבִֽעַרְתָּ֥ הָרָ֖ע מִקִּרְבֶּֽךָ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "יְדָא דְסַהֲדַיָּא תְּהֵי בֵיהּ בְּקַדְמֵיתָא לְמִקְטְלֵיהּ וִידָא דְכָל עַמָּא בְּבַתְרֵיתָא וּתְפַלֵּי עָבֵד <b>דְּבִישׁ<\/b> מִבֵּינָךְ:", "onk_en": "Let the hand of the witnesses be against him first to execute him, and the hand of the entire people afterward; and you will eliminate the evil [<b>doer<\/b>] from within you.", "pj": "יְדָא דְסַהֲדַיָא תְהֵי בֵיהּ בְּשֵׁירוּיָא לְמִקְטְלֵיהּ וִידָא דְכָל עַמָּא בְּבַתְרֵיתָא וּתְפַלּוּן עֲבִיד דְּבִישׁ מִבֵּינֵיכוֹן", "pj_en": "The hands of the witnesses shall be first upon him to kill him, and afterward the hands of all (any of) the people; and so shall you bring down the evil doer among you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 8, "aliyah": 1, "heb": "כִּ֣י יִפָּלֵא֩ מִמְּךָ֨ דָבָ֜ר לַמִּשְׁפָּ֗ט בֵּֽין־דָּ֨ם&thinsp;<small>׀<\/small>&thinsp;לְדָ֜ם בֵּֽין־דִּ֣ין לְדִ֗ין וּבֵ֥ין נֶ֙גַע֙ לָנֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּשְׁעָרֶ֑יךָ וְקַמְתָּ֣ וְעָלִ֔יתָ אֶ֨ל־הַמָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהֹוָ֥ה אֱלֹהֶ֖יךָ בּֽוֹ׃", "onk": "אֲרֵי יִתִּכְסֵי מִנָּךְ פִּתְגָּמָא לְדִינָא בֵּין דְּמָא לִדְמָא בֵּין דִּינָא לְדִינָא וּבֵין <b>מַכְתַּשׁ סְגִירוּ לְמַכְתַּשׁ סְגִירוּ<\/b> פִּתְגָּמֵי פְלֻגְתָּא <b>דִינָא<\/b> בְּקִרְוָיךְ וּתְקוּם וְתִסַּק לְאַתְרָא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ בֵּיהּ:", "onk_en": "If a matter of law is too abstruse for you—between blood and blood, between decision and decision, or between leprosy [<b>a plague of confinement<\/b>] and leprosy [<b>a plague of confinement<\/b>], matters under [<b>legal<\/b>] dispute in your city; you shall rise and ascend to the place that Adonoy, your God, will have chosen.", "pj": "אֲרוּם יִתְפְּרֵשׁ מִנְכוֹן פִּתְגָמָא לְדִינָא בֵּינֵי אֲדַם סְאוֹב לַאֲדַם דְּכֵי וּבֵינֵי דִינָא נַפְשָׁתָא לְדִינָא מָמוֹנָא וּבֵינֵי מַכְתַּשׁ צוֹרְעָא לְמַכְתַּשׁ נִתְקָא מִלֵי פְּלוּגְתָּא בְּבֵית דִּינֵיכוֹן וּתְקוּמוּן וְתִסְקוּן לְאַתְרָא דְיִתְרְעֵי יְיָ אֱלָהָכוֹן בֵּיהּ", "pj_en": "If there be with you an extraordinary matter for judgment between unclean and clean blood, cases of life or of money, or between a plague of leprosy or of the scall, with words of controversy in your beth din, then you shall arise and go up to the place which the Lord your God will choose;", "tj": "אֲרוּם יִתְכְּסֵי מִנְכוֹן פִּתְגָם לְסַדֵּר דִּין בֵּין דַּם דִּקְטוֹלִין בֵּין דַּם דִּבְּתוּלִין בֵּין מַכְתַּשׁ צָרַעֲתָּא בֵּין מַכְתַּשׁ נִתְקָא מִלִּין דִּמְצוּ לְקִרְיֵיכוֹן וּתְקוּמוּן וְתִסְקוּן לְאַתְרָא דִי יִתְרְעֵי יְיָ אֱלָהָכוֹן בֵּיהּ:", "tj_en": "When a matter is too occult for you, in setting judgment in order between the blood of murder and innocent blood, between leprosy and the scall, with words of contention in your cities, then shall you arise and go up to the place the Lord your God will choose.", "rashi": "<b>כי יפלא.<\/b> כָּל הַפְלָאָה לְשׁוֹן הַבְדָּלָה וּפְרִישָׁה, שֶׁהַדָּבָר נִבְדָּל וּמְכֻסֶּה מִמְּךָ:<br><br><b>בין דם לדם.<\/b> בֵּין דָּם טָמֵא לְדָם טָהוֹר (נדה י\"ט):<br><br><b>בין דין לדין.<\/b> בֵּין דִּין זַכַּאי לְדִין חַיָּב:<br><br><b>בין נגע לנגע.<\/b> בֵּין נֶגַע טָמֵא לְנֶגַע טָהוֹר:<br><br><b>דברי ריבת.<\/b> שֶׁיִּהְיוּ חַכְמֵי הָעִיר חוֹלְקִים בַּדָּבָר, זֶה מְטַמֵּא וְזֶה מְטַהֵר, זֶה מְחַיֵּב וְזֶה מְזַכֶּה:<br><br><b>וקמת ועלית.<\/b> מְלַמֵּד שֶׁבֵּית הַמִּקְדָּשׁ גָּבוֹהַּ מִכָּל הַמְּקוֹמוֹת (ספרי; סנהדרין פ\"ז):", "rashi_en": "כי יפלא IF THERE BE [A THING] TOO HARD [FOR THEE IN JUDGMENT] — The term פלא always denotes separation and being at a distance; it means here that the matter is apart and is hidden from thee.<br><br>בין דם לדם [IF THERE IS ANYTHING TOO HARD FOR THEE IN JUDGMENT] BETWEEN BLOOD AND BLOOD — i.e. between the blood of the menstruous woman that may be unclean blood, and blood that may be clean (Niddah 19a; cf. Sifrei Devarim 152:5),<br><br>בין דין לדין BETWEEN PLEA AND PLEA — i.e. between a verdict of acquittal and a verdict of “guilty”.<br><br>בין נגע לנגע BETWEEN PLAGUE AND PLAGUE — i.e. between a plague that may be unclean and a plague that may be clean.<br><br>דברי ריבה BEING THINGS OF STRIFE [WITHIN THY GATES] — i.e. that the scholars of the city (the judges) be of different opinions in that particular matter (cf. Onkelos), the one declaring it unclean, the other clean, the one sentencing, the other acquitting,<br><br>וקמת ועלית THEN SHALT THOU RISE AND GO UP [UNTO THE PLACE WHICH THE LORD THY GOD SHALL CHOOSE] — This (the phrase “go up”) teaches that the Temple (in the vicinity of which the Sanhedrin sat) was situated higher than all other places in Palestine (Sifrei Devarim 152:15; Sanhedrin 87a). (cf. however, Ibn Ezra on Numbers 16:12.)"}, {"ch": 17, "v": 9, "aliyah": 1, "heb": "וּבָאתָ֗ אֶל־הַכֹּהֲנִים֙ הַלְוִיִּ֔ם וְאֶ֨ל־הַשֹּׁפֵ֔ט אֲשֶׁ֥ר יִהְיֶ֖ה בַּיָּמִ֣ים הָהֵ֑ם וְדָרַשְׁתָּ֙ וְהִגִּ֣ידוּ לְךָ֔ אֵ֖ת דְּבַ֥ר הַמִּשְׁפָּֽט׃", "onk": "וְתֵיתֵי לְוָת כָּהֲנַיָא לֵוָאֵי וּלְוָת דַּיָּנָא דִּי יְהֵי בְּיוֹמַיָּא הָאִנּוּן וְתִתְבַּע וִיחַוּוּן לָךְ יָת פִּתְגָּמָא דְדִינָא:", "onk_en": "You are to come before the <i>kohanim<\/i>-the Levites and the judge officiating during those days; you will inquire and they will tell you the legal decision.", "pj": "וְתֵיתוּן לְוַת כַּהֲנַיָא דְמִשֵּׁבֶט לֵוִי וּלְוַת דַּיָּינָא דִי יְהֵי בְיוֹמַיָא הָאִינוּן וְתִתְבְּעוּן מִנְהוֹן וִיחַוּוּן לְכוֹן יַת הִלְכַת דִּינָא", "pj_en": "and you shall come to the priests of the tribe of Levi, and to the judge who will be in those days, and inquire of them, and they will show you the process of judgment.", "tj": "", "tj_en": "", "rashi": "<b>הכהנים הלוים.<\/b> הַכֹּהֲנִים שֶׁיָּצְאוּ מִשֵּׁבֶט לֵוִי:<br><br><b>ואל השפט אשר יהיה בימים ההם.<\/b> וַאֲפִלּוּ אֵינוֹ כִּשְׁאָר שׁוֹפְטִים שֶׁהָיוּ לְפָנָיו, אַתָּה צָרִיךְ לִשְׁמֹעַ לוֹ – אֵין לְךָ אֶלָּא שׁוֹפֵט שֶׁבְּיָמֶיךָ (ראש השנה כ\"ה):", "rashi_en": "הכהנים הלוים [AND THOU SHALT COME UNTO] THE PRIESTS THE LEVITES — i.e. unto the priests, who descend from of the tribe of Levi.<br><br>ואל השפט אשר יהיה בימים ההם [AND THOU SHALT COME UNTO THE PRIESTS …] AND UNTO THE JUDGE THAT SHALL BE IN THOSE DAYS — The last apparently redundant words suggest: and even though he is not as eminent as other judges that have been before him, you must obey him — you have none else but the judge that lives in your days (i.e. you are only concerned with him) (Rosh Hashanah 25b)."}, {"ch": 17, "v": 10, "aliyah": 1, "heb": "וְעָשִׂ֗יתָ עַל־פִּ֤י הַדָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְךָ֔ מִן־הַמָּק֣וֹם הַה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהֹוָ֑ה וְשָׁמַרְתָּ֣ לַעֲשׂ֔וֹת כְּכֹ֖ל אֲשֶׁ֥ר יוֹרֽוּךָ׃", "onk": "וְתַעְבֵּד עַל מֵימַר פִּתְגָּמָא דִּי יְחַוּוּן לָךְ מִן אַתְרָא הַהוּא דִּי יִתִּרְעֵי יְיָ וְתִטַּר לְמֶעְבַּד כְּכֹל דִּי <b>יַלְּפֻנָּךְ<\/b>:", "onk_en": "You are to act according to the word that they tell you from that place that Adonoy will have chosen; and you are to be careful to fulfill exactly as they instruct you.", "pj": "וְתַעַבְדוּן עַל מֵימַר הִלְכַת אוֹרַיְיתָא דִיחַוּוּן לְכוֹן מִן אַתְרָא הַהוּא דְיִתְרְעֵי יְיָ וְתִטְרוּן לְמֶעֱבַד כְּכָל דְּיַלְפוּנְכוֹן", "pj_en": "Then shall you do according to the word of the custom of the law that they will show you at the place the Lord will choose, and observe to do whatsoever they teach you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 11, "aliyah": 1, "heb": "עַל־פִּ֨י הַתּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּךָ וְעַל־הַמִּשְׁפָּ֛ט אֲשֶׁר־יֹאמְר֥וּ לְךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן־הַדָּבָ֛ר אֲשֶׁר־יַגִּ֥ידֽוּ לְךָ֖ יָמִ֥ין וּשְׂמֹֽאל׃", "onk": "עַל מֵימַר אוֹרַיְתָא דִּי <b>יַלְּפֻנָּךְ<\/b> וְעַל דִּינָא דִּי יֵימְרוּן לָךְ תַּעְבֵּד לָא תִסְטֵי מִן פִּתְגָּמָא דִּי יְחַוּוּן לָךְ יַמִּינָא וּשְׂמָאלָא:", "onk_en": "In accord with the Torah that they instruct you and upon the law that they state to you, are you to act; do not deviate from the word they tell you, neither right or left.", "pj": "עַל מֵימַר אוֹרַיְיתָא דְיַלְפוּנְכוֹן וְעַל הִילְכַת דִּינָא דְיֵימְרוּן לְכוֹן תַּעַבְדוּן לָא תִסְטוּן מִן פִּתְגָמָא דִיחַוּוּן לְכוֹן יְמִינָא וּשְמָאלָא", "pj_en": "According to the word of the law that they will teach you, and the manner of judgment they pronounce, you shall do. You shall not turn aside from the sentence they will show you, to the right or to the left.", "tj": "", "tj_en": "", "rashi": "<b>ימין ושמאל.<\/b> אֲפִלּוּ אוֹמֵר לְךָ עַל יָמִין שֶׁהוּא שְׂמֹאל וְעַל שְׂמֹאל שֶׁהוּא יָמִין, וְכָל שֶׁכֵּן שֶׁאוֹמֵר לְךָ עַל יָמִין יָמִין וְעַל שְׂמֹאל שְׂמֹאל (ספרי):", "rashi_en": "ימין ושמאל [THOU SHALT NOT DEPART FROM THE WORD WHICH THEY SHALL TELL THEE] TO THE RIGHT NOR TO THE LEFT, even if he (the judge) tells you about what appears to you to be right that it is left, or about what appears to you to be left that it is right, you have to obey him; how much the more is this so if actually he tells you about what is evidently right that it is right and about what is left that it is left (cf. Sifrei Devarim 154:5)."}, {"ch": 17, "v": 12, "aliyah": 1, "heb": "וְהָאִ֞ישׁ אֲשֶׁר־יַעֲשֶׂ֣ה בְזָד֗וֹן לְבִלְתִּ֨י שְׁמֹ֤עַ אֶל־הַכֹּהֵן֙ הָעֹמֵ֞ד לְשָׁ֤רֶת שָׁם֙ אֶת־יְהֹוָ֣ה אֱלֹהֶ֔יךָ א֖וֹ אֶל־הַשֹּׁפֵ֑ט וּמֵת֙ הָאִ֣ישׁ הַה֔וּא וּבִֽעַרְתָּ֥ הָרָ֖ע מִיִּשְׂרָאֵֽל׃", "onk": "וּגְבַר דִּי יַעְבֵּד בִּרְשַׁע בְּדִיל דְּלָא לְקַבָּלָא מִן כַּהֲנָא דְּקָאֵם לְשַׁמָּשָׁא תַמָּן <b>קֳדָם<\/b> יְיָ אֱלָהָךְ אוֹ מִן דַּיָּנָא וְיִתְקְטֵל גַּבְרָא הַהוּא וּתְפַלֵּי עָבֵד <b>דְּבִישׁ<\/b> מִיִּשְׂרָאֵל:", "onk_en": "But the man who acts deliberately to not heed the <i>kohein<\/i> who stands to serve there [<b>before<\/b>] Adonoy, your God, or the judge; that man is to be executed and you will eliminate the evil [<b>doer<\/b>] from Yisroel.", "pj": "וְגַבְרָא דְיַעֲבֵיד בְּזָדְנוּתָא בְּדִיל דְּלָא לְמֵיצַת מִן כַּהֲנָא דְקָאִים לְשַׁמָּשָׁא תַּמָּן קֳדָם יְיָ אֱלָהָכוֹן אוֹ מִן דַּיָינָא וְיִתְקְטֵיל גַּבְרָא הַהוּא וּתְפַלּוּן עֲבִיד דְּבִישׁ מִיִּשְרָאֵל", "pj_en": "And the man who will act with presumption, and not obey the judge or the priest who standeth there to minister before the Lord your God, that man shall be put to death; so shalt you put down the doer of evil from Israel,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 13, "aliyah": 1, "heb": "וְכׇל־הָעָ֖ם יִשְׁמְע֣וּ וְיִרָ֑אוּ וְלֹ֥א יְזִיד֖וּן עֽוֹד׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְכָל עַמָּא יִשְׁמְעוּן וְיִדְחֲלוּן וְלָא יַרְשִׁיעוּן עוֹד:", "onk_en": "Let all the people hear and fear, and not sin deliberately again.", "pj": "וְכָל עַמָּא יִשְׁמְעוּן וִידַחֲלוּן וְלָא יַרְשִׁיעוּן תּוּב", "pj_en": "and all the people will hear, and be afraid, and not do wickedly again.", "tj": "", "tj_en": "", "rashi": "<b>וכל העם ישמעו.<\/b> מִכָּאן שֶׁמַּמְתִּינִין לוֹ עַד הָרֶגֶל וּמְמִיתִין אוֹתוֹ בָּרֶגֶל (סנהדרין פ\"ט):", "rashi_en": "וכל העם ישמעו AND ALL THE PEOPLE SHALL HEAR [AND FEAR] — From here we derive the law that they wait for him (i.e. defer the execution of a זקן ממרא, an elder who disregards the decision of the Supreme Court, to whom Scripture refers in v. 12 by the words והאיש אשר יעשה בזדון) until the next festival (when all Israel is assembled in Jerusalem) and they put him to death at the season of the festival (Sanhedrin 89a)."}, {"ch": 17, "v": 14, "aliyah": 2, "heb": "כִּֽי־תָבֹ֣א אֶל־הָאָ֗רֶץ אֲשֶׁ֨ר יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ נֹתֵ֣ן לָ֔ךְ וִֽירִשְׁתָּ֖הּ וְיָשַׁ֣בְתָּה בָּ֑הּ וְאָמַרְתָּ֗ אָשִׂ֤ימָה עָלַי֙ מֶ֔לֶךְ כְּכׇל־הַגּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽי׃", "onk": "אֲרֵי תֵעוֹל לְאַרְעָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ וְתֵירְתַהּ וְתֵיתֵב בַּהּ וְתֵימַר אֱמַנִּי עֲלַי מַלְכָּא כְּכָל עַמְמַיָּא דִי בְסַחֲרָנָי:", "onk_en": "When you arrive in the land that Adonoy, your God, is giving you and inherit it and live in it, and you say, ‘‘Let me appoint over me a king like all the nations around me;’’", "pj": "אֲרוּם תֵּיעָלוּן לְאַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן וְתֵרְתוּן יָתָהּ וְתֵיתְבוּן בָּהּ וְתֵמְרוּן נְמַנֵי עֲלָן מַלְכָּא כְּכָל עַמְמַיָא דִבְחַזְרָנוּתָי", "pj_en": "When you enter the land which the Lord your God giveth you, and possess, and dwell in it, and you say, Let us appoint a king over us, like all the nations about me,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 15, "aliyah": 2, "heb": "שׂ֣וֹם תָּשִׂ֤ים עָלֶ֙יךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהֹוָ֥ה אֱלֹהֶ֖יךָ בּ֑וֹ מִקֶּ֣רֶב אַחֶ֗יךָ תָּשִׂ֤ים עָלֶ֙יךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָתֵ֤ת עָלֶ֙יךָ֙ אִ֣ישׁ נׇכְרִ֔י אֲשֶׁ֥ר לֹֽא־אָחִ֖יךָ הֽוּא׃", "onk": "מַנָּאָה תְמַנֵּי עֲלָךְ מַלְכָּא דִּי יִתִּרְעֵי יְיָ אֱלָהָךְ בֵּיהּ מִגּוֹ אַחָיךְ תְּמַנֵּי עֲלָךְ מַלְכָּא <b>לֵית לָךְ רְשׁוּ<\/b> לְמַנָּאָה עֲלָךְ גְּבַר <b>נוּכְרַי<\/b> דִּי לָא אֲחוּךְ הוּא:", "onk_en": "Appoint are you to appoint over yourself a king whom Adonoy, your God, will choose. From among your brothers are you to appoint over yourself a king; you may not [<b>you have no permission to<\/b>] place over yourself a foreigner who is not your brother.", "pj": "תִּתְבְּעוּן אוּלְפַן מִן קֳדָם יְיָ וּמִבָּתַר כְּדֵין תִּמְנוּן עֲלֵיכוֹן מַלְכָּא לֵית לְכוֹן רְשׁוּ לְמַנָּאָה עֲלֵיכוֹן גְּבַר חִילוֹנַי דְלָא מִן אֲחוּכוֹן הוּא", "pj_en": "you shall inquire for instruction before the Lord and afterward appoint the king over you: but it will not be lawful to set over you a foreign man who is not of your brethren.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 16, "aliyah": 2, "heb": "רַק֮ לֹא־יַרְבֶּה־לּ֣וֹ סוּסִים֒ וְלֹֽא־יָשִׁ֤יב אֶת־הָעָם֙ מִצְרַ֔יְמָה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽיהֹוָה֙ אָמַ֣ר לָכֶ֔ם לֹ֣א תֹסִפ֗וּן לָשׁ֛וּב בַּדֶּ֥רֶךְ הַזֶּ֖ה עֽוֹד׃", "onk": "לְחוֹד לָא יַסְגֵּי לֵיהּ סוּסָוָן וְלָא יָתֵב יָת עַמָּא לְמִצְרַיִם בְּדִיל לְאַסְגָּאָה <b>לֵיהּ<\/b> סוּסָוָן וַיְיָ אֲמַר לְכוֹן לָא תוֹסְפוּן לְמִתּוּב בְּאֹרַח הָדָא עוֹד:", "onk_en": "However, he must not acquire an abundance of horses for himself so that he will not return the people to Egypt in order to acquire an abundance of horses, because Adonoy told you, ‘‘You are not to proceed to return along this route again.’’", "pj": "לְחוֹד לָא יִסְגוּן לֵיהּ עַל תְּרֵין סוּסְוָון דִּלְמָא יִרְכְּבוּן רַבְרְבָנוֹי עֲלֵיהוֹן וְיִתְגָאוּן וְיִתְבַּטְלוּן מִפִּתְגָמֵי אוֹרַיְיתָא וִיחוֹבוּן חוֹבַת גָּלוּתָא לְמִצְרַיִם וַיְיָ אָמַר לְכוֹן לָא תוֹסְפוּן לְמֵתוּב בְּאָרְחָא הָדֵין תּוּב", "pj_en": "Only let him not increase to him more than two horses, lest his princes ride upon them, and become proud, neglect the words of the law, and commit the sin of the captivity of Mizraim; for the Lord hath told you, By that way ye shall return no more.", "tj": "", "tj_en": "", "rashi": "<b>לא ירבה לו סוסים.<\/b> אֶלָּא כְּדֵי מֶרְכַּבְתּוֹ, שֶׁלֹּא <b>ישיב את העם מצרימה<\/b>, שֶׁהַסּוּסִים בָּאִים מִשָּׁם, כְּמָה שֶׁנֶּאֱמַר בִּשְׁלֹמֹה (מלכים א י') וַתַּעֲלֶה וַתֵּצֵא מֶרְכָּבָה מִמִּצְרַיִם בְּשֵׁשׁ מֵאוֹת כֶּסֶף וְסוּס בַּחֲמִשִּׁים וּמֵאָה (סנהדרין כ\"א):", "rashi_en": "לא ירבה לו סוסים HE SHALL NOT MULTIPLY HORSES TO HIMSELF — but he shall have only what is sufficient for his carriages, in order that he shall not cause the people to return to Egypt, because horses come from there, as it is said in the history of Solomon (1 Kings 10:29) “And a chariot came up and went out of Egypt for six hundred shekels of silver and a horse for a hundred and fifty” (Sanhedrin 21b)."}, {"ch": 17, "v": 17, "aliyah": 2, "heb": "וְלֹ֤א יַרְבֶּה־לּוֹ֙ נָשִׁ֔ים וְלֹ֥א יָס֖וּר לְבָב֑וֹ וְכֶ֣סֶף וְזָהָ֔ב לֹ֥א יַרְבֶּה־לּ֖וֹ מְאֹֽד׃", "onk": "וְלָא יַסְגֵּי לֵיהּ נְשִׁין וְלָא יִטְעֵי לִבֵּיהּ וְכַסְפָּא וְדַהֲבָא לָא יַסְגֵּי לֵיהּ לַחֲדָא:", "onk_en": "And he is not to acquire an abundance of wives for himself so that his heart will not veer; and silver and gold he may not accumulate for himself in great abundance.", "pj": "וְלָא יִסְגוּן לֵיהּ נְשִׁין עַל תַּמְנַסְרֵי דְּלָא יִטְעוּן לִבֵּיהּ וְכַסְפָּא וְדַהֲבָא לָא יִסְגֵי לֵיהּ דְּלָא יִתְרוֹמָם לִבֵּיהּ לַחֲדָא וְיִמְרוֹד בֶּאֱלָהָא שְׁמַיָא", "pj_en": "Neither shall he multiply to him wives above eighteen, lest they pervert his heart; nor shall he increase to him silver or gold, lest his heart be greatly lifted up, and he rebel against the God of heaven.", "tj": "", "tj_en": "", "rashi": "<b>ולא ירבה לו נשים.<\/b> אֶלָּא י\"ח, שֶׁמָּצִינוּ שֶׁהָיוּ לוֹ לְדָוִד שֵׁשׁ נָשִׁים, וְנֶאֱמַר לוֹ (שמואל ב י״ב:ח׳) \"וְאִם מְעָט וְאֹסִפָה לְּךָ כָּהֵנָּה וְכָהֵנָּה\":<br><br><b>וכסף וזהב לא ירבה לו מאד.<\/b> אֶלָּא כְּדֵי לִתֵּן לְאַכְסַנְיָא (ספרי; סנהדרין כ\"א):", "rashi_en": "ולא ירבה לו נשים NEITHER SHALL HE MULTIPLY WIVES TO HIMSELF only eighteen, for we find that David had six wives, and it was announced to him (by Nathan the prophet): “[Thus saith the Lord … I gave thy master’s wives into thy bosom] … and if that had been too little, I would add unto thee such and such as these (i.e. twice as many)” (Sanhedrin 21a).<br><br>וכסף וזהב לא ירבה לו מאד NEITHER SHALL HE GREATLY MULTIPLY TO HIMSELF SILVER AND GOLD — but only as much as he needs for his soldiers’ pay (Sanhedrin 21b)."}, {"ch": 17, "v": 18, "aliyah": 2, "heb": "וְהָיָ֣ה כְשִׁבְתּ֔וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑וֹ וְכָ֨תַב ל֜וֹ אֶת־מִשְׁנֵ֨ה הַתּוֹרָ֤ה הַזֹּאת֙ עַל־סֵ֔פֶר מִלִּפְנֵ֖י הַכֹּהֲנִ֥ים הַלְוִיִּֽם׃", "onk": "וִיהֵי כְמִתְּבֵיהּ עַל כָּרְסָא מַלְכוּתֵיהּ וְיִכְתּוֹב לֵיהּ יָת <b>פַּתְשֶׁגֶן<\/b> אוֹרַיְתָא הָדָא עַל סִפְרָא מִן קֳדָם כָּהֲנַיָּא לֵוָאֵי:", "onk_en": "It shall be, that when he occupies the throne of his kingdom, he must write for himself a duplicate of this Torah in a scroll form [the scroll] before the <i>kohanim<\/i>—the Levites.", "pj": "וִיהֵי אִין נְיַיח הוּא בְּמִצְוָותָא דְאוֹרַיְיתָא יָתֵיב לְרוֹחֲצָן עַל כּוּרְסֵי מַלְכוּתֵיהּ וְיִכְתְּבוּן לֵיהּ סָבַיָא יַת פַּרְשָׁא אוֹרַיְיתָא הָדָא עַל סִפְרָא מִן קֳדָם כַּהֲנַיָא דְּמִן שֵׁבֶט לֵוִי", "pj_en": "And it shall be that if he be steadfast in the commandments of the law he shall sit upon the throne of his kingdom in security. And let the elders write for him the section (pharasha) of this law in a book before the priests of the tribe of Levi;", "tj": "", "tj_en": "", "rashi": "<b>והיה כשבתו.<\/b> אִם עָשָׂה כֵן כְּדַאי הוּא שֶׁתִּתְקַיֵּם מַלְכוּתוֹ (ספרי):<br><br><b>את משנה התורה.<\/b> שְׁתֵּי סִפְרֵי תוֹרָה, אַחַת שֶׁהִיא מֻנַּחַת בְּבֵית גְּנָזָיו, וְאַחַת שֶׁנִּכְנֶסֶת וְיוֹצֵאת עִמּוֹ (סנהדרין כ\"א); וְאֻנְקְלוֹס תִּרְגֵּם \"פַּתְשֶׁגֶן\", פָּתַר משנה לְשׁוֹן שִׁנּוּן וְדִבּוּר:", "rashi_en": "והיה כשבתו AND IT SHALL BE WHEN HE SITTETH [UPON THE THRONE OF HIS KINGDOM] — if he acts thus (as prescribed in the previous verses) he is worthy that his kingdom should endure (Sifrei Devarim 160:1).<br><br>את משנה התורה [HE SHALL WRITE HIM] A משנה תורה — i.e. two scrolls of the Law, one that is placed in his treasury and the other that goes out and comes in with him (i.e. a small scroll which he carries everywhere with him) (Sanhedrin 21b). Onkelos, however, renders משנה by פתשגן, a copy; he thus interpreted the word משנה in the sense of שנן, repeating and uttering."}, {"ch": 17, "v": 19, "aliyah": 2, "heb": "וְהָיְתָ֣ה עִמּ֔וֹ וְקָ֥רָא ב֖וֹ כׇּל־יְמֵ֣י חַיָּ֑יו לְמַ֣עַן יִלְמַ֗ד לְיִרְאָה֙ אֶת־יְהֹוָ֣ה אֱלֹהָ֔יו לִ֠שְׁמֹ֠ר אֶֽת־כׇּל־דִּבְרֵ֞י הַתּוֹרָ֥ה הַזֹּ֛את וְאֶת־הַחֻקִּ֥ים הָאֵ֖לֶּה לַעֲשֹׂתָֽם׃", "onk": "וּתְהֵי עִמֵּיהּ וִיהֵי קָרֵי בֵיהּ כָּל יוֹמֵי חַיּוֹהִי בְּדִיל דְּיֵלַף לְמִדְחַל <b>קֳדָם<\/b> יְיָ אֶלָהֵיהּ לְמִטַּר יָת כָּל פִּתְגָּמֵי אוֹרַיְתָא הָדָא וְיָת קְיָמַיָּא הָאִלֵּין לְמֶעְבָּדְהוֹן:", "onk_en": "It is to accompany him and he is to read in it all the days of his life, in order that he learn to fear [<b>before<\/b>] Adonoy, his God, to guard every word of this Torah and these statutes to fulfill them;", "pj": "וּתְהֵי גַבֵּיהּ וִיהֵי קָרֵי בֵּיהּ כָּל יוֹמֵי חַייוֹי מִן בִּגְלַל דְּיַלִּיף לְמִדְחַל מִן קֳדָם יְיָ אֱלָהֵיהּ לְמִנְטַל יַת כָּל פִּתְגָמֵי אוֹרַיְיתָא הָדָא וְיַת כָּל קְיָימַיָא הָאִלֵּין לְמֶעֱבַדְהוֹן", "pj_en": "and let it be at his side, and he shall read it all the days of his life, that he may learn to fear the Lord his God, to keep all the words of this law, and all these statutes to perform them:", "tj": "", "tj_en": "", "rashi": "<b>דברי התורה.<\/b> כְּמַשְׁמָעוֹ:", "rashi_en": "דברי התורה [ALL] THE WORDS OF [THIS] LAW — Take it as what it literally implies."}, {"ch": 17, "v": 20, "aliyah": 2, "heb": "לְבִלְתִּ֤י רוּם־לְבָבוֹ֙ מֵֽאֶחָ֔יו וּלְבִלְתִּ֛י ס֥וּר מִן־הַמִּצְוָ֖ה יָמִ֣ין וּשְׂמֹ֑אול לְמַ֩עַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל־מַמְלַכְתּ֛וֹ ה֥וּא וּבָנָ֖יו בְּקֶ֥רֶב יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּדִיל דְּלָא יְרִים לִבֵּיהּ מֵאֲחוֹהִי וּבְדִיל דְּלָא יִסְטֵי מִן תַּפְקֶדְתָּא יַמִּינָא וּשְׂמָאלָא בְּדִיל דְּיוֹרֵךְ יוֹמִין עַל מַלְכוּתֵיהּ הוּא וּבְנוֹהִי בְּגוֹ יִשְׂרָאֵל:", "onk_en": "That his pride not increase over his brothers and he does not stray from the commandment right or left; so that the days of his reign are lengthy over his kingdom, he and his sons within Yisroel.", "pj": "מְטוּל דְּלָא יָגִיס לִבֵּיהּ יַתִּיר מִן אָחוֹי וּמְטוּל דְּלָא יִסְטֵי מִן תַּפְקֵידְתָּא לְיַמִינָא וְלִשְמָאלָא מִן בִּגְלַל דְּיִנְגוֹד יוֹמִין עַל מַלְכוּתֵיהּ הוּא וּבְנוֹי בֵּינֵי יִשְרָאֵל", "pj_en": "that his heart may not be arrogant toward his brethren, nor decline from the precepts to the right or the left, and that his days may be prolonged over his kingdom, his and his sons among Israel.", "tj": "", "tj_en": "", "rashi": "<b>ולבלתי סור מן המצוה.<\/b> אֲפִלּוּ מִצְוָה קַלָּה שֶׁל נָבִיא:<br><br><b>למען יאריך ימים.<\/b> מִכְּלַל הֵן אַתָּה שׁוֹמֵעַ לָאו; וְכֵן מָצִינוּ בְשָׁאוּל שֶׁאָמַר לוֹ שְׁמוּאֵל (שמואל א י') \"שִׁבְעַת יָמִים תּוֹחֵל עַד בּוֹאִי אֵלֶיךָ\", לְהַעֲלוֹת עוֹלוֹת, וּכְתִיב (שם י\"ג) \"וַיּוֹחֶל שִׁבְעַת יָמִים\", וְלֹא שָׁמַר הַבְטָחָתוֹ לִשְׁמֹר כָּל הַיּוֹם, וְלֹא הִסְפִּיק לְהַעֲלוֹת הָעוֹלָה עַד שֶׁבָּא שְׁמוּאֵל וְאָמַר לוֹ \"נִסְכָּלְתָּ לֹא שָׁמַרְתָּ וְגוֹ' וְעַתָּה מַמְלַכְתְּךָ לֹא תָקוּם\", הָא לָמַדְתָּ שֶׁבִּשְׁבִיל מִצְוָה קַלָּה שֶׁל נָבִיא נֶעֱנַשׁ:<br><br><b>הוא ובניו.<\/b> מַגִּיד שֶׁאִם בְּנוֹ הָגוּן לְמַלְכוּת הוּא קוֹדֵם לְכָל אָדָם (הוריות י\"א):", "rashi_en": "ולבלתי סור מן המצוה AND THAT HE DEPART NOT FROM THE COMMANDMENT — not even from a less important command given to him by means of a prophet.<br><br>למען יאריך ימים TO THE END THAT HE MAY PROLONG HIS DAYS [IN HIS KINGDOM] — From the positive statement you may derive the negative (that if he does not fulfil the commandments his kingdom will not endure). And so, indeed, do we find in the case of Saul that Samuel said to him, (I Samuel 10:8) “Seven days shalt thou tarry, till I come unto thee” to offer burnt sacrifices, and it is written, (I Samuel 13:8) “and he tarried seven days”, but he did not keep his promise to wait the whole of the seventh day and had scarcely finished offering the burnt offering when Samuel came (I Samuel 10:10) and said to him (I Samuel 10:13-14) “Thou hast done foolishly; thou hast not kept [the commandment of the Lord thy God, which He commanded thee; for now would the Lord have established thy kingdom upon Israel forever;] but now thy kingdom shall not continue”. Thus you learn that for the neglect of an unimportant command given by means of a prophet he was severely punished.<br><br>הוא ובניו [THAT HE MAY PROLONG HIS DAYS IN HIS KINGDOM] HE, AND HIS CHILDREN — This tells you that if his son is worthy of becoming king he has to be given preference to any other person (Horayot 11b)."}, {"ch": 18, "v": 1, "aliyah": 3, "heb": "לֹֽא־יִ֠הְיֶ֠ה לַכֹּהֲנִ֨ים הַלְוִיִּ֜ם כׇּל־שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְנַחֲלָ֖ה עִם־יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהֹוָ֛ה וְנַחֲלָת֖וֹ יֹאכֵלֽוּן׃", "onk": "לָא יְהֵי לְכָהֲנַיָּא לֵוָאֵי כָּל שִׁבְטָא דְלֵוִי חֳלָק וְאַחֲסָנָא עִם יִשְׂרָאֵל <b>קֻרְבָּנַיָּא<\/b> דַיְיָ וְאַחֲסַנְתֵּיהּ יֵיכְלוּן:", "onk_en": "They will not have—the <i>kohanim,<\/i> the Levites, the entire tribe of Levi—a portion or an inheritance with Yisroel; Adonoy’s fire-offerings [<b>sacrifices<\/b>] and His inheritance will they eat.", "pj": "לָא יְהֵי לְכַהֲנַיָא דְּמִן שֵׁבֶט לֵוִי חוּלַק וְאַחְסָנָא עִם אָחוֹי קוּרְבָּנַיָא דַיְיָ וּבְאַחֲסַנְתְּהוֹן יֵיכְלוּן", "pj_en": "The priests of the tribe of Levi will have no part or inheritance with their brethren: they shall eat the oblations of the Lord as their portion,", "tj": "", "tj_en": "", "rashi": "<b>כל שבט לוי.<\/b> בֵּין תְּמִימִין בֵּין בַּעֲלֵי מוּמִין (ספרי):<br><br><b>חלק.<\/b> בַּבִּזָּה:<br><br><b>ונחלה.<\/b> בָּאָרֶץ (שם):<br><br><b>אשי ה'.<\/b> קָדְשֵׁי הַמִּקְדָּשׁ:<br><br><b>ונחלתו.<\/b> אֵלּוּ קָדְשֵׁי הַגְּבוּל – תְּרוּמוֹת וּמַעַשְׂרוֹת, אֲבָל נַחֲלָה גְּמוּרָה <b>לא יהיה לו בקרב אחיו;<\/b> וּבְסִפְרֵי דָּרְשׁוּ – <b>ונחלה לא יהיה לו<\/b> — זוֹ נַחֲלַת שְׁאָר, <b>בקרב אחיו<\/b> — זוֹ נַחֲלַת חֲמִשָּׁה. וְאֵינִי יוֹדֵעַ מַה הִיא, וְנִרְאֶה לִי שֶׁאֶרֶץ כְּנַעַן שֶׁמֵּעֵבֶר הַיַּרְדֵּן וָאֵילָךְ נִקְרֵאת אֶרֶץ חֲמִשָּׁה עֲמָמִין, וְשֶל סִיחוֹן וְעוֹג שְׁנֵי עֲמָמִין, אֱמוֹרִי וּכְנַעֲנִי, וְנַחֲלַת שְׁאָר לְרַבּוֹת קֵינִי וּקְנִזִּי וְקַדְמוֹנִי, וְכֵן דּוֹרֵשׁ בְּפָרָשַׁת מַתָּנוֹת שֶׁנֶּאֶמְרוּ לְאַהֲרֹן (במדבר י\"ח) \"עַל כֵּן לֹא הָיָה לְלֵוִי וְגוֹ'\" לְהַזְהִיר עַל קֵינִי וּקְנִזִּי וְקַדְמוֹנִי. שׁוּב נִמְצָא בְדִבְרֵי רַבִּי קְלוֹנִימוּס הָכֵי גָּרְסִינָן בְּסִפְרֵי: <b>ונחלה לא יהיה לו.<\/b> אֵלּוּ נַחֲלַת חֲמִשָּׁה, <b>בקרב אחיו<\/b> אֵלּוּ נַחֲלַת שִׁבְעָה, נַחֲלַת חֲמִשָּׁה שְׁבָטִים וְנַחֲלַת שִׁבְעָה שְׁבָטִים; וּמִתּוֹךְ שֶׁמֹּשֶׁה וִיהוֹשֻׁעַ לֹא חִלְּקוּ נַחֲלָה אֶלָּא לַחֲמִשָּׁה שְׁבָטִים בִּלְבָד, שֶׁכֵּן מֹשֶׁה הִנְחִיל לִרְאוּבֵן וְגָד וַחֲצִי שֵׁבֶט מְנַשֶּׁה, וִיהוֹשֻׁעַ הִנְחִיל לִיהוּדָה וְאֶפְרַיִם וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה, וְשִׁבְעָה הָאֲחֵרִים נָטְלוּ מֵאֵלֵיהֶן אַחֲרֵי מוֹת יְהוֹשֻׁעַ, מִתּוֹךְ כָּךְ הִזְכִּיר חֲמִשָּׁה לְבַד וְשִׁבְעָה לְבַד:", "rashi_en": "כל שבט לוי [THE PRIESTS THE LEVITES] NAMELY ALL THE TRIBE OF LEVI [SHALL HAVE NO PORTION … WITH ISRAEL] — all the tribe, whether they be able-bodied or whether they be blemished (Sifrei Devarim 163:1).<br><br>חלק A PORTION — i.e. in the spoil that is taken in battle (Sifrei Devarim 163:2),<br><br>ונחלה AND INHERITANCE — in the land (Sifrei Devarim 163:3).<br><br>'אשי ה THE FIRE OFFERINGS OF THE LORD — the holy things brought into the Temple (Sifrei Devarim 163:4),<br><br>ונחלתו AND HIS INHERITANCE — this refers to the holy things that might be consumed outside Jerusalem (גבולין) — the heave-offerings and the tithes (Sifrei Devarim 163:4) these they shall eat, BUT נחלה AN INHERITANCE, a real inheritance, לא יהיה לו בקרב אחיו SHALL HE NOT HAVE AMONG HIS BRETHREN. In Sifrei Devarim 164, they (the Rabbis) gave the following interpretation:<br>ונחלה לא יהיה לו — this refers to the נחלת שאר the inheritance of the שאר.<br>בקרב אחיו — AMONG HIS BRETHREN — this refers to the inheritance of the five. I do not, however, know for certain what this means (what Sifrei means by שאר and חמשה). But it seems to me that the part of the land of Canaan which is on the other (the western) side of the Jordan and onwards is called the land of the five nations (and these are therefore the five referred to by Sifrei), whilst the territory of Sihon and Og on the eastern side might be called the land of the two nations, viz., the Amorites and the Canaanites, — and נחלת שאר mentioned in Sifrei is intended to include the land of the remaining clans (שאר), the Kenite, the Kenizzite, and the Kadmonite, which will become Israel’s inheritance in some future time. (But the land of Sihon and Og need not be mentioned since this was already divided among the two and a half tribes, and it was known that the tribe of Levi had no share in it.) Similarly it (Sifrei) makes a comment in “the section dealing with the gifts that were promised to Aaron” on the verse (Numbers 18:24) “wherefore [I have said unto them, Among the children of Israel they shall have no inheritance]” that it is intended to express a warning regarding the land of the Kenite, the Kenizzite and the Kadmonite (i.e. that not even in later times when Israel will inherit the land of these nations shall the Levite have a portion in it). — It has since been found in the words of Rabbi Kalonymus that the proper version of this passage in Sifrei reads as follows:<br>ונחלה לא יהיה לו BUT THEY SHALL HAVE NO INHERITANCE — this refers to the territory of the five,<br>בקרב אחיו AMONGST THEIR BRETHREN — this refers to the territory of the seven, and he explains that this means the five tribes and the seven tribes. And because Moses and Joshua assigned an inheritance in the land only to five tribes — for Moses assigned their inheritance to Reuben, Gad and the half tribe of Manasseh, and Joshua assigned their inheritance to Judah, Ephraim and the other half tribe of Manasseh, whilst the remaining seven tribes took their portions themselves in the land (conquered it) after the death of Joshua — for this reason it (Scripture) mentions (alludes to) the five tribes separately and to the seven separately. "}, {"ch": 18, "v": 2, "aliyah": 3, "heb": "וְנַחֲלָ֥ה לֹא־יִֽהְיֶה־לּ֖וֹ בְּקֶ֣רֶב אֶחָ֑יו יְהֹוָה֙ ה֣וּא נַחֲלָת֔וֹ כַּאֲשֶׁ֖ר דִּבֶּר־לֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַחֲסָנָא לָא יְהֵי לֵיהּ בְּגוֹ אֲחוֹהִי <b>מַתְּנָן דִּיהַב לֵיהּ<\/b> יְיָ אִנּוּן אַחֲסַנְתֵּיהּ כְּמָא דִי מַלִּיל לֵיהּ:", "onk_en": "But he will have no territory among his brothers; [<b>the gifts that<\/b>] Adonoy [<b>has given him<\/b>] is his territory, as He said to him.", "pj": "וְאַחֲסָנַת חֲקַל וּכְרַם לָא תְהֵי לֵיהּ בֵּינֵי אָחוֹי עֶשְרִין וְאַרְבַּע מוֹהֲבוּתָא דִכְהוּנְתָּא דִיהַב לֵיהּ יְיָ הִינוּן אַחְסַנְתֵּיהּ הֵיכְמָא דְמַלִּיל לֵיהּ", "pj_en": "but an inheritance in field or vineyard they will not have among their brethren. The twenty and four gifts of the priesthood which the Lord will give to him are his heritage; as He said to him,", "tj": "", "tj_en": "", "rashi": "<b>כאשר דבר לו.<\/b> \"בְּאַרְצָם לֹא תִנְחָל, אֲנִי חֶלְקְךָ\" (במדבר י\"ח):", "rashi_en": "כאשר דבר לו AS HE SPOKE TO HIM i.e., to Aaron [saying],“You shall not inherit in their land… I am your portion [and your inheritance, among the children of Israel].”- (Numbers 18:20)"}, {"ch": 18, "v": 3, "aliyah": 3, "heb": "וְזֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַכֹּהֲנִ֜ים מֵאֵ֣ת הָעָ֗ם מֵאֵ֛ת זֹבְחֵ֥י הַזֶּ֖בַח אִם־שׁ֣וֹר אִם־שֶׂ֑ה וְנָתַן֙ לַכֹּהֵ֔ן הַזְּרֹ֥עַ וְהַלְּחָיַ֖יִם וְהַקֵּבָֽה׃", "onk": "וְדֵין יְהֵי דְחָזֵי לְכָהֲנַיָּא מִן עַמָּא מִן נָכְסֵי נִכְסָתָא אִם תּוֹר אִם אִמָּר וְיִתֵּן לְכַהֲנָא דְּרוֹעָא וְלוֹעָא וְקֻבְתָא:", "onk_en": "And this will be the stipend of the <i>kohanim<\/i> from the people from the slaughterers of [permitted] meat, whether an ox or a sheep; he will give the <i>kohein<\/i> the foreleg and the jaw and the [fourth] stomach.", "pj": "וְדֵין יְהֵי חוּלְקָא דְּחָמֵי לְכַהֲנַיָא מִן עַמָּא מִלְוַת דִּבְחֵי דִבְחִין אִין תּוֹר אִין אִימַר וְיִתְּנוּן לְכַהֲנָא אִדְרָעָא דְיַמִּינָא וְלוּחַיָא אַרְעֲיָא וְלוּחַיָא דִרְקִיתָא וְקֵיבְתָא", "pj_en": "And this shall be the portion belonging to the priest from the people, from them who offer sacrifices, whether bullock or lamb they shall give to the priest the right shoulder, the lower jaw, the cheeks, and the maw;", "tj": "", "tj_en": "", "rashi": "<b>מאת העם.<\/b> וְלֹא מֵאֵת הַכֹּהֲנִים (ספרי; חולין קל\"ב):<br><br><b>אם שור אם שה.<\/b> פְּרָט לְחַיָּה:<br><br><b>הזרע.<\/b> מִן הַפֶּרֶק שֶׁל אַרְכֻּבָּה עַד כַּף שֶׁל יַד שֶׁקּוֹרִין אשפלד\"ון (חולין קל\"ד):<br><br><b>הלחיים.<\/b> עִם הַלָּשׁוֹן. דּוֹרְשֵׁי רְשׁוּמוֹת הָיוּ אוֹמְרִים זְרוֹעַ תַּחַת יַד, שֶׁנֶּאֱמַר (במדבר כ\"ה) \"וַיִּקַּח רֹמַח בְּיָדוֹ\", לְחָיַיִם תַּחַת תְּפִלָּה, שֶׁנֶּאֱמַר (תהילים ק\"י) \"וַיַּעֲמֹד פִּינְחָס וַיְפַלֵּל\", וְהַקֵּבָה תַּחַת \"הָאִשָּׁה אֶל קֳבָתָהּ\" (במדבר כ\"ה):", "rashi_en": "מאת העם [AND THIS SHALL BE THE PRIESTS’ DUE] FROM THE PEOPLE — but not from the priest (i.e. if a priest slaughters animals for his own use he is exempt from giving these dues to another priest) (Sifrei Devarim 165:3; cf. Chullin 132b).<br><br>אם שור אם שה WHETHER IT BE ONE OF THE HERD OR ONE OF THE FLOCK — this excludes an undomesticated beast (חיה).  <br><br>הזרע  THE SHOULDER is the portion from the knee-joint to the shoulder-blade that is called espalte in old French (cf. Rashi on Chullin 134b).<br><br>והלחיים THE TWO CHEEKS — together with the tongue. — Those who interpret the Bible text symbolically (cf. Chullin 134b) said: The זרוע of the animals, (termed יד in later Hebrew), became the due of the priests as a reward for the “hand’’ (יד) which Phineas, the priest, raised against the wrong-doers, as it is said. (Numbers 25:7) “and he took a javelin in his hand”; the “cheek-bones” together with the tongue are a reward for the prayer he offered, as it is said, (Psalms 106:30) “Then stood up Phineas and prayed”; והקבה AND THE MAW — as a reward for his act described thus (Numbers 25:8): “[And he thrust both of them through, the man of Israel] and the woman in her stomach (קבתה) (Chullin 134b)."}, {"ch": 18, "v": 4, "aliyah": 3, "heb": "רֵאשִׁ֨ית דְּגָֽנְךָ֜ תִּירֹשְׁךָ֣ וְיִצְהָרֶ֗ךָ וְרֵאשִׁ֛ית גֵּ֥ז צֹאנְךָ֖ תִּתֶּן־לֽוֹ׃", "onk": "רֵישׁ עִבוּרָךְ חַמְרָךְ וּמִשְׁחָךְ וְרֵישׁ גִּזָּא דְעָנָךְ תִּתֶּן לֵיהּ:", "onk_en": "The first portion of your grain, your wine, and your olive oil, and the first of the shearing of your sheep are you to give him.", "pj": "שֵׁירוּי עִיבּוּרֵיכוֹן חַמְרֵיכוֹן וּמִשְׁחֵיכוֹן וְשֵׁירוּי גִּיזַת עָנֵיכוֹן כְּמִסַת קָטוֹרָא תִּתְּנוּן לֵיהּ", "pj_en": "the firsts of your corn, wine, and oil, the first of the fleece of your sheep, as much as a girdle measureth shall you give to him:", "tj": "", "tj_en": "", "rashi": "<b>ראשית דגנך.<\/b> זוֹ תְּרוּמָה, וְלֹא פֵּרֵשׁ בָּהּ שִׁעוּר, אֲבָל רַבּוֹתֵינוּ נָתְנוּ בָהּ שִׁעוּר – עַיִן יָפָה אֶחָד מֵאַרְבָּעִים, עַיִן רָעָה אֶחָד מִשִּׁשִּׁים, בֵּינוֹנִית אֶחָד מֵחֲמִשִּׁים, וְסָמְכוּ עַל הַמִּקְרָא שֶׁלֹּא לִפְחֹת מֵאֶחָד מִשִּׁשִּׁים שֶׁנֶּאֱמַר (יחזקאל מ\"ה) שִׁשִּׁית הָאֵיפָה מֵחֹמֶר הַחִטִּים, שִׁשִּׁית הָאֵיפָה חֲצִי סְאָה, כְּשֶׁאַתָּה נוֹתֵן חֲצִי סְאָה לְכֹר הֲרֵי אֶחָד מִשִּׁשִּׁים, שֶׁהַכֹּר שְׁלוֹשִׁים סְאִין (תלמוד ירושלמי תרומות פ\"ד):<br><br><b>וראשית גז צאנך.<\/b> כְּשֶׁאַתָּה גּוֹזֵז צֹאנְךָ בְּכָל שָׁנָה תֵּן מִמֶּנָּה רֵאשִׁית לַכֹּהֵן, וְלֹא פֵּרֵשׁ בָּהּ שִׁעוּר, וְרַבּוֹתֵינוּ נָתְנוּ בָהּ שִׁעוּר אֶחָד מִשִּׁשִּׁים, וְכַמָּה צֹאן חַיָּבוֹת בְּרֵאשִׁית הַגֵּז? חָמֵשׁ רְחֵלוֹת, שֶׁנֶּאֱמַר (שמואל א כ\"ה) וְחָמֵשׁ צֹאן עֲשׂוּיוֹת. רַבִּי עֲקִיבָא אוֹמֵר רֵאשִׁית גֵּז – שְׁתַּיִם, צֹאנְךָ – אַרְבָּעָה, תִּתֶּן לוֹ – הֲרֵי חֲמִשָּׁה (עי' ספרי וחולין קל\"ה):", "rashi_en": "ראשית דגנך THE FIRST-FRUIT [ALSO] OF THY CORN … [THOU SHALT GIVE HIM] — This refers to the heave-offering. Scripture, however, does not state any minimum quantity, but our Rabbis fixed a quantity for it from a sixtieth to a fortieth: a benevolent eye (a generous person) gives one fortieth of the crop, a niggard at least one sixtieth, a person of average generosity one fiftieth. They found a support in Scripture that one should not give less than one sixtieth, because it is said, (Ezekiel 45:13) “[This is the heave-offering which ye shall offer:] the sixth part of an ephah of an homer of wheat”. Now the sixth part of an ephah is a half Seah; if therefore you give half a Seah as Terumah from a Kor (which is another term for a Homer), that is a sixtieth part, for a Kor is thirty Seahs (Talmud Yerushalmi Terumot 4:3).<br><br>וראשית גז צאנך AND THE FIRST OF THE FLEECE OF THY FLOCK [SHALT THOU GIVE HIM] — i.e. each year when you sheer your sheep (not when you shear a particular animal for the first time) give the first of it (the wool) to the priest. Scripture mentions no minimum quantity for it, but our Rabbis assigned a quantity for it, viz., one sixtieth part. And how many sheep must there be in the flock that they should come under the law of ראשית הגז (of “giving the first shearing as a gift to the priest”)? At least five sheep, as it is said, (I Samuel 25:18) “[Then Abigail made haste and … took] five sheep ready dressed (עשויות). Rabbi Akiba says: we may derive it from our text itself, as follows: ראשית גז suggests two, צאנך also two, together four, תתן לו one, — altogether five (Chullin 137a; Sifrei Devarim 166:9)."}, {"ch": 18, "v": 5, "aliyah": 3, "heb": "כִּ֣י ב֗וֹ בָּחַ֛ר יְהֹוָ֥ה אֱלֹהֶ֖יךָ מִכׇּל־שְׁבָטֶ֑יךָ לַעֲמֹ֨ד לְשָׁרֵ֧ת בְּשֵׁם־יְהֹוָ֛ה ה֥וּא וּבָנָ֖יו כׇּל־הַיָּמִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי בֵיהּ יִתִּרְעֵי יְיָ אֱלָהָךְ מִכָּל שִׁבְטָיךְ לְמֵקַם לְשַׁמָּשָׁא בִשְׁמָא דַיְיָ הוּא וּבְנוֹהִי כָּל יוֹמַיָּא:", "onk_en": "For him did Adonoy, your God, choose from all your tribes to stand and perform the service in the name of Adonoy, he and his sons for all time.", "pj": "מְטוּל דְּבֵיהּ אִתְרְעֵי יְיָ אֱלָהָכוֹן מִכָּל שִׁבְטֵיכוֹן לְמֵיקוּם לְשַׁמָּשָׁא בִּשְׁמָא דַיְיָ הוּא וּבְנוֹי כָּל יוֹמַיָא", "pj_en": "because the Lord thy God hath chosen him out of all thy tribes to stand and minister in the Name of the Lord, him, and his sons, all the days.", "tj": "", "tj_en": "", "rashi": "<b>לעמד לשרת.<\/b> מִכָּאן שֶׁאֵין שֵׁרוּת אֶלָּא מֵעוֹמֵד (ספרי; סוטה ל\"ח):", "rashi_en": "לעמד לשרת TO STAND TO MINISTER — From here we may derive the law that the sacrificial service must be performed standing (Sifrei Devarim 167:1; Sota 38a)."}, {"ch": 18, "v": 6, "aliyah": 4, "heb": "וְכִֽי־יָבֹ֨א הַלֵּוִ֜י מֵאַחַ֤ד שְׁעָרֶ֙יךָ֙ מִכׇּל־יִשְׂרָאֵ֔ל אֲשֶׁר־ה֖וּא גָּ֣ר שָׁ֑ם וּבָא֙ בְּכׇל־אַוַּ֣ת נַפְשׁ֔וֹ אֶל־הַמָּק֖וֹם אֲשֶׁר־יִבְחַ֥ר יְהֹוָֽה׃", "onk": "וַאֲרֵי יֵיתֵי לֵוָאָה מֵחֲדָא מִקִּרְוָיךְ מִכָּל יִשְׂרָאֵל דִּי הוּא דָּר תַּמָּן וְיֵיתֵי בְּכָל רְעוּת נַפְשֵׁיהּ לְאַתְרָא דִּי יִתִּרְעֵי יְיָ:", "onk_en": "If a Levite should come from one of your cities throughout Yisroel where he sojourns, coming will all his soul’s desire to the place that Adonoy chooses.", "pj": "וַאֲרוּם יֵיתֵי לֵיוָאָה מֵחֲדָא מִן קִרְוֵיכוֹן מִן כָּל יִשְרָאֵל דְּהוּא דַיָיר תַּמָּן וְיֵיתֵי בְּכָל כְּרוּךְ דְּרָעֲיָא נַפְשֵׁיהּ לְאַתְרָא דְיִתְרְעֵי יְיָ", "pj_en": "And when a Levite may come from one of your cities out of all Israel where he hath dwelt, and come with all the obligation of his soul’s desire to the place which the Lord will choose,", "tj": "", "tj_en": "", "rashi": "<b>וכי יבא הלוי.<\/b> יָכוֹל בְּבֶן לֵוִי וַדַּאי הַכָּתוּב מְדַבֵּר, תַּלְמוּד לוֹמַר <b>ושרת<\/b>, יָצְאוּ לְוִיִּים שֶׁאֵין רְאוּיִין לְשֵׁרוּת (ספרי):<br><br><b>ובא בכל אות נפשו, ושרת.<\/b> לִמֵּד עַל הַכֹּהֵן שֶׁבָּא וּמַקְרִיב קָרְבְּנוֹת נִדְבָתוֹ אוֹ חוֹבָתוֹ וַאֲפִלּוּ בְמִשְׁמָר שֶׁאֵינוֹ שֶׁלּוֹ (בבא קמא ק\"ט); דָּ\"אַ — עוֹד לִמֵּד עַל הַכֹּהֲנִים הַבָּאִים לָרֶגֶל שֶׁמַּקְרִיבִין (בַּמִּשְׁמָר) וְעוֹבְדִין בַּקָּרְבָּנוֹת הַבָּאוֹת מֵחֲמַת הָרֶגֶל כְּגוֹן מוּסְפֵי הָרֶגֶל וְאַף עַל פִּי שֶׁאֵין הַמִּשְׁמָר שֶׁלָּהֶם (ספרי; סוכה נ\"ה):", "rashi_en": "וכי יבא הלוי AND IF A LEVITE COME […AND MINISTER] — One might think that Scripture speaks of a “Levite” in the usual sense of the word (i.e. of a לוי and not of a כהן)! Scripture, however, goes on to state, (v. 7) “And he shall minister [in the name of the Lord]”; thus the Levites must be excluded for they are not fit for (not entitled to) service in the Temple (Sifrei Devarim 168:1).<br><br>ובא בכל אות נפשו ושרת AND COME WITH ALL THE LONGING OF HIS SOUL …AND MINISTER — This teaches that a priest may come and offer his free-will and obligatory sacrifices even at a time when a priestly shift is in charge to which he does not belong (Bava Kamma 109b). Another explanation: It further teaches regarding priests who appear in the Temple as pilgrims on the festivals that they may offer [with the rota], and do the services connected with the sacrifices that are offered on account of the festival, as for instance, the additional offerings due on festivals — although the shift is not theirs (Sifrei Devarim 168:3; Sukkah 55b)."}, {"ch": 18, "v": 7, "aliyah": 4, "heb": "וְשֵׁרֵ֕ת בְּשֵׁ֖ם יְהֹוָ֣ה אֱלֹהָ֑יו כְּכׇל־אֶחָיו֙ הַלְוִיִּ֔ם הָעֹמְדִ֥ים שָׁ֖ם לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וִישַׁמַּשׁ בִּשְׁמָא דַּיְיָ אֱלָהֵיהּ כְּכָל אֲחוֹהִי לֵוָאֵי <b>דִּמְשַׁמְּשִׁין<\/b> תַּמָּן <b>(בִּצְלוֹ)<\/b> קֳדָם יְיָ:", "onk_en": "He shall perform the service in the name of Adonoy, his God, like all his brother Levites who stand [<b>serve<\/b>] there [<b>(in prayer)<\/b>] in Adonoy’s Presence.", "pj": "וִישַׁמֵּשׁ בְּשׁוּם מֵימְרָא דַיְיָ אֱלָהֵיהּ הֵי כְּכָל אָחוֹי לֵיוָאֵי דִמְשַׁמְשִׁין תַּמָּן קֳדָם יְיָ", "pj_en": "then he shall minister in the Name of the Lord his God as all his brethren the Levites who minister there before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 8, "aliyah": 4, "heb": "חֵ֥לֶק כְּחֵ֖לֶק יֹאכֵ֑לוּ לְבַ֥ד מִמְכָּרָ֖יו עַל־הָאָבֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "חֳלָק כָּחֳלָק יֵיכְלוּן בַּר <b>מִמַּטַּרְתָּא דְּיֵיתֵי בְשַׁבַּתָּא דְּכֵן אַתְקִינוּ אֲבָהָתָא<\/b>:", "onk_en": "They shall eat equal portions [<b>portion for portions<\/b>], except for what the families sold [to one another] [<b>exept for the allotment which come on Shabbos, as our (fore)fathers have regulated<\/b>].", "pj": "חוּלַק כָּל קֳבֵיל חוּלַק בְּשָׁוֶה יֵיכְלוּן בַּר מִמּוֹתְבֵי קוּרְבָּנַיָא דְיֵיכְלוּן כַּהֲנַיָא דְאוֹרִיתוּ לְהוֹן אֶלְעָזָר וְאִיתָמָר אֲבָהַתְכוֹן", "pj_en": "Portion for portion equally shall they eat, besides the gifts of the oblations which the priests do eat, which Elazar and Ithamar your fathers have given them to inherit.", "tj": "וְיַת בַּר זְבוּנֵיהּ דְּזַבִּינוּ לֵיהּ עַל אַבְהָתָא:", "tj_en": "And the allowance of his sale which they sell to him according to the fathers.", "rashi": "<b>חלק כחלק יאכלו.<\/b> מְלַמֵּד שֶׁחוֹלְקִין בָּעוֹרוֹת וּבִּבְשַׂר שְׂעִירֵי חַטָּאוֹת, יָכוֹל אַף בִּדְּבָרִים הַבָּאִים שֶׁלֹּא מֵחֲמַת הָרֶגֶל, כְּגוֹן תְּמִידִין וּמוּסְפֵי שַׁבָּת וּנְדָרִים וּנְדָבוֹת, תַּ\"לֹ <b>לבד ממכריו על האבות<\/b> חוּץ מִמַּה שֶּׁמָּכְרוּ הָאָבוֹת בִּימֵי דָּוִד וּשְׁמוּאֵל שֶׁנִּקְבְעוּ הַמִּשְׁמָרוֹת וּמָכְרוּ זֶה לָזֶה, טֹל אַתָּה שַׁבַּתְּךָ וַאֲנִי אֶטֹּל שַׁבַּתִּי (שם):", "rashi_en": "חלק כחלק יאכלו THEY SHALL ENJOY LIKE PORTIONS — This teaches that they (the priests who come to Jerusalem on the festivals as pilgrims but are not in charge) participate in the hides (of the burnt offerings due on the festivals) and the flesh of the he goats brought as sin-offerings on account of the festivals. One might think that they participate also in sacrifices which are offered not on account of the festivals, as, for instance, the continual burnt offerings, the additional offerings due on account of Sabbath (on which a festival happens to fall) and vow- and free-will offerings! Scripture, however, states:  לבד ממכריו על האבות [THEY SHALL ENJOY LIKE PORTIONS] EXCEPT THE SALE OF THE FATHERS — i.e. except those things which their ancestors sold to each other in the days of David and Samuel when the system of shifts was established and they made, as it were, an agreement of sale, saying, “Take thou the ordinary priestly perquisites during thy week and I shall take them during my week (Sifrei Devarim 169:3; Sukkah 56a)."}, {"ch": 18, "v": 9, "aliyah": 4, "heb": "כִּ֤י אַתָּה֙ בָּ֣א אֶל־הָאָ֔רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֶ֖יךָ נֹתֵ֣ן לָ֑ךְ לֹֽא־תִלְמַ֣ד לַעֲשׂ֔וֹת כְּתוֹעֲבֹ֖ת הַגּוֹיִ֥ם הָהֵֽם׃", "onk": "אֲרֵי אַתְּ עָלֵל לְאַרְעָא דַּיְיָ אֱלָהָךְ יָהֵב לָךְ לָא תֵילַף לְמֶעְבַּד כְּטַעֲוַת עַמְמַיָּא הָאִנּוּן:", "onk_en": "Because you are entering the land that Adonoy, your God, is giving you; do not learn to perpetrate the abominations of those nations.", "pj": "אֲרוּם אַתּוּן עַלְלִין לְאַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן לָא תֵילְפוּן לְמֶעֱבַד כְּרִיחוֹקֵי עַמְמַיָא הָאִינוּן", "pj_en": "When you have entered the land which the Lord your God giveth you, ye shall not learn to do after the abominations of those nations.", "tj": "", "tj_en": "", "rashi": "<b>לא תלמד לעשות.<\/b> אֲבָל אַתָּה לָמֵד לְהָבִין וּלְהוֹרוֹת, כְּלוֹמַר לְהָבִין מַעֲשֵׂיהֶם כַּמָּה הֵם מְקֻלְקָלִים, וּלְהוֹרוֹת לְבָנֶיךָ לֹא תַעֲשֶׂה כָךְ וְכָךְ, שֶׁזֶּה הוּא חֹק הַגּוֹיִם (ספרי; סנהדרין ס\"ח):", "rashi_en": "לא תלמד לעשות THOU SHALT NOT LEARN TO DO [AFTER THE ABOMINATIONS OF THOSE NATIONS] — thou shalt not learn to do, but you may learn their practices in order to understand them and to teach others, that is to say, to understand their doings, how depraved they are, and thus to be able to teach thy children, “Do not so and so because these are the religious observances of the heathens!” (Sifrei Devarim 170:3; Sanhedrin 68a.)"}, {"ch": 18, "v": 10, "aliyah": 4, "heb": "לֹֽא־יִמָּצֵ֣א בְךָ֔ מַעֲבִ֥יר בְּנֽוֹ־וּבִתּ֖וֹ בָּאֵ֑שׁ קֹסֵ֣ם קְסָמִ֔ים מְעוֹנֵ֥ן וּמְנַחֵ֖שׁ וּמְכַשֵּֽׁף׃", "onk": "לָא יִשְׁתְּכַח בָּךְ מַעֲבַר בְּרֵיהּ וּבְרַתֵּיהּ בְּנוּרָא קָסֵם קֻסְמִין מְעָנֵן וּמְנַחֵשׁ וְחָרָשׁ:", "onk_en": "Let there not exist among you anyone who passes his son or daughter through fire, who practices the kosem-occult; who practices time-frame-occult or who divines portentuous events or a sorcerer.", "pj": "לָא יִשְׁתְּכַח בְּכוֹן מְעַבְּרִין בְּנֵיהוֹן וּבְנָתֵיהוֹן בְּנוּרָא לָא קְסוֹמֵי קוּסְמִין וְלָא חֲרוּרֵי עַיְינִין וְלָא נַטוֹרֵי נְחָשִׁין וְלָא חַרְשִׁין", "pj_en": "None shall be found among you to make his sons or daughters pass through the fire, nor who enchant with enchantments, or inspect serpents, nor observe divinations and auguries,", "tj": "לָא יִשְׁתְּכַח בְּכוֹן מַעֲבַר בְּרֵיהּ וּבְרַתֵּיהּ בְּנוּרָא לְאַקְסוֹמֵי קוּסְמִין וְלָא חֲרוֹרֵי עַיְינִין וְלָא נְטוֹרֵי נְחָשִׁין וַחֲרָשִׁין:", "tj_en": "No one shall be found among you to make his son or daughter pass through the fire, to enchant with enchantments, to inspect serpents, or to observe divinations and auguries;", "rashi": "<b>מעביר בנו ובתו באש.<\/b> הִיא עֲבוֹדַת הַמֹּלֶךְ, עוֹשֶׂה מְדוּרוֹת אֵשׁ מִכָּאן וּמִכָּאן וּמַעֲבִירוֹ בֵין שְׁתֵּיהֶם (עי' סנהדרין ס\"ד):<br><br><b>קסם קסמים.<\/b> אֵי זֶהוּ קוֹסֵם? הָאוֹחֵז אֶת מַקְלוֹ וְאוֹמֵר אִם אֵלֵךְ אִם לֹא אֵלֵךְ, וכֵן הוּא אוֹמֵר (הושע ד') עַמִּי בְּעֵצוֹ יִשְׁאָל וּמַקְלוֹ יַגִּיד לוֹ (ספרי):<br><br><b>מעונן.<\/b> רַבִּי עֲקִיבָא אוֹמֵר אֵלּוּ נוֹתְנֵי עוֹנוֹת – שֶׁאוֹמְרִים עוֹנָה פְּלוֹנִית יָפָה לְהַתְחִיל, וַחֲכָמִים אוֹמְרִים אֵלּוּ אוֹחֲזֵי הָעֵינַיִם:<br><br><b>מנחש.<\/b> פִּתּוֹ נָפְלָה מִפִּיו, צְבִי הִפְסִיקוֹ בַדֶּרֶךְ, מַקְלוֹ נָפַל מִיָּדוֹ (ספרי; סנהדרין ס\"ה):", "rashi_en": "מעביר בנו ובתו באש [THERE SHALL NOT BE FOUND AMONG YOU ANYONE] THAT MAKETH HIS SON OR HIS DAUGHTER TO PASS THROUGH THE FIRE — This was the way of worshipping Molech. They made two pyres, one on this side and one on the other (one opposite the other) and passed it (the child) between them (cf. Sanhedrin 64b).<br><br>קסם קסמים ONE THAT USETH DIVINATION — What is a diviner? One who takes his stick in hand and says, (as though he were consulting it), “Shall I go, or shall I not go?” So does it state, (Hoshea 4:12) “My people ask counsel of their stick, and their staff declareth unto them” (Sifrei Devarim 171:6).<br><br>מעונן — Rabbi Akiba said, Such are people who assign times (עונות plural of עונה “period”, “time”) — who say, “This time is auspicious to begin some work”; the Sages, however, say, It refers to those “who hold your eyes under control” (who delude by optical deception; they connect מעונן with עין “eye”) (Sifrei Devarim 171:9).<br><br>מנחש A SORCERER — [one who draws prognostications from the fact that] the bread fell from his mouth, or that a stag crossed his path, or that his stick fell from his hand (Sifrei Devarim 171:10; Sanhedrin 65b; cf. Rashi on Leviticus 19:26)."}, {"ch": 18, "v": 11, "aliyah": 4, "heb": "וְחֹבֵ֖ר חָ֑בֶר וְשֹׁאֵ֥ל אוֹב֙ וְיִדְּעֹנִ֔י וְדֹרֵ֖שׁ אֶל־הַמֵּתִֽים׃", "onk": "וְרָטִין רְטָן וְשָׁאֵל בִּדִּין וּזְכוּרוּ וְתָבַע מִן מֵתַיָּא:", "onk_en": "Or a snake charmer, or one who invokes the spirit of Ov or <i>yidoni,<\/i> or communicates with the dead.", "pj": "וּמְחַבְּרִין וְאַסְרִין חֵיוִין וְעַקְרַבִּין וְכָל מִינֵי רַחֲשִׁין וְשַׁאֲלִין אִיבָא טַמְיָא וּגְרַם יָדוּעַ וּתְבַע מִן מֵיתַיָא", "pj_e
