<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;

}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>

const DATA = [{"ch": 12, "v": 1, "aliyah": 1, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־אַבְרָ֔ם לֶךְ־לְךָ֛ מֵאַרְצְךָ֥ וּמִמּֽוֹלַדְתְּךָ֖ וּמִבֵּ֣ית אָבִ֑יךָ אֶל־הָאָ֖רֶץ אֲשֶׁ֥ר אַרְאֶֽךָּ׃", "onk": "וַאֲמַר יְיָ לְאַבְרָם אִיזֵל לָךְ מֵאַרְעָךְ וּמִיַּלָּדוּתָךְ וּמִבֵּית אֲבוּךְ לְאַרְעָא דִּי אַחֲזִנָּךְ:", "onk_en": "Adonoy said to Avram, Go from your land, from your birthplace, and from your father’s house, [and go] to the land that I will show you.", "pj": "וַאֲמַר יְיָ לְאַבְרָם אִיזֵיל לָךְ מֵאַרְעָךְ אִתְפְּרֵשׁ מִן יַלְדוּתָךְ פּוּק מִבֵּית אָבוּךְ זִיל לְאַרְעָא דְאַחֲזִינָךְ", "pj_en": "AND the Lord said to Abram, Go thou from thy land; separate thyself from thy kindred; go forth from the house of thy father; go into the land which I will show thee.", "tj": "", "tj_en": "", "rashi": "<b>לך לך.<\/b> לַהֲנָאָתְךָ וּלְטוֹבָתְךָ, שָׁם אֶעֶשְׂךָ לְגוֹי גָדוֹל, כָּאן אִי אַתָּה זוֹכֶה לְבָנִים, וְעוֹד שֶׁאוֹדִיעַ טִבְעֲךָ בָּעוֹלָם:", "rashi_en": "לך לך GET THEE OUT (literally, go for thyself) — for your own benefit, for your own good: there I will make of you a great nation whilst here you will not merit the privilege of having children (Rosh Hashanah 16b). Furthermore, I shall make known your character throughout the world (Midrash Tanchuma, Lech Lecha 3)"}, {"ch": 12, "v": 2, "aliyah": 1, "heb": "וְאֶֽעֶשְׂךָ֙ לְג֣וֹי גָּד֔וֹל וַאֲבָ֣רֶכְךָ֔ וַאֲגַדְּלָ֖ה שְׁמֶ֑ךָ וֶהְיֵ֖ה בְּרָכָֽה׃", "onk": "וְאֶעְבְּדִנָּךְ לְעַם סַגִּי וֶאֱבָרֵכִנָּךְ וַאֲרַבֵּי שְׁמָךְ <b>וּתְהֵא מְבָרָךְ<\/b>:", "onk_en": "I will make you into a great nation, I will bless you and make your name great; and you will be a blessing [<i>and you will be blessed<\/i>].", "pj": "וְאַעֲבִידְנָךְ לְעָם רָב וְאֵבָרְכִינָךְ וְאַרַבֵּי שְׁמָךְ וּתְהֵי מְבָרֵךְ", "pj_en": "And I will make thee a great people, and will bless thee, and magnify thy name, and thou shalt be blessed.", "tj": "לךְ לךָ ואעשׁךָ. וֵאֲמַנֵי יָתָךְ לְאוּמָא רַבָּא וַאֲבָרֵךְ יָתָךְ נ\"א ואתקף שמך וְאַתְקֵף וְיֶהֱוֵי אַבְרָם לְבִרְכָן סַגְיָין:", "tj_en": "And I will constitute thee a great people, and I will bless thee; and Abram shall be strengthened with many blessings.", "rashi": "<b>ואעשך לגוי גדול.<\/b> לְפִי שֶׁהַדֶּרֶךְ גּוֹרֶמֶת לִשְׁלֹשָׁה דְבָרִים, מְמַעֶטֶת פְּרִיָּה וּרְבִיָּה וּמְמַעֶטֶת אֶת הַמָּמוֹן וּמְמַעֶטֶת אֶת הַשֵּׁם, לְכָךְ הֻזְקַק לִשְׁלֹשָׁה בְּרָכוֹת הַלָּלוּ, שֶׁהִבְטִיחוֹ עַל הַבָּנִים וְעַל הַמָּמוֹן וְעַל הַשֵּׁם:<br><br><b>ואברכך.<\/b> בְּמָמוֹן (בראשית רבה):<br><br><b>והיה ברכה.<\/b> הַבְּרָכוֹת נְתוּנוֹת בְּיָדְךָ; עַד עַכְשָׁו הָיוּ בְיָדִי, בֵּרַכְתִּי לְאָדָם וְנֹחַ, וּמֵעַכְשָׁו אַתָּה תְבָרֵךְ אֶת אֲשֶׁר תַּחְפֹּץ (בראשית רבה). דָּבָר אַחֵר <b>ואעשך לגוי גדול<\/b> זֶה שֶׁאוֹמְרִים אֱלֹהֵי אַבְרָהָם, <b>ואברכך<\/b> זֶה שֶׁאוֹמְרִים אֱלֹהֵי יִצְחָק, <b>ואגדלה שמך<\/b> זֶה שֶׁאוֹמְרִים אֱלֹהֵי יַעֲקֹב. יָכוֹל יִהְיוּ חוֹתְמִין בְּכֻלָּן, תַּלְמוּד לוֹמַר וֶהְיֵה בְּרָכָה, בְּךָ חוֹתְמִין וְלֹא בָהֶם:<br><br><b>מארצך.<\/b> וַהֲלֹא כְבָר יָצָא מִשָּׁם עִם אָבִיו וּבָא עַד חָרָן? אֶלָּא כָּךְ אָמַר לוֹ הִתְרַחֵק עוֹד מִשָּׁם וְצֵא מִבֵּית אָבִיךָ:<br><br><b>אשר אראך.<\/b> לֹא גִּלָּה לוֹ הָאָרֶץ מִיָּד כְּדֵּי לְחַבְּבָהּ בְּעֵינָיו, וְלָתֵת לוֹ שָׂכָר עַל כָּל דִּבּוּר וְדִבּוּר; כַּיּוֹצֵא בוֹ, אֶת בִּנְךָ אֶת יְחִידְךָ אֲשֶׁר אָהַבְתָּ אֶת יִצְחָק (ברא' כ\"ב), כַּיּוֹצֵא בוֹ עַל אַחַד הֶהָרִים אֲשֶׁר אֹמַר אֵלֶיךָ, וכיו\"בּ וּקְרָא אֵלֶיהָ אֶת הַקְּרִיאָה אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶיךָ (יונה ג'):", "rashi_en": "ואעשך לגוי גדול AND I WILL MAKE OF THEE A GREAT NATION —Since travelling is the cause of three things—it decreases (breaks up) family life, it reduces one’s wealth and lessens one’s renown, he therefore needed these three blessings: that God should promise him children, wealth and a great name (Genesis Rabbah 39:11).<br><br>ואברכך AND I WILL BLESS THEE —with wealth (Genesis Rabbah 39:11). <br><br>והיה ברכה AND BE THOU A BLESSING — Blessings are entrusted to you; hitherto they were in My power — I blessed Adam and Noah — but from now on you shall bless whomsoever you wish (Genesis Rabbah 39:11) Another explanation is: AND I WILL MAKE THEE A GREAT NATION, this alludes to the fact that we say in our prayer “God of Abraham”; AND I WILL BLESS THEE — that we say, “God of Isaac”; AND I WILL MAKE THY NAME GREAT — that we say, “God of Jacob”. One might think that we should conclude the benediction in which these invocations are recited by mentioning again the names of all the patriarchs — the text therefore states “Be thou a blessing” meaning, with you (i.e. with your name only) shall they conclude the benediction and not with them (their names) (Pesachim 117b).<br><br>מארצך FROM THY LAND — But had he not already departed from there together with his father and had reached as far as Haran (Genesis 11:31)? But thus God in effect said to him: Go still further away — leave now thy father’s house also.<br><br>אשר אראך WHICH I WILL SHOW THEE — He did not reveal to him at once which land it was in order that he should hold it in high esteem and in order to reward him for complying with each and every command. Similar is, (Genesis 22:2) “Take thy son — thine only son — whom thou lovest — even Isaac”; similar is (Genesis 22:2) “upon one of the mountains which I will tell thee of”; similar is, (Jonah 3:2) “And make unto it the proclamation that I shall tell thee of” (Genesis Rabbah 39:9). "}, {"ch": 12, "v": 3, "aliyah": 1, "heb": "וַאֲבָֽרְכָה֙ מְבָ֣רְכֶ֔יךָ וּמְקַלֶּלְךָ֖ אָאֹ֑ר וְנִבְרְכ֣וּ בְךָ֔ כֹּ֖ל מִשְׁפְּחֹ֥ת הָאֲדָמָֽה׃", "onk": "וֶאֱבָרֵךְ מְבָרְכָךְ וּמְלַטְטָךְ אֵילוּט וְיִתְבָּרֲכוּן <b>בְּדִילָךְ<\/b> כֹּל זַרְעֲיַת אַרְעָא:", "onk_en": "I will bless those who bless you, and he who curses you, I will curse; and through you [<i>and because of you<\/i>], will be blessed all the families of the earth.", "pj": "וַאֲבָרֵךְ יַת כַּהֲנַיָא דְפַרְסִין יְדֵיהוֹן בִּצְלוֹ וּמְבָרְכִין יַת בְּנָךְ וּבִלְעָם דִמְלַטֵט יַתְהוֹן אֵילוֹט וְיִקְטְלוּנֵיהּ לְפִתְגַם דְחָרֶב וְיִתְבָּרְכוּן בָּךְ כָּל זַרְעַיַת אַרְעָא", "pj_en": "And I will bless the priests who will spread forth their hands in prayer, and bless thy sons; and Bileam, who will curse them, I will curse, and they shall slay him with the mouth of the sword; and in thee shall be blessed all the generations of the earth.", "tj": "וַאֲבָרֵךְ מַאן דִי בְרִיךְ יָתָךְ וּמַן דְלַיִיט יָתָךְ יֶהֱוֵי לִיט וְיִתְבָּרְכוּן בִזְכוּתָךְ כָּל זַרְעַיַת אַרְעָא:", "tj_en": "And I will bless him who blesseth thee, and he who curseth thee shall be accursed; and in thy righteousness shall all the generations of the earth be blessed.", "rashi": "<b>ונברכו בך.<\/b> יֵשׁ אַגָּדוֹת רַבּוֹת, וְזֶהוּ פְשׁוּטוֹ, אָדָם אוֹמֵר לִבְנוֹ תְּהֵא כְּאַבְרָהָם, וְכֵן כָּל וְנִבְרְכוּ בְךָ שֶׁבַּמִּקְרָא, וְזֶה מוֹכִיחַ בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר יְשִׂמְךָ אֱלֹהִים כְּאֶפְרַיִם וְכִמְנַשֶּׁה (בר' מ\"ח):", "rashi_en": "ונברכו בך AND IN THEE SHALL BE BLESSED — There are many Agadoth concerning this but the plain sense of the text is as follows: A man says to his son, “Mayest thou become as Abraham”. This, too, is the meaning wherever the phrase ונברכו בך “And in thee shall be blessed” occurs in Scripture, and the following example proves this: (Genesis 48:20) בך יברך “By thee shall Israel bless their children saying, “May God make thee as Ephraim and Manasseh”. "}, {"ch": 12, "v": 4, "aliyah": 1, "heb": "וַיֵּ֣לֶךְ אַבְרָ֗ם כַּאֲשֶׁ֨ר דִּבֶּ֤ר אֵלָיו֙ יְהֹוָ֔ה וַיֵּ֥לֶךְ אִתּ֖וֹ ל֑וֹט וְאַבְרָ֗ם בֶּן־חָמֵ֤שׁ שָׁנִים֙ וְשִׁבְעִ֣ים שָׁנָ֔ה בְּצֵאת֖וֹ מֵחָרָֽן׃", "onk": "וַאֲזַל אַבְרָם כְּמָא דִמַלֵּיל עִמֵּיהּ יְיָ וַאֲזַל עִמֵּיהּ לוֹט וְאַבְרָם בַּר שִׁבְעִין וַחֲמֵשׁ שְׁנִין בְּמִפְּקֵיהּ מֵחָרָן:", "onk_en": "Avram went as Adonoy had told him, and Lot went with him. Avram was seventy-five years old when he left Charan.", "pj": "וַאֲזַל אַבְרָם הֵכְמָא דְמַלֵל יְיָ לֵיהּ וְאָזַל עִמֵיהּ לוֹט וְאַבְרָם בַּר שׁוּבְעִין וַחֲמֵשׁ שְׁנִין בְּמִפְקֵיהּ מֵחָרָן", "pj_en": "And Abram went, according as the Lord had spoken with him, and Lot went with him. And Abram was the son of seventy and five years at his going forth from Haran.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 5, "aliyah": 1, "heb": "וַיִּקַּ֣ח אַבְרָם֩ אֶת־שָׂרַ֨י אִשְׁתּ֜וֹ וְאֶת־ל֣וֹט בֶּן־אָחִ֗יו וְאֶת־כׇּל־רְכוּשָׁם֙ אֲשֶׁ֣ר רָכָ֔שׁוּ וְאֶת־הַנֶּ֖פֶשׁ אֲשֶׁר־עָשׂ֣וּ בְחָרָ֑ן וַיֵּצְא֗וּ לָלֶ֙כֶת֙ אַ֣רְצָה כְּנַ֔עַן וַיָּבֹ֖אוּ אַ֥רְצָה כְּנָֽעַן׃", "onk": "וּדְבַר אַבְרָם יָת שָׂרַי אִתְּתֵיהּ וְיָת לוֹט בַּר אֲחוּהִי וְיָת כָּל קִנְיָנְהוֹן דִּי קְנוֹ וְיָת נַפְשָׁתָא דְּשַׁעְבִּידוּ לְאוֹרַיְתָא בְחָרָן וּנְפָקוּ לְמֵיזַל לְאַרְעָא דִכְנַעַן וַאֲתוֹ לְאַרְעָא דִכְנָעַן:", "onk_en": "Avram took his wife Sarai, Lot, his brother’s son, all their possessions they had acquired, and the souls [people] that they had made [converted] in Charan, and they set out to go to the land of Canaan. They came to the land of Canaan.", "pj": "וּדְבַר אַבְרָם יַת שָרַי אִנְתְּתֵיהּ וְיַת לוֹט בַּר אָחוֹי וְיַת כָּל קִנְיָנֵיהוֹן דִי קְנוֹ וְיַת נַפְשָׁתָא דִי גַיְירוּ בְּחָרָן וּנְפָקוּ לְמֵיזַל לְאַרְעָא דִכְנָעַן וַאֲתוֹ לְאַרְעָא דִכְנָעַן", "pj_en": "And Abram took Sara his wife, and Lot his brother's son, and all the substance which they had acquired, and the souls whom they had proselyted in Haran, and went forth to go to the land of Kenaan. And they came to the land of Kenaan.", "tj": "וְיַת נַפְשָׁתָא דְגַיְירִין:", "tj_en": "And the souls of the proselytes.", "rashi": "<b>אשר עשו בחרן.<\/b> שֶׁהִכְנִיסָן תַּחַת כַּנְפֵי הַשְּׁכִינָה; אַבְרָהָם מְגַיֵּר אֶת הָאֲנָשִׁים וְשָׂרָה מְגַיֶּרֶת הַנָּשִׁים, וּמַעֲלֶה עֲלֵיהֶם הַכָּתוּב כְּאִלּוּ עֲשָׂאוּם; וּפְשׁוּטוֹ שֶׁל מִקְרָא עֲבָדִים וּשְׁפָחוֹת שֶׁקָּנוּ לָהֶם, כְּמוֹ עָשָׂה אֵת כָּל הַכָּבֹד הַזֶּה (שם ל\"א), וְיִשְׂרָאֵל עֹשֶׂה חָיִל (במדבר כד יח), לְשׁוֹן קוֹנֶה וְכוֹנֵס:", "rashi_en": "אשר עשו בחרן [THE SOULS] THAT THEY HAD GOTTEN (literally, made) IN HARAN — The souls which he had brought beneath the sheltering wings of the Shechinah. Abraham converted the men and Sarah converted the women and Scripture accounts it unto them as if they had made them (Genesis Rabbah 39:14). However, the real sense of the text is that it refers to the men-servants and to the maidservants whom they had acquired for themselves. The word “עשה” is used here as (in Genesis 31:1), “he has acquired (עשה) all this wealth”, and (Numbers 24:8), “And Israel acquires (עושה) wealth” — an expression for acquiring and amassing. "}, {"ch": 12, "v": 6, "aliyah": 1, "heb": "וַיַּעֲבֹ֤ר אַבְרָם֙ בָּאָ֔רֶץ עַ֚ד מְק֣וֹם שְׁכֶ֔ם עַ֖ד אֵל֣וֹן מוֹרֶ֑ה וְהַֽכְּנַעֲנִ֖י אָ֥ז בָּאָֽרֶץ׃", "onk": "וַעֲבַר אַבְרָם בְּאַרְעָא עַד אֲתַר שְׁכֶם עַד מֵישַׁר מוֹרֶה וּכְנַעֲנָאָה בְּכֵן בְּאַרְעָא:", "onk_en": "Avram passed [traveled] through the land until the place of Shechem, until the Plain of Moreh. The Canaanites were then in the land.", "pj": "וְעָבַר אַבְרָם בְּאַרְעָא עַד אֲתַר שְׁכֶם עַד מֵישַׁר דַהֲוָה מַיְירִי וּכְנַעֲנָאֵי בְּכֵן הֲווֹ בְּאַרְעָא דְעַד כְּדוֹן לָא מָטָא זִמְנָא דִבְנֵי יִשְרָאֵל לְמֵירְתָהּ", "pj_en": "And Abram passed through the land unto the place of Shekem, unto the plain which had been showed. And the Kenaanites were then in the land; for the time had not yet come that the sons of Israel should possess it.", "tj": "מִשְׁרֵי חֲזוּזָא:", "tj_en": "The plain (or valley) of vision. And the Kenaanites were then in the land; for the time had not yet come that the sons of Israel should possess it.", "rashi": "<b>ויעבר אברם בארץ.<\/b> נִכְנַס לְתוֹכָהּ:<br><br><b>עד מקום שכם.<\/b> לְהִתְפַּלֵּל עַל בְּנֵי יַעֲקֹב, כְּשֶׁיָּבֹאוּ לְהִלָּחֵם בִּשְׁכֶם:<br><br><b>אלון מורה.<\/b> הוּא שְׁכֶם. הֶרְאָהוּ הַר גְּרִיזִים וְהַר עֵיבָל, שֶׁשָּׁם קִבְּלוּ יִשְׂרָאֵל שְׁבוּעַת הַתּוֹרָה:<br><br><b>והכנעני אז בארץ.<\/b> הָיָה הוֹלֵךְ וְכוֹבֵשׁ אֶת אֶרֶץ יִשְׂרָאֵל מִזַּרְעוֹ שֶׁל שֵׁם, שֶׁבְּחֶלְקוֹ שֶׁל שֵׁם נָפְלָה כְּשֶׁחָלַק נֹחַ אֶת הָאָרֶץ לְבָנָיו, שֶׁנֶּאֱמַר וּמַלְכִּי צֶדֶק מֶלֶךְ שָׁלֵם (ברא' י\"ב), לְפִיכָךְ וַיֹּאמֶר ה' אֶל אַבְרָם לְזַרְעֲךָ אֶתֵּן אֶת הָאָרֶץ הַזֹּאת, עָתִיד אֲנִי לְהַחֲזִירָהּ לְבָנֶיךָ שֶׁהֵם מִזַּרְעוֹ שֶׁל שֵׁם:", "rashi_en": "ויעבר אברם בארץ AND ABRAHAM PASSED THROUGH THE LAND —he entered it.<br><br>עד מקום שכם UNTO THE PLACE OF SHECHEM — In order to pray on behalf of Jacob’s sons, anticipating the time when they would come to fight against Shechem.<br><br>אלון מורה THE PLAIN OF MOREH — This is Shechem (Sotah 32a). He showed him Mount Gerizim and Mount Ebal where Israel took upon themselves the oath to observe the Torah (cf. Deuteronomy 11:29 and Deuteronomy 111:30).<br><br>והכנעני אז בארץ AND THE CANAANITE WAS THEN IN THE LAND — They (the Canaanites) were gradually conquering the land of Israel from the descendants of Shem, for it had fallen to the share of Shem when Noah apportioned the earth amongst his sons, for it is said (Genesis 14:18) “And Melchizedek) king of Salem (Jerusalem)”. For this reason the Lord said to Abram (Genesis 12:7) “to thy seed will I give this land” — “I will in some future time return it to thy children who are descendants of Shem”. "}, {"ch": 12, "v": 7, "aliyah": 1, "heb": "וַיֵּרָ֤א יְהֹוָה֙ אֶל־אַבְרָ֔ם וַיֹּ֕אמֶר לְזַ֨רְעֲךָ֔ אֶתֵּ֖ן אֶת־הָאָ֣רֶץ הַזֹּ֑את וַיִּ֤בֶן שָׁם֙ מִזְבֵּ֔חַ לַיהֹוָ֖ה הַנִּרְאֶ֥ה אֵלָֽיו׃", "onk": "<b>וְאִתְגְּלִי<\/b> יְיָ לְאַבְרָם וַאֲמַר לִבְנָךְ אֶתֵּן יָת אַרְעָא הָדָא וּבְנָא תַמָּן מִדְבְּחָא <b>קֳדָם<\/b> יְיָ <b>דְּאִתְגְּלִי<\/b> לֵיהּ:", "onk_en": "Adonoy appeared [<i>became revealed<\/i>] to Avram and said: To your descendants I will give this land. There he built an altar to [<i>before<\/i>] Adonoy Who had appeared [<i>been revealed<\/i>] to him.", "pj": "וְאִתְגְלֵי יְיָ לְאַבְרָם וַאֲמַר לִבְנָךְ אֶתֵּן יַת אַרְעָא הָדָא וּבְנָא תַמָן מַדְבְּחָא קֳדָם יְיָ דְאִתְגְלֵי לֵיהּ", "pj_en": "And the Lord was revealed unto Abram, and said, To thy sons will I give this land. And he builded there an altar before the Lord, who was revealed to him.", "tj": "", "tj_en": "", "rashi": "<b>ויבן שם מזבח.<\/b> עַל בְּשׂוֹרַת הַזֶּרַע וְעַל בְּשׂוֹרַת אֶרֶץ יִשְׂרָאֵל:", "rashi_en": "ויבן שם מזבח AND HE BUILDED THERE AN ALTAR — in thanksgiving for the good tidings that he would have children, and for the good tidings that they would possess the land of Israel. "}, {"ch": 12, "v": 8, "aliyah": 1, "heb": "וַיַּעְתֵּ֨ק מִשָּׁ֜ם הָהָ֗רָה מִקֶּ֛דֶם לְבֵֽית־אֵ֖ל וַיֵּ֣ט אׇהֳלֹ֑ה בֵּֽית־אֵ֤ל מִיָּם֙ וְהָעַ֣י מִקֶּ֔דֶם וַיִּֽבֶן־שָׁ֤ם מִזְבֵּ֙חַ֙ לַֽיהֹוָ֔ה וַיִּקְרָ֖א בְּשֵׁ֥ם יְהֹוָֽה׃", "onk": "<b>וְאִסְתַּלַּק<\/b> מִתַּמָּן לְטוּרָא מִמַּדְנַח לְבֵית אֵל וּפְרַס מַשְׁכְּנֵיהּ בֵּית אֵל מִמַּעַרְבָא וְעַי מִמָּדִינְחָא וּבְנָא תַמָּן מִדְבְּחָא <b>קֳדָם<\/b> יְיָ <b>וְצַלִּי בִּשְׁמָא<\/b> דַיְיָ:", "onk_en": "From there he moved [<i>ascended<\/i>] to the mountain that was east of Beis-Eil and set up his tent. Beis-Eil was to the west and Ai was to the east. There he built an altar to [<i>before<\/i>] Adonoy, and he proclaimed the Name, [<i>and he prayed in the Name,<\/i>] Adonoy.", "pj": "וְאִסְתַּלֵק מִתַּמָן לְטוּרָא דְמִמַדְנַח לְבֵית אֵל וּפַרְסֵיהּ מַשְׁכְּנָא בֵּית אֵל מִן מַעֲרָבָא וְעַי מִמַדִינְחָא וּבְנָא תַּמָן מַדְבְּחָא קֳּדָם יְיָ וְצַלִי בִּשְׁמָא דַיְיָ", "pj_en": "And he went up from thence to a mountain which was eastward of Bethel, and outspread his tent, having Bethel on the west and Ai on the east; and he builded there an altar before the Lord, and prayed in the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ויעתק משם.<\/b> אָהֳלוֹ:<br><br><b>מקדם לבית אל.<\/b> בְּמִזְרָחָהּ שֶׁל בֵּית אֵל נִמְצֵאת בֵּית אֵל בְּמַעֲרָבוֹ, הוּא שֶׁנֶּאֱמַר בֵּית אֵל מִיָּם:<br><br><b>אהלו.<\/b> אהלה כְתִיב, בַּתְּחִלָּה נָטָה אֶת אֹהֶל אִשְׁתּוֹ וְאַחַר כָּךְ אֶת שֶׁלּוֹ (בראשית רבה):<br><br><b>ויבן שם מזבח.<\/b> נִתְנַבֵּא שֶׁעֲתִידִין בָּנָיו לְהִכָּשֵׁל שָׁם עַל עֲוֹן עָכָן, וְהִתְפַּלֵּל שָׁם עֲלֵיהֶם:", "rashi_en": "ויעתק משם AND HE REMOVED FROM THERE — supply the word אהלו “his tent”.<br><br>מקדם לבית אל means ON THE EAST OF BETHEL. Consequently Bethel lay to his west, and that is what it states בית אל מים BETHEL ON THE WEST.<br><br>אהלה HIS TENT — This word is written with a ה suffixed instead of the usual ו so that it may read אָהֳלָהּ “her tent” to intimate that first he pitched a tent for his wife and afterwards one for himself (Genesis Rabbah 39:15).<br><br>ויבן שם מזבח AND HE BUILDED THERE AN ALTAR — He perceived by the gift of prophecy that his descendants would once stumble (fall into sin) there through Achan’s transgression (see, Joshua 7): therefore he prayed there for them (Genesis Rabbah 39:15). "}, {"ch": 12, "v": 9, "aliyah": 1, "heb": "וַיִּסַּ֣ע אַבְרָ֔ם הָל֥וֹךְ וְנָס֖וֹעַ הַנֶּֽגְבָּה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּנְטַל אַבְרָם אָזֵל וְנָטֵל לְדָרוֹמָא:", "onk_en": "Avram journeyed, traveling steadily southward.", "pj": "וּנְטַל אַבְרָם אָזִיל וְנָטִיל לְדָרוֹמָא", "pj_en": "And Abram migrated, going and migrating unto the south.", "tj": "", "tj_en": "", "rashi": "<b>הלוך ונסוע.<\/b> לִפְרָקִים יוֹשֵׁב כָּאן חֹדֶשׁ אוֹ יוֹתֵר, וְנוֹסֵעַ מִשָּׁם וְנוֹטֶה אָהֳלוֹ בְּמָקוֹם אַחֵר, וְכָל מַסָּעָיו הַנֶּגְבָּה, לָלֶכֶת לִדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל וְהִיא לְצַד יְרוּשָׁלַיִם, שֶׁהוּא בְּחֶלְקוֹ שֶׁל יְהוּדָה, שֶׁנָּטְלוּ בִּדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל לְהַר הַמּוֹרִיָּה שֶׁהִיא נַחֲלָתוֹ (בראשית רבה):", "rashi_en": "הלוך ונסוע GOING ON MORE AND MORE TOWARDS THE NEGEB — by stages: he stayed here a month or more, then travelled on and pitched his tent in another place. Yet all his journeys were towards the Negeb to proceed to the South of the land of Israel which is the direction where Jerusalem is — which is in the territory of Judah who had their portion in the South of the land of Israel — to Mount Moriah which is his (Judah’s) possession (cf. Genesis Rabbah 39:16). "}, {"ch": 12, "v": 10, "aliyah": 1, "heb": "וַיְהִ֥י רָעָ֖ב בָּאָ֑רֶץ וַיֵּ֨רֶד אַבְרָ֤ם מִצְרַ֙יְמָה֙ לָג֣וּר שָׁ֔ם כִּֽי־כָבֵ֥ד הָרָעָ֖ב בָּאָֽרֶץ׃", "onk": "וַהֲוָה כַפְנָא בְּאַרְעָא וּנְחַת אַבְרָם לְמִצְרַיִם לְאִתּוֹתָבָא תַמָּן אֲרֵי תַקִּיף כַּפְנָא בְּאַרְעָא:", "onk_en": "There was a famine in the land. Avram went down to Egypt to live there temporarily, for the famine was severe in the land.", "pj": "וַהֲוָה כַפְנָא בְּאַרְעָא וּנְחַת אַבְרָם לְמִצְרַיִם לְאִיתְיַתְבָא תַּמָן אֲרוּם תַּקִיף כַּפְנָא בְּאַרְעָא", "pj_en": "And there was a famine in the land, and Abram went down into Mizraim to be a dweller there, because the famine was strong in the land.", "tj": "", "tj_en": "", "rashi": "<b>רעב בארץ.<\/b> בְּאוֹתָהּ הָאָרֶץ לְבַדָּהּ, לְנַסּוֹתוֹ, אִם יְהַרְהֵר אַחַר דְּבָרָיו שֶׁל הַקָּבָּ\"ה שֶׁאָמַר לָלֶכֶת אֶל אֶרֶץ כְּנַעַן, וְעַכְשָׁו מַשִּׂיאוֹ לָצֵאת מִמֶּנָּה:", "rashi_en": "רעב בארץ A FAMINE IN THE LAND — in that land only to test him whether he would take exception to God’s commands in that He had bidden him to go to the land of Canaan and now forced him to leave it (Pirkei D'Rabbi Eliezer 26)."}, {"ch": 12, "v": 11, "aliyah": 1, "heb": "וַיְהִ֕י כַּאֲשֶׁ֥ר הִקְרִ֖יב לָב֣וֹא מִצְרָ֑יְמָה וַיֹּ֙אמֶר֙ אֶל־שָׂרַ֣י אִשְׁתּ֔וֹ הִנֵּה־נָ֣א יָדַ֔עְתִּי כִּ֛י אִשָּׁ֥ה יְפַת־מַרְאֶ֖ה אָֽתְּ׃", "onk": "וַהֲוָה כַּד (<small>נ\"י<\/small> אַרֵי) קְרֵיב לְמֵיעַל לְמִצְרָיִם וַאֲמַר לְשָׂרַי אִתְּתֵיהּ הָא כְעַן יְדָעִית אֲרֵי אִתְּתָא שַׁפִּירַת חֵיזוּ אָתְּ:", "onk_en": "As he came near and was about to enter Egypt, he said to his wife Sarai, Behold, I now realize that you are a woman of beautiful appearance.", "pj": "וַהֲוָה כְּמָא דְקָרֵיב לְמֵיעַל לִתְּחוּם מִצְרַיִם וּמָטוּ לְנַהֲרָא וּגְלִיאוּ בִּשְרֵיהוֹן לְמַעֲבַר וַאֲמַר אַבְרָם לְשָרַי אִנְתָּתֵיהּ הָא עַד כְּדוֹן לָא אִסְתַּכְּלִית בִּבְשָרִיךְ וּכְדוֹן יַדְעִית אֲרוּם אִנְתְּתָא שַׁפִּירַת חֵיזוּ אַנְתְּ", "pj_en": "And it was, as he approached to enter the limit of Mizraim, and they had come to the river, and were uncovering their flesh to pass over, that Abram, said to Sara his wife, Behold, until this I have not beheld thy flesh; but now I know that thou art a woman of fair aspect.", "tj": "", "tj_en": "", "rashi": "<b>הנה נא ידעתי.<\/b> מִדְרַש אַגָּדָה עַד עַכְשָׁו לֹא הִכִּיר בָּהּ מִתּוֹךְ צְנִיעוּת שֶׁבִּשְׁנֵיהֶם, וְעַכְשָׁו הִכִּיר בָּה עַל יְדֵי מַעֲשֶׂה. דָּבָר אַחֵר, מִנְהַג הָעוֹלָם שֶׁעַל יְדֵי טֹרַח הַדֶּרֶךְ אָדָם מִתְבַּזֶּה, וְזֹאת עָמְדָה בְּיָפְיָהּ. וּפְשׁוּטוֹ שֶׁל מִקְרָא הִנֵּה נָא הִגִּיעַ הַשָּׁעָה שֶׁיֵּשׁ לִדְאֹג עַל יָפְיֵךְ, יָדַעְתִּי זֶה יָמִים רַבִּים כִּי יְפַת מַרְאֶה אַתְּ, וְעַכְשָׁו אָנוּ בָאִים בֵּין אֲנָשִׁים שְׁחֹרִים וּמְכֹעָרִים, אֲחֵיהֶם שֶׁל כּוּשִׁים, וְלֹא הֻרְגְּלוּ בְאִשָּׁה יָפָה; וְדוֹמֶה לוֹ הִנֶּה נָּא אֲדֹנַי סוּרוּ נָא (בר' י\"ט):", "rashi_en": "הנה נא ידעתי BEHOLD NOW I KNOW — The Midrashic explanation is: Until now he had not perceived her beauty owing to the extreme modesty of both of them; now, however, through this event, he became cognisant of it (Midrash Tanchuma, Lech Lecha 5). Another explanation: Usually, because of the exertion of travelling a person becomes uncomely, but she had retained her beauty (Genesis Rabbah 40:4). Still, the real sense of the text is this: Behold, now the time has come when I am anxious because of thy beauty. I have long known that thou art fair of appearance: but now we are travelling among black and repulsive people, brethren of the Ethiopians (Kushim), who have never been accustomed to see a beautiful woman. A similar example is, (Genesis 19:2) “Behold, now, my lords, turn aside I pray you.”)."}, {"ch": 12, "v": 12, "aliyah": 1, "heb": "וְהָיָ֗ה כִּֽי־יִרְא֤וּ אֹתָךְ֙ הַמִּצְרִ֔ים וְאָמְר֖וּ אִשְׁתּ֣וֹ זֹ֑את וְהָרְג֥וּ אֹתִ֖י וְאֹתָ֥ךְ יְחַיּֽוּ׃", "onk": "וִיהֵי כַּד יֶחֱזוּן יָתִיךְ מִצְרָאֵי וְיֵימְרוּן אִתְּתֵיהּ דָּא וְיִקְטְלוּן יָתִי וְיָתִיךְ יְקַיְמוּן:", "onk_en": "It will happen when the Egyptians see you that they will say: This is his wife. They will kill me and let you live.", "pj": "וִיהֵי אֲרוּם יִסְתַּכְּלוּן בִּיךְ מִצְרָאֵי וְיֶחְמוּן יַת שׁוּפְרֵיךְ וְיֵימְרוּן אִנְתְּתֵיהּ דָא וְיִקְטְלוּן יָתִי וְיָתָךְ יְקַיְמוּן", "pj_en": "It will be, therefore, when the Mizraee see thee, and view thy beauty, that they will say, This is his wife; and they will kill me, and thee will keep alive.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 13, "aliyah": 1, "heb": "אִמְרִי־נָ֖א אֲחֹ֣תִי אָ֑תְּ לְמַ֙עַן֙ יִֽיטַב־לִ֣י בַעֲבוּרֵ֔ךְ וְחָיְתָ֥ה נַפְשִׁ֖י בִּגְלָלֵֽךְ׃", "onk": "אִמְרִי <b>כְעַן<\/b> אֲחָתִי אָתְּ בְּדִיל דְּיֵיטַב לִי בְּדִילָךְ וְתִתְקַיֵּם נַפְשִׁי <b>בְּפִתְגָּמָיְכִי<\/b>:", "onk_en": "Please [<i>Now<\/i>] say [therefore] that you are my sister, so that it will go well with me for your sake, and my life will be spared because of you [<i>through your words<\/i>].", "pj": "אִמְרִי בְּבָעוּ דַאֲחָתִי אַנְתְּ בְּגִין דְיֵיטִיב לִי בְּגִינָךְ וְתִתְקַיֵים נַפְשִׁי אַמְטוּלְתִּיךְ", "pj_en": "Say, I pray, that thou art my sister, that it may be well with me for thy sake, and that my life may be spared on thy account.", "tj": "", "tj_en": "", "rashi": "<b>למען ייטב לי בעבורך.<\/b> יִתְּנוּ לִי מַתָּנוֹת:", "rashi_en": "למען ייטב לי בעבורך THAT IT MAY BE WELL WITH ME FOR THY SAKE — they may give me presents. "}, {"ch": 12, "v": 14, "aliyah": 2, "heb": "וַיְהִ֕י כְּב֥וֹא אַבְרָ֖ם מִצְרָ֑יְמָה וַיִּרְא֤וּ הַמִּצְרִים֙ אֶת־הָ֣אִשָּׁ֔ה כִּֽי־יָפָ֥ה הִ֖וא מְאֹֽד׃", "onk": "וַהֲוָה כַּד עַל אַבְרָם לְמִצְרָיִם וַחֲזוֹ מִצְרָאֵי יָת אִתְּתָא אֲרֵי שַׁפִּירָא הִיא לַחֲדָא:", "onk_en": "And it was when Avram was entering Egypt, that the Egyptians beheld the woman, because she was very beautiful.", "pj": "וַהֲוָה כַּד עַל אַבְרָם לְמִצְרַיִם וְחָמוּן מִצְרָאֵי יַת אִנְתְּתָא אֲרוּם שַׁפִּירָא הִיא לַחֲדָא", "pj_en": "And it was when Abram had entered Mizraim, the Mizraee saw the woman to be very fair;", "tj": "", "tj_en": "", "rashi": "<b>ויהי כבוא אברם מצרימה.<\/b> הָיָה לוֹ לוֹמַר כְּבוֹאָם מִצְרַיְמָה? אֶלָּא לִמֵּד שֶׁהִטְמִין אוֹתָהּ בְּתֵבָה, וְעַל יְדֵי שֶׁתָּבְעוּ אֶת הַמֶּכֶס פָּתְחוּ וְרָאוּ אוֹתָהּ:", "rashi_en": "ויהי כבא אברם מצרימה AND IT CAME TO PASS WHEN ABRAM WAS COME INTO EGYPT —It should have said, “when they were come into Egypt”; but the use of the singular teaches us that he hid her in a chest, and when they demanded the custom dues they opened it and discovered her (Genesis Rabbah 40:5). "}, {"ch": 12, "v": 15, "aliyah": 2, "heb": "וַיִּרְא֤וּ אֹתָהּ֙ שָׂרֵ֣י פַרְעֹ֔ה וַיְהַֽלְל֥וּ אֹתָ֖הּ אֶל־פַּרְעֹ֑ה וַתֻּקַּ֥ח הָאִשָּׁ֖ה בֵּ֥ית פַּרְעֹֽה׃", "onk": "וַחֲזוֹ יָתַהּ רַבְרְבֵי פַרְעֹה וְשַׁבָּחוּ יָתַהּ לְפַרְעֹה וְאִדַּבָּרַת אִתְּתָא לְבֵית פַּרְעֹה:", "onk_en": "Pharaoh’s officials saw her and praised her to Pharaoh. The woman was taken to Pharaoh’s house.", "pj": "וְחָמוּן יָתָהּ רַבְרְבֵי פַּרְעה וְשַׁבָּחוּ יָתֵהּ לְפַרְעה וְאִידְבָּרַת אִנְתְּתָא לְבֵית מַלְכוּתָא דְפַרְעה", "pj_en": "and the princes of Pharoh beheld her, and praised her to Pharoh; and the woman was conducted to the royal house of Pharoh.", "tj": "וְאִידְבָּרַת אִתְּתָא לְפַלְטִין דְפַרְעה:", "tj_en": "And the woman was conducted to the palace of Pharoh.", "rashi": "<b>ויהללו אותה אל פרעה.<\/b> הִלְּלוּהָ בֵינֵיהֶם לוֹמַר הֲגוּנָה זוֹ לַמֶּלֶךְ:", "rashi_en": "ויהללו אותה אל פרעה AND THEY PRAISED HER TO PHARAOH — They praised her among themselves saying, “This woman is worthy of the king (i. e. they praised her as being suitable אל פרעה for Pharaoh)."}, {"ch": 12, "v": 16, "aliyah": 2, "heb": "וּלְאַבְרָ֥ם הֵיטִ֖יב בַּעֲבוּרָ֑הּ וַֽיְהִי־ל֤וֹ צֹאן־וּבָקָר֙ וַחֲמֹרִ֔ים וַעֲבָדִים֙ וּשְׁפָחֹ֔ת וַאֲתֹנֹ֖ת וּגְמַלִּֽים׃", "onk": "וּלְאַבְרָם אוֹטִיב בְּדִילַהּ וַהֲווֹ לֵיהּ עָאן וְתוֹרִין וַחֲמָרִין וְעַבְדִין וְאַמְהָן וְאַתְנָן וְגַמְלִין:", "onk_en": "He treated Avram well for her sake. He thus acquired sheep, oxen, donkeys, male and female slaves, female donkeys and camels.", "pj": "וּלְאַבְרָם אוֹטֵב פַּרְעה בְּגִינָהּ וַהֲווֹ לֵיהּ מִדִילֵיהּ עָאן וְתוֹרִין וְחַמְרִין וְעַבְדִין וְאַמְהָן וְאַתְנָן וּגְמַלִין", "pj_en": "And Pharoh did good to Abram for her sake; and he had sheep, and oxen, and asses, and servants, and handmaids, and she-asses, and camels.", "tj": "", "tj_en": "", "rashi": "<b>ולאברם היטיב.<\/b> פַּרְעֹה <b>בעבורה<\/b>:", "rashi_en": "ולאברם הטיב בעבורה AND TO ABRAM HE DEALT WELL — he means Pharaoh — בעבורה FOR HER SAKE. "}, {"ch": 12, "v": 17, "aliyah": 2, "heb": "וַיְנַגַּ֨ע יְהֹוָ֧ה&thinsp;<small>׀<\/small>&thinsp;אֶת־פַּרְעֹ֛ה נְגָעִ֥ים גְּדֹלִ֖ים וְאֶת־בֵּית֑וֹ עַל־דְּבַ֥ר שָׂרַ֖י אֵ֥שֶׁת אַבְרָֽם׃", "onk": "<b>וְאַיְתִי<\/b> יְיָ <b>עַל<\/b> פַּרְעֹה מַכְתָּשִׁין רַבְרְבִין וְעַל אֱנַשׁ בֵּיתֵיהּ עַל עֵיסַק שָׂרַי אִתַּת אַבְרָם:", "onk_en": "Adonoy afflicted Pharaoh with severe plagues [<i>brought severe plagues upon Pharaoh<\/i>], and also his household, because of Sarai, Avram’s wife.", "pj": "וְגָרֵי מֵימְרָא דַיְיָ בְּפַרְעה מַכְתְּשִׁין רַבְרְבִין וְיַת אֵינַשׁ בֵּיתֵיהּ עַל עֵיסַק שָרַי אִתַּת אַבְרָם", "pj_en": "And the Word of the Lord sent great plagues against Pharoh and the men of his house, on account of Sara, Abram's wife.", "tj": "", "tj_en": "", "rashi": "<b>וינגע ה' וגו'.<\/b> בְּמַכַּת רָאתָן לָקָה, שֶׁהַתַּשְׁמִישׁ קָשֶׁה לוֹ (בראשית רבה):<br><br>(<b>ואת ביתו<\/b> כְּתַרְגּוּמוֹ וְעַל אֱנַשׁ בֵּיתֵהּ וּמִדְרָשׁוֹ לְרַבּוֹת כֹּתָלָיו וְעַמּוּדָיו וְכֵּלָיו בְּרַשִׁ\"י יָשָׁן):<br><br><b>על דבר שרי.<\/b> עַל פִּי דִּבּוּרָהּ; אוֹמֶרֶת לַמַּלְאָךְ הַךְ, וְהוּא מַכֶּה;", "rashi_en": "'וינגע ה' וגו AND THE LORD PLAGUED PHARAOH etc. — He was smitten with the disease of Raathon for which marital relations are harmful.<br><br>ואת ביתו AND HIS HOUSE — Take it as the Targum has it: “and the people of his house”. A Midrashic explanation is: the word את is used here to imply that included in the curse were also its walls, pillars and its utensils (Midrash Tanchuma, Lech Lecha 5). The whole of this explanation of ואת ביתו is given in an old text of Rashi.<br><br>על דבר שרי BECAUSE OF SARAI (literally, by the word of Sarai) — at her orders: she said to the angel “Smite” and he smote (Midrash Tanchuma, Lech Lecha 5)."}, {"ch": 12, "v": 18, "aliyah": 2, "heb": "וַיִּקְרָ֤א פַרְעֹה֙ לְאַבְרָ֔ם וַיֹּ֕אמֶר מַה־זֹּ֖את עָשִׂ֣יתָ לִּ֑י לָ֚מָּה לֹא־הִגַּ֣דְתָּ לִּ֔י כִּ֥י אִשְׁתְּךָ֖ הִֽוא׃", "onk": "וּקְרָא פַרְעֹה לְאַבְרָם וַאֲמַר מָה דָא עֲבַדְתְּ לִי לְמָא לָא חַוֵּיתָא לִי אֲרֵי אִתְּתָךְ הִיא:", "onk_en": "Pharaoh summoned Avram and said: What is this that you have done to me? Why did you not tell me that she is your wife?", "pj": "וּקְרָא פַּרְעה לְאַבְרָם וַאֲמַר מַה דָא עָבַדְתָּא לִי לְמָא לָא חַוֵיתָא לִי אֲרוּם אִנְתְּתָךְ הִיא", "pj_en": "And Pharoh called Abram, and said, What is this that thou hast done to me? Why didst thou not show me that she is thy wife?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 12, "v": 19, "aliyah": 2, "heb": "לָמָ֤ה אָמַ֙רְתָּ֙ אֲחֹ֣תִי הִ֔וא וָאֶקַּ֥ח אֹתָ֛הּ לִ֖י לְאִשָּׁ֑ה וְעַתָּ֕ה הִנֵּ֥ה אִשְׁתְּךָ֖ קַ֥ח וָלֵֽךְ׃", "onk": "לְמָא אֲמַרְתְּ אֲחָתִי הִיא וּדְבָרִית יָתַהּ לִי לְאִתּוּ וּכְעַן הָא אִתְּתָךְ דְּבַר וְאִיזֵיל:", "onk_en": "Why did you say, She is my sister, so that I should take her to myself for a wife? Now here is your wife, take [her] and go.", "pj": "לָמָה אָמַרְתָּ אֲחָתִי הִיא וּדְבָרִית יָתָהּ לִי לְאִנְתּוּ וּמִן יַד אִתְגְרִיאַת בִּי מַכְתָּשָׁא וְלָא קָרֵיבִית לְוָתָהּ וּכְדוֹן הָא אִנְתְּתָךְ דְבַר וְאִיזַל", "pj_en": "Why saidst thou, She is my sister? When I would take her to me to wife, plagues were at once sent against me, and I went not unto her. And now behold thy wife, take (her) and go.", "tj": "", "tj_en": "", "rashi": "<b>קח ולך.<\/b> לֹא כַאֲבִימֶלֶךְ שֶׁאָמַר לוֹ הִנֵּה אַרְצִי לְפָנֶיךָ, אֶלָּא אָמַר לוֹ לֵךְ וְאַל תַּעֲמֹד, שֶׁהַמִּצְרִים שְׁטוּפֵי זִמָּה הֵם, שֶׁנֶּאֱמַר וְזִרְמַת סוּסִים זִרְמָתָם: (יחזקאל כ\"ג):", "rashi_en": "קח ולך TAKE HER AND GO AWAY — Not as Abimelech who said to him (Genesis 20:15) “Behold, my land is before thee; dwell wherever it seemeth proper to thee”: but he (Pharaoh) said to him, “Go and do not stay here,” for the Egyptians are greatly addicted to lewd-living, as it is said. (Ezekiel 23:20). “And whose issue is like the issue of horses” (Midrash Tanchuma, Lech Lecha 5). (The passage deals with the immoral practices of the Egyptians)."}, {"ch": 12, "v": 20, "aliyah": 2, "heb": "וַיְצַ֥ו עָלָ֛יו פַּרְעֹ֖ה אֲנָשִׁ֑ים וַֽיְשַׁלְּח֥וּ אֹת֛וֹ וְאֶת־אִשְׁתּ֖וֹ וְאֶת־כׇּל־אֲשֶׁר־לֽוֹ׃", "onk": "וּפַקֵּיד עֲלוֹהִי פַּרְעֹה גּוּבְרִין וְאַלְוִיאוּ יָתֵיהּ וְיָת אִתְּתֵיהּ וְיָת כָּל דִּילֵיהּ:", "onk_en": "Pharaoh assigned men to him and they escorted him and his wife and all that was his.", "pj": "וּפַקֵיד עִילוֹי פַרְעה גוּבְרִין וְאַלְוִיאוּ יָתֵיהּ וְיַת אִנְתְּתֵיהּ וְיַת כָּל דִילֵיהּ", "pj_en": "And Pharoh commanded men concerning him, and they led him forth, and his wife, and all that he had.", "tj": "", "tj_en": "", "rashi": "<b>ויצו עליו.<\/b> עַל אוֹדוֹתָיו, לְשַׁלְּחוֹ וּלְשָׁמְרוֹ:<br><br><b>וישלחו.<\/b> כְּתַרְגּוּמוֹ וְאַלְוִיאוּ:", "rashi_en": "ויצו עליו AND PHARAOH GAVE COMMAND CONCERNING HIM— עליו means for his sake — to escort him and to protect him.<br><br>וישלחו AND THEY ACCOMPANIED HIM — as the Targum has it: they gave him an escort.) "}, {"ch": 13, "v": 1, "aliyah": 2, "heb": "וַיַּ֩עַל֩ אַבְרָ֨ם מִמִּצְרַ֜יִם ה֠וּא וְאִשְׁתּ֧וֹ וְכׇל־אֲשֶׁר־ל֛וֹ וְל֥וֹט עִמּ֖וֹ הַנֶּֽגְבָּה׃", "onk": "וּסְלִיק אַבְרָם מִמִּצְרַיִם הוּא וְאִתְּתֵיהּ וְכָל דִּילֵיהּ וְלוֹט עִמֵּיהּ לְדָרוֹמָא:", "onk_en": "Avram went up from Egypt; he, his wife, and all that he had, together with Lot into the south.", "pj": "וּסְלֵיק אַבְרָם מִמִצְרַיִם הוּא וְאִנְתְּתֵיהּ וְכָל דִילֵיהּ וְלוֹט עִמֵיהּ לְמֵיעַל לְדָרוֹמָא", "pj_en": "And Abram went up from Mizraim, he and his wife (and) all that he had; and Lot with him, to go to the south.", "tj": "", "tj_en": "", "rashi": "<b>ויעל אברם וגו' הנגבה.<\/b> לָבֹא לִדְרוֹמָהּ שֶׁל אֶרֶץ יִשְֹרָאֵל, כְּמוֹ שֶׁאָמַר לְמַעְלָה הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה, לְהַר הַמּוֹרִיָּה; וּמִכָּל מָקוֹם כְּשֶׁהוּא הוֹלֵךְ מִמִּצְרַיִם לְאֶרֶץ כְּנַעַן, מִדָּרוֹם לְצָפוֹן הוּא מְהַלֵּךְ, שֶׁאֶרֶץ מִצְרַיִם בִּדְרוֹמָהּ שֶׁל אֶרֶץ יִשְׂרָאֵל כְּמוֹ שֶׁמּוֹכִיחַ בַּמַּסָּעוֹת וּבִגְבוּלֵי הָאָרֶץ:", "rashi_en": "ויעל אברם וגו' הנגבה AND ABRAM WENT UP [OUT OF EGYPT] …TOWARDS THE NEGEB — He went up to proceed to the Southern part of the land of Israel — as it is said above (Genesis 12:9) “going on more and more to the Negeb” — to the Mount Moriah. Still, when one goes from Egypt to the land of Canaan, one proceeds from South to North, because Egypt is to the South of the land of Israel, as may be proved from the account of the journeys that the Israelites made in the wilderness and from the description of the boundaries of the land of Israel (see Numbers 33 and Numbers 34)."}, {"ch": 13, "v": 2, "aliyah": 2, "heb": "וְאַבְרָ֖ם כָּבֵ֣ד מְאֹ֑ד בַּמִּקְנֶ֕ה בַּכֶּ֖סֶף וּבַזָּהָֽב׃", "onk": "וְאַבְרָם תַּקִּיף לַחֲדָא בִּבְעִירָא בְּכַסְפָּא וּבְדַהֲבָא:", "onk_en": "Avram was very wealthy in livestock, silver and gold.", "pj": "וְאַבְרָם תַּקִיף לַחֲדָא בְּגֵיתֵי בְּכַסְפָּא וּבְדַהֲבָא", "pj_en": "And Abram had become very strong in cattle, in silver, and in gold.", "tj": "", "tj_en": "", "rashi": "<b>כבד מאד.<\/b> טָעוּן מַשָּׂאוֹת:", "rashi_en": "כבד מאד VERY RICH (literally, very heavy) — heavily laden with burdens. "}, {"ch": 13, "v": 3, "aliyah": 2, "heb": "וַיֵּ֙לֶךְ֙ לְמַסָּעָ֔יו מִנֶּ֖גֶב וְעַד־בֵּֽית־אֵ֑ל עַד־הַמָּק֗וֹם אֲשֶׁר־הָ֨יָה שָׁ֤ם <span class=\"mam-kq-trivial\">אׇֽהֳלֹה֙<\/span> בַּתְּחִלָּ֔ה בֵּ֥ין בֵּֽית־אֵ֖ל וּבֵ֥ין הָעָֽי׃", "onk": "וַאֲזַל לְמַטְלָנוֹהִי מִדָּרוֹמָא וְעַד בֵּית אֵל עַד אַתְרָא דִּי <b>פְרַס<\/b> תַּמָּן מַשְׁכְּנֵיהּ בְּקַדְמֵיתָא בֵּין בֵּית אֵל וּבֵין עָי:", "onk_en": "He continued on his travels from the south to Beis-Eil, until the place where he originally had [<i>set up<\/i>] his tent, between Beis-Eil and Ai.", "pj": "וְאָזַל לְמַטְלוֹנוֹהִי מִדָרוֹמָא וְעַד בֵּית אֵל וְתַב עַד אַתְרָא דְפַרְסֵיהּ תַּמָן לְמַשְׁכְּנֵיהּ מִן אַוְולָא בֵּין בֵּית אֵל וּבֵין עָי", "pj_en": "And he proceeded in his journeyings from the south unto Bethel, and returned to the place where he had outspread his tabernacle at the first, between Bethel and Ai,", "tj": "", "tj_en": "", "rashi": "<b>וילך למסעיו.<\/b> כְּשֶׁחָזַר מִמִּצְרַיִם לְאֶרֶץ כְּנַעַן הָיָה הוֹלֵךְ וְלָן בָּאַכְסַנְיוֹת שֶׁלָּן בָּהֶם בַּהֲלִיכָתוֹ לְמִצְרַיִם, לִמֶּדְךָ דֶּרֶך אֶרֶץ, שֶׁלֹּא יְשַׁנֶּה אָדָם מֵאַכְסַנְיָא שֶׁלּוֹ. דָּבָר אַחֵר בַּחֲזָרָתוֹ פָּרַע הַקָּפוֹתָיו (בראשית רבה):<br><br><b>מנגב.<\/b> אֶרֶץ מִצְרַיִם בִּדְרוֹמָהּ שֶׁל אֶרֶץ כְּנַעַן:", "rashi_en": "וילך למסעיו AND HE WENT ON HIS JOURNEYS — When he returned from Egypt to the land of Canaan he went and lodged in the same inns as he had stayed when he travelled to Egypt. This teaches you good manners: that one should not change his inn (Arachin 16b); (where the reason is given that one who does this constantly brings discredit on himself and on others). Another interpretation: on his return he paid the debts he had previously incurred (Genesis Rabbah 41:3). (In both these comments emphasis is placed on “his” — he went on his journeys i.e. the routes he had taken before.)<br><br>מנגב FROM THE SOUTH — the land of Egypt lies to the South of the land of Canaan. "}, {"ch": 13, "v": 4, "aliyah": 2, "heb": "אֶל־מְקוֹם֙ הַמִּזְבֵּ֔חַ אֲשֶׁר־עָ֥שָׂה שָׁ֖ם בָּרִאשֹׁנָ֑ה וַיִּקְרָ֥א שָׁ֛ם אַבְרָ֖ם בְּשֵׁ֥ם יְהֹוָֽה׃", "onk": "לַאֲתַר מַדְבְּחָא דִּי עֲבַד תַּמָּן בְּקַדְמֵיתָא <b>וְצַלִּי<\/b> תַמָּן אַבְרָם בִּשְׁמָא דַיְיָ:", "onk_en": "To the site of the altar which he made there at first; and there Avram called [<i>prayed<\/i>] in the Name of Adonoy.", "pj": "לַאֲתַר מַדְבְּחָא דְעָבַר תַּמָן בְּשֵׁירוּיָה וְצַלִי תַּמָן אַבְרָם בִּשְׁמָא דַיְיָ", "pj_en": "to the place of the altar which he had made there at the beginning; and Abram prayed there in the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>אשר עשה שם בראשנה.<\/b> וַאֲשֶׁר קָרָא שָׁם אַבְרָם בְּשֵׁם ה' וְגַם יֵשׁ לוֹמַר וַיִּקְרָא שָׁם עַכְשָׁו בְּשֵׁם ה':", "rashi_en": "אשר עשה שם בראשונה [UNTO THE PLACE OF THE ALTAR] WHICH HE HAD MADE THERE AT THE FIRST and WHERE ABRAM HAD CALLED [UPON THE NAME OF THE LORD] (that is, ויקרא does not introduce a further action of Abram done at that time, but refers to a former one when he had called upon the Name of the Lord); but it may also be explained that it means that Abram now called there upon the Name of the Lord. "}, {"ch": 13, "v": 5, "aliyah": 3, "heb": "וְגַ֨ם־לְל֔וֹט הַהֹלֵ֖ךְ אֶת־אַבְרָ֑ם הָיָ֥ה צֹאן־וּבָקָ֖ר וְאֹהָלִֽים׃", "onk": "וְאַף לְלוֹט דְּאָזֵיל עִם אַבְרָם הֲוָה עָאן וְתוֹרִין וּמַשְׁכְּנִין:", "onk_en": "Lot who accompanied Avram also had sheep, cattle and tents.", "pj": "וְאוּף לְלוֹט דַהֲוָה מִדְבַּר בִּזְכוּתֵיהּ דְאַבְרָם הֲווֹ עָאן וְתוֹרִין וּמַשְׁכְּנִין", "pj_en": "And also unto Lot, who was remembered through the righteousness of Abram, there were sheep and oxen and tents.", "tj": "", "tj_en": "", "rashi": "<b>ההלך את אברם.<\/b> מִי גָרַם שֶׁהָיָה לוֹ זֹאת? הֲלִיכָתוֹ עִם אַבְרָם:", "rashi_en": "ההלך את אברם WHO WENT WITH ABRAM — What brought it about that he possessed all this? The fact that he was accompanying Abram (Genesis Rabbah 41:3; Pesikta Rabbati, שמיני). "}, {"ch": 13, "v": 6, "aliyah": 3, "heb": "וְלֹא־נָשָׂ֥א אֹתָ֛ם הָאָ֖רֶץ לָשֶׁ֣בֶת יַחְדָּ֑ו כִּֽי־הָיָ֤ה רְכוּשָׁם֙ רָ֔ב וְלֹ֥א יָֽכְל֖וּ לָשֶׁ֥בֶת יַחְדָּֽו׃", "onk": "וְלָא סוֹבָרַת יָתְהוֹן אַרְעָא לְמִיתַב כַּחֲדָא אֲרֵי הֲוָה קִנְיָנְהוֹן סַגִּי וְלָא יְכִילוּ לְמִיתַב כַּחֲדָא:", "onk_en": "The land was unable to support them that they might dwell together, for their wealth was so great that they were unable to dwell together.", "pj": "וְלָא סוֹבָרַת יַתְהוֹם אַרְעָא לְמֵיתַב כַּחֲדָא אֲרוּם הֲוָה קִנְיָנֵהוֹן סַגִי וְלָא יָכִילוּ לְמֵיתַב כַּחֲדָא", "pj_en": "And the land could not sustain them to dwell together, because their possessions were great, and they were not able to dwell together.", "tj": "סְגוּלַתְהוֹן:", "tj_en": "Their treasures.", "rashi": "<b>ולא נשא אתם.<\/b> לֹא הָיְתָה יְכוֹלָה לְהַסְפִּיק מִרְעֶה לְמִקְנֵיהֶם, וְלָשׁוֹן קָצָר הוּא, וְצָרִיךְ לְהוֹסִיף עָלָיו, כְּמוֹ וְלֹא נָשָׂא אוֹתָם מִרְעֵה הָאָרֶץ, לְפִיכָךְ כָּתַב וְלֹא נָשָׂא בִּלְשׁוֹן זָכָר:", "rashi_en": "ולא נשא אתם AND THE LAND WAS NOT ABLE TO BEAR THEM — It could not provide sufficient pasture for their cattle. The phrase is elliptical and a word must be supplied, for instance: the pasturage (מרעה) of the land was not able to bear them — for this reason the word נשא (masculine) is used (to agree in gender with מרעה; the suggestion is that נשא cannot have הארץ as subject since that noun is feminine). "}, {"ch": 13, "v": 7, "aliyah": 3, "heb": "וַֽיְהִי־רִ֗יב בֵּ֚ין רֹעֵ֣י מִקְנֵֽה־אַבְרָ֔ם וּבֵ֖ין רֹעֵ֣י מִקְנֵה־ל֑וֹט וְהַֽכְּנַעֲנִי֙ וְהַפְּרִזִּ֔י אָ֖ז יֹשֵׁ֥ב בָּאָֽרֶץ׃", "onk": "וַהֲוַת מַצּוּתָא בֵּין רָעֵי בְּעִירֵיהּ דְּאַבְרָם וּבֵין רָעֵי בְּעִירֵיהּ דְּלוֹט וּכְנַעֲנָאָה וּפְרִזָּאָה בְּכֵן יָתִיב בְּאַרְעָא:", "onk_en": "There was a quarrel between the herdsmen of Avram’s flocks and the herdsmen of Lot’s flocks. The Canaanites and the Perizzites were then living in the land.", "pj": "וַהֲוָה דַיָינִין בֵּין רִעָאֵי גֵיתֵיהּ דְאַבְרָם וּבֵין רִעָאֵי גֵיתֵיהּ דְלוֹט דִרְעָאֵי דְאַבְרָם הֲווֹ מִיפַקְדִין מִנֵיהּ לָא תֶהְכוּן בִּכְנַעֲנָאֵי וּבִפְרִיזָאֵי דְעַד כְּדוֹן אֵית לְהוֹם רְשׁוּתָא בְּאַרְעָא וַהֲווֹ זְמָמִין בְּעִירֵיהוֹן דְלָא יֵיכְלוּן גְזֵלָה עַד דַהֲווּ אַתְיָן לַאֲתַר מַרְעֵיהוֹן וְרָעֵי דְלוֹט הֲווֹ מְבַקְרִין וְאַזְלִין וְאָכְלִין בְּחַקְלֵי כְּנַעֲנָאֵי וּפְרִיזָאֵי דְעַד כְּדוֹן יַתְבִין בְּאַרְעָא", "pj_en": "And contentions arose between the shepherds of Abram's flock, and the shepherds of the flocks of Lot; for the shepherds of Abram had been instructed by him not to go among the Kenaanaee and the Pherizaee, who, as yet, had power in the land, and to restrain the cattle that they should make no depredation in going to the place of their pasture: but the shepherds of Lot would go and feed in the grounds of the Kenaanaee and Pherizaee who yet dwelt in the land.", "tj": "וַהֲוָה דַיָינִין בֵּין רַעֲוַיֵי נִכְסוֹי דְאַבְרָם וּבֵין רַעֲוַויֵי נִכְסוֹי דְלוֹט רַעֲוַיֵי דְאַבְרָם הֲווֹן זְמָמִין בְּעִירֵיהוֹן עַד זְמַן דַהֲווֹן אָתִין לַאֲתַר מִרְעֵי רַעֲוַויֵי דְלוֹט לָא הֲווֹן זְמָמִין בְּעִירֵהוֹן אֶלָא מְבַקְרִין וְאַזְלִין בְּרַם מְפוּקָדִין הֲווֹן רַעֲוֵי דְאַבְרָם מִן אַבְרָם צַדִיקָא רִיבּוֹנֵיהוֹן לָא תַהֲכוּן לִכְּנַעֲנָאֵי וְלִפְרִיזָאֵי עַד כְּעַן אִית לְהוֹן רְשׁוּ בְּאַרְעָא:", "tj_en": "And there was strife between the shepherds of Abram's cattle and the shepherds of the cattle of Lot. The shepherds of Abram restrained their beasts until the time of their coming to the place of their pasture; but the shepherds of Lot did not restrain their beasts, but turned them free, and went. But Abram's shepherds had been instructed by Abram their righteous master, Go not to the Kenaanaee and Pherizaee; for as yet they have possession in the land.", "rashi": "<b>ויהי ריב.<\/b> לְפִי שְׁהָיוּ רוֹעִים שֶׁל לוֹט רְשָׁעִים וּמַרְעִים בְּהֶמְתָּם בִּשְׂדוֹת אֲחֵרִים, וְרוֹעֵי אַבְרָם מוֹכִיחִים אוֹתָם עַל הַגֶּזֶל, וְהֵם אוֹמְרִים נִתְּנָה הָאָרֶץ לְאַבְרָם, וְלוֹ אֵין יוֹרֵשׁ, וְלוֹט יוֹרְשׁוֹ, וְאֵין זֶה גֶּזֶל, וְהַכָּתוּב אוֹמֵר וְהַכְּנַעֲנִי וְהַפְּרִזִּי אָז יֹשֵׁב בָּאָרֶץ, וְלֹא זָכָה בָהּ אַבְרָם עֲדַיִן (ב\"):", "rashi_en": "ויהי ריב AND THERE WAS A QUARREL because Lot’s shepherds were wicked men and grazed their cattle in other people’s fields. Abram's shepherds rebuked them for this act of robbery, but they replied, “The land has been given to Abram, and since he has no son as heir, Lot will be his heir: consequently this is not robbery”. Scripture, however, states: “The Canaanite and the Perizzite abode then in the land”, so that Abram was not yet entitled to possession (Genesis Rabbah 41:5). "}, {"ch": 13, "v": 8, "aliyah": 3, "heb": "וַיֹּ֨אמֶר אַבְרָ֜ם אֶל־ל֗וֹט אַל־נָ֨א תְהִ֤י מְרִיבָה֙ בֵּינִ֣י וּבֵינֶ֔ךָ וּבֵ֥ין רֹעַ֖י וּבֵ֣ין רֹעֶ֑יךָ כִּֽי־אֲנָשִׁ֥ים אַחִ֖ים אֲנָֽחְנוּ׃", "onk": "וַאֲמַר אַבְרָם לְלוֹט לָא <b>כְעַן<\/b> תְּהֵי מַצּוּתָא בֵּינָא וּבֵינָךְ וּבֵין רַעֲוָתִי וּבֵין רַעֲוָתָךְ אֲרֵי גוּבְרִין אַחִין אֲנָחְנָא:", "onk_en": "Avram said to Lot: Please [<i>Now<\/i>], let there not be strife between me and you, and between my herdsmen and your herdsmen, for we are kinsmen.", "pj": "וַאֲמַר אַבְרָם לְלוֹט לָא כְעַן תְּהֵי מַצוּתָא בֵּינָא וּבֵינָךְ וּבֵין רַעֲוָותִי וּבֵין רַעֲוָותָךְ אֲרוּם גוּבְרִין אָחִין אֲנַחְנָא", "pj_en": "And Abram said to Lot, Between me and thee let there not now be controversy, nor between my shepherds and thy shepherds; for we are brother-men.", "tj": "", "tj_en": "", "rashi": "<b>אנשים אחים.<\/b> קְרוֹבִים, וּמִדְרַשׁ אַגָּדָה דּוֹמִין בִּקְלַסְתֵּר פָּנִים:", "rashi_en": "אנשים אחים BROTHERS — i. e. kinsmen. The Midrashic explanation is: that they resembled each other in their facial features (Genesis Rabbah 41:6). "}, {"ch": 13, "v": 9, "aliyah": 3, "heb": "הֲלֹ֤א כׇל־הָאָ֙רֶץ֙ לְפָנֶ֔יךָ הִפָּ֥רֶד נָ֖א מֵעָלָ֑י אִם־הַשְּׂמֹ֣אל וְאֵימִ֔נָה וְאִם־הַיָּמִ֖ין וְאַשְׂמְאִֽילָה׃", "onk": "הֲלָא כָל אַרְעָא קֳדָמָךְ אִתְפְּרַשׁ <b>כְּעַן<\/b> מִלְּוָתִי אִם אַתְּ <b>לְצִפּוּנָא<\/b> וַאֲנָא <b>לְדָרוֹמָא<\/b> וְאִם אַתְּ <b>לְדָרוֹמָא<\/b> וַאֲנָא <b>לְצִפּוּנָא<\/b>:", "onk_en": "Is not all the land before you? Please [<i>Now<\/i>] separate from me, if [you go] to the left [<i>north<\/i>], I [will go] to the right [<i>south<\/i>], and if [you go] to the right [<i>south<\/i>], I [will go] to the left [<i>north<\/i>].", "pj": "הֲלָא כָל אַרְעָא קֳדָמָךְ אִתְפָּרַשׁ כְּדוּן מִינִי אִם אַנְתְּ לְצִיפוּנָא וַאֲנָא לְדָרוֹמָא אִם אַנְתְּ לְדָרוֹמָא וַאֲנָא לְצִיפּוּנָא", "pj_en": "Is not all the land before thee? Separate then from me. If thou to the north, I to the south: if thou to the south, I to the north.", "tj": "", "tj_en": "", "rashi": "<b>אם השמאל ואימנה.<\/b> בְּכָל אֲשֶׁר תֵּשֵׁב, לֹא אֶתְרַחֵק מִמְּךָ וְאֶעֱמֹד לְךָ לְמָגֵן וּלְעֵזֶר, וְסוֹף דָּבָר הֻצְרַךְ לוֹ, שְׁנֶּאֱמַר וַיִּשְׁמַע אַבְרָם כִּי נִשְׁבָּה אָחִיו וְגוֹ':<br><br><b>ואימנה.<\/b> אַיְמִין אֶת עַצְמִי, כְּמוֹ וְאַשְׂמְאִילָה אַשְׂמְאִיל אֶת עַצְמִי. וְאִם תֹּאמַר הָיָה לוֹ לִנָּקֵד וְאַיְמִינָה, כָּךְ מָצִינוּ בְּמָקוֹם אַחֵר אִם יֵשׁ לְהֵמִין (שמואל ב י\"ד) וְאֵין נָקוּד לְהַיְמִין:", "rashi_en": "אם השמאל ואימינה IF THOU WILT TAKE THE LEFT HAND, THAN I WILL GO TO THE RIGHT —Wherever you settle down I will not go far from you and I will stand by you as a shield and as a helper. Ultimately, indeed, he (Lot) was really in need of him, as it is said, (Genesis 14:14) “And Abram heard that his brother was taken captive etc.”<br><br>ואימינה I WILL GO TO THE RIGHT — The word means “I will direct myself towards the right”, just as ואשמאילה means “I will direct myself towards the left.” If you say that it should be punctuated וְאַיְמִינָה (the regular Hiphil form) I answer that in another place also we find this form, (2 Samuel 14:19) אם יש לְהֵמִין “none can turn to the right hand”, where the punctuation is not לְהַיְמִין."}, {"ch": 13, "v": 10, "aliyah": 3, "heb": "וַיִּשָּׂא־ל֣וֹט אֶת־עֵינָ֗יו וַיַּרְא֙ אֶת־כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן כִּ֥י כֻלָּ֖הּ מַשְׁקֶ֑ה לִפְנֵ֣י&thinsp;<b>׀<\/b> שַׁחֵ֣ת יְהֹוָ֗ה אֶת־סְדֹם֙ וְאֶת־עֲמֹרָ֔ה כְּגַן־יְהֹוָה֙ כְּאֶ֣רֶץ מִצְרַ֔יִם בֹּאֲכָ֖ה צֹֽעַר׃", "onk": "וּזְקַף לוֹט יָת עֵינוֹהִי וַחֲזָא יָת כָּל מֵישַׁר יַרְדְּנָא אֲרֵי כֻלַּהּ <b>בֵּית<\/b> שַׁקְיָא קֳדָם חַבָּלוּת יְיָ יָת סְדוֹם וְיָת עֲמֹרָה כְּגִינְתָא דַיְיָ כְּאַרְעָא דְמִצְרַיִם מָטֵי לְצֹעַר:", "onk_en": "Lot raised his eyes and saw the entire Jordan Plain, that it was [<i>an<\/i>] abundantly watered [<i>place<\/i>]; before Adonoy destroyed Sedom and Amorah, it was like Adonoy’s garden, like the land of Egypt, going towards Zoar.", "pj": "וּזְקַף לוֹט יַת עֵינוֹי לִזְנוֹי וַחֲמָא יַת כָּל מֵישַׁר יַרְדְנָא אֲרוּם כּוּלָה בֵּית שַׁקְיָיא קֳדָם עַד לָא חַבֵּל יְיָ בְּרוּגְזֵיהּ יַת סְדוֹם וְיַת עֲמוֹרָה הֲוַת אַרְעָא הַהִיא מְשַׁבְּחָא בְּאִילָנַיָא כְּגִינוּנִיתָא דַיְיָ וּכְעִילָתָא כְאַרְעָא דְמִצְרַיִם מַעֲלָךְ לְצוֹעַר", "pj_en": "And Lot uplifted his eyes towards (the place of) fornication; and beheld all the plain of Jardena that it was altogether well watered, before the Lord in his wrath had destroyed Sedom and Amorah; a land admirable for trees, as the garden of the Lord, and for fruitage, as the land of Mizraim as thou goest up to Zoar.", "tj": "", "tj_en": "", "rashi": "<b>כי כלה משקה.<\/b> אֶרֶץ נַחֲלֵי מַיִם:<br><br><b>לפני שחת ה' את סדום ואת עמרה.<\/b> הָיָה אוֹתוֹ מִישׁוֹר:<br><br><b>כגן ה'.<\/b> לָאִילָנוֹת:<br><br><b>כארץ מצרים.<\/b> לַזְּרָעִים (בראשית רבה):<br><br><b>באכה צער.<\/b> עַד צֹעַר. וּמִדְרַשׁ אַגָּדָה דוֹרְשָׁהּ לִגְנַאי, עַל שֶׁהָיוּ שְׁטוּפֵי זִמָּה בָּחַר לוֹ לוֹט בִּשְׁכוּנָתָם:", "rashi_en": "כי כלה משקה THAT IT WAS WELL WATERED — a land of water-streams.<br><br>לפני שחת ה' את סדום ואת עמורה BEFORE THE LORD DESTROYED SODOM AND GOMORRAHH that land was<br><br>'כגן ה LIKE THE GARDEN OF GOD in respect of trees,<br><br>כארץ מצרים LIKE THE LAND OF EGYPT in respect of seed (vegetables) (Genesis Rabbah 41:7).<br><br>באכה צער means AS THOU GOEST עד צוער to Zoar. The Midrashic explanation (Horayot 10b; Genesis Rabbah 41:7) explains it to Lot’s discredit — just because they (the people of Sodom and Gomorrah) were addicted to lewdness did Lot choose their locality."}, {"ch": 13, "v": 11, "aliyah": 3, "heb": "וַיִּבְחַר־ל֣וֹ ל֗וֹט אֵ֚ת כׇּל־כִּכַּ֣ר הַיַּרְדֵּ֔ן וַיִּסַּ֥ע ל֖וֹט מִקֶּ֑דֶם וַיִּפָּ֣רְד֔וּ אִ֖ישׁ מֵעַ֥ל אָחִֽיו׃", "onk": "וּבְחַר לֵיהּ לוֹט יָת כָּל מֵישַׁר יַרְדְּנָא וּנְטַל לוֹט <b>מִלְּקַדְמִין<\/b> וְאִתַּפְרָשׁוּ גְּבַר מִלְּוַת אֲחוּהִי:", "onk_en": "Lot chose for himself the entire Jordan Plain; Lot journeyed from the east [<i>before<\/i>], and they separated one from another.", "pj": "וּבְחַר לֵיהּ לוֹט יַת כָּל מֵישַׁר יַרְדְנָא וּנְטַל לוֹט מִמַדִינְחָא וְאִיתְפַּרְשׁוּ אֵינַשׁ מֵעַל אָחוֹי", "pj_en": "And Lot chose to him all the plain of Jardena; and Lot journeyed from the east, and they separated the one man from his brother.", "tj": "", "tj_en": "", "rashi": "<b>ככר.<\/b> מִישׁוֹר, כְּתַרְגּוּמוֹ:<br><br><b>מקדם.<\/b> נָסַע מֵאֵצֶל אַבְרָם וְהָלַך לוֹ לְמַעֲרָבוֹ שֶׁל אַבְרָם; נִמְצָא נוֹסֵעַ מִמִּזְרָח לְמַעֲרָב. וּמִדְרַשׁ אַגָּדָה הִסִּיעַ עַצְמוֹ מִקַּדְמוֹנוֹ שֶׁל עוֹלָם; אָמַר אִי אֶפְשִׁי לֹא בְּאַבְרָם וְלֹא בֵאלֹהָיו:", "rashi_en": "ככר The word means “a plain” as the Targum translates it.<br><br>מקדם FROM THE EAST — He removed from Abram and went westward of Abram — consequently he travelled from the East to the West. A Midrashic explanation is: He wandered away from the Originator (מקדמונו) of the Universe, saying, “I want neither Abram nor his God” (Genesis Rabbah 41:7). "}, {"ch": 13, "v": 12, "aliyah": 3, "heb": "אַבְרָ֖ם יָשַׁ֣ב בְּאֶֽרֶץ־כְּנָ֑עַן וְל֗וֹט יָשַׁב֙ בְּעָרֵ֣י הַכִּכָּ֔ר וַיֶּאֱהַ֖ל עַד־סְדֹֽם׃", "onk": "אַבְרָם יָתֵב בְּאַרְעָא דִכְנָעַן וְלוֹט יָתֵב בְּקִירְוֵי מֵישְׁרָא וּפְרַס עַד סְדוֹם:", "onk_en": "Avram lived in the land of Canaan; and Lot lived in the cities of the Plain, setting up his tents as far as Sedom.", "pj": "אַבְרָם יָתֵיב בְּאַרְעָא דִכְנָעַן וְלוֹט יָתֵיב בְּקִרְוֵוי מֵישְׁרָא וּפְרַס לְמַשְׁכְּנֵיהּ עַד סְדוֹם", "pj_en": "Abram dwelt in the land of Kenaan, and Lot dwelt in the towns of the plain, and spread his tabernacle towards Sedom.", "tj": "", "tj_en": "", "rashi": "<b>ויאהל.<\/b> נָטָה אֳהָלִים לְרוֹעָיו וּלְמִקְנֵהוּ עַד סְדוֹם:", "rashi_en": "ויאהל means he pitched tents for his shepherds and cattle עד סדום throughout the whole district extending AS FAR AS SODOM."}, {"ch": 13, "v": 13, "aliyah": 3, "heb": "וְאַנְשֵׁ֣י סְדֹ֔ם רָעִ֖ים וְחַטָּאִ֑ים לַיהֹוָ֖ה מְאֹֽד׃", "onk": "וֶאֱנָשִׁין (<small>ס\"א<\/small> וַאֲנָשֵׁי) דִּסְדוֹם בִּישִׁין <b>בְּמָמוֹנְהוֹן<\/b> וְחַיָּבִין <b>בִּגְוִיָּתְהוֹן<\/b> <b>קֳדָם<\/b> יְיָ לַחֲדָא:", "onk_en": "The people of Sedom were wicked [<i>with their property<\/i>] and sinful [<i>with their bodies<\/i>] towards [<i>before<\/i>] Adonoy, exceedingly.", "pj": "וְאֵינָשִׁין דִסְדוֹם בִּישִׁין בְּמָמוֹנְהוֹן דֵין לְדֵין וְחַיָיבִין בְּגוּפְהוֹן בְּגִילוּי עֶרְיְיתָא וְשַׁדְיוּת אֲדַם זַכְּאַי וּפַלְחַן פּוּלְחָנָא נוּכְרָאָה וּמְרָדִין לִשְׁמָא דַיְיָ לַחֲדָא", "pj_en": "And the men of Sedom were depraved in their wealth one with another, and they sinned in their bodies; they sinned with open nakedness, and the shedding of innocent blood, and practiced strange worship, and rebelled greatly against the name of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ואנשי סדום רעים.<\/b> וְאַף עַל פִּי כֵן לֹא נִמְנַע לוֹט מִלִּשְׁכֹּן עִמָּהֶם. וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן (יומא ל\"ח) וְשֵׁם רְשָׁעִים יִרְקָב (משלי י'):<br><br><b>רעים.<\/b> בְּגוּפָם:<br><br><b>וחטאים.<\/b> בְּמָמוֹנָם (סנה' ק\"ט):<br><br><b>לה' מאד.<\/b> יוֹדְעִים רִבּוֹנָם, וּמִתְכַּוְּנִים לִמְרֹד בּוֹ:", "rashi_en": "ואנשי סדום רעים BUT THE MEN OF SODOM WERE WICKED, and yet Lot did not refrain from living with them. Our Rabbis learned from here how the text (Proverbs 10:11) “and the name of the wicked shall rot” should be applied (Yoma 38b).<br><br>רעים WICKED in their persons<br><br>וחטאים AND SINNERS with their wealth (Sanhedrin 109a)<br><br>לה' מאד BEFORE THE LORD, EXCEEDINGLY — They knew their Master and yet intentionally rebelled against Him (Sifra, Bechukotai, Section 2 2)."}, {"ch": 13, "v": 14, "aliyah": 3, "heb": "וַֽיהֹוָ֞ה אָמַ֣ר אֶל־אַבְרָ֗ם אַחֲרֵי֙ הִפָּֽרֶד־ל֣וֹט מֵֽעִמּ֔וֹ שָׂ֣א נָ֤א עֵינֶ֙יךָ֙ וּרְאֵ֔ה מִן־הַמָּק֖וֹם אֲשֶׁר־אַתָּ֣ה שָׁ֑ם צָפֹ֥נָה וָנֶ֖גְבָּה וָקֵ֥דְמָה וָיָֽמָּה׃", "onk": "וַיְיָ אֲמַר לְאַבְרָם בָּתַר דְּאִתְפָּרֶשׁ לוֹט מֵעִמֵּיהּ זְקוֹף כְּעַן עֵינָךְ וַחֲזֵי מִן אַתְרָא דִּאַתְּ תַּמָּן לְצִפּוּנָא וּלְדָרוֹמָא וּלְמָדִינְחָא וּלְמַעֲרָבָא:", "onk_en": "Adonoy said to Avram after Lot had separated from him: Raise your eyes and look about from the place where you are, to the north, to the south to the east and to the west.", "pj": "וַיְיָ אָמַר לְאַבְרָם בָּתַר דְאִתְפְּרַשׁ לוֹט מִנֵיהּ זְקוֹף כְּדוֹן עֵינָךְ וְתֶחֱמֵי מִן אַתְרָא דְאַנְתְּ תַּמָן לְצִיפּוּנָא וּלְדָרוֹמָא וּלְמַדִינְחָא וּלְמַעַרְבָא", "pj_en": "And the Lord said to Abram, after that Lot had separated from him, Lift up now thine eyes, and look, from the place where thou art, to the north and to the south, to the east and to the west:", "tj": "", "tj_en": "", "rashi": "<b>אחרי הפרד לוט.<\/b> כָּל זְמַן שֶׁהָרָשָׁע עִמּוֹ הָיָה הַדִּבּוּר פּוֹרֵשׁ מִמֵֶּנּוּ:", "rashi_en": "אחרי הפרד לוט AFTER LOT WAS SEPARATED FROM HIM — So long as the wicked (Lot) was with him the word of God kept away from him (i. e. God had no communion with Abraham) (Midrash Tanchuma, Vayetzei 10)."}, {"ch": 13, "v": 15, "aliyah": 3, "heb": "כִּ֧י אֶת־כׇּל־הָאָ֛רֶץ אֲשֶׁר־אַתָּ֥ה רֹאֶ֖ה לְךָ֣ אֶתְּנֶ֑נָּה וּֽלְזַרְעֲךָ֖ עַד־עוֹלָֽם׃", "onk": "אֲרֵי יָת כָּל אַרְעָא דִּי אַתְּ חָזֵי לָךְ אֶתְּנִנַּהּ וְלִבְנָךְ עַד עָלָם:", "onk_en": "For all the land that you see I give to you and to your descendants forever.", "pj": "אֲרוּם יַת כָּל אַרְעָא דְאַנְתְּ חָמֵי לָךְ אֶתְּנִינָהּ וְלִבְנָךְ עַד עַלְמָא", "pj_en": "for all the land that thou seest will I give unto thee, and to thy sons, for ever.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 16, "aliyah": 3, "heb": "וְשַׂמְתִּ֥י אֶֽת־זַרְעֲךָ֖ כַּעֲפַ֣ר הָאָ֑רֶץ אֲשֶׁ֣ר&thinsp;<b>׀<\/b> אִם־יוּכַ֣ל אִ֗ישׁ לִמְנוֹת֙ אֶת־עֲפַ֣ר הָאָ֔רֶץ גַּֽם־זַרְעֲךָ֖ יִמָּנֶֽה׃", "onk": "וַאֲשַׁוֵּי יָת בְּנָךְ <b>סַגִּיאִין כְּעַפְרָא דְאַרְעָא כְּמָא דִּי לָא אֶפְשַׁר לִגְבַר לְמִמְנֵי יָת עַפְרָא דְאַרְעָא אַף בְּנָךְ לָא יִתִּמְנוּן<\/b>:", "onk_en": "I will make your descendants [<i>numerous<\/i>] as the dust of the earth; so that if a man can count the dust of the earth, then your descendants too will be countable [<i>just as it is impossible for a man to count the dust of the earth, so too your descendants will not be countable<\/i>].", "pj": "וְאֵשַׁוֵי יַת בְּנָךְ סַגִיאִין כְּעַפְרָא דְאַרְעָא דְהֵיכְמָא דְאִית אֶפְשַר לִגְבַר לְמִימְנֵי יַת עַפְרָא דְאַרְעָא אַף כֵּן בְּנָךְ אֶפְשַׁר דְיִתְמְנוּן", "pj_en": "And I will make thy sons manifold as the dust of the earth, as that, as it is impossible for a man to number the dust of the earth, so also it shall be impossible to number thy sons.", "tj": "", "tj_en": "", "rashi": "<b>אשר אם יוכל איש.<\/b> כְּשֵׁם שֶׁאִי אֶפְשָׁר לֶעָפָר לְהִמָּנוֹת כָּךְ זַרְעֲךָ לֹא יִמָּנֶה:", "rashi_en": "אשר אם יוכל איש SO THAT IF A MAN IS ABLE [TO COUNT] —just as it is impossible for the dust to be counted, so, too, your seed shall not be counted. "}, {"ch": 13, "v": 17, "aliyah": 3, "heb": "ק֚וּם הִתְהַלֵּ֣ךְ בָּאָ֔רֶץ לְאׇרְכָּ֖הּ וּלְרׇחְבָּ֑הּ כִּ֥י לְךָ֖ אֶתְּנֶֽנָּה׃", "onk": "קוּם הַלִּיךְ בְּאַרְעָא לְאָרְכַּהּ וְלִפְתָיַהּ אֲרֵי לָךְ אֶתְּנִנַּהּ:", "onk_en": "Rise, walk through the land—its length and breadth—for to you I will give it.", "pj": "קוּם טַיֵיל בְּאַרְעָא וַעֲבַד בָּהּ חֶזְקָתָא לְאָרְכָּא וּלְפַתְיָא אֲרוּם לָךְ אֶתְּנִינָהּ", "pj_en": "Arise journey in the land, and make occupation of it in length and breadth; for to thee will I give it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 13, "v": 18, "aliyah": 3, "heb": "וַיֶּאֱהַ֣ל אַבְרָ֗ם וַיָּבֹ֛א וַיֵּ֛שֶׁב בְּאֵלֹנֵ֥י מַמְרֵ֖א אֲשֶׁ֣ר בְּחֶבְר֑וֹן וַיִּֽבֶן־שָׁ֥ם מִזְבֵּ֖חַ לַֽיהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּפְרַס אַבְרָם וַאֲתָא וִיתֵב בְּמֵישְׁרֵי מַמְרֵא דִּי בְחֶבְרוֹן וּבְנָא תַמָּן מִדְבְּחָא <b>קֳדָם<\/b> יְיָ:", "onk_en": "Avram set up his tent, and he came and settled in the Plains of Mamrei which are in Chevron, and he built there an altar to [<i>before<\/i>] Adonoy.", "pj": "וּפְרַס אַבְרָם לְמַשְׁכְּנֵיהּ תַיְירִין אִימוֹר (ס\"א משׁכוני לתירי ואמרי) וְאָתָא וְיָתִיב בְּחֵיזוֹ מַמְרֵא דִי בְּחֶבְרוֹן וּבְנָא תַמָן מַדְבְּחָא קֳדָם יְיָ", "pj_en": "And Abram stretched his tent (and made folds) for oxen and sheep, and came and dwelt in the vale of Mamre which is in Hebron, and builded there an altar before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ממרא.<\/b> שֵׁם אָדָם:", "rashi_en": "ממרא MAMRE — the name of a man."}, {"ch": 14, "v": 1, "aliyah": 4, "heb": "וַיְהִ֗י בִּימֵי֙ אַמְרָפֶ֣ל מֶֽלֶךְ־שִׁנְעָ֔ר אַרְי֖וֹךְ מֶ֣לֶךְ אֶלָּסָ֑ר כְּדׇרְלָעֹ֙מֶר֙ מֶ֣לֶךְ עֵילָ֔ם וְתִדְעָ֖ל מֶ֥לֶךְ גּוֹיִֽם׃", "onk": "וַהֲוָה בְּיוֹמֵי אַמְרָפֶל מַלְכָּא <b>דְבָבֶל<\/b> אַרְיוֹךְ מַלְכָּא דְאֶלָּסָר כְּדָרְלָעֹמֶר מַלְכָּא דְעֵילָם וְתִדְעָל <b>מַלְכָּא דְעַמְמֵי<\/b>:", "onk_en": "This happened in the days of Amraphel, king of Shinar [<i>Babylon<\/i>], Aryoch, king of Elasar, Kedorlaomer, king of Ailam, and Tidal, king of Goyim [<i>king of peoples<\/i>].", "pj": "וַהֲוָה בְּיוֹמֵי אַמְרָפֶל הוּא נִמְרוֹד דְאֲמַר לְמִירְמֵי אַבְרָם לְנוּרָא הוּא מַלְכָּא דְפּוּנְטוֹס אַרְיוֹךְ דַהֲוָה אָרִיךְ בְּגִיוּבְרַיָא מַלְכָּא דְתַלְסַר כְּדָרְלָעוֹמֶר דַהֲוָה קִישַׁר מִתְהֲפִיךְ בְּעוּמְרִין מַלְכָּא דְעֵילָם וְתִדְעָל רַמָאָה כְּתַעֲלָא מַלְכָּא דְעַמְמַיָא מִשְׁתַּמְעִין לֵיהּ", "pj_en": "And it was in the days of Amraphel,--he is Nimrod, who commanded Abram to be cast into the furnace; he was then king of Pontos; Ariok, (so called) because he was (arik) tall among the giants, king of Thalasar, Kedarlaomer, (so called) because he had bound himself (or gone over) among the bondmen of the king of Elam, and Thidal, crafty as a fox, king of the peoples subjected to him,", "tj": "", "tj_en": "", "rashi": "<b>אמרפל.<\/b> הוּא נִמְרוֹד, שֶׁאָמַר לְאַבְרָהָם פֹּל לְתוֹךְ כִּבְשַׁן הָאֵשׁ (בראשית רבה):<br><br><b>מלך גוים.<\/b> מָקוֹם יֵשׁ שֶׁשְּׁמוֹ גּוֹיִם, עַל שֵׁם שֶׁנִּתְקַבְּצוּ שָׁמָּה מִכַּמָּה אֻמּוֹת וּמְקוֹמוֹת וְהִמְלִיכוּ אִישׁ עֲלֵיהֶם וּשְׁמוֹ תִדְעָל:", "rashi_en": "אמרפל AMRAPHEL — He is identical with Nimrod who said (אמר) to Abraham, “Plunge (פול) into the fiery furnace” (Eruvin 53a).<br><br>מלך גוים KING OF GOIIM (nations) — There was a place that was called Goiim because people from many nations and localities gathered there and proclaimed as their king a man named Tidal (Genesis Rabbah 42:4). "}, {"ch": 14, "v": 2, "aliyah": 4, "heb": "עָשׂ֣וּ מִלְחָמָ֗ה אֶת־בֶּ֙רַע֙ מֶ֣לֶךְ סְדֹ֔ם וְאֶת־בִּרְשַׁ֖ע מֶ֣לֶךְ עֲמֹרָ֑ה שִׁנְאָ֣ב&thinsp;<b>׀<\/b> מֶ֣לֶךְ אַדְמָ֗ה וְשֶׁמְאֵ֙בֶר֙ מֶ֣לֶךְ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(צביים)<\/span> <span class=\"mam-kq-q\">[צְבוֹיִ֔ם]<\/span><\/span> וּמֶ֥לֶךְ בֶּ֖לַע הִיא־צֹֽעַר׃", "onk": "סְדָרוּ (<small>נ\"י<\/small> עֲבַדוּ) קְרָבָא עִם בֶּרַע מַלְכָּא דִסְדֹם וְעִם בִּרְשַׁע מַלְכָּא דַעֲמֹרָה שִׁנְאָב מַלְכָּא דְאַדְמָה וְשֶׁמְאֵבֶר מַלְכָּא דִצְבוֹיִם וּמַלְכָּא דְבֶלַע הִיא צֹעַר:", "onk_en": "They waged war against Bera, king of Sedom, Birsha, king of Amorah, Shinav, king of Admah, Shemeiver, king of Tzevoyim, and the king of Bela, which is Zoar.", "pj": "עָבְדוּ קְרָבָא עִם בֶּרַע דְעוֹבְדוֹי בְּבִישׁ מַלְכָּא דִסְדוֹם וְעִם בִּרְשַׁע דְעוֹבְדוֹי בִּרְשִׁיעָא מַלְכָּא דַעֲמוֹרָה שִׁנְאָב דַאֲפִילוּ לְאָבוֹי הֲוָה שָנֵי מַלְכָּא דְאַדְמָה וְשֶׁמְאֵבֶר דִמְחַבֵּל אֵיבְרֵיהּ לִיזְנֵיהּ מַלְכָּא דִצְבוֹיִם וּמַלְכָּא דְקַרְתָּא דִבְלָעַת דַיְירָהָא הִיא זוֹעַר", "pj_en": "made war with Bera, whose deeds were evil, king of Sedom, and with Birsha, whose deeds were with the wicked, king of Amora: Shinab, who had hated his father, king of Admah, and Shemebar, who had corrupted himself with fornication, king of Zeboim; and the king of the city which consumed (Bela) the dwellers thereof, which is Zoar.", "tj": "", "tj_en": "", "rashi": "<b>ברע.<\/b> רַע לַשָּׁמַיִם וְרַע לַבְּרִיּוֹת:<br><br><b>ברשע.<\/b> שֶׁנִּתְעַלָּה בְרֶשַׁע:<br><br><b>שנאב.<\/b> שׂוֹנֵא אָבִיו שׁבַּשָּׁמָיִם:<br><br><b>שמאבר.<\/b> שָׂם אֵבֶר לָעוּף וְלִקְפֹּץ וְלִמְרֹד בְּהַקָּבָּ\"ה:<br><br><b>בלע.<\/b> שֵׁם הָעִיר:", "rashi_en": "ברע BERA —Evil (רע) towards God and evil towards mankind (Midrash Tanchuma, Lech Lecha 8).<br><br>ברשע BIRSHA — Because he rose by means of wickedness (רָשַׁע) (Midrash Tanchuma, Lech Lecha 8)).<br><br>שנאב SHINAB — He hated (שנא) his Father (אב) in heaven (Midrash Tanchuma, Lech Lecha 8)).<br><br>שמאבר SHEMEBER — He set his wings (שם אבר) to fly, flapping them to rebel against the Holy One, blessed be He (Midrash Tanchuma, Lech Lecha 8)).<br><br>בלע BELA is the name of this king’s city (but the king’s own name is not mentioned here)."}, {"ch": 14, "v": 3, "aliyah": 4, "heb": "כׇּל־אֵ֙לֶּה֙ חָֽבְר֔וּ אֶל־עֵ֖מֶק הַשִּׂדִּ֑ים ה֖וּא יָ֥ם הַמֶּֽלַח׃", "onk": "כָּל אִלֵּין <b>אִתְכְּנָשׁוּ לְמֵישַׁר חַקְלַיָּא<\/b> הוּא <b>אֲתַר<\/b> יַמָּא דְמִלְחָא:", "onk_en": "All these joined together [<i>assembled<\/i>] at the valley of Siddim [<i>the plain of the fields<\/i>], which is [now] [<i>the place of<\/i>] the Salt Sea.", "pj": "כָּל אִלֵין אִתְחַבְּרוּ לְמֵישַׁר פַּרְדְסַיָא הוּא אָתַר דְמַסִיק פְּרַקְטוּנִין דְמַיִין וְשַׁדִי לְהוֹן לְיַמָא דְמִלְחָא", "pj_en": "All these were joined in the vale of the gardens (paredesaia), the place that produced the streamlets of waters that empty themselves into the sea of salt.", "tj": "כָּל אִלֵין אִתְחַבְּרוּ לְמֵישַׁר פַּרְדְסַיָא:", "tj_en": "All these were joined in the valley of the gardens.", "rashi": "<b>עמק השדים.<\/b> כָּךְ שְׁמוֹ, עַל שֵׁם שֶׁהָיו בוֹ שָׂדוֹת הַרְבֵּה:<br><br><b>הוא ים המלח.<\/b> לְאַחַר זְמַן נִמְשַׁךְ הַיָּם לְתוֹכוֹ וְנַעֲשָׂה יָם הַמֶּלַח. וּמִדְרַשׁ אַגָּדָה אוֹמֵר שֶׁנִּתְבַּקְּעוּ הַצּוּרִים סְבִיבוֹתָיו וְנִמְשְׁכוּ יְאוֹרִים לְתוֹכוֹ:", "rashi_en": "עמק השדים VALE OF SIDDIM — So it was named because it contained many fields (שדות)<br><br>There are many Midrashic explanations of this name. הוא ים המלח THE SAME IS THE SALT SEA — After some time the sea flowed into it (the vale) and thus the Salt Sea came into existence. The Midrashic explanation states that the rocks that surrounded it had cracked and streams thus flowed into it (Genesis Rabbah 42:5). "}, {"ch": 14, "v": 4, "aliyah": 4, "heb": "שְׁתֵּ֤ים עֶשְׂרֵה֙ שָׁנָ֔ה עָבְד֖וּ אֶת־כְּדׇרְלָעֹ֑מֶר וּשְׁלֹשׁ־עֶשְׂרֵ֥ה שָׁנָ֖ה מָרָֽדוּ׃", "onk": "תַּרְתֵּא עַשְׂרֵי שְׁנִין פְּלָחוּ יָת כְּדָרְלָעֹמֶר וּתְלָת עַשְׂרֵי שְׁנִין מְרָדוּ:", "onk_en": "[For] twelve years they had served Kedorlaomer, and for thirteen years they rebelled.", "pj": "תַּרְתֵּי סְרֵי שְׁנִין פְּלָחוּ יַת כְּדָרְלָעוֹמֶר וּבִתְלַסְרֵי שְׁנִין מָרָדוּ", "pj_en": "Twelve years they had served Kedarlaomer; and in the thirteenth year they had rebelled.", "tj": "", "tj_en": "", "rashi": "<b>שתים עשרה שנה עבדו.<\/b> חֲמִשָּׁה מְלָכִים הַלָּלוּ אֶת כְּדָרְלָעֹמֶר:", "rashi_en": "שתים עשרה שנה עבדו TWELVE YEARS DID THEY i. e. these five kings SERVE Chedorlaomer."}, {"ch": 14, "v": 5, "aliyah": 4, "heb": "וּבְאַרְבַּע֩ עֶשְׂרֵ֨ה שָׁנָ֜ה בָּ֣א כְדׇרְלָעֹ֗מֶר וְהַמְּלָכִים֙ אֲשֶׁ֣ר אִתּ֔וֹ וַיַּכּ֤וּ אֶת־רְפָאִים֙ בְּעַשְׁתְּרֹ֣ת קַרְנַ֔יִם וְאֶת־הַזּוּזִ֖ים בְּהָ֑ם וְאֵת֙ הָֽאֵימִ֔ים בְּשָׁוֵ֖ה קִרְיָתָֽיִם׃", "onk": "וּבְאַרְבַּע עַשְׂרֵי שְׁנִין אֲתָא כְדָרְלָעֹמֶר וּמַלְכַיָּא דְּעִמֵּיהּ וּמְחוֹ יָת <b>גִּבָּרַיָּא<\/b> דִּי בְעַשְׁתְּרוֹת קַרְנַיִם וְיָת <b>תַּקִּיפַיָּא<\/b> דִּבְהֶמְתָּא וְיָת <b>אֵימְתָנֵי<\/b> דִּבְשָׁוֵה קִרְיָתָיִם:", "onk_en": "In the fourteenth year, Kedorlaomer came together with the kings that were with him and they defeated the Rephaim [<i>the mighty ones<\/i>] in Ashteros Karnayim, the Zuzim [<i>the powerful ones<\/i>] in Ham, the Aimim [<i>the ones that incite fear<\/i>] at Shaveh Kiryasayim,", "pj": "וּבִירְבֵּיסְרֵי שְׁנִין אָתָא כְדָרְלָעוֹמֶר וּמַלְכַיָא דְעִימֵיהּ וּמְחוֹ יַת גִבָּרַיָא דִבְעַשְׁתְּרוֹת קַרְנָיִם וְיַת תַּקִיפַיָא דִבְהֶמְתָּא וְיַת אֵימְתָנֵי דִבְשָׁוֵהּ קִרְיָתָיִם", "pj_en": "And in the fourteenth year came Kedarlaomer and the kings who were with him, and smote the Giants (gibboraia) which were in Ashtaroth-Karniam, and the Strong who were in Hametha, and the Terrible who were in the plain of Kiriathaim,", "tj": "וּקְטוּלוּ יַת זִיבָּרַיָא דִבְּעַשְׁתְּרוֹת קַרְנַיִם וְיַת זַוְיָתָנַיָא דִי בְּהוֹן וְיַת אֵמְתָנַיָא אִילֵין דְשַׁרְיָין דִבְנוּהָ קַרְתָּא:", "tj_en": "And they slew the giants who were in Ashtaroth-Karnaim, the famed who were among them, and the formidable who inhabited the city which they had built,", "rashi": "<b>ובארבע עשרה שנה.<\/b> לְמִרְדָּן:<br><br><b>בא כדרלעמר.<\/b> לְפִי שֶׁהוּא הָיָה בַעַל הַמַּעֲשֶׂה נִכְנַס בְּעֹבִי הַקּוֹרָה:<br><br><b>והמלכים.<\/b> אֵלֶּה שְׁלשָׁה מְלָכִים:<br><br><b>הזוזים.<\/b> הֵם זַמְזֻמִּים:", "rashi_en": "ובארבע עשרה שנה AND IN THE FOURTEENTH YEAR of their rebellion<br><br>בא כדרלעמר CHEDORLAOMER CAME — Because the matter concerned him mostly, “he bore the heavier side of the beam\" (Genesis Rabbah 42:6).<br><br>והמלכים AND THE KINGS [THAT WERE WITH HIM] — These are the other three kings.<br><br>הזוזים These are the Zamzumim (see Deuteronomy 2:10 and Deuteronomy 2:20). "}, {"ch": 14, "v": 6, "aliyah": 4, "heb": "וְאֶת־הַחֹרִ֖י בְּהַרְרָ֣ם שֵׂעִ֑יר עַ֚ד אֵ֣יל פָּארָ֔ן אֲשֶׁ֖ר עַל־הַמִּדְבָּֽר׃", "onk": "וְיָת חוֹרָאֵי דִּי בְטוּרְהוֹן דְּשֵׂעִיר עַד <b>מֵישַׁר<\/b> פָּארָן <b>דִּסְמִיךְ עַל<\/b> מַדְבְּרָא:", "onk_en": "And the Chorites in their hills of Seir, as far as Eil [<i>the Plain of<\/i>] Paran which borders [<i>is next to<\/i>] the wilderness.", "pj": "וְיַת חוֹרָאֵי דִבְטַוְורַיָא רָמַיָא דִגְבָלָא עַד מֵישַׁר פָּארָן דִסְמִיךְ לִצְטַר מַדְבְּרָא", "pj_en": "and the Choraee (dwellers in caverns) who were in the high mountains of Gebala, unto the valley of Pharan, which was nigh upon the edge of the desert.", "tj": "וְיַת חוֹרָוָאֵי אִילֵין דְשַׁרְיָין בְּטוּרָא דְגַבְלָא עַד מֵישַׁר חֲזוֹזָא דִסְמִיךְ עַל מַדְבְּרָא:", "tj_en": "and the cavern people who dwelt in the mountain of Gebala, unto the valley of vision which is nigh upon the desert.", "rashi": "<b>בהררם.<\/b> בְּהַר שֶׁלָּהֶם:<br><br><b>איל פארן.<\/b> כְּתַרְגּוּמוֹ מִישׁוֹר. וְאוֹמֵר אֲנִי שֶׁאֵין אֵיל לְשׁוֹן מִישׁוֹר, אֶלָּא מִישׁוֹר שֶׁל פָּארָן אֵיל שְׁמוֹ, וְשֶׁל מַמְרֵא אֵלוֹנֵי שְׁמוֹ, וְשֶׁל יַרְדֵּן כִּכָּר שְׁמוֹ, וְשֶׁל שִׁטִּים אָבֵל שְׁמוֹ, אָבֵל הַשִּׁטִּים, וְכֵן בַּעַל גָּד בַּעַל שְׁמוֹ; וְכֻלָּם מְתֻרְגָּמִין מִישׁוֹר, וְכָל א' שְׁמוֹ עָלָיו:<br><br><b>על המדבר.<\/b> אֵצֶל הַמִּדְבָּר, כְּמוֹ וְעָלָיו מַטֵּה מְנַשֶּׁה (במדבר ב'):", "rashi_en": "בהררם means IN THEIR MOUNT (i. e.הרר is a form of הר — really an earlier form — with pronominal suffix  ָ מ ;cf. הררי קדש etc.)<br><br>איל פארן EL-PARAN — As it is translated in the Targum: Plain of Paran. But I hold that איל does not signify a plain in general but that the lowland of Paran bore the name of El, and that of Mamre was named Elone; that of the Jordan was called Kikkar, whilst that of Shittim was called Abel — Abel-Shittim — and so, too, the lowland of [Baal] Gad was named Baal. All these are translated in the Targum by מישור, but each really had its own particular name.<br><br>על המדבר BY THE WILDERNESS — next to the wilderness; a similar use of על is (Numbers 2:20) “and next unto him (עליו) shall be the tribe of Manasseh’’."}, {"ch": 14, "v": 7, "aliyah": 4, "heb": "וַ֠יָּשֻׁ֠בוּ וַיָּבֹ֜אוּ אֶל־עֵ֤ין מִשְׁפָּט֙ הִ֣וא קָדֵ֔שׁ וַיַּכּ֕וּ אֶֽת־כׇּל־שְׂדֵ֖ה הָעֲמָלֵקִ֑י וְגַם֙ אֶת־הָ֣אֱמֹרִ֔י הַיֹּשֵׁ֖ב בְּחַֽצְצֹ֥ן תָּמָֽר׃", "onk": "וְתָבוּ וַאֲתוּ לְ<b>מֵישַׁר פִּלּוּג דִּינָא<\/b> הִיא <b>רְקָם<\/b> וּמְחוֹ יָת כָּל חֲקַל עֲמַלְקָאָה וְאַף יָת אֱמוֹרָאָה דְּיָתֵיב <b>בְּעֵין גֶּדִי<\/b>:", "onk_en": "They turned back and came to Ein Mishpat [<i>the plain of compromise<\/i>] which is Kadeish [<i>Rekem<\/i>], and they struck all the territory of Amaleik, as well as the Emorites who lived in Chazazon Tamar [<i>Ein Gedi<\/i>].", "pj": "וְתָבוּ וְאָתוּ לְאַתְרָא דְאִתְפְּלִיג דִינָא דְמשֶׁה נְבִיָא עַל עֵינָא דְמֵי מַצוֹתָא הוּא רֵיקָם וּמְחוֹי יַת כָּל חַקְלֵי עֲמַלְקָאֵי וְאוֹף יַת אֱמוֹרָאֵי דְיָתִיב בְּעֵין גֶדִי", "pj_en": "And they returned, and came to the place where was rendered the judgment of Mosheh the prophet, to the fountain of the waters of Strife, which is Requam. And they smote all the fields of the Amalkaee, and also the Emoraee, who dwelt in En-gedi.", "tj": "", "tj_en": "", "rashi": "<b>עין משפט היא קדש.<\/b> עַל שֵׁם הֶעָתִיד, שֶׁעֲתִידִין מֹשֶׁה וְאַהֲרֹן לְהִשְָּׁפֵט שָׁם עַל עִסְקֵי אוֹתוֹ הָעַיִן וְהֵם מֵי מְרִיבָה. וְאֻנְקְלוֹס תִּרְגְּמוֹ כִפְשׁוּטוֹ מָקוֹם שֶׁהָיוּ בְנֵי הַמְּדִינָה מִתְקַבְּצִים שָׁם לְכָל מִשְׁפָּט:<br><br><b>שדה העמלקי.<\/b> עֲדַיִן לֹא נוֹלַד עֲמָלֵק, וְנִקְרָא עַל שֵׁם הֶעָתִיד:<br><br><b>בחצצון תמר.<\/b> הוּא עֵין גֶּדִי, מִקְרָא מָלֵא בְּדִבְרֵי הַיָּמִים (ב' כ') בִּיהוֹשָׁפָט:", "rashi_en": "עין משפט היא קדש EN-MISHPAT, THE SAME IS KADESH — It is here named EN-MISHPAT (“the well of judgment’’) in reference to what would happen there in the future — where Moses and Aaron would once be judged because of what occurred at that fountain. It is identical with “the waters of Meribah” (cf. Numbers 20:1 and Numbers 20:13) (Midrash Tanchuma, Lech Lecha 8). Onkelos, however, translates it according to its plain sense: the plain where the people of the district used to gather for every lawsuit.<br><br>שדה העמלקי THE COUNTRY OF THE AMALEKITES — Amalek, it is true, was not yet born, but it is here named in reference to the name it would bear in the future (Genesis Rabbah 42:7).<br><br>בחצצון תמר IN HAZEZON-TAMAR — This is En-Gedi: so a text plainly states in Chronicles (2 Chronicles 20:2) in the history of Jehoshaphat. "}, {"ch": 14, "v": 8, "aliyah": 4, "heb": "וַיֵּצֵ֨א מֶֽלֶךְ־סְדֹ֜ם וּמֶ֣לֶךְ עֲמֹרָ֗ה וּמֶ֤לֶךְ אַדְמָה֙ וּמֶ֣לֶךְ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(צביים)<\/span> <span class=\"mam-kq-q\">[צְבוֹיִ֔ם]<\/span><\/span> וּמֶ֥לֶךְ בֶּ֖לַע הִוא־צֹ֑עַר וַיַּֽעַרְכ֤וּ אִתָּם֙ מִלְחָמָ֔ה בְּעֵ֖מֶק הַשִּׂדִּֽים׃", "onk": "וּנְפַק מַלְכָּא דִסְדוֹם וּמַלְכָּא דַעֲמוֹרָה וּמַלְכָּא דְאַדְמָה וּמַלְכָּא דִצְבוֹיִם וּמַלְכָּא דְבֶלַע הִיא צוֹעַר וְסַדָּרוּ עִמְּהוֹן קְרָבָא <b>בְּמֵישַׁר חַקְלַיָּא<\/b>:", "onk_en": "The king of Sedom set out, along with the king of Amorah, the king of Admah, the king of Tzevoyim, and the king of Bela, which is Zoar, and engaged them in battle in the Valley of Siddim [<i>in the plain of the fields<\/i>].", "pj": "וּנְפַק מַלְכָּא דִסְדוֹם וּמַלְכָּא דַעֲמוֹרָה וּמַלְכָּא דְאַדְמָה וּמַלְכָּא דִצְבוֹיִים וּמַלְכָּא דְקַרְתָּא דִבְלָעַת דַיְרָהָא אִיהִי זוֹעַר וְסָדְרוּ עִמְהוֹן סִדְרֵי קְרָבָא בְּמֵישַׁר פַּרְדְסַיָא", "pj_en": "And the king of Sedom, and the king of Amorah, and the kind of Admah, and the king of Zeboim, and the king of the city which con
