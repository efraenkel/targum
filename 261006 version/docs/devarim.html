<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<header>
  <div class="title-row">

</header>

<script>

const DATA = [{"ch": 1, "v": 1, "aliyah": 1, "heb": "אֵ֣לֶּה הַדְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל־כׇּל־יִשְׂרָאֵ֔ל בְּעֵ֖בֶר הַיַּרְדֵּ֑ן בַּמִּדְבָּ֡ר בָּֽעֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין־פָּארָ֧ן וּבֵֽין־תֹּ֛פֶל וְלָבָ֥ן וַחֲצֵרֹ֖ת וְדִ֥י זָהָֽב׃", "onk": "אִלֵּין פִּתְגָּמַיָּא דִּי מַלִּיל משֶׁה עִם כָּל יִשְׂרָאֵל בְּעִבְרָא דְּיַרְדְּנָא <b>אוֹכַח יָתְהוֹן עַל דְּחָבוּ<\/b> בְמַדְבְּרָא <b>וְעַל דְּאַרְגִּיזוּ<\/b> בְמֵישְׁרָא לָקֳבֵל <b>יַם<\/b> סוּף בְּפָארָן <b>דְּאִתַּפָּלוּ עַל מַנָּא<\/b> וּבַחֲצֵרוֹת <b>דְּאַרְגִּיזוּ עַל בִּשְׂרָא וְעַל דַּעֲבָדוּ עֵגַל<\/b> דִּדְהָב:", "onk_en": "These are the words that Moshe addressed to all of Yisroel across the Yardein; [as he had] [<b>reproved them for they had sinned<\/b>] in the wilderness—[<b>and provoked (Hashem) to anger<\/b>] on the Arava plain facing [<b>the Sea of<\/b>] Suf; [and as he had] between Poron [<b>where they scorned the mon<\/b>] and Tofel and Lovon [<b>where they provoked to anger regarding meat<\/b>] and Chatzeiros and Di Zohov [<b>because they made the Golden Calf<\/b>].", "pj": "אִלֵּין פִּתְגָמֵי אוֹכָחוּתָא דִי מַלֵּיל משֶׁה עִם כָּל יִשְרָאֵל כַּנְפִינוּן לְוָתֵיהּ כַּד הֲווֹן בְּעִיבְרָא דְיַרְדְּנָא עָנָא וַאֲמַר לְהוֹן הֲלָא בְּמַדְבְּרָא בְּטַוְרָא דְסִינַי אִתְיְהִבַת לְכוֹן אוֹרַיְיתָא וּבְמֵישְׁרַיָא דְמוֹאָב אִתְפַּרְשַׁת לְכוֹן כַּמָּה נִיסִין וּפְרִישַׁן עָבַד לְכוֹן קוּדְשָׁא בְּרִיךְ הוּא מִזְמַן דַּעֲבַרְתּוּן עַל גֵּיף יַמָא דְסוּף דַּעֲבַד לְכוֹן אִסְטְרַט לְכָל שִׁבְטָא וְשִׁבְטָא וְאַתּוּן סְטֵיתוּן מִבָּתַר מֵימְרֵיהּ וְאַרְגַּזְתּוּן קֳדָמוֹי בְּפָארָן עַל מֵימְרָא אַלְלַיָא וּטְפַלְתּוּן עֲלוֹי מִילֵי שִׁקְרָא וְאִתְרַעַמְתּוּן עַל מַנָא דְאָחִית לְכוֹן חִיוַור מִן שְׁמַיָא וְשַׁיֵילְתּוּן בִּישְרָא בַּחֲצֵרוֹת וַהֲוֵי חָמֵי לְכוֹן לְמִשְׁתֵּיצְיָא מִגּוֹ עַלְמָא אִלוּלֵי דִדְכַר לְכוֹן זְכוּת אַבְהַתְכוֹן צַדִיקַיָא וּמַשְׁכַּן זִמְנָא וַאֲרוֹן קְיָימָא וּמָאנָא קוּדְשָׁא דַּחֲמִיתוּן דַּהֲבָא סַנִינָא וְכַפֵּר לְכוֹן עַל חוֹבַת עֵיגַל דַּהֲבָא", "pj_en": "These are the words of admonition which Mosheh spake with all Israel. He gathered them together to him while they were beyond the Jordan, and answered and said to them: Was it not in the wilderness at the mountain of Sinai that the law was given to you? and in the plains of Moab you were made to understand how many miracles and signs the Holy One, blessed be He, had wrought for you, from the time that you passed over the border of the Weedy Sea, where He made for you a way for every one of your tribes. But you declined from His word, and wrought provocation before Him, in Pharan, on account of the words of the spies, and put together lying words against Him, and murmured about the manna, which He had made to come down for you, white from the heavens; in Hazeroth you demanded flesh, and made yourselves deserving to perish from the midst of the world, but for the memory, on your behalf, of the merit of your righteous fathers, the tabernacle of ordinance, and the ark of the covenant, and the holy vessels which you had covered with pure gold, and made atonement for you on account of the sin of the golden calf.", "tj": "אִלֵין פִּתְגָמַיָא דִי מַלֵּיל משֶׁה עִם כָּל יִשְרָאֵל הוֹכַח יַתְהוֹן עַד דְּהִינוּן יָתְבִין בְּעִיבְרָא דְיוֹרְדְּנָא עָנֵי משֶׁה וַאֲמַר לְהוֹן הֲלָא בְּמַדְבְּרָא בְּטוּרָא דְסִינַי אִתְיְהִיבַת לְכוֹן אוֹרַיְיתָא וּבְמֵישְׁרָא דְמוֹאָב אִתְפַּרְשַׁת לְכוֹן כַּמָּה נִסִין וּגְבוּרָן עָבַד לְכוֹן מֵימְרָא דַיְיָ כַּד הֲוֵיתוּן קַיְימִין עַל יַמָא דְסוּף אִתְבְּזַא יַמָא מִן קֳדָמֵיכוֹן וְאִתְעֲבֵיד תְּרֵי עֲשַר אִסְרָטִין מִן אִסְרַט חֲדָא לְכָל שִׁבְטָא אַרְגַּזְתּוּן קֳדָמוֹי עַל יַמָּא וְסָרֵיבְתּוּן עַל יַמָּא דְסוּף עַל עֵיסַק מַלְלַיָּא דְעִשְׁתַּלְחוּן מִן מַדְבְּרָא דְפָארָן גְּזַר עֲלֵיכוֹן דְּלָא תַעֲלוּן לְאַרְעָא דְיִשְרָאֵל וּבְגִין מַנְתָא דְּאַמְרִיתּוּן נַפְשַׁן מְעִיקָא בְּלַחְמָא הָדֵין דְּמֵכְלֵיהּ קָלִיל גָּרֵי בְּכוֹן חַיּוּתְהוֹן וּבַחֲצֵרוֹת דִּי נְפָלוּ פִּגְרֵיכוֹן עַל יְדֵי בִּשְרָא וּבְגִין עֶגְלָא דַּעֲבַדְתּוּן אָמַר בְּמֵימְרֵיהּ לִמְשֵׁיצֵי יַתְכוֹן אִלּוּלֵי דְאִידְכַּר קְיָּימָא דְּקַיֵּים לְאַבְהַתְכוֹן לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב וּמַשְׁכַּן זִמְנָא דִּי עֲבַדְתּוּן לִשְׁמֵיהּ וַאַרוֹן קְיָּימָא דַיְיָ עֲלַתְכוֹן בְּגַוֵּיהּ וַחֲפִיתוּן יָתֵיהּ בְּדַהֲבָא סְנִינָא:", "tj_en": "These are the words that Mosheh, spake with all Israel, reproving them, while as yet they were situate beyond the Jordan. Mosheh answering said to them: Was it not in the wilderness at Mount Sinai, that the law was given to you? And on the plains of Moab was shown you what miracles and mighty acts the Word of the Lord had wrought on your behalf. When you stood by the Weedy Sea, the sea was divided before you, and there were made twelve ways of one way, (a path) for each tribe. Yet you provoked Him at the sea, and rebelled at the Sea of Suph. On account of the matter of the spies who had been sent from the wilderness of Pharan, the decree (came forth) against you, that you should not enter into the land of Israel; and for that of the manna, of which you said, Our soul is afflicted with this bread, whose eating is too light, the serpents were let loose upon you; and in Hazeroth, where your carcasses fell on account of the flesh, and concerning the calf that you had made, He would have spoken in His Word to destroy you, had He not been mindful of the covenant which He sware to your fathers, Abraham, Izhak, and Jakob, and of the tabernacle of ordinance which you had made unto His name, and the ark of the covenant of the Lord, and of your burnt sacrifices in the midst (of the tabernacle and the ark) which you covered with purified gold.", "rashi": "<b>אלה הדברים.<\/b> לְפִי שֶׁהֵן דִּבְרֵי תוֹכָחוֹת וּמָנָה כָאן כָּל הַמְּקוֹמוֹת שֶׁהִכְעִיסוּ לִפְנֵי הַמָּקוֹם בָּהֶן, לְפִיכָךְ סָתַם אֶת הַדְּבָרִים וְהִזְכִּירָם בְּרֶמֶז מִפְּנֵי כְבוֹדָן שֶׁל יִשְׂרָאֵל (עי' ספרי):<br><br><b>אל כל ישראל.<\/b> אִלּוּ הוֹכִיחַ מִקְצָתָן, הָיוּ אֵלּוּ שֶׁבַּשּׁוּק אוֹמְרִים אַתֶּם הֱיִיתֶם שׁוֹמְעִים מִבֶּן עַמְרָם וְלֹא הֲשִׁיבוֹתֶם דָּבָר מִכָּךְ וְכָךְ? אִלּוּ הָיִינוּ שָׁם הָיִינוּ מְשִׁיבִים אוֹתוֹ, לְכָךְ כִּנְּסָם כֻּלָּם וְאָמַר לָהֶם הֲרֵי כֻּלְּכֶם כָּאן, כָּל מִי שֶׁיֵּשׁ לוֹ תְשׁוּבָה יָשִׁיב (ספרי):<br><br><b>במדבר.<\/b> לֹא בַמִּדְבָּר הָיוּ אֶלָּא בְּעַרְבוֹת מוֹאָב, וּמַהוּ בַּמִּדְבָּר? אֶלָּא בִּשְׁבִיל מַה שֶּׁהִכְעִיסוּהוּ בַּמִּדְבָּר שֶׁאָמְרוּ (שמות ט\"ז) \"מִי יִתֵּן מוּתֵנוּ וְגוֹ'\":<br><br><b>בערבה.<\/b> בִּשְׁבִיל הָעֲרָבָה, שֶׁחָטְאוּ בְּבַעַל פְּעוֹר בְּשִּׁטִּים בְּעַרְבוֹת מוֹאָב:<br><br><b>מול סוף.<\/b> עַל מַה שֶּׁהִמְרוּ בְיַם סוּף בְּבוֹאָם לְיַם סוּף, שֶׁאָמְרוּ (שם י\"ד) \"הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם\", וְכֵן בְּנָסְעָם מִתּוֹךְ הַיָּם, שֶׁנֶּאֱמַר (תהילים ק\"ו) \"וַיַּמְרוּ עַל יָם בְּיַם סוּף\" כִּדְאִיתָא בַּעֲרָכִין (דף ט\"ו):<br><br><b>בין פארן ובין תפל ולבן.<\/b> אָמַר רַבִּי יוֹחָנָן חָזַרְנוּ עַל כָּל הַמִּקְרָא וְלֹא מָצִינוּ מָקוֹם שֶׁשְּׁמוֹ תֹּפֶל וְלָבָן, אֶלָּא הוֹכִיחָן עַל הַדְּבָרִים שֶׁתָּפְלוּ עַל הַמָּן, שֶׁהוּא לָבָן, שֶׁאָמְרוּ (במדבר כ\"א) \"וְנַפְשֵׁנוּ קָצָה בַּלֶּחֶם הַקְּלֹקֵל\", וְעַל מַה שֶּׁעָשׂוּ בְמִדְבַּר פָּארָן עַל יְדֵי הַמְרַגְּלִים:<br><br><b>וחצרת.<\/b> בְּמַחְלָקְתּוֹ שֶׁל קֹרַח; דָּבָר אַחֵר אָמַר לָהֶם הָיָה לָכֶם לִלְמֹד מִמַּה שֶּׁעָשִׂיתִי לְמִרְיָם בַּחֲצֵרוֹת בִּשְׁבִיל לָשׁוֹן הָרָע, וְאַתֶּם נִדְבַּרְתֶּם בַּמָּקוֹם:<br><br><b>ודי זהב.<\/b> הוֹכִיחָן עַל הָעֵגֶל שֶׁעָשׂוּ בִּשְׁבִיל רֹב זָהָב שֶׁהָיָה לָהֶם, שֶׁנֶּאֱמַר (הושע ב') \"וְכֶסֶף הִרְבֵּיתִי לָהּ וְזָהָב עָשׂוּ לַבָּעַל\" (עי' ספרי; ברכות ל\"ב):", "rashi_en": "אלה הדברים THESE ARE THE WORDS — Because these are words of reproof and he is enumerating here all the places where they provoked God to anger, therefore he suppresses all mention of the matters in which they sinned and refers to them only by a mere allusion contained in the names of these places out of regard for Israel (cf. Sifrei Devarim 1:1; Onkelos and Targum Jonathan).<br><br>אל כל ישראל [THE WORDS WHICH HE SPAKE] TO ALL ISRAEL — If he had reproved only some of them, those who were then in the street (i.e. those who were absent) might have said, “You heard from the son of Amram, and did not answer a single word regarding this and that; had we been there, we would have given him an answer!\". On this account he assembled all of them, and said to them, \"See, you are all here: he who has anything to say in reply, let him reply!” (Sifrei Devarim 1:6-7).<br><br>במדבר IN THE WILDERNESS — They, however,‎‎were not then in the wilderness, but in the plains of Moab (cf. Numbers 36:13 and further on verse 5): What, therefore, is the meaning of במדבר? It does not mean \"in the wilderness”, but the meaning is: he reproved them on account of that wherein they had provoked Him to anger in the wilderness — that they said, (Exodus 16:3) “Would that we had died [by the hand of the Lord]” (cf. Sifrei Devarim 1:11).<br><br>בערבה IN THE PLAIN — i.e. he reproved them regarding the plain: that they had sinned through Baal Peor at Shittim in the plains of Moab (cf. Sifrei Devarim 1:13)<br><br>מול סוף OVER AGAINST SUPH — i.e. he reproved them regarding that in which they had shown themselves rebellious at the Red Sea (סוף): viz., on their arrival at the Red Sea — that they said, (Exodus 14:11) “Is it because there are no graves in Egypt [that thou hast brought us to die in the wilderness?]\"; and similarly when they left the midst of the Sea, as it is said, (Psalms 106:7) “They murmured because of the Sea, at the Red Sea”, as it is related in Treatise Arakhin 15a (cf. Rashi on Numbers 14:22 and Sifrei 1:14).<br><br>בין פארן ובין תפל ולבן BETWEEN PARAN, AND TOPHEL AND LABAN — R. Jochanan said: We have gone through the whole Bible and we have found no place the name of which is Tophel or Laban! But the meaning is that he reproved them because of the calumnious statements (טפלו) they had made regarding the Manna which was white (לבן) in colour — that they said, (Numbers 21:5) “And our soul loathes this light bread”; and because of what they had done in the wilderness of Paran through the spies.<br><br>וחצרת AND HAZEROTH — i.e. regarding wh‎at they had done there at the insurrection of Korah. — Another explanation: He said to them, “You ought to have taken a lesson from what I did to Miriam at Hazeroth because of the slander she uttered, and yet you even after that spoke against the Omnipresent (Sifrei Devarim 1:15).<br><br>ודי זהב AND DI ZAHAB (the name is taken in the sense of “sufficiency of gold”) — He reproved them on account of the golden calf which they had made in consequence of the abundance of gold which they had, as it is said, (Hosea 2:10) “And silver did I give them in abundance and gold: they, however, made it into a Baal” (cf. Berakhot 32a; Sifrei Devarim 1:18)."}, {"ch": 1, "v": 2, "aliyah": 1, "heb": "אַחַ֨ד עָשָׂ֥ר יוֹם֙ מֵֽחֹרֵ֔ב דֶּ֖רֶךְ הַר־שֵׂעִ֑יר עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ׃", "onk": "<b>מַהֲלַךְ<\/b> חַד עֲשַׂר יוֹמִין מֵחֹרֵב אֹרַח טוּרָא דְשֵׂעִיר עַד <b>רְקַם גֵּיאָה<\/b>:", "onk_en": "[<b>A journey of<\/b>] eleven days [traveling time] from Choreiv by the Mount Seir road, to Kadeish Barnei’a [<b>Rekam Geyah<\/b>].", "pj": "מַהֲלַךְ חַדְסַר יוֹמִין מֵחוֹרֵב מֵאוֹרַח טַוְורָא דְגַבְלָא עַד רְקַם גֵּיאָה וְעַל דִּי סְטִיתוּן וְאַרְגַּזְתּוּן קֳדָם יְיָ אִיתְחַרְתּוּן אַרְבְּעִין שְׁנִין", "pj_en": "It is a journey of eleven days (only) from Horeb by the way of Mount Gebal unto Rekem Giah; but because you declined and provoked the Lord to displeasure, you have been retarded forty years.", "tj": "מַהֲלַךְ חַד עֲשַר יוֹמִין מִן טוּרָא דְחוֹרֵב אוֹרַח טוּרָא דְגַבְלָא עַד רְקַם דְּגֵיעָא עַל דַּחֲטָתוּן וְאִרְגַזְתּוּן קֳדָמוֹי אִתְעַכַּבְתּוּן וַהֲלַכְתּוּן יַתְהוֹן לְאַרְבְּעִין שְׁנִין:", "tj_en": "A journey of eleven days is it from Mount Horeb by way of Mount Gebal unto Rekem Giah; yet, because you sinned and provoked anger before Him, you have been delayed, and have been journeying for forty years.", "rashi": "<b>אחד עשר יום מחרב.<\/b> אָמַר לָהֶם מֹשֶׁה רְאוּ מַה גְּרַמְתֶּם אֵין לָכֶם דֶּרֶךְ קְצָרָה מֵחוֹרֵב לְקָדֵשׁ בַּרְנֵעַ כְּדֶרֶךְ הַר שֵׂעִיר, וְאַף הוּא מַהֲלַךְ י\"א יוֹם, וְאַתֶּם הֲלַכְתֶּם אוֹתָהּ בִּשְׁלֹוֹשָׁה יָמִים – שֶׁהֲרֵי בְּעֶשְׂרִים בְּאִיָּר נָסְעוּ מֵחוֹרֵב, שֶׁנֶּאֱמַר (במדבר י') \"וַיְהִי בַּשָּׁנָה הַשֵּׁנִית בַּחֹדֶשׁ הַשֵּׁנִי בְּעֶשְׂרִים בַּחֹדֶשׁ וְגוֹ'\", וּבְכ\"ט בְּסִיוָן שָׁלְחוּ אֶת הַמְרַגְּלִים מִקָּדֵשׁ בַּרְנֵעַ (תענית כ\"ט), צֵא מֵהֶם ל' יוֹם שֶׁעָשׂוּ בְּקִבְרוֹת הַתַּאֲוָה שֶׁאָכְלוּ הַבָּשָׂר חֹדֶשׁ יָמִים, וְשִׁבְעָה יָמִים שֶׁעָשׂוּ בַחֲצֵרוֹת לְהִסָּגֵר שָׁם מִרְיָם, נִמְצָא בִשְׁלוֹשָׁה יָמִים הָלְכוּ כָּל אוֹתוֹ הַדֶּרֶךְ – וְכָל כָּךְ הָיְתָה הַשְּׁכִינָה מִתְלַבֶּטֶת בִּשְׁבִילְכֶם לְמַהֵר בִּיאַתְכֶם לָאָרֶץ, וּבִשְׁבִיל שֶׁקִּלְקַלְתֶּם הֵסֵב אֶתְכֶם סְבִיבוֹת הַר שֵׂעִיר אַרְבָּעִים שָׁנָה (ע' ספרי):", "rashi_en": "אחד עשר יום מחרב ELEVEN DAYS JOURNEY FROM HOREB — Moses said to them: “See what you brought about! There is no route from Horeb to Kadesh-Barnea as short as the way through Mount Seir, and even that is a journey of eleven days. You, however, traversed it in three days!” — for you see that they journeyed from Horeb on the twentieth of Eyar, as it is said, (Numbers 10:11—12) “And it came to pass in the second year, in the second month, on the twentieth of the month, [the cloud went up and the children of Israel journeyed out of the desert of Sinai” (which is Horeb)] and on the twenty-ninth of Sivan they sent out the spies from Kadesh Barnea, (an interval of 40 days; cf. Taanit 29a); deduct from these the thirty days they spent at Kibroth Hataavah, where they ate the flesh “a month of days”, and seven days they spent at Hazeroth for Miriam to be shut up there as a leper, it follows that in three days they traversed all that way. — To such an extent did the Shechinah exert itself to hasten your coming to the land of Canaan, but because you became degenerate, He made you travel round about Mount Seir for forty years (Sifrei Devarim 2:2)."}, {"ch": 1, "v": 3, "aliyah": 1, "heb": "וַֽיְהִי֙ בְּאַרְבָּעִ֣ים שָׁנָ֔ה בְּעַשְׁתֵּֽי־עָשָׂ֥ר חֹ֖דֶשׁ בְּאֶחָ֣ד לַחֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠כֹ֠ל אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֹת֖וֹ אֲלֵהֶֽם׃", "onk": "וַהֲוָה בְּאַרְבְּעִין שְׁנִין בְּחַד עֲשַׂר יַרְחָא בְּחַד לְיַרְחָא מַלִּיל משֶׁה עִם בְּנֵי יִשְׂרָאֵל כְּכֹל דִּי פַקִּיד יְיָ יָתֵיהּ לְוָתְהוֹן:", "onk_en": "[Beginning] in the fortieth year, in the eleventh month, on the first of the month, Moshe addressed Bnei Yisroel with every detail that Adonoy had commanded him [to say] to them.", "pj": "וַהֲוָה לְסוֹף אַרְבְּעִין שְׁנִין בְּחַדְסַר יֶרַח הוּא יַרְחָא דִשְׁבַט בְּחַד בְּיַרְחָא מַלֵּיל משֶׁה עִם בְּנֵי יִשְרָאֵל כְּכָל דִּי פַקֵּיד יְיָ יָתֵיהּ לְוַתְהוֹן", "pj_en": "And it was at the end of forty years, in the eleventh month, the month of Shebat, on the first of the month, that Mosheh spake with the sons of Israel according to all that the Lord had given him commandment for them.", "tj": "וַהֲוָה בְּסוֹף אַרְבְּעִין שְׁנִין:", "tj_en": "And it was at the end of forty years.", "rashi": "<b>ויהי בארבעים שנה בעשתי עשר חדש באחד לחדש.<\/b> מְלַמֵּד שֶׁלֹּא הוֹכִיחָן אֶלָּא סָמוּךְ לַמִּיתָה; מִמִּי לָמַד? מִיַּעֲקֹב, שֶׁלֹּא הוֹכִיחַ אֶת בָּנָיו אֶלָּא סָמוּךְ לַמִּיתָה, אָמַר, רְאוּבֵן בְּנִי אֲנִי אוֹמֵר לְךָ מִפְּנֵי מָה לֹא הוֹכַחְתִּיךָ כָּל הַשָּׁנִים הַלָּלוּ, כְּדֵי שֶׁלֹּא תַנִּיחֵנִי וְתֵלֵךְ וְתִדְבַּק בְּעֵשָׂו אָחִי; וּמִפְּנֵי אַרְבָּעָה דְּבָרִים אֵין מוֹכִיחִין אֶת הָאָדָם אֶלָּא סָמוּךְ לַמִּיתָה, כְּדֵי שֶׁלֹּא יְהֵא מוֹכִיחוֹ וְחוֹזֵר וּמוֹכִיחוֹ, וְשֶׁלֹּא יְהֵא חֲבֵרוֹ רוֹאֵהוּ וּמִתְבַּיֵּשׁ מִמֶּנּוּ, כּוּ' כִּדְאִיתָא בְּסִפְרֵי. וְכֵן יְהוֹשֻׁעַ לֹא הוֹכִיחַ אֶת יִשְׂרָאֵל אֶלָּא סָמוּךְ לַמִּיתָה, וְכֵן שְׁמוּאֵל שֶׁנֶּאֱמַר (שמואל א י\"ב), \"הִנְנִי עֲנוּ בִי\", וְכֵן דָּוִד אֶת שְׁלֹמֹה בְנוֹ (מלכים א ב'):", "rashi_en": "ויהי בארבעים שנה בעשתי עשר חדש באחד לחדש AND IT CAME TO PASS IN THE FORTIETH YEAR, IN THE ELEVENTH MONTH, ON THE FIRST OF THE MONTH, [MOSES SPAKE] — This tells us that he reproved them only shortly before his death (Jewish tradition holds that Moses died on the seventh day of the twelfth month; cf. Megillah 13b). From whom did he learn this? From Jacob, who reproved his sons only shortly before his death. He said, “Reuben, my son, I will tell you why I have not reproved you for your unfitial conduct during all these years: it was in order that you should not leave me and go and join Esau, my wicked brother\". — And on account of four things one should not reprove a person except shortly before one's death: that one should not reprove him and again have to reprove him; and that his fellow whom he reproves should not, when he afterwards happens to see him, feel ashamed before him, etc.; as it is set forth in Siphre. And similarly, Joshua reproved Israel only shortly before his death (cf. Joshua 24:1—29), and so, too, Samuel, as it is said, (I Samuel 12:3) “Behold, testify against me\", and so, also, David reproved his son Solomon only shortly before his death (cf. 1 Kings 2:1—9)."}, {"ch": 1, "v": 4, "aliyah": 1, "heb": "אַחֲרֵ֣י הַכֹּת֗וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽאֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּחֶשְׁבּ֑וֹן וְאֵ֗ת ע֚וֹג מֶ֣לֶךְ הַבָּשָׁ֔ן אֲשֶׁר־יוֹשֵׁ֥ב בְּעַשְׁתָּרֹ֖ת בְּאֶדְרֶֽעִי׃", "onk": "בָּתַר דִּמְחָא יָת סִיחוֹן מַלְכָּא דֶאֱמֹרָאָה דְּיָתֵב בְּחֶשְׁבּוֹן וְיָת עוֹג מַלְכָּא <b>דְמַתְנָן<\/b> דְּיָתֵב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי:", "onk_en": "After he had smitten Sichon, King of the Emorites, who was living in Cheshbon; and Og, King of the Boshon [<b>Masnan<\/b>], who was living in Ashtoros, in Edrei.", "pj": "מִן בָּתַר דִּמְחָא יַת סִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה דִיתֵיב בְּחֶשְׁבּוֹן וְיַת עוֹג מַלְכָּא דְמַתְנַן דִּיתֵיב בְּעַשְׁתַּרְוָותָא בְּאֶדְרֶעָת", "pj_en": "After He had smitten Sihon king of the Amorites, who dwelt in Heshbon, and Og the king of Mathnan, who dwelt at Astarvata in Edrehath,", "tj": "", "tj_en": "", "rashi": "<b>אחרי הכתו.<\/b> אָמַר מֹשֶׁה אִם אֲנִי מוֹכִיחָם קֹדֶם שֶׁיִּכָּנְסוּ לִקְצֵה הָאָרֶץ, יֹאמְרוּ מַה לָּזֶה עָלֵינוּ? מַה הֵיטִיב לָנוּ? אֵינוֹ בָא אֶלָּא לְקַנְתֵּר וְלִמְצֹא עִלָּה, שֶׁאֵין בּוֹ כֹחַ לְהַכְנִיסֵנוּ לָאָרֶץ, לְפִיכָךְ הִמְתִּין עַד שֶׁהִפִּיל סִיחוֹן וְעוֹג לִפְנֵיהֶם וְהוֹרִישָׁם אֶת אַרְצָם וְאַחַר כָּךְ הוֹכִיחָן (ספרי):<br><br><b>סיחן אשר יושב בחשבון.<\/b> אִלּוּ לֹא הָיָה סִיחוֹן קָשֶׁה וְהָיָה שָׁרוּי בְּחֶשְׁבּוֹן, הָיָה קָשָׁה, שֶׁהַמְּדִינָה קָשָׁה, וְאִלּוּ הָיְתָה עִיר אַחֶרֶת וְסִיחוֹן שָׁרוּי בְּתוֹכָהּ, הָיְתָה קָשָׁה, שֶׁהַמֶּלֶךְ קָשֶׁה, עַל אַחַת כַּמָּה וְכַמָּה שֶׁהַמֶּלֶךְ קָשֶׁה וְהַמְּדִינָה קָשָׁה (שם):<br><br><b>אשר יושב בעשתרת.<\/b> הַמֶּלֶךְ קָשֶׁה וְהַמְּדִינָה קָשָׁה:<br><br><b>עשתרת.<\/b> הוּא לְשׁוֹן צוּקִין וְקֹשִׁי, כְּמוֹ \"עַשְׁתְּרֹת קַרְנַיִם\" (בראשית י\"ד) וְעַשְׁתָּרוֹת זֶה הוּא עַשְׁתְּרֹת קַרְנַיִם, שֶׁהָיוּ שָׁם רְפָאִים שֶׁהִכָּה אַמְרָפֶל, שֶׁנֶּאֱמַר (שם) \"וַיַּכּוּ אֶת רְפָאִים בְּעַשְׁתְּרֹת קַרְנַיִם\". וְעוֹג נִמְלַט מֵהֶם, וְהוּא שֶׁנֶּאֱמַר (שם) \"וַיָּבֹא הַפָּלִיט\", וְאוֹמֵר (דברים ג') \"כִּי רַק עוֹג מֶלֶךְ הַבָּשָׁן נִשְׁאַר מִיֶּתֶר הָרְפָאִים\":<br><br><b>באדרעי.<\/b> שֵׁם הַמַּלְכוּת:", "rashi_en": "אחרי הכתו AFTER HE HAD SMITTEN [SIHON] — Moses said: If I reprove them before they enter at least a part of the land, they will say, “What claim has this man upon us? What good has he ever conferred upon us? He only comes (his purpose is only) to vex us and to discover some pretext for leaving us in the wilderness, for he really has not the power to bring us into the land” On this account he waited until he had defeated Sihon and Og before them and had given them possession of their land — and only after that did he reprove them (Sifrei Devarim 3:2).<br><br>סיחן … אשר יושב בחשבון [AFTER HE HAD SMITTEN] SIHON … WHO DWELT IN HESHBON — Even if Sihon himself had not been difficult to defeat, but had resided at Heshbon, he would have been difficult to defeat, because the city was a difficult one to capture: and if it had been a matter of some other city, but Sihon had resided in it, it would have been difficult to capture, because its king, at least, would have been difficult to defeat. How much more was this so now when the king was difficult to defeat and the land difficult to capture (Sifrei Devarim 3:3; cf. Rashi on Numbers 21:23).<br><br>אשר יושב בעשתרת [AND OG] WHO DWELT AT ASHTAROTH — here, too, the king was difficult to defeat and the city difficult to capture (Sifrei Devarim 3:4).<br><br>עשתרת — This is an expression denoting rocks and anything hard, just as (Genesis 14:5) “Ashtaroth Karnaim”, (i.e. the hard rocks of Karnaim) (Sifrei Devarim 3:5)). And indeed this Ashtaroth is identical with Ashtaroth Karnaim where the Rephaim (the giants) were, whom Amraphel smote, as it is said, (Genesis 14:5) “And they smote the Rephaim in Ashtaroth Karnaim\". Og, alone, escaped of them, and that is the meaning of what is stated, (Genesis 14:13; cf. Rashi) \"And the one who escaped (הפליט) came\", for it further states, (Deuteronomy 3:11) \"For only Og, king of Bashan, remained of the remnant of the Rephaim\",<br><br>באדרעי IN EDREI — the name of the royal city."}, {"ch": 1, "v": 5, "aliyah": 1, "heb": "בְּעֵ֥בֶר הַיַּרְדֵּ֖ן בְּאֶ֣רֶץ מוֹאָ֑ב הוֹאִ֣יל מֹשֶׁ֔ה בֵּאֵ֛ר אֶת־הַתּוֹרָ֥ה הַזֹּ֖את לֵאמֹֽר׃", "onk": "בְּעִבְרָא דְּיַרְדְּנָא בְּאַרְעָא דְמוֹאָב שָׁרִי משֶׁה פָּרֵשׁ יָת <b>אוּלְפַן<\/b> אוֹרַיְתָא הָדָא לְמֵימָר:", "onk_en": "Across the Yardein in the land of Moav, Moshe began to elucidate [<b>the teachings of<\/b>] this Torah as follows:", "pj": "בְּעִיבְרָא דְיוֹרְדְּנָא בְּאַרְעָא דְמוֹאָב שׁוֹרֵי משֶׁה לְמַלְפָא יַת פִּתְגָמֵי אוֹרַיְיתָא הֲדָא לְמֵימָר", "pj_en": "beyond Jordan, in the land of Moab, began Mosheh to speak the words of this law, saying:", "tj": "", "tj_en": "", "rashi": "<b>הואיל.<\/b> הִתְחִיל, כְּמוֹ (בראשית י\"ח) \"הִנֵּה נָא הוֹאַלְתִּי\" (ע' ספרי):<br><br><b>באר את התורה.<\/b> בְּשִׁבְעִים לָשׁוֹן פֵּרְשָׁהּ לָהֶם (תנחומא; ע' סוטה ל\"ב):", "rashi_en": "הואיל means HE BEGAN, just as (Genesis 18:27) \"Behold, now I have begun (הואלתי)\" (cf. Sifrei Devarim 4:1).<br><br>באר את התורה [MOSES BEGAN] TO EXPLAIN THIS LAW — in the seventy languages of the ancient world did he explain it to them (Midrash Tanchuma, Devarim 2; Genesis Rabbah 49; cf. Sotah 32a and Rashi on Deuteronomy 27:8)."}, {"ch": 1, "v": 6, "aliyah": 1, "heb": "יְהֹוָ֧ה אֱלֹהֵ֛ינוּ דִּבֶּ֥ר אֵלֵ֖ינוּ בְּחֹרֵ֣ב לֵאמֹ֑ר רַב־לָכֶ֥ם שֶׁ֖בֶת בָּהָ֥ר הַזֶּֽה׃", "onk": "יְיָ אֱלָהָנָא מַלִּיל עִמָּנָא בְּחֹרֵב לְמֵימָר סַגִּי לְכוֹן דִּיתֶבְתּוּן בְּטוּרָא הָדֵין:", "onk_en": "Adonoy, our God, addressed us at Choreiv, saying, ‘‘Enough of your living at this mountain!", "pj": "יְיָ אֱלָהֵין מַלֵיל עִמָן וְלָא אֲנָא בְּאַנְפֵּי נַפְשִׁי בְּחוֹרֵב לְמֵימָר סַגִי לְכוֹן וְאִתְהַנִי לְכוֹן עַד הָאִידְנָא דְקַבֵּילְתּוּן בֵּיהּ אוֹרַיְיתָא וַעֲבַדְתּוּן בֵּיהּ מַשְׁכְּנָא וּמָנוֹי וְאַקֵימְתּוּן רַבָּנִין עֲלֵיכוֹן וּמַבְעַן בִּישׁ לְכוֹן לְאִיתְרָחָא בְּטַוְורָא הָדֵין", "pj_en": "The Lord our God spake with us (and not I, of my own mind) in Horeb, saying: It is enough for you, and hath been profitable for you until this time (during) which you have received the law, and have made the tabernacle and its vessels, and appointed your princes over you; but now it would be evil for you to tarry longer at this mount.", "tj": "", "tj_en": "", "rashi": "<b>רב לכם שבת.<\/b> כִּפְשׁוּטוֹ; וְיֵשׁ מִ\"אַ, הִרְבָּה לָכֶם גְדֻלָּה וְשָׂכָר עַל יְשִׁיבַתְכֶם בָּהָר הַזֶּה – עֲשִׂיתֶם מִשְׁכָּן, מְנוֹרָה, וְכֵלִים, קִבַּלְתֶּם תּוֹרָה, מִנִּיתֶם לָכֶם סַנְהֶדְרִין, שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת (ע' ספרי):", "rashi_en": "רב לכם שבת — Explain this according to its plain sense: YE HAVE DWELT LONG ENOUGH [IN THIS MOUNT]. — But there is an Agadic explanation: He has given you much distinction and reward for your having dwelt in this mount: you made the Tabernacle, the candlestick and the other sacred articles, you received the Torah, you appointed a Sanhedrin for yourselves, captains over thousands and captains over hundreds (cf. Sifrei Devarim 5:2)."}, {"ch": 1, "v": 7, "aliyah": 1, "heb": "פְּנ֣וּ&thinsp;<b>׀<\/b> וּסְע֣וּ לָכֶ֗ם וּבֹ֨אוּ הַ֥ר הָֽאֱמֹרִי֮ וְאֶל־כׇּל־שְׁכֵנָיו֒ בָּעֲרָבָ֥ה בָהָ֛ר וּבַשְּׁפֵלָ֥ה וּבַנֶּ֖גֶב וּבְח֣וֹף הַיָּ֑ם אֶ֤רֶץ הַֽכְּנַעֲנִי֙ וְהַלְּבָנ֔וֹן עַד־הַנָּהָ֥ר הַגָּדֹ֖ל נְהַר־פְּרָֽת׃", "onk": "אִתְפְּנוּ וְטוּלוּ לְכוֹן וְעוּלוּ לְטוּרָא דֶאֱמֹרָאָה וּלְכָל <b>מָגִירוֹהִי<\/b> בְּמֵישְׁרַיָּא בְטוּרָא וּבִשְׁפֶלְתָּא וּבִדְרוֹמָא וּבִסְפַר יַמָּא אַרְעָא דִכְנַעֲנָאָה וְלִבְנָן עַד נַהֲרָא רַבָּא נַהֲרָא פְרָת:", "onk_en": "Turn and travel for yourselves and arrive at the Emorite hill [region] and at all its neighbors [<b>habitable places<\/b>]—on the plain, on the mountain, and in the lowland, and in the Negev, and on the seacoast; the land of the Canaanites and the Lebanon, up to the great river, the Euphrates River.", "pj": "אִתְפְּנִיאוּ וְטוּלוּ לְכוֹן לַעֲרָד וְחוּרְמָה וְעוּלוּ לְטַוְורָא דֶאֱמוֹרָאָה וּלְוַת כָּל דַּיְירֵי עַמּוֹן וּמוֹאָב וְגַבְלָא בְּמֵישְׁרָא דְחוֹרְשָׁא בְּטַוְורָא בִּשְׁפֵיילְתָּא וּבְדָרוֹמָא וּבִסְפַר יַמָא אַשְׁקְלוּן וְקִיסְרִין אַרַע כְּנַעֲנָאָה עַד קַלְדוֹהִי וְלִבְנָן אֲתַר טַוְורֵי בֵּית מַקְדְּשָׁא עַד נַהֲרָא רַבָּא נַהֲרָא פְּרָת", "pj_en": "Turn you, and journey to Arad and Hormah, and go up to the mountain of the Amorites; and to the dwelling-places of Ammon, Moab, and Gebala, in the plains of the forests, in mountain and valley, and by the south on the shore of the sea, Ashkelon and Kiserin, the land of the Kenaanite unto Kaldohi, and Lebanon, the place of the mountain of the sanctuary, to the great river, the River Phrat.", "tj": "", "tj_en": "", "rashi": "<b>פנו וסעו לכם.<\/b> זוֹ דֶּרֶךְ עֲרָד וְחָרְמָה:<br><br><b>ובאו הר האמרי.<\/b> כְּמַשְׁמָעוֹ:<br><br><b>ואל כל שכניו.<\/b> עַמּוֹן וּמוֹאָב וְהַר שֵׂעִיר:<br><br><b>בערבה.<\/b> זֶה מִישׁוֹר שֶׁל יַעַר:<br><br><b>בהר.<\/b> זֶה הַר הַמֶּלֶךְ:<br><br><b>ובשפלה.<\/b> זוֹ שְׁפֵלַת דָּרוֹם:<br><br><b>ובנגב ובחוף הים.<\/b> אַשְׁקְלוֹן וְעַזָּה וְקֵיסָרִי וְכוּ' כִּדְאִיתָא בְּסִפְרֵי:<br><br><b>עד הנהר הגדל.<\/b> מִפְּנֵי שֶׁנִּזְכָּר עִם אֶרֶץ יִשְׂרָאֵל קוֹרְאוֹ גָּדוֹל, מְשַׁל הֶדְיוֹט אוֹמֵר \"עֶבֶד מֶלֶךְ מֶלֶךְ\", \"הִדַּבֵּק לַשַּׁחֲוָר וְיִשְׁתַּחֲווּ לְךָ\", ״קְרַב לְגַבֵּי דְהִינָא וְאִדַּהֵן\" (שבועות מ\"ז):", "rashi_en": "פנו וסעו לכם TURN YOU AND JOURNEY — this was the journey to Arad and Hormah mentioned in Numbers 21:1—3.<br><br>ובאו הר האמרי — Understand this according to what it literally implies.<br><br>ואל כל שכניו AND TO ALL ITS NEIGHBOURING PLACES — Ammon, and Moab, and Mount Seir.<br><br>בערבה IN THE PLAIN — this is the plain of the forest.<br><br>בהר IN THE MOUNTAIN — this is the King’s mountain.<br><br>ובשפלה AND IN THE LOW LAND — this is the low land of the south country.<br><br>ובנגב ובחוף הים AND IN THE SOUTH COUNTRY AND BY THE SEA COAST — Ashkelon and Gaza and Caesarea, etc., all as is stated in Sifrei Devarim 6:1.<br><br>עד הנהר הגדל TO THE GREAT RIVER [THE RIVER EUPHRATES] — Because it is mentioned in connection with the Land of Israel, it terms it \"great\". A popular proverb says: A king’s servant is a king, attach yourself to a captain and people will bow down to you; go near to an anointed (a distinguished) person and you become anointed (distinguished) yourself (cf. Rashi on Shevuot 47b and Genesis 15:18)."}, {"ch": 1, "v": 8, "aliyah": 1, "heb": "רְאֵ֛ה נָתַ֥תִּי לִפְנֵיכֶ֖ם אֶת־הָאָ֑רֶץ בֹּ֚אוּ וּרְשׁ֣וּ אֶת־הָאָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הֹוָ֠ה לַאֲבֹ֨תֵיכֶ֜ם לְאַבְרָהָ֨ם לְיִצְחָ֤ק וּֽלְיַעֲקֹב֙ לָתֵ֣ת לָהֶ֔ם וּלְזַרְעָ֖ם אַחֲרֵיהֶֽם׃", "onk": "חֲזֵי דִּיהָבִית קֳדָמֵיכוֹן יָת אַרְעָא עוּלוּ וְאַחֲסִינוּ יָת אַרְעָא דִּי קַיַּם יְיָ לַאֲבָהָתְכוֹן לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב לְמִתַּן לְהוֹן וְלִבְנֵיהוֹן בַּתְרֵיהוֹן:", "onk_en": "See, I have set the land before you; come and inherit the land that Adonoy swore to your forefathers, to Avrohom, to Yitzchok, and to Yaakov, to give them and their descendants after them.’’", "pj": "חֲמוֹן דִּי מְסָרִית קֳדָמֵיכוֹן יַת דַּיְירֵי אַרְעָא וְלָא תִצְטַרְכוּן לְמֵיטוּל זַיְינָא עוּלוּ וְאַחֲסִינוּ יַת אַרְעָא וְקָבְעוּ בָּהּ דִּפְטַיָא וּפַלְגוּהָא הֵי כְמָא דְקַיֵים לְאַבְהַתְכוֹן לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב לְמִתַּן לְהוֹן וְלִבְנֵיהוֹן בַּתְרֵיהוֹן", "pj_en": "See, I have given up the inhabitants of the land before you; nor shall it be needful to carry arms; go in and possess the land, and appoint the allotters, and divide it, even as the Lord sware to your fathers, to Abraham, Izhak, and Jakob, that He would give it unto them and their sons after them.", "tj": "", "tj_en": "", "rashi": "<b>ראה נתתי.<\/b> בְּעֵינֵיכֶם אַתֶּם רוֹאִים, אֵינִי אוֹמֵר לָכֶם מֵאֹמֶד וּמִשְּׁמוּעָה (ספרי):<br><br><b>באו ורשו.<\/b> אֵין מְעַרְעֵר בַּדָּבָר, וְאֵינְכֶם צְרִיכִים לְמִלְחָמָה, אִלּוּ לֹא שָׁלְחוּ מְרַגְּלִים לֹא הָיוּ צְרִיכִים לִכְלֵי זַיִן (ע' שם):<br><br><b>לאבתיכם.<\/b> לָמָּה הִזְכִּיר שׁוּב לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב? אֶלָּא אַבְרָהָם כְּדַאי לְעַצְמוֹ, יִצְחָק כְּדַאי לְעַצְמוֹ, יַעֲקֹב כְּדַאי לְעַצְמוֹ (שם):", "rashi_en": "ראה נתתי SEE, I HAVE GIVEN [THE LAND BEFORE THEE] — With your own eyes do you see this: I do not tell you this by conjecture or hearsay (Sifrei Devarim 7).<br><br>באו ורשו GO IN AND POSSESS [THE LAND] — There is no one who will contest the matter, and you will not need to wage war. Indeed, had they not sent the spies, but had trusted in God's promise, they would not have needed weapons of war (cf. Sifrei Devarim 7).<br><br>לאבתיכם [THE LAND WHICH THE LORD SWARE] UNTO YOUR FATHERS … [TO GIVE TO THEM] — Why does he further mention their names: to Abraham, to Isaac, and to Jacob? But it is to suggest the following: The merit of Abraham would itself suffice, that of Isaac would itself suffice, that of Jacob would itself suffice, that I should give the land to you (cf. Sifrei Devarim 8:1; see also Rashi on Leviticus 26:42)."}, {"ch": 1, "v": 9, "aliyah": 1, "heb": "וָאֹמַ֣ר אֲלֵכֶ֔ם בָּעֵ֥ת הַהִ֖וא לֵאמֹ֑ר לֹא־אוּכַ֥ל לְבַדִּ֖י שְׂאֵ֥ת אֶתְכֶֽם׃", "onk": "וַאֲמָרִית לְכוֹן בְּעִדָּנָא הַהִיא לְמֵימָר לֵית אֲנָא יָכִיל בִּלְחוֹדִי <b>לְסוֹבָרָא<\/b> יָתְכוֹן:", "onk_en": "I said to you at that time saying, ‘‘I cannot carry [<b>bear<\/b>] you by myself.", "pj": "וַאֲמָרִית לְכוֹן בְּעִידָנָא הַהִיא לְמֵימָר לֵיתָנָא שַׁבְקִינְכוֹן עַל דַּיָינָא חַד דַּאֲנָא לָא יָכִילְנָא בִּלְחוֹדִי לִמְסוֹבָרָא יַתְכוֹן", "pj_en": "And I spake to you at that time, saying: We will not leave you with but one judge, for I am not able to bear you alone.", "tj": "", "tj_en": "", "rashi": "<b>ואמר אלכם בעת ההוא לאמר.<\/b> מַהוּ לֵאמֹר? אָמַר לָהֶם מֹשֶׁה לֹא מֵעַצְמִי אֲנִי אוֹמֵר לָכֶם, אֶלָּא מִפִּי הַקָּבָּ\"ה (שם):<br><br><b>לא אוכל לבדי וגו'.<\/b> אֶפְשָׁר שֶׁלֹּא הָיָה מֹשֶׁה יָכוֹל לָדוּן אֶת יִשְׂרָאֵל? אָדָם שֶׁהוֹצִיאָם מִמִּצְרַיִם, וְקָרַע לָהֶם אֶת הַיָּם, וְהוֹרִיד אֶת הַמָּן, וְהֵגִיז הַשְּׂלָו, לֹא הָיָה יָכוֹל לְדוּנָם? אֶלָּא כָּךְ אָמַר לָהֶם, <b>ה' אלהיכם הרבה אתכם<\/b> – הִגְדִּיל וְהֵרִים אֶתְכֶם עַל דַּיָּנֵיכֶם, נָטַל אֶת הָעֹנֶשׁ מִכֶּם וּנְתָנוֹ עַל הַדַּיָּנִין; וְכֵן אָמַר שְׁלֹמֹה (מלכים א ג') \"כִּי מִי יוּכַל לִשְׁפֹּט אֶת עַמְּךָ הַכָּבֵד הַזֶּה\"; אֶפְשָׁר מִי שֶׁכָּתוּב בּוֹ (שם ה') \"וַיֶּחְכַּם מִכָּל הָאָדָם\", אוֹמֵר מִי יוּכַל לִשְׁפֹּט? אֶלָּא כָּךְ אָמַר שְׁלֹמֹה, אֵין דַּיָּנֵי אֻמָּה זוֹ כְדַיָּנֵי שְׁאָר הָאֻמּוֹת, שֶׁאִם דָּן וְהוֹרֵג וּמַכֶּה וְחוֹנֵק וּמַטֶּה אֶת דִּינוֹ וְגוֹזֵל אֵין בְּכָךְ כְּלוּם, אֲנִי אִם חִיַּבְתִּי מָמוֹן שֶׁלֹּא כַדִּין, נְפָשׁוֹת אֲנִי נִתְבָּע, שֶׁנֶּאֱמַר (משלי כ\"ב) \"וְקָבַע אֶת קֹבְעֵיהֶם נָפֶשׁ\" (ספרי; סנהדרין ז'):", "rashi_en": "ואמר אלכם בעת ההוא לאמר AND I SPAKE UNTO YOU AT THAT TIME, SAYING — What is the force of לאמר, (lit., to say. i.e. being bidden to say)? Moses, in effect, said unto them: Not of myself do I tell you that I am not able to bear you, but by the bidding of the Holy One, blessed be He (Sifrei Devarim 9:1),<br><br>לא אוכל לבדי וגו׳ I AM NOT ABLE [TO BEAR YOU] ALONE — Is it possible that Moses was not able to judge Israel? The man who brought them forth from Egypt, and divided the sea for them, and made the Manna fall, and collected the quails, was not he able to judge them?! But thus did he say unto them, ה' אלהיכם הרבה אתכם THE LORD YOUR GOD HATH MADE YOU GREAT (הרבה) — He has made you superior to and has placed you higher than your judges, inasmuch as He takes the punishment off you and places it upon your judges if they could have prevented your wrongdoing and did not do so. Solomon made a similar statement (namely that the Jewish judge may easily make himself liable to punishment): “For who is able to judge this thy grievous people?” (1 Kings 3:9). Is it possible that he of whom it is said, (1 Kings 5:11) “He was wiser than all men”, should say, \"Who is able to judge”? But this did Solomon mean: The judges of this people are not like the judges of other peoples, for if one of the latter gives judgment and wrongly sentences a person to death by the sword, or to flagellation, or to strangulation, or wrests his justice and thus robs him of his due, it is regarded as of little importance (lit., there is nothing at all in that); I, however, if I unjustly sentence a person to pay even a sum of money, my life is required of me, as it is said, (Proverbs 22:23) “And He robs of their life those who rob them\" (Sifrei Devarim 9:2; Sanhedrin 7a)."}, {"ch": 1, "v": 10, "aliyah": 1, "heb": "יְהֹוָ֥ה אֱלֹהֵיכֶ֖ם הִרְבָּ֣ה אֶתְכֶ֑ם וְהִנְּכֶ֣ם הַיּ֔וֹם כְּכוֹכְבֵ֥י הַשָּׁמַ֖יִם לָרֹֽב׃", "onk": "יְיָ אֱלָהָכוֹן אַסְגֵּי יָתְכוֹן וְהָא אִיתֵיכוֹן יוֹמָא דֵין כְּכוֹכְבֵי שְׁמַיָּא לְמִסְגֵּי:", "onk_en": "Adonoy, your God, has multiplied you, and you are today as numerous the stars in the sky.", "pj": "מֵימְרָא דַיְיָ אֱלָהָכוֹן אַסְגֵי יַתְכוֹן וְהָאִיתֵיכוֹן יוֹמָא דֵין הֵי כְּכוֹכְבֵי שְׁמַיָא לִסְגֵי", "pj_en": "The Word of the Lord our God hath multiplied you; and, behold, you are today as the stars of heaven for multitude.", "tj": "", "tj_en": "", "rashi": "<b>והנכם היום ככוכבי השמים.<\/b> וְכִי כְכוֹכְבֵי הַשָּׁמַיִם הָיוּ בְּאוֹתוֹ הַיּוֹם, וַהֲלֹא לֹא הָיוּ אֶלָּא שִׁשִּׁים רִבּוֹא, מַהוּ וְהִנְּכֶם הַיּוֹם? הִנְּכֶם מְשׁוּלִים כַּיּוֹם – קַיָּמִים לְעוֹלָם כַּחַמָּה וְכַלְּבָנָה וְכַכּוֹכָבִים (עי' ספרי):", "rashi_en": "והנכם היום ככוכבי השמים AND, BEHOLD, YE ARE THIS DAY AS THE STARS OF THE HEAVEN — But were they that day as the stars of the heaven? Were they not, indeed, only sixty myriads? What, then, is the meaning of “And, behold, ye are this day (היום lit., the day)\"? It means: Behold ye may be compared to the day (the sun), existing for ever just as the sun and the moon and the stars (cf. Sifrei Devarim 10:1)."}, {"ch": 1, "v": 11, "aliyah": 2, "heb": "יְהֹוָ֞ה אֱלֹהֵ֣י אֲבֽוֹתֵכֶ֗ם יֹסֵ֧ף עֲלֵיכֶ֛ם כָּכֶ֖ם אֶ֣לֶף פְּעָמִ֑ים וִיבָרֵ֣ךְ אֶתְכֶ֔ם כַּאֲשֶׁ֖ר דִּבֶּ֥ר לָכֶֽם׃", "onk": "יְיָ אֱלָהָא דַאֲבָהָתְכוֹן יוֹסֵף עֲלֵיכוֹן כְּוָתְכוֹן אֲלַף זִמְנִין וִיבָרֵךְ יָתְכוֹן כְּמָא דִי מַלִּיל לְכוֹן:", "onk_en": "Adonoy, God of your forefathers, will add to you one thousandfold, and will bless you as He spoke about you.", "pj": "יְיָ אֱלָהָא דְאַבְהַתְכוֹן יוֹסֵף עֲלֵיכוֹן כְּוַותְכוֹן אֶלֶף זִמְנִין מְטוּל בִּרְכָתִי דָא וִיבָרֵךְ יַתְכוֹן בְּלָא סְכוּמָא הֵיכְמָא דְמַלֵּיל לְכוֹן", "pj_en": "The Lord God of your fathers increase you a thousand fold on account of this my benediction, and bless you beyond numbering as He hath said unto you.", "tj": "", "tj_en": "", "rashi": "<b>יסף עליכם ככם אלף פעמים.<\/b> מַהוּ שׁוּב <b>ויברך אתכם כאשר דבר לכם<\/b>? אֶלָּא אָמְרוּ לוֹ, מֹשֶׁה אַתָּה נוֹתֵן קִצְבָּה לְבִרְכוֹתֵינוּ? כְּבָר הִבְטִיחַ הַקָּבָּ\"ה אֶת אַבְרָהָם \"אֲשֶׁר אִם יוּכַל אִישׁ לִמְנוֹת וְגוֹ'\" (בראשית י\"ג), אָמַר לָהֶם זוֹ מִשֶּׁלִּי הִיא, אֲבָל הוּא יְבָרֵךְ אֶתְכֶם כַּאֲשֶׁר דִּבֶּר לָכֶם (ספרי):", "rashi_en": "יסף עליכם ככם אלף פעמים MAY HE ADD TO YOU A THOUSAND TIMES AS MANY MORE AS YE ARE — What is the force of saying further: ויברך אתכם כאשר דבר לכם AND MAY HE BLESS YOU EVEN AS HE HATH SPOKEN CONCERNING YOU? But the explanation is: They said to him, “Moses, you are setting a limit to our blessings (only a thousand times)! The Holy One, blessed be He, has already made a boundless promise to Abraham (Genesis 13:16) “… if one can count [the dust of the earth, then can thy seed also be counted]\"! Moses replied to them: This (a thousand times) is from me (it is my blessing); but may He bless you even as He hath spoken concerning you!\" (Sifrei Devarim 11)."}, {"ch": 1, "v": 12, "aliyah": 2, "heb": "אֵיכָ֥ה אֶשָּׂ֖א לְבַדִּ֑י טׇרְחֲכֶ֥ם וּמַֽשַּׂאֲכֶ֖ם וְרִֽיבְכֶֽם׃", "onk": "אֶכְדֵּין <b>אֵסוֹבַר<\/b> בִּלְחוֹדִי טָרְחֲכוֹן <b>וְעִסְקֵיכוֹן וְדִינְכוֹן<\/b>:", "onk_en": "How can I carry [<b>bear<\/b>] alone your troublesomeness, your burdensomeness [<b>business<\/b>], and your contentiousness [<b>judgments<\/b>]?", "pj": "הֵיךְ אֲנָא יָכִיל בִּלְחוֹדִי לְמִסְבּוֹל טַרְחוֹת אַפְקַרְסוּתְכוֹן וּדְמִחַשְׁלִין עֲלֵי בִישְׁתָּא וּמִילֵי דִיגַנְבוּן דְּמַפְקִין סִלְעָא לְאַפּוֹקֵי תְּרֵי", "pj_en": "But how can I alone sustain the labour, your sensuality, your evil thoughts, your words of strife, your offering one shekel for two?", "tj": "", "tj_en": "", "rashi": "<b>איכה אשא לבדי.<\/b> אִם אֹמַר לְקַבֵּל שָׂכָר, לֹא אוּכַל, זוֹ הִיא שֶׁאָמַרְתִּי לָכֶם לֹא מֵעַצְמִי אֲנִי אוֹמֵר לָכֶם אֶלָּא מִפִּי הַקָּבָּ\"ה:<br><br><b>טרחכם.<\/b> מְלַמֵּד שֶׁהָיוּ יִשְׂרָאֵל טַרְחָנִין – הָיָה אֶחָד מֵהֶם רוֹאֶה אֶת בַּעַל דִּינוֹ נוֹצֵחַ בַּדִּין, אוֹמֵר יֵשׁ לִי עֵדִים לְהָבִיא, יֵשׁ לִי רְאָיוֹת לְהָבִיא, מוֹסִיף אֲנִי עֲלֵיכֶם דַּיָּנִין:<br><br><b>ומשאכם.<\/b> מְלַמֵּד שֶׁהָיוּ אֶפִּיקוֹרְסִין, הִקְדִּים מֹשֶׁה לָצֵאת, אָמְרוּ מָה רָאָה בֶן עַמְרָם לָצֵאת? שֶׁמָּא אֵינוֹ שָׁפוּי בְּתוֹךְ בֵּיתוֹ; אֵחַר לָצֵאת, אָמְרוּ מָה רָאָה בֶן עַמְרָם שֶׁלֹּא לָצֵאת? מָה אַתֶּם סְבוּרִים? יוֹשֵׁב וְיוֹעֵץ עֲלֵיכֶם עֵצוֹת רָעוֹת וְחוֹשֵׁב עֲלֵיכֶם מַחֲשָׁבוֹת:<br><br><b>ורבכם.<\/b> מְלַמֵּד שֶׁהָיוּ רוֹגְנִים (ספרי):", "rashi_en": "איכה אשא לבדי HOW CAN I MYSELF ALONE BEAR [YOUR CUMBRANCE, etc.]? — If I were to say, \"I will do so in order to receive a reward for it\", I may not do so. This is what I have already said to you: not of myself do I tell you that I am not able to bear you, but by the bidding of the Holy One, blessed be He (see Rashi v. 9).<br><br>טרחכם YOUR CUMBRANCE — Moses' use of this word regarding them teaches us that the Israelites were troublesome: if one of them perceived that his opponent in a law suit was about to be victor in the case he would say: I have witnesses to bring, further proof to adduce, I will add judges to you who are sitting (Sifrei Devarim 12:1) .<br><br>ומשאכם YOUR BURDEN — this teaches that they were Epicorsim (that they treated the judges with scant respect): if Moses went forth early from his tent they said, “Why does the son of Amram leave so early? Perhaps he is not at ease at home?\" If he left late, they said, “What do you think? He is sitting and devising evil schemes against you, and is plotting against you\" (Sifrei Devarim 12:2).<br><br>וריבכם AND YOUR STRIFE — this teaches that they were always contentious (Sifrei Devarim 12:3)."}, {"ch": 1, "v": 13, "aliyah": 2, "heb": "הָב֣וּ לָ֠כֶ֠ם אֲנָשִׁ֨ים חֲכָמִ֧ים וּנְבֹנִ֛ים וִידֻעִ֖ים לְשִׁבְטֵיכֶ֑ם וַאֲשִׂימֵ֖ם בְּרָאשֵׁיכֶֽם׃", "onk": "הָבוּ לְכוֹן גֻּבְרִין חַכִּימִין וְסוּכְלְתָנוּן וּמַדְּעָן לְשִׁבְטֵיכוֹן <b>וֶאֱמַנִּנּוּן רֵישִׁין עֲלֵיכוֹן<\/b>:", "onk_en": "Provide yourselves men, wise and understanding and renowned to your tribes, and I will designate them your leaders [<b>appoint them to be chiefs over you<\/b>].’’", "pj": "זַמְנוּ לְכוֹן גּוּבְרִין חַכִּימִין וְסוּכְלְתָנוּן מֵרַעֲיוֹנֵיהוֹן וּמָארֵי מַנְדְּעָא לְשִׁבְטֵיכוֹן וְאֵימַנִינוּן רֵישִׁין עֲלֵיכוֹן", "pj_en": "Present, then, from among you wise men, prudent in their thinking, men of wisdom, by your tribes, and I will appoint them to be chiefs over you.", "tj": "", "tj_en": "", "rashi": "<b>הבו לכם.<\/b> הַזְמִינוּ עַצְמְכֶם לַדָּבָר:<br><br><b>אנשים.<\/b> וְכִי תַעֲלֶה עַל דַּעְתְּךָ נָשִׁים, מַה תַּ\"לֹ אֲנָשִׁים? צַדִּיקִים, כְּסוּפִים:<br><br><b>חכמים ונבנים.<\/b> מְבִינִים דָבָר מִתּוֹךְ דָּבָר; זוֹ הִיא שֶׁשָּׁאַל אֲרִיּוֹס אֶת רַבִּי יוֹסֵי מַה בֵּין חֲכָמִים לִנְבוֹנִים? חָכָם דּוֹמֶה לְשֻׁלְחָנִי עָשִׁיר, כְּשֶׁמְּבִיאִין לוֹ דִּינָרִין לִרְאוֹת רוֹאֶה, וּכְשֶׁאֵין מְבִיאִין לוֹ יוֹשֵׁב וְתוֹהֵא, נָבוֹן דּוֹמֶה לְשֻׁלְחָנִי תַּגָּר, כְּשֶׁמְּבִיאִין לוֹ מָעוֹת לִרְאוֹת רוֹאֶה, וּכְשֶׁאֵין מְבִיאִין לוֹ, הוּא מְחַזֵּר וּמֵבִיא מִשֶּׁלּוֹ (ספרי):<br><br><b>וידעים לשבטיכם.<\/b> שֶׁהֵם נִכָּרִים לָכֶם, שֶׁאִם בָּא לְפָנַי מְעֻטָּף בְּטַלִּיתוֹ, אֵינִי יוֹדֵעַ מִי הוּא וּמֵאֵי זֶה שֵׁבֶט הוּא, וְאִם הָגוּן הוּא, אֲבָל אַתֶּם מַכִּירִין בּוֹ, שֶׁאַתֶּם גִּדַּלְתֶּם אוֹתוֹ, לְכָךְ נֶאֱמַר וִידֻעִים לְשִׁבְטֵיכֶם (ספרי):<br><br><b>בראשיכם.<\/b> רָאשִׁים וּמְכֻבָּדִים עֲלֵיכֶם – שֶׁתִּהְיוּ נוֹהֲגִין בָּהֶם כָּבוֹד וְיִרְאָה:<br><br><b>ואשמם.<\/b> חָסֵר יוֹ\"ד, לִמֵּד שֶׁאַשְׁמוֹתֵיהֶם שֶׁל יִשְׂרָאֵל תְּלוּיוֹת בְּרָאשֵׁי דַּיָּנֵיהֶם, שֶׁהָיָה לָהֶם לִמְחוֹת וּלְכַוֵּן אוֹתָם לַדֶּרֶךְ הַיְשָׁרָה (ספרי):", "rashi_en": "הבו לכם means GET YOURSELVES READY for the matter (cf. Rashi on Genesis 11:3).<br><br>אנשים MEN — But would it enter your mind that he would take women? Why then does it state here men? It means that he should take righteous, desirable men (cf. Sifrei Devarim 13:2).<br><br>חכמים ונבנים WISE AND UNDERSTANDING [MEN] — i.e. men who can understand a matter out of (i.e. by comparison with) another matter. — This is what Arius asked R. Jose: what is the difference between wise men and understanding men? A wise man is like a rich money changer: when people bring him dinars to examine (to value) he examines them; and when they do not bring to him, he sits and does nothing (he does not go out to seek any). An understanding man, however, is like a merchant money changer: when they bring him coins to examine, he examines them; and when they do not bring to him, he goes about and brings of his own money (i.e. he himself buys coins) (cf. Sifrei Devarim 13:3).<br><br>וידעים לשבטיכם AND [MEN] KNOWN AMONGST YOUR TRIBES — i.e. men who are known to you. For if he were to come before me wrapped in his robe, “I\" would not know who he is and of what tribe he is, and whether he is fitted for the office: but you know him for you have been brought up with him. On this account it states: known amongst your tribes (Sifrei Devarim 13:4).<br><br>בראשיכם [AND I WILL PLACE THEM] AT YOUR HEADS — as chiefs and persons honoured by you., i.e., that ye should pay them respect and reverence.<br><br>ואשמם — This word lacks the letter י (after the ש: our editions, however, have it): this teaches that Israel's transgressions (אשם) are placed upon the heads of their judges, because it is their duty to prevent them from sinning, and to direct them into the right path (Sifrei Devarim 13:6)."}, {"ch": 1, "v": 14, "aliyah": 2, "heb": "וַֽתַּעֲנ֖וּ אֹתִ֑י וַתֹּ֣אמְר֔וּ טֽוֹב־הַדָּבָ֥ר אֲשֶׁר־דִּבַּ֖רְתָּ לַעֲשֽׂוֹת׃", "onk": "וַאֲתֶבְתּוּן יָתִי וַאֲמַרְתּוּן תַּקִּין פִּתְגָּמָא דִּי מַלֶּלְתָּא לְמֶעְבָּד:", "onk_en": "You replied to me and said, ‘‘[It is a] good thing [<b>right<\/b>] that you said to do.’’", "pj": "וְאַתֵיבְתִּין יָתִי וַאֲמַרְתּוּן תַּקִּין פִּתְגָמָא דְמַלֵּילְתָּא לְמֶעֱבַד", "pj_en": "And you answered me and said: The thing that thou hast spoken it is right for us to do.", "tj": "", "tj_en": "", "rashi": "<b>ותענו אתי וגו'.<\/b> חֲלַטְתֶּם אֶת הַדָּבָר לַהֲנָאַתְכֶם; הָיָה לָכֶם לְהָשִׁיב, רַבֵּנוּ מֹשֶׁה, מִמִּי נָאֶה לִלְמֹד, מִמְּךָ אוֹ מִתַּלְמִידְךָ? לֹא מִמְּךָ שֶׁנִּצְטַעַרְתָּ עָלֶיהָ? אֶלָּא יָדַעְתִּי מַחְשְׁבוֹתֵיכֶם, הֱיִיתֶם אוֹמְרִים עַכְשָׁו יִתְמַנּוּ עָלֵינוּ דַּיָּנִין הַרְבֵּה, אִם אֵין מַכִּירֵנוּ, אָנוּ מְבִיאִין לוֹ דוֹרוֹן וְהוּא נוֹשֵׂא לָנוּ פָנִים (שם):<br><br><b>לעשות.<\/b> אִם הָיִיתִי מִתְעַצֵּל, אַתֶּם אוֹמְרִים עֲשֵׂה מְהֵרָה (שם):", "rashi_en": "ותענו אתי וגו׳ AND YE ANSWERED ME, etc. — You at once decided the matter to your benefit. You should really have replied: Our teacher, Moses! From whom is it more fitting to learn, from you or from your disciple? Is it not from you who have taken such pains about it? But I knew your thoughts: you said, “Many judges will now be appointed over us; if one of them does not happen to be an acquaintance of ours, we shall bring him a gift and he will show us favour (Sifrei Devarim 14).<br><br>לעשות TO DO — If I showed myself remiss, you said: act quickly (Sifrei Devarim 14)."}, {"ch": 1, "v": 15, "aliyah": 2, "heb": "וָאֶקַּ֞ח אֶת־רָאשֵׁ֣י שִׁבְטֵיכֶ֗ם אֲנָשִׁ֤ים חֲכָמִים֙ וִֽידֻעִ֔ים וָאֶתֵּ֥ן אוֹתָ֛ם רָאשִׁ֖ים עֲלֵיכֶ֑ם שָׂרֵ֨י אֲלָפִ֜ים וְשָׂרֵ֣י מֵא֗וֹת וְשָׂרֵ֤י חֲמִשִּׁים֙ וְשָׂרֵ֣י עֲשָׂרֹ֔ת וְשֹׁטְרִ֖ים לְשִׁבְטֵיכֶֽם׃", "onk": "וּדְבָרִית יָת רֵישֵׁי שִׁבְטֵיכוֹן גֻּבְרִין חַכִּימִין וּמַדְּעָן <b>וּמַנֵּתִי<\/b> יָתְהוֹן רֵישִׁין עֲלֵיכוֹן רַבָּנֵי אַלְפִין וְרַבָּנֵי מָאֲוָתָא וְרַבָּנֵי חַמְשִׁין וְרַבָּנֵי עִשּׂוֹרְיָתָא וְסָרְכִין לְשִׁבְטֵיכוֹן:", "onk_en": "I took the leaders of your tribes, men wise and renowned, and designated [<b>appointed<\/b>] them leaders over you: masters of thousands and masters of hundreds, and masters of fifties and masters of tens, and court officers for your tribes.", "pj": "וְדַבָּרִית יַת רֵישֵׁי שִׁבְטֵיכוֹן וְאוֹרַכְתִּנּוּן בְּמִלַיָא גּוּבְרִין חַכִּימִין וּמָרֵי מַנְדְּעָא וְסוּכְלְתָנִין מֵרַעֲיוֹנֵיהוֹן לָא אַשְׁכָּחִית וּמְנִיתֵיתוּן רֵישֵׁי עֲלֵיכוֹן רַבָּנֵי אַלְפִין רַבָּנֵי מַאֲוָותָא רַבָּנֵי חַמְשִׁין תְּרֵיסַר אַלְפִין רַבָּנֵי עִשַרְיָיתָא שִׁית רִיבְוָון וְסַרְכִין לְשִׁבְטֵיכוֹן", "pj_en": "So I took the chiefs of your tribes, and moved them kindly with words; wise men, masters of knowledge, but prudent in their thoughts, I found not; and I appointed them chiefs over you, rabbans of thousands, of hundreds, of fifties; twelve thousand rabbans of tens, six myriads, officers of your tribes.", "tj": "", "tj_en": "", "rashi": "<b>ואקח את ראשי שבטיכם.<\/b> מְשַׁכְתִּים – אַשְׁרֵיכֶם, עַל מִי בָּאתֶם לְהִתְמַנּוֹת? עַל בְּנֵי אַבְרָהָם יִצְחָק וְיַעֲקֹב, עַל בְּנֵי אָדָם שֶׁנִּקְרְאוּ אַחִים וְרֵעִים, חֵלֶק וְנַחֲלָה, וְכָל לְשׁוֹן חִבָּה (שם):<br><br><b>אנשים חכמים וידעים.<\/b> אֲבָל נְבוֹנִים לֹא מָצָאתִי; זוֹ אַחַת מִשֶּׁבַע מִדּוֹת שֶׁאָמַר יִתְרוֹ לְמֹשֶׁה וְלֹא מָצָא אֶלָּא שָׁלוֹשׁ, <b>אנשים<\/b> צַדִּיקִים, <b>חכמים, וידעים<\/b> (שם):<br><br><b>ראשים עליכם.<\/b> שֶׁתִּנְהֲגוּ בָהֶם כָּבוֹד, רָאשִׁים בְּמֶקַח, רָאשִׁים בְּמִמְכָּר, רָאשִׁים בְּמַשָּׂא וּמַתָּן, נִכְנָס אַחֲרוֹן וְיוֹצֵא רִאשׁוֹן (שם):<br><br><b>שרי אלפים.<\/b> אֶחָד מְמֻנֶּה עַל אֶלֶף:<br><br><b>שרי מאות.<\/b> אֶחָד מְמֻנֶּה עַל מֵאָה:<br><br><b>ושטרים.<\/b> מִנִּיתִי עֲלֵיכֶם <b>לשבטיכם<\/b> – אֵלּוּ הַכּוֹפְתִין וְהַמַּכִּין בִּרְצוּעָה עַל פִּי הַדַּיָּנִין (עי' שם):", "rashi_en": "ואקח את ראשי שבטיכם SO I TOOK THE HEADS OF YOUR TRIBES — I took them by fine words: Happy are you! Over whom are you about to be appointed? Over the sons of Abraham, Isaac and Jacob — over the sons of people who are called God's brethren and friends, God's portion and inheritance and to whom is applied every other expression denoting affection (Sifrei Devarim 15:1; cf. Targum Jonathan).<br><br>אנשים חכמים וידעים [AND I TOOK] MEN, WISE AND KNOWN — but understanding men I could not find (Nedarim 20b). This, too, was one of the seven qualifications which Jethro mentioned to Moses, but he found only three: men, i.e. righteous men, wise and known (Sifrei Devarim 15:2).<br><br>ראשים עליכם [AND I MADE THEM] HEADS OVER YOU — i.e. that you should pay them respect — regard them as first in buying, first in selling, first in all matters of business — coming into the Synagogue and House of Study last and leave first (so that all should rise out of respect) (cf. Sifrei Devarim 15:3).<br><br>שרי אלפים means, one officer who is appointed over one thousand.<br><br>שרי מאות means, one who is appointed over one hundred.<br><br>ושטרים AND COURT-OFFICERS — i.e., and also I appointed court-officers over you,  לשבטיכם ACCORDING TO YOUR TRIBES — these are they who bind and flog with the lash at the bidding of the judges (cf. Sifrei Devarim 15:5)."}, {"ch": 1, "v": 16, "aliyah": 2, "heb": "וָאֲצַוֶּה֙ אֶת־שֹׁ֣פְטֵיכֶ֔ם בָּעֵ֥ת הַהִ֖וא לֵאמֹ֑ר שָׁמֹ֤עַ בֵּין־אֲחֵיכֶם֙ וּשְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין־אִ֥ישׁ וּבֵין־אָחִ֖יו וּבֵ֥ין גֵּרֽוֹ׃", "onk": "וּפַקֵּדִית יָת דַּיָנֵיכוֹן בְּעִדָּנָא הַהִיא לְמֵימָר שְׁמָעוּ בֵּין אֲחֵיכוֹן וּתְדוּנוּן <b>קוּשְׁטָא<\/b> בֵּין גַּבְרָא וּבֵין אֲחוּהִי וּבֵין גִּיּוֹרֵיהּ:", "onk_en": "I commanded your judges at that time, to say, ‘‘Listen between your brothers and you are to judge right between a man and his brother and between his complainant.", "pj": "וּפַקֵּדִית יַת דַּיָינֵיכוֹן בְּעִידָנָא הַהִיא יַת סִדְרֵי דִינַיָא לְמֵימָר קַבִּילוּ מִן אֲחוּכוֹן דְּלָא יְמַלֵּיל חָד כָּל מִילוֹי וְחָד מְקַטַע מִילוֹי וּמִדִּשְׁמַעֲתּוּן מִלֵּיהוֹן לֵית אֶפְשַׁר לְכוֹן דְּלָא לְמִדַנְהוֹן וּתְדוּנוּן דִּינָא בִּקְשׁוֹט וּפְשָׁרוּת שְׁלָמָא בֵּין גַּבְרָא לְאָחוֹי וּבֵין מַאן דְּמֶאֱגַר מִילֵי דִינִין", "pj_en": "And I charged your judges at that time with the orders of judgments, saying: So hear your brethren that one may not (be permitted to) speak all his words, while another is compelled to cut his words short; and so hearken to their words, as that it may be impossible for you not to judge them, and deliver judgment in truth, and to resolve (a matter) completely between a man and his brother, and between him who hireth words of litigation.", "tj": "", "tj_en": "", "rashi": "<b>ואצוה את שפטיכם.<\/b> אָמַרְתִּי לָהֶם הֱווּ מְתוּנִין בַּדִּין – אִם בָּא דִּין לְפָנֶיךָ פַּעַם אַחַת, שְׁתַּיִם, וְשָׁלוֹשׁ, אַל תֹּאמַר כְּבָר בָּא דִּין זֶה לְפָנַי פְּעָמִים הַרְבֵּה, אֶלָּא הֱיוּ נוֹשְׂאִים וְנוֹתְנִים בּוֹ (שם):<br><br><b>בעת ההוא.<\/b> מִשֶּׁמִּנִּיתִים אָמַרְתִּי לָהֶם אֵין עַכְשָׁיו כִּלְשֶׁעָבַר, לְשֶׁעָבַר הֱיִיתֶם בִּרְשׁוּת עַצְמְכֶם, עַכְשָׁו הֲרֵי אַתֶּם מְשֻׁעְבָּדִים לַצִּבּוּר (שם):<br><br><b>שמע.<\/b> לְשׁוֹן הֹוֶה, אודנ\"ט בְּלַעַז, כְּמוֹ זָכוֹר, שָׁמוֹר:<br><br><b>ובין גרו.<\/b> זֶה בַּעַל דִּינוֹ שֶׁאוֹגֵר עָלָיו דְּבָרִים; דָּ\"אַ <b>ובין גרו<\/b>, אַף עַל עִסְקֵי דִּירָה בֵּין חֲלֻקַּת אַחִים, אֲפִלּוּ בֵּין תַּנּוּר לְכִירַיִם (שם; סנהדרין ז'):", "rashi_en": "ואצוה את שפטיכם AND I COMMANDED YOUR JUDGES — I said to them: be deliberate in judgment: if a certain point of law comes before you once, twice, three times, do not say, \"This point of law has already come before me several times”, but discuss it well on that occasion also (Sifrei Devarim 16:1).<br><br>בעת ההוא [AND I COMMANDED YOUR JUDGES] AT THAT TIME — As soon as I appointed them, I said to them, \"It is not now as heretofore: heretofore you were your own masters (lit., under your own control), now you are in the service of the Community!” (Sifrei Devarim 16:2).<br><br>שמע — This grammatical form expresses constant doing: oyant in old French, be hearing, just as זכור and שמור (see Rashi on Numbers 25:17).<br><br>ובין גרו AND BETWEEN HIS גר — this is his opponent in the lawsuit who merely heaps up (אוגר) words against him. Another explanation of AND BETWEEN HIS גר — also in a matter concerning a dwelling house (גור = to dwell), — in the division of property amongst brothers, even if it be a dispute about an oven and a kitchen range (cf. Sifrei Devarim 16:8-9; Sanhedrin 7b)."}, {"ch": 1, "v": 17, "aliyah": 2, "heb": "לֹֽא־תַכִּ֨ירוּ פָנִ֜ים בַּמִּשְׁפָּ֗ט כַּקָּטֹ֤ן כַּגָּדֹל֙ תִּשְׁמָע֔וּן לֹ֤א תָג֙וּרוּ֙ מִפְּנֵי־אִ֔ישׁ כִּ֥י הַמִּשְׁפָּ֖ט לֵאלֹהִ֣ים ה֑וּא וְהַדָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִכֶּ֔ם תַּקְרִב֥וּן אֵלַ֖י וּשְׁמַעְתִּֽיו׃", "onk": "לָא תִשְׁתְּמוֹדְעוּן אַפִּין בְּדִינָא <b>מִלֵּי<\/b> זְעֵרָא כְרַבָּא תִּשְׁמְעוּן לָא תִדְחֲלוּן מִן קֳדָם גַּבְרָא אֲרֵי דִינָא דַּיְיָ הוּא וּפִתְגָּמָא דִּי יִקְשֵׁי מִנְּכוֹן תְּקָרְבוּן לְוָתִי וְאֶשְׁמְעִנֵּיהּ:", "onk_en": "Do not show favor in judgement; [<b>words<\/b>] small and great alike will you hear out; do not fear any man; for justice belongs to God. And the matter that will be too difficult for you, present to me and I will hear it.’’", "pj": "לָא תִשְׁתְּמוֹדְעוּן אַפִּין בְּדִינָא מִילֵי זְעֵירָא הֵי כְּמִילֵי רַבָּא תִשְׁמְעוּן וְלָא תִדַּחֲלוּן מִן קֳדָם עַתִּיר וְשׁוּלְטַן אֲרוּם דִּינָא מִן קֳדָם יְיָ וְחָמֵי כָּל טוּמְרַיָא וּפִתְגָמָא דְיִקְשֵׁי מִנְכוֹן תְּקַרְבוּן לְוָתִי וְאַשְׁמְעִינֵיהּ", "pj_en": "You shall not have respect to persons in a judgment; you shall hear little words as well as great ones, nor be afraid before the rich man and the ruler; for a judgment is from before the Lord, and He seeth every secret. But the thing that is too hard for you bring to me, and I will hear it.", "tj": "", "tj_en": "", "rashi": "<b>לא תכירו פנים במשפט.<\/b> זֶה הַמְמֻנֶּה לְהוֹשִׁיב הַדַּיָּנִים, שֶׁלֹּא יֹאמַר אִישׁ פְּלוֹנִי נָאֶה אוֹ גִּבּוֹר, אוֹשִׁיבֶנּוּ דַיָּן, אִישׁ פְּלוֹנִי קְרוֹבִי, אוֹשִׁיבֶנּוּ דַּיָּן בָּעִיר, וְהוּא אֵינוֹ בָּקִי בְדִינִין, נִמְצָא מְחַיֵּב אֶת הַזַּכַּאי וּמְזַכֶּה אֶת הַחַיָּב, מַעֲלֶה אֲנִי עַל מִי שֶׁמִּנָּהוּ כְּאִלּוּ הִכִּיר פָּנִים בַּדִּין:<br><br><b>כקטן כגדל תשמעון.<\/b> שֶׁיְּהֵא חָבִיב עָלֶיךָ דִּין שֶׁל פְּרוּטָה כְּדִין שֶׁל מֵאָה מָנֶה, שֶׁאִם קָדַם וּבָא לְפָנֶיךָ, לֹא תְסַלְּקֶנּוּ לָאַחֲרוֹן. דָּ\"אַ — <b>כקטן כגדל תשמעון<\/b> כְּתַרְגּוּמוֹ, שֶׁלֹּא תֹאמַר זֶה עָנִי הוּא וַחֲבֵרוֹ עָשִׁיר וּמְצֻוֶּה לְפַרְנְסוֹ, אֲזַכֶּה אֶת הֶעָנִי וְנִמְצָא מִתְפַּרְנֵס בִּנְקִיּוּת; דָּ\"אַ — שֶׁלֹּא תֹאמַר הֵיאַךְ אֲנִי פּוֹגֵם כְּבוֹדוֹ שֶׁל עָשִׁיר זֶה בִּשְׁבִיל דִּינָר, אֲזַכֶּנּוּ עַכְשָׁיו, וּכְשֶׁיּוֹצֵא לַחוּץ אֹמַר לוֹ תֵּן לוֹ שֶׁאַתָּה חַיָּב לוֹ (שם):<br><br><b>לא תגורו מפני איש.<\/b> לֹא תִּירְאוּ; דָּ\"אַ — <b>לא תגורו<\/b> לֹא תַכְנִיס דְּבָרֶיךָ מִפְּנֵי אִישׁ, לְשׁוֹן \"אֹגֵר בַּקַּיִץ\" (משלי י'):<br><br><b>כי המשפט לאלהים הוא.<\/b> מַה שֶּׁאַתָּה נוֹטֵל מִזֶּה שֶׁלֹּא כַדִּין, אַתָּה מַזְקִיקֵנִי לְהַחֲזִיר לוֹ, נִמְצָא שֶׁהִטֵּיתָ עָלַי הַמִּשְׁפָּט (סנהדרין ח'):<br><br><b>תקרבון אלי.<\/b> עַל דָּבָר זֶה נִסְתַּלֵּק מִמֶּנּוּ מִשְׁפַּט בְּנוֹת צְלָפְחָד (שם); וְכֵן שְׁמוּאֵל אָמַר לְשָׁאוּל (שמואל א ט') \"אָנֹכִי הָרוֹאֶה\", אָמַר לוֹ הַקָּבָּ\"ה חַיֶּיךָ שֶׁאֲנִי מוֹדִיעֲךָ שֶׁאֵין אַתָּה רוֹאֶה, וְאֵימָתַי הוֹדִיעוֹ? כְּשֶׁבָּא לִמְשֹׁחַ אֶת דָּוִד (שמואל א ט\"ז) \"וַיַּרְא אֶת אֱלִיאָב וַיֹּאמֶר אַךְ נֶגֶד ה' מְשִׁיחוֹ\", אָמַר לוֹ הַקָּבָּ\"ה וְלֹא אָמַרְתָּ אָנֹכִי הָרֹאֶה? \"אַל תַּבֵּט אֶל מַרְאֵהוּ\" (ספרי):", "rashi_en": "לא תכירו פנים במשפט YE SHALL NOT RESPECT PERSONS IN JUDGMENT — This is addressed to him whose office it is to appoint judges — that he should not say, Mr. So-and-so is a fine or a strong man, I will make him a judge; Mr. So-and-so is my relative, I will make him a judge in the city, — while in reality he is not expert in the laws, and consequently he will condemn the innocent and acquit the guilty — I will account it unto him who appointed him as though he had shown favor in judgment (Sifrei Devarim 17:1).<br><br>כקטן כגדל תשמעון YE SHALL HEAR THE SMALL AS WELL AS THE GREAT, i.e. that a lawsuit regarding a peruta shall be as dear to you (shall be as of equal importance) as a lawsuit regarding a hundred maneh — that if it (the former) comes before you first, you should not set it aside until the last (Sanhedrin 8a). — Another explanation of YE SHALL HEAR THE SMALL AS WELL AS THE GREAT — Understand it as the Targum has it: Ye shall hearken unto the words of the small as to those of the great — i.e. that you should not say: This is a poor man and his fellow (opponent) is rich, and is in any case bidden to support him; I will find in favour of the poor man, and he will consequently obtain some support in a respectable fashion (see Rashi on Leviticus 19:15). — Another explanation is: that you should not say, “How can I offend against the honour of this rich man because of one dinar? I will for the moment decide in his favour, and when he goes outside (leaves the court) I will say to him, ‘Give it to him because in fact you owe it to him'\" (Sifrei Devarim 17:3).<br><br>לא תגורו מפני איש means: YE SHALL NOT FEAR [ANY MAN]. — Another explanation of לא תגורו: Ye shall not gather in (shall not restrain) your words before any man. The word has the same meaning as in (Proverbs 10:5), \"Gathering (אוגר) in summer” (cf. Sanhedrin 8a).<br><br>כי המשפט לאלהים הוא FOR THE JUDGMENT IS GOD’S — Whatever you take from this man unjustly you will compel Me to restore to him; it follows, therefore, that you have wrested judgment against Me (Sanhedrin 8a).<br><br>תקרבון אלי [AND THE CAUSE THAT IS TOO HARD FOR YOU] BRING TO ME [AND I WILL HEAR IT] — On account of this utterance (that he could decide difficult cases) the law regarding the daughters of Zelophehad evaded him (Sanhedrin 8a; see Rashi on Numbers 27:5). Similarly, Samuel said to Saul (I Samuel 9:19), “I” am the seer. Whereupon the Holy One, blessed be He, said to him, “By your life, I will let you know that you are not a seer”. And when did he let him know this? When he came to anoint David. For Scripture states, (I Samuel 16:6, 7) “And when he saw Eliab he said, Surely before the Lord stands his anointed one”. The Holy One, blessed be He, said to him: \"Did you not say, “I” am the seer? Look not at the outward appearance” (Sifrei Devarim 17:7)."}, {"ch": 1, "v": 18, "aliyah": 2, "heb": "וָאֲצַוֶּ֥ה אֶתְכֶ֖ם בָּעֵ֣ת הַהִ֑וא אֵ֥ת כׇּל־הַדְּבָרִ֖ים אֲשֶׁ֥ר תַּעֲשֽׂוּן׃", "onk": "וּפַקֵּדִית יָתְכוֹן בְּעִדָּנָא הַהִיא יָת כָּל פִּתְגָּמַיָּא דִּי תַעְבְּדוּן:", "onk_en": "I commanded you at that time all the things that you are to do.", "pj": "וּפַקֵּדִית יַתְכוֹן בְּעִידָנָא הַהִיא יַת כָּל עַשְרָא פִּתְגָמַיָא דְתַעְבְּדוּן בֵּינֵי דִינֵי מָמוֹנָא לְדִינֵי נַפְשָׁתָא", "pj_en": "And at that time I taught you all the Ten Words which you are to practise about judgments of money, and judgments of life.", "tj": "", "tj_en": "", "rashi": "<b>את כל הדברים אשר תעשון.<\/b> אֵלּוּ עֲשֶׂרֶת הַדְּבָרִים שֶׁבֵּין דִּינֵי מָמוֹנוֹת לְדִינֵי נְפָשׁוֹת (שם):", "rashi_en": "את כל הדברים אשר תעשון [AND I COMMANDED YOU …] ALL THE THINGS THAT YE SHOULD DO — These are the ten things that constitute the difference between civil cases and capital cases (Sifrei Devarim 18:1; cf. Sanhedrin 32a)."}, {"ch": 1, "v": 19, "aliyah": 2, "heb": "וַנִּסַּ֣ע מֵחֹרֵ֗ב וַנֵּ֡לֶךְ אֵ֣ת כׇּל־הַמִּדְבָּ֣ר הַגָּדוֹל֩ וְהַנּוֹרָ֨א הַה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽאֱמֹרִ֔י כַּאֲשֶׁ֥ר צִוָּ֛ה יְהֹוָ֥ה אֱלֹהֵ֖ינוּ אֹתָ֑נוּ וַנָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ׃", "onk": "וּנְטַלְנָא מֵחֹרֵב וְהַלִּיכְנָא יָת כָּל מַדְבְּרָא רַבָּא וּדְחִילָא הַהוּא דִּי חֲזֵיתוּן אֹרַח טוּרָא דֶאֱמֹרָאָה כְּמָא דִי פַקִּיד יְיָ אֱלָהָנָא יָתָנָא וַאֲתֵינָא עַד <b>רְקַם גֵּיאָה<\/b>:", "onk_en": "We traveled from Choreiv and walked the entire great wilderness, that awesome one that you saw, in the direction of the Emorite hill [region] as Adonoy, our God, commanded us; and we arrived at Kadeish Barnei’a [<b>Rekam Geyah<\/b>].", "pj": "וּנְטָלָנָא מֵחוֹרֵב וְהַלִיכְנָא יַת כָּל מַדְבְּרָא רַבָּא וּדְחִילָא הַהוּא דַחֲמִיתוּן חֵיוָן כִּכְשׁוּרִין וְעַקְרַבִּין כְּקַשְׁתִּין סַרְיָין רַמְיָין לְקוֹבְלֵיכוֹן אוֹרַח טַוְורָא דְאֵימוֹרָאָה הֵיכְמָא דְפַקֵּיד יְיָ אֱלָהָנָא יָתָנָא וְאָתֵינָא עַד רְקַם גֵּיעָה", "pj_en": "And we journeyed from Horeb, and came through all that great and fearful desert, where you saw serpents like boughs, and loathsome scorpions darting at you like arrows, on the way of the mountain of the Amoraah, as the Lord our God had commanded us, and came to Rekem Giah.", "tj": "", "tj_en": "", "rashi": "<b>המדבר הגדול והנורא.<\/b> שֶׁהָיוּ בוֹ נְחָשִׁים כְּקוֹרוֹת, וְעַקְרַבִּים כִּקְשָׁתוֹת (שם):", "rashi_en": "המדבר הגדול והנורא [THAT]. GREAT AND FEARFUL WILDERNESS — [It is termed fearful] because there were in it serpents thick as beams and scorpions as bows (Sifrei Devarim 18:2)."}, {"ch": 1, "v": 20, "aliyah": 2, "heb": "וָאֹמַ֖ר אֲלֵכֶ֑ם בָּאתֶם֙ עַד־הַ֣ר הָאֱמֹרִ֔י אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֵ֖ינוּ נֹתֵ֥ן לָֽנוּ׃", "onk": "וַאֲמָרִית לְכוֹן אֲתֵיתוּן עַד טוּרָא דֶאֱמֹרָאָה דַּיְיָ אֱלָהָנָא יָהֵב לָנָא:", "onk_en": "I said to you, ‘‘You have arrived at the Emorite hill [region] that Adonoy, our God, is giving us.", "pj": "וַאֲמָרִית לְכוֹן אֲתֵיתוּן עַד טַוְורָא דֶאֱמוֹרָאָה דַיְיָ אֱלָהָנָא יָהֵיב לָנָא", "pj_en": "And I said to you, Ye are come to the mountain of the Amoraah, which the Lord our God will give to us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 21, "aliyah": 2, "heb": "רְ֠אֵ֠ה נָתַ֨ן יְהֹוָ֧ה אֱלֹהֶ֛יךָ לְפָנֶ֖יךָ אֶת־הָאָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּאֲשֶׁר֩ דִּבֶּ֨ר יְהֹוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֙יךָ֙ לָ֔ךְ אַל־תִּירָ֖א וְאַל־תֵּחָֽת׃", "onk": "חֲזֵי יְהַב יְיָ אֱלָהָךְ קֳדָמָךְ יָת אַרְעָא סַק אַחֲסַן כְּמָא דִי מַלִּיל יְיָ אֱלָהָא דַאֲבָהָתָךְ לָךְ לָא תִדְחַל וְלָא תִתְּבָר:", "onk_en": "See! Adonoy, our God, has set the land before you. Go up, inherit [it] as promised by Adonoy, the God of your forefathers, about you; do not fear and do not tremble.’’", "pj": "חָמוּן דִּיהַב יְיָ אֱלָהָכוֹן לְכוֹן יַת אַרְעָא סוּקוּ וְאַחֲסִינוּ הֵיכְמָא דְמַלֵּיל יְיָ אֱלָהָכוֹן לְכוֹן לָא תִידַחֲלוּן וְלָא תִיתַבְּרוּן", "pj_en": "Behold, the Lord our God hath given you the land; arise and possess it, as the Lord your God hath told you; fear not, nor be dismayed (broken).", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 22, "aliyah": 3, "heb": "וַתִּקְרְב֣וּן אֵלַי֮ כֻּלְּכֶם֒ וַתֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְפָנֵ֔ינוּ וְיַחְפְּרוּ־לָ֖נוּ אֶת־הָאָ֑רֶץ וְיָשִׁ֤בוּ אֹתָ֙נוּ֙ דָּבָ֔ר אֶת־הַדֶּ֙רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה־בָּ֔הּ וְאֵת֙ הֶֽעָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵיהֶֽן׃", "onk": "וּקְרֶבְתּוּן לְוָתִי כֻּלְּכוֹן וַאֲמַרְתּוּן נִשְׁלַח גֻּבְרִין קֳדָמָנָא וִיאַלֲלוּן לָנָא יָת אַרְעָא וִיתִיבוּן יָתָנָא פִּתְגָּמָא יָת אָרְחָא דִּי נִסֵּק בַּהּ וְיָת קִרְוַיָּא דִּי נֵעוֹל לְהֵן:", "onk_en": "You approached me, all of you, and said, ‘‘Let us send men ahead of us to spy out the land for us, and let them bring back word to us: the route we are to go up on and the cities we will be coming to.’’", "pj": "וְקָרֵיבְתּוּן לְוָתִי בְּעַרְבּוּבְיָא כּוּלְכוֹן וַאֲמַרְתּוּן נְשַׁדֵּר גּוּבְרִין קֳדָמָנָא וְיִתְרָגְנוּן לָנָא יַת אַרְעָא וִיתֵיבוּן יָתָנָא פִּתְגָמָא יַת אוֹרְחָא דְנִיסַק בָּהּ וְיַת קִרְוַיָא דְנֵיעוּל לְוַתְהוֹן", "pj_en": "And all of you came to me in a body, and said, We will send men before us to examine the land for us, and bring us back word by what way we shall go up to it, and the cities we should enter.", "tj": "", "tj_en": "", "rashi": "<b>ותקרבון אלי כלכם.<\/b> בְּעִרְבּוּבְיָא; וּלְהַלָּן הוּא אוֹמֵר (דברים ה') \"וַתִּקְרְבוּן אֵלַי כָּל רָאשֵׁי שִׁבְטֵיכֶם וְזִקְנֵיכֶם וַתֹּאמְרוּ הֵן הֶרְאָנוּ וְגוֹ'\", אוֹתָהּ קְרִיבָה הָיְתָה הוֹגֶנֶת – יְלָדִים מְכַבְּדִים אֶת הַזְּקֵנִים וּשְׁלָחוּם לִפְנֵיהֶם, וּזְקֵנִים מְכַבְּדִים אֶת הָרָאשִׁים לָלֶכֶת לִפְנֵיהֶם, אֲבָל כָּאן \"וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם\" בְּעִרְבּוּבְיָא – יְלָדִים דּוֹחֲפִין אֶת הַזְּקֵנִים, וּזְקֵנִים דּוֹחֲפִין אֶת הָרָאשִׁים (ספרי):<br><br><b>וישבו אתנו דבר.<\/b> בְּאֵיזֶה לָשׁוֹן הֵם מְדַבְּרִים:<br><br><b>את הדרך אשר נעלה בה.<\/b> אֵין דֶּרֶךְ שֶׁאֵין בָּהּ עַקְמִימוּת:<br><br><b>ואת הערים אשר נבא אליהן.<\/b> תְּחִלָּה לִכְבֹּשׁ (שם):", "rashi_en": "ותקרבון אלי כלכם AND YE APPROACHED ME ALL OF YOU — all of you: in a crowd. But further on (Deuteronomy 5:20, 21) it states, “Ye approached me, even all the heads of your tribes, and your elders, and ye said, Behold [the Eternal our God] hath shown us [His glory and His greatness]’’: That approach to me was a fitting one — young people showing respect to their elders, letting these precede them, and the elders showing respect to the heads of the tribes that these should precede them. Here, however, ye approached me, all of you, in a crowd, the young pushing aside their olders, the elders pushing aside the heads (Sifrei Devarim 20:1).<br><br>וישבו אתנו דבר AND THEY SHALL BRING US WORD — i.e. they shall report to us in what language they speak (Sifrei Devarim 20:3).<br><br>את הדרך אשר נעלה בה BY WHAT WAY WE MUST GO UP — you will rarely find a road in which there is not some zigzag course (Sifrei Devarim 20:4).<br><br>ואת הערים אשר נבא אליהן AND UNTO WHAT CITIES WE SHALL COME first to capture them (cf. Sifrei Devarim 20:5)."}, {"ch": 1, "v": 23, "aliyah": 3, "heb": "וַיִּיטַ֥ב בְּעֵינַ֖י הַדָּבָ֑ר וָאֶקַּ֤ח מִכֶּם֙ שְׁנֵ֣ים עָשָׂ֣ר אֲנָשִׁ֔ים אִ֥ישׁ אֶחָ֖ד לַשָּֽׁבֶט׃", "onk": "וּשְׁפַר בְּעֵינַי פִּתְגָּמָא וּדְבָרִית מִנְּכוֹן תְּרֵין עֲשַׂר גֻּבְרִין גַּבְרָא חַד לְשִׁבְטָא:", "onk_en": "The idea pleased me, so I took from you twelve men, one man per tribe.", "pj": "וּשְׁפַר בְּעֵינַי פִּתְגָמָא וּדְבָרִית מִנְכוֹן תְּרֵיסַר גּוּבְרִין בְּרִירִין גּוּבְרָא חָד לְשִׁבְטָא", "pj_en": "And the thing was proper in my eyes; and I took from you twelve chosen men, one man for a tribe,", "tj": "", "tj_en": "", "rashi": "<b>וייטב בעיני הדבר.<\/b> בְּעֵינַי וְלֹא בְעֵינֵי הַמָּקוֹם; וְאִם בְּעֵינֵי מֹשֶׁה הָיָה טוֹב לָמָּה אֲמָרָהּ בַּתּוֹכָחוֹת? מָשָׁל לְאָדָם שֶׁאוֹמֵר לַחֲבֵרוֹ מְכֹר לִי חֲמוֹרְךָ זֶה, אָמַר לוֹ הֵן, נוֹתְנוֹ אַתָּה לִי לְנִסָּיוֹן? אָמַר לוֹ הֵן, בֶּהָרִים וּבַגְּבָעוֹת? אָמַר לוֹ הֵן, כֵּיוָן שֶׁרָאָה שֶׁאֵין מְעַכְּבוֹ כְלוּם, אָמַר הַלּוֹקֵחַ בְּלִבּוֹ בָּטוּחַ הוּא זֶה שֶׁלֹּא אֶמְצָא בוֹ מוּם, מִיָּד אָמַר לוֹ טֹל מְעוֹתֶיךָ אֵינִי מְנַסֵּהוּ מֵעַתָּה, אַף אֲנִי הוֹדֵיתִי לְדִבְרֵיכֶם, שֶׁמָּא תַחְזְרוּ בָכֶם כְּשֶׁתִּרְאוּ שֶׁאֵינִי מְעַכֵּב, וְאַתֶּם לֹא חֲזַרְתֶּם בָּכֶם (ספרי):<br><br><b>ואקח מכם.<\/b> מִן הַבְּרוּרִים שֶׁבָּכֶם, מִן הַמְסֻלָּתִים שֶׁבָּכֶם (שם):<br><br><b>שנים עשר אנשים איש אחד לשבט.<\/b> מַגִּיד שֶׁלֹּא הָיָה שֵׁבֶט לֵוִי עִמָּהֶם (שם):", "rashi_en": "וייטב בעיני הדבר AND THE MATTER WAS GOOD IN MY SIGHT — in my sight, said Moses, but not in the sight of the Omnipresent God. — But if it was good in Moses' sight why did he mention it in these reproofs? A parable! It may he compared to the case of a man who says to his fellow, \"Sell me this ass of yours”. He replies to him, \"Yes”. He asks him, \"Will you give it to me on trial?” He replies: \"Yes”. — \"May I try it on hills and mountains?” Again he replies, \"Yes\" — When he sees that he puts no obstacles in his way, the would-be purchaser says to himself: “This man is quite confident that I shall not find any defect in it\", and he at once says to him, “Take your money, I need not now put it to trial”. I, too, consented to your words, thinking that you would perhaps turn back on yourselves (re-consider the question of sending spies) when you saw that I put no obstacle in your way, but you did not re-consider (Sifrei Devarim 21:1).<br><br>ואקח מכם AND I TOOK OF YOU — of the choicest that were amongst you, of the finest that were amongst you (Sifrei Devarim 21:2).<br><br>שנים עשר אנשים איש אחד לשבט [AND I TOOK] … TWELVE MEN, ONE MAN FOR A TRIBE — This (the statement: “twelve men”) tells us that the tribe of Levi was not with them in this request (Sifrei Devarim 21:3; cf. Rashi on Numbers 31:4)."}, {"ch": 1, "v": 24, "aliyah": 3, "heb": "וַיִּפְנוּ֙ וַיַּעֲל֣וּ הָהָ֔רָה וַיָּבֹ֖אוּ עַד־נַ֣חַל אֶשְׁכֹּ֑ל וַֽיְרַגְּל֖וּ אֹתָֽהּ׃", "onk": "וְאִתְפְּנִיּוּ וּסְלִיקוּ לְטוּרָא וַאֲתוֹ עַד נַחֲלָא דְּאֶתְכָּלָא וְאַלִּילוּ יָתַהּ:", "onk_en": "They turned and went uphill and arrived at Wadi Eshkol, and they spied it out.", "pj": "וְאִתְפְּנִיּוּ וּסְלִיקוּ לְטַוְורָא וְאָתוּ עַד נַחֲלָא דְאַתְכְּלָא וּתְרִגִינוּ יָתָהּ", "pj_en": "and they turned and went up into the mountain, and came to the stream of Ethkela, and explored it.", "tj": "וְכַוְונוּ וּסְלִיקוּ לְטוּרָא וּמָטוּ עַד נַחֲלֵי סְגוֹלָה וְיָלִילוּ יָתָה:", "tj_en": "And they prepared and went up into the mountain, and came to the stream of the Grapes, and surveyed it.", "rashi": "<b>עד נחל אשכל.<\/b> מַגִּיד שֶׁנִּקְרָא עַל שֵׁם סוֹפוֹ (שם):<br><br><b>וירגלו אתה.<\/b> מְלַמֵּד שֶׁהָלְכוּ בָהּ אַרְבָּעָה אֻמָּנִין שְׁתִי וָעֵרֶב (שם):", "rashi_en": "עד נחל אשכל [AND THEY CAME] TO THE BROOK OF ESHCOL — This tells us that it was so called on account of what was eventually, to happen there [— that they took from there a cluster (אשכל) of grapes] (Sifrei Devarim 22:2).<br><br>וירגלו אתה AND THEY SPIED IT OUT — This teaches that they passed through it along four lines, along the length and the breadth (Sifrei Devarim 22:3; cf. Rashi on Numbers 13:21)."}, {"ch": 1, "v": 25, "aliyah": 3, "heb": "וַיִּקְח֤וּ בְיָדָם֙ מִפְּרִ֣י הָאָ֔רֶץ וַיּוֹרִ֖דוּ אֵלֵ֑ינוּ וַיָּשִׁ֨בוּ אֹתָ֤נוּ דָבָר֙ וַיֹּ֣אמְר֔וּ טוֹבָ֣ה הָאָ֔רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֵ֖ינוּ נֹתֵ֥ן לָֽנוּ׃", "onk": "וּנְסִיבוּ בִידֵיהוֹן מֵאִבָּא דְאַרְעָא וַאֲחִיתוּ לָנָא וַאֲתִיבוּ יָתָנָא פִּתְגָּמָא וַאֲמָרוּ טָבָא אַרְעָא דַיְיָ אֱלָהָנָא יָהֵב לָנָא:", "onk_en": "They took in their hand some fruit of the land and brought [it] down to us. They brought back word to us and said, ‘‘Good is the land that Adonoy, our God, is giving us.’’", "pj": "וּנְסִיבוּ בִּידֵיהוֹן מִן אִיבָּא דְאַרְעָא וְאָחִיתוּ לְוָתָנָא וְאָתִיבוּ יָתָנָא פִּתְגָמָא וַאֲמָרוּ כָּלֵב וִיהוֹשֻׁעַ טָבָא אַרְעָא דַיְיָ אֱלָהָנָא יָהֵיב לָנָא", "pj_en": "And they took in their hands of the produce of the land and brought to us. And they returned us word; and Kaleb and Jehoshua said, The land which the Lord our God hath given us is good.", "tj": "", "tj_en": "", "rashi": "<b>ויורדו אלינו.<\/b> מַגִּיד שֶׁאֶרֶץ יִשְׂרָאֵל גְּבוֹהָה מִכָּל הָאֲרָצוֹת (שם):<br><br><b>ויאמרו טובה הארץ.<\/b> מִי הֵם שֶׁאָמְרוּ טוֹבָתָהּ? יְהוֹשֻׁעַ וְכָלֵב (שם):", "rashi_en": "ויורדו אלינו AND THEY BROUGHT IT DOWN TO US — This tells us that the land of Israel is situated higher than all other countries (Sifrei Devarim 23:2).<br><br>ויאמרו טובה הארץ AND THEY SAID, THE LAND IS GOOD — Who were they who spoke of it being good? Joshua and Caleb (Sifrei Devarim 23:3)."}, {"ch": 1, "v": 26, "aliyah": 3, "heb": "וְלֹ֥א אֲבִיתֶ֖ם לַעֲלֹ֑ת וַתַּמְר֕וּ אֶת־פִּ֥י יְהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "וְלָא אֲבִיתוּן לְמִסַּק <b>וְסָרֶבְתּוּן<\/b> עַל <b>מֵימְרָא<\/b> דַיְיָ אֱלָהָכוֹן:", "onk_en": "But you were unwilling to go up, and you defied [<b>were rebellious against the word of<\/b>] Adonoy, your God.", "pj": "וְלָא צְבִיתוּן לְמֵיסוֹק וְהֵמַנְתּוּן לְפִתְגָמֵי עַשְרָא רְשִׁיעִין וְסָרֵיבְתּוּן עַל מֵימְרָא דַיְיָ אֱלָהָכוֹן", "pj_en": "But you were not willing to go up, but believed the words of the ten wicked ones, and rebelled agains
