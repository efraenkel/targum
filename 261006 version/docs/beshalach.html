<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "beshalach";
const DATA = [{"ch": 13, "v": 17, "aliyah": 1, "heb": "וַיְהִ֗י בְּשַׁלַּ֣ח פַּרְעֹה֮ אֶת־הָעָם֒ וְלֹא־נָחָ֣ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י&thinsp;<b>׀<\/b> אָמַ֣ר אֱלֹהִ֗ים פֶּֽן־יִנָּחֵ֥ם הָעָ֛ם בִּרְאֹתָ֥ם מִלְחָמָ֖ה וְשָׁ֥בוּ מִצְרָֽיְמָה׃", "onk": "וַהֲוָה כַּד שַׁלַח פַּרְעֹה יָת עַמָא וְלָא דַבָּרִינוּן יְיָ אֹרַח אַרְעָא פְלִשְׁתָּאֵי אֲרֵי קָרִיבָא הוּא אֲרֵי אֲמַר יְיָ דִילְמָא <b>יְזוּעוּן<\/b> עַמָא בְּמֶחֱזֵיהוֹן קְרָבָא וִיתוּבוּן לְמִצְרָיִם:", "onk_en": "When Pharaoh sent away the people Elohim did not lead them by way of the land of the Philistines because it was the shortest route; for Elohim said, “The people might change their minds [<b>tremble <\/b>] should they encounter war, and return to Egypt.", "pj": "ויהי וַהֲוָה כַּד פְּטַר פַּרְעה יַת עַמָּא וְלָא דַבְּרִינוּן יְיָ אוֹרַח אֲרַע פְּלִישְׁתָּאֵי אֲרוּם קָרֵיב הוּא אֲרוּם אֲמַר יְיָ דִלְמָא יִתְהֲווֹן עַמָּא בְּמֵיחְמֵיהוֹן אֲחוּהוֹן דְּמִיתַן בִּקְרָבָא מָאתָן אַלְפִין גּוּבְרִין בְּנֵי חֵילָא מִשִּׁבְטָא דְאֶפְרַיִם מְאַחֲדִין בִּתְרִיסִין וְרוּמְחִין וּמָאנֵי זַיְינִין וְנַחֲתוּ לְגַת לְמֵיבוּז גֵּיתֵי פְּלִישְׁתָּאֵי וּבְגִין דַּעֲבָרוּ עַל גְּזֵרַת מֵימְרָא דַיְיָ וּנְפָקוּ מִמִּצְרַיִם תְּלָתִין שְׁנִין קֳדָם קִיצָא אִיתְמַסְרוּ בִּידָא דִפְּלִישְׁתָּאֵי וּקְטָלוּנוּן הִינוּן הֲווֹ גַרְמַיָא יְבֵישַׁיָא דְאָחֵי יַתְהוֹן מֵימְרָא דַיְיָ עַל יְדָא דִיְחֶזְקֵאל נְבִיָא בְּבִקְעַת דּוּרָא וְאִין יֶחְמוּן כְּדֵין יִדְחֲלוּן וִיתוּבוּן לְמִצְרָיִם", "pj_en": "AND it was when Pharoh had released the people, that the Lord did not conduct them by the way of the land of the Phelishtaee though that was the near one; for the Lord said, Lest the people be affrighted in seeing their brethren who were killed in war, two hundred thousand men of strength of the tribe of Ephraim, who took shields, and lances, and weapons of war, and went down to Gath to carry off the flocks of the Phelishtaee; and because they transgressed against the statute of the Word of the Lord, and went forth from Mizraim thirty years before the (appointed) end of their servitude, they were delivered into the hand of the Phelishtaee, who slew them. These are the dry bones which the Word of the Lord restored to life by the ministry (hand) of Yechezekel the prophet, in the vale of Dura; but which, if they (now) saw them, they would be afraid, and return into Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ויהי בשלח פרעה, ולא נחם.<\/b> נְהָגָם, כְּמוֹ \"לֵךְ נְחֵה אֶת הָעָם\" (שמות ל\"ב), \"בְּהִתְהַלֶּכְךָ תַּנְחֶה אוֹתָךְ\" (משלי ו'):<br><br><b>כי קרוב הוא.<\/b> וְנֹחַ לָשׁוּב בְּאוֹתוֹ הַדֶּרֶךְ לְמִצְרַיִם; וּמִדְרְשֵׁי אַגָּדָה יֵשׁ הַרְבֵּה:<br><br><b>בראתם מלחמה.<\/b> כְּגוֹן מִלְחֶמֶת \"וַיֵּרֶד הָעֲמָלֵקִי וְהַכְּנַעֲנִי וְגוֹ'\" (במדבר י\"ד), אִם הָלְכוּ דֶּרֶךְ יָשָׁר הָיוּ חוֹזְרִים, וּמָה אִם כְּשֶׁהִקִּיפָם דֶּרֶךְ מְעֻקָּם אָמְרוּ \"נִתְּנָה רֹאשׁ וְנָשׁוּבָה מִצְרָיְמָה\" (שם), אִם הוֹלִיכָם בִּפְשׁוּטָה עַל אַחַת כַּמָּה וְכַמָּה:<br><br><b>פן ינחם.<\/b> יַחְשְׁבוּ מַחֲשָׁבָה עַל שֶׁיָּצְאוּ וְיִתְּנוּ לֵב לָשׁוּב:", "rashi_en": "ויהי בשלח פרעה... ולא נחם AND IT CAME TO PASS WHEN PHARAOH HAD SENT [THE PEOPLE AWAY] THAT GOD GUIDED THEM NOT — The word נחם means He guided them, just as, (Exodus 32:34) “Go, guide (נחה) the people”, and (Proverbs 6:22) “when thou goest it shall guide (תנחה) thee”.<br><br>כי קרוב הוא BECAUSE IT WAS NEAR, and it would therefore be easy to return by the same route to Egypt. — Of Midrashic explanations there are many (cf. Mekhilta).<br><br>בראתם מלחמה WHEN THEY SEE WAR — For instance the war mentioned in (Numbers 14:45) “Then the Amalekites and the Canaanites came down etc.” If they had proceeded by the direct route they would have then turned back. This is evident, for what would have been the case? If, when He led them about by a circuitous way, they said, (Numbers 14:4) “Let us appoint another chief and go back to Egypt”, had He led them by a direct route how much the more certainly would they have spoken so.<br><br>פן ינחם PERADVENTURE [THE PEOPLE] REPENT — peradventure they cherish a different thought (they change their mind) about having gone out and set their hearts on returning (cf. Rashi on Genesis 6:6)."}, {"ch": 13, "v": 18, "aliyah": 1, "heb": "וַיַּסֵּ֨ב אֱלֹהִ֧ים&thinsp;<small>׀<\/small>&thinsp;אֶת־הָעָ֛ם דֶּ֥רֶךְ הַמִּדְבָּ֖ר יַם־ס֑וּף וַחֲמֻשִׁ֛ים עָל֥וּ בְנֵי־יִשְׂרָאֵ֖ל מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וְאַסְחַר יְיָ יָת עַמָא אֹרַח מַדְבְּרָא יַמָא דְסוּף וּמְזָרְזִין סְלִיקוּ בְּנֵי יִשְׂרָאֵל מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "And so Elohim led the people round-about by way of the Reed Sea Desert, and the B’nei Yisrael went up armed from the land of Egypt.", "pj": "וְאַחֲזַר יְיָ יַת עַמָּא אוֹרַח מַדְבְּרָא דְיַמָא דְסוּף וְכָל חַד עִם חַמְשָׁא טַפְלִין סְלִיקוּ בְּנֵי יִשְרָאֵל מֵאַרְעָא דְמִצְרָיִם", "pj_en": "But the Lord led the people round by the way of the desert of the sea of Suph; and every one of the sons of Israel, with five children, went up from the land of Mizraim.", "tj": "וּדְבַר מֵימְרָא דַיְיָ יַת עַמָּא אוֹרַח מַדְבְּרָא יַמָא דְסוּף מְזַיְינִין בְּעוֹבָדָא טָבָא סְלִיקוּ בְנֵי יִשְרָאֵל פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם:", "tj_en": "And the Word of the Lord conducted the people by the way of the desert of the sea of Suph; armed in good works went up the sons of Israel, free from the land of Mizraim.", "rashi": "<b>ויסב.<\/b> הֱסִבָּם מִן הַדֶּרֶךְ הַפְּשׁוּטָה לַדֶּרֶךְ הָעֲקוּמָה:<br><br><b>ים סוף.<\/b> כְּמוֹ לְיַם סוּף, וְסוּף הוּא לְשׁוֹן אֲגַם שֶׁגְּדֵלִים בּוֹ קָנִים, כְּמוֹ \"וַתָּשֶׂם בַּסּוּף\" (שמות ב'), \"קָנֶה וָסוּף קָמֵלוּ\" (ישעיהו י\"ט):<br><br><b>וחמשים.<\/b> אֵין חֲמוּשִׁים אֶלָּא מְזֻיָּנִים; (לְפִי שֶׁהֱסִבָּן בַּמִּדְבָּר הוּא גָּרַם לָהֶם שֶׁעָלוּ חֲמוּשִׁים, שֶׁאִלּוּ הֱסִבָּן דֶּרֶךְ יִשּׁוּב, לֹא הָיוּ מְחֻמָּשִׁים לָהֶם כָּל מַה שֶּׁצְּרִיכִין, אֶלָּא כְּאָדָם שֶׁעוֹבֵר מִמָּקוֹם לְמָקוֹם וּבְדַעְתּוֹ לִקְנוֹת שָׁם מַה שֶּׁיִּצְטָרֵךְ, אֲבָל כְּשֶׁהוּא פּוֹרֵשׁ לַמִּדְבָּר צָרִיךְ לְזַמֵּן לוֹ כָּל הַצֹּרֶךְ; וּמִקְרָא זֶה לֹא נִכְתַּב כִּי אִם לְשַׂבֵּר אֶת הָאֹזֶן, שֶׁלֹּא תִתְמַהּ בְּמִלְחֶמֶת עֲמָלֵק וּבְמִלְחֶמֶת סִיחוֹן וְעוֹג וּמִדְיָן מֵהֵיכָן הָיוּ לָהֶם כְּלֵי זַיִן שֶׁהִכּוּ אוֹתָם בַּחֶרֶב) וְכֵן הוּא אוֹמֵר \"וְאַתֶּם תַּעַבְרוּ חֲמֻשִׁים\" (יהושע א'), וְכֵן תִּרְגְּמוֹ אֻנְקְלוֹס \"מְזָרְזִין\", כְּמוֹ \"וַיָּרֶק אֶת חֲנִיכָיו\" (בראשית י\"ד) – וְזָרֵיז. דָּבָר אַחֵר, חֲמֻשִׁים אֶחָד מֵחֲמִשָּׁה יָצְאוּ וְאַרְבָּעָה חֲלָקִים מֵתוּ בִּשְׁלֹשֶׁת יְמֵי אֲפֵלָה (מכילתא):", "rashi_en": "ויסב means HE LED THE PEOPLE ABOUT from the direct route to a circuitous route.<br><br>ים סוף is the same as לים סוף TO THE RED SEA. The word סוף has the meaning of a marshy tract in which reeds grow; examples are: (Exodus 2:3) “She placed him in the reeds (בסוף)”; (Isaiah 19:6) “The flags and the reeds (וסוף) shall wither”.<br><br>וחמשים — The word חמשים means provided with weapons (Mekhilta). — [Because He led them by a circuitous route through the wilderness He brought it about that they went up from Egypt well-provided; for had He led them circuitously by the route of an inhabited district they would not have provided for themselves every thing that they needed, but only a part, like a person who is travelling from place to place and intends to purchase there whatever he will require. But if he were setting out for the wilderness he must provide all that he will require. — This verse (statement in the verse) is written only with the view of making the ear understand (preparing you for a later statement) viz., that you should not wonder with regard to the war with Amalek and the war with Sihon and Og and Midian where they obtained weapons, since they smote them with the sword]. In a similar sense it says, (Joshua 1:14) “and ye shall pass over armed (חמשים)”. Onkelos, too, translated it by מזרזין which signifies “armed” in Aramaic, just as he translates the word וירק in (Genesis 14:14) וירק את חניכיו which means, “And he armed his trained servants” by וזריז. Another explanation of חמשים is: only one out of five (חמשה) went forth from Egypt, and four parts of the people died during the three days of darkness because they were unworthy of being delivered (Mekhilta; cf. Rashi on 10:22)."}, {"ch": 13, "v": 19, "aliyah": 1, "heb": "וַיִּקַּ֥ח מֹשֶׁ֛ה אֶת־עַצְמ֥וֹת יוֹסֵ֖ף עִמּ֑וֹ כִּי֩ הַשְׁבֵּ֨עַ הִשְׁבִּ֜יעַ אֶת־בְּנֵ֤י יִשְׂרָאֵל֙ לֵאמֹ֔ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְכֶ֔ם וְהַעֲלִיתֶ֧ם אֶת־עַצְמֹתַ֛י מִזֶּ֖ה אִתְּכֶֽם׃", "onk": "<b>וְאַסִיק<\/b> משֶׁה יָת גַרְמֵי יוֹסֵף עִמֵהּ אֲרֵי אוֹמָאָה אוֹמִי יָת בְּנֵי יִשְׂרָאֵל לְמֵימָר מִדְכַּר דְכִיר יְיָ יָתְכוֹן וְתַסְקוּן יָת גַרְמַי מִכָּא עִמְכוֹן:", "onk_en": "Moshe took [<b>carried up<\/b>] the bones of Yoseif with him, for [Yoseif] had bound the B’nei Yisrael by oath saying, “Elohim will surely remember you, and [then] you must carry up my bones out of here with you.", "pj": "וְאַסֵּק משֶׁה יַת אֲרוֹנָא דְגַרְמֵי יוֹסֵף בְּגַוֵּיהּ מִן נִילוֹס וַהֲוָה מַדְבַּר עִמֵּיהּ אֲרֵי אוֹמָאָה אוֹמֵי יַת בְּנֵי יִשְרָאֵל לְמֵימַר מִדְכַּר יַדְכַּר יְיָ יַתְכוֹן וְתִסְקוּן יַת גַּרְמַי מִיכָּא עִמְכוֹן", "pj_en": "And Mosheh carried up the ark in which were the bones of Joseph, from out of the Nilos, and took them with him; because, adjuring, he adjured the sons of Israel, saving, The Lord will surely remember you, and you shall carry up my bones with you.", "tj": "אֲרוּם אַשְׁבַּע מַשְׁבַּע יַת בְּנֵי יִשְרָאֵל לְמֵימַר מִידְכַּר יַדְכַּר יְיָ יַתְכוֹן בְּמֵימְרֵיהּ וּבְרַחֲמֵי טַבְיָא:", "tj_en": "For, adjuring, he adjured the sons of Israel, saying, The Lord will remember you in is Word, and in His good mercies.", "rashi": "<b>השבע השביע.<\/b> הִשְׁבִּיעָם שֶׁיַּשְׁבִּיעוּ לִבְנֵיהֶם. וְלָמָּה לֹא הִשְׁבִּיעַ בָּנָיו שֶׁיִּשָּׂאוּהוּ לְאֶרֶץ כְּנַעַן מִיָּד כְּמוֹ שֶׁהִשְׁבִּיעַ יַעֲקֹב? אָמַר יוֹסֵף, אֲנִי שַׁלִּיט הָיִיתִי בְמִצְרַיִם וְהָיָה סֵפֶק בְּיָדִי לַעֲשׂוֹת, אֲבָל בָנַי לֹא יַנִּיחוּם מִצְרַיִם לַעֲשׂוֹת, לְכָךְ הִשְׁבִּיעָם לִכְשֶׁיִּגָּאֲלוּ וְיֵצְאוּ מִשָּׁם שֶׁיִּשָּׂאוּהוּ:<br><br><b>והעליתם את עצמתי מזה אתכם.<\/b> לְאֶחָיו הִשְׁבִּיעַ כֵּן, לִמְּדָנוּ שֶׁאַף עַצְמוֹת כָּל הַשְּׁבָטִים הֶעֱלוּ עִמָּהֶם שֶׁנֶּאֱמַר אִתְּכֶם (מכילתא):", "rashi_en": "השבע השביע HE HAD STRAITLY ADJURED — He had made them swear that they would make their children swear. But why did he not make his sons swear that they would take him to the land of Canaan immediately on his death, as Jacob had made his sons swear? Joseph said: I was a ruler in Egypt and I had sufficient power to do what my father desired; but my sons — the Egyptians will not permit them to do this. Consequently he made them swear that when they would be delivered and would go forth from there that they would take him up with them (Mekhilta).<br><br>והעליתם את עצמתי מזה אתכם THEN YE SHALL BRING UP MY BONES AWAY HENCE WITH YOU — It was his brothers whom he made swear thus; consequently this tells us that they (the Israelites who left Egypt) must have brought up with them the bones of all Jacob’s sons (lit., the tribes) since it is said “with you” (with your own bones) (Mekhilta)."}, {"ch": 13, "v": 20, "aliyah": 1, "heb": "וַיִּסְע֖וּ מִסֻּכֹּ֑ת וַיַּחֲנ֣וּ בְאֵתָ֔ם בִּקְצֵ֖ה הַמִּדְבָּֽר׃", "onk": "וּנְטָלוּ מִסֻכּוֹת וּשְׁרוֹ בְאֵתָם בִּסְטַר מַדְבְּרָא:", "onk_en": "They journeyed from Sukkos and camped at Eisom at the edge of the desert.", "pj": "וּנְטָלוּ מִסֻּכּוֹת אָתַר דְּאִתְחַפִּיּוּ בַּעֲנָנֵי יְקָרָא וּשְׁרוֹ בְאֵיתָם דְּבִסְטַר מַדְבְּרָא", "pj_en": "And they journeyed from Succoth, the place where they had been covered with the clouds of glory, and sojourned in Ethan, which is on the side of the desert.", "tj": "דַּאֲתֵי בִּסְיָיפֵי מַדְבְּרָא:", "tj_en": "Which cometh upon the end of the desert.", "rashi": "<b>ויסעו מסכת.<\/b> בַּיּוֹם הַשֵּׁנִי, שֶׁהֲרֵי בָרִאשׁוֹן בָּאוּ מֵרַעְמְסֵס לְסֻכּוֹת:", "rashi_en": "ויסעו מסכת AND THEY JOURNEYED FROM SUCCOTH — on the second day, for on the first day they had come from Rameses to Succoth (Exodus 12:37)."}, {"ch": 13, "v": 21, "aliyah": 1, "heb": "וַֽיהֹוָ֡ה הֹלֵךְ֩ לִפְנֵיהֶ֨ם יוֹמָ֜ם בְּעַמּ֤וּד עָנָן֙ לַנְחֹתָ֣ם הַדֶּ֔רֶךְ וְלַ֛יְלָה בְּעַמּ֥וּד אֵ֖שׁ לְהָאִ֣יר לָהֶ֑ם לָלֶ֖כֶת יוֹמָ֥ם וָלָֽיְלָה׃", "onk": "וַיְיָ מְדַבַּר קָדָמֵיהוֹן בִּימָמָא בְּעַמוּדָא דַעֲנָנָא לְדַבָּרוּתְהוֹן בְּאוֹרְחָא וְלֵילְיָא בְּעַמוּדָא דְאֶשָׁתָא לְאַנְהָרָא לְהוֹן לְמֵיזַל בִּימָמָא וּבְלֵילְיָא:", "onk_en": "Adonoy went before them by day in a pillar of cloud to lead them on the way, and at night in a pillar of fire to provide them with light, so that they could travel by day and by night.", "pj": "וְאֵיקַר שְׁכִינְתָּא דַיְיָ מִידְבַּר קֳדָמֵיהוֹן בִּימָמָא בְּעַמּוּדָא דַעֲנָנָא לְדַבָּרוּתְהוֹן בְּאָרְחָא וּבְלֵילְיָא הָדַר עַמּוּדָא דַעֲנָנָא מִבַּתְרֵיהוֹן לְמַחְשַׁךְ לִדְרַדְפִין מִן בַּתְרֵיהוֹן וְעַמּוּדָא דְאֵישָׁתָא לְאַנְהָרָא קֳדָמֵיהוֹן לְמֵיזַל בִּימָמָא וּבְלֵילְיָא", "pj_en": "And the glory of the Shekinah of the Lord went before them by day in the column of the Cloud to lead them in the way, and at night the column of the Cloud removed behind them to darken on their pursuers behind them; but to be a column of fire to enlighten them before, that they might go forward by day and by night.", "tj": "לְמֶהֱוֵון מְהַלְכִין בִּימָמָא וּבְלֵילְיָא:", "tj_en": "", "rashi": "<b>לנחתם הדרך.<\/b> נָקוּד פַּתָּח שֶׁהוּא כְּמוֹ לְהַנְחוֹתָם, \"לַרְאוֹתְכֶם בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ\" (דברים א') שֶׁהוּא כְמוֹ לְהַרְאוֹתְכֶם, אַף כָּאן לְהַנְחֹתָם עַ\"יְ שָׁלִיחַ, וּמִי הוּא הַשָּׁלִיחַ? עַמּוּד הֶעָנָן; וְהַקָּדוֹשׁ בָּרוּךְ הוּא בִּכְבוֹדוֹ מוֹלִיכוֹ לִפְנֵיהֶם, וּמִכָּל מָקוֹם אֶת עַמּוּד הֶעָנָן הֵכִין לְהַנְחוֹתָם עַל יָדוֹ, שֶׁהֲרֵי עַ\"יְ עַמּוּד הֶעָנָן הֵם הוֹלְכִים; עַמּוּד הֶעָנָן אֵינוֹ לְאוֹרָה אֶלָּא לְהוֹרוֹתָם הַדֶּרֶךְ:", "rashi_en": "לנחתם הדרך TO GUIDE THEM IN THE WAY — It (the ל of לנחתם) is punctuated with Patach, because it (the word) is like לְהַנְחוֹתָם (being a contracted form of this); similar is, (Deuteronomy 1:33) “לַרְאֹתְכֶם the way in which ye shall go”, which is the same as לְהַרְאֹתְכֶם to show you. Thus, too, here: לנחתם means as much as להנחותם to make them be guided i. e. by means of an agent. And who was this agent? The pillar of cloud — and the Holy One, blessed be He, in His glory (Himself) led it before them. Nevertheless He Himself did not act as their immediate guide, but He provided the pillar of cloud that they might be guided by means of it, for, as a matter of fact, as the Scriptural account shows, it was by means of the pillar of cloud that they set forth on their journeys. The pillar of cloud was not for giving light to them but to show them the way."}, {"ch": 13, "v": 22, "aliyah": 1, "heb": "לֹֽא־יָמִ֞ישׁ עַמּ֤וּד הֶֽעָנָן֙ יוֹמָ֔ם וְעַמּ֥וּד הָאֵ֖שׁ לָ֑יְלָה לִפְנֵ֖י הָעָֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לָא יַעֲדֵי עַמוּדָא דַעֲנָנָא בִּימָמָא <b>וְאַף<\/b> לָא עַמוּדָא דְאֶשָׁתָא בְּלֵילְיָא קֳדָם עַמָא:", "onk_en": "He did not remove the pillar of cloud by day, or [<b>even<\/b>] the pillar of fire at night, from before the people.", "pj": "לָא עֲדֵי עֲמוּדָא דַעֲנָנָא בִּימָמָא וְעַמוּדָא דְאֵישָׁתָא בְלֵילְיָא לְמַדְבְּרָא קֳדָם עַמָא", "pj_en": "The column of the Cloud departed not by day, nor the column of fire by night, in leading on before the people.", "tj": "לָא הֲוָה פָסַק:", "tj_en": "It ceased not.", "rashi": "<b>לא ימיש.<\/b> הַקָּבָּ\"ה אֶת <b>עמוד הענן יומם ועמוד האש לילה;<\/b> מַגִּיד שֶׁעַמּוּד הֶעָנָן מַשְׁלִים לְעַמּוּד הָאֵשׁ וְעַמּוּד הָאֵשׁ מַשְׁלִים לְעַמּוּד הֶעָנָן, שֶׁעַד שֶׁלֹּא יִשְׁקַע זֶה עוֹלֶה זֶה:", "rashi_en": "לא ימיש means He — the Holy One, blessed be He — did not let depart (did not remove) את עמוד הענן יומם ועמוד האש לילה THE PILLAR OF CLOUD BY DAY NOR THE PILLAR OF FIRE BY NIGHT. — This tells us (we may gather from this) that the pillar of cloud handed over the camp to the pillar of fire and the pillar of fire handed it over to the pillar of cloud — that before the one set the other rose (Shabbat 23b)."}, {"ch": 14, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake to Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 2, "aliyah": 1, "heb": "דַּבֵּר֮ אֶל־בְּנֵ֣י יִשְׂרָאֵל֒ וְיָשֻׁ֗בוּ וְיַחֲנוּ֙ לִפְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּבֵ֣ין הַיָּ֑ם לִפְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥וֹ תַחֲנ֖וּ עַל־הַיָּֽם׃", "onk": "מַלֵיל עִם בְּנֵי יִשְׂרָאֵל וִיתוּבוּן וְיִשְׁרוּן קֳדָם פּוּם חִירָתָא בֵּין מִגְדוֹל וּבֵין יַמָא קֳדָם בְּעֵיל צְפוֹן לְקִבְלֵהּ תִּשְׁרוּן עַל יַמָא:", "onk_en": "“Speak to the B’nei Yisrael and have them turn back and camp before Pi haChiros, between Migdol and the sea, facing Ba’al Tzephon. Camp opposite it, near the sea.”", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וִיתוּבוּן לַאֲחוֹרֵיהוֹן וְיִשְׁרוּן קֳדָם פּוּמֵי חִירָתָא מַרְבִּיעָתָא דְאִתְבְּרִיוּ בְּגַוְונֵי בְּנֵי נְשָׁא דְכַר וְנוּקְבָא וְעַיְינִין פְּתִיחַן לְהוֹן הוּא אַתְרָא דְטָנֵיס דְּבֵינֵי מִגְדוֹל וּבֵינֵי יַמָּא קֳדָם טַעֲוַת צְפוֹן דְּמִשְׁתַּיֵּיר מִכָּל טַעֲוָון דְּמִצְרָיִם בְּגִין דְּיֵמְרוּן מִצְרָאֵי בָּחִיר הוּא בַּעַל צְפוֹן מִכָּל טַעֲוָותָא דְאִשְׁתַּיֵּיר וְלָא לָקָא דְיֵיתוּן לְמִסְגוֹד לֵיהּ וְיִשְׁכְּחוּן יַתְכוֹן דְּאַתּוּן שְׁרָן לְקִבְלֵיהּ עַל גֵּיף יַמָּא", "pj_en": "Speak to the sons of Israel, that they return back, and encamp before the Mouths of Hiratha, as they lie, created after the manner (likeness) of the children of men, male and female, and their eyes open to them: it is the place of Tanes, which is between Migdol and the sea, before the idol Zephon (Typhon), that is left of all the idols of Mizraim. For the Mizraee will say, More excellent is Baal Zephon than all idols, because it is left, and not smitten; and therefore will they come to worship it, and will find that you are encamped nigh unto it, on the border of the sea.", "tj": "וִיחַזְּרוּן וְיִשְׁרוֹן קֳדָם פּוּנְדְּקִי חִירָתָא בֵּין מִגְדוֹל וּבֵין יַמָּא קֳדָם טַעֲוַות צְפוֹן בִּלְקוֹבְלָהּ תִּישְׁרוּן:", "tj_en": "And they shall return and encamp before the caravansaries of Hiratha, between Migdol and the sea, before the idol of Zephon, ye shall encamp over against it.", "rashi": "<b>וישבו.<\/b> לַאֲחוֹרֵיהֶם, לְצַד מִצְרַיִם הָיוּ מְקָרְבִין כָּל יוֹם הַשְּׁלִישִׁי, כְּדֵי לְהַטְעוֹת אֶת פַּרְעֹה שֶׁיֹּאמַר תּוֹעִים הֵם בַּדֶּרֶךְ, כְּמוֹ שֶׁנֶּאֱמַר \"וְאָמַר פַּרְעֹה לִבְנֵי יִשְׂרָאֵל וְגוֹ'\":<br><br><b>ויחנו לפני פי החירת.<\/b> הוּא פִּיתוֹם, וְעַכְשָׁו נִקְרָא פִּי הַחִירֹת עַל שֵׁם שֶׁנַּעֲשׂוּ שָׁם בְּנֵי חֹרִין; וְהֵם שְׁנֵי סְלָעִים גְּבוֹהִים זְקוּפִים וְהַגַּיְא שֶׁבֵּינֵיהֶם קָרוּי פִּי הַסְּלָעִים:<br><br><b>לפני בעל צפן.<\/b> הוּא נִשְׁאַר מִכָּל אֱלֹהֵי מִצְרַיִם כְּדֵי לְהַטְעוֹתָן, שֶׁיֹּאמְרוּ קָשָׁה יִרְאָתָן, וְעָלָיו פֵּרֵשׁ אִיּוֹב \"מַשְׂגִּיא לַגּוֹיִם וַיְאַבְּדֵם\" (איוב י\"ב):", "rashi_en": "וישבו THAT THEY TURN backwards; all the third day they were moving nearer towards the Egyptians, in order to mislead Pharaoh, so that he should say: They have lost their way, as it is said, (v. 3) “so that Pharaoh will say of the children of Israel, [They are entangled in the land]”.<br><br>ויחנו לפני פי החירת AND ENCAMP BEFORE PI-HAHIROTH — This is identical with Pithom (Mekhilta), but now it obtained the name of פי החירת, because there they became בני חורין free-men (חירת is explained as חרות freedom). This was two high, precipitous rocks and the valley between them was called פי הסלעים the mouth (opening) of the rocks.<br><br>לפני בעל צפון BEFORE BAAL-ZEPHON — It (the idol of this name) alone had been left by God of all the gods of Egypt and, this, too, in order to mislead them — that they should say that their god was a difficult one to overcome. It was with reference to this that Job expressly said, (Job 12:23) “He causes the nations to err (מַשְׂגִיא, is taken in the sense of מַשְׁגִיא from root שגה to err) and then destroyeth them” (Mekhilta; cf. Rashi on this passage)."}, {"ch": 14, "v": 3, "aliyah": 1, "heb": "וְאָמַ֤ר פַּרְעֹה֙ לִבְנֵ֣י יִשְׂרָאֵ֔ל נְבֻכִ֥ים הֵ֖ם בָּאָ֑רֶץ סָגַ֥ר עֲלֵיהֶ֖ם הַמִּדְבָּֽר׃", "onk": "וְיֵימַר פַּרְעֹה עַל בְּנֵי יִשְׂרָאֵל מְעַרְבְּלִין אִנוּן בְּאַרְעָא אֲחַד עֲלֵיהוֹן מַדְבְּרָא:", "onk_en": "Pharaoh will then say of the B’nei Yisrael, “They are confused in the land, the desert has shut [trapped] them in.", "pj": "וְיֵמַר פַּרְעה לְדָתָן וְלַאֲבִירָם בְּנֵי יִשְרָאֵל דְּמִשְׁתַּיְירוּן בְּמִצְרַיִם מְטַרְפִין הִינוּן עַמָּא בֵּית יִשְרָאֵל בְּאַרְעָא טָרַד עֲלֵיהוֹן טַעֲוַות צְפוֹן נַגְדוֹי דְּמַדְבְּרָא", "pj_en": "And Pharoh said to Dathan and Abiram, sons of Israel, who had remained in Mizraim, The people of the house of Israel are bewildered in the land: the idol Zephon hath shut them in close upon the desert.", "tj": "וַאֲמַר פַּרְעה עַל עֵיסַק בְּנֵי יִשְרָאֵל טַעֲיָין אִינוּן בְּמַדְבְּרָא טָרַד עֲלֵיהוֹן טַעֲוָותָא דִפְעוֹר נַגְדוֹי בְּמַדְבְּרָא:", "tj_en": "And Pharoh will say concerning the people of the sons of Israel, They are losing themselves in the wilderness: the idol of Peor hath shut them in before the desert.", "rashi": "<b>ואמר פרעה.<\/b> כְּשֶׁיִּשְׁמַע שֶׁהֵם שָׁבִים לַאֲחוֹרֵיהֶם:<br><br><b>לבני ישראל.<\/b> עַל בְּנֵי יִשְׂרָאֵל. וְכֵן (פסוק יד) \"ה' יִלָּחֵם לָכֶם\" – עֲלֵיכֶם, (בראשית כ יג) \"אִמְרִי לִי אָחִי הוּא\" – אִמְרִי עָלַי:<br><br><b>נבכים הם.<\/b> כְּלוּאִים וּמְשֻׁקָּעִים, וּבְלַעַז שירי\"ר, כְּמוֹ \"נִבְכֵי יָם\" (איוב ל\"ח), \"בְּעֵמֶק הַבָּכָא\" (תהילים פ\"ד) \"מִבְּכִי נְהָרוֹת\" (איוב כ\"ח).<br><br><b>נבכים הם<\/b>, כְּלוּאִים הֵם בַּמִּדְבָּר, שֶׁאֵינָן יוֹדְעִין לָצֵאת מִמֶּנּוּ וּלְהֵיכָן יֵלֵכוּ:", "rashi_en": "ואמר פרעה THEN PHARAOH WILL SAY — when he hears that they are turning back.<br><br>לבני ישראל means על בני ABOUT THE CHILDREN OF ISRAEL. Similarly. (v. 14) “The Lord will fight לכם”, i. e. עליכם for you; (Genesis 20:13) “Say לי, he is my brother” i. e. say about me.<br><br>נבכים הם means, shut up and sunk deep. old French serrer. Of similar meaning are (Job 38:16) “the depths of (נבכי) the sea”; (Psalms 84:7) “in the vale of dejection (הבכא)”; (Job 28:11) “from the depths (מבכי) of the rivers.”<br><br>נבכים הם means THEY ARE SHUT UP in the wilderness — so that they do not know how to get out of it and whither they should go."}, {"ch": 14, "v": 4, "aliyah": 1, "heb": "וְחִזַּקְתִּ֣י אֶת־לֵב־פַּרְעֹה֮ וְרָדַ֣ף אַחֲרֵיהֶם֒ וְאִכָּבְדָ֤ה בְּפַרְעֹה֙ וּבְכׇל־חֵיל֔וֹ וְיָדְע֥וּ מִצְרַ֖יִם כִּֽי־אֲנִ֣י יְהֹוָ֑ה וַיַּֽעֲשׂוּ־כֵֽן׃", "onk": "וְאַתְקֵף יָת לִבָּא דְפַרְעֹה וְיִרְדַף בַּתְרֵיהוֹן וְאֶתְיַקַר בְּפַרְעֹה וּבְכָל מַשִׁרְיָתֵהּ וְיִדְעוּן מִצְרָאֵי אֲרֵי אֲנָא יְיָ וַעֲבָדוּ כֵן:", "onk_en": "I will harden Pharaoh’s heart and he will pursue them. and I will be glorified through Pharaoh and his entire army. Egypt will [then] know that I am Adonoy.” They [the B’nei Yisrael] did just that.", "pj": "וְאַתְקֵיף יַת יִצְרָא דְּלִבָּא דְּפַרְעה וְיִרְדוֹף בַּתְרֵיהוֹן וְאִתְיַקַר בְּפַרְעה וּבְכָל מִשְׁרְיָיתֵיהּ וְיִנְדְעוּן מִצְרָאֵי אֲרוּם אֲנָא הוּא יְיָ וַעֲבָדוּ הֵיכְדֵין", "pj_en": "And I will strengthen the design of Pharoh's heart to pursue after them, and I will be glorified upon Pharoh and upon his hosts, and the Mizraee shall know that I am the Lord. And they did so.", "tj": "", "tj_en": "", "rashi": "<b>ואכבדה בפרעה.<\/b> כְּשֶׁהַקָּבָּ\"ה מִתְנַקֵּם בָּרְשָׁעִים שְׁמוֹ מִתְגַּדֵּל וּמִתְכַּבֵּד, וְכֵן הוּא אוֹמֵר \"וְנִשְׁפַּטְתִּי אִתּוֹ וְגוֹ'\" וְאַחַר כָּךְ \"וְהִתְגַדִּלְתִּי וְהִתְקַדִּשְׁתִּי וְנוֹדַעְתִּי וְגוֹ'\" (יחזקאל ל\"ח), וְאוֹמֵר \"שָׁמָּה שִׁבַּר רִשְׁפֵי קָשֶׁת\", וְאַחַר כָּךְ \"נוֹדָע בִּיהוּדָה אֱלֹהִים\" (תהלים ע\"ו), וְאוֹמֵר \"נוֹדַע ה' מִשְׁפָּט עָשָׂה\" (שם ט'):<br><br><b>בפרעה ובכל חילו.<\/b> הוּא הִתְחִיל בַּעֲבֵרָה וּמִמֶּנּוּ הִתְחִילָה הַפֻּרְעָנוּת:<br><br><b>ויעשו כן.<\/b> לְהַגִּיד שִׁבְחָן, שֶׁשָּׁמְעוּ לְקוֹל מֹשֶׁה, וְלֹא אָמְרוּ הַאֵיךְ נִתְקָרֵב אֶל רוֹדְפֵינוּ? אָנוּ צְרִיכִים לִבְרֹחַ אֶלָּא אָמְרוּ אֵין לָנוּ לְקַיֵם אֶלָּא דִּבְרֵי בֶן עַמְרָם (מכילתא):", "rashi_en": "ואכבדה בפרעה AND I WILL BE HONOURED THROUGH PHARAOH — When the Holy One, blessed be He, takes vengeance on the wicked His name is magnified and honoured. Thus, too, it states, (Ezekiel 38:22, 23) “And I will plead against him [with pestilence and with blood etc.]”, and afterwards, “Thus I shall be magnified and sanctified etc.” And it states, (Psalms 76:3) “There He broke the fiery shafts of the bow”, and afterwards (after He has done this) (v. 2) “In Judah is God known. “Further it states, (Psalms 9:17) “The Lord is known because He executeth judgment” (Mekhilta).<br><br>בפרעה ובכל חילו THROUGH PHARAOH AND THROUGH ALL HIS FORCES — He began the wrongdoing and with him began the punishment (Mekhilta; cf. Rashi on Exodus 7:28).<br><br>ויעשו כן AND THEY DID SO — This is stated in order to tell their praise — that they hearkened to Moses and did not say, How can we move nearer to our enemies; we ought rather to flee,” but they said, ‘‘It is ours only to carry out the bidding of the son of Amram” (cf. Mekhilta)."}, {"ch": 14, "v": 5, "aliyah": 1, "heb": "וַיֻּגַּד֙ לְמֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָעָ֑ם וַ֠יֵּהָפֵ֠ךְ לְבַ֨ב פַּרְעֹ֤ה וַעֲבָדָיו֙ אֶל־הָעָ֔ם וַיֹּֽאמְרוּ֙ מַה־זֹּ֣את עָשִׂ֔ינוּ כִּֽי־שִׁלַּ֥חְנוּ אֶת־יִשְׂרָאֵ֖ל מֵעׇבְדֵֽנוּ׃", "onk": "וְאִתְחַוָא לְמַלְכָּא דְמִצְרַיִם אֲרֵי <b>אֲזַל<\/b> עַמָא וְאִתְהֲפִיךְ לִבָּא דְפַרְעֹה וְעַבְדוֹהִי לְעַמָא וַאֲמָרוּ מָא דָא עֲבַדְנָא אֲרֵי שַׁלַחְנָא יָת יִשְׂרָאֵל מִפָּלְחָנָנָא:", "onk_en": "The king of Egypt was told that the people had fled [<b>gone<\/b>]. Pharaoh and his servants had a change of heart regarding the people, and they said, “What have we done? [How did] we release Israel from serving us?", "pj": "וְתַנוּן אוּקְטְרַיָא דַּאֲזָלוּ עִם יִשְרָאֵל אֲרוּם עָרִיק עַמָא וְאִיתְהַפִּיךְ לִבָּא דְפַרְעה וְעַבְדוֹי לְבִישׁ עַל עַמָא וַאֲמָרוּ מַה דָא עָבַדְנָא אֲרוּם פָּטַרְנָא יַת יִשְרָאֵל מִפּוּלְחָנָא", "pj_en": "And the officers who went with Israel announced that the people had fled. And the heart of Pharoh and his servants was turned unto evil against the people; and they said, What is this that we have done? for we have released Israel from serving us.", "tj": "וְאַתְנֵי לְמַלְכָּא:", "tj_en": "And it was declared to the king.", "rashi": "<b>ויגד למלך מצרים.<\/b> אִיקְטוֹרִין שָׁלַח עִמָּהֶם, וְכֵיוָן שֶׁהִגִּיעוּ לִשְׁלֹשֶׁת יָמִים שֶׁקָבְעוּ לֵילֵךְ וְלָשׁוּב וְרָאוּ שֶׁאֵינָן חוֹזְרִין לְמִצְרַיִם, בָּאוּ וְהִגִּידוּ לְפַרְעֹה בַּיּוֹם הָרְבִיעִי, בַּחֲמִישִׁי וּבַשִּׁשִּׁי רָדְפוּ אַחֲרֵיהֶם, לֵיל שְׁבִיעִי יָרְדוּ לַיָּם, בַּשַּׁחֲרִית אָמְרוּ שִׁירָה וְהוּא יוֹם שְׁבִיעִי שֶׁל פֶּסַח; לְכָךְ אָנוּ קוֹרִין הַשִּׁירָה בַּיּוֹם הַשְּׁבִיעִי:<br><br><b>ויהפך.<\/b> נֶהְפַּךְ מִמַּה שֶּׁהָיָה, שֶׁהֲרֵי אָמַר לָהֶם \"קוּמוּ צְּאוּ מִתּוֹךְ עַמִּי\" (שמות י\"ב), וְנֶהְפַּךְ לֵב עֲבָדָיו, שֶׁהֲרֵי לְשֶׁעָבַר הָיוּ אוֹמְרִים לוֹ \"עַד מָתַי יִהְיֶה זֶה לָנוּ לְמוֹקֵשׁ\" (שמות י'), וְעַכְשָׁיו נֶהֶפְכוּ לִרְדֹף אַחֲרֵיהֶם בִּשְׁבִיל מָמוֹנָם שֶׁהִשְׁאִילוּם:<br><br><b>מעבדנו.<\/b> מֵעֲבֹד אוֹתָנוּ:", "rashi_en": "ויגד למלך מצרים AND IT WAS TOLD THE KING OF EGYPT — He sent public officers with them, and as soon as they had reached the three days’ journey which he had fixed for them to go and return, and these perceived that they were not going back to Egypt, they came and told Pharaoh on the fourth day (cf. Mekhilta). On the fifth and sixth they pursued after them: on the night of the seventh day they went down into the sea and on the following morning they (the Israelites) sang the Song of Praise and this was the seventh day of Passover. And that is why we read “The Song” (Exodus 15:1 ff.) as the Scriptural lesson on the seventh day of the Festival (Megillah 31a; Seder Olam 5; cf. Sotah 12b).<br><br>ויהפך [AND THE HEART…] WAS TURNED — it was turned (changed) from what it had been, because he had said to them (Exodus 12:31) “Arise, go out from the midst of my people”, and his servants’ hearts were changed because formerly they had said to him, (Exodus 10:7) “How long shall this man be a snare unto us? [let the men go etc.]”. Now, however, they (their hearts) were changed, prompting them to pursue them, because of the property that they had handed over to them (cf. Mekhilta).<br><br>מעבדנו means from serving us (i. e. the word is an infinitive with an objective suffix and not a noun signifying “from our service”, which would require מֵעֲבוֹדָתֵנוּ)."}, {"ch": 14, "v": 6, "aliyah": 1, "heb": "וַיֶּאְסֹ֖ר אֶת־רִכְבּ֑וֹ וְאֶת־עַמּ֖וֹ לָקַ֥ח עִמּֽוֹ׃", "onk": "וְטַקִיס יָת רְתִכֵּהּ וְיָת עַמֵהּ דַבַּר עִמֵהּ:", "onk_en": "He [Pharaoh] harnessed his chariot and he took his people with him.", "pj": "וְטַקֵיס אִיהוּ נַפְשֵׁיהּ יַת אַרְתְּכֵיהּ וְיַת עַמֵּיהּ דְּבַר עִמֵּיהּ בְּמִילִין רַכִּיכִין", "pj_en": "And he himself prepared his chariot, and his people led he with him by soft words.", "tj": "", "tj_en": "", "rashi": "<b>ויאסר את רכבו.<\/b> הוּא בְעַצְמוֹ (מכילתא):<br><br><b>ואת עמו לקח עמו.<\/b> מְשָׁכָם בִּדְבָרִים, לָקִינוּ וְנָטְלוּ מָמוֹנֵנוּ וְשִׁלַּחְנוּם, בֹּאוּ עִמִּי וַאֲנִי לֹא אֶתְנַהֵג עִמָּכֶם כִּשְׁאָר מְלָכִים, דֶּרֶךְ שְׁאָר מְלָכִים עֲבָדָיו קוֹדְמִין לוֹ בַּמִּלְחָמָה, וַאֲנִי אַקְדִּים לִפְנֵיכֶם, שֶׁנֶּאֱמַר וּפַרְעֹה הִקְרִיב – הִקְרִיב עַצְמוֹ וּמִהֵר לִפְנֵי חֵילוֹתָיו –, דֶּרֶךְ שְׁאָר מְלָכִים לִטֹּל בִּזָּה בָּרֹאשׁ כְּמוֹ שֶׁיִּבְחַר, אֲנִי אֶשְׁוֶה עִמָּכֶם בַּחֵלֶק שֶׁנֶּאֱמַר \"אֲחַלֵּק שָׁלָל\" (שמות ט\"ו):", "rashi_en": "ויאסר את רכבו AND HE MADE READY HIS CHARIOT — he himself (Mekhilta)<br><br>ואת עמו לקח עמו AND TOOK HIS PEOPLE WITH HIM — he drew them on by fine words, as follows: “We have been stricken and they have taken our money and yet we have let them go free. Come with me and I will not behave with you as other kings. It is the way of other kings that their subjects go in front of them into the battle, but I will go in front of you” — as, indeed, it is said, (v. 10) “And Pharaoh הקריב” (the Hiphil): which signifies he brought himself near and hastened in front of his army. — “It is the way of other kings to take the booty at the beginning as he chooses (to have first pick of the booty), but I will be equal to you in the division of the booty” — as, indeed, it states that he said, (Exodus 15:9) “I will divide the spoil”Mekhilta."}, {"ch": 14, "v": 7, "aliyah": 1, "heb": "וַיִּקַּ֗ח שֵׁשׁ־מֵא֥וֹת רֶ֙כֶב֙ בָּח֔וּר וְכֹ֖ל רֶ֣כֶב מִצְרָ֑יִם וְשָׁלִשִׁ֖ם עַל־כֻּלּֽוֹ׃", "onk": "וּדְבַר שִׁתְּ מְאָה רְתִכִּין בְּחִירָן וְכֹל רְתִכֵּי מִצְרָאֵי <b>וְגִבָּרִין מְמַנָן<\/b> עַל כֻּלְהוֹן:", "onk_en": "He took six hundred elite chariots [and crews], and all the [other] chariots of Egypt, and commanders [<b>mighty men were appointed<\/b>] over all of them.", "pj": "וּדְבַר שִׁית מְאָה רְתִיכִין בְּחִירִין וְכָל רְתִיכֵי מִצְרָאֵי עַבְדוֹי דִדְחִילוּ מִפִּתְגָמָא דַיְיָ דְלָא מִיתוּ בְּמוֹתָנָא וְלָא בְּבַרְדָא וּמוֹלִיתָא תְּלִיתָתָא לְמִנְגַד וּלְמִרְדוֹף בִּבְהִילוּ אוֹסִיף עַל כָּל רְתִיכָא וּרְתִיכָא", "pj_en": "And he took six hundred choice chariots, and all the chariots of the Mizraee his servants, who were afraid of the Word of the Lord, lest they should be killed with pestilence, if not with hail: and a third mule, for drawing and following swiftly, he added to each chariot.", "tj": "", "tj_en": "", "rashi": "<b>בחור.<\/b> נִבְחָרִים, בָּחוּר לְשׁוֹן יָחִיד, כָּל רֶכֶב וָרֶכֶב שֶׁבְּמִנְיָן זֶה הָיָה בָּחוּר:<br><br><b>וכל רכב מצרים.<\/b> וְעִמָּהֶם כָּל שְׁאָר הָרֶכֶב; וּמֵהֵיכָן הָיוּ הַבְּהֵמוֹת הַלָּלוּ? אִם תֹּאמַר מִשֶּׁל מִצְרַיִם, הֲרֵי נֶאֱמַר \"וַיָּמָת כֹּל מִקְנֵה מִצְרָיִם\" (שמות ט'), וְאִם מִשֶּׁל יִשְׂרָאֵל, וַהֲלֹא נֶאֱמַר \"וְגַם מִקְנֵנוּ יֵלֵךְ עִמָּנוּ\", מִשֶּׁל מִי הָיוּ? מִן הַיָּרֵא אֶת דְּבַר ה'. מִכָּאן הָיָה רַ' שִׁמְעוֹן אוֹמֵר, כָּשֵׁר שֶׁבַּמִּצְרִים הֲרֹג, טוֹב שֶׁבַּנְּחָשִׁים רְצֹץ אֶת מֹחוֹ (מכילתא):<br><br><b>ושלשם על כלו.<\/b> שָׂרֵי צְבָאוֹת, כְּתַרְגּוּמוֹ:", "rashi_en": "בחור means CHOSEN. The word בחור is singular number — the idea is: each and every chariot in that number was a selected one.<br><br>וכל רכב מצרים signifies AND with these were ALL THE other CHARIOTS OF EGYPT. And whence came all these animals required for the chariots? If you say that they were from the cattle of the Egyptians — but you know it is stated, (Exodus 9:6) “And all the cattle of the Egyptians died”. And if you say that they were from the Israelites’ cattle — but is it not stated, (Exodus 10:26) “Our cattle, also, shall go with us”! Then whose were they? They were of those “who feared the word of the Lord” and saved their cattle by bringing them into their stables (Exodus 9:20). Deriving it from here (on account of this fact) R. Simeon said: The best amongst the Egyptians — kill him (otherwise he will afterwards devise evil against you); the best amongst the serpents — crush its brains (Mekhilta).<br><br>ושלשים על כלו means army-captains, as the Targum has it."}, {"ch": 14, "v": 8, "aliyah": 1, "heb": "וַיְחַזֵּ֣ק יְהֹוָ֗ה אֶת־לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַיִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּבְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּיָ֥ד רָמָֽה׃", "onk": "וְאַתְקֵף יְיָ יָת לִבָּא דְפַרְעֹה מַלְכָּא דְמִצְרַיִם וּרְדַף בָּתַר בְּנֵי יִשְׂרָאֵל וּבְנֵי יִשְׂרָאֵל נְפָקוּ בְּרֵישׁ גְלִי:", "onk_en": "Adonoy hardened the heart of Pharaoh, king of Egypt, and he pursued the B’nei Yisrael. The B’nei Yisrael went out high handedly [in triumph] [<b>publicly<\/b>].", "pj": "וּתְקֵיף יְיָ יָת יִצְרָא דְלִבָּא דְפַרְעה מַלְכָּא דְמִצְרַיִם וּרְדַף בָּתַר בְּנֵי יִשְרָאֵל וּבְנֵי יִשְרָאֵל נַפְקִין בִּידָא מְרַמְמָא מִתְגַּבְּרִין עַל מִצְרָאֵי", "pj_en": "And the Lord hardened the design of the heart of Pharoh king of Mizraim, and he pursued after the sons of Israel. But the sons of Israel, going out with a high hand, were stronger than the Mizraee.", "tj": "וּבְנֵי יִשְרָאֵל נָפָקוּ פְּרִיקִין:", "tj_en": "But the sons of Israel had gone out free.", "rashi": "<b>ויחזק ה' את לב פרעה.<\/b> שֶׁהָיָה תוֹלֶה אִם לִרְדֹּף אִם לָאו, וְחִזֵּק אֶת לִבּוֹ לִרְדֹּף (שם):<br><br><b>ביד רמה.<\/b> בִּגְבוּרָה גְּבוֹהָה וּמְפֻרְסֶמֶת:", "rashi_en": "ויחזק ה׳ את לב פרעה AND THE LORD ALLOWED THE HEART OF PHARAOH TO BE HARDENED — the meaning is, that he was in doubt whether to pursue or not, and He hardened his heart to pursue (Mekhilta).<br><br>ביד רמה WITH A HIGH HAND — with high and open daring (cf. Mekhilta)."}, {"ch": 14, "v": 9, "aliyah": 2, "heb": "וַיִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵיהֶ֗ם וַיַּשִּׂ֤יגוּ אוֹתָם֙ חֹנִ֣ים עַל־הַיָּ֔ם כׇּל־סוּס֙ רֶ֣כֶב פַּרְעֹ֔ה וּפָרָשָׁ֖יו וְחֵיל֑וֹ עַל־פִּי֙ הַֽחִירֹ֔ת לִפְנֵ֖י בַּ֥עַל צְפֹֽן׃", "onk": "וּרְדָפוּ מִצְרָאֵי בַּתְרֵיהוֹן וְאַדְבִּיקוּ יָתְהוֹן כַּד שָׁרָן עַל יַמָא כָּל סוּסָוַת רְתִכֵּי פַרְעֹה וּפָרָשׁוֹהִי וּמַשִׁרְיָתֵהּ עַל פּוּם חִירָתָא קֳדָם בְּעֵיל צְפוֹן:", "onk_en": "The Egyptians pursued them and overtook them as they were encamped by the sea. There were all Pharaoh’s chariot horses, his cavalry and his army [infantry], at Pi haChiros, facing Ba’al Tzephon.", "pj": "וּרְדָפוּ מִצְרָאֵי בַּתְרֵיהוֹן וְאַדְבִּיקוּ יַתְהוֹן כַּד שְׁרָן עַל יַמָא כְנִיסִין מַרְגְּלַיָין וְאַבְנִין טָבָן דִדְּבַר פִּישׁוֹן מְגִינוּנִיתָא דְעֵדֶן לְגוֹ גִיחוֹן וְגִיחוֹן דַבָּרִינוּן לְיַמָא דְסוּף וְיַמָא דְסוּף רָמָא יַתְהוֹן עַל גֵּיפֵיהּ כָּל סוּסְוַות אַרְתִּיכֵי פַּרְעה וּפָרָשׁוֹי וּמַשְׁרְיִיתֵיהּ עַל פּוּמֵי חִירָתָא דִּקְדָם טַעֲוַות צְפוֹן", "pj_en": "And the Mizraee followed after them, and came upon them as they were encamped by the sea, gathering of pearls and goodly stones, which the river Pishon had carried from the garden of Eden into the Gihon, and the Gihon had carried into the sea of Suph, and the sea of Suph had cast upon its bank. But all the chariot horses of Pharoh, and his horsemen, and his hosts (were coming) towards the Mouths of Hiratha, which are before the idol Zephon.", "tj": "קֳדָם פּוּנְדְּקֵי דְּחִירָתָא קֳדָם טַעֲוָתָא דְצָפוֹן:", "tj_en": "Before the caravansaries of Hiratha, before the idol Zephon.", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 10, "aliyah": 2, "heb": "וּפַרְעֹ֖ה הִקְרִ֑יב וַיִּשְׂאוּ֩ בְנֵֽי־יִשְׂרָאֵ֨ל אֶת־עֵינֵיהֶ֜ם וְהִנֵּ֥ה מִצְרַ֣יִם&thinsp;<b>׀<\/b> נֹסֵ֣עַ אַחֲרֵיהֶ֗ם וַיִּֽירְאוּ֙ מְאֹ֔ד וַיִּצְעֲק֥וּ בְנֵֽי־יִשְׂרָאֵ֖ל אֶל־יְהֹוָֽה׃", "onk": "וּפַרְעֹה קְרֵיב וּזְקָפוּ בְנֵי יִשְׂרָאֵל יָת עֵינֵיהוֹן וְהָא מִצְרָאֵי נַטְלִין בַּתְרֵיהוֹן וּדְחִילוּ לַחֲדָא וּזְעִיקוּ בְּנֵי יִשְׂרָאֵל <b>קֳדָם<\/b> יְיָ:", "onk_en": "Pharaoh drew near, and the B’nei Yisrael looked up, and beheld the Egyptians coming after them. They were very frightened, and the B’nei Yisrael cried out to [<b>before<\/b>] Adonoy.", "pj": "וּפַרְעה חָמָא טַעֲוַות צְפוֹן מִשְׁתְּזֵיב וּקְרֵיב קֳדָמוֹי קָרְבָּנִין וּזְקָפוּ בְּנֵי יִשְרָאֵל יַת עֵינֵיהוֹן וְהָא מִצְרָאֵי נַטְלִין בַּתְרֵיהוֹן וּדְחִילוּ לַחֲדָא וְצַלוּ בְנֵי יִשְרָאֵל קֳדָם יְיָ", "pj_en": "And Pharoh saw the idol Zephon (still) preserved, and offered oblations before it. And the children of Israel lifted up their eyes, and, beheld, the Mizraee were pursuing them; and they were sorely afraid, and the children of Israel prayed before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ופרעה הקריב.<\/b> הָיָה לוֹ לִכְתֹּב וּפַרְעֹה קָרַב, מַהוּ הִקְרִיב? הִקְרִיב עַצְמוֹ וְנִתְאַמֵּץ לְקַדֵּם לִפְנֵיהֶם כְּמוֹ שֶׁהִתְנָה עִמָּהֶם:<br><br><b>נסע אחריהם.<\/b> בְּלֵב אֶחָד כְּאִישׁ אֶחָד. דָּבָר אַחֵר – וְהִנֵּה מִצְרַיִם נֹסֵעַ אַחֲרֵיהֶם, רָאוּ שַׂר שֶׁל מִצְרַיִם נוֹסֵעַ מִן הַשָּׁמַיִם לַעֲזֹר לַמִּצְרִים; – תנחומא:<br><br><b>ויצעקו.<\/b> תָּפְשׂוּ אֻמָּנוּת אֲבוֹתָם – בְּאַבְרָהָם הוּא אוֹמֵר \"אֶל הַמָּקוֹם אֲשֶׁר עָמַד שָׁם\" (בראשית י\"ט), בְּיִצְחָק \"לָשׂוּחַ בַּשָּׂדֶה\", (שם כ\"ד), בְּיַעֲקֹב \"וַיִּפְגַע בַּמָּקוֹם\" (שם כ\"ח):", "rashi_en": "ופרעה הקריב — It should have written ופרעה קרב “and Pharaoh came near” — what is the force of the Hiphil הקריב, “He caused to come near”? He made himself come near — he forced himself to go in front of them as he had arranged with them (cf. Rashi on v. 6).<br><br>נסע אחריהם [EGYPT] JOURNEYED AFTER THEM (נסע is singular) — the Egyptians journeyed after them with one mind and as one man (hence the use of the singular) (Mekhilta). Another explanation of והנה מצרים נסע אחריהם is: the singular denotes that they saw, not the Egyptians, but the guardian angel of Egypt coming from heaven to assist the Egyptians. Thus is it explained in the Tanchuma (cf. Exodus Rabbah 21:5).<br><br>ויצעקו AND THEY CRIED — they took to hand the handicraft of their fathers (they had recourse to prayer as their fathers had always done in times of trouble). In the case of Abraham it is said, (Genesis 19:27) “[And Abraham went] to the place where he had stood in prayer”. In the case of Isaac: (Genesis 24:63) “[He went out towards evening] to pray”. In the case of Jacob: (Genesis 28:11) “He prayed to the Omnipresent God” (cf. Mekhilta; Midrash Tanchuma, Vayera 9, and Rashi on the texts quoted)."}, {"ch": 14, "v": 11, "aliyah": 2, "heb": "וַיֹּאמְרוּ֮ אֶל־מֹשֶׁה֒ הֲֽמִבְּלִ֤י אֵין־קְבָרִים֙ בְּמִצְרַ֔יִם לְקַחְתָּ֖נוּ לָמ֣וּת בַּמִּדְבָּ֑ר מַה־זֹּאת֙ עָשִׂ֣יתָ לָּ֔נוּ לְהוֹצִיאָ֖נוּ מִמִּצְרָֽיִם׃", "onk": "וַאֲמָרוּ לְמשֶׁה הֲמִדְלֵית קִבְרִין בְּמִצְרַיִם דְבַרְתָּנָא לִמְמַת בְּמַדְבְּרָא מָא דָא עֲבַדְתָּא לָנָא לְאַפָּקוּתָנָא מִמִצְרָיִם:", "onk_en": "They said to Moshe, “Were there not enough graves in Egypt that you took us out to die in the desert? What have you done to us, bringing us out of Egypt?", "pj": "וַאֲמָרוּ רַשִׁיעֵי דָרָא לְמשֶׁה הֲמִן בִּגְלַל דְּלָא הֲוַת לָנָא בֵּית קְבוּרְתָּא בְּמִצְרָיִם דְּבַרְתָּנָא לִמְמַת בְּמַדְבְּרָא מַה דָּא עָבַדְתְּ לָנָא לְהַנְפָּקוּתָנָא מִמִּצְרָיִם", "pj_en": "But the wicked generation said to Mosheh, Because there were no places of burial for us in Mizraim, hast thou led us forth to die in the wilderness ? What hast thou done to us, in bringing us out of Mizraim?", "tj": "", "tj_en": "", "rashi": "<b>המבלי אין קברים.<\/b> וְכִי מֵחֲמַת חֶסְרוֹן קְבָרִים – שֶׁאֵין קְבָרִים בְּמִצְרַיִם לִקָּבֵר שָׁם – לְקַחְתָּנוּ מִשָּׁם. ש\"י פו\"ר פלינ\"צא ד\"י נו\"ן פוש\"יש בְלַעַז:", "rashi_en": "המבלי אין קברים signifies, was it on account of lack of graves — because there were no graves in Egypt in which to be buried — that thou didst bring us out from there? old French si pour faillance de non fossés."}, {"ch": 14, "v": 12, "aliyah": 2, "heb": "הֲלֹא־זֶ֣ה הַדָּבָ֗ר אֲשֶׁר֩ דִּבַּ֨רְנוּ אֵלֶ֤יךָ בְמִצְרַ֙יִם֙ לֵאמֹ֔ר חֲדַ֥ל מִמֶּ֖נּוּ וְנַֽעַבְדָ֣ה אֶת־מִצְרָ֑יִם כִּ֣י ט֥וֹב לָ֙נוּ֙ עֲבֹ֣ד אֶת־מִצְרַ֔יִם מִמֻּתֵ֖נוּ בַּמִּדְבָּֽר׃", "onk": "הֲלָא דֵין פִּתְגָמָא דִי מַלֵלְנָא עִמָךְ בְמִצְרַיִם לְמֵימַר שְׁבוֹק מִנָנָא וְנִפְלַח יָת מִצְרָאֵי אֲרֵי טַב לָנָא דְנִפְלַח יָת מִצְרָאֵי מִדִנְמוּת בְּמַדְבְּרָא:", "onk_en": "This is the [exact] thing that we told you in Egypt saying, ‘Leave us alone and let us serve the Egyptians.’ It would have been better for us to serve the Egyptians than we should die in the desert.”", "pj": "הֲלָא דֵין הוּא פִּתְגָמָא דְמַלֵילְנָא עִמָּךְ בְּמִצְרַיִם יִתְגְּלֵי יְיָ עֲלֵיכוֹן וִידוּן לְמֵימַר פְּסַק מִנָנָא וְנִפְלַח יַת מִצְרָאֵי אֲרוּם טַב לָנָא דְּנִפְלַח יַת מִצְרָאֵי מִדְנָמוּת בְּמַדְבְּרָא", "pj_en": "Was as not this the word that we spake to thee in Mizraim, Let the Lord manifest Himself over us and judge, saying, Desist from us, and we will serve the Mizraee? for it is better for us to serve the Mizraee than to perish in the desert.", "tj": "", "tj_en": "", "rashi": "<b>אשר דברנו אליך בארץ מצרים.<\/b> וְהֵיכָן דִּבְּרוּ? \"יֵרֶא ה' עֲלֵיכֶם וְיִשְׁפֹּט\" (שמות ה') (מכילתא):<br><br><b>ממתנו.<\/b> מֵאֲשֶׁר נָמוּת, וְאִם הָיָה נָקוּד מְלָאפוּם הָיָה נִבְאָר מִמִּיתָתֵנוּ, עַכְשָׁיו שֶׁנָּקוּד בְּשׁוּרֻק נִבְאָר מֵאֲשֶׁר נָמוּת וְכֵן \"מִי יִתֵּן מוּתֵנוּ\" (שמות ט\"ז) – שֶׁנָּמוּת, וְכֵן \"מִי יִתֵּן מוּתִי\" דְּאַבְשָׁלוֹם (שמואל ב' י\"ט) – שֶׁאָמוּת. כְּמוֹ \"לְיוֹם קוּמִי לְעַד\" (צפניה ג'), \"עַד יוֹם שׁוּבִי בְשָׁלוֹם\" (דברי הימים ב' י\"ח) – שֶׁאָקוּם, שֶׁאָשׁוּב:", "rashi_en": "אשר דברנו אליך במצרים [THE WORD] THAT WE SPOKE UNTO THEE IN EGYPT — And where had they said this? (Exodus 5:21) “The Lord look upon you and judge!” (Mekhilta)<br><br>ממתנו means THAN THAT WE SHOULD DIE. If the word had been punctuated with a Melopum (our חולם i. e. מִמּוֹתֵנוּ) it would have to be explained “than our death” (מוֹתֵנוּ our death from the noun מָוֶת) but now that it is punctuated with a שורק (our Kibbutz) it must be explained by “than that we should die”. And similar is, (Exodus 16:3) “Would that מוּתֵנוּ” i. e. “that we should die”; similar is, (II Samuel 19:1) “Would that מוּתִי” in the history of Absalom, which means “that I should die”. It is an infinitive like (Zephaniah 3:8) “Until the day קוּמִי for ever”, and as (II Chronicles 18:26) “Until the day שׁוּבִי in peace” — which signify שאקום “that I shall arise”, and שאשוב “that I shall return”."}, {"ch": 14, "v": 13, "aliyah": 2, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֣ה אֶל־הָעָם֮ אַל־תִּירָ֒אוּ֒ הִֽתְיַצְּב֗וּ וּרְאוּ֙ אֶת־יְשׁוּעַ֣ת יְהֹוָ֔ה אֲשֶׁר־יַעֲשֶׂ֥ה לָכֶ֖ם הַיּ֑וֹם כִּ֗י אֲשֶׁ֨ר רְאִיתֶ֤ם אֶת־מִצְרַ֙יִם֙ הַיּ֔וֹם לֹ֥א תֹסִ֛פוּ לִרְאֹתָ֥ם ע֖וֹד עַד־עוֹלָֽם׃", "onk": "וַאֲמַר משֶׁה לְעַמָא לָא תִדְחֲלוּן אִתְעַתָּדוּ וַחֲזוֹ יָת פּוּרְקָנָא דַיְיָ דְיַעְבֵּד לְכוֹן יוֹמָא דֵין אֲרֵי כְּמָא דִחֲזֵיתוּן יַת מִצְרָאֵי יוֹמָא דֵין לָא תוֹסְפוּן לְמֶחֱזֵיהוֹן עוֹד עַד עָלְמָא:", "onk_en": "Moshe said to the people, “Do not be afraid, stand firm and you will see the deliverance of Adonoy, which He will perform for you this day, for the Egyptians you have seen this day you will never again see them, even to eternity.", "pj": "אַרְבַּע כִּיתַּן אִתְעֲבִידוּ בְּנֵי יִשְרָאֵל עַל גֵּיף יַמָא דְסוּף חֲדָא אָמְרָה נֵיחוֹת לְיַמָא וַחֲדָא אָמְרָה נֵיתוּב לְמִצְרַיִם וַחֲדָא אָמְרָה נְסַדְרָה לְקוּבְלֵיהוֹן סִדְרֵי קְרָבָא וַחֲדָא אָמְרָה נְבַלְבְּלָא לְקוּבְלֵיהוֹן וּנְעַרְבִבָה יַתְהוֹן כִּתָּא דַהֲוָה אָמְרָה נֵיחוּת לְיַמָא אָמַר לְהוֹן משֶׁה לָא תְדַחֲלוּן אִתְעַתְּדוּ וְחָמוּן יַת פּוּרְקָנָא דַיְיָ דְיַעֲבֵיד לְכוֹן יוֹמָא דֵין כִּתָּא דַּהֲוַת אָמְרָה נֵיתוּב לְמִצְרָיִם אָמַר לְהוֹן משֶׁה לָא תְתִיבוּן אֲרוּם הֵיכְמָא דַּחֲמִיתוּן יַת מִצְרָאֵי יוֹמָא דֵין לָא תוֹסְפוּן לְמֶיחְמֵיהוֹן תּוּב עַד עַלְמָא", "pj_en": "Four parties were made (among) the sons of Israel on the shore of the Weedy Sea: one said, Let us go down into the sea; another said, Let us return into Mizraim; another said Let us set against them the line of battle; and another said Let us raise a cry against them, and confound them. Unto the company which said, Let us go down to the sea, spake Mosheh, Fear not, stand still, and see the salvation of the Lord, which will be wrought for you today. To the company which said, Let us return into Mizraim Mosheh said, You shall not return; for, though you see the Mizraee today, you will see them no more for ever.", "tj": "אַרְבָּעָה כִּיתִּין אִתְעֲבִידוּ בְּנֵי יִשְרָאֵל כַּד הֲווֹ קַיְימִין עַל יַמָא דְסוּף חֲדָא אָמְרָה נִפּוֹל בְּיַמָא וַחֲדָא אָמְרָה נַחֲזוֹר לְמִצְרַיִם וַחֲדָא אָמְרָה נְסַדֵר לְקוֹבְלֵיהוֹן קְרָבָא וַחֲדָא אָמְרָה נְלַוְלַוֵי לְקוֹבְלֵיהוֹן וּנְעַרְבִיב יַתְהוֹן: כִּתָּא דַהֲוָה אָמַר נִפּוֹל לְיַמָא אָמַר לְהוֹן משֶׁה לָא תִדַחֲלוּן אִתְעַתְּדוּ וַחֲמוּן יַת פּוּרְקָנֵיהּ דַּיָי דִי עָבִיד לְכוֹן יוֹמָא דֵין: כִּתָּא דַהֲוָה אָמַר נַחֲזוֹר לְמִצְרַיִם אָמַר לְהוֹן משֶׁה לָא תִדַחֲלוּן אֲרוּם הֵיךְ כְּמָא דַחֲמִיתוּן יַת מִצְרָאֵי יוֹמָא דֵין לָא תוֹסְפוּן לְמֶחְמֵי יַתְהוֹן עוֹד עַד עַלְמָא בְּשִׁיעֲבּוּד:", "tj_en": "Four companies made the sons of Israel, standing by the Weedy Sea. One said, Let us fall upon the sea; another said, Let us return to Mizraim; another said, Let us array battle against them; and another said, Let us shout against them to confuse them. To that company who said, Let us fall upon the sea, Mosheh said, Fear not; stand still, and see the salvation of the Lord which shall be wrought for you this day. To the company who said, We will return unto Mizraim, Mosheh said, Fear not; for as you have seen the Mizraee to-day, you will see them no more in bondage for ever.", "rashi": "<b>כי אשר ראיתם את מצרים וגו'.<\/b> מַה שֶּׁרְאִיתֶם אוֹתָם אֵינוֹ אֶלָּא <b>היום<\/b>, הַיּוֹם הוּא שֶׁרְאִיתֶם אוֹתָם וְלֹא תוֹסִיפוּ עוֹד:", "rashi_en": "כי אשר ראיתם את מצרים וגו׳ means WHAT (the fact that) YE HAVE SEEN them (THE EGYPTIANS), is only היום THIS DAY — to-day it it that ye see them, BUT YE SHALL NEVER AGAIN see them."}, {"ch": 14, "v": 14, "aliyah": 2, "heb": "יְהֹוָ֖ה יִלָּחֵ֣ם לָכֶ֑ם וְאַתֶּ֖ם תַּחֲרִשֽׁוּן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "יְיָ יְגִיחַ לְכוֹן <b>קְרָב<\/b> וְאַתּוּן תִּשְׁתְּקוּן:", "onk_en": "Adonoy will fight [<b>the war<\/b>] for you, and you [must] remain silent.", "pj": "כִּתָּא דַהֲוָה אָמְרָה נְסַדְרָה לְקוּבְלֵיהוֹן סִדְרֵי קְרָבָא אָמַר לְהוֹן משֶׁה לָא תַגִּיחוּן דְּמִן קֳדָם יְיָ מִתְעֲבֵיד לְכוֹן נִצְחָנוּת קָרְבֵיכוֹן כִּיתָּא דַּהֲוַת אָמְרָה נְבַלְבְּלָא לְקוּבְלֵיהוֹן אָמַר לְהוֹן משֶׁה שְְׁתוּקוּ וְהָבוּ יְקָרָא וְתּוּשְׁבַּחְתָּ וְרוֹמְמוּ לֵאֱלָקָכוֹן", "pj_en": "To the company who said, Let us set against them the line of battle, said Mosheh, Contend not; for the victory shall be wrought among you from the presence of the Lord. And to the company who said. Let us raise a cry against them, Mosheh said, Be silent; and give the glory, and praise, and exaltation to your God.", "tj": "כִּתָּא דַהֲוָה אָמַר נְסַדֵר לְקוֹבְלֵיהוֹן סִדְרֵי קְרָבָא אָמַר לְהוֹן משֶׁה לָא תְדַחֲלוּן יְיָ בִּיקַר שְׁכִינְתֵּיהּ הוּא דְיַעֲבֵיד לְכוֹן נַצְחָנֵי קְרָבֵיהוֹן: כִּתָּא דַהֲוָה אָמַר נְלַוְלַוֵי לְקוֹבְלֵיהוֹן וּנְעַרְבֵב יַתְהוֹן אָמַר לְהוֹן משֶׁה לָא תִדַחֲלוּן קוּמוּ וּשְׁתוּקוּ וַהֲבוּ יְקָרָא וְתוּשְׁבְּחָא וְרוֹמְמוּ לֵאלָהָא:", "tj_en": "To the company who said, We will array battle against them, Mosheh said, Fear not; the Lord, in the glory of His Shekinah, will work the victory for your hosts. To the company who had said, Let us shout against them to confound them, Mosheh said, Fear not; stand and be silent; and give the glory, and praise, and exaltation unto Eloha.", "rashi": "<b>ילחם לכם.<\/b> בִּשְׁבִילְכֶם; וְכֵן \"כִּי ה' נִלְחָם לָהֶם\", וְכֵן \"אִם לָאֵל תְּרִיבוּן\" (איוב י\"ג), וְכֵן \"וַאֲשֶׁר דִּבֶּר לִי\" (בראשית כ\"ד), וְכֵן \"הַאַתֶּם תְּרִיבוּן לַבַּעַל\" (שופטים ו'):", "rashi_en": "ילחם לכם means He will fight on your behalf; similar is (v. 25) “For the Lord fighteth for them (להם)”; so too, (Job. 13:8) “will ye contend for God (לאל)?” and thus, too, (Genesis 24:7) “and who spoke on my behalf (לי)”, and so, too, (Judges 6:31) “Will ye plead for Baal (לבעל)?”"}, {"ch": 14, "v": 15, "aliyah": 3, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה מַה־תִּצְעַ֖ק אֵלָ֑י דַּבֵּ֥ר אֶל־בְּנֵי־יִשְׂרָאֵ֖ל וְיִסָּֽעוּ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה <b>קַבֵּלִית צְלוֹתָךְ<\/b> מַלֵיל עִם בְּנֵי יִשְׂרָאֵל וְיִטְלוּן:", "onk_en": "Adonoy said to Moshe, “Why do you cry to Me? [<b>I have accepted your prayer.<\/b>] Speak to the B’nei Yisrael and let them move on.", "pj": "וַאֲמַר יְיָ לְמשֶׁה לָמָה אַנְתְּ קָאֵי וּמַצְלֵי קֳדָמַי הָא צְלוֹתְהוֹן דְּעַמִּי קַדְמַת לְדִידָךְ מַלֵּיל עִם בְּנֵי יִשְרָאֵל וְיִטְלוּן", "pj_en": "And the Lord said to Mosheh, Why standest thou praying before Me? Behold, the prayers of My people have come before thy own: speak to the sons of Israel, that they go forward;", "tj": "וַאֲמַר מֵימְרָא דַיְיָ לְמשֶׁה עַד אֵימַת אַתְּ קָאִים וּמַצְלֵי קֳדָמַי שְׁמִיעָא הִיא צְלוֹתָךְ קֳדָמַי בְּרַם צְלוֹתְהוֹן דְּעַמִּי קַדְמַת לְדִידָךְ מַלֵיל עִם בְּנֵי יִשְרָאֵל וְיִטְלוּן:", "tj_en": "And the Word of the Lord said to Mosheh, How long standest thou praying before Me ? Heard before Me are thy prayers; but the prayers of My people have preceded thine. Speak to the sons of Israel that they go forward;", "rashi": "<b>מה תצעק אלי.<\/b> לִמְּדָנוּ שֶׁהָיָה מֹשֶׁה עוֹמֵד וּמִתְפַּלֵּל, אָמַר לוֹ הַקָּבָּ\"ה, לֹא עֵת עַתָּה לְהַאֲרִיךְ בִּתְפִלָּה, שֶׁיִּשְׂרָאֵל נְתוּנִין בְּצָרָה (מכילתא). דָּ\"אַ – מַה תִּצְעַק אֵלָי, עָלַי הַדָּבָר תָּלוּי וְלֹא עָלֶיךָ, כְּמוֹ שֶׁנֶּאֱמַר לְהַלָּן \"עַל בָּנַי וְעַל פֹּעַל יָדַי תְּצַוֻּנִי\" (ישעיהו מ\"ה):<br><br><b>דבר אל בני ישראל ויסעו.<\/b> אֵין לָהֶם אֶלָּא לִסַּע, שֶׁאֵין הַיָּם עוֹמֵד בִּפְנֵיהֶם, כְּדַאי הוּא זְכוּת אֲבוֹתֵיהֶם וְהָאֱמוּנָה שֶׁהֶאֱמִינוּ בִי וְיָצְאוּ, לִקְרֹעַ לָהֶם הַיָּם (מכילתא):", "rashi_en": "מה תצעק אלי WHEREFORE CRIEST THOU UNTO ME? — there is no mention that he prayed to God concerning this, but this teaches us that Moses stood in prayer. Whereupon the Holy One, blessed be He, said to him, “It is no time now to pray at length, when Israel is placed in trouble”. Another explanation of מה תצעק אלי (taking it in the sense of “Wherefore criest thou? אלי it is to Me — concerns Me”) — upon Me rests this matter and not upon thee. The idea contained in this explanation is similar to what is expressed elsewhere: (Isaiah 45:11) “Concerning My sons and concerning the work of My hands will ye command Me?” (Mekhilta)<br><br>דבר אל בני ישראל ויסעו SPEAK UNTO THE CHILDREN OF ISRAEL THAT THEY JOURNEY ONWARDS — There is nothing for them to do but to journey on, for the sea will not stand in their way: their ancestors’ merits and their own, and the faith that they placed in Me so that they left Egypt will suffice to divide the sea for them (cf. Mekhilta; Shemot Rabbah 21:8)."}, {"ch": 14, "v": 16, "aliyah": 3, "heb": "וְאַתָּ֞ה הָרֵ֣ם אֶֽת־מַטְּךָ֗ וּנְטֵ֧ה אֶת־יָדְךָ֛ עַל־הַיָּ֖ם וּבְקָעֵ֑הוּ וְיָבֹ֧אוּ בְנֵֽי־יִשְׂרָאֵ֛ל בְּת֥וֹךְ הַיָּ֖ם בַּיַּבָּשָֽׁה׃", "onk": "וְאַתְּ טוֹל יָת חֻטְרָךְ וַאֲרֵים יָת יְדָךְ עַל יַמָא וּבְזָעוֹהִי וְיֵעֲלוּן בְּנֵי יִשְׂרָאֵל בְּגוֹ יַמָא בְּיַבֶּשְׁתָּא:", "onk_en": "And you [do as follows], raise your staff and extend your hand over the sea and split it. The B’nei Yisrael will then come [across] in the midst of the sea on dry land.", "pj": "וְאַנְתְּ אֲרוּם יַת חוּטְרָךְ וְאַרְכִין יַת יְדָךְ בֵּיהּ עַל יַמָא וּבַזְעֵיהּ וְעָלוּן בְּנֵי יִשְרָאֵל בְּגוֹ יַמָּא בְּיַבֶּשְׁתָּא", "pj_en": "and thou, lift up thy rod, and stretch forth thy hand with it over the sea, and divide it: and the sons of Israel shall go through the midst of the sea upon the ground.", "tj": "וְאַתְּ אַרְעֵם יַת חוּטְרָךְ וְאַרְכִין יַת יְדָךְ:", "tj_en": "and thou, lift, up thy rod and stretch forth thy hand.", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 17, "aliyah": 3, "heb": "וַאֲנִ֗י הִנְנִ֤י מְחַזֵּק֙ אֶת־לֵ֣ב מִצְרַ֔יִם וְיָבֹ֖אוּ אַחֲרֵיהֶ֑ם וְאִכָּבְדָ֤ה בְּפַרְעֹה֙ וּבְכׇל־חֵיל֔וֹ בְּרִכְבּ֖וֹ וּבְפָרָשָֽׁיו׃", "onk": "וַאֲנָא הָא אֲנָא מְתַקֵף יָת לִבָּא דְמִצְרָאֵי וְיֵעֲלוּן בַּתְרֵיהוֹן וְאֶתְיַקַר בְּפַרְעֹה וּבְכָל מַשִׁרְיָתֵהּ בִּרְתִכּוֹהִי וּבְפָרָשׁוֹהִי:", "onk_en": "I will harden the heart of the Egyptians and they will follow after them. I will be glorified through Pharaoh and his entire army, his chariots and his cavalry.", "pj": "וַאֲנָא הָא אֲנָא מַתְקִיף יַת יִצְרָא דְלִבְּהוֹן דְּמִצְרָאֵי וְיַעֲלוּן בַּתְרֵיהוֹן וְאִתְיְקַר בְּפַרְעה וּבְכָל מַשִׁירְיָיתֵיהּ בִּרְתִיכוֹי וּבְפָרָשׁוֹי", "pj_en": "For, behold, I will harden the design of the heart of the Mizraee, and they will go in after them; and I will be glorified upon Pharoh and upon all his hosts, upon his chariots and his horsemen;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 18, "aliyah": 3, "heb": "וְיָדְע֥וּ מִצְרַ֖יִם כִּי־אֲנִ֣י יְהֹוָ֑ה בְּהִכָּבְדִ֣י בְּפַרְעֹ֔ה בְּרִכְבּ֖וֹ וּבְפָרָשָֽׁיו׃", "onk": "וְיִדְּעוּן מִצְרָאֵי אֲרֵי אֲנָא יְיָ בְּאִתְיַקָרוּתִי בְּפַרְעֹה בִּרְתִכּוֹהִי וּבְפָרָשׁוֹהִי:", "onk_en": "The Egyptians will know that I am Adonoy when I am glorified through Pharaoh, his chariots and cavalry.", "pj": "וְיֵדְעוּן מִצְרָאֵי אֲרוּם אֲנָא הוּא יְיָ בְּאִתְיַקָּרוּתִי בְּפַרְעה בִּרְתִיכוֹי וּבְפָרָשׁוֹי", "pj_en": "that the Mizraee may know that I am the Lord, when I am glorified upon Pharoh, upon his chariots and horsemen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 19, "aliyah": 3, "heb": "וַיִּסַּ֞ע מַלְאַ֣ךְ הָאֱלֹהִ֗ים הַהֹלֵךְ֙ לִפְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַיֵּ֖לֶךְ מֵאַחֲרֵיהֶ֑ם וַיִּסַּ֞ע עַמּ֤וּד הֶֽעָנָן֙ מִפְּנֵיהֶ֔ם וַֽיַּעֲמֹ֖ד מֵאַחֲרֵיהֶֽם׃", "onk": "וּנְטַל מַלְאֲכָא דַיְיָ דִמְדַבַּר קֳדָם מַשְׁרִיתָא דְיִשְׂרָאֵל וַאֲתָא מִבַּתְרֵיהוֹן וּנְטַל עַמּוּדָא דַעֲנָנָא מִן קֳדָמֵיהוֹן וּשְׁרָא מִבַּתְרֵיהוֹן:", "onk_en": "The angel of Elohim moved [from its position] when it traveled in front of the camp of Israel, and went behind them. The pillar of cloud moved from in front of them and it stood behind them.", "pj": "וּנְטַל מַלְאָכָא דַיְיָ דְּמִדַּבַּר קֳדָם מַשְׁרְיָתָא דְיִשְרָאֵל וְאָתָא מִן בַּתְרֵיהוֹן וּנְטַל עַמּוּדָא דַעֲנָנָא מִן קֳדָמֵיהוֹן וּשְׁרָא מִן בַּתְרֵיהוֹן מִן בִּגְלַל מִצְרָאֵי דְפַתְקִין גִּירִין וְאַבְנִין לְיִשְרָאֵל וַהֲוָה עֲנָנָא מְקַבֵּל יַתְהוֹן", "pj_en": "And the Angel of the Lord who led the way before the hosts of Israel went and came behind them; and the column of the Cloud went from before and stood behind them: because the Mizraee threw darts and stones at the Israelites, but the Cloud intercepted them", "tj": "", "tj_en": "", "rashi": "<b>וילך מאחריהם.<\/b> לְהַבְדִּיל בֵּין מַחֲנֵה מִצְרַיִם וּבֵין מַחֲנֵה יִשְׂרָאֵל וּלְקַבֵּל חִצִּים וּבָלִיסְטְרָאוֹת שֶׁל מִצְרַיִם. בְּכָל מָקוֹם הוּא אוֹמֵר מַלְאַךְ ה' וְכָאן מַלְאַךְ הָאֱלֹהִים, אֵין אֱלֹהִים בְּכָל מָקוֹם אֶלָּא דַּיָּן, מְלַמֵּד שֶׁהָיוּ יִשְׂרָאֵל נְתוּנִין בַּדִּין בְּאוֹתָהּ שָׁעָה אִם לְהִנָּצֵל אִם לְהֵאָבֵד עִם מִצְרַיִם (שם):<br><br><b>ויסע עמוד הענן.<\/b> כְּשֶׁחָשְׁכָה וְהִשְׁלִים עַמּוּד הֶעָנָן אֶת הַמַּחֲנֶה לְעַמּוּד הָאֵשׁ, לֹא נִסְתַּלֵּק הֶעָנָן כְּמוֹ שֶׁהָיָה רָגִיל לְהִסְתַּלֵּק עַרְבִית לְגַמְרִי, אֶלָּא נָסַע וְהָלַךְ לוֹ מֵאַחֲרֵיהֶם לְהַחֲשִׁיךְ לְמִצְרַיִם:", "rashi_en": "וילך מאחריהם AND WENT BEHIND THEM to divide the camp of Egypt from the camp of Israel and to receive the arrows and the missiles of the Egyptians. Everywhere it says “The Angel of the Lord (ה׳)” whilst here we have The Angel of God (אלהים).”! The name אלהים really denotes, wherever it occurs, “Judge” (lit., “judgment”). Therefore the use of this term here teaches us that Israel was, at that moment, arraigned in judgment, whether to be saved or to be destroyed together with Egypt (Mekhilta).<br><br>ויסע עמוד הענן AND THE PILLAR OF CLOUD WENT [FROM BEFORE THEM] — When it became dark and the pillar of cloud handed over the camp to the pillar of fire, the cloud did not go away as it was accustomed to go away altogether in the evening, but it went and betook itself behind them to make it dark for the Egyptians."}, {"ch": 14, "v": 20, "aliyah": 3, "heb": "וַיָּבֹ֞א בֵּ֣ין&thinsp;<b>׀<\/b> מַחֲנֵ֣ה מִצְרַ֗יִם וּבֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַיְהִ֤י הֶֽעָנָן֙ וְהַחֹ֔שֶׁךְ וַיָּ֖אֶר אֶת־הַלָּ֑יְלָה וְלֹא־קָרַ֥ב זֶ֛ה אֶל־זֶ֖ה כׇּל־הַלָּֽיְלָה׃", "onk": "וְעַל בֵּין מַשְׁרִיתָא דְמִצְרָאֵי וּבֵין מַשְׁרִיתָא דְיִשְׂרָאֵל וַהֲוָה עֲנָנָא וְקַבְלָא לְמִצְרָאֵי <b>וּלְיִשְׂרָאֵל<\/b> נְהַר כָּל לֵילְיָא וְלָא אִתְקְרִיבוּ דֵין לְוָת דֵין כָּל לֵילְיָא:", "onk_en": "It came between the Egyptian camp and the camp of Yisrael. There was the cloud and darkness [for the Egyptians] and [the pillar of fire] lit up the night [<b>for Yisrael<\/b>]. The camps did not approach each other all that night.", "pj": "וְאָעֵיל בֵּין מַשִׁירְיָתָא דְיִשְרָאֵל וּבֵין מַשִּׁירְיָתָא דְמִצְרָאֵי וַהֲוָה עֲנָנָא פַּלְגֵיהּ נְהוֹרָא וּפַלְגֵיהּ חֲשׁוֹכָא מִסִּטְרֵיהּ חָד מַחֲשָׁךְ עַל מִצְרָאֵי וּמִסִּטְרֵיהּ חָד אַנְהַר עַל יִשְרָאֵל כָּל לֵילְיָא וְלָא קְרָבָא מַשְׁרֵי כָּל קְבֵיל מַשְׁרֵי לִמְסַדְרָא סִדְרֵי קְרָבָא כָּל לֵילְיָא", "pj_en": "and it came between the host of Israel and the host of the Mizraee; a cloud, one half of which was light and one half darkness. On the one side it darkened upon the Mizraee, and on the other side it shined upon Israel all night; and one host did not attack the other all the night.", "tj": "וַהֲוָה עֲנָנָא פַּלְגָא נְהוֹר וּפַלְגָא חֲשׁוֹכָא נְהוֹר מַנְהַר עַל יִשְרָאֵל וַחֲשׁוֹכָא מַחֲשַׁךְ עַל מִצְרַיִם וְלָא קְרִיבוּ אִלֵּין לְאִלֵּין לִמְסַדְּרֵי קְרָבָא כָּל לֵילְיָא:", "tj_en": "And the cloud was half light and half darkness: light, it enlightened upon Israel; and darkness, it darkened upon Mizraim. And those came not against these, to set battle in order, all the night.", "rashi": "<b>ויבא בין מחנה מצרים.<\/b> מָשָׁל לִמְהַלֵּךְ בַּדֶּרֶךְ וּבְנוֹ מְהַלֵּךְ לְפָנָיו, בָּאוּ לִסְטִים לִשְׁבּוֹתוֹ, נְטָלוֹ מִלְּפָנָיו וּנְתָנוֹ לְאַחֲרָיו, בָּא זְאֵב מֵאַחֲרָיו, נְתָנוֹ לְפָנָיו, בָּאוּ לִסְטִים לְפָנָיו וּזְאֵבִים מֵאַחֲרָיו, נְתָנוֹ עַל זְרוֹעוֹ וְנִלְחַם בָּהֶם, כָּךְ \"וְאָנֹכִי תִרְגַּלְתִּי לְאֶפְרַיִם קָחָם עַל זְרוֹעֹתָיו\" (הושע י\"א) (מכילתא):<br><br><b>ויהי הענן והחשך.<\/b> לְמִצְרַיִם:<br><br><b>ויאר<\/b> עַמּוּד הָאֵשׁ <b>את הלילה<\/b> לְיִשְׂרָאֵל, וְהוֹלֵךְ לִפְנֵיהֶם כְּדַרְכּוֹ לָלֶכֶת כָּל הַלַּיְלָה וְהַחֹשֶׁךְ שֶׁל עֲרָפֶל לְצַד מִצְרַיִם:<br><br><b>ולא קרב זה אל זה.<\/b> מַחֲנֶה אֶל מַחֲנֶה (שם):", "rashi_en": "ויבא בין מחנה מצרים AND IT CAME BETWEEN THE CAMP OF EGYPT — A parable: it may be compared to one who is proceeding on a journey, his son walking in front of him. If, now, brigands come to capture him (the son), he takes him away from in front of him and places him behind himself. If a wolf then comes behind him he places him again in front. If brigands come in front of him and wolves behind him, he places him on his arm and fights against them. Thus did God do for Israel, as it says, (Hosea 11:3) “I led Ephraim — He took them upon His arms” (Mekhilta).<br><br>ויהי הענן והחשך AND THERE WAS CLOUD AND DARKNESS to the Egyptians.<br><br>ויאר AND IT — the pillar of fire — ILLUMINATED the night for the Israelites, and went before them as was its way to go every night, whilst the darkness of the cloud was turned towards the Egyptians.<br><br>ולא קרב זה אל זה SO THAT ONE APPROACHED NOT ANOTHER — [This does not mean that one person did not approach another but]: this camp did not approach that camp (Mekhilta)."}, {"ch": 14, "v": 21, "aliyah": 3, "heb": "וַיֵּ֨ט מֹשֶׁ֣ה אֶת־יָדוֹ֮ עַל־הַיָּם֒ וַיּ֣וֹלֶךְ יְהֹוָ֣ה&thinsp;<small>׀<\/small>&thinsp;אֶת־הַ֠יָּ֠ם בְּר֨וּחַ קָדִ֤ים עַזָּה֙ כׇּל־הַלַּ֔יְלָה וַיָּ֥שֶׂם אֶת־הַיָּ֖ם לֶחָרָבָ֑ה וַיִּבָּקְע֖וּ הַמָּֽיִם׃", "onk": "וַאֲרֵים משֶׁה יָת יְדֵהּ עַל יַמָּא וְדַבַּר יְיָ יָת יַמָּא בְּרוּחַ קִדוּמָא תַקִיף כָּל לֵילְיָא וְשַׁוִי יָת יַמָּא לְיַבֶּשְׁתָּא וְאִתְבְּזָעוּ מַיָּא:", "onk_en": "Moshe extended his hand over the sea and Adonoy turned back the sea with a strong east wind [blowing] all through the night. He made the sea into dry land, and the waters were divided.", "pj": "וְאַרְכִין משֶׁה יַת יְדֵיהּ עַל יַמָא בְּחוּטְרָא רַבָּא וְיַקִירָא דְּאִיתְבְּרִי מִן שֵׁירוּיָא וּבֵיהּ חָקִיק וּמְפָרֵשׁ שְׁמָא רַבָּא וְיַקִּירָא וְעִישַרְתֵּי אַתְוָותָא דִי מְחָא יַת מִצְרָאֵי וּתְלַת אַבְהַת עַלְמָא וְשִׁית אִימְהָתָא וּתְרֵיסַר שִׁבְטוֹי דְיַעֲקב וּמִן יַד דְּבַר יְיָ יַת יַמָא בְּרוּחַ קִידוּמָא תַקִיף כָּל לֵילְיָא וְשַׁוִי יַת יַמָא נְגִיבָא וְאִתְבְּזָעוּ מַיָא לִתְרֵיסַר בְּזִיעַן כָּל קְבֵיל תְּרֵיסַר שִׁבְטוֹי דְיַעֲקב", "pj_en": "And Mosheh stretched out his hand over the sea, with the great and glorious rod which was created at the beginning, and on which were engraven and set forth the Great and Glorious Name, and the ten signs which had smitten the Mizraee, and the three fathers of the world, and the six mothers, and the twelve tribes of Jakob: and straightway the Lord brought a vehement east wind upon the sea all night, and made the sea dry; and divided the waters into twelve divisions according to the twelve tribes of Jacob.", "tj": "וְאַרְכִין:", "tj_en": "And he stretched forth.", "rashi": "<b>ברוח קדים עזה.<\/b> בְּרוּחַ קָדִים שֶׁהִיא עַזָּה שֶׁבָּרוּחוֹת, הִיא הָרוּחַ שֶׁהַקָּבָּ\"ה נִפְרָע בָּהּ מִן הָרְשָׁעִים, שֶׁנֶּאֱמַר, \"כְּרוּחַ קָדִים אֲפִיצֵם\" (ירמיה י\"ח), \"יָבוֹא קָדִים רוּחַ ה'\" (הושע י\"ג), \"רוּחַ הַקָּדִים שְׁבָרֵךְ בְּלֵב יַמִּים\" (יחזקאל כ\"ז), \"הָגָה בְּרוּחוֹ הַקָּשָׁה בְּיוֹם קָדִים\" (ישעיה כ\"ז):<br><br><b>ויבקעו המים.<\/b> כָּל מַיִם שֶׁבָּעוֹלָם:", "rashi_en": "ברוח קדים עזה BY A POWERFUL EAST WIND — i. e. by the east wind which is the most powerful of the winds. This is the wind by which the Holy One, blessed be He, exacts punishment from the wicked, as it is said, (Jeremiah 18:17) “I will scatter them as with an east wind”; (Hosea 13:15) “An east wind shall come, the wind of the Lord”; (Ezekiel 27:26) “The east wind hath broken thee in the heart of the sea”; (Isaiah 27:8) “He hath removed her with His rough blast in the day of the east wind” (cf. Mekhilta).<br><br>ויבקעו המים AND THE WATERS WERE DIVIDED — all the waters in the world (Mekhilta)."}, {"ch": 14, "v": 22, "aliyah": 3, "heb": "וַיָּבֹ֧אוּ בְנֵֽי־יִשְׂרָאֵ֛ל בְּת֥וֹךְ הַיָּ֖ם בַּיַּבָּשָׁ֑ה וְהַמַּ֤יִם לָהֶם֙ חוֹמָ֔ה מִֽימִינָ֖ם וּמִשְּׂמֹאלָֽם׃", "onk": "וְעַלוּ בְנֵי יִשְׂרָאֵל בְּגוֹ יַמָא בְּיַבֶּשְׁתָּא וּמַיָּא לְהוֹן <b>שׁוּרִין<\/b> מִיַּמִינֵהוֹן וּמִסְמָאלֵהוֹן:", "onk_en": "The B’nei Yisrael went into the midst of the sea on dry land. The waters were like a wall [<b>walls<\/b>] to them, to their right and to their left.", "pj": "וְעָלוּ בְנֵי יִשְרָאֵל בְּגוֹ יַמָא בְּיַבֶּשְׁתָּא וּמַיָא קַרְשְׁווּן הֵי כְשׁוּרִין דְּמִן תְּלַת מְאָה מִילִין מִיַּמִינְהוֹן וּמִשְמָאלְהוֹן", "pj_en": "And the children of Israel went through the midst of the sea upon the ground, and the waters were congealed like a wall, three hundred miles on their right hand and on their left.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 23, "aliyah": 3, "heb": "וַיִּרְדְּפ֤וּ מִצְרַ֙יִם֙ וַיָּבֹ֣אוּ אַחֲרֵיהֶ֔ם כֹּ֚ל ס֣וּס פַּרְעֹ֔ה רִכְבּ֖וֹ וּפָרָשָׁ֑יו אֶל־תּ֖וֹךְ הַיָּֽם׃", "onk": "וּרְדָפוּ מִצְרָאֵי וְעַלוּ בַתְרֵיהוֹן כֹּל סוּסָוַת פַּרְעֹה רְתִכּוֹהִי וּפָרָשׁוֹהִי לְגוֹ יַמָא:", "onk_en": "The Egyptians pursued and followed them—all of Pharaoh’s horses, his chariots and his cavalry—into the middle of the sea.", "pj": "וּרְדָפוּ מִצְרָאֵי וְעָלוּ מִן בַּתְרֵיהוֹן כָּל סוּסָוַות פַּרְעה רְתִיכוֹי וּפְרָשׁוֹי לְגוֹ יַמָּא", "pj_en": "And the Mizraee followed and went in after them, all the horses of Pharoh, and his chariots and horsemen, into the midst of the sea.", "tj": "", "tj_en": "", "rashi": "<b>כל סוס פרעה.<\/b> וְכִי סוּס אֶחָד הָיָה? מַגִּיד שֶׁאֵין כֻּלָּם חֲשׁוּבִין לִפְנֵי הַמָּקוֹם אֶלָּא כְּסוּס אֶחָד (מכילתא):", "rashi_en": "כל סוס פרעה (The word סוס is singular) — But was there only one horse? But the use of the singular teaches us that they were all accounted before the Omnipresent as only one horse (cf. Mekhilta)."}, {"ch": 14, "v": 24, "aliyah": 3, "heb": "וַֽיְהִי֙ בְּאַשְׁמֹ֣רֶת הַבֹּ֔קֶר וַיַּשְׁקֵ֤ף יְהֹוָה֙ אֶל־מַחֲנֵ֣ה מִצְרַ֔יִם בְּעַמּ֥וּד אֵ֖שׁ וְעָנָ֑ן וַיָּ֕הׇם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם׃", "onk": "וַהֲוָה בְּמַטְרַת צַפְרָא וְאִסְתְּכֵי יְיָ לְמַשְׁרִיתָא דְמִצְרָאֵי בְּעַמוּדָא דְאֶשָׁתָא וַעֲנָנָא וְשַׁגִישׁ יָת מַשְׁרִיתָא דְמִצְרָאֵי:", "onk_en": "It was the morning watch [the end of the night] Adonoy gazed down at the Egyptians camp through the pillar of fire and cloud, and He caused panic in the Egyptian camp.", "pj": "וַהֲוָה בְּמַטְרַת צַפְרָא בְּעִידָנָא דְאַתְיַין חַיְילֵי מְרוֹמָא לְשַׁבָּחָא וְאוֹדִיק יְיָ בִּרְגוֹז עֲלוֹי מַשְׁרִיתְהוֹן דְּמִצְרָאֵי בְּעַמּוּדָא דְאֵישָׁתָא לְמִירְמֵי עֲלֵיהוֹן גּוּמְרִין דְּאֵישָׁא וּבְעַמּוּדָא דַעֲנָנָא לְמִרְמָא עֲלֵיהוֹן בַּרְדִין וְשָׁעֲמָם יַת מַשִּׁרְיַית מִצְרָאֵי", "pj_en": "And it was that in the morning watch, at the time that the powers on high come to offer praise, the Lord looked forth with anger upon the hosts of the Mizraee from the column of fire, to hurl upon them flakes of fire and hail, and from the column of cloud, and confounded the host of the Mizraee", "tj": "וַהֲוָה בְּעִידָנוֹי צַפְרָא וְאָרֵיק מֵימְרָא דַיְיָ עַל מַשִׁירְיָתֵהוֹן דְּמִצְרַיִם וּרְמָא עֲלֵיהוֹן נַפְטָא וְאֵשָׁתָא וְאַבְנֵי בַּרְדָא וְשִׁעַמַם יַת מַשִׁירְיָתֵיהוֹן דְּמִצְרָיִם:", "tj_en": "And it was in the time of the morning that the Word of the Lord looked upon the host of the Mizraee, and hurled upon them bitumen (naphtha), and fire, and stones of hail, and conturbed the host of the Mizraee.", "rashi": "<b>באשמרת הבקר.<\/b> שְׁלֹשֶׁת חֶלְקֵי הַלַּיְלָה קְרוּיִין אַשְׁמוּרָה, וְאוֹתָהּ שֶׁלִּפְנֵי הַבֹּקֶר קוֹרֵא אַשְׁמֹרֶת הַבֹּקֶר. וְאוֹמֵר אֲנִי, לְפִי שֶׁהַלַּיְלָה חָלוּק לְמִשְׁמְרוֹת שִׁיר שֶׁל מַלְאֲכֵי הַשָּׁרֵת, כַּת אַחַר כַּת, לִשְׁלֹשָׁה חֲלָקִים, לְכָךְ קָרוּי אַשְׁמֹרֶת, וְזֶהוּ שֶׁתִּרְגֵּם אֻנְקְלוֹס \"מַטְּרַת\":<br><br><b>וישקף.<\/b> וַיַּבֵּט, כְּלוֹמַר פָּנָה אֲלֵיהֶם לְהַשְׁחִיתָם. וְתַרְגּוּמוֹ \"וְאִסְתְּכִי\" אַף הוּא לְשׁוֹן הַבָּטָה, כְּמוֹ \"שְׂדֵה צוֹפִים\", (במדבר כ\"ג) – חֲקַל סָכוּתָא:<br><br><b>בעמוד אש וענן.<\/b> עַמּוּד עָנָן יוֹרֵד וְעוֹשֶׂה אוֹתוֹ כְּטִיט וְעַמּוּד אֵשׁ מַרְתִּיחוֹ, וְטַלְפֵי סוּסֵיהֶם מִשְׁתַּמְּטוֹת (מכילתא):<br><br><b>ויהם.<\/b> לְשׁוֹן מְהוּמָה, אשדורד\"ישון בְּלַעַז, עִרְבְּבָם, נָטַל סִגְנִיּוֹת שֶׁלָּהֶם. וְשָׁנִינוּ בְּפִרְקֵי רַבִּי אֱלִיעֶזֶר בְּנוֹ שֶׁל רַבִּי יוֹסֵי הַגְּלִילִי: כָּל מָקוֹם שֶׁנֶּאֱמַר בּוֹ מְהוּמָה הַרְעָמַת קוֹל הוּא, וְזֶה אָב לְכֻלָּן \"וַיַּרְעֵם ה' בְּקוֹל גָּדוֹל וְגוֹ' עַל פְּלִשְׁתִּים וַיְהֻמֵּם\" (שמואל א ז'):", "rashi_en": "באשמרת הבקר IN THE MORNING WATCH — The three divisions of the night are each called an אשמורה “a watch” (Berakhot 3b), and that which immediately precedes the morning is called “the morning watch”. I am of opinion that because the night is divided for the watches (משמרות) of the song of the ministering angels — company after company — into three divisions, therefore each division of the night is termed, for all purposes, an אשמרת (another form of משמר the angel’s watch), and this is what Onkelos has in mind when he translates אשמרת by מטרת.<br><br>‎ וישקף means HE LOOKED, as much as to say, He turned towards them to destroy them (cf. Rashi on Genesis 18:16), and its rendering in the Targum, ואסתכי, is also an expression denoting looking, just as he translates (Numbers 23:14), “the field of the watchers (צפים)” by “the field of ,סכותא” which denotes “looking”.<br><br>בעמוד אש וענן THROUGH THE PILLAR OF FIRE AND CLOUD — viz., the pillar of cloud descended and made it (the bed of the sea) like clay, and the pillar of fire made it boiling hot so that the horses’ hoofs fell off (Mekhilta).<br><br>ויהם has the meaning of confusion. old French estordison. He cast them into confusion; He took away their ensigns. And we read in the Chapters of Rabbi Eliezer, the son of Rabbi José, the Galilean: Wherever it speaks of מהומה (forms from the root המם) it signifies a thundering sound; and the following passage is the father of all of them (i. e. that from which this meaning is quite evident): (I Samuel 7:10) “And the Lord thundered with a great sound … upon the Philistines and discomfited them (ויהמם)”."}, {"ch": 14, "v": 25, "aliyah": 3, "heb": "וַיָּ֗סַר אֵ֚ת אֹפַ֣ן מַרְכְּבֹתָ֔יו וַֽיְנַהֲגֵ֖הוּ בִּכְבֵדֻ֑ת וַיֹּ֣אמֶר מִצְרַ֗יִם אָנ֙וּסָה֙ מִפְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֣י יְהֹוָ֔ה נִלְחָ֥ם לָהֶ֖ם בְּמִצְרָֽיִם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאַעְדִי יָת גַלְגַלֵי רְתִכּוֹהִי וּמְדַבְּרִין לְהוֹן בִּתְקוֹף וַאֲמַר מִצְרָאֵי נֵעִירוֹק מִן קֳדָם יִשְׂרָאֵל אֲרֵי <b>דָא הִיא גְבֻרְתָּא דַיְיָ דַעֲבֵד לְהוֹן קְרָבִין<\/b> בְּמִצְרָיִם:", "onk_en": "He removed the wheels of their chariots and made them move heavily [clumsily]. The Egyptians said, “Let us flee the [B’nei] Yisrael, for [<b>this is the might of<\/b>] Adonoy [<b>that<\/b>] is fighting [<b>wars<\/b>] for them against Egypt.”", "pj": "וּנְסַר יַת גַּלְגַּלֵי רִידְוָותֵיהּ דְּפַרְעה וַהֲווֹ מְדַבְּרִין יַתְהוֹן בְּקַשְׁיוּ וַהֲווֹן מְהַלְכִין וְשַׁרְיָין מִן בַּתְרֵיהוֹן וַאֲמָרוּ מִצְרָאֵי אִלֵּין לְאִלֵּין נְעִירוֹק מִן עַמָּא בֵּית יִשְרָאֵל אֲרוּם מֵימְרָא דַיְיָ הוּא דִמְגִיחַ לְהוֹן קְרָבִין בְּמִצְרָאֵי", "pj_en": "and He brake (or, made rough) the wheels of Pharoh's carriages, so that they drave them with hardship, and that they went on and left them behind. And the Mizraee said one to another, Let us flee from the people of the house of Israel; for this is the Word of the Lord who fought for them in Mizraim.", "tj": "וּפְרַק יַת גַּלְגַּלֵּי רִידְוָותֵיהוֹן וַהֲוָון מַדְבְּרִין לְהוֹן גְּרִירַן מִן בַּתְרֵיהוֹן אוֹרְחֲהוֹן דְּמוֹלִיתָא מְהַוְויָן נַגְ
