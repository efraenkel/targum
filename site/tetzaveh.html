 and Tumim, and they will be over Aharon’s heart when he comes before Adonoy. Aharon will carry the judgment of the B’nei Yisrael over his heart, before Adonoy always.", "pj": "וְתִתֵּן בְּחֹשֶׁן דִּינָא יַת אוּרַיָא דִּמְנַהֲרִין מִלֵּיהוֹן וּמְפַרְסְמִין טְמִירָן דְּבֵית יִשְרָאֵל וְיַת תּוּמַיָא דְמַשְׁלִימִין בְּעוֹבָדֵיהוֹן לְכַהֲנָא רַבָּא דְתָבַע אוּלְפַן מִן קֳדָם יְיָ בְּהוֹן דִּבְהוֹן חָקִיק וּמְפָרַשׁ שְׁמָא רַבָּא וְקַדִּישָׁא דְבֵיהּ אִתְבַּרְיַין תְּלַת מְאָה וְעִישַרְתֵּי עַלְמַיָא וְחָקִיק וּמְפָרֵשׁ בְּאֶבֶן שְׁתִיָה דְבָהּ חָתַם מָארֵי עַלְמָא פּוּם תְּהוֹמָא רַבָּא מִן שֵׁירוּיָיא וְכָל מַאן דְּמַדְכַּר הַהוּא שְׁמָא קַדִּישָׁא בְּשַׁעַת אֲנִיקֵי מִשְׁתְּזֵיב וּטְמִירַן מְגַלְיַין וִיהוֹן עַל לִבָּא דְאַהֲרן בִּזְמַן מֵיעֲלֵיהּ קֳדָם יְיָ וְיִטוֹל אַהֲרן יַת דִּין בְּנֵי יִשְרָאֵל עַל לִבֵּיהּ קֳדָם יְיָ תְּדִירָא", "pj_en": "And thou shalt put upon the breastplate of judgment the Uraia, which illuminate their words, and manifest the hidden things of the house of Israel, and the Tumaia, which fulfil (or perfect) their work to the high priest, who seeketh instruction by them before the Lord; because in them is engraven and expressed the Great and Holy Name by which were created the three hundred and ten worlds, and which was engraven and expressed in the foundation stone wherewith the Lord of the world sealed up the mouth of the great deep at the beginning. Whosoever remembereth that holy name in the hour of necessity shall be delivered. And they shall be upon Aharon's heart in the time that he entereth before the Lord; and Aharon shall bear the judgment of the sons of Israel before the Lord continually.", "tj": "", "tj_en": "", "rashi": "<b>את האורים ואת התמים.<\/b> הוּא כְּתָב שֵׁם הַמְפֹרָשׁ, שֶׁהָיָה נוֹתְנוֹ בְּתוֹךְ כִּפְלֵי הַחֹשֶׁן, שֶׁעַל יָדוֹ הוּא מֵאִיר דְּבָרָיו וּמְתַמֵּם אֶת דְּבָרָיו; וּבְמִקְדָּשׁ שֵׁנִי הָיָה הַחֹשֶׁן – שֶׁאִי אֶפְשָׁר לְכֹהֵן גָּדוֹל לִהְיוֹת מְחֻסַּר בְּגָדִים – אֲבָל אוֹתוֹ הַשֵּׁם לֹא הָיָה בְּתוֹכוֹ, וְעַל שֵׁם אוֹתוֹ הַכְּתָב הוּא קָרוּי מִשְׁפָּט, שֶׁנֶּאֱמַר (במדבר כ\"ז), וְשָׁאַל לוֹ בְּמִשְׁפַּט הָאוּרִים (יומא ע\"ג):<br><br><b>את משפט בני ישראל.<\/b> דָּבָר שֶׁהֵם נִשְׁפָּטִים וְנוֹכָחִים עַל יָדוֹ, אִם לַעֲשׂוֹת דָּבָר אוֹ לֹא לַעֲשׂוֹת; וּלְפִי מִ\"אַ שֶׁהַחֹשֶׁן מְכַפֵּר עַל מְעַוְּתֵי הַדִּין, נִקְרָא מִשְׁפָּט עַל שֵׁם סְלִיחַת הַמִּשְׁפָּט:", "rashi_en": "את האורים ואת התמים THE URIM AND THE THUMMIM — This was an inscription of the Proper Name of God which was placed between the folds (i. e. the two pieces forming the front and back) of the breast-plate through which it (the breast-plate) made its statements clear (lit., illuminated its words; מאיר from אור, light, this being an allusion to the אורים) and its promises true (מתמם from the root תמם, an allusion to תמים) (Yoma 73b). In the second Temple there was certainly the breast-plate (although other objects employed in the Temple Service were missing) for it was impossible that the High Priest should have lacked a garment, but that Divine Name was not within it. It was on account of the inscription which constituted the Urim and Thummim and which enabled it to give decisions that it was called “judgment”, as it is said, (Numbers 27:21) “And he shall enquire for him by the judgment of the Urim” (Numbers 27:21).<br><br>את משפט בני ישראל [AND AARON SHALL BEAR] THE JUDGMENT OF THE CHILDREN OF ISRAEL — the object by means of which they are judged and admonished whether they should do a particular thing or whether they should not do it. But according to the Midrashic statement (Zevachim 88b) that the breast-plate atoned for those who pervert judgment it was called “judgment” in allusion to the pardon thus given for perverse judgment."}, {"ch": 28, "v": 31, "aliyah": 3, "heb": "וְעָשִׂ֛יתָ אֶת־מְעִ֥יל הָאֵפ֖וֹד כְּלִ֥יל תְּכֵֽלֶת׃", "onk": "וְתַעְבֵּד יָת מְעִילָא דְאֵפוֹדָא גְּמִיר תִּכְלָא:", "onk_en": "Make the robe of the eiphod completely out of greenish-blue wool.", "pj": "וְתַעֲבֵיד יַת מִנְטַר מְעִילָא דְאֵפוֹדָא שְׁזִיר חוּטָא דְתִיכְלָא", "pj_en": "And thou shalt make the mantle-robe (mintar meila) of the ephod, of twined thread of hyacinth;", "tj": "", "tj_en": "", "rashi": "<b>את מעיל האפוד.<\/b> שֶׁהָאֵפוֹד נָתוּן עָלָיו לַחֲגוֹרָה:<br><br><b>כליל תכלת.<\/b> כֻּלּוֹ תְכֵלֶת, שֶׁאֵין מִין אַחֵר מְעֹרָב בּוֹ:", "rashi_en": "את מעיל האפוד THE ROBE OF THE EPHOD — i. e. the robe over which the ephod was placed to serve the purpose of a girdle.<br><br>כליל תכלת signifies THE WHOLE OF IT BLUE PURPLE, meaning that there should be no other material mixed with it (Yoma 71b)."}, {"ch": 28, "v": 32, "aliyah": 3, "heb": "וְהָיָ֥ה פִֽי־רֹאשׁ֖וֹ בְּתוֹכ֑וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְפִ֨יו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּפִ֥י תַחְרָ֛א יִֽהְיֶה־לּ֖וֹ לֹ֥א יִקָּרֵֽעַ׃", "onk": "וִיהֵי פוּם רֵישֵׁיהּ כָּפִיל לְגַוֵּיהּ תּוֹרָא יְהֵי מַקַּף לְפוּמֵיהּ <b>סְחוֹר סְחוֹר<\/b> עוֹבַד מָחֵי כְּפוּם שִׁרְיָן יְהֵי לֵיהּ לָא יִתְבְּזָע:", "onk_en": "Its opening at the top shall be turned inward. Its opening shall have a border [<b>encircling<\/b>] all around, [this border shall be] of woven work, like there is around the opening of a coat of armor, so that it will not be torn.", "pj": "וִיהֵי פּוּם רֵישֵׁיהּ בְּמִיצְעֵיהּ תּוֹרָא בְּשִיפְמֵיהּ יְהֵי מַקִּיף לְפוּמֵיהּ חֲזוֹר חֲזוֹר עוֹבַד גִרְדָאֵי הֵי כְפוּם לַשִּׁירַיָא יְהֵי לֵיהּ לָא יִתְבְּזָע", "pj_en": "and an orifice shall be in the middle of its upper part; a border shall be upon its opening round about its orifice, the work of the sewer; as the orifice of a coat of mail it shall be, that it may not be rent.", "tj": "וִיהֵי פוּם רֵישֵׁיהּ בְּמִצְעָא סִיפְוָוא יֶהֱוֵי מַקִיף לְפוּמֵיהּ חֲזוֹרָא עוֹבַד גְרָדִי כְּפוּם סִירָא יֶהֱוֵי לֵיהּ לָא יִתְבְּזָע:", "tj_en": "And an orifice shall be in the middle of its head; a border shall surround the orifice, the work of the sewer; like the opening of a coat of mail shall it be, that it be not torn.", "rashi": "<b>והיה פי ראשו.<\/b> פִּי הַמְּעִיל שֶׁבְּגָבְהוֹ – הוּא פְּתִיחַת בֵּית הַצַּוָּאר:<br><br><b>בתוכו.<\/b> כְּתַרְגּוּמוֹ כָּפִיל לְגַוֵּהּ, כָּפוּל לְתוֹכוֹ, לִהְיוֹת לוֹ לְשָׂפָה כְּפִילָתוֹ, וְהָיָה מַעֲשֵׂה אוֹרֵג וְלֹא בְמַחַט:<br><br><b>כפי תחרא.<\/b> לָמַדְנוּ שֶׁהַשִּׁרְיוֹנִים שֶׁלָּהֶם פִּיהֶם כָּפוּל:<br><br><b>לא יקרע.<\/b> כְּדֵי שֶׁלֹּא יִקָּרֵעַ; וְהַקּוֹרְעוֹ עוֹבֵר בְּלָאו, שֶׁזֶּה מִמִּנְיַן לָאוִין שֶׁבַּתּוֹרָה, וְכֵן וְלֹא יִזַּח הַחֹשֶׁן, וְכֵן לֹא יָסֻרוּ מִמֶּנּוּ הַנֶּאֱמַר בְּבַדֵּי הָאָרוֹן:", "rashi_en": "והיה פי ראשו AND THE HOLE IN THE HEAD OF IT SHALL BE — the hole of the Robe which is at its top — that is, the opening which serves as a receptacle for the neck,<br><br>בתוכו IN THE MIDST THEREOF — Understand this as the Targum renders it: כפיל לגויה “turned in towards the inside” — the turn-in shall serve as its seam. It was weaver’s work (woven as such with the Robe) and not made with a needle.<br><br>כפי תחרא AS IT WERE THE HOLE OF A HABERGEON — This informs us that their habergeons had the neck-opening turned in.<br><br>לא יקרע means SO THAT IT BE NOT RENT — Indeed, whoever rends it, transgresses thereby a negative commandment because this is among the number of the negative commands contained in the Torah. The same is the case with (v. 28) “that the breast-plate be not loosened”, and similarly, (Exodus 25:15) “they shall not depart from it”, which is said of the staves of the ark (Yoma 72a)."}, {"ch": 28, "v": 33, "aliyah": 3, "heb": "וְעָשִׂ֣יתָ עַל־שׁוּלָ֗יו רִמֹּנֵי֙ תְּכֵ֤לֶת וְאַרְגָּמָן֙ וְתוֹלַ֣עַת שָׁנִ֔י עַל־שׁוּלָ֖יו סָבִ֑יב וּפַעֲמֹנֵ֥י זָהָ֛ב בְּתוֹכָ֖ם סָבִֽיב׃", "onk": "וְתַעְבֵּד עַל שִׁיפוֹלוֹהִי רִמּוֹנֵי תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי עַל שִׁיפוֹלוֹהִי סְחוֹר סְחוֹר וְזַגִּין דְּדַהֲבָא בֵּינֵיהוֹן סְחוֹר סְחוֹר:", "onk_en": "On its [lower] hem you shall make pomegranates of greenish-blue wool, dark red wool, and crimson [<b>colored<\/b>] wool—around its [lower] hem. There shall be gold bells between them, all around.", "pj": "וְתַעֲבֵיד עַל שִׁיפּוּלוֹי רוּמַנְיַין דְּתִיכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי עַל שִׁיפּוּלוֹי חֲזוֹר חֲזוֹר וְחִיזוּרְיַין דְּדַהֲבָא בְּמִצְעֵיהוֹן חֲזוֹר חֲזוֹר", "pj_en": "And thou shalt make upon the hem of it pomegranates of hyacinth, and purple, and crimson, upon its hem, round about, and bells of gold among them round about.", "tj": "", "tj_en": "", "rashi": "<b>רמני.<\/b> עֲגֻלִּים וַחֲלוּלִים הָיוּ כְּמִין רִמּוֹנִים הָעֲשׂוּיִים כְּבֵיצַת תַּרְנְגֹלֶת:<br><br><b>ופעמני זהב.<\/b> זַגִּין עִם עִנְבָּלִין שֶׁבְּתוֹכָם:<br><br><b>בתוכם סביב.<\/b> בֵּינֵיהֶם סָבִיב – בֵּין שְׁנֵי רִמּוֹנִים פַּעֲמוֹן אֶחָד דָּבוּק וְתָלוּי בְּשׁוּלֵי הַמְּעִיל:", "rashi_en": "רמוני POMEGRANATES — They were round and hollow, similar to that kind of pomegranates which are made like (have the form of) a hen’s egg.<br><br>ופעמני זהב AND BELLS OF GOLD — bells, together with the clappers in them.<br><br>בתוכם סביב IN THE MIDST OF THEM ROUND ABOUT — i. e. between them (the pomegranates) all the way round the hem: between every two pomegranates there was one bell attached hanging from the hem of the Robe (cf. Zevachim 88b)."}, {"ch": 28, "v": 34, "aliyah": 3, "heb": "פַּעֲמֹ֤ן זָהָב֙ וְרִמּ֔וֹן פַּֽעֲמֹ֥ן זָהָ֖ב וְרִמּ֑וֹן עַל־שׁוּלֵ֥י הַמְּעִ֖יל סָבִֽיב׃", "onk": "זַגָּא דְדַהֲבָא וְרִמּוֹנָא זַגָא דְדַהֲבָא וְרִמוֹנָא עַל שִׁיפוֹלֵי מְעִילָא סְחוֹר סְחוֹר:", "onk_en": "A gold bell and a pomegranate, a gold bell and a pomegranate, on the [lower] hem of the robe all around.", "pj": "חִיזוּרָא דְדַהֲבָא וְרִמוֹנָא דִתְכֶלְתָּא וְדִצְבַע זְהוֹרֵי חִיזוּרָא דְדַהֲבָא וְרִימוֹנָא דִתְכֶלְתָּא וְדִצְבַע זְהוֹרֵי עַל שִׁיפּוּלֵי מִינְטַר מְעִילָא חֲזוֹר חֲזוֹר סְכוּמְהוֹן שַׁבְעִין וְחַד", "pj_en": "A golden bell, and a pomegranate of hyacinth and crimson; a golden bell, and a pomegranate of hyacinth and crimson upon the border of the robe round about; their number, seventy and one.", "tj": "", "tj_en": "", "rashi": "<b>פעמן זהב ורמון פעמן זהב ורמון.<\/b> אֶצְלוֹ:", "rashi_en": "פעמן זהב ורמון פעמן זהב ורמון means a golden bell and a pomegranate next to it."}, {"ch": 28, "v": 35, "aliyah": 3, "heb": "וְהָיָ֥ה עַֽל־אַהֲרֹ֖ן לְשָׁרֵ֑ת וְנִשְׁמַ֣ע ק֠וֹל֠וֹ בְּבֹא֨וֹ אֶל־הַקֹּ֜דֶשׁ לִפְנֵ֧י יְהֹוָ֛ה וּבְצֵאת֖וֹ וְלֹ֥א יָמֽוּת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיהֵי עַל אַהֲרֹן לְשַׁמָּשָׁא וְיִשְׁתְּמַע קָלֵיהּ בְּמֵעֲלֵיהּ לְקוּדְשָׁא קֳדָם יְיָ וּבְמִפְּקֵיהּ וְלָא יְמוּת:", "onk_en": "It shall be on Aharon when he performs [Divine] service. Its sound shall be heard when he comes into the Holy [sanctuary] in the presence of Adonoy, and when he comes out, so that he will not die.", "pj": "וִיהֵי עָטִיף עַל אַהֲרן לְשַׁמָשָׁא וְיִשְׁתְּמַע קָלֵיהּ בִּזְמַן מֵיעֲלֵיהּ לְקוּדְשָׁא קֳדָם יְיָ וּבִזְמַן מִיפְקֵיהּ וְלָא יְמוּת בְּאֵשָׁא מְצַלְהֲבָא", "pj_en": "And it shall be a vestment upon Aharon to minister, and its voice shall be heard at the time that he hath entered the holy place before the Lord, and at the time that he cometh out, that he die not by the flaming fire.", "tj": "", "tj_en": "", "rashi": "<b>ולא ימות.<\/b> מִכְּלַל לָאו אַתָּה שׁוֹמֵעַ הֵן – אִם יִהְיוּ לוֹ לֹא יִתְחַיֵּב מִיתָה, הָא אִם יִכָּנֵס מְחֻסָּר אֶחָד מִן הַבְּגָדִים הַלָּלוּ, חַיָּב מִיתָה בִידֵי שָׁמַיִם (סנהדרין פ\"ג):", "rashi_en": "ולא ימות THAT HE DIE NOT — From what is included in this negative statement you may infer the positive: if he has these garments on him he will not incur death; consequently if he enters the Sanctuary lacking one of these garments he incurs death at the hands of God (cf. Sanhedrin 83)."}, {"ch": 28, "v": 36, "aliyah": 3, "heb": "וְעָשִׂ֥יתָ צִּ֖יץ זָהָ֣ב טָה֑וֹר וּפִתַּחְתָּ֤ עָלָיו֙ פִּתּוּחֵ֣י חֹתָ֔ם קֹ֖דֶשׁ לַֽיהֹוָֽה׃", "onk": "וְתַעְבֵּד צִיצָא דִּדְהַב דְּכֵי וְתִגְלוֹף עֲלוֹהִי <b>כְּתַב מְפָרַשׁ<\/b> קֹדֶשׁ לַייָ:", "onk_en": "You shall make a diadem of pure gold, and engrave on it in the manner of a signet [ring] [<b>script that is clear<\/b>], “Holy unto Adonoy.”", "pj": "וְתַעֲבֵיד צִיצָא דִדְהַב דְּכֵי וְתִגְלוֹף עֲלוֹי חָקִיק וּמְפָרַשׁ קוֹדֶשׁ לַיְיָ", "pj_en": "And thou shalt make a plate (or crown) of pure gold, and engrave upon it with distinct engraving, HOLINESS TO THE LORD.", "tj": "", "tj_en": "", "rashi": "<b>ציץ.<\/b> כְּמִין טַס שֶׁל זָהָב הָיָה, רֹחַב שְׁתֵּי אֶצְבָּעוֹת, מַקִּיף עַל הַמֵּצַח מֵאֹזֶן לְאֹזֶן:", "rashi_en": "ציץ — This was a kind of golden Plate, two fingers in breadth, going round the forehead from ear to ear (Shabbat 63b)."}, {"ch": 28, "v": 37, "aliyah": 3, "heb": "וְשַׂמְתָּ֤ אֹתוֹ֙ עַל־פְּתִ֣יל תְּכֵ֔לֶת וְהָיָ֖ה עַל־הַמִּצְנָ֑פֶת אֶל־מ֥וּל פְּנֵֽי־הַמִּצְנֶ֖פֶת יִהְיֶֽה׃", "onk": "וּתְשַׁוִּי יָתֵיהּ עַל חוּטָא דִתְכֶלְתָּא וִיהֵי עַל מִצְנֶפְתָּא לָקֳבֵל אַפֵּי מִצְנֶפְתָּא יְהֵי:", "onk_en": "Set [fasten] it on a greenish-blue wool cord, so that it will be on the turban. It shall be near the front of the turban.", "pj": "וּתְשַׁוֵּי יָתֵיהּ עַל שְׁזִיר חוּטָא דִתְכֶלְתָּא לִמְכַפְּרָא עַל חֲצִיפֵי אַפַּיָא וִיהֵי עַל מַצְנַפְתָּא מֵעִילַוֵי תְּפִילַת רֵישָׁא כָּל קְבֵיל אַפֵּי מִצְנַפְתָּא יְהֵי", "pj_en": "And thou shalt put it on a twined ribbon of hyacinth, to make amends for boldness of face; and it shall be on the mitre above the tephillin of the head in front of the mitre shall it be.", "tj": "", "tj_en": "", "rashi": "<b>על פתיל תכלת.<\/b> וּבְמָקוֹם אַחֵר הוּא אוֹמֵר וַיִּתְּנוּ עָלָיו פְּתִיל תְּכֵלֶת? וְעוֹד כְּתִיב כָּאן וְהָיָה עַל הַמִּצְנָפֶת, וּלְמַטָּה הוּא אוֹמֵר וְהָיָה עַל מֵצַח אַהֲרֹן? וּבִשְׁחִיטַת קָדָשִׁים שָׁנִינוּ שְׂעָרוֹ הָיָה נִרְאֶה בֵּין צִיץ לַמִּצְנֶפֶת שֶׁשָּׁם מֵנִיחַ תְּפִלִּין? לָמַדְנוּ שֶׁהַמִּצְנֶפֶת לְמַעְלָה בְּגֹבַהּ הָרֹאשׁ וְאֵינָהּ עֲמֻקָּה לִכָּנֵס בָּהּ כָּל הָרֹאשׁ עַד הַמֵּצַח, וְהַצִּיץ מִלְּמַטָּה, וְהַפְּתִילִים הָיוּ בִנְקָבִים וּתְלוּיִין בּוֹ בִּשְׁנֵי רָאשִׁים וּבְאֶמְצָעוֹ, שִׁשָּׁה בִּשְׁלֹשָׁה מְקוֹמוֹת הַלָּלוּ, פְּתִיל מִלְמַעְלָה אֶחָד מִבַּחוּץ וְאֶחָד מִבִּפְנִים כְּנֶגְדּוֹ, וְקוֹשֵׁר רָאשֵׁי הַפְּתִילִים מֵאֲחוֹרֵי הָעֹרֶף שְׁלָשְׁתָּן, וְנִמְצְאוּ בֵין אֹרֶךְ הַטַּס וּפְתִילֵי רָאשָׁיו מַקִּיפִין אֶת הַקָּדְקֹד, וְהַפְּתִיל הָאֶמְצָעִי שֶׁבְּרֹאשׁוֹ, קָשׁוּר עִם רָאשֵׁי הַשְּׁנַיִם, וְהוֹלֵךְ עַל פְּנֵי רֹחַב הָרֹאשׁ מִלְמַעְלָה, נִמְצָא עָשׂוּי כְּמִין כּוֹבַע; וְעַל פְּתִיל הָאֶמְצָעִי הוּא אוֹמֵר וְהָיָה עַל הַמִּצְנָפֶת, וְהָיָה נוֹתֵן הַצִּיץ עַל רֹאשׁוֹ כְּמִין כּוֹבַע עַל הַמִּצְנֶפֶת, וְהַפְּתִיל הָאֶמְצָעִי מַחֲזִיקוֹ שֶׁאֵינוֹ נוֹפֵל וְהַטַּס תָּלוּי כְּנֶגֶד מִצְחוֹ, וְנִתְקַיְּמוּ כָּל הַמִּקְרָאוֹת – פְּתִיל עַל הַצִּיץ, וְצִיץ עַל הַפְּתִיל, וּפְתִיל עַל הַמִּצְנֶפֶת מִלְמַעְלָה:", "rashi_en": "על פתיל תכלת [AND THOU SHALT PUT IT] ON A BLUE PURPLE STRING — but in another passage (Exodus 39:31) is states, “And they put upon it (upon the Plate) a string of blue purple (so that the Plate was beneath the string, not upon it as is here commanded)! Then again, it is written here, “and it (the Plate) shall be upon the mitre”, whilst further on (v. 38) it says, “And it shall be upon Aaron’s forehead”! And in the Treatise on the Slaughter of the Sacrifices (Zevachim 19a) we learn: “His (the High Priest’s) hair was visible between the Plate and the mitre, whereon he placed the Tephillin”, thus informing us that the mitre was above on the crown of the head and was not so deep that the entire head went into it right down to the forehead, and that the Plate was beneath it with a space between them. Consequently the Plate was not on the mitre as seems to be stated in this verse! But I say that (cf. Rashi on Exodus 39:31 ואומר אני וגו׳) the strings were in holes and hung from it (from the Plate) at its two ends and at its middle point, six in these three places (i. e. one string in each hole, the centre of each string resting on the bottom point of the hole, the three thus forming six). Thus, at each hole, there was one string on top of the Plate — outside it, and one inside (between the Plate and the forehead). He tied the ends of the strings, the three of them, behind the neck; it follows therefore that the length of the Plate and the strings that were at its ends together encompassed his skull. The middle string which was on its top edge bound together with the ends of the two which were at the extremities of the Plate, passed over the breadth of the head above (over the crown). Consequently it (the Plate, together with the strings) formed a kind of helmet. It is with reference to the middle string that it states, “And it (the string just mentioned in the verse; not the Plate as was assumed) shall be upon the mitre”, for he placed the Plate, with the strings already tied in this manner, upon his head as a kind of helmet passing it over the mitre, and the middle string held it (the Plate) firm so that it could not fall, and thus the Plate hung in front of his forehead and did not fall lower down. In this way all these verses find their explanation — the string being on the Plate, the Plate on the string, and the string on the mitre above (cf. Chullin 138a)."}, {"ch": 28, "v": 38, "aliyah": 3, "heb": "וְהָיָה֮ עַל־מֵ֣צַח אַהֲרֹן֒ וְנָשָׂ֨א אַהֲרֹ֜ן אֶת־עֲוֺ֣ן הַקֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֙ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְכׇֽל־מַתְּנֹ֖ת קׇדְשֵׁיהֶ֑ם וְהָיָ֤ה עַל־מִצְחוֹ֙ תָּמִ֔יד לְרָצ֥וֹן לָהֶ֖ם לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וִיהֵי עַל בֵּית עֵינוֹהִי דְאַהֲרֹן וְיִטּוֹל אַהֲרֹן יָת עֲוָיַת קוּדְשַׁיָּא דִּי יְקַדְּשׁוּן בְּנֵי יִשְׂרָאֵל לְכָל מַתְּנַת קוּדְשֵׁיהוֹן וִיהֵי עַל בֵּית עֵינוֹהִי תְּדִירָא לְרַעֲוָא לְהוֹן קֳדָם יְיָ:", "onk_en": "It shall be [worn] on Aharon’s forehead, and Aharon will carry [atone] the iniquity of the sacred offerings that the B’nei Yisrael consecrate for all their sacred gifts. It shall be on his forehead always to make them [the sacred-offerings] acceptable before Adonoy.", "pj": "וִיהֵי עַל פְּדַחְתָּא דְבֵית אַפּוֹי דְאַהֲרן מִן צִידְעָא לְצִידְעָא יִתְמְטֵי וְיִטוֹל אַהֲרן יַת עֲוָויַית קוּדְשַׁיָא דִיקַדְשׁוּן בְּנֵי יִשְרָאֵל לְכָל מַתְּנַת קוּדְשֵׁיהוֹן דִּמְשַׁקְרִין בְּהוֹן וִיהֵי עַל פְּדַחְתֵּיהּ תְּדִירָא לְרַעֲוָא לְהוֹן קֳדָם יְיָ", "pj_en": "And it shall be in the front of Aharon's forehead, from time to time as it comes; and Aharon shall bear the iniquity of the consecrated things which the sons of Israel may consecrate; even of all their sacred gifts in which they have been insincere. And it shall be upon the front continually, for their reconciliation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ונשא אהרן.<\/b> לְשׁוֹן סְלִיחָה; וְאַעַפִּ\"כֵ אֵינוֹ זָז מִמַּשְׁמָעוֹ – אַהֲרֹן נוֹשֵׂא אֶת הַמַּשָּׂא שֶׁל עָוֹן – נִמְצָא מְסֻלָּק הֶעָוֹן מִן הַקֳּדָשִׁים (חולין קל\"ח):<br><br><b>את עון הקדשים.<\/b> לְרַצּוֹת עַל הַדָּם וְעַל הַחֵלֶב שֶׁקָּרְבוּ בְטֻמְאָה, כְּמוֹ שֶׁשָּׁנִינוּ: אֵי זֶה עָוֹן הוּא נוֹשֵׂא? אִם עֲוֹן פִּגּוּל, הֲרֵי כְבָר נֶאֱמַר לֹא יֵרָצֶה (ויקרא י\"ט), וְאִם עֲוֹן נוֹתָר הֲרֵי נֶאֱמַר לֹא יֵחָשֵׁב (שם ז') – וְאֵין לוֹמַר שֶׁיְּכַפֵּר עַל עֲוֹן הַכֹּהֵן שֶׁהִקְרִיב טָמֵא, שֶׁהֲרֵי עֲוֹן הַקֳּדָשִׁים נֶאֱמַר וְלֹא עֲוֹן הַמַּקְרִיבִים – הָא אֵינוֹ מְרַצֶּה אֶלָא לְהַכְשִׁיר הַקָּרְבָּן (יומא ז'):<br><br><b>והיה על מצחו תמיד.<\/b> אִי אֶפְשָׁר לוֹמַר שֶׁיְּהֵא עַל מִצְחוֹ תָּמִיד, שֶׁהֲרֵי אֵינוֹ עָלָיו אֶלָּא בִשְׁעַת הָעֲבוֹדָה, אֶלָּא תָּמִיד לְרַצּוֹת לָהֶם אֲפִלּוּ אֵינוֹ עַל מִצְחוֹ – שֶׁלֹּא הָיָה כֹהֵן גָּדוֹל עוֹבֵד בְּאוֹתָהּ שָׁעָה, וּלְדִבְרֵי הָאוֹמֵר עוֹדֵהוּ עַל מִצְחוֹ מְכַפֵּר וּמְרַצֶּה, וְאִם לָאו אֵינוֹ מְרַצֶּה, נִדְרָשׁ עַל מִצְחוֹ תָּמִיד, מְלַמֵּד שֶׁמְּמַשְׁמֵשׁ בּוֹ בְּעוֹדוֹ עַל מִצְחוֹ, שֶׁלֹּא יַסִּיחַ דַּעְתּוֹ מִמֶּנּוּ (שם):", "rashi_en": "ונשא אהרן AND AARON SHALL BEAR [THE INIQUITY OF THE HOLY THINGS] — The word נשא is an expression of forgiveness, but nevertheless it does not move from (lose) its ordinary meaning of “bearing”: Aaron bears the load of iniquity so that it follows that the iniquity is lifted off the holy things.<br><br>את עון הקדשים [HE SHALL BEAR] THE INIQUITY OF THE HOLY THINGS — atoning for the blood and fat of sacrifices which had been offered when they were unclean, as we have learned (Pesachim 17b; Yoma 7a): What iniquity is it that it (the Plate) bears (atones for)? If you say that it is the iniquity caused by פגול — but it is already said in reference to this, (Leviticus 19:7) “it cannot be atoned for”! If you say it is the iniquity caused by נותר — but it is said in reference to this, (Leviticus 7:18) “It shall not under any circumstances be accounted [unto him] as a sacrifice”! Nor can one say that it (the Plate) atoned for the iniquity of the priest who offered a sacrifice when he was unclean because it is stated here, “[shall bear] the iniquity of the holy things” and it does not state “the iniquity of those who offer the sacrifices” — thus it (the Plate) atones only in so far as to make the sacrifice a fitting one if there had been anything irregular about it.<br><br>והיה על מצחו תמיד — It is not possible to say that this means that it should be on his forehead continually because, as a matter of fact, it was on it only at the time of the sacrificial service. But the word תמיד is to be connected with the words that follow: “continually to make atonement for them”, even if it be not then upon his forehead, i. e. when the High Priest was not officiating, and therefore was not wearing the Plate, at that time when the unclean animal was being sacrificed by an ordinary priest. But according to the opinion (if we adopt the opinion) of him (Rabbi Judah) who says that only whilst it was on his forehead did it atone and effect pardon, and that if it was not on his forehead it did not effect pardon, the following inference must be derived from the phrase על מצחו תמיד: it informs us that he must constantly touch it whilst it is on his forehead, so that he should not divert his attention from it (Yoma 7b)."}, {"ch": 28, "v": 39, "aliyah": 3, "heb": "וְשִׁבַּצְתָּ֙ הַכְּתֹ֣נֶת שֵׁ֔שׁ וְעָשִׂ֖יתָ מִצְנֶ֣פֶת שֵׁ֑שׁ וְאַבְנֵ֥ט תַּעֲשֶׂ֖ה מַעֲשֵׂ֥ה רֹקֵֽם׃", "onk": "וּתְרַמֵּץ כִּתּוּנָא בוּצָא וְתַעְבֵּד מִצְנֶפְתָּא דְבוּצָא וְהֶמְיָנָא תַּעְבֵּד עוֹבַד צַיָּר:", "onk_en": "Make the undershirt with checkered work of fine linen. Make the turban of fine linen. and the sash-belt shall be the work of an embroiderer.", "pj": "וּתְרַמֵץ כִּיתּוּנָא דְבוּצָא לִמְכַפְּרָא עַל שִׁידֵי אַדְמָא זַכָּאָה וְתַעֲבֵיד מִצְנַפְתָּא דְבוּצָא לִמְכַפְּרָא עַל מַגִּיסֵי רַעֲיוֹנֵיהוֹן וְקָמוּר תַּעֲבֵיד עוֹבַד צִיּוּר", "pj_en": "And thou shalt weave the tunic of fine linen to expiate for the shedding of innocent blood; and shalt make the tiara of fine linen to expiate for the pride of their thoughts; and the girdle shalt thou make of the work of the embroiderer.", "tj": "", "tj_en": "", "rashi": "<b>ושבצת.<\/b> עֲשֵׂה אוֹתָם מִשְׁבְּצוֹת מִשְׁבְּצוֹת, וְכֻלָּהּ שֶׁל שֵׁשׁ:", "rashi_en": "ושבצת means make them with many checkered figures, and entirely of fine linen."}, {"ch": 28, "v": 40, "aliyah": 3, "heb": "וְלִבְנֵ֤י אַהֲרֹן֙ תַּעֲשֶׂ֣ה כֻתֳּנֹ֔ת וְעָשִׂ֥יתָ לָהֶ֖ם אַבְנֵטִ֑ים וּמִגְבָּעוֹת֙ תַּעֲשֶׂ֣ה לָהֶ֔ם לְכָב֖וֹד וּלְתִפְאָֽרֶת׃", "onk": "וְלִבְנֵי אַהֲרֹן תַּעְבֵּד כִּתּוּנִין וְתַעְבֵּד לְהוֹן הֶמְיָנִין וְכוֹבָעִין תַּעְבֵּד לְהוֹן לִיקָר וּלְתֻשְׁבְּחָן:", "onk_en": "For Aharon’s sons, make undershirts, and [also] make sash-belts for them. Make turban-like hats for them, for honor and splendor.", "pj": "וְלִבְנֵי אַהֲרן תַּעֲבֵיד כִּתּוּנִין וְתַעֲבֵיד לְהוֹן קְמוּרִין וְכוֹבְעִין תַּעֲבֵיד לְהוֹן לִיקַר וּלְתוּשְׁבְּחָא", "pj_en": "And for the sons of Aharon thou shalt make tunics, and girdles, and mitres, for glory and for praise.", "tj": "", "tj_en": "", "rashi": "<b>ולבני אהרן תעשה כתנת.<\/b> אַרְבָּעָה בְגָדִים הַלָּלוּ וְלֹא יוֹתֵר, כֻּתֹּנֶת וְאַבְנֵט וּמִגְבָּעוֹת – הִיא מִצְנֶפֶת – וּמִכְנָסַיִם כְּתוּבִים לְמַטָּה בַּפָּרָשָׁה:", "rashi_en": "ולבני אהרן תעשה כתנת AND FOR AARON’S SONS THOU SHALT MAKE INNER GARMENTS — these four garments and no more; viz., the three mentioned in this verse, — the inner garment, the girdle and the מגבעות which are identical with what is elsewhere called the mitre, — and the breeches prescribed later in this section (v. 42)."}, {"ch": 28, "v": 41, "aliyah": 3, "heb": "וְהִלְבַּשְׁתָּ֤ אֹתָם֙ אֶת־אַהֲרֹ֣ן אָחִ֔יךָ וְאֶת־בָּנָ֖יו אִתּ֑וֹ וּמָשַׁחְתָּ֨ אֹתָ֜ם וּמִלֵּאתָ֧ אֶת־יָדָ֛ם וְקִדַּשְׁתָּ֥ אֹתָ֖ם וְכִהֲנ֥וּ לִֽי׃", "onk": "וְתַלְבֵּשׁ יָתְהוֹן יָת אַהֲרֹן אָחוּךְ וְיָת בְּנוֹהִי עִמֵּיהּ וּתְרַבֵּי יָתְהוֹן <b>וּתְקָרֵב יָת קֻרְבַּנְהוֹן<\/b> וּתְקַדֵּשׁ יָתְהוֹן וִישַׁמְּשׁוּן <b>קֳדָמָי<\/b>:", "onk_en": "Clothe your brother, Aharon, with [these garments], and also [clothe] his sons along with him. [Then] anoint them, and install them [<b>offer their sacrifices<\/b>], and consecrate them to serve [<b>before<\/b>] Me [as kohanim].", "pj": "וְתַלְבֵּשׁ יַתְהוֹן יַת אַהֲרן אָחוּךְ וְיַת בְּנוֹי עִמֵיהּ וּתְרַבֵּי יַתְהוֹן וּתְקָרֵב יַת קוּרְבָּנֵיהוֹן וּתְקַדֵּשׁ יַתְהוֹן וִישַׁמְשׁוּן קֳדָמַי", "pj_en": "And with them thou shalt invest Aharon thy brother, and his sons with him, and anoint them, that they may offer their oblations; and sanctify them to minister before Me.", "tj": "", "tj_en": "", "rashi": "<b>והלבשת אתם את אהרן.<\/b> אוֹתָם הָאֲמוּרִין בְּאַהֲרֹן – חֹשֶׁן, וְאֵפוֹד, וּמְעִיל, וּכְתֹנֶת תַּשְׁבֵּץ, מִצְנֶפֶת, וְאַבְנֵט, וְצִיץ, וּמִכְנָסַיִם הַכְּתוּבִים לְמַטָּה בְּכֻלָּם:<br><br><b>ואת בניו אתו.<\/b> אוֹתָם הַכְּתוּבִים בָּהֶם:<br><br><b>ומשחת אתם.<\/b> אֶת אַהֲרֹן וְאֶת בָּנָיו בְּשֶׁמֶן הַמִּשְׁחָה:<br><br><b>ומלאת את ידם.<\/b> כָּל מִלּוּי יָדַיִם לְשׁוֹן חִנּוּךְ, כְּשֶׁהוּא נִכְנָס לְדָבָר לִהְיוֹת מֻחְזָק בּוֹ מֵאוֹתוֹ יוֹם וָהָלְאָה הוּא: וּבְלְשׁוֹן לַעַז כְּשֶׁמְּמַנִּין אָדָם עַל פְּקִידַת דָּבָר, נוֹתֵן הַשַּׁלִּיט בְּיָדוֹ בֵּית יָד שֶׁל עוֹר, שֶׁקּוֹרִין גאנ\"ט בְּלַעַז, וְעַל יָדוֹ הוּא מַחֲזִיקוֹ בַּדָּבָר, וְקוֹרִין לְאוֹתוֹ מְסִירָה רווישט\"יר בְּלַעַז, וְהוּא מִלּוּי יָדַיִם:", "rashi_en": "והלבשת אתם את אהרן AND THOU SHALT PUT THEM ON AARON — i. e. those which are mentioned in connection with Aaron: the breast-plate, the ephod, the Robe, the inner garment of checker-work, the mitre, the girdle and the Plate, and the breeches which are prescribed later for all of them (for all the priest’s and therefore for Aaron also).<br><br>ואת בניו אתו [AND THOU SHALT PUT THEM ON AARON …] AND ON HIS SONS WITH HIM — i. e. put on them those garments which are prescribed for them.<br><br>ומשחת אתם AND THOU SHALT ANOINT THEM — viz., Aaron and his sons, with the oil of anointing.<br><br>ומלאת את ידם AND THOU SHALT CONSECRATE THEM (more lit., fill their hand) — wherever the term “filling the hand” is used it denotes the installation ceremony performed when one enters for the first time into an office, as a sign that he is entitled to it from that day and henceforth. And in the old French language — when a person is appointed to the charge of a matter, the Prince puts into his hand a leathern glove which they call “gant” in old French and by that means he gives him a right to the matter, and they term that transmission of the glove and the office, revestir in old French This is the connection between the literal and the metaphorical meaning of “filling the hand”."}, {"ch": 28, "v": 42, "aliyah": 3, "heb": "וַעֲשֵׂ֤ה לָהֶם֙ מִכְנְסֵי־בָ֔ד לְכַסּ֖וֹת בְּשַׂ֣ר עֶרְוָ֑ה מִמׇּתְנַ֥יִם וְעַד־יְרֵכַ֖יִם יִהְיֽוּ׃", "onk": "וְעִבֵד לְהוֹן מִכְנְסִין דְּבוּץ לְכַסָּאָה בְּשַׂר עֶרְיְתָא מֵחַרְצָן וְעַד יַרְכָּן יְהוֹן:", "onk_en": "Make for them linen pants to cover their nakedness, reaching from their waists to their thighs.", "pj": "וַעֲבֵיד לְהוֹן אֲוַורְסְקִין דְּבוּץ לְכַסָּאָה בְּשַר עִירְיָא מִן אֲתַר קָטוֹר חַרְצֵיהוֹן וְעַד יַרְכֵיהוֹן יְהוֹן", "pj_en": "And thou shalt make for them under-garments of fine linen to cover the flesh of their shame; from the girt of the girdle of their loins unto their thighs they shall be.", "tj": "אֲבַרְסְקוּן דְּבוּץ:", "tj_en": "Drawers of fine linen.", "rashi": "<b>ועשה להם.<\/b> לְאַהֲרֹן וּלְבָנָיו:<br><br><b>מכנסי בד.<\/b> הֲרֵי שְׁמוֹנָה בְגָדִים לְכֹהֵן גָּדוֹל וְאַרְבָּעָה לְכֹהֵן הֶדְיוֹט:", "rashi_en": "ועשה להם AND MAKE FOR THEM — for Aaron and his sons —<br><br>מכנסי בד LINEN BREECHES — this makes eight garments for the High Priest and four for the ordinary priest."}, {"ch": 28, "v": 43, "aliyah": 3, "heb": "וְהָיוּ֩ עַל־אַהֲרֹ֨ן וְעַל־בָּנָ֜יו בְּבֹאָ֣ם&thinsp;<b>׀<\/b> אֶל־אֹ֣הֶל מוֹעֵ֗ד א֣וֹ בְגִשְׁתָּ֤ם אֶל־הַמִּזְבֵּ֙חַ֙ לְשָׁרֵ֣ת בַּקֹּ֔דֶשׁ וְלֹא־יִשְׂא֥וּ עָוֺ֖ן וָמֵ֑תוּ חֻקַּ֥ת עוֹלָ֛ם ל֖וֹ וּלְזַרְע֥וֹ אַחֲרָֽיו׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיהוֹן עַל אַהֲרֹן וְעַל בְּנוֹהִי בְּמֵעַלְהוֹן לְמַשְׁכַּן זִמְנָא אוֹ בְמִקְרָבְהוֹן לְמַדְבְּחָא לְשַׁמָּשָׁא בְקוּדְשָׁא וְלָא יְקַבְּלוּן חוֹבָא וִימוּתוּן קְיָם עָלָם לֵיהּ וְלִבְנוֹהִי בַתְרוֹהִי:", "onk_en": "These [garments] must be worn by Aharon and his sons whenever they come into Tent of Meeting, or approach the altar to serve in the Holy [sanctuary], in order that they not bear iniquity and die. This is an everlasting statute for him and his descendants after him.", "pj": "וִיהוֹן עַל אַהֲרן וְעַל בְּנוֹי בִּזְמַן מֵעַלְהוֹן לְמַשְׁכַּן זִימְנָא אוֹ בְּמִקְרָבֵיהוֹן לְמַדְבְּחָא לְשַׁמָשָׁא בְּקוּדְשָׁא וְלָא יְקַבְּלוּן חוֹבָא וְלָא יְמוּתוּן בְּאֵשָׁא מִצַלְהֲבָא קְיַים עֲלַם לֵיהּ וְלִבְנוֹי בַּתְרוֹי", "pj_en": "And they shall be upon Aharon and upon his sons at the time when they enter the tabernacle of testimony, or when they approach the altar to minister in the sanctuary, that they may not receive the punishment of flaming fire. This is an everlasting statute for him and for his sons after him.", "tj": "", "tj_en": "", "rashi": "<b>והיו על אהרן.<\/b> כָּל הַבְּגָדִים הָאֵלֶּה, עַל אַהֲרֹן הָרְאוּיִין לוֹ:<br><br><b>ועל בניו.<\/b> הָאֲמוּרִין בָּהֶם:<br><br><b>בבאם אל אהל מועד.<\/b> לַהֵיכָל, וְכֵן לַמִּשְׁכָּן:<br><br><b>ומתו.<\/b> הָא לָמַדְתָּ שֶׁהַמְשַׁמֵּשׁ מְחֻסַּר בְּגָדִים בְּמִיתָה.<br><br><b>חקת עולם לו.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר חֻקַּת עוֹלָם הוּא גְּזֵרָה מִיָּד וּלְדוֹרוֹת, לְעַכֵּב בּוֹ (מנחות י\"ט):", "rashi_en": "והיו על אהרן AND THEY SHALL BE UPON AARON — “they” means all these garments (not only the breeches which are the last-mentioned garments); upon Aaron shall be those which are proper to him,<br><br>ועל בניו AND UPON HIS SONS, those prescribed for them.<br><br>בבאם אל אהל מועד WHEN THEY COME INTO THE APPOINTED TENT — into the Temple, and similarly when they come into the Tabernacle.<br><br>ומתו AND THEY DIE — thus you may learn that he who officiates lacking any of these garments is liable to death (Midrash Tanchuma, Achrei Mot 6).<br><br>חקת עולם לו AN ORDINANCE TO HIM FOR EVER — Wherever it is said “an ordinance forever” it is an enactment for the immediate present time and for future generations, and the phrase is used to make invalid thereby (through the fact that this phrase is used) any rite where the details prescribed are not fully carried out (cf. Menachot 19a)."}, {"ch": 29, "v": 1, "aliyah": 4, "heb": "וְזֶ֨ה הַדָּבָ֜ר אֲשֶֽׁר־תַּעֲשֶׂ֥ה לָהֶ֛ם לְקַדֵּ֥שׁ אֹתָ֖ם לְכַהֵ֣ן לִ֑י לְ֠קַ֠ח פַּ֣ר אֶחָ֧ד בֶּן־בָּקָ֛ר וְאֵילִ֥ם שְׁנַ֖יִם תְּמִימִֽם׃", "onk": "וְדֵין פִּתְגָּמָא דִּי תַעְבֵּד לְהוֹן לְקַדָּשָׁא יָתְהוֹן לְשַׁמָּשָׁא <b>קֳדָמָי<\/b> סַב תּוֹר חָד בַּר תּוֹרֵי וְדִכְרִין תְּרֵין שַׁלְמִין:", "onk_en": "This is what you must do for them to consecrate them to serve [<b>before<\/b>] Me [as kohanim]. Take one young bull and two unblemished rams,", "pj": "וְדֵין פִּתְגָמָא דְתַעֲבֵיד לְהוֹן לְקַדְשָׁא יַתְהוֹן לְשַׁמָשָׁא קֳדָמַי סַב תּוֹר חַד בַּר תּוֹרֵי דְלָא עֵירוּבִין וְדִכְרִין תְּרֵין שַׁלְמִין", "pj_en": "And this is the thing that thou shalt do to them to sanctify them, that they may serve before Me. Take one bullock, the young of a bullock, without spot; and two rams, unblemished (perfect);", "tj": "", "tj_en": "", "rashi": "<b>לקח.<\/b> כְּמוֹ קַח. וּשְׁתֵּי גְזִירוֹת הֵן, אַחַת שֶׁל קִיחָה וְאַחַת שֶׁל לְקִיחָה, וְלָהֶן פִּתְרוֹן אֶחָד:<br><br><b>פר אחד.<\/b> לְכַפֵּר עַל מַעֲשֵׂה הָעֵגֶל שֶׁהוּא פַּר:", "rashi_en": "לקח This is the same as קח (the imperative, “Take thou” and must not be regarded as the infinitive). There are two forms of the root: one is קח and the other לקח, both having the same meaning.<br><br>פר אחד ONE BULLOCK — to atone for the incident of worshipping the golden calf which is of the bullock species (cf. Sifra on Leviticus 9:2)."}, {"ch": 29, "v": 2, "aliyah": 4, "heb": "וְלֶ֣חֶם מַצּ֗וֹת וְחַלֹּ֤ת מַצֹּת֙ בְּלוּלֹ֣ת בַּשֶּׁ֔מֶן וּרְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּשָּׁ֑מֶן סֹ֥לֶת חִטִּ֖ים תַּעֲשֶׂ֥ה אֹתָֽם׃", "onk": "וּלְחֵם פַּטִּיר וּגְרִיצִין פַּטִּירִין דְּפִילָן בִּמְשַׁח וְאֶסְפּוֹגִין פַּטִּירִין דִּמְשִׁיחִין בִּמְשָׁח סֻלְתָּא חִטִּין תַּעְבֵּד יָתְהוֹן:", "onk_en": "[also] unleavened bread, unleavened loaves mixed with [olive] oil. and unleavened wafers anointed with oil. You must make them with fine wheat flour.", "pj": "וּלְחֵים פַּטִּיר וּגְרִיצַן פַּטִּירִין דִּפְּתִיכִין בִּמְשַׁח זֵיתָא וְעֵירוּבִין דִּלְחֵם פַּטִּיר דִּמְשִׁיחִין בִּמְשַׁח זֵיתָא סְמִידָא דְחִינְטִין תַּעֲבֵיד יַתְהוֹן", "pj_en": "and unleavened bread, and unleavened cakes, mingled with olive oil; and wafers of unleavened bread anointed with olive oil, and with flour of wheat shalt thou make them.", "tj": "", "tj_en": "", "rashi": "<b>ולחם מצות וחלת מצת ורקיקי מצות.<\/b> הֲרֵי אֵלּוּ שְׁלֹשָׁה מִינִין רְבוּכָה, וְחַלּוֹת וּרְקִיקִים לֶחֶם מַצּוֹת, הִיא הַקְּרוּיָה לְמַטָּה בָּעִנְיָן (פסוק כג) חַלַּת לֶחֶם שֶׁמֶן, עַל שֵׁם שֶׁנּוֹתֵן שֶׁמֶן בָּרְבוּכָה כְּנֶגֶד הַחַלּוֹת וְהָרְקִיקִין, וְכָל הַמִּינִין בָּאִים עֶשֶׂר עֶשֶׂר חַלּוֹת:<br><br><b>בלולת בשמן.<\/b> כְּשֶׁהֵן קֶמַח יוֹצֵק בָּהֶן שֶׁמֶן וּבוֹלְלָן:<br><br><b>משחים בשמן.<\/b> אַחַר אֲפִיָּתָן מוֹשְׁחָן כְּמִין כִי יְוָנִית, שֶׁהִיא עֲשׂוּיָה כְּנוּ\"ן שֶׁלָּנוּ:", "rashi_en": "ולחם מצות וחלת מצת ... ורקיקי מצות AND UNLEAVENED BREAD, AND PIERCED CAKES UNLEAVENED … AND WAFERS UNLEAVENED — Here you have these three kinds: “satured” with scalding water, and pierced cakes, and wafers. The לחם מצות, “unleavened bread” mentioned here is that which is termed further on in this section (v. 23) חלת לחם שמן, “pierced cake of oiled bread”, being so termed because they put unto the saturated dough as much oil as they put into the pieced cakes and wafers together (Menachot 89a). Of each of these kinds there were brought ten cakes (Menachot 76a).<br><br>בלולת בשמן [CAKES] MINGLED WITH OIL — whilst they were still meal they poured oil into them and mixed them up (Menachot 75a).<br><br>משחים בשמן ANOINTED WITH OIL — after they were baked they anointed them in the form of a Greek Chi (X), which is formed like our נ (Menachot 74b and Rashi thereon; Menachot 75a)."}, {"ch": 29, "v": 3, "aliyah": 4, "heb": "וְנָתַתָּ֤ אוֹתָם֙ עַל־סַ֣ל אֶחָ֔ד וְהִקְרַבְתָּ֥ אֹתָ֖ם בַּסָּ֑ל וְאֶ֨ת־הַפָּ֔ר וְאֵ֖ת שְׁנֵ֥י הָאֵילִֽם׃", "onk": "וְתִתֵּן יָתְהוֹן עַל סַלָּא חַד וּתְקָרֵב יָתְהוֹן בְּסַלָּא וְיָת תּוֹרָא וְיָת תְּרֵין דִּכְרִין:", "onk_en": "Place them in one basket and bring them in the basket [along] with the young bull and the two rams.", "pj": "וְתִתֵּן יַתְהוֹן עַל סַלָא חָד וּתְקָרֵב יַתְהוֹן בְּסַלָא וְיַת תּוֹרָא וְיַת תְּרֵין דִּכְרִין יְסוֹבְרוּן בְּאַסְלָא", "pj_en": "And thou shalt put them upon one basket, and offer them in the basket, and the bullock and the two rams they shall bring in a vehicle.", "tj": "", "tj_en": "", "rashi": "<b>והקרבת אתם.<\/b> אֶל חֲצַר הַמִּשְׁכָּן בְּיוֹם הֲקָמָתוֹ:", "rashi_en": "והקרבת אתם AND THOU SHALT OFFER THEM (lit., bring them near) to the court of the Tabernacle on the day when it will be first erected."}, {"ch": 29, "v": 4, "aliyah": 4, "heb": "וְאֶת־אַהֲרֹ֤ן וְאֶת־בָּנָיו֙ תַּקְרִ֔יב אֶל־פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְרָחַצְתָּ֥ אֹתָ֖ם בַּמָּֽיִם׃", "onk": "וְיָת אַהֲרֹן וְיָת בְּנוֹהִי תְקָרֵב לִתְרַע מַשְׁכַּן זִּמְנָא וְתַסְחֵי יָתְהוֹן בְּמַיָּא:", "onk_en": "Bring Aharon and his sons near to the entrance of the Tent of Meeting, and immerse them in the water.", "pj": "וְיַת אַהֲרן וְיַת בְּנוֹי תִּקְרַב לִתְרַע מַשְׁכַּן זִמְנָא וְתִּטְבּוֹל יַתְהוֹן בְּאַרְבְּעִין סְאִין דְּמַיָין חַיָין", "pj_en": "And Aharon and his two sons thou shalt bring near to the door of the tabernacle of testimony, and wash them, in four measures of living water.", "tj": "", "tj_en": "", "rashi": "<b>ורחצת.<\/b> זוֹ טְבִילַת כָּל הַגּוּף:", "rashi_en": "ורחצת AND THOU SHALT WASH [THEM] — This signifies the immersion of the entire body (cf. Targum Jonathan)."}, {"ch": 29, "v": 5, "aliyah": 4, "heb": "וְלָקַחְתָּ֣ אֶת־הַבְּגָדִ֗ים וְהִלְבַּשְׁתָּ֤ אֶֽת־אַהֲרֹן֙ אֶת־הַכֻּתֹּ֔נֶת וְאֵת֙ מְעִ֣יל הָאֵפֹ֔ד וְאֶת־הָאֵפֹ֖ד וְאֶת־הַחֹ֑שֶׁן וְאָפַדְתָּ֣ ל֔וֹ בְּחֵ֖שֶׁב הָאֵפֹֽד׃", "onk": "וְתִסַּב יָת לְבוּשַׁיָּא וְתַלְבֵּשׁ יָת אַהֲרֹן יָת כִּתּוּנָא וְיָת מְעִיל אֵפוֹדָא וְיָת אֵפוֹדָא וְיָת חוּשְׁנָא <b>וְתַתְקֵן<\/b> לֵיהּ בְּהֶמְיַן אֵפוֹדָא:", "onk_en": "Take the garments and clothe Aharon with the undershirt, the robe of the eiphod, the eiphod, the breastplate, and gird [<b>beautify<\/b>] him with the belt of the eiphod.", "pj": "וְתִסַב יַת לְבוּשַׁיָא וְתַלְבֵּישׁ יַת אַהֲרן יַת כִּיתּוּנָא וְיַת מִנְטַר מְעִיל אֵפוֹדָא וְיַת אֵפוֹדָא וְיַת חוּשְׁנָא וּתְטַכֵּס יָתֵיהּ בְּהֶמְיַין אֵפוֹדָא", "pj_en": "And thou shalt take the vestments, and clothe Aharon with the tunic, and the robe of the ephod, and the ephod, and the breastplate, and gird him (or ordain him) with the girdle of the ephod.", "tj": "", "tj_en": "", "rashi": "<b>ואפדת.<\/b> קַשֵּׁט וְתַקֵּן הַחֲגוֹרָה וְהַסִּינָר סְבִיבוֹתָיו:", "rashi_en": "ואפדת AND THOU SHALT FASTEN [THE EPHOD ON] — adorn and arrange the girdle and the apron around him."}, {"ch": 29, "v": 6, "aliyah": 4, "heb": "וְשַׂמְתָּ֥ הַמִּצְנֶ֖פֶת עַל־רֹאשׁ֑וֹ וְנָתַתָּ֛ אֶת־נֵ֥זֶר הַקֹּ֖דֶשׁ עַל־הַמִּצְנָֽפֶת׃", "onk": "וּתְשַׁוִּי מִצְנֶפְתָּא עַל רֵישֵׁיהּ וְתִתֵּן יָת כְּלִילָא דְּקוּדְשָׁא עַל מִצְנֶפְתָּא:", "onk_en": "Set the turban upon his head and place the sacred diadem upon the turban.", "pj": "וּתְשַׁוֵּי מַצְנַפְתָּא עַל רֵישֵׁיהּ וְתִתֵּן יַת כְּלִילָא דְבֵיהּ חֲקִיק שְׁמָא דְקוּדְשָׁא עַל מִצְנַפְתָּא", "pj_en": "And thou shalt set the mitre on his head, and put the diadem upon which is engraven the Name of Holiness upon the mitre.", "tj": "", "tj_en": "", "rashi": "<b>נזר הקדש.<\/b> זֶה הַצִּיץ:<br><br><b>על המצנפת.<\/b> כְּמוֹ שֶׁפֵּרַשְׁתִּי לְמַעְלָה – עַל יְדֵי הַפְּתִיל הָאֶמְצָעִי וּשְׁנֵי פְתִילִין שֶׁבְּרֹאשׁוֹ, הַקְּשׁוּרִין שְׁלָשְׁתָּן מֵאֲחוֹרֵי הָעֹרֶף, הוּא נוֹתְנוֹ עַל הַמִּצְנֶפֶת כְּמִין כּוֹבַע:", "rashi_en": "נזר הקדש THE DIADEM OF HOLINESS — This refers to the Plate.<br><br>על המצנפת UPON THE MITRE, as I have explained above (Exodus 28:37) — by means of the middle string and the two strings at its (the Plate’s) ends which were, the three of them, tied together behind his neck he placed it upon the mitre as a kind of helmet."}, {"ch": 29, "v": 7, "aliyah": 4, "heb": "וְלָֽקַחְתָּ֙ אֶת־שֶׁ֣מֶן הַמִּשְׁחָ֔ה וְיָצַקְתָּ֖ עַל־רֹאשׁ֑וֹ וּמָשַׁחְתָּ֖ אֹתֽוֹ׃", "onk": "וְתִסַּב יָת מִשְׁחָא דִרְבוּתָא וּתְרִיק עַל רֵישֵׁיהּ וּתְרַבִּי יָתֵיהּ:", "onk_en": "Take the anointing oil and pour it on his head and anoint him.", "pj": "וְתִיסַב יַת מִשְׁחָא דִרְבוּתָא וְתָרִיק עַל רֵישֵׁיהּ וּתְרַבֵּי יָתֵיהּ", "pj_en": "And thou shalt take the anointing oil, and pour it upon his head and anoint him.", "tj": "", "tj_en": "", "rashi": "<b>ומשחת אתו.<\/b> אַף מְשִׁיחָה זוֹ כְּמִין כִי, נוֹתֵן שֶׁמֶן עַל רֹאשׁוֹ וּבֵין רִסֵּי עֵינָיו וּמְחַבְּרָן בְּאֶצְבָּעוֹ (כריתות ה'):", "rashi_en": "ומשחת אתו AND THOU SHALT ANOINT HIM — This anointing also, was in the form of a X: he put a drop of oil on his head and another drop between his eyebrows and joined them with his finger into this shape (Keritot 5b)."}, {"ch": 29, "v": 8, "aliyah": 4, "heb": "וְאֶת־בָּנָ֖יו תַּקְרִ֑יב וְהִלְבַּשְׁתָּ֖ם כֻּתֳּנֹֽת׃", "onk": "וְיָת בְּנוֹהִי תְּקָרֵב וְתַלְבֵּשִׁנּוּן כִּתּוּנִין:", "onk_en": "Bring his sons near and clothe them with undershirts.", "pj": "וְיַת בְּנוֹי תַקְרֵב וְתַלְבְּשִׁינוּן כִּיתּוּנִין", "pj_en": "And thou shalt bring his sons near, and dress them in the tunics,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 9, "aliyah": 4, "heb": "וְחָגַרְתָּ֩ אֹתָ֨ם אַבְנֵ֜ט אַהֲרֹ֣ן וּבָנָ֗יו וְחָבַשְׁתָּ֤ לָהֶם֙ מִגְבָּעֹ֔ת וְהָיְתָ֥ה לָהֶ֛ם כְּהֻנָּ֖ה לְחֻקַּ֣ת עוֹלָ֑ם וּמִלֵּאתָ֥ יַֽד־אַהֲרֹ֖ן וְיַד־בָּנָֽיו׃", "onk": "וּתְזָרֵז יָתְהוֹן הֶמְיָנִין אַהֲרֹן וּבְנוֹהִי וְתַתְקַן לְהוֹן כּוֹבָעִין וּתְהֵי לְהוֹן כְּהֻנְתָּא לִקְיָם עָלָם <b>וּתְקָרֵב קֻרְבָּנָא דְ<\/b>אַהֲרֹן <b>וְקֻרְבָּנָא<\/b> דִבְנוֹהִי:", "onk_en": "Gird them—Aharon and his sons—with sash-belts, and bind turban-like hats for them, and the priesthood shall be for them an everlasting statute. Thus you shall install [<b>offer the sacrifice of<\/b>] Aharon and [<b>the sacrifice of<\/b>] his sons.", "pj": "וְתִּטְכַס יַתְהוֹן בְּקַמּוּרִין לְאַהֲרן וּבְנוֹי וְתִכְבּוֹשׁ לְהוֹן כּוּבְעִין וּתְהֵי לְהוֹן כְּהוּנָתָא לִקְיַים עֲלָם וּתְקָרֵיב קוּרְבָּנָא דְאַהֲרן וְקוּרְבָּנָא דִבְנוֹי", "pj_en": "and indue (ordain) them with the girdles, Aharon and his sons, and wrap on them the mitres; and the priesthood shall be theirs by an everlasting statute. And thou shalt offer the oblation of Aharon, and the oblation of his sons.", "tj": "", "tj_en": "", "rashi": "<b>והיתה להם.<\/b> מִלּוּי יָדַיִם זֶה לִכְהֻנַּת עוֹלָם:<br><br><b>ומלאת.<\/b> עַל יְדֵי הַדְּבָרִים הָאֵלֶּה:<br><br><b>יד אהרן ויד בניו.<\/b> בְּמִנּוּי וּפְקֻדַּת הַכְּהֻנָּה:", "rashi_en": "והיתה להם AND SHALL BE UNTO THEM This “filling of hands” shall be for an everlasting priesthood.<br><br>ומלאת AND THOU SHALT “FILL” by means of these following matters<br><br>יד אהרן ויד בניו AARON’S HAND AND HIS SONS’ HANDS in the appointment and assigment to the priesthood."}, {"ch": 29, "v": 10, "aliyah": 4, "heb": "וְהִקְרַבְתָּ֙ אֶת־הַפָּ֔ר לִפְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְסָמַ֨ךְ אַהֲרֹ֧ן וּבָנָ֛יו אֶת־יְדֵיהֶ֖ם עַל־רֹ֥אשׁ הַפָּֽר׃", "onk": "וּתְקָרֵב יָת תּוֹרָא לִקֳדָם מַשְׁכַּן זִמְנָא וְיִסְמוֹךְ אַהֲרֹן וּבְנוֹהִי יָת יְדֵיהוֹן עַל רֵישׁ תּוֹרָא:", "onk_en": "Bring the young bull before the Tent of Meeting, and Aharon and his sons shall support their hands on the head of the young bull.", "pj": "וְתַקְרֵיב יַת תּוֹרָא קֳדָם מַשְׁכַּן זִמְנָא וְיִסְמוֹךְ אַהֲרן וּבְנוֹי יַת יְדֵיהוֹן עַל רֵישׁ תּוֹרָא", "pj_en": "And thou shalt bring the bullock before the tabernacle of ordinance, and Aharon and his sons shall lay their hands upon the head of the bullock,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 11, "aliyah": 4, "heb": "וְשָׁחַטְתָּ֥ אֶת־הַפָּ֖ר לִפְנֵ֣י יְהֹוָ֑ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְתִכּוֹס יָת תּוֹרָא קֳדָם יְיָ בִּתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "Slaughter the bull before Adonoy, at the entrance of the Tent of Meeting.", "pj": "וְתִיכּוֹס יַת תּוֹרָא קֳדָם יְיָ לִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "and thou shalt kill the bullock before the door of the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "<b>פתח אהל מועד.<\/b> בַּחֲצַר הַמִּשְׁכָּן שֶׁלִּפְנֵי הַפֶּתַח:", "rashi_en": "פתח אהל מועד BY THE ENTRANCE OF THE APPOINTED TENT — i. e. in the court of the Tabernacle which was in front of the entrance."}, {"ch": 29, "v": 12, "aliyah": 4, "heb": "וְלָֽקַחְתָּ֙ מִדַּ֣ם הַפָּ֔ר וְנָתַתָּ֛ה עַל־קַרְנֹ֥ת הַמִּזְבֵּ֖חַ בְּאֶצְבָּעֶ֑ךָ וְאֶת־כׇּל־הַדָּ֣ם תִּשְׁפֹּ֔ךְ אֶל־יְס֖וֹד הַמִּזְבֵּֽחַ׃", "onk": "וְתִסַּב מִדְּמָא דְתוֹרָא וְתִתֵּן עַל קַרְנַת מַדְבְּחָא בְּאֶצְבָּעָךְ וְיָת כָּל דְּמָא תֵישׁוֹד לִיסוֹדָא דְּמַדְבְּחָא:", "onk_en": "Take of the blood of the bull and put it on the horn-like elevations of the altar with your finger, and pour all the [remaining] blood at the base of the altar.", "pj": "וְתִיסַב מֵאַדְמָא דְתוֹרָא וְתִתֵּן עַל קַרְנַת מַדְבְּחָא בְּאַדְבָּעָךְ וְיַת כָּל דְּמָא תֵשׁוֹד לִיסוֹדָא דְמַדְבְּחָא", "pj_en": "and take of the blood of the bullock, and put (it) on the horns of the altar with thy finger, and all the (remaining) blood thou shalt pour out at the foot of the altar.", "tj": "", "tj_en": "", "rashi": "<b>על קרנת.<\/b> לְמַעְלָה בַּקְּרָנוֹת מַמָּשׁ:<br><br><b>ואת כל הדם.<\/b> שְׁיָרֵי הַדָּם:<br><br><b>אל יסוד המזבח.<\/b> כְּמִין בְּלִיטַת בֵּית קִבּוּל עָשׂוּי לוֹ סָבִיב סָבִיב, לְאַחַר שֶׁעָלָה אַמָּה מִן הָאָרֶץ:", "rashi_en": "על קרנות UPON THE HORNS — on top of the horns actually (the blood was not to be sprinkled from below so as to reach the horns but was to be placed by the finger actually upon the horns) (Zevachim 53a).<br><br>ואת כל הדם AND ALL THE BLOOD i. e. all the remainder of the blood (that which is left after some of it had been placed upon the horns of the altar as just stated).<br><br>אל יסוד המזבח AT THE BOTTOM OF THE ALTAR — A kind of projection that formed a receptacle was made right round it after it had risen to a height of one cubit from the ground (Sukkah 45a)."}, {"ch": 29, "v": 13, "aliyah": 4, "heb": "וְלָֽקַחְתָּ֗ אֶֽת־כׇּל־הַחֵ֘לֶב֮ הַֽמְכַסֶּ֣ה אֶת־הַקֶּ֒רֶב֒ וְאֵ֗ת הַיֹּתֶ֙רֶת֙ עַל־הַכָּבֵ֔ד וְאֵת֙ שְׁתֵּ֣י הַכְּלָיֹ֔ת וְאֶת־הַחֵ֖לֶב אֲשֶׁ֣ר עֲלֵיהֶ֑ן וְהִקְטַרְתָּ֖ הַמִּזְבֵּֽחָה׃", "onk": "וְתִסַּב יָת כָּל תַּרְבָּא דְּחָפֵי יָת גַּוָּא וְיָת חִצְרָא דִּעַל כַּבְדָא וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבָּא דִּי עֲלֵיהֶן וְתַסֵּיק לְמַדְבְּחָא:", "onk_en": "Take all the fat that covers the inner organs, the lobe that is with the liver, the two kidneys with the fat that is upon them, and burn them on the altar.", "pj": "וְתִיסַב יַת כָּל תַּרְבָּא דְחָפֵי עַל בְּנֵי גַוָא וְיַת דְּמִשְׁתְּאַר עַל חֲצַר כַּבְדָא וְיַת תַּרְתֵּין כּוֹלְיַין וְיַת תַּרְבָּא דִעֲלֵיהוֹן וּתְסַדֵּר עַל מַדְבְּחָא", "pj_en": "And thou shalt take all the fat that covereth the inwards, and what remaineth upon the caul of the liver, and the two kidneys, and the fat which is upon them, and set them in order upon the altar.", "tj": "", "tj_en": "", "rashi": "<b>החלב המכסה את הקרב.<\/b> הוּא הַקְּרוּם שֶׁעַל הַכֶּרֶס, שֶׁקּוֹרִין טי\"לא:<br><br><b>ואת היתרת.<\/b> הוּא טַרְפְּשָׁא דְּכַבְדָּא, שֶׁקּוֹרִין איבר\"יש:<br><br><b>על הכבד.<\/b> אַף מִן הַכָּבֵד טֹל עִמָּהּ (ספרא):", "rashi_en": "החלב המכסה את הקרב THE FAT THAT COVERETH THE INWARDS — this is the membrane upon the maw (Tosefta Chullin 9:3) which is called tele in old French<br><br>ואת היתרת This is the lobe of the liver which is called abris in old French<br><br>על הכבד — Take with it (with the lobe) some of the liver also (cf. Sifra, Vayikra Dibbura d'Nedavah, Section 14 8)."}, {"ch": 29, "v": 14, "aliyah": 4, "heb": "וְאֶת־בְּשַׂ֤ר הַפָּר֙ וְאֶת־עֹר֣וֹ וְאֶת־פִּרְשׁ֔וֹ תִּשְׂרֹ֣ף בָּאֵ֔שׁ מִח֖וּץ לַֽמַּחֲנֶ֑ה חַטָּ֖את הֽוּא׃", "onk": "וְיָת בִּסְרָא דְתוֹרָא וְיָת מַשְׁכֵּיהּ וְיָת אוּכְלֵיהּ תּוֹקִיד בְּנוּרָא מִבָּרָא לְמַשְׁרִיתָא חַטָּאתָא הוּא:", "onk_en": "[However] the flesh of the bull, its skin, and its intestinal waste, you shall burn with fire outside the camp. It is a sin-offering.", "pj": "וְיַת בִּשְרָא דְתוֹרָא וְיַת מוֹשְׁכֵיהּ וְיַת רֵיעֵיהּ תּוֹקַד בְּנוּרָא מִבָּרָא לְמַשְׁרִיתָא חַטָּאתָא הוּא", "pj_en": "And the flesh of the bullock, and his skin, and his dung, thou shalt burn with fire without the camp; it is a sin offering.", "tj": "", "tj_en": "", "rashi": "<b>תשרף באש.<\/b> לֹא מָצִינוּ חַטָּאת חִיצוֹנָה נִשְׂרֶפֶת אֶלָּא זוֹ:", "rashi_en": "תשרף באש SHALT THOU BURN WITH FIRE — We do not find that any “outside” sin offering was to be burnt except this (cf. Rashi on Leviticus 9:11)."}, {"ch": 29, "v": 15, "aliyah": 4, "heb": "וְאֶת־הָאַ֥יִל הָאֶחָ֖ד תִּקָּ֑ח וְסָ֨מְכ֜וּ אַהֲרֹ֧ן וּבָנָ֛יו אֶת־יְדֵיהֶ֖ם עַל־רֹ֥אשׁ הָאָֽיִל׃", "onk": "וְיָת דִּכְרָא חַד תִּסַּב וְיִסְמְכוּן אַהֲרֹן וּבְנוֹהִי יָת יְדֵיהוֹן עַל רֵישׁ דִּכְרָא:", "onk_en": "Take the first ram and have Aharon and his sons support their hands on the head of the ram.", "pj": "וְיַת דִּכְרָא חָד תִּסַב וְיִסְמְכוּן אַהֲרן וּבְנוֹי יַת יְדֵיהוֹן עַל רֵישׁ דִּכְרָא", "pj_en": "And the one ram thou shalt take, and Aharon and his sons shall lay their hands on the head of the ram.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 16, "aliyah": 4, "heb": "וְשָׁחַטְתָּ֖ אֶת־הָאָ֑יִל וְלָֽקַחְתָּ֙ אֶת־דָּמ֔וֹ וְזָרַקְתָּ֥ עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְתִכּוֹס יָת דִּכְרָא וְתִסַּב יָת דְּמֵיהּ וְתִזְרוֹק עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "Slaughter the ram, and take its blood, and sprinkle it around the altar.", "pj": "וְתִכּוֹס יַת דִּכְרָא וְתִסַּב יַת אַדְמֵיהּ וְתִדְרוֹק עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And thou shalt kill the ram, and take his blood and sprinkle on the altar round about.", "tj": "", "tj_en": "", "rashi": "<b>וזרקת.<\/b> בִּכְלִי; אוֹחֵז בַּמִּזְרָק וְזוֹרֵק כְּנֶגֶד הַקֶּרֶן כְּדֵי שֶׁיֵּרָאֶה לְכָאן וּלְכָאן, וְאֵין קָרְבָּן טָעוּן מַתָּנָה בְּאֶצְבַּע אֶלָּא חַטָּאת בִּלְבַד, אֲבָל שְׁאָר זְבָחִים אֵינָן טְעוּנִין קֶרֶן וְלֹא אֶצְבַּע, שֶׁמַּתַּן דָּמָם מֵחֲצִי הַמִּזְבֵּחַ וּלְמַטָּה, וְאֵינוֹ עוֹלֶה בַּכֶּבֶשׁ אֶלָּא עוֹמֵד בָּאָרֶץ וְזוֹרֵק (זבחים נ\"ג):<br><br><b>סביב.<\/b> כָּךְ מְפֹרָשׁ בִּשְׁחִיטַת קָדָשִׁים שֶׁאֵין סָבִיב אֶלָּא שְׁתֵּי מַתָּנוֹת שֶׁהֵן אַרְבַּע, הָאַחַת בְּקֶרֶן זָוִית זוֹ, וְהָאַחַת שֶׁכְּנֶגְדָהּ בַּאֲלַכְסוֹן, וְכָל מַתָּנָה נִרְאֵית בִּשְׁנֵי צִדֵּי הַקֶּרֶן אֵילָךְ וָאֵילָךְ, נִמְצָא הַדָּם נָתוּן בְּאַרְבַּע רוּחוֹת סָבִיב, לְכָךְ קָרוּי סָבִיב:", "rashi_en": "וזרקת AND THOU SHALT SPRINKLE IT with a vessel: he held the basin and cast blood from it towards the horn in such a manner that it (the blood) showed on both sides of it. No offering except the sin-offering alone required that its blood should be smeared with the finger, but other sacrifices required neither “horn” nor “finger” (did not require that the blood should be placed on the horn of the altar by the fingers), for the sprinkling of their blood had to be upon the lower half of the altar, and he (the priest) therefore did not mount the ascent leading to the top of the altar but he stood on the ground and sprinkled the blood (Zevachim 53b).<br><br>סביב ROUND ABOUT — This is how it is explained in the Treatise on Slaughtering the Sacrifices (Zevachim 53b): that סביב, “round about” signifies nothing more than that there were to be two sprinklings so made that they should constitute four — one on this corner and one at that which was diagonally opposite it, and so that each sprinkling showed on both sides of the corner, on this and on that side; it followed therefore that the blood was placed on the four sides round about, and for this reason it is here termed סביב."}, {"ch": 29, "v": 17, "aliyah": 4, "heb": "וְאֶ֨ת־הָאַ֔יִל תְּנַתֵּ֖חַ לִנְתָחָ֑יו וְרָחַצְתָּ֤ קִרְבּוֹ֙ וּכְרָעָ֔יו וְנָתַתָּ֥ עַל־נְתָחָ֖יו וְעַל־רֹאשֽׁוֹ׃", "onk": "וְיָת דִּכְרָא תְּפַלֵּג <b>לְאֵבָרוֹהִי<\/b> וּתְחַלִּיל גַּוֵּיהּ וּכְרָעוֹהִי וְתִתֵּן עַל <b>אֵבָרוֹהִי<\/b> וְעַל רֵישֵׁיהּ:", "onk_en": "Cut the ram into pieces [<b>its limbs<\/b>]. [Then] wash off its intestines and its legs and place them with its cut up pieces [<b>limbs<\/b>] and its head.", "pj": "וְיַת דִּכְרָא תַפְסִיג לְפִסְגוֹי וּתְחַלֵּיל בְּנֵי גַוָאָה וּכְרָעוֹי וּתְסַדֵּר עַל אֵיבָרוֹי וְעַל רֵישֵׁיהּ", "pj_en": "And the ram shalt thou divide according to his members (dividings), and wash his inwards and his legs, and set them in order upon his members, and upon his head.", "tj": "וְיַת דִּיכְרָא תְפַסֵּק לְפִסְגוֹי וְתַשְׁזֵג בְּנֵי גַוָוהּ וְרִיגְלוֹי וְתִתֵּן עַל פִּסְגוֹי וְעַל רֵישֵׁיהּ:", "tj_en": "And the ram thou shalt divide according to his divisions, and shalt cleanse his inwards and his legs, and lay them upon his divided parts, upon his head.", "rashi": "<b>על נתחיו.<\/b> עִם נְתָחָיו – מוּסָף עַל שְׁאָר הַנְּתָחִים:", "rashi_en": "על נתחיו [AND PUT THEM] TO ITS PIECES — i. e. together with (על) its pieces — added to the other pieces."}, {"ch": 29, "v": 18, "aliyah": 4, "heb": "וְהִקְטַרְתָּ֤ אֶת־כׇּל־הָאַ֙יִל֙ הַמִּזְבֵּ֔חָה עֹלָ֥ה ה֖וּא לַֽיהֹוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַיהֹוָ֖ה הֽוּא׃", "onk": "וְתַסֵּיק יָת כָּל דִּכְרָא לְמַדְבְּחָא עֲלָתָא הוּא <b>קֳדָם<\/b> יְיָ <b>לְאִתְקַבָּלָא בְרַעֲוָא קֻרְבָּנָא<\/b> קֳדָם יְיָ הוּא:", "onk_en": "Burn the entire ram on the altar, it is a burnt-offering to [<b>before<\/b>] Adonoy, a pleasing fragrance [<b>to be accepted with favor<\/b>], a fire-offering to [<b>sacrifice before<\/b>] Adonoy.", "pj": "וְתַסִיק יַת כָּל דִּכְרָא לְמַדְבְּחָא עֲלָתָא הוּא קֳדָם יְיָ לְאִתְקַבָּלָא בְּרַעֲוָא קוּרְבָּנָא קֳדָם יְיָ הוּא", "pj_en": "And thou shalt offer the whole ram upon the altar, it is a holocaust before the Lord to be accepted with favour, an oblation it is before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ריח ניחוח.<\/b> נַחַת רוּחַ לְפָנַי, שֶׁאָמַרְתִּי וְנַעֲשָׂה רְצוֹנִי:<br><br><b>אשה.<\/b> לְשׁוֹן אֵשׁ, וְהִיא הַקְטָרַת אֵבָרִים שֶׁעַל הָאֵשׁ:", "rashi_en": "ריח נחוח AS A PLEASING ODOUR — as a gratification of spirit before Me — that I commanded and My will was carried out (Zevachim 46b).<br><br>אשה AN OFFERING MADE BY FIRE a term connected with the word אש, fire: it denotes the burning of the parts which had been placed on the fire (cf. Rashi on Leviticus 1:9)."}, {"ch": 29, "v": 19, "aliyah": 5, "heb": "וְלָ֣קַחְתָּ֔ אֵ֖ת הָאַ֣יִל הַשֵּׁנִ֑י וְסָמַ֨ךְ אַהֲרֹ֧ן וּבָנָ֛יו אֶת־יְדֵיהֶ֖ם עַל־רֹ֥אשׁ הָאָֽיִל׃", "onk": "וְתִסַּב יָת דִּכְרָא תִנְיָנָא וְיִסְמוֹךְ אַהֲרֹן וּבְנוֹהִי יָת יְדֵיהוֹן עַל רֵישׁ דִּכְרָא:", "onk_en": "Take the second ram and have Aharon and his sons support their hands on the head of the ram.", "pj": "וְתִיסַב יַת דִּכְרָא תִנְיָנָא וְיִסְמוֹךְ אַהֲרן וּבְנוֹי יַת יְדֵיהוֹן עַל רֵישׁ דִּכְרָא", "pj_en": "And thou shalt take the second ram, and Aharon and his sons shall lay their hands upon the head of the ram.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 20, "aliyah": 5, "heb": "וְשָׁחַטְתָּ֣ אֶת־הָאַ֗יִל וְלָקַחְתָּ֤ מִדָּמוֹ֙ וְנָֽתַתָּ֡ה עַל־תְּנוּךְ֩ אֹ֨זֶן אַהֲרֹ֜ן וְעַל־תְּנ֨וּךְ אֹ֤זֶן בָּנָיו֙ הַיְמָנִ֔ית וְעַל־בֹּ֤הֶן יָדָם֙ הַיְמָנִ֔ית וְעַל־בֹּ֥הֶן רַגְלָ֖ם הַיְמָנִ֑ית וְזָרַקְתָּ֧ אֶת־הַדָּ֛ם עַל־הַמִּזְבֵּ֖חַ סָבִֽיב׃", "onk": "וְתִכּוֹס יָת דִּכְרָא וְתִסַּב מִדְמֵיהּ וְתִתֵּן עַל רוּם אוּדְנָא דְאַהֲרֹן וְעַל רוּם אוּדְנָא דִבְנוֹהִי דְּיַמִּינָא וְעַל אִלְיוֹן יְדֵיהוֹן דְּיַמִּינָא וְעַל אִלְיוֹן רַגְלֵיהוֹן דְּיַמִּינָא וְתִזְרוֹק יָת דְּמָא עַל מַדְבְּחָא סְחוֹר סְחוֹר:", "onk_en": "Slaughter the ram, and take of its blood, and place it on the tip of Aharon’s right ear, and on the tip of the right ear of his sons, and on the thumb of their right hands, and on the big toe of their right feet. Sprinkle the [remaining] blood all around the altar.", "pj": "וְתִיכּוֹס יַת דִּכְרָא וְתִיסַב מִן אַדְמֵיהּ וְתִתֵּן עַל חַסְחוּס אוּדְנָא דְאַהֲרן דְּיַמִינָא וְעַל חַסְחוּס אוּדְנָא דִבְנוֹי דְיַמִינָא וְעַל אִילְיוֹן יְדֵיהוֹן דְּיַמִינָא וְעַל אִילְיוֹן רִיגְלֵיהוֹן דְּיַמִינָא וְתִדְרוֹק יַת מוֹתַר אַדְמָא עַל מַדְבְּחָא חֲזוֹר חֲזוֹר", "pj_en": "And thou shalt kill the ram, and take of his blood, and put upon the tip of Aharon's right ear, and upon the tip of the right ear of his sons, and upon the thumb of their right hands, and upon the toe of their right feet, and pour the rest of the blood upon the altar round about.", "tj": "", "tj_en": "", "rashi": "<b>תנוך.<\/b> הוּא הַסְּחוּס הָאֶמְצָעִי שֶׁבְּתוֹךְ הָאֹזֶן, שֶׁקּוֹרִין טנדרו\"ס בְּלַעַז:<br><br><b>בהן ידם.<\/b> הַגּוּדָל וּבַפֶּרֶק הָאֶמְצָעִי (ספרא):", "rashi_en": "תנוך — This is the inner cartilage which is within the ear, which they call tendrons in old French (cf. Rashi on Leviticus 14:14).<br><br>בהן ידם — i. e. the thumb; and the blood was placed on the middle joint (Chullin 11a)."}, {"ch": 29, "v": 21, "aliyah": 5, "heb": "וְלָקַחְתָּ֞ מִן־הַדָּ֨ם אֲשֶׁ֥ר עַֽל־הַמִּזְבֵּ֘חַ֮ וּמִשֶּׁ֣מֶן הַמִּשְׁחָה֒ וְהִזֵּיתָ֤ עַֽל־אַהֲרֹן֙ וְעַל־בְּגָדָ֔יו וְעַל־בָּנָ֛יו וְעַל־בִּגְדֵ֥י בָנָ֖יו אִתּ֑וֹ וְקָדַ֥שׁ הוּא֙ וּבְגָדָ֔יו וּבָנָ֛יו וּבִגְדֵ֥י בָנָ֖יו אִתּֽוֹ׃", "onk": "וְתִסַּב מִן דְּמָא דִּי עַל מַדְבְּחָא וּמִמִּשְׁחָא דִרְבוּתָא וְתַדֵּי עַל אַהֲרֹן וְעַל לְבוּשׁוֹהִי וְעַל בְּנוֹהִי וְעַל לְבוּשֵׁי בְנוֹהִי עִמֵּיהּ וְיִתְקַדַּשׁ הוּא וּלְבוּשׁוֹהִי וּבְנוֹהִי וּלְבוּשֵׁי בְנוֹהִי עִמֵּיהּ:", "onk_en": "Take of the blood that is on the altar, and of the anointing oil and sprinkle it upon Aharon and his garments, and upon his sons and their garments as well. Thus he and his garments will be consecrated, along with his sons and his son’s garments.", "pj": "וְתִיסַב מִן אַדְמָא דְעַל מַדְבְּחָא וּמִמִּשְׁחָא דִרְבוּתָא וְתַדִי עַל אַהֲרן וְעַל לְבוּשׁוֹי וְעַל בְּנוֹי וְעַל לְבוּשֵׁי בְּנוֹי עִמֵּיהּ וְיִתְקַדֵּשׁ הוּא וּלְבוּשׁוֹהִי וּבְנוֹהִי וּלְבוּשֵׁי בְּנוֹהִי עִמֵּיהּ", "pj_en": "And thou shalt take of the blood which is upon the altar, and of the anointing oil, and drop it upon Aharon, and upon his vestments, and on his sons, and on his sons' vestments with him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 22, "aliyah": 5, "heb": "וְלָקַחְתָּ֣ מִן־הָ֠אַ֠יִל הַחֵ֨לֶב וְהָֽאַלְיָ֜ה וְאֶת־הַחֵ֣לֶב&thinsp;<b>׀<\/b> הַֽמְכַסֶּ֣ה אֶת־הַקֶּ֗רֶב וְאֵ֨ת יֹתֶ֤רֶת הַכָּבֵד֙ וְאֵ֣ת&thinsp;<b>׀<\/b> שְׁתֵּ֣י הַכְּלָיֹ֗ת וְאֶת־הַחֵ֙לֶב֙ אֲשֶׁ֣ר עֲלֵיהֶ֔ן וְאֵ֖ת שׁ֣וֹק הַיָּמִ֑ין כִּ֛י אֵ֥יל מִלֻּאִ֖ים הֽוּא׃", "onk": "וְתִסַּב מִן דִּכְרָא תַּרְבָּא וְאַלִּיתָא וְיָת תַּרְבָּא דְחָפֵי יָת גַּוָּא וְיָת חֲצַר כַּבְדָּא וְיָת תַּרְתֵּין כָּלְיָן וְיָת תַּרְבָּא דִּי עֲלֵיהֶן וְיָת שׁוֹקָא דְיַמִּינָא אֲרֵי דְּכַר <b>קֻרְבָּנָא<\/b> הוּא:", "onk_en": "Take from the ram the [intestinal] fat, the broad tail, the fat that covers the inner organs, the lobe of the liver, the two kidneys, and the fat that is upon them, and the right shoulder, for it is a ram of a completion-offering [<b>offering<\/b>].", "pj": "וְתִסַב מִן דִּכְרָא תַּרְבָּא וְאַלְיָתָא וְיַת תַּרְבָּא דְחָפֵי יַת בְּנֵי גַוָא וְיַת דְּמִשְׁתְּאַר עַל חֲצַר כַּבְדָא וְיַת תַּרְתֵּין כּוּלְּיַין וְיַת תַּרְבָּא דַּעֲלֵיהוֹן וְיַת שׁוֹקָא דְיַמִּינָא אֲרוּם דְּכַר קוּרְבָּנַיָא הוּא", "pj_en": "And thou shalt take of the ram, the fat and the tail, and the fat that covereth the inwards, and which remaineth upon the caul of the liver, and the two kidneys, and the fat that is upon them, and the right shoulder, for it is the ram of the oblation;", "tj": "", "tj_en": "", "rashi": "<b>החלב.<\/b> זֶה חֵלֶב הַדַּקִּים אוֹ הַקֵּבָה:<br><br><b>והאליה.<\/b> מִן הַכְּלָיוֹת וּלְמַטָּה, כְּמוֹ שֶׁמְּפֹרָשׁ בְּוַיִּקְרָא שֶׁנֶּ' (ויקרא ג'), לְעֻמַּת הֶעָצֶה יְסִירֶנָּה – מָקוֹם שֶׁהַכְּלָיוֹת יוֹעֲצוֹת (חולין י\"א), וּבְאֵמוּרֵי הַפָּר לֹא נֶאֱמַר אַלְיָה, שֶׁאֵין אַלְיָה קְרֵבָה אֶלָּא בְכֶבֶשׂ וְכִבְשָׂה וְאַיִל, אֲבָל שׁוֹר וְעֵז אֵין טְעוּנִין אַלְיָה:<br><br><b>ואת שוק הימין.<\/b> לֹא מָצִינוּ הַקְטָרָה בְשׁוֹק הַיָּמִין עִם הָאֵמוּרִים אֶלָּא זוֹ בִלְבָד:<br><br><b>כי איל מלאים הוא.<\/b> שְׁלָמִים; לְשׁוֹן שְׁלֵמוּת – שֶׁהֻשְׁלַם בַּכֹּל; מַגִּיד הַכָּתוּב שֶׁהַמִּלּוּאִים שְׁלָמִים, שֶׁמְּשִׂימִים שָׁלוֹם לַמִּזְבֵּחַ וּלְעוֹבֵד הָעֲבוֹדָה וְלַבְּעָלִים, לְכָךְ אֲנִי מַצְרִיכוֹ הֶחָזֶה, לִהְיוֹת לוֹ לְעוֹבֵד הָעֲבוֹדָה לְמָנָה, וְזֶהוּ מֹשֶׁה שֶׁשִּׁמֵּשׁ בַּמִּלּוּאִים, וְהַשְּׁאָר אָכְלוּ אַהֲרֹן וּבָנָיו שֶׁהֵם בְּעָלִים, כַּמְפֹרָשׁ בָּעִנְיָן:", "rashi_en": "החלב THE FAT — This means the fat of the gut, or, (according to the opinion of Rabbi Ishmael,) of the maw (Chullin 49b; cf. Rashi on Leviticus 3:3).<br><br>והאליה AND THE FAT TAIL — This is the portion of the animal from the kidneys and lower down, as is explained in Leviticus, (3:9) because it is said, “[the whole fat tail], he shall take it off hard by the back bone (עָצָה)” i. e. by the place where the kidneys give counsel (עָצָה) (Chullin 11a). In the case of the fat portions of the bullock the “fat tail” is not mentioned, for the “fat tail” was offered only in the case of a male or female lamb and a ram, but an ox and a goat do not require the “fat tail” to be offered.<br><br>ואת שוק הימין AND THE RIGHT SHOULDER — We do not find that burning if prescribed for the right shoulder together with the fat parts except in the case of this alone.<br><br>כי איל מלאים הוא FOR IT IS A RAM OF מלאים — of שלמים (usually translated peace-offerings): מלואים has the meaning of “perfection” (מלא meaning “full”, so that מלואים is synonymous with שלמים) — something that is perfect in all respects. Scripture informs us that the מלואים (consecration sacrifices) are to be regarded as שלמים-sacrifices, in that they, like the שלמים, promote peace (שלום) between the altar and him who carries out the sacrifical rite (the priest) and the owner of the animal (the worshipper who brings the sacrifice”). Therefore, says God, in this case I make it a condition that the breast shall belong as a portion to him who performs the sacrificial rite, viz., Moses, who officiated at the installation into office (cf. v. 26). — The remainder, Aaron and his sons ate because they were the “owners”, as is expressly set forth in this section (cf. Sifra, Vayikra Dibbura d'Nedavah, Chapter 16 2; Midrash Tanchuma, Tzav 4)."}, {"ch": 29, "v": 23, "aliyah": 5, "heb": "וְכִכַּ֨ר לֶ֜חֶם אַחַ֗ת וְֽחַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְרָקִ֣יק אֶחָ֑ד מִסַּל֙ הַמַּצּ֔וֹת אֲשֶׁ֖ר לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּפִתָּא דִלְחֵם חַד וּגְרִצְתָּא דִלְחֵם מְשַׁח חֲדָא וְאֶסְפּוֹג חַד מִסַּלָּא דְפַטִּירַיָּא דִּי קֳדָם יְיָ:", "onk_en": "[Take also] one bread-cake, and one loaf of oiled bread, and one wafer from the basket of unleavened bread that is before Adonoy.", "pj": "וַעֲגוֹל דִּלְחֵים חָד וּגְרֵיץ דִּלְחֵים פָּתִיךְ בִּמְשַׁח חַד וְעָרִיךְ חַד מִסַּלָא דְפַטִּירָא דִקְדָם יְיָ", "pj_en": "and one round of bread, and one cake of bread mingled with oil, and one wafer from the basket of unleavened bread which is before the Lord;", "tj": "", "tj_en": "", "rashi": "<b>וככר לחם.<\/b> מִן הַחַלּוֹת:<br><br><b>וחלת לחם שמן.<\/b> מִמִּין הָרְבוּכָה:<br><br><b>ורקיק.<\/b> מִן הָרְקִיקִין, אֶחָד מֵעֲשָׂרָה שֶׁבְּכָל מִין וָמִין. וְלֹא מָצִינוּ תְרוּמַת לֶחֶם הַבָּא עִם זֶבַח נִקְטֶרֶת אֶלָּא זוֹ בִּלְבַד, שֶׁתְּרוּמַת לַחְמֵי תוֹדָה וְאֵיל נָזִיר נְתוּנָה לַכֹּהֲנִים עִם חָזֶה וְשׁוֹק, וּמִזֶּה לֹא הָיָה לְמֹשֶׁה לְמָנָה אֶלָּא חָזֶה בִּלְבָד:", "rashi_en": "וככר לחם AND ONE LOAF OF BREAD — of the cakes (mentioned in Exodus 29:2) (Menachot 78a).<br><br>וחלת לחם שמן AND ONE PIERCED CAKE OF OILED BREAD — of the “saturated\" kind.<br><br>ורקיק AND ONE WAFER — of the wafers there mentioned: i. e. one out of the ten which were comprised in each of these different kinds of bread (Menachot 76a; cf. Rashi on Exodus 29:2). We do not find that any heave-offering of bread brought with a sacrifice was burnt except this alone, for the heave-offering of the bread brought with the thanksgiving offering and with the ram of the Nazarite was given to the priest (and therefore not burnt) together with the breast and the shoulder, whilst of this the breast alone was given as a portion to Moses, as the officiating priest."}, {"ch": 29, "v": 24, "aliyah": 5, "heb": "וְשַׂמְתָּ֣ הַכֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְעַ֖ל כַּפֵּ֣י בָנָ֑יו וְהֵנַפְתָּ֥ אֹתָ֛ם תְּנוּפָ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּתְשַׁוִּי כֹלָּא עַל יְדָא דְאַהֲרֹן וְעַל יְדָא דִבְנוֹהִי וּתְרִים יָתְהוֹן אֲרָמוּתָא קֳדָם יְיָ:", "onk_en": "Place all [these things] upon the [open] hands of Aharon, and upon the [open] hands of his sons, and you shall wave them for wave-offering before Adonoy.", "pj": "וּתְשַׁוֵּי כוֹלָא עַל יְדֵי אַהֲרן וְעַל יְדֵי בְנוֹי וְתָרִים יַתְהוֹן אֲרָמָא קֳדָם יְיָ", "pj_en": "and thou shalt put all upon the hands of Aharon and upon the hands of his sons, and shalt uplift them for an elevation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>על כפי אהרן: והנפת.<\/b> שְׁנֵיהֶם עֲסוּקִים בִּתְנוּפָה – הַבְּעָלִים וְהַכֹּהֵן, הָא כֵּיצַד? כֹּהֵן מַנִּיחַ יָדוֹ תַּחַת יַד הַבְּעָלִים וּמֵנִיף; וּבָזֶה הָיוּ אַהֲרֹן וּבָנָיו בְּעָלִים, וּמֹשֶׁה כֹּהֵן:<br><br><b>תנופה.<\/b> מוֹלִיךְ וּמֵבִיא לְמִי שֶׁאַרְבַּע רוּחוֹת הָעוֹלָם שֶׁלּוֹ; תְנוּפָה מְעַכֶּבֶת וּמְבַטֶּלֶת פֻּרְעָנֻיּוֹת וְרוּחוֹת רָעוֹת, מַעֲלֶה וּמוֹרִיד לְמִי שֶׁהַשָּׁמַיִם וְהָאָרֶץ שֶׁלּוֹ, וּמְעַכֶּבֶת טְלָלִים רָעִים (מנחות ס\"ב):", "rashi_en": "על כפי אהרן … והנפת [AND THOU SHALT PUT ALL] IN THE HANDS OF AARON … AND THOU SHALT WAVE THEM — The rule is that both of them take part in the waving ceremony, the “owner” and the priest. How is this done? The priest places his hand beneath the “owner’s” hand, and thus does the waving (Menachot 61b) — and in case of this offering Aaron and his sons were the “owners” and Moses the priest, and therefore Scripture enacts as stated here.<br><br>תנופה A WAVE OFFERING — He moved it about horizontally in all directions to the glory of Him to Whom belong the four quarters of the world. This waving was symbolical of preventing and making of none effect misfortune and destructive winds. Then he moved it upwards and downward to the glory of Him to Whom belong heaven and earth and this was symbolical of keeping away injurious dews (Menachot 62a)."}, {"ch": 29, "v": 25, "aliyah": 5, "heb": "וְלָקַחְתָּ֤ אֹתָם֙ מִיָּדָ֔ם וְהִקְטַרְתָּ֥ הַמִּזְבֵּ֖חָה עַל־הָעֹלָ֑ה לְרֵ֤יחַ נִיח֙וֹחַ֙ לִפְנֵ֣י יְהֹוָ֔ה אִשֶּׁ֥ה ה֖וּא לַיהֹוָֽה׃", "onk": "וְתִסַּב יָתְהוֹן מִידֵיהוֹן וְתַסֵּיק לְמַדְבְּחָא עַל עֲלָתָא <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ <b>קֻרְבָּנָא<\/b> הוּא קֳדָם יְיָ:", "onk_en": "Then take [these things] from their hands and burn them on the altar after the burnt-offering as a pleasing fragrance [<b>to be accepted with favor<\/b>] before Adonoy. It is a fire-offering to [<b>sacrifice before<\/b>] Adonoy.", "pj": "וְתִיסַב יַתְהוֹן מִידֵיהוֹן וּתְסַדֵּר בְּמַדְבְּחָא עַל עֲלָתָא לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ קוּרְבָּנָא הוּא קֳדָם יְיָ", "pj_en": "And thou shalt take them from their hands, and set them in order upon the altar upon the burnt offering, to be received with acceptance before the Lord: it is an oblation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>על העלה.<\/b> עַל הָאַיִל הָרִאשׁוֹן שֶׁהֶעֱלִיתָ עוֹלָה:<br><br><b>לריח ניחוח.<\/b> לְנַחַת רוּחַ לְמִי שֶׁאָמַר וְנַעֲשָׂה רְצוֹנוֹ:<br><br><b>אשה.<\/b> לְאֵשׁ נִתָּן:<br><br><b>לה'.<\/b> לִשְׁמוֹ שֶׁל מָקוֹם:", "rashi_en": "על העלה BESIDES THE BURNT OFFERING — besides the first ram which you had already offered up as a burnt offering.<br><br>לריח ניחוח AS A PLEASING ODOUR — as a gratification of spirit to Him Who gave the command and found that His will was carried out (cf. Sifra, Vayikra Dibbura d'Nedavah, Chapter 6 10).<br><br>אשה AN OFFERING MADE BY FIRE given over to the fire.<br><br>לה׳ TO THE LORD — to the Name of the Omnipresent."}, {"ch": 29, "v": 26, "aliyah": 5, "heb": "וְלָקַחְתָּ֣ אֶת־הֶֽחָזֶ֗ה מֵאֵ֤יל הַמִּלֻּאִים֙ אֲשֶׁ֣ר לְאַהֲרֹ֔ן וְהֵנַפְתָּ֥ אֹת֛וֹ תְּנוּפָ֖ה לִפְנֵ֣י יְהֹוָ֑ה וְהָיָ֥ה לְךָ֖ לְמָנָֽה׃", "onk": "וְתִסַּב יָת חֶדְיָא מִדְּכַר <b>קֻרְבָּנַיָּא<\/b> דִּי לְאַהֲרֹן וּתְרִים יָתֵיהּ אֲרָמוּתָא <b>קֳדָם<\/b> יְיָ וִיהֵי לָךְ לָחֳלָק:", "onk_en": "Take the breast from Aharon’s installation ram [<b>offering<\/b>] and wave it as wave-offering to [<b>before<\/b>] Adonoy. Then it shall be your [Moshe’s] portion.", "pj": "וְתִיסַב יַת חַדְיָא מִדְכַר קוּרְבָּנַיָא דִלְאַהֲרן וְתָרֵים יָתָהּ אֲרָמָא קֳדָם יְיָ וִיהֵי לָךְ לְחוּלָק", "pj_en": "And thou shalt take the breast of the ram of Aharon's oblation, and uplift it, an elevation before the Lord, and it shall be thy portion.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 29, "v": 27, "aliyah": 5, "heb": "וְקִדַּשְׁתָּ֞ אֵ֣ת&thinsp;<b>׀<\/b> חֲזֵ֣ה הַתְּנוּפָ֗ה וְאֵת֙ שׁ֣וֹק הַתְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַאֲשֶׁ֣ר הוּרָ֑ם מֵאֵיל֙ הַמִּלֻּאִ֔ים מֵאֲשֶׁ֥ר לְאַהֲרֹ֖ן וּמֵאֲשֶׁ֥ר לְבָנָֽיו׃", "onk": "וּתְקַדֵּשׁ יָת חֶדְיָא דַאֲרָמוּתָא וְיָת שׁוֹקָא דְאַפְרָשׁוּתָא דִּי אִתָּרַם וְדִי אִתַּפְרָשׁ מִדְּכַר <b>קֻרְבָּנַיָּא<\/b> מִדִּי לְאַהֲרֹן וּמִדִּי לִבְנוֹהִי:", "onk_en": "Sanctify the breast of the wave-offering, and the shoulder of the terumah-offering which were [the] waved and uplifted [parts] of the ram of the completion-offering [<b>offering<\/b>] [which was used to install] Aharon and his sons.", "pj": "וּתְקַדֵּשׁ יַת חַדְיָא דְאַרָמוּתָא וְיַת שׁוֹקָא דְאַפְרָשׁוּתָא דְאִיתְרַם וּדְאִיתְפָּרֵשׁ מִדְכַר קוּרְבָּנַיָא מִידֵי לְאַהֲרן וּמִידֵי לִבְנוֹהִי", "pj_en": "And thou shalt consecrate the breast of the elevation and the shoulder of the separation, which have been uplifted and separated from the ram of the oblation from the hand of Aharon and from the hand of his sons.", "tj": "", "tj_en": "", "rashi": "<b>וקדשת את חזה התנופה ואת שוק התרומה וגו'.<\/b> קַדְּשֵׁם לְדוֹרוֹת, לִהְיוֹת נוֹהֶגֶת תְּרוּמָתָם וַהֲנָפָתָם בְּחָזֶה וְשׁוֹק שֶׁל שְׁלָמִים, אֲבָל לֹא לְהַקְטָרָה, אֶלָּא וְהָיָה לְאַהֲרֹן וּלְבָנָיו לֶאֱכֹל:<br><br><b>תנופה.<\/b> לְשׁוֹן הוֹלָכָה וַהֲבָאָה, ונטלי\"ה בְּלַעַז:<br><br><b>הורם.<\/b> לְשׁוֹן מַעֲלֶה וּמוֹרִיד:", "rashi_en": "וקדשת את חזה התנופה ואת שוק התרומה וגו׳ AND THOU SHALT SANCTIFY THE BREAST OF THE WAVE OFFERING AND THE SHOULDER OF THE HEAVE OFFERING etc. — Declare these portions of the animal to have a sacred character for future generations in that the heaving of them and the waving of them shall be practised in respect of the breast and the shoulder of all peace-offerings, but the similarity between the שלמים and the מלואים shall not extend to burning the shoulder as was done in the case of the מלואים but (v. 28) “it shall be for Aaron and his sons” to be eaten.<br><br>הונף WHICH IS WAVED — an expression for moving to and fro in a horizontal direction; venteler in old French<br><br>הורם WHICH WAS HEAVED — an expression for moving up and down."}, {"ch": 29, "v": 28, "aliyah": 5, "heb": "וְהָיָה֩ לְאַהֲרֹ֨ן וּלְבָנָ֜יו לְחׇק־עוֹלָ֗ם מֵאֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּתְרוּמָ֞ה יִהְיֶ֨ה מֵאֵ֤ת בְּנֵֽי־יִשְׂרָאֵל֙ מִזִּבְחֵ֣י שַׁלְמֵיהֶ֔ם תְּרוּמָתָ֖ם לַיהֹוָֽה׃", "onk": "וִיהֵי לְאַהֲרֹן וְלִבְנוֹהִי לִקְיָם עָלָם מִן בְּנֵי יִשְׂרָאֵל אֲרֵי אַפְרָשׁוּתָא הוּא וְאַפְרָשׁוּתָא יְהֵי מִן בְּנֵי יִשְׂרָאֵל מִנִּכְסַת קוּדְשֵׁיהוֹן אַפְרָשׁוּתְהוֹן <b>קֳדָם<\/b> יְיָ:", "onk_en": "It [the breast and shoulder] shall be for Aharon and his sons’ by statute for ever. [This portion is taken] from the B’nei Yisrael for it is a terumah-offering. It shall be a terumah-offering from the B’nei Yisrael taken from their peace-offerings. It is their terumah-offering to [<b>before<\/b>] Adonoy.", "pj": "וִיהֵי לְאַהֲרן וְלִבְנוֹי לִקְיַים עֲלָם מִן בְּנֵי יִשְרָאֵל אֲרֵי אַפְרָשׁוּתָא הוּא וְאַפְרְשׁוּתָא יְהֵי מִן בְּנֵי יִשְרָאֵל מִנִּכְסַת קוּדְשֵׁיהוֹן אַפְרָשׁוּתְהוֹן קֳדָם יְיָ", "pj_en": "And it shall be for Aharon and for his sons by a perpetual statute for the sons of Israel; because it is a separation, and a separation it shall be from the sons of Israel from the offerings of their consecration, their separation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לחק עולם מאת בני ישראל.<\/b> שֶׁהַשְּׁלָמִים לַבְּעָלִים, וְאֶת הֶחָזֶה וְאֶת הַשּׁוֹק יִתְּנוּ לַכֹּהֵן:<br><br><b>כי תרומה הוא.<\/b> הֶחָזֶה וְשׁוֹק הַזֶּה:", "rashi_en": "לחק עולם מאת בני ישראל AS AN ASSIGNED PORTION FROM THE CHILDREN OF ISRAEL — because peace-offerings belong to the “owner”, and the breast and the shoulder shall they give to the priest.<br><br>כי תרומה הוא FOR IT IS A HEAVE OFFERING — i.e. the breast and the shoulder form a heave-offering."}, {"ch": 29, "v": 29, "aliyah": 5, "heb": "וּבִגְדֵ֤י הַקֹּ֙דֶשׁ֙ אֲשֶׁ֣ר לְאַהֲרֹ֔ן יִהְי֥וּ לְבָנָ֖יו אַחֲרָ֑יו לְמׇשְׁחָ֣ה בָהֶ֔ם וּלְמַלֵּא־בָ֖ם אֶת־יָדָֽם׃", "onk": "וּלְבוּשֵׁי קוּדְשָׁא דִּי לְאַהֲרֹן יְהוֹן לִבְנוֹהִי בַּתְרוֹהִי לְדַכָּאָה בְהוֹן <b>וּלְקָרָבָא בְהוֹן יָת קֻרְבָּנְהוֹן<\/b>:", "onk_en": "Aharon’s sacred garments shall be his son’s after him, to be uplifted through them and to be installed [<b>offer their sacrifices<\/b>] through them.", "pj": "וּלְבוּשֵׁי קוּדְשָׁא דִלְאַהֲרן יְהוֹן לִבְנוֹי בַּתְרוֹי לְרַבָּאָה בְּהוֹן וּלְקָרָבָא בְּהוֹן יַת קוּרְבָּנֵיהוֹן", "pj_en": "And the holy vestments of Aharon shall be to his sons after him, to be anointed in them, and in them to offer their oblations.", "tj": "", "tj_en": "", "rashi": "<b>לבניו אחריו.<\/b> לְמִי שֶׁבָּא בִּגְדֻלָּה אַחֲרָיו:<br><br><b>למשחה.<\/b> לְהִתְגַדֵּל בָּהֶם, שֶׁיֵּשׁ מְשִׁיחָה שֶׁהִיא לְשׁוֹן שְׂרָרָה, כְּמוֹ לְךָ נְתַתִּים לְמָשְׁחָה (במדבר י\"ח), אַל תִּגְּעוּ בִּמְשִׁיחָי (דהי\"א טז):<br><br><b>ולמלא בם את ידם.<\/b> עַל יְדֵי הַבְּגָדִים הוּא מִתְלַבֵּשׁ בִּכְהֻנָּה גְדוֹלָה:", "rashi_en": "לבניו אחריו [SHALL BE] FOR HIS SONS AFTER HIM — for him who comes after him in this high office.<br><br>למשחה means to be raised to dignity by means of them. For sometimes the word משח is used in the sense of “dignity”, as in (Numbers 18:8), “to thee I have given them as a dignity (למשחה)”, and (I Chronicles 16:22) “Touch ye not my nobles (משיחי)” (cf. Rashi on Exodus 30:29).<br><br>ולמלא בם את ידם AND TO BE CONSECRATED BY THEM — through these garments he is to be invested with the high-priesthood (cf. Rashi on Yoma 73a)."}, {"ch": 29, "v": 30, "aliyah": 5, "heb": "שִׁבְעַ֣ת יָמִ֗ים יִלְבָּשָׁ֧ם הַכֹּהֵ֛ן תַּחְתָּ֖יו מִבָּנָ֑יו אֲשֶׁ֥ר יָבֹ֛א אֶל־אֹ֥הֶל מוֹעֵ֖ד לְשָׁרֵ֥ת בַּקֹּֽדֶשׁ׃", "onk": "שִׁבְעַת יוֹמִין יַלְבֵּשִׁנּוּן כַּהֲנָא תְּחוֹתוֹהִי מִבְּנוֹהִי דִּי יֵעוֹל לְמַשְׁכַּן זִמְנָא לְשַׁמָּשָׁא בְקוּדְשָׁא:", "onk_en": "Seven [consecutive] days shall they be worn by he who serves in his place—one of his sons—who will come into the Tent of Meeting to serve in the Holy [Sanctuary].", "pj": "שׁוּבְעָא יוֹמִין יַלְבְּשִׁינוּן כַּהֲנָא דִיקוּם בַּתְרוֹי מִן בְּנוֹי וְלָא מִן לֵיוָאֵי בִּזְמַן דִּיעוֹלִין לְמַשְׁכַּן זִימְנָא לְשַׁמָּשָׁא בְּקוּדְשָׁא", "pj_en": "Seven days shall the priest wear them, who ariseth after him from his sons, but not from the Levites, at the time when he entereth into the tabernacle of ordinance to minister in the sanctuary.", "tj": "", "tj_en": "", "rashi": "<b>שבעת ימים.<\/b> רְצוּפִין:<br><br><b>ילבשם הכהן.<\/b> אֲשֶׁר יָקוּם מִבָּנָיו תַּחְתָּיו לִכְהֻנָּה גְדוֹלָה, כְּשֶׁיְּמַנּוּהוּ לִהְיוֹת כֹּהֵן גָּדוֹל:<br><br><b>אשר יבא אל אהל מועד.<\/b> אוֹתוֹ כֹהֵן הַמּוּכָן לִכָּנֵס לִפְנַי וְלִפְנִים בְּיוֹם הַכִּפּוּרִים, וְזֶהוּ כֹהֵן גָּדוֹל, שֶׁאֵין עֲבוֹדַת יוֹם הַכִּפּוּרִים כְּשֵׁרָה אֶלָּא בּוֹ:<br><br><b>תחתיו מבניו.<\/b> מְלַמֵּד שֶׁאִם יֵשׁ לוֹ לְכֹהֵן גָּדוֹל בֵּן מְמַלֵּא אֶת מְקוֹמוֹ, יְמַנּוּהוּ כֹהֵן גָּדוֹל תַּחְתָּיו:<br><br>(<b>הכהן תחתיו מבניו.<\/b> מִכָּאן רְאָיָה כָּל לְשׁוֹן כֹהֵן פוֹעֵל עוֹבֵד מַמָּשׁ, לְפִיכָךְ נִגּוּן תְּבִיר נִמְשָׁךְ לְפָנָיו):", "rashi_en": "שבעת ימים SEVEN DAYS in succession, on such a High Priest’s installation,<br><br>ילבשם הכהן THE PRIEST SHALL PUT THEM ON — i. e. he who, from among his sons, will rise up in his stead in the high-priesthood at the time when they will appoint him to be High Priest.<br><br>אשר יבא אל אהל מועד WHO WILL COME INTO THE APPOINTED TENT — These words qualify the word הכהן so that it refers to that priest who is designated to enter into the innermost part (the words לפני ולפנים in the Rashi text correspond to בקדש in the Biblical text) of the Sanctuary on the Day of Atonement — and this must mean the High Priest, since the sacrificial service on the Day of Atonement was not valid unless performed by him (Yoma 73a).<br><br>תחתיו מבניו IN HIS STEAD FROM AMONG HIS SONS — This informs us that if the High Priest has a son who can fill his place they shall appoint him High Priest in his stead (Sifra, Acharei Mot, Chapter 8 5; cf. Rashi on Yoma 72b).<br><br>[הכהן תחתיו מבניו — From here (from this phraseology) we have a proof that the word הכהן is everywhere a participle — meaning “he who is actually acting as the officiant”; therefore the tonic accent תביר on the word הכהן connects it with the word following it.]."}, {"ch": 29, "v": 31, "aliyah": 5, "heb": "וְאֵ֛ת אֵ֥יל הַמִּלֻּאִ֖ים תִּקָּ֑ח וּבִשַּׁלְתָּ֥ אֶת־בְּשָׂר֖וֹ בְּמָקֹ֥ם קָדֹֽשׁ׃", "onk": "וְיָת דְּכַר <b>קֻרְבָּנַיָּא<\/b> תִּסָּב וּתְבַשֵּׁל יָת בִּסְרֵיהּ בַּאֲתַר קַדִּישׁ:", "onk_en": "Take the [remainder of the] ram of the completion-offering [<b>offering<\/b>] and cook its flesh in a sacred place.", "pj": "וְיַת דְּכַר קוּרְבָּנַיָא תִיסַב וּתְבַשֵּׁל יַת בִּשְרֵיהּ בְּאָתַר קַדִּישׁ", "pj_en": "And thou shalt take the ram of the oblation, and boil its flesh in the holy place;", "tj": "", "tj_en": "", "rashi": "<b>במקם קדש.<\/b> בַּחֲצַר אֹהֶל מוֹעֵד, שֶׁהַשְּׁלָמִים הַלָּלוּ קָדְשֵׁי קָדָשִׁים הָיוּ:", "rashi_en": "במקום קדש IN A HOLY PLACE in the court of the tent of meeting because these peace-offerings were holy in the highest degree (cf. Rashi on Leviticus 6:9)."}, {"ch": 29, "v": 32, "aliyah": 5, "heb": "וְאָכַ֨ל אַהֲרֹ֤ן וּבָנָיו֙ אֶת־בְּשַׂ֣ר הָאַ֔יִל וְאֶת־הַלֶּ֖חֶם אֲשֶׁ֣ר בַּסָּ֑ל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיֵכוּל אַהֲרֹן וּבְנוֹהִי יָת בְּסַר דִּכְרָא וְיָת לַחְמָא דִּי בְסַלָּא לִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "Aharon and his sons shall eat the ram’s meat, along with the bread that is in the basket, at the entrance of the Tent of Meeting.", "pj": "וְיֵיכוֹל אַהֲרן וּבְנוֹי יַת בִּישְרָא דְדִיכְרָא וְיַת לַחֲמָא דִי בְסַלָא בִּתְרַע מַשְׁכַּן זִימְנָא", "pj_en": "and Aharon and his sons shall eat the flesh of the ram, and the bread that is in the basket at the door of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>פתח אהל מועד.<\/b> כָּל הֶחָצֵר קָרוּי כֵּן:", "rashi_en": "פתח אהל מועד BY THE ENTRANCE OF THE APPOINTED TENT — the whole court is thus named (cf. Rashi on Exodus 29:11)."}, {"ch": 29, "v": 33, "aliyah": 5, "heb": "וְאָכְל֤וּ אֹתָם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּהֶ֔ם לְמַלֵּ֥א אֶת־יָדָ֖ם לְקַדֵּ֣שׁ אֹתָ֑ם וְזָ֥ר לֹא־יֹאכַ֖ל כִּי־קֹ֥דֶשׁ הֵֽם׃", "onk": "וְיֵיכְלוּן יָתְהוֹן דִּי יִתְכַּפַּר בְּהוֹן <b>לְקָרָבָא יָת קֻרְבָּנְהוֹן<\/b> לְקַדָּשָׁא יָתְהוֹן וְחִלּוֹנַי לָא יֵיכוּל אֲרֵי קוּדְשָׁא אִנּוּן:", "onk_en": "They are to eat those things through which atonement was achieved, to install them [<b>offer their sacrifices<\/b>] and [thereby] to sanctify them. A stranger [a non-kohein] may not eat thereof for they are sacred.", "pj": "וְיֵיכְלוּן יַתְהוֹן דְּאִתְכַּפֵּר בְּהוֹן לְקָרְבָא יַת קוּרְבַּנְהוֹן לְמַקְדְּשָׁא יַתְהוֹן לְשַׁמָּשָׁא קֳדָמַי וְחִילוֹנֵי לָא יֵיכוּל אֲרוּם קוּדְשָׁא הִינוּן", "pj_en": "And they shall eat those things by which atonemen, was made for them in offering their oblations to sanctify them to minister before Me: but the profane shall not eat; for they are holy.", "tj": "", "tj_en": "", "rashi": "<b>ואכלו אתם.<\/b> אַהֲרֹן וּבָנָיו, לְפִי שֶׁהֵם בַּעֲלֵיהֶם:<br><br><b>אשר כפר בהם.<\/b> כָּל זָרוּת וְתִעוּב:<br><br><b>למלא את ידם.<\/b> בְּאַיִל וְלֶחֶם הַלָּלוּ:<br><br><b>לקדש אתם.<\/b> שֶׁעַל יְדֵי הַמִּלּוּאִים הַלָּלוּ נִתְמַלְּאוּ יְדֵיהֶם וְנִתְקַדְּשׁוּ לִכְהֻנָּה:<br><br><b>כי קדש הם.<\/b> קָדְשֵׁי קָדָשִׁים; וּמִכָּאן לָמַדְנוּ אַזְהָרָה לְזָר הָאוֹכֵל קָדְשֵׁי קָדָשִׁים, שֶׁנָּתַן הַמִּקְרָא טַעַם לַדָּבָר מִשּׁוּם דְּקֹדֶשׁ הֵם (פסח' כ\"ד):", "rashi_en": "ואכלו אתם AND THEY SHALL EAT THOSE THINGS i. e. Aaron and his sons because they are the “owners” of them (cf. Pesachim 59b).<br><br>אשד כפר בהם THROUGH WHOM THERE WAS EXPIATED everything that was strange and objectionable.<br><br>למלא את ידם TO INITIATE THEM INTO OFFICE by means of this ram and bread.<br><br>לקדש אתם TO SANCTIFY THEM — for by means of this initiation-sacrifice they were installed and sanctified to the priesthood.<br><br>כי קדש הם BECAUSE THEY ARE HOLY — i. e. holy in the highest degree. From this we derive the prohibition against a “stranger” (a non-priest) eating anything that is holy in the highest degree (Makkot 18b), since Scripture assigns a reason for the matter (why a stranger may not eat of these), viz., because they are holy in the highest degree (cf. Pesachim 24a)."}, {"ch": 29, "v": 34, "aliyah": 5, "heb": "וְֽאִם־יִוָּתֵ֞ר מִבְּשַׂ֧ר הַמִּלֻּאִ֛ים וּמִן־הַלֶּ֖חֶם עַד־הַבֹּ֑קֶר וְשָׂרַפְתָּ֤ אֶת־הַנּוֹתָר֙ בָּאֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי־קֹ֥דֶשׁ הֽוּא׃", "onk": "וְאִם יִשְׁתָּאַר מִבְּסַר <b>קֻרְבָּנַיָּא<\/b> וּמִן לַחְמָא עַד צַפְרָא וְתוֹקִיד יָת דְּאִשְׁתָּאַר בְּנוּרָא לָא יִתְאֲכֵל אֲרֵי קוּדְשָׁא הוּא:", "onk_en": "If any meat of the installation-offering [<b>offering<\/b>] is left over or if any of the bread [is left over] until morning, you must burn the leftovers in fire. It must not be eaten for it is sacred.", "pj": "וְאִין יִשְׁתְּיַיר מִבְּשַר קוּרְבָּנַיָא וּמִן לַחְמָא עַד צַפְרָא וְתוֹקֵיד יַת דְּמִשְׁתְּיַיר בְּנוּרָא לָא יִתְאָכֵיל אֲרוּם קוּדְשָׁא הוּא", "pj_en": "And if any of the flesh of the oblation and of the bread remain until t
