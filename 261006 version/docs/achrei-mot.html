ughter their sacrifices to the demons after which they go astray. This shall be an everlasting statute for them, for their descendants.", "pj": "וְלָא יְדַבְּחוּן תּוּב יַת דִיבְחֵיהוֹן לְטַעֲוָון דִמְתִילִין לְשֵׁידִין דְהִינוּן טָעַן בַּתְרֵיהוֹן קְיַים עֲלָם תְּהֵי דָא לְהוֹן לְדָרֵיהוֹן", "pj_en": "Neither shall they offer any more their sacrifices unto idols which are like unto demons, after which they have wandered. This shall be an everlasting statute to them, unto their generations.", "tj": "", "tj_en": "", "rashi": "<b>לשעירם.<\/b> לַשֵּׁדִים, כְּמוֹ וּשְֹעִירִים יְרַקְּדוּ שָׁם (ישעיהו י\"ג):", "rashi_en": "לשעירים .means TO THE DEMONS. Similar is (Isaiah 13:21) “and demons (ושעירים) shall dance there\" (Sifra, Acharei Mot, Chapter 9 8)."}, {"ch": 17, "v": 8, "aliyah": 5, "heb": "וַאֲלֵהֶ֣ם תֹּאמַ֔ר אִ֥ישׁ אִישׁ֙ מִבֵּ֣ית יִשְׂרָאֵ֔ל וּמִן־הַגֵּ֖ר אֲשֶׁר־יָג֣וּר בְּתוֹכָ֑ם אֲשֶׁר־יַעֲלֶ֥ה עֹלָ֖ה אוֹ־זָֽבַח׃", "onk": "וּלְהוֹן תֵּימַר גְּבַר גְּבַר מִבֵּית יִשְׂרָאֵל וּמִן גִּיּוֹרָא <b>דְּיִתְגַּיְּרוּן<\/b> בֵּינֵיכוֹן דִּי יַסֵּק עֲלָתָא אוֹ נִכְסַת <b>קוּדְשַׁיָּא<\/b>:", "onk_en": "To them you shall say: each and every person of the House of Israel and from the proselyte who will reside [<b>convert<\/b>] among them, who will bring a burnt-offering or sacrifice [<b>sacred-offering<\/b>],", "pj": "וּלְהוֹן תֵּימַר גְבַר טְלֵי וּגְבַר סִיב מִבֵּית גְנִיסַת יִשְרָאֵל וּמִן גִיוֹרָא דְיִתְגַיְירוּן לְמֵיתָב בֵּינֵיהוֹן דִי יַסִיק עֲלָתָא אוֹ נִכְסַת קוּדְשַׁיָא", "pj_en": "And thou shalt tell them: A man, whether young or old, of the house of Israel, or of the strangers who sojourn among you, who shall sacrifice a burnt offering, or consecrated oblation,", "tj": "", "tj_en": "", "rashi": "<b>אשר יעלה עלה.<\/b> לְחַיֵּב עַל הַמַּקְטִיר אֵבָרִים בַּחוּץ כְּשׁוֹחֵט בַּחוּץ, שֶׁאִם שָׁחַט אֶחָד וְהֶעֱלָה חֲבֵרוֹ שְׁנֵיהֶם חַיָּבִין (זבחים ק\"ו):", "rashi_en": "אשר יעלה עלה [WHOSOEVER MAN THERE BE ….] THAT OFFERETH (lit., bringeth up) A BURNT OFFERING — This is intended to declare one who burns the limbs of sacrifices outside the fore-court to be liable to the penalty of excision just the same as him who slaughtered a sacrifice outside the fore-court; so that if one person slaughtered a sacrifice outside the fore-court and another brought it up on the altar to burn it both are liable to excision (cf. Sifra, Acharei Mot, Chapter 10 6; Zevachim 106a)."}, {"ch": 17, "v": 9, "aliyah": 5, "heb": "וְאֶל־פֶּ֜תַח אֹ֤הֶל מוֹעֵד֙ לֹ֣א יְבִיאֶ֔נּוּ לַעֲשׂ֥וֹת אֹת֖וֹ לַיהֹוָ֑ה וְנִכְרַ֛ת הָאִ֥ישׁ הַה֖וּא מֵעַמָּֽיו׃", "onk": "וְלִתְרַע מַשְׁכַּן זִמְנָא לָא אַיְתִנֵּיהּ לְמֶעְבַּד יָתֵיהּ <b>קֳדָם<\/b> יְיָ וְיִשְׁתֵּיצֵי אֲנָשָׁא הַהוּא מֵעַמֵּיהּ:", "onk_en": "and to the entrance of the Tent of Meeting he does not bring it, that it be offered to [<b>before<\/b>] Adonoy; that person shall be cut off from his people.", "pj": "וְלִתְרַע מַשְׁכַּן זִמְנָא לָא יַיְתִינֵיהּ לְמֶעֱבַד יָתֵיהּ קוּרְבָּנָא קֳדָם יְיָ וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא מֵעַמֵיהּ", "pj_en": "and bring it not to the door of the tabernacle of ordinance, to be made an oblation before the Lord, that man shall be destroyed from his people.", "tj": "", "tj_en": "", "rashi": "<b>ונכרת.<\/b> זַרְעוֹ נִכְרָת וְיָמָיו נִכְרָתִין:", "rashi_en": "ונכרת [THAT MAN] SHALL BE CUT OFF — his offspring are cut off (die out) and his own life-time (lit., his days) is shortened (cf. Rashi and Tos. Shabbat 25a; Tos. Yevamot 2a)."}, {"ch": 17, "v": 10, "aliyah": 5, "heb": "וְאִ֨ישׁ אִ֜ישׁ מִבֵּ֣ית יִשְׂרָאֵ֗ל וּמִן־הַגֵּר֙ הַגָּ֣ר בְּתוֹכָ֔ם אֲשֶׁ֥ר יֹאכַ֖ל כׇּל־דָּ֑ם וְנָתַתִּ֣י פָנַ֗י בַּנֶּ֙פֶשׁ֙ הָאֹכֶ֣לֶת אֶת־הַדָּ֔ם וְהִכְרַתִּ֥י אֹתָ֖הּ מִקֶּ֥רֶב עַמָּֽהּ׃", "onk": "וּגְבַר גְּבַר מִבֵּית יִשְׂרָאֵל וּמִן גִּיּוֹרָא <b>דְּיִתְגַּיְּרוּן<\/b> בֵּינֵיכוֹן דִּי יֵיכוּל כָּל דְּמָא וְאֶתֵּן רוּגְזִי <b>בַּאֲנָשָׁא<\/b> דְּיֵכוּל יָת דְּמָא וֶאֱשֵׁיצֵי יָתֵיהּ מִגּוֹ עַמֵּיהּ:", "onk_en": "Each and every person of the House of Israel and from the proselyte who resides [<b>converts<\/b>] among them who will eat any blood; I shall direct my anger on the soul of him [<b>person<\/b>] who eats the blood and I will cut it off from among its people.", "pj": "וּגְבַר טְלֵי וּגְבַר סִיב מִבֵּית גְנִיסַת יִשְרָאֵל וּמִן גִיוֹרָא דְמִתְגַיְירוּן לְמֵיתַב בֵּינֵיהוֹן דִי יֵיכוּל כָּל אַדְמָא וְאֶתֵּן יַת פְּנוּיָיתָא לְמֶעֱסוֹק בְּבַר נְשָׁא הַהוּא דִי יֵיכוּל כָּל אַדְמָא וְאֵישֵׁיצֵי יָתֵיהּ מִגוֹ עַמֵיהּ", "pj_en": "A man also, whether young or old, of the house of the family of Israel, or of the strangers who sojourn, in dwelling among them, who shall eat any blood, I will cause employment to turn away (or cease) from that man who eateth any blood, and will destroy him from among his people.", "tj": "", "tj_en": "", "rashi": "<b>כל דם.<\/b> לְפִי שֶׁנֶּאֱמַר \"בַּנֶּפֶשׁ יְכַפֵּר\", יָכוֹל לֹא יְהֵא חַיָּב אֶלָּא עַל דַּם הַמֻּקְדָּשִׁים, תַּ\"ל \"כָּל דָּם\":<br><br><b>ונתתי פני.<\/b> פְּנַאי שֶׁלִּי — פּוֹנֶה אֲנִי מִכָּל עֲסָקַי וְעוֹסֵק בּוֹ (ספרא):", "rashi_en": "כל דם [WHATSOEVER MAN THERE BE … THAT EATETH] ANY BLOOD — Since Scripture states (v. 11) “[for it is the blood] with the life that maketh expiation\", I might think that one is liable only for eating the blood of consecrated animals, (i. e. sacrifices), for it is only the blood of such animals that makes expiation. Scripture therefore states here “[Whatsoever man there be … that eateth] any blood [I will cut him off from among his people]\" (Sifra, Acharei Mot, Section 7 3).<br><br>ונתתי פני I WILL SET פני [AGAINST THAT SOUL] — ‎פני is taken to mean as much as פנאי שלי My leisure — i.e. I will turn away (פונה) from all My affairs and concern Myself only with him (Sifra, Acharei Mot, Section 7 4; cf. also Targum Jonathan)"}, {"ch": 17, "v": 11, "aliyah": 5, "heb": "כִּ֣י נֶ֣פֶשׁ הַבָּשָׂר֮ בַּדָּ֣ם הִוא֒ וַאֲנִ֞י נְתַתִּ֤יו לָכֶם֙ עַל־הַמִּזְבֵּ֔חַ לְכַפֵּ֖ר עַל־נַפְשֹׁתֵיכֶ֑ם כִּֽי־הַדָּ֥ם ה֖וּא בַּנֶּ֥פֶשׁ יְכַפֵּֽר׃", "onk": "אֲרֵי נְפַשׁ בִּסְרָא בִּדְמָא הִיא וַאֲנָא יְהָבִתֵּיהּ לְכוֹן עַל מַדְבְּחָא לְכַפָּרָא עַל נַפְשָׁתֵיכוֹן אֲרֵי דְמָא הוּא עַל נַפְשָׁא מְכַפֵּר:", "onk_en": "For [the] soul of the body is in the blood and I have given it to you [to be placed] on the altar to achieve atonement for your souls, for it is the blood that will achieve atonement for the soul.", "pj": "אֲרוּם קִיוּם נְפָשׁ כָּל בִּישְרָא בְּאַדְמָא הוּא וַאֲנָא יְהַבְתִּיהָ לְכוֹן לִגְזֵירָתָא דְתִיתְּנוּן אֲדַם נִיכְסָא עַל מַדְבְּחָא מְטוֹל לִמְכַפְּרָא אֲדַם עַל נַפְשַׁתְכוֹן אֲרוּם אֲדַם נִיכְסָא הוּא עַל חוֹבֵי נַפְשָׁא מְכַפֵּר", "pj_en": "Because the subsistence of the life of all flesh is in the blood, and I have given it to you for a decree, that you shall bring the blood of the victim unto the altar to make atonement for the blood of your lives, because the blood of the victim is to atone for the guilt of the soul.", "tj": "", "tj_en": "", "rashi": "<b>כי נפש הבשר.<\/b> שֶׁל כָּל בְּרִיָּה בַּדָּם הִיא תְלוּיָה, וּלְפִיכָךְ נְתַתִּיו (עַל הַמִּזְבֵּחַ) לְכַפֵּר עַל נֶפֶשׁ הָאָדָם — תָּבֹא נֶפֶשׁ וּתְכַפֵּר עַל הַנֶּפֶשׁ:", "rashi_en": "כי נפש הבשר FOR THE LIFE OF THE FLESH of every creature, not only of animals brought as sacrifices, is dependent on its blood (בדם היא), and it is for this reason that I have placed it [on the altar] to make expiation for the life of man: let life come and expiate for life!"}, {"ch": 17, "v": 12, "aliyah": 5, "heb": "עַל־כֵּ֤ן אָמַ֙רְתִּי֙ לִבְנֵ֣י יִשְׂרָאֵ֔ל כׇּל־נֶ֥פֶשׁ מִכֶּ֖ם לֹא־תֹ֣אכַל דָּ֑ם וְהַגֵּ֛ר הַגָּ֥ר בְּתוֹכְכֶ֖ם לֹא־יֹ֥אכַל דָּֽם׃", "onk": "עַל כֵּן אֲמָרִית לִבְנֵי יִשְׂרָאֵל כָּל <b>אֱנַשׁ<\/b> מִנְּכוֹן לָא יֵיכוּל דְּמָא וְגִיּוֹרָא <b>דְּיִתְגַּיְּרוּן<\/b> בֵּינֵיכוֹן לָא יֵיכוּל דְּמָא:", "onk_en": "Therefore, I have said to Bnei Yisroel: Every soul [<b>person<\/b>] among you shall not eat blood. The proselyte residing [<b>that converts<\/b>] among you shall not eat blood.", "pj": "בְּגִין כֵּן אֲמָרִית לִבְנֵי יִשְרָאֵל אִיזְדַהֲרוֹן דְכָל בַּר נַשׁ מִנְכוֹן לָא יֵיכוֹל אַדְמָא וְגִיוֹרַיָא דְמִתְגַיְירוּן לְמֵיתַב בֵּינֵיכוֹן לָא יֵיכְלוּן אַדְמָא", "pj_en": "Therefore have I said to the sons of Israel, Beware lest any man among you eat the blood. Neither shall the strangers who sojourn by dwelling among you eat the blood.", "tj": "", "tj_en": "", "rashi": "<b>כל נפש מכם.<\/b> לְהַזְהִיר גְּדוֹלִים עַל הַקְּטַנִּים:", "rashi_en": "כל נפש מכם NO SOUL OF YOU [SHALL EAT BLOOD] — This is stated in addition to v. 10 to admonish the adults about their young children (that they should not permit them blood to eat — for “no soul” shall eat blood) (Sifra, Acharei Mot, Section 7 6; Yevamot 114a)."}, {"ch": 17, "v": 13, "aliyah": 5, "heb": "וְאִ֨ישׁ אִ֜ישׁ מִבְּנֵ֣י יִשְׂרָאֵ֗ל וּמִן־הַגֵּר֙ הַגָּ֣ר בְּתוֹכָ֔ם אֲשֶׁ֨ר יָצ֜וּד צֵ֥יד חַיָּ֛ה אוֹ־ע֖וֹף אֲשֶׁ֣ר יֵאָכֵ֑ל וְשָׁפַךְ֙ אֶת־דָּמ֔וֹ וְכִסָּ֖הוּ בֶּעָפָֽר׃", "onk": "וּגְבַר גְּבַר מִן בְּנֵי יִשְׂרָאֵל וּמִין גִּיּוֹרָא <b>דְּיִתְגַּיְּרוּן<\/b> בֵּינֵיכוֹן דִּי יְצוּד צֵידָא חַיְתָא אוֹ עוֹפָא דִּי מִתְאֲכֵל וְיֵישׁוֹד יָת דְּמֵיהּ וִיכַסִּנֵּיהּ בְּעַפְרָא:", "onk_en": "Each and every person of the House of Israel and from the proselyte residing [<b>that converts<\/b>] among them who will ensnare [the catch] any wild animal or fowl that is permitted to be eaten, he shall spill its blood and cover it with earth.", "pj": "וּגְבַר טְלֵי אוֹ גְבַר סִיב מִבֵּית גְנִיסַת יִשְרָאֵל וּמִן גִיוֹרַיָא דְיִתְגַיְירוּן לְמֵיתַב בֵּינֵיהוֹן דִי יְצַד צֵידָא חַיְיתָא אוֹ עוֹפָא דְמִיכַשְׁרִין לְמֵיכַל וְיֵישׁוֹד יַת אַדְמֵיהּ בְּנִיכְסָתָא וְאִין לָא מִתְקַלְקְלָא נִיכְסַתֵּיהּ יְכַסִינֵיהּ בְּעַפְרָא", "pj_en": "And any man, whether young or old, of the house of the stock of Israel, or of the sojourners who sojourn by dwelling among you, who hunteth venison of beast or fowl proper to be eaten, shall pour out its blood when it is killed; and if what he hath killed be not destroyed (or strangled?), let the blood be covered with dust.", "tj": "", "tj_en": "", "rashi": "<b>אשר יצוד.<\/b> אֵין לִי אֶלָּא צַיִד, אֲוָזִין וְתַרְנְגוֹלִין מִנַּיִן? תַּ\"ל \"צֵיד\" מִכָּל מָקוֹם; אִם כֵּן לָמָּה נֶאֱמַר \"אֲשֶׁר יָצוּד\"? שֶׁלֹּא יֹאכַל בָּשָׂר אֶלָּא בַּהַזְמָנָה הַזֹּאת (חולין פ\"ד):<br><br><b>אשר יאכל.<\/b> פְּרָט לִטְמֵאִים (שם פ\"ה):", "rashi_en": "אשר יצוד WHO HUNTETH — I seem to have here only the law that the blood of hunted beasts and fowls caught now by hunting must be covered with dust. Whence do I know that this applies also to geese and fowls which have been kept in the house having already been caught? Scripture therefore states יצוד] ציד], “who hunts a hunted thing\"— hunted under any circumstances whether now or before. If this be so why does Scripture at all state אשר יצוד (let it merely state 'אשר ישחט וכו‎)? But it uses the term “hunting” to teach that one should not eat meat except after such toilsome preparation (Sifra, Acharei Mot, Chapter 11 2; Chullin 84a).<br><br>אשר יאכל THAT MAY BE EATEN — This is especially mentioned to the exclusion of unclean animals (Sifra, Acharei Mot, Chapter 11 4)."}, {"ch": 17, "v": 14, "aliyah": 5, "heb": "כִּֽי־נֶ֣פֶשׁ כׇּל־בָּשָׂ֗ר דָּמ֣וֹ בְנַפְשׁוֹ֮ הוּא֒ וָֽאֹמַר֙ לִבְנֵ֣י יִשְׂרָאֵ֔ל דַּ֥ם כׇּל־בָּשָׂ֖ר לֹ֣א תֹאכֵ֑לוּ כִּ֣י נֶ֤פֶשׁ כׇּל־בָּשָׂר֙ דָּמ֣וֹ הִ֔וא כׇּל־אֹכְלָ֖יו יִכָּרֵֽת׃", "onk": "אֲרֵי נְפַשׁ כָּל בִּסְרָא דְּמֵיהּ בְּנַפְשֵׁיהּ הוּא וַאֲמָרִית לִבְנֵי יִשְׂרָאֵל דַּם כָּל בִּסְרָא לָא תֵיכְלוּן אֲרֵי נְפַשׁ כָּל בִּסְרָא דְּמֵיהּ הִיא כָּל דְּיֵכְלִנֵּיהּ יִשְׁתֵּיצֵי:", "onk_en": "For [as to] the life of all flesh, its blood is its life, and I have said to Bnei Yisroel: The blood of any flesh, you should not eat, for, the life of all flesh is its blood. Whoever eats of it, shall be cut off.", "pj": "אֲרוּם קִיוּם נְפַשׁ כָּל בִּישְרָא אַדְמֵיהּ בְּנַפְשֵׁיהּ הוּא וַאֲמָרִית לִבְנֵי יִשְרָאֵל אֲדַם כָּל בִּישְרָא לָא תֵיכְלוּן אֲרוּם קִיוּם נְפַשׁ כָּל בִּישְרָא אַדְמֵיהּ הוּא כָּל מַן דְיֵכְלִינֵיהּ יִשְׁתֵּיצֵי", "pj_en": "Because the subsistence of the life of all flesh is its blood; it is its life; and I have told the sons of Israel, You shall not eat the blood of any flesh; for the subsistence of the life of all flesh is its blood: whosoever among you eateth it shall be destroyed.", "tj": "", "tj_en": "", "rashi": "<b>דמו בנפשו הוא.<\/b> דָּמוֹ הוּא לוֹ בִּמְקוֹם הַנֶּפֶשׁ, שֶׁהַנֶּפֶשׁ תְּלוּיָה בוֹ:<br><br><b>כי נפש כל בשר דמו הוא.<\/b> הַנֶּפֶשׁ הִיא הַדָּם. דָּם וּבָשָׂר לְשׁוֹן זָכָר, נֶפֶשׁ לְשׁוֹן נְקֵבָה:", "rashi_en": "דמו בנפשו הוא means its blood represents its life (במקום הנפש), in as much as its life is depending on it.<br><br>כי נפש כל בשר דמו הוא means the life is (is identical with) the blood; דם and בשר are masculine, נפש is feminine."}, {"ch": 17, "v": 15, "aliyah": 5, "heb": "וְכׇל־נֶ֗פֶשׁ אֲשֶׁ֨ר תֹּאכַ֤ל נְבֵלָה֙ וּטְרֵפָ֔ה בָּאֶזְרָ֖ח וּבַגֵּ֑ר וְכִבֶּ֨ס בְּגָדָ֜יו וְרָחַ֥ץ בַּמַּ֛יִם וְטָמֵ֥א עַד־הָעֶ֖רֶב וְטָהֵֽר׃", "onk": "וְכָל אֱנַשׁ דִּי יֵיכוּל נְבִילָא וּתְבִירָא <b>בְּיַצִּיבָא<\/b> וּבְגִיּוֹרָא וִיצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא וְיִדְכֵּי:", "onk_en": "Anybody that will eat an improperly slaughtered animal or an animal with a fatal defect among the native-born [<b>settled one<\/b>] and the proselyte, shall wash his clothing and bathe in water and is impure until the evening, and [then] becomes purified.", "pj": "וְכָל בַּר נַשׁ דְיֵיכוֹל בִּיסְרָא דִמְטַלֵק בְּקִילְקוּל נִיכְסֵתָא וּבְשַר תְּבִירָא בְּיַצִיבָא וּבְגִיוֹרָא וִיצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי סָאוִוין וִיהֵי מְסָאָב עַד רַמְשָׁא וְיִדְכֵּי", "pj_en": "And any man who shall eat flesh which hath been thrown away on account of having been strangled (or corrupted), or the flesh of that which hath been torn, (any man,) whether native or sojourner, shall wash his clothes, and bathe in forty seahs of water, and be unclean until evening when he shall be clean;", "tj": "", "tj_en": "", "rashi": "<b>אשר תאכל נבלה וטרפה.<\/b> בְּנִבְלַת עוֹף טָהוֹר דִּבֵּר הַכָּתוּב, שֶׁאֵין לָהּ טֻמְאָה אֶלָּא בְשָׁעָה שֶׁנִּבְלַעַת בְּבֵית הַבְּלִיעָה, וְלִמֶּדְךָ כָּאן שֶׁמְּטַמְּאָה בַאֲכִילָתָהּ (וְאֵינָהּ מְטַמְּאָה בְמַגָּע); וּטְרֵפָה הָאֲמוּרָה כָּאן לֹא נִכְתַּב אֶלָּא לִדְרֹשׁ, וְכֵן שָׁנִינוּ: יָכוֹל תְּהֵא נִבְלַת עוֹף טָמֵא מְטַמְּאָה בְּבֵית הַבְּלִיעָה, תַּ\"ל טְרֵפָה — מִי שֶׁיֵּשׁ בְּמִינוֹ טְרֵפָה, יָצָא עוֹף טָמֵא שֶׁאֵין בְּמִינוֹ טְרֵפָה (ספרא; זבחים ע'):", "rashi_en": "אשר תאכל נבלה וטרפה [AND EVERY SOUL] THAT EATETH CARRION, OR THAT WHICH WAS TORN … [HE SHALL BOTH WASH HIS GARMENTS AND LAVE HIMSELF IN WATER] — Scripture is here speaking of the carrion of a clean bird which causes uncleanness only during the time it passes through the gullet (lit., it is being swallowed in the gullet) and what Scripture teaches you here is that it makes one unclean by eating of it [but it does not defile one by touching it]. The טרפה mentioned here (though being superfluous since a טרפה which died) is of course also a נבלה and thus causes uncleanness just as any other נבלה is mentioned only for the sake of the correct interpretation of the word נבלה. For thus we learn (in Sifra): One might think that the carrion of an unclean bird causes uncleanness in the moment it passes through the gullet! Scripture therefore adds the word טרפה to intimate that this law of נבלה applies only to that class of birds among which טרפה is possible, thus excluding unclean birds for in their class a רפה‎ט can never occur (Sifra, Acharei Mot, Chapter 12 7; Zevachim 69b)."}, {"ch": 17, "v": 16, "aliyah": 5, "heb": "וְאִם֙ לֹ֣א יְכַבֵּ֔ס וּבְשָׂר֖וֹ לֹ֣א יִרְחָ֑ץ וְנָשָׂ֖א עֲוֺנֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִם לָא יְצַבַּע וּבִסְרֵיהּ לָא יַסְחֵי וִיקַבֵּל חוֹבֵיהּ:", "onk_en": "If he does not wash [his clothes] and does not bathe his flesh, he bears [the burden of] his iniquity.", "pj": "וְאִין אַרְשַׁע וְלָא יְצַבַּע וּבִשְרֵיהּ לָא יַסְחֵי וִיקַבֵּל חוֹבֵיהּ", "pj_en": "but if he be perverse and will not wash, nor bathe his flesh, he shall bear his transgression.", "tj": "וְאִין לָא חִיוַר וּבִשְרֵיהּ לָא יִשְׁזָג יְקַבֵּל חוֹבֵיהּ:", "tj_en": "And if he will not cleanse nor purify his flesh, he shall bear his transgression.", "rashi": "<b>ונשא עונו.<\/b> אִם יֹאכַל קֹדֶשׁ אוֹ יִכָּנֵס לַמִּקְדָּשׁ חַיָּב עַל טֻמְאָה זוֹ כְּכָל שְׁאָר טֻמְאוֹת (ספרא):<br><br><b>ובשרו לא ירחץ ונשא עונו.<\/b> עַל רְחִיצַת גּוּפוֹ עָנוּשׁ כָּרֵת וְעַל כִּבּוּס בְּגָדִים בְּמַלְקוּת (שם):", "rashi_en": "ונשא עונו THEN HE SHALL BEAR HIS INIQUITY — If he eats sacred food or enters the Sanctuary in this state of uncleanness he becomes liable to excision for this uncleanness just as for doing these things in any other state of uncleanness (Sifra, Acharei Mot, Chapter 12 14).<br><br>ובשרו לא ירחץ ונשא עונו [BUT IF HE WASH THEM NOT], NOR LAVE HIS FLESH HE SHALL BEAR HIS INIQUITY — For the omission to lave his body before entering the Sanctuary or before eating sacred food he is liable to excision, but for the omission to wash his clothes he is liable to lashes only (Sifra, Acharei Mot, Chapter 12 13)."}, {"ch": 18, "v": 1, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying.", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 2, "aliyah": 5, "heb": "דַּבֵּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "Speak to Bnei Yisroel and say to them I am Adonoy, your God.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "Speak with the sons of Israel, and say to them, I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>אני ה' אלהיכם.<\/b> אֲנִי הוּא שֶׁאָמַרְתִּי בְסִינַי אָנֹכִי ה' אֱלֹהֶיךָ וְקִבַּלְתֶּם עֲלֵיכֶם מַלְכוּתִי, מֵעַתָּה קַבְּלוּ גְזֵרוֹתָי; רַבִּי אוֹמֵר גָּלוּי וְיָדוּעַ לְפָנָיו שֶׁסּוֹפָן לִנָּתֵק בַּעֲרָיוֹת בִּימֵי עֶזְרָא, לְפִיכָךְ בָּא עֲלֵיהֶם בִּגְזֵרָה <b>אני ה' אלהיכם<\/b> — דְּעוּ מִי גוֹזֵר עֲלֵיכֶם, דַּיָּן לִפָּרַע וְנֶאֱמָן לְשַׁלֵּם שָׂכָר (עי' ספרא):", "rashi_en": "אני ה' אלהיכם I AM THE LORD YOUR GOD — I am He Who spoke on Mount Sinai “I am the Lord thy God\" and Whose kingship you then accepted; now, therefore, accept My decrees! Rabbi Judah han-Nasi said: It was manifest and known to Him that in the days of Ezra they would ultimately revolt against restricting sexual relations, He therefore came to them with a decree emphasized by the words: \"I am The Lord your God\" — understand well Who it is that imposes this decree upon you, — the Judge (אלהיכם) Whose function it is to punish but Who is certain also to give a reward ('‎ה‎) (cf. Sifra, Acharei Mot, Section 8 1)."}, {"ch": 18, "v": 3, "aliyah": 5, "heb": "כְּמַעֲשֵׂ֧ה אֶֽרֶץ־מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם־בָּ֖הּ לֹ֣א תַעֲשׂ֑וּ וּכְמַעֲשֵׂ֣ה אֶֽרֶץ־כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְכֶ֥ם שָׁ֙מָּה֙ לֹ֣א תַעֲשׂ֔וּ וּבְחֻקֹּתֵיהֶ֖ם לֹ֥א תֵלֵֽכוּ׃", "onk": "כְּעוֹבָדֵי <b>עַמָּא<\/b> דְאַרְעָא דְמִצְרַיִם דִּי יְתֶבְתּוּן בַּהּ לָא תַעְבְּדוּן וּכְעוֹבָדֵי <b>עַמָּא<\/b> דְאַרְעָא דִכְנַעַן דִּי אֲנָא מָעֵל יָתְכוֹן תַּמָּן לָא תַעְבְּדוּן וּבְנִימוֹסֵיהוֹן לָא תְהָכוּן:", "onk_en": "After the practice of the [<b>people of the<\/b>] Land of Egypt in which you have lived, you shall not do, and the practice of the [<b>people of the<\/b>] Land of Canaan, to which I am bringing you, you shall not do and you shall not follow their statutes [customs].", "pj": "כְּעוֹבְדִין בִּישִׁין דְעַמָא אַרְעָא דְמִצְרַיִם דִי תֵיתְבוּן בָּהּ לָא תַעַבְדוּן וְהֵי כְּעוֹבְדִין בִּישִׁין דְעַמָא דְאַרְעָא דִכְנָעַן דַאֲנָא מָעִיל יַתְכוֹן לְתַמָן לָא תַעַבְדוּן וּבְנִימוּסֵיהוֹן לָא תְהָכוּן", "pj_en": "After the evil work of the people of the land of Mizraim, among whom you have dwelt, you shall not do; so likewise, after the evil work of the people of the land of Kenaan, whither I am bringing you, ye shall not do, neither shall you walk according to their laws;", "tj": "", "tj_en": "", "rashi": "<b>כמעשה ארץ מצרים.<\/b> מַגִּיד שֶׁמַּעֲשֵׂיהֶם שֶׁל מִצְרִיִּים וְשֶׁל כְּנַעֲנִיִּים מְקֻלְקָלִים מִכָּל הָאֻמּוֹת, וְאוֹתוֹ מָקוֹם שֶׁיָּשְׁבוּ בוֹ יִשְׂרָאֵל מְקֻלְקָל מִן הַכֹּל:<br><br><b>אשר אני מביא אתכם שמה.<\/b> מַגִּיד שֶׁאוֹתָן עֲמָמִין שֶׁכִּבְּשׁוּ יִשְֹרָאֵל מְקֻלְקָלִים מִכֻּלָּם (שם):<br><br><b>ובחקתיהם לא תלכו.<\/b> מַה הִנִּיחַ הַכָּתוּב שֶׁלֹּא אָמַר? אֶלָּא אֵלּוּ נִימוֹסוֹת שֶׁלָּהֶן — דְּבָרִים הַחֲקוּקִין לָהֶם — כְּגוֹן טַרְטִיָּאוֹת וְאִצְטַדִיָּאוֹת, רַבִּי מֵאִיר אוֹמֵר, אֵלּוּ דַּרְכֵי הָאֱמוֹרִי שֶׁמָּנוּ חֲכָמִים (שם):", "rashi_en": "כמעשה ארץ מצרים AFTER THE DEEDS OF THE LAND OF EGYPT… [SHALL YE NOT DO] — This tells us that the deeds of the Egyptians and the Canaanites were more corrupt than those of all other nations, and that the district of Egypt in which the Israelites had resided (אשר ישבתם בה) was even more corrupt than all the rest of Egypt (Sifra, Acharei Mot, Section 8 3).<br><br>אשר אני מביא אתכם שמה [AND AFTER THE DEEDS OF THE LAND OF CANAAN] WHITHER I BRING YOU [SHALL YE NOT DO] — This again tells us that those Canaanitish clans whom Israel subdued were more corrupt than all the others of them (Sifra, Acharei Mot, Section 8 4).<br><br>ובחקתיהם לא תלכו NEITHER SHALL YE WALK IN THEIR ORDINANCES — What has Scripture left unsaid when it spoke of the deeds of the Egyptians and Canaanites that it felt compelled to add ובחקתיהם לא תלכו But by these latter words it refers to their social customs — things which have assumed for them the character of a law as, for instance, the frequenting of theaters and race-courses. Rabbi Meir, however, said: These (חקתיהם) refer to the \"ways of the Amorites\" (superstitious practices) which our Rabbis have enumerated (Shabbat 67a; Sifra, Acharei Mot, Section 8 8; cf. also Tosefta Shabbat 7)."}, {"ch": 18, "v": 4, "aliyah": 5, "heb": "אֶת־מִשְׁפָּטַ֧י תַּעֲשׂ֛וּ וְאֶת־חֻקֹּתַ֥י תִּשְׁמְר֖וּ לָלֶ֣כֶת בָּהֶ֑ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "יָת דִּינַי תַּעְבְּדוּן וְיָת קְיָמַי תִּטְּרוּן לְהַלָּכָא בְּהוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "You shall fulfill My laws and you shall keep My statutes to follow them, I am Adonoy, your God.", "pj": "יַת סִדְרֵי דִינַי תַעַבְדוּן וְיַת קְיָימַי תִיטְרוּן לְהַלָכָא בְּהוֹן אֲנָא יְיָ אֱלָהָכוֹן", "pj_en": "but you shall perform the orders of My judgments, and observe My statutes to walk in them: I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>את משפטי תעשו.<\/b> אֵלּוּ דְּבָרִים הָאֲמוּרִים בַּתּוֹרָה בְּמִשְׁפָּט, שֶׁאִלּוּ לֹא נֶאֶמְרוּ הָיוּ כְדַאי לְאָמְרָן:<br><br><b>ואת חקתי תשמרו.<\/b> דְּבָרִים שֶׁהֵן גְּזֵרַת הַמֶּלֶךְ, שֶׁיֵּצֶר הָרַע מֵשִׁיב עֲלֵיהֶם לָמָּה לָנוּ לְשָׁמְרָן? וְאֻמּוֹת הָעוֹלָם מְשִׁיבִין עֲלֵיהֶם, כְּגוֹן אֲכִילַת חֲזִיר וּלְבִישַׁת שַׁעַטְנֵז וְטָהֳרַת מֵי חַטָּאת, לְכָךְ נֶאֱמַר <b>אני ה'<\/b>, גָּזַרְתִּי עֲלֵיכֶם, אֵי אַתָּה רַשַּׁאי לִפָּטֵר (יומא ס\"ז):<br><br><b>ללכת בהם.<\/b> אַל תִּפָּטֵר מִתּוֹכָם, שֶׁלֹּא תֹאמַר לָמַדְתִּי חָכְמַת יִשְׂרָאֵל אֵלֵךְ וְאֶלְמַד חָכְמַת הָאֻמּוֹת (ספרא):", "rashi_en": "את משפטי תעשו YE SHALL DO MY JUDGMENTS — Matters prescribed in the Torah which are in conformity with the human feeling of justice such as one feels ought to be ordained if they had not been already ordained by the Torah.<br><br>ואת חקתי תשמרו AND KEEP MINE ORDINANCES — matters which are decrees of the King (promulgated without any reason being stated) against which the evil inclination raises objections: \"Why should we observe them and against which also the nations of the world raise objections, as e. g., the  prohibition of eating swine’s flesh, of wearing clothes of a mixture of wool and linen, the purgatory power of \"water mingled with the ashes of the Red Heifer\" (טהרת מי חטאת) — therefore it is stated: \"I\", the Lord, have enacted this for you — you are not at liberty to evade the obligation (Yoma 67b).<br><br>ללכת בהם TO WALK IN THEM — do not free yourselves from their environment, i.e. that you must not say, I have acquired Jewish wisdom, now I will go and acquire the wisdom of the other peoples of the world in order to walk in their ways."}, {"ch": 18, "v": 5, "aliyah": 5, "heb": "וּשְׁמַרְתֶּ֤ם אֶת־חֻקֹּתַי֙ וְאֶת־מִשְׁפָּטַ֔י אֲשֶׁ֨ר יַעֲשֶׂ֥ה אֹתָ֛ם הָאָדָ֖ם וָחַ֣י בָּהֶ֑ם אֲנִ֖י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְתִטְּרוּן יָת קְיָמַי וְיָת דִּינַי דִּי יַעְבֵּד יָתְהוֹן אֲנָשָׁא וְיֵחֵי בְהוֹן <b>לְחַיֵּי עָלְמָא<\/b> אֲנָא יְיָ:", "onk_en": "You shall keep My statutes and My laws which if a man obeys he shall live through them [<b>in the World to Come<\/b>]; I am Adonoy.", "pj": "וְתִטְרוּן יַת קְיָמַי וְיַת סִדְרֵי דִינַי דְאִין יַעֲבֵיד יַתְהוֹן אֵינָשָׁא וְיֵיחֵי בְּהוֹן בְּחַיֵי עַלְמָא וְחוּלְקֵיהּ עִם צַדִיקַיָא אֲנָא יְיָ", "pj_en": "And you shall keep My statutes, and the order of My judgments, which if a man do he shall live in them, in the life of eternity, and his portion shall be with the just: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ושמרתם את חקתי וגו'.<\/b> לְרַבּוֹת שְׁאָר דִּקְדּוּקֵי הַפָּרָשָׁה, שֶׁלֹּא פֵּרֵט הַכָּתוּב בָּהֶם; דָּבָר אַחֵר לִתֵּן שְׁמִירָה וַעֲשִׂיָּה לַחֻקִּים וּשְׁמִירָה וַעֲשִׂיָּה לַמִּשְׁפָּטִים, לְפִי שֶׁלֹּא נָתַן אֶלָּא עֲשִׂיָּה לַמִּשְׁפָּטִים וּשְׁמִירָה לַחֻקִּים (ספרא):<br><br><b>וחי בהם.<\/b> לָעוֹלָם הַבָּא, שֶׁאִם תֹּאמַר בָּעוֹלָם הַזֶּה וַהֲלֹא סוֹפוֹ הוּא מֵת (שם):<br><br><b>אני ה'.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר (שם):", "rashi_en": "'ושמרתם את חקתי וגו‎ YE SHALL THEREFORE KEEP MY ORDINANCES — [This is not a mere repetition  of v. 4 but is intended] to include other details of the laws mentioned in this chapter which Scripture does not expressly mention. Another explanation is: Scripture makes this repetition in order to attach the commands of “observing\" (שמירה) and \"performing\" (עשיה) to the חוקים, and the commands of שמירה and עשיה to the משפטים, for in v. 4 it uses the term עשיה only in connection with the משפטים, and that of שמירה only with reference to the חוקים (Sifra, Acharei Mot, Section 8 10). <br><br>וחי בהם means, THAT HE SHALL LIVE THROUGH THEM in the world to come (eternal life). For if you say it means that he shall live in this world, is it not a fact that in the end he must die! (Sifra, Acharei Mot, Section 8 10; cf. also Targ. Onkelos) <br><br>'אני ה‎ I AM THE LORD, Who am faithful to pay you your reward (Sifra, Acharei Mot, Section 8 10)."}, {"ch": 18, "v": 6, "aliyah": 6, "heb": "אִ֥ישׁ אִישׁ֙ אֶל־כׇּל־שְׁאֵ֣ר בְּשָׂר֔וֹ לֹ֥א תִקְרְב֖וּ לְגַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "גְּבַר גְּבַר לְכָל קָרִיב בִּסְרֵיהּ לָא תִקְרְבוּן לְגַלָּאָה עֶרְיָא אֲנָא יְיָ:", "onk_en": "Each and every person—to any of his close kin—You shall not approach to uncover [their] nakedness, I am Adonoy.", "pj": "גְבַר טְלֵי וּגְבַר סִיב לְכָל קְרִיבַת בִּישְרֵיהּ לָא תְקַרְבוּן לְבַזָאָה עִרְיָיתָא בְּתַשְׁמִישְׁתָּא וּבְפִרְסוּמֵי עִרְיָיא אֲנָא יְיָ", "pj_en": "No man, either young or old, shall come nigh to any of the kindred of his flesh to dishonour (their) nakedness by carnality, or by the knowledge of their nakedness. I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>לא תקרבו.<\/b> לְהַזְהִיר הַנְּקֵבָה כַּזָּכָר, לְכָךְ נֶאֱמַר לְשׁוֹן רַבִּים:<br><br><b>אני ה'.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר:", "rashi_en": "לא תקרבו  NONE OF YOU SHALL APPROACH  TO [ANY THAT IS NEAR OF KIN TO HIM] — The intention is to admonish women as well as men (in respect to this general prohibition of unchastity); on this account the plural is used (Sifra, Acharei Mot, Chapter 13 1).<br><br>'אני ה I AM THE LORD, who am faithful to pay you your reward (Sifra, Acharei Mot, Chapter 13 13."}, {"ch": 18, "v": 7, "aliyah": 6, "heb": "עֶרְוַ֥ת אָבִ֛יךָ וְעֶרְוַ֥ת אִמְּךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת אֲבוּךְ וְעֶרְיַת אִמָּךְ לָא תְגַלֵּי אִמָּךְ הִיא לָא תְגַלֵּי עֶרְיְתַהּ:", "onk_en": "The nakedness of your father and the nakedness of your mother you shall not uncover; she is your mother, you shall not uncover her nakedness.", "pj": "עֶרְיַית אָבוּךְ וְעֶרְיַית אִמָךְ לָא תְבַזֵי אִיתָא לָא תְשַׁמֵשׁ עִם אַבְהָא וּגְבַר לָא יְשַׁמֵשׁ עִם אִמֵיהּ אִמָךְ הִיא לָא תְגַלֵי עִרְיָיתָהּ", "pj_en": "The nakedness of thy father, or the nakedness of thy mother, thou shall not dishonour. A woman shall not lie with her father, nor a man with his mother; she is thy mother: thou shalt not discover her nakedness.", "tj": "", "tj_en": "", "rashi": "<b>ערות אביך.<\/b> זוֹ אֵשֶׁת אָבִיךָ, אוֹ אֵינוֹ אֶלָּא כְמַשְׁמָעוֹ? נֶאֱמַר כָּאן עֶרְוַת אָבִיךָ וְנֶאֱמַר לְהַלָּן עֶרְוַת אָבִיו גִּלָּה, מַה לְּהַלָּן אֵשֶׁת אָבִיו אַף כָּאן אֵשֶׁת אָבִיו (סנהדרין נ\"ד):<br><br><b>וערות אמך.<\/b> לְהָבִיא אִמּוֹ שֶׁאֵינָהּ אֵשֶׁת אָבִיו (שם):", "rashi_en": "אביך‎ ערות‎ THE NAKEDNESS OF THY FATHER, [AND THE NAKEDNESS OF THY MOTHER SHALT THOU NOT UNCOVER] — This refers to intercourse with thy father's wife (no matter whether she is thy own mother or thy stepmother). Or perhaps this is not so, but ערות אביך has to be taken literally (as sodomy)?! Scripture, however, uses the expression ערות אביך here, and it is said later on (Leviticus 20:11) “And the man that lieth with his father's wife hath uncovered his father's nakedness (״(ערות אביו גלה. Now what is the meaning of ערות אביו there? It refers to one's fathers wife! so does ערות אביך  here also refer to one's father's wife (Sanhedrin 54a).<br><br>וערות אמך AND THE NAKEDNESS OF THY MOTHER [SHALT THOU NOT UNCOVER] — This is intended to include in the prohibition the marriage of one's own mother although she be not the wife of one's father (Sanhedrin 54a)."}, {"ch": 18, "v": 8, "aliyah": 6, "heb": "עֶרְוַ֥ת אֵֽשֶׁת־אָבִ֖יךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָבִ֖יךָ הִֽוא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת אִתַּת אָבוּךְ לָא תְגַלֵּי עֶרְיַת אֲבוּךְ הִיא:", "onk_en": "The nakedness of your fathers wife you shall not uncover; it is your fathers nakedness.", "pj": "עֶרְיַית אִתַּת אָבוּךְ לָא תִבְזֵי מְטוּל דְעִרְיְיתָא דְאָבוּךְ הִיא", "pj_en": "The nakedness of thy father's wife thou shalt not dishonour, for it is the nakedness of thy father.", "tj": "", "tj_en": "", "rashi": "<b>ערות אשת אביך.<\/b> לְרַבּוֹת אַחַר מִיתָה (שם):", "rashi_en": "ערות אשת אביך THE NAKEDNESS OF THY FATHER'S WIFE [SHALT THOU NOT UNCOVER] — This is intended to include in the prohibition of union with one's father's wife already mentioned v. 7. even the doing of this after his death (Sanhedrin 54a)."}, {"ch": 18, "v": 9, "aliyah": 6, "heb": "עֶרְוַ֨ת אֲחֽוֹתְךָ֤ בַת־אָבִ֙יךָ֙ א֣וֹ בַת־אִמֶּ֔ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת אֲחָתָךְ בַּת אֲבוּךְ אוֹ בַת אִמָּךְ דִּילִידָא <b>מִן אֲבוּךְ מִן אִתַּת אָחֳרִי<\/b> אוֹ <b>מִן אִמָּךְ לִגְבַר אָחֳרָן<\/b> לָא תְגַלֵּי עֶרְיַתְהֶן:", "onk_en": "The nakedness of your sister [whether she is] your fathers daughter or your mothers daughter; whether she is born in the house [<b>to your father from another woman<\/b>], or she is born outside [<b>to your mother from another man<\/b>], you shall not uncover their nakedness.", "pj": "עֶרְיַית אֲחָתָךְ בַּת אָבוּךְ אוֹ בַּת אִמָךְ מַה דְיוֹלִיד אַבָּךְ מִן אִיתָא אוֹחְרִי אוֹ מִן אִמָךְ אוֹ מַה דִילֵידַת אִמָךְ מִן אַבָּךְ אוֹ מִן גְבַר חוֹרַן לָא תִבְזֵי עֶרְיַתְהֶן", "pj_en": "The nakedness of thy sister, the daughter of thy father, or the daughter of thy mother, (or of her) whom, thy father begat by another wife, or of thy mother, whom thy mother bare by thy father or by another husband, thou shalt not dishonour.", "tj": "", "tj_en": "", "rashi": "<b>בת אביך.<\/b> אַף בַּת אֲנוּסָה בְמַשְׁמָע:<br><br><b>מולדת בית או מולדת חוץ.<\/b> בֵּין שֶׁאוֹמְרִים לוֹ לְאָבִיךָ קַיֵּם אֶת אִמָּהּ, וּבֵין שֶׁאוֹמְרִים לוֹ הוֹצֵא אֶת אִמָּהּ, כְּגוֹן מַמְזֶרֶת אוֹ נְתִינָה (יבמות כ\"ג):", "rashi_en": "בת אביך [THE NAKEDNESS OF THY SISTER] THE DAUGHTER OF THY FATHER [OR THE DAUGHTER OF THY MOTHER… THOU SHALT NOT UNCOVER] — Also the daughter of a woman raped by one's father is implied by the term  מולדת בית או מולדת חוץ.<br><br>.בת — WHETHER SHE BE BORN IN THE HOUSE OR WHETHER SHE BE BORN OUTSIDE THE HOUSE — This means, thy sister, thy father's daughter, whether according to the law we can say to thy father, \"Keep her mother as your wife\" or whether we have to say to him, \"Divorce her mother\", as, for instance, when she is a ממזרת (the issue of a union forbidden in the Torah under the penalty of כרת) or a נתינה (the daughter of a Gibeonite woman, cf. Joshua 9:27, forbidden under the penalty of מלקות) (Yevamot 23a)."}, {"ch": 18, "v": 10, "aliyah": 6, "heb": "עֶרְוַ֤ת בַּת־בִּנְךָ֙ א֣וֹ בַֽת־בִּתְּךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑ן כִּ֥י עֶרְוָתְךָ֖ הֵֽנָּה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת בַּת בְּרָךְ אוֹ בַת בְּרַתָּךְ לָא תְגַלֵּי עֶרְיַתְהֵן אֲרֵי עֶרְיְתָךְ אִנּוּן:", "onk_en": "The nakedness of your sons daughter or your daughters daughter; you shall not uncover their nakedness, for their nakedness is your own.", "pj": "עֶרְיַית בְּרַת בְּנָךְ אוֹ בְּרַת בְּרַתָּךְ לָא תִבְזֵי עֶרְיַיתְהֶן אֲרוּם הֵי כְעִרְיָיתָךְ הִינוּן", "pj_en": "The nakedness of thy son's daughter, or the daughter of thy daughter, thou shalt not dishonour, because they are as thy own nakedness.", "tj": "", "tj_en": "", "rashi": "<b>ערות בת בנך וגו'.<\/b> בְּבִתּוֹ מֵאֲנוּסָתוֹ הַכָּתוּב מְדַבֵּר, וּבִתּוֹ וּבַת בִּתּוֹ מֵאִשְׁתּוֹ אָנוּ לְמֵדִין מֵ\"עֶרְוַת אִשָּׁה וּבִתָּהּ\", שֶׁנֶּאֱמַר בָּהֶן \"לֹא תְגַלֵּה\", בֵּין שֶׁהִיא מִמֶּנּוּ וּבֵין שֶׁהִיא מֵאִישׁ אַחֵר (שם כב):<br><br><b>ערות בת בנך.<\/b> קַל וָחֹמֶר לְבִתְּךָ, אֶלָּא לְפִי שֶׁאֵין מַזְהִירִין מִן הַדִּין, לְמָדוּהָ מִגְּזֵרָה שָׁוָה בְּמַסֶּכֶת יְבָמוֹת (דף ג'):", "rashi_en": "ערות בת בנך THE NAKEDNESS OF THE DAUGHTER OF THY SON [OR THE DAUGHTER OF THY DAUGHTER THOU SHALT NOT UNCOVER] — When it states \"thy daughter״ Scripture is speaking of his daughter born of a woman whom he had outraged (similarly \"the daughter of thy son\" means, the son born of such a woman). This must be so, for that one is forbidden to marry one's daughter or the daughter of one's daughter who was born of one's wife we may learn from the prohibition (v. 17) in the verse beginning אשה ובתה ערות \"the nakedness of a woman and her daughter\" of whom it is stated \"thou shalt not uncover\" and which thus implies the prohibition to marry one's daughter (and forbids one's marriage with one's daughter's daughter; for Scripture continues there: “neither shalt thou take her son's daughter or her daughter's daughter) whether she be begotten by him or by another man (cf. Yevamot 22b and Rashi von v. 17).<br><br>ערות בת בנך THE NAKEDNESS OF THY SON'S DAUGHTER [… THOU SHALT NOT UNCOVER] — Since even thy son's daughter (the former being born from an אנוסה) is forbidden, the prohibition concerning thy own daughter born of thy אנוסה could be derived by a conclusion a minori ad majus (ק״ו). But because there is a rule אין מזהירין מן הדין “no prohibition can be derived by a logical conclusion\" they (the Rabbis) derived it in Treatise Yevamot 3a by an analogy (גזירה שוה) based on the similar expression הנה — הנה used here and in v. 17."}, {"ch": 18, "v": 11, "aliyah": 6, "heb": "עֶרְוַ֨ת בַּת־אֵ֤שֶׁת אָבִ֙יךָ֙ מוֹלֶ֣דֶת אָבִ֔יךָ אֲחוֹתְךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת בַּת אִתַּת אֲבוּךְ דִּילִידָא מִן אֲבוּךְ אֲחָתָךְ הִיא לָא תְגַלֵּי עֶרְיְתַהּ:", "onk_en": "The nakedness of the daughter of your fathers wife who is born to your father; she is your sister, you shall not uncover her nakedness.", "pj": "עֶרְיַית בַּת אִתַּת אָבוּךְ דִילֵידַת מִן אַבָּךְ אַחְתָךְ הִיא לָא תִבְזֵי עִירְיְיתָהּ", "pj_en": "The nakedness of thy father's wife's daughter, who hath been begotten of thy father, she is thy sister, thou shalt not dishonour.", "tj": "", "tj_en": "", "rashi": "<b>ערות בת אשת אביך.<\/b> לִמֵּד שֶׁאֵינוֹ חַיָּב עַל אֲחוֹתוֹ מִשִּׁפְחָה וְנָכְרִית, לְכָךְ נֶאֱמַר \"בַּת אֵשֶׁת אָבִיךָ\" — בִּרְאוּיָה לְקִדּוּשִׁין (שם כ\"ג):", "rashi_en": "ערות בת אשת אביך THE NAKEDNESS OF THY FATHER'S WIFE'S DAUGHTER… [THOU SHALT NOT UNCOVER] — This teaches us that one is not liable to excision for a union with one's sister (on his father’s side) who was born of a maid-servant or a non-Jewess. It is for this reason that Scripture instead of simply saying \"thy sister\"  uses the circumlocution \"the daughter of thy father's wife\" i. e. a woman who is fitted for Kiddushin (one with whom a marriage may be legitimately entered into, which is not the case with a שפחה ונכרית) (Yevamot 22b)."}, {"ch": 18, "v": 12, "aliyah": 6, "heb": "עֶרְוַ֥ת אֲחוֹת־אָבִ֖יךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖יךָ הִֽוא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת אֲחַת אֲבוּךְ לָא תְגַלֵּי קָרִיבַת אֲבוּךְ הִיא:", "onk_en": "The nakedness of your fathers sister you shall not uncover; she is your fathers kin.", "pj": "עֶרְיַית אֲחַת אַבָּךְ לָא תִבְזֵי קְרֵיבַת בְּשַר אַבָּךְ הִיא", "pj_en": "The nakedness of thy father's sister thou shalt not dishonour; she is of kin to thy father's flesh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 13, "aliyah": 6, "heb": "עֶרְוַ֥ת אֲחֽוֹת־אִמְּךָ֖ לֹ֣א תְגַלֵּ֑ה כִּֽי־שְׁאֵ֥ר אִמְּךָ֖ הִֽוא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת אֲחַת אִמָּךְ לָא תְגַלֵּי אֲרֵי קָרִיבַת אִמָּךְ הִיא:", "onk_en": "The nakedness of your mothers sister you shall not uncover, for she is your mothers kin.", "pj": "עֶרְיַית אֲחַת אִמָךְ לָא תִבְזֵי אֲרוּם קְרֵיבַת בְּשַר אִמָךְ הִיא", "pj_en": "The nakedness of thy mother's sister thou shall not dishonour; for she is of kin to thy mother's flesh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 14, "aliyah": 6, "heb": "עֶרְוַ֥ת אֲחִֽי־אָבִ֖יךָ לֹ֣א תְגַלֵּ֑ה אֶל־אִשְׁתּוֹ֙ לֹ֣א תִקְרָ֔ב דֹּדָֽתְךָ֖ הִֽוא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת אַח אֲבוּךְ לָא תְגַלֵּי לְאִתְּתֵיהּ לָא תִקְרַב <b>אִתַּת אַח אֲבוּךְ<\/b> הִיא:", "onk_en": "The nakedness of your fathers brother you shall not uncover. You shall not approach his wife, she is your aunt [<b>the wife of your father’s brother<\/b>].", "pj": "עֶרְיַית אַחְבוּךְ לָא תִבְזֵי וּלְוַת אִנְתְּתֵיהּ לָא תִקְרֵב בְּתַשְׁמִישׁ עַרְסָא אִיתַּת אַחְבוּךְ הִיא", "pj_en": "The nakedness of thy father's brother thou shalt not dishonour, nor come nigh to his wife carnally; she is the wife of thy father's brother.", "tj": "", "tj_en": "", "rashi": "<b>ערות אחי אביך לא תגלה.<\/b> וּמַה הִיא עֶרְוָתוֹ? <b>אל אשתו לא תקרב<\/b>:", "rashi_en": "ערות אחי אביך לא תגלה THE NAKEDNESS OF THY FATHER'S BROTHER THOU SHALT NOT UNCOVER — and what does this \"uncovering of his nakedness\" mean אל אשתו לא תקרב? THOU SHALT NOT APPROACH TO HIS WIFE."}, {"ch": 18, "v": 15, "aliyah": 6, "heb": "עֶרְוַ֥ת כַּלָּֽתְךָ֖ לֹ֣א תְגַלֵּ֑ה אֵ֤שֶׁת בִּנְךָ֙ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽהּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת כַּלְּתָךְ לָא תְגַלֵּי אִתַּת בְּרָךְ הִיא לָא תְגַלֵּי עֶרְיְתַהּ:", "onk_en": "The nakedness of your daughter-in-law you shall not uncover; she is your sons wife, you shall not uncover her nakedness.", "pj": "עֶרְיַית כַּלָתָךְ לָא תִבְזֵי אִתַּת בְּרָךְ הִיא לָא תִבְזֵי עִירְיְיתָהּ", "pj_en": "The nakedness of thy daughter-in-law thou shalt not dishonour; she is the wife of thy son, thou shalt not dishonour her nakedness.", "tj": "", "tj_en": "", "rashi": "<b>אשת בנך.<\/b> לֹא אָמַרְתִּי אֶלָּא בְּשֶׁיֵּשׁ לְבִנְךָ אִישׁוּת בָּהּ, פְּרָט לַאֲנוּסָה וְשִׁפְחָה וְנָכְרִית (עי' ספרא):", "rashi_en": "אשת בנך [THE NAKEDNESS OF THY DAUGHTER-IN-LAW THOU SHALT NOT UNCOVER; SHE IS] THY SON'S WIFE — By using the apparently redundant words: “she is thy son's wife\"  Scripture says, as it were: I command this about such a woman only when thy son has a legal matrimonial relation (אישות) to her, thus excluding a woman who has been raped by him (אנוסה) or a Canaanitish maid-servant, or a non-Jewess (cf. Sifra, Kedoshim, Chapter 10 10))."}, {"ch": 18, "v": 16, "aliyah": 6, "heb": "עֶרְוַ֥ת אֵֽשֶׁת־אָחִ֖יךָ לֹ֣א תְגַלֵּ֑ה עֶרְוַ֥ת אָחִ֖יךָ הִֽוא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "עֶרְיַת אִתַּת אֲחוּךְ לָא תְגַלֵּי עֶרְיַת אֲחוּךְ הִיא:", "onk_en": "The nakedness of your brothers wife you shall not uncover; it is your brothers nakedness.", "pj": "עֶרְיַית אִתַּת אָחוּךְ לָא תִבְזֵי בְּחַיֵי אָחוּךְ וּבָתַר מוֹתֵיהּ אִין אִית לֵיהּ בְּנִין עִירְיְיתָא דְאָחוּךְ הוּא", "pj_en": "The nakedness of thy brother's wife thou shalt not dishonour in the life-time of thy brother, or after his death, if he have children; for it is the nakedness of thy brother.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 17, "aliyah": 6, "heb": "עֶרְוַ֥ת אִשָּׁ֛ה וּבִתָּ֖הּ לֹ֣א תְגַלֵּ֑ה אֶֽת־בַּת־בְּנָ֞הּ וְאֶת־בַּת־בִּתָּ֗הּ לֹ֤א תִקַּח֙ לְגַלּ֣וֹת עֶרְוָתָ֔הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא׃", "onk": "עֶרְיַת אִתְּתָא וּבְרַתַּהּ לָא תְגַלֵּי יָת בַּת בְּרַהּ וְיָת בַּת בְּרַתַּהּ לָא תִסַּב לְגַלָּאָה עֶרְיְתַהּ קָרִיבָן אִנּוּן <b>עֵצַת חִטְאִין<\/b> הִיא:", "onk_en": "The nakedness of a woman and her daughter you shall not uncover. The daughter of her son and the daughter of her daughter you shall not take to uncover her nakedness, they are kin; it is lewdness [<b>a sinful plan<\/b>].", "pj": "עֶרְיַית אִתָּא וּבְרַתָּהּ לָא תִבְזֵי יַת בְּרַת בְּרָהּ וְיַת בְּרַת בְּרַתָּהּ לָא תִיסַב לְבַזָאָה עִרְיְיתָהּ קְרִיבַת בִּישְרָא הִינוּן זְנוּ הוּא", "pj_en": "The nakedness of a woman and of her daughter thou shalt not dishonour, neither shalt thou take her son's daughter or the daughter of her daughter, to dishonour their nakedness; for they are of kin to her flesh; it is corruption.", "tj": "", "tj_en": "", "rashi": "<b>ערות אשה ובתה.<\/b> לֹא אָסַר הַכָּתוּב אֶלָּא עַל יְדֵי נִשּׂוּאֵי הָרִאשׁוֹנָה, לְכָךְ נֶאֱמַר לֹא \"תִקַּח\" — לְשׁוֹן קִיחָה, וְכֵן לְעִנְיַן הָעֹנֶשׁ, אֲשֶׁר \"יִקַּח\" אֶת אִשָּׁה וְאֶת אִמָּה — לְשׁוֹן קִיחָה, אֲבָל אָנַס אִשָּׁה מֻתָּר לִשָּׂא בִּתָּהּ (יבמות צ\"ז):<br><br><b>שארה הנה.<\/b> קְרוֹבוֹת זוֹ לָזוֹ:<br><br><b>זמה.<\/b> עֵצָה, כְּתַרְגּוּמוֹ עֲצַת חֶטְאִין, שֶׁיִּצְרְךָ יוֹעֶצְךָ לַחֲטֹא:", "rashi_en": "ערות אשה ובתה THE NAKEDNESS OF A WOMAN AND HER DAUGHTER [THOU SHALT NOT UNCOVER] — Scripture forbids this only  if the union with the first of these (whether it be the woman or her daughter) came about through a legal marriage. That is why Scripture uses the term לא תקח, the expression employed for \"taking to wife in a legal way\". Similarly with reference to the punishment for such a union it states, (Leviticus 20:14) \"And if a man take (יקח) a wife and her mother, [it is wickedness; they shall be burnt with fire]\" — an expression for \"taking\" to wife in a legal way. But if one has raped a woman he is permitted to marry her daughter (Yevamot 97a). <br><br>שארה הנה means, they are closely related to one another. <br><br>זמה means, an evil plan, as the Targum renders it‎ עצת חטאין , \"a sinful plan\"; the term is used because it is your evil inclination which counsels you to sin."}, {"ch": 18, "v": 18, "aliyah": 6, "heb": "וְאִשָּׁ֥ה אֶל־אֲחֹתָ֖הּ לֹ֣א תִקָּ֑ח לִצְרֹ֗ר לְגַלּ֧וֹת עֶרְוָתָ֛הּ עָלֶ֖יהָ בְּחַיֶּֽיהָ׃", "onk": "וְאִתְּתָא עִם אֲחָתַהּ לָא תִסָּב לְעָקָאָה לְגַלָּאָה עֶרְיְתַהּ עֲלַהּ בְּחַיָּיהָא:", "onk_en": "You shall not take a woman and her sister to vex [her] to uncover her nakedness with the other, in her lifetime.", "pj": "וְאִתְּתָא בְּחַיֵי אָחָתָא לָא תִיסַב לְאַעֲקָא לָהּ לְבַזָאָה עֶרְיְיתָהּ עֲלָהּ כָּל יוֹמֵי חַיָיהָא", "pj_en": "Neither shalt thou take a wife in the lifetime of her sister, to aggrieve her by dishonouring her nakedness, over her, all the days of her life.", "tj": "", "tj_en": "", "rashi": "<b>אל אחתה.<\/b> שְׁתֵּיהֶן כְּאַחַת (קידושין נ'):<br><br><b>לצרר.<\/b> לְשׁוֹן צָרָה — לַעֲשׂוֹת אֶת זוֹ צָרָה לָזוֹ:<br><br><b>בחייה.<\/b> לִמֶּדְךָ שֶׁאִם גֵרְשָׁהּ לֹא יִשָּׂא אֶת אֲחוֹתָהּ כָּל זְמַן שֶׁהִיא בַחַיִּים (יבמות ח'):", "rashi_en": "‎ אל אחתה ‎[NEITHER SHALT THOU TAKE A WIFE] TO HER SISTER — both at the same time. <br><br>לצרר is connected with the word  ,צרה — a rival (cf. I Samuel 1:6). Thus the verse signifies “thou shalt not take a wife to her sister\", to make (i. e. making) the one the rival of the other.<br><br>בחייה DURING HER LIFE-TIME — This teaches you that if he divorced her (his wife) he is not allowed to marry her sister so long as she (the former) is still living (Yevamot 8b)."}, {"ch": 18, "v": 19, "aliyah": 6, "heb": "וְאֶל־אִשָּׁ֖ה בְּנִדַּ֣ת טֻמְאָתָ֑הּ לֹ֣א תִקְרַ֔ב לְגַלּ֖וֹת עֶרְוָתָֽהּ׃", "onk": "וּלְאִתְּתָא <b>בְּרִחוּק סוֹבְתַהּ<\/b> לָא תִקְרַב לְגַלָּאָה עֶרְיְתַהּ:", "onk_en": "To a woman while in her menstrual impurity [<b>the state of her impure ‘separation’<\/b>], you shall not approach to uncover her nakedness.", "pj": "וּלְצֵיד אִתְּתָא בִּזְמַן רִיחוּק סְאוּבְתָּהּ לָא תִקְרַב לְבַזָּאָה עֶרְיְיתָהּ", "pj_en": "And unto the side of a woman in the time of the separation of her uncleanness thou shalt not draw nigh to dishonour her nakedness.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 20, "aliyah": 6, "heb": "וְאֶל־אֵ֙שֶׁת֙ עֲמִֽיתְךָ֔ לֹא־תִתֵּ֥ן שְׁכׇבְתְּךָ֖ לְזָ֑רַע לְטׇמְאָה־בָֽהּ׃", "onk": "וּבְאִתַּת חַבְרָךְ לָא תִתֵּן שְׁכֻבְתָּךְ לְזַרְעָא לְאִסְתָּאָבָא בַהּ:", "onk_en": "With your friends wife you shall not lie carnally, to defile yourself through her.", "pj": "וּלְצֵיד אִתַּת חַבְרָךְ לָא תִתֵּן תַּשְׁמִישָׁךְ לְזַרְעָא לְאִסְתָּאֲבָא בָהּ", "pj_en": "Nor unto the side of thy neighbour's wife shalt thou come to defile her.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 21, "aliyah": 6, "heb": "וּמִֽזַּרְעֲךָ֥ לֹא־תִתֵּ֖ן לְהַעֲבִ֣יר לַמֹּ֑לֶךְ וְלֹ֧א תְחַלֵּ֛ל אֶת־שֵׁ֥ם אֱלֹהֶ֖יךָ אֲנִ֥י יְהֹוָֽה׃", "onk": "וּמִבְּנָיךְ לָא תִתֵּן לְאַעְבָּרָא לְמוֹלֶךְ וְלָא תַחֵל יָת שְׁמָא דֶאֱלָהָךְ אֲנָא יְיָ:", "onk_en": "You shall not hand over any of your children to be passed through [the worship of] <i>Molech<\/i> and you shall not defile the Name of your God, I am Adonoy.", "pj": "וּמִן זַרְעָךְ לָא תִתֵּן בְּתַשְׁמִישְׁתָּה לְצֵיד בַּת עַמְמִין לְמָעְבְרָא לְפוּלְחָנָא אוֹחְרָא וְלָא תָפִיס יַת שְׁמָא דֶאֱלָהָךְ אֲנָא יְיָ", "pj_en": "And of thy offspring thou shalt not give up any to lie carnally with the daughters of the Gentiles, to perform strange worship; nor shalt thou profane the Name of thy God: I am the Lord.", "tj": "וְלָא תִפְסוּן יַת שְׁמָא דֶּאֱלָהָכוֹן כְּדֵין אָמַר יְיָ:", "tj_en": "Neither shall ye profane the Name of your God: thus speaketh the Lord.", "rashi": "<b>למלך.<\/b> עֲ\"זָ הִיא שֶׁשְּׁמָהּ מֹלֶךְ, וְזוֹ הִיא עֲבוֹדָתָהּ, שֶׁמּוֹסֵר בְּנוֹ לַכּוֹמְרִים וְעוֹשִׂין שְׁתֵּי מְדוּרוֹת גְּדוֹלוֹת וּמַעֲבִירִין אֶת הַבֵּן בְּרַגְלָיו בֵּין שְׁתֵּי מְדוּרוֹת הָאֵשׁ (סנהדרין ס\"ד):<br><br><b>לא תתן.<\/b> זוֹ הִיא מְסִירָתוֹ לַכּוֹמְרִים:<br><br><b>להעביר למלך.<\/b> זוֹ הַעֲבָרַת הָאֵשׁ:", "rashi_en": "למלך [AND THOU SHALT NOT LET ANY OF THY SEED PASS THROUGH THE FIRE] TO MOLECH — This was an idol the name of which was \"Molech\", and this was the manner in which it was worshipped: that he (the father) handed his child (lit., his son, but it applies to his daughter also; cf. Deuteronomy 18:10) over to the priests of the idol. These lit two large pyres one opposite the other and made the child to pass on foot between the two pyres (Sanhedrin 64b).<br><br>לא תתן refers to “the handing over of the child” to the priests.<br><br>להעביר למלך — this refers to the “passing through the fire\"."}, {"ch": 18, "v": 22, "aliyah": 7, "heb": "וְאֶ֨ת־זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא׃", "onk": "וְעִם דְּכוּרָא לָא תִשְׁכּוּב מִשְׁכְּבֵי אִתְּתָא תּוֹעֶבְתָּא הִיא:", "onk_en": "You shall not lie with a male [conjugally] as one lies with a woman; it is an abomination.", "pj": "וְעִם דְכוּרֵי לָא תִשְׁכּוּב בְּתַשְׁמִישַׁיָא דְאִתְּתָא מְרַחְקָא הִיא", "pj_en": "Nor with a male person shalt thou lie as with a woman; it is an abhorrent thing.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 23, "aliyah": 7, "heb": "וּבְכׇל־בְּהֵמָ֛ה לֹא־תִתֵּ֥ן שְׁכׇבְתְּךָ֖ לְטׇמְאָה־בָ֑הּ וְאִשָּׁ֗ה לֹֽא־תַעֲמֹ֞ד לִפְנֵ֧י בְהֵמָ֛ה לְרִבְעָ֖הּ תֶּ֥בֶל הֽוּא׃", "onk": "וּבְכָל בְּעִירָא לָא תִתֵּן שְׁכֻבְתָּךְ לְאִסְתָּאָבָא בַהּ וְאִתְּתָא לָא תְקוּם קֳדָם בְּעִירָא <b>לְמִשְׁלַט בַּהּ<\/b> תִּבְלָא הוּא:", "onk_en": "Together with any animal you shall not lie [conjugally] to defile yourself with it. A woman shall not stand before an animal to copulate with it [<b>control her<\/b>]; it is defilement.", "pj": "וּבְכָל בְּעִירָא לָא תִתֵּן תַּשְׁמִישָׁךְ לְאִסְתָּאֲבָא בָּהּ וְאִתְּתָא לָא תִקְרַב קֳדָם בְּעִירָא לְאִתְהַנְיָא מִינֵיהּ תִּבְלָא הוּא", "pj_en": "Neither shalt thou lie with any beast to corrupt thyseIf therewith nor shall any woman approach before a beast for evil pleasure; it is confusion.", "tj": "", "tj_en": "", "rashi": "<b>תבל הוא.<\/b> לְשׁוֹן קָדֵשׁ וְעֶרְוָה וְנִאוּף, וְכֵן וְאַפִּי עַל תַּבְלִיתָם (ישעיהו י'); דָּבָר אַחֵר תֶּבֶל הוּא לְשׁוֹן בְּלִילָה וְעִרְבּוּב זֶרַע אָדָם וְזֶרַע בְּהֵמָה:", "rashi_en": "תבל הוא THIS IS CONFUSION — תבל is an expression used for unchastity, incest and adultery. Similar is (Jeremiah 10:25) “Mine anger because of their depravity (תבליתם)\". Another explanation of תבל הוא: it is an expression denoting the mingling (root בלל) and fusion of the human seed and the animal seed."}, {"ch": 18, "v": 24, "aliyah": 7, "heb": "אַל־תִּֽטַּמְּא֖וּ בְּכׇל־אֵ֑לֶּה כִּ֤י בְכׇל־אֵ֙לֶּה֙ נִטְמְא֣וּ הַגּוֹיִ֔ם אֲשֶׁר־אֲנִ֥י מְשַׁלֵּ֖חַ מִפְּנֵיכֶֽם׃", "onk": "לָא תִסְתַּאֲבוּן בְּכָל אִלֵּין אֲרֵי בְכָל אִלֵּין אִסְתָּאָבוּ עַמְמַיָּא דִּי אֲנָא <b>מַגְלֵי<\/b> מִן קֳדָמֵיכוֹן:", "onk_en": "Do not defile yourselves in any one of these [ways], for in all of these [ways] the nations have become defiled [those] that I am driving away [<b>exiling<\/b>] from before you.", "pj": "לָא תִסְתַּאֲבוּן בַּחֲדָא מִכָּל אִילֵין אֲרוּם בְּכָל אִילֵין אִיסְתַּאֲבוּ עַמְמַיָא דַאֲנָא מַגְלֵי מִן קָדָמֵיכוֹן", "pj_en": "Defile not yourselves by any one of all these; for by all these have the peoples defiled themselves whom I am about to drive away from before you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 25, "aliyah": 7, "heb": "וַתִּטְמָ֣א הָאָ֔רֶץ וָאֶפְקֹ֥ד עֲוֺנָ֖הּ עָלֶ֑יהָ וַתָּקִ֥א הָאָ֖רֶץ אֶת־יֹשְׁבֶֽיהָ׃", "onk": "וְאִסְתָּאָבַת אַרְעָא וְאַסְעָרִית חוֹבַהּ עֲלַהּ וְרוֹקֵינַת אַרְעָא יָת יָתְבָהָא:", "onk_en": "The land became defiled and I judged its iniquities upon it and the land expelled its inhabitants.", "pj": "וְאִסְתַּאֲבָא אַרְעָא וְאַסְעָרִית חוֹבָאָה עֲלָהּ וּפְלָטַת אַרְעָא יַת דַיְירָהָא", "pj_en": "And the land hath been defiled, and I have visited the guilt upon it, and the land delivereth itself of its inhabitants.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 26, "aliyah": 7, "heb": "וּשְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת־חֻקֹּתַי֙ וְאֶת־מִשְׁפָּטַ֔י וְלֹ֣א תַעֲשׂ֔וּ מִכֹּ֥ל הַתּוֹעֵבֹ֖ת הָאֵ֑לֶּה הָֽאֶזְרָ֔ח וְהַגֵּ֖ר הַגָּ֥ר בְּתוֹכְכֶֽם׃", "onk": "וְתִטְּרוּן אַתּוּן יָת קְיָמַי וְיָת דִּינַי וְלָא תַעְבְּדוּן מִכֹּל תּוֹעֶבְתָּא הָאִלֵּין <b>יַצִּיבָא<\/b> וְגִיּוֹרָא <b>דְּיִתְגַּיְּרוּן<\/b> בֵּינֵיכוֹן:", "onk_en": "You shall adhere to My statutes and to My laws and not do any of these abominations [both] the native born [<b>settled one<\/b>] and the proselyte who resides [<b>converts<\/b>] among you.", "pj": "וְתִיטְרוּן אַתּוּן כְנִישְׁתָּא דְיִשְרָאֵל יַת קְיָימַי וְיַת סִדְרֵי דִינַי וְלָא תַעַבְדוּן חֲדָא מִכָּל תּוֹעֶבְיָא הָאִילֵין יַצִיבַיָא וְגִיוֹרַיָא דִי יִתְגַיְירוּן בֵּינֵיכוֹן", "pj_en": "But you, O congregation of Israel, observe My statutes, and the order of My judgments, and commit not one of these abominations, neither (you who are) native born, or the strangers who sojourn among you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 27, "aliyah": 7, "heb": "כִּ֚י אֶת־כׇּל־הַתּוֹעֵבֹ֣ת הָאֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי־הָאָ֖רֶץ אֲשֶׁ֣ר לִפְנֵיכֶ֑ם וַתִּטְמָ֖א הָאָֽרֶץ׃", "onk": "אֲרֵי יָת כָּל תּוֹעֶבְתָּא הָאִלֵּין עֲבָדוּ אֱנָשֵׁי אַרְעָא דִּי קֳדָמֵיכוֹן וְאִסְתָּאָבַת אַרְעָא:", "onk_en": "For all of these abominations were done by the people of the land who came before you and the land became defiled.", "pj": "אֲרוּם יַת תּוֹעֵיבְתָּא הָאִילֵין עָבָדוּ אִינְשֵׁי אַרְעָא דִקְדָמֵיכוֹן וְאִסְתְּאָבַת אַרְעָא", "pj_en": "For these abominable things have been done by the men of the land who have been before you, so that the land hath been polluted:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 18, "v": 28, "aliyah": 7, "heb": "וְלֹֽא־תָקִ֤יא הָאָ֙רֶץ֙ אֶתְכֶ֔ם בְּטַֽמַּאֲכֶ֖ם אֹתָ֑הּ כַּאֲשֶׁ֥ר קָאָ֛ה אֶת־הַגּ֖וֹי אֲשֶׁ֥ר לִפְנֵיכֶֽם׃", "onk": "וְלָא תְרוֹקֵן אַרְעָא יָתְכוֹן בְּסָאֳבֵיכוֹן יָתַהּ כְּמָא דְרוֹקֵינַת יָת <b>עַמְמַיָּא<\/b> דִּי קֳדָמֵיכוֹן:", "onk_en": "[So that] the land not expel you when you defile it as it expelled the nation [<b>nations<\/b>] before you.", "pj": "וְלָא תִפְלוֹט אַרְעָא יַתְכוֹן בְּסָאוֹבְכוּן יָתָהּ הֵיכְמָא דִפְלָטַת יַת עַמָא דִקְדָמֵיכוֹן", "pj_en": "lest, when you pollute the land, it cast you forth, as it will have delivered itself of the people that were before you.", "tj": "וְלָא תִפְלוֹט אַרְעָא יַתְכוֹן:", "tj_en": "And the land cast you not forth.", "rashi": "<b>ולא תקיא הארץ אתכם.<\/b> מָשָׁל לְבֶן מֶלֶךְ שֶׁהֶאֱכִילוּהוּ דָּבָר מָאוּס, שֶׁאֵין עוֹמֵד בְּמֵעָיו אֶלָּא מְקִיאוֹ, כָּךְ אֶרֶץ יִשְׂרָאֵל אֵינָהּ מְקַיֶּמֶת עוֹבְרֵי עֲבֵרָה (ספרא סוף קדושים), וְתַרְגּוּמוֹ וְלָא תְרוֹקֵן, לְשׁוֹן רִקּוּן — מְרִיקָה עַצְמָהּ מֵהֶם:", "rashi_en": "ולא תקיא הארץ אתכם THAT THE LAND VOMIT NOT YOU OUT — A parable! This may be compared to the case of a prince (i. e. a sensitive, refined person) to whom one gives a disgusting thing to eat which he cannot retain on his stomach but vomits it out thus Eretz-Yisrael is unable to retain sinners on its soil (Sifra, Kedoshim, Chapter 12 14). The Targum renders it by: ולא תרוקן a term for ״emptying out״ — it (the earth) empties itself of them."}, {"ch": 18, "v": 29, "aliyah": 7, "heb": "כִּ֚י כׇּל־אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִכֹּ֥ל הַתּוֹעֵבֹ֖ת הָאֵ֑לֶּה וְנִכְרְת֛וּ הַנְּפָשׁ֥וֹת הָעֹשֹׂ֖ת מִקֶּ֥רֶב עַמָּֽם׃", "onk": "אֲרֵי כָּל דִּי יַעְבֵּד מִכֹּל תּוֹעֶבְתָּא הָאִלֵּין וְיִשְׁתֵּיצוּן נַפְשָׁתָא דִיַעְבְּדוּן מִגּוֹ עַמְּהוֹן:", "onk_en": "For anyone who will do any of these abominations, their souls shall be cut off, those who do these things, from among their people.", "pj": "אֲרוּם כָּל מַאן דְיֶעֱבַד חֲדָא מִכָּל תּוֹעֵיבְתָּא הָאִילֵין וְיִשְׁתֵּיצְיַין נַפְשָׁתָא דִיעַבְדוּן הֵכְדֵין מִגוֹ עַמְמֵיהֶן", "pj_en": "For whoever committeth any one of these abominations, the souls who do so shall be destroyed from among their people.", "tj": "", "tj_en": "", "rashi": "<b>הנפשות העשת.<\/b> הַזָּכָר וְהַנְּקֵבָה בְמַשְׁמָע (ספרא):", "rashi_en": "העשת‏‎ הנפשות ‎‏‎‎EVEN THE SOULS THAT SHALL DO THEM [SHALL BE CUT OFF] — Both men and women are implied by the plural הנפשות (in contrast to the sing. יעשה in the beginning of the verse) (Sifra, Acharei Mot, Chapter 13 20)."}, {"ch": 18, "v": 30, "aliyah": 7, "heb": "וּשְׁמַרְתֶּ֣ם אֶת־מִשְׁמַרְתִּ֗י לְבִלְתִּ֨י עֲשׂ֜וֹת מֵחֻקּ֤וֹת הַתּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִפְנֵיכֶ֔ם וְלֹ֥א תִֽטַּמְּא֖וּ בָּהֶ֑ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִטְּרוּן יָת <b>מַטְּרַת מֵימְרִי<\/b> בְּדִיל דְּלָא לְמֶעְבַּד מִנִּימוֹסֵי תוֹעֶבְתָּא דְּאִתְעֲבָדָא קֳדָמֵיכוֹן וְלָא תִסְתַּאֲבוּן בְּהוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "You shall keep my watch [<b>the watch of My Word<\/b>] that you shall not do any of the abominable customs that were done before you and you will not defile yourselves through them. I am Adonoy, your God.", "pj": "וְתִטְרוּן יַת מַטְרַת מֵימְרִי לְאִזְדַהֲרָא מְטוֹל לְמֶעֱבַד מִנִימוּסֵי תּוֹעֵבְתָּא דְאִיתְעַבִידוּ בְּאַרְעָא קֳדָמֵיכוֹן וְלָא תִסְתַּאֲבוּן בְּהוֹן אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "Observe you (then) the keeping of My Word, in being careful to avoid the practice of these abominable rites, which have been practised in the land before you, and the defilement of yourselves by them: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ושמרתם את משמרתי.<\/b> לְהַזְהִיר בֵּית דִּין עַל כָּךְ (שם):<br><br><b>ולא תטמאו בהם אני ה' אלהיכם.<\/b> הָא אִם תִּטַּמְּאוּ אֵינִי אֱלֹהֵיכֶם, וְאַתֶּם נִפְסָלִים מֵאַחֲרַי, וּמַה הֲנָאָה יֵשׁ לִי בָּכֶם וְאַתֶּם מִתְחַיְּבִים כְּלָיָה? לְכָךְ נֶאֱמַר אֲנִי ה' אֱלֹהֵיכֶם (שם):", "rashi_en": "ושמרתם את משמרתי THEREFORE SHALL YE KEEP (OR, WATCH OVER) MY CHARGE — This is intended to caution the court regarding this (Sifra, Acharei Mot, Chapter 13 22).<br><br>ולא תטמאו בהם אני ה' אלהיכם AND IF YE DEFILE NOT YOURSELVES THEREIN, I AM THE LORD YOUR GOD — If, however, you do defile yourselves I shall no longer be your God (אלהיכם) since you have cut yourselves off from following after Me. What use then can I have of you? Consequently you deserve annihilation! That is why Scripture states: I am the Lord your God (Sifra, Acharei Mot, Chapter 13 22)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
