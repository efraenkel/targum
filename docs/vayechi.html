on thee, upon the blessings wherewith thy fathers Abraham and Izhak who are like mountains blessed thee, and upon the blessing of the four mothers' Sarah, Rivekah, Rahel, and Leah, who are like hills; let all these blessings come, and make a diadem of majesty upon the head of Joseph, and upon the crown of the man who became a chief and ruler in the land of Mizraim, and the brightness of the glory of his brethren.", "rashi": "<b>ברכת אביך גברו וגו'.<\/b> הַבְּרָכוֹת שֶׁבֵּרְכַנִי הַקָּבָּ\"ה גָּבְרוּ וְהָלְכוּ עַל הַבְּרָכוֹת שֶׁבֵּרַךְ אֶת הוֹרַי:<br><br><b>עד תאות גבעת עולם.<\/b> לְפִי שֶׁהַבְּרָכוֹת שֶׁלִּי גָּבְרוּ עַד סוֹף גְּבוּלֵי גִּבְעוֹת עוֹלָם, שֶׁנָּתַן לִי בְּרָכָה פְרוּצָה בְּלִי מְצָרִים, מַגַּעַת עַד אַרְבַּע קְצוֹת הָעוֹלָם, שֶׁנֶּאֱמַר וּפָרַצְתָּ יָמָּה וָקֵדְמָה וְגוֹ', מַה שֶּׁלֹּא אָמַר לְאַבְרָהָם אָבִינוּ וּלְיִצְחָק; לְאַבְרָהָם אָמַר שָׂא נָא עֵינֶיךָ וּרְאֵה צָפוֹנָה וְגוֹ' כִּי אֶת כָּל הָאָרֶץ אֲשֶׁר אַתָּה רֹאֶה לְךָ אֶתְּנֶנָּה, וְלֹא הֶרְאָהוּ אֶלָּא אֶרֶץ יִשְׂרָאֵל בִּלְבָד; לְיִצְחָק אָמַר לְךָ וּלְזַרְעֲךָ אֶתֵּן אֶת כָּל הָאֲרָצֹת הָאֵל וַהֲקִמֹתִי אֶת הַשְּׁבֻעָה וְגוֹ', וְזֶהוּ שֶׁאָמַר יְשַׁעְיָה (ישעיהו נ\"ח) וְהַאֲכַלְתִּיךָ נַחֲלַת יַעֲקֹב אָבִיךָ, וְלֹא אָמַר נַחֲלַת אַבְרָהָם:<br><br><b>הורי.<\/b> לְשׁוֹן הֵרָיוֹן, שֶׁהוֹרוּנִי בִּמְעֵי אִמִּי, כְּמוֹ הֹרָה גָבֶר (איוב ג'):<br><br><b>עד תאות.<\/b> עַד קְצוֹת, כְּמוֹ וְהִתְאַוִּיתֶם לָכֶם לִגְבוּל קֵדְמָה (במדבר ל\"ד), תְּתָאוּ לְבֹא חֲמָת (שם):<br><br><b>תאות.<\/b> אשׁמו\"לץ בְּלַעַז, כָּךְ חִבְּרוֹ מְנַחֵם בֶּן סָרוּק. וְאֻנְקְלוֹס תִּרְגֵּם תַּאֲוַת עוֹלָם לְשׁוֹן תַּאֲוָה וְחֶמְדָה, וְגִבְעוֹת לְשׁוֹן מְצֻקֵי אֶרֶץ שֶׁחִמְּדַתָּן אִמּוֹ וְהִזְקִיקַתּוּ לְקַבְּלָם:<br><br><b>תהיין.<\/b> כֻּלָּם לְרֹאשׁ יוֹסֵף:<br><br><b>נזיר אחיו.<\/b> פְּרִישָׁא דַּאֲחוֹהִי, שֶׁנִּבְדַּל מֵאֶחָיו, כְּמוֹ וְיִנָּזְרוּ מִקָּדְשֵׁי בְנֵי יִשְׂרָאֵל (ויקרא כ\"ב), נָזֹרוּ אָחוֹר (ישעיהו א'):", "rashi_en": "'ברכת אביך גברו וגו THE BLESSING OF THY FATHER HAVE PREVAILED etc. — The blessings which the Holy One, blessed be He, bestowed upon me are mighty beyond the blessings wherewith He blessed my progenitors<br><br>עד תאות גבעות עולם EVEN TO THE BOUNDARIES OF THE EVERLASTING HILLS — Because my blessings have prevailed, extending to the very ends of the bounds of the everlasting hills, for He gave me a blessing that bursts all bounds, one that has no limits, that reaches even unto the four corners of the world, as it is stated, (Genesis 28:14) “[God said to Jacob] and thou shalt spread abroad to the West and to the East [and to the North and to the South]”, an unqualified promise that was made neither to Abraham nor to Isaac. For to Abraham He said, (Genesis 13:14) “Lift up thine eyes and look northwards etc. … for all the land which thou seest to thee will I give it”, and He showed him only the Land of Israel. To Isaac He said, (Genesis 26:3) “for unto thee and unto thy seed will I give all these lands, and I will establish the oath [which I swore unto Abraham thy father]”. It is to this that Isaiah alludes when he said, (Isaiah 58:14) “And I will feed thee with the heritage of Jacob thy father” (Shabbat 118b), and he did not say, “with the heritage promised to Abraham”.<br><br>הורי is from a root meaning to conceive. The singular denotes “my father”, the one who made my mother conceive me. We find a similar use of the verb in (Job 3:3) “A man is causing a woman to conceive (הוֹרָה).”<br><br>עד תאות means UNTO THE ENDS — The word is connected with the verbs in (Numbers 36:10) “And ye shall mark out the ends (והתאויתם) for the east border”, and (Numbers 5:8) “you shall mark out the ends (תתאו) unto the entrance of Hamath”.<br><br>תאות means in old French émoulis. Thus (i.e. with these words) did Menachem ben Seruk classify it (תאות). Onkelos translates (תאות (גבעת עולם in the sense of desire (תאוה) and longing and takes גבעת as a figurative expression for “the great ones”, like (1 Samuel 2:8) “the pillars of the earth”, meaning the righteous of the earth — viz., he renders it by “the blessings for which the great ones of the earth longed”, referring to the blessings which his mother so much desired that she forced him to take steps to obtain them<br><br>תהיין THEY — all — SHALL BE ON THE HEAD OF JOSEPH.<br><br>נזיר אחיו means what the Targum has: פרישא דאחוהי. i.e. the one who was separated from his brothers. The word נזיר is of a root signifying separation, as in (Leviticus 22:2) “that they separate themselves (וינזרו) from the holy things of the children of Israel”; (Isaiah 1:4) “they have separated themselves from God (נזרו) turning backward”."}, {"ch": 49, "v": 27, "aliyah": 6, "heb": "בִּנְיָמִין֙ זְאֵ֣ב יִטְרָ֔ף בַּבֹּ֖קֶר יֹ֣אכַל עַ֑ד וְלָעֶ֖רֶב יְחַלֵּ֥ק שָׁלָֽל׃", "onk": "בִּנְיָמִין בְּאַרְעֵיהּ תִּשְׁרֵי שְׁכִנְתָּא וּבְאַחֲסַנְתֵּיהּ יִתְבְּנֵי מַקְדְּשָׁא בְּצַפְרָא וּבְפַנְיָא יְהוֹן מְקָרְבִין כַּהֲנַיָּא קָרְבָּנָא וּבְעִדַּן רַמְשָׁא יְהוֹן מְפַלְּגִין מוֹתַר חוּלְקְהוֹן מִשְּׁאַר קָדְשַׁיָּא:", "onk_en": "Binyamin is like a wolf that preys. [<b>: the Shechina will dwell in his land, and in his inheritance the Temple will be built.<\/b>] In the morning [<b>and towards evening<\/b>] he will eat a portion, [<b>the Cohanim will offer sacrifices,<\/b>] and in the evening he will divide the spoil [<b>and in the evening-time they will divide their left over share from other sacred things<\/b>].", "pj": "בִּנְיָמִין שֵׁבֶט תַּקִיף כְּדֵיבָא טַרְפֵיהּ בְּאַרְעֵיהּ תִּשְׁרֵי שְׁכִינַת מָרֵי עַלְמָא וּבְאַחְסַנְתֵּיהּ יִתְבְּנֵי בֵּית מוּקְדְשָׁא בְּצַפְרָא יְהוֹן כַּהֲנַיָא מְקַרְבִין אִימַר תְּדִירָא עַד אַרְבַּע שָׁעִין וּבֵינֵי שִׁמְשָׁתָא יְקַרְבוּן אִימַר תִּנְיַין וּבְרַמְשָׁא יְהוֹן מְפַלְגִין מוֹתַר שְׁאַר קוּרְבָּנַיָא וְאָכְלִין גְבַר חוּלְקֵיהּ", "pj_en": "Benjamin is a strong tribe, (like) the wolf (with) his prey. In his land will dwell the Shekina of the Lord of the world, and the house of the sanctuary be builded in his inheritance. In the morning will the priests offer the lamb continually until the fourth hour, and between the evenings the second lamb, and at eventide will they divide the residue remaining of the offering, and eat, every man, his portion.", "tj": "בִּנְיָמִין מְדַמֵי לֵיהּ לְדוֹב חָטוּף בִּתְחוּמֵיהּ יִתְבְּנֵי מַקְדְשָׁא וּבְאַחֲסַנְתֵּיהּ תִּשְׁרֵי אִיקַר שְׁכִינְתָּא דַיְיָ בְּצַפְרָא יֶהֱוַון כַּהֲנַיָא מְקַרְבִין אִימַר תְּמִידָא וּמִנְחָתֵיהּ וְעִם מִטְמָעֵי שִׁמְשָׁא יֶהֱוַון כַהֲנַיָא מְקַרְבִין אִימַר תְּמִידָא וּמִנְחָתֵיהּ וּבְרַמְשָׁא יֶהֱוַון מְפַלְגִין קוּרְבָּנַיָא דִבְנֵי יִשְרָאֵל:", "tj_en": "BENJAMIN I will liken him to a ravening wolf. In his limits will the sanctuary be builded, and in his inheritance the glory of the Shekina of the Lord will dwell. In the morning will the priests offer the continual lamb and its oblations, and at the going down of the sun will the priests offer the continual lamb and its oblations, and at evening divide the offerings of the sons of Israel.", "rashi": "<b>בנימין זאב יטרף.<\/b> זְאֵב הוּא אֲשֶׁר יִטְרָף; נִבָּא עַל שֶׁיִּהְיוּ עֲתִידִין לִהְיוֹת חַטְפָנִין, וַחֲטַפְתֶּם לָכֶם אִישׁ אִשְׁתּוֹ בְּפִלֶגֶשׁ בְּגִבְעָה (שופטים כ\"א), וְנִבָּא עַל שָׁאוּל שֶׁהָיָה נוֹצֵחַ בְּאוֹיְבָיו סָבִיב, שֶׁנֶּאֱמַר וְשָׁאוּל לָכַד הַמְּלוּכָה וַיִּלָּחֶם בְּמוֹאָב וְגוֹ' וּבֶאֱדוֹם וְגוֹ' וּבְכֹל אֲשֶׁר יִפְנֶה יַרְשִׁיעַ (שמואל א י\"ד):<br><br><b>בבקר יאכל עד.<\/b> לְשׁוֹן בִּזָּה וְשָׁלָל, הַמְתֻרְגָּם עֲדָאָה, וְעוֹד יֵשׁ לוֹ דּוֹמֶה בִּלְשׁוֹן עִבְרִית אָז חֻלַּק עַד שָׁלָל (ישעיהו ל\"ג), וְעַל שָׁאוּל הוּא אוֹמֵר שֶׁעָמַד בִּתְחִלַּת פְּרִיחָתָן וּזְרִיחָתָן שֶׁל יִשְׂרָאֵל:<br><br><b>ולערב יחלק שלל.<\/b> אַף מִשֶּׁתִּשְׁקַע שִׁמְשָׁן שֶׁל יִשְׂרָאֵל עַל יְדֵי נְבוּכַדְנֶצַּר, שֶׁיַּגְלֵם לְבָבֶל, <b>יחלק שלל<\/b>, מָרְדְּכַי וְאֶסְתֵּר שֶׁהֵם מִבִּנְיָמִין יְחַלְּקוּ אֶת שְׁלַל הָמָן, שֶׁנֶּאֱמַר הִנֵּה בֵית הָמָן נָתַתִּי לְאֶסְתֵּר. וְאֻנְקְלוֹס תִּרְגֵּם עַל שְׁלַל הַכֹּהֲנִים בְּקָדְשֵׁי הַמִּקְדָּשׁ:", "rashi_en": "בנימן זאב יטרף means BENJAMIN IS A WOLF THAT TEARETH (i.e. “wolf” is not the object of the sentence but the word אשר must be supplied before יטרף). He prophesied that they (Benjamin’s descendants) will be “rapacious” in the time to come; thus the Benjamites were told (Judges 21:21) “and catch you every man his wife”, as you will find in the story of the concubine of Gibeah. Further he was prophesying concerning Saul (who was of this tribe) who vanquished his enemies on all sides, as it is said (1 Samuel 14:47) “So Saul took the kingdom… and fought on every side… against Moab… and against Edom… and whithersoever he turned himself he put them to the worse”. <br><br>בבקר יאכל עד IN THE MORNING HE EATETH HIS PREY — עד is an Aramaic word synonymous with the Hebrew words בזה and שלל, prey, which are rendered in the Targum by עדאה; and there is another example of its use in the Hebrew text of the Bible: (Isaiah 33:23) “Then is the prey of great spoil (עד שלל) divided”. He (Jacob) says this (“in the morning eateth his prey”) with reference to Saul who rose as Israel’s champion in the period when Israel began to flourish and shine (i.e. in the morning of his history; indeed some editions have “בקרן”, at the morning-dawn of Israel, instead of פריחתן) (Midrash Tanchuma, Vayechi 14).<br><br>ולערב יחלק שלל AND AT EVEN HE DIVIDETH THE SPOIL— even after the sun of Israel will have set through Nebuchadnezzar who will exile them to Babel, יחלק שלל HE WILL DIVIDE THE SPOIL, viz., Mordecai and Esther who will be of the tribe of Benjamin will divide the spoil of Haman, as it is said, (Ester 3:7) “Behold, I have given Esther the house of Haman” (Cf. Midrash Tanchuma, Vayechi 14). Onkelos translates it as having a reference to the portions which the priests received of the holy sacrifices in the Temple which was situated in the territory of Benjamin."}, {"ch": 49, "v": 28, "aliyah": 6, "heb": "כׇּל־אֵ֛לֶּה שִׁבְטֵ֥י יִשְׂרָאֵ֖ל שְׁנֵ֣ים עָשָׂ֑ר וְ֠זֹ֠את אֲשֶׁר־דִּבֶּ֨ר לָהֶ֤ם אֲבִיהֶם֙ וַיְבָ֣רֶךְ אוֹתָ֔ם אִ֛ישׁ אֲשֶׁ֥ר כְּבִרְכָת֖וֹ בֵּרַ֥ךְ אֹתָֽם׃", "onk": "כָּל אִלֵּין שִׁבְטַיָּא דְיִשְׂרָאֵל תְּרֵין עֲסַר וְדָא דְּמַלֵּיל לְהוֹן אֲבוּהוֹן וּבָרִיךְ יָתְהוֹן גְּבַר דִּי כְבִרְכְּתֵיהּ בָּרֵךְ יָתְהוֹן:", "onk_en": "All these are tribes of Israel, twelve [of them]; and this is what their father spoke to them and he blessed them. He blessed them each with his own unique blessing.", "pj": "כָּל אִלֵין שִׁבְטַיָא דְיִשְרָאֵל תְּרֵיסַר כּוּלְהוֹן צַדִיקִין כַּחֲדָא וְהָא דְמַלֵיל לְהוֹן אֲבוּהוֹן וּבְרִיךְ יַתְהוֹן אֵינַשׁ הֵי כְּבִרְכָתֵיהּ בְּרִיךְ יַתְהוֹן", "pj_en": "All these Tribes of Israel are twelve: they are all righteous together, and this it is which their father spake to them, and blessed them; according to his blessing blessed be each man.", "tj": "", "tj_en": "", "rashi": "<b>וזאת אשר דבר להם אביהם ויברך אותם.<\/b> וַהֲלֹא יֵשׁ מֵהֶם שֶׁלֹּא בֵּרְכָם אֶלָּא קִנְטְרָן? אֶלָּא כָךְ פֵּרוּשׁוֹ: וְזֹאת אֲשֶׁר דִּבֶּר לָהֶם אֲבִיהֶם מַה שֶּׁנֶאֱמַר בָּעִנְיָן; יָכוֹל שֶׁלֹּא בֵרַךְ לִרְאוּבֵן, שִׁמְעוֹן וְלֵוִי, תַּ\"לֹ וַיְבָרֶךְ אוֹתָם – כֻּלָּם בְּמַשְׁמָע:<br><br><b>איש אשר כברכתו.<\/b> בְּרָכָה הָעֲתִידָה לָבֹא עַל כָּל אֶחָד וְאֶחָד:<br><br><b>ברך אותם.<\/b> לֹא הָיָה לוֹ לוֹמַר אֶלָּא אִישׁ אֲשֶׁר כְּבִרְכָתוֹ בֵּרַךְ אוֹתוֹ, מַה תַּלְמוּד לוֹמַר בֵּרַךְ אוֹתָם? לְפִי שֶׁנָּתַן לִיהוּדָה גְּבוּרַת אֲרִי וּלְבִנְיָמִין חֲטִיפָתוֹ שֶׁל זְאֵב וּלְנַפְתָּלִי קַלּוּתוֹ שֶׁל אַיָּל, יָכוֹל שֶׁלֹּא כְלָלָן כֻּלָּם בְּכָל הַבְּרָכוֹת, תַּלְמוּד לוֹמַר בֵּרַךְ אוֹתָם:", "rashi_en": "וזאת אשר דבר להם אביהם ויברך אתם AND THIS IS IT THAT THEIR FATHER SPOKE UNTO THEM WHEN (literally, and) HE BLESSED THEM — But were there not some of his sons whom he did not bless but whom, on the contrary, he reproached? But this is the explanation of these words: and this is it that their father spake unto them, viz., all that has been said above in this chapter, whether it be blessing or reproach. You might therefore think that he did not bless Reuben, Simeon and Levi at all — Scripture therefore states, “and he blessed them” (i.e. the 12 tribes alluded to at the beginning of the verse) which implies all of them. (Pesikta Rabbati 7).<br><br>EVERY MAN ACCORDING TO HIS BLESSING — according to the blessing that was to come in future to each and every one. (Cf. Rashi on Genesis 40:5, איש כפתרון חלמו.)<br><br>ברך אתם HE BLESSED THEM — It should have said, “every man according to his blessing he blessed him”; why, then does it say “he blessed them”? But since in the blessings he ascribed to Judah personally “the strength of a lion”, to Benjamin “the rapacity of a wolf” and to Naphtali “the swiftness of a hind”, one might think that he did not include all of them in all the blessings, Scripture therefore states “he blessed them” (i.e. each of them personally and all of them together — extending all the personal blessings to each of them) (Midrash Tanchuma, Vayechi 16; cf. Rashi on Exodus 1:19)."}, {"ch": 49, "v": 29, "aliyah": 6, "heb": "וַיְצַ֣ו אוֹתָ֗ם וַיֹּ֤אמֶר אֲלֵהֶם֙ אֲנִי֙ נֶאֱסָ֣ף אֶל־עַמִּ֔י קִבְר֥וּ אֹתִ֖י אֶל־אֲבֹתָ֑י אֶ֨ל־הַמְּעָרָ֔ה אֲשֶׁ֥ר בִּשְׂדֵ֖ה עֶפְר֥וֹן הַֽחִתִּֽי׃", "onk": "וּפַקֵּד יָתְהוֹן וַאֲמַר לְהוֹן אֲנָא מִתְכְּנֵשׁ לְעַמִּי קְבָרוּ יָתִי לְוַת אֲבָהָתָי בִּמְעַרְתָּא דִּי בַחֲקַל עֶפְרוֹן חִתָּאָה:", "onk_en": "He commanded them, and said to them, I shall be gathered to my people; bring me for burial to my fathers, to the cave that is in the field of Ephron the Chittite.", "pj": "וּפַקֵיד יַתְהוֹן וַאֲמַר לְהוֹן אֲנָא מִתְכְּנִישׁ לְעַמִי קְבָרוּ יָתִי לְוַת אַבְהָתִי לִמְעַרְתָּא דִי בַּחֲקַל עֶפְרוֹן חִתָּאָה", "pj_en": "And he commanded them and said to them, I am to be gathered to my people; bury me with my fathers in the cavern which is in the field of Ephron the Hitah,", "tj": "", "tj_en": "", "rashi": "<b>נאסף אל עמי.<\/b> עַל שֵׁם שֶׁמַּכְנִיסִין הַנְּפָשׁוֹת אֶל מְקוֹם גְּנִיזָתָן, שֶׁיֵּשׁ אֲסִיפָה בְּלָשׁוֹן עִבְרִי שֶׁהִיא לְשׁוֹן הַכְנָסָה, כְּגוֹן וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה (שופטים י\"ט), וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ (דברים כ\"ב), בְּאָסְפְּכֶם אֶת תְּבוּאַת הָאָרֶץ (ויקרא כ\"ג), הַכְנָסָתָם לַבַּיִת מִפְּנֵי הַגְּשָׁמִים, בְּאָסְפְּךָ אֶת מַעֲשֶׂיךָ (שמות כ\"ג), וְכָל אֲסִיפָה הָאֲמוּרָה בְמִיתָה אַף הִיא לְשׁוֹן הַכְנָסָה:<br><br><b>אל אבתי.<\/b> עִם אֲבוֹתַי:", "rashi_en": "נאסף אל עמי [I AM] TO BE GATHERED UNTO MY PEOPLE — The expression נאסף “gathered” is used here because the souls are taken into a place in heaven where they are to be laid by. אסף in the Hebrew language has sometimes the meaning of “bringing something in to a place where it is to be kept” as e.g., (Judges 19:15) “For there was no man that took them into his house (אסף) [to lodge]”; (Deuteronomy 22:2) “then thou shalt bring it home (ואספתו) into thy house”; (Leviticus 23:39) “when you have taken in (באספכם) the fruit of the land” — which means bringing them in to the barn on account of the rain; (Exodus 23:16) “when thou hast taken in (באספך) thy labours”. So, too, the verb אסף used in connection with death always means “bringing in to the place where the souls are to be laid by”.<br><br>אל אבתי means with my fathers."}, {"ch": 49, "v": 30, "aliyah": 6, "heb": "בַּמְּעָרָ֞ה אֲשֶׁ֨ר בִּשְׂדֵ֧ה הַמַּכְפֵּלָ֛ה אֲשֶׁ֥ר עַל־פְּנֵי־מַמְרֵ֖א בְּאֶ֣רֶץ כְּנָ֑עַן אֲשֶׁר֩ קָנָ֨ה אַבְרָהָ֜ם אֶת־הַשָּׂדֶ֗ה מֵאֵ֛ת עֶפְרֹ֥ן הַחִתִּ֖י לַאֲחֻזַּת־קָֽבֶר׃", "onk": "בִּמְעַרְתָּא דִּי בַחֲקַל כָּפֶלְתָּא דִּי עַל אַפֵּי מַמְרֵא בְּאַרְעָא דִכְנָעַן דִּי זְבַן אַבְרָהָם יָת חַקְלָא מִן עֶפְרֹן חִתָּאָה לְאַחֲסָנַת קְבוּרָא:", "onk_en": "In the cave that is in the field of Machpeilah, which faces Mamrei in the land of Canaan; which Avraham bought, along with the field, from Ephron, the Chittite, for a possession as a burial place.", "pj": "בִּמְעַרְתָּא דִי בַּחֲקַל כְּפֵילְתָּא דְעַל אַפֵּי מַמְרֵא בְּאַרְעָא דִכְנָעַן דִזְבַּן אַבְרָהָם יַת חַקְלָא מִן עֶפְרוֹן חִתָּאָה לְאַחֲסָנַת קְבוּרְתָּא", "pj_en": "in the cave that is in the Double Field over against Mamre in the land of Kenaan; for Abraham bought the field of Ephron the Hitah for an inheritance of burial.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 49, "v": 31, "aliyah": 6, "heb": "שָׁ֣מָּה קָֽבְר֞וּ אֶת־אַבְרָהָ֗ם וְאֵת֙ שָׂרָ֣ה אִשְׁתּ֔וֹ שָׁ֚מָּה קָבְר֣וּ אֶת־יִצְחָ֔ק וְאֵ֖ת רִבְקָ֣ה אִשְׁתּ֑וֹ וְשָׁ֥מָּה קָבַ֖רְתִּי אֶת־לֵאָֽה׃", "onk": "תַּמָּן קְבָרוּ יָת אַבְרָהָם וְיָת שָׂרָה אִתְּתֵיהּ תַּמָּן קְבָרוּ יָת יִצְחָק וְיָת רִבְקָה אִתְּתֵיהּ וְתַמָּן קְבָרִית יָת לֵאָה:", "onk_en": "There they buried Avraham and Sarah, his wife, there they buried Yitzchok and Rivkah, his wife, and there I buried Leah.", "pj": "תַּמָן קְבָרוּ יַת אַבְרָהָם וְיַת שָרָה אִנְתְּתֵיהּ תַּמָן קָבְרוּ יַת יִצְחָק וְיַת רִבְקָה אִנְתְּתֵיהּ וְתַּמָן קְבָרִית יַת לֵאָה", "pj_en": "There they buried Abraham, and Sarah his wife; there they buried Izhak , and Rivekah his wife; and there I buried Leah:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 49, "v": 32, "aliyah": 6, "heb": "מִקְנֵ֧ה הַשָּׂדֶ֛ה וְהַמְּעָרָ֥ה אֲשֶׁר־בּ֖וֹ מֵאֵ֥ת בְּנֵי־חֵֽת׃", "onk": "זְבִינֵי חַקְלָא וּמְעַרְתָּא דִּי בֵיהּ מִן בְּנֵי חִתָּאָה:", "onk_en": "The purchase of the field and the cave that is in it was made from the sons of Cheis.", "pj": "זְבִינֵי חַקְלָא וּמְעַרְתָּא דְבֵיהּ מִן בְּנֵי חִתָּאָה", "pj_en": "the purchase of the field, and the cave that it is in, of the sons of Hitah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 49, "v": 33, "aliyah": 6, "heb": "וַיְכַ֤ל יַעֲקֹב֙ לְצַוֺּ֣ת אֶת־בָּנָ֔יו וַיֶּאֱסֹ֥ף רַגְלָ֖יו אֶל־הַמִּטָּ֑ה וַיִּגְוַ֖ע וַיֵּאָ֥סֶף אֶל־עַמָּֽיו׃", "onk": "וְשֵׁיצֵי יַעֲקֹב לְפַקָּדָא יָת בְּנוֹהִי וּכְנַשׁ רַגְלוֹהִי לְעַרְסָא וְאִתְנְגִיד וְאִתְכְּנִישׁ לְעַמֵּיהּ:", "onk_en": "Yaakov concluded his commands to his sons, and he gathered up his feet, to the bed. He expired and was gathered to his people.", "pj": "וּפְסַק יַעֲקב לְפַקְדָא יַת בְּנוֹי וּכְנֵישׁ רִגְלוֹי לְגוֹ דַרְגְשָׁא וְאִתְנְגִיד וְאִתְכְּנֵישׁ לְעַמֵיהּ", "pj_en": "And Jakob ceased to command his sons. And he gathered up his feet into the midst of the bed, and expired, and was gathered unto his people", "tj": "", "tj_en": "", "rashi": "<b>ויאסף רגליו.<\/b> הִכְנִיס רַגְלָיו:<br><br><b>ויגוע ויאסף.<\/b> וּמִיתָה לֹא נֶאֶמְרָה בוֹ, וְאָ\"רַ יַעֲקֹב אָבִינוּ לֹא מֵת:", "rashi_en": "ויאסף רגליו means HE BROUGHT HIS FEET into the bed. (Rashi tells us that ויאסף signifies הכניס, he brought in). <br><br>ויגוע AND HE EXPIRED — but the word death is not mentioned in his case, and our Teachers therefore said: (Taanit 5b) “Jacob, our father, is not dead”."}, {"ch": 50, "v": 1, "aliyah": 6, "heb": "וַיִּפֹּ֥ל יוֹסֵ֖ף עַל־פְּנֵ֣י אָבִ֑יו וַיֵּ֥בְךְּ עָלָ֖יו וַיִּשַּׁק־לֽוֹ׃", "onk": "וּנְפַל יוֹסֵף עַל אַפֵּי אָבוּהִי וּבְכָא עַלּוֹהִי וּנְשַׁק לֵיהּ:", "onk_en": "Yoseif fell on the face of his father, and wept over him and kissed him.", "pj": "וְאַרְבַּע יוֹסֵף יַת אָבוֹי בְּעֶרֶס דְשִׁנְדָפִין מְחַפְיָיא דְהַב טַב מִקְבְּעָא אַבְנִין טָבִין וּמְחַזְקָא בְּעִיטוּנֵי דְבוּץ תַּמָן הֲווֹ שַׁדְיַין חַמְרִין רְתִיחִין וְתַמָן מוֹקְדִין רֵישֵׁי בּוּסְמָנִין תַּמָן הֲווֹ קַיְימִין גִבָּרִין מִן דְבֵית עֵשָו וְגִבָּרִין מִן דְבֵית יִשְרָאֵל תַּמָן הֲוָה קָאִים אַרְיָא יְהוּדָה גִבָּרֵיהוֹן דְאָחוֹי עָנָא וַאֲמַר לְאָחוֹי אָתוּן וְנִבְנֵי עַל אֲבוּנָן אַרְזָא רָמָא דְרֵישֵׁיהּ מָטֵי עַד צֵית שְׁמַיָיא בְּרַם עַנְפּוֹי מַטְלָן עַל כָּל דַיְירֵי אַרְעָא וְשָׁרְשׁוֹי מַטְיַין עַד אַרְעַת תְּהוֹמָא מִנֵיהּ קָמוּ תְּרֵיסַר שִׁבְטִין מִנֵיהּ עָתִיד לְמֵיקוּם מַלְכִין וְשַׁלִיטִין וְכַהֲנַיָיא בִּפְלוּגְתְּהוֹן לְקַרְבָא קוּרְבָּנִין וּמִנֵיהּ לֵיוָאֵי בְמַחֲלוּקְתְהוֹן לְזִמְרָא הָא בְּכֵן אִתְרְכִין יוֹסֵף עַל אַנְפֵּי אָבוֹי וּבְכָא עֲלוֹי וּנְשֵׁיק לֵיהּ", "pj_en": "And Joseph laid his father upon a couch of ivory which was framed with pure gold, and inlaid with precious stones, and secured with cords of byssus. There they poured out fervid wines, and there burned they most costly perfumes: there stood the chiefs of the house of Esau and the chiefs of the house of Ishmael; there stood the Lion of Jehuda, the strength of his brethren. He answered and said to his brethren, Come, and let as raise up to our father a tall cedar whose head shall reach to the top of heaven, and its branches overshadow all the inhabitants of the earth, and its roots extend to the depths of the abyss: from it have arisen the twelve tribes, and from it will arise kings, princes, and priests in their divisions, to offer oblations, and from it the Levites in their appointments for singing. Then, behold, Joseph bowed himself upon his father's face, and wept over him, and kissed him.", "tj": "וְאַרְבַּע יוֹסֵף בְּעֶרֶס דְשִׁינְדָפִין דִמְחַפְיָא דְהַב וּמַקְבְּעָא מַרְגָלִין וּמְחוֹקָא בְּמָאנֵי בוּצָא וְאַרְגְוָנָא תַּמָן שָׁפְכִין חַמְרִין וְרֵחָנִין טָבִין תַּמָן מוֹקְדִין בּוּסְמָנִין תַּמָן קַיְימִין גוּבְרִין מִן בְּנוֹי דְעֵשָו תַּמָן קַיְימִין שִׁלְטוֹנִין מִן בְּנוֹי דְיִשְׁמָעֵאל תַּמָן קָאִים אַרְיֵה יְהוּדָה גִבָּרֵיהוֹן דְאָחוֹי עָנֵי יְהוּדָה וַאֲמַר לְאָחוֹי אִיתוּי נִבְנֵי לַאֲבוּנָן אַרְזָא רָמָא דְרֵישׁוֹי מָטֵי עַד צֵית שְׁמַיָא בְּרַם שׁוֹרְשׁוֹי עַד דָרֵי עַלְמָא דְמִנֵיהּ קָמוּ תְּרֵי עֲשַרְתֵּי שִׁבְטִין דְמִינֵיהּ קָמוּ כַּהֲנַיָא בַּחֲצוֹצַרְתֵּיהוֹן וְלֵוָאֵי בְכִנְרֵיהוֹן וּבְכֵין אַרְכִין יוֹסֵף בְּאַפּוֹי דְאָבוֹי וּבְכָא עֲלוֹי וּנְשֵׁיק יָתֵיהּ:", "tj_en": "And Joseph laid him on a couch of ivory which was covered with pure gold, and inset with pearls, and spread with clothes of byssos and purple. There they poured out wine with choice perfumes, there they burned aromatic gums; there stood the chiefs of the house of Esau; there stood the princes of the house of Ishmael there stood the Lion Jehuda, the strength of his brethren. And Jehuda answered and said to his brethren, Come, let us raise up to our father a tall cedar, whose head shall reach to heaven, but whose branches unto the inhabitants of the world. From it have arisen the twelve tribes, from it the priests with their trumpets and the Levites with their harps. And they wept, and Joseph bowed himself on the face of his father, and wept over him and kissed him.", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 2, "aliyah": 6, "heb": "וַיְצַ֨ו יוֹסֵ֤ף אֶת־עֲבָדָיו֙ אֶת־הָרֹ֣פְאִ֔ים לַחֲנֹ֖ט אֶת־אָבִ֑יו וַיַּחַנְט֥וּ הָרֹפְאִ֖ים אֶת־יִשְׂרָאֵֽל׃", "onk": "וּפַקִּיד יוֹסֵף יָת עַבְדּוֹהִי יָת אַסְוָתָא לְמֶחְנַט יָת אָבוּהִי וְחָנְטוּ אַסְוָתָא יָת יִשְׂרָאֵל:", "onk_en": "Yoseif commanded his servants, the physicians, to embalm his father and the physicians embalmed Yisrael.", "pj": "וּפְקַד יוֹסֵף יַת עַבְדוֹי יַת אַסְוָותָא לְבַסְמָא יַת אָבוֹי וּבְסִימוּ אַסְוָותָא יַת יִשְרָאֵל", "pj_en": "And Joseph commanded his servants the physicians to embalm his father; and the physicians embalmed Israel.", "tj": "", "tj_en": "", "rashi": "<b>לחנט את אביו.<\/b> עִנְיַן מִרְקַחַת בְּשָׂמִים הוּא:", "rashi_en": "לחנט את אביו TO EMBALM HIS FATHER — Embalming is a matter of using a mixture of aromatic spices. "}, {"ch": 50, "v": 3, "aliyah": 6, "heb": "וַיִּמְלְאוּ־לוֹ֙ אַרְבָּעִ֣ים י֔וֹם כִּ֛י כֵּ֥ן יִמְלְא֖וּ יְמֵ֣י הַחֲנֻטִ֑ים וַיִּבְכּ֥וּ אֹת֛וֹ מִצְרַ֖יִם שִׁבְעִ֥ים יֽוֹם׃", "onk": "וּשְׁלִימוּ לֵיהּ אַרְבְּעִין יוֹמִין אֲרֵי כֵּן שְׁלִימוּ יוֹמֵי חֲנִטַּיָּא וּבְכוֹ יָתֵיהּ מִצְרָאֵי שַׁבְעִין יוֹמִין:", "onk_en": "They completed forty days [of embalmment] for him, for that is the number of days required for embalming. The Egyptians wept for him seventy days.", "pj": "וּשְׁלִימוּ לֵיהּ מִן דְאִתְבְּסַם אַרְבְּעִין יוֹמִין אֲרוּם כְּדֵין שַׁלְמִין יוֹמֵי בַּסִימַיָיא וּבְכוּן יָתֵיהּ מִצְרָאֵי שׁוּבְעִין יוֹמִין אָמְרִין אִלֵין לְאִלֵין אִיתוּן נִבְכֵּי עַל יַעֲקב חֲסִידָא דְבִזְכוּתֵיהּ עֲדַת כַּפְנָא מִן אַרְעָא דְמִצְרַיִם דַהֲוָות גְזֵירְתָּא לְמֶהֱוֵי כַפְנָא אַרְבְּעִין וְתַרְתֵּין שְׁנִין וּבִזְכוּתֵיהּ דְיַעֲקב אִתְמַנְעָן אַרְבְּעִין שְׁנִין מִן מִצְרַיִם וְלָא הֲוָה כַּפְנָא אֱלָהֵן תַּרְתֵּין שְׁנִין בִּלְחוֹדֵיהוֹן", "pj_en": "And the forty days of embalming were completed to him; for so fulfil they the days of embalming; and the Mizraee lamented him seventy days; saying one to another, Come, let us lament over Jakob the Holy, whose righteousness turned away the famine from the land of Mizraim. For it had been decreed that there should be forty and two years of famine, but through the righteousness of Jakob forty years are withheld from Mizraim, and there came famine but for two years only.", "tj": "", "tj_en": "", "rashi": "<b>וימלאו לו.<\/b> הִשְׁלִימוּ לוֹ יְמֵי חֲנִיטָתוֹ עַד שֶׁמָּלְאוּ לוֹ מ' יוֹם:<br><br><b>ויבכו אתו מצרים שבעים יום.<\/b> מ' לַחֲנִיטָה וְל' לִבְכִיָּה, לְפִי שֶׁבָּאָה לָהֶם בְּרָכָה לְרַגְלוֹ, שֶׁכָּלָה הָרָעָב וְהָיוּ מֵי נִילוּס מִתְבָּרְכִין:", "rashi_en": "וימלאו לו [AND FORTY DAYS] WERE FULFILLED — They (the physicians) completed the days of embalming until forty days were completed for him.<br><br>ויבכו אתו מצרים שבעים יום AND THE EGYPTIANS WEPT FOR HIM THREESCORE AND TEN DAYS — viz., forty days during the period of embalming and thirty more days for mourning. They wept for him during so long a period because a blessing had come to them on his arrival in Egypt for the famine then ceased and the waters of the Nile again increased (Midrash Tanchuma, Nasso 26)."}, {"ch": 50, "v": 4, "aliyah": 6, "heb": "וַיַּֽעַבְרוּ֙ יְמֵ֣י בְכִית֔וֹ וַיְדַבֵּ֣ר יוֹסֵ֔ף אֶל־בֵּ֥ית פַּרְעֹ֖ה לֵאמֹ֑ר אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵ֣ינֵיכֶ֔ם דַּבְּרוּ־נָ֕א בְּאׇזְנֵ֥י פַרְעֹ֖ה לֵאמֹֽר׃", "onk": "וַעֲבָרוּ יוֹמֵי בְכִיתֵיהּ וּמַלֵּיל יוֹסֵף עִם בֵּית פַּרְעֹה לְמֵימָר אִם כְּעַן אַשְׁכָּחִית רַחֲמִין בְּעֵינֵיכוֹן מַלִּילוּ <b>כְעַן קֳדָם<\/b> פַּרְעֹה לְמֵימָר:", "onk_en": "[When] the days of weeping were over, Yoseif spoke to the house of Pharaoh saying, If I have found favor in your eyes, please [<b>now<\/b>] speak in [<b>before<\/b>] Pharaoh’s ears, saying.", "pj": "וַעֲבָרוּ יוֹמֵי בְכִיתֵיהּ וּמַלֵיל יוֹסֵף עִם רִבּוֹנֵי בֵּית פַּרְעה לְמֵימָר אִין בְּבָעוּ אַשְׁכַּחְנָא רַחֲמִין בְּעֵינֵיכוֹן מַלִילוּ כְּדוֹן בְּמִשְׁמְעֵיהּ דְפַרְעה לְמֵימָר", "pj_en": "And the days of his mourning passed. And Joseph spake with the lords of the house of Pharoh, saying If I may find favour in your eyes, speak now in the hearing of Pharoh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 5, "aliyah": 6, "heb": "אָבִ֞י הִשְׁבִּיעַ֣נִי לֵאמֹ֗ר הִנֵּ֣ה אָנֹכִי֮ מֵת֒ בְּקִבְרִ֗י אֲשֶׁ֨ר כָּרִ֤יתִי לִי֙ בְּאֶ֣רֶץ כְּנַ֔עַן שָׁ֖מָּה תִּקְבְּרֵ֑נִי וְעַתָּ֗ה אֶֽעֱלֶה־נָּ֛א וְאֶקְבְּרָ֥ה אֶת־אָבִ֖י וְאָשֽׁוּבָה׃", "onk": "אַבָּא קַיִּים עָלַי לְמֵימַר הָא אֲנָא מָאִית בְּקִבְרִי דְּאַתְקֵנִית לִי בְּאַרְעָא דִכְנַעַן תַּמָּן תִּקְבְּרִנָּנִי וּכְעַן אֶסַּק <b>כְּעַן<\/b> וְאֶקְבַּר יָת אַבָּא וְאֵיתוּב:", "onk_en": "My father made me swear [an oath] saying, Behold I am dying. In my grave that I have prepared for myself in the land of Canaan, there you shall bury me. Now therefore, please [<b>now<\/b>], I would go up and bury my father, and then I will return.", "pj": "אַבָּא קַיֵים עָלַי לְמֵימָר הָא אֲנָא מַיִית בְּקִבְרִי דַחֲפָרִית לִי בְּאַרְעָא דִכְנָעַן תַּמָן תִּקְבְּרִינַנִי וּכְדוֹן אִיסַק כְּדוֹן וְאִיקְבּוֹר יַת אַבָּא וְאֵיתוּב", "pj_en": "My father made me swear, saying, Behold, I die, in the sepulchre which I have prepared for me in the land of Kenaan there shalt thou bury me. And now let me go up and bury my father, and I will return.", "tj": "", "tj_en": "", "rashi": "<b>אשר כריתי לי.<\/b> כִּפְשׁוּטוֹ כְּמוֹ כִּי יִכְרֶה אִישׁ. וּמִדְרָשׁוֹ עוֹד מִתְיַשֵּׁב עַל הַלָּשׁוֹן, כְּמוֹ אֲשֶׁר קָנִיתִי, אָרַ\"עֲ כְּשֶׁהָלַכְתִי לִכְרַכֵּי הַיָּם הָיוּ קוֹרִין לִמְכִירָה כִּירָה, וְעוֹד מִדְרָשׁוֹ לְשׁוֹן כְּרִי דָגוּר, שֶׁנָּטַל יַעֲקֹב כָּל כֶּסֶף וְזָהָב שֶׁהֵבִיא מִבֵּית לָבָן וְעָשָׂה אוֹתוֹ כְּרִי וְאָמַר לְעֵשָׂו טֹל זֶה בִּשְׁבִיל חֶלְקְךָ בַּמְּעָרָה:", "rashi_en": "אשר כריתי לי means according to its plain sense “[the grave] which I have digged” just as (Exodus 21:33) “If a man shall dig (יכרה)”. There is a Midrashic explanation (Sotah 13a) which fits in with a meaning of the word כריתי, viz., אשר כריתי means אשר קניתי “which I have bought”. For R. Akiba said, “when I went to the coast-towns I heard them use for what we term מכירה “trading” the term כירה (Rosh Hashanah 26a). Another Midrashic explanation takes כריתי to be connected with כרי a piled up heap of grain, for Jacob had taken all the silver and gold which he had brought from the house of Laban and made a pile of it and said to Esau, “Take this for your share in the cave” (Midrash Tanchuma, Vayechi 6)."}, {"ch": 50, "v": 6, "aliyah": 6, "heb": "וַיֹּ֖אמֶר פַּרְעֹ֑ה עֲלֵ֛ה וּקְבֹ֥ר אֶת־אָבִ֖יךָ כַּאֲשֶׁ֥ר הִשְׁבִּיעֶֽךָ׃", "onk": "וַאֲמַר פַּרְעֹה סַק וּקְבוֹר יָת אָבוּךְ כְּמָא דְקַיִּים עֲלָךְ:", "onk_en": "Pharaoh said, Go up and bury your father, just as he made you swear.", "pj": "וַאֲמַר פַּרְעה סַק וּקְבוֹר יַת אָבוּךְ הֵיכְמָא דְקַיֵים עֲלָךְ", "pj_en": "And Pharoh said, Go up, and bury thy father, according as he made thee swear.", "tj": "", "tj_en": "", "rashi": "<b>כאשר השביעך.<\/b> וְאִם לֹא בִּשְׁבִיל הַשְּׁבוּעָה לֹא הָיִיתִי מַנִּיחֲךָ, אֲבָל יָרֵא לוֹמַר עֲבֹר עַל הַשְּׁבוּעָה שֶׁלֹּא יֹאמַר אִם כֵּן אֶעֱבֹר עַל הַשְּׁבוּעָה שֶׁנִּשְׁבַּעְתִי לְךָ, שֶׁלֹּא אֲגַלֶּה עַל לְשׁוֹן הַקֹּדֶשׁ שֶׁאֲנִי מַכִּיר עוֹדֵף עַל ע' לָשׁוֹן, וְאַתָּה אֵינְךָ מַכִּיר בּוֹ, כִּדְאִיתָא בְּמַסֶּכֶת סוֹטָה:", "rashi_en": "כאשר השביעך ACCORDING AS HE ADJURED THEE — For except for that oath I would not permit you to do so. He did not dare, however, to say to Joseph, “Break the oath”, lest he might retort, “Then, I, too, may break the oath I made you that I will never reveal that secret about the Sacred Tongue, viz., that I possess a knowledge of it in addition to the seventy languages which you also understand but of which you have no knowledge at all — as it is related in Treatise Sotah 36b. "}, {"ch": 50, "v": 7, "aliyah": 6, "heb": "וַיַּ֥עַל יוֹסֵ֖ף לִקְבֹּ֣ר אֶת־אָבִ֑יו וַיַּֽעֲל֨וּ אִתּ֜וֹ כׇּל־עַבְדֵ֤י פַרְעֹה֙ זִקְנֵ֣י בֵית֔וֹ וְכֹ֖ל זִקְנֵ֥י אֶֽרֶץ־מִצְרָֽיִם׃", "onk": "וּסְלֵיק יוֹסֵף לְמִקְבַּר יָת אָבוּהִי וּסְלִיקוּ עִמֵּיהּ כָּל עַבְדֵי פַרְעֹה סָבֵי בֵיתֵיהּ וְכֹל סָבֵי אַרְעָא דְמִצְרָיִם:", "onk_en": "Yoseif went up to bury his father; and with him went up all Pharaohs servant’s, the elders of this house, and all the elders of the land of Egypt,", "pj": "וּסְלֵיק יוֹסֵף לְמִקְבַּר יַת אָבוּי וּסְלִיקוּ עִמֵיהּ כָּל עַבְדוֹי דְפַרְעה סָבֵי בַיְיתֵיהּ וְכָל סָבֵי אַרְעָא דְמִצְרָיִם", "pj_en": "And Joseph went up to bury his father; and all the servants of Pharoh, the elders of his house, and all the elders of the land of Mizraim, went up with him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 8, "aliyah": 6, "heb": "וְכֹל֙ בֵּ֣ית יוֹסֵ֔ף וְאֶחָ֖יו וּבֵ֣ית אָבִ֑יו רַ֗ק טַפָּם֙ וְצֹאנָ֣ם וּבְקָרָ֔ם עָזְב֖וּ בְּאֶ֥רֶץ גֹּֽשֶׁן׃", "onk": "וְכֹל בֵּית יוֹסֵף וַאֲחוֹהִי וּבֵית אָבוּהִי לְחוֹד טַפְלְהוֹן וְעָנְהוֹן וְתוֹרֵיהוֹן שְׁבָקוּ בְּאַרְעָא דְגשֶׁן:", "onk_en": "And all Yoseif’s household, his brothers and his father’s household. Only their little ones, their sheep and their cattle did they leave behind in the land of Goshen.", "pj": "וְכָל אֱנָשׁ בֵּיתָא דְיוֹסֵף וְאָחוֹי וּבֵית אָבוֹי לְחוֹד טַפְלְהוֹן וְעַנְהוֹן וְתוֹרֵיהוֹן שְׁבָקוּ בְּאַרְעָא דְגוֹשֶׁן", "pj_en": "And all the men of Joseph's house, and his brethren, and his father's household: only their children, and their sheep and oxen, left they in the land of Goshen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 9, "aliyah": 6, "heb": "וַיַּ֣עַל עִמּ֔וֹ גַּם־רֶ֖כֶב גַּם־פָּרָשִׁ֑ים וַיְהִ֥י הַֽמַּחֲנֶ֖ה כָּבֵ֥ד מְאֹֽד׃", "onk": "וּסְלִיקוּ עִמֵּיהּ אַף רְתִכִּין אַף פָּרָשִׁין וַהֲוָה מַשְׁרִיתָא סַגִּיאָה לַחֲדָא:", "onk_en": "With him also went up chariots and horsemen. It was a very imposing camp.", "pj": "וּסְלִיקוּ עִמֵיהּ אוּף אַרְתְּכִין אוּף פָּרָשִׁין וַהֲוַת מַשִׁירְיָיתָא סַגִיאָה לַחֲדָא", "pj_en": "And there went up with him chariots and horsemen and a very great host.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 10, "aliyah": 6, "heb": "וַיָּבֹ֜אוּ עַד־גֹּ֣רֶן הָאָטָ֗ד אֲשֶׁר֙ בְּעֵ֣בֶר הַיַּרְדֵּ֔ן וַיִּ֨סְפְּדוּ־שָׁ֔ם מִסְפֵּ֛ד גָּד֥וֹל וְכָבֵ֖ד מְאֹ֑ד וַיַּ֧עַשׂ לְאָבִ֛יו אֵ֖בֶל שִׁבְעַ֥ת יָמִֽים׃", "onk": "וַאֲתוֹ עַד בֵּית אִדְרֵי דְאָטָד דִּי בְּעִבְרָא דְיַרְדְּנָא וּסְפָדוּ תַמָּן מִסְפֵּד רַב וְתַקִּיף לַחֲדָא וְעָבַד לַאֲבוּהִי אֶבְלָא שַׁבְעָא יוֹמִין:", "onk_en": "They came to the threshing place of Atad, which is on the other side of the Jordan, and there they eulogized [him and held] a very great and imposing funeral. He [Yoseif] made seven days of mourning for his father.", "pj": "וְאָתוּ עַד בֵּית אִידְרֵי דְאָטָד דִי בְּעִיבְרָא דְיוֹרְדְנָא וּסְפָדוּ תַּמָן מִסְפַּד רַב וּתְקֵיף לַחֲדָא וְעָבֵד לְאָבוֹי אוּבְלָא שַׁבְעָא יוֹמִין", "pj_en": "And they came to the threshing floor of Atad, which is beyond the Jardena, and there they lamented with a great and mighty lamentation. And he made there a mourning for his father seven days.", "tj": "", "tj_en": "", "rashi": "<b>גרן האטד.<\/b> מֻקָּף אֲטָדִין הָיָה, וְרַבּוֹתֵינוּ דָּרְשׁוּ (סוטה י\"ג), עַל שֵׁם הַמְּאֹרָע, שֶׁבָּאוּ כָּל מַלְכֵי כְנַעַן וּנְשְׂיאֵי יִשְׁמָעֵאל לַמִּלְחָמָה, וְכֵיוָן שֶׁרָאוּ כִתְרוֹ שֶׁל יוֹסֵף תָּלוּי בַּאֲרוֹנוֹ שֶׁל יַעֲקֹב עָמְדוּ כֻלָּן וְתָלוּ בוֹ כִתְרֵיהֶם וְהִקִּיפוּהוּ כְּתָרִים כְּגֹרֶן הַמֻּקָּף סְיָג שֶׁל קוֹצִים:", "rashi_en": "גרן האטד THE THRESHING FLOOR OF ATAD — It was so called because it was surrounded by a hedge of (אטדין) thorns (not because thorns were threshed there) Our Rabbis explained that it was so called in consequence of an incident that occurred there — that all the kings of Canaan and the princes of Ishmael came to wage war against them, but as soon as they saw Joseph’s crown hanging over Jacob’s coffin they all rose and hung their crowns on it and thus wreathed it with crowns like a threshing floor that is surrounded with a hedge of thorns (Sotah 13a). "}, {"ch": 50, "v": 11, "aliyah": 6, "heb": "וַיַּ֡רְא יוֹשֵׁב֩ הָאָ֨רֶץ הַֽכְּנַעֲנִ֜י אֶת־הָאֵ֗בֶל בְּגֹ֙רֶן֙ הָֽאָטָ֔ד וַיֹּ֣אמְר֔וּ אֵֽבֶל־כָּבֵ֥ד זֶ֖ה לְמִצְרָ֑יִם עַל־כֵּ֞ן קָרָ֤א שְׁמָהּ֙ אָבֵ֣ל מִצְרַ֔יִם אֲשֶׁ֖ר בְּעֵ֥בֶר הַיַּרְדֵּֽן׃", "onk": "וַחֲזָא יָתֵב אַרְעָא כְנַעֲנָאָה יָת אֶבְלָא בְּבֵית אִדְרֵי דְאָטָד וַאֲמָרוּ אָבֵל תַּקִּיף דֵּין לְמִצְרָאֵי עַל כֵּן קְרָא שְׁמַהּ אָבֵל מִצְרַיִם דִּי בְּעִבְרָא דְיַרְדְּנָא:", "onk_en": "The Canaanites who lived in the land saw the mourning in the threshing place of Atad, and they said, This is heavy mourning for Egypt. It was therefore named Egypt’s Mourning, which is on the other side of the Jordan.", "pj": "וַחֲמָא יַתְבֵי אַרְעָא כְּנַעֲנָאֵי אוּבְלָא בְּבֵית אִדְרֵי דְאָטָד וְשַׁרְיַין קְטוּרֵי חַרְצֵהוֹן בְּגִין אִיקַר דְיַעֲקב וַהֲווֹ מְחַוִין בִּידֵיהוֹן וְאָמְרִין אֵבֶל תַּקִיף דֵין לְמִצְרַיִם בְּגִין כֵּן קְרָא שְׁמָא דְאָתַר אָבֵל מִצְרַיִם דִי בְּעִיבְרָא דְיוֹרְדְנָא", "pj_en": "And the inhabitants of the land of Kenaan beheld the mourning at the threshing floor of Atad, and they loosed the girdles of their loins in honour of Jakob, and spread forth their hands, and said, This is a mighty mourning of the Mizraee. Therefore he called the name of the, place Abel Mizraim, which is on the other side of Jardena.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 12, "aliyah": 6, "heb": "וַיַּעֲשׂ֥וּ בָנָ֖יו ל֑וֹ כֵּ֖ן כַּאֲשֶׁ֥ר צִוָּֽם׃", "onk": "וַעֲבָדוּ בְנוֹהִי לֵיהּ כֵּן כְּמָא דִי פַקֵּדִנּוּן:", "onk_en": "His sons did for him as he commanded them.", "pj": "וַעֲבָדוּ בְּנוֹי לֵיהּ הֵיכְדֵין כְּמָא דְפַקְדִינוּן", "pj_en": "And his sons did for him as he had commanded them.", "tj": "", "tj_en": "", "rashi": "<b>כאשר צום.<\/b> מַהוּ אֲשֶׁר צִוָּם?", "rashi_en": "כאשר צום AS HE COMMANDED THEM — What was it that he had commanded them? This you can gather from the next verse, "}, {"ch": 50, "v": 13, "aliyah": 6, "heb": "וַיִּשְׂא֨וּ אֹת֤וֹ בָנָיו֙ אַ֣רְצָה כְּנַ֔עַן וַיִּקְבְּר֣וּ אֹת֔וֹ בִּמְעָרַ֖ת שְׂדֵ֣ה הַמַּכְפֵּלָ֑ה אֲשֶׁ֣ר קָנָה֩ אַבְרָהָ֨ם אֶת־הַשָּׂדֶ֜ה לַאֲחֻזַּת־קֶ֗בֶר מֵאֵ֛ת עֶפְרֹ֥ן הַחִתִּ֖י עַל־פְּנֵ֥י מַמְרֵֽא׃", "onk": "וּנְטָלוּ יָתֵיהּ בְּנוֹהִי לְאַרְעָא דִכְנַעַן וּקְבָרוּ יָתֵיהּ בִּמְעָרַת חֲקַל כָּפֶלְתָּא דִּי זְבַן אַבְרָהָם יָת חַקְלָא לְאַחֲסָנַת קְבוּרָא מִן עֶפְרֹן חִתָּאָה עַל אַפֵּי מַמְרֵא:", "onk_en": "His sons carried him to the land of Canaan, and buried him in the cave of the field of Machpeilah, which Avraham purchased along with the field, for a possession as a burial place, from Ephron, the Chittite, facing Mamrei.", "pj": "וּנְטָלוּ יָתֵיהּ בְּנוֹי לְאַרְעָא דִכְנָעַן וּשְׁמִיעַ פִּתְגָמָא לְעֵשָו רַשִׁיעָא וּנְטַל מִן טוּרָא דְגַבְלָא בְּלִגְיוֹנִין סַגִיאִין וְאָתָא לְחֶבְרוֹן וְלָא הֲוָה שָׁבִיק לְיוֹסֵף לְמִיקְבּוֹר יַת אָבוּי בִּמְעָרַת כְּפֵילְתָּא מִן יַד אָזַל נַפְתָּלִי וְרָהַט וּנְחַת לְמִצְרַיִם וְאָתָא בְּהַהוּא יוֹמָא וְאַיְיתִי אוּנִיתָא דְכָתַב עֵשָו לְיַעֲקב אָחוּי עַל פַּלְגוּת מְעָרַת כָּפֵילְתָּא וּמִן יַד רָמַז לְחוּשִׁים בַּר דָן וְנָטַל סַיְיפָא וְקָטַע רֵישֵׁיהּ דְעֵשָו רַשִׁיעָא וַהֲוָה רֵישֵׁיהּ דְעֵשָו מִתְגַלְגַל עַד דְעַל לְגוֹ מְעַרְתָּא וְאַתְנַח בְּגוֹ עִיטְפֵיהּ דְיִצְחָק אָבוֹי וְגוּפֵיהּ קְבָרוּ בְּנוֹ דְעֵשָו בַּחֲקַל כְּפֵילְתָּא וּבָתַר כֵּן קְבָרוּ יָתֵיהּ בְּנוֹי לְיַעֲקב בִּמְעָרַת חֲקַל כָּפֵילְתָּא דִיזְבַן אַבְרָהָם יַת חַקְלָא לְאַחֲסָנַת קְבוּרְתָּא מִן עֶפְרוֹן חִתָּאָה עַל אַנְפֵּי מַמְרֵא", "pj_en": "But when his sons had brought him into the land of Kenaan, and the thing was heard by Esau the Wicked, he journeyed from the mountain of Gebala with many legions, and came to Hebron, and would not suffer Joseph to bury his father in the Double Cave. Then forthwith went Naphtali and ran, and went down to Mizraim, and came in that day, and brought the Instrument that Esau had written for Jakob his brother in the controversy of the Double Cave. And immediately he beckoned to Hushim the son of Dan, who unsheathed the sword and struck off the head of the Wicked Esau, and the head of Esau rolled into the midst of the cave, and rested upon the bosom of Izhak his father; and the sons of Esau buried his body in the double field, and afterward the sons of Jakob buried him in the cave of the double field; in the field which Abraham bought for an inheritance--sepulchre, of Ephron the Hitah, over against Mamre.", "tj": "", "tj_en": "", "rashi": "<b>וישאו אתו בניו.<\/b> וְלֹא בְנֵי בָנָיו, שֶׁכָּךְ צִוָּם, אַל יִשְׂאוּ מִטָּתִי לֹא אִישׁ מִצְרִי וְלֹא אֶחָד מִבְּנֵיכֶם, שֶׁהֵם מִבְּנוֹת כְּנַעַן, אֶלָּא אַתֶּם, וְקָבַע לָהֶם מָקוֹם ג' לַמִּזְרָח, וְכֵן לְד' רוּחוֹת, וּכְסִדְרָן לְמַסַּע מַחֲנֶה שֶׁל דְּגָלִים נִקְבְעוּ כָאן; לֵוִי לֹא יִשָּׂא, שֶׁהוּא עָתִיד לָשֵׂאת אֶת הָאָרוֹן, וְיוֹסֵף לֹא יִשָּׂא, לְפִי שֶׁהוּא מֶלֶךְ, מְנַשֶּׁה וְאֶפְרַיִם יִהְיוּ תַחְתֵּיהֶם, וְזֶהוּ אִישׁ עַל דִּגְלוֹ בְאֹתֹת – בְּאוֹת שֶׁמָּסַר לָהֶם אֲבִיהֶם לִשָּׂא מִטָּתוֹ:", "rashi_en": "וישאו אותו בניו AND HIS SONS BORE HIM — His sons and not his grandsons. For thus, indeed, he had commanded them: “My bier shall not be borne by an Egyptian, nor by one of your sons because they are children of Canaanite women, but you alone shall bear it He likewise assigned them their positions, namely, three on the east-side and an equal number on the other three sides of the bier. In the same order in which later on the camps marched through the wilderness bearing their several banners they were arranged here. But the 12 tribes that formed these four divisions did not include Levi or Joseph, for Jacob had said, “Levi shall not carry my bier because he is destined to carry the holy Ark; Joseph shall not carry it  because he is a king, but Manasseh and Ephraim shall take their places”. And, it is to this that Scripture refers when it says, (Numbers 2:2) “every man [shall pitch] by his own banner according to the signs” — meaning according to the sign (i.e. indication of position) which their father individually gave them with regard to carrying his bier (Midrash Tanchuma, Bamidbar 12)."}, {"ch": 50, "v": 14, "aliyah": 6, "heb": "וַיָּ֨שׇׁב יוֹסֵ֤ף מִצְרַ֙יְמָה֙ ה֣וּא וְאֶחָ֔יו וְכׇל־הָעֹלִ֥ים אִתּ֖וֹ לִקְבֹּ֣ר אֶת־אָבִ֑יו אַחֲרֵ֖י קׇבְר֥וֹ אֶת־אָבִֽיו׃", "onk": "וְתַב יוֹסֵף לְמִצְרַיִם הוּא וַאֲחוֹהִי וְכָל דִּסְלִיקוּ עִמֵּיהּ לְמִקְבַּר יָת אָבוּהִי בָּתַר דִּקְבַר יָת אָבוּהִי:", "onk_en": "Yoseif returned to Egypt, he and his brothers, and all those who went with him, to bury his father, after he had buried his father.", "pj": "וְתַב יוֹסֵף לְמִצְרַיִם הוּא וַאֲחוֹהִי וְכָל דִסְלִיקוּ עִמֵיהּ לְמִקְבּוֹר יַת אָבוּי בָּתַר דְקָבַר יַת אָבוֹי", "pj_en": "And Joseph returned to Mizraim, he and his brethren, and all who went up with him to bury his father, after they had buried his father.", "tj": "", "tj_en": "", "rashi": "<b>הוא ואחיו וכל העלים אתו.<\/b> בַּחֲזָרָתָן הִקְדִּים אֶחָיו לַמִּצְרִים הָעוֹלִים אִתּוֹ, וּבַהֲלִיכָתָן הִקְדִּים מִצְרַיִם לְאֶחָיו, שֶׁנֶּאֱמַר וַיַּעֲלוּ אִתּוֹ כָּל עַבְדֵי פַרְעֹה וְגוֹ', וְאַחַר כָּךְ כָּל בֵּית יוֹסֵף וְאֶחָיו, אֶלָּא לְפִי שֶׁרָאוּ כָבוֹד שֶׁעָשׂוּ מַלְכֵי כְנַעַן שֶׁתָּלוּ כִתְרֵיהֶם בַאֲרוֹנוֹ שֶׁל יַעֲקֹב נָהֲגוּ בָהֶם כָּבוֹד:", "rashi_en": "הוא ואחיו וכל העלים אתו HE AND HIS BRETHREN AND ALL THAT WENT UP WITH HIM — here, speaking of their return to Egypt, it mentions his brothers before the Egyptians who went with him whereas when speaking of their journey to Canaan to bury their father it mentions the Egyptians before his brothers, as it is said, (Genesis 50:7) “and with him went up all the servants of Pharaoh …” and afterwards it states (Genesis 50:8) “and all the house of Joseph and his brothers”. But the explanation is: because they (the Egyptians) saw how much respect the kings of Canaan paid to Jacob by hanging their crowns on his coffin they now treated them (the sons) with much respect and gave them precedence on the return journey (Sotah 13a). "}, {"ch": 50, "v": 15, "aliyah": 6, "heb": "וַיִּרְא֤וּ אֲחֵֽי־יוֹסֵף֙ כִּי־מֵ֣ת אֲבִיהֶ֔ם וַיֹּ֣אמְר֔וּ ל֥וּ יִשְׂטְמֵ֖נוּ יוֹסֵ֑ף וְהָשֵׁ֤ב יָשִׁיב֙ לָ֔נוּ אֵ֚ת כׇּל־הָ֣רָעָ֔ה אֲשֶׁ֥ר גָּמַ֖לְנוּ אֹתֽוֹ׃", "onk": "וַחֲזוֹ אֲחֵי יוֹסֵף אֲרֵי מִית אֲבוּהוֹן וַאֲמָרוּ דִּלְמָא יִטַּר לָנָא דְבָבוּ יוֹסֵף וַאֲתָבָא יָתֵיב לָנָא יָת כָּל בִּישְׁתָא דִּי גְמַלְנָא יָתֵיהּ:", "onk_en": "Yoseif’s brothers saw that their father was dead, and they said, Perhaps Yoseif still bears a grudge against us. He will then certainly repay us for all the evil that we did him.", "pj": "וְחָמוּ אֲחֵי יוֹסֵף אֲרוּם מַיִית אֲבוּהוֹן וְלָא הֲוָה מִסְתְּחַר עִמְהוֹן כַּחֲדָא לְמֵיכוּל לַחֲדָא וַאֲמַרוּ מַה דִילְמָא נָטַר לָנָא סָנָא יוֹסֵף וַאֲתָבָא יָתֵיב לָנָא יַת כָּל בִּישָׁא דִגְמַלְנָא יָתֵיהּ", "pj_en": "And Joseph's brethren saw that their father was dead, and that he (Joseph) did not return to eat together with them, and they said, Perhaps Joseph ill bring upon us all retaineth enmity against us, and will bring upon us all the evil that we did him.", "tj": "", "tj_en": "", "rashi": "<b>ויראו אחי יוסף כי מת אביהם.<\/b> מַהוּ וַיִּרְאוּ? הִכִּירוּ בְּמִיתָתוֹ אֵצֶל יוֹסֵף, שֶׁהָיוּ רְגִילִים לִסְעֹד עַל שֻׁלְחָנוֹ שֶׁל יוֹסֵף וְהָיָה מְקָרְבָן בִּשְׁבִיל כְּבוֹד אָבִיו, וּמִשֶּׁמֵּת יַעֲקֹב לֹא קֵרְבָן (בראשית רבה):<br><br><b>לו ישטמנו.<\/b> שֶׁמָּא יִשְׂטְמֵנוּ; לוּ מִתְחַלֵּק לְעִנְיָנִים הַרְבֵּה; יֵשׁ לוּ מְשַׁמֵּשׁ בִּלְשׁוֹן בַּקָּשָׁה וּלְשׁוֹן הַלְוַאי, כְּגוֹן לוּ יְהִי כִדְבָרֶךָ, לוּ שְׁמָעֵנִי, וְלוּ הוֹאַלְנוּ, לוּ מַתְנוּ, וְיֵשׁ לוּ מְשַׁמֵּשׁ בִּלְשׁוֹן אִם וְאוּלַי, כְּגוֹן לוּ חָכְמוּ (דברים ל\"ב), לוּ הִקְשַׁבְתָּ לְמִצְוֹתָי (ישעיהו מ\"ח), וְלוּ אָנֹכִי שֹׁקֵל עַל כַּפַּי (שמואל ב י\"ח); וְיֵשׁ לוּ מְשַׁמֵשׁ בִּלְשׁוֹן שֶׁמָּא, לוּ יִשְׂטְמֵנוּ, וְאֵין לוֹ עוֹד דּוֹמֶה בַמִּקְרָא, וְהוּא לְשׁוֹן אוּלַי, כְּמוֹ אֻלַי לֹא תֵלֵךְ הָאִשָּׁה אַחֲרָי, לְשׁוֹן שֶׁמָּא הוּא; וְיֵשׁ אוּלַי לְשׁוֹן בַּקָּשָׁה, כְּגוֹן אוּלַי יִרְאֶה ה' בְּעֵינִי (שמואל ב ט\"ז), אוּלַי ה' אוֹתִי (יהושע י\"ד), הֲרֵי הוּא כְּמוֹ לוּ יְהִי כִדְבָרֶךָ, וְיֵשׁ אוּלַי לְשׁוֹן אִם, אוּלַי יֵשׁ נ' צַדִּיקִם:", "rashi_en": "ויראו אחי יוסף כי מת אביהם AND WHEN JOSEPH S BRETHREN SAW THAT THEIR FATHER WAS DEAD — What is the meaning of “and they saw”? They could perceive that he was dead through the conduct of Joseph. Previously they used to dine at Joseph’s table and he used to receive them with open arms out of respect to his father; after Jacob’s death, however, he no longer treated them in a friendly manner (Tanchuma Yashan 2:1:2; Genesis Rabbah 100:8).<br><br>לו ישטמנו means PERHAPS HE WILL HATE US. The word has many different meanings. There are examples of לו used to denote a petition, having the meaning of “Oh that!” as for instance: (Genesis 30:34) “Would (לו) it might be according to thy word”; (Genesis 23:13) “Oh that thou wouldst (לו) only hear me”; (Joshua 7:7) “Would that (לו) we had been content”; (Numbers 14:2) “Would that (לו) we had died”. ,There are examples of לו used in the sense of “if” and “אולי” as, (Deuteronomy 32:29) “If (לו) they were wise [they would understand this]”; (Isaiah 48:18) “If (לוא) thou wouldst hearken to my commandments, [then would thy peace be as a river]”; (2 Samuel 18:12) “If (לו) I would receive [a thousand pieces of silver] in my hands, [yet would I not put forth my hand etc.]”. There is an example of לו used in the sense of “perhaps”, — in our verse — “Perhaps he will hate us”, but there is no other example of its usage in this sense in Scripture. Here it corresponds in sense with the word אולי, “perhaps”, as for example in (Genesis 24:5) “אולי the woman will not be willing to follow me” which means “perhaps she will not etc.” As a matter of fact אולי has all the meanings of לו, for there are examples of אולי denoting a petition as for instance (2 Samuel 16:12) “Perhaps (אולי) the Lord will look upon mine eye”, (where the context shows that this involves a kind of petition that God should do this); (Joshua 14:12) “Perhaps (אולי) the Lord will be with me [and I shall drive them out]”, (involving also a petition that God should do this), where אולי has a similar meaning to לו in (Genesis 30:34) “Would (לו) it might be according to thy word”. Then again the word אולי has the meaning of “if”; for example, (Genesis 18:24) “Perhaps (אולי) there are fifty righteous [wilt Thou destroy etc.]” (which is equivalent to “if there are fifty… wilt thou destroy?”.)"}, {"ch": 50, "v": 16, "aliyah": 6, "heb": "וַיְצַוּ֕וּ אֶל־יוֹסֵ֖ף לֵאמֹ֑ר אָבִ֣יךָ צִוָּ֔ה לִפְנֵ֥י מוֹת֖וֹ לֵאמֹֽר׃", "onk": "וּפַקִּידוּ לְוַת יוֹסֵף לְמֵימָר אָבוּךְ פַּקֵּד קֳדָם מוֹתֵיהּ לְמֵימָר:", "onk_en": "They sent a command to Yoseif saying, Your father issued a command before his death, saying,", "pj": "וּפַקִידוּ יַת בִּלְהָה לְמֵימַר לְיוֹסֵף אָבוּךְ פַּקֵיד קֳדָם מוֹתֵיהּ לְמֵימָר לָךְ", "pj_en": "And they instructed Bilhah to say to Joseph, Thy father commanded before his death to speak to thee,", "tj": "וּפַקִידוּ שִׁבְטַיָא יַת בִּלְהָה אַמְתָא דְרָחֵל לְמֵימָר אָבוּךְ פַּקֵיד קֳדָם עַד לָא יִתְכְּנֵישׁ לְמֵימָר:", "tj_en": "...And they instructed the tribe of Bilhah the handmaid of Rahel to say, Thy father before he was gathered commanded, saying:", "rashi": "<b>ויצוו אל יוסף.<\/b> כְּמוֹ וַיְצַוֵּם אֶל בְּנֵי יִשְׂרָאֵל – צִוָּה לְמֹשֶׁה וּלְאַהֲרֹן לִהְיוֹת שְׁלוּחִים אֶל בְּנֵי יִשְׂרָאֵל, אַף זֶה וַיְצַוּוּ אֶל שְׁלוּחָם, לִהְיוֹת שָׁלִיחַ אֶל יוֹסֵף לוֹמַר לוֹ כֵן. וְאֶת מִי צִוּוּ? אֶת בְּנֵי בִלְהָה, שֶׁהָיוּ רְגִילִין אֶצְלוֹ, שֶׁנֶּאֱמַר וְהוּא נַעַר אֶת בְּנֵי בִלְהָה:<br><br><b>אביך צוה.<\/b> שִׁנּוּ בַדָּבָר מִפְּנֵי הַשָּׁלוֹם, כִּי לֹא צִוָּה יַעֲקֹב כֵּן, שֶׁלֹּא נֶחֱשַׁד יוֹסֵף בְּעֵינָיו (בראשית רבה, יבמות ס\"ה):", "rashi_en": "ויצוו אל יוסף AND THEY COMMANDED SOME TO GO TO JOSEPH — The words ויצוו אל have the same meaning as in (Exodus 6:13) “and He gave them a charge unto (ויצום אל) the children of Israel”, which signifies, “He commanded Moses and Aaron to act as messengers to the children of Israel”, and this verse, too, means they charged the man whom they sent that he should act as their messenger to Joseph to speak to him as follows (the words לומר לו כן correspond to לאמר in the Bible text here). And who was it that they so charged? The sons of Bilhah who had been accustomed to associate with him, as it is said (Genesis 37:12) “When a lad he used to be with the sons of Bilhah” (Tanchuma Yashan 2:1:2).<br><br>אביך צוה  THY FATHER DID COMMAND — They altered the facts (they stated something that was false) for the sake of peace, for Jacob had given them no such command because Joseph was not suspect in his sight (Yevamot 65b)). "}, {"ch": 50, "v": 17, "aliyah": 6, "heb": "כֹּֽה־תֹאמְר֣וּ לְיוֹסֵ֗ף אָ֣נָּ֡א שָׂ֣א נָ֠א פֶּ֣שַׁע אַחֶ֤יךָ וְחַטָּאתָם֙ כִּי־רָעָ֣ה גְמָל֔וּךָ וְעַתָּה֙ שָׂ֣א נָ֔א לְפֶ֥שַׁע עַבְדֵ֖י אֱלֹהֵ֣י אָבִ֑יךָ וַיֵּ֥בְךְּ יוֹסֵ֖ף בְּדַבְּרָ֥ם אֵלָֽיו׃", "onk": "כְּדֵין תֵּימְרוּן לְיוֹסֵף בְּבָעוּ שְׁבוֹק כְּעַן לְחוֹבָא אַחָיךְ וְלַחֲטָאֵהוֹן אֲרֵי בִישְׁתָא גְמָלוּךְ וּכְעַן שְׁבוֹק <b>כְּעַן<\/b> לְחוֹבָא עַבְדֵי אֱלָהָא דְאָבוּךְ וּבְכָא יוֹסֵף בְּמַלָּלוּתְהוֹן עִמֵּיהּ:", "onk_en": "This is what you should say to Yoseif, Please forgive the transgression of your brothers and their sin, for they did evil to you. And now please forgive [<b>now<\/b>] the transgr ession of the servants of the God of your father. Yoseif wept as his brothers spoke to him.", "pj": "כִּדְנָא תֵימְרוּן לְיוֹסֵף בְּמָטוּ שְׁבוֹק כְּדוֹן לְחוֹבֵי אָחָךְ וּלְחַטָאֵיהוֹן אֲרוּם בִּישָׁא גָמְלוּ יָתָךְ וּכְדוֹן שְׁבוֹק בְּבָעוּ לְחוֹבֵי עַבְדֵי אֱלָהָא דְאָבוּךְ וּבְכָא יוֹסֵף בְּמַלָלוּתְהוֹן עִמֵיהּ", "pj_en": "Thus shall you say to Joseph, Forgive now the guilt of thy brethren and their sin, for they committed evil against thee; but forgive, I beseech thee, the guilt of the servants of the God of thy father. And Joseph wept when they spake with him.", "tj": "", "tj_en": "", "rashi": "<b>שא נא לפשע עבדי אלהי אביך.<\/b> אִם אָבִיךָ מֵת, אֱלֹהָיו קַיָּם, וְהֵם עֲבָדָיו:", "rashi_en": "שא נא לפשע עבדי אלהי אביך NOW, PRAY, FORGIVE THE TRESSPASS OF THE SERVANTS OF THE GOD OF THY FATHER — After having repeated to Joseph the words which his brothers stated had been their fathers message, “forgive thy brothers’ sin” the messengers were to add as a petition of the brothers “Now, pray etc.”, meaning “If you will not forgive them although they are your brothers, forgive them because they are the servants of the God of thy father”, implying though your father be dead, his God still lives and they are his servants. "}, {"ch": 50, "v": 18, "aliyah": 6, "heb": "וַיֵּלְכוּ֙ גַּם־אֶחָ֔יו וַֽיִּפְּל֖וּ לְפָנָ֑יו וַיֹּ֣אמְר֔וּ הִנֶּ֥נּֽוּ לְךָ֖ לַעֲבָדִֽים׃", "onk": "וַאֲזָלוּ אַף אֲחוֹהִי וּנְפָלוּ קֳדָמוֹהִי וַאֲמָרוּ הָא אֲנַחְנָא לָךְ לְעַבְדִּין:", "onk_en": "His brothers also went and threw themselves down before him, and they said, Behold, we are your slaves.", "pj": "וַאֲזָלוּ אוּף אָחוֹי וְאַתְרְכִינוּ קֳדָמוֹי וַאֲמָרוּ הָא אֲנָן לָךְ לְעַבְדִין", "pj_en": "And his brethren came also, and bowed themselves before him, and said, Behold, we are thy servants.", "tj": "", "tj_en": "", "rashi": "<b>וילכו גם אחיו.<\/b> מוּסָף עַל הַשְּׁלִיחוּת:", "rashi_en": "וילכו גם אחיו AND HIS BRETHREN ALSO WENT in addition to sending their messengers."}, {"ch": 50, "v": 19, "aliyah": 6, "heb": "וַיֹּ֧אמֶר אֲלֵהֶ֛ם יוֹסֵ֖ף אַל־תִּירָ֑אוּ כִּ֛י הֲתַ֥חַת אֱלֹהִ֖ים אָֽנִי׃", "onk": "וַאֲמַר לְהוֹן יוֹסֵף לָא תִדַּחֲלוּן <b>אֲרֵי דַּחֲלָא דַיְיָ אֲנָא<\/b>:", "onk_en": "Yoseif said to them, Fear not. For am I in place of Elohim? [<b>For I am one who fears Elohim<\/b>]", "pj": "וַאֲמַר לְהוֹם יוֹסֵף לָא תִידַחֲלוּן אֲרוּם לָא נִיגְמוֹל לְכוֹן בִּישְׁתָּא אֱלָהֵן טַבְתָא אֲרוּם דָחִיל וּמִתְבַר מִן קֳדָם יְיָ אֲנָא", "pj_en": "And Joseph said to them, Fear not, for I will not do you evil, but good; for I fear and humble myself before the Lord.", "tj": "וַאֲמַר לְהוֹן יוֹסֵף לָא תִידַחֲלוּן אֲרוּם חַסְלַת בִּישָׁא דַעֲבַדְתִּין לִי הֲלָא קֳדָם יְיָ אִינוּן מַחְשַׁבְתְּהוֹן דִבְנֵי אֱנָשָׁא:", "tj_en": "And Joseph said to them, Fear not, for the evil that you did me Hath ended. Are not the thoughts of the sons of men before the Lord?", "rashi": "<b>כי התחת אלהים אני.<\/b> שֶׁמָּא בִּמְקוֹמוֹ אֲנִי? בִּתְמִיהָ, אִם הָיִיתִי רוֹצֶה לְהָרַע לָכֶם, כְּלוּם אֲנִי יָכוֹל? וַהֲלֹא אַתֶּם כֻּלְּכֶם חֲשַׁבְתֶּם עָלַי רָעָה, וְהַקָּדוֹשׁ בָּרוּךְ הוּא חֲשָׁבָהּ לְטוֹבָה וְהֵיאַךְ אֲנִי לְבַדִּי יָכוֹל לְהָרַע לָכֶם?", "rashi_en": "כי התחת אלהים אני FOR AM I INSTEAD OF GOD — Am I perhaps (do you think that I am) in His stead? The ה of התחת expresses a question. Even if I wished to do you harm would I at all be able to do so? For did you not all design evil against me, and you did not succeed because the Holy One, blessed be He, designed it for good. How, then, can I alone, without God’s consent, do evil to you."}, {"ch": 50, "v": 20, "aliyah": 6, "heb": "וְאַתֶּ֕ם חֲשַׁבְתֶּ֥ם עָלַ֖י רָעָ֑ה אֱלֹהִים֙ חֲשָׁבָ֣הּ לְטֹבָ֔ה לְמַ֗עַן עֲשֹׂ֛ה כַּיּ֥וֹם הַזֶּ֖ה לְהַחֲיֹ֥ת עַם־רָֽב׃", "onk": "וְאַתּוּן חֲשַׁבְתּוּן עֲלַי בִּישָׁא מִן <b>קֳדָם<\/b> יְיָ <b>אִתְחַשְּׁבַת<\/b> לְטָבָא בְּדִיל לְמֶּעְבַּד כְּיוֹמָא הָדֵין לְקַיָּמָא עַם סַגִּי:", "onk_en": "You meant to do evil to me, but [<b>from before<\/b>] Elohim [<b>it was meant<\/b>] meant it for good, in order to do as it is today, to preserve the lives of a great people.", "pj": "וְאַתּוּן חֲשַׁבְתּוּן עָלַי מַחְשָׁבִין בִּישִׁין דְמָא דְלָא הֲוֵינָא מִסְתְּחַר עִמְכוֹן לְמֵיכַל מִן בִּגְלַל דְנָטִיר לְכוֹן בָּבוּ הוּא וּמֵימְרָא דַיְיָ חַשְׁבָא עָלַי לְטַבְתָא דְאַבָּא הֲוָה מוֹתִיב לִי בְּרֵישָׁא וּמִן קֳדָם יְקָרֵיהּ הֲוֵינָא מְקַבֵּל וּכְדוֹן לֵית אֲנָא מְקַבֵּל בְּגִין דְאִיזְכֵּי לְמִתְעַבְדָא לָן שֵׁיזְבָתָא כְּיוֹמָא הָדֵין לְקַיְימָא עַם סַגִי מִדְבֵית יַעֲקב", "pj_en": "You indeed imagined against me evil thoughts, that when I did not recline with you to eat it was because I retained enmity against you. But the Word of the Lord thought on me for good; for my father hath caused me to sit at the head, and on account of his honour I received; but now not for the sake of my (own) righteousness or merit was it given me to work out for you deliverance this day for the preservation of much people of the house of Jakob.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 21, "aliyah": 7, "heb": "וְעַתָּה֙ אַל־תִּירָ֔אוּ אָנֹכִ֛י אֲכַלְכֵּ֥ל אֶתְכֶ֖ם וְאֶֽת־טַפְּכֶ֑ם וַיְנַחֵ֣ם אוֹתָ֔ם וַיְדַבֵּ֖ר עַל־לִבָּֽם׃", "onk": "וּכְעַן לָא תִדַּחֲלוּן אֲנָא אֵזוּן יָתְכוֹן וְיָת טַפְלְכוֹן וְנַחֵם יָתְהוֹן <b>וּמַלֵּל תַּנְחוּמִין<\/b> עַל לִבְּהוֹן:", "onk_en": "And now, fear not. I will provide for you and your little ones. He comforted them and spoke [<b>words of consolation<\/b>] to their hearts.", "pj": "וּכְדוֹן לָא תִידַחֲלִין אָנָא אֵיזוּן יַתְכוֹן וְיַת טַפְלְכוֹן וְנָחִים יַתְהוֹן וּמַלֵל תַּנְחוּמִין עַל לִבְּהוֹן", "pj_en": "And now fear not; I will sustain you and your little ones. And he comforted them, and spake consolation to their heart.", "tj": "", "tj_en": "", "rashi": "<b>וידבר על לבם.<\/b> דְּבָרִים הַמִּתְקַבְּלִים עַל הַלֵּב – עַד שֶׁלֹּא יְרַדְתֶּם לְכָאן הָיוּ מְרַנְּנִים עָלַי שֶׁאֲנִי עֶבֶד, עַל יְדֵיכֶם נוֹדַע שֶׁאֲנִי בֶן חֹרִין, וְאִם אֲנִי הוֹרֵג אֶתְכֶם, מָה הַבְּרִיוֹת אוֹמְרוֹת? כַּת שֶׁל בַּחוּרִים רָאָה וְנִשְׁתַּבֵּחַ בָּהֶם וְאָמַר אַחַי הֵם, וּלְבַסּוֹף הָרַג אוֹתָם; יֵשׁ לְךָ אָח שֶׁהוֹרֵג אֶת אֶחָיו? דָּבָר אַחֵר, עֲשָׂרָה נֵרוֹת לֹא יָכְלוּ לְכַבּוֹת נֵר אֶ' וְכוּ':", "rashi_en": "וידבר אל לבם means HE SPOKE words that found ready entrance INTO THEIR HEART: Before you came down hither people spread rumours about me that I was born a slave; through you it became public that I am a free-man by birth. If I were to kill you what would people say? “He saw a party of fine young men and he prided himself on his relationship with them, saying “These are my brothers”, but afterwards he killed them. Have you ever heard of a man killing his brothers?!” (Genesis Rabbah 100:9) Another interpretation is: He said to them, “Ten lights could not extinguish one light; how, then, can one light extinguish ten lights?” (Megillah 16b)."}, {"ch": 50, "v": 22, "aliyah": 7, "heb": "וַיֵּ֤שֶׁב יוֹסֵף֙ בְּמִצְרַ֔יִם ה֖וּא וּבֵ֣ית אָבִ֑יו וַיְחִ֣י יוֹסֵ֔ף מֵאָ֥ה וָעֶ֖שֶׂר שָׁנִֽים׃", "onk": "וִיתֵיב יוֹסֵף בְּמִצְרַיִם הוּא וּבֵית אָבוּהִי וַחֲיָא יוֹסֵף מְאָה וַעֲסַר שְׁנִין:", "onk_en": "Yoseif lived in Egypt, he and his father’s household. Yoseif lived one hundred and ten years.", "pj": "וִיתֵיב יוֹסֵף בְּמִצְרַיִם הוּא וּבֵית אָבוֹי וַחֲיָא יוֹסֵף מְאָה וְעַשְרֵי שְׁנִין", "pj_en": "And Joseph dwelt in Mizraim, he and his father's house. And Joseph lived a hundred and ten years.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 23, "aliyah": 7, "heb": "וַיַּ֤רְא יוֹסֵף֙ לְאֶפְרַ֔יִם בְּנֵ֖י שִׁלֵּשִׁ֑ים גַּ֗ם בְּנֵ֤י מָכִיר֙ בֶּן־מְנַשֶּׁ֔ה יֻלְּד֖וּ עַל־בִּרְכֵּ֥י יוֹסֵֽף׃", "onk": "וַחֲזָא יוֹסֵף לְאֶפְרַיִם בְּנִין תְּלִיתָאִין אַף בְּנֵי מָכִיר בַּר מְנַשֶּׁה אִתְיְלִידוּ <b>וְרַבִּי יוֹסֵף<\/b>:", "onk_en": "Yoseif saw Ephraim’s children of the third generations. The children of Machir, Menasheh’s son, were born [<b>and Yoseif rasied them<\/b>] on Yoseif’s knees.", "pj": "וַחֲמָא יוֹסֵף לְאֶפְרַיִם בְּנִין דָרִין תְּלִיתָאִין אוּף בְּנֵי מָכִיר בַּר מְנַשֶׁה כַּד אִתְיְלִידוּ גְזִירִינוּן יוֹסֵף", "pj_en": "And Joseph saw Ephraim's children of the third generation; also the sons of Makir the son of Menasheh, when they were born, were circumcised by Joseph.", "tj": "", "tj_en": "", "rashi": "<b>על ברכי יוסף.<\/b> כְּתַרְגּוּמוֹ גִּדְּלָן בֵּין בִּרְכָּיו:", "rashi_en": "על ברכי יוסף [WERE BORN] ON JOSEPH’S KNEES — The meaning is as the Targum gives it: He brought them up upon his knees."}, {"ch": 50, "v": 24, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יוֹסֵף֙ אֶל־אֶחָ֔יו אָנֹכִ֖י מֵ֑ת וֵֽאלֹהִ֞ים פָּקֹ֧ד יִפְקֹ֣ד אֶתְכֶ֗ם וְהֶעֱלָ֤ה אֶתְכֶם֙ מִן־הָאָ֣רֶץ הַזֹּ֔את אֶל־הָאָ֕רֶץ אֲשֶׁ֥ר נִשְׁבַּ֛ע לְאַבְרָהָ֥ם לְיִצְחָ֖ק וּֽלְיַעֲקֹֽב׃", "onk": "וַאֲמַר יוֹסֵף לַאֲחוֹהִי אֲנָא מָאִית וַייָ מִדְכַּר דְּכִיר יָתְכוֹן וְיִסַּק יָתְכוֹן מִן אַרְעָא הָדָא לְאַרְעָא דִּי קַיִּים לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב:", "onk_en": "Yoseif said to his brothers, I will die, and Elohim will surely consider you and bring you up out of this land, to the land which He swore to Avraham, Yitzchok and to Yaakov.", "pj": "וַאֲמַר יוֹסֵף לְאָחוֹי הָא אֲנָא מָיִת וַיְיָ מִידְכַּר יִדְכַּר יַתְכוֹן וְיִסַק יַתְכוֹן מִן אַרְעָא הָדָא לְאַרְעָא דְקַיֵים לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקב", "pj_en": "And Joseph said to his Brethren Behold, I die; but the Lord remembering will remember you and will bring you up from this land, into the land which He sware to Abraham, to Izhak, and to Jakob.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 25, "aliyah": 7, "heb": "וַיַּשְׁבַּ֣ע יוֹסֵ֔ף אֶת־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר פָּקֹ֨ד יִפְקֹ֤ד אֱלֹהִים֙ אֶתְכֶ֔ם וְהַעֲלִתֶ֥ם אֶת־עַצְמֹתַ֖י מִזֶּֽה׃", "onk": "וְאוֹמֵי יוֹסֵף יָת בְּנֵי יִשְׂרָאֵל לְמֵימָר מִדְכַּר דְּכִיר יְיָ יָתְכוֹן וְתַסְּקוּן יָת גַּרְמַי מִכָּא:", "onk_en": "Yoseif made the sons of Yisrael swear, saying, Elohim will surely consider you, and you shall bring my bones up from here.", "pj": "וְאוֹמֵי יוֹסֵף יַת בְּנֵי יִשְרָאֵל לְמֵימַר לִבְנֵיהוֹן הָא אַתּוּן מִשְׁתַּעַבְּדִין בְּמִצְרַיִם וְלָא תְזִידוּן לְמֵיסוֹק מִמִצְרַיִם עַד זְמַן דְיֵיתוּן תְּרֵין פְּרוֹקִין וְיֵימְרוּן לְכוֹן מִדְכַּר דָכִיר יְיָ יַתְכוֹן וּבְעִידָן דְאַתּוּן סַלְקִין תַּסְקוּן יַת גַרְמַי מִיכָּא", "pj_en": "And Joseph adjured the sons of Israel to say to their sons Behold, you will be brought into servitude in Mizraim; but you shall not presume to go up out of Mizraim until the time that two Deliverers shall come, and say to you, Remembering, remember ye the Lord. And at the time when ye go up ye shall carry up my bones from hence.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 50, "v": 26, "aliyah": 7, "heb": "וַיָּ֣מׇת יוֹסֵ֔ף בֶּן־מֵאָ֥ה וָעֶ֖שֶׂר שָׁנִ֑ים וַיַּחַנְט֣וּ אֹת֔וֹ וַיִּ֥ישֶׂם בָּאָר֖וֹן בְּמִצְרָֽיִם׃", "onk": "וּמִית יוֹסֵף בַּר מְאָה וַעֲסַר שְׁנִין וַחֲנָטוּ יָתֵיהּ וְשָׂמוּהִי בְאָרוֹנָא בְּמִצְרָיִם:", "onk_en": "Yoseif died being a hundred and ten years old. They embalmed him and he was placed in a coffin in Egypt. <b>Chazak<\/b>", "pj": "וּמִית יוֹסֵף בַּר מְאָה וְעֶשֶר שְׁנִין וּבְסִימוּ יָתֵיהּ וְעִטְרוּן יָתֵיהּ וְשַווּן יָתֵיהּ בִּגְלוּסְקְמָא וְשַׁקְעִין יָתֵיהּ בְּגוֹ נִילוּס דְמִיצְרָיִם", "pj_en": "And Joseph died, the son of a hundred and ten years. And they embalmed him with perfumes, and laid him in an ark, and submerged him in the midst of the Nilos of Mizraim.", "tj": "וּבְסִימוּ יָתֵיהּ וְשָמוּהוּ בִגְלוּסְקְמָא בְּאַרְעָא דְמִצְרָיִם:", "tj_en": "And they embalmed him, and laid him in an ark in the land of Mizraim.", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
