<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=David+Libre:wght@400;500;700&family=Noto+Sans+Hebrew:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const DATA = [{"ch": 14, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 2, "aliyah": 1, "heb": "זֹ֤את תִּֽהְיֶה֙ תּוֹרַ֣ת הַמְּצֹרָ֔ע בְּי֖וֹם טׇהֳרָת֑וֹ וְהוּבָ֖א אֶל־הַכֹּהֵֽן׃", "onk": "דָּא תְהֵי אוֹרַיְתָא <b>דִסְגִירָא<\/b> בִּיוֹמָא דְדָכוּתֵיהּ וְיִתֵּתֵי לְוָת כַּהֲנָא:", "onk_en": "This shall be the law regarding the person with <i>tzoraas<\/i> [<b>’confinement’<\/b>] on the day of his purification, he shall be brought to the <i>kohein<\/i>.", "pj": "דָא תְּהֵי אוֹרַיְיתָא דִמְצוֹרָעָא בְּיוֹמָא דִדְכוּתֵיהּ וִיתֵיתֵי לְוַת כַּהֲנָא", "pj_en": "This shall be the law for the leper: on the day of his purification he shall be brought to the priest.", "tj": "", "tj_en": "", "rashi": "<b>זאת תהיה תורת וגו'.<\/b> מְלַמֵּד שֶׁאֵין מְטַהֲרִין אוֹתוֹ בַּלַּיְלָה (ספרא):", "rashi_en": "'תהיה תורת וגו ‎זאת THIS SHALL BE THE LAW [OF   THE LEPER IN THE DAY OF HIS BEING PRONOUNCED CLEAN] — The words “in the day” inform us that we may not pronounce him clean at night (Sifra, Metzora, Section 1 3; Megillah 21a)."}, {"ch": 14, "v": 3, "aliyah": 1, "heb": "וְיָצָא֙ הַכֹּהֵ֔ן אֶל־מִח֖וּץ לַֽמַּחֲנֶ֑ה וְרָאָה֙ הַכֹּהֵ֔ן וְהִנֵּ֛ה נִרְפָּ֥א נֶֽגַע־הַצָּרַ֖עַת מִן־הַצָּרֽוּעַ׃", "onk": "וְיִפּוֹק כַּהֲנָא לְמִבָּרָא לְמַשְׁרִיתָא וְיֶחֱזֵי כַהֲנָא וְהָא אִתַּסִּי מַכְתַּשׁ <b>סְגִירוּתָא<\/b> מִן <b>סְגִירָא<\/b>:", "onk_en": "The <i>kohein<\/i> shall go out beyond the encampment. The <i>kohein<\/i> shall see; and behold! the skin-eruption of <i>tzoraas<\/i> [<b>’confinement’<\/b>] has healed from the person with <i>tzoraas<\/i> [<b>’confinement’<\/b>].", "pj": "וְיִפּוֹק כַּהֲנָא לְמִבָּרָא לְמַשְׁרִיתָא וְיֶחֱמֵי וְהָא אִיתְּסֵי סְגִירוּתָא מִן סְגִירָא", "pj_en": "And the priest shall go forth out of the camp, and look, and behold, the leper hath been healed of his leprosy.", "tj": "", "tj_en": "", "rashi": "<b>אל מחוץ למחנה.<\/b> חוּץ לִשְׁלוֹשָׁה מַחֲנוֹת שֶׁנִּשְׁתַּלַח שָׁם בִּימֵי חֲלוּטוֹ:", "rashi_en": "אל מחוץ למחנה OUT OF THE CAMP — outside the three camps to where he (the leper) had been sent during the days he was decidedly a leper (cf. Rashi on Leviticus 13:46)."}, {"ch": 14, "v": 4, "aliyah": 1, "heb": "וְצִוָּה֙ הַכֹּהֵ֔ן וְלָקַ֧ח לַמִּטַּהֵ֛ר שְׁתֵּֽי־צִפֳּרִ֥ים חַיּ֖וֹת טְהֹר֑וֹת וְעֵ֣ץ אֶ֔רֶז וּשְׁנִ֥י תוֹלַ֖עַת וְאֵזֹֽב׃", "onk": "וִיפַקֵּד כַּהֲנָא וְיִסַּב לְמִדַּכֵּי תַּרְתֵּין צִפְּרִין חַיִּין דָּכְיָן וְאָעָא דְאַרְזָא וּ<b>צְבַע<\/b> זְהוֹרִי וְאֵזוֹבָא:", "onk_en": "The <i>kohein<\/i> shall command to take for the person undergoing purification two live, pure [kosher] birds, cedar wood, crimson [<b>colored<\/b>] thread and hyssop.", "pj": "וְיַפְקֵד כַּהֲנָא וְיִסַב לִדְמִדַכֵּי תְּרֵין צִפּוֹרִין חַיָּין וְדַכְיָין וְקֵיסָא דְאַרְזָא וּצְבַע זְהוֹרִי וְאֵיזוֹבָא", "pj_en": "Then the priest shall direct that he who is to be cleansed take two birds, alive and clean, and wood of the cedar, and scarlet (wool), and hyssop.", "tj": "", "tj_en": "", "rashi": "<b>חיות.<\/b> פְּרָט לִטְרֵפוֹת:<br><br><b>טהרות.<\/b> פְּרָט לְעוֹף טָמֵא, לְפִי שֶׁהַנְּגָעִים בָּאִין עַל לָשׁוֹן הָרַע שֶׁהוּא מַעֲשֵׂה פִטְפּוּטֵי דְבָרִים, לְפִיכָךְ הֻזְקְקוּ לְטָהֳרָתוֹ צִפֳּרִים שֶׁמְּפַטְפְּטִין תָּמִיד בְּצִפְצוּף קוֹל (ערכין ט\"ז):<br><br><b>ועץ ארז.<\/b> לְפִי שֶׁהַנְּגָעִים בָּאִין עַל גַּסּוּת הָרוּחַ (שם):<br><br><b>ושני תולעת ואזב.<\/b> מַה תַּקָּנָתוֹ וְיִתְרַפֵּא? יַשְׁפִּיל עַצְמוֹ מִגַּאֲוָתוֹ כְּתוֹלַעַת וּכְאֵזוֹב:<br><br><b>עץ ארז.<\/b> מַקֵּל שֶׁל אֶרֶז:<br><br><b>שני תולעת.<\/b> לָשׁוֹן שֶׁל צֶמֶר צָבוּעַ זְהוֹרִית:", "rashi_en": "חיות LIVING [BIRDS] — This term excludes רפות‎ט, birds that suffer from some fatal organic disease (חיות does not only mean “living”, but also “capable of continuing to live”).<br><br>הרות‎ט CLEAN — This term excludes an unclean bird (of a species that may not be eaten) (cf. Chullin 140a). Because the plagues of leprosy come as a punishment for slander, which is done by chattering, therefore birds are compulsory for his (the leper’s) purification, because these chatter, as it were, continuously with a twittering sound (Arakhin 16b).<br><br>ועץ ארז AND CEDAR WOOD — This lofty tree was used because plagues come also as a punishment for haughtiness (cf. Arakhin 16a).<br><br>ושני תולעת ואזוב AND CRIMSON AND HYSSOP — What is the remedy he should use, that he may be healed? Let him, abandoning pride, regard himself lowly as a worm (תולעת) and as hyssop (cf. Midrash Tanchuma, Metzora 3).<br><br>עץ ארז means a stick of cedar wood (not a cedar tree).<br><br>שני תולעת — a strip of wool dyed crimson."}, {"ch": 14, "v": 5, "aliyah": 1, "heb": "וְצִוָּה֙ הַכֹּהֵ֔ן וְשָׁחַ֖ט אֶת־הַצִּפּ֣וֹר הָאֶחָ֑ת אֶל־כְּלִי־חֶ֖רֶשׂ עַל־מַ֥יִם חַיִּֽים׃", "onk": "וִיפַקֵּד כַּהֲנָא וְיִכּוֹס יָת צִפְּרָא חֲדָא לְמַאן דַּחֲסַף עַל מֵי מַבּוּעַ:", "onk_en": "The <i>kohein<\/i> shall command to slaughter the one bird in an earthenware vessel, over running water.", "pj": "וְיַפְקֵד כַּהֲנָא לְטַבְּחָא וְיִכּוֹס יַת צִיפּוֹרָא חֲדָא לְמָן דַחֲסַף עַל מֵי מַבּוּעַ", "pj_en": "And the priest shall instruct the killer to kill one of the birds in an earthen vessel with spring water.", "tj": "", "tj_en": "", "rashi": "<b>על מים חיים.<\/b> נוֹתֵן אוֹתָם תְּחִלָּה בִּכְלִי, כְּדֵי שֶׁיְּהֵא דַם צִפּוֹר נִכָּר בָּהֶם, וְכַמָּה הֵם? רְבִיעִית (סוטה ט\"ז):", "rashi_en": "אל מים חיים OVER RUNNING WATER — He first places it (the water) in the vessel but only, just enough that the bird’s blood may remain discernible in it. And how much is this? The fourth of a log (Sotah 16b)."}, {"ch": 14, "v": 6, "aliyah": 1, "heb": "אֶת־הַצִּפֹּ֤ר הַֽחַיָּה֙ יִקַּ֣ח אֹתָ֔הּ וְאֶת־עֵ֥ץ הָאֶ֛רֶז וְאֶת־שְׁנִ֥י הַתּוֹלַ֖עַת וְאֶת־הָאֵזֹ֑ב וְטָבַ֨ל אוֹתָ֜ם וְאֵ֣ת&thinsp;<b>׀<\/b> הַצִּפֹּ֣ר הַֽחַיָּ֗ה בְּדַם֙ הַצִּפֹּ֣ר הַשְּׁחֻטָ֔ה עַ֖ל הַמַּ֥יִם הַֽחַיִּֽים׃", "onk": "יָת צִפְּרָא חַיְתָא יִסַּב יָתַהּ וְיָת אָעָא דְאַרְזָא וְיָת <b>צְבַע<\/b> זְהוֹרִי וְיָת אֵזוֹבָא וְיִטְבּוֹל יָתְהוֹן וְיָת צִפְּרָא חַיְתָא בִּדְמָא דְּצִפְּרָא דִּנְכִיסָא עַל מֵי מַבּוּעַ:", "onk_en": "[As for] the living bird, he shall take it; and the cedar wood, the crimson [<b>colored<\/b>] thread and the hyssop and immerse them and the live bird in the blood of the slaughtered bird, over the running water.", "pj": "יַת צִפְּרָא חַיְיתָא יִסַב יָתָהּ וְיַת קֵיסָא דְאַרְזָא וְיַת צְבַע זְהוֹרֵי וְיַת אֵזוֹבָא וִיטַמֵשׁ יַתְהוֹן וְיַת צִפְרָא חַיְיתָא בְּאַדְמָא דְצִפּוֹרָא דִנְכִיסָא וּבְמֵי מַבּוּעַ", "pj_en": "Let him take the living bird with the cedar wood, and the scarlet, and the hyssop, and dip them and the living bird in the blood of the bird that had been killed, and in the spring water.", "tj": "", "tj_en": "", "rashi": "<b>את הצפר החיה יקח אתה.<\/b> מְלַמֵּד שֶׁאֵינוֹ אוֹגְדָהּ עִמָּהֶם, אֶלָּא מַפְרִישָׁהּ לְעַצְמָהּ, אֲבָל הָעֵץ וְהָאֵזוֹב כְּרוּכִין יַחַד בִּלְשׁוֹן הַזְּהוֹרִית, כָּעִנְיָן שֶׁנֶּאֱמַר וְאֶת עֵץ הָאֶרֶז וְאֶת שְׁנִי הַתּוֹלַעַת וְאֶת הָאֵזֹב — קִיחָה אַחַת לִשְׁלָשְׁתָּן; יָכוֹל כְּשֵׁם שֶׁאֵינָהּ בִּכְלַל אֲגֻדָּה, כָּךְ לֹא תְהֵא בִכְלַל טְבִילָה, תַּ\"ל וְטָבַל אוֹתָם וְאֵת הַצִּפֹּר הַחַיָּה — הֶחֱזִיר אֶת הַצִּפּוֹר לִכְלַל טְבִילָה (ספרא):", "rashi_en": "את הצפור החיה יקח אתה AS FOR THE LIVING BIRD HE SHALL‎ TAKE IT — The phrasing (since it does not state ‘‘the living bird and the cedar wood etc. he shall take”, but, “the living bird, he shall take it, and the cedar stick etc.”) informs us that he does not bind it (the bird) together with them (the cedar wood etc.) but keeps it apart by itself. The cedar stick, however, and the hyssop are tied together by the crimson slip, just as it is stated: “and the cedar wood and the crimson slip and the hyssop” — one “taking” for the three (since these three are grouped together after the word יקח). One might think that just as it (the bird) does not come under the regulation as regards binding, so, too, it does not come under the regulation as regards “dipping”; it therefore states “and he shall dip them and the living bird” — thus it (Scripture) mentions the bird again in connection with them to bring it, too, under the regulation of dipping (cf. Sifra, Metzora, Chapter 1 6)."}, {"ch": 14, "v": 7, "aliyah": 1, "heb": "וְהִזָּ֗ה עַ֧ל הַמִּטַּהֵ֛ר מִן־הַצָּרַ֖עַת שֶׁ֣בַע פְּעָמִ֑ים וְטִ֣הֲר֔וֹ וְשִׁלַּ֛ח אֶת־הַצִּפֹּ֥ר הַֽחַיָּ֖ה עַל־פְּנֵ֥י הַשָּׂדֶֽה׃", "onk": "וְיַדִּי עַל דְּמִדַּכֵּי מִן <b>סְגִירוּתָא<\/b> שְׁבַע זִמְנִין וִידַכִּנֵּיהּ וִישַׁלַּח יָת צִפְּרָא חַיְתָא עַל אַפֵּי חַקְלָא:", "onk_en": "He shall sprinkle on the person undergoing purification from the <i>tzoraas<\/i> [<b>’confinement’<\/b>], seven times and make him pure; and send the live bird into the open field.", "pj": "וְיַדֵי עַל בֵּית אַפּוֹהִי דְמִידְכֵּי מִן סְגִירוּתָא שִׁבְעָתֵי זִמְנִין וִידַכִּינֵיהּ וְיִפְטוֹר יַת צִיפּוֹרָא חַיְיתָא עַל אַנְפֵּי חַקְלָא וִיהֵי אִין אִיטִימוֹס הַהוּא גַבְרָא לְמִילְקֵי תוּב בְצוֹרָעָא תַיְיבָא צִיפּוֹרָא חַיְיתָא לְבֵיתֵיהּ בְּיוֹמָא הַהוּא וּמִתְכַשְׁרָא לְמֵיכְלָא וְיַת צִפּוֹרָא נְכִיסָא הֲוָה מִקְבָּר כַּהֲנָא בְּמֵיחְמֵי מְצוֹרָע", "pj_en": "And let him sprinkle it upon the face of him who is to be cleansed of the leprosy seven times, and cleanse him; and send forth. the living bird over the face of the field. And it will be that if that man is again to be stricken with leprosy, the living bird will come back to his house on that day, and may be held fit to be eaten. But the bird that had been killed the priest shall bury in the presence of the leper.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 8, "aliyah": 1, "heb": "וְכִבֶּס֩ הַמִּטַּהֵ֨ר אֶת־בְּגָדָ֜יו וְגִלַּ֣ח אֶת־כׇּל־שְׂעָר֗וֹ וְרָחַ֤ץ בַּמַּ֙יִם֙ וְטָהֵ֔ר וְאַחַ֖ר יָב֣וֹא אֶל־הַֽמַּחֲנֶ֑ה וְיָשַׁ֛ב מִח֥וּץ לְאׇהֳל֖וֹ שִׁבְעַ֥ת יָמִֽים׃", "onk": "וִיצַבַּע דְּמִדַּכֵּי יָת לְבוּשׁוֹהִי וִיגַלַּח יָת כָּל שַׂעֲרֵיהּ וְיַסְחֵי בְמַיָּא וְיִדְכֵּי וּבָתַר כֵּן יֵעוֹל לְמַשְׁרִיתָא וִיתֵב מִבָּרָא לְמַשְׁכְּנֵיהּ שַׁבְעָא יוֹמִין:", "onk_en": "The person undergoing purification shall wash his garments, and shave off all of his hair, and bathe in water, and he will become purified. After [this], he may come into the encampment. He must remain, outside of his tent, for seven days.", "pj": "וְיִצְבַּע דְמִדְכֵּי יַת לְבוּשׁוֹי וִיסַפֵּר יַת כָּל שְעָרֵיהּ וְיַסְחֵי בְּמַיָא וְיִדְכֵּי וּבָתַר כֵּן יֵיעוֹל לְמַשְׁרִיתָא וְיָתִיב מִבָּרָא לְמַשְׁכַּן בֵּית מוֹתְבֵיהּ וְלָא יִקְרַב לְצַד אִינְתְּתֵיהּ שׁוּבְעָא יוֹמִין", "pj_en": "And he who is cleansed shall wash his clothes, and shave off all his hair, and wash himself in water, and be clean; and afterward he may enter the camp, but shall dwell without his tent, the house of his habitation, and come not to the side of his wife for seven days.", "tj": "", "tj_en": "", "rashi": "<b>וישב מחוץ לאהלו.<\/b> מְלַמֵּד שֶׁאָסוּר בְּתַשְׁמִישׁ הַמִּטָּה (שם):", "rashi_en": "וישב מחוץ לאהלו AND HE SHALL ABIDE OUTSIDE HIS TENT — This informs us that matrimonial intercourse is forbidden to him (מחוץ לאהלו implies outside his home — his family life; cf. Deuteronomy 5:27: שובו לכם לאהליכם) (Sifra, Metzora, Section 2 11)."}, {"ch": 14, "v": 9, "aliyah": 1, "heb": "וְהָיָה֩ בַיּ֨וֹם הַשְּׁבִיעִ֜י יְגַלַּ֣ח אֶת־כׇּל־שְׂעָר֗וֹ אֶת־רֹאשׁ֤וֹ וְאֶת־זְקָנוֹ֙ וְאֵת֙ גַּבֹּ֣ת עֵינָ֔יו וְאֶת־כׇּל־שְׂעָר֖וֹ יְגַלֵּ֑חַ וְכִבֶּ֣ס אֶת־בְּגָדָ֗יו וְרָחַ֧ץ אֶת־בְּשָׂר֛וֹ בַּמַּ֖יִם וְטָהֵֽר׃", "onk": "וִיהֵי בְיוֹמָא שְׁבִיעָאָה יְגַלַּח יָת כָּל שַׂעֲרֵיהּ יָת רֵישֵׁיהּ וְיָת דִּקְנֵיהּ וְיָת גְּבִינֵי עֵינוֹהִי וְיָת כָּל שַׂעֲרֵיהּ יְגַלָּח וִיצַבַּע יָת לְבוּשׁוֹהִי וְיַסְחֵי יָת בִּסְרֵיהּ בְּמַיָּא וְיִדְכֵּי:", "onk_en": "It shall be, that on the seventh day, he shall shave off all of his hair, [that of] his head, his beard and his eyebrows; he shall shave off all of his hair. He shall wash his garments, and bathe his body in water and become purified.", "pj": "וִיהֵי בְּיוֹמָא שְׁבִיעָאָה יְסַפֵּר יַת כָּל שְעָרֵיהּ יַת רֵישֵׁיהּ וְיַת דִיקְנֵיהּ וְיַת גְבִינֵי עֵינוֹי וְיַת כָּל שְעָרֵיהּ יְסַפֵּר וְיִצְבַּע יַת לְבוּשׁוֹי וְיַסְחֵי יַת בִּישְרֵיהּ בְּמוֹי וְיִדְכֵּי", "pj_en": "And on the seventh day he shall again shave off all the hair of his head, of the beard, and of the eyebrows, even all his hair shall he shave, and dip his clothes, and wash his flesh in water, and he is clean.", "tj": "", "tj_en": "", "rashi": "<b>את כל שערו וגו'.<\/b> כְּלָל וּפְרָט וּכְלָל, לְהָבִיא כָּל מְקוֹם כִּנּוּס שֵׂעָר וְנִרְאֶה (סוטה ט\"ז):", "rashi_en": "את כל שערו [HE SHALL CUT OFF] ALL HIS HAIR etc. — We have a generalisation (“all his hair”), a particularisation (“his head and his beard and his eyebrows”), and again a generalisation (“and all his hair”). According to the rule of interpretation (מדה ו' י״ג מדות) the purpose of this is to include in the generalisation only such things as are similar to those contained in the particularisation; here it intends to include every spot of the body where there is a collection of hair, it (the hair) being visible (these being the characteristics of the head, beard and eyebrows) (Sotah 16a)."}, {"ch": 14, "v": 10, "aliyah": 1, "heb": "וּבַיּ֣וֹם הַשְּׁמִינִ֗י יִקַּ֤ח שְׁנֵֽי־כְבָשִׂים֙ תְּמִימִ֔ם וְכַבְשָׂ֥ה אַחַ֛ת בַּת־שְׁנָתָ֖הּ תְּמִימָ֑ה וּשְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַשֶּׁ֔מֶן וְלֹ֥ג אֶחָ֖ד שָֽׁמֶן׃", "onk": "וּבְיוֹמָא תְמִינָאָה יִסַּב תְּרֵין אִמְּרִין שַׁלְמִין וְאִמַּרְתָּא חֲדָא בַּת שַׁתָּא שְׁלֶמְתָּא וּתְלָתָא עֶסְרוֹנִין סֻלְתָּא מִנְחָתָא דְּפִילָא בִמְשַׁח וְלֻגָּא חַד דְּמִשְׁחָא:", "onk_en": "On the eighth day, he shall take two unblemished lambs and one ewe in her first year, unblemished, and three tenths fine flour, for a meal-offering, mixed with oil and one <i>log<\/i> of oil.", "pj": "וּבְיוֹמָא תְּמִינָאָה יִסַב תְּרֵין אִמְרִין שַׁלְמִין וְאִמַרְתָּא חֲדָא בַּר שַׁתָּא שְׁלֵימְתָּא וּתְלָתָא עֶסְרוֹנִין סְמִידָא לְמִנְחָתָאפְּתִיכָא בִּמְשַׁח זֵיתָא וְלוּגָא חֲדָא דִמְשַׁח זֵיתָא", "pj_en": "And on the eighth day let him take two lambs unblemished, and one ewe lamb of the year unblemished; and three-tenths of flour for the mincha mingled with olive oil, and one log of olive oil.", "tj": "", "tj_en": "", "rashi": "<b>וכבשה אחת.<\/b> לְחַטָּאת:<br><br><b>ושלשה עשרנים.<\/b> לְנִסְכֵּי שְׁלוֹשָׁה כְבָשִֹים הַלָּלוּ, שֶׁחַטָּאתוֹ וַאֲשָׁמוֹ שֶׁל מְצֹרָע טְעוּנִין נְסָכִים (מנחות צ\"א):<br><br><b>ולג אחד שמן.<\/b> לְהַזּוֹת עָלָיו שֶׁבַע, וְלִתֵּן מִמֶּנּוּ עַל תְּנוּךְ אָזְנוֹ וּמַתַּן בְּהוֹנוֹת:", "rashi_en": "וכבשה אחת AND ONE EWE-LAMB for a sin-offering.<br><br>ושלשה עשרנים AND THREE TENTH DEALS [OF FLOUR] — as the drink-offerings of these three he-lambs (Menachot 91a) — because the sin-offering and the guilt-offering of the leper require drink-offerings (although they are not required with other sin- and guilt-offerings).<br><br>ולג אחד שמן AND ONE LOG OF OIL — to sprinkle on his behalf before the Lord seven times (cf. v. 17), and to put of it upon the tip of his ear and for putting it upon his thumbs (v. 25)."}, {"ch": 14, "v": 11, "aliyah": 1, "heb": "וְהֶעֱמִ֞יד הַכֹּהֵ֣ן הַֽמְטַהֵ֗ר אֵ֛ת הָאִ֥ישׁ הַמִּטַּהֵ֖ר וְאֹתָ֑ם לִפְנֵ֣י יְהֹוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וִיקִים כַּהֲנָא דִמְדַּכֵּי יָת גַּבְרָא דְּמִדַּכֵּי וְיָתְהוֹן קֳדָם יְיָ בִּתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "The <i>kohein<\/i> doing the purification, shall place the man undergoing the purification and the [aforementioned] items, before Adonoy, at the entrance of the Tent of Meeting.", "pj": "וְיוֹקִים כַּהֲנָא דְמִדַכֵּי יַת גַבְרָא דִמְדַכֵּי וְיַת אִימְרַיָא קֳדָם יְיָ בִּתְרַע מַשְׁכַּן זִימְנָא", "pj_en": "And the priest who purifieth the man who is to be cleansed shall make him stand with the lambs before the Lord at the door of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>לפני ה'.<\/b> בְּשַׁעַר נִקָּנוֹר, וְלֹא בָעֲזָרָה עַצְמָהּ, לְפִי שֶׁהוּא מְחֻסָּר כִּפּוּרִים (כלים פ\"א):", "rashi_en": "'לפני ה BEFORE THE LORD — i. e. in the gate of Nicanor and not in the court itself (Sifra, Metzora, Section 3 6; Sotah 8a), since he was still short of atonement (as the sin-offering had not yet been brought, and under such circumstances he was not permitted to enter the court)."}, {"ch": 14, "v": 12, "aliyah": 1, "heb": "וְלָקַ֨ח הַכֹּהֵ֜ן אֶת־הַכֶּ֣בֶשׂ הָאֶחָ֗ד וְהִקְרִ֥יב אֹת֛וֹ לְאָשָׁ֖ם וְאֶת־לֹ֣ג הַשָּׁ֑מֶן וְהֵנִ֥יף אֹתָ֛ם תְּנוּפָ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְיִסַּב כַּהֲנָא יָת אִמְּרָא חֲדָא וִיקָרֵב יָתֵיהּ לַאֲשָׁמָא וְיָת לֻגָּא דְמִשְׁחָא <b>וִירִים<\/b> יָתְהוֹן אֲרָמָא קֳדָם יְיָ:", "onk_en": "The <i>kohein<\/i> shall take one lamb and bring it as a guilt-offering, and (with) the <i>log<\/i> of oil and wave [<b>lift<\/b>] them [<b>up<\/b>] as a wave-offering [<b>an uplifted offering<\/b>] before Adonoy.", "pj": "וְיִסַב כַּהֲנָא יַת אִימְרָא חַד וִיקָרֵיב יָתֵיהּ לְקָרְבָּן אֲשָׁמָא וְיַת לוּגָא דְמִשְׁחָא וְיָרִים יַתְהוֹן אֲרָמָא קֳדָם יְיָ", "pj_en": "And the priest shall take one lamb, and offer him as an oblation for trespass, with the log of oil, and uplift them all elevation before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>והקריב אתו לאשם.<\/b> יַקְרִיבֶנּוּ לְתוֹךְ הָעֲזָרָה לְשֵׁם אָשָׁם לְהָנִיף, שֶׁהוּא טָעוּן תְּנוּפָה חָי (מנחות ס\"ב):<br><br><b>והניף אתם.<\/b> אֶת הָאָשָׁם וְאֶת הַלֹּג (שם ס\"א):", "rashi_en": "והקריב אתו לאשם AND HE SHALL BRING IT FOR A GUILT-OFFERING - This means: he shall bring it inside the court as a guilt-offering to wave it, for it required waving whilst alive (for it states that he shall bring it “and the log of oil” and the latter was not brought as a sacrifice; besides, the act of slaughtering is mentioned in v. 13) (Menachot 62b),<br><br>והניף אתם AND HE SHALL WAVE THEM — the guilt-offering and the log of oil."}, {"ch": 14, "v": 13, "aliyah": 2, "heb": "וְשָׁחַ֣ט אֶת־הַכֶּ֗בֶשׂ בִּ֠מְק֠וֹם אֲשֶׁ֨ר יִשְׁחַ֧ט אֶת־הַֽחַטָּ֛את וְאֶת־הָעֹלָ֖ה בִּמְק֣וֹם הַקֹּ֑דֶשׁ כִּ֡י כַּ֠חַטָּ֠את הָאָשָׁ֥ם הוּא֙ לַכֹּהֵ֔ן קֹ֥דֶשׁ קׇֽדָשִׁ֖ים הֽוּא׃", "onk": "וְיִכּוֹס יָת אִמְּרָא בַּאֲתַר דִּי יִכּוֹס יָת חַטָּאתָא וְיָת עֲלָתָא בַּאֲתַר קַדִּישׁ אֲרֵי כְּחַטָּאתָא אֲשָׁמָא הוּא לְכַהֲנָא קֹדֶשׁ קוּדְשִׁין הוּא:", "onk_en": "He shall slaughter the lamb in the place where he slaughters the sin-offering and the burnt-offering, in the sacred place; for, just as the sin-offering—is the guilt-offering; it belongs to the <i>kohein<\/i>, it is most holy.", "pj": "וְיִכּוֹס טַבְּחָא יַת אִימְרָא בְּאַתְרָא דְיִכּוֹס יַת חַטָאתָא וְיַת עֲלָתָא בַּאֲתַר קַדִישׁ אֲרוּם הֵי כְּחַטָאתָא הֵיכְדֵין אֲשָׁמָא הוּא לְכַהֲנָא קוֹדֶשׁ קוּדְשִׁין הוּא", "pj_en": "And the slayer shall kill the lamb in the place where the sin offering is killed, and the burnt offering, in the holy place; because, as the sin offering, so the trespass offering is the priest's; it is most sacred.", "tj": "", "tj_en": "", "rashi": "<b>במקום אשר ישחט וגו'.<\/b> עַל יֶרֶךְ הַמִּזְבֵּחַ בַּצָּפוֹן, וּמַה תַּלְמוּד לוֹמַר? וַהֲלֹא כְבָר נֶאֱמַר בְּתוֹרַת אָשָׁם בְפָרָשַׁת צַו אֶת אַהֲרֹן שֶׁהָאָשָׁם טָעוּן שְׁחִיטָה בַצָּפוֹן? לְפִי שֶׁיָּצָא זֶה מִכְּלַל אֲשָׁמוֹת לִדּוֹן בְּהַעֲמָדָה, יָכוֹל תְּהֵא שְׁחִיטָתוֹ בִּמְקוֹם הַעֲמָדָתוֹ, לְכָךְ נֶאֱמַר \"וְשָׁחַט … בִּמְקוֹם אֲשֶׁר יִשְׁחַט וְגוֹ'\" (ספרא):<br><br><b>כי כחטאת.<\/b> כִּי כְּכָל הַחַטָּאוֹת <b>האשם<\/b> הַזֶּה <b>הוא לכהן<\/b> — בְּכָל עֲבוֹדוֹת הַתְּלוּיוֹת בַּכֹּהֵן הֻשְׁוָה אָשָׁם זֶה לְחַטָּאת. שֶׁלֹּא תֹאמַר הוֹאִיל וְיָצָא דָמוֹ מִכְּלַל שְׁאָר אֲשָׁמוֹת לִנָּתֵן עַל תְּנוּךְ וּבְהוֹנוֹת, לֹא יְהֵא טָעוּן מַתַּן דָּמִים וְאֵמוּרִים לְגַבֵּי מִזְבֵּחַ, לְכָךְ נֶאֱמַר כִּי כַּחַטָּאת הָאָשָׁם הוּא לַכֹּהֵן יָכוֹל יְהֵא דָמוֹ נִתָּן לְמַעְלָה כַּחַטָּאת, תַּלְמוּד לוֹמַר וְכוּ' בְּתוֹרַת כֹּהֲנִים:", "rashi_en": "‎ ‎'במקום אשר ישחט וגו‎‎‎ IN THE PLACE WHERE HE SHALL SLAUGHTER etc. — i.e. on the side of the altar on the north. But why is this stated at all? Has it not already been stated in in the law about the guilt-offering in the section צו את אהרן that the guilt-offering requires slaughtering on the north side of the altar? But because this guilt-offering has gone forth from (was made an exception to) the general rule of the guilt- offerings in that it is subject to the law of being placed before the Lord (v. 11), one might think that its slaughtering should be in the spot where it was placed (in the gateway of Nicanor; i. e. it shall be made an exception also in respect to the place where it should be slaughtered); on that account it states, “and he shall slaughter [the lamb] in the place where he slaughters [the sin-offering] etc ” (Sifra, Metzora, Section 3 8).<br><br>‎י כחטאת‏‎כ FOR AS THE SIN-OFFERING [SO IS THE GUILT-OFFERING TO THE PRIEST] — This means, for as all sin-offerings so this guilt-offering הוא לכהן is to the priest, i. e. as regards all sacrificial rites which depend upon the priest this guilt-offering is made exactly similar to the sin-offering. In order that you should not say: Since its blood is made an exception to the general rule governing other guilt-offerings in that this is placed upon the tip of the ear and upon the thumbs, it must also form an exception in that it should not require the placing of the blood and the fat portions upon the altar, it therefore expressly states, “for as all sin-offerings so is this guilt-offering to the priest” (לכהן, in reference to the priest, so far as he is concerned). One might also think that its blood must be sprinkled on the upper part of the altar as is the case with the sin-offering! Therefore it says: (Leviticus 7:1, 2) “it is most holy … and its blood shall he sprinkle round about the altar”. So it is set forth in Torath Cohanim (cf. Sifra, Metzora, Chapter 3 1; Zevachim 49a)."}, {"ch": 14, "v": 14, "aliyah": 2, "heb": "וְלָקַ֣ח הַכֹּהֵן֮ מִדַּ֣ם הָאָשָׁם֒ וְנָתַן֙ הַכֹּהֵ֔ן עַל־תְּנ֛וּךְ אֹ֥זֶן הַמִּטַּהֵ֖ר הַיְמָנִ֑ית וְעַל־בֹּ֤הֶן יָדוֹ֙ הַיְמָנִ֔ית וְעַל־בֹּ֥הֶן רַגְל֖וֹ הַיְמָנִֽית׃", "onk": "וְיִסַּב כַּהֲנָא מִדְּמָא דַאֲשָׁמָא וְיִתֵּן כַּהֲנָא עַל <b>רוּם<\/b> אוּדְנָא דְמִדַּכֵּי דְּיַמִּינָא וְעַל אִלְיוֹן יְדֵיהּ דְּיַמִּינָא וְעַל אִלְיוֹן רַגְלֵיהּ דְּיַמִּינָא:", "onk_en": "The <i>kohein<\/i> shall take from the blood of the guilt-offering and the <i>kohein<\/i> shall put it on the middle ridge [<b>upper part<\/b>] of the right ear of the person being purified, and on the thumb of his right hand and on the big toe of his right foot.", "pj": "וְיִסַב כַּהֲנָא מִן אַדְמָא דַאֲשָׁמָא וְיִתֵּן כַּהֲנָא עַל גְדֵירָא מִיצְעָא דְאוּדְנָא דְמִידַכֵּי דְיַמִינָא וְעַל פּוּרְקָא מִיצְעָא דְיָדֵיהּ דְיַמִינָא וְעַל פּוּרְקָא מִיצְעָא דְרִיגְלֵיהּ דְיַמִינָא", "pj_en": "And the priest shall take of the blood of the trespass offering, and shall put it upon the middle point of the right ear of him who is to be cleansed, and upon the middle joint of his right hand, and on the middle joint of his right foot.", "tj": "", "tj_en": "", "rashi": "<b>תנוך.<\/b> גָּדֵר אֶמְצָעִי שֶׁבָּאֹזֶן, וּלְשׁוֹן תְּנוּךְ לֹא נוֹדַע לִי, וְהַפּוֹתְרִים קוֹרִים לוֹ טנד\"רום:<br><br><b>בהן.<\/b> גּוּדָל:", "rashi_en": "תנוך is the inner wall of the ear. The etymology of the word תנוך is unknown to me, and the compilers of glossaries call it (translate it by) tendron (cf. Rashi on Exodus 29:22).<br><br>בהן means THUMB."}, {"ch": 14, "v": 15, "aliyah": 2, "heb": "וְלָקַ֥ח הַכֹּהֵ֖ן מִלֹּ֣ג הַשָּׁ֑מֶן וְיָצַ֛ק עַל־כַּ֥ף הַכֹּהֵ֖ן הַשְּׂמָאלִֽית׃", "onk": "וְיִסַּב כַּהֲנָא מִלֻּגָּא דְמִשְׁחָא וִירִיק עַל יְדָא דְכַהֲנָא דִּשְׂמָאלָא:", "onk_en": "The <i>kohein<\/i> shall take from the <i>log<\/i> of the oil and he shall pour it onto the koheins left palm.", "pj": "וְיִסַב כַּהֲנָא בִּידֵיהּ יְמִינָא מִלוּגָא דְמִשְׁחָא וְיָרִיק עַל יְדָא דְכַהֲנָא דִשְמָלָא", "pj_en": "And the priest, with his right hand, shall take (some) from the log of oil, and pour it upon the priest's left hand;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 16, "aliyah": 2, "heb": "וְטָבַ֤ל הַכֹּהֵן֙ אֶת־אֶצְבָּע֣וֹ הַיְמָנִ֔ית מִן־הַשֶּׁ֕מֶן אֲשֶׁ֥ר עַל־כַּפּ֖וֹ הַשְּׂמָאלִ֑ית וְהִזָּ֨ה מִן־הַשֶּׁ֧מֶן בְּאֶצְבָּע֛וֹ שֶׁ֥בַע פְּעָמִ֖ים לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְיִטְבּוֹל כַּהֲנָא יָת אֶצְבְּעֵיהּ דְיַמִּינָא מִן מִשְׁחָא דִּי עַל יְדֵיהּ דִּשְׂמָאלָא וְיַדִּי מִן מִשְׁחָא בְּאֶצְבְּעֵיהּ שְׁבַע זִמְנִין קֳדָם יְיָ:", "onk_en": "The <i>kohein<\/i> shall immerse his right finger in some of the oil that is on his left palm and he shall sprinkle some of the oil with his finger seven times before Adonoy.", "pj": "וִיטַמַשׁ כַּהֲנָא יַת אִיצְבְּעֵיהּ יְמִינָא מִן מִשְׁחָא דְעַל יְדֵיהּ שְמָאלָא וְיַדֵי מִשְׁחָא בְּאַדְבְּעֵיהּ שַׁבְעֲתָא זִמְנִין", "pj_en": "and the priest shall dip his right hand finger in the oil which is in his left hand, and sprinkle the oil with his finger seven times.", "tj": "", "tj_en": "", "rashi": "<b>לפני ה'.<\/b> כְּנֶגֶד בֵּית קָדְשֵׁי הַקֳּדָשִׁים (ספרא):", "rashi_en": "'לפני ה‎ [AND HE SHALL SPRINKLE …] BEFORE THE LORD — in the direction of the Holy of Holies (cf. Sifra, Metzora, Chapter 3 9)."}, {"ch": 14, "v": 17, "aliyah": 2, "heb": "וּמִיֶּ֨תֶר הַשֶּׁ֜מֶן אֲשֶׁ֣ר עַל־כַּפּ֗וֹ יִתֵּ֤ן הַכֹּהֵן֙ עַל־תְּנ֞וּךְ אֹ֤זֶן הַמִּטַּהֵר֙ הַיְמָנִ֔ית וְעַל־בֹּ֤הֶן יָדוֹ֙ הַיְמָנִ֔ית וְעַל־בֹּ֥הֶן רַגְל֖וֹ הַיְמָנִ֑ית עַ֖ל דַּ֥ם הָאָשָֽׁם׃", "onk": "וּמִשְּׁאָר מִשְׁחָא דִּי עַל יְדֵיהּ יִתֵּן כַּהֲנָא עַל <b>רוּם<\/b> אוּדְנָא דְּמִדַּכֵּי דְּיַמִּינָא וְעַל אִלְיוֹן יְדֵיהּ דְּיַמִּינָא וְעַל אִלְיוֹן רַגְלֵיהּ דְּיַמִּינָא עַל דְּמָא דַאֲשָׁמָא:", "onk_en": "From the remaining oil that is on his palm, the <i>kohein<\/i> shall put on the middle ridge [<b>upper part<\/b>] of the right ear of the person being purified, and on the thumb of his right hand, and on the big toe of his right foot; on [over] the blood of the guilt-offering.", "pj": "וּמִמַה דְמִשְׁתַּיֵיר מִמִשְׁחָא דְעַל יְדֵיהּ יִתֵּן כַּהֲנָא עַל חַסְחוּס דְאוּדְנָא דְמִידְכֵּי דְיַמִינָא וְעַל פּוּרְקָא מִיצְעָא דְיָדֵיהּ יַמִינָא וְעַל פּוּרְקָא מִיצְעָא דְרִיגְלֵיהּ יַמִינָא עִילַוֵי אֲתַר דְיָהַב מִן שֵׁרוּיָא אֲדָם קָרְבָּן דַאֲשָׁמָא", "pj_en": "And of what remaineth of the oil that is in his hand the priest shall put some upon the cartilage of the right ear of him who is to be cleansed, and upon the middle finger of his right hand, and on the middle toe of his right foot upon the spot whereon he had first put the blood of the trespass offering.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 18, "aliyah": 2, "heb": "וְהַנּוֹתָ֗ר בַּשֶּׁ֙מֶן֙ אֲשֶׁר֙ עַל־כַּ֣ף הַכֹּהֵ֔ן יִתֵּ֖ן עַל־רֹ֣אשׁ הַמִּטַּהֵ֑ר וְכִפֶּ֥ר עָלָ֛יו הַכֹּהֵ֖ן לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּדְאִשְׁתָּאַר בְּמִשְׁחָא דִּי עַל יְדָא דְכַהֲנָא יִתֵּן עַל רֵישָׁא דְּמִדַּכֵּי וִיכַפֵּר עֲלוֹהִי כַּהֲנָא קֳדָם יְיָ:", "onk_en": "Whatever oil remains that is on the palm of the <i>kohein<\/i>, he shall put on the head of the person undergoing purification. The <i>kohein<\/i> will atone for him before Adonoy.", "pj": "וּמַה דְמִשְׁתַּיֵיר מִן מִשְׁחָא דְעַל יְדָא דְכַהֲנָא יִתֵּן עַל רֵישָׁא דְמִידְכֵּי וִיכַפֵּר עֲלוֹי כַּהֲנָא קֳדָם יְיָ", "pj_en": "And that which yet remaineth of the oil that is in the priest's hand he shall put upon the head of him who is to be cleansed, and the priest shall make atonement for him before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 19, "aliyah": 2, "heb": "וְעָשָׂ֤ה הַכֹּהֵן֙ אֶת־הַ֣חַטָּ֔את וְכִפֶּ֕ר עַל־הַמִּטַּהֵ֖ר מִטֻּמְאָת֑וֹ וְאַחַ֖ר יִשְׁחַ֥ט אֶת־הָעֹלָֽה׃", "onk": "וְיַעְבֵּד כַּהֲנָא יָת חַטָּאתָא וִיכַפֵּר עַל דְּמִדַּכֵּי מְסּוֹבְתֵיהּ וּבָתַר כֵּן יִכּוֹס יָת עֲלָתָא:", "onk_en": "The <i>kohein<\/i> shall do (offer) the sin-offering and atone for the person undergoing purification from his impurity and afterwards he shall slaughter the burnt-offering.", "pj": "וְיַעֲבֵיד כַּהֲנָא יַת קָרְבַּן חַטָאתָא וִיכַפֵּר עַל דְמִידְכֵּי מִסוֹאֲבוּתֵיהּ וּבָתַר כֵּן יִכּוֹס יַת עֲלָתָא", "pj_en": "And the priest shall perform the oblation of the sin offering, and make atonement for him who is to be cleansed from his defilement; and afterwards shall he kill the burnt offering.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 20, "aliyah": 2, "heb": "וְהֶעֱלָ֧ה הַכֹּהֵ֛ן אֶת־הָעֹלָ֥ה וְאֶת־הַמִּנְחָ֖ה הַמִּזְבֵּ֑חָה וְכִפֶּ֥ר עָלָ֛יו הַכֹּהֵ֖ן וְטָהֵֽר׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיַסֵּק כַּהֲנָא יָת עֲלָתָא וְיָת מִנְחָתָא לְמַדְבְּחָא וִיכַפֵּר עֲלוֹהִי כַּהֲנָא וְיִדְכֵּי:", "onk_en": "The <i>kohein<\/i> shall raise up the burnt-offering and the meal-offering onto the altar and the <i>kohein<\/i> will atone for him and he will be purified.", "pj": "וְיַסִיק כַּהֲנָא יַת עֲלָתָא וְיַת מִנְחָתָא לְמַדְבְּחָא וִיכַפֵּר עֲלוֹי כַּהֲנָא וְיִדְכֵּי", "pj_en": "And the priest shall offer the burnt offering with the mincha at the altar, and the priest shall make atonement for him, and he will be clean.", "tj": "", "tj_en": "", "rashi": "<b>ואת המנחה.<\/b> מִנְחַת נְסָכִים שֶׁל בְּהֵמָה:", "rashi_en": "ואת המנחה AND THE MEAL-OFFERING — the meal-offering of the drink-offering that accompanies an animal sacrifice."}, {"ch": 14, "v": 21, "aliyah": 3, "heb": "וְאִם־דַּ֣ל ה֗וּא וְאֵ֣ין יָדוֹ֮ מַשֶּׂ֒גֶת֒ וְ֠לָקַ֠ח כֶּ֣בֶשׂ אֶחָ֥ד אָשָׁ֛ם לִתְנוּפָ֖ה לְכַפֵּ֣ר עָלָ֑יו וְעִשָּׂר֨וֹן סֹ֜לֶת אֶחָ֨ד בָּל֥וּל בַּשֶּׁ֛מֶן לְמִנְחָ֖ה וְלֹ֥ג שָֽׁמֶן׃", "onk": "וְאִם מִסְכֵּן הוּא וְלֵית יְדֵיהּ מַדְבְּקָא וְיִסַּב אִמַּר חַד אֲשָׁמָא <b>לַאֲרָמָא<\/b> לְכַפָּרָא עֲלוֹהִי וְעִסְרוֹנָא סֻלְתָּא חַד דְּפִיל בִּמְשַׁח לְמִנְחָא וְלֻגָּא דְמִשְׁחָא:", "onk_en": "If he is poor and his means are not sufficient, he shall take one lamb as a guilt-offering, for a wave-offering [<b>an uplifted offering<\/b>] to atone for him and one tenth fine flour mixed with oil, as a meal-offering and a <i>log<\/i> of oil.", "pj": "וְאִין מִסְכַּן הוּא וְלֵית יְדֵיהּ מְסַפְּקָא וְיִסַב אִימַר חַד אֲשָׁמָא לַאֲרָמָא מְטוֹל לִמְכַפְּרָא עֲלוֹי וְעֶשְרוֹנָא סְמִידָא חַד פְּתוּךְ בִּמְשַׁח זֵיתָא לְמִנְחָתָא וְלוּגָא דִמְשַׁח זֵיתָא", "pj_en": "But if he be a poor man, and his hand have not sufficiency, let him take one lamb for the trespass offering to be an elevation to make atonement for him, and one tenth of flour mingled with olive oil for the mincha, and a log of olive oil.", "tj": "", "tj_en": "", "rashi": "<b>ועשרון סלת אחד.<\/b> לְכֶבֶשׂ זֶה שֶׁהוּא אֶחָד, יָבִיא עִשָּׂרוֹן אֶחָד לִנְסָכָיו:<br><br><b>ולג שמן.<\/b> לָתֵת מִמֶּנּוּ עַל הַבְּהוֹנוֹת; וְשֶׁמֶן שֶׁל נִסְכֵּי הַמִּנְחָה לֹא הֻזְקַק הַכָּתוּב לְפָרֵשׁ:", "rashi_en": "ועשרון סלת אחד‎ AND ONE TENTH DEAL OF FLOUR — for this lamb which is a single one he shall bring one tenth part of flour to accompany its drink-offering.<br><br>שמן ‎‏ ולג AND A LOG OF OIL — to place of it upon the thumbs. The quantity of the oil required for the libations of the meal-offering Scripture did not find it necessary to specify here (since it is given in Numbers 15:4 where three logs are prescribed; consequently the one log mentioned hero cannot be intended for the libations but for placing on the thumbs)."}, {"ch": 14, "v": 22, "aliyah": 3, "heb": "וּשְׁתֵּ֣י תֹרִ֗ים א֤וֹ שְׁנֵי֙ בְּנֵ֣י יוֹנָ֔ה אֲשֶׁ֥ר תַּשִּׂ֖יג יָד֑וֹ וְהָיָ֤ה אֶחָד֙ חַטָּ֔את וְהָאֶחָ֖ד עֹלָֽה׃", "onk": "וְתַרְתֵּין שַׁפְנִינִין אוֹ תְרֵין בְּנֵי יוֹנָה דִּי תַדְבֵּק יְדֵיהּ וִיהֵי חַד חַטָּאתָא וְחַד עֲלָתָא:", "onk_en": "And two turtledoves or two young pigeons such as his means suffice. One shall be for a sin-offering and one shall be for a burnt-offering.", "pj": "וְתַרְתֵּין שַׁפְנִינִין רַבְרְבִין אוֹ תְרֵין גוֹזָלִין בְּנֵי יָווֹן מַה דְתִסְפּוֹק יְדֵיהּ וִיהֵי חַד חַטָאתָא וְחַד עֲלָתָא", "pj_en": "And two large turtle doves, or two young pigeons, of the sufficiency of his hand, and let one be for the sin and one for the burnt offering.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 23, "aliyah": 3, "heb": "וְהֵבִ֨יא אֹתָ֜ם בַּיּ֧וֹם הַשְּׁמִינִ֛י לְטׇהֳרָת֖וֹ אֶל־הַכֹּהֵ֑ן אֶל־פֶּ֥תַח אֹֽהֶל־מוֹעֵ֖ד לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְיַיְתִי יָתְהוֹן בְּיוֹמָא תְמִינָאָה לְדַכָּיוּתֵיהּ לְוָת כַּהֲנָא לִתְרַע מַשְׁכַּן זִמְנָא קֳדָם יְיָ:", "onk_en": "He shall bring them on the eighth day of his purification, to the <i>kohein<\/i>, to the entrance of the Tent of Meeting, before Adonoy.", "pj": "וְיַיְתֵי יַתְהוֹן בְּיוֹמָא תְמִינָאָה לִדְכוּתֵיהּ לְוַת כַּהֲנָא לִתְרַע מַשְׁכַּן זִימְנָא קֳדָם יְיָ", "pj_en": "And he shall bring them on the eighth day for his purification unto the priest, at the door of the tabernacle of ordinance. ___", "tj": "", "tj_en": "", "rashi": "<b>ביום השמיני לטהרתו.<\/b> שְׁמִינִי לְצִפֳּרִים וּלְהַזָּאַת עֵץ אֶרֶז וְאֵזוֹב וּשְׁנִי תּוֹלַעַת:", "rashi_en": "ביום השמיני לטהרתו ON TIIE EIGHTH DAY OF HIS BEING PRONOUNCED CLEAN — i. e. the eighth day after the birds have been brought and he has been sprinkled with the cedar stick, the hyssop and the crimson wool (cf. v. 10)."}, {"ch": 14, "v": 24, "aliyah": 3, "heb": "וְלָקַ֧ח הַכֹּהֵ֛ן אֶת־כֶּ֥בֶשׂ הָאָשָׁ֖ם וְאֶת־לֹ֣ג הַשָּׁ֑מֶן וְהֵנִ֨יף אֹתָ֧ם הַכֹּהֵ֛ן תְּנוּפָ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְיִסַּב כַּהֲנָא יָת אִמְּרָא דַאֲשָׁמָא וְיָת לֻגָּא דְמִשְׁחָא וִירִים יָתְהוֹן כַּהֲנָא <b>אֲרָמָא<\/b> קֳדָם יְיָ:", "onk_en": "The <i>kohein<\/i> shall take the guilt-offering sheep and the <i>log<\/i> of oil and the <i>kohein<\/i> shall wave [<b>lift<\/b>] them [<b>up<\/b>] as a wave-offering [<b>an uplifted offering<\/b>] before Adonoy.", "pj": "וְיִסַב כַּהֲנָא יַת אִימְרָא דַאֲשָׁמָא וְיַת לוּגָא דְמִשְׁחָא וִירֵים יַתְהוֹן אֲרָמָא קֳדָם יְיָ", "pj_en": "And the priest shall take the lamb for the trespass offering, and the log of oil, and uplift them, an elevation before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 25, "aliyah": 3, "heb": "וְשָׁחַט֮ אֶת־כֶּ֣בֶשׂ הָֽאָשָׁם֒ וְלָקַ֤ח הַכֹּהֵן֙ מִדַּ֣ם הָֽאָשָׁ֔ם וְנָתַ֛ן עַל־תְּנ֥וּךְ אֹֽזֶן־הַמִּטַּהֵ֖ר הַיְמָנִ֑ית וְעַל־בֹּ֤הֶן יָדוֹ֙ הַיְמָנִ֔ית וְעַל־בֹּ֥הֶן רַגְל֖וֹ הַיְמָנִֽית׃", "onk": "וְיִכּוֹס יָת אִמְּרָא דַאֲשָׁמָא וְיִסַּב כַּהֲנָא מִדְּמָא דַאֲשָׁמָא וְיִתֵּן עַל <b>רוּם<\/b> אוּדְנָא דְמִדַּכֵּי דְּיַמִּינָא וְעַל אִלְיוֹן יְדֵיהּ דְּיַמִּינָא וְעַל אִלְיוֹן רַגְלֵיהּ דְּיַמִּינָא:", "onk_en": "He shall slaughter the guilt-offering lamb. The <i>kohein<\/i> shall take some blood of the guilt-offering and put it on the middle ridge [<b>upper part<\/b>] of the right ear of the person undergoing purification, and on the thumb of his right hand and the big toe of his right foot.", "pj": "וְיִכּוֹס טַבְּחָא יַת אִימְרָא דַאֲשָׁמָא וְיִסַב כַּהֲנָא מִן אַדְמָא דַאֲשָׁמָא וְיִתֵּן עַל גְדֵירָא מִיצְעָא דְאוּדְנָא דְמִידְכֵּי יְמִינָא וְעַל פּוּרְקָא מִיצְעָא דְיָדֵיהּ יְמִינָא וְעַל פּוּרְקָא מִיצְעָא דְרִיגְלֵיהּ יְמִינָא", "pj_en": "And the slayer shall kill the lamb of the trespass offering, and the priest shall take the blood of the trespass offering, and put it upon the middle cartilage of the right ear of him who is to be cleansed, and on the middle joint of his right hand, and on the middle joint of his right foot.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 26, "aliyah": 3, "heb": "וּמִן־הַשֶּׁ֖מֶן יִצֹ֣ק הַכֹּהֵ֑ן עַל־כַּ֥ף הַכֹּהֵ֖ן הַשְּׂמָאלִֽית׃", "onk": "וּמִן מִשְׁחָא יְרִיק כַּהֲנָא עַל יְדָא דְכַהֲנָא דִּשְׂמָאלָא:", "onk_en": "The <i>kohein<\/i> shall pour some of the oil onto the koheins left palm.", "pj": "וּמִן מִשְׁחָא יָרִיק כַּהֲנָא בְּיַד יְמִינֵיהּ עַל יְדָא דְכַהֲנָא דִשְמָאלָא", "pj_en": "And the priest shall pour some of the oil with his right hand into the priest's left hand,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 27, "aliyah": 3, "heb": "וְהִזָּ֤ה הַכֹּהֵן֙ בְּאֶצְבָּע֣וֹ הַיְמָנִ֔ית מִן־הַשֶּׁ֕מֶן אֲשֶׁ֥ר עַל־כַּפּ֖וֹ הַשְּׂמָאלִ֑ית שֶׁ֥בַע פְּעָמִ֖ים לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וְיַדִּי כַהֲנָא בְּאֶצְבְּעֵיהּ דְּיַמִּינָא מִן מִשְׁחָא דִּי עַל יְדֵיהּ דִּשְׂמָאלָא שְׁבַע זִמְנִין קֳדָם יְיָ:", "onk_en": "The <i>kohein<\/i> shall sprinkle, with his right finger, some of the oil that is on his left palm, seven times before Adonoy.", "pj": "וְיַדֵי כַּהֲנָא בְּאִידְבְּעֵיהּ דְיַמִינָא מִמִישְׁחָא דְעַל יְדֵיהּ דִשְמָאלָא שִׁבְעֲתֵי זִמְנִין קֳדָם יְיָ", "pj_en": "and the priest with the finger of his right hand shall sprinkle of the oil that is in his left hand seven times before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 28, "aliyah": 3, "heb": "וְנָתַ֨ן הַכֹּהֵ֜ן מִן־הַשֶּׁ֣מֶן&thinsp;<b>׀<\/b> אֲשֶׁ֣ר עַל־כַּפּ֗וֹ עַל־תְּנ֞וּךְ אֹ֤זֶן הַמִּטַּהֵר֙ הַיְמָנִ֔ית וְעַל־בֹּ֤הֶן יָדוֹ֙ הַיְמָנִ֔ית וְעַל־בֹּ֥הֶן רַגְל֖וֹ הַיְמָנִ֑ית עַל־מְק֖וֹם דַּ֥ם הָאָשָֽׁם׃", "onk": "וְיִתֵּן כַּהֲנָא מִן מִשְׁחָא דִּי עַל יְדֵיהּ עַל <b>רוּם<\/b> אוּדְנָא דְמִדַּכֵּי דְּיַמִּינָא וְעַל אִלְיוֹן יְדֵיהּ דְּיַמִּינָא וְעַל אִלְיוֹן רַגְלֵיהּ דְיַמִּינָא עַל אֲתַר דְּמָא דַאֲשָׁמָא:", "onk_en": "The <i>kohein<\/i> shall put some of the oil that is on his palm, on the middle ridge [<b>upper part<\/b>] of the right ear of the person undergoing purification, and on the thumb of his right hand and on the big toe of his right foot, on the place of the blood of the guilt-offering.", "pj": "וְיִתֵּן כַּהֲנָא מִמִישְׁחָא דְעַל יְדֵיהּ עַל גְדֵירָא מִיצְעָא דְאוּדְנָא דְמִידְכֵּי יַמִינָא וְעַל פּוּרְקָא מִיצְעָא דְיָדֵיהּ יַמִינָא וְעַל פּוּרְקָא מִיצְעָא דְרִיגְלֵיהּ יַמִינָא עַל אַתְרֵי דִיהַב מִן שֵׁירוּיָא אֲדַם קָרְבַּן אֲשָׁמָא", "pj_en": "And the priest shall put of the oil that is in his hand on the middle cartilage of the right ear of him who is to be cleansed, and on the middle joint of his right hand, and on the middle joint of his right foot, upon the spot whereon he first put the blood of the trespass offering.", "tj": "", "tj_en": "", "rashi": "<b>על מקום דם האשם.<\/b> אֲפִלּוּ נִתְקַנַּח הַדָּם; לִמֵּד, שֶׁאֵין הַדָּם גּוֹרֵם אֶלָּא הַמָּקוֹם גּוֹרֵם (ספרא):", "rashi_en": "על מקום דם האשם UPON THE PLACE OF THE BLOOD OF THE GUILT-OFFERING — even though the blood has been wiped off; this teaches that it is not the presence of the blood that brings about the validity of this rite but it is the place (the fact that the oil has been placed on the proper spot) that brings it about (Sifra, Metzora, Chapter 3 10; Menachot 10a)."}, {"ch": 14, "v": 29, "aliyah": 3, "heb": "וְהַנּוֹתָ֗ר מִן־הַשֶּׁ֙מֶן֙ אֲשֶׁר֙ עַל־כַּ֣ף הַכֹּהֵ֔ן יִתֵּ֖ן עַל־רֹ֣אשׁ הַמִּטַּהֵ֑ר לְכַפֵּ֥ר עָלָ֖יו לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּדְיִשְׁתָּאַר מִן מִשְׁחָא דִּי עַל יְדָא דְכַהֲנָא יִתֵּן עַל רֵישָׁא דְמִדַּכֵּי לְכַפָּרָא עֲלוֹהִי קֳדָם יְיָ:", "onk_en": "What remains of the oil that is on the palm of the <i>kohein<\/i>, he shall put on the head of the person undergoing purification, to achieve his atonement before Adonoy.", "pj": "וּמַה דְאִשְׁתַּיֵיר מִן מִשְׁחָא דְעַל יְדָא דְכַהֲנָא יִתֵּן עַל רֵישָׁא דְמִידְכֵּי לְכַפָּרָא עֲלוֹי קֳדָם יְיָ", "pj_en": "And what remaineth of the oil that is upon the priest's hand he shall put upon the head of him who is to be cleansed, to atone for him before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 30, "aliyah": 3, "heb": "וְעָשָׂ֤ה אֶת־הָֽאֶחָד֙ מִן־הַתֹּרִ֔ים א֖וֹ מִן־בְּנֵ֣י הַיּוֹנָ֑ה מֵאֲשֶׁ֥ר תַּשִּׂ֖יג יָדֽוֹ׃", "onk": "וְיַעְבֵּד יָת חַד מִן שַׁפְנִינַיָּא אוֹ מִן בְּנֵי יוֹנָה מִדִּי תַדְבֵּק יְדֵיהּ:", "onk_en": "He shall do (offer) one of the turtledoves or of the young pigeons, from that which his means suffice,", "pj": "וְיַעֲבֵיד יַת חַד מִן שַׁפְנִינַיָא רַבְרְבַיָא אוֹ מִן גוֹזְלִין בְּנֵי יָוֹן מִן מַה דִמְסַפְּקָא יְדֵיהּ", "pj_en": "And the priest shall perform (the offering of) one of the large turtle doves, or of the pigeons of which his hand had sufficiency.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 31, "aliyah": 3, "heb": "אֵ֣ת אֲשֶׁר־תַּשִּׂ֞יג יָד֗וֹ אֶת־הָאֶחָ֥ד חַטָּ֛את וְאֶת־הָאֶחָ֥ד עֹלָ֖ה עַל־הַמִּנְחָ֑ה וְכִפֶּ֧ר הַכֹּהֵ֛ן עַ֥ל הַמִּטַּהֵ֖ר לִפְנֵ֥י יְהֹוָֽה׃", "onk": "יָת דִּי תַדְבֵּק יְדֵיהּ יָת חַד חַטָּאתָא וְיָת חַד עֲלָתָא עַל מִנְחָתָא וִיכַפֵּר כַּהֲנָא עַל דְּמִדַּכֵּי קֳדָם יְיָ:", "onk_en": "that for which his means are sufficient, one for a sin-offering, and the other for a burnt-offering with the meal-offering. The <i>kohein<\/i> will atone for the person undergoing purification before Adonoy.", "pj": "יַת מַה דִמְסַפְּקָא יְדֵיהּ לְאַיְיתַיָא יַיְתֵי יַת חַד חַטָאתָא וְיַת חַד עֲלָתָא עַל קָרְבַּן מִנְחָתָא וִיכַפֵּר כַּהֲנָא עַל דְמִידְכֵּי קֳדָם יְיָ", "pj_en": "That which his hand was sufficient to bring, let him bring, one for the sin, and one for the burnt offering, with the oblation of the mincha, and let the priest make atonement for him who is to be cleansed before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 32, "aliyah": 3, "heb": "זֹ֣את תּוֹרַ֔ת אֲשֶׁר־בּ֖וֹ נֶ֣גַע צָרָ֑עַת אֲשֶׁ֛ר לֹֽא־תַשִּׂ֥יג יָד֖וֹ בְּטׇהֳרָתֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "דָּא אוֹרַיְתָא דִּי בֵיהּ מַכְתַּשׁ <b>סְגִירוּ<\/b> דִּי לָא תַדְבֵּק יְדֵיהּ בְּדָכוּתֵיהּ:", "onk_en": "This is the law of whoever has the skin-eruption of <i>tzoraas<\/i> [<b>’confinement’<\/b>] whose means are not sufficient in his purification.", "pj": "דָא תִּיהֲוֵי גְזֵירַת אַחֲוָיַית דְבֵיהּ מַכְתַּשׁ צוֹרַעְתָּא אִין לָא סְפִּיקַת בֵּין יְדוֹי לְמַיְיתַיָא מִן קָרְבָּנַיָא רַבְרְבַיָא יַיְתֵי מִן קָרְבָּנַיָא קְלִילַיָיא הָאִילֵין דְמִיפַרְשִׁין הָכָא לְיוֹם דְכוּתֵיהּ", "pj_en": "This is the decree of instruction for him in whom is the plague of leprosy. If there be not sufficiency in his hands to bring the greater oblations, let him bring of these oblations which are easier (and) which are here explained, on the day of his purification.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 33, "aliyah": 4, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר", "pj_en": "And the Lord spake with Mosheh and with Aharon, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 34, "aliyah": 4, "heb": "כִּ֤י תָבֹ֙אוּ֙ אֶל־אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֥ר אֲנִ֛י נֹתֵ֥ן לָכֶ֖ם לַאֲחֻזָּ֑ה וְנָתַתִּי֙ נֶ֣גַע צָרַ֔עַת בְּבֵ֖ית אֶ֥רֶץ אֲחֻזַּתְכֶֽם׃", "onk": "אֲרֵי תֵעֲלוּן לְאַרְעָא דִכְנַעַן דִּי אֲנָא יָהֵב לְכוֹן לְאַחֲסָנָא וְאֶתֵּן מַכְתַּשׁ <b>סְגִירוּ<\/b> בְּבֵית אַרְעָא אַחֲסְנְתְּכוֹן:", "onk_en": "When you will come into the land of Canaan that I will give to you for a possession, and I shall put the eruption of <i>tzoraas<\/i> [<b>’confinement’<\/b>] in the house of the land of your possession.", "pj": "אֲרוּם תֵיעָלוּן לְאַרְעָא דִכְנָעַן דַאֲנָא יָהֵב לְכוֹן לְאַחְסָנָא וּמִשְׁתַּכַּח גְבַר דִבְנֵי בֵיתָא בַּחֲטוֹפִין וְאֶתֵּן מַכְתַּשׁ סְגִירוּ בְּבֵית אֲרַע אַחְסַנְתְּכוֹן", "pj_en": "When you have entered upon the land of Kenaan which I will give you for a possession, and a man who hath builded a house by rapine finds that I have put the plague of leprosy in the house of the land of your inheritance;", "tj": "", "tj_en": "", "rashi": "<b>ונתתי נגע צרעת.<\/b> בְּשׂוֹרָה הִיא לָהֶם שֶׁהַנְּגָעִים בָּאִים עֲלֵיהֶם; לְפִי שֶׁהִטְמִינוּ אֱמוֹרִיִּים מַטְמוֹנִיּוֹת שֶׁל זָהָב בְּקִירוֹת בָּתֵּיהֶם כָּל אַרְבָּעִים שָׁנָה שֶׁהָיוּ יִשְֹרָאֵל בַּמִּדְבָּר, וְעַל יְדֵי הַנֶּגַע נוֹתֵץ הַבַּיִת וּמוֹצְאָן (ויקרא רבה י\"ז):", "rashi_en": "ונתתי נגע צרעת [WHEN YOU COME TO THE LAND …]I WILL PUT THE PLAGUE OF THE LEPROSY — This was an announcement to them that these plagues would come upon them (Sifra, Metzora, Section 5 4; Horayot 10a), because the Amorites concealed treasures of gold in the walls of their houses during the whole 40 years the Israelites were in the wilderness (in order that these might not possess them when they conquered Palestine,) and in consequence of the plague they would pull down the house and discover them (Leviticus Rabbah 17:6)."}, {"ch": 14, "v": 35, "aliyah": 4, "heb": "וּבָא֙ אֲשֶׁר־ל֣וֹ הַבַּ֔יִת וְהִגִּ֥יד לַכֹּהֵ֖ן לֵאמֹ֑ר כְּנֶ֕גַע נִרְאָ֥ה לִ֖י בַּבָּֽיִת׃", "onk": "וְיֵיתֵי דְּדִילֵיהּ בֵּיתָא וִיחַוִּי לְכַהֲנָא לְמֵימָר כְּמַכְתָּשָׁא אִתְחֲזִי לִי בְּבֵיתָא:", "onk_en": "Whoevers house it is, shall come and tell to the <i>kohein<\/i>, saying, Something like an eruption has appeared to me in the house.", "pj": "וְיֵיתֵי דְדִילֵיהּ בֵיתָא וִיתַנֵי לְכַהֲנָא לְמֵימָר הֵי כְמַכְתְּשָׁא אִיתְחֲמֵי לִי בְּבֵיתָא", "pj_en": "and he who owneth the house shall come to the priest, saying, There is a plague, as it appeareth to me, in the house:", "tj": "", "tj_en": "", "rashi": "<b>כנגע נראה לי בבית.<\/b> שֶׁאֲפִלּוּ הוּא חָכָם וְיוֹדֵעַ שֶׁהוּא נֶגַע וַדַּאי, לֹא יִפְסֹק דָּבָר בָּרוּר לוֹמַר \"נֶגַע נִרְאָה לִי\", אֶלָּא \"כְּנֶגַע נִרְאָה לִי\":", "rashi_en": "כנגע נראה לי בבית SOMETHING LIKE A PLAGUE HATH SHOWN ITSELF TO ME IN THE HOUSE — Even if he (the owner of the house) be a learned man and knows for sure that it is a plague he shall not decide the matter as a certainty saying, \"a plague hath shown itself to me\" but, “something like a plague hath shown itself to me\" (Mishnah Negaim 12:5; Sifra, Metzora, Section 5 10)."}, {"ch": 14, "v": 36, "aliyah": 4, "heb": "וְצִוָּ֨ה הַכֹּהֵ֜ן וּפִנּ֣וּ אֶת־הַבַּ֗יִת בְּטֶ֨רֶם יָבֹ֤א הַכֹּהֵן֙ לִרְא֣וֹת אֶת־הַנֶּ֔גַע וְלֹ֥א יִטְמָ֖א כׇּל־אֲשֶׁ֣ר בַּבָּ֑יִת וְאַ֥חַר כֵּ֛ן יָבֹ֥א הַכֹּהֵ֖ן לִרְא֥וֹת אֶת־הַבָּֽיִת׃", "onk": "וִיפַקֵּד כַּהֲנָא וִיפַנּוּן יָת בֵּיתָא עַד לָא יֵעוֹל כַּהֲנָא לְמֶחֱזֵי יָת מַכְתָּשָׁא וְלָא יִסְתָּאַב כָּל דִּי בְּבֵיתָא וּבָתַר כֵּן יֵעוֹל כַּהֲנָא לְמֶחֱזֵי יָת בֵּיתָא:", "onk_en": "The <i>kohein<\/i> shall command, and they shall empty the house [of its contents] before the <i>kohein<\/i> will come to see the eruption so everything in the house shall not become impure. Afterwards, the <i>kohein<\/i> shall come to see the house.", "pj": "וְיַפְקֵיד כַּהֲנָא וִיפַנוּן יַת בֵּיתָא עַד לָא יֵיעוֹל כַּהֲנָא לְמֵיחְמֵי יַת בֵּיתָא מְטוֹל דְלָא יִסְתָּאָב כָּל דִבְבֵיתָא וּמִן בָּתַר כְּדֵין יֵיעוֹל כַּהֲנָא לְמֵיחְמֵי יַת בֵּיתָא", "pj_en": "then the priest shall direct that they make the house empty before the priest cometh to inspect the house, that all that is in the house may not be (condemned as) unclean; and after that the priest shall go in to inspect the house.", "tj": "", "tj_en": "", "rashi": "<b>בטרם יבא הכהן וגו'.<\/b> שֶׁכָּל זְמַן שֶׁאֵין כֹּהֵן נִזְקָק לוֹ, אֵין שָׁם תּוֹרַת טֻמְאָה:<br><br><b>ולא יטמא כל אשר בבית.<\/b> שֶׁאִם לֹא יְפַנֵּהוּ, וְיָבֹא הַכֹּהֵן וְיִרְאֶה הַנֶּגַע נִזְקָק לְהֶסְגֵּר וְכָל מַה שֶּׁבְּתוֹכוֹ יִטְמָא; וְעַל מָה חָסָה תוֹרָה? אִם עַל כְּלֵי שֶׁטֶף, יַטְבִּילֵם וְיִטְהֲרוּ, וְאִם עַל אֳכָלִין וּמַשְׁקִין, יֹאכְלֵם בִּימֵי טֻמְאָתוֹ, הָא לֹא חָסָה תוֹרָה אֶלָּא עַל כְּלֵי חֶרֶס, שֶׁאֵין לָהֶם טָהֳרָה בַּמִּקְוֶה (ספרא):", "rashi_en": "'בטרם יבא הכהן וגו‎ [THEY SHALL CLEAR THE HOUSE] BEFORE THE PRIEST COME etc. — For so long as the priest has not yet engaged himself with it no law of uncleanness is applicable there.<br><br>ולא יטמא כל אשר בבית THAT ALL THAT IS IN THE HOUSE BE NOT MADE UNCLEAN, for if he does not clear it out and the priest comes and examines the plague, it requires shutting up and all that is inside immediately becomes unclean. To what is it that the Torah has regard in ordering these precautions to be taken? If it had in mind wooden or metal vessels that need only be rinsed in order to restore them to cleanness, he can immerse them and they will become clean (and there is no need to remove them from the house for fear that they will become unclean if he does not do so), and if it has in mind food and liquids, he can eat them during the time of his uncleanness (in which case also he suffers no loss since he may consume them at a time when he himself happens to be unclean). Consequently it follows that the Torah must have regard only to earthen vessels for which there is no means of purification by immersion in a ritual bath (cf. Rashi on Leviticus 11:35) and which therefore will remain unusable except in connection with ordinary food (חולין) (Sifra, Metzora, Section 5 12)."}, {"ch": 14, "v": 37, "aliyah": 4, "heb": "וְרָאָ֣ה אֶת־הַנֶּ֗גַע וְהִנֵּ֤ה הַנֶּ֙גַע֙ בְּקִירֹ֣ת הַבַּ֔יִת שְׁקַֽעֲרוּרֹת֙ יְרַקְרַקֹּ֔ת א֖וֹ אֲדַמְדַּמֹּ֑ת וּמַרְאֵיהֶ֥ן שָׁפָ֖ל מִן־הַקִּֽיר׃", "onk": "וְיֶחֱזֵי יָת מַכְתָּשָׁא וְהָא מַכְתָּשָׁא בְּכָתְלֵי בֵיתָא פַּחֲתִין <b>יַרְקָן אוֹ סַמְקָן<\/b> וּמֶחֱזֵיהוֹן מַכִּיךְ מִן כָּתְלָא:", "onk_en": "He shall see the eruption and behold! The eruption is in the walls of the house; impressions, of greenest green or of reddest red [<b>green or red<\/b>] and they appear to be lower than the [surface of] the wall.", "pj": "וְיֶחֱמֵי כַּהֲנָא וְהָא מַכְתְּשָׁא כִּתְרֵין גְרִיסִין מִן אַבְנֵי דִילֵיהּ אַרְבַּע כּוֹתְלִין מְשַׁקְעָן יוּרְקַן אוֹ סוּמְקַן וְחַזֵיהוֹן מַכִּיךְ יַתִּיר מִן כּוֹתְלָא", "pj_en": "And the priest shall look, and, behold, if the plague be like (the colour of) two beans crushed with stones, and goeth lower than the four walls, green or red, and its appearance be deeper than the walls;", "tj": "", "tj_en": "", "rashi": "<b>שקערורת.<\/b> שׁוֹקְעוֹת בְּמַרְאֵיהֶן (שם):", "rashi_en": "שקערורת denotes lying deep because of their colors (they appear to lie deep in the stones) (Sifra, Metzora, Section 6 5)."}, {"ch": 14, "v": 38, "aliyah": 4, "heb": "וְיָצָ֧א הַכֹּהֵ֛ן מִן־הַבַּ֖יִת אֶל־פֶּ֣תַח הַבָּ֑יִת וְהִסְגִּ֥יר אֶת־הַבַּ֖יִת שִׁבְעַ֥ת יָמִֽים׃", "onk": "וְיִפּוֹק כַּהֲנָא מִן בֵּיתָא לִתְרַע בֵּיתָא וְיַסְגַּר יָת בֵּיתָא שִׁבְעָא יוֹמִין:", "onk_en": "The <i>kohein<\/i> shall go out of the house to the entrance of the house, and place the house under quarantine for seven days.", "pj": "וְיִפּוֹק כַּהֲנָא מִן בֵּיתָא לִתְרַע בֵּיתָא מִלְבַּר וְיַסְגֵר יַת בֵּיתָא שַׁבְעָא יוֹמִין", "pj_en": "the priest shall go out from the house to the door of the house, and shut up the house seven days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 39, "aliyah": 4, "heb": "וְשָׁ֥ב הַכֹּהֵ֖ן בַּיּ֣וֹם הַשְּׁבִיעִ֑י וְרָאָ֕ה וְהִנֵּ֛ה פָּשָׂ֥ה הַנֶּ֖גַע בְּקִירֹ֥ת הַבָּֽיִת׃", "onk": "וִיתוּב כַּהֲנָא בְּיוֹמָא שְׁבִיעָאָה וְיֶחֱזֵי וְהָא <b>אוֹסִיף<\/b> מַכְתָּשָׁא בְּכָתְלֵי בֵיתָא:", "onk_en": "The <i>kohein<\/i> shall return on the seventh day and shall see; and behold! the eruption has spread [<b>increased<\/b>] in the walls of the house.", "pj": "וִיתוּב כַּהֲנָא בְּיוֹמָא שְׁבִיעָאָה וְיֶחֱמֵי וְהָא הֲלִיךְ פִּיסְיוֹן מַכְתְּשָׁא בְּכוּתְלֵי בֵּיתָא", "pj_en": "And the priest, returning on the seventh day, shall look, and, behold, if the breadth of the plague hath increased in the wall of the house,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 40, "aliyah": 4, "heb": "וְצִוָּה֙ הַכֹּהֵ֔ן וְחִלְּצוּ֙ אֶת־הָ֣אֲבָנִ֔ים אֲשֶׁ֥ר בָּהֵ֖ן הַנָּ֑גַע וְהִשְׁלִ֤יכוּ אֶתְהֶן֙ אֶל־מִח֣וּץ לָעִ֔יר אֶל־מָק֖וֹם טָמֵֽא׃", "onk": "וִיפַקֵּד כַּהֲנָא וִישַׁלְּפוּן יָת אַבְנַיָּא דִּי בְהוֹן מַכְתָּשָׁא וְיִרְמוּן יָתְהוֹן לְמִבָּרָא לְקַרְתָּא לַאֲתַר מְסָאָב:", "onk_en": "The <i>kohein<\/i> shall command and they shall remove the stones in which there is the eruption and cast them away, beyond the city to an impure place.", "pj": "וִיפַקֵד כַּהֲנָא וְיִשְׁמְטוּן יַת אַבְנַיָא דִבְהוֹן מַכְתְּשָׁא וִיטַלְקוּן יַתְהוֹן לְמִבָּרָא לְקַרְתָּא לַאֲתַר מְסָאָב", "pj_en": "then the priest shall direct that they break out the stones which have the plague in them, and throw them without the city into an unclean place.", "tj": "", "tj_en": "", "rashi": "<b>וחלצו את האבנים.<\/b> כְּתַרְגּוּמוֹ: וִיִשְׁלְפוּן — יִטְּלֵם מִשָּׁם, כְּמוֹ וְחָלְצָה נַעֲלוֹ (דברים כ\"ה) — לְשׁוֹן הֲסָרָה:<br><br><b>אל מקום טמא.<\/b> מָקוֹם שֶׁאֵין טְהָרוֹת מִשְׁתַּמְּשׁוֹת שָׁם, לִמֶּדְךָ הַכָּתוּב שֶׁהָאֲבָנִים הַלָּלוּ מְטַמְּאוֹת מְקוֹמָן בְּעוֹדָן בּוֹ (ספרא):", "rashi_en": "וחלצו את האבנים — Understand וחלצו as the Targum does: וישלפון, i.e. they shall remove them from there. It is similar to, (Deuteronomy 25:9)  וחלצה נעלו— which is an expression for removing (\"she shall remove his shoe”).<br><br>אל מקום טמא UNTO AN UNCLEAN PLACE — i. e. a place where clean things are not likely to be handled. Scripture teaches you that these stones make the place where they are deposited unclean for the time they are there."}, {"ch": 14, "v": 41, "aliyah": 4, "heb": "וְאֶת־הַבַּ֛יִת יַקְצִ֥עַ מִבַּ֖יִת סָבִ֑יב וְשָׁפְכ֗וּ אֶת־הֶֽעָפָר֙ אֲשֶׁ֣ר הִקְצ֔וּ אֶל־מִח֣וּץ לָעִ֔יר אֶל־מָק֖וֹם טָמֵֽא׃", "onk": "וְיָת בֵּיתָא יְקַלְּפוּן מִגָּיו סְחוֹר סְחוֹר וְיִרְמוּן יָת עַפְרָא דִּי קַלִּיפוּ לְמִבָּרָא לְקַרְתָּא לַאֲתַר מְסָאָב:", "onk_en": "He shall scrape the house from the inside, all around, and they shall throw away the earth that they scraped, beyond the city, to an impure place.", "pj": "וְיַת בֵּיתָא יְקַלְפוּן מִגַוֵיהּ חֲזוֹר חֲזוֹר וִיטַלְקוּן יַת עַפְרָא דְקַלִיפוּ מִבָּרָא לְקַרְתָּא לַאֲתַר מְסָאָב", "pj_en": "And they shall scrape the inside of the house round about, and throw the dust which they have scraped off without the city into an unclean place.", "tj": "", "tj_en": "", "rashi": "<b>יקצע.<\/b> רדויי\"ר בְּלַעַז, וּבִלְשׁוֹן מִשְׁנָה יֵשׁ הַרְבֶּה:<br><br><b>מבית.<\/b> מִבִּפְנִים:<br><br><b>סביב.<\/b> סְבִיבוֹת הַנֶּגַע; בְּתֹ\"כֹּ נִדְרַשׁ כֵּן — שֶׁיִּקְלֹף הַטִּיחַ שֶׁסְּבִיב אַבְנֵי הַנֶּגַע:<br><br><b>הקצו.<\/b> לְשׁוֹן קָצֶה — אֲשֶׁר קִצְּעוּ בִקְצוֹת הַנֶּגַע סָבִיב:", "rashi_en": "יקצע — rogner in old French, SCRAPE OFF, and in Mishnaic Hebrew it occurs many times.<br><br>‎מבית INSIDE.<br><br>סביב ROUND ABOUT — i. e. the place round about the plague-spot; and in Torath Cohanim (Sifra, Metzora, Chapter 4 5) it is also thus explained: that he shall peel off the plaster which is round about the area where the plague-stricken stones had been.<br><br>הקצו is connected in meaning with the word קצה, end, — it means: which they had scraped off at the edges of the plague-spot round about it. (The words mean: the dust which they have removed from the edges. It has nothing to do with “scraping off”)."}, {"ch": 14, "v": 42, "aliyah": 4, "heb": "וְלָקְחוּ֙ אֲבָנִ֣ים אֲחֵר֔וֹת וְהֵבִ֖יאוּ אֶל־תַּ֣חַת הָאֲבָנִ֑ים וְעָפָ֥ר אַחֵ֛ר יִקַּ֖ח וְטָ֥ח אֶת־הַבָּֽיִת׃", "onk": "וְיִסְּבוּן אַבְנַיָּא אָחֳרָנִין וְיַעֲלוּן לַאֲתַר אַבְנַיָּא וַעֲפַר אָחֳרָן יִסַּב וִישׁוּעַ יָת בֵּיתָא:", "onk_en": "They shall take other stones, and they shall bring them to replace the stones, and he shall take other earth and plaster the house.", "pj": "וְיִסְבוּן אַבְנִין חוּרַנְיָין וִיעַלוּן בַּאֲתַר אַבְנַיָא וְעַפְרָא חוּרַן יִסַב וְיִתְטַשׁ יַת בֵּיתָא", "pj_en": "And they shall take other stones, and insert them in the place of the (former) stones, and let other mortar be taken, and the house be replastered.", "tj": "וְיִטְשׁוּן יַת בֵּיתָא:", "tj_en": "And they shall plaster the house.", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 43, "aliyah": 4, "heb": "וְאִם־יָשׁ֤וּב הַנֶּ֙גַע֙ וּפָרַ֣ח בַּבַּ֔יִת אַחַ֖ר חִלֵּ֣ץ אֶת־הָאֲבָנִ֑ים וְאַחֲרֵ֛י הִקְצ֥וֹת אֶת־הַבַּ֖יִת וְאַחֲרֵ֥י הִטּֽוֹחַ׃", "onk": "וְאִם יְתוּב מַכְתָּשָׁא וְיִסְגֵּי בְּבֵיתָא בָּתַר דְּשַׁלִּיפוּ יָת אַבְנַיָּא וּבָתַר דְקַלִּיפוּ יָת בֵּיתָא וּבָתַר דְּאִתְּשָׁע:", "onk_en": "If the eruption returns and sprouts in the house after the stones were removed, and after the house was scraped, and after it was plastered,", "pj": "וְאִין יְתוּב מַכְתְּשָׁא וְיַסְגֵי בְּבֵיתָא מִן בָּתַר דִשְׁמִיטַן יַת אַבְנַיָא וּמִן בָּתַר דְקַלִיפוּ יַת בֵּיתָא וּמִן בָּתַר דְאִיתְטַשׁ", "pj_en": "But if the plague return and increase in the house, after the stones have been broken out, and after the house hath been scraped, and after that it hath been replastered,", "tj": "", "tj_en": "", "rashi": "<b>הקצות.<\/b> לְשׁוֹן הֵעָשׂוֹת, וְכֵן הִטּוֹחַ, אֲבָל חִלֵּץ אֶת הָאֲבָנִים מוּסָב הַלָּשׁוֹן אֶל הָאָדָם שֶׁחִלְּצָן, וְהוּא מִשְׁקַל לְשׁוֹן כָּבֵד, כְּמוֹ כִּפֵּר, דִּבֵּר:<br><br><b>ואם ישוב הנגע וגו'.<\/b> יָכוֹל חָזַר בּוֹ בַיּוֹם יְהֵא טָמֵא, תַּ\"ל \"וְשָׁב הַכֹּהֵן\" \"וְאִם יָשׁוּב\", מַה שִּׁיבָה הָאָמוּר לְהַלָּן לְסוֹף שָׁבוּעַ, אַף שִׁיבָה הָאֲמוּרָה כָּאן בְּסוֹף שָׁבוּעַ (ספרא):", "rashi_en": "הִקְצוֹת — The grammatical form expresses the idea of something “having been done” (passive) and so, also, is the word הִטּוֹחַ  (both are Niphal construct infinitive), but in חִלֵּץ את האבנים the expression refers to the man who removes them (i. e. it is active, the subject having to be supplied. The translation is: “after he has removed the stones”, whilst the following words denote: after the house has been scraped at its edges and after it has been plastered), it (the word חִלֵּץ) being of the heavy conjugation (Piel), just as כִּפֵּר and דִּבֵּר‎.<br><br>‎ ישוב מגע ‎ואם‎ AND IF THE PLAGUE RETURN [AND BREAK OUT IN THE HOUSE] — One might think that this means: if it returns on the self-same day it shall be unclean as it stated in v. 44. It, however, says, (v. 39) ושב הכהן “when the priest returns [on the seventh day]”, and here, also, it says, ואם ישוב, “and if it (the plague) return”. What is the case of “return” mentioned there? It is at the end of a week! Similarly, too, “return” mentioned here means at the end of a week (Sifra, Metzora, Section 7 6)."}, {"ch": 14, "v": 44, "aliyah": 4, "heb": "וּבָא֙ הַכֹּהֵ֔ן וְרָאָ֕ה וְהִנֵּ֛ה פָּשָׂ֥ה הַנֶּ֖גַע בַּבָּ֑יִת צָרַ֨עַת מַמְאֶ֥רֶת הִ֛וא בַּבַּ֖יִת טָמֵ֥א הֽוּא׃", "onk": "וְיֵיעוֹל כַּהֲנָא וְיֶחֱזֵי וְהָא <b>אוֹסֵף<\/b> מַכְתָּשָׁא בְּבֵיתָא <b>סְגִירוּת מְחַסְרָא<\/b> הִיא בְּבֵיתָא מְסָאָב הוּא:", "onk_en": "the <i>kohein<\/i> shall come and see; and behold! the eruption has spread [<b>increased<\/b>] in the house; prickly <i>tzoraas<\/i> [<b>’confinement’ of loss<\/b>] is in the house, it is impure.", "pj": "וְיֵיתֵי כַּהֲנָא וְיֶחֱמֵי וְהָא הֲלִיךְ פִּסְיוֹן מַכְתְּשָׁא בְּבֵיתָא סְגִירוּת מְחַלְטָא הִיא בְּבֵיתָא מְסָאָב הוּא", "pj_en": "then the priest shall come and look, and, behold, (if) the breadth of the plague hath increased in the house, it is a plain leprosy in the house, it is unclean.", "tj": "", "tj_en": "", "rashi": "<b>ובא הכהן וראה והנה פשה.<\/b> יָכוֹל לֹא יְהֵא הַחוֹזֵר טָמֵא אֶלָּא אִם כֵּן פָּשָׂה, נֶאֱמַר צָרַעַת מַמְאֶרֶת בַּבָּתִּים, וְנֶאֱמַר צָרַעַת מַמְאֶרֶת בַּבגדים, מַה לְּהַלָּן טִמֵּא אֶת הַחוֹזֵר אַעַ\"פִּ שֶׁאֵינוֹ פוֹשֶׂה, אַף כָּאן טִמֵּא אֶת הַחוֹזֵר אַעַ\"פִּ שֶׁאֵינוֹ פוֹשֶׂה, אִם כֵּן מַה תַּ\"ל וְהִנֵּה פָשָׂה? אֵין כָּאן מְקוֹמוֹ שֶׁל מִקְרָא זֶה, אֶלָּא \"וְנָתַץ אֶת הַבַּיִת\" הָיָה לוֹ לִכְתֹּב אַחַר \"וְאִם יָשׁוּב הַנֶּגַע\"; \"וְרָאָה וְהִנֵּה פָּשָׂה\" הָא לֹא בָא לְלַמֵּד אֶלָּא עַל נֶגַע הָעוֹמֵד בְּעֵינָיו בְּשָׁבוּעַ רִאשׁוֹן, וּבָא בְסוֹף שָׁבוּעַ שֵׁנִי וּמְצָאוֹ שֶׁפָּשָׂה — שֶׁלֹּא פֵּרֵשׁ בּוֹ הַכָּתוּב לְמַעְלָה כְלוּם בְּעוֹמֵד בְּעֵינָיו בְּשָׁבוּעַ רִאשׁוֹן — וְלִמֶּדְךָ כָּאן בְּפִשְׂיוֹן זֶה, שֶׁאֵינוֹ מְדַבֵּר אֶלָּא בְּעוֹמֵד בָּרִאשׁוֹן וּפָשָׂה בַשֵּׁנִי; וּמַה יַּעֲשֶׂה לּוֹ? יָכוֹל יִתְּצֶנּוּ, כְּמוֹ שֶׁסָּמַךְ לוֹ \"וְנָתַץ אֶת הַבַּיִת\", תַּ\"ל וְשָׁב הַכֹּהֵן, וּבָא הַכֹּהֵן, נִלְמַד בִּיאָה מִשִּׁיבָה, מַה שִּׁיבָה חוֹלֵץ וְקוֹצֶה וְטָח וְנוֹתֵן לוֹ שָׁבוּעַ, אַף בִּיאָה חוֹלֵץ וְקוֹצֶה וְטָח וְנוֹתֵן לוֹ שָׁבוּעַ, וְאִם חוֹזֵר נוֹתֵץ, לֹא חָזַר טָהוֹר. וּמִנַּיִן שֶׁאִם עָמַד בָּזֶה וּבָזֶה חוֹלֵץ וְקוֹצֶה וְטָח וְנוֹתֵן לוֹ שָׁבוּעַ? תַּלְמוּד לוֹמַר וְאִם בֹּא יָבֹא, בַּמֶּה הַכָּתוּב מְדַבֵּר? אִם בְּפוֹשֶׂה בָּרִאשׁוֹן, הֲרֵי כְבָר אָמוּר, אִם בְּפוֹשֶׂה בַשֵּׁנִי, הֲרֵי כְבָר אָמוּר, הָא אֵינוֹ אוֹמֵר וְאִם בֹּא יָבֹא אֶלָּא אֶת שֶׁבָּא בְסוֹף שָׁבוּעַ רִאשׁוֹן וּבָא בְסוֹף שָׁבוּעַ שֵׁנִי וְרָאָה וְהִנֵּה לֹא פָשָׂה; זֶה הָעוֹמֵד מַה יַּעֲשֶׂה לוֹ? יָכוֹל יִפָּטֵר וְיֵלֵךְ, כְּמוֹ שֶׁכָּתוּב כָּאן וְטִהַר אֶת הַבַּיִת? תַּ\"ל כִּי נִרְפָּא הַנָּגַע — לֹא טִהַרְתִּי אֶלָּא הָרָפוּי, מַה יַּעֲשֶׂה לוֹ? בִּיאָה אֲמוּרָה לְמַעְלָה וּבִיאָה אֲמוּרָה לְמַטָּה, מַה בָּעֶלְיוֹנָה חוֹלֵץ וְקוֹצֶה וְטָח וְנוֹתֵן לוֹ שָׁבוּעַ — דְּגָמַר לָהּ זֶהוּ שִׁיבָה זֶהוּ בִיאָה — אַף בַּתַּחְתּוֹנָה כֵן וְכוּ', כִּדְאִיתָא בְתוֹרַת כֹּהֲנִים. גְּמָרוֹ שֶׁל דָּבָר אֵין נְתִיצָה אֶלָּא בְּנֶגַע הַחוֹזֵר אַחַר חֲלִיצָה וְקִצּוּעַ וְטִיחָה, וְאֵין הַחוֹזֵר צָרִיךְ פִּשְׂיוֹן. וְסֵדֶר הַמִּקְרָאוֹת כָּךְ הוּא: וְאִם יָשׁוּב, וְנָתַץ, וְהַבָּא אֶל הַבַּיִת, וְהָאוֹכֵל בַּבַּיִת, וּבָא הַכֹּהֵן וְרָאָה וְהִנֵּה פָשָׂה, וְדִבֵּר הַכָּתוּב בָּעוֹמֵד בָּרִאשׁוֹן שֶׁנּוֹתֵן לוֹ שָׁבוּעַ שֵׁנִי לְהֶסְגֵּרוֹ, וּבְסוֹף שָׁבוּעַ שֵׁנִי לְהֶסְגֵּרוֹ בָּא וְרָאָהוּ שֶׁפָּשָׂה, וּמַה יַּעֲשֶֹה לוֹ? חוֹלֵץ וְקוֹצֶה וְטָח וְנוֹתֵן לוֹ שָׁבוּעַ, חָזַר, נוֹתֵץ, לֹא חָזַר, טָעוּן צִפֳּרִים; שֶׁאֵין בַּנְּגָעִים יוֹתֵר מִשְּׁלוֹשָׁה שָׁבוּעוֹת (עי' ספרא).", "rashi_en": "ובא הכהן וראה והנה פשה THEN THE PRIEST SHALL COME AND LOOK, AND, BEHOLD, IF THE PLAGUE HATH SPREAD … [IT IS UNCLEAN] — From this one might think that a recurring plague is unclean (i. e. renders the whole house unclean) only if it spreads. But the phrase צרעת ממארת. “a fretting leprosy”, is mentioned in connection with houses and the phrase. צרעת ממארת is mentioned in connection with garments (Leviticus 13:51), thus making that plague analogous to this: What is the case there? Scripture declares the recurring plague unclean although it has not spread (Leviticus 13:55)! Similarly, here, it declares the recurring plague unclean even though it has not spread. But if this be so, why does it state here “and, behold. [the plague] hath spread\"? As a matter of fact this is not the proper place of the verse), and the statement “he shall pull down the house” (v. 45) it ought to have written immediately after (v. 43), “and if the plague return”). The words in v. 44, “he shall look, and, behold, if the plague hath spread”, consequently only intend to tell us something about a plague which has remained in the same condition during the first week, and to which he (the priest) comes at the end of the second week and finds that it has spread, for Scripture has not explained anything at all about the case where the plague remains in the same condition during the first week. (It speaks in v. 39 only of when the plague has spread during the first week.) It tells us here (in the section which speaks about what happens a week after the house has been scraped etc., i. e. after the end of the second week) the law regarding it by mention of this spreading (i. e. by the words וראה והנה פשה) which can only speak of the case that it remained in the same condition during the first week, and has spread during the second week. Now what shall he do with it? One might think that he must demolish it, even as it states immediately after it, (v. 45) “He shall break down the house”. It, however, states, (v. 39) “if the priest returneth” at the end of the week and finds that it has spread, and (v. 44) “and if the priest cometh” at the end of the second week and now finds that for the first time it has spread — thus we may learn what is to be done after this “coming\" from what happens after that “returning”! What is the law in the case of that “returning”? He must remove the stones, scrape and re-plaster (vv. 40—42), and give it another week! Similarly, here, in the case of this “coming” after a second week, he must remove the stones, scrape and re-plaster and give it a further week! If it recurs he must demolish the house: if it does not recur, the house is clean. And whence may we infer that if it remained in the same condition both during this week (the first) and that (the second), he must remove the stones, scrape and re-plaster, and give it another week (just as he did when it spread in the second week, as we have just stated)? Because it states, (v. 44) ובא ”and if [the priest] cometh”, and (v. 48) ואם בא יבא “and if [the priest] cometh”, the expression “coming” being used in each case to indicate an analogy between them, the reasoning being as follows: About what can this verse 48 which refers to the plague not having spread be speaking? If you say it speaks of a plague which has spread during the first week but did not spread during the second week, behold, this has already been mentioned (vv. 39—43, and second half of v. 44)! If you say that it speaks of a plague which has spread during the second week but has not spread during the first week, behold, this has already been mentioned (v. 44 according to Rashi's explanation above). Consequently it can only be saying the words ואם בא יבא, “if having come once (בא), he cometh again (יבא)”, about one who comes at the end of the first week and comes again at the end of the second week, “and, behold, [the plague] had not spread” in either instance. In the case of such a plague which remains as it was during two successive weeks, what shall he do to it? One might think he departs and gets himself off without doing anything more because the house is clean, since it states here (immediately afterwards), “he shall pronounce the house clean”. It, however, states, “if the plague is healed”, — which implies that Scripture says as it were: I do declare clean only the plague which is healed (i. e. when something has been done by which it is removed). What, then, shall he do to it? The reply is: above (v. 44) it has spoken of “coming”, and further on (v. 48) it also speaks of “coming”. What is the law in the previous case? He removes the stones, scrapes and re-plasters and gives it another week — for, as we have stated above, we have it as tradition that “return” (v. 39: ושב הכהן) and “coming” (v. 44: ובא הכהן) are identical in regard to their law; similarly, too, must be done in the later case (v. 48 which as we have proved, must be speaking of עמד בראשון ובשני etc.), as it is stated in Torath Cohanim (Sifra, Metzora, Section 7 10). The conclusion of the matter is: Demolishing a house takes place only in the case of a plague that recurs after removal of the stones, scraping and re-plastering, and such a recurring plague does not require that it should also have spread in order to make it necessary to demolish the house. The sequence of the verses is as follows: “If it returns” (v. 48), “he shall break down” (v. 45), “But if one cometh” (v. 46) “[And he that lieth in the house] … and he that eateth in the house” (v. 47), and only then v. 44: “And if the priest come and look, and, behold, the plague hath spread”; — and the last verse speaks, as shown above, of the case of a plague that remained as it was during the first week to which one has therefore given a second week for being shut up, and at the end of the second week he comes and sees it that it has spread. And what shall he do to it? He removes the stones, scrapes and re-plasters and gives it another week. If it returns he demolishes the house, if it does not return, it is clean and requires two birds for purification, but this third week is the utmost time for investigation, for not more than three weeks are to be spent in the investigation of plagues."}, {"ch": 14, "v": 45, "aliyah": 4, "heb": "וְנָתַ֣ץ אֶת־הַבַּ֗יִת אֶת־אֲבָנָיו֙ וְאֶת־עֵצָ֔יו וְאֵ֖ת כׇּל־עֲפַ֣ר הַבָּ֑יִת וְהוֹצִיא֙ אֶל־מִח֣וּץ לָעִ֔יר אֶל־מָק֖וֹם טָמֵֽא׃", "onk": "וִיתָרַע יָת בֵּיתָא יָת אַבְנוֹהִי וְיָת אָעוֹהִי וְיָת כָּל עֲפַר בֵּיתָא וְיַפֵּק לְמִבָּרָא לְקַרְתָּא לַאֲתַר מְסָאָב:", "onk_en": "He shall dismantle the house; its stones and its wood and all the earth of the house. He shall take it out beyond the city, to an impure place.", "pj": "וִיפַכְרוּן יַת בֵּיתָא יַת אַבְנוֹי וְיַת קֵיסוֹי וְיַת כָּל עַפְרָא דְבֵיתָא וְיִנְפַּק לְמִבָּרָא לְקַרְתָּא לַאֲתַר מְסָאָב", "pj_en": "Then shall they destroy that house, and its stones, and its timber, and all the plaster of the house, and lie shall remove it without the city to an unclean place.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 46, "aliyah": 4, "heb": "וְהַבָּא֙ אֶל־הַבַּ֔יִת כׇּל־יְמֵ֖י הִסְגִּ֣יר אֹת֑וֹ יִטְמָ֖א עַד־הָעָֽרֶב׃", "onk": "וּדְיֵיעוֹל לְבֵיתָא כָּל יוֹמִין דְּיַסְגַּר יָתֵיהּ יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Whoever will come inside the house [during] all the days of its confinement, shall be impure until the evening.", "pj": "וּמַאן דְיֵעוּל לְבֵיתָא כָּל יוֹמִין דְיַסְגֵר יָתֵיהּ יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever goeth into the house in the days that it is shut up, shall be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>כל ימי הסגיר אתו.<\/b> וְלֹא יָמִים שֶׁקָּלַף אֶת נִגְעוֹ; יָכוֹל שֶׁאֲנִי מוֹצִיא הַמֻּחְלָט שֶׁקָּלַף אֶת נִגְעוֹ, תַּ\"ל כָּל יְמֵי:<br><br><b>יטמא עד הערב.<\/b> מְלַמֵּד שֶׁאֵין מְטַמֵּא בְגָדִים; יָכוֹל אֲפִלוּ שָׁהָה בִכְדֵי אֲכִילַת פְּרָס, תַּ\"ל וְהָאוֹכֵל בַּבַּיִת יְכַבֵּס אֶת בְּגָדָיו, אֵין לִי אֶלָּא אוֹכֵל, שׁוֹכֵב מִנַּיִן? תַּ\"ל וְהַשּׁוֹכֵב, אֵין לִי אֶלָּא אוֹכֵל וְשׁוֹכֵב, לֹא אוֹכֵל וְלֹא שׁוֹכֵב מִנַּיִן? תַּ\"ל <b>יכבס יכבס<\/b> רִבָּה; אִם כֵּן לָמָּה נֶאֱמַר אוֹכֵל וְשׁוֹכֵב? לִתֵּן שִׁעוּר לַשּׁוֹכֵב כְּדֵי אֲכִילַת פְּרָס (שם):", "rashi_en": "כל ימי הסגיר אתו [AND HE THAT COMES INTO THE HOUSE] ALL THE DAYS THAT IT IS SHUT UP [SHALL BE UNCLEAN UNTIL THE EVENING] — \"the days that it is shut up\", but not during the days in which he had scraped the plague-spot (for through the scraping the uncleanness has, at least for the time being, departed, and the house is only closed again for investigation). I might think that I may also exclude from this law the house that is decidedly unclean through a recurring plague and which must be demolished from which one has scraped the plague-spot (but which has not yet been demolished, for we might assume that for the time being the uncleanness is departed)! It, however, states, \"all the days\" (Sifra, Metzora, Chapter 5 4).<br><br>יטמא עד הערב [AND HE THAT COMES INTO THE HOUSE] SHALL BE UNCLEAN UNTIL THE EVENING — This tells us that merely going into the house does not render his garments unclean (since it does not state, as in the next verse, that he shall wash his garments) (Sifra, Metzora, Chapter 5 5). I might think that his garments do not become unclean even if, after coming into the house, he remained there long enough to eat a half-loaf (an ordinary meal, equal in mass to 4 eggs)! It, however, states, (v. 47) \"And he that eateth in the house shall wash his garments\", for we may reason as follows: I have here only the law regarding one who actually eats. Whence may I derive that this applies also to one who sleeps in the house? Because Scripture states \"and he who sleeps [shall wash his garments]\". Now I have only the law regarding one who eats and regarding one who sleeps in the house; whence may I derive that the same law applies to one who neither eats nor sleeps (but merely stays in the house)? Because it states ‎יכבס יכבס (twice) in v. 47 where it could have written: והשכב והאכל בבית יכבס את בגדיו, and such wording would imply that only those who actually sleep and eat in the house must wash their garments. By the insertion of the first יכבס we have two coordinated sentences of similar import and this suggests that sleeping and eating are merely examples of cases where garments would require washing. Thus the use of the first יכבס serves to include besides one who sleeps and one who eats in the house anyone who stays there. If this be so (i. e. if it means that the garments of anyone who stays in the house become unclean) why does it expressly mention one who eats and one who sleeps? Let it merely state: one who stays in the house shall wash his garments, when these also would be included! But this is done in order to designate for him who sleeps in the house (i. e. who does anything in the house beyond entering and immediately leaving it, as is mentioned in v. 46) a minimum period of time the stay during which renders his garments unclean, viz., a time long enough to eat a half-loaf (cf. Sifra, Metzora, Chapter 5 7-8)."}, {"ch": 14, "v": 47, "aliyah": 4, "heb": "וְהַשֹּׁכֵ֣ב בַּבַּ֔יִת יְכַבֵּ֖ס אֶת־בְּגָדָ֑יו וְהָאֹכֵ֣ל בַּבַּ֔יִת יְכַבֵּ֖ס אֶת־בְּגָדָֽיו׃", "onk": "וּדְיִשְׁכּוּב בְּבֵיתָא יְצַבַּע יָת לְבוּשׁוֹהִי וּדְיֵיכוּל בְּבֵיתָא יְצַבַּע יָת לְבוּשׁוֹהִי:", "onk_en": "Whoever will lie down inside the house shall wash his garments. Whoever will eat inside the house shall wash his garments.", "pj": "וּדְיִשְׁכּוֹב בְּבֵיתָא יְצַבַּע יַת לְבוּשׁוֹי
