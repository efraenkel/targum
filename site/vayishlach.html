", "tj": "", "tj_en": "", "rashi": "<b>כי גם זה.<\/b> נוֹסַף לְךָ עַל יוֹסֵף; וְרַבּוֹתֵינוּ דָּרְשׁוּ: עִם כָּל שֵׁבֶט נוֹלְדָה תְּאוֹמָה, וְעִם בִּנְיָמִין נוֹלְדָה תְאוֹמָה יְתֵרָה:", "rashi_en": "כי גם זה FOR THIS ALSO — also means additional to you, over and above Joseph. Our Rabbis explained that with each of Jacob’s sons a twin-sister was born, whilst with Benjamin an additional twin sister was born (Genesis Rabbah 82:8). "}, {"ch": 35, "v": 18, "aliyah": 6, "heb": "וַיְהִ֞י בְּצֵ֤את נַפְשָׁהּ֙ כִּ֣י מֵ֔תָה וַתִּקְרָ֥א שְׁמ֖וֹ בֶּן־אוֹנִ֑י וְאָבִ֖יו קָֽרָא־ל֥וֹ בִנְיָמִֽין׃", "onk": "וַהֲוָה בְּמִפַּק נַפְשַׁהּ אֲרֵי מִיתַת (<small>נ\"א<\/small> מַיְתָא) וּקְרַת שְׁמֵיהּ בַּר דְּוָי וַאֲבוּהִי קְרָא לֵיהּ בִּנְיָמִין:", "onk_en": "As her soul was departing, for she died, she named him Ben Oni [son of my sorrow], but his father named him Binyomin.", "pj": "וַהֲוָה בְּמֵיפַּק נַפְשָׁהּ אֲרוּם מָטַת עֲלָהּ מוֹתָא וּקְרַת שְׁמֵיהּ בַּר דְווּיִי וְאָבוֹי קְרָא לֵיהּ בִּנְיָמִין", "pj_en": "And it was in the going forth of her soul, for death came upon her, that she called his name The son of my woe: but his father called him Benjamin.", "tj": "וְאָבוֹי הֲוָה קָרֵי לֵיהּ בִּלְשַׁן בֵּית קוּדְשָׁא בִּנְיָמִין:", "tj_en": "But his father called him in the language of the sanctuary, Benjamin.", "rashi": "<b>בן אוני.<\/b> בֶּן צַעֲרִי:<br><br><b>בנימין.<\/b> נִרְאֶה בְעֵינַי, לְפִי שֶׁהוּא לְבַדּוֹ נוֹלַד בְּאֶרֶץ כְּנַעַן שֶׁהוּא בַּנֶּגֶב כְּשֶׁאָדָם בָּא מֵאֲרַם נַהֲרַיִם, כְּמוֹ שֶׁנֶּאֱמַר בַּנֶּגֶב בְּאֶרֶץ כְּנָעַן (במדבר ל\"ג), הָלוֹךְ וְנָסוֹעַ הַנֶּגְבָּה (בראשית י\"ב): <br><br><b>בנימין.<\/b> בֶּן יָמִין, לְשׁוֹן צָפוֹן וְיָמִין אַתָּה בְרָאתָם (תהילים פ\"ט), לְפִיכָךְ הוּא מָלֵא:", "rashi_en": "בן אוני means SON OF MY SORROW (Genesis Rabbah 82:9).<br><br>בנימין BENJAMIN — I am of opinion that he was so called because he alone was born in the land of Canaan which is in the South (ימין) as one comes from Aram-Naharaim, as it is said (Numbers 33:40) “in the South, in the Land of Canaan”, and (12:9) “going on still towards the South”. בנימין therefore means בן ימין where ימין has the same meaning as in (Psalms 89:13) “The North and the South (ימין) Thou hast created them”. For this reason the word is here written plene (with a י after the מ). <br><br>Another explanation of בנימין is that it means “son of his old days (ימים)”, only that it is written with ן (instead of ם), like (Daniel 12:13) “at the end of days."}, {"ch": 35, "v": 19, "aliyah": 6, "heb": "וַתָּ֖מׇת רָחֵ֑ל וַתִּקָּבֵר֙ בְּדֶ֣רֶךְ אֶפְרָ֔תָה הִ֖וא בֵּ֥ית לָֽחֶם׃", "onk": "וּמִיתַת רָחֵל וְאִתְקְבָרַת בְּאֹרַח אֶפְרָת הִיא בֵּית לָחֶם:", "onk_en": "Rochel died and was buried on the way to Ephros, which is Beis Lechem [Bethlehem].", "pj": "וּמִיתַת רָחֵל וְאִתְקְבָרַת בְּאוֹרַח אֶפְרָת הִיא בֵּית לָחֶם", "pj_en": "And Rahel died, and was buried in the way to Ephrath, which is Bethlehem.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 20, "aliyah": 6, "heb": "וַיַּצֵּ֧ב יַעֲקֹ֛ב מַצֵּבָ֖ה עַל־קְבֻרָתָ֑הּ הִ֛וא מַצֶּ֥בֶת קְבֻֽרַת־רָחֵ֖ל עַד־הַיּֽוֹם׃", "onk": "וַאֲקֵים יַעֲקֹב קַמְתָא עַל קְבֻרְתַּהּ הִיא קָמַת קְבֻרְתָּא דְרָחֵל עַד יוֹמָא דֵין:", "onk_en": "Yaakov set up a monument on her grave. This monument is on Rochel’s grave to this very day.", "pj": "וְאָקִים יַעֲקב קַמְתָּא עַל בֵּית קְבוּרְתָּא הִיא קָמַת בֵּית קְבוּרְתָּא דְרָחֵל עַד יוֹמָא דֵין", "pj_en": "And Jakob erected a pillar over the house of burying: which is the pillar of the tomb of Rahel unto this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 21, "aliyah": 6, "heb": "וַיִּסַּ֖ע יִשְׂרָאֵ֑ל וַיֵּ֣ט אׇֽהֳלֹ֔ה מֵהָ֖לְאָה לְמִגְדַּל־עֵֽדֶר׃", "onk": "וּנְטַל יִשְׂרָאֵל <b>וּפְרַס<\/b> מַשְׁכְּנֵיהּ מִלְּהַלָּא לְמִגְדְּלָא דְעֵדֶר:", "onk_en": "Yisrael traveled on, and set up [<b>spread<\/b>] his tent beyond Migdal Eider [Tower of the herds].", "pj": "וּנְטַל יַעֲקב וּפְרַס לְמַשְׁכְּנֵיהּ מִן לְהַלָא לְמַגְדְלָא דְעֵדֶר אַתְרָא דְמִתַּמָן עָתִיד דְאִתְגְלֵי מַלְכָּא מְשִׁיחָא בְּסוֹף יוֹמַיָא", "pj_en": "And Jakob proceeded and spread his tent beyond the tower of Eder, the place from whence, it is to be, the King Meshiha will be revealed at the end of the days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 22, "aliyah": 6, "heb": "וַיְהִ֗י בִּשְׁכֹּ֤ן יִשְׂרָאֵל֙ בָּאָ֣רֶץ הַהִ֔וא וַיֵּ֣לֶךְ רְאוּבֵ֗֔ן וַיִּשְׁכַּ֕ב֙ אֶת־בִּלְהָ֖ה֙ פִּילֶ֣גֶשׁ אָבִ֑֔יו וַיִּשְׁמַ֖ע יִשְׂרָאֵ֑͏ֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>וַיִּֽהְי֥וּ בְנֵֽי־יַעֲקֹ֖ב שְׁנֵ֥ים עָשָֽׂר׃", "onk": "וַהֲוָה כַּד שְׁרָא יִשְׂרָאֵל בְּאַרְעָא הַהִיא וַאֲזַל רְאוּבֵן וּשְׁכִיב עִם בִּלְהָה לְחֵינָתָא דַאֲבוּהִי וּשְׁמַע יִשְׂרָאֵל וַהֲווֹ בְנֵי יַעֲקֹב תְּרֵי עֲסַר:", "onk_en": "When Yaakov was settled in that land. Reuvein went and lay near Bilhah, his father’s concubine, and Yisrael heard [about it]. The sons of Yaakov were twelve.", "pj": "וַהֲוָה כַּד שְׁרָא יִשְרָאֵל בְּאַרְעָא הַהוּא וַאֲזַל רְאוּבֵן וּבִלְבֵּל יַת מַצְעָא דְבִלְהָה פְּלַקְתֵּיהּ דְאָבוֹי דַהֲוָה מְסַדְרָא כָּל קָבֵיל מַצְעָא דְלֵאָה אִמֵי וְאִתְחַשֵׁיב עִילוֹי כְּאִלוּ שִׁימֵשׁ עִמָהּ וּשְׁמַע יִשְרָאֵל וּבְאִישׁ לֵיהּ וְאָמַר וַוי דִלְמָא נָפַק מִינִי פִּיסוּלָא הֵיכְמָא דְנָפַק מִן אַבְרָהָם יִשְׁמָעֵאל וּמִן אַבָּא נְפַק עֵשָו מְתִיבָא רוּחָא דְקוּדְשָׁא וְכֵן אָמַר לֵיהּ לָא תִדְחַל דְכֻלְהוֹן צַדִיקִין וְלֵית בְּהוֹן פִּיסוּלָא דְמִבָּתַר דְאִתְיְלִיד בִּנְיָמִין הֲווֹ בְּנֵי יַעֲקב תְּרֵיסַר", "pj_en": "And it was while Israel dwelt in this land that Reuben went and confounded the bed of Bilhah the concubine of his father, which had been ordained along with the bed of Leah his mother; and this is reputed with regard to him, as if he had lain with her. And Israel heard it, and it afflicted him, and he said, Alas, that one should have come forth from me so profane, even as Ishmael came forth from Abraham, and Esau from my father! The Spirit of Holiness answered and thus spake to him: fear not, for all are righteous and none of them is profane! So, after Benjamin was born, the sons of Jakob were twelve.", "tj": "", "tj_en": "", "rashi": "<b>בשכן ישראל בארץ ההיא.<\/b> עַד שֶׁלֹּא בָא לְחֶבְרוֹן אֵצֶל יִצְחָק אֵרְעוּהוּ כָל אֵלֶּה:<br><br><b>וישכב.<\/b> מִתּוֹךְ שֶׁבִּלְבֵּל מִשְׁכָּבוֹ, מַעֲלֶה עָלָיו הַכָּתוּב כְּאִלּוּ שְׁכָבָהּ; וְלָמָּה בִלְבֵּל וְחִלֵּל יְצוּעָיו? שֶׁכְּשֶׁמֵּתָה רָחֵל נָטַל יַעֲקֹב מִטָּתוֹ, שֶׁהָיְתָה נְתוּנָה תָּדִיר בְּאֹהֶל רָחֵל וְלֹא בִּשְׁאָר אֹהָלִים, וּנְתָנָהּ בְּאֹהֶל בִּלְהָה; בָּא רְאוּבֵן וְתָבַע עֶלְבּוֹן אִמּוֹ, אָמַר אִם אֲחוֹת אִמִּי הָיְתָה צָרָה לְאִמִּי, שִׁפְחַת אֲחוֹת אִמִּי תְּהֵא צָרָה לְאִמִּי? לְכָךְ בִּלְבֵּל (שבת נ\"ה):<br><br><b>ויהיו בני יעקב שנים עשר.<\/b> מַתְחִיל לְעִנְיָן רִאשׁוֹן, מִשֶּׁנּוֹלַד בִּנְיָמִין נִשְׁלְמָה הַמִּטָּה וּמֵעַתָּה רְאוּיִים לְהִמָּנוֹת, וּמְנָאָן; וְרַבּוֹתֵינוּ דָּרְשׁוּ, לְלַמְּדֵנוּ בָא, שֶׁכֻּלָּן שָׁוִין וְכֻלָּן צַדִּיקִים, שֶׁלֹּא חָטָא רְאוּבֵן:", "rashi_en": "בשכן ישראל בארץ ההוא WHEN ISRAEL DWELT IN THAT LAND — before he came to Isaac at Hebron, all these troubles happened to him.<br><br>וישכב AND HE LAY — Because he had disturbed his couch Scripture accounts it to him as though he had actually sinned in this manner. But why did he disturb his couch? When Rachel died Jacob removed to Bilhah’s tent and Reuben came and protested against the slight thus inflicted on his mother (Leah). He said: “If my mother’s sister was her rival, is that any reason why the handmaid of my mother’s sister should become a rival to her!” On this account he disturbed the couch (Shabbat 55b).<br><br>ויהיו בני יעקב שנים עשר NOW THE SONS OF JACOB WERE TWELVE — Scripture begins again where it left off the previous narrative (i.e. the birth of Benjamin): when Benjamin was born the destined number of his sons was complete and it was proper that they should then be enumerated; and therefore it enumerates them. Our Rabbis explained that these words are intended to tell us that Jacob’s twelve sons were all equal — they were all equally righteous, for Reuben had committed no actual sin (Shabbat 55b). "}, {"ch": 35, "v": 23, "aliyah": 6, "heb": "בְּנֵ֣י לֵאָ֔ה בְּכ֥וֹר יַעֲקֹ֖ב רְאוּבֵ֑ן וְשִׁמְעוֹן֙ וְלֵוִ֣י וִֽיהוּדָ֔ה וְיִשָּׂשכָ֖ר וּזְבֻלֽוּן׃", "onk": "בְּנֵי לֵאָה בּוּכְרָא דְיַעֲקֹב רְאוּבֵן וְשִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָׂשכָר וּזְבֻלוּן:", "onk_en": "The sons of Leah [were]: Reuvein, Yaakov’s firstborn, Shimon, Leivi, Yehudah, Yissachar and Zevulun.", "pj": "בְּנֵי לֵאָה בּוּכְרֵיהּ דְיַעֲקב רְאוּבֵן וְשִׁמְעוֹן וְלֵוִי וִיהוּדָה יִשָשׁכָר וּזְבוּלוּן", "pj_en": "The sons of Leah, the first--born of Jakob, Reuben, and Shimeon, and Levi, and Jehudah, and Issakar, and Zabulon.", "tj": "", "tj_en": "", "rashi": "<b>בכור יעקב.<\/b> אֲפִלּוּ בִּשְׁעַת הַקַּלְקָלָה קְרָאוֹ בְּכוֹר:<br><br><b>בכור יעקב.<\/b> בְּכוֹר לַנַּחֲלָה, בְּכוֹר לָעֲבוֹדָה, בְּכוֹר לְמִנְיָן, וְלֹא נִתְּנָה בְכוֹרָה לְיוֹסֵף אֶלָּא לְעִנְיַן הַשְּׁבָטִים – שֶׁנַּעֲשָׂה לִשְׁנֵי שְׁבָטִים:", "rashi_en": "בכור יעקב JACOB’S FIRSTBORN — even when it speaks of his corrupt action Scripture calls him firstborn (Genesis Rabbah 82:11).<br><br>בכור יעקב JACOB’S FIRSTBORN — firstborn with regard to heritage, firstborn with regard to Divine Service (for before the Levites were appointed to minister to God the duty devolved upon the oldest son in each family), firstborn in any enumeration of the twelve tribes; for the right of a firstborn son was given to Joseph only in respect of the tribes — in that he founded two tribes (just as a firstborn son received a double portion in his father’s property) (Genesis Rabbah 82:11). "}, {"ch": 35, "v": 24, "aliyah": 6, "heb": "בְּנֵ֣י רָחֵ֔ל יוֹסֵ֖ף וּבִנְיָמִֽן׃", "onk": "בְּנֵי רָחֵל יוֹסֵף וּבִנְיָמִן:", "onk_en": "The sons of Rochel [were]: Yoseif and Binyomin.", "pj": "בְּנֵי רָחֵל יוֹסֵף וּבִנְיָמִין", "pj_en": "The sons of Rahel, Joseph and Benjamin.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 25, "aliyah": 6, "heb": "וּבְנֵ֤י בִלְהָה֙ שִׁפְחַ֣ת רָחֵ֔ל דָּ֖ן וְנַפְתָּלִֽי׃", "onk": "וּבְנֵי בִלְהָה אַמְתָא דְרָחֵל דָּן וְנַפְתָּלִי:", "onk_en": "The sons of Bilhah, Rochel’s handmaid, [were]: Don and Naftali.", "pj": "וּבְנֵי בִלְהָה אַמְתָא דְרָחֵל דָן וְנַפְתָּלִי", "pj_en": "The sons of Bilhah, the handmaid of Rahel, Dan and Naphtali;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 26, "aliyah": 6, "heb": "וּבְנֵ֥י זִלְפָּ֛ה שִׁפְחַ֥ת לֵאָ֖ה גָּ֣ד וְאָשֵׁ֑ר אֵ֚לֶּה בְּנֵ֣י יַעֲקֹ֔ב אֲשֶׁ֥ר יֻלַּד־ל֖וֹ בְּפַדַּ֥ן אֲרָֽם׃", "onk": "וּבְנֵי זִלְפָּה אַמְתָא דְלֵאָה גָּד וְאָשֵׁר אִלֵּין בְּנֵי יַעֲקֹב דִּי אִתְיְלִידַן לֵיהּ בְּפַדַּן אֲרָם:", "onk_en": "The sons of Zilpah, Leah’s handmaid, [were]: Gad and Asher. These are the sons of Yaakov that were born to him in Padan Aram.", "pj": "וּבְנֵי זִלְפָּה אַמְתָא דְלֵאָה גָד וְאָשֵׁר אִלֵין בְּנֵי יַעֲקב דְאִתְיְלִידוּ לֵיהּ בְּפַדַן אֲרָם", "pj_en": "and the sons of Zilpha, the handmaid of Leah, Gad and Asher. These are the sons of Jakob who were born to him in Padan Aram.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 27, "aliyah": 6, "heb": "וַיָּבֹ֤א יַעֲקֹב֙ אֶל־יִצְחָ֣ק אָבִ֔יו מַמְרֵ֖א קִרְיַ֣ת הָֽאַרְבַּ֑ע הִ֣וא חֶבְר֔וֹן אֲשֶׁר־גָּֽר־שָׁ֥ם אַבְרָהָ֖ם וְיִצְחָֽק׃", "onk": "וַאֲתָא יַעֲקֹב לְוַת יִצְחָק אֲבוּהִי מַמְרֵא קִרְיַת אַרְבַּע הִיא חֶבְרוֹן דִּי דָר תַּמָּן אַבְרָהָם וְיִצְחָק:", "onk_en": "Yaakov came to Yitzchok, his father, in Mamrei at Kiryas Arba, which is Chevron where Avraham and Yitzchok lived.", "pj": "וְאָתָא יַעֲקב לְוַת יִצְחָק אָבוֹי לְמַמְרֵא קִרְיַת אַרְבַּע הוּא חֶבְרוֹן דְדַר תַּמָן אַבְרָהָם וְיִצְחָק", "pj_en": "And Jakob came to Izhak his father, at Mamre the city of Arba, which is Hebron, for there Abraham and Izhak had dwelt.", "tj": "", "tj_en": "", "rashi": "<b>ממרא.<\/b> שֵׁם הַמִּישׁוֹר:<br><br><b>קרית הארבע.<\/b> שֵׁם הָעִיר:<br><br><b>ממרא קרית הארבע.<\/b> אֶל מִישׁוֹר שֶׁל קִרְיַת אַרְבַּע. וְאִ\"תֹּ הָיָה לוֹ לִכְתּוֹב מַמְרֵא הַקִּרְיַת אַרְבַּע? כֵּן דֶּרֶךְ הַמִּקְרָא בְּכָל דָּבָר שֶׁשְּׁמוֹ כָּפוּל, כְּגוֹן זֶה, וּכְגוֹן בֵּית לֶחֶם, אֲבִי עֶזֶר, בֵּית אֵל, אִם הֻצְרַךְ לְהַטִּיל בּוֹ הֵ\"א, נוֹתְנָהּ בְּרֹאשׁ הַתֵּבָה הַשְּׁנִיָּה – בֵּית הַלַּחְמִי (שמואל א ט\"ז), בְּעָפְרָת אֲבִי הָעֶזְרִי (שופטים ו'), בָּנָה חִיאֵל בֵּית הָאֱלִי (מלכים א ט\"ז):", "rashi_en": "ממרא MAMRE — the name of the plain.<br><br>קרית הארבע KIRIATH-ARBA— the name of the city.<br><br>ממרא קרית הארבע therefore means “to the plain of Kiriath-arba”. If you say that it should have written ממרא הקרית ארבע (that Kirjath-arba being one name the definite article should be placed in front of it) then I reply that this is the rule in Biblical Hebrew: in every case of a name compounded of two words, such as this, and such as בית לחם and אבי עזר and בית אל, when it is necessary to prefix the definite article (in order to determine the name) it is prefixed to the second element of the name — thus (1 Samuel 16:1)בית הלחמי  the Bethlehemite; (Judges 6:24) “in Ophrah (אבי העזרי) of the Abiezrites”; (1 Kings 16:34) “did Hiel the Bethelite (בית האלי) build”. "}, {"ch": 35, "v": 28, "aliyah": 6, "heb": "וַיִּֽהְי֖וּ יְמֵ֣י יִצְחָ֑ק מְאַ֥ת שָׁנָ֖ה וּשְׁמֹנִ֥ים שָׁנָֽה׃", "onk": "וַהֲווֹ יוֹמֵי יִצְחָק מְאָה וּתְמָנָן שְׁנִין:", "onk_en": "The days of [the life of] Yitzchok were one hundred and eighty years.", "pj": "וַהֲווֹ יוֹמֵי יִצְחָק מֵאָה וְתַמְנָן שְׁנִין", "pj_en": "And the days of Izhak were an hundred and eighty years.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 29, "aliyah": 6, "heb": "וַיִּגְוַ֨ע יִצְחָ֤ק וַיָּ֙מׇת֙ וַיֵּאָ֣סֶף אֶל־עַמָּ֔יו זָקֵ֖ן וּשְׂבַ֣ע יָמִ֑ים וַיִּקְבְּר֣וּ אֹת֔וֹ עֵשָׂ֥ו וְיַעֲקֹ֖ב בָּנָֽיו׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִתְנְגִיד יִצְחָק וּמִית וְאִתְכְּנִישׁ לְעַמֵּיהּ סִיב וּשְׂבַע יוֹמִין וּקְבָרוּ יָתֵיהּ עֵשָׂו וְיַעֲקֹב בְּנוֹהִי:", "onk_en": "Yitzchok expired and died. He was gathered to his people old and in the fullness of days. His sons, Eisov and Yaakov buried him.", "pj": "וְאִתְנְגִיד יִצְחָק וְאִתְכְּנַשׁ לְעַמֵיהּ סִיב וּשְבַע יוֹמִין וּקְבָרוּ יָתֵיהּ עֵשָו וְיַעֲקב בְּנוֹי", "pj_en": "And Izhak expired and died and was gathered to his people, old and full of days, and Esau and Jakob his sons buried him.", "tj": "", "tj_en": "", "rashi": "<b>ויגוע יצחק.<\/b> אֵין מֻקְדָּם וּמְאֻחָר בַּתּוֹרָה; מְכִירָתוֹ שֶׁל יוֹסֵף קָדְמָה לְמִיתָתוֹ שֶׁל יִצְחָק י\"ב שָׁנָה, שֶׁהֲרֵי כְּשֶׁנּוֹלַד יַעֲקֹב הָיָה יִצְחָק בֶּן שִׁשִּׁים שָׁנָה, שֶׁנֶּאֱמַר וְיִצְחָק בֶּן שִׁשִּׁים שָׁנָה וְגוֹ', וְיִצְחָק מֵת בִּשְׁנַת ק\"כ לְיַעֲקֹב – אִם תּוֹצִיא שִׁשִּׁים מִמֵּאָה וּשְׁמוֹנִים שָׁנָה נִשְׁאֲרוּ ק\"כ – וְיוֹסֵף נִמְכַּר בֶּן י\"ז שָׁנָה, וְאוֹתָהּ שָׁנָה שְׁנַת מֵאָה וּשְׁמוֹנֶה לְיַעֲקֹב, כֵּיצַד? בֶּן שִׁשִּׁים וְשָׁלוֹשׁ נִתְבָּרֵךְ, אַרְבַּע עֶשְׂרֵה שָׁנָה נִטְמַן בְּבֵית עֵבֶר, הֲרֵי שִׁבְעִים וְשֶׁבַע, וְאַרְבַּע עֶשְׂרֵה עָבַד בְּאִשָּׁה, וּבְסוֹף אַרְבַּע עֶשְׂרֵה נוֹלַד יוֹסֵף, שֶׁנֶּאֱמַר וַיְהִי כַּאֲשֶׁר יָלְדָה רָחֵל אֶת יוֹסֵף וְגוֹ', הֲרֵי תִּשְׁעִים וְאַחַת, וְי\"ז עַד שֶׁלֹּא נִמְכַּר יוֹסֵף, הֲרֵי מֵאָה וּשְׁמוֹנֶה (עוֹד מְפֹרָשׁ מִן הַמִּקְרָא מִשֶּׁנִּמְכַּר יוֹסֵף עַד שֶׁבָּא יַעֲקֹב מִצְרַיִמָה כ\"ב שָׁנָה שֶׁנֶּ', וְיוֹסֵף בֶּן שְׁלֹשִׁים שָׁנָה וְגוֹ', וְז' שָׁנִים שָׂבָע וּשְׁנָתַיִם רָעָב, הֲרֵי כ\"ב, וּכְתִיב יְמֵי שְׁנֵי מְגוּרַי שְׁלֹשִׁים וּמְאַת שָׁנָה, נִמְצָא יַעֲקֹב בִּמְכִירָתוֹ ק\"ח):", "rashi_en": "ויגוע יצחק AND ISAAC EXPIRED — There is no such thing as “earlier’’ or “later” (chronological order) in the narratives of the Torah (Pesachim 6b), and the sale of Joseph preceded Isaac’s death by twelve years.  Thus: at Jacob’s birth Isaac was sixty years old — as it is said (25:26) “And Isaac was sixty years old [when he bore them]” (Esau and Jacob). Isaac died when Jacob was 120, for if you deduct 60 from 180 (Isaac’s age when he died), you have left 120. Joseph was 17 years old when he was sold, and that year was the one hundred and eighth of Jacob’s life. How is this? Jacob was 63 when he received the blessing of his father; 14 years he hid himself in Eber’s School — making 77 — and 14 years “he served for his wives” (Rashi borrows a phrase from Hosea 12:13 “And Israel served for a wife”; but he means for both wives), and at the expiration of these 14 years Joseph was born as it is said (30:25) “and it came to pass when Rachel had born Joseph” (that Jacob wished to return home and he would not have desired to do this if his fourteen years of service were not completed) making 91. Add to this the seventeen years of Joseph’s life before he was sold, and you have 108. This may also be derived more directly from Scripture thus: from the time when Joseph was sold until the time when Jacob came to Egypt was 22 years, for it is said (41:46) “And Joseph was 30 years old [when he stood before Pharaoh]” (and therefore he had been in Egypt 13 years, as he was 17 when he was sold) and the seven years of plenty and two of famine had elapsed before Jacob came to Egypt (cf. 45:6), making 22 years. And as it is written (47:9) that Jacob on his arrival in Egypt said to Pharaoh “The days of the years of my sojournings are a hundred and thirty years”, it follows that at the time when Joseph was sold Jacob was one hundred and eight years old."}, {"ch": 36, "v": 1, "aliyah": 6, "heb": "וְאֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃", "onk": "וְאִלֵּין תּוּלְדַת עֵשָׂו הוּא אֱדוֹם:", "onk_en": "These are the descendants of Eisov, also known as Edom.", "pj": "וְאִלֵין יֵיחוּסִין דְעֵשָו הוּא דְמִתְקְרֵי אֱדוֹם", "pj_en": "These are the genealogies of Esau, who is called Edom.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 2, "aliyah": 6, "heb": "עֵשָׂ֛ו לָקַ֥ח אֶת־נָשָׁ֖יו מִבְּנ֣וֹת כְּנָ֑עַן אֶת־עָדָ֗ה בַּת־אֵילוֹן֙ הַֽחִתִּ֔י וְאֶת־אׇהֳלִֽיבָמָה֙ בַּת־עֲנָ֔ה בַּת־צִבְע֖וֹן הַֽחִוִּֽי׃", "onk": "עֵשָׂו נְסִיב יָת נְשׁוֹהִי מִבְּנַת כְּנָעַן יָת עָדָה בַּת אֵילוֹן חִתָּאָה וְיָת אָהֳלִיבָמָה בַּת עֲנָה בַּת צִבְעוֹן חִוָּאָה:", "onk_en": "Eisov took his wives from the daughters of Canaan: Adah, the daughter of Eylon, the Chittite, and Oholivomoh, the daughter of Anoh, daughter of Tzivon, the Chivite.", "pj": "עֵשָו נְסִיב יַת נְשׁוֹי מִבְּנַת כְּנָעַן יַת עָדָה בְּרַת אֵלוֹן חִיתָּאָה וְיַת אָהֳלִיבָמָה בְּרַת עֲנָה בְּרַת צִבְעוֹן חִיוָאָה", "pj_en": "Esau took wives of the daughters of Kenaan, Adah the daughter of Elon the Hittah, and Ahalibama the daughter of Ana, the daughter of Sibeon the Hiva,", "tj": "", "tj_en": "", "rashi": "<b>עדה בת אילון.<\/b> הִיא בָּשְׂמַת בַּת אֵילוֹן, וְנִקְרֵאת בָּשְׂמַת עַל שֵׁם שֶׁהָיְתָה מְקַטֶּרֶת בְּשָׂמִים לַעֲ\"זָ:<br><br><b>אהליבמה.<\/b> הִיא יְהוּדִית, וְהוּא כִנָּה שְׁמָהּ יְהוּדִית לוֹמַר שֶׁהִיא כּוֹפֶרֶת בַּעֲ\"זָ כְּדֵי לְהַטְעוֹת אֶת אָבִיו:<br><br><b>בת ענה בת צבעון.<\/b> אִם בַּת עֲנָה לֹא בַּת צִבְעוֹן? עֲנָה בְּנוֹ שֶׁל צִבְעוֹן, שֶׁנֶּאֱמַר וְאֵלֶּה בְנֵי צִבְעוֹן וְאַיָּה וַעֲנָה? מְלַמֵּד שֶׁבָּא צִבְעוֹן עַל כַּלָּתוֹ אֵשֶׁת עֲנָה, וְיָצְאָה אָהֳלִיבָמָה מִבֵּין שְׁנֵיהֶם, וְהוֹדִיעֲךָ הַכָּתוּב שֶׁכֻּלָּן בְּנֵי מַמְזֵרוּת הָיוּ:", "rashi_en": "עדה בת אילון ADAH THE DAUGHTER OF ELON — She is identical with Basemath daughter of Elon (cf. 26:34) and she was called Basemath because she offered spices (בשמים) as incense to idols.<br><br>אהליבמה OHOLIBAMAH is identical with Judith. He (Esau) changed her name to Judith (Jewess), suggesting that she had abandoned idol-worship, so that he might deceive his father.<br><br>בת ענה בת צבעון THE DAUGHTER OF ANAH THE DAUGHTER OF ZIBEON — If she was the daughter of Anah she could not have been the daughter of Zibeon, for Anah was the son of Zibeon as it is said (v. 24) “And these are the sons of Zibeon: Aiah and Anah”! Scripture thus tells us that Zibeon took his daughter-in-law, Anah’s wife, and of them twain Oholibamah was born (so that being a daughter of Anah’s wife she is called also his daughter). This text informs you that these were all of illegitimate birth (Midrash Tanchuma, Vayeshev 1)."}, {"ch": 36, "v": 3, "aliyah": 6, "heb": "וְאֶת־בָּשְׂמַ֥ת בַּת־יִשְׁמָעֵ֖אל אֲח֥וֹת נְבָיֽוֹת׃", "onk": "וְיָת בָּשְׂמַת בַּת יִשְׁמָעֵאל אֲחָתֵיהּ דִּנְבָיוֹת:", "onk_en": "[He also took] Bosmas, the daughter of Yishmael, the sister of Nevayos.", "pj": "וְיַת בָּשְמַת בְּרַת יִשְׁמָעֵאל דַאֲסִיבָא לֵיהּ נְבָיוֹת אָחָהּ", "pj_en": "and Basemath the daughter of Ishmael whom Nebaioth her brother gave to him.", "tj": "", "tj_en": "", "rashi": "<b>בשמת בת ישמעאל.<\/b> וּלְהַלָּן קוֹרֵא לָהּ מָחֲלַת? מָצִינוּ בְּאַגָּדַת מִדְרַשׁ סֵפֶר שְׁמוּאֵל ג' מוֹחֲלִים לָהֶן עֲוֹנוֹתֵיהֶן, גֵּר שֶׁנִּתְגַּיֵּר, וְהָעוֹלֶה לִגְדֻלָּה, וְהַנּוֹשֵׂא אִשָּׁה. וְלָמַד הַטַּעַם מִכָּאן – לְכָךְ נִקְרֵאת מָחֲלַת, שֶׁנִּמְחֲלוּ עֲוֹנוֹתָיו:<br><br><b>אחות נביות.<\/b> עַל שֵׁם שֶׁהוּא הִשִּׂיאָהּ לוֹ מִשֶּׁמֵּת יִשְׁמָעֵאל נִקְרֵאת עַל שְׁמוֹ:", "rashi_en": "בשמת בת ישמעאל BASE-MATH ISHMAEL’S DAUGHTER — But elsewhere (28:9) she is called Mahalath! We find in the Agadic Midrash on the Book of Samuel (Ch. 17) that there are three classes whose sins are pardoned: a proselyte, one who is exalted to a high position and a man on his marriage. It derives the proof for the latter case from here; viz., the reason why she was also calleth Mahalath (pardon) was because his (Esau’s) sins were pardoned on his marriage to her (Megillah 17a; cf. also Genesis Rabbah 63).<br><br>אחות נביות SISTER OF NEBAIOTH — because he gave her in marriage after Ishmael’s death she is called after his name (Nebaioth’s sister). "}, {"ch": 36, "v": 4, "aliyah": 6, "heb": "וַתֵּ֧לֶד עָדָ֛ה לְעֵשָׂ֖ו אֶת־אֱלִיפָ֑ז וּבָ֣שְׂמַ֔ת יָלְדָ֖ה אֶת־רְעוּאֵֽל׃", "onk": "וִילִידַת עָדָה לְעֵשָׂו יָת אֱלִיפָז וּבָשְׂמַת יְלִידַת יָת רְעוּאֵל:", "onk_en": "Adah bore to Eisov, [his son] Eliphaz, and Bosmas bore Reueil.", "pj": "וִילֵידַת עָדָה לְעֵשָו יַת אֱלִיפַז וּבָשְמַת יְלֵידַת יַת רְעוּאֵל", "pj_en": "And Adah bare to Esau Eliphaz, and Basemath bare Reuel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 5, "aliyah": 6, "heb": "וְאׇהֳלִֽיבָמָה֙ יָֽלְדָ֔ה אֶת־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[יְע֥וּשׁ]<\/span> <span class=\"mam-kq-k\">(יעיש)<\/span><\/span> וְאֶת־יַעְלָ֖ם וְאֶת־קֹ֑רַח אֵ֚לֶּה בְּנֵ֣י עֵשָׂ֔ו אֲשֶׁ֥ר יֻלְּדוּ־ל֖וֹ בְּאֶ֥רֶץ כְּנָֽעַן׃", "onk": "וְאָהֳלִיבָמָה יְלִידַת יָת יְעוּשׁ וְיָת יַעְלָם וְיָת קֹרַח אִלֵּין בְּנֵי עֵשָׂו דִּי אִתְיְלִידוּ לֵיהּ בְּאַרְעָא דִכְנָעַן:", "onk_en": "Oholivomoh bore Yeush, Yalom, and Korach. These are the sons of Eisov that were born to him in the land of Canaan.", "pj": "וְאָהֳלִיבָמָה יְלֵידַת יַת יְעוּשׁ וְיַת יַעֲלָם וְיַת קרַח אִלֵין בְּנוֹי דְעֵשָו דִי אִיתְיְלִידוּ לֵיהּ בְּאַרְעָא דִכְנָעַן", "pj_en": "And Ahalibama, bare to Esau Jehus, and Jaalam, and Korach. These are the sons of Esau who were born to him in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "<b>ואהליבמה ילדה וגו'.<\/b> קֹרַח זֶה מַמְזֵר הָיָה, וּבֶן אֱלִיפַז הָיָה, שֶׁבָּא עַל אֵשֶׁת אָבִיו, אֶל אָהֳלִיבָמָה אֵשֶׁת עֵשָׂו, שֶׁהֲרֵי הוּא מָנוּי עִם אַלּוּפֵי אֱלִיפַז בְּסוֹף הָעִנְיָן (בראשית רבה):", "rashi_en": "ואהליבמה ילדה וגו׳ AND OHOLIBAMAH BARE etc. — This Korah was an illegitimate child for he was the son of Eliphaz (cf. vv. 15, 16, 18) who had taken his father’s wife — Oholibamah, the wife of Esau — for he is enumerated also amongst the chiefs of Eliphaz at the end of this section (Genesis Rabbah 82:12). "}, {"ch": 36, "v": 6, "aliyah": 6, "heb": "וַיִּקַּ֣ח עֵשָׂ֡ו אֶת־נָ֠שָׁ֠יו וְאֶת־בָּנָ֣יו וְאֶת־בְּנֹתָיו֮ וְאֶת־כׇּל־נַפְשׁ֣וֹת בֵּיתוֹ֒ וְאֶת־מִקְנֵ֣הוּ וְאֶת־כׇּל־בְּהֶמְתּ֗וֹ וְאֵת֙ כׇּל־קִנְיָנ֔וֹ אֲשֶׁ֥ר רָכַ֖שׁ בְּאֶ֣רֶץ כְּנָ֑עַן וַיֵּ֣לֶךְ אֶל־אֶ֔רֶץ מִפְּנֵ֖י יַעֲקֹ֥ב אָחִֽיו׃", "onk": "וּדְבַר עֵשָׂו יָת נְשׁוֹהִי וְיָת בְּנוֹהִי וְיָת בְּנָתֵיהּ וְיָת כָּל נַפְשַׁת בֵּיתֵיהּ וְיָת גֵּיתוֹהִי וְיָת כָּל בְּעִירֵיהּ וְיָת כָּל קִנְיָנֵיהּ דִּי קְנָא בְּאַרְעָא דִכְנָעַן וַאֲזַל לְאַרְעָא <b>אָחֲרֵי<\/b> מִן קֳדָם יַעֲקֹב אָחוּהִי:", "onk_en": "Eisov took his wives, his sons, his daughters, all the people of his household, his livestock, all his animals, and all his possessions that he had acquired in the land of Canaan, and he went to a [<b>different<\/b>] land away from his brother, Yaakov.", "pj": "וּדְבַר עֵשָו יַת נְשׁוֹי וְיַת בְּנוֹי וְיַת בְּנָתוֹי וְיַת כָּל נַפְשַׁת בֵּיתֵיהּ וְיַת גֵיתוֹי וְיַת בְּעִירוֹי וְיַת כָּל נִכְסוֹי דִי קָנָה בְּאַרְעָא דִכְנָעַן וְטַיָיל לְאַרַע אוֹחֲרִי דַהֲוָה רַמְיָא עֲלוֹי אֵימָתָא דְיַעֲקב אָחוּהִי", "pj_en": "And Esau had taken his wives and his sons and his daughters, and all the souls of his house, and his flocks and his cattle, and all the substance which he had gotten in the land of Kenaan, and had gone into another land; for there fell upon him a fear of Jakob his brother:", "tj": "", "tj_en": "", "rashi": "<b>וילך אל ארץ.<\/b> לָגוּר בַּאֲשֶׁר יִמְצָא:", "rashi_en": "i.e. no particular country, but into any country), to stay where-ever he could find room. "}, {"ch": 36, "v": 7, "aliyah": 6, "heb": "כִּֽי־הָיָ֧ה רְכוּשָׁ֛ם רָ֖ב מִשֶּׁ֣בֶת יַחְדָּ֑ו וְלֹ֨א יָֽכְלָ֜ה אֶ֤רֶץ מְגֽוּרֵיהֶם֙ לָשֵׂ֣את אֹתָ֔ם מִפְּנֵ֖י מִקְנֵיהֶֽם׃", "onk": "אֲרֵי הֲוָה קִנְיָנְהוֹן סַגִּי מִלְּמִתַּב כַּחֲדָא וְלָא יְכִילַת אֲרַע תּוֹתָבוּתְהוֹן לְסוֹבָרָא יָתְהוֹן מִן קֳדָם גֵּיתֵיהוֹן:", "onk_en": "For their wealth was too great for them to live together. The land in which they lived temporarily could not support them because of their livestock.", "pj": "אֲרוּם הֲוָה נִכְסֵיהוֹן סַגִי מִלְמֵיתַב כַּחֲדָא וְלָא כְּהִילַת אַרְעָא תוֹתָבוּתְהוֹן לְסוֹבָרָא יַתְהוֹם מִן קֳדָם גֵיתֵיהוֹן", "pj_en": "for their possessions would be too great for them to dwell together, neither would the land of their sojourning maintain them, on account of their flocks.", "tj": "", "tj_en": "", "rashi": "<b>ולא יכלה ארץ מגוריהם.<\/b> לְהַסְפִּיק מִרְעֶה לַבְּהֵמוֹת שֶׁלָּהֶם (ב\"ר). וּמִ\"אַ: <b>מפני יעקב אחיו.<\/b> מִפְּנֵי שְׁטַר חוֹב שֶׁל גְּזֵרַת \"כִּי גֵר יִהְיֶה זַרְעֲךָ\" הַמֻּטָּל עַל זַרְעוֹ שֶׁל יִצְחָק, אָמַר אֵלֵךְ לִי מִכָּאן, אֵין לִי חֵלֶק לֹא בַּמַּתָּנָה, שֶׁנִּתְּנָה לוֹ הָאָרֶץ הַזֹּאת, וְלֹא בְּפִרְעוֹן הַשְּׁטָר, וּמִפְּנֵי הַבּוּשָׁה שֶׁמָּכַר בְּכוֹרָתוֹ:", "rashi_en": "ולא יכלה ארץ מגוריהם AND THE LAND OF THEIR SOJOURNINGS COULD NOT — supply sufficient pasture for the cattle which they had. A Midrashic comment (Genesis Rabbah 82:13) on מפני יעקב אחיו [HE WENT TO A COUNTRY] ON ACCOUNT OF HIS BROTHER JACOB is: on account of the bond of indebtedness involved in the decree, (Genesis 14:13) “thy seed shall be a stranger etc… and they shall afflict them etc.” that was imposed upon Isaac’s descendants. He said, “I shall go hence — I desire no part either in the gift of this land which has been made to him (to my father) nor in the payment of this bond\" . Another reason why he went away was on account of the shame he felt at having sold his birthright (cf. Genesis Rabbah 82:13). "}, {"ch": 36, "v": 8, "aliyah": 6, "heb": "וַיֵּ֤שֶׁב עֵשָׂו֙ בְּהַ֣ר שֵׂעִ֔יר עֵשָׂ֖ו ה֥וּא אֱדֽוֹם׃", "onk": "וִיתֵיב עֵשָׂו בְּטוּרָא דְשֵׂעִיר עֵשָׂו הוּא אֱדוֹם:", "onk_en": "Eisov [therefore] settled in Mount Seir. Eisov is Edom.", "pj": "וִיתֵיב עֵשָו בְּטַוָור גַבְלָא עֵשָו הוּא רַבָּא דֶאֱדוֹמָאֵי", "pj_en": "And Esau dwelt in the mountain of Gabal. He is Esau the prince of the Edomites.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 9, "aliyah": 6, "heb": "וְאֵ֛לֶּה תֹּלְד֥וֹת עֵשָׂ֖ו אֲבִ֣י אֱד֑וֹם בְּהַ֖ר שֵׂעִֽיר׃", "onk": "וְאִלֵּין תּוּלְדַת עֵשָׂו אֲבוּהוֹן <b>דֶאֱדוֹמָאֵי<\/b> בְּטוּרָא דְּשֵׂעִיר:", "onk_en": "These are the descendants of Eisov, the ancestor of Edom [<b>the Edomites<\/b>] in Mount Seir.", "pj": "וְאִלֵין יִיחוּסִין דְעֵשָו רַבָּא דֶאֱדוֹמָאֵי דְבֵית מְדוֹרְהוֹן בְּטַוָור גַבְלָא", "pj_en": "And these are the kindreds of Esau the prince of the Edomites, the place of whose dwelling was in the mountain. of Gabal.", "tj": "", "tj_en": "", "rashi": "<b>ואלה.<\/b> הַתּוֹלָדוֹת שֶׁהוֹלִידוּ בָנָיו עַכְשָׁו מִשֶּׁהָלַךְ לְשֵׂעִיר:", "rashi_en": "ואלה AND THESE — are the generations that his sons begat after he went to Seir. "}, {"ch": 36, "v": 10, "aliyah": 6, "heb": "אֵ֖לֶּה שְׁמ֣וֹת בְּנֵֽי־עֵשָׂ֑ו אֱלִיפַ֗ז בֶּן־עָדָה֙ אֵ֣שֶׁת עֵשָׂ֔ו רְעוּאֵ֕ל בֶּן־בָּשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃", "onk": "אִלֵּין שְׁמָהַת בְּנֵי עֵשָׂו אֱלִיפַז בַּר עָדָה אִתַּת עֵשָׂו רְעוּאֵל בַּר בָּשְׂמַת אִתַּת עֵשָׂו:", "onk_en": "These are the names of Eisov’s sons: Eliphaz, the son of Adah, the wife of Eisov, Reueil, the son of Bosmas, the wife of Eisov.", "pj": "אִלֵין שְׁמָהַת בְּנֵי עֵשָו אֱלִיפַז בַּר עָדָה אִיתַּת עֵשָו רְעוּאֵל בַּר בָּשְמַת אִיתַּת עֵשָו", "pj_en": "These are the names of the sons of Esau, Eliphaz bar Adah, wife of Esau; Reuel bar Basemath, wife of Esau.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 11, "aliyah": 6, "heb": "וַיִּהְי֖וּ בְּנֵ֣י אֱלִיפָ֑ז תֵּימָ֣ן אוֹמָ֔ר צְפ֥וֹ וְגַעְתָּ֖ם וּקְנַֽז׃", "onk": "וַהֲווֹ בְּנֵי אֱלִיפָז תֵּימָן אוֹמָר צְפוֹ וְגַעְתָּם וּקְנַז:", "onk_en": "The sons of Eliphaz were Teiman, Omar, Tzepho, Gatam and Kenaz.", "pj": "וַהֲווֹ בְּנֵי אֱלִיפַז תֵּימָן אוֹמָר צְפוֹ וְגַעְתָּם וּקְנַז", "pj_en": "And the sons of Eliphaz were Teman Omar, Zephu, and Gaatam, and Kenaz, and Timna.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 12, "aliyah": 6, "heb": "וְתִמְנַ֣ע&thinsp;<b>׀<\/b> הָיְתָ֣ה פִילֶ֗גֶשׁ לֶֽאֱלִיפַז֙ בֶּן־עֵשָׂ֔ו וַתֵּ֥לֶד לֶאֱלִיפַ֖ז אֶת־עֲמָלֵ֑ק אֵ֕לֶּה בְּנֵ֥י עָדָ֖ה אֵ֥שֶׁת עֵשָֽׂו׃", "onk": "וְתִמְנַע הֲוַת לְחֵינָתָא לֶאֱלִיפַז בַּר עֵשָׂו וִילִידַת לֶאֱלִיפַז יָת עֲמָלֵק אִלֵּין בְּנֵי עָדָה אִתַּת עֵשָׂו:", "onk_en": "Timna became a concubine to Eliphaz, Eisov’s son, and she bore to Eliphaz [a son], Amaleik. These are the sons of Adah, the wife of Eisov.", "pj": "וְתִמְנַע הֲוָת פִּילַקְתָּא לֶאֱלִיפַז בַּר עֵשָו וִילֵידַת לֶאֱלִיפַז יַת עֲמָלֵק הוּא אֱלִיפַז חַבְרֵיהּ דְאִיוֹב אִלֵין בְּנֵי עָדָה אִיתַּת עֵשָו", "pj_en": "And Timna was the concubine of Eliphaz bar Esau, and she bare to Eliphaz Amalek. He is Eliphaz the companion of Job. These are the sons of Adah wife of Esau.", "tj": "", "tj_en": "", "rashi": "<b>ותמנע היתה פילגש.<\/b> לְהוֹדִיעַ גְּדֻלָּתוֹ שֶׁל אַבְרָהָם, כַּמָּה הָיוּ תְאֵבִים לִדַּבֵּק בְּזַרְעוֹ. תִּמְנַע זוֹ בַּת אַלּוּפִים הָיְתָה, שֶׁנֶּאֱמַר וַאֲחוֹת לוֹטָן תִּמְנָע, וְלוֹטָן מֵאַלּוּפֵי יוֹשְׁבֵי שֵׂעִיר הָיָה מִן הַחוֹרִים שֶׁיָּשְׁבוּ בָהּ לְפָנִים, אָמְרָה אֵינִי זוֹכָה לְהִנָּשֵׂא לְךָ, הַלְוַאי וְאֶהְיֶה פִּילֶגֶשׁ. וּבְדִבְרֵי הַיָּמִים מוֹנֶה אוֹתָהּ בְּבָנָיו שֶׁל אֱלִיפַז, מְלַמֵּד שֶׁבָּא עַל אִשְׁתּוֹ שֶׁל שֵׂעִיר וְיָצְאָה תִּמְנָע מִבֵּינֵיהֶם, וּכְשֶׁגָּדְלָה נַעֲשֵׂית פִּילַגְשׁוֹ, וְזֶהוּ וַאֲחוֹת לוֹטָן תִּמְנָע, וְלֹא מְנָאָהּ עִם בְּנֵי שֵׂעִיר שֶׁהָיְתָה אֲחוֹתוֹ מִן הָאֵם וְלֹא מִן הָאָב:", "rashi_en": "ותמנע היתה פילגש AND TIMNA WAS CONCUBINE — This is stated to tell you in what importance Abraham was held — how eager people were to attach themselves to his descendants. This Timna was a descendant of chieftains, as it is said (v. 22) “And Lotan’s sister was Timna”, and Lotan was one of the chieftains inhabiting Seir — he was one of the Horites who had dwelt there from ancient times. She said to Eliphaz, “If I am unworthy to become your wife would that I might become your concubine!” In Chronicles (1 Chronicles 1:36) Scripture enumerates her amongst the children of Eliphaz, thus intimating that he took Seir’s wife and from the two of them Timna was born. When she grew up she became his concubine. This is why it is stated, “and Lotan’s sister was Timna”, and why Scripture does not enumerate her amongst Seir’s children, merely stating that she was sister to Lotan, Seir’s son, (see 5:20) because she was his sister from one mother and not from one father (Midrash Tanchuma, Vayeshev 1)."}, {"ch": 36, "v": 13, "aliyah": 6, "heb": "וְאֵ֙לֶּה֙ בְּנֵ֣י רְעוּאֵ֔ל נַ֥חַת וָזֶ֖רַח שַׁמָּ֣ה וּמִזָּ֑ה אֵ֣לֶּה הָי֔וּ בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃", "onk": "וְאִלֵּין בְּנֵי רְעוּאֵל נַחַת וָזֶרַח שַׁמָּה וּמִזָּה אִלֵּין הֲווֹ בְּנֵי בָשְׂמַת אִתַּת עֵשָׂו:", "onk_en": "These are the sons of Reueil, Nachas, Zerach, Shamoh, and Mizzoh. These were the sons of Bosmas, the wife of Eisov.", "pj": "וְאִלֵין בְּנֵי רְעוּאֵל נַחַת וָזֶרַח שַׁמָה וּמִזָה אִלֵין הֲווֹ בְּנֵי בָּשְמַת אִתַּת עֵשָו", "pj_en": "And these are the sons of Reuel, Nachath and Zerach, Shammah and Mizzah. These are the sons of Basemath wife of Esau.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 14, "aliyah": 6, "heb": "וְאֵ֣לֶּה הָי֗וּ בְּנֵ֨י אׇהֳלִיבָמָ֧ה בַת־עֲנָ֛ה בַּת־צִבְע֖וֹן אֵ֣שֶׁת עֵשָׂ֑ו וַתֵּ֣לֶד לְעֵשָׂ֔ו אֶת־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[יְע֥וּשׁ]<\/span> <span class=\"mam-kq-k\">(יעיש)<\/span><\/span> וְאֶת־יַעְלָ֖ם וְאֶת־קֹֽרַח׃", "onk": "וְאִלֵּין הֲווֹ בְּנֵי אָהֳלִיבָמָה בַת עֲנָה בַּת צִבְעוֹן אִתַּת עֵשָׂו וִילִידַת לְעֵשָׂו יָת יְעוּשׁ וְיָת יַעְלָם וְיָת קֹרַח:", "onk_en": "These are the sons of Oholivomoh, the daughter of Anoh, the daughter of Tzivon, the wife of Eisov; she bore to Eisov: Ye’ush, Yalom and Korach.", "pj": "וְאִילֵן הֲווֹ בְּנֵי אָהֳלִיבָמָה בְּרַת עֲנָה בְּרַת צִבְעוֹן אִיתַּת עֵשָו וִילֵידַת לְעֵשָו יַת יְעוּשׁ וְיַת יַעְלָם וְיַת קרַח", "pj_en": "And these are the sons of Ahalibama the daughter of Anah the daughter of Sebeon wife of Esau; and she bare to Esau, Jehus, and Jaalam, and Korach.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 15, "aliyah": 6, "heb": "אֵ֖לֶּה אַלּוּפֵ֣י בְנֵֽי־עֵשָׂ֑ו בְּנֵ֤י אֱלִיפַז֙ בְּכ֣וֹר עֵשָׂ֔ו אַלּ֤וּף תֵּימָן֙ אַלּ֣וּף אוֹמָ֔ר אַלּ֥וּף צְפ֖וֹ אַלּ֥וּף קְנַֽז׃", "onk": "אִלֵּין רַבְרְבֵי בְּנֵי עֵשָׂו בְּנֵי אֱלִיפַז בּוּכְרָא דְעֵשָׂו רַבָּא תֵימָן רַבָּא אוֹמָר רַבָּא צְפוֹ רַבָּא קְנַז:", "onk_en": "These are the chiefs of the sons of Eisov: the sons of Eliphaz, Eisov’s first born: Chief Teiman, Chief Omar, Chief Tzepho, Chief Kenaz.", "pj": "אִלֵין רַבְרְבֵי בְּנֵי עֵשָו בְּנֵי אֱלִיפַז בּוּכְרֵיהּ דְעֵשָו רַבָּא תֵימָן רַבָּא אוֹמָר רַבָּא צְפוֹ רַבָּא קְנַז", "pj_en": "These are the chieftains of the sons of Esau; the sons of Eliphaz, the first--born of Esau, Rabba Teman, Rabba Omar, Rabba Zephu, Rabba Kenaz,", "tj": "", "tj_en": "", "rashi": "<b>אלה אלופי בני עשו.<\/b> רָאשֵׁי מִשְׁפָּחוֹת:", "rashi_en": "אלה אלופי בני עשו THESE WERE CHIEFTAINS OF THE SONS OF ESAU — Heads of families. "}, {"ch": 36, "v": 16, "aliyah": 6, "heb": "אַלּֽוּף־קֹ֛רַח אַלּ֥וּף גַּעְתָּ֖ם אַלּ֣וּף עֲמָלֵ֑ק אֵ֣לֶּה אַלּוּפֵ֤י אֱלִיפַז֙ בְּאֶ֣רֶץ אֱד֔וֹם אֵ֖לֶּה בְּנֵ֥י עָדָֽה׃", "onk": "רַבָּא קֹרַח רַבָּא גַעְתָּם רַבָּא עֲמָלֵק אִלֵּין רַבְרְבֵי דֶאֱלִיפַז בְּאַרְעָא דֶאֱדוֹם אִלֵּין בְּנֵי עָדָה:", "onk_en": "Chief Korach, Chief Gatam, Chief Amaleik. These are the chiefs of Eliphaz in the land of Edom. These are the sons of Adah.", "pj": "רַבָּא קרַח רַבָּא גַעְתָּם רַבָּא עֲמָלֵק אִלֵין רַבְרְבֵי אֱלִיפַז דִמְדוֹרְהוֹן בְּאַרְעָא דֶאֱדוֹם אִלֵין בְּנֵי עָדָה", "pj_en": "Rabba Korach, Rabba Gaatam, Rabba Amalek: these are the chieftains of Eliphaz, whose habitation was in the land of Edom; they are the sons of Adah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 17, "aliyah": 6, "heb": "וְאֵ֗לֶּה בְּנֵ֤י רְעוּאֵל֙ בֶּן־עֵשָׂ֔ו אַלּ֥וּף נַ֙חַת֙ אַלּ֣וּף זֶ֔רַח אַלּ֥וּף שַׁמָּ֖ה אַלּ֣וּף מִזָּ֑ה אֵ֣לֶּה אַלּוּפֵ֤י רְעוּאֵל֙ בְּאֶ֣רֶץ אֱד֔וֹם אֵ֕לֶּה בְּנֵ֥י בָשְׂמַ֖ת אֵ֥שֶׁת עֵשָֽׂו׃", "onk": "וְאִלֵּין בְּנֵי רְעוּאֵל בַּר עֵשָׂו רַבָּא נַחַת רַבָּא זֶרַח רַבָּא שַׁמָּה רַבָּא מִזָּה אִלֵּין רַבְרְבֵי רְעוּאֵל בְּאַרְעָא (דֶ)אֱדוֹם אִלֵּין בְּנֵי בָשְׂמַת אִתַּת עֵשָׂו:", "onk_en": "These are the sons of Reu’eil, Eisov’s son: Chief Nachas, Chief Zerach. Chief Shamoh, Chief Mizzoh. These are the Chiefs of Reu’eil in the land of Edom. These are sons of Bosmas, wife of Eisov.", "pj": "וְאִלֵין בְּנֵי רְעוּאֵל בַּר עֵשָו רַבָּא נַחַת רַבָּא זֶרַח רַבָּא שַׁמָה רַבָּא מִזָה אִלֵין רַבְרְבֵי רְעוּאֵל דִמְדוֹרְהוֹן בְּאַרְעָא דֶאֱדוֹם אִלֵין בְּנֵי בָשְמַת אִיתַּת עֵשָו", "pj_en": "And these are the sons of Reuel bar Esau; Rabba Nachath, Rabba Zerach,, Rabba Shammah, Rabba Mizzah; these are the chieftains of Reuel, whose habitation was in the land of Edom. These are the sons of Basemath wife of Esau.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 18, "aliyah": 6, "heb": "וְאֵ֗לֶּה בְּנֵ֤י אׇהֳלִֽיבָמָה֙ אֵ֣שֶׁת עֵשָׂ֔ו אַלּ֥וּף יְע֛וּשׁ אַלּ֥וּף יַעְלָ֖ם אַלּ֣וּף קֹ֑רַח אֵ֣לֶּה אַלּוּפֵ֞י אׇהֳלִֽיבָמָ֛ה בַּת־עֲנָ֖ה אֵ֥שֶׁת עֵשָֽׂו׃", "onk": "וְאִלֵּין בְּנֵי אָהֳלִיבָמָה אִתַּת עֵשָׂו רַבָּא יְעוּשׁ רַבָּא יַעְלָם רַבָּא קֹרַח אִלֵּין רַבְרְבֵי אָהֳלִיבָמָה בַּת עֲנָה אִתַּת עֵשָׂו:", "onk_en": "These are the sons of Oholivomoh, wife of Eisov: Chief Ye’ush, Chief Yalom, Chief Korach. These are the Chiefs of Oholivomoh, daughter of Anoh, wife of Eisov.", "pj": "וְאִלֵין בְּנֵי אָהֳלִיבָמָה אִיתַּת עֵשָו רַבָּא יְעוּשׁ רַבָּא יַעְלָם רַבָּא קרַח אִלֵין רַבְרְבֵי אָהֳלִיבָמָה בְּרַת עֲנָה אִיתַּת עֵשָו", "pj_en": "And these are the sons of Ahalibama wife of Esau; Rabba Jeush, Rabba Jaalam, Rabba Korach; these are the chieftains of Ahalibama, daughter of Adah wife of Esau.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 19, "aliyah": 6, "heb": "אֵ֧לֶּה בְנֵי־עֵשָׂ֛ו וְאֵ֥לֶּה אַלּוּפֵיהֶ֖ם ה֥וּא אֱדֽוֹם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין בְּנֵי עֵשָׂו וְאִלֵּין רַבְרְבָנֵיהוֹן הוּא אֱדוֹם:", "onk_en": "These are the sons of Eisov, and these are their chiefs, he is Edom.", "pj": "אִלֵין בְּנֵי עֵשָו וְאִלֵין רַבְרְבָנֵהוֹם הוּא אַבָּא דֶאֱדוֹמָאֵי", "pj_en": "These are the sons of Esau, and these their chieftains. He is the father of the Edomites.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 20, "aliyah": 7, "heb": "אֵ֤לֶּה בְנֵֽי־שֵׂעִיר֙ הַחֹרִ֔י יֹשְׁבֵ֖י הָאָ֑רֶץ לוֹטָ֥ן וְשׁוֹבָ֖ל וְצִבְע֥וֹן וַעֲנָֽה׃", "onk": "אִלֵּין בְּנֵי שֵׂעִיר חוֹרָאָה יָתְבֵי דְּאַרְעָא לוֹטָן וְשׁוֹבָל וְצִבְעוֹן וַעֲנָה:", "onk_en": "These are the sons of Se’ir, the Chorite, the inhabitants of the land: Lotan, Shoval, Tzivon, and Anoh.", "pj": "אִלֵין בְּנוֹי דִגְבַל גְנוּסַיָא דִמְקַדְמַת דְנָא הֲווֹן יַתְבֵי אַרְעָא הַהוּא לוֹטָן וְשׁוֹבָל וְצִבְעוֹן וַעֲנָה", "pj_en": "These are the sons of Gebal, the generations who before that had dwelt in that land: Lotan, and Shobal, and Sebeon, and Anah,", "tj": "", "tj_en": "", "rashi": "<b>ישבי הארץ.<\/b> שֶׁהָיוּ יוֹשְׁבֶיהָ קֹדֶם שֶׁבָּא עֵשָׂו לְשָׁם. וְרַבּוֹתֵינוּ דָּרְשׁוּ (שבת פ\"ה) שֶׁהָיוּ בְּקִיאִין בְּיִשּׁוּבָהּ שֶׁל אֶרֶץ; מְלֹא קָנֶה זֶה לְזֵיתִים, מְלֹא קָנֶה זֶה לִגְפָנִים, שֶׁהָיוּ טוֹעֲמִין הֶעָפָר וְיוֹדְעִין אֵי זוֹ נְטִיעָה רְאוּיָה לוֹ:", "rashi_en": "ישבי הארץ THE INHABITANTS OF THE LAND — i.e. who had been its inhabitants before Esau came there. Our Rabbis explained (Shabbat 85b) that they are called  יושבי הארץ because they were experts in making the land habitable (by skillful cultivation) saying: this entire rood of ground is suitable for planting olives, that entire rood for vines — because they tasted the soil and so discovered what was suitable for planting in it. "}, {"ch": 36, "v": 21, "aliyah": 7, "heb": "וְדִשׁ֥וֹן וְאֵ֖צֶר וְדִישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַחֹרִ֛י בְּנֵ֥י שֵׂעִ֖יר בְּאֶ֥רֶץ אֱדֽוֹם׃", "onk": "וְדִשׁוֹן וְאֵצֶר וְדִישָׁן אִלֵּין רַבְרְבֵי חוֹרָאֵי בְּנֵי שֵׂעִיר בְּאַרְעָא דֶאֱדוֹם:", "onk_en": "Dishon, Eitzer and Dishan, these are the chiefs of the Chorites, the sons of Se’ir, in the land of Edom.", "pj": "וְדִשׁוֹן וְאֵצֶר וְדִישָׁן אִלֵין רַבְרְבֵי גִינוּסַיָא בְּנוֹי דִגְבַל דִמְדוֹרְהוֹן מִן עַלְמִין בְּאַרְעָא אֱדוֹמָאֵי", "pj_en": "and Dishon, and Etser, and Dishon. These are the chieftains of the generations of the sons of Gebal, whose habitation was of old in the land of the Edomites.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 22, "aliyah": 7, "heb": "וַיִּהְי֥וּ בְנֵי־לוֹטָ֖ן חֹרִ֣י וְהֵימָ֑ם וַאֲח֥וֹת לוֹטָ֖ן תִּמְנָֽע׃", "onk": "וַהֲווֹ בְנֵי לוֹטָן חוֹרִי וְהֵימָם וַאֲחָתֵיהּ דְּלוֹטָן תִּמְנָע:", "onk_en": "The sons of Lotan were Chori and Heimam. Lotan’s sister was Timna.", "pj": "וַהֲווֹ בְּנֵי לוֹטָן חוֹרִי וְהֵימָם וַאֲחָתֵיהּ דְלוֹטָן תִּמְנָע", "pj_en": "And the sons of Lotan were the Chori and Heman; and the sister of Lotan was Timna.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 23, "aliyah": 7, "heb": "וְאֵ֙לֶּה֙ בְּנֵ֣י שׁוֹבָ֔ל עַלְוָ֥ן וּמָנַ֖חַת וְעֵיבָ֑ל שְׁפ֖וֹ וְאוֹנָֽם׃", "onk": "וְאִלֵּין בְּנֵי שׁוֹבָל עַלְוָן וּמָנַחַת וְעֵיבָל שְׁפוֹ וְאוֹנָם:", "onk_en": "These are the sons of Shoval: Alvan, Manachas, Eival, Shefo and Onom.", "pj": "וְאִלֵין בְּנֵי שׁוֹבָל עַלְוָן וּמָנַחַת וְעֵיבָל שְׁפוֹ וְאוֹנָם", "pj_en": "And these are the sons of Shobal, Alvan, and Manachoth, and Ebal, Shepho, and Onam.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 24, "aliyah": 7, "heb": "וְאֵ֥לֶּה בְנֵֽי־צִבְע֖וֹן וְאַיָּ֣ה וַעֲנָ֑ה ה֣וּא עֲנָ֗ה אֲשֶׁ֨ר מָצָ֤א אֶת־הַיֵּמִם֙ בַּמִּדְבָּ֔ר בִּרְעֹת֥וֹ אֶת־הַחֲמֹרִ֖ים לְצִבְע֥וֹן אָבִֽיו׃", "onk": "וְאִלֵּין בְּנֵי צִבְעוֹן וְאַיָּה וַעֲנָה הוּא עֲנָה דִּי אַשְׁכַּח יָת <b>גִּבָּרַיָּא<\/b> בְּמַדְבְּרָא כַּד הֲוָה רָעֵי יָת חֲמָרַיָּא לְצִבְעוֹן אֲבוּהִי:", "onk_en": "These are the sons of Tzivon: Ayoh and Anoh. He is the same Anoh who found the mules [<b>mighty ones<\/b>] in the desert while tending the donkeys for his father, Tzivon.", "pj": "וְאִלֵין בְּנֵי צִבְעוֹן וְאַיָה וַעֲנָה הוּא עֲנָה דְאַרְבַּע יַת עֶדְרַיָא [צ\"ל ערוציה] עִם אַתְנִי וְלִזְמַן אַשְׁכַּח יַת כּוּדְנַיְיתָא דִי נְפָקוּ מִנְהוֹן כַּד הֲוָה רָעֵי יַת חַמְרַיָיא לְצִבְעוֹן אָבוּי", "pj_en": "And these are the sons of Sebeon, Aja and Anah: he is Anah who coupled the onagers with the she--asses, and after a time found mules which had come forth from them, when he was tending the asses of Sebeon his father.", "tj": "", "tj_en": "", "rashi": "<b>ואיה וענה.<\/b> וָי\"ו יְתֵרָה, וְהוּא כְּמוֹ אַיָּה וַעֲנָה, וְהַרְבֵּה יֵשׁ בַּמִּקְרָא, תֵּת וְקֹדֶשׁ וְצָבָא מִרְמָס (דניאל ח'), נִרְדָּם וְרֶכֶב וָסוּס (תהילים ע\"ו):<br><br><b>הוא ענה.<\/b> הָאָמוּר לְמַעְלָה שֶׁהוּא אָחִיו שֶׁל צִבְעוֹן וְכָאן הוּא קוֹרֵא אוֹתוֹ בְּנוֹ? מְלַמֵּד שֶׁבָּא צִבְעוֹן עַל אִמּוֹ וְהוֹלִיד אֶת עֲנָה:<br><br><b>את הימם.<\/b> פְּרָדִים, הִרְבִּיעַ חֲמוֹר עַל סוּס נְקֵבָה וְיָלְדָה פֶּרֶד, וְהוּא הָיָה מַמְזֵר וְהֵבִיא פְסוּלִין לָעוֹלָם; וְלָמָּה נִקְרָא שְׁמָם יֵמִים? שֶׁאֵימָתָן מֻטֶּלֶת עַל הַבְּרִיּוֹת, דְּאָמַר רַבִּי חֲנִינָא מִיָּמַי לֹא שְׁאָלַנִי אָדָם עַל מַכַּת פִּרְדָּה לְבָנָה וְחָיָה (חולין ז') (וַהֲלֹא קָא חֲזִינָן דְּחָיָה? אַל תִּקְרֵי וְחָיָה אֶלָּא וְחָיְתָה, כִּי הַמַּכָּה לֹא תֵּרָפֵא לְעוֹלָם, בְרַשִׁ\"י יָשָׁן) וְלֹא הֻזְקַק לִכְתֹּב לָנוּ מִשְׁפְּחוֹת הַחוֹרִי אֶלָּא מִפְּנֵי תִּמְנָע, וּלְהוֹדִיעַ גְּדֻלַּת אַבְרָהָם, כְּמוֹ שֶׁפֵּרַשְׁתִּי לְמַעְלָה:", "rashi_en": "ואיה וענה literally, AND AJAH AND ANAH — The ו in ואיה is redundant, so that the words are equivalent to איה וענה Ajah and Anah. There are many examples of this in Biblical Hebrew: (Daniel 8:13) “to give (וקדש וצבא) both the Sanctuary and the host to be trampled underfoot”; (Psalms 86:7) “they are cast into a deep sleep (ורכב וסוס) the riders also and the horses”.<br><br>הוא ענה THIS WAS THAT ANAH mentioned above (Genesis 36:20) as the brother of Zibeon. Here is called his son, thus telling us that Zibeon and his own mother were the parents of Anah (Pesachim 54a).<br><br>את הימים means THE MULES — He crossed an ass and a mare, the offspring being a mule. Being himself the offspring of an unnatural union he reared such in the animal world (Pesachim 54a). Why are they called ימים (which may signify “dreaded beings”)? Because the fear of them lies upon people; for R. Hanina said, “No-one has ever consulted me about an injury caused by a white mule and has recovered (וחיה literally, lived)”. “But do we not see that such a person has recovered (lived)? But you should not read וחיה “and he lived”, but וחיתה “and it (the wound) healed up” — for such a wound never heals up (Chullin 7b). From “But do we not see\" is to be found in an old text of Rashi. It would have been unnecessary to write the genealogy of the Horites had it not been that it wishes to mention Timna, thereby showing in what importance Abraham was held, as I have explained above (Genesis 5:12). "}, {"ch": 36, "v": 25, "aliyah": 7, "heb": "וְאֵ֥לֶּה בְנֵֽי־עֲנָ֖ה דִּשֹׁ֑ן וְאׇהֳלִיבָמָ֖ה בַּת־עֲנָֽה׃", "onk": "וְאִלֵּין בְּנֵי עֲנָה דִּשֹׁן וְאָהֳלִיבָמָה בַּת עֲנָה:", "onk_en": "These are the children of Anoh: Dishon, and Oholivomoh the daughter of Anoh.", "pj": "וְאִלֵין בְּנֵי עֲנָה דִשוֹן וְאָהֳלִיבָמָה בַּת עֲנָה", "pj_en": "And these are the children of Anah: Dishon; and Ahalibama was the daughter of Anah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 26, "aliyah": 7, "heb": "וְאֵ֖לֶּה בְּנֵ֣י דִישָׁ֑ן חֶמְדָּ֥ן וְאֶשְׁבָּ֖ן וְיִתְרָ֥ן וּכְרָֽן׃", "onk": "וְאִלֵּין בְּנֵי דִישָׁן חֶמְדָּן וְאֶשְׁבָּן וְיִתְרָן וּכְרָן:", "onk_en": "These are the sons of Dishon: Chemdan, Eshban, Yisran and Keran.", "pj": "וְאִלֵין בְּנֵי דִישָׁן חֶמְדָן וְאֶשְׁבָּן וְיִתְרָן וּכְרָן", "pj_en": "And these are the sons of Dishon, Hemdan, and Jisban, and Jithran, and Keran.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 27, "aliyah": 7, "heb": "אֵ֖לֶּה בְּנֵי־אֵ֑צֶר בִּלְהָ֥ן וְזַעֲוָ֖ן וַעֲקָֽן׃", "onk": "אִלֵּין בְּנֵי אֵצֶר בִּלְהָן וְזַעֲוָן וַעֲקָן:", "onk_en": "These are the sons of Eitzer: Bilhan, Za’avan and Akan.", "pj": "אִלֵין בְּנֵי אֵצֶר בִּלְהָן וְזַעֲוָן וַעֲקָן", "pj_en": "These are the sons of Etser, Bilhan, and Zaavan, and Akan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 28, "aliyah": 7, "heb": "אֵ֥לֶּה בְנֵֽי־דִישָׁ֖ן ע֥וּץ וַאֲרָֽן׃", "onk": "אִלֵּין בְּנֵי דִישָׁן עוּץ וַאֲרָן:", "onk_en": "These are the sons of Dishon: Utz and Aran.", "pj": "אִלֵין בְּנֵי דִישָׁן עוּץ וַאֲרָן", "pj_en": "These are the sons of Dishan, Hutz and Aram.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 29, "aliyah": 7, "heb": "אֵ֖לֶּה אַלּוּפֵ֣י הַחֹרִ֑י אַלּ֤וּף לוֹטָן֙ אַלּ֣וּף שׁוֹבָ֔ל אַלּ֥וּף צִבְע֖וֹן אַלּ֥וּף עֲנָֽה׃", "onk": "אִלֵּין רַבְרְבֵי חוֹרָאָה רַבָּא לוֹטָן רַבָּא שׁוֹבָל רַבָּא צִבְעוֹן רַבָּא עֲנָה:", "onk_en": "These are the chiefs of the Chorites: Chief Lotan, Chief Shoval, Chief Tzivon, Chief Anoh.", "pj": "אִלֵין רַבְרְבֵי גְנוּסְיָא רַבָּא לוֹטָן רַבָּא שׁוֹבָל רַבָּא צִבְעוֹן רַבָּא עֲנָה", "pj_en": "These are the chieftains of the families: Rabba Lotan, Rabba Shobal, Rabba Sebeon, Rabba Anah,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 30, "aliyah": 7, "heb": "אַלּ֥וּף דִּשֹׁ֛ן אַלּ֥וּף אֵ֖צֶר אַלּ֣וּף דִּישָׁ֑ן אֵ֣לֶּה אַלּוּפֵ֧י הַחֹרִ֛י לְאַלֻּפֵיהֶ֖ם בְּאֶ֥רֶץ שֵׂעִֽיר׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "רַבָּא דִשֹׁן רַבָּא אֵצֶר רַבָּא דִישָׁן אִלֵּין רַבְרְבֵי חוֹרָאָה לְרַבְרְבָנֵיהוֹן בְּאַרְעָא דְשֵׂעִיר:", "onk_en": "Chief Dishon, Chief Eitzer, Chief Dishan. These are the chiefs of the Chorites based on the ranks of chiefs in the Land of Se’ir.", "pj": "רַבָּא דִשׁוֹן רַבָּא אֵצֶר רַבָּא דִישָׁן אִלֵין רַבְרְבֵי גִנוּסַיָא לְרַבְרְבָנֵיהוֹם דִמְדוֹרְהוֹם מִן קַדְמַת דְנָא בְּאַרְעָא דְגַבְלָא", "pj_en": "Rabba Dishon, Rabba Etser, Rabba Dishan: these are the chieftains of the families, according to their principalities, whose habitation was of old in the land of Gabla.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 31, "aliyah": 7, "heb": "וְאֵ֙לֶּה֙ הַמְּלָכִ֔ים אֲשֶׁ֥ר מָלְכ֖וּ בְּאֶ֣רֶץ אֱד֑וֹם לִפְנֵ֥י מְלׇךְ־מֶ֖לֶךְ לִבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְאִלֵּין מַלְכַיָּא דִּי מְלִיכוּ בְּאַרְעָא דֶאֱדוֹם קֳדָם דִּי מְלַךְ מַלְכָּא לִבְנֵי יִשְׂרָאֵל:", "onk_en": "These are the kings who reigned in the Land of Edom before any king reigned over the Children of Israel.", "pj": "וְאִלֵין מַלְכַיָיא דִי מְלָכוּ בְּאַרְעָא דְאֱדוֹם קֳדָם עַד לָא מְלָךְ מַלְכָּא לִבְנֵי יִשְרָאֵל", "pj_en": "These are the kings who reigned in the land of Edom before any king reigned over the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ואלה המלכים וגו'.<\/b> שְׁמוֹנָה הָיוּ וּכְנֶגְדָּן הֶעֱמִיד יַעֲקֹב וּבִטֵּל מַלְכוּת עֵשָׂו בִּימֵיהֶם, אֵלּוּ הֵן, שָׁאוּל וְאִישׁ בֹּשֶׁת, דָּוִד וּשְׁלֹמֹה, רְחַבְעָם, אֲבִיָּה, אָסָא, יְהוֹשָׁפָט; וּבִימֵי יוֹרָם בְּנוֹ כָּתוּב בְּיָמָיו פָּשַׁע אֱדוֹם מִתַּחַת יַד יְהוּדָה וַיַּמְלִכוּ עֲלֵיהֶם מֶלֶךְ (מלכים ב ח'), וּבִימֵי שָׁאוּל כָּתוּב וּמֶלֶךְ אֵין בֶּאֱדוֹם נִצָּב מֶלֶךְ (מלכים א כ\"ב):", "rashi_en": "’ואלה המלכים וגו AND THESE ARE THE KINGS etc. — There were eight and Jacob raised an equal number in whose days the kingdom of Esau temporarily ceased to exist, viz., Saul, Ishbosheth, David, Solomon, Rehoboam, Asa, Abiah and Jehoshaphat. For of the days of Yoram his (Jehoshaphat’s) son it is written, (2 Kings 8:20) “In his days Edom revolted from under the hand of Judah and made a king over themselves”, whereas in the days of Jehoshaphat it is written, (1 Kings 22:48) “And there was no king in Edom: a deputy was king”."}, {"ch": 36, "v": 32, "aliyah": 7, "heb": "וַיִּמְלֹ֣ךְ בֶּאֱד֔וֹם בֶּ֖לַע בֶּן־בְּע֑וֹר וְשֵׁ֥ם עִיר֖וֹ דִּנְהָֽבָה׃", "onk": "וּמְלַךְ בֶּאֱדוֹם בֶּלַע בַּר בְּעוֹר וְשׁוּם קַרְתֵּיהּ דִּנְהָבָה:", "onk_en": "Bela, son of Be’or reigned in Edom, and the name of his city was Dinhavah.", "pj": "וּמְלַךְ בֶּאֱדוֹם בֶּלַע בַּר בְּעוֹר וְשׁוּם קַרְתָּא דְבֵית מַלְכוּתֵיהּ דִנְהָבָא", "pj_en": "In Edom reigned Bileam. the son of Behor, and the name of the city of the house of his kingdom was Dinhaba.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 33, "aliyah": 7, "heb": "וַיָּ֖מׇת בָּ֑לַע וַיִּמְלֹ֣ךְ תַּחְתָּ֔יו יוֹבָ֥ב בֶּן־זֶ֖רַח מִבׇּצְרָֽה׃", "onk": "וּמִית בָּלַע וּמְלַךְ תְּחוֹתוֹהִי יוֹבָב בַּר זֶרַח מִבָּצְרָה:", "onk_en": "Bela died, and he was succeeded as king by Yovav, son of Zerach, from Botzroh.", "pj": "וּמִית בֶּלַע וּמְלַךְ תְּחוֹתוֹי יוֹבָב בַּר זֶרַח מִבָּצְרָה", "pj_en": "And Bela died, and in his stead reigned Jobab the son of Zerach of Botsra.", "tj": "", "tj_en": "", "rashi": "<b>יובב בן זרח מבצרה.<\/b> בָּצְרָה מֵעָרֵי מוֹאָב הִיא, שֶׁנֶּאֱמַר וְעַל קְרִיּוֹת וְעַל בָּצְרָה וגו' (ירמיהו מ\"ח); וּלְפִי שֶׁהֶעֱמִידָה מֶלֶךְ לֶאֱדוֹם, עֲתִידָה לִלְקוֹת עִמָּהֶם, שֶׁנֶּאֱמַר כִּי זֶבַח לַה' בְּבָצְרָה (ישעיהו ל\"ד):", "rashi_en": "יובב בן זרח מבצרה JOBAB, THE SON OF ZERAH OF BOZRAH — Bozrah was one of the Moabite cities, as it is said (Jeremiah 48:24 which chapter is a prophecy against Moab), “[Judgment is come upon…] and upon Keriath and upon Bozrah etc.” Because it produced a king for Edom it is to be smitten together with them (the Edomites), as it is said (Isaiah 34:6) “For the Lord hath a slaughtering in Bozrah, [and a great slaughter in the Land of Edom]’ (Genesis Rabbah 83:3). "}, {"ch": 36, "v": 34, "aliyah": 7, "heb": "וַיָּ֖מׇת יוֹבָ֑ב וַיִּמְלֹ֣ךְ תַּחְתָּ֔יו חֻשָׁ֖ם מֵאֶ֥רֶץ הַתֵּימָנִֽי׃", "onk": "וּמִית יוֹבָב וּמְלַךְ תְּחוֹתוֹהִי חֻשָׁם מֵאַרְעָא <b>דָרוֹמָא<\/b>:", "onk_en": "Yovav died, and he was succeeded as king by Chusham from the land of the Teimanites [<b>South<\/b>].", "pj": "וּמִית יוֹבָב וּמְלַךְ תְּחוֹתוֹי חוּשָׁם מֵאַרַע דָרוֹמָא", "pj_en": "And Jobab died, and in his stead reigned Husham of the South country;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 35, "aliyah": 7, "heb": "וַיָּ֖מׇת חֻשָׁ֑ם וַיִּמְלֹ֨ךְ תַּחְתָּ֜יו הֲדַ֣ד בֶּן־בְּדַ֗ד הַמַּכֶּ֤ה אֶת־מִדְיָן֙ בִּשְׂדֵ֣ה מוֹאָ֔ב וְשֵׁ֥ם עִיר֖וֹ עֲוִֽית׃", "onk": "וּמִית חֻשָׁם וּמְלַךְ תְּחוֹתוֹהִי הֲדַד בַּר בְּדַד <b>דִּקְטִיל<\/b> <b>יָת מִדְיָנָאֵי<\/b> בְּחַקְלָא דְמוֹאָב וְשׁוּם קַרְתֵּיהּ עֲוִית:", "onk_en": "Chusham died, and he was succeeded as king by Hadad, son of Bedad, who attacked [<b>killed<\/b>] Midian [<b>the Midianites<\/b>] in the field of Moav, and the name of his city was Avis.", "pj": "וּמִית חוּשָׁם וּמְלַךְ תְּחוֹתוֹי הֲדַד בַּר בְּדַד דִקְטַל יַת מִדְיָנָאֵי בְּסַדְרוּתֵיהּ עִמְהוֹן קְרָבָא בְּחַקְלֵי מוֹאָב וְשׁוּם קַרְתָּא דְבֵית מַלְכוּתֵיהּ עֲוִית", "pj_en": "and Husham died, and in his stead reigned Hadad the son of Bedad, who slew the Midianites when he arrayed war with them in the fields of Moab, and the name of the city of the house of his kingdom was Avith.", "tj": "", "tj_en": "", "rashi": "<b>המכה את מדין בשדה מואב.<\/b> שֶׁבָּאוּ מִדְיָן עַל מוֹאָב לַמִּלְחָמָה, וְהָלַךְ מֶלֶךְ אֱדוֹם לַעֲזֹר אֶת מוֹאָב; וּמִכָּאן אָנוּ לְמֵדִים, שֶׁהָיוּ מִדְיָן וּמוֹאָב מְרִיבִים זֶה עִם זֶה, וּבִימֵי בִלְעָם עָשׂוּ שָׁלוֹם לְהִתְקַשֵּׁר עַל יִשְׂרָאֵל:", "rashi_en": "המכה את מדין בשדה מואב WHO SMOTE MIDIAN IN THE FIELD OF MOAB — for Midian came to war against Moab and the king of Edom went to assist Moab. From here we learn that although Midian and Moab were at strife one with the other yet in the time of Balaam they made peace in order to band themselves against Israel (Midrash Tanchuma, Balak 3)."}, {"ch": 36, "v": 36, "aliyah": 7, "heb": "וַיָּ֖מׇת הֲדָ֑ד וַיִּמְלֹ֣ךְ תַּחְתָּ֔יו שַׂמְלָ֖ה מִמַּשְׂרֵקָֽה׃", "onk": "וּמִית הֲדָד וּמְלַךְ תְּחוֹתוֹהִי שַׂמְלָה מִמַּשְׂרֵקָה:", "onk_en": "Hadad died, and he was succeeded as king by Samlah of Masriekah.", "pj": "וּמִית הֲדָד וּמְלַךְ תְּחוֹתֵיהּ שַמְלָה מִמַשְרֵקָה", "pj_en": "And Hadad died, and in his stead reigned Simlah of Masrekah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 37, "aliyah": 7, "heb": "וַיָּ֖מׇת שַׂמְלָ֑ה וַיִּמְלֹ֣ךְ תַּחְתָּ֔יו שָׁא֖וּל מֵרְחֹב֥וֹת הַנָּהָֽר׃", "onk": "וּמִית שַׂמְלָה וּמְלַךְ תְּחוֹתוֹהִי שָׁאוּל מֵרְחוֹבֵי דְעַל <b>פְּרָת<\/b>:", "onk_en": "Samlah died, and he was succeeded as king by Sha’ul from Rechovos-by-the-river [<b>P’ras<\/b>].", "pj": "וּמִית שַמְלָה וּמְלַךְ תְּחוֹתוֹי שָׁאוּל דְמִן רְחוֹבוֹת דְעַל פְּרָת", "pj_en": "And Simlah died, and instead of him reigned Shaul, who was of Rohoboth on the Pherat.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 38, "aliyah": 7, "heb": "וַיָּ֖מׇת שָׁא֑וּל וַיִּמְלֹ֣ךְ תַּחְתָּ֔יו בַּ֥עַל חָנָ֖ן בֶּן־עַכְבּֽוֹר׃", "onk": "וּמִית שָׁאוּל וּמְלַךְ תְּחוֹתוֹהִי בַּעַל חָנָן בַּר עַכְבּוֹר:", "onk_en": "Sha’ul died, and he was succeeded as king by Ba’al-Chanan, son of Achbor.", "pj": "וּמִית שָׁאוּל וּמְלַךְ תְּחוֹתוֹי בַּעַל חָנָן בַּר עַכְבּוֹר", "pj_en": "And Shaul died, and in his stead reigned Baal Hanan bar Akbor.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 39, "aliyah": 7, "heb": "וַיָּ֘מׇת֮ בַּ֣עַל חָנָ֣ן בֶּן־עַכְבּוֹר֒ וַיִּמְלֹ֤ךְ תַּחְתָּיו֙ הֲדַ֔ר וְשֵׁ֥ם עִיר֖וֹ פָּ֑עוּ וְשֵׁ֨ם אִשְׁתּ֤וֹ מְהֵֽיטַבְאֵל֙ בַּת־מַטְרֵ֔ד בַּ֖ת מֵ֥י זָהָֽב׃", "onk": "וּמִית בַּעַל חָנָן בַּר עַכְבּוֹר וּמְלַךְ תְּחוֹתוֹהִי הֲדַר וְשׁוּם קַרְתֵּיהּ פָּעוּ וְשׁוּם אִתְּתֵיהּ מְהֵיטַבְאֵל בַּת מַטְרֵד בַּת <b>מְצָרֵף דַּהֲבָא<\/b>:", "onk_en": "Ba’al-Chanan, son of Achbor died, and he was succeeded as king by Hadar. The name of his city was Pa’u. His wife’s name was Meheitaveil, the daughter of Matreid, daughter of Mei-Zahav [<b>a goldsmith<\/b>].", "pj": "וּמִית בַּעַל חָנָן בַּר עַכְבּוֹר וּמְלַךְ תְּחוֹתוֹי הֲדַר וְשׁוּם קַרְתָּא דְבֵית מַלְכוּתֵיהּ פָּעוּ וְשׁוּם אִנְתְּתֵיהּ מְהֵיטַבְאֵל בְּרַת מַטְרֵד הוּא גַבְרָא דַהֲוָה לָעֵי בְּמַטְרְדָה וּבְסַרְדִיתָא וּמִן דְעָתַר וְקָנָה נִכְסִין הֲדַר לְמֶהֱוֵי מִתְגָאֶה בְּלִבֵּיהּ לְמֵימָר מַאן הוּא כַּסְפָּא וּמָאן הוּא דַהֲבָא", "pj_en": "And Baal Hanan bar Akbor died, and instead of him reigned Hadar; and the name of the city of the house of his kingdom was Pahu; and the name of his wife was Mehetabel the daughter of Matred. He was the man who laboured with perseverance and vigilance, and who, after he had become wealthy and had gotten riches, turned to become more lofty in his heart, saying What is silver and what is gold?", "tj": "וּמְלַךְ מִן בַּתְרֵיהּ הֲדַר וּשְׁמָה דְקַרְתֵּיהּ פָּעוּ וְשׁוּם דְאִתְּתֵיהּ מְהֵיטַבְאֵל בַּת מַטְרֵד בְּרַתָּא דִמְצַרֵף דַהֲבָא גַבְרָא דַהֲוָה לָעִי בְּמִטְרְדָה כָּל יוֹמֵי חַיוֹהִי מִן בָּתַר דַאֲכָל וְשָבָע חָזַר וַאֲמַר מַה הוּא דַהֲבָא וּמַה הוּא כַסְפָּא:", "tj_en": "And after him reigned Hadar; and the name of his city was Pahu, andthe daughter of Matred, the daughter of the changer of gold: the man who perseverance all the days of his life; but who, after he had eaten and was satisfied, converted and said, What is gold, and what is silver?", "rashi": "<b>בת מי זהב.<\/b> מַהוּ זָהָב? עָשִׁיר הָיָה, וְאֵין זָהָב חָשׁוּב בְּעֵינָיו לִכְלוּם:", "rashi_en": "בת מי זהב THE DAUGHTER OF ME-ZAHAB — meaning מהו זהב what value has gold? He was so rich that gold had no value in his eyes (Genesis Rabbah 83:4). "}, {"ch": 36, "v": 40, "aliyah": 7, "heb": "וְ֠אֵ֠לֶּה שְׁמ֞וֹת אַלּוּפֵ֤י עֵשָׂו֙ לְמִשְׁפְּחֹתָ֔ם לִמְקֹמֹתָ֖ם בִּשְׁמֹתָ֑ם אַלּ֥וּף תִּמְנָ֛ע אַלּ֥וּף עַֽלְוָ֖ה אַלּ֥וּף יְתֵֽת׃", "onk": "וְאִלֵּין שְׁמָהַת רַבְרְבֵי עֵשָׂו לְזַרְעֲיָתְהוֹן לְאַתְרֵיהוֹן בִּשְׁמָהָתְהוֹן רַבָּא תִמְנָע רַבָּא עַלְוָה רַבָּא יְתֵת:", "onk_en": "These are the names of the chiefs of Eisov, each with their families, according to their places, by their names: Chief Timna, Chief Alvoh, Chief Yeseis.", "pj": "וְאִלֵין שְׁמָהַת רַבְרְבֵי עֵשָו לְיִחוּסֵיהוֹן לְאָתַר מְדוֹרֵיהוֹן בִּשְׁמָהַתְהוֹן רַבָּא תִמְנָע רַבָּא עַלְוָה רַבָּא יְתֵת", "pj_en": "And these are the names of the chieftains of Esau after their kindreds, after the place of their habitation,with their names Rabba Timna, Rabba Alva, Rabba Jetheth,", "tj": "", "tj_en": "", "rashi": "<b>ואלה שמות אלופי עשו.<\/b> שֶׁנִּקְרְאוּ עַל שֵׁם מְדִינוֹתֵיהֶם לְאַחַר שֶׁמֵּת הֲדַר וּפָסְקָה מֵהֶם מַלְכוּת, וְהָרִאשׁוֹנִים הַנִּזְכָּרִים לְמַעְלָה הֵם שְׁמוֹת תּוֹלְדוֹתָם; וְכֵן מְפֹרָשׁ בְּדִבְרֵי הַיָּמִים וַיָּמָת הֲדָד וַיִּהְיוּ אַלּוּפֵי אֱדוֹם אַלּוּף תִּמְנָע וְגוֹמֵר:", "rashi_en": "ואלה שמות אלופי עשו AND THESE ARE THE NAMES OF THE CHIEFS OF ESAU — [… AFTER THEIR PLACES ACCORDING TO THEIR NAMES]   they were called by the names of their districts after Hadad died and the royal dignity had ceased so far as they were concerned. The former names mentioned above (v. 15ff.), are the names given them at their birth. This, too, (the first statement made here) is expressly set forth in Chronicles (2:51) “And Hadad (Hadar) died, and the chiefs of Edom were: the chief of Timna etc.” (We must therefore translate here: “the chieftain of Timna etc.”) "}, {"ch": 36, "v": 41, "aliyah": 7, "heb": "אַלּ֧וּף אׇהֳלִיבָמָ֛ה אַלּ֥וּף אֵלָ֖ה אַלּ֥וּף פִּינֹֽן׃", "onk": "רַבָּא אָהֳלִיבָמָה רַבָּא אֵלָה רַבָּא פִינֹן:", "onk_en": "Chief Oholivomoh, Chief Eilah, Chief Pinon.", "pj": "רַבָּא אָהֳלִיבָמָה רַבָּא אֵלָה רַבָּא פִּינוֹן", "pj_en": "Rabba Aholibama, Rabba Elah, Rabba Phinon,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 42, "aliyah": 7, "heb": "אַלּ֥וּף קְנַ֛ז אַלּ֥וּף תֵּימָ֖ן אַלּ֥וּף מִבְצָֽר׃", "onk": "רַבָּא קְנַז רַבָּא תֵימָן רַבָּא מִבְצָר:", "onk_en": "Chief Kenaz, Chief Teimon, Chief Mivtzar.", "pj": "רַבָּא קְנַז רַבָּא תֵימָן רַבָּא מִבְצָר", "pj_en": "Rabba Kenaz, Rabba Teman, Rabba Mibzar,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 43, "aliyah": 7, "heb": "אַלּ֥וּף מַגְדִּיאֵ֖ל אַלּ֣וּף עִירָ֑ם אֵ֣לֶּה&thinsp;<b>׀<\/b> אַלּוּפֵ֣י אֱד֗וֹם לְמֹֽשְׁבֹתָם֙ בְּאֶ֣רֶץ אֲחֻזָּתָ֔ם ה֥וּא עֵשָׂ֖ו אֲבִ֥י אֱדֽוֹם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "רַבָּא מַגְדִּיאֵל רַבָּא עִירָם אִלֵּין רַבְרְבֵי אֱדוֹם לְמוֹתְבָנְהוֹן בְּאַרְעָא אַחֲסַנְתְּהוֹן הוּא עֵשָׂו אֲבוּהוֹן דֶּאֱדוֹמָאֵי:", "onk_en": "Chief Magdiel, Chief Iram. These are the chiefs of Edom according to their places of residence, in the land of their possession. Thus was Eisov the ancestor of the Edomites.", "pj": "רַבָּא מַגְדִיאֵל הוּא הֲוָה מִתְקְרֵי מַגְדִיאֵל עַל שׁוּם קַרְתֵּיהּ מִגְדָל תַּקִיף הוּא רַבָּא עִירָם אִלֵין רַבְרְבֵי אֱדוֹם לְמוֹתְבָנֵיהוֹן בְּאַרְעָא אַחְסַנְתֵּיהוֹן הוּא עֵשָו אֲבוּהוֹן דֶאֱדוֹמָאֵי", "pj_en": "Rabba Magdiel, he was called Magdiel from the name of his city whose (migdol) tower was strong, Rabba Hiram. These are the chieftains of Edom, according to their habitations in the land of their possessions. He is Esau the father of the Edomites.", "tj": "", "tj_en": "", "rashi": "<b>מגדיאל.<\/b> הִיא רוֹמִי:", "rashi_en": "מגדיאל MAGDIEL — This is Rome (Pirkei D'Rabbi Eliezer 38)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
