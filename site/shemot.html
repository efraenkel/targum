ָמַר: \"כִּי אִם הַלֶּחֶם אֲשֶׁר הוּא אוֹכֵל\" (בראשית ל\"ט):", "rashi_en": "למה זה עזבתן — WHEREFORE HAVE YE LEFT [THE MAN]? — He recognised that he was of the offspring of Jacob because for him (Moses), as for Jacob, the water had risen in the well at his approach (Midrash Tanchuma, Shemot 11)<br><br>ויאכל לחם THAT HE MAY EAT BREAD — perhaps he will marry one of you — just as you say, (Genesis 39:6) “except the bread which he did eat” (cf. Rashi on this verse, where the word “bread” is explained as a euphemism) (Midrash Tanchuma, Shemot 11)."}, {"ch": 2, "v": 21, "aliyah": 3, "heb": "וַיּ֥וֹאֶל מֹשֶׁ֖ה לָשֶׁ֣בֶת אֶת־הָאִ֑ישׁ וַיִּתֵּ֛ן אֶת־צִפֹּרָ֥ה בִתּ֖וֹ לְמֹשֶֽׁה׃", "onk": "וּצְבִי משֶׁה לְמִיתַב עִם גַבְרָא וִיהַב יָת צִפּוֹרָה בְרַתֵּהּ לְמשֶׁה:", "onk_en": "Moshe agreed to reside with the man, and he gave Moshe his daughter Tzipporah.", "pj": "וְכַד חַכִּים רְעוּאֵל דְעָרַק משֶׁה מִן קֳדָם פַרְעה טָלַק יָתֵיהּ לְגוּבָא וַהֲוַת צִפּוֹרָה בְּרַתֵּיהּ דִבְרֵיהּ מְפַרְנָסָא יָתֵיהּ בְּסִיתְרָא בִּזְמַן עִשַרְתִּי שְׁנִין וּלְסוֹף עִשַרְתִּי שְׁנִין אַפְקֵיהּ מִן גוּבָא וְעַל משֶׁה בְּגוֹי גִינוּנִיתָא דִרְעוּאֵל וַהֲוָה מוֹדֵי וּמַצְלֵי קֳדָם יְיָ דַעֲבֵד עִמֵיהּ נִיסִין וּגְבוּרַן וְאִיסְתְּכִיַית חוּטְרָא דְאִיתְבְּרִאַת בֵּינֵי שִׁמְשְׁתָא וְחַקְיָין וּמְפָרַשׁ עֲלָהּ שְׁמָא רַבָּא וְיַקִירָא דְבֵיהּ עָתִיד לְמֶעֱבַד יַת תִּמְהַיָא בְּמִצְרַיִם וּבֵיהּ עָתִיד לְמִבְזַע יַת יַמָא דְסוּף וּלְהַנְפָקָא מוֹי מִן כֵּיפָא וַהֲוָה דָעִיץ בְּגוֹ גִינוּנִיתָא וּמִן יַד אוֹשִׁיט יְדֵיהּ וְנַסְבֵיהּ הָא בְּכֵין צָבֵי משֶׁה לְמִתַּב עִם גַבְרָא וִיהַב יַת צִפּוֹרָה בְּרַת בְּרַתֵּיהּ לְמשֶׁה", "pj_en": "But when Reuel knew that Mosheh had fled from before Pharoh he cast him into a pit; but Zipporah, the daughter of his son, maintained him with food, secretly, for the time of ten years; and at the end of ten years brought him out of the pit. And Mosheh went into the bedchamber of Reuel, and gave thanks and prayed before the Lord, who by him would work miracles and mighty acts. And there was shown to him the Rod which was created between the evenings, and on which was engraven and set forth the Great and Glorious Name, with which he was to do the wonders in Mizraim, and to divide the sea of Suph, and to bring, forth water from the rock. And it was infixed in the midst of the chamber, and he stretched forth his hand at once and took it. Then, behold, Mosheh was willing to dwell with the man, and he gave Zipporah, the daughter of his son, to Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויואל.<\/b> כְּתַרְגוּמוֹ, וְדוֹמֶה לוֹ \"הוֹאֶל נָא וְלִין\" (שופטים י\"ט), \"וְלוּ הוֹאַלְנוּ\" (יהושע ז'), \"הוֹאַלְתִּי לְדַבֵּר\" (בראשית י\"ח). וּמִדְרָשׁוֹ: לְשׁוֹן אָלָה – נִשְׁבַּע לוֹ שֶׁלֹּא יָזוּז מִמִּדְיָן כִּי אִם בִּרְשׁוּתוֹ (נדרים ס\"ה):", "rashi_en": "ויואל — Translate this as the Targum does: AND HE WAS WILLING. Similar are: (Judges 19:6) “Be content (הואל), I pray thee, and tarry all night”; (Joshua 7:7) “would that we had been content (הואלנו)”; (Genesis 18:31) “I am content (הואלתי) to speak”. A Midrashic explanation is that it has the sense of taking an oath (אלה), so that it should be rendered, “And Moses pledged himself by an oath to remain with the man” — he swore to him that he would not stir from Midian save by his permission (cf. Exodus 4:18) (Nedarim 65a)."}, {"ch": 2, "v": 22, "aliyah": 3, "heb": "וַתֵּ֣לֶד בֵּ֔ן וַיִּקְרָ֥א אֶת־שְׁמ֖וֹ גֵּרְשֹׁ֑ם כִּ֣י אָמַ֔ר גֵּ֣ר הָיִ֔יתִי בְּאֶ֖רֶץ נׇכְרִיָּֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִילִדַת בַּר וּקְרָא יָת שְׁמֵהּ גֵרְשֹׁם אֲרֵי אֲמַר דַיָר הֲוֵיתִי בְּאַרַע נוּכְרָאָה:", "onk_en": "When she gave birth to a son, he named him Gershom, for he said, “I have been a foreigner in a strange land.”", "pj": "וִילֵידַת בִּיר דְכַר וּקְרָא שְׁמֵיהּ גֵרְשׁוֹם אֲרוּם אָמַר דַיָר הֲוֵיתִי בְּאַרְעָא נוּכְרַיָיא דְלָא דִידִי", "pj_en": "And she bare him a male child, and he called his name Gershom, Because, said he, a sojourner have I been in a strange land which is not mine.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 23, "aliyah": 3, "heb": "וַיְהִי֩ בַיָּמִ֨ים הָֽרַבִּ֜ים הָהֵ֗ם וַיָּ֙מׇת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַיֵּאָנְח֧וּ בְנֵֽי־יִשְׂרָאֵ֛ל מִן־הָעֲבֹדָ֖ה וַיִּזְעָ֑קוּ וַתַּ֧עַל שַׁוְעָתָ֛ם אֶל־הָאֱלֹהִ֖ים מִן־הָעֲבֹדָֽה׃", "onk": "וַהֲוָה בְּיוֹמַיָא סַגִיאַיָא הָאִנוּן וּמִית מַלְכָּא דְמִצְרַיִם וְאִתְנָחוּ בְנֵי יִשְׂרָאֵל מִן פָּלְחָנָא <b>דַהֲוָה קְשֵׁי עֲלֵיהוֹן<\/b> וּזְעִיקוּ וּסְלֵיקָת קְבֶלְתְּהוֹן <b>לָקֳדָם<\/b> יְיָ מִן פָּלְחָנָא:", "onk_en": "A long time passed and the king of Egypt died. The B’nei Yisrael moaned because of their enslavement [<b>which was hard upon them<\/b>], and they cried. Their plea about their enslavement went up to [<b>before<\/b>] God.", "pj": "וַהֲוָה בְּיוֹמַיָא סְגִיאַיָיא הָאִינוּן וְאִתְכְּתַשׁ מַלְכָּא דְמִצְרָיִם וּפַקֵיד לְקַטָלָא בּוּכְרַיָיא דִבְנֵי יִשְרָאֵל בְגִין לְמִסְחֵי בְּאַדְמֵיהוֹן וְאִתְאַנָחוּ בְּנֵי יִשְרָאֵל מִן פּוּלְחָנָא דַהֲוָה קַשְׁיָא עֲלֵיהוֹן וּזְעָקוּ וּסְלֵיקַת קְבֵילְתְּהוֹן לִשְׁמֵי מְרוֹמָא דַיְיָ וַאֲמַר בְּמֵימְרֵיהּ לְמִפְרוֹקִינוּן מִן פּוּלְחָנָא", "pj_en": "And it was after many of those days that the king of Mizraim was struck (with disease), and he commanded to kill the firstborn of the sons of Israel, that he might bathe himself in their blood. And the sons of Israel groaned with the labour that was hard upon them; and they cried, and their cry ascended to the high heavens of the Lord. And He spake in His Word to deliver them from the travail.", "tj": "", "tj_en": "", "rashi": "<b>ויהי בימים הרבים ההם.<\/b> שֶׁהָיָה מֹשֶׁה גָּר בְּמִדְיָן, <b>וימת מלך מצרים<\/b>, וְהֻצְרְכוּ יִשְׂרָאֵל לִתְשׁוּעָה, <b>ומשה היה רעה<\/b> (שמות ג׳:א׳), וּבָאת תְּשׁוּעָה עַל יָדוֹ, לְכָךְ נִסְמְכוּ פָּרָשִׁיּוֹת הַלָּלוּ:<br><br><b>וימת מלך מצרים.<\/b> נִצְטָרַע וְהָיָה שׁוֹחֵט תִּינוֹקוֹת יִשְׂרָאֵל וְרוֹחֵץ בְּדָמָם (שמות רבה א'):", "rashi_en": "[ויהי בימים הרבים ההם AND IT CAME TO PASS DURING THOSE MANY DAYS during which Moses was sojourning in Midian, וימת מלך מצרים THAT THE KING OF EGYPT DIED, and the Israelites felt the need of help; and therefore ומשה היה רעה “And Moses fed the flock” and help came through him. For this reason these chapters are placed in juxtaposition].<br><br>וימת מלך מצרים THE KING OF EGYPT DIED — he became stricken with leprosy (and therefore may be spoken of as dead; cf. Numbers 12:12), and he used to slaughter Israelitish children and bathe in their blood as a cure for his disease (cf. Targum Jonathan and Exodus Rabbah 1:34)."}, {"ch": 2, "v": 24, "aliyah": 3, "heb": "וַיִּשְׁמַ֥ע אֱלֹהִ֖ים אֶת־נַאֲקָתָ֑ם וַיִּזְכֹּ֤ר אֱלֹהִים֙ אֶת־בְּרִית֔וֹ אֶת־אַבְרָהָ֖ם אֶת־יִצְחָ֥ק וְאֶֽת־יַעֲקֹֽב׃", "onk": "<b>וּשְׁמִיעַ קֳדָם יְיָ<\/b> יָת קְבֶלְתְּהוֹן וּדְכִיר יְיָ יָת קַיָמֵהּ דְעִם אַבְרָהָם דְעִם יִצְחָק וּדְעִם יַעֲקֹב:", "onk_en": "Elohim heard their groaning [<b>was heard before Elohim<\/b>] and Elohim remembered His covenant with Avraham, with Yitzchok and with Yaakov.", "pj": "וּשְׁמִיעַ קֳדָם יְיָ קְבֵילְתְּהוֹן וּדְכִיר קֳדָם יְיָ יַת קְיָימֵיהּ דְקַיֵים עִם אַבְרָהָם וְעִם יִצְחָק וְעִם יַעֲקב", "pj_en": "And their cry was heard before the Lord, and before the Lord was the covenant remembered which He had covenanted with Abraham, with Izhak, and with Jakob.", "tj": "", "tj_en": "", "rashi": "<b>נאקתם.<\/b> צַעֲקָתָם, וְכֵן \"מֵעִיר מְתִים יִנְאָקוּ\" (איוב כ\"ד):<br><br><b>את בריתו את אברהם.<\/b> עִם אַבְרָהָם:", "rashi_en": "נאקתם means THEIR CRY. Similar is, (Job 24:12) “from out of the populous city men groan (ינאקו)”.<br><br>‎ את בריתו את אברהם — The words את אברהם, are the same as עם אברהם, with Abraham (i. e. the word את means “with”, whilst in the preceding phrase, את בריתו, it is the sign of the accusative)."}, {"ch": 2, "v": 25, "aliyah": 3, "heb": "וַיַּ֥רְא אֱלֹהִ֖ים אֶת־בְּנֵ֣י יִשְׂרָאֵ֑ל וַיֵּ֖דַע אֱלֹהִֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וּגְלִי קְדָם יְיָ שִׁעְבּוּדָא<\/b> דִבְנֵי יִשְׂרָאֵל <b>וַאֲמַר בְּמֵימְרֵהּ לְמִפְרַקְהוֹן<\/b> יְיָ:", "onk_en": "Elohim saw [<b>The enslavement of<\/b>] the B’nei Yisrael [<b>became revealed before Elohim<\/b>], and Elohim took knowledge of them [<b>said with His Word that He would deliver them<\/b>].", "pj": "וַחֲמָא יְיָ צַעַר שִׁעֲבּוּדְהוֹן דִבְנֵי יִשְרָאֵל וּגְלֵי קֳדָמוֹי יַת תִּיוֹבְתָּא דְעָבָדוּ בְּטוּמְרָא דְלָא יָדְעוּ אַנַשׁ בְּחַבְרֵיהּ", "pj_en": "And the Lord looked upon the affliction of the bondage of the sons of Israel; and the repentance was revealed before Him which they exercised in concealment, so as that no man knew that of his companion.", "tj": "", "tj_en": "", "rashi": "<b>וידע אלהים.<\/b> נָתַן עֲלֵיהֶם לֵב וְלֹא הֶעֱלִים עֵינָיו:", "rashi_en": "וידע אלהים AND GOD KNEW — He directed His heart to them and did not hide His eyes from them."}, {"ch": 3, "v": 1, "aliyah": 4, "heb": "וּמֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת־צֹ֛אן יִתְר֥וֹ חֹתְנ֖וֹ כֹּהֵ֣ן מִדְיָ֑ן וַיִּנְהַ֤ג אֶת־הַצֹּאן֙ אַחַ֣ר הַמִּדְבָּ֔ר וַיָּבֹ֛א אֶל־הַ֥ר הָאֱלֹהִ֖ים חֹרֵֽבָה׃", "onk": "וּמשֶׁה הֲוָה רָעֵי יָת עָנָא דְיִתְרוֹ חֲמוֹהִי <b>רַבָּא<\/b> דְמִדְיָן וּדְבַר יָת עָנָא לְבָתַר <b>שְׁפַר רַעֲיָא<\/b> לְמַדְבְּרָא וְאָתָא לְטוּרָא <b>דְאִתְגְלִי עֲלוֹהִי יְקָרָא<\/b> דַיְיָ לְחוֹרֵב:", "onk_en": "Moshe tended the sheep of his father-in-law Yisro, priest [<b>minister<\/b>] of Midian. He led the sheep to the edge of the wilderness [<b>to the best pastures<\/b>] and he came to the mountain [<b>on which was the revealed the Glory<\/b>] of God, in the area of Choreiv.", "pj": "וּמשֶׁה הַוָה רָעֵי יַת עָנַא דְיִתְרוֹ חָמוֹי רַבָּא דְמִדְיָן וּדְבַר יַת עָנָא לַאֲתַר שְׁפַר רַעֲיָא לַאֲחוֹרֵי מַדְבְּרָא וְאָתָא לְטַוְורָא דְאִתְגְלֵי עֲלוֹי יְקָרָא דַיְיָ לְחוֹרֵב", "pj_en": "But Mosheh was keeping the flock of Jethro his father-in-law, the rabba of Midian; and he had led the flock to a pleasant place of pasturage which is behind the desert, and had come to the mountain on which was revealed the glory of the Lord, even Horeb.", "tj": "", "tj_en": "", "rashi": "<b>אחר המדבר.<\/b> לְהִתְרַחֵק מִן הַגֶּזֶל, שֶׁלֹּא יִרְעוּ בִּשְׂדוֹת אֲחֵרִים (שמות רבה ב'):<br><br><b>אל הר האלהים.<\/b> עַל שֵׁם הֶעָתִיד:", "rashi_en": "אחר המדבר [HE LED THE SHEEP] BEHIND THE DESERT — in order to keep them away from private property (גֶזֵל i. e. things which can be appropriated only as the result of “robbery”) — that they should not graze in other people’s fields (Exodus Rabbah 2:3).<br><br>אל הר האלהים TO THE MOUNTAIN OF GOD — Scripture so names it with reference to what happened there in the future (Sifrei on Deuteronomy 1:24)."}, {"ch": 3, "v": 2, "aliyah": 4, "heb": "וַ֠יֵּרָ֠א מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛יו בְּלַבַּת־אֵ֖שׁ מִתּ֣וֹךְ הַסְּנֶ֑ה וַיַּ֗רְא וְהִנֵּ֤ה הַסְּנֶה֙ בֹּעֵ֣ר בָּאֵ֔שׁ וְהַסְּנֶ֖ה אֵינֶ֥נּוּ אֻכָּֽל׃", "onk": "<b>וְאִתְגְלִי<\/b> מַלְאָכָא דַיְיָ לֵהּ <b>בְּשַׁלְהוֹבִית<\/b> אֶשָׁתָא מִגוֹ אַסָנָא וַחֲזָא וְהָא אַסָנָא בָּעֵר בְּאֶשְָׁתָא וַאֲסָנָא לֵיתוֹהִי מִתְאָכִיל:", "onk_en": "An angel of Adonoy appeared [<b>became revealed<\/b>] to him [Moshe] in the heart [<b>a flame<\/b>] of a fire in the midst of a thorn-bush. He looked and behold the bush was on fire, but the bush was not being consumed.", "pj": "וְאִתְגְלֵי זַגְנוּגָאֵל מַלְאָכָא דַיְיָ לֵיהּ בְּלַהֲבֵי אֵישָׁתָא מִגוֹ סַנְיָא וַחֲמָא וְהָא סַנְיָא מַשְׁרִיב בְּאֵישָׁתָא וְסַנְיָא לֵיתוֹ יַקִיד וּמִתְאָכֵל בְּנוּרָא", "pj_en": "And Zagnugael, the angel of the Lord, appeared to him in a flame of fire in the midst of the bush. And he gazed, and, behold, the bush burned with fire, yet the bush was neither burned nor consumed with fire.", "tj": "וַחֲמָא וְהָא סַנְיָא בָּעֵיר בְּאֵשָׁא וּסְנַיָא מַרְטִיב וְלָא יַקִיד:", "tj_en": "And he looked, and, behold, the bush burned with fire, yet remained in freshness, (or, was moist), neither was it consumed.", "rashi": "<b>בלבת אש.<\/b> בְּשַׁלְהֶבֶת אֵשׁ – לִבּוֹ שֶׁל אֵשׁ, כְּמוֹ \"לֵב הַשָּׁמַיִם\" (דברים ד'), \"בְּלֵב הָאֵלָה\" (שמואל ב י\"ח); וְאַל תִּתְמַהּ עַל הַתָּי\"ו, שֶׁיֵּשׁ לָנוּ כַיּוֹצֵא בוֹ, \"מָה אֲמֻלָה לִבָּתֵךְ\" (יחזקאל ט\"ז):<br><br><b>מתוך הסנה.<\/b> וְלֹא אִילָן אַחֵר, מִשּׁוּם \"עִמּוֹ אָנֹכִי בְצָרָה\" (תהילים צא טו):<br><br><b>אכל.<\/b> נֶאֱכָל, כְּמוֹ \"לֹא עֻבַּד בָּהּ\" (דברים כ\"א), \"אֲשֶׁר לֻקַּח מִשָּׁם\" (בראשית ג'):", "rashi_en": "בלבת אש means IN A FLAME OF FIRE, i. e. in the very heart of (לב) the fire. Similarly is לב used of inanimate objects in: (Deuteronomy 4:11) “in the heart of (לב) heaven”; (II Samuel 18:14) “in the midst of (לב) the terebinth”. Do not be puzzled by the ת, although the ordinary word for heart, לב. does not require the suffix ת in the construct form, because we have another example of this form, viz., (Ezekiel 16:30) “how weak is thy heart (לבתך)”.‎<br><br>מתוך הסנה OUT OF THE MIDST OF A BUSH (a thornbush) — and not from any other tree, in accordance with the idea (Psalms 91:15) “I will be with him in trouble” (Midrash Tanchuma, Shemot 14).<br><br>אֻכָּל means DEVOURED, eaten. It is of the same grammatical form as, (Deuteronomy 21:3) “which hath not been wrought with (עֻבַּד)”; (Genesis 3:23) “whence he was taken (לֻקַח):"}, {"ch": 3, "v": 3, "aliyah": 4, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה אָסֻֽרָה־נָּ֣א וְאֶרְאֶ֔ה אֶת־הַמַּרְאֶ֥ה הַגָּדֹ֖ל הַזֶּ֑ה מַדּ֖וּעַ לֹא־יִבְעַ֥ר הַסְּנֶֽה׃", "onk": "וַאֲמַר משֶׁה אִתְפְּנֵי כְעַן וְאֶחֱזֵי יָת חָזְוָנָא רַבָּא הָדֵין מָא דֵין לָא מִתּוֹקַד אַסָנָא:", "onk_en": "Moshe said, “I must turn aside and see [investigate] this great sight. Why doesn’t the bush burn?”", "pj": "וַאֲמַר משֶׁה אִתְפְּנֵי כְדוּן וְאֵיחְמֵי יַת חֶזְוָונָא רַבָּא הָדֵין מַדֵין לָא שְׁרִיב סַנְיָא", "pj_en": "And Mosheh said, I will turn aside now and consider this great sight, why the bush is not burned.", "tj": "וְאֵיחְזֵי יַת חֲזוּזָא רַבָּא הָדֵין מִן בִּגְלַל מַה סַנְיָא מַרְטִיב וְלָא יַקִיד:", "tj_en": "I will look at this great sight, wherefore the bush is refreshed and not burned.", "rashi": "<b>אסרה נא.<\/b> אָסוּרָה מִכָּאן לְהִתְקָרֵב שָׁם:", "rashi_en": "אָסוּרָה means I WILL TURN ASIDE from here in order that I may approach thither."}, {"ch": 3, "v": 4, "aliyah": 4, "heb": "וַיַּ֥רְא יְהֹוָ֖ה כִּ֣י סָ֣ר לִרְא֑וֹת וַיִּקְרָא֩ אֵלָ֨יו אֱלֹהִ֜ים מִתּ֣וֹךְ הַסְּנֶ֗ה וַיֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַיֹּ֥אמֶר הִנֵּֽנִי׃", "onk": "וַחֲזָא יְיָ אֲרֵי אִתְפְּנֵי לְמֶחֱזֵי וּקְרָא לֵהּ יְיָ מִגוֹ אַסָנָא וַאֲמַר משֶׁה משֶׁה וַאֲמַר הָא אֲנָא:", "onk_en": "When Adonoy saw that [Moshe] turned aside to see, Elohim called to him from the midst of the thorn-bush, and said, “Moshe, Moshe.’” He [Moshe] said, “Here I am.”", "pj": "וּגְלֵי קֳדָם יְיָ אֲרוּם אִיתְפְּנֵי לְמֵיחְמֵי וּקְרָא לֵיהּ יְיָ מִגוֹ סַנְיָא וַאֲמַר משֶׁה משֶׁה וַאֲמַר הָא אֲנָא", "pj_en": "And when it was seen before the Lord that he turned to look, the Lord called to him from the midst of the bush and said, Mosheh, Mosheh ! And he said, Behold me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 5, "aliyah": 4, "heb": "וַיֹּ֖אמֶר אַל־תִּקְרַ֣ב הֲלֹ֑ם שַׁל־נְעָלֶ֙יךָ֙ מֵעַ֣ל רַגְלֶ֔יךָ כִּ֣י הַמָּק֗וֹם אֲשֶׁ֤ר אַתָּה֙ עוֹמֵ֣ד עָלָ֔יו אַדְמַת־קֹ֖דֶשׁ הֽוּא׃", "onk": "וַאֲמַר לָא תִקְרַב הַלְכָא שְׁרִי סֵינָךְ מֵעַל רִגְלָךְ אֲרֵי אַתְרָא דְאַתְּ קָאִים עֲלוֹהִי <b>אֲתַר<\/b> קַדִישׁ הוּא:", "onk_en": "He [God] said, “Do not come any closer. Take your shoes off your feet, because the place upon which you are standing is [<b>a<\/b>] holy ground [<b>place<\/b>].”", "pj": "וַאֲמַר לָא תִקְרַב הַלְכָא שְׁלוּף סֵינָךְ מֵעַל רִגְלָךְ אֲרוּם אַתְרָא דְאַנְתְּ קָאִים עֲלוֹי אָתַר קַדִישׁ הוּא וְעָלוֹי אַנְתְּ עָתִיד לְקַבָּלָא אוֹרַיְיתָא לְמַלְפָא יָתָהּ לִבְנֵי יִשְרָאֵל", "pj_en": "And He said, Approach not hither, take the shoe from thy feet, for the place on which thou standest is a holy place; and upon it thou art to receive the Law, to teach it to the sons of Israel.", "tj": "שְׁלוּף סַנְדְלָךְ:", "tj_en": "", "rashi": "<b>של.<\/b> שְׁלֹף וְהוֹצֵא, כְּמוֹ \"וְנָשַׁל הַבַּרְזֶל\" (דברים י\"ט), \"כִּי יִשַּׁל זֵיתֶךָ\" (שם כ\"ח):<br><br><b>אדמת קדש הוא.<\/b> הַמָּקוֹם:", "rashi_en": "של means DRAW OFF and take off. It is of the same root as, (Numbers 19:5) “and the iron-head slippeth off (נשל) from the handle”; (Deuteronomy 28:40) “for thine olives shall drop off (ישל)‎”.<br><br>אדמת קדש הוא the place IS HOLY GROUND (i. e. the masculine pronoun הוא refers to the word המקום and not to אדמת, which is feminine)."}, {"ch": 3, "v": 6, "aliyah": 4, "heb": "וַיֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔יךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵאלֹהֵ֣י יַעֲקֹ֑ב וַיַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔יו כִּ֣י יָרֵ֔א מֵהַבִּ֖יט אֶל־הָאֱלֹהִֽים׃", "onk": "וַאֲמַר אֲנָא אֱלָהָא דְאָבוּךְ אֱלָהָא דְאַבְרָהָם אֱלָהָא דְיִצְחָק וֵאלָהָא דְיַעֲקֹב וּכְבֵשִׁנּוּן משֶׁה לְאַפּוֹהִי אֲרֵי דָחִיל מִלְאִסְתַּכָּלָא <b>בְּצֵית יְקָרָא דַ<\/b>יְיָ:", "onk_en": "He [God] then said, “I am the God of your father, the God of Avraham, the God of Yitzchok, and the God of Yaakov.” Moshe hid his face, for he was afraid to look at [<b>the side of the Glory of<\/b>] Elohim.", "pj": "וַאֲמַר אֲנָא הוּא אֱלָהֵיהּ דְאָבוּךְ אֱלָהֵיהּ דְאַבְרָהָם אֱלָהֵיהּ דְיִצְחָק וֵאלָהֵיהּ דְיַעֲקב וּכְבָשִׁינוּן משֶׁה לְאַנְפּוֹי אֲרוּם הֲוָה דָחִיל מִלְמִסְתְּכֵי בְּצֵית אִיקַר שְׁכִינְתָּא דַיְיָ", "pj_en": "And He said, I am the God of thy father, the God of Abraham, the God of Izhak, and the God of Jakob. And Mosheh covered his face; for he was afraid to look upon the height of the glory of the Shekinah of the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 7, "aliyah": 4, "heb": "וַיֹּ֣אמֶר יְהֹוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת־עֳנִ֥י עַמִּ֖י אֲשֶׁ֣ר בְּמִצְרָ֑יִם וְאֶת־צַעֲקָתָ֤ם שָׁמַ֙עְתִּי֙ מִפְּנֵ֣י נֹֽגְשָׂ֔יו כִּ֥י יָדַ֖עְתִּי אֶת־מַכְאֹבָֽיו׃", "onk": "וַאֲמַר יְיָ <b>מִגְלָא גְלִי קֳדָמַי<\/b> יָת שִׁעְבּוּד עַמִי דִי בְמִצְרָיִם וְיָת <b>קְבֶלְתְּהוֹן שְׁמִיעַ קֳדָמַי<\/b> מִן קֳדָם מַפְלְחֵיהוֹן אֲרֵי <b>גְלֵי קָדָמַי<\/b> יָת כֵּיבֵיהוֹן:", "onk_en": "Adonoy said, “I have indeed seen the suffering of My people that are in Egypt [<b>has indeed been revealed before Me<\/b>]. I have heard how they [<b>Their<\/b>] cry out [<b>is heard before Me<\/b>] because [of the harshness] of their slave-masters, and I am aware of their pain [<b>has become revealed before Me<\/b>].", "pj": "וַאֲמַר מִיגְלֵי גְלֵי קֳדָמַי יַת סִיגוּף עַמִי דִבְמִצְרַיִם וְיַת קְבֵלְתְּהוֹן שְׁמִיעַ קֳדָמַי מִן קֳדָם מְשַׁעֲבְּדֵיהוֹן אֲרוּם גְלֵי קֳדָמַי כֵּיבֵיהוֹן", "pj_en": "And He said, The oppression of My people who are in Mizraim is verily manifest before Me, and heard before Me is their cry on account of them who hold them in bondage; for their affliction is known before Me.", "tj": "", "tj_en": "", "rashi": "<b>כי ידעתי את מכאביו.<\/b> כְּמוֹ \"וַיֵּדַע אֱלֹהִים\" (שמות ב'), כְּלוֹמַר כִּי שַׂמְתִּי לֵב לְהִתְבּוֹנֵן וְלָדַעַת אֶת מַכְאוֹבָיו וְלֹא הֶעֱלַמְתִּי עֵינַי לֶאֱטֹם אָזְנַי מִצַּעֲקָתָם:", "rashi_en": "כי ידעתי את מכאביו FOR I KNOW THEIR SORROWS — The verb has the same meaning as in (Exodus 2:25) “and God knew”, signifying as much as: for I have set my heart upon noticing and understanding their sorrows, and I have not hidden my eyes from their distress, nor have I stopped my ears against their cry."}, {"ch": 3, "v": 8, "aliyah": 4, "heb": "וָאֵרֵ֞ד לְהַצִּיל֣וֹ&thinsp;<b>׀<\/b> מִיַּ֣ד מִצְרַ֗יִם וּֽלְהַעֲלֹתוֹ֮ מִן־הָאָ֣רֶץ הַהִוא֒ אֶל־אֶ֤רֶץ טוֹבָה֙ וּרְחָבָ֔ה אֶל־אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָ֑שׁ אֶל־מְק֤וֹם הַֽכְּנַעֲנִי֙ וְהַ֣חִתִּ֔י וְהָֽאֱמֹרִי֙ וְהַפְּרִזִּ֔י וְהַחִוִּ֖י וְהַיְבוּסִֽי׃", "onk": "<b>וְאִתְגְלֵיתִי<\/b> לְשֵׁזָבוּתְהוֹן מִידָא דְמִצְרָאֵי וּלְאַסָקוּתְהוֹן מִן אַרְעָא הַהִיא לְאַרְעָא טָבָא וּפַתְיָא לְאַרְעָא <b>עָבְדָא<\/b> חֲלָב וּדְבָשׁ לַאֲתַר כְּנַעֲנָאֵי וְחִתָּאֵי וֶאֱמוֹרָאֵי וּפְרִזָאֵי וְחִוָאֵי וִיבוּסָאֵי:", "onk_en": "I have descended [<b>become revealed<\/b>] to free them from the hand of Egypt, and to bring them up from that land to a good, spacious land, to a land flowing with [<b>producing<\/b>] milk and honey; to the territory of the Canaanites, the Chittites, the Emorites, the Perizites, the Chivites and the Yevusites.", "pj": "וְאִיתְגְלֵיתִי יוֹמָא דֵין עֲלָךְ בְּגִין דִי בְמֵימְרִי לְשֵׁיזְבוּתְהוֹן מִן יְדָא דְמִצְרָאֵי וּלְאַסָקוּתְהוֹן מִן אַרְעָא הַהִיא מְסָאֲבָתָא לְאַרְעָא טַבְתָא וּפִתְיָא בִּתְחוּמִין לְאַרְעָא עַבְדָא חֲלַב וּדְבָשׁ לַאֲתַר דְדַיְירִין תַמָן כְּנַעֲנָאֵי וְחִיתָּאֵי וֶאֱמוֹרָאֵי וּפְרִיזָאֵי וְחִיוָואֵי וִיבוּסָאֵי", "pj_en": "And I have revealed Myself to thee this day, that by My Word they may be delivered from the hand of the Mizraee, to bring them up out of the unclean land, unto a good land, and large in its boundaries, a land yielding milk and honey, unto the place where dwell the Kenaanaee, and the Hittaee, and the Amoraee, and the Pherizaee, and the Hivaee, and the Jebusaee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 9, "aliyah": 4, "heb": "וְעַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי־יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑י וְגַם־רָאִ֙יתִי֙ אֶת־הַלַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽם׃", "onk": "וּכְעַן הָא קְבֵילַת בְּנֵי יִשְׂרָאֵל עָלַת <b>קֳדָמָי וְאַף גְלֵי קֳדָמַי<\/b> יָת דוֹחֲקָא דִי מִצְרָאֵי דָחֲקִין לְהוֹן:", "onk_en": "Now, behold, the cry of the B’nei Yisrael has come to [<b>before<\/b>] Me. I have also seen the oppression with which the Egyptians oppress them [<b>is also revealed before Me<\/b>].", "pj": "וּכְדוֹן הָא קְבֵילַת בְּנֵי יִשְרָאֵל סְלִיקַת לְקָדָמָי וּלְחוֹד גְלֵי קֳדָמָי יַת דוֹחֲקָא דְמִצְרָאֵי דַחֲקִין יַתְהוֹן", "pj_en": "And now, behold, the cry of the sons of Israel cometh up before Me, and the bruising of the Mizraee wherewith they bruise them is also revealed before Me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 10, "aliyah": 4, "heb": "וְעַתָּ֣ה לְכָ֔ה וְאֶֽשְׁלָחֲךָ֖ אֶל־פַּרְעֹ֑ה וְהוֹצֵ֛א אֶת־עַמִּ֥י בְנֵֽי־יִשְׂרָאֵ֖ל מִמִּצְרָֽיִם׃", "onk": "וּכְעַן <b>אִיתָא<\/b> וַאֲשַׁלְחִנָּךְ לְוַת פַּרְעֹה וְאַפֵּיק יָת עַמִי בְנֵי יִשְׂרָאֵל מִמִצְרָיִם:", "onk_en": "Now go [<b>come<\/b>]. I am sending you to Pharaoh, and you will bring My people, the B’nei Yisrael, out of Egypt.”", "pj": "וּכְדוֹן אִיתָא וְאַשַׁדְרִינָךְ לְוַת פַּרְעה וְאַפֵּיק יַת עַמִי בְּנֵי יִשְרָאֵל מִמְצְרָיִם", "pj_en": "And now, come, and I will send thee unto Pharoh, and thou shalt bring forth My people, the sons of Israel, out of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ועתה לכה ואשלחך אל פרעה.<\/b> וְאִם תֹּאמַר מַה תּוֹעִיל? <b>והוצא את עמי.<\/b> יוֹעִילוּ דְּבָרֶיךָ וְתוֹצִיאֵם מִשָּׁם:", "rashi_en": "ועתה לך ואשלחך אל פרעה COME NOW, THEREFORE, AND I WILL SEND THEE UNTO PHARAOH — And if you ask “What will this avail?” והוצא את עמי AND BRING FORTH MY PEOPLE — your words will prove effective and you will bring them forth from there."}, {"ch": 3, "v": 11, "aliyah": 4, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ אֶל־הָ֣אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל־פַּרְעֹ֑ה וְכִ֥י אוֹצִ֛יא אֶת־בְּנֵ֥י יִשְׂרָאֵ֖ל מִמִּצְרָֽיִם׃", "onk": "וַאֲמַר משֶׁה <b>קֳדָם<\/b> יְיָ מָן אֲנָא אֲרֵי אֵזִיל לְוָת פַּרְעֹה וַאֲרֵי אַפֵּיק יָת בְּנֵי יִשְׂרָאֵל מִמִצְרָיִם:", "onk_en": "Moshe said to [<b>before<\/b>] Elohim, “Who am I that I should go to Pharaoh? Am I able to bring the B’nei Yisrael out of Egypt?”", "pj": "וַאֲמַר משֶׁה קֳדָם יְיָ מַאן אֲנָא אֲרוּם אֵזִיל לְוַת פַּרְעה וַאֲרוּם אַפֵּיק יַת בְּנֵי יִשְרָאֵל מִמִצְרָיִם", "pj_en": "And Mosheh said before the Lord, Who am I, that I should go to Pharoh, and bring forth the sons of Israel out of Mizraim?", "tj": "", "tj_en": "", "rashi": "<b>מי אנכי.<\/b> מָה אֲנִי חָשׁוּב לְדַבֵּר עִם הַמְּלָכִים?<br><br><b>וכי אוציא את בני ישראל.<\/b> וְאַף אִם חָשׁוּב אֲנִי, מַה זָּכוּ יִשְׂרָאֵל שֶׁיֵּעָשֶׂה לָהֶם נֵס וְאוֹצִיאֵם מִמִּצְרַיִם?:", "rashi_en": "מי אנכי WHO AM I? — Of what importance am I that I should speak with monarchs?<br><br>וכי אוציא את בני ישראל AND THAT I SHOULD BRING FORTH THE CHILDREN OF ISRAEL — and even if I am of sufficient importance for this, how has Israel merited that a miracle should be wrought for them and that I should bring them forth from Egypt?"}, {"ch": 3, "v": 12, "aliyah": 4, "heb": "וַיֹּ֙אמֶר֙ כִּֽי־אֶֽהְיֶ֣ה עִמָּ֔ךְ וְזֶה־לְּךָ֣ הָא֔וֹת כִּ֥י אָנֹכִ֖י שְׁלַחְתִּ֑יךָ בְּהוֹצִֽיאֲךָ֤ אֶת־הָעָם֙ מִמִּצְרַ֔יִם תַּֽעַבְדוּן֙ אֶת־הָ֣אֱלֹהִ֔ים עַ֖ל הָהָ֥ר הַזֶּֽה׃", "onk": "וַאֲמַר אֲרֵי יְהֵי <b>מֵימְרִי בְסַעְדָךְ<\/b> וְדֵין לָךְ אָתָא אֲרֵי אֲנָא שְׁלַחְתָּךְ בְּאַפָּקוּתָךְ יָת עַמָא מִמִצְרַיִם תִּפְלְחוּן <b>קֳדָם<\/b> יְיָ עַל טוּרָא הָדֵין:", "onk_en": "He [God] said, “Because I will be with you [<b>My Word will be your support<\/b>]. This will be the proof that I have sent you—when you bring the people out of Egypt—you will serve [<b>before<\/b>] Elohim on this mountain.”", "pj": "וַאֲמַר אֲרוּם יְהֵי מֵימְרִי בְּסַעְדָךְ וְדֵין לָךְ סִימָנָא דַאֲנָא שַׁדְרָתָךְ בְּהַנְפּוּקָתָךְ יַת עַמָא מִמִצְרַיִם תְּפַלְחוּן קֳדָם יְיָ דִתְקַבְּלוּן יַת אוֹרַיְיתִי עַל טַוְורָא הָדֵין", "pj_en": "But He said, Therefore My Word shall be for thy help; and this shall be the sign to thee that I have sent thee: when thou hast, brought the people forth from Mizraim, ye shall worship before the Lord, because ye shall have received the Law upon this mountain.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר כי אהיה עמך.<\/b> הֱשִׁיבוֹ עַל רִאשׁוֹן רִאשׁוֹן וְעַל אַחֲרוֹן אַחֲרוֹן; שֶׁאָמַרְתָּ מִי אָנֹכִי כִּי אֵלֵךְ אֶל פַּרְעֹה – לֹא שֶׁלְּךָ הִיא כִּי אִם מִשֶּׁלִּי, כִּי אֶהְיֶה עִמָּךְ – <b>וזה<\/b> הַמַּרְאֶה אֲשֶׁר רָאִיתָ בַּסְּנֶה <b>לך האות כי אנכי שלחתיך<\/b>, וּכְדַאי אֲנִי לְהַצִּיל, כַּאֲשֶׁר רָאִיתָ הַסְּנֶה עוֹשֶׁה שְׁלִיחוּתִי וְאֵינֶנּוּ אֻכָּל, כָּךְ תֵּלֵךְ בִּשְׁלִיחוּתִי וְאֵינְךָ נִזּוֹק; וְשֶׁשָּׁאַלְתָּ מַה זְּכוּת יֵשׁ לְיִשְׂרָאֵל שֶׁיֵּצְאוּ מִמִּצְרַיִם? דָּבָר גָּדוֹל יֵשׁ לִי עַל הוֹצָאָה זוֹ, שֶׁהֲרֵי עֲתִידִים לְקַבֵּל הַתּוֹרָה עַל הָהָר הַזֶּה לְסוֹף ג' חֳדָשִׁים שֶׁיֵּצְאוּ מִמִּצְרָיִם. דָּ\"אַ: <b>כי אהיה עמך, וזה<\/b> שֶׁתַּצְלִיחַ בִּשְׁלִיחוּתְךָ <b>לך האות<\/b> עַל הַבְטָחָה אַחֶרֶת, שֶׁאֲנִי מַבְטִיחֲךָ שֶׁכְּשֶׁתּוֹצִיאֵם מִמִּצְרַיִם תַּעַבְדוּן אוֹתִי עַל הָהָר הַזֶּה, שֶׁתְּקַבְּלוּ הַתּוֹרָה עָלָיו, וְהִיא הַזְּכוּת הָעוֹמֶדֶת לְיִשְׂרָאֵל. וְדֻגְמַת לָשׁוֹן זֶה מָצִינוּ: \"וְזֶה לְּךָ הָאוֹת אָכוֹל הַשָּׁנָה סָפִיחַ וְגוֹ'\" (ישעיהו ל\"ז), מַפָּלַת סַנְחֵרִיב תִּהְיֶה לְךָ אוֹת עַל הַבְטָחָה אַחֶרֶת, שֶׁאַרְצְכֶם חֲרֵבָה מִפֵּרוֹת וַאֲנִי אֲבָרֵךְ הַסְּפִיחִים:", "rashi_en": "ויאמר כי אהיה עמך AND HE SAID, BECAUSE I WILL BE WITH THEE — He answered his first question first and his last question last: as regards what thou hast said, “Who am I that I should go unto Pharaoh?” i. e. of what importance am I to speak with kings, I reply, it is not an undertaking of yours, but it is partly mine for “I” will be with thee”, וזה AND THIS — i. e. the sight which thou hast witnessed in the bush, לך האות כי אנכי שלחתיך SHALL BE A SIGN UNTO THEE, BECAUSE (כי) “I” HAVE SENT THEE and “I” am competent to save: just as thou hast seen the bush carrying out the mission I laid upon it and it was not consumed, so go thou too on the mission I entrust to thee and thou shalt suffer no harm. And as regards thy question: What merit have the Israelites that they should go forth from Egypt? — I reply that I have a great purpose in this, My bringing them forth, for they are destined to accept the Torah upon this mountain at the expiration of three months after they leave Egypt (cf. Exodus Rabbah 3:4). Another explanation is: כי אהיה עמך FOR I WILL BE WITH THEE and thou wilt therefore succeed, וזה AND THIS — viz., the fact that thou wilt succeed in thy mission לך האות WILL BE A SIGN UNTO THEE with respect to another promise: for I promise thee that when thou hast brought them forth from Egypt ye will serve Me upon this mountain — i. e. that ye will receive the Torah upon it. This is the merit which is an advocate for Israel. An exactly similar use of the word אות, where something that will happen in the future is to serve as an אות in regard to an event that will transpire in the more distant future we find elsewhere: (Isaiah 37:30.) “And this shall be a sign unto thee — for ye shall eat this year that which groweth of itself etc.” (the passage proceeds to state that after a few years the devastated land will have regained its former fertility) — this, i. e, the fall of Sennacherib promised in the preceding section of that chapter shall be a sign to thee in respect to another promise: for your land is now barren of fruits, but I will bless that which grows of itself and the land shall bring forth fruits in abundance."}, {"ch": 3, "v": 13, "aliyah": 4, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֜ה אֶל־הָֽאֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל־בְּנֵ֣י יִשְׂרָאֵל֒ וְאָמַרְתִּ֣י לָהֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵיכֶ֖ם שְׁלָחַ֣נִי אֲלֵיכֶ֑ם וְאָֽמְרוּ־לִ֣י מַה־שְּׁמ֔וֹ מָ֥ה אֹמַ֖ר אֲלֵהֶֽם׃", "onk": "וַאֲמַר משֶׁה <b>קֳדָם<\/b> יְיָ הָא אֲנָא אָתֵי לְוָת בְּנֵי יִשְׂרָאֵל וְאֵימַר לְהוֹן אֱלָהָא דְאַבְהַתְכוֹן שַׁלְחַנִי לְוָתְכוֹן וְיֵימְרוּן לִי מָא שְׁמֵהּ מָא אֵימַר לְהוֹן:", "onk_en": "Moshe said to [<b>before<\/b>] Elohim, “Behold, when I come to the B’nei Yisrael and say to them, ‘The God of your fathers sent me to you,’ they will say to me, ‘What is His name?’ What shall I say to them?”", "pj": "וַאֲמַר משֶׁה קֳדָם יְיָ אֲנָא אֵזִיל לְוַת בְּנֵי יִשְרָאֵל וְאֵמַר לְהוֹן יְיָ אֱלָהָא דַאֲבָהַתְכוֹן שַׁדְרַנִי לְוַתְכוֹן וְיֵימְרוּן לִי מַה שְׁמֵיהּ מַה אֵימַר לְהוֹן", "pj_en": "And Mosheh said before the Lord, Behold, I will go to the sons of Israel, and say to them, The Lord God of your fathers hath sent me to you: and they will say to me, What is His Name ? What shall I say to them?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 14, "aliyah": 4, "heb": "וַיֹּ֤אמֶר אֱלֹהִים֙ אֶל־מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַיֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִבְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥נִי אֲלֵיכֶֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֶהְיֶה אֲשֶׁר אֶהְיֶה וַאֲמַר כִּדְנַן תֵּימַר לִבְנֵי יִשְׂרָאֵל אֶהְיֶה שַׁלְחַנִי לְוָתְכוֹן:", "onk_en": "Elohim said to Moshe, “Eh’yeh Asher Eh’yeh;” and He said, “This is what you must say to the B’nei Yisrael, ‘Eh’yeh sent me to you.’”", "pj": "וַאֲמַר יְיָ לְמשֶׁה דֵין דְאָמַר וַהֲוָה עַלְמָא אָמַר וַהֲוָה כּוּלָא וַאֲמַר כִּדְנָא תֵּימַר לִבְנֵי יִשְרָאֵל אֲנָא הוּא דְהַוֵינָא וְעָתִיד לְמֶהֱוֵי שַׁדְרַנִי לְוַותְכוֹן", "pj_en": "And the Lord said unto Mosheh, He who spake, and the world was; who spake, and all things were. And He said, This thou shalt say to the sons of Israel, I AM HE WHO IS, AND WHO WILL BE, hath sent me unto you.", "tj": "וַאֲמַר מֵימְרֵיהּ דַיְיָ לְמשֶׁה דֵין דְאָמַר לְעַלְמָא הֱוֵי וַהֲוָה וְעָתִיד לְמֵימַר לֵיהּ הֱוֵי וַהֲוָה וַאֲמַר כְּדֵין תֵּימַר לִבְנֵי יִשְרָאֵל אֶהְיֶה שְׁלָחַנִי לִפְנֵיכֶם:", "tj_en": "And the Word of the Lord said to Mosheh, He who spake to the world, Be, and it was; and who will speak to it, Be, and it will be. And he said, Thus shalt thou speak to the sons of Israel, EHEYEH hath sent me unto you.", "rashi": "<b>אהיה אשר אהיה.<\/b> אֶהְיֶה עִמָּם בְּצָרָה זוֹ אֲשֶׁר אֶהְיֶה עִמָּם בְּשִׁעְבּוּד שְׁאָר מַלְכֻיּוֹת. אָמַר לְפָנָיו, רִבּוֹנוֹ שֶׁל עוֹלָם, מָה אֲנִי מַזְכִּיר לָהֶם צָרָה אַחֶרֶת? דַּיָּם בְּצָרָה זוֹ, אָמַר לוֹ יָפֶה אָמַרְתָּ, <b>כה תאמר וגו'<\/b> (ברכות ט'):", "rashi_en": "אהיה אשר אהיה I AM THAT I AM — I will be with them in this sorrow — I Who I will be with them in the subjection they will suffer at the hands of other kingdoms (Berakhot 9b). Whereupon Moses said to him: Lord of the Universe! Why should I mention to them other sorrows: they have enough with this sorrow! God replied to him: You have spoken rightly — כה תאמר THUS SHALT THOU SAY etc.… Ehyeh, “I am” — without the addition of אשר אהיה which has reference to future sorrows — has sent me unto you”."}, {"ch": 3, "v": 15, "aliyah": 4, "heb": "וַיֹּ֩אמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל־מֹשֶׁ֗ה כֹּֽה־תֹאמַר֮ אֶל־בְּנֵ֣י יִשְׂרָאֵל֒ יְהֹוָ֞ה אֱלֹהֵ֣י אֲבֹתֵיכֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵאלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣נִי אֲלֵיכֶ֑ם זֶה־שְּׁמִ֣י לְעֹלָ֔ם וְזֶ֥ה זִכְרִ֖י לְדֹ֥ר דֹּֽר׃", "onk": "וַאֲמַר עוֹד יְיָ לְמשֶׁה כִּדְנַן תֵּימַר לִבְנֵי יִשְׂרָאֵל יְיָ אֱלָהָא דְאַבְהַתְכוֹן אֱלָהֵהּ דְאַבְרָהָם אֱלָהֵהּ דְיִצְחָק וֵאלָהֵהּ דְיַעֲקֹב שַׁלְחַנִי לְוָתְכוֹן דֵין שְׁמִי לְעָלַם וְדֵין דָכְרָנִי לְכָל דָר וְדָר:", "onk_en": "Elohim continued talking to Moshe, “This is what you must say to the B’nei Yisrael, ‘Adonoy, the God of your fathers, the God of Avraham, the God of Yitzchok, and the God of Yaakov, sent me to you. This is My eternal Name, and this is how I am to be mentioned for all generations.’”", "pj": "וַאֲמַר תּוּב יְיָ לְמשֶׁה כִּדְנַן תֵּימַר לִבְנֵי יִשְרָאֵל אֱלָהָא דְאַבְהַתְכוֹן אֱלָהֵיהּ דְאַבְרָהָם אֱלָהֵיהּ דְיִצְחָק וֵאלָהֵיהּ דְיַעֲקב שַׁדְרַנִי לְוַותְכוֹן דֵין הוּא שְׁמִי לְעָלַם וְדֵין דוּכְרָנִי לְכָל דַר וָדַר", "pj_en": "And the Lord said again unto Mosheh, Thus shalt thou speak to the sons of Israel, The God of your fathers, the God of Abraham, the God of Izhak, and the God of Jakob, hath sent me unto you. This is His Name for ever, and this is His Memorial to every generation and generation.", "tj": "", "tj_en": "", "rashi": "<b>זה שמי לעלם.<\/b> חָסֵר וָי\"ו, לוֹמַר, הַעֲלִימֵהוּ – שֶׁלֹּא יִקָּרֵא כִּכְתָבוֹ (פסחים נ'):<br><br><b>וזה זכרי.<\/b> לִמְּדוֹ הֵיאַךְ נִקְרָא. וְכֵן דָּוִד הוּא אוֹמֵר, \"ה' שִׁמְךָ לְעוֹלָם ה' זִכְרְךָ לְדֹר וָדֹר\" (תהלים קל\"ה):", "rashi_en": "זה שמי לעלם THIS IS MY NAME FOR EVER — The last word is written without ו (so that it may be read לְעַלֵּם and it would mean “this is My Name which is to be concealed”) to suggest: Conceal it (this Divine Name), so that it shall not be read exactly as it is written (but should be read as אדני; cf. Pesachim 50a; Exodus Rabbah 3:7).<br><br>וזה זכרי AND THIS IS MY MEMORIAL (the word may signify “the mention of Me”) — He taught him how the Divine Name should be read. So, too, did David say, (Psalms 135:13) “O Lord, Thy name is for ever (שמך לעולם), O Lord, Thy memorial is throughout all generations (זכרך לדר ודר)."}, {"ch": 3, "v": 16, "aliyah": 5, "heb": "לֵ֣ךְ וְאָֽסַפְתָּ֞ אֶת־זִקְנֵ֣י יִשְׂרָאֵ֗ל וְאָמַרְתָּ֤ אֲלֵהֶם֙ יְהֹוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵיכֶם֙ נִרְאָ֣ה אֵלַ֔י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְיַעֲקֹ֖ב לֵאמֹ֑ר פָּקֹ֤ד פָּקַ֙דְתִּי֙ אֶתְכֶ֔ם וְאֶת־הֶעָשׂ֥וּי לָכֶ֖ם בְּמִצְרָֽיִם׃", "onk": "אִזֵיל וְתִכְנוֹשׁ יָת סָבֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן יְיָ אֱלָהָא דְאַבְהַתְכוֹן <b>אִתְגְלֵי<\/b> לִי אֱלָהֵהּ דְאַבְרָהָם יִצְחָק וְיַעֲקֹב לְמֵימָר מִדְכַּר דְכִירְנָא יַתְכוֹן וְיָת דְאִתְעֲבַד לְכוֹן בְּמִצְרַיִם:", "onk_en": "“Go, gather the elders of Yisrael, and say to them, ‘Adonoy, the God of your fathers appeared [<b>became revealed<\/b>] to me—the God of Avraham, Yitzchok and Yaakov—saying, “I have indeed been mindful of you, regarding that which is being done to you in Egypt.", "pj": "אִיזֵל וְתִכְנוֹש יַת סָבֵי יִשְרָאֵל וְתֵימַר יְיָ אֱלָהָא דְאַבְהַתְכוֹן אִתְגְלֵי לִי אֱלָהֵיהּ דְאַבְרָהָם יִצְחָק וְיַעֲקב לְמֵימַר מִידְכַּר דְכִירְנָא יַתְכוֹן וְיַת עוּלְבָנָא דְאִיתְעֲבִיד לְכוֹן בְּמִצְרַיִם", "pj_en": "Go, and assemble the elders of Israel, and say to them, The Lord God of your fathers hath appeared unto me, the God of Abraham, Izhak, and Jakob, saying, Remembering, I have remembered you, and the injury that is done you in Mizraim;", "tj": "", "tj_en": "", "rashi": "<b>את זקני ישראל.<\/b> מְיֻחָדִים לִישִׁיבָה. וְאִם תֹּאמַר זְקֵנִים סְתָם, הֵיאַךְ אֶפְשָׁר לוֹ לֶאֱסֹף זְקֵנִים שֶׁל שִׁשִּׁים רִבּוֹא? (יומא כ\"ח)", "rashi_en": "את זקני ישראל THE ELDERS OF ISRAEL, those singled out to attend meetings, (i. e. the leaders) (cf. Yoma 28b). If, however, you should say that the text means old men in the ordinary sense I ask: How was it possible for him to gather all the old men amongst a male population of 600,000?"}, {"ch": 3, "v": 17, "aliyah": 5, "heb": "וָאֹמַ֗ר אַעֲלֶ֣ה אֶתְכֶם֮ מֵעֳנִ֣י מִצְרַ֒יִם֒ אֶל־אֶ֤רֶץ הַֽכְּנַעֲנִי֙ וְהַ֣חִתִּ֔י וְהָֽאֱמֹרִי֙ וְהַפְּרִזִּ֔י וְהַחִוִּ֖י וְהַיְבוּסִ֑י אֶל־אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָֽשׁ׃", "onk": "וַאֲמָרִית אַסֵיק יָתְכוֹן מִשִׁעְבּוּד מִצְרָאֵי לַאֲרַע כְּנַעֲנָאֵי וְחִתָּאֵי וֶאֱמוֹרָאֵי וּפְרִזָאֵי וְחִוָאֵי וִיבוּסָאֵי לְאַרְעָא <b>עַבְדָא<\/b> חֲלָב וּדְבָשׁ:", "onk_en": "I have said, I will bring you up out of the suffering of Egypt, to the land of the Canaanites, the Chittites, the Emorites, the Perizites, the Chivites and the Yevusites; to a land flowing with [<b>producing<\/b>] milk and honey.’”", "pj": "וַאֲמָרִית בְּמֵימְרִי אַפִּיק יַתְכוֹן מִסִיגוּף מִצְרָאֵי לְאַרַע כְּנַעֲנָאֵי וְחִיתָּאֵי וְאִימוֹרָאֵי וּפְרִיזָאֵי וְחִיוָאֵי וִיבוּסָאֵי לְאַרְעָא עַבְדָא חֲלָב וּדְבָשׁ", "pj_en": "and I have said in My Word, I will bring you up out from the oppression of the Mizraee into the land of the Kenaanaee, and Hittaee, and Amoraee, and Pherizaee, and Hivaee, and Jebusaee, to the land that yieldeth milk and honey.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 18, "aliyah": 5, "heb": "וְשָׁמְע֖וּ לְקֹלֶ֑ךָ וּבָאתָ֡ אַתָּה֩ וְזִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל־מֶ֣לֶךְ מִצְרַ֗יִם וַאֲמַרְתֶּ֤ם אֵלָיו֙ יְהֹוָ֞ה אֱלֹהֵ֤י הָֽעִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔ינוּ וְעַתָּ֗ה נֵֽלְכָה־נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּמִּדְבָּ֔ר וְנִזְבְּחָ֖ה לַֽיהֹוָ֥ה אֱלֹהֵֽינוּ׃", "onk": "<b>וִיקַבְּלוּן לְמֵימְרָךְ<\/b> וְתֵיתֵי אַתְּ וְסָבֵי יִשְׂרָאֵל לְוָת מַלְכָּא דְמִצְרַיִם וְתֵימְרוּן לֵהּ יְיָ אֱלָהָא דִיהוּדָאֵי אִתְקְרֵי עֲלָנָא <b>וּכְעַן<\/b> נֵזֵיל כְּעַן מַהֲלַךְ תְּלָתָא יוֹמִין בְּמַדְבְּרָא וּנְדַבַּח <b>קֳדָם<\/b> יְיָ אֱלָהָנָא:", "onk_en": "They will listen to [<b>obey<\/b>] your voice [<b>Words<\/b>]. You and the elders of Yisrael will come to the king of Egypt, and say to him, ‘Adonoy, God of the Hebrews happened to meet with us. Now we request that you let us go [<b>now<\/b>] into the wilderness for three days, to bring an offering [sacrifice] to [<b>before<\/b>] Adonoy, our God.’", "pj": "וִיקַבְּלוּן מִינָךְ וְתֵיעוּל אַנְתְּ וְסָבֵי יִשְרָאֵל לְוַת מַלְכָּא דְמִצְרַיִם וְתֵימְרוּן לֵיהּ יְיָ אֱלָהָא דִיהוּדָאֵי אִתְקְרֵי עֲלָנָא וּכְדוּן נֵזֵיל כְּדוּן מַהֲלָךְ תְּלָתָא יוֹמִין בְּמַדְבְּרָא וּנְדַבַּח קֳדָם יְיָ אֱלָהָנָא", "pj_en": "And they will hearken to thee: and thou and the elders of Israel shall go to the king of Mizraim and say to him, The Lord God of the Jehudaee hath called us; and now let us go a journey of three days into the wilderness, to sacrifice before the Lord our God.", "tj": "", "tj_en": "", "rashi": "<b>ושמעו לקלך.<\/b> מִכֵּיוָן שֶׁתֹּאמַר לָהֶם לָשׁוֹן זֶה, יִשְׁמְעוּ לְקוֹלְךָ, שֶׁכְּבָר סִימָן זֶה מָסוּר בְּיָדָם מִיַּעֲקֹב וּמִיּוֹסֵף, שֶׁבְּלָשׁוֹן זֶה הֵם נִגְאָלִים, יַעֲקֹב אָמַר לָהֶם \"וֵאלֹהִים פָּקֹד יִפְקֹד אֶתְכֶם\" (בראשית נ'), יוֹסֵף אָמַר לָהֶם \"פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם\" (שם):<br><br><b>נקרה עלינו.<\/b> לְשׁוֹן מִקְרֶה; וְכֵן \"וַיִּקָּר אֱלֹהִים\", \"וְאָנֹכִי אִקָּרֶה כֹּה\" (במדבר כ\"ג) – אֱהֵא נִקְרֶה מֵאִתּוֹ הֲלֹם:<br><br><b>(אלהי העבריים. <\/b>יו\"ד יתירה, רמז לי' מכות. ברש\"י ישן):  ", "rashi_en": "ושמעו לקלך AND THEY SHALL HEARKEN TO THY VOICE — as soon as you will mention to them this expression (the double use of the verb פקד as in v. 16) they will hearken to your voice, for they have long had this sign as a tradition from Jacob and Joseph that by mention of this phrase their deliverance will be brought about. Jacob said to them “And God will surely visit you”, and Joseph said to them (Genesis 50:25) “God will surely visit you”.<br><br>נקרה עלינו GOD HATH HAPPENED TO MEET US — The word נקרה signifies a casual meeting. Similar are: (Numbers 23:4) “And God happened to meet (ויקר) [Balaam]”; (Numbers 23:15) ואנכי אִקָּרָה כה which means “I will be met by him yonder”.<br><br><b>God of the Hebrews.<\/b> [הָעִבְרִיִּים is written with] an additional <i>yud<\/i> as an allusion to the ten plagues. (From an old Rashi manuscript.)"}, {"ch": 3, "v": 19, "aliyah": 5, "heb": "וַאֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא־יִתֵּ֥ן אֶתְכֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַהֲלֹ֑ךְ וְלֹ֖א בְּיָ֥ד חֲזָקָֽה׃", "onk": "<b>וּקְדָמַי גְלֵי<\/b> אֲרֵי לָא יִשְׁבּוֹק יָתְכוֹן מַלְכָּא דְמִצְרַיִם לְמֵיזָל וְלָא מִן קֳדָם <b>דְחֵילֵהּ<\/b> תַּקִיף:", "onk_en": "I know [<b>It is revealed before Me<\/b>] that the king of Egypt will not allow you to go [on this journey], but not because of his [<b>power is<\/b>] strong hand.", "pj": "וַאֲנָא קֳדָמַי גְלֵי אֲרוּם לָא יִשְׁבּוֹק יַתְכוֹן מַלְכָּא דְמִצְרַיִם לְמֵיזַל וְלָא מִן דְחֵילֵיהּ תַּקִיף אֱלָהֵין בְּגִין דִבְמֵימְרִי לְאוֹכְחוֹתֵיהּ בְּמַכְתָּשִׁין בִּישִׁין", "pj_en": "But it is manifest before Me that the king of Mizraim will not let you go, (no,) not from fear of Him who is Mighty, until that by My Word he shall have been punished with evil plagues.", "tj": "", "tj_en": "", "rashi": "<b>לא יתן אתכם מלך מצרים להלך.<\/b> אִם אֵין אֲנִי מַרְאֶה לוֹ יָדִי הַחֲזָקָה; כְּלוֹמַר, כָּל עוֹד שֶׁאֵין אֲנִי מוֹדִיעוֹ יָדִי הַחֲזָקָה, לֹא יִתֵּן אֶתְכֶם לַהֲלֹךְ:<br><br><b>לא יתן.<\/b> לָא יִשְׁבֹּק כְּמוֹ: \"עַל כֵּן לֹא נְתַתִּיךָ\" (בראשית כ'), \"וְלֹא נְתָנוֹ אֱלֹהִים לְהָרַע עִמָּדִי\" (שם ל\"א), וְכֻלָּן לְשׁוֹן נְתִינָה הֵם. וְיֵ\"מְ <b>ולא ביד חזקה<\/b> — וְלֹא בִּשְׁבִיל שֶׁיָּדוֹ חֲזָקָה, \"כִּי מֵאָז אֶשְׁלַח אֶת יָדִי וְהִכֵּיתִי אֶת מִצְרַיִם וְגוֹ'\", וּמְתַרְגְּמִין אוֹתוֹ \"וְלָא מִן קֳדָם דְּחֵילֵהּ תַּקִּיף\". מִשְּׁמוֹ שֶׁל רַבִּי יַעֲקֹב בְּרַבִּי מְנַחֵם נֶאֱמַר לִי:", "rashi_en": "לא יתן אתכם מלך מצרים להלך THE KING OF EGYPT WILL NOT LET YOU GO, if I do not (ולא) show him My strong hand (יד חזקה) — it is as much as to say: so long as I do not let him feel My strong hand he will not let you go.<br><br>לא יתן — Translate this as the Targum does: he will not give leave. Similar uses of נתן followed by ל with the infinitive in sense of permitting are: (Genesis 20:6) “therefore I did not permit thee (נתתיך) to touch her”; (Genesis 31:7) “And God did not permit him (נתנו) to do me evil”. Still all these passages really have the sense of giving”. Some explain the phrase ולא ביד חזקה to signify: “He will not permit you to go, and this will not be because his hand is strong”, for (v. 20) “As soon as I stretch forth My hand I will smite the Egyptians [… and afterwards he will let you go]”. And so the Targum renders it: and not on account that his power is mighty. This explanation was told me in the name of Rabbi Jacob the son of Menachem."}, {"ch": 3, "v": 20, "aliyah": 5, "heb": "וְשָׁלַחְתִּ֤י אֶת־יָדִי֙ וְהִכֵּיתִ֣י אֶת־מִצְרַ֔יִם בְּכֹל֙ נִפְלְאֹתַ֔י אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה בְּקִרְבּ֑וֹ וְאַחֲרֵי־כֵ֖ן יְשַׁלַּ֥ח אֶתְכֶֽם׃", "onk": "וָאֲשַׁלַח פּוֹן <b>יָת מְחַת גְבֻרְתִּי<\/b> וְאֶמְחֵי יָת מִצְרָאֵי בְּכֹל פְּרִשְׁוָתִי דִי אַעְבֵּד בֵּינֵיהוֹן וּבָתַר כֵּן יְשַׁלַח יָתְכוֹן:", "onk_en": "I will then send forth my hand [<b>the blow of My power<\/b>], and strike Egypt with all My wondrous deeds that I will perform in their midst. Then he [Pharaoh] will send you out.", "pj": "וְתִתְעַכְּבוּן תַּמָן עַד דְאֵשַׁדַר יַת מְחַת גְבוּרְתִּי וְאִמְחֵי יַת מִצְרָאֵי בְּכָל פְּרִשְׁוָותִי דְאֶעְבַּד בֵּינֵיהוֹן וּמִבָּתַר כֵּן יִפְטוֹר יַתְכוֹן", "pj_en": "And ye will be hindered there until I have sent forth the stroke of My power, and have smitten Mizraee with all My wonders, that I will do among them; and afterward he will release you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 21, "aliyah": 5, "heb": "וְנָתַתִּ֛י אֶת־חֵ֥ן הָֽעָם־הַזֶּ֖ה בְּעֵינֵ֣י מִצְרָ֑יִם וְהָיָה֙ כִּ֣י תֵֽלֵכ֔וּן לֹ֥א תֵלְכ֖וּ רֵיקָֽם׃", "onk": "וְאֶתֵּן יָת עַמָא הָדֵין לְרַחֲמִין בְּעֵינֵי מִצְרָאֵי וִיהֵי אֲרֵי תְהָכוּן לָא תְהָכוּן רֵיקָנִין:", "onk_en": "I will give this people grace in the eyes of the Egyptians; and when you go, you will not leave empty handed.", "pj": "וְאֶתֵּן יַת עַמָא הָדֵין לְרַחֲמִין בְּעֵינֵי מִצְרָאֵי וִיהֵי אֲרוּם תַּחֲכוּן מִן תַּמָן פְּרוּקִין לָא תַהֲכוּן רֵיקָנִין", "pj_en": "And I will give this people grace in the eyes of the Mizraee; and it shall be that when ye go free from thence, ye shall not go empty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 22, "aliyah": 5, "heb": "וְשָׁאֲלָ֨ה אִשָּׁ֤ה מִשְּׁכֶנְתָּהּ֙ וּמִגָּרַ֣ת בֵּיתָ֔הּ כְּלֵי־כֶ֛סֶף וּכְלֵ֥י זָהָ֖ב וּשְׂמָלֹ֑ת וְשַׂמְתֶּ֗ם עַל־בְּנֵיכֶם֙ וְעַל־בְּנֹ֣תֵיכֶ֔ם וְנִצַּלְתֶּ֖ם אֶת־מִצְרָֽיִם׃", "onk": "וְתִשְׁאַל אִתְּתָא מִשְׁבַבְתַּהּ וּמִקְרִיבַת בֵּיתַהּ מָנִין דִכְסַף וּמָנִין דִדְהַב וּלְבוּשִׁין וּתְשַׁווּן עַל בְּנֵיכוֹן וְעַל בְּנָתֵיכוֹן וּתְרוֹקִנוּן יָת מִצְרָיִם:", "onk_en": "Every woman shall borrow from her neighbor, and from the woman living in her house, articles of silver and gold, and clothing. You shall put them on your sons and daughters, and thus you will divest Egypt of its wealth.”", "pj": "וְתִשְׁאַל אִתְּתָא מִן שְׁבַבְתָּא וּמִן קְרִיבַת כּוֹתְלֵי בֵיתָהּ מָנִין דִכְסַף וּמָנִין דִדְהַב וּלְבוּשִׁין וּתְעַטְרוּן עַל בָּנֵיכוֹן וְעַל בְּנָתֵיכוֹן וּתְרוֹקִינוּן יַת מִצְרָאֵי", "pj_en": "But a woman shall ask of her neighbour, and from those next to the wall of her house, vessels of silver, and vessels of gold, and vestments; and you shall set them as crowns upon your sons and your daughters, and make the Mizraee empty.", "tj": "מִמְגוּרָתָהּ:", "tj_en": "Fellow resident.", "rashi": "<b>ומגרת ביתה.<\/b> מֵאוֹתָהּ שֶׁהִיא גָרָה אִתָּהּ בַּבַּיִת:<br><br><b>ונצלתם.<\/b> כְּתַרְגוּמוֹ \"וּתְרוֹקִנוּן\", וְכֵן \"וַיְּנַצְּלוּ אֶת מִצְרָיִם\" (שמות י\"ב), \"וַיִּתְנַצְּלוּ בְנֵי יִשְׂרָאֵל אֶת עֶדְיָם\" (שם ל\"ג), וְהַנּוּ\"ן בּוֹ יְסוֹד; וּמְנַחֵם חִבְּרוֹ בְּמַחְבֶּרֶת צָדִ\"י עִם \"וַיַּצֵּל אֱלֹהִים אֶת מִקְנֵה אֲבִיכֶם\", \"אֲשֶׁר הִצִּיל אֱלֹהִים מֵאָבִינוּ\" (בראשית ל\"א), וְלֹא יֵאָמְנוּ דְּבָרָיו, כִּי אִם לֹא הָיְתָה הַנּוּ\"ן יְסוֹד וְהִיא נְקוּדָה בְחִירִק, לֹא תְהֵא מְשַׁמֶּשֶׁת בִּלְשׁוֹן וּפְעַלְתֶּם אֶלָּא בִּלְשׁוֹן וְנִפְעַלְתֶּם, כְּמוֹ \"וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה\" (דברים כ\"ח), \"וְנִתַּתֶּם בְּיַד אוֹיֵב\", וְנִגַּפְתֶּם לִפְנֵי אוֹיְבֵיכֶם (ויקרא כ\"ו), \"וְנִתַּכְתֶּם בְּתוֹכָהּ\" (יחזקאל כ\"ב), \"וַאֲמַרְתֶּם נִצַּלְנוּ\" (ירמיהו ז'), לְשׁוֹן נִפְעַלְנוּ, וְכָל נוּ\"ן שֶׁהִיא בָאָה בְּתֵבָה לִפְרָקִים וְנוֹפֶלֶת מִמֶּנָּה – כְּנוּ\"ן שֶׁל נוֹגֵף, נוֹשֵׂא, נוֹתֵן, נוֹשֵׁךְ – כְּשֶׁהִיא מְדַבֶּרֶת לְשׁוֹן וּפְעַלְתֶּם תִּנָּקֵד בַּחֲטָף, כְּגוֹן \"וּנְשָׂאתֶם אֶת אֲבִיכֶם\" (בראשית מ\"ה), \"וּנְתַתֶּם לָהֶם אֶת אֶרֶץ הַגִּלְעָד\" (במדבר ל\"ב), \"וּנְמַלְתֶּם אֵת בְּשַׂר עָרְלַתְכֶם\" (בראשית י\"ז), לְכָךְ אֲנִי אוֹמֵר שֶׁזֹּאת הַנְּקוּדָה בְּחִירִק מִן הַיְסוֹד הִיא, וִיסוֹד שֵׁם דָּבָר נִצּוּל, וְהוּא מִן הַלְּשׁוֹנוֹת הַכְּבֵדִים, כְּמוֹ דִּבּוּר, כִּפּוּר, לִמּוּד, כְּשֶׁיְּדַבֵּר בִּלְשׁוֹן וּפְעַלְתֶּם, יִנָּקֵד בְּחִירִק כְּמוֹ \"וְדִבַּרְתֶּם אֶל הַסֶּלַע\" (במדבר כ'), \"וְכִפַּרְתֶּם אֶת הַבָּיִת\" (יחזקאל מ\"ה), \"וְלִמַּדְתֶּם אוֹתָם אֶת בְּנֵיכֶם\" (דברים י\"א):", "rashi_en": "ומגרת ביתה means from that woman with whom she sojourneth in one house.<br><br>ונצלתם render it as the Targum does: and ye shall empty out Egypt. Similar are: (Exodus 12:36) “And they emptied out (וינצלו) Egypt”; (Exodus 33:6) “And the children of Israel stripped themselves (ויתנצלו) of their ornaments” The נ in it is a root-letter. Menachem ben Seruk placed it (this word ויתנצלו) in section צ (taking the root as צל not as נצל) together with, (Genesis 31:9) “And God took away (ויצל) your father’s cattle”, and with, (Genesis 31:16) “which God hath taken away (הציל) from our father”, but his view cannot be sustained. For if the נ is not a root-letter, then seeing that it (the word ונצלתם) is vowelled with Chirik, it cannot be used in the sense of “and ye shall do something” (the active voice, which is required here since את מצרים can only be the object of the verb), but in the sense of “and ye shall have something done to you” (the passive — “Niphal”), as (Deuteronomy 28:63) “And ye shall be plucked up (וְנִסַּחְתֶּם) from off your land”; (Leviticus 26:25) “and ye shall be given (וְנִתַּתֶּם) into the hand of the enemy”; (Leviticus 17) “And ye shall be smitten (וְנִגַּפְתָּם) before your enemies”; (Ezekiel 22:21) “And ye shall be melted (וְנִתַּכְתָּם) in the midst thereof”; (Jeremiah 7:10) “And ye say, נִצַּלְנוּ” — which expresses the idea “we have had something done to us” (the Niphal: we have been delivered). Then again, every נ which sometimes appears in a word and sometimes is omitted, as e. g. the נ of נוגף and נושא and נותן and נושך, when the word expresses the sense “and ye shall do something” (the Kal), it is pointed with vocal Sheva (חטף a “snatched” sound), as, for instance, (Genesis 45:19) “and ye shall bear (וּנְשָׂאתָם) your father”; (Numbers 32:29) “And ye shall give (וּנְתַתֶּם) them the land of Gilead”; (Genesis 17:11) “And ye shall circumcise (וּנְמַלְתֶּם) the flesh of your foreskin”. Consequently I am of the opinion that this letter נ which is vowelled with a Chirik is one of the root letters, and the grammatical form of the noun of the same root is נִצּוּל which is of the strong (dageshed) forms, just as דִּבּוּר and כִּפּוּר and לִמּוּד. When, in the case of verbs formed from these roots one expresses the idea of “and ye shall do something” (active voice) the נ has the vowel Chirik (i. e. it is the Piel conjugation), as (Numbers 20:8) “And ye shall speak (וְדִבַּרְתֶּם) unto the rock”; (Ezekiel 45:20) “And ye shall atone (וְכִּפַּרְתֶּם) for the house”; (Deuteronomy 11:19) “And ye shall teach (וְלִמַּדְתָּם) them unto your children”."}, {"ch": 4, "v": 1, "aliyah": 5, "heb": "וַיַּ֤עַן מֹשֶׁה֙ וַיֹּ֔אמֶר וְהֵן֙ לֹֽא־יַאֲמִ֣ינוּ לִ֔י וְלֹ֥א יִשְׁמְע֖וּ בְּקֹלִ֑י כִּ֣י יֹֽאמְר֔וּ לֹֽא־נִרְאָ֥ה אֵלֶ֖יךָ יְהֹוָֽה׃", "onk": "וַאֲתֵיב משֶׁה וַאֲמַר וְהָא לָא יְהֵמְנוּן לִי וְלָא <b>יְקַבְּלוּן מִנִי<\/b> אֲרֵי יֵימְרוּן לָא <b>אִתְגְלֵי<\/b> לָךְ יְיָ:", "onk_en": "Moshe answered and said, “They will not believe me. They will not listen to my voice [<b>obey me<\/b>]. They will say, ‘Adonoy did not appear [<b>become revealed<\/b>] to you.’”", "pj": "וְאָתֵיב משֶׁה וַאֲמַר וְהָא לָא יְהֵימְנוּן לִי וְלָא יְקַבְּלוּן מִנִי אֲרוּם יֵימְרוּן לָא אִיתְגְלֵי לָךְ יְיָ", "pj_en": "And Mosheh answered and said, But, behold, they will not believe me, nor hearken to me; for they will say, The Lord hath not appeared to thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 2, "aliyah": 5, "heb": "וַיֹּ֧אמֶר אֵלָ֛יו יְהֹוָ֖ה <span class=\"mam-kq\"><span class=\"mam-kq-k\">(מזה)<\/span> <span class=\"mam-kq-q\">[מַה־זֶּ֣ה]<\/span><\/span> בְיָדֶ֑ךָ וַיֹּ֖אמֶר מַטֶּֽה׃", "onk": "וַאֲמַר לֵהּ יְיָ מָא דֵין בִּידָךְ וַאֲמַר חוּטְרָא:", "onk_en": "Adonoy said to him, “What is that in your hand?” He said, “A rod.”", "pj": "וַאֲמַר לֵיהּ יְיָ מַה דִין בִּידָךְ וַאֲמַר חוּטְרָא", "pj_en": "And the Lord said to him, What is that in thy hand ? And he said, The rod.", "tj": "", "tj_en": "", "rashi": "<b>מזה בידך.<\/b> לְכָךְ נִכְתַּב תֵּבָה אַחַת, לִדְרֹשׁ: מִזֶּה שֶׁבְּיָדְךָ אַתָּה חַיָּב לִלְקוֹת, שֶׁחָשַׁדְתָּ בִכְשֵׁרִים; וּפְשׁוּטוֹ: כְּאָדָם שֶׁאוֹמֵר לַחֲבֵרוֹ מוֹדֶה אַתָּה שֶׁזּוֹ שֶׁלְּפָנֶיךָ אֶבֶן הִיא? אוֹמֵר לוֹ הֵן; אָמַר לוֹ הֲרֵינִי עוֹשֶׂה אוֹתָהּ עֵץ:", "rashi_en": "מזה בידך WHAT IS THAT IN THINE HAND? —The reason why the words מה זה are written here as one word is to afford the opportunity to explain it thus: on account of this (מִזֶּה) that is in thine hand thou wilt make thyself liable to punishment because thou hast harboured suspicion about worthy persons (Exodus Rabbah 3:12). The real meaning, however, is that it is a question such as one puts to his fellow: “You admit that this object in front of you is a stone?” The other replies, “Yes”. The former says, “Well, I’ll turn it into wood”."}, {"ch": 4, "v": 3, "aliyah": 5, "heb": "וַיֹּ֙אמֶר֙ הַשְׁלִיכֵ֣הוּ אַ֔רְצָה וַיַּשְׁלִכֵ֥הוּ אַ֖רְצָה וַיְהִ֣י לְנָחָ֑שׁ וַיָּ֥נׇס מֹשֶׁ֖ה מִפָּנָֽיו׃", "onk": "וַאֲמַר רְמִיהִי לְאַרְעָא וּרְמָהִי לְאַרְעָא וַהֲוָה לְחִוֵי וַעֲרַק משֶׁה מִן קֳדָמוֹהִי:", "onk_en": "[God] said, “Throw it on the ground.” He [Moshe] threw it on the ground and it turned into a snake. Moshe ran away from it.", "pj": "וַאֲמַר טְלוֹק יָתֵיהּ לְאַרְעָא וְטַלְקֵיהּ לְאַרְעָא וַהֲוָה לְחִוְיָא וַעֲרַק משֶׁה מִן קֳדָמוֹי", "pj_en": "And He said, Cast it on the ground; and he cast it to the ground, and it became a serpent; and Mosheh fled from before it.", "tj": "וַאֲמַר טְלַק יָתֵיהּ לְאַרְעָא וּטְלַק יָתֵיהּ לְאַרְעָא:", "tj_en": "And He said, Cast it on the ground; and he cast it on the ground.", "rashi": "<b>ויהי לנחש.<\/b> רָמַז לוֹ שֶׁסִּפֵּר לָשׁוֹן הָרָע עַל יִשְׂרָאֵל וְתָפַשׂ אֻמָּנוּתוֹ שֶׁל נָחָשׁ (שמות רבה):", "rashi_en": "ויהי לנחש AND IT BECAME A SERPENT — This was an indication to him, that he had slandered the Israelites by saying (v. 1) “But, behold they will not believe me etc.”, and that he had made the serpent’s occupation (slander) his own (cf. Genesis 3:5) (Exodus Rabbah 3:12)."}, {"ch": 4, "v": 4, "aliyah": 5, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה שְׁלַח֙ יָֽדְךָ֔ וֶאֱחֹ֖ז בִּזְנָב֑וֹ וַיִּשְׁלַ֤ח יָדוֹ֙ וַיַּ֣חֲזֶק בּ֔וֹ וַיְהִ֥י לְמַטֶּ֖ה בְּכַפּֽוֹ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אוֹשִׁט יְדָךְ וְאֵחוֹד בְּזַנְבֵהּ וְאוֹשֵׁיט יְדֵהּ וְאַתְקֵף בֵּהּ וַהֲוָה לְחוּטְרָא בִּידֵהּ:", "onk_en": "Adonoy said to Moshe, “Reach out your hand and grasp its tail.” He reached out his hand and took hold of it, and it became a rod in his hand.", "pj": "וַאֲמַר יְיָ לְמשֶה אוֹשִׁיט יְדָךְ וְאֵיחוּד בְּקוּטְנֵיהּ וְאוֹשִׁיט יְדֵיהּ וְאַתְקֵיף בֵּיהּ וַהֲוָה לְחוּטְרָא בִּידֵיהּ", "pj_en": "And the Lord said to Mosheh, Stretch forth thy hand and seize (it) by its tail. And he stretched forth his hand and grasped it, and it became the rod in his hand:", "tj": "וְתִתְקוֹף בְּבֵית קוּטְנוֹי:", "tj_en": "And grasp the place of its tail.", "rashi": "<b>ויחזק בו.<\/b> לְשׁוֹן אֲחִיזָה הוּא; וְהַרְבֵּה יֵשׁ בַּמִּקְרָא, \"וַיַּחֲזִיקוּ הָאֲנָשִׁים בְּיָדוֹ\" (בראשית י\"ט), \"וְהֶחֱזִיקָה בִּמְבֻשָׁיו\" (דברים כ\"ה), \"וְהֶחֱזַקְתִּי בִּזְקָנוֹ\" (שמואל א י\"ז), (כָּל לְשׁוֹן חִזּוּק הַדָּבוּק לְבֵי\"ת לְשׁוֹן אֲחִיזָה הוּא):", "rashi_en": "ויחזק בו AND HE LAID HOLD OF IT —The phrase signifies “grasping” (אחז). There are many examples of it in the Scriptures: (Genesis 19:16) “The men laid hold of (ויחזיקו בְּ..) his hand”; (Deuteronomy 25:11) “And she layeth hold of (והחזיקה בְּ..) his secret parts”; (I Samuel 17:35) “And I caught him by (והחזקתי בְּ..) his beard”. [Wherever the root חזק in the Hiphil is followed by the preposition ב it denotes “taking hold of a thing”]."}, {"ch": 4, "v": 5, "aliyah": 5, "heb": "לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי־נִרְאָ֥ה אֵלֶ֛יךָ יְהֹוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵאלֹהֵ֥י יַעֲקֹֽב׃", "onk": "בְּדִיל דִיהֵמְנוּן אֲרֵי <b>אִתְגְלִי<\/b> לָךְ יְיָ אֱלָהָא דְאַבְהַתְהוֹן אֱלָהֵהּ דְאַבְרָהָם אֱלָהֵהּ דְיִצְחָק וֵאֵלָהֵהּ דְיַעֲקֹב:", "onk_en": "“This is so that they will believe that Adonoy appeared [<b>became revealed<\/b>] to you; the God of their fathers, God of Avraham, God of Yitzchok and God of Yaakov.”", "pj": "מִן בִּגְלַל דִיהֵמְנוּן אֲרוּם אִתְגְלֵי לָךְ יְיָ אֱלָהָא דְאַבָהַתְכוֹן אֱלָהֵיהּ דְאַבְרָהָם אֱלָהֵיהּ דְיִצְחָק וֵאלָהֵיהּ דְיַעֲקב", "pj_en": "In order that they may believe that the Lord God of their fathers, the God of Abraham, the God of Izhak, and the God of Jakob, hath revealed Himself to thee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 6, "aliyah": 5, "heb": "וַיֹּ֩אמֶר֩ יְהֹוָ֨ה ל֜וֹ ע֗וֹד הָֽבֵא־נָ֤א יָֽדְךָ֙ בְּחֵיקֶ֔ךָ וַיָּבֵ֥א יָד֖וֹ בְּחֵיק֑וֹ וַיּ֣וֹצִאָ֔הּ וְהִנֵּ֥ה יָד֖וֹ מְצֹרַ֥עַת כַּשָּֽׁלֶג׃", "onk": "וַאֲמַר יְיָ לֵהּ עוֹד אָעֵיל כְּעַן יְדָךְ בְּעִטְפָךְ וְאָעֵיל יְדֵהּ בְּעִטְפֵהּ וְאַפְקַהּ וְהָא יְדֵהּ <b>חַוְרָא כְתַלְגָא<\/b>:", "onk_en": "Adonoy said furthermore to him [Moshe], “Put your hand into your bosom.” He put his hand into his bosom, and when he withdrew it, his hand had become a snow-like tzora’as [<b>white as snow<\/b>].", "pj": "וַאֲמַר יְיָ לֵיהּ תּוּב אָעֵל כְּדוֹן יְדָךְ בְּחוּבָךְ וְאָעֵיל יָתֵיהּ בְּגוֹ חוּבֵיהּ וְהַנְפָּקָהּ וְהָא יְדֵיהּ סְגִירְתָּא מְחַוְורָא הִיא כְּתַלְגָא", "pj_en": "And the Lord said to him again, Put now thy hand within thy breast (Choba); and he put it within his breast, and withdrew it, and, behold, his hand was leprous, it was white as snow.", "tj": "", "tj_en": "", "rashi": "<b>מצרעת כשלג.<\/b> דֶּרֶךְ צָרַעַת לִהְיוֹת לְבָנָה – \"וְאִם בַּהֶרֶת לְבָנָה הִיא\" (ויקרא י\"ג); אַף בְּאוֹת זֶה רָמַז לוֹ שֶׁלָּשׁוֹן הָרָע סִפֵּר בְּאָמְרוֹ לֹא יַאֲמִינוּ לִי, לְפִיכָךְ הִלְקָהוּ בְצָרַעַת, כְּמוֹ שֶׁלָּקְתָה מִרְיָם עַל לָשׁוֹן הָרָע (שבת צ\"ז):", "rashi_en": "מצרעת כשלג LEPROUS AS SNOW — It is the nature of leprosy to be white, and thus we read in reference to a leper, (Leviticus 13:4) “If the bright spot be white [in the skin of his flesh]”. By this sign, too, he indicated that he had made a slanderous statement when he said, (v. 1) “But, behold, they will not believe me”. Therefore He smote him with leprosy (Exodus Rabbah 3:13) even as Miriam was so smitten for the slander she had spoken (cf. Shabbat 97a)."}, {"ch": 4, "v": 7, "aliyah": 5, "heb": "וַיֹּ֗אמֶר הָשֵׁ֤ב יָֽדְךָ֙ אֶל־חֵיקֶ֔ךָ וַיָּ֥שֶׁב יָד֖וֹ אֶל־חֵיק֑וֹ וַיּֽוֹצִאָהּ֙ מֵֽחֵיק֔וֹ וְהִנֵּה־שָׁ֖בָה כִּבְשָׂרֽוֹ׃", "onk": "וַאֲמַר אָתֵיב יְדָךְ לְעִטְפָךְ וַאֲתֵיב יְדֵהּ לְעִטְפֵהּ וְאַפְקַהּ מֵעִטְפֵהּ וְהָא תָבַת הֲוַת כְּבִשְׂרֵהּ:", "onk_en": "He [Adonoy] said, “Put your hand into your bosom again.” [Moshe] put his hand into his bosom again, and when he withdrew it from his bosom, it had become [normal] as his flesh.", "pj": "וַאֲמַר אָתֵיב יְדָךְ לְעִיטְפָךְ וְאָתֵיב יְדֵיהּ לְחוּבֵיהּ וְהַנְפָּקָהּ מִן גוֹי חוּבֵיהּ וְתָבַת לְמֶהֱוֵי בַרְיָא הֵי כְּבִישְרֵיהּ", "pj_en": "And He said, Return thy hand into thy bosom (Aitaph); and he returned his hand to his breast, and withdrew it from his breast, and it had become clean as his flesh.", "tj": "אָעֵיל כְּעַן יְדָךְ בְּחוּבָךְ וְאָעֵיל יְדֵיהּ בְּחוּבֵיהּ:", "tj_en": "Put now thy hand into thy breast, and he put his hand within his breast.", "rashi": "<b>ויוצאה מחיקו והנה שבה כבשרו.<\/b> מִכָּאן שֶׁמִּדָּה טוֹבָה מְמַהֶרֶת לָבֹא מִמִּדַּת פֻּרְעָנוּת, שֶׁהֲרֵי בָרִאשׁוֹנָה לֹא נֶאֱמַר \"מֵחֵיקוֹ\" (שם):", "rashi_en": "ויוצאה מחיקו והנה שבה כבשרו AND HE BROUGHT IT OUT OF HIS BOSOM AND, BEHOLD, IT HAD RETURNED AS HIS OTHER FLESH — From this we may infer that the measure of Divine good comes more quickly than the measure of the punishment He inflicts, for in the former case it does not say מחיקו after the word ויוצאה. (Shabbat 97a; Exodus Rabbah 3:13)."}, {"ch": 4, "v": 8, "aliyah": 5, "heb": "וְהָיָה֙ אִם־לֹ֣א יַאֲמִ֣ינוּ לָ֔ךְ וְלֹ֣א יִשְׁמְע֔וּ לְקֹ֖ל הָאֹ֣ת הָרִאשׁ֑וֹן וְהֶֽאֱמִ֔ינוּ לְקֹ֖ל הָאֹ֥ת הָאַחֲרֽוֹן׃", "onk": "וִיהֵי אִם לָא יְהֵמְנוּן לָךְ וְלָא <b>יְקַבְּלוּן<\/b> לְקַל אָתָא קַדְמָאָה וִיהֵמְנוּן לְקַל אָתָא בַתְרָאָה:", "onk_en": "“If they do not believe you, and they do not listen to [<b>accept<\/b>] the voice [of proof] of the first [miraculous] sign; then they will believe the voice [of proof] of the latter [second] sign.", "pj": "וִיהֵי אִם לָא יְהֵימְנוּן לָךְ וְלָא יְקַבְּלוּן לְקַל אָתָא קַדְמָאָה וִיהֵמְנוּן לְקַל אָתָא בַּתְרָאָה", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>והאמינו לקל האת האחרון.<\/b> מִשֶּׁתֹּאמַר לָהֶם בִּשְׁבִילְכֶם לָקִיתִי, עַל שֶׁסִּפַּרְתִּי עֲלֵיכֶם לָשׁוֹן הָרָע, יַאֲמִינוּ לְךָ, שֶׁכְּבָר לָמְדוּ בְכָךְ שֶׁהַמִּזְדַּוְּגִין לְהָרַע לָהֶם לוֹקִים בִּנְגָעִים, כְּגוֹן פַּרְעֹה וַאֲבִימֶלֶךְ בִּשְׁבִיל שָׂרָה:", "rashi_en": "והאמינו לקל האת האחרון THEY WILL BELIEVE THE VOICE OF THE LATTER SIGN — As soon as you say to them, “On your account have I been smitten — because I uttered slander about you”, they will believe you, for they are already experienced in this: that those who combine to harm them are smitten by plagues, e. g., Pharaoh and Abimelech who were punished on Sarah’s account."}, {"ch": 4, "v": 9, "aliyah": 5, "heb": "וְהָיָ֡ה אִם־לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִשְׁנֵ֨י הָאֹת֜וֹת הָאֵ֗לֶּה וְלֹ֤א יִשְׁמְעוּן֙ לְקֹלֶ֔ךָ וְלָקַחְתָּ֙ מִמֵּימֵ֣י הַיְאֹ֔ר וְשָׁפַכְתָּ֖ הַיַּבָּשָׁ֑ה וְהָי֤וּ הַמַּ֙יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן־הַיְאֹ֔ר וְהָי֥וּ לְדָ֖ם בַּיַּבָּֽשֶׁת׃", "onk": "וִיהֵי אִם לָא יְהֵמְנוּן אַף לִתְרֵין אָתַיָא הָאִלֵּין וְלָא <b>יְקַבְּלוּן מִנָךְ<\/b> וְתִסַב מִמַיָא דִבְנַהֲרָא וְתֵשׁוֹד לְיַבֶּשְׁתָּא וִיהוֹן מַיָא דִי תִסַב מִן נַהֲרָא וִיהוֹן לִדְמָא בְּיַבֶּשְׁתָּא:", "onk_en": "And if they will not believe even these two signs, and they will not listen to your voice [<b>accept you<\/b>], then you shall take from the water of the river and pour it on the dry land. The water that you will take from the river will turn into blood on the dry land.”", "pj": "וִיהֵי אִין לָא יְהֵימְנוּן אוּף לִתְרֵין אָתַיָא הָאִילֵן וְלָא יְקַבְּלוּן מִינָךְ וְתִסַב מִן מוֹי דִבְנַהֲרָא וְתֵשׁוֹד לְיַבֶּשְׁתָּא וִיהוֹן מוֹי דְתִיסַב מִן נַהֲרָא וִיהוֹן לִדְמָא בְּיַבֶּשְׁתָּא", "pj_en": "And if they believe not these two signs, nor receive from thee, thou shalt take of the water of the river and pour it on the ground, and the water that thou shalt take from the river shall become blood upon the ground.", "tj": "", "tj_en": "", "rashi": "<b>ולקחת ממימי היאור. <\/b>רמז להם שבמכה ראשונה נפרע מאלהותם, (פירוש, כשהקב\"ה נפרע מן האומות, נפרע מאלהותם תחלה, שהיו עובדים לנילוס המחיה אותם, והפכם לדם. ברש\"י ישן):<br><br><b>והיו המים וגו'.<\/b> \"וְהָיוּ\" \"וְהָיוּ\", ב' פְּעָמִים נִרְאֶה בְעֵינַי, אִלּוּ נֶאֱמַר וְהָיוּ הַמַּיִם אֲשֶׁר תִּקַּח מִן הַיְאוֹר לְדָם בַּיַּבָּשֶׁת, שׁוֹמֵעַ אֲנִי, שֶׁבְּיָדוֹ הֵם נֶהְפָּכִים לְדָם – וְאַף כְּשֶׁיֵּרְדוּ לָאָרֶץ יִהְיוּ בַּהֲוָיָתָן, אֲבָל עַכְשָׁו מְלַמְּדֵנוּ שֶׁלֹּא יִהְיוּ דָם עַד שֶׁיִּהְיוּ בַיַּבָּשֶׁת:", "rashi_en": "<b>You shall take from the water of the river.<\/b> He alluded to them that with the first plague He will exact retribution from their deity (Explanation: When God exacts retribution from the nations He first exacts retribution from their deity, for they had worshipped the Nile which gave them sustenance and He turned them (its waters) to blood. [This explanation is found] in an old Rashi manuscript.<br><br>והיו המים וגו׳ — Here we have the word והיו twice. It appears to me that if it was stated היאר לדם ביבשת מן והיו המים אשר תקח, I might understand it to mean that it would be turned into blood in his hand and that also when it reached the ground it would retain that state (more lit., it would be as it was). But now (as the text stands) it tells us that it would not become blood until it would come on the dry ground."}, {"ch": 4, "v": 10, "aliyah": 5, "heb": "וַיֹּ֨אמֶר מֹשֶׁ֣ה אֶל־יְהֹוָה֮ בִּ֣י אֲדֹנָי֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִתְּמוֹל֙ גַּ֣ם מִשִּׁלְשֹׁ֔ם גַּ֛ם מֵאָ֥ז דַּבֶּרְךָ֖ אֶל־עַבְדֶּ֑ךָ כִּ֧י כְבַד־פֶּ֛ה וּכְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי׃", "onk": "וַאֲמַר משֶׁה <b>קֳדָם<\/b> יְיָ בְּבָעוּ יְיָ לָא גְבַר דְמִלוּל אֲנָא אַף מִתְּמַלִי אַף מִדְקָמוֹהִי אַף מֵעִדַן דְמַלֶלְתָּא עִם עַבְדָךְ אֲרֵי <b>יַקִיר מַמְלָל<\/b> וְעַמִיק לִישָׁן אֲנָא:", "onk_en": "Moshe said to [<b>before<\/b>] Adonoy, “I beg You Adonoy, I am not a man of words—not since yesterday, not since the day before—not from the time You [first] spoke to Your servant, for I am clumsy [slow] of mouth [speech] [<b>heavy of speech<\/b>] and clumsy [slow] of tongue [language].”", "pj": "וַאֲמַר משֶׁה קֳדָם יְיָ בְּבָעוּ יְיָ לָא גְבַר דַבְּרָן אֲנָא אוּף מֵאִתְמְלֵי אוּף מִן לְקָדָמוֹי אוּף מִן שַׁעְתָּא דְמַלֵילְתָּא עִם עַבְדָךְ אֲרוּם חֲגַר פּוּם וַחֲגַר מַמְלֵל אֲנָא", "pj_en": "And Mosheh said before the Lord, O Lord, I pray: I am not a man of words, nor ever have been before that Thou didst speak with Thy servant; for I am of a staggering * mouth and staggering speech. *Or, lame", "tj": "אֲרוּם חֲגִיר פּוּם וּקְשֵׁי מַמְלֵל אֲנָא:", "tj_en": "For of a staggering mouth and difficult speech am I.", "rashi": "<b>גם מתמול וגו'.<\/b> לָמַדְנוּ שֶׁכָּל ז' יָמִים הָיָה הַקָּבָּ\"ה מְפַתֶּה אֶת מֹשֶׁה בַּסְּנֶה לֵילֵךְ בִּשְׁלִיחוּתוֹ, \"מִתְּמוֹל\", \"שִׁלְשֹׁם\", \"מֵאָז דַּבֶּרְךָ\" הֲרֵי ג' וּשְׁלוֹשָׁה גַמִּין רִבּוּיִין הֵם, הֲרֵי שִׁשָּׁה, וְהוּא הָיָה עוֹמֵד בַּיּוֹם הַשְּׁבִיעִי כְּשֶׁאָמַר לוֹ זֹאת עוֹד שְׁלַח נָא בְּיַד תִּשְׁלָח, עַד שֶׁחָרָה בּוֹ וְקִבֵּל עָלָיו (שמות רבה); וְכָל זֶה שֶׁלֹּא הָיָה רוֹצֶה לִטֹּל גְּדֻלָּה עַל אַהֲרֹן אָחִיו שֶׁהָיָה גָּדוֹל הֵימֶנּוּ וְנָבִיא הָיָה, שֶׁנֶּאֱמַר \"הֲנִגְלֹה נִגְלֵיתִי אֶל בֵּית אָבִיךָ בִּהְיוֹתָם בְּמִצְרַיִם\" (שמואל א ב') – הוּא אַהֲרֹן, וְכֵן \"וָאִוָּדַע לָהֶם בְּאֶרֶץ מִצְרַיִם … וָאֹמַר אֲלֵיהֶם אִישׁ שִׁקּוּצֵי עֵינָיו הַשְׁלִיכוּ\" (יחזקאל כ'), וְאוֹתָהּ נְבוּאָה לְאַהֲרֹן נֶאֶמְרָה (תנחומא):<br><br><b>כבד פה.<\/b> בִּכְבֵדוּת אֲנִי מְדַבֵּר. וּבִלְשׁוֹן לַעַז בלב\"ו:", "rashi_en": "גם מתמול וגו׳ NEITHER FROM YESTERDAY [NOR FROM BEFORE YESTERDAY] — This teaches us that for an entire period of seven days God had been endeavouring to persuade Moses at the thornbush to go on his mission, for the terms מתמול and שלשום and מאז דברך imply three days, and the three-fold גם which is mentioned here point to three extensions of the period, making six in all, and therefore he had now reached the seventh day when he further said to him, (Exodus v. 13) “Send, I pray thee, by the hand of him whom Thou wilt send” — until God became angry with him (Exodus v. 14), and he accepted the mission (cf. Leviticus Rabbah 11:6, and Seder Olam ch. 5). All this reluctance was because he was unwilling to assume any dignity that would make him superior to his brother Aaron who was older than he and was also a prophet, as it is said (I Samuel 2:27) that the man of God spoke to Eli, the high-priest, in God’s name, “Surely I revealed myself unto the house of thy father when they were in Egypt” — thy father means Aaron. Similary in : (Ezekiel 20:5, 7) “And I made myself known unto them in the land of Egypt … and I said unto them, “cast ye away every man the detestable things of his eyes”, and that prophecy was spoken to Aaron (Exodus Rabbah 3:16; and cf. ברייתא דל\"ב מדות).<br><br>כבד פה SLOW OF SPEECH (lit. heavy of mouth) — I speak heavily (with difficulty); old French balbus. (English = stammerer)."}, {"ch": 4, "v": 11, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֵלָ֗יו מִ֣י שָׂ֣ם פֶּה֮ לָֽאָדָם֒ א֚וֹ מִֽי־יָשׂ֣וּם אִלֵּ֔ם א֣וֹ חֵרֵ֔שׁ א֥וֹ פִקֵּ֖חַ א֣וֹ עִוֵּ֑ר הֲלֹ֥א אָנֹכִ֖י יְהֹוָֽה׃", "onk": "וַאֲמַר יְיָ לֵהּ מָן שַׁוִי פּוּמָא לַאֲנָשָׁא אוֹ מָן שַׁוִי אִלְמָא אוֹ חֵרְשָׁא אוֹ פִקְחָא אוֹ עַוִירָא הֲלָא אֲנָא יְיָ:", "onk_en": "Adonoy said to him, “Who gave man a mouth, or who makes [a person] dumb or deaf? [Who makes a person] see or makes him blind? Is it not I—Adonoy?”", "pj": "וַאֲמַר יְיָ לֵיהּ מַאן הוּא דְשַׁוֵי מַמְלֵל פּוּמָא בְּפוּם אָדָם קַדְמָאִי אוֹ מַאן שַׁוִי אַלִימָא אוֹ חַרְשָׁא אוֹ פִּתִיחָא אוֹ סַמְיָא הֲלָא אֲנָא יְיָ", "pj_en": "And the Lord said, Who is he who first put the language of the mouth into the mouth of man? or who hath appointed the dumb or the deaf, the open-seeing or the blind, but I the Lord?", "tj": "", "tj_en": "", "rashi": "<b>מי שם פה וגו'.<\/b> מִי לִמְּדֶךָ לְדַבֵּר, כְּשֶׁהָיִיתָ נִדּוֹן לִפְנֵי פַרְעֹה עַל הַמִּצְרִי?<br><br><b>או מי ישום אלם.<\/b> מִי עָשָׂה פַרְעֹה אִלֵּם, שֶׁלֹּא נִתְאַמֵּץ בְּמִצְוַת הֲרִיגָתְךָ, וְאֶת מְשָׁרְתָיו חֵרְשִׁים שֶׁלֹּא שָׁמְעוּ בְּצַוּוֹתוֹ עָלֶיךָ, וְאֶת אֶסְפַּקְלָטוֹרִין הַהוֹרְגִים מִי עֲשָׂאָם עִוְרִים שֶׁלֹּא רָאוּ כְּשֶׁבָּרַחְתָּ מִן הַבִּימָה וְנִמְלַטְתָּ?<br><br><b>הלא אנכי.<\/b> שֶׁשְּׁמִי ה' עָשִׂיתִי כָל זֹאת (שם):", "rashi_en": "מי שם פה וגו׳ WHO HATH MADE MAN’S MOUTH etc.? — Who taught you to speak when you were arraigned in judgment before Pharaoh on account of the Egyptian whom you slew?<br><br>או מי ישום אלם OR WHO MAKETH THE DUMB — Who made Pharaoh dumb so that he could not insist upon the carrying out of his command to kill you? Who made his ministers deaf so that they could not hear when he gave orders concerning you? And the executioners whose task it was to slay — who made them blind so that they could not see when you fled from the platform (raised place of execution) and escaped? (Midrash Tanchuma, Shemot 10)<br><br>הלא אנכי ה' DID NOT I whose name is THE LORD do all this?"}, {"ch": 4, "v": 12, "aliyah": 5, "heb": "וְעַתָּ֖ה לֵ֑ךְ וְאָנֹכִי֙ אֶֽהְיֶ֣ה עִם־פִּ֔יךָ וְהוֹרֵיתִ֖יךָ אֲשֶׁ֥ר תְּדַבֵּֽר׃", "onk": "וּכְעַן אֱזֵיל <b>וּמֵימְרִי<\/b> יְהֵא עִם פּוּמָךְ וְאַלֵפִנָךְ דִי תְמַלֵל:", "onk_en": "Now go. I [<b>My Word<\/b>] will be with your mouth, and teach you what to say.”", "pj": "וּכְדוֹן אִיזֵל וַאֲנָא בְּמֵימְרִי אֱהֵא עִם מַמְלֵל פּוּמָךְ וַאֲלִיף יָתָךְ מַה דִתְמַלֵיל", "pj_en": "And now go, and I by My Word will be with the speaking of thy mouth, and will teach thee what thou shalt say.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 13, "aliyah": 5, "heb": "וַיֹּ֖אמֶר בִּ֣י אֲדֹנָ֑י שְֽׁלַֽח־נָ֖א בְּיַד־תִּשְׁלָֽח׃", "onk": "וַאֲמַר בְּבָעוּ יְיָ שְׁלַח כְּעַן בְּיַד <b>מָן דְכָשַׁר דְתִשְׁלַח<\/b>:", "onk_en": "[Moshe] said, “I beg You Adony [my Master,] please [<b>now<\/b>] send the one You usually send [<b>who is fit to be sent<\/b>].”", "pj": "וַאֲמַר בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ יְיָ שְׁלַח כְּדוֹן שְׁלִיחוּתָךְ בְּיַד פִּנְחָס דְחָמֵי לְמִשְׁתַּלְחָא בְּסוֹף יוֹמַיָא", "pj_en": "And he said, I pray for mercy before the Lord. Send now Thy sending by the hand of Phinehas, by whom it is to be sent at the end of the days.", "tj": "שְׁלַח כְּעַן בְּיַד דֵין דְחָמֵי לֵיהּ לְמִשְׁתַּלְחָא:", "tj_en": "Send now by the hand of him by whom it is opportune to send.", "rashi": "<b>ביד תשלח.<\/b> בְּיַד מִי שֶׁאַתָּה רָגִיל לִשְׁלֹחַ, וְהוּא אַהֲרֹן. דָּ\"אַ: בְּיַד אַחֵר שֶׁתִּרְצֶה לִשְׁלֹחַ, אֵין סוֹפִי לְהַכְנִיסָם לָאָרֶץ וְלִהְיוֹת גּוֹאֲלָם לֶעָתִיד, יֵשׁ לְךָ שְׁלוּחִים הַרְבֵּה:", "rashi_en": "ביד תשלח signifies by the hand of him whom Thou art accustomed to send; viz., Aaron (Exodus Rabbah 3:16). Another explanation is: by the hand of some other person whom Thou wilt be pleased to send — for in the end “I” shall not bring them into the land of Palestine nor shall “I” become their deliverer in the future — and You have many messengers! (Pirkei DeRabbi Eliezer 40)"}, {"ch": 4, "v": 14, "aliyah": 5, "heb": "וַיִּֽחַר־אַ֨ף יְהֹוָ֜ה בְּמֹשֶׁ֗ה וַיֹּ֙אמֶר֙ הֲלֹ֨א אַהֲרֹ֤ן אָחִ֙יךָ֙ הַלֵּוִ֔י יָדַ֕עְתִּי כִּֽי־דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְגַ֤ם הִנֵּה־הוּא֙ יֹצֵ֣א לִקְרָאתֶ֔ךָ וְרָאֲךָ֖ וְשָׂמַ֥ח בְּלִבּֽוֹ׃", "onk": "וּתְקֵיף רוּגְזָא דַיְיָ בְּמשֶׁה וַאֲמַר הֲלָא אַהֲרֹן אָחוּךְ לֵוָאֵי <b>גְלֵי קֳדָמַי<\/b> אֲרֵי מַלָלָא יְמַלֵל הוּא וְאַף הָא הוּא נָפֵק לְקַדָמוּתָךְ וְיֶחֱזִנָךְ וְיֶחְדֵי בְלִבֵּהּ:", "onk_en": "Adonoy displayed anger toward Moshe and said, “Is not Aharon, the Levite, your brother? I know [<b>It is revealed before Me<\/b>] that he knows how to speak. Behold he is setting out to meet you, and when he sees you he will rejoice in his heart.", "pj": "וּתְקֵיף רוּגְזָא דַיְיָ בְּמשֶׁה וַאֲמַר הֲלָא אַהֲרן אָחוּךְ לֵיוָאֵי גְלֵי קֳדָמַי אֲרוּם מַלָלָא יְמַלֵיל הוּא וְאוּף הָא הוּא נָפֵיק לִקְדָמוּתָךְ וְיַחֲמִינָךְ וִיחֲדֵי בְּלִבֵּיהּ", "pj_en": "And the anger of the Lord was kindled against Mosheh, and He said, Is it not manifest before Me that Aharon thy brother speaking can speak? And, behold, also, he cometh forth to meet thee, and will see thee and rejoice in his heart.", "tj": "", "tj_en": "", "rashi": "<b>ויחר אף.<\/b> רַבִּי יְהוֹשֻׁעַ בֶּן קָרְחָה אוֹמֵר כָּל חֲרוֹן אַף שֶׁבַּתּוֹרָה עוֹשֶׂה רֹשֶׁם וְזֶה לֹא נֶאֱמַר בּוֹ רֹשֶׁם וְלֹא מָצִינוּ שֶׁבָּא עֹנֶשׁ עַ\"יְ אוֹתוֹ חָרוֹן; אָמַר לוֹ רַבִּי יוֹסֵי אַף בְּזוֹ נֶאֱמַר בּוֹ רֹשֶׁם – <b>הלא אהרן אחיך הלוי<\/b> – שֶׁהָיָה עָתִיד לִהְיוֹת לֵוִי וְלֹא כֹּהֵן, וְהַכְּהֻנָּה הָיִיתִי אוֹמֵר לָצֵאת מִמְּךָ, מֵעַתָּה לֹא יִהְיֶה כֵן אֶלָּא הוּא יִהְיֶה כֹּהֵן וְאַתָּה הַלֵּוִי, שֶׁנֶּאֱמַר \"וּמֹשֶׁה אִישׁ הָאֱלֹהִים בָּנָיו יִקָּרְאוּ עַל שֵׁבֶט הַלֵּוִי\" (דהי\"א כ\"ג) (זבחים ק\"ב):<br><br><b>הנה הוא יצא לקראתך.<\/b> כְּשֶׁתֵּלֵךְ לְמִצְרַיִם:<br><br><b>וראך ושמח בלבו.<\/b> לֹא כְשֶׁאַתָּה סָבוּר, שֶׁיְּהֵא מַקְפִּיד עָלֶיךָ שֶׁאַתָּה עוֹלֶה לִגְדֻלָּה; וּמִשָּׁם זָכָה אַהֲרֹן לַעֲדִי הַחֹשֶׁן הַנָּתוּן עַל הַלֵּב (שבת קל\"ט):", "rashi_en": "ויחר אף AND [THE LORD’S] WRATH GLOWED — Rabbi Joshua the son of Korcha said: wherever the term “and God’s wrath glowed” occurs in the Scriptures it leaves a definite impression (mention of punishment of some kind follows), but here no such result is mentioned, for we do not find that any punishment came upon Moses in consequence of that anger of God. Rabbi José said to him: As a matter of fact here, too, some definite result is mentioned, viz., הלא אהרן אחיך הלוי “Is not Aaron the Levite thy brother?” — which implies, that he was destined to be a Levite (an attendant on the priests) and not a priest, — and I intended that the priesthood should proceed from you. Now, however, this shall not be so, but he will be the Priest and you the Levite, as it is said, (I Chronicles 23:14) “But as for Moses the man of God his sons are named among the tribe of Levi” (Zevachim 102a).<br><br>הנה הוא יצא לקראתך HE WILL BE GOING FORTH TOWARDS THEE, when you will be going to Egypt.<br><br>וראך ושמח בלבו AND WHEN HE SEETH THEE, HE WILL BE GLAD IN HIS HEART — not as you believe, that he will be angry with you because you have attained a high position. In consequence of this, Aaron was privileged to wear the ornament of the breastplate which was placed over his heart (cf. Exodus 28:29) (Shabbat 139a; Exodus Rabbah 3:17)."}, {"ch": 4, "v": 15, "aliyah": 5, "heb": "וְדִבַּרְתָּ֣ אֵלָ֔יו וְשַׂמְתָּ֥ אֶת־הַדְּבָרִ֖ים בְּפִ֑יו וְאָנֹכִ֗י אֶֽהְיֶ֤ה עִם־פִּ֙יךָ֙ וְעִם־פִּ֔יהוּ וְהוֹרֵיתִ֣י אֶתְכֶ֔ם אֵ֖ת אֲשֶׁ֥ר תַּעֲשֽׂוּן׃", "onk": "וּתְמַלֵל עִמֵהּ וּתְשַׁוִי יָת פִּתְגָמַיָא בְּפוּמֵהּ <b>וּמֵימְרִי<\/b> יְהֵי עִם פּוּמָךְ וְעִם פּוּמֵהּ וְאַלֵיף יָתְכוֹן יָת דִי תַעְבְּדוּן:", "onk_en": "You will speak to him and put the words in his mouth. I [<b>My Word<\/b>] will be with your mouth and with his mouth, and I will teach you what to do.", "pj": "וּתְמַלֵל עִמֵיהּ וּתְשַׁוֵי יַת פִּתְגָמַיָא בְּפוּמֵיהּ וּמֵימְרִי יְהֵי עִם מֵימַר פּוּמָךְ וְעִם מֵימַר פּוּמֵיהּ וְאַלִיף יַתְכוֹן יַת מַה דְתַעַבְּדוּן", "pj_en": "And thou shalt speak with him, and put the matter in his mouth, and My Word shall be with the word of thy mouth, and with the word of his mouth, and I will instruct you what you are to do.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 16, "aliyah": 5, "heb": "וְדִבֶּר־ה֥וּא לְךָ֖ אֶל־הָעָ֑ם וְהָ֤יָה הוּא֙ יִֽהְיֶה־לְּךָ֣ לְפֶ֔ה וְאַתָּ֖ה תִּֽהְיֶה־לּ֥וֹ לֵֽאלֹהִֽים׃", "onk": "וִימַלֵל הוּא לָךְ לְעַמָא וִיהֵי הוּא יְהֵי לָךְ לִמְתֻרְגְמָן וְאַתְּ תְּהֵי לֵהּ לְרָב:", "onk_en": "He will speak to the people for you. He will be your spokesman, and you will be his master.", "pj": "וִימַלֵיל הוּא לָךְ עִם עַמָא וִיהֵי הוּא יֶהֱוֵי לָךְ לִמְתֻּרְגְמִין וְאַנְתְּ תֶּהֱוֵי לֵיהּ לְרַב תְּבוֹעַ אוּלְפַן מִן קֳדָם יְיָ", "pj_en": "And he shall speak for thee with the people, and be to thee an interpreter, and thou to him the principal, seeking instruction from before the Lord.", "tj": "הוּא יֶהֱוֵי לָךְ לִמְתּוּרְגְמָן וְאַתְּ תֶּהֱוֵי לֵיהּ כִּתְבַע אוּלְפַן מִן קֳדָם יְיָ:", "tj_en": "He shall be to thee an interpreter, and thou to him one inquiring instruction from before the Lord.", "rashi": "<b>ודבר הוא לך.<\/b> בִּשְׁבִילְךָ יְדַבֵּר אֶל הָעָם. וְזֶה יוֹכִיחַ עַל כָּל לְךָ וְלִי וְלוֹ וְלָכֶם וְלָהֶם הַסְּמוּכִים לְדִבּוּר שֶׁכֻּלָּם לְשׁוֹן עַל הֵם:<br><br><b>יהיה לך לפה.<\/b> לְמֵלִיץ, לְפִי שֶׁאַתָּה כְבַד פֶּה:<br><br><b>לאלהים.<\/b> לְרַב וּלְשַׂר:", "rashi_en": "ודבר הוא לך means HE WILL SPEAK to the people ON THY ACCOUNT (לְךָ). This passage is proof, regarding every usage of לך and לי and לו and לכם and להם that follow after the verb דבר, that they all have the meaning of על “on account of”.<br><br>יהיה לך לפה HE SHALL BE TO THEE INSTEAD OF A MOUTH — he will be to thee as a spokesman because thou art slow of speech (Exodus Rabbah 3:17).<br><br>לאלהים means a superior and chief (cf. Onkelos)."}, {"ch": 4, "v": 17, "aliyah": 5, "heb": "וְאֶת־הַמַּטֶּ֥ה הַזֶּ֖ה תִּקַּ֣ח בְּיָדֶ֑ךָ אֲשֶׁ֥ר תַּעֲשֶׂה־בּ֖וֹ אֶת־הָאֹתֹֽת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיָת חֻטְרָא הָדֵין תִּסַב בִּידָךְ דְתַעְבֵּד בֵּהּ יָת אָתַיָא:", "onk_en": "Take this rod in your hand, for with it you will perform the [miraculous] signs.”", "pj": "וְיַת חוּטְרָא הָדֵין תִּיסַב בִּידָךְ דִתַעֲבֵיד בֵּיהּ יַת אָתַיָיא", "pj_en": "And this rod take thou in thy hand to work therewith the signs.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 18, "aliyah": 6, "heb": "וַיֵּ֨לֶךְ מֹשֶׁ֜ה וַיָּ֣שׇׁב&thinsp;<b>׀<\/b> אֶל־יֶ֣תֶר חֹֽתְנ֗וֹ וַיֹּ֤אמֶר לוֹ֙ אֵ֣לְכָה נָּ֗א וְאָשׁ֙וּבָה֙ אֶל־אַחַ֣י אֲשֶׁר־בְּמִצְרַ֔יִם וְאֶרְאֶ֖ה הַעוֹדָ֣ם חַיִּ֑ים וַיֹּ֧אמֶר יִתְר֛וֹ לְמֹשֶׁ֖ה לֵ֥ךְ לְשָׁלֽוֹם׃", "onk": "וַאֲזַל משֶׁה וְתָב לְוָת יֶתֶר חֲמוֹהִי וַאֲמַר לֵהּ אֵיזִיל <b>כְּעַן<\/b> וְאֵיתוּב לְוָת אַחַי דִי בְמִצְרַיִם וְאֶחֱזֵי הַעַד כְּעַן קַיָמִין וַאֲמַר יִתְרוֹ לְמשֶׁה אֱזֵיל לִשְׁלָם:", "onk_en": "Moshe went and returned to Yeser, his father-in-law, and said to him, “I would like to leave [<b>now<\/b>] and return to my brothers in Egypt, to see if they are still alive.” Yisro said to Moshe, “Go in peace.”", "pj": "וַאֲזַל משֶׁה וְתַב לְוַת יִתְרוֹ חָמוֹי וַאֲמַר לֵיהּ אֵיזִיל כְּדוּן לְוַת אַחַי דִבְמִצְרַיִם וְאֵיחְמֵי הַעַד כְּדוּן אִינוּן קַיְימִין וַאֲמַר יִתְרוֹ לְמשֶׁה אֵיזֵיל לִשְׁלָם", "pj_en": "And Mosheh went, and returned unto Jethro his father in law, and said, I will now go to my brethren who are in Mizraim, to see how they now live. And Jethro said to Mosheh, Go in peace.", "tj": "", "tj_en": "", "rashi": "<b>וישב אל יתר חתנו.<\/b> לִטֹּל רְשׁוּת, שֶׁהֲרֵי נִשְׁבַּע לוֹ (נדרים ס\"ה). וְז' שֵׁמוֹת הָיוּ לוֹ, רְעוּאֵל, יֶתֶר, יִתְרוֹ, קֵינִי, חוֹבָב, חֶבֶר, פּוּטִיאֵל:", "rashi_en": "וישב אל יתר חתנו AND HE RETURNED TO JETHRO HIS FATHER-IN-LAW, to obtain his permission to go to Egypt, for he had sworn to him that he would not leave Midian except by his permission (Nedarim 65a). He is here called יתר and he had seven names: Reuel, Jether, Jethro, Keni, Hobab, Cheber and Putiel (cf. Mekhilta)"}, {"ch": 4, "v": 19, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יְהֹוָ֤ה אֶל־מֹשֶׁה֙ בְּמִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי־מֵ֙תוּ֙ כׇּל־הָ֣אֲנָשִׁ֔ים הַֽמְבַקְשִׁ֖ים אֶת־נַפְשֶֽׁךָ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה בְּמִדְיָן אֱזֵיל תּוּב לְמִצְרָיִם אֲרֵי מִיתוּ כָּל גֻבְרַיָא דִבְעוֹ <b>לְמִקְטְלָךְ<\/b>:", "onk_en": "Adonoy said to Moshe in Midian, “Go, return to Egypt, for they have died—all the men who had sought your life [<b>to kill you<\/b>].”", "pj": "וַאֲמַר יְיָ לְמשֶׁה בְּמִדְיָן אִיזֵיל תּוּב לְמִצְרַיִם אֲרוּם אִתְרוֹקְנוּ וְנַחֲתוּ מִנִכְסֵיהוֹן וְהָא אִינוּן חֲשִׁיבוּן כְּמֵתַיָא כָּל גוּבְרַיָא דַהֲווֹ תַּבְעִין יַת נַפְשָׁךְ לְמִיסַב יָתָהּ", "pj_en": "And the Lord said unto Mosheh in Midian, Go, return to Mizraim; for they have come to nought, and gone down from their possessions; behold, all the men who sought to take thy life are reckoned as the dead.", "tj": "", "tj_en": "", "rashi": "<b>כי מתו כל האנשים.<\/b> מִי הֵם? דָּתָן וַאֲבִירָם; חַיִּים הָיוּ, אֶלָּא שֶׁיָּרְדוּ מִנִּכְסֵיהֶם וְהֶעָנִי חָשׁוּב כַּמֵּת:", "rashi_en": "FOR ALL THE MEN ARE DEAD — Who were these men? Dathan and Abiram: Really they were still alive, but they had come down in the world, having lost their property, and a poverty-stricken man may well be regarded as dead (Nedarim 64b)."}, {"ch": 4, "v": 20, "aliyah": 6, "heb": "וַיִּקַּ֨ח מֹשֶׁ֜ה אֶת־אִשְׁתּ֣וֹ וְאֶת־בָּנָ֗יו וַיַּרְכִּבֵם֙ עַֽל־הַחֲמֹ֔ר וַיָּ֖שׇׁב אַ֣רְצָה מִצְרָ֑יִם וַיִּקַּ֥ח מֹשֶׁ֛ה אֶת־מַטֵּ֥ה הָאֱלֹהִ֖ים בְּיָדֽוֹ׃", "onk": "וּדְבַר משֶׁה יָת אִתְּתֵהּ וְיָת בְּנוֹהִי וְאַרְכְּבִנוּן עַל חֲמָרָא וְתָב לְאַרְעָא דְמִצְרָיִם וּנְסִיב משֶׁה יָת חוּטְרָא <b>דְאִתְעֲבִידוּ בֵּהּ נִסִין מִן קֳדָם<\/b> יְיָ בִּידֵהּ:", "onk_en": "Moshe [then] took his wife and his sons, set them to ride on the donkey, and he returned to the land of Egypt. Moshe took the rod of [<b>with which miracles had been carried out before<\/b>] God in his hand.", "pj": "וּדְבַר משֶׁה יַת אִינְתְּתֵיהּ וְיַת בְּנוֹי וְאַרְכְּבִינוּן עַל חַמְרָא וְתַב לְאַרְעָא דְמִצְרַיִם וּנְסֵיב משֶׁה יַת חוּטְרָא דְנָסַב מִן גִנוּנִיתָא דְחָמוֹי וְהוּא מִסַפִּיר כּוּרְסֵי יְקָרָא מַתְקְלֵיהּ אַרְבְּעִין סְאִין וְעִילוֹ חָקוּק וּמְפָרֵשׁ שְׁמָא רַבָּא וְיַקִירָא וּבֵיהּ אִתְעֲבִידוּ נִיסִין מִן קֳדָם יְיָ בִּידֵיהּ", "pj_en": "And Mosheh took his wife and his sons, and made them ride on the ass, and returned
