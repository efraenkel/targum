 make thee as Ephraim and as Manasseh]” (Sifrei Bamidbar 14).<br><br>את ירכך [WHEN THE LORD DOTH MAKE] THY THIGH [TO FALL, AND THY BELLY TO SWELL] — In uttering the curse that will befall her because of her sin he mentions the thigh before the belly (whilst in v. 22 the belly is stated to be affected first), because with it (the thigh) she began to sin (cf. Sotah 8b, 9b).<br><br>צבה — Understand this as the Targum does: SWOLLEN."}, {"ch": 5, "v": 22, "aliyah": 4, "heb": "וּ֠בָ֠אוּ הַמַּ֨יִם הַמְאָרְרִ֤ים הָאֵ֙לֶּה֙ בְּֽמֵעַ֔יִךְ לַצְבּ֥וֹת בֶּ֖טֶן וְלַנְפִּ֣ל יָרֵ֑ךְ וְאָמְרָ֥ה הָאִשָּׁ֖ה אָמֵ֥ן&thinsp;<small>׀<\/small>&thinsp;אָמֵֽן׃", "onk": "וְיֵעֲלוּן מַיָּא מְלַטְטַיָּא הָאִלֵּין בִּמְעַיְכִי <b>לַאֲפָחָא<\/b> מְעִין <b>וּלְאַמְסָאָה<\/b> יַרְכָּא וְתֵימַר אִתְּתָא אָמֵן אָמֵן:", "onk_en": "This bitter, lethal water will enter your abdomen to swell [<b>inflate<\/b>] the abdomen, and collapse [<b>fall away<\/b>] the thigh and the woman shall say “Amein, Amein”.", "pj": "וְיֵיעָלוּן מַיָא בְּדוּקַיָא הָאִלֵין בִּמְעַיְיכִי לִמְנַפְחָא כְּרֵיסָן וּלְמַסְיָא יַרְכִינוּן וְתַעֲנֶה אִתְּתָא וְתֵימַר אָמֵן אִין אִסְתְּאָבִית כַּד מֵאַרְסָא אָמֵן אִין אִסְתְּאָבִית כַּד נְסִיבְתָּא", "pj_en": "and may these waters of trial enter into thy bowels, to cause thy belly to swell, and thy thigh to corrupt. And the woman shall answer and say: Amen, if I was polluted when betrothed; Amen, if I have been polluted since my marriage.", "tj": "וְתֵימַר אִיתְּתָא אָמֵן דְלָא אִסְתַּאֲבִית אָמֵן אִין אֲנָא עֲתִידָה לְמִסְתְּאָבָא:", "tj_en": "And the woman shall answer, Amen, because I have not been unclean; Amen, if ever I shall have wrought uncleanness.", "rashi": "<b>לצבות בטן.<\/b> כְּמוֹ לְהַצְבּוֹת בֶּטֶן, זֶהוּ שִׁמּוּשׁ פַּתָּח שֶׁהַלָּמֶ\"ד נְקוּדָה בוֹ. וְכֵן \"לַנְחֹתָם הַדֶּרֶךְ\" (שמות י\"ג), \"לַרְאֹתְכֶם בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ\" (דברים א'), וְכֵן \"לַנְפִּל יָרֵךְ\" — לְהַנְפִּיל יָרֵךְ, שֶׁהַמַּיִם מַצְבִּים אֶת הַבֶּטֶן וּמַפִּילִים אֶת הַיָּרֵךְ:<br><br><b>לצבות בטן ולנפל ירך.<\/b> בִּטְנוֹ וִירֵכוֹ שֶׁל בּוֹעֵל, אוֹ אֵינוֹ אֶלָּא נִבְעֶלֶת, כְּשֶׁהוּא אוֹמֵר \"אֶת יְרֵכֵךְ נֹפֶלֶת וְאֶת בִּטְנֵךְ צָבָה\" הֲרֵי שֶׁל נִבְעֶלֶת אָמוּר (סוטה כ\"ח):<br><br><b>אמן אמן.<\/b> קַבָּלַת שְׁבוּעָה – אָמֵן עַל הָאָלָה אָמֵן עַל הַשְּׁבוּעָה, אָמֵן אִם מֵאִישׁ זֶה אָמֵן אִם מֵאִישׁ אַחֵר, אָמֵן שֶׁלֹּא סָטִיתִי אֲרוּסָה וּנְשׂוּאָה שׁוֹמֶרֶת יָבָם וּכְנוּסָה (שם י\"ח):", "rashi_en": "לצבות בטן is the same as לְהַצְבּוֹת בטן (the verb being the Hiphil infinitive). This is the usage of the Patach: that the “lamed” has it as its vowel instead of the ה having it (viz., that it is a contraction of לה). Similar is (Exodus 13:21) לַרְאתכם הדרך and (Deuteronomy 1:33) לַנְחֹתָם בדרך אשר הלכו בה (which are equivalent to לְהַרְאֹתְכֶם and לְהַנְחֹתָם). And so, too, in this verse, לַנְפִּל ירך, which is the same as לְהַנְפִּיל ירך. The meaning is: that the waters cause the belly to swell, and cause the thigh to fall.<br><br>לצבות בטן ולנפל ירך [AND THIS WATER THAT CAUSETH THE CURSE SHALL GO INTO THY BOWELS] TO MAKE THE BELLY TO SWELL AND THE THIGH TO WASTE — i.e. the belly and the thigh of the adulterer (Note that Scripture does not state here, as in the preceding verse, “thy thigh”, “thy belly”). Or perhaps this is not so, but it means those of the adulteress? But when it states, (v. 21) “[when the Lord doth make] thy thigh to waste and thy belly to swell”, you see, that those of the adulteress are mentioned already (Sotah 28a; cf. Sifrei Bamidbar 15:1).<br><br>אמן אמן [AND THE WOMAN SHALL SAY] AMEN, AMEN — The utterance of the word אמן by a person implies the acceptance of an oath which has been recited by another with reference to him. — The two words אמן (which may mean “It is so”, or, “May it be so”) respectively signify, “Amen” with reference to the curse invoked, and “Amen” with reference to the oath recited. Accordingly she declares: “Amen” (“may it be so” i. e., may the אלה “the curse” befall me) if I have received defilement from this man, and “Amen” if I have received defilement from any other man; “Amen” (“It is so” — the terms of the oath are true) that I have not gone astray either when I was betrothed to my husband or since I have been married to him; (or in the case of a woman who has married her deceased husband’s brother; cf. Deuteronomy 25:7, it implies), “either when I was awaiting marriage with my brother-in-law or after I was married to him” (Sotah 18a)."}, {"ch": 5, "v": 23, "aliyah": 4, "heb": "וְ֠כָתַ֠ב אֶת־הָאָלֹ֥ת הָאֵ֛לֶּה הַכֹּהֵ֖ן בַּסֵּ֑פֶר וּמָחָ֖ה אֶל־מֵ֥י הַמָּרִֽים׃", "onk": "וְיִכְתּוֹב יָת לְוָטַיָּא הָאִלֵּין כַּהֲנָא בְּסִפְרָא וְיִמְחוֹק לְמַיָּא מְרִירַיָּא:", "onk_en": "The <i>kohein<\/i> shall write all these curses, on the scroll and dissolve them (the writing) in the bitter waters.", "pj": "(וְתִכְתּוֹב) [צ\"ל וְיִכְתּוֹב] יַת לְוָטַיָא הָאִלֵין כַּהֲנָא עַל מְגִילְתָּא וְיִמְחוֹק לְמַיָא בְּדוּקַיָא", "pj_en": "And the priest shall write these maledictions upon a parchment, and wash it out with the water of trial,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 24, "aliyah": 4, "heb": "וְהִשְׁקָה֙ אֶת־הָ֣אִשָּׁ֔ה אֶת־מֵ֥י הַמָּרִ֖ים הַמְאָֽרְרִ֑ים וּבָ֥אוּ בָ֛הּ הַמַּ֥יִם הַֽמְאָרְרִ֖ים לְמָרִֽים׃", "onk": "וְיַשְׁקֵי יָת אִתְּתָא יָת מַיָּא מְרִירַיָּא מְלַטְטַיָּא וְיֵעֲלוּן בַּהּ מַיָּא מְלַטְטַיָּא לִמְרִירוּ:", "onk_en": "He shall have the woman drink the bitter, lethal waters and the lethal waters, shall enter her to become bitter.", "pj": "וְיַשְׁקֵי יַת אִתְּתָא יַת מַיָא מְרִירַיְתָא בְּדוּקַיָא וְיֵעָלוּן בָּהּ מַיָא בְּדוּקַיָא לִלְוָט", "pj_en": "and cause the woman to drink the bitter trial water: the trial water of malediction shall be received by her.", "tj": "", "tj_en": "", "rashi": "<b>והשקה את האשה.<\/b> אֵין זֶה סֵדֶר הַמַּעֲשֶׂה, שֶׁהֲרֵי בַתְּחִלָּהּ מַקְרִיב מִנְחָתָהּ, אֶלָּא הַכָּתוּב מְבַשֶּׂרְךָ שֶׁכְּשֶׁיַּשְׁקֶנָּה יָבֹאוּ בָהּ לְמָרִים; לְפִי שֶׁנֶּאֱמַר בֶּטֶן וְיָרֵךְ, מִנַּיִן לִשְׁאָר כָּל הַגּוּף? תַּ\"ל <b>ובאו בה<\/b> — בְּכֻלָּהּ, אִ\"כַּ מַה תַּ\"ל בֶּטֶן וְיָרֵךְ? לְפִי שֶׁהֵן הִתְחִילוּ בַעֲבֵרָה תְּחִלָּה לְפִיכָךְ הִתְחִיל מֵהֶם הַפֻּרְעָנוּת (ספרי):<br><br><b>למרים.<\/b> לִהְיוֹת לָהּ רָעִים וּמָרִים:", "rashi_en": "והשקה את האשה AND HE SHALL CAUSE THE WOMAN TO DRINK [THE BITTER WATER] — This was not the actual order of the proceedings, because really he offered her meal-offering first (before giving her the water to drink; cf. v. 26, 27), but Scripture here merely informs you that when he afterwards gives her the water to drink it will become bitter in her belly (cf. Sotah 19a). — Since only the thigh and the belly are mentioned (vv. 21. 22), I might conclude that only these are affected (see Sifrei Bamidbar 18); whence do we know that this applies also to the rest of the body? Because Scripture states here, “[and the water … shall come] into her [and become bitter]” — into all of her body! But if so, why does Scripture explicitly mention only the thigh and the belly? Because they (these two) were the first to begin the sin, therefore it (Scripture) makes the punishment begin with them (and for this reason Scripture mentions them explicitly, but, as a matter of fact, it extends to the whole body as is implied in the word בה (Sifrei Bamidbar 18).<br><br>למרים (The text is more lit., “and the waters shall enter into her as bitter”) — i.e. to become bad and bitter for her."}, {"ch": 5, "v": 25, "aliyah": 4, "heb": "וְלָקַ֤ח הַכֹּהֵן֙ מִיַּ֣ד הָֽאִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַקְּנָאֹ֑ת וְהֵנִ֤יף אֶת־הַמִּנְחָה֙ לִפְנֵ֣י יְהֹוָ֔ה וְהִקְרִ֥יב אֹתָ֖הּ אֶל־הַמִּזְבֵּֽחַ׃", "onk": "וְיִסַּב כַּהֲנָא מִידָא דְאִתְּתָא יָת מִנְחַת קִנְאָתָא וִירִים יָת מִנְחָתָא קֳדָם יְיָ וִיקָרֵב יָתַהּ לְמַדְבְּחָא:", "onk_en": "The <i>kohein<\/i> shall take from the woman’s hand the meal-offering of jealousy and he shall wave the meal-offering before Adonoy, and bring it close to the Altar.", "pj": "וְיִסַב כַּהֲנָא מִידָא דְאִתְּתָא יַת מִנְחָתָא דְקַנִיאֲתָא וְיָרִים יַת מִנְחָתָא קֳדָם יְיָ וִיקָרֵב יָתָהּ עַל גַבֵּי מַדְבְּחָא", "pj_en": "But the priest shall (first) take from the woman's hand the mincha of jealousy, and uplift the mincha before the Lord, and lay it on the side of the altar.", "tj": "", "tj_en": "", "rashi": "<b>והניף.<\/b> מוֹלִיךְ וּמֵבִיא מַעֲלֶה וּמוֹרִיד, וְאַף הִיא מְנִיפָה עִמּוֹ, שֶׁיָּדָהּ לְמַעְלָה מִיָּדוֹ שֶׁל כֹּהֵן:<br><br><b>והקריב אתה.<\/b> זוֹ הִיא הַגָּשָׁתָהּ בְּקֶרֶן דְּרוֹמִית מַעֲרָבִית שֶׁל מִזְבֵּחַ קֹדֶם קְמִיצָה, כִּשְׁאָר מְנָחוֹת (סוטה י\"ד):", "rashi_en": "והניף THEN [THE PRIEST] SHALL WAVE [THE MEAL-OFFERING] — He moves it about horizontally and vertically, and she, too, waves it together with him, because her hand has to be above the hand of the priest (Sotah 19a).<br><br>והקריב אתה — This refers to what is known as the הגשה — bringing it to the south-west corner of the altar before the קמיצה, “the taking off of the handful of flour”, just as is the case with all other meal-offerings (cf. Rashi on Leviticus 7:7 and Sotah 14b)."}, {"ch": 5, "v": 26, "aliyah": 4, "heb": "וְקָמַ֨ץ הַכֹּהֵ֤ן מִן־הַמִּנְחָה֙ אֶת־אַזְכָּ֣רָתָ֔הּ וְהִקְטִ֖יר הַמִּזְבֵּ֑חָה וְאַחַ֛ר יַשְׁקֶ֥ה אֶת־הָאִשָּׁ֖ה אֶת־הַמָּֽיִם׃", "onk": "וְיִקְמוֹץ כַּהֲנָא מִן מִנְחָתָא יָת אַדְכַּרְתַּהּ <b>וְיַסֵּק<\/b> לְמַדְבְּחָא וּבָתַר כֵּן יַשְׁקֵי יָת אִתְּתָא יָת מַיָּא:", "onk_en": "The <i>kohein<\/i> shall scoop out from the meal-offering its commemoration and burn it on [<b>bring it up to<\/b>] the Altar, and after that he shall cause the woman to drink the water.", "pj": "וְיִקְמוֹץ כַּהֲנָא מִן מִנְחָתָא יַת צְרִיד אַדְכַּרְתָּא וְיַסִיק לְמַדְבְּחָא וּמִבָּתַר כֵּן יַשְׁקֵי יַת אִתְּתָא יַת מַיָא", "pj_en": "And the priest shall take a handful of the portion for its memorial, and burn it at the altar; and after that the woman shall drink the water.", "tj": "", "tj_en": "", "rashi": "<b>אזכרתה.<\/b> הוּא הַקֹּמֶץ, שֶׁעַ\"יְ הַקְטָרָתוֹ הַמִּנְחָה בָאָה לְזִכָּרוֹן לְגָבוֹהַּ (ספרי):", "rashi_en": "אזכרתה THE MEMORIAL PART THEREOF — i.e. the handful, and it is so called because through its being burnt the meal-offering is brought to remembrance before the Most High God (Sifrei Bamidbar 17; cf. Rashi on Leviticus 2:2 and 24:7)."}, {"ch": 5, "v": 27, "aliyah": 4, "heb": "וְהִשְׁקָ֣הּ אֶת־הַמַּ֗יִם וְהָיְתָ֣ה אִֽם־נִטְמְאָה֮ וַתִּמְעֹ֣ל מַ֣עַל בְּאִישָׁהּ֒ וּבָ֨אוּ בָ֜הּ הַמַּ֤יִם הַמְאָֽרְרִים֙ לְמָרִ֔ים וְצָבְתָ֣ה בִטְנָ֔הּ וְנָפְלָ֖ה יְרֵכָ֑הּ וְהָיְתָ֧ה הָאִשָּׁ֛ה לְאָלָ֖ה בְּקֶ֥רֶב עַמָּֽהּ׃", "onk": "וְיַשְׁקִנַּהּ יָת מַיָּא וּתְהֵי אִם אִסְתָּאָבַת <b>וְשַׁקָּרַת שְׁקָר<\/b> בְּבַעֲלַהּ וְיֵעֲלוּן בַּהּ מַיָּא מְלַטְטַיָּא לִמְרִירוּ <b>וְיִפְּחוּן<\/b> מְעָהָא <b>וְתִתְמְסֵי<\/b> יַרְכַּהּ וּתְהֵי אִתְּתָא לִלְוַט בְּגוֹ עַמַּהּ:", "onk_en": "He shall make her drink the water, and it shall be that if she had been defiled and had deceived [<b>been untruthful to<\/b>] her husband, the lethal waters shall enter her to become bitter, and her abdomen will swell and her thigh will collapse [<b>fall away<\/b>], and the woman will be a curse among her people.", "pj": "וְיַשְׁקִינָהּ יַת מַיָא וִיהֵי אִין אִסְתְּאָבַת בְּתַשְׁמִישׁ דְעָרִיס וְשַׁקְרַת שְׁקָר בְּבַעֲלָהּ וְיֵעָלוּן בָּהּ מַיָא בְּדוּקַיָא לִלְוָט וּתְנָפַח כְּרֵיסָהּ וְתִתְמְסֵי יַרְכָּהּ וּתְהֵי אִתְּתָא לִלְוָטָא בְּגוֹ בְּנֵי עַמָהּ בְּרַם לְגִיוֹרָא בַּדְקִין מַיָא בְּדוּקַיָא הָאִינוּן בְּכָל אַתְרָא דְהוּא תַּמָן", "pj_en": "And when he hath caused her to drink the water, it will be that if she hath been defiled by adultery, and hath acted with wrongness against her husband, those proving waters will enter into her with a curse, and her belly will swell, and her thigh become corrupt, and the woman will be an execration among the children of her people. The adulterer as well will be detected by these waters of probation, in whatever place he may be.", "tj": "", "tj_en": "", "rashi": "<b>והשקה את המים.<\/b> לְרַבּוֹת, שֶׁאִם אָמְרָה אֵינִי שׁוֹתָה לְאַחַר שֶׁנִּמְחֲקָה מְגִלָּה, מְעַרְעֲרִין אוֹתָהּ וּמַשְׁקִין אוֹתָהּ בְּעַל כָּרְחָהּ, אֶלָּא אִ\"כֵּ אָמְרָה טְמֵאָה אֲנִי (ספרי; סוטה כ'):<br><br><b>וצבתה בטנה וגו'.<\/b> אַעַ\"פִּ שֶׁבַּקְּלָלָה הִזְכִּיר יָרֵךְ תְּחִלָּה, הַמַּיִם אֵין בּוֹדְקִין אֶלָּא כְּדֶרֶךְ כְּנִיסָתָן בָּהּ (שם ט'):<br><br><b>והיתה האשה לאלה.<\/b> כְּמוֹ שֶׁפֵּרַשְׁתִּי, שֶׁיְּהֵא הַכֹּל אָלִין בָּהּ:<br><br><b>בקרב עמה.<\/b> הֶפְרֵשׁ יֵשׁ בֵּין אָדָם הַמִּתְנַוֵּל בְּמָקוֹם שֶׁנִּכָּר, לְאָדָם הַמִּתְנַוֵּל בְּמָקוֹם שֶׁאֵינוֹ נִכָּר:", "rashi_en": "והשקה את המים AND HE SHALL MAKE HER DRINK THE WATER — This statement made after Scripture has just said (v. 26) “and afterwards he shall make the woman drink the waters” (see Siphre) is intended to include the case that if she says, “I will not drink” after the scroll on which the Holy Name was written had been blotted out, they pour it into her and make her drink the water against her will — except if she adds: “I have been defiled” [when, of course, no further test is necessary] (Sotah 19b).<br><br>וצבתה בטנה AND HER BELLY SHALL SWELL, [AND HER THIGH SHALL WASTE] — Although when uttering the curse (v. 21) he (the priest) mentioned the thigh first, for the reason given by Rashi in his comment there, the water tested her (i.e., affected her) only according to the manner it passed into her body (i.e., it affected the belly first since it first entered that part of her body and then the thigh) (Sotah 9b).<br><br>והיתה האשה לאלה AND THE WOMAN SHALL BE AN EXECRATION — This means, as I have already explained (v. 21), that everyone shall curse by mention of her name.<br><br>בקרב עמה [AND THE WOMAN SHALL BE AN EXECRATION] AMONG HER PEOPLE — This is stressed: \"among her people” — because there is a difference between a person who is brought to disgrace in a place where he is well known and a person who is brought to disgrace in a place where he is unknown."}, {"ch": 5, "v": 28, "aliyah": 4, "heb": "וְאִם־לֹ֤א נִטְמְאָה֙ הָֽאִשָּׁ֔ה וּטְהֹרָ֖ה הִ֑וא וְנִקְּתָ֖ה וְנִזְרְעָ֥ה זָֽרַע׃", "onk": "וְאִם לָא אִסְתָּאָבַת אִתְּתָא וְדַכְיָאָה הִיא <b>וְתִפּוֹק זַכָּאָה וְתַעְדִּי עִדּוּי<\/b>:", "onk_en": "But if the woman was not defiled and [she] is pure, she will be cleansed [<b>go out exonerated<\/b>] and shall bear seed [<b>will conceive<\/b>].", "pj": "וְאִין לָא אִסְתְּאָבַת אִנְתְּתָא בְּתַשְׁמִישׁ דְעָרִיס וּדְכִיתָא הִיא וְתִיפּוֹק זַכְיָא נְזִיוָהּ מַנְהֵר וְתִשְׁכַּח רַחְמִין קֳדָם בַּעֲלָהּ וְתִתְעַבַּר בְּבַר דְכָר", "pj_en": "But if the woman hath not been defiled by adultery, but is innocent, they will enter without harm, and her brightness will shine forth, and she will find affection before her husband, and become the mother of a son.", "tj": "", "tj_en": "", "rashi": "<b>ואם לא נטמא האשה.<\/b> בִּסְתִירָה זוֹ:<br><br><b>וטהרה הוא.<\/b> מִמָּקוֹם אַחֵר:<br><br><b>ונקתה.<\/b> מִמַּיִם הַמְאָרְרִים, וְלֹא עוֹד אֶלָּא <b>ונזרעה זרע<\/b> — אִם הָיְתָה יוֹלֶדֶת בְּצַעַר תֵּלֵד בְּרֶוַח, אִם הָיְתָה יוֹלֶדֶת שְׁחֹרִים, מֵעַתָּה יוֹלֶדֶת לְבָנִים:", "rashi_en": "ואם לא נטמאה האשה AND IF THE WOMAN WAS NOT DEFILED on the occasion of this secluding herself with this man,<br><br>וטהרה הוא AND BE CLEAN (guiltless) as regards any other place,<br><br>ונקתה THEN SHE SHALL BE FREE from the effect of the water that waste the body and not only this, but ונזרעה זרע SHE SHALL CONCEIVE SEED — i.e. if until now she used to bear children in pain, she will from now bear with ease (free from pain), if up to now she used to bear black (ugly) children, from now on she will bear white (beautiful) children (Sifrei Bamidbar 19; Sotah 26a)."}, {"ch": 5, "v": 29, "aliyah": 4, "heb": "זֹ֥את תּוֹרַ֖ת הַקְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖הּ וְנִטְמָֽאָה׃", "onk": "דָּא אוֹרַיְתָא דְּקִנְאָתָא דִּי תִסְטֵי אִתְּתָא בַּר מִבַּעֲלַהּ וְתִסְתָּאָב:", "onk_en": "This is the law of jealousies, when a woman goes astray during her marriage to her husband and is defiled.", "pj": "דָא אַחְוָיַת אוֹרַיְיתָא קִנְאָתָא דְתִסְטֵי אִתְּתָא בַּר מִן רְשׁוּתָא דְבַעֲלָהּ וְתִסְתָּאֵב בְּתַּשְׁמִישׁ דְעָרִיס", "pj_en": "This is the declaration of the law of jealousy, when a woman hath fallen away from the right of her husband, and become defiled by adultery;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 30, "aliyah": 4, "heb": "א֣וֹ אִ֗ישׁ אֲשֶׁ֨ר תַּעֲבֹ֥ר עָלָ֛יו ר֥וּחַ קִנְאָ֖ה וְקִנֵּ֣א אֶת־אִשְׁתּ֑וֹ וְהֶעֱמִ֤יד אֶת־הָֽאִשָּׁה֙ לִפְנֵ֣י יְהֹוָ֔ה וְעָ֤שָׂה לָהּ֙ הַכֹּהֵ֔ן אֵ֥ת כׇּל־הַתּוֹרָ֖ה הַזֹּֽאת׃", "onk": "אוֹ גְבַר דִּי תֶעְבַּר עֲלוֹהִי רוּחַ קִנְאָה וִיקַנֵּי יָת אִתְּתֵהּ וִיקֵם יָת אִתְּתָא קֳדָם יְיָ וְיֶעְבַּד לַהּ כַּהֲנָא יָת כָּל אוֹרַיְתָא הָדָא:", "onk_en": "If a man is overcome with a spirit of jealousy and he is jealous of his wife, then he shall have the woman stand before Adonoy, and the <i>kohein<\/i> shall do unto her all of these laws.", "pj": "אוֹ גְבַר דְיִתְעַבָּר עֲלוֹי רוּחַ קִנְאֵיתָא וִיקַנֵי יַת אִתְּתֵיהּ וְיָקִים יַת אִיתְּתָא קֳדָם יְיָ וִיעַבַּד לָהּ כַּהֲנָא יַת כָּל אוֹרַיְתָא הֲדָא", "pj_en": "or when the spirit of jealousy cometh upon a man, that he be so jealous of his wife as to make her stand before the Lord, then shall the priest perform all this law.", "tj": "", "tj_en": "", "rashi": "<b>או איש.<\/b> כְּמוֹ \"אוֹ נוֹדַע\" (שמות כ\"א), כְּלוֹמַר אִם אִישׁ קַנַּאי הוּא, לְכָךְ <b>והעמיד את האשה.<\/b>", "rashi_en": "או איש — The word או here has the same meaning as in the phrase (Exodus 21:36): או נודע, “If it be known” (cf. Rashi on that verse and our Note thereon) — that is to say: if the man is a jealous man, then just on account of this, he shall present the woman [before the Lord and then the priest shall execute upon her all this law].”"}, {"ch": 5, "v": 31, "aliyah": 4, "heb": "וְנִקָּ֥ה הָאִ֖ישׁ מֵעָוֺ֑ן וְהָאִשָּׁ֣ה הַהִ֔וא תִּשָּׂ֖א אֶת־עֲוֺנָֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיהֵי זַכָּאָה גַּבְרָא מֵחוֹבָא וְאִתְּתָא הַהִיא תְּקַבֵּל יָת חוֹבָהּ:", "onk_en": "The man is cleansed [<b>innocent<\/b>] of sin and that woman shall bear [the burden of] her iniquity.", "pj": "וְאִין זַכַּאי גַבְרָא מֵחוֹבִין אִתְּתָא הַהִיא תְּקַבֵּל יַת חוֹבָאָהּ", "pj_en": "But if the man be innocent of transgressions, then let that woman bear her iniquity.", "tj": "", "tj_en": "", "rashi": "<b>ונקה האיש מעון.<\/b> אִם בְּדָקוּהָ הַמַּיִם, אַל יִדְאַג לוֹמַר \"חַבְתִּי בְמִיתָתָהּ\", נָקִי הוּא מִן הָעֹנֶשׁ; דָּ\"אַ: מִשֶּׁיַּשְׁקֶנָּה תְּהֵא אֶצְלוֹ בְּהֶתֵּר, וְנִקָּה מֵעָוֹן, שֶׁהַסּוֹטָה אֲסוּרָה לְבַעְלָהּ (ספרי):", "rashi_en": "ונקה האיש מעון THEN SHALL THE MAN BE GUILTLESS FROM INIQUITY — This means, if the waters try her (have effect on her), he should not worry and say: “I have incurred guilt through her death!” — No, he is free from punishment. Another explanation is: As soon as he has made her drink the water and she is proved innocent she may lawfully remain with him as his wife, and he is free from sin in permitting this, but if he lives with her before this, he is not free, for a סוטה (a wife suspected of infidelity) is forbidden to her husband pending her trial (cf. Sifrei Bamidbar 21)."}, {"ch": 6, "v": 1, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 2, "aliyah": 4, "heb": "דַּבֵּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם אִ֣ישׁ אֽוֹ־אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִנְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְהַזִּ֖יר לַֽיהֹוָֽה׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן גְּבַר אוֹ אִתְּתָא אֲרֵי יְפָרֵשׁ לְמִדַּר נְדַר נְזִירוּ לְמֵיזַר <b>קֳדָם<\/b> יְיָ:", "onk_en": "Speak to Bnei Yisroel and say to them: If a man or a woman sets apart a vow, a nazirite vow, to set [himself] apart for [<b>from before<\/b>] Adonoy.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן גְבַר אוֹ אִתְּתָא אֲרוּם חַמְיַין סְטִיתָא בְּקִלְקוּלָהּ וְיַפְרִישׁ מִן חַמְרָא אוֹ עַל שׁוּם מִדַעַם יִדוֹר נֶדֶר נְזִירוּ לְמִפְרַשׁ לִשְׁמָא דַיְיָ", "pj_en": "Speak with the children of Israel, and say to them: When a man or, woman, seeing her who had gone astray in her corruption, shall (resolve to) become abstinent from wine, or for any other cause shall make the vow of a Nazir in separating one'- self unto the Name of the Lord,", "tj": "", "tj_en": "", "rashi": "<b>כי יפלא.<\/b> יַפְרִישׁ; לָמָּה נִסְמְכָה פָרָשַׁת נָזִיר לְפָרָשַׁת סוֹטָה? לוֹמַר לְךָ שֶׁכָּל הָרוֹאֶה סוֹטָה בְקִלְקוּלָהּ יַזִּיר עַצְמוֹ מִן הַיַּיִן, שֶׁהוּא מֵבִיא לִידֵי נִאוּף (סוטה ב'):<br><br><b>נדר נזיר.<\/b> אֵין נְזִירָה בְכָל מָקוֹם אֶלָּא פְּרִישָׁה, אַף כָּאן שֶׁפֵּרֵשׁ מִן הַיַּיִן:<br><br><b>להזיר לה'.<\/b> לְהַבְדִּיל עַצְמוֹ מִן הַיַּיִן לְשֵׁם שָׁמַיִם:", "rashi_en": "כי יפלא means, IF HE CLEARLY UTTERS (cf. Rashi on Leviticus 22:21 and Note thereon). — Why is the section dealing with the Nazarite placed in juxtaposition to the section dealing with the סוטה? To tell you that he who has once seen a סוטה in her disgrace should abstain from wine, because it may lead to adultery (Sotah 2a).<br><br>נדר נזיר — The term נזר wherever it occurs denotes “keeping aloof from something” (cf. Rashi on Leviticus 22:2). Here, too, it means that he keeps away from wine (Sifrei Bamidbar 22).<br><br>להזיר לה׳ means, TO KEEP HIMSELF ALOOF from wine FOR THE SAKE OF HEAVEN (God)."}, {"ch": 6, "v": 3, "aliyah": 4, "heb": "מִיַּ֤יִן וְשֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְחֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְכׇל־מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַעֲנָבִ֛ים לַחִ֥ים וִיבֵשִׁ֖ים לֹ֥א יֹאכֵֽל׃", "onk": "מֵחֲמַר חֲדַת וְעַתִּיק יִזַּר חַל דַּחֲמַר חֲדַת וְחַל דַּחֲמַר עַתִּיק לָא יִשְׁתֵּי וְכָל מַתְרוּת עִנְבִין לָא יִשְׁתֵּי וְעִנְבִין רַטִּיבִין וִיבֵשִׁין לָא יֵיכוּל:", "onk_en": "From new or old [intoxicating] wine, he must abstain. Vinegar made from new wine and vinegar made from old wine he shall not drink; anything steeped in grapes he shall not drink; moist grapes or dried grapes (raisins) he shall not eat.", "pj": "מִן חֲמַר חֲדַת וְעַתִּיק יִפְרֵשׁ חֲלָא דַחֲמַר חֲדַת וַחֲלָא דַחֲמַר עַתִּיק לָא יִשְׁתֵּי וְכָל שִׁיקְיָינֵיהּ דְאִיתְרוּ בֵּיהּ עִנְבֵי לָא יִשְׁתֵּי וְעִנְבִין רְטִיבִין וּצְמוּקִין לָא יֵיכוֹל", "pj_en": "he shall abstain from wine, new and old, he shall drink neither vinegar of old wine or new; neither may he drink liquor in which grapes have been crushed, nor eat of grapes either fresh or dried.", "tj": "מֵחֲמַר חֲדַת וְעַתִּיק יִתְנְזַר חֲמַע דַחֲמַר חֲדַת וַחֲמַע דַחֲמַר עַתִּיק לָא יִשְׁתֵּי וְכָל שְׁזוֹג דְעִנְבִין לָא יִשְׁתֵּי:", "tj_en": "From wine, new or old, be shall abstain, (keep apart) and vinegar of old wine he may not drink, nor any liquor of grapes.", "rashi": "<b>מיין ושכר.<\/b> כְּתַרְגּוּמוֹ \"מֵחֲמַר חֲדַת וְעַתִּיק\", שֶׁהַיַּיִן מְשַׁכֵּר כְּשֶׁהוּא יָשָׁן:<br><br><b>וכל משרת.<\/b> לְשׁוֹן צְבִיעָה בְּמַיִם וְכָל מַשְׁקֶה; וּבִלְשׁוֹן מִשְׁנָה יֵשׁ הַרְבֵּה, אֵין שׁוֹרִין דְּיוֹ וְסַמָּנִים (שבת י\"ז), נָזִיר שֶׁשָּׁרָה פִתּוֹ (נזיר ל\"ד):", "rashi_en": "מיין ושכר — Understand this as the Targum does: he shall abstain from new (יין) and old wine (שכר). The latter is called שכר, “intoxicating drink”, because wine makes one intoxicated when it is old.<br><br>וכל משרת — The word משרת denotes “steeping” in water or any other liquid. In the Mishnaic language there are many examples of this, e.g., (Shabbat 17b): “One must not soak (שורין) ink-materials and dyes in water on the eve of Sabbath”; (Nazir 34b): “A Nazarite who steeped (שרה) his bread in wine\".\n"}, {"ch": 6, "v": 4, "aliyah": 4, "heb": "כֹּ֖ל יְמֵ֣י נִזְר֑וֹ מִכֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִגֶּ֣פֶן הַיַּ֗יִן מֵחַרְצַנִּ֛ים וְעַד־זָ֖ג לֹ֥א יֹאכֵֽל׃", "onk": "כֹּל יוֹמֵי נִזְרֵיהּ מִכֹּל דְּיִתְעֲבֵד מִגֻּפְנָא דְחַמְרָא מִפּוּרְצְנִין וְעַד עִצּוּרִין לָא יֵיכוּל:", "onk_en": "As long as he is a <i>Nazir<\/i> from anything made of the grape-vine, from seeds to skin, he shall not eat.", "pj": "כָּל יוֹמֵי נִזְרֵיהּ מִכָּל דְמִתְעֲבֵיד מִגוּפְנָא דְחַמְרָא מִגוּפְנִין מִקְלוּפִין וְעַד זַגִין גַיוָואִין דְעִנְבָא לָא יֵיכוֹל", "pj_en": "All the days of his vow he shall not eat of the tree which maketh wine, from the husks of grapes even to the kernels within them.", "tj": "", "tj_en": "", "rashi": "<b>חרצנים.<\/b> הֵם הַגַּרְעִינִין:<br><br><b>זג.<\/b> הֵם קְלִפוֹת שֶׁמִּבַּחוּץ, שֶׁהַחַרְצַנִּים בְּתוֹכָן כְּעִנְבָּל בְּזוּג:", "rashi_en": "חרצנים are THE KERNELS....<br><br>זג are THE HUSKS (skins) outside. They are called זג (a term also used for a bell) because the kernels are inside them as the clapper is in the bell (cf. Siphre; Nazir 34b; 39a)."}, {"ch": 6, "v": 5, "aliyah": 4, "heb": "כׇּל־יְמֵי֙ נֶ֣דֶר נִזְר֔וֹ תַּ֖עַר לֹא־יַעֲבֹ֣ר עַל־רֹאשׁ֑וֹ עַד־מְלֹ֨את הַיָּמִ֜ם אֲשֶׁר־יַזִּ֤יר לַיהֹוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁוֹ׃", "onk": "<b>כָּל יוֹמֵי<\/b> נְדַר נִזְרֵיהּ מַסְפַּר לָא יֶעְבַּר עַל רֵישֵׁיהּ עַד מִשְׁלַם יוֹמַיָּא דְּיַנְזֵר קֳדָם יְיָ קַדִּישׁ יְהֵי מַרְבֵּי פֵרוּעַ שְׂעַר רֵישֵׁיהּ:", "onk_en": "As long as [<b>all the days<\/b>] he is under his nazirite oath a razor shall not pass over [to touch] his head. Until he completes his days as a <i>Nazir<\/i> to Adonoy he shall be sacred, he shall let the hair of his head grow long.", "pj": "כָּל יוֹמֵי נְדַר נִזְרֵיהּ גְלָב לָא יְעִבַּר עַל רֵישֵׁיהּ עַד זְמַן מִשְׁלַם יוֹמַיָא דְיִפְרֵשׁ לִשְׁמָא דַיְיָ קַדִישׁ יְהֵי מַרְבֶּה פֵּרוּעַ שְעַר רֵישֵׁיהּ", "pj_en": "All the days of his nazir-vow the razor shall not pass upon his head until the time when the days of his separation to the Name of the Lord be fulfilled; he shall be consecrate, letting the hair of his head grow.", "tj": "", "tj_en": "", "rashi": "<b>קדש יהיה.<\/b> הַשֵּׂעָר שֶׁלּוֹ, לְגַדֵּל הַפֶּרַע שֶׁל שְׂעַר רֹאשׁוֹ (ספרי; תענית י\"א):<br><br><b>פרע.<\/b> נָקוּד פַּתָּח קָטָן אַף שֶׁהוּא דָּבוּק לִשְׂעַר רֹאשׁוֹ — פֶּרַע שֶׁל שֵׂעָר, וּפֵרוּשׁ שֶׁל פֶּרַע, גִּדּוּל שֶׁל שֵׂעָר, וְכֵן \"אֶת רֹאשׁוֹ לֹא יִפְרָע\" (ויקרא כ\"א), וְאֵין קָרוּי פֶּרַע פָּחוֹת מִשְּׁלֹשִׁים יוֹם (ספרי; סנהדרין כ\"ב):", "rashi_en": "קדש יהיה means HOLY SHALL IT (not “he”) BE viz., his hair shall be holy. inasmuch as he must let grow freely the hair of his head (lit., so as to let grow the over-growth, פרע, of the hair of his head) (Sifrei Bamidbar 25; Taanit 4a).<br><br>פרע — The word פרע is punctuated (as to its first syllable) with Patach-Katan (Segol) because it is in construct state to שער ראשו and the meaning is: the פרע, the wild growth of שער ראשו — The meaning of the word פרע is over-growth of the hair; similar is (Leviticus 21:10) “He shall not let his hair grow wild (יפרע)”. Growth of the hair of less than thirty days’ duration does not come under the term פרע (Sifrei Bamidbar 25; Sanhedrin 22b)."}, {"ch": 6, "v": 6, "aliyah": 4, "heb": "כׇּל־יְמֵ֥י הַזִּיר֖וֹ לַיהֹוָ֑ה עַל־נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא׃", "onk": "כָּל יוֹמִין דְיַנְזֵר קֳדָם יְיָ עַל נַפְשָׁא דְמֵתָא לָא יֵיעוּל:", "onk_en": "All the days that he is a <i>Nazir<\/i> to Adonoy, he shall have no contact with the dead.", "pj": "כָּל יוֹמִין דְיַפְרֵישׁ לִשְׁמָא דַיְיָ עַל בַּר נַשׁ דְמִית לָא יֵיעִיל", "pj_en": "All the days of his separation to the Name of the Lord he shall not go in where there is a dead man.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 7, "aliyah": 4, "heb": "לְאָבִ֣יו וּלְאִמּ֗וֹ לְאָחִיו֙ וּלְאַ֣חֹת֔וֹ לֹא־יִטַּמָּ֥א לָהֶ֖ם בְּמֹתָ֑ם כִּ֛י נֵ֥זֶר אֱלֹהָ֖יו עַל־רֹאשֽׁוֹ׃", "onk": "לְאָבוּהִי וּלְאִמֵּיהּ לְאַחוּהִי וּלְאַחָתֵיהּ לָא יִסְתָּאַב לְהוֹן בְּמוֹתְהוֹן אֲרֵי כְּלִילָא דֶאֱלָהֵיהּ עַל רֵישֵׁיהּ:", "onk_en": "For his father, mother, brother and sister he shall not [ritually] defile himself for them when they die. For, the nazirite crown of his God is upon his head.", "pj": "לְאָבוּי וּלְאִמֵיהּ לְאָחוֹי וּלְאַחְתֵיהּ לָא יִסְתָּאַב לְהוֹן בְּמוֹתְהוֹן אֲרוּם כְּלִילָא דֶאֱלָהֵיהּ עַל רֵישֵׁיהּ", "pj_en": "For his father, or his mother, his brother, or his sister, he shall not make himself unclean through their decease; for the crown of Eloah is upon his head;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 8, "aliyah": 4, "heb": "כֹּ֖ל יְמֵ֣י נִזְר֑וֹ קָדֹ֥שׁ ה֖וּא לַֽיהֹוָֽה׃", "onk": "כֹּל יוֹמֵי נִזְרֵיהּ קַדִּישׁ הוּא קֳדָם יְיָ:", "onk_en": "All the days of his separation, he is sacred to Adonoy.", "pj": "כָּל יוֹמֵי נִזְרֵיהּ קָדוֹשׁ הוּא קֳדָם יְיָ", "pj_en": "all the days in which he is a Nazir lie shall be sacred before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>כל ימי נזרו קדש הוא.<\/b> זוֹ קְדֻשַּׁת הַגּוּף, מִלִּטַּמֵּא לְמֵתִים (ספרי):", "rashi_en": "כל ימי נזרו קדש הוא ALL THE DAYS OF HIS NAZARITESHIP HE IS HOLY — This refers to the holiness of his body which consists in his abstaining from defiling himself by reason of a corpse (Sifrei Bamidbar 27)."}, {"ch": 6, "v": 9, "aliyah": 4, "heb": "וְכִֽי־יָמ֨וּת מֵ֤ת עָלָיו֙ בְּפֶ֣תַע פִּתְאֹ֔ם וְטִמֵּ֖א רֹ֣אשׁ נִזְר֑וֹ וְגִלַּ֤ח רֹאשׁוֹ֙ בְּי֣וֹם טׇהֳרָת֔וֹ בַּיּ֥וֹם הַשְּׁבִיעִ֖י יְגַלְּחֶֽנּוּ׃", "onk": "וַאֲרֵי יְמוּת מֵתָא עֲלוֹהִי בִּתְכֵּף שָׁלוּ וִיסָאֵב רֵישׁ נִזְרֵיהּ וִיגַלַּח רֵישֵׁיהּ בְּיוֹמָא דִדְכוּתֵיהּ בְּיוֹמָא שְׁבִיעָאָה יְגַלְּחִנֵּה:", "onk_en": "If someone died near him suddenly, or unexpectedly, and caused his nazirite crowned head to be defiled, he shall shave his head on the day of his purification, he shall shave it on the seventh day.", "pj": "וַאֲרוּם יְמוּת מִיתָא עֲלוֹי בִּתְכּוֹף שְׁלוּ וְיִסְאָב רֵישׁ נִזְרֵיהּ וִיגַלַח רֵישֵׁיהּ בְּיוֹם דְכוּתֵיהּ בְּיוֹמָא שְׁבִיעָאָה יְגַלְחִינֵיהּ", "pj_en": "But if a person die near him suddenly, and he unawares defile the head of his vow, let him shave his head on the day of his purification; on the seventh day let him shave it.", "tj": "", "tj_en": "", "rashi": "<b>בפתע.<\/b> זֶה אֹנֶס:<br><br><b>פתאום.<\/b> זֶה שׁוֹגֵג, וְיֵ\"א פֶּתַע פִּתְאֹם דָּבָר אֶחָד הוּא – מִקְרֶה שֶׁל פִּתְאוֹם:<br><br><b>וכי ימות מת עליו.<\/b> בָּאֹהֶל שֶׁהוּא בוֹ:<br><br><b>ביום טהרתו.<\/b> בְּיוֹם הַזָּאָתוֹ, אוֹ אֵינוֹ אֶלָּא בַשְּׁמִינִי שֶׁהוּא טָהוֹר לְגַמְרֵי, תַּ\"ל \"בַּיּוֹם הַשְּׁבִיעִי\", אִי שְׁבִיעִי יָכוֹל אֲפִלּוּ לֹא הִזָּה, תַּ\"ל \"בְּיוֹם טָהֳרָתוֹ\" (ספרי):", "rashi_en": "בפתע — This refers to a Nazarite who defiles himself thus by accident. <br><br>פתאם — This refers to one who does so inadvertently (Sifrei Bamidbar 28:1; cf. Onkelos). — But there are some who say that פתע פתאום denotes one thing, viz., an occurrence of suddenness (by a sudden occurrence, suddenly).<br><br>וכי ימות מת עליו AND IF A MAN DIES עליו — i.e., in the tent where he (the נזיר) happens to be.<br><br>ביום טהרתו [THEN HE SHALL CLIP THE HAIR OF HIS HEAD] IN THE DAY OF HIS CLEANSING — i.e., on the day when he is being sprinkled with the מי חטאת, (the water containing the ashes of the Red Heifer; cf. Numbers 19:17). Or perhaps this is not so, but it means, on the eighth day when he is perfectly clean! It, however, continues: “on the seventh day [he shall clip it]”. But if it had written only “on the seventh day [he shall clip it]” I might have thought that he must clip his hair even if one had not sprinkled him for some reason or other! Scripture therefore also states “on the day of his cleansing [he shall clip the hair of his head]” (Sifrei Bamidbar 28:2)."}, {"ch": 6, "v": 10, "aliyah": 4, "heb": "וּבַיּ֣וֹם הַשְּׁמִינִ֗י יָבִא֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה אֶ֨ל־הַכֹּהֵ֔ן אֶל־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וּבְיוֹמָא תְמִּינָאָה יַיְתֵי תַּרְתֵּין שַׁפְנִינִין אוֹ תְרֵין בְּנֵי יוֹנָה לְוָת כַּהֲנָא לִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "On the eighth day he shall take two turtledoves or two young pigeons to the <i>kohein,<\/i> to the entrance of the Tent of Meeting.", "pj": "וּבְיוֹמָא תְמִינָאָה יַיְתֵי תְּרֵין שַׁפְנִינָן אוֹ תְּרֵין גוֹזְלִין בְּנֵי יוֹנָן לְוַת כַּהֲנָא לִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And on the eighth day let him bring two turtle doves, or two young pigeons, unto the priest at the door of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "<b>וביום השמיני יבא שתי תרים.<\/b> לְהוֹצִיא אֶת הַשְּׁבִיעִי, אוֹ אֵינוֹ אֶלָּא לְהוֹצִיא אֶת הַתְּשִׁיעִי ? קָבַע זְמַן לַקְּרֵבִין וְקָבַע זְמַן לַמַּקְרִיבִין, מַה קְּרֵבִין הִכְשִׁיר שְׁמִינִי וּמִשְּׁמִינִי וָהָלְאָה, אַף מַקְרִיבִין שְׁמִינִי וּמִשְּׁמִינִי וָהָלְאָה (שם):", "rashi_en": "וביום השמיני יבא שתי תרים AND ON THE EIGHTH DAY HE SHALL BRING TWO TURTLES — On the eighth day, thus excluding the seventh. Or perhaps this is not so, but it is intended to exclude the ninth day (i.e., that the offering must not be brought later than the eighth day)? But Scripture has fixed a date for the animals which are to be offered (cf. Leviticus 22:27), and has also fixed a date for the persons who bring offerings (Exodus 22:29). How is it in the case of the animals offered as sacrifices? It declared the eighth day and any time from the eighth onward as fit for offering them! So, too, in the case of persons offering sacrifices “the eighth day” implies the eighth and any day from the eighth onwards and only excludes the seventh or any earlier day (Sifrei Bamidbar 29:1)."}, {"ch": 6, "v": 11, "aliyah": 4, "heb": "וְעָשָׂ֣ה הַכֹּהֵ֗ן אֶחָ֤ד לְחַטָּאת֙ וְאֶחָ֣ד לְעֹלָ֔ה וְכִפֶּ֣ר עָלָ֔יו מֵאֲשֶׁ֥ר חָטָ֖א עַל־הַנָּ֑פֶשׁ וְקִדַּ֥שׁ אֶת־רֹאשׁ֖וֹ בַּיּ֥וֹם הַהֽוּא׃", "onk": "וְיַעְבֵּד כַּהֲנָא חַד לְחַטָּאתָא וְחַד לַעֲלָתָא וִיכַפֵּר עֲלוֹהִי מִדְּחָב עַל מֵתָא וִיקַדַּשׁ יָת רֵישֵׁיהּ בְּיוֹמָא הַהוּא:", "onk_en": "The <i>kohein<\/i> shall prepare one for a sin-offering and one for a burnt-offering and atone on his behalf from his sin [of contact] with a [departed] soul, and he shall sanctify his head on that day.", "pj": "וְיַעֲבֵד כַּהֲנָא חַד חַטָאתָא וְחַד לַעֲלָתָא וִיכַפֵּר עֲלוֹי מַאן דְחַב עַל דְאִסְתָּאַב לְמִיתָא וִיקַדֵשׁ יַת רֵישֵׁיהּ בְּיוֹמָא הַהוּא", "pj_en": "And the priest shall make one a sin offering, and one a burnt offering, and atone for him on account of that in which he hath sinned, in defiling himself by the dead: and he shall consecrate his head on that day.", "tj": "", "tj_en": "", "rashi": "<b>מאשר חטא על הנפש.<\/b> שֶׁלֹּא נִזְהַר מִטֻּמְאַת הַמֵּת, רַבִּי אֶלְעָזָר הַקַּפָּר אוֹמֵר, שֶׁצִּעֵר עַצְמוֹ מִן הַיַּיִן (ספרי; נזיר י\"ט):<br><br><b>וקדש את ראשו.<\/b> לַחֲזֹר וּלְהַתְחִיל מִנְיַן נְזִירוּתוֹ:", "rashi_en": "מאשר חטא על הנפש [AND THE PRIEST … MAKE EXPIATION FOR HIM] FOR THAT HE HATH SINNED BY THE DEAD — i.e., that he has not been on his guard against defilement by a corpse. — R. Eleazer ha-Kappar said, “his sin consists in that he has afflicted himself by abstaining from the enjoyment of wine (Sifrei Bamidbar 30; Nazir 19a). <br><br>וקדש את ראשו AND HE SHALL HALLOW HIS HEAD [THAT SAME DAY] by beginning again the counting of his Nazaritehood (i.e., he resumes his Nazaritehood)."}, {"ch": 6, "v": 12, "aliyah": 4, "heb": "וְהִזִּ֤יר לַֽיהֹוָה֙ אֶת־יְמֵ֣י נִזְר֔וֹ וְהֵבִ֛יא כֶּ֥בֶשׂ בֶּן־שְׁנָת֖וֹ לְאָשָׁ֑ם וְהַיָּמִ֤ים הָרִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽוֹ׃", "onk": "וְיַזֵּר קֳדָם יְיָ יָת יוֹמֵי נִזְרֵיהּ וְיַיְתִי אִמַּר בַּר שַׁתֵּיהּ לַאֲשָׁמָא וְיוֹמַיָּא קַדְמָאֵי יִבְטְלוּן אֲרֵי אִסְתָּאַב נִזְרֵיהּ:", "onk_en": "He shall set apart, for Adonoy, his nazirite days, and bring a sheep in its first year as a guilt-offering. The first days shall elapse because his nazirite crown was defiled.", "pj": "וְיַפְרֵשׁ קֳדָם יְיָ יַת יוֹמֵי נִזְרֵיהּ וְיַיְתֵי אִמַר בַּר שַׁתֵּיהּ לְאַשָׁמָא וְיוֹמַיָא קַדְמָאֵי יְבַטְלוּן אֲרוּם אִסְתָּאֵב נִזְרֵיהּ", "pj_en": "And let him dedicate before the Lord the days of his nazirate (afresh), and bring a lamb of the year for a trespass offering; but the former days will have been in vain, because he had defiled his nazirate.", "tj": "", "tj_en": "", "rashi": "<b>והזיר לה' את ימי נזרו.<\/b> יַחֲזֹר וְיִמְנֶה נְזִירוּתוֹ כְּבַתְּחִלָּה:<br><br><b>והימים הראשנים יפלו.<\/b> לֹא יַעֲלוּ מִן הַמִּנְיָן:", "rashi_en": "'והדר לה את ימי נזרו AND HE SHALL CONSECRATE IN HONOUR OF THE LORD THE DAYS OF HIS NAZARITEHOOD — i.e., he shall again count the days of his Nazaritehood as though for the first time (i.e., he must begin the counting of the period of his Nazaritehood from the first day, not resume it at the point where it was broken off).<br><br>והימים הראשנים יפלו AND THE DAYS THAT WERE BEFORE SHALL BE LOST — i.e. shall not come into account."}, {"ch": 6, "v": 13, "aliyah": 4, "heb": "וְזֹ֥את תּוֹרַ֖ת הַנָּזִ֑יר בְּי֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔וֹ יָבִ֣יא אֹת֔וֹ אֶל־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְדָא אוֹרַיְתָא דִנְזִירָא בְּיוֹם מִשְׁלַם יוֹמֵי נִזְרֵיהּ יַיְתִי יָתֵיהּ לִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "This is the law of the <i>Nazir<\/i>: when the days of his nazirite status are fulfilled, he shall bring himself to the entrance of the Tent of Meeting.", "pj": "וְדָא אַחֲוָויַת אוֹרַיְתָא נִזְרָא בְּיוֹם מִשְׁלַם יוֹמֵי אַפְרָשׁוּתָא יַמְטֵי יַת גַרְמֵיהּ לִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And this is the law of the Nazir on the day when his separation days are fulfilled: Let him present himself at the door of the tabernacle of ordinance,", "tj": "", "tj_en": "", "rashi": "<b>יביא אתו.<\/b> יָבִיא אֶת עַצְמוֹ, וְזֶה אֶחָד מִשְּׁלֹשָׁה אֶתִים שֶׁהָיָה רַבִּי יִשְׁמָעֵאל דּוֹרֵשׁ כֵּן, כַּיּוֹצֵא בוֹ \"וְהִשִּׂיאוּ אוֹתָם עֲוֹן אַשְׁמָה\" (ויקרא כ\"ב) — אֶת עַצְמָם, כַּיּוֹצֵא בוֹ \"וַיִּקְבֹּר אֹתוֹ בַגַּי\" (דברים ל\"ד) — הוּא קָבַר אֶת עַצְמוֹ:", "rashi_en": "יביא אתו means, he shall bring himself. This (the word אתו) is one of the three cases of את with a pronominal suffix which R. Ishmael explained thus (as being reflexive and not accusative pronouns). Similar to it is (Leviticus 22:16): והשאיו אותם עון אשמה “and they will bring אותם the iniquity of trespass”, i.e., “and they will bring upon themselves”. Similar to it is, (Deuteronomy 34:6) ויקבר אתו בני “He (Moses) buried himself in the glen”, (Sifrei Bamidbar 32; cf. Rashi on Leviticus 22:16 and Note thereon)."}, {"ch": 6, "v": 14, "aliyah": 4, "heb": "וְהִקְרִ֣יב אֶת־קׇרְבָּנ֣וֹ לַיהֹוָ֡ה כֶּ֩בֶשׂ֩ בֶּן־שְׁנָת֨וֹ תָמִ֤ים אֶחָד֙ לְעֹלָ֔ה וְכַבְשָׂ֨ה אַחַ֧ת בַּת־שְׁנָתָ֛הּ תְּמִימָ֖ה לְחַטָּ֑את וְאַֽיִל־אֶחָ֥ד תָּמִ֖ים לִשְׁלָמִֽים׃", "onk": "וִיקָרֵב יָת קֻרְבָּנֵיהּ קֳדָם יְיָ אִמַּר בַּר שַׁתֵּהּ שְׁלִים חַד לַעֲלָתָא וְאִמַּרְתָּא חֲדָא בַּת שַׁתֵּהּ שְׁלֶמְתָּא לְחַטָּאתָא וּדְכַר חַד שְׁלִים <b>לְנִכְסַת קוּדְשַׁיָּא<\/b>:", "onk_en": "He shall bring his offering to Adonoy; one unblemished sheep, in its first year, as a burnt-offering, and one unblemished ewe, in its first year as a sin-offering, and one unblemished ram as a peace-offering [<b>sacred sacrifice<\/b>].", "pj": "וְיַקְרִיב יַת קוּרְבָּנֵיהּ קֳדָם יְיָ אִימַר בַּר שַׁתֵּיהּ שְׁלִים חָד לַעֲלָתָא וְאִימַרְתָּא חֲדָא בְּרַת שַׁתָּא שְׁלֵימְתָּא לְחַטָאתָא וּדְכַר חַד שְׁלִים לְנִכְסַת קוּדְשַׁיָא", "pj_en": "and bring his oblation before the Lord, one lamb of the year unblemished for a burnt offering, and one ewe Iamb of the year unblemished for a sin offering, and one ram unblemished for the consecrated oblation;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 15, "aliyah": 4, "heb": "וְסַ֣ל מַצּ֗וֹת סֹ֤לֶת חַלֹּת֙ בְּלוּלֹ֣ת בַּשֶּׁ֔מֶן וּרְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּשָּׁ֑מֶן וּמִנְחָתָ֖ם וְנִסְכֵּיהֶֽם׃", "onk": "וְסַל פַּטִּיר סֻלְתָּא גְרִיצַן דְּפִילָן בִּמְשַׁח וְאִסְפּוֹגִין פַּטִּירִין דִמְשִׁיחִין בִּמְשָׁח וּמִנְחַתְהוֹן וְנִסְכֵּיהוֹן:", "onk_en": "A basket of <i>matzos<\/i> of fine flour, loaves mixed with oil and <i>matzoh<\/i>-wafers spread with oil and their meal-offerings and libations.", "pj": "וְסַלָא דְפַטִירֵי סְמִידָא גְרִיצָן בִּמְשַׁח זֵיתָא וְעֵרוּכִין פַּטִירִין דִמְשִׁיחִין בִּמְשַׁח זֵיתָא וּמִנְחַתְהוֹן וְנִסְכֵּיהוֹן", "pj_en": "and a basket of unleavened cakes of flour with olive oil, and unleavened wafers anointed with olive oil, their minchas and libations.", "tj": "", "tj_en": "", "rashi": "<b>ומנחתם ונסכיהם.<\/b> שֶׁל עוֹלָה וּשְׁלָמִים; לְפִי שֶׁהָיוּ בִכְלָל, וְיָצְאוּ לִדּוֹן בְּדָבָר חָדָשׁ — שֶׁיִּטָּעֲנוּ לֶחֶם — הֶחֱזִירָן לִכְלָלָן, שֶׁיִּטָּעֲנוּ נְסָכִים כְּדִין עוֹלָה וּשְׁלָמִים (ספרי):<br><br><b>חלות מצות ורקיקי מצות.<\/b> עֶשֶׂר מִכָּל מִין:", "rashi_en": "ומנחתם ונסכיהם AND THEIR MEAL-OFFERING AND THEIR DRINK-OFFERINGS — i.e., those of the burnt-offering and the feast-offerings (mentioned in v. 14; no חטאת except that of a leper requires נסכים). Because these (the עולה and the שלמים of the Nazir) are included in (come under) the general rule governing עולה and שלמים and have here been excepted to become subject to a new matter, viz., that they require an offering of bread together with them. Scripture restores them to the general rule by expressly stating that they require drink-offerings (and meal-offerings) as is the law of עולה and שלמים in general (Sifrei Bamidbar 34). <br><br>חלות מצות ורקיקי מצות (the word מצות must be connected with חלות too) PIERCED CAKES UNLEAVENED AND WAFERS OF UNLEAVENED BREAD — ten of each kind (Menachot 77b)."}, {"ch": 6, "v": 16, "aliyah": 4, "heb": "וְהִקְרִ֥יב הַכֹּהֵ֖ן לִפְנֵ֣י יְהֹוָ֑ה וְעָשָׂ֥ה אֶת־חַטָּאת֖וֹ וְאֶת־עֹלָתֽוֹ׃", "onk": "וִיקָרֵב כַּהֲנָא קֳדָם יְיָ וְיַעְבֵּד יָת חַטָּאתֵיהּ וְיָת עֲלָתֵיהּ:", "onk_en": "The <i>kohein<\/i> shall bring it before Adonoy and do the service of his sin-offering and of his burnt-offering.", "pj": "וִיקָרֵב כַּהֲנָא קֳדָם יְיָ וְיֶעֱבַד יַת חַטָאתֵיהּ וְיַת עֲלָתֵיהּ", "pj_en": "And the priest shall offer before the Lord, and perform the sin offering, and the burnt sacrifice;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 17, "aliyah": 4, "heb": "וְאֶת־הָאַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽיהֹוָ֔ה עַ֖ל סַ֣ל הַמַּצּ֑וֹת וְעָשָׂה֙ הַכֹּהֵ֔ן אֶת־מִנְחָת֖וֹ וְאֶת־נִסְכּֽוֹ׃", "onk": "וְיָת דִּכְרָא יַעְבֵּד <b>נִכְסַת קוּדְשַׁיָּא<\/b> קֳדָם יְיָ עַל סַלָּא דְפַטִּירַיָּא וְיַעְבֵּד כַּהֲנָא יָת מִנְחָתֵיהּ וְיָת נִסְכֵּיהּ:", "onk_en": "He shall make the ram a peace-offering [<b>sacred sacrifice<\/b>] for Adonoy along with the basket of <i>matzos,<\/i> and the <i>kohein<\/i> shall do the service of his meal-offering and libation.", "pj": "וְיַת דִיכְרָא יַעֲבֵד נִכְסַת קוּדְשִׁין קֳדָם יְיָ עַל סַלָא דְפַטִירַיָא וְיֶעֱבַד כַּהֲנָא יַת מִנְחָתֵיהּ וְיַת נִסְכֵּיהּ", "pj_en": "and make the ram a consecrated victim (peace offering) before the Lord, with the basket of unleavened; and the priest shall make its mincha and its libation.", "tj": "", "tj_en": "", "rashi": "<b>זבח שלמים לה' על סל המצות.<\/b> יִשְׁחַט אֶת הַשְּׁלָמִים עַל מְנָת לְקַדֵּשׁ אֶת הַלֶּחֶם (עי' מנחות מ\"ו):<br><br><b>את מנחתו ואת נסכו.<\/b> שֶׁל אַיִל:", "rashi_en": "זבח שלמים לה' על סל המצות [AND HE SHALL OFFER THE RAM] FOR A SACRIFICE OF A FEAST-OFFERING UNTO THE LORD, WITH THE BASKET OF UNLEAVENED BREAD — i.e., he shall slaughter the feast-offerings with the intention of sanctifying the bread by this very act (cf. Menachot 46b). <br><br>את מנחתו ואת נסכו [THE PRIEST SHALL ALSO OFFER] ITS MEAL-OFFERING AND ITS DRINK-OFFERING — those of the ram."}, {"ch": 6, "v": 18, "aliyah": 4, "heb": "וְגִלַּ֣ח הַנָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת־רֹ֣אשׁ נִזְר֑וֹ וְלָקַ֗ח אֶת־שְׂעַר֙ רֹ֣אשׁ נִזְר֔וֹ וְנָתַן֙ עַל־הָאֵ֔שׁ אֲשֶׁר־תַּ֖חַת זֶ֥בַח הַשְּׁלָמִֽים׃", "onk": "וִיגַלַּח נְזִירָא בִּתְרַע מַשְׁכַּן זִמְנָא יָת רֵישׁ נִזְרֵיהּ וְיִסַּב יָת שְׂעַר רֵישׁ נִזְרֵיהּ וְיִתֵּן עַל אֶשָּׁתָא דִּי תְחוֹת <b>דּוּדָא<\/b> דְּנִכְסַת <b>קוּדְשַׁיָּא<\/b>:", "onk_en": "The <i>Nazir<\/i> shall shave—at the entrance to the Tent of Meeting—the nazirite crown of hair on his head, and he shall take the hair from the nazirite crown on his head and put it in the fire which is under the [<b>cauldron of the<\/b>] peace-offering [<b>sacred<\/b>] sacrifice.", "pj": "וִיגַלַח נְזִירָא יַת רֵישׁ נִזְרֵיהּ לְבָרָא בָּתַר דִנְכִיסוּ יַת נִכְסַת קוּדְשַׁיָא בִּתְרַע מַשְׁכַּן זִמְנָא וְיִסַב יַת שְעַר רֵישׁ נִזְרֵיהּ וְיִתֵּן עַל אֵשָׁתָא דִתְחוֹת דוּדָא דְנִכְסַת קוּדְשַׁיָא", "pj_en": "And the Nazir shall shave his consecrated head, without, after the offering of the holy oblations at the door of the tabernacle of ordinance, and take the hair of his consecrated head, and lay it on the fire that is under the cauldron of the peace offering.", "tj": "", "tj_en": "", "rashi": "<b>וגלח הנזיר פתח אוהל מועד.<\/b> יָכוֹל יְגַלֵּחַ בָּעֲזָרָה, הֲרֵי זֶה דֶּרֶךְ בִּזָּיוֹן, אֶלָּא וְגִלַּח הַנָּזִיר לְאַחַר שְׁחִיטַת הַשְּׁלָמִים שֶׁכָּתוּב בָּהֶן \"וּשְׁחָטוֹ פֶּתַח אֹהֶל מוֹעֵד\":<br><br><b>אשר תחת זבח השלמים.<\/b> תַּחַת הַדּוּד שֶׁהוּא מְבַשְּׁלָן בּוֹ, לְפִי שֶׁשַּׁלְמֵי נָזִיר הָיוּ מִתְבַּשְּׁלִין בָּעֲזָרָה, שֶׁצָּרִיךְ לִטֹּל הַכֹּהֵן הַזְּרוֹעַ אַחַר שֶׁנִּתְבַּשְּׁלָה וּלְהָנִיף לִפְנֵי ה' (עי' נזיר מ\"ה):", "rashi_en": "וגלח הנזיר פתח אהל מועד AND THE NAZARITE SHALL CLIP [THE HAIR OF THE HEAD OF HIS NAZARITEHOOD] AT THE ENTRANCE OF THE APPOINTED TENT — One might think that he must cut his hair in the forecourt (for it states at the entrance of the appointed tent)! Surely, this would be treating the forecourt in a contemptuous manner! But the meaning is: the Nazarite shall cut his hair after the feast-offerings had been slaughtered of which Scripture writes, (Leviticus 3:2) “and he shall slaughter it פתח אהל מועד” (cf. Sifrei Bamidbar 35; Nazir 45a).<br><br>אשר תחת זבח השלמים [AND HE SHALL TAKE THE HAIR … AND PUT IT IN THE FIRE] WHICH IS UNDER THE SACRIFICE OF THE FEAST-OFFERINGS — i.e., under the pot in which he boils it (the שלמים); because the feast offerings of the Nazarite were boiled in the forecourt since the priest had to take “the shoulder” after it had been boiled (cf. vv. 19 and 20) and to wave it before the Lord (cf. Nazir 45b)."}, {"ch": 6, "v": 19, "aliyah": 4, "heb": "וְלָקַ֨ח הַכֹּהֵ֜ן אֶת־הַזְּרֹ֣עַ בְּשֵׁלָה֮ מִן־הָאַ֒יִל֒ וְֽחַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן־הַסַּ֔ל וּרְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְנָתַן֙ עַל־כַּפֵּ֣י הַנָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥וֹ אֶת־נִזְרֽוֹ׃", "onk": "וְיִסַּב כַּהֲנָא יָת דְּרָעָא בְּשֵׁלָא מִן דִּכְרָא וּגְרִצְתָּא פַּטִּירְתָּא חֲדָא מִן סַלָּא וְאִסְפּוֹג פַּטִּיר חַד וְיִתֵּן עַל יְדֵי נְזִירָא בָּתַר דְּגַלַּח יָת נִזְרֵיהּ:", "onk_en": "The <i>kohein<\/i> shall take the cooked foreleg from the ram and one <i>matzoh<\/i>-loaf from the basket, and one <i>matzoh<\/i>-wafer, and put it on the palms [<b>hands<\/b>] of the <i>Nazir<\/i> after he has shaved his nazirite crown.", "pj": "וְיִסַב כַּהֲנָא יַת אֶדְרוֹעָא דְמִיבַשְׁלָא שְׁלֵימָא מִן דִיכְרָא וּגְרִיצְתָּא פַּטִירְתָּא חֲדָא מִן סַלָא וְעָרוּךְ פַּטִיר חָד וְיִתֵּן עַל יְדֵי נְזִירָא בָּתַר דְיִגְלַח יַת נִזְרֵיהּ", "pj_en": "And the priest shall take the shoulder that is boiled, entire from the ram, and one unleavened cake from the basket, and one unleavened wafer, and put upon the hands of the Nazirite, after he hath shaved his head of the consecration.", "tj": "", "tj_en": "", "rashi": "<b>הזרע בשלה.<\/b> לְאַחַר שֶׁנִּתְבַּשְּׁלָה (חולין פ\"ח):", "rashi_en": "הזרע בשלה [AND THE PRIEST SHALL TAKE] THE SHOULDER בשלה — i.e. after it has been boiled."}, {"ch": 6, "v": 20, "aliyah": 4, "heb": "וְהֵנִיף֩ אוֹתָ֨ם הַכֹּהֵ֥ן&thinsp;<small>׀<\/small>&thinsp;תְּנוּפָה֮ לִפְנֵ֣י יְהֹוָה֒ קֹ֤דֶשׁ הוּא֙ לַכֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַתְּנוּפָ֔ה וְעַ֖ל שׁ֣וֹק הַתְּרוּמָ֑ה וְאַחַ֛ר יִשְׁתֶּ֥ה הַנָּזִ֖יר יָֽיִן׃", "onk": "וִירִים יָתְהוֹן כַּהֲנָא אֲרָמָא קֳדָם יְיָ קוּדְשָׁא הוּא לְכַהֲנָא עַל חַדְיָא דַאֲרָמוּתָא וְעַל שָׁקָא דְאַפְרָשׁוּתָא וּבָתַר כֵּן יִשְׁתֵּי נְזִירָא חַמְרָא:", "onk_en": "The <i>kohein<\/i> shall wave them as a wave-offering, before Adonoy. It is consecrated to the <i>kohein<\/i> besides the breast of the wave-offering and the separated thigh portion. After this, the <i>Nazir<\/i> may drink wine.", "pj": "וְיָרִים יַתְהוֹן כַּהֲנָא אֲרָמָא קוּדְשָׁא הוּא לְכַהֲנָא עַל חַדְיָא דַאֲרָמוּתָא וְעַל שׁוֹקָא דְאַפְרָשׁוּתָא וּמִבָּתַר כְּדֵין יִשְׁתֵּי נְזִירָא חַמְרָא", "pj_en": "And the priest shall uplift them for an elevation. It is sacred; it belongeth to the priest, with the breast of the elevation, and the separated shoulder. And after that the Nazirite may drink wine.", "tj": "", "tj_en": "", "rashi": "<b>קדש הוא לכהן.<\/b> הַחַלָּה וְהָרָקִיק וְהַזְּרוֹעַ תְּרוּמָה הֵן לַכֹּהֵן:<br><br><b>על חזה התנופה.<\/b> מִלְּבַד חָזֶה וְשׁוֹק הָרְאוּיִים לוֹ מִכָּל שְׁלָמִים מוּסָף עַל שַׁלְמֵי נָזִיר הַזְּרוֹעַ הַזֶּה, לְפִי שֶׁהָיוּ שַׁלְמֵי נָזִיר בִּכְלָל, וְיָצְאוּ לִדּוֹן בַּדָּבָר הֶחָדָשׁ — לְהַפְרָשַׁת זְרוֹעַ — הֻצְרַךְ לְהַחֲזִירָן לִכְלָלָן לִדּוֹן אַף בְּחָזֶה וְשׁוֹק (ספרי):", "rashi_en": "קדש הוא לכהן IT IS HOLY FOR THE PRIEST — The cake, the wafer and the shoulder are a heave-offering for the priest.<br><br>על חזה התנופה means: BESIDES THE BREAST AND THE SHOULDER which are due to him (the priest) from all feast-offerings, there is to be added to the portions assigned to the priest in the case of the Nazarite’s feast-offerings, this shoulder. Because the feast-offerings of the Nazarite are included in the general rule governing feast-offerings but were excepted to become subject to a new matter — the setting apart of the shoulder for the priest — it became necessary to restore them to the general rule of שלמים by expressly stating that they are subjected also to the setting apart of the breast and thigh as are שלמים in general (Sifrei Bamidbar 37)."}, {"ch": 6, "v": 21, "aliyah": 4, "heb": "זֹ֣את תּוֹרַ֣ת הַנָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קׇרְבָּנ֤וֹ לַֽיהֹוָה֙ עַל־נִזְר֔וֹ מִלְּבַ֖ד אֲשֶׁר־תַּשִּׂ֣יג יָד֑וֹ כְּפִ֤י נִדְרוֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "דָּא אוֹרַיְתָא דִנְזִירָא דִּי יִדַּר קֻרְבָּנֵיהּ קֳדָם יְיָ עַל נִזְרֵיהּ בַּר <b>מִדְּתַדְבֵּק יְדֵיהּ<\/b> כְּפוּם נִדְרֵיהּ דִּי יִדַּר כֵּן יַעְבֵּד עַל אוֹרַיְתָא דְנִזְרֵיהּ:", "onk_en": "This is the law of the <i>Nazir<\/i> who has vowed—[this is] his offering to Adonoy for his nazirite vow, aside from what he can afford [lit. <b>may attach to his hands<\/b>] to bring according to his vow that he vows. So shall he fulfill in addition to the laws of his nazirite [vows.]", "pj": "דָא אַחְוָיַית אוֹרַיְיתָא נְזִירָא דִי יִדַר קוּרְבָּנֵיהּ קֳדָם יְיָ עַל נִזְרֵיהּ בַּר מִן מַה דְתִדְבַּק יְדֵיהּ כְּמֵסַת נִדְרֵיהּ לְאַיְיתָאָה מִן דִי יִדַר הֵיכְדֵין יַעֲבֵד עַל אוֹרַיְיתָא נִזְרֵיהּ", "pj_en": "This is the declaration of the law of the Nazir who shall have vowed his oblation before the Lord for his separation, besides what may come into his hand according to the rule (or measure) of his vow, to bring that which he had vowed; so shall he do according to the law of his nazirate.", "tj": "", "tj_en": "", "rashi": "<b>מלבד אשר תשיג ידו.<\/b> שֶׁאִם אָמַר הֲרֵינִי נָזִיר עַל מְנָת לְגַלֵּחַ עַל מֵאָה עוֹלוֹת וְעַל מֵאָה שְׁלָמִים, כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר כֵּן יַעֲשֶֹה — מוּסָף עַל תּוֹרַת נִזְרוֹ: עַל תּוֹרַת הַנָּזִיר, מוּסָף וְלֹא יֶחְסַר, שֶׁאִם אָמַר הֲרֵינִי נָזִיר חָמֵשׁ נְזִירוֹת עַל מְנָת לְגַלֵּחַ עַל שָׁלֹשׁ בְּהֵמוֹת הַלָּלוּ, אֵין אֲנִי קוֹרֵא בוֹ \"כַּאֲשֶׁר יִדֹּר כֵּן יַעֲשֶֹה\" (שם):", "rashi_en": "מלבד אשר תשיג ידו [THIS IS THE LAW OF THE NAZARITE WHO HATH VOWED, AND OF HIS OFFERING UNTO THE LORD …] BESIDES THAT WHICH HIS HAND SHALL GET — This implies that if he vowed: “Behold, I take upon myself to become a Nazir under the condition that I shall cut my hair (i.e. that I shall make the final ceremony) in connection with the offering of a hundred burnt offerings and a hundred feast offerings” (whilst really there is prescribed a single offering of each kind) — then כפי נדרו אשר ידור כן יעשה ACCORDING TO THE VOW WHICH HE HATH VOWED MUST HE DO, but “in addition to (על) what is prescribed in the usual law of the Nazarite”. In addition to it, but not omitting any of it — so that if he vowed: “Behold, I take upon myself to become a Nazir five times under the condition to cut my hair (i.e. to make the final ceremony once) in connection with the offering of only these three animals (i. e. one עולה, one שלמים and one חטאת, whilst after the elapse of each term an עולה and a שלמים offering are due), I do not read with reference to him (i.e. I do not apply to him the words): “According to the vow which he vowed, so must he do” [— but he must bring each of the offerings five times as prescribed] (Sifrei Bamidbar 38)."}, {"ch": 6, "v": 22, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 6, "v": 23, "aliyah": 4, "heb": "דַּבֵּ֤ר אֶֽל־אַהֲרֹן֙ וְאֶל־בָּנָ֣יו לֵאמֹ֔ר כֹּ֥ה תְבָרְכ֖וּ אֶת־בְּנֵ֣י יִשְׂרָאֵ֑ל אָמ֖וֹר לָהֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "מַלֵּל עִם אַהֲרֹן וְעִם בְּנוֹהִי לְמֵימַר כְּדֵין תְּבָרְכוּן יָת בְּנֵי יִשְׂרָאֵל תֵּימְרוּן לְהוֹן:", "onk_en": "Speak to Aharon and to his sons, saying; This is how you shall bless Bnei Yisroel, saying to them:", "pj": "מַלֵיל עִם אַהֲרן וְעִם בְּנוֹי לְמֵימָר כִּדְנָא תְבָרְכוּן יַת בְּנֵי יִשְרָאֵל בְּמִפְרַסְהוֹן יְדֵיהוֹן עַל דוּכְנָא בַּהֲדֵין לִישָׁן יֵימְרוּן לְהוֹן יְבָרֶכְךָ יְיָ וְיִשְׁמְרֶךָ. יָאֵר יְיָ פָּנָיו אֵלֶיךָ וִיחֻנֶךָּ. יִשָא יְיָ פָּנָיו אֵלֶיךָ וְיָשֵם לְךָ שָׁלוֹם", "pj_en": "Speak with Aharon and his sons, saying: Thus shall you bless the children of Israel, while spreading forth the hands from the high place; in this tongue.", "tj": "", "tj_en": "", "rashi": "<b>אמור.<\/b> כְּמוֹ זָכוֹר, שָׁמוֹר, בְּלַעַז דישנ\"ט:<br><br><b>אמור להם.<\/b> שֶׁיִּהְיוּ כֻלָּם שׁוֹמְעִים (שם):<br><br><b>אמור.<\/b> מָלֵא — לֹא תְבָרְכֵם בְּחִפָּזוֹן וּבַהֲלוּת, אֶלָּא בְכַוָּנָה וּבְלֵב שָׁלֵם (תנחומא):", "rashi_en": "אמור is infinitive. Similar forms are זכור (Exodus 20:8), שמור (Deuteronomy 5:12); in O. F. disant, (English = saying).<br><br>אמור להם SAYING UNTO THEM — so that all of them should hear the blessing (it would not suffice to pronounce the blessings upon the Israelites in their absence; cf. Sifrei Bamidbar 39).<br><br>אמור is written plene (with ו after the מ) thus indicating: ye shall not bless them hurriedly and hastily, but devoutly and with a whole heart (Midrash Tanchuma, Nasso 10)."}, {"ch": 6, "v": 24, "aliyah": 4, "heb": "יְבָרֶכְךָ֥ יְהֹוָ֖ה וְיִשְׁמְרֶֽךָ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יְבָרְכִנָּךְ יְיָ וְיִטְּרִנָּךְ:", "onk_en": "May Adonoy bless you and protect you.", "pj": "יְבָרְכִינָךָ יְיָ בְּכָל עִסְקָךְ וְיִטְרִינָךְ מִן לִילֵי וּמְזַיְיעֵי וּבְנֵי טִיהַרְרֵי וּבְנֵי צַפְרִירֵי וּמַזִיקֵי וּטְלוֹי", "pj_en": "The Lord bless thee and keep thee. The Lord make His face to shine upon thee, and gracious unto thee. The Lord lift up His countenance upon thee, and grant thee peace. The Lord bless thee in all thy business, and keep) thee from demonsof the night, and things that cause terror, and from demons of the noon and of the morning, and from malignant spirits and phantoms.", "tj": "", "tj_en": "", "rashi": "<b>יברכך.<\/b> שֶׁיִּתְבָּרְכוּ נְכָסֶיךָ:<br><br><b>וישמרך.<\/b> שֶׁלֹּא יָבֹאוּ עָלֶיךָ שׁוֹדְדִים לִטֹּל מָמוֹנְךָ; שֶׁהַנּוֹתֵן מַתָּנָה לְעַבְדּוֹ אֵינוֹ יָכוֹל לְשָׁמְרוֹ מִכָּל אָדָם, וְכֵיוָן שֶׁבָּאִים לִסְטִים עָלָיו וְנוֹטְלִין אוֹתָהּ מִמֶּנּוּ, מַה הֲנָאָה יֵשׁ לוֹ בְּמַתָּנָה זוֹ? אֲבָל הַקָּבָּ\"ה, הוּא הַנּוֹתֵן, הוּא הַשּׁוֹמֵר; וְהַרְבֵּה מִדְרָשִׁים דָּרְשׁוּ בוֹ בְּסִפְרֵי:", "rashi_en": "יברכך [THE LORD] BLESS THEE — that thy property may increase (Sifrei Bamidbar 40). <br><br>וישמרך AND MAY HE GUARD THEE — that no robbers come upon thee to take away thy property. For a human being who gives a present to his servant cannot guard him against everybody, and if a band of robbers attack him and take it away, what pleasure can he, then, derive from this present?! The Holy One, blessed be He, however, both gives and guards — against everybody (Midrash Tanchuma, Nasso 10). Many Midrashic interpretations are given of this verse in the Sifrei  (Sifrei Bamidbar 40)."}, {"ch": 6, "v": 25, "aliyah": 4, "heb": "יָאֵ֨ר יְהֹוָ֧ה&thinsp;<small>׀<\/small>&thinsp;פָּנָ֛יו אֵלֶ֖יךָ וִֽיחֻנֶּֽךָּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יַנְהַר יְיָ <b>שְׁכִנְתֵּיהּ<\/b> לְוָתָךְ וִירַחֵם יָתָךְ:", "onk_en": "May Adonoy cause His countenance [<b>Shechinah<\/b>] to shine upon you and favor you.", "pj": "יַנְהַר יְיָ סְבַר אַפּוֹי לָךְ בְּמֵעַסְקָךְ בְּאוֹרַיְיתָא וְיִגְלֵי לָךָ טְמִירָן וְיֵיחוֹס עֲלָךְ", "pj_en": "The Lord make His face to shine upon thee, when occupied in the law, and reveal to thee its secrets, and be merciful unto thee.", "tj": "", "tj_en": "", "rashi": "<b>יאר השם פניו אליך.<\/b> יַרְאֶה לְךָ פָּנִים שׂוֹחֲקוֹת, פָּנִים צְהֻבּוֹת:<br><br><b>ויחנך.<\/b> יִתֵּן לְךָ חֵן (תנחומא):", "rashi_en": "יאר ה' פניו אליך THE LORD MAKE HIS FACE SHINE UPON THEE — i.e. May He show thee a friendly (more lit., smiling) countenance — a beaming countenance.<br><br>ויחנך means, May He grant thee good favour (חן) (Sifrei Bamidbar 41)."}, {"ch": 6, "v": 26, "aliyah": 4, "heb": "יִשָּׂ֨א יְהֹוָ֤ה&thinsp;<small>׀<\/small>&thinsp;פָּנָיו֙ אֵלֶ֔יךָ וְיָשֵׂ֥ם לְךָ֖ שָׁלֽוֹם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יִסַּב יְיָ אַפֵּיהּ לְוָתָךְ וִישַׁוֵּי לָךְ שְׁלָם:", "onk_en": "May Adonoy lift His face to you, and grant you peace.", "pj": "יַסְבַּר יְיָ סְבַר אַפּוֹי לָךְ בִּצְלוּתָךְ וִישַׁוֵי עֲלָךְ שְׁלַם בְּכָל תְּחוּמָךְ", "pj_en": "The Lord lift up His countenance upon thee in thy prayer, and grant thee peace in thy end.", "tj": "", "tj_en": "", "rashi": "<b>ישא ה' פניו אליך.<\/b> יִכְבֹּשׁ כַּעֲסוֹ:", "rashi_en": "ישא ה' פניו אליך THE LORD LIFT UP HIS COUNTENANCE UPON THEE — This expresses the idea: May He suppress His anger (Numbers Rabbah 11:7))."}, {"ch": 6, "v": 27, "aliyah": 4, "heb": "וְשָׂמ֥וּ אֶת־שְׁמִ֖י עַל־בְּנֵ֣י יִשְׂרָאֵ֑ל וַאֲנִ֖י אֲבָרְכֵֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִישַׁוּוּן יָת <b>בִּרְכַּת<\/b> שְׁמִי עַל בְּנֵי יִשְׂרָאֵל וַאֲנָא אֲבָרֵכִנּוּן:", "onk_en": "They shall bestow [<b>the blessing of<\/b>] My Name upon Bnei Yisroel, and I will bless them.", "pj": "וִישַׁווּן יַת בִּרְכַּת שְׁמִי עַל בְּנֵי יִשְרָאֵל וַאֲנָא בְּמֵימְרִי אֲבָרְכִינוּן", "pj_en": "And they shall bestow the benediction of My Name upon the children of Israel, and I, by My Word, will bless them.", "tj": "", "tj_en": "", "rashi": "<b>ושמו את שמי.<\/b> יְבָרְכוּם בַּשֵּׁם הַמְפֹרָשׁ (ספרי):<br><br><b>ואני אברכם.<\/b> לְיִשְׂרָאֵל, וְאַסְכִּים עִם הַכֹּהֲנִים; דָּ\"אַ, וַאֲנִי אֲבָרְכֵם — לַכֹּהֲנִים (חולין מ\"ט):", "rashi_en": "ושמו את שמי AND THEY SHALL PUT MY NAME [UPON THE CHILDREN OF ISRAEL] — i.e. they shall bless them by the Proper Name of God (i. e. when uttering the blessings they shall use the Tetragrammaton and no substitute for it) (Sifrei Bamidbar 43).<br><br>ואני אברכם AND I WILL BLESS THEM — i.e. I will bless the Israelites: I will give My approval to the priests’ blessings (lit., I will agree with the priests). — Another explanation of “And I will bless them” is: “And I will bless the priests (Chullin 49a)."}, {"ch": 7, "v": 1, "aliyah": 5, "heb": "וַיְהִ֡י בְּיוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְהָקִ֣ים אֶת־הַמִּשְׁכָּ֗ן וַיִּמְשַׁ֨ח אֹת֜וֹ וַיְקַדֵּ֤שׁ אֹתוֹ֙ וְאֶת־כׇּל־כֵּלָ֔יו וְאֶת־הַמִּזְבֵּ֖חַ וְאֶת־כׇּל־כֵּלָ֑יו וַיִּמְשָׁחֵ֖ם וַיְקַדֵּ֥שׁ אֹתָֽם׃", "onk": "וַהֲוָה בְּיוֹמָא דְשֵׁיצֵי משֶׁה לַאֲקָמָא יָת מַשְׁכְּנָא וְרַבִּי יָתֵיהּ וְקַדִּישׁ יָתֵיהּ וְיָת כָּל מָנוֹהִי וְיָת מַדְבְּחָא וְיָת כָּל מָנוֹהִי וְרַבִּנּוּן וְקַדִּישׁ יָתְהוֹן:", "onk_en": "It came to pass, on the day Moshe finished erecting the <i>Mishkon,<\/i> and he anointed it and consecrated it and all of its utensils, and the Altar and all its utensils, and he anointed them and consecrated them.", "pj": "וַהֲוָה בְּיוֹם רֵישׁ יַרְחָא דְנִיסָן פְּסַק משֶׁה לְמִקְמָא יַת מַשְׁכְּנָא דְלָא פַּרְקֵיהּ תּוּב וְרַבֵּי יָתֵיהּ וְקַדִישׁ יָתֵיהּ וְיַת כָּל מָנוֹי וְיַת מַדְבְּחָא וְיַת כָּל מָנוֹי וְרַבִּינוּן וְקַדִישׁ יַתְהוֹן", "pj_en": "And it was on the day which begins the month of Nisan, when Mosheh had finished to uprear the tabernacle, he took it not in pieces again, but anointed and consecrated it and all its vessels, the altar and all the vessels thereof, and he anointed them and hallowed them;", "tj": "", "tj_en": "", "rashi": "<b>ויהי ביום כלות משה.<\/b> כלת כְּתִיב — יוֹם הֲקָמַת הַמִּשְׁכָּן הָיוּ יִשְׂרָאֵל כְּכַלָּה הַנִּכְנֶסֶת לַחֻפָּה (פסיקתא; תנחומא):<br><br><b>כלות משה.<\/b> בְּצַלְאֵל וְאָהֳלִיאָב וְכָל חֲכַם לֵב עָשׂוּ אֶת הַמִּשְׁכָּן, וּתְלָאוֹ הַכָּתוּב בְּמֹשֶׁה, לְפִי שֶׁמָּסַר נַפְשׁוֹ עָלָיו, לִרְאוֹת תַּבְנִית כָּל דָּבָר וְדָבָר כְּמוֹ שֶׁהֶרְאָהוּ בָהָר, לְהוֹרוֹת לְעוֹשֵׂי הַמְּלָאכָה, וְלֹא טָעָה בְּתַבְנִית אַחַת; וְכֵן מָצִינוּ בְּדָוִד, לְפִי שֶׁמָּסַר נַפְשׁוֹ עַל בִּנְיַן בֵּית הַמִּקְדָּשׁ, שֶׁנֶּאֱמַר \"זְכוֹר ה' לְדָוִד אֵת כָּל עֻנּוֹתוֹ אֲשֶׁר נִשְׁבַּע לַה'\" וְגוֹ' (תהילים קל\"ב), לְפִיכָךְ נִקְרָא עַל שְׁמוֹ, שֶׁנֶּאֱמַר (מ\"א י\"ב) \"רְאֵה בֵיתְךָ דָּוִד\" (תנחומא):<br><br><b>כלות משה להקים.<\/b> וְלֹא נֶאֱמַר בְּיוֹם הָקִים, מְלַמֵּד שֶׁכָּל שִׁבְעַת יְמֵי הַמִּלּוּאִים הָיָה מֹשֶׁה מַעֲמִידוֹ וּמְפָרְקוֹ, וּבְאוֹתוֹ הַיּוֹם הֶעֱמִידוֹ וְלֹא פֵּרְקוֹ, לְכָךְ נֶאֱמַר \"כַּלּוֹת מֹשֶׁה לְהָקִים\" — אוֹתוֹ הַיּוֹם כָּלוּ הֲקָמוֹתָיו, וְרֹאשׁ חֹדֶשׁ נִיסָן הָיָה, בַּשֵּׁנִי נִשְׂרְפָה הַפָּרָה, בַּשְּׁלִישִׁי הִזּוּ הַזָּיָה רִאשׁוֹנָה, וּבַשְּׁבִיעִי גִּלְּחוּ (ספרי):", "rashi_en": "ויהי ביום כלות משה AND IT CAME TO PASS ON THE DAY THAT MOSES HAD FINISHED [RAISING THE TABERNACLE] — The word כלות is written defective (without ו after the ל) thus indicating: on the day that the Tabernacle was erected Israel was like a bride (כלה) who goes beneath the marriage canopy (Midrash Tanchuma, Nasso 20). (Cf. Rashi on Exodus 31:18.)<br><br>כלות משה MOSES HAD FINISHED — Bezalel and Ohaliab and all the wise-hearted men made the Tabernacle (cf. Exodus 36:1), but Scripture attributes it to Moses (describes it as his work), because he devoted himself wholeheartedly to it, to see that the shape of each article was exactly as He had shewn him on the mountain — to show the workmen how it should be made; nor did he err in a single shape. — A similar thing do we find in the case of David: because he devoted himself to the building of the Holy Temple, — as it is said, (Psalms 132:1—5) “Lord, remember David, and all his affliction: How he swore unto the Lord … [I will not give sleep to mine eyes … until I find out a place for the Lord …]”, therefore it is called by his name, as it is said, (1 Kings 12:16) “Now see your own house, David\" (Midrash Tanchuma, Nasso 13).<br><br>כלות משה להקים [AND IT CAME TO PASS ON THE DAY] THAT MOSES HAD FINISHED SETTING UP [THE TABERNACLE] — but it is not said, “on the day Moses set up”; this (the phrase כלות … להקים, “had finished setting up”) teaches us that during each of the seven days of installation Moses used to erect and dismantle it (the Tabernacle), but on that day (the eighth) he erected it but did not again dismantle it; for this reason it is said: “on the day that (Moses) finished setting up” — i.e. on that day his several erections of it came to an end. — It was the New Moon (the first day) of Nisan (cf. Rashi on Leviticus 9:1 and Note thereon), on the second the Red Heifer was burnt, on the third they (the Levites) were sprinkled for the first time with the water in which its ashes were mingled (cf. Rashi on 8:7), and on the seventh day, after having been again sprinkled, they shaved their bodies and were ready to enter on their duties (cf. 8:6—7) (Sifrei Bamidbar 44)."}, {"ch": 7, "v": 2, "aliyah": 5, "heb": "וַיַּקְרִ֙יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑ם הֵ֚ם נְשִׂיאֵ֣י הַמַּטֹּ֔ת הֵ֥ם הָעֹמְדִ֖ים עַל־הַפְּקֻדִֽים׃", "onk": "וּקְרִיבוּ רַבְרְבֵי יִשְׂרָאֵל רֵישֵׁי בֵּית אֲבָהַתְהוֹן אִנּוּן רַבְרְבֵי שִׁבְטַיָּא אִנּוּן דְּקַיְמִין עַל מִנְיָנַיָּא:", "onk_en": "The leaders of Israel brought, [those who were] the heads of their fathers’ houses; they were the leaders of the tribes, they stood by during the counting.", "pj": "וְקָרִיבוּ אֲמַרְכְּלַיָא דְיִשְרָאֵל רֵישֵׁי בֵּית אַבְהַתְהוֹן הִינוּן רַבְרְבֵי שִׁבְטַיָא הִינוּן דְמִתְמַנָן בְּמִצְרַיִם אֲמַרְכּוֹלִין עַל מִנְיָנַיָא", "pj_en": "then the leaders of Israel, who were the chiefs of the house of their fathers, brought their offerings. These were they who had been appointed in Mizraim chiefs over the numbered,", "tj": "", "tj_en": "", "rashi": "<b>הם נשיאי המטת.<\/b> שֶׁהָיוּ שׁוֹטְרִים עֲלֵיהֶם בְּמִצְרַיִם וְהָיוּ מֻכִּים עֲלֵיהֶם, שֶׁנֶּאֱמַר (שמות ה') וַיֻּכּוּ שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל וְגוֹ' (ספרי):<br><br><b>הם העמדים על הפקדים.<\/b> שֶׁעָמְדוּ עִם מֹשֶׁה וְאַהֲרֹן כְּשֶׁמָּנוּ אֶת יִשְֹרָאֵל, שֶׁנֶּאֱמַר \"וְאִתְּכֶם יִהְיוּ וְגוֹ'\" (במדבר א'):", "rashi_en": "הם נשיאי המטת  THESE ARE THE LEADERS OF THE TRIBES — They were the officers [appointed] over them in Egypt, and they were beaten on account of them, as it says (Exodus 5:14),“The officers of the children of Israel were beaten” (Sifrei Bamidbar 45).<br><br>הם העמדים על הפקדים  THEY WHO STOOD OVER THE COUNTING — They stood with Moses and Aaron when they counted the Israelites, as it says,“With you [Moses and Aaron] there shall be [a man from each tribe]” (Numbers 1:4)."}, {"ch": 7, "v": 3, "aliyah": 5, "heb": "וַיָּבִ֨יאוּ אֶת־קׇרְבָּנָ֜ם לִפְנֵ֣י יְהֹוָ֗ה שֵׁשׁ־עֶגְלֹ֥ת צָב֙ וּשְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל־שְׁנֵ֥י הַנְּשִׂאִ֖ים וְשׁ֣וֹר לְאֶחָ֑ד וַיַּקְרִ֥יבוּ אוֹתָ֖ם לִפְנֵ֥י הַמִּשְׁכָּֽן׃", "onk": "וְאַיְתִיוּ יָת קֻרְבָּנֵיהוֹן קֳדָם יְיָ שִׁית עֶגְלָן כַּד מְחַפְיַן וּתְרֵי עֲשַׂר תּוֹרִין עֶגְלְתָא עַל תְּרֵין רַבְרְבַיָּא וְתוֹר לְחַד וְקָרִיבוּ יָתְהוֹן לָקֳדָם מַשְׁכְּנָא:", "onk_en": "They brought their offerings before Adonoy; six covered wagons and twelve oxen; a wagon for each two leaders and an ox for each individual, and they placed them before the <i>Mishkon.<\/i>", "pj": "וְאַיְתִיוּ יַת קָרְבַּנְהוֹן קֳדָם יְיָ שִׁית עֶגְלָן כַּד מְחַפָּן וּמְטַקְסָן וּתְרֵיסַר תּוֹרִין עֶגְלָתָא בֵּינֵי תְרֵין אֲמַרְכְּלִין וְתוֹרָא לְחַד וְלָא צְבָא משֶׁה לְמִסַב מִנְהוֹן וּקְרִיבוּ יַתְהוֹן קֳדָם מַשְׁכְּנָא", "pj_en": "and they brought their offering before the Lord; six wagons covered and fitted up, and twelve oxen; one wagon for two princes and one ox for each. But Mosheh was not willing to receive them, and they brought them before the tabernacle.", "tj": "שִׁית עֶגְלָן מְזַוְוגָן:", "tj_en": "Six wagons yoked.", "rashi": "<b>שש עגלת צב.<\/b> אֵין צָב אֶלָּא מְחֻפִּים, וְכֵן \"וּבַצַּבִּים וּבַפְּרָדִים\" (ישעיה ס\"ו); עֲגָלוֹת מְכֻסּוֹת קְרוּיוֹת צַבִּים:<br><br><b>ויקריבו אותם לפני המשכן.<\/b> שֶׁלֹּא קִבֵּל מֹשֶׁה מִיָּדָם עַד שֶׁנֶּאֱמַר לוֹ מִפִּי הַמָּקוֹם; אָמַר רַבִּי נָתָן מָה רָאוּ הַנְּשִׂיאִים לְהִתְנַדֵּב כָּאן בַּתְּחִלָּה, וּבִמְלֶאכֶת הַמִּשְׁכָּן לֹא הִתְנַדְּבוּ תְּחִלָּה? אֶלָּא כָּךְ אָמְרוּ הַנְּשִׂיאִים, יִתְנַדְּבוּ צִבּוּר מַה שֶּׁיִּתְנַדְּבוּ, וּמַה שֶּׁמְּחַסְּרִין, אָנוּ מַשְׁלִימִין, כֵּיוָן שֶׁרָאוּ שֶׁהִשְׁלִימוּ צִבּוּר אֶת הַכֹּל, שֶׁנֶּאֱמַר \"וְהַמְּלָאכָה הָיְתָה דַיָּם\" (שמות ל\"ו), אָמְרוּ מֵעַתָּה מַה לָּנוּ לַעֲשׂוֹת? הֵבִיאוּ אַבְנֵי הַשֹּׁהַם וְהַמִּלּוּאִים לָאֵפוֹד וְלַחֹשֶׁן, לְכָךְ הִתְנַדְּבוּ כָּאן תְּחִלָּה (ספרי):", "rashi_en": "שש עגלת צב SIX COVERED WAGGONS — The word צב means “covered over”. Similar is, (Isaiah 66:20) “(And they shall bring all your brethren …] in covered wagons (בצבים) and upon mules”, where covered wagons are called צבים without the addition of a word denoting “wagons” (Sifrei Bamidbar 46 1).<br><br>ויקרבו אותם לפני המשכן AND THEY BROUGHT THEM BEFORE THE TABERNACLE — because Moses would not accept them (the gifts) at their (the princes’) hands until he was so bidden by the mouth of the Omnipresent (cf. v. 5). — Rabbi Nathan said: What reason had the princes to give their contributions here first of all the people, whereas at the work of the Tabernacle they were not the first but the last to contribute? But — he replied — the princes spoke thus: “Let the community in general contribute all they wish to give and then what will then be lacking we shall supply”. As soon as they saw that the community gave everything needed in its entirety (lit., that the community completed everything) — as it said, (Exodus 36:7) “For the stuff they had was enough [for all the work to make it]” — the princes asked, ‘What can we now do’? Therefore they brought the onyx stones, and stones for setting for the Ephod and for the breast plate. That is why they were here the first to contribute” (Sifrei Bamidbar 45 1). "}, {"ch": 7, "v": 4, "aliyah": 5, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר:", "onk_en": "Adonoy said to Moshe, saying:", "pj": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 5, "aliyah": 5, "heb": "קַ֚ח מֵֽאִתָּ֔ם וְהָי֕וּ לַעֲבֹ֕ד אֶת־עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְנָתַתָּ֤ה אוֹתָם֙ אֶל־הַלְוִיִּ֔ם אִ֖ישׁ כְּפִ֥י עֲבֹדָתֽוֹ׃", "onk": "קַבֵּל מִנְּהוֹן וִיהוֹן לְמִפְלַח יָת פָּלְחַן מַשְׁכַּן זִמְנָא וְתִתֵּן יָתְהוֹן לְלֵוָאֵי גְּבַר <b>כְּמִסַּת<\/b> פָּלְחָנֵיהּ:", "onk_en": "Take [the offering] from them, and let them be used for the service of the Tent of Meeting. Give them to the Levites, each man according to [<b>the needs<\/b>] his work.", "pj": "קַבֵּל מִנְהוֹן וִיהוֹן צִיבִי לִצְרוֹךְ סִדוּרָא וְתוֹרִין וְעִיגְלִין יְהוֹן לְמִפְלַח יַת פּוּלְחַן מַשְׁכַּן זִמְנָא וְתִתֵּן יַתְהוֹן לְלֵיוָאֵי גְבַר כְּמֵיסַת פּוּלְחָנֵיהּ", "pj_en": "Take them, and let them be used for the need of the appointed (work), and let the oxen and the wagons be for the work of the service of the tabernacle of ordinance, and give them to the Levites, to each according to the measure of his work.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 6, "aliyah": 5, "heb": "וַיִּקַּ֣ח מֹשֶׁ֔ה אֶת־הָעֲגָלֹ֖ת וְאֶת־הַבָּקָ֑ר וַיִּתֵּ֥ן אוֹתָ֖ם אֶל־הַלְוִיִּֽם׃", "onk": "וּנְסֵיב משֶׁה יָת עֶגְלָתָא וְיָת תּוֹרֵי וִיהַב יָתְהוֹן לְלֵוָאֵי:", "onk_en": "Moshe took the wagons and the oxen and gave them to the Levites.", "pj": "וּנְסֵב משֶׁה יַת עֶגְלָתָא וְיַת תּוֹרֵי וִיהַב לְלֵיוָאֵי", "pj_en": "And Mosheh took the wagons and the oxen, and gave them to the Levites.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 7, "aliyah": 5, "heb": "אֵ֣ת&thinsp;<b>׀<\/b> שְׁתֵּ֣י הָעֲגָל֗וֹת וְאֵת֙ אַרְבַּ֣עַת הַבָּקָ֔ר נָתַ֖ן לִבְנֵ֣י גֵרְשׁ֑וֹן כְּפִ֖י עֲבֹדָתָֽם׃", "onk": "יָת תַּרְתֵּין עֶגְלָתָא וְיָת אַרְבְּעָא תוֹרֵי יְהַב לִבְנֵי גֵרְשׁוֹן <b>כְּמִסַּת<\/b> פָּלְחַנְהוֹן:", "onk_en": "Two [of the] wagons and four [of the] oxen he gave to the sons of Gershon, according to [<b>the needs<\/b>] their work.", "pj": "יַת תַּרְתֵּין עֶגְלָתָא וְיַת אַרְבַּעַת תּוֹרֵי יְהַב לִבְנֵי גֵרְשׁוֹן כְּמֵיסַת פּוּלְחַנְהוֹן", "pj_en": "Two wagons and four oxen he gave to the sons of Gershon, according to the amount of their service,", "tj": "", "tj_en": "", "rashi": "<b>כפי עבדתם.<\/b> שֶׁהָיָה מַשָּׂא בְנֵי גֵרְשׁוֹן קַל מִשֶּׁל מְרָרִי, שֶׁהָיוּ נוֹשְׂאִים הַקְּרָשִׁים וְהָעַמּוּדִים וְהָאֲדָנִים:", "rashi_en": "כפי עבדתם [TWO WAGGONS AND FOUR OXEN HE GAVE UNTO THE SONS OF GERSHON,] ACCORDING TO THEIR SERVICE — only two wagons and four oxen, whilst the sons of Merari were given twice as many, because the burden of the sons of Gershon was lighter than that of the sons of Merari since they carried the boards, the columns and the sockets."}, {"ch": 7, "v": 8, "aliyah": 5, "heb": "וְאֵ֣ת&thinsp;<b>׀<\/b> אַרְבַּ֣ע הָעֲגָלֹ֗ת וְאֵת֙ שְׁמֹנַ֣ת הַבָּקָ֔ר נָתַ֖ן לִבְנֵ֣י מְרָרִ֑י כְּפִי֙ עֲבֹ֣דָתָ֔ם בְּיַד֙ אִֽיתָמָ֔ר בֶּֽן־אַהֲרֹ֖ן הַכֹּהֵֽן׃", "onk": "וְיָת אַרְבַּע עֶגְלַן וְיָת תְּמַנְיָא תוֹרֵי יְהַב לִבְנֵי מְרָרִי כְּמִסַּת פָּלְחַנְהוֹן בִּידָא דְּאִיתָמָר בַּר אַהֲרֹן כַּהֲנָא:", "onk_en": "Four [of the] wagons and eight [of the] oxen he gave to the sons of Merori. According to their work they were in the charge of Isamar the son of Aharon the <i>kohein.<\/i>", "pj": "וְיַת אַרְבַּע עֶגְלָן וְיַת תַּמְנָן תּוֹרֵי יְהַב לִבְנֵי מְרָרִי כְּמֵיסַת פּוּלְחַנְהוֹן בִּידָא דְאִיתָמָר בַּר אַהֲרן כַּהֲנָא", "pj_en": "and four wagons and eight oxen gave be to the sons of Merari, according to the measure of their service, by the hand of Ithamar bar Aharon the priest.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 7, "v": 9, "aliyah": 5, "heb": "וְלִבְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי־עֲבֹדַ֤ת הַקֹּ֙דֶשׁ֙ עֲלֵהֶ֔ם בַּכָּתֵ֖ף יִשָּֽׂאוּ׃", "onk": "וְלִבְנֵי קְהָת לָא יְהָב אֲרֵי פָלְחַן קוּדְשָׁא עֲלֵיהוֹן בְּכַתְפָּא נָטְלִין:", "onk_en": "He did not give any to the sons of Kehos because the sacred work was [incumbent] upon them, which they had to carry on their shoulders.", "pj": "וְלִבְנֵי קְהָת לָא יְהַב עֶגְלָן וְתוֹרִין אֲרוּם פּוּלְחַן קוּדְשָׁא רַמְיָא עֲלֵיהוֹן בְּכַתְפָא נַטְלִין", "pj_en": "But to the sons of Kehath he gave neither wagons nor oxen, because on them was laid the service of the sanctuary, to be carried on their shoulders.", "tj": "", "tj_en": "", "rashi": "<b>כי עבדת הקדש עלהם.<\/b> מַשָּׂא דְּבַר הַקְּדֻשָּׁה — הָאָרוֹן וְהַשֻּׁלְחָן וְגוֹ', לְפִיכָךְ בַּכָּתֵף יִשָּׂאוּ:", "rashi_en": "כי עבדת הקדש עלהם [BUT TO THE SONS OF KOHATH HE GAVE NONE (NO WAGGONS)] BECAUSE THE עבדת הקדש BELONGS UNTO THEM — (not the service of the Sanctuary devolved upon them, but the service in connection with) carrying the most holy objects: the ark, the table, etc. was incumbent upon them, therefore בכתף ישאו they should carry upon their shoulders (not in wagons)."}, {"ch": 7, "v": 10, "aliyah": 5, "heb": "וַיַּקְרִ֣יבוּ הַנְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַמִּזְבֵּ֔חַ בְּי֖וֹם הִמָּשַׁ֣ח אֹת֑וֹ וַיַּקְרִ֧יבוּ הַנְּשִׂיאִ֛ם אֶת־קׇרְבָּנָ֖ם לִפְנֵ֥י הַמִּזְבֵּֽחַ׃", "onk": "וְקָרִיבוּ רַבְרְבַיָּא יָת חֲנֻכַּת מַדְבְּחָא בְּיוֹמָא דְרַבִּיּוּ יָתֵיהּ וְקָרִיבוּ רַבְרְבַיָּא יָת קֻרְבַּנְהוֹן לְקֳדָם מַדְבְּחָא:", "onk_en": "The leaders brought forward the [offerings for] the consecration of the altar on the day it was anointed. The leaders placed their offering before the altar.", "pj": "וּקְרִיבוּ רַבְרְבַיָא יַת חֲנוּכַּת רְבוּתָא דְמַדְבְּחָא בְּיוֹמָא דְרַבֵּי יָתֵיהּ וּקְרִיבוּ רַבְרְבַיָא יַת קָרְבַּנְהוֹן לִקְדָם מַדְבְּחָא", "pj_en": "And the princes offered at the dedication of the altar by anointing, on the day that he anointed it did the princes present their oblations before the altar.", "tj": "", "tj_en": "", "rashi": "<b>ויקריבו הנשאים את חנכת המזבח.<\/b> לְאַחַר שֶׁהִתְנַדְּבוּ הָעֲגָלוֹת וְהַבָּקָר לָשֵׂאת הַמִּשְׁכָּן, נְשָׂאָם לִבָּם לְהִתְנַדֵּב קָרְבְּנוֹת הַמִּזְבֵּחַ לְחַנְּכוֹ:<br><br><b>ויקריבו הנשיאם את קרבנם לפני המזבח.<\/b> כִּי לֹא קִבֵּל מֹשֶׁה מִיָּדָם עַד שֶׁנֶּאֱמַר לוֹ מִפִּי הַגְּבוּרָה (ספרי):", "rashi_en": "ויקריבו הנשאים את חנכת המזבח AND THE PRINCES OFFERED FOR DEDICATING THE ALTAR — After they had presented the waggons and the oxen for carrying the Tabernacle, their heart prompted them to present offerings for the altar, in order to dedicate it (Here, ויקריבו denotes: they offered sacrifice).<br><br>ויקריבו הנשיאם את קרבנם לפני המזבח AND THE PRINCES BROUGHT THEIR OFFERING BEFORE THE ALTAR, because Moses would not accept them at their hands until he was so bidden by the mouth of the Almighty (Sifrei Bamidbar 47)."}, {"ch": 7, "v": 11, "aliyah": 5, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַיּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַיּ֔וֹם יַקְרִ֙יבוּ֙ אֶת־קׇרְבָּנָ֔ם לַחֲנֻכַּ֖ת הַמִּזְבֵּֽחַ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמַר יְיָ לְמשֶׁה רַבָּא חַד לְיוֹמָא רַבָּא חַד לְיוֹמָא יְקָרְבוּן יָת קֻרְבַּנְהוֹן לַחֲנֻכַּת מַדְבְּחָא:", "onk_en": "Adonoy said to Moshe: One leader each day, one leader each day, they shall bring forth their offering, for the dedication of the altar.", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֲמַרְכּוֹל חָד לְיוֹמָא אֲמַרְכּוֹל חָד לְיוֹמָא יִקְרְבוּן יַת קוּרְבַּנְהוֹן לַחֲנוּכַּת רְבוּתָא דְמַדְבְּחָא", "pj_en": "And the Lord said unto Mosheh, Let the princes offer each, one prince on one day, their oblations at the dedication of the altar by anointing.", "tj": "", "tj_en": "", "rashi": "<b>יקריבו את קרבנם לחנכת המזבח.<\/b> וַעֲדַיִן לֹא הָיָה יוֹדֵעַ מֹשֶׁה הֵיאַךְ יַקְרִיבוּ, אִם כְּסֵדֶר תּוֹלְדוֹתָם, אִם כְּסֵדֶר הַמַּסָּעוֹת, עַד שֶׁנֶּאֱמַר לוֹ מִפִּי הַקָּבָּ\"ה יַקְרִיבוּ לַמַּסָּעוֹת, אִישׁ יוֹמוֹ (שם):", "rashi_en": "יקריבו את קרבנם לחנכת המזבח THEY SHALL OFFER THEIR OFFERING, [EACH PRINCE ON HIS DAY] FOR THE DEDICATING OF THE ALTAR — but Moses did not yet know how they were to bring their offerings — whether according to the order of their birth (i.e. according to the order in which the sons of Jacob after whom the tribes were named were born, in which case the prince of the tribe of Reuben would have offered first), or according to the order in which they moved off on the journeys, (when Judah would be the first), until he was told by the mouth of the Holy One, blessed be He: “according to the order on the journeys shall they offer” — yet each prince on his day (and not three together as they actually journeyed) (cf. Sifrei Bamidbar 47)."}, {"ch": 7, "v": 12, "aliyah": 5, "heb": "וַיְהִ֗י הַמַּקְרִ֛יב בַּיּ֥וֹם הָרִאשׁ֖וֹן אֶת־קׇרְבָּנ֑וֹ נַחְשׁ֥וֹן בֶּן־עַמִּינָדָ֖ב לְמַטֵּ֥ה יְהוּדָֽה׃", "onk": "וַהֲוָה דִּמְקָרַב בְּיוֹמָא קַדְמָאָה יָת קֻרְבָּנֵיהּ נַחְשׁוֹן בַּר עַמִּינָדָב לְשִׁבְטָא דִיהוּדָה:", "onk_en": "The one that brought his offering on the first day [was] Nachshon the son of Aminadav, of the tribe of Yehudah.", "pj": "וַהֲוָה דִמְקָרֵב בְּיוֹמָא קַמָאָה יַת קוּרְבָּנֵיהּ נַחְשׁוֹן בַּר עַמִינָדָב רַב בֵּית אַבָּא לְשִׁבְטָא דִיהוּדָה", "pj_en": "He who on the first day presented his oblation was Nachshon bar Amminadab, prince of the house of the fathers of the tribe Jehudah:", "tj": "", "tj_en": "", "rashi": "<b>ביום הראשון.<\/b> אוֹתוֹ הַיּוֹם נָטַל עֶשֶׂר עֲטָרוֹת, רִאשׁוֹן לְמַעֲשֵׂה בְרֵאשִׁית, רִאשׁוֹן לַנְּשִׂיאִים וְכוּ', כִּדְאִיתָא בְסֵדֶר עוֹלָם:<br><br><b>למטה יהודה.<\/b> יִחֲסוֹ הַכָּתוּב עַל שִׁבְטוֹ, וְלֹא שֶׁגָּבָה מִשִּׁבְטוֹ וְהִקְרִיב, אוֹ אֵינוֹ אוֹמֵר \"לְמַטֵּה יְהוּדָה\" אֶלָּא שֶׁגָּבָה מִשִּׁבְטוֹ וְהֵבִיא, תַּ\"ל \"זֶה קָרְבַּן נַחְשׁוֹן\" — מִשֶּׁלּוֹ הֵבִיא (שם):", "rashi_en": "ביום הראשון ON THE FIRST DAY — That day received ten crowns (was distinguished in ten different ways): it was the same day as was the first day of Creation, the first day on which the princes offered etc., as it is set forth in Seder Olam 7 (cf. Rashi on Leviticus 9:1 and Note 2 thereon).<br><br>למטה יהודה [NACHSHON THE SON OF AMINADAB,] OF THE TRIBE OF JUDAH — By these words Scripture merely states his genealogy after his tribe, and they do not mean that he collected the offerings from his tribe and offered them on their behalf. Or perhaps it does state למטה יהודה only to intimate that he collected the offerings from his tribe and then brought them? Scripture, however, states, (v. 17): this was the offering of Nachshon — he brought it of that which was his own (Sifrei Bamidbar 48)."}, {"ch": 7, "v": 13, "aliyah": 5, "heb": "וְקׇרְבָּנ֞וֹ קַֽעֲרַת־כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּמֵאָה֮ מִשְׁקָלָהּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ שְׁנֵיהֶ֣ם&thinsp;<b>׀<\/b> מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַשֶּׁ֖מֶן לְמִנְחָֽה׃", "onk": "וְקֻרְבָּנֵיהּ מְגִסְתָּא דִכְסַף חֲדָא מְאָה וּתְלָתִין סִלְעִין הֲוָה מַתְקְלַהּ מִזְרְקָא חַד דִּכְסַף מַתְקְלֵיהּ שַׁבְעִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא תַּרְוֵיהוֹן מְלַן סֻלְתָּא דְּפִילָא בִמְשַׁח לְמִנְחָתָא:", "onk_en": "His offering was one silver tray, its weight was one hundred thirty <i>shekolim;<\/i> one silver bowl [that weighed] seventy <i>shekolim<\/i> according to sanctuary weights. Both were filled with fine flour kneaded with [olive] oil, for a meal-offering.", "pj": "וְקוּרְבָּנֵיהּ דְמִקְרַב פְּיוֹלֵי דִכְסַף חֲדָא גִילְדָא סְמִיךְ מְאָה וּתְלָתִין סִלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁא הֲוַת מַתְקְלָא מַזִירְקָא חָד דִכְסַף דְגִילְדָא קַלִישָׁא שׁוּבְעִין סִלְעִין בְּסִלְעֵי בֵּית קוּדְשָׁא תְּרֵין מָאנַיָא הָאִילֵין קְרֵיב יַתְהוֹן מַלְיָ
