the Scroll of Esther terms a palace טרכונין. I learn from this that חבל ארגב signifies “the province of the Royal Palace”, denoting that the province is called after its name (after the name of the palace). Similarly, also the term ארגוב found in the Book of Kings (2 15:25) where the meaning is that Pekah the son of Remaliah slew Pekahia the son of Menahem near the king’s palace (את ארגוב), I learn that thus (after the palace) was the province named."}, {"ch": 3, "v": 5, "aliyah": 6, "heb": "כׇּל־אֵ֜לֶּה עָרִ֧ים בְּצֻרֹ֛ת חוֹמָ֥ה גְבֹהָ֖ה דְּלָתַ֣יִם וּבְרִ֑יחַ לְבַ֛ד מֵעָרֵ֥י הַפְּרָזִ֖י הַרְבֵּ֥ה מְאֹֽד׃", "onk": "כָּל אִלֵּין קִרְוִין כְּרִיכָן מַקְּפָן שׁוּר רָם דִּילְהֶן דָּשִׁין וְעַבְּרִין בַּר מִקִּרְוֵי פַּצְחַיָּא סַגִּי לַחֲדָא:", "onk_en": "All of these were fortified cities with high walls, gates and bolts; besides very many unwalled cities.", "pj": "כָּל אִלֵין קִירְוִין חַקְרָא מַקְפִין שׁוּרִין רָמִין אֲחִידָן בְּתַרְעִין וּנְגָרִין בַּר מִקִּרְוֵי פַּצְחַיָיא סַגִי לַחֲדָא", "pj_en": "All these cities were fortified, surrounded with high walls, shut up with gates and bars; besides open towns very many.", "tj": "כָּל אִילֵין קִירְיַין תְּלִילַן מַקְפָן שׁוּרִין רָמִין תַּרְעִין וְנַגְרִין:", "tj_en": "All these cities were fortified, surrounded with high walls, with gates and bars.", "rashi": "<b>מערי הפרזי.<\/b> פְּרוּזוֹת וּפְתוּחוֹת בְּלֹא חוֹמָה, וְכֵן (זכריה ב') \"פְּרָזוֹת תֵּשֵׁב יְרוּשָׁלַיִם\":", "rashi_en": "מערי הפרזי [BESIDES] UNWALLED CITIES — unconfined and open, i.e. without a wall. Similar is, (Zechariah 2:8) “As open spaces (פרזות) shall Jerusalem be inhabited”."}, {"ch": 3, "v": 6, "aliyah": 6, "heb": "וַנַּחֲרֵ֣ם אוֹתָ֔ם כַּאֲשֶׁ֣ר עָשִׂ֔ינוּ לְסִיחֹ֖ן מֶ֣לֶךְ חֶשְׁבּ֑וֹן הַחֲרֵם֙ כׇּל־עִ֣יר מְתִ֔ם הַנָּשִׁ֖ים וְהַטָּֽף׃", "onk": "וְגַמַּרְנָא יָתְהוֹן כְּמָא דִי עֲבַדְנָא לְסִיחֹן מַלְכָּא דְחֶשְׁבּוֹן גַּמַּר כָּל קִרְוֵי גֻבְרַיָּא נְשַׁיָּא וְטַפְלָא:", "onk_en": "We annihilated them as we had done to Sichon, King of Cheshbon, annihilating every city’s men, women, and children.", "pj": "וּגְמַרְנָא יַת קִירְוֵיהוֹן הֵיכְמָא דַעֲבַדְנָא לְסִיחוֹן מַלְכָּא דְחֶשְׁבּוֹן הֵיכְדֵין גָּמַרְנָא יַת כָּל קִרְוֵוי גוּבְרַיָא נְשַׁיָא וְטַפְלָא", "pj_en": "And we utterly destroyed their cities: as we did to Sihon king of Heshbon, so destroyed we with every city the men, women, and children.", "tj": "", "tj_en": "", "rashi": "<b>החרם.<\/b> לְשׁוֹן הֹוֶה – הָלוֹךְ וְכַלּוֹת:", "rashi_en": "החרם — This has a present frequentative meaning: going on and destroying (see Rashi on Numbers 25:17)."}, {"ch": 3, "v": 7, "aliyah": 6, "heb": "וְכׇל־הַבְּהֵמָ֛ה וּשְׁלַ֥ל הֶעָרִ֖ים בַּזּ֥וֹנוּ לָֽנוּ׃", "onk": "וְכָל בְּעִירָא וַעֲדִי קִרְוַיָּא בַּזָּנָא לָנָא:", "onk_en": "And all the animals and the booty of the cities we plundered for ourselves.", "pj": "וְכָל בְּעִירֵי וְעֶדְיֵי קִרְוַיָא בָּזָנָא לָנָא", "pj_en": "But all the cattle, and the prey of the cities, we made a spoil for ourselves.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 8, "aliyah": 6, "heb": "וַנִּקַּ֞ח בָּעֵ֤ת הַהִוא֙ אֶת־הָאָ֔רֶץ מִיַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָאֱמֹרִ֔י אֲשֶׁ֖ר בְּעֵ֣בֶר הַיַּרְדֵּ֑ן מִנַּ֥חַל אַרְנֹ֖ן עַד־הַ֥ר חֶרְמֽוֹן׃", "onk": "וּנְסִבְנָא בְּעִדָּנָא הַהִיא יָת אַרְעָא מִיָּדָא תְּרֵין מַלְכֵי אֱמֹרָאָה דִּי בְּעִבְרָא דְיַרְדְּנָא מִנַּחֲלָא דְאַרְנֹן עַד טוּרָא דְחֶרְמוֹן:", "onk_en": "At that time we took the land from the possession of the two Emorite kings who were on the other side of the Yardein, from Wadi Arnon to Mount Chermon.", "pj": "וּנְסֵיבְנָא בְּעִידָנָא הַהִיא יַת אַרְעָא מִן רְשׁוּת תְּרֵין מַלְכֵי אֱמוֹרָאֵי דִבְעִיבְרָא דְיוֹרְדְּנָא מִנַּחֲלֵי אַרְנוֹנָא עַד טַוְורָא דְחֶרְמוֹן", "pj_en": "And at that time we took from the power of the two kings of the Amorites the land beyond the Jordan, from the streams of Arnona unto Mount Hermon.", "tj": "", "tj_en": "", "rashi": "<b>מיד.<\/b> מֵרְשׁוּת:", "rashi_en": "מיד means, FROM THE CONTROL OF."}, {"ch": 3, "v": 9, "aliyah": 6, "heb": "צִידֹנִ֛ים יִקְרְא֥וּ לְחֶרְמ֖וֹן שִׂרְיֹ֑ן וְהָ֣אֱמֹרִ֔י יִקְרְאוּ־ל֖וֹ שְׂנִֽיר׃", "onk": "צִידֹנָאֵי קְרָאן לְחֶרְמוֹן סִרְיֹן וֶאֱמֹרָאֵי קְרָאן לֵיהּ <b>טוּר תַּלְגָּא<\/b>:", "onk_en": "The Tzidonites call Chermon Siryon, and the Emorites call it Sneer [<b>Mount Snow<\/b>].", "pj": "צִידוֹנָאֵי הֲוַון קְרַן לְחֶרְמוֹן טַוְורָא דְמַסְרֵי פֵּירוֹי וֶאֱמוֹרָאֵי קְרַן לֵיהּ טַוָור תַּלְגָא דְלָא פָּסִיק מִנֵיהּ תַּלְגָא לָא בְּקַיְיטָא וְלָא בְּסִתְוָוא", "pj_en": "The Sidonaee call Hermon the fruit-producing Mount, but the Amoraee call it the Snowy Mountain, because the snow never ceases from it either in summer or winter.", "tj": "צִידוֹנָאֵי קְרַן לְחֶרְמוֹן אַרְעָא מַסְרֵי פֵּירוֹהִי וֶאֱמוֹרָאֵי קְרַן אַרְעָא מַרְבֵּי פֵּירֵי אִילָנָא:", "tj_en": "The Sidonaee call Hermon the fruit-producing land, but the Amoraee call it the land which multiplies the fruits of the tree.", "rashi": "<b>צידנים יקראו לחרמון וגו'.<\/b> וּבְמָקוֹם אַחֵר הוּא אוֹמֵר (דברים ד') \"וְעַד הַר שִׂיאֹן הוּא חֶרְמוֹן\", הֲרֵי לוֹ אַרְבָּעָה שֵׁמוֹת, לָמָּה הֻצְרְכוּ לִכָּתֵב? לְהַגִּיד שֶׁבַח אֶרֶץ יִשְׂרָאֵל – שֶׁהָיוּ אַרְבַּע מַלְכֻיּוֹת מִתְפָּאֲרוֹת בְּכָךְ, זוֹ אוֹמֶרֶת עַל שְׁמִי יִקָּרֵא, וְזוֹ אוֹמֶרֶת עַל שְׁמִי יִקָּרֵא:<br><br><b>שניר.<\/b> הוּא שֶׁלֶג בִּלְשׁוֹן אַשְׁכְּנַז וּבִלְשׁוֹן כְּנַעַן:", "rashi_en": "צידנים יקראו לחרמון וגו׳ THE SIDONIANS CALL HERMON SIRION — But in another passage it states, (Deuteronomy 4:48) “Even unto Mount Sion which is Hermon”. So you see it had four names. And why had they all to be written in Scripture? To tell the praise of the land of Israel: that there were four kingdoms (kings) priding themselves in this — one saying, \"After me shall it be named\", and another saying, \"After me shall it be named\" (Sifrei Devarim 37:10; cf. Chullin 60b). <br><br>שניר SHENIR — This signifies \"snow\" in the German language (Schnee) and in the Canaanite (Slav) language (Snih)."}, {"ch": 3, "v": 10, "aliyah": 6, "heb": "כֹּ֣ל&thinsp;<b>׀<\/b> עָרֵ֣י הַמִּישֹׁ֗ר וְכׇל־הַגִּלְעָד֙ וְכׇל־הַבָּשָׁ֔ן עַד־סַלְכָ֖ה וְאֶדְרֶ֑עִי עָרֵ֛י מַמְלֶ֥כֶת ע֖וֹג בַּבָּשָֽׁן׃", "onk": "כֹּל קִרְוֵי מֵישְׁרָא וְכָל גִּלְעָד וְכָל <b>דְּמַתְנָן<\/b> עַד סַלְכָה וְאֶדְרֶעִי קִרְוֵי מַלְכְּוָתָא דְעוֹג בְּמַתְנָן:", "onk_en": "All the cities of the plain and entire Gilod and the entire Boshon [<b>Masnan<\/b>] to Salcho and Edre’i; cities of Og’s kingdom in the Boshon.", "pj": "כָּל קִירְוֵי מֵישְׁרָא וְכָל גִּלְעָד וְכָל מַתְנָן עַד סַלְוָוקִיא וְאֶדְרֶעָת קִרְוֵי מַמְלְכוּתָא דְעוֹג בְּמַתְנָן", "pj_en": "All the cities of the plain, and all Gilead, and all Mathnan, unto Selukia and Edrehi, cities of the kingdom of Og in Mathnan.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 11, "aliyah": 6, "heb": "כִּ֣י רַק־ע֞וֹג מֶ֣לֶךְ הַבָּשָׁ֗ן נִשְׁאַר֮ מִיֶּ֣תֶר הָרְפָאִים֒ הִנֵּ֤ה עַרְשׂוֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲלֹ֣ה הִ֔וא בְּרַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אׇרְכָּ֗הּ וְאַרְבַּ֥ע אַמּ֛וֹת רׇחְבָּ֖הּ בְּאַמַּת־אִֽישׁ׃", "onk": "אֲרֵי לְחוֹד עוֹג מַלְכָּא דְמַתְנָן אִשְׁתָּאַר מִשְּׁאָר גִּבָּרַיָּא הָא עַרְסֵיהּ עַרְסָא דְפַרְזְלָא הֲלָא הִיא בְּרַבַּת בְּנֵי עַמּוֹן תְּשַׁע אַמִּין אָרְכַּהּ וְאַרְבַּע אַמִּין פְּתָיַהּ בְּאַמַת <b>מְלַךְ<\/b>:", "onk_en": "For only Og, King of the Boshon, survived from the remainder of the giants. Look, his bed—an iron bed—isn’t it in Rabbas of the descendants of Ammon: nine <i>amohs<\/i> its length and four <i>amohs<\/i> its width, in a man’s [<b>king’s<\/b>] <i>amoh.<\/i>", "pj": "אֲרוּם לְחוֹד עוֹג מַלְכָּא דְמַתְנָן אִשְׁתְּיַיר מִמוֹתַר גִּיבָּרַיָא דְאִשְׁתֵּצְיוּ בְּטוּבְעָנָא הָא שִׁיוְויֵהּ שַׁוְיָא דְפַרְזְלָא הָא הִיא יְהִיבָא בְּבֵית אַרְכֵיוַון בְּרַבַּת בְּנֵי עַמּוֹן תְּשַׁע אַמִּין אוּרְכָּהּ וְאַרְבַּע אַמִּין פּוּתְיָהּ בְּאַמְתָא דְגַרְמֵיהּ", "pj_en": "For only Og king of Mathnan remained of the remnant of the giants who perished in the deluge. Behold, his bedstead was a bedstead of iron; behold, it is placed in the archive-house in Rabbath, of the Beni Ammon, nine-cubits its length, and four cubits its breadth, in the cubit of his own (stature).", "tj": "הֲלָא הִיא יְהִיבָא בְּאַפְרַכְיוֹן דִּבְנֵי עַמָא:", "tj_en": "Is it not placed in the citadel of the Beni Ammon?", "rashi": "<b>מיתר הרפאים.<\/b> שֶׁהָרְגוּ אַמְרָפֶל וַחֲבֵרָיו בְּעַשְׁתְּרוֹת קַרְנַיִם, וְהוּא פָּלַט מִן הַמִּלְחָמָה שֶׁנֶּאֱמַר (בראשית י\"ד) \"וַיָּבֹא הַפָּלִיט\" – זֶהוּ עוֹג:<br><br><b>באמת איש.<\/b> בְּאַמַּת עוֹג:", "rashi_en": "מיתר הרפאים [ONLY OG … REMAINED] OF THE REST OF THE REPHAIM whom Amraphel and his allies slew in Ashteroth-Karnaim (Genesis 14:5), and he (Og) escaped from the battle, as it is said, (Genesis 14:13) \"And the fugitive came\", and that was Og (Genesis Rabbah 42:8; cf. Rashi on Genesis 14.13.1).<br><br>באמת איש AFTER THE CUBIT OF A MAN — i.e. after the cubit of Og."}, {"ch": 3, "v": 12, "aliyah": 6, "heb": "וְאֶת־הָאָ֧רֶץ הַזֹּ֛את יָרַ֖שְׁנוּ בָּעֵ֣ת הַהִ֑וא מֵעֲרֹעֵ֞ר אֲשֶׁר־עַל־נַ֣חַל אַרְנֹ֗ן וַחֲצִ֤י הַֽר־הַגִּלְעָד֙ וְעָרָ֔יו נָתַ֕תִּי לָרֽאוּבֵנִ֖י וְלַגָּדִֽי׃", "onk": "וְיָת אַרְעָא הָדָא יְרִיתְנָא בְּעִדָּנָא הַהִיא מֵעֲרֹעֵר דִּי עַל נַחֲלָא דְאַרְנֹן וּפַלְגּוּת טוּרָא דְגִלְעָד וְקִרְווֹהִי יְהָבִית לְשִׁבְטָא דִרְאוּבֵן וּלְשִׁבְטָא דְגָד:", "onk_en": "And this land we inherited at that time. From Aro’er which is on Wadi Arnon and half of the Gilod hills and its cities—I gave to the Reuvenites and the Gaddites.", "pj": "וְיַת אַרְעָא הֲדָא יְרִיתְנָא בְּעִידָנָא הַהִיא מֵעֲרוֹעֵר וְעַד כֵּיף נַחֲלָא וּפַלְגוּת טַוְורָא דְגִלְעָד וְקִירְוֵיהּ יְהָבִין לְשֵׁבֶט רְאוּבֵן וּלְשֵׁבֶט גָּד", "pj_en": "And this land which we took in possession at that time, from Aroer unto the border of the river, and half of Mount Gilead, and the cities, I have given to the tribe of Reuben and Gad;", "tj": "", "tj_en": "", "rashi": "<b>ואת הארץ הזאת.<\/b> הָאֲמוּרָה לְמַעְלָה, מִנַּחַל אַרְנוֹן וְעַד הַר חֶרְמוֹן, <b>ירשנו בעת ההיא<\/b>:<br><br><b>מערער אשר על נחל ארנן.<\/b> אֵינוֹ מְחֻבָּר לְרֹאשׁוֹ שֶׁל מִקְרָא אֶלָּא לְסוֹפוֹ – עַל נָתַתִּי לָראוּבֵנִי וְלַגָּדִי, אֲבָל לְעִנְיַן יְרֻשָּׁה עַד הַר חֶרְמוֹן הָיָה:", "rashi_en": "ואת הארץ הזאת AND THIS LAND mentioned above (v. 8), \"from the brook of Arnon to Mount Hermon\", ירשנו בעת ההוא WE POSSESSED AT THAT TIME.<br><br>מערער אשר על נחל ארנן FROM AROER, WHICH IS BY THE BROOK ARNON — this must not be connected with the first part of this verse (defining הארץ הזאת) but with its conclusion — with נתתי לראבני ולגדי I GAVE TO THE REUBENITES AND TO THE GADITES; however, as respects possession (taking by conquest) that was \"[from the brook of Arnon] to Mount Hermon\" (v. 8)."}, {"ch": 3, "v": 13, "aliyah": 6, "heb": "וְיֶ֨תֶר הַגִּלְעָ֤ד וְכׇל־הַבָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַחֲצִ֖י שֵׁ֣בֶט הַֽמְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽאַרְגֹּב֙ לְכׇל־הַבָּשָׁ֔ן הַה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים׃", "onk": "וּשְׁאָר גִּלְעָד וְכָל <b>דְּמַתְנָן<\/b> מַלְכְּוָתָא דְעוֹג יְהָבִית לְפַלְגוּת שִׁבְטָא דִמְנַשֶּׁה <b>כֹּל בֵּית פָּלַךְ טְרָכוֹנָא<\/b> לְכָל <b>מַתְנָן<\/b> הַהוּא מִתְקְרֵי אַרְעָא גִבָּרַיָּא:", "onk_en": "And the rest of the Gilod and all of the Boshon [<b>Masnan<\/b>], the kingdom of Og, I gave to half the tribe of Menashe. The entire Argov [<b>Tarchona<\/b>] province throughout the Boshon [<b>Masnan<\/b>], that is called the land of the giants.", "pj": "וּשְׁאָר גִּלְעָד וְכָל מַתְנָן מַלְכוּתֵיהּ דְּעוֹג יְהָבִית לַחֲצִי שֵׁבֶט מְנַשֶּׁה כָּל תְּחוּם בֵּית פְּלַךְ טַרְגוֹנָא וְכָל מַתְנָן הַהוּא מִתְקְרֵי אֲרַע גִּבָּרַיָא", "pj_en": "but the remaining part of Gilead, and all Mathnan, the kingdom of Og, I have given to the half tribe of Menasheh; all the limit of the region of Targona, and all Mathnan, which is called the land of the giants.", "tj": "", "tj_en": "", "rashi": "<b>ההוא יקרא ארץ רפאים.<\/b> הִיא אוֹתָהּ שֶׁנָּתַתִּי לְאַבְרָהָם:", "rashi_en": "ההוא יקרא ארץ רפאים IT IS THAT WHICH IS CALLED THE LAND OF REPHAIM — it is that which I gave to Abraham (cf. Rashi on 2:20)."}, {"ch": 3, "v": 14, "aliyah": 6, "heb": "יָאִ֣יר בֶּן־מְנַשֶּׁ֗ה לָקַח֙ אֶת־כׇּל־חֶ֣בֶל אַרְגֹּ֔ב עַד־גְּב֥וּל הַגְּשׁוּרִ֖י וְהַמַּֽעֲכָתִ֑י וַיִּקְרָא֩ אֹתָ֨ם עַל־שְׁמ֤וֹ אֶת־הַבָּשָׁן֙ חַוֺּ֣ת יָאִ֔יר עַ֖ד הַיּ֥וֹם הַזֶּֽה׃", "onk": "יָאִיר בַּר מְנַשֶּׁה נְסִיב יָת כָּל <b>בֵּית פָּלַךְ טְרָכוֹנָא<\/b> עַד תְּחוּם גְּשׁוּרָאָה <b>וְאַפְקֵירוֹס<\/b> וּקְרָא יָתְהוֹן עַל שְׁמֵיהּ יָת <b>מַתְנָן<\/b> כַּפְרָנֵי יָאִיר עַד יוֹמָא הָדֵין:", "onk_en": "Yair son of Menashe took all of the Argov [<b>Tarchona<\/b>] province until the border of the Geshurites and the Ma’achasites [<b>Apekorsites<\/b>]; and he named them for himself—the Boshon [<b>Masnan<\/b>]—the cities of Chavos Yair until this day.", "pj": "וְיָאִיר בַּר מְנַשֶּׁה נְסִיב יַת כָּל תְּחוּם פְּלַךְ טַרְגוֹנָא עַד תְּחוּם קִרְוֵי וְאַנְטִיקֵירוֹס וּקְרָא יַתְהוֹן עַל שְׁמֵיהּ יַת מַתְנָן כַּפְרָנֵי יָאִיר עַד יוֹמָא הָדֵין", "pj_en": "And Jair bar Menasheh took the whole limit of the region of Targona, unto the limit of Korze and Antikiros, and called them by his own name Mathnan, the towns of Jair, unto this day.", "tj": "כָּל תְּחוּם אַטַרְכוּנָא עַד תְּחוּם קִרְיַת אֲפִיקֶרֶס וּקְרָא יַתְהוֹן עַל שְׁמֵיהּ:", "tj_en": "All the limit of Atarkona, unto the limit of the city of Aphikeras,", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 15, "aliyah": 7, "heb": "וּלְמָכִ֖יר נָתַ֥תִּי אֶת־הַגִּלְעָֽד׃", "onk": "וּלְמָכִיר יְהָבִית יָת גִּלְעָד:", "onk_en": "And to Mochir I gave the Gilod.", "pj": "וּלְמָכִיר יְהָבִית יַת גִּלְעָד", "pj_en": "But I gave Gilead to Makir.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 16, "aliyah": 7, "heb": "וְלָראוּבֵנִ֨י וְלַגָּדִ֜י נָתַ֤תִּי מִן־הַגִּלְעָד֙ וְעַד־נַ֣חַל אַרְנֹ֔ן תּ֥וֹךְ הַנַּ֖חַל וּגְבֻ֑ל וְעַד֙ יַבֹּ֣ק הַנַּ֔חַל גְּב֖וּל בְּנֵ֥י עַמּֽוֹן׃", "onk": "וּלְשִׁבְטָא דִרְאוּבֵן וּלְשִׁבְטָא דְגָד יְהָבִית מִן גִּלְעָד וְעַד נַחֲלָא דְאַרְנֹן גּוֹ נַחֲלָא וּתְחוּם וְעַד יוּבְקָא דְנַחֲלָא תְּחוּם בְּנֵי עַמּוֹן:", "onk_en": "And to the Reuvenites and to the Gaddites I gave from the Gilod to Wadi Arnon, within the wadi and the border, until Yabok, the wadi at the border of the descendants of Ammon;", "pj": "וּלְשֵׁבֶט רְאוּבֵן וּלְשֵׁבֶט גָּד יְהָבִית מִן גִּלְעָד וְעַד נַחֲלָאאַרְנוֹנָא מְצִיעוּת נַחֲלָא וּתְחוּמֵיהּ וְעַד יוּבְקָא דְנַחֲלֵי תְּחוּמָא דִבְנֵי עַמּוֹן", "pj_en": "To the tribe Reuben and the tribe Gad have I given from Gilead to the river Arnona, half of the valley and its limit, unto the stream of Jubeka on the limit of the children of Ammon,", "tj": "", "tj_en": "", "rashi": "<b>תוך הנחל וגבל.<\/b> כָּל הַנַּחַל וְעוֹד מֵעֵבֶר לִשְׂפָתוֹ, כְּלוֹמַר עַד וְעַד בִּכְלָל וְיוֹתֵר מִכֵּן:", "rashi_en": "תוך הנחל וגבול THE MIDST OF THE BROOK AND THE TERRITORY, i.e., all the brook and in addition, land on its opposite bank. The words therefore are as much as to say, עד \"unto” the Brook of Arnon, ועד \"and” that which is mentioned as being \"unto” (i.e. the Brook itself) is included (by the words תוך הנחל), and even more than this (namely, the גבול, land on the other side of the brook)."}, {"ch": 3, "v": 17, "aliyah": 7, "heb": "וְהָֽעֲרָבָ֖ה וְהַיַּרְדֵּ֣ן וּגְבֻ֑ל מִכִּנֶּ֗רֶת וְעַ֨ד יָ֤ם הָֽעֲרָבָה֙ יָ֣ם הַמֶּ֔לַח תַּ֛חַת אַשְׁדֹּ֥ת הַפִּסְגָּ֖ה מִזְרָֽחָה׃", "onk": "וּמֵישְׁרָא וְיַרְדְּנָא וּתְחוּמֵיהּ <b>מִגֵּנוֹסַר<\/b> וְעַד יַמָּא דְמֵישְׁרָא יַמָּא דְמִלְחָא תְּחוֹת מַשְׁפַּךְ מְרָמָתָא מַדִינְחָא:", "onk_en": "and the Arava and the Yardein and the border; from Kinneres [<b>Ginosar<\/b>] until Arava Lake, the salt lake, beneath the slopes of the crest to the east.", "pj": "וּמֵישְׁרָא וְיוֹרְדְּנָא וּתְחוּם מִגְנִיסַר וְעַד יַמָּא דְמֵשְׁרָא וְקַרְתָּא טְבַרְיָה דִסְמִיכָא לְיַמָא דְמִלְחָא תְּחוֹת שַׁפְכוּת מַיָא מֵרַמָתָא מַדִּינְחָא", "pj_en": "the plain also, the Jordan, the boundary from Genesar to the sea of the plain, and the city of Tebaria, which is by the Sea of Salt, the limit of the outflow of waters from the heights of the east.", "tj": "וּמֵישְׁרָא וְיַרְדְּנָא וּתְחוּמָא מִן גִּנוֹסַר וְעַד יַמָא דְמֵישְׁרָא יַמָא דְמִלְחָא תְּחוֹת בֵּית שְׁפִיכוֹת קִיטְמָא מִן מַדִּינְחָא:", "tj_en": "The plain, the Jordan, and the limit from Ginosar to the sea of the plain, the Sea of Salt, under the place of the pouring forth of ashes from the east.", "rashi": "<b>מכנרת.<\/b> מֵעֵבֶר הַיַּרְדֵּן הַמַּעֲרָבִי, וְנַחֲלַת בְּנֵי גָד מֵעֵבֶר הַיַּרְדֵּן הַמִּזְרָחִי, וְנָפַל בְּגוֹרָלָם רֹחַב הַיַּרְדֵּן כְּנֶגְדָּם, וְעוֹד מֵעֵבֶר שְׂפָתוֹ עַד כִּנֶּרֶת, וְזֶהוּ שֶׁנֶּאֱמַר <b>והירדן וגבל<\/b> – הַיַּרְדֵּן וּמֵעֵבֶר לוֹ:", "rashi_en": "מכנרת FROM CHINNERETH — This is on the western side of Jordan. The inheritance of the children of Gad was in the east side of the Jordan, and there fell as their lot the width of the Jordan, adjoining their territory, and in addition, land on its opposite bank up to Chinnereth. This is the meaning of what is said here, \"And the Jordan and the territory thereof”, i.e. the Jordan and some land on its opposite bank."}, {"ch": 3, "v": 18, "aliyah": 7, "heb": "וָאֲצַ֣ו אֶתְכֶ֔ם בָּעֵ֥ת הַהִ֖וא לֵאמֹ֑ר יְהֹוָ֣ה אֱלֹהֵיכֶ֗ם נָתַ֨ן לָכֶ֜ם אֶת־הָאָ֤רֶץ הַזֹּאת֙ לְרִשְׁתָּ֔הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִפְנֵ֛י אֲחֵיכֶ֥ם בְּנֵֽי־יִשְׂרָאֵ֖ל כׇּל־בְּנֵי־חָֽיִל׃", "onk": "וּפַקֵּדִית יָתְכוֹן בְּעִדָּנָא הַהִיא לְמֵימָר יְיָ אֱלָהֲכוֹן יְהַב לְכוֹן יָת אַרְעָא הָדָא לְמֵירְתַהּ <b>מְזָרְזִין<\/b> תַּעְבְּרוּן קֳדָם אֲחֵיכוֹן בְּנֵי יִשְׂרָאֵל כָּל <b>מְזָרְזֵי<\/b> חֵילָא:", "onk_en": "I commanded you at the time, saying, ‘‘Adonoy, your God, has given you this land to inherit it. Cross over in the forefront [<b>well armed<\/b>], ahead of your brothers the Bnei Yisroel, all valorous [<b>armed<\/b>] soldiers.", "pj": "וּפַקֵּידִית יַתְכוֹן שֵׁבֶט רְאוּבֵן וְשֵׁבֶט גָּד וּפַלְגוּת שֵׁבֶט מְנַשֶּׁה בְּעִידָנָא הַהִיא לְמֵימָר יְיָ אֱלָהָכוֹן יָהִיב לְכוֹן יַת אַרְעָא הָדָא לְמֵירְתָהּ מְזַיְנִין תַּעַבְרוּן קֳדָם אֲחוּכוֹן בְּנֵי יִשְרָאֵל כָּל מְזַרְזֵי חֵילָא", "pj_en": "And I commanded you, the tribe of Reuben, and of Gad, and the half tribe of Menasheh, at that time, saying: The Lord your God hath given this land to you to possess it; but you are to go over armed before your brethren, every one girded for the host.", "tj": "", "tj_en": "", "rashi": "<b>ואצו אתכם.<\/b> לִבְנֵי רְאוּבֵן וּבְנֵי גָד הָיָה מְדַבֵּר:<br><br><b>לפני אחיכם.<\/b> הֵם הָיוּ הוֹלְכִים לִפְנֵי יִשְׂרָאֵל לַמִּלְחָמָה לְפִי שֶׁהָיוּ גִּבּוֹרִים, וְאוֹיְבִים נוֹפְלִים לִפְנֵיהֶם, שֶׁנֶּאֱמַר (דברים ל\"ג) \"וְטָרַף זְרוֹעַ אַף קָדְקֹד\":", "rashi_en": "ואצו אתכם AND I COMMANDED YOU — He now addresses himself to the sons of Reuben and the sons of Gad.<br><br>לפני אחיכם [YE SHALL PASS OVER EQUIPPED] BEFORE YOUR BRETHREN — they used to go in front of the other Israelites into battle because they were mighty men, and the enemy fell before them, as it is said of Gad, (Deuteronomy 33:20) \"He tears the arm together with the crown” (cf. Rashi on Numbers 32:17)."}, {"ch": 3, "v": 19, "aliyah": 7, "heb": "רַ֠ק נְשֵׁיכֶ֣ם וְטַפְּכֶם֮ וּמִקְנֵכֶם֒ יָדַ֕עְתִּי כִּֽי־מִקְנֶ֥ה רַ֖ב לָכֶ֑ם יֵֽשְׁבוּ֙ בְּעָ֣רֵיכֶ֔ם אֲשֶׁ֥ר נָתַ֖תִּי לָכֶֽם׃", "onk": "לְחוֹד נְשֵׁיכוֹן וְטַפְלְכוֹן וּבְעִירְכוֹן יְדַעְנָא אֲרֵי בְעִיר סַגִּי לְכוֹן יֵתְבוּן בְּקִרְוֵיכוֹן דִּי יְהָבִית לְכוֹן:", "onk_en": "But your wives and your children and your cattle—I know you own much cattle—will live in your cities, which I have given you.", "pj": "לְחוֹד נְשֵׁיכוֹן טַפְלְכוֹן וּבְעִירֵיכוֹן יָדַעְנָא אֲרוּם בְּעִיר סַגִי לְכוֹן יֵתְבוּן בְּקִירְוֵיכוֹן דִּי יְהָבִית לְכוֹן", "pj_en": "Only your wives, your children, and your cattle, (for I know that you have much cattle,) shall abide in your cities which I have given you,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 20, "aliyah": 7, "heb": "עַ֠ד אֲשֶׁר־יָנִ֨יחַ יְהֹוָ֥ה&thinsp;<small>׀<\/small>&thinsp;לַֽאֲחֵיכֶם֮ כָּכֶם֒ וְיָרְשׁ֣וּ גַם־הֵ֔ם אֶת־הָאָ֕רֶץ אֲשֶׁ֨ר יְהֹוָ֧ה אֱלֹהֵיכֶ֛ם נֹתֵ֥ן לָהֶ֖ם בְּעֵ֣בֶר הַיַּרְדֵּ֑ן וְשַׁבְתֶּ֗ם אִ֚ישׁ לִֽירֻשָּׁת֔וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָכֶֽם׃", "onk": "עַד דִּי יְנִיחַ יְיָ לַאֲחֵיכוֹן כְּוָתְכוֹן וְיֵרְתוּן אַף אִנּוּן יָת אַרְעָא דַּיְיָ אֱלָהֲכוֹן יָהֵב לְהוֹן בְּעִבְרָא דְיַרְדְּנָא וּתְתוּבוּן גְּבַר לִירֻתְּתֵיהּ דִּי יְהָבִית לְכוֹן:", "onk_en": "Until Adonoy grants your brothers [peace] like you, and they too inherit the land that Adonoy, your God, is giving them across the Yardein. Then will you return each of you to his inheritance that I have given you.", "pj": "עַד זְמַן דִּינִיחַ יְיָ לַאֲחוּכוֹן כְּוַותְכוֹן וְיֵירְתוּן אוּף הִינוּן יַת אַרְעָא דַיְיָ אֱלָהָכוֹן יָהִיב לְכוֹן וּתְתוּבוּן גְּבַר לִירוּתָתֵיהּ דִּיהָבִית לְכוֹן", "pj_en": "until the time when the Lord will have given rest to your brethren as to you, that they also may possess that land which the Lord your God hath conferred upon you; then shall you return every one to his inheritance which I have given you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 21, "aliyah": 7, "heb": "וְאֶת־יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי בָּעֵ֥ת הַהִ֖וא לֵאמֹ֑ר עֵינֶ֣יךָ הָרֹאֹ֗ת אֵת֩ כׇּל־אֲשֶׁ֨ר עָשָׂ֜ה יְהֹוָ֤ה אֱלֹהֵיכֶם֙ לִשְׁנֵי֙ הַמְּלָכִ֣ים הָאֵ֔לֶּה כֵּֽן־יַעֲשֶׂ֤ה יְהֹוָה֙ לְכׇל־הַמַּמְלָכ֔וֹת אֲשֶׁ֥ר אַתָּ֖ה עֹבֵ֥ר שָֽׁמָּה׃", "onk": "וְיָת יְהוֹשׁוּעַ פַּקֵּדִית בְּעִדָּנָא הַהִיא לְמֵימָר עֵינָיךְ חֲזָאָה יָת כָּל דִּי עֲבַד יְיָ אֱלָהֲכוֹן לִתְרֵין מַלְכַיָּא הָאִלֵּין כֵּן יַעְבֵּד יְיָ לְכָל מַלְכְּוָתָא דִּי אַתְּ עָבֵר לְתַמָּן:", "onk_en": "And Yehoshua I commanded at that time, to say, ‘‘Your eyes will be seeing that everything Adonoy, your God, did to these two kings, so will Adonoy do to all the kingdoms that your are crossing into.", "pj": "וְיַת יְהוֹשׁוּעַ פַּקֵדִית בְּעִידָנָא הַהוּא לְמֵימָר עֵינָךְ חַמְיָין יַת כָּל דְּעָבַד יְיָ אֱלָהָךְ לִתְרֵין מַלְכַיָא הָאִילֵין הֵיכְדֵין יַעֲבִיד יְיָ לְכָל מַלְכְוָותָא דְאַנְתְּ עָבַר לְתַמָּן", "pj_en": "And I instructed Jehoshua at that time, saying: Thine eyes have seen all that the Lord thy God hath done to these two kings; so will the Lord do unto all the kingdoms to which thou art passing over.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 22, "aliyah": 7, "heb": "לֹ֖א תִּֽירָא֑וּם כִּ֚י יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם ה֖וּא הַנִּלְחָ֥ם לָכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא תִדְחֲלוּן מִנְּהוֹן אֲרֵי יְיָ אֱלָהֲכוֹן <b>מֵימְרֵיהּ<\/b> יְגִיחַ לְכוֹן:", "onk_en": "Do not fear them, for Adonoy, your God, is the One Who [<b>His word<\/b>] is waging war for you.’’", "pj": "לָא תְדַחֲלוּן מִנְהוֹן אֲרוּם מֵימְרָא דַיְיָ אֱלָהָכוֹן מְגִיחַ לְכוֹן", "pj_en": "Fear them not, for the Word of the Lord your God fighteth for you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
