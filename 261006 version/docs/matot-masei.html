ֶמְתָּם֙ וְלִרְכֻשָׁ֔ם וּלְכֹ֖ל חַיָּתָֽם׃", "onk": "וִיהוֹן קִרְוַיָּא לְהוֹן לְמִתָּב וְרַוְחֵיהוֹן יְהוֹן לִבְעִירְהוֹן וּלְקִנְיָנֵיהוֹן וּלְכָל חֵיוַתְהוֹן:", "onk_en": "These cities shall be theirs for dwelling, and their open space shall be for their animals, their property and all of their necessities to live.", "pj": "וִיהוֹן קִרְוַיָא לְהוֹן לְמֵיתַב וּבְדוֹרְלְהוֹן יְהוֹן לִבְעִירֵיהוֹן וּלְקִנְיָינֵיהוֹן וּלְכָל צוֹרְכֵיהוֹן", "pj_en": "And the cities shall be for them to dwell in, and the suburbs for their cattle, their property, and all their needful things.", "tj": "", "tj_en": "", "rashi": "<b>ולכל חיתם.<\/b> לְכָל צָרְכֵּיהֶם:", "rashi_en": "ולכל חיתם means FOR ALL THEIR NEEDS (the needs of their life; it does not mean for their animals) (Nedarim 81a)."}, {"ch": 35, "v": 4, "aliyah": 6, "heb": "וּמִגְרְשֵׁי֙ הֶֽעָרִ֔ים אֲשֶׁ֥ר תִּתְּנ֖וּ לַלְוִיִּ֑ם מִקִּ֤יר הָעִיר֙ וָח֔וּצָה אֶ֥לֶף אַמָּ֖ה סָבִֽיב׃", "onk": "וּרְוָחֵי קִרְוַיָּא דִּי תִתְּנוּן לְלֵוָאֵי מִכּוֹתֵל קַרְתָּא וּלְבָרָא אֲלַף אַמִּין סְחוֹר סְחוֹר:", "onk_en": "The open space for the cities that you shall give the Levites [shall extend] from the walls of the city and outward a thousand <i>amo¯s<\/i> all around.", "pj": "וּפְדוֹרְוִילֵי קִרְוַיָא דְתִתְּנוּן לְלֵיוָאֵי חֲזוֹר קַרְתָּא וּלְבַר אַלְפָא גַרְמִידֵי חֲזוֹר חֲזוֹר", "pj_en": "But of the cities which you give to the Levites the suburbs round the city shalt be one thousand cubits without the city round about.", "tj": "ומגרשי. וּפַרְוִוילֵי:", "tj_en": "But the suburbs.", "rashi": "<b>אלף אמה סביב.<\/b> וְאַחֲרָיו הוּא אוֹמֵר אַלְפַּיִם אַמָּה, הָא כֵיצַד? אַלְפַּיִם הוּא נוֹתֵן לָהֶם סָבִיב, וּמֵהֶם אֶלֶף הַפְּנִימִיִּים לְמִגְרָשׁ וְהַחִיצוֹנִים לְשָׂדוֹת וּכְרָמִים:", "rashi_en": "אלף אמה סביב A THOUSAND CUBITS ROUND ABOUT — But afterwards, (v. 5) it says, “two thousand cubits”!? How can that be? They assign two thousand for them (for the Levites) round about their cities, and of these, the innermost thousand serves as the “open space” and the outermost is for fields and vineyards (Sotah 27b)."}, {"ch": 35, "v": 5, "aliyah": 6, "heb": "וּמַדֹּתֶ֞ם מִח֣וּץ לָעִ֗יר אֶת־פְּאַת־קֵ֣דְמָה אַלְפַּ֪יִם בָּֽאַמָּ֟ה וְאֶת־פְּאַת־נֶ֩גֶב֩ אַלְפַּ֨יִם בָּאַמָּ֜ה וְאֶת־פְּאַת־יָ֣ם&thinsp;<b>׀<\/b> אַלְפַּ֣יִם בָּֽאַמָּ֗ה וְאֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּאַמָּ֖ה וְהָעִ֣יר בַּתָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָהֶ֔ם מִגְרְשֵׁ֖י הֶעָרִֽים׃", "onk": "וְתִמְשְׁחוּן מִבָּרָא לְקַרְתָּא יָת רוּחַ קִדּוּמָא תְּרֵין אַלְפִין בְּאַמִּין וְיָת רוּחַ דְּרוֹמָא תְּרֵין אַלְפִין בְּאַמִּין וְיָת רוּחַ מַעַרְבָא תְּרֵין אַלְפִין בְּאַמִּין וְיָת רוּחַ צִפּוּנָא תְּרֵין אַלְפִין בְּאַמִּין וְקַרְתָּא בִמְצִיעָא דֵּין יְהֵי לְהוֹן רְוָחֵי קִרְוַיָּא:", "onk_en": "You shall measure from outside the city two thousand <i>amo¯s<\/i> on the eastern side, two thousand <i>amo¯s<\/i> on the southern side, two thousand <i>amo¯s<\/i> on the western side, and two thousand <i>amo¯s<\/i> on the northern side; with the city in the center. This shall be the open spaces for the cities.", "pj": "וְתִמְשְׁחוּן מִבָּרָא לְקַרְתָּא יַת צִיטְרָא דְמַדִינְחָא תְּרֵין אַלְפִין גַרְמִידֵי וְיַת רוּחַ דָרוֹמָא תְּרֵין אַלְפִין גַרְמִידֵי וְיַת רוּחַ מַעַרְבָא תְּרֵין אַלְפִין גַרְמִידֵי וְיַת רוּחַ צִיפוּנָא תְּרֵין אַלְפִין גַרְמִידֵי וְקַרְתָּא בְּמִיצְעָא דֵין יְהֵי לְכוֹן פְּדוֹרְלֵי קִרְוַיָא", "pj_en": "And you shall measure outside the city, on the east side, two thousand cubits; on the South two thousatid, on the west two thousand, and on the north two thousand cubits, with the city in the midst; these shall be to you the suburbs of the cities.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 6, "aliyah": 6, "heb": "וְאֵ֣ת הֶֽעָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַלְוִיִּ֔ם אֵ֚ת שֵׁשׁ־עָרֵ֣י הַמִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָנֻ֥ס שָׁ֖מָּה הָרֹצֵ֑חַ וַעֲלֵיהֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּשְׁתַּ֖יִם עִֽיר׃", "onk": "וְיָת קִרְוַיָּא דִּי תִתְּנוּן לְלֵוָאֵי יָת שִׁית קִרְוֵי שֵׁזָבוּתָא דִּי תִתְּנוּן לְמֵעֲרַק תַּמָּן קָטוֹלָא וַעֲלֵיהוֹן תִּתְּנוּן אַרְבְּעִין וְתַרְתֵּין קִרְוִין:", "onk_en": "Along with the cities that you shall give the Levites shall be the six refuge cities which you shall provide [as places] for a murderer to flee; and in addition to them, you shall provide forty-two cities.", "pj": "וְיַת קִרְוַיָא דְתִתְּנוּן לְלֵיוָאֵי יַת שִׁית קוֹרְיַין דִקְלָטִין קָטוֹלָא לְמֵיעֲרוֹק לְתַמָן קָטוֹלָא וַעֲלֵיהוֹן תִּתְּנוּן אַרְבְּעִין וְתַרְתֵּין קוֹרְיָין", "pj_en": "And of the cities you give to the Levites, six shall be for refuges to manslayers, that the manslayer may escape thither. Beside these you shall give them forty-two other cities.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 7, "aliyah": 6, "heb": "כׇּל־הֶעָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַלְוִיִּ֔ם אַרְבָּעִ֥ים וּשְׁמֹנֶ֖ה עִ֑יר אֶתְהֶ֖ן וְאֶת־מִגְרְשֵׁיהֶֽן׃", "onk": "כָּל קִרְוַיָּא דִּי תִתְּנוּן לְלֵוָאֵי אַרְבְּעִין וְתַמְנֵי קִרְוִין יָתְהֶן וְיָת רְוָחֵיהֶן:", "onk_en": "The total number of cities that you shall give to the Levites is forty eight cities, with their open spaces.", "pj": "כָּל קִירְוַיָא דְתִתְּנוּן לְלֵיוָאֵי אַרְבְּעִין וְתַמְנֵי קוּרְיַין יַתְהוֹן וְיַת פְּדוֹרְוַולְהוֹן", "pj_en": "All the cities that you give to the Levites shall be forty-eight cities with their suburbs.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 8, "aliyah": 6, "heb": "וְהֶֽעָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵאֲחֻזַּ֣ת בְּנֵי־יִשְׂרָאֵ֔ל מֵאֵ֤ת הָרַב֙ תַּרְבּ֔וּ וּמֵאֵ֥ת הַמְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּפִ֤י נַחֲלָתוֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵעָרָ֖יו לַלְוִיִּֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְקִרְוַיָּא דִּי תִתְּנוּן מֵאֲחוּדַת בְּנֵי יִשְׂרָאֵל מִן סַגִּיאֵי תַּסְגּוּן וּמִן זְעִירֵי תַּזְעִירוּן גְּבַר כְּפוּם אַחֲסַנְתֵּיהּ דִּי יַחְסְנוּן יִתֵּן מִקִּרְווֹהִי לְלֵוָאֵי:", "onk_en": "The cities that you shall give, [shall be] from the possession of Bnei Yisroel; take more from a larger [holding], and less from a smaller [holding], each person, according to his inheritance, shall give of his cities to the Levites.”", "pj": "וְקוּרְיַין דְתִתְּנוּן מִן אַחֲסָנַת בְּנֵי יִשְרָאֵל מִן שִׁבְטָא דְעַמֵיהּ סַגִי תַּסְגוּן וּמִן שִׁבְטָא דְעַמֵיהּ זְעֵיר תִּזְעֵרוּן גְבַר אֲגַב אַחֲסַנְתֵּיהּ דְיַחְסְנוּן יִתֵּן מִקִירְוֵיהּ לְלֵוָאֵי", "pj_en": "But when you give the cities from the inheritance of the Beni Israel, from the tribe wbose people are many you shall give many, and from the tribe whose people are few you shall diminish; every one shall give of his cities to the Levites, according to the inheritance he possesses.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 9, "aliyah": 7, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 10, "aliyah": 7, "heb": "דַּבֵּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת־הַיַּרְדֵּ֖ן אַ֥רְצָה כְּנָֽעַן׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲרֵי אַתּוּן עָבְרִין יָת יַרְדְּנָא לְאַרְעָא דִכְנָעַן:", "onk_en": "“Speak to Bnei Yisroel and say to them: ‘When you cross the Yardein into the land of Canaan,", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֲרוּם אַתּוּן עָבְרִין יַת יוֹרְדְנָא לְאַרְעָא דִכְנָעַן", "pj_en": "Speak with the sons of Israel, and say to them, When you have passed over Jordan unto the land of Kenaan,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 11, "aliyah": 7, "heb": "וְהִקְרִיתֶ֤ם לָכֶם֙ עָרִ֔ים עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֣ינָה לָכֶ֑ם וְנָ֥ס שָׁ֙מָּה֙ רֹצֵ֔חַ מַכֵּה־נֶ֖פֶשׁ בִּשְׁגָגָֽה׃", "onk": "וּתְזַמְּנוּן לְכוֹן קִרְוִין קִרְוֵי שֵׁזָבוּתָא יֶהֶוְיַן לְכוֹן וְיֵעֲרוֹק לְתַמָּן קָטוֹלָא דְּיִקְטוֹל נַפְשָׁא בְּשָׁלוּ:", "onk_en": "you shall provide cities for yourselves, which shall serve as refuge cities for you, so that a murderer can flee there, one who accidentally killed a person.", "pj": "וּתְזַמְנוּן לְכוֹן קוּרְיַין בְּשׁוּקִין וּבָתֵּי חִיזְוָתָא קִרְוִין קַלְטַן יֶהֱוְיַן לְכוֹן וְיֶעְרוֹק לְתַמָן קָטוֹלָא דְיִקְטוֹל בַּר נַשׁ בְּשָׁלוּ", "pj_en": "you shall provide you cities with streets and houses of living (boarding houses), cities of refuge shall they be to you, that thither the manslayer may flee who hath killed a man inadvertently.", "tj": "", "tj_en": "", "rashi": "<b>והקריתם.<\/b> אֵין הַקְרָיָה אֶלָּא לְשׁוֹן הַזְמָנָה, וְכֵן הוּא אוֹמֵר \"כִּי הִקְרָה ה' אֱלֹהֶיךָ לְפָנָי\" (בראשית כ\"ז):", "rashi_en": "והקריתם — This verb קרה (in the Hiphil) denotes “preparing”. Similarly it says, (Genesis 27:20) “Because the Lord thy God made it ready (הקרה) before me”(Sifrei Bamidbar 159:4)."}, {"ch": 35, "v": 12, "aliyah": 7, "heb": "וְהָי֨וּ לָכֶ֧ם הֶעָרִ֛ים לְמִקְלָ֖ט מִגֹּאֵ֑ל וְלֹ֤א יָמוּת֙ הָרֹצֵ֔חַ עַד־עׇמְד֛וֹ לִפְנֵ֥י הָעֵדָ֖ה לַמִּשְׁפָּֽט׃", "onk": "וִיהוֹן לְכוֹן קִרְוַיָּא לְשֵׁזָבָא מִגָּאֵל <b>דְּמָא<\/b> וְלָא יְמוּת קָטוֹלָא עַד דְּיֵקוּם קֳדָם כְּנִשְׁתָּא לְדִינָא:", "onk_en": "These cities shall serve you as a refuge from the [<b>blood<\/b>] avenger, so that the murderer will not die until he stands in judgment before the congregation.", "pj": "וִיהוֹן לְכוֹן קִרְוַיָא לְמִקְלַט קָטוֹלָא מִן תְּבַע אַדְמָא וְלָא יְמוּת קָטוֹלָא עַד דְיֵיקוּם קֳדָם כְּנִשְׁתָּא לְדִינָא", "pj_en": "And they shall be to you for cities of refuge for the manslayer from the avenger of blood, that the man may not be put to death till he shall have stood before the congregation for judgment.", "tj": "", "tj_en": "", "rashi": "<b>מגאל.<\/b> מִפְּנֵי גּוֹאֵל הַדָּם, שֶׁהוּא קָרוֹב לַנִּרְצָח:", "rashi_en": "מגאל — [AND THE CITIES SHALL BE UNTO YOU AS A REFUGE] מגאל — i.e. as a refuge on account of the avenger of blood, — he who is the near relative of the murdered man."}, {"ch": 35, "v": 13, "aliyah": 7, "heb": "וְהֶעָרִ֖ים אֲשֶׁ֣ר תִּתֵּ֑נוּ שֵׁשׁ־עָרֵ֥י מִקְלָ֖ט תִּהְיֶ֥ינָה לָכֶֽם׃", "onk": "וְקִרְוַיָּא דִּי תִתְּנוּן שִׁית קִרְוֵי שֵׁזָבוּתָא יֶהֶוְיַן לְכוֹן:", "onk_en": "The cities that you shall give, will serve you as six refuge cities.", "pj": "וְקִרְוַיָא דְתִתְּנוּן שִׁית קִרְוִין קַלְטַן קָטוֹלָא יֶהֱוְיַן לְכוֹן", "pj_en": "And these cities which yougive shall be six cities of refuge for the manslayer;", "tj": "", "tj_en": "", "rashi": "<b>שש ערי מקלט.<\/b> מַגִּיד שֶׁאַעַ\"פִּ שֶׁהִבְדִּיל מֹשֶׁה בְּחַיָּיו שָׁלוֹשׁ עָרִים בְּעֵבֶר הַיַּרְדֵּן, לֹא הָיוּ קוֹלְטוֹת עַד שֶׁנִּבְחֲרוּ שָׁלֹשׁ שֶׁנָּתַן יְהוֹשֻׁעַ בְּאֶרֶץ כְּנַעַן (ספרי; מכות ט'):", "rashi_en": "שש ערי מקלט [AND AS TO THE CITIES WHICH YOU SHALL GIVE] SIX CITIES OF REFUGE (THERE SHALL BE FOR YOU] — This tells us that although Moses during his life-time set aside three cities on that side of the Jordan (Deuteronomy 4:41), they did not provide refuge until the three had been chosen which Joshua assigned in the land of Canaan on the west side of the Jordan (Sifrei Bamidbar 160:2; Makkot 9b)."}, {"ch": 35, "v": 14, "aliyah": 7, "heb": "אֵ֣ת&thinsp;<b>׀<\/b> שְׁלֹ֣שׁ הֶעָרִ֗ים תִּתְּנוּ֙ מֵעֵ֣בֶר לַיַּרְדֵּ֔ן וְאֵת֙ שְׁלֹ֣שׁ הֶֽעָרִ֔ים תִּתְּנ֖וּ בְּאֶ֣רֶץ כְּנָ֑עַן עָרֵ֥י מִקְלָ֖ט תִּהְיֶֽינָה׃", "onk": "יָת תְּלַת קִרְוַיָּא תִּתְּנוּן מֵעִבְרָא לְיַרְדְּנָא וְיָת תְּלַת קִרְוַיָּא תִּתְּנוּן בְּאַרְעָא דִכְנָעַן קִרְוֵי שֵׁזָבוּתָא יֶהֶוְיָן:", "onk_en": "Three cities on this side of the Yardein, and the [other] three cities you shall give in the land of Canaan. They shall be cities of refuge.", "pj": "יַת תְּלַת קִרְוַיָא תִתְּנוּן מֵעִבְרָא לְיוֹרְדְנָא וְיַת תְּלַת קִרְוַיָא תִתְּנוּן בְּאַרְעָא דִכְנָעַן קִרְוִין קַלְטַן תֶּהֱוְיַן", "pj_en": "three you shall appoint beyond Jordan, and three in the land of Kenaan; cities of refuge shall they be.", "tj": "", "tj_en": "", "rashi": "<b>את שלש הערים וגו'.<\/b> אַעַ\"פִּ שֶׁבְּאֶרֶץ כְּנַעַן תִּשְׁעָה שְׁבָטִים וְכָאן אֵינָן אֶלָּא שְׁנַיִם וָחֵצִי, הִשְׁוָה מִנְיַן עָרֵי הַמִּקְלָט שֶׁלָּהֶם, מִשּׁוּם דִּבְגִלְעָד נְפִישֵׁי רוֹצְחִים, דִּכְתִיב (הושע ו') \"גִּלְעָד קִרְיַת פֹּעֲלֵי אָוֶן עֲקֻבָּה מִדָּם\" (שם):", "rashi_en": "את שלש הערים וגו׳ THE THREE CITIES [YE SHALL GIVE ON THIS SIDE OF THE JORDAN etc.] — Although in the land of Canaan there were nine tribes and here (on the east side of the Jordan) there were only two and a half, it (Scripture) gives them (the latter) the same number of cities of refuge, because in Gilead (on the east side) murderers were more numerous, as it is written, (Hosea 6:8): “Gilead is a city of them that work iniquity, it is covered with footprints of blood” (Makkot 9b; cf. Sifrei Bamidbar 160:2)."}, {"ch": 35, "v": 15, "aliyah": 7, "heb": "לִבְנֵ֣י יִשְׂרָאֵ֗ל וְלַגֵּ֤ר וְלַתּוֹשָׁב֙ בְּתוֹכָ֔ם תִּהְיֶ֛ינָה שֵׁשׁ־הֶעָרִ֥ים הָאֵ֖לֶּה לְמִקְלָ֑ט לָנ֣וּס שָׁ֔מָּה כׇּל־מַכֵּה־נֶ֖פֶשׁ בִּשְׁגָגָֽה׃", "onk": "לִבְנֵי יִשְׂרָאֵל וּלְגִיּוֹרָא וּלְתוֹתָבָיָא דְבֵינֵיכוֹן יֶהֶוְיַן שִׁית קִרְוַיָּא הָאִלֵּין לְשֵׁזָבָא לְמֵעֲרוֹק לְתַמָּן כָּל דְּיִקְטוֹל נַפְשָׁא בְּשָׁלוּ:", "onk_en": "For Bnei Yisroel, the proselyte, and resident among them, shall these six cities be a refuge, to flee there anyone who accidentally kills a person.", "pj": "לִבְנֵי יִשְרָאֵל וּלְגִיוֹרָא וּלְתוֹתְבַיָא דְבֵינֵיהוֹן יֶהֱוְיָן שִׁית קִרְוַיָא הָאִילֵן לְשֵׁזָבָא לְמֵעֲרוֹק לְתַמָן כָּל דְיִקְטוֹל בַּר נַשׁ בְּשָׁלוּ", "pj_en": "For the sons of Israel and the sojourners among you shall be these six cities of refuge, that thither whoever hath killed a man through ignorance may flee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 16, "aliyah": 7, "heb": "וְאִם־בִּכְלִ֨י בַרְזֶ֧ל&thinsp;<small>׀<\/small>&thinsp;הִכָּ֛הוּ וַיָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָרֹצֵֽחַ׃", "onk": "וְאִם בְּמָאן דְפַרְזְלָא מְחָהִי וְקָטְלֵיהּ קָטוֹלָא הוּא אִתְקְטָלָא יִתְקְטֵל קָטוֹלָא:", "onk_en": "But if he struck him with an iron instrument and he died, then he is a murderer; the murderer must be executed.", "pj": "וְאִין בְּמָנָא דְפַרְזְלָא בְּמַשְׁהוּ מְחָהִי וְקַטְלֵיהּ קָטוֹלָא הוּא אִתְקְטָלָא יִתְקְטֵיל קָטוֹלָא", "pj_en": "But if he smote him with an instrument of iron and killed him, he is a murderer; and the murderer shall be surely put to death.", "tj": "", "tj_en": "", "rashi": "<b>ואם בכלי ברזל הכהו.<\/b> אֵין זֶה מְדַבֵּר בְּהוֹרֵג בְּשׁוֹגֵג הַסָּמוּךְ לוֹ, אֶלָּא בְּהוֹרֵג בְּמֵזִיד, וּבָא לְלַמֵּד שֶׁהַהוֹרֵג בְּכָל דָּבָר צָרִיךְ שֶׁיְּהֵא בוֹ שִׁעוּר כְּדֵי לְהָמִית, שֶׁנֶּאֱמַר בְּכֻלָּם \"אֲשֶׁר יָמוּת בּוֹ\", דִּמְתַּרְגְּמִינַן \"דְּהִיא כְמִסַּת דִּימוּת בֵּיהּ\", חוּץ מִן הַבַּרְזֶל, שֶׁגָּלוּי וְיָדוּעַ לִפְנֵי הַקָּבָּ\"ה שֶׁהַבַּרְזֶל מֵמִית בְּכָל שֶׁהוּא, אֲפִלּוּ מַחַט, לְפִיכָךְ לֹא נָתְנָה בוֹ תּוֹרָה שִׁעוּר לִכְתֹּב בּוֹ אֲשֶׁר יָמוּת בּוֹ; וְאִם תֹּאמַר בְּהוֹרֵג בְּשׁוֹגֵג הַכָּתוּב מְדַבֵּר, הֲרֵי הוּא אוֹמֵר לְמַטָּה אוֹ <b>בכל אבן אשר ימות בה בלא ראות<\/b> וְגוֹ', לִמֵּד עַל הָאֲמוּרִים לְמַעְלָה שֶׁבְּהוֹרֵג בְּמֵזִיד הַכָּתוּב מְדַבֵּר:", "rashi_en": "ואם בכלי ברזל הכהו BUT IF HE SMOTE HIM WITH AN INSTRUMENT OF IRON — This is not speaking of one who kills inadvertently, who is mentioned near this (in the preceding verse), but of one who kills intentionally; and its purpose is to teach us that with whatever instrument one kills, it is necessary that it must have a size sufficient to cause death, because in the case of all of them (vv. 17, 18) it is said, אשר ימות “[an instrument] by which one may die”, the Hebrew of which we translate in the Targum by, “[an instrument] which is of such a size that one may die through it” — in the case of all, except in that of iron, because it is manifest and known to the Holy One, blessed be He, that iron kills whatever size it may be (however small it is), even a needle. Therefore the Torah does not assign a size to it by writing ,אשר ימות בה (Sifrei Bamidbar 160:3; Sanhedrin 76b). And if you say that Scripture is speaking of one who kills inadvertently, — but surely it says lower down, (v. 23) “Or with any stone, even though one may die by it, (even though it is large enough to kill him) seeing him not”, which certainly is by inadvertence. This proves as regards the cases mentioned before it, that Scripture is speaking of one who kills intentionally."}, {"ch": 35, "v": 17, "aliyah": 7, "heb": "וְאִ֡ם בְּאֶ֣בֶן יָד֩ אֲשֶׁר־יָמ֨וּת בָּ֥הּ הִכָּ֛הוּ וַיָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָרֹצֵֽחַ׃", "onk": "וְאִם בְּאַבְנָא <b>דְּמִתְנָסְבָא<\/b> בִידָא דְּהִיא <b>כְמִסַּת<\/b> דִּי יְמוּת בַּהּ מְחָהִי וְקָטְלֵיהּ קָטוֹלָא הוּא אִתְקְטָלָא יִתְקְטֵל קָטוֹלָא:", "onk_en": "Or if with a stone that can be held [<b>taken<\/b>] in the hand and which can [<b>has the ability to<\/b>] kill he strikes him, and he died, he is a murderer; the murderer must be executed.", "pj": "וְאִין בְּאַבְנָא מְלוֹי יְדָא דִי כְמֵסַת דִי יְמוּת בָּהּ מְחוֹהִי וְקַטְלֵיהּ קָטוֹלָא הוּא אִתְקְטָלָא יִתְקְטֵיל קָטוֹלָא", "pj_en": "Or if, filling his hand with a stone large enough to kill any one, he struck him, and killed him, he is a murderer, and the murderer dying shall die.", "tj": "", "tj_en": "", "rashi": "<b>באבן יד.<\/b> שֶׁיֵּשׁ בָּהּ מְלֹא יָד (ספרי):<br><br><b>אשר ימות בה.<\/b> שֶׁיֵּשׁ בָּהּ שִׁעוּר לְהָמִית, כְּתַרְגּוּמוֹ; לְפִי שֶׁנֶּאֱמַר \"וְהִכָּה אִישׁ אֶת רֵעֵהוּ בְּאֶבֶן\" (שמות כ\"א), וְלֹא נָתַן בָּהּ שִׁעוּר, יָכוֹל כָּל שֶׁהוּא, לְכָךְ נֶאֱמַר <b>אשר ימות בה<\/b>:", "rashi_en": "באבן יד [AND IF HE SMOTE HIM] WITH A STONE IN THE HAND (more lit., with a stone of the hand) — one which has the size of a full hand (i.e., large enough to fill a hand).<br><br>אשר ימות בה signifies: which has a size sufficient to cause death, as the Targum understands it. Because it has been stated, (Exodus 21:18) “If one man smote another with a stone” but it assigned no size for it, one might think that it means, whatever size it may be! Therefore it states here, “by which one may die” (Sifrei Bamidbar 160:3)."}, {"ch": 35, "v": 18, "aliyah": 7, "heb": "א֡וֹ בִּכְלִ֣י עֵֽץ־יָד֩ אֲשֶׁר־יָמ֨וּת בּ֥וֹ הִכָּ֛הוּ וַיָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָרֹצֵֽחַ׃", "onk": "אוֹ בְּמָאן דְּעָא <b>דְּמִתְנַסֵב<\/b> בִּידָא דְּהִיא <b>כְמִסַּת<\/b> דִּי יְמוּת בֵּיהּ מְחָהִי וְקָטְלֵיהּ קָטוֹלָא הוּא אִתְקְטָלָא יִתְקְטַל קָטוֹלָא:", "onk_en": "Or if with a wooden implement [that can be held] [<b>taken<\/b>] in the hand and which can [<b>has the ability to<\/b>] cause death he strikes him, and he died, he is a murderer; the murderer must be executed.", "pj": "אוֹ בְמָנָא דְקֵיסָא מְלוֹי יְדָא דִי כְמֵיסַת דִימוּת בָּהּ מְחוֹהִי וְקַטְלֵיהּ קָטוֹלָא הוּא אִתְקְטָלָא יִתְקְטֵיל קָטוֹלָא", "pj_en": "Or if, filling his hand with an instrument of wood sufficient to kill any one, he struck him, and killed him, he is a murderer; the murderer shall be put to death.", "tj": "", "tj_en": "", "rashi": "<b>או בכלי עץ יד.<\/b> לְפִי שֶׁנֶּאֱמַר (שם) \"וְכִי יַכֶּה אִישׁ אֶת עַבְדּוֹ אוֹ אֶת אֲמָתוֹ בַּשֵּׁבֶט\", יָכוֹל כָּל שֶׁהוּא, לְכָךְ נֶאֱמַר \"בְּעֵץ אֲשֶׁר יָמוּת בּוֹ\" — שֶׁיְּהֵא בּוֹ כְּדֵי לְהָמִית (ספרי):", "rashi_en": "או בכלי עץ יד OR [IF HE SMITE HIM] WITH A WEAPON OF WOOD IN HIS HAND — Because it has been stated, (Exodus 21:20) “And if a man smite his bondman or his bondwoman with a rod”, one might think that it means whatever size it may be! Therefore it states here of the wooden instrument אשר ימות בה — meaning that it must have a size sufficient to cause death (Sifrei Bamidbar 160:4)."}, {"ch": 35, "v": 19, "aliyah": 7, "heb": "גֹּאֵ֣ל הַדָּ֔ם ה֥וּא יָמִ֖ית אֶת־הָרֹצֵ֑חַ בְּפִגְעוֹ־ב֖וֹ ה֥וּא יְמִתֶֽנּוּ׃", "onk": "גָּאֵל דְּמָא הוּא יִקְטוֹל יָת קָטוֹלָא כַּד <b>אִתְחַיַּב לֵיהּ מִן דִּינָא<\/b> הוּא יִקְטְלִנֵּיהּ:", "onk_en": "The blood avenger shall kill the murderer, wherever he meets him [<b>when he has been proven guilty by law<\/b>] he may kill him.", "pj": "תְּבַע אַדְמָא הוּא יִקְטוֹל יַת קָטוֹלָא כַּד יְעַרְעִינֵיהּ מִבָּרָא לְקִרְוַיָא הָאִלֵין בְּדִינָא הוּא יְקַטְלִינֵיהּ", "pj_en": "The avenger of blood may himself kill the manslayer, if he meet him outside of these cities; he may kill him in judgment.", "tj": "", "tj_en": "", "rashi": "<b>בפגעו בו.<\/b> אֲפִלּוּ בְּתוֹךְ עָרֵי מִקְלָט:", "rashi_en": "בפגעו בו WHENEVER HE MEETETH HIM [HE MAY KILL HIM] — even in the cities of refuge."}, {"ch": 35, "v": 20, "aliyah": 7, "heb": "וְאִם־בְּשִׂנְאָ֖ה יֶהְדֳּפֶ֑נּוּ אֽוֹ־הִשְׁלִ֥יךְ עָלָ֛יו בִּצְדִיָּ֖ה וַיָּמֹֽת׃", "onk": "וְאִם בְּסַנְאָה דְּחָהִי אוֹ רְמָא עֲלוֹהִי בְכַמְנָא וְקָטְלֵיהּ:", "onk_en": "If he pushes [his victim] out of hatred or throws at him deliberately, and he died,", "pj": "וְאִין בִּסְנָא הֲדוֹף וְאִיתְכַוִין וְדַחְיֵיהּ אוֹ טְלַק עֲלוֹי כְּלוֹנְסַן וְשַׁרְוָותָא וְגַלְגִיל עֲלוֹי כֵּיפִין בְּכַוָונוּת לִבָּא וְקַטְלֵיהּ", "pj_en": "But if (the manslayer) had assaulted in enmity and intentionally with a club or staff, or thrown stones upon him with purpose of heart, and killed him;", "tj": "", "tj_en": "", "rashi": "<b>בצדיה.<\/b> כְּתַרְגּוּמוֹ, \"בְּכָמְנָא\" — בְּמַאֲרָב:", "rashi_en": "בצדיה — Understand this as the Targum does: בכמנא, BY LAYING IN WAIT."}, {"ch": 35, "v": 21, "aliyah": 7, "heb": "א֣וֹ בְאֵיבָ֞ה הִכָּ֤הוּ בְיָדוֹ֙ וַיָּמֹ֔ת מֽוֹת־יוּמַ֥ת הַמַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַדָּ֗ם יָמִ֛ית אֶת־הָרֹצֵ֖חַ בְּפִגְעוֹ־בֽוֹ׃", "onk": "אוֹ בִדְבָבוּ מְחָהִי בִידֵיהּ וְקָטְלֵיהּ אִתְקְטָלָא יִתְקְטֵל מַחֲיָא קָטוֹלָא הוּא גָּאֵל דְּמָא יִקְטוֹל יָת קָטוֹלָא כַּד אִתְחַיַּב לֵיהּ מִן דִּינָא:", "onk_en": "or if in enmity, he struck him with his hand and he died, the assailant must be executed; he is a murderer. The blood avenger may kill the murderer wherever he meets him.", "pj": "אוֹ נְטַר לֵיהּ בָּבוּי וּמְחוֹהִי בִּידֵיהּ וְקַטְלֵיהּ קָטוֹלָא הוּא אִיתְקְטָלָא יִתְקְטֵיל קָטוֹלָא הוּא תְּבַע אַדְמָא יִקְטוֹל יַת קָטוֹלָא כַּד אִתְחְיַיב לֵיהּ", "pj_en": "or cherishing enmity had struck him with his hand and killed him; he is a murderer; dying he shall die. The avenger of blood may slay the homicide when he hath been condemned.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 22, "aliyah": 7, "heb": "וְאִם־בְּפֶ֥תַע בְּלֹא־אֵיבָ֖ה הֲדָפ֑וֹ אוֹ־הִשְׁלִ֥יךְ עָלָ֛יו כׇּל־כְּלִ֖י בְּלֹ֥א צְדִיָּֽה׃", "onk": "וְאִם בִּתְכֵף בְּלָא דְבָבוּ דְּחָהִי אוֹ רְמָא עֲלוֹהִי כָּל מָאן בְּלָא כְמַן לֵיהּ:", "onk_en": "But if suddenly, without enmity, he pushed him or threw any object at him not deliberately,", "pj": "וְאִין בְּשָׁלוּ בְּלָא נְטַר לֵיהּ בָּבוּ הֲדָפֵיהּ אוֹ טְלַק עֲלוֹי כָּל מָאן וְלָא אִתְכַוִין לְמִקְטְלֵיהּ", "pj_en": "But if in ignorance, without keeping of malice, he let any thing fall upon him, having no intention to kill;", "tj": "", "tj_en": "", "rashi": "<b>בפתע.<\/b> בְּאֹנֶס, וְתַרְגּוּמוֹ \"בִּתְכֵיף\", שֶׁהָיָה סָמוּךְ לוֹ וְלֹא הָיָה לוֹ שָׁהוּת לְהִזָּהֵר עָלָיו:", "rashi_en": "בפתע means BY ACCIDENT. In the Targum it is translated by בתכיף (in close proximity), meaning that he was very close to him and so had no time to be careful about him (i.e. to be on his guard not to kill him; see Rashi on Makkot 7b)."}, {"ch": 35, "v": 23, "aliyah": 7, "heb": "א֣וֹ בְכׇל־אֶ֜בֶן אֲשֶׁר־יָמ֥וּת בָּהּ֙ בְּלֹ֣א רְא֔וֹת וַיַּפֵּ֥ל עָלָ֖יו וַיָּמֹ֑ת וְהוּא֙ לֹא־אוֹיֵ֣ב ל֔וֹ וְלֹ֥א מְבַקֵּ֖שׁ רָעָתֽוֹ׃", "onk": "אוֹ בְכָל אַבְנָא דְּהִיא <b>כְמִסַּת<\/b> דִּי יְמוּת בַּהּ בְּלָא חָזֵי וּרְמָא עֲלוֹהִי וְקָטְלֵיהּ וְהוּא לָא סָנֵי לֵיהּ וְלָא תָבַע בִּישְׁתֵּיהּ:", "onk_en": "Or (even) with a stone which can [<b>has the ability to<\/b>] kill, without seeing [the victim], he threw it down on him and he died, but he was not his enemy and did not seek his harm.", "pj": "אוֹ בְּכָל אַבְנָא דְהִיא כְּמִיסַת דִימוּת בְּלָא מִתְכַוִין וְטָלַק עֲלוֹי מִדַעַם וְקַטְלֵיהּ וְהוּא לָא סָנֵי לֵיהּ וְלָא תָּבַע בִּשְׁתֵּיהּ", "pj_en": "or if without intention he let a stone sufficient to kill any one, or any other thing, fall upon him, and kill him, without having hated, or purposed to do him harm,", "tj": "", "tj_en": "", "rashi": "<b>או בכל אבן אשר ימות בה.<\/b> הִכָּהוּ:<br><br><b>בלא ראות.<\/b> שֶׁלֹּא רָאָהוּ:<br><br><b>ויפל עליו.<\/b> מִכָּאן אָמְרוּ הַהוֹרֵג דֶּרֶךְ יְרִידָה גּוֹלֶה, דֶּרֶךְ עֲלִיָּה אֵינוֹ גוֹלֶה (מכות ל'):", "rashi_en": "או בכל אבן אשר ימות בה OR WITH ANY STONE WHEREBY ONE MAY DIE, he smote him.<br><br>בלא ראות — i.e. that he (the slayer) did not see him (Not: without anyone having seen him, i.e. that there were no witnesses).<br><br>ויפל עליו AND HE CAST IT UPON HIM — From here (i.e. from these words) they (the Rabbis) said: he who kills inadvertently by way of a falling movement goes into exile (i.e. must escape to and reside in a city of refuge); he who kills by way of an upward movement does not go into exile (Makkot 7b; cf. our Note on Exodus 21:13)."}, {"ch": 35, "v": 24, "aliyah": 7, "heb": "וְשָֽׁפְטוּ֙ הָֽעֵדָ֔ה בֵּ֚ין הַמַּכֶּ֔ה וּבֵ֖ין גֹּאֵ֣ל הַדָּ֑ם עַ֥ל הַמִּשְׁפָּטִ֖ים הָאֵֽלֶּה׃", "onk": "וִידוּנוּן כְּנִשְׁתָּא בֵּין מַחֲיָא וּבֵין גָּאֵל דְּמָא עַל דִּינַיָּא הָאִלֵּין:", "onk_en": "Then the congregation shall judge between the assailant and the blood avenger, abiding by these laws.", "pj": "וִידוּנוּן כְּנִשְׁתָּא בֵּין מַחְיָא וּבֵין תָּבַע אַדְמָא עַל סְדַר דִינַיָא הָאִילֵין", "pj_en": "then the congregation shall judge between him who had smitten him, and the avenger of blood, according to these judgments;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 25, "aliyah": 7, "heb": "וְהִצִּ֨ילוּ הָעֵדָ֜ה אֶת־הָרֹצֵ֗חַ מִיַּד֮ גֹּאֵ֣ל הַדָּם֒ וְהֵשִׁ֤יבוּ אֹתוֹ֙ הָֽעֵדָ֔ה אֶל־עִ֥יר מִקְלָט֖וֹ אֲשֶׁר־נָ֣ס שָׁ֑מָּה וְיָ֣שַׁב בָּ֗הּ עַד־מוֹת֙ הַכֹּהֵ֣ן הַגָּדֹ֔ל אֲשֶׁר־מָשַׁ֥ח אֹת֖וֹ בְּשֶׁ֥מֶן הַקֹּֽדֶשׁ׃", "onk": "וִישֵׁזְבוּן כְּנִשְׁתָּא יָת קָטוֹלָא מִיַּד גָּאֵל דְּמָא וִיתִיבוּן יָתֵיהּ כְּנִשְׁתָּא לְקִרְיַת שֵׁזָבוּתֵיהּ דִּי עֲרַק לְתַמָּן וִיתֵב בַּהּ עַד דִּימוּת כַּהֲנָא רַבָּא דִּי רַבִּי יָתֵיהּ בִּמְשַׁח קוּדְשָׁא:", "onk_en": "The congregation shall protect the murderer from the blood avenger, and return him to his refuge city where he had fled, and he must remain there until the death of the <i>Kohein Gadol<\/i> who was anointed with the sacred oil.", "pj": "וִישֵׁזְבוּן כְּנִשְׁתָּא יַת קָטוֹלַיָא מִן יַד תָּבַע אַדְמָא וִיתוּבוּן יָתֵיהּ כְּנִשְׁתָּא לְקִרְוַיָא דְקַלְטֵיהּ דְאַפָּךְ לְתַמָן וִיתֵיב בָּהּ עַד זְמַן דִימוּת כַּהֲנָא רַבָּא דְרַבֵּי יָתֵיהּ סַגְיָא בִּמְשַׁח רְבוּתָא וּמְטוֹל דְלָא צַלִי בְּיוֹמָא דְכִפּוּרֵי בְקוֹדֶשׁ קוּדְשַׁיָא עַל תְּלַת עֲבֵירָן קַשְׁיָן דְלָא יְתַקְלוּן עַמָא בֵּית יִשְרָאֵל בְּפוּלְחָנָא נוּכְרָאָה וּבְגִילוּי עֶרְיוּתָא וּבִשְׁדִיוּת אֲדַם זַכְיָא וַהֲוָה בִידֵיהּ לְבַטְלוּתְהוֹן בִּצְלוֹתֵיהּ וְלָא צַלִי מְטוֹל כֵּן אִתְקְנַס לִמְמַת בְּשַׁתָּא הַהוּא", "pj_en": "and the congregation shall release the manslayer from the hand of the avenger of blood, and make him return to his city of refuge whither he had fled; and he shall dwell there until the time that the high priest die, whom the multitude (sagia) had anointed with the oil of anointing;-because he did not pray on the Day of Atonement in the Holy of Holies concerning the three great transgressions, that the people of the house of Israel might not be smitten for strange worship, or impure connexions, or the shedding of innocent blood, when it was in his power to obviate them by his prayer, and he prayed not, therefore hath he been condemned to die in that year.", "tj": "", "tj_en": "", "rashi": "<b>עד מות הכהן הגדול.<\/b> שֶׁהוּא בָא לְהַשְׁרוֹת שְׁכִינָה בְיִשְׂרָאֵל וּלְהַאֲרִיךְ יְמֵיהֶם, וְהָרוֹצֵחַ בָּא לְסַלֵּק אֶת הַשְּׁכִינָה מִיִּשְׂרָאֵל וּמְקַצֵּר אֶת יְמֵי הַחַיִּים, אֵינוֹ כְדַאי שֶׁיְּהֵא לִפְנֵי כֹּהֵן גָּדוֹל (ספרי); דָּבָר אַחֵר — לְפִי שֶׁהָיָה לוֹ לְכֹהֵן גָּדוֹל לְהִתְפַּלֵּל שֶׁלֹּא תֶאֱרַע תַּקָּלָה זוֹ לְיִשְׂרָאֵל בְּחַיָּיו (עי' מכות י\"א):<br><br><b>אשר משח אותו בשמן הקדש.<\/b> לְפִי פְשׁוּטוֹ מִן הַמִּקְרָאוֹת הַקְּצָרִים הוּא, שֶׁלֹּא פֵּרֵשׁ מִי מְשָׁחוֹ, אֶלָּא כְּמוֹ אֲשֶׁר מְשָׁחוֹ הַמּוֹשֵׁחַ אוֹתוֹ בְּשֶׁמֶן הַקֹּדֶשׁ; וְרַבּוֹתֵינוּ דְרָשׁוּהוּ בְמַסֶּכֶת מַכּוֹת (שם) לִרְאָיַת דָּבָר, לְלַמֵּד שֶׁאִם עַד שֶׁלֹּא נִגְמַר דִּינוֹ מֵת הַכֹּהֵן גָּדוֹל וּמִנּוּ אַחֵר תַּחְתָּיו, וּלְאַחַר מִכָּאן נִגְמַר דִּינוֹ, חוֹזֵר בְּמִיתָתוֹ שֶׁל שֵׁנִי, שֶׁנֶּאֱמַר <b>אשר משח אתו<\/b>, וְכִי הוּא מוֹשְׁחוֹ לַכֹּהֵן אוֹ הַכֹּהֵן מָשַׁח אוֹתוֹ? אֶלָּא לְהָבִיא אֶת הַנִּמְשָׁח בְּיָמָיו שֶׁמַּחֲזִירוֹ בְּמִיתָתוֹ:", "rashi_en": "עד מות הכהן הגדול [HE SHALL ABIDE IN IT] UNTIL THE DEATH OF THE HIGH PRIEST — because he serves to cause the Shechinah to dwell in Israel and thereby prolong their days, whilst the murderer serves to make the Shechinah depart from Israel and thereby shortens the days of the living. He is therefore not worthy that he should stand before a High Priest (that he should be anywhere near a High Priest) (Sifrei Bamidbar 160:9). Another explanation why he had to remain there until the High Priest’s death: Because the High Priest should have prayed that this misfortune might never happen in Israel in his days (cf. Makkot 11a).<br><br>אשר משח אתו בשמן הקדש WHO WAS ANOINTED WITH THE HOLY OIL — According to its plain sense, this is one of the elliptical sentences — for it does not expressly mention who anointed him, but it is the same as אשר משחו המושח בשמן המשחה “… the High Priest whom he who carried out the anointing had anointed with the holy oil”. — Our Rabbis, however, expounded it in Treatise Makkot 11b as a proof for a law: that it intends to teach that if, before the sentence on him has been passed that he should go into a city of refuge, the High Priest died and they appointed another in his stead, and afterwards his case was finished, he returns home through the death of the second, because it is said, אשר משח אתו. But did he anoint the priest or did the priest anoint him? for the words may literally mean either: “until the death of the High Priest whom he (the murderer) had anointed” or “until the death of the High Priest who has anointed him (the murderer)” — but the words are used to include the case of the High Priest who was anointed in his days (and whom, as it were he had anointed), viz., that he (such a High Priest) causes him to return home through his death."}, {"ch": 35, "v": 26, "aliyah": 7, "heb": "וְאִם־יָצֹ֥א יֵצֵ֖א הָרֹצֵ֑חַ אֶת־גְּבוּל֙ עִ֣יר מִקְלָט֔וֹ אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּה׃", "onk": "וְאִם מִפַּק יִפּוֹק קָטוֹלָא יָת תְּחוּם קִרְיַת שֵׁזָבוּתֵיהּ דִּי עֲרַק לְתַמָּן:", "onk_en": "But if the murderer goes outside of the border of his refuge city where he had fled,", "pj": "וְאִין מֵיפּוֹק יִפּוֹק קָטוֹלָא כָּל אֵימַת דְכַהֲנָא רַבָּא קְיַים מִן תְּחוּם קַרְתָּא דְקַלְטֵיהּ דַעֲרָק לְתַמָן", "pj_en": "But if, while the high priest is yet alive, the manslayer goeth out indeed from the bounds, of his city of refuge whither he had fled,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 27, "aliyah": 7, "heb": "וּמָצָ֤א אֹתוֹ֙ גֹּאֵ֣ל הַדָּ֔ם מִח֕וּץ לִגְב֖וּל עִ֣יר מִקְלָט֑וֹ וְרָצַ֞ח גֹּאֵ֤ל הַדָּם֙ אֶת־הָ֣רֹצֵ֔חַ אֵ֥ין ל֖וֹ דָּֽם׃", "onk": "וְיַשְׁכַּח יָתֵיהּ גָּאֵל דְּמָא מִבָּרָא לִתְחוּם קִרְיַת שֵׁזָבוּתֵיהּ וְיִקְטוֹל גָּאֵל דְּמָא יָת קָטוֹלָא לֵית לֵיהּ דְּמָא:", "onk_en": "and the blood avenger finds him outside the border of his refuge city, and the blood avenger kills the murderer, he has no blood.", "pj": "וְיַשְׁכַּח יָתֵיהּ תְּבַע אַדְמָא מִבָּרָא לִתְחוּם קַרְתָּא דְקַלְטֵיהּ וְיִקְטוֹל תְּבַע אַדְמָא יַת קָטוֹלָא לֵית לֵיהּ סִדְרִין דִקְטוֹל", "pj_en": "and the avenger of blood find him without the bounds of his city of refuge, he may kill the manslayer, without being guilty of death,", "tj": "", "tj_en": "", "rashi": "<b>אין לו דם.<\/b> הֲרֵי הוּא כְּהוֹרֵג אֶת הַמֵּת, שֶׁאֵין לוֹ דָּם:", "rashi_en": "אין לו דם [AND THE AVENGER OF BLOOD MAY SLAY THE MURDERER] THERE IS NO BLOOD GUILT FOR HIM (more lit., he has no blood) — He is as one who has killed a dead man, who is one who has no blood (cf. Rashi on Exodus 22:1)."}, {"ch": 35, "v": 28, "aliyah": 7, "heb": "כִּ֣י בְעִ֤יר מִקְלָטוֹ֙ יֵשֵׁ֔ב עַד־מ֖וֹת הַכֹּהֵ֣ן הַגָּדֹ֑ל וְאַחֲרֵ֥י מוֹת֙ הַכֹּהֵ֣ן הַגָּדֹ֔ל יָשׁוּב֙ הָרֹצֵ֔חַ אֶל־אֶ֖רֶץ אֲחֻזָּתֽוֹ׃", "onk": "אֲרֵי בְקִרְיַת שֵׁזָבוּתֵיהּ יִתֵּב עַד דִּימוּת כַּהֲנָא רַבָּא וּבָתַר דִּימוּת כַּהֲנָא רַבָּא יְתוּב קָטוֹלָא לַאֲרַע אַחֲסַנְתֵּיהּ:", "onk_en": "For he (the killer) must remain in his refuge city until the death of the <i>Kohein Gadol.<\/i> After the death of the <i>Kohein Gadol<\/i> the murderer may return to the land of his possession.", "pj": "אֲרוּם בְּקוּרְיְיתָא דְקַלְטֵיהּ יְתֵיב עַד דִימוּת כַּהֲנָא רַבָּא וּמִן בָּתַר דִימוּת כַּהֲנָא רַבָּא יְתוּב קָטוֹלָא לְאַרַע אַחֲסַנְתֵּיהּ", "pj_en": "for he should have abode in his city of refuge until the death of the high priest; but after the high priest is dead he may return to the land of his inheritance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 35, "v": 29, "aliyah": 7, "heb": "וְהָי֨וּ אֵ֧לֶּה לָכֶ֛ם לְחֻקַּ֥ת מִשְׁפָּ֖ט לְדֹרֹתֵיכֶ֑ם בְּכֹ֖ל מוֹשְׁבֹתֵיכֶֽם׃", "onk": "וִיהוֹן אִלֵּין לְכוֹן לִגְזֵרַת דִּין לְדָרֵיכוֹן בְּכָל מוֹתְבָנֵיכוֹן:", "onk_en": "These [rules] shall be for you the law of justice for all your descendants in all your dwelling places.", "pj": "וְיֶהֱווֹן אִלֵין אַחְוָיָתָא לְכוֹן לִגְזֵירַת דִינִין לְדָרֵיכוֹן בְּכָל מוֹתְבָנֵיכוֹן", "pj_en": "And these indications shall be to you a decree of judgment for your generations in all your dwellings:", "tj": "", "tj_en": "", "rashi": "<b>בכל מושבתיכם.<\/b> לִמֵּד שֶׁתְּהֵא סַנְהֶדְרִין קְטַנָּה נוֹהֶגֶת בְּחוּצָה לָאָרֶץ כָּל זְמַן שֶׁנּוֹהֶגֶת בְּאֶרֶץ יִשְׂרָאֵל (מכות ז'):", "rashi_en": "בכל מושבתיכם [AND THESE THINGS SHOULD BE AN ORDINANCE OF JUSTICE FOR YOU] IN ALL YOUR DWELLINGS — This teaches that the \"minor Sanhedrin\" functions outside the Land as long as there is [the main] one functioning in the Land of Israel [namely, while the Temple stood].(Makkot 7a)"}, {"ch": 35, "v": 30, "aliyah": 7, "heb": "כׇּ֨ל־מַכֵּה־נֶ֔פֶשׁ לְפִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת־הָרֹצֵ֑חַ וְעֵ֣ד אֶחָ֔ד לֹא־יַעֲנֶ֥ה בְנֶ֖פֶשׁ לָמֽוּת׃", "onk": "כָּל דְּיִקְטוֹל נַפְשָׁא לְפוּם סַהֲדִין יִקְטוֹל יָת קָטוֹלָא וְסָהִיד חַד לָא יַסְהֵד בֶּאֱנָשׁ לְמִקְטָל:", "onk_en": "If anyone kills a person, only upon the testimony of witnesses shall the murderer be killed. But one witness may not testify against a person, in a case of capital punishment.", "pj": "כָּל דְיִקְטוֹל בַּר נְשָׁא עַל מֵימַר סַהֲדִין דְחַמְיַין לְמִסְהַד עֲלוֹי יִקְטוֹל תְּבַע אַדְמָא אוֹ בֵי דִינָא יַת קָטוֹלָא וְסָהִיד חַד לָא יִסְהַד בְּבַר נַשׁ לִמְמָת", "pj_en": "Whosoever killeth a man, according to the word of witnesses fit to give testimony against him, the avenger of blood, or the house of judgment, shall put him to death. But one witness only shall not testify against a man to put him to death.", "tj": "", "tj_en": "", "rashi": "<b>כל מכה נפש וגו'.<\/b> הַבָּא לְהָרְגוֹ עַל שֶׁהִכָּה אֶת הַנֶּפֶשׁ (עי' ספרי):<br><br><b>לפי עדים ירצח.<\/b> שֶׁיָּעִידוּ שֶׁבְּמֵזִיד וּבְהַתְרָאָה הֲרָגוֹ:", "rashi_en": "כל מכה נפש וגו׳ HE WHO KILLETH A PERSON, etc. — This means: He who proposes to kill him because he had killed a person,<br><br>לפי עדים ירצח BY THE EVIDENCE OF WITNESSES ONE SHALL SLAY [THE MURDERER] — who testify that intentionally and after due warning he killed him."}, {"ch": 35, "v": 31, "aliyah": 7, "heb": "וְלֹֽא־תִקְח֥וּ כֹ֙פֶר֙ לְנֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר־ה֥וּא רָשָׁ֖ע לָמ֑וּת כִּי־מ֖וֹת יוּמָֽת׃", "onk": "וְלָא תְקַבְּלוּן <b>מָמוֹן<\/b> עַל אֱנַשׁ קָטוֹל דִּי הוּא חַיָּב לְמִקְטָל אֲרֵי אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "And do not accept atonement [<b>monetary<\/b>] compensation for the life of a murderer who is wicked to incur the death penalty, for he must be executed.", "pj": "וְלָא תְקַבְּלוּן פּוּרְקַן לְשֵׁיזְבָא בַּר נַשׁ קָטוֹלָא דְהוּא חַיָיב לִמְמָת אֲרוּם אִתְקְטָלָא יִתְקְטֵיל", "pj_en": "You may not take a ransom for the release of a murderer who is guilty of death, for dying he shall die.", "tj": "", "tj_en": "", "rashi": "<b>ולא תקחו כפר.<\/b> לֹא יִפָּטֵר בְּמָמוֹן (כתובות ל\"ז):", "rashi_en": "ולא תקח כפר AND YE SHALL TAKE NO RANSOM — He (the murderer) shall not be freed by a monetary payment (Ketubot 37b)."}, {"ch": 35, "v": 32, "aliyah": 7, "heb": "וְלֹא־תִקְח֣וּ כֹ֔פֶר לָנ֖וּס אֶל־עִ֣יר מִקְלָט֑וֹ לָשׁוּב֙ לָשֶׁ֣בֶת בָּאָ֔רֶץ עַד־מ֖וֹת הַכֹּהֵֽן׃", "onk": "וְלָא תְקַבְּלוּן מָמוֹן לְמֵעֲרוֹק לְקִרְיַת שֵׁזָבוּתֵיהּ לְמִתּוּב לְמִתַּב בְּאַרְעָא עַד דִּימוּת כַּהֲנָא:", "onk_en": "And do not accept atonement compensation for one who has fled to his refuge city, to allow him to return to live in the land, before the death of the <i>Kohein<\/i> (<i>Gadol<\/i>).", "pj": "וְלָא תְקַבְּלוּן פּוּרְקַן לִדְעָרַק לְקִרְיְיתָא דְקַלְטֵיהּ לְמֵיתוּב לְמֵיתַב בְּאַרְעָא עַד זְמַן דִימוּת כַּהֲנָא", "pj_en": "Neither may you take ransom for him who hath fled to his city of refuge, so as that he may return to dwell in the land before the time of the high priest's decease.", "tj": "", "tj_en": "", "rashi": "<b>ולא תקחו כפר לנוס אל עיר מקלטו.<\/b> לְמִי שֶׁנָּס אֶל עִיר מִקְלָט, שֶׁהָרַג בְּשׁוֹגֵג, אֵינוֹ נִפְטָר מִגָּלוּת בְּמָמוֹן, לִתֵּן כֹּפֶר <b>לשוב לשבת בארץ<\/b> טֶרֶם יָמוּת הַכֹּהֵן (שם):<br><br><b>לנוס.<\/b> כְּמוֹ לַנָּס, כְּמוֹ \"שׁוּבֵי מִלְחָמָה\" (מיכה ב') — שֶׁשָּׁבוּ מִן הַמִּלְחָמָה, וְכֵן \"נוּגֵי מִמּוֹעֵד\" (צפניה ג'), וְכֵן \"כִּי מֻלִים הָיוּ\" (יהושע ה'); כַּאֲשֶׁר תֹּאמַר שׁוּב עַל מִי שֶׁשָּׁב כְּבָר, וּמוּל עַל שֶׁמָּל כְּבָר, כֵּן תֹּאמַר לָנוּס עַל מִי שֶׁנָּס כְּבָר, וְקוֹרֵהוּ נוּס, כְּלוֹמַר מֻבְרָח. וְאִם תֹּאמַר לָנוּס — לִבְרֹחַ, וּתְפָרְשֵׁהוּ לֹא תִקְחוּ כֹפֶר לְמִי שֶׁיֵּשׁ לוֹ לִבְרֹחַ לְפָטְרוֹ מִן הַגָּלוּת (עי' ספרי), לֹא יָדַעְתִּי הֵיאַךְ יֹאמַר לָשׁוּב לָשֶׁבֶת בָּאָרֶץ, הֲרֵי עֲדַיִן לֹא נָס, וּמֵהֵיכָן יָשׁוּב?:", "rashi_en": "ולא תקחו כפר לנוס אל עיר מקלטו AND YE SHALL TAKE NO RANSOM לנוס TO HIS CITY OF REFUGE — The last words are the same as לַנָּס אל עיר מקלטו, \"ye shall take no ransom for one who is fled to a city of refuge, i.e., one who has killed inadvertently, cannot be freed from exile by money, by giving a ransom (Sifrei Bamidbar 160:12),  לשוב לשבת בארץ THAT HE SHOULD RETURN TO DWELL IN THE LAND before the High Priest dies.<br><br>לנוס (the passive participle) has the same meaning as לַנָּס (the active participle), just as, (Micha 2:8) \"שובי מלחמה”, which means “those who have returned from battle”; and so, too, (Zephaniah 3:18) “those who are removed far (נוני) from the appointed season”; (Joshua 5:5): “for they were circumcised men (מולים)”. Now just as you say שוב in reference to one who has already returned, and מול in reference to one who is already circumcised, so you can say לנוס in reference to one who has already fled. It calls him נוס (the passive participle), as much as to say “one who was made to flee”; — But you say that לנוס means “to flee” (the infinitive) explaining it thus: “ye shall take no ransom for one who ought to flee”, in order to free him from exile (cf. Sifrei Bamidbar 160:12), then I do not know how it can be said: “ye shall take no ransom … so that he should return to dwell in the land”, for you see, he has not yet fled, so from where shall he return?"}, {"ch": 35, "v": 33, "aliyah": 7, "heb": "וְלֹֽא־תַחֲנִ֣יפוּ אֶת־הָאָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔הּ כִּ֣י הַדָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת־הָאָ֑רֶץ וְלָאָ֣רֶץ לֹֽא־יְכֻפַּ֗ר לַדָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ־בָּ֔הּ כִּי־אִ֖ם בְּדַ֥ם שֹׁפְכֽוֹ׃", "onk": "וְלָא <b>תְחַיְּבוּן<\/b> יָת אַרְעָא דִּי אַתּוּן בַּהּ אֲרֵי דְמָא הוּא מְחַיַּב יָת אַרְעָא וּלְאַרְעָא לָא מִתְכַּפֵּר עַל דַּם <b>זַכַּאי<\/b> דְּאִתָּשַׁד בַּהּ אֶלָּהֵן בְּדַם אַשְׁדֵּיהּ:", "onk_en": "Do not pollute [<b>incur guilt on<\/b>] the land in which you live, for, the blood pollutes the land, and for the land there can be no atonement for the [<b>innocent<\/b>] blood that was spilled in it, except through the blood of the one who spilled it.", "pj": "וְלָא תְטַנְפוּן יַת אַרְעָא דְאַתּוּן בָּהּ אֲרוּם דַם זַכְּאַי דְלָא מִתְפְּרַע הוּא יִטוֹף יַת אַרְעָא וּלְאַרְעָא לָא מִתְכַּפֵּר עַל דַם זַכְּאַי דְאִשְׁתְּדֵי בָּהּ אֱלָהֵן בִּשְׁדִיוּת אֲדַם דְמַאן דְשַׁדְיֵהּ", "pj_en": "Nor contaminate ye the land in which you are, because innocent blood which hath not been avenged will overflow the land, and there is no atonement made for the land upon which innocent blood hath been shed, but by the shedding of the blood of him who shed it.", "tj": "", "tj_en": "", "rashi": "<b>ולא תחניפו.<\/b> לֹא תַרְשִׁיעוּ, כְּתַרְגּוּמוֹ — \"וְלָא תְחַיְבוּן\":", "rashi_en": "ולא תחניפו means AND YE SHALL NOT [MAKE THE LAND] WICKED, as it is translated in the Targum: לא תחיבון."}, {"ch": 35, "v": 34, "aliyah": 7, "heb": "וְלֹ֧א תְטַמֵּ֣א אֶת־הָאָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּתוֹכָ֑הּ כִּ֚י אֲנִ֣י יְהֹוָ֔ה שֹׁכֵ֕ן בְּת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְלָא תְסָאֲבוּן יָת אַרְעָא דִּי אַתּוּן יָתְבִין בַּהּ דִּי <b>שְׁכִינְתִּי<\/b> שָׁרְיָא בְּגַוָּהּ אֲרֵי אֲנָא יְיָ <b>דִּשְׁכִנְתִּי<\/b> שָׁרְיָא בְּגוֹ בְּנֵי יִשְׂרָאֵל:", "onk_en": "You must not defile the land in which you live, wherein I [<b>My Shechinah<\/b>] reside[<b>s<\/b>], for, I, Adonoy, [<b>whose Shechinah<\/b>] dwell[<b>s<\/b>] among Bnei Yisroel.’”", "pj": "וְלָא תְסַאֲבוּן יַת אַרְעָא דְאַתּוּן בָּהּ אֲרוּם דִשְׁכִינְתִּי שַׁרְיָא בְּגַוָהּ אֲרוּם אֲנָא הוּא יְיָ דִשְׁכִינְתִּי שַׁרְיָא בְּגוֹ בְּנֵי יִשְרָאֵל", "pj_en": "Therefore defile not the land in which you are; for My Shekinah dwelleth in the midst of it; for I am the Lord whose Shekinah dwelleth among the children of Israel.", "tj": "", "tj_en": "", "rashi": "<b>אשר אני שכן בתוכה.<\/b> שֶׁלֹּא תַשְׁכִּינוּ אוֹתִי בְטֻמְאָתָהּ:<br><br><b>כי אני ה' שכן בתוך בני ישראל.<\/b> אַף בִּזְמַן שֶׁהֵם טְמֵאִים שְׁכִינָה בֵינֵיהֶם (ספרי):", "rashi_en": "אשר אני שכן בתוכה [AND YE SHALL NOT DEFILE THE LAND] … IN WHICH I DWELL — It means: Do not do anything defiling to the land so that you will make Me dwell amidst its uncleanness,<br><br>‎'כי אני ה שכן בתוך בני ישראל FOR I, THE LORD, DWELL AMONG THE CHILDREN OF ISRAEL — for even when they (the Israelites) are unclean My Shechinah remains amongst them (Sifrei Bamidbar 160:15)."}, {"ch": 36, "v": 1, "aliyah": 7, "heb": "וַֽיִּקְרְב֞וּ רָאשֵׁ֣י הָֽאָב֗וֹת לְמִשְׁפַּ֤חַת בְּנֵֽי־גִלְעָד֙ בֶּן־מָכִ֣יר בֶּן־מְנַשֶּׁ֔ה מִֽמִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽיְדַבְּר֞וּ לִפְנֵ֤י מֹשֶׁה֙ וְלִפְנֵ֣י הַנְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְקָרִיבוּ רֵישֵׁי אֲבָהָתָא לְזַרְעִית בְּנֵי גִּלְעָד בַּר מָכִיר בַּר מְנַשֶּׁה מִזַּרְעֲיַת בְּנֵי יוֹסֵף וּמַלִּילוּ קֳדָם משֶׁה וְקֳדָם רַבְרְבַיָּא רֵישֵׁי אֲבָהָתָא לִבְנֵי יִשְׂרָאֵל:", "onk_en": "The paternal leaders approached—for the children of Gilad, son of Machir, son of Menashe, of the families of Yoseif’s sons—and they spoke before Moshe and the leaders who were the paternal heads of Bnei Yisroel.", "pj": "וּקְרִיבוּ לְבֵי דִינָא רֵישֵׁי אַבְהָתָא לִגְנִיסַת בְּנֵי גִלְעָד בַּר מָכִיר בַּר מְנַשֶׁה וְלִגְנִיסַת בְּנֵי גִלְעָד בַּר יוֹסֵף וּמַלִילוּ קֳדָם משֶׁה וְקָדָם רַבְרְבַיָא רֵישֵׁי אַבְהָתָא לִבְנֵי יִשְרָאֵל", "pj_en": "And the heads of the fathers of the family of the Beni Gilead bar Makir bar Menasheh, even the family of the Beni Gilead bar Joseph, came to the house of judgment, and spake before Mosheh and the princes, the chief fathers of the Beni Israel,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 2, "aliyah": 7, "heb": "וַיֹּאמְר֗וּ אֶת־אֲדֹנִי֙ צִוָּ֣ה יְהֹוָ֔ה לָתֵ֨ת אֶת־הָאָ֧רֶץ בְּנַחֲלָ֛ה בְּגוֹרָ֖ל לִבְנֵ֣י יִשְׂרָאֵ֑ל וַֽאדֹנִי֙ צֻוָּ֣ה בַֽיהֹוָ֔ה לָתֵ֗ת אֶֽת־נַחֲלַ֛ת צְלׇפְחָ֥ד אָחִ֖ינוּ לִבְנֹתָֽיו׃", "onk": "וַאֲמָרוּ יָת רִבּוֹנִי פַּקִּיד יְיָ לְמִתַּן יָת אַרְעָא בְּאַחֲסָנָא בְּעַדְבָא לִבְנֵי יִשְׂרָאֵל וְרִבּוֹנִי אִתְפַּקַּד <b>בְּמֵמְרָא<\/b> דַיְיָ לְמִתַּן יָת אַחֲסָנַת צְלָפְחָד אָחוּנָא לִבְנָתֵיהּ:", "onk_en": "They said: “Adonoy commanded our master to give the land as an inheritance, through the casting of lots, to Bnei Yisroel, and our master was commanded by [<b>the word of<\/b>] Adonoy to give the inheritance of our brother Tzelofchad to his daughters.", "pj": "וַאֲמָרוּ יַת רִבּוֹנִי פַּקֵיד יְיָ לְמִתַּן יַת אַרְעָא בְּאַחְסַנְתָּא בְּעַדְבָא לִבְנֵי יִשְרָאֵל וְרִבּוֹנִי אִתְפַּקֵיד מִן קֳדָם יְיָ לְמִתַּן יַת אַחְסָנַת צְלָפְחָד אָחוּנָא לִבְנָתֵיהּ", "pj_en": "and said: The Lord commanded Rabboni {our lord} to give the land an inheritance by lot to the children of Israel, and Rabboni was commanded before the Lord to give the inheritance of our brother Zelophehad to his daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 3, "aliyah": 7, "heb": "וְ֠הָי֠וּ לְאֶחָ֞ד מִבְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי־יִשְׂרָאֵל֮ לְנָשִׁים֒ וְנִגְרְעָ֤ה נַחֲלָתָן֙ מִנַּחֲלַ֣ת אֲבֹתֵ֔ינוּ וְנוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַמַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָהֶ֑ם וּמִגֹּרַ֥ל נַחֲלָתֵ֖נוּ יִגָּרֵֽעַ׃", "onk": "וִיהֶוְיַן לְחַד מִבְּנֵי שִׁבְטַיָּא דִבְנֵי יִשְׂרָאֵל לִנְשִׁין <b>וְתִתְמְנַע<\/b> אַחֲסַנְתְּהוֹן מֵאַחֲסָנַת אֲבְהָתָנָא וְתִתּוֹסַף עַל אַחֲסָנַת שִׁבְטַיָּא דִּי יֶהֶוְיָן לְהוֹן וּמֵעֲדַב אַחֲסַנְתָּא יִתִּמְנָע:", "onk_en": "But if they marry a member of another tribe of Bnei Yisroel, their inheritance will be diminished [<b>subtracted<\/b>] from our father’s inheritance, and it will be added to the inheritance of the tribe into which they will marry, and from the lot of our inheritance it will be subtracted.", "pj": "וַהֲוָאָה לְחַד מִבְּנֵי שִׁבְטַיָא דִבְנֵי יִשְרָאֵל לִנְשִׁין וְתִתְמְנַע אַחְסַנְתְּהוֹן מֵאַחְסָנַת אַבְהָתָנָא וְתִיתוֹסַף עַל אַחְסָנַת שִׁבְטַיָא דְיֶהֱוְיָן לְהוֹן וּמִן עֲדַב אַחְסַנְתָּנָא יִתְמְנַע", "pj_en": "But if these marry into any of the tribes of the children of Israel, their inheritance will be withdrawn from that of our fathers, and will be added to the inheritance of the tribe which will have become theirs, and our lot will be diminished.", "tj": "", "tj_en": "", "rashi": "<b>ונוסף על נחלת המטה.<\/b> שֶׁהֲרֵי בְנָהּ יוֹרְשָׁהּ, וְהַבֵּן מִתְיַחֵס עַל שֵׁבֶט אָבִיו:", "rashi_en": "ונוסף על נחלת המטה AND IF THEY BECOME WIVES TO ANY SONS OF THE OTHER TRIBES … THEN WILL THEIR INHERITANCE] BE ADDED TO THE INHERITANCE OF THE TRIBE [WHEREUNTO THEY SHALL BELONG] — for her son will be her heir and the son reckons his pedigree after his father’s tribe."}, {"ch": 36, "v": 4, "aliyah": 7, "heb": "וְאִם־יִהְיֶ֣ה הַיֹּבֵל֮ לִבְנֵ֣י יִשְׂרָאֵל֒ וְנֽוֹסְפָה֙ נַחֲלָתָ֔ן עַ֚ל נַחֲלַ֣ת הַמַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָהֶ֑ם וּמִֽנַּחֲלַת֙ מַטֵּ֣ה אֲבֹתֵ֔ינוּ יִגָּרַ֖ע נַחֲלָתָֽן׃", "onk": "וְאִם יְהֵי יוֹבְלָא לִבְנֵי יִשְׂרָאֵל וְתִתּוֹסַף אַחֲסַנְתְּהוֹן עַל אַחֲסָנַת שִׁבְטָא דִּי תְהֶוְיַן לְהוֹן וּמֵאַחֲסָנַת שִׁבְטָא דַאֲבְהָתָנָא יִתִּמְנַע אַחֲסַנְתְּהֶן:", "onk_en": "And even when the <i>yoveil<\/i> occurs for Bnei Yisroel, their inheritance will be added to the inheritance of the tribe into which they will marry, and from the inheritance of our fathers’ tribe, their inheritance will be subtracted.", "pj": "וְאִין יֶהֱוֵי יוּבְלָא לִבְנֵי יִשְרָאֵל וְתִיתוֹסַף אַחְסַנְתְּהוֹן עַל אַחְסָנַת שִׁבְטַיָא דְיֶהֱוְיָן לְהוֹן וּמֵאַחְסָנַת שִׁבְטָא דְאַבְהָתָנָא יִתְמְנַע אַחְסַנְתְּהוֹן", "pj_en": "And at the Jubilee of the Beni Israel their inheritance will be added to that of their tribe in which they will be; and their possession will have been withdrawn from the inheritance of our father's tribe.", "tj": "", "tj_en": "", "rashi": "<b>ואם יהיה היבל.<\/b> מִכָּאן הָיָה רַ' יְהוּדָה אוֹמֵר עָתִיד הַיּוֹבֵל שֶׁיִּפְסֹק (ספרא ויקרא ב'):<br><br><b>ואם יהיה היובל.<\/b> כְּלוֹמַר, אֵין זוֹ מְכִירָה שֶׁחוֹזֶרֶת בַּיּוֹבֵל, שֶׁהַיְרֻשָּׁה אֵינָהּ חוֹזֶרֶת, וַאֲפִלּוּ אִם יִהְיֶה הַיּוֹבֵל לֹא תַחֲזֹר הַנַּחֲלָה לְשִׁבְטוֹ, וְנִמְצָא שֶׁנּוֹסְפָה <b>על נחלת המטה אשר תהיינה להם<\/b>:", "rashi_en": "ואם יהיה היבל may mean AND IF THERE WILL BE THE JUBILEE — From this R. Judah said: The observance of the Jubilee will cease at some time or other (Sifra, Vayikra Dibbura d'Nedavah, Section 13 1 on Leviticus 2:14).<br><br>ואם יהיה היבל may mean, too: AND WHEN THERE WILL BE THE JUBILEE [THEN WILL THEIR INHERITANCE BE ADDED TO THE INHERITANCE OF THE TRIBE TO WHICH THEY SHALL BELONG] — meaning: This is no sale of land so that it returns to the original owner at the Jubilee, for a heritage never returns. Therefore even when the Jubilee will be, the inheritance will not return to its tribe, and it will follow that it will be added על נחלת המטה אשר תהיינה להם TO THE INHERITANCE OF THE TRIBE TO WHICH THEY SHALL BELONG."}, {"ch": 36, "v": 5, "aliyah": 7, "heb": "וַיְצַ֤ו מֹשֶׁה֙ אֶת־בְּנֵ֣י יִשְׂרָאֵ֔ל עַל־פִּ֥י יְהֹוָ֖ה לֵאמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי־יוֹסֵ֖ף דֹּבְרִֽים׃", "onk": "וּפַקִּיד משֶׁה יָת בְּנֵי יִשְׂרָאֵל עַל מֵימְרָא דַיְיָ לְמֵימָר יָאוּת שִׁבְטָא דִבְנֵי יוֹסֵף מְמַלְּלִין:", "onk_en": "Moshe instructed Bnei Yisroel according to command of Adony, saying: “Correctly are the descendants of Yoseif’s tribe speaking.", "pj": "וּפַקֵיד משֶׁה יַת בְּנֵי יִשְרָאֵל עַל מֵימְרָא דַיְיָ לְמֵימָר יָאוּת שִׁבְטָא דִבְנֵי יוֹסֵף מְמַלְלִין", "pj_en": "Then Mosheh commanded the children of Israel by the Word of the Lord, saying: The tribe of the Beni Joseph have said well.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 6, "aliyah": 7, "heb": "זֶ֣ה הַדָּבָ֞ר אֲשֶׁר־צִוָּ֣ה יְהֹוָ֗ה לִבְנ֤וֹת צְלׇפְחָד֙ לֵאמֹ֔ר לַטּ֥וֹב בְּעֵינֵיהֶ֖ם תִּהְיֶ֣ינָה לְנָשִׁ֑ים אַ֗ךְ לְמִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִיהֶ֖ם תִּהְיֶ֥ינָה לְנָשִֽׁים׃", "onk": "דֵּין פִּתְגָּמָא דִּי פַקִּיד יְיָ לִבְנַת צְלָפְחָד לְמֵימַר לִדְתַקִּין בְּעֵינֵיהוֹן תְּהֶוְיַן לִנְשִׁין בְּרַם לְזַרְעִית שִׁבְטָא דַאֲבוּהֶן תְּהֶוְיַן לִנְשִׁין:", "onk_en": "This is the word that Adonoy has commanded regarding Tzelofchad’s daughters: ‘Let them marry whom they think best, as long as they marry within their tribe of their father.", "pj": "דֵין פִּתְגָמָא דְפַקֵיד יְיָ לָא לְדָרַיָא דַעֲתִידִין לְמֵיקוּם בָּתַר פִּילוּג אַרְעָא אֱלָהֵן לִבְנַת צְלָפְחָד לְמֵימָר לִדְתַקִין בְּעֵינֵיהוֹן תֶּהֱוְיָן לִנְשִׁין לְחוֹד לִגְנִיסַת שֵׁבֶט אֲבוּהֶן תֶּהֱוְיַן לִנְשִׁין", "pj_en": "This is the thing which the Lord hath commanded,-not for the generations that shall arise after the division of the land, but for the daughters of Zelophehad, saying: They may be the wives of them who are proper in their eyes, only such must be of the families of their father's tribe.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 7, "aliyah": 7, "heb": "וְלֹֽא־תִסֹּ֤ב נַחֲלָה֙ לִבְנֵ֣י יִשְׂרָאֵ֔ל מִמַּטֶּ֖ה אֶל־מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּנַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔יו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְלָא תַסְחַר אַחֲסָנָא לִבְנֵי יִשְׂרָאֵל מִשִּׁבְטָא לְשִׁבְטָא אֲרֵי גְבַר בְּאַחֲסָנַת שִׁבְטָא דַאֲבָהָתוֹהִי יִדַּבְּקוּן בְּנֵי יִשְׂרָאֵל:", "onk_en": "Thereby, there will be no transfer of inheritance of Bnei Yisroel from tribe to tribe but each person to the inheritance of his father’s tribe, shall Bnei Yisroel remain attached.", "pj": "מְטוּל דְלָא תִיתְקֵף אַחְסָנָא לִבְנֵי יִשְרָאֵל מִשִׁבְטָא לְשִׁבְטָא חוֹרָנָא אֲרוּם גְבַר בְּאַחְסָנַת שִׁבְטָא דְאַבְהָתוֹי יִדְבְּקוּן בְּנֵי יִשְרָאֵל", "pj_en": "That the inheritance of the children of Israel may not pass about from one tribe to another: for the children of Israel shall every one keep to the inheritance of their father's tribe.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 8, "aliyah": 7, "heb": "וְכׇל־בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִמַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְאֶחָ֗ד מִמִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖יהָ תִּהְיֶ֣ה לְאִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽיו׃", "onk": "וְכָל בְּרַתָּא יָרְתַת אַחֲסָנָא מִשִּׁבְטַיָּא דִּבְנֵי יִשְׂרָאֵל לְחַד מִזַּרְעִית שִׁבְטָא דַאֲבוּהָא תְּהֵי לְאִנְתּוּ בְּדִיל דִּי יֵרְתוּן בְּנֵי יִשְׂרָאֵל גְּבַר אַחֲסָנַת אֲבָהָתוֹהִי:", "onk_en": "Every daughter who inherits property among the tribes of Bnei Yisroel to a member of her father’s tribe shall she marry, so that each one of Bnei Yisroel will inherit the property of his fathers.", "pj": "וְכָל בְּרַתָּא יַרְתַת אַחְסָנָא מִשִׁבְטָא דִבְנֵי יִשְרָאֵל לְחַד מִזַרְעִית שִׁבְטָא דַאֲבוּהָא תְּהֵי לְאִנְתּוּ בְּדִיל דְיֵרְתוּן בְּנֵי יִשְרָאֵל גְבַר אַחְסָנַת אַבְהָתוֹהִי", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>וכל בת ירשת נחלה.<\/b> שֶׁלֹּא הָיָה בֵן לְאָבִיהָ:", "rashi_en": "וכל בת ירשת נחלה AND EVERY DAUGHTER THAT INHERITS A POSSESSION because her father had no son, [SHALL BE WIFE, etc.]"}, {"ch": 36, "v": 9, "aliyah": 7, "heb": "וְלֹֽא־תִסֹּ֧ב נַחֲלָ֛ה מִמַּטֶּ֖ה לְמַטֶּ֣ה אַחֵ֑ר כִּי־אִישׁ֙ בְּנַ֣חֲלָת֔וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְלָא תַסְחַר אַחֲסָנָא מִשִּׁבְטָא לְשִׁבְטָא אוֹחֲרָנָא אֲרֵי גְבַר בְּאַחֲסַנְתֵּיהּ יִדְּבְּקוּן שִׁבְטַיָּא דִּבְנֵי יִשְׂרָאֵל:", "onk_en": "And no inheritance will be transferred from one tribe to another tribe; for, through every man with his own inheritance, will the tribes of Bnei Yisroel be attached.", "pj": "וְלָא תַסְחַר אַחְסָנָא מִשִׁבְטָא לְשִׁבְטָא אוֹחֲרָנָא אֲרֵי גְבַר בְּאַחְסַנְתֵּיהּ יִדְבְּקוּן שִׁבְטַיָא דִבְנֵי יִשְרָאֵל", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 10, "aliyah": 7, "heb": "כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶׁ֑ה כֵּ֥ן עָשׂ֖וּ בְּנ֥וֹת צְלׇפְחָֽד׃", "onk": "כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה כֵּן עֲבָדוּ בְּנַת צְלָפְחָד:", "onk_en": "Exactly as Adonoy commanded Moshe, so did Tzelofchad’s daughters.", "pj": "הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה הֵיכְדֵין עֲבָדוּ בְּנַת צְלָפְחָד", "pj_en": "As the Lord commanded Mosheh, so did the daughters of Zelophehad;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 11, "aliyah": 7, "heb": "וַתִּהְיֶ֜ינָה מַחְלָ֣ה תִרְצָ֗ה וְחׇגְלָ֧ה וּמִלְכָּ֛ה וְנֹעָ֖ה בְּנ֣וֹת צְלׇפְחָ֑ד לִבְנֵ֥י דֹדֵיהֶ֖ן לְנָשִֽׁים׃", "onk": "וַהֲוָאָה מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה בְּנַת צְלָפְחָד <b>לִבְנֵי אֲחֵי אֲבוּהֶן<\/b> לִנְשִׁין:", "onk_en": "And they were—Machlah, Sirtzah, Choglah, Milkah and No’ah, the daughters of Tzelofchad—wives to their cousins [<b>the sons of their father’s brothers<\/b>].", "pj": "וַהֲוָאָה מַחֲלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנוֹעָה בְּנַת צְלָפְחָד לִבְנֵי חֲבִיבֵיהוֹן לִנְשִׁין", "pj_en": "and Mahalah, Thirzah, Hogelab, Milchah and Nohah, the daughters of Zelophehad, became wives of sons of their kindred;", "tj": "", "tj_en": "", "rashi": "<b>מחלה תרצה וגו'.<\/b> כָּאן מְנָאָן לְפִי גְדֻלָּתָן זוֹ מִזּוֹ בַּשָּׁנִים, וְנִשְּׂאוּ כְּסֵדֶר תּוֹלְדוֹתָן, וּבְכָל הַמִּקְרָא מְנָאָן לְפִי חָכְמָתָן, וּמַגִּיד שֶׁשְּׁקוּלוֹת זוֹ כְּזוֹ (עי' בבא בתרא ק\"כ):", "rashi_en": "מחלה תרצה וגו׳ MAHLA, TIRZA etc., — Here it enumerates them according to their superiority over one another in years for they were married in the order in which they were born. But everywhere else in the Bible it enumerates them according to their intelligence: This tells us that they were all equal (cf. Bava Batra 120a; Rashi on Numbers 27:1)."}, {"ch": 36, "v": 12, "aliyah": 7, "heb": "מִֽמִּשְׁפְּחֹ֛ת בְּנֵֽי־מְנַשֶּׁ֥ה בֶן־יוֹסֵ֖ף הָי֣וּ לְנָשִׁ֑ים וַתְּהִי֙ נַחֲלָתָ֔ן עַל־מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִיהֶֽן׃", "onk": "מִזַרְעֲיַת בְּנֵי מְנַשֶּׁה בַר יוֹסֵף הֲוָאָה לִנְשִׁין וַהֲוַת אַחֲסַנְתְּהֶן עַל שִׁבְטָא זַרְעִית אַבוּהֶן:", "onk_en": "From the families of Menashe, son of Yoseif, they married, and their inheritance remained with the tribe of their father’s family.", "pj": "מִגְנִיסַת בְּנֵי מְנַשֶׁה בַּר יוֹסֵף הֲוָאָה לִנְשִׁין וַהֲוַת אַחְסַנְתְּהוֹן עַל שֵׁיבַט גְנִיסַת אֲבוּהֶן", "pj_en": "of the family of the children of Menasheh bar Joseph were they wives, and their inheritance was with the tribe of their father's family.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 36, "v": 13, "aliyah": 7, "heb": "אֵ֣לֶּה הַמִּצְוֺ֞ת וְהַמִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה בְּיַד־מֹשֶׁ֖ה אֶל־בְּנֵ֣י יִשְׂרָאֵ֑ל בְּעַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ׃", "onk": "אִלֵּין פִּקּוֹדַיָּא וְדִינַיָּא דִּי פַקִּיד יְיָ בִּידָא דְמשֶׁה לְוָת בְּנֵי יִשְׂרָאֵל בְּמֵישְׁרַיָּא דְמוֹאָב עַל יַרְדְּנָא דִירֵחוֹ:", "onk_en": "These are the commandments and the laws that Adonoy commanded Bnei Yisroel through Moshe, in the plains of Moav at the Yardein near Yereicho. <b>Chazak<\/b>", "pj": "אִלֵין פִּקוּדַיָא וְסִדְרֵי דִינַיָא דְפַקֵיד יְיָ בִּידָא דְמשֶׁה לְוַת בְּנֵי יִשְרָאֵל בְּמֵישְׁרַיָא דְמוֹאָב עַל יַרְדְנָא דִירֵיחוֹ", "pj_en": "These are the commandments and orders of judgments which the Lord commanded the children of Israel, by Mosheh, in the plains of Moab by the Jordan near Jericho.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}];

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
