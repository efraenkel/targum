t the Word of the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>ותמרו.<\/b> לְשׁוֹן הַתְרָסָה – הִתְרַסְתֶּם כְּנֶגֶד מַאֲמָרוֹ:", "rashi_en": "ותמרו — This is an expression denoting setting oneself in opposition: ye opposed yourselves to His words."}, {"ch": 1, "v": 27, "aliyah": 3, "heb": "וַתֵּרָגְנ֤וּ בְאׇהֳלֵיכֶם֙ וַתֹּ֣אמְר֔וּ בְּשִׂנְאַ֤ת יְהֹוָה֙ אֹתָ֔נוּ הוֹצִיאָ֖נוּ מֵאֶ֣רֶץ מִצְרָ֑יִם לָתֵ֥ת אֹתָ֛נוּ בְּיַ֥ד הָאֱמֹרִ֖י לְהַשְׁמִידֵֽנוּ׃", "onk": "וְאִתְרַעַמְתּוּן בְּמַשְׁכְּנֵיכוֹן וַאֲמַרְתּוּן בִּדְסָנֵי יְיָ יָתָנָא אַפְּקָנָא מֵאַרְעָא דְמִצְרָיִם לְמִמְסַר יָתָנָא בִּידָא דֶאֱמֹרָאָה לְשֵׁצָיוּתָנָא:", "onk_en": "You grumbled in your tents and said, ‘‘Because of Adonoy’s hatred of us, He took us out of the land of Egypt to put us in the hand of the Emorite to destroy us.", "pj": "וְרַגִינְתּוּן בְּמַשְׁכְּנֵיכוֹן נְסֵיבְתּוּן בְּנֵיכוֹן וּבְנָתֵיכוֹן בְּעִיטְפֵיכוֹן לְמֵימָר וַוי לְכוֹן סַגִיפִין מְחַר אַתּוּן מִתְקַטְלִין מְטוֹל דְּסָנֵי יְיָ יָתָנָא אַפְקָנָא מִן אַרְעָא דְמִצְרַיִם לְמִימְסַר יָתָנָא בִּידָא דֶאֱמוֹרָאֵי לְשֵׁצֵיוּתָנָא", "pj_en": "And you cried in your tents, taking your sons and your daughters to your breasts, saying, Woe to you, ye stricken ones! tomorrow ye will be slain. Why hath the Lord hated us, to have brought us out of the land of Mizraim, to deliver us into the hand of the Amorites to destroy us?", "tj": "", "tj_en": "", "rashi": "<b>ותרגנו.<\/b> לָשׁוֹן הָרָע, וְכֵן \"דִּבְרֵי נִרְגָּן\" (משלי י\"ח) – אָדָם הַמּוֹצִיא דִּבָּה:<br><br><b>בשנאת ה' אתנו.<\/b> וְהוּא הָיָה אוֹהֵב אֶתְכֶם, אֲבָל אַתֶּם שׂוֹנְאִים אוֹתוֹ; מְשַׁל הֶדְיוֹט אוֹמֵר מַה דִּבְלִבָּךְ עַל רְחִמָּךְ מַה דִּבְלִבֵּהּ עֲלָךְ (ספרי):<br><br><b>בשנאת ה' אתנו הוציאנו מארץ מצרים.<\/b> הוֹצָאָתוֹ לְשִׂנְאָה הָיְתָה; מָשָׁל לְמֶלֶךְ בָּשָׂר וָדָם שֶׁהָיוּ לוֹ שְׁנֵי בָנִים וְיֵשׁ לוֹ שְׁתֵּי שָׂדוֹת, אַחַת שֶׁל שִׁקְיָא וְאַחַת שֶׁל בַּעַל, לְמִי שֶׁהוּא אוֹהֵב נוֹתֵן שֶׁל שִׁקְיָא, וּלְמִי שֶׁהוּא שׂוֹנֵא נוֹתֵן לוֹ שֶׁל בַּעַל, אֶרֶץ מִצְרַיִם שֶׁל שִׁקְיָא הִיא, שֶׁנִּילוּס עוֹלֶה וּמַשְׁקֶה אוֹתָהּ, וְאֶרֶץ כְּנַעַן שֶׁל בַּעַל, וְהוֹצִיאָנוּ מִמִּצְרַיִם לָתֵת לָנוּ אֶת אֶרֶץ כְּנַעַן (במ\"ר י\"ז):", "rashi_en": "ותרגנו — This is an expression denoting slander. Similar is, (Proverbs 18:8) “The words of a נרגן” i.e. of a man who brings a false report (Sifrei Devarim 24:1).<br><br>בשנאת ה׳ אתנו BECAUSE THE LORD HATETH US — Really, however, He loved you, but you hated Him. A common proverb says: What is in your own mind about your friend, you imagine is what is in his mind about you (Sifrei Devarim 24:3).<br><br>בשנאת ה' אתנו הוציאנו מארץ מצרים BECAUSE THE LORD HATETH US HE HATH BROUGHT US FORTH FROM THE LAND OF EGYPT — His bringing us forth was out of hatred. A parable! It may be compared to an earthly king who had two sons, and who had two fields, one well-watered; the other arid (dependent upon rain only). To him whom he loved best of his sons he gave the well-watered field, and to him whom he loved less he gave the arid one. The land of Egypt is a well-watered country, for the Nile rises and irrigates it, whilst the land of Canaan is an arid country — and He brought us forth from well-watered Egypt to give us the arid land of Canaan (Numbers Rabbah 17:3)."}, {"ch": 1, "v": 28, "aliyah": 3, "heb": "אָנָ֣ה&thinsp;<b>׀<\/b> אֲנַ֣חְנוּ עֹלִ֗ים אַחֵ֩ינוּ֩ הֵמַ֨סּוּ אֶת־לְבָבֵ֜נוּ לֵאמֹ֗ר עַ֣ם גָּד֤וֹל וָרָם֙ מִמֶּ֔נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּבְצוּרֹ֖ת בַּשָּׁמָ֑יִם וְגַם־בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׃", "onk": "לְאָן אֲנַחְנָא סָלְקִין אֲחָנָא <b>תְבָרוּ יָת לִבָּנָא<\/b> לְמֵימַר עַם סַגִּי וְתַקִּיף מִנָּנָא קִרְוִין רַבְרְבָן וּכְרִיכָן עַד צֵית שְׁמַיָּא וְאַף בְּנֵי <b>גִבָּרָאֵי<\/b> חֲזֵינָא תַמָּן:", "onk_en": "Where are we going up to? Our brothers have shattered our hopes [<b>broken our hearts<\/b>] by saying, ‘A people greater and more powerful than we, cities great and fortified sky-high, and also descendants of the Anakim [<b>giants<\/b>]—did we see there.’’’", "pj": "לְאָן אֲנַחְנָא סַלְקִין אָחָנָא מַסְמִיסַן יַת לִיבָּנָא לְמֵימָר עַם רַב וּתְקֵיף מִנָנָא קִירְוַון רַבְרְבָן וּכְרִיכַן עַד צֵית שְׁמַיָא וְאוּף בְּנֵי עֶפְרוֹן גִּבָּרָא חֲמֵינָא תַּמָן", "pj_en": "How shall we go up? Our brethren have dissolved our hearts, saying, The people are greater and mightier than we; their cities are vast, and walled to the height of heaven, and we saw there also the sons of Ephron the giant.", "tj": "", "tj_en": "", "rashi": "<b>ערים גדלת ובצורת בשמים.<\/b> דִּבְּרוּ הַכְּתוּבִים לְשׁוֹן הֲבַאי (ספרי; חולין צ'):", "rashi_en": "ערים גדלת ובצורת בשמים THE CITIES ARE GREAT AND FORTIFIED TO HEAVEN — Scriptural texts sometimes speak in exaggerated terms (Sifrei Devarim 25:4; Chullin 90b)."}, {"ch": 1, "v": 29, "aliyah": 3, "heb": "וָאֹמַ֖ר אֲלֵכֶ֑ם לֹא־תַעַרְצ֥וּן וְלֹא־תִֽירְא֖וּן מֵהֶֽם׃", "onk": "וַאֲמָרִית לְכוֹן לָא <b>תִתָּבְרוּן<\/b> וְלָא תִדְחֲלוּן מִנְּהוֹן:", "onk_en": "I said to you, ‘‘Do not crumble [<b>be broken (hearted)<\/b>] and do not fear them.", "pj": "וַאֲמָרִית לְכוֹן לָא תִתְבְּרוּן וְלָא תִדַחֲלוּן מִנְהוֹן", "pj_en": "And I said to you, Be not broken down, nor be afraid of them:", "tj": "", "tj_en": "", "rashi": "<b>לא תערצון.<\/b> לְשׁוֹן שְׁבִירָה, כְּתַרְגּוּמוֹ, וְדוֹמֶה לוֹ (איוב ל') \"בַּעֲרוּץ נְחָלִים לִשְׁכֹּן\"– שִׁבּוּר הַנְּחָלִים:", "rashi_en": "לא תערצון — This is an expression denoting breaking, as the Targum translates it: You should not let yourselves be broken by them. Similar to it is, (Job 30:6) “To dwell in ערוץ נחלים”, i.e. in the fissure of the valleys."}, {"ch": 1, "v": 30, "aliyah": 3, "heb": "יְהֹוָ֤ה אֱלֹֽהֵיכֶם֙ הַהֹלֵ֣ךְ לִפְנֵיכֶ֔ם ה֖וּא יִלָּחֵ֣ם לָכֶ֑ם כְּ֠כֹ֠ל אֲשֶׁ֨ר עָשָׂ֧ה אִתְּכֶ֛ם בְּמִצְרַ֖יִם לְעֵינֵיכֶֽם׃", "onk": "יְיָ אֱלָהֲכוֹן <b>דִּמְדַבַּר<\/b> קֳדָמֵיכוֹן הוּא יְגִיחַ לְכוֹן כְּכֹל דִּי עֲבַד עִמְּכוֹן בְּמִצְרַיִם לְעֵינֵיכוֹן:", "onk_en": "Adonoy, your God, who goes before you [<b>leads you<\/b>], He will wage war for you, as in everything that He did with you in Egypt before your eyes;", "pj": "מֵימְרָא דַיְיָ אֱלָהָכוֹן דִּמְדַבֵּר קֳדָמֵיכוֹן הוּא יַגִּיחַ לְכוֹן כְּכָל מַה דַּעֲבַד לְכוֹן בְּמִצְרַיִם לְמֵיחְמֵיכוֹן", "pj_en": "the Word of the Lord your God who goeth before you will Himself fight for you, according to all that He did for you in Mizraim before your eyes.", "tj": "", "tj_en": "", "rashi": "<b>ילחם לכם.<\/b> בִּשְׁבִילְכֶם:", "rashi_en": "ילחם לכם means, [HE WILL FIGHT] ON YOUR BEHALF."}, {"ch": 1, "v": 31, "aliyah": 3, "heb": "וּבַמִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲךָ֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ כַּאֲשֶׁ֥ר יִשָּׂא־אִ֖ישׁ אֶת־בְּנ֑וֹ בְּכׇל־הַדֶּ֙רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד־בֹּאֲכֶ֖ם עַד־הַמָּק֥וֹם הַזֶּֽה׃", "onk": "וּבְמַדְבְּרָא דִּי חֲזֵיתָא דִּי סוֹבְרָךְ יְיָ אֱלָהָךְ כְּמָא דִי מְסוֹבַר גְּבַר יָת בְּרֵיהּ בְּכָל אָרְחָא דִּי הַלֶּכְתּוּן עַד מֵיתֵיכוֹן עַד אַתְרָא הָדֵין:", "onk_en": "and in the wilderness, as you have seen, (where) Adonoy, your God, carried you the way a man carries his son all along the road you went until you arrived at this place.", "pj": "וּבְמַדְבְּרָא דַחֲמֵיתָא חִוְויָא קָלָן מַלְיָין אֶרֶס דִּקְטוֹל וְסוֹבְרָךְ יְיָ אֱלָהָךְ בַּעֲנָנֵי אִיקַר שְׁכִינְתֵּיהּ הֵיכְמָא דִמְסוֹבַר גְּבַר יַת בְּרֵיהּ בְּכָל אָרְחָא דְהַלֵיכְתּוּן עַד זְמַן מֵיתֵיכוֹן עַד אַתְרָא הָדֵין", "pj_en": "And in the desert, where thou sawest burning serpents full of deadly venom, the Lord thy God bare thee with the glorious clouds of His Shekinah, as a man carrieth his child, all the way that you went, until you have come to this place.", "tj": "", "tj_en": "", "rashi": "<b>ובמדבר אשר ראית.<\/b> מוּסָב עַל מִקְרָא שֶׁלְּמַעְלָה הֵימֶנּוּ – <b>ככל אשר עשה אתכם במצרים<\/b>, וְעָשָׂה אַף <b>במדבר אשר ראית אשר נשאך וגו'<\/b>:<br><br><b>כאשר ישא איש את בנו.<\/b> כְּמוֹ שֶׁפֵּרַשְׁתִּי אֵצֶל \"וַיִּסַּע מַלְאַךְ הָאֱלֹהִים הַהֹלֵךְ לִפְנֵי מַחֲנֵה יִשְׂרָאֵל וְגוֹ'\" (שמות י\"ד) מָשָׁל לִמְהַלֵּךְ בַּדֶּרֶךְ וּבְנוֹ לְפָנָיו, בָּאוּ לִסְטִים לִשְׁבּוֹתוֹ, וְכוּ':", "rashi_en": "ובמדבר אשר ראית — This is to be connected with the verse preceding: \"according to all that He did for you in Egypt\" \"and\" which He also did \"in the wilderness, where thou hast seen how that [the Lord thy God] bore thee, etc.<br><br>כאשר ישא איש את בנו  AS A MAN DOTH BEAR HIS SON — The meaning is just as I have explained in connection with the verse (Exodus 14:19—20), \"And the angel of the Lord that went before the camp of the Israelites moved, etc.\". A parable! It may be compared to one who is proceeding on a journey, his son walking in front of him. If bandits come to kidnap him (the son), he takes him away from in front of him and places him behind himself, etc."}, {"ch": 1, "v": 32, "aliyah": 3, "heb": "וּבַדָּבָ֖ר הַזֶּ֑ה אֵֽינְכֶם֙ מַאֲמִינִ֔ם בַּיהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "וּבְפִתְגָּמָא הָדֵין לֵיתֵיכוֹן מְהֵימְנִין <b>בְּמֵימְרָא דַ<\/b>יְיָ אֱלָהֲכוֹן:", "onk_en": "Yet in this matter, you do not trust [<b>the word of<\/b>] Adonoy, your God,", "pj": "וּבְפִתְגָמָא הָדֵין לֵיתֵיכוֹן מְהֵימְנִין בְּמֵימְרָא דַיְיָ אֱלָהָכוֹן", "pj_en": "But in this thing you believed not in the Word of the Lord your God,", "tj": "", "tj_en": "", "rashi": "<b>ובדבר הזה.<\/b> שֶׁהוּא מַבְטִיחֲכֶם לַהֲבִיאֲכֶם אֶל הָאָרֶץ – אֵינְכֶם מַאֲמִינִים בּוֹ:", "rashi_en": "ובדבר הזה YET IN REGARD TO THIS THING that He promised you, viz., to bring you to the Land, you did not believe in Him (because the promise has not yet been fulfilled)."}, {"ch": 1, "v": 33, "aliyah": 3, "heb": "הַהֹלֵ֨ךְ לִפְנֵיכֶ֜ם בַּדֶּ֗רֶךְ לָת֥וּר לָכֶ֛ם מָק֖וֹם לַחֲנֹֽתְכֶ֑ם בָּאֵ֣שׁ&thinsp;<b>׀<\/b> לַ֗יְלָה לַרְאֹֽתְכֶם֙ בַּדֶּ֙רֶךְ֙ אֲשֶׁ֣ר תֵּֽלְכוּ־בָ֔הּ וּבֶעָנָ֖ן יוֹמָֽם׃", "onk": "דִּי <b>מְדַבֵּר<\/b> קֳדָמֵיכוֹן בְּאָרְחָא <b>לְאַתְקְנָאָה<\/b> לְכוֹן אֲתַר בֵּית מֵישְׁרִי לְאַשְׁרָיוּתְכוֹן <b>בְּעַמּוּדָא<\/b> דְאֶשָּׁתָא בְּלֵילְיָא לְאַחֲזָיוּתְכוֹן בְּאָרְחָא דִּי תְהָכוּן בַּהּ <b>וּבְעַמּוּדָא<\/b> דַעֲנָנָא בִּימָמָא:", "onk_en": "Who has been going ahead of you [<b>leading you<\/b>] on the road to seek [<b>prepare<\/b>] for you a place to encamp; with the [<b>pillar of<\/b>] fire at night to show you the way for you to go on, and with the [<b>pillar of<\/b>] cloud by day.", "pj": "דִּמְדַבֵּר קֳדָמֵיכוֹן בְּאָרְחָא לְאִיתַקְנָא לְכוֹן אֲתַר בֵּית מֵשְׁרוֹי לְאַשְׁרָיוּתְכוֹן בְּעַמּוּדָא דְאֵישָׁא בְּלֵילְיָא לְאַנְהָרוּתְכוֹן בְּאָרְחָא דְתֶהֱכוֹן בָּהּ וְעַמּוּדָא דַעֲנָנָא בִּימָמָא", "pj_en": "who led before you in the way to prepare for you the place of your encampments, in the pillar of fire by night to light you in the way you should go, and in the pillar of the cloud by day.", "tj": "", "tj_en": "", "rashi": "<b>לראתכם.<\/b> כְּמוֹ לְהַרְאוֹתְכֶם, וְכֵן (שמות י\"ג) \"לַנְחֹתָם הַדֶּרֶךְ\", וְכֵן (תהלים כ\"ו) \"לַשְׁמִעַ בְּקוֹל תּוֹדָה\", וְכֵן (מלכים ב ט') \"לָלֶכֶת לַגִּיד בְּיִזְרְעֶאל\":", "rashi_en": "לראתכם — This word is the same as לְהַרְאֹתְכֶם. Similar, too, is לנחתם הדרך (like לְהַנְחֹתָם; see Rashi on Exodus 13:21). So also (Psalms 26:7) לשמיע בקול תודה [like לְהַשְׁמִיעַ], also, (2 Kings 9:15) ללכת לגיד ביזרעל [like לְהַגִּיד] "}, {"ch": 1, "v": 34, "aliyah": 3, "heb": "וַיִּשְׁמַ֥ע יְהֹוָ֖ה אֶת־ק֣וֹל דִּבְרֵיכֶ֑ם וַיִּקְצֹ֖ף וַיִּשָּׁבַ֥ע לֵאמֹֽר׃", "onk": "וּשְׁמִיעַ <b>קֳדָם<\/b> יְיָ יָת קַל פִּתְגָּמֵיכוֹן וּרְגֵז וְקַיַּם לְמֵימָר:", "onk_en": "[<b>Before<\/b>] Adonoy [<b>was<\/b>] heard the intent of your words and angrily swore, to say:", "pj": "וּשְׁמִיעַ קֳדָם יְיָ יַת קַל פִּתְגָמֵיכוֹן וּרְגַז וְקַיֵּים לְמֵימָר", "pj_en": "And the voice of your words was heard before the Lord, and He was displeased, and did make oath saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 35, "aliyah": 3, "heb": "אִם־יִרְאֶ֥ה אִישׁ֙ בָּאֲנָשִׁ֣ים הָאֵ֔לֶּה הַדּ֥וֹר הָרָ֖ע הַזֶּ֑ה אֵ֚ת הָאָ֣רֶץ הַטּוֹבָ֔ה אֲשֶׁ֣ר נִשְׁבַּ֔עְתִּי לָתֵ֖ת לַאֲבֹתֵיכֶֽם׃", "onk": "אִם יֶחֱזֵי גְבַר בְּגֻבְרַיָּא הָאִלֵּין דָּרָא בִישָׁא הָדֵין יָת אַרְעָא טַבְתָא דִּי קַיֵּמִית לְמִתַּן לַאֲבָהָתְכוֹן:", "onk_en": "‘‘That [no] man will see—of these men, this wicked generation—the good land that I swore to give to your forefathers.", "pj": "אִין יֶחֱמוּן גְּבַר בְּגוּבְרַיָא הָאִילֵין דָּרָא בִישָׁא הָדֵין יַת אַרְעָא טַבְתָא דְקַיֵּימִית לְמִתַּן לְאַבְהַתְכוֹן", "pj_en": "If any one of the men of this evil generation shall see the good land which I covenanted to give unto their fathers,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 36, "aliyah": 3, "heb": "זֽוּלָתִ֞י כָּלֵ֤ב בֶּן־יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔נָּה וְלֽוֹ־אֶתֵּ֧ן אֶת־הָאָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ־בָּ֖הּ וּלְבָנָ֑יו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהֹוָֽה׃", "onk": "אֶלָּהֵן כָּלֵב בַּר יְפֻנֶּה הוּא יֶחֱזִנַּהּ וְלֵיהּ אֶתֵּן יָת אַרְעָא דִּי דְרַךְ בַּהּ וְלִבְנוֹהִי חֲלַף דִּי <b>אַשְׁלִים<\/b> בָּתַר דַּחַלְתָּא דַיְיָ:", "onk_en": "Except for Koleiv ben Yefuneh, who will see it, and to whom I will give the land that he trod upon and to his sons, because he perfected himself [<b>was complete<\/b>] in fear of Adonoy.’’", "pj": "אֱלָהֵן כָּלֵב בַּר יְפוּנֶה הוּא יֶחֱמִינָהּ וְלֵיהּ אִיתֵּן יַת אַרְעָא טַבְתָא אַרְעָא דְחֶבְרוֹן דִּמְטַיֵּיל בָּהּ וְלִבְנוֹי חוֹלַף דְּאַשְׁלִים בָּתַר דַּחַלְתָּא דַיְיָ", "pj_en": "except Kaleb bar Jephunneh, who shall see it, and to whom I will give the good land, the land of Hebron through which he walked, and to his children, because he hath followed with integrity the fear of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>אשר דרך בה.<\/b> — חֶבְרוֹן; שֶׁנֶּאֱמַר (במדבר י\"ג) \"וַיָּבֹא עַד חֶבְרוֹן\":", "rashi_en": "אשר דרך בה [AND TO HIM WILL I GIVE THE LAND] THAT HE TROD UPON — viz., Hebron, as it is said, (Numbers 13:22) “And he (Caleb) came to Hebron”."}, {"ch": 1, "v": 37, "aliyah": 3, "heb": "גַּם־בִּי֙ הִתְאַנַּ֣ף יְהֹוָ֔ה בִּגְלַלְכֶ֖ם לֵאמֹ֑ר גַּם־אַתָּ֖ה לֹא־תָבֹ֥א שָֽׁם׃", "onk": "אַף עֲלַי הֲוָה רְגַז מִן קֳדָם יְיָ בְּדִילְכוֹן לְמֵימָר אַף אַתְּ לָא תֵעוֹל תַּמָּן:", "onk_en": "Also at [<b>against<\/b>] me was Adonoy angry because of you, to say, ‘‘You, too, will not arrive there.", "pj": "אוּף עָלַי הֲוָה רְגַז מִן קֳדָם יְיָ מְטוּלְכוֹן לְמֵימָר אוּף אַנְתְּ לָא תֵיעוּל לְתַמָּן", "pj_en": "Against me also was there displeasure before the Lord on your account, saying, Thou too art not to go in thither;", "tj": "", "tj_en": "", "rashi": "<b>התאנף.<\/b> נִתְמַלֵּא רֹגֶז:", "rashi_en": "התאנף means HE WAS FILLED WITH ANGER."}, {"ch": 1, "v": 38, "aliyah": 3, "heb": "יְהוֹשֻׁ֤עַ בִּן־נוּן֙ הָעֹמֵ֣ד לְפָנֶ֔יךָ ה֖וּא יָ֣בֹא שָׁ֑מָּה אֹת֣וֹ חַזֵּ֔ק כִּי־ה֖וּא יַנְחִלֶ֥נָּה אֶת־יִשְׂרָאֵֽל׃", "onk": "יְהוֹשֻׁעַ בַּר נוּן דְּקָאֵם קֳדָמָךְ הוּא יֵעוֹל תַּמָּן יָתֵיהּ תַּקֵּף אֲרֵי הוּא יַחְסְנִנַּהּ לְיִשְׂרָאֵל:", "onk_en": "Yehoshua son of Nun, who attends you, he will arrive there. Encourage him, for he will apportion it to Yisroel.", "pj": "יְהוֹשֻׁעַ בַּר נוּן דִּמְשַׁמֵּשׁ בְּבֵית אוּלְפָנָךְ הוּא יֵיעוֹל לְתַמָּן יָתֵיהּ תַּקִּיף אֲרוּם הוּא יַחְסְנִינָהּ יַת יִשְרָאֵל", "pj_en": "Jehoshua bar Nun, who ministereth in thy house of instruction, he is to go in thither: strengthen him, for he is to make Israel possess it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 39, "aliyah": 4, "heb": "וְטַפְּכֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָבַ֣ז יִהְיֶ֗ה וּ֠בְנֵיכֶ֠ם אֲשֶׁ֨ר לֹא־יָדְע֤וּ הַיּוֹם֙ ט֣וֹב וָרָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּה וְלָהֶ֣ם אֶתְּנֶ֔נָּה וְהֵ֖ם יִירָשֽׁוּהָ׃", "onk": "וְטַפְלְכוֹן דִּי אֲמַרְתּוּן לְבִזָּא יְהוֹן וּבְנֵיכוֹן דִּי לָא יְדָעוּ יוֹמָא דֵין טַב וּבִישׁ אִנּוּן יַעֲלוּן לְתַמָּן וּלְהוֹן אֶתְּנִנַּהּ וְאִנּוּן יֵירְתֻנַּהּ:", "onk_en": "As to your infants, about whom you said, ‘They will become spoils,’ and your children who cannot distinguish today good from evil, they will arrive there; and to them will I give it and they will inherit it.", "pj": "וְטַפְלְכוֹן דַּאֲמַרְתּוּן לַעֲדִי יְהוֹן וּבְנֵיכוֹן דְּלָא יָדְעִין יוֹמָא דֵין בֵּין טַב לְבִישׁ הִינוּן יַעֲלוּן לְתַמָּן וּלְהוֹן אֶתְּנִינָהּ וְהִינוּן יֵירְתוּנָהּ", "pj_en": "But your little ones, of whom you said, They will be for prey, and your children, who as yet know not between good and evil, they shall go in thither: I will give it to them, and they shall possess it for an inheritance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 40, "aliyah": 4, "heb": "וְאַתֶּ֖ם פְּנ֣וּ לָכֶ֑ם וּסְע֥וּ הַמִּדְבָּ֖רָה דֶּ֥רֶךְ יַם־סֽוּף׃", "onk": "וְאַתּוּן אִתְפְּנִיּוּ לְכוֹן וְטוּלוּ לְמַדְבְּרָא אֹרַח יַמָּא דְסוּף:", "onk_en": "As for you, turn yourselves [around], and travel into the wilderness by the Yam Suf road.’’", "pj": "וְאַתּוּן אִתְפְּנִיוּ לְכוֹן וְטוּלוּ לְמַדְבְּרָא אוֹרַח יַמָא דְסוּף", "pj_en": "As for you, turn, and go (back) into the wilderness by the way of the Weedy Sea.", "tj": "", "tj_en": "", "rashi": "<b>פנו לכם.<\/b> אָמַרְתִּי לְהַעֲבִיר אֶתְכֶם דֶּרֶךְ רֹחַב אֶרֶץ אֱדוֹם לְצַד צָפוֹן לִכָּנֵס לָאָרֶץ, קִלְקַלְתֶּם וּגְרַמְתֶּם לָכֶם עִכּוּב:<br><br><b>פנו לכם.<\/b> לַאֲחוֹרֵיכֶם וְתֵלְכוּ בַּמִּדְבָּר לְצַד יַם סוּף – שֶׁהַמִּדְבָּר שֶׁהָיוּ מְהַלְּכִים בּוֹ לִדְרוֹמוֹ שֶׁל הַר שֵׂעִיר הָיָה מַפְסִיק בֵּין יַם סוּף לְהַר שֵׂעִיר – עַתָּה הִמָּשְׁכוּ לְצַד הַיָּם וּתְסַבְּבוּ אֶת הַר שֵׂעִיר כָּל דְּרוֹמוֹ מִן הַמַּעֲרָב לַמִּזְרָח:", "rashi_en": "פנו לכם TURN YE — I thought to let you pass across the breadth of the land of Edom in a northerly direction and thus enter the Land (cf. Rashi on Numbers 34:3); you, however, became degenerate and caused this delay for yourselves.<br><br>פנו לכם TURN YE backwards, and proceed through the wilderness towards the Red Sea; — for the wilderness through which they were travelling was to the south of Mount Seir separating the Red Sea from Mount Seir. — Now proceed in the direction of the Sea and travel round Mount Seir along the whole of its south side from the west to the east."}, {"ch": 1, "v": 41, "aliyah": 4, "heb": "וַֽתַּעֲנ֣וּ&thinsp;<b>׀<\/b> וַתֹּאמְר֣וּ אֵלַ֗י חָטָ֘אנוּ֮ לַיהֹוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְנִלְחַ֔מְנוּ כְּכֹ֥ל אֲשֶׁר־צִוָּ֖נוּ יְהֹוָ֣ה אֱלֹהֵ֑ינוּ וַֽתַּחְגְּר֗וּ אִ֚ישׁ אֶת־כְּלֵ֣י מִלְחַמְתּ֔וֹ וַתָּהִ֖ינוּ לַעֲלֹ֥ת הָהָֽרָה׃", "onk": "וַאֲתֶבְתּוּן וַאֲמַרְתּוּן לִי חַבְנָא <b>קֳדָם<\/b> יְיָ אֲנַחְנָא נִסַּק וּנְגִיחַ בֵּיהּ קְרָב כְּכֹל דִּי פַקְּדָנָא יְיָ אֱלָהָנָא וְזָרֶזְתּוּן גְּבַר יָת מָנֵי <b>קְרָבֵיהּ וְשָׁרֵיתוּן<\/b> לְמִסַּק לְטוּרָא:", "onk_en": "You replied and said to me, ‘‘We have sinned to [<b>before<\/b>] Adonoy. We will go up and wage war in [fulfillment of] all that Adonoy, our God commanded us.’’ And each of you girded his weapons [<b>of war<\/b>], and you got ready [<b>began<\/b>] to go up the mountain.", "pj": "וַאֲתֵיבְתּוּן וַאֲמַרְתּוּן לִי חַבְנָא קֳדָם יְיָ אֲנַחְנָא נִיסַק וְנָגִיחַ קְרָב כְּכָל דְּפַקְדָנָא יְיָ אֱלָהָנָא וַאֲסַרְתּוּן גְּבַר יַת מָאנֵי זַיְינֵיהּ וְשָׁרֵיתוּן לְמֵיסוֹק לְטַוְורָא", "pj_en": "Then answered you, and said to me, We have sinned before the Lord; we will go up and fight according to all that the Lord our God commanded us. And you girded on every man his arms, and began to ascend the mountain.", "tj": "", "tj_en": "", "rashi": "<b>ותהינו.<\/b> לְשׁוֹן \"הִנֶּנּוּ וְעָלִינוּ אֶל הַמָּקוֹם\" (במדבר י\"ד), זֶה הַלָּשׁוֹן שֶׁאֲמַרְתֶּם לְשׁוֹן \"הֵן\", כְּלוֹמַר נִזְדַּמַּנְתֶּם:", "rashi_en": "ותהינו — This is an expression derived from the word הננו in (Numbers 14:40) \"Here we are (הננו) and we will go up to the place”. This is the expression which you uttered — the expression הן, \"yes”. The word, therefore, means as much as: you expressed your readiness to go up into the mountain."}, {"ch": 1, "v": 42, "aliyah": 4, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֵלַ֗י אֱמֹ֤ר לָהֶם֙ לֹ֤א תַֽעֲלוּ֙ וְלֹא־תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖נִּי בְּקִרְבְּכֶ֑ם וְלֹא֙ תִּנָּ֣גְפ֔וּ לִפְנֵ֖י אֹיְבֵיכֶֽם׃", "onk": "וַאֲמַר יְיָ לִי אֱמַר לְהוֹן לָא תִסְּקוּן וְלָא תְגִיחוּן קְרָב אֲרֵי לֵית <b>שְׁכִנְתִּי שָׁרְיָא<\/b> בֵינֵיכוֹן וְלָא תִּתָּבְרוּן קֳדָם בַּעֲלֵי דְבָבֵיכוֹן:", "onk_en": "Adonoy said to me, ‘‘Say to them, ‘Do not go up and do not wage war, for I am not [<b>My Shechinah does not dwell<\/b>] in your midst; so that you will not be shattered by your enemies.’’’", "pj": "וַאֲמַר יְיָ לִי אֵימַר לְהוֹן לָא תִסְקוּן וְלָא תְסַדְּרוּן סִדְרֵי קְרָב אֲרוּם לֵית שְׁכִינְתִּי מְהַלְכָא בֵּינֵיכוֹן וְלָא תִיתְבְּרוּן קֳדָם בַּעֲלֵי דְבָבֵיכוֹן", "pj_en": "But the Lord said to me, Say to them, Go not up, nor prepare for battle, for My Shekinah goeth not among you; that you be not crushed before your enemies.", "tj": "", "tj_en": "", "rashi": "<b>לא תעלו.<\/b> לֹא עֲלִיָּה תְהֵא לָכֶם אֶלָּא יְרִידָה:", "rashi_en": "לא תעלו “GO NOT UP” — There will be no “ascent” for you, but only a descent (defeat) (cf. Rashi on Numbers 16:12 and Numbers Rabbah 17:3)."}, {"ch": 1, "v": 43, "aliyah": 4, "heb": "וָאֲדַבֵּ֥ר אֲלֵיכֶ֖ם וְלֹ֣א שְׁמַעְתֶּ֑ם וַתַּמְרוּ֙ אֶת־פִּ֣י יְהֹוָ֔ה וַתָּזִ֖דוּ וַתַּעֲל֥וּ הָהָֽרָה׃", "onk": "וּמַלֵּלִית עִמְּכוֹן וְלָא קַבֶּלְתּוּן וְסָרֶבְתּוּן עַל <b>גְּזֵרַת מֵימְרָא<\/b> דַיְיָ וְאַרְשַׁעְתּוּן וּסְלֶקְתּוּן לְטוּרָא:", "onk_en": "I told you, but you did not obey. You defied [<b>the decree of the word of<\/b>] Adonoy, and deliberately went up the hill.", "pj": "וּמַלֵלִית לְכוֹן וְלָא קַבֵּילְתּוּן וְסָרֵיבְתּוּן עַל מֵימְרָא דַיְיָ וְאַרְשַׁעְתּוּן וּסְלִיקְתּוּן לְטַוְורָא", "pj_en": "And I spake with you, but you would not obey but were rebellious against the Word of the Lord, and did wickedly, and went up to the mountain.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 1, "v": 44, "aliyah": 4, "heb": "וַיֵּצֵ֨א הָאֱמֹרִ֜י הַיֹּשֵׁ֨ב בָּהָ֤ר הַהוּא֙ לִקְרַאתְכֶ֔ם וַיִּרְדְּפ֣וּ אֶתְכֶ֔ם כַּאֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַדְּבֹרִ֑ים וַֽיַּכְּת֥וּ אֶתְכֶ֛ם בְּשֵׂעִ֖יר עַד־חׇרְמָֽה׃", "onk": "וּנְפַק אֱמֹרָאָה דְּיָתֵב בְּטוּרָא הַהוּא לְקַדָּמוּתְכוֹן וּרְדָפוּ יָתְכוֹן כְּמָא <b>דִי נַתְּזָן<\/b> דַּבַּרְיָתָא וּטְרָדוּ יָתְכוֹן בְּשֵׂעִיר עַד חָרְמָה:", "onk_en": "The Emorites came out—those who live in those hills—toward you, and chased you as the bees do [<b>are dispersed<\/b>]; and they crushed you in Se’ir till Chorma.", "pj": "וּנְפַק אֱמוֹרָאָה דְיָתִיב בְּטַוְורָא הַהוּא לִקְדָמוּתְכוֹן וּרְדָפוּ יַתְכוֹן הֵיכְמָא דְחַדִדַן וְחַיְישַׁן אוּרְעֲיָיתָא וּמְחוֹ יַתְכוֹן בְּגַבְלָא עַד חָרְמָה", "pj_en": "And the Amoraah who dwelt in that mountain came out to meet you, and pursued you, as they drive away and destroy hornets, and smote you from Gebal unto Hormah.", "tj": "וּרְדָפוּ יַתְכוֹן הֵיכְמָא דְרָדִיפוּ דְבוּרַיָיתָא וּקְטִילוּ יַתְכוֹן בְּגַבְלָא עַד שֵׁצָיוּ:", "tj_en": "And they chased you as bees are chased, and slew you in Gebal unto destruction.", "rashi": "<b>כאשר תעשינה הדברים.<\/b> מַה הַדְּבוֹרָה הַזֹּאת כְּשֶׁהִיא מַכָּה אֶת הָאָדָם מִיָּד מֵתָה, אַף הֵם כְּשֶׁהָיוּ נוֹגְעִים בָּכֶם מִיָּד מֵתִים:", "rashi_en": "כאשר תעשינה הדברים [AND THEY PURSUED YOU] AS BEES DO — Just as a bee when it stings a person it dies immediately, similarly they (the Amorites): when they attacked you they died immediately (Numbers Rabbah 17:3)."}, {"ch": 1, "v": 45, "aliyah": 4, "heb": "וַתָּשֻׁ֥בוּ וַתִּבְכּ֖וּ לִפְנֵ֣י יְהֹוָ֑ה וְלֹֽא־שָׁמַ֤ע יְהֹוָה֙ בְּקֹ֣לְכֶ֔ם וְלֹ֥א הֶאֱזִ֖ין אֲלֵיכֶֽם׃", "onk": "וְתַבְתּוּן וּבְכִיתוּן קֳדָם יְיָ וְלָא קַבִּיל יְיָ צְלוֹתְכוֹן וְלָא <b>אַצֵּית לְמִלֵּיכוֹן<\/b>:", "onk_en": "You returned and wept before Adonoy, but Adonoy did not accept your prayer; He paid no attention to you [<b>did not hearken to your words<\/b>].", "pj": "וְתֵיבְתּוּן וּבְכִיתוּן קֳדָם יְיָ וְלָא קַבֵּיל יְיָ צְלוּתְכוֹן וְלָא אָצִית לְמִילֵיכוֹן", "pj_en": "And you returned, and wept before the Lord: but the Lord would not receive your prayers, nor hearken to your words.", "tj": "", "tj_en": "", "rashi": "<b>ולא שמע ה' בקלכם.<\/b> כִּבְיָכוֹל עֲשִׂיתֶם מִדַּת רַחֲמָיו כְּאִלּוּ אַכְזָרִי:", "rashi_en": "ולא שמע ה' בקלכם BUT THE LORD WOULD NOT HEAR YOUR VOICE — If it is at all possible to say so of God, you made His attribute of mercy as though it were cruel (Numbers Rabbah 17:3)."}, {"ch": 1, "v": 46, "aliyah": 4, "heb": "וַתֵּשְׁב֥וּ בְקָדֵ֖שׁ יָמִ֣ים רַבִּ֑ים כַּיָּמִ֖ים אֲשֶׁ֥ר יְשַׁבְתֶּֽם׃", "onk": "וִיתֶבְתּוּן <b>בִּרְקָם<\/b> יוֹמִין סַגִּיאִין כְּיוֹמַיָּא דִּי יְתֶבְתּוּן:", "onk_en": "You lived in Kodeish [<b>Rekam<\/b>] many years, like the years you lived [elsewhere].", "pj": "וִיתֵיבְתּוּן בִּרְקַם יוֹמִין סַגִּיאִין כְּיוֹמַיָא דִיתֵיבְתּוּן", "pj_en": "So you abode in Rekem many days, according to the days that you abode.", "tj": "", "tj_en": "", "rashi": "<b>ותשבו בקדש ימים רבים.<\/b> י\"ט שָׁנָה, שֶׁנֶּאֱמַר <b>כימים אשר ישבתם<\/b> בִּשְׁאָר הַמַּסָּעוֹת, וְהֵם הָיוּ ל\"ח שָׁנָה, י\"ט מֵהֶם עָשׂוּ בְקָדֵשׁ וי\"ט שָׁנָה הוֹלְכִים וּמְטֹרָפִים וְחָזְרוּ לְקָדֵשׁ, כְּמוֹ שֶׁנֶּאֱמַר (במדבר ל\"ב) \"וַיְנִיעֵם בַּמִּדְבָּר\"; כָּךְ מָצָאתִי בְּסֵדֶר עוֹלָם:", "rashi_en": "ותשבו בקדש ימים רבים SO YE ABODE IN KADESH MANY DAYS — viz., nineteen years, as it is said here כימים אשר ישבתם, ACCORDING TO THE DAYS THAT YE ABODE, i.e. abode at all the other stations. They (the total years) were thirtyeight years; nineteen of them they spent at Kadesh, and nineteen years they went moving about aimlessly, and then they returned to Kadesh, as it is said, (Numbers 32:13) “And he made them move about in the wilderness”. — Thus have I found in Seder Olam 8."}, {"ch": 2, "v": 1, "aliyah": 4, "heb": "וַנֵּ֜פֶן וַנִּסַּ֤ע הַמִּדְבָּ֙רָה֙ דֶּ֣רֶךְ יַם־ס֔וּף כַּאֲשֶׁ֛ר דִּבֶּ֥ר יְהֹוָ֖ה אֵלָ֑י וַנָּ֥סׇב אֶת־הַר־שֵׂעִ֖יר יָמִ֥ים רַבִּֽים׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִתְפְּנֵינָא וּנְטַלְנָא לְמַדְבְּרָא אֹרַח יַמָּא דְסוּף כְּמָא דִי מַלִּיל יְיָ עִמִּי וְאַקֵּפְנָא יָת טוּרָא דְשֵׂעִיר יוֹמִין סַגִּיאִין:", "onk_en": "We turned and traveled into the wilderness by way of the Reed Sea [route] as Adonoy had told me, and we circled Mount Seir a long time.", "pj": "וְאִתְפְּנִינָא וּנְטָלְנָא לְמַדְבְּרָא אוֹרַח יַמָא דְסוּף הֵיכְמָא דְמַלֵּיל יְיָ לִי וַאֲקֵיפְנָא יַת טַוְורָא דְגַבְלָא יוֹמִין סַגִּיאִין", "pj_en": "And turning we journeyed into the wilderness, by the way of the Sea of Suph, as the Lord had bidden me, and we compassed Mount Gebal many days.", "tj": "", "tj_en": "", "rashi": "<b>ונפן ונסע המדברה.<\/b> אִלּוּ לֹא חָטְאוּ הָיוּ עוֹבְרִים דֶּרֶךְ הַר שֵׂעִיר לִכָּנֵס לָאָרֶץ מִן דְּרוֹמוֹ לִצְפוֹנוֹ, וּבִשְׁבִיל שֶׁקִּלְקְלוּ הָפְכוּ לְצַד הַמִּדְבָּר, שֶׁהוּא בֵין יַם סוּף לִדְרוֹמוֹ שֶׁל הַר שֵׂעִיר, וְהָלְכוּ אֵצֶל דְּרוֹמוֹ מִן הַמַּעֲרָב לַמִּזְרָח <b>דרך ים סוף.<\/b> דֶּרֶךְ יְצִיאָתָן מִמִּצְרַיִם שֶׁהוּא בְּמִקְצוֹעַ דְּרוֹמִית מַעֲרָבִית; מִשָּׁם הָיוּ הוֹלְכִים לְצַד הַמִּזְרָח:<br><br><b>ונסב את הר שעיר.<\/b> כָּל דְּרוֹמוֹ עַד אֶרֶץ מוֹאָב:", "rashi_en": "ונפן ונסע המדברה THEN WE TURNED AND JOURNEYED INTO THE WILDERNESS — If they had not sinned, they would have passed by the way of Mount Seir to enter the Land from its south to its north, but because they became degenerate they had to turn towards the wilderness which is between the Red Sea and the south of Mount Seir, and they proceeded along its southern side from the west to the east, דרך ים סוף BY THE ROUTE FROM THE RED SEA — i.e. by the route which they had taken on leaving Egypt which is at the south-west corner. From there (where they were at that moment) they went towards the east.<br><br>ונסב את הר שעיר AND WE COMPASSED MOUNT SEIR, the whole of the south side as far as the land of Moab."}, {"ch": 2, "v": 2, "aliyah": 5, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֵלַ֥י לֵאמֹֽר׃", "onk": "וַאֲמַר יְיָ לִי לְמֵימָר:", "onk_en": "Adonoy said to me to say,", "pj": "וַאֲמַר יְיָ לִי לְמֵימָר", "pj_en": "And the Lord spake to me, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 3, "aliyah": 5, "heb": "רַב־לָכֶ֕ם סֹ֖ב אֶת־הָהָ֣ר הַזֶּ֑ה פְּנ֥וּ לָכֶ֖ם צָפֹֽנָה׃", "onk": "סַגִּי לְכוֹן דְּאַקֶּפְתּוּן יָת טוּרָא הָדֵין אִתְפְּנִיּוּ לְכוֹן צִפּוּנָא:", "onk_en": "‘‘Enough of you circling this mountain! Turn yourselves northward.", "pj": "סַגִי לְכוֹן דְּאַקֵיפְתּוּן יַת טוּרָא הָדֵין אִיתְפְּנוּ לְכוֹן לְצִפּוּנָא", "pj_en": "It is enough for you to have dwelt about this mountain: turn you to the north,", "tj": "", "tj_en": "", "rashi": "<b>פנו לכם צפנה.<\/b> סֹבּוּ לָכֶם לְרוּחַ מִזְרָחִית, מִן הַדָּרוֹם לַצָּפוֹן, פְּנֵיכֶם לַצָּפוֹן, נִמְצְאוּ הוֹלְכִים אֶת רוּחַ הַמִּזְרָחִית וְזֶהוּ שֶׁנֶּאֱמַר (שופטים י\"א) \"וַיָבוֹאוּ (וַיָּבֹא) מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב\":", "rashi_en": "פנו לכם צפנה TURN YOU NORTHWARD — Turn you along the eastern side of Moab, from the south to the north, your faces directed to the north. Consequently they were travelling along the east side of Moab, and this is what is meant by (Judges 11:18) “And they came by the east side of the land of Moab”."}, {"ch": 2, "v": 4, "aliyah": 5, "heb": "וְאֶת־הָעָם֮ צַ֣ו לֵאמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּגְבוּל֙ אֲחֵיכֶ֣ם בְּנֵי־עֵשָׂ֔ו הַיֹּשְׁבִ֖ים בְּשֵׂעִ֑יר וְיִֽירְא֣וּ מִכֶּ֔ם וְנִשְׁמַרְתֶּ֖ם מְאֹֽד׃", "onk": "וְיָת עַמָּא פַּקֵּד לְמֵימַר אַתּוּן עָבְרִין בִּתְחוּם אֲחוּכוֹן בְּנֵי עֵשָׂו דְּיָתְבִין בְּשֵׂעִיר וְיִדְחֲלוּן מִנְּכוֹן וְתִסְתַּמְּרוּן לַחֲדָא:", "onk_en": "And command the people as follows, ‘‘You are crossing into the border of your brothers, the descendants of Eisov who live in Seir. They will be afraid of you, so you must be extrememly cautious.", "pj": "וְיַת עַמָּא פַּקֵּיד לְמֵימָר אַתּוּן עָבְרִין בִּתְחוּם אֲחוּכוֹן בְּנוֹי דְעֵשָו דְּיָתְבִין בְּגַבְלָא וִידַחֲלוּן מִנְכוֹן וְתִסְתַּמְרוּן לַחֲדָא", "pj_en": "and command the people, saying, You are to pass by the border of your brethren, the children of Esau, who dwell in Gebala, and they will be afraid of you; be very heedful therefore;", "tj": "", "tj_en": "", "rashi": "<b>ונשמרתם מאד.<\/b> וּמַהוּ הַשְּׁמִירָה? <b>אל תתגרו בם<\/b>:", "rashi_en": "ונשמרתם מאד TAKE YE GOOD HEED TO YOURSELVES — And what is this \"taking heed”? What follows: אל תתגרו בם CONTEND NOT WITH THEM."}, {"ch": 2, "v": 5, "aliyah": 5, "heb": "אַל־תִּתְגָּר֣וּ בָ֔ם כִּ֠י לֹֽא־אֶתֵּ֤ן לָכֶם֙ מֵֽאַרְצָ֔ם עַ֖ד מִדְרַ֣ךְ כַּף־רָ֑גֶל כִּֽי־יְרֻשָּׁ֣ה לְעֵשָׂ֔ו נָתַ֖תִּי אֶת־הַ֥ר שֵׂעִֽיר׃", "onk": "לָא תִתְגָּרוּן בְּהוֹן אֲרֵי לָא אֶתֵּן לְכוֹן מֵאַרְעֲהוֹן עַד מִדְרַךְ פַּרְסַת רִגְלָא אֲרֵי יְרֻתָּא לְעֵשָׂו יְהָבִית יָת טוּרָא דְשֵׂעִיר:", "onk_en": "Do not incite them. For I will not give you of their land as much as a footstep, because for Eisov’s inheritance have I designated Mount Seir.", "pj": "לָא תִיתְגְּרוּן בְּהוֹן אֲרוּם לָא אֶתֵּן לְכוֹן מֵאַרְעַתְהוֹן עַד כְּמִיסַת פַּרְסַת רִיגְלָא אֲרוּם יְרוּתָא לְעֵשָו יְהָבִית יַת טַוְורָא דְגַבְלָא מְטוֹל אִיקָרָא דְעָבַד לַאֲבוֹי", "pj_en": "provoke them not; for of their land I have not given you as much as the sole of the foot; for I have given Mount Gebal an inheritance unto Esau on account of the honour which he did unto his father.", "tj": "", "tj_en": "", "rashi": "<b>עד מדרך כף רגל.<\/b> אֲפִלּוּ מִדְרַךְ כַּף רֶגֶל, כְּלוֹמַר אֲפִלּוּ דְּרִיסַת הָרֶגֶל אֵינִי מַרְשֶׁה לָכֶם לַעֲבֹר בְּאַרְצָם שֶׁלֹּא בִרְשׁוּת. וּמִדְרַשׁ אַגָּדָה עַד שֶׁיָּבֹא יוֹם דְּרִיסַת כַּף רֶגֶל עַל הַר הַזֵּיתִים, שֶׁנֶּאֱמַר (זכריה י\"ד) \"וְעָמְדוּ רַגְלָיו וְגוֹ'\":<br><br><b>ירשה לעשו.<\/b> מֵאַבְרָהָם, עֲשָׂרָה עֲמָמִים נָתַתִּי לוֹ, שִׁבְעָה לָכֶם וְקֵינִי וּקְנִזִּי וְקַדְמוֹנִי הֵן עַמּוֹן וּמוֹאָב וְשֵׂעִיר, אֶחָד מֵהֶם לְעֵשָׂו וְהַשְּׁנַיִם לִבְנֵי לוֹט, בִּשְׂכַר שֶׁהָלַךְ אִתּוֹ לְמִצְרַיִם וְשָׁתַק עַל מַה שֶּׁהָיָה אוֹמֵר עַל אִשְׁתּוֹ אֲחוֹתִי הִיא, עֲשָׂאוֹ כִּבְנוֹ (בראשית רבה נ\"א):", "rashi_en": "עד מדרך כף רגל — This means, Even מדרך כף רגל, as much as to say: even only treading with the feet (a single step). The text means, I do not permit you to pass into their land without their permission. — A Midrashic explanation is: I shall not give you of their land until there come the day of the treading of the sole of foot upon the Mount of Olives (the Messianic period), as it is said, (Zechariah 14:4) \"And his feet shall stand [in that day upon the Mount of Olives etc.]”.<br><br>ירשה לעשו [I HAVE GIVEN MOUNT SEIR] TO ESAU AS AN INHERITANCE from Abraham. The territory of ten clans I gave (promised) him (Abraham); seven of them will be yours (the seven clans of Canaan), and the Kenites, the Kenizzites and the Kadmonites, — who are Ammon, Moab and Seir — one of them already belongs to Esau, and the other two to the children of Lot (cf. Genesis Rabbah 44:23; and Rashi on Genesis 15:19); as a reward because he (Lot) went with him (Abraham) To Egypt, and kept silent about what he said regarding his wife, “She is my sister”, he treated him as his son (and therefore he, through his children Amon and Moab, inherited part of the land promised to him) (cf. Rashi on Genesis 19:29 and Genesis Rabbah 51:6)."}, {"ch": 2, "v": 6, "aliyah": 5, "heb": "אֹ֣כֶל תִּשְׁבְּר֧וּ מֵֽאִתָּ֛ם בַּכֶּ֖סֶף וַאֲכַלְתֶּ֑ם וְגַם־מַ֜יִם תִּכְר֧וּ מֵאִתָּ֛ם בַּכֶּ֖סֶף וּשְׁתִיתֶֽם׃", "onk": "עִבוּרָא תִזְבְּנוּן מִנְּהוֹן בְּכַסְפָּא וְתֵיכְלוּן וְאַף מַיָּא תִּכְרוּן מִנְּהוֹן בְּכַסְפָּא וְתִשְׁתּוּן:", "onk_en": "Food are you to buy from them with money and eat [it]; also water are you to purchase from them with money and drink [it.]", "pj": "עִבּוּרָא תִּזְבּוּן מִנְהוֹן כַּד חַי בְּכַסְפָּא וְתֵיכְלוּן וְאוּף מַיָא תִזְבְּנוּן מִנְהוֹן בְּכַסְפָּא וְתִישְׁתּוּן", "pj_en": "You shall buy fresh provision of them for silver, that you may eat, and water shall you buy with silver, to drink.", "tj": "", "tj_en": "", "rashi": "<b>תכרו.<\/b> לְשׁוֹן מֶקַח, וְכֵן \"אֲשֶׁר כָּרִיתִי לִי\" (בראשית נ'), שֶׁכֵּן בִּכְרַכֵּי הַיָּם קוֹרִין לִמְכִירָה כִּירָה (ראש השנה כ\"ו):", "rashi_en": "תכרו — This is an expression denoting purchase. Similar is (Genesis 50:5; see Rashi thereon), “which I have bought (כריתי) for myself”, for thus in the coast cities do they use for \"trading” the term כירה (Rosh Hashanah 26a)."}, {"ch": 2, "v": 7, "aliyah": 5, "heb": "כִּי֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ בֵּֽרַכְךָ֗ בְּכֹל֙ מַעֲשֵׂ֣ה יָדֶ֔ךָ יָדַ֣ע לֶכְתְּךָ֔ אֶת־הַמִּדְבָּ֥ר הַגָּדֹ֖ל הַזֶּ֑ה זֶ֣ה&thinsp;<b>׀<\/b> אַרְבָּעִ֣ים שָׁנָ֗ה יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ עִמָּ֔ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר׃", "onk": "אֲרֵי יְיָ אֱלָהָךְ בֵּרְכָךְ בְּכָל עֹבַד יְדָךְ <b>סַפֶּק לָךְ צָרְכָּךְ<\/b> בְּמֵהֱכָךְ לְמַדְבְּרָא רַבָּא הָדֵין דְּנַן אַרְבְּעִין שְׁנִין <b>מֵימְרָא<\/b> דַיְיָ אֱלָהָךְ <b>בְּסַעֲדָּךְ<\/b> לָא מְנַעְתָּא מִדָּעַם:", "onk_en": "For Adonoy, your God, has blessed you in all your handiwork; He has been intimately concerned with your [<b>given you sufficient for your needs for<\/b>] traversing this great wilderness. It is now forty years [that] [<b>the word of<\/b>] Adonoy, your God, is accompanying you [<b>has aided you<\/b>]; you have lacked nothing.’’", "pj": "אִזְדַּהֲרוּן דְּלָא תְעִיקוּן לְהוֹן אֲרוּם יְיָ אֱלָהָכוֹן בְּרִיךְ יַתְכוֹן בְּכָל עוֹבְדֵי יְדֵיכוֹן סוּפֵּיק צָרְכֵיכוֹן בְּמֵיהֲכָךְ בְּמַדְבְּרָא רַבָּא הָדֵין דְּנַן אַרְבְּעִין שְׁנִין מֵימְרָא דַיְיָ אֱלָהָכוֹן בְּסַעַדְכוֹן לָא חֲסַרְתּוּן מִדָּעַם", "pj_en": "Be careful that you vex them not: for the Lord your God hath blessed you in all the works of your hands, he hath supplied your wants in thy journeying in the great wilderness; these forty years hath the Word of the Lord your God been your helper; you have not wanted anything.", "tj": "", "tj_en": "", "rashi": "<b>כי ה' אלהיך ברכך.<\/b> לְפִיכָךְ לֹא תִכְפּוּ אֶת טוֹבָתוֹ לְהַרְאוֹת כְּאִלּוּ אַתֶּם עֲנִיִּים, אֶלָּא הַרְאוּ עַצְמְכֶם עֲשִׁירִים:", "rashi_en": "כי ה' אלהיך ברכך FOR THE LORD THY GOD HATH BLESSED THEE — therefore you should not show yourselves ungrateful to Him by behaving as though you were poor, but act as rich people."}, {"ch": 2, "v": 8, "aliyah": 5, "heb": "וַֽנַּעֲבֹ֞ר מֵאֵ֧ת אַחֵ֣ינוּ בְנֵי־עֵשָׂ֗ו הַיֹּֽשְׁבִים֙ בְּשֵׂעִ֔יר מִדֶּ֙רֶךְ֙ הָֽעֲרָבָ֔ה מֵאֵילַ֖ת וּמֵעֶצְיֹ֣ן גָּ֑בֶר&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וַנֵּ֙פֶן֙ וַֽנַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב׃", "onk": "וַעֲבַרְנָא מִקֳּדָם אֲחוּנָא בְנֵי עֵשָׂו דְּיָתְבִין בְּשֵׂעִיר מֵאֹרַח מֵישְׁרָא מֵאֵילַת וּמֵעֶצְיוֹן גָּבֶר וְאִתְפְּנֵינָא וַעֲבַרְנָא אֹרַח מַדְבְּרָא דְמוֹאָב:", "onk_en": "We passed over from our brothers, the descendants of Eisov, who live in Seir, from the Arava road, from Eilas and from Etzyon-Gover. We turned and passed over by way of the wilderness of Moav.", "pj": "וְעָבַרְנָא מִלְוַת אָחָנָא בְּנֵי עֵשָו דְּיַתְבוּן בְּגַבְלָא מֵאֵילַת וּמִכְּרַךְ תַּרְנְגוֹלָא וְאִתְפְּנִינָא וְעָבַרְנָא אוֹרַח מַדְבְּרָא דְמוֹאָב", "pj_en": "So we passed by our brethren the sons of Esau, who dwell in Gebala, from Elath and the fortress of Tarnegola and turned and went by the way of the wilderness of Moab", "tj": "וְעָבַרְנוּ מִלְוַת אַחֵינוּ בְּנֵי עֵשָו אִלֵין דְשַׁרְיָין בְּגַבְלָא מִן אוֹרַח מֵישְׁרָא מִן אֵלַת וּמִן כְּרַךְ תַּרְנְגוֹלָא וְכַוְונָן וַעֲבַרְנָן אוֹרַח מַדְבְּרָא דְמוֹאָב:", "tj_en": "So we passed by our brethren the sons of Esau, who dwell in Gebala, by the way of the plain from Elath and from the fortress of Tarnegola, and we turned and went by the way of the wilderness of Moab.", "rashi": "<b>ונפן ונעבר.<\/b> לְצַד צָפוֹן הָפַכְנוּ פָנִים לַהֲלֹךְ רוּחַ מִזְרָחִית:", "rashi_en": "ונפן ונעבר AND WE TURNED AND PASSED, towards the north; we turned our faces to proceed along the eastern side (see Rashi on v. 3)."}, {"ch": 2, "v": 9, "aliyah": 5, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֵלַ֗י אַל־תָּ֙צַר֙ אֶת־מוֹאָ֔ב וְאַל־תִּתְגָּ֥ר בָּ֖ם מִלְחָמָ֑ה כִּ֠י לֹֽא־אֶתֵּ֨ן לְךָ֤ מֵֽאַרְצוֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִבְנֵי־ל֔וֹט נָתַ֥תִּי אֶת־עָ֖ר יְרֻשָּֽׁה׃", "onk": "וַאֲמַר יְיָ לִי לָא תְצוּר עַל מוֹאָבָאֵי וְלָא תִתְגָּרֵי <b>לְמֶעְבַּד עִמְּהוֹן<\/b> קְרָב אֲרֵי לָא אֶתֵּן לָךְ מֵאַרְעֵיהּ יְרֻתָּא אֲרֵי לִבְנֵי לוֹט יְהָבִית יָת <b>לְחָיָת<\/b> יְרֻתָּא:", "onk_en": "Adonoy said to me, ‘‘Do not besiege Moav and do not intimidate them with [<b>to make<\/b>] war [<b>with them<\/b>]. For I will not give you [any] of his land as inheritance, for to Lot’s descendants have I given Or [<b>Lechoyas<\/b>] as inheritance.", "pj": "וַאֲמַר יְיָ לִי לְמֵימָר לָא תָעִיק יַת מוֹאֲבָאֵי וְלָא תְסַדֵּר לְקִבְלֵיהוֹן סִדְרֵי קְרָבָא אֲרוּם לָא אֶתֵּן לְכוֹן מֵאַרְעֲהוֹן יְרוּתָא אֲרוּם לִבְנֵי דְלוֹט יְהָבִית יַת לְחָיַית יְרוּתָא", "pj_en": "And the Lord spake to me, saying: Thou shalt not aggrieve the Moabaee, nor make war against them; for I have not given you their land to inherit, because I have given Lachaiath for a possession to the children of Lot.", "tj": "", "tj_en": "", "rashi": "<b>ואל תתגר בם וגו'.<\/b> לֹא אָסַר לָהֶם עַל מוֹאָב אֶלָּא מִלְחָמָה, אֲבָל מְיָרְאִים הָיוּ אוֹתָם, וְנִרְאִים לָהֶם כְּשֵׁהֶם מְזֻיָּנִים, לְפִיכָךְ כְּתִיב (במדבר כ\"ב) \"וַיָּגָר מוֹאָב מִפְּנֵי הָעָם\", שֶׁהָיוּ שׁוֹלְלִים וּבוֹזְזִים אוֹתָם; אֲבָל בִּבְנֵי עַמּוֹן נֶאֱמַר (פסוק י\"ט) \"וְאַל תִּתְגָּר בָּם\" – שׁוּם גֵּרוּי, בִּשְׂכַר צְנִיעוּת אִמָּם, שֶׁלֹּא פִרְסְמָה עַל אָבִיהָ כְּמוֹ שֶׁעָשְׂתָה הַבְּכִירָה שֶׁקָּרְאָה שֵׁם בְּנָהּ מוֹאָב (בבא קמא ל\"ח):<br><br><b>ער.<\/b> שֵׁם הַמְּדִינָה:", "rashi_en": "ואל תתגר בם וגו׳ AND DO NOT CONTEND WITH THEM [IN WAR] — As regards Moab He forbade them (the Israelites) only war against them, but they may frighten them, appearing before them when equipped for war; therefore it is written, (Numbers 22:3) \"And Moab was afraid because of the people\", because they took plunder and loot from them. But about the children of Ammon it is said, (v. 19) “Do not contend with them\" — no provocation of any kind, — as a reward for the modesty shown by their ancestress, Lot's younger daughter, who did not publicly divulge regarding her father's conduct, as his elder daughter did, who called her son's name “Moab\" (i.e. born of the father) (Bava Kamma 38b; see Rashi on Genesis 19:37).<br><br>ער is the name of the district."}, {"ch": 2, "v": 10, "aliyah": 5, "heb": "הָאֵמִ֥ים לְפָנִ֖ים יָ֣שְׁבוּ בָ֑הּ עַ֣ם גָּד֥וֹל וְרַ֛ב וָרָ֖ם כָּעֲנָקִֽים׃", "onk": "אֵימְתָנֵי מִלְּקַדְמִין יְתִיבוּ בַהּ עַם רַב וְסַגִּי וְתַקִּיף <b>כְּגִבָּרַיָּא<\/b>:", "onk_en": "The Eimim originally lived there—a people great and numerous and powerful like the Anokim [<b>giants<\/b>].", "pj": "אֵימְתָנַיָא מִן לְקַדְמִין יָתִיבוּ בָּהּ עַם רַב וְסַגִי וְחָסִין הֵי כְּגִנְבָּרַיָא", "pj_en": "The Emthanaia dwelt in it of old, a people great and many, and mighty as the giants.", "tj": "", "tj_en": "", "rashi": "<b>האמים לפנים וגו'.<\/b> אַתָּה סָבוּר שֶׁזּוֹ אֶרֶץ רְפָאִים שֶׁנָּתַתִּי לוֹ לְאַבְרָהָם, לְפִי שֶׁהָאֵמִים שֶׁהֵם רְפָאִים יָשְׁבוּ בָהּ לְפָנִים, אֲבָל לֹא זוֹ הִיא, כִּי אוֹתָן רְפָאִים הוֹרַשְׁתִּי מִפְּנֵי בְנֵי לוֹט וְהוֹשַׁבְתִּים תַּחְתָּם:", "rashi_en": "האמים לפנים וגו׳ THE EMIM [ABODE THERE] FORMERLY — You might think that this is the land of the Rephaim which I gave (promised) to Abraham (Genesis 15:20), because the Emim who are Rephaim, dwelt there formerly (and they are one of the seven clans whose land you were to possess), but this is not that land, because those Rephaim I drove out from before the children of Lot and settled these in their stead (cf. Rashi on 3:13)."}, {"ch": 2, "v": 11, "aliyah": 5, "heb": "רְפָאִ֛ים יֵחָשְׁב֥וּ אַף־הֵ֖ם כָּעֲנָקִ֑ים וְהַמֹּ֣אָבִ֔ים יִקְרְא֥וּ לָהֶ֖ם אֵמִֽים׃", "onk": "<b>גִּבָּרָאֵי<\/b> מִתְחַשְּׁבִין אַף אִנּוּן <b>כְּגִבָּרָאֵי<\/b> וּמוֹאָבָאֵי יִקְרַן לְהוֹן אֵימְתָנֵי:", "onk_en": "They, too, were considered Refaim [<b>giants<\/b>] like the Anokim [<b>giants<\/b>]; the Moabites called them Eimim.", "pj": "גִּבָּרַיָא דְיַתְבוּן בְּמֵישַׁר גִּיוֹנְבְּרֵי מִתְחַשְׁבִין אוּף הִינוּן הֵי כְּגִנְבְּרַיָא דְאִתְמְחִיוּ בְּטוּבְעָנָא וּמוֹאֲבָאֵי קְרַן לְהוֹן אֵימְתָנֵי", "pj_en": "The giants who dwelt in the plain of Geyonbere were also reputed as the giants who perished in the Flood; but the Moabites called them Emethanee.", "tj": "", "tj_en": "", "rashi": "<b>רפאים יחשבו וגו'.<\/b> רְפָאִים הָיוּ נֶחֱשָׁבִין אוֹתָם אֵמִים, כָּעֲנָקִים הַנִּקְרָאִים רְפָאִים, עַל שֵׁם שֶׁכָּל הָרוֹאֶה אוֹתָם יָדָיו מִתְרַפּוֹת (בראשית רבה כ\"ו):<br><br><b>אמים.<\/b> עַל שֵׁם שֶׁאֵימָתָם מֻטֶּלֶת עַל הַבְּרִיּוֹת (שם), וְכֵן בְּשֵׂעִיר יָשְׁבוּ הַחֹרִים וּנְתַתִּים לִבְנֵי עֵשָׂו:", "rashi_en": "רפאים יחשבו וגו׳ THEY [ALSO] ARE ACCOUNTED REPHAIM, [AS THE ANAKIM] — As Rephaim are those Emim accounted, even as the Anakim — who are also termed Rephaim because the hands of everyone who beheld them became weak (רפה) (cf. Genesis Rabbah 26:7).<br><br>אמים — so called because the dread (אימה) of them lay upon the people. — So, too, (v. 12) the Horim dwelt formerly in Seir and I gave them over unto the children of Esau. (Genesis Rabbah 26:7)"}, {"ch": 2, "v": 12, "aliyah": 5, "heb": "וּבְשֵׂעִ֞יר יָשְׁב֣וּ הַחֹרִים֮ לְפָנִים֒ וּבְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּם וַיַּשְׁמִידוּם֙ מִפְּנֵיהֶ֔ם וַיֵּשְׁב֖וּ תַּחְתָּ֑ם כַּאֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְאֶ֙רֶץ֙ יְרֻשָּׁת֔וֹ אֲשֶׁר־נָתַ֥ן יְהֹוָ֖ה לָהֶֽם׃", "onk": "וּבְשֵׂעִיר יְתִיבוּ חֹרָאֵי מִלְּקַדְמִין וּבְנֵי עֵשָׂו תָּרֵכֻנּוּן וְשֵׁצָיֻנּוּן מִקָּדָמֵיהוֹן וִיתִיבוּ <b>בְּאַתְרֵיהוֹן<\/b> כְּמָא דִי עֲבַד יִשְׂרָאֵל לְאַרְעָא יְרֻתָּתֵיהּ דִּיהַב יְיָ לְהוֹן:", "onk_en": "And in Seir lived the Chorim originally, but the descendants of Eisov inherited them and drove them out [to make room] for themselves and settled in their stead [<b>places<\/b>], as Yisroel will have done to the land of its inheritance that Adonoy has given them.", "pj": "וּבְגַבְלָא יָתִיבוּ גְנוּסַיָא מִן לְקַדְמִין וּבְנֵי עֵשָו תְּרָכִינוּן וְשֵׁיצֵיאוּנוּן מִן קֳדָמֵיהוֹן וְיָתִיבוּ בְּאַתְרֵיהוֹן הֵיכְמָא דְעָבַד יִשְרָאֵל לְאַרַע יְרוּתְתֵיהּ דִּיהַב יְיָ לְהוֹן", "pj_en": "And in Gebala dwelt the Genosaia in old times, and the Beni Esau drave them out and destroyed them, and dwelt in their place; as did Israel in the land of their inheritance, which the Lord gave to them.", "tj": "", "tj_en": "", "rashi": "<b>יירשום.<\/b> לָשׁוֹן הוֹוֶה, כְּלוֹמַר נָתַתִּי בָהֶם כֹּחַ שֶׁהָיוּ מוֹרִישִׁים אוֹתָם וְהוֹלְכִים:", "rashi_en": "יירשום — This is a present tense form of the verb; it is as much as to say, I gave them power that they might go on driving them out continuously."}, {"ch": 2, "v": 13, "aliyah": 5, "heb": "עַתָּ֗ה קֻ֛מוּ וְעִבְר֥וּ לָכֶ֖ם אֶת־נַ֣חַל זָ֑רֶד וַֽנַּעֲבֹ֖ר אֶת־נַ֥חַל זָֽרֶד׃", "onk": "כְּעַן קוּמוּ וְעִבָרוּ לְכוֹן יָת נַחֲלָא דְזָרֶד וַעֲבַרְנָא יָת נַחֲלָא דְזָרֶד:", "onk_en": "Now, arise and cross for yourselves Wadi Zered.’’ And we crossed Wadi Zered.", "pj": "כְּדוֹן קוּמוּ וְעִיבְרוּ לְכוֹן יַת נַחַל טַרְוַויָא וְעָבַרְנָא יַת נַחַל טַרְוַויָא", "pj_en": "Now arise, and pass over the stream of Tarvaja. And we crossed the stream of Tarvaja.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 14, "aliyah": 5, "heb": "וְהַיָּמִ֞ים אֲשֶׁר־הָלַ֣כְנוּ&thinsp;<b>׀<\/b> מִקָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר־עָבַ֙רְנוּ֙ אֶת־נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּשְׁמֹנֶ֖ה שָׁנָ֑ה עַד־תֹּ֨ם כׇּל־הַדּ֜וֹר אַנְשֵׁ֤י הַמִּלְחָמָה֙ מִקֶּ֣רֶב הַֽמַּחֲנֶ֔ה כַּאֲשֶׁ֛ר נִשְׁבַּ֥ע יְהֹוָ֖ה לָהֶֽם׃", "onk": "וְיוֹמַיָּא דִּי הַלֶּכְנָא <b>מֵרְקַם גֵּיאָה<\/b> עַד דִּי עֲבַרְנָא יָת נַחֲלָא דְזֶרֶד תְּלָתִין וְתַמְנֵי שְׁנִין עַד דְּסַף כָּל דָּרָא גֻּבְרֵי מְגִיחֵי קְרָבָא מִגּוֹ מַשְׁרִיתָא כְּמָא דִי קַיִּים יְיָ לְהוֹן:", "onk_en": "The time that [it took] us to go from Kadeish Barnei’a [<b>Rekam Geyah<\/b>] until we crossed Wadi Zered was thirty-eight years, until the end of the entire generation, the men of war, from within the camp, as Adonoy had sworn about them.", "pj": "וְיוֹמַיָא דְהַלִיכְנָא מִן רְקַם גֵּיעָה עַד דְּעָבַרְנָא יַת נַחַל טַרְוַויָא תְּלָתִין וְתַמְנֵי שְׁנִין עַד דְּסַף כָּל דָּרָא גַבְרֵי מַגִּיחֵי קְרָבָא מִגּוֹ מַשְׁרִיתָא הֵיכְמָא דְקַיֵּים יְיָ לְהוֹן", "pj_en": "And the days in which (from the time) we came from Rekem Giah till we crossed the stream of Tarvaja, were thirty and eight years, until all the generation of the men of war were wasted out from the camp, as the Lord had sworn to them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 15, "aliyah": 5, "heb": "וְגַ֤ם יַד־יְהֹוָה֙ הָ֣יְתָה בָּ֔ם לְהֻמָּ֖ם מִקֶּ֣רֶב הַֽמַּחֲנֶ֑ה עַ֖ד תֻּמָּֽם׃", "onk": "וְאַף מָחָא <b>מִן קֳדָם<\/b> יְיָ הֲוַת בְּהוֹן <b>לְשֵׁצָיוּתְהוֹן<\/b> מִגּוֹ מַשְׁרִיתָא עַד דִּשְׁלִימוּ:", "onk_en": "[<b>From before<\/b>] Adonoy’s plague, too, attacked them to rout [<b>destroy<\/b>] them from within the camp, until their end.", "pj": "וְאוּף מְחָא מִן קֳדָם יְיָ אִתְגָרִית בְּהוֹן לְמִשֵׁצְיֵיהוֹן מִגּוֹ מַשְׁרִיתָא עַד דִּי פְּסָקוּ", "pj_en": "But a plague also from the Lord had scourged them to consume them from the host, until they were brought to an end.", "tj": "", "tj_en": "", "rashi": "<b>היתה בם.<\/b> לְמַהֵר וּלְהֻמָּם בְּתוֹךְ אַרְבָּעִים שָׁנָה, שֶׁלֹּא יִגְרְמוּ לִבְנֵיהֶם עוֹד לְהִתְעַכֵּב בַּמִּדְבָּר:", "rashi_en": "היתה בם [FOR INDEED THE HAND OF THE LORD] WAS AGAINST THEM [TO DESTROY THEM] speedily within a period of forty years, so that they should no longer be the cause for their children to tarry in the wilderness."}, {"ch": 2, "v": 16, "aliyah": 5, "heb": "וַיְהִ֨י כַאֲשֶׁר־תַּ֜מּוּ כׇּל־אַנְשֵׁ֧י הַמִּלְחָמָ֛ה לָמ֖וּת מִקֶּ֥רֶב הָעָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַהֲוָה כַּד שְׁלִימוּ כָּל גֻּבְרֵי מְגִיחֵי קְרָבָא לִמְמַת מִגּוֹ עַמָּא:", "onk_en": "When they had finished—all the men of war—to die out from among the people;", "pj": "וַהֲוָה כַּד פָּסְקָן כָּל גַּבְרֵי מַגִּיחֵי קְרָב עָבְרֵי בִּימָתָא לִמְמַת מִגּוֹ מַשְׁרִיתָא", "pj_en": "And when all the men of war, the makers of the high places, were consumed by dying out of the host,", "tj": "", "tj_en": "", "rashi": "<b>ויהי כאשר תמו וגו' וידבר ה' אלי וגו'.<\/b> אֲבָל מִשִּׁלּוּחַ הַמְרַגְּלִים עַד כָּאן לֹא נֶאֱמַר בְּפָרָשָׁה זוֹ וַיְדַבֵּר אֶלָּא וַיֹּאמֶר, לְלַמֶּדְךָ שֶׁכָּל ל\"ח שָׁנָה שֶׁהָיוּ יִשְׂרָאֵל נְזוּפִים, לֹא נִתְיַחֵד עִמּוֹ הַדִּבּוּר בִּלְשׁוֹן חִבָּה, פָּנִים אֶל פָּנִים וְיִשּׁוּב הַדַּעַת – לְלַמֶּדְךָ שֶׁאֵין הַשְּׁכִינָה שׁוֹרָה עַל הַנְּבִיאִים אֶלָּא בִּשְׁבִיל יִשְׂרָאֵל (מכילתא שמות י\"ב):<br><br><b>אנשי המלחמה.<\/b> מִבֶּן עֶשְׂרִים שָׁנָה הַיּוֹצְאִים בַּצָּבָא:", "rashi_en": "ויהי כאשר תמו וגו׳ וידבר ה' אלי וגו׳ SO IT CAME TO PASS WHEN [ALL THE MEN OF WAR] HAD COME TO AN END … THAT THE LORD SPOKE TO ME etc. — But from when the spies were sent forth until now, the word וידבר is not mentioned in this section, but ויאמר, to teach you that during these entire thirty eight years during which the Israelites were lying under God’s censure, the Divine speech was not directed towards him in an expression of affection, face to face, and with tranquility of mind — to teach you that the Shechinah rests upon the prophets only for Israel’s sake (Sifra, Vayikra Dibbura d'Nedavah, Chapter 2 13; Mekhilta; cf. Rashi on Leviticus 1:1 towards end).<br><br>אנשי המלחמה THE MEN OF WAR — men from twenty years old and upwards, who went to war (cf. Numbers 14:29 and Rashi thereon)."}, {"ch": 2, "v": 17, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֵלַ֥י לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִמִּי לְמֵימָר:", "onk_en": "Adonoy addressed me, to say,", "pj": "וּמַלֵיל יְיָ עִמִּי לְמֵימָר", "pj_en": "the Lord spake with me, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 18, "aliyah": 5, "heb": "אַתָּ֨ה עֹבֵ֥ר הַיּ֛וֹם אֶת־גְּב֥וּל מוֹאָ֖ב אֶת־עָֽר׃", "onk": "אַתְּ עָבֵר יוֹמָא דֵין יָת תְּחוּם מוֹאָב יָת <b>לְחָיָת<\/b>:", "onk_en": "‘‘You are today crossing the border of Moav—at ‘Or [<b>Lechoyas<\/b>].", "pj": "אַתּוּן עָבְרִין יוֹמָא דֵין יַת תְּחוּם מוֹאָב יַת לְחָיַית", "pj_en": "You are this day to pass the border of Moab towards Lechaiath.", "tj": "", "tj_en": "", "rashi": "<b>אתה עבר היום את גבול מואב, וקרבת מול בני עמון.<\/b> מִכָּאן שֶׁאֶרֶץ עַמּוֹן לְצַד צָפוֹן:", "rashi_en": "אתה עבר היום את גבול מואב … וקרבת מול בני עמון THOU ART TO PASS THIS DAY THE BOUNDARY OF MOAB … AND THOU WILT APPROACH OPPOSITE THE CHILDREN OF AMMON — from here we see that the land of Ammon was on the north [of Moab]."}, {"ch": 2, "v": 19, "aliyah": 5, "heb": "וְקָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל־תְּצֻרֵ֖ם וְאַל־תִּתְגָּ֣ר בָּ֑ם כִּ֣י לֹֽא־אֶ֠תֵּ֠ן מֵאֶ֨רֶץ בְּנֵי־עַמּ֤וֹן לְךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִבְנֵי־ל֖וֹט נְתַתִּ֥יהָ יְרֻשָּֽׁה׃", "onk": "וְתִקְרַב לָקֳבֵל בְּנֵי עַמּוֹן לָא תְצוּר עֲלֵיהוֹן וְלָא תִתְגָּרֵי <b>לְמֶעְבַּד עִמְּהוֹן קְרָב<\/b> אֲרֵי לָא אֶתֵּן מֵאַרְעָא בְנֵי עַמּוֹן לָךְ יְרֻתָּא אֲרֵי לִבְנֵי לוֹט יְהָבִתַּהּ יְרֻתָּא:", "onk_en": "When you approach [the area] facing the descendants of Ammon, do not besiege [<b>make war with<\/b>] them and do not intimidate them, for I will not give you of the land of the descendants of Ammon an inheritance, because to the descendants of Lot have I given it as an inheritance.", "pj": "וְתִתְקַרְבוּן לְקָבֵיל בְּנֵי עַמּוֹן לָא תְצוּר עֲלֵיהוֹן וְלָא תִתְגְרֵי בְּהוֹן לְסִדְרֵי קְרָב אֲרוּם לָא אֶתֵּן לְכוֹן מֵאַרַע בְּנֵי עַמּוֹן יְרוּתָא אֲרוּם לִבְנוֹי דְלוֹט מְטוֹל זַכְוָותֵיהּ דְּאַבְרָהָם יְהַבְתָּהּ יְרוּתָּא", "pj_en": "But coming near over against the children of Ammon, you are not to vex, nor provoke them to war; for I have not given you the land of the Beni Ammon for a possession: I have given it an inheritance to the children of Lot, for the sake of Abraham’s righteousness.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 20, "aliyah": 5, "heb": "אֶֽרֶץ־רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף־הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ־בָהּ֙ לְפָנִ֔ים וְהָֽעַמֹּנִ֔ים יִקְרְא֥וּ לָהֶ֖ם זַמְזֻמִּֽים׃", "onk": "אַרְעָא גִבָּרַיָּא מִתְחַשְּׁבָא אַף הִיא גִּבָּרָאֵי יָתִיבוּ בַהּ מִלְּקַדְמִין וְעַמּוֹנָאֵי קְרַן לְהוֹן <b>חֻשְׁבָּנֵי<\/b>:", "onk_en": "It, too, is considered a land of giants; giants having lived in it originally—the Ammonites called them Zamzumim [<b>Chushbani<\/b>].", "pj": "אֲרַע גּוּבָּרַיָא מִתְחַשְׁבָא לְחוֹד הִיא גִיבָּרַיָא יְתִיבָן בָּהּ מִן לְקַדְמִין וְעַמּוֹנָאֵי קְרַן לְהוֹן זֵימְתָנֵי", "pj_en": "That also was accounted a land of giants; in old time the giants dwelt in it, and the Ammonites called them Zimthanee,", "tj": "", "tj_en": "", "rashi": "<b>ארץ רפאים תחשב.<\/b> אֶרֶץ רְפָאִים נֶחְשֶׁבֶת אַף הִיא, לְפִי שֶׁהָרְפָאִים יָשְׁבוּ בָהּ לְפָנִים, אֲבָל לֹא זוֹ הִיא שֶׁנָּתַתִּי לְאַבְרָהָם:", "rashi_en": "ארץ רפאים תחשב IT (AMMON) ALSO WAS ACCOUNTED A LAND OF REPHAIM. — It also is accounted a land of Rephaim because the Rephaim formerly dwelt in it, but yet it is not that land which I gave to Abraham."}, {"ch": 2, "v": 21, "aliyah": 5, "heb": "עַ֣ם גָּד֥וֹל וְרַ֛ב וָרָ֖ם כָּעֲנָקִ֑ים וַיַּשְׁמִידֵ֤ם יְהֹוָה֙ מִפְּנֵיהֶ֔ם וַיִּירָשֻׁ֖ם וַיֵּשְׁב֥וּ תַחְתָּֽם׃", "onk": "עַם רַב וְסַגִּי וְתַקִּיף <b>כְּגִבָּרַיָּא<\/b> וְשֵׁצִנּוּן יְיָ מִקֳּדָמֵיהוֹן וְתָרֵכֻנּוּן וִיתִיבוּ <b>בְאַתְרֵיהוֹן<\/b>:", "onk_en": "A people great and numerous and powerful like the Anokim [<b>giants<\/b>]. Adonoy destroyed them from before them, and they drove them out and settled in their stead [<b>place<\/b>].", "pj": "עַמָּא רַבָּא וַחֲסִינָא הֵי כְּגִנְבָּרַיָא וְשֵׁיצִינוּן מֵימְרָא דַיְיָ מִן קֳדָמֵיהוֹן וְתָרֵיכִינוּן וִיתוּבוּ בְּאַתְרֵיהוֹן", "pj_en": "a people great and mighty as giants: but the Word of the Lord destroyed them, and drave them out before them, and they dwelt in their place;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 22, "aliyah": 5, "heb": "כַּאֲשֶׁ֤ר עָשָׂה֙ לִבְנֵ֣י עֵשָׂ֔ו הַיֹּשְׁבִ֖ים בְּשֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת־הַחֹרִי֙ מִפְּנֵיהֶ֔ם וַיִּֽירָשֻׁם֙ וַיֵּשְׁב֣וּ תַחְתָּ֔ם עַ֖ד הַיּ֥וֹם הַזֶּֽה׃", "onk": "כְּמָא דִי עֲבַד לִבְנֵי עֵשָׂו דְּיָתְבִין בְּשֵׂעִיר דִּי שֵׁצֵי יָת חוֹרָאֵי מִקֳּדָמֵיהוֹן וְתָרֵכֻנּוּן וִיתִיבוּ <b>בְאַתְרֵיהוֹן<\/b> עַד יוֹמָא הָדֵין:", "onk_en": "As He had done to the descendants of Eisov living in Seir, from before whom He destroyed the Chori, and they drove them out and settled in their stead [<b>places<\/b>] until today.", "pj": "כְּמָא דַּעֲבַד לִבְנוֹי דְעֵשָו דְּיַתְבִין בְּשֵעִיר דְּשֵׁיצֵי יַת חוֹרָאֵי מִן קֳדָמֵיהוֹן וְתָרֵיכִינוּן וִיתוּבוּ בְּאַתְרֵיהוֹן עַד יוֹמָא הָדֵין", "pj_en": "{as He did for the Beni Esau who dwell in Seir: for He destroyed the Horaee before them, and drave them out, and they dwell in their place} to this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 23, "aliyah": 5, "heb": "וְהָֽעַוִּ֛ים הַיֹּשְׁבִ֥ים בַּחֲצֵרִ֖ים עַד־עַזָּ֑ה כַּפְתֹּרִים֙ הַיֹּצְאִ֣ים מִכַּפְתֹּ֔ר הִשְׁמִידֻ֖ם וַיֵּשְׁב֥וּ תַחְתָּֽם׃", "onk": "וְעַוָּאֵי דְּיָתְבִין <b>בִּדְפִיחַ<\/b> עַד עַזָּה <b>קַפּוּטְקָאֵי<\/b> דִּנְפָקוּ <b>מִקַּפּוּטְקַיָּא<\/b> שֵׁצֻנּוּן וִיתִיבוּ <b>בְאַתְרֵיהוֹן<\/b>:", "onk_en": "And the Avim who had been living in Chatzeirim [<b>Defiach<\/b>] till Azah—Caftorim [<b>Kaputka’ites<\/b>] who had left Caftor [<b>Kaputkayah<\/b>] destroyed them and settled in their stead [<b>place<\/b>].", "pj": "וּשְׁאָר פְּלֵיטַת כְּנַעֲנָאֵי דַּהֲווֹ שָׁרָן בְּכוּפְרָנַיָא דִפְרִיעַ עַד עַזָּה קַפּוּטְקָאֵי דִנְפָקוּ מִן קַפּוּטְקְיָאָה שֵׁיצֵיאוּנוּן וִיתִיבוּ בְּאַתְרֵיהוֹן", "pj_en": "And the rest of the escaped of the Kenaanah which dwelt in the cities of Dephia to Gaza, the Kapotkaee who came out of Kapotkaia destroyed them, and dwelt in their place.", "tj": "", "tj_en": "", "rashi": "<b>והעוים הישבים בחצרים וגו'.<\/b> עַוִּים מִפְּלִשְׁתִּים הֵם, שֶׁעִמָּהֶם הֵם נֶחֱשָׁבִים בְּסֵפֶר יְהוֹשֻׁעַ, שֶׁנֶּאֱמַר (יהושע י\"ג) \"חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים הָעַזָּתִי וְהָאַשְׁדּוֹדִי הָאֶשְׁקְלוֹנִי הַגִּתִּי וְהָעֶקְרוֹנִי וְהָעַוִּים\", וּמִפְּנֵי הַשְּׁבוּעָה שֶׁנִּשְׁבַּע אַבְרָהָם לַאֲבִימֶלֶךְ לֹא יָכְלוּ יִשְׂרָאֵל לְהוֹצִיא אַרְצָם מִיָּדָם, וְהֵבֵאתִי עֲלֵיהֶם כַּפְתּוֹרִים וְהִשְׁמִידוּם וַיֵּשְׁבוּ תַחְתָּם, וְעַכְשָׁיו אַתֶּם מֻתָּרִים לְקַחְתָּהּ מִיָּדָם (חולין ס'):", "rashi_en": "והעוים הישבים בחצרים וגו׳ BUT THE AVIM WHO DWELL IN HAZERIM etc. —The Avim are part of the Philistine people, for they are enumerated together with them in the Book of Joshua (Joshua 13:3), as it is said, “The five lords of the Philistines, the Gazathites, and the Ashdothites, and the Eshkalonites, the Gittites, and the Ekronites; also the Avim”. But because of the oath which Abraham had sworn to Abimelech, king of the Philistines (Genesis 21:24), Israel would have been unable to take their land out of their possession; but, says God, I brought the Caphtorites against them and they destroyed them and dwelt in their stead, and now you are permitted to take it (that land) from their (the Caphtorites) possession (Chullin 60b)."}, {"ch": 2, "v": 24, "aliyah": 5, "heb": "ק֣וּמוּ סְּע֗וּ וְעִבְרוּ֮ אֶת־נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠יָדְךָ֠ אֶת־סִיחֹ֨ן מֶֽלֶךְ־חֶשְׁבּ֧וֹן הָֽאֱמֹרִ֛י וְאֶת־אַרְצ֖וֹ הָחֵ֣ל רָ֑שׁ וְהִתְגָּ֥ר בּ֖וֹ מִלְחָמָֽה׃", "onk": "קוּמוּ טוּלוּ וְעִבָרוּ יָת נַחֲלָא דְאַרְנֹן חֲזֵי דִמְסָרִית בִּידָךְ יָת סִיחוֹן מַלְכָּא דְחֶשְׁבּוֹן אֱמֹרָאָה וְיָת אַרְעֵיהּ שָׁרֵי לְתָרָכוּתֵיהּ וְאִתְגָּרֵי <b>לְמֶעְבַּד עִמֵּיהּ<\/b> קְרָבָא:", "onk_en": "Arise to travel, and cross Wadi Arnon. See, I have put into your hand Sichon, King of Cheshbon, the Emorite and his land—begin inheriting [it] by intimidating him with [<b>waging<\/b>] war [<b>with him<\/b>].", "pj": "אִזְדְּקָפוּ טוּלוּ וְעִבְרוּ יַת נַחֲלֵי אַרְנוֹנָא חֲמוֹן דִּי מְסָרִית בִּידֵיכוֹן יַת סִיחוֹן מַלְכָּא דְחֶשְׁבּוֹן אֱמוֹרָאָה וְיַת אַרְעֵיהּ שָׁרֵי לְתַרְכוּתֵיהּ וְתִתְגָרֵי לִמְסַדְרָא לְקוּבְלֵיהּ סִדְרֵי קְרָבָא", "pj_en": "Arise, take your journey, and pass over the river Arnona; behold, I have delivered into your hands Sihon the king of Heshbon and the Amoraah, and his land: begin to drive them out, and to provoke him to wage war.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 25, "aliyah": 5, "heb": "הַיּ֣וֹם הַזֶּ֗ה אָחֵל֙ תֵּ֤ת פַּחְדְּךָ֙ וְיִרְאָ֣תְךָ֔ עַל־פְּנֵי֙ הָֽעַמִּ֔ים תַּ֖חַת כׇּל־הַשָּׁמָ֑יִם אֲשֶׁ֤ר יִשְׁמְעוּן֙ שִׁמְעֲךָ֔ וְרָגְז֥וּ וְחָל֖וּ מִפָּנֶֽיךָ׃", "onk": "יוֹמָא הָדֵין אֱשָׁרֵי לְמִתַּן זֻעְתָּךְ וְדַחַלְתָּךְ עַל אַפֵּי עַמְמַיָּא דִּי תְחוֹת כָּל שְׁמַיָּא דִּי יִשְׁמְעוּן שִׁמְעָךְ וִיזוּעוּן וְיִדְחֲלוּן מִן קֳדָמָךְ:", "onk_en": "Today I begin to place fear of you and awe of you upon the peoples under the whole heaven, so that they will hear your reputation and will shiver and tremble before you.’’", "pj": "יוֹמָא דֵין שַׁרְיַית לְמִתַּן זַעֲוָותָךְ וְדַחֲלָתָךְ עַל אַנְפֵּי כָּל עַמְמַיָא דִתְחוֹת כָּל שְׁמַיָא דְיִשְׁמְעוּן שְׁמַע זַכְוָותָךְ הֵיךְ קָמוּן שִׁמְשָׁא וְסִיהֲרָא אַמְטוּלְתִּיךְ וּפַסְקִין מִן לְמֵימָר שִׁירָתָא כְּמֵיסַת יוֹמָא וּפַלְגָא קָמוּ בִּמְדוֹרְהוֹן עַד דְּאַגְחַת קְרָבָא בְּסִיחוֹן וִיזָעוּן וִירַתְתוּן מִן קֳדָמָךְ", "pj_en": "Today I will begin to put thy terror and fear upon the faces of all the peoples which are under the whole heavens who shall hear the report of thy virtue, that the sun and moon have stood still, and have ceased from speaking (their) song for the space of a day and a half, standing still in their habitation until thou hadst done battle with Sihon; and they will shiver and tremble before thee.", "tj": "", "tj_en": "", "rashi": "<b>תחת כל השמים.<\/b> לִמֵּד שֶׁעָמְדָה חַמָּה לְמֹשֶׁה בְּיוֹם מִלְחֶמֶת עוֹג וְנוֹדַע הַדָּבָר תַּחַת כָּל הַשָּׁמַיִם (עבודה זרה כ\"ה):", "rashi_en": "תחת כל השמים [THIS DAY I BEGIN TO PUT THE DREAD OF THEE … UPON THE NATIONS THAT ARE] UNDER THE WHOLE HEAVEN — This (the statement that the nations under the entire heaven will dread the Israelites) teaches that the sun stood still for Moses on the day of the battle with Og, and the matter was consequently known under the whole heaven (Avodah Zarah 25a)."}, {"ch": 2, "v": 26, "aliyah": 5, "heb": "וָאֶשְׁלַ֤ח מַלְאָכִים֙ מִמִּדְבַּ֣ר קְדֵמ֔וֹת אֶל־סִיח֖וֹן מֶ֣לֶךְ חֶשְׁבּ֑וֹן דִּבְרֵ֥י שָׁל֖וֹם לֵאמֹֽר׃", "onk": "וּשְׁלָחִית אִזְגַּדִּין מִמַּדְבְּרָא דִקְדֵמוֹת לְוָת סִיחוֹן מַלְכָּא דְחֶשְׁבּוֹן פִּתְגָּמֵי שְׁלָמָא לְמֵימָר:", "onk_en": "I sent emissaries from the wilderness of Kedeimos to Sichon, King of Cheshbon, with the following peaceful statement:", "pj": "וְשַׁדָּרִית אִזְגַדִּין מִנְהַרְדָעָא דְסָמִיךְ לְמַדְבַּר קְדֵמוֹת לְוַת סִיחוֹן מַלְכָּא דֶאֱמוֹרָאֵי פִּתְגָמֵי שְׁלָם לְמֵימָר", "pj_en": "And I sent messengers from Nehardea, which is by the wilderness of Kedemoth, to Sihon king of the Amorites, with words of peace, saying,", "tj": "", "tj_en": "", "rashi": "<b>ממדבר קדמות.<\/b> אַעַ\"פִּ שֶׁלֹּא צִוַּנִי הַמָּקוֹם לִקְרֹא לְסִיחוֹן לְשָׁלוֹם, לָמַדְתִּי מִמִּדְבַּר סִינַי – מִן הַתּוֹרָה שֶׁקָּדְמָה לָעוֹלָם – כְּשֶׁבָּא הַקָּבָּ\"ה לִתְּנָהּ לְיִשְׂרָאֵל חָזַר אוֹתָהּ עַל עֵשָׂו וְיִשְׁמָעֵאל, וְגָלוּי לְפָנָיו שֶׁלֹּא יְקַבְּלוּהָ וְאַעַ\"פִּ כֵן פָּתַח לָהֶם בְּשָׁלוֹם, אַף אֲנִי קִדַּמְתִּי אֶת סִיחוֹן בְּדִבְרֵי שָׁלוֹם; דָּ\"אַ, <b>ממדבר קדמות<\/b> – מִמְּךָ לָמַדְתִּי, שֶׁקָּדַמְתָּ לָעוֹלָם, יָכוֹל הָיִיתָ לִשְׁלֹחַ בָּרָק אֶחָד וְלִשְֹרֹף אֶת הַמִּצְרִים, אֶלָּא שְׁלַחְתַּנִי מִן הַמִּדְבָּר אֶל פַּרְעֹה לֵאמֹר (שמות ה') \"שַׁלַּח אֶת עַמִּי\", בְּמִתּוּן (תנחומא):", "rashi_en": "ממדבר קדמות [AND I SENT MESSENGERS] FROM THE WILDERNESS OF KEDEMOTH — Although the Omnipresent had not commanded me to proclaim peace unto Sihon I learnt to do so from what happened in the wilderness of Sinai, i.e. from an incident that relates to the Torah which pre-existed (קדמה) the world. For when the Holy One, blessed be He, was about to give it (the Torah) to Israel, he took it round to Esau and Ishmael. It was manifest before Him that they would not accept it, but yet He opened unto them with peace. Similarly I first approached Sihon with words of peace.  — Another explanation of ממדבר קדמות: Moses said to God, \"I learnt this from what Thou didst say in the wilderness — from Thee Who wast in existence before (קדמת) the world. Thou couldst have sent one flash of lightning to bum up the Egyptians, but Thou didst send me from the wilderness to Pharaoh, to say gently, (Exodus 5:1) \"Let my people go” (Yalkut Shimoni on Torah 764:27)."}, {"ch": 2, "v": 27, "aliyah": 5, "heb": "אֶעְבְּרָ֣ה בְאַרְצֶ֔ךָ בַּדֶּ֥רֶךְ בַּדֶּ֖רֶךְ אֵלֵ֑ךְ לֹ֥א אָס֖וּר יָמִ֥ין וּשְׂמֹֽאול׃", "onk": "אֵעִבַּר בְּאַרְעָךְ בְּאָרְחָא בְּאָרְחָא אֵזֵל לָא אֶסְטֵי יַמִּינָא וּשְׂמָאלָא:", "onk_en": "‘‘Let me pass through your land. I will travel only on the highway, I will not deviate right or left.", "pj": "אֲעִיבַר בְּאַרְעָךְ בְּאוֹרְחָא דְהִיא אוֹרַח כְּבִישָׁא אֵיזִיל לָא אַסְטֵי לְהַנְזָקוּתָךְ לְיַמִינָא וְלִשְמָאלָא", "pj_en": "I would pass through thy land; by the way which is the beaten road will I go; I will not turn aside to do thee harm on the right hand or the left.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 28, "aliyah": 5, "heb": "אֹ֣כֶל בַּכֶּ֤סֶף תַּשְׁבִּרֵ֙נִי֙ וְאָכַ֔לְתִּי וּמַ֛יִם בַּכֶּ֥סֶף תִּתֶּן־לִ֖י וְשָׁתִ֑יתִי רַ֖ק אֶעְבְּרָ֥ה בְרַגְלָֽי׃", "onk": "עִבוּרָא בְכַסְפָּא תְּזַבֶּן לִי וְאֵיכוּל וּמַיָּא בְּכַסְפָּא תִּתֶּן לִי וְאֶשְׁתֵּי לְחוֹד אֵעִבַר בְּרַגְלָי:", "onk_en": "Food for money sell me so I can eat, and water for money sell me so I can drink—just let me cross on foot.", "pj": "עִבּוּר כַּד חַי בְּכַסְפָּא תַּזְבִּין לִי וְאֵיכוֹל וּמוֹי בְּכַסְפָּא תִתֵּן לִי וְאִישְׁתֵּי לְחוֹד אֲעִבַּר בִּלְחוֹדִי", "pj_en": "I will buy fresh provision with silver, to eat, and thou shalt give me water for silver, to drink; I will only pass through:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 29, "aliyah": 5, "heb": "כַּאֲשֶׁ֨ר עָֽשׂוּ־לִ֜י בְּנֵ֣י עֵשָׂ֗ו הַיֹּֽשְׁבִים֙ בְּשֵׂעִ֔יר וְהַמּ֣וֹאָבִ֔ים הַיֹּשְׁבִ֖ים בְּעָ֑ר עַ֤ד אֲשֶֽׁר־אֶֽעֱבֹר֙ אֶת־הַיַּרְדֵּ֔ן אֶל־הָאָ֕רֶץ אֲשֶׁר־יְהֹוָ֥ה אֱלֹהֵ֖ינוּ נֹתֵ֥ן לָֽנוּ׃", "onk": "כְּמָא דִי עֲבָדוּ לִי בְּנֵי עֵשָׂו דְּיָתְבִין בְּשֵׂעִיר וּמוֹאָבָאֵי דְּיָתְבִין <b>בִּלְחָיָת<\/b> עַד דְּאֵעִבַר יָת יַרְדְּנָא לְאַרְעָא דַּיְיָ אֱלָהָנָא יָהֵב לָנָא:", "onk_en": "As the descendants of Eisov did for me who live in Seir and the Moavites who live in Or [<b>Lechoyas<\/b>]; until I will have crossed the Yardein into the land that Adonoy, our God, is giving us.’’", "pj": "הֵיכְמָא דַּעֲבַד לִי בְּנוֹי דְעֵשָו דְּיַתְבִין בְּגַבְלָא וּמוֹאֲבָאֵי דְיַתְבִין בִּלְחָיַית עַד זְמַן דְּאַעִיבַר יַת יוֹרְדְּנָא לְאַרְעָא דַיְיָ אֱלָהָנָא יָהֵיב לָנָא", "pj_en": "as the Beni Esau, who dwell in Gebal, and the Moabaee, who dwell in Lechaiath have done to me, until the time that I pass over the Jordan into the land which the Lord our God giveth us.", "tj": "", "tj_en": "", "rashi": "<b>כאשר עשו לי בני עשו.<\/b> לֹא לְעִנְיַן לַעֲבֹר בְּאַרְצָם, אֶלָּא לְעִנְיַן מֶכֶר אֹכֶל וּמַיִם:<br><br><b>עד אשר אעבר את הירדן.<\/b> מוּסָב עַל אֶעְבְּרָה בְאַרְצֶךָ:", "rashi_en": "כאשר עשו לי בגי עשו AS THE CHILDREN OF ESAU DID TO ME — This does not refer to passing through their land (רק אעברה ברגלי) for Edom refused this, (cf. Numbers 20:18) but to the matter of selling food and water (also mentioned in the preceding verse).<br><br>עד אשר אעבר את הירדן UNTIL I SHALL PASS OVER THE JORDAN — This is to be connected with \"Let me pass through thy land” (v. 27)."}, {"ch": 2, "v": 30, "aliyah": 5, "heb": "וְלֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖נוּ בּ֑וֹ כִּֽי־הִקְשָׁה֩ יְהֹוָ֨ה אֱלֹהֶ֜יךָ אֶת־רוּח֗וֹ וְאִמֵּץ֙ אֶת־לְבָב֔וֹ לְמַ֛עַן תִּתּ֥וֹ בְיָדְךָ֖ כַּיּ֥וֹם הַזֶּֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְלָא אָבֵי סִיחֹן מַלְכָּא דְחֶשְׁבּוֹן <b>לְמִשְׁבְּקָנָא לְמֶעְבַּר בִּתְחוּמֵיהּ<\/b> אֲרֵי אַקְשֵׁי יְיָ אֱלָהָךְ יָת רוּחֵיהּ וְתַקִּיף יָת לִבֵּיהּ בְּדִיל לְמִמְסְרֵיהּ בִּידָךְ כְּיוֹמָא הָדֵין:", "onk_en": "But Sichon, King of Cheshbon, was not willing to let us traverse it [<b>would not permit us to pass through his borders<\/b>], because Adonoy, your God, had hardened his spirit and emboldened his mind in order to put him in your hand this day.", "pj": "וְלָא צָבָא סִיחוֹן מַלְכָּא דְחֶשְׁבּוֹן לְאַעֲבְּרוּתָנָא בְּגוֹ תְחוּמֵיהּ אֲרוּם אַקְשֵׁי יְיָ אֱלָהָךְ יַת יִצְרָא דְרוּחֵיהּ וְאִיתְקַף יַת לִיבְּבֵיהּ מִן בִּגְלַל לְמִמְסְרֵיהּ בִּידָךְ כְּיוֹמָא הָדֵין", "pj_en": "But Sihon the king of Heshbon was not willing to allow us to pass through his borders; for the Lord our God had hardened the form of his spirit, and made his heart obstinate, to deliver him into thy hand as at this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 31, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֵלַ֔י רְאֵ֗ה הַֽחִלֹּ֙תִי֙ תֵּ֣ת לְפָנֶ֔יךָ אֶת־סִיחֹ֖ן וְאֶת־אַרְצ֑וֹ הָחֵ֣ל רָ֔שׁ לָרֶ֖שֶׁת אֶת־אַרְצֽוֹ׃", "onk": "וַאֲמַר יְיָ לִי חֲזֵי שָׁרֵיתִי לְמִמְסַר קֳדָמָךְ יָת סִיחֹן וְיָת אַרְעֵיהּ שְׁרֵי לְתָרָכוּתֵיהּ לְמֵירַת יָת אַרְעֵיהּ:", "onk_en": "Adonoy said to me, ‘‘See, I have begun defeating before you Sichon and his land. Begin inheriting—to inherit his land.’’", "pj": "וַאֲמַר יְיָ לִי חָמֵי בְּאוֹרְכוּת שִׁמְשָׁא וְסִיהֲרָא דְשַׁרְיַית לְמִמְסַר בִּידָךְ יַת סִיחוֹן וְיַת אַרְעֵיהּ שָׁרֵי לְתַרְכוּתֵיהּ לְמֵירוֹת יַת אַרְעֵיהּ", "pj_en": "And the Lord said to me, See, within the space of a sun and a moon I have begun to deliver Sihon and his country into thy hand; begin thou to cast him out, to inherit his land.", "tj": "", "tj_en": "", "rashi": "<b>החלתי תת לפניך.<\/b> כָּפָה שַׂר שֶׁל אֱמוֹרִיִּים שֶׁל מַעְלָה תַּחַת רַגְלָיו שֶׁל מֹשֶׁה וְהִדְרִיכוֹ עַל צַוָּארוֹ:", "rashi_en": "החלתי תת לפניך I HAVE BEGUN TO GIVE [SIHON] BEFORE THEE — He cast down the tutelary angel of the Amorites, who was in the upper spheres, beneath Moses’ feet and made him tread upon his neck (cf. Rashi on Numbers 24:2)."}, {"ch": 2, "v": 32, "aliyah": 6, "heb": "וַיֵּצֵא֩ סִיחֹ֨ן לִקְרָאתֵ֜נוּ ה֧וּא וְכׇל־עַמּ֛וֹ לַמִּלְחָמָ֖ה יָֽהְצָה׃", "onk": "וּנְפַק סִיחֹן לְקַדָּמוּתָנָא הוּא וְכָל עַמֵּיהּ לַאֲגָחָא קְרָבָא לְיָהַץ:", "onk_en": "And Sichon went out toward us, he and his entire people, to wage war in Yahatz.", "pj": "וּנְפַק סִיחוֹן לִקְדָמוּתָנָא הוּא וְכָל עַמֵּיהּ לְאַגָחָא קְרָבָא לְיָהַץ", "pj_en": "And Sihon came out to meet us, he and all his people, to do battle at Jehaz.", "tj": "", "tj_en": "", "rashi": "<b>ויצא סיחן.<\/b> לֹא שָׁלַח בִּשְׁבִיל עוֹג לַעֲזֹר לוֹ, לְלַמֶּדְךָ שֶׁלֹּא הָיוּ צְרִיכִים זֶה לָזֶה:", "rashi_en": "ויצא סיחן AND SIHON WENT FORTH — He did not send for Og to help him: this serves to teach you that they did not require one another's help, so mighty was each of them."}, {"ch": 2, "v": 33, "aliyah": 6, "heb": "וַֽיִּתְּנֵ֛הוּ יְהֹוָ֥ה אֱלֹהֵ֖ינוּ לְפָנֵ֑ינוּ וַנַּ֥ךְ אֹת֛וֹ וְאֶת־<span class=\"mam-kq-trivial\">בָּנָ֖ו<\/span> וְאֶת־כׇּל־עַמּֽוֹ׃", "onk": "<b>וּמָסְרֵיהּ<\/b> יְיָ אֱלָהָנָא קֳדָמָנָא וּמְחֵנָא יָתֵיהּ וְיָת בְּנוֹהִי וְיָת כָּל עַמֵּיהּ:", "onk_en": "Adonoy, our God, defeated [<b>delivered<\/b>] him before us, and we smote him and his sons and his entire people.", "pj": "וּמְסַר יָתֵיהּ יְיָ אֱלָהָנָא קֳדָמָנָא וּמְחֵינָא יָתֵיהּ וְיַת בְּנוֹי וְיַת כָּל עַמֵּיהּ", "pj_en": "And the Lord our God delivered him up before us, and we smote him, and his children, and all his people.", "tj": "", "tj_en": "", "rashi": "<b>ואת בניו.<\/b> בנו כְתִיב, שֶׁהָיָה לוֹ בֵן גִּבּוֹר כְּמוֹתוֹ (תנחומא חקת):", "rashi_en": "ואת בנו [AND WE SMOTE HIM] AND HIS SONS — It is written בנו, \"his son\" (although read as בניו \"his sons\"), for he had a son who was as mighty as himself (Midrash Tanchuma, Chukat 25)."}, {"ch": 2, "v": 34, "aliyah": 6, "heb": "וַנִּלְכֹּ֤ד אֶת־כׇּל־עָרָיו֙ בָּעֵ֣ת הַהִ֔וא וַֽנַּחֲרֵם֙ אֶת־כׇּל־עִ֣יר מְתִ֔ם וְהַנָּשִׁ֖ים וְהַטָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד׃", "onk": "וּכְבַשְׁנָא יָת כָּל קִרְווֹהִי בְּעִדָּנָא הַהִיא וְגַמַּרְנָא יָת כָּל קִרְוֵי גֻבְרַיָּא וּנְשַׁיָּא וְטַפְלָא לָא אַשְׁאַרְנָא מְשֵׁזֵב:", "onk_en": "We conquered all his cities at that time and annihilated every city’s men, woman, and children; we left no survivor.", "pj": "וּכְבַשְׁנָא יַת כָּל קִירְווֹי בְּעִדָנָא הַהִיא וּגְמַרְנָא יַת כָּל קִרְוַיָא גוּבְרַיָא וּנְשַׁיָא וְטַפְלַיָא לָא אַשְׁאַרְנָא מְשֵׁזִיב", "pj_en": "And we subdued all his cities at that time, and destroyed all the towns, the men, women, and children, we left none to escape;", "tj": "", "tj_en": "", "rashi": "<b>מתם.<\/b> אֲנָשִׁים, בְּבִזַּת סִיחוֹן נֶאֱמַר בָּזַזְנוּ לָנוּ, לְשׁוֹן בִּזָּה, שֶׁהָיְתָה חֲבִיבָה עֲלֵיהֶם וּבוֹזְזִים אִישׁ לוֹ, וּכְשֶׁבָּאוּ לְבִזַּת עוֹג, כְּבָר הָיוּ שְׂבֵעִים וּמְלֵאִים, וְהָיְתָה בְּזוּיָה בְּעֵינֵיהֶם, וּמְקָרְעִין וּמַשְׁלִיכִין בְּהֵמָה וּבְגָדִים, וְלֹא נָטְלוּ כִּי אִם כֶּסֶף וְזָהָב, לְכָךְ נֶאֱמַר בַּזּוֹנוּ לָנוּ, לְשׁוֹן בִּזָּיוֹן, כָּךְ נִדְרָשׁ בְּסִפְרֵי בְּפַ' וַיֵּשֶׁב יִשְׂרָאֵל בַּשִּׁטִּים:", "rashi_en": "מתם means MEN. — Of the spoil taken from Sihon it is stated (v. 35) בזזנו לנו, an expression denoting plunder (בזה), because then this was an object of desire to them, so that each man took spoil for himself. But when they came to the plundering of Og, they were already full to satiety, and it was contemptible in their eyes, so that they tore in pieces and cast away cattle and garments, and took only silver and gold. On this account it is said (Deuteronomy 3:7) בַּזֹּנוּ לנו which is an expression denoting \"holding in contempt\" (בזיון). Thus is it expounded in Siphre in the chapter beginning with \"And Israel dwelt in Shittim״ (Numbers 25:1)."}, {"ch": 2, "v": 35, "aliyah": 6, "heb": "רַ֥ק הַבְּהֵמָ֖ה בָּזַ֣זְנוּ לָ֑נוּ וּשְׁלַ֥ל הֶעָרִ֖ים אֲשֶׁ֥ר לָכָֽדְנוּ׃", "onk": "לְחוֹד בְּעִירָא בַּזָּנָא לָנָא וַעֲדִי קִרְוַיָּא דִּי כְבַשְׁנָא:", "onk_en": "Only the animals we plundered for ourselves, and the booty of the cities that we conquered.", "pj": "לְחוֹד בְּעִירֵי בַּזָנָא לָנָא וְעָרֵי קִרְוַיָא דִכְבַשְׁנָא", "pj_en": "only the cattle took we for prey and the spoil of the towns which we subdued.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 36, "aliyah": 6, "heb": "מֵֽעֲרֹעֵ֡ר אֲשֶׁר֩ עַל־שְׂפַת־נַ֨חַל אַרְנֹ֜ן וְהָעִ֨יר אֲשֶׁ֤ר בַּנַּ֙חַל֙ וְעַד־הַגִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑נּוּ אֶת־הַכֹּ֕ל נָתַ֛ן יְהֹוָ֥ה אֱלֹהֵ֖ינוּ לְפָנֵֽינוּ׃", "onk": "מֵעֲרֹעֵר דִּי עַל כֵּיף נַחֲלָא דְאַרְנֹן וְקַרְתָּא דִי בְנַחֲלָא וְעַד גִּלְעָד לָא הֲוַת קַרְתָּא דִּי תְקֵפַת מִנָּנָא יָת כֹּלָּא מְסַר יְיָ אֱלָהָנָא קֳדָמָנָא:", "onk_en": "From Aroer, which is on the bank of Wadi Arnon—and the city that is in the wadi—up to Gilad, there was no city that was stronger than we. All of it did Adonoy, our God, defeat before us.", "pj": "מֵעֲרוֹעֵר דְּעַל גֵּיף נַחֲלָא דְאַרְנוֹנָא וְקַרְתָּא דְמִתְבַּנְיָא בִּמְצִיעוֹת נַחֲלָא עַד גִּלְעָד לָא הֲוַת קַרְתָּא דִתְקִיפַת מִינָנָא יַת כֻּלְהוֹן מְסַר יְיָ אֱלָהָנָא קֳדָמָנָא", "pj_en": "From Aroer, on the bank of the river Arnona, and the city which is built in the midst of the river, even unto Gilead, there was no city too strong for us, the Lord our God gave all of them up before us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 2, "v": 37, "aliyah": 6, "heb": "רַ֛ק אֶל־אֶ֥רֶץ בְּנֵי־עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כׇּל־יַ֞ד נַ֤חַל יַבֹּק֙ וְעָרֵ֣י הָהָ֔ר וְכֹ֥ל אֲשֶׁר־צִוָּ֖ה יְהֹוָ֥ה אֱלֹהֵֽינוּ׃", "onk": "לְחוֹד לְאַרְעָא בְנֵי עַמּוֹן לָא קָרֶבְתָּא כָּל <b>כֵּיף<\/b> נַחֲלָא יוּבְקָא וְקִרְוֵי טוּרָא וְכֹל דִּי פַקִּיד יְיָ אֱלָהָנָא:", "onk_en": "Only the land of the descendants of Ammon did you not attack—all along [<b>the shore of<\/b>] Wadi Yabok and the hill cities—everything Adonoy, our God, commanded.", "pj": "לְחוֹד לְאַרַע בְּנֵי עַמּוֹן לָא קָרֵבְתָּא כָּל אֲתַר נַחֲלָא יוּבְקָא וְקִרְוֵי טַוְורָא כְּכָל מַה דְּפַקֵּיד יְיָ אֱלָהָנָא", "pj_en": "Only to the land of the children of Ammon we went not nigh, nor to any place on the river Jobeka, nor to the cities of the mountain, according to all that the Lord our God had commanded us.", "tj": "", "tj_en": "", "rashi": "<b>כל יד נחל יבק.<\/b> כָּל אֵצֶל נַחַל יַבֹּק:<br><br><b>וכל אשר צוה ה' אלהינו.<\/b> שֶׁלֹּא לִכְבֹּשׁ, הִנַּחְנוּ:", "rashi_en": "כל יד נחל יבק means, ALL THE DISTRICT BESIDE THE BROOK OF JABBOK.<br><br>וכל אשר צוה ה' אלהינו לנו — This means, AND ALL WHICH THE LORD OUR GOD COMMANDED US not to capture, we left."}, {"ch": 3, "v": 1, "aliyah": 6, "heb": "וַנֵּ֣פֶן וַנַּ֔עַל דֶּ֖רֶךְ הַבָּשָׁ֑ן וַיֵּצֵ֣א עוֹג֩ מֶֽלֶךְ־הַבָּשָׁ֨ן לִקְרָאתֵ֜נוּ ה֧וּא וְכׇל־עַמּ֛וֹ לַמִּלְחָמָ֖ה אֶדְרֶֽעִי׃", "onk": "וְאִתְפְּנֵינָא וּסְלֶקְנָא אֹרַח <b>דְּמַתְנָן<\/b> וּנְפַק עוֹג מַלְכָּא <b>דְּמַתְנָן<\/b> לְקַדָּמוּתָנָא הוּא וְכָל עַמֵּיהּ לַאֲגָחָא קְרָבָא אֶדְרֶעִי:", "onk_en": "We turned and went up the Boshon [<b>Masnan<\/b>] road. Og, King of the Boshon [<b>Masnan<\/b>], went out toward us, he and his entire people, to [wage] war in Edrei.", "pj": "וְאִתְפְּנֵינָא וְסַלִיקְנָא אוֹרַח מַתְנָן וּנְפַק עוֹג מַלְכָּא דְמַתְנָן לִקֳדָמוּתָנָא הוּא וְכָל עַמֵּיהּ לְאַגָחָא קְרָבָא לְאֶדְרֶעָת", "pj_en": "And turning, we went up by the way of Mathnan: and Og the king of Mathnan came out to meet us, he and all his people, to give battle in Edrehath.", "tj": "", "tj_en": "", "rashi": "<b>ונפן ונעל.<\/b> כָּל צַד צָפוֹן הוּא עֲלִיָּה:", "rashi_en": "ונפן ונעל AND WE TURNED AND WENT UP — every journey towards the north (from the wilderness towards Canaan) is “uphill”."}, {"ch": 3, "v": 2, "aliyah": 6, "heb": "וַיֹּ֨אמֶר יְהֹוָ֤ה אֵלַי֙ אַל־תִּירָ֣א אֹת֔וֹ כִּ֣י בְיָדְךָ֞ נָתַ֧תִּי אֹת֛וֹ וְאֶת־כׇּל־עַמּ֖וֹ וְאֶת־אַרְצ֑וֹ וְעָשִׂ֣יתָ לּ֔וֹ כַּאֲשֶׁ֣ר עָשִׂ֗יתָ לְסִיחֹן֙ מֶ֣לֶךְ הָֽאֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּחֶשְׁבּֽוֹן׃", "onk": "וַאֲמַר יְיָ לִי לָא תִדְחַל יָתֵיהּ אֲרֵי בִידָךְ מְסָרִית יָתֵיהּ וְיָת כָּל עַמֵּיהּ וְיָת אַרְעֵיהּ וְתַעְבֶּד לֵיהּ כְּמָא דִי עֲבַדְתָּא לְסִיחֹן מַלְכָּא דֶאֱמֹרָאָה דִּי יָתֵב בְּחֶשְׁבּוֹן:", "onk_en": "Adonoy said to me, ‘‘Do not fear him, for I have put him in your hand, with all his people and his land, and you will do to him as you did to Sichon, King of the Emorites who was living in Cheshbon.’’", "pj": "וַאֲמַר יְיָ לִי לָא תִדְחַל מִנֵיהּ אֲרוּם בִּידָךְ מְסָרִית יָתֵיהּ וְיַת כָּל עַמֵּיהּ וְיַת אַרְעֵיהּ וְתַעֲבֵיד לֵיהּ הֵיכְמָא דַעֲבַדְתָּ לְסִיחוֹן מַלְכָּא דֶאֱמוֹרָאָה דִיתֵיב בְּחֶשְׁבּוֹן", "pj_en": "And the Lord said to me, Fear him not; for into thy hand I have delivered him, and all his people, and his land; and thou shalt do to him as thou hast done to Sihon king of the Amoraah, who dwelt in Heshbon.", "tj": "כֵּיוַן דְּחָמָא משֶׁה יַת עוֹג רַשִׁיעָא זַע וּמַרְתַת מִן קֳדָמוֹי וַאֲמַר הֲלָא דֵין הוּא דַהֲוָה מְחַסֵד לְאַבְהָתָן אַבְרָהָם וְשָרָה וַאֲמַר לְהוֹן אַתּוּן דַּמְיָין לְאִילָנִין שְׁתִילִין עַל מַבּוּעִין דְּמַיָין בְּרַם פֵּירִין לֵית הִינוּן עַבְדִין בְּגִין כֵּן אַמְתִּין לֵיהּ קוּדְשָׁא בְּרִיךְ הוּא יְהֵי שְׁמֵיהּ מְשַׁבַּח אַחְיָיא יָתֵיהּ שְׁנִין סַגִּיאִין מִן בִּגְלַל לְמָחוֹיָא יָתֵיהּ לְדָרַיָא דְהוּא מְסַר יָתֵיהּ בְּיַד בְּנוֹי וַאֲמַר מֵימְרָא דַיְיָ לֵיהּ משֶׁה לָא תִדְחַל מִינֵיהּ אֲרֵי בִּידָךְ מְסָרִית יָתֵיהּ וְיַת כָּל עַמֵיהּ וְיַת אַרְעֵיהּ וְתַעֲבֵיד לֵיהּ הֵיךְ מַה דַעֲבָדַת לְסִיחוֹן מַלְכֵּיהוֹן דֶאֱמוֹרָאֵי דַהֲוָה שָׁרֵי בְּחֶשְׁבּוֹן:", "tj_en": "When Mosheh saw that wicked one, he trembled before him, and said, Is not this he who did scoff at our father Abraham and Sarah, and said to them, Ye are like trees planted by a fountain of water, but ye bear no fruit? Therefore did the Holy One, blessed be He, and let His Name be glorified, cause him to wait, and prolong him many years alive, to show to him the generations, because He would deliver him into the hands of his (Abraham's) children: therefore the Word of the Lord said to Mosheh, Be not afraid of him, for into thy hand have I given him up, and all his people, and his land, and thou shalt do to him as thou hast done to Sihon. king of the Amoraee, who dwelt in Heshbon.", "rashi": "<b>אל תירא אתו.<\/b> וּבְסִיחוֹן לֹא הֻצְרַךְ לוֹמַר אַל תִּירָא אֹתוֹ אֶלָּא מִתְיָרֵא הָיָה מֹשֶׁה שֶׁלֹּא תַעֲמֹד לוֹ זְכוּת שֶׁשִּׁמֵּשׁ לְאַבְרָהָם, שֶׁנֶּאֱמַר (בראשית י\"ד) \"וַיָּבֹא הַפָּלִיט\", וְהוּא עוֹג:", "rashi_en": "אל תירא אתו DO NOT FEAR HIM — In the case of Sihon, however, it did not feel it necessary to state, “Do not fear him״!? But in the case of Og Moses feared lest the merit that he (Og) had been of service to Abraham might avail him, as it is said, (Genesis 14:13: see Rashi thereon), \"And the fugitive came\", and that was Og (Genesis Rabbah 42:8; see Rashi on Numbers 21:34)."}, {"ch": 3, "v": 3, "aliyah": 6, "heb": "וַיִּתֵּן֩ יְהֹוָ֨ה אֱלֹהֵ֜ינוּ בְּיָדֵ֗נוּ גַּ֛ם אֶת־ע֥וֹג מֶֽלֶךְ־הַבָּשָׁ֖ן וְאֶת־כׇּל־עַמּ֑וֹ וַנַּכֵּ֕הוּ עַד־בִּלְתִּ֥י הִשְׁאִֽיר־ל֖וֹ שָׂרִֽיד׃", "onk": "וּמְסַר יְיָ אֱלָהָנָא בִּידָנָא אַף יָת עוֹג מַלְכָּא דְמַתְנָן וְיָת כָּל עַמֵּיהּ וּמְחִנּוֹהִי עַד דְּלָא אִשְׁתָּאַר לֵיהּ מְשֵׁזֵב:", "onk_en": "Adonoy, our God, put into our hand also Og, King of the Boshon, and his entire people; and we smote him without leaving him a survivor.", "pj": "וּמְסַר יְיָ אֱלָהָנָא בִּידָנָא אוּף יַת עוֹג מַלְכָּא דְמַתְנָן וְיַת כָּל עַמֵּיהּ וּמְחִינוֹהִי עַד דְּלָא אִשְׁתַּיַּיר לֵיהּ מְשֵׁזִיב", "pj_en": "And the Lord our God gave up into our hands Og the king of Mathnan, and all his people; and we smote him till no remnant remained to him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 3, "v": 4, "aliyah": 6, "heb": "וַנִּלְכֹּ֤ד אֶת־כׇּל־עָרָיו֙ בָּעֵ֣ת הַהִ֔וא לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר לֹא־לָקַ֖חְנוּ מֵֽאִתָּ֑ם שִׁשִּׁ֥ים עִיר֙ כׇּל־חֶ֣בֶל אַרְגֹּ֔ב מַמְלֶ֥כֶת ע֖וֹג בַּבָּשָֽׁן׃", "onk": "וּכְבַשְׁנָא יָת כָּל קִרְווֹהִי בְּעִדָּנָא הַהִיא לָא הֲוַת קַרְתָּא דִּי לָא נְסִבְנָא מִנְּהוֹן שִׁתִּין קִרְוִין כָּל <b>בֵּית פָּלָךְ טְרָכוֹנָא<\/b> מַלְכְּוָתָא דְעוֹג בְּמַתְנָן:", "onk_en": "We conquered all his cities at that time; there was no city that we did not take from them—sixty cities, the entire province of Argov [<b>Tarchona<\/b>], the kingdom of Og in the Boshon.", "pj": "וְכָבַשְׁנָן יַת כָּל קִירְוֵויהּ בְּעִידָנָא הַהִיא לָא הֲוַת קַרְתָּא דְלָא נְסִיבְנָא מִנְהוֹן שִׁתִּין קִרְוִין כָּל תְּחוּם פְּלַךְ טַרְגוֹנָא מַלְכוּתָא דְעוֹג בְּמַתְנָן", "pj_en": "And we subdued all his cities at that time, there was no city which we took not from them, sixty cities, the whole boundary of Targona, the kingdom of Og in Mathnan.", "tj": "", "tj_en": "", "rashi": "<b>חבל ארגב.<\/b> מְתַרְגְּמִינַן בֵּית פֶּלֶךְ טְרָכוֹנָא, וְרָאִיתִי תַּרְגּוּם יְרוּשַׁלְמִי בִּמְגִלַּת אֶסְתֵּר קוֹרֵא פָּלָטִין טְרָכוֹנִין, לָמַדְתִּי חֶבֶל אַרְגּוֹב הִפַּרְכִיָּא – הֵיכַל מֶלֶךְ, כְּלוֹמַר שֶׁהַמַּלְכוּת נִקְרֵאת עַל שְׁמָהּ; וְכֵן אֶת הָאַרְגּוֹב דִּמְלָכִים (מלכים ב ט״ו:כ״ה), אֵצֶל הֵיכַל מֶלֶךְ הֲרָגוֹ פֶּקַח בֶּן רְמַלְיָהוּ לִפְקַחְיָה בֶן מְנַחֵם, לָמַדְתִּי שֶׁכָּךְ נִקְרָא שֵׁם הִפַּרְכִיָּא:", "rashi_en": "חבל ארגב [ALL] THE LINE OF ARGOB — We render this in the Targum by בית פלך טרכונא Now I have seen that the Jerusalem Targum of
