<!DOCTYPE html>
<html lang="he" dir="rtl">

<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "emor";
const DATA = [{"ch": 21, "v": 1, "aliyah": 1, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה אֱמֹ֥ר אֶל־הַכֹּהֲנִ֖ים בְּנֵ֣י אַהֲרֹ֑ן וְאָמַרְתָּ֣ אֲלֵהֶ֔ם לְנֶ֥פֶשׁ לֹֽא־יִטַּמָּ֖א בְּעַמָּֽיו׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֱמַר לְכַהֲנַיָּא בְּנֵי אַהֲרֹן וְתֵימַר לְהוֹן עַל מִית לָא יִסְתָּאַב בְּעַמֵּיהּ:", "onk_en": "Adonoy said to Moshe; speak, to the <i>kohanim<\/i>, the sons of Aharon, and you shall say to them, let him not defile himself with the dead among his people.", "pj": "ויאמר וַאֲמַר יְיָ לְמשֶׁה אֵימַר לְכַהֲנַיָא בְּנֵי אַהֲרן דְכוּרַיָא דְיִתְפַּרְשׁוּן מִן סְאוֹב וְכִדְנָא תֵימַר לְהוֹן עַל בַּר נַשׁ דְמִית לָא יִסְתָּאֵב בְּעַמֵיהּ", "pj_en": "AND the Lord spake to Mosheh, saying: Speak unto the priests, the men of the children of Aharon, that they keep themselves apart from defilement and thus shalt thou say to them: For a man who is dead, (the priest) shall not defile himself among his people;", "tj": "", "tj_en": "", "rashi": "<b>אמר אל הכהנים.<\/b> אמר ואמרת, לְהַזְהִיר גְּדוֹלִים עַל הַקְּטַנִּים (יבמות קי\"ד):<br><br><b>בני אהרן.<\/b> יָכוֹל חֲלָלִים תַּ\"ל הַכֹּהֲנִים:<br><br><b>בני אהרן.<\/b> אַף בַּעֲלֵי מוּמִין בְּמַשְׁמָע:<br><br><b>בני אהרן.<\/b> וְלֹא בְּנוֹת אַהֲרֹן (ספרא):<br><br><b>לא יטמא בעמיו.<\/b> בְּעוֹד שֶׁהַמֵּת בְּתוֹךְ עַמָּיו, יָצָא מֵת מִצְוָה (שם):", "rashi_en": "אמר אל הכהנים SAY UNTO THE PRIESTS [… AND THOU SHALT SAY UNTO THEM] — “Say\" and again “thou shalt say unto them\" — this repetition is intended to admonish the adults about their children also — that they should teach them to avoid defilement (Yevamot 114a).<br><br>בני אהרן THE SONS OF AARON — One might think that חללים (priests who have lost their priestly status for reasons connected with their birth or marriage) also may not defile themselves by the dead, Scripture therefore states, \"Say unto the priests\", — thus only those sons of Aaron are included who have not lost their priestly character; consequently חללים are excluded (Sifra, Emor, Section 1 1) . <br><br>בני אהרן THE SONS OF AARON — This implies also those of Aaron's sons who have a bodily blemish;<br><br>בני אהרן THE SONS OF AARON — but not the daughters of Aaron (Sifra, Emor, Section 1 1).<br><br>לא יטמא בעמיו THERE SHALL NONE BE DEFILED BY THE DEAD AMONG HIS PEOPLES — This means, as long as the dead is among his peoples (i. e. so long as there are some of his people — Jews — who can occupy themselves with his burial) thus excluding the case of a מת מצוה (a corpse of a person whose relatives are unknown or which lies in a place where there are no Jews, nor are there any in the near vicinity; cf. Nazir 43b) in which case the priest is allowed to make himself unclean by handling the corpse (Sifra, Emor, Section 1 3)."}, {"ch": 21, "v": 2, "aliyah": 1, "heb": "כִּ֚י אִם־לִשְׁאֵר֔וֹ הַקָּרֹ֖ב אֵלָ֑יו לְאִמּ֣וֹ וּלְאָבִ֔יו וְלִבְנ֥וֹ וּלְבִתּ֖וֹ וּלְאָחִֽיו׃", "onk": "אֶלָּהֵן לְקָרִיבֵיהּ דְּקָרִיב לֵיהּ לְאִמֵּיהּ וְלַאֲבוּהִי וְלִבְרֵיהּ וְלִבְרַתֵּיהּ וְלַאֲחוּהִי:", "onk_en": "Except to his kin to whom he is closely related, for his mother and his father, for his son, his daughter and for his brother.", "pj": "אֱלָהֵן לְאִנְתְּתָא דִקְרִיבָא לְגוּפֵיהּ לְאִימֵיהּ וּלְאָבוֹי וְלִבְרֵיהּ וְלִבְרַתֵּיהּ וּלְאָחוֹי", "pj_en": "but for a woman who is of kin to his flesh, for his daughter, and for his father, and for his son, and for his daughter, and for his brother,", "tj": "", "tj_en": "", "rashi": "<b>כי אם לשארו.<\/b> אֵין שְׁאֵרוֹ אֶלָּא אִשְׁתּוֹ (שם; יבמות כ\"ב):", "rashi_en": "כי אם לשארו BUT FOR HIS KIN [THAT IS NEAR TO HIM] — שאר here denotes his wife (Sifra, Emor, Section 1 4; Yevamot 22b)."}, {"ch": 21, "v": 3, "aliyah": 1, "heb": "וְלַאֲחֹת֤וֹ הַבְּתוּלָה֙ הַקְּרוֹבָ֣ה אֵלָ֔יו אֲשֶׁ֥ר לֹֽא־הָיְתָ֖ה לְאִ֑ישׁ לָ֖הּ יִטַּמָּֽא׃", "onk": "וְלַאֲחָתֵיהּ בְּתֻלְתָּא דְּקָרִיבָא לֵיהּ דִּי לָא הֲוַת לִגְבָר לַהּ יִסְתָּאָב:", "onk_en": "For his virgin sister, to whom he is closely related, who has not yet been married, for her, he may be defiled.", "pj": "וּלְאַחְתֵיהּ בְּתוּלְתָּא דִקְרִיבָא לֵיהּ וְלָא מְאַרְסָא וּדְעַד כְּדוֹן לָא הֲוַת מִיבְעֲלָא לִגְבַר לָהּ יִסְתָּאֵב", "pj_en": "and for his sister, a virgin who is nigh to him, and who hath neither been betrothed, nor married to a husband, for her he may defile himself.", "tj": "", "tj_en": "", "rashi": "<b>הקרובה.<\/b> לְרַבּוֹת אֶת הָאֲרוּסָה (ספרא; יבמות ס'):<br><br><b>אשר לא היתה לאיש.<\/b> לְמִשְׁכָּב:<br><br><b>לה יטמא.<\/b> מִצְוָה (ספרא; זבחים ק'):", "rashi_en": "הקרובה [AND FOR HIS SISTER A VIRGIN] THAT IS NIGH UNTO HIM — This is intended to include  the sister who was only betrothed and has therefore not yet left her father's house and who is consequently still near to him (Sifra, Emor, Section 1 1; Yevamot 60a), for it continues <br><br>אשר לא היתה לאיש, WHO HATH HAD NO HUSBAND — i. e. who has not yet entered into marital relations with him:<br><br>לה יטמא — This is a command, [and the translation is: FOR HER HE SHALL DEFILE HIMSELF, not, “he may defile himself”] (Sifra, Emor, Section 1 12; Zevachim 100a)."}, {"ch": 21, "v": 4, "aliyah": 1, "heb": "לֹ֥א יִטַּמָּ֖א בַּ֣עַל בְּעַמָּ֑יו לְהֵ֖חַלּֽוֹ׃", "onk": "לָא יִסְתָּאַב <b>רַבָּא בְעַמֵּיהּ<\/b> לְאַחֲלוּתֵיהּ:", "onk_en": "A husband [<b>An honored one among his people<\/b>] may not defile himself among his people [for a wife through whom] he becomes profaned.", "pj": "לָא יִסְתָּאֵב בַּעֲלָא לְאִיתְּתֵיהּ אֱלָהֵן כַּד כַּשְׁרָא לֵיהּ בְּרַם לִקְרֵיבָא דְהִינוּן עַבְדִין עוֹבְדֵי עַמֵיהּ יִתְחַל עֲלֵיהוֹן", "pj_en": "The husband shall not defile himself on account of his wife, except so far as it is right for him; but for a relative of those who do the work of his people he may defile himself.", "tj": "", "tj_en": "", "rashi": "<b>לא יטמא בעל בעמיו להחלו.<\/b> לֹא יִטַּמָּא לְאִשְׁתּוֹ פְּסוּלָה שֶׁהוּא מְחֻלָּל בָּהּ בְּעוֹדָהּ עִמּוֹ, וְכֵן פְּשׁוּטוֹ שֶׁל מִקְרָא: לֹא יִטַּמָּא בַּעַל בִּשְׁאֵרוֹ בְּעוֹד שֶׁהוּא בְּתוֹךְ עַמָּיו — שֶׁיֵּשׁ לָהּ קוֹבְרִין, שֶׁאֵינָהּ מֵת מִצְוָה, וּבְאֵיזֶה שְׁאֵר אָמַרְתִּי? בְּאוֹתוֹ שֶׁהוּא לְהֵחַלּוֹ — לְהִתְחַלֵּל הוּא מִכְּהֻנָּתוֹ (עי' ספרא; יבמות צ'):", "rashi_en": "לא יטמא בעל בעמיו להחלו This means: he shall not defile himself for his wife if she is really unfitted to be his wife (because he is a כהן) and through whom he consequently becomes profaned as a priest, so long as she remains with him (Sifra, Emor, Section 1 15). The following, therefore, is the literal exposition of the verse: לא יטמא בעל, a husband shall not defile himself for his wife's corpse while it is among its people, which means that there are persons who can bury her so that she is not a מת מצוה (cf. Rashi’s explanation of בעמיו on v. 1). And with reference to what kind of wife do I say this? With reference to such a one who להחלו, i. e. who leads to his being profaned and therefore disqualified from his priestly duties so long as she remains with him (cf. Sifra, Emor, Section 1 15; Yevamot 90b)."}, {"ch": 21, "v": 5, "aliyah": 1, "heb": "לֹֽא־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[יִקְרְח֤וּ]<\/span> <span class=\"mam-kq-k\">(יקרחה)<\/span><\/span> קׇרְחָה֙ בְּרֹאשָׁ֔ם וּפְאַ֥ת זְקָנָ֖ם לֹ֣א יְגַלֵּ֑חוּ וּבִ֨בְשָׂרָ֔ם לֹ֥א יִשְׂרְט֖וּ שָׂרָֽטֶת׃", "onk": "לָא יִמְרְטוּן מְרַט בְּרֵישְׁהוֹן וּפָאתָא דְדִקְנְהוֹן לָא יְגַלְּחוּן וּבְבִשְׂרְהוֹן לָא יְחַבְּלוּן חִבּוּל:", "onk_en": "They shall not make baldness on their heads and the corners of their beards they shall not shave, and they shall not make gashes in their flesh.", "pj": "לָא יְרַשְׁמוּן בֵּין עֵינֵיהוֹן וְלָא רוֹשַׁם בְּרֵישֵׁיהוֹן וְאוּמָנָא דִיקָנֵיהוֹן לָא יִסְפְּרוּן וּבִבְשָרֵיהוֹן לָא יְחַבְּלוּן חִבּוּל", "pj_en": "They shall not mark themselves between their eyes, nor set a mark upon their heads, nor cut away the corners of their beards, nor make any incision in their flesh:", "tj": "", "tj_en": "", "rashi": "<b>לא יקרחה קרחה.<\/b> עַל מֵת וַהֲלֹא אַף יִשְׂרָאֵל הֻזְהֲרוּ עַל כָּךְ? אֶלָּא לְפִי שֶׁנֶּאֱמַר בְּיִשְׂרָאֵל בֵּין עֵינֵיכֶם (דברים י\"ד), יָכוֹל לֹא יְהֵא חַיָּב עַל כָּל הָרֹאשׁ, תַּ\"ל בְּרֹאשָׁם, וְיִלָּמְדוּ יִשְׂרָאֵל מִכֹּהֲנִים בִּגְזֵרָה שָׁוָה, נֶאֱמַר כָּאן קָרְחָה וְנֶאֱמַר בְּיִשְׂרָאֵל קָרְחָה, מַה כָּאן כָּל הָרֹאשׁ אַף לְהַלָּן כָּל הָרֹאשׁ בְּמַשְׁמָע — כָּל מָקוֹם שֶׁיִּקְרַח בָּרֹאשׁ, וּמַה לְּהַלָּן עַל מֵת, אַף כָּאן עַל מֵת (מכות כ'):<br><br><b>ופאת זקנם לא יגלחו.<\/b> לְפִי שֶׁנֶּאֱמַר בְּיִשְֹרָאֵל לֹא תַשְׁחִית, יָכוֹל לִקְּטוֹ בְּמַלְקֵט וּרְהִיטְנִי יְהֵא חַיָּב, לְכָךְ נֶאֱמַר לֹא יְגַלֵּחוּ. שֶׁאֵינוֹ חַיָּב אֶלָּא עַל דָּבָר הַקָּרוּי גִּלּוּחַ וְיֵשׁ בּוֹ הַשְׁחָתָה, וְזֶהוּ תַעַר (שם):<br><br><b>ובבשרם לא ישרטו שרטת.<\/b> לְפִי שֶׁנֶּאֱמַר בְּיִשְׂרָאֵל וְשֶׂרֶט לָנֶפֶשׁ לֹא תִתְּנוּ (ויקרא י\"ט), יָכוֹל שָׂרַט חָמֵשׁ שְׂרִיטוֹת לֹא יְהֵא חַיָּב אֶלָּא אַחַת, תַּ\"ל לֹא יִשְׂרְטוּ שָׂרָטֶת, לְחַיֵּב עַל כָּל שְׂרִיטָה וּשְׂרִיטָה, שֶׁתֵּבָה זוֹ יְתֵרָה הִיא לִדְרֹשׁ, שֶׁהָיָה לוֹ לִכְתֹּב לֹא יִשְׂרְטוּ וַאֲנִי יוֹדֵעַ שֶׁהִיא שָׂרֶטֶת (ספרא; מב' כ'):", "rashi_en": "לא יקרחו קרחה THEY SHALL NOT MAKE BALDNESS [UPON THEIR HEAD] for the dead. But were not the ordinary Israelites also forbidden in respect of this? Why then is this law especially stated with reference to the priests? But because in the prohibition addressed to the ordinary Israelites it is stated, (Deuteronomy 14:1) “[Ye shall not make  anybaldness] between your eyes [for the dead]”, I might think that one is not liable to punishment for making baldness on any other part of the whole head, Scripture therefore states here: “upon their heads”; and now that we have both commands, the law regarding the Israelites may be derived from that addressed to the priests from a similarity of terms used in both prohibitions: the term “קרחה” is used here, and in the prohibition regarding the Israelites it also uses the term “קרחה”; what is the case here? The prohibition applies to the whole head! So, also, there the whole head is included in the prohibition. And, on the other hand, how is the case there? The prohibition is limited to making baldness for the dead! So here too it applies only to such baldness as is made for the dead (Makkot 20a; Kiddushin 36a).<br><br>ופאת זקנם לא יגלחו NEITHER SHALL THEY RAZE THE CORNER OF THEIR BEARD — Because it is written in the prohibition addressed to the ordinary Israelites, (Leviticus 19:27) “thou shalt not destroy (תשחית) [the corners of thy beard]”, I might think if one took it (the hair) off with a מלקט or a רהיטני, tweezers or plane-like or file-like tools that may be used for destroying the hair, he is guilty of violating the law! Scripture therefore states here \"they shall not raze off (לא יגלחו) the corner of their beard\", the two statements supplementing each other, thus teaching that one is liable only for the use of an instrument the employment of which is termed גילוח (razing), and  ,which at the same time, involves  the destruction of the hair, and this results only from the use of a razor (Makkot 21a).<br><br>ובבשרם לא ישרטו שרטת NOR SHALL THEY MAKE ANY INCISION IN THEIR FLESH — This is stated in addition to the law in Leviticus 19:28 for the following reason: Because it is said there of the ordinary Israelites “and ye shall not make a cutting in your flesh for the dead”, I might think that if one made five incisions at the same time he is liable to the punishment of lashes only once, Scripture therefore states here: לא ישרטו שרטת “they shall not incise an incision\" to make one liable for each and every incision — for this word (שרטת) would be redundant if it added nothing to the previous prohibition and must therefore have been added for the purpose of deriving an Halacha, since it ought to have written only לא ישרטו  and I would then have known that it refers to making incisions and consequently the intention of Scripture by using the term \"they shall not incise an incision\" is to make one liable to punishment for each incision (cf. Sifra, Emor, Chapter 1 4)."}, {"ch": 21, "v": 6, "aliyah": 1, "heb": "קְדֹשִׁ֤ים יִהְיוּ֙ לֵאלֹ֣הֵיהֶ֔ם וְלֹ֣א יְחַלְּל֔וּ שֵׁ֖ם אֱלֹהֵיהֶ֑ם כִּי֩ אֶת־אִשֵּׁ֨י יְהֹוָ֜ה לֶ֧חֶם אֱלֹהֵיהֶ֛ם הֵ֥ם מַקְרִיבִ֖ם וְהָ֥יוּ קֹֽדֶשׁ׃", "onk": "קַדִּישִׁין יְהוֹן <b>קֳדָם<\/b> אֱלָהֲהוֹן וְלָא יְחַלּוּן שְׁמָא דֶּאֱלָהֲהוֹן אֲרֵי יָת <b>קֻרְבְּנַיָּא<\/b> דַיְיָ <b>קֻרְבָּן<\/b> אֱלָהֲהוֹן אִנּוּן מַקְרִיבִין וִיהוֹן קַדִּישִׁין:", "onk_en": "They shall be holy to [<b>before<\/b>] their God and they shall not profane the Name of their God, for [it is] the fire-offerings [<b>offerings<\/b>] of Adonoy, the bread [<b>sacrifice<\/b>] of their God [that] they bring [offer], and they must [therefore] be holy.", "pj": "קַדִישִׁין יְהוֹן קֳדָם אֱלָהָהוֹן וְלָא יִפְסוּן יַת שְׁמָא דֶאֱלָהָהוֹן אֲרוּם יַת קוּרְבָּנַיָא דַיְיָ תִּקְרוּבְתָּא דֶאֱלָהָהוֹן הִינוּן מַקְרִיבִין וִיהוֹן קַדִישִׁין בְּגוּפֵיהוֹן", "pj_en": "but they shall be holy before their God, and shall not profane the name of their God;", "tj": "וְלָא יִפְסוּן:", "tj_en": "They shall not profane", "rashi": "<b>קדשים יהיו.<\/b> עַל כָּרְחָם יַקְדִּישׁוּם בֵּית דִּין בְּכָךְ (ספרא):", "rashi_en": "קדשים יהיו THEY SHALL BE HOLY — even against their will — the court shall force them to remain holy in respect to this (Sifra, Emor, Chapter 1 6)."}, {"ch": 21, "v": 7, "aliyah": 1, "heb": "אִשָּׁ֨ה זֹנָ֤ה וַחֲלָלָה֙ לֹ֣א יִקָּ֔חוּ וְאִשָּׁ֛ה גְּרוּשָׁ֥ה מֵאִישָׁ֖הּ לֹ֣א יִקָּ֑חוּ כִּֽי־קָדֹ֥שׁ ה֖וּא לֵאלֹהָֽיו׃", "onk": "אִתְּתָא <b>מַטְעֲיָא<\/b> וּמְחַלְּלָא לָא יִסְּבוּן וְאִתְּתָא דִּמְתָרְכָא מִבַּעְלַהּ לָא יִסְּבוּן אֲרֵי קַדִּישׁ הוּא <b>קֳדָם<\/b> אֱלָהֵיהּ:", "onk_en": "A harlot [<b>One who strays<\/b>] or a profaned woman they shall not marry. A woman divorced from her husband they shall not marry, for he is holy to [<b>before<\/b>] his God.", "pj": "אִתְּתָא מַטְעַיָא בִּזְנוּ וּדְאִתְיְלִידָא מִן פְּסוּלַיָא לָא יִסְבּוּן וְאִתְּתָא דְמִפְטְרָא בֵּין מִגַבְרָא בֵּין מִן יְבָמָהּ לָא יִסְבּוּן אֲרוּם קַדִישׁ הוּא קֳדָם אֱלָהֵיהּ", "pj_en": "They shall not take to wife a woman who hath gone astray by fornication, or who was born illegitimate, nor a woman who hath been put away, whether from her husband or the husband's brother, may they take; for he is to be holy before his God.", "tj": "אִתְּתָא זְנוּ וּמַפְסָא:", "tj_en": "A woman a fornicatress, or profane.", "rashi": "<b>זנה.<\/b> שֶׁנִּבְעֲלָה בְעִילַת יִשְׂרָאֵל הָאָסוּר לָהּ, כְּגוֹן חַיָּבֵי כָּרֵתוֹת אוֹ נָתִין אוֹ מַמְזֵר (ספרא; יבמות ס\"א):<br><br><b>חללה.<\/b> שֶׁנּוֹלְדָה מִן הַפְּסוּלִים שֶׁבַּכְּהֻנָּה, כְּגוֹן בַּת אַלְמָנָה מִכֹּהֵן גָּדוֹל אוֹ בַת גְּרוּשָׁה (וַחֲלוּצָה) מִכֹּהֵן הֶדְיוֹט, וְכֵן שֶׁנִּתְחַלְּלָה מִן הַכְּהֻנָּה עַל יְדֵי בִיאַת אֶחָד מִן הַפְּסוּלִים לִכְהֻנָּה (עי' ספרא, קידושין ע\"ז):", "rashi_en": "זנה is a woman who had sexual intercourse with an Israelite who is forbidden to her as a husband, for instance, with those whom she may not marry under the penalty of excision, or a Gibeonite or a ממזר (that is, a man born from the union of a couple who are liable to excision for such a union) (cf. Sifra, Emor, Chapter 1 7; Yevamot 61b).<br><br>חללה — This is a woman born from a marriage which is forbidden to the priesthood alone (Kiddushin 77a), e. g., the daughter of a widow and a high priest, or the daughter of a divorced woman [or one released from levirate marriage by the appropriate ceremony (cf. Deuteronomy 25:9)] and an ordinary priest. So also it denotes a woman who became profaned in respect to the priesthood (who lost the right of marrying a priest) through her having previously entered into a union with one of those priests a marriage with whom comes under the term: \"marriages forbidden to the priesthood alone”."}, {"ch": 21, "v": 8, "aliyah": 1, "heb": "וְקִ֨דַּשְׁתּ֔וֹ כִּֽי־אֶת־לֶ֥חֶם אֱלֹהֶ֖יךָ ה֣וּא מַקְרִ֑יב קָדֹשׁ֙ יִֽהְיֶה־לָּ֔ךְ כִּ֣י קָד֔וֹשׁ אֲנִ֥י יְהֹוָ֖ה מְקַדִּשְׁכֶֽם׃", "onk": "וּתְקַדְּשִׁנֵּיהּ אֲרֵי יָת <b>קֻרְבַּן<\/b> אֱלָהָךְ הוּא מְקָרֵב קַדִּישׁ יְהֵי לָךְ אֲרֵי קַדִּישׁ אֲנָא יְיָ מְקַדִּשְׁכוֹן:", "onk_en": "You shall make him holy for he offers the bread [<b>sacrifice<\/b>] of your God; he shall be holy unto you for I, Adonoy, am holy, Who makes you holy.", "pj": "וְתַקְדְשִׁינֵיהּ לְכַהֲנָא אֲרוּם יַת קוּרְבַּן אֱלָהָךְ הוּא מַקְרִיב קַדִישׁ יְהֵי לָךְ וְלָא תַפְסִינֵיהּ אֲרוּם קַדִישׁ אֲנָא יְיָ מְקַדִשְׁכוֹן", "pj_en": "Thou shalt sanctify him unto the priesthood; for the oblation itself of thy God he is to offer: he shall be holy to thee, and thou shalt not make him profane: I, the Lord who sanctify you, am holy.", "tj": "", "tj_en": "", "rashi": "<b>וקדשתו.<\/b> עַל כָּרְחוֹ, שֶׁאִם לֹא רָצָה לְגָרֵשׁ הַלְקֵהוּ וְיַסְּרֵהוּ עַד שֶׁיְּגָרֵשׁ (ספרא; יבמות פ\"ח):<br><br><b>קדש יהיה לך.<\/b> נְהֹג בּוֹ קְדֻשָּׁה, לִפְתֹּחַ רִאשׁוֹן בְּכָל דָּבָר וּלְבָרֵךְ רִאשׁוֹן בַּסְּעוּדָה (הוריות י\"ב):", "rashi_en": "וקדשתו THOU SHALT SANCTIFY HIM — even against his will; it means that if he is not willing to divorce the woman whom he had illegally married flog him (מלקות ארבעים) and chastise him (מכות מרדות) until he divorces her (Sifra, Emor, Chapter 1 13; Yevamot 88b).<br><br>קדש יהיה לך HE SHALL BE HOLY UNTO THEE — holy unto thee: treat him with sanctity (as someone holy) — that he should be the first in all holy matters (e. g., the reading of the law) and that he should have the first right to recite the benedictions at a meal (המוציא and ברכת המזון) (Gittin 59b; cf. Rashi on Nedarim 62b)."}, {"ch": 21, "v": 9, "aliyah": 1, "heb": "וּבַת֙ אִ֣ישׁ כֹּהֵ֔ן כִּ֥י תֵחֵ֖ל לִזְנ֑וֹת אֶת־אָבִ֙יהָ֙ הִ֣יא מְחַלֶּ֔לֶת בָּאֵ֖שׁ תִּשָּׂרֵֽף׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבַת גְּבַר כָּהֵן אֲרֵי תִתְחַל <b>לְמִטְעֵי מִקְּדֻשַּׁת אֲבוּהָ הִיא מִתַּחֲלָא<\/b> בְּנוּרָא תִּתּוֹקָד:", "onk_en": "The daughter of a <i>kohein<\/i>, who profanes herself by fornication [<b>straying<\/b>]—she profanes her father—[<b>she becomes profane with respect to her father’s holiness<\/b>] she shall be burned with fire.", "pj": "וּבְרַת גְבַר כָּהִין מְאַרְסָא אֲרוּם תָּפִיס גַרְמָהּ לְמִטְעֵי בִּזְנֵי עַד דְהִיא עִם בֵּית אָבוּהָא וְזַנְיַת בְּנוּרָא תִּתּוֹקָד", "pj_en": "And if the betrothed daughter of a man of the priesthood profane herself, by going astray in fornication; if, while she is yet in her father's house, she is guilty of fornication, she shall be burned with fire.", "tj": "", "tj_en": "", "rashi": "<b>כי תחל לזנות.<\/b> כְּשֶׁתִּתְחַלֵּל עַ\"יְ זְנוּת, שֶׁהָיְתָה בָהּ זִקַּת בַּעַל וְזָנְתָה, אוֹ מִן הָאֵרוּסִין אוֹ מִן הַנִּשּׂוּאִין; וְרַבּוֹתֵינוּ נֶחְלְקוּ בַדָּבָר וְהַכֹּל מוֹדִים שֶׁלֹּא דִּבֵּר הַכָּתוּב בִּפְנוּיָה (עי' סנהדרין נ\"א):<br><br><b>את אביה היא מחללת.<\/b> חִלְּלָה וּבִזְּתָה אֶת כְּבוֹדוֹ, שֶׁאוֹמְרִים עָלָיו אָרוּר שֶׁזּוֹ יָלַד, אָרוּר שֶׁזּוֹ גִּדֵּל (שם):", "rashi_en": "כי תחל לזנות means, if she profanes herself through unchastity, i. e. that a marriage-tie of some kind applied to her and she nevertheless prostituted herself either after betrothal (which constituted a kind of marriage-tie, since she would require a bill of divorce to enable her to marry someone else) or after marriage (having left her father's house for her husband’s). Our Rabbis are of different opinions regarding this (whether Scripture speaks here of an ארוסה  or a נשואה), but all agree that Scripture is not speaking of a פנויה (a woman who is neither betrothed nor married) (cf. Sanhedrin 51b).<br><br>את אביה היא מחללת SHE PROFANETH HER FATHER — i. e. she profanes and makes light of his honor by her conduct (מחללת does not mean she causes him to become a חלל, one unfit for priestly service), in that people say about him, \"Cursed be he who has engendered this woman; — cursed be he who has reared this woman” (Sanhedrin 52a)."}, {"ch": 21, "v": 10, "aliyah": 1, "heb": "וְהַכֹּהֵן֩ הַגָּד֨וֹל מֵאֶחָ֜יו אֲֽשֶׁר־יוּצַ֥ק עַל־רֹאשׁ֣וֹ&thinsp;<b>׀<\/b> שֶׁ֤מֶן הַמִּשְׁחָה֙ וּמִלֵּ֣א אֶת־יָד֔וֹ לִלְבֹּ֖שׁ אֶת־הַבְּגָדִ֑ים אֶת־רֹאשׁוֹ֙ לֹ֣א יִפְרָ֔ע וּבְגָדָ֖יו לֹ֥א יִפְרֹֽם׃", "onk": "וְכַהֲנָא דְאִתְרַבָּא מֵאֲחוֹהִי דְּ יִתָּרִיק עַל רֵישֵׁיהּ מִשְׁחָא <b>דִרְבוּתָא<\/b> וְדִי <b>קָרִיב יָת קֻרְבָּנֵיהּ<\/b> לְמִלְבַּשׁ יָת לְבוּשַׁיָּא יָת רֵישֵׁיהּ לָא יְרַבֵּי פֵרוּעַ וּלְבוּשׁוֹהִי לָא יִבְזַע:", "onk_en": "The <i>kohein<\/i> who is greatest among his brethren upon whose head was poured the anointing oil [<b>which inaugurates to greatness<\/b>]; whose hands [<b>sacrifices<\/b>] were consecrated [<b>offered<\/b>] to put on the special garments; shall not let his hair grow wild and he shall not tear his garments.", "pj": "וְכַהֲנָא רַבָּא דְמִתְרַבְרַב עַל אָחוֹי דִי יִתְרוֹק עַל רֵישֵׁיהּ מִשְׁחָא דִרְבוּתָא וּדְיִקְרַב יַת קוּרְבָּנֵיהּ לְמִלְבּוֹשׁ יַת לְבוּשַׁיָא יַת רֵישֵׁיהּ לָא יִרְבֵּי פֵירוּעַ וּלְבוּשׁוֹי לָא יְבַזַע בְּשַׁעַת אֲנִיקֵי", "pj_en": "And the high priest who hath been anointed over his brethren, and upon whose head the anointing oil was poured, and who offered his oblation to be arrayed in the (holy) robes, shall not make his head bare, nor either rend or tear his garment in the hour of grief.", "tj": "", "tj_en": "", "rashi": "<b>לא יפרע.<\/b> לֹא יְגַדֵּל פֶּרַע עַל אֵבֶל, וְאֵיזֶהוּ גִּדּוּל פֶּרַע? יוֹתֵר מִשְּׁלוֹשִׁים יוֹם (שם):", "rashi_en": "לא יפרע [THE HAIR OF HIS HEAD] SHALL HE NOT DISARRANGE — i.e. he shall not let his hair grow wild on account of ritual mourning for the death of a near relative (Sifra). And what is called \"letting the hair grow wild”? Leaving it uncut for more than 30 days (Sanhedrin 22b)."}, {"ch": 21, "v": 11, "aliyah": 1, "heb": "וְעַ֛ל כׇּל־נַפְשֹׁ֥ת מֵ֖ת לֹ֣א יָבֹ֑א לְאָבִ֥יו וּלְאִמּ֖וֹ לֹ֥א יִטַּמָּֽא׃", "onk": "וְעַל כָּל נַפְשַׁת מֵתָא לָא יֵיעוֹל לַאֲבוּהִי וּלְאִמֵּיהּ לָא יִסְתָּאָב:", "onk_en": "And adjacent to any dead body he shall not enter. For his father and mother he shall not become [ritually] impure.", "pj": "וּלְוַת כָּל בַּר נַשׁ דְמִית לָא יֵיעוֹל לְאָבוֹי וּלְאִמֵיהּ לָא יִסְתָּאָב", "pj_en": "Nor unto any person who is dead shall he go in, nor for his father or his mother make himself unclean.", "tj": "", "tj_en": "", "rashi": "<b>ועל כל נפשת מת וגו'.<\/b> בְּאֹהֶל הַמֵּת:<br><br><b>נפשת מת.<\/b> לְהָבִיא רְבִיעִית דָּם מִן הַמֵּת שֶׁמְּטַמֵּא בָאֹהֶל (שם):<br><br><b>לאביו ולאמו לא יטמא.<\/b> לֹא בָא אֶלָּא לְהַתִּיר לוֹ מֵת מִצְוָה (ספרא; נזיר מ\"ז):", "rashi_en": "'ועל כל נפשת מת וגו‎‎ means, he shall not go into a tent wherein is a corpse. <br><br>נפשת מת — The word נפשת, which appears redundant, is intended to include a quarter of a log of the blood of a corpse — to intimate that even this, as a corpse itself, makes men and vessels unclean through being in a \"tent” in which it happens to be (Sanhedrin 4a).<br><br>לאביו ולאמו לא יטמא NOR SHALL HE DEFILE HIMSELF FOR HIS FATHER OR FOR HIS MOTHER — By these words which appear redundant, since אביו ואמו are included in כל נפשת מת, Scripture has no other intention than to permit him to defile himself for a מת מצוה (cf. v. 1) (Sifra, Emor, Section 2 4; Nazir 47b)."}, {"ch": 21, "v": 12, "aliyah": 1, "heb": "וּמִן־הַמִּקְדָּשׁ֙ לֹ֣א יֵצֵ֔א וְלֹ֣א יְחַלֵּ֔ל אֵ֖ת מִקְדַּ֣שׁ אֱלֹהָ֑יו כִּ֡י נֵ֠זֶר שֶׁ֣מֶן מִשְׁחַ֧ת אֱלֹהָ֛יו עָלָ֖יו אֲנִ֥י יְהֹוָֽה׃", "onk": "וּמִין מַקְדְּשָׁא לָא יִפּוֹק וְלָא יַחֵל יָת מַקְדְּשָׁא דֶאֱלָהֵיהּ אֲרֵי כְּלִיל מְשַׁח <b>רְבוּתָא<\/b> דֶאֱלָהֵיהּ עֲלוֹהִי אֲנָא יְיָ:", "onk_en": "He shall not depart from the Sanctuary and he shall not profane his Gods Sanctuary, for the crown of his Gods anointing oil [<b>which inaugurates to greatness<\/b>] is upon him, I am Adonoy.", "pj": "וּמִן מַקְדְשָׁא לָא יִפּוֹק וְלָא יָפִיס יַת מַקְדְשָׁא דֶאֱלָהֵיהּ אֲרוּם מְשַׁח רְבוּת אֱלָהֵיהּ עֲלוֹי אֲנָא יְיָ", "pj_en": "And he shall not go forth from the sanctuary, or profane the sanctuary of his God; for the anointing oil of his God is upon him: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ומן המקדש לא יצא.<\/b> אֵינוֹ הוֹלֵךְ אַחַר הַמִּטָּה (סנהדרין י\"ח), וְעוֹד מִכָּאן לָמְדוּ רַבּוֹתֵינוּ שֶׁכֹּהֵן גָּדוֹל מַקְרִיב אוֹנֵן, וְכֵן מַשְׁמָעוֹ: אַף אִם מֵתוּ אָבִיו וְאִמּוֹ אֵינוֹ צָרִיךְ לָצֵאת מִן הַמִּקְדָּשׁ אֶלָּא עוֹבֵד עֲבוֹדָה:<br><br><b>ולא יחלל את מקדש.<\/b> שֶׁאֵינוֹ מְחַלֵּל בְּכָךְ אֶת הָעֲבוֹדָה, שֶׁהִתִּיר לוֹ הַכָּתוּב, הָא כֹּהֵן הֶדְיוֹט שֶׁעָבַד אוֹנֵן חִלֵּל (זבחים ט\"ז; סנהדרין פ\"ח):", "rashi_en": "ומן המקדש לא יצא NEITHER SHALL HE GO OUT FROM THE SANCTUARY — This means that he must not follow the bier (attend the funeral of his father or mother) (Sanhedrin 18a). Our Rabbis further derived from this (Sanhedrin 84a) the Halacha that the High Priest may perform the sacrificial rites when an “Onan”. The following is how this is implied: even if his father or his mother died he is not required to leave the Sanctuary as may be assumed, but may perform the service;<br><br>ולא יחלל את מקדש means because he does not thereby (by remaining in the Sanctuary) profane the sacred service, since Scripture permits him to remain and to perform it; it follows therefore that an ordinary priest who officiated when an \"Onan\" did profane the service (Zevachim 16a; Sanhedrin 84a)."}, {"ch": 21, "v": 13, "aliyah": 1, "heb": "וְה֕וּא אִשָּׁ֥ה בִבְתוּלֶ֖יהָ יִקָּֽח׃", "onk": "וְהוּא אִתְּתָא בִּבְתֻלְתָּהָא יִסָּב:", "onk_en": "He shall marry [only] a virgin.", "pj": "וְהוּא אִיתָא דְאִית בָּהּ בְּתוּלָהָא יִסַב", "pj_en": "And he shall take a wife who is in her virginity;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 14, "aliyah": 1, "heb": "אַלְמָנָ֤ה וּגְרוּשָׁה֙ וַחֲלָלָ֣ה זֹנָ֔ה אֶת־אֵ֖לֶּה לֹ֣א יִקָּ֑ח כִּ֛י אִם־בְּתוּלָ֥ה מֵעַמָּ֖יו יִקַּ֥ח אִשָּֽׁה׃", "onk": "אַרְמְלָא וּמְתָרְכָא וְחַלִּילָא <b>מַטְעֲיָא<\/b> יָת אִלֵּין לָא יִסָּב אֱלָהֵן בְּתֻלְתָּא מֵעַמֵּיהּ יִסַּב אִתְּתָא:", "onk_en": "A widow, divorcee, profaned woman or harlot [<b>one who strays<\/b>]; he may not marry [any] of these. But only a virgin from his own people may he marry.", "pj": "אַרְמְלָא וּמִפְטְרָא וּדְאִיתְיְלִידָא מִן פִּיסוּלַיָא וּמַטְעַיָא בִּזְנוּ יַת אִילֵין לָא יִסַב אֱלָהֵן בְּתוּלְתָּא מִיכַשְׁרָא מִבְּנַת עַמֵיהּ יִסַב אִתְּתָא", "pj_en": "but a widow, or a divorced person, or one who was born of depraved parents, or who hath gone astray by fornication, such as these be shall not take; but a virgin proper shall he take to wife from the daughters of his people.", "tj": "", "tj_en": "", "rashi": "<b>וחללה.<\/b> שֶׁנּוֹלְדָה מִפְּסוּלֵי כְהֻנָּה (קידושין ע\"ז):", "rashi_en": "וחללה OR A PROFANE [SHALL HE NOT TAKE] — i. e. a woman born from marriages forbidden to the priesthood alone (cf. v.7) (Sifra, Emor, Chapter 2 3)."}, {"ch": 21, "v": 15, "aliyah": 1, "heb": "וְלֹֽא־יְחַלֵּ֥ל זַרְע֖וֹ בְּעַמָּ֑יו כִּ֛י אֲנִ֥י יְהֹוָ֖ה מְקַדְּשֽׁוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְלָא יַחֵל זַרְעֵיהּ בְּעַמֵּיהּ אֲרֵי אֲנָא יְיָ מְקַדְּשֵׁיהּ:", "onk_en": "He shall not profane his offspring among his people, for I am Adonoy, who makes him holy.", "pj": "וְלָא יָפִיס זַרְעֵיהּ בְּעַמֵיהּ אֲרוּם אֲנָא יְיָ מְקַדְשֵׁיהּ", "pj_en": "Neither shall he profane his offspring among his people; for I the Lord do sanctify him.", "tj": "", "tj_en": "", "rashi": "<b>ולא יחלל זרעו.<\/b> הָא אִם נָשָׂא אַחַת מִן הַפְּסוּלוֹת, זַרְעוֹ הֵימֶנָּה חָלָל מִדִּין קְדֻשַּׁת כְּהֻנָּה (שם):", "rashi_en": "ולא יחלל זרעו NEITHER SHALL HE PROFANE  HIS  SEED  —  ,thus if he marries one of these women disqualified for a union with him his offspring (זרעו) from her becomes “profaned\" (חלל) being exempted from the general law of holiness that applies to the priestly status (cf. Kiddushin 77a)."}, {"ch": 21, "v": 16, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 17, "aliyah": 2, "heb": "דַּבֵּ֥ר אֶֽל־אַהֲרֹ֖ן לֵאמֹ֑ר אִ֣ישׁ מִֽזַּרְעֲךָ֞ לְדֹרֹתָ֗ם אֲשֶׁ֨ר יִהְיֶ֥ה בוֹ֙ מ֔וּם לֹ֣א יִקְרַ֔ב לְהַקְרִ֖יב לֶ֥חֶם אֱלֹהָֽיו׃", "onk": "מַלֵּל עִם אַהֲרֹן לְמֵימָר גְּבַר מִבְּנָיךְ לְדָרֵיהוֹן דִּי יְהֵי בֵיהּ מוּמָא לָא יִקְרַב לְקָרָבָא <b>קֻרְבָּנָא קֳדָם<\/b> אֱלָהֵיהּ:", "onk_en": "Speak to Aharon saying; Anyone of your offspring, through [all] their generations who will have a blemish, shall not approach to offer the bread [<b>sacrifice<\/b>] of [<b>before<\/b>] his God.", "pj": "מַלֵיל עִם אַהֲרן לְמֵימָר גְבַר מִבְּנָךְ לְזַרְעֲיַית דָרֵיהוֹן דִיהֵי בֵיהּ מוּמָא לָא יִתְכְּשַׁר לְקָרְבָא קוּרְבַּן אֱלָהֵיהּ", "pj_en": "Speak with Aharon, saying: No man of thy sons in the families of their generations who hath a blemish in him shall be qualified to offer the oblation of his God:", "tj": "", "tj_en": "", "rashi": "<b>לחם אלהיו.<\/b> מַאֲכַל אֱלֹהָיו, כָּל סְעוּדָה קְרוּיָה לֶחֶם, כְּמוֹ \"עֲבַד לְחֶם רַב\" (דניאל ה'):", "rashi_en": "לחם אלהיו THE BREAD OF HIS GOD — This means, any food of his God (not “bread” only); any meal is termed לחם, as e. g., (Daniel 5:1) “he made a great banquet (לְחַם)” (cf. Rashi on Genesis 31:54)."}, {"ch": 21, "v": 18, "aliyah": 2, "heb": "כִּ֥י כׇל־אִ֛ישׁ אֲשֶׁר־בּ֥וֹ מ֖וּם לֹ֣א יִקְרָ֑ב אִ֤ישׁ עִוֵּר֙ א֣וֹ פִסֵּ֔חַ א֥וֹ חָרֻ֖ם א֥וֹ שָׂרֽוּעַ׃", "onk": "אֲרֵי כָל גְּבַר דִּי בֵיהּ מוּמָא לָא יִקְרָב גְּבַר עַוִּיר אוֹ חֲגִיר אוֹ חָרִים אוֹ שְׂרִיעַ:", "onk_en": "For any man who has a blemish shall not approach; a blind man or a lame man, or a man with a sunken nose, or a man who has disproportionate limbs.", "pj": "אֲרוּם כָּל גְבַר דְבֵיהּ מוּמָא לָא יִקְרַב גְבַר דְסָמֵי אוֹ דְחָגִיר אוֹ דְלָקִי בְּחוּטְמֵיהּ אוֹ דְמִישְׁתְּמִיט יְרֵיכֵיהּ", "pj_en": "for no man who hath a blemish in him shall offer. A man who is blind or lame, or stricken in his nostrils, or mutilated in his thigh,", "tj": "", "tj_en": "", "rashi": "<b>כי כל איש אשר בו מום לא יקרב.<\/b> אֵינוֹ דִין שֶׁיִּקְרַב, כְּמוֹ הַקְרִיבֵהוּ נָא לְפֶחָתֶךָ (מלאכי א'):<br><br><b>חרם.<\/b> שֶׁחָטְמוֹ שָׁקוּעַ בֵּין שְׁתֵּי הָעֵינַיִם, שֶׁכּוֹחֵל שְׁתֵּי עֵינָיו כְּאַחַת (ספרא; בכורות מ\"ג):<br><br><b>שרוע.<\/b> שֶׁאֶחָד מֵאֵבָרָיו גָּדוֹל מֵחֲבֵרוֹ — עֵינוֹ אַחַת גְּדוֹלָה וְעֵינוֹ אַחַת קְטַנָּה, אוֹ שׁוֹקוֹ אַחַת אֲרֻכָּה מֵחֲבֶרְתָּהּ (ספרא; בכורות מ'):", "rashi_en": "כי כל איש אשר בו מום לא יקרב FOR ANY MAN THAT HATH A BLEMISH SHALL NOT APPROACH — This means: it is not right that he should approach; It expresses the same idea as (Malachi 1:8) “[And if ye offer the blind for sacrifice, is it not evil? and if ye offer the lame or sick, is it not evil?] offer it now unto thy governor! [will he be pleased with thee?]”.<br><br>חרם A FLAT-NOSED MAN — one whose nose is sunk between his two eyes so that he is able to paint both his eyes (for medical or cosmetic purposes) with one stroke (Sifra, Emor, Section 3 7; Mishna Bekhorot 7:3). <br><br>שרוע HE THAT HATH A LIMB TOO LARGE — i.e. one of whose limbs forming a pair is larger than the other, e. g. one of his eyes is large and the other small, or, one of his legs is longer than the other (Bekhorot 40b; cf. Sifra, Emor, Section 3 9)."}, {"ch": 21, "v": 19, "aliyah": 2, "heb": "א֣וֹ אִ֔ישׁ אֲשֶׁר־יִהְיֶ֥ה ב֖וֹ שֶׁ֣בֶר רָ֑גֶל א֖וֹ שֶׁ֥בֶר יָֽד׃", "onk": "אוֹ גְבַר דִּי יְהֵי בֵיהּ תְּבַר רַגְלָא אוֹ תְּבַר יְדָא:", "onk_en": "or a man who has a broken (crippled) foot, or a broken (crippled) hand,", "pj": "אוֹ גְבַר דִיהֵי בֵיהּ תְּבִיר דְרָגֶל אוֹ תְּבִיר דְיָדָא", "pj_en": "or a man who hath a broken foot, or a broken hand", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 20, "aliyah": 2, "heb": "אֽוֹ־גִבֵּ֣ן אוֹ־דַ֔ק א֖וֹ תְּבַלֻּ֣ל בְּעֵינ֑וֹ א֤וֹ גָרָב֙ א֣וֹ יַלֶּ֔פֶת א֖וֹ מְר֥וֹחַ אָֽשֶׁךְ׃", "onk": "אוֹ גְבִין אוֹ דֻקָּא אוֹ חִלִּיז בְּעֵינֵיהּ אוֹ גַרְבָן אוֹ חֲזָזָן אוֹ מְרַס פַּחֲדִין:", "onk_en": "or one with overhanging eyebrows, or with a cataract, or a disarrangement [in the eye], or one with scurf or scabs, or one with crushed testicles.", "pj": "אוֹ דְגָבִינוֹי שִׁכְבַן חַפְיַין עֵינוֹי אוֹ לֵית שְעַר בְּגָבִינוֹי אוֹ דְחִילָזוֹן בְּעֵינוֹי דִמְעַרֵב חִיוְורָא בְּאוֹכְמָא אוֹ דְמָלֵי חַרְסִין יְבֵישִׁין אוֹ דְמָלֵי חֲזָזִיתָא מִצְרֵיתָא אוֹ דְפַחְדוֹי נְפִיחִין וּקְלִיטִין", "pj_en": "or whose eyelids droop so as to cover his eyes, who hath no hair on his eyelids; or who hath a suffusion of whiteness with darkness in his eyes; or who hath the dry scurvy, or who is full of the blotches of Egypt, or whose testicles are swollen or shrunk,", "tj": "אוֹ דְּגָבִינוֹי חַפְיַין עֵינוֹי אוֹ דְלֵית לֵיהּ סְעַר בְּגָבִינוֹי אוֹ דְגָבִיהַ אוֹ דְנָנִיס אוֹ יְחַלְזְוָוה בְּעֵינוֹי אוֹ דִמְלֵי גָרָב אוֹ דִמְלֵי חֲזָזִין אוֹ דַחֲסַר כּוּלְיָיא:", "tj_en": "Or one whose eyelids cover his eyes, or hath no hair on his eyelids, or who is overgrown, or a dwarf, or blear-eyed, or filled with scurvy or with blotches, or who is wanting in the testicles.", "rashi": "<b>או גבן.<\/b> שׁורי\"ציולש בְּלַעַז, שֶׁגְּבִינֵי עֵינָיו שְׂעָרָן אָרֹךְ וְשׁוֹכֵב:<br><br><b>או דק.<\/b> שֶׁיֵּשׁ לוֹ בְעֵינָיו דֹּק, שֶׁקּוֹרִים טיל\"א, כְּמוֹ \"הַנּוֹטֶה כַדֹּק\" (ישעיהו מ'):<br><br><b>או תבלל.<\/b> דָּבָר הַמְבַלְבֵּל אֶת הָעַיִן, כְּגוֹן חוּט לָבָן הַנִּמְשָׁךְ מִן הַלֹּבֶן וּפוֹסֵק בַּסִּירָא, שֶׁהוּא עֹגֶל הַמַּקִּיף אֶת הַשָּׁחֹר שֶׁקּוֹרִים פרוני\"לא, וְהַחוּט הַזֶּה פּוֹסֵק אֶת הָעֹגֶל וְנִכְנָס בַּשָּׁחֹר; וְתַרְגּוּם תְּבַלּוּל \"חִלִּיז\", לְשׁוֹן חִלָּזוֹן, שֶׁהוּא דוֹמֶה לְתוֹלַעַת אוֹתוֹ הַחוּט, וְכֵן כִּנּוּהוּ חַכְמֵי יִשְֹרָאֵל בְּמוּמֵי הַבְּכוֹר חִלָּזוֹן, נָחָשׁ, עֵינָב (בכורות ל\"ח):<br><br><b>גרב או ילפת.<\/b> מִינֵי שְׁחִין הֵם; גָּרָב זוֹ הַחֶרֶס, שְׁחִין הַיָּבֵשׁ מִבִּפְנִים וּמִבַּחוּץ, יַלֶּפֶת הִיא חֲזָזִית הַמִּצְרִית, וְלָמָּה נִקְרֵאת יַלֶּפֶת? שֶׁמְּלַפֶּפֶת וְהוֹלֶכֶת עַד יוֹם הַמִּיתָה, וְהוּא לַח מִבַּחוּץ וְיָבֵשׁ מִבִּפְנִים, וּבְמָקוֹם אַחֵר קוֹרֵא לַגָּרָב שְׁחִין הַלַּח מִבַּחוּץ וְיָבֵשׁ מִבִּפְנִים, שֶׁנֶּאֱמַר \"וּבַגָּרָב וּבֶחָרֶס\" (דברים כ\"ח), כְּשֶׁסָּמַךְ גָּרָב אֵצֶל חֶרֶס, קוֹרֵא לַיַּלֶּפֶת גָּרָב, וּכְשֶׁהוּא סָמוּךְ אֵצֶל יַלֶּפֶת, קוֹרֵא לַחֶרֶס גָּרָב, כָּךְ מְפֹרָשׁ בִּבְכוֹרוֹת (דף מ\"א):<br><br><b>מרוח אשך.<\/b> לְפִי הַתַּרְגּוּם מְרַס פַּחֲדִין, שֶׁפְּחָדָיו מְרֻסָּסִין — שֶׁבֵּיצִים שֶׁלּוֹ כְתוּתִין, פְּחָדִין כְּמוֹ \"גִּידֵי פַחֲדָו יְשֹׂרָגוּ\" (איוב מ'):", "rashi_en": "או גבן — sourcils in O. F. — is one whose eye-brows have their hair long so that they lie over his eyes (Bekhorot 43b)<br><br>או דק — one who has in his eye a membrane which is called “toile” (web) in old French The word is similar in meaning to (Isaiah 40:22) “It is He that stretcheth out the heavens like a web (כַּדֹּק) (Bekhorot 48a). <br><br>או תבלל — (from בלל \"to mingle\") denotes anything that causes a mingling in the eye, e. g., a white line which extends from the white of the eye and intersects the סירא (the iris), which is the ring that encloses the black of the eye which is called prunelle in old French This white line intersects the circle and runs into the black (so that the white and the black of the eye mingle). The Targum rendering of תבלל is חילוז, connected in meaning with חלזון (a kind of worm); he translates it thus because that line resembles a worm. Thus, too, the Sages of Israel name it (the while line) among the blemishes of first-born animals: חלזון נחש עינב (worm, snake, wart) (cf. Bekhorot 38a,b).<br><br>גרב וילפת — These are kinds of boil; גרב is identical with חרס (mentioned in Deuteronomy 28:27) — a boil  which is dry both inside and on the surface. ילפת is identical with the Egyptian lichen, (חזזית) (Sifra, Emor, Section 3 15). Why is it called ילפת (root לפת “to embrace\")? Because it continues to cling to the body until the day of death. It is wet on the surface and dry inside. In another passage, however, Scripture gives the name גרב to a boil which is wet on the surface and dry inside, as it is said (Deuteronomy 28:27) \"[The Lord will smite thee…] ובגרב ובחרס”, where גרב necessarily denotes a wet boil since חרס (identical with חרש, potsherd) denotes the dry species. But the explanation is as follows: חרס always denotes the dry skin disease, ילפח always the wet one; as to גרב it depends: When Scripture mentions גרב together with חרס it is calling a ילפת by the term ,גרב  and when it  mentions it (גרב) together with ילפת (as is the case here) it is calling a חרס by the term גרב. Thus is it explained in Bekhorot 41a.<br><br>מרוח אשך, according to the Targum, מרס פחדין, which signifies one whose פחדין are מרוססין, i. e., one whose testicles are crushed. פחדין has the same meaning as (Job 40:17) “and the sinews of his stones (פחדיו) are wrapped together”."}, {"ch": 21, "v": 21, "aliyah": 2, "heb": "כׇּל־אִ֞ישׁ אֲשֶׁר־בּ֣וֹ מ֗וּם מִזֶּ֙רַע֙ אַהֲרֹ֣ן הַכֹּהֵ֔ן לֹ֣א יִגַּ֔שׁ לְהַקְרִ֖יב אֶת־אִשֵּׁ֣י יְהֹוָ֑ה מ֣וּם בּ֔וֹ אֵ֚ת לֶ֣חֶם אֱלֹהָ֔יו לֹ֥א יִגַּ֖שׁ לְהַקְרִֽיב׃", "onk": "כָּל גְּבַר דִּי בֵיהּ מוּמָא מִזַּרְעָא דְּאַהֲרֹן כַּהֲנָא לָא יִקְרַב לְקָרָבָא יָת <b>קֻרְבָּנַיָּא<\/b> דַיְיָ מוּמָא בֵיהּ יָת <b>קֻרְבַּן<\/b> אֱלָהֵיהּ לָא יִקְרַב לְקָרָבָא:", "onk_en": "Any man who has a blemish, who is a descendant of Aharon the <i>kohein<\/i>, shall not approach to offer the fire-offerings [<b>offerings<\/b>] of Adonoy. He has a blemish; the bread [<b>sacrifice<\/b>] of his God he may not approach to offer [as an offering].", "pj": "כָּל גְבַר כָּהֵין דְבֵיהּ מוּמָא מִזַרְעָא דְאַהֲרן כַּהֲנָא לָא יִתְכְּשַׁר לְקָרָבָא קוּרְבָּנַיָא דַיְיָ מוּמָא בֵּיהּ יַת קָרְבַּן אֱלָהֵיהּ לָא יִתְכַּשֵׁר לְקָרָבָא", "pj_en": "no man, a priest of the race of Aharon the priest who hath in him any such blemish, shall be qualified to offer the oblations of the Lord. He hath a blemish, and it is not meet for him to offer the oblation of his God.", "tj": "", "tj_en": "", "rashi": "<b>כל איש אשר בו מום.<\/b> לְרַבּוֹת שְׁאָר מוּמִין:<br><br><b>מום בו.<\/b> בְּעוֹד מוּמוֹ בּוֹ פָּסוּל, הָא אִם עָבַר מוּמוֹ כָּשֵׁר (ספרא):<br><br><b>לחם אלהיו.<\/b> כָּל מַאֲכָל קָרוּי לֶחֶם:", "rashi_en": "כל איש אשר בו מום NO MAN THAT HATH A BLEMISH… [SHALL COME NEAR] — This is intended to include in the prohibition (besides the blemishes expressly mentioned in vv. 18—20) also other bodily blemishes (Sifra, Emor, Chapter 3 1).<br><br>מום בו HE HATH A BLEMISH — These apparently redundant words imply: so long as he has the bodily blemish he is unfit for priestly service; (the translation is: מום בו while the blemish is in him, '‎לא יגש וכו‎ he shall not approach to offer); consequently, if his blemish disappears, he becomes again fit for it (Sifra, Emor, Chapter 3 6).<br><br>לחם אלהיו THE BREAD OF HIS LORD — any food is called לחם (cf. Rashi on v. 17)."}, {"ch": 21, "v": 22, "aliyah": 2, "heb": "לֶ֣חֶם אֱלֹהָ֔יו מִקׇּדְשֵׁ֖י הַקֳּדָשִׁ֑ים וּמִן־הַקֳּדָשִׁ֖ים יֹאכֵֽל׃", "onk": "קֻרְבַּן אֱלָהֵיהּ מִקֹּדֶשׁ קוּדְשַׁיָּא וּמִן קוּדְשַׁיָּא יֵיכוּל:", "onk_en": "The bread of his God which is of the most holy, and from the holy [offerings] he may eat.", "pj": "בְּרַם מוֹתְרֵי קָרְבָּנַיָא דֶאֱלָהֵיהּ מַה דְמִשְׁתַּיֵיר מִן קוּדְשֵׁי קוּדְשַׁיָא וּמִן קוּדְשַׁיָא יִתְפַּרְנֵס", "pj_en": "Nevertheless he may support himself with the residue of the oblations of his God which remaineth of the most holy and of the holy (offerings);", "tj": "", "tj_en": "", "rashi": "<b>מקדשי הקדשים.<\/b> אֵלּוּ קָדְשֵׁי הַקֳּדָשִׁים:<br><br><b>ומן הקדשים יאכל.<\/b> אֵלּוּ קָדָשִׁים קַלִּים, וְאִם נֶאֶמְרוּ קָדְשֵׁי הַקֳּדָשִׁים לָמָּה נֶאֱמַר קָדָשִׁים קַלִּים? אִם לֹא נֶאֱמַר, הָיִיתִי אוֹמֵר בְּקָדְשֵׁי הַקֳּדָשִׁים יֹאכַל בַּעַל מוּם, שֶׁמָּצִינוּ שֶׁהֻתְּרוּ לְזָר, שֶׁאָכַל מֹשֶׁה בְּשַׂר הַמִּלּוּאִים, אֲבָל בְּחָזֶה וְשׁוֹק שֶׁל קָדָשִׁים קַלִּים לֹא יֹאכַל, שֶׁלֹּא מָצִינוּ זָר חוֹלֵק בָּהֶן, לְכָךְ נֶאֶמְרוּ קָדָשִׁים קַלִּים, כָּךְ מְפֹרָשׁ בִּזְבָחִים (דף ק\"א):", "rashi_en": "מקדשי הקדשים OF THE MOST HOLY — These are what are technically known as קדשי קדשים — of them he may eat. <br><br>ומן הקדשים יאכל AND OF THE HOLY HE MAY EAT — these are what are technically known as קדשים קלים. But if קדשי קדשים are mentioned as being permitted to him as food, why are קדשים קלים also mentioned? Could this not be inferred by a conclusion a fortiori? But the explanation is as follows: If קדשים קלים were not expressly mentioned as being permitted, I might have said: of the sacrifices holy in the highest degree the priest with a bodily blemish may eat — because we find that these had on one occasion been permitted to be eaten even by a non-priest, for Moses (who was not a priest) ate the flesh of the installation offering (cf. Leviticus 8:29; and this was holy in the highest degree since Scripture continues there: “Seethe the flesh at the entrance of the appointed tent… etc., a law that only applies to קדשי קדשים) — but he (a priest who is בעל מום) must not eat of the breast and the shoulder of sacrifices holy in a minor degree, since we do not find that a non-priest ever took a share in them. On this account sacrifices holy in a minor degree are expressly stated as permitted to be eaten. Thus it is explained in Treatise Zevachim 101b (cf. also Sifra, Emor, Chapter 3 8-9)."}, {"ch": 21, "v": 23, "aliyah": 2, "heb": "אַ֣ךְ אֶל־הַפָּרֹ֜כֶת לֹ֣א יָבֹ֗א וְאֶל־הַמִּזְבֵּ֛חַ לֹ֥א יִגַּ֖שׁ כִּֽי־מ֣וּם בּ֑וֹ וְלֹ֤א יְחַלֵּל֙ אֶת־מִקְדָּשַׁ֔י כִּ֛י אֲנִ֥י יְהֹוָ֖ה מְקַדְּשָֽׁם׃", "onk": "בְּרַם לְפָרֻכְתָּא לָא יֵיעוֹל וּלְמַדְבְּחָא לָא יִקְרַב אֲרֵי מוּמָא בֵיהּ וְלָא יַחֵל יָת מַקְדְּשַׁי אֲרֵי אֲנָא יְיָ מְקַדִּשְׁהוֹן:", "onk_en": "However, he may not enter beyond the Curtain and he shall not approach the Altar for he has a blemish and he shall not profane My holy things, for I am Adonoy, who sanctifies them.", "pj": "לְחוֹד לְפַרְגוֹדָא לָא יֵיעוֹל וּלְמַדְבְּחָא לָא יִקְרַב אֲרוּם מוּמָא בֵּיהּ וְלָא יָפִיס יַת מִקְדָשַׁי אֲרוּם אֲנָא יְיָ מְקַדִשְׁהוֹן", "pj_en": "only he must not enter within the veil, nor approach the altar; for a blemish is in him, and he shall not profane My sanctuary; for I the Lord do sanctify them.", "tj": "", "tj_en": "", "rashi": "<b>אך אל הפרכת.<\/b> לְהַזּוֹת שֶׁבַע הַזָּאוֹת שֶׁעַל הַפָּרֹכֶת.<br><br><b>ואל המזבח.<\/b> הַחִיצוֹן; וּשְׁנֵיהֶם הֻצְרְכוּ לִכָּתֵב, וּמְפֹרָשׁ בְּתֹ\"כֹּ:<br><br><b>ולא יחלל את מקדשי.<\/b> שֶׁאִם עָבַד עֲבוֹדָתוֹ מְחֻלֶּלֶת לִפָּסֵל (ספרא):", "rashi_en": "אך אל הפרכת  ONLY [HE SHALL NOT GO IN] UNTO THE PARTITION VEIL for the purpose of applying the seven sprinklings which are to be made upon the partition vail (cf. Leviticus 16:17).<br><br>ואל המזבח [NOR SHALL HE COME NIGH] UNTO THE ALTAR — i. e. the outer altar. Both (פרכת and מזבח) must be mentioned here and the reason is explained in Torath Cohanim (Sifra, Emor, Chapter 3 10).<br><br>ולא יחלל את מקדשי THAT HE PROFANE NOT WHAT IS HOLY TO ME — Consequently, if he performs the service it is profaned and thus becomes invalid (Sifra, Emor, Chapter 3 11)."}, {"ch": 21, "v": 24, "aliyah": 2, "heb": "וַיְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽל־אַהֲרֹ֖ן וְאֶל־בָּנָ֑יו וְאֶֽל־כׇּל־בְּנֵ֖י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמַלִּיל משֶׁה עִם אַהֲרֹן וְעִם בְּנוֹהִי וְעִם כָּל בְּנֵי יִשְׂרָאֵל:", "onk_en": "Moshe spoke [these words] to Aharon, and to his sons and to all of Bnei Yisroel.", "pj": "וּמַלֵיל משֶׁה עִם אַהֲרן וְעִם בְּנוֹי וְעִם כָּל בְּנֵי יִשְרָאֵל", "pj_en": "And Mosheh spake with Aharon and with his sons, and with all the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>וידבר משה.<\/b> הַמִּצְוָה הַזֹּאת.<br><br><b>אל אהרן ואל בניו ואל כל בני ישראל.<\/b> לְהַזְהִיר בֵּית דִּין עַל הַכֹּהֲנִים (עי' ספרא):", "rashi_en": "וידבר משה AND MOSES TOLD this command,<br><br>אל אהרן ואל בניו ואל כל בני ישראל UNTO AARON AND UNTO HIS SONS AND UNTO ALL THE CHILDREN OF ISRAEL — He told it to the Israelites although they were not directly concerned with these commands in order to admonish the court regarding the priests (i. e. that the authorities should watch over the sanctity of the Sanctuary and prevent priests with a bodily blemish from officiating) (Sifra, Emor, Chapter 3 12)."}, {"ch": 22, "v": 1, "aliyah": 2, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 22, "v": 2, "aliyah": 2, "heb": "דַּבֵּ֨ר אֶֽל־אַהֲרֹ֜ן וְאֶל־בָּנָ֗יו וְיִנָּֽזְרוּ֙ מִקׇּדְשֵׁ֣י בְנֵֽי־יִשְׂרָאֵ֔ל וְלֹ֥א יְחַלְּל֖וּ אֶת־שֵׁ֣ם קׇדְשִׁ֑י אֲשֶׁ֨ר הֵ֧ם מַקְדִּשִׁ֛ים לִ֖י אֲנִ֥י יְהֹוָֽה׃", "onk": "מַלֵּיל עִם אַהֲרֹן וְעִם בְּנוֹהִי וְיִפָּרְשׁוּן מִקּוּדְשַׁיָּא דִבְנֵי יִשְׂרָאֵל וְלָא יְחַלּוּן יָת שְׁמָא דְקוּדְשִׁי דִּי אִנּוּן מְקַדְּשִׁין <b>קֳדָמַי<\/b> אֲנָא יְיָ:", "onk_en": "Speak to Aharon and to his sons and let them keep away from the holy offerings of Bnei Yisroel and they shall not profane My holy name which they sanctify for [<b>before<\/b>] Me, I am Adonoy.", "pj": "מַלֵיל עִם אַהֲרן וְעִם בְּנוֹי וְיִתְפַּרְשׁוּן מִקוּדְשַׁיָא דִבְנֵי יִשְרָאֵל וְלָא יִפְסוּן יַת שְׁמָא דְקוּדְשִׁי דְהִינוּן מְקַדְשִׁין קֳדָמַי אֲנָא יְיָ", "pj_en": "Speak with Aharon and with his sons, that they keep apart from the consecrated things of the children of Israel, and profane not the Name of My Holiness (in whatever) they hallow before Me: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>וינזרו.<\/b> אֵין נְזִירָה אֶלָּא פְרִישָׁה, וְכֵן הוּא אוֹמֵר \"וַיִּנָּזֵר מֵאַחֲרַי\" (יחזקאל י\"ד), \"נָזֹרוּ אָחוֹר\" (ישעיהו א') — יִפְרְשׁוּ מִן הַקֳּדָשִׁים בִּימֵי טֻמְאָתָן (ספרא):<br><br><b>וינזרו מקדשי בני ישראל, אשר הם מקדשים לי ולא יחללו את שם קדשי.<\/b> סָרֵס הַמִּקְרָא וְדָרְשֵׁהוּ:<br><br><b>אשר הם מקדשים לי.<\/b> לְרַבּוֹת קָדְשֵׁי כֹהֲנִים עַצְמָן:", "rashi_en": "וינזרו THAT THEY KEEP AWAY [FROM THE HOLY THINGS etc.] — The term נזר always denotes “keeping aloof\". Similarly it is said (Ezekiel 14:7) \"and he separates himself (וינזר) from following Me”; (Isaiah 1:4) \"They are gone away (נזורו) backward”. The meaning of this verse therefore is: they (the priests) shall keep aloof from the holy things during the time of their uncleanness (Sifra, Emor, Section 4 1).<br><br>וינזרו מקדשי בני ישראל אשר הם מקדשים לי. ולא יחללו את שם קדשי — Invert the words of the verse in the order here set forth and explain it accordingly.<br><br>אשר הם מקדשים לי WHICH THEY HALLOW UNTO ME — This is intended to include in the prohibition the holy things of the priests themselves (i. e. הם refers to אהרן ובניו not to ‎‎בני ישראל‎) (Sifra, Emor, Section 4 1)."}, {"ch": 22, "v": 3, "aliyah": 2, "heb": "אֱמֹ֣ר אֲלֵהֶ֗ם לְדֹרֹ֨תֵיכֶ֜ם כׇּל־אִ֣ישׁ&thinsp;<b>׀<\/b> אֲשֶׁר־יִקְרַ֣ב מִכׇּל־זַרְעֲכֶ֗ם אֶל־הַקֳּדָשִׁים֙ אֲשֶׁ֨ר יַקְדִּ֤ישׁוּ בְנֵֽי־יִשְׂרָאֵל֙ לַֽיהֹוָ֔ה וְטֻמְאָת֖וֹ עָלָ֑יו וְנִכְרְתָ֞ה הַנֶּ֧פֶשׁ הַהִ֛וא מִלְּפָנַ֖י אֲנִ֥י יְהֹוָֽה׃", "onk": "אֱמַר לְהוֹן לְדָרֵיכוֹן כָּל גְּבַר דִּי יִקְרַב מִכָּל בְּנֵיכוֹן לְקוּדְשַׁיָּא דִּי יְקַדְּשׁוּן בְּנֵי יִשְׂרָאֵל <b>קֳדָם<\/b> יְיָ וְסֹאבְתֵיהּ עֲלוֹהִי וְיִשְׁתֵּיצֵי <b>אֲנָשָׁא<\/b> הַהִיא מִן קֳדָמַי אֲנָא יְיָ:", "onk_en": "Say to them; throughout your generations; any person of your offspring who will draw near to the holy things which Bnei Yisroel will sanctify to [<b>before<\/b>] Adonoy [while] his impurity is on him that soul [<b>person<\/b>] shall be cut off from My Presence, I am Adonoy.", "pj": "אֵימַר לְהוֹן אִזְדַהֲרִין לְדָרֵיכוֹן כָּל גְבַר דְיִקְרַב מִכָּל בְּנֵיכוֹן לְקוּדְשַׁיָא דִי יְקַדְשׁוּן בְּנֵי יִשְרָאֵל קֳדָם יְיָ וְסוּבְתֵּיהּ עֲלוֹי וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא בְּמוֹתָנָא מִן קֳדָמַי אֲנָא יְיָ", "pj_en": "Say to them, Take heed in your generations: whatever man of all your sons who shall offer things hallowed, which the children of Israel have consecrated before the Lord, having his uncleanness upon him, that man shall be destroyed with a stroke of death before Me: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>כל איש אשר יקרב.<\/b> אֵין קְרִיבָה זוֹ אֶלָּא אֲכִילָה, וְכֵן מָצִינוּ שֶׁנֶּאֶמְרָה אַזְהָרַת אֲכִילַת קָדָשִׁים בְּטֻמְאָה בִּלְשׁוֹן נְגִיעָה, \"בְּכָל קֹדֶשׁ לֹא תִגָּע\" (ויקרא י\"ב), אַזְהָרָה לָאוֹכֵל, וּלְמָדוּהָ רַבּוֹתֵינוּ מִגְּזֵרָה שָׁוָה; וְאִאֶ\"ל שֶׁחַיָּב עַל הַנְּגִיעָה, שֶׁהֲרֵי נֶאֱמַר כָּרֵת עַל הָאֲכִילָה בְּצַו אֶת אַהֲרֹן (ויקרא ז'), שְׁתֵּי כָּרֵתוֹת זוֹ אֵצֶל זוֹ, וְאִם עַל הַנְּגִיעָה חַיָּב, לֹא הֻצְרַךְ לְחַיְּבוֹ עַל הָאֲכִילָה וְכֵן נִדְרַשׁ בְּתֹ\"כֹּ: וְכִי יֵשׁ נוֹגֵעַ חַיָּב? אִם כֵּן מַה תַּ\"ל יִקְרַב? מִשֶּׁיִּכְשַׁר לִקָּרֵב, שֶׁאֵין חַיָּבִים עָלָיו מִשּׁוּם טֻמְאָה אֶלָּא אִ\"כֵּ קָרְבוּ מַתִּירָיו (ספרא; זבחים מ\"ה): וְאִ\"תֹּ שָׁלוֹשׁ כָּרֵתוֹת בְּטֻמְאַת כֹּהֲנִים לָמָּה, כְּבָר נִדְרְשׁוּ בְּמַסֶּכֶת שְׁבוּעוֹת (דף ז'), אַחַת לִכְלָל וְאַחַת לִפְרָט וְכוּ':<br><br><b>וטמאתו עליו.<\/b> וְטֻמְאַת הָאָדָם עָלָיו, יָכוֹל בַּבָּשָׂר הַכָּתוּב מְדַבֵּר — וְטֻמְאָתוֹ שֶׁל בָּשָׂר עָלָיו — וּבְטָהוֹר שֶׁאָכַל אֶת הַטָּמֵא הַכָּתוּב מְדַבֵּר, עַל כָּרְחֲךָ מִמַּשְׁמָעוֹ אַתָּה לָמֵד — בְּמִי שֶׁטֻּמְאָתוֹ פּוֹרַחַת מִמֶּנּוּ הַכָּתוּב מְדַבֵּר, וְזֶהוּ הָאָדָם שֶׁיֵּשׁ לוֹ טָהֳרָה בִּטְבִילָה (ספרא):<br><br><b>ונכרתה.<\/b> יָכוֹל מִצַּד זֶה לְצַד זֶה — יִכָּרֵת מִמְּקוֹמוֹ וְיִתְיַשֵּׁב בְּמָקוֹם אַחֵר — תַּ\"ל <b>אני ה'<\/b>, בְּכָל מָקוֹם אֲנִי (שם):", "rashi_en": "‎כל איש אשר יקרב  WHOSOEVER HE BE THAT GOETH UNTO [THE HOLY THINGS… SHALL BE CUT OFF etc.] — This “approaching\" unto the holy things signifies nothing else but eating of them. Similarly we find that the prohibition of eating holy things in a state of uncleanness is expressed by the term נגע, (which means, as does קרב, “approaching”): (Leviticus 12:4) “she shall approach near to nothing that is holy\" — which is explained as a prohibition addressed to one who would eat of the holy things (cf. Rashi on Leviticus 12:4). And our Rabbis derived it (the fact that לא תגע means: she shall not eat) from a verbal analogy. It is indeed impossible to say that one is punishable for touching holy things in a state of uncleanness, because the penalty of excision for eating holy things in such a state is mentioned in the section commencing צו את אהרן (Leviticus 7:20, 21) — twice is the punishment of כרת mentioned there, one immediately after the other; and if one really becomes liable to punishment for the mere touching of holy things it is unnecessary to pronounce him liable to punishment for eating them! In this sense also is it (our passage) expounded in Torath Cohanim (Sifra, Emor, Section 4 7): But is a priest who merely touches holy things when he is unclean really liable to the punishment of excision? Surely not, since Scripture expressly states in the following verse that an unclean priest who eats of the holy things is liable to excision and this latter statement would be unnecessary since eating without touching is impossible. But if this be so, why does Scripture use the term יקרב and not  יאכל which means \"eating”? It is in order to intimate that this law applies only when an unclean priest eats of it after it becomes fit לקרב, “to be offered” — that one does not become liable on account of his uncleanness until its מתירין (its “permitting portions”) have been offered, and he then eats of it. And if you ask, “Why are three mentions of the כרת-punishment (Leviticus 7:21 and here) necessary in respect to priestly uncleanness? then I reply, they have already been interpreted in Treatise Shevuot 7a, one as being intended as a generalisation, the other as a specification, etc. (see Rashi on Leviticus 7:20).<br><br>וטומאתו עליו means, AND THE MAN'S UNCLEANNESS IS UPON HIM (the first word meaning \"and his uncleanness”). I might, however, think that Scripture is speaking of the flesh — \"the uncleanness of the flesh is upon it” (the first word meaning “and its uncleanness, the word בשר being implied in the term הקדשים that precedes) and that Scripture is thus speaking of a clean person who ate holy things which have become unclean! You must needs admit that from what is implied in it (in the phrase) you must learn that Scripture is speaking of one whose state of uncleanness can fly (pass) away therefrom (since the phrase implies: “whilst the טומאה is still present\", presupposing that there is a possibility of the טומאה passing away), and this can only refer to a human being who has a means of purification through immersion in a ritual bath whilst unclean food can never again become clean (Sifra, Emor, Section 4 8; Zevachim 43b).<br><br>ונכרתה  [THAT SOUL] SHALL BE CUT OFF — I might think that this implies merely that he will be removed from one region (lit., side) to another region — that he will be cut off from his native place but may settle down in another place! Scripture however states, “[that soul shall be cut off from My presence] I am the Lord” — I am everywhere (Sifra, Emor, Section 4 6; cf. Rashi on Exodus 12:15.)"}, {"ch": 22, "v": 4, "aliyah": 2, "heb": "אִ֣ישׁ אִ֞ישׁ מִזֶּ֣רַע אַהֲרֹ֗ן וְה֤וּא צָר֙וּעַ֙ א֣וֹ זָ֔ב בַּקֳּדָשִׁים֙ לֹ֣א יֹאכַ֔ל עַ֖ד אֲשֶׁ֣ר יִטְהָ֑ר וְהַנֹּגֵ֙עַ֙ בְּכׇל־טְמֵא־נֶ֔פֶשׁ א֣וֹ אִ֔ישׁ אֲשֶׁר־תֵּצֵ֥א מִמֶּ֖נּוּ שִׁכְבַת־זָֽרַע׃", "onk": "גְּבַר גְּבַר מִזַּרְעָא דְאַהֲרֹן וְהוּא <b>סְגִיר<\/b> אוֹ דָאִיב בְּקוּדְשַׁיָּא לָא יֵיכוּל עַד דִּי יִדְכֵּי וּדְיִקְרַב בְּכָל טְמֵא <b>נַפְשָׁא<\/b> אוֹ גְבַר דִּי תִפּוֹק מִנֵּיהּ שִׁכְבַת זַרְעָא:", "onk_en": "Any man of Aharons offspring; who has <i>tzoraas<\/i> [<b>the plague of ’confinement’<\/b>] or an impure flow, may not eat of the sacred things until he has purified himself. [The same is true] of anyone who touches anything defiled by the dead [<b>soul<\/b>], or anyone who has had a seminal emission,", "pj": "גְבַר טְלֵי אוֹ גְבַר סִיב מִזַרְעָא דְאַהֲרן וְהוּא מְצָרְעָא אוֹ דַיֵיב בְּקוּדְשַׁיָא לָא יֵיכוֹל עַד זְמַן דְמִידְכֵּי וּדְיִקְרַב בְּכָל סוֹאֲבַת בַּר נַשׁ אוֹ גְבַר דְתִפּוֹק מִינֵיהּ שִׁכְבַת זַרְעָא", "pj_en": "Any man, young or old of the offspring of Aharon, who is a leper, or hath a running issue, shall not eat of things consecrated till he be clean: and whoever toucheth any uncleanness of man, or one from whom uncleanness hath proceeded,", "tj": "", "tj_en": "", "rashi": "<b>מזרע אהרן.<\/b> אין לי אלא זרעו, גופו מנין, תלמוד לומר והוא צרוע, שיכול הואיל ומקריב אונן יקריב צרוע וזב, תלמוד לומר והוא: <br><br><b>עד אשר יטהר.<\/b> ביאת השמש, או אינו אלא טבילה, נאמר כאן וטהר, ונאמר למטה וטהר (פסוק ז) ובא השמש וטהר, מה להלן ביאת שמש, אף כאן ביאת שמש: <br><br><b>בכל טמא נפש.<\/b> בְּמִי שֶׁנִּטְמָא בְמֵת:", "rashi_en": "1 Among Aaron’s offspring: I know only that Aaron’s offspring. How do I know that he himself is also included]? Talmud says, “if he has tzara’ath ”; for one might think that since he is allowed to offer up holy sacrifices when he is an onen , he would also be allowed to offer them up if he has tzara’ath or if he had a discharge. Talmud, therefore, says, “if he…” <br><br>2. Until he cleanses himself: At sunset , or, perhaps, it means only immersion. It says here, וְטָהֵר, and it says below (verse 7), וְטָהֵר,  Just as there it means sunset, here too, it means sunset.<br><br>בכל טמא נפש [AND WHOSO TOUCHETH] ANY טמא נפש — This means: who touches a person who has become defiled by a corpse."}, {"ch": 22, "v": 5, "aliyah": 2, "heb": "אוֹ־אִישׁ֙ אֲשֶׁ֣ר יִגַּ֔ע בְּכׇל־שֶׁ֖רֶץ אֲשֶׁ֣ר יִטְמָא־ל֑וֹ א֤וֹ בְאָדָם֙ אֲשֶׁ֣ר יִטְמָא־ל֔וֹ לְכֹ֖ל טֻמְאָתֽוֹ׃", "onk": "אוֹ גְבַר דִּי יִקְרַב בְּכָל רִחֲשָׁא דִּי יִסְתָּאַב לֵיהּ אוֹ בַאֲנָשָׁא דִּי יִסְתָּאַב לֵיהּ לְכֹל סֹאבְתֵיהּ:", "onk_en": "or anyone who touches any creeping creature that causes impurity to him, or any person which causes impurity to him, [with] whatever impurity he has.", "pj": "אוֹ גְבַר דִי יִקְרַב בְּכָל רִחְשָׁא דְיִסְתְּאַב לֵיהּ אוֹ בְאֵינָשָׁא דְמִית דְיִסְתְּאַב לֵיהּ וּלְכָל סְאוּבְתֵּיהּ בְּחַיוֹי", "pj_en": "or who toucheth any reptile that maketh unclean, or (the corpse of) a dead man which maketh unclean, or any of the uncleanness of his life,", "tj": "", "tj_en": "", "rashi": "<b>בכל שרץ אשר יטמא לו.<\/b> בְּשִׁעוּר הָרָאוּי לְטַמֵּא — בְּכָעֲדָשָׁה (חגיגה י\"א):<br><br><b>או באדם.<\/b> בְּמֵת:<br><br><b>אשר יטמא לו.<\/b> בְּשִׁעוּרוֹ לְטַמֵּא וְזֶהוּ כַּזַּיִת (אהלות פ\"ב):<br><br><b>לכל טמאתו.<\/b> לְרַבּוֹת נוֹגֵעַ בְּזָב וְזָבָה נִדָּה וְיוֹלֶדֶת:", "rashi_en": "בכל שרץ אשר יטמא לו [OR WHOSOEVER TOUCHETH] ANY PROLIFIC CREATURE BECAUSE OF WHICH (לו) HE MAY BE MADE UNCLEAN — This means: who touches any שרץ of the minimum size that is capable of communicating uncleanness, viz., a particle of the size of a lentil (cf. Sifra, Emor, Chapter 4 4; Chagigah 11a).<br><br>או באדם OR A HUMAN BEING — a dead person (Sifra, Emor, Chapter 4 4). <br><br>אשר יטמא לו BY WHOM HE MAY BE MADE UNCLEAN - i. e. by touching the minimum size of a portion of the dead person which is capable of transmitting uncleanness, and this is, a portion as large as an olive (Mishnah Oholot 2:1).<br><br>לכל טמאתו WHATSOEVER UNCLEANNESS HE HATH — This is intended to include in the prohibition of eating holy things one who has touched a man or a woman who has an issue, or who has touched a נדה or a woman in childbirth (Sifra, Emor, Chapter 4 4)."}, {"ch": 22, "v": 6, "aliyah": 2, "heb": "נֶ֚פֶשׁ אֲשֶׁ֣ר תִּגַּע־בּ֔וֹ וְטָמְאָ֖ה עַד־הָעָ֑רֶב וְלֹ֤א יֹאכַל֙ מִן־הַקֳּדָשִׁ֔ים כִּ֛י אִם־רָחַ֥ץ בְּשָׂר֖וֹ בַּמָּֽיִם׃", "onk": "אֱנַשׁ דִּי יִקְרַב בֵּיהּ וִיהֵי מְסָאָב עַד רַמְשָׁא וְלָא יֵיכוּל מִן קוּדְשַׁיָּא אֱלָהֵן אַסְחֵי בִשְׂרֵיהּ בְּמַיָּא:", "onk_en": "Anyone touching [that person] will be impure until the evening. He shall not eat of the holy things unless he has washed his body in water.", "pj": "בַּר נַשׁ כּהֵן דְיִקְרַב בֵּיהּ יְהֵי מְסָאָב עַד רַמְשָׁא וְלָא יֵיכוּל מִן קוּדְשַׁיָא אֱלָהֵן אִין אַסְחֵי בִּישְרֵיהּ בְּאַרְבְּעִין סָוִוין דְמוֹי", "pj_en": "the man being a priest who toucheth such shall be unclean until the evening, and may not eat of the holy things, except that he wash his flesh in forty seahs of water.", "tj": "", "tj_en": "", "rashi": "<b>נפש אשר תגע בו.<\/b> בְּאֶחָד מִן הַטְּמֵאִים הַלָלוּ:", "rashi_en": "נפש אשר תגע בו THE SOUL WHICH HATH TOUCHED IT — i. e. who touches any one of these unclean persons or things (enumerated in the second half of v. 4 and in v. 5)."}, {"ch": 22, "v": 7, "aliyah": 2, "heb": "וּבָ֥א הַשֶּׁ֖מֶשׁ וְטָהֵ֑ר וְאַחַר֙ יֹאכַ֣ל מִן־הַקֳּדָשִׁ֔ים כִּ֥י לַחְמ֖וֹ הֽוּא׃", "onk": "וּבְמֵעַל שִׁמְשָׁא וְיִדְכֵּי וּבָתַר כֵּן יֵיכוּל מִן קוּדְשַׁיָּא אֲרֵי לַחְמֵיהּ הוּא:", "onk_en": "When the sun sets, he is pure, and afterwards, he may eat of the holy things, for it is his bread.", "pj": "וְיִטְמוֹעַ שִׁמְשָׁא וְיִתְכַּשֵׁר וּבָתַר כְּדֵין יֵיכוּל מִן קוּדְשַׁיָא אֲרוּם מְזוֹנֵיהּ הוּא", "pj_en": "And when the sun hath set and he be fit, he may afterward eat of the holy things; for they are his food.", "tj": "", "tj_en": "", "rashi": "<b>ואחר יאכל מן הקדשים.<\/b> נִדְרֶשֶׁת בִּיבָמוֹת (דף ע\"ד), בִּתְרוּמָה שֶׁמֻּתָּר לְאָכְלָהּ בְּהַעֲרֵב הַשֶּׁמֶשׁ:<br><br><b>מן הקדשים.<\/b> וְלֹא כָל הַקֳּדָשִׁים:", "rashi_en": "ואחר יאכל מן הקדשים [AND WHEN THE SUN IS DOWN HE SHALL BE CLEAN] AND MAY AFTERWARDS EAT OF HOLY THINGS — This is interpreted in Treatise Jebamoth (74b) to have reference to the heave-offering (not to holy things of every description): that he (a priest who was unclean and has bathed) is permitted to eat it as soon as the sun has set.<br><br>מן הקדשים accordingly means: some OF THE HOLY THINGS, but not all holy things (the word מן having a partitive meaning: “some of”)."}, {"ch": 22, "v": 8, "aliyah": 2, "heb": "נְבֵלָ֧ה וּטְרֵפָ֛ה לֹ֥א יֹאכַ֖ל לְטׇמְאָה־בָ֑הּ אֲנִ֖י יְהֹוָֽה׃", "onk": "נְבִילָא וּתְבִירָא לָא יֵיכוּל לְאִסְתָּאָבָא בַהּ אֲנָא יְיָ:", "onk_en": "An animal which has died on its own, or an animal that was fatally maimed, he must not eat to defile himself with it, I am Adonoy.", "pj": "נְבֵילָא וּקְטוֹלָא לָא יֵיכוּל לְאִסְתָּאֲבָא בָהּ אֲנָא יְיָ", "pj_en": "But of a dead carcase, or (that which hath been) killed (by violence), he may not eat to defile himself therewith. I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>נבלה וטרפה לא יאכל לטמאה בה.<\/b> לְעִנְיַן הַטֻּמְאָה הִזְהִיר כָּאן, שֶׁאִם אָכַל נִבְלַת עוֹף טָהוֹר שֶׁאֵין לָהּ טֻמְאַת מַגָּע וּמַשָּׂא אֶלָּא טֻמְאַת אֲכִילָה בְּבֵית הַבְּלִיעָה, אָסוּר לֶאֱכֹל בַּקֳּדָשִׁים; וְצָרִיךְ לוֹמַר \"וּטְרֵפָה\" — מִי שֶׁיֵּשׁ בְּמִינוֹ טְרֵפָה, יָצָא נִבְלַת עוֹף טָמֵא שֶׁאֵין בְּמִינוֹ טְרֵפָה:", "rashi_en": "נבלה וטרפה לא יאכל לטמאה בה CARRION, OR THAT WHICH IS TORN HE SHALL NOT EAT TO BECOME UNCLEAN THEREBY — It is with regard to the defilement that Scripture lays down this prohibition: that if he (the priest) eats the carrion of a clean bird — which has no defiling effect through being touched or carried but has a defiling effect only when eaten, as soon as it is in the gullet — he is forbidden to eat holy things (Sifra, Acharei Mot, Chapter 12 6). And it was necessary for Scripture to mention טרפה also, in order to define what נבלה is here intended, viz., one that can have a טרפה amongst the individuals of its class: therefore the נבלה of an unclean bird is excluded, for in its class a טרפה can never occur (cf. Rashi on Leviticus 17:15)."}, {"ch": 22, "v": 9, "aliyah": 2, "heb": "וְשָׁמְר֣וּ אֶת־מִשְׁמַרְתִּ֗י וְלֹֽא־יִשְׂא֤וּ עָלָיו֙ חֵ֔טְא וּמֵ֥תוּ ב֖וֹ כִּ֣י יְחַלְּלֻ֑הוּ אֲנִ֥י יְהֹוָ֖ה מְקַדְּשָֽׁם׃", "onk": "וְיִטְּרוּן יָת <b>מַטְּרַת מֵימְרִי<\/b> וְלָא יְקַבְּלוּן עֲלוֹהִי חוֹבָא וִימוּתוּן בֵּיהּ אֲרֵי יְחַלֻּנֵּיהּ אֲנָא יְיָ מְקַדִּשְׁהוֹן:", "onk_en": "They shall keep my charge [<b>the charge of My Word<\/b>] lest they bear [the burden] of sin and die because of it for having profaned [it]. I am Adonoy Who makes them holy.", "pj": "וְיִטְרוּן בְּנֵי יִשְרָאֵל יַת מַטְרַת מֵימְרִי וְלָא יְקַבְּלוּן עֲלוֹי חוֹבָא וְלָא יְמוּתוּן בֵּיהּ בְּאֵישָׁא מְצַלְהֲבָא אֲרוּם יִפְסוּנֵיהּ אֲנָא יְיָ מְקַדִשְׁהוֹן", "pj_en": "But the sons of Israel shall observe the keeping of My Word, that they may not bring sin upon themselves, nor die for it by the flaming fire; because they have profaned it: I am the Lord who sanctify them.", "tj": "", "tj_en": "", "rashi": "<b>ושמרו את משמרתי.<\/b> מִלֶּאֱכֹל תְּרוּמָה בְּטֻמְאַת הַגּוּף (סנהדרין פ\"ג):<br><br><b>ומתו בו.<\/b> לִמְּדָנוּ שֶׁהִיא מִיתָה בִידֵי שָׁמָיִם (שם):", "rashi_en": "ושמרו את משמרתי THEY SHALL THEREFORE KEEP MY CHARGE — not to eat the heave-offering (as mentioned in v. 7) whilst they are in a state of bodily uncleanness (Sanhedrin 83a).<br><br>ומתו בו LEST THEY DIE THEREBY — This phrase teaches us that this means death through Heaven (not through the sentence of the court) (cf. Sanhedrin 83a)."}, {"ch": 22, "v": 10, "aliyah": 2, "heb": "וְכׇל־זָ֖ר לֹא־יֹ֣אכַל קֹ֑דֶשׁ תּוֹשַׁ֥ב כֹּהֵ֛ן וְשָׂכִ֖יר לֹא־יֹ֥אכַל קֹֽדֶשׁ׃", "onk": "וְכָל חִלּוֹנַי לָא יֵיכוּל קוּדְשָׁא תּוֹתָבָא דְכַהֲנָא וַאֲגִירָא לָא יֵיכוּל קוּדְשָׁא:", "onk_en": "No stranger (non-<i>kohein<\/i>) may eat holy things. One indentured to a <i>kohein<\/i> and one hired [by a <i>kohein<\/i>] may not eat sacred-offerings.", "pj": "וְכָל חִילוֹנֵי לָא יֵיכוּל קוּדְשָׁא בַּר יִשְרָאֵל דְהוּא תּוֹתָבָא דְכַהֲנָא וְאַגִירָא לָא יֵיכוּל קוּדְשָׁא", "pj_en": "No stranger or profane person shall eat of a consecrated thing, (neither) a son of Israel who is an inmate of the priest, nor any hireling, may eat of the hallowed thing.", "tj": "", "tj_en": "", "rashi": "<b>לא יאכל קדש.<\/b> בִּתְרוּמָה הַכָּתוּב מְדַבֵּר, שֶׁכָּל הָעִנְיָן דִּבֵּר בָּהּ:<br><br><b>תושב כהן ושכיר.<\/b> תּוֹשָׁבוֹ שֶׁל כֹּהֵן וּשְׂכִירוֹ, לְפִיכָךְ \"תּוֹשַׁב\" זֶה נָקוּד פַּתָּח, לְפִי שֶׁהוּא דָּבוּק; וְאֵיזֶהוּ תּוֹשָׁב? זֶה נִרְצָע שֶׁהוּא קָנוּי לוֹ עַד הַיּוֹבֵל, וְאֵיזֶהוּ שָֹכִיר? זֶה קָנוּי קִנְיַן שָׁנִים שֶׁיּוֹצֵא בְשֵׁשׁ, בָּא הַכָּתוּב וְלִמֶּדְךָ כָּאן שֶׁאֵין גּוּפוֹ קָנוּי לַאֲדוֹנָיו לֶאֱכֹל בִּתְרוּמָתוֹ (ספרא; יבמות ע'):", "rashi_en": "לא יאכל קדש [THERE SHALL] NO [LAYMAN] EAT OF THE HOLY THINGS — Scripture is speaking here of the heave-offering (i. e., the word קדש  means here תרומה only, and not any holy food) because the whole section (cf. Rashi on v. 7 and 9) is speaking of this.<br><br>תושב כהן ושכיר A SOJOURNER WITH THE PRIEST OR A HIRED SERVANT [SHALL NOT EAT OF THE HOLY THINGS] — These words mean: the תושב of a כהן and his שכיר (not a כהן who is a תושב or a שכיר); on this account this word תושב here is punctuated with a Patach, because it is in the construct state. What is a תושב? One (a Hebrew servant) whose ear has been pierced (cf. Exodus 21:6), who thereby becomes his (the master’s) possession until the Jubilee year. And what is a שכיר? One (a Hebrew servant) who has been acquired as his possession for a limited number of years only — who goes free at the end of six years (cf. Exodus 21:2). Scripture intends to teach you here that it is not his body (that of the תושב or the שכיר), but only his labour for a term of years that has been acquired by his master that he should become entitled to eat of his heave-offering (as is the case with the קנין כספו, with “a person obtained as a property with money”, mentioned in the next verse) (Sifra, Emor, Section 5 17; Yevamot 70b)."}, {"ch": 22, "v": 11, "aliyah": 2, "heb": "וְכֹהֵ֗ן כִּֽי־יִקְנֶ֥ה נֶ֙פֶשׁ֙ קִנְיַ֣ן כַּסְפּ֔וֹ ה֖וּא יֹ֣אכַל בּ֑וֹ וִילִ֣יד בֵּית֔וֹ הֵ֖ם יֹאכְל֥וּ בְלַחְמֽוֹ׃", "onk": "וְכָהֵן אֲרֵי יִקְנֵי נְפַשׁ קִנְיַן כַּסְפֵּיהּ הוּא יֵיכוּל בֵּיהּ וִילִיד בֵּיתֵיהּ אִנּוּן יֵיכְלוּן בְּלַחְמֵיהּ:", "onk_en": "If a <i>kohein<\/i> shall purchase a person [as a slave, that person is] his monetary possession. He may eat of it, and the [slave] born in his house, they may eat of his bread.", "pj": "וְכַהֲנָא אֲרוּם יִקְנֵי בַּר נַשׁ נוּכְרָאָה קִנְיַן כַּסְפֵּיהּ הוּא יֵיכוֹל בֵּיהּ וּמַרְבְּיָינֵי בַיְיתֵיהּ הִינוּן יֵיכְלוּן בְּלַחֲמֵיהּ", "pj_en": "But if the priest buy a man a stranger with the price of his money, he may eat of it, and such as have grown up in his house may eat of his bread.", "tj": "", "tj_en": "", "rashi": "<b>וכהן כי יקנה נפש.<\/b> עֶבֶד כְּנַעֲנִי שֶׁקָּנוּי לְגוּפוֹ:<br><br><b>ויליד ביתו.<\/b> אֵלּוּ בְנֵי הַשְּׁפָחוֹת; וְאֵשֶׁת כֹּהֵן אוֹכֶלֶת בִּתְרוּמָה מִן הַמִּקְרָא הַזֶּה, שֶׁאַף הִיא קִנְיַן כַּסְפּוֹ, וְעוֹד לָמֵד מִמִּקְרָא אַחֵר (במדבר י\"ח), כָּל טָהוֹר בְּבֵיתְךָ וְגוֹ' בְּסִפְרֵי:", "rashi_en": "וכהן כי יקנה נפש BUT IF THE PRIEST BUY ANY SOUL… [HE MAY EAT OF IT] — This refers to a Canaanitish servant who has been acquired even in respect to his body (not only as regards his work). <br><br>ויליד ביתו AND THEY THAT ARE BORN IN HIS HOUSE — This refers to the children of his maid-servants. A priest's wife may eat תרומה as may be derived from this verse, for she, too, is “an acquisition obtained by his money” (Ketuvot 57b; cf. Mishna Kiddushin 1:1… ‎'האשה נקנית בכסף וכו‎‎‎, one of the ways in which a marriage may be contracted is by the passing of money or its equivalent from the man to the woman. A wife is therefore a קנין כסף). But it may also be derived from another verse (Numbers 18:11) \"[the heave-offering…] everyone that is clean in thy house may eat of it”. Thus is it expounded in Sifrei Bamidbar 117 2."}, {"ch": 22, "v": 12, "aliyah": 2, "heb": "וּבַ֨ת־כֹּהֵ֔ן כִּ֥י תִהְיֶ֖ה לְאִ֣ישׁ זָ֑ר הִ֕וא בִּתְרוּמַ֥ת הַקֳּדָשִׁ֖ים לֹ֥א תֹאכֵֽל׃", "onk": "וּבַת כָּהֵן אֲרֵי תְהֵי לִגְבַר חִלּוֹנָי הִיא <b>בְּאַפְרָשׁוּת<\/b> קוּדְשַׁיָּא לָא תֵיכוּל:", "onk_en": "When a koheins daughter marries a non-<i>kohein<\/i>, the sacred <i>terumah<\/i> [<b>separated<\/b>] portions may not be eaten by her.", "pj": "וּבְרַת כּהֵן אֲרוּם תְּהֵי מִתְנַסְבָא לִגְבַר חִילוֹנֵי הִיא בְּאַפְרָשׁוּת קוּדְשַׁיָא לָא תֵיכוּל", "pj_en": "And the daughter of a priest, if she be married to a man a stranger, may not eat of things set apart by consecration.", "tj": "", "tj_en": "", "rashi": "<b>לאיש זר.<\/b> לְלֵוִי וְיִשְׂרָאֵל (ספרא):", "rashi_en": "לאיש זר TO A LAYMAN — to a Levite or an ordinary Israelite (i. e. to any non-priest) (Sifra, Emor, Section 5 7)."}, {"ch": 22, "v": 13, "aliyah": 2, "heb": "וּבַת־כֹּהֵן֩ כִּ֨י תִהְיֶ֜ה אַלְמָנָ֣ה וּגְרוּשָׁ֗ה וְזֶ֘רַע֮ אֵ֣ין לָהּ֒ וְשָׁבָ֞ה אֶל־בֵּ֤ית אָבִ֙יהָ֙ כִּנְעוּרֶ֔יהָ מִלֶּ֥חֶם אָבִ֖יהָ תֹּאכֵ֑ל וְכׇל־זָ֖ר לֹא־יֹ֥אכַל בּֽוֹ׃", "onk": "וּבַת כָּהֵן אֲרֵי תְהֵי אַרְמְלָא וּמְתָרְכָא וּבַר לֵית לַהּ וּתְתוּב לְבֵית אֲבוּהָא כְּרַבְיוּתָהָא מִלַּחְמָא דַאֲבוּהָא תֵּיכוּל וְכָל חִלּוֹנַי לָא יֵיכוּל בֵּיהּ:", "onk_en": "If a koheins daughter is either widowed or divorced, and she has no children, and she returns to her fathers home as in her youth, she may eat of her fathers bread. No non-<i>kohein<\/i> may eat of it.", "pj": "וּבְרַת כּהֵן אֲרוּם תְּהֵי אַרְמְלָא אוֹ מִיתַרְכָא וּוְלַד לֵית לָהּ מִנֵיהּ וְתָבָת לְבֵית אִיבָהָא דְלָא מִינְטְרָא לְיָבָם הֵי כְּיוֹמֵי טַלְיוּתָהּ וְלָא מְעַבְּרָא מִן מְזוֹנֵיהּ דְאִיבָהָא תֵּיכוּל וְכָל חִילוֹנֵי לָא יֵיכוֹל בֵּיהּ", "pj_en": "But if the daughter of a priest be a widow, or be divorced and having no child by him hath returned to her father's house, and hath not been wedded to a brother-in-law, (Deut. xxv. 5,) she, being as in the days of her youth, and not being with child, may eat of her father's meat; but no stranger shall eat thereof.", "tj": "", "tj_en": "", "rashi": "<b>אלמנה וגרושה.<\/b> מִן הָאִישׁ הַזָּר:<br><br><b>וזרע אין לה.<\/b> מִמֶּנּוּ:<br><br><b>ושבה.<\/b> הָא אִם יֵשׁ לָהּ זֶרַע מִמֶּנּוּ, אֲסוּרָה בִתְרוּמָה כָּל זְמַן שֶׁהַזֶּרַע קַיָּם (יבמות ע\"ז):<br><br><b>וכל זר לא יאכל בו.<\/b> לֹא בָא אֶלָּא לְהוֹצִיא אֶת הָאוֹנֵן — שֶׁמֻּתָּר בִּתְרוּמָה, זָרוּת אָמַרְתִּי לְךָ וְלֹא אֲנִינוּת (שם שם ס\"ח):", "rashi_en": "אלמנה וגרושה [BUT IF A PRIEST'S DAUGHTER BE] A WIDOW OR DIVORCED WIFE of the layman mentioned in the preceding verse,<br><br>וזרע אין לה AND SHE HATH NO DESCENDANTS — from him (from the layman) (Sifra; Yevamot 87a),<br><br>ושבה THEN SHE MAY RETURN [UNTO HER FATHER'S HOUSE AS IN HER YOUTH  AND MAY EAT OF HER FATHER’S BREAD] — if, however, she has descendants from him she is forbidden to eat as long as the descendants (cf. Yevamot 87a) are alive.<br><br>וכל זר לא יאכל בו BUT THERE SHALL NO LAYMAN EAT THEREOF — The repetition of the prohibition already mentioned in v. 10 intends nothing else than to exclude from it the אונן — i. e. that he (the אונן) is permitted to eat תרומה. [Scripture, as it were, says here:] The status of being a non-priest, I tell you, debars one from eating תרומה but not that of being
