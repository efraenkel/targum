 וּדְיֵיכוֹל בְּבֵיתָא יְצַבַּע יַת לְבוּשׁוֹי", "pj_en": "And whoever sleepeth in the house shall wash his clothes, and whoever eateth in the house shall wash his clothes.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 48, "aliyah": 4, "heb": "וְאִם־בֹּ֨א יָבֹ֜א הַכֹּהֵ֗ן וְרָאָה֙ וְ֠הִנֵּ֠ה לֹא־פָשָׂ֤ה הַנֶּ֙גַע֙ בַּבַּ֔יִת אַחֲרֵ֖י הִטֹּ֣חַ אֶת־הַבָּ֑יִת וְטִהַ֤ר הַכֹּהֵן֙ אֶת־הַבַּ֔יִת כִּ֥י נִרְפָּ֖א הַנָּֽגַע׃", "onk": "וְאִם מֵעַל יֵיעוֹל כַּהֲנָא וְיֶחֱזֵי וְהָא לָא <b>אוֹסֵף<\/b> מַכְתָּשָׁא בְּבֵיתָא בָּתַר דְּאִתְּשַׁע יָת בֵּיתָא וִידַכֵּי כַהֲנָא יָת בֵּיתָא אֲרֵי אִתַּסִּי מַכְתָּשָׁא:", "onk_en": "If the <i>kohein<\/i> shall come and see; and behold! the eruption did not spread [<b>increase<\/b>] in the house after the house was plastered, the <i>kohein<\/i> shall pronounce the house [to be] pure, for the eruption has been healed.", "pj": "וְאִין מֵעַל יֵיעוֹל כַּהֲנָא וְיֶחֱמֵי וְהָא לָא הֲלִיךְ פִּיסְיוֹן מַכְתְּשָׁא בְּבֵיתָא בָּתַר דְאִיתְטַשׁ יַת בֵּיתָא וְיִדְכֵּי כַּהֲנָא יַת בֵּיתָא אֲרוּם אִיתְּסֵי מַכְתְּשָׁא", "pj_en": "But if, having gone in, the priest looketh, and, behold the breadth of the plague hath not increased in the house, after the house hath been plastered, then the priest shall make the house to be clean, for the plague hath healed.", "tj": "", "tj_en": "", "rashi": "<b>ואם בא יבא.<\/b> לְסוֹף שָׁבוּעַ שֵׁנִי:<br><br><b>וראה והנה לא פשה.<\/b> מִקְרָא זֶה בָּא לְלַמֵּד בָּעוֹמֵד בְּעֵינָיו בָּרִאשׁוֹן וּבַשֵּׁנִי וּמַה יַּעֲשֶׂה לוֹ, יָכוֹל יְטַהֲרֶנּוּ, כְּמַשְׁמָעוֹ שֶׁל מִקְרָא \"וְטִהַר הַכֹּהֵן אֶת הַבַּיִת\", תַּ\"ל כִּי נִרְפָּא הַנָּגַע — לֹא טִהַרְתִּי אֶלָּא אֶת הָרָפוּי; וְאֵין רָפוּי אֶלָּא הַבַּיִת שֶׁהֻקְצָה וְהוּטַח וְלֹא חָזַר הַנֶּגַע — אֲבָל זֶה טָעוּן חֲלִיצָה וְקִצּוּי וְטִיחָה וְשָׁבוּעַ שְׁלִישִׁי; וְכֵן הַמִּקְרָא נִדְרָשׁ: וְאִם בֹּא יָבֹא בַשֵּׁנִי, וְרָאָה וְהִנֵּה לֹא פָשָׂה, יְטִיחֶנּוּ — וְאֵין טִיחָה בְּלֹא חִלּוּץ וְקִצּוּי — וְאַחֲרֵי הִטּוֹחַ אֶת הַבַּיִת וְטִהַר הַכֹּהֵן אֶת הַבַּיִת, אִם לֹא חָזַר לְסוֹף הַשָּׁבוּעַ, כִּי נִרְפָּא הַנָּגַע, וְאִם חָזַר, כְּבָר פֵּרֵשׁ עַל הַחוֹזֵר שֶׁטָּעוּן נְתִיצָה:", "rashi_en": "ואם בא יבא AND IF [THE PRIEST] SHALL COME IN at the end of the second week,<br><br>וראה והנה לא פשה AND LOOK UPON IT, AND, BEHOLD, THE PLAGUE HATH NOT SPREAD … [THEN THE PRIEST SHALL PRONOUNCE THE HOUSE CLEAN].— This verse, as shown above, is intended to teach the law regarding the case that it (the plague) has stayed as it was during both the first week and the second week. What shall he do to it? One might think that he shall pronounce it clean just as the verse literally implies: וטהר הכהן את הבית \"and the priest shall pronounce the house clean\"! It, however, states, \"[The priest shall declare the house clean] כי נרפא הנגע if the plague is healed\" — Scripture says, as it were, I pronounce clean only that plague which is healed, and only that house is healed which has been scraped and re-plastered and in which the plague has not recurred, but this, in which during two weeks the plague has remained in the same condition, is not yet healed and thus not yet clean, and requires removal of the stones, scraping and re-plastering and yet a third week. And the verse is accordingly to be explained as follows: ואם בא יבא, And if having come once he comes again at the end of the second week and he looks upon it, and, behold, it has not spread, he shall re-plaster it and of course also remove the stones and scrape it — for re-plastering never takes place without removal of the stones and scraping (and Scripture merely states אחרי הטוח for the sake of brevity) — אחרי הטוח את הבית and after the house has been re-plastered, וטהר הכהן את הבית, shall the priest pronounce clean, if the plague has not returned at the end of the third week, כי נרפא הנגע FOR THEN THE PLAGUE IS HEALED. If, however, it has returned at the end of that week it is unnecessary to state the law here since it has already explained regarding a recurring plague that it requires the demolition of the house (cf. Rashi on v. 44)."}, {"ch": 14, "v": 49, "aliyah": 4, "heb": "וְלָקַ֛ח לְחַטֵּ֥א אֶת־הַבַּ֖יִת שְׁתֵּ֣י צִפֳּרִ֑ים וְעֵ֣ץ אֶ֔רֶז וּשְׁנִ֥י תוֹלַ֖עַת וְאֵזֹֽב׃", "onk": "וְיִסַּב לְדַכָּאָה יָת בֵּיתָא תַּרְתֵּין צִפְּרִין וְאָעָא דְאַרְזָא <b>וּצְבַע<\/b> זְהוֹרִי וְאֵזוֹבָא:", "onk_en": "He shall take, to purify the house, two birds, cedar wood, crimson [<b>colored<\/b>] thread and hyssop.", "pj": "וְיִסַב לְדַכָּאָה יַת בֵּיתָא תַּרְתֵּין צִפְּרִין וְקֵיסָא דְאַרְזָא וּצְבַע זְהוֹרֵי וְאֵיזוֹבָא", "pj_en": "And he shall take, for the purification plague of the house, two turtle doves and cedarwood and scarlet and hyssop;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 50, "aliyah": 4, "heb": "וְשָׁחַ֖ט אֶת־הַצִּפֹּ֣ר הָאֶחָ֑ת אֶל־כְּלִי־חֶ֖רֶשׂ עַל־מַ֥יִם חַיִּֽים׃", "onk": "וְיִכּוֹס יָת צִפֲּרָא חֲדָא לְמַאן דַּחֲסַף עַל מֵי מַבּוּעַ:", "onk_en": "He shall slaughter one bird in an earthenware vessel, over running water.", "pj": "וְיִכּוֹס טַבְּחָא יַת צִיפְּרָא חָדָא לְמָנָא דְפָחַר עַל מֵי מַבּוּעַ", "pj_en": "and the slayer shall kill one turtle dove in a vessel of earthenware with spring water;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 51, "aliyah": 4, "heb": "וְלָקַ֣ח אֶת־עֵֽץ־הָ֠אֶ֠רֶז וְאֶת־הָ֨אֵזֹ֜ב וְאֵ֣ת&thinsp;<b>׀<\/b> שְׁנִ֣י הַתּוֹלַ֗עַת וְאֵת֮ הַצִּפֹּ֣ר הַֽחַיָּה֒ וְטָבַ֣ל אֹתָ֗ם בְּדַם֙ הַצִּפֹּ֣ר הַשְּׁחוּטָ֔ה וּבַמַּ֖יִם הַֽחַיִּ֑ים וְהִזָּ֥ה אֶל־הַבַּ֖יִת שֶׁ֥בַע פְּעָמִֽים׃", "onk": "וְיִסַּב יָת אָעָא דְאַרְזָא וְיָת אֵזוֹבָא וְיָת <b>צְבַע<\/b> זְהוֹרִי וְיָת צִפֲּרָא חַיְתָא וְיִטְבּוֹל יָתְהוֹן בִּדְמָא דְּצִפֲּרָא דִנְכִיסָא וּבְמֵי מַבּוּעַ וְיַדִּי לְבֵיתָא שְׁבַע זִמְנִין:", "onk_en": "He shall take the cedar wood, the hyssop, the crimson [<b>colored<\/b>] thread and the live bird and immerse them in the blood of the slaughtered bird and in the running water, and sprinkle the house seven times.", "pj": "וְיִסַב יַת קֵיסָא דְאַרְזָא וְיַת אֵיזוֹבָא וְיַת צְבַע זְהוֹרֵי וְיַת צִפְּרָא חַיְיתָא וְיִטְמוֹשׁ יָתֵיהּ בְּאַדְמָא דְצִיפְּרָא נְכִיסְתָּא וּבְמֵי מַבּוּעַ וְיַדֵי לְבֵיתָא שְׁבַע זִמְנִין", "pj_en": "and he shall take the cedarwood and the hyssop and the scarlet and the living bird, and dip them in the blood of the bird that had been killed and in the spring water, and sprinkle the house seven times.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 52, "aliyah": 4, "heb": "וְחִטֵּ֣א אֶת־הַבַּ֔יִת בְּדַם֙ הַצִּפּ֔וֹר וּבַמַּ֖יִם הַֽחַיִּ֑ים וּבַצִּפֹּ֣ר הַחַיָּ֗ה וּבְעֵ֥ץ הָאֶ֛רֶז וּבָאֵזֹ֖ב וּבִשְׁנִ֥י הַתּוֹלָֽעַת׃", "onk": "וִידַכֵּי יָת בֵּיתָא בִּדְמָא דְּצִפֲּרָא וּבְמֵי מַבּוּעַ וּבְצִפֲּרָא חַיְתָא וּבְאָעָא דְאַרְזָא וּבְאֵזוֹבָא <b>וּבִצְבַע<\/b> זְהוֹרִי:", "onk_en": "He shall purify the house with the blood of the bird, and with the running water, and with the live bird, the cedar wood, the hyssop and the crimson [<b>colored<\/b>] thread.", "pj": "וְיִדְכֵּי יַת בֵּיתָא בְּאַדְמָא דְצִפְּרָא חַיְיתָא וּבְקֵיסָא דְאַרְזָא וּבְאֵיזוֹבָא וּבִצְבַע זְהוֹרֵי", "pj_en": "And he shall purify the house with the blood, with the living bird, and with the cedarwood, and with the hyssop, and with the scarlet.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 53, "aliyah": 4, "heb": "וְשִׁלַּ֞ח אֶת־הַצִּפֹּ֧ר הַֽחַיָּ֛ה אֶל־מִח֥וּץ לָעִ֖יר אֶל־פְּנֵ֣י הַשָּׂדֶ֑ה וְכִפֶּ֥ר עַל־הַבַּ֖יִת וְטָהֵֽר׃", "onk": "וִישַׁלַּח יָת צִפֲּרָא חַיְתָא לְמִבָּרָא לְקַרְתָּא לְאַפֵּי חַקְלָא וִיכַפַּר עַל בֵּיתָא וְיִדְכֵּי:", "onk_en": "He shall send the living bird, beyond the city into the open field, and atone for the house and it shall be purified.", "pj": "וְיִפְטוֹר יַת צִיפּוֹרָא חַיְיתָא לְמִבָּרָא לְקַרְתָּא עַל אַנְפֵּי חַקְלָא וִיכַפֵּר עַל בֵּיתָא וְיִדְכֵּי בְּרַם אִין אִיטוּמוֹס בַּיְיתָא לְמִילְקָא תוּב בְּצוֹרְעָא תַיְיבָא צִפּוֹרָא תַּמָּן בְּיוֹמָא הַהוּא וּמִתְכַּשְׁרָא לְמֵיכְלָא וְיַת צִיפְּרָא נְכִיסְתָּא הֲוָה מִקְבַּר כַּהֲנָא בְּמֵיחְמֵי מָרֵי בֵיתָא", "pj_en": "And the living bird he shall send forth out of the town upon the face of the field, and shall atone for the house, and it shall be clean. But if it is to be that the house will be again struck with leprosy, the bird on that day will return, and may be fit for food. But the bird that was killed shall the priest bury in the presence of the owner of the house.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 54, "aliyah": 5, "heb": "זֹ֖את הַתּוֹרָ֑ה לְכׇל־נֶ֥גַע הַצָּרַ֖עַת וְלַנָּֽתֶק׃", "onk": "דָּא אוֹרַיְתָא לְכָל מַכְתַּשׁ <b>סְגִירוּתָא<\/b> וּלְנִתְקָא:", "onk_en": "This is the law for all the eruptions of <i>tzoraas<\/i> [<b>’confinement’<\/b>] and for the <i>nesek<\/i>.", "pj": "דָא תֶהֱוֵי גְזֵירַת אַחְוַיַית אוֹרַיְיתָא לְכָל מַכְתַּשׁ סְגִירוּתָא וּלְנִיתְקָא", "pj_en": "This is the decree of instruction in the law for every plague of leprosy and scorbutus,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 55, "aliyah": 5, "heb": "וּלְצָרַ֥עַת הַבֶּ֖גֶד וְלַבָּֽיִת׃", "onk": "<b>וְלִסְגִירוּת<\/b> לְבוּשָׁא וּלְבֵיתָא:", "onk_en": "For <i>tzoraas<\/i> [<b>’confinement’<\/b>] of the garment and of the house.", "pj": "וּלְצוּרְעָא דִלְבוּשָׁא וּלְבֵיתָא", "pj_en": "and for leprosy in apparel, or in a house;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 56, "aliyah": 5, "heb": "וְלַשְׂאֵ֥ת וְלַסַּפַּ֖חַת וְלַבֶּהָֽרֶת׃", "onk": "<b>וּלְעַמְקָא<\/b> וּלְעַדְיָא וּלְבַהֲרָא:", "onk_en": "For the spot [<b>deeply<\/b>] white as wool, for the spot that is nearly as white and for the spot white as snow.", "pj": "וּלְשׁוּמָא וְלִקְלוֹפֵי וּלְבַהֲקֵי", "pj_en": "and for tumours, scars, and inflamed blotches.", "tj": "וּלְשׁוּמָא וּלְקַלָּפוּתָא וּלְבַהֲקֵיתָא:", "tj_en": "And for tomours, scars, and inflamed blotches.", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 57, "aliyah": 5, "heb": "לְהוֹרֹ֕ת בְּי֥וֹם הַטָּמֵ֖א וּבְי֣וֹם הַטָּהֹ֑ר זֹ֥את תּוֹרַ֖ת הַצָּרָֽעַת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "לְאַלָּפָא בְּיוֹמָא מְסָאָבָא וּבְיוֹמָא דַכְיָא דָּא אוֹרַיְתָא <b>דִּסְגִירוּתָא<\/b>:", "onk_en": "To teach [the law] of the day of becoming impure and of the day of becoming pure; this is the law of <i>tzoraas<\/i> [<b>’confinement’<\/b>].", "pj": "לְמַלְפָא כַהֲנָא לְעַמָא בֵּין יוֹמָא קְבִילָא דְלָא לְמֵיחְמֵי בֵּיהּ מַכְתְּשָׁא לְבֵין יוֹמָא נְהִירָא וּבֵין בַּר נְשָׁא מְסָאָבָא לְבֵין בַּר נְשָׁא דַכְיָא דָא תֶהֱוֵי גְזֵירַת אַחְוַיַית מַכְתַּשׁ צוֹרְעָתָא", "pj_en": "That the priest may teach the people to discern between the day of darkness in which they may not be able to see the plague, and the day of light; and between a man who is unclean and a man who is clean. This shall be the decree of instruction for the leprosy.", "tj": "", "tj_en": "", "rashi": "<b>להורת ביום הטמא.<\/b> אֵיזֶה יוֹם מְטַהֲרוֹ וְאֵיזֶה יוֹם מְטַמְּאוֹ (עי' ספרא):", "rashi_en": "להורת ביום הטמא — This may be translated: TO GIVE INSTRUCTION \"CONCERNING\" THE DAY OF ITS BEING UNCLEAN, i. e. which day renders it clean and which day renders it unclean (to point out that particular day on which, according to circumstances, a house or a garment or a person is to be declared clean or unclean)."}, {"ch": 15, "v": 1, "aliyah": 5, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר", "pj_en": "And the Lord spake with Mosheh and with Aharon, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 2, "aliyah": 5, "heb": "דַּבְּרוּ֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וַאֲמַרְתֶּ֖ם אֲלֵהֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִבְּשָׂר֔וֹ זוֹב֖וֹ טָמֵ֥א הֽוּא׃", "onk": "מַלִּילוּ עִם בְּנֵי יִשְׂרָאֵל וְתֵימְרוּן לְהוֹן גְּבַר גְּבַר אֲרֵי יְהֵי דָּאִיב מִבִּשְׂרֵיהּ דּוֹבֵיהּ מְסָאָב הוּא:", "onk_en": "Speak to Bnei Yisroel and say to them; should [discharge] flow from the body of any man, [because of] his discharge, he is impure.", "pj": "מַלִילוּ עִם בְּנֵי יִשְרָאֵל וְתֵימְרוּן לְהוֹן גְבַר טְלֵי אוֹ גְבַר סִיב אַרוּם יְהֵי דָאִיב מִבִּשְרֵיהּ דְוָיֵיהּ חֲמָא תְּלַת זִימְנֵי מְסָאָב הוּא", "pj_en": "Speak with the sons of Israel, and say to them: A man, whether young or old, who hath a defluxion from his flesh, when he hath seen it three times, is unclean.", "tj": "", "tj_en": "", "rashi": "<b>כי יהיה זב.<\/b> יָכוֹל זָב מִכָּל מָקוֹם יְהֵא טָמֵא, תַּ\"ל מִבְּשָׂרוֹ, — וְלֹא כָל בְּשָׂרוֹ. אַחַר שֶׁחִלֵּק הַכָּתוּב בֵּין בָּשָׂר לְבָשָׂר זָכִיתִי לָדִין, טִמֵּא בְזָב וְטִמֵּא בְזָבָה, מַה זָּבָה מִמָּקוֹם שֶׁהִיא מִטַּמְּאָה טֻמְאָה קַלָּה — \"נִדָּה\" — מִטַּמְּאָה טֻמְאָה חֲמוּרָה — \"זִיבָה\" — אַף הַזָּב מִמָּקוֹם שֶׁמִּטַּמֵּא טֻמְאָה קַלָּה — \"קֶרִי\" — מִטַּמֵּא טֻמְאָה חֲמוּרָה — \"זִיבָה\" (שם):<br><br><b>זובו טמא.<\/b> לִמֵּד עַל הַטִּפָּה שֶׁהִיא מְטַמְּאָה; זוֹב דּוֹמֶה לְמֵי בָצֵק שֶׁל שְׂעוֹרִין, וְדָחוּי, וְדּוֹמֶה לְלֹבֶן בֵּיצָה הַמּוּזֶרֶת, שִׁכְבַת זֶרַע קָשׁוּר, כְּלֹבֶן בֵּיצָה שֶׁאֵינָהּ מוּזֶרֶת:", "rashi_en": "כי יהיה זב WHEN THERE BE A RUNNING ISSUE — One might think if there be a running issue from any portion of his body (e. g., ear, nose) he shall be unclean!  Therefore it states מבשרו “from his flesh\" (i.e. from some part of his flesh) and not from all parts of his flesh (the prefix מ is a partitive מ). Now, however, that Scripture has made a difference between one part of his flesh and another part of his flesh, I have the right to draw a conclusion: it (the Torah) pronounces uncleanness in a case of a man with a running issue (זב) and it pronounces uncleanness in a particular case of a woman with a running issue (זבה). How is it in the case of a זבה? Through that place in her body where she becomes unclean with a lighter uncleanness, viz., that of a נדה, she also becomes unclean with a more stringent uncleanness i.e. through זיבה, a continuance of the issue beyond the usual period! Similarly the זב: through the place where he becomes unclean with a lighter uncleanness, viz., קרי, (an involuntary emission of semen which makes him unclean only until evening; cf. v. 16), he also becomes unclean through a more stringent uncleanness, viz., זיבה (when he is unclean seven days and must bring a sacrifice; cf. vv. 13 ff. with 16 ff.; from the latter it is evident which part of the body is in question; it follows logically that the same part is here intended) (Sifra, Metzora Parashat Zavim, Section 1 5).<br><br>טמא‎ זובו HIS ISSUE IS UNCLEAN — This teaches regarding a drop (i.e. the semen itself) that it communicates uncleanness (and it is not only the man that has the issue who is unclean) (Sifra, Metzora Parashat Zavim, Section 1 8-9; Niddah 55a). The זב issue referred to here is similar to water of dough (that runs out of dough) made of barley and it is dissolved (fluid) being similar to the white of an addled egg (where the white and the yolk have run together); שכבת זרע, however, is viscid and looks like the white of an egg that has not become addled (Niddah 35b)."}, {"ch": 15, "v": 3, "aliyah": 5, "heb": "וְזֹ֛את תִּהְיֶ֥ה טֻמְאָת֖וֹ בְּזוֹב֑וֹ רָ֣ר בְּשָׂר֞וֹ אֶת־זוֹב֗וֹ אֽוֹ־הֶחְתִּ֤ים בְּשָׂרוֹ֙ מִזּוֹב֔וֹ טֻמְאָת֖וֹ הִֽוא׃", "onk": "וְדָא תְּהֵי סוֹבְתֵיהּ בְּדוֹבֵיהּ רָר בִּשְׂרֵיהּ יָת דּוֹבֵיהּ אוֹ חָתִים בִּשְׂרֵיהּ מִדּוֹבֵיהּ סוֹבְתֵיהּ הִיא:", "onk_en": "This is the law of his impurity, when his discharge flows; His flesh drips [with] his discharge or his flesh is stopped up by his discharge, it causes him to become impure.", "pj": "וְדָא תְּהֵי סְאוֹבְתֵּיהּ גַווֹן חִיוַור בְּדָיֵיהּ חֲרִיר בִּישְרֵיהּ יַת דְיֵיהּ אוֹ דְאִיסְתַתֵּם בִּישְרֵיהּ מִדוֹוֵויהּ סְאוֹבְתֵּיהּ הוּא", "pj_en": "And this shall be his uncleanness, the appearance of the colour of white in his defluxion inflaming, the defluxion of his flesh; or when his flesh hath stopped from his defluxion, it is his uncleanness.", "tj": "", "tj_en": "", "rashi": "<b>רר.<\/b> לְשׁוֹן רִיר — שֶׁזָּב בְּשָׂרוֹ אֶת זוֹבוֹ כְּמוֹ רִיר, שֶׁיּוֹצֵא צָלוּל:<br><br><b>או החתים.<\/b> שֶׁיּוֹצֵא עָב, וְסוֹתֵם אֶת פִּי הָאַמָּה, וְנִסְתָּם בְּשָׂרוֹ מִטִּפַּת זוֹבוֹ, זֶהוּ פְּשׁוּטוֹ; וּמִדְרָשׁוֹ: מָנָה הַכָּתוּב הָרִאשׁוֹן רְאִיּוֹת שְׁתַּיִם וּקְרָאוֹ טָמֵא, שֶׁנֶּאֱמַר זָב מִבְּשָׂרוֹ זוֹבוֹ טָמֵא הוּא, וּמָנָה הַכָּתוּב הַשֵּׁנִי רְאִיּוֹת שָׁלֹשׁ וּקְרָאוֹ טָמֵא, שֶׁנֶּאֱמַר טֻמְאָתוֹ בְּזוֹבוֹ רָר בְּשָׂרוֹ אֶת זוֹבוֹ אוֹ הֶחְתִּים בְּשָׂרוֹ מִזּוֹבוֹ טֻמְאָתוֹ הִוא, הָא כֵיצַד? שְׁתַּיִם לְטֻמְאָה, וְהַשְּׁלִישִׁית מַזְקִיקַתּוּ לְקָרְבָּן (נדה מ\"ג: מגילה ח.):", "rashi_en": "רר [WHETHER HIS FLESH] DRIP — This word is connected with ריר \"spittle\" — the meaning is that his flesh runs with its issue as spittle, i. e. that it (the flow) comes forth clear in appearance (not thick and troubled).<br><br>או החתים OR [HIS FLESH] BE STOPPED — it means, that the flow issues thick and closes up the orifice of the membrum, so that his flesh is stopped up by the drop that issued from him. This is its literal meaning. The Halachic explanation is: The first verse (v. 2) enumerates two appearances of the issue and then terms him (the man affected by them) unclean, for it is said, \"when there flows from his flesh a flowing he is unclean\" and the other verse (v. 3) enumerates three appearances of the issue and only then terms him unclean, as it is said, \"his uncleanness through his flow: if his flesh drips through its flow as with spittle, or if his flesh is stopped up through his flowing then only is it his uncleanness!\" How can this be reconciled? Two appearances of the flow serve to make him unclean, and the third obligates him also to bring an offering (Niddah 43b; Megillah 8a)."}, {"ch": 15, "v": 4, "aliyah": 5, "heb": "כׇּל־הַמִּשְׁכָּ֗ב אֲשֶׁ֨ר יִשְׁכַּ֥ב עָלָ֛יו הַזָּ֖ב יִטְמָ֑א וְכׇֽל־הַכְּלִ֛י אֲשֶׁר־יֵשֵׁ֥ב עָלָ֖יו יִטְמָֽא׃", "onk": "כָּל מִשְׁכְּבָא דִּי יִשְׁכּוּב עֲלוֹהִי דּוֹבָנָא יְהֵי מְסָאָב וְכָל מָנָא דְיֵיתֵב עֲלוֹהִי יְהֵי מְסָאָב:", "onk_en": "Every bed [Anything that is used specifically for sleeping], upon which will lie a <i>zov<\/i> [a person from whom a discharge flows,] shall become impure. Every vessel upon which he sits, shall become impure.", "pj": "כָּל מַשְׁכְּבָא דִמְיַחֵד לִמִישְׁכּוֹב עֲלוֹי דוֹבָנָא יְהֵי מְסָאָב וְכָל מָנָא דִמְיַיחֵד לְמֵיתַב עֲלוֹי יְהֵי מְסָאָב", "pj_en": "Every bed on which one who hath such defluxion lieth shall be unclean; and every thing on which such an one sitteth shall be unclean.", "tj": "", "tj_en": "", "rashi": "<b>כל המשכב.<\/b> הָרָאוּי לְמִשְׁכָּב; יָכוֹל אֲפִלּוּ מְיֻחָד לִמְלָאכָה אַחֶרֶת, תַּ\"ל אֲשֶׁר יִשְׁכַּב — אֲשֶׁר שָׁכַב לֹא נֶאֱמַר אֶלָּא אֲשֶׁר יִשְׁכַּב — הַמְיֻחָד תָּמִיד לְכָךְ, יָצָא זֶה שֶׁאוֹמְרִין לוֹ \"עֲמֹד וְנַעֲשֶׂה מְלַאכְתֵּנוּ\":<br><br><b>אשר ישב.<\/b> יָשַׁב לֹא נֶאֱמַר אֶלָּא אֲשֶׁר יֵשֵׁב עָלָיו, בַּמְיֻחָד תָּמִיד לְכָךְ (שבת נ\"ט):", "rashi_en": "כל המשכב EVERY PLACE OF REPOSE — This means: everything that is fitted for sleeping on (thus excluding a door or plank etc.). One might, however, think that it includes anything intended for some other action also, as long as it can be used for sleeping and he actually slept upon it! It, however, states אשר ישכב — it does not state אשר שכב, “upon which one has slept\" but אשר ישכב, “upon which one sleeps usually\" — i.e. that which is intended to be used for this always, thus excluding that of which people can say to him, “Get up and let us to our work [with that upon which you are lying]\" (Sifra, Metzora Parashat Zavim, Chapter 1 1-3).<br><br>אשר ישב [EVERYTHING] WHEREON HE SITTETH — It is not said here ‎יָשַׁב ‎‏ אשר, \"on which he has sat\", but אשר יֵשֵׁב, “on which one sits usually\" — it speaks therefore of something that is intended to be used for this always (Sifra, Metzora Parashat Zavim, Chapter 1 3; Shabbat 59a)."}, {"ch": 15, "v": 5, "aliyah": 5, "heb": "וְאִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּמִשְׁכָּב֑וֹ יְכַבֵּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וּגְבַר דִּי יִקְרַב בּמִשְׁכְּבֵיהּ יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "A person who touches his bed shall wash his garments and bathe in water and is impure until the evening.", "pj": "וּגְבַר דִי יִקְרַב בְּמַשְׁכְּבֵיהּ יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And the man who toucheth his bed shall wash his clothes, and wash himself in forty seahs of water, and shall be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>ואיש אשר יגע במשכבו.<\/b> לִמֵּד עַל הַמִּשְׁכָּב שֶׁחָמוּר מִן הַמַּגָּע, שֶׁזֶּה נַעֲשֶׂה אַב הַטֻּמְאָה לְטַמֵּא אָדָם לְטַמֵּא בְגָדִים, וְהַמַּגָּע שֶׁאֵינוֹ מִשְׁכָּב אֵינוֹ אֶלָּא וְלַד הַטֻּמְאָה, וְאֵינוֹ מְטַמֵּא אֶלָּא אֳכָלִין וּמַשְׁקִין (עי' ספרא):", "rashi_en": "ואיש אשר יגע במשכבו AND WHOSOEVER TOUCHES HIS PLACE OF REPOSE [SHALL WASH HIS GARMENTS … AND BE UNCLEAN UNTIL THE EVENING] — This tells us regarding the object on which he lies down that it is more stringent than an object touched by him in any manner other than lying on it — for this (the former) becomes a primary source of uncleanness (אב הטומאה) communicating uncleanness to any man who touches it, he in turn making unclean the garments he happens to wear at that moment, while anything touched by him that is not his bed becomes only a secondary source of uncleanness of the first degree (ולד הטומאה) communicating uncleanness only to food and drink (but not to men or garments) (cf. Sifra, Metzora Parashat Zavim, Section 2 1)."}, {"ch": 15, "v": 6, "aliyah": 5, "heb": "וְהַיֹּשֵׁב֙ עַֽל־הַכְּלִ֔י אֲשֶׁר־יֵשֵׁ֥ב עָלָ֖יו הַזָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וּדְיֵיתֵב עַל מָנָא דְּיֵיתֵב עֲלוֹהִי דּוֹבָנָא יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Whoever sits on the vessel that was sat upon by a <i>zov<\/i> shall wash his garments and bathe in water and is impure until the evening.", "pj": "וְדִי יְתִיב עַל מָאנָא דִמְיַיחֵד לְמֵיתַב עֲלוֹי דוֹבָנָא יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever may sit upon a thing whereon such an one who hath an issue hath sat, let him wash his clothes, and bathe in forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>והישב על הכלי.<\/b> אֲפִלּוּ לֹא נָגַע — אֲפִלוּ עֲשָֹרָה כֵלִים זֶה עַל זֶה — כֻּלָּן מְטַמְּאִין מִשּׁוּם מוֹשָׁב, וְכֵן בְּמִשְׁכָּב:", "rashi_en": "והישב על הכלי AND HE THAT SITTETH ON ANY THING [WHEREON HE SAT THAT HATH AN ISSUE … SHALL BE UNCLEAN] — even though he (the person) is not actually in contact with it: even if there be ten things one upon the other, the lowest being that upon which a זב has once sat, they all communicate uncleanness according to the law applicable to a seat upon which an unclean person has sat, and similarly is the case with an object upon which he has lain (cf. Sifra, Metzora Parashat Zavim, Chapter 3 1)."}, {"ch": 15, "v": 7, "aliyah": 5, "heb": "וְהַנֹּגֵ֖עַ בִּבְשַׂ֣ר הַזָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וּדְיִקְרַב בִּבְסַר דּוֹבָנָא יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Whoever touches the flesh of a <i>zov<\/i> shall wash his garments and bathe in water and is impure until the evening.", "pj": "וּדְיִקְרַב בִּבְשַר דוֹבָנָא יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever may touch the flesh of one having an issue, let him wash his clothes, and bathe in forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 8, "aliyah": 5, "heb": "וְכִֽי־יָרֹ֥ק הַזָּ֖ב בַּטָּה֑וֹר וְכִבֶּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וַאֲרֵי יֵרוֹק דּוֹבָנָא בְּדַכְיָא וִיצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "If the <i>zov<\/i> spits on a ritually clean person, he shall wash his garments and bathe in water and is impure until the evening.", "pj": "וַאֲרוּם אִין יָרִיק דוֹבָנָא בְּדַכְיָא וִיצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And if he who hath an issue spit upon any one who is clean, let him wash his clothes, and bathe in forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>וכי ירק הזב בטהור.<\/b> וְנָגַע בּוֹ אוֹ נְשָׂאוֹ, שֶׁהָרֹק מְטַמֵּא בְמַשָּׂא (עי' נדה נ\"ה):", "rashi_en": "וכי ירק הזב בטהור AND IF HE THAT HATH THE ISSUE SPIT UPON ONE WHO IS CLEAN — and he (the clean person) comes in contact with it (the spittle; i. e. it actually falls upon him) or even if he only bears it (i. e. it has, for instance, fallen upon a stick which he is carrying) then HE SHALL BE UNCLEAN UNTIL THE EVEN, for the spittle communicates uncleanness through carrying it (cf. Niddah 55b)."}, {"ch": 15, "v": 9, "aliyah": 5, "heb": "וְכׇל־הַמֶּרְכָּ֗ב אֲשֶׁ֨ר יִרְכַּ֥ב עָלָ֛יו הַזָּ֖ב יִטְמָֽא׃", "onk": "וְכָל מֶרְכְּבָא דִּי יִרְכּוּב עֲלוֹהִי דּוֹבָנָא יְהֵי מְסָאָב:", "onk_en": "Anything that is used for riding upon which a <i>zov<\/i> will ride shall become impure.", "pj": "וְכָל זוֹנָא וּמֶרְכָּבָא דְיִרְכּוֹב עֲלוֹי דוֹבָנָא יְהֵי מְסָאָב וְכָל דְיִקְרַב בְּכָל מַאן דִיהֵי תְּחוֹתוֹי יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And every girdle or saddle upon which he who hath an issue rideth shall be unclean.", "tj": "", "tj_en": "", "rashi": "<b>וכל המרכב.<\/b> אַעַ\"פִּ שֶׁלֹּא יָשַׁב עָלָיו, כְּגוֹן הַתְּפוּס שֶׁל סְרָגָא, שֶׁקּוֹרִין ארצו\"ן, טָמֵא מִשּׁוּם מֶרְכָּב, וְהָאֻכָּף שֶׁקּוֹרִין סל\"ויש טָמֵא טֻמְאַת מוֹשָׁב (עירובין כ\"ז):", "rashi_en": "וכל המרכב AND ANYTHING FOR RIDING — even though he has not sat upon it when riding, e. g. the hold in front of the saddle, which is called arcon in old French, becomes unclean as a part of something for riding on (משום מרכב), and the אוכף, saddle, which is called alves in old French, is unclean as being something to sit upon (משום מושב) (Eruvin 27a)."}, {"ch": 15, "v": 10, "aliyah": 5, "heb": "וְכׇל־הַנֹּגֵ֗עַ בְּכֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔יו יִטְמָ֖א עַד־הָעָ֑רֶב וְהַנּוֹשֵׂ֣א אוֹתָ֔ם יְכַבֵּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וְכָל דְּיִקְרַב בְּכֹל דִּי יְהֵי תְחוֹתוֹהִי יְהֵי מְסָאָב עַד רַמְשָׁא וּדְיִטּוֹל יָתְהוֹן יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Anyone who touches anything which is beneath him shall be impure until the evening. and whoever carries them shall wash his garments and bathe in water and is impure until the evening.", "pj": "וּדְיוֹסִיט יַתְהוֹן יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever toucheth any thing that hath been under him shall be unclean until evening; and he who carrieth them shall wash his clothes, and bathe in forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>וכל הנגע בכל אשר יהיה תחתיו.<\/b> שֶׁל זָב; בָּא וְלִמֵּד עַל הַמֶּרְכָּב שֶׁיְּהֵא הַנּוֹגֵעַ בּוֹ טָמֵא וְאֵין טָעוּן כִּבּוּס בְּגָדִים, וְהוּא חֹמֶר בַּמִּשְׁכָּב מִבַּמֶּרְכָּב:<br><br><b>והנושא אותם.<\/b> אֶת כָּל הָאָמוּר בְּעִנְיַן הַזָּב — זוֹבוֹ וְרֻקּוֹ וְשִׁכְבַת זַרְעוֹ וּמֵימֵי רַגְלָיו וְהַמִּשְׁכָּב וְהַמֶּרְכָּב — מַשָּׂאָן מְטַמֵּא אָדָם לְטַמֵּא בְגָדִים (עי' ספרא):", "rashi_en": "וכל הנגע בכל אשר יהיה תחתיו AND WHOSOEVER TOUCHETH ANYTHING THAT WAS תחתיו — under the זב. This intends to teach regarding such an object for riding upon (if a זב has ridden on it) that whoever touches it becomes unclean, but he does not require washing of clothes and this is something stricter in the case of a thing for sleeping on than in that of a thing for riding on (since the former necessitates that his garments should be washed; cf. v. 5).<br><br>והנושא אותם AND HE THAT BEARETH THEM — “them” means all that have been mentioned in the matter of a זב — his flow, his spittle, his semen, and his urine, and that upon which he has slept or ridden — the bearing of them makes a man unclean so that he in turn makes his garments unclean (cf. Sifra, Metzora Parashat Zavim, Chapter 4 4)."}, {"ch": 15, "v": 11, "aliyah": 5, "heb": "וְכֹ֨ל אֲשֶׁ֤ר יִגַּע־בּוֹ֙ הַזָּ֔ב וְיָדָ֖יו לֹא־שָׁטַ֣ף בַּמָּ֑יִם וְכִבֶּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וְכֹל דִּי יִקְרַב בֵּיהּ דּוֹבָנָא וִידוֹהִי לָא שְׁטַף בְּמַיָּא וִיצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "If a <i>zov<\/i> touches anyone and his hands were not rinsed in water, he shall wash his garments and bathe in water and is impure until the evening.", "pj": "וְכָל מִדַעַם דְיִקְרַב בֵּיהּ דוֹבָנָא וִידוֹי לָא שְׁטַף בְּמַיָא יְהֵי מְסָאָב וְאִין גַבְרָא הוּא יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever toucheth him who hath the issue, and washeth not his hands in water, shall be unclean; if he be a man, he shall wash his clothes, and bathe in forty seahs of water, and be unclean until the evening.", "tj": "", "tj_en": "", "rashi": "<b>וידיו לא שטף במים.<\/b> בְּעוֹד שֶׁלֹּא טָבַל מִטֻּמְאָתוֹ, וַאֲפִלּוּ פָסַק מִזּוֹבוֹ וְסָפַר שִׁבְעָה וּמְחֻסָּר טְבִילָה, מְטַמֵּא בְכָל טֻמְאוֹתָיו, וְזֶה שֶׁהוֹצִיא הַכָּתוּב טְבִילַת גוּפוֹ שֶׁל זָב בִּלְשׁוֹן שְׁטִיפַת יָדַיִם, לְלַמֶּדְךָ שֶׁאֵין בֵּית הַסְּתָרִים טָעוּן בִּיאַת מַיִם, אֶלָּא אֵבֶר הַגָּלוּי כְּמוֹ הַיָּדַיִם (ספרא):", "rashi_en": "וידיו לא שטף כמים [AND WHOMSOEVER HE THAT HATH THE ISSUE] TOUCHETH AND HE HATH NOT RINSED HIS HANDS IN WATER [… SHALL BE UNCLEAN UNTIL THE EVEN] — \"and has not rinsed his hands” means: so long as he (the זב) has not immersed himself to cleanse himself from his uncleanness: even if he has ceased from his issue and has counted seven clean days (v. 13) but still lacks immersion he communicates uncleanness in all forms of defilment peculiar to him. And the reason why Scripture expresses the immersion of the whole body of the זב by the term “rinsing his hands” is to teach you that the hidden parts of the body (בית הסתרים, the inside of the mouth, ear, nose, etc., and the folds between adjoining portions of the body, קמטים) do not require “the coming of water” upon them (i. e. need not become wet when he immerses himself), but only such a limb which is visible, such as the hands (Sifra, Metzora Parashat Zavim, Chapter 4 5)."}, {"ch": 15, "v": 12, "aliyah": 5, "heb": "וּכְלִי־חֶ֛רֶשׂ אֲשֶׁר־יִגַּע־בּ֥וֹ הַזָּ֖ב יִשָּׁבֵ֑ר וְכׇ֨ל־כְּלִי־עֵ֔ץ יִשָּׁטֵ֖ף בַּמָּֽיִם׃", "onk": "וּמַאן דַּחֲסַף דִּי יִקְרַב בֵּיהּ דּוֹבָנָא יִתָּבַר וְכָל מַאן דְּאָע יִשְׁתַּטַּף בְּמַיָּא:", "onk_en": "An earthenware vessel which the <i>zov<\/i> will touch shall be broken. Any wooden vessel shall be rinsed in water.", "pj": "וּמָאן דְפָחַר דְיִקְרַב בְּגַוֵיהּ דוֹבָנָא יִתְבַּר וְכָל מָאן דְקֵיסָא יִשְׁתְּטֵיף בְּמַיָא", "pj_en": "And any vessel of earthenware whose inside may have been touched by him who hath the issue shall be broken; and any vessel of wood shall be washed in water.", "tj": "", "tj_en": "", "rashi": "<b>וכלי חרש אשר יגע בו הזב.<\/b> יָכוֹל אֲפִלּוּ נָגַע בּוֹ מֵאֲחוֹרָיו וְכוּ', כִּדְאִיתָא בְתוֹרַת כֹּהֲנִים עַד \"מַגָּעוֹ שֶׁהוּא כְכֻלּוֹ הֱוֵי אוֹמֵר זֶה הֶסֵּטוֹ\":", "rashi_en": "וכלי חרס אשר יגע בו הזב AND THE VESSEL OF EARTH THAT HE WHO HATH THE ISSUE TOUCHETH [SHALL BE BROKEN] — One might think that the law applies also if he touched it from outside (its exterior) etc., as it is stated in Torath Cohanim (Sifra, Metzora Parashat Zavim, Section 3 1). "}, {"ch": 15, "v": 13, "aliyah": 5, "heb": "וְכִֽי־יִטְהַ֤ר הַזָּב֙ מִזּוֹב֔וֹ וְסָ֨פַר ל֜וֹ שִׁבְעַ֥ת יָמִ֛ים לְטׇהֳרָת֖וֹ וְכִבֶּ֣ס בְּגָדָ֑יו וְרָחַ֧ץ בְּשָׂר֛וֹ בְּמַ֥יִם חַיִּ֖ים וְטָהֵֽר׃", "onk": "וַאֲרֵי יִדְכֵּי דּוֹבָנָא מִדּוֹבֵיהּ וְיִמְנֵי לֵיהּ שִׁבְעַת יוֹמִין לְדָכוּתֵיהּ וִיצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בִשְׂרֵיהּ בְּמֵי מַבּוּעַ וְיִדְכֵּי:", "onk_en": "When a <i>zov<\/i> will become ritually clean, from his discharge-impurity, he shall count for himself seven days for his purification and wash his garments, and bathe in running water, and he will be purified.", "pj": "וַאֲרוּם אִין פָּסַק מִדוֹבָנָא דוֹבֵיהּ וְיִמְנֵי לֵיהּ שׁוּבְעָא יוֹמִין לִדְכוּתֵיהּ וְיִצְבַּע לְבוּשׁוֹי וְיִסְחֵי בִּישְרֵיהּ בְּמֵי מַבּוּעַ וְיִדְכֵּי", "pj_en": "But if he who hath had the issue shall have ceased from it, he shall number to himself seven days for his purification, and wash his clothes, and bathe his flesh in spring water, to be clean.", "tj": "", "tj_en": "", "rashi": "<b>וכי יטהר.<\/b> כְּשֶׁיִּפְסֹק (שם):<br><br><b>שבעת ימים לטהרתו.<\/b> שִׁבְעַת יָמִים טְהוֹרִים מִטֻּמְאַת זִיבָה, שֶׁלֹּא יִרְאֶה זוֹב, וְכֻלָּן רְצוּפִין (ספרא):", "rashi_en": " וכי יטהר  means WHEN HE CEASETH [FROM HIS ISSUE] (Sifra, Metzora Parashat Zavim, Chapter 5 1).<br><br>שבעת ימים לטהרתו [THEN SHALL HE NUMBER TO HIMSELF] SEVEN DAYS FROM THE DATE WHEN HE CEASED — i. e. seven days clean (free) from the uncleanness resulting from the issue, i. e. in which he sees no issue, and all of them (of the seven days) must be consecutive (Sifra, Metzora Parashat Zavim, Chapter 5 6)."}, {"ch": 15, "v": 14, "aliyah": 5, "heb": "וּבַיּ֣וֹם הַשְּׁמִינִ֗י יִֽקַּֽח־לוֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּבָ֣א&thinsp;<b>׀<\/b> לִפְנֵ֣י יְהֹוָ֗ה אֶל־פֶּ֙תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּנְתָנָ֖ם אֶל־הַכֹּהֵֽן׃", "onk": "וּבְיוֹמָא תְמִינָאָה יִסַּב לֵיהּ תַּרְתֵּין שַׁפְנִינִין אוֹ תְרֵין בְּנֵי יוֹנָה וְיֵיתֵי לָקֳדָם יְיָ לִתְרַע מַשְׁכַּן זִמְנָא וְיִתְּנִנּוּן לְכַהֲנָא:", "onk_en": "On the eighth day he shall take for himself two turtledoves or two young pigeons and come before Adonoy, to the entrance of the Tent of Meeting and give them to the <i>kohein<\/i>.", "pj": "וּבְיוֹמָא תְמִינָאָה יִסַב לֵיהּ תְּרֵין שַׁפְנִינִין רַבְרְבִין אוֹ תְּרֵין גוֹזְלִין בְּנֵי יָווֹן וְיַיְתֵי יַתְהוֹן לִקֳדָם יְיָ לִתְרַע מַשְׁכַּן זִימְנָא וְיִתְּנִינוּן לְכַהֲנָא", "pj_en": "And on the eighth day let him take for himself two large turtle doves, or two young pigeons, and bring them before the Lord at the gate of the tabernacle of ordinance, and deliver them to the priest.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 15, "aliyah": 5, "heb": "וְעָשָׂ֤ה אֹתָם֙ הַכֹּהֵ֔ן אֶחָ֣ד חַטָּ֔את וְהָאֶחָ֖ד עֹלָ֑ה וְכִפֶּ֨ר עָלָ֧יו הַכֹּהֵ֛ן לִפְנֵ֥י יְהֹוָ֖ה מִזּוֹבֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיַעְבֵּד יָתְהוֹן כַּהֲנָא חַד חַטָּאתָא וְחַד עֲלָתָא וִיכַפֵּר עֲלוֹהִי כַּהֲנָא קֳדָם יְיָ מִדּוֹבֵיהּ:", "onk_en": "The <i>kohein<\/i> shall do (offer) them, one as a sin-offering and the [other] one as a burnt-offering. The <i>kohein<\/i> will atone for him before Adonoy, from his discharge-impurity.", "pj": "וְיַעֲבֵיד כַּהֲנָא חַד קוּרְבַּן חַטָאתָא וְחַד קוּרְבַּן עֲלָתָא וִיכַפֵּר עֲלוֹי כַהֲנָא קֳדָם יְיָ וְיִדְכֵּי מִן דוֹוֵיהּ", "pj_en": "And the priest shall make one a sin offering and one a burnt offering, and the priest shall atone for him before the Lord, and he shall be cleansed from his issue.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 16, "aliyah": 6, "heb": "וְאִ֕ישׁ כִּֽי־תֵצֵ֥א מִמֶּ֖נּוּ שִׁכְבַת־זָ֑רַע וְרָחַ֥ץ בַּמַּ֛יִם אֶת־כׇּל־בְּשָׂר֖וֹ וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וּגְבַר אֲרֵי תִפּוֹק מִנֵּיהּ שִׁכְבַת זַרְעָא וְיַסְחֵי בְמַיָּא יָת כָּל בִּשְׂרֵיהּ וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "A man, if semen issues from him, he shall bathe his entire body in water and is impure until the evening.", "pj": "וּגְבַר אֲרוּם אִישְׁתְּלֵי וְיִפּוֹק מִינֵיהּ שׁוּכְבַת זַרְעָא וְיַסְחֵי בְּאַרְבְּעִין סְאִין דְמוֹי יַת כָּל בִּישְרֵיהּ וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "But if a man sin through ignorance and seed goeth from him, let him wash all his flesh in forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 17, "aliyah": 6, "heb": "וְכׇל־בֶּ֣גֶד וְכׇל־ע֔וֹר אֲשֶׁר־יִהְיֶ֥ה עָלָ֖יו שִׁכְבַת־זָ֑רַע וְכֻבַּ֥ס בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וְכָל לְבוּשׁ וְכָל מְשַׁךְ דִּי יְהֵי עֲלוֹהִי שִׁכְבַת זַרְעָא וְיִצְטַבַּע בְּמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Any garment and any leather object upon which there is semen shall be washed in water and is impure until the evening.", "pj": "וְכָל לְבוּשָׁא וְכָל צְלָא דִי יֶהֱוֵי עֲלוֹי שִׁכְבַת זַרְעָא וְיִצְטְבַּע בְּמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And any garment or skin on which seed may be shall be washed in water, and be unclean until evening;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 18, "aliyah": 6, "heb": "וְאִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖הּ שִׁכְבַת־זָ֑רַע וְרָחֲצ֣וּ בַמַּ֔יִם וְטָמְא֖וּ עַד־הָעָֽרֶב׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִתְּתָא דִּי יִשְׁכּוּב גְּבַר יָתַהּ שִׁכְבַת זַרְעָא וְיַסְחוּן בְּמַיָּא וְיִסְאֲבוּן עַד רַמְשָׁא:", "onk_en": "A woman, with whom a man will lie conjugally; they shall bathe in water, and are impure until the evening.", "pj": "וְאִתְּתָא תִּנְיָיתָא דִי יְשַׁמֵשׁ גְבַר עִמָהּ שִׁכְבַת זַרְעָא וְיִסְחוֹן בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהוֹן מְסָאֲבִין עַד רַמְשָׁא", "pj_en": "and secondly, a woman with whom a man lieth shall wash in forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>ורחצו במים.<\/b> גְּזֵרַת מֶלֶךְ הִיא שֶׁתִּטְמָא הָאִשָּׁה בְּבִיאָה; וְאֵין הַטַּעַם מִשּׁוּם נוֹגֵעַ בְּשִׁכְבַת זֶרַע, שֶׁהֲרֵי מַגַּע בֵּית הַסְּתָרִים הוּא (נדה מ\"א:):", "rashi_en": "ורחצו במים THEY SHALL BOTH LAVE THEMSELVES IN WATER — It is a decree of the King that a woman should become unclean through sexual intercourse. The reason is not because of the law of “one who touches שכבת זרע” (who, according to Leviticus 22:7 is unclean; cf. Sifra on that verse) for in her case it is מגע בית הסתרים and this does not render her unclean (Niddah 41b)."}, {"ch": 15, "v": 19, "aliyah": 6, "heb": "וְאִשָּׁה֙ כִּֽי־תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖הּ בִּבְשָׂרָ֑הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְנִדָּתָ֔הּ וְכׇל־הַנֹּגֵ֥עַ בָּ֖הּ יִטְמָ֥א עַד־הָעָֽרֶב׃", "onk": "וְאִתְּתָא אֲרֵי תְהֵי דָיְבָא דָּם יְהֵי דוֹבַהּ בְּבִשְׂרַהּ שִׁבְעָא יוֹמִין תְּהֵי <b>בְרִיחוּקַהּ<\/b> וְכָל דְּיִקְרַב בַּהּ יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "When a woman has a discharge [and] the discharge will be blood in her body, for seven days she will be in [the state of] her menstrual impurity [<b>’separation’<\/b>]. Anyone who touches her will be impure until the evening.", "pj": "וְאִנְתְּתָא אֲרוּם תְּהֵי דַיְיבָא אֲדַם סִמוּק וְאוּכָם וּמוֹרִיק הֵי כְגַוָן זָעְפָרָנָא אוֹ הֵי כְמוֹ דְגַרְגִישְׁתָּא אוֹ הֵי כִמְזַג חֲמַר סִימוּק בִּתְרֵין חוּלְקִין דְמוֹי אֲדַם מְסָאָב הֲוֵי דוֹבָא בְּבִישְרָא שׁוּבְעָא יוֹמִין תְּהֵי יָתְבָא בְּרִיחוּקָהּ כָּל דְיִקְרַב בָּהּ יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And if a woman hath an issue of blood, red or dark, yellow as saffron, or water of clay, or as red wine mixed with two parts of water, she hath an uncleanness of blood in her flesh; she shall dwell apart seven days; any one who toucheth her shall be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>כי תהיה זבה.<\/b> יָכוֹל מֵאֶחָד מִכָּל אֵבָרֶיהָ, תַּ\"ל וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ — אֵין דָּם מְטַמֵּא אֶלָּא הַבָּא מִן הַמָּקוֹר:<br><br><b>דם יהיה זבה בבשרה.<\/b> אֵין זוֹבָהּ קָרוּי זוֹב לְטַמֵּא אֶלָּא אִם כֵּן הוּא אָדֹם (שם י\"ט):<br><br><b>בנדתה.<\/b> כְּמוֹ וּמִתֵּבֵל יְנִדֻּהוּ (איוב י\"ח) — שֶׁהִיא מְנֻדָּה מִמַּגַּע כָּל אָדָם:<br><br><b>תהיה בנדתה.<\/b> אֲפִלּוּ לֹא רָאֲתָה אֶלָּא רְאִיָּה רִאשׁוֹנָה (ספרא):", "rashi_en": "כי תהיה זבה AND IF A WOMAN HAVE AN ISSUE — One might think that this means: if there be an, issue from any limb of her body (e. g. ear, nose)! It, however, states in a law referring to this matter, (Leviticus 20:18) “and she hath uncovered the fountain of her blood” — only that issue of blood therefore makes her unclean which comes from her fountain (Sifra, Metzora Parashat Zavim, Section 4 2).<br><br>דם יהיה זובה בבשרה AND HER ISSUE IN HER FLESH BE BLOOD — Her issue does not come under the term “flux” to cause uncleanness except if it is red (cf. Niddah 19a).<br><br>בנדתה [SHE SHALL BE] PUT APART [SEVEN DAYS] — The word has the same meaning as, (Job. 18:18) “and they shall drive him out (ינדהו) of the world” — and her state is so called because she is set apart from the touch of any person (separated, so that no-one shall touch her).<br><br>תהיה בנדתה [SEVEN DAYS] SHALL SHE BE IN HER SEPARATION. even though she has seen a show of blood only once (lit., only the first show — i. e., not 7 days continuously) (Sifra, Metzora Parashat Zavim, Section 4 5)."}, {"ch": 15, "v": 20, "aliyah": 6, "heb": "וְכֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛יו בְּנִדָּתָ֖הּ יִטְמָ֑א וְכֹ֛ל אֲשֶׁר־תֵּשֵׁ֥ב עָלָ֖יו יִטְמָֽא׃", "onk": "וְכֹל דִּי תִשְׁכּוּב עֲלוֹהִי <b>בְּרִחוּקַהּ<\/b> יְהֵי מְסָאָב וְכֹל דִּי תֵיתֵב עֲלוֹהִי יְהֵי מְסָאָב:", "onk_en": "Everything that she sleeps on, during her menstrual impurity [<b>’separation’<\/b>], will become impure and everything that she sits on will be impure.", "pj": "וְכָל מִדַעַם דִמְיַיחֵד לְמִשְׁכַּב עֲלוֹי בְּעִידוֹנֵי רִיחוּקָהּ יְהֵי מְסָאָב וְכָל מִדַעַם דִמְיַיחֵד לְמֵיתַב עֲלוֹי בְּעִידוֹנֵי רִיחוּקָהּ יְהֵי מְסָאָב", "pj_en": "Whatever such an one shall lie upon during the time of her separation shall be unclean; and whatever such an one sitteth upon during the time of her separation shall be unclean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 21, "aliyah": 6, "heb": "וְכׇל־הַנֹּגֵ֖עַ בְּמִשְׁכָּבָ֑הּ יְכַבֵּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וְכָל דְּיִקְרַב בְּמִשְׁכְּבַהּ יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Anyone who touches what she slept on, shall wash his garments and bathe in water and is impure until the evening.", "pj": "וְכָל מַאן דְיִקְרַב בְּמִשְׁכָּבָהּ יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever toucheth her bed shall wash his clothes, and bathe himself with forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 22, "aliyah": 6, "heb": "וְכׇ֨ל־הַנֹּגֵ֔עַ בְּכׇל־כְּלִ֖י אֲשֶׁר־תֵּשֵׁ֣ב עָלָ֑יו יְכַבֵּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וְכָל דְּיִקְרַב בְּכָל מָנָא דִּי תֵיתֵב עֲלוֹהִי יְצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Anyone who touches any vessel that she sits on, shall wash his garments and bathe in water and is impure until the evening.", "pj": "וְכָל דְיִקְרַב בְּכָל מָאנָא דִמְיַיחֵד לְמֵיתַב עֲלוֹי יְצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever toucheth any thing upon which such an one hath sat shall wash his clothes, and bathe in forty seahs of water, and be unclean until evening.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 23, "aliyah": 6, "heb": "וְאִ֨ם עַֽל־הַמִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל־הַכְּלִ֛י אֲשֶׁר־הִ֥וא יֹשֶֽׁבֶת־עָלָ֖יו בְּנׇגְעוֹ־ב֑וֹ יִטְמָ֖א עַד־הָעָֽרֶב׃", "onk": "וְאִם עַל מִשְׁכְּבָא הוּא אוֹ עַל מָנָא דִּי הִא יָתְבָא עֲלוֹהִי בְּמִקְרְבֵיהּ בֵּיהּ יְהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "If he is on the bed or on the vessel that she is sitting on, when he touches it, he shall be impure until the evening.", "pj": "וְאִין עַל מִשְׁכָּבָא הוּא כְּדוֹבָא דְגוּפֵיהּ אוֹ עַל מָאנָא דְהִיא יַתְבָא עַל קְצָתֵיהּ בִּזְמַן מִיקְרְבֵיהּ בֵּיהּ יְהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And if the effusion of her body be upon her bed, or on a thing upon any part of which she sitteth, what time any one toucheth it, he shall be unclean until evening.", "tj": "", "tj_en": "", "rashi": "<b>ואם על המשכב הוא.<\/b> הַשּׁוֹכֵב אוֹ הַיּוֹשֵׁב עַל מִשְׁכָּבָהּ אוֹ עַל מוֹשָׁבָהּ אֲפִלּוּ לֹא נָגַע בָּהּ, אַף הוּא בְּדַת טֻמְאָה הָאֲמוּרָה בַּמִקְרָא הָעֶלְיוֹן, שֶׁטָּעוּן כִּבּוּס בְּגָדִים:<br><br><b>על הכלי.<\/b> לְרַבּוֹת אֶת הַמֶּרְכָּב:<br><br><b>בנגעו בו.<\/b> אֵינוֹ מְדַבֵּר אֶלָּא עַל הַמֶּרְכָּב שֶׁנִּתְרַבָּה מֵ\"עַל הַכְּלִי\":<br><br><b>בנגעו בו יטמא.<\/b> וְאֵינוֹ טָעוּן כִּבּוּס בְּגָדִים, שֶׁהַמֶּרְכָּב אֵין מַגָּעוֹ מְטַמֵּא אָדָם לְטַמֵּא בְגָדִים (כלים פכ\"ג):", "rashi_en": "ואם על המשכב הוא AND IF ONE BE ON HER PLACE OF REPOSE [OR ON ANY THING WHEREON SHE SITTETH] — This means, one who sleeps or sits on the place where she has slept or has sat even though he does not directly touch it (e. g. if there are covers upon the couch or the seat; for if he touches it vv. 21 and 22 apply); he also comes under the law of uncleanness that is stated in the above verse — that he requires washing of garments.<br><br>על הכלי UPON A VESSEL — This is intended to add to משכב and מושב any article for riding on (Sifra, Metzora Parashat Zavim, Section 4 15). <br><br>בנגעו בו WHEN HE TOUCHETH IT — \"it\" (בו) — this refers only to מרכב which, as has just been stated, is included in the law on account of the words על הכלי. <br><br>בנגעו בו יטמא WHEN HE TOUCHETH IT HE SHALL BE UNCLEAN, but does not require washing of the garments, because so far as the מרכב is concerned its being touched does not communicate uncleanness to people so that they in turn should render their garments unclean (cf. Mishnah Kelim 23:3)."}, {"ch": 15, "v": 24, "aliyah": 6, "heb": "וְאִ֡ם שָׁכֹב֩ יִשְׁכַּ֨ב אִ֜ישׁ אֹתָ֗הּ וּתְהִ֤י נִדָּתָהּ֙ עָלָ֔יו וְטָמֵ֖א שִׁבְעַ֣ת יָמִ֑ים וְכׇל־הַמִּשְׁכָּ֛ב אֲשֶׁר־יִשְׁכַּ֥ב עָלָ֖יו יִטְמָֽא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִם מִשְׁכַּב יִשְׁכּוּב גְּבַר יָתַהּ וּתְהֵי <b>רִחוּקַהּ<\/b> עֲלוֹהִי וִיהֵי מְסָאָב שִׁבְעַת יוֹמִין וְכָל מִשְׁכְּבָא דִּי יִשְׁכּוּב עֲלוֹהִי יְהֵי מְסָאָב:", "onk_en": "If a man will lie conjugally with her, her menstrual impurity [<b>’separation’<\/b>] will be on him and he is impure for seven days. Anything used for sleeping—if he should sleep on it—it will be impure.", "pj": "וְאִין שַׁמָשָׁא יְשַׁמֵשׁ גְבַר עִמָהּ וְתֶהֱוֵי רִיחוּקָהּ עֲלוֹי וִיהֵי מְסָאָב שׁוּבְעָא יוֹמִין וְכָל מִשְׁכָּבָא דִמְיַיחֵד לְמִשְׁכְּבֵי עֲלוֹי יְהֵי מְסָאָב", "pj_en": "If a man lie with her in the time of her separation, he shall be unclean seven days; and any bed upon which he lieth shall be unclean.", "tj": "", "tj_en": "", "rashi": "<b>ותהי נדתה עליו.<\/b> יָכוֹל יַעֲלֶה לְרַגְלָהּ — שֶׁאִם בָּא עָלֶיהָ בַחֲמִישִׁי לְנִדָּתָהּ לֹא יִטְמָא אֶלָּא שְׁלוֹשָׁה יָמִים כְּמוֹתָהּ — תַּ\"ל וְטָמֵא שִׁבְעַת יָמִים, וּמַה תַּ\"ל וּתְהִי נִדָּתָהּ עָלָיו? מַה הִיא מְטַמְּאָה אָדָם וּכְלֵי חֶרֶס, אַף הוּא מְטַמֵּא אָדָם וּכְלֵי חֶרֶס (ספרא; נדה ל\"ג):", "rashi_en": "ותהי נדתה עליו [AND IF ANY MAN LIE WITH HER AT ALL] THEN SHALL HER UNCLEANLINESS OF SEPARATION BE UPON HIM — One might think that he follows in her wake — that if he had intercourse with her e. g. on the fifth day of her separation he shall become unclean for three days only (for the fifth, sixth and seventh) like herself (i. e. because these are the remaining days during which she is unclean)! Scripture, however, states: \"he shall be unclean seven days”. Therefore these words cannot refer to the duration of her uncleanness. What then is the force of ותהי נדתה עליו? They mean: her state of uncleanness as a נדה shall be upon him. How is it in the case of her? She, being an אב הטומאה, makes man unclean, and also earthen vessels by means of ‎‎היסט! So, too, he becomes an אב הטומאה (not a ולד הטומאה), and makes man unclean, and also earthen vessels by means‎ of היסט! (Niddah 33a)"}, {"ch": 15, "v": 25, "aliyah": 6, "heb": "וְאִשָּׁ֡ה כִּֽי־יָזוּב֩ ז֨וֹב דָּמָ֜הּ יָמִ֣ים רַבִּ֗ים בְּלֹא֙ עֶת־נִדָּתָ֔הּ א֥וֹ כִֽי־תָז֖וּב עַל־נִדָּתָ֑הּ כׇּל־יְמֵ֞י ז֣וֹב טֻמְאָתָ֗הּ כִּימֵ֧י נִדָּתָ֛הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא׃", "onk": "וְאִתְּתָא אֲרֵי יְדוּב דּוֹב דְּמַהּ יוֹמִין סַגִּיאִין בְּלָא עִדַּן רִחוּקַהּ אוֹ אֲרֵי תְדוּב עַל <b>רִחוּקַהּ<\/b> כָּל יוֹמֵי דּוֹב סוֹבְתַהּ כְּיוֹמֵיהּ <b>רִחוּקַהּ<\/b> תְּהֵי מְסָאֳבָא הִיא:", "onk_en": "When a woman discharges her blood-flow, many days outside her menstrual cycle [<b>period of ‘separation’<\/b>], or if it flows after her menstrual cycle [<b>’separation’<\/b>], all the days of her discharge-impurity shall be as her days of menstrual impurity [<b>’separation’<\/b>]; she is impure.", "pj": "וְאִינְתְּתָא אֲרוּם יִדוֹב דוֹב אַדְמָא יוֹמִין תְּלָתָא בְּלָא אֲשׁוּנֵי רִיחוּקָהּ אוֹ אֲרוּם מִידוֹב בָּתַר יוֹמֵי רִיחוּקָהּ כָּל יוֹמֵי דוֹב סְאוֹבְתָּא תְּהֵי מְסָאָבָא לְדִמְשַׁמֵשׁ עִמָהּ מְטוֹל דִמְסָאָבָא הִיא", "pj_en": "But a woman who hath a defluxion of blood three days beyond the time of her separation, or when it floweth after the days of her separation, all the days of the uncleanness of her defluxion shall she be unclean; he who lieth with her shall be unclean.", "tj": "", "tj_en": "", "rashi": "<b>ימים רבים.<\/b> שְׁלֹשָׁה יָמִים (ספרא):<br><br><b>בלא עת נדתה.<\/b> אַחַר שֶׁיָּצְאוּ שִׁבְעַת יְמֵי נִדָּתָהּ:<br><br><b>או כי תזוב.<\/b> אֶת שְׁלֹשֶׁת הַיָּמִים הַלָּלוּ:<br><br><b>על נדתה.<\/b> מֻפְלָג מִנִּדָּתָהּ יוֹם אֶחָד, זוֹ הִיא זָבָה, וּמִשְׁפָּטָהּ חָרוּץ בְּפָרָשָׁה זוֹ, וְלֹא כְּדַת הַנִּדָּה, שֶׁזּוֹ טְעוּנָה סְפִירַת שִׁבְעָה נְקִיִּים וְקָרְבָּן, וְהַנִּדָּה אֵינָהּ טְעוּנָה סְפִירַת נְקִיִּים, אֶלָּא שִׁבְעַת יָמִים תִּהְיֶה בְנִדָּתָהּ בֵּין רוֹאָה בֵּין שֶׁאֵינָהּ רוֹאָה. וְדָרְשׁוּ בְּפָרָשָׁה זוֹ י\"א יוֹם בֵּין סוֹף נִדָּה לִתְחִלַּת נִדָּה, שֶׁכָּל שְׁלֹשֶׁת רְצוּפִין שֶׁתִּרְאֶה בְאַחַד עָשָׂר יוֹם הַלָּלוּ תְּהֵא זָבָה:", "rashi_en": "‎ימים רבים [AND IF A WOMAN HAVE AN ISSUE OF HER BLOOD] MANY DAYS — at least three days (since the plural ימים suggests at least two days, the word רבים, “more\", must imply at least three days) (cf. Sifra, Metzora Parashat Zavim, Section 5 9),<br><br>בלא עת נדתה OUT OF THE TIME OF HER SEPARATION — i. e. at least three days immediately after the seven normal days of her separation have expired.<br><br>או כי תזוב OR IF SHE HAS A FLOW during these (the above mentioned) three days,<br><br>על נדתה BEYOND THE TIME OF HER SEPARATION — i. e. being remote (distant) from her time of separation by one intervening day — this woman (such a woman) is, in both cases, termed a זבה and the law regarding her is decreed in this section that follows; and it is not like the law of a נדה, because she (the former) requires the counting of seven clean days (i. e. her uncleanness does not end until she has counted שבעה נקיים, seven consecutive days that are clean of any flux; cf. v. 28) and a sacrifice on the following day (cf. v. 29); whilst the נדה does not require the counting of the clean days (i. e. התורה ‎מן nor does she require a sacrifice) but she remains seven days in her separation and no longer irrespective as to whether she has or has not seen a show of blood (i. e. even if there is a flow on the seventh day and it then ceases she is still clean on the eighth day after having immersed herself). And they (our Rabbis) in expounding this section in the Sifra explain. There are eleven days intervening between the end of one ,נדה-period and the beginning of the next נדה-period, so that if she sees blood on three immersed herself. And they (our Rabbis) in expounding this section (Sifra, Metzora Parashat Zavim, Chapter 8 2-3) derived the Halacha of the eleven days that intervene between the expiration of one נדה period and the commencement of another ‎נדה period — i. e. that as a result of any three consecutive days that she sees blood within these eleven days she shall be (come under the law of) a זבה and not a נדה."}, {"ch": 15, "v": 26, "aliyah": 6, "heb": "כׇּל־הַמִּשְׁכָּ֞ב אֲשֶׁר־תִּשְׁכַּ֤ב עָלָיו֙ כׇּל־יְמֵ֣י זוֹבָ֔הּ כְּמִשְׁכַּ֥ב נִדָּתָ֖הּ יִֽהְיֶה־לָּ֑הּ וְכׇֽל־הַכְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔יו טָמֵ֣א יִהְיֶ֔ה כְּטֻמְאַ֖ת נִדָּתָֽהּ׃", "onk": "כָּל מִשְׁכְּבָא דִּי תִשְׁכּוּב עֲלוֹהִי כָּל יוֹמֵי דוֹבַהּ כְּמִשְׁכַּב <b>רִחוּקַהּ<\/b> יְהֵי לַהּ וְכָל מָנָא דִּי תֵתֵב עֲלוֹהִי מְסָאָב יְהֵי <b>כְּסוֹאֲבַת רִחוּקַהּ<\/b>:", "onk_en": "Anything used for sleeping upon which she will lie [on] any of her discharge-impurity-days, as the bed of her menstrual impurity [<b>’separation’<\/b>] it shall be to her. Every vessel upon which she sits will be impure, just as [is] her menstrual-impurity [<b>the impurity of her ‘separation’<\/b>].", "pj": "וְכָל מִשְׁכְּבָא דִמְיַיחֵד לְמִשְׁכּוֹב עֲלוֹי כָּל יוֹמֵי דוֹבָא הֵי כְמַשְׁכְּבָא דִמְיַיחֵד לְרִיחוּקָהּ יִתְחַשֵׁב לָהּ וְכָל מָאנָא דִמְיַיחֵד לְמֵיתַב עֲלוֹי מְסָאָב יְהֵי הֵי כְרִיחוּק סְאוֹבְתָּהּ", "pj_en": "And any bed upon which such any one lieth all the days of her defluxion shall be as the bed which was accounted hers during the time of her separation, and any thing upon which such an one sitteth shall be unclean as the uncleanness of her separation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 27, "aliyah": 6, "heb": "וְכׇל־הַנּוֹגֵ֥עַ בָּ֖ם יִטְמָ֑א וְכִבֶּ֧ס בְּגָדָ֛יו וְרָחַ֥ץ בַּמַּ֖יִם וְטָמֵ֥א עַד־הָעָֽרֶב׃", "onk": "וְכָל דְּיִקְרַב בְּהוֹן יְהֵי מְסָאָב וִיצַבַּע לְבוּשׁוֹהִי וְיַסְחֵי בְמַיָּא וִיהֵי מְסָאָב עַד רַמְשָׁא:", "onk_en": "Anyone that touches them will be impure and he shall wash his garments and bathe in water and is impure until the evening.", "pj": "וְכָל מַאן דְיִקְרַב בְּהוֹן יְהֵי מְסָאָב וִיצַבַּע לְבוּשׁוֹי וְיַסְחֵי בְּאַרְבְּעִין סָאוִוין דְמוֹי וִיהֵי מְסָאָב עַד רַמְשָׁא", "pj_en": "And whoever toucheth those (things) shall be unclean, and shall wash his clothes, and bathe in forty seahs of water, and be unclean until the evening.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 28, "aliyah": 6, "heb": "וְאִֽם־טָהֲרָ֖ה מִזּוֹבָ֑הּ וְסָ֥פְרָה לָּ֛הּ שִׁבְעַ֥ת יָמִ֖ים וְאַחַ֥ר תִּטְהָֽר׃", "onk": "וְאִם דְּכִיאַת מִדּוֹבַהּ וְתִמְנֵי לַהּ שִׁבְעַת יוֹמִין וּבָתַר כֵּן תִּדְכֵּי:", "onk_en": "When she has become pure from her discharge-impurity, she shall count seven days for herself and afterwards she becomes purified.", "pj": "וְאִין אִידַכְיַית מִדוֹבָהּ וְתִמְנֵי לָהּ שׁוּבְעָא יוֹמִין וּבָתַר כְּדֵין תִּטְבוֹל בְּאַרְבְּעִין סָאוִוין דְמוֹי וְתִדְכֵי", "pj_en": "But when she is cleansed from her issue, let her number to herself seven days, and afterwards wash in forty seahs of water, and be clean.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 29, "aliyah": 7, "heb": "וּבַיּ֣וֹם הַשְּׁמִינִ֗י תִּֽקַּֽח־לָהּ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וְהֵבִיאָ֤ה אוֹתָם֙ אֶל־הַכֹּהֵ֔ן אֶל־פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וּבְיוֹמָא תְמִינָאָה תִּסַּב לַהּ תַּרְתֵּין שַׁפְנִינִין אוֹ תְּרֵין בְּנֵי יוֹנָה וְתַיְתִי יָתְהוֹן לְוָת כַּהֲנָא לִתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "On the eighth day she shall take for herself, two turtledoves or two young pigeons and she shall bring them to the <i>kohein<\/i>, to the entrance of the Tent of Meeting.", "pj": "וּבְיוֹמָא תְּמִינָאָה תִּסַב תְּרֵין שַׁפְנִינִין רַבְרְבִין אוֹ תְּרֵין גוֹזְלִין בְּנֵי יוֹוָן וְתֵיתֵי יַתְהוֹן לְוַת כַּהֲנָא לִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "And on the seventh day, let her take for herself two turtle doves, or two young pigeons eons, and bring them to the priest, at the door of the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 30, "aliyah": 7, "heb": "וְעָשָׂ֤ה הַכֹּהֵן֙ אֶת־הָאֶחָ֣ד חַטָּ֔את וְאֶת־הָאֶחָ֖ד עֹלָ֑ה וְכִפֶּ֨ר עָלֶ֤יהָ הַכֹּהֵן֙ לִפְנֵ֣י יְהֹוָ֔ה מִזּ֖וֹב טֻמְאָתָֽהּ׃", "onk": "וְיַעְבֵּד כַּהֲנָא יָת חַד חַטָּאתָא וְיָת חַד עֲלָתָא וִיכַפֵּר עֲלַהּ כַּהֲנָא קֳדָם יְיָ מִדּוֹב סוֹבְתַהּ:", "onk_en": "The <i>kohein<\/i> shall do (offer) one as a sin-offering and the [other] one as a burnt-offering. The <i>kohein<\/i> will atone for her before Adonoy from her discharge-impurity.", "pj": "וְיַעֲבֵיד כַּהֲנָא יַת חַד חַטָאתָא וְיַת חַד עֲלָתָא וִיכַפֵּר עֲלָהּ כַּהֲנָא קֳדָם יְיָ מִדוֹב סְאוֹבְתָּהּ", "pj_en": "and the priest shall make one a sin offering, and the other a burnt offering and the priest shall make atonement before the Lord, on account of the defluxion of her uncleanness.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 31, "aliyah": 7, "heb": "וְהִזַּרְתֶּ֥ם אֶת־בְּנֵי־יִשְׂרָאֵ֖ל מִטֻּמְאָתָ֑ם וְלֹ֤א יָמֻ֙תוּ֙ בְּטֻמְאָתָ֔ם בְּטַמְּאָ֥ם אֶת־מִשְׁכָּנִ֖י אֲשֶׁ֥ר בְּתוֹכָֽם׃", "onk": "וְתַפְרְשׁוּן יָת בְּנֵי יִשְׂרָאֵל מִסּוֹאֲבַתְהוֹן וְלָא יְמוּתוּן בְּסוֹאֲבַתְהוֹן בְּסָאָבְהוֹן יָת מַשְׁכְּנִי דִּי בֵינֵיהוֹן:", "onk_en": "You shall separate Bnei Yisroel from their impurities and they will not die because of their impurities through their defilement of My dwelling in their midst.", "pj": "וְתִפְרְשׁוּן יַת בְּנֵי יִשְרָאֵל מִן סְאוֹבְתֵּיהוֹן וְיִתְפַּרְשׁוּן מִן נְשֵׁיהוֹן סְמוֹךְ לְוֶוסְתְּהוֹן וְלָא יִסְתַּקֵף עֲלֵיהוֹן דִימוּתוּן מְטוּל סְאוֹבְתְּהוֹן בְּסָאֲבֵיהוֹן יַת מַשְׁכְּנִי דְתַמָן אִיקַר שְׁכִינְתִּי שַׁרְיָא בֵּינֵיהוֹן", "pj_en": "So shall you separate the children of Israel from their uncleanness, and make them to be separate from their wives at the time of their seclusion, and to give not occasion that they die for their uncleanness in defiling My tabernacle, where the glory of My Shekinah dwelleth among them.", "tj": "", "tj_en": "", "rashi": "<b>והזרתם.<\/b> אֵין נְזִירָה אֶלָּא פְרִישָׁה וְכֵן נָזֹרוּ אָחוֹר (ישעיהו א'), וְכֵן נְזִיר אֶחָיו (בראשית מ\"ט):<br><br><b>ולא ימתו בטמאתם.<\/b> הֲרֵי הִכָּרֵת שֶׁל מְטַמֵּא מִקְדָּשׁ קָרוּי מִיתָה:", "rashi_en": "והזרתם THUS SHALL YE PUT APART [THE CHILDREN OF ISRAEL] — The word נזר has wherever it occurs the meaning of \"separating\". Similar is (Isaiah 1:4) “they are gone away (נזורו) backward\" ; (Genesis 49:26) “him that was separated from (נזיר) his brethren” (Sifra, Metzora Parashat Zavim, Chapter 9 6).<br><br>ולא ימתו בטמאתם THAT THEY DIE NOT IN THEIR UNCLEANNESS [WHEN THEY DEFILE MY TABERNACLE] — Thus you see that the penalty of “excision” to which one who defiles the Holy Place is subject (cf. Numbers 19:13) is here called מיתה (i. e. מיתה בידי שמים) (cf. Sifrei Bamidbar 125)."}, {"ch": 15, "v": 32, "aliyah": 7, "heb": "זֹ֥את תּוֹרַ֖ת הַזָּ֑ב וַאֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛נּוּ שִׁכְבַת־זֶ֖רַע לְטׇמְאָה־בָֽהּ׃", "onk": "דָּא אוֹרַיְתָא דְּדוֹבְנָא וְדִי תִפּוֹק מִנֵּיהּ שִׁכְבַת זַרְעָא לְאִסְתָּאָבָא בַהּ:", "onk_en": "This is the law of the <i>zov<\/i> and of him from whom semen issues to become impure through it.", "pj": "דָא גְזֵירַת אַחֲוָיַית דוֹבָנָא וּמִן דְיִפּוֹק מִנֵיהּ שׁוּכְבַת זַרְעָא לְאִיסְתַּאֲבָא בָּהּ", "pj_en": "This is the decree of instruction for him who hath a defluxion, and for him whose seed goeth forth and defileth him;", "tj": "", "tj_en": "", "rashi": "<b>זאת תורת הזב.<\/b> בַּעַל רְאִיָּה אַחַת, וּמַהוּ תוֹרָתוֹ?<br><br><b>ואשר תצא ממנו שכבת זרע<\/b> — הֲרֵי הוּא כְּבַעַל קֶרִי, טָמֵא טֻמְאַת עֶרֶב:", "rashi_en": "זאת תורת הזב THIS IS THE LAW OF HIM THAT HATH AN ISSUE, i.e. anyone who has but one appearance of flux. And what is his law?<br><br>ואשר תצא ממנו שכבת זרע, he is like him to whom a pollution happened: he is unclean with an uncleanness lasting only till the evening (Sifra, Metzora Parashat Zavim, Chapter 9 8; cf. v. 16)."}, {"ch": 15, "v": 33, "aliyah": 7, "heb": "וְהַדָּוָה֙ בְּנִדָּתָ֔הּ וְהַזָּב֙ אֶת־זוֹב֔וֹ לַזָּכָ֖ר וְלַנְּקֵבָ֑ה וּלְאִ֕ישׁ אֲשֶׁ֥ר יִשְׁכַּ֖ב עִם־טְמֵאָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וְלִדְסָאוּבְתָּא בְּרִיחוּקַהּ<\/b> וְלִדְדָאִיב יָת דּוֹבֵיהּ לִדְכַר וּלְנֻקְבָּא וְלִגְבַר דִּי יִשְׁכּוּב עִם מְסָאָבָא:", "onk_en": "For the menstruant [<b>woman who is impure<\/b>] during her period of separation and for one who has a discharge for a male and for a female; and for the man that will lie conjugally with an impure woman.", "pj": "וְלִדְסִיאוֹבְתָּא בְּעִידוּנֵי רִיחוּקָהּ וּלְדִדַיֵיב יַת דִיבֵיהּ לִדְכַר אוֹ לְנוּקְבָא וְלִגְבַר דִי יְשַׁמֵשׁ עִם מְסָאָבְתָּא כָּל אִלֵין יֶהֱוָון זְהִירִין בְּסוֹאֲבַתְהוֹן וְכַד יִדְכּוּן יַיְתוּן יַת קוּרְבָּנֵיהוֹן מְטוֹל לִמְכַפְּרָא עֲלֵיהוֹן", "pj_en": "and for her who is unclean in the time of her separation, and for any one who hath an issue, whether male or female, and for a man who lieth with the unclean. All these shall be advised of their uncleanness, and, when purified, shall bring the oblations that make atonement for them.", "tj": "", "tj_en": "", "rashi": "<b>והזב את זובו.<\/b> בַּעַל שְׁתֵּי רְאִיּוֹת, וּבַעַל שָׁלוֹשׁ רְאִיּוֹת, שֶׁתּוֹרָתָן מְפֹרֶשֶׁת לְמַעְלָה:", "rashi_en": "והזב את זובו — This refers to anyone who has two appearances and to anyone who has three appearances, the law regarding whom is set forth above (cf. Rashi on v. 3)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
