uses in their peoples, and from them are the peoples distinguished in the earth after the deluge.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 1, "aliyah": 7, "heb": "וַיְהִ֥י כׇל־הָאָ֖רֶץ שָׂפָ֣ה אֶחָ֑ת וּדְבָרִ֖ים אֲחָדִֽים׃", "onk": "וַהֲוָה כָל אַרְעָא לִישָׁן חָד וּמַמְלַל חָד:", "onk_en": "The whole earth had one language, and conforming words.", "pj": "וַהֲוָה כָּל אַרְעָא לִישַׁן חָד וּמַמְלַל חָד וְעִיטָא חֲדָא בְּלִישָׁן קוּדְשָׁא הֲווֹ מְמַלְלִין דְאִתְבָּרַיָא בֵּיה עַלְמָא מִן שֵׁרוּיָא", "pj_en": "And all the earth was (of) one language, and one speech, and one counsel. In the holy language spake they, that by which the world had been created at the beginning.", "tj": "וַהֲווֹן כָּל דָרַיָיא דְאַרְעָא לִישָׁן חָד וּמַמְלַל חָד עֵיצָה חֲדָא אֲרוּם בְּלִישָׁן קוּדְשָׁא הֲווֹ מְמַלְלִין דְבָּהּ אִתְבְּרִי עַלְמָא מִן שֵׁרוּיָא:", "tj_en": "And all the inhabiters of the earth were (of) one language, and of one speech, and one counsel: for they spake the holy language by which the world was created at the beginning:", "rashi": "<b>שפה אחת.<\/b> לְשׁוֹן הַקֹּדֶש:<br><br><b>ודברים אחדים.<\/b> בָּאוּ בְעֵצָה אַחַת וְאָמְרוּ לֹא כָּל הֵימֶנּוּ שֶׁיָּבֹר לוֹ אֶת הָעֶלְיוֹנִים, נַעֲלֶה לָרָקִיעַ וְנַעֲשֶׂה עִמּוֹ מִלְחָמָה. דָּבָר אַחֵר עַל יְחִידוֹ שֶׁל עוֹלָם. דָּבָר אַחֵר וּדְבָרִים אֲחָדִים – אָמְרוּ אַחַת לְאֶלֶף ותרנ\"ו שָׁנִים הָרָקִיעַ מִתְמוֹטֵט כְּשֵׁם שֶׁעָשָׂה בִּימֵי הַמַּבּוּל, בֹּאוּ וְנַעֲשֶׂה לוֹ סְמִיכוֹת (ב\"ר):", "rashi_en": "שפה אחת ONE LANGUAGE — The Holy Tongue (Hebrew) (Midrash Tanchuma, Noach 19).<br><br>ודברים אחדים AND ONE SPEECH — They came with one plan, saying: “He has no right to select the heavenly regions exclusively for Himself; let us ascend to the skies and make war upon Him”. Another explanation (of דברים אחדים which is taken to mean “words referring to “One”): words regarding the Sole Being (God) in the Universe. Another explanation of ודברים אחדים is: they spoke דברים חדים “sharp” words; they said, “Once in every one thousand six hundred and fifty six years (the period that elapsed from the Creation to the Flood) there is a heaven-shaking, just as there was in the days of the Flood. Come. then, and let us make supports for it” (Genesis Rabbah 38:6). "}, {"ch": 11, "v": 2, "aliyah": 7, "heb": "וַיְהִ֖י בְּנׇסְעָ֣ם מִקֶּ֑דֶם וַֽיִּמְצְא֥וּ בִקְעָ֛ה בְּאֶ֥רֶץ שִׁנְעָ֖ר וַיֵּ֥שְׁבוּ שָֽׁם׃", "onk": "וַהֲוָה בְּמִטַּלְהוֹן <b>בְּקַדְמֵיתָא<\/b> וְאַשְׁכָּחוּ בִּקְעֲתָא בְּאַרְעָא דְ<b>בָבֶל<\/b> וִיתִיבוּ תַמָּן:", "onk_en": "When they journeyed from the east, [<b>at the beginning,<\/b>] they found a valley in the land of Shinar [<b>Babylon<\/b>] and they settled there.", "pj": "וַהֲוָה בְּמֵיטַלְהוֹן מִמַדִינְחָא וְאַשְׁכָּחוּ בִּקְעֲתָא בְּאַרְעָא דְבָּבֶל וְיָתִיבוּ תַּמָן", "pj_en": "And it was while they were journeying from the east that they found a plain in the land of Bavel, and dwelt there.", "tj": "כַּד אַטְעוּ לִבְּהוֹן מִן בָּתַר מֵימְרָא דְמַאן דַאֲמַר וַהֲוָה עַלְמָא מִן שֵׁירוּיָא וְאַשְׁכָּחוּ בִּקְעָא בְּאַרְעָא דְפוּנְטּוֹס וּשְׁרוֹן תַּמָן:", "tj_en": "while their hearts erred afterwards from the Word of Him who spake, and the world was, at the beginning; and they found a plain in the land of Pontos and dwelt there.", "rashi": "<b>בנסעם מקדם.<\/b> שֶׁהָיוּ יוֹשְׁבִים שָׁם, כְּדִכְתִיב לְמַעְלָה וַיְהִי מוֹשָׁבָם וְגו' הַר הַקֶּדֶם וְנָסְעוּ מִשָּׁם לָתוּר לָהֶם מָקוֹם לְהַחֲזִיק אֶת כֻּלָּם וְלֹא מָצְאוּ אֶלָּא שִׁנְעָר:", "rashi_en": "בנסעם מקדם AS THEY JOURNEYED FROM THE EAST where they were then dwelling, as it is written above, (Genesis 10:30) “And their dwelling place was … the mountain of the East”. From there they journeyed to search out for themselves a place that would accommodate them all, but they found none except Shinar (Genesis Rabbah 38:7)."}, {"ch": 11, "v": 3, "aliyah": 7, "heb": "וַיֹּאמְר֞וּ אִ֣ישׁ אֶל־רֵעֵ֗הוּ הָ֚בָה נִלְבְּנָ֣ה לְבֵנִ֔ים וְנִשְׂרְפָ֖ה לִשְׂרֵפָ֑ה וַתְּהִ֨י לָהֶ֤ם הַלְּבֵנָה֙ לְאָ֔בֶן וְהַ֣חֵמָ֔ר הָיָ֥ה לָהֶ֖ם לַחֹֽמֶר׃", "onk": "וַאֲמָרוּ גְּבַר לְחַבְרֵיהּ הָבוּ <b>נִרְמֵי<\/b> לִבְנִין וְנִשְׂרְפִנּוּן <b>בְּנוּרָא<\/b> (יוֹקַדְתָּא) וַהֲוַת לְהוֹן לְבִנְתָּא לְאַבְנָא וְחֵימָרָא הֲוָה לְהוֹן לְשִׁיעַ:", "onk_en": "They said one to another, Come, let us mold [<b>throw<\/b>] bricks and bake them thoroughly [<b>in a fire<\/b>]. They then had bricks to use as stone, and the clay for mortar.", "pj": "וַאֲמָרוּ גְבַר לְחַבְרֵיהּ הָבוּ נִרְמֵי לִיבְנִין וְנִשְׁוֵי יַתְהוֹן בְּאַתּוּנָא וַהֲוָה לְהוֹן לְבִינְתָּא לְאַבְנָא וְטִינָא הֲוַות לְהוֹם לְשִׁיעַ", "pj_en": "And they said, a man to his fellow, Come, we will cast bricks, and put them in the furnace. And they had brick for stone, and slime for cement.", "tj": "", "tj_en": "", "rashi": "<b>איש אל רעהו.<\/b> אֻמָּה לְאֻמָּה, מִצְרַיִם לְכוּשׁ, וְכוּשׁ לְפוּט וּפוּט לִכְנַעַן:<br><br><b>הבה.<\/b> הַזְמִינוּ עַצְמְכֶם. כָּל הָבָה לְשׁוֹן הַזְמָנָה הוּא, שֶׁמְּכִינִים עַצְמָן וּמִתְחַבְּרִים לִמְלָאכָה אוֹ לְעֵצָה אוֹ לְמַשָּׂא. הָבָה הַזְמִינוּ, אפר\"לייר בלע\"ז:<br><br><b>לבנים.<\/b> שֶׁאֵין אֲבָנִים בְּבָבֶל, שֶׁהִיא בִּקְעָה:<br><br><b>ונשרפה לשרפה.<\/b> כָּךְ עוֹשִׂין הַלְּבֵנִים שֶׁקּוֹרִין טוויל\"ש בל', שׂוֹרְפִים אוֹתָן בְּכִבְשָׁן:<br><br><b>לחמר.<\/b> לָטוּחַ הַקִּיר:", "rashi_en": "איש אל רעהו ONE TO ANOTHER — One nation to the other: Mizraim to Cush, Cush to Put. and Put to Canaan (Genesis Rabbah 38:6).<br><br>הבה means, “Prepare yourselves”. Wherever the word הבה (come) occurs it has the meaning of “prepare”, meaning that they should get themselves ready and unite for some work or plan or burden (undertaking). “Come, get ready”: in old French appareiller; English to prepare.<br><br>לבנים BRICKS — For there is no stone in Babel which is a plain.<br><br>ונשרפה לשרפה AND BURN THEM THOROUGHLY — This is how bricks, which in old French are called Tuiles, English tiles, are made: they fire them in a furnace.<br><br>לחמר FOR MORTAR to plaster the walls. "}, {"ch": 11, "v": 4, "aliyah": 7, "heb": "וַיֹּאמְר֞וּ הָ֣בָה&thinsp;<b>׀<\/b> נִבְנֶה־לָּ֣נוּ עִ֗יר וּמִגְדָּל֙ וְרֹאשׁ֣וֹ בַשָּׁמַ֔יִם וְנַֽעֲשֶׂה־לָּ֖נוּ שֵׁ֑ם פֶּן־נָפ֖וּץ עַל־פְּנֵ֥י כׇל־הָאָֽרֶץ׃", "onk": "וַאֲמָרוּ הָבוּ נִבְנֵי לָנָא קַרְתָּא וּמַגְדְּלָא וְרֵישֵׁיהּ מָטֵי עַד <b>צֵית<\/b> שְׁמַיָּא וְנַעְבֵּיד לָנָא שׁוּם דִּילְמָא נִתְבַּדַּר עַל אַפֵּי כָל אַרְעָא:", "onk_en": "Then they said, Come, we will build ourselves a city, and a tower whose top will reach the [<b>height of the<\/b>] heavens. Thus we will make ourselves a name, so that we will not be scattered all over the face of the earth.", "pj": "וַאֲמָרוּ הָבוּ נִבְנֵי לָנָא קַרְתָּא וּמִגְדְלָא וְרֵישֵׁיהּ מָטֵי עַד צֵית שְׁמַיָא וְנַעֲבֵד לָנָא סִגְדוּ בְּרֵישֵׁיהּ וְנִשְׁוֵי חַרְבָּא בִּידֵהּ וּתְהֵי עַבְדָא לְקִיבְלֵהּ סִדְרֵי קְרָבָא קָדָם עַד לָא נִתְבַּדַר מֵעִלַוֵי אַנְפֵּי אַרְעָא", "pj_en": "And they said, Come, we will build us a city and a tower, and the head of it shall come to the summit of the heavens; and we will make us (an image for) worship on the top of it, and put a sword in his hand to act against the array of war, before that we be scattered on the face of the earth.", "tj": "וְאָמְרִין אִתוּן כְּעַן וְנִבְנֵי לָנָא קִרְיָיא וּמִגְדַל וְרֵישֵׁיהּ מַמְטֵי עַד צֵית שְׁמַיָא וְנַעֲבֵּיד לָן בְּגַוֵיהּ בֵּית סְגִידוּ בְּרֵאשֵׁיהּוְנִתַּן חַרְבָּא בְּגוֹ יְדֵיהּ וּתְהֵא עַבְדָא לְקִבְּלֵיהּ סִדְרָא קְרָבָא קָדָם עַד דְלָא נִתְבַּדַר עַל אַפֵּי כָּל אַרְעָא:", "tj_en": "And they said, Come now, and we will build us a city and a tower, and the head of it shall reach to the summit of the heavens, and we will make us in it a house of worship at the top. And we will put a sword in his hand, lest there be set against him the array of war, before we be scattered upon the face of all the earth.", "rashi": "<b>פן נפוץ.<\/b> שֶׁלֹּא יָבִיא עָלֵינוּ שׁוּם מַכָּה לַהֲפִיצֵנוּ מִכָּאן:", "rashi_en": "פן נפוץ LEST WE BE SCATTERED ABROAD — That He shall not be able by bringing some plague upon us, to scatter us from here."}, {"ch": 11, "v": 5, "aliyah": 7, "heb": "וַיֵּ֣רֶד יְהֹוָ֔ה לִרְאֹ֥ת אֶת־הָעִ֖יר וְאֶת־הַמִּגְדָּ֑ל אֲשֶׁ֥ר בָּנ֖וּ בְּנֵ֥י הָאָדָֽם׃", "onk": "<b>וְאִתְגְּלִי יְיָ לְאִתְפְּרָעָא עַל עוֹבָדֵי<\/b> קַרְתָּא וּמַגְדְּלָא דִּי בְנוֹ בְּנֵי אֱנָשָׁא:", "onk_en": "Adonoy descended to see [<b>Adonoy became revealed in order to punish them because of the building of<\/b>] the city and the tower that the sons of man built.", "pj": "וְאִתְגְלֵי יְיָ לְאִיתְפַּרְעָא מִנְהוֹן עַל עוֹבַד קַרְתָּא וּמַגְדְלָא דְבָנוּ בְּנֵי נְשָׁא", "pj_en": "And the Lord was revealed to punish them for the work of the city and the tower which the sons of men builded.", "tj": "", "tj_en": "", "rashi": "<b>וירד ה' לראות.<\/b> לֹא הֻצְרַךְ לְכָךְ, אֶלָּא בָא לְלַמֵּד לְדַיָּנִים שֶׁלֹּא יַרְשִׁיעוּ הַנִּדּוֹן עַד שֶׁיִּרְאוּ וְיָבִינוּ, מִדְרַשׁ רַבִּי תַנְחוּמָא:<br><br><b>בני האדם.<\/b> אֶלָּא בְנֵי מִי? שֶׁמָּא בְנֵי חֲמוֹרִים וּגְמַלִּים? אֶלָּא בְנֵי אָדָם הָרִאשׁוֹן שֶׁכָּפָה אֶת הַטּוֹבָה וְאָמַר הָאִשָּׁה אֲשֶׁר נָתַתָּ עִמָּדִי, אַף אֵלּוּ כָפוּ בַּטּוֹבָה לִמְרֹד בְּמִי שֶׁהִשְׁפִּיעָם טוֹבָה, וּמִלְּטָם מִן הַמַּבּוּל:", "rashi_en": "'וירד ה לראות AND THE LORD CAME DOWN TO SEE — He really did not need to do this, but Scripture intends to teach the judges that they should not proclaim a defendant guilty before they have seen the case and thoroughly understand the matter in question. This is to be found in Midrash of R. Tanchuma. <br><br>בני האדם THE CHILDREN OF MAN (ADAM) — But whose children could they have been (except the children of man, i.e. human beings) — perhaps the children of donkeys or camels? But it means the children of Adam Harishon who proved himself ungrateful when he said, (Genesis 3:12) “The woman whom Thou gavest to be with me, [she gave me of the tree etc.]”. These people, also, were ungrateful, rebelling against the One who had showered kindness upon them and had rescued them from the Flood (Genesis Rabbah 38:9). "}, {"ch": 11, "v": 6, "aliyah": 7, "heb": "וַיֹּ֣אמֶר יְהֹוָ֗ה הֵ֣ן עַ֤ם אֶחָד֙ וְשָׂפָ֤ה אַחַת֙ לְכֻלָּ֔ם וְזֶ֖ה הַחִלָּ֣ם לַעֲשׂ֑וֹת וְעַתָּה֙ לֹֽא־יִבָּצֵ֣ר מֵהֶ֔ם כֹּ֛ל אֲשֶׁ֥ר יָזְמ֖וּ לַֽעֲשֽׂוֹת׃", "onk": "וַאֲמַר יְיָ הָא עַמָּא חַד וְלִישָׁן חַד לְכָלְּהוֹן וְדֵין דְּשָׁרִיוּ לְמֶעְבָּד וּכְעַן לָא יִתִּמְנַע מִנְהוֹן כֹּל דִּחַשִּׁיבוּ לְמֶעְבָּד:", "onk_en": "Adonoy said, Behold, they are one people, all having one language, and this is their first undertaking. Now will nothing be unattainable for them, [to do] whatever they have a mind to do?", "pj": "וַאֲמַר יְיָ הָא עַמָא חָד וְלִישָׁן חָד לְכֻלְהוֹם וְדָא אִתְחַשְׁבוּ לְמֶעֱבַד וּכְדוֹן לָא יִתְמְנַע מִנְהוֹן כָּל דַחֲשִׁיבוּ לְמֶעֱבָד", "pj_en": "And the Lord said, Behold, the people is one, and the language of all of them one: and this they have thought to do: and now they will not be restrained from doing whatever they imagine.", "tj": "", "tj_en": "", "rashi": "<b>הן עם אחד.<\/b> כָּל טוֹבָה זוֹ יֵשׁ עִמָּהֶן, שֶׁעַם אֶחָד הֵם, וְשָׂפָה אַחַת לְכֻלָּן וְדָבָר זֶה הֵחֵלּוּ לַעֲשׂוֹת:<br><br><b>החלם.<\/b> כְּמוֹ אָמְרָם, עֲשׂוֹתָם – לְהַתְחִיל הֵם לַעֲשׂוֹת:<br><br><b>לא יבצר מהם וגו' לעשות.<\/b> בִּתְמִיהָ. יִבָּצֵר לְשׁוֹן מְנִיעָה, כְתַרְגּוּמוֹ; וְדוֹמֶה לוֹ יִבְצֹר רוּחַ נְגִידִים (תה' ע\"ו):", "rashi_en": "הן עם אחד BEHOLD, THEY ARE ONE PEOPLE — They possess all the advantage of being one people and of having one language common to all of them, and this is what they begin to do!<br><br>החלם is infinitive, like אמרם “their speaking”. עשותם “their doing” (i.e. “they speak”, “they do”) — so here: “they begin to do”) (Genesis Rabbah 38:9). <br><br>לא יבצר מהם וגו' לעשות This is a question (although the ה which introduces an interrogative sentence is absent): SHALL THEY NOT BE RESTRAINED FROM DOING WHAT THEY IMAGINE TO DO? The word יבצר means “restraining”, as the Targum understands it; a similar instance is, (Psalms 76:13) “He restrains (יבצור) the spirit of princes”."}, {"ch": 11, "v": 7, "aliyah": 7, "heb": "הָ֚בָה נֵֽרְדָ֔ה וְנָבְלָ֥ה שָׁ֖ם שְׂפָתָ֑ם אֲשֶׁר֙ לֹ֣א יִשְׁמְע֔וּ אִ֖ישׁ שְׂפַ֥ת רֵעֵֽהוּ׃", "onk": "הָבוּ <b>נִתְגְּלִי<\/b> וּנְבַלְבֵּל תַּמָּן לִישָׁנְהוֹן דִּלָא יִשְׁמְעוּן אֱנַשׁ (גְּבַר) לִישַׁן חַבְרֵיהּ:", "onk_en": "Come, let us descend [<b>let us be revealed<\/b>] and jumble their language, that they will not understand one another’s language.", "pj": "וַאֲמַר יְיָ לְשַׁבְעִין מַלְאָכַיָא דְקַיְימִין קוֹמוֹי אִיתוּן כְּדֵין וְנָחִית וּנְעַרְבְּבָא תַּמָן לִישַׁנְהוֹן דְלָא יִשְׁמְעוּן אֱינַשׁ לִישָׁן חַבְרֵיהּ", "pj_en": "And the Lord said to the seventy angels which stand before Him, Come, we will descend and will there commingle their language, that a man shall not understand the speech of his neighbour.", "tj": "", "tj_en": "", "rashi": "<b>הבה נרדה.<\/b> בְּבֵית דִּינוֹ נִמְלַךְ מֵעַנְוְתָנוּתוֹ יְתֵרָה:<br><br><b>הבה.<\/b> מִדָּה כְנֶגֶד מִדָּה – הֵם אָמְרוּ הָבָה נִבְנֶה, וְהוּא כְנֶגֶדָּם מָדַד וְאָמַר הָבָה נֵרְדָה:<br><br><b>ונבלה.<\/b> וּנְבַלְבֵּל; נוּ\"ן מְשַׁמֵּשׁ בִּלְשׁוֹן רַבִּים, וְהֵ\"א אַחֲרוֹנָה יְתֵרָה, כְהֵ\"א שֶׁל נֵרְדָה:<br><br><b>לא ישמעו.<\/b> זֶה שׁוֹאֵל לְבֵנָה וְזֶה מֵבִיא טִיט, וְזֶה עוֹמֵד עָלָיו וּפוֹצֵעַ אֶת מֹחוֹ:", "rashi_en": "הבה נרדה COME, LET US GO DOWN — He took counsel with His Judicial Court because of His exceeding meekness (Sanhedrin 38b)<br><br>הבה COME — measure for measure: they had said “Come, let us build“; He meted out to them correspondingly saying. “Come let us go down” (Midrash Tanchuma, Noach 18)<br><br>ונבלה means AND LET US CONFOUND The נ is the plural prefix, and the ה at the end is additional to the root as the ה in ונרדה.   <br><br>ולא ישמעו — THEY MAY NOT UNDERSTAND — One asks for a brick and the other brings him lime: the former therefore attacks him and splits open his brains. "}, {"ch": 11, "v": 8, "aliyah": 7, "heb": "וַיָּ֨פֶץ יְהֹוָ֥ה אֹתָ֛ם מִשָּׁ֖ם עַל־פְּנֵ֣י כׇל־הָאָ֑רֶץ וַֽיַּחְדְּל֖וּ לִבְנֹ֥ת הָעִֽיר׃", "onk": "וּבַדַּר יְיָ יָתְהוֹן מִתַּמָּן עַל אַפֵּי כָל אַרְעָא וּמְנָעוּ לְמִבְנֵי (<small>נ\"י<\/small> וְאִתְמְנָעוּ מִלְּמִבְנֵי) קַרְתָּא:", "onk_en": "Adonoy scattered them from there all over the face of the earth, and they stopped building the city.", "pj": "וְאִגְלִיאַת מֵימְרָא דַיְיָ עֲלוֹי קַרְתָּא וְעִמֵיהּ שׁוּבְעִין מַלְאָכַיָא כָּל קְבֵל שׁוּבְעִין עַמְמַיָא וְכָל חַד וְחַד לִישָׁן עַמְמֵיהּ (נ\"א וְרוֹשָׁם כַּתְבֵיהּ) (וּמִשָׁם כַּפְתֵיהּ) בִּידֵיהּ וּבַדְרִינוּן מִתַּמָן עַל אַנְפֵּי כָּל אַרְעָא לְשַׁבְעִין לִישְׁנִין וְלָא הֲוָה יָדַע חַד מַה דְיֵימַר חַבְרֵיהּ וַהֲווֹ קַטְלִין דֵין לְדֵין וּפְסָקוּ מִלִמִבְנֵי קַרְתָּא", "pj_en": "And the Word of the Lord was revealed against the city, and with Him seventy angels, having reference to seventy nations, each having its own language, and thence the writing of its own hand: and He dispersed them from thence upon the face of all the earth into seventy languages. And one knew not what his neighbour would say: but one slew the other; and they ceased from building the city.", "tj": "", "tj_en": "", "rashi": "<b>ויפץ ה' אתם משם.<\/b> בָּעוֹלָם הַזֶּה; מַה שֶּׁאָמְרוּ פֶּן נָפוּץ, נִתְקַיֵּם עֲלֵיהֶם, הוּא שֶׁאָמַר שְׁלֹמֹה מְגוֹרַת רָשָׁע הִיא תְבוֹאֶנּוּ (משלי י'):", "rashi_en": "ויפץ ה' אתם משם SO THE LORD SCATTERED THEM ABROAD FROM THENCE—In this world (Sanhedrin 107b). What they had said. (Genesis 11:4) “lest we be scattered abroad” really happened to them. This is what Solomon said, (Proverbs 10:24) “What the wicked fears will come upon him” (Midrash Tanchuma, Noach 18)."}, {"ch": 11, "v": 9, "aliyah": 7, "heb": "עַל־כֵּ֞ן קָרָ֤א שְׁמָהּ֙ בָּבֶ֔ל כִּי־שָׁ֛ם בָּלַ֥ל יְהֹוָ֖ה שְׂפַ֣ת כׇּל־הָאָ֑רֶץ וּמִשָּׁם֙ הֱפִיצָ֣ם יְהֹוָ֔ה עַל־פְּנֵ֖י כׇּל־הָאָֽרֶץ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "עַל כֵּן קְרָא שְׁמַהּ בָּבֶל אֲרֵי תַמָּן בַּלְבֵּל יְיָ לִישַׁן כָּל אַרְעָא וּמִתַּמָּן בַּדָּרִנּוּן יְיָ עַל אַפֵּי כָּל אַרְעָא:", "onk_en": "Therefore He called its name, Bavel, for this was the place where Adonoy jumbled the language of all the earth; and from there, Adonoy scattered them all over the face of the earth.", "pj": "בְּגִין כֵּן קְרָא שְׁמָהּ בָּבֶל אֲרוּם תַּמָן עַרְבִּיב יְיָ לִישָׁן כָּל דַיְירֵי אַרְעָא וּמִתַּמָן בַּדְרִינוּן יְיָ עַל אַפֵּי כָּל אַרְעָא", "pj_en": "Therefore He called the name of it Bavel, because there did the Lord commingle the speech of all the inhabitants of the earth, and from thence did the Lord disperse them upon the faces of all the earth.", "tj": "", "tj_en": "", "rashi": "<b>ומשם הפיצם.<\/b> לִמֵּד שֶׁאֵין לָהֶם חֵלֶק לָעוֹלָם הַבָּא; וְכִי אֵיזוֹ קָשָׁה, שֶׁל דּוֹר הַמַּבּוּל אוֹ שֶׁל דּוֹר הַפַּלָּגָה? אֵלּוּ לֹא פָשְׁטוּ יָד בָּעִקָּר וְאֵלּוּ פָשְׁטוּ יָד בָּעִקָּר לְהִלָּחֵם בּוֹ, וְאֵלּוּ נִשְׁטְפוּ וְאֵלּוּ לֹא נֶאֱבְדוּ מִן הָעוֹלָם? אֶלָּא שֶׁדּוֹר הַמַּבּוּל הָיוּ גַּזְלָנִים וְהָיְתָה מְרִיבָה בֵינֵיהֶם, לְכָךְ נֶאֱבְדוּ; וְאֵלּוּ הָיוּ נוֹהֲגִים אַהֲבָה וְרֵעוּת בֵּינֵיהֶם, שֶׁנֶּ' שָׂפָה אֶחָת וּדְבָרִים אֲחָדִים, לָמַדְתָּ שֶׁשָּׂנְאוּי הַמַּחֲלֹקֶת וְגָדוֹל הַשָּׁלֹום:", "rashi_en": "ומשם הפיצם AND FROM THENCE DID THE LORD SCATTER THEM —This teaches that they have no portion in the world to come (Sanhedrin 107b). Which sin was greater: that of the generation of the Flood or that of the generation of the Dispersion? The former did not stretch forth their hands against God; the latter did stretch forth their hands against God to war against him (surely, then, the sin of the generation of the Dispersion was greater) and yet the former (the generation of the Flood) were drowned and these did not perish from the world! But the reason is that the generation of the Flood were violent robbers and there was strife among them, and therefore they were destroyed; but these conducted themselves in love and friendship, as it is said, “They were one people and had one language”. — You may learn from this how hateful to God is strife and how great is peace (Genesis Rabbah 38:6). "}, {"ch": 11, "v": 10, "aliyah": 7, "heb": "אֵ֚לֶּה תּוֹלְדֹ֣ת שֵׁ֔ם שֵׁ֚ם בֶּן־מְאַ֣ת שָׁנָ֔ה וַיּ֖וֹלֶד אֶת־אַרְפַּכְשָׁ֑ד שְׁנָתַ֖יִם אַחַ֥ר הַמַּבּֽוּל׃", "onk": "אִלֵּין תּוּלְדַת שֵׁם שֵׁם בַּר מְאָה שְׁנִין וְאוֹלִיד יָת אַרְפַּכְשָׁד תַּרְתֵּין שְׁנִין בָּתַר טוֹפָנָא:", "onk_en": "These are the histories of Sheim. Sheim was one hundred years old, and he had Arpachshad two years after the Flood.", "pj": "אִילֵין גְנִיסַת שֵׁם שֵׁם בַּר מְאָה שְׁנִין כַּד דְאוֹלִיד יַת אַרְפַּכְשַׁד תַּרְתֵּין שְׁנִין בָּתַר טוּבְעָנָא", "pj_en": "These are the generations of Shem. Shem was a son of a hundred years, and he begat Arphakshad, two years after the deluge.", "tj": "", "tj_en": "", "rashi": "<b>שם בן מאת שנה.<\/b> כְּשֶׁהוֹלִיד אֶת אַרְפַּכְשָׁד שְׁנָתַיִם אַחַר הַמַּבּוּל:", "rashi_en": "שם בן מאת שנה SHEM WAS A HUNDRED YEARS OLD when he begat Arpachshad two years after the Flood."}, {"ch": 11, "v": 11, "aliyah": 7, "heb": "וַֽיְחִי־שֵׁ֗ם אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־אַרְפַּכְשָׁ֔ד חֲמֵ֥שׁ מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא שֵׁם בָּתַר דְּאוֹלִיד יָת אַרְפַּכְשָׁד חֲמֵשׁ מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "Sheim lived after he had Arpachshad, five hundred years, and he had sons and daughters.", "pj": "וַחֲיָא שֵׁם בָּתַר דְאוֹלִיד יַת אַרְפַּכְשַׁד חֲמֵשׁ מְאָה שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Shem lived after he had begotten Arphakshad five hundred years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 12, "aliyah": 7, "heb": "וְאַרְפַּכְשַׁ֣ד חַ֔י חָמֵ֥שׁ וּשְׁלֹשִׁ֖ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־שָֽׁלַח׃", "onk": "וְאַרְפַּכְשַׁד חֲיָא תְּלָתִין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד יָת שָׁלַח:", "onk_en": "Arpachshad lived thirty-five years and had Shelach.", "pj": "וְאַרְפַּכְשַׁד חֲיָא תְּלָתִין וַחֲמֵשׁ שְׁנִין וְאוֹלִיד יַת שֶׁלַח", "pj_en": "And Arphakshad lived thirty and five years, and begat Shelach.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 13, "aliyah": 7, "heb": "וַיְחִ֣י אַרְפַּכְשַׁ֗ד אַֽחֲרֵי֙ הוֹלִיד֣וֹ אֶת־שֶׁ֔לַח שָׁלֹ֣שׁ שָׁנִ֔ים וְאַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא אַרְפַּכְשַׁד בָּתַר דְּאוֹלִיד יָת שֶׁלַח אַרְבַּע מְאָה וּתְלָת שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "Arpachshad lived, after he had Shelach, four hundred and three years, and he had sons and daughters.", "pj": "וַחֲיָא אַרְפַּכְשַׁד בָּתַר דְאוֹלִיד יַת שֶׁלַח אַרְבַּע מְאָה וּתְלַת שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Arphakshad lived after he had begotten Shelach four hundred and thirty years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 14, "aliyah": 7, "heb": "וְשֶׁ֥לַח חַ֖י שְׁלֹשִׁ֣ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־עֵֽבֶר׃", "onk": "וְשֶׁלַח חֲיָא תְּלָתִין שְׁנִין וְאוֹלִיד יָת עֵבֶר:", "onk_en": "Shelach lived thirty years and had Eiver.", "pj": "וְשֶׁלַח חֲיָא תְּלָתִין שְׁנִין וְאוֹלִיד יַת עֵבֶר", "pj_en": "And Shelach lived thirty years, and begat Eber.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 15, "aliyah": 7, "heb": "וַֽיְחִי־שֶׁ֗לַח אַחֲרֵי֙ הוֹלִיד֣וֹ אֶת־עֵ֔בֶר שָׁלֹ֣שׁ שָׁנִ֔ים וְאַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא שֶׁלַח בָּתַר דְּאוֹלִיד יָת עֵבֶר אַרְבַּע מְאָה וּתְלָת שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Eiver, Shelach lived four hundred and three years, and he had sons and daughters.", "pj": "וַחֲיָא שֶׁלַח בָּתַר דְאוֹלִיד יַת עֵבֶר אַרְבַּע מְאָה וּתְלַת שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Shelach lived after he had begotten Eber four hundred and three years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 16, "aliyah": 7, "heb": "וַֽיְחִי־עֵ֕בֶר אַרְבַּ֥ע וּשְׁלֹשִׁ֖ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־פָּֽלֶג׃", "onk": "וַחֲיָא עֵבֶר תְּלָתִין וְאַרְבַּע שְׁנִין וְאוֹלִיד יָת פָּלֶג:", "onk_en": "Eiver lived thirty-four years and had Peleg.", "pj": "וַחֲיָא עֵבֶר תְּלָתִין וְאַרְבַּע שְׁנִין וְאוֹלִיד יַת פָּלֶג", "pj_en": "And Eber lived thirty-four years, and begat Peleg.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 17, "aliyah": 7, "heb": "וַֽיְחִי־עֵ֗בֶר אַחֲרֵי֙ הוֹלִיד֣וֹ אֶת־פֶּ֔לֶג שְׁלֹשִׁ֣ים שָׁנָ֔ה וְאַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא עֵבֶר בָּתַר דְּאוֹלִיד יָת פֶּלֶג אַרְבַּע מְאָה וּתְלָתִין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Peleg, Eiver lived four hundred and thirty years, and he had sons and daughters.", "pj": "וַחֲיָא עֵבֶר בָּתַר דְאוֹלִיד יַת פֶּלֶג אַרְבַּע מְאָה וּתְלָתִין שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Eber lived after he had begotten Peleg four hundred and thirty years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 18, "aliyah": 7, "heb": "וַֽיְחִי־פֶ֖לֶג שְׁלֹשִׁ֣ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־רְעֽוּ׃", "onk": "וַחֲיָא פֶלֶג תְּלָתִין שְׁנִין וְאוֹלִיד יָת רְעוּ:", "onk_en": "Peleg lived thirty years and had Re’u.", "pj": "וַחֲיָא פֶּלֶג תְּלָתִין שְׁנִין וְאוֹלִיד יַת רְעוּ", "pj_en": "And Peleg lived thirty years, and begat Reu.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 19, "aliyah": 7, "heb": "וַֽיְחִי־פֶ֗לֶג אַחֲרֵי֙ הוֹלִיד֣וֹ אֶת־רְע֔וּ תֵּ֥שַׁע שָׁנִ֖ים וּמָאתַ֣יִם שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא פֶלֶג בָּתַר דְּאוֹלִיד יָת רְעוּ מָאתָן וּתְשַׁע שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Re’u, Peleg lived two hundred and nine years, and had sons and daughters.", "pj": "וַחֲיָא פֶּלֶג בָּתַר דְאוֹלִיד יַת רְעוּ מָאתָן וּתְשַׁע שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Peleg lived after he had begotten Reu two hundred and nine years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 20, "aliyah": 7, "heb": "וַיְחִ֣י רְע֔וּ שְׁתַּ֥יִם וּשְׁלֹשִׁ֖ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־שְׂרֽוּג׃", "onk": "וַחֲיָא רְעוּ תְּלָתִין וְתַרְתֵּין שְׁנִין וְאוֹלִיד יָת שְׂרוּג:", "onk_en": "Re’u lived thirty-two years and had Serug.", "pj": "וַחֲיָא רְעוּ תְּלָתִין וְתַרְתֵּין שְׁנִין וְאוֹלִיד יַת שְרוּג", "pj_en": "And Reu lived thirty-two years, and begat Serug.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 21, "aliyah": 7, "heb": "וַיְחִ֣י רְע֗וּ אַחֲרֵי֙ הוֹלִיד֣וֹ אֶת־שְׂר֔וּג שֶׁ֥בַע שָׁנִ֖ים וּמָאתַ֣יִם שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא רְעוּ בָּתַר דְּאוֹלִיד יָת שְׂרוּג מָאתָן וּשְׁבַע שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Serug, Re’u lived two hundred and seven years, and had sons and daughters.", "pj": "וַחֲיָא רְעוּ בָּתַר דְאוֹלִיד יַת שְרוּג מָאתָן וּשְׁבַע שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Reu lived after he had begotten Serug two hundred and seven years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 22, "aliyah": 7, "heb": "וַיְחִ֥י שְׂר֖וּג שְׁלֹשִׁ֣ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־נָחֽוֹר׃", "onk": "וַחֲיָא שְׂרוּג תְּלָתִין שְׁנִין וְאוֹלִיד יָת נָחוֹר:", "onk_en": "Serug lived thirty years and had Nachor.", "pj": "וַחֲיָא שְרוּג תְּלָתִין שְׁנִין וְאוֹלִיד יַת נָחוֹר", "pj_en": "And Serug lived thirty years, and begat Nahor.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 23, "aliyah": 7, "heb": "וַיְחִ֣י שְׂר֗וּג אַחֲרֵ֛י הוֹלִיד֥וֹ אֶת־נָח֖וֹר מָאתַ֣יִם שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא שְׂרוּג בָּתַר דְּאוֹלִיד יָת נָחוֹר מָאתָן שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Nachor, Serug lived two hundred years, and had sons and daughters.", "pj": "וַחֲיָא שְרוּג בָּתַר דְאוֹלִיד יַת נָחוֹר מָאתָן שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Serug lived after he had begotten Nahor two hundred years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 24, "aliyah": 7, "heb": "וַיְחִ֣י נָח֔וֹר תֵּ֥שַׁע וְעֶשְׂרִ֖ים שָׁנָ֑ה וַיּ֖וֹלֶד אֶת־תָּֽרַח׃", "onk": "וַחֲיָא נָחוֹר עֶשְׂרִין וּתְשַׁע שְׁנִין וְאוֹלִיד יָת תָּרַח:", "onk_en": "Nachor lived twenty-nine years and had Terach.", "pj": "וַחֲיָא נָחוֹר עַשְרִין וּתְשַׁע שְׁנִין וְאוֹלִיד יַת תָּרַח", "pj_en": "And Nahor lived twenty-nine years, and begat Terah.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 25, "aliyah": 7, "heb": "וַיְחִ֣י נָח֗וֹר אַחֲרֵי֙ הוֹלִיד֣וֹ אֶת־תֶּ֔רַח תְּשַֽׁע־עֶשְׂרֵ֥ה שָׁנָ֖ה וּמְאַ֣ת שָׁנָ֑ה וַיּ֥וֹלֶד בָּנִ֖ים וּבָנֽוֹת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲיָא נָחוֹר בָּתַר דְּאוֹלִיד יָת תֶּרַח מְאָה וּתְשַׁע עֲשַׂר שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן:", "onk_en": "After he had Terach, Nachor lived one hundred and nineteen years, and had sons and daughters.", "pj": "וַחֲיָא נָחוֹר בָּתַר דְאוֹלִיד יַת תֶּרַח מְאָה וְתִּשְׁסְרֵי שְׁנִין וְאוֹלִיד בְּנִין וּבְנָן", "pj_en": "And Nahor lived after he had begotten Terah one hundred and nineteen years, and begat sons and daughters.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 26, "aliyah": 7, "heb": "וַֽיְחִי־תֶ֖רַח שִׁבְעִ֣ים שָׁנָ֑ה וַיּ֙וֹלֶד֙ אֶת־אַבְרָ֔ם אֶת־נָח֖וֹר וְאֶת־הָרָֽן׃", "onk": "וַחֲיָא תֶרַח שִׁבְעִין שְׁנִין וְאוֹלִיד יָת אַבְרָם יָת נָחוֹר וְיָת הָרָן:", "onk_en": "Terach lived seventy years and had Avram, Nachor and Haran.", "pj": "וַחֲיָא תֶּרַח שַׁבְעִין שְׁנִין וְאוֹלִיד יַת אַבְרָם יַת נָחוֹר וְיַת הָרָן", "pj_en": "And Terah lived seventy years, and begat Abram and Nahor and Haran.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 27, "aliyah": 7, "heb": "וְאֵ֙לֶּה֙ תּוֹלְדֹ֣ת תֶּ֔רַח תֶּ֚רַח הוֹלִ֣יד אֶת־אַבְרָ֔ם אֶת־נָח֖וֹר וְאֶת־הָרָ֑ן וְהָרָ֖ן הוֹלִ֥יד אֶת־לֽוֹט׃", "onk": "וְאִלֵּין תּוּלְדַת תֶּרַח תֶּרַח אוֹלִיד יָת אַבְרָם יָת נָחוֹר וְיָת הָרָן וְהָרָן אוֹלִיד יָת לוֹט:", "onk_en": "These are the histories of Terach. Terach produced Avram, Nachor, and Haran. Haran produced Lot.", "pj": "וְאִילֵן גְנִיסַת תֶּרַח תֶּרַח אוֹלִיד יַת אַבְרָם יַת נָחוֹר וְיַת הָרָן וְהָרָן אוֹלִיד יַת לוֹט", "pj_en": "These are the generations of Terah. Terah begat Abram, Nahor, and Haran; and Haran begat Lot.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 28, "aliyah": 7, "heb": "וַיָּ֣מׇת הָרָ֔ן עַל־פְּנֵ֖י תֶּ֣רַח אָבִ֑יו בְּאֶ֥רֶץ מוֹלַדְתּ֖וֹ בְּא֥וּר כַּשְׂדִּֽים׃", "onk": "וּמִית הָרָן עַל אַפֵּי תֶּרַח אֲבוּהִי בְּאַרְעָא דְיַלָּדוּתֵיהּ בְּאוּרָא דְכַסְדָּאֵי:", "onk_en": "Haran died during the lifetime of his father Terach, in the land of his birth in Ur Kasdim.", "pj": "וַהֲוָה כַּד רָמָא נִמְרוֹד יַת אַבְרָם לְאַתּוּנָא דְנוּרָא דְלָא פְלַח לְטַעֲוָותֵיהּ וְלָא הֲוָה רְשׁוּתָא לְנוּרָא לְמוֹקְדֵיהּ וּבְכֵן אִתְפְּלַג לִבָּא דְהָרָן לְמֵימַר אִילוּ נָצַח נִמְרוֹד אֱהֵא מִן סִיַעְתֵּהּ וְאִלוּ נָצַח אַבְרָם אֱהֵא מִן סִיַעֲתֵּהּ וּכְדִי חָמוּן כָּל עַמְמַיָא דַהֲווֹ תַמָן דְלָא שָׁלְטַת נוּרָא בְּאַבְרָם אָמְרוּ בְּלִבְּהוֹן הֲלָא הָרָן אֲחוֹי דְאַבְרָם מָלֵא קוּסְמִין וְחַרְשִׁין וְאִיהוּ לָחַשׁ עֲלוֹי אֵישָׁתָא דְלָא לְמֵיקַד יַת אָחוֹי מִן יַד נָפְלַת אֵישָׁתָא מִן שְׁמֵי מְרוֹמָא וּגְמַרְתֵּיהּ וּמִית הָרָן לְמֵיחְמֵי תֶּרַח אֲבוֹי הֵיךְ אִתּוֹקָד בְּאַרְעָא יַלְדוּתֵיהּ בְּאַתּוּן נוּרָא דְעָבְדוּ כַּשְדָאֵי לְאַבְרָם אָחוֹי", "pj_en": "And it was when Nimrod had cast Abram into the furnace of fire because he would not worship his idol, and the fire had no power to burn him, that Haran's heart became doubtful, saying, If Nimrod overcome, I will be on his side: but if Abram overcome, I will be on his side. And when all the people who were there saw that the fire had no power over Abram, they said in their hearts, Is not Haran the brother of Abram full of divinations and charms, and has he not uttered spells over the fire that it should not burn his brother? Immediately (min yad, out of hand) there fell fire from the high heavens and consumed him; and Haran died in the sight of Terah his father, where he was burned in the land of his nativity, in the furnace of fire which the Kasdai had made for Abram his brother.", "tj": "", "tj_en": "", "rashi": "<b>על פני תרח אביו.<\/b> בְּחַיֵי אָבִיו. וּמִדְרַשׁ אַגָּדָה אוֹמֵר שֶׁעַל יְדֵי אָבִיו מֵת; שֶׁקָּבַל תֶּרַח עַל אַבְרָם בְּנוֹ לִפְנֵי נִמְרוֹד עַל שֶׁכִּתֵּת אֶת צְלָמָיו, וְהִשְׁלִיכוֹ לְכִבְשַׁן הָאֵשׁ, וְהָרָן יוֹשֵׁב וְאוֹמֵר בְּלִבּוֹ אִם אַבְרָם נוֹצֵחַ אֲנִי מִשֶּׁלּוֹ, וְאִם נִמְרוֹד נוֹצֵחַ אֲנִי מִשֶּׁלּוֹ; וּכְשֶׁנִּצַּל אַבְרָם, אָמְרוּ לוֹ לְהָרָן מִשֶּׁל מִי אַתָּה? אָמַר לָהֶם הָרָן מִשֶּׁל אַבְרָם אֲנִי, הִשְׁלִיכוּהוּ לְכִבְשַׁן הָאֵשׁ וְנִשְׂרַף, וְזֶהוּ אוּר כַּשְׂדִים (ב\"ר). וּמְנַחֵם פֵּרֵשׁ אוּר – בִּקְעָה; וְכֵן בָּאֻרִים כַּבְּדוּ ה' (ישעיה כ\"ד), וְכֵן מְאוּרַת צִפְעוֹנִי (שם י\"א) כָּל חֹר וּבֶקַע עָמֹק קָרוּי אוּר:", "rashi_en": "על פני תרח אביו IN THE PRESENCE OF HIS FATHER TERAH — meaning during his father’s lifetime (Genesis Rabbah 38:13). The Midrashic explanation is that he died through his father. For Terah accused his son Abram before Nimrod of having smashed his idols to pieces, and he cast him into a fiery furnace. Haran waited and said to himself, “If Abram proves triumphant I will be on his side; if Nimrod wins I shall be on his”. When Abram was saved they said to Haran, “Whose side are you on?” Haran replied, “I am on Abram’s side”. They therefore cast him into the fiery furnace and he was burnt to death. It is to this that the name of the place Ur-Kasdim (fire of the Chaldees) alludes (Genesis Rabbah 38:13). Menachem ben Seruk, however, explains that אור means a valley, as (Isaiah 24:15) “Glorify ye the Lord in the valleys (באורים)”, and as (Isaiah 11:8) “the den (מאורת) of the basilisk”. Every hole or deep cleft may be called אור."}, {"ch": 11, "v": 29, "aliyah": 7, "heb": "וַיִּקַּ֨ח אַבְרָ֧ם וְנָח֛וֹר לָהֶ֖ם נָשִׁ֑ים שֵׁ֤ם אֵֽשֶׁת־אַבְרָם֙ שָׂרָ֔י וְשֵׁ֤ם אֵֽשֶׁת־נָחוֹר֙ מִלְכָּ֔ה בַּת־הָרָ֥ן אֲבִֽי־מִלְכָּ֖ה וַֽאֲבִ֥י יִסְכָּֽה׃", "onk": "וּנְסִיב אַבְרָם וְנָחוֹר לְהוֹן נְשִׁין שׁוּם אִתַּת אַבְרָם שָׂרָי וְשׁוּם אִתַּת נָחוֹר מִלְכָּה בַּת הָרָן אֲבוּהָא דְמִלְכָּה וַאֲבוּהָא דְיִסְכָּה:", "onk_en": "Avram and Nachor married. The name of Avram’s wife was Sarai, and the name of Nachor’s wife was Milkah, the daughter of Haran [who was] the father of Milkah and Yiskah.", "pj": "וּנְסִיב אַבְרָם וְנָחוֹר לְהוֹן נְשִׁין שׁוּם אִתַּת אַבְרָם שָרַי וְשׁוּם אִתַּת נָחוֹר מִלְכָּה בְּרַת הָרָן אֲבוֹי דְמִלְכָּא וַאֲבוֹי דְיִסְכָּה הִיא שָרַי", "pj_en": "And Abram and Nahor took to them wives: the name of Abram's wife was Sara, and the name of the wife of Nahor, Milcha, the daughter of Haran, the father of Milcha and the father of Iska, who is Sara.", "tj": "", "tj_en": "", "rashi": "<b>יסכה.<\/b> זוֹ שָׂרָה, עַל שֵׁם שֶׁסּוֹכָה בְּרוּחַ הַקֹּדֶשׁ וְשֶׁהַכֹּל סוֹכִין בְיָפְיָהּ; וְעוֹד יִסְכָּה לְשׁוֹן נְסִיכוּת, כְּמוֹ שָׂרָה לְשׁוֹן שְׂרָרָה:", "rashi_en": "יסכה JISCAH — This was Sarah; she was also named Jiscah (from a root meaning “”to see”, “to look”) because she could see the future by holy inspiration, and because everybody looked (gazed) at her beauty (Megillah 14a). The name Jiscah also has reference to princely dignity (נסיכות) just as the name Sarah (שרה) has an allusion to “ruling’’(שררה)."}, {"ch": 11, "v": 30, "aliyah": 7, "heb": "וַתְּהִ֥י שָׂרַ֖י עֲקָרָ֑ה אֵ֥ין לָ֖הּ וָלָֽד׃", "onk": "וַהֲוַת שָׂרַי עֲקָרָה לֵית לָהּ וְלָד:", "onk_en": "Sarai was barren, she had no child.", "pj": "וַהֲוַת שָרַי עַקְרָא לֵית לָהּ וָלָד", "pj_en": "And Sara was barren, she had no child.", "tj": "וַהֲוַת שָרַי עַקְרָא לָא הֲוָה לָהּ בַּר:", "tj_en": "And Sara was barren, she had no son.", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 31, "aliyah": 7, "heb": "וַיִּקַּ֨ח תֶּ֜רַח אֶת־אַבְרָ֣ם בְּנ֗וֹ וְאֶת־ל֤וֹט בֶּן־הָרָן֙ בֶּן־בְּנ֔וֹ וְאֵת֙ שָׂרַ֣י כַּלָּת֔וֹ אֵ֖שֶׁת אַבְרָ֣ם בְּנ֑וֹ וַיֵּצְא֨וּ אִתָּ֜ם מֵא֣וּר כַּשְׂדִּ֗ים לָלֶ֙כֶת֙ אַ֣רְצָה כְּנַ֔עַן וַיָּבֹ֥אוּ עַד־חָרָ֖ן וַיֵּ֥שְׁבוּ שָֽׁם׃", "onk": "וּדְבַר תֶּרַח יָת אַבְרָם בְּרֵיהּ וְיָת לוֹט בַּר הָרָן בַּר בְּרֵיהּ וְיָת שָׂרַי כַּלָּתֵיהּ אִתַּת אַבְרָם בְּרֵיהּ וּנְפָקוּ עִמְּהוֹן מֵאוּרָא דְכַסְדָּאֵי לְמֵיזַל לְאַרְעָא דִכְנָעַן וַאֲתוֹ עַד חָרָן וִיתִיבוּ תַמָּן:", "onk_en": "Terach took his son, Avram, and Lot, the son of Haran, his grandson, and Sarai, his daughter-in-law, the wife of his son, Avram. With them they departed from Ur Kasdim, to go to the land of Canaan. [When] they came to Charan [however], they settled there.", "pj": "וּדְבַר תֶּרַח יַת אַבְרָם בְּרֵיהּ וְיַת לוֹט בַּר הָרָן בַּר בְּרֵיהּ וְיַת שָרַי כַּלָתֵיהּ אִתַּת אַבְרָם בְּרֵיהּ וּנְפָקוּ עִמְהוֹן מֵאוּרָא דְכַשְדָאֵי לְמֵיעַל לְאַרְעָא דִכְנָעַן וַאֲתוֹ עַד חָרָן וְיָתִיבוּ תַּמָן", "pj_en": "And Terah took Abram his son, and Lot bar Haran, the son of his son, and his daughter-in-law Sara the wife of Abram his son, and went forth with them from Ura of the Kasdai, to go to the land of Kenaan. And they came unto Haran, and dwelt there.", "tj": "", "tj_en": "", "rashi": "<b>ויצאו אתם.<\/b> וַיֵּצְאוּ תֶּרַח וְאַבְרָם עִם לוֹט וְשָׂרַי:", "rashi_en": "ויצאו אתם AND THEY WENT FORTH WITH THEM — ויצאו אתם Terah and Abram went forth with Lot and Sarai."}, {"ch": 11, "v": 32, "aliyah": 7, "heb": "וַיִּהְי֣וּ יְמֵי־תֶ֔רַח חָמֵ֥שׁ שָׁנִ֖ים וּמָאתַ֣יִם שָׁנָ֑ה וַיָּ֥מׇת תֶּ֖רַח בְּחָרָֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַהֲווֹ יוֹמֵי תֶרַח מָאתָן וַחֲמֵשׁ שְׁנִין וּמִית תֶּרַח בְּחָרָן:", "onk_en": "The lifetime of Terach was two hundred and five years. Terach died in Charan.", "pj": "וַהֲווֹ יוֹמֵי תֶּרַח מָאתָן וַחֲמֵשׁ שְׁנִין וּמִית תֶּרַח בְּחָרָן", "pj_en": "And the days of Terah were two hundred and five years. And Terah died in Haran.", "tj": "", "tj_en": "", "rashi": "<b>וימת תרח בחרן.<\/b> לְאַחַר שֶׁיָּצָא אַבְרָם מֵחָרָן וּבָא לְאֶרֶץ כְּנַעַן, וְהָיָה שָׁם יוֹתֵר מִשִּׁשִּׁים שָׁנָה; שֶׁהֲרֵי כָתוּב וְאַבְרָם בֶּן חָמֵשׁ שָׁנִים וְשִׁבְעִים שָׁנָה בְּצֵאתוֹ מֵחָרָן וְתֶרַח בֶּן שִׁבְעִים שָׁנָה כְּשֶׁנּוֹלַד אַבְרָם, הֲרֵי קמ\"ה לְתֶרַח; כְּשֶׁיָּצָא אַבְרָם מֵחָרָן עֲדַיִן נִשְׁאֲרוּ מִשְּׁנוֹתָיו הַרְבֵּה, וְלָמָּה הִקְדִּים הַכָּתוּב מִיתָתוֹ שֶׁל תֶּרַח לִיצִיאָתוֹ שֶׁל אַבְרָם? שֶׁלֹּא יְהֵא הַדָּבָר מְפֻרְסָם לַכֹּל וְיֹאמְרוּ לֹא קִיֵּם אַבְרָם אֶת כְּבוֹד אָבִיו, שֶׁהִנִּיחוֹ זָקֵן וְהָלַךְ לוֹ, לְפִיכָךְ קְרָאוֹ הַכָּתוּב מֵת, שֶׁהָרְשָׁעִים אַף בְּחַיֵּיהֶם קְרוּיִים מֵתִים, וְהַצַּדִּיקִים אַף בְּמִיתָתָן קְרוּיִים חַיִּים, שֶׁנֶּאֱמַר וּבְנָיָהוּ בֶן יְהוֹיָדָע בֶּן אִישׁ חי (שְׁמוּאֵל ב' כ\"ג):<br><br>(<b>בחרן<\/b> הַנּוּ\"ן הֲפוּכָה לוֹמַר לְךָ, עַד אַבְרָם חֲרוֹן אַף שֶׁל מָקוֹם):", "rashi_en": "וימת תרח בחרן AND TERAH DIED IN HARAN after Abram had left Haran (as related in the next chapter) and had come to the land of Canaan and had been there more than sixty years. For it is written, (Genesis 12:4) “And Abram was seventy five years old when he left Haran”, and Terah was seventy years old when Abram was born (Genesis 11:26), making Terah 145 years old when Abram left Haran, so that there were then many years of his life left (i. e. he lived many years after that — as a matter of fact, 60 years, as he was 205 years old when he died). Why, then, does Scripture mention the death of Terah before the departure of Abram? In order that this matter (his leaving home during his father’s lifetime) might not become known to all, lest people should say that Abram did not show a son’s respect to his father, for he left him in his old age and went his way. That is why Scripture speaks of him as dead (Genesis Rabbah 39:7). For indeed the wicked even while alive are called dead and the righteous even when dead are called living, as it is said, (2 Samuel 23:20) “And Benaiah the son of Jehoiada the son of a living man”.<br><br>בחרן IN HARAN — The נ is inverted to tell you that until the time of Abraham, the fierce anger (חרון) of the Omnipotent was kindled against the world."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
