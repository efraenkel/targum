<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 32, "v": 4, "aliyah": 1, "heb": "וַיִּשְׁלַ֨ח יַעֲקֹ֤ב מַלְאָכִים֙ לְפָנָ֔יו אֶל־עֵשָׂ֖ו אָחִ֑יו אַ֥רְצָה שֵׂעִ֖יר שְׂדֵ֥ה אֱדֽוֹם׃", "onk": "וּשְׁלַח יַעֲקֹב אִזְגַּדִּין קֳדָמוֹהִי לְוַת עֵשָׂו אֲחוּהִי לְאַרְעָא דְשֵׂעִיר לַחֲקַל אֱדוֹם:", "onk_en": "Yaakov sent messengers before him to Eisov, his brother, to the Land of Seir, to the field of Edom.", "pj": "וישׁלח וְשָׁדַר יַעֲקב אִזְגַדִין קוֹמוֹי לְוַת עֵשָו אָחוֹי לְאַרְעָא דְגַבְלָא לְחַקְלָא אֱדוֹמָאֵי", "pj_en": "And Jakob sent messengers before him to Esau his brother in the land of Gabla the territory of the Edomites,", "tj": "", "tj_en": "", "rashi": "<b>וישלח יעקב מלאכים.<\/b> מַלְאָכִים מַמָּשׁ (בראשית רבה):<br><br><b>ארצה שעיר.<\/b> לְאֶרֶץ שֵׂעִיר כָּל תֵּבָה שֶׁצְּרִיכָה לָמֶ\"ד בִּתְּחִלָּתָהּ הֵטִיל לָהּ הַכָּתוּב הֵ\"א בְּסוֹפָהּ:", "rashi_en": "וישלח יעקב מלאכים AND JACOB SENT MESSENGERS (Heb. מלאכים angels) — actually angels (Genesis Rabbah 75:4).<br><br>ארצה שעיר means TO THE LAND OF SEIR — A word that requires a ל as prefix has a ה placed as a suffix (Yevamot 13b). "}, {"ch": 32, "v": 5, "aliyah": 1, "heb": "וַיְצַ֤ו אֹתָם֙ לֵאמֹ֔ר כֹּ֣ה תֹאמְר֔וּן לַֽאדֹנִ֖י לְעֵשָׂ֑ו כֹּ֤ה אָמַר֙ עַבְדְּךָ֣ יַעֲקֹ֔ב עִם־לָבָ֣ן גַּ֔רְתִּי וָאֵחַ֖ר עַד־עָֽתָּה׃", "onk": "וּפַקִּיד יָתְהוֹן לְמֵימַר כְּדֵין תֵּימְרוּן לְרִבּוֹנִי לְעֵשָׂו כִּדְנַן אֲמַר עַבְדָּךְ יַעֲקֹב עִם לָבָן דָּרִית וְאוֹחָרִית עַד כְּעָן:", "onk_en": "He commanded them saying, This is what you should say to my master, Eisov. Your servant, Yaakov says, I lived as a stranger with Lavan, and was delayed until now.", "pj": "וּפְקִיד יַתְהוֹם לְמֵימַר כְּדֵין תֵּימְרוּן לְרִיבּוֹנִי לְעֵשָו כִּדְנַן אָמַר עַבְדָךְ יַעֲקב עִם לָבָן אִיתּוֹתָבִית וְאִשְׁתְּהָיַית עַד כְּדוֹן", "pj_en": "and instructed them to say, Thus shall you speak to my lord Esau: Thus saith thy servant Jakob, With Laban have I dwelt, and have tarried until now.", "tj": "", "tj_en": "", "rashi": "<b>גרתי.<\/b> לֹא נַעֲשֵׂיתִי שַׂר וְחָשׁוּב אֶלָּא גֵּר, אֵינְךָ כְּדַאי לִשְׂנֹא אוֹתִי עַל בִּרְכַּת אָבִיךָ שֶׁבֵּרְכַנִי הֱוֵה גְבִיר לְאַחֶיךָ, שֶׁהֲרֵי לֹא נִתְקַיְּמָה בִי. דָּ\"אַ גַּרְתִּי בְּגִימַטְרִיָּא תרי\"ג, כְּלוֹמַר, עִם לָבָן גַּרְתִּי וְתַרְיַ\"ג מִצְוֹת שָׁמַרְתִּי וְלֹא לָמַדְתִּי מִמַּעֲשָׂיו הָרָעִים:", "rashi_en": "גרתי I HAVE SOJOURNED — I have become neither a prince nor other person of importance but merely a sojourner. It is not worth your while to hate me on account of the blessing of your father who blessed me (27:29) “Be master over thy brethren”, for it has not been fulfilled in me (Tanchuma Yashan 1:8:5). Another explanation: the word גרתי has the numerical value of 613 - תרי״ג - it is as much as to say, “Though I have sojourned with Laban, the wicked, I have observed the תרי״ג מצות, the 613 Divine Commandments, and I have learned naught of his evil ways. "}, {"ch": 32, "v": 6, "aliyah": 1, "heb": "וַֽיְהִי־לִי֙ שׁ֣וֹר וַחֲמ֔וֹר צֹ֖אן וְעֶ֣בֶד וְשִׁפְחָ֑ה וָֽאֶשְׁלְחָה֙ לְהַגִּ֣יד לַֽאדֹנִ֔י לִמְצֹא־חֵ֖ן בְּעֵינֶֽיךָ׃", "onk": "וַהֲוָה לִי תּוֹרִין וַחֲמָרִין עָאן וְעַבְדִּין וְאַמְהָן וּשְׁלָחִית לְחַוָּאָה לְרִבּוֹנִי לְאַשְׁכָּחָא רַחֲמִין בְּעֵינָךְ:", "onk_en": "I acquired oxen, donkeys, sheep, servants and maidservants. I have sent [these messengers] to tell my master, to find favor in your eyes.", "pj": "וּמִכָּל מַה דִבְרִיךְ יָתִי אַבָּא לֵית בְּיָדִי אֱלָהֵין הֲווֹ לִי כִזְעֵיר תּוֹרִין וְחַמְרִין עָאן וְעַבְדִין וְאַמְהָן וְשַׁדָרִית לְתַנָאָה לְרִבּוֹנִי דְלָא אָהַנְיַית לִי בִּרְכָתָא הַהוּא לְאַשְׁכָּחָא רַחֲמִין בְּעֵינָךְ דְלָא תִינְטוֹר לִי בָּבִין עֲלָהּ", "pj_en": "And of all that in which my father blessed me there is nothing in my hand; but I have a few oxen and asses, sheep, and servants and handmaids; and I have sent to tell my lord that that blessing hath not profited me; that I may find mercy in thine eyes and that thou mayest not maintain (enmity) against me on account thereof.", "tj": "", "tj_en": "", "rashi": "<b>ויהי לי שור וחמור.<\/b> אַבָּא אָמַר לִי מִטַּל הַשָּׁמַיִם וּמִשְׁמַנֵּי הָאָרֶץ, זוֹ אֵינָהּ לֹא מִן הַשָּׁמַיִם וְלֹא מִן הָאָרֶץ:<br><br><b>שור וחמור.<\/b> דֶּרֶךְ אֶרֶץ לוֹמַר עַל שְׁוָרִים הַרְבֵּה שׁוֹר – אָדָם אוֹמֵר לַחֲבֵרוֹ בַּלַּיְלָה קָרָא הַתַּרְנְגוֹל וְאֵינוֹ אוֹמֵר קָרְאוּ הַתַּרְנְגוֹלִים:<br><br><b>ואשלחה להגיד לאדני.<\/b> לְהוֹדִיעַ שֶׁאֲנִי בָא אֵלֶיךָ:<br><br><b>למצא חן בעיניך.<\/b> שֶׁאֲנִי שָׁלֵם עִמְּךָ וּמְבַקֵּשׁ אַהֲבָתְךָ:", "rashi_en": "ויהי לי שור וחמור AND I HAVE OXEN AND ASSES — Our father promised me, (27:28) “[God will give thee] of the dew of heaven and of the fat places of the earth” — these are neither of the heaven nor of the earth<br><br>שור וחמור (literally, an ox and an ass) — It is the customary thing to speak of many oxen as an ox (Genesis Rabbah 75:6) — a man says to his fellow, “During the night the cock crowed”; he does not say “the cocks crowed”<br><br>ואשלחה להגיד לאדוני AND I HAVE SENT TO TELL MY LORD — to announce that I am coming to you.<br><br>למצא חן בעיניך THAT I MAY FIND FAVOUR IN THY EYES, for I am at peace with you and seek your friendship. "}, {"ch": 32, "v": 7, "aliyah": 1, "heb": "וַיָּשֻׁ֙בוּ֙ הַמַּלְאָכִ֔ים אֶֽל־יַעֲקֹ֖ב לֵאמֹ֑ר בָּ֤אנוּ אֶל־אָחִ֙יךָ֙ אֶל־עֵשָׂ֔ו וְגַם֙ הֹלֵ֣ךְ לִקְרָֽאתְךָ֔ וְאַרְבַּע־מֵא֥וֹת אִ֖ישׁ עִמּֽוֹ׃", "onk": "וְתָבוּ אִזְגַּדַּיָּא לְוַת יַעֲקֹב לְמֵימָר אֲתֵינָא לְוַת אָחוּךְ לְוַת עֵשָׂו וְאַף אָתֵי לְקַדָּמוּתָךְ וְאַרְבַּע מְאָה גַבְרָא עִמֵּיהּ:", "onk_en": "The messengers returned to Yaakov saying, We came to your brother, to Eisov, and he is also coming to meet you; and there are four hundred men with him.", "pj": "וְתָבוּ אִזְגַדַיָא לְוַת יַעֲקב לְמֵימַר אָתֵינָא לְוַת אָחוּךְ לְעֵשָו וְאוּף אָתֵי לִקְדָמוּתָךְ וְאַרְבַּע מְאָה גוּבְרִין פּוּלְמַרְכִין עִמֵיהּ", "pj_en": "And the messengers returned to Jakob, saying, We came to thy brother, to Esau, and he also cometh to meet thee, and four hundred chief--warriors with him.", "tj": "וְאַרְבַּע מֵאָה גוּבְרִין פּוּלְמַרְכִין עִמֵיהּ:", "tj_en": "And four hundred men, warlike leaders with him.", "rashi": "<b>באנו אל אחיך אל עשו.<\/b> שֶׁהָיִיתָ אוֹמֵר אָחִי הוּא, אֲבָל הוּא נוֹהֵג עִמְּךָ כְּעֵשָׂו הָרָשָׁע, עוֹדֶנּוּ בְּשִׂנְאָתוֹ (בראשית רבה פ'):", "rashi_en": "באנו אל אחיך אל עשו WE CAME TO THY BROTHER, TO ESAU — to him of whom you said he is my brother, but he behaves towards you as Esau, the wicked — he is still harbouring hatred (Genesis Rabbah 75:7). "}, {"ch": 32, "v": 8, "aliyah": 1, "heb": "וַיִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַיֵּ֣צֶר ל֑וֹ וַיַּ֜חַץ אֶת־הָעָ֣ם אֲשֶׁר־אִתּ֗וֹ וְאֶת־הַצֹּ֧אן וְאֶת־הַבָּקָ֛ר וְהַגְּמַלִּ֖ים לִשְׁנֵ֥י מַחֲנֽוֹת׃", "onk": "וּדְחִיל יַעֲקֹב לַחֲדָא וַעֲקַת לֵיהּ וּפַלֵּיג יָת עַמָּא דִי עִמֵּיהּ וְיָת עָנָא וְיָת תּוֹרֵי וְגַמְלַיָּא לִתְרֵין מַשִּׁירְיָן:", "onk_en": "Yaakov was very frightened, and distressed. He divided the people that were with him, along with the sheep, cattle and camels, into two camps.", "pj": "וּדְחִיל יַעֲקב לַחֲדָא עַל דְלָא עָסַק עֶשְרִין שְׁנִין בִּיקָרָא דְאָבוֹי וְעָקַת לֵיהּ וּפַלֵיג יַת עַמָא דְעִמֵיהּ וְיַת עָנָא וְיַת תּוֹרֵי וְגַמְלַיָא לִתְרֵין מַשִׁרְיַין לְמוֹהֲבוּת לֵאָה וּלְמוֹהֲבוּת רָחֵל", "pj_en": "And Jakob was greatly afraid, because for twenty years he had not been mindful of the glory of his father: and he had anxiety; and he divided the people who were with him, the sheep, and oxen, and camels, into three troops, for a portion. to Leah, and a portion to Rahel.", "tj": "", "tj_en": "", "rashi": "<b>ויירא ויצר.<\/b> וַיִּירָא שֶׁמָּא יֵהָרֵג, וַיֵּצֶר לוֹ אִם יַהֲרֹג הוּא אֶת אֲחֵרִים (בראשית רבה ותנחומא):", "rashi_en": "ויירא...ויצר HE FEARED GREATLY AND WAS DISTRESSED — He was afraid lest he be killed, and he was distressed that he might have to kill someone (Genesis Rabbah 76:2). "}, {"ch": 32, "v": 9, "aliyah": 1, "heb": "וַיֹּ֕אמֶר אִם־יָב֥וֹא עֵשָׂ֛ו אֶל־הַמַּחֲנֶ֥ה הָאַחַ֖ת וְהִכָּ֑הוּ וְהָיָ֛ה הַמַּחֲנֶ֥ה הַנִּשְׁאָ֖ר לִפְלֵיטָֽה׃", "onk": "וַאֲמַר אִם יֵיתֵי עֵשָׂו לְמַשְׁרִיתָא חֲדָא וְיִמְחִנֵּיהּ וִיהֵי (<small>נ\"א<\/small> וְיִמְחֵנַהּ וּתְהִי) מַשְׁרִיתָא דְתִשְׁתָּאַר לְשֵׁיזָבָא:", "onk_en": "He said, If Eisov comes to one camp and attacks it, the remaining camp will survive.", "pj": "וַאֲמַר אִין יֵיתֵי עֵשָו לְמִשְׁרֵי דְחָדָא מִנְהוֹן וְיַמְחִינֵיהּ וִיהֵי מִשְׁרֵי דְמִשְׁתָּאֵר לְשֵׁיזְבָא", "pj_en": "And he said, If Esau come to the one troop of them and smite it, the remaining troop may escape.", "tj": "", "tj_en": "", "rashi": "<b>המחנה האחת והכהו.<\/b> מַחֲנֶה מְשַׁמֵּשׁ לְשׁוֹן זָכָר וּלְשׁוֹן נְקֵבָה, אִם תַּחֲנֶה עָלַי מַחֲנֶה (תהלים כ\"ז), הֲרֵי נְקֵבָה, הַמַּחֲנֶה הַזֶּה (בראשית ל\"ג), זָכָר, וְכֵן יֵשׁ שְׁאָר דְּבָרִים מְשַׁמְּשִׁים לְשׁוֹן זָכָר וּלְשׁוֹן נְקֵבָה, הַשֶּׁמֶשׁ יָצָא עַל הָאָרֶץ (בראשית י״ט:כ״ג), מִקְצֵה הַשָּׁמַיִם מוֹצָאוֹ (תהלים י\"ט), הֲרֵי לְשׁוֹן זָכָר; וְהַשֶּׁמֶשׁ זָרְחָה עַל הַמָּיִם (מלכים ב ג'), הֲרֵי לְשׁוֹן נְקֵבָה. וְכֵן רוּחַ, וְהִנֵּה רוּחַ גְּדוֹלָה בָּאָה, הֲרֵי לְשׁוֹן נְקֵבָה, וַיִּגַּע בְּאַרְבַּע פִּנּוֹת הַבַּיִת (איוב א'), הֲרֵי לְשׁוֹן זָכָר, וְרוּחַ גְּדוֹלָה וְחָזָק מְפָרֵק הָרִים (מלכים א' י\"ט), הֲרֵי לְשׁוֹן זָכָר וּלְשׁוֹן נְקֵבָה. וְכֵן אֵשׁ, וְאֵשׁ יָצְאָה מֵאֵת ה' (במדבר ט\"ז), לְשׁוֹן נְקֵבָה, אֵשׁ לֹהֵט (תהילים ק\"ד), לְשׁוֹן זָכָר:<br><br><b>והיה המחנה הנשאר לפליטה.<\/b> עַל כָּרְחוֹ, כִּי אֶלָּחֵם עִמּוֹ. הִתְקִין עַצְמוֹ לִשְׁלֹשָׁה דְּבָרִים, לְדוֹרוֹן, לִתְפִלָּה וּלְמִלְחָמָה. לְדוֹרוֹן, וַתַּעֲבֹר הַמִּנְחָה עַל פָּנָיו; לִתְפִלָּה, אֱלֹהֵי אָבִי אַבְרָהָם; לְמִלְחָמָה, וְהָיָה הַמַּחֲנֶה הַנִּשְׁאָר לִפְלֵיטָה:", "rashi_en": "המחנה האחת והכהו TO THE ONE CAMP AND SMITE IT — The word מחנה is treated grammatically as masculine or feminine: in (Psalms 27:3) “Though a camp should encamp (תחנה) against me” it is feminine; in (Genesis 33:8) “this (הזה) camp” it is masculine. Similarly there are other words treated grammatically as both masculine and feminine. For example, the word שמש in (Genesis 19:23) “The sun was risen (יצא) upon the earth” and in (Psalms 19:7) “His (the sun’s) going forth (מוצאו) is from the end of the heaven”; here it is masculine, but in (2 Kings 3:22) “and the sun shone (זרחה) upon the water” it is feminine. Similarly with רוח: in (Job 1:19) “and behold there came (באה) a great wind” it is feminine, and in the same verse “and smote (ויגע) the four corners of the house” it is masculine; in (1 Kings 19:11) “and a great (גדולה) and strong (וחזק) wind rent (מפרק) the mountains” it is both masculine and feminine. So also in the case of אש: in (Numbers 16:35) “and fire came forth (יצאה) from the Lord” it is feminine, and in (Psalms 104:4) “The flaming (להט) fire” it is masculine.<br><br>והיה המחנה הנשאר לפליטה THEN THE REMAINING CAMP MAY ESCAPE in spite of him, for I will fight against him He prepared himself for three things: to give him a present — as it states (Genesis 32:22) “So, the present passed before him”; for prayer — as it states (Genesis 32:10), “And he said, ‘O God of my father Abraham”; for war — as it states in this verse, “then the remaining camp may escape”, for I will fight against him (Tanchuma Yashan 1:8:6). "}, {"ch": 32, "v": 10, "aliyah": 1, "heb": "וַיֹּ֘אמֶר֮ יַעֲקֹב֒ אֱלֹהֵי֙ אָבִ֣י אַבְרָהָ֔ם וֵאלֹהֵ֖י אָבִ֣י יִצְחָ֑ק יְהֹוָ֞ה הָאֹמֵ֣ר אֵלַ֗י שׁ֧וּב לְאַרְצְךָ֛ וּלְמוֹלַדְתְּךָ֖ וְאֵיטִ֥יבָה עִמָּֽךְ׃", "onk": "וַאֲמַר יַעֲקֹב אֱלָהֵהּ דְּאַבָּא אַבְרָהָם וֵאלָהֵהּ דְּאַבָּא יִצְחָק יְיָ דִּי אֲמַר לִי תּוּב לְאַרְעָךְ וּלְיַלָּדוּתָךְ וְאוֹטֵיב עִמָּךְ:", "onk_en": "Yaakov said, God of my father Avraham, and God of my father Yitzchok, Adonoy Who said to me, Return to your land, to your birthplace, and I will do good with you.", "pj": "וַאֲמַר יַעֲקב אֱלָהֵיהּ דְאַבָּא אַבְרָהָם הוּא אֱלָהֵיהּ דְאַבָּא יִצְחָק יְיָ דְאָמַר לִי תּוּב לְאַרְעָךְ וּלְיַלְדוּתָךְ וְאוֹטִיב עִמָךְ", "pj_en": "And Jakob said, God of my father Abraham, Thou, the God of my father Izhak, the Lord, who saidst to me, Return to thy country and to thy kindred, and I wilt do thee good:", "tj": "", "tj_en": "", "rashi": "<b>ואלהי אבי יצחק.<\/b> וּלְהַלָּן הוּא אוֹמֵר וּפַחַד יִצְחָק? וְעוֹד וּמַהוּ שֶׁחָזַר וְהִזְכִּיר שֵׁם הַמְיֻחָד? הָיָה לוֹ לִכְתֹּב הָאוֹמֵר אֵלַי שׁוּב לְאַרְצְךָ וְגוֹ'. אֶלָּא כָּךְ אָמַר יַעֲקֹב לִפְנֵי הַקָּבָּ\"ה, שְׁתֵּי הַבְטָחוֹת הִבְטַחְתַּנִי, אַחַת בְּצֵאתִי מִבֵּית אָבִי מִבְּאֵר שֶׁבַע, שֶׁאָמַרְתָּ לִי אֲנִי ה' אֱלֹהֵי אַבְרָהָם אָבִיךָ וֵאלֹהֵי יִצְחָק, וְשָׁם אָמַרְתָּ לִי וּשְׁמַרְתִּיךָ בְּכֹל אֲשֶׁר תֵּלֵךְ, וּבְבֵית לָבָן אָמַרְתָּ לִי (בראשית ל\"א) שׁוּב אֶל אֶרֶץ אֲבוֹתֶיךָ וּלְמוֹלַדְתֶּךָ וְאֶהְיֶה עִמָּךְ, וְשָׁם נִגְלֵיתָ אֵלַי בַּשֵּׁם הַמְיֻחָד לְבַדּוֹ, שֶׁנֶּאֱמַר וַיֹּאמֶר ה' אֶל יַעֲקֹב שׁוּב אֶל אֶרֶץ אֲבוֹתֶיךָ וְגוֹ', בִּשְׁתֵּי הַבְטָחוֹת אֵלּוּ אֲנִי בָא לְפָנֶיךָ:", "rashi_en": "ואלהי אבי יצחק AND GOD OF MY FATHER ISAAC — But in another place (Genesis 31:42) he said, “And the Dread of Isaac”! Then also why did he again mention the Proper Name of God (first invoking him as God of Abraham, God of Isaac, and then continuing “O Lord, who saidst unto me”)? It should have been written “O God of Abraham and God of Isaac (omitting ‘O Lord’) who saidst unto me, “Return unto thy country” etc. But the explanation is as follows: Jacob said to the Holy One, blessed be He, “You made me two promises. One was when I left my father’s house at Beersheba when You said to me (Genesis 28:3) “I am the Lord, the God of Abraham thy father and the God of Isaac”, and on that occasion you promised me (Genesis 28:15) “and I will keep thee whithersoever thou goest”. Then again in Laban’s house You said to me (Genesis 31:3) “Return unto the land of thy fathers and to thy kindred and I will be with thee”. There You revealed Yourself to me by Your Proper Name alone, as it is said (Genesis 31:3) “And the Lord said unto Jacob “Return unto the land of thy fathers etc.” Relying upon these two promises I now come before You invoking you as “the God of Abraham and the God of Isaac” and also simply as “the Lord” under which names You made me these two promises respectively. "}, {"ch": 32, "v": 11, "aliyah": 1, "heb": "קָטֹ֜נְתִּי מִכֹּ֤ל הַחֲסָדִים֙ וּמִכׇּל־הָ֣אֱמֶ֔ת אֲשֶׁ֥ר עָשִׂ֖יתָ אֶת־עַבְדֶּ֑ךָ כִּ֣י בְמַקְלִ֗י עָבַ֙רְתִּי֙ אֶת־הַיַּרְדֵּ֣ן הַזֶּ֔ה וְעַתָּ֥ה הָיִ֖יתִי לִשְׁנֵ֥י מַחֲנֽוֹת׃", "onk": "<b>זְעִירָן זָכוּתַי<\/b> מִכֹּל חִסְדִּין וּמִכָּל <b>טַבְוָן<\/b> דִּי עֲבַדְתָּ עִם עַבְדָּךְ אֲרֵי יְחִידִי עֲבָרִית יָת יַרְדְּנָא הָדֵין וּכְעַן הַוֵיתִי לִתְרֵין (<small>נ\"א<\/small> לְתַרְתֵּין) מַשִּׁרְיָן:", "onk_en": "I am unworthy [<b>My merits are few<\/b>] because of all the kindness and of all the faithfulness [<b>goodness<\/b>] that you have done with Your servant; for I crossed over this Jordan [only] with my staff [<b>alone<\/b>], and now I have become two camps.", "pj": "לֵית אֲנָא כְּמֵיסַת וּזְעֵיר אֲנָא מִכָּל טַבְוָון וּמִן כָּל קוּשְׁטָא דִי עָבַדְתְּ עִם עַבְדָךְ אֲרוּם בְּחוּטְרִי בִּלְחוֹד עֲבָרִית יַת יוֹרְדְנָא הָדֵין וּכְדוּן הֲוֵינָא לְתַרְתֵּין מַשִׁרְוַיָין", "pj_en": "I am altogether less than any of the (acts of) goodness and truth which Thou hast exercised towards Thy servant: for with my staff, alone, I passed this Jardena, and now I am become two bands.", "tj": "", "tj_en": "", "rashi": "<b>קטנתי מכל החסדים.<\/b> נִתְמַעֲטוּ זְכֻיּוֹתַי עַל יְדֵי הַחֲסָדִים וְהָאֱמֶת שֶׁעָשִׂיתָ עִמִּי, לְכָךְ אֲנִי יָרֵא, שֶׁמָּא מִשֶּׁהִבְטַחְתַּנִי נִתְקַלְקַלְתִּי בְחֵטְא וְיִגְרֹם לִי לְהִמָּסֵר בְּיַד עֵשָׂו (שבת ל\"ב):<br><br><b>ומכל האמת.<\/b> אֲמִתַּת דְּבָרֶיךָ, שֶׁשָּׁמַרְתָּ לִי כָּל הַבְטָחוֹת שֶׁהִבְטַחְתַּנִי:<br><br><b>כי במקלי.<\/b> לֹא הָיָה עִמִּי לֹא כֶסֶף וְלֹא זָהָב וְלֹא מִקְנֶה אֶלָּא מַקְלִי לְבַדּוֹ. וּמִ\"אַ נָתַן מַקְלוֹ בַּיַּרְדֵּן וְנִבְקַע הַיַּרְדֵּן:", "rashi_en": "קטנתי מכל החסדים I AM TOO UNWORTHY OF ALL THE MERCIES (This may be rendered “I am small — unworthy — because of all the kindnesses) — My merits are diminished in consequence of all the kindness and truth which You have already shown me. For this reason I am afraid: perhaps, since You made these promises to me, I have become depraved (נתקלקלתי) by sin (another version of Rashi has נתלכלכתי, I have become defiled by sin) and this may cause me to be delivered unto Esau’s power (Shabbat 32a).<br><br>ומכל האמת [my merits are diminished in consequence] OF ALL THE TRUTH — of the true fulfillment (אמיתת) of Your promises — because You have already kept all the promises You made me<br><br>כי במקלי FOR WITH MY STAFF — I had with me neither silver nor gold nor cattle — only this staff of mine. The Midrashic explanation is, that he had placed his staff in the Jordan and Jordan had divided for him to pass over. "}, {"ch": 32, "v": 12, "aliyah": 1, "heb": "הַצִּילֵ֥נִי נָ֛א מִיַּ֥ד אָחִ֖י מִיַּ֣ד עֵשָׂ֑ו כִּֽי־יָרֵ֤א אָנֹכִי֙ אֹת֔וֹ פֶּן־יָב֣וֹא וְהִכַּ֔נִי אֵ֖ם עַל־בָּנִֽים׃", "onk": "שֵׁזַבְנִי <b>כְעַן<\/b> מִידָא דְאָחִי מִידָא דְעֵשָׂו אֲרֵי דַחֵל אֲנָא מִנֵּיהּ דִּילְמָא יֵיתֵי וְיִמְחִנַּנִי אִמָּא עַל בְּנַיָּא:", "onk_en": "Rescue me, I pray [<b>now<\/b>], from the hand of my brother, from the hand of Eisov, for I fear him, that he will come and attack me—mother and children alike.", "pj": "שֵׁיזְבַנִי כְדוֹן מִן יַד אֲחִי רַבָּא מִן יַד עֵשָו אֲרוּם מִסְתְּפֵי אֲנָא מִנֵיהּ דְהוּא עָסַק בְּאִיקְרָא דְאָבוּי דִילְמָא יֵיתֵי וְיִמְחִינַנִי אִימָא עַל בְּנַיָא", "pj_en": "Deliver me I pray, from the hand of my elder brother, from the hand of Esau, for I fear him: for he hath been mindful of the glory of his father; lest he come and smite the mother with the children.", "tj": "", "tj_en": "", "rashi": "<b>מיד אחי מיד עשו.<\/b> מִיַּד אָחִי שֶׁאֵין נוֹהֵג עִמִּי כְאָח אֶלָּא כְעֵשָׂו הָרָשָׁע:", "rashi_en": "מיד אחי מיד עשו FROM THE HAND OF MY BROTHER, FROM THE HAND OF ESAU — from the hand of my brother who does not treat me as a brother should, but as Esau, the wicked. "}, {"ch": 32, "v": 13, "aliyah": 1, "heb": "וְאַתָּ֣ה אָמַ֔רְתָּ הֵיטֵ֥ב אֵיטִ֖יב עִמָּ֑ךְ וְשַׂמְתִּ֤י אֶֽת־זַרְעֲךָ֙ כְּח֣וֹל הַיָּ֔ם אֲשֶׁ֥ר לֹא־יִסָּפֵ֖ר מֵרֹֽב׃", "onk": "וְאַתְּ אֲמַרְתָּ אוֹטָבָא אוֹטֵיב עִמָּךְ וֶאֱשַׁוִּי יָת בְּנָךְ <b>סַגִּיאִין<\/b> כְּחַלָּא דְיַמָּא דִּי לָא יִתִּמְנוּן מִסַּגִּי:", "onk_en": "You have said, I will do very good with you, and I will make your offspring [<b>many<\/b>] like the sands of the sea, which are too numerous to count.", "pj": "וְאַנְתְּ אַבְטַחְתָּנִי אוֹטָבָא אוֹטֵב עִמָךְ וַאֲשַׁוֵי יַת בְּנָךְ סַגִיאִין הֵי כְּחָלָא דְיַמָא דְלָא מִתְמְנֵי מִסְגֵי", "pj_en": "But Thou hast promised, I will surely do thee good, and will make thy sons many as the sand of the sea be numbered for that cannot be numbered for multitude.", "tj": "", "tj_en": "", "rashi": "<b>היטב איטיב.<\/b> הֵיטֵב בִּזְכוּתְךָ, אֵיטִיב בִּזְכוּת אֲבוֹתֶיךָ (בראשית רבה):<br><br><b>ושמתי את זרעך כחול הים.<\/b> וְהֵיכָן אָ\"לֹ כֵן, וַהֲלֹא לֹא אָ\"לֹ אֶלָּא וְהָיָה זַרְעֲךָ כַּעֲפַר הָאָרֶץ (שם כ\"ח)? אֶלָּא שֶׁאָ\"לֹ כִּי לֹא אֶעֱזָבְךָ עַד אֲשֶׁר אִם עָשִׂיתִי אֵת אֲשֶׁר דִּבַּרְתִּי לָךְ (שם), וּלְאַבְרָהָם אָמַר וְהַרְבָּה אַרְבֶּה אֶת זַרְעֲךָ כְּכוֹכְבֵי הַשָּׁמַיִם וְכַחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם:", "rashi_en": "היטב איטיב I WILL SURELY DO [THEE] GOOD — The use of two words denoting “doing good” is intended to signify: היטב doing good to thee on account of your own merits, איטיב I will also do good to thee on account of your father’s merits (Genesis Rabbah 76:7).<br><br>ושמתי את זרעך כחול הים AND I WILL MAKE THY SEED AS THE SAND OF THE SEA — Where, indeed, did God promise him this? Did he not promise him only (Genesis 28:14) “And thy seed shall be as the dust of the earth\"? But the explanation is that He had at the same time promised him (Genesis 28:15) “for I will not leave thee until I have done that which I have spoken about thee”, and to Abraham he had promised (Genesis 22:17) “and I will greatly multiply thy seed as the stars of heaven and as the sand which is upon the seashore”. "}, {"ch": 32, "v": 14, "aliyah": 2, "heb": "וַיָּ֥לֶן שָׁ֖ם בַּלַּ֣יְלָה הַה֑וּא וַיִּקַּ֞ח מִן־הַבָּ֧א בְיָד֛וֹ מִנְחָ֖ה לְעֵשָׂ֥ו אָחִֽיו׃", "onk": "וּבָת תַּמָּן בְּלֵילְיָא הַהוּא וּנְסִיב מִן דְּאַיְתִי בִידֵיהּ תִּקְרֻבְתָּא לְעֵשָׂו אֲחוּהִי:", "onk_en": "He spent that night there. He took from that which comes into his hand, [for] a present to his brother, Eisov.", "pj": "וּבַת תַּמָן בְּלֵילְיָא הַהוּא וּנְסֵיב מִן דְאִזְדַמָן בִּידֵיהּ דוֹרוֹן לְעֵשָו אָחוֹי", "pj_en": "And he abode there that night; and he took what was ready at his hand a present for Esau his brother:", "tj": "", "tj_en": "", "rashi": "<b>הבא בידו.<\/b> בִּרְשׁוּתוֹ, וְכֵן וַיִּקַּח אֶת כָּל אַרְצוֹ מִיָּדוֹ (במדבר כ\"א). וּמִ\"אַ מִן הַבָּא בְיָדוֹ – אֲבָנִים טוֹבוֹת וּמַרְגָלִיּוֹת, שֶׁאָדָם צָר בִּצְרוֹר וְנוֹשְׂאָם בְּיָדוֹ (דָּ\"אַ מִן הַבָּא בְיָדוֹ, מִן הַחֻלִּין, שֶׁנָּטַל מַעֲשֵׂר, כְּמָה דְּאַתְּ אָמַר עַשֵּׂר אֲעַשְּׂרֶנּוּ לָךְ, וַהֲדַר לָקַח מִנְחָה):", "rashi_en": "הבא בידו AND TOOK OF THAT WHICH CAME TO HIS HAND (literally, in his hand) — in his possession, similar to (Numbers 21:26) “and he had taken all his land out of his possession (מידו).” A Midrashic explanation is: מן הבא בידו — precious stones and jewels which a person ties up in a package and carries in his hand. Another explanation is: מן הבא בידו THAT WHICH A MAN MAY TAKE INTO HIS OWN POSSESSION — of that which no longer has a sacred character — for he had set aside the tithe, just as you read (28:22) “[And Jacob vowed] … I will surely give the tenth unto Thee”. Only afterwards did he take the present of what was left after the tithe had been set aside, and this was that which he might rightly take into his own possession. "}, {"ch": 32, "v": 15, "aliyah": 2, "heb": "עִזִּ֣ים מָאתַ֔יִם וּתְיָשִׁ֖ים עֶשְׂרִ֑ים רְחֵלִ֥ים מָאתַ֖יִם וְאֵילִ֥ים עֶשְׂרִֽים׃", "onk": "עִזֵּי מָאתָן וּתְיָשַׁיָּא עֶסְרִין רְחֵלִין מָאתָן וְדִכְרִין עֶסְרִין:", "onk_en": "Two hundred female goats and twenty male goats, two hundred ewes and twenty rams.", "pj": "עִזֵי מָאתָן וּבַרְחֵי עַשְרִין רְחִילֵי מָאתָן וְדִיכְרֵי עַשְרִין", "pj_en": "she--goats two hundred, and he--goats twenty; ewes two hundred and rams twenty:", "tj": "", "tj_en": "", "rashi": "<b>עזים מאתים ותישים עשרים.<\/b> מָאתַיִם עִזִּים צְרִיכוֹת עֶשְׂרִים תְּיָשִׁים, וְכֵן כֻּלָּם, הַזְּכָרִים כְּדֵי צֹרֶךְ הַנְּקֵבוֹת; וּבִבְ\"רַ דּוֹרֵשׁ מִכָּאן לָעוֹנָה הָאֲמוּרָה בַּתּוֹרָה, הַטַּיָּלִים בְּכָל יוֹם, הַפּוֹעֲלִים שְׁתַּיִם בְּשַׁבָּת, הַחַמָּרִים אַחַת בְּשַׁבָּת, הַגַּמָּלִים אַחַת לִשְׁלֹשִׁים יוֹם, הַסַּפָּנִים אַחַת לְשִׁשָּׁה חֳדָשִׁים; וְאֵינִי יוֹדֵעַ לְכַוֵּן הַמִּדְרָשׁ הַזֶּה בְּכִוּוּן, אַךְ נִרְאֶה בְעֵינַי שֶׁלָּמַדְנוּ מִכָּאן שֶׁאֵין הָעוֹנָה שָׁוָה בְּכָל אָדָם אֶלָּא לְפִי טֹרַח הַמֻּטָּל עָלָיו, שֶׁמָּצִינוּ כָּאן שֶׁמָּסַר לְכָל תַּיִשׁ עֶשֶׂר עִזִּים וְכֵן לְכָל אַיִל; לְפִי שֶׁהֵם פְּנוּיִים מִמְּלָאכָה דַּרְכָּם לְהַרְבּוֹת תַּשְׁמִישׁ וּלְעַבֵּר עֶשֶׂר נְקֵבוֹת, וּבְהֵמָה מִשֶּׁנִּתְעַבְּרָה אֵינָהּ מְקַבֶּלֶת זָכָר, וּפָרִים שֶׁעוֹסְקִין בִּמְלָאכָה, לֹא מָסַר לְזָכָר אֶלָּא אַרְבַּע נְקֵבוֹת, וְלַחֲמוֹר שֶׁהוֹלֵךְ בְּדֶרֶךְ רְחוֹקָה שְׁתֵּי נְקֵבוֹת לְזָכָר, וְלַגְּמַלִּים שֶׁהוֹלְכִים דֶּרֶךְ יוֹתֵר רְחוֹקָה נְקֵבָה אַחַת לְזָכָר:", "rashi_en": "עזים מאתים ותישים עשרים TWO HUNDRED SHE GOATS AND TWENTY HE GOATS — Two hundred she goats have need of twenty he goats, and so too in the case of all the various species the males were in number according to the need of the females. In Genesis Rabbah 76:7 an inference is made from here as regards the minimum period imperative for the marital duty imposed by the Torah - [for] the men of leisure, every day; [for] the laborers, twice a week; [for] the donkey drivers, once a week; [for] the camel drivers, once in thirty days, [for] the sailors, once in six months. I am unable however to show exactly how this inference is arrived at. But it appears to me that we may learn from here at least that this period is not the same for every person, but that it depends upon the amount of labor imposed upon him by his occupation. As we have found here that ten she goats were given to each he goat, and so [too] to each ram; [as] since they are free from work, their way is to be frequently involved in sexual relations and to impregnate ten females - and once an animal becomes pregnant, it does not accept a male. And [concerning] the bulls that engage in work, it only gave four females to the male; and to the donkey who goes on long journeys, [it gave] two females to the male; and to the camels that go on [even] longer journeys, [it gave] one female to the male. "}, {"ch": 32, "v": 16, "aliyah": 2, "heb": "גְּמַלִּ֧ים מֵינִיק֛וֹת וּבְנֵיהֶ֖ם שְׁלֹשִׁ֑ים פָּר֤וֹת אַרְבָּעִים֙ וּפָרִ֣ים עֲשָׂרָ֔ה אֲתֹנֹ֣ת עֶשְׂרִ֔ים וַעְיָרִ֖ם עֲשָׂרָֽה׃", "onk": "גַּמְלֵי מֶנְקָתָא וּבְנֵיהוֹן תְּלָתִין תּוֹרְתָא אַרְבְּעִין וְתוֹרֵי עַסְרָא אַתְנָן עֶסְרִין וְעִירֵי עַסְרָא:", "onk_en": "Thirty nursing camels and their young, forty cows and ten bulls, twenty female donkeys and ten male donkeys.", "pj": "גַמְלַיָא נוּקְבָן עִם בְּנֵיהוֹן הֲווֹ תְּלָתִין תּוֹרַיְתָא אַרְבְּעִין וְתוֹרֵי עֲשָרָה אַתְנַיי עֶשְרִין וִילָדִין דַקִין עֲשָרָה", "pj_en": "milch camels with their young ones thirty; cows forty, and bulls ten, small colts ten.", "tj": "וַולְדִי דַקִין עַשְרָא:", "tj_en": "Arid small colts ten.", "rashi": "<b>גמלים מיניקות שלשים, ובניהם.<\/b> עִמָּהֶם: וּמִ\"אַ: וּבְנֵיהֶם – בַּנָּאֵיהֶם, זָכָר כְּנֶגֶד נְקֵבָה, וּלְפִי שֶׁצָּנוּעַ בְּתַשְׁמִישׁ לֹא פִרְסְמוֹ הַכָּתוּב (בראשית רבה):<br><br><b>ועירם.<\/b> חֲמוֹרִים זְכָרִים:", "rashi_en": "גמלים מיניקות MILCH CAMELS שלשים THIRTY, ובניהם means AND THEIR COLTS with them — A Midrashic explanation of ובניהם is that it is the same as וּבַנָּאֵיהֶם their builders (those that build them up) i.e., one male for each female. Because, however, it (the camel) is chaste in its ways Scripture does not state this plainly (Genesis Rabbah 76:7) but employs a term from which it may be inferred.<br><br>ועירים means MALE ASSES."}, {"ch": 32, "v": 17, "aliyah": 2, "heb": "וַיִּתֵּן֙ בְּיַד־עֲבָדָ֔יו עֵ֥דֶר עֵ֖דֶר לְבַדּ֑וֹ וַיֹּ֤אמֶר אֶל־עֲבָדָיו֙ עִבְר֣וּ לְפָנַ֔י וְרֶ֣וַח תָּשִׂ֔ימוּ בֵּ֥ין עֵ֖דֶר וּבֵ֥ין עֵֽדֶר׃", "onk": "וִיהַב בְּיַד עַבְדּוֹהִי עֶדְרָא עֶדְרָא בִּלְחוֹדוֹהִי וַאֲמַר לְעַבְדּוֹהִי עִבָּרוּ קֳדָמַי וּרְוָחָא תְּשַׁוּוּן בֵּין עֶדְרָא וּבֵין עֶדְרָא:", "onk_en": "He placed them in the hand of his servants, each herd by itself. He said to his servants, Pass on ahead of me, and keep a space between each herd.", "pj": "וְזַמִין בְּיַד עַבְדוֹי עֶדְרָא עֶדְרָא בִּלְחוֹדוֹי וְאָמַר לְעַבְדוֹי עִבְרוּ קֳדָמַי וְנִיפַשׁ תְּשַׁווּן בֵּינֵי עֶדְרָא וּבֵינֵי עֶדְרָא", "pj_en": "And he made them ready by the hand of his servants in flocks apart, and said to his servants, Pass over before me, and put much (room) between flock and flock.", "tj": "", "tj_en": "", "rashi": "<b>עדר עדר לבדו.<\/b> כָּל מִין וָמִין לְעַצְמוֹ:<br><br><b>עברו לפני.<\/b> דֶּרֶךְ יוֹם אוֹ פָּחוֹת וַאֲנִי אָבֹא אַחֲרֵיכֶם:<br><br><b>ורוח תשימו.<\/b> עֵדֶר לִפְנֵי חֲבֵרוֹ מְלֹא עַיִן, כְּדֵי לְהַשְׂבִּיעַ עֵינוֹ שֶׁל אוֹתוֹ רָשָׁע וּלְתַוֵּהוּ עַל רִבּוּי הַדּוֹרוֹן:", "rashi_en": "עדר עדר לבדו EVERY DROVE BY ITSELF — each species forming a drove by itself.<br><br>עברו לפני PASS ON BEFORE ME, a day’s journey or less and I shall follow you).<br><br>ורוח תשימו AND PUT A SPACE — one drove before the other at a distance as far as the eye can see, in order to satisfy the eye (the cupidity) of that wicked man and to amaze him by the size of the gift (Genesis Rabbah 76:8). "}, {"ch": 32, "v": 18, "aliyah": 2, "heb": "וַיְצַ֥ו אֶת־הָרִאשׁ֖וֹן לֵאמֹ֑ר כִּ֣י יִֽפְגׇשְׁךָ֞ עֵשָׂ֣ו אָחִ֗י וּשְׁאֵֽלְךָ֙ לֵאמֹ֔ר לְמִי־אַ֙תָּה֙ וְאָ֣נָה תֵלֵ֔ךְ וּלְמִ֖י אֵ֥לֶּה לְפָנֶֽיךָ׃", "onk": "וּפַקֵּיד יָת קַדְמָאָה לְמֵימָר אֲרֵי יְעַרְעִנָּךְ עֵשָׂו אָחִי וּשְׁאֵלִנָּךְ לְמֵימָר לְמָן אַתְּ וּלְאָן אַתְּ אָזֵל וּלְמָן אִלֵּין דִּקֳדָמָךְ:", "onk_en": "He commanded the first one, saying, When my brother, Eisov meets you and asks you saying, To whom do you belong, and where are you going; and who is the owner of this that is before you?", "pj": "וּפַקֵיד יַת קַמָא לְמֵימַר אֲרוּם יְעַרְעִינָךְ עֵשָו אָחִי וְיִבְעִי מִינָךְ לְמֵימַר דְמַאן אַנְתְּ וּלְאָן אַנְתְּ מְטַיֵיל וּלְמָאן אִילֵין דְקֳדָמָךְ", "pj_en": "And he instructed the first, Saying, When Esau my brother shall meet thee, and ask of thee, saying, Whose art thou, and whither art thou journeying and whose are these before thee?", "tj": "", "tj_en": "", "rashi": "<b>למי אתה.<\/b> שֶׁל מִי אַתָּה, מִי שׁוֹלְחֲךָ, וְתַרְגּוּם דְּמָאן אַתְּ?<br><br><b>ולמי אלה לפניך.<\/b> וְאֵלֶּה שֶׁלְּפָנֶיךָ שֶׁל מִי הֵם; לְמִי הַמִּנְחָה הַזֹּאת שְׁלוּחָה? לָמֶ\"ד מְשַׁמֶּשֶׁת בְּרֹאשׁ הַתֵּבָה בִּמְקוֹם שֶׁל, כְּמוֹ: וְכֹל אֲשֶׁר אַתָּה רֹאֶה לִי הוּא (בראשית ל״א:מ״ג) – שֶׁלִּי הוּא; לַה' הָאָרֶץ וּמְלוֹאָהּ (תהילים כ\"ד) – שֶׁל ה':", "rashi_en": "למי אתה means TO WHOM DO YOU BELONG, implying who has sent thee? The Targum should be דמאן את “of whom are you” and not למאן את as some editions have.<br><br>ולמי אלה לפניך means and these which are before you whose are they; i.e. to whom is this present being sent? The letter ל is used as a prefix in place of של “belonging to”; e.g., (31:43) “and all that thou seest is mine (לי)” i.e. belongs to me; (Psalms 24:1) “The earth is the Lord’s (לה') and the fullness thereof” i.e. belongs to the Lord. "}, {"ch": 32, "v": 19, "aliyah": 2, "heb": "וְאָֽמַרְתָּ֙ לְעַבְדְּךָ֣ לְיַעֲקֹ֔ב מִנְחָ֥ה הִוא֙ שְׁלוּחָ֔ה לַֽאדֹנִ֖י לְעֵשָׂ֑ו וְהִנֵּ֥ה גַם־ה֖וּא אַחֲרֵֽינוּ׃", "onk": "וְתֵימַר לְעַבְדָּךְ לְיַעֲקֹב תִּקְרֻבְתָּא הִיא דִּמְשַׁלְּחָא לְרִבּוֹנִי לְעֵשָׂו וְהָא אַף הוּא <b>אָתֵי<\/b> בַתְרָנָא:", "onk_en": "You should [then] say, [They belong] to your servant, Yaakov. It is a present sent to my master, Eisov, and see, he is also [<b>coming<\/b>] behind us.", "pj": "וְתֵימַר לְעַבְדָךְ לְיַעֲקב דוֹרוֹן הוּא דְמִשְׁתַּלְחָא לְרִבּוֹנִי לְעֵשָו וְהָא אוּף הוּא אָתֵי בַּתְרָן", "pj_en": "Thou shalt say it is a gift of thy servant Jakob, which he sends to my lord Esau, and, behold, he also cometh after us.", "tj": "", "tj_en": "", "rashi": "<b>ואמרת לעבדך ליעקב.<\/b> עַל רִאשׁוֹן רִאשׁוֹן וְעַל אַחֲרוֹן אַחֲרוֹן; שֶׁשָּׁאַלְתָּ לְמִי אַתָּה? לְעַבְדְּךָ לְיַעֲקֹב אֲנִי – וְתַרְגּוּמוֹ דְּעַבְדָּךְ דְּיַעֲקֹב – וְשֶׁשָּׁאַלְתָּ וּלְמִי אֵלֶּה לְפָנֶיךָ, מִנְחָה הִיא שְׁלוּחָה וְגוֹ':<br><br><b>והנה גם הוא.<\/b> יַעֲקֹב:", "rashi_en": "ואמרת לעבדך ליעקב THEN SHALT THOU SAY THEY ARE THY SERVANT JACOB’S — You shall answer the first question first and the last question last, saying :”In reply to what you have asked”, “Whose art thou?”, “I belong to thy servant Jacob” — and it should be rendered in the Targum דעבדך דיעקב belonging to your servant, belonging to Jacob” —and in reply to what you have asked, “And whose are these before thee?” “It is a present sent etc.”<br><br>והנה גם הוא AND, BEHOLD, ALSO HE IS BEHIND US — The word “he” refers to Jacob."}, {"ch": 32, "v": 20, "aliyah": 2, "heb": "וַיְצַ֞ו גַּ֣ם אֶת־הַשֵּׁנִ֗י גַּ֚ם אֶת־הַשְּׁלִישִׁ֔י גַּ֚ם אֶת־כׇּל־הַהֹ֣לְכִ֔ים אַחֲרֵ֥י הָעֲדָרִ֖ים לֵאמֹ֑ר כַּדָּבָ֤ר הַזֶּה֙ תְּדַבְּר֣וּן אֶל־עֵשָׂ֔ו בְּמֹצַאֲכֶ֖ם אֹתֽוֹ׃", "onk": "וּפַקִּיד אַף יָת תִּנְיָנָא אַף יָת תְּלִיתָאָה אַף יָת כָּל דְּאָזְלִין בָּתַר עֲדָרַיָּא לְמֵימָר כְּפִתְגָּמָא הָדֵין תְּמַלְּלוּן עִם עֵשָׂו כַּד תַּשְׁכְּחוּן יָתֵיהּ:", "onk_en": "He also commanded the second and also the third, and to all who followed after the herds, saying, In like manner must you speak to Eisov when you find [meet] him.", "pj": "וּפְקִיד אוּף יַת תִּנְיַן אוּף יַת תְּלִיתָאֵי אוּף יַת כָּל דְאָזְלִין בָּתַר עֶדְרַיָא לְמֵימַר כְּפִיתְגָמָא הָדֵין תְּמַלְלוּן עִם עֵשָו כַּד תִּשְׁכְּחוּן יָתֵיהּ", "pj_en": "And so he instructed the second, and the third, and all them who followed the flock, saying According to these words You must speak with Esau when you find him,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 21, "aliyah": 2, "heb": "וַאֲמַרְתֶּ֕ם גַּ֗ם הִנֵּ֛ה עַבְדְּךָ֥ יַעֲקֹ֖ב אַחֲרֵ֑ינוּ כִּֽי־אָמַ֞ר אֲכַפְּרָ֣ה פָנָ֗יו בַּמִּנְחָה֙ הַהֹלֶ֣כֶת לְפָנָ֔י וְאַחֲרֵי־כֵן֙ אֶרְאֶ֣ה פָנָ֔יו אוּלַ֖י יִשָּׂ֥א פָנָֽי׃", "onk": "וְתֵימְרוּן אַף הָא עַבְדָּךְ יַעֲקֹב <b>אָתֵי<\/b> בַתְרָנָא אֲרֵי אֲמַר <b>אַנְחִנֵּיהּ לְרוּגְזֵיהּ<\/b> בְּתִקְרֻבְתָּא דְּאָזְלַת לָקֳדָמַי וּבָתַר כֵּן אֶחֱזֵי אַפּוֹהִי מָאִים יִסַּב אַפָּי:", "onk_en": "You should also say, See, your servant Yaakov is [<b>coming<\/b>] behind us. For he said, I will appease him [<b>quieten his anger<\/b>] with the present that goes before me, and afterwards I will see his face, perhaps he will forgive me.", "pj": "וְתֵימְרוּן אוּף הָא עַבְדָךְ יַעֲקב אָתֵי בַּתְרָנָא אֲרוּם אָמַר נַרְעֵי יַת סְבַר אַפּוֹי בְּדוֹרָנָא דִמְהַלְכָא קֳדָמַי וּמִבָּתַר כֵּן נֶחֱמֵי אַנְפּוֹי הַלְוַאי יִסְבַּר לִי אַפִּין", "pj_en": "and say, And, behold, thy servant Jakob also cometh after us. For he said, I will make his countenance friendly by the gift which goeth before me, and afterward will see his face: peradventure he may accept me.", "tj": "", "tj_en": "", "rashi": "<b>אכפרה פניו.<\/b> אֲבַטֵּל רָגְזוֹ; וְכֵן וְכֻפַּר בְּרִיתְכֶם אֶת מָוֶת (ישעיהו כ\"ח), לֹא תוּכְלִי כַּפְּרָהּ (שם מ\"ז). וְנִרְאֶה בְעֵינַי שֶׁכָּל כַּפָּרָה שֶׁאֵצֶל עָוֹן וְחֵטְא וְאֵצֶל פָּנִים כֻּלָּן לְשׁוֹן קִנּוּחַ וְהַעֲבָרָה הֵן, וְלָשׁוֹן אֲרַמִּי הוּא, וְהַרְבֵּה בַּתַּלְמוּד וְכַפֵּר יְדֵיהּ, בָּעֵי לְכַפּוּרֵי יְדֵי בְּהַהוּא גַבְרָא, וְגַם בִּלְשׁוֹן הַמִּקְרָא נִקְרָאִים הַמִּזְרָקִים שֶׁל קֹדֶשׁ כְּפוֹרֵי זָהָב (עזרא א'), עַל שֵׁם שֶׁהַכֹּהֵן מְקַנֵּחַ יָדָיו בָּהֶן בִּשְׂפַת הַמִּזְרָק:", "rashi_en": "אכפרה פניו I WILL APPEASE HIM — I will remove his anger. Similarly, (Isaiah 28:18) \"and your covenant with death shall be annulled (וכפר)”; (Isaiah  47:11) “Thou shalt not be able to put it away (וכפרה”. I am of the opinion that wherever the verb כפר is used in association with iniquity and sin and in association with anger (פנים), it always signifies wiping away, removing. It is an Aramaic expression occurring frequently in the Talmud: “He wiped his hand off (כפר ידיה)”, and (Gittin 56a) ‘‘he wants to wipe (לכפורי) his hands off on this man” (i.e. he desires to put the responsibility upon me). In Biblical Hebrew, also, the bowls of the Sanctuary are called, (Ezra 1:10) \"כפורי of gold” — and they are so called because the priest wiped his hands on them — on the rim of the bowl (Zevachim 93b). "}, {"ch": 32, "v": 22, "aliyah": 2, "heb": "וַתַּעֲבֹ֥ר הַמִּנְחָ֖ה עַל־פָּנָ֑יו וְה֛וּא לָ֥ן בַּלַּֽיְלָה־הַה֖וּא בַּֽמַּחֲנֶֽה׃", "onk": "וַעֲבָרַת תִּקְרֻבְתָּא עַל אַפּוֹהִי וְהוּא בָת בְּלֵילְיָא הַהוּא בְּמַשְׁרִיתָא:", "onk_en": "The present passed on ahead of him, but he spent the night in the camp.", "pj": "וַעֲבָרַת דוֹרוֹנָא עַל אַנְפּוֹהִי וְהוּא בָּת בְּלֵילְיָא הַהוּא בְּמַשְׁרִיתָא", "pj_en": "And the present passed over before him, and he abode that night in the camp.", "tj": "", "tj_en": "", "rashi": "<b>על פניו.<\/b> כְּמוֹ לְפָנָיו, וְכֵן חָמָס וָשֹׁד יִשָּׁמַע בָּהּ עַל פָּנַי תָּמִיד (ירמיהו ו'), וְכֵן הַמַּכְעִסִים אֹתִי עַל פָּנַי (ישעיהו ס\"ה); וּמִ\"אַ עַל פָּנָיו, אַף הוּא שָׁרוּי בְּכַעַס, שֶׁהָיָה צָרִיךְ לְכָל זֶה (בראשית רבה):", "rashi_en": "The Midrash connects the word פניו in על פניו with פנים anger — he (Jacob) was also in an angry mood that it should be necessary for him to do all this (Genesis Rabbah 76:8). "}, {"ch": 32, "v": 23, "aliyah": 2, "heb": "וַיָּ֣קׇם&thinsp;<b>׀<\/b> בַּלַּ֣יְלָה ה֗וּא וַיִּקַּ֞ח אֶת־שְׁתֵּ֤י נָשָׁיו֙ וְאֶת־שְׁתֵּ֣י שִׁפְחֹתָ֔יו וְאֶת־אַחַ֥ד עָשָׂ֖ר יְלָדָ֑יו וַֽיַּעֲבֹ֔ר אֵ֖ת מַעֲבַ֥ר יַבֹּֽק׃", "onk": "וְקָם בְּלֵילְיָא הוּא וּדְבַר יָת תַּרְתֵּין נְשׁוֹהִי וְיָת תַּרְתֵּין <b>לְחֵינָתֵיהּ<\/b> וְיָת חַד עֲסַר בְּנוֹהִי וַעֲבַר יָת מַעֲבַר יוּבְקָא:", "onk_en": "He got up that night and took his two wives, his two handmaids [<b>concubines<\/b>], and his eleven children, and crossed over the ford of the Yabbok [River].", "pj": "וְקָם בְּלֵילְיָא הוּא וּדְבַר יַת תַּרְתֵּין נְשׁוֹי וְיַת תַּרְתֵּין לְחֵינָתוֹי וְיַת חַדְסְרֵי רִבוֹי וַעֲבַר יַת מְגִיזַת יוּבְקָא", "pj_en": "And he arose in the night and took his two wives, and his two concubines, and eleven children, and went over the ford Jubeka.", "tj": "", "tj_en": "", "rashi": "<b>ואת אחד עשר ילדיו.<\/b> וְדִינָה הֵיכָן הָיְתָה? נְתָנָהּ בְּתֵבָה וְנָעַל בְּפָנֶיהָ, שֶׁלֹּא יִתֵּן בָּהּ עֵשָׂו עֵינָיו, וּלְכָךְ נֶעֱנַשׁ יַעֲקֹב שֶׁמְּנָעָהּ מֵאָחִיו, שֶׁמָּא תַּחֲזִירֶנּוּ לַמּוּטָב, וְנָפְלָה בְּיַד שְׁכֶם (בראשית רבה):<br><br><b>יבק.<\/b> שֵׁם הַנָּהָר:", "rashi_en": "ואת אחד עשר ילדיו AND HIS ELEVEN CHILDREN — But where was Dinah? He placed her in a chest and locked her in so that Esau should not set his fancy upon her (desire to marry her).  On this account Jacob was punished — because he had kept her away from his brother for she might have led him back to the right path; she therefore fell into the power of Shechem (Genesis Rabbah 76:9).<br><br>יבק JABBOK — the name of the river. "}, {"ch": 32, "v": 24, "aliyah": 2, "heb": "וַיִּ֨קָּחֵ֔ם וַיַּֽעֲבִרֵ֖ם אֶת־הַנָּ֑חַל וַֽיַּעֲבֵ֖ר אֶת־אֲשֶׁר־לֽוֹ׃", "onk": "וּדְבָרִנּוּן וְעַבָּרִנּוּן יָת נַחְלָא וְאַעְבַּר יָת דִּילֵיהּ:", "onk_en": "He [then] took them and crossed them over the stream. He [also] brought over all that he possessed.", "pj": "וְדַבָּרִינוּן וַעֲבָרִינוּן יַת נַחְלָא וַעֲבַר יַת דִילֵיהּ", "pj_en": "And taking them he made them pass over the torrent, and all that he had went over.", "tj": "", "tj_en": "", "rashi": "<b>את אשר לו.<\/b> הַבְּהֵמָה וְהַמִּטַּלְטְלִים; עָשָׂה עַצְמוֹ כְּגַשָּׁר נוֹטֵל מִכָּאן וּמַנִּיחַ כָּאן (בראשית רבה):", "rashi_en": "את אשר לו [HE MADE PASS] THAT WHICH WAS HIS — the cattle and movables. He acted as a ferry-man taking them from one side and setting them down on the other. "}, {"ch": 32, "v": 25, "aliyah": 2, "heb": "וַיִּוָּתֵ֥ר יַעֲקֹ֖ב לְבַדּ֑וֹ וַיֵּאָבֵ֥ק אִישׁ֙ עִמּ֔וֹ עַ֖ד עֲל֥וֹת הַשָּֽׁחַר׃", "onk": "וְאִשְׁתָּאַר יַעֲקֹב בִּלְחוֹדוֹהִי וְאִשְׁתַּדֵּל גַּבְרָא עִמֵּיהּ עַד דִּסְלֵק צַפְרָא:", "onk_en": "Yaakov remained alone, and a man wrestled with him until daybreak.", "pj": "וְאִשְׁתְּאַר יַעֲקב בִּלְחוֹדוֹי מֵעִיבְרָא לְיוּבְקָא וְאִתְבַּחַשׁ מַלְאָכָא עִמֵיהּ כִּדְמוּת גְבַר וְאָמַר הֲלָא אָמַרְתָּ לְעַשְרָא כָּל דִילָךְ וְהָא אִית לָךְ תְּרֵיסַר בְּנִין וּבְרַתָּא חֲדָא וְלָא עֲשַרְתִּינוּן מִן יַד אַפְרַשׁ אַרְבַּע בּוּכְרִין לְאַרְבַּע אִימְהָתָא וְאִשְׁתַּיָירוּ תְּמַנְיָא וְתַנָא לְמִמְנֵי מִשִׁמְעוֹן וְסַלִיק לֵוִי בִּמְעַשְרָא עָנֵי מִיכָאֵל וַאֲמַר רִבּוֹנֵיהּ דְעַלְמָא דֵין הוּא עַדְבָךְ וְעַל עֵיסַק פִּתְגָמַיָא הָאִילֵין אִשְׁתְּהִי מִן הָאֵל לְנַחֲלָא עַד מֵיסַק עַמוֹד קְרִיצְתָּא", "pj_en": "And Jakob remained alone beyond the Jubeka; and an Angel contended with him in the likeness of a man. And he said, Hast thou not promised to give the tenth of all that is thine? And, behold, thou hast ten sons and one daughter: nevertheless thou hast not tithed them. Immediately he set apart the four firstborn of the four mothers, and there remained eight. And he began to number from Shimeon, and Levi came up for the tenth. Michael answered and said, Lord of the world, this is Thy lot. And on account of these things he (Michael) remained from God at the torrent till the column of the morning was ascending.", "tj": "", "tj_en": "", "rashi": "<b>ויותר יעקב.<\/b> שָׁכַח פַּכִּים קְטַנִּים וְחָזַר עֲלֵיהֶם (חולין צ\"א):<br><br><b>ויאבק איש.<\/b> מְנַחֵם פֵּי' וַיִּתְעַפֵּר אִישׁ, לְשׁוֹן אָבָק, שֶׁהָיוּ מַעֲלִים עָפָר בְּרַגְלֵיהֶם עַ\"י נִעְנוּעָם. וְלִי נִרְאֶה שֶׁהוּא לְשׁוֹן וַיִּתְקַשֵּׁר, וְלָשׁוֹן אֲרַמִּי הוּא, בָּתַר דַּאֲבִיקוּ בֵיהּ, וַאֲבֵיק לֵיהּ מֵיבַק – לְשׁוֹן עֲנִיבָה, שֶׁכֵּן דֶּרֶךְ שְׁנַיִם שֶׁמִּתְעַצְּמִים לְהַפִּיל אִישׁ אֶת רֵעֵהוּ, שֶׁחוֹבְקוֹ וְאוֹבְקוֹ בִּזְרוֹעוֹתָיו. וּפֵרְשׁוּ רַזִ\"לִ שֶׁהוּא שָׂרוֹ שֶׁל עֵשָׂו (בראשית רבה):", "rashi_en": "ויותר יעקב AND JACOB WAS LEFT ALONE — He had forgotten some small jars and he returned for them (Chullin 91a).<br><br>ויאבק איש AND A MAN WRESTLED — Menachem (ben Seruk) explains: “a man covered himself with dust”, taking the verb as connected in sense with אבק “dust”. It would mean that they were raising the dust with their feet through their movements. I, however, am of opinion that it means “he fastened himself on”, and that it is an Aramaic word, as (Sanhedrin 63b) “after they have joined (אביקו) it\", and (Menachot 42a) “and he twined (the “Fringes”) with loops”. It denotes “intertwining”, for such is the manner of two people who make strong efforts to throw each other — one clasps the other and twines himself round him with his arms. Our Rabbis of blessed memory explained that he was Esau’s guardian angel (Genesis Rabbah 77:3). "}, {"ch": 32, "v": 26, "aliyah": 2, "heb": "וַיַּ֗רְא כִּ֣י לֹ֤א יָכֹל֙ ל֔וֹ וַיִּגַּ֖ע בְּכַף־יְרֵכ֑וֹ וַתֵּ֙קַע֙ כַּף־יֶ֣רֶךְ יַעֲקֹ֔ב בְּהֵאָֽבְק֖וֹ עִמּֽוֹ׃", "onk": "וַחֲזָא אֲרֵי לָא יָכִיל לֵיהּ וּקְרֵיב בִּ<b>פְתֵי<\/b> יַרְכֵּיהּ וְזָע <b>פְּתֵי<\/b> יַרְכָּא דְיַעֲקֹב בְּאִשְׁתַּדָּלוּתֵיהּ עִמֵּיהּ:", "onk_en": "He [the man] saw that he could not defeat him, and he struck the socket [<b>girth<\/b>] of his hip. [<b>The girth of<\/b>] Yaakov’s hip joint was dislocated as he wrestled with him.", "pj": "וַחֲמָא אֲרֵי לָא הֲוָה לֵיהּ רְשׁוּ לְאַבְאָשָׁא לֵיהּ וְקָרֵיב בִּפְּתֵי יַרְכֵיהּ וְזַעְזָא פְּתֵי יַרְכָא דְיַעֲקב בְּאִיתְבַּחְשׁוּתֵיהּ עִמֵיהּ", "pj_en": "And he saw that he had not power to hurt him, and he touched the hollow of his thigh, and the hollow of Jakob's thigh was distorted in his contending with him.", "tj": "וְקַהַת כַּף יַרְכֵיהּ דְיַעֲקב בְּשַׁדְרוּתֵיהּ עִמֵיהּ:", "tj_en": "And the hollow of Jakob's thigh was displaced in contending with him.", "rashi": "<b>ויגע בכף ירכו.<\/b> קוּלִית הַיָּרֵךְ הַתָּקוּעַ בְּקַּלְבּוּסִית קָרוּי כַּף, עַ\"שֵׁ שֶׁהַבָּשָׂר שֶׁעָלֶיהָ כְּמִין כַּף שֶׁל קְדֵרָה:<br><br><b>ותקע.<\/b> נִתְקַעְקְעָה מִמְּקוֹם מַחְבַּרְתָּהּ, וְדוֹמֶה לוֹ פֶּן תֵּקַע נַפְשִׁי מִמֵּךְ (ירמיהו ו'), לְשׁוֹן הֲסָרָה. וּבְמִשְׁנָה לְקַעְקֵעַ בֵּיצָתָן – לְשָׁרֵשׁ שָׁרְשֵׁיהֶן:", "rashi_en": "ויגע בכף ירכו HE TOUCHED THE HOLLOW OF HIS THIGH — The upper thigh-bone that is sunk in the hip is called כף because the flesh on it (on this bone) has the form of the hollow part of a pot-ladle (כף).<br><br>ותקע AND WAS STRAINED — It was violently torn from its joint. Similar in meaning is (Jeremiah 6:8) “Lest My soul be alienated (תקע) from thee” — i.e. removed from thee; and in the Mishna, לקעקע בצתם, which means to remove violently (לשרש) their roots. "}, {"ch": 32, "v": 27, "aliyah": 2, "heb": "וַיֹּ֣אמֶר שַׁלְּחֵ֔נִי כִּ֥י עָלָ֖ה הַשָּׁ֑חַר וַיֹּ֙אמֶר֙ לֹ֣א אֲשַֽׁלֵּחֲךָ֔ כִּ֖י אִם־בֵּרַכְתָּֽנִי׃", "onk": "וַאֲמַר שַׁלְּחַנִי אֲרֵי סְלִיק צַפְרָא וַאֲמַר לָא אֲשַׁלְּחִנָּךְ אֶלָּהֵין בֵּרַכְתָּנִי:", "onk_en": "He [the man] said, Let me go, for the dawn is breaking. He [Yaakov] said, I will not let you go unless you bless me.", "pj": "וַאֲמַר שַׁדְרַנִי אֲרוּם סַלִיק עַמוּד קְרִיצְתָּא וּמָטָא שַׁעְתָּא דְמַלְאֲכֵי מְרוֹמָא מְשַׁבְּחִין לְמָרֵי עַלְמָא וַאֲנָא חַד מִן מַלְאָכַיָא מְשַׁבְּחַיָיא וּמִיוֹמָא דְאִיתְבְּרִי עַלְמָא לָא מָטָא זִמְנִי לִמְשַׁבְּחָא אֱלָהֵן הָדָא זִמְנָא וַאֲמַר לֵית אֲנָא מְשַׁדֵר יָתָךְ אֱלָהֵן בֵּירַכְתְּ יָתִי", "pj_en": "And he said, Let me go, for the column of the morning ascendeth; and the hour cometh when the angels on high offer praise to the Lord of the world: and I am one of the angels of praise, but from the day that the world was created my time to praise hath not come until now. And he said, I will not let thee go, until thou bless me.", "tj": "וַאֲמַר שְׁלַח יָתִי אֲרוּם סַלִיק עַמוּד שַׁחְרָא וְהָא מָטָא שַׁעַתְהוֹן דְמַלְאָכַיָא לְמִשְׁבְּחָא וַאֲמַר לָא אֲשַׁלֵחַ יָתָךְ אֶלָא הֵן בָּרִיכַת יָתִי:", "tj_en": "And he said, Send me away, for the column of the dawn ariseth, and, behold, the hour cometh for the angels to praise. And he said, I will not release thee until thou bless me.", "rashi": "<b>כי עלה השחר.<\/b> וְצָרִיךְ אֲנִי לוֹמַר שִׁירָה בַּיּוֹם (חולין צ\"א):<br><br><b>ברכתני.<\/b> הוֹדֵה לִי עַל הַבְּרָכוֹת שֶׁבֵּרְכַנִי אָבִי, שֶׁעֵשָׂו מְעַרְעֵר עֲלֵיהֶן:", "rashi_en": "כי עלה השחר FOR THE DAY BREAKETH, and I have to sing God’s praise at day (Chullin 91b; Genesis Rabbah 78:1).<br><br>ברכתני [EXCEPT] THOU BLESS ME — admit my right to the blessings which my father gave me and to which Esau lays claim."}, {"ch": 32, "v": 28, "aliyah": 2, "heb": "וַיֹּ֥אמֶר אֵלָ֖יו מַה־שְּׁמֶ֑ךָ וַיֹּ֖אמֶר יַעֲקֹֽב׃", "onk": "וַאֲמַר לֵיהּ מָה שְׁמָךְ וַאֲמַר יַעֲקֹב:", "onk_en": "He [the man] said to him, What is your name? And he replied, Yaakov.", "pj": "וַאֲמַר לֵיהּ מַה שְׁמָךְ וַאֲמַר יַעֲקב", "pj_en": "And he said, What is thy name? He answered, Jakob.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 29, "aliyah": 2, "heb": "וַיֹּ֗אמֶר לֹ֤א יַעֲקֹב֙ יֵאָמֵ֥ר עוֹד֙ שִׁמְךָ֔ כִּ֖י אִם־יִשְׂרָאֵ֑ל כִּֽי־שָׂרִ֧יתָ עִם־אֱלֹהִ֛ים וְעִם־אֲנָשִׁ֖ים וַתּוּכָֽל׃", "onk": "וַאֲמַר לָא יַעֲקֹב יִתְאֲמַר עוֹד שְׁמָךְ אֶלָּהֵין יִשְׂרָאֵל אֲרֵי <b>רַבְרְבַת קֳדָם יְיָ<\/b> וְעִם גוּבְרַיָּא וִיכָלְתָּא:", "onk_en": "He [the man] said, No longer will your name be spoken of as Yaakov, but as Yisrael, for you have contended with God[ly beings] [<b>are great before God<\/b>] and with men, and you have won.", "pj": "וַאֲמַר לָא יַעֲקב אִיתְאַמַר עוֹד שְׁמָךְ אֱלָהֵן יִשְרָאֵל אֲרוּם אִתְרַבְרַבְתְּ עִם מַלְאָכַיָא דַיְיָ וְעִם גוּבְרַיָא וִיְכָלְתְּ לְהוֹם", "pj_en": "And he said, Thy name shall be no more called Jakob but Israel, because thou art magnified with the angels of the Lord and with the mighty, and thou hast prevailed with them.", "tj": "", "tj_en": "", "rashi": "<b>לא יעקב.<\/b> לֹא יֵאָמֵר עוֹד שֶׁהַבְּרָכוֹת בָּאוּ לְךָ בְעָקְבָּה וּרְמִיָּה כִּי אִם בִשְׂרָרָה וְגִלּוּי פָּנִים, וְסוֹפְךָ שֶׁהַקָּבָּ\"ה נִגְלֶה אֵלֶיךָ בְּבֵית אֵל וּמַחֲלִיף שִׁמְךָ וְשָׁם הוּא מְבָרֶכְךָ, וַאֲנִי שָׁם אֶהְיֶה וְאוֹדֶה לְךָ עֲלֵיהֶן, וְזֶה שֶׁכָּתוּב וַיָּשַׂר אֶל מַלְאָךְ וַיֻּכָל בָּכָה וַיִּתְחַנֶּן לוֹ (הושע י\"ב) – בָּכָה הַמַּלְאָךְ וַיִּתְחַנֶּן לוֹ, וּמַה נִּתְחַנֵּן לוֹ? בֵּית אֵל יִמְצָאֶנּוּ וְשָׁם יְדַבֵּר עִמָּנוּ, הַמְתֵּן לִי עַד שֶׁיְּדַבֵּר עִמָּנוּ שָׁם; וְלֹא רָצָה יַעֲקֹב, וְעַל כָּרְחוֹ הוֹדָה לוֹ עֲלֵיהֶן, וְזֶהוּ וַיְבָרֶךְ אֹתוֹ שָׁם, שֶׁהָיָה מִתְחַנֵּן לְהַמְתִּין לוֹ וְלֹא רָצָה:<br><br><b>ועם אנשים.<\/b> עֵשָׂו וְלָבָן:<br><br><b>ותוכל.<\/b> לָהֶם:", "rashi_en": "לא יעקב [THY NAME SHALL] NO MORE BE CALLED JACOB [BUT ISRAEL] (literally, “not Jacob — supplanting — shall any more be said to thee”) — It shall no longer be said that the blessings came to you through supplanting and subtlety but through noble conduct (שררה) and in an open manner. Because later on the Holy One, blessed be He, will reveal Himself to you at Bethel and will change your name. There He will bless you, and I shall be there and admit your right to them (the blessings). It is to this that the passage refers (Hosea 12:5), “And he strove with an angel and prevailed; he wept and made supplication unto him” — it means the angel wept and made supplication unto him (Jacob). What was the subject of his supplication? This is stated in the next verse: “At Bethel He will meet us and there He will speak with us — implying the request. “Wait until he will speak with us there, and then I will admit your right to the blessings.” Jacob, however, would not agree to this, and against his own wish he had to admit his right to the blessings. That is what is meant when it states (v. 30) “And he declared him blessed there”, that he begged him to wait and he did not agree to do so (cp. Genesis Rabbah 78:2). <br><br>ועם אנשים AND WITH MEN —Esau and Laban.<br><br>ותוכל AND HAST PREVAILED over them."}, {"ch": 32, "v": 30, "aliyah": 2, "heb": "וַיִּשְׁאַ֣ל יַעֲקֹ֗ב וַיֹּ֙אמֶר֙ הַגִּֽידָה־נָּ֣א שְׁמֶ֔ךָ וַיֹּ֕אמֶר לָ֥מָּה זֶּ֖ה תִּשְׁאַ֣ל לִשְׁמִ֑י וַיְבָ֥רֶךְ אֹת֖וֹ שָֽׁם׃", "onk": "וּשְׁאֵל יַעֲקֹב וַאֲמַר חַוִּי <b>כְעַן<\/b> שְׁמָךְ וַאֲמַר לְמָה דְנַן אַתְּ שָׁאֵל לִשְׁמִי וּבָרִיךְ יָתֵיהּ תַּמָּן:", "onk_en": "Yaakov asked him, and said, Please [<b>Now<\/b>] tell me your name. He said, Why then do you ask my name? He then blessed him [Yaakov] there.", "pj": "וּשְׁאֵיל יַעֲקב וַאֲמַר חַוִי כְדוּן שְׁמָךְ וַאֲמַר לָמָה דְנַן אַנְתְּ שְׁאַל לִשְׁמִי וּבְרִיךְ יָתֵיהּ יַעֲקב תַּמָן", "pj_en": "And Jakob asked and said, Show me now thy name. And he said, Why dost thou ask for my name? And he blessed Jakob there.", "tj": "", "tj_en": "", "rashi": "<b>למה זה תשאל.<\/b> אֵין לָנוּ שֵׁם קָבוּעַ, מִשְׁתַּנִּים שְׁמוֹתֵנוּ, הַכֹּל לְפִי מִצְוַת עֲבוֹדַת הַשְּׁלִיחוּת שֶׁאָנוּ מִשְׁתַּלְּחִים (בראשית רבה):", "rashi_en": "למה זה תשאל WHEREFORE IS IT THAT THOU DOST ASK [AFTER MY NAME]? — We have no fixed names; our names change, all depending upon the service we are commanded to carry out as the errand with which we are charged (Genesis Rabbah 78:4). "}, {"ch": 32, "v": 31, "aliyah": 3, "heb": "וַיִּקְרָ֧א יַעֲקֹ֛ב שֵׁ֥ם הַמָּק֖וֹם פְּנִיאֵ֑ל כִּֽי־רָאִ֤יתִי אֱלֹהִים֙ פָּנִ֣ים אֶל־פָּנִ֔ים וַתִּנָּצֵ֖ל נַפְשִֽׁי׃", "onk": "וּקְרָא יַעֲקֹב שְׁמָא דְאַתְרָא פְּנִיאֵל אֲרֵי חֲזֵיתִי <b>מַלְאָכַיָּא דַיְיָ<\/b> אַפִּין בְּאַפִּין וְאִשְׁתְּזָבַת נַפְשִׁי:", "onk_en": "Yaakov named the place Peniel [God’s Face], For I have seen God[ly beings] [<b>Angles of God<\/b>] face to face, and my soul has survived.", "pj": "וּקְרָא יַעֲקב שְׁמָא דְאַתְרָא פְּנִיאֵל אֲרוּם אָמַר חֲמִיתִי מַלְאָכַיָיא דַיְיָ אַפִּין כָּל קְבֵיל אַפִּין וְאִישְׁתְּזִיבַת נַפְשִׁי", "pj_en": "And Jakob called the name of the place Peniel; for he said, I have seen the Angels of the Lord face to face, and my soul is saved.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 32, "v": 32, "aliyah": 3, "heb": "וַיִּֽזְרַֽח־ל֣וֹ הַשֶּׁ֔מֶשׁ כַּאֲשֶׁ֥ר עָבַ֖ר אֶת־פְּנוּאֵ֑ל וְה֥וּא צֹלֵ֖עַ עַל־יְרֵכֽוֹ׃", "onk": "וּדְנַח לֵיהּ שִׁמְשָׁא כְּמָא דִי עֲבַר יָת פְּנוּאֵל וְהוּא מַטְלַע עַל יַרְכֵּיהּ:", "onk_en": "The sun shone for him as he passed by Penuel, and he limped due to his hip.", "pj": "וּדְנַח לֵיהּ שִׁמְשָׁא קֳדָם זִמְנֵיהּ דְטָמַע בְּגִינֵיהּ קֳדָם זִמְנֵיהּ בְּמִיפְקֵיהּ מִבֵּירָא דְשָׁבַע כַּד עָבַר יַת פְּנוּאֵל וּשְׁרֵי לְטַיְילָא וְהוּא מַטְלַע עַל יַרְכֵיהּ", "pj_en": "And the sun rose upon him before his time, (the sun) which on his account had set before his time, on his going out from Beersheba, as he crossed over Peniel. And he began to journey, and was lame upon his thigh.", "tj": "", "tj_en": "", "rashi": "<b>ויזרח לו השמש.<\/b> לְשׁוֹן בְּנֵי אָדָם הוּא כְּשֶׁהִגַּעְנוּ לְמָקוֹם פְּלוֹנִי הֵאִיר לָנוּ הַשַּׁחַר, זֶהוּ פְשׁוּטוֹ; וּמִ\"אַ <b>ויזרח לו<\/b> לְצָרְכּוֹ – לְרַפְּאוֹת אֶת צָלַעְתּוֹ, כְּמָה דְּתֵימָא שֶׁמֶשׁ צְדָקָה וּמַרְפֵּא בִּכְנָפֶיהָ (מלאכי ג'); וְאוֹתָן שָׁעוֹת שֶׁמִּהֲרָה לִשְׁקֹעַ בִּשְׁבִילוֹ כְּשֶׁיָּצָא מִבְּאֵר שֶׁבַע מִהֲרָה לִזְרֹחַ בִּשְׁבִילוֹ:<br><br><b>והוא צלע.<\/b> הָיָה צוֹלֵעַ כְּשֶׁזָּרְחָה הַשֶּׁמֶשׁ:", "rashi_en": "ויזרח לו השמש AND THE SUN SHONE UPON HIM— This is the expression that people use: “When we reached such-and-such a place the dawn broke upon us”. This is its literal sense. But the Midrash says that לו means, “for his needs” — to heal his lameness. Thus, too, you read in Scripture a similar metaphor (Malachi 3:20) “the sun of righteousness with healing in its wings”. The hours that it had set before its time for his sake when he left Beer-Sheba (cp. Genesis 18:11) it now rose before its time for his sake (Sanhedrin 75b).<br><br>והוא צלע AND HE LIMPED — He was limping when the sun rose. "}, {"ch": 32, "v": 33, "aliyah": 3, "heb": "עַל־כֵּ֡ן לֹֽא־יֹאכְל֨וּ בְנֵֽי־יִשְׂרָאֵ֜ל אֶת־גִּ֣יד הַנָּשֶׁ֗ה אֲשֶׁר֙ עַל־כַּ֣ף הַיָּרֵ֔ךְ עַ֖ד הַיּ֣וֹם הַזֶּ֑ה כִּ֤י נָגַע֙ בְּכַף־יֶ֣רֶךְ יַעֲקֹ֔ב בְּגִ֖יד הַנָּשֶֽׁה׃", "onk": "עַל כֵּן לָא יֵכְלוּן בְּנֵי יִשְׂרָאֵל יָת גִּידָא דְנַשְׁיָא דִּי עַל <b>פְּתֵי<\/b> יַרְכָּא עַד יוֹמָא הָדֵין אֲרֵי קְרֵיב בִּ<b>פְתֵי<\/b> יַרְכָּא דְיַעֲקֹב בְּגִידָא דְּנַשְׁיָא:", "onk_en": "Therefore, the children of Israel must not eat the displaced tendon [nerve] which is on the [<b>girth of the<\/b>] hip joint to this very day; because he struck [<b>the girth of<\/b>] Yaakov’s hip joint on the displaced tendon.", "pj": "בְּגִין כֵּן לָא אָכְלִין בְּנֵי יִשְרָאֵל יַת גִידָא דְנַשְׁיָא דְעַל פְּתֵי יַרְכָא דִבְעִירָא וְחֵיוָותָא עַד יוֹמָא הָדֵין אֲרוּם קָרִיב מַלְאָכָא וְאָחַד בִּפְתֵי יַרְכֵי יְמִינָא דְיַעֲקב בְּאָתַר גִידָא דְנַשְׁיָא", "pj_en": "Therefore the sons of Israel eat not the sinew which shrank, which is in the hollow of the thigh of cattle and of wild animals, until this day; because the Angel touched and laid hold of the hollow of the right thigh of Jakob, in the place of the sinew which shrank.", "tj": "", "tj_en": "", "rashi": "<b>גיד הנשה.<\/b> לָמָּה נִקְרָא שְׁמוֹ גִּיד הַנָּשֶׁה? לְפִי שֶׁנָּשָׁה מִמְּקוֹמוֹ וְעָלָה, וְהוּא לְשׁוֹן קְפִיצָה, וְכֵן נָשְׁתָה גְבוּרָתָם (ירמיהו נ\"א), וְכֵן כִּי נַשַּׁנִי אֱלֹהִים אֶת כָּל עֲמָלִי (בראשית מ\"א):", "rashi_en": "גיד הנשה THE SINEW OF THE THIGH-VEIN — Why is its name called גיד הנשה? Because it sprang נשה) and rose from its proper position. The word has the meaning of “springing”. Other examples are: (Jeremiah 51:30) “Their strength sprang away (נשתה)” and (41:51) “for God hath made all my trouble spring away from me נַשַּׁנִי)\"."}, {"ch": 33, "v": 1, "aliyah": 3, "heb": "וַיִּשָּׂ֨א יַעֲקֹ֜ב עֵינָ֗יו וַיַּרְא֙ וְהִנֵּ֣ה עֵשָׂ֣ו בָּ֔א וְעִמּ֕וֹ אַרְבַּ֥ע מֵא֖וֹת אִ֑ישׁ וַיַּ֣חַץ אֶת־הַיְלָדִ֗ים עַל־לֵאָה֙ וְעַל־רָחֵ֔ל וְעַ֖ל שְׁתֵּ֥י הַשְּׁפָחֽוֹת׃", "onk": "וּזְקַף יַעֲקֹב עֵינוֹהִי וַחֲזָא וְהָא עֵשָׂו אֲתָא וְעִמֵּיהּ אַרְבַּע מְאָה גֻּבְרִין וּפַלִּיג יָת בְּנַיָּא עַל לֵאָה וְעַל רָחֵל וְעַל תַּרְתֵּין <b>לְחֵינָתָא<\/b>:", "onk_en": "Yaakov raised his eyes and saw that Eisov was coming, and with him there were four hundred men. He then divided the children among Leah, Rochel and the two handmaids [<b>concubines<\/b>].", "pj": "וּזְקֵיף יַעֲקב יַת עֵינוֹי וַחֲמָא וְהָא עֵשָו אָתֵי וְעִמֵיהּ אַרְבַּע מְאָה גוּבְרִין פּוּלְמוּרְכִין וּפַלֵיג יַת בְּנַיָא עַל לֵאָה וְעַל רָחֵל וְעַל תַּרְתֵּין לְחֵינָתָא", "pj_en": "And Jakob lifted up his eyes and looked, and, behold, Esau came, and with him four hundred men of war. And he divided the children unto Leah, and to Rahel, and to the two concubines,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 2, "aliyah": 3, "heb": "וַיָּ֧שֶׂם אֶת־הַשְּׁפָח֛וֹת וְאֶת־יַלְדֵיהֶ֖ן רִֽאשֹׁנָ֑ה וְאֶת־לֵאָ֤ה וִֽילָדֶ֙יהָ֙ אַחֲרֹנִ֔ים וְאֶת־רָחֵ֥ל וְאֶת־יוֹסֵ֖ף אַחֲרֹנִֽים׃", "onk": "וְשַׁוִּי יָת <b>לְחֵינָתָא<\/b> וְיָת בְּנֵיהֶן קַדְמָאִין וְיָת לֵאָה וּבְנָהָא בַּתְרָאִין וְיָת רָחֵל וְיָת יוֹסֵף בַּתְרָאִין:", "onk_en": "He placed the handmaids [<b>concubines<\/b>] and their children foremost, Leah and her sons behind them, and Rochel and Yoseif in the rear.", "pj": "וְשַׁוִי יַת לְחֵינָתָא הִינָן וּבְנֵיהֶן בְּקַדְמֵיתָא אֲרוּם אָמַר אִלוּ אָתֵי עֵשָו לְחַבְּלָא בְּרֻבַיָא לְמֶעֱבַד זְנוּ בִּנְשַׁיָא יַעֲבֵּיד בְּאִילֵן וּבְגוֹ פִּתְגָמָא הָדֵין נְקוּם וְנַגַח עִמֵיהּ קְרָבָא וְיַת לֵאָה וְרִיבָהָא בַּתְרָאִין וְיַת רָחֵל וְיַת יוֹסֵף בַּתְרָאִין", "pj_en": "and placed the concubines and their sons foremost; for he said, If Esau come to destroy the children and abuse the women, he will do it with them, and meantime we will arise and encounter him in fight; and Leah and her children after, and Rahel and Joseph after them.", "tj": "", "tj_en": "", "rashi": "<b>ואת לאה וילדיה אחרנים.<\/b> אַחֲרוֹן אַחֲרוֹן חָבִיב:", "rashi_en": "ואת לאה וילדיה אחרנים AND LEAH AND HER CHILDREN AFTER — The more behind — the more beloved (Genesis Rabbah 78:8). "}, {"ch": 33, "v": 3, "aliyah": 3, "heb": "וְה֖וּא עָבַ֣ר לִפְנֵיהֶ֑ם וַיִּשְׁתַּ֤חוּ אַ֙רְצָה֙ שֶׁ֣בַע פְּעָמִ֔ים עַד־גִּשְׁתּ֖וֹ עַד־אָחִֽיו׃", "onk": "וְהוּא עֲבַר קֳדָמֵיהוֹן וּסְגִיד עַל אַרְעָא שְׁבַע זִמְנִין עַד מִקְרְבֵיהּ עַד (<small>נ\"א<\/small> לְוַת) אֲחוּהִי:", "onk_en": "He went ahead of them, and he prostrated himself to the earth seven times, until he approached his brother.", "pj": "וְאִיהוּ עָבַר לְקָדָמֵיהוֹן מַצְלֵי וּבְעֵי רַחֲמִין מִן קֳדָם יְיָ וְגָחַן עַל אַרְעָא שְׁבַע זִמְנִין עַד מִיקְרְבֵיהּ עַד אָחוֹי", "pj_en": "And he himself went over before them, praying and asking mercy before the Lord; and he bowed upon the earth seven times, until he met with his brother.", "tj": "", "tj_en": "", "rashi": "<b>עבר לפניהם.<\/b> אָמַר אִם יָבֹא אוֹתוֹ רָשָׁע לְהִלָּחֵם יִלָּחֵם בִּי תְּחִלָּה:", "rashi_en": "עבר לפניהם [AND HE HIMSELF] PASSED BEFORE THEM — He thought: if that wicked man comes to fight let him fight me first (Genesis Rabbah 78:8)."}, {"ch": 33, "v": 4, "aliyah": 3, "heb": "וַיָּ֨רׇץ עֵשָׂ֤ו לִקְרָאתוֹ֙ וַֽיְחַבְּקֵ֔הוּ וַיִּפֹּ֥ל עַל־צַוָּארָ֖ו וַׄיִּׄשָּׁׄקֵ֑ׄהׄוּׄ וַיִּבְכּֽוּ׃", "onk": "וּרְהַט עֵשָׂו לְקַדָּמוּתֵיהּ וְגַפְּפֵיהּ וּנְפַל עַל צַוְארֵיהּ וְנַשְּׁקֵיהּ וּבְכוֹ:", "onk_en": "Eisov ran to meet him. He hugged him and fell on his neck and kissed him. They [both] wept.", "pj": "וּרְהַט עֵשָו לִקְדָמוּתֵיהּ וְגַפֵיף לֵיהּ וְאִתְרְכִין עַל צַוְורֵיהּ וּנְשֵׁיק לֵיהּ וּבְכוּן עֵשָו בָּכָא עַל צַעֲרָא דְשִׁינוֹי דְאִיתְמִזְמִיזוּ וְיַעֲקב בָּכָא עַל צַעֲרָא דְצַוָורֵיהּ", "pj_en": "And Esau ran to meet him, and embraced him, and fell upon his neck and kissed him, and they wept. Esau wept on account of the pain of his teeth which were shaken; but Jakob wept because of the pain of his neck.", "tj": "וּרְהַט עֵשָו לִקְדָמוּתֵיהּ וְחַבֵּיק יָתֵיהּ וְאִתְרְכִין עַל צַוְורֵיהּ וּנְשֵׁיק יָתֵיהּ עֵשָו הֲוָה בָּכִי עַל דִקְהָן שִׁינוֹי וְיַעֲקב הֲוָה בָּכִי עַל שַׁעֲשִׁיעַת צַוְורֵיהּ:", "tj_en": "And Esau ran to meet him, and hugged him, and fell upon his neck and kissed him. Esau wept for the crushing of his teeth, and Jakob wept for the tenderness of his neck.", "rashi": "<b>ויחבקהו.<\/b> נִתְגַּלְגְּלוּ רַחֲמָיו, כְּשֶׁרָאָהוּ מִשְׁתַּחֲוֶה כָּל הִשְׁתַּחֲוָאוֹת הַלָּלוּ:<br><br><b>וישקהו.<\/b> נָקוּד עָלָיו; וְיֵשׁ חוֹלְקִין בַּדָּבָר הַזֶּה בַּבָּרַיְתָא דְּסִפְרֵי, יֵשׁ שֶׁדָּרְשׁוּ נְקֻדָּה זוֹ שֶׁלֹּא נְשָׁקוֹ בְּכָל לִבּוֹ, אָמַר רַבִּי שִׁמְעוֹן בֶּן יוֹחַאי, הֲלָכָה הִיא בְּיָדוּעַ שֶׁעֵשָׂו שׂוֹנֵא לְיַעֲקֹב, אֶלָּא שֶׁנִּכְמְרוּ רַחֲמָיו בְּאוֹתָהּ שָׁעָה וּנְשָׁקוֹ בְּכָל לִבּוֹ (ספרי במדבר):", "rashi_en": "ויחבקהו AND EMBRACED HIM — His pity was aroused when he saw him prostrating himself so many times (Genesis Rabbah 78:8).<br><br>וישקהו AND HE KISSED HIM — Dots are placed above the letters of this word, and a difference of opinion is expressed in the Baraitha of Sifré (בהעלותך) as to what these dots are intended to suggest: some explain the dotting as meaning that he did not kiss him with his whole heart, whereas R Simeon the son of Johai said: Is it not well-known that Esau hated Jacob? But at that moment his pity was really aroused and he kissed him with his whole heart. (Sifrei Bamidbar 69.2)"}, {"ch": 33, "v": 5, "aliyah": 3, "heb": "וַיִּשָּׂ֣א אֶת־עֵינָ֗יו וַיַּ֤רְא אֶת־הַנָּשִׁים֙ וְאֶת־הַיְלָדִ֔ים וַיֹּ֖אמֶר מִי־אֵ֣לֶּה לָּ֑ךְ וַיֹּאמַ֕ר הַיְלָדִ֕ים אֲשֶׁר־חָנַ֥ן אֱלֹהִ֖ים אֶת־עַבְדֶּֽךָ׃", "onk": "וּזְקַף יָת עֵינוֹהִי וַחֲזָא יָת נְשַׁיָּא וְיָת בְּנַיָּא וַאֲמַר מָן אִלֵּין לָךְ וַאֲמַר בְּנַיָּא דִּי <b>חָס<\/b> יְיָ יָת עַבְדָּךְ:", "onk_en": "[Eisov] raised his eyes and saw the women and children. He said, Who are these to you? He [Yaakov] said, These are the children whom God has graciously [<b>compassionately<\/b>] granted your servant.", "pj": "וּזְקַף יַת עֵינוֹי וַחֲמָא יַת נְשַׁיָא וְיַת רַבְיָא וְאָמַר מַאן אִלֵין לָךְ וְאָמַר בְּנַי הִינוּן דְאִתְיְהִיבוּ לִי בְּמֵיחוּס מִן קֳדָם יְיָ עַל עַבְדָךְ", "pj_en": "And he lifted up his eyes and saw the wives and the children, and said, Who are these with thee? And he said, They are the souls which have been given to me through mercy from before the Lord upon thy servant.", "tj": "", "tj_en": "", "rashi": "<b>מי אלה לך.<\/b> מִי אֵלֶּה לִהְיוֹת שֶׁלְּךָ:", "rashi_en": "מי אלה לך WHO ARE THESE WITH THEE? (literally, to thee)? — Who are these that they should be yours (are they your children or your servants)? "}, {"ch": 33, "v": 6, "aliyah": 4, "heb": "וַתִּגַּ֧שְׁןָ הַשְּׁפָח֛וֹת הֵ֥נָּה וְיַלְדֵיהֶ֖ן וַתִּֽשְׁתַּחֲוֶֽיןָ׃", "onk": "וּקְרִיבַת <b>לְחֵינָתָא<\/b> אִנִּין וּבְנֵיהֵן וּסְגִידָא:", "onk_en": "The handmaids [<b>concubines<\/b>] [then] approached, they, and their children, and prostrated themselves.", "pj": "וּקְרִיבַן לְחֵינָתָא הִינוּן וּבְנֵיהֶן וּגְחִינָן", "pj_en": "And the concubines came near, they and their children, and bowed themselves;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 33, "v": 7, "aliyah": 4, "heb": "וַתִּגַּ֧שׁ גַּם־לֵאָ֛ה וִילָדֶ֖יהָ וַיִּֽשְׁתַּחֲו֑וּ וְאַחַ֗ר נִגַּ֥שׁ יוֹסֵ֛ף וְרָחֵ֖ל וַיִּֽשְׁתַּחֲוֽוּ׃", "onk": "וּקְרִיבָא אַף לֵאָה וּבְנָהָא וּסְגִידוּ וּבָתַר כֵּן קְרֵיב יוֹסֵף וְרָחֵל וּסְגִידוּ:", "onk_en": "Leah and her children also approached and prostrated themselves, and finally Yoseif and Rochel approached and prostrated themselves.", "pj": "וּקְרִיבַת אוּף לֵאָה וּבְנָהָא וּגְחִינָן וּבָתַר כֵּן קָרִיב יוֹסֵף וְאִתְעַתַּד קָמֵי רָחֵל וְכַסְיָיהּ בְּקוֹמָתֵהּ וּגְחִינָן", "pj_en": "and Leah also approached, and her children, and bowed; and afterward Joseph came near and stood before Rahel, and hid her by his stature, and they bowed.", "tj": "", "tj_en": "", "rashi": "<b>נגש יוסף ורחל.<\/b> בְּכֻלָּן הָאִמָּהוֹת נִגָּשׁוֹת לִפְנֵי הַבָּנִים, אֲבָל בְּרָחֵל יוֹסֵף נִגַּשׁ לְפָנֶיהָ, אָמַר אִמִּי יְפַת תֹּאַר, שֶׁמָּא יִתְלֶה בָהּ עֵינָיו אוֹתוֹ רָשָׁע, אֶעֱמֹד כְּנֶגְדָהּ וַאֲעַכְּבֶנּוּ מִלְּהִסְתַּכֵּל בָּהּ; מִכָּאן זָכָה יוֹסֵף לְבִרְכַּת עֲלֵי עַיִן:", "rashi_en": "נגש יוסף ורחל JOSEPH AND RACHEL STEPPED NEAR — In the case of all the others the mothers approached before the children, but in the case of Rachel, Joseph came in front of her. He said: “My mother is a beautiful woman: for fear that this wicked man will set his fancy on her I will stand in front of her and prevent him from gazing at her ” As a reward for this Joseph merited the blessing associated with the words עלי עין \"with the eye” (Genesis Rabbah 78:10). "}, {"ch": 33, "v": 8, "aliyah": 4, "heb": "וַיֹּ֕אמֶר מִ֥י לְךָ֛ כׇּל־הַמַּחֲנֶ֥ה הַזֶּ֖ה אֲשֶׁ֣ר פָּגָ֑שְׁתִּי וַיֹּ֕אמֶר לִמְצֹא־חֵ֖ן בְּעֵינֵ֥י אֲדֹנִֽי׃", "onk": "וַאֲמַר מָן לָךְ כָּל מַשְׁרִיתָא הָדֵין דִּי עֲרָעִית וַאֲמַר לְאַשְׁכָּחָא רַחֲמִין בְּעֵינֵי רִבּוֹנִי:", "onk_en": "He [Eisov] said, What do you have to do with that whole camp that approached me? He [Yaakov] said, It was to find favor in the eyes of my master.", "pj": "וַאֲמַר מַן לָךְ כָּל מַשְׁרֵי הָדֵין דְאַרְעִית וַאֲמַר דוֹרוֹן הוּא דְשַׁדְרִית לְאַשְׁכָּחָא רַחֲמִין בְּעֵינֵי רִבּוֹנִי", "pj_en": "And he said, What to thee is all this troop that I have met? And he said, It is a present I have sent to find mercy in the eyes of my lord.", "tj": "", "tj_en": "", "rashi": "<b>מי לך כל המחנה.<\/b> מִי כָּל הַמַּחֲנֶה אֲשֶׁר פָּגַשְׁתִּי, שֶׁהוּא שֶׁלְּךָ? כְּלוֹמַר לָמָּה הוּא לְךָ? פְּשׁוּטוֹ שֶׁל מִקְרָא עַל מוֹלִיכֵי הַמִּנְחָה, וּמִדְרָשׁוֹ כִּתּוֹת שֶׁל מַלְאָכִים פָּגַע, שֶׁהָיוּ דּוֹחֲפִין אוֹתוֹ וְאֶת אֲנָשָׁיו וְאוֹמְרִים לָהֶם שֶׁל מִי אַתֶּם? וְהֵם אוֹמְרִים לָהֶם שֶׁל עֵשָׂו, וְהֵם אוֹמְרִים הַכּוּ, הַכּוּ, וְאֵלּוּ אוֹמְרִים הַנִּיחוּ, בְּנוֹ שֶׁל יִצְחָק הוּא, וְלֹא הָיוּ מַשְׁגִּיחִים עָלָיו; בֶּן בְּנוֹ שֶׁל אַבְרָהָם הוּא, וְלֹא הָיוּ מַשְׁגִּיחִין; אָחִיו שֶׁל יַעֲקֹב הוּא, אוֹמְרִים לָהֶם אִם כֵּן, מִשֶּׁלָּנוּ אַתֶּם:", "rashi_en": "מי לך כל המחנה WHAT MEANEST THOU BY ALL THIS CAMP? — What is all this camp that I have met which belongs to you — as much as to say: what do you intend by it? Scripture really uses the word המחנה in reference to those who were bringing the present. A Midrashic explanation is: He had met companies of angels who thrust him and his men aside, asking them, “Who are you?” These replied, “We belong to Esau”. Whereupon the angels exclaimed, “Smite, smite!” They (Esau’s men) then said, “Let him alone; he is a son of Isaac”. They took no notice of this. “He is a grandson of Abraham”. Again they took no notice of this. “He is Jacob’s brother\". Whereupon they said: if this be so, you are one with us” (Genesis Rabbah 78:11). "}, {"ch": 33, "v": 9, "aliyah": 4, "heb": "וַיֹּ֥אמֶר עֵשָׂ֖ו יֶשׁ־לִ֣י רָ֑ב אָחִ֕י יְהִ֥י לְךָ֖ אֲשֶׁר־לָֽךְ׃", "onk": "וַאֲמַר עֵשָׂו אִית לִי סַגִּי אָחִי <b>אַצְלַח<\/b> בְּדִילָךְ:", "onk_en": "Eisov said, I have plenty. My brother, let what you have remain yours [<b>be successful<\/b>].", "pj": "וַאֲמַר עֵשָו אִית לִי נִכְסִין סַגִיאִין אָחִי יִתְקַיֵים לָךְ מַאן דְאִית לָךְ", "pj_en": "And Esau said, I have much substance, my brother; let what thou hast be confirmed to thee.", "tj": "", "tj_en": "", "rashi": "<b>יהי לך אשר לך.<\/b> כָּאן הוֹדָה לוֹ עַל הַבְּרָכוֹת (בראשית רבה):", "rashi_en": "יהי לך אשר לך BE THINE THAT WHICH IS THINE — In these words he admitted his right to the blessings (Genesis Rabbah 78:11). "}, {"ch": 33, "v": 10, "aliyah": 4, "heb": "וַיֹּ֣אמֶר יַעֲקֹ֗ב אַל־נָא֙ אִם־נָ֨א מָצָ֤אתִי חֵן֙ בְּעֵינֶ֔יךָ וְלָקַחְתָּ֥ מִנְחָתִ֖י מִיָּדִ֑י כִּ֣י עַל־כֵּ֞ן רָאִ֣יתִי פָנֶ֗יךָ כִּרְאֹ֛ת פְּנֵ֥י אֱלֹהִ֖ים וַתִּרְצֵֽנִי׃", "onk": "וַאֲמַר יַעֲקֹב בְּבָעוּ אִם <b>כְּעַן<\/b> אַשְׁכָּחִית רַחֲמִין בְּעֵינָיךְ <b>וּתְקַבֵּל<\/b> תִּקְרֻבְתִּי מִן יְדִי אֲרֵי עַל כֵּן חֲזִתִּנּוּן לְאַפָּיךְ כְּחֵיזוּ אַפֵּי <b>רַבְרְבַיָּא<\/b> וְאִתְרְעֵית לִי:", "onk_en": "Yaakov said, Please, no. If I have found favor in your eyes [<b>now<\/b>], take [<b>accept<\/b>] my present from my hand, because I have seen your face [and it was] like seeing the face of a God[ly being] [<b>great ones<\/b>]; and you have received me favorably.", "pj": "וַאֲמַר יַעֲקב לָא תֵימָא כֵּן בְּבָעוּ אִין כְּדוּן אַשְׁכָּחִית רַחֲמִין בְּעֵינָךְ וּתְקַבֵּל דוֹרוֹנִי מִן יְדִי אֲרוּם בְּגִין כֵּן חָמִית סְבַר אַפָּךְ וּדְמֵי לִי הֵי כְּמִיחְמֵי אַפֵּי מַלְאָכָא דִידָךְ דְהָא אִתְרְעִיתָא לִי", "pj_en": "And Jakob said, Say not so, I beseech thee. If now I have found favor in thy eyes, accept my present from my hand; because I have seen the look of thy face, and it is to me as the vision of the face of thy angel; for, lo, thou art propitious to me.", "tj": "", "tj_en": "", "rashi": "<b>אל נא.<\/b> אַל נָא תֹאמַר לִי כֵּן:<br><br><b>אם נא מצאתי חן בעיניך ולקחת מנחתי מידי כי על כן ראיתי פניך וגו'.<\/b> כִּי כְּדַאי וְהָגוּן לְךָ שֶׁתְּקַבֵּל מִנְחָתִי עַל אֲשֶׁר רָאִיתִי פָנֶיךָ, וְהֵן חֲשׁוּבִין לִי כִּרְאִיַּת פְּנֵי הַמַּלְאָךְ, שֶׁרָאִיתִי שַׂר שֶׁלְּךָ, וְעוֹד עַל שֶׁנִּתְרַצֵּיתָ לִמְחֹל עַל סֻרְחָנִי. וְלָמָּה הִזְכִּיר לוֹ רְאִיַּת הַמַּלְאָךְ? כְּדֵי שֶׁיִּתְיָרֵא הֵימֶנּוּ וְיֹאמַר רָאָה מַלְאָכִים וְנִצַּל, אֵינִי יָכוֹל לוֹ מֵעַתָּה:<br><br><b>ותרצני.<\/b> נִתְפַּיַּסְתָּ לִי, וְכֵן כָּל רָצוֹן שֶׁבַּמִּקְרָא לְשׁוֹן פִּיּוּס, אפייצימנ\"טו בְּלַעַז, כִּי לֹא לְרָצוֹן יִהְיֶה לָכֶם (ויקרא כ\"ב) – הַקָּרְבָּנוֹת בָּאוֹת לְפַיֵּס וּלְרַצּוֹת, וְכֵן שִׂפְתֵי צַדִּיק יֵדְעוּן רָצוֹן (משלי י') – יוֹדְעִים לְפַיֵּס וּלְרַצּוֹת:", "rashi_en": "אל נא NAY, I PRAY THEE — Do not, I pray thee, speak to me thus.<br><br>אם נא מצאתי חן בעיניך ולקחת מנחתי מידי כי על כן ראיתי פניך וגו' IF NOW I HAVE FOUND FAVOUR IN THY EYES THEN TAKE MY PRESENT AT MY HAND: FOR THEREFORE I HAVE SEEN THY FACE etc. — Accept my present because (כי) it is fitting and proper for you to accept my present, for that (על כן) I have seen your face which is as dear to me as the sight of the angel — for I have seen your guardian angel. And a further reason why you should accept my present is ותרצני — because you have agreed to pardon my offence. Why, however, did he mention to him that he had seen the angel? In order that he (Esau) should be afraid of him saying, “He has seen angels and nevertheless escaped safely! Now, certainly, I shall be unable to overcome him” (Sotah 41b)<br><br>ותרצני AND THOU WAST PLEASED WITH ME — You are reconciled with me. Wherever the term רצה (the verb, or the noun רצון) occurs in Scripture it means “propitiating”; old French appaisement; English appeasing. An example is, (Leviticus 22:20) “It shall not be (לרצון) acceptable as a propitiatory sacrifice to you”, for the purpose of the sacrifices is to conciliate and to propitiate. Similarly (Proverbs 10:31) \"The lips of the righteous know רצון — they understand to conciliate and propitiate. "}, {"ch": 33, "v": 11, "aliyah": 4, "heb": "קַח־נָ֤א אֶת־בִּרְכָתִי֙ אֲשֶׁ֣ר הֻבָ֣את לָ֔ךְ כִּֽי־חַנַּ֥נִי אֱלֹהִ֖ים וְכִ֣י יֶשׁ־לִי־כֹ֑ל וַיִּפְצַר־בּ֖וֹ וַיִּקָּֽח׃", "onk": "קַבֵּל <b>כְּעַן<\/b> יָת <b>תִּקְרֻבְתִּי<\/b> דְּאִתּוֹתִיאַת לָךְ אֲרֵי רַחִים עֲלַי (קֳדָם) יְיָ וַאֲרֵי אִית לִי כֹלָּא וְאַתְקֵף בֵּיהּ <b>וְקַבִּיל<\/b>:", "onk_en": "Please [<b>Now<\/b>] accept my blessing [<b>present<\/b>] as it was brought to you, for God has been gracious to me, for I have everything. He thus urged him and he took [<b>accepted<\/b>] it.", "pj": "קַבֵּיל כְּדוֹן יַת דוֹרוֹן דְאִתַּתְיָא לָךְ אֲרוּם אִתְיְהֵב לִי בְּמֵיחוּס מִן קֳדָם יְיָ וַאֲרוּם אִית לִי נִכְסִין סַגִיאִין וּדְחַק בֵּיהּ וְקַבֵּיל", "pj_en": "Receive now the present which is brought to thee, because it hath been given me through mercy from before the Lord, and because I have much substance. And he urged upon him, and he received.", "tj": "", "tj_en": "", "rashi": "<b>ברכתי.<\/b> מִנְחָתִי, מִנְחָה זוֹ הַבָּאָה עַל רְאִיַּת פָּנִים וְלִפְרָקִים אֵינָה בָאָה אֶלָּא לִשְׁאֵלַת שָׁלוֹם, וְכָל בְּרָכָה שֶׁהִיא לִרְאִיַּת פָּנִים – כְּגוֹן וַיְבָרֶךְ יַעֲקֹב אֶת פַּרְעֹה (בראשית מ״ז:ז׳), עֲשׂוּ אִתִּי בְרָכָה דְּסַנְחֵרִיב (מלכים ב י\"ח), וְכֵן לִשְׁאָל לוֹ לְשָׁלוֹם וּלְבָרְכוֹ דְּתֹעִי מֶלֶךְ חֲמָת (שמואל ב ח') – כֻּלָּם לְשׁוֹן בִּרְכַּת שָׁלוֹם הֵן, שֶׁקּוֹרִין בְּלַעַז שלו\"איר, אַף זוֹ בִּרְכָתִי מו\"ן שלו\"ד:<br><br><b>אשר הבאת לך.<\/b> לֹא טָרַחְתָּ בָּהּ וַאֲנִי יָגַעְתִּי לְהַגִּיעָהּ עַד שֶׁבָּאָה לְיָדְךָ (בראשית רבה):<br><br><b>חנני.<\/b> נוּ\"ן רִאשׁוֹנָה מֻדְגֶּשֶׁת, לְפִי שֶׁהִיא מְשַׁמֶּשֶׁת בִּמְקוֹם שְׁתֵּי נוּנִי\"ן, שֶׁהָיָה לוֹ לוֹמַר חֲנָנַנִי, שֶׁאֵין חָנֹן בְּלֹא שְׁתֵּי נוּנִי\"ן, וְהַשְּׁלִישִׁית לְשִׁמּוּשׁ, כְּמוֹ עָשַׂנִי, זְבָדַנִי:<br><br><b>יש לי כל.<\/b> כָּל סִפּוּקִי; וְעֵשָׂו דִּבֵּר בִּלְשׁוֹן גַּאֲוָה יֶשׁ לִי רָב, יוֹתֵר וְיוֹתֵר מִכְּדֵי צָרְכִּי:", "rashi_en": "ברכתי means MY PRESENT — a present such as this that is brought, when one has an audience with a person after an interval of time is intended only as a greeting. Now wherever the term \"blessing” (ברכה) is used in connection with an audience — as for example, (47:7) “Jacob blessed (ויברך) Pharaoh”, and (2 Kings 18:31) \"make your peace (ברכה) with me” mentioned in connection with Sennacherib, and also (2 Samuel 8:10) to salute him and to bless him (לברכו)” mentioned in connection with Toi, King of Hamath — they all signify greeting, O.I. saluer. So that here, too: ברכתי really means “mon salut” — my greetings and the term is then transferred to the greeting-present.<br><br>אשר הבאת לך THAT IS BROUGHT TO THEE without any exertion on your part. I have myself taken the trouble to bring it all this way until it has reached your hand (Genesis Rabbah 78:12).<br><br>חַנַּנִי GOD HATH FAVOURED ME — The first נ has a Dagesh, because it serves the purpose of two נ’s since it should have said חַנְנַנִי as we always find the forms of חנן with two נ’s. The third נ here (Rashi means the third that is pronounced) serves as part of the accusative pronominal suffix (meaning “me”), as (Isaiah 29:16) עשני \"He made me”, and as (30:20) זבדני “he endowed me”.<br><br>יש לי כל I HAVE EVERYTHING — all that will supply my needs. But Esau spoke proudly (v. 8): I have (רב) abundance — far more than my needs."}, {"ch": 33, "v": 12, "aliyah": 4, "heb": "וַיֹּ֖אמֶר נִסְעָ֣ה וְנֵלֵ֑כָה וְאֵלְכָ֖ה לְנֶגְדֶּֽךָ׃", "onk": "וַאֲמַר נִטַּל וְנֵיהָךְ וְאֵיהַךְ לְקָבְלָךְ:", "onk_en": "He [Eisov] said, Go and we will move on, and I will move on with you.", "pj": "וַאֲמַר נְטַיֵיל וּנְהַךְ וְאָזִיל לְקִבְלָךְ עַד דְתִמְטֵי לְבֵי מְשׁוּרַיִיךְ", "pj_en": "And he said, Let us journey and proceed, and I will go along with thee, till thou come to the house of thy habitation.", "tj": "", "tj_en": "", "rashi": "<b>נסעה.<\/b> כְּמוֹ שִׁמְעָה, סִלְחָה, שֶׁהוּא כְּמוֹ שְׁמַע, סְלַח, אַף כָּאן נִסְעָה כְּמוֹ נְסַע, וְהַנּוּ\"ן יְסוֹד בַּתֵּבָה, וְתַרְגּוּם שֶׁל אֻנְקְלוֹס טוּל וּנְהָךְ, עֵשָׂו אָמַר לְיַעֲקֹב נְסַע מִכָּאן וְנֵלֵךְ:<br><br><b>ואלכה לנגדך.<\/b> בְּשָׁוֶה לְךָ; טוֹבָה זוֹ אֶעֱשֶׂה לְךָ, שֶׁאַאֲרִיךְ יְמֵי מַהֲלַכְתִּי, לָלֶכֶת לְאַט כַּאֲשֶׁר אַ
