<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 3, "v": 23, "aliyah": 1, "heb": "וָאֶתְחַנַּ֖ן אֶל־יְהֹוָ֑ה בָּעֵ֥ת הַהִ֖וא לֵאמֹֽר׃", "onk": "<b>וְצַלֵּיתִי קֳדָם<\/b> יְיָ בְּעִדָּנָא הַהִיא לְמֵימָר:", "onk_en": "I pleaded [<b>prayed<\/b>] to Adonoy at that time, saying:", "pj": "ואתחנן וּבָעִית רַחֲמִין מִן קֳדָם יְיָ בְּעִידָנָא הַהוּא לְמֵימָר", "pj_en": "And I sought mercy at that time from before the Lord, saying:", "tj": "וְצַלִּית וּבָעִית רַחֲמִין מִן קֳדָם יְיָ אָמַר משֶׁה בְּשַׁעְתָּא הַהִיא לְמֵימָר:", "tj_en": "And I prayed and sought mercy in that hour, said Mosheh, saying:", "rashi": "<b>ואתחנן.<\/b> אֵין חִנּוּן בְּכָל מָקוֹם אֶלָּא לְשׁוֹן מַתְּנַת חִנָּם – אַעַ\"פִּ שֶׁיֵּשׁ לָהֶם לַצַּדִּיקִים לִתְלוֹת בְּמַעֲשֵׂיהֶם הַטּוֹבִים אֵין מְבַקְּשִׁים מֵאֵת הַמָּקוֹם אֶלָּא מַתְּנַת חִנָּם, (לְפִי שֶׁאָמַר לוֹ וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן אָמַר לוֹ בִּלְשׁוֹן וָאֶתְחַנַּן); דָּ\"אַ זֶה אֶחָד מֵעֲשָׂרָה לְשׁוֹנוֹת שֶׁנִּקְרֵאת תְּפִלָּה, כִּדְאִיתָא בְּסִפְרֵי:<br><br><b>בעת ההוא.<\/b> לְאַחַר שֶׁכָּבַשְׁתִּי אֶרֶץ סִיחוֹן וְעוֹג דִּמִּיתִי שֶׁמָּא הֻתַּר הַנֶּדֶר:<br><br><b>לאמר.<\/b> זֶה אֶחָד מִגּ' מְקוֹמוֹת שֶׁאָמַר מֹשֶׁה לִפְנֵי הַמָּקוֹם אֵינִי מַנִּיחֲךָ עַד שֶׁתּוֹדִיעֵנִי אִם תַּעֲשֶׂה שְׁאֵלָתִי אִם לָאו (ספרי):", "rashi_en": "ואתחנן — All forms of the verb חנן signify an ex gratia gift. Although the righteous might make a claim to reward depend Upon their good deeds, yet they solicit from the Omnipresent only an ex gratia gift. [Because He had said to him, (Exodus 33:19) “I will show grace (וחנתי) unto him to whom I will show grace”, he (Moses) when referring to his entreaty of God uses the expression (lit., spoke to Him) \"I implored grace (ואתחנן)” (Midrash Tanchuma 5:2:3] — Another explanation is that the idea of an ex gratia gift is not to be stressed; but this is merely one of the ten terms by which prayer is described, as are enumerated in Sifrei Devarim 26:7.<br><br>בעת ההוא [I IMPLORED GRACE OF GOD] AT THAT TIME — After I had subdued the land of Sihon and Og I thought that perhaps the vow that I should not enter the land was annulled, since this was part of the land of Canaan (cf. Sifrei Devarim 26:8 and Rashi on Numbers 27:12).<br><br>לאמר TO SAY (i.e. that God should say) — This is one of the three occasions where Moses spoke before the Omnipresent: I will not let You go until You tell me whether You will fulfill my request or not (Sifrei Devarim 26:9; cf. Rashi on Numbers 12:13)."}, {"ch": 3, "v": 24, "aliyah": 1, "heb": "אֲדֹנָ֣י יֱהֹוִ֗ה אַתָּ֤ה הַֽחִלּ֙וֹתָ֙ לְהַרְא֣וֹת אֶֽת־עַבְדְּךָ֔ אֶ֨ת־גׇּדְלְךָ֔ וְאֶת־יָדְךָ֖ הַחֲזָקָ֑ה אֲשֶׁ֤ר מִי־אֵל֙ בַּשָּׁמַ֣יִם וּבָאָ֔רֶץ אֲשֶׁר־יַעֲשֶׂ֥ה כְמַעֲשֶׂ֖יךָ וְכִגְבוּרֹתֶֽךָ׃", "onk": "יְיָ אֱלֹּהִים אַתְּ שָׁרֵיתָא לְאַחֲזָאָה יָת עַבְדָּךְ יָת רְבוּתָךְ וְיָת יְדָךְ תַּקֶּפְתָּא דִּי <b>אַתְּ הוּא אֱלָהָא דִּשְׁכִנְתָּךְ<\/b> בִּשְׁמַיָּא <b>מִלְעֵלָּא וְשַׁלִּיט<\/b> בְּאַרְעָא <b>וְלֵית<\/b> דְּיַעְבֵּד כְּעוֹבָדָיךְ וּכְגִבָּרְתָּךְ:", "onk_en": "‘‘Adonoy, El him, You have begun to show Your servant Your greatness and Your powerful hand, that there is no power in [<b>You are God, Whose Shechinah is in<\/b>] heaven [<b>above<\/b>] or [<b>Ruler<\/b>] on earth that [<b>there is none who<\/b>] can perform Your deeds and Your acts of power.", "pj": "בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ יְיָ אֱלהִים אַנְתְּ שָׁרִיתָ לְאַחֲזָאָה יַת עַבְדָךְ יַת רְבוּתָךְ וְיַת גְּבוּרַת יְדָךְ תַּקִיפְתָּא דְאַתְּ הוּא אֱלָהָא וְלָא אִית בַּר מִינָךְ דִּשְׁכִינְתָּךְ שַׁרְיָא בִּשְׁמַיָא מִלְעֵילָא וְשַׁלִּיט בְּאַרְעָא לָא דְיַעֲבֵיד כְּעוֹבָדָךְ וְכִגְבוּרָתָךְ", "pj_en": "I supplicate compassion before Thee, O Lord God: Thou hast begun to show unto Thy servant Thy greatness and the power of Thy mighty hand; for Thou art God, and there is none beside Thee; for Thy glory dwelleth in the heavens on high, and Thou rulest upon the earth; there is none who can work according to Thy working or Thy power.", "tj": "בְּבָעוּ בְּרַחֲמִין מִן קֳדָמָךְ יְיָ אֱלהִים אַתְּ שָׁרִיתָ:", "tj_en": "I supplicate compassion before Thee, 0 Lord God; Thou hast begun.", "rashi": "<b>ה' אלהים.<\/b> רַחוּם בַּדִּין:<br><br><b>אתה החלות להראות את עבדך.<\/b> פֶּתַח, לִהְיוֹת עוֹמֵד וּמִתְפַּלֵּל אַעַ\"פִּ שֶׁנִּגְזְרָה גְּזֵרָה; אָמַר לוֹ מִמְּךָ לָמַדְתִּי, שֶׁאָמַרְתָּ לִי (שמות ל\"ב) \"וְעַתָּה הַנִּיחָה לִּי\", וְכִי תוֹפֵס הָיִיתִי בְךָ? אֶלָּא לִפְתֹּחַ פֶּתַח, שֶׁבִּי הָיָה תָלוּי לְהִתְפַּלֵּל עֲלֵיהֶם, כְּמוֹ כֵן הָיִיתִי סָבוּר לַעֲשׂוֹת עַכְשָׁו (ספרי):<br><br><b>את גדלך.<\/b> זוֹ מִדַּת טוּבְךָ, וְכֵן הוּא אוֹמֵר (במדבר י\"ד) \"וְעַתָּה יִגְדַּל נָא כֹּחַ ה'\":<br><br><b>ואת ידך.<\/b> זוֹ יְמִינְךָ שֶׁהִיא פְּשׁוּטָה לְכָל בָּאֵי עוֹלָם:<br><br><b>החזקה.<\/b> שֶׁאַתָּה כוֹבֵשׁ בְּרַחֲמִים אֶת מִדַּת הַדִּין בְּחָזְקָה (ספרי):<br><br><b>אשר מי אל וגו'.<\/b> אֵינְךָ דוֹמֶה לְמֶלֶךְ בָּשָׂר וָדָם שֶׁיֵּשׁ לוֹ יוֹעֲצִין וְסַנְקַתֶּדְרִין הַמַמְּחִין בְּיָדוֹ כְּשֶׁרוֹצֶה לַעֲשׂוֹת חֶסֶד וְלַעֲבֹר עַל מִדּוֹתָיו, אַתָּה אֵין מִי שֶׁיִּמְחֶה בְיָדְךָ אִם תִּמְחֹל לִי וּתְבַטֵּל גְּזֵרָתְךָ; וּלְפִי פְשׁוּטוֹ אַתָּה הַחִלּוֹתָ לְהַרְאוֹת אֶת עַבְדְּךָ מִלְחֶמֶת סִיחוֹן וְעוֹג, – כְּדִכְתִיב (דברים ב') \"רְאֵה הַחִלֹּתִי תֵּת לְפָנֶיךָ\", – הַרְאֵנִי מִלְחֶמֶת ל\"א מְלָכִים:", "rashi_en": "אדני אלהים O LORD, GOD — O Thou Who art. merciful (ה׳) in judgment (אלהים) (cf. Sifrei Devarim 26:10).<br><br>אתה החלות להראות את עבדך THOU DIDST BEGIN TO SHOW THY SERVANT an opening to stand and offer prayer, although the decree has been enacted; he said to Him: I learned to do so from Thee, for Thou didst say to me, (Exodus 32:10; cf. Rashi thereon) \"And now, leave Me alone”. Was I, then, holding Thee? But Thou didst say this to open the door and to show that it depended upon me to pray for them. Just so do I think to act now (Sifrei Devarim 27:2).<br><br>את גדלך [TO SHOW] THY GREATNESS — This means Thy attribute of goodness. Similarly it states, (Numbers 14:17, 18) \"And now, I beseech Thee, let the strength of my Lord be great, [according as thou hast spoken, saying: The Lord is long-suffering and of much mercy, etc.\"].<br><br>ואת ידך AND THY [STRONG] HAND — This refers to Thy right hand which is extended to all who enter the world (all human beings) [to receive them in penitence] (Sifrei Bamidbar 134:5).<br><br>החזקה [THY] STRONG [HAND] — I speak of it as Thy strong hand, because by showing mercy Thou forcibly (בחזקה) subduest the attribute of strict justice (Sifrei Bamidbar 134:5).<br><br>אשר מי אל וגו׳ FOR WHAT GOD IS THERE [… WHO CAN DO ACCORDING TO THY WORKS] — Thou art unlike a mortal king who has counsellors and assessors who would prevent him when he wishes to show kindness and to forgo, what is due to him: Thou, however, — there is none who can prevent Thee if Thou pardonest me and dost annul Thy decree (Sifrei Devarim 27:6). But according to its plain sense it means: \"Thou hast begun to show Thy servant the war with Sihon and Og, as it is written, (Deuteronomy 2:31) “Behold I have begun to give [Sihon and his land] before thee\"; let me behold also the war with the thirty-one kings of Canaan."}, {"ch": 3, "v": 25, "aliyah": 1, "heb": "אֶעְבְּרָה־נָּ֗א וְאֶרְאֶה֙ אֶת־הָאָ֣רֶץ הַטּוֹבָ֔ה אֲשֶׁ֖ר בְּעֵ֣בֶר הַיַּרְדֵּ֑ן הָהָ֥ר הַטּ֛וֹב הַזֶּ֖ה וְהַלְּבָנֹֽן׃", "onk": "אֵעִבַר כְּעַן וְאֶחֱזֵי יָת אַרְעָא טַבְתָא דִּי בְּעִבְרָא דְיַרְדְּנָא טוּרָא טָבָא הָדֵין <b>וּבֵית מַקְדָּשָׁא<\/b>:", "onk_en": "Please, allow me to cross over and see the good land that is across the Yardein, this good mountain and the Lebanon [<b>Beis Hamikdosh<\/b>].’’", "pj": "אֱעִיבַר כְּדוֹן וְאֶחֱמֵי יַת אַרְעָא טַבְתָא דִבְעִיבְרָא דְיוֹרְדְּנָא טַוְורָא טָבָא דְנַן דְּבֵיהּ מִתְבַּנְיָא קַרְתָּא דִירוּשְׁלֵם וְטַוָור לִיבְנָן דְּבֵיהּ עָתִיד לְמִישְׁרֵי שְׁכִינְתָּא", "pj_en": "Let me, I pray, pass over and see the good land that is beyond Jordan, that goodly mountain on which is builded the city of Jerusalem, and Mount Lebanon, where the Shekinah will dwell.", "tj": "", "tj_en": "", "rashi": "<b>אעברה נא.<\/b> אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה:<br><br><b>ההר הטוב הזה.<\/b> זוֹ יְרוּשָׁלַיִם:<br><br><b>והלבנן.<\/b> זֶה בֵּית הַמִּקְדָּשׁ (ספרי):", "rashi_en": "אעברה נא LET ME PASS OVER, I PRAY THEE — The term נא is a term of request (it does not here signify \"now\").<br><br>ההר הטוב הזה THAT GOODLY MOUNTAIN, i.e. Jerusalem (that was situated on hills) (Sifrei Bamidbar 134:5).<br><br>והלבנן AND LEBANON — this is a term for the Temple (Siphre)."}, {"ch": 3, "v": 26, "aliyah": 1, "heb": "וַיִּתְעַבֵּ֨ר יְהֹוָ֥ה בִּי֙ לְמַ֣עַנְכֶ֔ם וְלֹ֥א שָׁמַ֖ע אֵלָ֑י וַיֹּ֨אמֶר יְהֹוָ֤ה אֵלַי֙ רַב־לָ֔ךְ אַל־תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛י ע֖וֹד בַּדָּבָ֥ר הַזֶּֽה׃", "onk": "וַהֲוָה רְגַז <b>מִן קֳדָם<\/b> יְיָ עֲלַי בְּדִילְכוֹן וְלָא קַבִּיל מִנִּי וַאֲמַר יְיָ לִי סַגִּי לָךְ לָא תוֹסֵף לְמַלָּלָא <b>קֳדָמַי<\/b> עוֹד בְּפִתְגָּמָא הָדֵין:", "onk_en": "[<b>From before<\/b>] Adonoy grew angry at me through your fault and did not heed me; Adonoy said to me, ‘‘Enough for you! Do not go on speaking to [<b>before<\/b>] Me any more about this matter.", "pj": "וּרְגֵיז יְיָ עָלַי בִּגְלַלְכוֹן וְלָא קַבֵּיל צְלוֹתִי וַאֲמַר יְיָ לִי סַגִי לָךְ לָא תוֹסִיף לְמַלָלָא קָדָמַי תּוּב בְּפִתְגָמָא הָדֵין", "pj_en": "But the Lord was displeased with me on your account, and received not my prayer; but the Lord said to me: Let it be enough for thee; speak not before Me again of this matter:", "tj": "", "tj_en": "", "rashi": "<b>ויתעבר ה'.<\/b> נִתְמַלֵּא חֵמָה:<br><br><b>למענכם.<\/b> אַתֶּם גְּרַמְתֶּם לִי, וְכֵן הוּא אוֹמֵר (תהלים ק\"ו) \"וַיַּקְצִיפוּ עַל מֵי מְרִיבָה וַיֵּרַע לְמֹשֶׁה בַּעֲבוּרָם\":<br><br><b>רב לך.<\/b> שֶׁלֹּא יֹאמְרוּ הָרַב כַּמָּה קָשֶׁה וְהַתַּלְמִיד כַּמָּה סַרְבָן וּמַפְצִיר (סוטה י\"ג); דָּ\"אַ — <b>רב לך<\/b>, הַרְבֵּה מִזֶּה שָׁמוּר לְךָ, רַב טוּב הַצָּפוּן לְךָ (ספרי):", "rashi_en": "ויתעבר ה׳ This means, GOD WAS FILLED WITH WRATH (Sifrei Bamidbar 135).<br><br>למענכם ON ACCOUNT OF YOU — You caused this for me (that God was wroth with me); similarly it states, (Psalms 106:32) “And they provoked Him at the waters of Meriba, and He did evil to Moses on their account\".<br><br>רב לך LET IT SUFFICE THEE (i.e. pray no more), so that people should not say, “How harsh is the Master, and how obstinate and importunate is the disciple\" (Sotah 13b). Another explanation of רב לך (lit., there is much for you) — more than this is reserved for you; much is the goodness that is stored up for thee (Sifrei Bamidbar 135)."}, {"ch": 3, "v": 27, "aliyah": 1, "heb": "עֲלֵ֣ה&thinsp;<b>׀<\/b> רֹ֣אשׁ הַפִּסְגָּ֗ה וְשָׂ֥א עֵינֶ֛יךָ יָ֧מָּה וְצָפֹ֛נָה וְתֵימָ֥נָה וּמִזְרָ֖חָה וּרְאֵ֣ה בְעֵינֶ֑יךָ כִּי־לֹ֥א תַעֲבֹ֖ר אֶת־הַיַּרְדֵּ֥ן הַזֶּֽה׃", "onk": "סַק לְרֵישׁ רָמָתָא וּזְקוֹף עֵינָיךְ לְמַעֲרָבָא וּלְצִפּוּנָא וְלִדְרוֹמָא וּלְמָדִינְחָא וַחֲזֵי בְעֵינָיִךְ אֲרֵי לָא תְעִבַר יָת יַרְדְּנָא הָדֵין:", "onk_en": "Go up to the peak of the Pisgah and look around—west, north, south, and east—see with your own eyes; for you will not cross this Yardein.", "pj": "סוּק לְרֵישׁ רָמָתָא וּזְקַף עֵינָךְ לְמַעַרְבָא וּלְצִפּוּנָא וּלְדָרוֹמָא וּלְמַדִינְחָא וַחֲמֵי בְּעֵינָךְ אֲרוּם לָא תְעִיבַר יַת יוֹרְדְּנָא הָדֵין", "pj_en": "go up to the head of the mountain, and lift up thine eyes to the west, to the north, to the south, and to the east, and behold with thy eyes, for thou shalt not pass over this Jordan.", "tj": "", "tj_en": "", "rashi": "<b>וראה בעיניך.<\/b> בִּקַּשְׁתָּ מִמֶּנִּי וְאֶרְאֶה אֶת הָאָרֶץ הַטּוֹבָה, אֲנִי מַרְאֶה לְךָ אֶת כֻּלָּהּ שֶׁנֶּאֱמַר (דברים ל\"ב) \"וַיַּרְאֵהוּ ה' אֶת כָּל הָאָרֶץ\":", "rashi_en": "וראה בעיניך [LIFT UP THINE EYES …] AND SEE IT WITH THINE EYES — Thou didst request of Me, (v. 25) “Let me see the good land”; I will let thee see the whole of it (not the good territory alone), as it is said, (Deuteronomy 34:1) “And the Lord showed him all the land״ (cf. Sifrei Bamidbar 135)."}, {"ch": 3, "v": 28, "aliyah": 1, "heb": "וְצַ֥ו אֶת־יְהוֹשֻׁ֖עַ וְחַזְּקֵ֣הוּ וְאַמְּצֵ֑הוּ כִּי־ה֣וּא יַעֲבֹ֗ר לִפְנֵי֙ הָעָ֣ם הַזֶּ֔ה וְהוּא֙ יַנְחִ֣יל אוֹתָ֔ם אֶת־הָאָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה׃", "onk": "וּפַקֵּד יָת יְהוֹשֻׁעַ וְתַקֶּפְהִי וְאַלֶּמְהִי אֲרֵי הוּא יֵעִבַר קֳדָם עַמָּא הָדֵין וְהוּא יַחְסֵן יָתְהוֹן יָת אַרְעָא דִּי תֶחֱזֵי:", "onk_en": "And command Yehoshua, and encourage him and embolden him, because he will cross at the head of this people and he will apportion to them the land that you will see.’’", "pj": "וּפַקֵיד יַת יְהוֹשֻׁעַ וּתְקִיפוֹהִי וְאַלִימוֹהִי אֲרוּם הוּא יְעִיבַר קֳדָם עַמָּא הָדֵין וְהוּא יַחֲסִין יַתְהוֹן יַת אַרְעָא דְאַנְתְּ חָמֵי", "pj_en": "But instruct Jehoshua, strengthen and confirm him; for he shall go over before this people, and give them the inheritance of the land which thou seest.", "tj": "", "tj_en": "", "rashi": "<b>וצו את יהושע.<\/b> עַל הַטְּרָחוֹת וְעַל הַמַּשָּׂאוֹת וְעַל הַמְּרִיבוֹת:<br><br><b>וחזקהו ואמצהו.<\/b> בִּדְבָרֶיךָ, שֶׁלֹּא יֵרַךְ לִבּוֹ לוֹמַר כְּשֵׁם שֶׁנֶּעֱנַשׁ רַבִּי עֲלֵיהֶם, כָּךְ סוֹפִי לֵעָנֵשׁ עֲלֵיהֶם, מַבְטִיחוֹ אֲנִי כִּי הוּא יַעֲבֹר וְהוּא יַנְחִיל (ע' ספרי):<br><br><b>כי הוא יעבר.<\/b> אִם יַעֲבֹר לִפְנֵיהֶם יִנְחֲלוּ, וְאִם לָאו לֹא יִנְחֲלוּ; וְכֵן אַתָּה מוֹצֵא כְּשֶׁשָּׁלַח מִן הָעָם אֶל הָעַי וְהוּא יָשַׁב, \"וַיַּכּוּ מֵהֶם אַנְשֵׁי הָעַי וְגוֹ'\" (יהושע ז') וְכֵיוָן שֶׁנָּפַל עַל פָּנָיו אָמַר לוֹ \"קֻם לָךְ\" – <b>קם לך<\/b> כְּתִיב, אַתָּה הוּא הָעוֹמֵד בִּמְקוֹמְךָ וּמְשַׁלֵּחַ אֶת בָּנַי לַמִּלְחָמָה, לָמָּה זֶּה אַתָּה נֹפֵל עַל פָּנֶיךָ? לֹא כָךְ אָמַרְתִּי לְמֹשֶׁה רַבְּךָ אִם הוּא עוֹבֵר עוֹבְרִין וְאִם לָאו אֵין עוֹבְרִין (ספרי):", "rashi_en": "וצו את יהושע AND GIVE JOSHUA CHARGE regarding the cumbrance, the burdens and strifes that he will have to bear (cf. Deuteronomy 1:12).<br><br>וחזקהו ואמצהו AND STRENGTHEN HIM AND MAKE HIM FIRM through thy words, so that he may not become faint-hearted, saying, “Just as my master was punished on account of them, so eventually will I be punished on account of them and not enter the land. I promise him “that he shall pass over [before this people] and he shall cause [them] to inherit [the land]”” (cf. Sifrei Devarim 29:9).<br><br>כי הוא יעבר (this may mean: if he passes) — If he will pass before them, they will possess the land, and if not, they will not possess it. So, indeed, you find that when he sent some of the people against Ai and he remained in the camp, “the men of Ai smote of them [thirtysix men]” (Joshua 7:5). And when he fell on his face, He said to him, קם לך: the verb is written קם (without ו, so that it may be read קָם) i.e. “It is thou who standest in thy place and sendest My children to war, who hast brought about this defeat. Why is it that thou fallest on thy face? Did I not thus tell thy master, Moses: If he will pass, they will pass on, but if not, they will not pass on? (Sifrei Devarim 29:9)."}, {"ch": 3, "v": 29, "aliyah": 1, "heb": "וַנֵּ֣שֶׁב בַּגָּ֔יְא מ֖וּל בֵּ֥ית פְּעֽוֹר׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וִיתֵבְנָא<\/b> בְחֵילָתָא לָקֳבֵל בֵּית פְּעוֹר:", "onk_en": "We lived [<b>dwelt<\/b>] in the valley facing Beis Peor.", "pj": "וְשָׁרִינָן בְּחֵילְתָא בַּכְיָין עַל חוֹבֵינָן דְּאִיזְדַוֵיגָן לְפַלְחֵי טַעֲוַת פְּעוֹר", "pj_en": "And we dwelt in the valley, weeping for our sins, because we had been joined with the worshippers of the idol of Peor.", "tj": "וּשְׁרֵינָן בְּחֵילְתָא בַּכְיָן עַל חוֹבֵינָן וּמִתְוַדִּין עַל חֲטֵינָן עַל דְּאַדְבְּקִינָן לְפַלְחֵי טַעֲוָותָא דְבַעַל פְּעוֹר:", "tj_en": "And we dwelt in the valley weeping for our guilt, and confessing our sins, for that we had been joined with the worshippers of the idol of Baal Peor.", "rashi": "<b>ונשב בגיא וגו'.<\/b> וְנִצְמַדְתֶּם לַעֲ\"זָ, וְאַעַ\"פִּ כֵן <b>ועתה ישראל שמע אל החקים<\/b>, וְהַכֹּל מָחוּל לְךָ, וַאֲנִי לֹא זָכִיתִי לִמָּחֵל לִי:", "rashi_en": "ונשב בגיא וגו׳ SO WE ABODE IN THE VALLEY [OVER AGAINST BETH PEOR], — and ye associated yourselves with idol-worship, yet, however, ועתה ישראל שמע אל החקים NOW, O ISRAEL, HEARKEN TO THE STATUTES and everything will be forgiven thee. But I — I was not privileged that it was forgiven me (Sifrei Devarim 30:2)."}, {"ch": 4, "v": 1, "aliyah": 1, "heb": "וְעַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל־הַֽחֻקִּים֙ וְאֶל־הַמִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְכֶ֖ם לַעֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּבָאתֶם֙ וִֽירִשְׁתֶּ֣ם אֶת־הָאָ֔רֶץ אֲשֶׁ֧ר יְהֹוָ֛ה אֱלֹהֵ֥י אֲבֹתֵיכֶ֖ם נֹתֵ֥ן לָכֶֽם׃", "onk": "וּכְעַן יִשְׂרָאֵל שְׁמַע לִקְיָמַיָּא וּלְדִינַיָּא דִּי אֲנָא מְאַלֵּף יָתְכוֹן לְמֶעְבַּד בְּדִיל דְּתֵיחוּן וְתֵיתוּן וְתֵירְתוּן יָת אַרְעָא דִּי יְיָ אֱלָהָא דַאֲבָהָתְכוֹן יָהֵב לְכוֹן:", "onk_en": "And now Yisroel, listen to the statutes and to the laws that I am teaching you to fulfill, in order that you will live, and will arrive in, and will inherit the land that Adonoy, the God of your fathers, is giving you.", "pj": "וּכְדוֹן יִשְרָאֵל שְׁמָעוּ לְקַיָּימַיָא וּלְדִינַיָא דַּאֲנָא מַלֵף יַתְכוֹן לְמֶעֱבַד מִן בִּגְלַל דְּתֵיחוֹן וְתֵיעֲלוּן וְתֵירְתוּן יַת אַרְעָא דַיְיָ אֱלָהָא דְאַבְהַתְכוֹן יָהִיב לְכוֹן", "pj_en": "And now, Israel, hear the statutes and judgments which I teach you to do, that you may live, and go in and inherit the land the Lord God of your fathers giveth you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 2, "aliyah": 1, "heb": "לֹ֣א תֹסִ֗פוּ עַל־הַדָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְכֶ֔ם וְלֹ֥א תִגְרְע֖וּ מִמֶּ֑נּוּ לִשְׁמֹ֗ר אֶת־מִצְוֺת֙ יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְכֶֽם׃", "onk": "לָא תוֹסְפוּן עַל פִּתְגָּמָא דִּי אֲנָא מְפַקֵּד יָתְכוֹן וְלָא תִמְנְעוּן מִנֵּיהּ לְמִטַּר יָת פִּקּוּדַיָּא דַּיְיָ אֱלָהֲכוֹן דִּי אֲנָא מְפַקֵּד יָתְכוֹן:", "onk_en": "Do not add to the matters that I am commanding you, and do not subtract from them; to guard the commandments of Adonoy, your God, that I am commanding you.", "pj": "לֵיתְכוֹן רַשָּׁאִין לְמוֹסָפָא עַל פִּתְגָמַיָא דַאֲנָא מְפַקֵּיד יַתְכוֹן וְלָא תְבַצְרוּן מִינֵיהּ מִן לָא לְמִנְטוֹר יַת פִּקּוּדַיָא דַיְיָ אֱלָהָכוֹן דַּאֲנָא מְפַקֵּיד יַתְכוֹן", "pj_en": "Ye shall not add to the words that I teach you nor diminish them, but keep the commandments of the Lord your God which I command you.", "tj": "", "tj_en": "", "rashi": "<b>לא תספו.<\/b> כְּגוֹן חָמֵשׁ פָּרָשִׁיּוֹת בַּתְּפִלִּין, חֲמֵשֶׁת מִינִין בַּלּוּלָב, וְחָמֵשׁ צִיצִיּוֹת, וְכֵן \"לֹא תִגְרְעוּ\" (ע' ספרי פ' ראה):", "rashi_en": "לא תספו YE SHALL NOT ADD — For instance, to place five chapters in the Tephillin, to employ five species of fruit and plants in the fulfilment of the command of Lulab And to place five fringes on one’s garment. Thus, too, must we explain the following words ולא תגרעו, Ye shall not diminish [from it]\" (Sifrei Devarim 82:4)."}, {"ch": 4, "v": 3, "aliyah": 1, "heb": "עֵֽינֵיכֶם֙ הָֽרֹא֔וֹת אֵ֛ת אֲשֶׁר־עָשָׂ֥ה יְהֹוָ֖ה בְּבַ֣עַל פְּע֑וֹר כִּ֣י כׇל־הָאִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל־פְּע֔וֹר הִשְׁמִיד֛וֹ יְהֹוָ֥ה אֱלֹהֶ֖יךָ מִקִּרְבֶּֽךָ׃", "onk": "עֵינֵיכוֹן חָזָן יָת דִּי עֲבַד יְיָ בְּבַעַל פְּעוֹר אֲרֵי כָּל גַּבְרָא דִּי אֲזַל בָּתַר בַּעַל פְּעוֹר שֵׁצְיֵיהּ יְיָ אֱלָהָךְ מִבֵּינָךְ:", "onk_en": "Your eyes have witnessed what Adonoy did regarding Ba’al Peor, that every man who followed Ba’al Peor—Adonoy, your God, destroyed him from within you.", "pj": "עֵינֵיכוֹן חֲמִיתוּן יַת דְּעָבַד מֵימְרָא דַיְיָ בְּפַלְחֵי טַעֲוַות פְּעוֹר אֲרוּם כָּל בַּר נַשׁ דְּטָעָא בָּתַר טַעֲוַות פְּעוֹר שֵׁצְיֵיהּ יְיָ אֱלָהָךְ מִבֵּינָךְ", "pj_en": "Your eyes have seen what the Word of the Lord hath done to the worshippers of the idol Peor: for all the men who went astray after the idol Peor, the Lord thy God hath destroyed from among you;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 4, "aliyah": 1, "heb": "וְאַתֶּם֙ הַדְּבֵקִ֔ים בַּיהֹוָ֖ה אֱלֹהֵיכֶ֑ם חַיִּ֥ים כֻּלְּכֶ֖ם הַיּֽוֹם׃", "onk": "וְאַתּוּן דְּאַדְבֶּקְתּוּן <b>בְּדַחַלְתָּא<\/b> דַיְיָ אֱלָהֲכוֹן קַיָּמִין כֻּלְּכוֹן יוֹמָא דֵין:", "onk_en": "But you who cling to [<b>the fear of<\/b>] Adonoy, your God—all of you are alive today.", "pj": "וְאַתּוּן דִּדְבַקְתּוּן בְּדַחַלְתָּא דַיְיָ אֱלָהָכוֹן קַיָּימִין כּוּלְכוֹן יוֹמָא דֵין", "pj_en": "but you who have cleaved to the worship of the Lord your God are alive all of you this day.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 5, "aliyah": 2, "heb": "רְאֵ֣ה&thinsp;<b>׀<\/b> לִמַּ֣דְתִּי אֶתְכֶ֗ם חֻקִּים֙ וּמִשְׁפָּטִ֔ים כַּאֲשֶׁ֥ר צִוַּ֖נִי יְהֹוָ֣ה אֱלֹהָ֑י לַעֲשׂ֣וֹת כֵּ֔ן בְּקֶ֣רֶב הָאָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "חֲזוֹ דְּאַלֵּפִית יָתְכוֹן קְיָמַיָּא וְדִינַיָּא כְּמָא דִי פַקְּדַנִי יְיָ אֱלָהָי לְמֶעְבַּד כֵּן בְּגוֹ אַרְעָא דִּי אַתּוּן עַלִּין תַּמָּן לְמֵירְתַהּ:", "onk_en": "See, I have taught you statutes and laws as I was commanded by Adonoy, my God, to fulfill within the land that you are arriving there to inherit.", "pj": "חָמוּן דְּאַלֵיפִית יַתְכוֹן קְיָימִין וְדִינִין הֵיכְמָא דְפַקְדַנִי יְיָ אֱלהִים לְמֶעֱבַד הֵיכְנָא בְגוֹ אַרְעָא דְאַתּוּן עָאלִין לְתַמָּן לְמֵירְתָהּ", "pj_en": "See, I teach you statutes and judgments, as the Lord God hath taught me, that you may so do in the land which you are entering to possess it.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 6, "aliyah": 2, "heb": "וּשְׁמַרְתֶּם֮ וַעֲשִׂיתֶם֒ כִּ֣י הִ֤וא חׇכְמַתְכֶם֙ וּבִ֣ינַתְכֶ֔ם לְעֵינֵ֖י הָעַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּן אֵ֚ת כׇּל־הַחֻקִּ֣ים הָאֵ֔לֶּה וְאָמְר֗וּ רַ֚ק עַם־חָכָ֣ם וְנָב֔וֹן הַגּ֥וֹי הַגָּד֖וֹל הַזֶּֽה׃", "onk": "וְתִטְּרוּן וְתַעְבְּדוּן אֲרֵי הִיא חָכְמַתְכוֹן וְסוּכְלְתָנוּתְכוֹן לְעֵינֵי עַמְמַיָּא דִּי יִשְׁמְעוּן יָת כָּל קְיָמַיָּא הָאִלֵּין וְיֵמְרוּן לְחוֹד עַם חַכִּים וְסוּכְלְתָן עַמָּא רַבָּא הָדֵין:", "onk_en": "You will preserve and you will fulfill [them], for that [displays] your wisdom and your understanding before the nations, who will hear all these statutes and will say, ‘‘The only wise and understanding people is this great nation.’’", "pj": "וְתִנְטְרוּן וְתַעַבְדוּן יַת אוֹרַיְיתָא אֲרוּם הִוא חָכְמַתְכוֹן וְסוּכְלְתָנוּתְכוֹן לְמֵיחְמֵי עַמְמַיָא דְיִשְׁמְעוּן יַת כָּל קְיָימַיָא הָאִילֵין וְיֵימְרוּן לְחוֹד עַם חַכִּים וְסוּכְלְתָן עַמָא רַבָּא הָדֵין", "pj_en": "So shall you observe and perform the law; for it is your wisdom and understanding in the sight of the peoples, who will hear all these statutes, and will say: How wise and intelligent is this great people!", "tj": "", "tj_en": "", "rashi": "<b>ושמרתם.<\/b> זוֹ מִשְׁנָה:<br><br><b>ועשיתם.<\/b> כְּמַשְׁמָעוֹ (שם):<br><br><b>כי הוא חכמתכם ובינתכם וגו'.<\/b> בָּזֹאת תֵּחָשְׁבוּ חֲכָמִים וּנְבוֹנִים לְעֵינֵי הָעַמִּים:", "rashi_en": "ושמרתם AND YE SHALL BE ON THE WATCH [TO DO] — This refers to the study of the laws (Sifrei Devarim 58),<br><br>ועשיתם — this must be explained according to what it implies: AND YE SHALL DO.<br><br>כי היא חכמתכם ובינתכם וגו׳ FOR THIS IS YOUR WISDOM AND UNDERSTANDING [IN THE EYES OF THE PEOPLES] — i.e. through this ye will be accounted wise and understanding men in the eyes of the peoples."}, {"ch": 4, "v": 7, "aliyah": 2, "heb": "כִּ֚י מִי־ג֣וֹי גָּד֔וֹל אֲשֶׁר־ל֥וֹ אֱלֹהִ֖ים קְרֹבִ֣ים אֵלָ֑יו כַּיהֹוָ֣ה אֱלֹהֵ֔ינוּ בְּכׇל־קׇרְאֵ֖נוּ אֵלָֽיו׃", "onk": "אֲרֵי מָן עַם רַב דִּי לֵיהּ אֱלָהָא קָרִיב לֵיהּ <b>לְקַבָּלָא צְלוֹתֵיהּ בְּעִדַּן עַקְתֵיהּ<\/b> כַּיְיָ אֱלָהָנָא בְּכָל עִדָּן דַּאֲנַחְנָא <b>מְצַלִּין קֳדָמוֹהִי<\/b>:", "onk_en": "For who is a great nation that has God close to it [<b>to receive its prayers in time of tribulation<\/b>] as [is] Adonoy, our God, whenever we call to [<b>pray before<\/b>] Him?", "pj": "אֲרוּם הֵידָא אוּמָא רַבָּא דְּאִית לֵיהּ אֱלָהָא קָרִיב לְוָתֵיהּ בְּשׁוּם מֵימְרָא דַיְיָ אֱלָהֵן אוֹרְחֵיהוֹן דְּעַמְמַיָא נַטְלִין דְחַלְתְּהוֹן עַל כַּתְפֵיהוֹן וְדַמְיַין קְרִיבִין לְהוֹן וְהִינוּן רְחִיקִין מְטוֹל דְּלָא שְׁמָעִין בְּאוּדְנֵיהוֹן בְּרַם מֵימְרָא דַיְיָ יָתִיב עַל כּוּרְסֵיהּ רָם וּמְנַטֵּל וְשָׁמַע צְלוֹתָנָא בְּכָל עִידַן דַּאֲנַן מְצַלְיַין קַמֵיהּ וְעָבִיד בָּעוּתָן", "pj_en": "For what people so great, to whom the Lord is so nigh in the Name of the Word of the Lord? But the custom of (other) nations is to carry their gods upon their shoulders, that they may seem to be nigh them; but they cannot hear with their ears, (be they nigh or) be they afar off; but the Word of the Lord sitteth upon His throne high and lifted up, and heareth our prayer what time we pray before Him and make our petitions.", "tj": "אֲרוּם הַיְידָא אוּמָא רַבָּא דְּאִית לָהּ אֱלָהָא דְיִקְרַב לְוָותָהּ כַּיְיָ אֱלָהֵן בְּכָל שָׁעָה דִי אֲנַן קַרְיַין לֵיהּ וְהוּא עָנֵי יָתָן:", "tj_en": "For what people is so great, who hath God so nigh to it as the Lord our God is, in every hour that we cry unto Him, and He answereth us?", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 8, "aliyah": 2, "heb": "וּמִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר־ל֛וֹ חֻקִּ֥ים וּמִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּכֹל֙ הַתּוֹרָ֣ה הַזֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִפְנֵיכֶ֖ם הַיּֽוֹם׃", "onk": "וּמָן עַם רַב דִּי לֵיהּ קְיָמִין וְדִינִין קַשִּׁיטִין כְּכֹל אוֹרַיְתָא הָדָא דִּי אֲנָא יָהֵב קֳדָמֵיכוֹן יוֹמָא דֵין:", "onk_en": "And who is a great nation that has upright statutes and laws, like this entire Torah that I am putting before you today?", "pj": "וְהֵידָא אוּמָא רַבָּא דִילֵיהּ קְיָימִין וְדִינִין תְּרִיצִין כְּכָל אוֹרַיְיתָא הָדָא דַאֲנָא סְדַר קֳדָמֵיכוֹן יוֹמָא דֵין", "pj_en": "And what people have statutes and right judgments according to all this law which I order before you this day?", "tj": "", "tj_en": "", "rashi": "<b>חקים ומשפטים צדיקם.<\/b> הֲגוּנִים וּמְקֻבָּלִים:", "rashi_en": "חקים ומשפטים צדיקים STATUTES AND RIGHTEOUS JUDGMENTS — i.e. proper and acceptable ones."}, {"ch": 4, "v": 9, "aliyah": 2, "heb": "רַ֡ק הִשָּׁ֣מֶר לְךָ֩ וּשְׁמֹ֨ר נַפְשְׁךָ֜ מְאֹ֗ד פֶּן־תִּשְׁכַּ֨ח אֶת־הַדְּבָרִ֜ים אֲשֶׁר־רָא֣וּ עֵינֶ֗יךָ וּפֶן־יָס֙וּרוּ֙ מִלְּבָ֣בְךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑יךָ וְהוֹדַעְתָּ֥ם לְבָנֶ֖יךָ וְלִבְנֵ֥י בָנֶֽיךָ׃", "onk": "לְחוֹד אִסְתַּמַּר לָךְ וְטַר נַפְשָׁךְ לַחֲדָא דִּילְמָא תִנְשֵׁי יָת פִּתְגָּמַיָּא דִּי חֲזוֹ עֵינָיִךְ וְדִילְמָא יְעִדּוּן מִלִּבָּךְ כֹּל יוֹמֵי חַיָּיךְ וּתְהוֹדְעִנּוּן לִבְנָיךְ וְלִבְנֵי בְנָיךְ:", "onk_en": "Look out for yourself and guard your life exceedingly, lest you forget the words your eyes witnessed, and lest they are removed from your mind, all the days of your life; you will make them known to your children and to your grandchildren.", "pj": "לְחוֹד אִסְתַּמְרוּ לְכוֹן וְטוּרוּ נַפְשָׁתֵיכוֹן לַחֲדָא דִלְמָא תִתְנְשׁוּן יַת פִּתְגָמַיָא דַחֲמִיתּוּן בְּסִינַי בְּעֵינֵיכוֹן וְדִלְמָא יְעִידוּן מִן לִבְּכוֹן כָּל יוֹמֵי חַיֵּיכוֹן וּתְלוֹפוּנוּן לִבְנֵיכוֹן וְלִבְנֵי בְנֵיכוֹן", "pj_en": "Only take heed to yourselves and diligently keep your souls, lest you forget the things which you beheld with your eyes at Sinai, and that they depart not from thy heart all the days of thy life, and you may teach them to your children, and to your childrens children;", "tj": "", "tj_en": "", "rashi": "<b>רק השמר לך … פן תשכח את הדברים.<\/b> אָז, כְּשֶׁלֹּא תִשְׁכְּחוּ אוֹתָם וְתַעֲשׂוּם עַל אֲמִתָּתָם, תֵּחָשְׁבוּ חֲכָמִים וּנְבוֹנִים, וְאִם תְּעַוְּתוּ אוֹתָם מִתּוֹךְ שִׁכְחָה, תֵּחָשְׁבוּ שׁוֹטִים:", "rashi_en": "רק השמר לך … פן תשכח את הדברים ONLY TAKE HEED TO THYSELF … LEST THOU FORGET THE THINGS — But only then when you do not forget them but will do them in their correct manner, will you be accounted wise and understanding men, but if you do them in an incorrect manner through forgetfulness, you will be accounted foolish."}, {"ch": 4, "v": 10, "aliyah": 2, "heb": "י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִפְנֵ֨י יְהֹוָ֣ה אֱלֹהֶ֘יךָ֮ בְּחֹרֵב֒ בֶּאֱמֹ֨ר יְהֹוָ֜ה אֵלַ֗י הַקְהֶל־לִי֙ אֶת־הָעָ֔ם וְאַשְׁמִעֵ֖ם אֶת־דְּבָרָ֑י אֲשֶׁ֨ר יִלְמְד֜וּן לְיִרְאָ֣ה אֹתִ֗י כׇּל־הַיָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל־הָ֣אֲדָמָ֔ה וְאֶת־בְּנֵיהֶ֖ם יְלַמֵּדֽוּן׃", "onk": "יוֹמָא דִּי קַמְתָּא קֳדָם יְיָ אֱלָהָךְ בְּחֹרֵב כַּד אֲמַר יְיָ לִי כְּנוֹשׁ <b>קֳדָמַי<\/b> יָת עַמָּא וְאַשְׁמְעִנּוּן יָת פִּתְגָּמָי דִּי יֵלְפוּן לְמִדְחַל קֳדָמַי כָּל יוֹמַיָּא דִּי אִנּוּן קַיָּמִין עַל אַרְעָא וְיָת בְּנֵיהוֹן יַלְּפוּן:", "onk_en": "The day you stood before Adonoy, your God, at Choreiv, when Adonoy said to me, ‘‘Assemble for [<b>before<\/b>] Me the people, and I will let them hear My statements, so that they will learn to fear Me all the years that they are living on the land, and will teach their sons.’’", "pj": "וְתִדְכּוּן גַּרְמֵיכוֹן בְּמַעַסְקְכוֹן בָּהּ הֵי כְּיוֹמָא דְקַמְתּוּן קֳדָם יְיָ אֱלָהָכוֹן בְּחוֹרֵב בִּזְמַן דַּאֲמַר יְיָ לִי כְּנוֹשׁ קֳדָמַי יַת עַמָא וְאַשְׁמִיעִינוּן יַת פִּתְגָמַי דְּיֵלְפוּן לְמִדְחַל מִן קֳדָמַי כָּל יוֹמַיָא דְהִינוּן קַיְימִין עַל אַרְעָא וְיַת בְּנֵיהוֹן יְאַלִיפוּן", "pj_en": "and that you may make yourselves pure in your transactions thereby, as in the day when you stood before the Lord your God at Horeb, at the time when the Lord said to me: Gather the people before Me, that they may hear My words, by which they shall learn to fear before Me all the days that they remain upon the earth, and may teach their children.", "tj": "", "tj_en": "", "rashi": "<b>יום אשר עמדת.<\/b> מוּסָב עַל מִקְרָא שֶׁלְּמַעְלָה מִמֶּנּוּ <b>אשר ראו עיניך<\/b> – <b>יום אשר עמדת בחרב<\/b> אֲשֶׁר רָאִיתָ הַקּוֹלוֹת וְאֶת הַלַּפִּידִים:<br><br><b>יִלְמְדוּן.<\/b> יֵלְפוּן – לְעַצְמָם:<br><br><b>יְלַמֵּדוּן.<\/b> יְאַלְּפוּן – לַאֲחֵרִים:", "rashi_en": "יום אשר עמדת THE DAY THAT THOU STOODEST — This is to be connected with the preceding verse thus: [The things] which thine eyes saw … on the day that thou stoodest … at Horeb, — where thou didst perceive the thunder and lightning.<br><br>יִלְמְדוּן — The Targum is יֵלְפוּן, “They shall learn\" (more lit., the action reverts to themselves), while —<br><br>יְלַמֵּדוּן the Targum is יְאַלְפוּן, “They shall teach\" (more lit., the action reverts to others)."}, {"ch": 4, "v": 11, "aliyah": 2, "heb": "וַתִּקְרְב֥וּן וַתַּֽעַמְד֖וּן תַּ֣חַת הָהָ֑ר וְהָהָ֞ר בֹּעֵ֤ר בָּאֵשׁ֙ עַד־לֵ֣ב הַשָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַעֲרָפֶֽל׃", "onk": "וּקְרֶבְתּוּן וְקַמְתּוּן <b>בְּשִׁפּוֹלֵי<\/b> טוּרָא וְטוּרָא בָּעֵר בְּאֶשָּׁתָא עַד <b>צֵית<\/b> שְׁמַיָּא חֲשׁוֹכָא עֲנָנָא וַאֲמִיטְתָא:", "onk_en": "You approached and stood beneath [<b>at the base of<\/b>] the mountain, while the mountain was burning with fire up to the heart [<b>height<\/b>] of the heavens—darkness, cloud, and thick cloud.", "pj": "וְקָרֵיבְתּוּן וְקַמְתּוּן בְּשִׁפּוּלֵי טוּרָא וְטַוְורָא דָלִיק בְּאֵישָׁתָא וְשַׁלְהוֹבֵיהּ מָטֵי עַד צֵית שְׁמַיָא חֲשׁוֹכָא עֲנָנָא וְאַמִיטְתָא", "pj_en": "And you drew near, and stood at the lower part of the mount, and the mountain burned with fire, and its flame went up to the height of the heavens, with darkness, clouds, and shadows.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 12, "aliyah": 2, "heb": "וַיְדַבֵּ֧ר יְהֹוָ֛ה אֲלֵיכֶ֖ם מִתּ֣וֹךְ הָאֵ֑שׁ ק֤וֹל דְּבָרִים֙ אַתֶּ֣ם שֹׁמְעִ֔ים וּתְמוּנָ֛ה אֵינְכֶ֥ם רֹאִ֖ים זוּלָתִ֥י קֽוֹל׃", "onk": "וּמַלִּיל יְיָ עִמְּכוֹן מִגּוֹ אֶשָּׁתָא קַל פִּתְגָּמִין אַתּוּן שָׁמְעִין וּדְמוּת לֵיתֵיכוֹן חָזָן אֶלָּהֵן קָלָא:", "onk_en": "Adonoy addressed you from within the fire; you heard the sound of speech, seeing no image, solely sound.", "pj": "וּמַלֵּיל יְיָ עִמְכוֹן בְּטוּרָא מִגּוֹ אֵישָׁתָא קַל דְּבִירָא אַתּוּן שָׁמְעִין וּדְמוּ לָא חֲמִיתוּן אֱלָהֵן קַל מְמַלֵּל", "pj_en": "And the Lord spake with you on the mountain from the midst of the fire: you heard the voice of the Word {Dibbura}, but you saw no likeness, but only a voice speaking.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 13, "aliyah": 2, "heb": "וַיַּגֵּ֨ד לָכֶ֜ם אֶת־בְּרִית֗וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְכֶם֙ לַעֲשׂ֔וֹת עֲשֶׂ֖רֶת הַדְּבָרִ֑ים וַֽיִּכְתְּבֵ֔ם עַל־שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים׃", "onk": "וְחַוִּי לְכוֹן יָת קְיָמֵיהּ דִּי פַקִּיד יָתְכוֹן לְמֶעְבַּד עֲשֶׂרֶת פִּתְגָּמִין וּכְתָבִנוּן עַל תְּרֵין לוּחֵי אַבְנַיָּא:", "onk_en": "He told you His covenant, which He commanded you to fulfill—the ten statements—and He wrote them on two tablets of stone.", "pj": "וּתְנֵי לְכוֹן יַת קְיָמֵיהּ דְּפַקֵּיד יַתְכוֹן לְמֶעֱבַד עִישַרְתֵּי דִבּוּרַיָא וְכַתְבִינוּן עַל לוּחֵי סַמְפִּירִינוּן", "pj_en": "And He proclaimed to you His covenant which He commanded you to per- form; Ten Words {dibbura} which He wrote upon sapphire tablets.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 14, "aliyah": 2, "heb": "וְאֹתִ֞י צִוָּ֤ה יְהֹוָה֙ בָּעֵ֣ת הַהִ֔וא לְלַמֵּ֣ד אֶתְכֶ֔ם חֻקִּ֖ים וּמִשְׁפָּטִ֑ים לַעֲשֹׂתְכֶ֣ם אֹתָ֔ם בָּאָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּה לְרִשְׁתָּֽהּ׃", "onk": "וְיָתִי פַּקִּיד יְיָ בְּעִדָּנָא הַהִיא לְאַלָּפָא יָתְכוֹן קְיָמִין וְדִינִין לְמֶעְבָּדְכוֹן יָתְהוֹן בְּאַרְעָא דִּי אַתּוּן עָבְרִין תַּמָּן לְמֵירְתַהּ:", "onk_en": "Adonoy commanded me at that time to teach you statutes and laws, for you to fulfill them in the land that you are crossing over there to inherit.", "pj": "וְיָתִי פַקֵּיד יְיָ בְּעִידָנָא הַהִוא לְמַלְפָא יַתְכוֹן קְיָמִין וְדִינִין לְמֶעֱבַדְכוֹן יַתְהוֹן בְּאַרְעָא דְאַתּוּן עָבְרִין לְתַמָּן לְמֵירְתָהּ", "pj_en": "And the Lord commanded me at that time to teach you the statutes and judgments, that you may do them in the land which you pass over to possess.", "tj": "", "tj_en": "", "rashi": "<b>ואתי צוה ה' ללמד אתכם.<\/b> תּוֹרָה שֶׁבְּעַל פֶּה:", "rashi_en": "ואתי צוה, ה' ללמד אתכם AND THE LORD COMMANDED ME TO TEACH YOU, the Oral Law."}, {"ch": 4, "v": 15, "aliyah": 2, "heb": "וְנִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְנַפְשֹׁתֵיכֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כׇּל־תְּמוּנָ֔ה בְּי֗וֹם דִּבֶּ֨ר יְהֹוָ֧ה אֲלֵיכֶ֛ם בְּחֹרֵ֖ב מִתּ֥וֹךְ הָאֵֽשׁ׃", "onk": "וְתִסְתַּמְּרוּן לַחֲדָא לְנַפְשָׁתֵיכוֹן אֲרֵי לָא חֲזֵיתוּן כָּל דְּמוּת בְּיוֹמָא דִּי מַלִּיל יְיָ עִמְּכוֹן בְּחֹרֵב מִגּוֹ אֶשָּׁתָא:", "onk_en": "Be extremely cautious for your lives, for you did not see any image on the day Adonoy addressed you at Choreiv from within the fire.", "pj": "וְתִסְתַּמְרוּן לַחֲדָא לְנַפְשָׁתֵיכוֹן אֲרוּם לָא חֲמִיתוּן כָּל דְּמוּ בְּיוֹמָא דְמַלֵּיל יְיָ עִמְכוֹן בְּחוֹרֵב מִגּוֹ אֵישָׁתָא", "pj_en": "Keep then your souls diligently; for you saw no likeness on the day when the Lord spake with you in Horeb from the midst of the fire.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 16, "aliyah": 2, "heb": "פֶּ֨ן־תַּשְׁחִת֔וּן וַעֲשִׂיתֶ֥ם לָכֶ֛ם פֶּ֖סֶל תְּמוּנַ֣ת כׇּל־סָ֑מֶל תַּבְנִ֥ית זָכָ֖ר א֥וֹ נְקֵבָֽה׃", "onk": "דִּילְמָא תְחַבְּלוּן וְתַעְבְּדוּן לְכוֹן צֶלֶם דְּמוּת כָּל צוּרָא דְּמוּת דְּכַר אוֹ נֻקְבָּא:", "onk_en": "Lest you destructively make for yourselves a statue in the image of any form, the representation of a male or a female;", "pj": "הֲווֹ זְהִירִין דְּלָא תְחַבְּלוּן עוֹבָדֵיכוֹן וְתַעַבְדוּן לְכוֹן צְלַם דְּמוּ דְּכָל טָעוּ דְמוּ דִדְכַר אוֹ דְנוּקְבָא", "pj_en": "Be admonished, lest you corrupt your works, and make to you an image or likeness of any idol, the likeness either male or female", "tj": "", "tj_en": "", "rashi": "<b>סמל.<\/b> צוּרָה:", "rashi_en": "סמל means “form”."}, {"ch": 4, "v": 17, "aliyah": 2, "heb": "תַּבְנִ֕ית כׇּל־בְּהֵמָ֖ה אֲשֶׁ֣ר בָּאָ֑רֶץ תַּבְנִית֙ כׇּל־צִפּ֣וֹר כָּנָ֔ף אֲשֶׁ֥ר תָּע֖וּף בַּשָּׁמָֽיִם׃", "onk": "דְּמוּת כָּל בְּעִירָא דִּי בְאַרְעָא דְּמוּת כָּל צִפַּר גַּדְפָא דִּי פָרַח <b>בַּאֲוֵר רְקִיעַ<\/b> שְׁמַיָּא:", "onk_en": "[or] the representation of any animal that is on earth; [or] the representation of any winged bird that flies in [<b>the air of the expanse of<\/b>] the sky;", "pj": "דְּמוּ דְכָל בְּעִירָא דִי בְאַרְעָא דְמוּ דְכָל צִפַּר גַּפָּא דְפָרְחָא בְאֲוִיר רְקִיעַ שְׁמַיָא", "pj_en": "of any beast of the earth, of any winged bird that flieth in the air in the expanse of heaven,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 18, "aliyah": 2, "heb": "תַּבְנִ֕ית כׇּל־רֹמֵ֖שׂ בָּאֲדָמָ֑ה תַּבְנִ֛ית כׇּל־דָּגָ֥ה אֲשֶׁר־בַּמַּ֖יִם מִתַּ֥חַת לָאָֽרֶץ׃", "onk": "דְּמוּת כָּל רִחֲשָׁא דִי בְאַרְעָא דְּמוּת כָּל נוּנֵי דִי בְמַיָּא מִלְּרַע לְאַרְעָא:", "onk_en": "[or] the representation of anything that crawls on the ground; [or] the representation of any fish that is in the water beneath the earth.", "pj": "דְּמוּ דְּכָל רִיחֲשָׁא דִבְאַרְעָא דְמוּ כָּל נוּנֵי דִבְמַיָא מִלְרַע לְאַרְעָא", "pj_en": "of any reptile on the ground, or of any fish in the waters under the earth.", "tj": "דְּמוּת כָּל נוּנַיָא דְאִית בְּמַיָא מִתְּחוֹת לְאַרְעָא:", "tj_en": "The likeness of any fishes which are in the waters under the earth.", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 19, "aliyah": 2, "heb": "וּפֶן־תִּשָּׂ֨א עֵינֶ֜יךָ הַשָּׁמַ֗יְמָה וְֽ֠רָאִ֠יתָ אֶת־הַשֶּׁ֨מֶשׁ וְאֶת־הַיָּרֵ֜חַ וְאֶת־הַכּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַשָּׁמַ֔יִם וְנִדַּחְתָּ֛ וְהִשְׁתַּחֲוִ֥יתָ לָהֶ֖ם וַעֲבַדְתָּ֑ם אֲשֶׁ֨ר חָלַ֜ק יְהֹוָ֤ה אֱלֹהֶ֙יךָ֙ אֹתָ֔ם לְכֹל֙ הָֽעַמִּ֔ים תַּ֖חַת כׇּל־הַשָּׁמָֽיִם׃", "onk": "וְדִילְמָא תִזְקוֹף עֵינָיךְ לִשְׁמַיָּא וְתֶחֱזֵי יָת שִׁמְשָׁא וְיָת סִיהֲרָא וְיָת כּוֹכְבַיָּא כֹּל חֵילֵי שְׁמַיָּא וְתִטְעֵי וְתִסְגּוּד לְהוֹן וְתִפְלְחִנּוּן דִּי זַמִּין יְיָ אֱלָהָךְ יָתְהוֹן לְכֹל עַמְמַיָּא תְּחוֹת כָּל שְׁמַיָּא:", "onk_en": "Or lest you raise your eyes heavenward and see the sun or the moon or the stars—the entire host of the heavens—and you will err and bow to them and worship them, when Adonoy, your God, has made them available to all the peoples who are under the whole sky.", "pj": "וְדִלְמָא תִתְּלוּן עֵינֵיכוֹן לְצֵית שְׁמַיָא וְתֶחֱמוּן יַת שִׁמְשָׁא וְיַת זִיהֲרָא וְיַת רֵישֵׁי כּוֹכְבַיָא כָּל חֵילֵי שְׁמַיָא וְתִטְעוּן וְתִסְגְּדוּן לְהוֹן וְתִפְלְחִינוּן דְּפַלֵיג יְיָ אֱלָהָכוֹן בְּהוֹן דַּעְתְּהוֹן דְּכָל עַמְמַיָא דִתְחוֹת כָּל שְׁמַיָא", "pj_en": "And lest, when you lift up your eyes to the height of the heavens, and gaze at the sun, or the moon, and the principal stars of all the hosts of the heavens, you go astray, and adore and serve them; for the Lord your God hath by them distributed (or divided) the knowledge of all the peoples that are under the whole heavens.", "tj": "", "tj_en": "", "rashi": "<b>ופן תשא עיניך.<\/b> לְהִסְתַּכֵּל בַּדָּבָר וְלָתֵת לֵב לִטְעוֹת אַחֲרֵיהֶם:<br><br><b>אשר חלק ה'.<\/b> לְהָאִיר לָהֶם (מגילה ט'); דָּ\"אַ לֶאֱלוֹהוֹת, לֹא מְנָעָן מִלִּטְעוֹת אַחֲרֵיהֶם אֶלָּא הֶחֱלִיקָם בְּדִבְרֵי הַבְלֵיהֶם לְטָרְדָם מִן הָעוֹלָם, וְכֵן הוּא אוֹמֵר (תהלים ל\"ו) \"כִּי הֶחֱלִיק אֵלָיו בְּעֵינָיו לִמְצֹא עֲוֹנוֹ לִשְׂנֹא\" (עבודה זרה נ\"ה):", "rashi_en": "ופן תשא עיניך AND LEST THOU LIFT UP THINE EYES to ponder on the matter, and to set your heart to go astray after them.<br><br>אשר חלק ה׳ WHICH THE LORD ASSIGNED to give light to them (to all peoples) (Megillah 9b). — Another explanation: which God assigned to them as deities; He did not prevent them from going astray after them, but He allowed them to err (to slip) through vain speculations, in order to drive them out from the world. Similarly it states, (Psalms 36:3) \"He (God) made him err (slip) through his eyes (i.e. through what his eyes behold) until his iniquity be found and he be hated” (Avodah Zarah 55a)."}, {"ch": 4, "v": 20, "aliyah": 2, "heb": "וְאֶתְכֶם֙ לָקַ֣ח יְהֹוָ֔ה וַיּוֹצִ֥א אֶתְכֶ֛ם מִכּ֥וּר הַבַּרְזֶ֖ל מִמִּצְרָ֑יִם לִהְי֥וֹת ל֛וֹ לְעַ֥ם נַחֲלָ֖ה כַּיּ֥וֹם הַזֶּֽה׃", "onk": "וְיָתְכוֹן <b>קָרִיב יְיָ לְדַחַלְתֵּיהּ<\/b> וְאַפֵּק יָתְכוֹן מִכּוּרָא דְפַרְזְלָא מִמִּצְרָיִם לְמֵהֱוֵי לֵיהּ לְעַמָּא אַחֲסָנָא כְּיוֹמָא הָדֵין:", "onk_en": "But Adonoy took you [for Himself] [<b>drew you near to His service<\/b>] when He took you out of the iron crucible, from Egypt, to be for Him a people-territory like this day.", "pj": "וְיַתְכוֹן נְסִיב מֵימְרָא דַיְיָ לְחוּלְקֵיהּ וְאַנְפֵּיק יַתְכוֹן מִנִיר פַּרְזְלָא מִמִּצְרַיִם מְטוֹל לְמֶהֱוֵי לֵיהּ לְעַם אַחֲסָנָא כְּיוֹמָא הָדֵין", "pj_en": "For you hath the Word of the Lord taken for His portion, and hath brought you out from the iron furnace of Mizraim to be unto Him a people of inheritance as at this day.", "tj": "לְמֶהֱווֹן עַם חֲבִיבִין הֵיךְ סְגוּלָה כְּיוֹמָא הָדֵין:", "tj_en": "To be a people beloved as a treasure in this day.", "rashi": "<b>מכור.<\/b> כּוּר הוּא כְלִי שֶׁמְּזַקְּקִים בּוֹ אֶת הַזָּהָב:", "rashi_en": "מכור — a כור is a vessel in which one refines gold."}, {"ch": 4, "v": 21, "aliyah": 2, "heb": "וַֽיהֹוָ֥ה הִתְאַנַּף־בִּ֖י עַל־דִּבְרֵיכֶ֑ם וַיִּשָּׁבַ֗ע לְבִלְתִּ֤י עׇבְרִי֙ אֶת־הַיַּרְדֵּ֔ן וּלְבִלְתִּי־בֹא֙ אֶל־הָאָ֣רֶץ הַטּוֹבָ֔ה אֲשֶׁר֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ נֹתֵ֥ן לְךָ֖ נַחֲלָֽה׃", "onk": "וּמִן קֳדָם יְיָ הֲוָה רְגַז עֲלַי עַל פִּתְגָּמֵיכוֹן וְקַיִּים בְּדִיל דְּלָא לְמֵעֲבַר יָת יַרְדְּנָא וּבְדִיל דְּלָא לְמֵיעַל לְאַרְעָא טָבָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ אַחֲסָנָא:", "onk_en": "Yet Adonoy grew angry at me on account of your statements, and He swore that I would not cross the Yardein and would not enter the good land that Adonoy, your God, is giving you as territory.", "pj": "וּמִן קֳדָם יְיָ הֲוָה רְגַז עָלַי עַל פִּתְגָמֵיכוֹן דְּאִתְרַעַמְתּוּן עַל מַיָא וְקַיֵּים דְּלָא אֲעִיבַר יַת יוֹרְדְּנָא וּדְלָא אֵיעוּל לְאַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן אַחֲסָנָא", "pj_en": "But against me was displeasure before the Lord on account of your words, because you had murmured for the water; and He sware that I should not pass the Jordan, nor go into the land which the Lord your God giveth you to inherit.", "tj": "", "tj_en": "", "rashi": "<b>התאנף.<\/b> נִתְמַלֵּא רֹגֶז:<br><br><b>על דבריכם.<\/b> עַל אוֹדוֹתֵיכֶם, עַל עִסְקֵיכֶם:", "rashi_en": "התאנף means, HE WAS FILLED WITH WRATH. <br><br>על דבריכם means, \"on your account”, \"because of your doings”."}, {"ch": 4, "v": 22, "aliyah": 2, "heb": "כִּ֣י אָנֹכִ֥י מֵת֙ בָּאָ֣רֶץ הַזֹּ֔את אֵינֶ֥נִּי עֹבֵ֖ר אֶת־הַיַּרְדֵּ֑ן וְאַתֶּם֙ עֹֽבְרִ֔ים וִֽירִשְׁתֶּ֕ם אֶת־הָאָ֥רֶץ הַטּוֹבָ֖ה הַזֹּֽאת׃", "onk": "אֲרֵי אֲנָא מָאִית בְּאַרְעָא הָדָא לֵית אֲנָא עָבֵר יָת יַרְדְּנָא וְאַתּוּן עָבְרִין וְתֵירְתוּן יָת אַרְעָא טָבָא הָדָא:", "onk_en": "For I am to die in this land, I am not crossing the Yardein; but you are crossing, and will inherit this good land.", "pj": "אֲרוּם אֲנָא שְׁכִיב בְּאַרְעָא הָדָא לֵית אֲנָא עָבַר יַת יַרְדְּנָא וְאַתּוּן עָבְרִין וְתֵירְתוּן יַת אַרְעָא טַבְתָא הָדָא", "pj_en": "But I must die in this land; I am not to pass over Jordan; but you will pass over and possess the inheritance of that good land.", "tj": "", "tj_en": "", "rashi": "<b>כי אנכי מת וגו' אינני עבר.<\/b> מֵאַחַר שֶׁמֵּת מֵהֵיכָן יַעֲבֹר? אֶלָּא אַף עַצְמוֹתַי אֵינָם עוֹבְרִים (ספרי במדבר כ\"ז):", "rashi_en": "כי אנכי מת וגו' אינני עבר BUT I MUST DIE [IN THIS LAND], I MUST NOT PASS OVER [THE JORDAN] — Since he was to die, how could he pass over? But he meant: I must die and even my bones will not pass over (Sifrei Bamidbar 135)."}, {"ch": 4, "v": 23, "aliyah": 2, "heb": "הִשָּׁמְר֣וּ לָכֶ֗ם פֶּֽן־תִּשְׁכְּחוּ֙ אֶת־בְּרִ֤ית יְהֹוָה֙ אֱלֹ֣הֵיכֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּכֶ֑ם וַעֲשִׂיתֶ֨ם לָכֶ֥ם פֶּ֙סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּךָ֖ יְהֹוָ֥ה אֱלֹהֶֽיךָ׃", "onk": "אִסְתַּמָּרוּ לְכוֹן דִּילְמָא תִתִּנְשׁוּן יָת קְיָמָא דַיְיָ אֱלָהֲכוֹן דִּי גְזַר עִמְּכוֹן וְתַעְבְּדוּן לְכוֹן צֶלֶם דְּמוּת כֹּלָּא דִּי פַקְּדָךְ יְיָ אֱלָהָךְ:", "onk_en": "Look out for yourselves lest you forget the covenant of Adonoy, your God, that He made with you, and you make for yourselves a statue—an image of anything—that Adonoy, your God, commanded you.", "pj": "אִסְתַּמְרוּ לְכוֹן דִּלְמָא תִתְנְשׁוּן יַת קְיָמָא דַיְיָ אֱלָהָכוֹן דִּגְזַר עִמְכוֹן וְתַעַבְדוּן לְכוֹן צְלַם דְּמוּת כּוֹלָא דְפַקְדִינְכוֹן יְיָ אֱלָהָכוֹן דְּלָא לְמֶעֱבַד", "pj_en": "Beware, then, that you forget not the covenant of the Lord your God which He hath confirmed with you, or make to you an image, the likeness of any thing of which the Lord your God hath commanded that you should not make it.", "tj": "", "tj_en": "", "rashi": "<b>תמונת כל.<\/b> תְּמוּנַת כָּל דָּבָר:<br><br><b>אשר צוך ה'.<\/b> אֲשֶׁר צִוְּךָ שֶׁלֹּא לַעֲשׂוֹת:", "rashi_en": "תמונת כל means, THE LIKENESS OF ANYTHING. <br><br>אשר צוך WHICH THE LORD [THY GOD] COMMANDED THEE — i.e. which He commanded you not to make."}, {"ch": 4, "v": 24, "aliyah": 2, "heb": "כִּ֚י יְהֹוָ֣ה אֱלֹהֶ֔יךָ אֵ֥שׁ אֹכְלָ֖ה ה֑וּא אֵ֖ל קַנָּֽא׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי יְיָ אֱלָהָךְ <b>מֵימְרֵיהּ<\/b> אֶשָּׁא אָכְלָא הוּא אֵל קַנָּא:", "onk_en": "For Adonoy, your God, [<b>His word<\/b>] is a consuming fire, a jealous Almighty.", "pj": "אֲרוּם יְיָ אֱלָהָכוֹן מֵימְרֵיהּ אֵישָׁא אָכְלָא אֵישָׁא הוּא אֱלָהָא קַנָאִי וּמִתְפְּרַע בְּקִנְאָה", "pj_en": "For the Word of the Lord your God is a consuming fire; the jealous God is a fire, and He avengeth Himself in jealousy.", "tj": "אֲרוּם יְיָ אֱלָהָכוֹן אֶשָׁא דְאָכְלָא אֶשָׁא הוּא אֱלָהָא קִנְאַן וּמִתְפְּרַע בְּקַנָּאִין הוּא:", "tj_en": "For the Lord your God is a consuming fire; the jealous God is a fire, and He avengeth Himself in jealousy.", "rashi": "<b>אל קנא.<\/b> מְקַנֵּא לִנְקֹם, אנפר\"מנט בְּלַעַז, מִתְחָרֶה עַל רָגְזוֹ לְהִפָּרַע מֵעוֹבְדֵי עֲ\"זָ:", "rashi_en": "אל קנא A JEALOUS GOD — jealous to take vengeance, in O. F. emportment; glowing in his anger to exact punishment from those who worship idols (cf. Rashi on Numbers 25:11)."}, {"ch": 4, "v": 25, "aliyah": 2, "heb": "כִּֽי־תוֹלִ֤יד בָּנִים֙ וּבְנֵ֣י בָנִ֔ים וְנוֹשַׁנְתֶּ֖ם בָּאָ֑רֶץ וְהִשְׁחַתֶּ֗ם וַעֲשִׂ֤יתֶם פֶּ֙סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַעֲשִׂיתֶ֥ם הָרַ֛ע בְּעֵינֵ֥י יְהֹוָה־אֱלֹהֶ֖יךָ לְהַכְעִיסֽוֹ׃", "onk": "אֲרֵי תוֹלְדוּן בְּנִין וּבְנֵי בְנִין וְתִתְעַתְּקוּן בְּאַרְעָא וּתְחַבְּלוּן וְתַעְבְּדוּן צֶלֶם דְּמוּת כֹּלָּא וְתַעְבְּדוּן דְּבִישׁ <b>קֳדָם<\/b> יְיָ אֱלָהָךְ לְאַרְגָּזָא <b>קֳדָמוֹהִי<\/b>:", "onk_en": "When you have children and grandchildren, and have grown old in the land; and you will be corrupt and make a statue—an image of anything—and do what is evil in the eyes of [<b>before<\/b>] Adonoy, your God, to anger [<b>before<\/b>] Him.", "pj": "אֲרוּם תֵּלְדוּן בְּנִין וּבְנֵי בְנִין וְתִתְעַתְּקוּן בְּאַרְעָא וּתְחַבְּלוּן עוֹבָדֵיכוֹן וְתַעַבְדוּן לְכוֹן צְלַם דְּמוּת כּוֹלָא וְתַעַבְדוּן דְּבִישׁ קֳדָם יְיָ אֱלָהָכוֹן לְאַרְגָזָא קֳדָמוֹי", "pj_en": "If, when thou wilt have begotten children and children’s children, and wilt have grown old in the land, you corrupt your works, and make to you an image or any likeness, and do that which is evil before the Lord to provoke Him;", "tj": "", "tj_en": "", "rashi": "<b>ונושנתם.<\/b> רָמַז לָהֶם שֶׁיִּגְלוּ מִמֶּנָּה לְסוֹף שְׁמוֹנֶה מֵאוֹת וַחֲמִשִּׁים וּשְׁתַּיִם שָׁנָה כְּמִנְיַן \"וְנוֹשַׁנְתֶּם\", וְהוּא הִקְדִּים וְהִגְלָם לְסוֹף שְׁמוֹנֶה מֵאוֹת וַחֲמִשִּׁים, וְהִקְדִּים שְׁתֵּי שָׁנִים לִ\"וְנוֹשַׁנְתֶּם\", כְּדֵי שֶׁלֹּא יִתְקַיֵּם בָּהֶם כִּי אָבֹד תֹּאבֵדוּן, וְזֶהוּ שֶׁנֶּאֱמַר (דניאל ט') \"וַיִּשְׁקֹד עַל הָרָעָה וַיְבִיאֶהָ עָלֵינוּ כִּי צַדִּיק ה' אֱלֹהֵינוּ\" – צְדָקָה עָשָׂה עִמָּנוּ שֶׁמִּהֵר לַהֲבִיאָהּ שְׁתֵּי שָׁנִים לִפְנֵי זְמַנָּהּ (סנהדרין ל\"ח; גיטין פ\"ח):", "rashi_en": "ונושנתם AND YE SHALL HAVE BEEN LONG [IN THE LAND] — He gave them a vague intimation that they would be exiled from it at the end of 852 years, according to the numerical value of the word ונושנתם, but He sent them into exile earlier, at the end of 850 years. He did this two years earlier than the numerical value of ונושנתם, in order that the prophecy should not be fulfilled in them “that ye shall utterly perish” (v. 26). This is the meaning of what is said, (Daniel 9:14) “And the Lord hastened in regard to the evil, and He brought it upon us, for the Lord our God is צדיק” — i.e., He acted charitably (צדקה) with us, in that He brought it (the evil) two years before its assigned time (Sanhedrin 38a; Gittin 88a)."}, {"ch": 4, "v": 26, "aliyah": 2, "heb": "הַעִידֹ֩תִי֩ בָכֶ֨ם הַיּ֜וֹם אֶת־הַשָּׁמַ֣יִם וְאֶת־הָאָ֗רֶץ כִּֽי־אָבֹ֣ד תֹּאבֵדוּן֮ מַהֵר֒ מֵעַ֣ל הָאָ֔רֶץ אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת־הַיַּרְדֵּ֛ן שָׁ֖מָּה לְרִשְׁתָּ֑הּ לֹֽא־תַאֲרִיכֻ֤ן יָמִים֙ עָלֶ֔יהָ כִּ֥י הִשָּׁמֵ֖ד תִּשָּׁמֵדֽוּן׃", "onk": "אַסְהֵדִית בְּכוֹן יוֹמָא דֵין יָת שְׁמַיָּא וְיָת אַרְעָא אֲרֵי מֵיבַד תֵּיבְדוּן בִּפְרִיעַ מֵעַל אַרְעָא דִּי אַתּוּן עָבְרִין יָת יַרְדְּנָא לְתַמָּן לְמֵירְתַהּ לָא תוֹרְכוּן יוֹמִין עֲלַהּ אֲרֵי אִשְׁתְּצָאָה תִּשְׁתֵּצוּן:", "onk_en": "I bring as witness against you today heaven and earth, that you will be completely and swiftly removed from upon the land, that you are crossing the Yardein there to inherit; you will not live long upon it, but will be completely destroyed.", "pj": "אַסְהֵידִית בְּכוֹן יוֹמָא דֵין סַהֲדִין קַיְימִין יַת שְׁמַיָא וְיַת אַרְעָא אֲרוּם מֵיבַד תּוֹבְדוּן בְּסַרְהוּבַיָא מֵעִילַוֵי אַרְעָא דְאַתּוּן עָבְרִין יַת יוֹרְדְּנָא תַמָּן לְמֵירְתָהּ לָא תוֹרְכוּן יוֹמִין עֲלָהּ אֲרוּם מִשְׁתֵּצְיָא תִשְׁתֵּיצוּן", "pj_en": "I attest against you this day the sworn witnesses of the heavens and the earth, that perishing you will perish swiftly from the land to possess which you pass the Jordan: you will not lengthen out days upon it, but will be utterly destroyed.", "tj": "", "tj_en": "", "rashi": "<b>העידתי בכם.<\/b> הִנְנִי מַזְמִינָם לִהְיוֹת עֵדִים שֶׁהִתְרֵיתִי בָכֶם:", "rashi_en": "העידתי בכם I CALL AS WITNESSES AGAINST YOU [THE HEAVENS AND THE EARTH] — Behold I summon them to be witnesses that I have warned you."}, {"ch": 4, "v": 27, "aliyah": 2, "heb": "וְהֵפִ֧יץ יְהֹוָ֛ה אֶתְכֶ֖ם בָּעַמִּ֑ים וְנִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּגּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהֹוָ֛ה אֶתְכֶ֖ם שָֽׁמָּה׃", "onk": "וִיבַדַּר יְיָ יָתְכוֹן בְּעַמְמַיָּא וְתִשְׁתָּאֲרוּן עַם דְּמִנְיָן בְּעַמְמַיָּא דִּי יְדַבַּר יְיָ יָתְכוֹן לְתַמָּן:", "onk_en": "Adonoy will disperse you among the peoples, and you will remain few in number among the nations that Adonoy leads you to.", "pj": "וִיבַדַר יְיָ יַתְכוֹן בֵּינֵי עַמְמַיָא וְתִשְׁתּוֹתְרוּן בְּעָם קָלִיל בֵּינֵי עַמְמַיָא דִיבַדַר יְיָ יַתְכוֹן תַּמָּן בְּגָלוּתָא", "pj_en": "And the Lord will scatter you among the Gentiles, and you will remain as a little people with the nations among whom the Lord will disperse you in captivity.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 28, "aliyah": 2, "heb": "וַעֲבַדְתֶּם־שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָאֶ֔בֶן אֲשֶׁ֤ר לֹֽא־יִרְאוּן֙ וְלֹ֣א יִשְׁמְע֔וּן וְלֹ֥א יֹֽאכְל֖וּן וְלֹ֥א יְרִיחֻֽן׃", "onk": "וְתִפְלְחוּן תַּמָּן <b>לְעַמְמַיָּא פָלְחֵי<\/b> טַעֲוָתָא עֹבַד יְדֵי אֱנָשָׁא אָעָא וְאַבְנָא דִּי לָא יֶחֱזוּן וְלָא שָׁמְעִין וְלָא אָכְלִין וְלָא מְרִיחִין:", "onk_en": "There you will serve [<b>a nation who serves<\/b>] man-made gods of wood and stone that do not see, do not hear, do not eat, and do not smell.", "pj": "וְתִיתְעוּקוּן לְמִפְלַח תַּמָּן לְפַלְחֵי טַעֲוָותָא עוֹבַד אִידֵיהוֹן דִּבְנֵי נְשָׁא מִן קֵיסָא וְאַבְנָא דְלָא חַמְיָין וְלָא שָׁמְעִין וְלָא אָכְלִין וְלָא מְרִיחִין", "pj_en": "And there will you be constrained to serve the worshippers of idols, the work of men’s hands, of wood and stone, which see not, nor hear, nor eat, nor smell.", "tj": "", "tj_en": "", "rashi": "<b>ועבדתם שם אלהים.<\/b> כְּתַרְגּוּמוֹ, מִשֶּׁאַתֶּם עוֹבְדִים לְעוֹבְדֵיהֶם כְּאִלּוּ אַתֶּם עוֹבְדִים לָהֶם:", "rashi_en": "ועבדתם שם אלהים AND THERE YE SHALL SERVE GODS — Understand this as the Targum does: And there ye shall serve peoples who serve idols, for since you serve those who serve them (idols) it will be as though you serve them."}, {"ch": 4, "v": 29, "aliyah": 2, "heb": "וּבִקַּשְׁתֶּ֥ם מִשָּׁ֛ם אֶת־יְהֹוָ֥ה אֱלֹהֶ֖יךָ וּמָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔נּוּ בְּכׇל־לְבָבְךָ֖ וּבְכׇל־נַפְשֶֽׁךָ׃", "onk": "וְתִתְבְּעוּן מִתַּמָּן <b>דַּחַלְתָּא<\/b> דַיְיָ אֱלָהָךְ וְתִשְׁכָּח אֲרֵי תִבְעֵי <b>מִן קֳדָמוֹהִי<\/b> בְּכָל לִבָּךְ וּבְכָל נַפְשָׁךְ:", "onk_en": "You will seek from there [<b>the fear of<\/b>] Adonoy, your God, and you will find [Him], when you seek [<b>before<\/b>] Him wholeheartedly and with your whole being.", "pj": "וְתִתְבְּעוּן מִתַּמָּן לְמִיתַב לִדְחַלְתָּא דַיְיָ אֱלָהָכוֹן וְתִשְׁכְּחוּן רַחֲמִין אֲרוּם תִּבְעוּן מִן קֳדָמוֹי בְּכָל לִבְּכוֹן וּבְכָל נַפְשֵׁיכוֹן", "pj_en": "But if there you seek to return to the fear of the Lord your God, you shall find mercy, when you seek before Him with all your heart and with all your soul.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 30, "aliyah": 2, "heb": "בַּצַּ֣ר לְךָ֔ וּמְצָא֕וּךָ כֹּ֖ל הַדְּבָרִ֣ים הָאֵ֑לֶּה בְּאַחֲרִית֙ הַיָּמִ֔ים וְשַׁבְתָּ֙ עַד־יְהֹוָ֣ה אֱלֹהֶ֔יךָ וְשָׁמַעְתָּ֖ בְּקֹלֽוֹ׃", "onk": "כַּד יֵיעוֹק לָךְ וְיַשְׁכְּחֻנָּךְ כֹּל פִּתְגָּמַיָּא הָאִלֵּין בְּסוֹף יוֹמַיָּא וּתְתוּב <b>לְדַחַלְתָּא<\/b> דַיְיָ אֱלָהָךְ וּתְקַבֵּל <b>לְמֵימְרֵיהּ<\/b>:", "onk_en": "When you are in distress and all these things happen to you, at the end of time, you will return to [<b>the fear of<\/b>] Adonoy, your God, and will obey Him [<b>His word<\/b>].", "pj": "כַּד תֵּיעוֹק לְכוֹן וִיאַרְעוּן לְכוֹן כָּל פִּתְגָמַיָא הָאִילֵין בְּסוֹף יוֹמַיָא וּתְתוּבוּן עַד דַּחַלְתָּא דַיְיָ אֱלָהָכוֹן וּתְקַבְּלוּן לְמֵימְרֵיהּ", "pj_en": "When you suffer oppression, and all these things come upon you in the end of the days, and you be converted to the fear of the Lord your God, and obey His Word;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 31, "aliyah": 2, "heb": "כִּ֣י אֵ֤ל רַחוּם֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ לֹ֥א יַרְפְּךָ֖ וְלֹ֣א יַשְׁחִיתֶ֑ךָ וְלֹ֤א יִשְׁכַּח֙ אֶת־בְּרִ֣ית אֲבֹתֶ֔יךָ אֲשֶׁ֥ר נִשְׁבַּ֖ע לָהֶֽם׃", "onk": "אֲרֵי אֱלָהָא רַחֲמָנָא יְיָ אֱלָהָךְ לָא יִשְׁבְּקִנָּךְ וְלָא יְחַבְּלִנָּךְ וְלָא יִתִּנְשֵׁי יָת קְיָמָא דַאֲבָהָתָךְ דִּי קַיִּים לְהוֹן:", "onk_en": "For a merciful Almighty is Adonoy, your God; He will not forsake you nor destroy you; nor will He forget the covenant of your fathers that He swore to them.", "pj": "אֲרוּם אֱלָהָא רַחֲמָנָא יְיָ אֱלָהָכוֹן לָא יִשְׁבְּקִנְכוֹן וְלָא יִחְבַּלְכוֹן וְלָא יִתְנְשֵׁי יַת קְיָימָא דְאַבָהַתְכוֹן דְּקַיַּים לְהוֹן", "pj_en": "for the Lord our God is a merciful God; He will not forsake you, nor destroy you, nor forget the covenant of your fathers which He sware unto them.", "tj": "", "tj_en": "", "rashi": "<b>לא ירפך.<\/b> מִלְּהַחֲזִיק בְּךָ בְּיָדָיו, וּלְשׁוֹן לֹא יַרְפְּךָ לְשׁוֹן לֹא יַפְעִיל הוּא – לֹא יִתֵּן לְךָ רִפְיוֹן, לֹא יַפְרִישׁ אוֹתְךָ מֵאֶצְלוֹ, וְכֵן \"אֲחַזְתִּיו וְלֹא אַרְפֶּנּוּ\" (שיר השירים ג') שֶׁלֹּא נִנְקַד אֶרְפֶּנּוּ; כָּל לְשׁוֹן רִפְיוֹן מוּסָב עַל לְשׁוֹן מַפְעִיל וּמִתְפַּעֵל, כְּמוֹ \"הַרְפֵּה לָהּ\" (מלכים ב ד') – תֵּן לָהּ רִפְיוֹן, \"הֶרֶף מִמֶּנִּי\" (דברים ט') – הִתְרַפֵּה מִמֶּנִּי:", "rashi_en": "לא ירפך means, He will not let loose of thee so as not to hold thee fast by His hands. The expression לא ירפך is an expression signifying: He will not cause something (our Hiphil) — He will not give thee any looseness, i.e. He will not separate you from Him. Similar is (Song 3:4) “I hold him fast, and I will not let him loose (אַרְפֶּנוּ )”, which is not vowelled אֶרְפֶּנוּ (which is Kal and an impossible form of the root רפה “to be loose”). Always the expression “letting slack (רפה)” in the Hiphil refers to one who causes looseness to others or to one who causes it to himself. For example (2 Kings 4:2) הרפה לה means, “give her looseness”; (Deuteronomy 9:14) הרף ממני means, “Give looseness to thyself from off me”."}, {"ch": 4, "v": 32, "aliyah": 2, "heb": "כִּ֣י שְׁאַל־נָא֩ לְיָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר־הָי֣וּ לְפָנֶ֗יךָ לְמִן־הַיּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים&thinsp;<small>׀<\/small>&thinsp;אָדָם֙ עַל־הָאָ֔רֶץ וּלְמִקְצֵ֥ה הַשָּׁמַ֖יִם וְעַד־קְצֵ֣ה הַשָּׁמָ֑יִם הֲנִֽהְיָ֗ה כַּדָּבָ֤ר הַגָּדוֹל֙ הַזֶּ֔ה א֖וֹ הֲנִשְׁמַ֥ע כָּמֹֽהוּ׃", "onk": "אֲרֵי שְׁאֵל כְּעַן לְיוֹמַיָּא קַדְמָאֵי דַּהֲווֹ קֳדָמָךְ לְמִן יוֹמָא דִּי בְרָא יְיָ אָדָם עַל אַרְעָא וּלְמִסְּיָפֵי שְׁמַיָּא וְעַד סְיָפֵי שְׁמַיָּא הַהֲוָה כְּפִתְגָּמָא רַבָּא הָדֵין אוֹ הַאִשְׁתְּמַע כְּוָתֵיהּ:", "onk_en": "Inquire now about the early years that preceded you, from the day that God created Adam on earth and from one end of the heavens to the other end of the heavens: Did anything ever happen comparable to this great event, or did anyone ever hear of such a thing?", "pj": "אֲרוּם שַׁיִיל כְּדוֹן לְדָרַיָא דְמִן יוֹמֵי שִׁירוּיָיא דַהֲווֹ קֳדָמָךְ לְמִן יוֹמָא דִבְרָא יְיָ אָדָם עַל אַרְעָא וּלְמִסְיָיפֵי שְׁמַיָא וְעַד סְיָיפֵי שְׁמַיָא הַהֲוָה הֵיךְ פִּתְגָמָא רַבָּא הָדֵין אוֹ הַאִשְׁתְּמַע דִּכְוָותֵיהּ", "pj_en": "For ask now the generations which have been from the days of the beginning, which have been before thee from the day when the Lord created man upon the earth, from one end of the heavens to the other, whether so great a thing as this hath been, or any like to it hath been heard?", "tj": "", "tj_en": "", "rashi": "<b>לימים ראשונים.<\/b> עַל יָמִים רִאשׁוֹנִים:<br><br><b>ולמקצה השמים.<\/b> וְגַם שְׁאַל לְכָל הַבְּרוּאִים אֲשֶׁר מִקָּצֶה אֶל קָצֶה, זֶהוּ פְּשׁוּטוֹ; וּמִדְרָשׁוֹ, מְלַמֵּד עַל קוֹמָתוֹ שֶׁל אָדָם שֶׁהָיְתָה מִן הָאָרֶץ עַד הַשָּׁמַיִם, וְהוּא הַשִּׁעוּר עַצְמוֹ אֲשֶׁר מִקָּצֶה אֶל קָצֶה (סנהדרין ל\"ח):<br><br><b>הנהיה כדבר הגדול הזה.<\/b> וּמַהוּ הַדָּבָר הַגָּדוֹל, <b>השמע עם וגו'<\/b>:", "rashi_en": "לימים ראשנים is the same as על ימים ראשנים [ASK NOW] REGARDING THE FORMER DAYS.<br><br>ולמקצה השמים AND FROM ONE END OF HEAVEN — i.e. and also ask of all the creatures from one end to the other end of heaven. This is its plain sense, but a Midrashic explanation is: it teaches us regarding Adam's height, that it reached from earth to heaven, and that this is the very same measurement as from one end of heaven to the other (Sanhedrin 38b).<br><br>הנהיה כדבר הגדול הזה [ASK] … WHETHER THERE HATH BEEN ANYTHING LIKE THIS GREAT THING — And what is the great thing? What is stated in the two following verses: השמע עם וגו׳ DID EVER A PEOPLE HEAR, etc., and"}, {"ch": 4, "v": 33, "aliyah": 2, "heb": "הֲשָׁ֣מַֽע עָם֩ ק֨וֹל אֱלֹהִ֜ים מְדַבֵּ֧ר מִתּוֹךְ־הָאֵ֛שׁ כַּאֲשֶׁר־שָׁמַ֥עְתָּ אַתָּ֖ה וַיֶּֽחִי׃", "onk": "הַשְׁמַע עַמָּא קַל <b>מֵימְרָא<\/b> דַיְיָ מְמַלֵּל מִגּוֹ אֶשָּׁתָא כְּמָא דִי שְׁמַעַתְּ אַתְּ וְיִתְקַיָּם:", "onk_en": "Did any people [ever] hear [<b>the word of<\/b>] God’s voice speaking from within the fire as you heard and survive?", "pj": "הַאֶפְשָׁר דְּשָׁמַע עַמָא קַל מֵימְרָא דַיְיָ אֱלָהָא קַיֵּם דִּמְמַלֵל מִגּוֹ אֵישָׁא הֵיכְמָא דִשְׁמַעְתּוּן אַתּוּן וְאִתְקַיָּים", "pj_en": "Hath it ever been that a people should hear the voice of the Word of the Lord, the Living God, speaking from the midst of fire, as you heard, and remained alive?", "tj": "אוֹ הַיְידָא אוּמָא וּמַלְכוּ דִי שְׁמָעַת:", "tj_en": "Or what is the people or kingdom that hath heard?", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 34, "aliyah": 2, "heb": "א֣וֹ&thinsp;<b>׀<\/b> הֲנִסָּ֣ה אֱלֹהִ֗ים לָ֠ב֠וֹא לָקַ֨חַת ל֣וֹ גוֹי֮ מִקֶּ֣רֶב גּוֹי֒ בְּמַסֹּת֩ בְּאֹתֹ֨ת וּבְמוֹפְתִ֜ים וּבְמִלְחָמָ֗ה וּבְיָ֤ד חֲזָקָה֙ וּבִזְר֣וֹעַ נְטוּיָ֔ה וּבְמוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠כֹ֠ל אֲשֶׁר־עָשָׂ֨ה לָכֶ֜ם יְהֹוָ֧ה אֱלֹהֵיכֶ֛ם בְּמִצְרַ֖יִם לְעֵינֶֽיךָ׃", "onk": "אוֹ <b>נִסִּין דִּי עֲבַד<\/b> יְיָ <b>לְאִתְגַּלָּאָה<\/b> לְמִפְרַק לֵיהּ עַם מִגּוֹ עַם בְּנִסִּין בְּאָתִין וּבְמוֹפְתִין וּבִקְרָבָא וּבִידָא תַקִּיפָא וּבִדְרָעָא מְרָמָא וּבְחֶזְוָנִין רַבְרְבִין כְּכֹל דִּי עֲבַד לְכוֹן יְיָ אֱלָהֲכוֹן בְּמִצְרַיִם לְעֵינָיךְ:", "onk_en": "Or [<b>miracles that He performed to become revealed,<\/b>] did any god ever miraculously come and take for himself a nation from within a nation through tests, with signs and with wonders, and through warfare, and with a strong hand and with an extended arm, and with great displays; entirely as Adonoy, your God, did for you in Egypt as you watched?", "pj": "אוֹ הֵיךְ נִיסָא דְעָבַד יְיָ לְאִתְגְּלָאָה לְמִפְרְשָׁא לֵיהּ אוּמָא בְּפִיצְתָא מִגּוֹ עָם אוֹחֲרֵי בְּנִיסִין בְּאָתִין וּבְתִמְהִין וּבְסִדְרֵי נִצְחָנֵי קְרָבִין וּבְאֶדְרַע מְרַמֵם וּבְחֶזְוָנֵי רַבְרְבִין הֵי כְּכָל מַה דְּעָבַד לְכוֹן יְיָ אֱלָהָכוֹן בְּמִצְרַיִם וְעֵינֵיכוֹן חַמְיָין", "pj_en": "Or, as the wonder which the Lord hath wrought, revealing Himself to separate a people to Himself from among another people, by signs, by miracles, by portents, by the victories of ordered battles, by an uplifted arm, and by great visions, like all that the Lord our God hath done for us in Mizraim, and your eyes beholding?", "tj": "אוֹ נִסַיָיא דְעָבַד מֵימְרָא דַיְיָ לְמֵיעַל לִמְבַשֵר לֵיהּ אוּמָא מִגוֹ אוּמָא:", "tj_en": "Or the signs which the Word of the Lord hath wrought, coming to announce (that He would separate) to Himself a people from among a people ?", "rashi": "<b>או הנסה אלהים.<\/b> הֲכִי עָשָׂה נִסִּים שׁוּם אֱלוֹהַּ <b>לבוא לקחת לו גוי וגו'<\/b>, כָּל הֵהִי\"ן הַלָּלוּ תְּמִיהוֹת הֵן, לְכָךְ נְקוּדוֹת הֵן בַּחֲטָף פַּתָּח: הֲנִהְיָה, הֲנִשְׁמַע, הֲשָׁמַע הֲנִסָּה:<br><br><b>במסת.<\/b> עַל יְדֵי נִסְיוֹנוֹת הוֹדִיעָם גְּבוּרוֹתָיו, כְּגוֹן \"הִתְפָּאֵר עָלַי\" (שמות ח') אִם אוּכַל לַעֲשׂוֹת כֵּן, הֲרֵי זֶה נִסָּיוֹן:<br><br><b>באתת.<\/b> בְּסִימָנִין, לְהַאֲמִין שֶׁהוּא שְׁלוּחוֹ שֶׁל מָקוֹם, כְּגוֹן \"מַה זֶּה בְיָדֶךָ\" (שם ד'):<br><br><b>ובמופתים.<\/b> הֵם נִפְלָאוֹת, שֶׁהֵבִיא עֲלֵיהֶם מַכּוֹת מֻפְלָאוֹת:<br><br><b>ובמלחמה.<\/b> בַּיָּם, שֶׁנֶּאֱמַר \"כִּי ה' נִלְחָם לָהֶם\" (שם י\"ד):", "rashi_en": "הנסה אלהים which means, HAS ANY GOD DONE MIRACLES (לבוא לקחת לו גוי וגו׳ ,(נס TO GO AND TAKE HIM A NATION [FROM THE MIDST OF A NATION] etc. — All these letters ה are interrogative prefixes, and therefore they are vowelled with Chataph Patach: הֲנהיה, הֲנשמע, הֲשמע, הֲנסה.<br><br>במסות BY TRIALS — through trials imposed upon Him He showed them His mighty deeds, as e.g., (Exodus 8:5) “Boast yourself over Me”, whether I am able to do so: here you have a trial (putting God to the proof).<br><br>באתת i.e. BY SIGNS to confirm that he is the messenger of the Omnipresent, as e.g., (Exodus 4:2) “What is that in your hand?\"<br><br>ובמפתים these are WONDERS: — that He brought upon them (the Egyptians) wondrous plagues.<br><br>ובמלחמה AND BY WAR, at the Red Sea, as it is said, (Exodus 14:25) “For the Lord fought for them\"."}, {"ch": 4, "v": 35, "aliyah": 2, "heb": "אַתָּה֙ הׇרְאֵ֣תָ לָדַ֔עַת כִּ֥י יְהֹוָ֖ה ה֣וּא הָאֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִלְּבַדּֽוֹ׃", "onk": "אַתְּ אִתְחֲזֵיתָא לְמִדַּע אֲרֵי יְיָ הוּא אֱלֹּהִים לֵית עוֹד בַּר מִנֵּיהּ:", "onk_en": "You have been shown that you might know that Adonoy, He is <i>the<\/i> God; there is no [power] other than He.", "pj": "אַנְתְּ אִיתְחָמֵיתָא יַת פְּרִישָׁתָא הָאִלֵּין מְטוּל לְמִנְדַע אֲרוּם יְיָ הוּא אֱלָהָא לֵית תּוּב בַּר מִינֵיהּ", "pj_en": "Unto thee have these wonders been shown, that thou mayest know that the Lord is God, and there is none beside Him.", "tj": "", "tj_en": "", "rashi": "<b>הראת.<\/b> כְּתַרְגּוּמוֹ \"אִתְחֲזֵיתָא\"; כְּשֶׁנָּתַן הַקָּבָּ\"ה אֶת הַתּוֹרָה פָּתַח לָהֶם שִׁבְעָה רְקִיעִים, וּכְשֵׁם שֶׁקָּרַע אֶת הָעֶלְיוֹנִים כָּךְ קָרַע אֶת הַתַּחְתּוֹנִים, וְרָאוּ שֶׁהוּא יְחִידִי, לְכָךְ נֶאֱמַר \"אַתָּה הָרְאֵתָ לָדַעַת\":", "rashi_en": "הראת — Understand this as the Targum has it: Thou hast been shown. When the Holy One, blessed be He, gave the Torah, He rent open to them the seven heavens, and just as he rent open the higher regions so did He rend open the lower, so that they saw that He was alone (sole God). On this account it is stated, \"Thou hast been shown that thou mayest know [that the Lord is God, there is none besides Him]\" (Pesikta Rabbati 20 towards the end)."}, {"ch": 4, "v": 36, "aliyah": 2, "heb": "מִן־הַשָּׁמַ֛יִם הִשְׁמִֽיעֲךָ֥ אֶת־קֹל֖וֹ לְיַסְּרֶ֑ךָּ וְעַל־הָאָ֗רֶץ הֶרְאֲךָ֙ אֶת־אִשּׁ֣וֹ הַגְּדוֹלָ֔ה וּדְבָרָ֥יו שָׁמַ֖עְתָּ מִתּ֥וֹךְ הָאֵֽשׁ׃", "onk": "מִן שְׁמַיָּא אַשְׁמְעָךְ יָת קָל <b>מֵימְרֵיהּ<\/b> לְאַלָּפוּתָךְ וְעַל אַרְעָא אַחְזְיָךְ יָת אֶשָּׁתֵיהּ רַבְּתָא וּפִתְגָּמוֹהִי שְׁמַעַתְּ מִגּוֹ אֶשָּׁתָא:", "onk_en": "From the sky He made audible to you [<b>the word of<\/b>] His voice to teach you, and on the earth He showed you His great fire, and you heard His words form within the fire.", "pj": "מִשְׁמֵי מְרוֹמָא אַשְׁמָעִינְכוֹן יַת קַל מֵימְרֵיהּ לִמְכַסְנָא יַתְכוֹן בְּאוּלְפָנֵיהּ וְעִילַוֵי אַרְעָא אַחֲמִינְכוֹן יַת אֵישָׁתֵיהּ רַבְּתָא וּפִתְגָמוֹי שְׁמַעְתּוּן מִגּוֹ אֵישָׁתָא", "pj_en": "He made you hear the voice of His Word from the heavens on high, to give you discipline by His doctrine, and showed thee upon earth His great fire, and made thee hear His words from the midst of the flame.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 37, "aliyah": 2, "heb": "וְתַ֗חַת כִּ֤י אָהַב֙ אֶת־אֲבֹתֶ֔יךָ וַיִּבְחַ֥ר בְּזַרְע֖וֹ אַחֲרָ֑יו וַיּוֹצִֽאֲךָ֧ בְּפָנָ֛יו בְּכֹח֥וֹ הַגָּדֹ֖ל מִמִּצְרָֽיִם׃", "onk": "וָחֳלַף אֲרֵי רְחִים יָת אֲבָהָתָךְ וְאִתִּרְעֵי בִבְנוֹהִי בַּתְרוֹהִי וְאַפְּקָךְ <b>בְּמֵימְרֵיהּ<\/b> בְּחֵילֵיהּ רַבָּא מִמִּצְרָיִם:", "onk_en": "Because He loved your forefathers, He chose his descendants after him; and He took you out before Him [<b>by His word<\/b>] with His great strength from Egypt.", "pj": "וְחוֹלַף דִּרֵחֵים יַת אֲבָהַתְכוֹן אַבְרָהָם וְיִצְחָק וְאִתְרְעֵי בִּבְנוֹי דְיַעֲקב בַּתְרוֹי וְאַפְקִינְכוֹן בְּאַפֵּי רְעוּתֵיהּ בְּחֵילֵיהּ רַב מִמִּצְרָיִם", "pj_en": "And because He loved thy fathers Abraham and Izhak, therefore hath He pleasure in the children of Jakob after him, and hath brought you in His lovingkindness and power from Mizraim,", "tj": "", "tj_en": "", "rashi": "<b>ותחת כי אהב.<\/b> וְכָל זֶה תַּחַת אֲשֶׁר אָהַב:<br><br><b>ויוצאך בפניו.<\/b> כְּאָדָם הַמַּנְהִיג בְּנוֹ לְפָנָיו, שֶׁנֶּאֱמַר \"וַיִּסַּע מַלְאַךְ הָאֱלֹהִים הַהֹלֵךְ וְגוֹ' וַיֵּלֶךְ מֵאַחֲרֵיהֶם\" (שם). דָּ\"אַ, <b>ויוצאך בפניו<\/b> – בִּפְנֵי אֲבוֹתָיו, כְּמָה שֶׁנֶּאֱמַר \"נֶגֶד אֲבוֹתָם עָשָׂה פֶלֶא\" (תהילים ע\"ח); וְאַל תִּתְמַהּ עַל שֶׁהִזְכִּירָם בִּלְשׁוֹן יָחִיד, שֶׁהֲרֵי כְתָבָם בִּלְשׁוֹן יָחִיד – <b>ויבחר בזרעו אחריו<\/b>:", "rashi_en": "ותחת כי אהב AND BECAUSE HE LOVED — i.e., and all this was because He loved thy fathers.<br><br>ויוצאך בפניו AND HE BROUGHT THEE OUT BEFORE HIM — like a man who leads his son before him, as it is said, (Exodus 14:19) “And the angel of the Lord that went [before them] moved and went behind them\" (see Rashi on that verse). — Another explanation of ויוצאך בפניו AND HE BROUGHT THEE FORTH IN HIS PRESENCE: — i.e. in the presence of his fathers, as it is said, (Psalms 78:12; see Rashi on that verse), “In the presence of their fathers He did wonders\". Do not be surprised that it refers to them (the fathers) in the singular number (by בפניו), for you see it has already written about them in the singular number, viz., “And he chose his seed after him\" (instead of “their seed after them\")."}, {"ch": 4, "v": 38, "aliyah": 2, "heb": "לְהוֹרִ֗ישׁ גּוֹיִ֛ם גְּדֹלִ֧ים וַעֲצֻמִ֛ים מִמְּךָ֖ מִפָּנֶ֑יךָ לַהֲבִֽיאֲךָ֗ לָֽתֶת־לְךָ֧ אֶת־אַרְצָ֛ם נַחֲלָ֖ה כַּיּ֥וֹם הַזֶּֽה׃", "onk": "לְתָרָכָא עַמְמִין רַבְרְבִין וְתַקִּיפִין מִנָּךְ מִן קֳדָמָךְ לְאָעָלוּתָךְ לְמִתַּן לָךְ יָת אַרְעֲהוֹן אַחֲסָנָא כְּיוֹמָא הָדֵין:", "onk_en": "To expel nations greater and stronger than you from before you; to bring you in [and] to give you their land as terrritory, like this day.", "pj": "לְתַרְכָא עַמְמִין רַבְרְבִין וְתַקִּיפִין מִנְכוֹן מִן קֳדָמֵיכוֹן לְאַעֲלוּתְכוֹן לְמִתַּן לְכוֹן יַת אַרְעֲהוֹן אַחְסָנָא כְּיוֹמָא הָדֵין", "pj_en": "to drive out nations greater and stronger than you from before you, and give you their land to inherit as at this day.", "tj": "", "tj_en": "", "rashi": "<b>ממך מפניך.<\/b> סָרְסֵהוּ וְדָרְשֵׁהוּ: לְהוֹרִישׁ מִפָּנֶיךָ גּוֹיִם גְּדוֹלִים וַעֲצוּמִים מִמְּךָ:<br><br><b>כיום הזה.<\/b> כַּאֲשֶׁר אַתָּה רוֹאֶה הַיּוֹם:", "rashi_en": "ממך מפניך — Invert it (the order of the words) and then explain it accordingly: to dispossess from before thee (מפניך) nations greater and mightier than thee (ממך) <br><br>כיום הזה AS AT THIS DAY — i.e., As you see today."}, {"ch": 4, "v": 39, "aliyah": 2, "heb": "וְיָדַעְתָּ֣ הַיּ֗וֹם וַהֲשֵׁבֹתָ֮ אֶל־לְבָבֶ֒ךָ֒ כִּ֤י יְהֹוָה֙ ה֣וּא הָֽאֱלֹהִ֔ים בַּשָּׁמַ֣יִם מִמַּ֔עַל וְעַל־הָאָ֖רֶץ מִתָּ֑חַת אֵ֖ין עֽוֹד׃", "onk": "וְתִדַּע יוֹמָא דֵין וּתְתוּב לְלִבָּךְ אֲרֵי יְיָ הוּא אֱלָהָא <b>דִּשְׁכִנְתֵּיהּ<\/b> בִּשְׁמַיָּא מִלְּעֵלָּא <b>וְשַׁלִּיט<\/b> עַל אַרְעָא מִלְּרָע לֵית עוֹד:", "onk_en": "You will know today, and will restore to your perception that Adonoy is <i>the<\/i> God [<b>Whose Shechinah is<\/b>] in heaven above and [<b>Ruler<\/b>] on earth below; there is no other.", "pj": "וְתִנְדְּעוּן יוֹמָא דֵין וּתְתוּבוּן עַל לִבְּכוֹן אֲרוּם יְיָ אֱלהִים דִּשְׁכִינְתֵּיהּ שַׁרְיָא בִּשְׁמַיָא מִלְעֵילָא וְשַׁלִּיט עַל אַרְעָא מִלְרַע לֵית חוֹרָן בַּר מִנֵיהּ", "pj_en": "Know therefore today, and set your heart upon it, that the Lord is God, whose Shekinah dwelleth in the heavens above, and reigneth on the earth beneath, neither is there any other beside Him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 40, "aliyah": 2, "heb": "וְשָׁמַרְתָּ֞ אֶת־חֻקָּ֣יו וְאֶת־מִצְוֺתָ֗יו אֲשֶׁ֨ר אָנֹכִ֤י מְצַוְּךָ֙ הַיּ֔וֹם אֲשֶׁר֙ יִיטַ֣ב לְךָ֔ וּלְבָנֶ֖יךָ אַחֲרֶ֑יךָ וּלְמַ֨עַן תַּאֲרִ֤יךְ יָמִים֙ עַל־הָ֣אֲדָמָ֔ה אֲשֶׁ֨ר יְהֹוָ֧ה אֱלֹהֶ֛יךָ נֹתֵ֥ן לְךָ֖ כׇּל־הַיָּמִֽים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִטַּר יָת קְיָמוֹהִי וְיָת פִּקוּדוֹהִי דִּי אֲנָא מְפַקְּדָךְ יוֹמָא דֵין דִּי יֵיטַב לָךְ וְלִבְנָיךְ בַּתְרָךְ וּבְדִיל דְּתוֹרִיךְ יוֹמִין עַל אַרְעָא דִּי יְיָ אֱלָהָךְ יָהֵב לָךְ כָּל יוֹמַיָּא:", "onk_en": "You will guard His statutes and His commandments, which I am commanding you today, so that you have it good and your children after you, and in order that you live long on the land that Adonoy, your God, is giving you for all time.", "pj": "וְתִנְטְרוּן יַת קְיָימוֹי וְיַת פִּקּוּדוֹי דַּאֲנָא מְפַקֵיד לְכוֹן יוֹמָא דֵין דְּיוֹטִיב לְכוֹן וְלִבְנֵיכוֹן בַּתְרֵיכוֹן וּמִן בִּגְלַל דְּתִינְגְּדוּן יוֹמָא דֵין עַל אַרְעָא דַיְיָ אֱלָהָכוֹן יָהֵיב לְכוֹן כָּל יוֹמַיָא", "pj_en": "Therefore observe His covenant, and the commandments which I command you this day, that He may do good to you and to your children after you, and that you may have continuance upon the land which the Lord your God giveth you for all days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 41, "aliyah": 3, "heb": "אָ֣ז יַבְדִּ֤יל מֹשֶׁה֙ שָׁלֹ֣שׁ עָרִ֔ים בְּעֵ֖בֶר הַיַּרְדֵּ֑ן מִזְרְחָ֖ה שָֽׁמֶשׁ׃", "onk": "בְּכֵן יַפְרֵשׁ משֶׁה תְּלַת קִרְוִין בְּעִבְרָא דְּיַרְדְּנָא מִדְנַח שִׁמְשָׁא:", "onk_en": "Then Moshe set aside three cities across the Yardein, where the sun rises,", "pj": "הָא בְּכֵן אַפְרֵשׁ משֶׁה תְּלַת קִרְוִין בְּעִבְרָא דְיוֹרְדְּנָא מַדְנַח שִׁמְשָׁא", "pj_en": "And now, behold, Mosheh set apart three cities beyond the Jordan toward the sunrise,", "tj": "", "tj_en": "", "rashi": "<b>אז יבדיל.<\/b> נָתַן לֵב לִהְיוֹת חָרֵד לַדָּבָר שֶׁיַּבְדִּילֵם, וְאַעַ\"פִּ שֶׁאֵינָן קוֹלְטוֹת עַד שֶׁיֻּבְדְּלוּ אוֹתָן שֶׁבְּאֶרֶץ כְּנַעַן, אָמַר מֹשֶׁה מִצְוָה שֶׁאֶפְשָׁר לְקַיְּמָהּ אֲקַיְּמֶנָּה (מכות י'):<br><br><b>בעבר הירדן מזרחה שמש.<\/b> בְּאוֹתוֹ עֵבֶר שֶׁבְּמִזְרָחוֹ שֶׁל יַרְדֵּן:<br><br><b>מזרחה שמש.<\/b> לְפִי שֶׁהוּא דָּבוּק, נְקוּדָה רֵי\"שׁ בַּחֲטָף, מִזְרָח שֶׁל שֶׁמֶשׁ – מְקוֹם זְרִיחַת הַשֶּׁמֶשׁ:", "rashi_en": "אז יבדיל — The imperfect form יבדיל instead of הבדיל is to be thus explained (cf. Rashi on Exodus 15:1): He set his attention to be zealous for the matter, — to set them apart. And although they were not to serve as cities of refuge until those of Canaan proper (the western side of the Jordan) were set apart for that purpose, Moses said, Any duty that it is possible for me to perform I will perform (Makkot 10a).<br><br>בעבר הירדן מזרחה שמש ON THE SIDE OF THE JORDAN TOWARDS THE SUN-RISING — i.e. on that side which is on the east of Jordan (not the side of the Jordan that is east of Canaan proper).<br><br>מזרחה שמש — Because it (the word מזרחה) is in the construct state the ר is vowelled with Chataph (vocal Sheva), the meaning being, “the rising of the sun\", i.e., the place of the sun's rising."}, {"ch": 4, "v": 42, "aliyah": 3, "heb": "לָנֻ֨ס שָׁ֜מָּה רוֹצֵ֗חַ אֲשֶׁ֨ר יִרְצַ֤ח אֶת־רֵעֵ֙הוּ֙ בִּבְלִי־דַ֔עַת וְה֛וּא לֹא־שֹׂנֵ֥א ל֖וֹ מִתְּמֹ֣ל שִׁלְשֹׁ֑ם וְנָ֗ס אֶל־אַחַ֛ת מִן־הֶעָרִ֥ים הָאֵ֖ל וָחָֽי׃", "onk": "לְמֵעִירוֹק תַּמָּן קָטוֹלָא דִּי יִקְטוֹל יָת חַבְרֵיהּ בְּלָא מַנְדְּעֵי וְהוּא לָא סָנֵי לֵיהּ מֵאִתְמַלֵּי וּמִדְּקַמּוֹהִי וְיֵעִרוֹק לְחַד מִן קִרְוַיָּא הָאִלֵּין וְיִתְקַיָּם:", "onk_en": "for a murderer to escape there, who has murdered his neighbor without intent, and he had not been his enemy yesterday [or] the day before. He is to flee to one of these cities to survive:", "pj": "לְמֵעֲרוֹק לְתַמָּן קָטוֹלָא דְיִקְטוֹל יַת חַבְרֵיהּ וְלָא אִתְכְּוַון וְהוּא לָא שָנֵי לֵיהּ מֵאִיתְמְלֵי וּמִדְקָמוֹהִי וְיֵעִירוֹק לַחֲדָא מִקִּרְוַויָא הָאִלֵין וְיִתְקַיָּים", "pj_en": "that the manslayer who had killed his neighbour without intention, not having hated him yesterday or before, may flee, and escape into
