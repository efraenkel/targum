דָן לְגַלְגְּלַיָא חָזְרוּ גַּלְגְּלַיָא וְרִידְוָותָא לְמֶהֶוְיַין נַגְדָן לְמוֹלִיתָא וּרְמַיָין עַל יַמָא עַנְיָין מִצְרָאֵי וְאָמְרִין אִילֵין לְאִילֵין נִיעֲרוֹק מִן קֳדָם עַמָּא דִבְנֵי יִשְרָאֵל אֲרוּם דֵּין הוּא מֵימְרָא דַיְיָ דַּהֲוָה עָבִיד לְהוֹן נִיצְחָנֵי קֳרָבֵיהוֹן עַד דַּהֲוָון יַתְבִין גַבָּן בְּמִצְרָיִם:", "tj_en": "And he unloosed the wheels of their carriages, so that they went, dragging them after them: the mules, going after their way before the wheels, were turned, so as that the wheels went before the mules, and they were cast into the sea. The Mizraee answered and said on to another, Let us flee from before the people of the sons of Israel; for this is the Word of the Lord who worketh victory for them in their battles; so that they set the back against Mizraim.", "rashi": "<b>ויסר את אפן מרכבתיו.<\/b> מִכֹּחַ הָאֵשׁ נִשְׂרְפוּ הַגַּלְגַּלִּים, וְהַמֶּרְכָּבוֹת נִגְרָרוֹת, וְהַיּוֹשְׁבִים בָּהֶם נָעִים וְאֵבָרֵיהֶן מִתְפָּרְקִין (מכילתא):<br><br><b>וינהגהו בכבדת.<\/b> בְּהַנְהָגָה שֶׁהִיא כְבֵדָה וְקָשָׁה לָהֶם; בַּמִדָּה שֶׁמָּדְדוּ: \"וַיַּכְבֵּד\" לִבּוֹ הוּא וַעֲבָדָיו (שמות ט'), אַף כָּאן וַיְנַהֲגֵהוּ \"בִּכְבֵדֻת\":<br><br><b>נלחם להם במצרים.<\/b> בַּמִּצְרִיִּים. דָּבָר אַחֵר בְּמִצְרָיִם – בְּאֶרֶץ מִצְרַיִם, שֶׁכְּשֵׁם שֶׁאֵלּוּ לוֹקִים עַל הַיָּם כָּךְ לוֹקִים אוֹתָם שֶׁנִּשְׁאֲרוּ בְּמִצְרַיִם (מכילתא):", "rashi_en": "‎ויסר את אפן מרכבותיו AND HE REMOVED THEIR CHARIOT WHEELS — Through the power of the fire of the pillar of fire the wheels were burnt and the chariots were thus dragged along and those who were sitting in them were thrown about and their limbs were all put out of joint (cf. Mekhilta).<br><br>וינהגהו בכבדות signifies: And He treated them with a treatment that was hard and harsh to them. In the measure that they (the Egyptians) had meted out to the Israelites was it meted out to them, for (9:34) “He hardened his heart, he and his servants”, and therefore here: “He treated them (the Egyptians) in a hard manner” (cf. Mekhilta).<br><br>נלחם להם במצרים FIGHTETH FOR THEM במצריים — means against the Egyptians. Another explanation of במצרים is: in the land of Egypt, for just as these were smitten at the Sea so, too, were smitten those who remained in Egypt (cf. Mekhilta)."}, {"ch": 14, "v": 26, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה נְטֵ֥ה אֶת־יָדְךָ֖ עַל־הַיָּ֑ם וְיָשֻׁ֤בוּ הַמַּ֙יִם֙ עַל־מִצְרַ֔יִם עַל־רִכְבּ֖וֹ וְעַל־פָּרָשָֽׁיו׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֲרֵים יָת יְדָךְ עַל יַמָא וִיתוּבוּן מַיָא עַל מִצְרָאֵי עַל רְתִכֵּיהוֹן וְעַל פָּרָשֵׁיהוֹן:", "onk_en": "Adonoy said to Moshe, “Extend your hand over the sea, and the water will come back over the Egyptians, [over] their chariots and their cavalry.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אַרְכַן יַת יְדָךְ עַל יַמָא וִיתוּבוּן מָאִין עַל מִצְרָאֵי עַל רְתִיכֵהוֹן וְעַל פָּרָשֵׁיהוֹן", "pj_en": "And the Lord said to Mosheh, Stretch forth thy hand over the sea, that the waters may return upon the Mizraee, upon their chariots and upon their horsemen.", "tj": "אַרְכִין:", "tj_en": "Stretch forth.", "rashi": "<b>וישבו המים.<\/b> שֶׁזְּקוּפִין וְעוֹמְדִים כְּחוֹמָה, יָשׁוּבוּ לִמְקוֹמָם וִיכַסּוּ עַל מִצְרַיִם:", "rashi_en": "וישבו המים means THE WATERS that were standing erect as a wall SHALL RETURN to their places and form a cover over the Egyptians."}, {"ch": 14, "v": 27, "aliyah": 4, "heb": "וַיֵּט֩ מֹשֶׁ֨ה אֶת־יָד֜וֹ עַל־הַיָּ֗ם וַיָּ֨שׇׁב הַיָּ֜ם לִפְנ֥וֹת בֹּ֙קֶר֙ לְאֵ֣יתָנ֔וֹ וּמִצְרַ֖יִם נָסִ֣ים לִקְרָאת֑וֹ וַיְנַעֵ֧ר יְהֹוָ֛ה אֶת־מִצְרַ֖יִם בְּת֥וֹךְ הַיָּֽם׃", "onk": "וַאֲרֵים משֶׁה יָת יְדֵהּ עַל יַמָא וְתָב יַמָא לְעִדַן צַפְרָא לְתָקְפֵּהּ וּמִצְרָאֵי עָרְקִין לְקַדָמוּתֵהּ <b>וְשַׁנִיק<\/b> יְיָ יָת מִצְרָאֵי בְּגוֹ יַמָא:", "onk_en": "Moshe extended his hand over the sea, and, toward morning, the sea returned to its strength while the Egyptians were fleeing toward it. Adonoy overturned [<b>stirred<\/b>] the Egyptians in the midst of the sea.", "pj": "וְאַרְכַן משֶׁה יַת יְדֵיהּ עַל יַמָא וְתַב יַמָא לְעִידוֹנֵי צַפְרָא לְתוּקְפֵיהּ וּמִצְרָאֵי עַרְקִין כָּל קְבֵיל גְּלָלוֹי וְעַלִּים יְיָ יַת מִצְרָאֵי בְּגוֹ יַמָא דְלָא יְמוּתוּן בְּמִצְעֵי מִן בִּגְלַל דִּיקַבְּלוּן פּוּרְעָנוּת דְּמִשְׁתַּלְחָא לְהוֹן", "pj_en": "And Mosheh stretched out his hand over the sea, and the sea returned at the time of the morning unto its strength; and the Mizraee fled from before its waves. And the Lord strengthened the Mizraee in the midst of the sea, that they should not (soon) die in the midst of it, that they might receive the punishment which had been sent to them.", "tj": "וְאַרְכִין משֶׁה יַת יְדֵיהּ עַל יַמָא וַחֲזַר יַמָּא לְעִידָנוֹי צַפְרָא לְאַתְרֵיהּ:", "tj_en": "And Mosheh stretched forth his hand over the sea, and the sea returned at the time of the morning to its place.", "rashi": "<b>לפנות בקר.<\/b> לְעֵת שֶׁהַבֹּקֶר פּוֹנֶה לָבֹא:<br><br><b>לאיתנו.<\/b> לְתָקְפּוֹ הָרִאשׁוֹן (מכילתא):<br><br><b>נסים לקראתו.<\/b> שֶׁהָיוּ מְהֻמָּמִים וּמְטֹרָפִים וְרָצִין לִקְרַאת הַמַּיִם:<br><br><b>וינער ה'.<\/b> כְּאָדָם שֶׁמְּנַעֵר אֶת הַקְּדֵרָה וְהוֹפֵךְ הָעֶלְיוֹן לְמַטָּה וְהַתַּחְתּוֹן לְמַעְלָה, כָּךְ הָיוּ עוֹלִין וְיוֹרְדִין וּמִשְׁתַּבְּרִין בַּיָּם, וְנָתַן הַקָּבָּ\"ה בָּהֶם חַיּוּת לְקַבֵּל הַיִּסּוּרִין (שם):<br><br><b>וינער.<\/b> \"וְשַׁנֵּיק\", וְהוּא לְשׁוֹן טֵרוּף בִּלְשׁוֹן אֲרַמִּי, וְהַרְבֵּה יֵשׁ בְּמִ\"אַ:", "rashi_en": "לפנות בקר AT THE TURNING OF THE MORNING at the time when the morning turns to come).<br><br>לאיתנו means TO ITS ORIGINAL STRENGTH (Mekhilta).<br><br>נסים לקראתו FLED TOWARDS IT — because they were thrown into confusion and were bewildered and on that account ran towards it.<br><br>וינער ה AND THE LORD OVERTHREW (or, shook out or emptied out) — as a person empties out a pot, turning what is on top underneath and what is underneath on top: thus they were emptied out of their chariots and they rose and fell till at last they were broken to pieces in the sea, and the Holy One, blessed be He, put vitality (strength) in them so that they could bear the pain (and thus their agony was protracted) (cf. Mekhilta).<br><br>וינער — Onkelos renders this by ושניק which is an expression for confounding in Aramaic, and there are many examples of it in the Agadic expositions."}, {"ch": 14, "v": 28, "aliyah": 4, "heb": "וַיָּשֻׁ֣בוּ הַמַּ֗יִם וַיְכַסּ֤וּ אֶת־הָרֶ֙כֶב֙ וְאֶת־הַפָּ֣רָשִׁ֔ים לְכֹל֙ חֵ֣יל פַּרְעֹ֔ה הַבָּאִ֥ים אַחֲרֵיהֶ֖ם בַּיָּ֑ם לֹֽא־נִשְׁאַ֥ר בָּהֶ֖ם עַד־אֶחָֽד׃", "onk": "וְתָבוּ מַיָא וַחֲפוֹ יָת רְתִכַּיָא וְיָת פָּרָשַׁיָא לְכֹל מַשִׁרְיַת פַּרְעֹה דְעַלוּ בַתְרֵיהוֹן בְּיַמָא לָא אִשְׁתָּאַר בְּהוֹן עַד חָד:", "onk_en": "The waters returned and covered the chariots, and the cavalry, including Pharaoh’s entire army which had followed them into the sea. Not one of them remained [alive].", "pj": "וְתָבוּ גַלְלֵי יַמָא וְחָפוּן יַת רְתִיכַיָיא וְיַת פַּרְשַׁיָא לְכָל מַשִּׁרְיַת פַּרְעה דְּעָלַן בַּתְרֵיהוֹן בְּיַמָא לָא אִישְׁתַּיֵּיר בְּהוֹן עַד חָד", "pj_en": "And the waves of the sea returned, and covered the chariots, and the horsemen and all the host of Pharoh who had gone in after them, into the sea, not one among them was left.", "tj": "", "tj_en": "", "rashi": "<b>ויכסו את הרכב, לכל חיל פרעה.<\/b> כָּךְ דֶּרֶךְ הַמִּקְרָאוֹת לִכְתֹּב לָמֶ\"ד יְתֵרָה, כְּמוֹ \"לְכָל כֵּלָיו תַּעֲשֶׂה נְחֹשֶׁת\" (שמות כ\"ז), וְכֵן \"לְכֹל כְּלֵי הַמִּשְׁכָּן בְּכֹל עֲבֹדָתוֹ\" (במדבר ד'), \"וִיתֵדוֹתָם וּמֵיתְרֵיהֶם לְכָל כְּלֵיהֶם\" (שם), וְאֵינָהּ אֶלָּא תִּקּוּן לָשׁוֹן:", "rashi_en": "ויכסו את הרכב ... לכל חיל פרעה AND COVERED THE CHARIOTS … AND ALL THE FORCES OF PHARAOH — in regard to the ל of לכל, this is the way of Scripture verses (of Biblical Hebrew) to write a redundant ל, as in (Exodus 27:3) “all (לכל) its vessels shalt thou make of copper”.. So, too, (Exodus 27:19) ‘‘all (לכל) the vessels of the dwelling in all the service thereof”; (Numbers 4:32) “and their pins and their cords and all (לכל) their vessels”. It is only an elegancy of style."}, {"ch": 14, "v": 29, "aliyah": 4, "heb": "וּבְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַיַּבָּשָׁ֖ה בְּת֣וֹךְ הַיָּ֑ם וְהַמַּ֤יִם לָהֶם֙ חֹמָ֔ה מִֽימִינָ֖ם וּמִשְּׂמֹאלָֽם׃", "onk": "וּבְנֵי יִשְׂרָאֵל הַלִיכוּ בְיַבֶּשְׁתָּא בְּגוֹ יַמָא וּמַיָא לְהוֹן <b>שׁוּרִין<\/b> מִיַמִינֵהוֹן וּמִסְמָאלֵהוֹן:", "onk_en": "The B’nei Yisrael walked on dry land in the midst of the sea. For them the waters were a wall [<b>walls<\/b>] to their right and to their left.", "pj": "וּבְנֵי יִשְרָאֵל הֲלִיכוּ בְּיַבֶּשְׁתָּא בְּגוֹ יַמָא וּמַיָא לְהוֹן הֵי כְשׁוּרִין מִיַמִּינְהוֹן וּמִשְמָאלֵהוֹן", "pj_en": "But the sons of Israel walked on the ground in the midst of the sea, and the waters to them were as walls on their right hand and on their left.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 30, "aliyah": 4, "heb": "וַיּ֨וֹשַׁע יְהֹוָ֜ה בַּיּ֥וֹם הַה֛וּא אֶת־יִשְׂרָאֵ֖ל מִיַּ֣ד מִצְרָ֑יִם וַיַּ֤רְא יִשְׂרָאֵל֙ אֶת־מִצְרַ֔יִם מֵ֖ת עַל־שְׂפַ֥ת הַיָּֽם׃", "onk": "וּפְרַק יְיָ בְּיוֹמָא הַהוּא יָת יִשְׂרָאֵל מִידָא דְמִצְרָאֵי וַחֲזוֹ יִשְׂרָאֵל יָת מִצְרָאֵי מַיְתִין עַל כֵּיף יַמָא:", "onk_en": "On that day Adonoy delivered [B’nei] Yisrael from the hand of Egypt. [B’nei] Yisrael saw the Egyptians dead on the seashore.", "pj": "וּפְרִיק וּשְׁזִיב יְיָ בְּיוֹמָא הַהוּא יַת יִשְרָאֵל מִן יְדֵיהוֹן דְּמִצְרָאֵי וְחָמוּן יִשְרָאֵל יַת מִצְרָאֵי מֵיתִין וְלָא מֵיתִין רְמָאִין עַל גֵּיף יַמָא", "pj_en": "That day the Lord redeemed and saved Israel from the hand of the Mizraee; and Israel saw the Mizraee, dead and not dead, cast upon the shore of the sea.", "tj": "", "tj_en": "", "rashi": "<b>וירא ישראל את מצרים מת.<\/b> שֶׁפְּלָטָן הַיָּם עַל שְׂפָתוֹ, כְּדֵי שֶׁלֹּא יֹאמְרוּ יִשְׂרָאֵל, כְּשֵׁם שֶׁאָנוּ עוֹלִים מִצַּד זֶה כָּךְ הֵם עוֹלִין מִצַּד אַחֵר, רָחוֹק מִמֶּנּוּ, וְיִרְדְּפוּ אַחֲרֵינוּ (פסחים קי\"ח):", "rashi_en": "וירא ישראל את מצרים מת AND ISRAEL SAW THE EGYPTIANS DEAD — because the sea threw them out on its shore in order that the Israelites should not say: “Just as we have come up from out of the sea on this part, so they have come up on another part of this shore, but far away from us, and they will pursue us” (Mekhilta; Pesachim 118b; Arakhin 15a)."}, {"ch": 14, "v": 31, "aliyah": 4, "heb": "וַיַּ֨רְא יִשְׂרָאֵ֜ל אֶת־הַיָּ֣ד הַגְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהֹוָה֙ בְּמִצְרַ֔יִם וַיִּֽירְא֥וּ הָעָ֖ם אֶת־יְהֹוָ֑ה וַֽיַּאֲמִ֙ינוּ֙ בַּֽיהֹוָ֔ה וּבְמֹשֶׁ֖ה עַבְדּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַחֲזָא יִשְׂרָאֵל יָת <b>גְבוּרְתָּא<\/b> יְדָא רַבְּתָא דִי עֲבַד יְיָ בְּמִצְרַיִם וּדְחִילוּ עַמָא <b>מִן קֳדָם<\/b> יְיָ וְהֵמִינוּ <b>בְּמֵימְרָא<\/b> דַיְיָ <b>וּבִנְבִיאוּת<\/b> משֶׁה עַבְדֵהּ:", "onk_en": "[B’nei] Yisrael saw the [<b>might of the<\/b>] great hand which Adonoy wielded against Egypt. The people feared [<b>from before<\/b>] Adonoy, and believed in [<b>the Word of<\/b>] Adonoy and [that] [<b>in the prophecy of<\/b>] Moshe [was] His servant.", "pj": "וְחָמוּן יִשְרָאֵל יַת גְּבוּרַת יְדָא תַקִיפְתָּא דִי עָבַד יְיָ בָּהּ נִיסִין בְּמִצְרַיִם וּדְחִילוּ עַמָא מִן קֳדָם יְיָ וְהֵימִינוּן בְּשׁוּם מֵימְרָא דַיְיָ וּבִנְבוּאָתֵיהּ דְּמשֶׁה עַבְדֵיהּ", "pj_en": "And Israel saw the power of the mighty hand by which the Lord had wrought the miracles in Mizraim; and the people feared before the Lord, and believed in the Name of the Word of the Lord, and in the prophecies of Mosheh His servant.", "tj": "", "tj_en": "", "rashi": "<b>את היד הגדולה.<\/b> אֶת הַגְּבוּרָה הַגְּדוֹלָה שֶׁעָשְׂתָה יָדוֹ שֶׁל הַקָּבָּ\"ה. וְהַרְבֵּה לְשׁוֹנוֹת נוֹפְלִין עַל לְשׁוֹן יָד וְכֻלָּן לְשׁוֹן יָד מַמָּשׁ הֵן, וְהַמְפָרְשׁוֹ יְתַקֵּן הַלָּשׁוֹן אַחַר עִנְיַן הַדִּבּוּר:", "rashi_en": "את היד הגדלה denotes THE GREAT power which the HAND of the Holy One, blessed be He, had exercised. There are many meanings that are appropriate to the expression יד, hand, but all of them really signify the actual hand, and he who is explaining it must adapt the language according to the meaning of the passage."}, {"ch": 15, "v": 1, "aliyah": 4, "heb": "אָ֣ז יָשִֽׁיר־מֹשֶׁה֩ וּבְנֵ֨י יִשְׂרָאֵ֜ל אֶת־הַשִּׁירָ֤ה הַזֹּאת֙ לַֽיהֹוָ֔ה וַיֹּאמְר֖וּ לֵאמֹ֑ר&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;אָשִׁ֤ירָה לַֽיהֹוָה֙ כִּֽי־גָאֹ֣ה גָּאָ֔ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;ס֥וּס וְרֹכְב֖וֹ רָמָ֥ה בַיָּֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּכֵן <b>שַׁבַּח<\/b> משֶׁה וּבְנֵי יִשְׂרָאֵל יָת <b>תִּשְׁבַּחְתָּא הָדָא קֳדָם<\/b> יְיָ וַאֲמָרוּ לְמֵימָר <b>נְ<\/b>שַׁבַּח <b>וְנוֹדֵי קָדָם<\/b> יְיָ אֲרֵי <b>אִתְגָאֵי עַל גֵוְתָנַיָא וְגֵאוּתָא דִילֵהּ הִיא<\/b> סוּסְיָא וְרָכְבֵהּ רְמָא בְיַמָא:", "onk_en": "Then Moshe and the B’nei Yisrael sang this song to [<b>exalted this praise before<\/b>] Adonoy and they said, I [<b>We<\/b>] will sing to [<b>praise and we will give thanks before<\/b>] Adonoy for He is most high [<b>exalted Himself above those who are exalted, and exaltation is His<\/b>], horse and its rider He threw into the sea.", "pj": "הָא בְּכֵן שַׁבַּח משֶׁה וּבְנֵי יִשְרָאֵל יַת שְׁבַח שִׁירָתָא הָדָא קֳדָם יְיָ וְאָמְרִין לְמֵימָר נוֹדֶה וּנְשַׁבְּחָא קֳדָם יְיָ רְמָא דְמִתְגָּאֵי עַל גֵּיוְותָנַיָא וּמִתְנַטֵּל עַל מְנַטְלַיָא כָּל מַאן דְּמִתְגָּאֵי קֳדָמוֹי הוּא בְּמֵימְרֵיהּ פָּרַע מִנֵּיהּ עַל דִּי אָזִיד פַּרְעה רַשִׁיעָא קֳדָם יְיָ וְאִתְנַטַּל בִּלְבָבֵיהּ וּרְדַף בָּתַר עַמָּא בְּנֵי יִשְרָאֵל סוּסְוָון וְרוֹכְבֵיהוֹן רָמָא וּטְמַע יַתְהוֹן בְּיַמָא דְסוּף", "pj_en": "Behold: then sang, Mosheh and the sons of Israel this song of praise before the Lord and saying they said: Thanksgiving and praise we bring before the Lord Most High, who is glorified above the glorious, and exalted above the exalted; who punisheth by His Word whomsoever glorifieth himself before Him. Therefore when Pharoh the wicked bare himself proudly before the Lord, and, being uplifted in his heart, followed after the people of the sons of Israel, their horses and their chariots He threw and buried in the sea of Suph.", "tj": "בְּכֵן שַׁבַּח משֶׁה וּבְנֵי יִשְרָאֵל יַת שְׁבַח שִׁירָתָא הָדָא קֳדָם יְיָ וְאָמְרִין לְמֵימָר נוֹדֵי וּנְשַׁבַּח קֳדָם יְיָ דְּהוּא רָם עַל רָמַיָא וּמִתְגָּאֵי עַל ^גֵּיוְתָנַיָא וְכָל מַן דְּמִתְגָּאֶה קֳדָמוֹהִי הוּא בְּמֵימְרֵיהּ מִתְפְּרַע מִנֵּיהּ סוּסְוָון וְרִכְבֵיהוֹן עַל דְּאִיתְגָאוּ וּרְדָפוּ בָּתַר עַמָּא דְּבֵית יִשְרָאֵל רְמָא וּטְבַע יַתְהוֹן בְּיַמָא דְסוּף:", "tj_en": "Then sang Mosheh and the sons of Israel the praise of this song, before the Lord, saying, to say: Thanksgiving and praise bring we before the Lord, who is high above the highest, and glorified above the glorious, and who punisheth by His Word whom. Whomsoever glorifieth himself before Him. The horses and their riders, because they bare themselves proudly and followed after the people of the house of Israel, He hath thrown and buried in the sea of Suph.", "rashi": "<b>אז ישיר משה.<\/b> אָז כְּשֶׁרָאָה הַנֵּס עָלָה בְלִבּוֹ שֶׁיָּשִׁיר שִׁירָה. וְכֵן \"אָז יְדַבֵּר יְהוֹשֻׁעַ\" (יהושע י'), וְכֵן \"וּבַיִת יַעֲשֶׂה לְבַת פַּרְעֹה\" (מלכים א ז') – חָשַׁב בְּלִבּוֹ שֶׁיַּעֲשֶׂה לָהּ, אַף כָּאן יָשִׁיר אָמַר לוֹ לִבּוֹ שֶׁיָּשִׁיר וְכֵן עָשָׂה – וַיֹּאמְרוּ לֵאמֹר אָשִׁירָה לַה', וְכֵן בִּיהוֹשֻׁעַ כְּשֶׁרָאָה הַנֵּס אָמַר לוֹ לִבּוֹ שֶׁיְּדַבֵּר וְכֵן עָשָׂה – \"וַיֹּאמֶר לְעֵינֵי יִשְׂרָאֵל\" (יהושע י'), וְכֵן שִׁירַת הַבְּאֵר, שֶׁפָּתַח בָּהּ אָז יָשִׁיר יִשְׂרָאֵל, פֵּרֵשׁ אַחֲרָיו \"עֲלִי בְאֵר עֱנוּ לָהּ\" (במדבר י\"א), \"אָז יִבְנֶה שְׁלֹמֹה בָּמָה\" (מלכים א י\"א), פֵּרְשׁוּ בוֹ חַכְמֵי יִשְׂרָאֵל שֶׁבִּקֵּשׁ לִבְנוֹת וְלֹא בָנָה, לִמְּדָנוּ שֶׁהַיּוֹ\"ד עַל שֵׁם הַמַּחֲשָׁבָה נֶאֶמְרָה, זֶהוּ לְיַשֵּׁב פְּשׁוּטוֹ. אֲבָל מִדְרָשׁוֹ אָמְרוּ רַבּוֹתֵינוּ זִ\"לִ \"מִכָּאן רֶמֶז לִתְחִיַּת הַמֵּתִים מִן הַתּוֹרָה\" וְכֵן בְּכֻלָּן, חוּץ מִשֶּׁל שְׁלֹמֹה, שֶׁפֵּרְשׁוּהוּ בִּקֵּשׁ לִבְנוֹת וְלֹא בָנָה. וְאֵין לוֹמַר וּלְיַשֵּׁב לָשׁוֹן הַזֶּה כִּשְׁאָר דְּבָרִים הַנִּכְתָּבִים בִּלְשׁוֹן עָתִיד וְהֵן מִיָּד, כְּגוֹן \"כָּכָה יַעֲשֶׂה אִיּוֹב\" (איוב א'), \"עַ\"פִּ ה' יַחֲנוּ\" (במדבר ט'), \"וְיֵשׁ אֲשֶׁר יִהְיֶה הֶעָנָן\" (שם), לְפִי שֶׁהֵן דָּבָר הַהוֹוֶה תָמִיד וְנוֹפֵל בּוֹ בֵּין לְשׁוֹן עָתִיד וּבֵין לְשׁוֹן עָבָר, אֲבָל זֶה שֶׁלֹּא הָיָה אֶלָּא לְשָׁעָה, אֵינִי יָכוֹל לְיַשְּׁבוֹ בַּלָּשׁוֹן הַזֶּה:<br><br><b>כי גאה גאה.<\/b> כְּתַרְגּוּמוֹ. (דָּ\"אַ – בָּא הַכֵּפֶל לוֹמַר שֶׁעָשָׂה דָּבָר שֶׁאִי אֶפְשָׁר לְבָשָׂר וָדָם לַעֲשׂוֹת; כְּשֶׁהוּא נִלְחָם בַּחֲבֵרוֹ וּמִתְגַּבֵּר עָלָיו, מַפִּילוֹ מִן הַסּוּס, וְכָאן הַסוּס וְרֹכְבוֹ רָמָה בַיָּם, וְכָל שֶׁאִי אֶפְשָׁר לַעֲשׂוֹת עַל יְדֵי זוּלָתוֹ נוֹפֵל בּוֹ לְשׁוֹן גֵּאוּת, כְּמוֹ \"כִּי גֵאוּת עָשָׂה\" (ישעיהו י\"ב), וְכֵן כָּל הַשִּׁירָה תִּמְצָא כְפוּלָה, עָזִּי וְזִמְרָת יָהּ וַיְהִי לִי לִישׁוּעָה, ה' אִישׁ מִלְחָמָה ה' שְׁמוֹ, וְכֵן כֻּלָּם). דָּבָר אַחֵר – <b>כי גאה גאה<\/b>, עַל כָּל הַשִּׁירוֹת וְכָל מַה שֶּׁאֲקַלֵּס בּוֹ, עוֹד יֵשׁ בּוֹ תּוֹסֶפֶת, וְלֹא כְמִדַּת מֶלֶךְ בָּשָׂר וָדָם שֶׁמְּקַלְּסִין אוֹתוֹ וְאֵין בּוֹ:<br><br><b>סוס ורכבו.<\/b> שְׁנֵיהֶם קְשׁוּרִים זֶה בָּזֶה וְהַמַּיִם מַעֲלִין אוֹתָן וְיוֹרְדִין לָעֹמֶק וְאֵינָן נִפְרָדִין (מכילתא):<br><br><b>רמה.<\/b> הִשְׁלִיךְ, וְכֵן \"וּרְמִיו לְגוֹא אַתּוּן נוּרָא\" (דניאל ג'). וּמִדְרַשׁ אַגָּדָה: כָּתוּב אֶחָד אוֹמֵר רָמָה, וְכָתוּב אֶחָד אוֹמֵר יָרָה, מְלַמֵּד שֶׁהָיוּ עוֹלִין לָרוּם וְיוֹרְדִין לַתְּהוֹם, כְּמוֹ \"מִי יָרָה אֶבֶן פִּנָּתָהּ\" (איוב ל\"ח), מִלְמַעְלָה לְמַטָּה:", "rashi_en": "אז ישיר משה THEN SANG MOSES — with regard to the usage of the future ישיר, the meaning is: THEN — i. e. when he saw the miracle it entered his mind that HE WOULD SING a song. Similar is, (Joshua 10:12) “Then Joshua would speak (אז ידבר)”; and similar, (1 Kings 7:8) “and a house he would make (יעשה) for Pharaoh’s daughter”, which signifies “he purposed in his heart that he would make it for her”. So, also, ישיר here signifies: his heart told him that he should sing, and thus did he actually do, as it states, “and they (Moses and Israel) spake as follows, ‘I will sing unto the Lord’”. And in the same way, in the case of Joshua, it means: then (או) — when he saw the miracle mentioned in that narrative — his heart told him (prompted him) to speak, and thus did he actually do, as it is stated, “and he spake before the eyes of all Israel”. The same applies to the Song of the Well (Numbers 21:17) which begins with the words: אז ישיר ישראל, “then would Israel sing”; it expresses the intention quite plainly in the following words, “Come up, O Well — sing ye unto it” (i. e. these words are a call to the people to sing to it after Israel had expressed their intention so to do and are not part of the song itself which begins with the words that follow). With regard to (1 Kings 11:7) אז יבנה שלמה במה our Rabbis explained that He proposed to build a high place for Chemosh but actually did not build it (Sanhedrin 91b). This, too, teaches us that the י as a prefix of the imperfect is used in reference to intention to do a thing. This explanation serves to settle the literal meaning of the text. But so far as its Midrashic explanation is concerned our Rabbis, of blessed memory, said: from here (i. e. from the fact that the future tense is used) we may derive an intimation that the tenet of the Resurrection of the Dead is from the Torah (is alluded to, although only by inference, in the Torah) (Sanhedrin 91b). And thus, also, do they explain in the case of all them (all of the examples quoted) except in the case of that referring to Solomon which they explained in the sense that he purposed to build a high place but did not build it. — One cannot say that this can be appropriately explained in the same way as one explains other passages which are written in the future tense, but which really refer to an immediate action (i. e. to a then present time); for example, (Job. 1:5) “Thus was Job doing (יעשה)”; (Numbers 9:18) “At the command of the Lord were they encamping (יחנו)”; (Numbers 9:20) “And there were occasions when the cloud was (יהיה) upon the tabernacle”, because these were each of them something that was continuously happening, and there is proper to it either the future tense or the past tense (cf. Rashi on Genesis 29:3). But this (אז ישיר and other passages quoted) which happened only at the particular moment mentioned (once and once only), one cannot fittingly explain in this sense (i. e. of continuous action).<br><br>כי גאה גאה FOR HE IS GLORIOUSLY SUBLIME — render this as the Targum does: for He is exalted above all exalted beings and real exaltation (supremity) is His alone. [Another explanation: the repetition of the word is intended to state that He has done something which it is impossible for a human being (lit., flesh and blood) to do. When he (the latter) fights against another and vanquishes him he throws him off the horse, but here — horse and its rider together hath He hurled into the sea. The usage is, that in the case of everything which cannot possibly be done by anyone except Him the appropriate expression to use is a form of the root גאה, as in (Isaiah 12:5), “for He hath done גאות” — gloriously. In the same way you will find that throughout the whole Song the words are repeated: (v. 2) “The strength and vengeance of the Lord have become my help”; (v. 4). “The Lord is a man of war, the Lord is His name” (cf. Rashi’s explanation of this), and this is the case in all the verses]. Another explanation of כי גאה גאה: I will sing unto the Lord although (כי) He is exalted high above all songs and however much I may praise Him there will still remain something additional in Him to be praised (עוד יש בו תוספת — I can never exhaust his praises), and not as is the practice in respect to a human king whom one praises, attributing to him certain virtues whilst these are really not in him (cf. Mekhilta).<br><br>סוס ורכבו THE HORSE AND ITS RIDER — both of them attached one to the other; and the waters lifted them up and then they descended into the depths and yet they did not become separated (Mekhilta).<br><br>רמה means HE HATH CAST. Similar is (Daniel 3:21) “and they were cast (ורמיו) into the midst of the fiery furnace”. And an Agadic explanation is: One verse says רמה, which involves the idea of raising (רום), and another verse (v. 4) says, ירה which implies casting from a height (cf. Rashi on ירה יירה 19:13)! This teaches us that they first went up on high and then went down into the depths (i. e. they were tossed up and down). The meaning of ירה here is the same as in (Job. 38:6) “Who laid (ירה) the corner-stone thereof?” — implying laying from above to below (Mekhilta)."}, {"ch": 15, "v": 2, "aliyah": 4, "heb": "עׇזִּ֤י וְזִמְרָת֙ יָ֔הּ וַֽיְהִי־לִ֖י לִֽישׁוּעָ֑ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;זֶ֤ה אֵלִי֙ וְאַנְוֵ֔הוּ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;אֱלֹהֵ֥י אָבִ֖י וַאֲרֹמְמֶֽנְהוּ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>תָּקְפִּי וְתֻשְׁבַּחְתִּי דְחִילָא יְיָ וַאֲמַר בְּמֵימְרֵהּ וַהֲוָה לִי לְפָרָק<\/b> דֵין אֱלָהַי <b>וְאֶבְנֵי לֵהּ מַקְדְשָׁא<\/b> אֱלָהָא דַאֲבָהָתַי <b>וְאֶפְלַח קֳדָמוֹהִי<\/b>:", "onk_en": "The strength and retribution [<b>The awesomeness<\/b>] of God [<b>is my strength and my praise<\/b>] was the cause of my deliverance. [<b>He said with His Word and He has been a savior for me.<\/b>] This is my Almighty and I will glorify [<b>build a Temple for<\/b>] Him; the God of my father and I will exalt [<b>worship before<\/b>] Him.", "pj": "תּוּקְפַן וְרוֹב תּוּשְׁבָּחָתָן דְּחֵיל עַל כָּל עָלְמַיָא יְיָ אָמַר בְּמֵימְרֵיהּ וַהֲוָה לִי אֱלָהָא פְּרוֹק מִן חַדְיֵי אִמְהוֹן הֲווֹן יַנְקַיָא מְחַוָון בְּאֶצְבָּעַתְהוֹן לְאַבְהַתְהוֹן וְאָמְרִין דֵּין הוּא אֱלָהָן דַּהֲוָה מוֹנִיק לָן דּוּבְשָׁא מִן כֵּיפָא וּמְשַׁח מִן שָׁמִיר טִינְרָא בְּעִידַן דְּאִימַן נַפְקַן לְאַנְפֵּי בָּרָא וִילֵדַן וְשַׁבְקַן יָתָן תַּמָּן וּתְשַׁדַר מַלְאָכָא וּמַסְחֵי יָתָן וּמְלַפֵּף יָתָן וּכְדוּן נַשְׁבְּחִינֵיהּ אֱלָהָא דְּאַבְהָתָן וּנְרוֹמְמִינֵיהּ", "pj_en": "The Lord is Mighty, and greatly to be feared over all the world. He spake in His Word, and became to me a God of salvation. From their mothers' breasts even the children have given signs with their fingers to their fathers, and said This is our God, who nourished us with honey from the rock, and with oil from the stone of clay, at the time when our mothers went forth upon the face of the field to give us birth, and leave us there; and He sent an angel who washed us and enwrapped us; and now will we praise Him: He is the God of our fathers, and we will exalt Him.", "tj": "תּוּקְפָא וְרוֹב תּוּשְׁבְּחָא דְּחֵיל כָּל עַלְמָא יְיָ אָמַר בְּמֵימְרֵיהּ וַהֲוָה לָן לְפָרֵיק מִן חֲדֵי אִימְהָתָא הֲווֹי יַנְקַיָא מְרַמְזִין בְּאֶצְבָּעַתְהוֹן לְאַבְהַתְהוֹן וְאָמְרִין לְהוֹן דֵּין הוּא אֲבוּנָן דַּהֲוָה מְיַנֵּק לָן דְּבַשׁ מִן כֵּיפָא וּמָשַׁח יָתָן מִן שָׁמִיר טִינְרָא עַנְיָין בְּנֵי יִשְרָאֵל וַאֲמַר דֵּין לְדֵין דֵּין הוּא אֱלָהֵן וּנְשַׁבַּח יָתֵיהּ אֱלָהָא דְּאַבָהָתָן וּנְרוֹמְמֵיהּ יָתֵיהּ:", "tj_en": "The Lord is Mighty, and greatly to be praised and feared over all the world. He spake in His Word, and for us became salvation. From their mothers' breasts have even the children given signs with their fingers unto the fathers, and have said to them, This is our Father, who nourished us with honey from the rock, and gave us oil from the stone of clay. The sons of Israel answered and said one to another, He is our God, and we will praise Him; the God of our fathers, and we will exalt Him.", "rashi": "<b>עזי וזמרת יה.<\/b> אֻנְקְלוֹס תִּרְגֵּם \"תָּקְפִּי וְתֻשְׁבַּחְתִּי\", עָזִּי כְּמוֹ עֻזִּי, וְזִמְרָת כְּמוֹ וְזִמְרָתִי, וַאֲנִי תָּמֵהַּ עַל לְשׁוֹן הַמִּקְרָא, שֶׁאֵין לְךָ כָמוֹהוּ בִּנְקֻדָּתוֹ בַּמִּקְרָא אֶלָּא בִּשְׁלֹשָׁה מְקוֹמוֹת שֶׁהוּא סָמוּךְ אֵצֶל וְזִמְרָת, וְכָל שְׁאָר מְקוֹמוֹת נָקוּד שׁוּרֻ\"ק, \"ה' עֻזִּי וּמָעֻזִּי\" (ירמיהו ט\"ז), \"עֻזּוֹ אֵלֶיךָ אֶשְׁמֹרָה\" (תהילים נ\"ט). וְכֵן כָּל תֵּבָה בַּת שְׁתֵּי אוֹתִיּוֹת הַנְּקוּדָה מְלָאפוּם כְּשֶׁהִיא מַאֲרֶכֶת בְּאוֹת שְׁלִישִׁית וְאֵין הַשְּׁנִיָּה בַּחֲטָף, הָרִאשׁוֹנָה נְקוּדָה בְּשׁוּרֻק, כְּגוֹן עֹז עֻזִּי, רֹק רֻקִּי, חֹק חֻקִּי, עֹל עֻלּוֹ – \"וְסָר מֵעֲלֵהֶם עֻלּוֹ\" (ישעיהו י\"ד), כֹּל כֻּלּוֹ – \"וְשָׁלִשִׁם עַל כֻּלּוֹ\" (שמות י\"ד), וְאֵלּוּ ג' עָזִּי וְזִמְרָת שֶׁל כָּאן, וְשֶׁל יְשַׁעְיָה, וְשֶׁל תְּהִלִּים, נְקוּדִים בַּחֲטָף קָמָץ, וְעוֹד אֵין בְּאֶחָד מֵהֶם כָּתוּב וְזִמְרָתִי אֶלָּא וְזִמְרָת, וְכֻלָּם סָמוּךְ לָהֶם \"וַיְהִי לִי לִישׁוּעָה\". לְכָךְ אֲנִי אוֹמֵר, לְיַשֵּׁב לְשׁוֹן הַמִּקְרָא, שֶׁאֵין עָזִּי כְּמוֹ עֻזִּי וְלֹא וְזִמְרָת כְּמוֹ וְזִמְרָתִי, אֶלָּא עָזִּי שֵׁם דָּבָר הוּא כְּמוֹ \"הַיֹּשְׁבִי בַּשָּׁמָיִם\" (תהילים קכ\"ג), \"שֹׁכְנִי בְחַגְוֵי סֶלַע\" (עובדיה א'), \"שֹׁכְנִי סְנֶה\" (דברים ל\"ג), וְזֶהוּ הַשֶּׁבַח עָזִּי וְזִמְרָת יָהּ הוּא הָיָה לִי לִישׁוּעָה. וְזִמְרָת דָּבוּק הוּא לְתֵבַת הַשֵּׁם, כְּמוֹ \"לְעֶזְרַת ה'\" (שופטים ה'), \"בְּעֶבְרַת ה'\" (ישעיהו ט'), \"עַל דִּבְרַת בְּנֵי הָאָדָם\" (קהלת ג'). וּלְשׁוֹן וְזִמְרָת לְשׁוֹן \"לֹא תִזְמֹר\" (ויקרא כ\"ה), \"זְמִיר עָרִיצִים\" (ישעיהו כ\"ה), לְשׁוֹן כִּסּוּחַ וּכְרִיתָה – עֻזּוֹ וְנִקְמָתוֹ שֶׁל אֱלֹהֵינוּ הָיָה לָנוּ לִישׁוּעָה. וְאַל תִּתְמַהּ עַל לְשׁוֹן וַיְהִי, שֶׁלֹּא נֶאֱמַר הָיָה, שֶׁיֵּשׁ לָנוּ מִקְרָאוֹת מְדַבְּרִים בְּלָשׁוֹן זֶה, וְזֶה דֻגְמָתוֹ: \"אֶת קִירוֹת הַבַּיִת סָבִיב לַהֵיכָל וְלַדְּבִיר וַיַּעַשׂ צְלָעוֹת סָבִיב\" (מלכים א ו'), הָיָה לוֹ לוֹמַר עָשָׂה צְלָעוֹת סָבִיב. וְכֵן בְּדִבְרֵי הַיָּמִים: \"וּבְנֵי יִשְׂרָאֵל הַיֹּשְׁבִים בְּעָרֵי יְהוּדָה וַיִּמְלֹךְ עֲלֵיהֶם רְחַבְעָם\" (דברי הימים ב' י'), הָיָה לוֹ לוֹמַר מָלַךְ עֲלֵיהֶם רְחַבְעָם. \"מִבִּלְתִּי יְכֹלֶת ה' וְגוֹ' וַיִּשְׁחָטֵם\" (במדבר י\"ד), הָיָה לוֹ לוֹמַר שְׁחָטָם. \"וְהָאֲנָשִׁים אֲשֶׁר שָׁלַח מֹשֶׁה וְגוֹ' וַיָּמֻתוּ\" (שם) מֵתוּ הָיָה לוֹ לוֹמַר, \"וַאֲשֶׁר לֹא שָׂם לִבּוֹ אֶל דְּבַר ה' וַיַּעֲזֹב\" (שמות ט'), הָיָה לוֹ לוֹמַר עָזַב:<br><br><b>זה אלי.<\/b> בִּכְבוֹדוֹ נִגְלָה עֲלֵיהֶם וְהָיוּ מַרְאִין אוֹתוֹ בְּאֶצְבַּע, רָאֲתָה שִׁפְחָה עַל הַיָּם מַה שֶּׁלֹּא רָאוּ נְבִיאִים (מכילתא):<br><br><b>ואנוהו.<\/b> אֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן נָוֶה – \"נָוֶה שַׁאֲנָן\" (ישעיהו ל\"ג), \"לִנְוֵה צֹאן\" (שם ס\"ה). דָּבָר אַחֵר – וְאַנְוֵהוּ לְשׁוֹן נוֹי, אֲסַפֵּר נוֹיוֹ וְשִׁבְחוֹ לְבָאֵי עוֹלָם, כְּגוֹן \"מַה דּוֹדֵךְ מִדּוֹד וְגוֹ' דּוֹדִי צַח וְאָדוֹם\" (שיר השירים ה'), וְכָל הָעִנְיָן:<br><br><b>אלהי אבי.<\/b> הוּא זֶה <b>וארממנהו<\/b>: <b>אלהי אבי.<\/b> לֹא אֲנִי תְּחִלַּת הַקְּדֻשָּׁה אֶלָּא מֻחְזֶקֶת וְעוֹמֶדֶת לִי הַקְּדֻשָּׁה וֵאלֹהוּתוֹ עָלַי מִימֵי אֲבוֹתַי:", "rashi_en": "עזי וזמרת יה — Onkelos translated this by “my might and my praise”, taking עָזִּי the same as עֻזִּי, and וְזִמְרָת the same as וְזִמְרָתִי. But I wonder at the wording of the text if this translation is correct, for you will find no similar example of its punctuation (i. e. of עָזִּי) in the Scriptures except in three passages where it is, in each case, followed by וזמרת. In all other passages it is punctuated with שורק (i. e. our Kibbutz); e. g., (Jeremiah 16:19) ה' עֻזִּי ומעזי (Psalms 59:10) עֻזּו אליך אשמרה So, too, every word of two letters that is punctuated with a Melopum (our חולם) when it is lengthened by the addition of a third letter (i. e. when it has a pronominal suffix as in the examples given below), and the second has not a Sheva (חטף), the first is punctuated with a שורק (Kibbuts) — as, for instance, עֹז and עֻזִּי; ‎רֹק and ‎רֻקִי ; ‎חֹק and ‎חֻקִי ; ‎עֹל and עֻלִי as in (Isaiah 14:25) “then shall his yoke (עֻלּוֹ, from עֹל) depart from him”; — כֹּל and כֻּלּוֹ, as in (Exodus 14:7) “and captains over each of them (כֻּלּוֹ) — from כֹּל. But these three examples of עָזִּי וְזִּמְרָת, viz., that occuring here and that in Isaiah (12:2) and that in Psalms (118:14), are punctuated with short Kametz, whereas the translation of Onkelos would require עֻזִּי and not עָזִּי. Then further, in not one of them (these three passages) is it written וזמרתי, as Onkelos translates, but וזמרת and remarkably enough all of them are immediately followed by ויהי לי לישועה. — Therefore I say in explanation of the wording of the text that עָזִּי is not the same as עֻזִּי and וְזִמְרָת is not the same as וְזִמְרָתִי, but עָזִּי is a noun without a suffix of any kind, as we find in (Psalms 123:1) “The one who sits (הַיֹּשְׁבִי) in heaven”; (Obadiah 3:3) “The one who dwells (שֹׁכְנִי) in the cleft of the rock”; (Deuteronomy 33:16) “He that dwelleth (שֹׁכְנִי) in the bush” (where the syllable at the end of the word is part of the noun and is not the pronominal suffix denoting “my”). The praise, therefore, proclaimed in these words is this: The עז and the זִמְרָת of God, this was to me as a help. The word וזמרת is a noun in the construct state to the word which expressess the Divine Name (יָהּ), in the same sense as (Judges 5:23) “to the help of (לעזרַת — const.) the Lord”; (Isaiah 9:18) “through the wrath of (בעברת — constr.) the Lord”; (Ecc. 3:18) “because of (דברַת — const.) the sons of man”. The expression וזמרת has the meaning of the root which we find in (Leviticus 25:4) “thou shalt not prune (תזמר)” and in (Isaiah 25:5) “the cutting down (זמיר) of the terrible ones”, both of which have the meaning “lopping off” and “cutting down”. Thus the verse signifies: “The strength and vengeance of our God has become to us a help”. Do not be puzzled by the expression ויהי — that it does not state היה — for we have other verses also that use this idiom, and the following is an example of such a construction: (1 Kings 6:5) “round about the wall of the house, both of the temple and the most holy place, he made (ויעש) a side structure”, and it should have said (instead of ויעש etc.) עשה לו צלעות סביב. Similarly in Chronicles, (2 10:17) “But as for the children of Israel who dwelt in the cities of Judah, Rehoboam reigned (וימלך) over them”, where it should have said מלך עליהם. Other examples are: (Numbers 14:16) “Because the Lord was unable etc…. He slaughtered them (וישחטם)”, where it should have said שחטם; (Numbers 14:36, 37) “And the men whom Moses sent … they died (וימתו)”, where it should have said מתו; (Exodus 9:21) “And he that regarded not the word of the Lord left (ויעזב) his cattle, etc.”, where it should have said עזב‎.<br><br>זה אלי THIS IS MY GOD — In His glory did He reveal Himself to them and they pointed to Him — as it were — with the finger exclaiming “This is my God!” (Shir HaShirim Rabbah 3:15) A maid servant beheld at the Red Sea what even the prophets never saw (Mekhilta).<br><br>ואנוהו Onkelos translates this in the sense of a dwelling (viz., I will build Him a temple) as in (Isaiah 33:20) “a peaceful habitation (נוה)” and in (Isaiah 65:10) “a dwelling (נוה) for flocks”. Another explanation of ואנוהו is that it has the sense of נוי, “beauty”, and the meaning is: I will relate His splendour and praiseworthiness to the inhabitants of the world as, for example, was actually done by Israel: (Song 5:9, 10) The nations of the world ask, “What is thy beloved more than another beloved?” … and Israel replies, “My beloved is white and ruddy”, and thus you will find it in that whole section (cf. Mekhilta).<br><br>אלהי אבי MY FATHER’S GOD is this וארממנהו AND I WILL EXALT HIM. אלהי אבי He is not merely my God but He was MY FATHER’S GOD also — I am not the beginning of the sanctity (i. e. I am not the first to hallow Him by proclaiming Him God), this hallowing of Him and the proclamation of His Godship over me is something that has been held by me and has remained mine since the days of my fathers."}, {"ch": 15, "v": 3, "aliyah": 4, "heb": "יְהֹוָ֖ה אִ֣ישׁ מִלְחָמָ֑ה יְהֹוָ֖ה שְׁמֽוֹ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יְיָ מָרֵי <b>נִצְחָן קְרָבַיָא<\/b> יְיָ שְׁמֵהּ:", "onk_en": "Adonoy is the master of [<b>victory of<\/b>] war[<b>s<\/b>], Adonoy is His Name.", "pj": "אָמְרִין בְּנֵי יִשְרָאֵל יְיָ גַבְרָא עָבֵיד קְרָבֵינָן בְּכָל דַּר וָדַר מִנְדַע גְּבוּרְתֵּיהּ לְעַמֵּיהּ בֵּית יִשְרָאֵל יְיָ שְׁמֵיהּ כִּשְׁמֵיהּ כֵּן גְּבוּרְתֵּיהּ יְהֵי שְׁמֵיהּ מְבָרַךְ לְעָלְמֵי עַלְמִין", "pj_en": "The sons of Israel said, The Lord is a man making war for us: from generation to generation He maketh known His power unto the people of the house of Israel. The Lord is His Name; according to His Name, so is His power; His Name shall be blessed for ever and ever.", "tj": "יְיָ בִּיקַר שְׁכִינְתֵּיהּ הוּא דַּעֲבֵיד לְכוֹן נִצְחָנֵי קְרָבֵיכוֹן בְּכָל דַּר וָדַר מוֹדַע גְּבוּרְתֵּיהּ לְעַמָא בֵּית יִשְרָאֵל יְיָ שְׁמוֹ כִּי כִשְׁמֵיהּ כֵּן גְּבוּרְתֵּיהּ יְהֵא שְׁמֵיהּ מְשַׁבַּח לְעַלְמֵי עַלְמִין:", "tj_en": "The Lord in the glory of His Shekinah is He who worketh victory for your arms. From one generation to another He maketh known His power to the people of the house of Israel. His Name is the Lord: as is His Name, so is His power; let His name be glorified for ever and ever.", "rashi": "<b>ה' איש מלחמה.<\/b> בַּעַל מִלְחָמוֹת, כְּמוֹ \"אִישׁ נָעֳמִי\" (רות א'), וְכָל אִישׁ וְאִישֵׁךְ מְתֻרְגָּמִין בַּעַל, וְכֵן \"וְחָזַקְתָּ וְהָיִיתָ לְאִישׁ\" (מלכים א ב') – לְגִבּוֹר:<br><br><b>ה' שמו.<\/b> מִלְחֲמוֹתָיו לֹא בִּכְלֵי זַיִן אֶלָּא בִּשְׁמוֹ הוּא נִלְחָם; כְּמוֹ שֶׁאָמַר דָּוִד \"וְאָנֹכִי בָא אֵלֶיךָ בְּשֵׁם ה' צְבָאוֹת\" (שמואל א י\"ז). דָּבָר אַחֵר, <b>ה' שמו<\/b> – אַף בְּשָׁעָה שֶׁהוּא נִלְחָם וְנוֹקֵם מֵאוֹיְבָיו, אוֹחֵז הוּא בְּמִדָּתוֹ לְרַחֵם עַל בְּרוּאָיו וְלָזוּן אֶת כָּל בָּאֵי עוֹלָם; וְלֹא כְמִדַּת מַלְכֵי אֲדָמָה כְּשֶׁהוּא עוֹסֵק בְּמִלְחָמָה פּוֹנֶה עַצְמוֹ מִכָּל עֲסָקִים וְאֵין בּוֹ כֹּחַ לַעֲשׂוֹת זוֹ וְזוֹ (מכילתא):", "rashi_en": "ה' איש מלחמה means The Lord is a Master of war; just as, (Ruth 1:3) “the איש (i. e. the master) of Naomi”. (Cf. Rashi on that verse). Wherever the words איש and אישך occur they must be translated by בעל; so, too, (1 Kings 2:2) “Be thou strong and show thyself an איש” — a mighty person.<br><br>ה' שמו THE LORD IS HIS NAME — His wars are not waged with martial weapons but He fights by means of His Name, just as David said, (I Samuel 17:45) “But I come against thee in the name of the Lord of Hosts”. Another explanation of ה׳ שמו — He is a man of war, but His Name is the Lord (the God of Mercy): even at the time when He battles against and avenges Himself upon His enemies He retains His attribute (that expressed by His name ה׳) showing pity to His creatures and feeding all the inhabitants of the world; not as is the nature of the kings of the world each one of whom when he is engaged in war turns aside from all other engagements, and has not the power to do both this and that (cf. Mekhilta)."}, {"ch": 15, "v": 4, "aliyah": 4, "heb": "מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְחֵיל֖וֹ יָרָ֣ה בַיָּ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;וּמִבְחַ֥ר שָֽׁלִשָׁ֖יו טֻבְּע֥וּ בְיַם־סֽוּף׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "רְתִכֵּי פַּרְעֹה וּמַשִׁרְיָתֵהּ שְׁדִי בְיַמָא וּשְׁפַר גִבָּרוֹהִי אִטְבָּעוּ בְּיַמָא דְסוּף:", "onk_en": "Pharaoh’s chariots and army He hurled into the sea; his elite officers were sunk in the Reed Sea.", "pj": "אַרְתּוֹכֵי דְפַרְעה וְחֵילְוָותֵיהּ שַׁדָּא בְּיַמָא שִׁיפַּר עוּלְמֵי גִבְרוֹי רְמָא וּטְמַע יַתְהוֹן בְּיַמָא דְסוּף", "pj_en": "The chariots of Pharoh and his hosts He hath cast into the sea; the goodliest of his young men hath He thrown and drowned in the sea of Suph.", "tj": "רְתִיכוֹי דְּפַרְעה וַחֲיָילוּתֵיהּ קָשַׁת עֲלֵיהוֹן גִּירִין בְּיַמָא שְׁפַר עוּלֵימוֹי וְגִיבָּרוֹי טְמַע בְּיַמָא דְסוּף:", "tj_en": "Upon the chariots of Pharaoh and his host He shot arrows in the sea; his goodly young men and his men of strength He hath drowned in the sea of Suph.", "rashi": "<b>ירה בים.<\/b> \"שְׁדִי בְיַמָּא\", שְׁדִי לְשׁוֹן יְרִיָּה, וְכֵן הוּא אוֹמֵר \"אוֹ יָרֹה יִיָּרֶה\" (שמות י\"ט) – אוֹ אִשְׁתְּדָאָה יִשְׁתְּדִי, וְהַתָּי\"ו מְשַׁמֵּשׁ בְּאֵלּוּ בִּמְקוֹם יִתְפַּעֵל:<br><br><b>ומבחר.<\/b> שֵׁם דָּבָר. כְּמוֹ מֶרְכָּב, מִשְׁכָּב, מִקְרָא קֹדֶשׁ:<br><br><b>טבעו.<\/b> אֵין טְבִיעָה אֶלָּא בִּמְקוֹם טִיט, כְּמוֹ \"טָבַעְתִּי בִּיוֵן מְצוּלָה\" (תהילים ס\"ט), \"וַיִּטְבַּע יִרְמְיָהוּ בַּטִּיט\" (ירמיהו ל\"ח), מְלַמֵּד, שֶׁנַּעֲשָׂה הַיָּם טִיט, לִגְמֹל לָהֶם כְּמִדָּתָם שֶׁשִׁעְבְּדוּ אֶת יִשְׂרָאֵל בְּחֹמֶר וּבִלְבֵנִים (מכילתא):", "rashi_en": "ירה בים Onkelos translates this by שדי בימא: HE HATH CAST IN THE SEA. The word שדי is an expression for “casting”. And thus, also, it says, (Exodus 19:13) או ירה יירה which Onkelos renders by או אשתדאה ישתדי “or he shall certainly be thrown down” where the ת is used in both these words in place of (as marking) the Ithpael form, so that in these Targum words the root is שדי‎.<br><br>ומבחר AND THE CHOICEST — This word is a noun of similar form to מֶרְכָּב and מִשְׁכָּב and מִקְרָא [קדש]‏.<br><br>‎טבעו ARE SUNK — The root טבע always denotes sinking in slimy matter, as may be seen from (Psalms 69:3) “I am sunk (טבעתי) in deep mire”, and from (Jeremiah 38:6) “And Jeremiah sank (ויטבע) in the mire”. The fact that this expression is used teaches, therefore, that the sea became slime (cf. Rashi on 14:24) to requite them according to their own measure — because that they had made the Israelites work as slaves with slime and with bricks (Mekhilta)."}, {"ch": 15, "v": 5, "aliyah": 4, "heb": "תְּהֹמֹ֖ת יְכַסְיֻ֑מוּ יָרְד֥וּ בִמְצוֹלֹ֖ת כְּמוֹ־אָֽבֶן׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "תְּהוֹמַיָא חֲפוֹ עֲלֵיהוֹן נְחָתוּ לְעוּמְקַיָא כְּאַבְנָא:", "onk_en": "The depths covered them, they sank into the shadowy depths like stone.", "pj": "תְּהוֹמַיָא כַּסּוּן עֲלֵיהוֹן נַחֲתוּ וְשַׁקָעוּ בִּמְצוּלְתֵיהּ דְּיַמָא אִידְמִין הֵי כְאַבְנָא", "pj_en": "The deep covered them over, they went down and are buried in the depths of the sea, and are as silent as a stone.", "tj": "", "tj_en": "", "rashi": "<b>יכסימו.<\/b> כְּמוֹ יְכַסּוּם, וְהַיּוֹ\"ד הָאֶמְצָעִית יְתֵרָה בוֹ; וְדֶרֶךְ מִקְרָאוֹת בְּכָךְ, כְּמוֹ \"וְצֹאנְךָ יִרְבְּיֻן\" (דברים ח'), \"יִרְוְיֻן מִדֶּשֶׁן בֵּיתֶךָ\" (תהלים ל\"ו), וְהַיּוֹ\"ד רִאשׁוֹנָה שֶׁמַּשְׁמָעָהּ לְשׁוֹן עָתִיד, כָּךְ פָּרְשֵׁהוּ: טֻבְּעוּ בְיַם סוּף כְּדֵי שֶׁיַּחְזְרוּ הַמַּיִם וִיכַסּוּ אוֹתָן. יְכַסְיֻמוּ אֵין דּוֹמֶה לוֹ בַמִּקְרָא בִּנְקֻדָּתוֹ, וְדַרְכּוֹ לִהְיוֹת נָקוּד יְכַסְיֻמוֹ מְלָאפוּם:<br><br><b>כמו אבן.<\/b> וּבְמָקוֹם אַחֵר \"צָלְלוּ כַּעוֹפֶרֶת\", וּבְמָקוֹם אַחֵר \"יֹאכְלֵמוֹ כַּקַּשׁ\", הָרְשָׁעִים כַּקַּשׁ, הוֹלְכִים וּמִטָּרְפִין עוֹלִין וְיוֹרְדִין, בֵּינוֹנִים כָּאֶבֶן, וְהַכְּשֵׁרִים כַּעוֹפֶרֶת שֶׁנָּחוּ מִיָּד (מכילתא):", "rashi_en": "יכסימו THEY COVER THEM — this is the same as יְכַסּוּם and the middle י is redundant. This is quite usual in Scripture–verses (in Biblical Hebrew), just as in (Deuteronomy 8:13) וצאנך ירביון, and (Psalms 36:9) ירויון מדשן ביתך, and the force of the first י which expresses the future tense you must explain as follows: they have been sunk in the Red Sea in order that the waters should return and should cover them. The word יכסימו has no similar example in Scripture so far as its punctuation is concerned; ordinarily it would be יְכַסְיֻמוּ with Melopum (חולם)‎.<br><br>כמו אבן AS A STONE — But in another passage (v. 10) it states, “they dropped like lead”, and in yet another passage (v. 7) “it consumes them as stubble”! The wicked amongst the Egyptians were as stubble, being continually dashed about, and tossed up and down; those of average worth sank as a stone, suffering less agony, whilst the best amongst them sank as lead so that they came to their rest at once (cf. Mekhilta)."}, {"ch": 15, "v": 6, "aliyah": 4, "heb": "יְמִֽינְךָ֣ יְהֹוָ֔ה נֶאְדָּרִ֖י בַּכֹּ֑חַ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;יְמִֽינְךָ֥ יְהֹוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "יַמִינָךְ יְיָ אַדִירָא בְּחֵילָא יַמִינָךְ יְיָ תְּבָרַת סָנְאָה:", "onk_en": "Your right hand Adonoy, is adorned with power, Your right hand Adonoy, crushes the enemy.", "pj": "יְמִינָךְ יְיָ מַה מְּשַׁבְּחָא הִיא בְּחֵילָא יְמִינָךְ יְיָ תַּבְרִית בַּעַל דְּבָבֵיהוֹן דְּעַמָּךְ דְּקַיְימִין לְקוּבְלֵיהוֹן מִן בִּגְלַל לְאַבְאָשָׁא לְהוֹן", "pj_en": "Thy right hand, O Lord, how glorious is it in power? Thy right hand, O Lord, hath cut off the adversaries of Thy people who rose against them to do them hurt.", "tj": "מַה מְּשַׁבְּחָא הִיא בְּחֵילָא יְמִינָךְ יְיָ דְרָעָא וּמְרַצְצָא שׁוּרֵי בַּעֲלֵי דְבָבֵיהוֹן דְּעַמָּךְ:", "tj_en": "How glorious is Thy right hand, O Lord, in power, which hath broken and shattered the walls of the enemies of Thy people!", "rashi": "<b>ימינך ימינך.<\/b> שְׁנֵי פְעָמִים, כְּשֶׁיִּשְׂרָאֵל עוֹשִׂין אֶת רְצוֹנוֹ שֶׁל מָקוֹם הַשְּׂמֹאל נַעֲשֵׂית יָמִין (שם):<br><br><b>ימינך ה' נאדרי בכח.<\/b> לְהַצִּיל אֶת יִשְׂרָאֵל וִימִינְךָ הַשֵּׁנִית תִּרְעַץ אוֹיֵב. וְלִי נִרְאֶה אוֹתָהּ יָמִין עַצְמָהּ תִּרְעַץ אוֹיֵב, מַה שֶּׁאִי אֶפְשָׁר לְאָדָם – לַעֲשׂוֹת שְׁתֵּי מְלָאכוֹת בְּיָד אַחַת; וּפְשׁוּטוֹ שֶׁל מִקְרָא יְמִינְךָ הַנֶּאֱדֶרֶת בַּכֹּחַ מַה מְּלַאכְתָּהּ? יְמִינְךָ ה' תִּרְעַץ אוֹיֵב; וְכַמָּה מִקְרָאוֹת דֻּגְמָתוֹ, \"כִּי הִנֵּה אוֹיְבֶיךָ ה' כִּי הִנֵּה אוֹיְבֶיךָ יֹאבֵדוּ\" (תהלים צ\"ב), וְדוֹמֵיהֶם:<br><br><b>נאדרי.<\/b> הַיּוֹ\"ד יְתֵרָה, כְּמוֹ \"רַבָּתִי עָם, שָׂרָתִי בַּמְּדִינוֹת\" (איכה א'), \"גְּנֻבְתִי יוֹם\" (בראשית ל\"א):<br><br><b>תרעץ אויב.<\/b> תָּמִיד הִיא רוֹעֶצֶת וּמְשַׁבֶּרֶת הָאוֹיֵב; וְדוֹמֶה לוֹ \"וַיִּרְעֲצוּ וַיְרוֹצְצוּ אֶת בְּנֵי יִשְׂרָאֵל\", בְּשׁוֹפְטִים (י, ח). (דָּ\"אַ – יְמִינְךָ הַנֶּאֱדֶרֶת בַּכֹּחַ הִיא מְשַׁבֶּרֶת וּמַלְקָה אוֹיֵב):", "rashi_en": "ימינך ... ימינך THY RIGHT HAND — twice! — When Israel performs the will of the Omnipresent the left hand (intended for punishment) becomes a right hand (bestowing reward, so that God has two right hands as it were) (Mekhilta).<br><br>ימינך ה' נאדרי בכח THY RIGHT HAND, O LORD, IS GLORIOUS IN POWER to deliver Israel, and thy second right hand dashes the enemy in pieces. But it seems to me that if we have to take it in the sense: Thy right hand is glorious to save, thy right hand dashes in pieces etc. the explanation is that the self-same right hand itself dashes the enemy in pieces, something which it is impossible for a human being — to do two actions with one hand. But the literal sense of the text is: “Thy right hand, that is glorious in power — what does it do?” — “Thy right hand, O Lord, dashes the enemy in pieces”. There are many Scriptural verses exactly in this poetical form, e. g., (Psalms 92:10) “For, behold, thine enemies, O Lord, for behold, thine enemies shall perish” and others similar.<br><br>נאדרי The י is redundant as in (Lamentations 1:1) “full of (רבתי) people . . . princess (שרתי) amongst the provinces”; (Genesis 31:39) “stolen (גנבתי) by day”.<br><br>תרעץ אויב means, it always crushes and shatters the enemy; similar in meaning to it is, “And they crushed (וירעצו) and broke the children of Israel”, in the Book of Judges (Judges 10:8). [Another explanation is: Thy right hand that is glorious in power shatters and punishes the enemy, and these words must be connected with the following:"}, {"ch": 15, "v": 7, "aliyah": 4, "heb": "וּבְרֹ֥ב גְּאוֹנְךָ֖ תַּהֲרֹ֣ס קָמֶ֑יךָ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;תְּשַׁלַּח֙ חֲרֹ֣נְךָ֔ יֹאכְלֵ֖מוֹ כַּקַּֽשׁ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּבִסְגֵי <b>תָקְפָּךְ תְּבַרְתָּנוּן לִדְקָמוּ עַל עַמָךְ<\/b> שַׁלַחְתָּ רוּגְזָךְ שֵׁיצִיתִינוּן <b>כְּנוּרָא לְ<\/b>קַשָׁא:", "onk_en": "In Your great majesty [<b>might<\/b>], You destroy [<b>crush<\/b>] Your opponents [<b>those who rise up against Your people<\/b>]; You send forth Your fury, it consumes them like [<b>fire consumes<\/b>] straw.", "pj": "וּבְסוּגֵי גֵּיפְתָנוּתָךְ תְּפַכֵר שׁוּרֵי בַּעֲלֵי דְבָבֵיהוֹן דְּעַמָּךְ תְּגָרֵי בְהוֹן תְּקוֹף רוּגְזָךְ תְּגַמֵּר יַתְהוֹן הֵי כְנוּרָא בָּעֲרָא שַׁלְטָא בְּקַשָׁא", "pj_en": "And in the plenitude and greatness of Thy majesty Thou hast destroyed the walls of the enemies of Thy people. Thou wilt pour upon them Thy fierce anger, Thou wilt consume them as the burning fire prevails over the stubble.", "tj": "", "tj_en": "", "rashi": "<b>וברב גאונך.<\/b> זֹאת הַיָּד בִּלְבָד רוֹעֶצֶת הָאוֹיֵב – כְּשֶׁהוּא מְרִימָהּ בְּרֹב גְּאוֹנוֹ אָז יַהֲרֹס קָמָיו – וְאִם בְּרֹב גְּאוֹנוֹ לְבַד אוֹיְבָיו נֶהֱרָסִים קַל וָחֹמֶר כְּשֶׁשִּׁלַּח בָּם חֲרוֹן אַף יֹאכְלֵמוֹ):<br><br><b>תהרס.<\/b> תָּמִיד אַתָּה הוֹרֵס קָמֶיךָ הַקָּמִים נֶגְדְּךָ, וּמִי הֵם הַקָּמִים כְּנֶגְדּוֹ? אֵלּוּ הַקָּמִים עַל יִשְׂרָאֵל; וְכֵן הוּא אוֹמֵר \"כִּי הִנֵּה אוֹיְבֶיךָ יֶהֱמָיוּן\" (תהלים פ\"ג), וּמַה הִיא הַהֶמְיָה? \"עַל עַמְּךָ יַעֲרִימוּ סוֹד\" (שם), וְעַל זֶה קוֹרֵא אוֹתָם אוֹיְבָיו שֶׁל מָקוֹם:", "rashi_en": "וברב גאנך AND THROUGH THE GREATNESS OF THINE EXCELLENCY: if the hand alone crushes the spirit of the enemy, then when He raises it aloft IN THE GREATNESS OF HIS EXCELLENCY surely then HE WILL OVERTHROW THEM THAT RISE UP AGAINST HIM; and if through the greatness of His excellency alone His enemies are overthrown, how much more sure is it that when HE SENDETH FORTH THE FIERCENESS OF HIS WRATH against them IT WILL CONSUME THEM].<br><br>תהרס means, Thou always overthrowest קמיך i. e. those that rise up against thee. And who are those who rise up against Him? They are those who rise up against Israel; and similarly it says, (Psalms 83:3, 4) “For, lo, thine enemies are in an uproar!” And what is this uproar? “against thy people they take crafty counsel”, and on this account — because they are Israel's enemies — it calls them the enemies of the Omnipresent (Mekhilta)."}, {"ch": 15, "v": 8, "aliyah": 4, "heb": "וּבְר֤וּחַ אַפֶּ֙יךָ֙ נֶ֣עֶרְמוּ מַ֔יִם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;נִצְּב֥וּ כְמוֹ־נֵ֖ד נֹזְלִ֑ים&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;קָֽפְא֥וּ תְהֹמֹ֖ת בְּלֶב־יָֽם׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וּבְמֵימַר פּוּמָךְ חַכִּימוּ<\/b> מַיָא קָמוּ כְשׁוּר אֲזָלַיָא קָפוּ תְהוֹמִין בְּלִבָּא דְיַמָא:", "onk_en": "Through the wind [breath] of Your nostrils [<b>Word of Your mouth<\/b>], the waters were heaped up [<b>became wise<\/b>], flowing water stood like a wall; the deep waters congealed in the heart of the sea.", "pj": "וּבְמֵימַר מִן קֳדָמָךְ אִתְעֲבִידוּ מַיָא עוּרְמַן עוּרְמַן קָמוּ לְהֵין צְרִירִין הֵי כְזִיקִין מַיָא נָזְלַיָא קָפוּ עֲלֵיהוֹן תְּהוֹמַיָא בְּגוֹ פִילְגוּס דְּיַמָא רַבָּא", "pj_en": "For by the Word from before Thee the waters became heaps; they stood, as if bound like skins that confine flowing water, and the depths were congealed in the flood of the great sea.", "tj": "", "tj_en": "", "rashi": "<b>וברוח אפיך.<\/b> הַיּוֹצֵא מִשְּׁנֵי נְחִירַיִם שֶׁל אַף. דִּבֵּר הַכָּתוּב כִּבְיָכוֹל בַּשְּׁכִינָה דֻּגְמַת מֶלֶךְ בָּשָׂר וָדָם, כְּדֵי לְהַשְׁמִיעַ אֹזֶן הַבְּרִיּוֹת כְּפִי הַהֹוֶה, שֶׁיּוּכְלוּ לְהָבִין דָּבָר; כְּשֶׁאָדָם כּוֹעֵס יוֹצֵא רוּחַ מִנְּחִירָיו; וְכֵן \"עָלָה עָשָׁן בְּאַפּוֹ\" (תהלים י\"ח), וְכֵן \"וּמֵרוּחַ אַפּוֹ יִכְלוּ\" (איוב ד'), וְזֶהוּ שֶׁאָמַר \"לְמַעַן שְׁמִי אַאֲרִיךְ אַפִּי\", (ישעיהו מ\"ח) – כְּשֶׁזַּעְפּוֹ נָח, נְשִׁימָתוֹ אֲרֻכָּה, וּכְשֶׁהוּא כּוֹעֵס נְשִׁימָתוֹ קְצָרָה, \"וּתְהִלָּתִי אֶחֱטָם לָךְ\" (שם) – וּלְמַעַן תְּהִלָּתִי אָשִׂים חֹטֶם בְּאַפִּי לִסְתֹּם נְחִירַי בִּפְנֵי הָאַף וְהָרוּחַ שֶׁלֹּא יֵצְאוּ, לָךְ – בִּשְׁבִילְךָ, אֶחֱטָם, כְּמוֹ \"נְאָקָה בְּחֹטֶם\" בְּמַסֶּכֶת שַׁבָּת, כָּךְ נִרְאֶה בְּעֵינַי. וְכָל חֲרוֹן אַף שֶׁבַּמִּקְרָא אֲנִי אוֹמֵר כֵּן; חָרָה אַף כְּמוֹ \"וְעַצְמִי חָרָה מִנִּי חֹרֶב\" (איוב ל'), לְשׁוֹן שְׂרֵפָה וּמוֹקֵד, שֶׁהַנְּחִירַיִם מִתְחַמְּמִים וְנֶחֱרִים בְּעֵת הַקֶּצֶף, וְחָרוֹן מִגִּזְרַת חרה כְּמוֹ רָצוֹן מִגִּזְרַת רצה, וְכֵן חֵמָה לְשׁוֹן חֲמִימוּת, עַל כֵּן הוּא אוֹמֵר \"וַחֲמָתוֹ בָּעֲרָה בוֹ\" (אסתר א'), וּבְנוֹחַ הַחֵמָה אוֹמֵר \"נִתְקָרְרָה\" דַּעְתּוֹ:<br><br><b>נערמו מים.<\/b> אֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן עַרְמִימוּת, וּלְשׁוֹן צַחוּת הַמִּקְרָא כְּמוֹ \"עֲרֵמַת חִטִּים\" (שיר השירים ז'), וְנִצְּבוּ כְמוֹ נֵד יוֹכִיחַ: <b>נערמו.<\/b> מִמּוֹקֵד רוּחַ שֶׁיָּצָא מֵאַפְּךָ יָבְשׁוּ הַמַּיִם, וְהֵם נַעֲשׂוּ כְּמִין גַּלִּים וּכְרִיּוֹת שֶׁל עֲרֵמָה, שֶׁהֵם גְּבוֹהִים:<br><br><b>כמו נד.<\/b> כְּתַרְגּוּמוֹ \"כְּשׁוּר\" – כְּחוֹמָה:<br><br><b>נד.<\/b> לְשׁוֹן צִבּוּר וְכִנּוּס, כְּמוֹ \"נֵד קָצִיר בְּיוֹם נַחֲלָה\" (ישעיהו י״ז:י״א), \"כּוֹנֵס כַּנֵּד\" (תהילים ל״ג:ז׳), לֹא כָתוּב כּוֹנֵס כַּנֹּאד אֶלָּא כַּנֵּד, וְאִלּוּ הָיָה כנד כְּמוֹ כנאד וְכוֹנֵס לְשׁוֹן הַכְנָסָה, הָיָה לוֹ לִכְתֹּב מַכְנִיס כִּבְנֹאד מֵי הַיָּם, אֶלָּא כוֹנֵס לְשׁוֹן אוֹסֵף וְצוֹבֵר הוּא, וְכֵן \"קָמוּ נֵד אֶחָד\" (יהושע ג׳:י״ג), \"וַיַּעַמְדוּ נֵד אֶחָד\" (שם), וְאֵין לְשׁוֹן קִימָה וַעֲמִידָה בְּנֹאדוֹת אֶלָּא בְּחוֹמוֹת וְצִבּוּרִים, וְלֹא מָצִינוּ נֹאד נָקוּד אֶלָּא בִּמְלָאפוּם כְּמוֹ \"שִׂימָה דִמְעָתִי בְנֹאדֶךָ\" (תהילים נ״ו:ט׳), \"אֶת נֹאד הֶחָלָב\" (שופטים ד׳:י״ט):<br><br><b>קפאו.<\/b> כְּמוֹ \"וְכַגְּבִנָּה תַּקְפִּיאֵנִי\" (איוב י׳:י׳), שֶׁהֻקְשׁוּ וְנַעֲשׂוּ כַּאֲבָנִים וְהַמַּיִם זוֹרְקִים אֶת הַמִּצְרִיִּים עַל הָאֶבֶן בְּכֹחַ וְנִלְחָמִים בָּם בְּכָל מִינֵי קֹשִׁי:<br><br><b>בלב ים.<\/b> בְּחֹזֶק הַיָּם; וְדֶרֶךְ הַמִּקְרָאוֹת לְדַבֵּר כֵּן, \"עַד לֵב הַשָּׁמַיִם\" (דברים ד'), \"בְּלֵב הָאֵלָה\" (שמואל ב י\"ח), לְשׁוֹן עִקָּרוֹ וְתָקְפּוֹ שֶׁל דָּבָר:\n", "rashi_en": "וברוח אפיך AND WITH THE BREATH OF THY NOSTRILS — the breath that issues from both nostrils. Scripture speaks — if this were at all possible (i. e. if one may be permitted to speak so of God) of the Shechina (God) in the same manner as it does of a human monarch, in order to make peoples’ ears hear the facts in accordance with what usually happens to that they may understand the matter: when a man is angry the breath issues from his nostrils (and Scripture attributes this to God, also, when He is in anger). A similar idea is: (Psalms 18:9) “Smoke rose up in His nostril”, and also, (Job. 4:9) “By the breath of his nostril they are consumed”. And this is the meaning of what He said, (Isaiah 48:9) “For My name’s sake אאריך I will make long My אף”: when one’s anger subsides his breathing becomes long, whilst when one is in anger his breathing is short (consequently אאריך אפי signifies “I will not be angry”). The text continues ותהלתי אחטם לך which means “for the sake of My praise I will place a nose-ring in My nose to close up the nostrils against the anger and the breath so that they should not issue forth”. The word לך, for thee, in this text, means “for thy sake”, אחטם has the same meaning and root as in “a wild camel with a nose-ring (חֹטֶם)” which occurs in Mishna Treatise Sabbath (Mishnah Shabbat 5:1). Thus does the explanation appear to me. And wherever אף and חרון (i. e. where אף and words formed from the same root as חרון) occur in the Scriptures I say that it has the following sense: In the phrase חרה אף the first word is the same as (Job 30:30) “My bone is חרה with heat”, where חרה denotes burning and glowing, and this metaphor is used because the nostrils become hot and burning in a time of anger. The noun חרון is a derivation of חרה, just as רצון is a derivation of רצה, and therefore signifies “burning”. In the same way, חַמה which also signifies wrath really denotes heat (from a root יחם, not חמם, since the מ of חַמָה has no Dagesh. חַמָה is formed from יחם as עֵדָה, congregation, from יעד). That is why Scripture says, (Esther 1:12) וחמתו בערה בו “his wrath burned in him”, and when one’s wrath subsides one says, “his mind has become cooled” (נתקררה from קר cold).<br><br>נערמו מים THE WATERS WERE HEAPED UP — Onkelos translated this in the sense of ערמימות, subtlety (the waters showed themselves clever); (cf. ערום Genesis 3:1); but it is more in accordance with the elegance of Biblical style to take it as the noun of the same root as in (Song 7:3) “a stack of (ערמת) wheat”, and the following words, “the floods placed themselves like a mound”, prove that this is so (cf. Mekhilta). נערמו — Through the burning heat of the breath that issued from thy nostrils (וברוח אפיך) the waters were dried up and they became like heaps and piles of gain-stacks (ערמה) which are high.<br><br>כמו נד — Render this as the Targum does: like a שור, i. e. a wall.<br><br>נד is an expression for anything heaped up and gathered together, as, (Isaiah 17:11) “a heap (נד) of boughs in the day of grief”; (Psalms 33:7) “He gathereth as a heap (כַּנֵד) [the waters of the sea]”. It is not written “He gathereth כנאד”, but כנאד”, and if כנד, were the same as כנאד “like a water-skin”, and כונס were an expression for “bringing a thing in”, it should have written: “He gathered in (מכניס and not כונס) the waters of the sea as in a water-skin”, (כבנאד and not כנד), but כונס denotes gathering together and heaping up. And this must also be the meaning of נד in (Joshua 3:16) “[the waters] rose up as one נד”, and (Joshua v. 13) “and they shall stand in one נד”; for the expressions “rising up” and “standing up” cannot be used in reference to water in water-skins but only to water that stands up as walls and heaps (and this must therefore be the meaning of כמו נד in our text also). And, then again, we find the word נֹאד punctuated only with a Melopum (חולם), as, (Psalms 56:9) “Put thou my tears into thy bottle (נֹאדֶךָ)” and (Judges 4:19) “the bottle of (נֹאד) milk”.<br><br>קפאו WERE CONGEALED, like (Job 10:10) “thou hast curdled me (תקפיאני) like cheese”; the meaning is that the depths were hardened and became like stones, and the waters cast the Egyptians against the stony wall with force and battled against them with every harsh means (cf. Mekhilta).<br><br>בלב ים means IN THE VERY STRENGTH OF THE SEA. It is the way of Scripture-verses to speak thus (to use לב in a metaphorical sense); e. g., (Deuteronomy 4:11) “unto the very midst of (לב) heaven”; (II Samuel 18:14) “in the midst of (בלב) the terebinth”. It is an expression denoting the essence and strength of a thing."}, {"ch": 15, "v": 9, "aliyah": 4, "heb": "אָמַ֥ר אוֹיֵ֛ב אֶרְדֹּ֥ף אַשִּׂ֖יג&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;אֲחַלֵּ֣ק שָׁלָ֑ל תִּמְלָאֵ֣מוֹ נַפְשִׁ֔י&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;אָרִ֣יק חַרְבִּ֔י תּוֹרִישֵׁ֖מוֹ יָדִֽי׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דַהֲוָה אֲמַר סָנְאָה אֶרְדוֹף אַדְבֵּק אֲפַלֵג בִּזְתָא <b>תִּשְׂבַּע מִנְהוֹן נַפְשִׁי<\/b> אֶשְׁלוֹף חַרְבִּי תְּשֵׁיצִינוּן יְדִי:", "onk_en": "The enemy [<b>had<\/b>] said, “I will pursue [them], I will overtake [them], I will divide the spoils, I will satisfy myself [<b>My soul will be satisfied from them<\/b>]; I will draw my sword, my hand will destroy them.”", "pj": "דַּהֲוָה אָמַר פַּרְעה רַשִׁיעָא סַנְאָה וּבַעַל דְּבָבָא אֶרְדוֹף בָּתַר עַמָא בְּנֵי יִשְרָאֵל וְנָרַע יַתְהוֹן שַׁרְיָין עַל גֵּיף יַמָא וּמְסַדְרָא לְקוּבְלֵיהוֹן סִדְרָא קְרָבָא וְנִקְטוֹל בְּהוֹן קְטוֹל רַב וְסַגִי וְנָבִיז מִנְהוֹן בִּיזָא רַבָּא וְנַשְׁבֵּי מִנְהוֹן שִׁבְיָא רַבָּא וְאַפְלוּג בִּיזֵיהוֹן לְעַמִּי עַבְדֵּי קְרָבָא וְכַד תִּתְמְלֵי נַפְשִׁי מִן דָּם קְטוֹלֵיהוֹן מִן בָּתַר כְּדֵין אֶשְׁלוֹף חַרְבִּי וְאֵישֵׁיצֵי יַתְהוֹן בְּיַד יְמִינִי", "pj_en": "Pharoh the wicked, the hater and adversary, did say, I will follow after the people of the sons of Israel, and will lay waste their camp on the bank of the sea: I will set war in array against them, and kill them, small and great, despoil them of much spoil, bring them back into great captivity, and divide their substance among my people who make war: and when my soul is satisfied with the blood of their slain, I will sheathe my sword, having, destroyed them with my right hand.", "tj": "אָמַר פַּרְעה רַשִׁיעָא סָנְאָה וּבְעֵיל דְּבָבָא אֶרְדוֹף בָּתַר עַמָא בְּנֵי יִשְרָאֵל וְאַרְעֵי יַתְהוֹן שַׁרְיָן עַל גֵּיף יַמָא אַשְׁבִּי מִנְהוֹן שִׁבְיָא רַבָּא וְאַבְזֵי מִנְהוֹן בִּיזָא רַבָּא אַפְלִיג מִן נִכְסַיָא לְעַמִּי עָבְדֵי קְרָבָא וְכַד תִּתְמְלֵי נַפְשִׁי מִנְהוֹן מִן בָּתַר כֵּן אֶשְׁלוֹף חַרְבִּי וְאֶשֵׁיצֵי יַתְהוֹן בְּיַד יְמִינִי:", "tj_en": "Pharoh the wicked, the hater and adversary, did say, I will follow after the people of the sons of Israel and will overtake them encamped at the side of the sea. I will lead them captive into great captivity, and despoil, them of great spoil; I will divide their substance among my men of war; and when my soul shall be satisfied with them, I will sheathe my sword, when I shall have destroyed them with my right hand.", "rashi": "<b>אמר אויב.<\/b> לְעַמּוֹ, כְּשֶׁפִּתָּם בִּדְבָרִים, אֶרְדֹּף וְאַשִּׂיגֵם וַאֲחַלֵּק שָׁלָל עִם שָׂרַי וַעֲבָדַי:<br><br><b>תמלאמו.<\/b> תִּתְמַּלֵא מֵהֶם, נַפְשִׁי רוּחִי וּרְצוֹנִי. וְאַל תִּתְמַהּ עַל תֵּבָה הַמְדַבֶּרֶת בִּשְׁתַּיִם, תִּמְלָאֵמוֹ – תִּמָּלֵא מֵהֶם, יֵשׁ הַרְבֵּה בַּלָּשׁוֹן הַזֶּה \"כִּי אֶרֶץ הַנֶּגֶב נְתַתָּנִי\" (שופטים א׳:ט״ו), כְּמוֹ נָתַתָּ לִי, \"וְלֹא יָכְלוּ דַּבְּרוֹ לְשָׁלוֹם\" (בראשית ל״ז:ד׳), כְּמוֹ דַּבֵּר עִמּוֹ, \"בָּנַי יְצָאוּנִי\" (ירמיהו י׳:כ׳), כְּמוֹ יָצְאוּ מִמֶּנִּי, \"מִסְפַּר צְעָדַי אֲגִידֶנּוּ\" (איוב ל״א:ל״ז), כְּמוֹ אַגִּיד לוֹ, אַף כָּאן \"תִּמְלָאֵמוֹ\" – תִּמָּלֵא נַפְשִׁי מֵהֶם:<br><br><b>אריק חרבי.<\/b> אֶשְׁלֹף, וְעַל שֵׁם שֶׁהוּא מֵרִיק אֶת הַתַּעַר בִּשְׁלִיפָתוֹ וְנִשְׁאָר רֵיק, נוֹפֵל בּוֹ לְשׁוֹן הֲרָקָה, כְּמוֹ \"מְרִיקִים שַׂקֵּיהֶם\" (בראשית מ״ב:ל״ה), \"וְכֵלָיו יָרִיקוּ\" (ירמיהו מ״ח:י״ב). וְאַל תֹּאמַר אֵין לְשׁוֹן רֵיקוּת נוֹפֵל עַל הַיּוֹצֵא, אֶלָּא עַל הַתִּיק וְעַל הַשַּׂק וְעַל הַכְּלִי שֶׁיָּצָא מִמֶּנָּה, אֲבָל לֹא עַל הַחֶרֶב וְעַל הַיַּיִן, וְלִדְחֹק וּלְפָרֵשׁ \"אָרִיק חַרְבִּי\" כִּלְשׁוֹן \"וַיָּרֶק אֶת חֲנִיכָיו\" (בראשית י״ד:י״ד), אֶזְדַּיֵּן בְּחַרְבִּי, מָצִינוּ הַלָּשׁוֹן מוּסָב אַף עַל הַיּוֹצֵא, \"שֶׁמֶן תּוּרַק\" (שיר השירים א׳:ג׳), \"וְלֹא הוּרַק מִכְּלִי אֶל כֶּלִי\" (ירמיהו מ״ח:י״א), לֹא הוּרַק הַכְּלִי אֵין כְּתִיב כָּאן אֶלָּא לֹא הוּרַק הַיַּיִן מִכְּלִי אֶל כְּלִי, מָצִינוּ הַלָּשׁוֹן מוּסָב עַל הַיַּיִן, וְכֵן \"וְהֵרִיקוּ חַרְבוֹתָם עַל יְפִי חָכְמָתֶךָ\", דְּחִירָם (יחזקאל כ״ח:ז׳):<br><br><b>תורישמו.<\/b> לְשׁוֹן רֵישׁוּת וְדַלּוּת, כְּמוֹ \"מוֹרִישׁ וּמַעֲשִׁיר\" (שמואל א' ב'):", "rashi_en": "אמר אויב THE ENEMY SAID to his people, when he was persuading them with words (cf. Rashi on 14:6), I WILL PURSUE and I WILL OVERTAKE them and I WILL DIVIDE THE SPOIL with my captains and my subjects.<br><br>תמלאמו means SHALL BE FILLED WITH THEM (not it shall fill them). נפשי MY SOUL — my spirit, my desire. Do not be puzzled at a word, that expresses an idea usually expressed by two, viz., תמלאמו for תִּמָּלֵא מֵהֶם, for there are many examples of this way of speaking; e. g., (Judges 1:15) “the south country נְתַתָּנִי”, which is the same as נָתַתָּ לִי, “thou hast given to me”; (Genesis 37:4) “And they were not able דַּבְּרוֹ peaceably”, which is the same as דַּבֵּר עִמּוֹ “to speak with him”; (Jeremiah 10:20) “My children יְצָאוּנִי which is the same as יָצְאוּ מִמֶּנִי “have gone away from me”; (Job. 31:37) “the number of my steps אַגִידֶנּוּ which is the same as אַגִּיד לוֹ “I would declare unto him”. Similarly here: תמלאמו means תִּמָּלֵא נַפְשִׁי מֵהֶם “my soul shall be filled with them”.<br><br>אריק חרבי Translate this as the Targum: I WILL DRAW [MY SWORD]. Because one empties the scabbard when one draws out the sword and it (the scabbard) then remains empty (ריק), the, expression “emptying” is appropriate to it (to the act of drawing the sword), as in (Genesis 42:35) “emptying (מריקים) their sacks”; (Jeremiah 48:12) “And they shall empty (יריקו) his vessels (of wine)”. Now do not say that the expression “emptiness” in these examples does not apply to the thing which comes out, but that it applies to the scabbard and the sack and the vessels from which these things come out and not to the sword and to the wine (it is the scabbard, the sack and the vessels which are empty not the sword, the corn and the wine), — and consequently give a forced explanation of אריק חרבי in the sense of the verb in (Genesis 14:14) “He armed (וירק) his trained servants”, saying that it means, “I will arm myself with my sword”, for we do, indeed, find the expression “empty” applied also to the thing which, comes out of a receptacle; e. g., (Song 1:3) “oil which is emptied (תורק)”; (Jeremiah 48:11) “it (the wine) hath not been emptied (הורק) from vessel to vessel”. It does not say here “the vessel hath not been emptied”, but “the wine has not been emptied (הורק) from vessel to vessel”; consequently this expression is applied to the wine. Exactly like the phrase in this verse, is (Ezekiel 28:7) “And they shall draw their swords (והריקו חרבותם) against the beauty of thy wisdom”, in the chapter about Hiram.<br><br>תורישמו This is an expression for poverty and need, (meaning “my hand shall make them poor”), just as, (I Samuel 2:27) “He maketh poor (מוריש) and maketh rich.”"}, {"ch": 15, "v": 10, "aliyah": 4, "heb": "נָשַׁ֥פְתָּ בְרוּחֲךָ֖ כִּסָּ֣מוֹ יָ֑ם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;צָֽלְלוּ֙ כַּֽעוֹפֶ֔רֶת בְּמַ֖יִם אַדִּירִֽים׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>אֲמַרְתָּ בְּמֵימְרָךְ<\/b> חֲפָא עֲלֵיהוֹן יַמָא אִשְׁתְּקָעוּ כַּאֲבָרָא בְּמַיִן תַּקִיפִין:", "onk_en": "You made Your wind blow [<b>said with Your Word<\/b>], the sea covered them; they sank like lead in the mighty waters.", "pj": "אָשַׁבְתְּ בְּרוּחַ מִן קֳדָמָךְ יְיָ וְכָסִין עֲלֵיהוֹן גִּירִין דְּיַמָא נַחֲתוּ וְשָׁקְעוּ הֵי כְאַבְרָא מַיָא מַמְשַׁבְּחַיָא", "pj_en": "Thou didst blow with the wind from before Thee, O Lord, and the waves of the sea covered them; they went down, and sank as lead in the proud waters.", "tj": "", "tj_en": "", "rashi": "<b>נשפת.<\/b> לְשׁוֹן הֲפָחָה, וְכֵן \"וְגַם נָשַׁף בָּהֶם\" (ישעיה מ'):<br><br><b>צללו.<\/b> שָׁקְעוּ, עָמְקוּ, לְשׁוֹן מְצוּלָה:<br><br><b>כעופרת.<\/b> אֲבָר, פלו\"ם בְלַעַז:", "rashi_en": "נשפת — an expression for “blowing”. Similar is (Isaiah 40:24) “He bloweth (נשף) upon them”.<br><br>צללו means THEY SANK, they went deep, — an expression of the same root as (Psalms 69:3) מצולה “the depths”.<br><br>כעופרת LIKE LEAD: old French plomb."}, {"ch": 15, "v": 11, "aliyah": 4, "heb": "מִֽי־כָמֹ֤כָה בָּֽאֵלִם֙ יְהֹוָ֔ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;מִ֥י כָּמֹ֖כָה נֶאְדָּ֣ר בַּקֹּ֑דֶשׁ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>לֵית בַּר מִנָךְ דְאַתְּ הוּא אֱלָהָא יְיָ לֵית בַּר מִנָךְ אֱלָהָא אַתְּ אַדִיר בְּקוּדְשָׁא דְחֵל תֻּשְׁבְּחָן עָבֵד פָּרִישָׁן<\/b>:", "onk_en": "Who is like You among the mighty, Adonoy! Who is like You, adorned in holiness, Awesome in praise, doing wonders? [<b>There is none besides You, for You are God, Adonoy! There is none besides You, O God, You are adorned in holiness, Awesome in praise, doing wonders!<\/b>]", "pj": "מָן כְּוָותָךְ בְּאֵילֵי מְרוֹמָא יְיָ מָן כְּוָותָךְ הָדוּר בְּקוּדְשָׁא דָּחֵיל בְּתוּשְׁבְּחָן עֲבֵד נִסִין וּפְרִשַׁן לְעַמֵּיהּ בֵּית יִשְרָאֵל", "pj_en": "Who is like Thee among the exalted gods, O Lord, who is like Thee, glorious in holiness, fearful in praises, doing wonders and manifestations for Thy people, the house of Israel ?", "tj": "", "tj_en": "", "rashi": "<b>באלם.<\/b> בַּחֲזָקִים, כְּמוֹ \"וְאֶת אֵילֵי הָאָרֶץ לָקָח\" (יחזקאל י\"ז). \"אֱיָלוּתִי לְעֶזְרָתִי חוּשָׁה\" (תהלים כ\"ב):<br><br><b>נורא תהלת.<\/b> יָרְאוּי מִלְּהַגִּיד תְּהִלּוֹתֶיךָ פֶן יִמְעֲטוּ, כְּמוֹ שֶׁכָּתוּב \"לְךָ דוּמִיָּה תְהִלָּה\" (תהילים ס״ה:ב׳):", "rashi_en": "באלם means AMONGST THE MIGHTY, just as (Ezekiel 17:13) “and the mighty of (אילי) the land he took away”; (Psalms 22:20) “O, thou my strength (אילותי) hasten to my help”.<br><br>נורא תהלות means Thou art an object of dread so that people do not recount thy praises fearing lest these may be enumerated less then they really are, just as it is written (Psalms 65:2) “To Thee, silence is praise”."}, {"ch": 15, "v": 12, "aliyah": 4, "heb": "נָטִ֙יתָ֙ יְמִ֣ינְךָ֔ תִּבְלָעֵ֖מוֹ אָֽרֶץ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵמְתָּ יַמִינָךְ בְּלָעָתְנוּן אַרְעָא:", "onk_en": "You extended Your right hand, the earth swallowed them.", "pj": "יַמָא וְאַרְעָא הֲווֹן מְדַיְינִין דָּא עִם דָּא כַּחֲדָא יַמָא הֲוָה אָמַר לְאַרְעָא קַבִּילִי בְּנַיְיכִי וְאַרְעָא הֲוַת אָמְרָה לְיַמָא קַבֵּיל קְטִילָנַיִךְ לָא יַמָא הֲוָה בָּעֵי לְמִטְמַע יַתְהוֹן וְלָא אַרְעָא הֲוַת בַּעֲיָא לְמִבְלַע יַתְהוֹן דְּחִילָא הֲוַת אַרְעָא לְמִקְבְּלָא יַתְהוֹן מִן בִּגְלַל דְּלָא יִתְבְּעוּן גַּבָּהּ בְּיוֹם דִּינָא רַבָּא לְעַלְמָא דַּאֲתֵי הֵיכְמָא דְיִתְבַּע מִינָהּ דְּמֵי דְהֶבֶל מִן יַד אַרְכִינַת יַד יְמִינָךְ יְיָ בִּשְׁבוּעָה עַל אַרְעָא דְלָא יִתְבְּעוּן מִינָהּ לְעַלְמָא דְאָתֵי וּפְתָחַת אַרְעָא פּוּמָהּ וּבְלָעַת יַתְהוֹן", "pj_en": "The sea spake to the earth, Receive thy children: but the earth spake to the sea, Receive thy murderers. And the sea was not willing to overwhelm them, and the earth was not willing to swallow them up. The earth was afraid to receive them, lest they should be required from her in the day of the great judgment in the world to come, even as the blood of Habel will be required of her: whereupon Thou, O Lord, didst stretch forth Thy right hand in swearing to the earth that in the world to come they should not be required of her. And the earth opened her mouth and consumed them.", "tj": "יַמָא וְאַרְעָא הֲוָה מְדַיְינִין דֵּין לִקְבֵל דֵּין יַמָא הֲוָה אָמַר לְאַרְעָא קַבִּילִי בְּנַיְיכִי וְאַרְעָא הֲוָת אָמְרָה לְיַמָא קַבֵּיל קְטִילָךְ אַרְעָא לָא הֲוָת בַּעְיָא לְמִבְלוֹעַ יַתְהוֹן וְלָא יַמָא הֲוָה בָּעֵי לְמִטְמְעָא יַתְהוֹן וּבְמֵימַר מִן קֳדָמָךְ אַרְכִינַת יַת יְדָךְ יְמִינָךְ בִּשְׁבוּעָה וְאַשְׁבַּע לְאַרְעָא דְּלֵית אַתְּ תְּבַע יַתְהוֹן מִינָהּ לְעַלְמָא דְאָתֵי בְּכֵן פָּתְחַת אַרְעָא יַת פּוּמָא וּבְלָעַת יַתְהוֹן:", "tj_en": "The sea and the earth had controversy one with the other. The sea said to the earth, Receive thy children; and the earth said to the sea, Receive thy murderers. But the earth willed not to swallow them, and the sea willed not to overwhelm them. And by the Word from before Thee Thou. didst stretch forth Thy right hand in oath., and didst swear unto the earth that Thou wilt not require them of her in the world to come. Then did the earth open her mouth and swallow them up.", "rashi": "<b>נטית ימינך.<\/b> כְּשֶׁהַקָּבָּ\"ה נוֹטֶה יָדוֹ, הָרְשָׁעִים כָּלִים וְנוֹפְלִים, לְפִי שֶׁהַכֹּל נָתוּן בְּיָדוֹ וְנוֹפְלִים בְּהַטָּיָתָהּ; וְכֵן הוּא אוֹמֵר \"וַה' יַטֶּה יָדוֹ וְכָשַׁל עוֹזֵר וְנָפַל עָזֻר\" (ישעיהו ל\"א), מָשָׁל לִכְלֵי זְכוּכִית הַנְּתוּנִים בְּיַד אָדָם, מַטֶּה יָדוֹ מְעַט וְהֵן נוֹפְלִים וּמִשְׁתַּבְּרִין (מכילתא):<br><br><b>תבלעמו ארץ.<\/b> מִכָּאן שֶׁזָּכוּ לִקְבוּרָה בִּשְׂכַר שֶׁאָמְרוּ ה' הַצַּדִּיק (מכילתא):", "rashi_en": "נטית ימינך THOU INCLINEST THY RIGHT HAND — When the Holy One, blessed be He, inclines His hand the wicked cease to be and fall — because everything is held in His hand and consequently falls when He inclines it. Similarly it states, (Isaiah 31:3) “When the Lord inclineth His hand, he that helpeth shall stumble and he that is helped shall fall”. A parable: it may be compared to glass vessels held in a man’s hand: if he inclines his hand a little they fall and are shattered to pieces (cf. Mekhilta).<br><br>תבלעמו ארץ THE EARTH SWALLOWED THEM — From this it may be gathered that they received the privilege of burial as a reward for having said, (Exodus 9:27) “The Lord is righteous” (Mekhilta)."}, {"ch": 15, "v": 13, "aliyah": 4, "heb": "נָחִ֥יתָ בְחַסְדְּךָ֖ עַם־ז֣וּ גָּאָ֑לְתָּ&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;נֵהַ֥לְתָּ בְעׇזְּךָ֖ אֶל־נְוֵ֥ה קׇדְשֶֽׁךָ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דַבַּרְהִי <b>בְטַבְוָתָךְ<\/b> עַמָא דְנַן <b>דִ<\/b>פְרָקְתָּ <b>סוֹבַרְהִי<\/b> בְתָקְפָּךְ לְדִירָא דְקֻדְשָׁךְ:", "onk_en": "In Your kindliness [<b>goodness<\/b>] You led the people [<b>who<\/b>] You redeemed; with Your might You guided [<b>carried<\/b>] them to Your holy dwelling place.", "pj": "דַּבַּרְתְּ בְּחַסְדָּךְ עַמָךְ הָאִילֵין דִּי פָרַקְתְּ וְאַחֲסִינַת יַתְהוֹן טַוָור בֵּית מַקְדְּשָׁךְ מְדוֹר בֵּית שְׁכִינַת קוּדְשָׁךְ", "pj_en": "Thou hast led in Thy mercy the people whom Thou hast redeemed, and given them the heritage of the mountain of Thy sanctuary, the place of the dwelling of Thy holy Shekinah.", "tj": "", "tj_en": "", "rashi": "<b>נהלת.<\/b> לְשׁוֹן מְנַהֵל, וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן נוֹשֵׂא וְסוֹבֵל, וְלֹא דִקְדֵּק לְפָרֵשׁ אַחַר לְשׁוֹן הָעִבְרִית:", "rashi_en": "נהלת is of the same root, conjugation and meaning as מנהל a leader; Onkelos translated it in the sense of bearing and carrying, but he was not particular to translate according to the Hebrew expression (i. e., to translate literally)"}, {"ch": 15, "v": 14, "aliyah": 4, "heb": "שָֽׁמְע֥וּ עַמִּ֖ים יִרְגָּז֑וּן&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;חִ֣יל אָחַ֔ז יֹשְׁבֵ֖י פְּלָֽשֶׁת׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "שְׁמָעוּ עַמְמַיָא וְזָעוּ דַחֲלָא אַחֲדָתְנוּן <b>לְדַהַווֹ יָתְבִין<\/b> בִּפְלָשֶׁת:", "onk_en": "Peoples heard and they tremble, terror gripped the inhabitants of [<b>those who inhabited<\/b>] Philistia.", "pj": "שְׁמָעוּ אוּמַיָא יִתְרַגְזוּן דְּחִילָא אֲחָדַת יַת כָּל עַמּוּדֵי דַיְירֵי אַרְעֲהוֹן דִּפְּלִשְׁתָּאֵי", "pj_en": "The nations will hear and be afraid; terror will lay hold upon them, even upon all the pillars of the inhabitants of the Palestinian land.", "tj": "", "tj_en": "", "rashi": "<b>ירגזון.<\/b> מִתְרַגְּזִין:<br><br><b>ישבי פלשת.<\/b> מִפְּנֵי שֶׁהָרְגוּ אֶת בְּנֵי אֶפְרַיִם – שֶׁמִּהֲרוּ אֶת הַקֵּץ וְיָצְאוּ בְחָזְקָה כַּמְפֹרָשׁ בְּדִבְרֵי הַיָּמִים – וַהֲרָגוּם אַנְשֵׁי גַת (מכילתא):", "rashi_en": "ירגזון means THEY TREMBLE (not they will tremble).<br><br>ישבי פלשת [REIGS SEIZED] THE INHABITANTS OF PALESTINE, because they slew the children of Ephraim who anticipated the end fixed for the period of slavery and left Egypt forcibly, as is explained in Chronicles (1 7:21) “[The sons of Ephraim…] whom the men of Gath slew” (Mekhilta)."}, {"ch": 15, "v": 15, "aliyah": 4, "heb": "אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖מוֹ רָ֑עַד&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּכֵן אִתְבְּהִילוּ רַבְרְבֵי אֱדוֹם תַּקִיפֵי מוֹאָב אֲחַדָתְנוּן רְתֵיתָא <b>אִתְבָּרוּ<\/b> כֹּל <b>דַהֲווֹ יָתְבִין<\/b> בִּכְנָעַן:", "onk_en": "Then the chiefs of Edom panicked, the mighty men of Moav were seized with trembling; all the inhabitants of [<b>those who inhabited<\/b>] Canaan melted away [<b>were crushed<\/b>].", "pj": "הָא בְּכֵן אִתְבַּהֲלוּן רַבְרְבָנֵי אֱדוֹמָאֵי תַּקִּיפֵי מוֹאֲבָאָה אֲחָדַת יַתְהוֹן רְתִיתָא אִתְמְסֵי לִבְּהוֹן בְּגַוֵּיהוֹן כָּל עַמּוּדֵי דַּיְירֵי אַרְעֲהוֹן דִּכְנַעֲנָאֵי", "pj_en": "Behold, then will the princes of the Edomaee be confounded, the strong ones of Moaba will be seized with fear, their heart within them will melt away, even all the pillars of the inhabitants of the Kenaanian land.", "tj": "", "tj_en": "", "rashi": "<b>אלופי אדום אילי מואב.<\/b> וַהֲלֹא לֹא הָיָה לָהֶם לִירֹא כְלוּם, שֶׁהֲרֵי לֹא עֲלֵיהֶם הוֹלְכִים? אֶלָּא מִפְּנֵי אֲנִינוּת שֶׁהָיוּ מִתְאוֹנְנִים וּמִצְטַעֲרִים עַל כְּבוֹדָם שֶׁל יִשְׂרָאֵל (ילקוט שמעוני):<br><br><b>נמגו.<\/b> נָמַסּוּ, כְּמוֹ \"בִּרְבִיבִים תְּמוֹגְגֶנָּה\" (תהלים ס\"ה), אָמְרוּ, עָלֵינוּ הֵם בָּאִים, לְכַלּוֹתֵינוּ וְלִירַשׁ אֶת אַרְצֵנוּ (מכילתא):", "rashi_en": "אלופי אדום אילי מואב [THEN WERE PERTURBED] THE CHIEFTAINS OF EDOM, THE MIGHTY MEN OF MOAB — But surely they had no cause to fear anything because they (the Israelites) were not marching against them! But the explanation is, that they were perturbed by annoyance, because they were annoyed and distressed by the glory that Israel had achieved (cf. Yalkut Shimoni on Torah 251:11).<br><br>נמגו means THEY MELTED — just as, (Psalms 65:11) “Thou makest it soft (תמגגנה) with showers”. They said, “They are marching against us to destroy us and to take possession of our land” (therefore they melted away from fear, and were not merely perturbed in mind) (Mekhilta)."}, {"ch": 15, "v": 16, "aliyah": 4, "heb": "תִּפֹּ֨ל עֲלֵיהֶ֤ם אֵימָ֙תָה֙ וָפַ֔חַד&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;בִּגְדֹ֥ל זְרוֹעֲךָ֖ יִדְּמ֣וּ כָּאָ֑בֶן&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;עַד־יַעֲבֹ֤ר עַמְּךָ֙ יְהֹוָ֔ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;עַֽד־יַעֲבֹ֖ר עַם־ז֥וּ קָנִֽיתָ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>תַּפֵּיל<\/b> עֲלֵיהוֹן אֵימְתָא וְדַחַלְתָּא בִּסְגֵי <b>תָקְפָּךְ יִשְׁתְּקוּן<\/b> כְּאַבְנָא עַד דְיֵעִבַּר עַמָךְ יְיָ <b>יָת אַרְנוֹנָא<\/b> עַד דְיֵעִבַּר עַמָא <b>דְנַן דִי פְרַקְתָּא יָת יַרְדְנָא<\/b>:", "onk_en": "Horror and dread [<b>will<\/b>] fall upon them, at the greatness of Your arm [<b>power<\/b>], they [<b>will be<\/b>] are still [<b>silent<\/b>] as stone; until Your people [<b>will<\/b>] cross over [<b>the stream of Arnon<\/b>], Adonoy, until Your [<b>this<\/b>] people [<b>who<\/b>] You acquired [<b>redeemed will<\/b>] cross over [<b>the Jordan<\/b>].", "pj": "תַּפִּיל עֲלֵיהוֹן אֵימָתָא דְמוֹתָא וּדְחִילָתָא בִּתְקוֹף אֶדְרַע וּגְבוּרְתָּךְ יִשְׁתַּתְּקוּן הֵי כְאַבְנַיָא עַד זְמַן דִּי יַעֲבְרוּן עַמָּךְ יְיָ יַת נַחֲלֵי אַרְנוֹנָא עַד זְמַן דִּי יַעֲבְרוּן עַמָּךְ הָאִילֵין דְּקָנִיתָא יַת מְגוּזָתֵיהּ דְּיוּבְקָא", "pj_en": "Through the power of Thy mighty arm, let the terrors of death fall upon them, let them be silent as a stone, till the time when Thy people, O Lord, shall have passed the streams of Arnona, till the time when Thy people whom Thou didst ransom shall have crossed the dividing current of Jabeka.", "tj": "תַּפִּיל עֲלֵיהוֹן אֵימָתָא דְמוֹתָא וּתְבִירָא בִּתְקוֹף אֶדְרַע גְּבוּרְתָּךְ יְדַמְדְמוּן כְּאַבְנַיָא עַד דְּיַעַבְרוּן עַמָּא הָאִילֵין דִּפְרָקִית יַת מְגִיזָתֵיהּ דְּיוּבְקָא וְיַת מְגִיזָתֵיהּ דְּיוֹרְדְנָא עַד זְמַן דְּיַעַבְרוּן עַמָּא אִילֵין דִּי קָנִיתָ לִשְׁמָךְ:", "tj_en": "Thou wilt make the terror of death to fall upon them and undoing, by the power of Thy mighty arm, that they shall be as silent as a stone, until this people whom Thou hast redeemed shall have gone over the dividing stream of Jobeka and that of Jardena; till this people shall have passed over whom Thou hast ransomed for Thy Name.", "rashi": "<b>תפל עליהם אימתה.<\/b> עַל הָרְחוֹקִים:<br><br><b>ופחד.<\/b> עַל הַקְּרוֹבִים, כָּעִנְיָן שֶׁנֶּאֱמַר \"כִּי שָׁמַעְנוּ אֵת אֲשֶׁר הוֹבִישׁ וְגוֹ'\" (יהושע ב'):<br><br><b>עד יעבר, עד יעבר.<\/b> כְּתַרְגּוּמוֹ:<br><br><b>קנית.<\/b> חִבַּבְתָּ מִשְּׁאָר אֻמּוֹת, כְּחֵפֶץ הַקָּנוּי בְּדָמִים יְקָרִים שֶׁחָבִיב עַל הָאָדָם:", "rashi_en": "תפל עליהם אימתה THERE SHALL FALL UPON THEM DREAD — upon those of them who are far away (Mekhilta),<br><br>ופחד AND HORROR — shall fall upon those of them who are near by; and all this really happened just as the matter is stated, (Joshua 2:10) “For we have heard how the Lord dried up [the waters of the Red Sea]” (Mekhilta).<br><br>עד יעבר ... עד יעבר TILL THY PEOPLE PASS … TILL THE PEOPLE PASS — The repetition must be explained as the Targum takes it (until they pass over the Arnon, until they pass over the Jordan).<br><br>קנית denotes [THE PEOPLE] WHICH THOU HOLDEST DEAR above all peoples — like an article purchased (קנוי) at a high price and which is therefore held in affection by the man who bought it."}, {"ch": 15, "v": 17, "aliyah": 4, "heb": "תְּבִאֵ֗מוֹ וְתִטָּעֵ֙מוֹ֙ בְּהַ֣ר נַחֲלָֽתְךָ֔&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;מָכ֧וֹן לְשִׁבְתְּךָ֛ פָּעַ֖לְתָּ יְהֹוָ֑ה&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;מִקְּדָ֕שׁ אֲדֹנָ֖י כּוֹנְנ֥וּ יָדֶֽיךָ׃&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "תָּעֵלִנוּן <b>וְתַשְׁרִינוּן<\/b> בְּטוּרָא דְאַחְסַנְתָּךְ אֲתַר <b>מְתַקֵן לְבֵית שְׁכִנְתָּךְ אַתְקֵנְתָּא<\/b> יְיָ מַקְדְשָׁא יְיָ אַתְקְנוֹהִי יְדָיךְ:", "onk_en": "You will bring them and plant them [<b>cause them to dwell<\/b>] on the mountain of Your inheritance, the place [<b>prepared<\/b>] for [<b>the house of<\/b>] Your habitation [<b>Shechina<\/b>], which You, Adonoy have made [<b>established<\/b>]; the Sanctuary—my Master—[which] Your hands established.", "pj": "תָּעוּל יַתְהוֹן וְתִנְצוֹב יַתְהוֹן בְּטוּר בֵּית מַקְדְּשָׁךְ אָתַר דִּמְכֻוַּון קְבֵיל כּוּרְסֵי יְקָרָךְ מוּזְמַן קְבֵיל בֵּית שְׁכִינַת קָדְשָׁךְ אַתְקִינְתָּא יְיָ בֵּית מַקְדָּשָׁךְ יְיָ תַּרְתֵּין אִידְיָיךְ שַׁכְלִילוּ יָתֵיהּ", "pj_en": "Thou wilt bring them in, and plant them on the mountain of Thy sanctuary, the place which Thou hast provided before the throne of Thy glory, the house of Thy holy Shekinah, which Thou, O Lord, hast prepared, Thy sanctuary that with both hands Thou hast established.", "tj": "תָּעֵיל יַתְהוֹן וְתִנְצִיב יַתְהוֹן בְּטוּר בֵּית אַחְסַנְתָּךְ מְדוֹר בֵּית שְׁכִינַת קוּדְשָׁךְ דִּי זְמִינְתְּ לָךְ יְיָ בֵּית מַקְדְּשָׁא יְיָ תַּרְתֵּין יְדָךְ שִׁיכְלָלוּ יָתֵיהּ:", "tj_en": "Thou wilt bring them in, and wilt plant them in the mountain of Thy inheritance, the dwelling of the glory of Thy holiness, which Thou 0 Lord, hast prepared for Thyself, the sanctuary of the Lord that with both hands He hath established.}", "rashi": "<b>תבאמו.<\/b> נִתְנַבֵּא מֹשֶׁה שֶׁלֹּא יִכָּנֵס לָאָרֶץ לְכָךְ לֹא נֶאֱמַר \"תְּבִיאֵנוּ\" (בבא בתרא קי\"ט):<br><br><b>מכון לשבתך.<\/b> מִקְדָּשׁ שֶׁל מַטָּה מְכֻוָּן כְּנֶגֶד כִּסֵּא שֶׁל מַעְלָה אֲשֶׁר פָּעַלְתָּ (מכילתא):<br><br><b>מקדש ה'.<\/b> הַטַּעַם עָלָיו זָקֵף גָּדוֹל, לְהַפְרִידוֹ מִתֵּבַת הַשֵּׁם שֶׁלְּאַחֲרָיו, הַמִּקְדָּשׁ אֲשֶׁר כּוֹנְנוּ יָדֶיךָ ה'. חָבִיב בֵּית הַמִּקְדָּשׁ, שֶׁהָעוֹלָם נִבְרָא בְּיָד אַחַת, שֶׁנֶּאֱמַר \"אַף יָדִי יָסְדָה אֶרֶץ\" (ישעיהו מ\"ח), וּמִקְדָּשׁ בִּשְׁתֵּי יָדַיִם, וְאֵימָתַי יִבָּנֶה בִּשְׁתֵּי יָדַיִם? בִּזְמַן שֶׁ\"ה' יִמְלֹךְ לְעֹלָם וָעֶד\" – לֶעָתִיד לָבֹא שֶׁכָּל הַמְּלוּכָה שֶׁלּוֹ:", "rashi_en": "תבאמו THOU WILL BRING THEM IN — Moses foresaw by prophetic inspiration that he would not enter the Holy Land: on this account it is not stated here, “Thou wilt bring us in” (Mekhilta).<br><br>מכון לשבתך THE PLACE FOR THY RESIDENCE — the Sanctuary here below will be exactly opposite the Divine Throne above which פעלת THOU HAST MADE (Mekhilta).<br><br>מקדש ה׳ The accent on it (the word מקדש) is a Zakef Gadol (a disjunctive accent) which serves to separate it from the word expressing the Divine Name (ה׳) which follows it, so that the translation is: “The sanctuary which Thy hands have established, O Lord”. The Temple is an object of affection to God because the Universe was created by one hand — as it is stated, (Isaiah 48:13) “Yea, My hand hath laid the foundation of the earth” — whilst the Temple by two hands, as stated here. And when will it be rebuilt by God, with the two hands? At the time when “t
