@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }

.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }

.bm-btn {

main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }

.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }

.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>

const DATA = [{"ch": 37, "v": 1, "aliyah": 1, "heb": "וַיֵּ֣שֶׁב יַעֲקֹ֔ב בְּאֶ֖רֶץ מְגוּרֵ֣י אָבִ֑יו בְּאֶ֖רֶץ כְּנָֽעַן׃", "onk": "וִיתֵיב יַעֲקֹב בְּאַרְעָא תּוֹתָבוּת אֲבוּהִי בְּאַרְעָא דִּכְנָעַן:", "onk_en": "Yaakov settled in the land of his father’s residence, in the land of Canaan.", "pj": "וישׁב וִיתֵיב יַעֲקב בְּשַׁלְוִיתָא בְּאַרְעָא תּוֹתָבוּת אָבוּי בְּאַרְעָא דִכְנָעַן", "pj_en": "And Jakob dwelt in peace in the land of the sojourning of his fathers, in the land of Kenaan.", "tj": "", "tj_en": "", "rashi": "<b>וישב יעקב וגו'.<\/b> אַחַר שֶׁכָּתַב לְךָ יִשּׁוּבֵי עֵשָׂו וְתוֹלְדוֹתָיו בְּדֶרֶךְ קְצָרָה, שֶׁלֹּא הָיוּ סְפוּנִים וַחֲשׁוּבִים לְפָרֵשׁ הֵיאַךְ נִתְיַשְּׁבוּ וְסֵדֶר מִלְחֲמוֹתֵיהֶם אֵיךְ הוֹרִישׁוּ אֶת הַחֹרִי, פֵּרֵשׁ לָךְ יִשּׁוּבֵי יַעֲקֹב וְתוֹלְדוֹתָיו בְּדֶרֶךְ אֲרֻכָּה כָּל גִּלְגּוּלֵי סִבָּתָם, לְפִי שֶׁהֵם חֲשׁוּבִים לִפְנֵי הַמָּקוֹם לְהַאֲרִיךְ בָּהֶם, וְכֵן אַתָּה מוֹצֵא בְּי' דוֹרוֹת שֶׁמֵּאָדָם וְעַד נֹחַ פְּלוֹנִי הוֹלִיד פְּלוֹנִי, וּכְשֶׁבָּא לְנֹחַ הֶאֱרִיךְ בּוֹ, וְכֵן בְּי' דוֹרוֹת שֶׁמִּנֹּחַ וְעַד אַבְרָהָם קִצֵּר בָּהֶם, וּמִשֶּׁהִגִּיעַ אֵצֶל אַבְרָהָם הֶאֱרִיךְ בּוֹ. מָשָׁל לְמַרְגָּלִית שֶׁנָּפְלָה בֵּין הַחוֹל, אָדָם מְמַשְׁמֵּשׁ בַּחוֹל וְכוֹבְרוֹ בִּכְבָרָה עַד שֶׁמּוֹצֵא אֶת הַמַּרְגָּלִית, וּמִשֶּׁמְּצָאָהּ הוּא מַשְׁלִיךְ אֶת הַצְּרוֹרוֹת מִיָּדוֹ וְנוֹטֵל הַמַּרְגָּלִית. דָּ\"אַ <b>וישב יעקב<\/b>, הַפִּשְׁתָּנִי הַזֶּה נִכְנְסוּ גְמַלָּיו טְעוּנִים פִּשְׁתָּן, הַפֶּחָמִי תָמַהּ אָנָה יִכָּנֵס כָּל הַפִּשְׁתָּן הַזֶּה? הָיָה פִּקֵּחַ אֶחָד מֵשִׁיב לוֹ נִצּוֹץ אֶחָד יוֹצֵא מִמַּפּוּחַ שֶׁלְּךָ שֶׁשּׂוֹרֵף אֶת כֻּלּוֹ, כָּךְ יַעֲקֹב רָאָה אֶת כָּל הָאַלּוּפִים הַכְּתוּבִים לְמַעְלָה, תָּמַהּ וְאָמַר מִי יָכוֹל לִכְבֹּשׁ אֶת כֻּלָּן? מַה כְּתִיב לְמַטָּה, אֵלֶּה תּוֹלְדוֹת יַעֲקֹב יוֹסֵף, דִּכְתִיב וְהָיָה בֵית יַעֲקֹב אֵשׁ וּבֵית יוֹסֵף לֶהָבָה וּבֵית עֵשָׂו לְקַשׁ (עובדיה א') – נִצּוֹץ יוֹצֵא מִיּוֹסֵף שֶׁמְּכַלֶּה וְשׂוֹרֵף אֶת כֻּלָּם:", "rashi_en": "וישב יעקב AND JACOB ABODE — After it (Scripture) has described to you the settlements of Esau and his descendants in a brief manner — since they were not distinguished and important enough that it should be related in detail how they settled down and that there should be given an account of their wars and how they drove out the Horites (see Deuteronomy 2:12) — it explains clearly and at length the settlements made by Jacob and his descendants and all the events which brought these about,  because these are regarded by the Omnipresent as of sufficient importance to speak of them at length. Thus, too, you will find that in the case of the ten generations from Adam to Noah it states “So-and-so begat so-and-so”, but when it reaches Noah it deals with him at length. Similarly, of the ten generations from Noah to Abraham it gives but a brief account, but when it comes to Abraham it speaks of him more fully. It may be compared to the case of a jewel that falls into the sand: a man searches in the sand, sifts it in a sieve until he finds the jewel. When he has found it he throws away the pebbles and keeps the jewel (Midrash Tanchuma, Vayeshev 1). Another explanation of וישב יעקב AND JACOB ABODE: The camels of a flax dealer once came into a city laden with flax. A blacksmith asked in wonder where all that flax could be stored, and a clever fellow answered him, “A single spark caused by your bellows can burn up all of it.” “So, too, when Jacob saw (heard of) all these chiefs whose names are written above he said wonderingly, “Who can conquer all these?” What is written after the names of these chieftains? — and in this may be found the reply to Jacob’s question: These are the generations of Jacob — Joseph. For it is written (Obadiah 1:18) “And the house of Jacob shall be a fire and the house of Joseph a flame, and the house of Esau, for stubble: one spark issuing from Joseph will burn up all of these (descendants of Esau) (Genesis Rabbah 84:5). The passage beginning “Another explanation” is found in an old Rashi text."}, {"ch": 37, "v": 2, "aliyah": 1, "heb": "אֵ֣לֶּה&thinsp;<b>׀<\/b> תֹּלְד֣וֹת יַעֲקֹ֗ב יוֹסֵ֞ף בֶּן־שְׁבַֽע־עֶשְׂרֵ֤ה שָׁנָה֙ הָיָ֨ה רֹעֶ֤ה אֶת־אֶחָיו֙ בַּצֹּ֔אן וְה֣וּא נַ֗עַר אֶת־בְּנֵ֥י בִלְהָ֛ה וְאֶת־בְּנֵ֥י זִלְפָּ֖ה נְשֵׁ֣י אָבִ֑יו וַיָּבֵ֥א יוֹסֵ֛ף אֶת־דִּבָּתָ֥ם רָעָ֖ה אֶל־אֲבִיהֶֽם׃", "onk": "אִלֵּין תּוּלְדַת יַעֲקֹב יוֹסֵף בַּר שְׁבַע עַסְרֵי שְׁנִין (כַּד) הֲוָה רָעֵי עִם אֲחוֹהִי בַּעֲנָא <b>וְהוּא מְרַבֵּי<\/b> עִם בְּנֵי בִלְהָה וְעִם בְּנֵי זִלְפָּה נְשֵׁי אֲבוּהִי וְאַיְתִי יוֹסֵף יָת דִּבְּהוֹן בִּישָׁא לְוַת אֲבוּהוֹן:", "onk_en": "This is the history of Yaakov; Yoseif at the age of seventeen years, would tend the sheep with his brothers, and the lad was [<b>he had been raised<\/b>] with the sons of Bilhah, and the sons of Zilpah, his father’s wives. Yoseif brought back bad reports about them to their father.", "pj": "אִלֵין זַרְעֲיַת יַעֲקב יוֹסֵף בַּר שַׁבְסְרִי שְׁנִין הֲוָה בְּמִיפְקֵיהּ מִן בֵּית מֶדְרָשָׁא וְהוּא טְלֵה מִתְרַבֵּי עִם בְּנֵי בִּלְהָה וְעִם בְּנֵי זִלְפָּה נְשַׁיָא דְאָבוֹי וְאַיְיתֵי יוֹסֵף יַת טִיבֵיהוֹן בִּישׁ דְחָמְנוּן דְאָכְלִין בִּשְרָא דְתָּלִישׁ מִן חֵיוָא חַיָיא יַת אוּדְנַיָיא וְיַת דִנְבַּיָיא וְאָתָא וְתַנִי לְוַת אֲבוּהוֹן", "pj_en": "These are the generations of Jakob. Joseph was a son of seventeen years. He had come forth from the school, and was a youth brought up with the sons of Bilhah and the sons of Zilpha his fathers wives. And Joseph brought their evil report; for he had seen them eat the flesh that had been torn by wild beasts, the ears and the tails; and he came and told it to his father.", "tj": "", "tj_en": "", "rashi": "<b>אלה תולדות יעקב.<\/b> וְאֵלֶּה שֶׁל תּוֹלְדוֹת יַעֲקֹב, אֵלּוּ יִשּׁוּבֵיהֶם וְגִלְגּוּלֵיהֶם עַד שֶׁבָּאוּ לִכְלַל יִשּׁוּב, סִבָּה רִאשׁוֹנָה יוֹסֵף בֶּן י\"ז וְגוֹמֵר, עַל יְדֵי זֶה נִתְגַּלְגְּלוּ וְיָרְדוּ לְמִצְרַיִם, זֶהוּ אַחַר יִשּׁוּב פְּשׁוּטוֹ שֶׁל מִקְרָא לִהְיוֹת דָּבָר דָּבוּר עַל אָפְנָיו. וּמִ\"אַ דּוֹרֵשׁ תָּלָה הַכָּתוּב תּוֹלְדוֹת יַעֲקֹב בְּיוֹסֵף מִפְּנֵי כַמָּה דְבָרִים, אַחַת, שֶׁכָּל עַצְמוֹ שֶׁל יַעֲקֹב לֹא עָבַד אֵצֶל לָבָן אֶלָּא בְרָחֵל, וְשֶׁהָיָה זִיו אִיקוֹנִין שֶׁל יוֹסֵף דּוֹמֶה לוֹ, וְכָל מַה שֶּׁאֵרַע לְיַעֲקֹב אֵרַע לְיוֹסֵף: זֶה נִשְׂטַם וְזֶה נִשְׂטַם, זֶה אָחִיו מְבַקֵּשׁ לְהָרְגוֹ וְזֶה אֶחָיו מְבַקְּשִׁים לְהָרְגוֹ, וְכֵן הַרְבֵּה בִּבְ\"רַ. וְעוֹד נִדְרָשׁ בּוֹ <b>וישב<\/b>, בִּקֵּשׁ יַעֲקֹב לֵישֵׁב בְּשַׁלְוָה, קָפַץ עָלָיו רָגְזוֹ שֶׁל יוֹסֵף – צַדִּיקִים מְבַקְּשִׁים לֵישֵׁב בְּשַׁלְוָה, אָמַר הַקָּבָּ\"ה לֹא דַיָּן לַצַּדִּיקִים מַה שֶּׁמְּתֻקָּן לָהֶם לָעוֹלָם הַבָּא, אֶלָּא שֶׁמְּבַקְּשִׁים לֵישֵׁב בְּשַׁלְוָה בָּעוֹלָם הַזֶּה:<br><br><b>והוא נער.<\/b> שֶׁהָיָה עוֹשֶׂה מַעֲשֵׂה נַעֲרוּת, מְתַקֵּן בִּשְׂעָרוֹ, מְמַשְׁמֵשׁ בְּעֵינָיו, כְּדֵי שֶׁיִּהְיֶה נִרְאֶה יָפֶה:<br><br><b>את בני בלהה.<\/b> כְּלוֹמַר וְרָגִיל אֵצֶל בְּנֵי בִלְהָה, לְפִי שֶׁהָיוּ אֶחָיו מְבַזִּין אוֹתָן וְהוּא מְקָרְבָן:<br><br><b>את דבתם רעה.<\/b> כָּל רָעָה שֶׁהָיָה רוֹאֶה בְאֶחָיו בְנֵי לֵאָה הָיָה מַגִּיד לְאָבִיו, שֶׁהָיוּ אוֹכְלִין אֵבֶר מִן הַחַי, וּמְזַלְזְלִין בִּבְנֵי הַשְּׁפָחוֹת לִקְרוֹתָן עֲבָדִים, וַחֲשׁוּדִים עַל הָעֲרָיוֹת, וּבִשְׁלָשְׁתָּן לָקָה: וַיִּשְׁחֲטוּ שְׂעִיר עִזִּים בִּמְכִירָתוֹ וְלֹא אֲכָלוּהוּ חַי, וְעַל דִּבָּה שֶׁסִּפֵּר עֲלֵיהֶם שֶׁקּוֹרִין לַאֲחֵיהֶם עֲבָדִים – \"לְעֶבֶד נִמְכַּר יוֹסֵף\", וְעַל עֲרָיוֹת שֶׁסִּפֵּר עֲלֵיהֶם, וַתִּשָּׂא אֵשֶׁת אֲדֹנָיו וְגוֹ:<br><br><b>דבתם.<\/b> כָּל לְשׁוֹן דִּבָּה פרלדי\"ץ בְּלַעַז, כָּל מַה שֶּׁהָיָה יָכוֹל לְדַבֵּר בָּהֶם רָעָה, הָיָה מְסַפֵּר:<br><br><b>דבה.<\/b> לְשׁוֹן דּוֹבֵב שִׂפְתֵי יְשֵׁנִים (שיר ז'):", "rashi_en": "אלה תלדות יעקב THESE ARE THE PROGENY OF JACOB — And these are an account of the generations of Jacob: these are their settlements and the events that happened to them until they formed a permanent settlement. The first cause is found in the narrative, “Joseph being seventeen years old, etc. etc.” — it was through this incident that it came about that they went down to Egypt. This is the real explanation of the text and in it each statement finds its proper setting. The Midrash, however, explains that by the words, “These are the progeny of Jacob — Joseph”, Scripture regards all Jacob’s sons as secondary to Joseph for several reasons: first, the whole purpose of Jacob in working for Laban was only for Rachel, Joseph’s mother, (and all his children were born only in consequence of this); then, again, Joseph’s facial features bore a striking resemblance to those of Jacob. Further, whatever happened to Jacob happened to Joseph: the one was hated, the other was hated; in the case of the one his brother wished to kill him so, too, in the case of the other, his brethren wished to kill him. Many such similarities are pointed out in (Genesis Rabbah 84:5-6; Genesis Rabbah 84:8). Another comment on this verse is: וישב AND HE ABODE — Jacob wished to live at ease, but this trouble in connection with Joseph suddenly came upon him. When the righteous wish to live at ease, the Holy one, blessed be He), says to them: “Are not the righteous satisfied with what is stored up for them in the world to come that they wish to live at ease in this world too! (Genesis Rabbah 84:3)<br><br>והוא נער AND HE, BEING A LAD — His actions were childish: he dressed his hair, he touched up his eyes so that he should appear good-looking (Genesis Rabbah 84:7).<br><br>את בני בלהה WITH THE SONS OF BILHAH — meaning that he made it his custom to associate with the sons of Bilhah because his brothers slighted them as being sons of a hand-maid; therefore he fraternised with them.<br><br>את דבתם רעה THEIR EVIL REPORT — Whatever he saw wrong in his brothers, the sons of Leah, he reported to his father: that they used to eat flesh cut off from a living animal, that they treated the sons of the handmaids with contempt, calling them slaves, and that they were suspected of living in an immoral manner. With three such similar matters he was therefore punished. In consequence of his having stated that they used to eat flesh cut off from a living animal Scripture states, (Genesis 37:31) “And they slew a    he-goat\" after they had sold him and they did not eat its flesh whilst the animal was still living. And because of the slander which he related about them that they called their brothers slaves — (Psalms 105:17) “Joseph was sold for a slave.” And because he charged them with immorality (Genesis 39:7) “his master’s wife cast her eyes upon him etc.” (Genesis Rabbah 84:7).<br><br>דבתם THEIR REPORT — The word דבה always means in old French parleriz; English, gossip: whatever he could speak bad about them he told to his father. <br><br>דבה has the same meaning as the verb of the same root in (Song 7:10) “(דובב) making speak the lips of those that are asleep”. "}, {"ch": 37, "v": 3, "aliyah": 1, "heb": "וְיִשְׂרָאֵ֗ל אָהַ֤ב אֶת־יוֹסֵף֙ מִכׇּל־בָּנָ֔יו כִּֽי־בֶן־זְקֻנִ֥ים ה֖וּא ל֑וֹ וְעָ֥שָׂה ל֖וֹ כְּתֹ֥נֶת פַּסִּֽים׃", "onk": "וְיִשְׂרָאֵל רְחֵם יָת יוֹסֵף מִכָּל בְּנוֹהִי אֲרֵי בַר <b>חַכִּים<\/b> הוּא לֵיהּ וַעֲבַד לֵיהּ כִּתּוּנָא דְפַסֵּי:", "onk_en": "Yisrael loved Yoseif more than any of his sons, for he was a [<b>wise<\/b>] son of his old age to him, and he made him a long, colorful cloak.", "pj": "וְיִשְרָאֵל רְחֵים יַת יוֹסֵף מִכָּל בְּנוֹי אֲרוּם אִיקוּנֵי דְיוֹסֵף דַמְיַין לְאִיקוּנִין דִילֵיהּ וְעָבַד לֵיהּ פַּרְגוֹד מְצוּיָיר", "pj_en": "And Israel loved Joseph more than all his sons, because the likeness of Joseph resembled his own, and he made him a figured robe.", "tj": "פַּרְגוּד מְצוּיָיר:", "tj_en": "A figured robe.", "rashi": "<b>בן זקנים.<\/b> שֶׁנּוֹלַד לוֹ לְעֵת זִקְנָתוֹ. וְאֻנְקְלוֹס תִּרְגֵּם בַּר חַכִּים הוּא לֵהּ – כָּל מַה שֶּׁלָּמַד מִשֵּׁם וָעֵבֶר מָסַר לוֹ. דָּ\"אַ, שֶׁהָיָה זִיו אִיקוֹנִין שֶׁלוֹ דּוֹמֶה לוֹ:<br><br><b>פסים.<\/b> לְשׁוֹן כְּלִי מֵילָת, כְּמוֹ כַּרְפַּס וּתְכֵלֶת, וּכְמוֹ כְּתֹנֶת הַפַּסִּים דְּתָמָר וְאַמְנוֹן, וּמִ\"אַ עַ\"שֵׁ צָרוֹתָיו, שֶׁנִּמְכַּר לְפוֹטִיפַר וְלַסּוֹחֲרִים וְלַיִּשְׁמְעֵאלִים וְלַמִּדְיָנִים:", "rashi_en": "בן זקנים THE SON OF HIS OLD AGE — because he was a wise son to him” — all that he had learnt from Shem and Eber he taught him (Genesis Rabbah 84:8). Another explanation of  בן זקנים— his facial features were similar to his (Jacob’s) (Genesis Rabbah 84:8).<br><br>פסים is a term for raiment of fine wool (Shabbat 10b). Similar is (Ester 1:6) כרפס “Fine linen and blue”. The same garment כתנת הפסים is mentioned (2 Samuel 13:18) in the story of Amnon and Tamar and we may therefore gather that it was made of very fine material. There is a Midrashic statement that in the word פסים we may find an allusion to all his misfortunes: he was sold to Potiphar (פוטיפר), to the merchants (סוחרים), to the Ishmaelites (ישמעאלים), and to the Midianites (מדינים) (Genesis Rabbah 84:8). "}, {"ch": 37, "v": 4, "aliyah": 1, "heb": "וַיִּרְא֣וּ אֶחָ֗יו כִּֽי־אֹת֞וֹ אָהַ֤ב אֲבִיהֶם֙ מִכׇּל־אֶחָ֔יו וַֽיִּשְׂנְא֖וּ אֹת֑וֹ וְלֹ֥א יָכְל֖וּ דַּבְּר֥וֹ לְשָׁלֹֽם׃", "onk": "וַחֲזוֹ אֲחוֹהִי אֲרֵי יָתֵיהּ רְחֵם אֲבוּהוֹן מִכָּל אֲחוֹהִי וּסְנוֹ יָתֵיהּ וְלָא <b>צָבָן<\/b> לְמַלָּלָא עִמֵּיהּ לִשְׁלָם:", "onk_en": "His brothers saw that their father loved him more than all his brothers, and they hated him. They could not [<b>were not willing to<\/b>] speak to him peaceably.", "pj": "וְחָמוּן אָחוּי אֲרוּם יָתֵיהּ רְחַם אֲבוּהוֹן מִכָּל אָחוֹי וְנָטְרוּ לֵיהּ בָּבִי וְלָא צָבָן לְמַלָלָא עִמֵיהּ שְׁלָם", "pj_en": "And his brothers saw that their father loved him more than all his brethren, and they cherished enmity against him, and were unwilling to speak peacefully with him.", "tj": "", "tj_en": "", "rashi": "<b>ולא יכלו דברו לשלום.<\/b> מִתּוֹךְ גְּנוּתָם לָמַדְנוּ שִׁבְחָם, שֶׁלֹּא דִבְּרוּ אַחַת בַּפֶּה וְאַחַת בַּלֵּב:<br><br><b>דברו.<\/b> לְדַבֵּר עִמּוֹ:", "rashi_en": "ולא יכלו דברו לשלום AND THEY COULD NOT SPEAK PEACEABLY TO HIM — from what is stated to their discredit we may infer something to their credit: they did not speak one thing with their mouth having another thing quite different in their hearts (Genesis Rabbah 84:9).<br><br>דברו means TO SPEAK TO HIM."}, {"ch": 37, "v": 5, "aliyah": 1, "heb": "וַיַּחֲלֹ֤ם יוֹסֵף֙ חֲל֔וֹם וַיַּגֵּ֖ד לְאֶחָ֑יו וַיּוֹסִ֥פוּ ע֖וֹד שְׂנֹ֥א אֹתֽוֹ׃", "onk": "וַחֲלַם יוֹסֵף חֶלְמָא וְחַוִּי לַאֲחוֹהִי וְאוֹסִיפוּ עוֹד סְנוֹ יָתֵיהּ:", "onk_en": "Yoseif had a dream and he told his brothers, and they hated him even more.", "pj": "וַחֲלָם יוֹסֵף חֵילְמָא וְתַנִי לְאָחוֹהִי וְאוֹסִיפוּ לְמִנְטַר תּוּב לֵיהּ בָּבוּ", "pj_en": "And Joseph dreamed a dream, and declared it to his brethren, and they added yet to keep enmity against him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 6, "aliyah": 1, "heb": "וַיֹּ֖אמֶר אֲלֵיהֶ֑ם שִׁמְעוּ־נָ֕א הַחֲל֥וֹם הַזֶּ֖ה אֲשֶׁ֥ר חָלָֽמְתִּי׃", "onk": "וַאֲמַר לְהוֹן שְׁמָעוּ <b>כְעַן<\/b> חֶלְמָא הָדֵין דִּי חֲלֵמִית:", "onk_en": "He said to them, Listen [<b>now<\/b>] to this dream that I dreamt.", "pj": "וַאֲמַר לְהוֹן שִׁמְעוּ כְּדוֹן חֶלְמָא הָדֵין דִי חֲלֵימִית", "pj_en": "And he said to them, Hear now this dream which I have dreamed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 7, "aliyah": 1, "heb": "וְ֠הִנֵּ֠ה אֲנַ֜חְנוּ מְאַלְּמִ֤ים אֲלֻמִּים֙ בְּת֣וֹךְ הַשָּׂדֶ֔ה וְהִנֵּ֛ה קָ֥מָה אֲלֻמָּתִ֖י וְגַם־נִצָּ֑בָה וְהִנֵּ֤ה תְסֻבֶּ֙ינָה֙ אֲלֻמֹּ֣תֵיכֶ֔ם וַתִּֽשְׁתַּחֲוֶ֖יןָ לַאֲלֻמָּתִֽי׃", "onk": "וְהָא אֲנַחְנָא מְאַסְּרִין אֱסָרָן בְּגוֹ חַקְלָא וְהָא קָמַת אֱסַרְתִּי וְאַף אִזְדְּקָפַת וְהָא מִסְתַּחֲרָן אֱסָרָתְכוֹן וְסָגְדָן לֶאֱסַרְתִּי:", "onk_en": "Behold, we were binding sheaves in the middle of the field. Behold my sheaf rose and stood up straight; and behold your sheaves surrounded it and prostrated themselves to my sheaf.", "pj": "וְהָא אֲנַחְנָא מְפַרְכִין פֵּירוּכִין בְּגוֹ חַקְלָא וְהָא קָמַת פּוּרְכָתִי וְאוּף אִזְדְקֵיפַת וְהָא מִתְחַזְרָן פּוּרְכָתֵיכוֹן וְגַחְנוֹן לְפּוּרְכָתִי", "pj_en": "Behold, we were binding sheaves in the midst of the field, and lo, my sheaf arose, and stood upright; and, behold, your sheaves surrounded and bowed to my sheaf.", "tj": "מְפַרְכִין פֵּירוּכִין:", "tj_en": "Were binding sheaves.", "rashi": "<b>מאלמים אלמים.<\/b> כְּתַרְגּוּמוֹ מְאַסְּרִין אֱסָרִין – עֳמְרִין, וְכֵן נֹשֵׂא אֲלֻמֹּתָיו (תהלים קכ\"ו), וְכָמוֹהוּ בִּלְשׁוֹן מִשְׁנָה וְהָאֲלֻמּוֹת נוֹטֵל וּמַכְרִיז:<br><br><b>קמה אלמתי.<\/b> נִזְקְפָה:<br><br><b>וגם נצבה.<\/b> לַעֲמֹד עַל עָמְדָהּ בִּזְקִיפָה:", "rashi_en": "מאלמים אלמים — Understand it as the Targum renders it: were binding bundles i.e. sheaves. Similar is (Psalms 126:6) “bearing (אלומותיו) its sheaves”. Similarly in Mishnaic Hebrew we have (Bava Metzia 22b) “and he takes (האלומות) the sheaves and makes public proclamation”.<br><br>קמה אלמתי means it raised itself erect.<br><br>וגם נצבה means remaining erect in its place."}, {"ch": 37, "v": 8, "aliyah": 1, "heb": "וַיֹּ֤אמְרוּ לוֹ֙ אֶחָ֔יו הֲמָלֹ֤ךְ תִּמְלֹךְ֙ עָלֵ֔ינוּ אִם־מָשׁ֥וֹל תִּמְשֹׁ֖ל בָּ֑נוּ וַיּוֹסִ֤פוּ עוֹד֙ שְׂנֹ֣א אֹת֔וֹ עַל־חֲלֹמֹתָ֖יו וְעַל־דְּבָרָֽיו׃", "onk": "וַאֲמָרוּ לֵיהּ אֲחוֹהִי הֲמַלְכוּ <b>אַתְּ מְדַמֵּי לְמִמְלַךְ עָלָנָא אוֹ שׁוּלְטָן אַתְּ סְבִיר לְמִשְׁלַט בָּנָא<\/b> וְאוֹסִיפוּ עוֹד סְנוֹ יָתֵיהּ עַל חֶלְמוֹהִי וְעַל פִּתְגָּמוֹהִי:", "onk_en": "His brothers said to him, Will you then be a king over us? [<b>Do you imagine that you will reign over us?<\/b>] Will you indeed rule over us? [<b>Or do you think that you will rule over us?<\/b>] They hated him even more because of his dreams and his words.", "pj": "וַאֲמָרוּ לֵיהּ אֲחוֹהִי הַלְמִמְלָךְ אַנְתְּ מְדַמֵי עֲלָנָא אִין לְמִשְׁלַט אַנְתְּ סְבִיר עֲלָנָא וְאוֹסִיפוּ תּוּב לְמִינְטַר לֵיהּ בָּבוּ עַל חֶלְמוֹי וְעַל פִּתְגָמוֹי", "pj_en": "And his brothers said to him, Art thou thinking to reign over us, or dost thou expect to have rule over us? And they added yet to keep enmity against him, for his dream and for his words.", "tj": "", "tj_en": "", "rashi": "<b>ועל דבריו.<\/b> עַל דִּבָּתָם רָעָה שֶׁהָיָה מֵבִיא לַאֲבִיהֶם:", "rashi_en": "ועל דבריו AND FOR HIS WORDS — for the evil report about them which he used to bring to their father. "}, {"ch": 37, "v": 9, "aliyah": 1, "heb": "וַיַּחֲלֹ֥ם עוֹד֙ חֲל֣וֹם אַחֵ֔ר וַיְסַפֵּ֥ר אֹת֖וֹ לְאֶחָ֑יו וַיֹּ֗אמֶר הִנֵּ֨ה חָלַ֤מְתִּֽי חֲלוֹם֙ ע֔וֹד וְהִנֵּ֧ה הַשֶּׁ֣מֶשׁ וְהַיָּרֵ֗חַ וְאַחַ֤ד עָשָׂר֙ כּֽוֹכָבִ֔ים מִֽשְׁתַּחֲוִ֖ים לִֽי׃", "onk": "וַחֲלַם עוֹד חֶלְמָא אָחֲרָנָא וְאִשְׁתָּעֵי יָתֵיהּ לַאֲחוֹהִי וַאֲמַר הָא חֲלֵמִית חֶלְמָא עוֹד וְהָא שִׁמְשָׁא וְסִהֲרָא וְחַד עֲשַׂר כּוֹכְבַיָּא סָגְדָן לִי:", "onk_en": "He had another dream and told it to his brothers. He said, Behold! I dreamed another dream. The sun, the moon, and eleven stars were prostrating themselves to me.", "pj": "וַחֲלָם תּוּב חֶלְמָא חוֹרָנָא וְתַנִי יָתֵיהּ לְאָחוֹי וַאֲמַר הָא חֲלֵימִית חֶלְמָא תּוּב וְהָא שִׁמְשָׁא וְסִיהֲרָא וְחַד סַר כּוֹכְבַיָא גָחֲנָן לִי", "pj_en": "And he dreamed again another dream, and told it to his brothers, and said, Behold, I have dreamed yet a dream, and lo, the sun, and the moon, and eleven stars, bowed to me.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 10, "aliyah": 1, "heb": "וַיְסַפֵּ֣ר אֶל־אָבִיו֮ וְאֶל־אֶחָיו֒ וַיִּגְעַר־בּ֣וֹ אָבִ֔יו וַיֹּ֣אמֶר ל֔וֹ מָ֛ה הַחֲל֥וֹם הַזֶּ֖ה אֲשֶׁ֣ר חָלָ֑מְתָּ הֲב֣וֹא נָב֗וֹא אֲנִי֙ וְאִמְּךָ֣ וְאַחֶ֔יךָ לְהִשְׁתַּחֲוֺ֥ת לְךָ֖ אָֽרְצָה׃", "onk": "וְאִשְׁתָּעֵי לַאֲבוּהִי וְלַאֲחוֹהִי וּנְזַף בֵּיהּ אֲבוּהִי וַאֲמַר לֵיהּ מָה חֶלְמָא הָדֵין דִּי חֲלֵמְתָּא הֲמֵיתָא נֵיתֵי אֲנָא וְאִמָּךְ וְאַחָיךְ לְמִסְגֻּד לָךְ עַל אַרְעָא:", "onk_en": "He told it to his father and to his brothers. His father rebuked him, and said to him, What is this dream that you dreamed? Shall I, your mother and your brothers come and prostrate themselves on the ground to you?", "pj": "וְאִשְׁתְּעִי לְאָבוֹי וּלְאָחוֹי וּנְזַף בֵּיהּ אָבוֹי וַאֲמַר לֵיהּ מָה חֶלְמָא הָדֵין דְחַלֵימְתָּא הֲמֵיתָא נֵיתֵי אֲנָא וְאִמָךְ וְאָחָךְ לְמִגְחַן לָךְ עַל אַרְעָא", "pj_en": "And he related it to his father and to his brethren: but his father rebuked him, and said to him, What dream is this that thou hast dreamed? Shall I, and thy mother, and thy brethren, really come and bow before thee to the ground?", "tj": "", "tj_en": "", "rashi": "<b>ויספר אל אביו ואל אחיו.<\/b> לְאַחַר שֶׁסִּפֵּר אוֹתוֹ לְאֶחָיו חָזַר וְסִפְּרוֹ לְאָבִיו בִּפְנֵיהֶם:<br><br><b>ויגער בו.<\/b> לְפִי שֶׁהָיָה מֵטִיל שִׂנְאָה עָלָיו:<br><br><b>הבוא נבוא.<\/b> וַהֲלֹא אִמְּךָ כְבָר מֵתָה, וְהוּא לֹא הָיָה יוֹדֵעַ שֶׁהַדְּבָרִים מַגִּיעִין לְבִלְהָה שֶׁגִּדְּלַתּוּ כְּאִמּוֹ. וְרַבּוֹתֵינוּ לָמְדוּ מִכָּאן שֶׁאֵין חֲלוֹם בְּלֹא דְּבָרִים בְּטֵלִים, וְיַעֲקֹב נִתְכַּוֵּן לְהוֹצִיא הַדָּבָר מִלֵּב בָּנָיו שֶׁלֹּא יַקְנִיאוּהוּ, לְכָךְ אָמַר לוֹ הֲבוֹא נָבוֹא וְגוֹ' – כְּשֵׁם שֶׁאִי אֶפְשָׁר בְּאִמְּךָ כָּךְ הַשְּׁאָר הוּא בָטֵל:", "rashi_en": "ויספר אל אביו ואל אחיו AND HE TOLD IT TO HIS FATHER AND TO HIS BRETHREN — After he had related it to his brothers (see 5:9) he again related it to his father in their presence.<br><br>ויגער בו AND HIS FATHER REBUKED HIM because he was arousing hatred against himself by relating the dream.<br><br>הבוא נבוא SHALL WE INDEED COME — “Is not your mother long since dead?” He did not, however, understand that the statement really alluded to Bilhah who had brought him up as though she were his own mother (Genesis Rabbah 84:11). Our Rabbis inferred from here that there is no dream but has some absurd incidents (Berakhot 55). Jacob’s intention in pointing out the absurdity of Joseph’s mother, who was dead, bowing down to him was to make his sons forget the whole matter so that they should not envy him, and on this account he said to him, “Shall we indeed come etc.” — meaning, just as it (the fulfillment of the dream) is impossible in the case of your mother so the remainder of the dream is absurd. "}, {"ch": 37, "v": 11, "aliyah": 1, "heb": "וַיְקַנְאוּ־ב֖וֹ אֶחָ֑יו וְאָבִ֖יו שָׁמַ֥ר אֶת־הַדָּבָֽר׃", "onk": "וְקַנִּיאוּ בֵיהּ אֲחוֹהִי וַאֲבוּהִי נְטַר יָת פִּתְגָּמָא:", "onk_en": "His brothers were jealous of him but his father kept the matter in mind.", "pj": "וְקַנִיאוּ בֵּיהּ אֲחוּהִי וְאָבוֹי נָטַר בְּלִבֵּיהּ יַת פִּתְגָמָא", "pj_en": "And his brothers envied him; yet his father kept the saying in his heart.", "tj": "", "tj_en": "", "rashi": "<b>שמר את הדבר.<\/b> הָיָה מַמְתִּין וּמְצַפֶּה מָתַי יָבֹא, וְכֵן שֹׁמֵר אֱמֻנִים (ישעיהו כ\"ו), וְכֵן לֹא תִשְׁמֹר עַל חַטָּאתִי (איוב י\"ד) – לֹא תַמְתִּין:", "rashi_en": "שמר את הדבר OBSERVED THE MATTER — He awaited and looked forward to the time when this would come to pass. In the same sense we have (Isaiah 26:2) “that watch (שומר) for faithfulness” (i.e., for the performance of a promise) and (Job 14:16) — “לא תשמור for my sin” — which means “thou dost not wait for my sin”. "}, {"ch": 37, "v": 12, "aliyah": 2, "heb": "וַיֵּלְכ֖וּ אֶחָ֑יו לִרְע֛וֹת אֶׄתׄ־צֹ֥אן אֲבִיהֶ֖ם בִּשְׁכֶֽם׃", "onk": "וַאֲזָלוּ אֲחוֹהִי לְמִרְעֵי יָת עָנָא דַאֲבוּהוֹן בִּשְׁכֶם:", "onk_en": "His brothers went off to pasture their father’s sheep in Shechem.", "pj": "וַאֲזָלוּ אָחוֹי לְמִרְעֵי יַת עָנָא דַאֲבוּהוֹן בִּשְׁכֶם", "pj_en": "And his brothers went to feed their father's flock in Shekem.", "tj": "", "tj_en": "", "rashi": "<b>לרעות את צאן.<\/b> נָקוּד עַל אֶת, שֶׁלֹּא הָלְכוּ אֶלָּא לִרְעוֹת אֶת עַצְמָן:", "rashi_en": "לרעות את צאן TO FEED THE FLOCK — The word את has dots above it, to denote that they went only to feed themselves (Genesis Rabbah 84:13). "}, {"ch": 37, "v": 13, "aliyah": 2, "heb": "וַיֹּ֨אמֶר יִשְׂרָאֵ֜ל אֶל־יוֹסֵ֗ף הֲל֤וֹא אַחֶ֙יךָ֙ רֹעִ֣ים בִּשְׁכֶ֔ם לְכָ֖ה וְאֶשְׁלָחֲךָ֣ אֲלֵיהֶ֑ם וַיֹּ֥אמֶר ל֖וֹ הִנֵּֽנִי׃", "onk": "וַאֲמַר יִשְׂרָאֵל לְיוֹסֵף הֲלָא אַחָיךְ רָעָן בִּשְׁכֶם אֱתָא וְאֶשְׁלְחִנָּךְ לְוָתְהוֹן וַאֲמַר לֵיהּ הָא אֲנָא:", "onk_en": "Yisrael said to Yoseif, Aren’t your brothers pasturing [the sheep] in Shechem? Come, I will send you to them. He [Yoseif] said to him, Here I am.", "pj": "וַהֲוָה לִזְמַן יוֹמִין וַאֲמַר יִשְרָאֵל לְיוֹסֵף הֲלָא אָחָךְ רָעָן בִּשְׁכֶם וּדְחֵיל דִילְמָא יֵיתוּן חִיוָאֵי וְיִמְחִינוּן עַל עֵיסַק דִי מְחוֹ יַת חֲמוֹר וְיַת שְׁכֶם וְיַת יַתְבֵי קַרְתָּא אִיתָא כְּדוֹן וַאֲשַׁלְחִינָךְ לְוַתְהוֹן וַאֲמַר לֵיהּ הָא נָא", "pj_en": "And it was at the time of days that Israel said to Joseph, Do not thy brethren feed in Shekem? But I am afraid lest the Hivaee come and smite them, because they smote Hamor and Shekem and the inhabitants of the city. Come now; and I will send thee to them And he said, Behold me.", "tj": "", "tj_en": "", "rashi": "<b>הנני.<\/b> לְשׁוֹן עֲנָוָה וּזְרִיזוּת, נִזְדָּרֵז לְמִצְוַת אָבִיו, וְאַף עַל פִּי שֶׁהָיָה יוֹדֵעַ בְּאֶחָיו שֶׁשּׂוֹנְאִין אוֹתוֹ:", "rashi_en": "הנני HERE AM I — An expression denoting humility and readiness: he was zealous to perform his father’s bidding, although he was aware that his brothers hated him (Genesis Rabbah 84:13). "}, {"ch": 37, "v": 14, "aliyah": 2, "heb": "וַיֹּ֣אמֶר ל֗וֹ לֶךְ־נָ֨א רְאֵ֜ה אֶת־שְׁל֤וֹם אַחֶ֙יךָ֙ וְאֶת־שְׁל֣וֹם הַצֹּ֔אן וַהֲשִׁבֵ֖נִי דָּבָ֑ר וַיִּשְׁלָחֵ֙הוּ֙ מֵעֵ֣מֶק חֶבְר֔וֹן וַיָּבֹ֖א שְׁכֶֽמָה׃", "onk": "וַאֲמַר לֵיהּ אִזֵיל <b>כְּעַן<\/b> חֲזֵי יָת שְׁלָמָא דְאָחוּךְ וְיָת שְׁלָמָא דְעָנָא וַאֲתֶבְנִי פִּתְגָּמָא וְשַׁלְחֵיהּ <b>מִמֵּישַׁר<\/b> חֶבְרוֹן וַאֲתָא לִשְׁכֶם:", "onk_en": "He [Yisrael] said to him, Go please [<b>now<\/b>], see after the well-being of your brothers, and the welfare of the sheep, and bring me a report. He sent [Yoseif] from the depths [<b>plain<\/b>] of Chevron, and he came to Shechem.", "pj": "וַאֲמַר לֵיהּ אִיזֵל כְּדוֹן חָמֵי יַת שְׁלַם אָחָךְ וְיַת שְׁלַם עָנָא וַאֲתֵיבְנִי פִּתְגָמָא וְשַׁדְרֵיהּ עַל עֵיטָא עֲמִיקְתָּא דְאִתְמַלֵל עִם אַבְרָהָם בְּחֶבְרוֹן וּבְהַהוּא יוֹמָא הֲוָה שָׁרוּי גָלוּתָא דְמִצְרַיִם וְקָם וְאָתָא יוֹסֵף לִשְׁכֶם", "pj_en": "And he said, Go, see the welfare of Your brethren, and the welfare of the flock, and return me word to the deep Counsel. But he sent him according to the deep counsel which was spoken to Abraham in Hebron; for on that day began the cativity of Mizraim. And Joseph arose, and came to Shekem.", "tj": "", "tj_en": "", "rashi": "<b>מעמק חברון.<\/b> וַהֲלֹא חֶבְרוֹן בָּהָר, שֶׁנֶּאֱמַר וַיַּעֲלוּ בַנֶּגֶב וַיָּבֹא עַד חֶבְרוֹן (במדבר י\"ג), אֶלָּא מֵעֵצָה עֲמֻקָּה שֶׁל אוֹתוֹ צַדִּיק הַקָּבוּר בְּחֶבְרוֹן, לְקַיֵּם מַה שֶּׁנֶּאֱמַר לְאַבְרָהָם בֵּין הַבְּתָרִים כִּי גֵר יִהְיֶה זַרְעֲךָ (בראשית ט״ו:י״ג):<br><br><b>ויבא שכמה.<\/b> מָקוֹם מוּכָן לְפֻרְעָנוּת, שָׁם קִלְקְלוּ הַשְּׁבָטִים, שָׁם עִנּוּ אֶת דִּינָה, שָׁם נֶחְלְקָה מַלְכוּת בֵּית דָּוִד, שֶׁנֶּאֱמַר וַיֵּלֶךְ רְחַבְעָם שְׁכֶמָה (מלכים א י\"ב):", "rashi_en": "מעמק חברון FROM THE VALE OF HEBRON — But was not Hebron situated on a hill, as it is said (Numbers 13:22) “And they went up into the South and they came unto Hebron” why then does it state that Jacob sent him from the עמק, (the vale, the deep part) of Hebron? But the meaning is that Jacob sent him in consequence of the necessity of bringing into operation the profound (עמוקה) thought of the righteous man who was buried in Hebron (Midrash Tanchuma, Vayera 22) — in order that there might be fulfilled that which was spoken to Abraham when the Covenant was made ‘between the parts” (cf. 15:13), “thy seed shall be a stranger etc.”<br><br>ויבא שכמה AND HE CAME TO SHECHEM — A spot foredestined to be the scene of misfortunes: there the sons of Jacob sinned (by selling Joseph), there Dinah was maltreated, there the kingdom of the House of David was divided, as it said (1 Kings 12:1) “And Rehoboam went to Shechem etc.” (Sanhedrin 102a). "}, {"ch": 37, "v": 15, "aliyah": 2, "heb": "וַיִּמְצָאֵ֣הוּ אִ֔ישׁ וְהִנֵּ֥ה תֹעֶ֖ה בַּשָּׂדֶ֑ה וַיִּשְׁאָלֵ֧הוּ הָאִ֛ישׁ לֵאמֹ֖ר מַה־תְּבַקֵּֽשׁ׃", "onk": "וְאַשְׁכְּחֵיהּ גַּבְרָא וְהָא תָעֵי בְּחַקְלָא וּשְׁאָלִנֵּיהּ גַּבְרָא לְמֵימַר מָה אַתְּ בָּעֵי:", "onk_en": "A man found him going astray in the field. The man asked him, What are you seeking?", "pj": "וְאַשְׁכְּחֵיהּ גַבְרִיאֵל בִּדְמוּת גַבְרָא וְהָא טָעֵי בְחַקְלָא וְשַׁאֲלֵיהּ גַבְרָא לְמֵימָר מָה אַנְתְּ בָּעֵי", "pj_en": "And Gabriel in the likeness of a man found him wandering field. And the man asked him, saying, What seekest thou?", "tj": "", "tj_en": "", "rashi": "<b>וימצאהו איש.<\/b> זֶה גַּבְרִיאֵל, שֶׁנֶּאֱמַר וְהָאִישׁ גַּבְרִיאֵל (דניאל ט כא):", "rashi_en": "וימצאהו איש AND A MAN FOUND HIM — This was the angel Gabriel (Genesis Rabbah 84:14) as it is said, (Daniel 9:21) and the man (והאיש) Gabriel” (Midrash Tanchuma, Vayeshev 2:3)."}, {"ch": 37, "v": 16, "aliyah": 2, "heb": "וַיֹּ֕אמֶר אֶת־אַחַ֖י אָנֹכִ֣י מְבַקֵּ֑שׁ הַגִּֽידָה־נָּ֣א לִ֔י אֵיפֹ֖ה הֵ֥ם רֹעִֽים׃", "onk": "וַאֲמַר יָת אַחַי אֲנָא בָעֵי חַוִּי <b>כְעַן<\/b> לִי הֵיכָא אִנּוּן רָעָן:", "onk_en": "He said, I am looking for my brothers, tell me please [<b>now<\/b>], where are they pasturing?", "pj": "וַאֲמַר יַת אָחוּי אֲנָא בָּעֵי חֲוִי כְדוֹן לִי אֵיכָן אִינוּן רָעָן", "pj_en": "And he said, I seek my brothers; show me, pray, where they feed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 17, "aliyah": 2, "heb": "וַיֹּ֤אמֶר הָאִישׁ֙ נָסְע֣וּ מִזֶּ֔ה כִּ֤י שָׁמַ֙עְתִּי֙ אֹֽמְרִ֔ים נֵלְכָ֖ה דֹּתָ֑יְנָה וַיֵּ֤לֶךְ יוֹסֵף֙ אַחַ֣ר אֶחָ֔יו וַיִּמְצָאֵ֖ם בְּדֹתָֽן׃", "onk": "וַאֲמַר גַּבְרָא נְטָלוּ מִכָּא אֲרֵי שְׁמָעִית דְּאָמְרִין נֵיזֵל לְדֹתָן וַאֲזַל יוֹסֵף בָּתַר אֲחוֹהִי וְאַשְׁכְּחִנּוּן בְּדֹתָן:", "onk_en": "The man said, They have traveled on from here, for I heard them say, Let us go to Doson. Yoseif went after his brothers and found them in Doson.", "pj": "וַאֲמַר גַבְרָא נַטְלַן מִיכַּן אֲרוּם שְׁמָעִית מִבָּתַר פַּרְגוֹדָא דְהָא אִישְׁתְּרֵי מִן יוֹמָא דֵין שִׁעֲבּוּד מִצְרָאֵי וְאִתְאַמַר לְהוֹם בִּנְבוּאָה דְחִיוָאֵי בָּעַן לִמְסַדְרָא עִמְהוֹן סִדְרָא קְרָבָא בְּגִין כֵּן הֲווֹ אָמְרִין נֵיזַל לְדוֹתָן וַאֲזַל יוֹסֵף בָּתַר אָחוֹי וְאַשְׁכְּחִינוּן בְּדוֹתָן", "pj_en": "And the man said, They have journeyed hence: for I heard beyond the Veil, that behold from today would begin the servitude to the Mizraee; and it was said to them in prophecy, Hivaee would seek to set battle in array against them. Therefore said they, we will go unto Dothan.", "tj": "", "tj_en": "", "rashi": "<b>נסעו מזה.<\/b> הִסִּיעוּ עַצְמָן מִן הָאַחְוָה:<br><br><b>נלכה דתינה.<\/b> לְבַקֵּשׁ לְךָ נִכְלֵי דָתוֹת שֶׁיְּמִיתוּךָ בָהֶם. וּלְפִי פְשׁוּטוֹ שֵׁם מָקוֹם הוּא, וְאֵין מִקְרָא יוֹצֵא מִידֵי פְשׁוּטוֹ:", "rashi_en": "נסעו מזה THEY HAVE JOURNEYED HENCE — they have departed from all feeling of brotherhood.<br><br>נלכה דתינה LET US GO TO DOTHAN — “let us go to seek some legal (דתות) pretexts” to put you to death. According to the literal sense, however, it is the name of place, and Scripture never really loses its literal sense (Shabbat 63a). "}, {"ch": 37, "v": 18, "aliyah": 2, "heb": "וַיִּרְא֥וּ אֹת֖וֹ מֵרָחֹ֑ק וּבְטֶ֙רֶם֙ יִקְרַ֣ב אֲלֵיהֶ֔ם וַיִּֽתְנַכְּל֥וּ אֹת֖וֹ לַהֲמִיתֽוֹ׃", "onk": "וַחֲזוֹ יָתֵיהּ מֵרָחִיק עַד לָא קְרֵיב לְוָתְהוֹן <b>וְחַשִּׁיבוּ עֲלוֹהִי לְמִקְטְלֵיהּ<\/b>:", "onk_en": "They saw him from a distance, and before he approached them they were plotting against him to kill [<b>thinking about killing<\/b>] him.", "pj": "וְחָמוּן יָתֵיהּ מֵרָחִיק וְעַד לָא קָרִיב לְוַתְהוֹם וְאִתְיַיעֲטוּ עֲלוֹי לְמִקְטְלֵיהּ", "pj_en": "And Joseph went after his brothers, and found them in Dothan. And they saw him from afar, before he had come nigh to them, and plotted against him to kill him.", "tj": "", "tj_en": "", "rashi": "<b>ויתנכלו.<\/b> נִתְמַלְּאוּ נְכָלִים וְעַרְמוּמִית:<br><br><b>אתו.<\/b> כְּמוֹ אִתּוֹ, עִמּוֹ, כְּלוֹמַר, אֵלָיו:", "rashi_en": "ויתנכלו AND THEY CONSPIRED — The Hithpael form denotes that they became filled with plots and craft.<br><br>אֹתוֹ is here the same as אִתּוֹ which means “with him” — meaning אליו: they became filled with plots and craft directed towards him (אליו)."}, {"ch": 37, "v": 19, "aliyah": 2, "heb": "וַיֹּאמְר֖וּ אִ֣ישׁ אֶל־אָחִ֑יו הִנֵּ֗ה בַּ֛עַל הַחֲלֹמ֥וֹת הַלָּזֶ֖ה בָּֽא׃", "onk": "וַאֲמָרוּ גְּבַר לַאֲחוּהִי הָא מָרֵי חֶלְמַיָּא דֵיכִי אֲתָא:", "onk_en": "One man said to another, Here comes the dreamer.", "pj": "וַאֲמָרוּ שִׁמְעוֹן וְלֵוִי דַהֲווֹ אָחִין בְּעֵיטָתָא גְבַר לְאָחוּי הָא מָרֵי חֶלְמַיָא דֵיכִי אָתֵי", "pj_en": "And Shimeon and Levi, who were brothers in counsel, said each man to his brother, Behold, this master of dreams cometh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 20, "aliyah": 2, "heb": "וְעַתָּ֣ה&thinsp;<b>׀<\/b> לְכ֣וּ וְנַֽהַרְגֵ֗הוּ וְנַשְׁלִכֵ֙הוּ֙ בְּאַחַ֣ד הַבֹּר֔וֹת וְאָמַ֕רְנוּ חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְהוּ וְנִרְאֶ֕ה מַה־יִּהְי֖וּ חֲלֹמֹתָֽיו׃", "onk": "וּכְעַן אֱתוֹ וְנִקְטְלִנֵּיהּ וְנִרְמִנֵּיהּ בַּחֲדָא מִן גֻּבַּיָּא וְנֵימַר חַיְתָא בִישְׁתָא אֲכַלְתֵּיהּ וְנֶחֱזֵי מָה יְהוֹן <b>בְּסוֹף<\/b> חֶלְמוֹהִי:", "onk_en": "Now, come let us kill him and throw him into one of the pits; and we will say that a wild beast devoured him. Then we will see what will become [<b>be the end<\/b>] of his dreams.", "pj": "וּכְדוֹן אָתוּ וְנִקְטְלִינֵיהּ וְנַרְמִינֵיהּ בְּחַד מִן גוֹבַיָא וְנֵימַר חַיְיתָא בִּישְׁתָּא אַכְלָתֵיהּ וְנִחְמֵי מַה יְהִי פֶּשֶׁר חֶלְמוֹי", "pj_en": "And now come let us kill him and throw him into one of the pits and say that an evil beast hath devoured him; and we shall see what will be the interpretation of his dreams.", "tj": "", "tj_en": "", "rashi": "<b>ונראה מה יהיו חלמתיו.<\/b> אָמַר רַבִּי יִצְחָק מִקְרָא זֶה אוֹמֵר דָּרְשֵׁנִי, רוּחַ הַקֹּדֶשׁ אוֹמֶרֶת כֵּן, הֵם אוֹמְרִים נַהַרְגֵהוּ וְהַכָּתוּב מְסַיֵּם וְנִרְאֶה מַה יִּהְיוּ חֲלֹמֹתָיו – נִרְאֶה דְּבַר מִי יָקוּם אִם שֶׁלָּכֶם אוֹ שֶׁלִּי. וְאִ\"אֶ שֶׁיֹּאמְרוּ הֵם וְנִרְאֶה מַה יִּהְיוּ חֲלֹמֹתָיו, שֶׁמִּכֵּיוָן שֶׁיַּהַרְגוּהוּ בָּטְלוּ חֲלוֹמוֹתָיו:", "rashi_en": "ונראה מה יהיו חלמתיו AND WE SHALL SEE WHAT WILL BECOME OF HIS DREAMS — R. Isaac said, this verse calls for a homiletic explanation. The Holy Spirit said this latter part of the text. They say “let us slay him”, and Scripture (i.e. the Holy Spirit) breaks in upon their words concluding them by saying, “and we shall see what will become of his dreams”: we shall see whose words will be fulfilled — yours or mine. For it is impossible that they should have said, “and we shall see what will become of his dreams”, for as soon as they would kill him his dreams would be of no effect (Tanchuma Yashan 1:9:13). "}, {"ch": 37, "v": 21, "aliyah": 2, "heb": "וַיִּשְׁמַ֣ע רְאוּבֵ֔ן וַיַּצִּלֵ֖הוּ מִיָּדָ֑ם וַיֹּ֕אמֶר לֹ֥א נַכֶּ֖נּוּ נָֽפֶשׁ׃", "onk": "וּשְׁמַע רְאוּבֵן וְשֵׁזְבֵיהּ מִידֵיהוֹן וַאֲמַר לָא נִקְטְלִנֵּיהּ נְפָשׁ:", "onk_en": "Reuvein heard and rescued him from their hands. He said, Let us not kill him.", "pj": "וּשְׁמַע רְאוּבֵן וְשֵׁזְבֵיהּ מִן יְדֵיהוֹן וַאֲמַר לָא נַקְטְלִינֵהּ דְלָא נִתְחַיֵיב בְּאַדְמֵיהּ", "pj_en": "And Reuben heard, and delivered him from their hands, and said, We will not kill him nor become guilty of his blood.", "tj": "", "tj_en": "", "rashi": "<b>לא נכנו נפש.<\/b> מַכַּת נֶפֶשׁ, זוֹ הִיא מִיתָה:", "rashi_en": "לא נכנו נפש — supply the word מכת so that the meaning will be “Let us not smite him with a smiting of his life” — it means killing. "}, {"ch": 37, "v": 22, "aliyah": 2, "heb": "וַיֹּ֨אמֶר אֲלֵהֶ֣ם&thinsp;<small>׀<\/small>&thinsp;רְאוּבֵן֮ אַל־תִּשְׁפְּכוּ־דָם֒ הַשְׁלִ֣יכוּ אֹת֗וֹ אֶל־הַבּ֤וֹר הַזֶּה֙ אֲשֶׁ֣ר בַּמִּדְבָּ֔ר וְיָ֖ד אַל־תִּשְׁלְחוּ־ב֑וֹ לְמַ֗עַן הַצִּ֤יל אֹתוֹ֙ מִיָּדָ֔ם לַהֲשִׁיב֖וֹ אֶל־אָבִֽיו׃", "onk": "וַאֲמַר לְהוֹן רְאוּבֵן לָא תוֹשְׁדוּן דְּמָא רְמוֹ יָתֵיהּ לְגֻבָּא הָדֵין דִּי בְּמַדְבְּרָא וִידָא לָא תוֹשְׁטוּן בֵּיהּ בְּדִיל לְשֵׁיזָבָא יָתֵיהּ מִידֵיהוֹן לַאֲתָבוּתֵיהּ לְוַת אֲבוּהִי:", "onk_en": "Reuvein said to them, Do not commit bloodshed. Throw him into this pit which is in the wilderness, and do not lay a hand on him. His purpose was to rescue him from their hands, to bring him back to his father.", "pj": "וַאֲמַר לְהוֹם רְאוּבֵן לָא תֵשְׁדוּן אֲדַם זַכְּאַי טְלוּקוּ יָתֵיהּ לְגוּבָא הָדֵין דִבְמַדְבְּרָא וְיַד דִקְטוּלִין לָא תוֹשְׁטוּן בֵּיהּ בְּגִין לְשֵׁיזְבָא יָתֵיהּ מִידֵיהוֹן לַאֲתָבוּתֵיהּ לְוַת אָבוֹי", "pj_en": "And Reuben said, Let us not shed innocent blood. Throw him into this pit in the wilderness, but the hand of the slayer stretch not forth against him; because he would deliver him from their hand, and restore him to his father.", "tj": "", "tj_en": "", "rashi": "<b>למען הציל אתו.<\/b> רוּחַ הַקֹּדֶשׁ מְעִידָה עַל רְאוּבֵן שֶׁלֹּא אָמַר זֹאת אֶלָּא לְהַצִּיל אוֹתוֹ שֶׁיָּבֹא הוּא וְיַעֲלֶנּוּ מִשָּׁם, אָמַר אֲנִי בְכוֹר וְגָדוֹל שֶׁבְּכֻלָּן, לֹא יִתָּלֶה הַסֵּרָחוֹן אֶלָּא בִי:", "rashi_en": "למען הציל אתו THAT HE MIGHT DELIVER HIM [OUT OF THEIR HAND] — The Holy Spirit (Scripture) bears witness for Reuben that he said this only for the purpose of saving his brother — that he would come afterwards and draw him up from there. He thought, “I am the first-born and the chief among them, and blame will attach to no one but myself” (Genesis Rabbah 84:15). "}, {"ch": 37, "v": 23, "aliyah": 3, "heb": "וַיְהִ֕י כַּֽאֲשֶׁר־בָּ֥א יוֹסֵ֖ף אֶל־אֶחָ֑יו וַיַּפְשִׁ֤יטוּ אֶת־יוֹסֵף֙ אֶת־כֻּתׇּנְתּ֔וֹ אֶת־כְּתֹ֥נֶת הַפַּסִּ֖ים אֲשֶׁ֥ר עָלָֽיו׃", "onk": "וַהֲוָה כַּד עַל יוֹסֵף לְוַת אֲחוּהִי וְאַשְׁלָחוּ יָת יוֹסֵף יָת כִּתּוּנֵיהּ יָת כִּתּוּנָא דְפַסֵּי דִּי עֲלוֹהִי:", "onk_en": "When Yoseif came to his brothers, they stripped him of his coat, the long, colorful coat that he had on.", "pj": "וַהֲוָה כַּד אָתָא יוֹסֵף לְוַת אָחוֹהִי וְאַשְׁלָחוּ יַת יוֹסֵף יַת פַּרְגוּדֵיהּ יַת פַּרְגוֹד מְצַיָיר דִעֲלוֹי", "pj_en": "And when Joseph came to his brothers, they stripped him of his garment, the figured garment that was on him,", "tj": "", "tj_en": "", "rashi": "<b>את כתנתו.<\/b> זֶה חָלוּק:<br><br><b>את כתנת הפסים.<\/b> הוּא שֶׁהוֹסִיף לוֹ אָבִיו יוֹתֵר עַל אֶחָיו:", "rashi_en": "את כתנתו HIS GARMENT — this means his shirt.<br><br>את כתנת הפסים THE LONG SLEEVED GARMENT — this was the garment that his father had given him additional to those of his brothers (Genesis Rabbah 84:16). "}, {"ch": 37, "v": 24, "aliyah": 3, "heb": "וַיִּ֨קָּחֻ֔הוּ וַיַּשְׁלִ֥כוּ אֹת֖וֹ הַבֹּ֑רָה וְהַבּ֣וֹר רֵ֔ק אֵ֥ין בּ֖וֹ מָֽיִם׃", "onk": "וְנָסְבוּהִי וּרְמוֹ יָתֵיהּ לְגֻבָּא וְגֻבָּא רֵיקָא לֵית בֵּיהּ מַיָּא:", "onk_en": "They took him and threw him into the pit. The pit was empty; there was no water in it.", "pj": "וְנָסְבוּ יָתֵיהּ וְטַלְקוּ יָתֵיהּ לְגוּבָא וְגוּבָא סָרֵיק לֵית בֵּיהּ מוֹי בְּרַם חֵיוִין וְעַקְרַבִּין הֲווֹ בֵיהּ", "pj_en": "and took and threw him into the pit; but the pit was empty, no water was therein, but serpents and scorpions were in it.", "tj": "", "tj_en": "", "rashi": "<b>והבור רק אין בו מים.<\/b> מִמַּשְׁמַע שֶׁנֶּאֱמַר וְהַבּוֹר רֵק, אֵינִי יוֹדֵעַ שֶׁאֵין בּוֹ מַיִם, מַה תַּלְמוּד לוֹמַר אֵין בּוֹ מָיִם? מַיִם אֵין בּוֹ, אֲבָל נְחָשִׁים וְעַקְרַבִּים יֵשׁ בּוֹ (בראשית רבה, שבת כ\"ב):", "rashi_en": "והבור רק אין בו מים AND THE PIT WAS EMPTY, THERE WAS NO WATER IN IT — Since it states, “the pit was empty”, do I not know that “there was no water in it”? What then is the force of “there was no water in it”? Water, indeed it did not contain, but there were serpents and scorpions in it (Shabbat 22a). "}, {"ch": 37, "v": 25, "aliyah": 3, "heb": "וַיֵּשְׁבוּ֮ לֶֽאֱכׇל־לֶ֒חֶם֒ וַיִּשְׂא֤וּ עֵֽינֵיהֶם֙ וַיִּרְא֔וּ וְהִנֵּה֙ אֹרְחַ֣ת יִשְׁמְעֵאלִ֔ים בָּאָ֖ה מִגִּלְעָ֑ד וּגְמַלֵּיהֶ֣ם נֹֽשְׂאִ֗ים נְכֹאת֙ וּצְרִ֣י וָלֹ֔ט הוֹלְכִ֖ים לְהוֹרִ֥יד מִצְרָֽיְמָה׃", "onk": "<b>וְאַסְחָרוּ<\/b> לְמֵיכַל לַחְמָא וּזְקָפוּ עֵינֵיהוֹן וַחֲזוֹ וְהָא שְׁיָרַת <b>עֲרָבָאֵי<\/b> אָתְיָא מִגִּלְעָד וְגַמְלֵיהוֹן טְעִינִין שְׁעַף וּקְטַף וּלְטוֹם אָזְלִין לַאֲחָתָא לְמִצְרָיִם:", "onk_en": "They sat down [<b>reclined<\/b>] to eat bread. They raised their eyes and saw—behold a Yishmaelite [<b>Arabian<\/b>] caravan was coming from Gilod. Their camels were carrying spices, balsam and lotus, bringing them down to Egypt.", "pj": "וְחָזְרוּ לְמֵיכַל לַחֲמָא וּזְקָפוּ עֵינֵיהוֹן וַחֲמוֹן וְהָא סִיעָא דַעֲרָבָאִין אַתְיָא מִגִלְעָד וּגְמַלֵיהוֹן טְעוּנִין שַׁעֲוָה וּשְרַף קְטַף וּלְטוֹם מְטַיְילִין לַאֲחָתָא לְמִצְרָיִם", "pj_en": "And they sat around to eat bread. And they lifted up their eyes, and looked, and behold a band of Arabians were coming from Gilead with their camels, carrying wax, resin, balsam and stacte, proceeding to go into Mizraim.", "tj": "סִיעָה דִסְרָקָיִין:", "tj_en": "A band of Saracens", "rashi": "<b>ארחת.<\/b> כְּתַרְגּוּמוֹ שְׁיָרַת, עַל שֵׁם הוֹלְכֵי אֹרַח:<br><br><b>וגמליהם נשאים וגו'.<\/b> לָמָּה פִרְסֵם הַכָּתוּב אֶת מַשָּׂאָם? לְהוֹדִיעַ מַתַּן שְׂכָרָן שֶׁל צַדִּיקִים, שֶׁאֵין דַּרְכָּן שֶׁל עַרְבִיִּים לָשֵׂאת אֶלָּא נֵפְטְ וְעִטְרָן, שֶׁרֵיחָן רַע, וְלָזֶה נִזְדַּמְּנוּ בְשָׂמִים, שֶׁלֹּא יִזּוֹק מֵרֵיחַ רַע:<br><br><b>נכאת.<\/b> כָּל כִּנּוּסֵי בְשָׂמִים הַרְבֵּה קָרוּי נְכֹאת, וְכֵן וַיַּרְאֵם אֶת כָּל בֵּית נְכֹתֹה (מלכים ב כ') – מִרְקַחַת בְּשָׂמָיו. וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן שַׁעֲוָה:<br><br><b>צרי.<\/b> שָׂרָף הַנּוֹטֵף מֵעֲצֵי הַקְּטָף, וְהוּא נָטָף הַנִּמְנֶה עִם סַמָּנֵי הַקְּטֹרֶת:<br><br><b>ולט.<\/b> לוֹטִיתָא שְׁמוֹ בִלְשׁוֹן מִשְׁנָה. וְרַבּוֹתֵינוּ פֵּרְשׁוּהוּ שֹׁרֶשׁ עֵשֶׂב, וּשְׁמוֹ אשטרולוזיאה בְּמַסֶּכֶת נִדָּה:", "rashi_en": "ארחת means what the Targum says — A CARAVAN; this is called ארחת with reference to the travelers on the road (ארח) who compose it.<br><br>וגמליהם נשאים AND THEIR CAMELS WERE BEARING etc. — Why does Scripture specially announce what they were laden with? It is to tell you how great is the reward of the righteous: it is not usual for Arabs to carry anything but naphta and itran (tar) which are evil-smelling, but for this one (Joseph, the righteous) it was specially arranged that they should be carrying fragrant spices so that he should not suffer from a bad odour (Genesis Rabbah 84:17).<br><br>נכאת SPICERY — Every collection of many kinds of spices is called נכאת. So, too, (2 Kings 20:13) “and he showed them all the house of his נכתה which means the house where his spices were mixed. Onkelos translates it as meaning wax (perhaps an aromatic gum).<br><br>צרי AND BALM — a resin that exudes from the wood of the balsam-tree: it is the נטף that is enumerated among the ingredients of the incense used in the Tabernacle (Exodus 30:34; cf. Keritot 6a).<br><br>ולט AND LADANUM — This is called Lotos in the language of the Mishna. Our Rabbis have in treatise Niddah 8a explained that it is a vegetable root; it bears the name aristolochia (birthwort). "}, {"ch": 37, "v": 26, "aliyah": 3, "heb": "וַיֹּ֥אמֶר יְהוּדָ֖ה אֶל־אֶחָ֑יו מַה־בֶּ֗צַע כִּ֤י נַהֲרֹג֙ אֶת־אָחִ֔ינוּ וְכִסִּ֖ינוּ אֶת־דָּמֽוֹ׃", "onk": "וַאֲמַר יְהוּדָה לַאֲחוֹהִי <b>מָה מָמוֹן נִתְהֲנֵי<\/b> לָנָא אֲרֵי נִקְטוֹל יָת אָחוּנָא וּנְכַסֵּי עַל דְּמֵיהּ:", "onk_en": "Yehudah said to his brothers, What [<b>monetary benefit<\/b>] will we gain if we kill our brother and cover up his blood?", "pj": "וַאֲמַר יְהוּדָה לַאֲחוֹהִי מַה הַנְיַית מָמוֹן יְהִי לָן אֲרוּם נִקְטוֹל יַת אֲחוּנָא וּנְכַסֵי עַל דְמֵיהּ", "pj_en": "And Jehuda said to his brethren, What profit of mammon should we have if we killed our brother, and covered his blood?", "tj": "", "tj_en": "", "rashi": "<b>מה בצע.<\/b> מַה מָּמוֹן, כְּתַרְגּוּמוֹ:<br><br><b>וכסינו את דמו.<\/b> וְנַעֲלִים אֶת מִיתָתוֹ:", "rashi_en": "מה בצע means WHAT PROFIT— just as the Targum renders it.<br><br>וכסינו את דמו AND CONCEAL HIS BLOOD — this signifies and we hide the fact of his death (for they had not shed his blood, but had cast him into a pit to die). "}, {"ch": 37, "v": 27, "aliyah": 3, "heb": "לְכ֞וּ וְנִמְכְּרֶ֣נּוּ לַיִּשְׁמְעֵאלִ֗ים וְיָדֵ֙נוּ֙ אַל־תְּהִי־ב֔וֹ כִּֽי־אָחִ֥ינוּ בְשָׂרֵ֖נוּ ה֑וּא וַֽיִּשְׁמְע֖וּ אֶחָֽיו׃", "onk": "אֱתוּ וּנְזַבְּנִנֵּיהּ <b>לַעֲרָבָאֵי<\/b> וִידָנָא לָא תְהֵי בֵיהּ אֲרֵי אֲחוּנָא בִסְרָנָא הוּא <b>וְקַבִּילוּ מִנֵּיהּ<\/b> אֲחוֹהִי:", "onk_en": "Come let us sell him to the Yishmaelites [<b>Arabs<\/b>], and let our hands not be upon him; for he is our brother, our own flesh. His brothers listened [to him.] [<b>obeyed him<\/b>].", "pj": "אִיתוּי וּנְזַבְּנִינֵיהּ לַעֲרָבָאִין וִידָנָא לָא תְהִי בֵיהּ לְמִקְטְלֵיהּ אֲרוּם אָחוּנָא בִּשְרָנָא הוּא וְקַבִּילוּ אָחוֹי", "pj_en": "Come, let us sell him to the Arabians, and our hands shall not be upon him to kill him; for our brother is our own flesh. And his brethren agreed.", "tj": "", "tj_en": "", "rashi": "<b>וישמעו.<\/b> וְקַבִּילוּ מִנֵּהּ, וְכָל שְׁמִיעָה שֶׁהִיא קַבָּלַת דְּבָרִים כְּגוֹן זֶה, וּכְגוֹן וַיִּשְׁמַע יַעֲקֹב אֶל אָבִיו, נַעֲשֶׂה וְנִשְׁמָע – מְתֻרְגָּם נְקַבֵּל; וְכָל שֶׁהִיא שְׁמִיעַת הָאֹזֶן, כְּגוֹן וַיִּשְׁמְעוּ אֶת קוֹל ה' אֱלֹהִים מִתְהַלֵּךְ בַּגָּן, וְרִבְקָה שֹׁמַעַת, וַיִּשְׁמַע יִשְׂרָאֵל, שָׁמַעְתִּי אֶת תְּלוּנֹּת – כֻּלָּן מְתֻרְגָּם וּשְׁמָעוּ, וּשְׁמָעַת, וּשְׁמַע, שְׁמִיעַ קֳדָמַי:", "rashi_en": "וישמעו AND THEY HEARKENED — The Targum renders this by “and they accepted it from him” (i.e., they agreed with him). Wherever the verb שמע means agreeing with a person’s statement — obeying — as here, and as (28:7) “and Jacob had hearkened (וישמע) to his father”, and (Exodus 24:7) “We will do and we will obey (ונשמע)” it is translated in the Targum by קבל “accepting”, but wherever it merely means hearing with the ear, as e. g. (3:8) “And they heard (וישמעו) the voice of the Lord God walking in the garden”, and (27:5) “and Rebecca heard (שומעת;”, and (31:1) “And Israel heard (וישמע)”, and (Exodus 16:12) “I have heard (שמעתי) the murmurings of the children of Israel”, — all such cases are rendered by various forms of ושמעו: שמע “and they heard“, ושמעת “and she heard”, ושמע “and he heard”,שמיע ,קדמי “there is heard before Me” (I have heard). "}, {"ch": 37, "v": 28, "aliyah": 3, "heb": "וַיַּֽעַבְרוּ֩ אֲנָשִׁ֨ים מִדְיָנִ֜ים סֹֽחֲרִ֗ים וַֽיִּמְשְׁכוּ֙ וַיַּֽעֲל֤וּ אֶת־יוֹסֵף֙ מִן־הַבּ֔וֹר וַיִּמְכְּר֧וּ אֶת־יוֹסֵ֛ף לַיִּשְׁמְעֵאלִ֖ים בְּעֶשְׂרִ֣ים כָּ֑סֶף וַיָּבִ֥יאוּ אֶת־יוֹסֵ֖ף מִצְרָֽיְמָה׃", "onk": "וַעֲבָרוּ גַבְרֵי מִדְיָנָאֵי תַּגָּרֵי וּנְגִידוּ וְאַסִּיקוּ יָת יוֹסֵף מִן גֻּבָּא וְזַבִּינוּ יָת יוֹסֵף <b>לַעֲרָבָאֵי<\/b> בְּעֶסְרִין כְּסָף וְאַיְתִיוּ יָת יוֹסֵף לְמִצְרָיִם:", "onk_en": "Midianite merchants passed by. They [the brothers] pulled Yoseif up from the pit and sold Yoseif to the Yishmaelites [<b>Arabs<\/b>] for twenty pieces of silver. They brought Yoseif to Egypt.", "pj": "וְעָבָרוּ גַבְרֵי מִדְיָנָאֵי מָרֵי פְּרַקְמַטְיָא וּנְגִידוּ וְאַסִיקוּ יַת יוֹסֵף מִן גוּבָא וְזַבִּינוּ יַת יוֹסֵף לַעֲרָבָאִין בְּעֶשְרִין מָעִין דִכְסַף וְזַבְּנוּ מִנְהוֹן סַנְדְלִין וְאַיְיתִיוּ יַת יוֹסֵף לְמִצְרָיִם", "pj_en": "And the Midianite men, masters of business, passed by; and they drew and brought up Joseph out of the pit, and sold Joseph to the Arabians for twenty mahin of silver; and they bought sandals of them. And they brought Joseph to Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>ויעברו אנשים מדינים.<\/b> זוֹ הִיא שַׁיָּרָה אַחֶרֶת, וְהוֹדִיעֲךָ הַכָּתוּב שֶׁנִּמְכַּר פְּעָמִים הַרְבֵּה:<br><br><b>וימשכו.<\/b> בְנֵי יַעֲקֹב אֶת יוֹסֵף מִן הַבּוֹר וַיִּמְכְּרוּהוּ לַיִּשְׁמְעֵאלִים, וְיִשְׁמְעֵאלִים לַמִּדְיָנִים, וְהַמִּדְיָנִים לַמִּצְרִים:", "rashi_en": "ויעברו אנשים מדינים AND THERE PASSED BY MIDIANITES — This was another caravan: Scripture indicates that he was sold several times.<br><br> וימשכו AND THEY DREW UP — the sons of Jacob drew up את יוסף מן הבור JOSEPH FROM THE PIT, and they sold him to the Ishmaelites, and the Ishmaelites to the Midianites and the Midianites into Egypt (Midrash Tanchuma 1:9:13). "}, {"ch": 37, "v": 29, "aliyah": 3, "heb": "וַיָּ֤שׇׁב רְאוּבֵן֙ אֶל־הַבּ֔וֹר וְהִנֵּ֥ה אֵין־יוֹסֵ֖ף בַּבּ֑וֹר וַיִּקְרַ֖ע אֶת־בְּגָדָֽיו׃", "onk": "וְתָב רְאוּבֵן לְגֻבָּא וְהָא לֵית יוֹסֵף בְּגֻבָּא וּבְזַע יָת לְבוּשׁוֹהִי:", "onk_en": "Reuvein returned to the pit, but behold, Yoseif was not in the pit. He [then] tore his clothes [in grief.]", "pj": "וְתַב רְאוּבֵן לְגוֹבָא אֲרוּם לָא הֲוָה עִמְהוֹן לְמִסְעוֹד כַּד זַבְּנוֹהִי דַהֲוָה יָתֵיב בְּצוֹמָא עַל דְבַלְבֵּל מַצַע אָבוֹי וַאֲזַל וְיָתֵיב בֵּינֵי טַוְורַיָא לְמֶהֱדוֹר לְגוּבָא לְאַסְקוּתֵיהּ לְאָבוּי מָאִים יִסַב לֵיהּ אַפִּין וְכֵיוַון דְתָב וַחֲמָא וְהָא לֵית יוֹסֵף בְּגוֹבָא וּבְזַע יַת לְבוּשׁוֹי", "pj_en": "And Reuben returned to the pit; for he had not been with them to assist when they sold him, because he had sat fasting on account that he had confounded the couch of his father; and he had gone and sat among the hills, that he might return to the pit and bring him up for his father, if haply he might avert his anger. But when he had returned, and looked, and, behold, Joseph was not in the pit, he rent his clothes,", "tj": "", "tj_en": "", "rashi": "<b>וישב ראובן.<\/b> בִּמְכִירָתוֹ לֹא הָיָה שָׁם, שֶׁהִגִּיעַ יוֹמוֹ לֵילֵךְ וּלְשַׁמֵּשׁ אֶת אָבִיו. דָּ\"אַ עָסוּק הָיָה בְשַׂקּוֹ וּבְתַעֲנִיתוֹ עַל שֶׁבִּלְבֵּל יְצוּעֵי אָבִיו:", "rashi_en": "וישב ראובן AND REUBEN RETURNED — When he (Joseph) was sold he had not been present, for it was his day (his turn) to go to attend to his father (Genesis Rabbah 84:19). Another explanation is: he had not sat with them at the meal because he was occupied with his sack-cloth and fast in penitence for having disturbed his father’s couch (Genesis Rabbah 84:19). "}, {"ch": 37, "v": 30, "aliyah": 3, "heb": "וַיָּ֥שׇׁב אֶל־אֶחָ֖יו וַיֹּאמַ֑ר הַיֶּ֣לֶד אֵינֶ֔נּוּ וַאֲנִ֖י אָ֥נָה אֲנִי־בָֽא׃", "onk": "וְתָב לְוַת אֲחוֹהִי וַאֲמָר עוּלֵימָא לֵיתוֹהִי וַאֲנָא לְאָן אֲנָא אָתֵי:", "onk_en": "He returned to his brothers and said, The boy is not there; and I—where can I go.", "pj": "וְתַב לְוַת אָחוּי וַאֲמַר טַלְיָא לֵיתוֹהִי וַאֲנָא לְהָן אֲנָא אָתֵי וְהֵיכְדֵין נֶחֱמֵי סְבַר אַפּוֹי דְאַבָּא", "pj_en": "and returned to his brethren, and said, The youth is not; and I,whither shall I go, and how shall I see the look of my father's face?", "tj": "", "tj_en": "", "rashi": "<b>אנה אני בא.<\/b> אָנָה אֶבְרַח מִצַּעְרוֹ שֶׁל אַבָּא?", "rashi_en": "אנה אני בא WHITHER SHALL I GO? — Whither can I flee from my father’s grief? "}, {"ch": 37, "v": 31, "aliyah": 3, "heb": "וַיִּקְח֖וּ אֶת־כְּתֹ֣נֶת יוֹסֵ֑ף וַֽיִּשְׁחֲטוּ֙ שְׂעִ֣יר עִזִּ֔ים וַיִּטְבְּל֥וּ אֶת־הַכֻּתֹּ֖נֶת בַּדָּֽם׃", "onk": "וּנְסִיבוּ יָת כִּתּוּנָא דְיוֹסֵף וּנְכִיסוּ <b>צְפִיר בַּר<\/b> עִזֵּי וּטְבָלוּ יָת כִּתּוּנָא בִּדְמָא:", "onk_en": "They took Yoseif’s coat, slaughtered a [<b>male<\/b>] goat, and dipped the coat in the blood.", "pj": "וּנְסָבוּ יַת פַּרְגוֹדָא דְיוֹסֵף וּנְכָסוּ צְפִיר בַּר עִיזֵי אֲרוּם אַדְמֵיהּ דָמֵי לִדְגַבְרָא וּטְבָלוּ יַת פַּרְגוֹדָא בְּאַדְמָא", "pj_en": "But they took the garment of Joseph, and killed a kid of the goats, because his blood is like the blood of a man, and they dabbled the garment in the blood.", "tj": "", "tj_en": "", "rashi": "<b>שעיר עזים.<\/b> דָּמוֹ דּוֹמֶה לְשֶׁל אָדָם:<br><br><b>הכתנת.<\/b> זֶה שְׁמָהּ, וּכְשֶׁהִיא דְבוּקָה לְתֵבָה אַחֶרֶת, כְּגוֹן כְּתֹנֶת יוֹסֵף, כְּתֹנֶת פַּסִּים, כְּתֹנֶת בַּד, נָקוּד כְּתֹנֶת:", "rashi_en": "שעיר עזים A KID OF THE GOATS — its blood resembles that of a human being (Genesis Rabbah 84:19).<br><br>הַכֻּתֹּנֶת THE COAT — This is the form of the noun in the absolute state, but when it is in the construct state — as e.g., Joseph’s coat”, “the coat of many colours”, “the coat of linen”, — it is punctuated as כְּתֹנֶת. "}, {"ch": 37, "v": 32, "aliyah": 3, "heb": "וַֽיְשַׁלְּח֞וּ אֶת־כְּתֹ֣נֶת הַפַּסִּ֗ים וַיָּבִ֙יאוּ֙ אֶל־אֲבִיהֶ֔ם וַיֹּאמְר֖וּ זֹ֣את מָצָ֑אנוּ הַכֶּר־נָ֗א הַכְּתֹ֧נֶת בִּנְךָ֛ הִ֖וא אִם־לֹֽא׃", "onk": "וְשַׁלָּחוּ יָת כִּתּוּנָא דְפַסֵּי וְאַיְתִיוּ לְוַת אֲבוּהוֹן וַאֲמָרוּ דָּא אַשְׁכַּחְנָא אִשְׁתְּמוֹדַע <b>כְּעַן<\/b> הֲכִתּוּנָא דִבְרָךְ הִיא אִם לָא:", "onk_en": "They sent the long, colorful coat and brought it to their father, and said, We found this. Please [<b>Now<\/b>] identify it. Is it your son’s coat or not?", "pj": "וְשַׁדָרוּ בְּיַד בְּנֵי זִלְפָּה וּבְיַד בְּנֵי בִלְהָה יַת פַּרְגוֹד מְצַיָיר וְאַיְיתוֹהִי לְוַת אֲבוּהוֹן וְאָמָרוּ הָא אַשְׁכַּחֲנָא אִשְׁתְּמוֹדַע כְּדוּן הֲפַרְגוֹדָא דִבְרָךְ הִיא אִין לָא", "pj_en": "And they sent it by the hand of the sons of Zilpha and of the sons of Bilhah the figured garment; and they brought it to their father, and said, This have we found; know now, whether it be thy son's garment, or not.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 37, "v": 33, "aliyah": 3, "heb": "וַיַּכִּירָ֤הּ וַיֹּ֙אמֶר֙ כְּתֹ֣נֶת בְּנִ֔י חַיָּ֥ה רָעָ֖ה אֲכָלָ֑תְהוּ טָרֹ֥ף טֹרַ֖ף יוֹסֵֽף׃", "onk": "וְאִשְׁתְּמוֹדְעַהּ וַאֲמַר כִּתּוּנָא דִבְרִי חַיְתָא בִישְׁתָא אֲכָלַתֵּיהּ <b>מִקְטַל קְטִיל<\/b> יוֹסֵף:", "onk_en": "He recognized it and said, It is my son’s coat. An evil beast has devoured him. Yoseif has been torn to pieces [<b>surely killed<\/b>].", "pj": "וְאִשְתְּמוֹדְעָהּ וַאֲמַר פַּרְגוֹד דִבְרִי הִיא לָא חֵיוַת בָּרָא אֲכַלְתֵּיהּ וְלָא עַל יַד בְּנֵי נְשָׁא אִתְקְטֵיל אֶלָא חָמִי אֲנָא בְּרוּחַ קוּדְשָׁא דְאִיתָּא בִּישְׁתָּא קַיְימָא לְקִבְלֵיהּ", "pj_en": "And he recognised it and said, It is my son's garment: a beast of the wilderness hath not devoured him, neither hath he been slain by the hand of man; but I see by the Holy Spirit, that an evil woman standeth against him.", "tj": "וַחֲכַם יָתָהּ וַאֲמַר פַּרְגוֹד דִבְרִי הִיא לָא חֵיוַת בָּרָא אֲכָלַת יָתֵיהּ וְלָא מִתְקְטָל בְּרִי יוֹסֵף בְּרַם חָמֵי אֲנָא בְּרוּחַ בֵּית קוּדְשָׁא הֵיךְ אִיתָא בִּישָׁא קַיְימָא לְקִיבְלֵיהּ:", "tj_en": "And he discerned it and said, It is my son's garment: yet a wild beast hath not devoured him, neither is my son Joseph slain ; but I see by the Spirit of the sanctuary, that an evil woman standeth against him.", "rashi": "<b>ויאמר כתנת בני.<\/b> הִיא זוֹ:<br><br><b>חיה רעה אכלתהו.<\/b> נִצְנְצָה בוֹ רוּחַ הַקֹּדֶשׁ, סוֹפוֹ שֶׁתִּתְגָּרֶה בוֹ אֵשֶׁת פּוֹטִיפַר. וְלָמָּה לֹא גִלָּה לוֹ הַקָּבָּ\"ה? לְפִי שֶׁהֶחֱרִימוּ וְקִלְּלוּ אֶת כָּל מִי שֶׁיְּגַלֶּה, וְשִׁתְּפוּ לְהַקָּבָּ\"ה עִמָּהֶם (תנחומא), אֲבָל יִצְחָק הָיָה יוֹדֵעַ שֶׁהוּא חַי, אָמַר הֵיאַךְ אֲגַלֶּה וְהַקָּבָּ\"ה אֵינוֹ רוֹצֶה לְגַלּוֹת לוֹ:", "rashi_en": "ויאמר כתנת בני AND HE SAID, MY SON’S COAT —is this (i.e. supply the words היא זו after בני).<br><br>חיה רעה אכלתהו  AN EVIL BEAST HATH EATEN HIM — The spirit of prophecy was enkindled within him, for these words may be taken to mean that at some future time Potiphar’s wife would attack him (Genesis Rabbah 84:19). Why did not the Holy One, blessed be He, make known to him (Jacob) that he was still living? Because they had placed under a ban and a curse anyone of them who would make it known, and they made the Holy One, blessed be He, a party with them to this agreement (Midrash Tanchuma, Vayeshev 2) Isaac, however, knew that he was living, but he thought, “How dare I reveal it since the Holy One, blessed be He does not wish to reveal it” (Genesis Rabbah 84:21)."}, {"ch": 37, "v": 34, "aliyah": 3, "heb": "וַיִּקְרַ֤ע יַעֲקֹב֙ שִׂמְלֹתָ֔יו וַיָּ֥שֶׂם שַׂ֖ק בְּמׇתְנָ֑יו וַיִּתְאַבֵּ֥ל עַל־בְּנ֖וֹ יָמִ֥ים רַבִּֽים׃", "onk": "וּבְזַע יַעֲקֹב לְבוּשׁוֹהִי וַאֲסַר שַׂקָּא בְּחַרְצֵיהּ וְאִתְאַבַּל עַל בְּרֵיהּ יוֹמִין סַגִּיאִין:", "onk_en": "Yaakov tore his robes, and placed sackcloth on his loins. He mourned for his son for many days.", "pj": "וּבְזַע יַעֲקב לְבוּשׁוֹי וַאֲסַר שַקָא בְּחַרְצוֹי וְאִתְאַבֵּל עַל בְּרֵיהּ יוֹמִין סַגִיאִין", "pj_en": "And Jakob rent his clothes, and wrapped sackcloth on his loins, and mourned for his son many days.", "tj": "", "tj_en": "", "rashi": "<b>ימים רבים.<\/b> כ\"ב שָׁנָה, מִשֶּׁפֵּרֵשׁ מִמֶּנּוּ עַד שֶׁיָּרַד יַעֲקֹב לְמִצְרַיִם, שֶׁנֶּאֱמַר יוֹסֵף בֶּן שְׁבַע עֶשְׂרֵה שָׁנָה וְגוֹ', וּבֶן שְׁלֹשִׁים שָׁנָה הָיָה בְּעָמְדוֹ לִפְנֵי פַרְעֹה, וְשֶׁבַע שְׁנֵי הַשָּׂבָע, וּשְׁנָתַיִם הָרָעָב כְּשֶׁבָּא יַעֲקֹב לְמִצְרַיִם, הֲרֵי כ\"ב שָׁנָה, כְּנֶגֶד כ\"ב שָׁנָה שֶׁלֹּא קִיֵּם יַעֲקֹב כִּבּוּד אָב וָאֵם (מגילה ט\"ז) – כ' שָׁנָה שֶׁהָיָה בְּבֵית לָבָן, וּב' שָׁנָה בַדֶּרֶךְ בְּשׁוּבוֹ מִבֵּית לָבָן, שָׁנָה וָחֵצִי בְסֻכּוֹת וְשִׁשָּׁה חֳדָשִׁים בְּבֵית אֵל – וְזֶהוּ שֶׁאָמַר לְלָבָן זֶה לִּי עֶשְׂרִים שָׁנָה בְּבֵיתֶךָ, לִי הֵן, עָלַי, וְסוֹפִי לִלְקוֹת כְּנֶגְדָּן:", "rashi_en": "ימים רבים MANY DAYS — twenty-two years (Genesis Rabbah 84:20) — from the time he left him until Jacob went down to Egypt. For it is said, (v. 2) “Joseph was seventeen years old” (when all these events happened), and he was thirty years old when he stood before Pharaoh; seven years of plenty and two years of famine had passed by the time Jacob came to Egypt — making in all 22 years. These correspond to the 22 years during which Jacob had not practised the duty of honouring his parents (that is, the period during which he did not reside with them and attend to their needs) (Megillah 17a): viz., the twenty years he stayed in Laban’s house and the two years on the journey when he was returning from Laban’s house — one and a half year at Succoth and six months at Bethel. This is what he meant when he said to Laban (31:41) “These twenty years that I have been in thy house are לי” — they are for me — the responsibility for them lies upon me (לי being taken as עלי) and at sometimes I shall be punished for a period equal to them. "}, {"ch": 37, "v": 35, "aliyah": 3, "heb": "וַיָּקֻ֩מוּ֩ כׇל־בָּנָ֨יו וְכׇל־בְּנֹתָ֜יו לְנַחֲמ֗וֹ וַיְמָאֵן֙ לְהִתְנַחֵ֔ם וַיֹּ֕אמֶר כִּֽי־אֵרֵ֧ד אֶל־בְּנִ֛י אָבֵ֖ל שְׁאֹ֑לָה וַיֵּ֥בְךְּ אֹת֖וֹ אָבִֽיו׃", "onk": "וְקָמוּ כָל בְּנוֹהִי וְכָל בְּנָתֵיהּ לְנַחֲמוּתֵיהּ וְסָרֵיב <b>לְקַבָּלָא תַנְחוּמִין<\/b> וַאֲמַר אֲרֵי אֵחוֹת לְוַת (עַל) בְּרִי <b>כַּד<\/b> אֲבֵילָא לִשְׁאוֹל וּבְכָא יָתֵיהּ אֲבוּהִי:", "onk_en": "All his sons and all his daughters rose to console him, but he refused to be consoled [<b>accept consolation<\/b>]. He said, I will go down to the grave [<b>while I am still<\/b>] mourning for my son. His father wept for him.", "pj": "וְקָמוּ כָּל בְּנוֹי וְכָל נְשֵׁי בְנוֹי וַאֲזָלוּ לְמִנַחֲמָא לֵיהּ וְסָרִיב לְקַבָּלָא תַּנְחוּמִין וַאֲמַר אֲרוּם אֵיחוּת לְוַת בְּרִי כַּד אָבֵילְנָא לְבֵי קְבוּרְתָּא וּבְכָא יָתֵיהּ בְּרַם יִצְחָק אָבוֹי", "pj_en": "And all his sons and all the men of his house arose and went to console him; but he refused to receive consolation, and said, For I will go down to my son mourning to the house of the grave. And Izhak his father also wept for him.", "tj": "", "tj_en": "", "rashi": "<b>וכל בנתיו.<\/b> רַבִּי יְהוּדָה אוֹמֵר אֲחָיוֹת תְּאוֹמוֹת נוֹלְדוּ עִם כָּל שֵׁבֶט וָשֵׁבֶט וּנְשָׂאוּם, רַבִּי נְחֶמְיָה אוֹמֵר כְּנַעֲנִיּוֹת הָיוּ, אֶלָּא מַהוּ וְכָל בְּנֹתָיו? – כַּלּוֹתָיו, שֶׁאֵין אָדָם נִמְנָע מִלִּקְרֹא לַחֲתָנוֹ בְּנוֹ וּלְכַלָּתוֹ בִתּוֹ:<br><br><b>וימאן להתנחם.<\/b> אֵין אָדָם מְקַבֵּל תַּנְחוּמִין עַל הַחַי וְסָבוּר שֶׁמֵּת, שֶׁעַל הַמֵּת נִגְזְרָה גְזֵרָה שֶׁיִּשְׁתַּכַּח מִן הַלֵּב וְלֹא עַל הַחַי (בראשית רבה):<br><br><b>ארד אל בני.<\/b> כְּמוֹ עַל בְּנִי, וְהַרְבֵּה אֶל מְשַׁמְּשִׁין בִּלְשׁוֹן עַל, אֶל שָׁאוּל וְאֶל בֵּית הַדָּמִים (שמואל ב כ\"א), אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים וְאֶל מוֹת חָמִיהָ וְאִישָׁהּ (שמואל א ד'):<br><br><b>אבל שאלה.<\/b> כִּפְשׁוּטוֹ לְשׁוֹן קֶבֶר הוּא – בְּאֶבְלִי אֶקָּבֵר, וְלֹא אֶתְנַחֵם כָּל יָמַי. וּמִדְרָשׁוֹ, גֵּיהִנֹּם; סִימָן זֶה הָיָה מָסוּר בְּיָדִי מִפִּי הַגְּבוּרָה, אִם לֹא יָמוּת אֶחָד מִבָּנַי בְּחַיַּי, מֻבְטָח אֲנִי שֶׁאֵינִי רוֹאֶה גֵיהִנֹּם:<br><br><b>ויבך אתו אביו.<\/b> יִצְחָק, בּוֹכֶה הָיָה מִפְּנֵי צָרָתוֹ שֶׁל יַעֲקֹב אֲבָל לֹא הָיָה מִתְאַבֵּל, שֶׁהָיָה יוֹדֵעַ שֶׁהוּא חַי:", "rashi_en": "וכל בנתיו AND ALL HIS DAUGHTERS — R Judah said: a twin-sister was born with each of Jacob’s sons and they each took a step-sister to wife (It was these daughters who comforted Jacob) R. Nehemiah said: their wives were Canaanite women and not their step-sisters; what is meant then “by all his daughters”? His daughters-in-law, for a person does not hesitate to call his son-in-law his son and his daughter-in-law his daughter (Genesis Rabbah 84:21).<br><br>וימאן להתנחם BUT HE REFUSED TO COMFORT HIMSELF — A person does not accept consolation for one living whom he believes to be dead, for with regard to the dead it is decreed that he be forgotten from the heart, but it is not so decreed with regard to the living (Genesis Rabbah 84:20).<br><br>ארד אל בני I WILL GO DOWN TO MY SON — This has the same meaning as על בני, on account of my son. There are many examples where אל is used in the sense of על: (2 Samuel 4:21) “(אל) because of Saul (ואל) and because of his bloody house”; (1 Samuel 4:21) “(אל) because the ark of God was taken (ואל) and because of the death of her father-in-law and her husband”.<br><br>אבל שאלה MOURNING INTO THE GRAVE — According to the literal meaning שאל means “the grave” — whilst I am still in a state of mourning I shall be interred (i.e. even to the day of my burial I shall mourn) and I shall not be comforted all my life. The Midrash explains it to refer to Gehinnom. “This omen has been given me by God: if none of my sons die during my lifetime I may be assured that I shall not see Gehinnom” (Midrash Tanchuma, Vayigash 9).<br><br>ויגש). ויבך אתו אביו THUS HIS FATHER WEPT FOR HIM — His father refers to Isaac: he wept for Jacob’s trouble, but he did not mourn for he knew that he (Joseph) was alive (Genesis Rabbah 84:21). "}, {"ch": 37, "v": 36, "aliyah": 3, "heb": "וְהַ֨מְּדָנִ֔ים מָכְר֥וּ אֹת֖וֹ אֶל־מִצְרָ֑יִם לְפֽוֹטִיפַר֙ סְרִ֣יס פַּרְעֹ֔ה שַׂ֖ר הַטַּבָּחִֽים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמִדְיָנָאֵי זַבִּינוּ יָתֵיהּ לְמִצְרָיִם לְפוֹטִיפַר רַבָּא דְפַרְעֹה רַב קָטוֹלַיָּא:", "onk_en": "The Midianites sold him in Egypt to Potiphar, an officer of Pharaoh, the chief of the slaughterers.", "pj": "וּמִדְיָנָאֵי זַבִּינוּ יָתֵיהּ לְמִצְרַיִם לְפוֹטִיפַר רַבָּא דְפַרְעה רַב סַפּוֹקְלַטוֹרְיָא", "pj_en": "But the Midianites sold him in Mizraim to Potiphar a captain of Pharoh, a captain of the guards.", "tj": "לְפּוֹטִיפַר שַׁלִיטָא דְפַרְעה רַב סַפּוּקַלְטַרְיָא:", "tj_en": "To Potiphar an officer of Pharoh, a captain of the guards.", "rashi": "<b>הטבחים.<\/b> שׁוֹחֲטֵי בְּהֵמוֹת הַמֶּלֶךְ:", "rashi_en": "הטבחים— means the slaughterers of the kings animals."}, {"ch": 38, "v": 1, "aliyah": 4, "heb": "וַֽיְהִי֙ בָּעֵ֣ת הַהִ֔וא וַיֵּ֥רֶד יְהוּדָ֖ה מֵאֵ֣ת אֶחָ֑יו וַיֵּ֛ט עַד־אִ֥ישׁ עֲדֻלָּמִ֖י וּשְׁמ֥וֹ חִירָֽה׃", "onk": "וַהֲוָה בְּעִדָּנָא הַהִיא וּנְחַת יְהוּדָה מִלְּוַת אֲחוֹהִי וּסְטָא עַד גַּבְרָא עֲדֻלָּמָאָה וּשְׁמֵיהּ חִירָה:", "onk_en": "And it was at that time, that Yehudah descended from his brothers. He turned away [from them], until [he came to] a man, an Adullamite, whose name was Chirah.", "pj": "וַהֲוָה בְּעִידָנָא הַהוּא וּנְחַת יְהוּדָה מִנִכְסוֹי וְאִתְפְּרַשׁ מִן אָחוֹי וּסְטָא לְוַת גַבְרָא עֲדוּלְמָאָה וּשְׁמֵיהּ חִירָה", "pj_en": "It was at that time that Jehuda had gone down from his property, and separated himself from his brethren, and had inclined to a man an Adullemite whose name was Hira,", "tj": "", "tj_en": "", "rashi": "<b>ויהי בעת ההוא.<\/b> לָמָּה נִסְמְכָה פָרָשָׁה זוֹ לְכָאן, וְהִפְסִיק בְּפָרָשָׁתוֹ שֶׁל יוֹסֵף? לְלַמֵּד שֶׁהוֹרִידוּהוּ אֶחָיו מִגְּדֻלָּתוֹ כְּשֶׁרָאוּ בְצָרַת אֲבִיהֶם, אָמְרוּ: אַתָּה אָמַרְתָּ לְמָכְרוֹ, אִלּוּ אָמַרְתָּ לַהֲשִׁיבוֹ הָיִינוּ שׁוֹמְעִים לְךָ:<br><br><b>ויט.<\/b> מֵאֵת אֶחָיו:<br><br><b>עד איש עדלמי.<\/b> נִשְׁתַּתֵּף עִמּוֹ:", "rashi_en": "ויהי בעת ההוא AND IT CAME TO PASS AT THAT TIME — Why is this section placed here thus interrupting the section dealing with the history of Joseph? To teach that his brothers degraded him from his high position. When they saw their father’s grief they said, “You told us to sell him: if you had told us to send him back to his father we would also have obeyed you” (Genesis Rabbah 85:2).<br><br>ויט AND HE TURNED away from his brothers.<br><br>עד איש עדלמי UNTO A CERTAIN ADULLAMITE — he entered into a business-partnership with him."}, {"ch": 38, "v": 2, "aliyah": 4, "heb": "וַיַּרְא־שָׁ֧ם יְהוּדָ֛ה בַּת־אִ֥ישׁ כְּנַעֲנִ֖י וּשְׁמ֣וֹ שׁ֑וּעַ וַיִּקָּחֶ֖הָ וַיָּבֹ֥א אֵלֶֽיהָ׃", "onk": "וַחֲזָא תַמָּן יְהוּדָה בַּת גְּבַר <b>תַּגָּרָא<\/b> וּשְׁמֵיהּ שׁוּעַ וְנָסְבַהּ וְעַל לְוָתַהּ:", "onk_en": "There Yehudah saw the daughter of a Canaanite man [<b>merchant<\/b>] whose name was Shu’a. He took her and consummated a marriage with her.", "pj": "וַחֲמָא תַמָן יְהוּדָה בְּרַת גְבַר תַּגָר וּשְׁמֵיהּ שׁוּעַ וְגַיְירָהּ וְעַל לְוָתָהּ", "pj_en": "that Jehudah saw there the daughter of a merchant man whose name was Shuva, and he proselyted her, and entered with her.", "tj": "", "tj_en": "", "rashi": "<b>כנעני.<\/b> תַּגְרָא (בראשית רבה):", "rashi_en": "כנעני means A MERCHANT — (cf. Pesachim 50a and Zachariah 14:21). "}, {"ch": 38, "v": 3, "aliyah": 4, "heb": "וַתַּ֖הַר וַתֵּ֣לֶד בֵּ֑ן וַיִּקְרָ֥א אֶת־שְׁמ֖וֹ עֵֽר׃", "onk": "וְעַדִּיאַת וִילִידַת בָּר וּקְרָא יָת שְׁמֵיהּ עֵר:", "onk_en": "She conceived and gave birth to a son. He named him Er.", "pj": "וְאִתְעַבָּרַת וִילִדַת בַּר וּקְרַת יַת שְׁמֵיהּ עֵר אֲרוּם בְּלָא וְולַד עָתִיד לִמְמָת", "pj_en": "And she conceived and bare a son, and called his name Er, because he was to die without a child.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 4, "aliyah": 4, "heb": "וַתַּ֥הַר ע֖וֹד וַתֵּ֣לֶד בֵּ֑ן וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ אוֹנָֽן׃", "onk": "וְעַדִּיאַת עוֹד וִילִידַת בָּר וּקְרַת יָת שְׁמֵיהּ אוֹנָן:", "onk_en": "She conceived again and gave birth to a son. She named him Onan.", "pj": "וְאִתְעַבָּרַת תּוּב וִילֵידַת בַּר וּקְרַת יַת שְׁמֵיהּ אוֹנָן אֲרוּם בְּרַם עֲלוֹי עָתִיד אָבוֹי לְאִתְאַבְּלָא", "pj_en": "And she conceived again, and bare a son, and called his name Onan, because his father would have to mourn for him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 5, "aliyah": 4, "heb": "וַתֹּ֤סֶף עוֹד֙ וַתֵּ֣לֶד בֵּ֔ן וַתִּקְרָ֥א אֶת־שְׁמ֖וֹ שֵׁלָ֑ה וְהָיָ֥ה בִכְזִ֖יב בְּלִדְתָּ֥הּ אֹתֽוֹ׃", "onk": "וְאוֹסִיפַת עוֹד וִילִידַת בָּר וּקְרַת יָת שְׁמֵיהּ שֵׁלָה וַהֲוָה בִכְזִיב כַּד יְלִידַת יָתֵיהּ:", "onk_en": "She conceived once again and gave birth to a son. She named him Sheilah. He [Yehudah] was in Keziv when she gave birth to him.", "pj": "וְאוֹסִיפַת תּוּב וִילֵידַת בַּר וּקְרַת יַת שְׁמֵיהּ שֵׁלָה אֲרוּם שְׁלִי יָתָהּ בַּעֲלָהּ וַהֲוָה בְּפַסְקַתַ כַּד יְלֵידַת יָתֵיהּ", "pj_en": "And she added, and bare a son, and called his name Shela, because her husband had forgotten her and was in cessation when she bare him.", "tj": "וַהֲוָה דְפַסְקָא:", "tj_en": "And it was that she ceased.", "rashi": "<b>והיה בכזיב.<\/b> שֵׁם הַמָּקוֹם. וְאוֹמֵר אֲנִי עַל שֵׁם שֶׁפָּסְקָה מִלֶּדֶת נִקְרָא כְזִיב, לְשׁוֹן הָיוֹ תִהְיֶה לִי כְּמוֹ אַכְזָב (ירמיהו ט\"ו), אֲשֶׁר לֹא יְכַזְּבוּ מֵימָיו (ישעיהו נ\"ח), וְאִם לֹא כֵן מַה בָּא לְהוֹדִיעֵנוּ? וּבִבְ\"רַ רָאִיתִי, וַתִּקְרָא שְׁמוֹ שֵׁלָה וגוֹמֵר פְּסַקַת:", "rashi_en": "והיה בכזיב AND HE WAS AT CHEZIB — the name of a place. I am of opinion that it was called Chezib because there she ceased bearing. This meaning of the word occurs in (Jeremiah 15:18) “wilt thou indeed be unto me as an (אכזב) a deceiver (one who ceases to keep faith)”, and (Isaiah 58:11) “whose waters do not (יכזבו) fail (cease)\". For if this be not so (that it was called Chezib for the reason stated) what is it intended to tell us (what reason is there for telling us where he was at that time)? In Genesis Rabbah (Genesis Rabbah 55:4) I found the following ‘ותקרא את שמו שלה וגו AND SHE CALLED HIS NAME SHELAH [AND HE WAS AT CHEZIB] etc. — פסקת “ceasing”. "}, {"ch": 38, "v": 6, "aliyah": 4, "heb": "וַיִּקַּ֧ח יְהוּדָ֛ה אִשָּׁ֖ה לְעֵ֣ר בְּכוֹר֑וֹ וּשְׁמָ֖הּ תָּמָֽר׃", "onk": "וּנְסִיב יְהוּדָה אִתְּתָא לְעֵר בּוּכְרֵיהּ וּשְׁמַהּ תָּמָר:", "onk_en": "Yehudah took a wife for Er, his firstborn, and her name was Tamar.", "pj": "וּנְסִיב יְהוּדָה אִיתָּא לְעֵר בּוּכְרֵיהּ בְּרַת שֵׁם רַבָּא וּשְׁמָהּ תָּמָר", "pj_en": "And Jehuda took a wife for Er his firstborn, a daughter of Shem the great, whose name was Tamar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 7, "aliyah": 4, "heb": "וַיְהִ֗י עֵ֚ר בְּכ֣וֹר יְהוּדָ֔ה רַ֖ע בְּעֵינֵ֣י יְהֹוָ֑ה וַיְמִתֵ֖הוּ יְהֹוָֽה׃", "onk": "וַהֲוָה עֵר בּוּכְרָא דִיהוּדָה בִּישׁ <b>קֳדָם<\/b> יְיָ וַאֲמִיתֵיהּ יְיָ:", "onk_en": "Er, Yehudah’s firstborn was wicked in the eyes of [<b>before<\/b>] Adonoy, and Adonoy put him to death.", "pj": "וַהֲוָה עֵר בּוּכְרָא דִיהוּדָה בִּישׁ קֳדָם יְיָ עַל דְלָא הֲוָה יָהִיב זַרְעֵיהּ לְאִנְתְּתֵיהּ וּתְקֵיף רוּגְזָא דַיְיָ עֲלֵיהּ וְקַטְלֵיהּ יְיָ", "pj_en": "But Er the firstborn of Jehuda was evil before the Lord because he had not given his seed unto his wife, and the anger of the Lord prevailed against him, and the Lord slew him.", "tj": "", "tj_en": "", "rashi": "<b>רע בעיני ה'.<\/b> כְּרָעָתוֹ שֶׁל אוֹנָן, מַשְׁחִית זַרְעוֹ, שֶׁנֶּאֱמַר בְּאוֹנָן וַיָּמֶת גַּם אֹתוֹ, כְּמִיתָתוֹ שֶׁל עֵר מִיתָתוֹ שֶׁל אוֹנָן. וְלָמָּה הָיָה עֵר מַשְׁחִית זַרְעוֹ? כְּדֵי שֶׁלֹּא תִּתְעַבֵּר וְיַכְחִישׁ יָפְיָהּ:", "rashi_en": "רע בעיני ה'  WAS WICKED IN THE EYES OF THE LORD — like the wickedness of Onan, and committing the same sin. This must have been the case because of Onan it is said, (v. 10) “And the Lord slew him also — Onan’s death was for a similar reason as Er’s death. Why did Er commit this sin? So that she should not bear children and her beauty thereby become impaired (Yevamot 34b). "}, {"ch": 38, "v": 8, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהוּדָה֙ לְאוֹנָ֔ן בֹּ֛א אֶל־אֵ֥שֶׁת אָחִ֖יךָ וְיַבֵּ֣ם אֹתָ֑הּ וְהָקֵ֥ם זֶ֖רַע לְאָחִֽיךָ׃", "onk": "וַאֲמַר יְהוּדָה לְאוֹנָן עוּל לְוַת אִתַּת אָחוּךְ וְיַבֵּם יָתַהּ וַאֲקֵים זַרְעָא לְאָחוּךְ:", "onk_en": "Yehudah said to Onan, Consummate marriage with your brother’s wife, and fulfill the yibum rite with her, and establish seed for your brother.", "pj": "וַאֲמַר יְהוּדָה לְאוֹנָן עוֹל לְוַת אִתַּת אָחוּךְ וְיַיבֵּם יָתָהּ וַאֲקֵם זַרְעָא עַל שְׁמָא דְאָחוּךְ", "pj_en": "And Jehuda said unto Onan, Enter thou to thy brother's wife, and marry her, and raise up seed unto the name of thy brother.", "tj": "", "tj_en": "", "rashi": "<b>והקם זרע.<\/b> הַבֵּן יִקָּרֵא עַל שֵׁם הַמֵּת:", "rashi_en": "והקם זרע AND RAISE SEED — The son will be called by the name of him who is dead. "}, {"ch": 38, "v": 9, "aliyah": 4, "heb": "וַיֵּ֣דַע אוֹנָ֔ן כִּ֛י לֹּ֥א ל֖וֹ יִהְיֶ֣ה הַזָּ֑רַע וְהָיָ֞ה אִם־בָּ֨א אֶל־אֵ֤שֶׁת אָחִיו֙ וְשִׁחֵ֣ת אַ֔רְצָה לְבִלְתִּ֥י נְתׇן־זֶ֖רַע לְאָחִֽיו׃", "onk": "וִידַע אוֹנָן אֲרֵי לָא <b>עַל שְׁמֵיהּ מִתְקְרֵי<\/b> זַרְעָא וַהֲוָה כַּד עֲלִיל לְוַת אִתַּת אֲחוּהִי <b>וּמְחַבֵּל אָרְחֵיהּ<\/b> עַל אַרְעָא בְּדִיל דְּלָא <b>לְקַיָּמָא<\/b> זַרְעָא לַאֲחוּהִי:", "onk_en": "Onan knew that the descendants would not be his [<b>called by his name<\/b>]. Whenever he cohabited with his brother’s wife, he let it go to waste [<b>destroyed his way<\/b>] on the ground, in order not to give [<b>establish<\/b>] progeny to his brother.", "pj": "וִידַע אוֹנָן אֲרוּם לָא עַל שְׁמֵיהּ אִיקְרוֹן בְּנִין וַהֲוָה כַּד הֲוָה עָלֵיל לְוַת אִנְתְּתֵיהּ דְאָחוֹי הֲוָה מִחַבֵּל עוֹבְדוֹי עַל אַרְעָא דְלָא לְמִקְמָה בְּנִין עַל שְׁמֵיהּ דְאָחוֹי", "pj_en": "And Onan knew that they would not call the children after his name, and it was, when he entered to the wife of his brother, that he corrupted his work upon the earth, that he might not raise up children to his brother's name.", "tj": "", "tj_en": "", "rashi": "<b>ושחת ארצה.<\/b> דָּשׁ מִבִּפְנִים וְזוֹרֶה מִבַּחוּץ (בראשית רבה):", "rashi_en": "ושחת ארצה AND HE DESTROYED ONTO THE GROUND — He 'threshed inside and winnowed outside'  (Genesis Rabbah 85:5). "}, {"ch": 38, "v": 10, "aliyah": 4, "heb": "וַיֵּ֛רַע בְּעֵינֵ֥י יְהֹוָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה וַיָּ֖מֶת גַּם־אֹתֽוֹ׃", "onk": "וּבְאֵישׁ <b>קֳדָם<\/b> יְיָ דִּי עֲבָד וַאֲמִית אַף יָתֵיהּ:", "onk_en": "What he did was evil in the eyes of [<b>before<\/b>] Adonoy, and He also put him to death.", "pj": "וּבְאֵשׁ קֳדָם יְיָ מַה דְעָבַד וּקְטַע אוּף יַת יוֹמוֹי", "pj_en": "And what he did was evil before the Lord and he cut off his days also.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 11, "aliyah": 4, "heb": "וַיֹּ֣אמֶר יְהוּדָה֩ לְתָמָ֨ר כַּלָּת֜וֹ שְׁבִ֧י אַלְמָנָ֣ה בֵית־אָבִ֗יךְ עַד־יִגְדַּל֙ שֵׁלָ֣ה בְנִ֔י כִּ֣י אָמַ֔ר פֶּן־יָמ֥וּת גַּם־ה֖וּא כְּאֶחָ֑יו וַתֵּ֣לֶךְ תָּמָ֔ר וַתֵּ֖שֶׁב בֵּ֥ית אָבִֽיהָ׃", "onk": "וַאֲמַר יְהוּדָה לְתָמָר כַּלְּתֵיהּ תִּיבִי אַרְמְלָא בֵית אָבִיךְ עַד דִּרְבָא שֵׁלָה בְרִי אֲרֵי אֲמַר דִּלְמָא יְמוּת אַף הוּא כְּאָחֹהִי וַאֲזָלַת תָּמָר וִיתִיבַת בֵּית אָבוּהָא:", "onk_en": "Yehudah said to Tamar, his daughter-in-law, Live as a widow in your father’s house until my son Sheilah is of age. He said, Lest he also die like his brothers. Tamar went and lived in her father’s house.", "pj": "וַאֲמַר יְהוּדָה לְתָמָר כַּלְתֵיהּ תִיבִי אַרְמְלָא בֵּית אֲבוּיִיךְ עַד דְיִרְבֵּי שֵׁלָה בְּרִי אֲרוּם אָמַר דִלְמָא יְמוּת אַף הוּא כְּאָחוֹי וְאָזְלַת תָּמָר וִיתֵבַת בֵּית אָבוּהָא", "pj_en": "And Jehuda said to Tamar his daughter--in--law, Remain a widow in thy father's house, till Shela my son be grown up. For he said, Lest he also die as his brethren Tamar went and remained in her father's house.", "tj": "", "tj_en": "", "rashi": "<b>כי אמר וגו'.<\/b> כְּלוֹמַר, דּוֹחֶה הָיָה אוֹתָהּ בְּקַשׁ, שֶׁלֹּא הָיָה בְדַעְתּוֹ לְהַשִּׂיאָהּ לוֹ:<br><br><b>כי אמר פן ימות.<\/b> מֻחְזֶקֶת הִיא זוֹ שֶׁיָּמוּתוּ אֲנָשֶׁיהָ (כתובות מ\"ג):", "rashi_en": "‘כי אמר וגו FOR HE SAID etc. — that is to say, he pushed her off with a straw (i.e., he put her off with a lame excuse) because he never intended to give her to him in marriage<br><br>כי אמר פן ימות FOR HE SAID LEST PERADVENTURE HE DIE — She is a woman of whom it may be presumed that the men she marries will always die young (Genesis Rabbah 85:5). "}, {"ch": 38, "v": 12, "aliyah": 4, "heb": "וַיִּרְבּוּ֙ הַיָּמִ֔ים וַתָּ֖מׇת בַּת־שׁ֣וּעַ אֵֽשֶׁת־יְהוּדָ֑ה וַיִּנָּ֣חֶם יְהוּדָ֗ה וַיַּ֜עַל עַל־גֹּֽזְזֵ֤י צֹאנוֹ֙ ה֗וּא וְחִירָ֛ה רֵעֵ֥הוּ הָעֲדֻלָּמִ֖י תִּמְנָֽתָה׃", "onk": "וּסְגִיאוּ יוֹמַיָּא וּמִתַת בַּת שׁוּעַ אִתַּת יְהוּדָא וְאִתְנַחֵם יְהוּדָה וּסְלִיק עַל גּוֹזְזֵי עָנֵיהּ הוּא וְחִירָה רַחֲמֵיהּ עֲדֻלָּמָאָה לְתִמְנָת:", "onk_en": "Many days passed, and Shu’a’s daughter, the wife of Yehudah died. Yehudah sought consolation, and went up to his sheep-shearers—he and his friend, Chirah the Adullamite—to Timnah.", "pj": "וּסְגוֹ יוֹמַיָא וּמִיתַת בַּת שׁוּעַ אִיתַּת יְהוּדָה וְאִתְנְחֵם יְהוּדָה וּסְלֵיק עַל גוֹזְזֵי עָנֵיהּ הוּא וְחִירָה רַחֲמֵיהּ עֲדוּלְמָאָה לְתִמְנָת", "pj_en": "And days multiplied and the daughter of Shuva, Jehuda's wife, had died, and Jehuda was comforted. And Jehuda went up to the shearing of his flock, he and Hira his friend the Adullemite, to Timnath.", "tj": "", "tj_en": "", "rashi": "<b>ויעל על גוזזי צאנו.<\/b> וַיַּעַל תִּמְנָתָה לַעֲמֹד עַל גּוֹזְזֵי צֹאנוֹ:", "rashi_en": "ויעל על גזזי צאנו AND HE WENT UP UNTO HIS SHEEP-SHEARERS — it means: and he went up to Timnah to stand by his sheep-shearers. "}, {"ch": 38, "v": 13, "aliyah": 4, "heb": "וַיֻּגַּ֥ד לְתָמָ֖ר לֵאמֹ֑ר הִנֵּ֥ה חָמִ֛יךְ עֹלֶ֥ה תִמְנָ֖תָה לָגֹ֥ז צֹאנֽוֹ׃", "onk": "וְאִתְחַוָּא לְתָמָר לְמֵימָר הָא חֲמוּיִךְ סָלֵק לְתִמְנָת לְמֵיגַז עָנֵיהּ:", "onk_en": "Tamar was told, Behold your father-in-law has come to Timnah, to shear his sheep.", "pj": "וְאִיתְנֵי לְתָמָר לְמֵימָר הָא חֲמוּיִיךְ סַלִיק לְתִמְנָת לְמֵיגַז עָנֵיהּ", "pj_en": "And it was told to Tamar, saying, Behold, thy father--in--law cometh up to Timnath to shear his flock.", "tj": "", "tj_en": "", "rashi": "<b>עלה תמנתה.<\/b> וּבְשִׁמְשׁוֹן הוּא אוֹמֵר וַיֵּרֶד שִׁמְשׁוֹן תִּמְנָתָה (שופטים י\"ד)? בְּשִׁפּוּעַ הָהָר הָיְתָה יוֹשֶׁבֶת, עוֹלִין לָהּ מִכָּאן וְיוֹרְדִין לָהּ מִכָּאן:", "rashi_en": "עלה תמנתה HE GOETH UP TO TIMNAH — In the case of Samson it is said (Judges 14:1) “And Samson went down to Timnah”. But it lay on the slope of a mountain: from one direction one had to go up to it, from the other one went down to it (Sotah 10a). "}, {"ch": 38, "v": 14, "aliyah": 4, "heb": "וַתָּ֩סַר֩ בִּגְדֵ֨י אַלְמְנוּתָ֜הּ מֵֽעָלֶ֗יהָ וַתְּכַ֤ס בַּצָּעִיף֙ וַתִּתְעַלָּ֔ף וַתֵּ֙שֶׁב֙ בְּפֶ֣תַח עֵינַ֔יִם אֲשֶׁ֖ר עַל־דֶּ֣רֶךְ תִּמְנָ֑תָה כִּ֤י רָאֲתָה֙ כִּֽי־גָדַ֣ל שֵׁלָ֔ה וְהִ֕וא לֹֽא־נִתְּנָ֥ה ל֖וֹ לְאִשָּֽׁה׃", "onk": "וְאַעְדִּיאַת לְבוּשֵׁי אַרְמְלוּתַהּ מִנַּהּ וְאִתְכַּסִּיאַת בְּעֵיפָא <b>וְאִתַּקָּנַת<\/b> וִיתִיבַת בְּפָרָשׁוּת עַיְנִין דִּי עַל אֹרַח תִּמְנָת אֲרֵי חָזַת אֲרֵי רְבָא שֵׁלָה וְהִיא לָא אִתְיְהִיבַת לֵיהּ לְאִנְתּוּ:", "onk_en": "She took off her widow’s garb, covered herself with a veil, and disguised [<b>adorned<\/b>] herself. She sat at the crossroads which is on the road to Timnah, for she saw that Sheilah had come of age and she had not been given to him for a wife.", "pj": "וְאַעֲדַת לְבוּשֵׁי אַרְמְלוּתָהּ מִינָהּ וְכַסְיַית בִּרְדִידָא וְאַעַטְפַת וִיתֵיבַת בְפַרְשַׁת אָרְחִין דְכָל עַיְינִין מִסְתַּכְּלִין תַּמָן דְעַל שְׁבִילָא דְתִמְנַת אֲרוּם חָמַת אֲרוּם רַבָּא שֵׁלָה וְהִיא לָא אִתְיְהִיבַת לֵיהּ לְאִנְתּוּ", "pj_en": "And she put the dress of her widowhood from her, and covered herself with a veil, and wrapped herself, and sat in the dividing of the road where all eyes see, upon the way of Timnath. For she knew that Shela was grown up, yet she had not been given to him to be his wife.", "tj": "", "tj_en": "", "rashi": "<b>ותתעלף.<\/b> כִּסְּתָה פָנֶיהָ, שֶׁלֹּא יַכִּיר בָּהּ:<br><br><b>ותשב בפתח עינים.<\/b> בִּפְתִיחַת עֵינַיִם, בְּפָרָשַׁת דְּרָכִים שֶׁעַל דֶּרֶךְ תִּמְנָתָה. וְרַבּוֹתֵינוּ דָּרְשׁוּ בְּפִתְחוֹ שֶׁל אַבְרָהָם אָבִינוּ, שֶׁכָּל עֵינַיִם מְצַפּוֹת לִרְאוֹתוֹ (סוטה י'):<br><br><b>כי ראתה כי גדל שלה וגו'.<\/b> לְפִיכָךְ הִפְקִירָה עַצְמָהּ אֵצֶל יְהוּדָה, שֶׁהָיְתָה מִתְאַוָּה לְהַעֲמִיד מִמֶּנּוּ בָנִים:", "rashi_en": "ותתעלף AND SHE WRAPPED HERSELF — she veiled her face that he should not recognise her.<br><br>ותשב בפתח עינים AND SHE SAT AT THE ENTRANCE OF ENAYIM (literally, at the opening of the eyes) — at the place where the eyes become opened:) at the cross-road which is on the way leading to Timnah. Our Rabbis explain (Sotah 10b) that it means at the door (פתח) of our father Abraham’s residence to which all eyes עינים)) looked forward to pay a visit.<br><br>כי ראתה כי גדל שלה FOR SHE SAW THAT SHELAH WAS GROWN etc. — This was the reason why she offered herself to Judah, for she was anxious to have children from him (as an ancestor in some way or other) (Horayot 10b). "}, {"ch": 38, "v": 15, "aliyah": 4, "heb": "וַיִּרְאֶ֣הָ יְהוּדָ֔ה וַֽיַּחְשְׁבֶ֖הָ לְזוֹנָ֑ה כִּ֥י כִסְּתָ֖ה פָּנֶֽיהָ׃", "onk": "וַחֲזָאַהּ יְהוּדָה וְחַשְּׁבַהּ <b>כְּנָפְקַת בָּרָא<\/b> אֲרֵי כַסִּיאַת אַפָּהָא:", "onk_en": "Yehudah saw her and thought she was a harlot [<b>like one who goes outside<\/b>], because she had covered her face.", "pj": "וְחַמְיָהּ יְהוּדָה וַהֲוָה מְדַמָה בְּאַנְפּוֹי כְּנַפְקַת בָּרָא אֲרוּם כְּעִיסַת אַפּ
