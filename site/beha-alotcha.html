 saying, ‘Let the Lord, the God of the spirits of all flesh set a man [over the congregation]’”. He answered him, “Take thee [Joshua the son of Nun, etc.]”. Similar to this is: (Deuteronomy 3:23—26) “And I besought the Lord at that time, saying, [O Lord, God, thou hast begun to show thy servant thy greatness]’ , the Lord replied: “Let it suffice” (Sifrei Bamidbar 105). <br><br>רפא נא לה HEAL HER, I PRAY THEE — Why did Moses not pray at length? In order that Israel should not say: His sister is in trouble, and he stands and offers long prayers! (Sifrei Bamidbar 105). — [Another explanation is: He did not pray at length so that Israel should not say: On behalf of his sister he prays long, but on our behalf he would offer no long prayer]."}, {"ch": 12, "v": 14, "aliyah": 7, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה וְאָבִ֙יהָ֙ יָרֹ֤ק יָרַק֙ בְּפָנֶ֔יהָ הֲלֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִח֣וּץ לַֽמַּחֲנֶ֔ה וְאַחַ֖ר תֵּאָסֵֽף׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה וְאִלּוּ אָבוּהַהּ <b>מִנְזַף נְזִיף<\/b> בַּהּ הֲלָא תִתְכְּלֵם שַׁבְעָא יוֹמִין תִּסְתְּגַר שַׁבְעָא יוֹמִין מִבָּרָא לְמַשְׁרִיתָא וּבָתַר כֵּן תִּתְכְּנֵשׁ:", "onk_en": "Adonoy said to Moshe: “If her father were to spit in her face [<b>strongly chastise her<\/b>] would she not be in shame for seven days? She shall be closed off for seven days, beyond the encampment, and after that, she may join again.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה וְאָבִיהָ אִילוּ מַנְזִיף נְזַף בְּאַנְפָּהּ הֲלָא הֲוָה מִכְסְפָה וּמִיטַרְדָא שִׁבְעָתֵי יוֹמִין וּכְדֵין דְנַזְפָה בָּהּ מִן דִינָא דְתִכְסוֹף אַרְבֵּיסַר יוֹמִין אֱלָהֵן מִסְתְּיָה דְתִטְרַד שִׁבְעָתֵי יוֹמִין מִבָּרָא לְמַשְׁרִיתָא וַאֲנָא מְעַכֵּב בְּגִין זְכוּתָךְ עֲנָנֵי יְקָרִי וּמַשְׁכְּנָא וַאֲרוֹנָא וְכָל יִשְרָאֵל עַד זְמַן דְתִיתְּסֵי וּמִבָּתַר כְּדֵין תִּתְכְּנַשׁ", "pj_en": "And the Lord said to Mosheh, If her father had corrected her, would she not have been disgraced, and secluded seven days? But today, when I correct her, much more right is it that she should be dishonoured fourteen days: yet shall it suffice to seclude her seven days without the camp; and for thy righteousness will I make the Cloud of My Glory, the tabernacle, the ark, and all Israel, tarry until the time that she is healed, and then re-admitted.", "tj": "", "tj_en": "", "rashi": "<b>ואביה ירק ירק בפניה.<\/b> וְאִם אָבִיהָ הֶרְאָה לָהּ פָּנִים זוֹעֲפוֹת, <b>הלא תכלם שבעת ימים<\/b>? קַ\"וָ לִשְׁכִינָה י\"ד יוֹם, אֶלָּא דַּיּוֹ לַבָּא מִן הַדִּין לִהְיוֹת כַּנִּדּוֹן, לְפִיכָךְ אַף בִּנְזִיפָתִי <b>תסגר שבעת ימים<\/b> (שם; בבא קמא כ\"ה):<br><br><b>ואחר תאסף.<\/b> אוֹמֵר אֲנִי, כָּל הָאֲסִיפוֹת הָאֲמוּרוֹת בִּמְצֹרָעִים עַל שֵׁם שֶׁהוּא מְשֻׁלָּח מִחוּץ לַמַּחֲנֶה, וּכְשֶׁהוּא נִרְפָּא נֶאֱסָף אֶל הַמַּחֲנֶה, לְכָךְ כָּתוּב בּוֹ אֲסִיפָה, לְשׁוֹן הַכְנָסָה:", "rashi_en": "ואביה ירק ירק בפניה IF HER FATHER HAD BUT SPIT IN HER FACE — i.e. if he had shown her an angry face (if he was offended with her), הלא תכלם שבעת ימים SHOULD SHE NOT BE PUT TO SHAME FOR SEVEN DAYS? — It follows therefore à fortiori with respect to the Shechinah (i.e. in the case where God rebukes her in such a stern way) that she ought to be put to shame for fourteen days!) But since there is a rule דין לבא מן הדין להיות כנדון “It is sufficient for a law that is derived by a conclusion a fortiori (הבא מן הדין) to be only as strict as the law from which it is derived (נדון), and not go beyond it, therefore even as a consequence of My reprimand, תסגר שבעת ימים LET HER BE SHUT OUT [FROM THE CAMP] SEVEN DAYS only (Sifrei Bamidbar 106; Bava Kamma 25a).<br><br>ואחר תאסף AND AFTER THAT LET HE BE GATHERED IN AGAIN — I say that all the different forms of the root אסף which are employed in reference to lepers (cf. e. g. 2 Kings 5:6, 11) are used because he (the leper) is sent forth from the camp and when he becomes healed he is taken again into the camp; — on this account it uses of him the term אסיפה, which has the meaning of “taking in” something that was outside."}, {"ch": 12, "v": 15, "aliyah": 7, "heb": "וַתִּסָּגֵ֥ר מִרְיָ֛ם מִח֥וּץ לַֽמַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים וְהָעָם֙ לֹ֣א נָסַ֔ע עַד־הֵאָסֵ֖ף מִרְיָֽם׃", "onk": "וְאִסְתְּגָרַת מִרְיָם מִבָּרָא לְמַשְׁרִיתָא שַׁבְעָא יוֹמִין וְעַמָּא לָא נְטַל עַד דְּאִתְכְּנֵשַׁת מִרְיָם:", "onk_en": "Miriam was closed off beyond the encampment for seven days, and the people did not depart until Miriam was brought in to join them.", "pj": "וְאִיטְרְדַת מִרְיָם מִבָּרָא לְמַשְׁרִיתָא שִׁבְעָתֵי יוֹמִין וְעַמָא לָא נָטַל עַד זְמַן דְאִתַּסְיַת מִרְיָם", "pj_en": "And Miriam was kept apart without the camp for seven days, and the people went not forward until the time that Miriam was healed.", "tj": "", "tj_en": "", "rashi": "<b>והעם לא נסע.<\/b> זֶה הַכָּבוֹד חָלַק לָהּ הַמָּקוֹם בִּשְׁבִיל שָׁעָה אַחַת שֶׁנִּתְעַכְּבָה לְמֹשֶׁה כְּשֶׁהֻשְׁלַךְ לַיְאוֹר, שֶׁנֶּאֱמַר (שמות ב') \"וַתֵּתַצַּב אֲחֹתוֹ מֵרָחֹק\" וְגוֹ' (סוטה ט'):", "rashi_en": "והעם לא נסע AND THE PEOPLE JOURNEYED NOT [TILL MIRIAM WAS BROUGHT IN] — This honour the Omnipresent showed her as a reward for the single hour she tarried for Moses’ sake when he was thrown into the river, as it is said, (Exodus 2:4) “And his sister placed herself afar off (i. e. she waited) [to know what would be done to him]” (Sotah 9b)."}, {"ch": 12, "v": 16, "aliyah": 7, "heb": "וְאַחַ֛ר נָסְע֥וּ הָעָ֖ם מֵחֲצֵר֑וֹת וַֽיַּחֲנ֖וּ בְּמִדְבַּ֥ר פָּארָֽן׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּבָתַר כֵּן נְטָלוּ עַמָּא מֵחֲצֵרוֹת וּשְׁרוֹ בְּמַדְבְּרָא דְפָארָן:", "onk_en": "After that, the people traveled from Chatzeiros and they camped in the desert of Paran.", "pj": "אַף עַל גַב דְאִתְחַיָיבַת מִרְיָם נְבִיאֲתָא לְמִלְקֵי בְּצוֹרְעָא בְּעַלְמָא הָדֵין אוּלְפַן סַגִי אִית לְהוּ לְעַלְמָא דְאָתֵי לְצַדִיקַיָא וּלְנַטְרֵי פִּקוּדֵי אוֹרַיְיתָא לְפוּם דְאִתְיְעָדַת מִרְיָם נְבִיאֲתָא שָׁעָא זְעֵירָא לְמִידוֹעַ מָה הֲוָה בְסֵיפֵיהּ דְמשֶׁה בְּהַהוּא זְכוּתָא הֲווֹן כָּל יִשְרָאֵל אַשִׁתִּין רִבְוָון דְהִינוּן סְכוֹם תְּמַנְיָן לִגְיוֹנִין וַעֲנָנֵי יְקָרָא וּמַשְׁכְּנָא וּבֵירָא לָא זַיְיעִין וְלָא נַטְלִין עַד זְמַן דְאִיתְסִיאַת מִרְיָם נְבִיאֲתָא וּמִן בָּתַר כְּדֵין נְטָלוּ עַמָא מֵחֲצֵרוֹת וּשְׁרוֹן בְּמַדְבְּרָא דְפָארָן", "pj_en": "But though Miriam the prophetess had made herself liable to be stricken with leprosy in this world, the doctrine is ample that in the world to come (there remaineth a reward) for the just, and for them who keep the commandments of the law. And because Miriam the prophetess had watched for a little hour to know what would be the fate of Mosheh; (Exod. ii) for the sake of that merit all Israel, numbering sixty myriads, being eighty legions, and the Cloud of Glory, the tabernacle, and the well, went not, nor proceeded, till the time that she was healed: and afterward the people journeyed from Hatseroth, and encamped in the wilderness of Pharan.", "tj": "אַף עַל גַב דְאִתְחַיָיבַת מִרְיָם נְבִיאֲתָא לְמִצְטַרְעָא אִית בָּן אוּלְפַן סַגִי בְּפִיקוּדַיָא וְלִנְטוּרֵי מִצְוָותָא מִצְוָה זְעֵירָא דַעֲבִיד אֱנָשׁ מְקַבֵּל עֲלָהּ אֲגַר סַגִי וְכֵיוַן דְקָמַת מִרְיָם נְבִיאֲתָא עַל גַף נַהֲרָא בְּשָׁעָא זְעֵירָא לְמִידַע מַה הֲוֵי בְּסוֹפָא דְמשֶׁה הֲוַן בְּנֵי יִשְרָאֵל שִׁתִּין רִבְוָון דְהִינוּן סְכוֹם תְּמַנְיָא לִגְיוֹנִין וַעֲנָנֵי יְקָרָא וּבֵירָא לָא זָעוּ וְלָא נְטָלוּ מִן אַתְרֵיהוֹן עַד זְמַן דְאִתְּסִיאַת מִרְיָם נְבִיאֲתָא מְצָרַעְתָּהּ וּמִן בָּתַר דְאִתָּסִיאַת מִרְיָם נְבִיאֲתָא מִצָרַעְתָּהּ בָּתַר כֵּן נְטָלוּ עַמָא מֵחֲצֵרוֹת וּשְׁרוֹן בְּמַדְבְּרָא דְפָארָן:", "tj_en": "But though Miriam the prophetess had become liable to leprosy, we have ample doctrine that by keeping the commandments and precepts a man who doeth even a little shall receive a great reward. Thus, because Miriam the prophetess had stood on the river bank for a little hour, to know what would be the end of Mosheh, the sons of Israel, being sixty myriads, and eighty legions in number, and the Cloud of Glory and the well, now moved not, nor went forward from their place, till the time that she was healed of her leprosy; but after she was healed the people journeyed from Hatseroth, and encamped in the wilderness of Pharan.", "rashi": "", "rashi_en": ""}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
