 to the land of Mizraim. And Mosheh took the rod which he had brought away from the chamber of his father-in-law; and it was from the sapphire Throne of glory, in weight forty sein; and upon it was engraven and set forth the Great and Glorious Name by which the signs should be wrought before the Lord by his hand.", "tj": "", "tj_en": "", "rashi": "<b>על החמר.<\/b> חֲמוֹר הַמְיֻחָד, הוּא הַחֲמוֹר שֶׁחָבַשׁ אַבְרָהָם לַעֲקֵדַת יִצְחָק, וְהוּא שֶׁעָתִיד מֶלֶךְ הַמָּשִׁיחַ לְהִגָּלוֹת עָלָיו, שֶׁנֶּאֱמַר \"עָנִי וְרֹכֵב עַל חֲמוֹר\" (זכריה ט') (פרקי דרבי אליעזר ל\"א):<br><br><b>וישב ארצה מצרים, ויקח משה את מטה.<\/b> אֵין מֻקְדָּם וּמְאֻחָר מְדֻקְדָּקִים בַּמִּקְרָא:", "rashi_en": "על החמור UPON “THE” ASS — the ass designated for this purpose: this was the ass which Abraham had saddled for the purpose of travelling to bind Isaac on Mount Moriah, and this, too, is the ass upon which King Messiah will once show himself in public, as it is said, (Zechariah 9:9) “[Behold, thy king cometh unto thee, …] lowly and riding upon an ass” (Pirkei DeRabbi Eliezer 31).<br><br>וישב ארצה מצרים ויקח משה את מטה AND HE RETURNED TO THE LAND OF EGYPT: AND MOSES TOOK THE STAFF [OF GOD] — “Earlier and later” are not strictly observed in the Scriptures (i. e. incidents are not necessarily related in the exact order in which they occur. Here it should state: He took the staff etc. and returned to Egypt; cf. v. 17)."}, {"ch": 4, "v": 21, "aliyah": 6, "heb": "וַיֹּ֣אמֶר יְהֹוָה֮ אֶל־מֹשֶׁה֒ בְּלֶכְתְּךָ֙ לָשׁ֣וּב מִצְרַ֔יְמָה רְאֵ֗ה כׇּל־הַמֹּֽפְתִים֙ אֲשֶׁר־שַׂ֣מְתִּי בְיָדֶ֔ךָ וַעֲשִׂיתָ֖ם לִפְנֵ֣י פַרְעֹ֑ה וַאֲנִי֙ אֲחַזֵּ֣ק אֶת־לִבּ֔וֹ וְלֹ֥א יְשַׁלַּ֖ח אֶת־הָעָֽם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה בִּמְהָכָךְ לְמִתּוּב לְמִצְרַיִם חֲזֵי כָּל מוֹפְתַיָא דִי שַׁוֵיתִי בִידָךְ וְתַעְבְּדִנוּן קֳדָם פַּרְעֹה וַאֲנָא אַתְקֵיף יָת לִבֵּהּ וְלָא יְשַּׁלַח יָת עַמָא:", "onk_en": "Adonoy said to Moshe, “On your way back to Egypt, see [keep in mind] all the wondrous [signs] that I have placed in your hand, and do them before Pharaoh. I will harden his heart, and he will not send the people out.", "pj": "וַאֲמַר יְיָ לְמשֶׁה בִּמְהָכָךְ לְמֵיתוּב לְמִצְרַיִם חֲמִי כָּל תִּמְהַיָא דְשַׁוִיתִי בִידָךְ וְתַעֲבִידִינוּן קֳדָם פַּרְעה וַאֲנָא אַתְקֵיף יַת יִצְרָא דְלִבֵּיהּ וְלָא יִפְטוֹר יַת עַמָא", "pj_en": "And the Lord said to Mosheh, In going to return into Mizraim, consider all the miracles that I have put in thy hand, and do them before Pharoh: and I will make obstinate the disposition (passion) of his heart, and he will not deliver the people.", "tj": "", "tj_en": "", "rashi": "<b>בלכתך לשוב מצרימה וגו'.<\/b> דַּע שֶׁעַל מְנָת כֵּן תֵּלֵךְ שֶׁתְּהֵא גִּבּוֹר בִּשְׁלִיחוּתִי לַעֲשׂוֹת כָּל מוֹפְתַי לִפְנֵי פַרְעֹה וְלֹא תִירָא מִמֶּנּוּ:<br><br><b>אשר שמתי בידך.<\/b> לֹא עַל שָׁלוֹשׁ אוֹתוֹת הָאֲמוּרוֹת לְמַעְלָה, שֶׁהֲרֵי לֹא לִפְנֵי פַרְעֹה צִוָּה לַעֲשׂוֹתָם אֶלָּא לִפְנֵי יִשְׂרָאֵל שֶׁיַּאֲמִינוּ לוֹ, וְלֹא מָצִינוּ שֶׁעֲשָׂאָם לְפָנָיו, אֶלָּא מוֹפְתִים שֶׁאֲנִי עָתִיד לָשׂוּם בְּיָדְךָ בְּמִצְרַיִם, כְּמוֹ \"כִּי יְדַבֵּר אֲלֵיכֶם פַּרְעֹה וְגוֹ'\" (שמות ז'); וְאַל תִתְמַהּ עַל אֲשֶׁר כְּתִיב \"אֲשֶׁר שַׂמְתִּי\", שֶׁכֵּן מַשְׁמָעוֹ, כְּשֶׁתְּדַבֵּר עִמּוֹ כְּבָר שַׂמְתִּים בְּיָדְךָ:", "rashi_en": "בלכתך לשוב מצרימה וגו׳ WHEN THOU GOEST TO RETURN TO EGYPT, [SEE THAT THOU DO etc.] — Understand that you should go thither with this purpose in mind: that you should be vigorous in carrying out my mission — to do all my wonders before Pharaoh and that you should not be afraid of him.<br><br>אשר שמתי בידך [THE WONDERS] WHICH I HAVE PUT IN THY HAND — Not in reference to the three signs mentioned above was God speaking, for he had not commanded him to do these before Pharaoh, but before Israel in order that they might believe in him, nor do we find that he did them before him. But God meant: those wonders which I shall in future place in thy hand in Egypt — such as (Exodus 7:9) “When Pharaoh shall speak unto you, [saying, show a wonder (מופת) for yourselves]”. Do not be puzzled because it is written אשר שמתי (a past tense), for the following is what it means: when you will be speaking with him I shall already have put them into thy hand."}, {"ch": 4, "v": 22, "aliyah": 6, "heb": "וְאָמַרְתָּ֖ אֶל־פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהֹוָ֔ה בְּנִ֥י בְכֹרִ֖י יִשְׂרָאֵֽל׃", "onk": "וְתֵימַר לְוָת פַּרְעֹה כִּדְנַן אֲמַר יְיָ בְּרִי בוּכְרִי יִשְׂרָאֵל:", "onk_en": "You will say to Pharaoh, This is what Adonoy said, Yisroel is My son, My firstborn.", "pj": "וְתֵימַר לְפַרְעה כִּדְנָא אָמַר יְיָ בְּרִי בּוּכְרִי יִשְרָאֵל", "pj_en": "And thou shalt say to Pharoh, Thus saith the Lord, Israel is My first-born son;", "tj": "", "tj_en": "", "rashi": "<b>ואמרת אל פרעה.<\/b> כְּשֶׁתִּשְׁמַע שֶׁלִּבּוֹ חָזָק וִימָאֵן לִשְׁלֹחַ אֱמֹר לוֹ כֵּן:<br><br><b>בני בכרי.<\/b> לְשׁוֹן גְּדֻלָּה; כְּמוֹ: \"אַף אֲנִי בְּכוֹר אֶתְּנֵהוּ\" (תהלים פ\"ט), זֶהוּ פְּשׁוּטוֹ. וּמִדְרָשׁוֹ: כָּאן חָתַם הַקָּבָּ\"ה עַל מְכִירַת הַבְּכוֹרָה שֶׁלָּקַח יַעֲקֹב מֵעֵשָׂו (בראשית רבה ס\"ג):", "rashi_en": "ואמרת אל פרעה AND THOU SHALT SAY UNTO PHARAOH — When you perceive that his heart is stubborn and that he refuses to let them go speak to him thus:<br><br>בני בכרי [ISRAEL IS] MY SON, MY FIRSTBORN — The term בכור “firstborn” denotes high dignity as, (Psalms 89:28) “I also will appoint him a בכור” (which is explained by the following words, “the highest of the kings of the earth”). This is the literal meaning; a Midrashic comment is: Here (in these words) the Holy One, blessed be He, set His seal to the sale of the birthright which Jacob had purchased from Esau (Genesis Rabbah 63:14)."}, {"ch": 4, "v": 23, "aliyah": 6, "heb": "וָאֹמַ֣ר אֵלֶ֗יךָ שַׁלַּ֤ח אֶת־בְּנִי֙ וְיַֽעַבְדֵ֔נִי וַתְּמָאֵ֖ן לְשַׁלְּח֑וֹ הִנֵּה֙ אָנֹכִ֣י הֹרֵ֔ג אֶת־בִּנְךָ֖ בְּכֹרֶֽךָ׃", "onk": "וַאֲמָרִית לָךְ שַׁלַח יָת בְּרִי וְיִפְלַח <b>קֳדָמַי<\/b> וְאִם סָרִיב אַתְּ לְשַׁלָחוּתֵהּ הָא אֲנָא קָטִיל יָת בְּרָךְ בּוּכְרָךְ:", "onk_en": "And I have said to you, send out My son and let him serve [<b>before<\/b>] Me. If you refuse to send him, behold, I will slay your [own] firstborn son.”", "pj": "וַאֲמָרִית לָךְ פְּטוֹר יַת בְּרִי וְיִפְלַח קֳדָמַי וּמְסָרֵב אַנְתְּ לְמִפְטְרֵיהּ הָא אֲנָא קָטֵיל יַת בְּרָךְ בּוּכְרָךְ", "pj_en": "and to thee I say, Let My son go free, that he may worship before Me; and if thou refuse to let him go, behold, I will slay thy first-born son.", "tj": "", "tj_en": "", "rashi": "<b>ואמר אליך.<\/b> בִּשְׁלִיחוּתוֹ שֶׁל מָקוֹם <b>שלח את בני<\/b>:<br><br><b>הנה אנכי הרג וגו'.<\/b> הִיא מַכָּה אַחֲרוֹנָה, וּבָהּ הִתְרָהוּ תְּחִלָּה מִפְּנֵי שֶׁהִיא קָשָׁה; וְזֶה הוּא שֶׁאָמַר \"הֶן אֵל יַשְׂגִּיב בְּכֹחוֹ\" – לְפִיכָךְ \"מִי כָמֹהוּ מוֹרֶה\" (איוב ל\"ו); בָּשָׂר וָדָם הַמְבַקֵּשׁ לְהִנָּקֵם מֵחֲבֵרוֹ, מַעֲלִים אֶת דְּבָרָיו, שֶׁלֹּא יְבַקֵּשׁ הַצָּלָה, אֲבָל הַקָּבָּ\"ה יַשְׂגִּיב בְּכֹחוֹ וְאֵין יְכֹלֶת לְהִמָּלֵט מִיָּדוֹ כִּי אִם בְּשׁוּבוֹ אֵלָיו, לְפִיכָךְ הוּא מוֹרֵהוּ וּמַתְרֶה בוֹ לָשׁוּב:", "rashi_en": "ואמר אליך AND I HAVE SAID UNTO THEE, as a messenger of the Omnipresent God, שלח את בני LET MY SON GO,<br><br>הנה אנכי הרג וגו׳ BEHOLD I WILL SLAY etc. — This, it is true, was the last of the plagues, but it was by mention of it that God gave him the first warning regarding the plagues that would come upon him, because this was the severest of them all. This is what Scripture means by, (Job 36:22) “Behold God is mighty in His power”, therefore “Who is a teacher like unto Him?” — This signifies: A human being who intends to avenge himself upon his fellow keeps his plans secret in order that he may not seek means of escape. But the Holy One, blessed be He, is so mighty in His power that there is no possibility of escape from His hand except by returning to Him in penitence. Just on this account He teaches him (informs him what punishment will befall him) and so warns him to return to Him (Exodus Rabbah 9:9)."}, {"ch": 4, "v": 24, "aliyah": 6, "heb": "וַיְהִ֥י בַדֶּ֖רֶךְ בַּמָּל֑וֹן וַיִּפְגְּשֵׁ֣הוּ יְהֹוָ֔ה וַיְבַקֵּ֖שׁ הֲמִיתֽוֹ׃", "onk": "וַהֲוָה בְאָרְחָא בְּבֵית מְבָתָא וַעֲרַע בֵּהּ <b>מַלְאֲכָא<\/b> דַיְיָ וּבְעָא לְמִקְטְלֵהּ:", "onk_en": "He [Moshe] was along the way, in the inn, [<b>an Angel of<\/b>] Adonoy confronted him, and wanted to kill him.", "pj": "וַהֲוָה בְאוֹרְחָה בְּבֵית מִבְתּוֹתָא וְעַרַע בֵּיהּ מַלְאָכָא דַיְיָ וּבְעָא לְמִקְטְלֵיהּ מִן בִּגְלַל גֵרְשׁוֹם בְּרֵיהּ דְלָא הֲוָה גְזִיר עַל עֵיסַק יִתְרוֹ חָמוֹי דְלָא שַׁבְקֵיהּ לְמִגְזְרֵיהּ בְּרַם אֱלִיעֶזֶר הֲוָה גָזַר בִּתְּנָאָה דְאַתְנִיוּ תַּרְוֵיהוֹן", "pj_en": "But it was on the way, in the place of lodging that the angel of the Lord met him, and sought to kill him, because Gershom his son had not been circumcised, inasmuch as Jethro his father-in-law had not permitted him to circumcise him: but Eliezer had been circumcised, by an agreement between them two.", "tj": "", "tj_en": "", "rashi": "<b>ויהי<\/b> משה <b>בדרך במלון<\/b>:<br><br><b>ויבקש המיתו.<\/b> (המלאך ל)מֹשֶׁה: לְפִי שֶׁלֹּא מָל אֶת אֱלִיעֶזֶר בְּנוֹ, וְעַל שֶׁנִּתְרַשֵּׁל נֶעֱנַשׁ מִיתָה. תַּנְיָא אָמַר רַבִּי יוֹסֵי: חַס וְשָׁלוֹם, לֹא נִתְרַשֵּׁל אֶלָּא אָמַר, אָמוּל וְאֵצֵא לַדֶּרֶךְ, סַכָּנָה הִיא לַתִּינוֹק עַד שְׁלוֹשֶׁת יָמִים, אָמוּל וְאֶשְׁהֶה ג' יָמִים, הַקָּבָּ\"ה צִוַּנִי לֵךְ שֻׁב מִצְרָיִם וּמִפְּנֵי מָה נֶעֱנַשׁ? לְפִי שֶׁנִּתְעַסֵּק בַּמָּלוֹן תְּחִלָּה (מכילתא). בְּמַסֶּכֶת נְדָרִים: וְהָיָה הַמַּלְאָךְ נַעֲשֶׂה כְּמִין נָחָשׁ וּבוֹלְעוֹ מֵרֹאשׁוֹ וְעַד יְרֵכָיו וְחוֹזֵר וּבוֹלְעוֹ מֵרַגְלָיו וְעַד אוֹתוֹ מָקוֹם, הֵבִינָה צִפּוֹרָה שֶׁבִּשְׁבִיל הַמִּילָה הוּא (נדרים ל\"ב):", "rashi_en": "ויהי AND HE WAS — Moses was — DURING THE JOURNEY IN THE LODGING PLACE.<br><br>ויבקש המיתו AND HE SOUGHT TO PUT HIM TO DEATH — the angel sought etc., because he had not circumcised his son Eliezer; and because he had showed himself remiss in this, he brought upon himself the punishment of death. It has been taught in a Boraitha (Nedarim 31b): Rabbi José said: God forbid that this was so; Moses had not been remiss in this duty; but he thought, “If I circumcise him and immediately proceed on the journey, the child’s life will be in danger for three days. If, on the other hand, I circumcise him and wait three days — the Holy One, blessed be He, has commanded me, “Go return to Egypt!” Consequently, he obeyed His command, intending to circumcise the child as soon as the opportunity presented itself. There was therefore no remissness on his part; why, then, was he threatened with punishment? Because he busied himself with the affairs of the lodging place first, (i. e. because when he arrived at the inn he troubled himself first about eating and drinking. He should first have circumcised his son. Being now so much nearer Egypt, the danger that follows upon the circumcision was not so great, since the interval of time between the operation and his arrival in Egypt was now shorter than if he had circumcised him before he set out on the journey). See this in Treatise Nedarim. — The angel became a kind of serpent and swallowed him (Moses) from his head to his thigh, spued him forth, and then again swallowed him from his legs to that place (the membrum). Zipporah thus understood that this had happened on account of the delay in the circumcision of her son (Nedarim 32a; cf. Exodus Rabbah 5:8)."}, {"ch": 4, "v": 25, "aliyah": 6, "heb": "וַתִּקַּ֨ח צִפֹּרָ֜ה צֹ֗ר וַתִּכְרֹת֙ אֶת־עׇרְלַ֣ת בְּנָ֔הּ וַתַּגַּ֖ע לְרַגְלָ֑יו וַתֹּ֕אמֶר כִּ֧י חֲתַן־דָּמִ֛ים אַתָּ֖ה לִֽי׃", "onk": "וּנְסֵיבַת צִפּוֹרָה טִנָרָא וּגְזָרַת יָת עָרְלַת בְּרַהּ <b>וּקְרִיבַת לָקֳדָמוֹהִי<\/b> וַאֲמֶרֶת אֲרֵי <b>בִדְמָא דִמְהֻלְתָּא הָדֵין אִתְיְהֵב חַתְנָא לָנָא<\/b>:", "onk_en": "Tzipporah took a flint-stone and cut off her son’s foreskin, and threw it at his feet [<b>brought it before him<\/b>], saying, “You are a bridegroom of blood to me [<b>With this blood of circumcision, a husband is given to us<\/b>].”", "pj": "וּנְסִיבַת צִפּוֹרָה טִינְרָא וּגְזָרַת יַת עוּרְלַת גֵרְשׁוֹם בְרָהּ וְאַקְרִיבַת יַת גְזֵירַת מָהוּלְתָּא לְרַגְלוֹי דְמַלְאָךְ חַבָּלָא וַאֲמָרַת חַתְנָא בְּעָא לְמִיגְזוֹר וְחָמוֹי עַכִּיב וּכְדוֹן אֲדָם גְזוּרְתָּא הָדֵין יְכַפֵּר עַל חַתְנָא דִילִי", "pj_en": "And Zipporah took a stone, and circumcised the foreskin of Gershom her son, and brought the severed part to the feet of the angel, the Destroyer, and said, The husband sought to circumcise, but the father-in-law obstructed him; and now let this blood of the circumcision atone for my husband.", "tj": "וּגְזָרַת יַת עוּרְלָתֵיהּ דִבְּרָהּ וְאַקְרִיבַת יָתֵיהּ קֳדָם רִיגְלוֹי דִמְחַבְּלָא וַאֲמָרַת חַתְנָא בָּעָא לְמִגְזַר וַחֲמוֹי לָא שָׁבַק יָתֵיהּ וּכְדוּן אִיכַפֵּר אֵידָם גְזֵירָתֵיהּ הָדָא עַל חוֹבוֹי דַחֲתָנָא הָדֵין:", "tj_en": "And she circumcised the foreskin of her son, and brought before the feet of the Destroyer, and said, The husband could have circumcised, but the father-in-law did not permit him; but now, let the blood of this circumcision atone for the fault of this husband.", "rashi": "<b>ותגע לרגליו.<\/b> הִשְׁלִיכַתּוּ לִפְנֵי רַגְלָיו שֶׁל מֹשֶׁה:<br><br><b>ותאמר.<\/b> עַל בְּנָהּ:<br><br><b>כי חתן דמים אתה לי.<\/b> אַתָּה הָיִיתָה גּוֹרֵם לִהְיוֹת הֶחָתָן שֶׁלִּי נִרְצָח עָלֶיךָ – הוֹרֵג אִישִׁי אַתָּה לִי:", "rashi_en": "ותגע לרגליו AND CAST IT AT HIS FEET — i. e. she cast it before Moses’ feet (Talmud Yerushalmi Nedarim 3:9).<br><br>ותאמר AND SHE SAID, referring to her son:<br><br>כי חתן דמים אתה לי which means, thou hast brought it about that my bridegroom (Moses) was on the point of being killed because of thee: thou hast been to me my husband’s murderer."}, {"ch": 4, "v": 26, "aliyah": 6, "heb": "וַיִּ֖רֶף מִמֶּ֑נּוּ אָ֚ז אָֽמְרָ֔ה חֲתַ֥ן דָּמִ֖ים לַמּוּלֹֽת׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְנָח מִנֵהּ בְּכֵן אֲמֶרֶת <b>אִלוּלֵי דְמָא דִמְהֻלְתָּא הָדֵין אִתְחַיַב חַתְנָא קְטוֹל<\/b>:", "onk_en": "He then withdrew from him [Moshe. Then she said, “[You are] a bridegroom of blood [to me] because of the circumcision [<b>Were it not for this blood of circumcision, my husband would have deserved to be killed<\/b>].”", "pj": "וּפְסַק מַלְאָךְ חַבָּלָא מִנֵיהּ בְּכֵן שַׁבְּחַת צִפּוֹרָה וַאֲמַרַת מַה חָבִיב הוּא אֲדָם גְזוּרְתָּא הָדֵין דְשֵׁזִיב יַת חֲתָנָא מִן יְדוֹי דְמַלְאָךְ חֲבָּלָא", "pj_en": "And the destroying angel desisted from him, so that Zipporah gave thanks, and said, How lovely is the blood of this circumcision that hath delivered my husband from the angel of destruction!", "tj": "וְכַד אַרְפֵּי מְחַבְּלָא מִינֵיהּ בְּכֵן שַׁבְּחַת צִפּוֹרָה וַאֲמַרַת מַה חָבִיב הוּא דַם גְזֵירָתָא דִי יִשֵׁזֵיב לַחֲתָנָא מִן יְדוֹי דְמַלְאָךְ מוֹתָא:", "tj_en": "And when the Destroyer had ceased from him, Zipporah gave thanks and said, How lovely is the blood of this circumcision which hath saved my husband from the hand of the angel of death !", "rashi": "<b>וירף.<\/b> הַמַּלְאָךְ <b>ממנו, אז<\/b> הֵבִינָה שֶׁעַל הַמִּילָה בָּא לְהָרְגוֹ:<br><br><b>אמרה חתן דמים למולת.<\/b> חֲתָנִי הָיָה נִרְצָח עַל דְּבַר הַמִּילָה:<br><br><b>למולת.<\/b> עַל דְּבַר הַמּוּלוֹת. שֵׁם דָּבָר הוּא, וְהַלָּמֶ\"ד מְשַׁמֶּשֶׁת בִּלְשׁוֹן עַל, כְּמוֹ \"וְאָמַר פַּרְעֹה לִבְנֵי יִשְׂרָאֵל\" (שמות י\"ד), וְאֻנְקְלוֹס תִּרְגֵּם דָּמִים עַל דַּם הַמִּילָה:", "rashi_en": "וירף SO HE LOOSENED HIS HOLD — the angel loosened his hold ממנו FROM HIM; (cf. Exodus Rabbah 5:8). אז THEN she understood that he had come to kill him because of the delay in the circumcision,<br><br>אמרה חתן דמים למלות SHE SAID “BRIDEGROOM OF BLOOD BECAUSE OF THE CIRCUMCISION” — my bridegroom was on the point of being killed on account of the circumcision.<br><br>למלות means on account of (ל) the circumcision (מולות). The word מולות it a noun, and the ל prefixed it used in the tense of על, “on account of”, just as in (Exodus 14:3) “And Pharaoh will say regarding the children (לבני) of Israel”. Onkelos, however, translated the word דמים as having reference to the blood of the circumcision (whilst, according to Rashi, it refers to the blood of Moses which was about to be shed)."}, {"ch": 4, "v": 27, "aliyah": 6, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶֽל־אַהֲרֹ֔ן לֵ֛ךְ לִקְרַ֥את מֹשֶׁ֖ה הַמִּדְבָּ֑רָה וַיֵּ֗לֶךְ וַֽיִּפְגְּשֵׁ֛הוּ בְּהַ֥ר הָאֱלֹהִ֖ים וַיִּשַּׁק־לֽוֹ׃", "onk": "וַאֲמַר יְיָ לְאַהֲרֹן אֱזֵיל לְקַדָמוּת משֶׁה לְמַדְבְּרָא וַאֲזַל וְעַרְעֵהּ בְּטוּרָא <b>דְאִתְגְלֵי עֲלוֹהִי יְקָרָא<\/b> דַיְיָ וּנְשַׁק לֵהּ:", "onk_en": "Adonoy said to Aharon, “Go meet Moshe in the desert.” He [Aharon] went and met him at the mountain [<b>upon which was revealed the Glory<\/b>] of God and he kissed him.", "pj": "וַאֲמַר יְיָ לְאַהֲרן אִיזֵיל לְקַדְמוּת משֶׁה לְמַדְבְּרָא וַאֲזַל וְאַרְעֵיהּ בְּטַוְורָא דְאִתְגְלֵי עֲלוֹי יְקָרָא דַיְיָ וּנְשֵׁיק לֵיהּ", "pj_en": "And the Lord had said to Aharon, Go and meet Mosheh in the desert. And he came and met him at the mountain where was revealed the glory of the Lord, and he embraced him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 28, "aliyah": 6, "heb": "וַיַּגֵּ֤ד מֹשֶׁה֙ לְאַֽהֲרֹ֔ן אֵ֛ת כׇּל־דִּבְרֵ֥י יְהֹוָ֖ה אֲשֶׁ֣ר שְׁלָח֑וֹ וְאֵ֥ת כׇּל־הָאֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽהוּ׃", "onk": "וְחַוִי משֶׁה לְאַהֲרֹן יָת כָּל פִּתְגָמַיָא דַיְיָ דִי שַׁלְחֵהּ וְיָת כָּל אָתַיָא דִי פַקְדֵהּ:", "onk_en": "Moshe told Aharon all the words of Adonoy with which He had sent him; and all the [miraculous] signs that He had commanded him [to demonstrate].", "pj": "וּתְנֵי משֶׁה לְאַהֲרן יַת פִּתְגָמָא הָאִלֵין דְשַׁלְחֵיהּ וְיַת כָּל אָתַיָא דְפַקְדֵיהּ לְמֶעֱבַד", "pj_en": "And Mosheh delivered to Aharon all these words with which he had sent him, and all the signs that he had instructed him to work.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 29, "aliyah": 6, "heb": "וַיֵּ֥לֶךְ מֹשֶׁ֖ה וְאַהֲרֹ֑ן וַיַּ֣אַסְפ֔וּ אֶת־כׇּל־זִקְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וַאֲזַל משֶׁה וְאַהֲרֹן וּכְנָשׁוּ יָת כָּל סָבֵי בְּנֵי יִשְׂרָאֵל:", "onk_en": "Moshe and Aharon went [to Egypt] and they gathered all the elders of the B’nei Yisrael.", "pj": "וַאֲזַל משֶׁה וְאַהֲרן וּכְנָשׁוּ יַת כָּל סָבֵי בְּנֵי יִשְרָאֵל", "pj_en": "And Mosheh and Aharon went, and gathered together all the elders of the sons of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 30, "aliyah": 6, "heb": "וַיְדַבֵּ֣ר אַהֲרֹ֔ן אֵ֚ת כׇּל־הַדְּבָרִ֔ים אֲשֶׁר־דִּבֶּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֑ה וַיַּ֥עַשׂ הָאֹתֹ֖ת לְעֵינֵ֥י הָעָֽם׃", "onk": "וּמַלִיל אַהֲרֹן יָת כָּל פִּתְגָמַיָא דִי מַלִיל יְיָ עִם משֶׁה וַעֲבַד אָתַיָא לְעֵינֵי עַמָא:", "onk_en": "Aharon spoke all the words that Adonoy had spoken to Moshe, and he demonstrated the [miraculous] signs in the eyes [sight] of the people.", "pj": "וּמַלֵיל אַהֲרן יַת פִּתְגָמַיָא דְמַלֵיל יְיָ עִם משֶׁה וְעָבַד אָתַיָא לְעֵינֵי עַמָא", "pj_en": "And Aharon spake all the words which the Lord had spoken with Mosheh, and did the signs in the eyes of the people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 31, "aliyah": 6, "heb": "וַֽיַּאֲמֵ֖ן הָעָ֑ם וַֽיִּשְׁמְע֡וּ כִּֽי־פָקַ֨ד יְהֹוָ֜ה אֶת־בְּנֵ֣י יִשְׂרָאֵ֗ל וְכִ֤י רָאָה֙ אֶת־עׇנְיָ֔ם וַֽיִּקְּד֖וּ וַיִּֽשְׁתַּחֲוֽוּ׃", "onk": "וְהֵימִן עַמָא וּשְׁמָעוּ אֲרֵי דְכִיר יְיָ יָת בְּנֵי יִשְׂרָאֵל וַאֲרֵי <b>גְלֵי קֳדָמוֹהִי<\/b> יָת שִׁעְבּוּדְהוֹן וּכְרָעוּ וּסְגִידוּ:", "onk_en": "The people believed. When they heard that Adonoy was mindful of the B’nei Yisrael, and that He had seen their suffering [<b>was revealed before Him<\/b>], they bowed their heads and prostrated themselves.", "pj": "וְהֵימִין עַמָא וּשְׁמָעוּ אֲרוּם דְכִיר יְיָ יַת בְּנֵי יִשְרָאֵל וַאֲרוּם גְלֵי קֳדָמוֹי שִׁעְבּוּדְהוֹן וּגְחָנַן וּסְגִידוּ", "pj_en": "And the people believed, and heard that the Lord had remembered the sons of Israel, and that their bondage was manifest before Him; and they bowed themselves and worshipped.", "tj": "וַעֲקָדוּ:", "tj_en": "And they kneeled down.", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 1, "aliyah": 7, "heb": "וְאַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְאַהֲרֹ֔ן וַיֹּאמְר֖וּ אֶל־פַּרְעֹ֑ה כֹּֽה־אָמַ֤ר יְהֹוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת־עַמִּ֔י וְיָחֹ֥גּוּ לִ֖י בַּמִּדְבָּֽר׃", "onk": "וּבָתַר כֵּן עַלוּ משֶׁה וְאַהֲרֹן וַאֲמָרוּ לְפַרְעֹה כִּדְנַן אֲמַר יְיָ אֱלָהָא דְיִשְׂרָאֵל שַׁלַח יָת עַמִי וִיחַגוּן <b>קֳדָמַי<\/b> בְּמַדְבְּרָא:", "onk_en": "Afterwards Moshe and Aharon went and said to Pharaoh, “This is what Adonoy, God of Yisrael said, ‘Send My people, so they may celebrate a festival to [<b>before<\/b>] Me in the wilderness.”", "pj": "וּבָתַר כְּדֵין עָלוּ משֶׁה וְאַהֲרן וַאֲמָרוּ לְפַרְעה כִּדְנָא אָמַר יְיָ אֱלָהָא דְיִשְרָאֵל פְּטוֹר יַת עַמִי וְיַעַבְדוּן לִי חַגָא בְּמַדְבְּרָא", "pj_en": "And after this Mosheh and Aharon went in unto Pharoh, and said, Thus saith the Lord, the God of Israel: Release My people, that they may make unto Me a festival in the wilderness.", "tj": "", "tj_en": "", "rashi": "<b>ואחר באו משה ואהרן וגו'.<\/b> אֲבָל הַזְּקֵנִים נִשְׁמְטוּ אֶחָד אֶחָד מֵאַחַר מֹשֶׁה וְאַהֲרֹן, עַד שֶׁנִּשְׁמְטוּ כֻלָּם קֹדֶם שֶׁהִגִּיעוּ לַפָּלָטִין, לְפִי שֶׁיָּרְאוּ לָלֶכֶת; וּבְסִינַי נִפְרַע לָהֶם, \"וְנִגַּשׁ מֹשֶׁה לְבַדּוֹ אֶל ה' וְהֵם לֹא יִגָּשׁוּ\" (שמות כ\"ד) – הֶחֱזִירָם לַאֲחוֹרֵיהֶם (שמות רבה):", "rashi_en": "ואחר באו משה ואהרן AND AFTERWARDS MOSES AND AARON CAME — But the elders slipped away one by one from behind Moses and Aaron until every-one of them had slipped away before they arrived at the palace, because they were afraid to go there. At Sinai they were punished for this, for it is stated (Exodus 24:2) “And Moses alone shall draw near unto the Lord, but they, (the elders; cf. Exodus 24:1) shall not draw near” — He bid them stay behind. (Exodus Rabbah 5:14)"}, {"ch": 5, "v": 2, "aliyah": 7, "heb": "וַיֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהֹוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּקֹל֔וֹ לְשַׁלַּ֖ח אֶת־יִשְׂרָאֵ֑ל לֹ֤א יָדַ֙עְתִּי֙ אֶת־יְהֹוָ֔ה וְגַ֥ם אֶת־יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ׃", "onk": "וַאֲמַר פַּרְעֹה <b>שְׁמָא<\/b> דַיְיָ <b>לָא אִתְגְלִי לִי<\/b> דִי אֲקַבֵּל <b>לְמֵמְרֵהּ<\/b> לְשַׁלָחָא יָת יִשְׂרָאֵל לָא אִתְגְלִי לִי <b>שְׁמָא<\/b> דַיְיָ וְאַף יָת יִשְׂרָאֵל לָא אֲשַׁלַח:", "onk_en": "Pharaoh said, “Who is [<b>The Name of<\/b>] Adonoy [<b>is not revealed to me<\/b>] that I should obey his voice [<b>Word<\/b>], to let Yisrael go. I do not know [<b>The Name of<\/b>] Adonoy [<b>is not revealed to me<\/b>], nor will I let [the B’nei] Yisrael go.”", "pj": "וַאֲמַר פַּרְעה שְׁמָא דַיְיָ לָא אִיתְגְלֵי לִי דַאֲקַבֵּל בְּמֵימְרֵיהּ לְמִפְטוֹר יַת יִשְרָאֵל לָא אַשְׁכָּחִית בְּסֵפֶר מַלְאָכַיָא כְּתִיב יַת שְׁמָא דַיְיָ מִינֵהּ לֵית אֲנָא דָחִיל וְאוּף יַת יִשְרָאֵל לָא אִיפְטוֹר", "pj_en": "And Pharoh said, The name of the Lord is not made known to me, that I should receive His word to release Israel. I have not found written in the Book of the Angels the name of the Lord. Of Him I am not afraid, neither will I release Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 3, "aliyah": 7, "heb": "וַיֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָעִבְרִ֖ים נִקְרָ֣א עָלֵ֑ינוּ נֵ֣לְכָה נָּ֡א דֶּ֩רֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּמִּדְבָּ֗ר וְנִזְבְּחָה֙ לַֽיהֹוָ֣ה אֱלֹהֵ֔ינוּ פֶּ֨ן־יִפְגָּעֵ֔נוּ בַּדֶּ֖בֶר א֥וֹ בֶחָֽרֶב׃", "onk": "וַאֲמָרוּ אֱלָהָא דִיהוּדָאֵי אִתְגְלִי עֲלָנָא נֵיזֵיל <b>כְּעַן<\/b> מַהֲלַךְ תְּלָתָא יוֹמִין בְּמַדְבְּרָא וּנְדַבַּח <b>קֳדָם<\/b> יְיָ אֱלָהָנָא דִלְמָא יְעַרְעִנָנָא בְּמוֹתָא אוֹ בִקְטוֹל:", "onk_en": "They said [to him], “The God of the Hebrews has revealed Himself to us. Please [<b>Now<\/b>] allow us to take a three day journey into the wilderness, and let us sacrifice to [<b>before<\/b>] Adonoy, our God, lest He strike us with the plague or with the sword.”", "pj": "וַאֲמָרוּ אֱלָהָא דִיהוּדָאֵי אִיתְקְרִי שְׁמֵיהּ עֲלָנָא נְטַיֵיל כְּדוֹן מַהֲלָךְ תְּלָתָא יוֹמִין בְּמַדְבְּרָא וּנְדַבַּח נִיכְסַת חַגָא קֳדָם יְיָ אֱלָהִין דִלְמָא יֶאֱרַע יָתָן בְּמוֹתָא אוֹ בְּקַטְלָא", "pj_en": "And they said, The Name of the God of the Jehudaee is invoked by (or upon) us. We will go, then, to proceed three days into the desert, and offer the sacrifices of a festival before the Lord God, that death and slaughter befall us not.", "tj": "", "tj_en": "", "rashi": "<b>פן יפגענו.<\/b> פֶּן יִפְגָּעֲךָ הָיוּ צְרִיכִים לוֹמַר, אֶלָּא שֶׁחָלְקוּ כָּבוֹד לַמַּלְכוּת. פְּגִיעָה זוֹ לְשׁוֹן מִקְרֵה מָוֶת הִיא (שם):", "rashi_en": "פן יפגענו LEST HE LIGHT ON US — They should have said, “Lest He light on thee (Pharaoh) [with pestilence] etc.” — but they showed respect to royalty (the king) by thus expressing themselves. This term פגיעה “lighting on”, “meeting” denotes meeting with death (Exodus Rabbah 5:15)."}, {"ch": 5, "v": 4, "aliyah": 7, "heb": "וַיֹּ֤אמֶר אֲלֵהֶם֙ מֶ֣לֶךְ מִצְרַ֔יִם לָ֚מָּה מֹשֶׁ֣ה וְאַהֲרֹ֔ן תַּפְרִ֥יעוּ אֶת־הָעָ֖ם מִֽמַּעֲשָׂ֑יו לְכ֖וּ לְסִבְלֹתֵיכֶֽם׃", "onk": "וַאֲמַר לְהוֹן מַלְכָּא דְמִצְרַיִם לְמָא משֶׁה וְאַהֲרֹן תְּבַטְלוּן יָת עַמָא מֵעוֹבָדֵהוֹן אֱזִילוּ לְפָלְחָנְכוֹן:", "onk_en": "The king of Egypt said to them, “Why, Moshe and Aharon, are you distracting the people from their work? Get back to your burdens.”", "pj": "וַאֲמַר לְהוֹן מַלְכָּא דְמִצְרַיִם לְמָא משֶׁה וְאַהֲרן תְּבַטְלוּן יַת עַמָא מֵעֲבִידְתְּהוֹן אִיזִילוּ לְפוּלְחַנְכוֹן", "pj_en": "And the king of Mizraim said to Mosheh and Aharon, Why do you make the people cease from their labours? Go to your work.", "tj": "", "tj_en": "", "rashi": "<b>תפריעו את העם ממעשיו.<\/b> תַּבְדִּילוּ וְתַרְחִיקוּ אוֹתָם מִמְּלַאכְתָּם, שֶׁשּׁוֹמְעִין לָכֶם וּסְבוּרִים לָנוּחַ מִן הַמְּלָאכָה; וְכֵן \"פְּרָעֵהוּ אַל תַּעֲבֹר בּוֹ\" (משלי ד') – רַחֲקֵהוּ, וְכֵן \"וַתִּפְרְעוּ כָל עֲצָתִי\" (שם א'), \"כִּי פָרֻעַ הוּא\" (שמות ל\"ב) – נִרְחָק וְנִתְעָב:<br><br><b>לכו לסבלתיכם.<\/b> לְכוּ לִמְלַאכְתְּכֶם שֶׁיֵּשׁ לָכֶם לַעֲשׂוֹת בְּבָתֵּיכֶם, אֲבָל מְלֶאכֶת שִׁעְבּוּד מִצְרַיִם לֹא הָיְתָה עַל שִׁבְטוֹ שֶׁל לֵוִי; תֵּדַע לְךָ, שֶׁהֲרֵי מֹשֶׁה וְאַהֲרֹן יוֹצְאִים וּבָאִים (שמות רבה):", "rashi_en": "תפריעו את העם ממעשיו means ye detach and take them away from their work, because they listen to you and believe that they may refrain from the work. Similar are: (Proverbs 4:15) “פרעהו pass not by it”, i. e. keep it far from thee, pass not by it; (Proverbs 1:25) “and ye withdraw (ותפרעו) all my counsel”; (Exodus 32:25) “for it is פרע” i. e. it had removed itself from the proper path and had made itself a thing to be abhorred (but cf. Rashi on this verse where he explains the word by מגולה — נתגלה שמצו וקלונו).<br><br>לכו לסבלתיכם. GO YE UNTO YOUR BURDENS — Go to your work which you have to do at home; but it cannot signify “go to your labours as slaves”, for he was speaking to Moses and Aaron who were of the tribe of Levi, and the work of Egyptian slavery had not been imposed on the tribe of Levi. You may know that this was so, because Moses and Aaron went and came just as they pleased (Exodus Rabbah 5:16)."}, {"ch": 5, "v": 5, "aliyah": 7, "heb": "וַיֹּ֣אמֶר פַּרְעֹ֔ה הֵן־רַבִּ֥ים עַתָּ֖ה עַ֣ם הָאָ֑רֶץ וְהִשְׁבַּתֶּ֥ם אֹתָ֖ם מִסִּבְלֹתָֽם׃", "onk": "וַאֲמַר פַּרְעֹה הָא סַגִיאִין כְּעַן עַמָא דְאַרְעָא וּתְבַטְלוּן יָתְהוֹן מִפָּלְחָנְהוֹן:", "onk_en": "Then Pharaoh said, “Behold, the people of the land are now many, and you want them to take leave from their hard work.”", "pj": "וַאֲמַר פַּרְעה הָא סַגִין הִינוּן כְּדוּן עַמָא דְאַרְעָא דְאַתּוּן מְבַטְלִין יַתְהוֹן מִפּוּלְחַנְהוֹן", "pj_en": "And Pharoh said, Behold, this people of the land are many, whom you would stop from their service.", "tj": "", "tj_en": "", "rashi": "<b>הן רבים עתה עם הארץ.<\/b> שֶׁהָעֲבוֹדָה מֻטֶּלֶת עֲלֵיהֶם, וְאַתֶּם מַשְׁבִּיתִים אוֹתָם מִסִּבְלוֹתָם, הֶפְסֵד גָּדוֹל הוּא זֶה:", "rashi_en": "הן רבים עתה עם הארץ BEHOLD THE PEOPLE OF THE LAND NOW ARE MANY upon whom lies the duty of working, and you make them rest from their burdens — this is a great loss to us, since so many will refrain from work."}, {"ch": 5, "v": 6, "aliyah": 7, "heb": "וַיְצַ֥ו פַּרְעֹ֖ה בַּיּ֣וֹם הַה֑וּא אֶת־הַנֹּגְשִׂ֣ים בָּעָ֔ם וְאֶת־שֹׁטְרָ֖יו לֵאמֹֽר׃", "onk": "וּפַקִיד פַּרְעֹה בְּיוֹמָא הַהוּא יָת שִׁלְטוֹנִין דְעַמָא וְיָת סָרְכוֹהִי לְמֵימָר:", "onk_en": "That day, Pharaoh commanded the taskmasters of the people and their officers, saying,", "pj": "וּפַקֵיד פַּרְעה בְּיוֹמָא הַהוּא יַת שׁוּלְטָנַיָא דְעַמָא וְיַת סַרְכוֹי לְמֵימָר", "pj_en": "And Pharoh that day commanded the officers of the people and their exactors, saying,", "tj": "", "tj_en": "", "rashi": "<b>הנגשים.<\/b> מִצְרִיִּים הָיוּ וְהַשּׁוֹטְרִים הָיוּ יִשְׂרְאֵלִים; הַנּוֹגֵשׂ מְמֻנֶּה עַל כַּמָּה שׁוֹטְרִים וְהַשּׁוֹטֵר מְמֻנֶּה לִרְדּוֹת בְּעוֹשֵׂי הַמְּלָאכָה (שמות רבה):", "rashi_en": "הנגשים THE TASKMASTERS — These were Egyptians, and the שוטרים, bailiffs, were Israelites (cf. vv. 14, 15, 19) (Exodus Rabbah 5:18). A taskmaster (נוגש), was given charge over many bailiffs, and a שוטר was one who was appointed to have control over the workmen."}, {"ch": 5, "v": 7, "aliyah": 7, "heb": "לֹ֣א תֹאסִפ֞וּן לָתֵ֨ת תֶּ֧בֶן לָעָ֛ם לִלְבֹּ֥ן הַלְּבֵנִ֖ים כִּתְמ֣וֹל שִׁלְשֹׁ֑ם הֵ֚ם יֵֽלְכ֔וּ וְקֹשְׁשׁ֥וּ לָהֶ֖ם תֶּֽבֶן׃", "onk": "לָא תוֹסְפוּן לְמִיתַּן תִּבְנָא לְעַמָא לְמִרְמֵי לִבְנִין כְּמִתְּמַלֵי וּמִדְקָמוֹהִי אִנוּן יְהָכוּן וִיגַבְּבוּן לְהוֹן תִּבְנָא:", "onk_en": "“You shall no longer give the people straw to make bricks as before. Let them go gather [their own] straw,", "pj": "לָא תוֹסְפוּן לְמִיתַּן תִּיבְנָא לְעַמָא לְמִירְמֵי לִבְנַיָא הֵי כְמֵאִיתְמְלֵי וְהֵי כְמִלְקָדָמוֹי הִינוּן יֵזְלוּן וִיגַבְּבוּן לְהוֹן תִּבְנָא", "pj_en": "You shall no more give straw to the people to cast bricks as heretofore; let them go and collect straw for themselves;", "tj": "", "tj_en": "", "rashi": "<b>תבן.<\/b> אשטו\"בלא, הָיוּ גּוֹבְלִין אוֹתוֹ עִם הַטִּיט:<br><br><b>לבנים.<\/b> טיוול\"ש בְּלַעַז, שֶׁעוֹשִׂים מִטִּיט וּמְיַבְּשִׁין אוֹתָן בַּחַמָּה; וְיֵשׁ שֶׁשּׂוֹרְפִין אוֹתָן בַּכִּבְשָׁן:<br><br><b>כתמול שלשום.<\/b> כַּאֲשֶׁר הֱיִיתֶם עוֹשִׂים עַד הֵנָּה;<br><br><b>וקששו.<\/b> וְלָקְטוּ:", "rashi_en": "תבן STRAW — In old French estouble; English stubble. They used to knead this into the clay.<br><br>לבנים BRICKS — old French tuiles: English tiles, which they make from clay and dry in the sun; sometimes they are burnt in a kiln.<br><br>כתמול שלשם means as you have been doing UP TILL NOW (not “yesterday and the day before” as is the literal meaning, but merely “formerly”).<br><br>וקששו means AND LET THEM GATHER."}, {"ch": 5, "v": 8, "aliyah": 7, "heb": "וְאֶת־מַתְכֹּ֨נֶת הַלְּבֵנִ֜ים אֲשֶׁ֣ר הֵם֩ עֹשִׂ֨ים תְּמ֤וֹל שִׁלְשֹׁם֙ תָּשִׂ֣ימוּ עֲלֵיהֶ֔ם לֹ֥א תִגְרְע֖וּ מִמֶּ֑נּוּ כִּֽי־נִרְפִּ֣ים הֵ֔ם עַל־כֵּ֗ן הֵ֤ם צֹֽעֲקִים֙ לֵאמֹ֔ר נֵלְכָ֖ה נִזְבְּחָ֥ה לֵאלֹהֵֽינוּ׃", "onk": "וְיָת סְכוֹם לְבֵנַיָא דִי אִנוּן עָבְדִין מִתְּמַלֵי וּמִדְקָמוֹהִי תְּמַנוּן עֲלֵיהוֹן לָא תִמְנְעוּן מִנֵהּ אֲרֵי בַטְלָנִין אִנוּן עַל כֵּן אִנוּן צָוְחִין לְמֵימַר נֵיזֵיל נְדַבַּח <b>קֳדָם<\/b> אֱלָהָנָא:", "onk_en": "[And] the quota of bricks that they made before, you shall place upon them; do not reduce it, for they are lazy and therefore they cry out, saying, ‘We want to go sacrifice to [<b>before<\/b>] our God.’", "pj": "וְיַת סְכוּם לִבְנַיָא דְהִינוּן עָבְדִין מֵאִיתְמְלֵי וּמִדְקָדָמוֹי תְּמַנוּן עֲלֵיהוֹן לָא תִמְנְעוּן מִנֵיהּ אֲרוּם בַּטְלָנִין הִינוּן בְּגִין כֵּן הִינוּן צַוְוחִין לְמֵימַר נֵיזִיל נְדַבַּח נִיכְסַת חַגָא קֳדָם אֱלָהָנָא", "pj_en": "but the (same) number of bricks which they have heretofore made ye shall lay upon them, and not diminish from it, because they are idle; therefore they clamour, saying, Let us go to offer the sacrifice of a festival before our God.", "tj": "", "tj_en": "", "rashi": "<b>ואת מתכנת הלבנים.<\/b> סְכוּם חֶשְׁבּוֹן הַלְּבֵנִים שֶׁהָיָה כָּל אֶחָד עוֹשֶׂה לַיּוֹם כְּשֶׁהָיָה הַתֶּבֶן נִתָּן לָהֶם, אוֹתוֹ סְכוּם תָּשִׂימוּ עֲלֵיהֶם גַּם עַתָּה, לְמַעַן תִּכְבַּד הָעֲבוֹדָה עֲלֵיהֶם:<br><br><b>כי נרפים.<\/b> מִן הָעֲבוֹדָה הֵם, לְכָךְ לִבָּם פּוֹנֶה אֶל הַבַּטָּלָה וְצוֹעֲקִים לֵאמֹר <b>נלכה וגו'<\/b>:<br><br><b>מתכנת.<\/b> וְתֹכֶן לְבֵנִים, \"וְלוֹ נִתְכְּנוּ עֲלִילוֹת\" (שמואל א ב'), \"אֶת הַכֶּסֶף הַמְתֻכָּן\" (מלכים ב י\"ב), כֻּלָּם לְשׁוֹן חֶשְׁבּוֹן הֵם:<br><br><b>נרפים.<\/b> הַמְּלָאכָה רְפוּיָה בְיָדָם וַעֲזוּבָה מֵהֶם וְהֵם נִרְפִּים מִמֶּנָּה; רטריי\"ט בְּלַעַז:", "rashi_en": "ואת מתכנת הלבנים means the total number of bricks which each made per day when straw was being supplied to them — that total you shall impose upon them now also, in order that the service may be hard upon them.<br><br>כי נרפים signifies because they have loosened themselves from the work; therefore (this word in Rashi corresponds to על כן in the Hebrew text) their mind turns to idleness and they cry out, saying, נלכה וגו׳ LET US GO [AND SACRIFICE etc.].<br><br>מתכנת — This word, and ותכן (v. 18), and the words of the same root in (I Samuel 2:3) “And by Him actions are counted (נתכנו)” and in (2 Kings 12:12) “the money that was counted (המתכן)”, all have the meaning of counting.<br><br>נרפים — The work is loose (רפויה) in their hand and neglected by them so that they are loosened (הם נרפים) from it. In old French retrait."}, {"ch": 5, "v": 9, "aliyah": 7, "heb": "תִּכְבַּ֧ד הָעֲבֹדָ֛ה עַל־הָאֲנָשִׁ֖ים וְיַעֲשׂוּ־בָ֑הּ וְאַל־יִשְׁע֖וּ בְּדִבְרֵי־שָֽׁקֶר׃", "onk": "תִּתָּקַף פָּלְחָנָא עַל גֻבְרַיָא וְיִתְעַסְקוּן בַּהּ וְלָא <b>יִתְעַסְקוּן<\/b> בְּפִתְגָמִין בְּטֵלִין:", "onk_en": "Make the workload heavier on the men, and make them do it. Let them not talk about [<b>be occupied with<\/b>] false ideas.”", "pj": "תִּתְקַף פּוּלְחָנָא עִלוֹי גוּבְרַיָא וְיִתְעַסְקוּן בָּה וְלָא יִתְרַחֲצוּן עַל מִילֵי שִׁקְרָא", "pj_en": "Make their work strenuous upon the men, that they may be occupied with it, and not be setting their hopes upon lying words.", "tj": "", "tj_en": "", "rashi": "<b>ואל ישעו בדברי שקר.<\/b> וְאַל יֶהֱגוּ וִידַבְּרוּ תָמִיד בְּדִבְרֵי רוּחַ לֵאמֹר, נֵלְכָה נִזְבְּחָה; וְדוֹמֶה לוֹ \"וְאֶשְׁעָה בְחֻקֶּיךָ תָמִיד\" (תהילים קי\"ט); \"לְמָשָׁל וְלִשְׁנִינָה\" (דברים כ\"ח), מְתַרְגְּמִינָן \"וּלְשׁוֹעֵי\"; וַיְסַפֵּר – \"וְאִשְׁתָּעִי\"; וְאִי אֶפְשָׁר לוֹמַר <b>ישעו<\/b> לְשׁוֹן \"וַיִּשַׁע ה' אֶל הֶבֶל\", \"וְאֶל קַיִן וְאֶל מִנְחָתוֹ לֹא שָׁעָה\" (בראשית ד'), וּלְפָרֵשׁ אַל יִשְׁעוּ – אַל יִפְנוּ, שֶׁאִם כֵּן הָיָה לוֹ לִכְתֹּב וְאַל יִשְׁעוּ אֶל דִּבְרֵי שָׁקֶר אוֹ לְדִבְרֵי שָׁקֶר, כִּי כֵן גִּזְרַת כֻּלָּם, \"יִשְׁעֶה הָאָדָם עַל עוֹשֵׂהוּ\" (ישעיהו י\"ז), \"וְלֹא יִשְׁעֶה אֶל הַמִּזְבְּחוֹת\", (שם), \"וְלֹא שָׁעוּ עַל קְדוֹשׁ יִשְׂרָאֵל\" (שם ל\"א), וְלֹא מָצָאתִי שִׁמּוּשׁ שֶׁל בֵּי\"ת סְמוּכָה לְאַחֲרֵיהֶם, אֲבָל אַחַר לְשׁוֹן דִּבּוּר – כְּמִתְעַסֵּק לְדַבֵּר בְּדָבָר – נוֹפֵל לְשׁוֹן שִׁמּוּשׁ בֵּי\"ת, כְּגוֹן: \"הַנִּדְבָּרִים בְּךָ\" (יחזקאל ל\"ג), \"וַתְּדַבֵּר מִרְיָם וְאַהֲרֹן בְּמֹשֶׁה\" (במדבר י\"ב), \"הַמַּלְאָךְ הַדּוֹבֵר בִּי\" (זכריה ד'), \"לְדַבֵּר בָּם\" (דברים י\"א), \"וַאֲדַבְּרָה בְעֵדוֹתֶיךָ\" (תהילים קי\"ט), אַף כָּאן – <b>אל ישעו בדברי שקר<\/b> – אַל יִהְיוּ נִדְבָּרִים בְּדִבְרֵי שָׁוְא וַהֲבַאי:", "rashi_en": "ואל ישעו בדברי שקר AND LET THEM NOT REGARD VAIN WORDS — let them not think and speak always about “words of wind” saying, “Let us go and sacrifice”. Of similar meaning is, (Psalm 119:117) “And I will speak of (ואשעה ב־) thy statutes continually”. The phrase (Deuteronomy 28:37) למשל ולשנינה “[thou shalt become] a proverb and a byword” we translate in the Targum by “a topic of conversation (שועי)”, and the word ויספר (Genesis 24:66) “and he related” by ואשתעי “and he spoke about”. One cannot possibly say that the word ישעו has the same meaning as the verbs in (Genesis 4:4) “And the Lord turned (וישע) to Abel” and in (Genesis 4:4) “but to Cain and his offering he did not turn (שעה)”, and that we must translate אל ישעו by “Let them not turn”, for if this were so Scripture should have written אל דברי שקר or לדברי שקר (instead of בדברי) for so is the construction in all such cases. Examples are: (Isaiah 17:7) “A man shall turn to (ישעה אל) his Maker”; (Isaiah 17:8) “and he shall not turn to (ישעה על) the altars”; (Isaiah 31:1) “they turn not unto (שעו על) the Holy One of Israel”. I do not find the construction of a ב following these verbs in the sense of “turning to”, but after an expression of דבר “speaking” — as when one intently directs his conversation upon a matter — the construction with כ is quite an appropriate one. For instance: (Ezekiel 33:30) “those who intently direct their conversation (הנדברים) upon thee (בך)”; (Numbers 12:1) “And Miriam and Aaron directed their speech (ותדבר) upon Moses (במשה)”; (Zechariah 4:1) “And the angel who directed his conversaion (הדובר) upon me (בי)”; (Deuteronomy 11:9) “To turn your conversation (לדבר) intently upon them (בם)”; (Psalm 119:46) “And I will direct my speech (אדברה) upon thy testimonies (בעדותיך)”. So, too, here: ואל ישעו בדברי שקר means “let them not always be conversing about vain and idle matters”."}, {"ch": 5, "v": 10, "aliyah": 7, "heb": "וַיֵּ֨צְא֜וּ נֹגְשֵׂ֤י הָעָם֙ וְשֹׁ֣טְרָ֔יו וַיֹּאמְר֥וּ אֶל־הָעָ֖ם לֵאמֹ֑ר כֹּ֚ה אָמַ֣ר פַּרְעֹ֔ה אֵינֶ֛נִּי נֹתֵ֥ן לָכֶ֖ם תֶּֽבֶן׃", "onk": "וּנְפָקוּ שִׁלְטוֹנֵי עַמָא וְסָרְכוֹהִי וַאֲמָרוּ לְעַמָא לְמֵימָר כִּדְנַן אֲמַר פַּרְעֹה לֵית אֲנָא יָהֵב לְכוֹן תִּבְנָא:", "onk_en": "They went out—the taskmasters of the people and their officers—and spoke to the people, saying, “This is what Pharaoh said, ‘I will no longer give you straw.", "pj": "וּנְפָקוּ שׁוּלְטָנֵי עַמָא וְסַרְכוֹי וַאֲמָרוּ לְעַמָא כִּדְנָא אֲמַר פַּרְעה לֵית אֲנָא יָהִיב לְכוֹן תִּיבְנָא", "pj_en": "And the officers and exactors of the people went forth, and said to the people, Thus saith Pharoh, I will not give you straw;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 11, "aliyah": 7, "heb": "אַתֶּ֗ם לְכ֨וּ קְח֤וּ לָכֶם֙ תֶּ֔בֶן מֵאֲשֶׁ֖ר תִּמְצָ֑אוּ כִּ֣י אֵ֥ין נִגְרָ֛ע מֵעֲבֹדַתְכֶ֖ם דָּבָֽר׃", "onk": "אַתּוּן אֱזִילוּ סִיבוּ לְכוֹן תִּבְנָא מֵאֲתַר דְתַשְׁכְּחוּן אֲרֵי לָא יִתִּמְנַע מִפָּלְחָנְכוֹן מִדָעַם:", "onk_en": "You must go get your own straw wherever you can find it, but your workload must not be reduced.’”", "pj": "אַתּוּן אִיזִילוּ סָבוּ לְכוֹן תִּיבְנָא מִן אָתַר דְתִשְׁכְּחוּן אֲרוּם לָא מִתְמְנַע מִפּוּלְחַנְכוֹן מִדָעַם", "pj_en": "you must go and take straw wherever you can find it; for your work will not in anywise be diminished.", "tj": "", "tj_en": "", "rashi": "<b>אתם לכו קחו לכם תבן.<\/b> וּצְרִיכִים אַתֶּם לֵילֵךְ בִּזְרִיזוּת,<br><br><b>כי אין נגרע מעבדתכם דבר<\/b>, מִכָּל סְכוּם לְבֵנִים שֶׁהֱיִיתֶם עוֹשִׂים לַיּוֹם בִּהְיוֹת הַתֶּבֶן נִתָּן לָכֶם מְזֻמָּן מִבֵּית הַמֶּלֶךְ:", "rashi_en": "אתם לכו קחו לכם תבן GO, YE, TAKE TO YOURSELVES STRAW — and you will have to go pretty quickly,<br><br>כי אין נגרע מעבודתכם דבר FOR THERE SHALL NOT BE DIMINISHED OF YOUR WORK A SINGLE THING from the whole total of bricks which you used to make daily when straw was supplied to you, ready to use, from the king’s store."}, {"ch": 5, "v": 12, "aliyah": 7, "heb": "וַיָּ֥פֶץ הָעָ֖ם בְּכׇל־אֶ֣רֶץ מִצְרָ֑יִם לְקֹשֵׁ֥שׁ קַ֖שׁ לַתֶּֽבֶן׃", "onk": "וְאִתְבַּדַר עַמָא בְּכָל אַרְעָא דְמִצְרָיִם לְגַבָּבָא גִילֵי לְתִבְנָא:", "onk_en": "The people spread out all over Egypt to gather grain-chaff for straw.", "pj": "וְאִתְבַּדַר עַמָא בְכָל אַרְעָא דְמִצְרַיִם לְגַבְבָא גִילֵי לְתִיבְנָא", "pj_en": "And the people were scattered abroad in all the land of Mizraim to gather stubble for the straw.", "tj": "", "tj_en": "", "rashi": "<b>לקשש קש לתבן.<\/b> לֶאֱסֹף אֲסִיפָה, לִלְקֹט לֶקֶט, לְצֹרֶךְ תֶּבֶן הַטִּיט:<br><br><b>קש.<\/b> לְשׁוֹן לִקּוּט, עַל שֵׁם שֶׁדָּבָר הַמִּתְפַּזֵּר הוּא וְצָרִיךְ לְקוֹשְׁשׁוֹ קָרוּי קַשׁ בִּשְׁאָר מְקוֹמוֹת:", "rashi_en": "לקשש קש לתבן means TO MAKE A GATHERING, to make a collection FOR the purpose of STRAW for the clay.<br><br>קש denotes collecting. Because stubble is something that is strewn about and must be gathered (קושש) it is called קש in other passages."}, {"ch": 5, "v": 13, "aliyah": 7, "heb": "וְהַנֹּגְשִׂ֖ים אָצִ֣ים לֵאמֹ֑ר כַּלּ֤וּ מַעֲשֵׂיכֶם֙ דְּבַר־י֣וֹם בְּיוֹמ֔וֹ כַּאֲשֶׁ֖ר בִּהְי֥וֹת הַתֶּֽבֶן׃", "onk": "וְשִׁלְטוֹנַיָא דָחֲקִין לְמֵימָר אַשְׁלִימוּ עוֹבָדֵיכוֹן פִּתְגַם יוֹם בְּיוֹמֵהּ כְּמָא דַהֲוֵיתוּן עָבְדִין כַּד <b>אִתְיְהֵב<\/b> לְכוֹן תִּבְנָא:", "onk_en": "The taskmasters pressured them saying, “You must complete your daily work [quota], just as [<b>you did<\/b>] [before] when there was straw [<b>given to you<\/b>].”", "pj": "וְשׁוּלְטָנַיָא דַחֲקִין לְמֵימָר אַשְׁלִימוּ עֲבִידַתְכוֹן פִּתְגָם יוֹם בְּיוֹמֵיהּ הֵיכְמָא דַהֲוֵיתוּן עָבְדִין כַּד הֲוָה יָהֵיב לְכוֹן תִּיבְנָא", "pj_en": "But the officers were pressing, saying, Fulfil your work day by day, as you did when the straw was given you.", "tj": "", "tj_en": "", "rashi": "<b>אצים.<\/b> דּוֹחֲקִים:<br><br><b>דבר יום ביומו.<\/b> חֶשְׁבּוֹן שֶׁל כָּל יוֹם כַּלּוּ בְּיוֹמוֹ, כַּאֲשֶׁר עֲשִׂיתֶם בִּהְיוֹת הַתֶּבֶן מוּכָן:", "rashi_en": "אצים means PRESSING.<br><br>דבר יום ביומו means the full quantity due each day complete it on that day, as ye used to do when straw was ready at hand."}, {"ch": 5, "v": 14, "aliyah": 7, "heb": "וַיֻּכּ֗וּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר־שָׂ֣מוּ עֲלֵהֶ֔ם נֹגְשֵׂ֥י פַרְעֹ֖ה לֵאמֹ֑ר מַדּ֡וּעַ לֹא֩ כִלִּיתֶ֨ם חׇקְכֶ֤ם לִלְבֹּן֙ כִּתְמ֣וֹל שִׁלְשֹׁ֔ם גַּם־תְּמ֖וֹל גַּם־הַיּֽוֹם׃", "onk": "וּלְקוֹ סָרְכֵי בְּנֵי יִשְׂרָאֵל דִי מַנִיאוּ עֲלֵיהוֹן שִׁלְטוֹנֵי פַרְעֹה לְמֵימָר מָא דֵין לָא אַשְׁלֶמְתּוּן גְזֵרָתְכוֹן לְמִרְמֵי (לִבְנִין) כְּמֵאִתְמַלֵי וּמִדְקָמוֹהִי אַף תְּמַלֵי אַף יוֹמָא דֵין:", "onk_en": "The officers of the B’nei Yisrael were beaten—those whom Pharaoh’s taskmasters had appointed—and were told, “Why have you not completed your quotas of brick making as you did yesterday and before neither yesterday, nor today?”", "pj": "וְלָקוּ סַרְכֵי בְּנֵי יִשְרָאֵל דְמַנוּ עֲלֵיהוֹן שׁוּלְטָנֵי פַרְעה לְמֵימָר לְמָא דֵין לָא אַשְׁלַמְתּוּן גְזֵירַתְכוֹן לְמִירְמֵי לִבְנִין הֵי כְמֵאִיתְמְלֵי וְהֵי כְמִדְקָדָמוֹי אוּף אִיתְמְלֵי אוּף יוֹמָא דֵין", "pj_en": "And the exactors whom Pharoh set over them as officers beat the sons of Israel, saying, Why have not you fulfilled your appointment, to cast (the same number of) bricks as heretofore, today as yesterday?", "tj": "", "tj_en": "", "rashi": "<b>ויכו שטרי בני ישראל.<\/b> הַשּׁוֹטְרִים יִשְׂרְאֵלִים הָיוּ וְחָסִים עַל חַבְרֵיהֶם מִלְּדָחְקָם, וּכְשֶׁהָיוּ מַשְׁלִימִים הַלְּבֵנִים לַנּוֹגְשִׂים שֶׁהֵם מִצְרִיִּים, וְהָיָה חָסֵר מִן הַסְּכוּם, הָיוּ מַלְקִין אוֹתָם עַל שֶׁלֹּא דָּחֲקוּ אֶת עוֹשֵׂי הַמְּלָאכָה; לְפִיכָךְ זָכוּ אוֹתָם שׁוֹטְרִים לִהְיוֹת סַנְהֶדְרִין וְנֶאֱצַל מִן הָרוּחַ אֲשֶׁר עַל מֹשֶׁה וְהוּשַׂם עֲלֵיהֶם, שֶׁנֶּאֱמַר: \"אֶסְפָה לִּי שִׁבְעִים אִישׁ מִזִּקְנֵי יִשְׂרָאֵל וְגוֹ'\" – מֵאוֹתָן שֶׁיָּדַעְתָּ הַטּוֹבָה שֶׁעָשׂוּ בְּמִצְרַיִם – כִּי הֵם זִקְנֵי הָעָם וְשׁוֹטְרָיו (במדבר י\"א), (שמות רבה):<br><br><b>ויכו שטרי בני ישראל אשר שמו נגשי פרעה<\/b> אוֹתָם לְשׁוֹטְרִים <b>עליהם, לאמר מדוע וגו'.<\/b> לָמָּה <b>ויכו<\/b>? שֶׁהָיוּ אוֹמְרִים לָהֶם <b>מדוע לא כליתם גם תמול גם היום<\/b> חֹק הַקָּצוּב עֲלֵיכֶם <b>ללבן<\/b> כִּתְמוֹל הַשְּׁלִישִׁי, שֶׁהוּא יוֹם שֶׁלִּפְנֵי אֶתְמוֹל; וְהוּא הָיָה בִּהְיוֹת הַתֶּבֶן נִתָּן לָהֶם:<br><br><b>ויכו.<\/b> לְשׁוֹן וַיֻּפְעֲלוּ, הֻכּוּ מִיַּד אֲחֵרִים – הַנּוֹגְשִׂים הִכּוּם:", "rashi_en": "ויכו שטרי בני ישראל AND THE BAILIFFS OF THE CHILDREN OF ISRAEL … WERE SMITTEN — These bailiffs were Israelites and they spared their fellow-Israelites, not urging them on to their work. When they handed over the bricks to the taskmasters who were Egyptians and something was deficient in the total they used to beat them because they had not urged on the Israelitish workmen. On this account these bailiffs were privileged to become members of the Sanhedrin later on, and there was taken some of the prophetical spirit that was upon Moses and it was placed upon them, as it is said, (Numbers 11:16) “Gather unto me seventy men of the elders of Israel [whom thou knowest]” — of those about whom thou knowest the kindly acts which they did in Egypt, “for they are the real elders of the people having been their bailiffs” (Exodus Rabbah 5:20).<br><br>ויכו שטרי בני ישראל אשר שמו נגשי פרעה THEN WERE SMITTEN THE BAILIFFS OF THE CHILDREN OF ISRAEL WHOM PHARAOH’S TASKMASTERS HAD PUT as bailiffs עליהם OVER THEM (i. e. over the Israelites) לאמר מדוע וגו׳ SAYING, WHEREFORE etc. — Why were they beaten? because they (the taskmasters) said to them (the bailiffs) WHEREFORE DID YE NOT FINISH (גם תמול גם היום) BOTH YESTERDAY AND TO-DAY THE TASK SET FOR YOU (חקכם) IN MAKING BRICKS as ye did yesterday-in-the-third-degree (כתמול שלשם) — which means the day before yesterday — which was the time when straw was given to them.<br><br>Heb. וַיֻכּוּ They were the object of an action. [The word is in the “hoph’al” conjugation, the recipient of the “hiph’il.”] They were beaten by others; the taskmasters beat them."}, {"ch": 5, "v": 15, "aliyah": 7, "heb": "וַיָּבֹ֗אוּ שֹֽׁטְרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַיִּצְעֲק֥וּ אֶל־פַּרְעֹ֖ה לֵאמֹ֑ר לָ֧מָּה תַעֲשֶׂ֦ה כֹ֖ה לַעֲבָדֶֽיךָ׃", "onk": "וַאֲתוֹ סָרְכֵי בְּנֵי יִשְׂרָאֵל וּצְוָחוּ (קֳדָם) לְפַרְעֹה לְמֵימָר לְמָא תַעְבֵּד כְּדֵין לְעַבְדָיךְ:", "onk_en": "The officers of the B’nei Yisrael came and cried out to Pharaoh, saying “Why are you doing this to your slaves?", "pj": "וְאָתוֹ סַרְכֵי בְּנֵי יִשְרָאֵל וּצְוָוחוּ קֳדָם פַּרְעה לְמֵימַר לְמָא תַעֲבֵיד כְּדֵין לְעַבְדָךְ", "pj_en": "And the foremen came, and cried before Pharoh, saying, Why hast thou dealt thus with thy servants?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 16, "aliyah": 7, "heb": "תֶּ֗בֶן אֵ֤ין נִתָּן֙ לַעֲבָדֶ֔יךָ וּלְבֵנִ֛ים אֹמְרִ֥ים לָ֖נוּ עֲשׂ֑וּ וְהִנֵּ֧ה עֲבָדֶ֛יךָ מֻכִּ֖ים וְחָטָ֥את עַמֶּֽךָ׃", "onk": "תִּבְנָא לָא מִתְיְהֵב לְעַבְדָיךְ וּלְבֵנַיָא אָמְרִין לָנָא עִבִידוּ וְהָא עַבְדָיךְ לָקָן <b>וְחָטָן עֲלֵיהוֹן<\/b> עַמָךְ:", "onk_en": "Your slaves are not given straw, and yet we are told to make bricks. Your slaves are beaten, and it is a sin for your people [<b>sin against them<\/b>].”", "pj": "תִּבְנָא לָא מִתְיַהַב לְעַבְדָךְ וְלִבְנַיָא אָמְרִין לָנָא עִיבִידוּ וְהָא עַבְדָךְ לַקְיָין וּחְיוּבְתְּהוֹן דְעַמָךְ תָּקְפָא וְסַלְקָא", "pj_en": "Thou hast not given thy servants the straw, and (yet) say they to us, Make the bricks; and, behold, they beat thy servants, and the guilty treatment of thy people is strong, but it goeth up!", "tj": "", "tj_en": "", "rashi": "<b>ולבנים אומרים לנו.<\/b> הַנּוֹגְשִׂים <b>עשו<\/b>, כַּמִּנְיָן הָרִאשׁוֹן:<br><br><b>וחטאת עמך.<\/b> אִלּוּ הָיָה נָקוּד פַּתָּח, הָיִיתִי אוֹמֵר שֶׁהוּא דָבוּק, וְדָבָר זֶה חַטַּאת עַמְּךָ הוּא, עַכְשָׁו שֶׁהוּא קָמָץ, שֵׁם דָּבָר הוּא, וְכָךְ פֵּרוּשׁוֹ: וְדָבָר זֶה מֵבִיא חַטָּאת עַל עַמְּךָ, כְּאִלּוּ כָתוּב וְחַטָּאת לְעַמֶּךָ; כְּמוֹ \"כְּבֹאָנָה בֵּית לֶחֶם\" (רות א'), שֶׁהוּא כְּמוֹ לְבֵית לֶחֶם, וְכֵן הַרְבֵּה:", "rashi_en": "ולבנים אמרים לנו AND BRICKS THEY — the taskmasters — SAY TO US עשו MAKE, just as the former number.<br><br>וְחָטָאת עַמֶּךָ BUT THE FAULT IS IN THINE OWN PEOPLE — If the word וחטאת had the vowel Patach under the ט I would say that it is a noun in the construct state, so that the meaning would be, “and this thing is the sin of thy people” But now, since the vowel is Kametz, it is a noun in the absolute case, and its meaning is as follows: “And this thing brings sin upon thy people”, as though it were written וחטאת לעמך. Sirnilarly we find ל omitted in, (Ruth 1:19) “When they were come בית לחם” which is the same as לבית לחם, to Bethlehem, and there are many similar examples."}, {"ch": 5, "v": 17, "aliyah": 7, "heb": "וַיֹּ֛אמֶר נִרְפִּ֥ים אַתֶּ֖ם נִרְפִּ֑ים עַל־כֵּן֙ אַתֶּ֣ם אֹֽמְרִ֔ים נֵלְכָ֖ה נִזְבְּחָ֥ה לַֽיהֹוָֽה׃", "onk": "וַאֲמַר בַּטְלָנִין אַתּוּן בַּטְלָנִין עַל כֵּן אַתּוּן אָמְרִין נֵזֵיל נְדַבַּח <b>קֳדָם<\/b> יְיָ:", "onk_en": "He said, “You are lazy, therefore you say, ‘Let us go sacrifice to [<b>before<\/b>] Adonoy.’", "pj": "וַאֲמַר בַּטְלָנִין אַתּוּן בַּטְלָנִין בְּגִין כֵּן אַתּוּן אָמְרִין נֵזִיל נְדַבַּח נִכְסַת חַגָא קֳדָם אֱלָהָנָא", "pj_en": "But he said, You are idle, idle: therefore you are saying, Let us go and over the sacrifice of a festival before our God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 18, "aliyah": 7, "heb": "וְעַתָּה֙ לְכ֣וּ עִבְד֔וּ וְתֶ֖בֶן לֹא־יִנָּתֵ֣ן לָכֶ֑ם וְתֹ֥כֶן לְבֵנִ֖ים תִּתֵּֽנוּ׃", "onk": "וּכְעַן אֱזִילוּ פְלָחוּ וְתִבְנָא לָא יִתְיְהֵב לְכוֹן וּסְכוֹם לְבֵינַיָא תִּתְּנוּן:", "onk_en": "Now go, get to work. You will not be given straw, and you must deliver your quota of bricks.”", "pj": "וּכְדוּן אִיזִילוּ פְלָחוּ וְתִיבְנָא לָא יִתְיַהֵב לְכוֹן וּסְכוּם לִבְנַיָא תִּתְּנוּן", "pj_en": "And now, go, work; but the straw shall not be given you, yet the number of the bricks you shall produce.", "tj": "", "tj_en": "", "rashi": "<b>ותכן לבנים.<\/b> חֶשְׁבּוֹן הַלְּבֵנִים; וְכֵן \"אֶת הַכֶּסֶף הַמְתֻכָּן\" (מלכים ב י\"ב) – הַמָּנוּי, כְּמוֹ שֶׁאָמוּר בָּעִנְיָן \"וַיָּצֻרוּ וַיִּמְנוּ אֶת הַכֶּסֶף\":", "rashi_en": "ותכן לבנים means THE NUMBER OF THE BRICKS; similar is (2 Kings 12:12) “the money המתכן”, i. e. the money which was counted, just as it states in that passage (v. 11), “and they put it up in bags and counted the money”."}, {"ch": 5, "v": 19, "aliyah": 7, "heb": "וַיִּרְא֞וּ שֹֽׁטְרֵ֧י בְנֵֽי־יִשְׂרָאֵ֛ל אֹתָ֖ם בְּרָ֣ע לֵאמֹ֑ר לֹא־תִגְרְע֥וּ מִלִּבְנֵיכֶ֖ם דְּבַר־י֥וֹם בְּיוֹמֽוֹ׃", "onk": "וַחֲזוֹ סָרְכֵי בְנֵי יִשְׂרָאֵל יָתְהוֹן בְּבִישׁ לְמֵימָר לָא תִמְנְעוּן מִלִבְנֵיכוֹן פִּתְגַם יוֹם בְּיוֹמֵהּ:", "onk_en": "The officers of the B’nei Yisrael realized their bad position, saying, “You must not reduce your daily quota of bricks.”", "pj": "וְחָמוּן סַרְכֵי בְנֵי יִשְרָאֵל יַתְהוֹן בְּבִישׁ לְמֵימָר לָא תִמְנְעוּן מִלִבְנֵיכוֹן דְפִתְגַם יוֹם בְּיוֹמֵי", "pj_en": "And the foremen of the sons of Israel saw that they were in evil, (in his) saying, Ye are not to withhold the assignment of your bricks from day to day.", "tj": "", "tj_en": "", "rashi": "<b>ויראו שטרי בני ישראל.<\/b> אֶת חַבְרֵיהֶם הַנִּרְדִּים עַל יָדָם,<br><br><b>ברע<\/b>, רָאוּ אוֹתָם בְּרָעָה וְצָרָה הַמּוֹצֵאֵת אוֹתָם, בְּהַכְבִּידָם הָעֲבוֹדָה עֲלֵיהֶם <b>לאמר לא תגרעו וגו'<\/b>:", "rashi_en": "ויראו שטרי בני ישראל The meaning is: AND THE BAILIFFS OF THE CHILDREN OF ISRAEL DID SEE [THEM] i. e. their fellow-lsraelites who were ruled by them,<br><br>ברע — they saw them in the misfortune and trouble that befell them, because they had to make the labour hard upon them. לאמר לא תגרעו וגו׳ BY SAYING, YE SHALL NOT DIMINISH etc."}, {"ch": 5, "v": 20, "aliyah": 7, "heb": "וַֽיִּפְגְּעוּ֙ אֶת־מֹשֶׁ֣ה וְאֶֽת־אַהֲרֹ֔ן נִצָּבִ֖ים לִקְרָאתָ֑ם בְּצֵאתָ֖ם מֵאֵ֥ת פַּרְעֹֽה׃", "onk": "וַעֲרָעוּ יָת משֶׁה וְיָת אַהֲרֹן קָיְמִין לְקַדָמוּתְהוֹן בְּמִפַּקְהוֹן מִקֳדָם פַּרְעֹה:", "onk_en": "They met Moshe and Aharon who were waiting to meet them as they were leaving Pharaoh.", "pj": "וַעֲרָעוּ יַת משֶׁה וְיַת אַהֲרן קַיְימִין לִקְדָמוּתְהוֹן בְּמִיפַּקְהוֹן מִן קֳדָם פַּרְעה", "pj_en": "And they met Mosheh and Aharon, who stood before them when they came out from the presence of Pharoh,", "tj": "", "tj_en": "", "rashi": "<b>ויפגעו.<\/b> אֲנָשִׁים מִיִּשְׂרָאֵל <b>את משה ואת אהרן וגו'.<\/b> וְרַבּוֹתֵינוּ דָּרְשׁוּ: כָּל \"נִצִּים\" \"וְנִצָּבִים\" דָּתָן וַאֲבִירָם הָיוּ, שֶׁנֶּ' בָּהֶם \"יָצְאוּ נִצָּבִים\" (במדבר ט״ז:כ״ד), (נדרים ס\"ד):", "rashi_en": "ויפגעו AND THEY MET — men of Israel met — את משה ואהרן וגו׳ MOSES AND AARON etc.; Our Rabbis explained that wherever it speaks of people “quarelling” (2:13; cf. Rashi on that verse) or “standing” these were Dathan and Abiram about whom it is stated (Numbers 16:27) “[And Dathan and Abiram] came out standing” (Nedarim 64b)."}, {"ch": 5, "v": 21, "aliyah": 7, "heb": "וַיֹּאמְר֣וּ אֲלֵהֶ֔ם יֵ֧רֶא יְהֹוָ֛ה עֲלֵיכֶ֖ם וְיִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת־רֵיחֵ֗נוּ בְּעֵינֵ֤י פַרְעֹה֙ וּבְעֵינֵ֣י עֲבָדָ֔יו לָֽתֶת־חֶ֥רֶב בְּיָדָ֖ם לְהׇרְגֵֽנוּ׃", "onk": "וַאֲמָרוּ לְהוֹן <b>יִתְגְלֵי<\/b> יְיָ עֲלֵיכוֹן <b>וְיִתְפְּרַע<\/b> דִי אַבְאֶשְׁתּוּן יָת רֵיחָנָא בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עַבְדוֹהִי לְמִתַּן חַרְבָּא בִּידֵיהוֹן לְקַטָלוּתָנָא:", "onk_en": "They said to them [Moshe and Aharon], “Let Adonoy look at [<b>become revealed to<\/b>] you and judge [<b>take revenge<\/b>]. You have made our aroma abhorrent in the eyes of Pharaoh and in the eyes of his servants, putting a sword in their hands to kill us.”", "pj": "וַאֲמָרוּ לְהוֹן יִתְגְלֵי קֳדָם יְיָ עוּלְבָּנָנָא וּלְחוֹד יִתְפְּרַע מִנְכוֹן דְאַסְרַחֲתּוּן יַת רֵיחָנָא קֳדָם פַּרְעה וְקָדָם עַבְדוֹי דְגֵרַמְתּוּן לְמִיתַּן סַיְיפָא בִידֵיהוֹן לְמִקְטְלָנָא", "pj_en": "and they said to them, Our affliction is manifest before the Lord, but our punishment is from you who have made our smell offensive before Pharoh and his servants; for you have occasioned a sword to be put into their hand to kill us.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 22, "aliyah": 7, "heb": "וַיָּ֧שׇׁב מֹשֶׁ֛ה אֶל־יְהֹוָ֖ה וַיֹּאמַ֑ר אֲדֹנָ֗י לָמָ֤ה הֲרֵעֹ֙תָה֙ לָעָ֣ם הַזֶּ֔ה לָ֥מָּה זֶּ֖ה שְׁלַחְתָּֽנִי׃", "onk": "וְתָב משֶׁה <b>קֳדָם<\/b> יְיָ וַאֲמַר יְיָ לְמָא אַבְאֵשְׁתָּא לְעַמָא הָדֵין וּלְמָא דְנַן שְׁלַחְתָּנִי:", "onk_en": "Moshe returned to [<b>before<\/b>] Adonoy and said, “My Master. Why have You brought harm to this people? Why did You send me?", "pj": "וְתַב משֶׁה לִקֳדָם יְיָ וַאֲמַר יְיָ לְמָא אַבְאֶשְׁתָּא לְעַמָא הָדֵין וּלְמָא דְנַן שְׁלַחְתָּנִי", "pj_en": "And Mosheh returned before the Lord, and said, O Lord, why hast Thou done evil to this people, and wherefore hast Thou sent me?", "tj": "", "tj_en": "", "rashi": "<b>למה הרעתה לעם הזה.<\/b> וְאִם תֹּאמַר מָה אִכְפַּת לְךָ? קוֹבֵל אֲנִי עַל שֶׁשְּׁלַחְתַּנִי (שמות רבה):", "rashi_en": "למה הרעתה לעם הזה WHEREFORE HAST THOU DONE SO EVIL TO THIS PEOPLE? — And if You ask, “What concern is that of yours?” I answer “I have to complain that You have sent me at all” (Exodus Rabbah 5:22)."}, {"ch": 5, "v": 23, "aliyah": 7, "heb": "וּמֵאָ֞ז בָּ֤אתִי אֶל־פַּרְעֹה֙ לְדַבֵּ֣ר בִּשְׁמֶ֔ךָ הֵרַ֖ע לָעָ֣ם הַזֶּ֑ה וְהַצֵּ֥ל לֹא־הִצַּ֖לְתָּ אֶת־עַמֶּֽךָ׃", "onk": "וּמֵעִדַן עַלִית לְוָת פַּרְעֹה לְמַלָלָא בִשְׁמָךְ אַבְאֵשׁ לְעַמָּא הָדֵין וְשֵׁזָבָא לָא שֵׁזַבְתָּא יָת עַמָךְ:", "onk_en": "Ever since I came to Pharaoh to speak in Your Name, he has done harm to this people; and You have not rescued Your people.”", "pj": "וּמִן שַׁעְתָּא דְעָלִית לְוַת פַּרְעה לְמַלָלָא בִשְׁמָךְ אִתְבְּאֵשׁ לְעַמָא הָדֵין וְשֵׁיזְבָא לָא שֵׁיזַבְתָּא יַת עַמָךְ", "pj_en": "From the hour that I went in unto Pharoh to speak in Thy name, this people hath suffered evil, and delivering Thou hast not delivered them.", "tj": "", "tj_en": "", "rashi": "<b>הרע.<\/b> לְשׁוֹן הִפְעִיל הוּא – הִרְבָּה רָעָה עֲלֵיהֶם, וְתַרְגּוּמוֹ \"אַבְאִישׁ\":", "rashi_en": "הרע This is an expression denoting “he has caused something to happen” — he (Pharaoh) has brought even more evil upon them. It must be translated in the Targum by אבאיש “he has treated badly”."}, {"ch": 6, "v": 1, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְפַרְעֹ֑ה כִּ֣י בְיָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔ם וּבְיָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖ם מֵאַרְצֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲמַר יְיָ לְמשֶׁה כְּעַן תֶּחֱזֵי דְאֶעְבֵּד לְפַרְעֹה אֲרֵי בִידָא תַקִיפָא יְשַׁלְחִנוּן וּבִידָא תַקִיפָא יְתָרֵכִנוּן מֵאַרְעֵהּ:", "onk_en": "Adonoy said to Moshe, “Now you will see what I will do to Pharaoh, for by [My] strong hand he will let them go, and by [a] strong hand, he will drive them out of his land.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה כְּדוֹן תֶּחְמֵי מָה אַעֲבֵד לְפַרְעה אֲרוּם בִּידָא תַקִיפְתָּא יִפְטוֹרִינוּן וּבִידָא תַקִיפְתָּא יְתָרֵיכִינוּן מִן אַרְעֵיהּ", "pj_en": "And the Lord said unto Mosheh, Now have I seen what Pharoh hath done: for by a strong hand shall he release them, and with a strong hand drive them forth from his land.", "tj": "", "tj_en": "", "rashi": "<b>עתה תראה וגו'.<\/b> הִרְהַרְתָּ עַל מִדּוֹתַי, לֹא כְאַבְרָהָם שֶׁאָמַרְתִּי לוֹ \"כִּי בְיִצְחָק יִקָּרֵא לְךָ זָרַע\" (בראשית כ\"א), וְאַחַר כָּךְ אָמַרְתִּי לוֹ \"הַעֲלֵהוּ לְעוֹלָה\" וְלֹא הִרְהֵר אַחֲרַי; לְפִיכָךְ <b>עתה תראה.<\/b> הֶעָשׂוּי לְפַרְעֹה תִּרְאֶה, וְלֹא הֶעָשׂוּי לְמַלְכֵי שִׁבְעָה אֻמּוֹת כְּשֶׁאֲבִיאֵם לָאָרֶץ (סנהדרין קי\"א):<br><br><b>כי ביד חזקה ישלחם.<\/b> מִפְּנֵי יָדִי הַחֲזָקָה שֶׁתֶּחֱזַק עָלָיו יְשַׁלְּחֵם:<br><br><b>וביד חזקה יגרשם מארצו.<\/b> עַל כָּרְחָם שֶׁל יִשְׂרָאֵל יְגָרְשֵׁם, לֹא יַסְפִּיקוּ לַעֲשוֹת לָהֶם צֵדָה; וְכֵן הוּא אוֹמֵר \"וַתֶּחֱזַק מִצְרַיִם עַל הָעָם וְגוֹ'\" (שמות י\"ב):", "rashi_en": "עתה תראה וגו׳ NOW THOU SHALT SEE etc. — You have criticised My methods of guiding the world. You are not like Abraham to whom I said. (Genesis 21:12) “for through Isaac shall seed be raised unto thee” and to whom I afterwards said, (Gen 22:2) “bring him up as a burnt offering”, and yet he did not criticise My ways, therefore, עתה תראה NOW THOU SHALT SEE — what will now be done to Pharaoh thou shalt see, but thou shalt not see what will be done to the kings of the seven nations of Canaan when I shall bring them (the Israelites) into the Holy Land (cf. Sanhedrin 111a).<br><br>כי ביד חזקה ישלחם this means: for on account of My strong hand (i. e. the strong hand which I will use against him, the ב in ביד denoting “on account of”) — which will prove strong against him he will send them away.<br><br>וביד חזקה יגרשם מארצו AND WITH A STRONG HAND SHALL HE DRIVE THEM OUT OF HIS LAND — against the will of the Israelites themselves will he drive them out of his land: they will not have sufficient time to prepare provisions for themselves for the journey. So, indeed, does Scripture state: (Exodus 12:33) “And Egypt was urgent (תחזק. lit., was strong) upon the people etc.”."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
