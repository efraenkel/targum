<style>

}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;

}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }

.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }

.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }

.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }

.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }

.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 10, "v": 1, "aliyah": 1, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה בֹּ֖א אֶל־פַּרְעֹ֑ה כִּֽי־אֲנִ֞י הִכְבַּ֤דְתִּי אֶת־לִבּוֹ֙ וְאֶת־לֵ֣ב עֲבָדָ֔יו לְמַ֗עַן שִׁתִ֛י אֹתֹתַ֥י אֵ֖לֶּה בְּקִרְבּֽוֹ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עוּל לְוָת פַּרְעֹה אֲרֵי אֲנָא יַקָרִית יָת לִבֵּהּ וְיָת לִבָּא דְעַבְדוֹהִי בְּדִיל לְשַׁוָאָה אָתַי אִלֵין בֵּינֵיהוֹן:", "onk_en": "Adonoy said to Moshe, “Go in to Pharaoh for I have hardened his heart and [also] the hearts of his servants, so that I will be able to set [perform] these [miraculous] signs in their midst.", "pj": "ויאמר וַאֲמַר יְיָ לְמשֶׁה עוּל לְוַת פַּרְעה אֲרוּם אֲנָא יַקִּירִית יִצְרָא דְלִבֵּיהּ וְיִצְרָא דְלִבְּהוֹן דְעַבְדוֹי מִן בִּגְלַל לְשַׁוָואָה אַתְוָותַי אִלֵין בֵּינֵיהוֹן", "pj_en": "And the Lord spake to Mosheh, Go in unto Pharoh; for I have made strong the design of his heart, and the design of the heart of his servants, to set these My signs among them;", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אל משה בא אל פרעה.<\/b> וְהַתְרֵה בוֹ:<br><br><b>שיתי.<\/b> שׂוּמִי – שֶׁאָשִׁית אֲנִי:", "rashi_en": "ויאמר ה' אל משה בא אל פרעה AND THE LORD SAID UNTO MOSES GO IN UNTO PHARAOH and warn him.<br><br>שתי means my setting (an infinitive of שית), so that the phrase, which literally means “for the sake of my setting these my signs”, denotes “that I may set”."}, {"ch": 10, "v": 2, "aliyah": 1, "heb": "וּלְמַ֡עַן תְּסַפֵּר֩ בְּאׇזְנֵ֨י בִנְךָ֜ וּבֶן־בִּנְךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֙לְתִּי֙ בְּמִצְרַ֔יִם וְאֶת־אֹתֹתַ֖י אֲשֶׁר־שַׂ֣מְתִּי בָ֑ם וִֽידַעְתֶּ֖ם כִּי־אֲנִ֥י יְהֹוָֽה׃", "onk": "וּבְדִיל דְתִשְׁתָּעֵי <b>קֳדָם<\/b> בְּרָךְ וּבַר בְּרָךְ <b>יָת נִסִין דִי עֲבָדִית בְּמִצְרַיִם<\/b> וְיָת אַתְוָתַי דִי שַׁוֵיתִי בְהוֹן וְתִדְעוּן אֲרֵי אֲנָא יְיָ:", "onk_en": "And so that you may relate in the ears of [<b>before<\/b>] your son and grandson how I made a mockery of the Egyptians [<b>the miracles that I performed in Egypt<\/b>], and the miraculous signs I performed among them. You will then know that I am Adonoy.”", "pj": "וּמִן בִּגְלַל דְתַתְנֵי בְּמִשְׁמְעֵי בְּרָךְ וּבַר בְּרָךְ יַת נִיסִין דַעֲבָדִית בְּמִצְרַיִם וְיַת אַתְוָותַי דְשַׁוֵּיתִי בְּהוֹן וְתִנְדְּעוּן אֲרוּם אֲנָא הוּא יְיָ", "pj_en": "and that in the hearing of thy sons and of thy children's children may be told the wonders I have done in Mizraim, and the signs that I set among them, that ye may know that I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>התעללתי.<\/b> שָׂחַקְתִּי, כְּמוֹ \"כִּי הִתְעַלַּלְתְּ בִּי\" (במדבר כ\"ב), \"הֲלֹא כַּאֲשֶׁר הִתְעוֹלֵל בָּהֶם\" (שמואל א' ו'), הָאָמוּר בְּמִצְרַיִם, וְאֵינוֹ לְשׁוֹן פּוֹעֵל וּמַעֲלָלִים, שֶׁאִם כֵּן הָיָה לוֹ לִכְתֹּב עוֹלַלְתִּי, כְּמוֹ \"וְעוֹלֵל לָמוֹ כַּאֲשֶׁר עוֹלַלְתָּ לִי\" (איכה א'), \"אֲשֶׁר עוֹלַל לִי\" (שם):<br><br><b>ולמען תספר.<\/b> בתורה להודיע לדורות: ", "rashi_en": "התעללתי means I HAVE MOCKED, as in, (Numbers 22:29) “Because thou hast mocked (התעללת) me”; (I Samuel 6:6) “Indeed, when he mocked (התעולל) them”, which, also, is said in reference to Egypt. It is not an expression denoting doing and action, for were this so it should have written עוללתי, similar to (Lamentations 1:22) “And do (עולל) unto them as thou hast done (עוללת) unto me”, and to (Lamentations 1:12) “which he has done (עולל) unto me”."}, {"ch": 10, "v": 3, "aliyah": 1, "heb": "וַיָּבֹ֨א מֹשֶׁ֣ה וְאַהֲרֹן֮ אֶל־פַּרְעֹה֒ וַיֹּאמְר֣וּ אֵלָ֗יו כֹּֽה־אָמַ֤ר יְהֹוָה֙ אֱלֹהֵ֣י הָֽעִבְרִ֔ים עַד־מָתַ֣י מֵאַ֔נְתָּ לֵעָנֹ֖ת מִפָּנָ֑י שַׁלַּ֥ח עַמִּ֖י וְיַֽעַבְדֻֽנִי׃", "onk": "וַאֲתָא משֶׁה וְאַהֲרֹן לְוָת פַּרְעֹה וַאֲמָרוּ לֵהּ כִּדְנַן אֲמַר יְיָ אֱלָהָא דִיהוּדָאֵי עַד אִמָתַי מְסָרֵב אַתְּ לְאִתְכְּנָעָא מִן <b>קֳדָמָי<\/b> שַׁלַח עַמִי וְיִפְלְחוּן קֳדָמָי:", "onk_en": "Moshe and Aharon went in to Pharaoh and they said to him, “This is what Adonoy, God of the Hebrews, has said, ‘How long will you refuse to be humbled before Me? Send My people out that they may worship [<b>before<\/b>] Me.", "pj": "וְאָעַל משֶׁה וְאַהֲרן לְוַת פַּרְעה וַאֲמָרוּ לֵיהּ כִּדְנָא אָמַר יְיָ אֱלָהָא דְיִשְרָאֵל עַד אֵימַת מְסָרֵב אַנְתְּ (מִן) לְמִתְכְּנָעָא מִן קֳדָמַי פְּטוֹר יַת עַמִּי וְיִפְלְחוּן קֳדָמַי", "pj_en": "And Mosheh and Aharon went in unto Pharoh, and said to him, Thus saith the Lord, the God of Israel, How long wilt thou refuse to humble thyself before Me? Let My people go, that they may worship before Me.", "tj": "", "tj_en": "", "rashi": "<b>לענת.<\/b> כְּתַרְגּוּמוֹ, \"לְאִתְכְּנָעָא\", וְהוּא מִגִּזְרַת עָנִי – מֵאַנְתָּ לִהְיוֹת עָנִי וְשָׁפָל מִפָּנַי:", "rashi_en": "לענת Translate as the Targum: TO BE HUMBLED. It is of the same derivation as עני poor, so that the passage signifies, “thou refusest to be poor and lowly before Me”."}, {"ch": 10, "v": 4, "aliyah": 1, "heb": "כִּ֛י אִם־מָאֵ֥ן אַתָּ֖ה לְשַׁלֵּ֣חַ אֶת־עַמִּ֑י הִנְנִ֨י מֵבִ֥יא מָחָ֛ר אַרְבֶּ֖ה בִּגְבֻלֶֽךָ׃", "onk": "אֲרֵי אִם סָרֵיב אַתְּ לְשַׁלָחָא יָת עַמִי הָא אֲנָא מַיְיתִי מְחָר גוֹבָא בִּתְחוּמָךְ:", "onk_en": "For if you refuse to send My people out, I will bring locusts within your borders tomorrow.", "pj": "אֲרוּם אִין יֵשׁ מְסָרֵב אַנְתְּ לְמִפְטוֹר יַת עַמִּי הָא אֲנָא מַיְיתֵי מְחַר גּוֹבָא בִּתְחוּמָךְ", "pj_en": "But if thou refuse to let My people go, behold, tomorrow I bring the locust upon thy borders,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 5, "aliyah": 1, "heb": "וְכִסָּה֙ אֶת־עֵ֣ין הָאָ֔רֶץ וְלֹ֥א יוּכַ֖ל לִרְאֹ֣ת אֶת־הָאָ֑רֶץ וְאָכַ֣ל&thinsp;<b>׀<\/b> אֶת־יֶ֣תֶר הַפְּלֵטָ֗ה הַנִּשְׁאֶ֤רֶת לָכֶם֙ מִן־הַבָּרָ֔ד וְאָכַל֙ אֶת־כׇּל־הָעֵ֔ץ הַצֹּמֵ֥חַ לָכֶ֖ם מִן־הַשָּׂדֶֽה׃", "onk": "וַחֲפָא יָת <b>עֵין שִׁמְשָׁא<\/b> דְאַרְעָא וְלָא יִכּוּל לְמֶחֱזֵי יָת אַרְעָא וְיֵכוּל יָת שְׁאָר שֵׁזַבְתָּא דְאִשְׁתָּאַר לְכוֹן מִן בַּרְדָא וְיֵכוּל יָת כָּל אִילָנָא דְאַצְמַח לְכוֹן מִן חַקְלָא:", "onk_en": "They will cover the visible surface [<b>eye of the sun<\/b>] of the land so that one will be unable to see the land. They will eat all that was spared, that remained for you from the hail, and they will eat every tree that grows for you in the field.", "pj": "וְיַחֲפֵי יַת חֶזְוָונָא דְאַרְעָא וְלָא יֶהֱוֵי יָכִיל לְמֶחֲמֵי יַת אַרְעָא וִישֵׁיצֵי יַת שְׁאָר שֵׁיזְבוּתָא דְּאִישְׁתָּאֲרַת לְכוֹן מִן בַּרְדָא וִישֵׁיצֵי יַת כָּל אִילָנָא דְיִצְמַח לְכוֹן מִן חַקְלָא", "pj_en": "and they shall cover the face of the ground, so that it will be impossible to see the ground, and shall destroy the remainder that was spared to you from the hail, and destroy every tree which groweth for you out of the field.", "tj": "", "tj_en": "", "rashi": "<b>את עין הארץ.<\/b> אֶת מַרְאֵה הָאָרֶץ:<br><br><b>ולא יוכל.<\/b> הָרוֹאֶה <b>לראת את הארץ<\/b>, וְלָשׁוֹן קְצָרָה דִּבֵּר:", "rashi_en": "את עין הארץ means THE COLOUR OF THE GROUND.<br><br>ולא יוכל AND HE — i. e. anyone who is looking — WILL NOT BE ABLE TO SEE THE EARTH; it speaks in (uses) an elliptical expression."}, {"ch": 10, "v": 6, "aliyah": 1, "heb": "וּמָלְא֨וּ בָתֶּ֜יךָ וּבָתֵּ֣י כׇל־עֲבָדֶ֘יךָ֮ וּבָתֵּ֣י כׇל־מִצְרַ֒יִם֒ אֲשֶׁ֨ר לֹֽא־רָא֤וּ אֲבֹתֶ֙יךָ֙ וַאֲב֣וֹת אֲבֹתֶ֔יךָ מִיּ֗וֹם הֱיוֹתָם֙ עַל־הָ֣אֲדָמָ֔ה עַ֖ד הַיּ֣וֹם הַזֶּ֑ה וַיִּ֥פֶן וַיֵּצֵ֖א מֵעִ֥ם פַּרְעֹֽה׃", "onk": "וְיִמְלוּן בָּתָּיךְ וּבָתֵּי כָל עַבְדָיךְ וּבָתֵּי כָל מִצְרַיִם דִי לָא חֲזוֹ אֲבָהָתָךְ וַאֲבָהַת אֲבָהָתָךְ מִיוֹמָא דְמֶהֱוֵיהוֹן עַל אַרְעָא עַד יוֹמָא הָדֵין וְאִתְפְּנִי וּנְפַק מִן קֳדָם פַּרְעֹה:", "onk_en": "They will fill your houses, and the houses of all your servants, and the houses of all the Egyptians. [It will be something] that was never seen by your fathers or your fathers’ fathers since the day they were on the earth until this day.’” He [Moshe] then turned and went out from Pharaoh.", "pj": "וְיִתְמְלוּן בָּתָּךְ וּבָתֵּי כָּל עַבְדָךְ וּבָתֵּי כָל מִצְרָאֵי דְלָא חָמוּן אַבְהָתָךְ וְאַבְהַת אַבְהָתָךְ מִן יוֹם מֶהֱוֵיהוֹן עַל אַרְעָא עַד יוֹמָא הָדֵין וְאִתְפְּנֵי וּנְפַק מִלְוַת פַּרְעה", "pj_en": "And they shall fill thy house, and the houses of all thy servants, and the houses of the Mizraee, (the like of) which neither thy fathers nor thy forefathers have seen since the day that they were upon the earth unto this day. And he turned and went out from Pharoh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 7, "aliyah": 1, "heb": "וַיֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗יו עַד־מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֙נוּ֙ לְמוֹקֵ֔שׁ שַׁלַּח֙ אֶת־הָ֣אֲנָשִׁ֔ים וְיַֽעַבְד֖וּ אֶת־יְהֹוָ֣ה אֱלֹהֵיהֶ֑ם הֲטֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם׃", "onk": "וַאֲמָרוּ עַבְדֵי פַרְעֹה לֵהּ עַד אִמָתַי יְהֵי דֵין לָנָא לְתַקְלָא שַׁלַח יָת גֻבְרַיָא וְיִפְלְחוּן קֳדָם יְיָ אֱלָהֲהוֹן הַעַד כְּעַן לָא יְדַעְתָּ אֲרֵי אֲבֵדַת מִצְרָיִם:", "onk_en": "Pharaoh’s servants said to him, “How long will this [man] be a menace to us? Send these men out and let them worship Adonoy, their God. Did you not yet realize that Egypt is [being] destroyed?”", "pj": "וְאָמָרוּ עַבְדֵי פַּרְעה עַד אֵימַת יְהֵי דֵין גַּבְרָא לָנָא לְתַקְלָא פְּטוֹר יַת גַּבְרַיָא וְיִפְלְחוּן קֳדָם יְיָ אֱלָהָהוֹן הַעַד כְּדוֹן לָא חַכִּימְתָּ אֲרוּם עַל יְדוֹי עֲתִידָא לְמוֹבְדָא אַרְעָא דְמִצְרָיִם", "pj_en": "And the servants of Pharoh said, How long shall this man be a stumbling-block to us? Let the men be released, that they may worship before the Lord their God. Art thou not aware that by His hand it will be that the land of Mizraim shall be destroyed?", "tj": "", "tj_en": "", "rashi": "<b>הטרם תדע.<\/b> הַעוֹד לֹא יָדַעְתָּ כִּי אָבְדָה מִצְרַיִם:", "rashi_en": "הטרם תדע means KNOWEST THOU NOT YET that Egypt has perished. (Cf. Rashi on Exodus 9:30.)"}, {"ch": 10, "v": 8, "aliyah": 1, "heb": "וַיּוּשַׁ֞ב אֶת־מֹשֶׁ֤ה וְאֶֽת־אַהֲרֹן֙ אֶל־פַּרְעֹ֔ה וַיֹּ֣אמֶר אֲלֵהֶ֔ם לְכ֥וּ עִבְד֖וּ אֶת־יְהֹוָ֣ה אֱלֹהֵיכֶ֑ם מִ֥י וָמִ֖י הַהֹלְכִֽים׃", "onk": "וְאִתּוֹתַב יָת משֶׁה וְיָת אַהֲרֹן לְוָת פַּרְעֹה וַאֲמַר לְהוֹן אֱזִילוּ פְלָחוּ <b>קֳדָם<\/b> יְיָ אֱלָהֲכוֹן מָן וּמָן דְאָזְלִין:", "onk_en": "Moshe and Aharon were brought back to Pharaoh, and he said to them, “Go worship [<b>before<\/b>] Adonoy, your God. Exactly who will be going?”", "pj": "וּפַקֵּיד לְאִיתּוֹתָבָא יַת משֶׁה וְיַת אַהֲרן לְוַת פַּרְעה וַאֲמַר לְהוֹם אִיזִילוּ פְּלָחוּ קֳדָם יְיָ אֱלָהָכוֹן מָן וּמָן הִינוּן דְּאָזְלִין", "pj_en": "And he commanded to bring back Mosheh and Aharon to Pharoh, and said to them, Go, worship before the Lord your God: but who are they that are to go?", "tj": "", "tj_en": "", "rashi": "<b>ויושב.<\/b> הוּשְׁבוּ עַל יְדֵי שְׁלִיחַ, שֶׁשָּׁלְחוּ אַחֲרֵיהֶם וֶהֱשִׁיבוּם אֶל פַּרְעֹה:", "rashi_en": "ויושב [AND MOSES AND AARON] WERE BROUGHT BACK (The verb has a passive meaning [Hophal], not an active as the particle את before משה and אהרן might lead one to suppose) — They were brought back by a messenger: they (Pharaoh’s servants) sent people after them and these brought them back to Pharaoh."}, {"ch": 10, "v": 9, "aliyah": 1, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה בִּנְעָרֵ֥ינוּ וּבִזְקֵנֵ֖ינוּ נֵלֵ֑ךְ בְּבָנֵ֨ינוּ וּבִבְנוֹתֵ֜נוּ בְּצֹאנֵ֤נוּ וּבִבְקָרֵ֙נוּ֙ נֵלֵ֔ךְ כִּ֥י חַג־יְהֹוָ֖ה לָֽנוּ׃", "onk": "וַאֲמַר משֶׁה בְּעוּלֵמָנָּא וּבְסָבָנָּא נֵזֵיל בְּבָנָנָא וּבִבְנָתָנָא בְּעָנָנָא וּבְתוֹרָנָא נֵזֵיל אֲרֵי חַגָא <b>קֳדָם<\/b> יְיָ לָנָא:", "onk_en": "Moshe said, “With our young and with our old we will go. With our sons, with our daughters, with our sheep and with our cattle we will go, for it is a festival to [<b>before<\/b>] Adonoy for all of us.”", "pj": "וַאֲמַר משֶׁה בְּטַלְיָינָא וּבְסָבָנָא נֵיזִיל בִּבְנָנָא וּבִבְרַתָּנָא בְּעַנָנָא וּבְתוֹרָנָא נֵיזִיל אֲרוּם חַגָא קֳדָם יְיָ לָנָא", "pj_en": "And Mosheh said, With our children and with our old men will we go; with our sons and with our daughters we will go; with our sheep and with our oxen we will go; for we have a solemn feast before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 10, "aliyah": 1, "heb": "וַיֹּ֣אמֶר אֲלֵהֶ֗ם יְהִ֨י כֵ֤ן יְהֹוָה֙ עִמָּכֶ֔ם כַּאֲשֶׁ֛ר אֲשַׁלַּ֥ח אֶתְכֶ֖ם וְאֶֽת־טַפְּכֶ֑ם רְא֕וּ כִּ֥י רָעָ֖ה נֶ֥גֶד פְּנֵיכֶֽם׃", "onk": "וַאֲמַר לְהוֹן יְהֵי כֵן <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדְכוֹן<\/b> כַּד אֲשַּׁלַח יָתְכוֹן וְיָת טַפְלְכוֹן חֲזוֹ אֲרֵי <b>בִישָׁא דְאַתּוּן סְבִירִין לְמֶעְבַּד לָקֳבֵל אַפֵּיכוֹן לְאִסְתַּחָרָא<\/b>:", "onk_en": "He [Pharaoh] said to them, “So be it. May [<b>the Word of<\/b>] Adonoy be with you [<b>your support<\/b>] just as I will send you and your little ones. Beware for evil confronts you [<b>the evil which you intend to commit will be turned against your faces<\/b>].", "pj": "וַאֲמַר לְהוֹן יְהִי כְדֵין מֵימְרָא דַיְיָ בְּסַעַדְכוֹן כְּמָא דְאֶפְטוֹר יַתְכוֹן וְיַת טַפְלְכוֹן חָמוּן אֲרוּם לְתַקָּלָא בִּישָׁא הִיא לְכוֹן לִקְבֵיל אַפֵּיכוֹן בְּאוֹרְחֲכוֹן דִּתְהַלְכוֹן עַד זְמַן דִּי תִמְטוּן לְבֵית אֲתַר מַשְׁרוּיֵיכוֹן", "pj_en": "And he said to them, So may the Word of the Lord be a help to you: (but) how can I release (both) you and your children? The evil offence is in the look of your faces: (you think to go onward) in the way that you would walk, till the time that you shall have come to the house of the place of your habitation.", "tj": "", "tj_en": "", "rashi": "<b>כאשר אשלח אתכם ואת טפכם.<\/b> אַף כִּי אֲשַׁלַּח גַּם אֶת הַצֹּאן וְאֶת הַבָּקָר כַּאֲשֶׁר אֲמַרְתֶּם:<br><br><b>ראו כי רעה נגד פניכם.<\/b> כְּתַרְגּוּמוֹ. וּמִ\"אַ שָׁמַעְתִּי, כּוֹכָב אֶחָד יֵשׁ שֶׁשְּׁמוֹ רָעָה, אָמַר לָהֶם פַּרְעֹה, רוֹאֶה אֲנִי בָּאִצְטַגְנִינוּת שֶׁלִּי אוֹתוֹ כוֹכָב עוֹלֶה לִקְרַאתְכֶם בַּמִּדְבָּר, וְהוּא סִימַן דָּם וַהֲרִיגָה; וּכְשֶׁחָטְאוּ יִשְׂרָאֵל בָּעֵגֶל וּבִקֵּשׁ הַקָּבָּ\"ה לְהָרְגָם, אָמַר מֹשֶׁה בִּתְפִלָּתוֹ, לָמָּה יֹאמְרוּ מִצְרַיִם לֵאמֹר \"בְּרָעָה\" הוֹצִיאָם (שמות ל\"ב), זוֹ הִיא שֶׁאָמַר לָהֶם, רְאוּ כִּי רָעָה נֶגֶד פְּנֵיכֶם; מִיָּד וַיִּנָּחֶם ה' עַל הָרָעָה וְהָפַךְ אֶת הַדָּם לְדַם מִילָה, שֶׁמָּל יְהוֹשֻׁעַ אוֹתָם, וְזֶהוּ שֶׁנֶּ' \"הַיּוֹם גַּלּוֹתִי אֶת חֶרְפַּת מִצְרַיִם מֵעֲלֵיכֶם\" (יהושע ה'), שֶׁהָיוּ אוֹמְרִים לָכֶם, דָּם אָנוּ רוֹאִין עֲלֵיכֶם בַּמִּדְבָּר:", "rashi_en": "כאשר אשלח אתכם ואת טפכם [MAY THE LORD BE WITH YOU] AS I WILL LET YOU AND YOUR LITTLE ONES GO — even though I were to let go also the flocks and herds as you have said.<br><br>ראו כי רעה נגד פניכם Understand this as the Targum takes it: See, the evil you are about to do wilt turn against yourself. I have heard a Midrashic explanation: There is a certain star the name of which is רעה “Evil”. Pharaoh said to them, “By my astrological art I see that star rising towards you in the wilderness whither you wish to proceed. It is an emblem of blood and slaughter”. Consequently, when Israel sinned by worshipping the calf and the Holy One, blessed be He, intended to slay them, Moses said in his prayer, (Exodus 32:12) “Wherefore should the Egyptians speak and say, He brought them forth together with רעה (i. e. under the influence of the star רעה); this is, indeed, what he (Pharaoh) has already said, “See, the ‘רעה’ is before you”. At once, “the Lord bethought Himself concerning ‘רעה’”, and He changed the blood of which this star was an emblem to the blood of the circumcision because indeed Joshua had them circumcised. This is the meaning of what is said, (Joshua 5:9). “This day have I rolled from off you the reproach of the Egyptians”, for they said to you. “We see blood impending over you in the wilderness. (Yalkut Shimoni on Torah 1:392; cf. also Rashi on Joshua 5:9.)"}, {"ch": 10, "v": 11, "aliyah": 1, "heb": "לֹ֣א כֵ֗ן לְכֽוּ־נָ֤א הַגְּבָרִים֙ וְעִבְד֣וּ אֶת־יְהֹוָ֔ה כִּ֥י אֹתָ֖הּ אַתֶּ֣ם מְבַקְשִׁ֑ים וַיְגָ֣רֶשׁ אֹתָ֔ם מֵאֵ֖ת פְּנֵ֥י פַרְעֹֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא כֵן אֱזִילוּ כְעַן גֻבְרַיָא וּפְלָחוּ <b>קֳדָם<\/b> יְיָ אֲרֵי יָתַהּ אַתּוּן בָּעָן וְתָרִיךְ יָתְהוֹן מִן קֳדָם פַּרְעֹה:", "onk_en": "This is not right. [Only] the [adult] men should go and worship [<b>before<\/b>] Adonoy for this is what you desire.” He had them expelled from Pharaoh’s presence.", "pj": "לָא כְמָא דְאַתּוּן סַבְרִין אֱלָהֵן אִיזִילוּ כְּדוֹן גּוּבְרַיָא וּפָלְחוּ קֳדָם יְיָ אֲרוּם יָתֵיהּ אַתּוּן בָּעָן וְתָרִיךְ יַתְהוֹן מִלְוַת אַפֵּי פַּרְעה", "pj_en": "(It shall be) not so as ye devise; but the men only shall go and worship before the Lord; for that it was which ye demanded. And he drave them out from before the face of Pharoh.", "tj": "", "tj_en": "", "rashi": "<b>לא כן.<\/b> כַּאֲשֶׁר אֲמַרְתֶּם לְהוֹלִיךְ הַטַּף עִמָּכֶם, אֶלָּא <b>לכו הגברים ועבדו את ה'<\/b>:<br><br><b>כי אתה אתם מבקשים.<\/b> כִּי אוֹתָהּ בִּקַּשְׁתֶּם עַד הֵנָּה – נִזְבְּחָה לֵאלֹהֵינוּ, וְאֵין דֶּרֶךְ הַטַּף לִזְבֹּחַ:<br><br><b>ויגרש אותם.<\/b> הֲרֵי זֶה לָשׁוֹן קָצָר וְלֹא פֵּרֵשׁ מִי הַמְגָרֵשׁ:", "rashi_en": "לא כן NOT SO as you have said, to take the children with you, but 'לכו נא הגברים ועבדו את ה GO YE WHO ARE ADULT MEN AND SERVE THE LORD.<br><br>כי אתה אתם מבקשים means FOR THAT IS WHAT YE DID SEEK till now: let us sacrifice to our God — and it is not the custom for little children to offer sacrifice.<br><br>ויגרש אותם AND HE DROVE THEM OUT — This is an elliptical phrase and it does not expressly state who drove them out (i. e. the subject of the verb is omitted)."}, {"ch": 10, "v": 12, "aliyah": 2, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה נְטֵ֨ה יָדְךָ֜ עַל־אֶ֤רֶץ מִצְרַ֙יִם֙ בָּֽאַרְבֶּ֔ה וְיַ֖עַל עַל־אֶ֣רֶץ מִצְרָ֑יִם וְיֹאכַל֙ אֶת־כׇּל־עֵ֣שֶׂב הָאָ֔רֶץ אֵ֛ת כׇּל־אֲשֶׁ֥ר הִשְׁאִ֖יר הַבָּרָֽד׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֲרֵים יְדָךְ עַל אַרְעָא דְמִצְרָיִם וְיֵתֵי גוֹבָא וְיִסַק עַל אַרְעָא דְמִצְרָיִם וְיֵכוּל יָת כָּל עִסְבָּא דְאַרְעָא יָת כָּל דִי אַשְׁאַר בַּרְדָא:", "onk_en": "Adonoy said to Moshe, “Stretch out your hand over the land of Egypt for the locusts [to bring the locusts] and they will emerge upon the land of Egypt. They will eat all the vegetation in the land, that remained from [the destruction of] the hail.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֲרֵים יַת יְדָךְ עַל אַרְעָא דְמִצְרָיִם בְּדִיל גּוֹבָא וְיַיסֵק עַל אַרְעָא דְמִצְרָיִם וִישֵׁיצֵי יַת כָּל עִיסְבָּא דְאַרְעָא יַת כָּל מַה דִּי שַׁיֵּיר בַּרְדָא", "pj_en": "And the Lord spake to Mosheh, Lift up thy hand over the land of Mizraim for the locust, that he may come up over the land of Mizraim, and destroy every herb of the earth, whatsoever the hail hath left.", "tj": "", "tj_en": "", "rashi": "<b>בארבה.<\/b> בִּשְׁבִיל מַכַּת הָאַרְבֶּה:", "rashi_en": "בארבה means on account of the plague of locusts (the prefix ב signifies “on account of”)."}, {"ch": 10, "v": 13, "aliyah": 2, "heb": "וַיֵּ֨ט מֹשֶׁ֣ה אֶת־מַטֵּ֘הוּ֮ עַל־אֶ֣רֶץ מִצְרַ֒יִם֒ וַֽיהֹוָ֗ה נִהַ֤ג רֽוּחַ־קָדִים֙ בָּאָ֔רֶץ כׇּל־הַיּ֥וֹם הַה֖וּא וְכׇל־הַלָּ֑יְלָה הַבֹּ֣קֶר הָיָ֔ה וְר֙וּחַ֙ הַקָּדִ֔ים נָשָׂ֖א אֶת־הָאַרְבֶּֽה׃", "onk": "וַאֲרֵים משֶׁה יָת חֻטְרֵהּ עַל אַרְעָא דְמִצְרַיִם וַיְיָ דַבַּר רוּחַ קִדוּמָא בְּאַרְעָא כָּל יוֹמָא הַהוּא וְכָל לֵילְיָא צַפְרָא הֲוָה וְרוּחַ קִדוּמָא נְטַל יָת גוֹבָא:", "onk_en": "Moshe stretched out his rod over the land of Egypt and Adonoy directed an east wind over the land all that day and all the night. When morning came the east wind had carried [brought] the locusts.", "pj": "וַאֲרֵים משֶׁה יַת חוּטְרֵיהּ עַל אַרְעָא דְמִצְרָיִם וַיְיָ דְבַר רוּחַ קִידוּמָא בְּאַרְעָא כָּל יוֹמָא הַהוּא וְכָל לֵילְיָא צַפְרָא הֲוָה וְרוּחַ קִידוּמָא נָטַל יַת גּוֹבָא", "pj_en": "And Mosheh lifted up his rod over the land of Mizraim, and the Lord brought an east wind upon the country all that day and all the night; and in the morning the east wind bare the locust.", "tj": "", "tj_en": "", "rashi": "<b>ורוח הקדים.<\/b> רוּחַ מִזְרָחִית נָשָׂא אֶת הָאַרְבֶּה, לְפִי שֶׁבָּא כְּנֶגְדוֹ, שֶׁמִּצְרַיִם בִּדְרוֹמִית מַעֲרָבִית הָיְתָה, כְּמוֹ שֶׁמְּפֹרָשׁ בְּמָקוֹם אַחֵר:", "rashi_en": "ורוח הקדים THE EAST WIND — It was an east wind that brought the locusts because that came (blew) from the direction opposite to it (to Egypt), since Egypt was in the south-west, relative to Palestine, as it is explained in another place (Numbers 34:3)."}, {"ch": 10, "v": 14, "aliyah": 2, "heb": "וַיַּ֣עַל הָֽאַרְבֶּ֗ה עַ֚ל כׇּל־אֶ֣רֶץ מִצְרַ֔יִם וַיָּ֕נַח בְּכֹ֖ל גְּב֣וּל מִצְרָ֑יִם כָּבֵ֣ד מְאֹ֔ד לְ֠פָנָ֠יו לֹא־הָ֨יָה כֵ֤ן אַרְבֶּה֙ כָּמֹ֔הוּ וְאַחֲרָ֖יו לֹ֥א יִֽהְיֶה־כֵּֽן׃", "onk": "וּסְלֵיק גוֹבָא עַל כָּל אַרְעָא דְמִצְרַיִם וּשְׁרָא בְּכָל תְּחוּם מִצְרָיִם תַּקִיף לַחֲדָא קֳדָמוֹהִי לָא הֲוָה כֵן גוֹבָא דִכְוָתֵהּ וּבַתְרוֹהִי לָא יְהֵי כֵן:", "onk_en": "The locusts came up over the whole land of Egypt, and rested [settled] within all the borders of Egypt. It was very severe. Never before had there been such locusts and never again after them.", "pj": "וּסְלֵיק גּוֹבָא עַל כָּל אַרְעָא דְּמִצְרָיִם וּשְׁרָא בְּכָל תְּחוּם מִצְרָיִם תַּקִּיף לַחֲדָא קֳדָמוֹי לָא הֲוָה כְדֵין קַשְׁיָין גּוֹבָא דִכְוָותֵיהּ וּבַתְרוֹי לָא עָתִיד דִּיהִי כֵן", "pj_en": "And the locust came up over all the land of Mizraim, and settled in all the limits of Mizraim exceedingly strong. Before him there had been no locust so hard, nor will there be like him.", "tj": "", "tj_en": "", "rashi": "<b>ואחריו לא יהיה כן.<\/b> וְאוֹתוֹ שֶׁהָיָה בִימֵי יוֹאֵל שֶׁנֶּ' \"כָּמוֹהוּ לֹא נִהְיָה מִן הָעוֹלָם\" (יואל ב'), לָמַדְנוּ שֶׁהָיָה כָּבֵד מִשֶּׁל מֹשֶׁה. (אוֹתוֹ שֶׁל יוֹאֵל הָיָה) עַ\"יְ מִינִין הַרְבֵּה, שֶׁהָיוּ יַחַד אַרְבֶּה, יֶלֶק, חָסִיל, גָּזָם, אֲבָל שֶׁל מֹשֶׁה לֹא הָיָה אֶלָּא מִין אֶחָד, וְכָמוֹהוּ לֹא הָיָה וְלֹא יִהְיֶה:", "rashi_en": "ואחריו לא יהיה כן NEITHER AFTER THEM SHALL BE SUCH — That plague of locusts which happened during the days of Joel of which it is said, (Joel 2:2) “there hath not been ever the like” — which statement teaches us that it was more grievous than that in the days of Moses — was, however, caused by many species of locusts, together, those called ארבה and ילק and חסיל and גזם; but that which happened in the days of Moses consisted of only one species (the ארבה) and any ארבה like that there never was and never will be."}, {"ch": 10, "v": 15, "aliyah": 2, "heb": "וַיְכַ֞ס אֶת־עֵ֣ין כׇּל־הָאָ֘רֶץ֮ וַתֶּחְשַׁ֣ךְ הָאָ֒רֶץ֒ וַיֹּ֜אכַל אֶת־כׇּל־עֵ֣שֶׂב הָאָ֗רֶץ וְאֵת֙ כׇּל־פְּרִ֣י הָעֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַבָּרָ֑ד וְלֹא־נוֹתַ֨ר כׇּל־יֶ֧רֶק בָּעֵ֛ץ וּבְעֵ֥שֶׂב הַשָּׂדֶ֖ה בְּכׇל־אֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַחֲפָא יָת <b>עֵין שִׁמְשָׁא<\/b> דְכָל אַרְעָא וַחֲשׁוֹכַת אַרְעָא וַאֲכַל יָת כָּל עֶסְבָּא דְאַרְעָא וְיָת כָּל פֵּירֵי אִילָנָא דִי אַשְׁאַר בַּרְדָא וְלָא אִשְׁתָּאַר כָּל יָרוֹקָא בְּאִילָנָא וּבְעֶסְבָּא דְחַקְלָא בְּכָל אַרְעָא דְמִצְרָיִם:", "onk_en": "They covered the visible surface [<b>eye of the sun<\/b>] of the entire land so that the land was darkened. They ate all the vegetation of the land, and all the fruit of the trees that was left [spared] by the hail. No greenery remained on the trees or on the vegetation of the field in the entire land of Egypt.", "pj": "וַחֲפָא יַת חֶזְוָונָא דְכָל אַרְעָא עַד דִּי חֲשׁוֹכַת אַרְעָא וִישֵׁיצֵי יַת כָּל עִיסְבָּא דְאַרְעָא וְיַת כָּל פֵּירֵי אִילָנָא דִי שַׁיֵּיר בַּרְדָא וְלָא אִשְׁתַּיֵּיר כָּל יְרוֹק בְּאִילָנָא וּבְעִיסְבָּא דְחַקְלָא בְּכָל אַרְעָא דְמִצְרָיִם", "pj_en": "And he covered the face of all the land, until the land was darkened, and every herb of the ground was consumed, and all the fruit of the tree that the hail had left; and nothing green of tree or herb of the field was left in all the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>כל ירק.<\/b> עָלֶה יָרֹק, וירדו\"רא בְּלַעַז:", "rashi_en": "כל ירק means any green leaf (not “any herb”, since it speaks of the ירק of the trees); old French verdure."}, {"ch": 10, "v": 16, "aliyah": 2, "heb": "וַיְמַהֵ֣ר פַּרְעֹ֔ה לִקְרֹ֖א לְמֹשֶׁ֣ה וּֽלְאַהֲרֹ֑ן וַיֹּ֗אמֶר חָטָ֛אתִי לַיהֹוָ֥ה אֱלֹֽהֵיכֶ֖ם וְלָכֶֽם׃", "onk": "וְאוֹחִי פַרְעֹה לְמִקְרֵי לְמשֶׁה וּלְאַהֲרֹן וַאֲמַר חָבִית <b>קֳדָם<\/b> יְיָ אֱלָהֲכוֹן וּלְכוֹן:", "onk_en": "Pharaoh hurriedly called for Moshe and Aharon, and he said, “I have sinned to [<b>before<\/b>] Adonoy, your God, and to you.", "pj": "וְאוֹחֵי פַּרְעה וּשְׁדַר פּוּלִין לְמִקְרֵי לְמשֶׁה וּלְאַהֲרן וַאֲמַר חָבִית קֳדָם יְיָ אֱלָהָכוֹן וּלְכוֹן", "pj_en": "And Pharoh made haste, and sent certain to call Mosheh and Aharon. And he said, I have sinned before the Lord your God and against you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 17, "aliyah": 2, "heb": "וְעַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִי֙ אַ֣ךְ הַפַּ֔עַם וְהַעְתִּ֖ירוּ לַיהֹוָ֣ה אֱלֹהֵיכֶ֑ם וְיָסֵר֙ מֵֽעָלַ֔י רַ֖ק אֶת־הַמָּ֥וֶת הַזֶּֽה׃", "onk": "וּכְעַן שְׁבוֹק כְּעַן לְחוֹבִי בְּרַם זִמְנָא הָדָא וְצַלוֹ קָדָם יְיָ אֱלָהֲכוֹן וְיַעְדֵי מִנִי לְחוֹד יָת מוֹתָא הָדֵין:", "onk_en": "Now forgive my sin just this one time and plead with [<b>before<\/b>] Adonoy, your God, just to remove this death from me.”", "pj": "וּכְדוּן שְׁבוֹק כְּדוּן חוֹבִי לְחוֹד זִמְנָא הָדָא וּצְלוּ קֳדָם יְיָ וְיַעֲדֵי מִינִי לְחוֹד יַת מוֹתָא הָדֵין", "pj_en": "But now, pardon my sin only this once, and pray before the Lord, that He would only remove from me this death.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 18, "aliyah": 2, "heb": "וַיֵּצֵ֖א מֵעִ֣ם פַּרְעֹ֑ה וַיֶּעְתַּ֖ר אֶל־יְהֹוָֽה׃", "onk": "וּנְפַק מִלְוָת פַּרְעֹה וְצַלִי <b>קֳדָם<\/b> יְיָ:", "onk_en": "He [Moshe] left Pharaoh’s presence and prayed to [<b>before<\/b>] Adonoy.", "pj": "וּנְפַק מִלְוַת פַּרְעה וְצַלִּי קֳדָם יְיָ", "pj_en": "And he went out from Pharoh, and prayed before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 19, "aliyah": 2, "heb": "וַיַּהֲפֹ֨ךְ יְהֹוָ֤ה רֽוּחַ־יָם֙ חָזָ֣ק מְאֹ֔ד וַיִּשָּׂא֙ אֶת־הָ֣אַרְבֶּ֔ה וַיִּתְקָעֵ֖הוּ יָ֣מָּה סּ֑וּף לֹ֤א נִשְׁאַר֙ אַרְבֶּ֣ה אֶחָ֔ד בְּכֹ֖ל גְּב֥וּל מִצְרָֽיִם׃", "onk": "וַהֲפַךְ יְיָ רוּחָא מַעַרְבָא תַּקִיף לַחֲדָא וּנְטַל יָת גוֹבָא וּרְמָהִי לְיַמָא דְסוּף לָא אִשְׁתָּאַר גוֹבָא חַד בְּכֹל תְּחוּם מִצְרָיִם:", "onk_en": "Adonoy turned a very strong westerly wind, that carried away the locusts, and plunged them into the Reed Sea. Not a single locust remained in all of Egypt’s borders.", "pj": "וַהֲפַךְ יְיָ יַת רוּחָא מִמְעַרְבָא תַּקִּיף לַחֲדָא וּנְטַל יַת גּוֹבָא וְטַלְקֵיהּ לְיַמָּא דְסוּף לָא אִשְׁתְּיַיר גּוֹבָא חָד בְּכָל תְּחוּם מִצְרַיִם וַאֲפִילּוּ מַה דְּמַלְחוּן בְּמָנַיָיא לִצְרוֹךְ מֵיכַלְהוֹן נָשָא הִינוּן רוּחַ מַעֲרְבָא וַאֲזָלוּ", "pj_en": "And the Lord turned a wind from the west of exceeding strength, and it carried away the locust, and bare him to the sea of Suph: there was not one locust left in all the borders of Mizraim. And even such as had been salted in vessels for needed food, those, too, the western wind bare away, and they went.", "tj": "", "tj_en": "", "rashi": "<b>רוח ים.<\/b> רוּחַ מַעֲרָבִי:<br><br><b>ימה סוף.<\/b> אוֹמֵר אֲנִי שֶׁיַּם סוּף הָיָה מִקְצָתוֹ בַּמַּעֲרָב, כְּנֶגֶד כָּל רוּחַ דְּרוֹמִית, וְגַם בְּמִזְרָחָה שֶׁל אֶרֶץ יִשְׂרָאֵל, לְפִיכָךְ רוּחַ יָם תְּקָעוֹ לָאַרְבֶּה בְּיָמָּה סוּף כְּנֶגְדּוֹ. וְכֵן מָצִינוּ לְעִנְיַן תְּחוּמִין שֶׁהוּא פּוֹנֶה לְצַד מִזְרָח, שֶׁנֶּאֱמַר \"מִיַּם סוּף וְעַד יָם פְּלִשְׁתִּים\" (לקמן כג לא) מִמִּזְרָח לְמַעֲרָב, שֶׁיָּם פְּלִשְׁתִּים בַּמַּעֲרָב הָיָה, שֶׁנֶּאֱמַר בַּפְּלִשְׁתִּים \"יוֹשְׁבֵי חֶבֶל הַיָּם גּוֹי כְּרֵתִים\" (צפניה ב'):<br><br><b>לא נשאר ארבה אחד.<\/b> אַף הַמְּלוּחִים שֶׁמָּלְחוּ מֵהֶם:", "rashi_en": "רוח ים is A WEST WIND.<br><br>ימה סוף INTO THE RED SEA — I say that the Red Sea was, as to part of it, in the west opposite the whole southern side of Palestine, and was also eastward of the Land of Israel; therefore a west wind blew the locusts into the Red Sea which was in the opposite direction to the west of Egypt. Thus do we find mentioned regarding the boundaries of Palestine that it (the Red Sea) faces the east of Palestine, since it states, (Exodus 23:31) “[And I will set thy boundaries] from the Red Sea even unto the sea of the Philistines”, which means from east to west since the sea of the Philistines was in the west, as it is said of the Philistines, (Zephaniah 2:5) “the inhabitants of the sea-coast, the nation of the Cherethites (the Philistines)”.<br><br>לא נשאר ארבה אחד THERE REMAINED NOT ONE LOCUST — not even those which they had salted — for they had salted some of them (Exodus Rabbah 13:7)."}, {"ch": 10, "v": 20, "aliyah": 2, "heb": "וַיְחַזֵּ֥ק יְהֹוָ֖ה אֶת־לֵ֣ב פַּרְעֹ֑ה וְלֹ֥א שִׁלַּ֖ח אֶת־בְּנֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאַתְקֵף יְיָ יָת לִבָּא דְפַרְעֹה וְלָא שַׁלַח יָת בְּנֵי יִשְׂרָאֵל:", "onk_en": "Adonoy hardened Pharaoh’s heart, and he did not send out the B’nei Yisrael.", "pj": "וּתְקֵיף יְיָ יַת יִצְרָא דְלִיבָּא דְפַרְעה וְלָא פְּטַר יַת בְּנֵי יִשְרָאֵל", "pj_en": "But the Lord strengthened the design of Pharoh's heart, and he would not release the children of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 21, "aliyah": 2, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה נְטֵ֤ה יָֽדְךָ֙ עַל־הַשָּׁמַ֔יִם וִ֥יהִי חֹ֖שֶׁךְ עַל־אֶ֣רֶץ מִצְרָ֑יִם וְיָמֵ֖שׁ חֹֽשֶׁךְ׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אֲרֵים יְדָךְ עַל צֵית שְׁמַיָא וִיהֵי חֲשׁוֹכָא עַל אַרְעָא דְמִצְרָיִם <b>בָּתַר דְיַעְדֵי קְבֵל לֵילְיָא<\/b>:", "onk_en": "Adonoy said to Moshe, “Stretch out your hand toward the sky, and there will be darkness over the land of Egypt [<b>after the darkness of the night will be removed<\/b>]. The darkness will be tangible.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אֲרֵים יַת יְדָךְ עַל צֵית שְׁמַיָא וִיהִי חֲשׁוֹכָא עַל אַרְעָא דְמִצְרַיִם בִּקְרִיצְתָּא וְיַעֲדֵי בְּקַדְמֵתָא חֲשׁוֹךְ לֵילְיָא", "pj_en": "And the Lord said to Mosheh, Lift up thy hand towards the height of the heavens, and there shall be darkness over all the land of Mizraim, in the morning, at the passing away of the first darkness of the night.", "tj": "וִיהוֹן מְמַשְׁמְשִׁין בַּחֲשׁוֹכָא:", "tj_en": "And they shall serve in darkness.", "rashi": "<b>וימש חשך.<\/b> וְיַחֲשִׁיךְ עֲלֵיהֶם חֹשֶׁךְ יוֹתֵר מֵחֶשְׁכּוֹ שֶׁל לַיְלָה, חֹשֶׁךְ שֶׁל לַיְלָה יַאֲמִישׁ וְיַחֲשִׁיךְ עוֹד:<br><br><b>וימש.<\/b> כְּמוֹ וְיַאֲמֵשׁ; יֵשׁ לָנוּ תֵבוֹת הַרְבֵּה חֲסֵרוֹת אָלֶ\"ף, לְפִי שֶׁאֵין הֲבָרַת הָאָלֶ\"ף נִכֶּרֶת כָּל כָּךְ, אֵין הַכָּתוּב מַקְפִּיד עַל חֶסְרוֹנָהּ, כְּגוֹן \"וְלֹא יַהֵל שָׁם עֲרָבִי\" (ישעיהו י\"ג), כְּמוֹ לֹא יַאֲהֵל – לֹא יַטֶּה אָהֳלוֹ, וְכֵן \"וַתַּזְרֵנִי חַיִל\" (שמואל ב' כ\"ב), כְּמוֹ וַתְּאַזְּרֵנִי; וְאֻנְקְלוֹס תִּרְגֵּם לְשׁוֹן הֲסָרָה, כְּמוֹ לֹא יָמוּשׁ; \"בָּתַר דְּיֶעְדֵּי קְבַל לֵילְיָא\" – כְּשֶׁיַּגִּיעַ סָמוּךְ לְאוֹר הַיּוֹם; אֲבָל אֵין הַדִּבּוּר מְיֻשָּׁב עַל הַוָּי\"ו שֶׁל וְיָמֵשׁ, לְפִי שֶׁהוּא כָתוּב אַחַר וִיהִי חֹשֶׁךְ. וּמִ\"אַ פּוֹתְרוֹ לְשׁוֹן \"מְמַשֵּׁשׁ בַּצָּהֳרַיִם\" (דברים כ\"ח), שֶׁהָיָה כָפוּל וּמְכֻפָּל וְעָב עַד שֶׁהָיָה בוֹ מַמָּשׁ:", "rashi_en": "וימש חשך signifies and it (the darkness mentioned in the preceding phrase, ויהי חשך) shall darken for them the natural darkness to a higher degree than the darkness of night: i. e. the darkness of night shall become even more black and dark.<br><br>וימש means as much as (is a contraction of) ויאמש (a Hiphil form of אמש, evening darkness). We have many words in which an א is omitted; since the sound of the א is not very marked, Scripture is not particular about omitting it. An example is: (Isaiah 13:20) “the Arabian לֹא יַהֵל there”, which is the same as לא יַאֲהֵל, shall not pitch his tent. Similar is, (II Samuel 22:40) “וַתַּזְרֵנִי with strength”, which is the same as וַתְּאַזְרֵנִי “And thou hast girded me” (cf. Psalms 30:12). Onkelos translated it in the sense of removing, from the same root as, (Joshua 1:8) “it shall not depart (ימוש)”, his rendering being, “[and there shall be darkness..] after the darkness of night has departed”, i. e. when the time approaches near to the light of day. But the statement does not then fit with the ו of וימש, because this word is written after ויהי חשך. A Midrashic statement explains it in the sense of (Deuteronomy 28:29) “groping (ממשש feeling) at noon-day”, so that the meaning would be that it was of such a double character and so thick that there was something tangible in it (Exodus Rabbah 14:1-3)."}, {"ch": 10, "v": 22, "aliyah": 2, "heb": "וַיֵּ֥ט מֹשֶׁ֛ה אֶת־יָד֖וֹ עַל־הַשָּׁמָ֑יִם וַיְהִ֧י חֹֽשֶׁךְ־אֲפֵלָ֛ה בְּכׇל־אֶ֥רֶץ מִצְרַ֖יִם שְׁלֹ֥שֶׁת יָמִֽים׃", "onk": "וַאֲרֵים משֶׁה יָת יְדֵהּ עַל צֵית שְׁמַיָא וַהֲוָה חֲשׁוֹךְ קְבֵל בְּכָל אַרְעָא דְמִצְרַיִם תְּלָתָא יוֹמִין:", "onk_en": "Moshe stretched out his hand toward the sky, and there was total darkness in the entire land of Egypt for three days.", "pj": "וַאֲרֵים משֶׁה יַת יְדֵיהּ עַל צֵית שְׁמַיָא וַהֲוָה חֲשׁוֹךְ דִּקְבֵיל בְּכָל אַרְעָא דְמִצְרַיִם תְּלָתָא יוֹמִין", "pj_en": "And Mosheh stretched out his hand towards the height of the heavens, and there was dark darkness in all the land of Mizraim three days.", "tj": "", "tj_en": "", "rashi": "<b>שלשת ימים.<\/b> שִׁלּוּשׁ שֶׁל יָמִים, טרציינ\"א בְּלַעַז, וְכֵן שִׁבְעַת יָמִים בְּכָל מָקוֹם שטיי\"נא שֶׁל יָמִים:<br><br><b>ויהי חשך אפלה: שלשת ימים.<\/b> חֹשֶׁךְ שֶׁל אֹפֶל, שֶׁלֹּא רָאוּ אִישׁ אֶת אָחִיו אוֹתָן ג' יָמִים. וְעוֹד שְׁלוֹשֶׁת יָמִים אֲחֵרִים חֹשֶׁךְ מֻכְפָּל עַל זֶה, שֶׁלֹּא קָמוּ אִישׁ מִתַּחְתָּיו – יוֹשֵׁב אֵין יָכוֹל לַעֲמֹד, וְעוֹמֵד אֵין יָכוֹל לֵישֵׁב; וְלָמָּה הֵבִיא עֲלֵיהֶם חֹשֶׁךְ? שֶׁהָיוּ בְיִשְׂרָאֵל בְּאוֹתוֹ הַדּוֹר רְשָׁעִים וְלֹא הָיוּ רוֹצִים לָצֵאת, וּמֵתוּ בִשְׁלוֹשֶׁת יְמֵי אֲפֵלָה, כְּדֵי שֶׁלֹּא יִרְאוּ מִצְרִיִּים בְּמַפַּלְתָּם וְיֹאמְרוּ, אַף הֵם לוֹקִים כָּמוֹנוּ. וְעוֹד, שֶׁחִפְּשׂוּ יִשְׂרָאֵל וְרָאוּ אֶת כְּלֵיהֶם, וּכְשֶׁיָּצְאוּ וְהָיוּ שׁוֹאֲלִים מֵהֶן וְהָיוּ אוֹמְרִים אֵין בְּיָדֵנוּ כְלוּם, אוֹמֵר לוֹ, אֲנִי רְאִיתִיו בְּבֵיתְךָ, וּבְמָקוֹם פְּלוֹנִי הוּא (שמות רבה):", "rashi_en": "שלשת ימים denotes a triad of days. old French terziane; so, too, שבעת ימים everywhere it occurs denotes in old French a septaine of days (a period of seven days).<br><br>ויהי חשך אפלה … שלשת ימים — there was darkness of gloom when no man saw another during those three days, and there was moreover another period of three days’ darkness twice as thick as this when no man rose from his place: one who happened to be sitting when this second period of darkness began was unable to rise, and one who was then standing was unable to sit down. And why did He bring darkness upon them? Because there were wicked people amongst the Israelites of that generation who had no desire to leave Egypt, and these died during the three days of darkness so that the Egyptians might not see their destruction and say, “These, (the Israelites) too have been stricken as we have”. And a further reason is that the Israelites searched (the darkness came just in order that they might do this) and saw their (the Egyptians’) jewels, and when they were leaving Egypt and asked them for their jewels, and they replied, “We have none at all in our possession”, they answered them, “I have seen it in your house and it is in such and such a place” (cf. Midrash Tanchuma, Bo 1; Exodus Rabbah 14:3)."}, {"ch": 10, "v": 23, "aliyah": 2, "heb": "לֹֽא־רָא֞וּ אִ֣ישׁ אֶת־אָחִ֗יו וְלֹא־קָ֛מוּ אִ֥ישׁ מִתַּחְתָּ֖יו שְׁלֹ֣שֶׁת יָמִ֑ים וּֽלְכׇל־בְּנֵ֧י יִשְׂרָאֵ֛ל הָ֥יָה א֖וֹר בְּמוֹשְׁבֹתָֽם׃", "onk": "לָא חֲזוֹ אֱנָשׁ יָת אֲחוֹהִי וְלָא קָמוּ אֱנָשׁ מִתְּחוֹתוֹהִי תְּלָתָא יוֹמִין וּלְכָל בְּנֵי יִשְׂרָאֵל הֲוָה נְהוֹרָא בְּמוֹתְבָנְהוֹן:", "onk_en": "Man could not see his fellow man, nor could anyone rise from his place for three days. But all the B’nei Yisrael had light in their dwellings.", "pj": "לָא חָמוּן גְּבַר יַת אָחוֹי וְלָא קָמוּן אֱנַשׁ מֵאַתְרֵיהּ תְּלָתָא יוֹמִין וּלְכָל בְּנֵי יִשְרָאֵל הֲוָה נְהוֹרָא לְמִקְבּוֹר רַשִׁיעַיָא דִי בֵינֵיהוֹן דְּמִיתַן וְזַכָּאַיָא לְמֶעֱסוֹק בְּמִצְוָתָא בְּמוֹתְבָנֵיהוֹן", "pj_en": "No man saw his brother, and none arose from his place three days. But among all the sons of Israel there was light, that the wicked among them who died might be buried, and that the righteous might be occupied with the precepts of the law in their dwellings.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 24, "aliyah": 3, "heb": "וַיִּקְרָ֨א פַרְעֹ֜ה אֶל־מֹשֶׁ֗ה וַיֹּ֙אמֶר֙ לְכוּ֙ עִבְד֣וּ אֶת־יְהֹוָ֔ה רַ֛ק צֹאנְכֶ֥ם וּבְקַרְכֶ֖ם יֻצָּ֑ג גַּֽם־טַפְּכֶ֖ם יֵלֵ֥ךְ עִמָּכֶֽם׃", "onk": "וּקְרָא פַרְעֹה לְמשֶׁה וַאֲמַר אֱזִילוּ פְּלָחוּ <b>קֳדָם<\/b> יְיָ לְחוֹד עָנְכוֹן וְתוֹרְכוֹן שְׁבוּקוּ אַף טַפְלְכוֹן יֵזֵיל עִמְכוֹן:", "onk_en": "Pharaoh called to Moshe, and he said, “Go! Worship [<b>before<\/b>] Adonoy. Just let your sheep and cattle stay behind. Even your little ones can go with you.”", "pj": "וּבְסוֹף תְּלָתָא יוֹמִין קָרָא פַּרְעה לְמשֶׁה וַאֲמַר זִילוּ פְלָחוּ קֳדָם יְיָ לְחוֹד עַנְכוֹן וְתוֹרֵיכוֹן יְקוּם גַּבִּי אוּף טַפְלְכוֹן יֵזִיל עִמְכוֹן", "pj_en": "And at the end of three days Pharoh called Mosheh, and said, Go, worship before the lord; only your sheep and your oxen shall abide with me: your children also may go with you.", "tj": "", "tj_en": "", "rashi": "<b>יצג.<\/b> יְהֵא מֻצָּג בִּמְקוֹמוֹ:", "rashi_en": "יצג means SHALL REMAIN STANDING in its place."}, {"ch": 10, "v": 25, "aliyah": 3, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה גַּם־אַתָּ֛ה תִּתֵּ֥ן בְּיָדֵ֖נוּ זְבָחִ֣ים וְעֹלֹ֑ת וְעָשִׂ֖ינוּ לַיהֹוָ֥ה אֱלֹהֵֽינוּ׃", "onk": "וַאֲמַר משֶׁה אַף אַתְּ תִּמְסַר בִּידָנָא נִכְסַת קֻדְשִׁין וַעֲלָוָן וְנַעְבֵּד קֳדָם יְיָ אֱלָהָנָא:", "onk_en": "Moshe said, “You too will give us sacrifices and burnt-offerings that we will make [offer] to [<b>before<\/b>] our God.", "pj": "וַאֲמַר משֶׁה אוּף אַנְתְּ תִּתֵּן בִּידָנָא נִכְסַת קוּדְשִׁין וְעַלְוָון וְנַעֲבֵיד קֳדָם יְיָ אֱלָהָנָא", "pj_en": "But Mosheh said, Thou must also give into our hands holy oblations and burnt offerings, that we may perform service before the Lord our God.", "tj": "", "tj_en": "", "rashi": "<b>גם אתה תתן.<\/b> לֹא דַּיְּךָ שֶׁמִּקְנֵנוּ יֵלֵךְ עִמָּנוּ אֶלָּא גַּם מִשֶּׁלְּךָ תִּתֵּן:", "rashi_en": "גם אתה תתן THOU MUST GIVE ALSO — It will not be enough for you that our cattle will go with us but you will give also of yours."}, {"ch": 10, "v": 26, "aliyah": 3, "heb": "וְגַם־מִקְנֵ֜נוּ יֵלֵ֣ךְ עִמָּ֗נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣נּוּ נִקַּ֔ח לַעֲבֹ֖ד אֶת־יְהֹוָ֣ה אֱלֹהֵ֑ינוּ וַאֲנַ֣חְנוּ לֹֽא־נֵדַ֗ע מַֽה־נַּעֲבֹד֙ אֶת־יְהֹוָ֔ה עַד־בֹּאֵ֖נוּ שָֽׁמָּה׃", "onk": "וְאַף בְּעִירָנָא יֵזֵיל עִמָנָא לָא תִשְׁתָּאַר <b>מִדַעַם<\/b> אֲרֵי מִנֵהּ אֲנַחְנָא נָסְבִין לְמִפְלַח <b>קֳדָם<\/b> יְיָ אֱלָהָנָא וַאֲנַחְנָא לֵית אֲנַחְנָא יָדְעִין מָה נִפְלַח <b>קֳדָם<\/b> יְיָ עַד מֵיתָנָא תַּמָן:", "onk_en": "Our own flocks will also go with us. Not a single hoof [<b>thing<\/b>] will remain. We must take from them to worship [<b>before<\/b>] Adonoy our God; since we do not know with what [animals] we will worship [<b>before<\/b>] Adonoy until we get there.”", "pj": "וְאוּף גֵּיתָנָא יֵזִיל עִמָּנָא לָא תִשְׁתַּיֵּיר מִנְהוֹן פַּרְסָתָא חָדָא אֲרוּם מִנְהוֹן נִסַּב לְמִפְלַח קֳדָם יְיָ אֱלָהָן וַאֲנַחְנָא אִין נַשְׁבִּיקִינוּן לֵית אֲנַן יַדְעִין מִמָא נִפְלַח קֳדָם יְיָ עַד מֵיתָנָא לְתַמָּן", "pj_en": "Our flocks, moreover, must go with us; not one hoof of them shall remain; for from them we are to take, to do service before the Lord our God. We cannot leave them; for we know not (as yet) in what manner we are to worship before the Lord, until we come thither.", "tj": "", "tj_en": "", "rashi": "<b>פרסה.<\/b> פַּרְסַת רֶגֶל, פלנ\"טא בְּלַעַז:<br><br><b>לא נדע מה נעבד.<\/b> כַּמָּה תִּכְבַּד הָעֲבוֹדָה, שֶׁמָּא יִשְׁאַל יוֹתֵר מִמַּה שֶּׁיֵּשׁ בְּיָדֵנוּ:", "rashi_en": "פרסה is the hoof of the foot; in old French plante.<br><br>לא נדע מה נעבד means WE DO NOT KNOW WITH WHAT WE MUST SERVE we do not know how heavy will be the service: perhaps He will ask more than we have in our possession."}, {"ch": 10, "v": 27, "aliyah": 3, "heb": "וַיְחַזֵּ֥ק יְהֹוָ֖ה אֶת־לֵ֣ב פַּרְעֹ֑ה וְלֹ֥א אָבָ֖ה לְשַׁלְּחָֽם׃", "onk": "וְאַתְקֵיף יְיָ יָת לִבָּא דְפַרְעֹה וְלָא אָבָה לְשַׁלָחוּתְהוֹן:", "onk_en": "Adonoy hardened Pharaoh’s heart and he was [no longer] willing to send them away.", "pj": "וּתְקֵיף יְיָ יַת יִצְרָא דְלִבָּא דְפַרְעה וְלָא צְבָא לְמִפְטְרִינוּן", "pj_en": "But the Lord made strong the design of Pharoh's heart, and he would not release them.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 28, "aliyah": 3, "heb": "וַיֹּֽאמֶר־ל֥וֹ פַרְעֹ֖ה לֵ֣ךְ מֵעָלָ֑י הִשָּׁ֣מֶר לְךָ֗ אַל־תֹּ֙סֶף֙ רְא֣וֹת פָּנַ֔י כִּ֗י בְּי֛וֹם רְאֹתְךָ֥ פָנַ֖י תָּמֽוּת׃", "onk": "וַאֲמַר לֵהּ פַּרְעֹה אִזֵיל מֵעִלָוָי אִסְתַּמַר לָךְ לָא תוֹסִיף לְמֶחֱזֵי אַפַּי אֲרֵי בְּיוֹמָא דְתֶחֱזֵי אַפַּי תְּמוּת:", "onk_en": "Pharaoh said to him [Moshe] “Leave my presence. Beware! Do not see my face again; for on the day you see my face you will die.”", "pj": "וַאֲמַר לֵיהּ פַּרְעה אִיזֵל מֵעִילַוָוי אִיזְדַהַר לָךְ לָא תוֹסִיף לְמֶחֱמֵי סְבַר אַפַּי לְמַלָלָא קֳדָמַי חֲדָא מִן מִלַיָא קַשְׁיָיתָא כְּאִלֵּין אֲרוּם בְּיוֹמָא דְאַתְּ חָמֵי סְבַר אַפַּי יִתְקוֹף רוּגְזִי בָךְ וְאֶמְסוֹר יָתָךְ בְּיַד בְּנֵי נְשָׁא אִילֵין דַּהֲווֹ תַּבְעִין נַפְשָׁךְ לְמִיסַב יָתָהּ", "pj_en": "And Pharoh said to him, Go from me. Beware that thou add not to see my face to speak before me one of these words that are so hard: for in the day that thou seest my face, my anger will grow strong against thee, and I will deliver thee into the hands of the men who seek thy life to take it.", "tj": "וַאֲמַר לֵיהּ פַּרְעה זִיל מֵעִלַוַי אִזְדַהַר בָּךְ דְּלָא יִתְקוֹף רוּגְזִי בָּךְ לְמֵימָר הֲלָא מִלַיָא קַשְׁיָתָא הָאִילֵין דְּאַתְּ אָמַר לִי בְּרַם צָבֵי הוּא פַּרְעה לִמְמוּת וְלָא לְמֶהֱוֵי שְׁמַע לְמִילָךְ אִיזְדַהַר דְּלָא יִתְקוֹף רוּגְזִי בָּךְ וְאֶמְסוֹר יָתָךְ בֵּין יְדֵיהוֹן דְּעַמָּא הָאִילֵין דִּתְבָעוּ יַת נַפְשָׁךְ לְמִקְטוֹל יָתָךְ:", "tj_en": "And Pharoh said to him, Go from me. Beware that thou increase not my anger against thee by saying, Are not these hard words that thou speakest to me? Verily Pharoh would rather die than hear thy words. Beware, lest my anger grow strong against thee, and I deliver thee into the hands of this people, who require thy life to slay thee.", "rashi": "", "rashi_en": ""}, {"ch": 10, "v": 29, "aliyah": 3, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה כֵּ֣ן דִּבַּ֑רְתָּ לֹא־אֹסִ֥ף ע֖וֹד רְא֥וֹת פָּנֶֽיךָ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַאֲמַר משֶׁה <b>יָאוּת מַלֵילְתָּא<\/b> לָא אוֹסִיף עוֹד לְמֶחֱזֵי אַפָּיךְ:", "onk_en": "Moshe said, “As you say. [<b>You have spoken well.<\/b>] I will not see your face again.”", "pj": "וַאֲמַר משֶׁה יָאוּת מַלֵּילְתָּא אֲנָא עַד דַּהֲוֵינָא יָתִיב בְּמִדְיָן אִיתְאֲמַר לִי בְּמֵימַר מִן קֳדָם יְיָ דְגוּבְרַיָא דְבָעוּ לְמִקְטְלִי נַחֲתוּ מִנִּכְסֵיהוֹן וְהִינוּן חֲשִׁיבִין כְּמִיתַיָא וְלָא מִן סוּף דַּהֲוָה עֲלָךְ רַחֲמִין הֲוֵינָא מְצַלֵּי וּמַחְתָא הֲוָה מִתְכַּלְיָא מִינָךְ וּכְדוֹן לָא אוֹסִיף תּוּב לְמֶחֱמֵי סְבַר אַפָּךְ", "pj_en": "And Mosheh said, Thou hast spoken fairly. While I was dwelling in Midian, it was told me in a word from before the Lord, that the men who had sought to kill me had fallen from their means, and were reckoned with the dead. At the end there will be no mercy upon thee; but I will pray, and the plague shall be restrained from thee. And now I will see thy face no more.", "tj": "וַאֲמַר משֶׁה קוּשְׁטָא מַלֵּילְתָּא מְבַשֵּׂר אֲנָא מִן זִמְנָא קַדְמַיָא עַד דַּאֲנָא יָתֵיב בְּמִדְיָן אֲרוּם מִיתוּ כָּל גּוּבְרַיָא דַּהֲווֹ תַבְעִין יַת נַפְשִׁי לְמִקְטוֹל לָא מִן סוֹף דַּהֲוָה לָךְ רַחֲמִין דַּהֲוֵינָא מְצַלֵּי עֲלָךְ וּמְחָתָא מִתְכְּלַיָא בְּרַם מְחָתָא עֲשִירָא הִיא לְפַרְעה מִן בְּרָךְ בּוּכְרָךְ וַאֲמַר לֵיהּ משֶׁה יָאוּת כְּדֵין קוּשְׁטָא מַלֵּילְתָּא לָא אוֹסִיף עוֹד לְמֶיחֲמֵי סְבַר אַפָּךְ:", "tj_en": "And Mosheh said, Thou hast spoken truly. But it was certified to me at the former time when I dwelt in Midian, that all the men were dead who sought to kill my life. At the end there will be no mercy upon thee. Yet I will pray for thee, and this plague shall be restrained. But a tenth plague is for Pharoh, of (which the victim will be) thy firstborn son. And Mosheh said to him, Thou hast spoken fairly the truth: I will see thy face no more.", "rashi": "<b>כן דברת.<\/b> יָפֶה דִּבַּרְתָּ וּבִזְמַנּוֹ דִּבַּרְתָּ. אֱמֶת שֶׁלֹּא אוֹסִיף עוֹד רְאוֹת פָּנֶיךָ (מכילתא ושמות רבה):", "rashi_en": "כן דברת signifies RIGHTLY HAST THOU SPOKEN, and in its proper time hast thou spoken; for it is true that I will not see thy face again (Mekhilta; Exodus Rabbah 18:1; cf. also Onkelos)."}, {"ch": 11, "v": 1, "aliyah": 3, "heb": "וַיֹּ֨אמֶר יְהֹוָ֜ה אֶל־מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל־פַּרְעֹה֙ וְעַל־מִצְרַ֔יִם אַֽחֲרֵי־כֵ֕ן יְשַׁלַּ֥ח אֶתְכֶ֖ם מִזֶּ֑ה כְּשַׁ֨לְּח֔וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְכֶ֖ם מִזֶּֽה׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה עוֹד מַכְתַּשׁ חַד אַיְתִי עַל פַּרְעֹה וְעַל מִצְרַיִם בָּתַר כֵּן יְשַׁלַח יָתְכוֹן מִכָּא כְּשַׁלָחוּתֵהּ גְמֵירָא תָּרָכָא יְתָרֵךְ יָתְכוֹן מִכָּא:", "onk_en": "Adonoy said to Moshe, “There is one more plague that I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away, he will actually drive you out from here completely.", "pj": "וַאֲמַר יְיָ לְמשֶׁה תּוּב מַכְתַּשׁ חַד אֲנָא מַיְיתִי עֲלוֹי פַּרְעה וְעִילוֹי מִצְרָאֵי דְקָשֵׁי עֲלֵיהוֹן מִכֻּלְהוֹן וּמִבָּתַר כְּדֵין יִפְטוֹר יַתְכוֹן מִכָּא בְּמִפְטְרֵיהּ גְּמִירָא יְהֵי לֵיהּ מַטְרֵד יִטְרוֹד יַתְכוֹן מִכָּא", "pj_en": "And the Lord spake unto Mosheh, Yet one stroke will I bring upon Pharoh and upon the Mizraee, which shall be greater than all, and afterward will he send you hence: when he releases, there shall be to himself an end: driving, he will drive you forth from hence.", "tj": "", "tj_en": "", "rashi": "<b>כלה.<\/b> גְּמֵירָא; כָּלִיל, כֻּלְּכֶם יְשַׁלַּח:", "rashi_en": "כלה Onkelos renders it by גמירא, taking כלה in sense of כליל entirely; i. e. he will send all of you away."}, {"ch": 11, "v": 2, "aliyah": 3, "heb": "דַּבֶּר־נָ֖א בְּאׇזְנֵ֣י הָעָ֑ם וְיִשְׁאֲל֞וּ אִ֣ישׁ&thinsp;<b>׀<\/b> מֵאֵ֣ת רֵעֵ֗הוּ וְאִשָּׁה֙ מֵאֵ֣ת רְעוּתָ֔הּ כְּלֵי־כֶ֖סֶף וּכְלֵ֥י זָהָֽב׃", "onk": "מַלֵיל <b>כְּעַן קֳדָם<\/b> עַמָא וְיִשְׁאַלוּן גְבַר מִן חַבְרֵהּ וְאִתְּתָא מִן חַבֶרְתַּהּ מָנִין דִכְסַף וּמָנִין דִדְהָב:", "onk_en": "Speak, please [<b>now<\/b>], in the ears of [<b>before<\/b>] the people, and let each man request [borrow] from his friend, and each woman from her friend, articles of silver and articles of gold.”", "pj": "מַלֵּיל כְּדוֹן בְּמִשְׁמָעֵיהוֹן דְּעַמָּא וִישַׁיְילוּן גְּבַר מִן רַחֲמֵיהּ מִצְרָאֵי וְאִתְּתָא מִן רְחִימָא מִצְרֵיתָא מָאנִין דִּכְסַף וּמָאנִין דִּדְהַב", "pj_en": "Speak now in the hearing of the people, That every man shall demand from his Mizraite friend, and every woman of her Mizraite friend, vessels of silver and vessels of gold.", "tj": "", "tj_en": "", "rashi": "<b>דבר נא.<\/b> אֵין נָא אֶלָּא לְשׁוֹן בַּקָּשָׁה, בְּבַקָּשָׁה מִמְּךָ הַזְהִירֵם עַל כָּךְ, שֶׁלֹּא יֹאמַר אוֹתוֹ צַדִּיק אַבְרָהָם \"וַעֲבָדוּם וְעִנּוּ אוֹתָם\" (בראשית ט\"ו), קִיֵּם בָּהֶם, \"וְאַחֲרֵי כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל\" (שם), לֹא קִיֵּם בָּהֶם:", "rashi_en": "דבר נא SPEAK נא — The word נא is always an expression of entreaty. Here it means: I entreat you, admonish them about this which follows (impress this injunction upon them), so that righteous man, Abraham, may not say: the prophecy (Genesis 15:13) “they shall serve them, and they shall afflict them” He permitted to be fulfilled in them, but the promise (Genesis 15:14) “and afterwards they shall go forth with great substance” He did not bring to fulfilment for them (Berakhot 9a-b)."}, {"ch": 11, "v": 3, "aliyah": 3, "heb": "וַיִּתֵּ֧ן יְהֹוָ֛ה אֶת־חֵ֥ן הָעָ֖ם בְּעֵינֵ֣י מִצְרָ֑יִם גַּ֣ם&thinsp;<b>׀<\/b> הָאִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּאֶ֣רֶץ מִצְרַ֔יִם בְּעֵינֵ֥י עַבְדֵֽי־פַרְעֹ֖ה וּבְעֵינֵ֥י הָעָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיהַב יְיָ יָת עַמָא לְרַחֲמִין בְּעֵינֵי מִצְרָיִם אַף גַבְרָא משֶׁה רַב לַחֲדָא בְּאַרְעָא דְמִצְרַיִם בְּעֵינֵי עַבְדֵי פַרְעֹה וּבְעֵינֵי עַמָא:", "onk_en": "Adonoy gave the people favor in the eyes of the Egyptians. Moshe too was very great in the land of Egypt, [both] in the eyes of Pharaoh’s servants and in the eyes of the people.", "pj": "וִיהַב יְיָ יַת עַמָּא לְרַחֲמִין קֳדָם מִצְרָאֵי אוּף גַּבְרָא משֶׁה רַב לַחֲדָא בְּאַרְעָא דְמִצְרַיִם קֳדָם עַבְדֵי פַרְעה וּקְדָם עַמָּא", "pj_en": "And the Lord gave the people favour before the Mizraee; also the man Mosheh was very great in the land of Mizraim before the servants of Pharoh and before his people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 4, "aliyah": 4, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהֹוָ֑ה כַּחֲצֹ֣ת הַלַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּת֥וֹךְ מִצְרָֽיִם׃", "onk": "וַאֲמַר משֶׁה כִּדְנַן אֲמַר יְיָ כְּפַלְגוּת לֵילְיָא אֲנָא <b>מִתְגְלִי<\/b> בְּגוֹ מִצְרָיִם:", "onk_en": "Moshe said, “This is what Adonoy has said, About the time of midnight, I will go out [<b>become revealed<\/b>] in the midst of Egypt.", "pj": "וַאֲמַר משֶׁה לְפַרְעה כִּדְנָא אָמַר יְיָ לֵילְיָא חוֹרַן בְּשַׁעְתָּא דָא אֲנָא מִתְגְּלֵי בְּגוֹ מִצְרָאֵי", "pj_en": "And Mosheh spake (or, had spoken) to Pharoh, Thus saith the Lord, At this hour of the following night will I be revealed in the midst of the Mizraee,", "tj": "", "tj_en": "", "rashi": "<b>ויאמר משה כה אמר ה'.<\/b> בְּעָמְדוֹ לִפְנֵי פַרְעֹה נֶאֶמְרָה לוֹ נְבוּאָה זוֹ, שֶׁהֲרֵי מִשֶּׁיָּצָא מִלְּפָנָיו לֹא הוֹסִיף רְאוֹת פָּנָיו:<br><br><b>כחצת הלילה.<\/b> כְּהֵחָלֵק הַלַּיְלָה: <b>כחצת.<\/b> כְּמוֹ \"בַּעֲלוֹת\" (מלכים א י\"ח), \"בַּחֲרוֹת אַפָּם בָּנוּ\" (תהילים קכ\"ד), זֶהוּ פְּשׁוּטוֹ לְיַשְּׁבוֹ עַל אָפְנָיו, שֶׁאֵין חֲצוֹת שֵׁם דָּבָר שֶׁל חֲצִי. וְרַבּוֹתֵינוּ דְרָשׁוּהוּ כְּמוֹ כַּחֲצִי הַלַּיְלָה, וְאָמְרוּ שֶׁאָמַר מֹשֶׁה \"כַּחֲצוֹת\", שֶׁמַּשְׁמַע סָמוּךְ לוֹ, אוֹ לְפָנָיו אוֹ לְאַחֲרָיו, וְלֹא אָמַר \"בַּחֲצוֹת\", שֶׁמָּא יִטְעוּ אִצְטַגְנִינֵי פַרְעֹה וְיֹאמְרוּ מֹשֶׁה בַּדַּאי הוּא (ברכות ד'):", "rashi_en": "ויאמר משה כה אמר ה AND MOSES SAID, THUS SAITH THE LORD — Whilst he was still standing before Pharaoh this prophecy was spoken to him, because after he left him, he did not see his face again (Exodus Rabbah 18:1).<br><br>כחצות הלילה means, WHEN THE NIGHT IS DIVIDED (i. e., when midnight arrives). כחצות is an infinitive with prefix, of similar form to, (1 Kings 18:36) בעלות, “when went up” and (Psalms 124:3) “when their wrath was kindled (בחרות)”. This is its literal meaning which fits in with the sense, for חצות is not a noun, being another form of חֵצִי (when the meaning would be about midnight I will go out etc.”, for this does not fit in with the sense, since God would certainly have stated exactly when He would do this). But our Rabbis took it in this sense and explained it as meaning “about the middle of the night”, and they asserted that Moses said כחצות “about midnight”, which implies near to it — either just before it or just after it, and he did not say בחצות “at midnight” (as God had bidden him say) because he feared lest Pharaoh’s astrologers might make a mistake as regards the time when the slaughter of the firstborn actually took place, thinking that it was a little earlier or later than midnight, and would say, in consequence of this error, “Moses is a liar!” (cf. Berakhot 4a)."}, {"ch": 11, "v": 5, "aliyah": 4, "heb": "וּמֵ֣ת כׇּל־בְּכוֹר֮ בְּאֶ֣רֶץ מִצְרַ֒יִם֒ מִבְּכ֤וֹר פַּרְעֹה֙ הַיֹּשֵׁ֣ב עַל־כִּסְא֔וֹ עַ֚ד בְּכ֣וֹר הַשִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָרֵחָ֑יִם וְכֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׃", "onk": "וִימוּת כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מִבּוּכְרָא דְפַרְעֹה <b>דְעָתִיד לְמִתַּב<\/b> עַל כָּרְסֵי <b>מַלְכוּתֵהּ<\/b> עַד בּוּכְרָא דְאַמְתָא דִי בָּתַר רֵיחְיָא וְכֹל בּוּכְרָא דִבְעִירָא:", "onk_en": "Every first-born in the land of Egypt will die, from the first-born of Pharaoh sitting on his [<b>who is destined to sit upon the<\/b>] throne [<b>of his kingdom<\/b>], to the first-born of the [Egyptian] slave girl, behind the mill-stones, and every first-born animal.", "pj": "וִימוּת כָּל בּוּכְרָא בְּאַרְעָא דְמִצְרַיִם מִבִּיר בּוּכְרָא דְפַרְעה דְּעָתִיד דְּיֵיתִיב עַל כּוּרְסַיָא מַלְכוּתֵיהּ עַד בּוּכְרָא דְאַמְתָא בִּיצִירְתָּא דִבְמִצְרַיִם דְּמִתְיְלִיד לָהּ כַּד הִיא טַחְנָא אֲחוֹרֵי רֵיחַיָא וְכָל בּוּכְרָא דִבְעִירָא", "pj_en": "and every firstborn in the land of Mizraim shall die: from the firstborn of Pharoh who should sit upon the throne of his kingdom, unto the firstborn son of the humblest mother in Mizraim who grindeth behind the mills, and all the firstborn of cattle.", "tj": "", "tj_en": "", "rashi": "<b>עד בכור השבי.<\/b> לָמָּה לָקוּ הַשְּׁבוּיִים? כְּדֵי שֶׁלֹּא יֹאמְרוּ, יִרְאָתָם תָּבְעָה עֶלְבּוֹנָם וְהֵבִיאָה פֻּרְעָנוּת עַל מִצְרַיִם:<br><br><b>מבכור פרעה עד בכור השפחה.<\/b> כָּל הַפְּחוּתִים מִבְּכוֹר פַּרְעֹה וַחֲשׁוּבִים מִבְּכוֹר הַשִּׁפְחָה הָיוּ בִּכְלָל; וְלָמָּה לָקוּ בְּנֵי הַשְּׁפָחוֹת? שֶׁאַף הֵם הָיוּ מְשַׁעְבְּדִים בָּהֶם וּשְׂמֵחִים בְּצָרָתָם:<br><br><b>וכל בכור בהמה.<\/b> לְפִי שֶׁהָיוּ עוֹבְדִין לָהּ. כְּשֶׁהַקָּבָּ\"ה נִפְרָע מִן הָאֻמָּה, נִפְרָע מֵאֱלֹהֶיהָ:", "rashi_en": "עד בכור השבי UNTO THE FIRSTBORN OF THE CAPTIVE (these words are used in 12:29 instead of עד בכור השפחה “unto the firstborn of the handmaid” in this verse) — Why were the captives smitten, for they had not enslaved the Israelites? In order that these might not say that their god had claimed satisfaction for the humiliation imposed upon them and had brought this punishment upon the Egyptians (cf. Mekhilta).<br><br>מבכור פרעה עד בכור השפחה FROM THE FIRSTBORN OF PHARAOH UNTO THE FIRSTBORN OF THE HANDMAID — All who were of less importance than the firstborn of Pharaoh and of more importance than the firstborn of the handmaid are included in this description. And why were the sons of the handmaids stricken? Because they, too, treated them (the Israelites) as slaves and rejoiced at their misery (Midrash Tanchuma, Bo 7).<br><br>וכל בכור בהמה AND ALL THE FIRSTBORN OF BEASTS — because they worshipped these as gods. When the Holy One, blessed be He, exacts punishment from a nation, He punishes their gods at the same time (Genesis Rabbah 96:5)."}, {"ch": 11, "v": 6, "aliyah": 4, "heb": "וְהָ֥יְתָ֛ה צְעָקָ֥ה גְדֹלָ֖ה בְּכׇל־אֶ֣רֶץ מִצְרָ֑יִם אֲשֶׁ֤ר כָּמֹ֙הוּ֙ לֹ֣א נִהְיָ֔תָה וְכָמֹ֖הוּ לֹ֥א תֹסִֽף׃", "onk": "וּתְהֵי צְוַחְתָּא רַבָּא בְּכָל אַרְעָא דְמִצְרָיִם דִכְוָתֵהּ לָא הֲוַת וְדִכְוָתֵהּ לָא תוֹסֵף:", "onk_en": "There will be a great cry [of anguish] throughout the entire land of Egypt, the likes of which there never was and like there never will be.", "pj": "וּתְהֵי צְוַוחְתָּא רַבְּתָא בְּכָל אַרְעָא דְמִצְרַיִם דְּדִכְוָותֵיהּ לֵילְיָא לָא הֲוָת בֵּיהּ מַחְתָּא כְּדָא וְדִכְוָותֵיהּ לֵילְיָא לָא תוֹסֵיף לְמֶהֱוֵי מַחְתָּא כְּדָא", "pj_en": "And there will be a great cry in all the land of Mizraim, because like the plague of this night there hath not been, and like the plague of this night there never will be one.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 7, "aliyah": 4, "heb": "וּלְכֹ֣ל&thinsp;<b>׀<\/b> בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ־כֶּ֙לֶב֙ לְשֹׁנ֔וֹ לְמֵאִ֖ישׁ וְעַד־בְּהֵמָ֑ה לְמַ֙עַן֙ תֵּֽדְע֔וּן אֲשֶׁר֙ יַפְלֶ֣ה יְהֹוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּבֵ֥ין יִשְׂרָאֵֽל׃", "onk": "וּלְכֹל בְּנֵי יִשְׂרָאֵל לָא <b>יַנְזֵק<\/b> כַּלְבָּא בְּלִישְׁנֵהּ לְמִנְבַּח לְמֵאֲנָשָׁא וְעַד בְּעִירָא בְּדִיל דְתִדְעוּן דְיַפְרֵישׁ יְיָ בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל:", "onk_en": "But among all the B’nei Yisrael, a dog will not sharpen [<b>cause damage with<\/b>] its tongue [growl] at man or animal. You will then know that Adonoy distinguishes between Egypt and Yisrael.", "pj": "וּלְכָל בְּנֵי יִשְרָאֵל לָא יְהַנְזַק כַּלְבָּא בְּלִשְׁנֵיהּ לְמִנְבַּח לְמֵאֱנָשָׁא וְעַד בְּעִירָא מִן בִּגְלַל דְּתִנְדְּעוּן דְּיַפְרֵישׁ יְיָ בֵּין מִצְרָאֵי וּבֵינֵי יִשְרָאֵל", "pj_en": "But any of the children of Israel a dog shall not harm by lifting up his tongue against either man or beast; that they may know that the Lord maketh distinction between the Mizraites and the sons of Israel.", "tj": "", "tj_en": "", "rashi": "<b>לא יחרץ כלב לשונו.<\/b> אוֹמֵר אֲנִי שֶׁהוּא לְשׁוֹן שִׁנּוּן – לֹא יְשַׁנֵּן, וְכֵן \"לֹא חָרַץ לִבְנֵי יִשְׂרָאֵל לְאִישׁ אֶת לְשׁוֹנוֹ\" (יהושע י') – לֹא שִׁנֵּן, \"אָז תֶּחֱרַץ\" (שמואל ב ה׳:כ״ד) – תִּשְׁתַּנֵּן, \"לְמוֹרַג חָרוּץ\" (ישעיהו מ\"א) – שָׁנוּן, \"מַחְשְׁבוֹת חָרוּץ\" (משלי כ\"א) – אָדָם חָרִיף וְשָׁנוּן, \"וְיַד חֲרוּצִים תַּעֲשִׁיר\" (שם י') – חֲרִיפִים, סוֹחֲרִים שְׁנוּנִים:<br><br><b>אשר יפלה.<\/b> יַבְדִּיל:", "rashi_en": "לא יחרץ כלב לשנו NO DOG SHALL חרץ HIS TONGUE — I say that it has the meaning of sharpening: “no dog shall whet his tongue”. So, too: (Joshua 10:21) “לא חרץ his tongue against any of the children of Israel”, i. e. “none whetted”; (II Samuel 5:24) “then תחרץ” — then thou shalt utter a sharp sound; (Isaiah 41:15) “a threshing-sledge חרוץ” i. e. sharp; (Proverbs 21:5) “the plans of a חרוץ” — of “an acute and sharp man”; (Proverbs 10:4) “the hand of the חרוצים maketh rich”, i. e. the hand of the acute — of sharp merchants.<br><br>אשר יפלה meant THAT HE MAKETH A DIFFERENCE."}, {"ch": 11, "v": 8, "aliyah": 4, "heb": "וְיָרְד֣וּ כׇל־עֲבָדֶ֩יךָ֩ אֵ֨לֶּה אֵלַ֜י וְהִשְׁתַּֽחֲווּ־לִ֣י לֵאמֹ֗ר צֵ֤א אַתָּה֙ וְכׇל־הָעָ֣ם אֲשֶׁר־בְּרַגְלֶ֔יךָ וְאַחֲרֵי־כֵ֖ן אֵצֵ֑א וַיֵּצֵ֥א מֵֽעִם־פַּרְעֹ֖ה בׇּחֳרִי־אָֽף׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיֶחֱתוּן כָּל עַבְדָיךְ אִלֵין לְוָתִי <b>וְיִבְעוֹן מִנִי<\/b> לְמֵימָר פּוּק אַתְּ וְכָל עַמָא דִי עִמָךְ וּבָתַר כֵּן אֶפּוֹק וּנְפַק מִלְוָת פַּרְעֹה בִּתְקוֹף רְגָז:", "onk_en": "Then all these, your servants, will come down to me, and prostrate themselves [<b>beseech me<\/b>] saying, ‘Go! You and all the people that follow you [<b>that are with you<\/b>]. Then I will go out.” He [Moshe] then left Pharaoh in great anger.", "pj": "וְיַחְתוּן כָּל עַבְדָּךְ אִלֵּין לְוָותִי וְיִבְעוּן מָטוּ מִינִי לְמֵימַר פּוּק אַנְתְּ וְכָל עַמָּא דְּעִמָּךְ וּמִבָּתַר כְּדֵין אֶפּוֹק וּנְפַק מִלְוַת פַּרְעה בִּתְקוֹף רְגַז", "pj_en": "And thou shalt send down all thy servants to me, coming and beseeching me, saying, Go forth, thou and all the people who are with thee; and afterwards I will go. And he went out from Pharoh in great anger.", "tj": "", "tj_en": "", "rashi": "<b>וירדו כל עבדיך.<\/b> חָלַק כָּבוֹד לַמַּלְכוּת, שֶׁהֲרֵי בַּסּוֹף יָרַד פַּרְעֹה בְּעַצְמוֹ אֵלָיו בַּלַּיְלָה \"וַיֹּאמֶר קוּמוּ צְּאוּ מִתּוֹךְ עַמִּי\" (שמות י\"ב), וְלֹא אָמַר לוֹ מֹשֶׁה מִתְּחִלָּה וְיָרַדְתָּ אֵלַי וְהִשְׁתַּחֲוִיתָ לִי:<br><br><b>אשר ברגליך.<\/b> הַהוֹלְכִים אַחַר עֲצָתְךָ וְהִלּוּכְךָ:<br><br><b>ואחרי כן אצא.<\/b> עִם כָּל הָעָם מֵאַרְצְךָ:<br><br><b>ויצא מעם פרעה.<\/b> כְּשֶׁגָּמַר דְּבָרָיו, יָצָא מִלְּפָנָיו:<br><br><b>בחרי אף.<\/b> עַל שֶׁאָמַר לוֹ \"אַל תֹּסֶף רְאוֹת פָּנַי\" (שמות י'):", "rashi_en": "וירדו כל עבדיך AND ALL THY SERVENTS SHALL COME DOWN [UNTO ME] — He showed respect to the king, for as a matter of fact ultimately Pharaoh himself came down to him at night, (Exodus 12:31) “And he said, Arise, go out from the midst of my people”; but Moses did not at the outset say to him, “And thou shalt come down to me and shalt prostrate thyself”, out of respect for the king, (Exodus Rabbah 7:3)<br><br>אשר ברגליך (lit., who are at thy feet) — who go after (follow) thy counsel and ways.<br><br>ואחרי כן אצא AND AFTER THAT I WILL GO OUT, with all my people, from thy land.<br><br>ויצא מעם פרעה AND HE WENT OUT FROM PHARAOH — After he had concluded his words he went forth from his presence.<br><br>בחרי אף IN FIERCENESS OF WRATH because he (Pharaoh) had said to him, (Exodus 10:28) “Do not again see my face."}, {"ch": 11, "v": 9, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה לֹא־יִשְׁמַ֥ע אֲלֵיכֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖י בְּאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה לָא <b>יְקַבֵּל<\/b> מִנְכוֹן פַּרְעֹה בְּדִיל לְאַסְגָאָה מוֹפְתַי בְּאַרְעָא דְמִצְרָיִם:", "onk_en": "Adonoy said to Moshe, “Pharaoh will not listen to [<b>accept<\/b>] you. Thus I will multiply My wonders in the land of Egypt.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה לָא יְקַבֵּיל מִנְכוֹן פַּרְעה מִן בִּגְלַל לְאַסְגָאָה תִּמְהַיַי בְּאַרְעָא דְמִצְרָיִם", "pj_en": "But the Lord said to Mosheh, Pharoh will not hearken to you; that I may multiply My wonders in the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>למען רבות מופתי.<\/b> מַכַּת בְּכוֹרוֹת וּקְרִיעַת יַם סוּף וּלְנַעֵר אֶת מִצְרַיִם:", "rashi_en": "למען רבות מופתי SO THAT MY WONDERS MAY BE MULTIPLIED (more lit., so that my wonders may be many) — referring not to one wonder alone (the slaying of the firstborn) but to the slaying of the firstborn, the division of the Red Sea and the overthrowing of the Egyptians in it."}, {"ch": 11, "v": 10, "aliyah": 4, "heb": "וּמֹשֶׁ֣ה וְאַהֲרֹ֗ן עָשׂ֛וּ אֶת־כׇּל־הַמֹּפְתִ֥ים הָאֵ֖לֶּה לִפְנֵ֣י פַרְעֹ֑ה וַיְחַזֵּ֤ק יְהֹוָה֙ אֶת־לֵ֣ב פַּרְעֹ֔ה וְלֹֽא־שִׁלַּ֥ח אֶת־בְּנֵֽי־יִשְׂרָאֵ֖ל מֵאַרְצֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּמשֶׁה וְאַהֲרֹן עֲבָדוּ יָת כָּל מוֹפְתַיָא הָאִלֵין קֳדָם פַּרְעֹה וְאַתְקֵף יְיָ יָת לִבָּא דְפַרְעֹה וְלָא שַׁלַח יָת בְּנֵי יִשְׂרָאֵל מֵאַרְעֵהּ:", "onk_en": "Moshe and Aharon had done all these wonders before Pharaoh. [However] Adonoy hardened Pharaoh’s heart and he did not send the B’nei Yisrael out of his land.", "pj": "וּמשֶׁה וְאַהֲרן עֲבָדוּ יַת כָּל תִּמְהַיָא הָאִילֵין קֳדָם פַּרְעה וּתְקֵיף יְיָ יַת יִצְרָא דְלִבָּא דְפַרְעה וְלָא פְטַר יַת בְּנֵי יִשְרָאֵל מֵאַרְעֵיהּ", "pj_en": "And Mosheh and Aharon did all these wonders before Pharoh; and the Lord strengthened the design of Pharoh's heart, and he would not release the sons of Israel from his land.", "tj": "", "tj_en": "", "rashi": "<b>משה ואהרן עשו וגו'.<\/b> כְּבָר כָּתַב לָנוּ זֹאת בְּכָל הַמּוֹפְתִים, וְלֹא שְׁנָאָהּ כָּאן אֶלָּא בִּשְׁבִיל לְסָמְכָהּ לַפָּרָשָׁה שֶׁלְּאַחֲרֶיהָ:", "rashi_en": "ומשה ואהרן עשו וגו׳ AND MOSES AND AARON DID etc. — It (Scripture) has already written this in the description of all the preceding wonders, and it repeats it here only in order to connect it with the chapter which comes after this (as giving a reason why the commands in the next chapter were given to Aaron as well as to Moses; cf. Rashi’s comment on the following verse)."}, {"ch": 12, "v": 1, "aliyah": 4, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֣ה וְאֶֽל־אַהֲרֹ֔ן בְּאֶ֥רֶץ מִצְרַ֖יִם לֵאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרֹן בְּאַרְעָא דְמִצְרַיִם לְמֵימָר:", "onk_en": "Adonoy said to Moshe and Aharon in the land of Egypt saying:", "pj": "וַאֲמַר יְיָ לְמשֶׁה וּלְאַהֲרן בְּאַרְעָא דְמִצְרַיִם לְמֵימָר", "pj_en": "And the Lord spoke to Mosheh and to Aharon in the land of Mizraim, saying,", "tj": "", "tj_en": "", "rashi": "<b>ויאמר ה' אל משה ואל אהרן.<\/b> בִּשְׁבִיל שֶׁאַהֲרֹן עָשָׂה וְטָרַח בַּמּוֹפְתִים כְּמֹשֶׁה, חָלַק לוֹ כָּבוֹד זֶה בְּמִצְוָה רִאשׁוֹנָה, שֶׁכְּלָלוֹ עִם מֹשֶׁה בַּדִּבּוּר:<br><br><b>בארץ מצרים.<\/b> חוּץ לַכְּרַךְ, אוֹ אֵינוֹ אֶלָּא בְּתוֹךְ הַכְּרַךְ? תַּ\"לֹ (לעיל ט כט) \"כְּצֵאתִי אֶת הָעִיר וְגוֹ'\", וּמַה תְּפִלָּה קַלָּה לֹא הִתְפַּלֵּל בְּתוֹךְ הַכְּרַךְ, דִּבּוּר חָמוּר לֹא כָּל שֶׁכֵּן. וּמִפְּנֵי מָה לֹא נִדְבַּר עִמּוֹ בְּתוֹךְ הַכְּרַךְ? לְפִי שֶׁהָיְתָה מְלֵאָה גִלּוּלִים:", "rashi_en": "ויאמר ה' אל משה ואל אהרן AND THE LORD SPAKE UNTO MOSES AND AARON — Because Aaron had worked and toiled in performing the wonders just the same as Moses He paid him this honour at the first command by including him with Moses in the communication (Tanchuma Yahshan 2:3:8).<br><br>בארץ מצרים IN THE LAND OF EGYPT — This must have been outside the city! Or perhaps this is not so, but it was inside the city? Scripture however states, (Exodus 9:29) “When I leave the city [I will spread my hands (pray) unto the Lord]”. Now how was it in regard to prayer which is of light importance in comparison with a communication from God? He did not recite the prayer inside the city! Then, in the case of a divine communication which is of so weighty importance does it not follow all the more that this was also so! — And why, indeed, did He not converse with him inside the city? Because it was full of idols (Mekhilta)."}, {"ch": 12, "v": 2, "aliyah": 4, "heb": "הַחֹ֧דֶשׁ הַזֶּ֛ה לָכֶ֖ם רֹ֣אשׁ חֳדָשִׁ֑ים רִאשׁ֥וֹן הוּא֙ לָכֶ֔ם לְחׇדְשֵׁ֖י הַשָּׁנָֽה׃", "onk": "יַרְחָא הָדֵין לְכוֹן רֵישׁ יַרְחִין קַדְמַאי הוּא לְכוֹן לְיַרְחֵי שַׁתָּא:", "onk_en": "“This month shall be [reckoned] to you [as] the head [beginning] of months. It shall be to you the first of the months of the year.", "pj": "יַרְחָא הָדֵין לְכוֹן לְמִקְבְּעֵיהּ רֵישׁ יַרְחַיָּיא וּמִנֵּיהּ תֵּשְׁרוּן לְמִמְנֵי חַגַיָא וְזִמְנַיָא וּתְקוּפְתָּא קַדְמָאֵי הוּא לְכוֹן לְמִנְיַן יַרְחֵי שַׁתָּא", "pj_en": "This month is ordained to be to you the beginning of the months; and from it you shall begin to number for festivals, and times, and cycles; it shall be to you the first of the number of the months of the year.", "tj": "", "tj_en": "", "rashi": "<b>החדש הזה.<\/b> הֶרְאָהוּ לְבָנָה בְּחִדּוּשָׁהּ וְאָמַר לוֹ כְּשֶׁהַיָּרֵחַ מִתְחַדֵּשׁ יִהְיֶה לְךָ רֹאשׁ חֹדֶשׁ (מכילתא). וְאֵין מִקְרָא יוֹצֵא מִידֵי פְשׁוּטוֹ, עַל חֹדֶשׁ נִיסָן אָמַר לוֹ, זֶה יִהְיֶה רֹאשׁ לְסֵדֶר מִנְיַן הֶחֳדָשִׁים, שֶׁיְּהֵא אִיָּר קָרוּי שֵׁנִי, סִיוָן שְׁלִישִׁי:<br><br><b>הזה.<\/b> נִתְקַשָּׁה מֹשֶׁה עַל מוֹלַד הַלְּבָנָה, בְּאֵיזוֹ שִׁעוּר תֵּרָאֶה וְתִהְיֶה רְאוּיָה לְקַדֵּשׁ, וְהֶרְאָה לוֹ בְּאֶצְבַּע אֶת הַלְּבָנָה בָּרָקִיעַ וְאָמַר לוֹ כָּזֶה רְאֵה וְקַדֵּשׁ (שם). וְכֵיצַד הֶרְאָהוּ? וַהֲלֹא לֹא הָיָה נִדְבָּר עִמּוֹ אֶלָּא בַּיּוֹם? שֶׁנֶּ' \"וַיְהִי בְּיוֹם דִּבֶּר ה'\" (שמות ו'), \"בְּיוֹם צַוֹּתוֹ\" (ויקרא ז'), \"מִן הַיּוֹם אֲשֶׁר צִוָּה ה' וָהָלְאָה\" (במדבר ט\"ו)? אֶלָּא סָמוּךְ לִשְׁקִיעַת הַחַמָּה נֶאֶמְרָה לוֹ פָרָשָׁה זוֹ וְהֶרְאָהוּ עִם חֲשֵׁכָה:", "rashi_en": "החדש הזה — He showed him the moon in the first stage of its renewal, and He said to him, “The time when the moon renews itself thus, shall be unto you the beginning of the month”. (The translation therefore is: “This stage of renewal (חדש) shall be the moment of beginning the months”; cf. Mekhilta). But no Scriptural verse can lose its literal meaning, and He really spoke this in reference to the month Nisan: this month shall be the beginning in the order of counting the months, so that Iyar shall be called the second, Sivan the third.<br><br>הזה THIS [STAGE OF RENEWAL] — Moses was in perplexity regarding the Molad of (the exact moment when begins) the new moon — how much of it must be visible before it is proper to consecrate it as new moon: He therefore pointed it out to him in the sky with the finger and said to him, “Behold it like this, and consecrate it” (i. e., when you see the moon in a stage of renewal similar to this which you now behold you may proclaim that a new month has begun). But how could He point it out to him, for did He not conserve with him only by day, as it is said, (Exodus 6:28) “And it came to pass on the day when the Lord spake [unto Moses]”; (Leviticus 7:38) “On the day when he commanded”; (Numbers 15:23) “From the day that the Lord commanded and henceforward”? But the explanation is: This chapter was spoken to him close to sunset and He pointed it out to him at nightfall (more lit., near darkness) (Mekhilta)."}, {"ch": 12, "v": 3, "aliyah": 4, "heb": "דַּבְּר֗וּ אֶֽל־כׇּל־עֲדַ֤ת יִשְׂרָאֵל֙ לֵאמֹ֔ר בֶּעָשֹׂ֖ר לַחֹ֣דֶשׁ הַזֶּ֑ה וְיִקְח֣וּ לָהֶ֗ם אִ֛ישׁ שֶׂ֥ה לְבֵית־אָבֹ֖ת שֶׂ֥ה לַבָּֽיִת׃", "onk": "מַלִילוּ עִם כָּל כְּנִשְׁתָּא דְיִשְׂרָאֵל לְמֵימַר בְּעַסְרָא לְיַרְחָא הָדֵין וְיִסְבוּן לְהוֹן גְבַר אִמָר לְבֵית אַבָּא אִמָר לְבֵיתָא:", "onk_en": "Speak to the entire community of Israel saying, ‘On the tenth [day] of this month they shall take—each man [shall take] a lamb for [his] family, a lamb for each household.", "pj": "מַלִילוּ עִם כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל לְמֵימַר בְּעַשְרָא לְיַרְחָא הָדֵין זִמְנֵיהּ קָבִיעַ בַּהֲדָא זִימְנָא וְלָא לְדָרַיָא וְיִסְבוּן לְהוֹן אִימַר לְבֵית גְּנִיסְתָּא וְאִין סַגִּיאִין מִמִּנְיָנָא יִסְבוּן אִימְרָא לְבֵיתָא", "pj_en": "Speak to all the congregation of the children of Israel, saying, In the tenth of this month, whose time is appointed for this time (occasion), and not for (coming) generations, they shall take to them a lamb for the house of a family, and, if many in number, they shall take a lamb for a house:", "tj": "", "tj_en": "", "rashi": "<b>דברו אל כל עדת.<\/b> וְכִי אַהֲרֹן מְדַבֵּר? וַהֲלֹא כְּבָר נֶאֱמַר אַתָּה תְדַבֵּר? אֶלָּא חוֹלְקִין כָּבוֹד זֶה לָזֶה, וְאוֹמְרִים זֶה לָזֶה לַמְּדֵנִי, וְהַדִּבּוּר יוֹצֵא מִבֵּין שְׁנֵיהֶם כְּאִלּוּ שְׁנֵיהֶם מְדַבְּרִים (מכילתא):<br><br><b>דברו אל כל עדת ישראל לאמר בעשר לחדש.<\/b> דַּבְּרוּ הַיּוֹם, בְּרֹאשׁ חֹדֶשׁ שֶׁיִּקָּחוּהוּ בֶּעָשֹׂר לַחֹדֶשׁ:<br><br><b>הזה.<\/b> פֶּסַח מִצְרַיִם מִקְחוֹ בֶעָשׂוֹר, וְלֹא פֶּסַח דּוֹרוֹת (פסחים צ\"ו):<br><br><b>שה לבית אבת.<\/b> לְמִשְׁפָּחָה אַחַת; הֲרֵי שֶׁהָיוּ מְרֻבִּין, יָכוֹל שֶׂה אֶחָד לְכֻלָּן? תַּ\"לֹ \"שֶׂה לַבָּיִת\" (מכילתא):", "rashi_en": "דברו אל כל עדת SPEAK UNTO ALL THE CONGREGATION — But did Aaron speak? Has it not already been stated, (Exodus 7:2) “You (Moses) shall speak etc.”. But the explanation is: they paid respect one to the other, saying to each other, “Instruct me what to say”. and the divine communication in question issued from both of them, so that it was as though they were both speaking (Mekhilta).<br><br>דברו אל כל עדת ישראל לאמר בעשר לחדש i. e. SPEAK to-day — on the first of the month — THAT ON THE TENTH OF THE MONTH they should take it (the lamb) (Mekhilta).<br><br>הזה [ON THE TENTH OF] THIS [MONTH] — As regards the paschal lamb sacrificed in Egypt it had to be taken from the flock on the tenth, but this did not apply to the paschal-lamb offered by future generations (Pesachim 96a).<br><br>שה לבית אבות A LAMB FOR THE HOUSE OF THEIR FATHERS — i. e. a lamb for one family (“family” here means the larger unit comprising the father or grandfather with his married sons and their families). Consequently, if they (the members of such a family) were numerous, one might think that they may take one lamb for all of them (irrespective of whether this would suffice to provide a piece as large as an olive, the minimum quantity, for each person)! Therefore Scripture states: שה לבית A LAMB FOR EACH HOUSEHOLD (Mekhilta)."}, {"ch": 12, "v": 4, "aliyah": 4, "heb": "וְאִם־יִמְעַ֣ט הַבַּ֘יִת֮ מִהְי֣וֹת מִשֶּׂה֒ וְלָקַ֣ח ה֗וּא וּשְׁכֵנ֛וֹ הַקָּרֹ֥ב אֶל־בֵּית֖וֹ בְּמִכְסַ֣ת נְפָשֹׁ֑ת אִ֚ישׁ לְפִ֣י אׇכְל֔וֹ תָּכֹ֖סּוּ עַל־הַשֶּֽׂה׃", "onk": "וְאִם יִזְעֵיר בֵּיתָא <b>מִלְאִתְמְנָאָה<\/b> עַל אִמְרָא וְיִסַב הוּא וְשֵׁיבָבֵהּ דְקָרִיב לְבֵיתֵהּ בְּמִנְיַן נַפְשָׁתָא גְבַר לְפוּם מֵיכְלֵהּ תִּתְמְנוּן עַל אִמְרָא:", "onk_en": "If the [members of the] household are too few for the [<b>numbering of the<\/b>] [eating of a] lamb then he shall take [a lamb] [together] with his neighbor, close by his house, according to the number of individuals. According to what the person eats shall you make your count regarding the lamb.", "pj": "וְאִין זְעִירִין אִינְשֵׁי בֵיתָא מִמִּנְיַן עַשְרָא כְּמִיסַת לְמֵיכוּל אִימְרָא וְיִסַב הוּא וְשִׁיבְבֵיהּ דִּקָרֵיב לְבֵיתֵיהּ בִּסְכוּם נַפְשָׁתָא גְּבַר לְפוּם מֵיסַב מֵיכְלֵיהּ תִּיכְסוּן יַת אִימְרָא", "pj_en": "but if the men of the house are fewer than ten in number, in proportion to a sufficient number to eat the lamb, he and his neighbour who is nearest to his house shall take according to the number of souls: each man according to the sufficiency of his eating shall be counted for the lamb.", "tj": "", "tj_en": "", "rashi": "<b>ואם ימעט הבית מהיות משה.<\/b> וְאִם יִהְיוּ מוּעָטִים מִהְיוֹת מִשֶּׂה אֶחָד, שֶׁאֵין יְכוֹלִין לְאָכְלוֹ וְיָבֹא לִידֵי נוֹתָר: <b>ולקח הוא ושכנו וגו'.<\/b> זֶהוּ מַשְׁמָעוֹ לְפִי פְשׁוּטוֹ. וְעוֹד יֵשׁ בּוֹ מִדְרָשׁ: לְלַמֵּד, שֶׁאַחַר שֶׁנִּמְנוּ עָלָיו, יְכוֹלִין לְהִתְמַעֵט וְלִמְשֹׁךְ יְדֵיהֶם הֵימֶנּוּ וּלְהִמָּנוֹת עַל שֶׂה אַחֵר; אַךְ אִם בָּאוּ לִמְשֹׁךְ יְדֵיהֶם וּלְהִתְמַעֵט, <b>מהיות משה<\/b>, יִתְמַעֲטוּ בְּעוֹד הַשֶּׂה קַיָּם, בִּהְיוֹתוֹ בַחַיִּים וְלֹא מִשֶּׁנִּשְׁחַט (פסחים פ\"ט):<br><br><b>במכסת.<\/b> חֶשְׁבּוֹן, וְכֵן \"מִכְסַת הָעֶרְכְּךָ\" (ויקרא כ\"ז):<br><br><b>לפי אכלו.<\/b> הָרָאוּי לַאֲכִילָה, פְּרָט לְחוֹלֶה וּלְזָקֵן שֶׁאֵינוֹ יָכוֹל לֶאֱכֹל כַּזַּיִת (מכילתא):<br><br><b>תכסו.<\/b> \"תִּתְמְנוּן\":", "rashi_en": "ואם ימעט הבית מהיות משה — This means: if they are too few to be sufficient for one lamb — that they are unable to eat the whole of it, and it would therefore come under the category of נותר “left over”. ולקח הוא ושכנו וגו׳ THEN LET HIM AND HIS NEIGHBOUR TAKE etc. — This is what these words and those that precede it imply in its literal sense, but there is also a derivation from it of a Halachic character — that the verse intends to teach that after they have counted themselves (formed themselves into a company) for it, they may reduce their number by withdrawing from it and may register themselves for a different lamb; but if they intend to withdraw and thereby reduce their number מהיות משה — they must reduce only whilst the lamb is still in being — whilst it is alive (מחיות משה = מהיות משה) — and not after it has been slaughtered (Pesachim 89a; cf. Mekhilta).<br><br>במכסת means ACCORDING TO THE NUMBER. Similar is, (Leviticus 27:23) “The number (מכסת) of thy valuation”.<br><br>לפי אכלו [EVERY MAN] ACCORDING TO HIS EATING — every man who is fitted to eat the quantity prescribed by the Law; this excludes a sick person and an aged person who are unable to eat a portion the size of an olive (Mekhilta).<br><br>תכסו means ye shall number yourselves, as the Targum renders it. (It is not to be translated: ye shall number others.)"}, {"ch": 12, "v": 5, "aliyah": 4, "heb": "שֶׂ֥ה תָמִ֛ים זָכָ֥ר בֶּן־שָׁנָ֖ה יִהְיֶ֣ה לָכֶ֑ם מִן־הַכְּבָשִׂ֥ים וּמִן־הָעִזִּ֖ים תִּקָּֽחוּ׃", "onk": "אִמַר שְׁלִים דְכַר בַּר שַׁתֵּהּ יְהֵי לְכוֹן מִן אִמְרַיָא וּמִן עִזַיָא תִּסְבוּן:", "onk_en": "A flawless lamb, a yearling male must be in your possession. You may take it from sheep or goats.", "pj": "אִימַר שְׁלִים דְּכַר בַּר שַׁתָּא יְהֵי לְכוֹן מִן אִימְרַיָא וּמִן בְּנֵי עִזַּיָא תִּסְבוּן", "pj_en": "The lamb shall be perfect, a male, the son of a year he shall be to you; from the sheep or from the young goats ye may take.", "tj": "", "tj_en": "", "rashi": "<b>תמים.<\/b> בְּלֹא מוּם:<br><br><b>בן שנה.<\/b> כָּל שְׁנָתוֹ קָרוּי בֶּן שָׁנָה, כְּלוֹמַר שֶׁנּוֹלַד בְּשָׁנָה זוֹ:<br><br><b>מן הכבשים ומן העזים.<\/b> אוֹ מִזֶּה אוֹ מִזֶּה, שֶׁאַף עֵז קָרוּי שֶׂה, שֶׁנֶּאֱמַר \"וְשֵׂה עִזִּים\" (דברים י\"ד):", "rashi_en": "תמים PERFECT i. e. without blemish (Mekhilta).<br><br>בן שנה OF THE FIRST YEAR — the whole of its first year it is termed שנה בן, as much as to say, that it was born during this year (it does not mean that it is one year old — in its second year) (cf.Mekhilta).<br><br>מן הכבשים ומן העזים — i. e. either from these (a lamb) or from these (a goat) (i. e. the ו of ומן does not signify “and”, but “or”); for a goat, also, is called שה, as it is said, (Deuteronomy 14:4) “the שה of the goats” (שה means the young animal, either of the sheep or of the goats) (cf. Mekhilta)."}, {"ch": 12, "v": 6, "aliyah": 4, "heb": "וְהָיָ֤ה לָכֶם֙ לְמִשְׁמֶ֔רֶת עַ֣ד אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַחֹ֣דֶשׁ הַזֶּ֑ה וְשָׁחֲט֣וּ אֹת֗וֹ כֹּ֛ל קְהַ֥ל עֲדַֽת־יִשְׂרָאֵ֖ל בֵּ֥ין הָעַרְבָּֽיִם׃", "onk": "וִיהֵי לְכוֹן לְמַטְרָא עַד אַרְבְּעָא עַסְרָא יוֹמָא לְיַרְחָא הָדֵין וְיִכְּסוּן יָתֵהּ כֹּל קְהָלָא כְנִשְׁתָּא דְיִשְׂרָאֵל בֵּין שִׁמְשַּׁיָא:", "onk_en": "You shall hold it in safekeeping until the fourteenth day of this month, they shall slaughter it—the entire community of Yisrael—between evenings [in the afternoon].", "pj": "וִיהֵי לְכוֹן קָטִיר וְנָטִיר עַד אַרְבֵּיסַר יוֹמָא לְיַרְחָא הָדֵין דְּתִנְדְּעוּן דְּלֵיתֵיכוֹן מִסְתַּפְיַן מִמִּצְרָאֵי דְחַמְיָין יָתֵיהּ וְיִכְסוֹן יָתֵיהּ כְּהִילְכָתָא כָּל קְהַל כְּנִישְׁתָּא דְיִשְרָאֵל בֵּינֵי שִׁמְשָׁתָא", "pj_en": "And it shall be bound and reserved for you until the fourteenth day of this month, that you may not know the fear of the Mizraee when they see it; and ye shall kill him according to the rite of all to congregation of the assembly of Israel, between the suns.", "tj": "", "tj_en": "", "rashi": "<b>והיה לכם למשמרת.<\/b> זֶהוּ לְשׁוֹן בִּקּוּר, שֶׁטָּעוּן בִּקּוּר מִמּוּם אַרְבָּעָה יָמִים קֹדֶם שְׁחִיטָה (פסחים צ\"ו). וּמִפְּנֵי מָה הִקְדִּים לְקִיחָתוֹ לִשְׁחִיטָתוֹ אַרְבָּעָה יָמִים, מַה שֶּׁלֹּא צִוָּה כֵן בְּפֶסַח דּוֹרוֹת? הָיָה רַ' מַתְיָא בֶּן חָרָשׁ אוֹמֵר, הֲרֵי הוּא אוֹמֵר \"וָאֶעֱבֹר עָלַיִךְ וָאֶרְאֵךְ וְהִנֵּה עִתֵּךְ עֵת דּוֹדִים\" (יחזקאל ט\"ז) – הִגִּיעָה שְׁבוּעָה
