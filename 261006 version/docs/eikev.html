ND WHICH THE LORD SWARE UNTO YOUR FATHERS] TO GIVE TO THEM — It is not written here “to give to you”, but “to give to them”. From this we are able to derive that the tenet of the “Resurrection of the Dead” is of Biblical origin (more lit., is from the Torah) (Sifrei Devarim 47:2)."}, {"ch": 11, "v": 22, "aliyah": 7, "heb": "כִּי֩ אִם־שָׁמֹ֨ר תִּשְׁמְר֜וּן אֶת־כׇּל־הַמִּצְוָ֣ה הַזֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְכֶ֖ם לַעֲשֹׂתָ֑הּ לְאַהֲבָ֞ה אֶת־יְהֹוָ֧ה אֱלֹהֵיכֶ֛ם לָלֶ֥כֶת בְּכׇל־דְּרָכָ֖יו וּלְדׇבְקָה־בֽוֹ׃", "onk": "אֲרֵי אִם מִטַּר תִּטְּרוּן יָת כָּל תַּפְקֶדְתָּא הָדָא דִּי אֲנָא מְפַקֵּד יָתְכוֹן לְמֶעְבְּדַהּ לְמִרְחַם יָת יְיָ אֱלָהֲכוֹן לִמְהַךְ בְּכָל אָרְחָן <b>דְּתַקְנָן קֳדָמוֹהִי וּלְאִתְקְרָבָא לְדַחַלְתֵּיהּ<\/b>:", "onk_en": "For if you truly guard this entire <i>mitzvah<\/i> that I am commanding you to perform, to love Adonoy, your God, to walk in all His ways [<b>that are correct before Him<\/b>] and to cling to Him [<b>come near to the fear of Him<\/b>].", "pj": "אֲרוּם אִין מִנְטוֹר תִּנְטְרוּן יַת כָּל תַּפְקֵידְתָּא הֲדָא דַאֲנָא מְפַקֵּיד יַתְכוֹן לְמַעַבְדָהּ לְמִרְחַם יַת יְיָ אֱלָהָכוֹן לִמְהַךְ בְּכָל אָרְחָן דְּתַקְנָן קֳדָמוֹי וּמְטוּל לְאִתְקְרָבָא לִדְחַלְתֵּיהּ", "pj_en": "For if you diligently keep every commandment that I command you to do it, to love the Lord your God, and walk in all the ways that are right before Him, and cleave unto His fear,", "tj": "", "tj_en": "", "rashi": "<b>שמר תשמרון.<\/b> אַזְהָרַת שְׁמִירוֹת הַרְבֵּה, לְהִזָּהֵר בְּתַלְמוּדוֹ שֶׁלֹּא יִשְׁתַּכַּח (שם):<br><br><b>ללכת בכל דרכיו.<\/b> הוּא רַחוּם וְאַתָּה תְּהֵא רַחוּם, הוּא גּוֹמֵל חֲסָדִים וְאַתָּה גּוֹמֵל חֲסָדִים (שם):<br><br><b>ולדבקה בו.<\/b> אֶפְשָׁר לוֹמַר כֵּן? וַהֲלֹא אֵשׁ אוֹכְלָה הוּא? אֶלָּא הִדַּבֵּק בַּתַּלְמִידִים וּבַחֲכָמִים וּמַעֲלֶה אֲנִי עָלֶיךָ כְּאִלּוּ נִדְבַּקְתָּ בּוֹ (ספרי):", "rashi_en": "שמר תשמרון [IF] YE SHALL DILIGENTLY OBSERVE [ALL THESE COMMANDMENTS] — The repetition of the verb implies an admonition to be very much on one’s guard: to be careful in respect to one’s study of the Torah that it should not be forgotten (cf. Sifrei Devarim 48:2).<br><br>ללכת בכל דרכיו TO WALK IN ALL HIS WAYS — He is merciful, be thou merciful; He bestows lovingkindness, bestow thou lovingkindness (Sifrei Devarim 49:1).<br><br>ולדבקה בו AND TO CLEAVE TO HIM — Is it possible to say this? Is He not “a consuming fire” (Deuteronomy 4:24)? But it means: cleave to the scholars and sages, and I will account it unto you as though you cleave to Him (Sifrei Devarim 49:2)."}, {"ch": 11, "v": 23, "aliyah": 7, "heb": "וְהוֹרִ֧ישׁ יְהֹוָ֛ה אֶת־כׇּל־הַגּוֹיִ֥ם הָאֵ֖לֶּה מִלִּפְנֵיכֶ֑ם וִֽירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַעֲצֻמִ֖ים מִכֶּֽם׃", "onk": "וִיתָרַךְ יְיָ יָת כָּל עַמְמַיָּא הָאִלֵּין מִקֳּדָמֵיכוֹן וְתֵירְתוּן עַמְמִין רַבְרְבִין וְתַקִּיפִין מִנְּכוֹן:", "onk_en": "Adonoy will expel all these nations before you, and you will inherit nations greater and more powerful than you.", "pj": "וִיתָרִיךְ מֵימְרָא דַיְיָ יַת כָּל עַמְמַיָא הָאִלֵּין מִן קֳדָמֵיכוֹן וְתֵירְתוּן עַמְמִין רַבְרְבִין וְתַקִּיפִין מִנְכוֹן", "pj_en": "then will the Word of the Lord drive out all these nations from before you, and you shall possess the heritage of nations greater and stronger than yourselves.", "tj": "", "tj_en": "", "rashi": "<b>והוריש ה'.<\/b> עֲשִׂיתֶם מַה שֶּׁעֲלֵיכֶם, אַף אֲנִי אֶעֱשֶׂה מַה שֶּׁעָלַי (שם):<br><br><b>ועצמים מכם.<\/b> אַתֶּם גִּבּוֹרִים, וְהֵם גִּבּוֹרִים מִכֶּם, שֶׁאִם לֹא שֶׁיִּשְׂרָאֵל גִּבּוֹרִים מַה הַשֶּׁבַח הַהוּא שֶׁמְּשַׁבֵּחַ אֶת הָאֱמוֹרִיִּים לוֹמַר וַעֲצוּמִים מִכֶּם? אֶלָּא אַתֶּם גִּבּוֹרִים מִשְּׁאָר הָאֻמּוֹת, וְהֵם גִּבּוֹרִים מִכֶּם (ע' שם):", "rashi_en": "הוריש ה׳ THEN THE LORD WILL DRIVE OUT [ALL THESE NATIONS FROM BEFORE YOU] — If you do what devolves upon you, “I” will do what devolves upon Me (Sifrei Devarim 49:3; cf. Rashi on v. 14).<br><br>ועצמים מכם [YE SHALL POSSESS NATIONS] MIGHTIER THAN YOURSELVES — You are mighty, but they are mightier than you; for if this does not mean to suggest that the Israelites are mighty, what superiority is it that he ascribes to the Amorites by saying “mightier than yourselves”? But the meaning must be: you are mightier than other nations and they are mightier than you (cf. Sifrei Devarim 50:3)."}, {"ch": 11, "v": 24, "aliyah": 7, "heb": "כׇּל־הַמָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף־רַגְלְכֶ֛ם בּ֖וֹ לָכֶ֣ם יִהְיֶ֑ה מִן־הַמִּדְבָּ֨ר וְהַלְּבָנ֜וֹן מִן־הַנָּהָ֣ר נְהַר־פְּרָ֗ת וְעַד֙ הַיָּ֣ם הָאַֽחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְכֶֽם׃", "onk": "כָּל אַתְרָא דִּי תִדְרוֹךְ פַּרְסַת רַגְלְכוֹן בֵּיהּ דִּלְכוֹן יְהֵי מִן מַדְבְּרָא וְלִבְנָן מִן נַהֲרָא נְהַר פְּרָת וְעַד יַמָּא <b>מַעַרְבָא<\/b> יְהֵי תְחוּמְכוֹן:", "onk_en": "Every place that the sole of your foot steps on will be yours, from the wilderness and the Lebanon, form the river—the Euphrates River—up to the ultimate [<b>western<\/b>] sea, will be your boundary.", "pj": "כָּל אַתְרָא דִי תִדְרוֹךְ פַּרְסַת רִגְלֵיכוֹן בֵּיהּ דִּילְכוֹן יְהֵי מִן מַדְבְּרָא וְטַוַור לְכוֹן הִינוּן טַוְורֵי בֵּית מַקְדְּשָׁא מִן נַהֲרָא רַבָּא נַהֲרָא פְּרָת עַד יַמָא דְאוֹקְיָנוּס הִינוּן מֵי בְרֵאשִׁית סְטַר מַעַרְבָא יְהֵי תְחוּמֵיכוֹן", "pj_en": "Every place where the sole of your foot shall tread will be yours, from the wilderness and the mountain; (among) your mountains shall be the house of the sanctuary, and from the great river, the River Phrat, unto the ocean sea, whose waters are (old as) the creation, on the western side shall be your limit.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 11, "v": 25, "aliyah": 7, "heb": "לֹא־יִתְיַצֵּ֥ב אִ֖ישׁ בִּפְנֵיכֶ֑ם פַּחְדְּכֶ֨ם וּמוֹרַֽאֲכֶ֜ם יִתֵּ֣ן&thinsp;<b>׀<\/b> יְהֹוָ֣ה אֱלֹֽהֵיכֶ֗ם עַל־פְּנֵ֤י כׇל־הָאָ֙רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ־בָ֔הּ כַּאֲשֶׁ֖ר דִּבֶּ֥ר לָכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "לָא יִתְעַתַּד אֱנָשׁ קֳדָמֵיכוֹן דַּחֲלָתְכוֹן וְאֵימָתְכוֹן יִתֵּן יְיָ אֱלָהֲכוֹן עַל אַפֵּי כָל אַרְעָא דִּי תִדְרְכוּן בַּהּ כְּמָא דִּי מַלִּיל לְכוֹן:", "onk_en": "No man will stand up to you; fear of you and awe of you will Adonoy, your God, place upon the surface of the entire land that you are stepping into, as He promised you.", "pj": "לָא יִתְעַתֵּד בַּר נַשׁ בְּאַפֵּיכוֹן דַּחֲלַתְכוֹן וְאֵימַתְכוֹן יִתֵּן יְיָ אֱלָהָכוֹן עַל אַפֵּי כָּל יַתְבֵי אַרְעָא דְּתִדְרְכוּן בָּהּ הֵיכְמָא דְמַלֵּיל לְכוֹן", "pj_en": "Not a man will be able to stand before you; but the Lord your God will set the fear and dread of you upon the faces of all the inhabiters of the land that you tread upon, as it hath been told you.", "tj": "לָא יְקוּם רַב וְשַׁלִּיט קֳדָמֵיכוֹן וְאֵימַתְכוֹן וְדַחֲלַתְכוֹן:", "tj_en": "Not a ruler or a prince shall stand before you; but your terror and your fear.", "rashi": "<b>לא יתיצב איש וגו'.<\/b> אֵין לִי אֶלָּא אִישׁ, אֻמָּה וּמִשְׁפָּחָה וְאִשָּׁה בִּכְשָׁפֶיהָ מִנַּיִן? תַּלְמוּד לוֹמַר \"לֹא יִתְיַצֵּב\" מִכָּל מָקוֹם, אִם כֵּן מַה תַּלְמוּד לוֹמַר \"אִישׁ\"? אֲפִלּוּ כְעוֹג מֶלֶךְ הַבָּשָׁן (שם):<br><br><b>פחדכם ומוראכם.<\/b> וַהֲלֹא פַּחַד הוּא מוֹרָא? אֶלָּא פַּחְדְּכֶם עַל הַקְּרוֹבִים וּמוֹרַאֲכֶם עַל הָרְחוֹקִים; פַּחַד לְשׁוֹן בְּעִיתַת פִּתְאֹם, מוֹרָא לְשׁוֹן דְּאָגָה מִיָּמִים רַבִּים:<br><br><b>כאשר דבר לכם.<\/b> וְהֵיכָן דִּבֵּר? (שמות כ\"ג) אֶת אֵימָתִי אֲשַׁלַּח לְפָנֶיךָ וְגוֹ' (ספרי שם):", "rashi_en": "לא יתיצב איש וגו׳ NO MAN SHALL STAND [BEFORE YOU] — I have here the statement only regarding a man! Whence may I derive that the same applies to a nation or a family or a woman with her witchcraft? Because it states: לא יתיצב, “there shall be no standing before you” — under any circumstances. — If this be so, why does it speak of a man? It means a man, be he even as Og, king of Bashan (Sifrei Devarim 52:1; cf. Rashi on Deuteronomy 3:11).<br><br>פחדם ומוראכם THE DREAD OF YOU AND THE FEAR OF YOU [THE LORD WILL PLACE UPON ALL THE LAND] — Is not, however, פחד the same as מורא? But פחדכם, “the dread of you”, refers to peoples near by, and מוראכם, “the fear of you” to those far away, for פחד denotes “sudden terror”, and מורא denotes apprehension enduring for many days (Sifrei Devarim 52:2; cf. Rashi on Sotah 20b and Niddah 71a; see also Rashi on Exodus 15:16 and Note p. 241 there).<br><br>כאשר דבר לכם AS HE HATH SAID TO YOU — And where did He say this? In Exodus 23:27: “I will send My terror before thee” (Sifrei Devarim 52:4)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
