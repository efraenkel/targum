ֶת כָּל הָאָרֶץ, כָּךְ אֲקַיֵּם לָהֶם כִּי כָל הָאֲנָשִׁים הָרֹאִים וְגוֹ', (<b>אם יראו את הארץ.<\/b> הֲרֵי זֶה מִקְרָא מְסֹרָס — חַי אָנִי כִּי כָל הָאֲנָשִׁים אִם יִרְאוּ אֶת הָאָרֶץ וּכְבוֹדִי יִמָּלֵא אֶת כָּל הָאָרֶץ, שֶׁלֹּא יִתְחַלֵּל שְׁמִי בַמַּגֵפָה הַזֹּאת לֵאמֹר מִבִּלְתִּי יְכֹלֶת ה' לַהֲבִיאָם, שֶׁלֹּא אֲמִיתֵם פִּתְאֹם כְּאִיש אֶ' אֶלָּא בְּאִחוּר מ' שָׁנָה מְעַט מְעַט):", "rashi_en": "ואולם BUT, means , (I will not slay them), but this will I do unto them (what is mentioned in v. 22 ff.). <br><br>חי אני AS TRULY AS I LIVE — This is the formula of an oath: Just as it is true that I live and that all the earth is filled with My glory, so, indeed, will I fulfil regarding them My threat “that all the men who have seen etc.”.  [אם יראו את הארץ — This verse is out of order: Its connection with what precedes it is as follows: As truly as I live, I swear that all the men who have seen My glory etc. shall not see the Land, “and yet My Glory shall fill the earth”, since My Name will not become profaned through this plague which I proposed to bring upon them by people stating: “Because the Lord is unable to bring them into the Land etc.” since I shall not then be killing them suddenly, as one man (v. 15), but during a prolonged period of forty years — little by little]."}, {"ch": 14, "v": 22, "aliyah": 3, "heb": "כִּ֣י כׇל־הָאֲנָשִׁ֗ים הָרֹאִ֤ים אֶת־כְּבֹדִי֙ וְאֶת־אֹ֣תֹתַ֔י אֲשֶׁר־עָשִׂ֥יתִי בְמִצְרַ֖יִם וּבַמִּדְבָּ֑ר וַיְנַסּ֣וּ אֹתִ֗י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְלֹ֥א שָׁמְע֖וּ בְּקוֹלִֽי׃", "onk": "אֲרֵי כָל גֻּבְרַיָּא דַּחֲזוֹ יָת יְקָרִי וְיָת אַתְוָתַי דִּי עֲבָדִית בְּמִצְרַיִם וּבְמַדְבְּרָא וְנַסִּיאוּ <b>קֳדָמַי<\/b> דְּנַן עֲשַׂר זִמְנִין וְלָא קַבִּילוּ <b>בְּמֵימְרִי<\/b>:", "onk_en": "For, all the people who see My glory and My signs which I have done in Egypt and in the desert, and they have tested [<b>before<\/b>] Me these ten times and they have not listened to My voice [<b>word<\/b>].", "pj": "אֲרוּם כָּל גוּבְרַיָא דִי חָמוּן יַת יְקָרִי וְיַת אַתְוָותַי דַעֲבָדִית בְמִצְרַיִם וּבְמַדְבְּרָא וְנַסִיאוּ קֳדָמַי דְנַן עֲשַר זִמְנִין וְלָא קַבִּילוּ לְמֵימְרִי", "pj_en": "Because all the men who have beheld My glory, and My signs, which I have wrought in Mizraim and in the Desert, have tempted Me now ten times, and have not obeyed (received) My Word:", "tj": "", "tj_en": "", "rashi": "<b>וינסו.<\/b> כְּמַשְׁמָעוֹ:<br><br><b>זה עשר פעמים.<\/b> שְׁנַיִם בַּיָּם וּשְׁנַיִם בַּמָּן וּשְׁנַיִם בַּשְּׂלָו וכוּ', כִּדְאִיתָא בְמַסֶּכֶת עֲרָכִין (דף ט\"ו):", "rashi_en": "וינסו— Take the passage as what it literally implies: AND THEY HAVE TESTED [ME]. <br><br>זה עשר פעמים TEN TIMES — twice at the Red Sea, twice in the case of the “Manna”, twice in the case of the “quails” etc., as is to be found in the Treatise Arakhin 15a."}, {"ch": 14, "v": 23, "aliyah": 3, "heb": "אִם־יִרְאוּ֙ אֶת־הָאָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖עְתִּי לַאֲבֹתָ֑ם וְכׇל־מְנַאֲצַ֖י לֹ֥א יִרְאֽוּהָ׃", "onk": "אִם יֶחֱזוּן יָת אַרְעָא דִּי קַיֵּמִית לַאֲבָהַתְהוֹן וְכָל דְּאַרְגִּיזוּ <b>קֳדָמַי<\/b> לָא יֶחֱזֻנַּהּ:", "onk_en": "If they will see the land that I have sworn to their fathers; all those who angered [<b>before<\/b>] Me will not see it.", "pj": "בִּשְׁבוּעָא אֲמִירָא דָא דְלָא יֶחֱמוּן יַת אַרְעָא דְקַיֵימִית לְאַבְהַתְהוֹן וְלָא דָרָא דְאַרְגִיזוּ קֳדָמַי לָא יֶחְמוּנָהּ", "pj_en": "by oath have I said this, That they shall not see the land which I covenanted to their fathers; and the generation which have been provokeful before me shall not behold it.", "tj": "", "tj_en": "", "rashi": "<b>אם יראו.<\/b> לֹא יִרְאוּ:<br><br><b>לא יראהו.<\/b> לֹא יִרְאוּ אֶת הָאָרֶץ:", "rashi_en": "אם יראו means THAT THEY SHALL NOT SEE.<br><br>לא יראוה THEY SHALL NOT SEE IT — i. e. they shall not see the land."}, {"ch": 14, "v": 24, "aliyah": 3, "heb": "וְעַבְדִּ֣י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֙רֶת֙ עִמּ֔וֹ וַיְמַלֵּ֖א אַחֲרָ֑י וַהֲבִֽיאֹתִ֗יו אֶל־הָאָ֙רֶץ֙ אֲשֶׁר־בָּ֣א שָׁ֔מָּה וְזַרְע֖וֹ יוֹרִשֶֽׁנָּה׃", "onk": "וְעַבְדִּי כָלֵב חֲלַף דַּהֲוָה רוּחַ אוֹחֲרִי עִמֵּיהּ וְאַשְׁלֵם בָּתַר <b>דַּחַלְתִּי<\/b> וְאַעְלִנֵּיהּ לְאַרְעָא דִּי עַל לְתַמָּן וּבְנוֹהִי יְתַרְכִנַּהּ:", "onk_en": "My servant Caleiv, because he possesed in him a different spirit, and followed Me fully [<b>in fear of Me<\/b>], I shall bring him into the land to which he came, and his children will cast [its inhabitants] from it.", "pj": "וְעַבְדִי כָלֵב חוּלַף דַהֲוַות רוּחַ אוֹחֲרֵי עִמֵיהּ וְאַשְׁלִים בָּתַר דַחַלְתִּי וְאַעֲלִינֵיהּ לְאַרְעָא דְעָאל תַּמָן וּבְנוֹי יִרְתוּנָהּ", "pj_en": "But My servant, Kaleb, because there is in him another spirit, and he hath entirely followed (in) My fear, him will I bring into the land to which he went, and his children shall possess it.", "tj": "", "tj_en": "", "rashi": "<b>רוח אחרת.<\/b> שְׁתֵּי רוּחוֹת, אַ' בַּפֶה וְאַ' בְּלֵב, לַמְּרַגְּלִים אָמַר אֲנִי עִמָּכֶם בָּעֵצָה, וּבְלִבּוֹ הָיָה לוֹמַר הָאֱמֶת, וְעַל יְדֵי כֵן הָיָה בוֹ כֹּחַ לְהַשְׁתִּיקָם, כְּמוֹ שֶׁנֶּאֱמַר (במדבר י\"ג), \"וַיַּהַס כָּלֵב\", שֶׁהָיוּ סְבוּרִים שֶׁיֹּאמַר כְּמוֹתָם, זֶהוּ שֶׁנֶּאֱמַר בְּסֵ' יְהוֹשֻׁעַ \"וָאָשֵׁב אֹתוֹ דָּבָר כַּאֲשֶׁר עִם לְבָבִי\" (יהושע י\"ד) — וְלֹא כַּאֲשֶׁר עִם פִּי (תנחומא):<br><br><b>וימלא אחרי.<\/b> וַיְמַלֵּא אֶת לִבּוֹ אַחֲרַי, וְזֶה מִקְרָא קָצָר:<br><br><b>אשר בא שמה.<\/b> חֶבְרוֹן תִּנָּתֵן לוֹ:<br><br><b>יורשנה.<\/b> כְּתַרְגּוּמוֹ \"יְתַרְכֻנַּהּ\", יוֹרִישׁוּ אֶת הָעֲנָקִים וְאֶת הָעָם אֲשֶׁר בָּהּ, וְאֵין לְתַרְגְּמוֹ \"יַרְתִּינַהּ\" אֶלָּא בִּמְקוֹם יִירָשֶׁנָּה:", "rashi_en": "רוח אחרת [BUT MY SERVANT CALEB, BECAUSE HE HAD] ANOTHER SPIRIT [WITH HIM] — The word “another’ suggests that he was filled with a twofold spirit — the one to which he gave utterance (lit., one in his mouth), and another which he concealed in his heart. To the spies he said, “I am with you in your counsel”, whilst in his heart he had the intention to tell the truth, and it was only on this account that he possessed the power to silence them (the people), as it is said, (Numbers 13:30) “And Caleb silenced [the people concerning Moses]” (cf. Rashi on that verse), for they thought that he would say the same as themselves (as the spies). It is this that is alluded to in the Book of Joshua (Joshua 14:7) where it states that Caleb said “And I brought him (Moses) word again as it was in my heart” — but not as it was in my mouth (i.e. not what I had said to the spies) (Midrash Tanchuma, Sh'lach 10).<br><br>וימלא אחרי AND HE HATH FOLLOWED ME FULLY (lit., he hath filled to go after Me) — i.e. he hath filled his heart with the intention to follow Me; — this is an elliptical sentence (the word “his heart” is omitted). <br><br>אשר בא שמה [HIM WILL I BRING UNTO THE LAND] WHEREUNTO HE WENT — Hebron shall be given to him (cf. Rashi on v. 22).<br><br>יורשנה — Understand this as the Targum does: “and his seed shall drive it (the population of the land) out” i. e. shall drive out the Anakim and the other people that are in it. — One should not give the rendering ירתינה, “they will possess it”, in the Targum except in place of the Hebrew יִירָשֶׁנָּה (in the Kal, whilst the Hiphil, as here, denotes to drive out)."}, {"ch": 14, "v": 25, "aliyah": 3, "heb": "וְהָעֲמָלֵקִ֥י וְהַֽכְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּעֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּסְע֥וּ לָכֶ֛ם הַמִּדְבָּ֖ר דֶּ֥רֶךְ יַם־סֽוּף׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲמַלְקָאָה וּכְנַעֲנָאָה יָתֵב בְּמֵישְׁרָא מְחַר אִתְפְּנוּ וְטוּלוּ לְכוֹן לְמַדְבְּרָא אֹרַח יַמָּא דְסוּף:", "onk_en": "The Amaleki and the Cana’ani are now dwelling in the valley. Tomorrow turn back and you shall travel the desert by way of the Reed Sea.”", "pj": "וַעֲמַלְקָאֵי וּכְנַעֲנָאֵי יָתֵיב בְּמֵישְׁרָא מְחַר אִתְפְּנוּ וְטוּלוּ לְכוֹן לְמַדְבְּרָא אוֹרַח יַמָא דְסוּף", "pj_en": "But the Amalekites and Kenaanites dwell in the valley: tomorrow turn you and go into the wilderness by the way of the Red Sea.", "tj": "", "tj_en": "", "rashi": "<b>והעמלקי וגו'.<\/b> אִם תֵּלְכוּ שָׁם יַהַרְגוּ אֶתְכֶם, מֵאַחַר שֶׁאֵינִי עִמָּכֶם:<br><br><b>מחר פנו.<\/b> לַאֲחוֹרֵיכֶם, <b>וסעו לכם וגו'<\/b>:", "rashi_en": "והעמלקי וגו׳ AND THE AMALEKITES [AND THE CANAANITES DWELL IN THE VALLEY] — This is not a mere statement that they dwell there; it is a warning: If you go there they will kill you, since I shall not be with you.<br><br>מחר פנו TOMORROW TURN YOU — i.e. turn backwards, וסעו לכם AND JOURNEY [INTO THE DESERT etc.]."}, {"ch": 14, "v": 26, "aliyah": 4, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימַר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר", "pj_en": "And the Lord spake with Mosheh and Aharon, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 27, "aliyah": 4, "heb": "עַד־מָתַ֗י לָעֵדָ֤ה הָֽרָעָה֙ הַזֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑י אֶת־תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖י שָׁמָֽעְתִּי׃", "onk": "עַד אֵימָתַי לִכְנִשְׁתָּא בִישְׁתָא הָדָא דִּי אִנּוּן מִתְרַעֲמִין עֲלָי יָת תֻּרְעֲמַת בְּנֵי יִשְׂרָאֵל דִּי אִנּוּן מִתְרַעֲמִין עֲלַי שְׁמִיעַ <b>קֳדָמָי<\/b>:", "onk_en": "“Until when will this wicked congregation [exist], those who provoke Me? The complaints of Bnei Yisroel, which they complain against Me, I have heard [<b>before Me<\/b>].", "pj": "עַד אֵימַת לִכְנִישְׁתָּא בִישָׁתָא דְמִתְחַבְּרִין עָלַי יַת תּוּרְעֲמוּת בְּנֵי יִשְרָאֵל דְהִינוּן מִתְרַעֲמִין עָלַי שְׁמִיעַ קֳדָמָי", "pj_en": "How long (shall I bear with) this evil congregation who gather together against Me? The murmurs of the sons of Israel which they murmur against Me are heard before Me.", "tj": "", "tj_en": "", "rashi": "<b>לעדה הרעה וגו'.<\/b> אֵלּוּ הַמְרַגְּלִים, מִכָּאן לָעֵדָה שֶׁהִיא עֲשָׂרָה (מגילה כ\"ג):<br><br><b>אשר המה מלינים.<\/b> אֶת יִשְׂרָאֵל עָלַי:<br><br><b>את תלנות בני ישראל אשר המה.<\/b> הַמְרַגְּלִים <b>מלינים<\/b> אוֹתָם <b>עלי, שמעתי<\/b>:", "rashi_en": "לעדה הרעה וגו׳ [HOW LONG SHALL I BEAR] WITH THIS EVIL CONGREGATION — This refers to the spies (not to the whole congregation); from here we learn that an עדה, “a congregation” is technically a gathering of at least ten persons (Megillah 23b).<br><br>אשר המה מלינים [THIS EVIL CONGREGATION] WHICH MAKE the Israelites MURMUR עלי AGAINST ME.<br><br>את תלנות בני ישראל אשר המה THE MURMURINGS OF THE CHILDREN OF ISRAEL WHICH THEY, the spies, מלינים MAKE them MURMUR עלי, AGAINST ME, שמעתי I HAVE HEARD.\n"}, {"ch": 14, "v": 28, "aliyah": 4, "heb": "אֱמֹ֣ר אֲלֵהֶ֗ם חַי־אָ֙נִי֙ נְאֻם־יְהֹוָ֔ה אִם־לֹ֕א כַּאֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּאׇזְנָ֑י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָכֶֽם׃", "onk": "אֱמַר לְהוֹן קַיָּם אֲנָא אֲמַר יְיָ אִם לָא כְּמָא דִי מַלֶּלְתּוּן <b>קֳדָמָי<\/b> כֵּן אֶעְבֵּד לְכוֹן:", "onk_en": "Say to them: “As I live, says Adonoy, if I do not [do to you] as you have spoken in My ears [<b>before Me<\/b>]; so I shall do to you.", "pj": "אֵימַר לְהוֹן בִּשְׁבוּעָא קְיַים אֲנָא אִין לָא הֵיכְמָא דְמַלֵילְתּוּן קֳדָמַי הֵיכְדֵין אַעֲבֵיד לְכוֹן", "pj_en": "Say to them, By oath I decree that according to (what) you have spoken, so will I do to you.", "tj": "", "tj_en": "", "rashi": "<b>חי אני.<\/b> לְשׁוֹן שְׁבוּעָה, אִם לֹא כֵן אֶעֱשֶׂה — כִּבְיָכוֹל אֵינִי חַי:<br><br><b>כאשר דברתם.<\/b> שֶׁבִּקַּשְׁתֶּם מִמֶּנִּי \"אוֹ בַּמִּדְבָּר הַזֶּה לוּ מָתְנוּ\" (פסוק ב'):", "rashi_en": "חי אני  AS TRULY AS I LIVE — This is a formula of taking an oath: If I do not do so, then — if this were at all possible to say of God — I do not live.<br><br>כאשר דברתם AS YE HAVE SPOKEN … [YOUR CARCASSES WILL FALL IN THE WILDERNESS] — because you made the request of Me: “Would that we had died in this wilderness” (Numbers 14:2)."}, {"ch": 14, "v": 29, "aliyah": 4, "heb": "בַּמִּדְבָּ֣ר הַ֠זֶּ֠ה יִפְּל֨וּ פִגְרֵיכֶ֜ם וְכׇל־פְּקֻדֵיכֶם֙ לְכׇל־מִסְפַּרְכֶ֔ם מִבֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָמָ֑עְלָה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽי׃", "onk": "בְּמַדְבְּרָא הָדֵין יִפְּלוּן פִּגְרֵיכוֹן וְכָל מִנְיָנֵיכוֹן לְכָל חֻשְׁבַּנְכוֹן מִבַּר עַשְׂרִין שְׁנִין וּלְעֵלָּא דִּי אִתְרַעַמְתּוּן עֲלָי:", "onk_en": "In this desert your corpses shall fall, all of you who were counted according to your numbers, from twenty years and above, because you have complained against Me,", "pj": "בְּמַדְבְּרָא הָדֵין יִתְרְמוּן גוּשְׁמֵיכוֹן כָּל סְכוּמְכוֹן לְכָל חוּשְׁבַּנְכוֹן מִבַּר עַשְרִין שְׁנִין וּלְעֵילָא דְאִתְרַעַמְתּוּן עָלַי", "pj_en": "In this wilderness your carcasses shall fall, the whole number of all who were counted from twenty years old and upward, who have murmured against Me.", "tj": "", "tj_en": "", "rashi": "<b>וכל פקדיכם לכל מספרכם.<\/b> כָּל הַנִּמְנֶה לְכָל מִסְפָּר שֶׁאַתֶּם נִמְנִים בּוֹ, כְּגוֹן לָצֵאת וְלָבֹא לַצָּבָא וְלָתֵת שְׁקָלִים, כָּל הַמְּנוּיִים לְכָל אוֹתָן מִסְפָּרוֹת יָמוּתוּ, וְאֵלּוּ הֵן <b>מבן עשרים שנה וגו';<\/b> לְהוֹצִיא שִׁבְטוֹ שֶׁל לֵוִי שֶׁאֵין פְּקוּדֵיהֶם מִבֶּן עֶשְׂרִים:", "rashi_en": "וכל פקדיכם לכל מספרכם AND ALL OF YOU THAT WERE NUMBERED IN ANY COUNTING OF YOU — i.e. all that are numbered of you in any census (מספר) in which you are numbered, as, for instance, on going to or coming back from war, or when giving the shekels: all who are numbered in all these censuses shall die, and these are, everyone מבן עשרים שנה וגו׳ FROM TWENTY YEARS OLD AND UPWARDS — The age is expressly mentioned to exclude the tribe of Levi because those who were numbered of them were not from twenty years old and upwards (but they were either numbered from one month old — cf. Numbers 3:40, or from thirty years old; Numbers 4:3) (Bava Batra 121b)."}, {"ch": 14, "v": 30, "aliyah": 4, "heb": "אִם־אַתֶּם֙ תָּבֹ֣אוּ אֶל־הָאָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֙אתִי֙ אֶת־יָדִ֔י לְשַׁכֵּ֥ן אֶתְכֶ֖ם בָּ֑הּ כִּ֚י אִם־כָּלֵ֣ב בֶּן־יְפֻנֶּ֔ה וִיהוֹשֻׁ֖עַ בִּן־נֽוּן׃", "onk": "אִם אַתּוּן תֵּעֲלוּן לְאַרְעָא דִּי <b>קַיֵּמִית בְּמֵימְרִי<\/b> לְאַשְׁרָאָה יָתְכוֹן בַּהּ אֶלָּהֵן כָּלֵב בַּר יְפֻנֶּה וִיהוֹשֻׁעַ בַּר נוּן:", "onk_en": "Surely you shall [not] come into the land to which I raised My Hand [to swear] [<b>sworn by My word<\/b>] that I would cause you to live in it; except for Caleiv the son of Yefuneh and Yehoshua the son of Nun.", "pj": "בִּשְׁבוּעָא חֲמִירָא דְאַתּוּן לָא תֵיעֲלוּן לְאַרְעָא דְקַיֵימִית בְּמֵימְרִי לְאַשְׁרָאָה יַתְכוֹן בָּהּ אֲרוּם אֱלָהֵן כָּלֵב בַּר יְפוּנֶה וִיהוֹשֻׁעַ בַּר נוּן", "pj_en": "By a fast oath (have I sworn) that you shall not enter into the land which I covenanted in My Word to give you to inhabit, except Kaleb bar Jephunneh and Jehoshua bar Nun.", "tj": "דַאֲרֵימַת יַת יְדַי בִּשְׁבוּעָה:", "tj_en": "For I have uplifted My hand with an oath.", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 31, "aliyah": 4, "heb": "וְטַ֨פְּכֶ֔ם אֲשֶׁ֥ר אֲמַרְתֶּ֖ם לָבַ֣ז יִהְיֶ֑ה וְהֵבֵיאתִ֣י אֹתָ֔ם וְיָֽדְעוּ֙ אֶת־הָאָ֔רֶץ אֲשֶׁ֥ר מְאַסְתֶּ֖ם בָּֽהּ׃", "onk": "וְטַפְלְכוֹן דִּי אֲמַרְתּוּן לְבִזָּא יְהֵי וְאָעֵל יָתְהוֹן וְיִדְּעוּן יָת אַרְעָא דִּי קַצְתּוּן בַּהּ:", "onk_en": "Your infants, about whom you said that they will be as spoils, I shall bring them [there] and they will know the land which you despised.", "pj": "וְטַפְלְכוֹן דַאֲמַרְתּוּן דִלְבִיזָא יְהוֹן וְאָעֵיל יַתְהוֹן וְיִנְדְעוּן יַת אַרְעָא דְקַצְתּוּן בָּהּ", "pj_en": "But your children, who you said would be a prey, them will I bring in, and they shall know the land which you rejected;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 32, "aliyah": 4, "heb": "וּפִגְרֵיכֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּמִּדְבָּ֥ר הַזֶּֽה׃", "onk": "וּפִגְרֵיכוֹן דִּי לְכוֹן יִפְּלוּן בְּמַדְבְּרָא הָדֵין:", "onk_en": "Your corpses—yours, shall fall in this desert.", "pj": "וּפִגְרֵיכוֹן דִלְכוֹן יִתְרְמוּן בְּמַדְבְּרָא הָדֵין", "pj_en": "but your carcasses shall fall in this wilderness.", "tj": "", "tj_en": "", "rashi": "<b>ופגריכם אתם.<\/b> כְּתַרְגּוּמוֹ, לְפִי שֶׁדִּבֵּר עַל הַבָּנִים לְהַכְנִיסָם לָאָרֶץ וּבִקֵּשׁ לוֹמַר וְאַתֶּם תָּמוּתוּ, נוֹפֵל לָשׁוֹן זֶה כָּאן לוֹמַר \"אתם\":", "rashi_en": "ופגריכם אתם — Understand this as the Targum does: (“But your carcasses — those of you — they shall fall in this desert”). Because in the previous verse He said of the children that He would bring them into the Land, and it wishes to state now: “but you will die”, this idiom is appropriate here — to say the word אתם (in addition to the personal suffix in פגריכם, in order to stress the contrast)."}, {"ch": 14, "v": 33, "aliyah": 4, "heb": "וּ֠בְנֵיכֶ֠ם יִהְי֨וּ רֹעִ֤ים בַּמִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְנָשְׂא֖וּ אֶת־זְנוּתֵיכֶ֑ם עַד־תֹּ֥ם פִּגְרֵיכֶ֖ם בַּמִּדְבָּֽר׃", "onk": "וּבְנֵיכוֹן יְהוֹן <b>מְאַחֲרִין<\/b> בְּמַדְבְּרָא אַרְבְּעִין שְׁנִין וִיקַבְּלוּן יָת חוֹבֵיכוֹן עַד דִּיסוּפוּן פִּגְרֵיכוֹן בְּמַדְבְּרָא:", "onk_en": "Your children, they shall be wanderers [<b>delayed<\/b>] in the desert for forty years, and they will bear [the burden of] your dissoluteness, until the last of your corpses are in the desert.", "pj": "וּבְנֵיכוֹן יְהוֹן טַעֲיָין בְּמַדְבְּרָא אַרְבְּעִין שְׁנִין וִיקַבְּלוּן יַת חוֹבֵיכוֹן עַד זְמַן דִיסוּפוּן פִּגְרֵיכוֹן בְּמַדְבְּרָא", "pj_en": "Yet your children will have to wander in this wilderness forty years, and bear your sins until the time that your carcasses are consumed in the wilderness.", "tj": "", "tj_en": "", "rashi": "<b>ארבעים שנה.<\/b> לֹא מֵת אֶחָד מֵהֶם פָּחוּת מִבֶּן שִׁשִּׁים, לְכָךְ נִגְזַר אַרְבָּעִים, כְּדֵי שֶׁיִּהְיוּ אוֹתָם שֶׁל בְּנֵי עֶשְׂרִים מַגִּיעִין לִכְלַל שִׁשִּׁים; שָׁנָה רִאשׁוֹנָה הָיְתָה בִכְלָל, וְאַעַ\"פִּ שֶׁקָּדְמָה לְשִׁלּוּחַ הַמְרַגְּלִים, לְפִי שֶׁמִּשֶּׁעָשׂוּ אֶת הָעֶגֶל עָלְתָה גְזֵרָה זוֹ בְמַחֲשָׁבָה, אֶלָּא שֶׁהִמְתִּין לָהֶם עַד שֶׁתִּתְמַלֵּא סְאָתָם, וְזֶהוּ שֶׁנֶּאֱמַר \"וּבְיוֹם פָּקְדִי\" — בַּמְרַגְּלִים — \"וּפָקַדְתִּי עֲלֵיהֶם חַטָּאתָם\" (שמות ל\"ב); וְאַף כָּאן נֶאֱמַר \"תִּשְׂאוּ אֶת עֲוֹנֹתֵיכֶם\" — שְׁתֵּי עֲוֹנוֹת, שֶׁל עֵגֶל וְשֶׁל תְּלוּנָה, וְחָשַׁב לָהֶם בְּמִנְיַן חַיֵּיהֶם מִקְצָת שָׁנָה כְּכֻלָּהּ, וּכְשֶׁנִּכְנְסוּ לִשְׁנַת שִׁשִּׁים מֵתוּ אוֹתָם שֶׁל בְּנֵי עֶשְׂרִים:<br><br><b>ונשאו את זנותיכם.<\/b> כְּתַרְגּוּמוֹ \"וִיקַבְּלוּן יָת חוֹבֵיכוֹן\":", "rashi_en": "ארבעים שנה [AND YOUR CHILDREN SHALL WANDER IN THE DESERT] FORTY YEARS — None of them was to die younger than 60 years old (Bava Batra 121b). For this reason a period of forty years was decreed for their wanderings in order that those who were at that time 20 years old (and only those from twenty years old and upwards came under this decree; cf. v. 29) should reach the age of sixty (the average age of man; cf. Moed Katan 28a and Tosefta Yoma 4:10. s. v. ומיתה). The first year that they were in the wilderness was included in the forty although it preceded the sending forth of the spies (which took place in the second year), because from the moment they made the Golden Calf this decree entered the mind of God, but He waited for them (postponed their punishment) until their measure of sin should be full. This is the meaning of what is stated, (Exodus 32:34) “And in the day when I shall visit — viz., at the incident of the spies — I shall visit their sin (that of the Golden Calf) upon them”. And, here, indeed, it states, (v. 34) “ye shall bear your iniquities” (in the plural) suggesting two sins; that of the Calf and that of the murmuring. — In the calculation it (Scripture) regards in the years of their lives a part of the year (of the sixtieth year) as the whole of it, and as soon as they entered their sixtieth year those who were now twenty years old died (Tanchuma 4:4:13).<br><br>ונשאו את זנותיכם AND SHALL BEAR YOUR WHOREDOMS — Understand this as the Targum does: and they shall bear your guilt (cf. Targum on ונשא את עונה, Numbers 30:16, and Rashi on that verse)."}, {"ch": 14, "v": 34, "aliyah": 4, "heb": "בְּמִסְפַּ֨ר הַיָּמִ֜ים אֲשֶׁר־תַּרְתֶּ֣ם אֶת־הָאָ֘רֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַשָּׁנָ֞ה י֣וֹם לַשָּׁנָ֗ה תִּשְׂאוּ֙ אֶת־עֲוֺנֹ֣תֵיכֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽידַעְתֶּ֖ם אֶת־תְּנוּאָתִֽי׃", "onk": "בְּמִנְיַן יוֹמַיָּא דִּי אַלֶּלְתּוּן יָת אַרְעָא אַרְבְּעִין יוֹמִין יוֹמָא לְשַׁתָּא יוֹמָא לְשַׁתָּא תְּקַבְּלוּן יָת חוֹבֵיכוֹן אַרְבְּעִין שְׁנִין וְתִדְּעוּן יָת <b>דְּאִתְרַעַמְתּוּן עֲלָי<\/b>:", "onk_en": "According to the number of days which you scouted the land; forty days, a day for a year, a day for a year you will bear the burden of your iniquity forty years, and you will know My displeasure [<b>that you have murmured against Me<\/b>].", "pj": "בְּמִנְיַן יוֹמִין דְאַלֵילְתּוּן יַת אַרְעָא אַרְבְּעִין יוֹמִין יוֹמָא לְשַׁתָּא יוֹמָא לְשַׁתָּא תְּקַבְּלוּן יַת חוֹבֵיכוֹן אַרְבְּעִין שְׁנִין וְתִנְדְעוּן יַת דְאִתְרַעַמְתּוּן עָלָי", "pj_en": "According to the number of the days in which you were exploring the land, forty days, a day for a year, a day for a year, you shall receive for your sins, forty years, and shall know (the consequence) of your murmuring against Me.", "tj": "", "tj_en": "", "rashi": "<b>את תנואתי.<\/b> שֶׁהֲנִיאוֹתֶם אֶת לְבַבְכֶם מֵאַחֲרַי, תנואה לְשׁוֹן הֲסָרָה, כְּמוֹ \"כִּי הֵנִיא אָבִיהָ אֹתָהּ\" (במדבר ל):", "rashi_en": "את תנואתי [AND YE SHALL KNOW] את תנואתי — You shall know (realise) that you have removed your heart from following after Me. תנואה is an expression for “removing”, similar to (Numbers 30:6) “for her father hath removed her (הניא) from her vow” (cf. Rashi on that verse, where he quotes this phrase)."}, {"ch": 14, "v": 35, "aliyah": 4, "heb": "אֲנִ֣י יְהֹוָה֮ דִּבַּ֒רְתִּי֒ אִם־לֹ֣א&thinsp;<b>׀<\/b> זֹ֣את אֶֽעֱשֶׂ֗ה לְכׇל־הָעֵדָ֤ה הָֽרָעָה֙ הַזֹּ֔את הַנּוֹעָדִ֖ים עָלָ֑י בַּמִּדְבָּ֥ר הַזֶּ֛ה יִתַּ֖מּוּ וְשָׁ֥ם יָמֻֽתוּ׃", "onk": "אֲנָא יְיָ <b>גְּזָרִית בְּמֵימְרִי<\/b> אִם לָא דָּא אֶעְבֵּד לְכָל כְּנִשְׁתָּא בִישְׁתָא הָדָא דְּאִזְדַּמְּנוּן עֲלָי בְּמַדְבְּרָא הָדֵין יְסוּפוּן וְתַמָּן יְמוּתוּן:", "onk_en": "I am Adonoy; I have spoken—[<b>decreed by My word<\/b>]—if I do not do this to this entire evil congregation that are gathered against Me; in this desert they shall be finished and there they shall die.”", "pj": "אֲנָא יְיָ גְזָרִית בְּמֵימְרִי אִין לָא גְזָרִית בְּמֵימְרִי לְכָל כְּנִישְׁתָּא בִישָׁתָא הֲדָא דְאִזְדַמְנוּ לְמַרְדָא עָלַי בְּמַדְבְּרָא הָדֵין יְסוּפוּן וְתַמָן יְמוּתוּן", "pj_en": "I the Lord have decreed in My Word, - if I have not made a decree in My Word against all this evil congregation who have gathered a rebel against Me in this wilderness, that they shall be consumed and die there.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 36, "aliyah": 4, "heb": "וְהָ֣אֲנָשִׁ֔ים אֲשֶׁר־שָׁלַ֥ח מֹשֶׁ֖ה לָת֣וּר אֶת־הָאָ֑רֶץ וַיָּשֻׁ֗בוּ <span class=\"mam-kq\"><span class=\"mam-kq-k\">(וילונו)<\/span> <span class=\"mam-kq-q\">[וַיַּלִּ֤ינוּ]<\/span><\/span> עָלָיו֙ אֶת־כׇּל־הָ֣עֵדָ֔ה לְהוֹצִ֥יא דִבָּ֖ה עַל־הָאָֽרֶץ׃", "onk": "וְגֻבְרַיָּא דִּי שְׁלַח משֶׁה לְאַלָּלָא יָת אַרְעָא וְתָבוּ וְאַרְעִימוּ עֲלוֹהִי יָת כָּל כְּנִשְׁתָּא לְאַפָּקָא שׁוּם בִּישׁ עַל אַרְעָא:", "onk_en": "Those men whom Moshe sent to scout the land, who returned and provoked the complaints of the entire congregation against him, by spreading slander about the land;", "pj": "וְגוּבְרַיָא דִי שְׁדַר משֶׁה לְאַלְלָא יַת אַרְעָא וְתָבוּ וְאַרְעִימוּ עֲלוֹהִי יַת כָּל כְּנִישְׁתָּא לְאַפָּקָא טִיב בִּישׁ עַל אַרְעָא", "pj_en": "But the men whom Mosheh had sent to explore the land, and who returning had made the whole congregation murmur against him, by bringing forth an evil report of the land,", "tj": "", "tj_en": "", "rashi": "<b>וישבו וילינו עליו.<\/b> וּכְשֶׁשָּׁבוּ מִתּוּר הָאָרֶץ הִרְעִימוּ עָלָיו אֶת כָּל הָעֵדָה בְּהוֹצָאַת דִּבָּה, אוֹתָם אֲנָשִׁים <b>וימתו;<\/b> כָּל הוֹצָאַת דִּבָּה לְשׁוֹן חִנּוּךְ דְּבָרִים, שֶׁמַּלְקִיחִים לְשׁוֹנָם לְאָדָם לְדַבֵּר בּוֹ, כְּמוֹ \"דּוֹבֵב שִׂפְתֵי יְשֵׁנִים\" (שיר השירים ז'), וְיֶשְׁנָהּ לְטוֹבָה וְיֶשְׁנָהּ לְרָעָה, לְכָךְ נֶאֱמַר כָּאן <b>מוצאי דבת הארץ רעה<\/b>, שֶׁיֵּשׁ דִּבָּה שֶׁהִיא טוֹבָה:<br><br><b>דבה.<\/b> פרליר\"ש בְּלַעַז:", "rashi_en": "וישבו וילינו עליו [AND THE MEN WHOM MOSES SENT TO SEARCH THE LAND] RETURNED AND MADE THE WHOLE CONGREGATION MURMUR AGAINST HIM — This meant: “the men whom Moses sent and who, when they returned (וישבו) from searching the Land, made the whole congregation murmur against him by making them utter an evil report, — those men died. Wherever the phrase הוציא דבה occurs it denotes instructing to speak — that people teach their way of speaking to a person that he may speak it (cf. Rashi on  23:31). Similar is, (Song 7:10) “causing the lips of those who are asleep to speak.\" (דובב) There may be one (a דבה, “an utterance”) for good, or there may be one for evil: and it is for this reason that it states here, “[even those men] that made the people utter evil speech about the Land”, because, as I have stated, there is a דבה which may be termed good. <br><br>דבה is parlerie in O. F.; (Engl = utterance)."}, {"ch": 14, "v": 37, "aliyah": 4, "heb": "וַיָּמֻ֙תוּ֙ הָֽאֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת־הָאָ֖רֶץ רָעָ֑ה בַּמַּגֵּפָ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּמִיתוּ גֻּבְרַיָּא דְּאַפִּיקוּ שׁוּם בִּישׁ עַל אַרְעָא בְּמוֹתָנָא קֳדָם יְיָ:", "onk_en": "Those men died—who spread evil slander against the land—in a plague, before Adonoy.", "pj": "וּמִיתוּ גוּבְרַיָא דְאַפִּיקוּ טִיב בִּישׁ עַל אַרְעָא בְשִׁבְעָא יוֹמִין בְּאֵילוּל וַהֲווֹן מוֹרָנֵי נַפְקִין מִן פְּרַתְהוֹן וְאָזְלִין עַד בֵּית לִישַׁנְהוֹן וְאָכְלִין לִישַׁנְהוֹן עִם מוֹרִיגֵיהוֹן וְאִתְקַבָּרוּ בְּמוֹתָנָא מִן קֳדָם יְיָ", "pj_en": "(even those) men who had brought forth the evil of the report of the land died, on the seventh day of the month of Elul, with worms coming from their navels, and with worms devouring their tongues; and were buried in death from before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>במגפה לפני ה'.<\/b> בְּאוֹתָהּ מִיתָה הַהֲגוּנָה לָהֶם, מִדָּה כְּנֶגֶד מִדָּה, הֵם חָטְאוּ בַּלָּשׁוֹן, וְנִשְׁתַּרְבֵּב לְשׁוֹנָם עַד טַבּוּרָם וְתוֹלָעִים יוֹצְאִים מִלְּשׁוֹנָם וּבָאִין לְתוֹךְ טַבּוּרָם, לְכָךְ נֶאֱמַר \"בַּמַּגֵּפָה\" וְלֹא \"בְמַגֵּפָה\", וְזֶהוּ <b>לפני ה'<\/b> — בְּאוֹתָהּ הָרְאוּיָה לָהֶם עַ\"פִּ מִדּוֹתָיו שֶׁל הַקָּבָּ\"ה שֶׁהוּא מוֹדֵד מִדָּה כְּנֶגֶד מִדָּה (סוטה ל\"ה):", "rashi_en": "במגפה לפני ה׳ [EVEN THOSE MEN DIED …] BY THE PLAGUE BEFORE THE LORD — by that death which was fitting for them — measure for measure. They had sinned with their tongue, therefore their tongue grew long extending right down to their navels, and worms came from their tongue and entered their navels. This is the reason why it states, they died by “the” plague, and not בְּמַגֵּפָה by “a” plague; this, too, is the meaning of the words “before the Lord” (they died by the plague which was before the Lord) — by that plague which was fitting for them according to the methods of the Holy One, blessed be He, Who metes out “measure for measure” (Sotah 35a)."}, {"ch": 14, "v": 38, "aliyah": 4, "heb": "וִיהוֹשֻׁ֣עַ בִּן־נ֔וּן וְכָלֵ֖ב בֶּן־יְפֻנֶּ֑ה חָיוּ֙ מִן־הָאֲנָשִׁ֣ים הָהֵ֔ם הַהֹלְכִ֖ים לָת֥וּר אֶת־הָאָֽרֶץ׃", "onk": "וִיהוֹשֻׁעַ בַּר נוּן וְכָלֵב בַּר יְפֻנֶּה אִתְקַיְּמוּ מִן גֻּבְרַיָּא הָאִנּוּן דַּאֲזָלוּ לְאַלָּלָא יָת אַרְעָא:", "onk_en": "Yehoshua the son of Nun and Caleiv the son of Yefuneh, lived, from among those men who went to scout the land.", "pj": "וִיהוֹשֻׁעַ בַּר נוּן וְכָלֵב בַּר יְפֻנֶה אִתְקַיְימוּ מִן גוּבְרַיָא הָאִינוּן דְהַלִיכוּ לְאַלָלָא יַת אַרְעָא", "pj_en": "Only Jehoshua bar Nun and Kaleb bar Jephunneh survived of those men who had gone to explore the land.", "tj": "", "tj_en": "", "rashi": "<b>ויהושע וכלב … חיו וגו'.<\/b> מַה תַּ\"ל <b>חיו מן האנשים ההם<\/b>? אֶלָּא מְלַמֵּד שֶׁנָּטְלוּ חֶלְקָם שֶׁל מְרַגְּלִים בָּאָרֶץ וְקָמוּ תַחְתֵּיהֶם לַחַיִּים (בבא בתרא קי\"ח):", "rashi_en": "ויהושע וכלב ... חיו וגו׳ AND JOSHUA AND CALEB LIVED [FROM THOSE MEN] etc. — What is the force of חיו מן האנשים ההם (does it not state later on, Numbers 26:65, ‘‘And there was not left a man of them save Caleb the son of Yephuneh and Joshua the son of Nun)\"? But the phrase teaches that they received the portion of the spies in the Land and thus remained alive, so to speak, in their stead (i.e. the text does not intend to state that they alone of all those men remained alive, but that they lived “from” the other men, i.e. from their portion in the Land) (Bava Batra 118b)."}, {"ch": 14, "v": 39, "aliyah": 4, "heb": "וַיְדַבֵּ֤ר מֹשֶׁה֙ אֶת־הַדְּבָרִ֣ים הָאֵ֔לֶּה אֶֽל־כׇּל־בְּנֵ֖י יִשְׂרָאֵ֑ל וַיִּֽתְאַבְּל֥וּ הָעָ֖ם מְאֹֽד׃", "onk": "וּמַלִּיל משֶׁה יָת פִּתְגָּמַיָּא הָאִלֵּין לְכָל בְּנֵי יִשְׂרָאֵל וְאִתְאַבָּלוּ עַמָּא לַחֲדָא:", "onk_en": "Moshe spoke these words to all of Bnei Yisroel, and the people mourned greatly.", "pj": "וּמַלֵיל משֶׁה יַת פִּתְגָמַיָא הָאִילֵן עִם כָּל בְּנֵי יִשְרָאֵל וְאִתְאַבְּלוּ עַמָא לַחֲדָא", "pj_en": "And Mosheh spake these words with all the sons of Israel, and the people mourned greatly.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 40, "aliyah": 4, "heb": "וַיַּשְׁכִּ֣מוּ בַבֹּ֔קֶר וַיַּֽעֲל֥וּ אֶל־רֹאשׁ־הָהָ֖ר לֵאמֹ֑ר הִנֶּ֗נּוּ וְעָלִ֛ינוּ אֶל־הַמָּק֛וֹם אֲשֶׁר־אָמַ֥ר יְהֹוָ֖ה כִּ֥י חָטָֽאנוּ׃", "onk": "וְאַקְדִּימוּ בְצַפְרָא וּסְלִיקוּ לְרֵישׁ טוּרָא לְמֵימַר הָא אֲנַחְנָא סָלְקִין לְאַתְרָא דִּי אֲמַר יְיָ אֲרֵי חַבְנָא:", "onk_en": "They awoke early in the morning and went up to the peak of the mountain, saying: “We are ready to go up to the place of which Adonoy spoke (promised), for we have sinned.”", "pj": "וְאַקְדִימוּ בְּצַפְרָא וּסְלִיקוּ לְרֵישׁ טַוְורָא לְמֵימַר הָא אֲנַחְנָא סַלְקִין לְאַתְרָא דְאָמַר יְיָ אֲרוּם חַבְנָא", "pj_en": "And they arose in the morning and went up to the top of the mountain., saying: Behold, we will go up to the place of which the Lord hath spoken; for we have sinned.", "tj": "", "tj_en": "", "rashi": "<b>אל ראש ההר.<\/b> הוּא הַדֶּרֶךְ הָעוֹלֶה לְאֶרֶץ יִשְׂרָאֵל:<br><br><b>הננו ועלינו אל המקום.<\/b> לְאֶרֶץ יִשְׂרָאֵל:<br><br><b>אשר אמר ה'.<\/b> לְתִתָּהּ לָנוּ, שָׁם נַעֲלֶה:<br><br><b>כי חטאנו.<\/b> עַל אֲשֶׁר אָמַרְנוּ הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה:", "rashi_en": "אל ראש ההר [AND THEY … WENT UP] INTO THE TOP OF THE MOUNTAIN — that is the route that leads up to the Land of Israel.<br><br>הננו ועלינו אל המקום LO, WE ARE HERE, AND WILL GO UP INTO THE PLACE, viz., to the Land of Israel,<br><br>אשר אמר ה׳ WHICH THE LORD HATH PROMISED to give us; thither will we go up, (and we will not return to Egypt). <br><br>כי חטאנו FOR WE HAVE SINNED in that we said, (v. 3) “were it not better for us to return to Egypt?”"}, {"ch": 14, "v": 41, "aliyah": 4, "heb": "וַיֹּ֣אמֶר מֹשֶׁ֔ה לָ֥מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת־פִּ֣י יְהֹוָ֑ה וְהִ֖וא לֹ֥א תִצְלָֽח׃", "onk": "וַאֲמַר משֶׁה לְמָא דְנַן אַתּוּן עָבְרִין עַל <b>גְּזֵרַת<\/b> מֵימְרָא דַיְיָ וְהִיא לָא תַצְלַח:", "onk_en": "Moshe said: “Why are you now transgressing the word [<b>decree<\/b>] of Adonoy; it will not succeed.", "pj": "וַאֲמַר משֶׁה מַה דֵין אַתּוּן עַבְרִין עַל גְזֵירַת מֵימְרָא דַיְיָ וְאִיהִי לָא תִצְלַח לְכוֹן", "pj_en": "But Mosheh said, Why will you act against the decree of the Word of the Lord? But it will not prosper with you.", "tj": "", "tj_en": "", "rashi": "<b>והוא לא תצלח.<\/b> זוֹ שֶׁאַתֶּם עוֹשִׂים לֹא תִצְלָח:", "rashi_en": "והיא לא תצלח AND IT SHALL NOT PROSPER — What you are about to do will not be successful."}, {"ch": 14, "v": 42, "aliyah": 4, "heb": "אַֽל־תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהֹוָ֖ה בְּקִרְבְּכֶ֑ם וְלֹא֙ תִּנָּ֣גְפ֔וּ לִפְנֵ֖י אֹיְבֵיכֶֽם׃", "onk": "לָא תִסְּקוּן אֲרֵי לֵית שְׁכִנְתָּא דַיְיָ בֵּינֵיכוֹן וְלָא תִתַּבְּרוּן קֳדָם בַּעֲלֵי דְבָבֵיכוֹן:", "onk_en": "Do not go up, for Adonoy is not among you, and do not die before your enemies,", "pj": "לָא תִסְקוּן אֲרוּם לֵית שְׁכִינְתָּא דַיְיָ שַׁרְיָא בֵּינֵיכוֹן וַאֲרוֹנָא וּמַשְׁכְּנָא וַעֲנַנֵי יְקָרָא לֵיתֵיהוֹן מְטַיְילִין וְלָא תִתְבְּרוּן קֳדָם בַּעֲלֵי דְבָבֵיכוֹן", "pj_en": "Go not up, for the Lord's Shekinah dwelleth not among you; and the ark, the tabernacle, and the Cloud of Glory proceed not; and be not crushed before your enemies.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 14, "v": 43, "aliyah": 4, "heb": "כִּי֩ הָעֲמָלֵקִ֨י וְהַכְּנַעֲנִ֥י שָׁם֙ לִפְנֵיכֶ֔ם וּנְפַלְתֶּ֖ם בֶּחָ֑רֶב כִּֽי־עַל־כֵּ֤ן שַׁבְתֶּם֙ מֵאַחֲרֵ֣י יְהֹוָ֔ה וְלֹא־יִהְיֶ֥ה יְהֹוָ֖ה עִמָּכֶֽם׃", "onk": "אֲרֵי עֲמַלְקָאָה וּכְנַעֲנָאָה תַמָּן קֳדָמֵיכוֹן וְתִפְּלוּן בְּחַרְבָּא אֲרֵי עַל כֵּן תַּבְתּוּן מִבָּתַר <b>פָּלְחָנָא<\/b> דַיְיָ וְלָא יְהֵי <b>מֵימְרָא<\/b> דַיְיָ <b>בְּסַעְדְּכוֹן<\/b>:", "onk_en": "For the Amaleki and the Cana’ani are there before you, and you will fall by the sword, for, you turned from following [<b>the service of<\/b>] Adonoy, and [<b>the word of<\/b>] Adonoy will not be with you [<b>to your aid<\/b>].”", "pj": "אֲרוּם עֲמַלְקָאֵי וּכְנַעֲנָאֵי תַּמָן זְמִינִין קֳדָמֵיכוֹן וְתִתְרְמוּן קְטִילִין בְּחַרְבָּא אֲרוּם מִן בִּגְלַל דְחַבְתּוּן מִן בָּתַר פּוּלְחָנָא דַיְיָ בְּגִין כֵּן לָא יְהֵי מֵימְרָא דַיְיָ בְּסַעַדְכוֹן", "pj_en": "For the Amalekites and Kenaanites are there prepared for you, and you will fall slaughtered by the sword. For, because you have turned away from the service of the Lord, the Word of the Lord will not be your Helper.", "tj": "", "tj_en": "", "rashi": "<b>כי על כן שבתם.<\/b> כְּלוֹמַר, כִּי זֹאת תָּבֹא לָכֶם עַל אֲשֶׁר שַׁבְתֶּם וְגוֹ':", "rashi_en": "כי על כן שבתם — means: for (כי) this will come upon you, because (על כן) ye have turned away etc. (cf. Rashi on Genesis 18:5 and Numbers 10:31)."}, {"ch": 14, "v": 44, "aliyah": 4, "heb": "וַיַּעְפִּ֕לוּ לַעֲל֖וֹת אֶל־רֹ֣אשׁ הָהָ֑ר וַאֲר֤וֹן בְּרִית־יְהֹוָה֙ וּמֹשֶׁ֔ה לֹא־מָ֖שׁוּ מִקֶּ֥רֶב הַֽמַּחֲנֶֽה׃", "onk": "וְאַרְשָׁעוּ לְמִסַּק לְרֵישׁ טוּרָא וַאֲרוֹן קְיָמָא דַיְיָ וּמשֶׁה לָא עֲדוֹ מִגּוֹ מַשְׁרִיתָא:", "onk_en": "They defiantly went up the mountain peak, but the Ark of the Covenant of Adonoy, and Moshe, did not move from amidst the encampment.", "pj": "וְאִזְדְרָזוּ בַּחֲשֵׁיכָא קֳדָם קְרִיצְתָּא לְמֵיסוֹק לְרֵישׁ טוּרָא בְּרַם אֲרוֹנָא דְבֵיהּ קְיָימָא דַיְיָ וּמשֶׁה לָא זָזוּ מִגוֹ מַשְׁרִיתָא", "pj_en": "But they armed themselves in the dark before the morning to go up to the height of the mountain: but the ark, in which was the covenant of the Lord, and Mosheh, stirred not from the midst of the camp.", "tj": "ויעפילו וְזָרִיזוּ:", "tj_en": "", "rashi": "<b>ויעפלו.<\/b> לְשׁוֹן חֹזֶק, וְכֵן \"הִנֵּה עֻפְּלָה\" (חבקוק ב'), אינג\"ריש בְּלַעַז, לְשׁוֹן עַזּוּת, וְכֵן \"עֹפֶל בַּת צִיּוֹן\" (מיכה ד'), \"עֹפֶל וָבַחַן\" (ישעיהו ל\"ב), וּמִדְרַשׁ תַּנְחוּמָא מְפָרְשׁוֹ לְשׁוֹן אֹפֶל — הָלְכוּ חֲשֵׁכִים, שֶׁלֹא בִרְשׁוּת:", "rashi_en": "ויעפלו is an expression for “strength” (doing a thing by insolent force). Similar is, (Habakkuk 2:4) “Behold it is insolent (עפלה)”, engres in O. F., an expression for insolent force. Similar also is, (Micah 4:8), “stronghold (עפל) of the daughter of Zion”; (Jes. 32:14) “the forts (עפל) and towers”. The Midrash Tanchuma 4:4:19, however, explains it (ויעפלו) to be of the same meaning as אופל, darkness, i.e. they went in darkness — without permission."}, {"ch": 14, "v": 45, "aliyah": 4, "heb": "וַיֵּ֤רֶד הָעֲמָלֵקִי֙ וְהַֽכְּנַעֲנִ֔י הַיֹּשֵׁ֖ב בָּהָ֣ר הַה֑וּא וַיַּכּ֥וּם וַֽיַּכְּת֖וּם עַד־הַֽחׇרְמָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּנְחַת עֲמַלְקָאָה וּכְנַעֲנָאָה דְּיָתֵב בְּטוּרָא הַהוּא וּמְחֻנּוּן <b>וּטְרָדֻנּוּן<\/b> עַד חָרְמָה:", "onk_en": "The Amaleki and the Cana’ani swooped down, they who were dwelling in that mountain, and they smote and crushed [<b>persued<\/b>] them until Chormah.", "pj": "וּנְחַת עֲמַלְקָאָה וּכְנַעֲנָאָה דְיָתֵיב בְּטַוְורָא הַהוּא וּקְטִילוּ יַתְהוֹן וְשֵׁיצֵיאוּנוּן וּטְרָדוּנוּן עַד שֵׁיצָיוּ", "pj_en": "And the Amalekites and Kenaanites who dwelt in that mountain came down and slaughtered and destroyed them, and drave them hard to destruction.", "tj": "", "tj_en": "", "rashi": "<b>ויכתום.<\/b> כְּמוֹ \"וָאֶכֹּת אֹתוֹ טָחוֹן\" (דברים ט') — מַכָּה אַחַר מַכָּה:<br><br><b>עד החרמה.<\/b> שֵׁם הַמָּקוֹם נִקְרָא עַל שֵׁם הַמְּאֹרָע:", "rashi_en": "ויכתום AND COMPLETELY DISCOMFITED THEM — This word is the same in meaning as (Deuteronomy 9:21) “and I pounded it (ואכות) and ground it very thin”. The text implies: blow upon blow.<br><br>ער החרמה EVEN UNTO HORMAH — The place was so called (חרמה doom, destruction) on account of what happened there."}, {"ch": 15, "v": 1, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימַר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 2, "aliyah": 4, "heb": "דַּבֵּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם כִּ֣י תָבֹ֗אוּ אֶל־אֶ֙רֶץ֙ מוֹשְׁבֹ֣תֵיכֶ֔ם אֲשֶׁ֥ר אֲנִ֖י נֹתֵ֥ן לָכֶֽם׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן אֲרֵי תֵעֲלוּן לַאֲרַע מוֹתְבָנֵיכוֹן דִּי אֲנָא יָהֵב לְכוֹן:", "onk_en": "“Speak to Bnei Yisroel, and say to them, when you arrive into the land in which you will dwell, which I am giving to you.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן אֲרוּם תֵּיעָלוּן לְאַרַע מוֹתְבָנֵיכוֹן דַאֲנָא יָהֵיב לְכוֹן", "pj_en": "Speak with the sons of Israel, and say to them: When you have entered into the land of your habitation which I will give you,", "tj": "", "tj_en": "", "rashi": "‬<b>כי תבאו.<\/b> בִּשֵּׂר לָהֶם שֶׁיִּכָּנְסוּ לָאָרֶץ:", "rashi_en": "כי תבאו WHEN YE ARE COME [INTO THE LAND] — He brought them the good tidings that they would enter the land."}, {"ch": 15, "v": 3, "aliyah": 4, "heb": "וַעֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽיהֹוָה֙ עֹלָ֣ה אוֹ־זֶ֔בַח לְפַלֵּא־נֶ֙דֶר֙ א֣וֹ בִנְדָבָ֔ה א֖וֹ בְּמֹעֲדֵיכֶ֑ם לַעֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֙חַ֙ לַֽיהֹוָ֔ה מִן־הַבָּקָ֖ר א֥וֹ מִן־הַצֹּֽאן׃", "onk": "וְתַעְבְּדוּן <b>קֻרְבָּנָא<\/b> קֳדָם יְיָ עֲלָתָא אוֹ נִכְסַת קוּדְשַׁיָּא לְאַפְרָשָׁא נִדְרָא אוֹ בִנְדַבְתָּא אוֹ בְּמוֹעֲדֵיכוֹן לְמֶעְבַּד <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ מִן תּוֹרֵי אוֹ מִן עָנָא:", "onk_en": "When you make a fire-offering [<b>sacrifice<\/b>] to Adonoy, a burnt-offering or a sacrifice, by verbalizing as a pledge or as a donation or on your festivals to provide a pleasing fragrance to [<b>to be accepted with pleasure before<\/b>] Adonoy, from cattle or from sheep.", "pj": "וְתַעַבְּדוּן עַל מַדְבְּחָא קוּרְבָּנָא קֳדָם יְיָ עֲלָתָא אוֹ נִכְסַת קוּדְשַׁיָא לְפַרְשָׁא נִדְרָא אוֹ בִּנְדִיבוּתָא אוֹ בִּזְמַן מוֹעֲדֵיכוֹן לְמֶעֱבַּד רַעֲוָותָא דְמָרֵי עַלְמָא לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ מִן תּוֹרֵי אוֹ מִן עָנָא", "pj_en": "and you may make an oblation upon the altar before the Lord, burnt offering or consecrated sacrifice for release of a vow, or by free-will offering; or at the time of your feasts you offer what is acceptable to the Lord of the world, to be received with approval before the Lord from the herd or from the flock:", "tj": "", "tj_en": "", "rashi": "<b>ועשיתם אשה.<\/b> אֵין זֶה צִוּוּי, אֶלָּא כְּשֶׁתָּבֹאוּ שָׁם וְתַעֲלֶה עַל לְבַבְכֶם לַעֲשׂוֹת אִשֶּׁה לַה':<br><br><b>לפלא נדר או בנדבה וגו'.<\/b> אוֹ שֶׁתַּעֲשׂוּ הָאִשֶּׁה בִּשְׁבִיל חוֹבַת מוֹעֲדֵיכֶם, שֶׁחִיַּבְתִּי אֶתְכֶם לַעֲשׂוֹת בַּמּוֹעֵד:<br><br><b>ריח ניחח.<\/b> נַחַת רוּחַ לְפָנַי:", "rashi_en": "ועשיתם אשה — This is not a command: when you come into the land you shall make a fire-offering — but the meaning is: When you will come there and it enters your mind to make a fire-offering unto the Lord.<br><br>לפלא נדר או בנדבה וגו׳ TO DISTINGUISH YOURSELVES BY A VOW OR A FREE-WILL OFFERING [OR ON YOUR FESTIVALS] — i.e. or that you would make the fire-offering on account of the obligatory festival sacrifice which I have obligated you to offer on a festival. ...<br><br>ריח ניחח [TO MAKE] A PLEASING ODOR — i.e. to cause satisfaction to Me."}, {"ch": 15, "v": 4, "aliyah": 4, "heb": "וְהִקְרִ֛יב הַמַּקְרִ֥יב קׇרְבָּנ֖וֹ לַֽיהֹוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּרְבִעִ֥ית הַהִ֖ין שָֽׁמֶן׃", "onk": "וִיקָרֵב דִּמְקָרֵב קֻרְבָּנֵיהּ קֳדָם יְיָ מִנְחָתָא סֻלְתָּא עַשְׂרוֹנָא דְּפִילָא בְּרַבְעוּת הִינָא מִשְׁחָא:", "onk_en": "The one bringing his offering to Adonoy shall present one tenth of flour mixed with one fourth of a <i>hin<\/i> of oil,", "pj": "וִיקָרֵיב גַבְרָא דִמְקָרֵב קוּרְבָּנֵיהּ קֳדָם יְיָ מִנְחָתָא סְמִידָא עֶשְרוֹנָא פְּתִיכָא בְּרַבְעוּת הִינָא מְשַׁח זֵיתָא", "pj_en": "let the man who offers his oblation before the Lord bring a mincha of a tenth of flour mingled with the fourth of a hina of olive oil;", "tj": "", "tj_en": "", "rashi": "<b>והקריב המקריב.<\/b> תַּקְרִיבוּ נְסָכִים וּמִנְחָה לְכָל בְּהֵמָה; הַמִּנְחָה כָּלִיל וְהַשֶּׁמֶן נִבְלָל בְּתוֹכָהּ, וְהַיַּיִן לַסְּפָלִים, כְּמוֹ שֶׁשָּׁנִינוּ בְמַסֶּכֶת סֻכָּה (דף מ\"ח):", "rashi_en": "והקריב המקריב THEN SHALL HE THAT OFFERETH [HIS OFFERING BRING A MEAL OFFERING etc.] — i.e. you shall offer a drink-offering and a meal-offering for each and every animal: the meal-offering to be entirely burnt, and the oil be mingled with it, and the wine to be put into the basins from which it was poured upon the altar (but see Tosafot on Sukkah 48a), as we have learnt in Treatise Sukkah 48a."}, {"ch": 15, "v": 5, "aliyah": 4, "heb": "וְיַ֤יִן לַנֶּ֙סֶךְ֙ רְבִיעִ֣ית הַהִ֔ין תַּעֲשֶׂ֥ה עַל־הָעֹלָ֖ה א֣וֹ לַזָּ֑בַח לַכֶּ֖בֶשׂ הָאֶחָֽד׃", "onk": "וְחַמְרָא לְנִסְכָּא רַבְעוּת הִינָא תַּעְבֵּד עַל עֲלָתָא אוֹ לְנִכְסַת קוּדְשַׁיָּא לְאִמְּרָא חָד:", "onk_en": "Along with wine, for a wine-offering, one fourth of a <i>hin,<\/i> so you shall do for a burnt-offering or a sacrifice, for the one sheep.", "pj": "וַחֲמַר עִינְבָא לְנִיסוּכָא רַבְעוּת הִינָא דְעָבַד עַל עֲלָתָא אוֹ לְנִכְסַת קוּדְשָׁא לְאִימַר חָד", "pj_en": "and wine of grapes for a libation, the fourth of a hina, to be made upon the burnt offering or hallowed sacrifice-for one lamb.", "tj": "", "tj_en": "", "rashi": "<b>לכבש האחד.<\/b> עַל כָּל הָאָמוּר לְמַעְלָה הוּא מוּסָב — עַל הַמִּנְחָה וְעַל הַשֶּׁמֶן וְעַל הַיָּיִן:", "rashi_en": "לכבש האחד FOR EACH LAMB — It (this phrase) refers to all that is mentioned above — to the meal-offering, and the oil and the wine (not only to the wine last mentioned; the prescribed measures of flour, oil, and wine are to accompany each lamb)."}, {"ch": 15, "v": 6, "aliyah": 4, "heb": "א֤וֹ לָאַ֙יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַשֶּׁ֖מֶן שְׁלִשִׁ֥ית הַהִֽין׃", "onk": "אוֹ לְדִכְרָא תַּעְבֵּד מִנְחָתָא סֻלְתָּא תְּרֵין עַשְׂרוֹנִין דְּפִילָא בִמְשַׁח תַּלְתּוּת הִינָא:", "onk_en": "If for a ram you shall make a meal-offering of two tenths, mixed with one third of a <i>hin<\/i> of oil.", "pj": "אוֹ לְדִכְרָא תַעֲבֵּיד מִנְחָתָא תְּרֵין עֶשְרוֹנִין סְמִידָא פְּתִיכָא בִּמְשַׁח זֵיתָא תַּלְתוּת הִינָא", "pj_en": "Or for a ram, let him perform a mincha of two tenths of flour mingled with the third of a hin of olive oil,", "tj": "", "tj_en": "", "rashi": "<b>או לאיל.<\/b> וְאִם אַיִל הוּא; וְרַבּוֹתֵינוּ דָרְשׁוּ \"אוֹ\" — לְרַבּוֹת אֶת הַפַּלְגָּס לְנִסְכֵּי אַיִל (מנחות צ\"א):", "rashi_en": "או לאיל OR FOR A RAM [THOU SHALT PREPARE etc.] — This means: and if it be a ram [thou shalt prepare, etc.]”. Our Rabbis, however, have interpreted the word \"או,\" “or”, as being intended to bring also the פלגס (a lamb beyond the age of a כבש and below that of an איל) under the law of the drink-offerings prescribed for a ram (i.e. that the animal in its intermediate age is regarded as full grown as regards the נסכים) (Chullin 23a; Menachot 91b)."}, {"ch": 15, "v": 7, "aliyah": 4, "heb": "וְיַ֥יִן לַנֶּ֖סֶךְ שְׁלִשִׁ֣ית הַהִ֑ין תַּקְרִ֥יב רֵֽיחַ־נִיחֹ֖חַ לַיהֹוָֽה׃", "onk": "וְחַמְרָא לְנִסְכָּא תַּלְתּוּת הִינָא תְּקָרֵב <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "Wine, for a wine-offering shall be one third of a <i>hin.<\/i> This is how you shall offer a pleasing fragrance to [<b>to be accepted with pleasure before<\/b>] Adonoy.", "pj": "וַחֲמַר עִינְבָא תַּלְתוּת הִינָא תַּקְרִיב בְּסִפְלֵי לְנִיסוּכָא מְטוֹל לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "and wine of grapes let him offer in a vase for the libation, the third of a hin, to be received with acceptance before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 8, "aliyah": 5, "heb": "וְכִֽי־תַעֲשֶׂ֥ה בֶן־בָּקָ֖ר עֹלָ֣ה אוֹ־זָ֑בַח לְפַלֵּא־נֶ֥דֶר אֽוֹ־שְׁלָמִ֖ים לַֽיהֹוָֽה׃", "onk": "וַאֲרֵי תַעְבֵּד בַּר תּוֹרֵי עֲלָתָא אוֹ נִכְסַת קוּדְשַׁיָּא לְפָרָשָׁא נִדְרָא אוֹ נִכְסַת קוּדְשַׁיָּא קֳדָם יְיָ:", "onk_en": "If you are making a calf as a burnt-offering or sacrifice by verbalizing as a pledge or for a peace-offering, to Adonoy.", "pj": "וַאֲרוּם תַּעֲבֵּיד בַּר תּוֹרֵי עֲלָתָא אוֹ נִכְסְתָא לְפַרְשָׁא נִדְרָא אוֹ נִכְסַת קוּדְשַׁיָא קֳדָם יְיָ", "pj_en": "But when he maketh a bullock a burnt offering, or a sacrifice for release from a vow, or a hallowed sacrifice before the Lord,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 9, "aliyah": 5, "heb": "וְהִקְרִ֤יב עַל־בֶּן־הַבָּקָר֙ מִנְחָ֔ה סֹ֖לֶת שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֑ים בָּל֥וּל בַּשֶּׁ֖מֶן חֲצִ֥י הַהִֽין׃", "onk": "וִיקָרֵב עַל בַּר תּוֹרֵי מִנְחָתָא סֻלְתָּא תְּלָתָא עַשְׂרוֹנִין דְּפִילָא בִמְשַׁח פַּלְגוּת הִינָא:", "onk_en": "Along with the calf he shall bring a meal-offering of three tenths mixed with one half of a <i>hin<\/i> of oil.", "pj": "וִיקָרֵב עַל בַּר תּוֹרֵי מִנְחָתָא סְמִידָא תְּלָתָא עֶשְרוֹנִין פָּתִיךְ בִּמְשַׁח זֵיתָא פַּלְגוּת הִינָא", "pj_en": "let him bring for the bullock a mincha of three tenths of flour mixed with half of a hin of olive oil,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 10, "aliyah": 5, "heb": "וְיַ֛יִן תַּקְרִ֥יב לַנֶּ֖סֶךְ חֲצִ֣י הַהִ֑ין אִשֵּׁ֥ה רֵֽיחַ־נִיחֹ֖חַ לַיהֹוָֽה׃", "onk": "וְחַמְרָא תְּקָרֵב לְנִסְכָּא פַּלְגוּת הִינָא קֻרְבַּן <b>דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "You shall bring wine, for a wine-offering, one half of a <i>hin,<\/i> a fire-offering of pleasing fragrance to [<b>which will be accepted with pleasure before<\/b>] Adonoy.", "pj": "וַחֲמַר עִינְבָא לְנִיסוּכָא פַּלְגוּת הִינָא קוּרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "and wine of grapes half a hin, for a libation to be received with acceptance before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>אשה ריח.<\/b> אֵינוֹ מוּסָב אֶלָּא עַל הַמִּנְחָה וְהַשֶּׁמֶן, אֲבָל הַיַּיִן אֵינוֹ אִשֶּׁה, שֶׁאֵינוֹ נִתָּן עַל הָאֵשׁ:", "rashi_en": "אשה ריח FOR A FIRE OFFERING OF [PLEASING] ODOUR — This refers only to the meal-offering and the oil mentioned in v. 9, but the wine is not a fire-offering, since it is not put on the fire."}, {"ch": 15, "v": 11, "aliyah": 5, "heb": "כָּ֣כָה יֵעָשֶׂ֗ה לַשּׁוֹר֙ הָֽאֶחָ֔ד א֖וֹ לָאַ֣יִל הָאֶחָ֑ד אֽוֹ־לַשֶּׂ֥ה בַכְּבָשִׂ֖ים א֥וֹ בָעִזִּֽים׃", "onk": "כְּדֵין יִתְעֲבֵד לְתוֹרָא חַד אוֹ לְדִכְרָא חָד אוֹ לְאִמַּר בְּאִמְּרַיָּא אוֹ בְעִזַּיָּא:", "onk_en": "So you shall do for each ox or ram or for the sheep or goats.", "pj": "הֵיכְדֵין יִתְעַבֵּד לְתוֹרָא חָד אוֹ לְדִיכְרָא חָד אוֹ לְאִמְרֵי בַּר אִמְרֵי אוֹ בְנֵי גַדְיָא", "pj_en": "So let him do with each bullock, with each ram, and each lamb, whether it be from the lambs or the kids:", "tj": "", "tj_en": "", "rashi": "<b>או לשה וגו'.<\/b> בֵּין שֶׁהוּא בַכְּבָשִׂים בֵּין שֶׁהוּא בָעִזִּים; כֶּבֶשׂ וָשֶׂה קְרוּיִם בְּתוֹךְ שְׁנָתָם, אַיִל בֶּן שְׁלֹשָׁה עָשָׂר חֹדֶשׁ וְיוֹם אֶחָד:", "rashi_en": "או לשה גו׳ [THUS SHALL IT BE DONE FOR ONE OX …] OR FOR A YOUNG SHEEP שה בכבשים או בעזים — i.e. whether it (the שה) be of the lambs or whether it be of the goats. כֶּבֶשׂ and שֶׂה are the names given to sheep or goats within their first year., אַיִל is [the name given] from the age of thirteen months and one day (Mishnah Parah 1:3)."}, {"ch": 15, "v": 12, "aliyah": 5, "heb": "כַּמִּסְפָּ֖ר אֲשֶׁ֣ר תַּעֲשׂ֑וּ כָּ֛כָה תַּעֲשׂ֥וּ לָאֶחָ֖ד כְּמִסְפָּרָֽם׃", "onk": "כְּמִנְיָן דִּי תַעְבְּדוּן כְּדֵין תַּעְבְּדוּן לְחַד כְּמִנְיַנְהוֹן:", "onk_en": "According to the number, which you offer, so you shall make for each one according to the[ir] number[s].", "pj": "כְּחוּשְׁבַּן תּוֹרֵי וְאִמְרֵי וְגַדְיֵי דְתַעַבְּדוּן קָרְבָּנָא הֵיכְדֵין תַּעַבְּדוּן לְכָל חַד וְחַד לְפוּם סְכוּמְהוֹן", "pj_en": "according to the number of the bullocks or lambs or goats with which the oblation is made so shall you do, each according to their number.", "tj": "", "tj_en": "", "rashi": "<b>כמספר אשר תעשו.<\/b> כְּמִסְפַּר הַבְּהֵמוֹת אֲשֶׁר תַּקְרִיבוּ לְקָרְבָּן, <b>ככה תעשו<\/b> נְסָכִים לְכָל אֶחָד מֵהֶם — כְּמִסְפָּרָם שֶׁל בְּהֵמוֹת מִסְפָּרָם שֶׁל נְסָכִים:", "rashi_en": "כמספר אשר תעשו ACCORDING TO THE NUMBER THAT YE SHALL PREPARE — This means: according to the number of animals that you will offer as sacrifices, ככה תעשו SO SHALL YE OFFER drink-offerings for each of them,  כמספרם ACCORDING TO THEIR NUMBER — i.e. as is the number of animals so shall be the number of drink-offerings."}, {"ch": 15, "v": 13, "aliyah": 5, "heb": "כׇּל־הָאֶזְרָ֥ח יַעֲשֶׂה־כָּ֖כָה אֶת־אֵ֑לֶּה לְהַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ־נִיחֹ֖חַ לַֽיהֹוָֽה׃", "onk": "כָּל יַצִּיבָא יַעְבֵּד כְּדֵין יָת אִלֵּין לְקָרָבָא קֻרְבַּן <b>דְּמִתְקַבֵּל בְּרַעֲוָא קֳדָם<\/b> יְיָ:", "onk_en": "Each citizen shall do this as stated, to bring a fire-offering of pleasing fragrance to [<b>which will be accepted with pleasure before<\/b>] Adonoy.", "pj": "כָּל יַצִיבַיָא בְּיִשְרָאֵל וְלָא בְבַר עַמְמִין יַעֲבֵיד הֵיכְדֵין יַת אִלֵין נְסוּכְיָיא לְקָרָבָא קוּרְבָּנָא דְמִתְקַבֵּיל בְּרַעֲוָא קֳדָם יְיָ", "pj_en": "All who are native born in Israel, and not of the sons of the Gentiles, shall so make these libations in offering an oblation to be received with acceptance before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 14, "aliyah": 5, "heb": "וְכִֽי־יָגוּר֩ אִתְּכֶ֨ם גֵּ֜ר א֤וֹ אֲשֶׁר־בְּתֽוֹכְכֶם֙ לְדֹרֹ֣תֵיכֶ֔ם וְעָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ־נִיחֹ֖חַ לַיהֹוָ֑ה כַּאֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה׃", "onk": "וַאֲרֵי יִתְגַּיַּר עִמְּכוֹן גִּיּוֹרָא אוֹ דִי בֵינֵיכוֹן לְדָרֵיכוֹן וְיַעְבֵּד קֻרְבַּן <b>דְּמִתְקַבֵּל בַּרַעֲוָא קֳדָם<\/b> יְיָ כְּמָא דִי תַעְבְּדוּן כֵּן יַעְבֵּד:", "onk_en": "If a proselyte will live with you or among you, for all of your generations and makes a fire-offering of pleasing fragrance to [<b>which will be accepted with pleasure before<\/b>] Adonoy, in the same fashion as you make it, so shall he make it.", "pj": "וַאֲרוּם יִתְגַיֵיר עִמְכוֹן גִיוֹרָא אוֹ מַן דְהוּא כְּדוֹן בֵּינֵיכוֹן לְדָרֵיכוֹן וְיֶעֱבַד קוּרְבַּן דְמִתְקַבֵּל בְּרַעֲוָא קֳדָם יְיָ הֵיכְמָא דְתַעַבְדוּן כֵּן יַעֲבֵד", "pj_en": "And when a sojourner who sojourneth with you, or whoever is among you now, or in your generations, will bring an oblation to be received with favour before the Lord, as you do so shall he.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 15, "aliyah": 5, "heb": "הַקָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָכֶ֖ם וְלַגֵּ֣ר הַגָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְדֹרֹ֣תֵיכֶ֔ם כָּכֶ֛ם כַּגֵּ֥ר יִהְיֶ֖ה לִפְנֵ֥י יְהֹוָֽה׃", "onk": "קְהָלָא קְיָמָא חַד לְכוֹן וּלְגִיּוֹרָא דְיִתְגַּיָּר קְיַם עָלָם לְדָרֵיכוֹן כְּוָתְכוֹן כְּגִיּוֹרָא יְהֵי קֳדָם יְיָ:", "onk_en": "The assembly has one statute for yourselves and for the proselyte who resides; one statue for all of your generations, just as it is for yourselves, so shall it be for the proselyte, before Adonoy.", "pj": "קְהָלָא כּוֹלָא קְיָימָא חֲדָא לְכוֹן וּלְגִיוֹרָא דִי יִתְגַיְירוּן קְיַים עֲלָם לְדָרֵיכוֹן כְּוַתְכוֹן כְּגִיוֹרָא יְהֵי קֳדָם יְיָ", "pj_en": "For the whole congregation there is one statute, for you and the sojourner who sojourneth; it is an everlasting statute for your generations; as with you, so shall it be with the sojourner before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ככם כגר.<\/b> כְּמוֹתְכֶם כֵּן גֵּר, וְכֵן דֶּרֶךְ לְשׁוֹן עִבְרִית, \"כְּגַן ה' כְּאֶרֶץ מִצְרַיִם\" (בראשית י\"ג) — כֵּן אֶרֶץ מִצְרַיִם, \"כָּמוֹנִי כָמוֹךָ כְּעַמִּי כְעַמֶּךָ\" (מלכים א כ\"ב):", "rashi_en": "ככם כגר means, AS YOU ARE SO IS THE STRANGER (“you and the stranger shall be alike”). Thus (the use of the prefix כ with each of two things or persons stated to be exactly alike) is the Hebrew idiom to express complete similarity. Examples are: (Genesis 13:10) “As (כ) the garden of the Lord so (כ) is the land of Egypt”; (1 Kings 22:4) “As (כ) I am so (כ) art thou; as (כ) my people is so (כ) is thy people”."}, {"ch": 15, "v": 16, "aliyah": 5, "heb": "תּוֹרָ֥ה אַחַ֛ת וּמִשְׁפָּ֥ט אֶחָ֖ד יִהְיֶ֣ה לָכֶ֑ם וְלַגֵּ֖ר הַגָּ֥ר אִתְּכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אוֹרַיְתָא חֲדָא וְדִינָא חַד יְהֵי לְכוֹן וּלְגִיּוֹרָא דְּיִתְגַּיַּר עִמְּכוֹן:", "onk_en": "One law and one rule will apply to you, and to the proselyte who lives with you.”", "pj": "אוֹרַיְיתָא חֲדָא וְדִינָא חַד יְהֵי לְכוֹן וּלְגִיוֹרָא דִי יִתְגַיְירוּן עִמְכוֹן", "pj_en": "One law and one judgment shall be for you and for the sojourner who sojourneth with you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 17, "aliyah": 6, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 18, "aliyah": 6, "heb": "דַּבֵּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם בְּבֹֽאֲכֶם֙ אֶל־הָאָ֔רֶץ אֲשֶׁ֥ר אֲנִ֛י מֵבִ֥יא אֶתְכֶ֖ם שָֽׁמָּה׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן בְּמֵעַלְכוֹן לְאַרְעָא דִּי אֲנָא מָעֵל יָתְכוֹן לְתַמָּן:", "onk_en": "“Speak to Bnei Yisroel and say to them, at your coming to the land into which I am bringing you,", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן בְּמֵיעַלְכוֹן לְאַרְעָא דַאֲנָא מָעֵיל יַתְכוֹן לְתַמָן", "pj_en": "Speak with the sons of Israel, and say to them: When you have entered the land into which I will bring you,", "tj": "", "tj_en": "", "rashi": "<b>בבאכם אל הארץ.<\/b> מְשֻׁנָּה בִּיאָה זוֹ מִכָּל בִּיאוֹת שֶׁבַּתּוֹרָה, שֶׁבְּכֻלָּן נֶאֱמַר כִּי תָבֹא, כִּי תָבֹאוּ, לְפִיכָךְ כֻּלָּן לְמֵדוֹת זוֹ מִזּוֹ, וְכֵיוָן שֶׁפֵּרֵט לְךָ הַכָּתוּב בְּאַחַת מֵהֶן שֶׁאֵינָהּ אֶלָּא לְאַחַר יְרֻשָּׁה וִישִׁיבָה, אַף כֻּלָּן כֵּן, אֲבָל זוֹ נֶאֱמַר בָּהּ \"בְּבֹאֲכֶם\" — מִשֶּׁנִּכְנְסוּ בָהּ וְאָכְלוּ מִלַּחְמָהּ נִתְחַיְּבוּ בְחַלָּה (ספרי):", "rashi_en": "בבאכם אל הארץ WHEN YE COME (more lit., on your coming) INTO THE LAND — This statement about their “entering” into the land is expressed differently from all other statements about their “entering” made in the Torah, for in all other cases it is said, “When you come”, or “when ye come”, — and consequently in all these latter cases each may learn some particular from the other by way of a ג”ש. Therefore, since Scripture distinctly states in one instance of these (Deuteronomy 26:1) that the law there enjoined is applicable only after the full possession (ירושה) of, and definite settlement (ישיבה) in it, (“When thou comest to the land … and thou dost possess it (וירשת) and thou dwellest (וישבת) therein”, then thou shalt take of the first of all thy fruits etc.), all other cases where the phrase כי תבא or כי תבאו introduce a law are similar (i.e. the laws laid down in such instances were also to come in force only after ירושה and ישיבה). — In this case, however, it is stated בבאכם “on your coming”, implying that as soon as they had entered it (the Land) and ate of its bread they became subject to the law about “Challah” (Sifrei Bamidbar 110:1)."}, {"ch": 15, "v": 19, "aliyah": 6, "heb": "וְהָיָ֕ה בַּאֲכׇלְכֶ֖ם מִלֶּ֣חֶם הָאָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַיהֹוָֽה׃", "onk": "וִיהֵי בְּמֵיכַלְכוֹן מִלַּחְמָא דְאַרְעָא תַּפְרְשׁוּן <b>אַפְרָשׁוּתָא<\/b> קֳדָם יְיָ:", "onk_en": "When you eat from the bread of the land you shall separate a <i>terumah<\/i> for [<b>a separation before<\/b>] Adonoy.", "pj": "וִיהֵי בְּמֵיכְלְכוֹן מִלַחְמָא דְעַלַלְתָּא דְאַרְעָא וְלָא מִן אוֹרִיזָא וְדוֹחִינָא וְקִיטְנֵי תִּפְרְשׁוּן אַפְרָשׁוּתָא קֳדָם יְיָ", "pj_en": "and you eat the bread of the produce of it, (not rice, nor millet, nor pulse,)", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 20, "aliyah": 6, "heb": "רֵאשִׁית֙ עֲרִסֹ֣תֵכֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּתְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽהּ׃", "onk": "רֵישׁ אַצְוַתְכוֹן חַלְּתָא תַּפְרְשׁוּן אַפְרָשׁוּתָא כְּמָא דִי מַפְרְשִׁין מִן אִדְרָא כֵּן תַּפְרְשׁוּן יָתַהּ:", "onk_en": "[From] the first portion of your doughs you shall separate a loaf as a separated portion; like the <i>terumah<\/i>-gift of the granary, so shall you separate it.", "pj": "שֵׁירוּי אַצְוַותְכוֹן חַלְתָא חַד מִן עֶשְרִין וְאַרְבָּעָה תִּפְרְשׁוּן אַפְרָשׁוּתָא לְכַהֲנָא כְּמָא דִמְפָרְשִׁין מִן אִדְרָא הֵיכְדֵין תִּפְרְשׁוּן יָתָהּ", "pj_en": "you shall set apart a separation before the Lord. Of the first of your dough one cake of twenty-four you shall set apart as a separation for the priest; as with the separation from the threshing floor, so shall you set it apart.", "tj": "", "tj_en": "", "rashi": "<b>ראשית ערסתכם.<\/b> כְּשֶׁתָּלוּשׁוּ כְדֵי עִסַּתְכֶם שֶׁאַתֶּם רְגִילִין לָלוּשׁ בַּמִּדְבָּר — וְכַמָּה הִיא? \"וַיָּמֹדּוּ בָעֹמֶר\" (שמות ט\"ז), \"עֹמֶר לַגֻּלְגֹּלֶת\" (שם) — תָּרִימוּ מֵרֵאשִׁיתָהּ, כְּלוֹמַר קֹדֶם שֶׁתֹּאכְלוּ מִמֶּנָּה, רֵאשִׁית חֶלְקָהּ <b>חלה<\/b> אַחַת <b>תרימו תרומה<\/b> לְשֵׁם ה' (עירובין פ\"ג):<br><br><b>חלה.<\/b> טורטי\"ל בְּלַעַז:<br><br><b>כתרומת גרן.<\/b> שֶׁלֹּא נֶאֱמַר בָּהּ שִׁעוּר וְלֹא כִתְרוּמַת מַעֲשֵׂר, שֶׁנֶּאֱמַר בָּהּ שִׁעוּר (ספרי), אֲבָל חֲכָמִים נָתְנוּ שִׁעוּר — לְבַעַל הַבַּיִת אֶחָד מֵעֶשְׂרִים וְאַרְבָּעָה וּלְנַחְתּוֹם אֶחָד מֵאַרְבָּעִים וּשְׁמוֹנָה (חלה ב'):", "rashi_en": "ראשית ערסתכם OF THE FIRST OF YOUR DOUGH [YE SHALL HEAVE A CAKE] — This means: when you knead as much as is now your dough (ערסתכם), i.e. the quantity which you are accustomed to knead in the wilderness — and how much is this? You may learn it from the statements (Exodus 16:18) “And they measured with the Omer” and (Exodus 16:16) “An Omer a head”, — you shall set apart at its very beginning (ראשית), meaning, before you eat from it its first portion, one cake (חלה) shall you set apart, as a heave-offering in honour of the Lord (תרימו תרומה לה׳) (Eruvin 83a).<br><br>חלה is tourteau in O. F., (Engl = cake). <br><br>כתרומת גרן EVEN AS THE HEAVE OFFERING OF THE THRESHING FLOOR for which no minimum quantity is stated in the Torah, so shall ye heave it, and not as the “Heave-offering of the Tithe (תרומת מעשר, the priest’s share in the Levite’s tithe) for which a minimum quantity is stated (cf. Numbers 18:26) (Sifrei Bamidbar 110:1). — The Sages, however have stipulated a minimum quantity for it (the portion set aside) —  for a private person (lit., the owner of a house) one twenty-fourth, and for the baker one forty-eighth of the dough (Sifrei Bamidbar 110:1; Mishnah Challah 2:7)."}, {"ch": 15, "v": 21, "aliyah": 6, "heb": "מֵרֵאשִׁית֙ עֲרִסֹ֣תֵיכֶ֔ם תִּתְּנ֥וּ לַיהֹוָ֖ה תְּרוּמָ֑ה לְדֹרֹ֖תֵיכֶֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "מֵרֵישׁ אַצְוַתְכוֹן תִּתְּנוּן <b>קֳדָם<\/b> יְיָ אַפְרָשׁוּתָא לְדָרֵיכוֹן:", "onk_en": "Of the first portion of your doughs you shall give to [<b>before<\/b>] Adonoy as a <i>terumah<\/i>- offering, throughout your generations.”", "pj": "מִן שֵׁירוּי אַצְוַותְכוֹן תִּתְּנוּן אַפְרָשׁוּתָא קֳדָם יְיָ לְדָרֵיכוֹן", "pj_en": "Of the first of your dough you shall give a separation before the Lord in your generations.", "tj": "מִן שֵׁירוּי אַצְוַתְכוֹן תִּתְּנוּן לִשְׁמָא דַיְיָ אַפְרָשׁוּ:", "tj_en": "Of the first of your dough you shall give a separation unto the Name of the Lord.", "rashi": "<b>מראשית ערסתיכם.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר \"רֵאשִׁית עֲרִסֹתֵכֶם\", שׁוֹמֵעַ אֲנִי רִאשׁוֹנָה שֶׁבָּעִסּוֹת, תַּ\"ל <b>מראשית<\/b> — מִקְצָתָהּ וְלֹא כֻלָּהּ (ספרי):<br><br><b>תתנו לה' תרומה.<\/b> לְפִי שֶׁלֹּא שָׁמַעְנוּ שִׁעוּר לְחַלָּה נֶאֱמַר \"תִּתְּנוּ\" — שֶׁיְּהֵא בָהּ כְּדֵי נְתִינָה (שם):", "rashi_en": "מראשית ערסתיכם OF THE FIRST OF YOUR DOUGH [YE SHALL GIVE UNTO THE LORD A HEAVE OFFERING] — Why is this stated at all? (What does it add to the command in v. 20)? Because it states there ראשית ערסתכם, I might understand this to mean that only the first amongst several doughs which you are kneading at the same time shall you set aside entirely as a heave-offering and all the other doughs are exempt! It therefore states here מראשית “of (some of) the first of the dough”, implying part of it but not all of it (not an entire dough) (Sifrei Bamidbar 110:2).<br><br>תתנו לה׳ תרומה YE SHALL GIVE UNTO THE LORD A HEAVE OFFERING — Because we have not heard any mention of a definite minimum quantity for the Challah it is stated here “ye shall give”, implying that it shall contain sufficient to constitute a “gift” (Sifrei Bamidbar 110:2)."}, {"ch": 15, "v": 22, "aliyah": 6, "heb": "וְכִ֣י תִשְׁגּ֔וּ וְלֹ֣א תַעֲשׂ֔וּ אֵ֥ת כׇּל־הַמִּצְוֺ֖ת הָאֵ֑לֶּה אֲשֶׁר־דִּבֶּ֥ר יְהֹוָ֖ה אֶל־מֹשֶֽׁה׃", "onk": "וַאֲרֵי תִשְׁתְּלוּן וְלָא תַעְבְּדוּן יָת כָּל פִּקּוֹדַיָּא הָאִלֵּין דִּי מַלִּיל יְיָ עִם משֶׁה:", "onk_en": "If you should err, and not fulfill all of these commandments which Adonoy said to Moshe;", "pj": "וַאֲרוּם תִּשְׁתְּלוּן וְלָא תַעַבְדוּן חֲדָא מִכָּל פִּקוּדַיָא הָאִלֵין דְמַלֵיל יְיָ עִם משֶׁה", "pj_en": "And should you have erred, and not performed some one of all these commandments which the Lord hath spoken with Mosheh;", "tj": "", "tj_en": "", "rashi": "<b>וכי תשגו ולא תעשו.<\/b> עֲ\"זָ הָיְתָה בִּכְלַל <b>כל המצוות<\/b> שֶׁהַצִּבּוּר מְבִיאִין עָלֵיהָ פַר, וַהֲרֵי הַכָּתוּב מוֹצִיאָהּ כָּאן מִכְּלָלָן, לִדּוֹן בְּפַר לְעוֹלָה וְשָׂעִיר לְחַטָּאת (ספרי):<br><br><b>וכי תשגו וגו'.<\/b> בַּעֲ\"זָ הַכָּתוּב מְדַבֵּר, אוֹ אֵינוֹ אֶלָּא בְאַחַת מִכָּל הַמִּצְוֹת, תַּ\"ל <b>את כל המצות האלה<\/b> — מִצְוָה אַחַת שֶׁהִיא כְּכָל הַמִּצְוֹת, מַה הָעוֹבֵר עַל כָּל הַמִּצְוֹת פּוֹרֵק עֹל וּמֵפֵר בְּרִית וּמְגַלֶּה פָנִים, אַף מִצְוָה זוֹ פּוֹרֵק בָּהּ עֹל וּמֵפֵר בְּרִית וּמְגַלֶּה פָנִים, וְאֵיזוֹ? זוֹ עֲ\"זָ (שם):<br><br><b>אשר דבר ה' אל משה.<\/b> אָנֹכִי וְלֹא יִהְיֶה לְךָ מִפִּי הַגְּבוּרָה שְׁמַעְנוּם כְּדִכְתִיב (תהילים ס\"ב) \"אַחַת דִּבֶּר אֱלֹהִים שְׁתַּיִם זוּ שָׁמָעְנוּ\" (הוריות ח'):", "rashi_en": "וכי תשגו ולא תעשו AND IF YE HAVE ERRED, AND NOT DONE [ALL THESE COMMANDMENTS WHICH THE LORD HATH SPOKEN UNTO MOSES] — Idolatry (which is the transgression referred to here; cf. Rashi on next passage) is naturally comprehended under the general term “all the commandments” (see Leviticus 4:13) for which the whole community brings a bullock as a sin-offering if it infringes one of them, but, you see, Scripture here excepts it (the sin of idolatry) from the general law about them, to bring it under the law of a bullock as a burnt-offering, and a he-goat for a sin-offering (whilst the rule in Leviticus 4:13 is a bullock for sin-offering, and no he-goat is prescribed) (Sifrei Bamidbar 111:1).<br><br>וכי תשגו וגו׳ AND IF YE HAVE ERRED etc. — Scripture is speaking of the sin of idolatry. Or perhaps not, but of the transgression of any of all the commandments? It, however, states, “[And if ye have erred, and not done] all these commandments” which implies “one command that is the same as (the equivalent of) all the commands”. What is the case of one who transgresses all the commandments? He throws off the yoke of the Law, breaks the covenant and bids defiance to the Torah (more lit., exposes his face, acts bare-facedly). So, too, must this single commandment referred to here be of such a nature that by transgressing it one throws off the yoke, breaks the covenant and bids defiance to the Torah. And which is this? It is idolatry (Sifrei Bamidbar 111:1). <br><br>אשר דבר ה’ אל משה WHICH THE LORD HATH SPOKEN UNTO MOSES — [This refers to the two commandments prohibiting idolatry:] “I am the Lord, thy God”, and “Thou shalt have no other gods, etc.”, which we heard from the mouth of the Almighty (and which God also commanded us by Moses (v. 23) in many other passages where idolatry is forbidden), as it is written (Psalms 62:12): “Once did God speak these commandments to us but we heard them twice” (cf. Sifrei Bamidbar 111:1; Horayot 8a)."}, {"ch": 15, "v": 23, "aliyah": 6, "heb": "אֵת֩ כׇּל־אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֲלֵיכֶ֖ם בְּיַד־מֹשֶׁ֑ה מִן־הַיּ֞וֹם אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה וָהָ֖לְאָה לְדֹרֹתֵיכֶֽם׃", "onk": "יָת כָּל דִּי פַקִּיד יְיָ יָתְכוֹן בִּידָא דְמשֶׁה מִן יוֹמָא דִּי פַקִּיד יְיָ וּלְהַלָּא לְדָרֵיכוֹן:", "onk_en": "All that Adonoy commanded you through Moshe, from the day on which Adonoy commanded, and from then on, throughout your generations.", "pj": "יַת כָּל מַה דְפַקֵיד יְיָ לְוַתְכוֹן בִּידָא דְמשֶׁה מִן יוֹמָא דְפַקֵיד יְיָ וּלְהָלָא לְדָרֵיכוֹן", "pj_en": "whatsoever the Lord hath commanded you by Mosheh from the day He commanded it, and thenceforth unto your generations -", "tj": "", "tj_en": "", "rashi": "<b>את כל אשר צוה וגו'.<\/b> מַגִּיד שֶׁכָּל הַמּוֹדֶה בַּעֲ\"זָ כְּכוֹפֵר בְּכָל הַתּוֹרָה כֻּלָּהּ וּבְכָל מַה שֶּׁנִּתְנַבְּאוּ הַנְּבִיאִים, שֶׁנֶּאֱמַר <b>מן היום אשר צוה ה' והלאה<\/b>:", "rashi_en": "את כל אשר צוה וגו׳ EVEN ALL THAT [THE LORD] HATH COMMANDED [YOU] etc. — This tells us that he who acknowledges the divinity of an idol is like one who denies the Torah in its entirety and all that the prophets prophesied, because it states, “[and if yo have erred and not done … all that the Lord hath commanded by Moses] from the day that the Lord commanded (Moses), and hence forth [throughout all your generations]” (cf. Sifrei Bamidbar 111:1)."}, {"ch": 15, "v": 24, "aliyah": 6, "heb": "וְהָיָ֗ה אִ֣ם מֵעֵינֵ֣י הָעֵדָה֮ נֶעֶשְׂתָ֣ה לִשְׁגָגָה֒ וְעָשׂ֣וּ כׇל־הָעֵדָ֡ה פַּ֣ר בֶּן־בָּקָר֩ אֶחָ֨ד לְעֹלָ֜ה לְרֵ֤יחַ נִיחֹ֙חַ֙ לַֽיהֹוָ֔ה וּמִנְחָת֥וֹ וְנִסְכּ֖וֹ כַּמִּשְׁפָּ֑ט וּשְׂעִיר־עִזִּ֥ים אֶחָ֖ד לְחַטָּֽת׃", "onk": "וִיהֵי אִם מֵעֵינֵי כְנִשְׁתָּא אִתְעֲבֵדַת לְשָׁלוּ וְיַעְבְּדוּן כָּל כְּנִשְׁתָּא תּוֹר בַּר תּוֹרֵי חַד לַעֲלָתָא <b>לְאִתְקַבָּלָא בְרַעֲוָא קֳדָם<\/b> יְיָ וּמִנְחָתֵיהּ וְנִסְכֵּיהּ כִּדְחָזֵי וּצְפִיר בַּר עִזֵּי חַד לְחַטָּאתָא:", "onk_en": "If it was obscured from the eyes of the congregation, having been done in error, then the entire congregation shall offer one young bullock as a burnt-offering for a pleasing fragrance to [<b>to be accepted with pleasure before<\/b>] Adonoy. Its meal-offering and its wine-offering are according to its law, and one he-goat, as a sin-offering.", "pj": "וִיהֵי אִין מִן מֶחְמֵי כְנִשְׁתָּא אִיתְעֲבִידַת סוּרְחָנוּתָא בְּשָׁלוּ וְיַעַבְדוּן כָּל כְּנִשְׁתָּא תּוֹר בַּר תּוֹרֵי חַד לְעָלָתָא לְאִתְקַבָּלָא בְּרַעֲוָא קֳדָם יְיָ וּמִנְחָתֵיהּ וְנִיסוּכֵיהּ כַּד חָמֵי וּצְפִיר בַּר עִזִין דְלָא עֵירוּבִין חַד לְחַטָאתָא", "pj_en": "if without the knowledge of the congregation sin hath been committed through ignorance, let all the congregation make one young bullock a burnt offering to be received with acceptance before the Lord, with his mincha and libation. as are proper; and one kid of the goats without mixture for a sin offering;", "tj": "", "tj_en": "", "rashi": "<b>אם מעיני העדה נעשתה לשגגה.<\/b> אִם מֵעֵינֵי הָעֵדָה נֶעֶשְׂתָה עֲבֵרָה זוֹ עַל יְדֵי שׁוֹגֵג — שֶׁשָּׁגוּ וְהוֹרוּ עַל אַחַת מִן הָעֲבוֹדוֹת שֶׁהִיא מֻתֶּרֶת לַעֲבֹד עֲ\"זָ בְּכָךְ (שם ה'):<br><br><b>לחטת.<\/b> חָסֵר א', שֶׁאֵינוֹ כִשְׁאָר חַטָּאוֹת, שֶׁכָּל חַטָּאוֹת שֶׁבַּתּוֹרָה הַבָּאוֹת עִם עוֹלָה הַחַטָּאת קוֹדֶמֶת לָעוֹלָה, שֶׁנֶּא' (ויקרא ה'), \"וְאֶת הַשֵּׁנִי יַעֲשֶׂה עֹלָה\", וְזוֹ עוֹלָה קוֹדֶמֶת לְחַטָּאת (שם ט\"ו):", "rashi_en": "ואם מעיני העדה נעשתה בשגגה — This means: If it is by the eyes (the leaders) of the community that this sin has been committed in error, i.e., that they have mistakenly taught of a certain one of the rites associated with the worship of God that it is permissible to worship an idol in that manner, [then it shall be that all the congregation shall offer, etc.] (cf. Horayot 5b).<br><br>לחטת — This lacks the א usually found in it, to indicate that it is not like other חטאות, sin-offerings; for in the case of all sin offerings mentioned in the Torah that are to be brought together with a burnt offering, the sin-offering precedes the burnt offering (i.e. is offered first), since it is said, (Leviticus 5:10) “And the second animal shall he make as a burnt offering,” whilst in this case the burnt offering precedes the sin-offering (Horayot 13a)."}, {"ch": 15, "v": 25, "aliyah": 6, "heb": "וְכִפֶּ֣ר הַכֹּהֵ֗ן עַֽל־כׇּל־עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְנִסְלַ֣ח לָהֶ֑ם כִּֽי־שְׁגָגָ֣ה הִ֔וא וְהֵם֩ הֵבִ֨יאוּ אֶת־קׇרְבָּנָ֜ם אִשֶּׁ֣ה לַֽיהֹוָ֗ה וְחַטָּאתָ֛ם לִפְנֵ֥י יְהֹוָ֖ה עַל־שִׁגְגָתָֽם׃", "onk": "וִיכַפַּר כַּהֲנָא עַל כָּל כְּנִשְׁתָּא דִּבְנֵי יִשְׂרָאֵל וְיִשְׁתְּבֵק לְהוֹן אֲרֵי שָׁלוּתָא הִיא וְאִנּוּן אַיְתִיאוּ יָת קֻרְבַּנְהוֹן קֻרְבָּנָא קֳדָם יְיָ וְחוֹבַתְהוֹן קֳדָם יְיָ עַל שָׁלוּתְהוֹן:", "onk_en": "The <i>kohein<\/i> shall atone on behalf of the entire congregation of Bnei Yisroel, and they shall be forgiven; for they have erred unwittingly and they have brought their offering, as a fire-offering to Adonoy, and their sin-offering before Adonoy (to atone) for their error.", "pj": "וִיכַפֵּר כַּהֲנָא עַל כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל וְיִשְׁתְּרֵי לְהוֹן אֲרוּם שְׁלוּתָא הִיא וְהִינוּן הַיְיתִיאוּ יַת קוּרְבָּנֵיהוֹן קָרְבָּנָא קֳדָם יְיָ וְקָרְבַּן סוּרְחָנוּתְהוֹן קְרִיבוּ קֳדָם יְיָ עַל שְׁלוּתְהוֹן", "pj_en": "and let the priest make atonement for all the congregation of the sons of Israel, and it shall be forgiven them; for it was an error, and they have brought their oblation, an offering before the Lord, even an offering for their sin have they presented before the Lord for their error;", "tj": "", "tj_en": "", "rashi": "<b>הביאו את קרבנם אשה לה'.<\/b> זֶה הָאָמוּר בַּפָּרָשָׁה, הוּא פַר הָעוֹלָה שֶׁנֶּאֱמַר \"אִשֶּׁה לַה'\" (ספרי):<br><br><b>וחטאתם.<\/b> זֶה הַשָּׂעִיר:", "rashi_en": "הביאו את קרבנם אשה לה׳ [AND] THEY HAVE BROUGHT THEIR OFFERING, A FIRE OFFERING UNTO THE LORD — This is that offering mentioned previously in this chapter (v. 24), viz., the bullock for a burnt offering, since it says here, “a fire offering to the Lord” (which is a description of a burnt offering) (Sifrei Bamidbar 111:3).<br><br>וחטאתם AND THEIR SIN OFFERING — This is the he-goat (mentioned in v. 24)."}, {"ch": 15, "v": 26, "aliyah": 6, "heb": "וְנִסְלַ֗ח לְכׇל־עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְלַגֵּ֖ר הַגָּ֣ר בְּתוֹכָ֑ם כִּ֥י לְכׇל־הָעָ֖ם בִּשְׁגָגָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיִשְׁתְּבֵק לְכָל כְּנִשְׁתָּא דִּבְנֵי יִשְׂרָאֵל וּלְגִיּוֹרָא דְּיִתְגַּיַּר בֵּינֵיהוֹן אֲרֵי לְכָל עַמָּא בְּשָׁלוּתָא:", "onk_en": "And it shall be forgiven to the entire congregation of Bnei Yisroel and the stranger amongst them; for the entire people sinned unintentionally.", "pj": "וְיִשְׁתְּרֵי מִן קֳדָם יְיָ לְכָל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל וּלְגִיוֹרַיָא דְמִתְגַיְירִין בֵּינֵיהוֹן אֲרוּם לְעַמָא אִירַע בְּשָׁלוּתָא", "pj_en": "and all the congregation of Israel shall be forgiven before the Lord, and the sojourners who sojourn among them; for an error hath occurred to the people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 27, "aliyah": 7, "heb": "וְאִם־נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִשְׁגָגָ֑ה וְהִקְרִ֛יבָה עֵ֥ז בַּת־שְׁנָתָ֖הּ לְחַטָּֽאת׃", "onk": "וְאִם אֱנַשׁ חַד יֵחוֹב בְּשָׁלוּ וִיקָרֵב עִזָּא בַּת שַׁתַּהּ לְחַטָּאתָא:", "onk_en": "If one person will sin erroneously, that person shall bring a yearling she-goat as a sin-offering.", "pj": "וְאִין בַּר נְשָׁא חַד יֵיחוֹב בְּשָׁלוּ וְיִקְרַב גַדְיָיתָא בַּר שַׁתָּא דְלָא עֵירוּבִין לְחַטָאתָא", "pj_en": "And if any one man sin through ignorance, let him bring one goat of the year without mixture for a sin offering,", "tj": "", "tj_en": "", "rashi": "<b>תחטא בשגגה.<\/b> בַּעֲ\"זָ:<br><br><b>עז בת שנתה.<\/b> שְׁאָר עֲבֵרוֹת יָחִיד מֵבִיא כִשְׂבָּה אוֹ שְׂעִירָה, וּבְזוֹ קָבַע לָהּ שְׂעִירָה (שם):", "rashi_en": "תחטא בשגגה [AND IF ANY SOUL (i.e. any individual)] SIN THROUGH ERROR, by committing idolatry,<br><br>עז בת שנתה [HE SHALL BRING] A SHE GOAT OF ONE YEAR [FOR A SIN OFFERING] — For other sins committed in error an individual may bring either a she-lamb or a she-goat as a sin-offering, whilst in the case of this (the sin of idolatry) Scripture has appointed a she-goat for it (Sifrei Bamidbar 112:1)."}, {"ch": 15, "v": 28, "aliyah": 7, "heb": "וְכִפֶּ֣ר הַכֹּהֵ֗ן עַל־הַנֶּ֧פֶשׁ הַשֹּׁגֶ֛גֶת בְּחֶטְאָ֥הֿ בִשְׁגָגָ֖ה לִפְנֵ֣י יְהֹוָ֑ה לְכַפֵּ֥ר עָלָ֖יו וְנִסְלַ֥ח לֽוֹ׃", "onk": "וִיכַפַּר כַּהֲנָא עַל אֱנַשׁ דְּאִשְׁתְּלִי בְּמֵחֲבֵיהּ בְּשָׁלוּ קֳדָם יְיָ לְכַפָּרָא עֲלוֹהִי וְיִשְׁתְּבֵק לֵיהּ:", "onk_en": "The <i>kohein<\/i> shall atone for that erring soul which has sinned unwittingly before Adonoy; to achieve atonement for him, and he will be forgiven.", "pj": "וִיכַפֵּר כַּהֲנָא עַל בַּר נְשָׁא דְאִשְׁתְּלֵי כַּד סָרַח בְּשָׁלוּ קֳדָם יְיָ לְכַפָּרָא עֲלוֹי וְיִשְׁתְּרֵי לֵיהּ", "pj_en": "and let the priest make atonement for the man who hath erred in sinning through ignorance before the Lord to atone for him, that it may be forgiven him;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 29, "aliyah": 7, "heb": "הָֽאֶזְרָח֙ בִּבְנֵ֣י יִשְׂרָאֵ֔ל וְלַגֵּ֖ר הַגָּ֣ר בְּתוֹכָ֑ם תּוֹרָ֤ה אַחַת֙ יִהְיֶ֣ה לָכֶ֔ם לָעֹשֶׂ֖ה בִּשְׁגָגָֽה׃", "onk": "יַצִּיבָא בִּבְנֵי יִשְׂרָאֵל וּלְגִיּוֹרָא דְּיִתְגַּיַּר בֵּינֵיהוֹן אוֹרַיְתָא חֲדָא יְהֵי לְכוֹן לִדְיַעְבֵּד בְּשָׁלוּ", "onk_en": "[For] the citizen among Bnei Yisroel, and the proselyte who dwells among them there shall be one law for you all, for he who sins unwittingly.", "pj": "יַצִיבָא בִּבְנֵי יִשְרָאֵל וּלְגִיוֹרֵי דְמִתְגַיְירִין בֵּינֵיכוֹן (א\"ה צ\"ל בֵּינֵיהוֹן) אוֹרַיְיתָא חֲדָא יְהֵי לְכוֹן וּלְמַאן דְיֶעֱבַד בְּשָׁלוּ", "pj_en": "as well for the native-born of the children of Israel, and for the strangers who sojourn among you, there shall be one law for him who transgresseth through ignorance:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 30, "aliyah": 7, "heb": "וְהַנֶּ֜פֶשׁ אֲשֶֽׁר־תַּעֲשֶׂ֣ה&thinsp;<b>׀<\/b> בְּיָ֣ד רָמָ֗ה מִן־הָֽאֶזְרָח֙ וּמִן־הַגֵּ֔ר אֶת־יְהֹוָ֖ה ה֣וּא מְגַדֵּ֑ף וְנִכְרְתָ֛ה הַנֶּ֥פֶשׁ הַהִ֖וא מִקֶּ֥רֶב עַמָּֽהּ׃", "onk": "וֶאֱנַשׁ דְּיַעְבֵּד <b>בְּרֵישׁ גְּלִי<\/b> מִן יַצִּיבַיָּא וּמִן גִּיּוֹרַיָּא קֳדָם יְיָ הוּא <b>מַרְגֵּז<\/b> וְיִשְׁתֵּצֵי אֲנָשָׁא הַהִיא מִגּוֹ עַמֵּיהּ:", "onk_en": "A person who commits a sin high-handedly [<b>publicly<\/b>] among the citizens or among the proselytes, blasphemes [<b>provokes before<\/b>] Adonoy; the soul of that person shall be cut off from among its people.", "pj": "וּבַר נַשׁ דְיֶעֱבַד בִּזְדָנָא מִן יַצִיבַיָא אוֹ מִן גִיוֹרַיָא וְלָא תָאִיב מִן סוּרְחָנוּתֵיהּ קֳדָם יְיָ הֲוָה מַרְגִיז וְיִשְׁתֵּיצֵי בַּר נְשָׁא הַהוּא מִגוֹ עַמֵיהּ", "pj_en": "but a man who transgresseth. with presumption, whether of the native-born or strangers, and who turneth. not away from his sin before the Lord, - he causeth anger, and that man shall perish from among his people;", "tj": "", "tj_en": "", "rashi": "<b>ביד רמה.<\/b> בְמֵזִיד:<br><br><b>מגדף.<\/b> מְחָרֵף, כְּמוֹ \"וְהָיְתָה חֶרְפָּה וּגְדוּפָה\" (יחזקאל ה'), \"אֲשֶׁר גִּדְּפוּ נַעֲרֵי מֶלֶךְ אַשּׁוּר\" (ישעיהו ל\"ז), וְעוֹד דָּרְשׁוּ רַבּוֹתֵינוּ מִכָּאן לַמְּבָרֵךְ אֶת הַשֵּׁם שֶׁהוּא בְכָרֵת (כריתות ז'):", "rashi_en": "ביד רמה [BUT A PERSON THAT DOETH OUGHT] WITH A HIGH HAND — i.e. with premeditation. <br><br>מגדף is synonymous with מחרף HE REVILETH, as in (Ezekiel 5:15) “it shall be a reproach (חרפה) and a reviling (גדופה) (Isaiah 37:6) “the servants of the king of Assyria have reviled (גדפו)”. Further, our Rabbis derived from here the law that he who blasphemes the name of the Lord is liable to excision (Keritot 7b)."}, {"ch": 15, "v": 31, "aliyah": 7, "heb": "כִּ֤י דְבַר־יְהֹוָה֙ בָּזָ֔ה וְאֶת־מִצְוָת֖וֹ הֵפַ֑ר הִכָּרֵ֧ת&thinsp;<small>׀<\/small>&thinsp;תִּכָּרֵ֛ת הַנֶּ֥פֶשׁ הַהִ֖וא עֲוֺנָ֥הֿ בָֽהּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲרֵי עַל מֵימְרָא דַיְיָ בְּסַר וְיָת פִּקּוֹדוֹהִי אַשְׁנֵי אִשְׁתֵּצָאָה תִשְׁתֵּצֵי אֲנָשָׁא הַהִיא חוֹבַהּ בַּהּ:", "onk_en": "For he has denigrated the word of Adonoy and he has violated His commandment; The soul of that person shall certainly be cut off; its iniquity is upon it.", "pj": "אֲרוּם עַל פִּתְגָמָא קַדְמָאָה דְפַקֵיד יְיָ בְּסִינַי בָּסַר וְיַת תַּפְקִידַת מְהוּלְתָּא בָּטִיל אִישְׁתֵּיצָאָה בְּעַלְמָא הָדֵין יִשְׁתֵּיצֵי בַר נְשָׁא הַהוּא בְּעַלְמָא דְאָתֵי דְעָתִיד לְמִתַּן חוּשְׁבַּן חוֹבָתֵיהּ לְיוֹם דִינָא רַבָּא", "pj_en": "for, the primal word which the Lord commanded on Sinai he hath despised, and hath made the commandment of circumcision vain; with destruction in this world shall that man be destroyed; in the world that cometh shall he give account of his sin at the great day of judgment.", "tj": "אֲרוּם פִּתְגָמָא דַיְיָ בָּזֵי וְיַת פְּקִידוֹי אָפַס מִשְׁתֵּיצָא תִשְׁתֵּיצֵי נַפְשָׁא הַהוּא חוֹבֵיהּ תְקַבֵּיל:", "tj_en": "Because he hath despised the Word of the Lord, and broken His commandments, that soul shall perish, and shall bear his sin.", "rashi": "<b>דבר ה'.<\/b> אַזְהָרַת עֲ\"זָ מִפִּי הַגְּבוּרָה וְהַשְּׁאָר מִפִּי מֹשֶׁה (סנהדרין צ\"ט):<br><br><b>עונה בה.<\/b> בִּזְמַן שֶׁעֲוֹנָהּ בָּהּ — שֶׁלֹּא עָשָׂה תְשׁוּבָה:", "rashi_en": "דבר ה׳ [BECAUSE HE HATH SCORNED] THE WORD OF THE LORD — The prohibition of idolatry (אנכי and לא יהיה לך) the people heard from the mouth of the Lord but all the other commandments from the mouth of Moses (therefore the prohibition of idolatry is called דבר ה׳ “the utterance of the Lord”) (cf. Sifrei Bamidbar 112:2; Sanhedrin 99a).<br><br>עונה בה [THAT PERSON SHALL UTTERLY BE CUT OFF] HIS INIQUITY IS UPON HIM — only at the time when (under the circumstances that) his iniquity is upon him shall he be cut off, i.e., in the case that he has not repented (Sanhedrin 90b)."}, {"ch": 15, "v": 32, "aliyah": 7, "heb": "וַיִּהְי֥וּ בְנֵֽי־יִשְׂרָאֵ֖ל בַּמִּדְבָּ֑ר וַֽיִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּי֥וֹם הַשַּׁבָּֽת׃", "onk": "וַהֲווֹ בְנֵי יִשְׂרָאֵל בְּמַדְבְּרָא וְאַשְׁכָּחוּ גַּבְרָא כַּד מְגַבַּב אָעִין בְּיוֹמָא דְשַׁבְּתָא:", "onk_en": "Bnei Yisroel were in the desert, and they found a man gathering wood on the day of the Shabbos.", "pj": "וַהֲווֹ בְּנֵי יִשְרָאֵל שַׁרְיַין בְּמַדְבְּרָא גְזֵירַת שַׁבְּתָא אִשְׁתְּמוֹדַע לְהוֹן בְּרַם קְנָסָא דְשַׁבְּתָא לָא אִשְׁתְּמוֹדַע לְהוֹן קָם גַבְרָא מִדְבֵית יוֹסֵף אָמַר בְּמֵימְרֵיהּ אִיזִיל וְאֶתְּלוֹשׁ קִיסִין בְּיוֹמָא דְשַׁבְּתָא וְיֶחֱמוּן יָתִי סַהֲדַיָא וִיתַנוּן לְמשֶׁה וּמשֶׁה יִתְבַּע אוּלְפַן מִן קֳדָם יְיָ וְיִדוֹן יָתִי וּבְכֵן אִשְׁתְּמוֹדַע קְנָסָא לְכָל בֵּית יִשְרָאֵל וְאַשְׁכָּחוּ סַהֲדָא יַת גַבְרָא כַּד תָּלִישׁ וְעָקַר קִיסִין בְּיוֹמָא דְשַׁבְּתָא", "pj_en": "And while the sons of Israel were dwelling in the wilderness, the decree of the Sabbath was known to them, but the punishment (for the profanation) of the Sabbath was not known. And there arose a man of the house of Joseph, and said with himself: I will go and pull up wood on the Sabbath day; and witnesses saw it, and told Mosheh; and Mosheh sought instruction from the presence of the Lord, that he might teach me judgment, and make known the discipline of all the house of Israel. And the witnesses of the man who pulled up and collected wood came,", "tj": "מְגַבֵּב קִיסִין:", "tj_en": "Stealing wood.", "rashi": "<b>ויהיו … במדבר וימצאו.<\/b> בִּגְנוּתָן שֶׁל יִשְׂרָאֵל דִּבֵּר הַכָּתוּב, שֶׁלֹא שָׁמְרוּ אֶלָּא שַׁבָּת רִאשׁוֹנָה, וּבַשְּׁנִיָּה בָא זֶה וְחִלְּלָהּ (ספרי):", "rashi_en": "ויהיו ... במדבר וימצאו AND [WHEN THE CHILDREN OF ISRAEL] WERE IN THE DESERT, THEY FOUND [A MAN THAT PICKED UP WOOD ON THE SABBATH DAY] — (This must mean when they first came into the wilderness, and) Scripture is speaking here to the disparagement of the Israelites viz., that they kept the first Sabbath only, for on the second this man came and desecrated it (Sifrei Bamidbar 113)."}, {"ch": 15, "v": 33, "aliyah": 7, "heb": "וַיַּקְרִ֣יבוּ אֹת֔וֹ הַמֹּצְאִ֥ים אֹת֖וֹ מְקֹשֵׁ֣שׁ עֵצִ֑ים אֶל־מֹשֶׁה֙ וְאֶֽל־אַהֲרֹ֔ן וְאֶ֖ל כׇּל־הָעֵדָֽה׃", "onk": "וְקָרִיבוּ יָתֵיהּ דְּאַשְׁכָּחוּ יָתֵיהּ כַּד מְגַבַּב אָעִין לְוָת משֶׁה וּלְוָת אַהֲרֹן וּלְוָת כָּל כְּנִשְׁתָּא:", "onk_en": "Those who found him brought him near—he who was gathering wood—to Moshe and to Aharon, and to the entire congregation.", "pj": "וְקָרִיבוּ יָתֵיהּ בָּתַר דְאַתְרוּ בֵּיהּ וְתָּלַשׁ סַהֲדַיָא דְהַשְׁכָּחוּ יָתֵיהּ תָּלִישׁ קִיסִין לְוַת משֶׁה וּלְוַת אַהֲרן וּלְוַת כָּל כְּנִישְׁתָּא", "pj_e
