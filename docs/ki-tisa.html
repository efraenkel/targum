in]; for in the month of ripening [grain] you went out of Egypt.", "pj": "יַת חַגָא דְפַטִירַיָא תִנְטְרוּן שׁוּבְעָא יוֹמִין תֵּיכוֹל פַּטִּירֵי הֵיכְמָא דְפַקֵידְתָּךְ לִזְמַן יַרְחָא דְאַבִּיבָא אֲרוּם בְּיַרְחָא דְאַבִּיבָא נְפַקְתּוּן פְּרִיקִין מִמִּצְרָיִם", "pj_en": "You shall observe the feast of the unleavened. Seven days thou shalt eat unleavened (cakes), as I have commanded thee, in the time of the month Abiba; for in the month of Abiba you came out free from Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>חדש האביב.<\/b> חֹדֶשׁ הַבִּכּוּר, שֶׁהַתְּבוּאָה מִתְבַּכֶּרֶת בְּבִשּׁוּלָהּ:", "rashi_en": "חדש האביב THE MONTH OF ABIB — the month of early ripening — the month when the grain is in its first stage of ripening."}, {"ch": 34, "v": 19, "aliyah": 6, "heb": "כׇּל־פֶּ֥טֶר רֶ֖חֶם לִ֑י וְכׇֽל־מִקְנְךָ֙ תִּזָּכָ֔ר פֶּ֖טֶר שׁ֥וֹר וָשֶֽׂה׃", "onk": "כָּל פָּתַח וַלְדָּא דִּילִי וְכָל בְּעִירָךְ דִּכְרִין <b>תַּקְדֵּשׁ בְּכוֹר<\/b> תּוֹר וְאִימָר:", "onk_en": "All that opens the womb [the first-born] is Mine, and of all your livestock that is male [<b>you shall sanctify<\/b>], that open [the womb] [<b>the first-born<\/b>] both cattle and sheep.", "pj": "כָּל פְּתַח וַולְדָא דִילִי הוּא וְכָל בְּעִירָךְ תַּקְדִישׁ מִנְהוֹן דִּכְרַיָא דְתוֹרֵי וְאִמְרֵי", "pj_en": "Whatever openeth the womb is Mine; and of all cattle thou art to consecrate the males, of oxen, and of sheep.", "tj": "כָּל קֳדָמוֹי פַלְחֵי וַולְדָא תִּפְרְשׁוּן לִשְׁמִי כָּל פִּטְרֵיכוֹן דִּכְרַיָא קֳדָמוֹי פַּלְחֵי וַלְדָא דְתוֹרָא וּדְאִימְרָא:", "tj_en": "All firstlings opening the womb thou shalt sanctify unto My Name; all the firstborn of your males, the first that breaketh. through the womb, of oxen and of sheep.", "rashi": "<b>כל פטר רחם לי.<\/b> בָּאָדָם:<br><br><b>וכל מקנך וגו'.<\/b> וְכָל מִקְנְךָ אֲשֶׁר תִּזָּכָר בְּפֶטֶר שׁוֹר וָשֶׂה – אֲשֶׁר יִפְטֹר זָכָר אֶת רַחְמָהּ:<br><br><b>פטר.<\/b> לְשׁוֹן פְּתִיחָה, וְכֵן פּוֹטֵר מַיִם רֵאשִׁית מָדוֹן (משלי י\"ז); תי\"ו שֶׁל תִּזָּכָר לְשׁוֹן נְקֵבָה הִיא, מוּסָב עַל הַיּוֹלֶדֶת:", "rashi_en": "כל פטר רחם לי EVERY FIRST OFFSPRING OF THE WOMB IS MINE amongst human beings,<br><br>וכל מקנך וגו׳ AND also ALL THY CATTLE WHICH IT (the mother animal) BRINGS FORTH AS MALE BY AN OX OR AN ASS OPENING its womb: it means, that a male animal opens her womb.<br><br>פטר is an expression denoting “opening”; similar is (Proverbs 17:14) “As if one openeth (letteth run) (פוטר) water so is the beginning of strife”. The ת of תזכר expresses the feminine gender and refers to the animal in labour (i. e. the prefix is 3rd fem. sing., not 2nd masc. sing.: the subject to תזכר must be supplied “the mother animal”)."}, {"ch": 34, "v": 20, "aliyah": 6, "heb": "וּפֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְשֶׂ֔ה וְאִם־לֹ֥א תִפְדֶּ֖ה וַעֲרַפְתּ֑וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֙יךָ֙ תִּפְדֶּ֔ה וְלֹֽא־יֵרָא֥וּ פָנַ֖י רֵיקָֽם׃", "onk": "<b>וּבוּכְרָא<\/b> דַחֲמָרָא תִּפְרוֹק בְּאִימְרָא וְאִם לָא תִפְרוֹק וְתַנְקְפֵיהּ כָּל בּוּכְרָא דִבְנָיךְ תִּפְרוֹק וְלָא יִתְחֲזוּן קֳדָמַי רֵיקָנִין:", "onk_en": "The [<b>first-born<\/b>] donkey that opens the womb shall be redeemed with a sheep, and if it is not redeemed, you must break its neck. [You must] redeem all first-born of your sons, and you must not appear before Me empty-handed.", "pj": "וּבוּכְרָא דְחַמְרָא תִּפְרוֹק בְּאִימְרָא וְאִין לָא תִפְרוֹק וְתִנְקְפֵיהּ בְּקוּפִּיץ וְכָל בּוּכְרָא דִבְרָךְ תִּפְרוֹק וְלָא יִתְחֲמוּן קֳדָמַי רֵיקָנִין", "pj_en": "But the firstling of an ass thou mayest redeem with a lamb; but if thou redeem him not, thou shalt cut him off with the blade. And each firstborn of thy sons thou must redeem; and they shall not appear before Me empty.", "tj": "עַמִּי בֵּית יִשְרָאֵל לֵית אַתּוּן רְשָׁאִין לְמֵיחְמֵי יְיָ אֱלָהָכוֹן רֵיקָנִין מִן כָּל מִצְוָה:", "tj_en": "My people of the house of Israel, it shall not be allowed you to see the Lord your God empty of any precept.", "rashi": "<b>ופטר חמור.<\/b> וְלֹא שְׁאָר בְּהֵמָה טְמֵאָה:<br><br><b>תפדה בשה.<\/b> נוֹתֵן שֶׂה לַכֹּהֵן וְהוּא חֻלִּין בְּיַד כֹּהֵן, וּפֶטֶר חֲמוֹר מֻתָּר בַּעֲבוֹדָה לַבְּעָלִים:<br><br><b>וערפתו.<\/b> עוֹרְפוֹ בְּקוֹפִיץ; הוּא הִפְסִיד מָמוֹן כֹּהֵן, לְפִיכָךְ יֻפְסַד מָמוֹנוֹ:<br><br><b>כל בכור בניך תפדה.<\/b> חֲמִשָּׁה סְלָעִים פִּדְיוֹנוֹ קָצוּב, שֶׁנֶּאֱמַר וּפְדוּיָו מִבֶּן חֹדֶשׁ תִּפְדֶה (במדבר י\"ח):<br><br><b>ולא יראו פני רקם.<\/b> לְפִי פְּשׁוּטוֹ שֶׁל מִקְרָא דָּבָר בִּפְנֵי עַצְמוֹ הוּא, וְאֵינוֹ מוּסָב עַל הַבְּכוֹר – שֶׁאֵין בְּמִצְוַת בְּכוֹר רְאִיַּת פָּנִים – אֶלָּא אַזְהָרָה אַחֶרֶת הִיא, וּכְשֶׁתַּעֲלוּ לָרֶגֶל לֵרָאוֹת לֹא יֵרָאוּ פָנַי רֵיקָם – מִצְוָה עֲלֵיכֶם לְהָבִיא עוֹלַת רְאִיַּת פָּנִים. וּלְפִי מִדְרַשׁ בָּרַיְתָא מִקְרָא יָתֵר הוּא, וּמֻפְנֶה לִגְזֵרָה שָׁוָה, לְלַמֵּד עַל הַעֲנָקָתוֹ שֶׁל עֶבֶד עִבְרִי שֶׁהוּא חֲמִשָּׁה סְלָעִים מִכָּל מִין וָמִין, כְּפִדְיוֹן בְּכוֹר; בְּמַסֶּכֶת קִדּוּשִׁין (דף י\"ז):", "rashi_en": "ופטר חמור AND THE FIRST OFFSPRING OF AN ASS [THOU SHALT REDEEM] — but not that of any other unclean animal (Bekhorot 5b).<br><br>תפדה בשה THOU SHALT REDEEM WITH A LAMB — one gives a lamb to the priest and it remains in his possession with the character of a non-holy object (חולין — an ordinary animal). The firstborn ass is then permitted to the owner to be used for work (Bekhorot 9b).<br><br>וערפתו THEN THOU SHALT BREAK ITS NECK — one breaks its neck with a hatchet and so slays it (Bekhorot 10b). The reason is: he (the owner of the ass) has caused loss to the possessions of the priest (by not giving him the lamb) therefore must he suffer loss in his possessions (Mekhilta).<br><br>כל בכור בניך תפדה ALL THE FIRSTBORN OF THY SONS THOU SHALT REDEEM — Five Sela’im are the ransom fixed for him, as it is said (Numbers 18:16) “And those that are to be redeemed, from a month old shalt thou redeem [according to thy valuation, for the money of five shekels]”. (For the whole of this verse cf. Rashi on 13:13).<br><br>ולא יראו פני ריקם AND NONE SHALL APEAR BEFORE ME EMPTY — According to the plain sense of the verse this is an independent statement and does not refer to the firstborn just mentioned — because in connection with the command concerning the firstborn there is no duty of appearing before the Lord; but it is another (a separate) prohibition merely connected by a conjunctive ו with the former statement and means: when you go up to the festival gathering to Jerusalem to appear before the Lord, none shall appear before Me empty; it is your duty to bring the burnt offering prescribed for the appearance before My face (Chagigah 7a). According to the Halachic explanation of the Boraitha this portion of the verse is redundant (since the same commandment already appears Exodus 23:15) and is consequently “free” (מופנה) to be used for a גז\"ש (an analogy based on verbal similarity in two texts, viz., the word ריקם here and in the text Deuteronomy 15:13 לא תשלחנו ריקם “thou shalt not let him go away ריקם”) — it is repeated here after the law about the first born to teach you that the outfit given to a Hebrew slave when he leaves your service should consist of five Sela’im-worth of each of the things (mentioned Deuteronomy 15:14: thy sheep, thy threshing floor, and vinepress) just as the ransom of the firstborn is five Sela’im. Thus are we taught in Treatise Kiddushin 17a."}, {"ch": 34, "v": 21, "aliyah": 6, "heb": "שֵׁ֤שֶׁת יָמִים֙ תַּעֲבֹ֔ד וּבַיּ֥וֹם הַשְּׁבִיעִ֖י תִּשְׁבֹּ֑ת בֶּחָרִ֥ישׁ וּבַקָּצִ֖יר תִּשְׁבֹּֽת׃", "onk": "שִׁתָּא יוֹמִין תִּפְלָח וּבְיוֹמָא שְׁבִיעָאָה תְּנוּחַ <b>בִּזְרוֹעָא<\/b> וּבַחֲצָדָא תְּנוּחַ:", "onk_en": "Six days you shall work but on the Seventh day you must cease; you must cease plowing [<b>sowing<\/b>] and harvesting.", "pj": "שִׁיתָּא יוֹמִין תִּפְלָח וּבְיוֹמָא שְׁבִיעָאָה תָנוּחַ בְּרִידַיָא וּבְחַצְדָא תָּנוּחַ", "pj_en": "Six days shalt thou work, and in the seventh day have rest; in ploughing time and in harvest thou shalt rest.", "tj": "בִּירִידָא:", "tj_en": "In ploughing.", "rashi": "<b>בחריש ובקציר.<\/b> לָמָּה נִזְכָּר חָרִישׁ וְקָצִיר? יֵשׁ מֵרַבּוֹתֵינוּ אוֹמְרִים עַל חָרִישׁ שֶׁל עֶרֶב שְׁבִיעִית הַנִּכְנָס לַשְּׁבִיעִית, וְקָצִיר שֶׁל שְׁבִיעִית הַיּוֹצֵא לְמוֹצָאֵי שְׁבִיעִית, לְלַמֶּדְךָ שֶׁמּוֹסִיפִין מֵחֹל עַל הַקֹּדֶשׁ, וְכָךְ מַשְׁמָעוֹ: שֵׁשֶׁת יָמִים תַּעֲבֹד וּבַיּוֹם הַשְּׁבִיעִי תִּשְׁבֹּת, וַעֲבוֹדַת ו' הַיָּמִים שֶׁהִתַּרְתִּי לְךָ, יֵשׁ שָׁנָה שֶׁהֶחָרִישׁ וְהַקָּצִיר אָסוּר, וְאֵין צֹרֶךְ לוֹמַר חָרִישׁ וְקָצִיר שֶׁל שְׁבִיעִית, שֶׁהֲרֵי כְבָר נֶאֱמַר שָׂדְךָ לֹא תִזְרָע וְגוֹ' (ויקרא כ\"ה), וְיֵשׁ אוֹמְרִים שֶׁאֵינוֹ מְדַבֵּר אֶלָּא בַּשַּׁבָּת, וְחָרִישׁ וְקָצִיר שֶׁהֻזְכַּר בּוֹ לוֹמַר לְךָ, מֶה חָרִישׁ רְשׁוּת אַף קָצִיר רְשׁוּת, יָצָא קְצִיר הָעֹמֶר שֶׁהוּא מִצְוָה וְדוֹחֶה אֶת הַשַּׁבָּת (ראש השנה ט'):", "rashi_en": "בחריש ובקציר IN PLOUGHING TIME AND IN HARVEST [THOU SHALT LEAVE OFF] — Why are ploughing and harvesting specially mentioned (since all work is forbidden on Sabbath)? There are some of our Rabbis who say that this refers to ploughing in the year preceding the Sabbatical year which ploughing passeth into (produces its first fruits in) the seventh year and to harvesting grain that has reached one-third of its maturity during the Sabbatical year which harvesting actually goeth forth into (takes place in) the eighth year, that following the Sabbatical year; and that this statement is intended to teach you that one must add part of the secular time to the holy time (i. e. that one must apply to a certain period before the beginning and after the termination of the Sabbatical year the laws applicable to that year in order to prevent its desecration). Thus, the following is what it (this verse) means: “Six days thou mayest work, but on the seventh day thou shalt rest”; but even with regard to the six days’ work which I have permitted you there are years when ploughing and harvesting are forbidden. This must be the meaning, referring to ploughing in the sixth year and harvesting in the seventh, and it cannot refer to the seventh year itself for it is unnecessary to make any mention of ploughing and harvesting in the seventh year being forbidden, for it is already said (Leviticus 25:4) “[But in the seventh year …] thou shalt neither sow thy field [nor prune thine vineyard]”! Others, however, hold that Scripture in this part of the text, is only speaking of the ordinary Sabbath day, as in the first part, and ploughing and harvesting which are specially mentioned in it as being forbidden on the Sabbath are mentioned to suggest to you the following: What is the characteristic of ploughing? It is an optional act (no such work being commanded anywhere in the Law)! So, too, is harvesting forbidden on Sabbath only when it constitutes an optional act! There is, therefore, excluded the harvesting of the barley for the “Omer” (cf. Leviticus 23:10: ye shall reap the harvest thereof) which is obligatory and which therefore supersedes the Sabbath (occasions a suspension of the Sabbath laws) (Rosh Hashanah 9a)."}, {"ch": 34, "v": 22, "aliyah": 6, "heb": "וְחַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְחַג֙ הָֽאָסִ֔יף תְּקוּפַ֖ת הַשָּׁנָֽה׃", "onk": "וְחַגָּא דְשָׁבוּעַיָּא תַּעְבֵּד לָךְ בִּכּוּרֵי חֲצַד חִטִּין וְחַגָּא דִּכְנָשָׁא בְּמִפְקָא דְּשַׁתָּא:", "onk_en": "Make the Festival of Shavuos, [with bringing] the first crops of the wheat harvest; [also] the Festival of the Harvest at the turn of the year.", "pj": "וְחַגָא דִּשְׁבוּעַיָא תַּעֲבֵיד לָךְ בִּזְמַן בִּכּוּרֵי חֲצַד חִינְטִין וְחַגָא דִכְנָשָׁא בְּמִיפְקָא דְשַׁתָּא", "pj_en": "The feast of weeks also shalt thou make to thee in the time of the firsts of the wheat harvest; and the feast of ingathering at the conclusion of the ear.", "tj": "", "tj_en": "", "rashi": "<b>בכורי קציר חטים.<\/b> שֶׁאַתָּה מֵבִיא בוֹ שְׁתֵּי הַלֶּחֶם מִן הַחִטִּים:<br><br><b>בכורי.<\/b> שֶׁהִיא מִנְחָה רִאשׁוֹנָה הַבָּאָה מִן הֶחָדָשׁ שֶׁל חִטִּים לַמִּקְדָּשׁ, כִּי מִנְחַת הָעֹמֶר הַבָּאָה בַפֶּסַח, מִן הַשְּׂעוֹרִים הִיא (מנחות פ\"ד):<br><br><b>וחג האסיף.<\/b> בִּזְמַן שֶׁאַתָּה אוֹסֵף תְּבוּאָתְךָ מִן הַשָּׂדֶה לַבַּיִת; אֲסִיפָה זוֹ לְשׁוֹן הַכְנָסָה לַבַּיִת, כְּמוֹ וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ (דברים כ\"ב):<br><br><b>תקופת השנה.<\/b> שֶׁהִיא בַחֲזָרַת הַשָּׁנָה – בִּתְחִלַּת הַשָּׁנָה הַבָּאָה:<br><br><b>תקופת.<\/b> לְשׁוֹן מְסִבָּה וְהַקָּפָה:", "rashi_en": "בכורי קציר חטים [THE FESTIVAL] OF THE FIRST OF THE WHEAT HARVEST — It is so called because on it you offer the two loaves of wheat (Leviticus 23:17).<br><br>בכורי OF THE FIRST [OF THE WHEAT HARVEST] — It is so called because it (the offering of the two loaves) is the first meal offering which is brought in the Temple of the new wheat crop; for the meal offering of the Omer which had already been brought on Passover was of barley (Menachot 84a).<br><br>וחג האסיף AND THE FESTIVAL OF INGATHERING — the festival that falls at the time of the year when you gather in thy produce from the field into the barns. The word אסף here means bringing in (and not, collecting), as (Deuteronomy 22:2) “thou shalt gather it (ואספתו) into thine house” (cf. Rashi on Exodus 23:16 and on Genesis 49:29).<br><br>תקופת השנה lit., [THE FESTIVAL …] THE YEARS CIRCUIT — i. e. the festival at the coming round of the year — at the beginning of the coming (the new) year.<br><br>תקופת is a term denoting going round."}, {"ch": 34, "v": 23, "aliyah": 6, "heb": "שָׁלֹ֥שׁ פְּעָמִ֖ים בַּשָּׁנָ֑ה יֵרָאֶה֙ כׇּל־זְכ֣וּרְךָ֔ אֶת־פְּנֵ֛י הָֽאָדֹ֥ן&thinsp;<small>׀<\/small>&thinsp;יְהֹוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃", "onk": "תְּלַת זִמְנִין בְּשַׁתָּא יִתְחֲזוּן כָּל דְּכוּרָיךְ קֳדָם רִבּוֹן <b>עָלְמָא<\/b> יְיָ אֱלָהָא דְיִשְׂרָאֵל:", "onk_en": "Three times a year all your males shall appear before the Presence of the Master [<b>of the world<\/b>], Adonoy, God of Yisrael.", "pj": "תְּלַת זִמְנִין בְּשַׁתָּא יִתְחַמְיוּן כָּל דְּכוּרָךְ קֳדָם רִבּוֹן עָלְמַיָא יְיָ אֱלָהָא דְיִשְרָאֵל", "pj_en": "Three times in the year shall all thy males appear before the Master of the world, the Lord God of Israel.", "tj": "", "tj_en": "", "rashi": "<b>כל זכורך.<\/b> כָּל הַזְּכָרִים שֶׁבְּךָ; הַרְבֵּה מִצְוֹת בַּתּוֹרָה נֶאֶמְרוּ וְנִכְפְּלוּ – וְיֵשׁ מֵהֶם שָׁלֹשׁ פְּעָמִים וְאַרְבַּע – לְחַיֵּב וְלַעֲנֹשׁ עַל מִנְיַן לָאוִין שֶׁבָּהֶם וְעַל מִנְיַן עֲשֵׂה שֶׁבָּהֶם:", "rashi_en": "כל זכורך means all the males among you (cf. Rashi on Exodus 23:17 and the note thereon). — Many precepts of the Torah are stated and then repeated, aye, some of them three times and even four (this section, for instance, is, with a few alterations, identical with the contents of chapter Exodus 23:12—19) in order to declare him who infringes them guilty and to punish him for each of the number of prohibitions which are connected with them and for each of the number of positive commands which are connected with them."}, {"ch": 34, "v": 24, "aliyah": 6, "heb": "כִּֽי־אוֹרִ֤ישׁ גּוֹיִם֙ מִפָּנֶ֔יךָ וְהִרְחַבְתִּ֖י אֶת־גְּבֻלֶ֑ךָ וְלֹא־יַחְמֹ֥ד אִישׁ֙ אֶֽת־אַרְצְךָ֔ בַּעֲלֹֽתְךָ֗ לֵרָאוֹת֙ אֶת־פְּנֵי֙ יְהֹוָ֣ה אֱלֹהֶ֔יךָ שָׁלֹ֥שׁ פְּעָמִ֖ים בַּשָּׁנָֽה׃", "onk": "אֲרֵי אֲתָרֵךְ עַמְמִין מִן קֳדָמָךְ וְאַפְתֵּי יָת תְּחוּמָךְ וְלָא יַחְמֵד אֱנַשׁ יָת אַרְעָךְ בְּמִסְקָךְ לְאִתְחַזָּאָה קֳדָם יְיָ אֱלָהָךְ תְּלַת זִמְנִין בְּשַׁתָּא:", "onk_en": "For I will drive out the nations before you, and I will expand your boundaries; and no man will covet your land when you go up to appear before Adonoy, your God, three times a year.", "pj": "אֲרוּם אֵיתָרֵיךְ עַמְמִין מִן קֳדָמָךְ וְאַפְתֵּי יַת תְּחוּמָךְ וְלָא יַחְמֵיד אֵינַשׁ יַת אַרְעָךְ בִּזְמַן מִיסְקָךְ לְאִתְחֲמָאָה קֳדָם יְיָ אֱלָהָךְ תְּלַת זִמְנִין בְּשַׁתָּא", "pj_en": "For I will drive out the nations from before thee, and enlarge thy borders; and no man shall covet thy land at the time of thy going up to appear before the Lord thy God thrice in the year.", "tj": "", "tj_en": "", "rashi": "<b>אוריש.<\/b> כְּתַרְגּוּמוֹ אֲתָרִיךְ, וְכֵן הָחֵל רָשׁ (דברים ב'), וְכֵן וַיּוֹרֶשׁ אֶת הָאֱמֹרִי (במדבר כ\"א) – לְשׁוֹן גֵּרוּשִׁין:<br><br><b>והרחבתי את גבלך.<\/b> וְאַתָּה רָחוֹק מִבֵּית הַבְּחִירָה, וְאֵינְךָ יָכוֹל לֵרָאוֹת לְפָנַי תָּמִיד, לְכָךְ אֲנִי קוֹבֵעַ לְךָ שָׁלֹֹשׁ רְגָלִים הַלָּלוּ:", "rashi_en": "אוריש means as the Targum has it אתריך, I will drive out. Similar is (Deuteronomy 2:31) “Begin to drive out (רש)”; and similar is, (Numbers 21:32) “and drove out (ויורש) the Amorites” — all having the sense of expelling.<br><br>והרחבתי את גבלך [I WILL DRIVE OUT THE NATIONS BEFORE THEE] AND ENLARGE THY BOUNDARIES — and consequently you may be far from the Chosen House (the Temple) and you will then not be able to appear before Me continually; therefore I appoint for you these three seasons."}, {"ch": 34, "v": 25, "aliyah": 6, "heb": "לֹֽא־תִשְׁחַ֥ט עַל־חָמֵ֖ץ דַּם־זִבְחִ֑י וְלֹא־יָלִ֣ין לַבֹּ֔קֶר זֶ֖בַח חַ֥ג הַפָּֽסַח׃", "onk": "לָא תִכּוֹס עַל חֲמִיעַ דַּם <b>פִּסְחִי<\/b> וְלָא יְבִתוּן לְצַפְרָא <b>בַּר מִמַּדְבְּחָא תַּרְבֵּי<\/b> נִכְסַת חַגָּא דְפִסְחָא:", "onk_en": "Do not slaughter [the Pesach-offering to offer] the blood of My sacrifice [<b>Pesach-offering<\/b>] while there is chometz; and do not allow to remain overnight until morning [<b>off the Altar<\/b>] any [<b>fats<\/b>] of the offering of the Pesach Festival.", "pj": "לָא תִכְסוּן קֳדָם עַד לָא תְבַטְלִין חֲמִיעַ נִכְסַת פִּסְחִי וְלָא יְבִיתוּן לְצַפְרָא בַּר מִמַּדְבְּחָא תַּרְבֵּי נִכְסַת פִּיסְחָא", "pj_en": "You shall not sacrifice the victim of My passover before you have done away with leaven; nor suffer the fat of the paschal sacrifice to remain about the altar till the morning.", "tj": "לָא תְכַסּוּן עַל חֲמִיעַ אִידַם נִכְסַת דְּפִסְחָא לָא יָבִית מִן בִּישְרָא דִי תִכְסוּן בְּלֵילֵי יוֹמָא טָבָא קֳדָמַיָא דְפִסְחָא מִן רַמְשָׁא עַד צַפְרָא:", "tj_en": "You shall not sacrifice with leaven the blood of the paschal victim, nor suffer the flesh which you sacrifice on the night of the feast of the first of Pascha to remain from the evening till the morning.", "rashi": "<b>לא תשחט וגו'.<\/b> לֹא תִשְׁחַט אֶת הַפֶּסַח וַעֲדַיִן חָמֵץ קַיָּם; אַזְהָרָה לַשּׁוֹחֵט אוֹ לַזּוֹרֵק אוֹ לְאֶחָד מִבְּנֵי חֲבוּרָה (פסח' ס\"ג):<br><br><b>ולא ילין.<\/b> כְּתַרְגוּמוֹ; אֵין לִינָה מוֹעֶלֶת בְּרֹאשׁ הַמִּזְבֵּחַ וְאֵין לִינָה אֶלָּא בְּעַמּוּד הַשַּׁחַר (זבחים פ\"ז):<br><br><b>זבח חג הפסח.<\/b> אֵמוּרָיו, וּמִכָּאן אַתָּה לָמֵד לְכָל הֶקְטֵר חֲלָבִים וְאֵבָרִים:", "rashi_en": "לא תשחט וגו׳ THOU SHALT NOT OFFER [THE BLOOD OF MY SACRIFICE TOGETHER WITH LEAVEN] — i. e. thou shalt not kill the Passover lamb whilst leaven is still existent in your possession. This is an admonition addressed to him who slaughters the Passover lamb, as well as to him who sprinkles its blood or to one of the members of the party formed to eat that lamb in company (Pesachim 63a).<br><br>ולא ילין NEITHER SHALL [THE SACRIFICE OF THE FESTIVAL OF PASSOVER] REMAIN OVER NIGHT — Understand this as the Targum renders it: ולא יביתון ... בר ממדבחא … ‎“There shall not remain overnight away from the altar till the morning the fat of the sacrifice” — this law of leaving the fat away from the altar overnight does not serve to invaliditate the sacrifice if it has been placed on the top of the altar some time during the night, even if it be not entirely burnt by morning, nor is the law about leaving the fat overnight infringed except if it has not been placed on the altar by the dawn of the morning (but any time during the night one may lift it up from the pavement on to the altar (Zevachim 87a; cf. Rashi on Exodus 23:18).<br><br>זבח חג הפסח means the pieces of its fat (which had to be burnt on the altar). From here you may derive the law concerning all cases of burning the pieces of fat and the limbs of sacrifices (i. e. you may derive the general rule regarding all sacrifices)."}, {"ch": 34, "v": 26, "aliyah": 6, "heb": "רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְךָ֔ תָּבִ֕יא בֵּ֖ית יְהֹוָ֣ה אֱלֹהֶ֑יךָ לֹא־תְבַשֵּׁ֥ל גְּדִ֖י בַּחֲלֵ֥ב אִמּֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "רֵישׁ בִּכּוּרֵי אַרְעָךְ תַּיְתֵי לְבֵית <b>מַקְדְּשָׁא<\/b> דַּיְיָ אֱלָהָךְ לָא <b>תֵיכְלוּן בְּשַׂר בַּחֲלָב<\/b>:", "onk_en": "The first fruits of your land, you shall bring to the House [<b>of the Sanctuary<\/b>] of Adonoy, your God. You must not cook a kid in its mother’s milk [<b>eat meat with milk<\/b>].", "pj": "שֵׁירוּי בּוּכְרַת פֵּרֵי אַרְעֲכוֹן תַּיְיתוּן לְבֵית מוּקְדְּשָׁא דַיְיָ אֱלָהָכוֹן לֵית אַתּוּן רְשָּׁאִין לָא לִמְבַשְׁלָא וְלָא לְמֵיכוּל בְּשַר וַחֲלַב תְּרֵיהוֹן מְעַרְבִין כַּחֲדָא דְּלָא יִתְקוֹף רוּגְזִי בְּכוֹן וְאֵירְשִׁין פֵּרֵי אֵילָנֵיכוֹן עִם בּוּסְרָא בְּלִבְלוּבֵיהוֹן וְטַרְפֵיהוֹן כַּחֲדָא", "pj_en": "The best of the firstfruits of your land ye shall bring to the sanctuary of the Lord your God. You are not allowed to boil or to eat flesh and milk mixed together, lest My displeasure be kindled against you, and the fruit of your trees, with the grapes in their branches and their leaves, be laid waste together.", "tj": "שֵׁירוּי בִּיכְרַת עֲלַלְתְּכוֹן תַּיְתוּן לְבֵית מַקְדְּשָׁא דַיְיָ אֱלָהָכוֹן עַמִי בֵּית יִשְרָאֵל לֵית אַתּוּן רְשָׁאִין לָא לִמְבַשְׁלָא וְלָא לְמֵיכְלָא בְּשַר וְחָלָב מְעוֹרְבִין כַּחֲדָא:", "tj_en": "The first (best) of the firstfruits of your produce ye shall bring to the sanctuary of the Lord your God. My people of the house of Israel, ye shall not be allowed to boil or to eat flesh and milk mixed together.", "rashi": "<b>ראשית בכורי אדמתך.<\/b> מִשִּׁבְעַת הַמִּינִין הָאֲמוּרִים בְּשֶׁבַח אַרְצְךָ, אֶרֶץ חִטָּה וּשְׂעֹרָה וְגֶפֶן וְגוֹ' (דברים ח') – וּדְבָשׁ הוּא דְּבַשׁ תְּמָרִים:<br><br><b>לא תבשל גדי.<\/b> אַזְהָרָה לְבָשָׂר בְחָלָב, וְשָׁלֹֹשׁ פְעָמִים כָּתוּב בַּתּוֹרָה, אֶחָד לַאֲכִילָה וְאֶחָד לַהֲנָאָה וְאֶחָד לְאִסּוּר בִּשּׁוּל (חולין קט\"ו):<br><br><b>גדי.<\/b> כָּל וָלָד רַךְ בְּמַשְׁמָע, וְאַף עֵגֶל וָכֶבֶשׂ; מִמַּה שֶּׁהֻצְרַךְ לְפָרֵשׁ בְּכַמָּה מְקוֹמוֹת \"גְּדִי עִזִּים\" לָמַדְתָּ שֶׁגְּדִי סְתָם כָּל יוֹנְקִים בְּמַשְׁמָע (שם קי\"ג):<br><br><b>בחלב אמו.<\/b> פְּרָט לָעוֹף שֶׁאֵין לוֹ חָלָב, שֶׁאֵין אִסּוּרוֹ מִן הַתּוֹרָה אֶלָּא מִדִּבְרֵי סוֹפְרִים (שם):", "rashi_en": "ראשית בכורי אדמתך THE FIRST OF THE FIRST-FRUITS OF THY GROUND [THOU SHALT BRING INTO THE HOUSE OF THE LORD THY GOD] — but only from the seven kinds of produce which are mentioned as an excellency of thy land (Deuteronomy 8:8) “a land of wheat and barley and vines etc (Mishnah Bikkurim 1:3). The דבש mentioned in this verse is date honey (not that of bees).<br><br>לא תבשל גדי THOU SHALT NOT SEETHE A KID [IN ITS MOTHER’S MILK] — This is a prohibition to mix meat with milk. This is written three times in the Torah: once to prohibit the eating of such mixture, once to prohibit us from deriving any other benefit (besides eating) from it and once to prohibit the cooking of it (Chullin 115b; cf. Rashi on Exodus 23:19).<br><br>גדי A KID — Any tender young animal is comprehended under the term גדי, a calf and a lamb also. From the fact that the writer felt it necessary to state specifically in several passages “a kid of the goat” you may learn that the term גדי without further definition implies any suckling (young animal) (Chullin 113a; cf. Rashi on Exodus 23:19).<br><br>בחלב אמו IN THE MOTHER’S MILK — A fowl is therefore really excluded from this law since it has no milk; for the prohibition regarding it (using it with milk) is not a Biblical law but only an enactment of the Soferim (Chullin 113a)."}, {"ch": 34, "v": 27, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה כְּתׇב־לְךָ֖ אֶת־הַדְּבָרִ֣ים הָאֵ֑לֶּה כִּ֞י עַל־פִּ֣י&thinsp;<b>׀<\/b> הַדְּבָרִ֣ים הָאֵ֗לֶּה כָּרַ֧תִּי אִתְּךָ֛ בְּרִ֖ית וְאֶת־יִשְׂרָאֵֽל׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה כְּתַב לָךְ יָת פִּתְגָּמַיָּא הָאִלֵּין אֲרֵי <b>עַל מֵימַר<\/b> פִּתְגָּמַיָּא הָאִלֵּין גְּזָרִית עִמָּךְ קְיַם וְעִם יִשְׂרָאֵל:", "onk_en": "Adonoy said to Moshe, “Write these words down for yourself, for with [<b>regarding the expression of<\/b>] these words I have made a covenant with you and with [the B’nei] Yisrael.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה כְּתוֹב לָךְ יַת פִּתְגָמַיָא הָאִילֵין אֲרוּם עַל מֵימַר פִּתְגָמַיָא הָאִילֵין גְּזָרִית עִמָּךְ קְיַים וְעִם יִשְרָאֵל", "pj_en": "And the Lord said to Mosheh, Write thou these words; for upon the expression of these words have I stricken My covenant with thee and with the people of Israel.", "tj": "", "tj_en": "", "rashi": "<b>את הדברים האלה.<\/b> וְלֹא אַתָּה רַשַּׁאי לִכְתֹּב תּוֹרָה שֶׁבְּעַל פֶּה (גיטין ס'):", "rashi_en": "את הדברים האלה [WRITE THOU] THESE WORDS — These words, but you are not permitted to write down the “Oral Law” (Gittin 60b)."}, {"ch": 34, "v": 28, "aliyah": 7, "heb": "וַֽיְהִי־שָׁ֣ם עִם־יְהֹוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְאַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּמַ֖יִם לֹ֣א שָׁתָ֑ה וַיִּכְתֹּ֣ב עַל־הַלֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַבְּרִ֔ית עֲשֶׂ֖רֶת הַדְּבָרִֽים׃", "onk": "וַהֲוָה תַמָּן <b>קֳדָם<\/b> יְיָ אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילָוָן לַחְמָא לָא אֲכַל וּמַיָּא לָא שְׁתֵי וּכְתַב עַל לוּחַיָּא יָת פִּתְגָּמֵי קְיָמָא עַשְׂרָא פִּתְגָּמִין:", "onk_en": "He [Moshe] remained there with [<b>before<\/b>] Adonoy for forty days and forty nights. He did not eat bread nor drink water, and He wrote on the tablets the words of the covenant, the Ten Words [commandments.]", "pj": "וַהֲוָה תַּמָּן קֳדָם יְיָ אַרְבְּעִין יְמָמִין וְאַרְבְּעִין לֵילַוָן לַחֲמָא לָא אָכַל וּמוֹי לָא אִשְׁתֵּי וּכְתַב עַל לוּחַיָא חוֹרַנְיָיתָא יַת פִּתְגָמֵי קַיְימָא עֲשַרְתֵּי דִבּוּרַיָא דַהֲווֹ כְתִיבִין עַל לוּחַיָא קַדְמָאֵי", "pj_en": "And he was there before the Lord forty days and forty nights; he ate no bread nor did he drink water; and he wrote upon the other tables the words of the covenant, the Ten Words which had been written upon the former tables.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 34, "v": 29, "aliyah": 7, "heb": "וַיְהִ֗י בְּרֶ֤דֶת מֹשֶׁה֙ מֵהַ֣ר סִינַ֔י וּשְׁנֵ֨י לֻחֹ֤ת הָֽעֵדֻת֙ בְּיַד־מֹשֶׁ֔ה בְּרִדְתּ֖וֹ מִן־הָהָ֑ר וּמֹשֶׁ֣ה לֹֽא־יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖יו בְּדַבְּר֥וֹ אִתּֽוֹ׃", "onk": "וַהֲוָה כַּד נְחַת משֶׁה מִטּוּרָא דְסִינַי וּתְרֵין לוּחֵי סַהֲדוּתָא בִּידָא דְמשֶׁה בְּמֵחֲתֵיהּ מִן טוּרָא וּמשֶׁה לָא יְדַע אֲרֵי <b>סְגֵי זִיו יְקָרָא<\/b> דְאַפּוֹהִי בְּמַלָּלוּתֵיהּ עִמֵּיהּ:", "onk_en": "And when Moshe came down from Mount Sinai, and the two Tablets of the Testimony were in Moshe’s hand when he came down from the Mountain. Moshe did not know that the skin [<b>splendor of the glory<\/b>] of his face had become radiant [<b>increased<\/b>] when He [God] spoke to him.", "pj": "וַהֲוָה בִזְמַן מֵיחַת משֶׁה מִן טַוְורָא דְסִינַי וּתְרֵין לוּחֵי דְסַהֲדוּתָא בִּידָא דְמשֶׁה בְּמֵיחְתֵיהּ מִן טַוְורָא וּמשֶׁה לָא חַכִּים אֲרוּם אִשְׁתַּבְהַר זִיו אִיקוּנִין דְּאַנְפּוֹי דַּהֲוַת לֵיהּ מִן זִיו אִיקַר שְׁכִינְתָּא דַיְיָ בִּזְמַן מַלֵלְיוּתֵיהּ עִמֵיהּ", "pj_en": "And it was at the time when Mosheh came down from the mountain of Sinai, with the two tables of the testimony in the hand of Mosheh, in his descending from the mount, that Mosheh knew not that the visage (form) of his face shone with the splendour which had come upon him from the brightness of the glory of the Lord's Shekinah in the time of His speaking with him.", "tj": "אֲרֵי שַׁבָּחוּ זִיוֵיהוֹן דְּאַפֵּיהּ:", "tj_en": "That the beams of his face did shine.", "rashi": "<b>ויהי ברדת משה.<\/b> כְּשֶׁהֵבִיא לוּחוֹת אַחֲרוֹנוֹת בְּיוֹם הַכִּפּוּרִים:<br><br><b>כי קרן.<\/b> לְשׁוֹן קַרְנַיִם, שֶׁהָאוֹר מַבְהִיק וּבוֹלֵט כְּמִין קֶרֶן; וּמֵהֵיכָן זָכָה מֹשֶׁה לְקַרְנֵי הַהוֹד? רַבּוֹתֵינוּ אָמְרוּ מִן הַמְּעָרָה, שֶׁנָּתַן הַקָּדוֹשׁ בָּרוּךְ הוּא יָדוֹ עַל פָּנָיו, שֶׁנֶּאֱמַר וְשַׂכֹּתִי כַפִּי (תנחומא):", "rashi_en": "ויהי ברדת משה AND IT CAME TO PASS WHEN MOSES WENT DOWN [FROM MOUNT SINAI] — when he brought the second tablets on the Day of Atonement.<br><br>כי קרן עור פניו THAT THE SKIN OF HIS FACE BEAMED — קרן is an expression connected with the word קרנים “horns”, and the phrase, קרן אור, the light-“horned” , is used here because light radiates from a point and projects Like a horn. And whence was Moses privileged to have the rays of glory? Our Rabbis said that they originated at the time when he was in the cave, for the Holy One, blessed be He, then put His hand upon his face, as it is said, (Exodus 33:22) “And I will shelter thee with My hand” (Midrash Tanchuma, Ki Tisa 37)."}, {"ch": 34, "v": 30, "aliyah": 7, "heb": "וַיַּ֨רְא אַהֲרֹ֜ן וְכׇל־בְּנֵ֤י יִשְׂרָאֵל֙ אֶת־מֹשֶׁ֔ה וְהִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑יו וַיִּֽירְא֖וּ מִגֶּ֥שֶׁת אֵלָֽיו׃", "onk": "וַחֲזָא אַהֲרֹן וְכָל בְּנֵי יִשְׂרָאֵל יָת משֶׁה וְהָא <b>סְגֵי זִיו יְקָרָא<\/b> דְאַפּוֹהִי וּדְחִילוּ מִלְּאִתְקְרָבָא לְוָתֵיהּ:", "onk_en": "When Aharon and all the B’nei Yisrael saw Moshe, and beheld that the skin [<b>splendor of the glory<\/b>] of his face had become radiant [<b>increased<\/b>], they were afraid to come close to him.", "pj": "וַחֲמָא אַהֲרן וְכָל בְּנֵי יִשְרָאֵל יַת משֶׁה וְהָא אִשְׁתַּבְהַר זִיו אִקּוּנִין דְּאַנְפּוֹי וּדְחִילוּ מִן לְמִקְרְבָא לְוָותֵיהּ", "pj_en": "And Aharon and all the sons of Israel saw Mosheh, and, behold, the glory of the form of his face shined, and they were afraid to come near to him.", "tj": "", "tj_en": "", "rashi": "<b>וייראו מגשת אליו.<\/b> בֹּא וּרְאֵה כַּמָּה גָדוֹל כֹּחָהּ שֶׁל עֲבֵרָה שֶׁעַד שֶׁלֹּא פָשְׁטוּ יְדֵיהֶם בַּעֲבֵרָה מַהוּ אוֹמֵר? וּמַרְאֵה כְּבוֹד ה' כְּאֵשׁ אֹכֶלֶת בְּרֹאשׁ הָהָר לְעֵינֵי בְּנֵי יִשְׂרָאֵל (שמות כ\"ד) – וְלֹא יְרֵאִים וְלֹא מִזְדַּעְזְעִים, וּמִשֶּׁעָשׂוּ אֶת הָעֵגֶל אַף מִקַּרְנֵי הוֹדוֹ שֶׁל מֹשֶׁה הָיוּ מַרְתִּיעִים וּמִזְדַּעְזְעִים (ספרי):", "rashi_en": "וייראו מגשת אליו AND THEY WERE AFRAID TO STEP NIGH UNTO HIM — Come and see how great is the power (influence) of sin! For before they streched forth their hand to sin what does Scripture say? (Exodus 24:17) “And the sight of the glory of the Lord was like devouring fire on the top of the mountain in the eyes of the children of Israel”, — and yet they were not afraid and did not tremble! But after they made the golden calf they recoiled and trembled even at the sight of the rays of glory of Moses! (Sifrei Bamidbar 1:8)"}, {"ch": 34, "v": 31, "aliyah": 7, "heb": "וַיִּקְרָ֤א אֲלֵהֶם֙ מֹשֶׁ֔ה וַיָּשֻׁ֧בוּ אֵלָ֛יו אַהֲרֹ֥ן וְכׇל־הַנְּשִׂאִ֖ים בָּעֵדָ֑ה וַיְדַבֵּ֥ר מֹשֶׁ֖ה אֲלֵהֶֽם׃", "onk": "וּקְרָא לְהוֹן משֶׁה וְתָבוּ לְוָתֵיהּ אַהֲרֹן וְכָל רַבְרְבַיָּא בִּכְנִשְׁתָּא וּמַלֵּל משֶׁה עִמְּהוֹן:", "onk_en": "Moshe called to them and they returned to him—Aharon and all the leaders of the congregation—and Moshe spoke to them.", "pj": "וּקְרָא לְהוֹן משֶׁה וְתָבוּ לְוָותֵיהּ אַהֲרן וְכָל רַבְרְבַיָא דְאִתְמְנוּן נְגוֹדִין בִּכְנִישְׁתָּא וּמַלֵיל משֶׁה עִמְהוֹן", "pj_en": "And Mosheh called to them and Aharon, and all the princes who had been appointed chiefs in the congregation returned, and Mosheh conversed with them.", "tj": "", "tj_en": "", "rashi": "<b>הנשאים בעדה.<\/b> כְּמוֹ נְשִׂיאֵי הָעֵדָה:<br><br><b>וידבר משה אלהם.<\/b> שְׁלִיחוּתוֹ שֶׁל מָקוֹם, וּלְשׁוֹן הֹוֶה הוּא כָל הָעִנְיָן הַזֶּה:", "rashi_en": "הנשאים בעדה THE PRINCES IN THE CONGREGATION — is the same as the more usual expression נשיאי העדה, the princes of the congregation.<br><br>וידבר משה אלהם AND MOSES SPOKE TO THEM the message of the Almighty. This whole section (i. e. all the verbs in it) denotes frequentative action (thus וידבר means “Moses used to say”, ויקרא meant “He used to call”, נגשו means “they used to come near” etc)."}, {"ch": 34, "v": 32, "aliyah": 7, "heb": "וְאַחֲרֵי־כֵ֥ן נִגְּשׁ֖וּ כׇּל־בְּנֵ֣י יִשְׂרָאֵ֑ל וַיְצַוֵּ֕ם אֵת֩ כׇּל־אֲשֶׁ֨ר דִּבֶּ֧ר יְהֹוָ֛ה אִתּ֖וֹ בְּהַ֥ר סִינָֽי׃", "onk": "וּבָתַר כֵּן אִתְקְרִיבוּ כָּל בְּנֵי יִשְׂרָאֵל וּפַקֵּדִנּוּן יָת כָּל דִּי מַלֵּל יְיָ עִמֵּיהּ בְּטוּרָא דְסִינָי:", "onk_en": "After that, all the B’nei Yisrael came close [to him] and he commanded them [regarding] all that Adonoy had spoken with him on Mount Sinai.", "pj": "וּמִבָּתַר כְּדֵין אִיתְקְרִיבוּ כָּל בְּנֵי יִשְרָאֵל וּפַקֵּידִינוּן יַת כָּל מַה דְּמַלֵּיל יְיָ עִמֵּיהּ בְּטַוְורָא דְסִינַי", "pj_en": "And afterward drew nigh all the sons of Israel, and he taught them all that the Lord had spoken to him on Mount Sinai.", "tj": "", "tj_en": "", "rashi": "<b>ואחרי כן נגשו.<\/b> אַחַר שֶׁלִּמֵּד לַזְּקֵנִים, חוֹזֵר וּמְלַמֵּד הַפָּרָשָׁה אוֹ הַהֲלָכָה לְיִשְׂרָאֵל; תָּנוּ רַבָּנָן כֵּיצַד סֵדֶר הַמִּשְׁנָה? מֹשֶׁה הָיָה לָמֵד מִפִּי הַגְּבוּרָה, נִכְנַס אַהֲרֹן שָׁנָה לוֹ מֹשֶׁה פִּרְקוֹ, נִסְתַּלֵּק אַהֲרֹן וְיָשַׁב לוֹ לִשְׂמֹאל מֹשֶׁה, נִכְנְסוּ בָנָיו, שָׁנָה לָהֶם מֹשֶׁה פִּרְקָם נִסְתַּלְּקוּ הֵן, יָשַׁב אֶלְעָזָר לִימִין מֹשֶׁה וְאִיתָמָר לִשְׂמֹאל אַהֲרֹן, נִכְנְסוּ זְקֵנִים, שָׁנָה לָהֶם מֹשֶׁה פִּרְקָם, נִסְתַּלְּקוּ זְקֵנִים יָשְׁבוּ לַצְּדָדִין, נִכְנְסוּ כָּל הָעָם, שָׁנָה לָהֶם מֹשֶׁה פִּרְקָם; נִמְצָא בְּיַד כָּל הָעָם אֶחָד, בְּיַד הַזְּקֵנִים שְׁנַיִם, בְּיַד בְּנֵי אַהֲרֹן שְׁלֹשָׁה, בְּיַד אַהֲרֹן אַרְבָּעָה וְכוּ'. כִּדְאִיתָא בְעֵרוּבִין (דף נ\"ד):", "rashi_en": "ואחרי כן נגשו AND AFTERWARDS [THE CHILDREN OF ISRAEL] STEPPED NIGH — After he (Moses) had taught the elders he used again to teach the section or the single Halacha in question to the Israelites. The Rabbis have taught: How was the system of teaching? Moses used to learn the law from the mouth of the Almighty; Aaron entered and Moses taught him his lesson. Now Aaron moved away and took his seat to the left of Moses. Then his (Aaron’s) sons entered and Moses taught them their lesson. They moved away and Eleazar took his seat to the right of Moses, whilst Ithamar sat down at Aaron’s left. The elders then entered and Moses taught them their lesson. The elders moved away and took their seat at the side. Finally the whole people entered and Moses taught them their lesson. Consequently what was taught came into the possession of the whole people once, into the possession of the elders twice, into the possession of Aaron’s sons thrice and into Aaron’s possession four times etc. — as it is stated in Eruvin 54b."}, {"ch": 34, "v": 33, "aliyah": 7, "heb": "וַיְכַ֣ל מֹשֶׁ֔ה מִדַּבֵּ֖ר אִתָּ֑ם וַיִּתֵּ֥ן עַל־פָּנָ֖יו מַסְוֶֽה׃", "onk": "וְשֵׁיצֵי משֶׁה מִלְמַלָּלָא עִמְּהוֹן וִיהַב עַל אַפּוֹהִי <b>בֵּית אַפֵּי<\/b>:", "onk_en": "When Moshe finished speaking with them, he placed a [<b>face<\/b>] cover[<b>ing<\/b>] over his face.", "pj": "וּפְסַק משֶׁה מִן לְמַלָלָא עִמְהוֹן וִיהַב עַל אִיקוּנִין דְּבֵית אַנְפּוֹי סוּדָרָא", "pj_en": "And when Mosheh had finished to speak with them, he put over the form of his face a veil.", "tj": "סוּדָרָא:", "tj_en": "A cloth.", "rashi": "<b>ויתן על פניו מסוה.<\/b> כְּתַרְגּוּמוֹ בֵּית אַפֵּי, לְשׁוֹן אֲרַמִּי הוּא, בַּתַּלְמוּד (כתובות ס\"ב) סְוִי לִבָּהּ, וְעוֹד בִּכְתֻבּוֹת (דף ס'), הֲוָה קָא מַסְוֵה לְאַפָּהּ, לְשׁוֹן הַבָּטָה – הָיָה מִסְתַּכֵּל בָּהּ, אַף כָּאן מַסְוֶה בֶּגֶד הַנִּתָּן כְּנֶגֶד הַפַּרְצוּף וּבֵית הָעֵינַיִם; וְלִכְבוֹד קַרְנֵי הַהוֹד – שֶׁלֹּא יִזּוֹנוּ הַכֹּל מֵהֶם – הָיָה נוֹתֵן הַמַּסְוֶה כְּנֶגְדָּן, וְנוֹטְלוֹ בְּשָׁעָה שֶׁהָיָה מְדַבֵּר עִם יִשְׂרָאֵל, וּבְשָׁעָה שֶׁהַמָּקוֹם נִדְבָּר עִמּוֹ עַד צֵאתוֹ, וּבְצֵאתוֹ יָצָא בְּלֹא מַסְוֶה:", "rashi_en": "ויתן על פניו מסוה AND HE PUT A VEIL ON HIS FACE — Render it (מסוה) as the Targum does: בית אפי, a cover for his face. מסוה is an Aramaic expression (from the root סוי, “to look”). It occurs in the Talmud (Ketubot 62b) “her heart perceived (סּוי), and again in Ketubot 60a “הוה קא מסוה לאפה”, where מסוה is an expression for looking: “he looked into her face”, i. e. he gazed at her. Here, too, מסוה denotes a cloth that was put in front of the face and of the region of the eyes. And out of reverence for the “rays of glory” — that not everybody should feast himself on them — Moses used to put the veil in front of them (the eyes), but took it off during the time when he spoke to Israel, and during the time when the Omnipresent conversed with him until the moment when he was going out and also when he went out he went out without the veil."}, {"ch": 34, "v": 34, "aliyah": 7, "heb": "וּבְבֹ֨א מֹשֶׁ֜ה לִפְנֵ֤י יְהֹוָה֙ לְדַבֵּ֣ר אִתּ֔וֹ יָסִ֥יר אֶת־הַמַּסְוֶ֖ה עַד־צֵאת֑וֹ וְיָצָ֗א וְדִבֶּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה׃", "onk": "וְכַד עָלֵל משֶׁה לָקֳדָם יְיָ לְמַלָּלָא עִמֵּיהּ אַעְדִּי יָת <b>בֵּית אַפּוֹהִי<\/b> עַד מִפְּקֵיהּ וְנָפֵק וּמְמַלֵּל עִם בְּנֵי יִשְׂרָאֵל יָת דִי מִתְפַּקָּד:", "onk_en": "[But] when Moshe came before Adonoy, to speak to Him; he removed the [<b>face<\/b>] cover[<b>ing<\/b>] until he was ready to leave. and he would then go out and speak to the B’nei Yisrael, [telling them] what he had been commanded.", "pj": "וְכַד עָלֵיל משֶׁה לִקְדָם יְיָ לְמַלָלָא עִמֵּיהּ מַעְדֵי יַת סוּדְרָא דְעַל אִיקוּנִין דְּבֵית אַנְפּוֹי עַד מִיפְקֵיהּ וְנָפֵיק וּמְמַלֵּיל עִם בְּנֵי יִשְרָאֵל יַת מַה דְּאִתְפַּקֵּד", "pj_en": "And when Mosheh went in before the Lord to speak with Him, he removed the veil from his countenance until he came forth; and he came forth and spake to the sons of Israel what had been commanded.", "tj": "", "tj_en": "", "rashi": "<b>ודבר אל בני ישראל.<\/b> וְרָאוּ קַרְנֵי הַהוֹד בְּפָנָיו; וּכְשֶׁהוּא מִסְתַּלֵּק מֵהֶם …", "rashi_en": "ודבר אל בני ישראל … וראו AND HE SPOKE UNTO THE CHILDREN OF ISRAEL… AND THEY SAW the rays of glory on his face; and when he moved away from them ..."}, {"ch": 34, "v": 35, "aliyah": 7, "heb": "וְרָא֤וּ בְנֵֽי־יִשְׂרָאֵל֙ אֶת־פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְהֵשִׁ֨יב מֹשֶׁ֤ה אֶת־הַמַּסְוֶה֙ עַל־פָּנָ֔יו עַד־בֹּא֖וֹ לְדַבֵּ֥ר אִתּֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַחֲזָן בְּנֵי יִשְׂרָאֵל יָת אַפֵּי משֶׁה אֲרֵי <b>סְגֵי זִיו יְקָרָא<\/b> דְאַפֵּי משֶׁה וַאֲתֵב משֶׁה יָת <b>בֵּית אַפֵּי<\/b> עַל אַפּוֹהִי עַד דְּעָלֵל לְמַלָּלָא עִמֵּיהּ:", "onk_en": "The B’nei Yisrael saw Moshe’s face, that the skin [<b>splendor of the glory<\/b>] of Moshe’s face had become radiant [<b>increased<\/b>], and Moshe replaced the [<b>face<\/b>] cover[<b>ing<\/b>] over his face until he would come in to speak to Him [Adonoy].", "pj": "וְחַמְיַין בְּנֵי יִשְרָאֵל יַת אִיקוּנִין דְּמשֶׁה אֲרוּם אִשְׁתַּבְהַר זִיו אִיקוּנִין דְּאַנְפֵּי משֶׁה וְאָתֵיב משֶׁה יַת סוּדְרָא עַל בֵּית אַפּוֹי עַד זְמַן מֵיעֲלֵיהּ לְמַלָלָא עִמֵּיהּ", "pj_en": "And the sons of Israel saw the countenance of Mosheh, that the glory of the form of Mosheh's face was shining. And Mosheh replaced the veil upon his face until the time of his going in to speak with Him.", "tj": "", "tj_en": "", "rashi": "<b>והשיב משה את המסוה על פניו עד באו לדבר אתו.<\/b> וּכְשֶׁבָּא לְדַבֵּר אִתּוֹ נוֹטְלוֹ מֵעַל פָּנָיו:", "rashi_en": "והשיב משה את המסוה על פניו עד באו לדבר אתו MOSES REPLACED THE VEIL UPON HIS FACE UNTIL HE CAME IN TO SPEAK WITH HIM — but when he came in to speak with Him he took it off his face."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null;
  for (const row of DATA) {
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
}

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    render();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
setTimeout(syncHeaderHeight, 150);
</script>
