<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 38, "v": 21, "aliyah": 1, "heb": "אֵ֣לֶּה פְקוּדֵ֤י הַמִּשְׁכָּן֙ מִשְׁכַּ֣ן הָעֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל־פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַלְוִיִּ֔ם בְּיַד֙ אִֽיתָמָ֔ר בֶּֽן־אַהֲרֹ֖ן הַכֹּהֵֽן׃", "onk": "אִלֵּין מִנְיָנֵי מַשְׁכְּנָא מַשְׁכְּנָא דְסַהֲדוּתָא דִּי אִתְמְנֵי עַל מֵימְרָא דְמשֶׁה פָּלְחַן לֵיוָאֵי בִּידָא דְּאִיתָמָר בַּר אַהֲרֹן כַּהֲנָא:", "onk_en": "These are the accounts of the mishkon, the mishkon of Testimony, that were drawn up by Moshe’s order; for the work of the Levites under the direction of Isamar, son of Aharon the kohein.", "pj": "אלה אִלֵין מִנְיָנֵי מַתְקַלְוָן וּסְכוּמְהוֹן דְּמַשְׁכְּנָא דְסַהֲדוּתָא דְאִתְמְנִיוּ עַל פּוּם מֵימְרָא דְמשֶׁה בְּרַם פּוּלְחַן לֵיוָאֵי הֲוַת בִּידָא דְאִיתָמָר בַּר אַהֲרן כַּהֲנָא", "pj_en": "These are the sums, weights, and numbers of the Tabernacle of the Testimony, which were counted by the word of the mouth of Mosheh. But the service of the Levites was by the hand of Ithamar bar Aharon the priest.", "tj": "", "tj_en": "", "rashi": "<b>אלה פקודי.<\/b> בְּפָרָשָׁה זוֹ נִמְנוּ כָל מִשְׁקְלֵי נִדְבַת הַמִּשְׁכָּן, לַכֶּסֶף וְלַזָּהָב וְלַנְּחֹשֶׁת, וְנִמְנוּ כָל כֵּלָיו לְכָל עֲבוֹדָתוֹ:<br><br><b>המשכן משכן.<\/b> שְׁנֵי פְעָמִים, רֶמֶז לַמִּקְדָשׁ שֶׁנִּתְמַשְׁכֵּן בִּשְׁנֵי חֻרְבָּנִין עַל עֲוֹנוֹתֵיהֶן שֶׁל יִשְׂרָאֵל (תנחומא):<br><br><b>משכן העדת.<\/b> עֵדוּת לְיִשְׂרָאֵל שֶׁוִּתֵּר לָהֶם הַקָּבָּ\"ה עַל מַעֲשֵׂה הָעֵגֶל, שֶׁהֲרֵי הִשְׁרָה שְׁכִינָתוֹ בֵּינֵיהֶם:<br><br><b>עבדת הלוים.<\/b> פְּקוּדֵי הַמִּשְׁכָּן וְכֵלָיו הִיא עֲבוֹדָה הַמְּסוּרָה לַלְוִיִם בַּמִּדְבָּר – לָשֵׂאת וּלְהוֹרִיד וּלְהָקִים, אִישׁ אִישׁ לְמַשָּׂאוֹ הַמֻּפְקָד עָלָיו, כְּמוֹ שֶׁאָמוּר בְּפָ' נָשֹׂא:<br><br><b>ביד איתמר.<\/b> הוּא הָיָה פָּקִיד עֲלֵיהֶם לִמְסֹר לְכָל בֵּית אָב עֲבוֹדָה שֶׁעָלָיו:", "rashi_en": "אלה פקודי THESE ARE THE SUMS [OF THE TABERNCLE] — In this section are enumerated all the weights of the metals given as a contribution for the Tabernacle, of silver, gold and copper, and also there are enumerated the vessels used for every kind of service in it.<br><br>המשכן משכן OF THE TABERNACLE, EVEN OF THE TABERNACLE — The word משכן is mentioned here twice in allusion to the Temple that was taken in pledge (משכן) — as it were — (as a security for Israel’s repentance) by being twice destroyed for Israel’s iniquities (Midrash Tanchuma, Pekudei 5).<br><br>משכן העדת THE TABERNACLE OF THE TESTIMONY — The Tabernacle was a testimony to Israel that God had shown Himself indulgent to them in respect to the incident of the golden calf, for through the Temple He made His Shechinah dwell amongst them (Midrash Tanchuma, Pekudei 6).<br><br>עבדת הלוים THE SERVICE OF THE LEVITES — The things in the Tabernacle which were counted and its vessels constituted the service entrusted to the Levites in the wilderness — to carry them, to take them down and to set them up, each man according to the burden which was assigned to him, as is set forth in the section נשא (Numbers 4).<br><br>ביד איתמר BY THE HAND OF ITHAMAR — He was the officer appointed over them (the Levites) with the duty to hand over to each “house of the father” (בית אב) the service that devolved upon it."}, {"ch": 38, "v": 22, "aliyah": 1, "heb": "וּבְצַלְאֵ֛ל בֶּן־אוּרִ֥י בֶן־ח֖וּר לְמַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כׇּל־אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וּבְצַלְאֵל בַּר אוּרִי בַר חוּר לְשִׁבְטָא דִיהוּדָה עֲבַד יָת כָּל דִּי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "Betzalel, son of Uri, son of Chur, of the tribe of Yehudah, made all that Adonoy commanded Moshe.", "pj": "וּבְצַלְאֵל בַּר אוּרִי בַּר חוּר לְשִׁבְטָא דִיהוּדָה עֲבַד יַת כָּל דְּפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "And Bezalel bar Uri bar Hur, of the tribe of Jehudah, made all that the Lord had commanded Mosheh;", "tj": "", "tj_en": "", "rashi": "<b>ובצלאל בן אורי וגו' עשה את כל אשר צוה ה' את משה.<\/b> אֲשֶׁר צִוָּה מֹשֶׁה אֵין כְּתִיב כָּאן, אֶלָּא כָּל אֲשֶׁר צִוָּה ה' אֶת מֹשֶׁה, אֲפִלּוּ דְּבָרִים שֶׁלֹּא אָמַר לוֹ רַבּוֹ, הִסְכִּימָה דַּעְתּוֹ לְמַה שֶּׁנֶּאֱמַר לְמֹשֶׁה בְּסִינַי, כִּי מֹשֶׁה צִוָּה לִבְצַלְאֵל לַעֲשׂוֹת תְּחִלָּה כֵּלִים וְאַחַר כָּךְ מִשְׁכָּן, אָמַר לוֹ בְּצַלְאֵל מִנְהַג עוֹלָם לַעֲשׂוֹת תְּחִלָּה בַּיִת וְאַחַר כָּךְ מֵשִׂים כֵּלִים בְּתוֹכוֹ. אָמַר לוֹ כָּךְ שָׁמַעְתִּי מִפִּי הקב\"ה. אָמַר לוֹ מֹשֶׁה בְּצֵל אֵל הָיִיתָ, כִּי בְּוַדַּאי כָּךְ צִוָּה לִי הקב\"ה, וְכֵן עָשָׂה הַמִּשְׁכָּן תְּחִלָּה וְאַחַר כָּךְ עָשָׂה הַכֵּלִים:", "rashi_en": "ובצלאל בן אורי וגו׳ עשה את כל אשר צוה ה' את משה AND BEZALEEL THE SON OF URI etc. MADE ALL THAT THE LORD COMMANDED MOSES — It is not stated here: אשר צֻוָּה (Bezaleel made all that he had been commanded), but “[Bezaleel made] all that the Lord commanded Moses” — even regarding such things which his teacher (Moses) did not tell him, his own opinion was in agreement with what had been told to Moses on Sinai (Jerusalem Talmud Peah 1:1; Bereishit Rabbah 1:14). [For Moses bade Bezaleel to make the vessels first and the Tabernacle afterwards but Bezaleel said to him: “Surely, it is the way of the world (the usual way) first to build a house and then to place the household utensils in it!” He (Moses) replied to him: “So, indeed, did I hear from the mouth of the Holy One, blessed be He”. Moses further said to him: (בצלאל), you must have been sitting in the shadow of God (בצל אל), for certainly did thus God command me!” And consequently Bezaleel made the Tabernacle first and afterwards he made the vessels (cf. Berakhot 55a)."}, {"ch": 38, "v": 23, "aliyah": 1, "heb": "וְאִתּ֗וֹ אׇהֳלִיאָ֞ב בֶּן־אֲחִיסָמָ֛ךְ לְמַטֵּה־דָ֖ן חָרָ֣שׁ וְחֹשֵׁ֑ב וְרֹקֵ֗ם בַּתְּכֵ֙לֶת֙ וּבָֽאַרְגָּמָ֔ן וּבְתוֹלַ֥עַת הַשָּׁנִ֖י וּבַשֵּֽׁשׁ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְעִמֵּיהּ אָהֳלִיאָב בַּר אֲחִיסָמָךְ לְשִׁבְטָא דְדָן <b>נַגָּר<\/b> וְאֳמָּן וְצַיָּר בְּתִכְלָא וּבְאַרְגְּוָנָא <b>וּבִצְבַע<\/b> זְהוֹרִי וּבְבוּצָא:", "onk_en": "With him was Oholiav, son of Achisamach, of the tribe of Dan, sculptor [<b>carpenter<\/b>] and craftsman, and embroiderer in greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, and fine linen.", "pj": "וְעִמֵּיהּ אָהֳלִיאָב בַּר אֲחִיסָמָךְ לְשִׁבְטָא דְדָן נַגַר וְאוֹמַן וְצַיַיר בְּתִכְלָא וּבְאַרְגְוָונָא וּבִצְבַע זְהוֹרֵי וּבְבוּצָא", "pj_en": "and with him, Ahaliab bar Achisamak, of the tribe of Dan, a worker in wood, and an artificer, and an embroiderer in hyacinth, and in purple, and in crimson, and in fine linen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 24, "aliyah": 1, "heb": "כׇּל־הַזָּהָ֗ב הֶֽעָשׂוּי֙ לַמְּלָאכָ֔ה בְּכֹ֖ל מְלֶ֣אכֶת הַקֹּ֑דֶשׁ וַיְהִ֣י&thinsp;<b>׀<\/b> זְהַ֣ב הַתְּנוּפָ֗ה תֵּ֤שַׁע וְעֶשְׂרִים֙ כִּכָּ֔ר וּשְׁבַ֨ע מֵא֧וֹת וּשְׁלֹשִׁ֛ים שֶׁ֖קֶל בְּשֶׁ֥קֶל הַקֹּֽדֶשׁ׃", "onk": "כָּל דַּהֲבָא דְאִתְעֲבֵד לְעִבִידָא בְּכֹל עִבִידַת קוּדְשָׁא וַהֲוָה דְּהַב אֲרָמוּתָא עֶסְרִין וּתְשַׁע כִּכְּרִין וּשְׁבַע מְאָה וּתְלָתִין <b>סִלְעִין בְּסִלְעֵי<\/b> קוּדְשָׁא:", "onk_en": "All the gold that was used for the work in all the work of the Sanctuary. The gold donated as a wave offering amounted to twenty-nine kikar and seven hundred and thirty shekel [<b>selaim<\/b>], (measured) by the [<b>selaim of the<\/b>] Sanctuary standard.", "pj": "כָּל דַּהֲבָא דְּאִתְעֲבֵיד לְעִיבִידְתָּא בְּכָל עִיבִידַת קוּדְשָׁא וַהֲוָה סְכוּם דְּהַב אֲרָמוּתָא עַשְרִין וּתְשַׁע קַנְטְרִין וּשְׁבַע מְאָה וּתְלָתִין סִלְעִין בְּסִלְעֵי קוּדְשָׁא דֵין הוּא דְהַב אֲרָמוּתָא דְאַרִימוּ בְּנֵי יִשְרָאֵל כָּל גְּבַר דְּאִתְרְעֵי לִבֵּיהּ לְאַפְרָשָׁא", "pj_en": "All the gold that was used in making the whole work of the sanctuary, and it was the amount of the gold of the oblation, (was) twenty and nine talents, and seven hundred and thirty shekels, in the shekel of the sanc­tuary. This was the gold of the oblation, which every man of the sons of Israel, whose heart was willing, had offered as a separation.", "tj": "", "tj_en": "", "rashi": "<b>ככר.<\/b> שִׁשִּׁים מָנֶה, וּמָנֶה שֶׁל קֹדֶשׁ כָּפוּל הָיָה, הֲרֵי הַכִּכָּר ק\"כ מָנֶה, וְהַמָּנֶה כ\"ה סְלָעִים, הֲרֵי כִּכָּר שֶׁל קֹדֶשׁ שְׁלֹשֶׁת אֲלָפִים שְׁקָלִים, לְפִיכָךְ מָנָה בִּפְרוֹטְרוֹט כָּל הַשְּׁקָלִים שֶׁפְּחוּתִין בְּמִנְיָנָם מִג' אֲלָפִים, שֶׁאֵין מַגִּיעִין לְכִכָּר:", "rashi_en": "ככר [TWENTY NINE] TALENTS — A common kikkar contains sixty common manehs, and the maneh of the Sanctuary (that used for purposes connected with the Temple) was double the common maneh. Consequently the kikkar here mentioned was 120 common manehs. Now a common maneh contained 25 Sela’im (or shekels), and the kikkar of the Sanctuary equals three thousand shekels. That is why Scripture counts (mentions the number of) all the shekels that are fewer than 3,000 as a separate item, because these do not together amount to a kikkar (cf. Bekhorot 5a)."}, {"ch": 38, "v": 25, "aliyah": 1, "heb": "וְכֶ֛סֶף פְּקוּדֵ֥י הָעֵדָ֖ה מְאַ֣ת כִּכָּ֑ר וְאֶ֩לֶף֩ וּשְׁבַ֨ע מֵא֜וֹת וַחֲמִשָּׁ֧ה וְשִׁבְעִ֛ים שֶׁ֖קֶל בְּשֶׁ֥קֶל הַקֹּֽדֶשׁ׃", "onk": "וּכְסַף מִנְיָנֵי כְנִשְׁתָּא מְאָה כִכְּרִין וְאֶלֶף וּשְׁבַע מְאָה וְשִׁבְעִין וְחַמְשָׁא <b>סִלְעִין בְּסִלְעֵי<\/b> קוּדְשָׁא:", "onk_en": "The silver (collected) by the community census (amounted to) one hundred kikar, and one thousand seven hundred and seventy-five shekel [<b>selaim<\/b>], (measured) by the [<b>selaim of the<\/b>] Sanctuary standard,", "pj": "וּכְסַף מִנְיָינֵי דִּבְנֵי יִשְרָאֵל דִּיהָבוּ בִּזְמַן דִּמְמַנּוּן משֶׁה גְּבַר פּוּרְקַן נַפְשֵׁיהּ מְאָה קַנְטְרִין וְאַלְפָא וּשְׁבַע מְאָה וְשׁוּבְעִין וְחָמֵשׁ סַלְעִין בְּסִלְעֵי קוּדְשָׁא", "pj_en": "And the silver of them who were numbered of the sons of Israel, who gave at the time when Mosheh numbered them, every one for the redemption of his soul, a hundred talents, and a thousand and seven hundred and seventy and five shekels, of the shekel of the sanctuary.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 26, "aliyah": 1, "heb": "בֶּ֚קַע לַגֻּלְגֹּ֔לֶת מַחֲצִ֥ית הַשֶּׁ֖קֶל בְּשֶׁ֣קֶל הַקֹּ֑דֶשׁ לְכֹ֨ל הָעֹבֵ֜ר עַל־הַפְּקֻדִ֗ים מִבֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָמַ֔עְלָה לְשֵׁשׁ־מֵא֥וֹת אֶ֙לֶף֙ וּשְׁלֹ֣שֶׁת אֲלָפִ֔ים וַחֲמֵ֥שׁ מֵא֖וֹת וַחֲמִשִּֽׁים׃", "onk": "תִּקְלָא לְגֻלְגַלְתָּא פַּלְגּוּת <b>סִלְעָא בְּסִלְעֵי<\/b> קוּדְשָׁא לְכֹל דְּעָבַר עַל מִנְיָנַיָּא מִבַּר עֶסְרִין שְׁנִין וּלְעֵלָּא לְשֵׁית מְאָה וּתְלָתָא אַלְפִין וַחֲמֵשׁ מְאָה וְחַמְשִׁין:", "onk_en": "one beka per person, (the equivalent of) a half-shekel[<b>sela<\/b>], (measured) by the [<b>selaim of the<\/b>] Sanctuary standard, from each one included in the census, from the age of twenty years and up, for six hundred and three thousand five hundred and fifty (men).", "pj": "דַּרְכְּמוֹנָא לְגֻלְגַלְתָּא פַּלְגוּת סִלְעָא בְּסִלְעָא דְקוּדְשָׁא לְכָל מַאן דְּעָבַר עַל מִנְיָינַיָא מִבַּר עֶשְרִין שְׁנִין וּלְעֵילָא לְשִׁית מְאָה וּתְלָתָא אַלְפִין וַחֲמֵשׁ מְאָה וְחַמְשִׁין", "pj_en": "A drachma for (each) head, a half shekel of the shekel of the sanctuary, for every one who passed to the numberments, from twenty years and upwards, for six hundred and three thousand and five hundred and fifty (men).", "tj": "", "tj_en": "", "rashi": "<b>בקע.<\/b> הוּא שֵׁם מִשְׁקָל שֶׁל מַחֲצִית הַשֶּׁקֶל:<br><br><b>לשש מאות אלף וגו'.<\/b> כָּךְ הָיוּ יִשְׂרָאֵל, וְכָךְ עָלָה מִנְיָנָם אַחַר שֶׁהוּקַם הַמִּשְׁכָּן בְּסֵפֶר וַיְדַבֵּר, וְאַף עַתָּה בְּנִדְבַת הַמִּשְׁכָּן כָּךְ הָיוּ, וּמִנְיַן חֲצָאֵי הַשְּׁקָלִים שֶׁל שֵׁשׁ מֵאוֹת אֶלֶף עוֹלֶה מְאַת כִּכָּר, כָּל אֶחָד שֶׁל שְׁלֹשֶׁת אֲלָפִים שְׁקָלִים, כֵּיצַד? שֵׁשׁ מֵאוֹת אֶלֶף חֲצָאִין הֲרֵי הֵן שְׁלֹשׁ מֵאוֹת אֶלֶף שְׁלֵמִים, הֲרֵי מְאַת כִּכָּר, וְהַשְּׁלֹשֶׁת אֲלָפִים וְה' מֵאוֹת וַחֲמִשִּׁים חֲצָאִים עוֹלִים אֶלֶף וְז' מֵאוֹת וְע\"ה שְׁקָלִים:", "rashi_en": "בקע (from בָּקַע to split) is the name given to a weight of half a shekel.<br><br>לשש מאות אלף וגו׳ FOR SIX HUNDRED THOUSAND [AND THREE THOUSAND etc.] — Thus were the Israelites in number, and thus did their number amount to after the Tabernacle was set up, as it is stated in the Book of Numbers (ch. II), and at this time, also, when they contributed toward the Tabernacle they were just as many (cf. Rashi on Exodus 30:16). The half-shekels of 600,000 amount to a hundred talents, each talents consisting of three thousand shekels (cf. v. 25). How is this? 600,000 half-shekels are 300,000 whole shekels, making one hundred talents and the remaining 3550 half-shekels make 1775 whole shekels, as stated in the text."}, {"ch": 38, "v": 27, "aliyah": 1, "heb": "וַיְהִ֗י מְאַת֙ כִּכַּ֣ר הַכֶּ֔סֶף לָצֶ֗קֶת אֵ֚ת אַדְנֵ֣י הַקֹּ֔דֶשׁ וְאֵ֖ת אַדְנֵ֣י הַפָּרֹ֑כֶת מְאַ֧ת אֲדָנִ֛ים לִמְאַ֥ת הַכִּכָּ֖ר כִּכָּ֥ר לָאָֽדֶן׃", "onk": "וַהֲוָה מְאָה כִּכְּרִין דִּכְסַף לְאַתָּכָא יָת סַמְכֵי קוּדְשָׁא וְיָת סַמְכֵי דְפָרֻכְתָּא מְאָה סַמְכִין לִמְאָה כִכְּרִין כִּכְּרָא לְסַמְכָא:", "onk_en": "One hundred kikar of this silver was (used) to cast the sockets for the mishkon and the sockets for the paroches (partition). One hundred sockets (were cast) from one hundred kikar, one kikar for each socket.", "pj": "וַהֲוָאָה מְאַת קַנְטִינְרִין דְּכַסְפָּא לַאֲתָבָא יַת חוֹמְרֵי קוּדְשָׁא וְיַת חוֹמְרֵי פַּרְגוֹדָא מְאָה חוֹמְרִין כָּל קְבֵיל קַנְטִינְרִין קַנְטִינַר לְחוֹמְרָא", "pj_en": "And there were a hundred talents of silver for casting the bases of the sanctuary, and the bases of the veil, a hundred bases, answering to the talents, a talent for a base.", "tj": "", "tj_en": "", "rashi": "<b>לצקת.<\/b> כְּתַרְגּוּמוֹ לְאַתָּכָא:<br><br><b>את אדני הקדש.<\/b> שֶׁל קַרְשֵׁי הַמִּשְׁכָּן, שֶהֵם מ\"ח קְרָשִׁים וְלָהֶן צ\"ו אֲדָנִים, וְאַדְנֵי הַפָּרֹכֶת אַרְבָּעָה, הֲרֵי מֵאָה, וְכָל שְׁאָר הָאֲדָנִים נְחֹשֶׁת כָּתוּב בָּהֶם:", "rashi_en": "לצקת means as the Targum has it: לאתכא, TO CAST.<br><br>את אדני הקדש THE SOCKETS OF THE SANCTUARY — i. e. of the boards of the Tabernacle (the Sanctuary) which were forty-eight boards, and for these ninety-six sockets were required. The sockets for the partition vail were four in number, so we have altogether one hundred. As regards all the other sockets (those of the enclosure and of the vail at its entrance) they are not taken into account here, because “copper” was written concerning them (Scripture prescribes that they were to be of copper)."}, {"ch": 38, "v": 28, "aliyah": 1, "heb": "וְאֶת־הָאֶ֜לֶף וּשְׁבַ֤ע הַמֵּאוֹת֙ וַחֲמִשָּׁ֣ה וְשִׁבְעִ֔ים עָשָׂ֥ה וָוִ֖ים לָעַמּוּדִ֑ים וְצִפָּ֥ה רָאשֵׁיהֶ֖ם וְחִשַּׁ֥ק אֹתָֽם׃", "onk": "וְיָת אַלְפָא וּשְׁבַע מְאָה וְשִׁבְעִין וְחַמְשָׁא עֲבַד וָוִין לְעַמּוּדַיָּא וְחִפָּא רֵישֵׁיהוֹן וְכַבֵּשׁ יָתְהוֹן:", "onk_en": "Of the (remaining) one thousand seven hundred and seventy-five (shekel) he made hooks for the pillars, overlaid their caps and made bands for them.", "pj": "וְיַת אַלְפָא וּשְׁבַע מְאָה וְשַׁבְעִין וַחֲמֵשׁ סַלְעִין עֲבַד וָוִין לַעֲמוּדַיָא וַחֲפָא רֵישֵׁיהוֹן וּכְבַשׁ יַתְהוֹן", "pj_en": "And with the thousand and seven hundred and seventy and five shekels, he made hooks for the pillars, and the overlaying of their capitals and their rods.", "tj": "", "tj_en": "", "rashi": "<b>וצפה ראשיהם.<\/b> שֶׁל עַמּוּדִים מֵהֶן, שֶׁבְּכֻלָּן כְּתִיב וְצִפּוּי רָאשֵׁיהֶם וַחֲשֻׁקֵיהֶם כָּסֶף:", "rashi_en": "וצפה ראשיהם [HE MADE HOOKS FOR THE COLUMNS] AND OVERLAID THEIR TOPS – the tops of the columns (not of the hooks) with them (the 1775 shekels of silver), for it is said with regard of all of them (the columns of the enclosure as well as of those of the vail at the entrance) (v. 19) “and the overlaying of their chapiters and their fillets were of silver”."}, {"ch": 38, "v": 29, "aliyah": 1, "heb": "וּנְחֹ֥שֶׁת הַתְּנוּפָ֖ה שִׁבְעִ֣ים כִּכָּ֑ר וְאַלְפַּ֥יִם וְאַרְבַּע־מֵא֖וֹת שָֽׁקֶל׃", "onk": "וּנְחָשָׁא דַאֲרָמוּתָא שִׁבְעִין כִּכְּרִין וּתְרֵין אַלְפִין וְאַרְבַּע מְאָה <b>סִלְעִין<\/b>:", "onk_en": "The copper (donated as) a wave offering (amounted to) seventy kikar, and two thousand four hundred shekel [<b>selaim<\/b>],", "pj": "וּנְחָשָׁא דְאַרָמוּתָא שַׁבְעִין קַנְטִירִין וּתְרֵין אַלְפִין וְאַרְבַּע מְאָה סִלְעִין", "pj_en": "And the brass of the oblation was seventy talents, and two thousand and four hundred shekels.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 30, "aliyah": 1, "heb": "וַיַּ֣עַשׂ בָּ֗הּ אֶת־אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְאֵת֙ מִזְבַּ֣ח הַנְּחֹ֔שֶׁת וְאֶת־מִכְבַּ֥ר הַנְּחֹ֖שֶׁת אֲשֶׁר־ל֑וֹ וְאֵ֖ת כׇּל־כְּלֵ֥י הַמִּזְבֵּֽחַ׃", "onk": "וַעֲבַד בַּהּ יָת סַמְכֵי תְּרַע מַשְׁכַּן זִמְנָא וְיָת מַדְבְּחָא דִנְחָשָׁא וְיָת סְרָדָא דִנְחָשָׁא דִּי לֵיהּ וְיָת כָּל מָנֵי מַדְבְּחָא:", "onk_en": "from which he made sockets for the entrance of the Tent of Meeting, the copper altar with its copper grate, all the altar’s vessels,", "pj": "וְעָבַד בָּהּ יַת חוֹמְרֵי תְּרַע מַשְׁכַּן זִימְנָא וְיַת מַדְבְּחָא דִנְחָשָׁא וְיַת קַנְקַלֵי דִנְחָשָׁא דִילֵיהּ וְיַת כָּל מָנֵי מַדְבְּחָא", "pj_en": "And he made with it the bases of the gate of the tabernacle of ordinance, and the brasen altar, and the brasen grate for it, and all the vessels of the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 38, "v": 31, "aliyah": 1, "heb": "וְאֶת־אַדְנֵ֤י הֶֽחָצֵר֙ סָבִ֔יב וְאֶת־אַדְנֵ֖י שַׁ֣עַר הֶחָצֵ֑ר וְאֵ֨ת כׇּל־יִתְדֹ֧ת הַמִּשְׁכָּ֛ן וְאֶת־כׇּל־יִתְדֹ֥ת הֶחָצֵ֖ר סָבִֽיב׃", "onk": "וְיָת סַמְכֵי דְדַרְתָּא סְחוֹר סְחוֹר וְיָת סַמְכֵי תְּרַע דַּרְתָּא וְיָת כָּל סִכֵּי מַשְׁכְּנָא וְיָת כָּל סִכֵּי דַרְתָּא סְחוֹר סְחוֹר:", "onk_en": "the sockets around the enclosure, the sockets for the entrance of the enclosure, all the stakes for the mishkon, and all the stakes around the enclosure.", "pj": "וְיַת חוֹמְרֵי דָרְתָא חֲזוֹר חֲזוֹר וְיַת חוֹמְרֵי תְרַע דָּרְתָא וְיַת כָּל מַתְחֵי מַשְׁכְּנָא וְיַת כָּל מַתְחֵי דָרְתָא חֲזוֹר חֲזוֹר", "pj_en": "And the bases of the court round about, and the bases of the gate of the court, and all the pins of the tabernacle, and all the pins of the court round about.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 1, "aliyah": 1, "heb": "וּמִן־הַתְּכֵ֤לֶת וְהָֽאַרְגָּמָן֙ וְתוֹלַ֣עַת הַשָּׁנִ֔י עָשׂ֥וּ בִגְדֵי־שְׂרָ֖ד לְשָׁרֵ֣ת בַּקֹּ֑דֶשׁ וַֽיַּעֲשׂ֞וּ אֶת־בִּגְדֵ֤י הַקֹּ֙דֶשׁ֙ אֲשֶׁ֣ר לְאַהֲרֹ֔ן כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמִן תִּכְלָא וְאַרְגְּוָנָא וּצְבַע זְהוֹרִי עֲבָדוּ לְבוּשֵׁי שִׁמּוּשָׁא לְשַׁמָּשָׁא בְקוּדְשָׁא וַעֲבָדוּ יָת לְבוּשֵׁי קוּדְשָׁא דִּי לְאַהֲרֹן כְּמָא דִּי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "From the greenish-blue wool, dark red wool, and crimson [<b>colored<\/b>] wool, they made garments of distinction [<b>service<\/b>] for service in the Sanctuary, and they made sacred garments for Aharon, just as Adonoy commanded Moshe.", "pj": "וּמִן תִּכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי עֲבָדוּ לְבוּשֵׁי שִׁמּוּשָׁא לְשַׁמָּשָׁא בְּקוּדְשָׁא וַעֲבָדוּ יַת לְבוּשֵׁי קוּדְשָׁא דִי לְאַהֲרן כַּהֲנָא הֵי כְּמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "And of the hyacinth, and purple, and crimson, they made the vestments of ministration, to minister in the sanctuary. And they made the holy vestments of Aharon the priest, as the Lord had commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ומן התכלת והארגמן וגו'.<\/b> שֵׁשׁ לֹא נֶאֱמַר כָּאן, וּמִכָּאן אֲנִי אוֹמֵר שֶׁאֵין בִּגְדֵי שְׂרָד הַלָּלוּ בִּגְדֵי כְהֻנָּה, שֶׁבְּבִגְדֵי כְהֻנָּה הָיָה שֵׁשׁ, אֶלָּא הֵם בְּגָדִים שֶׁמְּכַסִּים בָּהֶם כְּלֵי הַקֹּדֶשׁ בִּשְׁעַת סִלּוּק מַסָּעוֹת, שֶׁלֹּא הָיָה בָהֶם שֵׁשׁ:", "rashi_en": "ומן התכלת והארגמן וגו׳ AND OF THE BLUE PURPLE AND OF THE RED PURPLE etc. — But there is no mention of linen here. From this fact I derive (cf. Rashi on Exodus 31:10) that these בגדי שרד mentioned here were not identical with the garments of the priests, for there was linen in the garments of the priests. But these were the cloths with which they covered up the holy vessels at the time of removing and packing up the articles in the Tabernacle when they set out on their journeyings which indeed had no linen in them."}, {"ch": 39, "v": 2, "aliyah": 2, "heb": "וַיַּ֖עַשׂ אֶת־הָאֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֥שׁ מׇשְׁזָֽר׃", "onk": "וַעֲבַד יָת אֵפוֹדָא דַּהֲבָא תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר:", "onk_en": "He made the eiphod out of gold, greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, and twisted, fine linen.", "pj": "וְעָבַד יַת אֵיפוֹדָא דְדַהֲבָא תִּכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ שְׁזִיר", "pj_en": "And he made the ephoda of gold, hyacinth, and purple, and fine linen twined.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 3, "aliyah": 2, "heb": "וַֽיְרַקְּע֞וּ אֶת־פַּחֵ֣י הַזָּהָב֮ וְקִצֵּ֣ץ פְּתִילִם֒ לַעֲשׂ֗וֹת בְּת֤וֹךְ הַתְּכֵ֙לֶת֙ וּבְת֣וֹךְ הָֽאַרְגָּמָ֔ן וּבְת֛וֹךְ תּוֹלַ֥עַת הַשָּׁנִ֖י וּבְת֣וֹךְ הַשֵּׁ֑שׁ מַעֲשֵׂ֖ה חֹשֵֽׁב׃", "onk": "וְרַדִּידוּ יָת טַסֵּי דַהֲבָא וְקַצִּיצוּ חוּטִין לְמֶעְבַּד בְּגוֹ תִכְלָא וּבְגוֹ אַרְגְּוָנָא וּבְגוֹ <b>צְבַע<\/b> זְהוֹרִי וּבְגוֹ בוּצָא עוֹבַד אָמָּן:", "onk_en": "They beat the plates of gold and cut (them) into threads to work them into the greenish-blue wool, into the dark red wool, into the crimson [<b>colored<\/b>] wool, and into the fine linen, the work of a craftsman.", "pj": "וְרַדִּידוּ יַת טַסֵי דְדַהֲבָא וְקָטָעוּ יַתְהוֹן שֶׁזְרִין לְמֶעְבַּד בְּגוֹ תִכְלָא וּבְגוֹ אַרְגְּוָונָא וּבְגוֹ צְבַע זְהוֹרֵי וּבְגוֹ בוּצָא עוֹבַד אוּמָן", "pj_en": "And they beat out the plates of gold, and cut them into threads to inwork with the hyacinth, and the purple, and the crimson, and the fine linen, the work of the artificer.", "tj": "", "tj_en": "", "rashi": "<b>וירקעו.<\/b> כְּמוֹ לְרֹקַע הָאָרֶץ (תהילים קל\"ו), כְּתַרְגּוּמוֹ וּרְדִידוּ, טַסִּין הָיוּ מְרַדְּדִין מִן הַזָּהָב, אשטנ\"דרא בְּלַעַז, טַסִּין דַּקּוֹת. כָּאן הוּא מְלַמֶּדְךָ הֵיאַךְ הָיוּ טוֹוִין אֶת הַזָּהָב עִם הַחוּטִין, מְרַדְּדִים טַסִּין דַּקִּין, וְקוֹצְצִין מֵהֶן פְּתִילִים לְאֹרֶךְ הַטַּס – לַעֲשׂוֹת אוֹתָן פְּתִילִים תַּעֲרֹבֶת עִם כָּל מִין וָמִין בַּחֹשֶׁן וְאֵפוֹד שֶׁנֶּ' בָּהֶן זָהָב, חוּט אֶחָד שֶׁל זָהָב עִם ו' חוּטִין שֶׁל תְּכֵלֶת, וְכֵן עִם כָּל מִין וָמִין, שֶׁכָּל הַמִּינִים חוּטָן כָּפוּל ו', וְהַזָּהָב חוּט שְׁבִיעִי עִם כָּל אֶחָד וְאֶחָד:", "rashi_en": "וירקעו AND THEY DID EXTEND — וירקעו is of the same root and meaning as, (Psalms 136:6) “To Him that stretcheth out (לרקע) the earth”. Render וירקעו as the Targum does: ורדידו, they extended by beating. Plates did they beat out of the gold; in old French estendre — to extend into thin plates. Here it informs you how they wove the gold together with the woollen threads. They beat out the thin plates and from them they cut threads along the length of the plates to make of these threads a mixture (to mix them) with each of the different kind of woolen threads in the ephod and the breast-plate in regard to which gold is mentioned in this connection. One thread of gold they intertwined with six threads of blue purple, and so with each kind of wool. For all the materials had their threads six-fold, and the gold formed the seventh with each of them (cf. Yoma 72a)."}, {"ch": 39, "v": 4, "aliyah": 2, "heb": "כְּתֵפֹ֥ת עָֽשׂוּ־ל֖וֹ חֹבְרֹ֑ת עַל־שְׁנֵ֥י <span class=\"mam-kq\"><span class=\"mam-kq-k\">(קצוותו)<\/span> <span class=\"mam-kq-q\">[קְצוֹתָ֖יו]<\/span><\/span> חֻבָּֽר׃", "onk": "כַּתְפָּן עֲבָדוּ לֵיהּ מְלַפְּפָן עַל תְּרֵין <b>סִטְרוֹהִי<\/b> יִתְלָפֵף:", "onk_en": "They made shoulder straps attached to it, attached at its two corners [<b>sides<\/b>].", "pj": "כַּתְפִין עָבְדוּ לֵיהּ מְלַפְפָן עַל תְּרֵין צִטְרוֹי מִתְלָפֵף", "pj_en": "Shoulderpieces made they for it conjoined; upon its two sides were they conjoined.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 5, "aliyah": 2, "heb": "וְחֵ֨שֶׁב אֲפֻדָּת֜וֹ אֲשֶׁ֣ר עָלָ֗יו מִמֶּ֣נּוּ הוּא֮ כְּמַעֲשֵׂ֒הוּ֒ זָהָ֗ב תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֣שׁ מׇשְׁזָ֑ר כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְהֶמְיַן <b>תִּקּוּנֵיהּ<\/b> דִּי עֲלוֹהִי מִנֵּיהּ הוּא כְּעוֹבָדוֹהִי דַּהֲבָא תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר כְּמָא דִי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "The eiphod’s belt [<b>that enhances it<\/b>] which was on it, was woven with it in the same manner (as the eiphod) (with) gold, greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, and twined, fine linen. just as Adonoy commanded.", "pj": "וְהֵמְיַן טִיכוּסֵיהּ דַּעֲלוֹי מִנֵּיהּ הוּא הֵי כְּעוֹבָדוֹי דַהֲבָא תִּכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ שְׁזִיר הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And its ordered band that was upon it was of the same; it was according to its work, of gold, hyacinth, and purple, and crimson, and fine linen twined, even as the Lord had commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 6, "aliyah": 2, "heb": "וַֽיַּעֲשׂוּ֙ אֶת־אַבְנֵ֣י הַשֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל־שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וַעֲבָדוּ יָת אַבְנֵי בוּרְלָא מְשַׁקְּעָן מְרַמְּצָן דִּדְהָב גְּלִיפָן <b>כְּתַב מְפָרַשׁ<\/b> עַל שְׁמָהַת בְּנֵי יִשְׂרָאֵל:", "onk_en": "They placed the shoham stones in gold settings, They (the stones) were engraved like the engraving of a signet (ring) [<b>with script that is clear<\/b>], with the names of the B’nei Yisrael.", "pj": "וַעֲבָדוּ יַת מַרְגַלְוָן דְּבוּרְלָת חֲלָא מְשַׁקְעָן מְרַמְצָן גְּלִיפָן כְּתַב חָקִיק מְפָרַשׁ עַל שְׁמָהַת בְּנֵי יִשְרָאֵל", "pj_en": "And they wrought the jewels of onyx, enchased, set, inwrought, graved with graven writing, setting forth the names of the sons of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 7, "aliyah": 2, "heb": "וַיָּ֣שֶׂם אֹתָ֗ם עַ֚ל כִּתְפֹ֣ת הָאֵפֹ֔ד אַבְנֵ֥י זִכָּר֖וֹן לִבְנֵ֣י יִשְׂרָאֵ֑ל כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְשַׁוִּי יָתְהוֹן עַל כִּתְפָּא דְאֵפוֹדָא אַבְנֵי דוּכְרָנָא לִבְנֵי יִשְׂרָאֵל כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "He set them on the shoulder straps of the eiphod, as remembrance stones for the B’nei Yisrael, just as Adonoy commanded Moshe.", "pj": "וְשַׁוִי יַתְהוֹן עַל כִּתְפֵי אֵפוֹדָא אַבְנֵי דוּכְרָנָא לִבְנֵי יִשְרָאֵל הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And he set them on the shoulders of the ephoda, as stones of memorial for the sons of Israel, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 8, "aliyah": 2, "heb": "וַיַּ֧עַשׂ אֶת־הַחֹ֛שֶׁן מַעֲשֵׂ֥ה חֹשֵׁ֖ב כְּמַעֲשֵׂ֣ה אֵפֹ֑ד זָהָ֗ב תְּכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י וְשֵׁ֥שׁ מׇשְׁזָֽר׃", "onk": "וַעֲבַד יָת חוּשְׁנָא עוֹבַד אָמָּן כְּעוֹבָדֵי אֵפוֹדָא דַּהֲבָא תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי וּבוּץ שְׁזִיר:", "onk_en": "He made the breastplate the work of a craftsman, in the same manner the eiphod was made, (out of) gold, greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool and twined, fine linen.", "pj": "וַעֲבַד יַת חוּשְׁנָא עוֹבַד אוּמַן הֵי כְעוֹבַד אֵיפוֹדָא דְדַהֲבָא תִּכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי וּבוּץ שְׁזִיר", "pj_en": "And he made the Breastplate, the work of the artificer, according to the work of the ephoda, of gold, hyacinth, and purple, and crimson, and fine linen twined.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 9, "aliyah": 2, "heb": "רָב֧וּעַ הָיָ֛ה כָּפ֖וּל עָשׂ֣וּ אֶת־הַחֹ֑שֶׁן זֶ֧רֶת אׇרְכּ֛וֹ וְזֶ֥רֶת רׇחְבּ֖וֹ כָּפֽוּל׃", "onk": "מְרַבַּע הֲוָה עֵיף עֲבָדוּ יָת חוּשְׁנָא זֶרְתָּא אֻרְכֵּיהּ וְזֶרְתָּא פְתָיֵהּ עֵיף:", "onk_en": "They made the breastplate a doubled square, a span in its length and a span in its width.", "pj": "מְרַבַּע הֲוָה עֵיף עָבָדוּ יַת חוּשְׁנָא זַרְתָּא אוּרְכֵּיהּ וְזַרְתָּא פּוּתְיֵהּ עֵיף", "pj_en": "Foursquare was it; doubled they made the breastplate, a span its length, and a span its breadth.", "tj": "פְּשַׁךְ אוּרְכֵּיהּ וּפְשַׁךְ פּוּתְיֵהּ כְּפִיל:", "tj_en": "A palm its length, and a palm its breadth, doubled.", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 10, "aliyah": 2, "heb": "וַיְמַ֨לְאוּ־ב֔וֹ אַרְבָּעָ֖ה ט֣וּרֵי אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּבָרֶ֔קֶת הַטּ֖וּר הָאֶחָֽד׃", "onk": "וְאַשְׁלִימוּ בֵיהּ אַרְבְּעָא סִדְרֵי אֶבֶן <b>טָבָא<\/b> סִדְרָא קַדְמָאָה סַמְקָן יַרְקָן וּבַרְקָן סִדְרָא <b>חָד<\/b>:", "onk_en": "They filled them (the breastplate settings) with four rows of [<b>precious<\/b>] stones: The first row: An odem (ruby), pitda (topaz), and barekes (emerald), (was placed on) the first row [<b>one<\/b>].", "pj": "וְאַשְׁלִימוּ בֵּיהּ אַרְבְּעָא סְדָרִין מַרְגַלְיַן טָבִן כָּל קְבֵיל אַרְבַּעַת טְרִיגוֹנִין דְּעַלְמָא סִדְרָא קַמְיָיתָא סַמּוּקְתָּא יְרוּקְתָא וּבַרְקָתָא סִדְרָא חָד וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא רְאוּבֵן שִׁמְעוֹן וְלֵוִי", "pj_en": "And they filled it with four rows of precious gems, (margalyan,) corresponding with the four corners of the world. The first row, carnelian, topaz, and carbuncle, row one: and upon them were engraven and expressed the names of three tribes, Reuben, Shimeon, and Levi.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 11, "aliyah": 2, "heb": "וְהַטּ֖וּר הַשֵּׁנִ֑י נֹ֥פֶךְ סַפִּ֖יר וְיָהֲלֹֽם׃", "onk": "וְסִדְרָא תִּנְיָנָא אִזְמָרַגְדִּין שַׁבְזֵיז וְסַבְהֲלוֹם:", "onk_en": "The second row: nofech (carbuncle), sapphire, and yahalom (diamond).", "pj": "וְשׁוּם סִדְרָא תִּנְיָנָא אִיזְמוֹרַד וְסִפִּירִינוּן וְכַדְכּוֹדִין וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא יְהוּדָה דָן וְנַפְתָּלִי", "pj_en": "And the name of the second row, smarag, and sapphire, and chalcedony: and upon them was inscribed and set forth the name of three tribes, Jehudah, Dan, and Naphtali.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 12, "aliyah": 2, "heb": "וְהַטּ֖וּר הַשְּׁלִישִׁ֑י לֶ֥שֶׁם שְׁב֖וֹ וְאַחְלָֽמָה׃", "onk": "וְסִדְרָא תְּלִיתָאָה קַנְכֵּרֵי טַרְקְיָא וְעֵין עֶגְלָא:", "onk_en": "The third row: leshem (opal), shevo (agate), and achlomo (amethyst).", "pj": "וְשׁוּם סִידְרָא תְּלִיתָא קַנְכַּרִין טִרְקִין וְעֵין עֵגֶל וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא גָד אָשֵׁר וְיִשָשׁכָר", "pj_en": "And the name of the third row, ligure, agate, and amethyst: and upon them inscribed and set forth the name of three tribes, Gad, Asher, and Issakar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 13, "aliyah": 2, "heb": "וְהַטּוּר֙ הָֽרְבִיעִ֔י תַּרְשִׁ֥ישׁ שֹׁ֖הַם וְיָשְׁפֵ֑ה מֽוּסַבֹּ֛ת מִשְׁבְּצֹ֥ת זָהָ֖ב בְּמִלֻּאֹתָֽם׃", "onk": "וְסִדְרָא רְבִיעָאָה כְּרוּם יַמָּא וּבוּרְלָא וּפַנְטְרֵי מְשַׁקְּעָן מְרַמְּצָן דִּדְהַב בְּאַשְׁלָמוּתְהוֹן:", "onk_en": "The fourth row: tarshish (chrysolite), shoham (onyx), and yoshfei (jasper). (They were) placed in gold settings in their fullness.", "pj": "וְשׁוּם סִידְרָא רְבִיעָאָה כְּרוֹם יַמָא רַבָּא וּבוּרְלַת חֲלָא וּמַרִגְנִית אַפַנְטוּרִין וַעֲלֵיהוֹן חָקִיק וּמְפָרַשׁ שְׁמָהַת תְּלַת שִׁבְטַיָא זְבוּלֻן יוֹסֵף וּבִנְיָמִין מְשַׁקְעָן מְרַמְצַן בִּדְהַב בְּאַשְׁלָמוּתְהוֹן", "pj_en": "And the name of the fourth row, chrysolite, and onyx, and jasper: and upon them inscribed and set forth the name of three tribes, Zebulon, Joseph, and Benjamin: enchased and set in gold in their infillings.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 14, "aliyah": 2, "heb": "וְ֠הָאֲבָנִ֠ים עַל־שְׁמֹ֨ת בְּנֵי־יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל־שְׁמֹתָ֑ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל־שְׁמ֔וֹ לִשְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט׃", "onk": "וְאַבְנַיָּא עַל שְׁמָהַת בְּנֵי יִשְׂרָאֵל אִנִּין תַּרְתֵּי עֶסְרֵי עַל שְׁמָהָתְהוֹן <b>כְּתַב מְפָרַשׁ כִּגְלוֹף דְּעִזְקָא<\/b> גְּבַר עַל שְׁמֵיהּ לִתְרֵין עֲסַר שִׁבְטִין:", "onk_en": "These stones had the names of the B’nei Yisrael, twelve of them by their names, each one’s name [<b>written in script that is clear like they engrave in a signet ring<\/b>] engraved as on a signet (ring), representing the twelve tribes.", "pj": "וּמַרְגְּלִיתָא עַל שְׁמָהַת בְּנֵי יִשְרָאֵל תְּרֵיסְרֵי עַל שְׁמָהַתְהוֹן כְּתַב גָּלִיף חָקִיק וּמְפָרַשׁ הֵי כִגְלִיף דְּעִזְקָא גְבַר מַרְגְּלִיתֵיהּ עַל שְׁמֵיהּ לִתְרֵיסַר שִׁבְטַיָא", "pj_en": "And the gems were according to the names of the sons of Israel, twelve, according to their names; the writing engraven, inscribed, and set forth as the engraving of a ring; each man's gem according to his name in the twelve tribes.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 15, "aliyah": 2, "heb": "וַיַּעֲשׂ֧וּ עַל־הַחֹ֛שֶׁן שַׁרְשְׁרֹ֥ת גַּבְלֻ֖ת מַעֲשֵׂ֣ה עֲבֹ֑ת זָהָ֖ב טָהֽוֹר׃", "onk": "וַעֲבָדוּ עַל חוּשְׁנָא תִּכִּין מְתַחְמָן עוֹבַד גְּדִילוּ דְּהַב דְּכֵי:", "onk_en": "They made twisted end-chains for the breastplate, braided work of pure gold.", "pj": "וַעֲבָדוּ עַל חוּשְׁנָא שַׁלְשְׁלַן מְתַחֲמָן עוֹבַד קְלִיעָא דִדְהַב דְּכֵי", "pj_en": "And they made upon the breastplate wreathen chains, entwined work, of pure gold.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 16, "aliyah": 2, "heb": "וַֽיַּעֲשׂ֗וּ שְׁתֵּי֙ מִשְׁבְּצֹ֣ת זָהָ֔ב וּשְׁתֵּ֖י טַבְּעֹ֣ת זָהָ֑ב וַֽיִּתְּנ֗וּ אֶת־שְׁתֵּי֙ הַטַּבָּעֹ֔ת עַל־שְׁנֵ֖י קְצ֥וֹת הַחֹֽשֶׁן׃", "onk": "וַעֲבָדוּ תַּרְתֵּין מְרַמְּצָן דִּדְהַב וְתַרְתֵּין עִזְקַן דִּדְהָב וִיהָבוּ יָת תַּרְתֵּין עִזְקָתָא עַל תְּרֵין <b>סִטְרֵי<\/b> חוּשְׁנָא:", "onk_en": "They made two gold settings, and two gold rings. They set the two gold rings at the two (upper) corners [<b>sides<\/b>] of the breastplate.", "pj": "וְעָבָדוּ תַּרְתֵּין מְרַמְצִין דִּדְהַב וְתַרְתֵּין עִזְקַן דִּדְהַב וִיהָבוּ יַת תַּרְתֵּין עִזְקָתָא עַל תְּרֵין צִטְרֵי חוּשְׁנָא", "pj_en": "And they made two sockets of gold, and two golden rings, and set the two rings on the two sides of the breastplate.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 17, "aliyah": 2, "heb": "וַֽיִּתְּנ֗וּ שְׁתֵּי֙ הָעֲבֹתֹ֣ת הַזָּהָ֔ב עַל־שְׁתֵּ֖י הַטַּבָּעֹ֑ת עַל־קְצ֖וֹת הַחֹֽשֶׁן׃", "onk": "וִיהָבוּ תַּרְתֵּין גְּדִילָתָא דִּדְהַב עַל תַּרְתֵּין עִזְקָתָא עַל <b>סִטְרֵי<\/b> חוּשְׁנָא:", "onk_en": "They put (attached) the two gold-braided chains on the two rings, at the corners [<b>sides<\/b>] of the breastplate.", "pj": "וִיהָבוּ תַּרְתֵּין קְלִיעָן דִּדְהַב עַל תַּרְתֵּין עִיזְקָתָא עַל צִטְרֵי חוּשְׁנָא", "pj_en": "And they put the two entwinements of gold within the two rings upon the two sides of the breastplate,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 18, "aliyah": 2, "heb": "וְאֵ֨ת שְׁתֵּ֤י קְצוֹת֙ שְׁתֵּ֣י הָֽעֲבֹתֹ֔ת נָתְנ֖וּ עַל־שְׁתֵּ֣י הַֽמִּשְׁבְּצֹ֑ת וַֽיִּתְּנֻ֛ם עַל־כִּתְפֹ֥ת הָאֵפֹ֖ד אֶל־מ֥וּל פָּנָֽיו׃", "onk": "וְיָת תַּרְתֵּין גְּדִילָן <b>דִּעַל תַּרְתֵּין סִטְרוֹהִי<\/b> יְהָבוּ עַל תַּרְתֵּין מְרַמְּצָתָא וִיהָבֻנּוּן עַל כַּתְפֵי אֵפוֹדָא לָקֳבֵל אַפּוֹהִי:", "onk_en": "The two ends of the two braided chains [<b>that are on its two sides<\/b>] they put (attached) to the two settings, and placed them on the shoulder straps of the eiphod toward the front.", "pj": "וְיַת תַּרְתֵּין קְלִיעָן דִּמְסַדְרָן עַל תְּרֵין צִטְרוֹי יְהָבוּ עַל תַּרְתֵּין מְרַמְצָתָא וִיהָבִינוּן עַל כִּתְפֵי אֵיפוֹדָא כָּל קְבֵיל אַנְפּוֹי", "pj_en": "and the two chains that were arranged on the two sides they fastened upon the two sockets, and set them on the shoulders of the ephoda, toward its front.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 19, "aliyah": 2, "heb": "וַֽיַּעֲשׂ֗וּ שְׁתֵּי֙ טַבְּעֹ֣ת זָהָ֔ב וַיָּשִׂ֕ימוּ עַל־שְׁנֵ֖י קְצ֣וֹת הַחֹ֑שֶׁן עַל־שְׂפָת֕וֹ אֲשֶׁ֛ר אֶל־עֵ֥בֶר הָאֵפֹ֖ד בָּֽיְתָה׃", "onk": "וַעֲבָדוּ תַּרְתֵּין עִזְקַן דִּדְהַב וְשַׁוִּיאוּ עַל תְּרֵין <b>סִטְרֵי<\/b> חוּשְׁנָא עַל סִפְתֵיהּ דִּי לְעִבְרָא דְאֵפוֹדָא מִלְּגָיו:", "onk_en": "They made two gold rings and set them on the two (lower) corners [<b>sides<\/b>] of the breastplate, on its edge that was on the inner side of the eiphod.", "pj": "וַעֲבָדוּ תַּרְתֵּין עִזְקַן דְּהַב וְשַׁוִּיאוּ עַל תַּרְתֵּין סִטְרֵי חוּשְׁנָא עַל שִפְתֵיהּ דִּלְעִבְרָא דְאֵפוֹדָא לְגֵיו", "pj_en": "And they made two golden rings and set them upon the two sides of the breastplate, upon its edge, that was on the border of the ephod inward.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 20, "aliyah": 2, "heb": "וַֽיַּעֲשׂוּ֮ שְׁתֵּ֣י טַבְּעֹ֣ת זָהָב֒ וַֽיִּתְּנֻ֡ם עַל־שְׁתֵּי֩ כִתְפֹ֨ת הָאֵפֹ֤ד מִלְּמַ֙טָּה֙ מִמּ֣וּל פָּנָ֔יו לְעֻמַּ֖ת מַחְבַּרְתּ֑וֹ מִמַּ֕עַל לְחֵ֖שֶׁב הָאֵפֹֽד׃", "onk": "וַעֲבָדוּ תַּרְתֵּין עִזְקַן דִּדְהַב וִיהָבֻנּוּן עַל תַּרְתֵּין כִּתְפֵי אֵפוֹדָא מִלְּרַע מִלָּקֳבֵל אַפּוֹהִי לָקֳבֵל בֵּית לוֹפֵי מֵעִלָּוֵי לְהֶמְיַן אֵפוֹדָא:", "onk_en": "They made two gold rings and placed them on the two shoulder straps of the eiphod, on the bottom, toward the front, against where they were joined, above the eiphod’s belt.", "pj": "וַעֲבָדוּ תַּרְתֵּין עִזְקָן דְּהַב וְסַדְרִינוּן עַל תְּרֵין כִּתְפֵי אֵיפוֹדָא מִלְרַע מִלְקָבֵיל אַנְפּוֹי כָּל קְבֵיל בֵּית לוֹפֵי מֵעִילַוֵי לְהֶמְיַין אֵיפוֹדָא", "pj_en": "And they made two golden rings, and arranged them upon the two shoulders of the ephod below, toward its front, over against the place of conjoinment above the band of the ephod,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 21, "aliyah": 2, "heb": "וַיִּרְכְּס֣וּ אֶת־הַחֹ֡שֶׁן מִטַּבְּעֹתָיו֩ אֶל־טַבְּעֹ֨ת הָאֵפֹ֜ד בִּפְתִ֣יל תְּכֵ֗לֶת לִֽהְיֹת֙ עַל־חֵ֣שֶׁב הָאֵפֹ֔ד וְלֹֽא־יִזַּ֣ח הַחֹ֔שֶׁן מֵעַ֖ל הָאֵפֹ֑ד כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְיַחֲדוּן יָת חוּשְׁנָא מְעִזְקָתֵיהּ לְעִזְקְתָא דְאֵפוֹדָא בְּחוּטָא דִתְכֶלְתָּא לְמֵהֶוֵי עַל הֶמְיַן אֵפוֹדָא וְלָא יִתְפָּרֵק חוּשְׁנָא מֵעִלָּוֵי אֵפוֹדָא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "They bound the (lower) rings of the breastplate to the (lower) rings of the eiphod with a cord of greenish-blue wool, so that it (the breastplate) remained against the eiphod’s belt, so that the breastplate did not move from the eiphod, just as Adonoy commanded Moshe.", "pj": "וְטָכִיסוּ יַת חוּשְׁנָא מֵעִזְקָתָא לְעִזְקַת אֵיפוֹדָא בִּשְׁזִיר תִּכְלָא לְמֶהֱוֵי אָדִיק עַל הֶמְיַין אֵיפוֹדָא וְלָא יִתְפְּרַק חוּשְׁנָא מֵעִילַוֵי אֵיפוֹדָא הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "and fitted the breastplate by its rings to the rings of the ephod by a ribbon of hyacinth, that it might adhere to the band of the ephod, and that the breastplate be not loosened from being upon the ephod, as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 22, "aliyah": 3, "heb": "וַיַּ֛עַשׂ אֶת־מְעִ֥יל הָאֵפֹ֖ד מַעֲשֵׂ֣ה אֹרֵ֑ג כְּלִ֖יל תְּכֵֽלֶת׃", "onk": "וַעֲבַד יָת מְעִילָא דְאֵפוֹדָא עוֹבַד מָחֵי גְּמִיר תִּכְלָא:", "onk_en": "He made the robe of the eiphod of woven work, completely out of greenish-blue wool.", "pj": "וַעֲבַד יַת מִנְטַר מְעִילָא עוֹבַד גַּרְדֵי שְׁזִיר תִּכְלָא", "pj_en": "And he made the mantle-robe, a work of the weaver, of twined thread of hyacinth.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 23, "aliyah": 3, "heb": "וּפִֽי־הַמְּעִ֥יל בְּתוֹכ֖וֹ כְּפִ֣י תַחְרָ֑א שָׂפָ֥ה לְפִ֛יו סָבִ֖יב לֹ֥א יִקָּרֵֽעַ׃", "onk": "וּפוּם מְעִילָא כָּפִיל לְגַוֵּהּ כְּפוּם שִׁרְיָן תּוֹרָא מַקַּף לְפוּמֵיהּ <b>סְחוֹר סְחוֹר<\/b> לָא יִתְבְּזָע:", "onk_en": "The opening of the robe was turned inward like the opening around a coat of armor, with a border [<b>encircling<\/b>] all around the opening so that it did not tear.", "pj": "וּפוּם מִנְטַר מְעִילָא כְּפִיל בְּמִיצְעֵיהּ הֵי כְּפוּם שִׁירְיָא תוֹרָא בְּשִיפְתֵיהּ מַקַּף לְפוּמֵיהּ חֲזוֹר חֲזוֹר מְטוּל דְּלָא יִתְבְּזָע", "pj_en": "And the aperture of the upper robe (was) double in the midst, like the opening of a piece of armour, with a border round about its edge, that it might not be torn.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 24, "aliyah": 3, "heb": "וַֽיַּעֲשׂוּ֙ עַל־שׁוּלֵ֣י הַמְּעִ֔יל רִמּוֹנֵ֕י תְּכֵ֥לֶת וְאַרְגָּמָ֖ן וְתוֹלַ֣עַת שָׁנִ֑י מׇשְׁזָֽר׃", "onk": "וַעֲבָדוּ עַל שִׁפּוֹלֵי מְעִילָא רִמּוֹנֵי תִּכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי שְׁזִיר:", "onk_en": "They made on the robe’s (lower) hem, pomegranates of greenish-blue wool, dark red wool, crimson [<b>colored<\/b>] wool, (that were) twined together.", "pj": "וַעֲבָדוּ עַל שִׁפּוֹלֵי מִנְטַר מְעִילָא רוֹמַנְיָן דְּתִכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי שְׁזִיר", "pj_en": "And they made upon the bottom of the upper robe pomegranates of hyacinth, and purple, and crimson, and (fine linen) entwined.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 25, "aliyah": 3, "heb": "וַיַּעֲשׂ֥וּ פַעֲמֹנֵ֖י זָהָ֣ב טָה֑וֹר וַיִּתְּנ֨וּ אֶת־הַפַּֽעֲמֹנִ֜ים בְּת֣וֹךְ הָרִמֹּנִ֗ים עַל־שׁוּלֵ֤י הַמְּעִיל֙ סָבִ֔יב בְּת֖וֹךְ הָרִמֹּנִֽים׃", "onk": "וַעֲבָדוּ זַגַּיָּא דְּהַב דְּכֵי וִיהָבוּ יָת זַגַּיָּא בְּגוֹ רִמּוֹנַיָּא עַל שִׁפּוֹלֵי מְעִילָא סְחוֹר סְחוֹר בְּגוֹ רִמּוֹנַיָּא:", "onk_en": "They made pure gold bells, and put the bells between the pomegranates, on the (lower) hem of the robe all around, between the pomegranates.", "pj": "וַעֲבָדוּ חִיזוֹרְיַין דִּדְהַב וִיהָבוּ יַת חִיזוֹרָא בִּמְצִיעוּת רוּמַנְיָא עַל שִׁפּוּלֵי מִינְטַר מְעִילָא חֲזוֹר חֲזוֹר בִּמְצִיעוּת רוֹמַנְיָא", "pj_en": "And they made golden bells, and set the bells among the pomegranates upon the border of the mantle-robe, round about among the pomegranates;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 26, "aliyah": 3, "heb": "פַּעֲמֹ֤ן וְרִמֹּן֙ פַּעֲמֹ֣ן וְרִמֹּ֔ן עַל־שׁוּלֵ֥י הַמְּעִ֖יל סָבִ֑יב לְשָׁרֵ֕ת כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "זַגָּא וְרִמּוֹנָא זַגָּא וְרִמּוֹנָא עַל שִׁפּוֹלֵי מְעִילָא סְחוֹר סְחוֹר לְשַׁמָּשָׁא כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "A bell and a pomegranate, a bell and a pomegranate, on the (lower) hem of the robe all around, for performing (Divine) service, just as Adonoy commanded Moshe.", "pj": "חִיזוֹרָא וְרוֹמָנָא חִיזוֹרָא וְרוֹמָנָא כּוּלְהוֹן שַׁבְעִין וּתְרֵין עַל שִׁפּוּלֵי מִנְטַר מְעִילָא חֲזוֹר חֲזוֹר לְשַׁמָּשָׁא הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "a bell and a pomegranate, a bell and a pomegranate, all of them seventy upon the bottom of the upper robe round about to minister in; as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 27, "aliyah": 3, "heb": "וַֽיַּעֲשׂ֛וּ אֶת־הַכׇּתְנֹ֥ת שֵׁ֖שׁ מַעֲשֵׂ֣ה אֹרֵ֑ג לְאַהֲרֹ֖ן וּלְבָנָֽיו׃", "onk": "וַעֲבָדוּ יָת כִּתּוּנִין דְּבוּצָא עוֹבַד מָחֵי לְאַהֲרֹן וְלִבְנוֹהִי:", "onk_en": "They made fine linen undershirts, of woven work, for Aharon and his sons.", "pj": "וַעֲבָדוּ יַת כִּתּוּנִין דְּבוּץ עוֹבַד גַּרְדֵי לְאַהֲרן וְלִבְנוֹי", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 28, "aliyah": 3, "heb": "וְאֵת֙ הַמִּצְנֶ֣פֶת שֵׁ֔שׁ וְאֶת־פַּאֲרֵ֥י הַמִּגְבָּעֹ֖ת שֵׁ֑שׁ וְאֶת־מִכְנְסֵ֥י הַבָּ֖ד שֵׁ֥שׁ מׇשְׁזָֽר׃", "onk": "וְיָת מִצְנֶפְתָּא דְּבוּצָא וְיָת שְׁבַח כּוֹבָעַיָּא דְּבוּצָא וְיָת מִכְנְסֵי בוּצָא דְּבוּץ שְׁזִיר:", "onk_en": "(They made) a fine linen turban, and the slendor of the fine linen turban-hats, and the linen pants, (all out of) fine, twined linen,", "pj": "וְיַת מִצְנַפְתָּא דְבוּצָא וְיַת בַּרְצִיץ כּוֹבְעַיָא דְבוּצָא וְיַת אַוַורְקִיסֵי בּוּצָא דְבוּץ שְׁזִיר", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>ואת פארי המגבעת.<\/b> תִּפְאֶרֶת הַמִּגְבָּעוֹת – הַמִּגְבָּעוֹת הַמְּפֹאָרוֹת:", "rashi_en": "ואת פארי המגבעות means the beauty of the high caps — this is equivalent to: the beautiful high caps."}, {"ch": 39, "v": 29, "aliyah": 3, "heb": "וְֽאֶת־הָאַבְנֵ֞ט שֵׁ֣שׁ מׇשְׁזָ֗ר וּתְכֵ֧לֶת וְאַרְגָּמָ֛ן וְתוֹלַ֥עַת שָׁנִ֖י מַעֲשֵׂ֣ה רֹקֵ֑ם כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְיָת הֶמְיָנָא דְּבוּץ שְׁזִיר וְתִכְלָא וְאַרְגְּוָנָא <b>וּצְבַע<\/b> זְהוֹרִי עוֹבַד צַיָּר כְּמָא דִּי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "(They made) the sash-belt of fine, twined linen, and greenish-blue wool, dark red wool, and crimson [<b>colored<\/b>] wool, the work of an embroiderer, just as Adonoy commanded Moshe.", "pj": "וְיַת קַמוּרָא דְבוּץ שְׁזִיר וְתִכְלָא וְאַרְגְּוָונָא וּצְבַע זְהוֹרֵי עוֹבַד צִיּוּר הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 30, "aliyah": 3, "heb": "וַֽיַּעֲשׂ֛וּ אֶת־צִ֥יץ נֵֽזֶר־הַקֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַיִּכְתְּב֣וּ עָלָ֗יו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַיהֹוָֽה׃", "onk": "וַעֲבָדוּ יָת צִיצָא כְלִילָא דְקוּדְשָׁא דְּהַב דְּכֵי וּכְתָבוּ עֲלוֹהִי <b>גְּלִיפָן כְּתַב מְפָרַשׁ<\/b> קֹדֶשׁ לַייָ:", "onk_en": "They made a diadem—a holy crown, of pure gold. They wrote upon it a writing in the manner of a signet (ring) [<b>an engraving in script that is clear<\/b>], “Holy unto Adonoy.”", "pj": "וַעֲבָדוּ יַת צִיצַת כְּלִילָא דְקוּדְשָׁא דְּהַב דְּכֵי וּכְתָבוּ עֲלוֹי גְלִיף חָקִיק וּמְפָרֵשׁ קוֹדֶשׁ לַיְיָ", "pj_en": "And they made the plate of the crown of holiness of pure gold, and wrote upon it, inscribed, engraven, and set forth, HOLINESS TO THE LORD.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 31, "aliyah": 3, "heb": "וַיִּתְּנ֤וּ עָלָיו֙ פְּתִ֣יל תְּכֵ֔לֶת לָתֵ֥ת עַל־הַמִּצְנֶ֖פֶת מִלְמָ֑עְלָה כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיהָבוּ עֲלוֹהִי חוּטָא תְכֶלְתָּא לְמִתַּן עַל מִצְנֶפְתָּא מִלְּעֵלָּא כְּמָא דִּי פַּקִּיד יְיָ יָת משֶׁה:", "onk_en": "They put (fastened) on it a greenish-blue wool cord, to fasten it to the turban from above, just as Adonoy commanded Moshe.", "pj": "וְסַדָרוּ עֲלוֹי שְׁזִיר חוּטָא דְתִכְלָא מְטוֹל לְמִתַּן עַל מִצְנֶפְתָּא מִן לְעֵילָא דִתְפִילָתָא דְרֵישָׁא הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה", "pj_en": "And they set upon it a twined ribbon of hyacinth, to put it upon the tiara above the forehead; as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>לתת על המצנפת מלמעלה.<\/b> וְעַ\"יְ הַפְּתִילִים הָיָה מוֹשִׁיבוֹ עַל הַמִּצְנֶפֶת כְּמִין כֶּתֶר; וְאִ\"אֶ לוֹמַר הַצִּיץ עַל הַמִּצְנֶפֶת, שֶׁהֲרֵי בִשְׁחִיטַת קָדָשִׁים שָׁנִינוּ שְׂעָרוֹ הָיָה נִרְאֶה בֵּין צִיץ לַמִּצְנֶפֶת שֶׁשָּׁם מֵנִיחַ תְּפִלִּין, וְהַצִּיץ הָיָה נָתוּן עַל הַמֶּצַח, הֲרֵי הַמִּצְנֶפֶת לְמַעְלָה וְהַצִּיץ לְמַטָּה, וּמַהוּ עַל הַמִּצְנֶפֶת מִלְמָעְלָה? וְעוֹד הִקְשֵׁיתִי בָהּ – כָּאן הוּא אוֹמֵר וַיִּתְּנוּ עָלָיו פְּתִיל תְּכֵלֶת, וּבְעִנְיַן הַצַּוָּאָה הוּא אוֹמֵר וְשַׂמְתָּ אוֹתוֹ עַל פְּתִיל תְּכֵלֶת? וְאוֹמֵר אֲנִי, פְּתִיל תְּכֵלֶת זֶה חוּטִין הֵן, לְקָשְׁרוֹ בָּהֶן בַּמִּצְנֶפֶת – לְפִי שֶׁהַצִּיץ אֵינוֹ אֶלָּא מֵאֹזֶן לְאֹזֶן וּבַמֶּה יִקְשְׁרֶנּוּ בְמִצְחוֹ? – וְהָיוּ קְבוּעִין בּוֹ חוּטֵי תְכֵלֶת לִשְׁנֵי רָאשָׁיו וּבְאֶמְצָעִיתוֹ, שֶׁבָּהֶן קוֹשְׁרוֹ וְתוֹלֵהוּ בַמִּצְנֶפֶת כְּשֶׁהוּא בְרֹאשׁוֹ, וּשְׁנֵי חוּטִין הָיוּ בְּכָל קָצֶה וְקָצֶה, אֶחָד מִמַּעַל וְאֶחָד מִתַּחַת לְצַד מִצְחוֹ, וְכֵן בְּאֶמְצָעוֹ, שֶׁכָּךְ הוּא נֹחַ לִקְשֹׁר, וְאֵין דֶּרֶךְ קְשִׁירָה בְּפָחוֹת מִשְּׁנֵי חוּטִין, לְכָךְ נֶאֱמַר עַל פְּתִיל תְּכֵלֶת, וְעָלָיו פְּתִיל תְּכֵלֶת, וְקוֹשֵׁר רָאשֵׁיהֶם הַשְּׁנַיִם כֻּלָּן יַחַד מֵאֲחוֹרָיו לְמוּל עָרְפּוֹ, וּמוֹשִׁיבוֹ עַל הַמִּצְנֶפֶת; וְאַל תִּתְמַהּ שֶׁלֹּא נֶאֱמַר פְּתִילֵי תְכֵלֶת הוֹאִיל וּמְרֻבִּין הֵן, שֶׁהֲרֵי מָצִינוּ בְחֹשֶׁן וְאֵפוֹד וַיִּרְכְּסוּ אֶת הַחֹשֶׁן … בִּפְתִיל תְּכֵלֶת, וְעַל כָּרְחֲךָ פָּחוֹת מִשְּׁנַיִם לֹא הָיוּ שֶׁהֲרֵי בִשְׁנֵי קְצוֹת הַחֹשֶׁן הָיוּ ב' טַבְּעוֹת הַחֹשֶׁן, וּבִשְׁתֵּי כִתְפוֹת הָאֵפוֹד הָיוּ ב' טַבְּעוֹת הָאֵפוֹד, שֶׁכְּנֶגְדָן, וּלְפִי דֶּרֶךְ קְשִׁירָה ד' חוּטִין הָיוּ וּמִכָּל מָקוֹם פָּחוֹת מִשְּׁנַיִם אִ\"אֶ:", "rashi_en": "לתת על המצנפת מלמעלה TO FASTEN IT ON HIGH UPON THE MITRE — and by means of the threads he placed it on the mitre as though it were a kind of crown. It is, however, impossible to say that לתת על המצנפת means to put the plate on the mitre, for in the Treatise on the Slaughter of the Sacrifices (Zevachim 19a) we learn: His (the High Priest’s) hair was visible between the plate and the mitre, whereon he placed the Tephillin”. Now the plate rested on his forehead (cf. Exodus 28:38), consequently the mitre was above (on the crown of the head) and the plate beneath (on the forehead). What then can be the meaning of “to fasten it on high upon the mitre”? Besides, I have put another question about this: here it says, “and they put upon it (the plate) a thread of blue purple” and in the section where the command is given it states, (Exodus 28:37) “And thou shalt put it on a blue purple string” (so that the plate was above the thread, not beneath it as is here commanded). I therefore say that this פתיל of blue purple mentioned here was not an ornament but threads by which to tie it (the plate) on the mitre. For the plate reached only from one ear to the other, so with what could they tie it to his forehead? So blue purple threads were attached to it at its (the plate’s) two ends and on the middle by means of which they tied it on and hung it on the mitre whenever this was on his head. There were two threads on each end (of the plate) one on its upper side and the other underneath, on the side next to the forehead and so also at the middle of it (the plate) — because in this way it was easy to tie it on. Since, however, the way of tying a thing on is by not less than two threads the text is justified in saying both, (Exodus 23:37) “[And thou shalt put it] on a blue purple thread” and here “and they put upon it a thread of blue purple”. He (the High Priest) tied both ends of all of them (of all the threads) together behind him on his neck, and thus placed it (the plate) on the mitre. Do not be puzzled because it does not say “threads of blue purple” seeing that there were many (three double threads altogether), for we find the same thing in the case of the breast-plate and the ephod: (Exodus 28:28) “And they shall fasten the breast-plate by the rings thereof unto the rings of the ephod … with a string (and not with strings) of blue purple” and you must admit that there could not have been less than two strings, for at the two ends of the breast-plate were the two rings of the breast-plate and on the two shoulder-pieces of the ephod were the two rings of the ephod opposite to them. Now according to the way the breast-plate was tied on there were four threads, and under any circumstances with less than two it would have been impossible to tie it on, and yet Scripture speaks of “a string” of blue purple."}, {"ch": 39, "v": 32, "aliyah": 3, "heb": "וַתֵּ֕כֶל כׇּל־עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽיַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠כֹ֠ל אֲשֶׁ֨ר צִוָּ֧ה יְהֹוָ֛ה אֶת־מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּשְׁלִים כָּל פָּלְחַן מַשְׁכְּנָא מַשְׁכַּן זִמְנָא וַעֲבָדוּ בְּנֵי יִשְׂרָאֵל כְּכֹל דִּי פַּקִּיד יְיָ יָת משֶׁה כֵּן עֲבָדוּ:", "onk_en": "Thus was completed all the work of the mishkon of the Tent of Meeting. B’nei Yisrael did everything just as Adonoy commanded Moshe, so they did.", "pj": "וּשְׁלִימַת כָּל עִיבִידַת מַשְׁכְּנָא מַשְׁכַּן זִימְנָא וַעֲבָדוּ בְּנֵי יִשְרָאֵל הֵיכְמָא דְפַקֵּיד יְיָ יַת משֶׁה הֵיכְדֵין עֲבָדוּ", "pj_en": "And all the work of the tabernacle, the tabernacle of ordinance, was completed: and the sons of Israel did as the Lord commanded Mosheh, so did they.", "tj": "", "tj_en": "", "rashi": "<b>ויעשו בני ישראל.<\/b> אֶת הַמְּלָאכָה <b>ככל אשר צוה ה' וגו'<\/b>:", "rashi_en": "ויעשו בני ישראל AND THE CHILDREN OF ISRAEL MADE the work ככל אשר צוה ה' וגו׳ ACCORDING TO ALL THAT THE LORD COMMANDED MOSES [SO DID THEY] or [SO THEY MADE IT]."}, {"ch": 39, "v": 33, "aliyah": 4, "heb": "וַיָּבִ֤יאוּ אֶת־הַמִּשְׁכָּן֙ אֶל־מֹשֶׁ֔ה אֶת־הָאֹ֖הֶל וְאֶת־כׇּל־כֵּלָ֑יו קְרָסָ֣יו קְרָשָׁ֔יו <span class=\"mam-kq-trivial\">בְּרִיחָ֖ו<\/span> וְעַמֻּדָ֥יו וַאֲדָנָֽיו׃", "onk": "וְאַיְתִיאוּ יָת מַשְׁכְּנָא לְמשֶׁה יָת מַשְׁכְּנָא וְיָת כָּל מָנוֹהִי פּוּרְפוֹהִי דַּפּוֹהִי עַבְּרוֹהִי וְעַמּוּדוֹהִי וְסַמְּכוֹהִי:", "onk_en": "They brought the mishkon to Moshe—the Tent and all its vessels, its clasps, planks, bars, pillars, and sockets,", "pj": "וְאַיְיתִיוּ יַת מַשְׁכְּנָא לְוַת משֶׁה לְבֵית מִדְרָשֵׁיהּ דְּהֲווּ תַּמָּן יַתְבִין משֶׁה וְאַהֲרן וּבְנוֹי וַהֲוָה מִתְרַץ לְהוֹן סֵדֶר כְּהוּנְתָּא וְתַמָּן יַתְבִין סָבֵי יִשְרָאֵל וְאַחְוִיאוּ לֵיהּ יַת מַשְׁכְּנָא וְיַת כָּל מָנוֹי פּוּרְפּוֹי לוּחוֹי נַגְרוֹי עֲמוּדוֹי וְחוֹמְרוֹי", "pj_en": "And they brought the tabernacle to Mosheh at his house of instruction, (beth Midrash,) where sat Mosheh, and Aharon, and his sons, where he gave direction to them concerning the order of the priesthood; and there, and Aharon, (also) sat the elders of Israel. And they brought to him the tabernacle and all its vessels: its taches, its boards, its bars, its pillars, and its bases;", "tj": "", "tj_en": "", "rashi": "<b>ויביאו את המשכן וגו'.<\/b> שֶׁלֹּא הָיוּ יְכוֹלִין לַהֲקִימוֹ; וּלְפִי שֶׁלֹּא עָשָׂה מֹשֶׁה שׁוּם מְלָאכָה בַמִּשְׁכָּן, הִנִּיחַ לוֹ הַקָּבָּ\"ה הֲקָמָתוֹ, שֶׁלֹּא הָיָה יָכוֹל לַהֲקִימוֹ שׁוּם אָדָם מֵחֲמַת כֹּבֶד הַקְּרָשִׁים, שֶׁאֵין כֹּחַ בָּאָדָם לְזָקְפָן, וּמֹשֶׁה הֶעֱמִידוֹ; אָמַר מֹשֶׁה לִפְנֵי הַקָּבָּ\"ה אֵיךְ אֶפְשָׁר הֲקָמָתוֹ עַ\"יְ אָדָם? אָמַר לוֹ עֲסֹק אַתָּה בְּיָדְךָ, וְנִרְאֶה כִּמְקִימוֹ וְהוּא נִזְקָף וְקָם מֵאֵלָיו, וְזֶהוּ שֶׁנֶּ' הוּקַם הַמִּשְׁכָּן (שמות מ') – הוּקַם מֵאֵלָיו; מִדְרַשׁ רַ' תַנְחוּמָא:", "rashi_en": "ויביאו את המשכן וגו׳ AND THEY BROUGHT THE TABERNACLE [UNTO MOSES etc.], for they themselves were unable to erect it. Since Moses had done no work in the Mishkan, the Holy One, blessed is He, left for him the task of erecting it, for nobody was able to set it up because of the weight of the boards which no human strength was capable of setting up. Moses, however, succeeded in placing it in position. Moses said to the Holy One, blessed be He, “How is its erection possible by human beings?” God answered him: “You be busy with your hand!” He appeared to be erecting it, but in fact it set itself up and rose of its own accord. That is why Scripture says, (Exodus 40:17) “The Tabernacle was erected (הוקם)” — was erected by itself. This is a Midrash of Rabbi Tanchuma 2:11:11."}, {"ch": 39, "v": 34, "aliyah": 4, "heb": "וְאֶת־מִכְסֵ֞ה עוֹרֹ֤ת הָֽאֵילִם֙ הַמְאׇדָּמִ֔ים וְאֶת־מִכְסֵ֖ה עֹרֹ֣ת הַתְּחָשִׁ֑ים וְאֵ֖ת פָּרֹ֥כֶת הַמָּסָֽךְ׃", "onk": "וְיָת חוֹפָאָה מַשְׁכֵי דְדִכְרֵי מְסַמְּקֵי וְיָת חוֹפָאָה מַשְׁכֵי <b>דְסַסְגּוֹנָא<\/b> וְיָת פָּרֻכְתָא דִפְרָסָא:", "onk_en": "the covering of the red dyed rams’ skins, and the covering of the tachash [<b>multicolored<\/b>] skins, and the paroches (partition)-screen,", "pj": "וְיַת חוֹפָאָה דְמַשְׁכֵי דְדִכְרֵי מְסַמְקֵי וְיַת חוֹפָאָה דְמַשְׁכֵי סַסְגְוָונָא וְיַת פַּרְגוֹדָא דִפְרָסָא", "pj_en": "and the covering of reddened rams' skins, and the covering of purple skins, and the veil that was to be spread;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 35, "aliyah": 4, "heb": "אֶת־אֲר֥וֹן הָעֵדֻ֖ת וְאֶת־בַּדָּ֑יו וְאֵ֖ת הַכַּפֹּֽרֶת׃", "onk": "יָת אֲרוֹנָא דְסַהֲדוּתָא וְיָת אֲרִיחוֹהִי וְיָת כַּפֻרְתָּא:", "onk_en": "the ark of the Testimony, its poles, its cover,", "pj": "וְיַת אֲרוֹנָא דְסַהֲדוּתָא וְיַת אֲרִיחוֹי וְיַת כַּפּוּרְתָּא וּכְרוּבַיָא דְנַפְקִין נְגִיד מִינָהּ חָד מִכָּא וְחָד מִכָּא", "pj_en": "and the ark of the testimony, and its staves, and the mercy-seat, and the kerubaia produced of beaten work of the same, the one here, and the other there;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 36, "aliyah": 4, "heb": "אֶת־הַשֻּׁלְחָן֙ אֶת־כׇּל־כֵּלָ֔יו וְאֵ֖ת לֶ֥חֶם הַפָּנִֽים׃", "onk": "יָת פָּתוֹרָא יָת כָּל מָנוֹהִי וְיָת לְחֵם אַפַּיָּא:", "onk_en": "the table, all its vessels, the showbread,", "pj": "וְיַת פָּתוֹרָא וְיַת כָּל מָנוֹי וְיַת לְחֵים אַפַּיָא", "pj_en": "and the table, and all its vessels, and the bread of faces;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 37, "aliyah": 4, "heb": "אֶת־הַמְּנֹרָ֨ה הַטְּהֹרָ֜ה אֶת־נֵרֹתֶ֗יהָ נֵרֹ֛ת הַמַּֽעֲרָכָ֖ה וְאֶת־כׇּל־כֵּלֶ֑יהָ וְאֵ֖ת שֶׁ֥מֶן הַמָּאֽוֹר׃", "onk": "יָת מְנַרְתָּא דָכִיתָא יָת בּוֹצִינָהָא בּוֹצִינֵי סִדְרָא וְיָת כָּל מָנָהָא וְיָת מִשְׁחָא דְאַנְהָרוּתָא:", "onk_en": "the pure Menorah, its lamps, the lamps to be set in order, all its vessels, oil for light,", "pj": "וְיַת מְנַרְתָּא וְיַת בּוֹצִינָהָא בּוֹצִינֵי סְדוּרָא דִמְסַדְרִין כָּל קְבֵיל שִׁבְעָתֵי כּוֹכְבַיָא דִנְהִיגִין בְּשִׁטְרֵיהוֹן בִּרְקִיעָא בִּימָמָא וּבְלֵילְיָא וְיַת מִשְׁחָא דְאַנְהָרוּתָא", "pj_en": "and the candelabrum, and its lamps, the lamps of order, which were ordained to correspond to the seven stars, that rule in their prescribed places in the firmament by day and by night; and the oil for the lights,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 38, "aliyah": 4, "heb": "וְאֵת֙ מִזְבַּ֣ח הַזָּהָ֔ב וְאֵת֙ שֶׁ֣מֶן הַמִּשְׁחָ֔ה וְאֵ֖ת קְטֹ֣רֶת הַסַּמִּ֑ים וְאֵ֕ת מָסַ֖ךְ פֶּ֥תַח הָאֹֽהֶל׃", "onk": "וְיָת מַדְבְּחָא דְדַהֲבָא וְיָת מִשְׁחָא דִרְבוּתָא וְיָת קְטֹרֶת בּוּסְמַיָּא וְיָת פְּרָסָא דִּתְרַע מַשְׁכְּנָא:", "onk_en": "the golden altar, the anointing oil, the incense of spices, the screen for the entrance of the Tent,", "pj": "וְיַת מַדְבְּחָא דְדַהֲבָא וְיַת מִשְׁחָא דִרְבוּתָא וְיַת קְטוֹרֶת בּוּסְמַיָא וְיַת פְּרָסָא דְבִתְרַע מַשְׁכְּנָא", "pj_en": "and the golden altar, and the consecration oil, and the sweet incense, and the hanging for the door of the tabernacle;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 39, "aliyah": 4, "heb": "אֵ֣ת&thinsp;<b>׀<\/b> מִזְבַּ֣ח הַנְּחֹ֗שֶׁת וְאֶת־מִכְבַּ֤ר הַנְּחֹ֙שֶׁת֙ אֲשֶׁר־ל֔וֹ אֶת־בַּדָּ֖יו וְאֶת־כׇּל־כֵּלָ֑יו אֶת־הַכִּיֹּ֖ר וְאֶת־כַּנּֽוֹ׃", "onk": "יָת מַדְבְּחָא דִנְחָשָׁא וְיָת סְרָדָא דִנְחָשָׁא דִּילֵיהּ יָת אֲרִיחוֹהִי וְיָת כָּל מָנוֹהִי יָת כִּיּוֹרָא וְיָת בְּסִיסֵיהּ:", "onk_en": "the copper altar and its copper grate, along with its poles and all its vessels, the laver and its base,", "pj": "וְיַת מַדְבְּחָא דִנְחָשָׁא וְיַת קַנְקַל דִּנְחָשָׁא דִילֵיהּ יַת אֲרִיחוֹי וְיַת כָּל מָנוֹי יַת כִּיּוֹרָא וְיַת בְּסִיסֵיהּ", "pj_en": "and the brasen altar, and its brasen grate, and its staves, and all its utensils; and the laver, and its base;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 40, "aliyah": 4, "heb": "אֵת֩ קַלְעֵ֨י הֶחָצֵ֜ר אֶת־עַמֻּדֶ֣יהָ וְאֶת־אֲדָנֶ֗יהָ וְאֶת־הַמָּסָךְ֙ לְשַׁ֣עַר הֶֽחָצֵ֔ר אֶת־מֵיתָרָ֖יו וִיתֵדֹתֶ֑יהָ וְאֵ֗ת כׇּל־כְּלֵ֛י עֲבֹדַ֥ת הַמִּשְׁכָּ֖ן לְאֹ֥הֶל מוֹעֵֽד׃", "onk": "יָת סְרָדֵי דְדַרְתָּא יָת עַמּוּדָהָא וְיָת סַמְּכָהָא וְיָת פְּרָסָא לִתְרַע דַּרְתָּא יָת אֲטוּנוֹהִי וְסִכָּהָא וְיָת כָּל מָנֵי פָּלְחַן מַשְׁכְּנָא לְמַשְׁכַּן זִמְנָא:", "onk_en": "curtains for the enclosure, its pillars and its sockets, the screen for the entrance to the enclosure, its cords and its stakes, all the vessels for the service of the mishkon of the Tent of Meeting,", "pj": "יַת וִילַוֵי דַרְתָּא וְיַת עַמּוּדָהָא יַת חוּמְרָהָא וְיַת פְּרָסָא לִתְרַע דַּרְתָּא וְיַת אֲטוּנוֹי וּמַחְתָּהָא וְיַת כָּל מָנֵי פּוּלְחַן מַשְׁכְּנָא לְמַשְׁכַּן זִמְנָא", "pj_en": "the curtain-work of the court, and its pillars, and the bases and the veil of the gate of the court, its cords, and pins, and all the vessels for the service of the tabernacle, even the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 41, "aliyah": 4, "heb": "אֶת־בִּגְדֵ֥י הַשְּׂרָ֖ד לְשָׁרֵ֣ת בַּקֹּ֑דֶשׁ אֶת־בִּגְדֵ֤י הַקֹּ֙דֶשׁ֙ לְאַהֲרֹ֣ן הַכֹּהֵ֔ן וְאֶת־בִּגְדֵ֥י בָנָ֖יו לְכַהֵֽן׃", "onk": "יָת לְבוּשֵׁי <b>שִׁמּוּשָׁא<\/b> לְשַׁמָּשָׁא בְקוּדְשָׁא יָת לְבוּשֵׁי קוּדְשָׁא לְאַהֲרֹן כַּהֲנָא וְיָת לְבוּשֵׁי בְנוֹהִי לְשַׁמָּשָׁא:", "onk_en": "the garments of distinction [<b>service<\/b>] for service in the Sanctuary, the sacred garments for Aharon the kohein, and the garments of his sons for priestly service.", "pj": "יַת לְבוּשֵׁי שִׁמוּשָׁא לְשַׁמָשָׁא בְּקוּדְשָׁא יַת לְבוּשֵׁי קוּדְשָׁא לְאַהֲרן כַּהֲנָא וְיַת לְבוּשֵׁי בְּנוֹי לְשַׁמָּשָׁא", "pj_en": "and the vestments of ministration for ministering in the sanctuary, the holy vestments of Aharon the priest, and the vestments of his sons, to minister.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 42, "aliyah": 4, "heb": "כְּכֹ֛ל אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶׁ֑ה כֵּ֤ן עָשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת כׇּל־הָעֲבֹדָֽה׃", "onk": "כְּכֹל דִּי פַּקִּיד יְיָ יָת משֶׁה כֵּן עֲבָדוּ בְּנֵי יִשְׂרָאֵל יָת כָּל פָּלְחָנָא:", "onk_en": "According to all that Adonoy commanded Moshe, so did B’nei Yisrael do all the work.", "pj": "הֵי כְּכָל מַה דְּפַקֵּיד יְיָ יַת משֶׁה הֵיכְדֵין עָבָדוּ בְּנֵי יִשְרָאֵל יַת כָּל פּוּלְחָנָא", "pj_en": "According to all that the Lord had commanded Mosheh, so had the sons of Israel made all the service,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 39, "v": 43, "aliyah": 4, "heb": "וַיַּ֨רְא מֹשֶׁ֜ה אֶת־כׇּל־הַמְּלָאכָ֗ה וְהִנֵּה֙ עָשׂ֣וּ אֹתָ֔הּ כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה כֵּ֣ן עָשׂ֑וּ וַיְבָ֥רֶךְ אֹתָ֖ם מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַחֲזָא משֶׁה יָת כָּל עִבִדְתָּא וְהָא עֲבָדוּ יָתַהּ כְּמָא דִי פַּקִּיד יְיָ כֵּן עֲבָדוּ וּבָרִיךְ יָתְהוֹן משֶׁה:", "onk_en": "Moshe saw the entire work, and behold, they did it just as Adonoy commanded, so had they done, and Moshe blessed them.", "pj": "וַחֲמָא משֶׁה יַת כָּל פּוּלְחָנָא וְהָא עָבָדוּ יָתָהּ הֵיכְמָא דְפַקֵּיד יְיָ הֵיכְדֵין עָבָדוּ וּבְרִיךְ יַתְהוֹן משֶׁה וַאֲמַר תִּשְׁרֵי שְׁכִינְתָּא דַיְיָ בְּעוֹבָדֵי יְדֵיכוֹן", "pj_en": "And Moshe surveyed all the service, and, behold, they had made it as the Lord had commanded, so had they made it. And Mosheh blessed them, and said, May the Shekinah of the Lord dwell within the work of your hands!", "tj": "", "tj_en": "", "rashi": "<b>ויברך אתם משה.<\/b> אָמַר לָהֶם יְהִי רָצוֹן שֶׁתִּשְׁרֶה שְׁכִינָה בְמַעֲשֵׂה יְדֵיכֶם, וִיהִי נֹעַם ה' אֱלֹהֵינוּ עָלֵינוּ וְגוֹ', וְהוּא אֶחָד מִי\"א מִזְמוֹרִים שֶׁבִּתְפִלָּה לְמֹשֶׁה (ספרא):", "rashi_en": "ויברך אתם משה AND MOSES BLESSED THEM — He said to them “May it be the will of God that His Shechinah rest upon the work of your hands; ‘and let the beauty of the Lord our God be upon us and establish Thou the work of our hands upon us’” (Psalms 90:17.) (Sifra, Shemini, Mechilta d'Miluim 2 15) This (from ויהי נועם onward) is part of one of the eleven Psalms (90—100) that are in the section beginning with, תפלה למשה; (Numbers Rabbah 12:9)."}, {"ch": 40, "v": 1, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe saying.", "pj": "וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 2, "aliyah": 5, "heb": "בְּיוֹם־הַחֹ֥דֶשׁ הָרִאשׁ֖וֹן בְּאֶחָ֣ד לַחֹ֑דֶשׁ תָּקִ֕ים אֶת־מִשְׁכַּ֖ן אֹ֥הֶל מוֹעֵֽד׃", "onk": "בְּיוֹמָא יַרְחָא קַדְמָאָה בְּחַד לְיַרְחָא תְּקִים יָת מַשְׁכְּנָא מַשְׁכַּן זִמְנָא:", "onk_en": "“On the first day of the first month, you should set up the mishkon of the Tent of Meeting.", "pj": "בְּיוֹמָא דְיַרְחָא קַדְמָאָה הוּא יַרְחָא דְנִיסָן בְּחַד לְיַרְחָא תְּקִים יַת מַשְׁכְּנָא מַשְׁכַּן זִימְנָא", "pj_en": "On the day of the first month, that is the month of Nisan, on the first of the month, thou shalt rear up the tabernacle, the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 3, "aliyah": 5, "heb": "וְשַׂמְתָּ֣ שָׁ֔ם אֵ֖ת אֲר֣וֹן הָעֵד֑וּת וְסַכֹּתָ֥ עַל־הָאָרֹ֖ן אֶת־הַפָּרֹֽכֶת׃", "onk": "וּתְשַׁוִּי תַמָּן יָת אֲרוֹנָא דְסַהֲדוּתָא <b>וְתַטֵּל<\/b> עַל אֲרוֹנָא יָת פָּרֻכְתָּא:", "onk_en": "Place the ark of Testimony there, and spread [<b>cover<\/b>] the paroches (partition) over the ark.", "pj": "וּתְשַׁוֵּי תַּמָּן יַת אֲרוֹנָא דְסַהֲדוּתָא וְתַטְלֵיל עַל אֲרוֹנָא יַת כַּפּוּרְתָּא", "pj_en": "And thou shalt set there the ark of the testimony, and overlay the ark with the mercy seat.", "tj": "", "tj_en": "", "rashi": "<b>וסכת על הארן.<\/b> לְשׁוֹן הַגָּנָה, שֶׁהֲרֵי מְחִצָּה הָיְתָה:", "rashi_en": "וסכת על הארן means AND THOU SHALT SCREEN THE ARK — וסכת denotes screening and it is the correct term to use, for it (the veil) formed a partition (cf. Rashi on Exodus 35:12)."}, {"ch": 40, "v": 4, "aliyah": 5, "heb": "וְהֵבֵאתָ֙ אֶת־הַשֻּׁלְחָ֔ן וְעָרַכְתָּ֖ אֶת־עֶרְכּ֑וֹ וְהֵבֵאתָ֙ אֶת־הַמְּנֹרָ֔ה וְהַעֲלֵיתָ֖ אֶת־נֵרֹתֶֽיהָ׃", "onk": "וְתָעֵל יָת פָּתוֹרָא וְתַסְדַּר יָת סִדְרֵיהּ וְתָעֵל יָת מְנַרְתָּא וְתַדְלֵק יָת בּוֹצִינָהָא:", "onk_en": "Bring in the table and set it in order. Bring in the menorah and light its lamps.", "pj": "וְהַנְעַל יַת פָּתוֹרָא בִּסְטַר צִפּוּנָא מְטוּל דְּמִתַּמָּן מִתְיָהֵיב עוּתְרָא דְמִתַּמָן זָלְחָן רְסִיסֵי מַלְקוֹשִׁין עַל עוּסְבִין לְמִתְפַּרְנְסָא בְּהוֹן דַּיְירֵי עַלְמָא וּתְסַדֵּר יַת סִדְרוֹי תְּרֵין סִדְרֵי לַחְמָא גַוָאָה שִׁית עֲגוּלִין בְּסִדְרָא כָּל קְבֵל שִׁבְטוֹי דְיַעֲקב וּתְהַנְעַל יַת מְנַרְתָּא בִּסְטַר דָּרוֹמָא מְטוֹל דְּמִתַּמָּן שְׁבִילֵי שִׁמְשָׁא וְסִיהֲרָא וּמִתַּמָּן אִיסְרַטְוָון דִּנְהוֹרֵי וְתַמָּן גִּנְזֵי חָכְמְתָא דִמְתִילִין לִנְהוֹרֵי וְתַדְלֵיק יַת בּוֹצִינָהָא שׁוּבְעָא כָּל קְבֵיל שִׁבְעָתֵי כּוֹכְבַיָא דִמְתִילִין לְצַדִּיקַיָא דִמְנַהֲרִין לְעַלְמָא בִּזְכוּתֵיהוֹן", "pj_en": "And thou shalt bring in the table on the north side, because, from thence are given riches; for from thence distil the drops of the latter rain upon the herbs, for the food of the inhabiters of the world; and thou shalt arrange its orders, two rows of bread, comprising six cakes in a row, answering to the tribes of Jakob. And thou shalt bring in the candelabrum, on the south side, because there are the paths of the sun and of the moon, and the pathways of the luminaries; and thence are the treasures of the wisdom which resembleth the light. And thou shalt kindle the seven lamps, corresponding to the seven stars which resemble the just, who shine unto eternity in their righteousness.", "tj": "", "tj_en": "", "rashi": "<b>וערכת את ערכו.<\/b> שְׁתַּיִם מַעֲרָכוֹת שֶׁל לֶחֶם הַפָּנִים:", "rashi_en": "וערכת את ערכו AND SET ITS ROWS — the two piles of the show-bread."}, {"ch": 40, "v": 5, "aliyah": 5, "heb": "וְנָתַתָּ֞ה אֶת־מִזְבַּ֤ח הַזָּהָב֙ לִקְטֹ֔רֶת לִפְנֵ֖י אֲר֣וֹן הָעֵדֻ֑ת וְשַׂמְתָּ֛ אֶת־מָסַ֥ךְ הַפֶּ֖תַח לַמִּשְׁכָּֽן׃", "onk": "וְתִתֵּן יָת מַדְבְּחָא דְדַהֲבָא לִקְטֹרֶת <b>בּוּסְמַיָּא<\/b> קֳדָם אֲרוֹנָא דְסַהֲדוּתָא וּתְשַׁוִּי יָת פְּרָסָא דְתַרְעָא לְמַשְׁכְּנָא:", "onk_en": "Place the golden altar for burning incense [<b>of spices<\/b>], before the ark of Testimony. Place the screen at the mishkon’s entrance.", "pj": "וְתִתֵּן יַת מַדְבְּחָא דְדַהֲבָא לִקְטוֹרֶת בּוּסְמַיָא קֳדָם אֲרוֹנָא דְסַהֲדוּתָא מְטוּל חַכִּימַיָא דַעֲסִיקִין בְּאוֹרַיְיתָא וְרֵחֵיהוֹן נָדִיף הֵי כִקְטוֹרֶת בּוּסְמַיָא וּתְשַׁוֵּי יַת פְּרָסָא דְתַרְעָא לְמַשְׁכְּנָא מְטוּל צַדִּיקַיָא דַחֲפִין בִּזְכוּתְהוֹן עַל עַמָּא בֵּית יִשְרָאֵל", "pj_en": "And thou shalt place the golden altar for sweet incense before the ark of the testimony; because the wise who are diligent in the law have a perfume fragrant as the sweet incense. And thou shalt set the veil at the gate of the tabernacle; because the righteous so covereth with their righteousness the people of the house of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 6, "aliyah": 5, "heb": "וְנָ֣תַתָּ֔ה אֵ֖ת מִזְבַּ֣ח הָעֹלָ֑ה לִפְנֵ֕י פֶּ֖תַח מִשְׁכַּ֥ן אֹֽהֶל־מוֹעֵֽד׃", "onk": "וְתִתֵּן יָת מַדְבְּחָא דַעֲלָתָא קֳדָם תְּרַע מַשְׁכְּנָא מַשְׁכַּן זִמְנָא:", "onk_en": "Place the burnt-offering altar in front of the entrance of the mishkon of the Tent of Meeting.", "pj": "וְתִתֵּן יַת מַדְבְּחָא דְעָלָתָא קֳדָם תְּרַע מַשְׁכַּן זִמְנָא מְטוּל עֲתִירַיָא דִמְסַדְרִין פָּתוֹרָא קֳדָם תַּרְעֵיהוֹן וּמְפַרְנְסִין מִסְכֵּנַיָא וּמִשְׁתְּבֵיק לְהוֹן חוֹבֵיהוֹן כְּאִילוּ מְקַרְבִין עֲלָתָא עַל מַדְבְּחָא", "pj_en": "And thou shalt place the altar of burnt offering before the door of the tabernacle of ordinance; because the rich, who spread the table before their doors and feed the poor, shall have their sins forgiven what time they make the offering upon the altar.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 7, "aliyah": 5, "heb": "וְנָֽתַתָּ֙ אֶת־הַכִּיֹּ֔ר בֵּֽין־אֹ֥הֶל מוֹעֵ֖ד וּבֵ֣ין הַמִּזְבֵּ֑חַ וְנָתַתָּ֥ שָׁ֖ם מָֽיִם׃", "onk": "וְתִתֵּן יָת כִּיּוֹרָא בֵּין מַשְׁכַּן זִמְנָא וּבֵין מַדְבְּחָא וְתִתֵּן תַּמָּן מַיָּא:", "onk_en": "Place the laver between the Tent of Meeting and the altar, and put water into it.", "pj": "וְתִתֵּן יַת כִּיּוֹרָא בֵּינֵי מַשְׁכַּן זִמְנָא וּבֵינֵי מַדְבְּחָא וְתִתֵּן תַּמָּן מוֹי מְטוּל חוֹבַיָא דְהַדְרִין בִּתְיוּבְתָּא וְשַׁדִיַין עַקְמוּמִיתְהוֹן הֵי כְמַיָא", "pj_en": "And thou shalt place the laver between the tabernacle of ordinance and the altar, and put water therein for the sins of such as convert by repentance, and pour off their perversity like water.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 8, "aliyah": 5, "heb": "וְשַׂמְתָּ֥ אֶת־הֶחָצֵ֖ר סָבִ֑יב וְנָ֣תַתָּ֔ אֶת־מָסַ֖ךְ שַׁ֥עַר הֶחָצֵֽר׃", "onk": "וּתְשַׁוֵּי יָת דַּרְתָּא סְחוֹר סְחוֹר וְתִתֵּן יָת פְּרָסָא דִּתְרַע דַּרְתָּא:", "onk_en": "Put up the enclosure all around, and set up the screen for the enclosure’s entrance.", "pj": "וּתְשַׁוֵּי יַת דַּרְתָּא חֲזוֹר חֲזוֹר מְטוֹל זַכְוַות אַבְהַת עַלְמָא דִמְחַזְרִין חֲזוֹר חֲזוֹר לְעַמָּא בֵּית יִשְרָאֵל וְתִתֵּן יַת פְּרָסָא דִתְרַע דָּרְתָא מְטוּל זַכְוַת אַבְהַת עַלְמָא דְפָרִיס בִּתְרַע גֵּיהִנָּם מִן בִּגְלַל דְּלָא יֵעָלוּן תַּמָּן נַפְשַׁת דַרְדְּקֵי עַמָּא דְיִשְרָאֵל", "pj_en": "And thou shalt place the court round about, because of the merit of the fathers of the world, which encompasseth the people of the house of Israel round about. And thou shalt set the hanging of the gate of the court on account of the merit of the mothers of the world, which spreadeth at the gate of Gehennam, that none may enter there of the souls of the children of the people of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 9, "aliyah": 5, "heb": "וְלָקַחְתָּ֙ אֶת־שֶׁ֣מֶן הַמִּשְׁחָ֔ה וּמָשַׁחְתָּ֥ אֶת־הַמִּשְׁכָּ֖ן וְאֶת־כׇּל־אֲשֶׁר־בּ֑וֹ וְקִדַּשְׁתָּ֥ אֹת֛וֹ וְאֶת־כׇּל־כֵּלָ֖יו וְהָ֥יָה קֹֽדֶשׁ׃", "onk": "וְתִסַּב יָת מִשְׁחָא דִרְבוּתָא וּתְרַבֵּי יָת מַשְׁכְּנָא וְיָת כָּל דִּי בֵיהּ וּתְקַדֵּשׁ יָתֵיהּ וְיָת כָּל מָנוֹהִי וִיהֵי קוּדְשָׁא:", "onk_en": "Take the anointing oil, and anoint the mishkon and everything in it. Sanctify it and all its vessels so that it will become holy.", "pj": "וְתִסַּב יַת מִשְׁחָא דִרְבוּתָא וּתְרַבֵּי יַת מַשְׁכְּנָא וְיַת כָּל דְּבֵיהּ וּתְקַדֵּשׁ יָתֵיהּ מְטוּל כְּלִיל דְּמַלְכוּתָא דְבֵית יְהוּדָה וּמַלְכָּא מְשִׁיחָא דְעָתִיד לְמִפְרַק יַת יִשְרָאֵל בְּסוֹף יוֹמַיָא", "pj_en": "And thou shalt take the consecration-oil, and anoint the tabernacle, and all that is therein, and shalt sanctify it, on account of the crown of the kingdom of the house of Jehudah, and of the King Meshiha, who is to redeem Israel at the end of the days.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 40, "v": 10, "aliyah": 5, "heb": "וּמָשַׁחְתָּ֛ אֶת־מִזְבַּ֥ח הָעֹלָ֖ה וְאֶת־כׇּל־כֵּלָ֑יו וְקִדַּשְׁתָּ֙ אֶת־הַמִּזְבֵּ֔חַ וְהָיָ֥ה הַמִּזְבֵּ֖חַ קֹ֥דֶשׁ קׇֽדָשִֽׁים׃", "onk": "וּתְרַבֵּי יָת מַדְבְּחָא דַעֲלָתָא וְיָת כָּל מָנוֹהִי וּתְקַדֵּשׁ יָת מַדְבְּחָא וִיהֵי מַדְבְּחָא קֹדֶשׁ קוּדְשִׁין:", "onk_en": "Anoint the burnt-offering altar and all its vessels. Sanctify the altar so that the altar becomes holy of holies.", "pj": "וּתְרַבֵּי יַת מַדְבְּחָא דַעֲלָתָא וְיַת כָּל מָנוֹי וּתְקַדֵּשׁ יַת מַדְבְּחָא וִיהֵי מַדְבְּחָא קוֹדֶשׁ קוּדְשִׁין מְטוּל כְּלִילָא דִכְהוּנְתָּא דְאַהֲרן וּבְנוֹי וְאֵלִיָהוּ כַּהֲנָא רַבָּא דַּעֲתִיד לְמִשְׁתַּלְחָא בְּסוֹף גַּלְוָותָא", "pj_en": "And thou shalt anoint the altar of burnt offering, and all its vessels, and consecrate the altar, that it may be an altar most holy, on account of the crown of the priesthood of Aharon, and his sons, and of Elijah, the great Pries
