<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

<script>
const SLUG = "mishpatim";
const DATA = [{"ch": 21, "v": 1, "aliyah": 1, "heb": "וְאֵ֙לֶּה֙ הַמִּשְׁפָּטִ֔ים אֲשֶׁ֥ר תָּשִׂ֖ים לִפְנֵיהֶֽם׃", "onk": "וְאִלֵין דִינַיָא דִי תַסְדַר קֳדָמֵיהוֹן:", "onk_en": "And these are the laws that you shall set before them.", "pj": "ואלה וְאִלֵּין הִינוּן סִדְרֵי דִינַיָא דִי תְסַדֵּר קֳדָמֵיהוֹן", "pj_en": "AND these are the orders of judgments which thou shalt order before them.", "tj": "", "tj_en": "", "rashi": "<b>ואלה המשפטים.<\/b> כָּל מָקוֹם שֶׁנֶּאֱמַר \"אֵלֶּה\" פָּסַל אֶת הָרִאשׁוֹנִים, \"וְאֵלֶּה\" מוֹסִיף עַל הָרִאשׁוֹנִים, מָה הָרִאשׁוֹנִים מִסִּינַי, אַף אֵלּוּ מִסִּינַי; וְלָמָּה נִסְמְכָה פָּרָשַׁת דִּינִין לְפָרָשַׁת מִזְבֵּחַ? לוֹמַר לְךָ, שֶׁתָּשִׂים סַנְהֶדְרִין אֵצֶל הַמִּקְדָּשׁ (מכילתא):<br><br><b>אשר תשים לפניהם.<\/b> אָמַר לוֹ הַקָּבָּ\"ה לְמֹשֶׁה: לֹא תַעֲלֶה עַל דַּעְתְּךָ לוֹמַר, אֶשְׁנֶה לָהֶם הַפֶּרֶק וְהַהֲלָכָה ב' אוֹ ג' פְּעָמִים, עַד שֶׁתְּהֵא סְדוּרָה בְּפִיהֶם כְּמִשְׁנָתָהּ, וְאֵינִי מַטְרִיחַ עַצְמִי לַהֲבִינָם טַעֲמֵי הַדָּבָר וּפֵרוּשׁוֹ, לְכָךְ נֶאֱמַר אֲשֶׁר תָּשִׂים לִפְנֵיהֶם – כְּשֻׁלְחָן הֶעָרוּךְ וּמוּכָן לֶאֱכֹל לִפְנֵי הָאָדָם (שם):<br><br><b>לפניהם.<\/b> וְלֹא לִפְנֵי גוֹיִם, וַאֲפִלּוּ יָדַעְתָּ בְדִין אֶחָד שֶׁהֵם דָּנִין אוֹתוֹ כְּדִינֵי יִשְׂרָאֵל, אַל תְּבִיאֵהוּ בְעַרְכָּאוֹת שֶׁלָּהֶם, שֶׁהַמֵּבִיא דִּינֵי יִשְׂרָאֵל לִפְנֵי גוֹיִם, מְחַלֵּל אֶת הַשֵּׁם וּמְיַקֵּר שֵׁם עֲ\"זָ לְהַשְׁבִּיחָהּ, שֶׁנֶּאֱמַר כִּי לֹא כְצוּרֵנוּ צוּרָם וְאֹיְבֵינוּ פְּלִילִים (דברים ל\"ב) – כְּשֶׁאוֹיְבֵינוּ פְּלִילִים זֶהוּ עֵדוּת לְעִלּוּי יִרְאָתָם (תנחומא):", "rashi_en": "ואלה המשפטים NOW THESE ARE THE JUDGMENTS — Wherever אלה, “these are”, is used it cuts off (פוסל) the preceding section from that which it introduces; where, however, ואלה “and these” is used it adds something to the former subject (i. e. forms a continuation of it). So also here: “And these are the judgments (i. e. these, also)”: What is the case with the former commandments (the עשרת הדברות)? They were given at Sinai! So these, too, were given at Sinai! (Mekhilta; Shemot Rabbah 30:3; cf. also Midrash Tanchuma, Mishpatim 3) If this be so, why is this section dealing with the “civil laws” placed immediately after that commanding the making of the altar? To tell you that you should seat (i. e. provide quarters for) the Sanhedrin in the vicinity of the Temple.<br><br>אשר תשים לפניהם WHICH THOU SHALT PUT BEFORE THEM — God said to Moses: It should not enter your mind to say, “I shall teach them a section of the Torah or a single Halacha twice or three times until it will become current in their mouths exactly according to its wording (i. e. until they know the text verbatim), but I shall not take the trouble to make them understand the reason of each thing and its significance”; therefore Scripture says, אשר תשים לפניהם, “which thou shalt set before them” (cf. Genesis 34:23) — like a table fully laid before a person with everything ready for eating (Mekhilta).<br><br>לפניהם BEFORE THEM — but not before the heathens. Even if you know that in the case of a particular matter of law they will decide it in the same way as Jewish law would, do not bring it before their courts; for he who brings Israel’s law-cases before the heathens defames the Name of the Lord and pays honour to the name of the idol (in the name of which the heathen court administers justice), thereby giving it undue importance, as it is said, (Deuteronomy 32:31) “For their rock is not as our Rock that our enemies should be judges over us”, which implies: when our enemies are judges over us (i. e. if we make them judges over us) it is a testimony to the superiority of that which they reverence (their idol) (Midrash Tanchuma, Mishpatim 3)."}, {"ch": 21, "v": 2, "aliyah": 1, "heb": "כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּבַ֨שְּׁבִעִ֔ת יֵצֵ֥א לַֽחׇפְשִׁ֖י חִנָּֽם׃", "onk": "אֲרֵי תִזְבַּן עַבְדָא <b>בַר יִשְׂרָאֵל<\/b> שִׁתְּ שְׁנִין יִפְלָח וּבַשְׁבִיעֵתָא יִפּוֹק לְבַר חוֹרִין מַגָן:", "onk_en": "If you buy a Hebrew slave [<b>who is a son of a Hebrew<\/b>], he shall serve [you] for six years, but in the seventh [year] he is to go out free, for naught [without liability].", "pj": "אֲרוּם תִּיזְבוּן בִּגְנֵיבוּתֵיהּ לְעַבְדָא בַּר יִשְרָאֵל שִׁית שְׁנִין יִפְלַח וּבְמַעֲלֵי שְׁבִיעָתָא יִפּוֹק לְבַר חוֹרִין מַגָּן", "pj_en": "If thou shalt have bought a son of Israel, on account of his theft, six years he shall serve, and at the incoming of the seventh he shall go out free without price.", "tj": "", "tj_en": "", "rashi": "<b>כי תקנה עבד עברי.<\/b> עֶבֶד שֶׁהוּא עִבְרִי; אוֹ אֵינוֹ אֶלָּא עַבְדּוֹ שֶׁל עִבְרִי – עֶבֶד כְּנַעֲנִי שֶׁלְּקַחְתּוֹ מִיִּשְׂרָאֵל – וְעָלָיו הוּא אוֹמֵר שֵׁשׁ שָׁנִים יַעֲבֹד? וּמָה אֲנִי מְקַיֵּם וְהִתְנַחַלְתֶּם אֹתָם (ויקרא כ\"ה), בְּלָקוּחַ מִן הַגּוֹי, אֲבָל בְּלָקוּחַ מִיִּשְׂרָאֵל יֵצֵא בְּשֵׁשׁ? תַּ\"לֹ כִּי יִמָּכֵר לְךָ אָחִיךָ הָעִבְרִי (דברים ט\"ו), לֹא אָמַרְתִּי אֶלָּא בְאָחִיךָ:<br><br><b>כי תקנה.<\/b> מִיַּד בֵּית דִּין שֶׁמְּכָרוּהוּ בִגְנֵבָתוֹ, כְּמוֹ שֶׁנֶּאֱמַר אִם אֵין לוֹ וְנִמְכַּר בִּגְנֵבָתוֹ, אוֹ אֵינוֹ אֶלָּא בְּמוֹכֵר עַצְמוֹ מִפְּנֵי דָּחְקוֹ, אֲבָל מְכָרוּהוּ בֵית דִּין לֹא יֵצֵא בְשֵׁשׁ? כְּשֶׁהוּא אוֹמֵר וְכִי יָמוּךְ אָחִיךָ עִמָּךְ וְנִמְכַּר לָךְ (ויקרא כ\"ה), הֲרֵי מוֹכֵר עַצְמוֹ מִפְּנֵי דָּחְקוֹ אָמוּר, וּמָה אֲנִי מְקַיֵּם כִּי תִקְנֶה? בְּנִמְכַּר בְּבֵית דִּין:<br><br><b>לחפשי.<\/b> לְחֵרוּת:", "rashi_en": "כי תקנה עבד עברי IF THOU BUYEST AN עבד עברי — This means a servant who is a Hebrew. Or perhaps this is not so, but it means a servant of a Hebrew (one who had been the servant of a Hebrew), i. e. a Canaanitish servant whom thou hast bought from an Israelite, and it is with regard to him that Scripture states “six years he shall serve”! — And if you ask, how I will then explain the commandment, (Leviticus 25:46) “and you shall leave them (the Canaanitish servants) as an inheritance for your children [and they shall serve you forever]”? then I reply, that this refers to the case of a Canaanitish servant who has been bought from a heathen; but if such a servant has been bought from an Israelite he shall go free at the end of six years! — This explanation that our text refers to a Canaanite servant will not hold, for Scripture states, (Deuteronomy 15:12) “and if thy brother an Hebrew man be sold unto thee [and serve thee six years, then in the seventh year thou shalt let him go free from thee]” — the Torah says, as it were, by using the two terms העברי and אחיך: I tell you this (that the servant shall go free in the seventh year) only with regard to thy brother! Consequently Leviticus 25:46 has to be applied to any Canaanite servant, whether bought from a Hebrew or from a heathen and עבד עברי in our text can only denote עבד שהוא עברי. (Mekhilta)<br><br>‎כי תקנה IF THOU BUYEST [AN HEBREW SERVANT] — This means an Hebrew servant whom thou hast bought from the hand of the court which sold him for a theft which he had committed, as it is said, (Exodus 22:2) “if he (the thief) have nothing, then shall he be sold for his theft”. Or perhaps this is not so, but Scripture is referring to the case of one who sells himself as a servant on account of his destitution, whilst he who has been sold by the court for his theft shall not go free at the end of six years! This assumption it erroneous, for when Scripture states, (Leviticus 25:39, 40) “and if thy brother that dwelleth by thee be waxen poor, and he sells himself unto thee … [he shall serve thee unto the year of jubilee]”, it is plain that in this passage there is mentioned the case of one who sells himself on account of his destitution. How then must I explain כי תקנה in this verse? Obviously as referring to him who was sold by the court (Mekhilta).<br><br>לחפשי means INTO FREEDOM (i. e. חפשי is a noun like חֹפֶשׁ but having a redundant י at the end)."}, {"ch": 21, "v": 3, "aliyah": 1, "heb": "אִם־בְּגַפּ֥וֹ יָבֹ֖א בְּגַפּ֣וֹ יֵצֵ֑א אִם־בַּ֤עַל אִשָּׁה֙ ה֔וּא וְיָצְאָ֥ה אִשְׁתּ֖וֹ עִמּֽוֹ׃", "onk": "אִם בִּלְחוֹדוֹהִי יֵיעוֹל בִּלְחוֹדוֹהִי יִפּוֹק אִם בְּעֵל אִתְּתָא הוּא וְתִפּוֹק אִתְּתֵהּ עִמֵהּ:", "onk_en": "If he came by himself [unmarried], he shall go out by himself. If he was married, his wife shall go out with him.", "pj": "אִין בִּלְחוֹדוֹי יֵיעוֹל בִּלְחוֹדוֹי יִפּוֹק וְאִין מָרֵי אִינְתְּתָא בַּת יִשְרָאֵל הוּא וְתִיפּוֹק אִינְתְּתֵיהּ עִמֵּיהּ", "pj_en": "If he came in alone, he shall go out alone: but if (he be) the husband of a wife, a daughter of Israel, his wife shall go out with him.", "tj": "", "tj_en": "", "rashi": "<b>אם בגפו יבא.<\/b> שֶׁלֹּא הָיָה נָשׂוּי אִשָּׁה, כְּתַרְגּוּמוֹ אִם בִּלְחוֹדוֹהִי, וּלְשׁוֹן בְּגַפּוֹ – בִּכְנָפוֹ, שֶׁלֹּא בָּא אֶלָּא כְּמוֹת שֶׁהוּא, יְחִידִי, בְּתוֹךְ לְבוּשׁוֹ – בִּכְנַף בִּגְדוֹ:<br><br><b>בגפו יצא.<\/b> מַגִּיד שֶׁאִם לֹא הָיָה נָשׂוּי מִתְּחִלָּה, אֵין רַבּוֹ מוֹסֵר לוֹ שִׁפְחָה כְנַעֲנִית לְהוֹלִיד מִמֶּנָּה עֲבָדִים (קידושין כ'):<br><br><b>אם בעל אשה הוא.<\/b> יִשְׂרְאֵלִית:<br><br><b>ויצאה אשתו עמו.<\/b> וְכִי מִי הִכְנִיסָהּ שֶׁתֵּצֵא? אֶלָּא מַגִּיד הַכָּתוּב שֶׁהַקּוֹנֶה עֶבֶד עִבְרִי חַיָּב בִּמְזוֹנוֹת אִשְׁתּוֹ וּבָנָיו (שם כ\"ב):", "rashi_en": "אם בגפו יבא IF HE CAME IN BY HIMSELF — This means that he was unmarried — as the Targum renders it אם בלחודוהי, if he came in “alone”. The term בגפו is the same as גף) בכנפו being synonymous with כנף wing, skirt) i. e. he came in only just as he was, alone, merely wrapped in his garment: so that בגפו, “in his skirt”, means “in the skirt of his garment”.<br><br>בגפו יצא HE SHALL GO OUT BY HIMSELF — This intimates that if he was unmarried originally (when he came in), his master is not allowed to give him against his will a Canaanitish handmaid with the object of raising slaves (Kiddushin 20a).<br><br>אם בעל אשה הוא IF HE BE MARRIED to an Israelite woman (Mekhilta),<br><br>ויצאה אשתו עמו then HIS WIFE SHALL GO OUT WITH HIM — But who brought her in (into the state of service) that the text has to state she shall go out? But by saying this Scripture intimates that he who acquires a Hebrew servant is bound to provide his wife and children also with food (Mekhilta; Kiddushin 22a)."}, {"ch": 21, "v": 4, "aliyah": 1, "heb": "אִם־אֲדֹנָיו֙ יִתֶּן־ל֣וֹ אִשָּׁ֔ה וְיָלְדָה־ל֥וֹ בָנִ֖ים א֣וֹ בָנ֑וֹת הָאִשָּׁ֣ה וִילָדֶ֗יהָ תִּהְיֶה֙ לַֽאדֹנֶ֔יהָ וְה֖וּא יֵצֵ֥א בְגַפּֽוֹ׃", "onk": "אִם רִבּוֹנֵהּ יִתֶּן לֵהּ אִתְּתָא וּתְלִיד לֵהּ בְּנִין אוֹ בְנָן אִתְּתָא וּבְנָהָא תְּהֵי לְרִבּוֹנָהָא וְהוּא יִפּוֹק בִּלְחוֹדוֹהִי:", "onk_en": "If his master should give him a wife, and she bears him sons or daughters, then the woman and her children belong to her master, and he shall go out by himself.", "pj": "אִין רִבּוֹנֵיהּ יִתֵּן לֵיהּ אִתְּתָא אַמְתָא וְתֵילִיד לֵיהּ בְּנִין אוֹ בְּנָן אִתְּתָא וּבְנָהָא תְּהֵא לְרִבּוֹנָהּ וְהוּא יִפּוֹק בִּלְחוֹדוֹי", "pj_en": "If his master give him a wife, an handmaid, and she bear him sons or daughters, the wife and her children shall belong to his master, and he may go out alone.", "tj": "", "tj_en": "", "rashi": "<b>אם אדניו יתן לו אשה.<\/b> מִכָּאן שֶׁהָרְשׁוּת בְּיַד רַבּוֹ לִמְסֹר לוֹ שִׁפְחָה כְנַעֲנִית לְהוֹלִיד מִמֶּנָּה עֲבָדִים. אוֹ אֵינוֹ אֶלָּא בְיִשְׂרְאֵלִית? תַּ\"לֹ הָאִשָּׁה וִילָדֶיהָ תִּהְיֶה לַאדֹנֶיהָ, הָא אֵינוֹ מְדַבֵּר אֶלָּא בִּכְנַעֲנִית, שֶׁהֲרֵי הָעִבְרִיָּה אַף הִיא יוֹצְאָה בְשֵׁשׁ – וַאֲפִלּוּ לִפְנֵי שֵׁשׁ אִם הֵבִיאָה סִימָנִין יוֹצְאָה – שֶׁנֶּאֱמַר אָחִיךָ הָעִבְרִי אוֹ הָעִבְרִיָּה (דברים ט\"ו), מְלַמֵּד שֶׁאַף הָעִבְרִיָּה יוֹצְאָה בְשֵׁשׁ (מכילתא):", "rashi_en": "אם אדניו יתן לו אשה IF HIS LORD HAS GIVEN HIM A WIFE — From this we learn that if he has already an Israelite wife the master has the right to give him a Canaanitish handmaid with the object of raising slaves. Or perhaps this is not so, but Scripture by אשה is speaking about an Israelite woman?! Scripture, however, states: “the wife and her children shall be the master’s”, consequently the text can only be speaking of a Canaanitish woman, for a Hebrew maidservant goes free at the end of six years just as a Hebrew man-servant does — yea, even before the termination of six years she goes free if she shows symptoms of incipient puberty (cf. Rashi v. 7) — for it is said, (Deuteronomy 15:12) “[and if] thy brother, an Hebrew man, or an Hebrew woman, [be sold unto thee, and serve thee six years, then in the seventh year thou shalt let him go free from thee]”, which statement teaches you that a Hebrew woman also goes free after six years’ service (Mekhilta; Kiddushin 14b)."}, {"ch": 21, "v": 5, "aliyah": 1, "heb": "וְאִם־אָמֹ֤ר יֹאמַר֙ הָעֶ֔בֶד אָהַ֙בְתִּי֙ אֶת־אֲדֹנִ֔י אֶת־אִשְׁתִּ֖י וְאֶת־בָּנָ֑י לֹ֥א אֵצֵ֖א חׇפְשִֽׁי׃", "onk": "וְאִם מֵימַר יֵימַר עַבְדָא רָחֵימְנָא יָת רִבּוֹנִי יָת אִתְּתִי וְיָת בְּנָי לָא אֶפּוֹק לְבַר חוֹרִין:", "onk_en": "If the slave explicitly says, “I have come to love my master, my wife and my children, I do not want to go out free.”", "pj": "וְאִין יַתְנֵי וְיֵימַר עַבְדָא רְחֵימְנָא יַת רִבּוֹנִי יַת אִנְתְּתִי וְיַת בְּנַי לָא אֵיפּוֹק לְבַר חוֹרִין", "pj_en": "But if the servant shall affirm and say, I love my master, my wife, and my children, (and) I will not go out free,", "tj": "", "tj_en": "", "rashi": "<b>את אשתי.<\/b> הַשִּׁפְחָה:", "rashi_en": "את אשתי MY WIFE — the Canaanitish handmaid mentioned above."}, {"ch": 21, "v": 6, "aliyah": 1, "heb": "וְהִגִּישׁ֤וֹ אֲדֹנָיו֙ אֶל־הָ֣אֱלֹהִ֔ים וְהִגִּישׁוֹ֙ אֶל־הַדֶּ֔לֶת א֖וֹ אֶל־הַמְּזוּזָ֑ה וְרָצַ֨ע אֲדֹנָ֤יו אֶת־אׇזְנוֹ֙ בַּמַּרְצֵ֔עַ וַעֲבָד֖וֹ לְעֹלָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וִיקָרְבִנֵהּ רִבּוֹנֵהּ <b>לִקֳדָם<\/b> דַיָנַיָא וִיקָרְבִנֵהּ לְוָת דָשָׁא אוֹ לְוָת (נ\"א דִילְוָת) מְזֻזְתָּא וְיַרְצַע רִבּוֹנֵהּ יָת אוּדְנֵהּ בְּמַרְצְעָא וִיהֵי לֵהּ עֲבַד <b>פָּלַח<\/b> לְעָלָם:", "onk_en": "His master must bring him to [<b>before<\/b>] the judges. He must then bring him next to the door, or to the doorpost, and his master shall pierce his ear with an awl. He then serves his master [<b>will be a working servant for him,<\/b>] forever.", "pj": "וִיקַרְבִינֵיהּ רִבּוֹנֵיהּ לִקְדָם דַּיָּינַיָא וְיִסַּב מִנְהוֹן רְשׁוּתָא וִיקַרְבִינֵיהּ לְוַת דָּשָׁא דְּלוּחַ מְזוּזְתָא וִיחַיֵּיט רִבּוֹנֵיהּ יַת אוּדְנֵיהּ יַמִּינָא בְּמַחְטָא וִיהֵי לֵיהּ עָבַד פְּלַח עַד יוּבְלָא", "pj_en": "then his master shall bring him before the judges, and shall receive from them the power, and bring him to the door that hath posts; and his master shall pierce his right ear with an awl; and he shall be a servant to serve him until the jubela.", "tj": "", "tj_en": "", "rashi": "<b>אל האלהים.<\/b> לְבֵית דִּין; צָרִיךְ שֶׁיִּמָּלֵךְ בְּמוֹכְרָיו שֶׁמְּכָרוּהוּ לוֹ (שם):<br><br><b>אל הדלת או אל המזוזה.<\/b> יָכוֹל שֶׁתְּהֵא הַמְּזוּזָה כְשֵׁרָה לִרְצֹעַ עָלֶיהָ, תַּ\"לֹ וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת, בַּדֶּלֶת וְלֹא בַמְּזוּזָה, הָא מַה תַּ\"לֹ אוֹ אֶל הַמְּזוּזָה? הִקִּישׁ דֶּלֶת לִמְזוּזָה, מַה מְּזוּזָה מֵעוֹמֵד אַף דֶּלֶת מֵעוֹמֵד (שם):<br><br><b>ורצע אדניו את אזנו במרצע.<\/b> הַיְמָנִית, אוֹ אֵינוֹ, אֶלָּא שֶׁל שְׂמֹאל? תַּ\"לֹ אֹזֶן אֹזֶן לִגְזֵרָה שָׁוָה, נֶאֱמַר כָּאן וְרָצַע אֲדֹנָיו אֶת אָזְנוֹ, וְנֶאֱמַר בִּמְצֹרָע תְּנוּךְ אֹזֶן הַמִּטַּהֵר הַיְמָנִית (ויקרא י\"ד), מַה לְּהַלָּן הַיְמָנִית, אַף כָּאן הַיְמָנִית; וּמָה רָאָה אֹזֶן לֵרָצַע מִכָּל שְׁאָר אֵבָרִים שֶׁבַּגּוּף? אָמַר רַבָּן יוֹחָנָן בֶּן זַכַּאי: אֹזֶן זֹאת שֶׁשָּׁמְעָה עַל הַר סִינַי לֹא תִגְנֹב, וְהָלַךְ וְגָנַב, תֵּרָצַע. וְאִם מוֹכֵר עַצְמוֹ, אֹזֶן שֶׁשָּׁמְעָה עַל הַר סִינַי כִּי לִי בְנֵי יִשְׂרָאֵל עֲבָדִים, וְהָלַךְ וְקָנָה אָדוֹן לְעַצְמוֹ, תֵּרָצַע. רַבִּי שִׁמְעוֹן הָיָה דּוֹרֵשׁ מִקְרָא זֶה כְּמִין חֹמֶר: מַה נִּשְׁתַּנּוּ דֶּלֶת וּמְזוּזָה מִכָּל כֵּלִים שֶׁבַּבַּיִת? אָמַר הַקָּבָּ\"ה דֶּלֶת וּמְזוּזָה שֶׁהָיוּ עֵדִים בְּמִצְרַיִם כְּשֶׁפָּסַחְתִּי עַל הַמַּשְׁקוֹף וְעַל שְׁתֵּי הַמְּזוּזוֹת וְאָמַרְתִּי כִּי לִי בְנֵי יִשְׂרָאֵל עֲבָדִים – עֲבָדַי הֵם וְלֹא עֲבָדִים לַעֲבָדִים – וְהָלַךְ זֶה וְקָנָה אָדוֹן לְעַצְמוֹ, יֵרָצַע בִּפְנֵיהֶם (קידושין כ\"ב):<br><br><b>ועבדו לעלם.<\/b> עַד הַיּוֹבֵל; אוֹ אֵינוֹ אֶלָּא לְעוֹלָם כְמַשְׁמָעוֹ? תַּ\"לֹ וְאִישׁ אֶל מִשְׁפַּחְתּוֹ תָּשׁוּבוּ (ויקרא כ\"ה), מַגִּיד שֶׁחֲמִשִּׁים שָׁנָה קְרוּיִים עוֹלָם; וְלֹא שֶׁיְּהֵא עוֹבְדוֹ כָּל חֲמִשִּׁים שָׁנָה, אֶלָּא עוֹבְדוֹ עַד הַיּוֹבֵל, בֵּין סָמוּךְ בֵּין מֻפְלָג (קידושין ט\"ו):", "rashi_en": "אל האלהים means to the court. He (the slave) should take counsel with his vendors (the court) because it was they who sold him to him (the master) (Mekhilta).<br><br>אל הדלת או אל המזוזה TO THE DOOR OR TO THE DOORPOST — From this statement you might think that the doorpost is also a proper thing upon which the servant’s ear may be pierced! Scripture, however, states, (Deuteronomy 15:17) “[Then thou shalt take an awl], and thrust it through his ear and into the door” — into the door but not into the doorpost. If this be so, what is the purpose of Scripture stating here “[to the door] or to the doorpost”? By this juxtaposition it only compares the door with the doorpost. What is the characteristic of the doorpost? It is something perpendicular! So, too, the door must during the act of performation be in a perpendicular position (on its hinges), not detached as, for instance, lying on the ground (Mekhilta; Kiddushin 22b).<br><br>ורצע אדניו את אזנו במרצע AND HIS LORD SHALL BORE HIS EAR THROUGH WITH THE AWL — “His ear” means his right ear. Or perhaps this is not so, but Scripture means his left ear? Scripture however uses the term אזן here and it uses אזן in another passage, thereby suggesting an analogy based upon verbal similarity; viz., here it is said “and his lord shall bore his ear (אזנו) through”, and of the leper it is said, (Leviticus 14:25) “and the priest shall put it upon the tip of the right ear (אזנו הימית) of him that is to be cleansed”. — How is it in that latter passage? It is the right ear! So here, too, it is the right ear. — What is the reason that the ear had to be pierced rather than any other limb of the servant’s body? Rabban Jochanan ben Zaccai said: That ear which heard on Mount Sinai, (Exodus 20:13) “Thou shalt not steal” and yet its owner went and stole and was therefore sold as a slave — let it be pierced! Or, in the case of him who sold himself from destitution, having committed no theft, the reason is: That ear which heard on Mount Sinai what I said, (Leviticus 25:55) “For unto Me the children Israel are servants” and yet its owner went and procured for himself another master — let it be pierced! (Mekhilta; Kiddushin 22b). Rabbi Simeon interpreted this verse like a jewel (i. e. giving it an ethical signification): In what respect are door and doorpost different from all other objects in the house that they should be singled out for this purpose? God, in effect, said: door and doorpost that were eye-witnesses in Egypt when I passed over the lintel and the two doorposts, freeing Israel from slavery, and when I said, (Leviticus 25:55) “For unto Me the children of Israel are servants” — servants to Me but not servants of servants (of human beings), and yet this man went and procured another master for himself — let him be pieced in their presence (i. e. let them be eye-witnesses now when this man voluntarily prolongs his state of slavery)! (Kiddushin 22b.)<br><br>ועבדו לעלם AND HE SHALL SERVE HIM FOR EVER — This means until the Jubilee. Or, perhaps this is not so, but לעולם means for ever as is its usual meaning? Scripture however, states, (Leviticus 25:10) “[And ye shall sanctify the fiftieth year and proclaim liberty throughout all the land unto all the inhabitants thereof] and ye shall return every man unto his family”. A comparison of these two passages tells us that a period of fifty years is termed עולם. This does not, however, imply that he has to serve him a whole period of fifty years, but that he has to serve him until the year of the Jubilee (the fiftieth year) whether this be close at hand or far ahead (Kiddushin 15a; Mekhilta)."}, {"ch": 21, "v": 7, "aliyah": 1, "heb": "וְכִֽי־יִמְכֹּ֥ר אִ֛ישׁ אֶת־בִּתּ֖וֹ לְאָמָ֑ה לֹ֥א תֵצֵ֖א כְּצֵ֥את הָעֲבָדִֽים׃", "onk": "וַאֲרֵי יְזַבֵּן גְבַר יָת בְּרַתֵּהּ לְאַמְהוּ לָא תִפּוֹק כְּמַפְקָנוּת עַבְדַיָא:", "onk_en": "If a man sells his daughter to be a maidservant, she shall not go out [free] in the manner of male slaves.", "pj": "וַאֲרוּם יִזְבּוֹן גְּבַר בַּר יִשְרָאֵל יַת בְּרַתֵּיהּ זְעֵירְתָּא לְאַמְהוּ לָא תִיפּוֹק כְּמַפְקָנוּת עַבְדַיָא כְּנַעֲנָאֵי דְּמִשְׁתַּחְרְרִין בְּשִׁינָא וְעֵינָא אֱלָהֵן בִּשְׁנִין דִּשְׁמִיטָתָא וּבְסִימָנַיָא וּבְיוּבְלָא וּבְמוֹתַת רִבּוֹנָהָא וּפוּרְעַן כַּסְפָּא", "pj_en": "And if a man of Israel sell his daughter, a little handmaid, she shall not go forth according to the going forth of the servants of the Kenaanaee, who are set at liberty on account of the tooth or the eye; but in the years of remission, and with tokens, and at the jubela, and on the death of her master, and by redemption with money.", "tj": "", "tj_en": "", "rashi": "<b>וכי ימכר איש את בתו לאמה.<\/b> בִּקְטַנָּה הַכָּתוּב מְדַבֵּר; יָכוֹל אֲפִלּוּ הֵבִיאָה סִימָנִים, אָמַרְתָּ קַל וָחֹמֶר, וּמַה מְּכוּרָה קֹדֶם לָכֵן יוֹצְאָה בְסִימָנִין – כְּמוֹ שֶׁכָּתוּב וְיָצְאָה חִנָּם אֵין כָּסֶף, שֶׁאָנוּ דּוֹרְשִׁין אוֹתוֹ לְסִימָנֵי נַעֲרוּת – שֶׁאֵינָהּ מְכוּרָה אֵינוֹ דִּין שֶׁלֹּא תִמָּכֵר (ערכין כ\"ט):<br><br><b>לא תצא כצאת העבדים.<\/b> כִּיצִיאַת עֲבָדִים כְּנַעֲנִים שֶׁיּוֹצְאִים בְּשֵׁן וָעַיִן, אֲבָל זוֹ לֹא תֵצֵא בְּשֵׁן וָעַיִן אֶלָּא עוֹבֶדֶת שֵׁשׁ, אוֹ עַד הַיּוֹבֵל, אוֹ עַד שֶׁתָּבִיא סִימָנִין, וְכָל הַקּוֹדֵם קוֹדֵם לְחֵרוּתָהּ, וְנוֹתֵן לָהּ דְּמֵי עֵינָהּ אוֹ דְּמֵי שִׁנָּהּ. אוֹ אֵינוֹ אֶלָּא לֹא תֵצֵא כְּצֵאת הָעֲבָדִים בְּשֵׁשׁ וּבַיּוֹבֵל? תַּ\"לֹ כִּי יִמָּכֵר לְךָ אָחִיךָ הָעִבְרִי אוֹ הָעִבְרִיָּה, מַקִּישׁ עִבְרִיָּה לְעִבְרִי לְכָל יְצִיאוֹתָיו, מָה עִבְרִי יוֹצֵא בְשֵׁשׁ וּבַיּוֹבֵל, אַף עִבְרִיָּה יוֹצְאָה בְשֵׁשׁ וּבַיּוֹבֵל, וּמַהוּ לֹא תֵצֵא כְּצֵאת הָעֲבָדִים? לֹא תֵצֵא בְרָאשֵׁי אֵבָרִים כַּעֲבָדִים כְּנַעֲנִיִּים; יָכוֹל הָעִבְרִי יוֹצֵא בְרָאשֵׁי אֵבָרִים? תַּ\"לֹ הָעִבְרִי אוֹ הָעִבְרִיָּה, מַקִּישׁ עִבְרִי לְעִבְרִיָּה, מָה הָעִבְרִיָּה אֵינָהּ יוֹצְאָה בְרָאשֵׁי אֵבָרִים, אַף הוּא אֵינוֹ יוֹצֵא בְרָאשֵׁי אֵבָרִים (מכילתא):", "rashi_en": "וכי ימכר איש את בתו לאמה AND IF A MAN SELL HIS DAUGHTER TO BE A MAIDSERVANT — The text speaks of a minor daughter (under 12 years of age). You might think that he may sell her also although she may have shown signs of incipient puberty and is no longer a minor! You must admit, however, that the à fortiori argument applies: How is it in the case of a woman who was sold at an earlier age (as a minor)? She goes free on showing signs of incipient puberty, as it is said, (v. 11) “then shall she go out free without money”, which law we explain to refer to a woman who has showed such signs during the period of slavery! Is it not the conclusion that she who is of such an age and has not yet been sold shall not be sold at all?! (Arakhin 29b, cf. Mekhilta).<br><br>לא תצא כצאת העבדים SHE SHALL NOT GO OUT AS THE MENSERVANTS DO — i. e. not under the circumstances that the Canaanitish menservants’ departure takes place, for these go free in consequence of the loss of their tooth or eye inflicted by their master; this woman, however, shall not go free because of such loss of her tooth or eye, but shall serve either six years or until the Jubilee, or until she shows signs of incipient puberty. Whichsoever of these periods comes first brings her freedom first. — He (the master), however, has to pay her the value of her eye or the value of her tooth. — Or perhaps this is not so, but, “she shall not go out as the men-servants do,” means she shall not go free as the Hebrew menservants do, viz., at the end of six years or at the Jubilee? Scripture, however, states, (Deuteronomy 15:12) And if thy brother, an Hebrew man or an Hebrew woman be sold unto thee”, comparing the Hebrew woman with the Hebrew man in regard to all reasons for departure (i. e. also with regard to her going free in the Jubilee, for that she goes free in the seventh year is stated in the text just quoted). How is it in the case of a Hebrew man? He goes free at the end of six years and at the Jubilee! So, too, does the Hebrew woman go free at the end of six years and at the Jubilee. What then do these words mean: “she shall not go out as the menservants do”? They mean: she shall not go free in consequence of the loss of one of “the tips of her limbs” (i. e. the ends of limbs that project from the body) (cf. Mishnah Negaim 6:7) inflicted by the master, as the Canaanitish servants do when they that lose “the tips of their limbs” (Mekhilta; Kiddushin 20a). Incidentally I may add that you might think that the Hebrew manservant shall go free in consequence of loss of one of the tips of his limbs and that only the Hebrew maidservant differs in this respect from the Canaanitish servant, since Scripture expressly specified her in the words: she shall not go out free etc. Scripture, however, states “an Hebrew man or an Hebrew woman” thereby comparing the Hebrew man with the Hebrew woman. What is the case with the Hebrew woman? She does not go free in consequence of loss of one of “the tips of her limbs”! So, too, the Hebrew man does not go free as compensation for the injury inflicted on one of “the tips of his limbs” (cf. Mekhilta)."}, {"ch": 21, "v": 8, "aliyah": 1, "heb": "אִם־רָעָ֞ה בְּעֵינֵ֧י אֲדֹנֶ֛יהָ אֲשֶׁר־<span class=\"mam-kq\"><span class=\"mam-kq-q\">[ל֥וֹ]<\/span> <span class=\"mam-kq-k\">(לא)<\/span><\/span> יְעָדָ֖הּ וְהֶפְדָּ֑הּ לְעַ֥ם נׇכְרִ֛י לֹא־יִמְשֹׁ֥ל לְמׇכְרָ֖הּ בְּבִגְדוֹ־בָֽהּ׃", "onk": "אִם בִּישָׁא בְּעֵינֵי רִבּוֹנַהּ <b>דִיקַיְמַהּ לֵהּ<\/b> וְיִפְרְקִנַהּ <b>לִגְבַר אָחֳרָן<\/b> לֵית לֵהּ רְשׁוּ לְזַבּוֹנַהּ <b>בְּמִשְׁלְטֵהּ<\/b> בַהּ:", "onk_en": "If she is displeasing to her master, who had not designated [<b>for otherwise he would have designated<\/b>] her as his wife, he must allow her to be redeemed. He has no power [right] to sell her to an alien people [<b>another man<\/b>] for he has dealt deceitfully with [<b>controlled<\/b>] her.", "pj": "אִין לָא אַשְׁכַּחַת חִינָא קֳדָם רִבּוֹנָהָא דְּזַבִּין יָתָהּ וְיִפְרוֹק יָתָהּ אָבוּהָא לִגְבַר אוֹחֲרָן לֵית לֵיהּ רְשׁוּ לִזְבּוֹנָהּ חֲלַף דְּמַנִי מָרָהּ רְשׁוּתֵיהּ עֲלָהּ", "pj_en": "If she hath not found favour before her master who bought her, then her father may redeem her; but to a foreigner he shall not have power to sell her; for as a vessel of her Lord he hath power over her.", "tj": "", "tj_en": "", "rashi": "<b>אם רעה בעיני אדניה.<\/b> שֶׁלֹּא נָשְׂאָה חֵן בְּעֵינָיו לְכָנְסָהּ:<br><br><b>אשר לא יעדה.<\/b> שֶׁהָיָה לוֹ לְיַעֲדָהּ וּלְהַכְנִיסָהּ לוֹ לְאִשָּׁה, וְכֶסֶף קְנִיָּתָהּ הוּא כֶסֶף קִדּוּשֶׁיהָ; וְכָאן רָמַז לְךָ הַכָּתוּב שֶׁמִּצְוָה בְּיִעוּד, וְרָמַז לְךָ שֶׁאֵינָהּ צְרִיכָה קִדּוּשִׁין אֲחֵרִים (קידושין י\"ח):<br><br><b>והפדה.<\/b> יִתֵּן לָהּ מָקוֹם לְהִפָּדוֹת וְלָצֵאת – שֶׁאַף הוּא מְסַיֵּעַ בְּפִדְיוֹנָהּ; וּמַה הוּא מָקוֹם שֶׁנּוֹתֵן לָהּ? שֶׁמְּגָרֵעַ מִפִּדְיוֹנָהּ בְּמִסְפַּר הַשָּׁנִים שֶׁעָשְׂתָה אֶצְלוֹ כְּאִלּוּ הִיא שְׂכוּרָה אֶצְלוֹ. כֵּיצַד? הֲרֵי שֶׁקְּנָאָהּ בְּמָנֶה וְעָשְׂתָה אֶצְלוֹ שְׁתֵּי שָׁנִים, אוֹמְרִים לוֹ, יוֹדֵעַ הָיִיתָ שֶׁעֲתִידָה לָצֵאת לְסוֹף שֵׁשׁ, נִמְצָא שֶׁקָּנִיתָ עֲבוֹדַת כָּל שָׁנָה וְשָׁנָה בְּשִׁשִּׁית הַמָּנֶה, וְעָשְׂתָה אֶצְלְךָ שְׁתֵּי שָׁנִים, הֲרֵי שְׁלִישִׁית הַמָּנֶה, טֹל שְׁנֵי שְׁלִישִׁיּוֹת הַמָּנֶה וְתֵצֵא מֵאֶצְלְךָ:<br><br><b>לעם נכרי לא ימשל למכרה.<\/b> שֶׁאֵינוֹ רַשַּׁאי לְמָכְרָהּ לְאַחֵר לֹא הָאָדוֹן וְלֹא הָאָב (שם):<br><br><b>בבגדו בה.<\/b> אִם בָּא לִבְגֹּד בָּהּ, שֶׁלֹּא לְקַיֵּם בָּהּ מִצְוַת יִעוּד, וְכֵן אָבִיהָ מֵאַחַר שֶׁבָּגַד בָּהּ וּמְכָרָהּ לָזֶה:", "rashi_en": "אם רעה בעיני אדניה IF SHE BE EVIL IN THE EYES OF HER LORD — i. e. that she did not find favour in his eyes so that he might be induced to marry her (cf. Mekhilta).<br><br>אשר לו יעדה means: [IF SHE BE EVIL IN THE EYES OF HER LORD] WHO OUGHT TO HAVE DESIGNATED HER to be his wife and ought to have married her, her purchase-money serving as the money necessary to contract a marriage (כסף קידושין). Scripture hereby implicitly tells you that it is his duty to designate her for himself, and since it makes no mention of the manner in which the marriage is to be contracted it implicitly tells you at the same time that she requires no other rite of marriage than the passing of the purchase-money from the master to her father (cf. Kiddushin 19a, Bekhorot 13a).<br><br>והפדה means he shall afford her the opportunity to obtain her release from service — that he himself must cooperate in respect to the amount of her ransom. And what is this opportunity he has to give her? That he allows her a deduction from her ransom corresponding to the number of years she has served in his house, as though she were only hired by him. How can this be done? Supposing he had bought her for a maneh (one hundred shekels) and she had served him two years. We say to him: “You knew that she was to go free at the end of six years; it follows then that you bought the labour of each year for one sixth of a maneh. Now she has served you two years, that is the equivalent of one-third of the maneh: accept therefore two-thirds of a maneh as a ransom and let her go free out of your house (Kiddushin 14b).<br><br>לעם נכרי לא ימשל למכרה means that neither the master nor the father has a right to sell her to another Jewish man (Kiddushin 18a),<br><br>בבגדו בה SEEING THAT HE HATH DEALT DECEITFULLY WITH HER — If “he” means the master then these words signify: if he intends to deal faithlessly with her, i. e. if he does not intend to fulfil the commandment of “Jiud” (of designating her to himself). So also the father — he has no right to sell her to another man since he has dealt faithlessly with her as a father having sold her to this man (Mekhilta; Kiddushin 18b)."}, {"ch": 21, "v": 9, "aliyah": 1, "heb": "וְאִם־לִבְנ֖וֹ יִֽיעָדֶ֑נָּה כְּמִשְׁפַּ֥ט הַבָּנ֖וֹת יַעֲשֶׂה־לָּֽהּ׃", "onk": "וְאִם לִבְרֵהּ יְקַיְמִנַהּ כְּהִלְכַת בְּנַת <b>יִשְׂרָאֵל<\/b> יַעְבֵּד לַהּ:", "onk_en": "If he has designated her as a wife for his son, he must grant her exactly the same rights as daughters [<b>of Yisrael<\/b>].", "pj": "וְאִין לְצֵיד בְּרֵיהּ זַמִּין יָתָהּ כְּהִלְכַת בְּנַת יִשְרָאֵל יַעֲבִיד לָהּ", "pj_en": "And if he had intended her for the side of his son, he shall do by her after the manner of the daughters of Israel.", "tj": "", "tj_en": "", "rashi": "<b>ואם לבנו ייעדנה.<\/b> הָאָדוֹן; מְלַמֵּד שֶׁאַף בְּנוֹ קָם תַּחְתָּיו לְיַעֲדָהּ אִם יִרְצֶה אָבִיו, וְאֵינוֹ צָרִיךְ לְקַדְּשָׁהּ קִדּוּשִׁין אֲחֵרִים, אֶלָּא אוֹמֵר לָהּ הֲרֵי אַתְּ מְיֹעֶדֶת לִי בַּכֶּסֶף שֶׁקִּבֵּל אָבִיךְ בְּדָמַיִךְ:<br><br><b>כמשפט הבנות.<\/b> שְׁאֵר כְּסוּת וְעוֹנָה (מכילתא):", "rashi_en": "ואם לבנו יעדנה AND IF HE HATH BETROTHED HER TO HIS SON — “He” means the master (not like “he” in the previous verse where it refers both to the master and to the father). The verse teaches you that the son also may succeed to his father’s rights to betroth her to himself, if his father consents to it. Then it is not necessary for him either (just as is not obligatory for his father; cf. v. 8) to perform another act of betrothal, but he merely says to her: “You are designated for me as my wife by means of the money which your father has received from my father as your price” (Kiddushin 19a).<br><br>כמשפט הבנות [HE SHALL DO UNTO HER] AFTER THE MANNER OF DAUGHTERS — who may claim food, clothing and marital duty (Mekhilta)."}, {"ch": 21, "v": 10, "aliyah": 1, "heb": "אִם־אַחֶ֖רֶת יִֽקַּֽח־ל֑וֹ שְׁאֵרָ֛הּ כְּסוּתָ֥הּ וְעֹנָתָ֖הּ לֹ֥א יִגְרָֽע׃", "onk": "אִם אָחֳרַנְתָּא יִסַב לֵהּ זִיוּנַהּ כְּסוּתַהּ וְעוֹנָתַהּ לָא יִמְנָע:", "onk_en": "If he takes himself another [wife], her sustenance, her clothing and her conjugal rights he must not diminish.", "pj": "אִין אוֹחֲרַנְתָּא בַּת יִשְרָאֵל יִסַב לֵיהּ עֲלָהּ מְזוֹנָהּ וְתַכְשִׁיטָהּ וּמְעַיֵּל לָהּ לָא יִמְנַע לָהּ", "pj_en": "If he take another daughter of Israel to him beside her, her food, her adorning, and her conjugal rights, he shall not withhold from her.", "tj": "וְאִם אִתָּא אוֹחֲרֵי יִסַב עֲלָהּ מְזוֹנָהּ תַּכְשִׁיטָהּ מֵעַיְלָהּ וּמַפְקָהּ לְוָותָהּ לָא יִמְנַע מִינָהּ:", "tj_en": "And if he take another wife beside her, of her food, her adorning, and her going in and coming out with him, he shall not deprive her.", "rashi": "<b>אם אחרת יקח לו.<\/b> עָלֶיהָ:<br><br><b>שארה כסותה וענתה לא יגרע.<\/b> מִן הָאָמָה שֶׁיָּעַד לוֹ כְבָר:<br><br><b>שארה.<\/b> מְזוֹנוֹת:<br><br><b>כסותה.<\/b> כְּמַשְׁמָעוֹ.<br><br><b>ענתה.<\/b> תַּשְׁמִישׁ (כתובות מ\"ז):", "rashi_en": "אם אחרת יקח לו IF HE TAKE HIM ANOTHER WIFE — besides her,<br><br>שארה כסותה וענתה לא יגרע HER FOOD, HER RAIMENT AND THE MARITAL DUTY SHALL HE NOT WITHHOLD — from the maidservant whom he has already designated as his wife.<br><br>שארה means FOOD;<br><br>כסותה means what the literal sense of the word is:RAIMENT;<br><br>ענתה means THE MARITAL DUTY (Ketuvot 47b)."}, {"ch": 21, "v": 11, "aliyah": 1, "heb": "וְאִ֨ם־שְׁלׇשׁ־אֵ֔לֶּה לֹ֥א יַעֲשֶׂ֖ה לָ֑הּ וְיָצְאָ֥ה חִנָּ֖ם אֵ֥ין כָּֽסֶף׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאִם תְּלָת אִלֵין לָא יַעְבֵּד לַהּ וְתִפּוֹק מַגָן בְּלָא כְסַף:", "onk_en": "If he does not do these three things to her, she goes out free with no repayment of money.", "pj": "אִין תְּלַת מִילַיָיא הָאִלֵּין לָא יַעֲבֵיד לָהּ לִמְזַמְנָא יָתָהּ לֵיהּ אוֹ לִבְרֵיהּ אוֹ לְמִפְרְקָא לְבַר אָבוּהָא וְתִיפּוֹק מַגָּן בְּלָא כְסַף בְּרַם גֵּט פְּטוּרִין יָהִיב לָהּ", "pj_en": "And if these three things he doth not for her, to covenant her to himself, or to his son, or to release her into the hand of her father, she shall go free without payment, and a writing of release he shall give her.", "tj": "", "tj_en": "", "rashi": "<b>ואם שלש אלה לא יעשה לה.<\/b> אִם אַחַת מִשְּׁלֹשׁ אֵלֶּה לֹא יַעֲשֶׂה לָהּ; וּמָה הֵן הַשָּׁלֹשׁ? יִיעָדֶנָּה לוֹ, אוֹ לִבְנוֹ, אוֹ יְגָרֵעַ מִפִּדְיוֹנָהּ וְתֵצֵא, וְזֶה לֹא יְעָדָהּ, לֹא לוֹ וְלֹא לִבְנוֹ, וְהִיא לֹא הָיָה בְיָדָהּ לִפְדּוֹת אֶת עַצְמָהּ:<br><br><b>ויצאה חנם.<\/b> רִבָּה לָהּ יְצִיאָה לָזוֹ יוֹתֵר מִמַּה שֶּׁרִבָּה לָעֲבָדִים, וּמַה הִיא הַיְצִיאָה? לִמֶּדְךָ שֶׁתֵּצֵא בְסִימָנִין וְתִשְׁהֶה עִמּוֹ עוֹד עַד שֶׁתָּבִיא סִימָנִין, – וְאִם הִגִּיעוּ שֵׁשׁ שָׁנִים קֹדֶם סִימָנִין, כְּבָר לָמַדְנוּ שֶׁתֵּצֵא, שֶׁנֶּאֱמַר הָעִבְרִי אוֹ הָעִבְרִיָּה וַעֲבָדְךָ שֵׁשׁ שָׁנִים (דברים ט\"ו) – וּמַהוּ הָאָמוּר כָּאן וְיָצְאָה חִנָּם? שֶׁאִם קָדְמוּ סִימָנִים לְשֵׁשׁ שָׁנִים תֵּצֵא בָהֵן. אוֹ אֵינוֹ אוֹמֵר שֶׁתֵּצֵא אֶלָּא בְּבַגְרוּת? תַּ\"לֹ אֵין כָּסֶף לְרַבּוֹת יְצִיאַת בַּגְרוּת; וְאִם לֹא נֶאֶמְרוּ שְׁנֵיהֶם הָיִיתִי אוֹמֵר וְיָצְאָה חִנָּם זוֹ בַגְרוּת, לְכָךְ נֶאֶמְרוּ שְׁנֵיהֶם שֶׁלֹּא לִתֵּן פִּתְחוֹן פֶּה לְבַעַל הַדִּין לַחֲלֹק (מכילתא):", "rashi_en": "ואם שלש אלה לא יעשה לה means IF HE DO NOT one of THESE THREE UNTO HER. What are these three? He should designate her to himself as his wife, or to his son, or allow her a deduction from the ransom so that she may go free (Mekhilta). This man, however, has neither betrothed her to himself, nor to his son, and she herself does not possess the entire sum paid for her originally that she might buy herself out, therefore shall she go out free without money.<br><br>ויצאה חנם THEN SHALL SHE GO OUT FOR NOTHING (i. e. without making any payment) — Scripture adds in her case one more way of acquiring freedom than it provides for menservants. What is this additional way of acquiring freedom? This verse teaches you that she goes free also on account of having shown signs of incipient puberty: but she must stay with him until she reaches this stage of incipient puberty. For that she goes free if the termination of the six years happened to come before the signs of incipient puberty we have already learned, since it is said, (Deuteronomy 15:12) ,‘[and if thy brother], an Hebrew man, or an Hebrew woman [be sold unto thee], and serve thee six years [then in the seventh year thou shalt let him go free from thee]” (cf. Rashi v. 7). What then must be the meaning of what is stated here, “she shall go out for nothing”? That when the signs of incipient puberty appear before the six years are at end she shall go out on account of them. Or perhaps Scripture states here that she shall go free only when she has reached the intermediate stage of womenhood (בגרות, fuller development after twelve years and a half), if this stage happened to be reached before the termination of the six years! To teach this Scripture states “without money” — which would be superfluous since it has already said “she shall go out חנם” — in order to add as another date of her acquiring freedom the time of her reaching this stage of womanhood. And though it necessarily follows that she goes free an reaching the state of בגרות since her freedom is brought about even by the earlier stage of נערות yet if Scripture had not used both terms (both חנם and אין כסף), I might have said that ויצאה חנם refers to the stage of womanhood; therefore both expressions are used in order to give a disputant no opportunity to offer a different explanation (i. e. Scripture wishes to be quite clear on the point in order to preclude all possibility of misunderstanding) (Mekhilta; Kiddushin 4a)."}, {"ch": 21, "v": 12, "aliyah": 1, "heb": "מַכֵּ֥ה אִ֛ישׁ וָמֵ֖ת מ֥וֹת יוּמָֽת׃", "onk": "דְיִמְחֵי לֶאֱנַשׁ וְיִקְטְלִנֵהּ אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "If one strikes a man and he [the victim] dies, he shall be put to death.", "pj": "דְּיִמְחֵי לְבַר יִשְרָאֵל אוֹ לְבַת יִשְרָאֵל וְיִקְטְלִינֵיהּ אִתְקְטָלָא יִתְקְטֵיל בִּסְיָיפָא", "pj_en": "Whosoever smiteth a son or a daughter of Israel, so as to cause death, shall be put to death with the sword.", "tj": "", "tj_en": "", "rashi": "<b>מכה איש ומת.<\/b> כַּמָּה כְתוּבִים נֶאֶמְרוּ בְּפָרָשַׁת רוֹצְחִין, וּמַה שֶּׁבְּיָדִי לְפָרֵשׁ לָמָּה בָאוּ כֻלָּם, אֲפָרֵשׁ:<br><br><b>מכה איש ומת.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר וְאִישׁ כִּי יַכֶּה כָּל נֶפֶשׁ אָדָם (ויקרא כ\"ד), שׁוֹמֵעַ אֲנִי הַכָּאָה בְלֹא מִיתָה, תַּלְמוּד לוֹמַר מַכֵּה אִישׁ וָמֵת – אֵינוֹ חַיָּב אֶלָּא בְּהַכָּאָה שֶׁל מִיתָה; וְאִם נֶאֱמַר מַכֵּה אִישׁ וְלֹא נֶאֱמַר וְאִישׁ כִּי יַכֶּה, הָיִיתִי אוֹמֵר אֵינוֹ חַיָּב עַד שֶׁיַּכֶּה אִישׁ, הִכָּה אֶת הָאִשָּׁה וְאֶת הַקָּטָן מִנַּיִן? תַּ\"לֹ כִּי יַכֶּה כָּל נֶפֶשׁ אָדָם – אֲפִלּוּ קָטָן וַאֲפִלּוּ אִשָּׁה; וְעוֹד, אִלּוּ נֶאֱמַר מַכֵּה אִישׁ, שׁוֹמֵעַ אֲנִי אֲפִלּוּ קָטָן שֶׁהִכָּה וְהָרַג יְהֵא חַיָּב, תַּ\"לֹ וְאִישׁ כִּי יַכֶּה, וְלֹא קָטָן שֶׁהִכָּה; וְעוֹד כִּי יַכֶּה כָּל נֶפֶשׁ אָדָם אֲפִלּוּ נְפָלִים בְּמַשְׁמָע, תַּ\"לֹ מַכֵּה אִישׁ, אֵינוֹ חַיָּב עַד שֶׁיַּכֶּה בֶן קַיָּמָא הָרָאוּי לִהְיוֹת אִישׁ (מכילתא):", "rashi_en": "מכה איש ומת WHOSOEVER SMITETH A MAN SO THAT HE DIE [SHALL SURELY BE PUT TO DEATH] — Many apparently redundant verses have been written in various sections of the Torah dealing with murderers and I shall explain to the best of my ability why all these statements have been made.<br><br>מכה איש ומת WHOSOEVER SMITETH A MAN SO THAT HE DIE — Why is this said (how does the particular form of words used here tell us some point of law which is not contained in another text bearing upon the same subject)? Since it is said, (Leviticus 24:17) “And the man that smiteth (יכה) any person (more lit., the soul of any human being) [shall surely be put to death]”, I might have inferred that mere smiting without resultant death is subject to the death penalty. Scripture therefore states here, “Whosoever smiteth a man so that he die [shall surely be put to death]”, thus telling you that he is not punishable with death unless the stroke proves fatal. On the other hand if it had stated here, “Whosoever smiteth a man…” and it had not said there “If a man smiteth [any person]”, I might have inferred that the murderer is not guilty except if he killed “a man”; whence, however, could I know that he is subject to the death penalty if he killed a woman or a minor? Therefore Scripture states “And if [a man] smiteth any person”, thus including even a minor and a woman. Then again: if it had stated only, “Whosoever smiteth a man” I might have inferred that even a minor who smote and killed a person is punishable with death. Scripture therefore states “and if a man smiteth” — a man but not a minor. Then on the other hand, so far as concerns the statement “And if [a man] smiteth the soul of any man” it might be held that even premature births at a term of eight months are included in the term כל נפש אדם “soul of any man”, Scripture therefore states “Whosoever smiteth a man” to intimate that one is not subject to the death penalty unless he kills a viable child — one which is fitted to become a man (Mekhilta)."}, {"ch": 21, "v": 13, "aliyah": 1, "heb": "וַאֲשֶׁר֙ לֹ֣א צָדָ֔ה וְהָאֱלֹהִ֖ים אִנָּ֣ה לְיָד֑וֹ וְשַׂמְתִּ֤י לְךָ֙ מָק֔וֹם אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּדְלָא כְמַן לֵהּ <b>וּמִן קֳדָם<\/b> יְיָ <b>אִתִּמְסַר<\/b> לִידֵהּ וֶאֱשַׁוִי לָךְ אֲתַר דִי יֵעִרוֹק לְתַמָן:", "onk_en": "But if he did not lie in wait [to ambush him] but [<b>from before<\/b>] God [<b>he was<\/b>] brought it to his hand, then I will designate for you a place, to which he can flee [and find refuge].", "pj": "וְדִי לָא אִיזְדַוֵּיג לֵיהּ וּמִן קֳדָם יְיָ אֲרַע עִיקְתֵיהּ לִידוֹי וַאֲזַמֵן לָךְ אֲתַר דְּיַעֲרוֹק לְתַמָּן", "pj_en": "But he who did not attack him, but mischance from before the Lord befell him at his hand, I will appoint thee a place where he may flee.", "tj": "", "tj_en": "", "rashi": "<b>ואשר לא צדה.<\/b> לֹא אָרַב לוֹ וְלֹא נִתְכַּוֵּן:<br><br><b>צדה.<\/b> לְשׁוֹן אָרַב, וְכֵן הוּא אוֹמֵר \"וְאַתָּה צֹדֶה אֶת נַפְשִׁי\" (שמואל א כ\"ד); וְלֹא יִתָּכֵן לוֹמַר צָדָה לְשׁוֹן \"הַצָּד צַיִד\" (בראשית כ\"ז), שֶׁצִּידַת חַיּוֹת אֵין נוֹפֵל ה\"א בְּפֹעַל שֶׁלָּהּ, וְשֵׁם דָּבָר בָּהּ צַיִד, וְזֶה שֵׁם דָּבָר בּוֹ צְדִיָּה, וּפֹעַל שֶׁלּוֹ צוֹדֶה, וְזֶה הַפֹּעַל שֶׁלּוֹ צָד. וְאוֹמֵר אֲנִי פִּתְרוֹנוֹ כְּתַרְגּוּמוֹ – וּדְלָא כְמַן לֵהּ. וּמְנַחֵם חִבְּרוֹ בְּחֵלֶק צָד צַיִד, וְאֵין אֲנִי מוֹדֶה לוֹ; וְאִם יֵשׁ לְחַבְּרוֹ בְּאַחַת מִמַּחְלָקוֹת שֶׁל צָד, נְחַבְּרֶנּוּ בְחֵלֶק \"עַל צַד תִּנָּשֵׂאוּ\" (ישעיהו ס\"ו), \"צִדָּה אוֹרֶה\" (שמואל א כ'), \"וּמִלִּין לְצַד עִלָּאָה יְמַלֵּל\" (דניאל ז'), אַף כָּאן אֲשֶׁר לֹא צָדָה – לֹא צִדֵּד לִמְצֹא לוֹ שׁוּם צַד מִיתָה; וְאַף זֶה יֵשׁ לְהַרְהֵר עָלָיו, מִכָּל מָקוֹם לְשׁוֹן אוֹרֵב הוּא:<br><br><b>והאלהים אנה לידו.<\/b> זִמֵּן לְיָדוֹ, לְשׁוֹן \"לֹא תְאֻנֶּה אֵלֶיךָ רָעָה\" (תהילים צ\"א), \"לֹא יְאֻנֶּה לַצַּדִּיק כָּל אָוֶן\" (משלי י\"ב), \"מִתְאַנֶּה הוּא לִי\" (מלכים ב ה') – מִזְדַּמֵּן לִמְצֹא לִי עִלָּה:<br><br><b>והאלהים אנה לידו.<\/b> וְלָמָּה תֵצֵא זֹאת מִלְּפָנָיו? הוּא שֶׁאָמַר דָּוִד \"כַּאֲשֶׁר יֹאמַר מְשַׁל הַקַּדְמֹנִי מֵרְשָׁעִים יֵצֵא רֶשַׁע\" (שמואל א כ\"ד); וּמְשַׁל הַקַּדְמוֹנִי הִיא הַתּוֹרָה, שֶׁהִיא מְשַׁל הַקָּבָּ\"ה שֶׁהוּא קַדְמוֹנוֹ שֶׁל עוֹלָם; וְהֵיכָן אָמְרָה תוֹרָה מֵרְשָׁעִים יֵצֵא רֶשַׁע? וְהָאֱלֹהִים אִנָּה לְיָדוֹ. בַּמֶּה הַכָּתוּב מְדַבֵּר? בִּשְׁנֵי בְנֵי אָדָם, אֶחָד הָרַג שׁוֹגֵג וְאֶחָד הָרַג מֵזִיד, וְלֹא הָיוּ עֵדִים בַּדָּבָר שֶׁיָּעִידוּ, זֶה לֹא נֶהֱרַג, וְזֶה לֹא גָלָה, וְהַקָּבָּ\"ה מְזַמְּנָן לְפֻנְדָק אֶחָד, זֶה שֶׁהָרַג בְּמֵזִיד יוֹשֵׁב תַּחַת הַסֻּלָּם וְזֶה שֶׁהָרַג שׁוֹגֵג עוֹלֶה בַּסֻּלָּם וְנוֹפֵל עַל זֶה שֶׁהָרַג בְּמֵזִיד וְהוֹרְגוֹ, וְעֵדִים מְעִידִים עָלָיו וּמְחַיְּבִים אוֹתוֹ לִגְלוֹת, נִמְצָא זֶה שֶׁהָרַג בְּשׁוֹגֵג גּוֹלֶה, וְזֶה שֶׁהָרַג בְּמֵזִיד נֶהֱרָג (מכות י'):<br><br><b>ושמתי לך מקום.<\/b> אַף בַּמִּדְבָּר, שֶׁיָּנוּס שָׁמָּה, וְאֵי זֶה מָקוֹם קוֹלְטוֹ? זֶה מַחֲנֵה לְוִיָּה (מכילתא):", "rashi_en": "ואשר לא צדה AND IF A MAN LIE NOT IN WAIT — i. e. if he did not lie in ambush for him (the person whom he killed), nor did he premeditate the blow (Makkot 7b).<br><br>צדה is a term denoting “lying in wait”; similarly it says, (I Samuel 24:12) “yet thou liest in wait (צדה) for my soul to take it”. It is, however, not correct to say that צדה is of the same derivation as, (Genesis 27:34) הצד ציד “he that hath hunted (הצד) venison”, for a ה has no place in the verbal forms of the term denoting “hunting beasts”. Then again, the noun form of the latter is צַיִד and that of the former צְדִיָה, whilst the participle of the verb “lying in wait” is צוֹדֶה and that of the other is צָד. I therefore say that its meaning is as the Targum gives it: “and if he did not lie in ambush for him”. Menachem ben Seruk placed it in the same section as הצד ציד (i. e. he held that the root is צד and that it has the meaning of “hunting”), but I do not agree with him. If it is to be placed in one of the sections of צד we had better place it in the same section as, (Isaiah 66:12) על צד תנשאו “ye shall be borne upon her side (צד)” and (I Samuel 20:20) “and I will shoot [three arrows] on the side thereof (צדה)”, and (Daniel 7:25) “and he shall speak towards the side of (against) the Most High”. Thus, here, the words אשד לא צדה could be taken to mean, “he did not turn aside (צִדֵּד)” to seek some side (occasion) for killing him. But there are objections even to this explanation. At any rate, even if it be connected with צד in this sense, it would still have the meaning “lying in wait”.<br><br>והאלהים אנה לידו means, BUT GOD GOT IT READY FOR HIS HAND. It has the same meaning as this root has in, (Psalms 91:10) “No evil shall be got ready (תאנה) for thee”; (Proverbs 12:21) “There shall no evil be got ready (תאנה) for the just”; (2 Kings 5:7) “he gets himself ready (מתאנה) for me”, i. e. he gets himself ready to discover some occasion against me.<br><br>והאלהים אנה לידו BUT GOD GOT IT READY FOR HIS HAND — But why should this go forth from Him (be brought about by God)? This is just what David tells us: (I Samuel 24:13) “As says the proverb of the ancient (הקדמני) “Wickedness proceededeth from the wicked”. — “The proverb of the קדמני” is the Torah, the maxim of God, Who it the “Ancient” (Whose existence preceded that) of the world. But where indeed does the Torah say, “Wickedness proceedeth from the wicked”? It says it implicitly in the verse: “But God got it ready for his hand”. For what is Scripture here speaking about? About two men, one of whom killed a person with premeditation and the other killed inadvertently, and in neither case were there witnesses to the deed who could testify about it. Consequently, the former was not put to death and the latter was not forced into banishment to a city of refuge (cf. Numbers 35:11). Now God brings them together at the same inn. He who killed with premeditation happens to sit beneath a ladder, and the other who killed inadvertently ascends the ladder and falls, when descending it, upon the man who killed with premeditation and kills him. Witnesses now being present they testify against him, so compelling him to be banished to one of the cities of refuge. The result is that he who killed inadvertently is actually banished and he who killed with premeditation actually suffers death (cf. Mekhilta and Makkot 10b).<br><br>ושמתי לך מקום AND I WILL APPOINT THEE A PLACE — in the wilderness also — WHITHER HE SHALL FLEE — Which was the place that offered him an asylum? The camp of the Levites (Mekhilta; Makkot 12b)."}, {"ch": 21, "v": 14, "aliyah": 1, "heb": "וְכִֽי־יָזִ֥ד אִ֛ישׁ עַל־רֵעֵ֖הוּ לְהׇרְג֣וֹ בְעׇרְמָ֑ה מֵעִ֣ם מִזְבְּחִ֔י תִּקָּחֶ֖נּוּ לָמֽוּת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וַאֲרֵי יַרְשַׁע גְבַר עַל חַבְרֵהּ לְמִקְטְלֵהּ בִנְכִילוּ מִן מַדְבְּחִי תִּדְבְּרִנֵהּ לִמְמָת:", "onk_en": "But if a man plots against his neighbor to kill him intentionally, you may [even] take him from My altar to put him to death.", "pj": "וַאֲרוּם יִרְשַׁע גְּבַר עַל חַבְרֵיהּ לְמִקְטְלֵיהּ בִּנְכִילוּ אֲפִילּוּ כַּהֲנָא הוּא וּמְשַׁמֵּשׁ עַל גַּבֵּי מַדְבְּחִי מִתַּמָּן תִּסְבוּנֵיהּ וְתִקְטְלִינֵיהּ בְּסַיָּיפָא", "pj_en": "But if a man come maliciously upon his neighbour to kill him with craft, though the priests are ministering at My altar, thence thou shalt take him, and slay him with the sword.", "tj": "אֲרוּם יִתְחַשֵּׁב גְּבַר עַל חַבְרֵיהּ לְמִקְטוֹל יָתֵיהּ בְּכָמוֹנָא אֲפִילּוּ הוּא כַּהֲנָא רַבָּא דְקָאֵי וּמְשַׁמֵּשׁ קֳדָמַי מִן תַּמָּן תִּסְבּוּן יָתֵיהּ וּתְקַטְלִין יָתֵיהּ:", "tj_en": "But if a man deviseth against his neighbour to kill him by guile, though the high priest were standing to minister before Me, from thence thou shalt bring him, and put him to death.", "rashi": "<b>וכי יזד.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר מַכֵּה אִישׁ וְגוֹ' שׁוֹמֵעַ אֲנִי אֲפִלּוּ גּוֹי, וְרוֹפֵא שֶׁהֵמִית וּשְׁלִיחַ בֵּית דִּין שֶׁהֵמִית בְּמַלְקוּת אַרְבָּעִים, וְהָאָב הַמַּכֶּה אֶת בְּנוֹ וְהָרַב הָרוֹדֶה אֶת תַּלְמִידוֹ, וְהַשּׁוֹגֵג, תַּ\"לֹ וְכִי יָזִד – וְלֹא שׁוֹגֵג, עַל רֵעֵהוּ – וְלֹא עַל גּוֹי, לְהָרְגוֹ בְעָרְמָה – וְלֹא שְׁלִיחַ בֵּית דִּין וְהָרוֹפֵא וְרוֹדֶה בְנוֹ וְתַלְמִידוֹ, שֶׁאַף עַל פִּי שֶׁהֵם מְזִידִין אֵין מַעֲרִימִין (מכילתא):<br><br><b>מעם מזבחי.<\/b> אִם הָיָה כֹהֵן וְרוֹצֶה לַעֲבֹד עֲבוֹדָה תִּקָּחֶנוּ לָמוּת (יומא פ\"ה):", "rashi_en": "וכי יזד AND IF A MAN ACT INTENTIONALLY — Why is this stated at all (since v. 13 expressly provides a place for the murderer only if he does not lie in wait)? Since it is said, (v. 12) “Whosoever smiteth a man [so that he die shall be put to death]”, I might infer that this is so even if the victim is a heathen, and that there it included even a physician who kills a person as a result of his treatment, and a court-officer who kills a man when inflicting on him the forty lashes, and a father who beats and thereby kills his son, and a teacher who chastises his pupil and thereby kills him, and one who kills in error (שוגג, i. e. one who intended to kill a certain person but missed the mark and killed another instead — נתכוין להרוג את זה והרג את זה)! Scripture therefore states here: “if a man acts intentionally (יזיד)” — but not in error (שוגג); “against his fellowman (רעהו)” — but not against a heathen; “to slay with guile (בערמה)” — thus excluding the court-officer, the physician, and one who chastises his son or his pupil for all these though acting intentionally do not do so with guile (cf. Mekhilta).<br><br>מעם מזבחי תקחנו למות THOU SHALT TAKE HIM FROM MY ALTAR, THAT HE MAY DIE — even if he is a priest and stands at the altar intending to officiate thou shalt take him away that he die (cf. Mekhilta; Yoma 85a)."}, {"ch": 21, "v": 15, "aliyah": 1, "heb": "וּמַכֵּ֥ה אָבִ֛יו וְאִמּ֖וֹ מ֥וֹת יוּמָֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּדְיִמְחֵי אֲבוּהִי וְאִמֵהּ אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Whoever strikes his father or his mother shall be put to death.", "pj": "וּדְחַבֵּל בְּאָבוֹי וּבְאִימֵיהּ אִתְקְטָלָא יִתְקְטֵיל בְּשִׁינוּקָא דְסוּדְרָא", "pj_en": "And he who woundeth his father or his mother shall die by strangling.", "tj": "", "tj_en": "", "rashi": "<b>ומכה אביו ואמו.<\/b> לְפִי שֶׁלִּמְּדָנוּ עַל הַחוֹבֵל בַּחֲבֵרוֹ שֶׁהוּא בְתַשְׁלוּמִין וְלֹא בְמִיתָה, הֻצְרַךְ לוֹמַר עַל הַחוֹבֵל בְּאָבִיו שֶׁהוּא בְמִיתָה, וְאֵינוֹ חַיָּב אֶלָּא בְהַכָּאָה שֶׁיֵּשׁ בָּהּ חַבּוּרָה (סנהדרין פ\"ה):<br><br><b>אביו ואמו.<\/b> אוֹ זֶה אוֹ זֶה:<br><br><b>מות יומת.<\/b> בְּחֶנֶק (מכילתא):", "rashi_en": "ומכה אביו ואמו AND HE THAT SMITETH HIS FATHER OR HIS MOTHER [SHALL SURELY BE PUT TO DEATH] — Because Scripture has taught us that he who inflicts a wound upon his fellow-man is liable for damages (cf. Rashi on Exodus 21:24) but is not subject to death, it was compelled to state that he who inflicts a wound on his father or his mother is subject to the death penalty (Mekhilta). He is, however, not punishable with death except for a blow which causes a wound (Sanhedrin 85b).<br><br>אביו ואמו means either his father or his mother (Mekhilta).<br><br>מות יומת SHALL BE PUT TO DEATH — by strangulation (Mekhilta)."}, {"ch": 21, "v": 16, "aliyah": 1, "heb": "וְגֹנֵ֨ב אִ֧ישׁ וּמְכָר֛וֹ וְנִמְצָ֥א בְיָד֖וֹ מ֥וֹת יוּמָֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְדִיִגְנוּב <b>נַפְשָׁא מִן בְּנֵי יִשְׂרָאֵל<\/b> וִיזַבְּנִנֵהּ וְיִשְׁתְּכַח בִּידֵהּ אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Whoever steals [kidnaps] a man [<b>person from B’nei Yisrael<\/b>] and sells him, if he is found in his hand, he shall be put to death.", "pj": "וּדְיִגְנוֹב נֶפֶשׁ מִבְּנֵי יִשְרָאֵל וִיזַבְּנִינֵיהּ וְיִשְׁתַּכַּח בִּרְשׁוּתֵיהּ אִתְקְטָלָא יִתְקְטֵיל בְּשִׁינוּקָא דְסוּדְרָא", "pj_en": "And he who stealeth a soul of the children of Israel, and selleth him, or if he be found in his possession, shall die by strangling.", "tj": "וְדִי מְבַזֵּי:", "tj_en": "", "rashi": "<b>וגנב איש ומכרו.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר כִּי יִמָּצֵא אִישׁ גּוֹנֵב נֶפֶשׁ מֵאֶחָיו (דברים כ\"ד), אֵין לִי אֶלָּא אִישׁ שֶׁגָּנַב נֶפֶשׁ, אִשָּׁה אוֹ טֻמְטוּם אוֹ אַנְדְּרוֹגִינוֹס שֶׁגָּנְבוּ מִנַּיִן? תַּ\"לֹ וְגֹנֵב אִישׁ וּמְכָרוֹ. וּלְפִי שֶׁנֶּאֱ' כָּאן וְגֹנֵב אִישׁ, אֵין לִי אֶלָּא גּוֹנֵב אִישׁ, גּוֹנֵב אִשָּׁה מִנַּיִן? תַּ\"לֹ גֹּנֵב נֶפֶשׁ, לְכָךְ הֻצְרְכוּ שְׁנֵיהֶם, מַה שֶּׁחִסֵּר זֶה גִּלָּה זֶה (סנהדרין שם):<br><br><b>ונמצא בידו.<\/b> שֶׁרָאוּהוּ עֵדִים שֶׁגְּנָבוֹ וּמְכָרוֹ, וְנִמְצָא כְבָר בְּיָדוֹ קֹדֶם מְכִירָה (שם):<br><br><b>מות יומת.<\/b> בְּחֶנֶק; כָּל מִיתָה הָאֲמוּרָה בַתּוֹרָה סְתָם חֶנֶק הִיא (וְהִפְסִיק הָעִנְיָן וְכָתַב וְגֹנֵב אִישׁ בֵּין מַכֵּה אָבִיו וְאִמּוֹ לִמְקַלֵּל אָבִיו, וְנִרְאֶה לִי הַיְנוּ פְּלוּגְתָּא, דְּמַר סָבַר מַקְּשִׁינַן הַכָּאָה לִקְלָלָה וּמַר סָבַר לָא מַקְּשִׁינַן (שם)):", "rashi_en": "וגנב איש ומכרו AND HE THAT STEALETH A MAN, AND SELLETH HIM, [AND HE BE PREVIOUSLY FOUND IN HIS HAND, HE SHALL SURELY BE PUT TO DEATH] — Why is this statement made (how does the particular form of words used here tell us some point of law which is not contained in another text bearing upon the same subject)? Since it is said, (Deuteronomy 24:7) “If a man be found stealing any of his brethren … [then that thief shall die]”, I might say that I have here only the law that a man who stole a person is punishable with death. Whence, however, do I know that this is also the case if a woman or a person whose sex is not distinguishable or a hermaphrodite (טומטום ואנדרונינוס) has stolen a person? Scripture therefore states here: “Whosoever stealeth a man and selleth him”. — And again, since Scripture states here: “He that stealeth a man [shall be put to death]”, I might say that I have here only the law that if one steals a man he is punishable with death. Whence do I know that this is also the case if he has stolen a woman? Therefore Scripture states, (Deuteronomy 24:7) “[If a man be found] stealing any person [he shall be put to death]”. Consequently both verses are necessary: what the one omits the other tells us (Mekhilta; Sanhedrin 85b).<br><br>ונמצא בידו implies that witnesses have seen him stealing and also saw him selling the person, and that he has been found in his possession before he had sold him (Mekhilta).<br><br>מות יומת HE SHALL SURELY BE PUT TO DEATH — by strangulation. Wherever the death-penalty is mentioned in Scripture without being precisely defined strangulation is intended (Mekhilta; Sanhedrin 84b). [It should be noted that Scripture interrupted the context by writing “Whosoever stealeth etc.” between the passages, “He that smiteth his father etc.” and “He that curseth his father etc.”, which passages ought on account of their contents to follow one after the other. I think that this gave rise to the difference of opinion found in Sanhedrin 85a where one Rabbi holds that we must put “smiting” on an equality with “cursing”, in spite of the text being interrupted by the verse וגונב, which, however, is placed between them only to teach that in some respects “smiting” and “cursing” have not the same law, — that after the death of the parents “cursing” them is punishable whilst “smiting” them is not; whilst another bolds that since the two verses have been disconnected “smiting” can by no means be put on an equality with, and have the same legal consequenses as, “cursing” (cf. Sanhedrin 85b)]."}, {"ch": 21, "v": 17, "aliyah": 1, "heb": "וּמְקַלֵּ֥ל אָבִ֛יו וְאִמּ֖וֹ מ֥וֹת יוּמָֽת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְדִיְלוּט אֲבוּהִי וְאִמֵהּ אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Whoever curses his father or his mother shall be put to death.", "pj": "וּדְיֵילוּט לְאָבוּי וּלְאִימֵיהּ בִּשְׁמָא מְפַרְשָׁא אִתְקְטָלָא יִתְקְטֵיל בְּאַטְלוּת אַבְנִין", "pj_en": "And he who curseth his father or his mother by the Great Name, dying he shall die by being stoned with stones.", "tj": "", "tj_en": "", "rashi": "<b>ומקלל אביו ואמו.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁהוּא אוֹמֵר אִישׁ אִישׁ אֲשֶׁר יְקַלֵּל אֶת אָבִיו (ויקרא כ'), אֵין לִי אֶלָּא אִישׁ שֶׁקִּלֵּל אֶת אָבִיו, אִשָּׁה שֶׁקִּלְּלָה אֶת אָבִיהָ מִנַּיִן? תַּ\"לֹ וּמְקַלֵּל אָבִיו וְאִמּוֹ סְתָם, בֵּין אִישׁ וּבֵין אִשָּׁה, אִם כֵּן לָמָּה נֶאֱמַר אִישׁ אֲשֶׁר יְקַלֵּל? לְהוֹצִיא אֶת הַקָּטָן (מכילתא):<br><br><b>מות יומת.<\/b> בִּסְקִילָה; וְכָל מָקוֹם שֶׁנֶּאֱמַר דָּמָיו בּוֹ בִּסְקִילָה, וּבִנְיַן אָב לְכֻלָּם בָּאֶבֶן יִרְגְּמוּ אֹתָם דְּמֵיהֶם בָּם (ויקרא כ'), וּבִמְקַלֵּל אָבִיו וְאִמּוֹ נֶאֱמַר דָּמָיו בּוֹ:", "rashi_en": "ומקלל אביו ואמו WHOSOEVER CURSETH HIS FATHER OR HIS MOTHER [SHALL SURELY BE PUT TO DEATH] — Why is this stated in this particular form? Since Scripture says, (Leviticus 20:9) “For every man who execrateth his father [or his mother shall surely be put to death]” I might say that I have here only the law that a man who curseth his father or his mother is punishable with death. Whence do I know that this is also the case if a woman curseth her father or her mother? Scripture therefore states here, “Whosoever curseth father or mother” — whosoever generally — intimating that it applies to both man and woman (Mekhilta). But if this be so why is it said, (Leviticus 20:9). “For every man who execrateth etc.”? To exclude a minor.<br><br>מות יומת SHALL SURELY BE PUT TO DEATH — by stoning. And the rule is that wherever the term “his blood is upon him “is used in connection with the death penalty, “execution by stoning” is meant. The following in the passage from which this is evident (בנין אב): (Leviticus 20:27) “they shall overwhelm them with stones: their blood is upon them” — and as regards one who curses father or mother (Leviticus 20:9), Scripture indeed uses the words דמיו בו (Mekhilta; Sanhedrin 66a)."}, {"ch": 21, "v": 18, "aliyah": 1, "heb": "וְכִֽי־יְרִיבֻ֣ן אֲנָשִׁ֔ים וְהִכָּה־אִישׁ֙ אֶת־רֵעֵ֔הוּ בְּאֶ֖בֶן א֣וֹ בְאֶגְרֹ֑ף וְלֹ֥א יָמ֖וּת וְנָפַ֥ל לְמִשְׁכָּֽב׃", "onk": "וַאֲרֵי יִנְצוּן גֻבְרִין וְיִמְחֵי גְבַר יָת חַבְרֵהּ בְּאַבְנָא אוֹ בְכוּרְמֵיזָא וְלָא יְמוּת <b>וְיִפּוֹל לְבוּטְלָן<\/b>:", "onk_en": "When men quarrel and one man hits his fellow with a stone or with [his] fist; and he [the victim] does not die but becomes bedridden [<b>falls to idleness<\/b>],", "pj": "וַאֲרוּם יִנְצוּן גּוּבְרִין וְיִמְחוּן חַד לְחַבְרֵיהּ בְּאַבְנָא אוֹ בְּמַרְתּוֹקָא (נ\"א מוֹרְנִיתָא) וְלָא יְמוּת וְיִפּוֹל לְמֵירַע", "pj_en": "And when men strive together, and one smite his neighbour with a stone, or with his fist, so that he die not, but fall ill,", "tj": "", "tj_en": "", "rashi": "<b>וכי יריבן אנשים.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר עַיִן תַּחַת עַיִן, לֹא לָמַדְנוּ אֶלָּא דְּמֵי אֵבָרָיו אֲבָל שֶׁבֶת וְרִפּוּי לֹא לָמַדְנוּ, לְכָךְ נֶאֶמְרָה פָּרָשָׁה זוֹ:<br><br><b>ונפל למשכב.<\/b> כְּתַרְגּוּמוֹ וְיִפֵּל לְבוּטְלָן – לְחֹלִי שֶׁמְּבַטְּלוֹ מִמְּלַאכְתּוֹ:", "rashi_en": "וכי יריבן אנשים AND IF MEN QUARREL — Why is this (vv. 18, 19) stated in this particular form? Since Scripture states, (v. 24) “Eye for eye”, we learn from this only that compensation for the loss of limbs has to be paid, but we cannot infer from it that indemnity for loss of time (during which the injured has been disabled from work) and cost of medical treatment have also to be paid; consequently this section (vv. 18 and 19) is said (Mekhilta).<br><br>ונפל למשכב BUT KEEPETH HIS BED — The meaning is as the Targum gives it: ויפל לבוטלן “and he falls into inactivity”, i. e. he falls into an illness that prevents him from working."}, {"ch": 21, "v": 19, "aliyah": 1, "heb": "אִם־יָק֞וּם וְהִתְהַלֵּ֥ךְ בַּח֛וּץ עַל־מִשְׁעַנְתּ֖וֹ וְנִקָּ֣ה הַמַּכֶּ֑ה רַ֥ק שִׁבְתּ֛וֹ יִתֵּ֖ן וְרַפֹּ֥א יְרַפֵּֽא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִם יְקוּם וִיהַלִיךְ בְּבָרָא עַל בּוּרְיֵהּ וִיהֵי זַכָּאָה מָחְיָא לְחוֹד בּוּטְלָנֵהּ יִתֵּן <b>וַאֲגַר אַסְיָא<\/b> יְשַׁלֵם:", "onk_en": "If he gets up and is able to walk on the outside on his own power, the one who struck him shall be acquitted. Still he must pay for his loss of work, and must pay for his complete cure [<b>the doctor’s fee<\/b>].", "pj": "אִין יְקוּם מִמַּרְעֵיהּ וּמְהֲלֵךְ בְּשׁוּקָא עַל מוֹרְנִיתֵיהּ וִיהֵי זַכְיַי מַחְיָיא מִדִּין קְטוֹל לְחוֹד בּוּטְלִין עִיבִידְתֵּיהּ וְצַעֲרֵיהּ וְנִזְקֵיהּ וּבַהֲתֵיהּ יִתֵּן וַאֲגַר אַסְיָא יְשַׁלֵּם עַד דְּמִתְּסֵי", "pj_en": "if he rise again from his illness, and walk in the street upon his staff, he who smote him shall be acquitted from the penalty of death; only for his cessation from labour, his affliction, his injury, his disgrace, and the hire of the physician, he shall make good until he be cured.", "tj": "אוֹ בְּמַרְתּוֹקָא וְלָא יָמוּת וְיִטְלַק לְעֶרֶס מְרָע:", "tj_en": "", "rashi": "<b>על משענתו.<\/b> עַל בֻּרְיוֹ וְכֹחוֹ (מכילתא):<br><br><b>ונקה המכה.<\/b> וְכִי תַעֲלֶה עַל דַּעְתְּךָ שֶׁיֵּהָרֵג זֶה שֶׁלֹּא הָרַג? אֶלָּא לִמֶּדְךָ כָאן שֶׁחוֹבְשִׁים אוֹתוֹ עַד שֶׁנִּרְאֶה אִם יִתְרַפֵּא זֶה; וְכֵן מַשְׁמָעוֹ: כְּשֶׁקָּם זֶה וְהוֹלֵךְ עַל מִשְׁעַנְתּוֹ אָז נִקָּה הַמַּכֶּה, אֲבָל עַד שֶׁלֹּא יָקוּם זֶה לֹא נִקָּה הַמַּכֶּה (כתובות ל\"ג):<br><br><b>רק שבתו.<\/b> בִּטּוּל מְלַאכְתּוֹ מֵחֲמַת הַחֹלִי; אִם קָטַע יָדוֹ אוֹ רַגְלוֹ, רוֹאִין בִּטּוּל מְלַאכְתּוֹ מֵחֲמַת הַחֹלִי כְאִלּוּ שׁוֹמֵר קִשּׁוּאִין, שֶׁהֲרֵי אַף לְאַחַר הַחֹלִי אֵינוֹ רָאוּי לִמְלֶאכֶת יָד וָרֶגֶל, וְהוּא כְבָר נָתַן לוֹ מֵחֲמַת נִזְקוֹ דְּמֵי יָדוֹ וְרַגְלוֹ, שֶׁנֶּ' יָד תַּחַת יָד רֶגֶל תַּחַת רָגֶל:<br><br><b>ורפא ירפא.<\/b> כְּתַרְגּוּמוֹ – יְשַׁלֵּם שְׂכַר הָרוֹפֵא:", "rashi_en": "על משענתו (lit., with that on which he relies) — i. e. his former healthy state and vigour (Mekhilta; cf. Onkelos).<br><br>ונקה המכה [WHEN HE RISES AGAIN…] HE THAT SMOTE HIM SHALL BE FREED — But could it enter your mind that this person who has not killed anyone at all should be subject to the death penalty? Why, then, is it necessary to state this? But it is intended to teach you that he is kept in prison until we discover whether the other is completely healed or not, and what the verse implies is this: when this man rises again (אם יקום) and walks in the street in his former vigour, then he who smote him shall be freed from prison, but so long as the other has not risen from the sick-bed etc. the man who smote him is not freed (Ketubot 33b; Sanhedrin 78b).<br><br>רק שבתו ONLY [HE SHALL PAY FOR] THE LOSS OF HIS TIME — i. e. for the interruption of his labour due to this illness. If, for instance, he cut off his hand or his foot, we regard the interruption of labour caused by this illness as though his occupation were that of a watchman in a cucumber field (which work can be done even by a man lacking a hand or a foot), for even after he has recovered from the illness he will not be able to do work which requires hands or feet, and indeed the value of his hand or his foot that was cut off the other has already paid to him as “damages” (נזק), as it is said, (v. 24) “hand for hand, foot for foot”. (Having compensated him already for loss of capacity as a wage-earner whole in body, it would not be right if this man has again to pay him for loss of time as though he were of full-earning capacity) (Bava Kamma 85b).<br><br>ורפא ירפא — Translate it as the Targum does: he shall pay the physician’s fee."}, {"ch": 21, "v": 20, "aliyah": 2, "heb": "וְכִֽי־יַכֶּה֩ אִ֨ישׁ אֶת־עַבְדּ֜וֹ א֤וֹ אֶת־אֲמָתוֹ֙ בַּשֵּׁ֔בֶט וּמֵ֖ת תַּ֣חַת יָד֑וֹ נָקֹ֖ם יִנָּקֵֽם׃", "onk": "וַאֲרֵי יִמְחֵי גְבַר יָת עַבְדֵהּ אוֹ יָת אַמְתֵהּ <b>בְּשָׁלְטָן<\/b> וִימוּת תְּחוֹת יְדֵהּ <b>אִתְדָנָא יִתְּדָן<\/b>:", "onk_en": "If a man strikes his male or female slave with a rod [<b>power<\/b>], and [the slave] dies under his hand, [the death] must be avenged [<b>judged<\/b>].", "pj": "וַאֲרוּם יִמְחֵי גְבַר יַת עַבְדֵיהּ כְּנַעֲנָאָה אוֹ יַת אַמְתֵיהּ כְּנַעֲנִיתָא בְּשַׁרְבִיטָא וִימוּת בְּהַהוּא יוֹמָא תְּחוֹת יְדֵיהּ יִתְדְּנָא יִתְדַן דִּין קְטִילַת סַיְיפָא", "pj_en": "And when a man hath smitten his Kenaanite man-servant or maid-servant with a staff, and he die the same day under his hand, he shall be judged with the judgment of death by the sword.", "tj": "מִתְנַקְמָא יִתְנַקֵם:", "tj_en": "", "rashi": "<b>וכי יכה איש את עבדו או את אמתו.<\/b> בְּעֶבֶד כְּנַעֲנִי הַכָּתוּב מְדַבֵּר, אוֹ אֵינוֹ אֶלָּא בְּעִבְרִי? תַּ\"לֹ כִּי כַסְפּוֹ הוּא, מַה כַּסְפּוֹ קָנוּי לוֹ עוֹלָמִית, אַף עֶבֶד הַקָּנוּי לוֹ עוֹלָמִית; וַהֲרֵי הָיָה בִכְלַל מַכֵּה אִישׁ וָמֵת? אֶלָּא בָא הַכָּתוּב וְהוֹצִיאוֹ מִן הַכְּלָל, לִהְיוֹת נָדוֹן בְּדִין יוֹם אוֹ יוֹמַיִם, שֶׁאִם לֹא מֵת תַּחַת יָדוֹ וְשָׁהָה מֵעֵת לְעֵת פָּטוּר (מכילתא):<br><br><b>בשבט.<\/b> כְּשֶׁיֵּשׁ בּוֹ כְּדֵי לְהָמִית הַכָּתוּב מְדַבֵּר. אוֹ אֲפִלּוּ אֵין בּוֹ כְּדֵי לְהָמִית? תַּ\"לֹ בְּיִשְׂרָאֵל וְאִם בְּאֶבֶן יָד אֲשֶׁר יָמוּת בָּהּ הִכָּהוּ (במדבר ל\"ה), וַהֲלֹא דְּבָרִים קַל וָחֹמֶר: מַה יִּשְׂרָאֵל חָמוּר אֵין חַיָּב עָלָיו אֶלָּא אִם כֵּן הִכָּהוּ בְדָבָר שֶׁיֵּשׁ בּוֹ כְּדֵי לְהָמִית וְעַל אֵבֶר שֶׁהוּא כְדֵי לָמוּת בְּהַכָּאָה זוֹ, עֶבֶד הַקַּל לֹא כָּל שֶׁכֵּן (מכילתא):<br><br><b>נקם ינקם.<\/b> מִיתַת סַיִף, וְכֵן הוּא אוֹמֵר חֶרֶב נֹקֶמֶת נְקַם בְּרִית (ויקרא כ\"ו):", "rashi_en": "וכי יכה איש את עבדו או את אמתו AND IF A MAN SMITE HIS SERVANT OR HIS MAIDSERVANT — Scripture speaks of a Canaanitish servant. Or perhaps this is not so, but it speaks of a Hebrew servant? Scripture however states, (Exodus 21:21) “for he is his money”. How is it in the case of his money? It is something that is his forever (i. e. it is something the possession of which is not limited to a definite time)! So also the servant referred to here is such a one as is his forever (and only a Canaanitish servant serves his master for ever, cf. Leviticus 25:46, whilst the Hebrew servant goes free after six years). But surely he (one that smites his servant) is included in the general statement, (Exodus 21:12) ”Whosoever smiteth a man [so that he die shall surely be put to death]”; why, then, is this case mentioned at all? But Scripture singles it out from the general statement that he (who smiteth his servant etc.) may be subject to the particular regulation of “a day or two” (Exodus 21:21) — that if he (the servant) does not die beneath his hand and continue to live twenty-four hours his master should be freed from the death-penalty (Mekhilta).<br><br>בשבט WITH A ROD — Scripture speaks of a rod that is capable of inflicting death. Or perhaps it speaks even of one that is not capable of inflicting death (but some-how or other the servant died beneath his hand)? Scripture however states, (Numbers 35:17) in reference to an Israellite (cf. Numbers 35:15) “And if he smote him with a stone in the hand, wherewith he may die, [and he die, he is a murderer]”. Now is not the following statement a logical conclusion à fortiori? How is it if one has killed an Israelite whose case is more stringent (inasmuch as the leniency mentioned in v. 21 is not applied to it)? He is not subject to the death penalty unless he smote him with an instrument capable of inflicting death and unless it be a limb through the striking of which by such an instrument he is likely to die! Then in the case of a servant where (as can be seen from v. 21) the conditions are less stringent, does it not follow all the more that he is not subject to the death penalty? (cf. Mekhilta).<br><br>נקם ינקם HE SHALL SURELY BE AVENGED — This means execution by the sword. For thus does Scripture state, (Leviticus 26:25) “a sword avenging the vengeance of my covenant” (Mekhilta; Sanhedrin 52b)."}, {"ch": 21, "v": 21, "aliyah": 2, "heb": "אַ֥ךְ אִם־י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖וֹ הֽוּא׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "בְּרַם אִם יוֹמָא אוֹ תְרֵין יוֹמִין יִתְקַיָם לָא <b>יִתְּדָן<\/b> אֲרֵי כַסְפֵּהּ הוּא:", "onk_en": "However if he [the slave] survives for a day or two, [his death] is not avenged [<b>judged<\/b>], for he [the slave] is his [master’s] property.", "pj": "בְּרַם אִין יוֹמָא חַד מֵעִידַן לְעִידַן אוֹ תְּרֵין יוֹמִין קְטִיעִין יִתְקַיֵּים לָא יִתְדַן מְטוֹל דִּכְסַף זְבִינֵיהּ הוּא", "pj_en": "But if the wounded person continue one or two days from time to time, he shall not be (so) judged; because with money he had bought him.", "tj": "", "tj_en": "", "rashi": "<b>אך אם יום או יומים יעמד לא יקם.<\/b> אִם עַל יוֹם אֶחָד הוּא פָּטוּר עַל יוֹמַיִם לֹא כָּל שֶׁכֵּן? אֶלָּא יוֹם שֶׁהוּא כְיוֹמַיִם, וְאֵיזֶה? זֶה מֵעֵת לְעֵת (מכילתא):<br><br><b>לא יקם כי כספו הוא.<\/b> הָא אַחֵר שֶׁהִכָּהוּ, אַעַ\"פִּ שֶׁשָּׁהָה מֵעֵת לְעֵת קֹדֶם שֶׁמֵּת, חַיָּב:", "rashi_en": "אך אם יום או יומים יעמד לא יקם NOTWITHSTANDING IF HE CONTINUE A DAY OR TWO, HE SHALL NOT BE AVENGED — If the master is free of the death penally in case of the servant remaining alive one day, is it not logical that he is free if he lives two days (what need is there for Scripture to add יומים)? But it adds it to show that the term יום is to be defined by יומים — “a day that is like two days”. And what kind of day is thereby meant? A period of twenty-four hours (a day which comprises a part of two separate days) (cf. Mekhilta).<br><br>לא יקם כי כספו הוא HE SHALL NOT BE AVENGED: FOR HE IS HIS MONEY — However, any other person who smote him (the servant) is subject to the death penalty although he lived 24 hours before dying."}, {"ch": 21, "v": 22, "aliyah": 2, "heb": "וְכִֽי־יִנָּצ֣וּ אֲ
