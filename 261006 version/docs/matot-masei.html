<script>
const SLUG = "matot-masei";
const DATA = [{"ch": 30, "v": 2, "aliyah": 1, "heb": "וַיְדַבֵּ֤ר מֹשֶׁה֙ אֶל־רָאשֵׁ֣י הַמַּטּ֔וֹת לִבְנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר זֶ֣ה הַדָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהֹוָֽה׃", "onk": "וּמַלִּיל משֶׁה עִם רֵישֵׁי שִׁבְטַיָּא לִבְנֵי יִשְׂרָאֵל לְמֵימָר דֵּין פִּתְגָּמָא דִּי פַּקִּיד יְיָ:", "onk_en": "Moshe spoke to the tribal leaders of Bnei Yisroel saying: “This is the word that Adonoy has commanded.", "pj": "וידבר וּמַלֵיל משֶׁה עִם אֲמַרְכְּלֵי שִׁבְטַיָא לִבְנֵי יִשְרָאֵל לְמֵימָר דֵין פִּתְגָמָא דְמַלֵיל יְיָ לְמֵימָר", "pj_en": "AND Mosheh spake with the chiefs of the Tribes of the Beni Israel, saying: This is the Word which the Lord hath spoken, saying:", "tj": "", "tj_en": "", "rashi": "<b>ראשי המטות.<\/b> חָלַק כָּבוֹד לַנְּשִׂיאִים לְלַמְּדָם תְּחִלָּה וְאַחַר כָּךְ לְכָל בְּנֵי יִשְׂרָאֵל; וּמִנַּיִן שֶׁאַף שְׁאָר הַדִּבְּרוֹת כֵּן? תַּלְמוּד לוֹמַר (שמות ל\"ד) \"וַיָּשֻׁבוּ אֵלָיו אַהֲרֹן וְכָל הַנְּשִׂאִים בָּעֵדָה וַיְדַבֵּר מֹשֶׁה אֲלֵהֶם, וְאַחֲרֵי כֵן נִגְּשׁוּ כָּל בְּנֵי יִשְׂרָאֵל\". וּמָה רָאָה לְאָמְרָהּ כָּאן? לִמֵּד שֶׁהֲפָרַת נְדָרִים בְּיָחִיד מֻמְחֶה, וְאִם אֵין יָחִיד מֻמְחֶה, מֵפֵר בִּשְׁלֹשָׁה הֶדְיוֹטוֹת; אוֹ יָכוֹל שֶׁלֹּא אָמַר מֹשֶׁה פָרָשָׁה זוֹ אֶלָּא לַנְּשִׂיאִים בִּלְבַד? נֶאֱמַר כָּאן \"זֶה הַדָּבָר\" וְנֶאֱמַר בִּשְׁחוּטֵי חוּץ (ויקרא י\"ז) \"זֶה הַדָּבָר\", מַה לְּהַלָּן נֶאֶמְרָה לְאַהֲרֹן וּלְבָנָיו וּלְכָל בְּנֵי יִשְׂרָאֵל — שֶׁנֶּאֱמַר \"דַּבֵּר אֶל אַהֲרֹן\" וְגוֹ' — אַף זוֹ נֶאֶמְרָה לְכֻלָּן (ספרי; נדרים ע\"ח):<br><br><b>זה הדבר.<\/b> מֹשֶׁה נִתְנַבֵּא בְּ\"כֹה אָמַר ה' כַּחֲצֹת הַלַּיְלָה\" (שמות י\"א) וְהַנְּבִיאִים נִתְנַבְּאוּ בְּ\"כֹה אָמַר ה'\", מוּסָף עֲלֵיהֶם מֹשֶׁה שֶׁנִּתְנַבֵּא בִּלְשׁוֹן \"זֶה הַדָּבָר\". דָּ\"אַ — <b>זה הדבר<\/b> מִעוּט הוּא, לוֹמַר שֶׁהֶחָכָם בִּלְשׁוֹן הַתָּרָה, וּבַעַל בִּלְשׁוֹן הֲפָרָה, כִּלְשׁוֹן הַכָּתוּב כָּאן, וְאִם חִלְּפוּ — אֵין מֻתָּר וְאֵין מוּפָר (ספרי; נדרים ע\"ז):", "rashi_en": "ראשי המטות [AND MOSES SPAKE TO] THE HEADS OF THE TRIBES OF THE CHILDREN OF ISRAEL] — This does not mean that he spoke only to the princes of the children of Israel and not to the people also, but that he showed respect to the princes by teaching them first and that afterwards he taught the children of Israel. This explanation seems to assume that this was the general method of instruction, but from what Biblical verse may we infer that this was so in the case of all addresses, and that this was no exceptional case? Because it says, (Exodus 34:31—32) “[And Moses called unto them], and Aaron and all the princes of the congregation returned unto him and Moses spake unto them; and afterwards all the children of Israel came nigh, [and he gave them all the commandments which the Lord had spoken to him in Mount Sinai]”. But if this be no exceptional case, what reason is there for Scripture going out of its way to state it here? Because by specially stating that the laws about vows were taught in the first instance to the princes and afterwards to the Israelites, it intends to teach that the annulling of vows is really to be effected by one person who is expert in the Law, and that only if there be no such expert, may they be annulled by three ordinary persons. But you may perhaps say that the statement does mean that Moses spoke this section only to the princes of the children of Israel, and that Moses did not speak to them also, and that consequently nothing about the expert and laymen can be inferred! But it is stated here, “This is the word”, and it is stated in the passage dealing with “animals slaughtered outside the sanctuary” (Leviticus 17:2) “This is the word”. What is the case there? It was addressed to Aaron and to his sons and to all the children of Israel, as it is said there, “Speak unto Aaron [and unto his sons and unto all the children of Israel]”! So, too, this was addressed to all of them (and the reason why it is stated here is to tell us that the annulling of vows etc., as above) (cf. Sifrei Bamidbar 153:1; Nedarim 78a).<br><br>זה הדבר THIS IS THE WORD — Moses prophesied with the words (introduced his message by the statement), “Thus saith the Lord, About midnight [will I go into the midst of Egypt]” (Exodus 11:4), and other prophets also prophesied with “Thus saith the Lord”, Moses, however, had an additional superiority in that he prophesied also with the expression “This is the actual word [that God hath spoken]” (Sifrei Bamidbar 153:2). Another explanation of זה הדבר THIS IS THE WORD: it is a restrictive phrase serving to intimate that the Sage (the expert) makes use of the expression “invalidating” (התרה), and the husband (dealing with his wife’s vows), only of the expression “annulling” (הפרה), as is the language of Scripture here (e. g., in v. 9), and that if they (one of them) exchanges the expression, it (the vow) is not invalidated nor is it annulled as the case may be (Nedarim 78a)."}, {"ch": 30, "v": 3, "aliyah": 1, "heb": "אִישׁ֩ כִּֽי־יִדֹּ֨ר נֶ֜דֶר לַֽיהֹוָ֗ה אֽוֹ־הִשָּׁ֤בַע שְׁבֻעָה֙ לֶאְסֹ֤ר אִסָּר֙ עַל־נַפְשׁ֔וֹ לֹ֥א יַחֵ֖ל דְּבָר֑וֹ כְּכׇל־הַיֹּצֵ֥א מִפִּ֖יו יַעֲשֶֽׂה׃", "onk": "גְּבַר אֲרֵי יִדַּר נְדַר <b>קֳדָם<\/b> יְיָ אוֹ יְקַיֵּם קְיָם לְמֵסַר אֵסַר עַל נַפְשֵׁיהּ לָא יְבַטַּל פִּתְגָּמֵיהּ כְּכָל דְּיִפּוֹק מִפּוּמֵיהּ יַעֲבֵּד:", "onk_en": "If a man makes a vow to [<b>before<\/b>] Adonoy or makes an oath; to initiate a prohibition himself; he may not profane his word. He shall do all that he said.", "pj": "גְבַר בַּר תְּלֵיסַר שְׁנִין אֲרוּם יִדַר נִדְרָא קֳדָם יְיָ אוֹ יְקַיֵים קְיַים לְמֵיסַר אִיסַר מִמַדַעַם דְהֶתֵּירָא עַל נַפְשֵׁיהּ לָא יָפִיס פִּתְגָמֵיהּ בְּרַם בֵּית דִינָא שָׁרַן לֵיהּ וְאִין לָא שָׁרוּ לֵיהּ כְּכָל מַה דְיִפּוֹק מִפּוּמֵיהּ יַעֲבֵיד", "pj_en": "A man, a son of thirteen when he shall have vowed a vow before the Lord, or have sworn an oath, saying, I will withhold from such a thing which is permitted to me, shall not be allowed to relax his word (at his own will): nevertheless, the house of judgment (beth dina) can absolve him; but if they absolve him not, whatsoever hath gone out of his mouth he shall perform.", "tj": "", "tj_en": "", "rashi": "<b>נדר.<\/b> הָאוֹמֵר הֲרֵי עָלַי קוֹנָם שֶׁלֹּא אֹכַל אוֹ שֶׁלֹּא אֶעֱשֶׂה דָבָר פְּלוֹנִי; יָכוֹל אֲפִלּוּ נִשְׁבַּע שֶׁיֹּאכַל נְבֵלוֹת אֲנִי קוֹרֵא עָלָיו כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה? תַּ\"ל <b>לאסר אסר<\/b> — לֶאֱסֹר אֶת הַמֻּתָּר וְלֹא לְהַתִּיר אֶת הָאָסוּר (ספרי):<br><br><b>לא יחל דברו.<\/b> כְּמוֹ לֹא יְחַלֵּל דְּבָרוֹ — לֹא יַעֲשֶׂה דְּבָרוֹ חֻלִּין (שם):", "rashi_en": "נדר A VOW — This is when one says, Behold, I take upon myself an obligation which is as sacred to me as an offering, that I will not eat, or that I will not do such-and-such a thing. — One might think that if he swears that he will eat the flesh of an animal which has not been slaughtered properly according to the rite that I may apply to him the text, “He shall do according to all that goeth forth from his mouth”! It, however, says, “[If he takes an oath] to forbid something to himself”, i.e., to forbid for himself something which is permissible to him — and not to make permissible that which is forbidden to him (Sifrei Bamidbar 153:4).<br><br>לא יחל דברו This is the same as לא יחלל דברו (the root of יחל being חלל): He shall not make his own word to bear a secular character (חולין) (Sifrei Bamidbar 153:4; see also Rashi on Leviticus 21:4)."}, {"ch": 30, "v": 4, "aliyah": 1, "heb": "וְאִשָּׁ֕ה כִּֽי־תִדֹּ֥ר נֶ֖דֶר לַיהֹוָ֑ה וְאָסְרָ֥ה אִסָּ֛ר בְּבֵ֥ית אָבִ֖יהָ בִּנְעֻרֶֽיהָ׃", "onk": "וְאִתְּתָא אֲרֵי תִדַּר נְדַר <b>קֳדָם<\/b> יְיָ וְתֵסַר אֵיסַר בְּבֵית אָבוּהָא בְּרַבְיוּתָהָא:", "onk_en": "[But] if a woman makes a vow to [<b>before<\/b>] Adonoy or obligates herself in her father’s home while still in her youth,", "pj": "וְאִתְּתָא דְלָא עָבְרַת תְּרֵיסַר שְׁנִין אֲרוּם תִּידַר נְדַר קֳדָם יְיָ וְתֵיסַר אִיסַר בְּבֵית אִיבָהָא עַד תְּרֵיסַר שְׁנִין", "pj_en": "And a female who hath not passed twelve years when she hath vowed a vow before the Lord, and hath bound herself in her father's house until her thirteenth year;", "tj": "", "tj_en": "", "rashi": "<b>בבית אביה.<\/b> בִּרְשׁוּת אָבִיהָ וַאֲפִלּוּ אֵינָהּ בְּבֵיתוֹ (שם):<br><br><b>בנעריה.<\/b> וְלֹא קְטַנָּה וְלֹא בוֹגֶרֶת, שֶׁהַקְּטַנָּה אֵין נִדְרָהּ נֶדֶר, וְהַבּוֹגֶרֶת אֵינָהּ בִּרְשׁוּתוֹ שֶׁל אָבִיהָ לְהָפֵר נְדָרֶיהָ; וְאֵי זוֹ הִיא קְטַנָּה? אָמְרוּ רַבּוֹתֵינוּ בַּת י\"א שָׁנָה וְיוֹם אֶחָד נְדָרֶיהָ נִבְדָּקִין, אִם יָדְעָה לְשֵׁם מִי נָדְרָה וּלְשֵׁם מִי הִקְדִּישָׁה, נִדְרָהּ נֶדֶר, בַּת י\"ב שָׁנָה וְיוֹם אֶחָד אֵינָהּ צְרִיכָה לִבָּדֵק:", "rashi_en": "בבית אביה [IF A WOMAN VOW] … BEING IN HER FATHER’S HOUSE — i.e., under her father’s control, but the law here stated applies even though she be not in his house, provided she be under his control (Sifrei Bamidbar 153:4). <br><br>בנעורה IN HER YOUTH — when she is a נערה i.e., in the first state of womanhood, but not when she is a קטנה, a minor, and not when she is a בוגרת (in full womanhood); for so far as a minor is concerned, her vow is in general no vow (it is null and void ab initio), and a בוגרת is not under her father’s control so that he can annul her vows. What is a קטנה, a minor, in respect to vows? We may gather this from what our Rabbis said: a woman of eleven years and one day must have her vows investigated until she reaches the age of twelve years; if she understands in Whose name it is that she has made the vow or in Whose name it is she has dedicated the thing, her vow is a vow, but a woman of twelve years and a day does not require any investigation regarding her vow (Niddah 56b)."}, {"ch": 30, "v": 5, "aliyah": 1, "heb": "וְשָׁמַ֨ע אָבִ֜יהָ אֶת־נִדְרָ֗הּ וֶֽאֱסָרָהּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל־נַפְשָׁ֔הּ וְהֶחֱרִ֥ישׁ לָ֖הּ אָבִ֑יהָ וְקָ֙מוּ֙ כׇּל־נְדָרֶ֔יהָ וְכׇל־אִסָּ֛ר אֲשֶׁר־אָסְרָ֥ה עַל־נַפְשָׁ֖הּ יָקֽוּם׃", "onk": "וְיִשְׁמַע אָבוּהָא יָת נִדְרָהּ וְאֵסָרָהּ דִּי אֲסָרַת עַל נַפְשַׁהּ וְיִשְׁתּוֹק לָהּ אָבוּהָא וִיקוּמוּן כָּל נִדְרָהָא וְכָל אֵסָרֵי דִּי אֲסָרַת עַל נַפְשַׁהּ יְקוּמוּן:", "onk_en": "and her father hears her vow or her self-imposed prohibition and remains silent, then all her vows shall stand and the self-imposed prohibition shall stand.", "pj": "וְיִשְׁמַע אִיבָהָא יַת נִדְרָהָא וְכָל אִיסְרָהָא דְאָסְרַת עַל נַפְשָׁהּ וְיִתְכַּוֵון וְיִשְׁתּוֹק לָהּ אִיבָהָא וְיִתְקַיְימוּן כָּל נִדְרָהָא וְכָל אִיסָרָא דְאַסָרַת עַל נַפְשָׁהּ יִתְקַיֵים", "pj_en": "and her father hear her vow, and whatever bond she hath bound upon her soul, and her father be acquiescent, and speak not to her; then every vow and every bond which she hath bound upon her soul shall be confirmed.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 6, "aliyah": 1, "heb": "וְאִם־הֵנִ֨יא אָבִ֣יהָ אֹתָהּ֮ בְּי֣וֹם שׇׁמְעוֹ֒ כׇּל־נְדָרֶ֗יהָ וֶֽאֱסָרֶ֛יהָ אֲשֶׁר־אָסְרָ֥ה עַל־נַפְשָׁ֖הּ לֹ֣א יָק֑וּם וַֽיהֹוָה֙ יִֽסְלַח־לָ֔הּ כִּי־הֵנִ֥יא אָבִ֖יהָ אֹתָֽהּ׃", "onk": "וְאִם אַעְדִּי אָבוּהָא יָתַהּ בְּיוֹמָא דִשְׁמַע כָּל נִדְרָהָא וֶאֱסָרָהָא דִּי אֲסָרַת עַל נַפְשַׁהּ לָא יְקוּמוּן <b>וּמִן קֳדָם<\/b> יְיָ יִשְׁתְּבֵק לָהּ אֲרֵי אַעְדִּי אָבוּהָא יָתַהּ:", "onk_en": "But if her father restrained her on the day he heard it, then all her vows and self imposed prohibitions shall not stand. [<b>From before<\/b>] Adonoy will forgive her because her father has restrained her.", "pj": "וְאִין יִבְטַל אִיבָהָא יָתָהּ בְּיוֹמָא דְשָׁמַע אוֹ לָא אִתְכַּוֵון לְקַיְימָא וּבַטֵיל בָּתַר דְיִשְׁמַע כָּל נִדְרָהָא וְאֵיסָרָא דְאַסָרַת עַל נַפְשָׁהּ לָא יִתְקַיְימוּן וּמִן קֳדָם יְיָ יִשְׁתְּרֵי וְיִשְׁתְּבֵק לָהּ אֲרוּם בָּטֵיל אָבוּהָא יָתָהּ מִן רְשׁוּתָא דְנִדְרָא", "pj_en": "But if her father prohibit her on the day that he heareth, or, not being prepared to confirm, annulleth after he hath heard, (then) no vow or bond that she hath bound upon her soul shall be confirmed; but is remitted and forgiven her before the Lord, because her father hath made her free from the authority of the vow, (or, nullified to her the power of the vow.)", "tj": "", "tj_en": "", "rashi": "<b>ואם הניא אביה אתה.<\/b> אִם מָנַע אוֹתָהּ מִן הַנֶּדֶר, כְּלוֹמַר שֶׁהֵפֵר לָהּ. הֲנָאָה זוֹ אֵינִי יוֹדֵעַ מַה הִיא, כְּשֶׁהוּא אוֹמֵר \"וְאִם בְּיוֹם שְׁמֹעַ אִישָהּ יָנִיא אוֹתָהּ וְהֵפֵר\" (פסוק ט') הֱוֵי אוֹמֵר הֲנָאָה זוֹ הֲפָרָה. וּפְשׁוּטוֹ לְשׁוֹן מְנִיעָה וַהֲסָרָה, וְכֵן \"וְלָמָּה תְנִיאוּן\" (במדבר ל\"ב), וְכֵן \"שֶׁמֶן רֹאשׁ אַל יָנִי רֹאשִׁי\" (תהילים קמ\"א), וְכֵן \"וִידַעְתֶּם אֶת תְּנוּאָתִי\" (במדבר י\"ד) — אֶת אֲשֶׁר סַרְתֶּם מֵעָלַי:<br><br><b>וה' יסלח לה.<\/b> בַּמֶּה הַכָּתוּב מְדַבֵּר? בְּאִשָּׁה שֶׁנָּדְרָה בְנָזִיר וְשָׁמַע בַּעְלָהּ וְהֵפֵר לָהּ וְהִיא לֹא יָדְעָה וְעוֹבֶרֶת עַל נִדְרָהּ וְשׁוֹתָה יַיִן וּמִטַּמְּאָה לְמֵתִים, זוֹ הִיא שֶׁצְּרִיכָה סְלִיחָה וְאַעַ\"פִּ שֶׁהוּא מוּפָר, וְאִם הַמּוּפָרִין צְרִיכִים סְלִיחָה, קַ\"וָ לְשֶׁאֵינָן מוּפָרִים (עי' קידושין פ\"א):", "rashi_en": "ואם הניא אביה אתה BUT IF HER FATHER DISALLOWED HER — The Hebrew signifies, “if he withholds her” from the vow, that is to say, that he annuls it for her. I would not know what this expression הניא, “withholding”, implies (i.e., how he withholds her) — but when it states, (v. 9) “But if on the day that he hears, he withholds her and annuls [her vows]”, one must admit that “the withholding” consists in “annulling the vow” (i.e. in exclaiming מופר לך) (Sifrei Bamidbar 153:6). But still the plain meaning is that it is a term for “withholding” and “removing” (and the word והפר only shows how and by what means she is to be withheld from keeping her vow); and similar is (Numbers 32:7): “And wherefore do you remove (תניאון) [the heart of the children of Israel from the idea of passing over the land]”; and so, too, (Psalms 141:5): “Oil so choice, let not my head turn away (יניא), and similar, also, (Numbers 14:34): “And ye shall know My turning aside (תנואתי)” — i.e. ye shall know that ye have turned aside from Me.<br><br>וה' יסלח לה AND THE LORD SHALL FORGIVE HER — Of what is Scripture here speaking? Of a woman who, e.g., vowed that she would become a Nazarite, and whose father heard it and annulled it for her, but she knew it not, and transgressed her vow and drank wine or made herself unclean by means of a corpse. It is such a woman who requires forgiveness even though it (her vow) has been annulled. — And if those whose vows have been annulled require forgiveness in such a case, how much more is this so for those whose vows have not been annulled and have been transgressed! (Sifrei Bamidbar 153:6; cf. Kiddushin 81b)."}, {"ch": 30, "v": 7, "aliyah": 1, "heb": "וְאִם־הָי֤וֹ תִֽהְיֶה֙ לְאִ֔ישׁ וּנְדָרֶ֖יהָ עָלֶ֑יהָ א֚וֹ מִבְטָ֣א שְׂפָתֶ֔יהָ אֲשֶׁ֥ר אָסְרָ֖ה עַל־נַפְשָֽׁהּ׃", "onk": "וְאִם מֶהֱוָה תֶהֱוֵי לִגְבַר וְנִדְרָהָא עֲלַהּ אוֹ פֵּרוּשׁ סִפְוָתָהָא דִּי אֲסָרַת עַל נַפְשָׁהּ:", "onk_en": "If she is [married] to a man, and her vows were upon herself, or an utterance of self-imposed prohibitions,", "pj": "וְאִין אִתְנַסְבָא אִתְנְסִיבַת לִגְבַר וְנִדְרָהָא עֲלָהּ אוֹ פֵּירוּשֵׁי סִיפְתָהָא דְאָסְרַת עַל נַפְשָׁהּ בְּבֵית אִיבָהָא וְלָא בְטִיל אִיבָהָא עַד לָא אִתְנְסִיבַת וּמִדְאִתְנְסִיבַת לִגְבַר יִתְקַיְימוּן", "pj_en": "And if when she hath been taken by a husband a vow be upon her, or her lips have expressed that which is binding upon her soul while in her father's house, and her father had not absolved her while unmarried, then, when she hath been married, it shall be confirmed.", "tj": "", "tj_en": "", "rashi": "<b>ואם היו תהיה לאיש.<\/b> זוֹ אֲרוּסָה, אוֹ אֵינוֹ אֶלָּא נְשׂוּאָה? כְּשֶׁהוּא אוֹמֵר \"וְאִם בֵּית אִישָׁהּ נָדָרָה\" הֲרֵי נְשׂוּאָה אָמוּר, וְכָאן בַּאֲרוּסָה, וּבָא לַחֲלֹק בָּהּ שֶׁאָבִיהָ וּבַעְלָהּ מְפֵרִין נְדָרֶיהָ, הֵפֵר הָאָב וְלֹא הֵפֵר הַבַּעַל, אוֹ הֵפֵר הַבַּעַל וְלֹא הֵפֵר הָאָב, הֲרֵי זֶה אֵינוֹ מוּפָר, וְאֵין צָרִיךְ לוֹמַר אִם קִיֵּם אֶחָד מֵהֶם:<br><br><b>ונדריה עליה.<\/b> שֶׁנָּדְרָה בְּבֵית אָבִיהָ, וְלֹא שָׁמַע בָּהֶן אָבִיהָ וְלֹא הוּפְרוּ וְלֹא הוּקְמוּ (עי' ספרי):", "rashi_en": "ואם היו תהיה לאיש AND IF SHE BECOMES A MAN’S — (a phrase used for marriage). This refers to a woman who becomes betrothed (ארוסה). Or perhaps this is not so, but it refers to a married woman (one who has joined her husband; cf. Rashi on Leviticus 21:9). When, however, it says, (v. 11) “And if she vowed in her husband’s house”, it is evident that a married woman is being spoken of there, and here, therefore, the text is speaking of one who has been only betrothed. And it (the separate mention of her) is intended to make a different rule about her — that her father and her husband must annul her vow: if the father annulled and the husband did not annul, or the husband annulled and the father did not annul, then this vow is not regarded as annulled, and it is not necessary to state (and it is a matter of course) that if one of them confirmed the vow the other has no power to annul it (Sifrei Bamidbar 153:7; Nedarim 67a).<br><br>ונדריה עליה [AND IF SHE BECOMES A MAN’S] AND HER VOWS ARE UPON HER — It means that she had made the vows being in her father’s house, and her father did not hear them, and so they were neither annulled nor confirmed at the time of her betrothal (cf. Sifrei Bamidbar 153:7)."}, {"ch": 30, "v": 8, "aliyah": 1, "heb": "וְשָׁמַ֥ע אִישָׁ֛הּ בְּי֥וֹם שׇׁמְע֖וֹ וְהֶחֱרִ֣ישׁ לָ֑הּ וְקָ֣מוּ נְדָרֶ֗יהָ וֶֽאֱסָרֶ֛הָ אֲשֶׁר־אָסְרָ֥ה עַל־נַפְשָׁ֖הּ יָקֻֽמוּ׃", "onk": "וְיִשְׁמַע בַּעֲלַהּ בְּיוֹמָא דִשְׁמַע וְיִשְׁתּוֹק לַהּ וִיקוּמוּן נִדְרָהָא וֶאֱסָרָהָא דִּי אֲסָרַת עַל נַפְשַׁהּ יְקוּמוּן:", "onk_en": "and her husband heard about them and remained silent on the day he heard, then her vows shall stand, and the self-imposed prohibitions shall stand.", "pj": "וְאִין בָּתַר דְאִתְנְסִיבַת נְדָרַת וְיִשְׁמַע בַּעֲלָהּ וּבְיוֹמָא דְשָׁמַע יִתְכַּוֵון לְקַיְימוּתְהוֹן וְיִשְׁתּוֹק לָהּ וְיִתְקַיְימוּן נִדְרָהָא וְאִיסְרָהָא דְאַסָרַת עַל נַפְשָׁהּ יִתְקַיְימוּן", "pj_en": "But if after she is married she make a vow, and her husband hear it, and on the day that he heareth it he is minded to confirm it, and is silent to her, then the vow and the bond which she hath bound upon her soul shall be ratified.", "tj": "", "tj_en": "", "rashi": "<b>ושמע אישה וגו'.<\/b> הֲרֵי לְךָ שֶׁאִם קִיֵּם הַבַּעַל שֶׁהוּא קַיָּם:", "rashi_en": "ושמע אישה וגו׳ BUT IF HER HUSBAND HEARD etc. — Here you have the case that if the husband confirmed the vow, it is confirmed. (That the father may confirm the vows of his betrothed daughter is given in v. 5 which statement applies also to w. 6 ff. — see Note)."}, {"ch": 30, "v": 9, "aliyah": 1, "heb": "וְ֠אִ֠ם בְּי֨וֹם שְׁמֹ֣עַ אִישָׁהּ֮ יָנִ֣יא אוֹתָהּ֒ וְהֵפֵ֗ר אֶת־נִדְרָהּ֙ אֲשֶׁ֣ר עָלֶ֔יהָ וְאֵת֙ מִבְטָ֣א שְׂפָתֶ֔יהָ אֲשֶׁ֥ר אָסְרָ֖ה עַל־נַפְשָׁ֑הּ וַיהֹוָ֖ה יִֽסְלַֽח־לָֽהּ׃", "onk": "וְאִם בְּיוֹמָא דִשְׁמַע בַּעֲלַהּ אַעְדִּי יָתַהּ וּבַטַּל יָת נִדְרָהָא דִּי עֲלַהּ וְיָת פֵּרוּשׁ סִפְוָתָהָא דִּי אֲסָרַת עַל נַפְשַׁהּ <b>וּמִן קֳדָם<\/b> יְיָ יִשְׁתְּבֵיק לַהּ:", "onk_en": "But, if on the day her husband hears about it, he restrains her, he then annuls her vow which was upon her, and self-imposed verbal prohibitions, and [<b>from before<\/b>] Adonoy will forgive her.", "pj": "וְאִין בְּיוֹמָא דְשָׁמַע בַּעֲלָהּ בָּטִיל לָהּ וְיִשְׁרֵי יַת נִדְרָהּ דַעֲלָהּ וְיַת פֵּירוּשׁ סִפְתָהָא דַאֲסָרַת עַל נַפְשָׁהּ וּמִן קֳדָם יְיָ יִשְׁתְּרֵי וְיִשְׁתְּבֵק לָהּ", "pj_en": "But if her husband prohibit her on the day that he heareth, then the vow which is upon her, and the utterance of her lips which bound her soul, are remitted and forgiven her.", "tj": "", "tj_en": "", "rashi": "<b>והפר את נדרה.<\/b> יָכוֹל אֲפִלּוּ לֹא הֵפֵר הָאָב, תַּ\"ל (פסוק י\"ז) \"בִּנְעֻרֶיהָ בֵּית אָבִיהָ\" — כָּל שֶׁבִּנְעוּרֶיהָ בִּרְשׁוּת אָבִיהָ הִיא (ספרי שם):", "rashi_en": "והפר את נדרה AND HE (THE HUSBAND) ANNULS HER VOW — One might think that since confirmation by the husband does not require the assent of the father, in the case mentioned here it is annulled even if the father has not annulled it! It, however, states, (v. 17): \"[These are the laws … relating to a father with his daughter] בנעריה בית אביה\" which means: so long as she is בנעריה (not fully married) she is under her father’s control (Sifrei Bamidbar 155; Ketuvot 46b)."}, {"ch": 30, "v": 10, "aliyah": 1, "heb": "וְנֵ֥דֶר אַלְמָנָ֖ה וּגְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר־אָסְרָ֥ה עַל־נַפְשָׁ֖הּ יָק֥וּם עָלֶֽיהָ׃", "onk": "וּנְדַר אַרְמְלָא וּמְתַרְכָא כֹּל דִּי אֲסָרַת עַל נַפְשַׁהּ יְקוּם עֲלַהּ:", "onk_en": "The vow of a widow or a divorced woman—everything she prohibited for herself shall remain incumbent upon her.", "pj": "וְנִדְרָא דְאַרְמְלָא וּמִתַרְכָא כָּל דְאַסָרַת עַל נַפְשָׁהּ יְקוּם עֲלָהּ", "pj_en": "Yet the vow of a widow, or a divorced, whatever hath bound her soul, shall be confirmed upon her.", "tj": "", "tj_en": "", "rashi": "<b>כל אשר אסרה על נפשה יקום עליה.<\/b> לְפִי שֶׁאֵינָהּ לֹא בִרְשׁוּת אָב וְלֹא בִרְשׁוּת בַּעַל, וּבְאַלְמָנָה מִן הַנִּשּׂוּאִין הַכָּתוּב מְדַבֵּר, אֲבָל אַלְמָנָה מִן הָאֵרוּסִין — מֵת הַבַּעַל נִתְרוֹקְנָה וְחָזְרָה רְשׁוּת לָאָב (נדרים ע'):", "rashi_en": "כל אשר אסרה על נפשה יקום עליה [BUT THE VOW OF A WIDOW AND OF ONE WHO IS DIVORCED] EVERYTHING WHEREWITH SHE HATH BOUND HER SOUL SHALL STAND AGAINST HER — because she is not under the control of a father or under the control of a husband. Scripture is speaking of one who is a widow after having been fully married (נשואה) (Sifrei Bamidbar 154:1), but in the case of one who becomes a widow after having only been betrothed, if her husband dies his entire authority becomes emptied (void) and returns to her father (Nedarim 70a)."}, {"ch": 30, "v": 11, "aliyah": 1, "heb": "וְאִם־בֵּ֥ית אִישָׁ֖הּ נָדָ֑רָה אֽוֹ־אָסְרָ֥ה אִסָּ֛ר עַל־נַפְשָׁ֖הּ בִּשְׁבֻעָֽה׃", "onk": "וְאִם בֵּית בַּעֲלַהּ נְדָרַת אוֹ אֲסָרַת אֵסַר עַל נַפְשַׁהּ בְּקִיּוּם:", "onk_en": "But, if she took the vow in her husband’s home, or has taken a self-imposed prohibitions upon herself, with an oath,", "pj": "וְאִין עַד דְהִיא בְּבֵית בַּעֲלָהּ וְלָא בָּגְרַת נָדְרַת אוֹ אָסְרַת אִסַר עַל נַפְשָׁהּ בְּקִיוּמָא", "pj_en": "But if, while she was in her husband's house, or while she had not attained to marriage years, she had vowed, or bound her soul with the bond of an oath", "tj": "", "tj_en": "", "rashi": "<b>ואם בית אשה נדרה.<\/b> בִּנְשׂוּאָה הַכָּתוּב מְדַבֵּר (שם ס\"ז):", "rashi_en": "ואם בית אישה נדרה AND IF SHE VOWED IN HER HUSBAND’S HOUSE — Here Scripture is speaking of a woman who is fully married (Sifrei Bamidbar 154:1; Nedarim 67a)."}, {"ch": 30, "v": 12, "aliyah": 1, "heb": "וְשָׁמַ֤ע אִישָׁהּ֙ וְהֶחֱרִ֣שׁ לָ֔הּ לֹ֥א הֵנִ֖יא אֹתָ֑הּ וְקָ֙מוּ֙ כׇּל־נְדָרֶ֔יהָ וְכׇל־אִסָּ֛ר אֲשֶׁר־אָסְרָ֥ה עַל־נַפְשָׁ֖הּ יָקֽוּם׃", "onk": "וְיִשְׁמַע בַּעֲלַהּ וְיִשְׁתּוֹק לַהּ לָא אַעְדִּי <b>יָתְהוֹן<\/b> וִיקוּמוּן כָּל נִדְרָהָא וְכָל אֱסָרֵי דִּי אֲסָרַת עַל נַפְשַׁהּ יְקוּמוּן:", "onk_en": "and her husband heard and remained silent, [and] did not restrain her [<b>them<\/b>], then all her vows shall stand, and all her self-imposed prohibitions shall stand.", "pj": "וְיִשְׁמַע בַּעֲלָהּ וְיִשְׁתּוֹק לָהּ וְלָא בָטִיל יָתָהּ וּמִית עַד דְלָא בָּגְרַת וְיִתְקַיְימוּן כָּל נִדְרָהָא וְכָל אִיסְרֵי דַאֲסָרַת עַל נַפְשָׁהּ יִתְקַיְימוּן וְלֵית אִיבָהָא זָכֵי בָהּ תּוּב לְבַטְלוּתְהוֹן", "pj_en": "which her husband had heard of, and had neither spoken nor prohibited her, or had died before she was married, then all her vows shall be confirmed, and all the obligations with which she had bound her soul be ratified, and her father shall have no power to absolve her.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 13, "aliyah": 1, "heb": "וְאִם־הָפֵר֩ יָפֵ֨ר אֹתָ֥ם&thinsp;<small>׀<\/small>&thinsp;אִישָׁהּ֮ בְּי֣וֹם שׇׁמְעוֹ֒ כׇּל־מוֹצָ֨א שְׂפָתֶ֧יהָ לִנְדָרֶ֛יהָ וּלְאִסַּ֥ר נַפְשָׁ֖הּ לֹ֣א יָק֑וּם אִישָׁ֣הּ הֲפֵרָ֔ם וַיהֹוָ֖ה יִֽסְלַֽח־לָֽהּ׃", "onk": "וְאִם בַּטָּלָא יְבַטֵּל יָתְהוֹן בַּעְלַהּ בְּיוֹמָא דִי שְׁמַע כָּל אַפָּקוּת סִפְוָתָהָא לְנִדְרָהָא וּלְאֵסַר נַפְשַׁהּ לָא יְקוּמוּן בַּעֲלַהּ בַּטֵּלִנּוּן <b>וּמִן קֳדָם<\/b> יְיָ יִשְׁתְּבֵיק לַהּ:", "onk_en": "But, if her husband annuls them on the day he hears them, then, whatever emanates from her lips regarding her vows and self-imposed prohibitions shall not stand. Her husband has annulled them, and [<b>from before<\/b>] Adonoy will forgive her.", "pj": "וְאִין מִישְׁרָא יִשְׁרֵי יַתְהוֹן בַּעֲלָהּ בְּיוֹמָא דְשָׁמַע כָּל אַפְקוּת שִפְתָהָא לְנִדְרָהָא וּלְאִיסְרֵי נַפְשָׁהָא לָא יִתְקַיְימוּן וְאִין בַּעֲלָהּ בְּטֵילִינוּן וְלָא יַדְעַת וַעֲבָרַת מִן קֳדָם יְיָ יִשְׁתְּבֵק לָהּ", "pj_en": "But if her husband released her on the day that he heard, then, whatever her lips had pronounced to be a vow, or a bond upon her soul, shall not be confirmed; and if her husband had annulled them, and she, not knowing, had performed, it shall be forgiven her before the Lord.", "tj": "בַּעֲלָהּ אַפֵּיס יַתְהוֹן:", "tj_en": "Her husband released her.", "rashi": "", "rashi_en": ""}, {"ch": 30, "v": 14, "aliyah": 1, "heb": "כׇּל־נֵ֛דֶר וְכׇל־שְׁבֻעַ֥ת אִסָּ֖ר לְעַנֹּ֣ת נָ֑פֶשׁ אִישָׁ֥הּ יְקִימֶ֖נּוּ וְאִישָׁ֥הּ יְפֵרֶֽנּוּ׃", "onk": "כָּל נְדַר וְכָל קִיּוּמַת אֵסָר לְסַגָּפָא נְפָשׁ בַּעֲלַהּ יְקַיְּמִנּוּן וּבַעֲלַהּ יְבַטְּלִנּוּן:", "onk_en": "Every vow and every oath of self-denial, her husband can [either] let it stand, or her husband can annul it.", "pj": "כָּל נִדְרָא וְכָל קִיוּם אִסְרָא לְסַגָפָא נְפַשׁ בַּעֲלָהּ יְקַיְימִינוּן וּבַעֲלָהּ יְבַטֵילִינוּן", "pj_en": "Every vow, every oath-bond to chasten the soul, her husband may ratify or annul.", "tj": "בַּעֲלָהּ יָפִיס יַתְהוֹן:", "tj_en": "Her husband had released them.", "rashi": "<b>כל נדר וכל שבעת אסר וגו'.<\/b> לְפִי שֶׁאָמַר שֶׁהַבַּעַל מֵפֵר, יָכוֹל כָּל נְדָרִים בְמַשְׁמָע, תַּ\"ל <b>לענת נפש<\/b> — אֵינוֹ מֵפֵר אֶלָּא נִדְרֵי עִנּוּי נֶפֶשׁ בִּלְבַד, וְהֵם מְפֹרָשִׁים בְּמַסֶּ' נְדָרִים (דף ע\"ט):", "rashi_en": "כל נדר וכל שבעת אסר וגו׳ EVERY VOW AND EVERY BINDING OATH [TO AFFLICT THE SOUL HER HUSBAND MAY CONFIRM IT OR HER HUSBAND MAY ANNUL IT] — Because it states that a husband may annul his wife’s vows, one might think that all vows are implied! It therefore states: “[every vow] …to afflict the soul” — he may annul only vows to afflict the soul, and these are set forth in Treatise Nedarim 79b."}, {"ch": 30, "v": 15, "aliyah": 1, "heb": "וְאִם־הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥הּ אִישָׁהּ֮ מִיּ֣וֹם אֶל־יוֹם֒ וְהֵקִים֙ אֶת־כׇּל־נְדָרֶ֔יהָ א֥וֹ אֶת־כׇּל־אֱסָרֶ֖יהָ אֲשֶׁ֣ר עָלֶ֑יהָ הֵקִ֣ים אֹתָ֔ם כִּי־הֶחֱרִ֥שׁ לָ֖הּ בְּי֥וֹם שׇׁמְעֽוֹ׃", "onk": "וְאִם מִשְׁתַּק יִשְׁתּוֹק לַהּ בַּעֲלַהּ מִיּוֹם לְיוֹם וִיקַיֵּם יָת כָּל נִדְרָהָא אוֹ יָת כָּל אֱסָרָהָא דִּי עֲלַהּ קַיַּם יָתְהוֹן אֲרֵי שָׁתֵק לַהּ בְּיוֹמָא דִשְׁמָע:", "onk_en": "But, if her husband remains silent from one day to the next, then he has upheld all her vows or all her prohibitions that she has assumed. He has upheld them because he remained silent on the day he heard.", "pj": "וְאִין מִשְׁתַּק יִשְׁתּוֹק וּמִתְכַּוֵון לָהּ בַּעֲלָהּ מִיוֹמָא דְשָׁמַע לְיוֹמָא חוֹרַן וְיִתְקַיְימוּן כָּל נִדְרָהָא אוֹ יַת כָּל אִיסְרָהָא דַעֲלָהּ וּבְמִשְׁתּוּקֵיהּ קְיַים יַתְהוֹן אֲרוּם שָׁתִיק לָהּ בְּיוֹמָא וְאִתְכַּוֵון וְלָא שְׁרִינוּן בְּיוֹמָא דְשָׁמַע", "pj_en": "But if her husband was silent and consented when he heard from one day to the next, then all her vows and all the bonds upon her are ratified; by his silence he hath confirmed them; for be was silent to her on the day, and consented, and absolved her not on the day that he heard.", "tj": "", "tj_en": "", "rashi": "<b>מיום אל יום.<\/b> שֶׁלֹּא תֹאמַר מֵעֵת לְעֵת, לְכָךְ נֶאֱמַר \"מִיּוֹם אֶל יוֹם\", לְלַמֶּדְךָ שֶׁאֵין מֵפֵר אֶלָּא עַד שֶׁתֶּחְשַׁךְ (נדרים ע\"ו):", "rashi_en": "מיום אל יום [BUT IF HER HUSBAND ALTOGETHER HOLD HIS PEACE AT HER] FROM DAY TO DAY — In order that you should not say that ביום שמעו in v. 13 means that the husband has the right of annulling from the time on the day when she made the vow to the same time on the next day (i.e., twenty-four hours), it accordingly states מיום אל יום, i.e., from the day when she makes the vow up to the next day, — to tell you that he may annul the vow only up to when it becomes dark, [for then another day begins] (cf. Nedarim 76b)."}, {"ch": 30, "v": 16, "aliyah": 1, "heb": "וְאִם־הָפֵ֥ר יָפֵ֛ר אֹתָ֖ם אַחֲרֵ֣י שׇׁמְע֑וֹ וְנָשָׂ֖א אֶת־עֲוֺנָֽהּ׃", "onk": "וְאִם בַּטָּלָא יְבַטֵּל יָתְהוֹן בָּתַר דִּשְׁמָע וִיקַבַּל יָת חוֹבַהּ:", "onk_en": "If he annuls them after having heard them, he must bear her transgression.”", "pj": "וְאִין מֵישְׁרָא יִשְׁרֵי לָהּ יוֹמָא חַד בָּתַר דְשָׁמַע לָא סַגְיָא לָהּ בְּשֵׁירוּתָא וְאִין מַפְסָא פִתְגָמָא בַּעֲלָהּ אוֹ אִיבָהּ מְקַבֵּל יַת חוֹבָהּ", "pj_en": "But if, absolving, he would absolve her one day after he had heard, there is no force in the absolution; and if he then nullify the word, her husband or her father shall bear her sin.", "tj": "", "tj_en": "", "rashi": "<b>אחרי שמעו.<\/b> אַחֲרֵי שֶׁשָּׁמַע וְקִיֵּם, שֶׁאָמַר אֶפְשִׁי בּוֹ, וְחָזַר וְהֵפֵר לָהּ אֲפִלּוּ בּוֹ בַּיּוֹם:<br><br><b>ונשא את עונה.<\/b> הוּא נִכְנָס תַּחְתֶּיהָ. לָמַדְנוּ מִכָּאן שֶׁהַגּוֹרֵם תַּקָּלָה לַחֲבֵרוֹ הוּא נִכְנָס תַּחְתָּיו לְכָל עֳנָשִׁין:", "rashi_en": "אחרי שמעו [BUT IF HE SHALL AT ALL ANNUL THEM] AFTER HE HATH HEARD THEM i.e., after he has heard and confirmed them — that he had said, “I am content with it”, then if he turns and annuls it even on the same day (Sifrei Bamidbar 156:2). <br><br>ונשא את עונה HE SHALL BEAR HER INIQUITY — He takes her place. We learn from here that he who makes another take a false step takes his place in respect to all punishments which he would incur (Sifrei Bamidbar 156:2)."}, {"ch": 30, "v": 17, "aliyah": 1, "heb": "אֵ֣לֶּה הַֽחֻקִּ֗ים אֲשֶׁ֨ר צִוָּ֤ה יְהֹוָה֙ אֶת־מֹשֶׁ֔ה בֵּ֥ין אִ֖ישׁ לְאִשְׁתּ֑וֹ בֵּֽין־אָ֣ב לְבִתּ֔וֹ בִּנְעֻרֶ֖יהָ בֵּ֥ית אָבִֽיהָ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אִלֵּין קְיָמַיָּא דִּי פַקִּיד יְיָ יָת משֶׁה בֵּין גְּבַר לְאִתְּתֵיהּ בֵּין אַבָּא לִבְרַתֵּיהּ בְּרַביוּתָהָא בֵּית אָבוּהָא:", "onk_en": "These are the statutes that Adonoy commanded Moshe, regarding a man and his wife, a father and his daughter in her youth, while in her father’s house.", "pj": "אִלֵין אַחֲוָויַת קְיָימַיָא דְפַקֵיד יְיָ יַת משֶׁה בֵּין גְבַר לְאִתְּתֵיהּ בֵּין אִיבָא לִבְרַתֵּיהּ בְּיוֹמֵי טַלְיוּתָא עַד דְהִיא בְּבֵית אִיבָהָא וְלָא בְּיוֹמֵי טַלְיוּתָא וְהִיא בְּבֵית בַּעֲלָהּ", "pj_en": "These are the publications of the statutes which the Lord commanded Mosheh (on these matters) between a man and his wife, and a father and his daughter in the day of her youth in her father's house; but not in the time of her youth, and she be in the house of her husband.", "tj": "בְּיוֹמֵי טַלְיוּתָהּ בְּבֵיתֵיהּ דַאֲבוּהָא:", "tj_en": "In the time of her youth in her father's house.", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 1, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying.", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 2, "aliyah": 1, "heb": "נְקֹ֗ם נִקְמַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מֵאֵ֖ת הַמִּדְיָנִ֑ים אַחַ֖ר תֵּאָסֵ֥ף אֶל־עַמֶּֽיךָ׃", "onk": "אִתְפְּרַע <b>פֻּרְעֲנוּת<\/b> בְּנֵי יִשְׂרָאֵל מִן מִדְיָנָאֵי בָּתַר כֵּן תִּתְכְּנֵשׁ לְעַמָּיךְ:", "onk_en": "“Take revenge for [<b>retaliate for the evil done to<\/b>] Bnei Yisroel against the Midianites, afterward, you shall be gathered to your people (die).”", "pj": "אִתְפְּרַע פּוּרְעָנוּת בְּנֵי יִשְרָאֵל מִן מִדְיָנָאֵי וּמִן בָּתַר כְּדֵין תִּתְכְּנֵשׁ לְעַמָךְ", "pj_en": "Take retribution for the children of Israel from the Midianites; and afterward thou shalt be gathered to thy people.", "tj": "", "tj_en": "", "rashi": "<b>מאת המדינים.<\/b> וְלֹא מֵאֵת הַמּוֹאָבִים, שֶׁהַמּוֹאָבִים נִכְנְסוּ לַדָּבָר מֵחֲמַת יִרְאָה, שֶׁהָיוּ יְרֵאִים מֵהֶם שֶׁיִּהְיוּ שׁוֹלְלִים אוֹתָם, שֶׁלֹּא נֶאֱמַר אֶלָּא \"וְאַל תִּתְגָּר בָּם מִלְחָמָה\" (דברים ב'), אֲבָל מִדְיָנִים נִתְעַבְּרוּ עַל רִיב לֹא לָהֶם; דָּ\"אַ, מִפְּנֵי שְׁנֵי פְרֵידוֹת טוֹבוֹת שֶׁיֵּשׁ לִי לְהוֹצִיא מֵהֶם — רוּת הַמּוֹאֲבִיָּה וְנַעֲמָה הָעַמּוֹנִית (בבא קמא ל\"ח):", "rashi_en": "מאת המדינים [AVENGE THE CHILDREN OF ISRAEL] OF THE MIDIANITES — but not of the Moabites, for the Moabites entered into the matter out of fear, because they feared that they might plunder them, since about them it was stated only, (Deuteronomy 2:9) “Do not contend with them in battle”; but the Midianites, however, had got excited (had interfered) in a quarrel that did not concern them. Another explanation of why God forbade them to wage war against the Moabites, and which explains at the same time why they had been forbidden to wage war against the Ammonites (cf. Deuteronomy 2:19): because, said He, of the two goodly doves (virtuous women) which I am to bring forth from them, — Ruth the Moabitess, and Naamah the Ammonitess [Solomon's wife] (Bava Kamma 38b)."}, {"ch": 31, "v": 3, "aliyah": 1, "heb": "וַיְדַבֵּ֤ר מֹשֶׁה֙ אֶל־הָעָ֣ם לֵאמֹ֔ר הֵחָלְצ֧וּ מֵאִתְּכֶ֛ם אֲנָשִׁ֖ים לַצָּבָ֑א וְיִהְיוּ֙ עַל־מִדְיָ֔ן לָתֵ֥ת נִקְמַת־יְהֹוָ֖ה בְּמִדְיָֽן׃", "onk": "וּמַלִּיל משֶׁה עִם עַמָּא לְמֵימַר זְרִיזוּ מִנְּכוֹן גֻּבְרִין לְחֵילָא וִיהוֹן עַל מִדְיָן לְמֵיהַב פֻּרְעֲנוּת <b>דִּין עַמָּא<\/b> דַיְיָ בְּמִדְיָן:", "onk_en": "Moshe spoke to the people, saying: “Arm men from among yourselves for the army and they will be against Midian, to bring revenge [<b>for the nation<\/b>] of Adonoy against Midian.", "pj": "וּמַלֵיל משֶׁה עִם עַמָא לְמֵימָר אִזְדַרְזוּ לְוַותְכוֹן גוּבְרִין לְחֵילָא וִיהוֹן מְסַדְרִין סִדְרֵי קְרָבָא עַל מִדְיָן לְמִתַּן פּוּרְעָנוּת עַמָא דַיְיָ בְּמִדְיָן", "pj_en": "And Moses spake with the people, saying: Arm of you men, for the host to make war against Midian, to give the people of the Lord avengement upon Midian;", "tj": "אִזְדַיָנוּ מִן לְוַותְכוֹן:", "tj_en": "Arm of you,", "rashi": "<b>וידבר משה וגו'.<\/b> אַעַ\"פִּ שֶׁשָּׁמַע שֶׁמִּיתָתוֹ תְלוּיָה בַּדָּבָר עָשָׂה בְשִׂמְחָה וְלֹא אֵחַר (ספרי):<br><br><b>החלצו.<\/b> כְּתַרְגּוּמוֹ, לְשׁוֹן חֲלוּצֵי צָבָא — מְזֻיָּנִים:<br><br><b>אנשים.<\/b> צַדִּיקִים, וְכֵן \"בְּחַר לָנוּ אֲנָשִׁים\" (שמות י\"ז), וְכֵן \"אֲנָשִׁים חֲכָמִים וִידֻעִים\" (דברים א'):<br><br><b>נקמת ה'.<\/b> שֶׁהָעוֹמֵד כְּנֶגֶד יִשְׂרָאֵל כְּאִלּוּ עוֹמֵד כְּנֶגֶד הַקָּבָּ\"ה:", "rashi_en": "וידבר משה וגו׳ AND MOSES SPAKE etc. — Although he had heard (v. 2) that his death was associated with this matter, he did it gladly and did not delay (Sifrei Bamidbar 157:2).<br><br>החלצו — Understand this as the Targum does in the sense of “equipped (חלוצי) for war”, armed.<br><br>אנשים MEN — righteous men, and similar is, (Exodus 17:9) “Choose men for us”, and so, too, (Deuteronomy 1:13) “men wise and well-known” (Midrash Tanchuma, Matot 3).<br><br>‎'נקמת ה‎ “THE VENGEANCE OF THE LORD” — [This is really equivalent to the expression God had employed (v.2), “the vengeance of the children of Israel”], because whoever attacks Israel is as though he attacks the Holy One blessed be He."}, {"ch": 31, "v": 4, "aliyah": 1, "heb": "אֶ֚לֶף לַמַּטֶּ֔ה אֶ֖לֶף לַמַּטֶּ֑ה לְכֹל֙ מַטּ֣וֹת יִשְׂרָאֵ֔ל תִּשְׁלְח֖וּ לַצָּבָֽא׃", "onk": "אַלְפָא לְשִׁבְטָא אַלְפָא לְשִׁבְטָא לְכֹל שִׁבְטַיָּא דְיִשְׂרָאֵל תְּשַׁלְּחוּן לְחֵילָא:", "onk_en": "One thousand from each tribe, one thousand from each tribe, for all of the tribes of Yisroel, you shall send into the army.”", "pj": "אַלְפָא לְשִׁבְטָא אַלְפָא לְשִׁבְטָא לְכָל שִׁבְטַיָא דְיִשְרָאֵל תְּשַׁדְרוּן לְחֵילָא", "pj_en": "a thousand of each tribe of all the tribes of Israel send ye to the war.", "tj": "", "tj_en": "", "rashi": "<b>לכל מטות ישראל.<\/b> לְרַבּוֹת שֵׁבֶט לֵוִי (ספרי):", "rashi_en": "לכל מטות ישראל [A THOUSAND OF EVERY TRIBE] THROUGHOUT ALL THE TRIBES OF ISRAEL — including, therefore, the tribe of Levi (Sifrei Bamidbar 157:3)."}, {"ch": 31, "v": 5, "aliyah": 1, "heb": "וַיִּמָּֽסְרוּ֙ מֵאַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַמַּטֶּ֑ה שְׁנֵים־עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא׃", "onk": "<b>וְאִתְבְּחָרוּ<\/b> מֵאַלְפַיָּא דְיִשְׂרָאֵל אַלְפָא לְשִׁבְטָא תְּרֵי עֲשַׂר אַלְפִין מְזָרְזֵי חֵילָא:", "onk_en": "They were handed over [<b>chosen<\/b>] from among the thousands of Yisroel, one thousand from each tribe, twelve thousand armed men for the army.", "pj": "וְאִתְבְּחָרוּ גוּבְרִין צַדִיקִין וּמְסָרוּן נַפְשְׁהוֹן מֵאַלְפַיָא דְיִשְרָאֵל אַלְפָא לְשִׁבְטָא תְּרֵיסַר אַלְפִין מְזַרְזֵי חֵילָא", "pj_en": "And of the thousands of Israel fit men were chosen who gave up themselves, a thousand of a tribe, twelve thousand, armed for the war.", "tj": "", "tj_en": "", "rashi": "<b>וימסרו.<\/b> לְהוֹדִיעֲךָ שִׁבְחָן שֶׁל רוֹעֵי יִשְׂרָאֵל כַּמָּה הֵם חֲבִיבִים עַל יִשְׂרָאֵל, עַד שֶׁלֹּא שָׁמְעוּ בְמִיתָתוֹ מַה הוּא אוֹמֵר? \"עוֹד מְעַט וּסְקָלֻנִי\" (שמות י\"ז), וּמִשֶּׁשָּׁמְעוּ שֶׁמִּיתַת מֹשֶׁה תְלוּיָה בְנִקְמַת מִדְיָן לֹא רָצוּ לָלֶכֶת עַד שֶׁנִּמְסְרוּ עַל כָּרְחָן (ספרי):", "rashi_en": "וימסרו SO THERE WERE HANDED OVER … [A THOUSAND OF EVERY TRIBE] — This serves to tell you in what high esteem the shepherds of Israel were really held — how dear they were to Israel. Up until they had heard of his approaching death what does it state? That Moses felt constrained to exclaim about them, “They are almost ready to stone me”! (Exodus 17:14). But when they heard that Moses’ death was associated with the execution of vengeance upon Midian (cf. v. 2), they refused to go to war until they were “handed over” against their own will (Sifrei Bamidbar 157:3)."}, {"ch": 31, "v": 6, "aliyah": 1, "heb": "וַיִּשְׁלַ֨ח אֹתָ֥ם מֹשֶׁ֛ה אֶ֥לֶף לַמַּטֶּ֖ה לַצָּבָ֑א אֹ֠תָ֠ם וְאֶת־פִּ֨ינְחָ֜ס בֶּן־אֶלְעָזָ֤ר הַכֹּהֵן֙ לַצָּבָ֔א וּכְלֵ֥י הַקֹּ֛דֶשׁ וַחֲצֹצְר֥וֹת הַתְּרוּעָ֖ה בְּיָדֽוֹ׃", "onk": "וּשְׁלַח יָתְהוֹן משֶׁה אַלְפָא לְשִׁבְטָא לְחֵילָא יָתְהוֹן וְיָת פִּינְחָס בַּר אֶלְעָזָר כַּהֲנָא לְחֵילָא וּמָנֵי דְקוּדְשָׁא וַחֲצַצְרַת <b>יַבֶּבְתָּא<\/b> בִּידֵיהּ:", "onk_en": "Moshe sent, one thousand from each tribe to the army, them, and Pinchas, son of Elozor the <i>kohein<\/i> to the army, with the sacred vessels and the trumpets [<b>of wailing<\/b>] in his hand.", "pj": "וּשְׁדַר יַתְהוֹן משֶׁה אַלְפָא לְשִׁבְטָא לְחֵילָא יַתְהוֹן וְיַת פִּנְחָס בַּר אֶלְעָזָר כַּהֲנָא לְחֵילָא וְאוּרַיָא וְתֻמַיָא דְקוּדְשַׁיָא לִמְשַׁיְילָא בְּהוֹן וַחֲצוֹצְרוֹת יַבָּבָא בִּידֵיהּ לְמִכְנַשׁ וּלְמִשְׁרֵי וּלְמֵיטַל מַשְׁרִיתָא דְיִשְרָאֵל", "pj_en": "And Mosheh sent them, a thousand of each tribe to the war, them and Phinehas bar Elazar the priest unto the war, with the Uraia and Thummaia consecrated to inquire for them, and the Jubilee trumpets in his hand for assembling, encamping, and ordering forward the host of Israel.", "tj": "", "tj_en": "", "rashi": "<b>אתם ואת פינחס.<\/b> מַגִּיד שֶׁהָיָה פִינְחָס שָׁקוּל כְּנֶגֶד כֻּלָּם (ספרי); וּמִפְּנֵי מָה הָלַךְ פִּינְחָס וְלֹא הָלַךְ אֶלְעָזָר? אָמַר הַקָּבָּ\"ה מִי שֶׁהִתְחִיל בַּמִּצְוָה, שֶׁהָרַג כָּזְבִּי בַת צוּר, יִגְמֹר; דָּ\"אַ — שֶׁהָלַךְ לִנְקֹם נִקְמַת יוֹסֵף אֲבִי אִמּוֹ, שֶׁנֶּאֱמַר \"וְהַמְּדָנִים מָכְרוּ אֹתוֹ\" (בראשית ל\"ז); וּמִנַּיִן שֶׁהָיְתָה אִמּוֹ שֶׁל פִּינְחָס מִשֶּׁל יוֹסֵף? שֶׁנֶּאֱמַר \"מִבְּנוֹת פּוּטִיאֵל\" (שמות ו') — מִזֶּרַע יִתְרוֹ שֶׁפִּטֵּם עֲגָלִים לַעֲ\"זָ, וּמִזֶּרַע יוֹסֵף שֶׁפִּטְפֵּט בְּיִצְרוֹ (סוטה מ\"ג); דָּבָר אַחֵר — שֶׁהָיָה מְשׁוּחַ מִלְחָמָה (שם):<br><br><b>וכלי הקדש.<\/b> זֶה הָאָרוֹן וְהַצִּיץ, שֶׁהָיָה בִּלְעָם עִמָּהֶם וּמַפְרִיחַ מַלְכֵי מִדְיָן בִּכְשָׁפִים וְהוּא עַצְמוֹ פוֹרֵחַ עִמָּהֶם, הֶרְאָה לָהֶם אֶת הַצִּיץ שֶׁהַשֵּׁם חָקוּק בּוֹ וְהֵם נוֹפְלִים, לְכָךְ נֶאֱמַר \"עַל חַלְלֵיהֶם\" בְּמַלְכֵי מִדְיָן — שֶׁנּוֹפְלִים עַל הַחֲלָלִים מִן הָאֲוִיר, וְכֵן בְּבִלְעָם כָּתוּב \"עַל חַלְלֵיהֶם\" בְּסֵ' יְהוֹשֻׁעַ (תנחומא):<br><br><b>בידו.<\/b> בִּרְשׁוּתוֹ, וְכֵן (במדבר כ\"א) \"וַיִּקַּח אֶת כָּל אַרְצוֹ מִיָּדוֹ\" (ספרי):", "rashi_en": "אתם ואת פינחס [MOSES SENT THEM … TO THE WAR], THEM AND PHINEAS — The repetition of the word אתם, “them”, in association with Phineas’ name tells us that Phineas was regarded as equal to all of them together. — But why did Phineas go and Eleazar did not go? The Holy One, blessed be He, said, “He who made a beginning with this meritorious work, in that he slew Kozbi the daughter of Zur (who was a Midianitess), let him complete it”. — Another explanation why Phineas and not Eleazar went is that he went to take vengeance for Joseph, his mother’s ancestor, as it is said, (Genesis 37:36) “And the Midianites sold him [unto Egypt]”. And from where do we know that Phineas’ mother was of the family of Joseph? Because it is said, (Exodus 6:25) that she was “one of the daughters of Putiel” (see Rashi on that verse) — which is explained to mean that she was of the seed of Jethro who used to fatten (פטם) calves for idolatrous worship, and of the seed of Joseph who overcame (שפטפט, who talked or argued with) his passions (cf. Sifrei Bamidbar 157:4; Sotah 43a). — Another explanation: Phineas went because he was the high priest anointed for war purposes (cf. Deuteronomy 20:2 and Rashi thereon) (Sotah 43a).<br><br>וכלי הקדש AND THE VESSELS OF HOLINESS … [WERE WITH THEM] — these were the Ark and the Golden Plate (which are termed קדש, “holiness”, in Numbers 4:20 and Leviticus 8:9 respectively) (cf. Sifrei Bamidbar 157:4; Sotah 43a). — Because Balaam was with them (the Midianites) and through enchantment he made the kings of Midian float in the air and he himself floated with them, he (Phineas) showed them (held up to them) the Golden Plato upon which the Divine Name was engraved and they immediately fell to the ground. On this account it is said (v. 8) of the Kings of Midian that they were killed “upon those belonging to them who had been killed”, meaning that they fell from the air upon those who had already been killed; and similarly of Balaam it is written in the book of Joshua (13:22): “[And Balaam the son of Beor did the children of Israel slay] upon those who were slain by them” (Midrash Tanchuma, Matot 2; Talmud Yerushalmi Sanhedrin 10:2).<br><br>בידו means IN HIS POSSESSION (not actually “in his hand”, for it was impossible for him to hold these sacred objects in his hand), similar to (21:26) “And he took all his land from his possession (מידו)” (Sifrei Bamidbar 157:4)."}, {"ch": 31, "v": 7, "aliyah": 1, "heb": "וַֽיִּצְבְּאוּ֙ עַל־מִדְיָ֔ן כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶׁ֑ה וַיַּֽהַרְג֖וּ כׇּל־זָכָֽר׃", "onk": "וְאִתְחַיָּלוּ עַל מִדְיָן כְּמָא דִי פַּקִּיד יְיָ יָת משֶׁה וּקְטָלוּ כָּל דְּכוּרָא:", "onk_en": "They mounted a campaign against Midian, as Adonoy had commanded Moshe, and they killed every male.", "pj": "וְאִתְחַיָילוּן עַל מִדְיָן אַקְפוּהָ מִתְּלַת טְרִיגוּנָהָא הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה וּקְטָלוּ כָּל דְכוּרָא", "pj_en": "And they warred against Midian, circumventing them from three corners, as the Lord had instructed Mosheh, and they killed every male;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 8, "aliyah": 1, "heb": "וְאֶת־מַלְכֵ֨י מִדְיָ֜ן הָרְג֣וּ עַל־חַלְלֵיהֶ֗ם אֶת־אֱוִ֤י וְאֶת־רֶ֙קֶם֙ וְאֶת־צ֤וּר וְאֶת־חוּר֙ וְאֶת־רֶ֔בַע חֲמֵ֖שֶׁת מַלְכֵ֣י מִדְיָ֑ן וְאֵת֙ בִּלְעָ֣ם בֶּן־בְּע֔וֹר הָרְג֖וּ בֶּחָֽרֶב׃", "onk": "וְיָת מַלְכֵי מִדְיָן קְטָלוּ עַל קְטִילֵיהוֹן יָת אֱוִי וְיָת רֶקֶם וְיָת צוּר וְיָת חוּר וְיָת רֶבַע חַמְשָׁא מַלְכֵי מִדְיָן וְיָת בִּלְעָם בַּר בְּעוֹר קְטָלוּ בְחַרְבָּא:", "onk_en": "They killed the Midianite kings upon those they had slain: Evi, Rekem, Tzur, Chur and Reva—[the] five kings of Midian. And Bil’am son of Beor they killed with the sword.", "pj": "וְיַת מַלְכֵי מִדְיָנָאֵי קְטָלוּ עַל קְטוּלֵי מַשִׁרְיַיתְהוֹן יַת אֱוִי וְיַת רֶקֶם וְיַת צוּר הוּא בָּלָק וְיַת חוּר וְיַת רֶבַע חֲמֵשֶׁת מַלְכֵי מִדְיָן וְיַת בִּלְעָם בַּר בְּעוֹר קְטָלוּ בְּסַיְיפָא וַהֲוָה כֵּיוַן דְחָמָא בִּלְעָם חַיָיבָא יַת פִּינְחָס כַּהֲנָא רָדִיף מִן בַּתְרוֹי עָבַד מִלְתָא דְקוּסְמִין וּפָרַח בְּאַוִיר שְׁמַיָא מִן יַד אִידְכַּר פִּינְחָס שְׁמָא רַבָּא וְקַדִישָׁא וּפָרַח בַּתְרוֹי וְאַחְדֵיהּ בְּרֵישֵׁיהּ וְאַחְתֵיהּ שְׁלַף סַיְיפָא וּבְעָא לְמִקְטְלֵיהּ פָּתַח פּוּמֵיהּ בְּמִילֵי תַחֲנוּנִין וַאֲמַר לְפִינְחָס אִין תְּקַיֵים יַת נַפְשִׁי מִשְׁתַּבַּעְנָא לָךְ דְכָל יוֹמִין דַאֲנָא קְיַים לֵית אֲנָא מְלַטֵיט יַת עַמָךְ עָנֵי וַאֲמַר לֵיהּ הֲלָא אַנְתְּ הוּא לָבָן אֲרַמָאָה דְבָעִית לְמֵישֵׁיצַיָא יַת יַעֲקב אָבוּנָן וּנְחָתַת לְמִצְרַיִם בְּגִין לְמוֹבְדָא זַרְעָא וּמִן בָּתַר דִנְפָקוּ מִמִצְרַיִם גָרֵיתָא בְּהוֹן עֲמָלֵק רַשִׁיעָא וּכְדוֹן אִיתְגְרָתָא אִיתְגְרָא לְמֵילוֹט יַתְהוֹן וְכֵיוַן דְחָמִיתָא דְלָא אַהַנְיַן עוֹבָדָךְ וְלָא קַבֵּיל מֵימְרָא דַיְיָ מִינָךְ אִמְלִיכַת מַלְכָּא בִּישָׁא יַת בָּלָק לְמוּקְמָא יַת בְּנָתֵיהּ בְּפַרְשַׁת אוֹרְחָתָא לְמִטְעַיָא יַתְהוֹן וּנְפָלוּ בְּגִין כֵּן מִנְהוֹן עֶשְרִין וְאַרְבְּעָא אַלְפִין בְּגִין כֵּן לֵית אֶפְשַׁר תּוּב לִמְקַיְימָא יַת נַפְשָׁךְ וּמִן יַד שָׁלַף סַיְיפֵיהּ מִן תְּיָקָא וְקַטְלֵיהּ", "pj_en": "and they slew the kings of the Midianites with the slain of their armies, Evi, Rekem, Zur, who is Balak, and Hur and Reba, five kings of Midian; and Bileam bar Beor they killed with the sword. And it was when Bileam the guilty saw Phinehas the priest pursuing him, he made use of his magical arts, (lit., made words of enchantment,) and flew in the air of the heavens; but Phinehas forthwith pronounced the Great and Holy Name, and flew after him, and seized him by his head, and bringing him down drew the sword, and sought to kill him; but he opened his mouth with words of deprecation, and said to Phinehas: If thou wilt spare my life, I swear to thee that all the days I live I will not curse thy people. He answered him, and said: Art thou not Laban the Amarite who didst seek to destroy Jakob our father, who wentest down into Mizraim, to destroy his children, and, after they had come out of Mizraim, didst send the wicked Amalek against them; and hast thou not now been sent to curse them? But after thou hadst seen that thy works did not prosper, and that the Word of the Lord would not hear thee, thou didst give the evil counsel to Balak to set his daughters in the way to make them go wrong, when there fell of them twentyfour thousand. Therefore, it cannot be that thy life may be spared; and at once he drew the sword and slew him.", "tj": "", "tj_en": "", "rashi": "<b>חמשת מלכי מדין.<\/b> וְכִי אֵינִי רוֹאֶה שֶׁחֲמִשָּׁה מָנָה הַכָּתוּב? לָמָּה הֻזְקַק לוֹמַר חֲמֵשֶׁת? אֶלָּא לְלַמֶּדְךָ שֶׁשָּׁווּ כֻלָּם בָּעֵצָה וְהֻשְׁווּ כֻלָּם בַּפֻּרְעָנוּת (שם); בִּלְעָם הָלַךְ שָׁם לִטֹּל שְׂכַר עֶשְׂרִים וְאַרְבָּעָה אֶלֶף שֶׁהִפִּיל מִיִּשְׂרָאֵל בַּעֲצָתוֹ, וְיָצָא מִמִּדְיָן לִקְרַאת יִשְׂרָאֵל וּמַשִּׂיאָן עֵצָה רָעָה — אָמַר לָהֶם אִם כְּשֶׁהֱיִיתֶם שִׁשִּׁים רִבּוֹא לֹא יְכָלְתֶּם לָהֶם, וְעַכְשָׁיו בְּי\"ב אֶלֶף אַתֶּם בָּאִים לְהִלָּחֵם? — נָתְנוּ לוֹ שְׂכָרוֹ מִשָּׁלֵם וְלֹא קִפְּחוּהוּ (ספרי):<br><br><b>בחרב.<\/b> הוּא בָא עַל יִשְׂרָאֵל וְהֶחֱלִיף אֻמָּנוּתוֹ בְּאֻמָּנוּתָם, שֶׁאֵין נוֹצְחִים אֶלָּא בְּפִיהֶם וְעַל יְדֵי תְפִלָּה וּבַקָּשָׁה, וּבָא הוּא וְתָפַשׂ אֻמָּנוּתָם לְקַלְּלָם בְּפִיו, אַף הֵם בָּאוּ עָלָיו וְהֶחֱלִיפוּ אֻמָּנוּתָם בְּאֻמָּנוּת הָאֻמּוֹת שֶׁבָּאִין בַּחֶרֶב, שֶׁנֶּאֱמַר \"וְעַל חַרְבְּךָ תִחְיֶה\" (בראשית כ\"ז):", "rashi_en": "חמשת מלכי מדין THE FIVE KINGS OF MIDIAN — But can I not see that Scripture has enumerated five; why, then, does it feel compelled to say that there were five? But it is to tell you that even as they had all been alike in the plot, so, too, they were treated alike in the punishment that befell them (cf. Rashi on Genesis 25:22, where, as here, the total of the names mentioned is stated) (Sifrei Bamidbar 157:5). — Balaam had gone there to receive the reward for the 24,000 whom he had made to fall of Israel through his counsel and now also he left Midian to meet Israel and gave them bad advice: viz., he said to them, “If, when you were 600,000 you were unable to overcome them, now you come to war against them with 12,000?” They gave him his full reward and did not stint it (they slew him) (Sifrei Bamidbar 157:5).<br><br>בחרב [BALAAM ALSO … THEY SLEW] WITH THE SWORD — He came against Israel exchanging his metier (the sword) for their metier (the mouth), for they conquer only through their mouth — through prayer and petition, and he came and availed himself of their craft to curse them with his mouth. They, therefore, also came against him and exchanged their craft for the craft of the heathen peoples who come with the sword, as it is said, (Genesis 27:40) “And by thy sword shalt thou live” (cf. Rashi on Numbers 22:23)."}, {"ch": 31, "v": 9, "aliyah": 1, "heb": "וַיִּשְׁבּ֧וּ בְנֵי־יִשְׂרָאֵ֛ל אֶת־נְשֵׁ֥י מִדְיָ֖ן וְאֶת־טַפָּ֑ם וְאֵ֨ת כׇּל־בְּהֶמְתָּ֧ם וְאֶת־כׇּל־מִקְנֵהֶ֛ם וְאֶת־כׇּל־חֵילָ֖ם בָּזָֽזוּ׃", "onk": "וּשְׁבוֹ בְנֵי יִשְׂרָאֵל יָת נְשֵׁי מִדְיָן וְיָת טַפְלְהוֹן וְיָת כָּל בְּעִירְהוֹן וְיָת כָּל גֵּיתֵיהוֹן וְיָת כָּל נִכְסֵיהוֹן בְּזוֹ:", "onk_en": "Bnei Yisroel took captive the Midianite women and their children. All their livestock, flocks and wealth they took as booty.", "pj": "וּשְׁבוּ בְּנֵי יִשְרָאֵל יַת נְשֵׁיהוֹן דְמִדְיָנָאֵי וְיַת טַפְלֵיהוֹן וְיַת כָּל בְּעִירֵיהוֹן וְיַת כָּל גֵיתֵיהוֹן וְיַת כָּל נִיכְסֵיהוֹן בָּזוּ", "pj_en": "And the sons of Israel led captive the wives of the Midianites, their children, their cattle, and all their flocks, and destroyed all their goods;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 10, "aliyah": 1, "heb": "וְאֵ֤ת כׇּל־עָרֵיהֶם֙ בְּמ֣וֹשְׁבֹתָ֔ם וְאֵ֖ת כׇּל־טִֽירֹתָ֑ם שָׂרְפ֖וּ בָּאֵֽשׁ׃", "onk": "וְיָת כָּל קִרְוֵיהוֹן בְּמוֹתְבָנֵיהוֹן וְיָת כָּל <b>בֵּית סִגְדַתְהוֹן<\/b> אוֹקִידוּ בְּנוּרָא:", "onk_en": "All their residential cities and palaces [<b>houses of worship<\/b>] they set on fire.", "pj": "וְיַת כָּל קוּרְיֵיהוֹן וּבָתֵּי טִירוֹנֵיהוֹן וְיַת בַּמְסֵי בֵּית סַגְדֵיהוֹן אוֹקִידוּ בְּנוּרָא", "pj_en": "and all their towns, the houses, of their rulers, and the high places of their houses of worship, they burned with fire;", "tj": "", "tj_en": "", "rashi": "<b>טירתם.<\/b> מְקוֹם נוֹטִירִין שֶׁלָּהֶם, שֶׁהוּא לְשׁוֹן מוֹשַׁב כּוּמָרִים יוֹדְעֵי חֻקֵּיהֶם; דָּ\"אַ — לְשׁוֹן מוֹשַׁב שָׂרֵיהֶם, כְּמוֹ שֶׁמְּתֻרְגָּם \"סַרְנֵי פְלִשְׁתִּים\" (שמואל א ו') — טוּרְנֵי פְלִשְׁתָּאֵי:", "rashi_en": "טירתם means the place of their scribes (notarii) — a term which is denoting the dwelling-place of their priests, those well acquainted with their laws (cf. Siphre). Another explanation is that it means the place of their princes, just as “the lords of the Philistines” (I Samuel 6:4) is translated in the Targum by “the טורני of the Philistines” (Sifrei Bamidbar 157:5)."}, {"ch": 31, "v": 11, "aliyah": 1, "heb": "וַיִּקְחוּ֙ אֶת־כׇּל־הַשָּׁלָ֔ל וְאֵ֖ת כׇּל־הַמַּלְק֑וֹחַ בָּאָדָ֖ם וּבַבְּהֵמָֽה׃", "onk": "<b>וּשְׁבוֹ<\/b> יָת כָּל עֲדָאָה וְיָת כָּל דְּבַרְתָּא בֶּאֱנָשָׁא וּבִבְעִירָא:", "onk_en": "They took [<b>captured<\/b>] all the booty, all that had been seized, of man and livestock,", "pj": "וּשְׁבוּ יַת כָּל עָדִיתָא וְיַת כָּל דְבַרְתָּא בְּאֵינָשָׁא וּבִבְעִירָא", "pj_en": "but they took all the spoil and the prey both of men and beasts,", "tj": "", "tj_en": "", "rashi": "<b>ויקחו את כל השלל וגו'.<\/b> מַגִּיד שֶׁהָיוּ כְשֵׁרִים וְצַדִּיקִים, וְלֹא נֶחְשְׁדוּ עַל הַגֶּזֶּל לִשְׁלֹחַ יָד בַּבִּזָּה שֶׁלֹּא בִרְשׁוּת, שֶׁנֶּאֱמַר <b>את כל השלל וגו'<\/b>, וַעֲלֵיהֶם מְפֹרָשׁ בַּקַּבָּלָה \"שִׁנַּיִךְ כְּעֵדֶר הָרְחֵלִים\" וְגוֹ' (שיר השירים ו׳:ו׳) — אַף אַנְשֵׁי הַמִּלְחָמָה שֶׁבָּךְ כֻּלָּם צַדִּיקִים:<br><br><b>שלל.<\/b> הֵן מִטַּלְטְלִין שֶׁל מַלְבּוּשׁ וְתַכְשִׁיטִין:<br><br><b>בז.<\/b> הוּא בִזַּת מִטַּלְטְלִין שֶׁאֵינָם תַּכְשִׁיט:<br><br><b>מלקוח.<\/b> אָדָם וּבְהֵמָה, וּבְמָקוֹם שֶׁכָּתוּב שְׁבִי אֵצֶל מַלְקוֹחַ, שְׁבִי בָאָדָם וּמַלְקוֹחַ בַּבְּהֵמָה:", "rashi_en": "ויקחו את כל השלל AND THEY TOOK ALL THE SPOIL…[AND THEY BROUGHT IT TO MOSES] — This tells us that they were pious and righteous men and were not suspected of robbery by stretching out their hand against the spoil without permission, for it is said, “they took all the spoil … [and brought it to Moses]” (Sifrei Bamidbar 157:5). About them it is expressed in the traditional literature (Songs 6:6): “They teeth are like a flock of ewes … [whereof all are perfect]’ — i.e., even thy soldiers are all righteous (see Rashi Songs 4:2)<br><br>שלל are movables consisting of clothing and ornaments.<br><br>בז is booty of movables that are not ornaments.<br><br>מלקוח are men and cattle, but in any passage where שבי is written in association with מלקוח, the term שבי applies to men and מלקוח to cattle alone."}, {"ch": 31, "v": 12, "aliyah": 1, "heb": "וַיָּבִ֡אוּ אֶל־מֹשֶׁה֩ וְאֶל־אֶלְעָזָ֨ר הַכֹּהֵ֜ן וְאֶל־עֲדַ֣ת בְּנֵֽי־יִשְׂרָאֵ֗ל אֶת־הַשְּׁבִ֧י וְאֶת־הַמַּלְק֛וֹחַ וְאֶת־הַשָּׁלָ֖ל אֶל־הַֽמַּחֲנֶ֑ה אֶל־עַֽרְבֹ֣ת מוֹאָ֔ב אֲשֶׁ֖ר עַל־יַרְדֵּ֥ן יְרֵחֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַיְתִיּוּ לְוָת משֶׁה וּלְוָת אֶלְעָזָר כַּהֲנָא וּלְוָת כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל יָת שִׁבְיָא וְיָת דְּבַרְתָּא וְיָת עֲדָאָה לְמַשְׁרִיתָא לְמֵישְׁרַיָּא דְמוֹאָב דִּי עַל יַרְדְּנָא דִירֵחוֹ:", "onk_en": "And they brought to Moshe and to Elozor the <i>kohein<\/i> and to the entire community of Bnei Yisroel, the captives, and all that had been seized, and the booty, to the camp, at the plains of Moav, which was by the Yardein near Yereicho.", "pj": "וְאַיְתִיאוּ לְוַת משֶׁה וּלְוַת אֶלְעָזָר כַּהֲנָא וּלְוַת כָּל כְּנִשְׁתָּא דִבְנֵי יִשְרָאֵל יַת שִׁבְיָיתָא וְיַת דְבַרְתָּא וְיַת עָדִיתָא לְמַשְׁרִיתָא לְמֵישְׁרַיָא דְמוֹאָב עַל יַרְדְנָא דִירֵיחוֹ", "pj_en": "and brought to Mosheh, Elazar the priest, and all the congregation of Israel, the captives, the prey, and the spoils, at the camp in the fields of Moab, by the Jordan, near Jericho.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 13, "aliyah": 2, "heb": "וַיֵּ֨צְא֜וּ מֹשֶׁ֨ה וְאֶלְעָזָ֧ר הַכֹּהֵ֛ן וְכׇל־נְשִׂיאֵ֥י הָעֵדָ֖ה לִקְרָאתָ֑ם אֶל־מִח֖וּץ לַֽמַּחֲנֶֽה׃", "onk": "וּנְפָקוּ משֶׁה וְאֶלְעָזָר כַּהֲנָא וְכָל רַבְרְבֵי כְנִשְׁתָּא לָקֳדָמוּתְהוֹן לְמִבָּרָא לְמַשְׁרִיתָא:", "onk_en": "They went out—Moshe, Elozor the <i>kohein<\/i> and the princes of the community—to greet them outside the camp.", "pj": "וּנְפָקוּ משֶׁה וְאֶלְעָזָר כַּהֲנָא וְכָל אֲמַרְכְּלֵי כְּנִשְׁתָּא לִקְדָמוּתְהוֹן לְמִבָּרָא לְמַשְׁרִיתָא", "pj_en": "And Mosheh and Elazar the priest, with all the heads of the congregation, went forth to meet them without the camp.", "tj": "", "tj_en": "", "rashi": "<b>ויצאו משה ואלעזר הכהן.<\/b> לְפִי שֶׁרָאוּ אֶת נַעֲרֵי יִשְׂרָאֵל יוֹצְאִים לַחֲטֹף מִן הַבִּזָּה (ספרי):", "rashi_en": "ויצאו משה ואלעזר הכהן AND MOSES AND ELEAZAR THE PRIEST WENT FORTH, because they saw the young men of Israel going out to snatch the spoil (Sifrei Bamidbar 157:5)."}, {"ch": 31, "v": 14, "aliyah": 2, "heb": "וַיִּקְצֹ֣ף מֹשֶׁ֔ה עַ֖ל פְּקוּדֵ֣י הֶחָ֑יִל שָׂרֵ֤י הָאֲלָפִים֙ וְשָׂרֵ֣י הַמֵּא֔וֹת הַבָּאִ֖ים מִצְּבָ֥א הַמִּלְחָמָֽה׃", "onk": "וּרְגֵיז משֶׁה עַל דִּמְמַנָּן עַל חֵילָא רַבָּנֵי אַלְפִין וְרַבָּנֵי מָאֲוָתָא דַּאֲתוֹ מֵחֵיל קְרָבָא:", "onk_en": "Moshe was angry with the commanders of the army, at the officers of the thousands and at the officers of the hundreds who had returned from the army service of the war.", "pj": "וּכְנַס משֶׁה עַל אִסְטְרְטִיגִין דִמְמַנָן עַל חֵילָא רַבָּנֵי אַלְפִין וְרַבָּנֵי מַאֲוָותָא דְאָתוּ מֵחֵיל סִדְרֵי קְרָבָא", "pj_en": "But Mosheh was angry with the leaders appointed over the host, the chiefs of thousands and of hundreds who came from the war with the host;", "tj": "", "tj_en": "", "rashi": "<b>ויקצף משה על פקודי החיל.<\/b> מְמֻנִּים עַל הַחַיִל, לְלַמֶּדְךָ שֶׁכָּל סִרְחוֹן הַדּוֹר תָּלוּי בַּגְּדוֹלִים שֶׁיֵּשׁ כֹּחַ בְּיָדָם לִמְחוֹת (שם):", "rashi_en": "ויקצף משה על פקודי החיל AND MOSES WAS ANGRY WITH THE  פקודי החיל — WITH THOSE APPOINTED OVER THE ARMY — This serves to teach you that every misdeed of a generation is attributed to the leaders since these have the power to protest (Sifrei Bamidbar 157:5)."}, {"ch": 31, "v": 15, "aliyah": 2, "heb": "וַיֹּ֥אמֶר אֲלֵיהֶ֖ם מֹשֶׁ֑ה הַֽחִיִּיתֶ֖ם כׇּל־נְקֵבָֽה׃", "onk": "וַאֲמַר לְהוֹן משֶׁה הֲקַיֵּמְתּוּן כָּל נוּקְבָּא:", "onk_en": "Moshe said to them: “Did you let every female live?", "pj": "וַאֲמַר לְהוֹן משֶׁה הַקְיֵימְתּוּן כָּל נוּקְבָא", "pj_en": "and Mosheh said to them, Why have you spared all the women?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 16, "aliyah": 2, "heb": "הֵ֣ן הֵ֜נָּה הָי֨וּ לִבְנֵ֤י יִשְׂרָאֵל֙ בִּדְבַ֣ר בִּלְעָ֔ם לִמְסׇר־מַ֥עַל בַּיהֹוָ֖ה עַל־דְּבַר־פְּע֑וֹר וַתְּהִ֥י הַמַּגֵּפָ֖ה בַּעֲדַ֥ת יְהֹוָֽה׃", "onk": "הָא אִנּוּן הֲוָאָה לִבְנֵי יִשְׂרָאֵל בַּעֲצַת בִּלְעָם <b>לְשַׁקָּרָא שְׁקָר קֳדָם<\/b> יְיָ עַל עֵסַק פְּעוֹר וַהֲוַת מוֹתָנָא בִּכְנִשְׁתָּא דַיְיָ:", "onk_en": "They were the very same ones who, on Bila’m’s advice were involved with Bnei Yisroel to cause them to commit a betrayal [<b>deception<\/b>] against [<b>before<\/b>] Adonoy regarding the matter of Pe’or, so that the plague broke out within the community of Adonoy.", "pj": "הִינוּן הִינוּן דְהַוָאָה תּוּקְלָא לִבְנֵי יִשְרָאֵל בְּעֵיצָתָא דְבִלְעָם לִמְשַׁקְרָא שְׁקַר קֳדָם יְיָ עַל עֵיסַק פְּעוֹר וַהֲוָה מוֹתָנָא בִּכְנִשְׁתָּא דַיְיָ", "pj_en": "These are they who caused the offence of the sons of Israel, by the counsel of Bileam, to do wrongly before the Lord in the matter of Peor, so that pestilence came upon the congregation of the Lord.", "tj": "", "tj_en": "", "rashi": "<b>הן הנה.<\/b> מַגִּיד שֶׁהָיוּ מַכִּירִים אוֹתָן — זוֹ הִיא שֶׁנִּכְשַׁל פְּלוֹנִי בָהּ (ילקוט שמעוני תשפ\"ה):<br><br><b>בדבר בלעם.<\/b> אָמַר לָהֶם אֲפִלּוּ אַתֶּם מַכְנִיסִין כָּל הֲמוֹנוֹת שֶׁבָּעוֹלָם אֵין אַתֶּם יְכוֹלִים לָהֶם, שֶׁמָּא מְרֻבִּים אַתֶּם מִן הַמִּצְרִיִּים שֶׁהָיוּ שֵׁשׁ מֵאוֹת רֶכֶב בָּחוּר? בֹּאוּ וְאַשִּׂיאֲכֶם עֵצָה, אֱלֹהֵיהֶם שֶׁל אֵלּוּ שׂוֹנֵא זִמָּה הוּא וְכוּ' כִּדְאִיתָא בְחֵלֶק (דף ק\"ו) וּבְסִפְרֵי:", "rashi_en": "הן הנה BEHOLD, THESE [WERE AN ENTICEMENT TO THE CHILDREN OF ISRAEL] — <b>These<\/b>: this word tells us that they recognised them, saying, ‘This is the woman through whom so-and-so fell into sin” (Yalkut Shimoni on Torah 785).<br><br>בדבר בלעם [THESE WERE AN ENTICEMENT] THROUGH THE WORD OF BALAAM — He had said to them: Even if you bring together all the hosts that are in the world you cannot overcome them. Are you perhaps more numerous than the Egyptians who had six hundred chosen chariots? Come and I will give you counsel: Their God has a hatred of immorality, etc., as it is related in the chapter חלק (Sanhedrin 106a) and in Sifrei Bamidbar 157:6."}, {"ch": 31, "v": 17, "aliyah": 2, "heb": "וְעַתָּ֕ה הִרְג֥וּ כׇל־זָכָ֖ר בַּטָּ֑ף וְכׇל־אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְמִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ׃", "onk": "וּכְעַן קְטוּלוּ כָל דְּכוּרָא בְּטַפְלָא וְכָל אִתְּתָא דִּידַעַת גְּבַר לְמִשְׁכְּבֵי דְכוּרָא קְטוּלוּ:", "onk_en": "Now execute every male among the children, and every woman with intimate knowledge of a man, you shall execute.", "pj": "וּכְדוּן קְטוּלוּ כָּל דְכוּרָא בְּטַפְלַיָא וְכָל אִתְּתָא דְיָדְעַת גְבַר לְמִשְׁכְּבֵי דְכוּרָא קְטוּלוּ", "pj_en": "Now, therefore, slay every male among the children, and every woman who hath known a man;", "tj": "", "tj_en": "", "rashi": "<b>וכל אשה ידעת אישׁ.<\/b> רְאוּיָה לִבָּעֵל, אַעַ\"פִּ שֶׁלֹּא נִבְעֲלָה, וְלִפְנֵי הַצִּיץ הֶעֱבִירוּם, וְהָרְאוּיָה לִבָּעֵל פָּנֶיהָ מוֹרִיקוֹת (יבמות ס'):<br><br><b>הרגו.<\/b> לָמָּה חָזַר וְאָמַר? לְהַפְסִיק הָעִנְיָן, דִּבְרֵי רַבִּי יִשְׁמָעֵאל, שֶׁאִם אֲנִי קוֹרֵא הִרְגוּ כָל זָכָר בַּטָּף וְכָל אִשָּׁה יֹדַעַת אִישׁ וְכֹל הַטַּף בַּנָּשִׁים וְגוֹ', אֵינִי יוֹדֵעַ אִם לַהֲרֹג עִם הַזְּכָרִים אוֹ לְהַחֲיוֹת עִם הַטַּף, לְכָךְ נֶאֱמַר הֲרֹגוּ:", "rashi_en": "וכל אשה ידעת איש AND EVERY WOMAN WHO KNOWS MAN — i.e., who is fitted for cohabitation, even though she has never experienced it (Sifrei Bamidbar 157:6). As a test they made them (the women) pass in front of the Golden Plate, and if anyone was fitted for cohabitation her face turned green (Yevamot 60b).<br><br>הרגו [AND EVERY WOMAN THAT MAY KNOW MAN] … KILL — Why does it say this word again after having used it in the first half of the sentence? It is to show where the pause comes in the paragraph. So is the opinion of R. Ishmael (Sifrei Bamidbar 157:6). For if I read (omitting the word הֲרֹגוּ‎),‎ הרגו כל זכר בטף וכל אשה ידעת איש‎ ... וכל הטף בנשים וגו׳ ‎ “Now therefore kill every male among the little ones … and every woman … and all the little ones among the women … keep alive”, I would not know whether they were to kill “every woman” together with the “males among the little ones” or were to keep them alive together with the “little ones among the women’. On this account הרגו is stated (added) at the end of the verse."}, {"ch": 31, "v": 18, "aliyah": 2, "heb": "וְכֹל֙ הַטַּ֣ף בַּנָּשִׁ֔ים אֲשֶׁ֥ר לֹא־יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָכֶֽם׃", "onk": "וְכֹל טַפְלָא בִנְשַׁיָּא דִּי לָא יְדָעָא מִשְׁכְּבֵי דְכוּרָא קַיְּימוּ לְכוֹן:", "onk_en": "All the children among the females without intimate knowledge of a man, keep alive for yourselves.", "pj": "וְכָל טַפְלָא בִּנְשַׁיָא אוֹקִימוּ כֻּלוֹ קֳבֵיל צִיצָא כְּלִילָא דְקוּדְשָׁא וְיִסְתַּכְּלוּן בֵּיהּ וּמַאן דְהִיא מִבְעֲלָא לִגְבַר יִתְעַבְדוּן אַפָּהָא מוֹרִיקָן וּמַאן דְלָא יְדַע מִשְׁכְּבֵי דְכוּרָא יְהוֹן סַמְקִין אַפָּהָא הֵיךְ נוּרָא וּתְקַיְימוּנוּן לְכוֹן", "pj_en": "but every female child you shall stand before the Crown of Holiness, (the priest's tiara,) and look upon her: she who is not a virgin will be pallid in the face, but she who is a virgin child will blush in the face, like fire; them you shall spare.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 19, "aliyah": 2, "heb": "וְאַתֶּ֗ם חֲנ֛וּ מִח֥וּץ לַֽמַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְכֹ֣ל&thinsp;<b>׀<\/b> נֹגֵ֣עַ בֶּֽחָלָ֗ל תִּֽתְחַטְּא֞וּ בַּיּ֤וֹם הַשְּׁלִישִׁי֙ וּבַיּ֣וֹם הַשְּׁבִיעִ֔י אַתֶּ֖ם וּשְׁבִיכֶֽם׃", "onk": "וְאַתּוּן שְׁרוֹ מִבָּרָא לְמַשְׁרִיתָא שַׁבְעָא יוֹמִין כֹּל דִּי קְטַל נַפְשָׁא וְכֹל דִּי קְרַב בְּקָטִילָא <b>תַּדּוּן עֲלוֹהִי<\/b> בְּיוֹמָא תְלִיתָאָה וּבְיוֹמָא שְׁבִיעָאָה אַתּוּן וּשְׁבִיכוֹן:", "onk_en": "You shall remain outside the camp for seven days. Whoever has killed a person or touched a corpse, purify yourselves, [<b>sprinkle on him<\/b>] on the third day and on the seventh day, you and your captives.", "pj": "וְאַתּוּן שְׁרוּ לְמִבָּרָא לְמַשְׁרִיתָא שׁוּבְעָא יוֹמִין כָּל דְקָטִיל בַּר נַשׁ וְכָל דְיִקְרַב בִּקְטִילָא תַּדוּן עֲלוֹי בְּיוֹמָא תְלִיתָאָה וּבְיוֹמָא שְׁבִיעָאָה אַתּוּן וּשְׁבִיכוֹן", "pj_en": "But as for you, abide without the camp seven days; whoever hath slain a man, or touched the dead, you shall sprinkle on the third; and on the seventh day both you and your captives,", "tj": "", "tj_en": "", "rashi": "<b>מחוץ למחנה.<\/b> שֶׁלֹּא יִכָּנְסוּ לָעֲזָרָה:<br><br><b>כל הרג נפש.<\/b> רַ' מֵאִיר אוֹמֵר בְּהוֹרֵג בְּדָבָר הַמְקַבֵּל טֻמְאָה הַכָּתוּב מְדַבֵּר, וְלִמֶּדְךָ הַכָּתוּב שֶׁהַכְּלִי מְטַמֵּא אָדָם בְּחִבּוּרֵי הַמֵּת כְּאִלּוּ נוֹגֵעַ בַּמֵּת עַצְמוֹ, אוֹ יָכוֹל אֲפִלּוּ זָרַק בּוֹ חֵץ וַהֲרָגוֹ? תַּלְמוּד לוֹמַר <b>וכל נגע בחלל<\/b>, הִקִּישׁ הוֹרֵג לְנוֹגֵעַ, מַה נּוֹגֵעַ עַל יְדֵי חִבּוּרוֹ, אַף הוֹרֵג עַ\"יְ חִבּוּרוֹ (ספרי במדבר י\"ט):<br><br><b>תתחטאו.<\/b> בְּמֵי נִדָּה כְּדִין שְׁאָר טְמֵאֵי מֵתִים, שֶׁאַף לְדִבְרֵי הָאוֹמְרִים קִבְרֵי גוֹיִם אֵינָם מְטַמְּאִין בָּאֹהֶל, שֶׁנֶּאֱמַר (יחזקאל ל\"ד) \"וְאַתֵּן צֹאנִי צֹאן מַרְעִיתִי אָדָם אַתֶּם\" — אַתֶּם קְרוּיִם אָדָם — מוֹדֶה הוּא שֶׁהַגּוֹיִם מְטַמְּאִים בְּמַגַּע וּבְמַשָּׂא, שֶׁלֹּא נֶאֱמַר אָדָם אֶלָּא אֵצֶל טֻמְאַת אָהֳלוֹת, שֶׁנֶּאֱמַר \"אָדָם כִּי יָמוּת בְּאֹהֶל\" (במדבר י\"ט):<br><br><b>אתם ושביכם.<\/b> לֹא שֶׁהַגּוֹיִם מְקַבְּלִין טֻמְאָה וּצְרִיכִין הַזָּאָה, אֶלָּא מָה אַתֶּם בְּנֵי בְרִית, אַף שְׁבִיכֶם כְּשֶׁיָּבֹאוּ לַבְּרִית וְיִטָּמְאוּ, צְרִיכִין הַזָּאָה (ספרי):", "rashi_en": "מחוץ למחנה [AND ABIDE YE] OUTSIDE THE CAMP — This means that they should not enter the forecourt of the Sanctuary (the מחנה שכינה cf. Rashi on 5:2).<br><br>כל הרג נפש WHOSOEVER HATH KILLED A PERSON — Rabbi Meir said: Scripture is speaking of one who killed a person with a weapon receptive of uncleanness, and Scripture teaches you that “a vessel“ (any object) makes a man unclean through the connection thus formed with the corpse just as though he were actually in contact with the corpse itself. Or perhaps one might think that even though he had shot an arrow and killed him (in which case he was not “connected” by means of the arrow with the man he killed) he was to remain outside the camp as being unclean. It, however, says immediately afterwards “and whosoever hath touched anyone slain”; it compares the person who kills to one who touches a slain person. How is it in the case of one who touches a corpse? He becomes unclean in consequence of the connection with it! So, too, one who kills becomes unclean only through some connection with it (the corpse) (Sifrei Bamidbar 127:1 on Numbers 19:16).<br><br>תתחטאו PURIFY YOURSELVES by means of the waters of sprinkling, as is the law in the case of other people who have become unclean by reason of a corpse. For even according to the opinion of those who say that the graves of heathens do not render Israelites unclean if they are under the same tent (roof) with them (i.e. the graves), because it is said, (Ezekiel 34:31) “And ye, My sheep, the sheep of My pasture, are men”, which is explained to mean: You alone come under the term “men” (Yevamot 61a) — even such will admit that the corpses of heathens render an Israelite unclean through contact with and through carrying them, because the term אדם, man, is only used in reference to uncleanness caused by a “tent”, since it states, (Numbers 19:14) “If a man (אדם) die in a tent\".<br><br>אתם ושביכם [PURIFY] BOTH YOURSELVES AND YOUR CAPTIVES — Not that heathens are receptive of uncleanness and therefore require sprinkling, but such captives are intended as are of the same category as yourselves. What is the case with you yourselves? You are people in covenant with God! So, too, your captives when they come into the covenant with God, if they become unclean they require sprinkling (Sifrei Bamidbar 157:7)."}, {"ch": 31, "v": 20, "aliyah": 2, "heb": "וְכׇל־בֶּ֧גֶד וְכׇל־כְּלִי־ע֛וֹר וְכׇל־מַעֲשֵׂ֥ה עִזִּ֖ים וְכׇל־כְּלִי־עֵ֑ץ תִּתְחַטָּֽאוּ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְכָל לְבוּשׁ וְכָל מַאן דִּמְשַׁךְ וְכָל עוֹבַד מְעַזֵּי וְכָל מַאן דְּעָא <b>תַּדּוּן עֲלוֹהִי<\/b>:", "onk_en": "Every garment, every leather article, everything made of goat products and every wooden article shall undergo such purification [<b>sprinkle on it<\/b>].”", "pj": "וְכָל לְבוּשׁ וְכָל מָנָא דִצְלָא וְכָל עוֹבַד מֵעַזֵי קַרְנָא וְגַרְמָא וְכָל מַאן דְקִיסָא תַּדוּן עֲלוֹי", "pj_en": "and every garment, and whatever is made of skin, goats' hair, horn, or bone, and every vessel of wood, you shall sprinkle.", "tj": "", "tj_en": "", "rashi": "<b>וכל מעשה עזים.<\/b> לְהָבִיא כְלֵי הַקַּרְנַיִם וְהַטְּלָפַיִם וְהָעֲצָמוֹת (חולין כ\"ה):", "rashi_en": "וכל מעשה עזים AND EVERYTHING MADE FROM GOATS — everything: this serves to include objects made from the horns, claws and bones (Chullin 25b)."}, {"ch": 31, "v": 21, "aliyah": 2, "heb": "וַיֹּ֨אמֶר אֶלְעָזָ֤ר הַכֹּהֵן֙ אֶל־אַנְשֵׁ֣י הַצָּבָ֔א הַבָּאִ֖ים לַמִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַתּוֹרָ֔ה אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃", "onk": "וַאֲמַר אֶלְעָזָר כַּהֲנָא לְגַבְרֵי חֵילָא דַּאֲתוֹ לִקְרָבָא דָּא גְּזֵרַת אוֹרַיְתָא דִּי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "Elozor the <i>kohein<\/i> said to the soldiers who came to the war: “This is the statute of the Torah which Adonoy commanded Moshe.", "pj": "וַאֲמַר אֶלְעָזָר כַּהֲנָא לְגוּבְרֵי חֵילָא דְאָתוּ מִן סִדְרֵי קְרָבָא דָא אַחֲוָויַת גְזֵירַת אוֹרַיְיתָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And Elazar the priest said to the men of the host who had returned from the war: This is the manifestation of the decree of the law which the Lord hath commanded to Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויאמר אלעזר הכהן וגו'.<\/b> לְפִי שֶׁבָּא מֹשֶׁה לִכְלַל כַּעַס בָּא לִכְלַל טָעוּת, שֶׁנִּתְעַלְּמוּ מִמֶּנּוּ הִלְכוֹת גִּעוּלֵי גּוֹיִם, וְכֵן אַתָּה מוֹצֵא בַשְּׁמִינִי לַמִּלּוּאִים, שֶׁנֶּאֱמַר \"וַיִּקְצֹף עַל אֶלְעָזָר וְעַל אִיתָמָר\" (ויקרא י') — בָּא לִכְלַל כַּעַס בָּא לִכְלַל טָעוּת, וְכֵן בְּשִׁמְעוּ נָא הַמֹּרִים (במדבר כ') \"וַיַּךְ אֶת הַסֶּלַע\" — עַל יְדֵי הַכַּעַס טָעָה (ספרי; פסחים ס\"ו):<br><br><b>אשר צוה ה' וגו'.<\/b> תָּלָה הַהוֹרָאָה בְּרַבּוֹ (עי' ספרי):", "rashi_en": "ויאמר אלעזר הכהן וגו׳ AND ELEAZAR THE PRIEST SAID etc. — Because Moses fell into anger (Numbers 31:14) he fell into error: there escaped him the laws concerning the removal of uncleanness absorbed by vessels which have contained the food of heathens. This, too, do you find was the case on the eighth day of the installing of the priests, as it is said, (Leviticus 10:16) “And Moses was angry with Eleazar and Ithamar”, — he fell into anger, he fell into error (cf. 10:16 that he made an error regarding the שעיר החטאת which Aaron refused to eat). Similarly, also, when he said, (Numbers 20:10, Numbers 20:11) “Hear, now, ye rebels”, … “he smote the rock”; it was through his anger that he made the mistake (Sifrei Bamidbar 157:9; cf. Pesachim 66b).<br><br>אשר צוה ה׳ וגו׳ [AND ELEAZAR SAID … THIS IS THE ORDINANCE OF THE LAW] WHICH THE LORD HATH COMMANDED [MOSES] — he associated the decision with his teacher (cf. Sifrei Bamidbar 157:9)."}, {"ch": 31, "v": 22, "aliyah": 2, "heb": "אַ֥ךְ אֶת־הַזָּהָ֖ב וְאֶת־הַכָּ֑סֶף אֶֽת־הַנְּחֹ֙שֶׁת֙ אֶת־הַבַּרְזֶ֔ל אֶֽת־הַבְּדִ֖יל וְאֶת־הָעֹפָֽרֶת׃", "onk": "בְּרַם יָת דַּהֲבָא וְיָת כַּסְפָּא יָת נְחָשָׁא יָת פַּרְזְלָא יָת אֲבָצָא וְיָת אֲבָרָא:", "onk_en": "Only the gold, silver, copper, iron, tin and lead,", "pj": "בְּרַם לְחוֹדְהוֹן בְּלָא חַלְדוּתְהוֹן יַת דַהֲבָא וְיַת כַּסְפָּא וְיַת נְחָשָׁא וְיַת פַּרְזְלָא וְיַת קַסְטִירָא וְיַת כַּרְכִּימִישָׁא מָנֵיהוֹן לָא גוּלְמַיָא וְלָא פְּשׁוּטַיָא", "pj_en": "Nevertheless, these (articles) without their rust, the gold, silver, brass, iron, tin, and lead, their vessels, but not the unformed and simple (metals),", "tj": "יַת קִיסְטָרָא וְיַת אִיבָרָא:", "tj_en": "Tin and lead,", "rashi": "<b>אך את הזהב וגו'.<\/b> אַעַ\"פִּ שֶׁלֹּא הִזְהִיר לָכֶם מֹשֶׁה אֶלָּא עַל הִלְכוֹת טֻמְאָה, עוֹד יֵשׁ לְהַזְהִיר לָכֶם עַל הִלְכוֹת גִּעוּל, וְ\"אַךְ\" לְשׁוֹן מִעוּט, כְּלוֹמַר מְמֻעָטִין אַתֶּם מִלְּהִשְׁתַּמֵּשׁ בַּכֵּלִים אֲפִלּוּ לְאַחַר טָהֲרָתָן מִטֻּמְאַת הַמֵּת עַד שֶׁיִּטְהֲרוּ מִבְּלִיעַת אִסּוּר נְבֵלוֹת; וְרַבּוֹתֵינוּ אָמְרוּ, <b>אך את הזהב<\/b> לוֹמַר, שֶׁצָּרִיךְ לְהַעֲבִיר חֲלוּדָה שֶׁלּוֹ קֹדֶם שֶׁיַּגְעִילֶנּוּ, וְזֶהוּ לְשׁוֹן <b>אך<\/b>, שֶׁלֹּא יְהֵא שָׁם חֲלוּדָה אַךְ הַמַּתֶּכֶת יִהְיֶה כְּמוֹ שֶׁהוּא:", "rashi_en": "אך את הזהב וגו׳ ONLY THE GOLD etc. — Eleazar said: Although Moses has only admonished you concerning the laws of uncleanness caused by contact with a corpse, you must further be admonished concerning the laws of removing anything unclean that has been absorbed by vessels. The word אך is a restrictive term — it is as much as to say, “You are restricted from using vessels even after they have been cleansed from uncleanness caused by reason of a corpse until they shall have been cleansed also from what they have absorbed of that flesh which is forbidden as being that of an animal not killed in the proper manner.” And our Rabbis said that the words אך את הזהב are intended to intimate that it is necessary to remove its rust before he does the rite of removing the forbidden food that has been absorbed. This, they say, is the purpose of the term אך, — that there should be no rust there: Only (אך) the metal — it shall be as it should be (the metal without anything else, such as rust) (Yalkut Shimoni on Torah 785; Rabbenu Asher on Pesachim 30b states that this is to be found in Siphre, but it is missing in our editions of the work)."}, {"ch": 31, "v": 23, "aliyah": 2, "heb": "כׇּל־דָּבָ֞ר אֲשֶׁר־יָבֹ֣א בָאֵ֗שׁ תַּעֲבִ֤ירוּ בָאֵשׁ֙ וְטָהֵ֔ר אַ֕ךְ בְּמֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְכֹ֨ל אֲשֶׁ֧ר לֹֽא־יָבֹ֛א בָּאֵ֖שׁ תַּעֲבִ֥ירוּ בַמָּֽיִם׃", "onk": "כָּל מִדַּעַם דְּמִתַּעַל בְּנוּרָא תַּעַבְרוּנֵּיהּ בְּנוּרָא וְיִדְכֵּי בְּרַם בְּמֵי אַדָּיוּתָא <b>יִתַּדֵּי<\/b> וְכֹל דִּי לָא מִתַּעַל בְּנוּרָא תַּעַבְרֻנֵּיהּ בְּמַיָּא:", "onk_en": "Anything placed [of these materials] on a fire, you must pass through fire, and it will be purified; however, it must be purified [<b>sprinkled upon<\/b>] with sprinkling water. But anything [of these materials] that was not placed on a fire you may pass through water.", "pj": "כָּל מִדַעַם דְאוֹרְחֵיהּ לְמִתַּעֲלָא בְּנוּרָא לְבִיסַיָא קְדֵירָתָא שִׁפּוּדַיָא וְאַסְכְּלָתָא תַּעַבְרוּן בְּנוּרָא וְיִדְכֵּי בָּתַר כֵּן בְּמַיָא דְכַשְׁרִין לְאַדְכָּאָה בְּהוֹן דְוָותָא יִתְדֵי וְכָל דְלָא מִיתָעַל בְּנוּרָא כְּהַנְכָתָא כַּסַיָא קַתּוּנְיָא קוּמְקוּמוּסַיָא תַּעַבְרוּן בְּאַרְבְּעִין סָוִוין דְמוֹי", "pj_en": "every thing whose nature it is to abide the fire, of the pans, pots, spits, and gridirons, you shall make to pass through fire to purify them, and afterward (sprinkle them) with water such as is used to purify the unclean; but whatever will not abide the fire coverlids, cups flagons, and utensils, you shall make to pass through forty sata of water;", "tj": "", "tj_en": "", "rashi": "<b>כל דבר אשר יבא באש.<\/b> לְבַשֵּׁל בּוֹ כְּלוּם:<br><br><b>תעבירו באש.<\/b> כְּדֶרֶךְ תַּשְׁמִישׁוֹ הַגְעָלָתוֹ — מִי שֶׁתַּשְׁמִישׁוֹ עַל יְדֵי חַמִּין יַגְעִילֶנּוּ בְחַמִּין, וּמִי שֶׁתַּשְׁמִישׁוֹ עַ\"יְ צְלִי, כְּגוֹן הַשְּׁפוּד וְהָאַסְכְּלָה, יְלַבְּנוֹ בָּאוּר (עבודה זרה ע\"ד):<br><br><b>אך במי נדה יתחטא.<\/b> לְפִי פְשׁוּטוֹ חִטּוּי זֶה לְטַהֲרוֹ מִטֻּמְאַת מֵת, אָמַר לָהֶם צְרִיכִין הַכֵּלִים גִּעוּל לְטַהֲרָם מִן הָאִסּוּר וְחִטּוּי לְטַהֲרָן מִן הַטֻּמְאָה; וְרַבּוֹתֵינוּ דָרְשׁוּ מִכָּאן שֶׁאַף לְהַכְשִׁירָן מִן הָאִסּוּר הִטְעִין טְבִילָה לִכְלֵי מַתָּכוֹת, וּמֵי נִדָּה הַכְּתוּבִין כָּאן דָּרְשׁוּ מַיִם הָרְאוּיִם לִטְבֹּל בָּהֶם נִדָּה, וְכַמָּה הֵם? אַרְבָּעִים סְאָה (שם ע\"ה):<br><br><b>וכל אשר לא יבא באש.<\/b> כָּל דָּבָר שֶׁאֵין תַּשְׁמִישׁוֹ עַל יְדֵי הָאוּר, כְּגוֹן כּוֹסוֹת וּצְלוֹחִיּוֹת שֶׁתַּשְׁמִישָׁן בְּצוֹנֵן וְלֹא בָלְעוּ אִסּוּר:<br><br><b>תעבירו במים.<\/b> מַטְבִּילָן וְדַיּוֹ, וְדַוְקָא כְלֵי מַתָּכוֹת:", "rashi_en": "כל דבר אשר יבא באש ANYTHING THAT COMES ON THE FIRE, to boil something in it,<br><br>תעבירו באש YE SHALL PASS THROUGH THE FIRE — according to the manner in which it is used so is the manner in which it is cleansed from what has been absorbed: that vessel the use of which is by means of hot water he shall cleanse with hot water, and that which is used for roasted meat, as for instance, a spit and a grill, he shall make it white hot in the flame (Avodah Zarah 75b).<br><br>אך מי נדה יתחטא NEVERTHELESS IT SHALL BE PURIFIED WITH THE WATERS OF SPRINKLING — According to its plain sense this purification is to cleanse it from the uncleanness caused by a corpse. He said to them: the vessels require גיעול (the ceremony by which whatever has been absorbed will be given up) to cleanse them from the effect of having contained forbidden food, and also purification to cleanse them from the uncleanness caused by a corpse. But our Rabbis derived from here the law that in order to make them fit for use (to cleanse them entirely) from being forbidden, it (Scripture) made immersion in a ritual bath a requirement for metal vessels, and they explained the words מי נדה which are written here as denoting “waters that are proper for a נדה to immerse herself in”. And how much is that? Forty Seahs (Avodah Zarah 75b).<br><br>וכל אשר לא יבא באש AND ALL THAT DOTH NOT COME IN THE FIRE — i.e., everything which is not used on fire, as for instance, cups and flasks which are used with cold articles, and which, therefore, absorb no forbidden food,<br><br>תעבירו במים YE SHALL PASS THROUGH WATER —  He immerses them and that is sufficient. This refers only to metal utensils (Avodah Zarah 75b)."}, {"ch": 31, "v": 24, "aliyah": 2, "heb": "וְכִבַּסְתֶּ֧ם בִּגְדֵיכֶ֛ם בַּיּ֥וֹם הַשְּׁבִיעִ֖י וּטְהַרְתֶּ֑ם וְאַחַ֖ר תָּבֹ֥אוּ אֶל־הַֽמַּחֲנֶֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּתְחַוְּרוּן לְבוּשֵׁיכוֹן בְּיוֹמָא שְׁבִיעָאָה וְתִדְכּוּן וּבָתַר כֵּן תֵּעֲלוּן לְמַשְׁרִיתָא:", "onk_en": "You shall immerse your garments on the seventh day and become purified; afterward you may come into the camp.”", "pj": "וּתְחַוְורוּן לְבוּשֵׁיכוֹן בְּיוֹמָא שְׁבִיעָאָה וְתִדְכּוּן וּמִן בָּתַר כֵּן תֵּיעָלוּן לְמַשְׁרִיתָא", "pj_en": "and you shall wash your raiment on the seventh day to be clean, and afterwards come into the camp.", "tj": "", "tj_en": "", "rashi": "<b>אל המחנה.<\/b> לְמַחֲנֵה שְׁכִינָה, שֶׁאֵין טְמֵא מֵת טָעוּן שִׁלּוּחַ מִמַּחֲנֵה לְוִיָּה וּמִמַּחֲנֵה יִשְׂרָאֵל:", "rashi_en": "אל המחנה [YE SHALL BE CLEAN, AND AFTERWARDS] YE MAY COME INTO THE CAMP — into the camp where is the Divine Presence (מחנה שכינה), because a person unclean by reason of a corpse does not require expulsion from the camp of the Levites and the camp of the Israelites, (but only from the camp of the Shechina, and consequently the permission to come into the camp after purification must mean into the מחנה שכינה; Pesachim 67a; cf. Rashi on 5:2)."}, {"ch": 31, "v": 25, "aliyah": 2, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וַאֲמַר יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 31, "v": 26, "aliyah": 2, "heb": "שָׂ֗א אֵ֣ת רֹ֤אשׁ מַלְק֙וֹחַ֙ הַשְּׁבִ֔י בָּאָדָ֖ם וּבַבְּהֵמָ֑ה אַתָּה֙ וְאֶלְעָזָ֣ר הַכֹּהֵ֔ן וְרָאשֵׁ֖י אֲב֥וֹת הָעֵדָֽה׃", "onk": "קַבֵּל יָת חוּשְׁבַּן דַּבְרַת שַׁבְיָא בֶּאֱנָשָׁא וּבִבְעִירָא אַתְּ וְאֶלְעָזָר כַּהֲנָא וְרֵישֵׁי אֲבָהַת כְּנִשְׁתָּא:", "onk_en": "“Take count of the booty seized, of what was captured of the men and animals—you, together with Elozor the <i>kohein,<\/i> and the leaders of the community.", "pj": "סַב יַת שֵׁירוּי בִּיזַת שִׁבְיָיתָא בְּאֵינָשָׁא וּבִבְעִירָא וּתְקַבֵּיל חוּשְׁבָּנָא אַנְתְּ וְאֶלְעָזָר כַּהֲנָא וְרֵישֵׁי אַבְהַת כְּנִישְׁתָּא", "pj_en": "Take the sum of the prey of t
