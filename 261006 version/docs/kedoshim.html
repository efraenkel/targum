ve your daughters unto a husband in their proper ages, lest they go astray by fornication after the people of the land, and the land be filled with whoredom.", "tj": "", "tj_en": "", "rashi": "<b>אל תחלל את בתך להזנותה.<\/b> בְּמוֹסֵר בִּתּוֹ פְנוּיָה לְבִיאָה שֶׁלֹּא לְשֵׁם קִדּוּשִׁין (סנהדרין ע\"ו):<br><br><b>ולא תזנה הארץ.<\/b> אִם אַתָּה עוֹשֶׂה כֵּן, הָאָרֶץ מְזַנָּה אֶת פֵּרוֹתֶיהָ לַעֲשׂוֹתָן בְּמָקוֹם אַחֵר וְלֹא בְאַרְצְכֶם, וְכֵן הוּא אוֹמֵר (ירמיהו ג'), וַיִּמָּנְעוּ רְבִיבִים וְגוֹ' (תוספתא, קידושין א'):", "rashi_en": "אל תחלל את בתך להזנותה DO NOT PROSTITUTE THY DAUGHTER TO CAUSE HER TO BE A HARLOT — Scripture speaks of one who gives his unmarried daughter away for illegitimate concubinage (cf. Sifra, Kedoshim, Chapter 7 2; Sanhedrin 76a).<br><br>ולא תזנה הארץ LEST THE EARTH BECOME DISLOYAL TO YOU — If you do this the soil will become faithless to you in regard to the distribution of its fruits, producing them in other places and not in your land. Scripture uses this simile also in (Jeremiah 3:2—3) \"and thou hast polluted thy land with thy whoredom… Therefore the showers have been withholden etc.” (so that the land yielded no fruit) (Sifra, Kedoshim, Chapter 7 4; Tosefta Kiddushin 1)."}, {"ch": 19, "v": 30, "aliyah": 3, "heb": "אֶת־שַׁבְּתֹתַ֣י תִּשְׁמֹ֔רוּ וּמִקְדָּשִׁ֖י תִּירָ֑אוּ אֲנִ֖י יְהֹוָֽה׃", "onk": "יָת <b>יוֹמֵי<\/b> שַׁבַּיָּא דִילִי תִּטְרוּן <b>וּלְבֵית<\/b> מַקְדְּשִׁי תְּהוֹן דַּחֲלִין אֲנָא יְיָ:", "onk_en": "You shall keep [<b>the days of<\/b>] My Shabbosos and you shall fear [<b>the House of<\/b>] My Sanctuary, I am Adonoy.", "pj": "יַת יוֹמֵי שַׁבַּיָא דִילִי תִטְרוּן וּלְבֵית מוּקְדָשִׁי תְּהוֹן אָזְלִין בְּדַחַלְתָּא אֲנָא יְיָ", "pj_en": "The days of My Sabbaths You shall keep, and go unto My sanctuary with reverence: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ומקדשי תיראו.<\/b> לֹא יִכָּנֵס בְּמַקְלוֹ וּבְמִנְעָלוֹ וּבַאֲפֻנְדָּתוֹ וּבְאָבָק שֶׁעַל רַגְלָיו (ברכות נ\"ד); וְאַעַ\"פִּי שֶׁאֲנִי מַזְהִירְכֶם עַל הַמִּקְדָּשׁ, אֶת שַׁבְּתֹתַי תִּשְׁמֹרוּ — אֵין בִּנְיַן הַמִּקְדָּשׁ דּוֹחֶה שַׁבָּת (ספרא):", "rashi_en": "ומקדשי תיראו AND YE SHALL REVERE MY SANCTUARY — This implies that one should not enter it with his staff in hand or in his shoes, or with his money belt or with the dust on his feet (all signs of irreverence) (Sifra, Kedoshim, Chapter 7 9; Berakhot 54a; Yevamot 6b). But — says God — although I warn you with regard to the reverence due to the Sanctuary, yet — את שבתתי תשמרו YOU SHALL KEEP MY SABBATHS — not even the erection of the Sanctuary can set aside the Sabbath law (Sifra, Kedoshim, Chapter 7 7; Yevamot 6a; cf. Rashi on Exodus 35:2)."}, {"ch": 19, "v": 31, "aliyah": 3, "heb": "אַל־תִּפְנ֤וּ אֶל־הָאֹבֹת֙ וְאֶל־הַיִּדְּעֹנִ֔ים אַל־תְּבַקְשׁ֖וּ לְטׇמְאָ֣ה בָהֶ֑ם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "לָא תִתְפְּנוּן בָּתַר בִּדִּין וּדְכוּרוּ לָא תִתְבְּעוּן לְאִסְתָּאָבָא בְּהוֹן אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "You shall not turn to mediums nor seek out oracles; do not seek [them] out, so as to defile yourselves through them. I am Adonoy, your God.", "pj": "לָא תִסְטוּן בָּתַר שַׁאֲלֵי בִּידִין וּמַסִיק זְכוּרוּ וְתַבְעֵי גְרַם יָדוֹעַ וְלָא תִיתְבְּעוּן לְאִיסְתַּאֲבָא בְהוֹן אֲנָא יְיָ אֳלָהָכוֹן", "pj_en": "Go not astray after those who inquire of impostors, or bring up the dead, or interrogate the bone of Jeddua: neither be ye inquirers with them, to pollute yourselves thereby I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>אל תפנו.<\/b> אַזְהָרָה לְבַעַל אוֹב וְיִדְּעוֹנִי; בַּעַל אוֹב זֶה פִּיתוֹם הַמְדַבֵּר מִשֶּׁחְיוֹ, וְיִדְּעוֹנִי הַמַּכְנִיס עֶצֶם חַיָּה שֶׁשְּׁמָה יַדּוּעַ לְתוֹךְ פִּיו וְהָעֶצֶם מְדַבֵּר (סנהדרין ס\"ה):<br><br><b>אל תבקשו.<\/b> לִהְיוֹת עֲסוּקִים בָּם, שֶׁאִם תַּעַסְקוּ בָם, אַתֶּם מִטַּמְּאִין לְפָנַי וַאֲנִי מְתַעֵב אֶתְכֶם:<br><br><b>אני ה' אלהיכם.<\/b> דְּעוּ אֶת מִי אַתֶּם מַחֲלִיפִין בְּמִי (ספרא):", "rashi_en": "אל תפנו DO NOT TURN [TO THE אבת NOR TO THE ידענים] — This is a warning addressed to the necromancers and the charmers themselves (not to the people who consult these tricksters). The בעל אוב, the controller of the spirit אוב, as the necromancer is called (cf. I Samuel 28:7), is identical with the פיתום (in Greek: πύξωυ); he is one who speaks out of his arm-pit; ידעני is one who puts a bone of an animal the name of which is ידוע into his mouth and the bone speaks (Sanhedrin 65b).<br><br>אל תבקשו means DO NOT SEEK to busy yourselves with them, for if you busy yourselves with them, you will become defiled in My sight and I shall abhor you. <br><br>אני ה' אלהיכם I AM THE LORD YOUR GOD — Just think Whom you are changing (by these practices which lead to idolatry) for whom! (Sifra, Kedoshim, Chapter 7 11)"}, {"ch": 19, "v": 32, "aliyah": 3, "heb": "מִפְּנֵ֤י שֵׂיבָה֙ תָּק֔וּם וְהָדַרְתָּ֖ פְּנֵ֣י זָקֵ֑ן וְיָרֵ֥אתָ מֵּאֱלֹהֶ֖יךָ אֲנִ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "מִן קֳדָם <b>דְּסַבַּר בְּאוֹרַיְתָא<\/b> תְּקוּם וּתְהַדַּר אַפֵּי סָבָא וְתִדְחַל מֵאֱלָהָךְ אֲנָא יְיָ:", "onk_en": "In the presence of the elderly [<b>one who understands the Torah<\/b>] you shall rise and you shall respect an elder; you shall have fear of your God, I am Adonoy.", "pj": "מִן קֳדָם סָבִין דִסְבִירִין בְּאוֹרַיְתָא תְּקוּמוּן וּתְיַיקֵר אַפֵּי חַכִּימָא וְתִדְחַל מֵאֱלָהָךְ אֲנָא יְיָ", "pj_en": "You shall rise up before the aged who instruct in the law and honour the presence of the wise, and fear thy God: I am the Lord.", "tj": "", "tj_en": "", "rashi": "<b>מפני שיבה תקום.<\/b> יָכוֹל זָקֵן אַשְׁמַאי, תַּ\"ל זָקֵן, אֵין זָקֵן אֶלָּא שֶׁקָּנָה חָכְמָה (קידושין ל\"ב):<br><br><b>והדרת פני זקן.<\/b> אֵיזֶהוּ הִדּוּר? לֹא יֵשֵׁב בִּמְקוֹמוֹ וְלֹא יִסְתֹּר אֶת דְּבָרָיו: יָכוֹל יַעֲצִים עֵינָיו כְּמִי שֶׁלֹּא רָאָהוּ? לְכָךְ נֶאֱמַר <b>ויראת מאלהיך<\/b>, שֶׁהֲרֵי דָּבָר זֶה מָסוּר לְלִבּוֹ שֶׁל עוֹשֵׂהוּ, שֶׁאֵין מַכִּיר בּוֹ אֶלָּא הוּא, וְכָל דָּבָר הַמָּסוּר לַלֵּב נֶאֱמַר בוֹ וְיָרֵאתָ מֵּאֱלֹהֶיךָ (שם):", "rashi_en": "מפני שיבה תקום THOU SHALT RISE UP BEFORE A HOARY HEAD — One might think this reverence is also due to an ignorant old man! Scripture however says זקן — \"thou shalt honour the face of the ״זקן — and זקן  denotes only one who has acquired wisdom (Sifra, Kedoshim, Chapter 7 12;Kiddushin 32b). <br><br>AND THOU SHALT HONOR THE FACE OF THE OLD — What does the term \"honoring” an old man imply? That one should not sit in his seat nor contradict his statements. One might think that one is allowed to close one’s eyes as though one does not see him (the old man)! Scripture however states \"but be afraid of thy God”, because in this thing it is given to the heart of him only who does the action to know the motive that prompts him for no one has an insight into this except himself, and in reference to any thing where it is given only to the heart to know, Scripture states “and thou shalt be afraid of thy God Who knows thy secret thoughts״ (Sifra, Kedoshim, Chapter 7 14; Kiddushin 32b)."}, {"ch": 19, "v": 33, "aliyah": 4, "heb": "וְכִֽי־יָג֧וּר אִתְּךָ֛ גֵּ֖ר בְּאַרְצְכֶ֑ם לֹ֥א תוֹנ֖וּ אֹתֽוֹ׃", "onk": "וַאֲרֵי <b>יִתְגַּיַּר<\/b> עִמָּךְ גִּיּוֹרָא בְּאַרְעֲכוֹן לָא תוֹנוּן יָתֵיהּ:", "onk_en": "If a proselyte comes to live [<b>converts<\/b>] with you, in your land, do not cause him anguish.", "pj": "וַאֲרוּם אִין אִיתְגַיֵיר וְאִיתְחַזֵק עִמְכוֹן גִיוֹרָא בְּאַרְעֲכוֹן לָא תוֹנוּ יָתֵיהּ בְּמִילִין קָשִׁין", "pj_en": "And if a stranger becometh a sojourner, and settleth among you in your land, you shall not molest him with hard words:", "tj": "", "tj_en": "", "rashi": "<b>לא תונו.<\/b> אוֹנָאַת דְּבָרִים; לֹא תֹאמַר לוֹ אֶמֶשׁ הָיִיתָ עוֹבֵד עֲ\"זָ וְעַכְשָׁו אַתָּה בָא לִלְמֹד תּוֹרָה שֶׁנִּתְּנָה מִפִּי הַגְּבוּרָה (בבא מציעא נ\"ח):", "rashi_en": "לא תונו [AND IF A STRANGER SOJOURN WITH THEE IN  THY LAND], YE SHALL NOT VEX HIM — This implies vexing him with words (cf. Rashi on Exodus 22:20) — do not say to him, “Yesterday you were an idolator and now you come to study the Torah which was given from the mouth of the Almighty!” (Sifra, Kedoshim, Chapter 8 2; Bava Metzia 58b, 59b.) "}, {"ch": 19, "v": 34, "aliyah": 4, "heb": "כְּאֶזְרָ֣ח מִכֶּם֩ יִהְיֶ֨ה לָכֶ֜ם הַגֵּ֣ר&thinsp;<b>׀<\/b> הַגָּ֣ר אִתְּכֶ֗ם וְאָהַבְתָּ֥ לוֹ֙ כָּמ֔וֹךָ כִּֽי־גֵרִ֥ים הֱיִיתֶ֖ם בְּאֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "<b>כְּיַצִּיבָא<\/b> מִנְּכוֹן יְהֵי לְכוֹן גִּיּוֹרָא <b>דְּיִתְגַּיַּר<\/b> בֵּינֵיכוֹן וּתְרַחֵם לֵיהּ כְּוָתָךְ אֲרֵי <b>דַיָּרִין<\/b> הֲוֵיתוּן בְּאַרְעָא דְמִצְרָיִם אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "As one of your native born [<b>settled ones<\/b>] he shall be considered by you, the proselyte who lives with [<b>converts among<\/b>] you, and you shall love him as yourself, for you were strangers [<b>foreign resident<\/b>] in the land of Egypt, I am Adonoy, your God.", "pj": "כְּיַצִיבָא מִנְכוֹן יְהֵי לְכוֹן גִיוֹרָא דְמִתְגַיֵיר עִמְכוֹן וְתִרְחַם לֵיהּ כְּוָותָךְ דְמָא אַתְּ סָנֵי לָךְ לָא תַעֲבֵיד לֵיהּ אֲרוּם דַיְירוּן הֲוֵיתוּן בְּאַרְעָא דְמִצְרַיִם אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "but the stranger who sojourneth among you shall be (treated) as the native born, and thou shalt love him as thyseIf: that which is hateful unto thee, thou shalt not do unto him; for ye were sojourners in the land of Mizraim: I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>כי גרים הייתם.<\/b> מוּם שֶׁבְּךָ אַל תֹּאמַר לַחֲבֵרְךָ (שם נ\"ט):<br><br><b>אני ה' אלהיכם.<\/b> אֱלֹהֶיךָ וֵאלֹהָיו אֲנִי:", "rashi_en": "כי גרים הייתם FOR YE WERE STRANGERS [IN THE LAND OF EGYPT] — \"Do not reproach thy fellow-man for a fault which is also thine” (cf. Rashi on Exodus 22:20).<br><br>אני ה' אלהיכם I AM THE LORD YOUR GOD — Thy God and his God am I! (אלהיכם “your” God — the God of both of you)."}, {"ch": 19, "v": 35, "aliyah": 4, "heb": "לֹא־תַעֲשׂ֥וּ עָ֖וֶל בַּמִּשְׁפָּ֑ט בַּמִּדָּ֕ה בַּמִּשְׁקָ֖ל וּבַמְּשׂוּרָֽה׃", "onk": "לָא תַעְבְּדוּן <b>שְׁקַר<\/b> בְּדִין בִּמְשַׁחְתָּא בְּמַתְקְלָא וּבִמְכִלְתָּא:", "onk_en": "You shall not commit injustice [<b>lie<\/b>] in judgement; in [land] measure, in weight or in volume measure.", "pj": "לָא תַעַבְדוּן שִׁיקְרָא בְּסִידְרָא דִינָא בְּמִישְׁחֲתָא דְקַיְטָא וְסִיתְוָוא בְּמַתְקְלָא וּבִמְכִילְתָּא בִּגְדִישׁוּתָא וּבִמְחִיקָא", "pj_en": "You shall not deal falsely in the ordering of judgment; in the admeasurement of summer and winter; in weight and measure, in heaping up, or in sweeping off:", "tj": "וּבְמוֹזְנַיָא:", "tj_en": "", "rashi": "<b>לא תעשו עול במשפט.<\/b> אִם לְדִין, הֲרֵי כְּבָר נֶאֱמַר לֹא תַעֲשׂוּ עָוֶל בַּמִּשְׁפָּט (פסוק ט\"ו), וּמַהוּ מִשְׁפָּט הַשָּׁנוּי כָּאן? הוּא הַמִּדָּה וְהַמִּשְׁקָל וְהַמְּשׂוּרָה, מְלַמֵּד שֶׁהַמּוֹדֵד נִקְרָא דַיָּן, שֶׁאִם שִׁקֵּר בַּמִּדָּה הֲרֵי הוּא כִמְקַלְקֵל אֶת הַדִּין, וְקָרוּי עַוָּל, שָׂנאוּי וּמְשֻׁקָּץ, חֵרֶם וְתוֹעֵבָה, וְגוֹרֵם לַחֲמִשָּׁה דְבָרִים הָאֲמוּרִים בַּדַּיָּן — מְטַמֵּא אֶת הָאָרֶץ, וּמְחַלֵּל אֶת הַשֵּׁם, וּמְסַלֵּק אֶת הַשְּׁכִינָה, וּמַפִּיל אֶת יִשְׂרָאֵל בַּחֶרֶב, וּמַגְלֶה אוֹתָם מֵאַרְצָם (ספרא):<br><br><b>במדה.<\/b> זוֹ מִדַּת הָאָרֶץ (שם):<br><br><b>במשקל.<\/b> כְּמַשְׁמָעוֹ:<br><br><b>ובמשורה.<\/b> הִיא מִדַּת הַלַּח וְהַיָּבֵשׁ (בבא מציעא ס\"א):", "rashi_en": "לא תעשו עול במשפט YE SHALL NOT DO UNRIGHTEOUSNESS IN משפט — If this has a reference to the execution of justice it would be redundant, for it has already been stated (v. 15) “Ye shall do no unrighteousness in judgment”. What, then is the meaning of משפט mentioned here? It refers to what is right in respect to measure of length, to weight and to measure of capacity. The use of the word משפט here teaches us, therefore, that one who has to do with measuring (in trade or commerce) is termed (is regarded as) “a judge” so that if he gives false measure he is like the judge who perverts justice and he is therefore called \"an unjust person” (עַוָּל), hateful, detested, doomed to destruction, and an abomination (cf. Rashi v. 15). He brings about those five things which are mentioned in connection with the judge who perverts justice: he defiles the land, profanes the Name of the Lord, causes the Shechinah to depart from Israel's midst, Israel to fall by the sword and to be exiled from their land (Sifra, Kedoshim, Chapter 8 5). <br><br>במדה — This denotes land measure (linear and square measure); <br><br>במשקל is what the word literally implies (“in weight\", from שקל, to weigh); <br><br>ובמשורה — This denotes liquid and dry measure (Sifra, Kedoshim, Chapter 8 6; Bava Metzia 61b)."}, {"ch": 19, "v": 36, "aliyah": 4, "heb": "מֹ֧אזְנֵי צֶ֣דֶק אַבְנֵי־צֶ֗דֶק אֵ֥יפַת צֶ֛דֶק וְהִ֥ין צֶ֖דֶק יִהְיֶ֣ה לָכֶ֑ם אֲנִי֙ יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם אֲשֶׁר־הוֹצֵ֥אתִי אֶתְכֶ֖ם מֵאֶ֥רֶץ מִצְרָֽיִם׃", "onk": "מֹאזְנָוָן דִּקְשׁוֹט מַתְקְלָן דִּקְשׁוֹט <b>מְכִילָן דִּקְשׁוֹט וְהִינִין דִּקְשׁוֹט<\/b> יְהוֹן לְכוֹן אֲנָא יְיָ אֱלָהָכוֹן דִּי אַפֵּקִית יָתְכוֹן מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "Just scales and just weights a just dry measure (<i>ephah<\/i>) [<b>just volume measures<\/b>] and a just liquid measure (<i>hin<\/i>) [<b>just hinin<\/b>] you shall have for yourselves, I am Adonoy, your God who has taken you out of the land of Egypt.", "pj": "מוֹדְנָווּן דִקְשׁוֹט מַתְקְלִין דִקְשׁוֹט מְכִילוּ דִקְשׁוֹט וְקִיסְטִין דִקְשׁוֹט יְהֵי לְכוֹן אֲנָא יְיָ אֱלָהָכוֹן דְאַנְפָקִית יַתְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרָיִם", "pj_en": "but balances of truth, weights of truth, measures of truth, and tankards of truth, shall yours be. I am the Lord our God who brought you redeemed from the land of Mizraim:", "tj": "", "tj_en": "", "rashi": "<b>אבני צדק.<\/b> הֵם הַמִּשְׁקוֹלוֹת שֶׁשּׁוֹקְלִין כְּנֶגְדָּן:<br><br><b>איפת.<\/b> הִיא מִדַּת הַיָּבֵשׁ:<br><br><b>והין.<\/b> זוֹ הִיא מִדַּת הַלַּח:<br><br><b>אשר הוצאתי אתכם.<\/b> עַל מְנָת כֵּן; דָּ\"אַ אֲנִי הִבְחַנְתִּי בְּמִצְרַיִם בֵּין טִפָּה שֶׁל בְּכוֹר לְטִפָּה שֶׁאֵינָהּ שֶׁל בְּכוֹר, וַאֲנִי הַנֶּאֱמָן לִפָּרַע מִמִּי שֶׁטּוֹמֵן מִשְׁקְלוֹתָיו בַּמֶּלַח לְהוֹנוֹת אֶת הַבְּרִיּוֹת שֶׁאֵין מַכִּירִין בָּהֶם (בבא מציעא ס\"א):", "rashi_en": "אבני צדק are stones used for weights wherewith one weighs. <br><br>איפת — The “Epha” is a certain dry measure. <br><br>והין — The “Hin” is a certain liquid measure. <br><br>אשר הוצאתי אתכם WHO BROUGHT YOU FORTH [FROM EGYPT] for this purpose, that you shall be honest in your actions (Sifra, Kedoshim, Chapter 8 10). Another explanation is: I distinguished in Egypt between those who were firstborn and those who were not firstborn (a matter which is hidden from human cognizance), I am also certain to exact punishment from him who secretly puts his weights in salt in order to take advantage of people who are not aware of it (cf. Bava Metzia 61b)."}, {"ch": 19, "v": 37, "aliyah": 4, "heb": "וּשְׁמַרְתֶּ֤ם אֶת־כׇּל־חֻקֹּתַי֙ וְאֶת־כׇּל־מִשְׁפָּטַ֔י וַעֲשִׂיתֶ֖ם אֹתָ֑ם אֲנִ֖י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְתִטְּרוּן יָת כָּל קְיָמַי וְיָת כָּל דִּינַי וְתַעְבְּדוּן יָתְהוֹן אֲנָא יְיָ:", "onk_en": "You must keep all my statutes and all of my laws, and do [observe] them. I am Adonoy.", "pj": "וְתִיטְרוּן יַת כָּל קְיָימַי וְיַת כָּל סִדְרֵי דִינַי וְתַעַבְדוּן יַתְהוֹן אֲנָא יְיָ", "pj_en": "and you shall observe all My statutes, and all the ordinations of My judgments, and do them: I am the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 1, "aliyah": 5, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 2, "aliyah": 5, "heb": "וְאֶל־בְּנֵ֣י יִשְׂרָאֵל֮ תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִבְּנֵ֨י יִשְׂרָאֵ֜ל וּמִן־הַגֵּ֣ר&thinsp;<b>׀<\/b> הַגָּ֣ר בְּיִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִזַּרְע֛וֹ לַמֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָאָ֖רֶץ יִרְגְּמֻ֥הוּ בָאָֽבֶן׃", "onk": "וְעִם בְּנֵי יִשְׂרָאֵל תֵּימַר גְּבַר גְּבַר מִבְּנֵי יִשְׂרָאֵל וּמִין גִּיּוֹרָא <b>דְּיִתְגַּיְרוּן<\/b> בְּיִשְׂרָאֵל דִּי יִתֵּן מִזַּרְעֵיהּ לְמוֹלֶךְ אִתְקְטָלָא יִתְקְטֵל עַמָּא <b>בֵית יִשְׂרָאֵל<\/b> יִרְגְּמֻנֵּיהּ בְּאַבְנָא:", "onk_en": "And to Bnei Yisrael you shall say: that each and every man of Bnei Yisroel and from the proselytes that reside [<b>convert<\/b>] in Israel, who will give any of his children to <i>Molech<\/i>, [that] he shall surely be put to death; the people of the land [<b>House of Israel<\/b>] shall stone him to death.", "pj": "וְעִם בְּנֵי יִשְרָאֵל תְּמַלֵיל לְמֵימָר גְבַר טְלֵי אוֹ סִיב מִן גְנִיסַת בְּנֵי יִשְרָאֵל דְיַעֲבֵיר מִזַרְעֵיהּ לְמוֹלֶךְ לְמִיתוֹקְדָא בְּנוּרָא אִיתְקְטָלָא יִתְקְטֵיל עַמָא בֵּית יִשְרָאֵל יְחַיְיבוּן יָתֵיהּ בְּמַטְלוּת אַבְנִין", "pj_en": "And with the sons of Israel speak thou, to say: A man of the family of the sons of Israel, whether young or old, who shall make (an offering) of his offspring unto Molek to be burned in the fire, shall be verily put to death: the people of the house of Israel shall punish his guilt by the infliction of stones;", "tj": "", "tj_en": "", "rashi": "<b>ואל בני ישראל תאמר.<\/b> עוֹנְשִׁין עַל הָאַזְהָרוֹת:<br><br><b>מות יומת.<\/b> בְּבֵית דִּין, וְאִם אֵין כֹּחַ בְּבֵית דִּין, עַם הָאָרֶץ מְסַיְּעִין אוֹתָן (ספרא):<br><br><b>עם הארץ.<\/b> עַם שֶׁבְּגִינוֹ נִבְרֵאת הָאָרֶץ, עַם שֶׁעֲתִידִין לִירַשׁ הָאָרֶץ עַל יְדֵי מִצְווֹת הַלָּלוּ (שם):", "rashi_en": "ואל בני ישראל תאמר AGAIN THOU SHALT SAY TO THE CHILDREN OF ISRAEL the punishments for the transgression of the prohibitions mentioned in the previous chapters.<br><br>מות יומת HE SHALL SURELY BE PUT TO DEATH by sentence of the court; and if the court has not sufficient authority to carry this out, then, ‎ 'וכו‎‎ עם הארץ the people of the land shall assist them (Sifra, Kedoshim, Section 4 4). <br><br>עם הארץ THE PEOPLE OF THE EARTH — that people for whose sake the earth was created: Israel (cf. Rashi on Genesis 1:1); or, that people which is destined to remain in possession of the Land (Canaan) through obedience to these commands (Sifra, Kedoshim, Section 4 4)."}, {"ch": 20, "v": 3, "aliyah": 5, "heb": "וַאֲנִ֞י אֶתֵּ֤ן אֶת־פָּנַי֙ בָּאִ֣ישׁ הַה֔וּא וְהִכְרַתִּ֥י אֹת֖וֹ מִקֶּ֣רֶב עַמּ֑וֹ כִּ֤י מִזַּרְעוֹ֙ נָתַ֣ן לַמֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת־מִקְדָּשִׁ֔י וּלְחַלֵּ֖ל אֶת־שֵׁ֥ם קׇדְשִֽׁי׃", "onk": "וַאֲנָא אֶתֵּן יָת רוּגְזִי בְּגַבְרָא הַהוּא וֶאֱשֵׁיצֵי יָתֵיהּ מִגּוֹ עַמֵּיהּ אֲרֵי מִזַּרְעֵיהּ יְהַב לְמוֹלֶךְ בְּדִיל לְסָאֲבָא יָת מַקְדְּשִׁי וּלְאַחַלָּא יָת שְׁמָא דְקוּדְשִׁי:", "onk_en": "I shall direct My wrath on that man and I shall cut him off from among his people, for he gave of his children to <i>Molech<\/i>, in order to defile My Sanctuary and profane My Holy Name.", "pj": "וַאֲנָא אֶתֵּן פְּנוּיָיתָא לְמֶעֱסוֹק בְּגַבְרָא הַהוּא וְאֵישֵׁיצֵי יָתֵיהּ מִגוֹ עַמֵיהּ אֲרוּם מִזַרְעֵיהּ יְהַב לְפּוּלְחָנָא אוֹחֲרָא מִן בִּגְלַל לְסַאֲבָא יַת מַקְדָשִׁי וּלְאַפְסָא יַת שְׁמָא דְקוּדְשִׁי", "pj_en": "and I will cause a reverse, to make prosperity to cease with that man, and will cut him off from among his people; because he gave his offspring in strange worship to pollute My sanctuary and to profane My holy Name.", "tj": "", "tj_en": "", "rashi": "<b>אתן את פני.<\/b> פְּנַאי שֶׁלִּי — פּוֹנֶה אֲנִי מִכָּל עֲסָקַי וְעוֹסֵק בּוֹ (שם):<br><br><b>באיש.<\/b> וְלֹא בַצִּבּוּר (שם), שֶׁאֵין כָּל הַצִּבּוּר נִכְרָתִין:<br><br><b>כי מזרעו נתן למלך.<\/b> לְפִי שֶׁנֶּאֱמַר מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ (דברים י\"ח), בֶּן בְּנוֹ וּבֶן בִּתּוֹ מִנַּיִן? תַּ\"ל כִּי מִזַּרְעוֹ נָתַן לַמֹּלֶךְ, זֶרַע פָּסוּל מִנַּיִן? תַּ\"ל בְּתִתּוֹ מִזַּרְעוֹ לַמֹּלֶךְ (ספרא; סנהדרין ס\"ד):<br><br><b>למען טמא את מקדשי.<\/b> אֶת כְּנֶסֶת יִשְׂרָאֵל שֶׁהִיא מְקֻדֶּשֶׁת לִי, כִּלְשׁוֹן וְלֹא יְחַלֵּל אֶת מִקְדָּשַׁי (ויקרא כ\"א):", "rashi_en": "אתן את פני ‎ is taken in the sense of, פנאי שלי, My leisure — I shall turn away from everything else that I am occupied with, and will busy Myself with him alone (Sifra, Kedoshim, Section 4 13; cf. Rashi on Leviticus 17:10). <br><br>באיש AGAINST THAT MAN — but not against the whole congregation if they thus sin (Sifra, Kedoshim, Section 4 13), for the community as a whole is never punished with excision.  <br><br>כי מזרעו נתן למלך BECAUSE HE HATH GIVEN OF HIS SEED TO THE MOLECH — These words appear to be redundant since in v. 20 the nature of the sin is already mentioned, but because Scripture states (Deuteronomy 18:10) “[There shall not be found among you] any one that maketh his son or his daughter pass through the fire\", one might think that this law applies only to ones children; whence do we know that it applies also to one’s son's son and one's daughter’s son? Because Scripture states here, “because he hath given of his offspring to the Molech\". Whence do we know that illegitimate offspring are also included in this law? Because Scripture states again (v. 4) “when he giveth of his seed to the Molech” — whether legitimate or not (Sifra, Kedoshim, Section 4 6-7; Sanhedrin 64b). <br><br>למען טמא את מקדשי TO DEFILE MY מקדש — This means the “Congregation of Israel\" which is sanctified to Me. The word מקדש does not imply the Sanctuary only but anything that is holy to God, as in the expression (Leviticus 21:23) “that he profane not my holy things (‎‎‏מקדשי‎). "}, {"ch": 20, "v": 4, "aliyah": 5, "heb": "וְאִ֡ם הַעְלֵ֣ם יַעְלִ֩ימֽוּ֩ עַ֨ם הָאָ֜רֶץ אֶת־עֵֽינֵיהֶם֙ מִן־הָאִ֣ישׁ הַה֔וּא בְּתִתּ֥וֹ מִזַּרְע֖וֹ לַמֹּ֑לֶךְ לְבִלְתִּ֖י הָמִ֥ית אֹתֽוֹ׃", "onk": "וְאִם מִכְבַּשׁ יִכְבְּשׁוּן עַמָּא <b>בֵית יִשְׂרָאֵל<\/b> יָת עֵינֵיהוֹן מִן גַּבְרָא הַהוּא בִּדְיָהֵב מִזַּרְעֵיהּ לְמוֹלֶךְ בְּדִיל דְּלָא לְקַטָּלָא יָתֵיהּ:", "onk_en": "If the people of the land [<b>House of Israel<\/b>] will hide their eyes from that person, when he gives of his children to <i>Molech<\/i>, and they do not put him to death.", "pj": "וְאִין מִכְבַּשׁ יִכְבְשׁוּן עַמָא בֵית יִשְרָאֵל יַת עֵינֵיהוֹן מִן גַבְרָא הַהוּא בִּדְיִתֵּן מִזַרְעֵיהּ לְפוּלְחָנָא אוֹחֲרָא מְטוֹל דְלָא לְמִקְטוֹל יָתֵיהּ", "pj_en": "And if the people of the house of Israel hiding hide their eyes from that man, when he giveth his offspring unto strange worship, that they might not kill him,", "tj": "", "tj_en": "", "rashi": "<b>ואם העלם יעלימו.<\/b> אִם הֶעְלִימוּ בְּדָבָר אֶחָד, סוֹף שֶׁיַּעְלִימוּ בִדְבָרִים הַרְבֵּה; אִם הֶעְלִימוּ סַנְהֶדְרֵי קְטַנָּה, סוֹף שֶׁיַּעְלִימוּ סַנְהֶדְרֵי גְדוֹלָה (ספרא):", "rashi_en": "‎ואם העלם יעלימו  AND IF [THE PEOPLE OF THE LAND] DO ANY WAYS HIDE THEIR EYES [FROM THE MAN] — If they hide their eyes in one thing they will in the end hide their eyes also in many other matters (Sifra, Kedoshim, Section 4 9); if the Small Sanhedrin (a judicial court of twenty-three) hide their eyes, in the end the Great Sanhedrin (the Supreme Court of seventy-one) will also hide their eyes (Sifra, Kedoshim, Section 4 11)."}, {"ch": 20, "v": 5, "aliyah": 5, "heb": "וְשַׂמְתִּ֨י אֲנִ֧י אֶת־פָּנַ֛י בָּאִ֥ישׁ הַה֖וּא וּבְמִשְׁפַּחְתּ֑וֹ וְהִכְרַתִּ֨י אֹת֜וֹ וְאֵ֣ת&thinsp;<b>׀<\/b> כׇּל־הַזֹּנִ֣ים אַחֲרָ֗יו לִזְנ֛וֹת אַחֲרֵ֥י הַמֹּ֖לֶךְ מִקֶּ֥רֶב עַמָּֽם׃", "onk": "וֶאֱשַׁוֵּי אֲנָא יָת רוּגְזִי בְּגַבְרָא הַהוּא <b>וּבִסְעָדוֹהִי<\/b> וֶאֱשֵׁיצֵי יָתֵיהּ וְיָת כָּל דְּטָעָן בַּתְרוֹהִי לְמִטְעֵי בָּתַר מוֹלֶךְ מִגּוֹ עַמְּהוֹן:", "onk_en": "I shall set My wrath against that man and his family [<b>supporters<\/b>]; I shall cut him off, along with all those who go astray after him to go astray after <i>Molech<\/i>, [they will be cut off] from among their people.", "pj": "וְאֶשַׁוֵי אֲנָא פְנוּיַיְתָא לְמֶעֱסוֹק בְּגַבְרָא הַהוּא וּבִגְנִיסָתֵיהּ דִמְחַפְיַין עֲלוֹי לְאִתְרְדָאָה בְּיִסוּרֵי וְיָתֵיהּ אֵישֵׁיצֵי וְיַת כָּל דְטָעַן בַּתְרוֹי לְמִטְעֵי בָּתַר פּוּלְחָנָא אוֹחֲרָא מִגוֹ עַמֵיהּ", "pj_en": "then will I appoint a reverse, to make a controversy against that man, and against his family who protect (cover) him, to chastise (them) with afflictions; and him will I destroy, and all who follow him to wander after strange worship, from among their people.", "tj": "", "tj_en": "", "rashi": "<b>ובמשפחתו.<\/b> אָמַר רַבִּי שִׁמְעון וכִי מִשְׁפָּחָה מֶה חָטְאָה? אֶלָּא לְלַמֶּדְךָ שֶׁאֵין לְךָ מִשְׁפָּחָה שֶׁיֵּשׁ בָּהּ מוֹכֵס שֶׁאֵין כֻּלָּם מוֹכְסִין — שֶׁכֻּלָּן מְחַפִּין עָלָיו (ספרא; שבועות ל\"ט):<br><br><b>והכרתי אתו.<\/b> לָמָּה נֶאֱמַר? לְפִי שֶׁנֶּאֱמַר <b>ובמשפחתו<\/b> יָכוֹל יִהְיוּ כָל הַמִּשְׁפָּחָה בְּהִכָּרֵת, תַּ\"ל אֹתוֹ — אוֹתוֹ בְּהִכָּרֵת וְלֹא כָל הַמִּשְׁפָּחָה בְּהִכָּרֵת אֶלָּא בְּיִסּוּרִין (שם):<br><br><b>לזנות אחרי המלך.<\/b> לְרַבּוֹת שְׁאַר עֲ\"זָ שֶׁעֲבָדָהּ בְּכָךְ וַאֲפִלּוּ אֵין זוֹ עֲבוֹדָתָהּ (ספרא):", "rashi_en": "ובמשפחתו [THEN I WILL SET MY EYES AGAINST THAT MAN], AND AGAINST HIS FAMILY — R. Simeon asked, \"But how did his family sin that it should be punished?\" But the family is mentioned to teach you that you may take it as a rule that there is no family in which there is one tax-collector (a calling held in great reprobation by Jews) which may not be regarded as consisting entirely of tax-collectors, for they all try to protect him (Sifra, Kedoshim, Section 4 13; Shevuot 39a). <br><br>והכרתי אתו AND I WILL CUT HIM OFF — Why is this stated (it appears to be a mere repetition of the statement in v. 3)? Because since Scripture says here for the reason stated above, “[I will set My face…] against his family\", I might think that the  whole family is also doomed to excision; Scripture therefore states “[I will cut] him [off]\"— he alone is subject to excision, but the whole family is not subject to excision but to bodily sufferings (Sifra, Kedoshim, Section 4 14; Shevuot 39a).  <br><br>לזנות אחרי המלך TO COMMIT WHOREDOM WITH MOLECH — This is intended to include the worship also of any other idol which he worshipped in this way (by letting his children pass through the fire in honor of it) even though this is not the manner of worship peculiar to it (Sifra, Kedoshim, Section 4 15; Sanhedrin 64a)."}, {"ch": 20, "v": 6, "aliyah": 5, "heb": "וְהַנֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל־הָֽאֹבֹת֙ וְאֶל־הַיִּדְּעֹנִ֔ים לִזְנֹ֖ת אַחֲרֵיהֶ֑ם וְנָתַתִּ֤י אֶת־פָּנַי֙ בַּנֶּ֣פֶשׁ הַהִ֔וא וְהִכְרַתִּ֥י אֹת֖וֹ מִקֶּ֥רֶב עַמּֽוֹ׃", "onk": "וֶאֱנַשׁ דִּי יִתְפְּנֵי בָּתַר בִּדִּין וּדְכוּרוּ לְמִטְעֵי בַתְרֵיהוֹן וְאֶתֵּן יָת רוּגְזִי בַּאֲנָשָׁא הַהִיא וֶאֱשֵׁיצֵי יָתֵיהּ מִגּוֹ עַמֵּיהּ:", "onk_en": "The person who turns to mediums and oracles to stray after them; I shall direct My wrath against that person and cut him off from among his people.", "pj": "וּבַר נַשׁ דְיִסְטֵי בָּתַר שַׁאֲלֵי בִּידִין וּמַסְקֵי זְכוּרוּ וְתַבְעֵי גְרַם יְדוֹעַ לְמִטְעֵי בַּתְרֵיהוֹן וְאֶתֵּן פְּנִיוּתָא לְמֶעֱסוֹק בְּבַר נְשָׁא הַהוּא וְאֵישֵׁיצֵי יָתֵיהּ בְּמוֹתָנָא מִגוֹ עַמֵיהּ", "pj_en": "And the man who turns aside to inquire of the impostors, or to seek to bring up the dead, or to inquire by the bone of Jeddua, to go astray after them, I will appoint a reverse to punish that man, and will destroy him by a plague from among his people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 7, "aliyah": 5, "heb": "וְהִ֨תְקַדִּשְׁתֶּ֔ם וִהְיִיתֶ֖ם קְדֹשִׁ֑ים כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "וְתִתְקַדְּשׁוּן וּתְהוֹן קַדִּישִׁין אֲרֵי אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "You shall sanctify yourselves and be holy for I am Adonoy, your God.", "pj": "וְתִתְקַדְשׁוּן וּתְהוֹן קַדִישִׁין בְּגוּפֵיכוֹן מְטוֹל דַאֲקַבֵּל בְּרַעֲוָא צְלוֹתְכוֹן אֲנָא הוּא יְיָ מְקַדִשְׁכוֹן", "pj_en": "But sanctify yourselves, and be holy in your bodies, that your prayers may be received with acceptance: I am the Lord who sanctifies you.", "tj": "", "tj_en": "", "rashi": "<b>והתקדשתם.<\/b> זוֹ פְּרִישׁוּת עֲ\"זָ (שם):", "rashi_en": "והתקדשתם SANCTIFY YOURSELVES — This implies keeping aloof from all idolatry (Sifra, Kedoshim, Chapter 10 2)."}, {"ch": 20, "v": 8, "aliyah": 6, "heb": "וּשְׁמַרְתֶּם֙ אֶת־חֻקֹּתַ֔י וַעֲשִׂיתֶ֖ם אֹתָ֑ם אֲנִ֥י יְהֹוָ֖ה מְקַדִּשְׁכֶֽם׃", "onk": "וְתִטְּרוּן יָת קְיָמַי וְתַעְבְּדוּן יָתְהוֹן אֲנָא יְיָ מְקַדִּשְׁכוֹן:", "onk_en": "You must keep My statutes and do [observe] them. I am Adonoy who sanctifies you.", "pj": "וְתִטְרוּן יַת קְיָמַי וְתַעַבְדוּן יַתְהוֹן אֲנָא הוּא יְיָ מְקַדִשְׁכוֹן", "pj_en": "And observe My statutes and perform them: I am the Lord who sanctifies you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 9, "aliyah": 6, "heb": "כִּֽי־אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת־אָבִ֛יו וְאֶת־אִמּ֖וֹ מ֣וֹת יוּמָ֑ת אָבִ֧יו וְאִמּ֛וֹ קִלֵּ֖ל דָּמָ֥יו בּֽוֹ׃", "onk": "אֲרֵי גְבַר גְּבַר דִּי יְלוּט יָת אֲבוּהִי וְיָת אִמֵּיהּ אִתְקְטָלָא יִתְקְטֵל אֲבוּהִי וְאִמֵּיהּ לַט <b>קְטָלָא חַיָּב<\/b>:", "onk_en": "Any man that curses his father or his mother shall surely be put to death. [Since] he has cursed his father or mother, his blood is on him [<b>he is liable to the death penalty<\/b>].", "pj": "אֲרוּם גְבַר טְלֵי וּגְבַר סִיב דְיֵילוּט יַת אָבוֹי וְיַת אִמֵיהּ בִּשְׁמָא מְפָרֵשׁ אִתְקְטָלָא יִתְקְטֵיל בְּאַטְלוּת אַבְנִין מְטוֹל דְאָבוֹי וְאִמֵיהּ לָט קְטָלָא חַיָיב", "pj_en": "For the young man or the old man who curseth his father or his mother by the revealed Name, shall be verily put to death by the casting of stones; because he hath cursed his father or his mother, he is guilty of death.", "tj": "", "tj_en": "", "rashi": "<b>אביו ואמו קלל.<\/b> לְרַבּוֹת לְאַחַר מִיתָה (שם; סנהדרין פ\"ה):<br><br><b>דמיו בו.<\/b> זוֹ סְקִילָה, וְכֵן כָּל מָקוֹם שֶׁנֶּאֱמַר דָּמָיו בּוֹ, דְּמֵיהֶם בָּם; וְלָמַדְנוּ מֵאוֹב וְיִדְּעוֹנִי, שֶׁנֶּאֱמַר בָּהֶם בָּאֶבֶן יִרְגְּמוּ אֹתָם דְּמֵיהֶם בָּם (ספרא; כריתות ה'). וּפְשׁוּטוֹ שֶׁל מִקְרָא, כְּמוֹ דָּמוֹ בְרֹאשׁוֹ (יהושע ב') — אֵין נֶעֱנָשׁ עַל מִיתָתוֹ אֶלָּא הוּא, שֶׁהוּא גָרַם לְעַצְמוֹ שֶׁיֵּהָרֵג:", "rashi_en": "אביו ואמו קלל HE HATH CURSED HIS FATHER OR HIS MOTHER — These apparently redundant words are intended to include as subject to the death penalty one who curses his parents after their death (Sanhedrin 85b). <br><br>דמיו בו HIS BLOOD IS UPON HIM — This implies execution by stoning; similarly wherever the expressions דמיו בו or  דמיהם בם occur. We learn this Halachic rule from the case of אוב and ידעוני of whom Scripture expressly states, (v. 27) [“they shall surely be put to death], they shall overwhelm them with stones, their blood is upon them (דמיהם בם)” (Sifra, Kedoshim, Chapter 10 7; cf. Sanhedrin 54a; Keritot 5a). But according to the literal sense of the passage it means the same as the expression דמו בראשו (Joshua 2:19): “[whosoever shall go out of the doors of thy house into the street his blood shall be upon his own head] (דמו בראשו)” where the meaning is: No one deserves punishment on account of his death except himself, for he brought it upon himself that he should be killed (i. e. it was his own fault)."}, {"ch": 20, "v": 10, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת־אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת־אֵ֣שֶׁת רֵעֵ֑הוּ מֽוֹת־יוּמַ֥ת הַנֹּאֵ֖ף וְהַנֹּאָֽפֶת׃", "onk": "וּגְבַר דִּי יְגוּף יָת אִתַּת גְּבַר דִּי יְגוּף יָת אִתַּת חַבְרֵיהּ אִתְקְטָלָא יִתְקְטֵל גַּיָּפָא וְגַיַּפְתָּא:", "onk_en": "A man who commits adultery with another mans wife who commits adultery with the wife of his fellow man—they shall surely be put to death—the adulterer and the adulteress.", "pj": "וּגְבַר דִי יִגוֹר יַת אִתַּת גְבַר מֵאַרְסָא אוֹ דִי יִגוֹר יַת אִתַּת חַבְרֵיהּ מִבַּעְלָא אִיתְקְטָלָא יִתְקְטֵיל עַל מִיבְעֲלָא בְּשִׁינוּק סוּדְרָא אַקוֹשָׁא בְּגוֹ רְכִיכָא וְעַל מֵאַרְסָא בְּאַטְלוּת אַבְנִין גִיוֹרָא וְגִיוֹרְתָּא", "pj_en": "And the man who by adultery defileth the wife of (another) man, or who committeth adultery with the wife of his married neighbour, shall be verily put to death, by strangulation, with the hard towel in the tender part (?): and on account of a betrothed person, by the casting of stones: both the adulterer and the adulteress (shall die).", "tj": "", "tj_en": "", "rashi": "<b>ואיש.<\/b> פְּרָט לְקָטָן:<br><br><b>אשר ינאף את אשת איש.<\/b> פְּרָט לְאֵשֶׁת קָטָן, לִמְּדָנוּ שֶׁאֵין לְקָטָן קִדּוּשִׁין, וְעַל אֵיזוֹ אֵשֶׁת אִישׁ חִיַּבְתִּי לְךָ?<br><br><b>אשר ינאף את אשת רעהו.<\/b> פְּרָט לְאֵשֶׁת גּוֹי, לִמְּדָנוּ שֶׁאֵין קִדּוּשִׁין לְגוֹי (ספרא; סנהדרין נ\"ב):<br><br><b>מות יומת הנאף והנאפת.<\/b> כָּל מִיתָה הָאֲמוּרָה בַתּוֹרָה סְתָם, אֵינָהּ אֶלָּא חֶנֶק (ספרא; סנהדרין נ\"ה):", "rashi_en": "ואיש AND THE MAN [THAT COMMITTETH ADULERY SHALL SURELY BE PUT TO DEATH] — a man, thus excluding a minor (Sifra, Kedoshim, Chapter 10 8). <br><br>אשר ינאף את אשת איש WHO COMMITTETH ADULTERY WITH ANOTHER MAN'S WIFE — a man's wife, thus excluding the wife of a minor from the death penalty. This teaches us that a minor cannot enter into a marriage contract. And in reference to what married woman do I make you liable to the death penalty? <br><br>אשר ינאף את אשת רעהו IF HE COMMITTETH ADULTERY WITH THE WIFE OF HIS FELLOW-MAN — his fellow-man, thus excluding the wife of a heathen; this teaches us that a heathen cannot enter into a marriage contract according to Jewish law (Sifra, Kedoshim, Chapter 10 8; Sanhedrin 52b). <br><br>מות יומת הנאף והנאפת THE ADULTERER AND THE ADULTRESS SHALL SURELY BE PUT TO DEATH — Wherever a death penalty is mentioned in Scripture without being precisely defined, only strangulation is intended (Sifra, Kedoshim, Chapter 10 8; Sanhedrin 55b)."}, {"ch": 20, "v": 11, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת־אֵ֣שֶׁת אָבִ֔יו עֶרְוַ֥ת אָבִ֖יו גִּלָּ֑ה מֽוֹת־יוּמְת֥וּ שְׁנֵיהֶ֖ם דְּמֵיהֶ֥ם בָּֽם׃", "onk": "וּגְבַר דִּי יִשְׁכּוּב עִם אִתַּת אֲבוּהִי עֶרְיְתָא דַאֲבוּהִי גַּלִּי אִתְקְטָלָא יִתְקַטְּלוּן תַּרְוֵיהוֹן <b>קְטָלָא חַיָּבִין<\/b>:", "onk_en": "A man who will lie [conjugally] with his fathers wife has uncovered his fathers nakedness; they both shall surely be put to death, their blood is on them [<b>they are liable to the death penalty<\/b>].", "pj": "וּגְבַר דִי יְשַׁמֵשׁ עִם אִתַּת אָבוֹי בֵּין דְהִיא אִמֵיהּ בֵּין דְהִיא חוֹרַנְיָיתָא עֲרְיָיתָא דְאָבוֹי בָּזֵי אִיתְקְטָלָא יִתְקַטְלוּן תְּרֵיהוֹן קְטָלָא חַיָיבִין בְּאַטְלוּת אַבְנִין", "pj_en": "And a man who lieth with his father's wife, whether his own mother or another wife, and who hath dishonoured the nakedness of his father shall be verily put to death: both of them are guilty of death by the casting of stones.", "tj": "אִידְמֵיהוֹן בְּרֵישֵׁיהוֹן:", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 12, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת־כַּלָּת֔וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵיהֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵיהֶ֥ם בָּֽם׃", "onk": "וּגְבַר דִּי יִשְׁכּוּב יָת כַּלְּתֵיהּ אִתְקְטָלָא יִתְקַטְּלוּן תַּרְוֵיהוֹן תִּבְלָא עֲבָדוּ <b>קְטָלָא חַיָּבִין<\/b>:", "onk_en": "A man who will lie [conjugally] with his daughter-in-law; they both shall surely be put to death they have committed an act of perversion, their blood is on them [<b>they are liable to the death penalty<\/b>].", "pj": "וּגְבַר דִי יְשַׁמֵשׁ עִם כַּלָתֵיהּ אִיתְקְטָלָא יִתְקַטְלוּן תְּרֵיהוֹן תִּבְלָא עָבָדוּ קְטָלָא חַיָיבִין בְּאַטְלוּת אַבְנִין", "pj_en": "And if a man lieth with his daughter-in-law, both of them shall be put to death; they have wrought confusion, they are guilty of death by the casting of stones.", "tj": "", "tj_en": "", "rashi": "<b>תבל עשו.<\/b> גְּנַאי; לָשׁוֹן אַחֵר מְבַלְבְּלִין זֶרַע הָאָב בְּזֶרַע הַבֵּן:", "rashi_en": "תבל עשו THEY HAVE WROUGHT תבל — i. e. they have done a shameful deed. Another interpretation is that תבל is connected with בלל to \"intermingle\" and signifies that they mingle (בּלל) the seed of the father with the seed of the son."}, {"ch": 20, "v": 13, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת־זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵיהֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵיהֶ֥ם בָּֽם׃", "onk": "וּגְבַר דִּי יִשְׁכּוּב יָת דְּכוּרָא מִשְׁכְּבֵי אִתְּתָא תּוֹעֶבְתָּא עֲבָדוּ תַּרְוֵיהוֹן אִתְקְטָלָא יִתְקַטְּלוּן <b>קְטָלָא חַיָּבִין<\/b>:", "onk_en": "A man who will lie [conjugally] with [another] man, in the same manner as with a woman; they both have committed an abominable act, they shall surely be put to death, their blood is on them [<b>they are liable to the death penalty<\/b>].", "pj": "וּגְבַר דִי יְשַׁמֵשׁ עִם דְכוּרָא תַּשְׁמִישִׁין דְאִיתָא תּוֹעֵיבְתָּא עָבָדוּ תְּרֵיהוֹן אִיתְקְטָלָא יִתְקַטְלוּן בְּאַטְלוּת אַבְנִין", "pj_en": "And if a man lie with a man as with a woman, they have wrought abomination; both of them shall die by the stoning of stones.", "tj": "", "tj_en": "", "rashi": "<b>משכבי אשה.<\/b> מַכְנִיס כְּמִכְחוֹל בִּשְׁפוֹפֶרֶת:", "rashi_en": "משכבי אשה means he inserts as a brush into a tube [i.e. in the manner of marital intercourse]."}, {"ch": 20, "v": 14, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת־אִשָּׁ֛ה וְאֶת־אִמָּ֖הּ זִמָּ֣ה הִ֑וא בָּאֵ֞שׁ יִשְׂרְפ֤וּ אֹתוֹ֙ וְאֶתְהֶ֔ן וְלֹא־תִהְיֶ֥ה זִמָּ֖ה בְּתוֹכְכֶֽם׃", "onk": "וּגְבַר דִּי יִסַּב יָת אִתְּתָא וְיָת אִמַּהּ <b>עֵצַת חִטְאִין<\/b> הִיא בְּנוּרָא יוֹקְדוּן יָתֵיהּ וְיָתְהֶן וְלָא תְהֵי <b>עֵצַת חִטְאִין<\/b> בֵּינֵיכוֹן:", "onk_en": "A man who marries a woman and her mother; it is lewdness [<b>a sinful plan<\/b>]. They shall be burned in fire, he and [one of] them, and there will no longer be such lewdness [<b>a sinful plan<\/b>] among you.", "pj": "וּגְבַר דְיִסַב יַת אִיתָא וְיַת אִימָהּ זְנוּ הִיא בְּנוּרָא יוֹקְדוּן יָתֵיהּ וְיַתְהֶן בְּאַתְּכוּת אַבָּר לְפוּמְהוֹן וְלָא תְהֵי זְנוּ בֵּינֵיכוֹן", "pj_en": "And if a man take a wife and her mother, it is fornication let them be burned with fire with melted lead in their mouth, that fornication may not be among you.", "tj": "", "tj_en": "", "rashi": "<b>ישרפו אתו ואתהן.<\/b> אֵי אַתָּה יָכוֹל לוֹמַר אִשְׁתּוֹ הָרִאשׁוֹנָה יִשְׂרְפוּ, שֶׁהֲרֵי נְשָׂאָהּ בְּהֶתֵּר וְלֹא נֶאֶסְרָה עָלָיו, אֶלָּא אִשָּׁה וְאִמָּהּ הַכְּתוּבין כָּאן שְׁתֵּיהֶן לְאִסּוּר — שֶׁנָּשָׂא חֲמוֹתוֹ וְאִמָּהּ; וְיֵשׁ מֵרַבּוֹתֵינוּ שֶׁאוֹמְרִים אֵין כָּאן אֶלָּא חֲמוֹתוֹ, וּמַהוּ אֶתְהֶן? אֶת אַחַת מֵהֶן וְלָשׁוֹן יְוָנִי הוּא הֵן אַחַת (ספרא; סנהדרין ע\"ו):", "rashi_en": "ישרפו אתו ואתהן [AND IF A MAN TAKE A WIFE AND HER MOTHER, IT IS WICKEDNESS] THEY SHALL BE BURNT [WITH FIRE] BOTH HE AND THEY — You cannot say that this means that they shall burn also his first wife (i. e. her whom he married first), because you must admit that he married her  legally for  she was not forbidden to him as a wife. But the fact is that the case of “a woman and her mother\": mentioned here must be a case where both of them are forbidden to him on account of a previous relationship to him, — that, for instance, after having married a woman, he marries also his mother-in-law and her mother. It is these two that have to be burnt. There are, however, some of our Rabbis who say we have here a case of where, in addition to having married a woman, he marries only his mother-in-law (but not also the latter's mother). But what then could be the meaning of אתהן? It means one of them (“את \"הן) and this is a Greek word, הן (ξυ) meaning “one\" (Sanhedrin 76b; Sifra, Kedoshim, Chapter 10 12)."}, {"ch": 20, "v": 15, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכׇבְתּ֛וֹ בִּבְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְאֶת־הַבְּהֵמָ֖ה תַּהֲרֹֽגוּ׃", "onk": "וּגְבַר דִּי יִתֵּן שְׁכָבְתֵּיהּ בִּבְעִירָא אִתְקְטָלָא יִתְקְטֵל וְיָת בְּעִירָא תִּקְטְלוּן:", "onk_en": "A man who lies [conjugally] with an animal shall surely be put to death, and you shall also kill the animal.", "pj": "וּגְבַר דִי יִתֵּן תַּשְׁמִישֵׁיהּ בִּבְעִירָא אִיתְקְטָלָא יִתְקְטֵיל בְּאַטְלוּת אַבְנִין וְיַת בְּעִירָא תְּקַטְלוּן בְּקוֹלְפֵי", "pj_en": "And a man who lieth with a beast shall be surely put to death with the stoning of stones, and the beast shall be slain with spikes.", "tj": "", "tj_en": "", "rashi": "<b>ואת הבהמה תהרגו.<\/b> אִם אָדָם חָטָא בְּהֵמָה מֶה חָטְאָה? אֶלָּא מִפְּנֵי שֶׁבָּאָה לָאָדָם תַּקָּלָה עַל יָדָהּ לְפִיכָךְ אָמַר הַכָּתוּב תִּסָּקֵל, קַל וָחֹמֶר לָאָדָם, שֶׁיּוֹדֵעַ לְהַבְחִין בֵּין טוֹב לְרַע, וְגוֹרֵם רָעָה לַחֲבֵרוֹ לַעֲבֹר עֲבֵרָה; כַּיּוֹצֵא בַדָּבָר אַתָּה אוֹמֵר אַבֵּד תְּאַבְּדוּן אֶת כָּל הַמְּקֹמוֹת (דברים י\"ב), הֲרֵי דְבָרִים קַל וָחֹמֶר, וּמָה אִילָנוֹת שֶׁאֵינָן רוֹאִין וְאֵינָן שׁוֹמְעִין, עַל שֶׁבָּאת תַּקָּלָה עַל יָדָם אָמְרָה תוֹרָה הַשְׁחֵת, שְׂרֹף וְכַלֵּה, הַמַּטֶּה אֶת חֲבֵרוֹ מִדֶּרֶךְ חַיִּים לְדַרְכֵי מִיתָה, עַל אַחַת כַּמָּה וְכַמָּה (ספרא):", "rashi_en": "ואת הבהמה תהרגו AND YE SHALL SLAY THE BEAST — If the man has sinned, what sin has the beast committed?  But because the man’s opportunity to stumble (to sin) was occasioned by it, therefore Scripture says, “let it be stoned\"! How much the more does this principle apply to a human being who knows to distinguish between good and evil and yet brings evil upon his fellow-man by inducing him to commit a sin. In a similar way you should explain: (Deuteronomy 12:2) “Ye shall utterly destroy all the places [where the nations… served their gods… under every bushy tree]\" Now is not the following a logical conclusion? How is it in the case of trees which can neither see nor hear? Merely because an opportunity to sin was occasioned by them Scripture says, \"Destroy, burn, exterminate them!״ One who makes his fellow-man deviate from the path of  lifeto the path of death, does it not follow all the more that he should be punished? (Sifra, Kedoshim, Chapter 11 5; cf. Sanhedrin 54a, 55a.)"}, {"ch": 20, "v": 16, "aliyah": 6, "heb": "וְאִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל־כׇּל־בְּהֵמָה֙ לְרִבְעָ֣הֿ אֹתָ֔הּ וְהָרַגְתָּ֥ אֶת־הָאִשָּׁ֖ה וְאֶת־הַבְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵיהֶ֥ם בָּֽם׃", "onk": "וְאִתְּתָא דִּי תִקְרַב לְכָל בְּעִירָא <b>לְמִשְׁלַט בַּהּ<\/b> וְתִקְטוֹל יָת אִתְּתָא וְיָת בְּעִירָא אִתְקְטָלָא יִתְקַטְּלוּן <b>קְטָלָא חַיָּבִין<\/b>:", "onk_en": "A woman who presents herself to an animal causing it to copulate with her [<b>control her<\/b>]; you shall kill the woman and the animal. They shall surely be killed, their blood is on them [<b>they are liable to the death penalty<\/b>].", "pj": "וְאִתְּתָא דִי תִקְרַב לְצֵיד כָּל בְּעִירָא לְמִתְהַנְיָא מִינָהּ וְתִקְטְלוּן יַת אִיתְּתָא בְּאַטְלוּת אַבְנִין וְיַת בְּעִירָא בְּקוֹלְפֵי אִתְקְטָלָא יִתְקַטְלוּן דִין קְטוֹל חַיָיבִין", "pj_en": "And if a woman approacheth the side of any beast that it may have to do with her, they shall be slain; the woman by the casting of stones, and the beast by the slaughter of spikes, they shall die; for they are deserving of death.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 17, "aliyah": 6, "heb": "וְאִ֣ישׁ אֲשֶׁר־יִקַּ֣ח אֶת־אֲחֹת֡וֹ בַּת־אָבִ֣יו א֣וֹ בַת־אִ֠מּ֠וֹ וְרָאָ֨ה אֶת־עֶרְוָתָ֜הּ וְהִֽיא־תִרְאֶ֤ה אֶת־עֶרְוָתוֹ֙ חֶ֣סֶד ה֔וּא וְנִ֨כְרְת֔וּ לְעֵינֵ֖י בְּנֵ֣י עַמָּ֑ם עֶרְוַ֧ת אֲחֹת֛וֹ גִּלָּ֖ה עֲוֺנ֥וֹ יִשָּֽׂא׃", "onk": "וּגְבַר דִּי יִסַּב יָת אֲחָתֵיהּ בַּת אֲבוּהִי אוֹ בַת אִמֵּיהּ וְיֶחֱזֵי יָת עֶרְיְתַהּ וְהִיא תֶחֱזֵי יָת עֶרְיְתֵיהּ קְלָנָא הוּא וְיִשְׁתֵּיצוּן לְעֵינֵי בְּנֵי עַמְּהוֹן עֶרְיַת אֲחָתֵיהּ גַּלִּי חוֹבֵיהּ יְקַבֵּל:", "onk_en": "A man who marries his sister, either his fathers daughter or his mothers daughter, and he sees her nakedness and she sees his nakedness; it is a shameful perversion. They shall be cut off before their people he has uncovered the nakedness of his sister, he shall bear [the burden of] his iniquity.", "pj": "וּגְבַר דִי יְשַׁמֵשׁ עִם אַחֲתֵיהּ בְּרַת אָבוֹי אוֹ בְּרַת אִימֵיהּ וְיִבְזֵי יַת עֶרְיְיתָהּ וְהִיא תִבְזֵי יַת עֶרְיְיתֵיהּ גְנַיי הוּא אֲרוּם חִסְדָא עֲבָדִית עִם קַדְמָאֵי מִן בִּגְלַל דְיִתְמְלֵי עַלְמָא מִנְהוֹן עַד לָא אִיתְיְהִיב קְיָימָא בְּעַלְמָא וּמִן דְאִתְיְהִיב קְיָימָא בְּעַלְמָא כָּל דְיֶעֱבַד כְּדֵין וְיִשְׁתֵּיצוּן בְּמוֹתָנָא וְחָמְיַין בְּבִישְׁתְּהוֹן בְּנֵי עַמְהוֹן מְטוֹל דְעֶרְיַית אַחְתֵיהּ בְּזֵי חוֹבֵיהּ יְקַבֵּל", "pj_en": "And if a man lie with his sister, his father's daughter, or the daughter of his mother, and he dishonour her nakedness, it is depravity: for I showed mercy with the first ones, on behalf of the peopling of the world by them, while as yet I had not promulged the law in the world: but after the law hath been declared in the world, every one who committeth these things shall be destroyed by mortality, and the children of their people shall witness their punishment; for he who hath dishonoured the nakedness of his sister shall be guilty of death.", "tj": "", "tj_en": "", "rashi": "<b>חסד הוא.<\/b> לְשׁוֹן אֲרַמִּי חֶרְפָּה חִסּוּדָא; וּמִדְרָשׁוֹ אִם תֹּאמַר קַיִן נָשָׂא אֲחוֹתוֹ חֶסֶד עָשָׂה הַמָּקוֹם, לִבְנוֹת עוֹלָמוֹ מִמֶּנּוּ, שֶׁנֶּאֱמַר (תהילים פ\"ט), עוֹלָם חֶסֶד יִבָּנֶה (ספרא; סנהדרין נ\"ח):", "rashi_en": "חסד הוא IT IS A WICKED THING — It is an Aramaic expression, the Hebrew חרפה (disgrace) being in that language חסודא (cf. Onkelos on Genesis 34:14).  A Midrashic explanation of it (of חסד הוא) is; If you should say, \"But Cain married his sister!\" then I reply, Cain's case was an exceptional one; an act of kindness (חסד) was done by the Omnipresent in order that His world might be built up through him (i. e. He made the propagation of the human race possible through this union), as it is said (Psalms 89:3) \"The world was built up through חסד, loving-kindness\" (Sifra, Kedoshim, Chapter 11 11; Sanhedrin 58b)."}, {"ch": 20, "v": 18, "aliyah": 6, "heb": "וְ֠אִ֠ישׁ אֲשֶׁר־יִשְׁכַּ֨ב אֶת־אִשָּׁ֜ה דָּוָ֗ה וְגִלָּ֤ה אֶת־עֶרְוָתָהּ֙ אֶת־מְקֹרָ֣הּ הֶֽעֱרָ֔ה וְהִ֕וא גִּלְּתָ֖ה אֶת־מְק֣וֹר דָּמֶ֑יהָ וְנִכְרְת֥וּ שְׁנֵיהֶ֖ם מִקֶּ֥רֶב עַמָּֽם׃", "onk": "וּגְבַר דִּי יִשְׁכּוּב יָת אִתְּתָא <b>סוֹאֲבָתָא<\/b> וִיגַלִּי יָת עֶרְיְתַהּ יָת <b>קְלָנַהּ<\/b> גַּלִּי וְהִיא תְגַלֵּי יָת <b>סוֹאֲבַת<\/b> דְּמָהָא וְיִשְׁתֵּיצוּן תַּרְוֵיהוֹן מִגּוֹ עַמְּהוֹן:", "onk_en": "A man who will lie [conjugally] with a menstruating [<b>an impure<\/b>] woman and uncover her nakedness and uncover her source [womb] [<b>shameful perversion<\/b>] and she has uncovered the source [<b>impurity<\/b>] of her blood; they shall both be cut off from among their people.", "pj": "וּגְבַר דִי יְשַׁמֵשׁ עִם אִתְּתָא דְוָותָא וּבְזֵי יַת עִרְיְיתָהּ וְיַת מַבּוּעַ אֲדַם סוּבְתָא בְּזֵי וְהִיא בָּזִית יַת מַבּוּעַ אַדְמָהָא וְיִשְׁתֵּיצוּן תַּרְוֵיהוֹן בְּמוֹתָנָא מִגוֹ עַמְהֶן", "pj_en": "And a man who lieth with a woman who is unclean, and dishonoureth her nakedness, they shall both of them be destroyed by a plague from among their people.", "tj": "", "tj_en": "", "rashi": "<b>הערה.<\/b> גִּלָּה, וְכֵן כָּל לְשׁוֹן עֶרְוָה גִּלּוּי הוּא, וְהַוָּי\"ו יוֹרֶדֶת בַּתֵּיבָה לְשֵׁם דָּבָר כְּמוֹ זַעֲוָה מִגִּזְרַת וְלֹא קָם וְלֹא זָע (אסתר ה'), וְכֵן אַחֲוָה מִגִּזְרַת אָח. וְהַעֲרָאָה זוֹ נֶחְלְקוּ בָהּ רַבּוֹתֵינוּ, יֵשׁ אוֹמְרִים זוֹ נְשִׁיקַת שַׁמָּשׁ, וְיֵשׁ אוֹמְרִים זוֹ הַכְנָסַת עֲטָרָה (יבמות נ\"ה):", "rashi_en": "הערה means HE HATH UNCOVERED. Similarly the term ערוה everywhere denotes \"uncovering\". The ו in the word ערוה nakedness, is inserted in the root ערה in order to form a noun of it, just as the noun זעוה, \"trembling\", is of the same derivation as זע in the phrase (Esther 5:9) \"and he stood not up and did not tremble (זע)\". Similarly, אחוה \"brotherhood\", is of the same derivation as אח, brother. As for this term \"uncovering\" our Rabbis differ in the meaning they give to it (Yevamot 55b).  Some say that it is the mere contact of the tip of the organ, while others say that it is the insertion of the tip."}, {"ch": 20, "v": 19, "aliyah": 6, "heb": "וְעֶרְוַ֨ת אֲח֧וֹת אִמְּךָ֛ וַאֲח֥וֹת אָבִ֖יךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת־שְׁאֵר֛וֹ הֶעֱרָ֖ה עֲוֺנָ֥ם יִשָּֽׂאוּ׃", "onk": "וְעֶרְיַת אֲחַת אִמָּךְ וַאֲחַת אָבוּךְ לָא תְגַלֵּי אֲרֵי יָת קָרִיבֵיהּ גַּלִּי חוֹבְהֶן יְקַבְּלוּן:", "onk_en": "The nakedness of your mothers sister and of your fathers sister, you shall not uncover, for the nakedness of his close kin he will have bared they shall bear [the burden of] their iniquity.", "pj": "וְעֶרְיַת אֲחַת אִמָךְ וַאֲחַת אַבָּךְ לָא תִבְזֵי אֲרוּם יַת קְרֵיבֵיהּ בִּישְרֵיהּ בְּזֵי חוֹבֵיהוֹן יְקַבְּלוּן בְּמוֹתָנָא יְסוּפוּן", "pj_en": "Nor shalt thou dishonour the nakedness of thy mother's sister nor thy father's sister; for he hath dishonoured the flesh of his near kin: they shall receive the penalty of their guilt in dying.", "tj": "", "tj_en": "", "rashi": "<b>וערות אחות אמך וגו'.<\/b> שָׁנָה הַכָּתוּב בְּאַזְהָרָתָן, לוֹמַר שֶׁהֻזְהַר עֲלֵיהֶן בֵּין עַל אֲחוֹת אָבִיו וְאִמּוֹ מִן הָאָב, בֵּין עַל אַחְיוֹתֵיהֶן מִן הָאֵם, אֲבָל עֶרְוַת אֵשֶׁת אֲחִי אָבִיו לֹא הֻזְהַר אֶלָּא עַל אֵשֶׁת אֲחִי אָבִיו מִן הָאָב (עי' יבמות נ\"ד):", "rashi_en": "'וערות אחות אמך וגו‎‎‎  [AND THOU SHALT NOT UNCOVER] THE NAKEDNESS OF THY MOTHERS SISTER [NOR OF THY FATHER’S SISTER] — Scripture repeats the prohibition regarding these (although they had been mentioned already in Leviticus 18:12, 13) to tell us that one is prohibited in respect to them, both in regard to one's father's or mother's sister on their father's side, and in regard to their sisters on their mother's side. But as regards a marriage being forbidden with the wife of one's father’s brother (cf. Leviticus 18:14) the prohibition (i.e. the איסור ערוה מדאורייתא) applies only to the wife of the brother of one's father when he is the father’s brother on the father’s side (i. e. when both have one father) (cf. Yevamot 54b)."}, {"ch": 20, "v": 20, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת־דֹּ֣דָת֔וֹ עֶרְוַ֥ת דֹּד֖וֹ גִּלָּ֑ה חֶטְאָ֥ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ׃", "onk": "וּגְבַר דִּי יִשְׁכּוּב יָת <b>אִתַּת אַח אֲבוּהִי<\/b> עֶרְיַת <b>אַח אֲבוּהִי<\/b> גַּלִּי חוֹבְהֶן יְקַבְּלוּן בְּלָא וְלָד יְמוּתוּן:", "onk_en": "A man who will lie [conjugally] with his aunt [<b>father’s brother’s wife<\/b>] has uncovered the nakedness of his uncle [<b>father’s brother<\/b>] they will bear [the burden of] their sin and they will die without children.", "pj": "וּגְבַר דִי יְשַׁמֵשׁ עִם אִתַּת אַחְבוֹי עֶרְיַת אַחְבוֹי בְּזֵי חוֹבֵיהוֹן יְקַבְּלוּן בְּמוֹתָנָא יְסוּפוּן בְּלָא וְלַד יְמוּתוּן", "pj_en": "And if a man lie with the wife of his father's brother, he hath dishonoured the nakedness of his father's brother: they shall receive their punishment; they shall be consumed by mortality; without children shall they die.", "tj": "", "tj_en": "", "rashi": "<b>אשר ישכב את דדתו.<\/b> הַמִּקְרָא הַזֶּה בָּא לְלַמֵּד עַל כָּרֵת הָאָמוּר לְמַעְלָה שֶׁהוּא בְעֹנֶשׁ הֲלִיכַת עֲרִירִי:<br><br><b>ערירים.<\/b> כְּתַרְגּוּמוֹ, בְּלָא וְלָד, וְדוֹמֶה לוֹ וְאָנֹכִי הוֹלֵךְ עֲרִירִי (בראשית ט\"ו); יֵשׁ לוֹ בָנִים, קוֹבְרָן, אֵין לוֹ בָנִים, מֵת בְּלֹא בָנִים, לְכָךְ שִׁנָּה בִשְׁנֵי מִקְרָאוֹת אֵלּוּ — עֲרִירִים \"יָמֻתוּ\", עֲרִירִים \"יִהְיוּ\", <b>ערירים ימתו.<\/b> אִם יִהְיוּ לוֹ בִשְׁעַת עֲבֵרָה לֹא יִהְיוּ לוֹ כְּשֶׁיָּמוּת, לְפִי שֶׁקּוֹבְרָן בְּחַיָּיו, <b>ערירים יהיו.<\/b> אִם אֵין לוֹ בִּשְׁעַת עֲבֵרָה, יִהְיֶה כָל יָמָיו כְּמוֹ שֶׁהוּא עַכְשָׁו (ספרא; יבמות נ\"ה):", "rashi_en": "אשר ישכב את דדתו AND IF A MAN SHALL LIE WITH HIS AUNT… [THEY SHALL DIE CHILDLESS] — This verse is intended to teach that the \"excision\" mentioned above (18:29, where \"all these abominations includes the union prohibited in v. 14 of that chapter) consists in their (the offenders’) passing from this world childless. <br><br>ערירים — Translate this as the Targum renders it: בלא ולד, childless. Similar is, (Genesis 15:2) \"and I will pass away childless (ערירי)”. If he has children he will bury them (i. e. they will die during his life-time); if he has no children when this sin is committed he will die childless (he will beget no children afterwards). That is why Scripture varies the expression in these two verses (this and the following) here stating ערירים ימתו, \"they shall die childless\", and there ערירים יהיו, \"they shall be childless\". The expression ערירים ימתו implies: if he has any children at the time he commits the sin, he shall have none remaining when he dies because he will bury them during his lifetime; ערירים יהיו on the other hand, implies: if he has no children at the time when he commits the sin, he shall remain all his life just as he was then (Sifra, Kedoshim, Chapter 12 7; Yevamot 55a)."}, {"ch": 20, "v": 21, "aliyah": 6, "heb": "וְאִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת־אֵ֥שֶׁת אָחִ֖יו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛יו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ׃", "onk": "וּגְבַר דִּי יִסַּב יָת אִתַּת אֲחוּהִי מְרָחָקָא הִיא עֶרְיְתָא דַאֲחוּהִי גַּלִּי בְּלָא וְלָד יְהוֹן:", "onk_en": "A man who will marry his brothers wife who must be [conjugally] avoided [by him]; he has uncovered his brothers nakedness, they shall die without children.", "pj": "וּגְבַר דִי יִסַב יַת אִתַּת אַחְבוֹי בְּחַיוֹי מְרַחְקָא הִיא עֶרְיְיתָא דַאֲחוֹי בְּזֵי בְּלָא וְלַד יְהוֹן", "pj_en": "And if a man take the wife of his brother during his life, it is an abomination: he hath dishonoured the nakedness of his brother; without children shall they be.", "tj": "", "tj_en": "", "rashi": "<b>נדה הוא.<\/b> הַשְּׁכִיבָה הַזֹּאת מְנֻדָּה הִיא וּמְאוּסָה; וְרַבּוֹתֵינוּ דָּרְשׁוּ לֶאֱסֹר הַעֲרָאָה בָהּ כְּנִדָּה שֶׁהַעֲרָאָה מְפֹרֶשֶׁת בָּהּ — אֶת מְקֹרָהּ הֶעֱרָה (יבמות נ\"ד):", "rashi_en": "נדה הוא means, this cohabitation ought to be kept at a distance (avoided) and is loathsome. Our Rabbis explained that these words prohibit the slightest approach to her [I.e. one is liable for superficial contact, as is defined in the commentary on verse 18] just as though she were a נדה in the case of whom such intimacy is expressly stated as forbidden, as it says, (v. 18) “he hath uncovered her fountain” (cf. Yevamot 54a)."}, {"ch": 20, "v": 22, "aliyah": 6, "heb": "וּשְׁמַרְתֶּ֤ם אֶת־כׇּל־חֻקֹּתַי֙ וְאֶת־כׇּל־מִשְׁפָּטַ֔י וַעֲשִׂיתֶ֖ם אֹתָ֑ם וְלֹא־תָקִ֤יא אֶתְכֶם֙ הָאָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְכֶ֛ם שָׁ֖מָּה לָשֶׁ֥בֶת בָּֽהּ׃", "onk": "וְתִטְּרוּן יָת כָּל קְיָמַי וְיָת כָּל דִּינַי וְתַעְבְּדוּן יָתְהוֹן וְלָא תְרוֹקֵן יָתְכוֹן אַרְעָא דִּי אֲנָא מַעֵיל יָתְכוֹן תַּמָּן לְמִתַּב בַּהּ:", "onk_en": "You shall keep all of My statutes and all of My laws and do (observe) them [so that] you will not be expelled by the land to which I am bringing you there to reside therein.", "pj": "וְתִיטְרוּן אַתּוּן כְּנִישְׁתָּא דְיִשְרָאֵל יַת כָּל קְיָימַי וְיַת כָּל סִדְרֵי דִינַיי וְתַעַבְדוּן יַתְהוֹן וְלָא תִפְלוֹט יַתְכוֹן אַרְעָא דַאֲנָא מָעִיל יַתְכוֹן לְתַמָן לְמֵיתַב בָּהּ", "pj_en": "But you, the congregation of Israel, shall observe all My statutes, and all the ordinations of My judgments, and do them; that the land into which I am to bring you to dwell in it may not cast you out:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 23, "aliyah": 7, "heb": "וְלֹ֤א תֵֽלְכוּ֙ בְּחֻקֹּ֣ת הַגּ֔וֹי אֲשֶׁר־אֲנִ֥י מְשַׁלֵּ֖חַ מִפְּנֵיכֶ֑ם כִּ֤י אֶת־כׇּל־אֵ֙לֶּה֙ עָשׂ֔וּ וָאָקֻ֖ץ בָּֽם׃", "onk": "וְלָא תְהָכוּן בְּנִימוֹסֵי עַמְמַיָּא דִּי אֲנָא מַגְלֵי מִן קֳדָמֵיכוֹן אֲרֵי יָת כָּל אִלֵּין עֲבָדוּ <b>וְרָחִיק מֵימְרִי<\/b> יָתְהוֹן:", "onk_en": "You shall not follow the customs of the nation which I am expelling before you. For they have done all these above mentioned sins and I became disgusted with [<b>my Word distanced<\/b>] them.", "pj": "וְלָא תְהָכוּן בְּנִימוּסֵי עַמְמַיָא דַאֲנָא מַגְלֵי מִן קֳדָמֵיכוֹן אֲרוּם יַת כָּל מְרַחֲקַיָיא הָאִילֵין עָבָדוּ וְרָחִיק מֵימְרִי יַתְהוֹן", "pj_en": "and walk not after the laws of the peoples whom I drive away from before you; for they have committed all these abhorrent things, and My Word hath abhorred them.", "tj": "", "tj_en": "", "rashi": "<b>ואקץ.<\/b> לְשׁוֹן מִאוּס, כְּמוֹ קַצְתִּי בְחַיַּי (בראשית כ\"ז), כְּאָדָם שֶׁהוּא קָץ בִּמְזוֹנוֹ (ספרא):", "rashi_en": "קוץ — ואקץ signifies loathsomeness. Similar is: (Genesis 27:46) \"I am sick (קצתי) of my life”, like a man who is disgusted with his food (Sifra, Kedoshim, Chapter 12 16)."}, {"ch": 20, "v": 24, "aliyah": 7, "heb": "וָאֹמַ֣ר לָכֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת־אַדְמָתָם֒ וַאֲנִ֞י אֶתְּנֶ֤נָּה לָכֶם֙ לָרֶ֣שֶׁת אֹתָ֔הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּדְבָ֑שׁ אֲנִי֙ יְהֹוָ֣ה אֱלֹֽהֵיכֶ֔ם אֲשֶׁר־הִבְדַּ֥לְתִּי אֶתְכֶ֖ם מִן־הָֽעַמִּֽים׃", "onk": "וַאֲמָרִית לְכוֹן אַתּוּן תִּירְתוּן יָת אַרְעֲהוֹן וַאֲנָא אֶתְּנִנַּהּ לְכוֹן לְמֵירַת יָתַהּ אַרְעָא <b>עָבְדָא<\/b> חֲלָב וּדְבָשׁ אֲנָא יְיָ אֱלָהָכוֹן דִּי אַפְרֵשִׁית יָתְכוֹן מִן עַמְמַיָּא:", "onk_en": "And I have said to you [that] you shall inherit their land, and I shall give it to you that you may inherit it, a land flowing with [<b>producing<\/b>] milk and honey, I am Adonoy, your God who separated you from the [other] peoples.", "pj": "וַאֲמָרִית לְכוֹן אַתּוּן תִּזְדַהֲרוּן מִן תּוֹעֵיבְתָּא אִילֵין מִן בִּגְלַל דְתֵירְתוּן יַת אַרְעֲהוֹן וַאֲנָא אִיתְּנִינָהּ לְכוֹן לְמֵירַת יָתָהּ אֲרַע עַבְדָא חֲלַב וּדְבַשׁ אֲנָא הוּא יְיָ אֱלָהָכוֹן דְאַפְרָשִׁית יַתְכוֹן מִן עַמְמַיָא", "pj_en": "But I have told you to beware of these horrors, that you may inherit their land; and I will give it you to possess it, a land producing milk and honey I am the Lord your God who have separated you from the nations.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 20, "v": 25, "aliyah": 7, "heb": "וְהִבְדַּלְתֶּ֞ם בֵּֽין־הַבְּהֵמָ֤ה הַטְּהֹרָה֙ לַטְּמֵאָ֔ה וּבֵין־הָע֥וֹף הַטָּמֵ֖א לַטָּהֹ֑ר וְלֹֽא־תְשַׁקְּצ֨וּ אֶת־נַפְשֹֽׁתֵיכֶ֜ם בַּבְּהֵמָ֣ה וּבָע֗וֹף וּבְכֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽאֲדָמָ֔ה אֲשֶׁר־הִבְדַּ֥לְתִּי לָכֶ֖ם לְטַמֵּֽא׃", "onk": "וְתַפְרְשׁוּן בֵּין בְּעִירָא דַכְיָא לִמְסָאָבָא וּבֵין עוֹפָא מְסָאָבָא לִדְכֵי וְלָא תְשַׁקְּצוּן יָת נַפְשָׁתֵיכוֹן בִּבְעִירָא וּבְעוֹפָא וּבְכֹל דִּי תַרְחֵשׁ אַרְעָא דִּי אַפְרֵשִׁית לְכוֹן לְסָאָבָא:", "onk_en": "You shall distinguish between a [ritually] clean animal and a unclean one, between the unclean fowl and the clean one. Do not make yourselves disgusting through the animals, fowl or through any creature that creeps on the ground which I have distinguished for you as being unclean.", "pj": "וְתִפְרְשׁוּן בֵּין בְּעִירָא דְמִכַּשְׁרָא לְמֵיכַל לִדְמִיפְסְלָא לְמֵיכַל וּבֵין עוֹפָא דְמִפְסוֹל לְמֵיכַל לִדְמַכְשַׁר לְמֵיכַל וְלָא תְשַׁקְצוּן יַת נַפְשָׁתֵיכוֹן בִּבְעִירָא דְרִיסַת חַיְיתָא וּבְעוֹפָא דָרִיס בַּר נִיצְצָא וּבְכָל מַן דְתַרְחֵישׁ אַרְעָא דְאַפְרָשִׁית לְכוֹן לְסוֹאֲבֵיהוֹן", "pj_en": "And you shall make distinction between the animal which is fit to be eaten, and that which it is improper to eat; and between the fowl which it is improper to eat, and that which is fit to be eaten. Defile not your souls by (eating of) the animal that is torn by a wild beast, or the bird torn by the falcon, or anything that creepeth upon the which I have from you for their uncleanness.", "tj": "", "tj_en": "", "rashi": "<b>והבדלתם בין הבהמה הטהרה לטמאה.<\/b> אֵין צָרִיךְ לוֹמַר בֵּין פָּרָה לַחֲמוֹר, שֶׁהֲרֵי מֻבְדָּלִין וְנִכָּרִין הֵם, אֶלָּא בֵּין טְהוֹרָה לְךָ לִטְמֵאָה לְךָ — בֵּין שֶׁנִּשְׁחַט רֻבּוֹ שֶׁל סִימָן לְנִשְׁחַט חֶצְיוֹ, וְכַמָּה בֵּין רֻבּוֹ לְחֶצְיוֹ? מְלֹא שְׂעָרָה (ספרא):<br><br><b>אשר הבדלתי לכם לטמא.<\/b> לֶאֱסֹר:", "rashi_en": " והבדלתם בין הבהמה הטהרה לטמאה YE SHALL THEREFORE DISTINGUISH BETWEEN CLEAN BEASTS AND UNCLEAN — It is needless for Scripture to say that one should distinguish between a cow and an ass for these are different and are therefore distinguishable. But it means: you shall distinguish between such an animal as is clean (permitted) to you and such as is unclean (forbidden) to you although it is a clean animal per se, i.e., make a distinction between an animal which has been killed by cutting at least the greater part of each organ (the gullet and the windpipe) or whether it has been killed by cutting exactly the half of each organ. And how much difference is there between the greater part and the exact half? A hair’s breadth only (and consequently the command is given: והבדלתם, “you shall very carefully distinguish”) (Sifra, Kedoshim, Chapter 12 20; cf. also Rashi on Leviticus 11:47 and Chullin 27a).<br><br>אשר הבדלתי לכם לטמא WHICH I HAVE SEPARATED FOR YOU TO DECLARE THEM UNCLEAN — This means, to declare them as forbidden."}, {"ch": 20, "v": 26, "aliyah": 7, "heb": "וִהְיִ֤יתֶם לִי֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהֹוָ֑ה וָאַבְדִּ֥ל אֶתְכֶ֛ם מִן־הָֽעַמִּ֖ים לִהְי֥וֹת לִֽי׃", "onk": "וּתְהוֹן <b>קֳדָמַי<\/b> קַדִּישִׁין אֲרֵי קַדִּישׁ אֲנָא יְיָ וְאַפְרֵשִׁית יָתְכוֹן מִן עַמְמַיָּא לְמֶהֱוֵי <b>פָלְחִין קֳדָמָי<\/b>:", "onk_en": "You shall be holy to [<b>before<\/b>] Me, for I, Adonoy, am holy and I have distinguished you from the [other] peoples to be Mine [and to serve Me] [<b>be worshippers before Me<\/b>].", "pj": "וְתֶהֱווֹן קֳדָמַי קַדִישִׁין אֲרוּם קַדִישׁ אֲנָא יְיָ דִבְחָרִית בְּכוֹן וְאַפְרָשִׁית יַתְכוֹן מִן עַמְמַיָא מְטוֹל לְמֶהֱוֵי פַּלְחִין קֳדָמַי", "pj_en": "And you shall be holy before me; for holy am I, the Lord, who have chosen you, and separated you from the nations to be wor­shippers before Me.", "tj": "", "tj_en": "", "rashi": "<b>ואבדל אתכם מן העמים להיות לי.<\/b> אִם אַתֶּם מֻבְדָּלִים מֵהֶם הֲרֵי אַתֶּם שֶׁלִּי, וְאִם לָאו הֲרֵי אַתֶּם שֶׁל נְבוּכַדְנֶאצַּר וַחֲבֵרָיו; רַבִּי אֶלְעָזָר בֶּן עֲזַרְיָה אוֹמֵר מִנַּיִן שֶׁלֹּא יֹאמַר אָדָם נַפְשִׁי קָצָה בִּבְשַׂר חֲזִיר, אִי אֶפְשִׁי לִלְבֹּשׁ כִּלְאַיִם, אֲבָל יֹאמַר אֶפְשִׁי וּמָה אֶעֱשֶׂה וְאָבִי שֶׁבַּשָּׁמַיִם גָּזַר עָלַי? תַּ\"ל וָאַבְדִּל אֶתְכֶם מִן הָעַמִּים לִהְיוֹת לִי, שֶׁתְּהֵא הַבְדָּלַתְכֶם מֵהֶם לִשְׁמִי — פּוֹרֵשׁ מִן הָעֲבֵרָה וּמְקַבֵּל עָלָיו עֹל מַלְכוּת שָׁמָיִם (ספרא):", "rashi_en": "ואבדל אתכם מן העמים להיות לי ‎ AND I HAVE SEPARATED YOU FROM THE PEOPLES THAT YOU SHOULD BE MINE — If you hold yourselves apart from them then you will be Mine, but if not, you belong to (become subject to) Nebuchadnezzar and others like him. Rabbi Eleazer ben Azariah said, “Whence do we know that one should not say, \"My soul loathes swine’s flesh”, or, “I have no desire to wear clothes which are a mixture of wool and linen”, but one should say, \"I would, indeed, like them, but what can I do since my Father in heaven has imposed these decrees upon me”? Because Scripture states: “I have separated you from the peoples to be for Me\",  whichyour separation from them (from their doings) should be for My sake — that one should keep aloof from sin and take upon himself the yoke of the kingdom of Heaven (Sifra, Kedoshim, Chapter 12 23)."}, {"ch": 20, "v": 27, "aliyah": 7, "heb": "וְאִ֣ישׁ אֽוֹ־אִשָּׁ֗ה כִּי־יִהְיֶ֨ה בָהֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּאֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖ם דְּמֵיהֶ֥ם בָּֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּגְבַר אוֹ אִתְּתָא אֲרֵי יְהֵי בְהוֹן בִּדִּין אוֹ דְּכוּר אִתְקְטָלָא יִתְקַטְּלוּן בְּאַבְנָא יִרְגְּמוּן יָתְהוֹן <b>קְטָלָא חַיָּבִין<\/b>:", "onk_en": "If among the men or women there will be a medium or an oracle they shall surely be put to death. You shall stone them to death, their blood is on them [<b>they are liable to the death penalty<\/b>].", "pj": "וּגְבַר אוֹ אִתְּתָא אֲרוּם יְהֵי בְּהוֹן בִּידִין אוֹ זְכוּרוּ אִתְקְטָלָא יִתְקַטְלוּן בְּאַבְנָא יְאַטְלוּן יַתְהוֹן קְטָלָא חַיָיבִין", "pj_en": "And the man or the woman who hath in them (the spirit of) divination or necromancy shall die by the casting of stones; for they are guilty of death.", "tj": "", "tj_en": "", "rashi": "<b>כי יהיה בהם אוב וגו'.<\/b> כָּאן נֶאֱמַר בָּהֶם מִיתָה וּלְמַעְלָה כָרֵת, עֵדִים וְהַתְרָאָה בִּסְקִילָה, מֵזִיד בְּלֹא הַתְרָאָה בְּהִכָּרֵת, וְשִׁגְגָתָם חַטָּאת, וְכֵן בְּכָל חַיָּבֵי מִיתוֹת שֶׁנֶּאֱמַר בָּהֶם כָּרֵת:", "rashi_en": "'‎כי יהיה בהם אוב וגו‎  [A MAN ALSO, OR A WOMAN] THAT HATH THE SPIRIT אוב, [OR THAT IS A WIZARD SHALL SURELY BE PUT TO DEATH] — Here the penalty of death by stoning is mentioned for them, and above (Leviticus 20:6) it mentions excision! But the explanation is: If there were witnesses to the offence and the necessary warning had been given them, death by stoning is the punishment. If he acted wittingly but had not been warned, he is punishable with excision and if he breaks the law regarding them (the אוב or ידעוני) inadvertently, he has to bring a sin offering. And the same rules  apply  in  the case of all persons who are subject to the death penalty, where excision is mentioned (i. e. in all such cases “stoning\" or a sin offering is the punishment according to the circumstances)."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
