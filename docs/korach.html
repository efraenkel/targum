<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.aliyah-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar { display: none; }
.aliyah-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.aliyah-btn:active { background: var(--rule); }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>

<script>
const DATA = [{"ch": 16, "v": 1, "aliyah": 1, "heb": "וַיִּקַּ֣ח קֹ֔רַח בֶּן־יִצְהָ֥ר בֶּן־קְהָ֖ת בֶּן־לֵוִ֑י וְדָתָ֨ן וַאֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְא֥וֹן בֶּן־פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן׃", "onk": "<b>וְאִתְפְּלֵג<\/b> קֹרַח בַּר יִצְהָר בַּר קְהָת בַּר לֵוִי וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב וְאוֹן בַּר פֶּלֶת בְּנֵי רְאוּבֵן:", "onk_en": "Korach took [<b>divided<\/b>], [Korach], the son of Yitzhar the son of Kehos, the son of Levi, and Dasan and Aviram the sons of Eliav, and On the son of Peles, the sons of Reuvein.", "pj": "ויקח קרח וּנְסֵיב גוּלְיָיתֵיהּ דְכוּלָא תִּיכְלָא קרַח בַּר יִצְהָר בַּר קְהָת בַּר לֵוִי וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב וְאוֹן בַּר פֶּלֶת בְּנֵי רְאוּבֵן", "pj_en": "But Korach bar Tizhar bar Kehath, bar Levi, with Dathan and Abiram the sons of Eliab, and On bar Peleth, of the Beni-Reuben, took his robe which was all of hyacinth,", "tj": "וּנְסֵיב עֵצָה וּפְלַג קרַח:", "tj_en": "And Korach took counsel, and made division.", "rashi": "<b>ויקח קרח.<\/b> פָּרָשָׁה זוֹ יָפֶה נִדְרֶשֶׁת בְּמִדְרַשׁ רַבִּי תַנְחוּמָא:<br><br><b>ויקח קרח.<\/b> לָקַח אֶת עַצְמוֹ לְצַד אֶחָד לִהְיוֹת נֶחֱלָק מִתּוֹךְ הָעֵדָה לְעוֹרֵר עַל הַכְּהֻנָּה, וְזֶהוּ שֶׁתִּרְגֵם אֻנְקְלוֹס \"וְאִתְפְּלֵג\" — נֶחֱלַק מִשְּׁאָר הָעֵדָה לְהַחֲזִיק בְּמַחֲלֹקֶת, וְכֵן \"מַה יִּקָּחֲךָ לִבֶּךָ\" (איוב ט\"ו) — לוֹקֵחַ אוֹתְךָ לְהַפְלִיגְךָ מִשְּׁאָר בְּנֵי אָדָם. דָּ\"אַ: <b>ויקח קרח<\/b>, מָשַׁךְ רָאשֵׁי סַנְהֶדְרָאוֹת שֶׁבָּהֶם בִּדְבָרִים, כְּמוֹ שֶׁנֶּאֱמַר \"קַח אֶת אַהֲרֹן\" (ויקרא ח'), \"קְחוּ עִמָּכֶם דְּבָרִים\" (הושע י\"ד):<br><br><b>בן יצהר בן קהת בן לוי.<\/b> וְלֹא הִזְכִּיר \"בֶּן יַעֲקֹב\", שֶׁבִּקֵּשׁ רַחֲמִים עַל עַצְמוֹ שֶׁלֹא יִזָּכֵר שְׁמוֹ עַל מַחְלְקוֹתָם, שֶׁנֶּאֱמַר \"בִּקְהָלָם אַל תֵּחַד כְּבֹדִי\" (בראשית מ\"ט), וְהֵיכָן נִזְכַּר שְׁמוֹ עַל קֹרַח? בְּהִתְיַחֲסָם עַל הַדּוּכָן בְּדִבְרֵי הַיָּמִים, שֶׁנֶּאֱמַר (דהי\"א ו') \"בֶּן אֶבְיָסָף בֶּן קֹרַח בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי בֶּן יִשְׂרָאֵל\":<br><br><b>דתן ואבירם.<\/b> בִּשְׁבִיל שֶׁהָיָה שֵׁבֶט רְאוּבֵן שָׁרוּי בַּחֲנִיָּתָם תֵּימָנָה שָׁכֵן לִקְהָת וּבָנָיו הַחוֹנִים תֵּימָנָה, נִשְׁתַּתְּפוּ עִם קֹרַח בְּמַחֲלָקְתּוֹ — \"אוֹי לָרָשָׁע אוֹי לִשְׁכֵנוֹ\". וּמָה רָאָה קֹרַח לַחֲלֹק עִם מֹשֶׁה? נִתְקַנֵּא עַל נְשִׂיאוּתוֹ שֶׁל אֱלִיצָפָן בֶּן עֻזִּיאֵל, שֶׁמִּנָּהוּ מֹשֶׁה נָשִׂיא עַל בְּנֵי קְהָת עַל פִּי הַדִּבּוּר, אָמַר קֹרַח, אַחֵי אַבָּא אַרְבָּעָה הָיוּ, שֶׁנֶּאֱמַר (שמות ו') \"וּבְנֵי קְהָת\" וְגוֹ', עַמְרָם הַבְּכוֹר נָטְלוּ שְׁנֵי בָנָיו גְּדֻלָּה, אֶחָד מֶלֶךְ וְאֶחָד כֹּהֵן גָּדוֹל, מִי רָאוּי לִטֹּל אֶת הַשְּׁנִיָּה? לֹא אֲנִי שֶׁאֲנִי בֶּן יִצְהָר, שֶׁהוּא שֵׁנִי לְעַמְרָם, וְהוּא מִנָּה נָשִׂיא אֶת בֶּן אָחִיו הַקָּטָן מִכֻּלָּם, הֲרֵינִי חוֹלֵק עָלָיו וּמְבַטֵּל אֶת דְּבָרָיו. מֶה עָשָׂה? עָמַד וְכָנַס ר\"נ רָאשֵׁי סַנְהֶדְרָאוֹת — רֻבָּן מִשֵּׁבֶט רְאוּבֵן שְׁכֵנָיו וְהֵם אֱלִיצוּר בֶּן שְׁדֵיאוּר וַחֲבֵרָיו וְכַיּוֹצֵא בוֹ, שֶׁנֶּאֱמַר נְשִׂיאֵי עֵדָה קְרִאֵי מוֹעֵד וּלְהַלָּן הוּא אוֹמֵר (במדבר א') \"אֵלֶּה קְרוּאֵי הָעֵדָה\" — וְהִלְבִּישָׁן טַלִּיתוֹת שֶׁכֻּלָּן תְּכֵלֶת, בָּאוּ וְעָמְדוּ לִפְנֵי מֹשֶׁה, אָמְרוּ לוֹ טַלִּית שֶׁכֻּלָּהּ שֶׁל תְּכֵלֶת חַיֶּבֶת בְּצִיצִית אוֹ פְטוּרָה? אָמַר לָהֶם חַיֶּבֶת, הִתְחִילוּ לִשְׂחֹק עָלָיו, אֶפְשָׁר טַלִּית שֶׁל מִין אַחֵר חוּט אֶחָד שֶׁל תְּכֵלֶת פּוֹטְרָהּ, זוֹ שֶׁכֻּלָּהּ תְּכֵלֶת לֹא תִפְטֹר אֶת עַצְמָהּ? (תנחומא):<br><br><b>בני ראובן.<\/b> דָּתָן וַאֲבִירָם וְאוֹן בֶּן פֶּלֶת:", "rashi_en": "ויקח קרח — This section is beautifully expounded in the Midrash of Rabbi Tanchuma.<br><br>ויקח קרח lit., AND KORAH TOOK — He betook himself on one side with the view of separating himself from out of the community so that he might raise a protest regarding the priesthood to which Moses had appointed his brother. This is what Onkelos means when he renders it by ואתפלג — “he separated himself” from the rest of the community in order to maintain dissension. Similar is, (Job 15:12) “Why doth thy heart take thee aside (יקחך)”, meaning, it takes you aside to separate you from other people (Midrash Tanchuma, Korach 2). — Another explanation of ויקח קרח is: he attracted (won over) the chiefs of the Sanhedrin amongst them (the people) by fine words. The word is used here in a figurative sense just as in. (Leviticus 8:2) “Take (קח) Aaron”; (Hosea 14:3) “Take (קחו) words with you” (Midrash Tanchuma, Korach 1).<br><br>בן יצהר בן קהת בן לוי [KORAH] THE SON OF IZHAR, THE SON OF KOHATH, THE SON OF LEVI — It does not, however, make mention of Levi being “the son of Jacob”, because he (Jacob) offered prayer for himself that his name should not be mentioned in connection with their (the Korahites') quarrels, as it is said, (Genesis 49:6) “with their assembly, my glory. be thou not united”. And where is his name mentioned in connection with Korah? In the passage in Chronicles where their (the Korahites’) genealogy is traced in connection with the “Duchan” (properly the platform — the place on which the Levites were stationed for the service of song in the Temple), as it is said, (I Chronicles 6:22—23) “the son of Ebiasaph, the son of Korah, the son of Izhar, the son of Kohath, the son of Levi, the son of Israel” (Midrash Tanchuma, Korach 4).<br><br>ודתן ואבירם AND DATHAN AND ABIRAM — Because the tribe of Reuben had their place, when they encamped, in the South, thus being neighbours of Kohath and his sons, who, too, encamped in the South (cf. Numbers 3:29), they (the Reubenites) joined Korah in his quarrel. “Woe to the wicked, woe to his neighbour!” — And what induced Korah to quarrel with Moses? He was envious of the princely dignity held by Elzaphan the son of Uziel (Midrash Tanchuma, Korach 1) whom Moses had appointed prince over the sons of Kohath although this was by the express command of God (Numbers 3:30). Korah argued thus: “My father and his brothers were four in number — as it is said, (Exodus 6:18) “and the sons of Kohath were [Amram and Izhar and Hebron and Uziel]”. — “As to Amram, the eldest, his two sons have themselves assumed high dignity, one as king and the other as High Priest; who is entitled to receive the second (the rank next to it)? Is it not “I” who am the son of Izhar, who was the second to Amram amongst the brothers? And yet he has appointed as prince the son of his (Amram’s) brother who was the youngest of all of them! I hereby protest against him and will undo his decision”. — What did he do? He arose and assembled 250 men, fitted to be heads of the Sanhedrin, most of them of the tribe of Reuben who were his neighbours, viz., Elizur the son of Shedeur, (the prince of the tribe of Reuben; cf. Numbers 1:5), and his colleagues, and others of a similar standing, — for here it states (v. 2) that they were “princes of the congregation, those who were called to the assembly (קראי מועד)”, and there (in another passage) it states, (Numbers 1:16) “these were they who were called to the congregation (קרואי העדה)” (amongst whom was also Elizur the son of Shedeur; cf. Numbers 1:5 and Rashi on Numbers 1:16), — and he attired them in robes of pure purple wool. They then came and stood before Moses and said to him, “Is a garment that is entirely of purple subject to the law of Zizith or is it exempt”? He replied to them: “It is subject to that law”. Whereupon they began to jeer at him: “Is this possible? A robe of any different coloured material, one thread of purple attached to it exempts it, and this that is entirely of purple should it not exempt itself (i.e. ipso facto be exempt) from the law of “Zizith”? (Midrash Tanchuma, Korach 2).<br><br>בני ראובן THE SONS OF REUBEN — this describes Dathan and Abiram and On the son of Peleth."}, {"ch": 16, "v": 2, "aliyah": 1, "heb": "וַיָּקֻ֙מוּ֙ לִפְנֵ֣י מֹשֶׁ֔ה וַאֲנָשִׁ֥ים מִבְּנֵֽי־יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּמָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי־שֵֽׁם׃", "onk": "וְקָמוּ לְאַפֵּי משֶׁה וְגֻבְרַיָּא מִבְּנֵי יִשְׂרָאֵל מָאתָן וְחַמְשִׁין רַבְרְבֵי כְנִשְׁתָּא מְעַרְעֵי זְמַן אֱנָשִׁין דִּשְׁמָא:", "onk_en": "They rose up before Moshe with men from Bnei Yisroel [numbering] two hundred and fifty, who were the leaders of the congregation, those who were called to meetings, men of [prominent] name.", "pj": "וְקָמוּ בְּחוּצְפָּא וְאוֹרוּ הִילְכְתָא בְּאַנְפּוֹי דְמשֶׁה עַל עֵיסַק תִּיכְלָא משֶׁה אָמַר אֲנָא שְׁמָעִית מִן פּוּם קוּדְשָׁא יְהֵא שְׁמֵיהּ מְבָרַךְ דְצִיצִיַית יְהוֹן מִן חִיוַור וְחוּטָא חַד דְתִיכְלָא יְהֵי בֵּיהּ קרַח וְחַבְרוֹי עָבָדוּ גוּלְיַין וְצִיצְיַיתְהוֹן כּוּלְהוֹן דְתִיכְלָא מַה דְלָא פַקֵיד יְיָ וּמְסַעֲדִין לְהוֹן גוּבְרַיָא מִבְּנֵי יִשְרָאֵל מָאתָן וְחַמְשִׁין אֲמַרְכְּלֵי כְּנִישְׁתָּא מְעַרְעֵי זְמַן לְמֵיטַל וּלְמֵישְׁרֵי מְפַרְשִׁין בִּשְׁמָהָן", "pj_en": "and rose up boldly, and in the face of Mosheh appointed a (different) observance in the matter of the hyacinth. Mosheh had said, I have heard from the mouth of the Holy One, whose Name be Blessed, that the fringes are to be of white, with one filament of hyacinth; O but Korach and his companions made garments with their fringes altogether of hyacinth, which the Lord had not commanded; and two hundred and fifty men of the sons of Israel, who had been made leaders of the congregation at the time when the journeys and encampments were appointed, by expression of their names, supported him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 3, "aliyah": 1, "heb": "וַיִּֽקָּהֲל֞וּ עַל־מֹשֶׁ֣ה וְעַֽל־אַהֲרֹ֗ן וַיֹּאמְר֣וּ אֲלֵהֶם֮ רַב־לָכֶם֒ כִּ֤י כׇל־הָֽעֵדָה֙ כֻּלָּ֣ם קְדֹשִׁ֔ים וּבְתוֹכָ֖ם יְהֹוָ֑ה וּמַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל־קְהַ֥ל יְהֹוָֽה׃", "onk": "וְאִתְכְּנָשׁוּ עַל משֶׁה וְעַל אַהֲרֹן וַאֲמָרוּ לְהוֹן סַגִּי לְכוֹן אֲרֵי כָל כְּנִשְׁתָּא כֻּלְּהוֹן קַדִּישִׁין וּבֵינֵיהוֹן <b>שַׁרְיָא שְׁכִנְתָּא<\/b> דַיְיָ <b>וּמָא דֵין<\/b> אַתּוּן מִתְרַבְרְבִין עַל קְהָלָא דַיְיָ:", "onk_en": "They gathered against Moshe and Aharon, and they said to them: “You have [taken] too much for yourselves [and] since the entire congregation are all holy and Adonoy is [<b>the Shechinah of Hashem dwells<\/b>] in their midst, why do [<b>what is this that<\/b>] you raise yourselves above the assembly of Adonoy?”", "pj": "וְאִתְכַּנָשׁוּ עַל משֶׁה וְעַל אַהֲרן וַאֲמָרוּ לְהוֹן סַגִי לְכוֹן רַבָּנוּתָא אֲרוּם כָּל כְּנִישְׁתָּא כּוּלְהוֹן קַדִישִׁין וּבֵינֵיהוֹן שַׁרְיָא שְׁכִינְתָּא דַיְיָ וּמַה דֵין אַתּוּן מִתְרַבְרְבִין עַל קְהָלָא דַיְיָ", "pj_en": "And they gathered together against Mosheh and Aharon, and said to them: Let the authority you have (hitherto had) suffice you, for all the congregation are holy, and the Lord's Shekinah dwelleth among them; and why should you be magnified over the church of the Lord?", "tj": "", "tj_en": "", "rashi": "<b>רב לכם.<\/b> הַרְבֵּה יוֹתֵר מִדַּאי לְקַחְתֶּם לְעַצְמְכֶם גְּדֻלָּה:<br><br><b>כלם קדשים.<\/b> כֻּלָּם שָׁמְעוּ דְבָרִים בְּסִינַי מִפִּי הַגְּבוּרָה:<br><br><b>ומדוע תתנשאו.<\/b> אִם לָקַחְתָּ אַתָּה מַלְכוּת, לֹא הָיָה לְךָ לִבְרֹר לְאָחִיךָ כְּהֻנָּה, לֹא אַתֶּם לְבַדְּכֶם שְׁמַעְתֶּם בְּסִינַי \"אָנֹכִי ה' אֱלֹהֶיךָ\", כָּל הָעֵדָה שָׁמְעוּ (שם):", "rashi_en": "רב לכם You TAKE TOO MUCH UPON YOU — i.e. much more than is proper have you taken for yourselves in the way of high Office.<br><br>כלם קדשים [FOR] ALL [THE CONGREGATION] ARE HOLY — they all heard the utterances on Sinai from the mouth of the Almighty (Midrash Tanchuma, Korach 4).<br><br>ומדוע תתנשאו WHY THEN LIFT YE UP YOURSELVES [ABOVE THE ASSEMBLY OF THE LORD] — “If you have taken royal rank for yourself, you should at least not have chosen the priesthood for your brother — it is not you alone who have heard at Sinai: ‘I am the Lord thy God', all the congregation heard it!” (Midrash Tanchuma, Korach 4)."}, {"ch": 16, "v": 4, "aliyah": 1, "heb": "וַיִּשְׁמַ֣ע מֹשֶׁ֔ה וַיִּפֹּ֖ל עַל־פָּנָֽיו׃", "onk": "וּשְׁמַע משֶׁה וּנְפַל עַל אַפּוֹהִי:", "onk_en": "Moshe heard, and he fell upon his face.", "pj": "וּשְׁמַע משֶׁה הֵיךְ קַנְיַין כָּל חַד מִנְהוֹן יַת אִנְתְּתֵיהּ לְאַשְׁקָיוּתְהֶן מַיָא בְּדוֹקַיָא מְטוֹל משֶׁה וּנְפַל עַל אַנְפּוֹי מִן כִּיסוּפָא", "pj_en": "And Mosheh heard, as if every one of them was jealous of his wife, and would have them drink of the trial-water on account of Mosheh; and he fell on his face for shame.", "tj": "", "tj_en": "", "rashi": "<b>ויפל על פניו.<\/b> מִפְּנֵי הַמַּחֲלֹקֶת, שֶׁכְּבָר זֶה בְיָדָם סִרְחוֹן רְבִיעִי, חָטְאוּ בָעֵגֶל, \"וַיְחַל מֹשֶׁה\" (שמות ל\"ב), בַּמִּתְאוֹנְנִים, \"וַיִּתְפַּלֵּל מֹשֶׁה\" (במדבר י\"א), בַּמְּרַגְּלִים, \"וַיֹּאמֶר מֹשֶׁה אֶל ה' וְשָׁמְעוּ מִצְרַיִם\" (שם י\"ד), בְּמַחֲלָקְתּוֹ שֶׁל קֹרַח נִתְרַשְּׁלוּ יָדָיו, מָשָׁל לְבֶן מֶלֶךְ שֶׁסָּרַח עַל אָבִיו, וּפִיֵּס עָלָיו אוֹהֲבוֹ פַּעַם וּשְׁתַּיִם וְשָׁלֹשׁ, כְּשֶׁסָּרַח רְבִיעִית, נִתְרַשְּׁלוּ יְדֵי הָאוֹהֵב הַהוּא, אָמַר עַד מָתַי אַטְרִיחַ עַל הַמֶּלֶךְ? שֶׁמָּא לֹא יְקַבֵּל עוֹד מִמֶּנִּי (תנחומא):", "rashi_en": "ויפל על פניו [AND WHEN MOSES HEARD IT,] HE FELL UPON HIS FACE because of the rebellion, for this was already the fourth offence on their part: when they sinned by worshipping the Golden Calf, it states, (Exodus 32:11) \"And Moses besought [the Lord]”; in the case of the “people who complained”, (Numbers 11:1) it states: “and Moses prayed”; at the incident of the “spies”, (Numbers 14:13) “And Moses said unto the Lord, ‘When the Egyptians shall hear it ... [and now I beseech Thee etc.]”; but now at the rebellion of Korah, his hands sank down (he felt himself powerless) A parable! This may be compared to the case of a prince who sinned against his father and for whom his (the father’s) friend gained forgiveness once, twice, three times. When he offended for the fourth time the friend felt himself powerless, for he said, “ How long can I trouble the king? Perhaps he will not again accept advocacy from me!” (Midrash Tanchuma, Korach 4)."}, {"ch": 16, "v": 5, "aliyah": 1, "heb": "וַיְדַבֵּ֨ר אֶל־קֹ֜רַח וְאֶֽל־כׇּל־עֲדָתוֹ֮ לֵאמֹר֒ בֹּ֠קֶר וְיֹדַ֨ע יְהֹוָ֧ה אֶת־אֲשֶׁר־ל֛וֹ וְאֶת־הַקָּד֖וֹשׁ וְהִקְרִ֣יב אֵלָ֑יו וְאֵ֛ת אֲשֶׁ֥ר יִבְחַר־בּ֖וֹ יַקְרִ֥יב אֵלָֽיו׃", "onk": "וּמַלִּיל עִם קֹרַח וְעִם כָּל כְּנִשְׁתֵּיהּ לְמֵימַר בְּצַפְרָא וִיהוֹדַע יְיָ יָת <b>דְּכָשַׁר<\/b> לֵיהּ וְיָת דְּקַדִּישׁ וִיקָרֵב לָקֳדָמוֹהִי וְיָת דִּי יִתְרְעֵי בֵיהּ יְקָרֵב <b>לְשִׁמּוּשֵׁיהּ<\/b>:", "onk_en": "He spoke to Korach and to his entire congregation, saying: “[In the] morning, Adonoy will make known who is [<b>qualified to be<\/b>] His, and who is holy, He will bring close to Him; and whoever He chooses, He will bring near to Him [<b>to His service<\/b>].", "pj": "וּמַלֵיל עִם קרַח וְעִם כְּנִישַׁת סַעֲדוֹי לְמֵימָר צַפְרָא וִיהוֹדַע יְיָ יַת דְכָשַׁר לֵיהּ וְיַת דְקַדִישׁ וְיִקְרַב לְפוּלְחָנֵיהּ וְיַת דְיִתְרְעֵי בֵיהּ יִקְרַב לְשַׁמוּשֵׁיהּ", "pj_en": "And he spake with Korach and all the company who supported him, saying: In the morning the Lord will make known him whom He hath approved, and hath consecrated to approach unto His service, and who it hath pleased Him should come nigh in ministering, unto Him.", "tj": "", "tj_en": "", "rashi": "<b>בקר וידע וגו'.<\/b> עַתָּה עֵת שִׁכְרוּת הוּא לָנוּ וְלֹא נָכוֹן לְהֵרָאוֹת לְפָנָיו, וְהוּא הָיָה מִתְכַּוֵּן לִדְחוֹת שֶׁמָּא יַחְזְרוּ בָהֶם (שם):<br><br><b>בקר וידע ה' את אשר לו.<\/b> לַעֲבוֹדַת לְוִיָּה:<br><br><b>ואת הקדוש.<\/b> לִכְהֻנָּה:<br><br><b>והקריב.<\/b> אוֹתָם <b>אליו;<\/b> וְהַתַּרְגּוּם מוֹכִיחַ כֵּן \"וִיקָרֵב לָקֳדָמוֹהִי\", \"יְקָרֵב לְשִׁמּוּשֵׁיהּ\"; וּמִ\"אַ <b>בקר<\/b>, אָ\"ל מֹשֶׁה, גְּבוּלוֹת חָלַק הַקָּבָּ\"ה בְּעוֹלָמוֹ, יְכוֹלִים אַתֶּם לַהֲפֹךְ בֹּקֶר לְעֶרֶב? כֵּן תּוּכְלוּ לְבַטֵּל אֶת זוֹ שֶׁנֶּאֱמַר \"וַיְהִי עֶרֶב וַיְהִי בֹקֶר וַיַּבְדֵּל\" (בראשית א'), כָּךְ \"וַיִּבָּדֵל אַהֲרֹן לְהַקְדִּישׁוֹ\" וְגוֹ' (דהי\"א כ\"ג):", "rashi_en": "בקר וידע וגו׳ TOMORROW THE LORD WILL MAKE KNOWN [WHO ARE HIS] — “Now (this hour of the day)” — he meant — “is a time of excessive drinking, and it is therefore not proper to appear before Him”. But his real intention in postponing the matter was that perhaps they might repent (abandon their opposition) (Midrash Tanchuma, Korach 5).<br><br>'בקר וידע ה את אשר לו TOMORROW THE LORD WILL MAKE KNOWN WHO ARE TO BE HIS for the Levitical service,<br><br>ואת הקדוש AND HIM WHO IS HOLY enough for the priesthood,<br><br>והקריב AND HE WILL BRING them אליו UNTO HIM. The Targum proves that this is so (i.e. that Scripture alludes to two different matters), for it renders the first phrase by “He will bring near to Him”, and the second by “He will bring near to His service”. — A Midrashic explanation of the word בקר (instead of the more usual מחר) is the following: Moses said to him (Korah): “The Holy One, blessed be He, has assigned bounds in His world; can you, perhaps, change the morning into evening? Just as little, will you be able to make this (Aaron’s appointment as High Priest) of none effect, — as indeed it states, (Genesis 1:5) “and it was evening and it was morning… (Genesis 1:4) “and God separated (ויבדל) [light from darkness]”; and in the same sense (that the separation should be of a permanent character) it states, (I Chronicles 23:13) “and Aaron was separated (ויבדל) that he should be sanctified [as most holy … to minister unto him]” (Midrash Tanchuma, Korach 5)."}, {"ch": 16, "v": 6, "aliyah": 1, "heb": "זֹ֖את עֲשׂ֑וּ קְחוּ־לָכֶ֣ם מַחְתּ֔וֹת קֹ֖רַח וְכׇל־עֲדָתֽוֹ׃", "onk": "דָּא עִבִידוּ סָבוּ לְכוֹן מַחְתְּיָן קֹרַח וְכָל כְּנִשְׁתֵּיהּ:", "onk_en": "Do this: Take, for yourselves, fire pans, Korach and his entire congregation,", "pj": "דָא עִיבִידוּ סָבוּ לְכוֹן מַחְתְּיַין קרַח וְכָל כְּנִישַׁת סַעֲדוֹי", "pj_en": "Do this: Let Korach and all the company of his helpers take censers,", "tj": "", "tj_en": "", "rashi": "<b>זאת עשו קחו לכם מחתות.<\/b> מָה רָאָה לוֹמַר לָהֶם כָּךְ? אָמַר לָהֶם, בְּדַרְכֵי הַגּוֹיִם יֵשׁ נִימוּסִים הַרְבֵּה וְכוּמָרִים הַרְבֵּה וְכֻלָם (אֵין) מִתְקַבְּצִים בְּבַיִת אֶחָד, אָנוּ אֵין לָנוּ אֶלָּא ה' אֶחָד, אָרוֹן אֶחָד, וְתוֹרָה אַחַת וּמִזְבֵּחַ אֶחָד וְכֹהֵן גָּדוֹל אֶחָד, וְאַתֶּם ר\"ן אִישׁ מְבַקְּשִׁים כְּהֻנָּה גְדוֹלָה, אַף אֲנִי רוֹצֶה בְכָךְ, הֵא לָכֶם תַּשְׁמִישׁ חָבִיב מִכֹּל, הִיא הַקְּטֹרֶת הַחֲבִיבָה מִכָּל הַקָּרְבָּנוֹת, וְסַם הַמָּוֶת נִתַּן בְּתוֹכוֹ, שֶׁבּוֹ נִשְׂרְפוּ נָדָב וַאֲבִיהוּ, לְפִיכָךְ הִתְרָה בָהֶם <b>והיה האיש אשר יבחר ה' הוא הקדש<\/b> — כְּבָר הוּא בִקְדֻשָּׁתוֹ, וְכִי אֵין אָנוּ יוֹדְעִים שֶׁמִּי שֶׁיִּבְחַר הוּא הַקָּדוֹשׁ? אֶלָּא אָמַר לָהֶם מֹשֶׁה, הֲרֵינִי אוֹמֵר לָכֶם, שֶׁלֹּא תִּתְחַיְּבוּ, מִי שֶׁיִּבְחַר בוֹ יֵצֵא חַי וְכֻלְּכֶם אוֹבְדִין (תנחומא):<br><br><b>מחתות.<\/b> כֵּלִים שֶׁחוֹתִין בָּהֶם גֶּחָלִים וְיֵשׁ לָהֶם בֵּית יָד:", "rashi_en": "זאת עשו קחו לכם מחתות THIS DO: TAKE YOU CENSERS — What reason had he to speak to them thus? He said to them: according to the custom of the heathens there are numerous forms of divine worship, and consequently numerous priests, for they cannot assemble for worship in one temple; we, however, have One God, one Ark, one Law, one Altar, all constituting one form of worship and therefore we need but one High Priest; — and you, 250 men, all demand the High Priesthood?! I would like this myself, but events will prove that this is impossible. Here you have a rite which is dear to God more than any other — it is the offering of incense, which is even dearer to Him than all the sacrifices, but a deadly poison is contained in it, for through it Nadab and Abihu were burnt!” (cf. Leviticus 10:2). It was on this account that he warned them by saying, And it shall come to pass that the man whom the Lord will choose is the holy one — he is already in his state of holiness (not “he will become holy”; he thus warned them that there was not the slightest likelihood that they would be chosen). This must be the meaning of הוא הקדוש, not \"he will become holy”, for do we not know that he whom He would choose would become holy? But this, in effect, is what Moses said to them: “I am telling you this in order that you may not imperil your lives, for only he whom He will choose will come out of this alive, but all of you will perish”  (Midrash Tanchuma, Korach 5).<br><br>מחתות CENSERS — vessels into which coals are raked and which have a handle (cf. Rashi on Exodus 27:3)."}, {"ch": 16, "v": 7, "aliyah": 1, "heb": "וּתְנ֣וּ בָהֵ֣ן&thinsp;<small>׀<\/small>&thinsp;אֵ֡שׁ וְשִׂ֩ימוּ֩ עֲלֵיהֶ֨ן&thinsp;<small>׀<\/small>&thinsp;קְטֹ֜רֶת לִפְנֵ֤י יְהֹוָה֙ מָחָ֔ר וְהָיָ֗ה הָאִ֛ישׁ אֲשֶׁר־יִבְחַ֥ר יְהֹוָ֖ה ה֣וּא הַקָּד֑וֹשׁ רַב־לָכֶ֖ם בְּנֵ֥י לֵוִֽי׃", "onk": "וְהָבוּ בְהוֹן אֶשָּׁתָא וְשַׁוִּיוּ עֲלֵיהוֹן קְטוֹרֶת <b>בּוּסְמִין<\/b> קֳדָם יְיָ מְחַר וִיהֵי גַּבְרָא דְּיִתְרְעֵי יְיָ הוּא קַדִּישׁ סַגִּי לְכוֹן בְּנֵי לֵוִי:", "onk_en": "and place fire in them and put [<b>fragrant<\/b>] incense upon them before Adonoy, tomorrow; and it will be that the man who will be chosen by Adonoy, he is the holy one; [you have taken] too much upon yourselves, sons of Levi.”", "pj": "וְהָבוּ בְהוֹן אֵישָׁתָא וְשַׁווּ עֲלֵיהוֹן קְטוֹרֶת בּוּסְמִין קֳדָם יְיָ מְחַר וִיהֵי גַבְרָא דְיִתְרְעֵי בֵיהּ יְיָ הוּא דְקָדִישׁ סַגִי לְכוֹן בְּנֵי לֵוִי", "pj_en": "put fire in them, and lay incense upon them before the Lord, tomorrow; and the man whom the Lord shall make known, he it is who is consecrated. Let it suffice to you, sons of Levi.", "tj": "", "tj_en": "", "rashi": "<b>רב לכם בני לוי.<\/b> דָּבָר גָּדוֹל אָמַרְתִּי לָכֶם; וְלֹא טִפְּשִׁים הָיוּ, שֶׁכָּךְ הִתְרָה בָהֶם וְקִבְּלוּ עֲלֵיהֶם לְקָרֵב? הֵם חָטְאוּ עַל נַפְשׁוֹתָם, שֶׁנֶּאֱמַר \"אֵת מַחְתּוֹת הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם\" (במדבר י״ז:ג׳), וְקֹרַח שֶׁפִּקֵּחַ הָיָה מָה רָאָה לִשְׁטוּת זֶה? עֵינוֹ הִטְעַתּוּ, רָאָה שַׁלְשֶׁלֶת גְּדוֹלָה יוֹצְאָה מִמֶּנּוּ — שְׁמוּאֵל שֶׁשָּׁקוּל כְּנֶגֶד מֹשֶׁה וְאַהֲרֹן — אָמַר בִּשְׁבִילוֹ אֲנִי נִמְלָט, וְכ\"ד מִשְׁמָרוֹת עוֹמְדוֹת לִבְנֵי בָנָיו, כֻּלָּם מִתְנַבְּאִים בְּרוּחַ הַקֹּדֶשׁ, שֶׁנֶּאֱמַר \"כָּל אֵלֶּה בָנִים לְהֵימָן\" (דברי הימים א כ\"ה ה'), אָמַר אֶפְשָׁר כָּל הַגְּדֻלָּה הַזֹּאת עֲתִידָה לַעֲמֹד מִמֶּנִּי וַאֲנִי אֶדּוֹם? לְכָךְ נִשְׁתַּתֵּף לָבֹא לְאוֹתָהּ חֲזָקָה, שֶׁשָּׁמַע מִפִּי מֹשֶׁה שֶׁכֻּלָּם אוֹבְדִים וְאֶחָד נִמְלָט, \"אֲשֶׁר יִבְחַר ה' הוּא הַקָּדוֹשׁ\" — טָעָה וְתָלָה בְעַצְמוֹ, וְלֹא רָאָה יָפֶה, לְפִי שֶׁבָּנָיו עָשׂוּ תְשׁוּבָה, וּמֹשֶׁה הָיָה רוֹאֶה. — תַּנְחוּמָא:<br><br><b>רב לכם.<\/b> דָּבָר גָּדוֹל נְטַלְתֶּם בְּעַצְמְכֶם לַחֲלֹק עַל הַקָּבָּ\"ה:", "rashi_en": "רב לכם בני לוי means, “It is a great (an important) thing that I have told you, ye sons of Levi”). But were they not fools in that although he so sternly warned them they nevertheless undertook to offer! They, however, sinned against their own souls (i.e., they were regardless of their lives) as it is said, (17:3) “the censers of these sinners against their souls”. — But Korah who certainly was a clever (lit., open-eyed) man, what reason had he to commit this folly? His mind’s eye misled him. He saw by prophetic vision a line of great men (more lit., a great chain) descending from him, amongst them the prophet Samuel who was equal in importance to Moses and Aaron together (cf. Psalms 99:6: משה ואהרן בכהניו ושמואל בקראי שמו), and he said to himself, “On his account I shall escape the punishment”. And he further saw twenty-four Mishmars (shifts of Levites who formed the Temple Choir) arising among his grand-children, all of them prophesying by the Holy Spirit, — as it is said, (I Chronicles 25:5) “All these (prominent musicians) were sons of Heiman” (Heiman was a descendant of Korah; cf. I Chronicles 6:18—23). — He said, “Is it possible that all this dignity is to arise from me and I shall remain silent (be myself of no importance)?” On this account he joined the others in order to attain to that prerogative, because he had indeed heard from the mouth of Moses that all else of them would perish and one would escape: \"He whom the Lord will choose will be holy\". He mistakenly applied this to himself. But he had not seen correctly, for his sons repented of their rebellious attitude and therefore did not die at that time (cf. Numbers 26:11), and it was from them that Samuel and the Levitical singers were descended. Moses, however, foresaw this. (Midrash Tanchuma, Korach 5).<br><br>רב לכם means, a great responsibility have you taken upon yourselves in rebelling against the Holy One, blessed be He."}, {"ch": 16, "v": 8, "aliyah": 1, "heb": "וַיֹּ֥אמֶר מֹשֶׁ֖ה אֶל־קֹ֑רַח שִׁמְעוּ־נָ֖א בְּנֵ֥י לֵוִֽי׃", "onk": "וַאֲמַר משֶׁה לְקֹרַח שְׁמָעוּ כְעַן בְּנֵי לֵוִי:", "onk_en": "Moshe said to Korach, “Please listen sons of Levi,", "pj": "וַאֲמַר משֶׁה לְקרַח וְלִגְנִיסָתֵיהּ קַבִּילוּ כְעַן בְּנֵי לֵוִי", "pj_en": "And Mosheh said to Korach and his kindred: Hear now, ye sons of Levi:", "tj": "", "tj_en": "", "rashi": "<b>ויאמר משה אל קרח שמעו נא בני לוי.<\/b> הִתְחִיל לְדַבֵּר עִמּוֹ בִּדְבָרִים רַכִּים, כֵּיוָן שֶׁרָאָהוּ קְשֵׁה עֹרֶף, אָמַר עַד שֶׁלֹּא יִשְׁתַּתְּפוּ שְׁאָר הַשְּׁבָטִים וְיֹאבְדוּ עִמּוֹ, אֲדַבֵּר גַּם אֶל כֻּלָּם, הִתְחִיל לְזָרֵז בָּהֶם \"שִׁמְעוּ נָא בְּנֵי לֵוִי\" (תנחומא):", "rashi_en": "ויאמר משה אל קרח שמעו נא בני לוי AND MOSES SAID UNTO KORAH, HEAR, I PRAY YOU, YE SONS OF LEVI — He began to speak to him with gentle words; when, however, he saw that he was stubborn, he said to himself: Before the other tribes join him and perish together with him, I will speak to them all!” He thereupon began to admonish them: “Hear ye, ye sons of Levi!” (Midrash Tanchuma, Korach 6)."}, {"ch": 16, "v": 9, "aliyah": 1, "heb": "הַמְעַ֣ט מִכֶּ֗ם כִּֽי־הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְכֶם֙ מֵעֲדַ֣ת יִשְׂרָאֵ֔ל לְהַקְרִ֥יב אֶתְכֶ֖ם אֵלָ֑יו לַעֲבֹ֗ד אֶת־עֲבֹדַת֙ מִשְׁכַּ֣ן יְהֹוָ֔ה וְלַעֲמֹ֛ד לִפְנֵ֥י הָעֵדָ֖ה לְשָׁרְתָֽם׃", "onk": "הַזְּעֵר לְכוֹן אֲרֵי אַפְרֵשׁ אֱלָהָא דְיִשְׂרָאֵל יָתְכוֹן מִכְּנִשְׁתָּא דְיִשְׂרָאֵל לְקָרָבָא יָתְכוֹן <b>קֳדָמוֹהִי<\/b> לְמִפְלַח יָת פָּלְחַן מַשְׁכְּנָא דַיְיָ וּלְמֵקַם קֳדָם כְּנִשְׁתָּא לְשַׁמָּשׁוּתְהוֹן:", "onk_en": "is it but a pittance for yourselves that the God of Israel has separated you from the [rest of the] congregation of Israel to bring you closer to [<b>before<\/b>] Him to perform the services of the <i>Mishkan<\/i> of Adonoy, and to stand before the congregation to serve them?", "pj": "הַזְעֵירָא הִיא לְכוֹן אֲרוּם אַפְרֵישׁ אֱלָהָא דְיִשְרָאֵל יַתְכוֹן מִן כְּנִישְׁתָּא דְיִשְרָאֵל לְקָרָבָא יַתְכוֹן לְשִׁימוּשֵׁיהּ לְמִפְלַח יַת פּוּלְחַן מַשְׁכְּנָא דַיְיָ וּלְמֵיקוּם קֳדָם כְּנִישְׁתָּא לְשַׁמְשׁוּתְהוֹן", "pj_en": "Is it too little For you that the God of Israel hath set you apart from the congregation of Israel to draw near to do His service to fulfil the ministry of the Lord's tabernacle, and to stand before the congregation to minister to them?", "tj": "", "tj_en": "", "rashi": "<b>ולעמד לפני העדה.<\/b> לָשִׁיר עַל הַדּוּכָן:", "rashi_en": "ולעמד לפני העדה AND TO STAND BEFORE THE CONGREGATION to sing on the Duchan (the Platform)."}, {"ch": 16, "v": 10, "aliyah": 1, "heb": "וַיַּקְרֵב֙ אֹֽתְךָ֔ וְאֶת־כׇּל־אַחֶ֥יךָ בְנֵי־לֵוִ֖י אִתָּ֑ךְ וּבִקַּשְׁתֶּ֖ם גַּם־כְּהֻנָּֽה׃", "onk": "וְקָרֵב יָתָךְ וְיָת כָּל אַחָיךְ בְּנֵי לֵוִי עִמָּךְ <b>וּכְעַן<\/b> אַתּוּן בָּעָן אַף <b>כְּהֻנָּתָא רַבְּתָא<\/b>:", "onk_en": "He brought you near with all of your brethren the sons of Levi with you, and yet [<b>now<\/b>] you ask to be <i>kohanim<\/i> [<b>Kohein Gadol<\/b>] as well?", "pj": "וְקָרֵיב יָתָךְ וְיַת כָּל אָחָךְ בְּנֵי לֵוִי עִמָךְ וּכְדוּן אַתּוּן תַּבְעִין אוּף כְּהוּנְתָּא רַבְּתָא", "pj_en": "But so hath he brought nigh thee and all the sons of Levi with thee and now do ye demand the high-priesthood also?", "tj": "", "tj_en": "", "rashi": "<b>ויקרב אתך.<\/b> לְאוֹתוֹ שֵׁרוּת שֶׁהִרְחִיק מִמֶּנּוּ שְׁאָר עֲדַת יִשְֹרָאֵל:", "rashi_en": "ויקרב אתך AND HE HATH BROUGHT THEE NEAR to that service from which He has excluded the rest of the congregation of Israel."}, {"ch": 16, "v": 11, "aliyah": 1, "heb": "לָכֵ֗ן אַתָּה֙ וְכׇל־עֲדָ֣תְךָ֔ הַנֹּעָדִ֖ים עַל־יְהֹוָ֑ה וְאַהֲרֹ֣ן מַה־ה֔וּא כִּ֥י <span class=\"mam-kq\"><span class=\"mam-kq-k\">(תלונו)<\/span> <span class=\"mam-kq-q\">[תַלִּ֖ינוּ]<\/span><\/span> עָלָֽיו׃", "onk": "בְּכֵן אַתְּ וְכָל כְּנִשְׁתָּךְ דְּאִזְדַּמִּנְתּוּן עַל יְיָ וְאַהֲרֹן מָה הוּא אֲרֵי אִתְרַעַמְתּוּן עֲלוֹהִי:", "onk_en": "Therefore, you and your entire congregation who are gathered against Adonoy; and what is Aharon that you rail against him?”", "pj": "בְּגִין כֵּן אַנְתְּ וְכָל כְּנִישַׁת סַעֲדָךְ דְאִזְדַמַנְתּוּן עַל מֵימְרָא דַיְיָ וְאַהֲרן מַה הוּא אֲרוּם מִתְרַעֲמִין אַתּוּן עֲלוֹי", "pj_en": "Therefore art thou and all the company of thy helpers gathered together against the Word of the Lord: and Aharon, what is he, that you murmur against him?", "tj": "", "tj_en": "", "rashi": "<b>לכן.<\/b> בִּשְׁבִיל כָּךְ <b>אתה וכל עדתך הנעדים<\/b> אִתְּךָ עַל ה', כִּי בְשְׁלִיחוּתוֹ עָשִׂיתִי לָתֵת כְּהֻנָּה לְאַהֲרֹן, וְלֹא לָנוּ הוּא הַמַּחֲלֹקֶת הַזֶּה (שם):", "rashi_en": "לכן means because of this — because of all this that I have mentioned, אתה וכל עדתך הנועדים BOTH YOU AND ALL YOUR CONGREGATION WHO ARE GATHERED with you, על ה׳ are AGAINST THE LORD, for it is by His commission that I am acting in giving the Priesthood to Aaron; and this rebellion is therefore not against “us” (Midrash Tanchuma, Korach 6)."}, {"ch": 16, "v": 12, "aliyah": 1, "heb": "וַיִּשְׁלַ֣ח מֹשֶׁ֔ה לִקְרֹ֛א לְדָתָ֥ן וְלַאֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַיֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃", "onk": "וּשְׁלַח משֶׁה לְמִקְרֵי לְדָתָן וְלַאֲבִירָם בְּנֵי אֱלִיאָב וַאֲמָרוּ לָא נִסָּק:", "onk_en": "Moshe sent to call for Dasan and Avirom the sons of Eliav and they said “We will not go up.", "pj": "וְשָׁדַר משֶׁה פּוּלִין לְזַמָנָא לְבֵי דִינָא רַבָּא לְדָתָן וְלַאֲבִירָם בְּנֵי אֱלִיאָב וַאֲמָרוּ לָא נֵיסוֹק", "pj_en": "And Mosheh sent men to summon Dathan and Abiram, the sons of Eliab, to the house of the great judgment; but they said, We will not come up.", "tj": "", "tj_en": "", "rashi": "<b>וישלח משה וגו'.<\/b> מִכָּאן שֶׁאֵין מַחֲזִיקִין בְּמַחֲלֹקֶת, שֶׁהָיָה מֹשֶׁה מְחַזֵּר אַחֲרֵיהֶם לְהַשְׁלִימָם בְּדִבְרֵי שָׁלוֹם (סנהדרין ק\"י):<br><br><b>לא נעלה.<\/b> פִּיהֶם הִכְשִׁילָם, שֶׁאֵין לָהֶם אֶלָּא יְרִידָה:", "rashi_en": "וישלח משה וגו׳ AND MOSES SENT [TO CALL DATHAN AND ABIRAM] — From here we may learn that one should not persist in strife (Midrash Tanchuma, Korach 10), for, you see, Moses sought them out in order to conciliate them by peaceful words (Sanhedrin 110a).<br><br>לא נעלה WE WILL NOT GO UP — Their mouth tripped them up (i.e. unwittingly they made mention of their fate) — that they would have only a “descent” (their words are taken to mean: we shall not be going up; we shall go down into the depths of the earth) (Midrash Tanchuma, Korach 6)."}, {"ch": 16, "v": 13, "aliyah": 1, "heb": "הַמְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֙נוּ֙ מֵאֶ֨רֶץ זָבַ֤ת חָלָב֙ וּדְבַ֔שׁ לַהֲמִיתֵ֖נוּ בַּמִּדְבָּ֑ר כִּֽי־תִשְׂתָּרֵ֥ר עָלֵ֖ינוּ גַּם־הִשְׂתָּרֵֽר׃", "onk": "הַזְּעֵר אֲרֵי אַסֶּקְתָּנָא מֵאַרְעָא <b>עָבְדָא<\/b> חֲלַב וּדְבָשׁ לְקַטָּלוּתָנָא בְּמַדְבְּרָא אֲרֵי אִתְרַבְרַבְתְּ עֲלָנָא אַף אִתְרַבְרָבָא:", "onk_en": "Is it but a pittance that you have brought us up from a land flowing with [<b>that produces<\/b>] milk and honey to kill us in the desert, that you must excercise power over us to make yourself powerful as well?", "pj": "הַזְעֵירָא הוּא אֲרוּם אַסֵיקְתָּנָא מִמִצְרַיִם אַרְעָא דְעַבְדָא חֲלַב וּדְבָשׁ לְקַטְלוּתָנָא בְּמַדְבְּרָא אֲרוּם מִתְרַבְרְבַת עֲלָנָא אוּף אִתְרַבְרְבָא", "pj_en": "Is it a little thing, that thou hast brought us from Mizraim, a land that produceth milk and honey, to kill us in the wilderness, that ruling thou mayest domineer over us?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 14, "aliyah": 2, "heb": "אַ֡ף לֹ֣א אֶל־אֶ֩רֶץ֩ זָבַ֨ת חָלָ֤ב וּדְבַשׁ֙ הֲבִ֣יאֹתָ֔נוּ וַתִּ֨תֶּן־לָ֔נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָכָ֑רֶם הַעֵינֵ֞י הָאֲנָשִׁ֥ים הָהֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה׃", "onk": "בְּרַם לָא לְאַרְעָא <b>עָבְדָא<\/b> חֲלַב וּדְבָשׁ אַעַלְתָּנָא וִיהַבְתָּא לָנָא אַחֲסָנַת חַקְלִין וְכַרְמִין הַעֵינֵי גֻּבְרַיָּא הָאִנּוּן תְּשַׁלַּח לְעַוָּרָא לָא נִסָּק:", "onk_en": "Even into a land flowing with [<b>that produces<\/b>] milk and honey you have not brought us, and [not] given us an inheritance of fields and vineyards if you put those people’s eyes out, [even then] we would not go up.”", "pj": "בְּרַם לָא לְאַרְעָא עַבְדָא חֲלַב וּדְבָשׁ אַעַלְתָּנָא וִיהַבְתְּ לָנָא אַחְסָנַת חַקְלִין וְכַרְמִין הַעֵינֵיהוֹן דְגוּבְרַיָא הָאִינוּן דִבְאַרְעָא הַהִיא תְּסַנְוַור וּתְנַצֵחַ יַתְהוֹן לָא נֵיסוֹק לְתַמָן", "pj_en": "Neither hast thou brought us into the land producing milk and honey to give us an inheritance of fields and vineyards. Wilt thou blind the eyes of the men of that land, that thou mayest overcome them? We shall not go up thither.", "tj": "", "tj_en": "", "rashi": "<b>ותתן לנו.<\/b> הַדָּבָר מוּסָב עַל \"לֹא\" הָאָמוּר לְמַעְלָה, כְּלוֹמַר לֹא הֲבִיאוֹתָנוּ וְלֹא נָתַתָּ לָנוּ נַחֲלַת שָֹדֶה וָכֶרֶם; אָמַרְתָּ לָנוּ \"אַעֲלֶה אֶתְכֶם מֵעֳנִי מִצְרַיִם אֶל אֶרֶץ טוֹבָה\" וְגוֹ' (שמות ג'), מִשָּׁם הוֹצֵאתָנוּ, וְלֹא אֶל אֶרֶץ זָבָת חָלָב וּדְבַשׁ הֲבִיאֹתָנוּ, אֶלָּא גָּזַרְתָּ עָלֵינוּ לַהֲמִיתֵנוּ בַּמִּדְבָּר, שֶׁאָמַרְתָּ לָנוּ \"בַּמִּדְבָּר הַזֶּה יִפְּלוּ פִגְרֵיכֶם\" (במדבר י\"ד):<br><br><b>העיני האנשים ההם תנקר וגו'.<\/b> אֲפִלּוּ אַתָּה שׁוֹלֵחַ לְנַקֵּר אֶת עֵינֵינוּ אִם לֹא נַעֲלֶה אֵלֶיךָ, לֹא נַעֲלֶה:<br><br><b>האנשים ההם.<\/b> כְּאָדָם הַתּוֹלֶה קִלְלָתוֹ בַּחֲבֵרוֹ:", "rashi_en": "ותתן לנו (lit., thou hast given us) — The statement must he referred to the word לא, “not”, mentioned before, the meaning being: Thou hast not brought us into a land flowing with milk and honey, and thou hast not given us inheritance of fields and vineyards. — You told us, (Exodus 3:7) “I will bring you up from the affliction of Egypt” into a good land: from there (from such a land; cf. v. 13), indeed, you have brought us forth, but you have not brought us instead into a land flowing with milk and honey; on the contrary — you have passed a decree upon us to kill us in the wilderness, for you have said, (Numbers 14:29) “Your carcasses shall fall in this desert.\" <br><br>העיני האנשים ההם תנקר WILT THOU PUT OUT THE EYES OF THESE MEN etc. — This means: even if you were to send to put out our eyes if we would not come up to you we would not come up!<br><br>האנשים ההם THESE MEN — [They meant themselves, but spoke of other people’s eyes being put out], like a man who attaches to his fellow the curse which should come upon himself (cf. Rashi on Exodus 1:10)."}, {"ch": 16, "v": 15, "aliyah": 2, "heb": "וַיִּ֤חַר לְמֹשֶׁה֙ מְאֹ֔ד וַיֹּ֙אמֶר֙ אֶל־יְהֹוָ֔ה אַל־תֵּ֖פֶן אֶל־מִנְחָתָ֑ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵהֶם֙ נָשָׂ֔אתִי וְלֹ֥א הֲרֵעֹ֖תִי אֶת־אַחַ֥ד מֵהֶֽם׃", "onk": "וּתְקֵף לְמשֶׁה לַחֲדָא וַאֲמַר <b>קֳדָם<\/b> יְיָ לָא <b>תְקַבֵּל בְּרַעֲוָא<\/b> קֻרְבַּנְהוֹן לָא חֲמָרָא דְחַד מִנְּהוֹן שְׁחָרִית וְלָא אַבְאֵשִׁית יָת חַד מִנְּהוֹן:", "onk_en": "Moshe was extremely distressed, and said to [<b>before<\/b>] Adonoy: “Do not turn to [<b>accept<\/b>] their offering [<b>with pleasure<\/b>]; not a donkey did I sequester from any one of them nor have I done ill to any one of them.”", "pj": "וּתְקֵיף לְמשֶׁה לַחֲדָא וַאֲמַר קֳדָם יְיָ בְּבָעוּ מִינָךְ לָא תִסְתַּכֵּל לְדוֹרוֹן דִידְהוֹן דְלָא חַמְרָא דְחַד מִנְהוֹן שְׁחָרִית וְלָא אַבְאָשִׁית לְחַד מִנְהוֹן", "pj_en": "And Mosheh was very wroth, and said before the Lord: I beseech thee, look not upon their offering, the portion of their hands; for not an ass have I taken from one of them, nor to any of them done an injury,", "tj": "וּבְאַשׁ לְמשֶׁה לַחֲדָא וַאֲמַר קֳדָם יְיָ לָא תִסְתַּכֵּל לְדוֹרוֹן דִידְהוֹן לָא חֲמָרָא דְחַד מִנְהוֹן נְסִיבִית וְלָא אַבְאָשִׁית לְחַד מִנְהוֹן:", "tj_en": "And it was very grievous to Mosheh, and he said before the Lord: Regard not the portion of their hands; for not an ass have I taken from one of them, nor to one of them done wrong.", "rashi": "<b>ויחר למשה מאד.<\/b> נִצְטַעֵר עַד לִמְאֹד:<br><br><b>אל תפן אל מנחתם.<\/b> לְפִי פְשׁוּטוֹ הַקְּטֹרֶת שֶׁהֵם מַקְרִיבִין לְפָנֶיךָ מָחָר אַל תֵּפֶן אֲלֵיהֶם; וּמִדְרָשׁוֹ: אָמַר, יוֹדֵעַ אֲנִי שֶׁיֵּשׁ לָהֶם חֵלֶק בִתְמִידֵי צִבּוּר, אַף חֶלְקָם לֹא יְקֻבַּל לְפָנֶיךָ לְרָצוֹן, תַּנִּיחֶנּוּ הָאֵשׁ וְלֹא תֹאכְלֶנּוּ (תנחומא):<br><br><b>לא חמור אחד מהם נשאתי.<\/b> לֹא חֲמוֹרוֹ שֶׁל אֶחָד מֵהֶם נָטַלְתִּי. אֲפִלּוּ כְּשֶׁהָלַכְתִּי מִמִּדְיָן לְמִצְרַיִם וְהִרְכַּבְתִּי אֶת אִשְׁתִּי וְאֶת בָּנַי עַל הַחֲמוֹר, וְהָיָה לִי לִטֹּל אוֹתוֹ הַחֲמוֹר מִשֶּׁלָּהֶם, לֹא נָטַלְתִּי אֶלָּא מִשֶּׁלִּי; וְתַ\"אֻ \"שְׁחָרִית\", לְשׁוֹן אֲרַמִּי כָּךְ נִקְרֵאת אַנְגַּרְיָא שֶׁל מֶלֶךְ \"שַׁחֲוָר\":", "rashi_en": "ויחר למשה מאד AND MOSES WAS VERY DISTRESSED — i.e. he was very much grieved. <br><br>אל תפן אל מנחתם TURN NOT THOU TO THEIR OBLATION — According to its plain sense the meaning is: “In respect to the frankincense which they will offer before Thee tomorrow, I beg of Thee do not turn (pay regard) to them”. The Midrashic explanation is: He said, “I know that they have a portion in the continual offerings of the community; let not even this their portion be accepted favourably before Thee — let the fire leave it alone and not consume it” (Midrash Tanchuma, Korach 7).<br><br>לא חמור אחד מהם נשאתי means, I have not taken the ass of any one of them; — even when I went from Midian to Egypt and placed my wife and my sons on the ass (Exodus 4:20), and I surely ought afterwards to have taken the price of that ass from their money, yet I took it only from my own (Midrash Tanchuma, Korach 7). The translation given by Onkelos of the word נשאתי is שחרית: in the Aramaic language a forced levy made by the king is so called, viz., שחרור (cf. Rashi on Bava Batra 47a. The translation of Onkelos therefore is: I did not press into my service the ass of any one of them)."}, {"ch": 16, "v": 16, "aliyah": 2, "heb": "וַיֹּ֤אמֶר מֹשֶׁה֙ אֶל־קֹ֔רַח אַתָּה֙ וְכׇל־עֲדָ֣תְךָ֔ הֱי֖וּ לִפְנֵ֣י יְהֹוָ֑ה אַתָּ֥ה וָהֵ֛ם וְאַהֲרֹ֖ן מָחָֽר׃", "onk": "וַאֲמַר משֶׁה לְקֹרַח אַתְּ וְכָל כְּנִשְׁתָּךְ הֱווֹ זְמִינִין לָקֳדָם יְיָ אַתְּ וְאִנּוּן וְאַהֲרֹן מְחָר:", "onk_en": "Moshe said to Korach: “You and your entire congregation will be before Adonoy, you, and they, and Aharon, tomorrow.", "pj": "וַאֲמַר משֶׁה לְקרַח אַנְתְּ וְכָל כְּנִישַׁת סַעֲדָךְ הֲווֹ זְמִינִין לְבֵי דִינָא קֳדָם יְיָ אַנְתְּ וְהִינוּן וְאַהֲרן מְחָר", "pj_en": "And Mosheh said to Korach, Thou, and all the company of thy helpers, come together to the house of judgment before the Lord tomorrow, thou, they, and Aharon.", "tj": "", "tj_en": "", "rashi": "<b>והם.<\/b> עֲדָתְךָ:", "rashi_en": "והם [THOU] AND THEY [AND AARON] — they means thy congregation."}, {"ch": 16, "v": 17, "aliyah": 2, "heb": "וּקְח֣וּ&thinsp;<b>׀<\/b> אִ֣ישׁ מַחְתָּת֗וֹ וּנְתַתֶּ֤ם עֲלֵיהֶם֙ קְטֹ֔רֶת וְהִקְרַבְתֶּ֞ם לִפְנֵ֤י יְהֹוָה֙ אִ֣ישׁ מַחְתָּת֔וֹ חֲמִשִּׁ֥ים וּמָאתַ֖יִם מַחְתֹּ֑ת וְאַתָּ֥ה וְאַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽוֹ׃", "onk": "וּסְבוּ גְּבַר מַחְתִּיתֵיהּ וּתְשַׁוּוּן עֲלֵיהוֹן קְטֹרֶת <b>בּוּסְמִין<\/b> וּתְקָרְבוּן קֳדָם יְיָ גְּבַר מַחְתִּיתֵיהּ מָאתָן וְחַמְשִׁין מַחְתְּיָן וְאַתְּ וְאַהֲרֹן גְּבַר מַחְתִּיתֵיהּ:", "onk_en": "Each man will take his firepan and place [<b>fragrant<\/b>] incense in them and you will offer before Adonoy each man his firepan, two hundred and fifty firepans, and you and Aharon will each take his own firepan.”", "pj": "וְסָבוּ גְבַר מַחְתְּיָתֵיהּ וְתִתְּנוּן עֲלֵיהוֹן קְטוֹרֶת בּוּסְמִין וְתִקְרְבוּן קֳדָם יְיָ גְבַר מַחְתְּיָתֵיהּ מָאתָן וְחַמְשִׁין מַחְתְּיַן וְאַנְתְּ וְאַהֲרן גְבַר מַחְתְּיָתֵיהּ", "pj_en": "And take every one his censer, and put incense upon them; and let each offer his censer before the Lord, two hundred and fifty censers; thou also, and Aharon, each man his censer.", "tj": "", "tj_en": "", "rashi": "<b>והקרבתם איש מחתתו.<\/b> הַחֲמִשִּׁים וּמָאתַיִם אִישׁ שֶׁבָּכֶם:", "rashi_en": "והקרבתם איש מחתתו AND OFFER YE [BEFORE THE LORD] EVERY MAN HIS CENSER — “every man” means, the 250 men amongst you."}, {"ch": 16, "v": 18, "aliyah": 2, "heb": "וַיִּקְח֞וּ אִ֣ישׁ מַחְתָּת֗וֹ וַיִּתְּנ֤וּ עֲלֵיהֶם֙ אֵ֔שׁ וַיָּשִׂ֥ימוּ עֲלֵיהֶ֖ם קְטֹ֑רֶת וַֽיַּעַמְד֗וּ פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד וּמֹשֶׁ֥ה וְאַהֲרֹֽן׃", "onk": "וּנְסִיבוּ גְבַר מַחְתִּיתֵיהּ וִיהָבוּ עֲלֵיהוֹן אֶשָּׁתָא וְשַׁוִּיאוּ עֲלֵיהוֹן קְטֹרֶת בּוּסְמִין וְקָמוּ בִּתְרַע מַשְׁכַּן זִמְנָא וּמשֶׁה וְאַהֲרֹן:", "onk_en": "Each man took his firepan and they placed fire in them and they put [<b>fragrant<\/b>] incense in them and they stood at the entrance of the Tent of Meeting along with Moshe and Aharon.", "pj": "וּנְסִיבוּ גְבַר מַחְתְּיָתֵיהּ וִיהָבוּ בְהוֹן אֵישָׁתָא וְשַׁוִיאוּ עֲלֵיהוֹן קְטוֹרֶת בּוּסְמִין וְקָמוּ בִתְרַע מַשְׁכַּן זִמְנָא מִצִיטְרָא חָד וּמשֶׁה וְאַהֲרן מִצִיטְרָא חָד", "pj_en": "And they took every one his censer, and put fire in them and sweet incense with it, and stood at the door of the tabernacle of ordinance on one side; but Mosheh and Aharon on the other side.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 19, "aliyah": 2, "heb": "וַיַּקְהֵ֨ל עֲלֵיהֶ֥ם קֹ֙רַח֙ אֶת־כׇּל־הָ֣עֵדָ֔ה אֶל־פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַיֵּרָ֥א כְבוֹד־יְהֹוָ֖ה אֶל־כׇּל־הָעֵדָֽה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאַכְנַשׁ עֲלֵיהוֹן קֹרַח יָת כָּל כְּנִשְׁתָּא לִתְרַע מַשְׁכַּן זִמְנָא וְאִתְגְּלֵי יְקָרָא דַיְיָ לְכָל כְּנִשְׁתָּא:", "onk_en": "Korach congregated against them, the entire congregation at the entrance of the Tent of Meeting, and the glory of Adonoy appeared to the entire congregation.", "pj": "וּכְנַשׁ עֲלֵיהוֹן קרַח יַת כָּל כְּנִישְׁתָּא לִתְרַע מַשְׁכַּן זִמְנָא וְאִתְנַטַל בְּעוּתְרֵיהּ דְאַשְׁכַּח תְּרֵין אוֹצְרִין מִן אוֹצְרוֹי דְיוֹסֵף מַלְיָין כְּסַף וּדְהַב וּבְעָא לְמִטְרַד בְּהַהוּא עוּתְרָא יַת משֶׁה וְיַת אַהֲרן מִן עַלְמָא אִילוּלֵי דְאִתְגְלֵי אִיקָרָא דַיְיָ לְכָל כְּנִישְׁתָּא", "pj_en": "And Korach gathered to them the whole congregation at the door of the tabernacle. And he had brought forth, from his riches, two treasures which he had found among the treasures of Joseph filled with silver and gold, and sought with them to drive the riches of Mosheh and Aharon out of the world; but the glory of the Lord revealed itself to all the congregation.", "tj": "", "tj_en": "", "rashi": "<b>ויקהל עליהם קרח.<\/b> בְּדִבְרֵי לֵצָנוּת, כָּל הַלַּיְלָה הַהוּא הָלַךְ אֵצֶל הַשְּׁבָטִים וּפִתָּה אוֹתָם — \"כִּסְבוּרִין אַתֶּם שֶׁעָלַי לְבַדִּי אֲנִי מַקְפִּיד? אֵינִי מַקְפִּיד אֶלָּא בִּשְׁבִיל כֻּלְּכֶם, אֵלּוּ בָאִין וְנוֹטְלִין כָּל הַגְּדֻלּוֹת, לוֹ הַמַּלְכוּת וּלְאָחִיו הַכְּהֻנָּה\" עַד שֶׁנִּתְפַּתּוּ כֻלָּם (שם):<br><br><b>וירא כבוד ה'.<\/b> בָּא בְּעַמּוּד עָנָן:", "rashi_en": "ויקהל עליהם קרח AND KORAH CONVENED [ALL THE CONGREGATION] AGAINST THEM, by means of scoffing language: that whole night he went round to all the tribes and tried to win them over: “Do you really think that I care for myself alone? It is only for all of you that I have a care! These men come and occupy every high office: royal rank for himself, for his brother the priesthood!” — until in the end all of them submitted to his persuasion (Midrash Tanchuma, Korach 7).<br><br>וירא כבוד ה׳ AND THE GLORY OF THE LORD APPEARED [UNTO ALL THE CONGREGATION] — He came in a pillar of cloud."}, {"ch": 16, "v": 20, "aliyah": 3, "heb": "וַיְדַבֵּ֣ר יְהֹוָ֔ה אֶל־מֹשֶׁ֥ה וְאֶֽל־אַהֲרֹ֖ן לֵאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה וְעִם אַהֲרֹן לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe and to Aharon, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה וְעִם אַהֲרן לְמֵימָר", "pj_en": "And the Lord spake with Mosheh and Aharon, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 21, "aliyah": 3, "heb": "הִבָּ֣דְל֔וּ מִתּ֖וֹךְ הָעֵדָ֣ה הַזֹּ֑את וַאֲכַלֶּ֥ה אֹתָ֖ם כְּרָֽגַע׃", "onk": "אִתְּפְּרָשׁוּ מִגּוֹ כְּנִשְׁתָּא הָדָא וְאֵשֵׁצֵי יָתְהוֹן כְּשָׁעָה:", "onk_en": "“Separate yourselves from among this congregation, and I will annihalate them in an instant.”", "pj": "אִתְפְּרָשׁוּ מִגוֹ כְּנִישְׁתָּא הֲדָא וְאֵישֵׁיצֵי יַתְהוֹן כְּשָׁעָה זְעֵירָא", "pj_en": "Separate yourselves from among this congregation, that I may destroy them quickly.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 22, "aliyah": 3, "heb": "וַיִּפְּל֤וּ עַל־פְּנֵיהֶם֙ וַיֹּ֣אמְר֔וּ אֵ֕ל אֱלֹהֵ֥י הָרוּחֹ֖ת לְכׇל־בָּשָׂ֑ר הָאִ֤ישׁ אֶחָד֙ יֶחֱטָ֔א וְעַ֥ל כׇּל־הָעֵדָ֖ה תִּקְצֹֽף׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּנְפָלוּ עַל אַפֵּיהוֹן וַאֲמָרוּ אֵל אֱלָהָא רוּחַיָּא לְכָל בִּשְׂרָא גַּבְרָא חַד יֵחוֹב וְעַל כָּל כְּנִשְׁתָּא יְהֵי רוּגְזָא:", "onk_en": "They fell upon their faces, and they said: “Almighty, the God of the spirits of all flesh; if one man sins shall You be angry with the entire congregation?”", "pj": "וְאִתְרְכִינוּ בִּצְלוֹ עַל אַפֵּיהוֹן וַאֲמָרוּ אֵל אֱלָהָא דְשַׁוֵי רוּחַ נִשְׁמָתָא בְּגוּפֵי בְּנֵי נְשָׁא וּמִנֵיהּ מִתְיַהֲבָא רוּחָא לְכָל בִּישְרָא הַאִין גַבְרָא חַד יֵיחוֹב וְעַל כָּל כְּנִישְׁתָּא יְהֵי רוּגְזָא", "pj_en": "But they bowed down upon their faces in prayer, and said: El Eloha, who hast put the spirit of life in the bodies of the children of men, and from whom is given the spirit of all flesh, - if one man hath sinned, wilt Thou be angry with all the congregation", "tj": "וְאִתְרְכִינוּ עַל אַפֵּיהוֹן וַאֲמָרוּ אֱלָהָא דְשַׁלִיט בְּנִשְׁמַת כָּל בִּישְרָא חַד גַבְרָא חָטֵי וְעַל כָּל עַמָא הֲוָה רְגוֹז:", "tj_en": "And they bowed on their faces, and said: O God, who rulest over the spirit of all flesh, if one man hath sinned, wilt Thou be wroth against all the people:", "rashi": "<b>אל אלהי הרוחת.<\/b> יוֹדֵעַ מַחֲשָׁבוֹת; אֵין מִדָּתְךָ כְּמִדַּת בָּשָׂר וָדָם, מֶלֶךְ בָּשָׂר וָדָם שֶׁסָּרְחָה עָלָיו מִקְצָת מְדִינָה, אֵינוֹ יוֹדֵעַ מִי הַחוֹטֵא, לְפִיכָךְ כְּשֶׁהוּא כוֹעֵס נִפְרָע מִכֻּלָּם, אֲבָל אַתָּה, לְפָנֶיךָ גְלוּיוֹת כָּל הַמַּחֲשָׁבוֹת וְיוֹדֵעַ אַתָּה מִי הַחוֹטֵא (שם):<br><br><b>האיש אחד.<\/b> הוּא הַחוֹטֵא וְאַתָּה עַל כָּל הָעֵדָה תִּקְצֹף; אָמַר הַקָּבָּ\"ה, יָפֶה אֲמַרְתֶּם, אֲנִי יוֹדֵעַ וּמוֹדִיעַ מִי חָטָא וּמִי לֹא חָטָא (שם):", "rashi_en": "אל אלהי הרוחות O GOD, THE GOD OF THE SPIRITS [OF ALL FLESH] — i.e., “[O God] who knowest the thoughts of every man”. Thy nature is not like that of human beings: an earthly king against whom part of his country commits an offence, does not know who the sinner is, and therefore when he becomes angry he exacts punishment from all of them. But Thou — before Thee all human thoughts lie open and Thou knowest who is the sinner (Midrash Tanchuma, Korach 7).<br><br>האיש אחד means, THE ONE MAN IS THE SINNER, and  על כל העדה תקצוף YOU ARE ANGRY WITH ALL THE CONGREGATION?! Whereupon the Holy One, blessed be He, replied, “You have spoken well; I know and shall make known who has sinned and who has not sinned” (Midrash Tanchuma, Korach 7)."}, {"ch": 16, "v": 23, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלֵּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying:", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 24, "aliyah": 3, "heb": "דַּבֵּ֥ר אֶל־הָעֵדָ֖ה לֵאמֹ֑ר הֵֽעָלוּ֙ מִסָּבִ֔יב לְמִשְׁכַּן־קֹ֖רַח דָּתָ֥ן וַאֲבִירָֽם׃", "onk": "מַלֵּל עִם כְּנִשְׁתָּא לְמֵימָר אִסְתַּלָּקוּ מִסְּחוֹר סְחוֹר לְמַשְׁכְּנָא דְקֹרַח דָּתָן וַאֲבִירָם:", "onk_en": "Speak to the congregation, saying: “Depart from the vicinity of the dwelling of Korach, Dasan and Avirom.”", "pj": "קַבֵּלִית צְלוֹתְכוֹן עַל כְּנִישְׁתָּא כְּדוֹן מַלֵיל לְהוֹן לְמֵימָר אִסְתַּלָקוּ מִן חֲזוֹר חֲזוֹר לְמַשְׁכְּנָא דְקרַח דָתָן וַאֲבִירָם", "pj_en": "I have accepted thy prayer for the congregation. Now speak thou with them, saying: Remove away from the tents of Korach, Dathan, and Abiram.", "tj": "", "tj_en": "", "rashi": "<b>העלו.<\/b> כְּתַרְגּוּמוֹ, הִסְתַּלְּקוּ מִסְּבִיבוֹת מִשְׁכַּן קֹרַח:", "rashi_en": "העלו GET YOU UP [FROM ABOUT THE DWELLING OF KORAH] — Understand this as the Targum does: withdraw from the vicinity of Korah’s dwelling."}, {"ch": 16, "v": 25, "aliyah": 3, "heb": "וַיָּ֣קׇם מֹשֶׁ֔ה וַיֵּ֖לֶךְ אֶל־דָּתָ֣ן וַאֲבִירָ֑ם וַיֵּלְכ֥וּ אַחֲרָ֖יו זִקְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "וְקָם משֶׁה וַאֲזַל לְוָת דָּתָן וַאֲבִירָם וַאֲזָלוּ בַתְרוֹהִי סָבֵי יִשְׂרָאֵל:", "onk_en": "Moshe rose up and went to Dasan and Avirom and the elders of Israel went along after him.", "pj": "וְקָם משֶׁה וַאֲזַל לְאוֹכָחָא לְדָתָן וַאֲבִירָם וַאֲזָלוּ בַתְרוֹי סָבֵי יִשְרָאֵל", "pj_en": "And Mosheh arose, and went to remonstrate with Dathan and Abiram; and the elders of Israel followed.", "tj": "", "tj_en": "", "rashi": "<b>ויקם משה.<\/b> כְּסָבוּר שֶׁיִּשְּׂאוּ לוֹ פָנִים וְלֹא עָשׂוּ:", "rashi_en": "ויקם משה AND MOSES ROSE UP [AND WENT UNTO DATHAN AND ABIRAM] — He still believed that they would show respect to him (defer to him if he personally appealed to them), but they did not do so, (and therefore he then addressed himself to all the congregation — cf. next verse) (Midrash Tanchuma, Korach 8)."}, {"ch": 16, "v": 26, "aliyah": 3, "heb": "וַיְדַבֵּ֨ר אֶל־הָעֵדָ֜ה לֵאמֹ֗ר ס֣וּרוּ נָ֡א מֵעַל֩ אׇהֳלֵ֨י הָאֲנָשִׁ֤ים הָֽרְשָׁעִים֙ הָאֵ֔לֶּה וְאַֽל־תִּגְּע֖וּ בְּכׇל־אֲשֶׁ֣ר לָהֶ֑ם פֶּן־תִּסָּפ֖וּ בְּכׇל־חַטֹּאתָֽם׃", "onk": "וּמַלִּיל עִם כְּנִשְׁתָּא לְמֵימָר זוּרוּ כְעַן מֵעִלָּוֵי מַשְׁכְּנֵי גֻּבְרַיָּא <b>חַיָּבַיָּא<\/b> הָאִלֵּין וְלָא <b>תִקְרְבוּן<\/b> בְּכָל דִּי לְהוֹן דִּלְמָא <b>תִלְקוּן<\/b> בְּכָל חוֹבֵיהוֹן:", "onk_en": "He spoke to the congregation, saying: “Please get away from the tents of these evil [<b>guilty<\/b>] men, and do not touch [<b>come near<\/b>] anything belonging to them, lest you be swept away [<b>smitten<\/b>] in all their transgressions.”", "pj": "וּמַלֵיל לִכְנִשְׁתָּא לְמֵימָר זוֹרוּ כְדֵין מֵעִלַוֵי מַשְׁכְּנֵי גוּבְרַיָא חַיָיבַיָא אִלְיֵין דְאִתְחַיְיבוּ קְטוֹל מִן טַלְיוּתְהוֹן בְּמִצְרַיִם פַּרְסִימוּ מְסַטְרִין דִילִי כַּד קְטָלִית יַת מִצְרָאֵי עַל יַמָא אַרְגִיזוּ קֳדָם יְיָ בְּאָלוּשׁ אַפִיסוּ יַת יוֹמָא דְשַׁבְּתָא כְּדוֹן אִזְדַמְנוּ עַל מֵימְרָא דַיְיָ בְּגִין כֵּן חַזֵי לְנִידוּיֵיהוֹן וּלְגַמְרָא יַת כָּל נִיכְסֵיהוֹן וְלָא תִקְרְבוּן בְּכָל מַה דְאִית לְהוֹן דִלְמָא תִלְקוּן בְּכָל חוֹבֵיהוֹן", "pj_en": "And he said to the congregation, Remove now away from the tents of these men of sin, who have been worthy of death from (the days of) their youth in Mizraim, for they betrayed my secret when I slew the Mizraite; they provoked the Lord at the sea; at Alush they profaned the Sabbath, and now are they gathered together against the Word of the Lord; and therefore is it fit that their wealth should be scattered abroad and destroyed. Touch not, then, anything that is theirs, nor be smitten on account of their sins.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 27, "aliyah": 3, "heb": "וַיֵּעָל֗וּ מֵעַ֧ל מִשְׁכַּן־קֹ֛רַח דָּתָ֥ן וַאֲבִירָ֖ם מִסָּבִ֑יב וְדָתָ֨ן וַאֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אׇֽהֳלֵיהֶ֔ם וּנְשֵׁיהֶ֥ם וּבְנֵיהֶ֖ם וְטַפָּֽם׃", "onk": "וְאִסְתַּלָּקוּ מֵעִלָּוֵי מַשְׁכְּנָא דְקֹרַח דָּתָן וַאֲבִירָם מִסְּחוֹר סְחוֹר וְדָתָן וַאֲבִירָם נְפָקוּ קַיְּמִין בִּתְרַע מַשְׁכְּנֵיהוֹן וּנְשֵׁיהוֹן וּבְנֵיהוֹן וְטַפְלְהוֹן:", "onk_en": "They withdraw from the dwelling of Korach, Dasan and Avirom, and all around; and Dasan and Avirom went out, and stood at the door of their tents with their wives, children and infants.", "pj": "וְאִסְתְּלָקוּ מֵעִלַוֵי מַשְׁכְּנָא דְקרַח דָתָן וַאֲבִירָם מִן חֲזוֹר חֲזוֹר וְדָתָן וַאֲבִירָם נְפָקוּ בְּמִילֵי חֵירוּפוּן וְקָמוּ וְאַרְגִיזוּ לְמשֶׁה תְּרַע מַשְׁכְּנֵיהוֹן וּנְשֵׁיהוֹן וּבְנֵיהוֹן וְטַפְלֵיהוֹן", "pj_en": "And they went apart from the tents of Korach, Dathan, and Abiram round about. But Dathan and Abiram came out, with reviling words, and arose and provoked Mosheh at the door of their tents, with their wives, their sons, and their little ones.", "tj": "", "tj_en": "", "rashi": "<b>יצאו נצבים.<\/b> בְּקוֹמָה זְקוּפָה — לְחָרֵף וּלְגַדֵּף, כְּמוֹ (שמואל א י\"ז) \"וַיִּתְיַצֵּב אַרְבָּעִים יוֹם\" דְּגָלְיָת (תנחומא):<br><br><b>ונשיהם ובניהם וטפם.<\/b> בֹּא וּרְאֵה כַּמָּה קָשָׁה הַמַּחֲלֹקֶת, שֶׁהֲרֵי בֵית דִּין שֶׁל מַטָּה אֵין עוֹנְשִׁין אֶלָּא עַד שֶׁיָּבִיא שְׁתֵּי שְׂעָרוֹת, וּבֵית דִּין שֶׁל מַעְלָה עַד עֶשְׂרִים שָׁנָה, וְכָאן אָבְדוּ אַף יוֹנְקֵי שָׁדַיִם (שם):", "rashi_en": "יצאו נצבים [AND DATHAN AND ABIRAM] CAME OUT, STATIONING THEMSELVES [AT THE ENTRANCE OF THEIR TENT] — The word נצבים suggests that they stood with erect stature in a challenging attitude, ready to revile and to curse. The phrase is similar in meaning to (I Samuel 17:16) “And he stationed himself (ויתיצב) there for forty days”, which occurs in the story of Goliath (Midrash Tanchuma, Korach 3).<br><br>ונשיהם ובניהם וטפם AND THEIR WIVES, AND THEIR SONS, AND THEIR LITTLE ONES — Come and see how grievous a sin dissension is: for an earthly tribunal (more lit., a tribunal of here below) does not punish a person before he shows signs of puberty, the heavenly tribunal (more lit., the tribunal of above) not even before he is twenty years old, while here even the sucklings perished (Midrash Tanchuma, Korach 3)."}, {"ch": 16, "v": 28, "aliyah": 3, "heb": "וַיֹּ֘אמֶר֮ מֹשֶׁה֒ בְּזֹאת֙ תֵּֽדְע֔וּן כִּֽי־יְהֹוָ֣ה שְׁלָחַ֔נִי לַעֲשׂ֕וֹת אֵ֥ת כׇּל־הַֽמַּעֲשִׂ֖ים הָאֵ֑לֶּה כִּי־לֹ֖א מִלִּבִּֽי׃", "onk": "וַאֲמַר משֶׁה בְּדָא תִדְּעוּן אֲרֵי יְיָ שַׁלְּחַנִּי לְמֶעְבַּד יָת כָּל עוֹבָדַיָּא הָאִלֵּין אֲרֵי לָא <b>מֵרְעוּתִי<\/b>:", "onk_en": "Moshe said: “This is how you will know that Adonoy has sent me to perform all of these deeds, for, I did not devise them myself [<b>from my own will<\/b>].", "pj": "וַאֲמַר משֶׁה בְּדָא תִנְדְעוּן אֲרוּם יְיָ שַׁדְרַנִי לְמֶעֱבַד יַת כָּל עוֹבָדַיָא הָאִלֵין אֲרוּם לָא מִן רְעוּת לִבִּי", "pj_en": "And Mosheh said, By this you shall know that the Lord hath sent me to do all these works, and that (I do them) not from the thoughts of my heart.", "tj": "אֲרוּם לָא מִן לִבִּי בָּדִית יַתְהוֹן:", "tj_en": "For not with my own heart have I devised them.", "rashi": "<b>לעשות את כל המעשים האלה.<\/b> שֶׁעָשִׂיתִי עַל פִּי הַדִּבּוּר, לָתֵת לְאַהֲרֹן כְּהֻנָּה גְדוֹלָה וּבָנָיו סְגָנֵי כְהֻנָּה, וֶאֱלִיצָפָן נְשִׂיא הַקְּהָתִי:", "rashi_en": "לעשות את כל המעשים האלה [HEREBY YE SHALL KNOW THAT THE LORD HATH SENT ME] TO DO ALL THESE THINGS — i.e. that I have acted by the Divine Command in giving Aaron the High Priesthood, and in making his sons second in rank in the priesthood and Elzaphan prince of the Kohathites."}, {"ch": 16, "v": 29, "aliyah": 3, "heb": "אִם־כְּמ֤וֹת כׇּל־הָֽאָדָם֙ יְמֻת֣וּן אֵ֔לֶּה וּפְקֻדַּת֙ כׇּל־הָ֣אָדָ֔ם יִפָּקֵ֖ד עֲלֵיהֶ֑ם לֹ֥א יְהֹוָ֖ה שְׁלָחָֽנִי׃", "onk": "אִם כְּמוֹתָא דְכָל אֱנָשָׁא יְמוּתוּן אִלֵּין וּסְעָרָא דְּכָל אֶנָשָׁא יִסְתְּעַר עֲלֵיהוֹן לָא יְיָ שַׁלְּחַנִּי:", "onk_en": "If as all men die will these men meet their deaths, and the reckoning (fate) of all men will be reckoned upon them, then Adonoy has not sent me.", "pj": "אִין כְּמִיתוּתָא דְמַיְיתוּן בָּהּ כָּל בְּנֵי נְּשָׁא יְמוּתוּן אִלְיֵין וּסְכָמוּת כָּל אֱנָשָׁא יִסְתְּכַם עֲלֵיהוֹן לָא יְיָ שְׁדָרַנִי", "pj_en": "If these men die after the manner of dying in which all men die, and the (common) account of all men be accounted upon them, the Lord hath not sent me.", "tj": "מִמוֹתָא דְמַיְיתִין בָּהּ בְּנֵי אֱנָשָׁא יְמוּתוּן אִלֵין וּסְכָמוּת דְכָל אֱנָשָׁא יִסְתְּכַם עֲלֵיהוֹן לָא יְיָ שְׁלַח יָתִי:", "tj_en": "If these die by the death with which the sons of men die, and the account of all men be accounted upon them, the Lord hath not sent me.", "rashi": "<b>לא ה' שלחני.<\/b> אֶלָּא אֲנִי עָשִׂיתִי הַכֹּל מִדַּעְתִּי, וּבְדִין הוּא חוֹלֵק עָלַי:", "rashi_en": "לא ה' שלחני [IF THESE MEN DIE THE COMMON DEATH OF ALL MEN] … THEN THE LORD HATH NOT SENT ME. but I have done everything of my own accord and he (Korah) is therefore right in rebelling against me."}, {"ch": 16, "v": 30, "aliyah": 3, "heb": "וְאִם־בְּרִיאָ֞ה יִבְרָ֣א יְהֹוָ֗ה וּפָצְתָ֨ה הָאֲדָמָ֤ה אֶת־פִּ֙יהָ֙ וּבָלְעָ֤ה אֹתָם֙ וְאֶת־כׇּל־אֲשֶׁ֣ר לָהֶ֔ם וְיָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָה וִֽידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָאֲנָשִׁ֥ים הָאֵ֖לֶּה אֶת־יְהֹוָֽה׃", "onk": "וְאִם בְּרִיאָה יִבְרֵי יְיָ וּפְתָחַת אַרְעָא יָת פּוּמַהּ וּבְלָעַת יָתְהוֹן וְיָת כָּל דִּי לְהוֹן וְיֶחֱתוּן כַּד חַיִּין לִשְׁאוֹל וְתִדְּעוּן אֲרֵי אַרְגִּיזוּ גֻּבְרַיָּא הָאִלֵּין קֳדָם יְיָ:", "onk_en": "If Adonoy will create a [new] creation and the ground will open its mouth and swallow them along with all of their belongings, and they will go down alive to the grave, then you will know that these men have angered Adonoy.”", "pj": "וְאִין לָא אִתְבָּרִיאַת מִיתוּתָא לְהוֹן מִן יוֹמַת עַלְמָא תִּתְבְּרֵי לְהוֹן כְּדוֹן וְאִין לָא אִתְבְּרֵי פּוּם לְאַרְעָא מִן שֵׁירוּיָא אִתְבְּרֵי לָהּ כְּדוֹן וְתִפְתּוֹחַ אַרְעָא יַת פּוּמָהָא וְתִבְלַע יַתְהוֹן וְיַת כָּל דִלְהוֹן וְיֵחְתוּן כַּד חַיִין לְשֵׁיוּל וְתִנְדְעוּן אֲרוּם אַרְגִיזוּ גוּבְרַיָא הָאִלֵין קֳדָם יְיָ", "pj_en": "But if a death which hath not been created since the days of the world be now created for them, and if a mouth for the earth, which hath not been made from the beginning, be created now, and the earth open her mouth and swallow them and all they have, and they go down alive into Sheol, you will understand that these men have provoked the Lord to anger.", "tj": "", "tj_en": "", "rashi": "<b>ואם בריאה.<\/b> חֲדָשָׁה:<br><br><b>יברא ה'.<\/b> לְהָמִית אוֹתָם בְּמִיתָה שֶׁלֹּא מֵת בָּהּ אָדָם עַד הֵנָּה, וּמַה הִיא הַבְּרִיאָה?<br><br><b>ופצתה האדמה את פיה<\/b> וְתִבְלָעֵם, אָז <b>וידעתם כי נאצו<\/b> הֵם אֶת הַקָּבָּ\"ה, וַאֲנִי מִפִּי הַגְּבוּרָה אָמַרְתִּי; וְרַבּוֹתֵינוּ פֵרְשׁוּ: וְאִם בְּרִיאָה פֶה לָאָרֶץ מִשֵּׁשֶׁת יְמֵי בְרֵאשִׁית מוּטָב, וְאִם לָאו יִבְרָא ה' (סנהדרין ק\"י):", "rashi_en": "ואם בריאה BUT IF A CREATION — i.e. an entirely new one. <br><br>יברא ה׳ THE LORD WILL CREATE, to slay them by a kind of death by which no man has hitherto died — and what is this new creation?<br><br>ופצתה האדמה את פיה THAT THE EARTH OPEN WIDE HER MOUTH AND SWALLOW THEM, then וידעתם כי נאצו YE SHALL KNOW THAT THEY HAVE PROVOKED the Holy One, blessed be He, and that I have spoken only by authority of the Almighty. Our Rabbis, however, gave the following explanation: ואם בריאה, if there has been a creation, i.e., if there was already a mouth to the earth from the six days of Creation, well and good! but if not, יברא ה׳ the Lord will create one now (Sanhedrin 110a; Nedarim 39b)."}, {"ch": 16, "v": 31, "aliyah": 3, "heb": "וַֽיְהִי֙ כְּכַלֹּת֔וֹ לְדַבֵּ֕ר אֵ֥ת כׇּל־הַדְּבָרִ֖ים הָאֵ֑לֶּה וַתִּבָּקַ֥ע הָאֲדָמָ֖ה אֲשֶׁ֥ר תַּחְתֵּיהֶֽם׃", "onk": "וַהֲוָה כַּד שֵׁצֵי לְמַלָּלָא יָת כָּל פִּתְגָּמַיָּא הָאִלֵּין וְאִתְבְּזָעַת אַרְעָא דִּי תְחוֹתֵיהוֹן:", "onk_en": "As he was finishing speaking all these words the ground beneath them split.", "pj": "וַהֲוָה כְדִי פָסַק לְמַלָלָא יַת כָּל פִּתְגָמַיָא הָאִלֵין וְאִתְבְּזָעַת אַרְעָא דִתְחוֹתֵיהוֹן", "pj_en": "And it came to pass, when he had finished speaking these words, the earth beneath them clave asunder;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 32, "aliyah": 3, "heb": "וַתִּפְתַּ֤ח הָאָ֙רֶץ֙ אֶת־פִּ֔יהָ וַתִּבְלַ֥ע אֹתָ֖ם וְאֶת־בָּתֵּיהֶ֑ם וְאֵ֤ת כׇּל־הָאָדָם֙ אֲשֶׁ֣ר לְקֹ֔רַח וְאֵ֖ת כׇּל־הָרְכֽוּשׁ׃", "onk": "וּפְתָחַת אַרְעָא יָת פּוּמַהּ וּבְלָעַת יָתְהוֹן וְיָת <b>אֱנַשׁ בָּתֵּיהוֹן<\/b> וְיָת כָּל אֱנָשָׁא דִּי לְקֹרַח וְיָת כָּל קִנְיָנָא:", "onk_en": "The earth opened its mouth and swallowed them and their houses [<b>household members<\/b>] and all the people belonging to Korach and all of the possessions.", "pj": "וּפְתָחַת אַרְעָא יַת פּוּמָהּ וּבְלָעַת יַתְהוֹן וְיַת אֱנַשׁ בָּתֵּיהוֹן וְיַת כָּל אֵינָשָׁא דִלְקרַח וְיַת כָּל נִכְסַיָא", "pj_en": "and the earth opened her mouth and swallowed them up, and the men of their houses, and all the men who adhered to Korach, and all their substance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 33, "aliyah": 3, "heb": "וַיֵּ֨רְד֜וּ הֵ֣ם וְכׇל־אֲשֶׁ֥ר לָהֶ֛ם חַיִּ֖ים שְׁאֹ֑לָה וַתְּכַ֤ס עֲלֵיהֶם֙ הָאָ֔רֶץ וַיֹּאבְד֖וּ מִתּ֥וֹךְ הַקָּהָֽל׃", "onk": "וּנְחָתוּ אִנּוּן וְכָל דִּי לְהוֹן כַּד חַיִּין לִשְׁאוֹל וַחֲפַת עֲלֵיהוֹן אַרְעָא וַאֲבָדוּ מִגּוֹ קְהָלָא:", "onk_en": "They, and all belonging to them, went down alive to the grave, and the earth covered them and they perished from among the assembly.", "pj": "וּנְחָתוּ הִינוּן וְכָל דִלְהוֹן כַּד חַיִין לְשֵׁיוּל וַחֲפַת עֲלֵיהוֹן אַרְעָא וְאוֹבְדוּ מִגוֹ קְהָלָא", "pj_en": "And they went down with all that they had alive into Sheol; and the earth closed upon them, and they perished from the midst of the congregation.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 16, "v": 34, "aliyah": 3, "heb": "וְכׇל־יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵיהֶ֖ם נָ֣סוּ לְקֹלָ֑ם כִּ֣י אָֽמְר֔וּ פֶּן־תִּבְלָעֵ֖נוּ הָאָֽרֶץ׃", "onk": "וְכָל יִשְׂרָאֵל דִּי בְּסַחֲרָנֵיהוֹן עֲרָקוּ לְקָלְהוֹן אֲרֵי אֲמָרוּ דִּלְמָא תִבְלְעִנָּנָא אַרְעָא:", "onk_en": "All of Yisroel who were around them fled from their uproar, for they said, perhaps the earth will swallow us.", "pj": "וְכָל יִשְרָאֵל דִי בְּחַזְרָנַתְהוֹן עָרְקוּ מִן דְחִיל קָלְהוֹן הֵיךְ צַוְוחִין וְאָמְרִין זַכַּאי הוּא יְיָ וְקוּשְׁטָא הֵיךְ דִינוֹי וְקוּשְׁטָא הִינוּן פִּתְגָמֵי משֶׁה עַבְדֵיהּ וַאֲנַן רַשִׁיעַיָא דְמָרַדְנָא בֵיהּ וּבְנֵי יִשְרָאֵל אַפָּכוּ כְדִי שָׁמְעוּ אֲרוּם אָמְרוּ דִלְמָא תִבְלוֹעַ יָתָן אַרְעָא", "pj_en": "And all Israel who were round about them fled from the terror of their voice, as they cried and said, Righteous is the Lord, and His judgment is truth, and the words of His servant Mosheh are truth; but we are wicked who have rebelled against him: and the children of Israel fled when they heard; for they said, Lest the earth swallow us up.", "tj": "", "tj_en": "", "rashi": "<b>נסו לקלם.<\/b> בִּשְׁבִיל הַקּוֹל הַיּוֹצֵא עַל בְּלִיעָתָן:", "rashi_en": "נסו לקולם [AND ALL ISRAEL …] FLED AWAY AT THEIR VOICE — i.e. on account of the sound that broke out because of their being swallowed up."}, {"ch": 16, "v": 35, "aliyah": 3, "heb": "וְאֵ֥שׁ יָצְאָ֖ה מֵאֵ֣ת יְהֹוָ֑ה וַתֹּ֗אכַל אֵ֣ת הַחֲמִשִּׁ֤ים וּמָאתַ֙יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַקְּטֹֽרֶת׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וְאֶשָּׁתָא נְפָקַת מִן <b>קֳדָם<\/b> יְיָ וַאֲכָלַת יָת מָאתָן וְחַמְשִׁין גַּבְרָא מְקָרְבֵי קְטֹרֶת <b>בּוּסְמַיָּא<\/b>:", "onk_en": "A fire came forth from [<b>before<\/b>] Adonoy and consumed the two hundred and fifty men who were bringing the [<b>fragrant<\/b>] incense.", "pj": "וְאֵישָׁתָא נְפָקַת בְּרוּגְזָא מִן קֳדָם יְיָ וַאֲכָלַת יַת מָאתָן וְחַמְשִׁין גוּבְרִין מַסְקֵי קְטוֹרֶת בּוּסְמַיָא", "pj_en": "And a fire came out in wrath from before the Lord, and devoured the two hundred and fifty men who offered the incense.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 1, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 17, "v": 2, "aliyah": 3, "heb": "אֱמֹ֨ר אֶל־אֶלְעָזָ֜ר בֶּן־אַהֲרֹ֣ן הַכֹּהֵ֗ן וְיָרֵ֤ם אֶת־הַמַּחְתֹּת֙ מִבֵּ֣ין הַשְּׂרֵפָ֔ה וְאֶת־הָאֵ֖שׁ זְרֵה־הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ׃", "onk": "אֲמַר לְאֶלְעָזָר בַּר אַהֲרֹן כַּהֲנָא וְיַפְרֵשׁ יָת מַחְתְּיָתָא מִבֵּין יְקִידַיָּא וְיָת אֶשָּׁתָא יַרְחֵק לְהָלָא אֲרֵי אִתְקַדָּשׁוּ:", "onk_en": "“Say to Elazar the son of Aharon, the <i>kohein<\/i> and have him lift up the firepans from the inferno, and you, scatter the fire yonder, for, they were sanctified;", "pj": "אֲמַר לְאֶלְעָזָר בַּר אַהֲרן כַּהֲנָא וְיַפְרֵשׁ יַת מַחְתְּיָא מִן בֵּינֵי יַקִידַיָא וְיַת אֵישָׁתָא בַּדְרֵי לְהָאֵל אֲרוּם אִתְקֵדְשָׁא", "pj_en": "Bid Elazar bar Aharon the priest to take away the censers from among the burnings, and scatter the fire hither and thither; for the censers of these guilty men who have been punished by the destruction of their lives are consecrated;", "tj": "", "tj_en": "", "rashi": "<b>ואת האש.<\/b> שֶׁבְּתוֹךְ הַמַּחְתּוֹת:<br><br><b>זרה הלאה.<\/b> לָאָרֶץ מֵעַל הַמַּחְתּוֹת:<br><br><b>כי קדשו.<\/b> הַמַּחְתּוֹת וַאֲסוּרִין בַּהֲנָאָה, שֶׁהֲרֵי עֲשָׂאוּם כְּלֵי שָׁרֵת:", "rashi_en": "ואת האש AND THE FIRE — that is in the censers (not, as might be assumed, that of the burning materials — the שרפה just mentioned).<br><br>זרה הלאה SCATTER YONDER on the ground from off the censers.<br><br>כי קדשו FOR THEY — the censers — ARE HALLOWED, and are therefore forbidden for any profane use, since they have made them into “vessels of service” (כלי שרת) (by using them for offering incense)."}, {"ch": 17, "v": 3, "aliyah": 3, "heb": "אֵ֡ת מַחְתּוֹת֩ הַֽחַטָּאִ֨ים הָאֵ֜לֶּה בְּנַפְשֹׁתָ֗ם וְעָשׂ֨וּ אֹתָ֜ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַמִּזְבֵּ֔חַ כִּֽי־הִקְרִיבֻ֥ם לִפְנֵֽי־יְהֹוָ֖ה וַיִּקְדָּ֑שׁוּ וְיִֽהְי֥וּ לְא֖וֹת לִבְנֵ֥י יִשְׂרָאֵֽל׃", "onk": "יָת מַחְתְּיַת חַיָּבַיָּא הָאִלֵּין דְּאִתְחַיָּבוּ בְּנַפְשָׁתֵיהוֹן וְיַעְבְּדוּן יָתְהֵן טַסִּין רַדִּידִין חוֹפָאָה לְמַדְבְּחָא אֲרֵי קָרֵבֻנּוּן קֳדָם יְיָ וְאִתְקַדָּשׁוּ וִיהֶוְיָן לְאָת לִבְנֵי יִשְׂרָאֵל:", "onk_en": "[These] firepans of these sinners [who paid] with their souls, and make them into hammered sheets to overlay the altar, for they were brought in offering before Adonoy and they were sanctified; and they shall be for a sign for Bnei Yisroel.", "pj": "יַת מַחְתְּיַית חַיָיבַיָא הָאִלֵין דְאִתְחַיְיבוּ קְטוֹל בְּנַפְשַׁתְהוֹן וְיַעַבְדוּן מִנְהוֹן רְדִידֵי טָסִין חַפְיֵי לְמַדְבְּחָא אֲרוּם קְרֵיבוּנוּן קֳדָם יְיָ וְאִתְקַדָשׁוּ וִיהוֹן לְאַת לִבְנֵי יִשְרָאֵל", "pj_en": "and make of them broad plates for the covering of the altar, because they bare them before the Lord, therefore they are consecrate; and they shall be for a sign to the children of Israel.", "tj": "לְאוֹת לְסִימָן:", "tj_en": "For a sign.", "rashi": "<b>החטאים האלה בנפשתם.<\/b> שֶׁנַּעֲשׂוּ פוֹשְׁעִים בְּנַפְשׁוֹתָם, שֶׁנֶּחְלְקוּ עַל הַקָּבָּ\"ה:<br><br><b>רקעי.<\/b> רְדוּדִין:<br><br><b>פחים.<\/b> טַסִּים מְרֻדָּדִין, טינדי\"ש בלעז:<br><br><b>צפוי למזבח.<\/b> לְמִזְבַּח הַנְּחֹשֶׁת:<br><br><b>ויהיו לאות.<\/b> לְזִכָּרוֹן — שֶׁיֹּאמְרוּ, אֵלּוּ הָיוּ מֵאוֹתָן שֶׁנֶּחְלְקוּ עַל הַכְּהֻנָּה וְנִשְׂרְפוּ:", "rashi_en": "החטאים האלא בנפשתם THESE SINNERS AGAINST THEIR OWN SOULS — i.e. who became wilful transgressors against their own souls, because they rebelled against the Holy One, blessed be He. <br><br>רקעי means beaten out (flattened).<br><br>פחים are plates beaten out thin, tendus in O. F. <br><br>צפוי למזבח FOR AN OVERLAYING FOR THE ALTAR — i.e. for the copper altar. <br><br>ויהיו לאות AND THEY SHALL BE AS AN אות — The word לאות is the same as לזכרון, something to be mentioned (cf. Exodus 13:9) — that people will always say: These plates were from (once belonged to) those who raised dissension about the priesthood and were burnt."}, {"ch": 17, "v": 4, "aliyah": 3, "heb": "וַיִּקַּ֞ח אֶלְעָזָ֣ר הַכֹּהֵ֗ן אֵ֚ת מַחְתּ֣וֹת הַנְּחֹ֔שֶׁת אֲשֶׁ֥ר הִקְרִ֖יבוּ הַשְּׂרֻפִ֑ים וַֽיְרַקְּע֖וּם צִפּ֥וּי לַמִּזְבֵּֽחַ׃", "onk": "וּנְסִיב אֶלְעָזָר כַּהֲנָא יָת מַחְתְּיָתָא דִנְחָשָׁא דְּקָרִיבוּ יוֹקִידַיָּא וְרַדִּידֻנּוּן חוֹפָאָה לְמַדְבְּחָא:", "onk_en": "Elazar the <i>kohein,<\/i> took the copper firepans, those that the fire victims brought and hammered them into a covering for the altar,", "pj": "וּנְסֵיב אֶלְעָזָר כַּהֲנָא יַת מַחְתְּיַית נְחָשָׁא דְקָרִיבוּ יַקִידַיָא וְרַדִידִינוּן חַפְיֵי לְגוּפָא דְמַדְבְּחָא דְמִן שֵׁירוּיָא הֲווֹן תַּשְׁמִישְׁתֵּיהּ דְמַדְבְּחָא", "pj_en": "And Elazar the priest took the brasen censers which they who had been burned had carried, and beat them out for a covering for the body of the altar, as they had before used them for the service of the altar:", "tj": "", "tj_en": "", "rashi": "<b>וירקעום.<\/b> איטינ\"דריש בְּלַעַז:", "rashi_en": "וירקעום AND THEY EXTENDED THEM — Etendre in O. F."}, {"ch": 17, "v": 5, "aliyah": 3, "heb": "זִכָּר֞וֹן לִבְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַ֠עַן אֲשֶׁ֨ר לֹֽא־יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁ֠ר לֹ֣א מִזֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְהַקְטִ֥יר קְטֹ֖רֶת לִפְנֵ֣י יְהֹוָ֑ה וְלֹֽא־יִהְיֶ֤ה כְקֹ֙רַח֙ וְכַ֣עֲדָת֔וֹ כַּאֲשֶׁ֨ר דִּבֶּ֧ר יְהֹוָ֛ה בְּיַד־מֹשֶׁ֖ה לֽוֹ׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "דָּכְרָנָא לִבְנֵי יִשְׂרָאֵל בְּדִיל דִּי לָא יִקְרַב גְּבַר חִלּוֹנַי דִּי לָא מִזַּרְעָא דְאַהֲרֹן הוּא לְאַסָּקָא קְטֹרֶת <b>בּוּסְמִין<\/b> קֳדָם יְיָ וְלָא יְהֵי כְקֹרַח וְכִכְנִשְׁתֵּיהּ כְּמָא דִי מַלִּיל יְיָ בִּידָא דְמשֶׁה לֵיהּ:", "onk_en": "to be a reminder for Bnei Yisroel so that a commoner shall never offer, one who is not a descendant of Aharon, to burn [<b>fragrant<\/b>] incense before Adonoy; so as not to be like Korach and his congregation; as Adonoy spoke to him, through Moshe.", "pj": "דוּכְרָנָא לִבְנֵי יִשְרָאֵל מִן בִּגְלַל דְלָא יִקְרַב גְבַר חִלוֹנַי דְלָא מִן בְּנֵי אַהֲרן לְאַסָקָא קְטוֹרֶת בּוּסְמִין קֳדָם יְיָ וְלָא יְהֵי גְבַר מִתְנַטֵל לְמִפְלוֹג עַל עֵיסַק כְּהוּנְתָּא כְּקרַח וְכִכְנִישַׁת סַעֲדוֹי וְסוֹפֵיהּ לְהוֹבָדָא וְלָא כְמִיתוּתָא דְקרַח וְכִכְנִשְׁתֵּיהּ בִּיקִידַת אֵשָׁא וּבְלִיעַת אַרְעָא אֱלָהֵן לְמִלְקֵי בִּסְגִירוּתָא הֵיכְמָא דְמַלֵיל יְיָ לְמשֶׁה שַׁוֵי יְדָךְ בְּעִיטְפָךְ וְלָקַת יְדֵיהּ בְּצוֹרְעָא הֵיכְדֵין יִמְטֵי לֵיהּ", "pj_en": "for a memorial to the sons of Israel, that no common man, who is not of the sons of Aharon, may offer incense before the Lord; and that no man should behave himself factiously to obtain the priesthood, as did Korach and the company of his helpers; and whose end would be to perish, not (indeed) with a death like that of Korach and his company, by being burned by fire, and being swallowed up by the earth, but punished with leprosy: as when the Lord said to Mosheh, Put thy hand into thy bosom, and his hand was stricken with leprosy; so would it be with him.", "tj": "", "tj_en": "", "rashi": "<b>ולא יהיה כקרח.<\/b> כְּדֵי שֶׁלֹּא יִהְיֶה כְקֹרַח:<br><br><b>כאשר דבר ה' ביד משה לו.<\/b> כְּמוֹ עָלָיו — עַל אַהֲרֹן דִּבֵּר אֶל מֹשֶׁה שֶׁיִּהְיוּ הוּא וּבָנָיו כֹּהֲנִים, לְפִיכָךְ \"לֹא יִקְרַב אִישׁ זָר אֲשֶׁר לֹא מִזֶּרַע אַהֲרֹן\" וְגוֹ'; וְכֵן כָּל לִי וְלוֹ וְלָהֶם הַסְּמוּכִים אֵצֶל דִּבּוּר, פִּתְרוֹנָם כְּמוֹ עַל. וּמִדְרָשׁוֹ — עַל קֹרַח, וּמַהוּ \"בְיַד מֹשֶׁה\" וְלֹא כָתַב \"אֶל מֹשֶׁה\"? רֶמֶז לַחוֹלְקִים עַל הַכְּהֻנָּה שֶׁלּוֹקִין בְּצָרַעַת כְּמוֹ שֶׁלָּקָה מֹשֶׁה בְּיָדוֹ, שֶׁנֶּאֱמַר \"וַיּוֹצִאָהּ וְהִנֵּה יָדוֹ מְצֹרַעַת כַּשָּׁלֶג\" (שמות ד'), וְעַל כֵּן לָקָה עֻזִּיָּהוּ בְּצָרַעַת (דברי הימים ב' כ\"ו):", "rashi_en": "ולא יהיה כקרח means in order that he be not as Korah.<br><br>כאשר דבר ה' ביד משה לו AS THE LORD HAD SPOKEN BY THE AGENCY OF MOSES לו — The latter word is the same as עליו, “with regard to him”, i.e. “with regard to Aaron”: He had spoken to Moses that he and his sons should be priests; therefore a layman, who is not of the seed of Aaron, shall not approach etc. Similarly in every instance of the words לי or לו or להם which are connected with forms of the verb דבר, their meaning is the same as על, “concerning”. A Midrashic explanation is that לו, “with regard to him”, means: with regard to Korah (not to Aaron). But what, then, is meant by the expression “by the hand of Moses”; why does it not write “unto Moses”? It is used as an intimation to those who rebel against the institution of the priesthood: that they will become stricken with leprosy, just as Moses was stricken with it on his hand, as it is said, (Exodus 4:6) “and he took it (the hand) forth and, behold, it was leprous, white as snow”. And on account of this (that he insisted on offering incense in spite of the priests’ protest) Uzziah was stricken with leprosy (II Chronicles 26:19) (Midrash Tanchuma, Tzav 1 on צו; cf. also Sanhedrin 110a and Rashi on Isaiah 6:4)."}, {"ch": 17, "v": 6, "aliyah": 3, "heb": "וַיִּלֹּ֜נוּ כׇּל־עֲדַ֤ת בְּנֵֽי־יִשְׂרָאֵל֙ מִֽמׇּחֳרָ֔ת עַל־מֹשֶׁ֥ה וְעַֽל־אַהֲרֹ֖ן לֵאמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת־עַ֥ם יְהֹוָֽה׃", "onk": "וְאִתְרַעֲמוּ כָּל כְּנִשְׁתָּא דִבְנֵי יִשְׂרָאֵל מִיּוֹמָא דְבַתְרוֹהִי עַל משֶׁה וְעַל אַהֲרֹן לְמֵימָר אַתּוּן <b>גְּרַמְתּוּן דְּמִית<\/b> עַמָּא דַיְיָ:", "onk_en": "They complained—the entire congregation of Bnei Yisroel—on the next day against Moshe and Aharon, saying: “You have killed [<b>caused the death<\/b>] the people of Adonoy”", "pj": "וְאִתְרַעֲמוּ כָּל כְּנִישְׁתָּא דִבְנֵי יִשְרָאֵל בְּיוֹמָא הָדֵין עַל משֶׁה וְעַל אַהֲר
