d you shall bring a fire-offering to [<b>an offering before<\/b>] Adonoy.", "pj": "בְּרַם בְּעַשְרָא יוֹמִין לְיַרְחָא שְׁבִיעָאָה הָדֵין יוֹמָא דְכִפּוּרַיָא הוּא מְאָרַע קַדִישׁ יְהֵי לְכוֹן וּתְעַנוּן יַת נַפְשָׁתֵיכוֹן מִמֵיכְלָא וּמִשְׁתַּיָא וְהַנְיַית בֵּי בָּנַי וְתַמְרוּקִין וְתַשְׁמִישׁ עַרְסָא וְסַנְדְלָא וּתְקַרְבוּן קָרְבָּנָא קֳדָם יְיָ", "pj_en": "But on the tenth day of this seventh month is the Day of Atonement; a holy convocation shall it be to you, and you shall humble your souls, (abstaining) from food, and from drink, and from the use of the bath, and from anointing, and the use of the bed, and from sandals; and you shall offer an oblation before the Lord,", "tj": "", "tj_en": "", "rashi": "<b>אך.<\/b> כָּל אַכִין וְרַקִּין שֶׁבַּתּוֹרָה מִעוּטִים — מְכַפֵּר הוּא לַשָּׁבִים וְאֵינוֹ מְכַפֵּר עַל שֶׁאֵינָם שָׁבִים (ספרא):", "rashi_en": "אך — The words אך and רק wherever they occur in Scripture have a limitative force; here the word implies: it (Yom Kippur) makes expiation for those who repent, but it does not make expiation for those who do not repent (אך... יום הכפורים הוא — in a limitative sense it is Yom Kippur) (Shevuot 13a; cf. Rashi on Exodus 34:7)."}, {"ch": 23, "v": 28, "aliyah": 5, "heb": "וְכׇל־מְלָאכָה֙ לֹ֣א תַעֲשׂ֔וּ בְּעֶ֖צֶם הַיּ֣וֹם הַזֶּ֑ה כִּ֣י י֤וֹם כִּפֻּרִים֙ ה֔וּא לְכַפֵּ֣ר עֲלֵיכֶ֔ם לִפְנֵ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "וְכָל עִבִידָא לָא תַעְבְּדוּן בִּכְרַן יוֹמָא הָדֵין אֲרֵי יוֹמָא דְכִפּוּרַיָּא הוּא לְכַפָּרָא עֲלֵיכוֹן קֳדָם יְיָ אֱלָהָכוֹן:", "onk_en": "You shall not do any work on this very day, for it is a day of atonements, to atone for you before Adonoy, your God.", "pj": "וְכָל עִיבִידָא לָא תַעַבְּדוּן בִּכְרַן יוֹמָא הָדֵין אֲרוּם יוֹמָא דְכִפּוּרַיָא הוּא לְכַפָּרָא עֲלֵיכוֹן קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "and do no work on this same day; for it is the Day of Atonement, to make atonement for you before the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 29, "aliyah": 5, "heb": "כִּ֤י כׇל־הַנֶּ֙פֶשׁ֙ אֲשֶׁ֣ר לֹֽא־תְעֻנֶּ֔ה בְּעֶ֖צֶם הַיּ֣וֹם הַזֶּ֑ה וְנִכְרְתָ֖ה מֵֽעַמֶּֽיהָ׃", "onk": "אֲרֵי כָל אֲנָשָׁא דִּי לָא מִתְעַנֵּי בִּכְרַן יוֹמָא הָדֵין וְיִשְׁתֵּיצֵי מֵעַמָּהָא:", "onk_en": "For any person who will not be afflicted on this very day shall be cut off from his people.", "pj": "אֲרוּם כָּל בַּר נַשׁ דְיֵיכוֹל לְצַיְימָא וְלָא יְצוּם בִּכְרַן יוֹמָא הָדֵין וְיִשְׁתֵּיצֵי בְּמוֹתָנָא מִגוֹ עַמֵיהּ", "pj_en": "For every man who eateth in the fast, and will not fast that same day, shall be cut off by death from among his people.", "tj": "אֲרוּם כָּל נְפַשׁ דִּכְמֵיסַת לִמְצוֹם וְלָא צַיְימָא בְּיוֹם צוֹם כִּפּוּרֵיהּ:", "tj_en": "For every soul who hideth himself from fasting and fasteth not on the day of the fast of his atonement.", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 30, "aliyah": 5, "heb": "וְכׇל־הַנֶּ֗פֶשׁ אֲשֶׁ֤ר תַּעֲשֶׂה֙ כׇּל־מְלָאכָ֔ה בְּעֶ֖צֶם הַיּ֣וֹם הַזֶּ֑ה וְהַֽאֲבַדְתִּ֛י אֶת־הַנֶּ֥פֶשׁ הַהִ֖וא מִקֶּ֥רֶב עַמָּֽהּ׃", "onk": "וְכָל אֱנַשׁ דִּי תַעְבֵּד כָּל עִבִידָא בִּכְרַן יוֹמָא הָדֵין וְאוֹבֵד יָת אֲנָשָׁא הַהִיא מִגּוֹ עַמַּהּ:", "onk_en": "Any person who does any work on this very day, I will cause that person to perish from among his people.", "pj": "וְכָל בַּר נַשׁ דְיַעֲבֵיד כָּל עִיבִידָא בִּכְרַן יוֹמָא הָדֵין וְאוֹבִיד יַת בַּר נְשָׁא הַהוּא בְּמוֹתָנָא מִגוֹ עַמֵיהּ", "pj_en": "And every man who doeth any work on that same day, that man will I destroy with death from among his people.", "tj": "", "tj_en": "", "rashi": "<b>והאבדתי.<\/b> לְפִי שֶׁהוּא אוֹמֵר כָּרֵת בְּכָל מָקוֹם וְאֵינִי יוֹדֵעַ מַה הוּא, כְּשֶׁהוּא אוֹמֵר וְהַאֲבַדְתִּי, לִמֵּד עַל הַכָּרֵת שֶׁאֵינוֹ אֶלָּא אֲבַדּוֹן:", "rashi_en": "והאבדתי I WILL DESTROY — This expression “destroying” is employed here because Scripture uses everywhere in similar cases the term כרת, “cutting off” without clearly defining it, so that I do not know exactly what it implies; but when it states here והאבדתי, it teaches in respect of the term כרת that it implies nothing else than becoming lost” (Sifra, Emor, Chapter 14 4)."}, {"ch": 23, "v": 31, "aliyah": 5, "heb": "כׇּל־מְלָאכָ֖ה לֹ֣א תַעֲשׂ֑וּ חֻקַּ֤ת עוֹלָם֙ לְדֹרֹ֣תֵיכֶ֔ם בְּכֹ֖ל מֹשְׁבֹֽתֵיכֶֽם׃", "onk": "כָּל עִבִידָא לָא תַעְבְּדוּן קְיַם עָלָם לְדָרֵיכוֹן בְּכֹל מוֹתְבָנֵיכוֹן:", "onk_en": "You shall not do any work; it is an everlasting statute for all your generations in all your dwelling places.", "pj": "כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן קְיַים עֲלָם לְדָרֵיכוֹן בְּכָל אֲתַר מוֹתְבָנֵיכוֹן", "pj_en": "No work of labour may you do an everlasting statute for your generations, in all your dwellings.", "tj": "", "tj_en": "", "rashi": "<b>כל מלאכה וגו'.<\/b> לַעֲבֹר עָלָיו בְּלָאוִין הַרְבֵּה, אוֹ לְהַזְהִיר עַל מְלֶאכֶת לַיְלָה כִּמְלֶאכֶת יוֹם:", "rashi_en": "'‎‎כל מלאכה וגו‎ [YE SHALL NOT DO] ANY WORK — This is repeated (cf v. 30) in order to make one who does work on Yom Kippur transgress several negative commands. Or, it is repeated, in order to prohibit working in the night of Yom Kippur, just as well as working during the day itself (Yoma 81a)."}, {"ch": 23, "v": 32, "aliyah": 5, "heb": "שַׁבַּ֨ת שַׁבָּת֥וֹן הוּא֙ לָכֶ֔ם וְעִנִּיתֶ֖ם אֶת־נַפְשֹׁתֵיכֶ֑ם בְּתִשְׁעָ֤ה לַחֹ֙דֶשׁ֙ בָּעֶ֔רֶב מֵעֶ֣רֶב עַד־עֶ֔רֶב תִּשְׁבְּת֖וּ שַׁבַּתְּכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "שְׁבַת שְׁבָתָא הוּא לְכוֹן וּתְעַנּוּן יָת נַפְשָׁתֵיכוֹן בְּתִישְׁעָא לְיַרְחָא בְּרַמְשָׁא מֵרַמְשָׁא עַד רַמְשָׁא תְּנוּחוּן נְיַחֲכוֹן:", "onk_en": "It is a <i>Shabbos<\/i> of complete rest for you and you shall afflict yourselves on the ninth day of the month at evening; from evening to evening you shall rest, on your day of rest.", "pj": "שַׁבָּא וְנַיְחָא הוּא לְכוֹן וּתְעַנוּן יַת נַפְשָׁתֵיכוֹן וְתִשְׁרוּן לְצַיְימָא בְּתִשְׁעָה יוֹמִין לְיַרְחָא בְּעִידוֹנֵי רַמְשָׁא מִן רַמְשָׁא הַהוּא עַד רַמְשָׁא חוֹרַן תֶּהֱווּן צַיְימִין צוּמְכוֹן וְשַׁבְּתוּן שׁוֹבֵיכוֹן וְעָבְדִין זִמְנִין מוֹעֲדֵיכוֹן בְּחֶדְוָא", "pj_en": "It is a Sabbath and time of leisure for you to humble your souls. And you shall begin to fast at the ninth day of the month at even time; from that evening, until the next evening, shall you fast your fast, and repose in your quietude, that you may employ the time of your festivals with joy.", "tj": "מִן רַמְשָׁא עַד רַמְשָׁא תֶּהֱווֹן צַיְימִין צוֹמֵיכוֹן וְשָׁבְתִין שׁוּבְתֵיכוֹן וְעַבְדִין זִמְנִין מוֹעֲדֵיכוֹן בְּחֶדְוָא:", "tj_en": "From evening to evening you shall fast your fast, and repose in your quietude, that you may employ the time of your festivals with joy.", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 33, "aliyah": 6, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 34, "aliyah": 6, "heb": "דַּבֵּ֛ר אֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל לֵאמֹ֑ר בַּחֲמִשָּׁ֨ה עָשָׂ֜ר י֗וֹם לַחֹ֤דֶשׁ הַשְּׁבִיעִי֙ הַזֶּ֔ה חַ֧ג הַסֻּכּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים לַיהֹוָֽה׃", "onk": "מַלֵּיל עִם בְּנֵי יִשְׂרָאֵל לְמֵימָר בְּחַמְשָׁא עַשְׁרָא יוֹמָא לְיַרְחָא שְׁבִיעָאָה הָדֵין חַגָּא <b>דִמְטַלַּיָּא<\/b> שִׁבְעַת יוֹמִין <b>קֳדָם<\/b> יְיָ:", "onk_en": "Speak to Bnei Yisroel saying; on the fifteenth day of this seventh month is the festival of [<b>shelters<\/b>] Sukkos for seven days, for [<b>before<\/b>] Adonoy.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל לְמֵימָר בַּחֲמֵיסַר יוֹמִין לְיַרְחָא שְׁבִיעָאָה הָדֵין חַגָא דִמְטוֹלַיָא שׁוּבְעָא יוֹמִין לִשְׁמָא דַיְיָ", "pj_en": "Speak with the sons of Israel: In the fifteenth day of this seventh month shall be the Feast of Tabernacles, seven days unto the Name of the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 35, "aliyah": 6, "heb": "בַּיּ֥וֹם הָרִאשׁ֖וֹן מִקְרָא־קֹ֑דֶשׁ כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃", "onk": "בְּיוֹמָא קַדְמָאָה <b>מְעָרַע<\/b> קַדִּישׁ כָּל עִבִידַת פָּלְחָן לָא תַעְבְּדוּן:", "onk_en": "On the first day [there shall be] a holy assembly [<b>occurrence<\/b>]; you shall not do any work of labor.", "pj": "בְּיוֹמָא קַדְמָאָה דְחַגָא מְאָרַע קַדִישׁ כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן", "pj_en": "On the first day of the feast is a holy convocation; no work of labour may you do.", "tj": "", "tj_en": "", "rashi": "<b>מקרא קדשׁ.<\/b> קַדְּשֵׁהוּ בִכְסוּת נְקִיָּה וּבִתְפִלָּה, וּבִשְׁאָר יָמִים טוֹבִים בְּמַאֲכָל וּבְמִשְׁתֶּה וּבִכְסוּת נְקִיָּה וּבִתְפִלָּה (עי' ספרא):", "rashi_en": "מקרא קדש — This means: Hallow it (make it different from other days) by wearing fine clothes, and through appropriate prayer. In the case of other Festivals of which the same words are used, the expression מקרא קדש implies: Hallow them (distinguish them from other days) by your food and drink, by your fine clothes and appropriate prayers (cf. Sifra, Emor, Section 12 4)."}, {"ch": 23, "v": 36, "aliyah": 6, "heb": "שִׁבְעַ֣ת יָמִ֔ים תַּקְרִ֥יבוּ אִשֶּׁ֖ה לַיהֹוָ֑ה בַּיּ֣וֹם הַשְּׁמִינִ֡י מִקְרָא־קֹ֩דֶשׁ֩ יִהְיֶ֨ה לָכֶ֜ם וְהִקְרַבְתֶּ֨ם אִשֶּׁ֤ה לַֽיהֹוָה֙ עֲצֶ֣רֶת הִ֔וא כׇּל־מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ׃", "onk": "שִׁבְעָא יוֹמִין תְּקָרְבוּן <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ בְּיוֹמָא תְמִינָאָה מְעָרַע קַדִּישׁ יְהֵי לְכוֹן וּתְקָרְבוּן קֻרְבָּנָא קֳדָם יְיָ כְּנֵשׁ תְּהוֹן כָּל עִבִידַת פָּלְחָן לָא תַעְבְּדוּן:", "onk_en": "For seven days, you shall bring a fire-offering to [<b>an offering before<\/b>] Adonoy; the eighth day shall be for you a holy assembly [<b>occurrence<\/b>], and you shall bring a fire-offering to [<b>an offering before<\/b>] Adonoy. It is [a day] of convocation. you shall not do any work of labor.", "pj": "שִׁבְעָתֵי יוֹמִין תְּקַרְבוּן קוּרְבָּנָא לִשְׁמָא דַיְיָ כְּנִישִׁין תֶּהֱווֹן לְצַלָאָה קֳדָם יְיָ עַל מִטְרָא כָּל עִיבִידַת פּוּלְחָנָא לָא תַעַבְדוּן בְּיוֹמָא תְמִינָאָה מְאַרְעֵי קַדִישׁ יְהֵי לְכוֹן וְתִקְרְבוּן קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "Seven days you shall offer an oblation to the Name of the Lord, you shall gather together to pray before the Lord for rain; no work of labour may you do.", "tj": "", "tj_en": "", "rashi": "<b>עצרת הוא.<\/b> עָצַרְתִּי אֶתְכֶם אֶצְלִי; כְּמֶלֶךְ שֶׁזִּמֵּן אֶת בָּנָיו לִסְעוּדָה לְכָךְ וְכָךְ יָמִים, כֵּיוָן שֶׁהִגִּיעַ זְמַנָּן לִפָּטֵר, אָמַר, בָּנַי בְּבַקָּשָׁה מִכֶּם עַכְּבוּ עִמִּי עוֹד יוֹם אֶחָד, קָשָׁה עָלַי פְּרֵדַתְכֶם:<br><br><b>כל מלאכת עבדה.<\/b> אֲפִלּוּ מְלָאכָה שֶׁהִיא עֲבוֹדָה לָכֶם, שֶׁאִם לֹא תַעֲשׂוּהָ יֵשׁ חֶסְרוֹן כִּיס בַּדָּבָר.<br><br><b>לא תעשו.<\/b> יָכוֹל אַף חֻלּוֹ שֶׁל מוֹעֵד יְהֵא אָסוּר בִּמְלֶאכֶת עֲבוֹדָה, תַּ\"לֹ \"הִוא\" (שם):", "rashi_en": "עצרת הוא — The word is derived from the root עצר “to hold back” and suggests: I keep you back with Me one day more. It is similar to the case of a king who invited his children to a banquet for a certain number of days. When the time arrived for them to take their departure he said, “Children, I beg of you, stay one day more with me; it is so hard for me to part with you!” (cf. Rashi on Numbers 29:36 and Sukkah 55b).<br><br>כל מלאכת עבדה ANY WORK THAT IS AN עבדה — i. e. even such work which rests as an obligation (עבודה) upon you because if it is left undone it involves monetary loss (cf. Rashi v. 8),<br><br>לא תעשו YE SHALL NOT DO: — One might think that it is forbidden to do such urgent work (מלאכת עבדה) also on the intermediate days of Passover and Tabernacles (which are Half-festivals)! Scripture, however, states: עצרת] הוא], “it (i. e. the eighth day) forms a restriction: [ye shall do no urgent work]” — but on the intermediate days such work is not forbidden (Sifra, Emor, Section 12 6)."}, {"ch": 23, "v": 37, "aliyah": 6, "heb": "אֵ֚לֶּה מוֹעֲדֵ֣י יְהֹוָ֔ה אֲשֶׁר־תִּקְרְא֥וּ אֹתָ֖ם מִקְרָאֵ֣י קֹ֑דֶשׁ לְהַקְרִ֨יב אִשֶּׁ֜ה לַיהֹוָ֗ה עֹלָ֧ה וּמִנְחָ֛ה זֶ֥בַח וּנְסָכִ֖ים דְּבַר־י֥וֹם בְּיוֹמֽוֹ׃", "onk": "אִלֵּין מוֹעֲדַיָּא דַיְיָ דִּי <b>תְעָרְעוּן<\/b> יָתְהוֹן <b>מְעָרְעֵי<\/b> קַדִּישׁ לְקָרָבָא <b>קֻרְבָּנָא<\/b> קֳדָם יְיָ עֲלָתָא וּמִנְחָתָא נִכְסַת <b>קוּדְשִׁין<\/b> וְנִסּוּכִין פִּתְגַם יוֹם בְּיוֹמֵיהּ:", "onk_en": "These are the appointed times of Adonoy which you shall proclaim [<b>cause<\/b>] them [<b>to occur<\/b>] [as] holy assemblies [<b>occurrences<\/b>], on which to bring a fire-offering to [<b>an offering before<\/b>] Adonoy; a burnt-offering and a meal-offering, a [<b>sacred-<\/b>]sacrifice and wine-offerings, each on its assigned day,", "pj": "אִילֵין זִמְנֵי סִדְרֵי מוֹעֲדַיָא דַיְיָ דִתְעַרְעוּן יַתְהוֹן מְאַרְעֵי קַדִישׁ לְקָרָבָא קוּרְבָּנָא לִשְׁמָא דַיְיָ עֲלָתָא וּמִנְחָתָא נִכְסַת קוּדְשִׁין וְנִיסוּכִין פִּתְגַם יוֹם בְּיוֹמֵיהּ", "pj_en": "These are the times of the order of the Lord's festivals which you are to convoke for holy convocations, to offer an oblation to the name of the Lord, a burnt sacrifice and a mincha, sanctified offerings and libations, the rite of a day in its day;", "tj": "", "tj_en": "", "rashi": "<b>עלה ומנחה.<\/b> מִנְחַת נְסָכִים הַקְּרֵבָה עִם הָעוֹלָה:<br><br><b>דבר יום ביומו.<\/b> חֹק הַקָּצוּב בְּחֻמַּשׁ הַפְּקוּדִים:<br><br><b>דבר יום ביומו.<\/b> הָא אִם עָבַר יוֹמוֹ בָּטֵל קָרְבָּנוֹ (עי' ספרא):", "rashi_en": "עלה ומנחה A BURNT OFFERING AND A MEAL OFFERING — This means the מנחת נסכים (the meal-offering due with the drink-offering) that is brought together with the‎ עולה (Menachot 44b)‎.<br><br>‎‎ביומו‎ ‎יום‎ ‎דבר  EVERYTHING UPON ITS DAY (lit., the thing of the day, on its day) — the quantity definitely assigned to each day in the Book of Numbers (cf. Rashi on Exodus 16:4).<br><br>דבר יום ביומו EVERYTHING UPON ITS DAY (which may mean the matter of the day shall be on its day) — consequently if its day (the day on which some particular one of these sacrifices is due) be past, it's (the day’s) offering is past (cf. Sifra, Emor, Section 12 9)."}, {"ch": 23, "v": 38, "aliyah": 6, "heb": "מִלְּבַ֖ד שַׁבְּתֹ֣ת יְהֹוָ֑ה וּמִלְּבַ֣ד מַתְּנֽוֹתֵיכֶ֗ם וּמִלְּבַ֤ד כׇּל־נִדְרֵיכֶם֙ וּמִלְּבַד֙ כׇּל־נִדְבֹ֣תֵיכֶ֔ם אֲשֶׁ֥ר תִּתְּנ֖וּ לַיהֹוָֽה׃", "onk": "בַּר שַׁבַּיָּא דַיְיָ וּבַר מַתְּנָתֵיכוֹן וּבַר כָּל נִדְרֵיכוֹן וּבַר כָּל נִדְבָתֵיכוֹן דִּי תִתְּנוּן <b>קֳדָם<\/b> יְיָ:", "onk_en": "Besides the [offerings of the] <i>Shabbasos<\/i> of Adonoy and besides your gifts and besides all your vow-offerings and besides all your free-will-offerings that you will give to [<b>before<\/b>] Adonoy.", "pj": "בַּר מִן יוֹמֵי שַׁבַּיָא דַיְיָ בַּר מִמַתְּנוֹתֵיכוֹן וּבַר מִנִדְרֵיכוֹן וּבַר מִכָּל נְסִיבְתֵּיכוֹן דְתִתְּנוּן קֳדָם יְיָ", "pj_en": "beside the days of the Lord's Sabbaths, beside your gifts, and beside your vows, and beside your free-will offering which you bring before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 39, "aliyah": 6, "heb": "אַ֡ךְ בַּחֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַחֹ֣דֶשׁ הַשְּׁבִיעִ֗י בְּאׇסְפְּכֶם֙ אֶת־תְּבוּאַ֣ת הָאָ֔רֶץ תָּחֹ֥גּוּ אֶת־חַג־יְהֹוָ֖ה שִׁבְעַ֣ת יָמִ֑ים בַּיּ֤וֹם הָֽרִאשׁוֹן֙ שַׁבָּת֔וֹן וּבַיּ֥וֹם הַשְּׁמִינִ֖י שַׁבָּתֽוֹן׃", "onk": "בְּרַם בְּחַמְשָׁא עֲשַׁר יוֹמָא לְיַרְחָא שְׁבִיעָאָה בְּמִכְנְשֵׁיכוֹן יָת עֲלַלַת אַרְעָא תְּחַגּוּן יָת חַגָּא <b>קֳדָם<\/b> יְיָ שִׁבְעָא יוֹמִין בְּיוֹמָא קַדְמָאָה נְיָחָא וּבְיוֹמָא תְמִינָאָה נְיָחָא:", "onk_en": "Indeed, on the fifteenth day of the seventh month, when you gather the produce of the land you shall celebrate the festival of [<b>before<\/b>] Adonoy for seven days. The first day is a day of rest and the eighth day is a day of rest.", "pj": "בְּרַם בַּחֲמֵיסַר יוֹמָא לְיַרְחָא שְׁבִיעָאָה בִּזְמַן מִכְנַשְׁכוֹן יַת עֲלַלְתָּא דְאַרְעָא תְּחַגוּן יַת חַגָא דַיְיָ שׁוּבְעָא יוֹמִין בְּיוֹמָא קַמָאָה נַיְיחָא וּבְיוֹם תְּמִינָאָה נַיְיחָא", "pj_en": "But on the fifteenth of the seventh month, at the time when you collect the produce of the ground, you shall solemnize a festival of the Lord seven days. On the first day, rest; and on the eighth day, rest.", "tj": "", "tj_en": "", "rashi": "<b>אך בחמשה עשר יום, תחגו.<\/b> קָרְבַּן שְׁלָמִים לַחֲגִיגָה, יָכוֹל תִּדְחֶה אֶת הַשַּׁבָּת, תַּ\"לֹ אַךְ, הוֹאִיל וְיֵשׁ לָהּ תַּשְׁלוּמִין כָּל שִׁבְעָה:<br><br><b>באספכם את תבואת הארץ.<\/b> שֶׁיְּהֵא חֹדֶשׁ שְׁבִיעִי זֶה בָּא בִּזְמַן אֲסִיפָה, מִכָּאן שֶׁנִּצְטַוּוּ לְעַבֵּר אֶת הַשָּׁנִים, שֶׁאִם אֵין הָעִבּוּר, פְּעָמִים שֶׁהוּא בְאֶמְצַע הַקַּיִץ אוֹ הַחֹרֶף:<br><br><b>תחגו.<\/b> שַׁלְמֵי חֲגִיגָה:<br><br><b>שבעת ימים.<\/b> אִם לֹא הֵבִיא בָזֶה, יָבִיא בָזֶה, יָכוֹל יְהֵא מְבִיאָן כָּל שִׁבְעָה, תַּלְמוּד לוֹמַר <b>וחגתם אתו<\/b> — יוֹם אֶחָד בְּמַשְׁמָע וְלֹא יוֹתֵר, וְלָמָּה נֶאֱמַר שִׁבְעָה? לְתַשְׁלוּמִין (חגיגה ט'):", "rashi_en": "אך בחמשה עשר יום... תחגו BUT ON THE FIFTEENTH DAY… YE SHALL OFFER A חג — i. e., a sacrifice of peace-offerings as a חגיגה (the pilgrims’ sacrifice on the Festivals) (Chagigah 9a). Since it states that this has to be brought on the fifteenth day of the month, one might think that it (the offering of קרבן חגיגה) shall set aside the Sabbath (supersede the Sabbath law, if that day be the fifteenth of the month)! Scripture, however, uses the word אך (the particle that implies a limitation; cf. Rashi on v. 27): suggesting that it must not be offered on Sabbath because it has a supplementary period consisting of all the seven days of the Festival.<br><br>באספכם את תבואת הארץ [ON THE FIFTEENTH DAY OF THE SEVENTH MONTH] WHEN YE GATHER IN THE INCREASE OF THE LAND — This tells us that this seventh month (in which סכות occurs) must be at the time of the ingathering. Hence we learn that they are enjoined to intercalate the years if necessary (Sifra, Emor, Chapter 15 6), because if there be no such intercalation it (the seventh month) would sometimes fall in the middle of the summer or of the winter.<br><br>תחגו YE SHALL CELEBRATE (OFFER) the peace-offerings of the חגיגה.<br><br>שבעת ימים  SEVEN DAYS (during seven days), meaning that if one has not brought them on one he may bring them on another of the seven days. But I might think that the meaning is that one has to offer them on each of the seven days! Scripture, however, states (v. 41): וחגתם אתו, “and ye shall make it the day of the חגיגה” — this implies one day and no more. Why, then, does Scripture say “seven”? In reference to the supplementary period (Chagigah 9a)."}, {"ch": 23, "v": 40, "aliyah": 6, "heb": "וּלְקַחְתֶּ֨ם לָכֶ֜ם בַּיּ֣וֹם הָרִאשׁ֗וֹן פְּרִ֨י עֵ֤ץ הָדָר֙ כַּפֹּ֣ת תְּמָרִ֔ים וַעֲנַ֥ף עֵץ־עָבֹ֖ת וְעַרְבֵי־נָ֑חַל וּשְׂמַחְתֶּ֗ם לִפְנֵ֛י יְהֹוָ֥ה אֱלֹהֵיכֶ֖ם שִׁבְעַ֥ת יָמִֽים׃", "onk": "וְתִסְּבוּן לְכוֹן בְּיוֹמָא קַדְמָאָה פֵּרֵי אִילָנָא <b>אֶתְרוֹגִין וְלֻלַּבִּין<\/b> וַהֲדַסִּין וְעַרְבִין דִּנְחָל וְתֶחֱדוּן קֳדָם יְיָ אֱלָהָכוֹן שַׁבְעַת יוֹמִין:", "onk_en": "You shall take for yourselves, on the first day, the fruit of the beautiful tree (<i>esrog<\/i>) [<b>esrogim<\/b>], a branch of palm trees (<i>lulav<\/i>) [<b>lulavim<\/b>], boughs of thick-leaved trees (<i>hadasim<\/i>), and willows of the brook (<i>aravos<\/i>), and you shall rejoice before Adonoy, your God, for seven days.", "pj": "וְתִסְבּוּן מִן דִלְכוֹן בְּיוֹמָא קַמָאָה דְחַגָא פֵּירֵי אִילַן מְשֻׁבַּח תְּרוּגִין וְלוּלַבִין וְהַדַסִין וְעַרְבִין דְמַרְבְּיַין עַל נַחֲלִין וְתֵיחְדוּן קֳדָם יְיָ אֱלָהָכוֹן שִׁבְעָתֵי יוֹמִין", "pj_en": "And of your own shall you take on the first day of the feast, the fruits of praiseworthy trees, citrons, and lulabin, and myrtles, and willows that grow by the brooks; and you shall rejoice before the Lord your God seven days.", "tj": "תְּרוּגִין וְלוּלַבִּין:", "tj_en": "Citrons and lulabs.", "rashi": "<b>פרי עץ הדר.<\/b> עֵץ שֶׁטַּעַם עֵצוֹ וּפִרְיוֹ שָׁוֶה (סכה ל\"ה):<br><br><b>הדר.<\/b> הַדָּר בְּאִילָנוֹ מִשָּׁנָה לְשָׁנָה, וְזֶהוּ אֶתְרוֹג (שם):<br><br><b>כפת תמרים.<\/b> חָסֵר וי\"ו, לִמֵּד שֶׁאֵינָהּ אֶלָּא אַחַת:<br><br><b>וענף עץ עבת.<\/b> שֶׁעֲנָפָיו קְלוּעִים כַּעֲבוֹתוֹת וְכַחֲבָלִים, וְזֶהוּ הֲדַס, הֶעָשׂוּי כְּמִין קְלִיעָה (שם ל\"ב):", "rashi_en": "פרי עץ הדר THE FRUIT OF THE TREE HADAR — a tree the wood of which (עץ) has the same taste as its fruit (פרי) (Sifra, Emor, Chapter 16 4; Sukkah 35a).<br><br>הדר — It is called הדר because it is the tree whose fruit remains (הַדָּר) on the tree from one year to another (several years) — and this is the “Ethrog”.<br><br>כפת תמרים A BRANCH OF PALM TREES — The word כפת is written defective (without ו, not כפות) to intimate that only one branch is intended (Sukkah 32a).<br><br>וענף עץ עבת AND BOUGHS OF THE TREE עבת — i. e. of a tree whose boughs are, as it were, plaited (intertwined one with another) like ropes (עבתות) and cords; this is the myrtle plant which is indeed formed as a plait (three leaves issuing from one point of the branch and covering it) (Sukkah 32b)."}, {"ch": 23, "v": 41, "aliyah": 6, "heb": "וְחַגֹּתֶ֤ם אֹתוֹ֙ חַ֣ג לַֽיהֹוָ֔ה שִׁבְעַ֥ת יָמִ֖ים בַּשָּׁנָ֑ה חֻקַּ֤ת עוֹלָם֙ לְדֹרֹ֣תֵיכֶ֔ם בַּחֹ֥דֶשׁ הַשְּׁבִיעִ֖י תָּחֹ֥גּוּ אֹתֽוֹ׃", "onk": "וּתְחַגּוּן יָתֵיהּ חַגָּא <b>קֳדָם<\/b> יְיָ שַׁבְעַת יוֹמִין בְּשַׁתָּא קְיַם עָלָם לְדָרֵיכוֹן בְּיַרְחָא שְׁבִיעָאָה תְּחַגּוּן יָתֵיהּ:", "onk_en": "You shall celebrate it as a festival to [<b>before<\/b>] Adonoy seven days in the year; it is an everlasting statute throughout your generations in the seventh month, you shall celebrate it.", "pj": "וּתְחַגוּן יָתֵיהּ חַגָא קֳדָם יְיָ שׁוּבְעָא יוֹמִין בְּשַׁתָּא קְיַים עֲלָם לְדָרֵיכוֹן בְּיַרְחָא שְׁבִיעָאָה תְּחַגוּן יָתֵיהּ", "pj_en": "And you shall solemnize it before the Lord seven days in the year, by an everlasting statute in your generations shall you observe it in the seventh month.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 23, "v": 42, "aliyah": 6, "heb": "בַּסֻּכֹּ֥ת תֵּשְׁב֖וּ שִׁבְעַ֣ת יָמִ֑ים כׇּל־הָֽאֶזְרָח֙ בְּיִשְׂרָאֵ֔ל יֵשְׁב֖וּ בַּסֻּכֹּֽת׃", "onk": "<b>בִּמְטַלַּיָּא<\/b> תֵיתְבוּן שַׁבְעַת יוֹמִין כָּל <b>יַצִּיבָא<\/b> בְּיִשְׂרָאֵל <b>יֵתְבוּן בִּמְטַלַּיָּא<\/b>:", "onk_en": "You shall dwell in the [<b>shelters<\/b>] <i>sukkos<\/i> seven days, every native born [<b>settled<\/b>] Israelite shall dwell in the [<b>shelters<\/b>] <i>sukkos<\/i>.", "pj": "בִּמְטַלַלְתָּ דִתְרֵי דוֹפְנַיָיהָא כְּהִלְכַתְהוֹן וּתְלִיתַיָיא עַד פּוּשְׁכָא וְטוּלָהּ סַגִי מִשִׁימְשָׁהּ מִתְעַבְדָא לְטוּלָא לְשׁוּם חַגָא מִן זַיינִין דְמַרְבְּיַין מִן אַרְעָא וּתְלִישִׁין מְשַׁחֲתָהָא עַד שַׁבְעָא פּוּשְׁכֵי וַחֲלָלָא דְרוֹמָא עַשְרָא פּוּשְׁכֵי תֵּיתְבוּן בָּהּ שׁוּבְעָא יוֹמִין כָּל דְכוּרַיָא בְּיִשְרָאֵל וַאֲפִילוּ זְעִירֵי דְלָא צְרִיכִין לְאִימְהוֹן יֵתְבוּן בִּמְטָלַיָא מְבָרְכִין לְבַרְיֵיהוֹן כָּל אֵימַת דְעַיְילִין תַּמָן", "pj_en": "In tabernacles of two sides according to their rule, and the third a handbreadth (higher), that its shaded part may be greater than that into which cometh the sunshine; to be made for a bower (or shade) for the feast, from different kinds (of materials) which spring from the earth and are uprooted: in measure seven palms, but the height within ten palms. In it you shall sit seven days; the males in Israel, and children who need not their mothers, shall sit in the tabernacles, blessing their Creator whenever they enter thereinto.", "tj": "", "tj_en": "", "rashi": "<b>האזרח.<\/b> זֶה אֶזְרָח, <b>בישראל<\/b> — לְרַבּוֹת אֶת הַגֵּרִים (ספרא):", "rashi_en": "האזרח THE NATIVE — Since this word means native-born, the word בישראל, ANYONE IN ISRAEL, serves to include the proselytes (cf. Sifra, Emor, Chapter 17 9)."}, {"ch": 23, "v": 43, "aliyah": 6, "heb": "לְמַ֘עַן֮ יֵדְע֣וּ דֹרֹֽתֵיכֶם֒ כִּ֣י בַסֻּכּ֗וֹת הוֹשַׁ֙בְתִּי֙ אֶת־בְּנֵ֣י יִשְׂרָאֵ֔ל בְּהוֹצִיאִ֥י אוֹתָ֖ם מֵאֶ֣רֶץ מִצְרָ֑יִם אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃", "onk": "בְּדִיל דִּיִדְּעוּן דָּרֵיכוֹן אֲרֵי בִמְטַלָּיוּת עֲנָנֵי אוֹתֵבִית יָת בְּנֵי יִשְׂרָאֵל בְּאַפָּקוּתִי יָתְהוֹן מֵאַרְעָא דְמִצְרָיִם אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "So that your generations will know that in the [<b>clouds of shelter<\/b>] <i>sukkos<\/i> I caused Bnei Yisroel to dwell when I took them out from the land of Egypt, I am Adonoy, your God.", "pj": "מִן בִּגְלַל דְיֵדְעוּן דָרֵיכוֹן אֲרוּם בְּמַטְלַת עֲנָנֵי יְקָרָא אוֹתֵיבִית יַת בְּנֵי יִשְרָאֵל בִּזְמַן דְהַנְפֵּיקִית יַתְהוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרָיִם אֲנָא הוּא יְיָ אֳלָהָכוֹן", "pj_en": "That your generations may know how, under the shadow of the cloud of glory, I made the sons of Israel to dwell at the time that I brought them out redeemed from the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>כי בסכות הושבתי.<\/b> עַנְנֵי כָבוֹד (שם; מכילתא י\"ב):", "rashi_en": "כי בסכות הושבתי THAT I MADE [THE CHILDREN OF ISRAEL] ABIDE IN BOOTHS — This does not mean literally “booths” but, “the clouds of Glory\" by which they were sheltered (cf. Onkelos; Sifra, Emor, Chapter 17 11; Mekhilta; Sukkah 11b)."}, {"ch": 23, "v": 44, "aliyah": 6, "heb": "וַיְדַבֵּ֣ר מֹשֶׁ֔ה אֶֽת־מֹעֲדֵ֖י יְהֹוָ֑ה אֶל־בְּנֵ֖י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמַלִּיל משֶׁה יָת <b>סְדַר<\/b> מוֹעֲדַיָּא דַיְיָ <b>וְאַלֵּפִנּוּן<\/b> לִבְנֵי יִשְׂרָאֵל:", "onk_en": "And thus Moshe declared the [<b>order of the<\/b>] appointed times of Adonoy [<b>and taught them<\/b>] to Bnei Yisroel.", "pj": "וּמַלֵיל משֶׁה יַת זְמַן סִדוּרֵי מוֹעֲדַיָא דַיְיָ וְאַלֵיפִינוּן לִבְנֵי יִשְרָאֵל", "pj_en": "And Mosheh declared the time of the orders of the Lord's festivals, and taught them to the sons of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 1, "aliyah": 7, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh,saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 2, "aliyah": 7, "heb": "צַ֞ו אֶת־בְּנֵ֣י יִשְׂרָאֵ֗ל וְיִקְח֨וּ אֵלֶ֜יךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַמָּא֑וֹר לְהַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׃", "onk": "פַּקֵּד יָת בְּנֵי יִשְׂרָאֵל וְיִסְּבוּן לָךְ מְשַׁח זֵיתָא דַכְיָא כָּתִישָׁא לְאַנְהָרָא לְאַדְלָקָא <b>בוֹצִינַיָּא<\/b> תְּדִירָא:", "onk_en": "Command Bnei Yisroel to take (bring) to you pure, pressed, olive oil for illumination to keep the lamp [<b>lamps<\/b>] burning constantly.", "pj": "פַּקֵיד יַת בְּנֵי יִשְרָאֵל וְיִסְבוּן מִן דִילָךְ מְשַׁח זֵיתָא זַכִּיךְ כָּתִישׁ לְאַנְהָרָא לְאַדְלָקָא בּוֹצִינַיָא תְּדִירָא בְּיוֹמָא דְשַׁבְּתָּא וּבְיוֹמָא דְעוּבְדָא", "pj_en": "Command the children of Israel that they bring of their own, pure beaten olive oil for the light, that the lamps may burn continually, on the day of Sabbath, and on the day of work;", "tj": "", "tj_en": "", "rashi": "<b>צו את בני ישראל.<\/b> זוֹ פָרָשַׁת מִצְוַת הַנֵּרוֹת, וּפָרָשַׁת וְאַתָּה תְּצַוֶּה לֹא נֶאֶמְרָה אֶלָּא עַל סֵדֶר מְלֶאכֶת הַמִּשְׁכָּן, לְפָרֵשׁ צֹרֶךְ הַמְּנוֹרָה, וְכֵן מַשְׁמָע: וְאַתָּה סוֹפְךָ לְצַוּוֹת אֶת בְּנֵי יִשְׂרָאֵל עַל כָּךְ:<br><br><b>שמן זית זך.<\/b> שְׁלוֹשָׁה שְׁמָנִים יוֹצְאִים מִן הַזַּיִת, הָרִאשׁוֹן קָרוּי זָךְ, וְהֵן מְפֹרָשִׁין בִּמְנָחוֹת (דף פ\"ו) וּבְתֹ\"כֹּ:<br><br><b>תמיד.<\/b> מִלַּיְלָה לְלַיְלָה, כְּמוֹ עוֹלַת תָּמִיד, שֶׁאֵינָהּ אֶלָּא מִיּוֹם לְיוֹם:", "rashi_en": "צו את בני ישראל COMMAND THE CHILDREN OF ISRAEL [THAT THEY BRING UNTO THEE CLEAR OLIVE OIL, BEATEN, FOR THE LIGHT] — This is the section containing the commandment concerning the lamps, whilst the section beginning with ואתה תצוה (Exodus 27:20 ff.) which also deals with the lamp is only mentioned there for the sake of giving an orderly account of the work of the Tabernacle, to explain what the purpose of the candlestick was — for thus do those words ואתה תצוה imply: “and thou wilt at some future time command the Children of Israel” about this. <br><br>שמן זית זך CLEAR OLIVE OIL — Three different qualities of oil come forth (are extracted) from the olive tree, the first of which is called זך, “clear”. They are all fully explained in Treatise Menachot 86a and in Torath Cohanim (Sifra, Emor, Section 13 1-3).<br><br>תמיד (continually not continuously) here implies from night to night. It has the same meaning as in עולת תמיד a “continual” burnt offering which was only sacrificed from day to day (cf. Rashi on Exodus 27:20)."}, {"ch": 24, "v": 3, "aliyah": 7, "heb": "מִחוּץ֩ לְפָרֹ֨כֶת הָעֵדֻ֜ת בְּאֹ֣הֶל מוֹעֵ֗ד יַעֲרֹךְ֩ אֹת֨וֹ אַהֲרֹ֜ן מֵעֶ֧רֶב עַד־בֹּ֛קֶר לִפְנֵ֥י יְהֹוָ֖ה תָּמִ֑יד חֻקַּ֥ת עוֹלָ֖ם לְדֹרֹֽתֵיכֶֽם׃", "onk": "מִבָּרָא לְפָרֻכְתָּא דְסַהֲדוּתָא בְּמַשְׁכַּן זִמְנָא יַסְדַּר יָתֵיהּ אֲהֲרֹן מֵרַמְשָׁא עַד צַפְרָא קֳדָם יְיָ תְּדִירָא קְיָם עָלָם לְדָרֵיכוֹן:", "onk_en": "Outside of the Curtain of the Testimony, which is inside the Tent of Meeting, Aharon shall arrange it [so that it burns] from evening until morning before Adonoy, continually; as an everlasting statute throughout your generations.", "pj": "מִבָּרָא לְפַרְגוֹדָא דְסַהֲדוּתָא לְעַלְמָא דִשְׁכִינְתָּא שַׁרְיָא בְּיִשְרָאֵל בְּמַשְׁכַּן זִמְנָא יְסַדֵר יָתֵיהּ אַהֲרן מֵרַמְשָׁא וְעַד צַפְרָא קֳדָם יְיָ תְּדִירָא קְיַים עֲלָם לְדָרֵיכוֹן", "pj_en": "outside of the veil of the testimony for evermore, because the Shekinah dwelleth in Israel: in the tabernacle of ordinance shall Aharon order it from evening till morning before the Lord continually, by an everlasting statute unto your generations.", "tj": "", "tj_en": "", "rashi": "<b>לפרכת העדת.<\/b> שֶׁלִּפְנֵי הָאָרוֹן שֶׁהוּא קָרוּי עֵדוּת; וְרַבּוֹתֵינוּ דָרְשׁוּ עַל נֵר מַעֲרָבִי, שֶׁהוּא עֵדוּת לְכָל בָּאֵי עוֹלָם שֶׁהַשְּׁכִינָה שׁוֹרָה בְיִשְׂרָאֵל, שֶׁנּוֹתֵן בָּהּ שֶׁמֶן כְּמִדַּת חַבְרוֹתֶיהָ, וּמִמֶּנָּה הָיָה מַתְחִיל וּבָהּ הָיָה מְסַיֵּם (שבת כ\"ב; מנחות פ\"ו):<br><br><b>יערך אתו אהרן מערב עד בקר.<\/b> יַעֲרֹךְ אוֹתוֹ עֲרִיכָה הָרְאוּיָה לְמִדַּת כָּל הַלַּיְלָה, וְשִׁעֲרוּ חֲכָמִים חֲצִי לֹג לְכָל נֵר וָנֵר, וְהֵן כְּדַאי אַף לְלֵילֵי תְּקוּפַת טֵבֵת, וּמִדָּה זוֹ הֻקְבְּעָה לָהֶם (מנחות פ\"ט):", "rashi_en": "לפרכת העדת [WITHOUT] THE PARTITION VAIL OF THE TESTIMONY — i. e. the Partition Vail which is before the Ark which on account of its contents (the Tablets, termed לחות העדות in Exodus 37:15) is called “Testimony”. Our Rabbis, however, explained it (the word העדות) as referring to the western light of the candlestick which was a testimony (עדות) to mankind that the Shechinah dwelt in Israel through the miracle wrought in connection with it; for he (the priest) put only as much oil into it as was the quantity put into the other lamps and yet he began the lighting of the other lamps in the evening by it and finished the work of cleaning with it [since it continued to burn miraculously until the following evening] (Sifra, Emor, Section 13 9; Shabbat 22b; Menachot 86b).<br><br>יערך אתו אהרן מערב עד בקר AARON SHALL SET IT IN ORDER FROM EVENING UNTO MORNING — The meaning is not that he shall occupy himself the whole night with setting the lights in order, but he shall arrange it in such a manner (lit., by such an arrangement) that will prove adequate for the length of the whole night. Our Rabbis by experiment (cf. Menachot 89a) fixed the quantity at a half log oil for each lamp, ascertaining that this would suffice also in the long nights of the Teveth quarter; and this quantity therefore became to them the fixed measure [for all the seasons of the year]."}, {"ch": 24, "v": 4, "aliyah": 7, "heb": "עַ֚ל הַמְּנֹרָ֣ה הַטְּהֹרָ֔ה יַעֲרֹ֖ךְ אֶת־הַנֵּר֑וֹת לִפְנֵ֥י יְהֹוָ֖ה תָּמִֽיד׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "עַל מְנַרְתָּא דָכִיתָא יַסְדַּר יָת בּוֹצִינַיָּא קֳדָם יְיָ תְּדִירָא:", "onk_en": "Atop the pure menorah he shall arrange the lights before Adonoy, constantly.", "pj": "עַל מְנַרְתָּא דָכִיתָא יְסַדֵר יַת בּוֹצִינַיָא קֳדָם יְיָ תְּדִירָא", "pj_en": ". . .", "tj": "", "tj_en": "", "rashi": "<b>המנרה הטהרה.<\/b> שֶׁהִיא זָהָב טָהוֹר; דָּ\"אַ עַל טָהֳרָהּ שֶׁל מְנוֹרָה, שֶׁמְּטַהֲרָהּ וּמְדַשְּׁנָהּ תְּחִלָּה מִן הָאֵפֶר (עי' ספרא):", "rashi_en": "המנרה הטהרה THE PURE CANDELABRUM — It was so called because it was made of pure gold. Another explanation is: he shall set the lights in order upon the purity of the candlestick, implying that he must first purify (cleanse) it and remove its ashes beforehand (the words therefore mean: on a clean candlestick; cf., however, Sifra, Emor, Section 13 12 where the word is explained differently)."}, {"ch": 24, "v": 5, "aliyah": 7, "heb": "וְלָקַחְתָּ֣ סֹ֔לֶת וְאָפִיתָ֣ אֹתָ֔הּ שְׁתֵּ֥ים עֶשְׂרֵ֖ה חַלּ֑וֹת שְׁנֵי֙ עֶשְׂרֹנִ֔ים יִהְיֶ֖ה הַֽחַלָּ֥ה הָאֶחָֽת׃", "onk": "וְתִסַּב סֻלְתָּא וְתֵיפֵי יָתַהּ תַּרְתָּא עַשְׂרֵי גְּרִיצָן תְּרֵין עֶשְׂרוֹנִין תְּהֵי גְּרִצְתָּא חֲדָא:", "onk_en": "You shall take fine flour and bake twelve loaves, each individual loaf shall be two tenths [of an <i>ephah<\/i>].", "pj": "וְתִיסַב סְמִידָא וְתֵיפֵי יָתָהּ תְּרֵיסְרֵי גְרִיצָן שָׁוִוין לִתְלֵיסַר שִׁבְטַיָא תְּרֵי עֶשְרוֹנִין תְּהֵי גְרִיצְתָּא חֲדָא", "pj_en": "And thou shalt take flour, and bake thereof twelve cakes, according to the twelve tribes; two tenths shall be one cake.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 6, "aliyah": 7, "heb": "וְשַׂמְתָּ֥ אוֹתָ֛ם שְׁתַּ֥יִם מַֽעֲרָכ֖וֹת שֵׁ֣שׁ הַֽמַּעֲרָ֑כֶת עַ֛ל הַשֻּׁלְחָ֥ן הַטָּהֹ֖ר לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וּתְשַׁוִּי יָתְהוֹן תַּרְתֵּין סִדְרִין שִׁית סִדְרָא עַל פָּתוֹרָא דַכְיָא קֳדָם יְיָ:", "onk_en": "You shall place them in two stacks, six in each stack on the Pure Table, before Adonoy.", "pj": "וּתְסַדֵר יַתְהוֹן תַּרְתֵּין סִדוּרִין שִׁית בְּסִדְרָא חֲדָא וְשִׁית בְּסִדְרָא חֲדָא עַל פְּתוֹרָא בִּטְהֲרֵיהּ דִמְסַדֵר קֳדָם יְיָ", "pj_en": "And thou shalt set them in two orders (rows), six in one order, and six in the other upon the table in its purity, as it is ordained before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>שש המערכת.<\/b> שֵׁשׁ חַלּוֹת הַמַּעֲרֶכֶת הָאַחַת:<br><br><b>השלחן הטהר.<\/b> שֶׁל זָהָב טָהוֹר; דָּ\"אַ: עַל טָהֳרוֹ שֶׁל שֻׁלְחָן, שֶׁלֹּא יִהְיוּ הַסְּנִיפִין מַגְבִּיהִין אֶת הַלֶּחֶם מֵעַל גַּבֵּי הַשֻּׁלְחָן (שם; מנחות צ\"ז):", "rashi_en": "שש המערכת SIX ON A ROW — i. e. six cakes shall form one row.<br><br>השלחן הטהר THE PURE TABLE — i. e. the table of pure gold (cf. Rashi on v. 4). Another explanation is that על השלחן הטהר means: immediately upon the טהר of the table (i. e. its top and they must not rest upon something else that is placed on the table-top) — i. e. that the supporting pillars (cf. Rashi on Exodus 25:29) must not raise the bread (i. e. the lowest loaves) above the top of the table (Sifra, Emor, Chapter 18 4; Menachot 97a)."}, {"ch": 24, "v": 7, "aliyah": 7, "heb": "וְנָתַתָּ֥ עַל־הַֽמַּעֲרֶ֖כֶת לְבֹנָ֣ה זַכָּ֑ה וְהָיְתָ֤ה לַלֶּ֙חֶם֙ לְאַזְכָּרָ֔ה אִשֶּׁ֖ה לַֽיהֹוָֽה׃", "onk": "וְתִתֵּן עַל סִדְרָא לְבֻנְתָּא דָכִיתָא וּתְהֵי לִלְחֵם לְאִדְכַּרְתָּא <b>קֻרְבָּנָא קֳדָם<\/b> יְיָ:", "onk_en": "You shall put pure frankincense on [each] stack and it shall be as a memorial portion for the bread, as a fire-offering, to [<b>an offering before<\/b>] Adonoy.", "pj": "וְתִתֵּן עַל סִידוּרַיָא צְרִיד לְבוֹנְתָּא בְּרִירְתָּא וּתְהֵי לְלַחֲמָא לְאַדְכָּרָא קוּרְבָּנָא קֳדָם יְיָ", "pj_en": "And thou shalt put upon the orders pure frankincense, that it may be an oblation of memorial bread before the Lord.", "tj": "", "tj_en": "", "rashi": "<b>ונתת על המערכת.<\/b> עַל כָּל אַחַת מִשְּׁתֵי הַמַּעֲרָכוֹת; וְהָיוּ שְׁנֵי בְזִיכֵי לְבוֹנָה מְלֹא קֹמֶץ לְכָל אַחַת:<br><br><b>והיתה.<\/b> הַלְּבוֹנָה הַזֹּאת:<br><br><b>ללחם לאזכרה.<\/b> שֶׁאֵין מִן הַלֶּחֶם לְגָבוֹהַּ כְּלוּם, אֶלָּא הַלְּבוֹנָה נִקְטֶרֶת כְּשֶׁמְּסַלְּקִין אוֹתוֹ בְּכָל שַׁבָּת וְשַׁבָּת, וְהִיא לְזִכָּרוֹן לַלֶּחֶם, שֶׁעַל יָדָהּ הוּא נִזְכָּר לְמַעְלָה, כַּקֹּמֶץ שֶׁהִיא אַזְכָּרָה לַמִּנְחָה (עי' ספרא):", "rashi_en": "ונתת על המערכת AND THOU SHALT PUT UPON THE ROW — i. e. upon each of the two rows [PURE FRANKINCENSE]; there were two bowls for this frankincense, each filled with a handful of it.<br><br>והיתה THAT IT — this frankincense — MAY BE<br><br>ללחם לאזכרה ON THE BREAD FOR A MEMORIAL — because of the bread itself nothing was offered to the Lord, but the frankincense was burnt when the former was removed from the golden table every Sabbath. It (the frankincense) thus served as a memorial for the bread, because through it, it (the bread) was recalled to memory Above (the bread itself was not offered) just as the “handful” of flour and of oil (Leviticus 2:2) was “the memorial portion” of the meal offering being the only part offered, while the remainder was eaten by the priests just as this bread was."}, {"ch": 24, "v": 8, "aliyah": 7, "heb": "בְּי֨וֹם הַשַּׁבָּ֜ת בְּי֣וֹם הַשַּׁבָּ֗ת יַֽעַרְכֶ֛נּוּ לִפְנֵ֥י יְהֹוָ֖ה תָּמִ֑יד מֵאֵ֥ת בְּנֵֽי־יִשְׂרָאֵ֖ל בְּרִ֥ית עוֹלָֽם׃", "onk": "בְּיוֹמָא דְשַׁבְּתָא בְּיוֹמָא דְשַׁבְּתָא יַסְדְּרִנֵּיהּ <b>קֳדָם<\/b> יְיָ תְּדִירָא מִן קֳדָם בְּנֵי יִשְׂרָאֵל קְיַם עָלָם:", "onk_en": "On each and every <i>Shabbos<\/i> he shall arrange them before Adonoy, continually, from [<b>before<\/b>] Bnei Yisroel as an eternal covenant.", "pj": "בְּיוֹמָא דְשַׁבְּתָּא בְּיוֹמָא דְשַׁבְּתָּא יְסַדְרִינֵיהּ חֲדַת קֳדָם יְיָ תְּדִירָא מִן בְּנֵי יִשְרָאֵל קְיַים עֲלָם", "pj_en": "From Sabbath day to Sabbath day he shall order it anew before the Lord continually from the children of Israel. This shall be an everlasting statute.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 9, "aliyah": 7, "heb": "וְהָֽיְתָה֙ לְאַהֲרֹ֣ן וּלְבָנָ֔יו וַאֲכָלֻ֖הוּ בְּמָק֣וֹם קָדֹ֑שׁ כִּ֡י קֹ֩דֶשׁ֩ קׇֽדָשִׁ֨ים ה֥וּא ל֛וֹ מֵאִשֵּׁ֥י יְהֹוָ֖ה חׇק־עוֹלָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "וּתְהֵי לְאַהֲרֹן וְלִבְנוֹהִי וְיֵכְלֻנֵּיהּ בַּאֲתַר קַדִּישׁ אֲרֵי קֹדֶשׁ קוּדְשִׁין הוּא לֵיהּ <b>מִקֻּרְבָּנַיָּא<\/b> דַיְיָ קְיַם עָלָם:", "onk_en": "It shall belong to Aharon and to his sons and they shall eat it in a sacred place, for it is most holy for him from among the fire-offerings [<b>offerings<\/b>] of Adonoy, as an everlasting statute.", "pj": "וּתְהֵי לְאַהֲרן וְלִבְנוֹי וְיֵכְלוּנֵיהּ מִן בָּתַר אִסְתַּלְקוּתֵיהּ מֵעַל פָּתוֹרָא בַּאֲתַר קַדִישׁ אֲרוּם קוֹדֶשׁ קוּדְשִׁין הוּא לֵיהּ מִקוּרְבָּנַיָא דַיְיָ קְיַים עֲלָם", "pj_en": "And it shall be for Aharon and for his sons, and they shall eat it after they have taken it from off the table in the holy place; for it is most sacred to him of the oblations of the Lord by an everlasting statute.", "tj": "", "tj_en": "", "rashi": "<b>והיתה.<\/b> הַמִּנְחָה הַזֹּאת, שֶׁכָּל דָּבָר הַבָּא מִן הַתְּבוּאָה בִּכְלַל מִנְחָה הוּא:<br><br><b>ואכלהו.<\/b> מוּסָב עַל הַלֶּחֶם שֶׁהוּא לְשׁוֹן זָכָר:", "rashi_en": "והיתה AND IT SHALL BE — this meal-offering shall be — [AARON’S AND HIS SONS’]; (although the word מנחה is not mentioned in the text it is implicitly contained in the word לחם) because anything that is brought (offered) of grain comes under the term of ‎מנחה.<br><br>ואכלהו‎ AND THEY SHALL EAT IT; the suffix which is masc. refers to לחם which is masculine."}, {"ch": 24, "v": 10, "aliyah": 7, "heb": "וַיֵּצֵא֙ בֶּן־אִשָּׁ֣ה יִשְׂרְאֵלִ֔ית וְהוּא֙ בֶּן־אִ֣ישׁ מִצְרִ֔י בְּת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וַיִּנָּצוּ֙ בַּֽמַּחֲנֶ֔ה בֶּ֚ן הַיִּשְׂרְאֵלִ֔ית וְאִ֖ישׁ הַיִּשְׂרְאֵלִֽי׃", "onk": "וּנְפַק בַּר אִתְּתָא בַת יִשְׂרָאֵל וְהוּא בַּר גְּבַר מִצְרָאָה בְּגוֹ בְּנֵי יִשְׂרָאֵל וּנְצוֹ בְּמַשְׁרִיתָא בַּר אִתְּתָא בַת יִשְׂרָאֵל וְגַבְרָא בַּר יִשְׂרָאֵל:", "onk_en": "The son of an Israelite woman went out, and he was the son of an Egyptian man, among Bnei Yisroel. They argued in the encampment—the son of the Israelite woman, and the Israelite man.", "pj": "גַבְרָא חַיָיבָא מְרוֹד בֶּאֱלָהָא שְׁמַיָא נְפַק מִמִצְרַיִם בַּר גַבְרָא מִצְרָאָה דְקָטַל גַבְרָא בַּר יִשְרָאֵל בְּמִצְרַיִם וְעָאַל עַל אִנְתְּתֵיהּ וְאִתְעַבָּרַת וִילֵידַת בַּר בְּגוֹ בְנֵי יִשְרָאֵל וְכַד הֲווֹן יִשְרָאֵל שַׁרְיָין בְּמַדְבְּרָא בָּעָא לְמִפְרוֹס מַשְׁכְּנֵיהּ בְּגוֹ שִׁבְטָא דִבְנֵי דָן וְלָא שַׁבְקוּהָ מִן בִּגְלַל דְטִיכְסִין דְיִשְרָאֵל גְבַר עַל טִיכְסֵיהּ בְּאַתְוָון לְיֵיחוּס אַבָהַתְהוֹן שַׁרְיָין וְאִתְקוֹטְטוּ כַּחֲדָא בְּמַשְׁרִיתָא וַאֲזָלוּ לְבֵי דִינָא בַּר אִתְּתָא בַּת יִשְרָאֵל וְגַבְרָא בַּר יִשְרָאֵל דְמִן שִׁבְטָא דְדָן", "pj_en": "But a wicked man, a rebel against the God of heaven, had come out of Mizraim, the son of the Mizraite man who had killed the man of Israel in Mizraim, and had gone in unto his wife, who conceived and bare a son among the children of Israel. And while the Israelites were dwelling in the wilderness, he had sought to spread his tent in the midst of the tribe of the children of Dan; but they would not permit him, because in the arrangements of Israel every man dwelt with his family by the ensigns of the house of their fathers. And they contended together in the camp, and the son of the Israelitess with a man of Israel, who was of the tribe of Dan, went to the house of judgment;", "tj": "", "tj_en": "", "rashi": "<b>ויצא בן אשה ישראלית.<\/b> מֵהֵיכָן יָצָא? רַבִּי לֵוִי אוֹמֵר מֵעוֹלָמוֹ יָצָא, רַבִּי בְּרֶכְיָה אוֹמֵר מִפָּרָשָׁה שֶׁלְּמַעְלָה יָצָא, לִגְלֵג וְאָמַר \"בְּיוֹם הַשַּׁבָּת יַעַרְכֶנּוּ\" דֶּרֶךְ הַמֶּלֶךְ לֶאֱכֹל פַּת חַמָּה בְכָל יוֹם, שֶׁמָּא פַּת צוֹנֶנֶת שֶׁל תִּשְׁעָה יָמִים, בִּתְמִיהָ? וּמַתְנִיתָא אֲמַרָה מִבֵּית דִּינוֹ שֶׁל מֹשֶׁה יָצָא, מְחֻיָּב, בָּא לִטַּע אָהֳלוֹ בְתוֹךְ מַחֲנֵה דָן, אָמְרוּ לוֹ מַה טִּיבְךָ לְכָאן? אָמַר לָהֶם מִבְּנֵי דָּן אֲנִי, אָמְרוּ לוֹ \"אִישׁ עַל דִּגְלוֹ בְאֹתֹת לְבֵית אֲבֹתָם\" כְּתִיב (במדבר ב'), נִכְנַס לְבֵית דִּינוֹ שֶׁל מֹשֶׁה וְיָצָא מְחֻיָּב, עָמַד וְגִדֵּף (ספרא, ויקרא ל\"ב):<br><br><b>בן איש מצרי.<\/b> הוּא הַמִּצְרִי שֶׁהָרַג מֹשֶׁה (שם):<br><br><b>בתוך בני ישראל.<\/b> מְלַמֵּד שֶׁנִּתְגַיֵּר (ספרא):<br><br><b>וינצו במחנה.<\/b> עַל עִסְקֵי הַמַּחֲנֶה:<br><br><b>ואיש הישראלי.<\/b> זֶה שֶׁכְּנֶגְדּוֹ שֶׁמִּחָה בוֹ מִטַּע אָהֳלוֹ:", "rashi_en": "ויצא בן אשה ישראלית AND THE SON OF THE ISRAELITISH WOMAN WENT OUT — Whence did he go out? Surely not from the camp, since Scripture states “and they strove in the camp”! Rabbi Levi said, “He went out from (by his blasphemous utterance he lost) his eternal life (עולמו; R. Levi evidently connects ויצא with the last word of v. 8; “the everlasting covenant, ברית עולם”). R. Berachya said, “He set forth (יצא) (started his argument) from the above section. He said sneeringly: “Every Sabbath he shall set it in order!? Surely it is the way of a king to eat fresh (lit., warm) bread every day; is it perhaps his way to eat bread nine days old (lit., cold bread of nine days)?! (The Hebrew word בתמיה “Say this in the intonation of a question” means nothing other than our question mark) (Midrash Tanchuma 38 23). A Baraitha states that ויצא means, he came out of the judicial court of Moses where he had been pronounced to be in the wrong in the following matter: although his father was an Egyptian he had gone to pitch his tent in the camp of the tribe of Dan to whom his mother belonged (cf. v. 11).  They (the men of Dan) said to him, “What have you to do here\" (lit., what is your character that gives you the right to come here?). He replied. “I am one of the children of the tribe of Dan”. Thereupon they said to him, “Scripture states: (Numbers 2:2) “Every man [of the children of Israel shall encamp] by his own standard, that bears the signs of their father’s house”! He thereupon went in to the judicial court of Moses to have the matter decided and came forth (יצא) declared to be in the wrong. He then stood up and blasphemed (Sifra, Emor, Section 14 1; Leviticus Rabbah 32 3).<br><br>בן איש מצרי THE SON OF AN EGYPTIAN MAN — It was the Egyptian whom Moses had killed (Leviticus Rabbah 32 4; cf. Exodus 2:11 where Scripture also uses the expression “איש מצרי”; cf. also Rashi thereon).<br><br>בתוך בני ישראל AMONG THE CHILDREN OF ISRAEL  — This teaches us that he had become a proselyte (Sifra, Emor, Section 14 1).<br><br>וינצו במחנה THEY QUARRELLED IN [or CONCERNING] THE CAMP, about matters connected with the camp (i. e. as to where was his proper place in the camp; Sifra, Emor, Section 14 1; cf. Rashi on ית‎ישראל‎ אשה ‎ויצא בן‎‎). <br><br>‎הישראלי‎ ואיש THE ISRAELITISH MAN — this was his opponent (Sifra, Emor, Section 14 1) who had prevented him from pitching his tent in the camp of Dan."}, {"ch": 24, "v": 11, "aliyah": 7, "heb": "וַ֠יִּקֹּ֠ב בֶּן־הָֽאִשָּׁ֨ה הַיִּשְׂרְאֵלִ֤ית אֶת־הַשֵּׁם֙ וַיְקַלֵּ֔ל וַיָּבִ֥יאוּ אֹת֖וֹ אֶל־מֹשֶׁ֑ה וְשֵׁ֥ם אִמּ֛וֹ שְׁלֹמִ֥ית בַּת־דִּבְרִ֖י לְמַטֵּה־דָֽן׃", "onk": "וּפָרֵשׁ בַּר אִתְּתָא בַת יִשְׂרָאֵל יָת שְׁמָא <b>וְאַרְגֵּז<\/b> וְאַיְתִיאוּ יָתֵיהּ לְוָת משֶׁה וְשׁוּם אִמֵּיהּ שְׁלֹּמִית בַּת דִּבְרִי לְשִׁבְטָא דְדָן:", "onk_en": "The Israelite womans son clearly pronounced the Name [of God] and blasphemed [<b>caused anger<\/b>] and they brought him to Moshe. The name of his mother was Shlomis, daughter of Divri of the tribe of Dan.", "pj": "וְכַד נָפַק מִבֵּי דִינָא כַּד מְחַיֵיב פָּרֵישׁ וְחָרִיף בַּר אִתְּתָא בַּת יִשְרָאֵל יַת שְׁמָא רַבָּא וְיַקִירָא דְמִתְפָּרֵשׁ דְשָׁמַע בְּסִינַי וְאָזִיד וְאַרְגִיז וְשׁוּם אִמֵיהּ שְׁלוֹמִית בַּת דִבְרִי לְשִׁבְטָא דְדָן", "pj_en": "and when they had come out from the house of judgment, where he had been condemned, the son of the daughter of Israel expressed and reviled the great and glorious Name of Manifestation which he had heard at Sinai, and defiled and execrated; and the name of his mother was Shelomith, the daughter of Dibree, of the tribe of Dan.", "tj": "וְחָרַף בְּרָהּ דְאִיתָא יִשְרָאֵל יַת שְׁמָא מְפָרָשָׁא וּבָזֵי:", "tj_en": "And the son of the woman of Israel reviled the Manifested Name and defied.", "rashi": "<b>ויקב.<\/b> כְּתַרְגּוּמוֹ \"וּפָרֵשׁ\", שֶׁנָּקַב שֵׁם הַמְיֻחָד וְגִדֵּף, וְהוּא שֵׁם הַמְפֹרָשׁ שֶׁשָּׁמַע מִסִּינַי (ספרא):<br><br><b>ושם אמו שלמית בת דברי.<\/b> שִׁבְחָן שֶׁל יִשְֹרָאֵל שֶׁפִּרְסְמָהּ הַכָּתוּב לְזוֹ, לוֹמַר שֶׁהִיא לְבַדָּהּ הָיְתָה זוֹנָה:<br><br><b>שלמית.<\/b> דַּהֲוָה פִּטְפְּטָה \"שְׁלָם עֲלָךְ\", \"שְׁלָם עֲלֵיכוֹן\", מְפַטְפֶּטֶת בִּדְבָרִים, שׁוֹאֶלֶת בִּשְׁלוֹם הַכֹּל:<br><br><b>בת דברי.<\/b> דַּבְּרָנִית הָיְתָה, מְדַבֶּרֶת עִם כָּל אָדָם, לְפִיכָךְ קִלְקְלָה:<br><br><b>למטה דן.<\/b> מַגִּיד שֶׁהָרָשָׁע גּוֹרֵם גְּנַאי לוֹ, גְּנַאי לְאָבִיו, גְּנַאי לְשִׁבְטוֹ; כַּיּוֹצֵא בוֹ \"אָהֳלִיאָב בֶּן אֲחִיסָמָךְ לְמַטֵּה דָן\" (שמות ל\"א), שֶׁבַח לוֹ, שֶׁבַח לְאָבִיו, שֶׁבַח לְשִׁבְטוֹ (ספרא):", "rashi_en": "ויקב — Translate this as the Targum does: ופרש “and he pronounced”, thus ויקב … ויקלל means that he uttered the Tetragrammaton and by so doing blasphemed. It was the “Proper Name” which he had heard on Mount Sinai (cf. Sifra, Emor, Section 14 2 and Jeremiah Targ.).<br><br>ושם אמו שלמית בת דברי AND HIS MOTHER’S NAME WAS SHELOMITH, THE DAUGHTER OF DIBRI, [THE TRIBE OF DAN] — it is to tell how praiseworthy Israel was that Scripture publicly mentions her name (exposes her), telling us implicitly that of all the women of Israel she alone was a harlot (Leviticus Rabbah 32 5).<br><br>שלמית (connected with שלום “peace”) — she was so called because she was always babbling: “Peace be with thee”, “peace be with thee”, “peace be with you” — she used to continually babble with many words (she was a בת דברי) — she enquired after the health of everybody (Leviticus Rabbah 32 5).<br><br>בת דברי (from the root דבר “to speak”) — she was talkative — talking with any man, and in consequence of this she got into trouble. <br><br>למטה דן OF THE TRIBE OF DAN — This mention also of the parent and tribe of the woman teaches us that the wrong doer brings shame upon himself, shame upon his parent, shame upon his whole tribe. Similarly we find the name of the tribe Dan mentioned to express praise; (Exodus 31:6) “Oholiab, the son of Ahisamach, of the tribe of Dan”, where the details of Oholiab’s descent imply praise for him, praise for his father and praise for his tribe (Sifra, Emor, Section 14 4)."}, {"ch": 24, "v": 12, "aliyah": 7, "heb": "וַיַּנִּיחֻ֖הוּ בַּמִּשְׁמָ֑ר לִפְרֹ֥שׁ לָהֶ֖ם עַל־פִּ֥י יְהֹוָֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "<b>וְאַסְּרוֹהִי<\/b> בְּבֵית מַטְּרָא עַד דְּיִתְפָּרַשׁ לְהוֹן עַל <b>גְּזֵרַת<\/b> מֵימְרָא דַיְיָ:", "onk_en": "They placed [<b>bound<\/b>] him in the guardhouse until [his penalty] would be explained to them through the [<b>law of the<\/b>] word of Adonoy.", "pj": "דֵין הוּא חַד מִן אַרְבַּעְתֵּי דִינִין דִי עֲלוּ קֳדָם משֶׁה נְבִיָיא וְדָן יַתְהוֹן עַל פּוּם מֵימְרָא דִלְעֵיל מִנְהוֹן דִינָא מָמוֹנָא וּמִנְהוֹן דִינָא נַפְשָׁתָא בְּדִינֵי מָמוֹנָא הֲוָה משֶׁה זָרִיז וּבְדִינֵי נַפְשָׁתָא הֲוָה מָתוּן וּבְאִילֵין אָמַר משֶׁה לָא שְׁמָעִית מִן בִּגְלַל לְמֵילְפָא רֵישֵׁי סַנְהֶדְרַיְיתָא דְיִשְרָאֵל דַעֲתִידִין לְמֵיקוּם בַּתְרֵיהּ דֶיֶהֱווֹן זְרִיזִין בְּדִינֵי מָמוֹנָא וּמְתוּנִין בְּדִינֵי נַפְשָׁתָא וְלָא יְבַהֲתוּן לְמִישְׁאֲלָא דִינָא דְמִתְקַשֵׁי לְהוֹן אֲרוּם משֶׁה רַבְּהוֹן דְיִשְרָאֵל צָרִיךְ דְיֵימַר לָא שְׁמָעִית בְּגִין כֵּן אַצְנָעוּ יָתֵיהּ בְּבֵית מַטְרָא עַד זְמַן דְיִתְפָּרֵשׁ לְהוֹן עַל גְזֵירַת מֵימְרָא דַיְיָ", "pj_en": "This is one of four judgments which were brought in before Mosheh the prophet, who decided them by the dictate of the Word, who is above. They were judgments about money and about life. In judgments on money Mosheh was prompt; but in the judgment on life he was deliberate (or slow by delay) each (party) Mosheh said, I have not heard: that he might teach the chiefs of the Sanhedrin of Israel, who were to arise after him, to be prompt in judgments respecting money, but slow in judgments that affected life; and not to be ashamed to inquire for counsel in cases that should be too hard for them, forasmuch as Mosheh, Rabban of Israel, had need to say, I have not heard. Therefore they shut him up in the house of confinement till the time that it should be explained to them by the decree of the Word of the Lord.", "tj": "דֵּין חָד מֵאַרְבַּע דִּינִין דִּי עֲלוּ לִקֳדָם משֶׁה רַבָּן בִּתְרֵין מִנְהוֹן הֲוָה משֶׁה מָתוּן וּבִתְרֵין מִנְהוֹן הֲוָה משֶׁה זָרִיז בִּמְחַרְפָא דְחָרַף שְׁמָא קַדִּישָׁא בְּגִידוּפִין וּבִמְקוֹשְׁשָׁא דְחָלִיל שַׁבְּתָא בִּזְדָנוּ הֲוָה משֶׁה מָתוּן בִּגְלַל דַּהֲוָה דִּינֵיהוֹן דִּינֵי נַפְשָׁן וּבִמְסַאֲבִין דְּלָא יְכִילוּ לְמֶעְבַּד פִּסְחָא בְּזִימְנֵיהּ וּבְגִין בְּנַת צְלָפְחָד הֲוָה משֶׁה זָרִיז מִן בִּגְלַל דַּהֲוָה דִּינֵיהוֹן דִּינֵי מָמוֹן וּבְאִילֵין אָמַר לָא שְׁמָעִית לְמַלְפָא דַּיָנֵי דַּעֲתִידִין לְמֵיקָם בָּתַר משֶׁה לְמִיהֲווֹן מְתִינִין בְּדִינֵי נַפְשָׁן וּזְרִיזִין בְּדִינֵי מָמוֹן דְּלָא יְבַהֲתוּן לְמֵימָר לָא שְׁמָעִינָן בְּרַם משֶׁה רַבָּן אָמַר לָא שְׁמָעִית וְאַצְנְעוּן בְּמַטָרָא יָתֵיהּ קֳדָם עַד לָא יִתְפְּרַשׁ לְהוֹן מִן קֳדָם יְיָ בְּאִילֵין דִּינֵי יִתְעֲבֵיד בֵּיהּ:", "tj_en": "This is one of four judgments that were brought before Mosheh our Rabbi. In two of them was Mosheh slow by delay, and in two of them was Mosheh expeditious. With the blasphemer who blasphemed the Holy Name with scoffings and with the gatherer of sticks who profaned the Sabbath, Mosheh had delay, because they were judgments that affected life; but in the case of unclean persons who could not perform the Pascha in its time, and in that of the daughters of Zelophehad, Mosheh could be prompt, because they were judgments on temporal matters. But to those he would say, I have not heard: to teach the judges who were to arise after Mosheh to be slow in judgments on life and to be expeditious in judgments of Mammon; and not to be ashamed to say, I have not heard; for Mosheh our Rabban said, I have not heard. And they shut him up in confinement, while as yet it had not been explained to them from before the Lord with what judgments they were to deal with him.", "rashi": "<b>ויניחהו.<\/b> לְבַדּוֹ, וְלֹא הִנִּיחוּ מְקוֹשֵׁשׁ עִמּוֹ — שֶׁשְּׁנֵיהֶם הָיוּ בְּפֶרֶק אֶחָד — וְיוֹדְעִים הָיוּ שֶׁהַמְּקוֹשֵׁשׁ בְּמִיתָה, אֲבָל לֹא פֹרַשׁ לָהֶם בְּאֵיזוֹ מִיתָה לְכָךְ נֶאֱמַר (במדבר ט\"ו), כִּי לֹא פֹרַשׁ מַה יֵּעָשֶֹה לוֹ; אֲבָל בַּמְּקַלֵּל הוּא אוֹמֵר לִפְרֹשׁ לָהֶם, שֶׁלֹּא הָיוּ יוֹדְעִים אִם חַיָּב מִיתָה אִם לָאו (ספרא; סנהדרין ע\"ח):", "rashi_en": "ויניחהו AND THEY PLACED HIM [IN WARD] — him by himself — and they did not place the man who gathered sticks on the Sabbath day with him (Numbers 15:34), because both of whom happened to be (i. e. to commit an offense) at the same period, but they knew that the stick-gatherer was to be punished with the death-penalty, only it had not been explained to them by what kind of death he was  to  be  punished  — it is for this reason that it is stated in his case (Numbers 15:33) “[and they placed him in ward] because it was not explained what should be done to him”. In the case of the blasphemer, however, it states “[and they placed him in ward] that [the proper penalty] might be shown to them”; this was because they did not know whether he is at all liable to the death-penalty or not (Sifra, Emor, Section 14 5; Sanhedrin 78b)."}, {"ch": 24, "v": 13, "aliyah": 7, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 14, "aliyah": 7, "heb": "הוֹצֵ֣א אֶת־הַֽמְקַלֵּ֗ל אֶל־מִחוּץ֙ לַֽמַּחֲנֶ֔ה וְסָמְכ֧וּ כׇֽל־הַשֹּׁמְעִ֛ים אֶת־יְדֵיהֶ֖ם עַל־רֹאשׁ֑וֹ וְרָגְמ֥וּ אֹת֖וֹ כׇּל־הָעֵדָֽה׃", "onk": "אַפֵּק יָת <b>דְּאַרְגֵּז<\/b> לְמִבָּרָא לְמַשְׁרִיתָא וְיִסְמְכוּן כָּל דִּי שְׁמָעוּ יָת יְדֵיהוֹן עַל רֵישֵׁיהּ וְיִרְגְּמוּן יָתֵיהּ כָּל כְּנִשְׁתָּא:", "onk_en": "Take the blasphemer [<b>one who has caused anger<\/b>] beyond the encampment, and all those who heard him shall lay their hands on his head and the entire congregation shall stone him.", "pj": "הַנְפֵּק יַת מַרְגְזָא לְמִבָּרָא לְמַשְׁרִיתָא וְיִסְמְכוּן כָּל סַהֲדַיָא דְשָׁמְעוּ בְּאַרְגָזוּתֵיהּ וְדַיְינַיָא יַת יְדֵיהוֹן עַל רֵישֵׁיהּ וִיאַטְלוּן יָתֵיהּ בְּאַבְנִין כָּל כְּנִישְׁתָּא", "pj_en": "Bring forth the blasphemer without the camp, and let the witnesses who heard his blasphemy, and the judges, lay their hands upon his head, and let the whole congregation stone him with stones.", "tj": "", "tj_en": "", "rashi": "<b>השמעים.<\/b> אֵלּוּ הָעֵדִים:<br><br><b>כל.<\/b> לְהָבִיא אֶת הַדַּיָּנִים (ספרא):<br><br><b>את ידיהם.<\/b> אוֹמְרִים לוֹ דָּמְךָ בְּרֹאשְׁךָ, וְאֵין אָנוּ נֶעֱנָשִׁים בְּמִיתָתְךָ, שֶׁאַתָּה גָרַמְתָּ לְךָ (שם):<br><br><b>כל העדה.<\/b> בְּמַעֲמַד כָּל הָעֵדָה, (מִכָּאן) שֶׁשְּׁלוּחוֹ שֶׁל אָדָם כְּמוֹתוֹ (עי' שם):", "rashi_en": "השמעים THEY THAT HEARD — This refers to the witnesses. <br><br>כל ALL [THOSE THAT HEARD] — 'all' serves to include the judges also (Sifra, Emor, Chapter 19 1).<br><br>את ידיהם [AND ALL THAT HEARD HIM SHALL LAY] THEIR HANDS [UPON HIS HEAD] — They said to him: your blood is upon your head; we do not deserve punishment on account of your death, for it was you yourself who brought it about (Sifra, Emor, Chapter 19 2).<br><br> כל העדה ALL THE CONGREGATION [SHALL CERTAINLY PELT HIM WITH STONES]  — (This means: the witnesses shall stone him), all the congregation standing by (because it cannot possibly mean that all the 600,000 men comprising the whole of the congregation should stone him). From here, we may derive the legal principle that a man’s agent is as himself (i. e. that his actions are legally of the same effect as though they were carried out by those for whom he acts the order) (cf. Sifra, Emor, Chapter 19 23)."}, {"ch": 24, "v": 15, "aliyah": 7, "heb": "וְאֶל־בְּנֵ֥י יִשְׂרָאֵ֖ל תְּדַבֵּ֣ר לֵאמֹ֑ר אִ֥ישׁ אִ֛ישׁ כִּֽי־יְקַלֵּ֥ל אֱלֹהָ֖יו וְנָשָׂ֥א חֶטְאֽוֹ׃", "onk": "וְעִם בְּנֵי יִשְׂרָאֵל תְּמַלֵּל לְמֵימָר גְּבַר גְּבַר דִּי <b>יַרְגֵּז<\/b> קֳדָם אֱלָהֵיהּ וִיקַבֵּל חוֹבֵיהּ:", "onk_en": "And to Bnei Yisroel you shall speak, saying; Any person who shall blaspheme [<b>cause anger before<\/b>] his God shall bear [the burden of] his sin.", "pj": "וְעִם בְּנֵי יִשְרָאֵל תְּמַלֵיל לְמֵימָר גְבַר טְלֵי אוֹ גְבַר סִיב דְיִרְגֵז וְיֶחֱרַף שׁוּם כִּינוּי אֱלָהֵיהּ וִיקַבֵּל חוֹבֵיהּ", "pj_en": "And speak thou with the sons of Israel, saying: A man young or old who shall blaspheme the known Name of his God shall bear his sin.", "tj": "", "tj_en": "", "rashi": "<b>ונשא חטאו.<\/b> בְּכָרֵת כְּשֶׁאֵין הַתְרָאָה:", "rashi_en": "ונשא חטאו [WHOSOEVER EXECRATETH HIS GOD] SHALL BEAR HIS SIN — i. e. shall be punished with excision if there was no legal warning preceding the offence (Sifra, Emor, Chapter 19 6; cf. Rashi on Leviticus 20:27)."}, {"ch": 24, "v": 16, "aliyah": 7, "heb": "וְנֹקֵ֤ב שֵׁם־יְהֹוָה֙ מ֣וֹת יוּמָ֔ת רָג֥וֹם יִרְגְּמוּ־ב֖וֹ כׇּל־הָעֵדָ֑ה כַּגֵּר֙ כָּֽאֶזְרָ֔ח בְּנׇקְבוֹ־שֵׁ֖ם יוּמָֽת׃", "onk": "וְדִי פָרֵשׁ שְׁמָא דַיְיָ אִתְקְטָלָא יִתְקְטֵל מִרְגַּם יִרְגְּמוּן בֵּיהּ כָּל כְּנִשְׁתָּא כְּגִיּוֹרָא <b>כְּיַצִּיבָא<\/b> בְּפָרָשׁוּתֵיהּ שְׁמָא יִתְקְטֵל:", "onk_en": "Whoever pronounces clearly the Name of Adonoy [and blasphemes] he will surely be put to death. The entire congregation shall surely stone him. The proselyte and native born [<b>settled one<\/b>] alike when he clearly articulates the Name, shall be put to death.", "pj": "בְּרַם מַאן דִמְפָרֵשׁ וּמְחַרֵף שְׁמָא דַיְיָ אִתְקְטָלָא יִתְקְטֵיל אַטְלָא יְאַטְלוּן יָתֵיהּ אַבְנִין כָּל כְּנִישְׁתָּא כְּגִיוֹרָא כְּיַצִיבָא בִּזְמַן דְיֶחֱרַף שְׁמָא דִמְיַיחֵד יִתְקְטֵיל", "pj_en": "Whosoever expresseth and revileth the Name of the Lord shall verily be put to death; all the congregation shall cast stones upon him, whether he be a sojourner or native-born, when he hath blasphemed the Name that is Alone, he shall die.", "tj": "", "tj_en": "", "rashi": "<b>ונקב שם.<\/b> אֵינוֹ חַיָּב עַד שֶׁיְּפָרֵשׁ אֶת הַשֵּׁם, וְלֹא הַמְקַלֵּל בְּכִנוּי (סנהדרין נ\"ו):<br><br><b>ונקב.<\/b> לְשׁוֹן קְלָלָה כְּמוֹ (במדבר כ\"ג) \"מָה אֶקֹּב\" (סנהדרין נ\"ו):", "rashi_en": "ונקב שם AND HE THAT UTTERETH BLASPHEMOUSLY THE NAME [OF THE LORD SHALL SURELY BE PUT TO DEATH]  —  He is not liable to the death-penalty at the hand of the judges unless he utters the Divine Tetragrammaton blasphemously, but not  if he execrateth the Lord by only mention of one of the substitutes for the Divine name (e. g., רחום, חנון, אל etc.), (cf. Sifra, Emor, Chapter 19 5; Sanhedrin 56a).<br><br>ונקב here is an expression denoting “cursing”, like (Numbers 23:8) “How shall I curse (אקב) [when God hath not cursed]” (Sanhedrin 56a)."}, {"ch": 24, "v": 17, "aliyah": 7, "heb": "וְאִ֕ישׁ כִּ֥י יַכֶּ֖ה כׇּל־נֶ֣פֶשׁ אָדָ֑ם מ֖וֹת יוּמָֽת׃", "onk": "וּגְבַר אֲרֵי יִקְטוֹל כָּל נַפְשָׁא דַאֲנָשָׁא אִתְקְטָלָא יִתְקְטֵל:", "onk_en": "Any man who kills any human being must surely be put to death.", "pj": "וּגְבַר אֲרוּם יַקְטֵיל כָּל נַפְשָׁתֵי דְבַר נְשָׁא מִבְּנֵי יִשְרָאֵל אִתְקְטָלָא יִתְקְטֵיל בְּסַיְיפָא", "pj_en": "And if a man destroy the life of any one of the children of Israel, he shall verily be put to death by the sword.", "tj": "", "tj_en": "", "rashi": "<b>ואיש כי יכה.<\/b> לְפִי שֶׁנֶּאֱמַר מַכֵּה אִישׁ וָמֵת (שמות כ\"א), אֵין לִי אֶלָּא שֶׁהָרַג אֶת הָאִישׁ, אִשָּׁה וְקָטָן מִנַּיִן? תַּ\"לֹ \"כָּל נֶפֶשׁ אָדָם\":", "rashi_en": "ואיש כי יכה AND HE THAT KILLETH [ANY MAN SHALL SURELY BE PUT TO DEATH] — Because it is said (Exodus 21:12) “Whosoever smiteth a man so that he die [shall surely be put to death]” I might say that I have here only the law that if one kills a man he is punishable with death; whence, however, do I know that this is also the case if he kills a woman or a child? Because Scripture states here: “[and he that killeth] any person (more lit., the soul of any human being)” (Sifra, Emor, Chapter 20 1; cf. Rashi on Exodus 21:12)."}, {"ch": 24, "v": 18, "aliyah": 7, "heb": "וּמַכֵּ֥ה נֶֽפֶשׁ־בְּהֵמָ֖ה יְשַׁלְּמֶ֑נָּה נֶ֖פֶשׁ תַּ֥חַת נָֽפֶשׁ׃", "onk": "וּדְיִקְטוֹל נְפַשׁ בְּעִירָא יְשַׁלְּמִנַּהּ נַפְשָׁא חֲלַף נַפְשָׁא:", "onk_en": "Whoever kills an animal shall pay for it, [the compensation of] an animal for an animal.", "pj": "וּדְיִקְטוֹל נְפַשׁ בְּעִירָא יְשַׁלְמִינָהּ נַפְשָׁא חֲלַף נַפְשָׁא", "pj_en": "And he who destroyeth the life of an animal shall make it good, a living animal for a living one.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 19, "aliyah": 7, "heb": "וְאִ֕ישׁ כִּֽי־יִתֵּ֥ן מ֖וּם בַּעֲמִית֑וֹ כַּאֲשֶׁ֣ר עָשָׂ֔ה כֵּ֖ן יֵעָ֥שֶׂה לּֽוֹ׃", "onk": "וּגְבַר אֲרֵי יִתֵּן מוּמָא בְּחַבְרֵיהּ כְּמָא דִי עֲבַד כֵּן יִתְעֲבֶד לֵיהּ:", "onk_en": "A man who maims his neighbor just as he did, so shall be done to him.", "pj": "וּגְבַר אֲרוּם יִתֵּן מוּמָא בְּחַבְרֵיהּ הֵיכְמָא דְעָבַד הֵיכְדֵין יִתְעֲבֵיד לֵיהּ", "pj_en": "And a man who inflicteth a blemish on his neighbour, whatsoever he hath done it shall be done unto him:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 24, "v": 20, "aliyah": 7, "heb": "שֶׁ֚בֶר תַּ֣חַת שֶׁ֔בֶר עַ֚יִן תַּ֣חַת עַ֔יִן שֵׁ֖ן תַּ֣חַת שֵׁ֑ן כַּאֲשֶׁ֨ר יִתֵּ֥ן מוּם֙ בָּֽאָדָ֔ם כֵּ֖ן יִנָּ֥תֶן בּֽוֹ׃", "onk": "תַּבְרָא חֳלַף תַּבְרָא עֵינָא חֳלַף עֵינָא שִׁנָּא חֳלַף שִׁנָּא כְּמָא דִי יִתֵּן מוּמָא בַּאֲנָשָׁא כֵּן יִתְיְהֶב בֵּיהּ:", "onk_en": "[Compensation for] a broken bone [in exchange] for a broken bone, [compen-sation for] the loss of an eye [in exchange] for the loss of an eye, [compensation for] the loss to a tooth [in exchange] for the loss of a tooth; just as he maimed the man, so shall it be done to him [monetarily].", "pj": "דְמֵי תַבְרָא חוֹלַף תַּבְרָא דְמֵי עֵינָא חוֹלַף עֵינָא דְמֵי שִׁינָא חוֹלַף שִׁינָא הֵיכְדֵין דְיִתֵּן מוּמָא בְּאֵינָשָׁא הֵיכְדֵין יִתְיְהֵב בֵּיהּ", "pj_en": "the value of a fracture for a fracture; the value of an eye for an eye; the value of a tooth for a tooth; whatsoever blemish he inflicteth upon the man, the same shall be rendered unto him.", "tj": "תְּבַר תַּשְׁלוּמֵי תְּבַר עַיִן וְשֵׁן תַּשְׁלוּמֵי שֵׁן הֵיךְ דִּיהַב מוּם בְבַר נְשָׁא הֵיכְדֵין יִתְיְהַב בֵּיהּ:", "tj_en": "Fracture shall be recompensed by fracture, an eye shall be recompensed by an eye, a tooth for a tooth, the blemish he hath given to the man it shall be given unto him.", "rashi": "<b>כן ינתן בו.<\/b> פֵּרְשׁוּ רַבּוֹתֵינוּ שֶׁאֵינוֹ נְתִינַת מוּם מַמָּשׁ אֶלָּא תַּשְׁלוּמֵי מָמוֹן, שָׁמִין אוֹתוֹ כְּעֶבֶד, לְכָךְ כָּתוּב בּוֹ לְשׁוֹן נְתִינָה — דָּבָר הַנָּתוּן מִיָּד לְיָד (בבא קמא פ\"ד; כתובות ל\"ב):", "rashi_en": "כן ינתן בו [AND IF A MAN CAUSES A BLEMISH IN HIS COMPANION…] SO SHALL IT BE DONE TO HIM — Our Rabbis explained that this does not mean the actual infliction of a blemish but that it means monetary compensation — that we estimate his (the injured man’s) value as a slave and the offender has to pay the difference between his value as an unmaimed man and that which he represents after the infliction of the injury. It is for this reason that the term נתן “to give” is written here referring to something that is given (passed) from hand to hand viz., money (Ketubot 32b; Bava Kamma 84a)."}, {"ch": 24, "v": 21, "aliyah": 7, "heb": "וּמַכֵּ֥ה בְהֵמָ֖ה יְשַׁלְּמֶ֑נָּה וּמַכֵּ֥ה אָדָ֖ם יוּמָֽת׃", "onk": "<b>וּדְיִקְטוֹל<\/b> בְּעִירָא יְשַׁלְּמִנַּהּ <b>וּדְיִקְטוֹל<\/b> אֲנָשָׁא יִתְקְטֵל:", "onk_en": "Whoever smites [<b>kills<\/b>] an animal shall pay for it. Whoever smites [<b>kills<\/b>] a person shall be put to death.", "pj": "וּמַאן דְיִקְטוֹל בְּעִירָא יְשַׁלְמִינָהּ וּמַאן דְיִקְטוֹל אֵינָשָׁא יִתְקְטֵיל", "pj_en": "He who killeth a beast shall restore it; but be who slayeth a man shall be slain.", "tj": "", "tj_en": "", "rashi": "<b>ומכה בהמה ישלמנה.<\/b> לְמַעְלָה דִּבֵּר בְּהוֹרֵג בְּהֵמָה וְכָאן דִּבֵּר בְּעוֹשֶׂה בָהּ חַבּוּרָה:<br><br><b>ומכה אדם יומת.<\/b> אֲפִלּוּ לֹא הֲרָגוֹ אֶלָּא עָשָׂה בוֹ חַבּוּרָה, שֶׁלֹּא נֶאֱמַר כָּאן נֶפֶשׁ; וּבְמַכֵּה אָבִיו וְאִמּוֹ דִּבֵּר הַכָּתוּב, וּבָא לְהַקִּישׁוֹ לְמַכֵּה בְהֵמָה, מַה מַּכֵּה בְהֵמָה מֵחַיִּים, אַף מַכֵּה אָבִיו מֵחַיִּים, פְּרָט לְמַכֶּה לְאַחַר מִיתָה; לְפִי שֶׁמָּצִינוּ שֶׁהַמְקַלְּלוֹ לְאַחַר מִיתָה חַיָּב, הֻצְרַךְ לוֹמַר בַּמַּכֶּה שֶׁפָּטוּר, וּמַה בִּבְהֵמָה בְּחַבָּלָה, שֶׁאִם אֵין חַבָּלָה אֵין תַּשְׁלוּמִין, אַף מַכֵּה אָבִיו אֵינוֹ חַיָּב עַד שֶׁיַּעֲשֶֹה בוֹ חַבּוּרָה (ספרא; סנהדרין פ\"ד):", "rashi_en": "ומכה בהמה ישלמנה AND HE THAT SMITETH A BEAST, HE SHALL PAY FOR IT — Above (v. 18) Scripture was speaking of one who kills a beast, whilst here it speaks of one who inflicts a wound up on it (cf. Rashi on Exodus 21:12).<br><br>ומכה אדם יומת AND HE THAT SMITETH A MAN SHALL BE PUT TO DEATH — although he has not killed him but only inflicted a wound upon him, because Scripture does not state מכה] נפש] (as it does in v. 17 which implies “smiting of the soul” — killing). Scripture is speaking here of one who smites his father or his mother when he is punishable with death for mere smiting without fatal result (cf. Rashi on Exodus 21:15). It is true that the punishment for this offence has already been stated (Exodus 21:17) but Scripture intends by putting this case in juxtaposition with מכה בהמה to put it in some respect on a level with the case of one who smites a beast. How is it in the case of one who smites a beast? He is subject to the law only if he smote it while it was alive! So, too, is one who smites his father (or his mother) punishable only if he smites them whilst they are alive, thus excluding from the death penalty one who smites them after their death. Because we find that he who curses him (the father; — the same applies to the mother) after death is liable to the death penalty (cf. Rashi Leviticus 20:9), Scripture was compelled to state with reference to one who smites his parents that he is exempt from the death penalty if he does this after their death (as stated above). And there is another point of comparison: How is it in the case of a beast? The law speaks only of smiting resulting in a wound! — for if there is no wound resulting no compensation can be claimed — so, too, he who smites his father is not liable to the death penalty unless he inflicts a wound upon him (Sifra, Emor, Chapter 19 8; Sanhedrin 84a, 85b)."}, {"ch": 24, "v": 22, "aliyah": 7, "heb": "מִשְׁפַּ֤ט אֶחָד֙ יִהְיֶ֣ה לָכֶ֔ם כַּגֵּ֥ר כָּאֶזְרָ֖ח יִהְיֶ֑ה כִּ֛י אֲנִ֥י יְהֹוָ֖ה אֱלֹהֵיכֶֽם׃", "onk": "דִּינָא חֲדָא יְהֵי לְכוֹן כְּגִיּוֹרָא <b>כְיַצִּיבָא<\/b> יְהֵי אֲרֵי אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "One rule shall apply for all of you just as it is for the proselyte, so it shall be for the native born [<b>settled one<\/b>], for I am Adonoy, your God.", "pj": "דִינָא חֲדָא יְהֵי לְכוֹן כְּגִיוֹרָא כְּיַצִיבָא יְהֵי אֲרוּם אֲנָא יְיָ אֱלָהָכוֹן", "pj_en": "One judgment shall you have for the stranger and for the native; for I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>אני ה' אלהיכם.<\/b> אֱלֹהֵי כֻלְּכֶם, כְּשֵׁם שֶׁאֲנִי מְיַחֵד שְׁמִי עֲלֵיכֶם, כָּךְ אֲנִי מְיַחֲדוֹ עַל הַגֵּרִים:", "rashi_en": "‎'אני ה אלהיכם I AM THE LORD YOUR GOD — your God — the God of all of you. Just as I attach My Name to you, so do I attach it to the strangers."}, {"ch": 24, "v": 23, "aliyah": 7, "heb": "וַיְדַבֵּ֣ר מֹשֶׁה֮ אֶל־בְּנֵ֣י יִשְׂרָאֵל֒ וַיּוֹצִ֣יאוּ אֶת־הַֽמְקַלֵּ֗ל אֶל־מִחוּץ֙ לַֽמַּחֲנֶ֔ה וַיִּרְגְּמ֥וּ אֹת֖וֹ אָ֑בֶן וּבְנֵֽי־יִשְׂרָאֵ֣ל עָשׂ֔וּ כַּֽאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּמַלִּיל משֶׁה עִם בְּנֵי יִשְׂרָאֵל וְאַפִּיקוּ יָת <b>דְּאַרְגֵּז<\/b> לְמִבָּרָא לְמַשְׁרִיתָא וּרְגָמוּ יָתֵיהּ אַבְנָא וּבְנֵי יִשְׂרָאֵל עֲבָדוּ כְּמָא דִי פַקֵּיד יְיָ יָת משֶׁה:", "onk_en": "Moshe spoke to Bnei Yisroel and they took the blasphemer [<b>one who caused anger<\/b>], beyond the encampment and they stoned him with a stone. And Bnei Yisroel did just as Adonoy commanded Moshe.", "pj": "וּמַלֵיל משֶׁה עִם בְּנֵי יִשְרָאֵל וְאַפִּיקוּ יַת מַרְגְזָא לְמִבָּרָא לְמַשְׁרִיתָא וְאַטְלוּ יָתֵיהּ אַבְנִין וּבְנֵי יִשְרָאֵל עָבָדוּ לְמִסְמַךְ יְדֵיהוֹן וּלְמִדְחַף וּלְמִצְלַב וּלְמִקְבּוֹר הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "And Mosheh spake with the sons of Israel, and they brought forth the blasphemer without the camp, and stoned him with stones; and the sons of Israel did it, by laying their hands upon, leading him away hanging, and burying him, as the Lord had commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ובני ישראל עשו.<\/b> כָּל הַמִּצְוָה הָאֲמוּרָה בַּסְּקִילָה בְּמָקוֹם אַחֵר — דְּחִיָּה, רְגִימָה וּתְלִיָּה (עי' ספרא; סנהדרין מ\"ג):", "rashi_en": "ובני ישראל עשו AND THE CHILDREN OF ISRAEL DID [AS THE LORD COMMANDED MOSES] every prescription mentioned in respect to the stoning-penalty in another place, viz., the casting down of the culprit from a height, the heaping of stones upon him, and the hanging him after the execution has taken place (cf. Sifra, Emor, Chapter 19 10; Sanhedrin 43a)."}];

function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
</body>
</html>
