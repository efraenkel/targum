ים SURELY THERE IS NO FEAR OF GOD — When a stranger arrives in a city do people ask him about what he would like to eat or to drink, or do they ask him about his wife—“Is this your wife?” or “Is this your sister?” (Bava Kamma 92a) (Surely if they ask at all, it is about his needs; if they ask regarding his relationship to the lady accompanying him, it is evidence that they are not God-fearing people!) "}, {"ch": 20, "v": 12, "aliyah": 4, "heb": "וְגַם־אׇמְנָ֗ה אֲחֹתִ֤י בַת־אָבִי֙ הִ֔וא אַ֖ךְ לֹ֣א בַת־אִמִּ֑י וַתְּהִי־לִ֖י לְאִשָּֽׁה׃", "onk": "וּבְרַם בְּקוּשְׁטָא אֲחָתִי בַּת אַבָּא הִיא בְּרַם לָא בַת אִמִּי וַהֲוַת לִי לְאִנְתּוּ:", "onk_en": "In any case, she is my sister, the daughter of my father, but not the daughter of my mother, and she became my wife.", "pj": "וּבְרַם בְּקוּשְׁטָא אַחְתִי בְּרַת אָחָא דְאִיבָא הִיא בְּרַם לָא מִגְנִיסַת אִימָא וַהֲוַת לִי לְאִנְתּוּ", "pj_en": "But in truth she is my sister, the daughter of my father's brother, but not of the kindred of my mother; and she became my wife.", "tj": "", "tj_en": "", "rashi": "<b>אחתי בת אבי הוא.<\/b> וּבַת אָב מֻתֶּרֶת לְבֶן נֹחַ, שֶׁאֵין אַבְהוּת לְגוֹי, וּכְדֵי לְאַמֵּת דְּבָרָיו הֱשִׁיבָם כֵּן. וְאִם תֹּאמַר וַהֲלֹא בַּת אָחִיו הָיְתָה? בְּנֵי בָנִים הֲרֵי הֵן כְּבָנִים, וַהֲרֵי הִיא בִתּוֹ שֶׁל תֶּרַח וְכָךְ הוּא אוֹמֵר לְלוֹט כִּי אֲנָשִׁים אַחִים אֲנָחְנוּ (בראשית י״ג:ח׳):<br><br><b>אך לא בת אמי.<\/b> הָרָן מֵאֵם אֲחֶרֶת הָיָה:", "rashi_en": "אחותי בת אבי היא SHE IS MY SISTER, THE DAUGHTER OF MY FATHER — And the daughter of the same father is permitted to be married to a descendant of Noah, for the paternal relationship is not taken into consideration in the case of the marriages between idolators (i.e. the “Sons of Noah”). He answered them in this way in order to bear out his former statement that she was his sister. If, however, you ask, “But was she not his brother’s daughter? (see chapter 11:29, and so she was granddaughter of Terah, Abraham’s father), then I reply, one’s children’s children are considered as one’s own children. Thus, too, did he say to Lot, (13:8) “For we are brethren” (although the relationship was that of uncle and nephew, as here it was that of uncle and niece).<br><br>אך לא בת אמי BUT NOT THE DAUGHTER OF MY MOTHER — For Haran (her father was born of a different mother than Abraham (Bava Kamma 92a). "}, {"ch": 20, "v": 13, "aliyah": 4, "heb": "וַיְהִ֞י כַּאֲשֶׁ֧ר הִתְע֣וּ אֹתִ֗י אֱלֹהִים֮ מִבֵּ֣ית אָבִי֒ וָאֹמַ֣ר לָ֔הּ זֶ֣ה חַסְדֵּ֔ךְ אֲשֶׁ֥ר תַּעֲשִׂ֖י עִמָּדִ֑י אֶ֤ל כׇּל־הַמָּקוֹם֙ אֲשֶׁ֣ר נָב֣וֹא שָׁ֔מָּה אִמְרִי־לִ֖י אָחִ֥י הֽוּא׃", "onk": "<b>וַהֲוָה כַּד טָעוּ עַמְמַיָּא בָּתַר עוֹבָדֵי יְדֵיהוֹן יָתִי קָרִיב יְיָ לְדַחַלְתֵּיהּ מִבֵּית אַבָּא<\/b> וַאֲמָרִית לַהּ דֵּין (<small>נ\"י<\/small> דָּא) <b>טֵיבוּתִיךְ<\/b> דִּי תַעְבְּדִי עִמִּי לְכָל אַתְרָא <b>דִּנְהַךְ לְתַמָּן<\/b> אֱמָרִי עֲלַי אָחִי הוּא:", "onk_en": "When Elohim caused me to wander from my father’s house [<b>When the nations strayed after the works of their hands, Elohim brought me close to His worship from my father’s house<\/b>], I said to her, this is the kindness [<b>goodness<\/b>] you shall do for me. At every place we come [<b>go<\/b>] to, say of me, He is my brother.", "pj": "וַהֲוָה כַּד בָּעוּ לְאַטְעָאָה יָתִי פִּלְחֵי טַעֲוָותָא וּנְפָקֵית מִבֵּית אַבָּא וַאֲמָרִית לָהּ דֵין טִיבוּתִיךְ דְתַעַבְדִין עִמִי לְכָל אַתְרָא דִנְהַךְ לְתַמָן אִמְרִי עָלַי דְאָחִי הוּא", "pj_en": "And it was when they sought to turn me aside to the wor-ship of idols, and I went forth from my father's house, that I said to her, This is the kindness thou shalt do me: in every place to which we come, say concerning me, He is my brother.", "tj": "", "tj_en": "", "rashi": "<b>ויהי כאשר התעו וגו'.<\/b> אֻנְקְלוֹס תִּרְגֵּם מַה שֶּׁתִּרְגֵּם; וְיֵשׁ לְיַשְּׁבוֹ עוֹד דָּבָר דָּבוּר עַל אָפְנָיו, כְּשֶׁהוֹצִיאַנִי הַקָּבָּ\"ה מִבֵּית אָבִי לִהְיוֹת מְשׁוֹטֵט וְנָד מִמָּקוֹם לְמָקוֹם, יָדַעְתִּי שֶׁאֶעֱבֹר בִּמְקוֹם רְשָׁעִים <b>ואמר לה זה חסדך<\/b>:<br><br><b>כאשר התעו.<\/b> לְשׁוֹן רַבִּים. וְאַל תִּתְמַהּ, כִּי הַרְבֵּה מְקוֹמוֹת לְשׁוֹן אֱלֹהוּת וּלְשׁוֹן מָרוּת קָרוּי בִּלְשׁוֹן רַבִּים, אֲשֶׁר הָלְכוּ אֱלֹהִים (שמואל ב ז'), אֱלֹהִים חַיִּים (דברים ה'), אֱלֹהִים קְדֹשִׁים (יהושע כ\"ד), וְכָל לְשׁוֹן אַדְנוּת לְשׁוֹן רַבִּים; וְכֵן וַיִּקַּח אֲדֹנֵי יוֹסֵף (בראשית ל\"ט), וַאֲדֹנֵי הָאֲדֹנִים (דברים י'), אֲדֹנֵי הָאָרֶץ (בראשית מ\"ב), וְכֵן בְּעָלָיו עִמּוֹ (שמות כ\"ב), וְהוּעַד בִּבְעָלָיו (שם כ\"א). וְאִם תֹּאמַר מַהוּ לְשׁוֹן הִתְעוּ? כָּל הַגּוֹלֶה מִמְּקוֹמוֹ וְאֵינוֹ מְיֻשָּׁב קָרוּי תּוֹעֶה, כְּמוֹ וַתֵּלֶךְ וַתֵּתַע (בראשית כ\"א), תָּעִיתִי כְּשֶׂה אֹבֵד (תהילים קי\"ט), יִתְעוּ לִבְלִי אֹכֶל (איוב ל\"ח) – יֵצְאוּ וְיִתְעוּ לְבַקֵּשׁ אָכְלָם:<br><br><b>אמרי לי.<\/b> עָלַי, וְכֵן וַיִּשְׁאֲלוּ אַנְשֵׁי הַמָּקוֹם לְאִשְׁתּוֹ (בראשית כ\"ו), עַל אִשְׁתּוֹ, וְכֵן וְאָמַר פַּרְעֹה לִבְנֵי יִשְׂרָאֵל (שמות י\"ד), כְּמוֹ עַל בְּנֵי יִשְׂרָאֵל; פֶּן יֹאמְרוּ לִי אִשָּׁה הֲרָגָתְהוּ (שופטים ט'):", "rashi_en": "'ויהי כאשר התעו אותי וגו AND IT CAME TO PASS WHEN GOD CAUSED ME TO WANDER etc. — Onkelos translates it in his own way, but it can be explained in another manner that is also appropriate: When the Holy One, blessed be He, brought me forth from my father’s house to be a nomad, wandering from place to place, I knew that I would traverse places where there are wicked people ואמר לה זה חסדך AND so I SAID UNTO HER THIS IS THY LOVINGKINDNESS [WHICH THOU SHALT SHOW UNTO ME].<br><br>כאשר התעו WHEN GOD (CAUSED ME TO WANDER — The verb is in the plural. Do not be surprised at this for in many passages words denoting Godship or denoting Authority are grammatically treated as plural, e. g., (2 Samuel 7:23) “Whom God went (הלכו plural) to redeem”; (Deuteronomy 5:23) “the living (חיים adjective, plural) God”; (Joshua 24:19) “a Holy (קדושים adjective, plural) God”. So, too, the idea of Authority is expressed by the plural form, as (39:20) “And the master of (אדני construct plural) Joseph took him” and as (Deuteronomy 10:17) “Lord of (אדני) lords (האדנים)”, and (42:30) “the lord of (אדני) the land”; as well as (Exodus 22:14) “if its owner (בעליו) be with it”, and (Exodus 21:29) “and warning has been given to its master (בעליו)”. If you ask why does it here use the term התעו, I reply, anyone who is exiled from his home and has no settled abode may be styled תועה a wanderer (or “one moving about aimlessly”), as (21:14) “And she, Hagar, went and strayed about (ותתע) in the wilderness”; (Psalms 119:176) “I have gone astray (תעיתי) like a lost sheep”, and (Job 38:41) “they wander (יתעו) through lack of food”, i.e. they go out and wander about to seek their food.<br><br>אמרי לי means say regarding me (the ל of לי signifies על); similar are: (26:7) “And the men of the place asked לאשתו” where לאשתו is the same as על אשתו regarding his wife; (Exodus 14:3) “And Pharaoh will say לבני ישראל” where לבני is the same as על בני ישראל; (Judges 9:54) “That men say not (לי) regarding me, a woman slew him”. "}, {"ch": 20, "v": 14, "aliyah": 4, "heb": "וַיִּקַּ֨ח אֲבִימֶ֜לֶךְ צֹ֣אן וּבָקָ֗ר וַעֲבָדִים֙ וּשְׁפָחֹ֔ת וַיִּתֵּ֖ן לְאַבְרָהָ֑ם וַיָּ֣שֶׁב ל֔וֹ אֵ֖ת שָׂרָ֥ה אִשְׁתּֽוֹ׃", "onk": "וּדְבַר אֲבִימֶלֶךְ עָאן וְתוֹרִין וְעַבְדִין וְאַמְהָן וִיהַב לְאַבְרָהָם וַאֲתֵיב לֵיהּ יָת שָׂרָה אִתְּתֵיהּ:", "onk_en": "Avimelech took sheep, cattle, male and female slaves, and he gave them to Avraham. He [also] returned his wife Sarah to him.", "pj": "וּנְסֵיב אֲבִימֶלֶךְ עָאן וְתוֹרִין וְעַבְדִין וְאַמְהִין וִיהַב לְאַבְרָהָם וְאָתֵיב לֵיהּ יַת שָרָה אִנְתְּתֵיהּ", "pj_en": "And Abimelek took sheep, and restored Sarah his wife to him.", "tj": "", "tj_en": "", "rashi": "<b>ויתן לאברהם.<\/b> כְּדֵי שֶׁיִּתְפַּיֵּס וְיִתְפַּלֵּל עָלָיו:", "rashi_en": "ויתן לאברהם AND GAVE THEM UNTO ABRAHAM, so that he might he mollified and pray for him."}, {"ch": 20, "v": 15, "aliyah": 4, "heb": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ הִנֵּ֥ה אַרְצִ֖י לְפָנֶ֑יךָ בַּטּ֥וֹב בְּעֵינֶ֖יךָ שֵֽׁב׃", "onk": "וַאֲמַר אֲבִימֶלֶךְ הָא אַרְעִי קֳדָמָךְ בִּדְתַקִּין בְּעֵינָיךְ תִּיב:", "onk_en": "Avimelech said, Behold, my land is before you. Live wherever you see fit.", "pj": "וּלְוַת שָרָה אָמַר הָא יְהָבִית אֶלֶף סִלְעִין דִכְסַף לְאָחוּךְ הָא אִינוּן לָךְ תַּחְמְדָא דְעַיְינִין חֲלַף דְאִתְכַּסִית מִן בַּעֲלִיךְ לֵילְיָא חָדָא וְחָמִית יָתָךְ דְאִילוּ יְהָבִית יַת כָּל דַהֲוָה לִי לָא הֲוֵינָא כְמֵיסַת וְאִתְוַכְּחָן מִילַיָא וִידַע אַבְרָהָם אֲרוּם לָא קָרֵיב אֲבִימֶלֶךְ לְוַת שָרָה אִנְתְּתֵיהּ", "pj_en": "{And Abimelech said, Behold, my land is before you; and wherever is right in your eyes, dwell.}", "tj": "", "tj_en": "", "rashi": "<b>הנה ארצי לפניך.<\/b> אֲבָל פַּרְעֹה אָמַר לוֹ הִנֵּה אִשְׁתְּךָ קַח וָלֵךְ, לְפִי שֶׁנִּתְיָרֵא, שֶׁהַמִּצְרִיִּים שְׁטוּפֵי זִמָּה:", "rashi_en": "הנה ארצי לפניך BEHOLD MY LAND IS BEFORE THEE — But Pharaoh had said to him (12:19) “Behold thy wife, take her and go”, because he feared for Sarah’s safety since the Egyptians were addicted to lewd practices (see Rashi on this passage). "}, {"ch": 20, "v": 16, "aliyah": 4, "heb": "וּלְשָׂרָ֣ה אָמַ֗ר הִנֵּ֨ה נָתַ֜תִּי אֶ֤לֶף כֶּ֙סֶף֙ לְאָחִ֔יךְ הִנֵּ֤ה הוּא־לָךְ֙ כְּס֣וּת עֵינַ֔יִם לְכֹ֖ל אֲשֶׁ֣ר אִתָּ֑ךְ וְאֵ֥ת כֹּ֖ל וְנֹכָֽחַת׃", "onk": "וּלְשָׂרָה אֲמַר הָא יְהָבִית אֶלֶף <b>סַלְעִין<\/b> דִּכְסַף לְאָחִיךְ <b>הָא הוּא לִיךְ כְּסוּת דִּיקָר (עַיְנִין) חֳלַף דִּשְׁלָחִית דְּבַרְתִּיךְ וַחֲזֵית יָתִיךְ וְיָת כָּל דְּעִמָּךְ וְעַל כָּל מַה דַּאֲמָרַת אִתּוֹכָחַת<\/b>:", "onk_en": "To Sarah, he said, Behold I have given to your brother a thousand pieces [<b>shekalim<\/b>] of silver. It will be for you a [compensational] eye covering for all who are with you, that you may face every one. [<b>It will be for you a garment of honor, in return for my having sent for you, and taken you, and seeing you and all that is with you. And regarding everything that you said, you were just.<\/b>]", "pj": "וַאֲמַר אֲבִימֶלְךְ הָא אַרְעִי קַדְמָךְ וּבִדַתָקֵן בְּעֵינָךְ תִּיב", "pj_en": "And to Sarah he said, Behold, I have given a thousand sileen of silver to thy brother; behold, they are to thee a veil of the eyes, inasmuch as thou wast hidden from thine husband one night, and I would have seen thee: for were I to give all that I have it would not suffice (or be proportionate). And the words were debated. And Abraham knew that Abimelek had not come near Sarah his wife.", "tj": "וּלְשָרָה אָמַר הָא יְהָבִית אֶלֶף סַלְעִין דִכְסַף לְאָחוּךְ הָא כַסְפָּא הַהוּא יָהִיב לָךְ מַתָּנָה חֲלַף דְאִתְכַּסְיַת מִן עֵינוֹי דְאַבְרָהָם בַּעֲלִיךְ לֵיל חַד וּמִן כָּל מַה דַהֲוָה עִמִי דְעַל כּוֹלָא אִיתְוַכַּחַת הָא אִילוּ יְהָבִית כָּל מַה דַהֲוָה לִי לֵית אֲנָא כְּמֵיסַת אִתְוַכְּחָן מִילַיָא וִידַע אַבְרָהָם צַדִיקָא דִי לָא חַכְמִית יָתָךְ:", "tj_en": "And to Sarah he said, Behold, I have given a thousand sileen of silver to thy brother; behold, that silver is given to thee as a present, because thou wast hidden from the eyes of Abraham thy husband one night: and of all that I have, for on behalf of all I am corrected, behold, were I to give all whatever I have, it would not suffice. Let the words be approved, and may Abraham the Just learn that I have not known thee.", "rashi": "<b>ולשרה אמר.<\/b> אֲבִימֶלֶךְ לִכְבוֹדָהּ כְּדֵי לְפַיְּסָהּ, הִנֵּה עָשִׂיתִי לָךְ כָּבוֹד זֶה, נָתַתִּי מָמוֹן לְאָחִיךְ שֶׁאָמַרְתְּ עָלָיו אָחִי הוּא, הִנֵּה הַמָּמוֹן וְהַכָּבוֹד הַזֶּה <b>לך כסות עינים<\/b>:<br><br><b>לכל אשר אתך.<\/b> יְכַסּוּ עֵינֵיהֶם שֶׁלֹּא יְקִלּוּךְ, שֶׁאִלּוּ הֲשִׁיבוֹתִיךְ רֵיקָנִית, יֵשׁ לָהֶם לוֹמַר לְאַחַר שֶׁנִּתְעַלַּל בָּהּ הֶחֱזִירָהּ; עַכְשָׁו שֶׁהֻצְרַכְתִּי לְבַזְבֵּז מָמוֹן וּלְפַיְּסֵךְ, יוֹדְעִים יִהְיוּ שֶׁעַל כָּרְחִי הֲשִׁיבוֹתִיךְ וְעַל יְדֵי נֵס:<br><br><b>ואת כל.<\/b> וְעִם כָּל בָּאֵי עוֹלָם:<br><br><b>ונכחת.<\/b> יְהִי לָךְ פִּתְחוֹן פֶּה לְהִתְוַכֵּחַ וּלְהַרְאוֹת דְבָרִים נִכָּרִים הַלָּלוּ; וּלְשׁוֹן הוֹכָחָה בְּכָל מָקוֹם בֵּרוּר דְּבָרִים ובלע\"ז אשפרו\"ביר, וְאֻנְקְלוֹס תִּרְגֵּם בְּפָנִים אֲחֵרִים, וּלְשׁוֹן הַמִּקְרָא כָּךְ הוּא נוֹפֵל עַל הַתַּרְגּוּם, הִנֵּה לָךְ כְּסוּת שֶׁל כָּבוֹד עַל הָעֵינַיִם שֶׁלִּי שֶׁשָּׁלְטוּ בָּךְ וּבְכֹל אֲשֶׁר אִתָּךְ, וְעַל כֵּן תִּרְגְּמוֹ וַחֲזֵית יָתִיךְ וְיַת כָּל דְּעִמָּךְ. וְיֵשׁ מִ\"אַ אֲבָל יִשּׁוּב לְשׁוֹן הַמִּקְרָא פֵּרַשְׁתִּי:", "rashi_en": "ולשרה אמר AND UNTO SARAH HE SAID — Abimelech said — out of respect for her and to mollify her: “Behold I have shown you this mark of respect, viz., I have given money to your brother — to him of whom thou didst say “he is my brother”. הנה BEHOLD, this money and this evidence of respect<br><br>לך כסות עינים לכל אשר אתך SHALL BE UNTO THEE A COVERING OF THY EYES TO ALL WHO ARE WITH THEE — these will put a covering over the eyes of all who are with thee so that they shall not hold you in light esteem. But had I sent you back empty-handed, they might have said, “After he abused her he sent her back”; now, however, that I have had to lavish money and to mollify you they will understand that I have sent you back against my own will forced to do so by a miracle.<br><br>ואת כל AND WITH ALL — means and with all people in the world.<br><br>ונכחת AND THOU MAYEST FACE EVERY ONE — You will have an opening of the mouth (an opportunity) to defend yourself (להתוכח) and to point to these evident facts. This expression יכח in the Hiphil means everywhere making a thing plain; in old French éprouver; English to prove. Onkelos translated in a different manner, and the words of the text fit in with the Targum in the following way: Behold this shall be to you as a veil of honour on account of my eyes which have gazed upon (literally, ruled over) you and upon all who are with you; and that is why he translates it by: “because that I saw you and your people that are with you”. There are Midrashic explanations, but I have given the more exact meaning of the text. "}, {"ch": 20, "v": 17, "aliyah": 4, "heb": "וַיִּתְפַּלֵּ֥ל אַבְרָהָ֖ם אֶל־הָאֱלֹהִ֑ים וַיִּרְפָּ֨א אֱלֹהִ֜ים אֶת־אֲבִימֶ֧לֶךְ וְאֶת־אִשְׁתּ֛וֹ וְאַמְהֹתָ֖יו וַיֵּלֵֽדוּ׃", "onk": "וְצַלִּי אַבְרָהָם קֳדָם יְיָ וְאַסִּי יְיָ יָת אֲבִימֶלֶךְ וְיָת אִתְּתֵיהּ וְאַמְהָתֵיהּ <b>וְאִתְרְוָחוּ<\/b>:", "onk_en": "Avraham prayed to [<b>before<\/b>] Elohim, and Elohim healed Avimelech, his wife, and his female slaves, and they gave birth [<b>and they were relieved<\/b>].", "pj": "וְצַלִי אַבְרָהָם קֳדָם יְיָ וְאָסֵי יְיָ יַת אֲבִימֶלֶךְ וְיַת אִנְתְּתֵיהּ וּלְחֵינְתוּ וְאִתְרַוָחוּ אֲרוּם מֵיחַד אָחִיד מֵימְרָא דַיְיָ בְּאַנְפֵּי כָּל צִירֶיהָ בֵּית וַלְדָא לִנְשַׁיָא דִבְּבֵית אֲבִימֶלֶךְ עַל עֵיסַק שָרָה אִתַּת אַבְרָהָם", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>וילדו.<\/b> כְּתַרְגּוּמוֹ וְאִתְרְוָחוּ, נִפְתְּחוּ נִקְבֵיהֶם וְהוֹצִיאוּ, וְהִיא לֵדָה שֶׁלָּהֶם:", "rashi_en": "וילדו AND THEY BROUGHT FORTH — Explain it as the Targum takes it: “and they were relieved” — their channels were opened (cf. 5:9) and they brought forth their secretions — and this is לידה “bringing forth”, as far as they are concerned. "}, {"ch": 20, "v": 18, "aliyah": 4, "heb": "כִּֽי־עָצֹ֤ר עָצַר֙ יְהֹוָ֔ה בְּעַ֥ד כׇּל־רֶ֖חֶם לְבֵ֣ית אֲבִימֶ֑לֶךְ עַל־דְּבַ֥ר שָׂרָ֖ה אֵ֥שֶׁת אַבְרָהָֽם׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אֲרֵי מֵיחַד אֲחַד יְיָ בְּאַפֵּי כָל פָּתַח וַלְדָא לְבֵית אֲבִימֶלֶךְ עַל עֵיסַק שָׂרָה אִתַּת אַבְרָהָם:", "onk_en": "For Adonoy had restrained every womb in the house of Avimelech according to the word of Sarah, Avraham’s wife.", "pj": "", "pj_en": "", "tj": "וּמִטְרוֹד טְרוֹד:", "tj_en": "Closing had closed.", "rashi": "<b>בעד כל רחם.<\/b> כְּנֶגֶד כָּל פֶּתַח:<br><br><b>על דבר שרה.<\/b> עַל פִּי דִּבּוּרָהּ שֶׁל שָׂרָה:", "rashi_en": "בעד כל רחם GOD HAD CLOSED UP EVERY רחם — means had closed up every opening (of the body)<br><br>'על דבר שרה וגו BECAUSE OF (literally, by the word of) SARAH — at Sarah’s bidding (Genesis Rabbah 52:13)."}, {"ch": 21, "v": 1, "aliyah": 4, "heb": "וַֽיהֹוָ֛ה פָּקַ֥ד אֶת־שָׂרָ֖ה כַּאֲשֶׁ֣ר אָמָ֑ר וַיַּ֧עַשׂ יְהֹוָ֛ה לְשָׂרָ֖ה כַּאֲשֶׁ֥ר דִּבֵּֽר׃", "onk": "וַייָ דְּכִיר יָת שָׂרָה כְּמָא דִּי אֲמָר וַעֲבַד יְיָ לְשָׁרָה כְּמָא דִּי מַלִּיל:", "onk_en": "Adonoy remembered Sarah as He had said, and Adonoy did for Sarah as He had spoken.", "pj": "וַיְיָ דְכִיר יַת שָרָה הֵיכְמָא דְאָמַר לֵיהּ וְעָבַד יְיָ לְשָרָה נִיסָא הֵיכְמָא דְמַלֵיל לְאַבְרָהָם בִּצְלוֹתֵיהּ עַל אֲבִימֶלֶךְ", "pj_en": "And the Lord remembered Sarah according to that which He had said to her; and the Lord wrought a miracle for Sarah like to that for which Abraham had spoken in prayer for Abimelek.", "tj": "וַעֲבַד יְיָ נִיסִין לְשָרָה הֵיךְ דְמַלֵיל:", "tj_en": "And the Lord wrought miracles for Sarah, as He had spoken.", "rashi": "<b>וה' פקד את שרה וגו'.<\/b> סָמַך פָּרָשָׁה זוֹ לְלַמֶּדְךָ, שֶׁכָּל הַמְבַקֵּשׁ רַחֲמִים עַל חֲבֵרוֹ וְהוּא צָרִיךְ לְאוֹתוֹ דָבָר, הוּא נַעֲנֶה תְחִלָּה (בבא קמא צ\"ב), שֶׁנֶּאֱמַר וַיִּתְפַּלֵּל וְגוֹ', וּסְמִיךְ לֵיהּ וה' פָּקַד אֶת שָׂרָה, שֶׁפְּקָדָהּ כְּבָר קֹדֶם שֶׁרִפֵּא אֶת אֲבִימֶלֶךְ:<br><br><b>פקד את שרה כאשר אמר.<\/b> בְּהֵרָיוֹן:<br><br><b>כאשר דבר.<\/b> בְּלֵדָה. וְהֵיכָן הִיא אֲמִירָה, וְהֵיכָן הוּא דִּבּוּר? אֲמִירָה וַיֹּאמֶר אֱלֹהִים אֲבָל שָׂרָה אִשְׁתְּךָ וְגוֹ '(בראשית י\"ז), דִּבּוּר הָיָה דְבַר ה' אֶל אַבְרָם בִּבְרִית בֵּין הַבְּתָרִים, וְשָׁם נֶאֱמַר לֹא יִירָשְׁךָ זֶה וְגוֹ' (שם ט\"ו), וְהֵבִיא הַיּוֹרֵשׁ מִשָּׂרָה:<br><br><b>ויעש ה' לשרה כאשר דבר.<\/b> לְאַבְרָהָם:", "rashi_en": "'וה' פקד את שרה וגו AND THE LORD VISITED SARAH —It (Scripture) places this section after the preceding one to teach you that whoever prays for mercy on behalf of another when he himself also is in need of that very thing for which he prays on the other’s behalf, will himself first receive a favorable response from God, for it is said (at end of last chapter), “And Abraham prayed for Abimelech and his wife and they brought forth” and immediately afterwards it states here, “And the Lord remembered Sarah” — i. e. he had already remembered her before he healed Abimelech (Bava Kamma 92a).<br><br>פקד את שרה כאשר אמר HE REMEMBERED SARAH AS HE SAID — He remembered her by granting her pregnancy.<br><br>כאשר דבר [HE DID TO SARAH] AS HE HAD SPOKEN — by granting her the birth of a son (Pesikta). Where are the expressions “saying ״ and “speaking” used respectively in regard to these? “Saying” is mentioned in the verse (17:19) “And God said (ויאמר): “nay, but Sarah, thy wife” etc.; — “Speaking“ is mentioned in (15:1) “And the word (דבר “speaking”) of the Lord came to Abraham”, and this was when He made the Covenant between the Pieces where it was stated, “This man (Eliezer) shall not be thine heir, [but one who shall be born from thee shall be thine heir],” and He brought forth this heir from Sarah.<br><br>ויעש ה' לשרה כאשר דבר AND THE LORD DID UNTO SARAH AS HE HAD SPOKEN — means, spoken to Abraham. "}, {"ch": 21, "v": 2, "aliyah": 4, "heb": "וַתַּ֩הַר֩ וַתֵּ֨לֶד שָׂרָ֧ה לְאַבְרָהָ֛ם בֵּ֖ן לִזְקֻנָ֑יו לַמּוֹעֵ֕ד אֲשֶׁר־דִּבֶּ֥ר אֹת֖וֹ אֱלֹהִֽים׃", "onk": "וְעַדִּיאַת וִילִידַת שָׂרָה לְאַבְרָהָם בַּר לְסִיבְתוֹהִי לִזְמַן דִּי מַלִּיל יָתֵיהּ יְיָ:", "onk_en": "She conceived and Sarah gave birth to Avraham’s son in his old age, at the designated time that Elohim had declared.", "pj": "וְאִיתְעַבָּרַת וִילֵידַת שָרָה לְאַבְרָהָם בַּר דְדָמֵי לֵיהּ לְסֵיבְתוּ לְזִימְנָא דְמַלֵיל יָתֵיהּ יְיָ", "pj_en": "And she conceived, and Sarah bare to Abraham a son, who was like to himself in his age, at the time of which the Lord had spoken to him.", "tj": "", "tj_en": "", "rashi": "<b>למועד אשר דבר אתו.<\/b> דִּי מַלִּיל יָתֵהּ, אֶת הַמּוֹעֵד דִּבֵּר וְקָבַע כְּשֶׁאָמַר לוֹ לַמּוֹעֵד אָשׁוּב אֵלֶיךָ (שם י\"ח), שָׂרַט לוֹ שְׂרִיטָה בַּכֹּתֶל, אָמַר לוֹ כְּשֶׁתַּגִּיעַ חַמָּה לִשְׂרִיטָה זוֹ בַּשָּׁנָה הָאַחֶרֶת, תֵּלֵד:<br><br><b>לזקניו.<\/b> היה זיו איקונין שלו דומה לו:", "rashi_en": " למועד אשר דבר אתו Render it as Onkelos translates: “At the appointed time which He had spoken: — the time He had said and appointed. When He had said to him (18:4) “At the set time I will return unto thee”, He scratched a mark in the wall and said to him (Genesis 53:6), “When the sunrays touch this mark next year she will bear a son” (Yalkut Shimoni on Torah 59:1). <br><br><b>In his old age.<\/b> That his [Yitzchok’s] facial features were similar to his [Avraham’s]. "}, {"ch": 21, "v": 3, "aliyah": 4, "heb": "וַיִּקְרָ֨א אַבְרָהָ֜ם אֶֽת־שֶׁם־בְּנ֧וֹ הַנּֽוֹלַד־ל֛וֹ אֲשֶׁר־יָלְדָה־לּ֥וֹ שָׂרָ֖ה יִצְחָֽק׃", "onk": "וּקְרָא אַבְרָהָם יָת שׁוּם בְּרֵיהּ דְּאִתְיְלִיד לֵיהּ דִּילִידַת לֵיהּ שָׂרָה יִצְחָק:", "onk_en": "Avraham named his son that was born to him, to which Sarah had borne to him, Yitzchok.", "pj": "וּקְרָא אַבְרָהָם יַת שׁוּם בְּרֵיהּ דִתְלִיד לֵיהּ דִילֵידַת לֵיהּ שָרָה יִצְחָק", "pj_en": "And Abraham called the name of his son whom Sarah had borne him Izhak.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 4, "aliyah": 4, "heb": "וַיָּ֤מׇל אַבְרָהָם֙ אֶת־יִצְחָ֣ק בְּנ֔וֹ בֶּן־שְׁמֹנַ֖ת יָמִ֑ים כַּאֲשֶׁ֛ר צִוָּ֥ה אֹת֖וֹ אֱלֹהִֽים׃", "onk": "וּגְזַר אַבְרָהָם יָת יִצְחָק בְּרֵיהּ בַּר תְּמַנְיָא יוֹמִין כְּמָא דִי פַקִּיד יָתֵיהּ יְיָ:", "onk_en": "Avraham circumcised his son, Yitzchok, when he was eight days old, as Elohim had commanded him.", "pj": "וּגְזַר אַבְרָהָם יַת יִצְחָק בְּרֵיהּ בַּר תְּמַנְיָא יוֹמִין כְּמָה דְפַקֵיד יָתֵיהּ יְיָ", "pj_en": "And Abraham circumcised Izhak his son, when the son of eight days, as the Lord had commanded him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 5, "aliyah": 5, "heb": "וְאַבְרָהָ֖ם בֶּן־מְאַ֣ת שָׁנָ֑ה בְּהִוָּ֣לֶד ל֔וֹ אֵ֖ת יִצְחָ֥ק בְּנֽוֹ׃", "onk": "וְאַבְרָהָם בַּר מְאָה שְׁנִין כַּד אִתְיְלִיד לֵיהּ יָת יִצְחָק בְּרֵיהּ:", "onk_en": "Avraham was one hundred years old when his son Yitzchok was born to him.", "pj": "וְאַבְרָהָם בַּר מְאָה שְנִין כַּד אִתְיְלִיד לֵיהּ יַת יִצְחָק בְּרֵיהּ", "pj_en": "And Abraham was the son of an hundred years when Izhak his son was born to him.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 6, "aliyah": 5, "heb": "וַתֹּ֣אמֶר שָׂרָ֔ה צְחֹ֕ק עָ֥שָׂה לִ֖י אֱלֹהִ֑ים כׇּל־הַשֹּׁמֵ֖עַ יִֽצְחַק־לִֽי׃", "onk": "וַאֲמֶרֶת שָׂרָה <b>חֶדְוָא<\/b> עֲבַד לִי יְיָ כָּל דִּשְׁמַע <b>יֶחֱדֵּי<\/b> לִי:", "onk_en": "Sarah said, Elohim has given me laughter [<b>gladness<\/b>]. All who hear will laugh [<b>rejoice<\/b>] with me.", "pj": "וַאֲמָרַת שָרָה תֵּימָהָא עָבַד לִי יְיָ כָּל דִשָּׁמַע יִתְמַהּ עָלַי", "pj_en": "And Sarah said, The Lord hath done wondrously for me; all who hear will wonder at me.", "tj": "", "tj_en": "", "rashi": "<b>יצחק לי.<\/b> יִשְׂמַח עָלַי. וּמִ\"אַ הַרְבֵּה עֲקָרוֹת נִפְקְדוּ עִמָּהּ, הַרְבֵּה חוֹלִים נִתְרַפְּאוּ בוֹ בַיּוֹם, הַרְבֵּה תְפִלּוֹת נַעֲנוּ עִמָּהּ, וְרֹב שְׂחוֹק הָיָה בָעוֹלָם:", "rashi_en": "יצחק לי means will rejoice on my account. The Midrashic statement is (Genesis Rabbah 53:8): Many barren women were remembered together with her, many sick were healed in that day, many prayers were answered with hers and there was great rejoicing in the world."}, {"ch": 21, "v": 7, "aliyah": 5, "heb": "וַתֹּ֗אמֶר מִ֤י מִלֵּל֙ לְאַבְרָהָ֔ם הֵינִ֥יקָה בָנִ֖ים שָׂרָ֑ה כִּֽי־יָלַ֥דְתִּי בֵ֖ן לִזְקֻנָֽיו׃", "onk": "וַאֲמֶרֶת <b>מָאן מְהֵימָן דַּאֲמַר לְאַבְרָהָם קְיָם<\/b> דְּתוֹנִיק בְּנִין שָׂרָה אֲרֵי יְלֵידִית בַּר לְסִיבְתוֹהִי:", "onk_en": "She said, Who said to Avraham [<b>Who is faithful that he said to Avraham and fulfills His promise<\/b>], that Sarah would nurse children? For I have given birth to a son in his old age.", "pj": "וַאֲמָרַת מַה מְהֵימָן מְבַשְרָא דִבְשַר לְאַבְרָהָם וְאָמַר עֲתִידָה דְתוֹנִיק בְּנִין שָרָה אֲרוּם יְלֵידַת לֵיהּ בַּר לְאִישׁוֹן סֵיבוּתֵיהּ", "pj_en": "And she said, How faithful was the messenger who announced to Abraham, and said, Sarah will nurse children, for she shall bring forth a son in her old age!", "tj": "וַאֲמָרַת מַה הֲוָות בִּשְרָא דִבְשַר לְרִבּוֹנִי לְאַבְרָהָם מִן שֵׁירוּיָהּ וַאֲמַר עֲתִידָה הִיא לְמִנְקָה אֲרֵי יְלִידִית בַר לְסִבְתּוֹהִי:", "tj_en": "And she said, What was the announcement that announced to my lord Abraham at the beginning, and said, It will be that she will give suck, because she shall bring forth a son in her old age?", "rashi": "<b>מי מלל לאברהם.<\/b> לְשׁוֹן שֶׁבַח וַחֲשִׁיבוּת, רְאוּ, מִי הוּא וְכַמָּה הוּא שׁוֹמֵר הַבְטָחָתוֹ הַקָּבָּ\"ה מַבְטִיחַ וְעוֹשֶׂה.<br><br><b>מלל.<\/b> שִׁנָּה הַכָּתוּב וְלֹא אָמַר דִּבֵּר – גִּימַטְרִיָּא שֶׁלּוֹ ק', כְּלוֹמַר לְסוֹף מֵאָה לְאַבְרָהָם:<br><br><b>היניקה בנים שרה.<\/b> וּמַהוּ בָנִים לְשׁוֹן רַבִּים? בְּיוֹם הַמִּשְׁתֶּה הֵבִיאוּ הַשָּׂרוֹת בְּנֵיהֶן עִמָּהֶן וְהֵנִיקָה אוֹתָם, שֶׁהָיוּ אוֹמְרוֹת לֹא יָלְדָה שָׂרָה, אֶלָֹּא אֲסוּפִי הֵבִיאָה מִן הַשּׁוּק:", "rashi_en": "מי מלל לאברהם The word מי is used as an exclamation of praise alluding to the distinguished position of the Being spoken of. The sense therefore is: See, Who it is, and to what extent He keeps his promise! The Holy One, blessed be He, promises and performs!<br><br>מלל SAID — Scripture employs here an unusual expression and does not use דבר, said, because its numerical value (i. e. of מלל) is one hundred, signifying as much as: Who was it who spoke in reference to the end of one hundred years of Abraham’s life (Genesis Rabbah 53:9).<br><br>הניקה בנים שרה THAT SARAH WILL HAVE SUCKLED CHILDREN. What is the force of the word “children”, in the plural? On the feast-day princesses brought their children with them and she (Sarah) gave them suck, for these women said, “Sarah has not given birth to a son; she has brought into her house a foundling from the street” (Bava Metzia 87a). "}, {"ch": 21, "v": 8, "aliyah": 5, "heb": "וַיִּגְדַּ֥ל הַיֶּ֖לֶד וַיִּגָּמַ֑ל וַיַּ֤עַשׂ אַבְרָהָם֙ מִשְׁתֶּ֣ה גָד֔וֹל בְּי֖וֹם הִגָּמֵ֥ל אֶת־יִצְחָֽק׃", "onk": "וּרְבָא רַבְיָא וְאִתְחֲסִיל וַעֲבַד אַבְרָהָם מִשְׁתְּיָא רַבָּא בְּיוֹמָא דְּאִתְחֲסִיל יָת יִצְחָק:", "onk_en": "The child grew and was weaned. Avraham made a great feast on the day Yitzchok was weaned.", "pj": "וּרְבָא טַלְיָא וְאִתְחַסִין וְעָבַד אַבְרָהָם מִשְׁתַּיָא רַבָּא בְּיוֹמָא דְאַחְסִין יַת יִצְחָק", "pj_en": "And the child grew and was weaned. And Abraham made a great feast on the day when Izhak was weaned.", "tj": "", "tj_en": "", "rashi": "<b>ויגמל.<\/b> לְסוֹף כ\"ד חֹדֶשׁ (גיטין ע\"ה):<br><br><b>משתה גדול.<\/b> שֶׁהָיוּ שָׁם גְּדוֹלֵי הַדּוֹר שֵׁם וָעֵבֶר וַאֲבִימֶלֶךְ (בראשית רבה):", "rashi_en": "ויגמל AND HE WAS WEANED — at the expiration of twenty- four months (Gittin 75b).<br><br>משתה גדול A GREAT FEAST — it is so designated because the great men of that generation were present at it (Genesis Rabbah 53:10) — Shem, Eber and Abimelech (Tanchuma Yashan, Vayishlach 23). "}, {"ch": 21, "v": 9, "aliyah": 5, "heb": "וַתֵּ֨רֶא שָׂרָ֜ה אֶֽת־בֶּן־הָגָ֧ר הַמִּצְרִ֛ית אֲשֶׁר־יָלְדָ֥ה לְאַבְרָהָ֖ם מְצַחֵֽק׃", "onk": "וַחֲזַת שָׂרָה יָת בַּר הָגָר מִצְרֵיתָא דִּיְלִידַת לְאַבְרָהָם מְחָיִיךְ:", "onk_en": "Sarah saw that the son of Hagar, the Egyptian, that she had born to Avraham, was mocking.", "pj": "וַחֲמַת שָרָה יַת בְּרָא דְהָגָר מִצְרֵיתָא דִילֵידַת לְאַבְרָהָם מְגַחֵךְ לְפוּלְחָנָא נוּכְרָאָה וְגָחִין לַיְיָ", "pj_en": "And Sarah observed the son of Hagar the Mizreitha, whom she bare to Abraham, mocking with a strange worship, and bowing to the Lord.", "tj": "וַחֲמַת שָרָה יַת בַּר הָגָר מִצְרֵיתָא דִילֵידַת לְאַבְרָהָם עֲבַד עוֹבָדִין בִּישִׁין דְלָא כַשְׁרִין לְאִתְעַבְּדָא מְגַחֵךְ בְּפוּלְחָנָא נוּכְרָאָה:", "tj_en": "And Sarah observed the son of Hagar the Mizreitha, whom she bare to Abraham, doing evil works which are not fitting to be done, mocking in a strange worship.", "rashi": "<b>מצחק.<\/b> לְשׁוֹן עֲ\"זָ, כְּמוֹ שֶׁנֶּאֱמַר וַיָּקֻמוּ לְצַחֵק (שמות ל\"ב), דָּ\"אַ לְשׁוֹן גִּלּוּי עֲרָיוֹת, כְּמָה דְּתֵימָא לְצַחֶק בִּי (בראשית ל\"ט), דָּ\"אַ לְשׁוֹן רְצִיחָה, כְּמוֹ יָקוּמוּ נָא הַנְּעָרִים וִישַׂחֲקוּ לְפָנֵינוּ וְגוֹ' (שמואל ב ב'), שֶׁהָיָה מֵרִיב עִם יִצְחָק עַל הַיְרֻשָּׁה וְאוֹמֵר אֲנִי בְּכוֹר וְנוֹטֵל פִּי שְׁנַיִם, וְיוֹצְאִים בַּשָּׂדֶה וְנוֹטֵל קַשְׁתּוֹ וְיוֹרֶה בוֹ חִצִּים, כְּמָה דְּתֵימָא כְּמִתְלַהְלֵהַּ הַיֹּרֶה זִקִּים וְגוֹ' וְאָמַר הֲלֹא מְשַׂחֵק אָנִי (משלי כ\"ו):", "rashi_en": "מצחק MAKING SPORT — This means worshipping idols, as it is said in reference of the Golden Calf, (Exodus 32:6) “And they rose up to make merry (לצחק).” Another explanation is that it refers to immoral conduct, just as you say in reference to Potiphar’s wife, (Genesis 39:17) “To mock (לצחק) at me.” Another explanation is that it refers to murder, as (2 Samuel 2:14) “Let the young men, I pray thee, arise and make sport (וישחקו) before us” (where they fought with and killed one another)  From Sarah’s reply — “for the son of this bondwoman shall not be heir with my son״ — you may infer that he (Ishmael) was quarrelling with Isaac about the inheritance, saying, “I am the first-born and will, therefore, take a double portion”. They went into the field and he (Ishmael) took his bow and shot arrows at him (Isaac), just as you say (Proverbs 26:18-19) “As a madman who casteth firebrands, [arrows and death] and says: I am only מצחק mocking” (Genesis Rabbah 53:11). "}, {"ch": 21, "v": 10, "aliyah": 5, "heb": "וַתֹּ֙אמֶר֙ לְאַבְרָהָ֔ם גָּרֵ֛שׁ הָאָמָ֥ה הַזֹּ֖את וְאֶת־בְּנָ֑הּ כִּ֣י לֹ֤א יִירַשׁ֙ בֶּן־הָאָמָ֣ה הַזֹּ֔את עִם־בְּנִ֖י עִם־יִצְחָֽק׃", "onk": "וַאֲמֶרֶת לְאַבְרָהָם תָּרֵךְ אַמְתָא הָדָא וְיַת בְּרַהּ אֲרֵי לָא יֵרַת בַּר אַמְתָא הָדָא עִם בְּרִי עִם יִצְחָק:", "onk_en": "She said to Avraham, Drive out this slave-woman and her son, for the son of this slave-woman will not inherit with my son, with Yitzchok.", "pj": "וַאֲמָרַת לְאַבְרָהָם טְרוֹד יַת אַמְתָא הָדָא וְיַת בְּרָהּ אֲרוּם לֵית אֶוְושַׁר לְמֵירוּת בַּר אַמְתָא הָדָא עִם בְּרִי וְיִגַח קְרָבָא עִם יִצְחָק", "pj_en": "And she said to Abraham, Cast out this handmaid and her son: for it is not possible for the son of this handmaid to inherit with my son; and he to make war with Izhak.", "tj": "", "tj_en": "", "rashi": "<b>עם בני עם יצחק.<\/b> מִכֵּיוָן שֶׁהוּא בְנִי אֲפִלּוּ אִם אֵינוֹ הָגוּן כְּיִצְחָק, אוֹ הָגוּן כְּיִצְחָק אֲפִלּוּ אֵינוֹ בְנִי, אֵין זֶה כְדַאי לִירַשׁ עִמּוֹ, קַ\"וָ עִם בְּנִי עִם יִצְחָק, שֶׁשְּׁתֵיהֶן בּוֹ (בראשית רבה):", "rashi_en": "עם בני עם יצחק WITH MY SON, WITH ISAAC —For since this is my son, even though he were not as good as Isaac really is, or if he were as good a man as Isaac really is, even though he were not my son, this one (Ishmael) is not deserving of inheriting with him: how much less is he deserving of inheriting with my son, with Isaac — with one who possesses both these qualities (of being my son and of being the good man Isaac) (Genesis Rabbah 53:11). "}, {"ch": 21, "v": 11, "aliyah": 5, "heb": "וַיֵּ֧רַע הַדָּבָ֛ר מְאֹ֖ד בְּעֵינֵ֣י אַבְרָהָ֑ם עַ֖ל אוֹדֹ֥ת בְּנֽוֹ׃", "onk": "וּבְאֵישׁ פִּתְגָּמָא לַחֲדָא בְּעֵינֵי אַבְרָהָם עַל עֵיסַק בְּרֵיהּ:", "onk_en": "This thing was very wrong in the eyes of Avraham, on account of his son.", "pj": "וּבְאֵישׁ פִּתְגָמָא לַחֲדָא בְּעֵינֵי אַבְרָהָם עַל עֵיסַק יִשְׁמָעֵאל בְּרֵיהּ דְיִפְלַח לְפוּלְחָנָא נוּכְרָאָה", "pj_en": "And the thing was very evil in Abraham's eyes, on account of Ishmael his son, who would practise a strange worship.", "tj": "", "tj_en": "", "rashi": "<b>על אודות בנו.<\/b> שֶׁשָּׁמַע שֶׁיָּצָא לְתַרְבּוּת רָעָה (בראשית רבה), וּפְשׁוּטוֹ עַל שֶׁאָמְרָה לוֹ לְשַׁלְּחוֹ:", "rashi_en": "על אדות בנו ON ACCOUNT OF HIS SON — because he heard that he had taken to degenerate ways (Exodus Rabbah 1:1). The real meaning, however, is because she (Sarah) had told him to send him away. "}, {"ch": 21, "v": 12, "aliyah": 5, "heb": "וַיֹּ֨אמֶר אֱלֹהִ֜ים אֶל־אַבְרָהָ֗ם אַל־יֵרַ֤ע בְּעֵינֶ֙יךָ֙ עַל־הַנַּ֣עַר וְעַל־אֲמָתֶ֔ךָ כֹּל֩ אֲשֶׁ֨ר תֹּאמַ֥ר אֵלֶ֛יךָ שָׂרָ֖ה שְׁמַ֣ע בְּקֹלָ֑הּ כִּ֣י בְיִצְחָ֔ק יִקָּרֵ֥א לְךָ֖ זָֽרַע׃", "onk": "וַאֲמַר יְיָ לְאַבְרָהָם לָא יַבְאֵשׁ בְּעֵינָיךְ עַל עוּלֵימָא וְעַל אַמְתָךְ כֹּל דִּי תֵימַר לָךְ שָׂרָה <b>קַבֵּל מִנַּהּ<\/b> אֲרֵי בְיִצְחָק יִתְקְרוּן לָךְ בְּנִין:", "onk_en": "Elohim said to Avraham, Do not consider this wrong in your eyes on account of the boy and your slave-woman. Regarding all that Sarah tells you, listen to her voice [<b>accept from her<\/b>], for [only] through Yitzchok will seed be considered yours.", "pj": "וַאֲמַר יְיָ לְאַבְרָהָם לָא יַבְאִישׁ בְּעֵינָךְ עַל טַלְיָא דִי נְפַק מִתַּרְבּוּתָךְ וְעַל אַמְתָךְ דְאַנְתְּ מְתָרֵךְ כָּל דְתֵימַר לָךְ שָרָה קַבֵּיל מִנָהּ דִנְבִיאֲתָא הִיא אֲרוּם בְּיִצְחָק יִתְקְרוּן לָךְ בְּנִין וְדֵין בַּר אַמְתָא לָא מִתְיַחֵס בַּתְרָךְ", "pj_en": "And the Lord said to Abraham, Let it not be evil in thine eyes on account of the youth who goeth forth from thy nurturning, and of thy handmaid whom thou sendest away. Hearken unto all that Sarah saith to thee, because she is a prophetess; for in Izhak shall sons be called unto thee; and this son of the handmaid shall not be genealogized after thee.", "tj": "", "tj_en": "", "rashi": "<b>שמע בקולה.<\/b> לָמַדְנוּ שֶׁהָיָה אַבְרָהָם טָפֵל לְשָׂרָה בִּנְבִיאוּת:", "rashi_en": "שמע בקולה HEARKEN UNTO HER VOICE — we may infer that Abraham was inferior to Sarah in respect of prophecy (Exodus Rabbah 1:1). "}, {"ch": 21, "v": 13, "aliyah": 5, "heb": "וְגַ֥ם אֶת־בֶּן־הָאָמָ֖ה לְג֣וֹי אֲשִׂימֶ֑נּוּ כִּ֥י זַרְעֲךָ֖ הֽוּא׃", "onk": "וְאַף יָת בַּר אַמְתָא לְעַם אֲשַׁוִּנֵּיהּ אֲרֵי בְנָךְ הוּא:", "onk_en": "[But] also the son of the slave-woman I will make into a nation, for he is [of] your seed.", "pj": "וְאוֹף יַת בַּר אַמְתָא לְעַם לִיסְטִים אֲשַׁוִינֵיהּ אֲרוּם בְּרָךְ הוּא", "pj_en": "But the son of the handmaid have I set for a predatory people (le-am leistim), because he is thy son.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 14, "aliyah": 5, "heb": "וַיַּשְׁכֵּ֣ם אַבְרָהָ֣ם&thinsp;<small>׀<\/small>&thinsp;בַּבֹּ֡קֶר וַיִּֽקַּֽח־לֶ֩חֶם֩ וְחֵ֨מַת מַ֜יִם וַיִּתֵּ֣ן אֶל־הָ֠גָ֠ר שָׂ֧ם עַל־שִׁכְמָ֛הּ וְאֶת־הַיֶּ֖לֶד וַֽיְשַׁלְּחֶ֑הָ וַתֵּ֣לֶךְ וַתֵּ֔תַע בְּמִדְבַּ֖ר בְּאֵ֥ר שָֽׁבַע׃", "onk": "וְאַקְדֵּים אַבְרָהָם בְּצַפְרָא וּנְסִיב לַחֲמָא וְרָקְבָּא דְמַיָּא וִיהַב לְהָגָר שַׁוִּי עַל כַּתְפַּהּ וְיָת רַבְיָא וְשַׁלְחַהּ וַאֲזָלַת וְתָעַת בְּמַדְבְּרָא (<small>נ\"י<\/small> בְּמַדְבֵּר) בְּאֵר שָׁבַע:", "onk_en": "Avraham got up early in the morning. He took bread and a skin [pouch] of water, and gave it to Hagar. He placed it on her shoulder with the lad, and sent her away. She went and lost her way in the desert of Beer Sheva.", "pj": "וְאַקְדִים אַבְרָהָם בְּצַפְרָא וּנְסִיב לַחֲמָא וְקִרְוָוא דְמַיָא וִיהַב לְהָגָר שַׁוִי עַל כַּתְפָהּ וְקָשַׁר לָהּ בְּמוֹתְנָהָא לְאוֹדוֹעֵי דְאַמְתָא הִיא וְיַת רִיבָא וּפַטְרָהּ בְגִיטָא וְאָזְלַת וְטָעַת מִן אָרְחָא לְמַדְבְּרָא דִסְמִיךְ לְבֵירָא דְשָׁבַע", "pj_en": "And Abraham rose up in the morning, and took bread and a cruse of water, and gave to Hagar to bear upon her shoulder, and bound it to her loins, to signify that she was a servant, and the child, and dismissed her with a letter of divorce (be-gitta). And she went, and wandered from the way into the desert which was hard by Beersheba.", "tj": "", "tj_en": "", "rashi": "<b>לחם וחמת מים.<\/b> וְלֹא כֶסֶף וְזָהָב, לְפִי שֶׁהָיָה שׂוֹנְאוֹ עַל שֶׁיָּצָא לְתַרְבּוּת רָעָה:<br><br><b>ואת הילד.<\/b> אַף הַיֶּלֶד שָׂם עַל שִׁכְמָהּ, שֶׁהִכְנִיסָה בוֹ שָׂרָה עַיִן רָעָה וַאֲחָזַתּוּ חַמָּה וְלֹא יָכוֹל לֵילֵךְ בְּרַגְלָיו (בראשית רבה):<br><br><b>ותלך ותתע.<\/b> חָזְרָה לְגִלּוּלֵי בֵית אָבִיהָ (פרקי דרבי אליעזר פ' ל'):", "rashi_en": "לחם וחמת מים BREAD AND A BOTTLE OF WATER — but not silver and gold, because he hated him for taking to degenerate ways (Exodus Rabbah 1:1).<br><br>ואת הילד AND THE CHILD — the child, too, he placed on her shoulder, for Sarah had cast an evil eye upon him, so that a fever seized him and he could not walk (Genesis Rabbah 53:13).<br><br>ותלך ותתע AND SHE WENT AND WANDERED — she reverted to the idol worship of her father’s house (Pirkei DeRabbi Eliezer 30). "}, {"ch": 21, "v": 15, "aliyah": 5, "heb": "וַיִּכְל֥וּ הַמַּ֖יִם מִן־הַחֵ֑מֶת וַתַּשְׁלֵ֣ךְ אֶת־הַיֶּ֔לֶד תַּ֖חַת אַחַ֥ד הַשִּׂיחִֽם׃", "onk": "וּשְׁלִימוּ מַיָּא מִן רָקְבָּא וּרְמַת יָת רַבְיָא תְּחוֹת חַד מִן אִילָנַיָּא:", "onk_en": "The water in the skin was used up, and she threw the lad under one of the bushes.", "pj": "וַהֲווֹ כֵּיוַן דְמָטוּ לְפִיתְחָא דְמַדְבְּרָא אִדְכְּרוּ לְמִטְעֵי בָּתַר פּוּלְחָנָא נוּכְרָאָה וְלָקָה יִשְׁמָעֵאל בְּאֵישָׁא צְמִירְתָּא וּשְׁתִי כָּל מַיָא עַד דִי שְׁלִימוּ כָּל מַיָא מִן קִרְוָא וְאִתְחֲרִיךְ וְאִתְקְלִישׁ בִּשְרֵיהּ וְסוֹבְרָתֵיהּ וְאִשְׁתַּלְהִיאַת וּקְרָא לִדְחַלְתָּא דְאִיבָּא וְלָא עָנָא יָתָהּ וּמִן יַד טַלְקַת יַת רִיבָא תְּחוֹת חַד מִן אִלָנַיָא", "pj_en": "And it was when they came to the entrance of the desert, they remembered to wander after strange worship; and Ishmael was seized with a burning thirst, and drank of the water till all the water was consumed from the cruse. And he was dried up, and withered in his flesh; and she carried him, and was exhausted, and she cried unto the Fear of his father, and He answered her not; and she laid the youth down at once under one of the trees.", "tj": "וּשְׁלִימוּ מַיָא מִן קַרְנַת וְטַלְקַת יַת טַלְיָא:", "tj_en": "And the water was consumed from the cruse, and she took up the youth.", "rashi": "<b>ויכלו המים.<\/b> לְפִי שֶׁדֶּרֶךְ חוֹלִים לִשְׁתּוֹת הַרְבֵּה:", "rashi_en": "ויכלו המים AND THE WATER WAS SPENT, because it is the nature of sick people to drink much (Genesis Rabbah 53:13). "}, {"ch": 21, "v": 16, "aliyah": 5, "heb": "וַתֵּ֩לֶךְ֩ וַתֵּ֨שֶׁב לָ֜הּ מִנֶּ֗גֶד הַרְחֵק֙ כִּמְטַחֲוֵ֣י קֶ֔שֶׁת כִּ֣י אָֽמְרָ֔ה אַל־אֶרְאֶ֖ה בְּמ֣וֹת הַיָּ֑לֶד וַתֵּ֣שֶׁב מִנֶּ֔גֶד וַתִּשָּׂ֥א אֶת־קֹלָ֖הּ וַתֵּֽבְךְּ׃", "onk": "וַאֲזַלַּת וִיתִיבַת לַהּ מִקֳּבֵל אַרְחֵיקַת (<small>נ\"י<\/small> אַרְחִיק) כְּמֵיגַר קַשְׁתָּא אֲרֵי אֲמֶרֶת לָא אֶחֱזֵי בְּמוֹתָא דְרַבְיָא וִיתִיבַת מִקֳּבֵל וַאֲרִימַת יָת קָלַהּ וּבְכָת:", "onk_en": "She went and sat facing him, about [the distance] of bow-shots away. She said, Let me not see the lad die. She sat facing him and wept in a loud voice.", "pj": "וְאָזְלַת וִיתֵיבַת לָהּ לִסְטַר חַד וְטַלְקַת יַת פּוּלְחָנָא נוּכְרָאָה אַרְחִיקַת מִן בְּרָהּ כְּשִׁיעוּר מֵיגַד בְּקַשְׁתָּא אֲרוּם אָמְרַת לֵית אֲנָא יָכְלָא לְמֵיחֲמֵי בְּמוֹתָא דְטַלְיָא וִיתֵבַת מִקְבֵיל בְּרָהּ וַאֲרֵימַת יַת קָלָהּ וּבְכָת", "pj_en": "And she went and sat on one side, and cast away the idol (or the strange worship), and removed from her son, as the distance of an arrow from the bow; for she said, I am not able to see the death of the child. And she sat over against her son, and lifted up her voice and wept.", "tj": "", "tj_en": "", "rashi": "<b>מנגד.<\/b> מֵרָחוֹק:<br><br><b>כמטחוי קשת.<\/b> כִּשְׁתֵּי טִיחוֹת (בראשית רבה), וְהוּא לְשׁוֹן יְרִיַּת חֵץ, בִּלְשׁוֹן מִשְׁנָה שֶׁהֵטִיחַ בְאִשְׁתּוֹ, עַל שֵׁם שֶׁהַזֶּרַע יוֹרֶה כַּחֵץ; וְאִם תֹּאמַר הָיָה לוֹ לִכְתֹּב כִּמְטַחֵי קֶשֶׁת, מִשְׁפַּט הַוָּי\"ו לִכָּנֵס לְכָאן, כְּמוֹ בְּחַגְוֵי הַסֶּלַע (שיר השירים ב'), מִגִּזְרַת וְהָיְתָה אַדְמַת יְהוּדָה לְמִצְרַיִם לְחָגָּא (ישעיהו י\"ט), וּמִגִּזְרַת יָחוֹגּוּ וְיָנוּעוּ כַּשִּׁכּוֹר (תהילים ק\"ז), וְכֵן קַצְוֵי אֶרֶץ (תהילים ס\"ה), מִגִּזְרַת קָצֶה:<br><br><b>ותשב מנגד.<\/b> כֵּיוָן שֶׁקָּרַב לָמוּת הוֹסִיפָה לְהִתְרַחֵק:", "rashi_en": "מנגד means some distance away.<br><br>כמטחוי קשת AS IT WERE A BOWSHOT — about two bowshots (since the first word is really plural) (Genesis Rabbah 53:13). The word signifies shooting an arrow — we find it so used in the Mishna (Sanhedrin 46a). If you say that it should have been written כמטחי קשת  (since the root is טחה) then I say that it is quite regular for a ו to be inserted in these forms as (Song 2:14) “in the clefts  (בחגוי) of the rock”, where בחגוי is of the same derivation as חגא in (Isaiah 19:17) “And the land of Judah shall become a breach (לחגא) to Egypt” and of the same derivation as יחוגו in (Psalms 107:27) “They reeled (וחוגו) to and fro and staggered like a drunken man”. Similar, also, is (Psalms 65:6) “The ends of (קצוי) the earth” which is of the same derivation as ,קצה, end.<br><br>ותשב מנגד SHE SAT AT A DISTANCE — (this is the second time that it is so said) — now that he came nearer to death she moved further away from him. "}, {"ch": 21, "v": 17, "aliyah": 5, "heb": "וַיִּשְׁמַ֣ע אֱלֹהִים֮ אֶת־ק֣וֹל הַנַּ֒עַר֒ וַיִּקְרָא֩ מַלְאַ֨ךְ אֱלֹהִ֤ים&thinsp;<small>׀<\/small>&thinsp;אֶל־הָגָר֙ מִן־הַשָּׁמַ֔יִם וַיֹּ֥אמֶר לָ֖הּ מַה־לָּ֣ךְ הָגָ֑ר אַל־תִּ֣ירְאִ֔י כִּֽי־שָׁמַ֧ע אֱלֹהִ֛ים אֶל־ק֥וֹל הַנַּ֖עַר בַּאֲשֶׁ֥ר הוּא־שָֽׁם׃", "onk": "<b>וּשְׁמִיעַ קֳדָם יְיָ<\/b> יָת קָלֵיהּ דְּרַבְיָא וּקְרָא מַלְאֲכָא דַיְיָ לְהָגָר מִן שְׁמַיָּא וַאֲמַר לַהּ מָה לִיךְ הָגָר לָא תִדְחֲלִי אֲרֵי <b>שְׁמִיעַ קֳדָם יְיָ<\/b> יָת קָלֵיהּ דְּרַבְיָא בַּאֲתַר דְּהוּא תַמָּן:", "onk_en": "Elohim heard the voice of the lad [<b>was heard before Elohim<\/b>]. An angel of God called to Hagar from heaven and said to her, What is the matter, Hagar? Do not fear. Elohim has heard the voice of the lad [<b>has been heard before Elohim<\/b>] in the place where he is.", "pj": "וּשְׁמִיעַ קֳדָם יְיָ יַת קָלֵיהּ דְטַלְיָא בְּגִין זְכוּתֵיהּ דְאַבְרָהָם וּקְרָא מַלְאָכָא דַיְיָ לְהָגָר מִן שְׁמַיָא וַאֲמַר לָהּ מַה לִיךְ הָגָר לָא תַּסְתִּיפִין אֲרוּם שְׁמִיעַ קֳדָם יְיָ יַת קָלֵיהּ דְטַלְיָא וְלָא דָן יָתֵיהּ לְפוּם עוֹבְדוֹי בִּשַׁיָא דְהוּא עָתִיד לְמֶעֱבַד אֱלָהֵין בְּגִין זְכוּתֵיהּ דְאַבְרָהָם חַס עִילוֹי בַּאֲתַר דְהוּא תַּמָן", "pj_en": "And the voice of the youth was heard before the Lord for the righteousness' sake of Abraham; and the Angel of the Lord called to Hagar from heaven, and said, What to thee, Hagar? Faint not, for the voice of the youth is heard before the Lord; neither shall judgment be according to the evil which he will do, but according to the righteousness of Abraham is mercy upon him in the place where he is.", "tj": "", "tj_en": "", "rashi": "<b>את קול הנער.<\/b> מִכָּאן שֶׁיָּפָה תְּפִלַּת הַחוֹלֶה מִתְּפִלַּת אֲחֵרִים עָלָיו וְהִיא קוֹדֶמֶת לְהִתְקַבֵּל (בראשית רבה):<br><br><b>באשר הוא שם.<\/b> לְפִי מַעֲשִׂים שֶׁהוּא עוֹשֶׂה עַכְשָׁו הוּא נִדּוֹן, וְלֹא לְפִי מַה שֶּׁהוּא עָתִיד לַעֲשׂוֹת (ראש השנה ט\"ז), לְפִי שֶׁהָיוּ מַלְאֲכֵי הַשָּׁרֵת מְקַטְרְגִים וְאוֹמְרִים רִבּוֹנו שֶׁל עוֹלָם, מִי שֶׁעָתִיד זַרְעוֹ לְהָמִית בָּנֶיךָ בַּצָּמָא אַתָּה מַעֲלֶה לוֹ בְּאֵר, וְהוּא מְשִׁיבָם עַכְשָׁו מַה הוּא, צַדִּיק אוֹ רָשָׁע? אָמְרוּ לוֹ צַדִּיק, אָמַר לָהֶם לְפִי מַעֲשָׂיו שֶׁל עַכְשָׁו אֲנִי דָנוֹ, וְזֶהוּ בַּאֲשֶׁר הוּא שָׁם. וְהֵיכָן הֵמִית אֶת יִשְׂרָאֵל בַּצָּמָא? כְּשֶׁהֶגְלָם נְבוּכַדְנֶצַּר, שֶׁנֶּאֱמַר מַשָּׂא בַּעְרָב וְגוֹ' לִקְרַאת צָמֵא הֵתָיוּ מָיִם וְגוֹ' (ישעיהו כ\"א), כְּשֶׁהָיוּ מוֹלִיכִין אוֹתָם אֵצֶל עַרְבִיִּים, הָיוּ יִשְׂרָאֵל אוֹמְרִים לְשׁוֹבֵיהֶם בְּבַקָּשָׁה מִכֶּם הוֹלִיכוּנוּ אֵצֶל בְּנֵי דוֹדֵנוּ יִשְׁמָעֵאל וִירַחֲמוּ עָלֵינוּ, שֶׁנֶּאֱמַר אֹרְחוֹת דְּדָנִים (שם) – אַל תִּקְרֵי דְּדָנִים אֶלָּא דּוֹדִים – וְאֵלּוּ יוֹצְאִים לִקְרָאתָם וּמְבִיאִין לָהֶם בָּשָׂר וְדָג מָלוּחַ וְנוֹדוֹת נְפוּחִים, כִּסְבוּרִים יִשְׂרָאֵל שֶׁהֵם מְלֵאִים מַיִם, וּכְשֶׁמַּכְנִיסוֹ לְתוֹךְ פִּיו וּפוֹתְחוֹ, הָרוּחַ נִכְנֶסֶת בְּגוּפוֹ וּמֵת:", "rashi_en": "את קול הנער THE VOICE OF THE LAD — From this we may infer that the prayer of a sick person is more effective than the prayer offered by others for him and that it is more readily accepted (Genesis Rabbah 53:14).<br><br>באשר הוא שם WHERE HE IS — According to the actions he is now doing shall he be judged and not according to what he may do in future. Because the ministering angels laid information against him, saying, “Master of the Universe, for him whose descendants will at one time kill your children with thirst will You provide a well?” He asked them, “What is he now, righteous or wicked?” They replied to him, “Righteous.” He said to them, “According to his present deeds will I judge him.” This is the meaning of what is written: “[For God hath heard the voice of the lad ] באשר הוא שם in that condition in which he now is” (Genesis Rabbah 53:14). Where did he (Ishmael) kill Israel with thirst? When Nebuchadnezzar carried them into exile — as it is said, (Isaiah 21:13, 14) “The burden upon Arabia … O ye caravans of Dedanites, unto him that is thirsty bring ye water! etc.” When they were bringing them near the Arabians the Israelites said to their captors, “We beg of you bring us to the children of our uncle, Ishmael, who will certainly show pity to us”, as it is said, “O ye caravans of the Dedanites (דדנים)”; read not דדנים but דודים, kinsmen. — These indeed came to them bringing them salted meat and fish and water-skins inflated with air. The Israelites believed that these were full of water and when they placed them in their mouths, after having opened them, the air entered their bodies and they died (Eichah Rabbah 2:4). "}, {"ch": 21, "v": 18, "aliyah": 5, "heb": "ק֚וּמִי שְׂאִ֣י אֶת־הַנַּ֔עַר וְהַחֲזִ֥יקִי אֶת־יָדֵ֖ךְ בּ֑וֹ כִּֽי־לְג֥וֹי גָּד֖וֹל אֲשִׂימֶֽנּוּ׃", "onk": "קוּמִי טוּלִי יָת רַבְיָא וְאַתְקִיפִי יָת יְדֵךְ בֵּיהּ אֲרֵי לְעַם סַגִּי אֲשַׁוִּנֵּיהּ:", "onk_en": "Get up and lift up the lad. Keep your hand strong on him, for I will make him a great nation.", "pj": "אִזְדְקִיפִי טוּלִי יַת טַלְיָא וְאִתְקִיפִי יַת יְדִיךְ בֵּיהּ אֲרוּם לְעַם רַב אֲשֵׁוִינֵיהּ", "pj_en": "Arise, support the child, and strengthen thine hand in him: for I have set him for a great people.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 19, "aliyah": 5, "heb": "וַיִּפְקַ֤ח אֱלֹהִים֙ אֶת־עֵינֶ֔יהָ וַתֵּ֖רֶא בְּאֵ֣ר מָ֑יִם וַתֵּ֜לֶךְ וַתְּמַלֵּ֤א אֶת־הַחֵ֙מֶת֙ מַ֔יִם וַתַּ֖שְׁקְ אֶת־הַנָּֽעַר׃", "onk": "<b>וּגְלָא<\/b> יְיָ יָת עֵינָהַהּ וַחֲזַת בֵּירָא דְמַיָּא וַאֲזָלַת וּמְלַת יָת רָקְבָּא מַיָּא וְאַשְׁקִיאַת יָת רַבְיָא:", "onk_en": "Elohim opened [<b>uncovered<\/b>] her eyes, and she saw a well of water. She went and filled the skin with water, and gave the lad to drink.", "pj": "וְגַלֵי יְיָ יַת עֵינָהָא וְאִתְגְלֵי לָהּ בֵּרָא דְמַיָא וְאָזְלַת וּמְלַת יַת קִרְוָא מַיָא וְאַשְׁקִיַית יַת טַלְיָיא", "pj_en": "And the Lord opened her eyes, and showed her a well of water, and she went and filled the cruse with water, and gave the youth to drink.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 20, "aliyah": 5, "heb": "וַיְהִ֧י אֱלֹהִ֛ים אֶת־הַנַּ֖עַר וַיִּגְדָּ֑ל וַיֵּ֙שֶׁב֙ בַּמִּדְבָּ֔ר וַיְהִ֖י רֹבֶ֥ה קַשָּֽׁת׃", "onk": "וַהֲוָה <b>מֵימְרָא דַיְיָ בְּסַעֲדֵיהּ דְּרַבְיָא<\/b> וּרְבָא וִיתֵב בְּמַדְבְּרָא וַהֲוָה רָבֵי קַשְׁתָּא:", "onk_en": "Elohim was with the lad [<b>The Word of Elohim supported the lad<\/b>] and he grew up. He settled in the wilderness, [where] he became an expert archer.", "pj": "וַהֲוָה מֵימְרָא דַיְיָ בְּסַעֲדֵיהּ דְטַלְיָא וּרְבָא וְיָתִיב בְּמַדְבְּרָא וַהֲוָה יַלִיף רַבֵּי קַשְׁוָותָא", "pj_en": "And the Word of the Lord was the helper of the youth, and he grew and dwelt in the wilderness, and became a skilful master of the bow.", "tj": "", "tj_en": "", "rashi": "<b>רבה קשת.<\/b> יוֹרֶה חִצִּים בְּקֶשֶׁת:<br><br><b>קשת.<\/b> עַל שֵׁם הָאֻמָּנוּת, כְּמוֹ חַמָּר, גַּמָּל, צַיָּד, לְפִיכָך הַשִּׁי\"ן מֻדְגֶּשֶׁת. הָיָה יוֹשֵׁב בַּמִּדְבָּר וּמְלַסְטֵם אֶת הָעוֹבְרִים, הוּא שֶׁנֶּאֱמַר יָדוֹ בַכֹּל וְגוֹמֵר:", "rashi_en": "רבה קשת AN ARCHER — One who shoots arrows by a bow. <br><br>(This is the explanation of רבה קַשָּׁת he is so designated after his occupation, that of a bow-man — just as חַמָּר denotes one who is an ass driver, גַּמָּל a camel driver, צַיָּד a huntsman; consequently the ש has a Dagesh (which distinguishes all these forms). — He used to live in the wilderness and rob travelers. It is to this the statement refers, (15:12) ידו בכל “his hand shall be against everyone, etc.” "}, {"ch": 21, "v": 21, "aliyah": 5, "heb": "וַיֵּ֖שֶׁב בְּמִדְבַּ֣ר פָּארָ֑ן וַתִּֽקַּֽח־ל֥וֹ אִמּ֛וֹ אִשָּׁ֖ה מֵאֶ֥רֶץ מִצְרָֽיִם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וִיתֵב בְּמַדְבְּרָא דְפָארָן וּנְסִיבַת לֵיהּ אִמֵּיהּ אִתְּתָא מֵאַרְעָא דְמִצְרָיִם:", "onk_en": "He lived in the desert of Paran, and his mother took a wife for him from the land of Egypt.", "pj": "וְיָתִיב בְּמַדְבְּרָא דְפָּארָן וּנְסֵיב אִתְּתָא יַת עֲדִישָׁא וְתֵרְכָהּ וּנְסִיבַת לֵיהּ אִמֵיהּ יַת פְּטִימָא אִתְּתָא מֵאַרְעָא דְמִצְרָיִם", "pj_en": "And he dwelt in the wilderness of Pharan, and took for a wife Adisha, but put her away. And his mother took for him Phatima to wife, from the land of Mizraim.", "tj": "", "tj_en": "", "rashi": "<b>מארץ מצרים.<\/b> מִמְּקוֹם גִּדּוּלֶיהָ, שֶׁנֶּאֱמַר וְלָהּ שִׁפְחָה מִצְרִית וְגוֹ' (בראשית ט״ז:א׳), הַיְנוּ דְּאָמְרִי אִינָשֵׁי זְרֹק חוּטְרָא לַאֲוִירָא, אֲעִיקְּרֵיהּ קָאֵי:", "rashi_en": "מארץ מצרים FROM THE LAND OF EGYPT — from the place where she was brought up — as it is said (16:1) “And she (Sarah) had an Egyptian handmaid [whose name was Hagar]”. That is what the popular proverb says: “Throw a stick into the air and it will fall back to (literally, stand on) its element” (Genesis Rabbah 53:15). "}, {"ch": 21, "v": 22, "aliyah": 6, "heb": "וַֽיְהִי֙ בָּעֵ֣ת הַהִ֔וא וַיֹּ֣אמֶר אֲבִימֶ֗לֶךְ וּפִיכֹל֙ שַׂר־צְבָא֔וֹ אֶל־אַבְרָהָ֖ם לֵאמֹ֑ר אֱלֹהִ֣ים עִמְּךָ֔ בְּכֹ֥ל אֲשֶׁר־אַתָּ֖ה עֹשֶֽׂה׃", "onk": "וַהֲוָה בְּעִדָּנָא הַהִיא וַאֲמַר אֲבִימֶלֶךְ וּפִיכֹל רַב חֵילֵיהּ לְאַבְרָהָם לְמֵימָר <b>מֵימְרָא דַיְיָ בְּסַעֲדָךְ בְּכֹל דִּי אַתְּ עָבֵד<\/b>:", "onk_en": "It was at this time, Avimelech and Pichol, his general spoke to Avraham, saying, Elohim is with you in all that you do [<b>the Word of Elohim is your support in all that you do<\/b>].", "pj": "וַהֲוָה בְּעִדָנָא הַהוּא וַאֲמַר אֲבִימֶלֶךְ וּפִיכוֹל רַב חֵילֵיהּ לְאַבְרָהָם לְמֵימַר מֵימְרָא דַיְיָ בְּסַעֲדָךְ בְּכָל מַה דְאַנְתְּ עָבִיד", "pj_en": "And it was at that time that Abimelek and Phikol, chief of his host, spake to Abraham, saying, The Word of the Lord is in thine aid in all whatsoever thou doest.", "tj": "", "tj_en": "", "rashi": "<b>אלהים עמך.<\/b> לְפִי שֶׁרָאוּ שֶׁיָּצָא מִשְּׁכוּנַת סְדוֹם לְשָׁלוֹם, וְעִם הַמְּלָכִים נִלְחַם וְנָפְלוּ בְיָדוֹ, וְנִפְקְדָה אִשְׁתּוֹ לִזְקוּנָיו:", "rashi_en": "אלהים עמך GOD IS WITH THEE — They said this because they saw that he had left the locality of Sodom safely, that he had fought against the kings and that they had fallen into his hand, and that his wife had been remembered in his old age (Genesis Rabbah 54:2). "}, {"ch": 21, "v": 23, "aliyah": 6, "heb": "וְעַתָּ֗ה הִשָּׁ֨בְעָה לִּ֤י בֵֽאלֹהִים֙ הֵ֔נָּה אִם־תִּשְׁקֹ֣ר לִ֔י וּלְנִינִ֖י וּלְנֶכְדִּ֑י כַּחֶ֜סֶד אֲשֶׁר־עָשִׂ֤יתִי עִמְּךָ֙ תַּעֲשֶׂ֣ה עִמָּדִ֔י וְעִם־הָאָ֖רֶץ אֲשֶׁר־גַּ֥רְתָּה בָּֽהּ׃", "onk": "וּכְעַן קַיֵּם לִי <b>בְּמֵימְרָא<\/b> דַיְיָ הָכָא דְּלָא תְשַׁקַּר בִּי וּבִבְרִי וּבְבַר בְּרִי <b>כְּטֵיבוֹתָא<\/b> דִּי עֲבָדִית עִמָּךְ תַּעְבֵּד עִמִּי וְעִם אַרְעָא דְאִתּוֹתַבְתָּא בַהּ:", "onk_en": "Now, swear to me here, by [<b>the Word of<\/b>] Elohim, that you will not deal falsely with me, with my son, or my grandson. The kindness [<b>goodness<\/b>] that I have done to you, do to me and to the land in which you lived for a while.", "pj": "וּכְעַן קְיַים לִי בְּמֵימְרָא דַיְיָ הָכָא אִין תִּשְׁקַר בִּי וּבִבְרִי וּבְבַר בְּרִי כְּטֵיבוּתָא דְעָבְדִית עִמָךְ תַּעֲבֵיד עִמִי וְעִם אַרְעָא דְדַרְתָּא בָּהּ", "pj_en": "And now, swear to me here, by the Word of the Lord, that thou wilt not be false with me, nor with my son, nor with the son of my son: according to the kindness which I have done with thee, thou shalt do with me, and with the land in which thou dwellest.", "tj": "", "tj_en": "", "rashi": "<b>ולניני ולנכדי.<\/b> עַד כָּאן רַחֲמֵי הָאָב עַל הַבֵּן:<br><br><b>כחסד אשר עשיתי עמך תעשה עמדי.<\/b> שֶׁאָמַרְתִּי לְךָ הִנֵּה אַרְצִי לְפָנֶיךָ (בראשית רבה):", "rashi_en": "ולניני ולנכדי NOR WITH MY SON NOR WITH MY SON’S SON — thus far extends a man’s pity for his descendants (Genesis Rabbah 54:2).<br><br>כחסד אשר עשיתי עמך תעשה עמדי ACCORDING TO THE KINDNESS THAT I HAVE DONE UNTO THEE THOU SHALT DO UNTO ME — viz., that I said to you. (Genesis 20:15) “Behold my land is before thee”."}, {"ch": 21, "v": 24, "aliyah": 6, "heb": "וַיֹּ֙אמֶר֙ אַבְרָהָ֔ם אָנֹכִ֖י אִשָּׁבֵֽעַ׃", "onk": "וַאֲמַר אַבְרָהָם אֲנָא אֲקַיֵּם:", "onk_en": "Avraham said, I will swear.", "pj": "וַאֲמַר אַבְרָהָם אֲנָא אֲקַיֵים", "pj_en": "And Abraham said to him, I swear.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 25, "aliyah": 6, "heb": "וְהוֹכִ֥חַ אַבְרָהָ֖ם אֶת־אֲבִימֶ֑לֶךְ עַל־אֹדוֹת֙ בְּאֵ֣ר הַמַּ֔יִם אֲשֶׁ֥ר גָּזְל֖וּ עַבְדֵ֥י אֲבִימֶֽלֶךְ׃", "onk": "וְאוֹכַח אַבְרָהָם יָת אֲבִימֶלֶךְ עַל עֵיסַק בֵּירָא דְמַיָּא דִּי אַנִּיסוּ עַבְדֵי אֲבִימֶלֶךְ:", "onk_en": "Avraham then reprimanded Avimelech regarding the well of water that Avimelech’s servants had taken by force.", "pj": "וְאִתְוַוכַּח אַבְרָהָם עִם אֲבִימֶלֶךְ עַל עֵיסַק בֵּירָא דְמַיָא דְאָנְסוּ לֵיהּ עַבְדֵי אֲבִימֶלֶךְ", "pj_en": "And Abraham remonstrated with Abimelek concerning the well of water of which the servants of Abimelek had deprived him.", "tj": "", "tj_en": "", "rashi": "<b>והוכח.<\/b> נִתְוַכֵּחַ עִמּוֹ עַל כָּךְ:", "rashi_en": "והוכח AND [ABRAHAM] REPROVED — it means he argued with him about it. "}, {"ch": 21, "v": 26, "aliyah": 6, "heb": "וַיֹּ֣אמֶר אֲבִימֶ֔לֶךְ לֹ֣א יָדַ֔עְתִּי מִ֥י עָשָׂ֖ה אֶת־הַדָּבָ֣ר הַזֶּ֑ה וְגַם־אַתָּ֞ה לֹא־הִגַּ֣דְתָּ לִּ֗י וְגַ֧ם אָנֹכִ֛י לֹ֥א שָׁמַ֖עְתִּי בִּלְתִּ֥י הַיּֽוֹם׃", "onk": "וַאֲמַר אֲבִימֶלֶךְ לָא יְדָעִית מָאן עֲבַד יָת פִּתְגָּמָא הָדֵין וְאַף אַתְּ לָא חַוֵּיתָ לִּי וְאַף אֲנָא לָא שְׁמָעִית אֶלָּהֵין יוֹמָא דֵין:", "onk_en": "Avimelech said, I do not know who did this thing. You also never told me, and I also heard nothing of it until today.", "pj": "וַאֲמַר אֲבִימֶלֶךְ לָא יָדַעְנָא מַן הוּא דְעָבַד יַת פִּתְגָמָא הָדֵין וְאוּף אַנְתְּ לָא חֲוַות לִי וְאוּף אֲנָא לָא שָׁמַעֲנָא מִן חוֹרָנִין אֱלָהֵין יוֹמָא דֵין מִנָךְ", "pj_en": "And Abimelek said, I knew not who did this thing; neither hast thou shown it to me; nor have I heard it from others, till today from thyself.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 27, "aliyah": 6, "heb": "וַיִּקַּ֤ח אַבְרָהָם֙ צֹ֣אן וּבָקָ֔ר וַיִּתֵּ֖ן לַאֲבִימֶ֑לֶךְ וַיִּכְרְת֥וּ שְׁנֵיהֶ֖ם בְּרִֽית׃", "onk": "וּדְבַר אַבְרָהָם עָאן וְתוֹרִין וִיהַב לַאֲבִימֶלֶךְ וּגְזָרוּ תַרְוֵיהוֹן קְיָם:", "onk_en": "Avraham took sheep and cattle and gave them to Avimelech. The two of them made a covenant.", "pj": "וּדְבַר אַבְרָהָם עָאן וְתוֹרִין וִיהַב לַאֲבִימֶלֶךְ וּגְזָרוּ תַּרְוֵיהוֹן קְיָם", "pj_en": "And Abraham took sheep and oxen, and gave to Abimelek; and they both made a covenant.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 28, "aliyah": 6, "heb": "וַיַּצֵּ֣ב אַבְרָהָ֗ם אֶת־שֶׁ֛בַע כִּבְשֹׂ֥ת הַצֹּ֖אן לְבַדְּהֶֽן׃", "onk": "וַאֲקִים אַבְרָהָם יָת שְׁבַע חוּרְפַן דְּעָאן בִּלְחוֹדֵיהֶן:", "onk_en": "Avraham set seven ewes apart by themselves.", "pj": "וְאָקִים אַבְרָהָם יַת שְׁבַע חוּרְפַן בִּלְחוֹדֵיהֶן וְאַפְרְשִׁינוּן מִן תּוֹרֵי", "pj_en": "And Abraham set seven lambs apart and separated them from the oxen.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 29, "aliyah": 6, "heb": "וַיֹּ֥אמֶר אֲבִימֶ֖לֶךְ אֶל־אַבְרָהָ֑ם מָ֣ה הֵ֗נָּה שֶׁ֤בַע כְּבָשֹׂת֙ הָאֵ֔לֶּה אֲשֶׁ֥ר הִצַּ֖בְתָּ לְבַדָּֽנָה׃", "onk": "וַאֲמַר אֲבִימֶלֶךְ לְאַבְרָהָם מָה אִנּוּן שְׁבַע חוּרְפַן אִלֵּין דַּאֲקֵמְתָּא בִּלְחוֹדֵיהֶן:", "onk_en": "Avimelech said to Avraham. What is the reason for these seven ewes that you have set apart?", "pj": "וַאֲמַר אֲבִימֶלֶךְ לְאַבְרָהָם מָה הִינוּן שְׁבַע חוּרְפַן הָאִלֵין דַאֲקֵמְתָּא בִּלְחוֹדֵיהוֹן", "pj_en": "And Abimelek said to Abraham, What are these seven lambs which thou hast set apart?", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 30, "aliyah": 6, "heb": "וַיֹּ֕אמֶר כִּ֚י אֶת־שֶׁ֣בַע כְּבָשֹׂ֔ת תִּקַּ֖ח מִיָּדִ֑י בַּעֲבוּר֙ תִּֽהְיֶה־לִּ֣י לְעֵדָ֔ה כִּ֥י חָפַ֖רְתִּי אֶת־הַבְּאֵ֥ר הַזֹּֽאת׃", "onk": "וַאֲמַר אֲרֵי יָת שְׁבַע חוּרְפַן תְּקַבֵּל מִן יְדִי בְּדִיל דִּתְהֵי לִי לְסַהֲדוּ אֲרֵי חֲפָרִית יָת בֵּירָא הָדֵין (<small>נ\"י<\/small> הָדָא):", "onk_en": "He [Avraham] said, Take these seven ewes from my hand so that it will be proof for me, that I dug this well.", "pj": "וַאֲמַר אֲרוּם יַת שְׁבַע חוּרְפַן תְּקַבֵּל מִן יְדִי מִן בִּגְלַל דְתֶהֱוֵי לִי לְסַהֲדוּ אֲרוּם חֲפָרִית יַת בֵּירָא הָדָא", "pj_en": "And he said, That thou mayest take the seven lambs from my hand, to be a testimony for me that I have digged this well.", "tj": "", "tj_en": "", "rashi": "<b>בעבור תהיה לי.<\/b> זאת:<br><br><b>לעדה.<\/b> לְשׁוֹן עֵדוּת שֶׁל נְקֵבָה, כְּמוֹ וְעֵדָה הַמַּצֵּבָה (בראשית ל\"א):<br><br><b>כי חפרתי את הבאר.<\/b> מְרִיבִים הָיוּ עָלֶיהָ רוֹעֵי אֲבִימֶלֶךְ וְאוֹמְרִים אֲנַחְנוּ חֲפַרְנוּהָ, אָמְרוּ בֵּינֵיהֶם כָּל מִי שֶׁיִּתְרָאֶה עַל הַבְּאֵר וְיַעֲלוּ הַמַּיִם לִקְרָאתוֹ, שֶׁלּוֹ הִיא, וְעָלוּ לִקְרָאת אַבְרָהָם:", "rashi_en": "בעבור (supply the word זאת) — IN ORDER THAT this (where this, a feminine form in a neuter sense, as is usual in Hebrew, refers to the incident just recorded).<br><br>תהיה לי לעדה MAY BE UNTO ME AS A WITNESS  The word עדה means witness in reference to a previous feminine form (in this case to זאת, this, which word Rashi supplied), just as (31:52) “And the pillar is a witness” (עדה the feminine form to correspond with the feminine noun מצבה, whereas the preceding words are עד הגל הזה “this heap is a witness” where עד is masc to agree with Gal.<br><br>כי חפרתי את הבאר THAT I HAVE DIGGED THIS WELL —Abimelech’s herdsmen quarrelled about it, saying, “We have dug it”. They arranged amongst themselves that the well should belong to him who would show himself at the well together with his sheep and at whose approach the waters would rise, and they rose at the approach of Abraham and his sheep (Genesis Rabbah 54:5). "}, {"ch": 21, "v": 31, "aliyah": 6, "heb": "עַל־כֵּ֗ן קָרָ֛א לַמָּק֥וֹם הַה֖וּא בְּאֵ֣ר שָׁ֑בַע כִּ֛י שָׁ֥ם נִשְׁבְּע֖וּ שְׁנֵיהֶֽם׃", "onk": "עַל כֵּן קְרָא לְאַתְרָא הַהוּא בְּאֵר שָׁבַע אֲרֵי תַמָּן קַיָּמוּ תַּרְוֵיהוֹן:", "onk_en": "Therefore he called that place Beer Sheva, since the two had made an oath there.", "pj": "בְּגִין כֵּן קָרָא לְבֵירָא הַהוּא בֵּירָא דְשֶׁבַע חוּרְפַן אֲרוּם תַּמָן קִיְימוּ תַּרְוֵיהוֹן", "pj_en": "Therefore he called that well the Well of the Seven Lambs; because there they two did swear.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 32, "aliyah": 6, "heb": "וַיִּכְרְת֥וּ בְרִ֖ית בִּבְאֵ֣ר שָׁ֑בַע וַיָּ֣קׇם אֲבִימֶ֗לֶךְ וּפִיכֹל֙ שַׂר־צְבָא֔וֹ וַיָּשֻׁ֖בוּ אֶל־אֶ֥רֶץ פְּלִשְׁתִּֽים׃", "onk": "וּגְזָרוּ קְיָם בִּבְאֵר שָׁבַע וְקָם אֲבִימֶלֶךְ וּפִיכֹל רַב חֵילֵיהּ וְתָבוּ לְאַרַע פְּלִשְׁתָּאֵי:", "onk_en": "They made a covenant in Beer Sheva. Avimelech, and Pichol, his general, then rose and returned to the land of the Philistines.", "pj": "וּגְזָרוּ קְיָים בְּבֵרָא דְשֶׁבַע חוּרְפַן וְקָם אֲבִימֶלֶךְ וּפִיכוֹל רַב חֵילֵיהּ וְתָבוּ לְאַרַע פְּלִישְׁתָּאֵי", "pj_en": "And they struck a covenant at the Well of the Seven Lambs. And Abimelek and Phikol the Chief of his host arose and returned to the land of the Philistaee.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 21, "v": 33, "aliyah": 6, "heb": "וַיִּטַּ֥ע אֶ֖שֶׁל בִּבְאֵ֣ר שָׁ֑בַע וַיִּ֨קְרָא־שָׁ֔ם בְּשֵׁ֥ם יְהֹוָ֖ה אֵ֥ל עוֹלָֽם׃", "onk": "וּנְצֵיב נִצְבָּא (<small>נ\"י<\/small> אִילָנָא) בִּבְאֵר שָׁבַע <b>וְצַלִּי תַמָּן בִּ<\/b>שְׁמָא דַיְיָ אֱלָהָא דְעַלְמָא:", "onk_en": "Avraham planted an <i>eishel<\/i> [tree] in Beer Sheva, and there he proclaimed [<b>and there he prayed in<\/b>] the Name Adonoy, Almighty of the universe.", "pj": "וּנְצִיב פַּרְדֵסָא בְּבֵרָא דְשֶׁבַע חוּרְפַן וְאַתְקִין בְּגַוֵיהּ מֵיכְלָא וּמַשְׁקַיָא לַעֲבּוּרַיָא וְלִתְאוּבַיָא וַהֲוָה מַכְרִיז עֲלֵיהוֹן תַּמָן אוֹדוּ וְהֵמִינוּ בְּשֵׁם מֵימְרָא דַיְיָ אֳלָהָא עַלְמָא", "pj_en": "And he planted a garden, (lit., \"a paradise,\") at the Well of the Seven Lambs, and prepared in the midst of it food and drink for them who passed by and who returned; and he preached to them there, Confess ye, and believe in the Name of the Word of the Lord, the everlasting God.", "tj": "וּנְצִיב אַבְרָהָם פַּרְדֵס בִּבְאֵר שָׁבַע וְאַתְקֵן בְּגַוֵיהּ מַאֲכָל וּמַשְׁקֶה וְלִתְחוּמַיָא וַהֲוֹו אָכְלִין וְשַׁתְיָין וַהֲוֹו בַּעֲיָין לְמִתַּן לֵיהּ טִימֵי דִי אֲכָלוּ וּשְׁתוּ וְלָא צָבֵי לִמְקַבְּלָה מִנְהוֹן וַהֲוָה אָמַר לְהוֹן אֲבוּנָן אַבְרָהָם מִן מַה דְאָמַר וַהֲוָה עַלְמָא בְּמֵימְרֵיהּ צְלוֹן קֳדָם אֲבוּכוּן דְבִשְׁמַיָא דְמִן דִידֵיה אֲכַלְתּוּן וּשְׁתִיתְהוֹן וְלָא הֲוֹו זַעְיָן מִן אַתְרֵיהוֹן עַד זְמַן דַהֲוָה מְגַיֵיר יַתְהוֹן וּמָלִיף יַתְהוֹן אוֹרְחָא דְעַלְמָא וְאוֹדִי וְצַלִי תַּמָן אַבְרָהָם בְּשֵׁם מֵימְרָא דַיְיָ אֱלָהָא דְעַלְמָא:", "tj_en": "And Abraham planted a paradise in Beer Sheba, and prepared in the midst of it food and drink for those who arrived at the border; and they ate and drank, and sought to give him the price of what they had eaten and drunk, but he willed not to receive it from them; but our father Abraham discoursed to them of that which he had said, that the world was by His word. Pray before your Father who is in heaven, from whose bounty ye have eaten and drunk. And they stirred not from their place until the time when he had made them proselytes, and had taught them the way everlasting. And Abraham praised and prayed there in the name of the word of the Lord, the God of Eternity.", "rashi": "<b>אשל.<\/b> רַב וּשְׁמוּאֵל, חַד אֲמַר פַּרְדֵּס לְהָבִיא מִמֶּנוּ פֵּרוֹת לָאוֹרְחִים בַּסְּעוּדָה, וְחַד אֲמַר פֻּנְדָּק לְאַכְסַנְיָא וּבוֹ כָּל מִינֵי פֵּרוֹת. וּמָצִינוּ לְשׁוֹן נְטִיעָה בְּאֹהָלִים, שֶׁנֶּאֱמַר וְיִטַּע אָהֳלֵי אַפַּדְנוֹ (דניאל י\"א):<br><br><b>ויקרא שם וגו'.<\/b> עַל יְדֵי אוֹתוֹ אֵשֶׁל נִקְרָא שְׁמוֹ שֶׁל הַקָּבָּ\"ה אֱלוֹהַּ לְכָל הָעוֹלָם, לְאַחַר שֶׁאוֹכְלִים וְשׁוֹתִים אוֹמֵר לָהֶם בָּרְכוּ לְמִי שֶׁאֲכַלְתֶּם מִשֶּׁלּוֹ, סְבוּרִים אַתֶּם שֶׁמִּשֶּׁלִּי אֲכַלְתֶּם? מִשֶּׁל מִי שֶׁאָמָר וְהָיָה הָעוֹלָם אֲכַלְתֶּם (סוטה י'):", "rashi_en": "אשל [AND ABRAHAM PLANTED AN] אשל — Rab and Samuel differ as to what this was. One said it was an orchard from which to supply fruit for the guests at their meal. The other said it was an inn for lodging in which were all kinds of fruit (Sotah 10a). And we can speak of planting an inn for we find the expression planting used of tents, as it is said, (Daniel 11:45) “And he shall plant the tents of his palace”.<br><br>'ויקרא שם וגו AND HE CALLED THERE etc. — Through this Eshel the name of the Holy One, blessed be He, was called “God of the entire Universe”. For after they had eaten and drunk he said to them, “Bless Him of whose possessions you have eaten! Do you think that you have eaten of what is mine? You have eaten of that which belongs to Him Who spake and the Universe came into existence” (Sotah 10a). "}, {"ch": 21, "v": 34, "aliyah": 6, "heb": "וַיָּ֧גׇר אַבְרָהָ֛ם בְּאֶ֥רֶץ פְּלִשְׁתִּ֖ים יָמִ֥ים רַבִּֽים׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאִתּוֹתַב אַבְרָהָם בְּאַרַע פְּלִשְׁתָּאֵי יוֹמִין סַגִּיאִין:", "onk_en": "Avraham lived in the land of the Philistines for many days.", "pj": "", "pj_en": "", "tj": "", "tj_en": "", "rashi": "<b>ימים רבים.<\/b> מְרֻבִּים עַל שֶׁל חֶבְרוֹן. בְּחֶבְרוֹן עָשָׂה כ\"ה שָׁנָה וְכָאן כ\"ו, שֶׁהֲרֵי בֶּן ע\"ה שָׁנָה הָיָה בְּצֵאתוֹ מֵחָרָן, אוֹתָהּ שָׁנָה וַיָבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא, שֶׁלֹּא מָצִינוּ קֹדֶם לָכֵן שֶׁנִּתְיַשֵּׁב אֶלָּא שָׁם, שֶׁבְּכָל מְקוֹמוֹתָיו הָיָה כְּאוֹרֵחַ חוֹנֶה וְנוֹסֵעַ וְהוֹלֵך, שֶׁנֶּאֱמַר וַיַּעֲבֹר אַבְרָם, וַיַּעְתֵּק מִשָּׁם, וַיְהִי רָעָב בָּאָרֶץ וַיֵּרֶד אַבְרָם מִצְרַיְמָה (בראשית י\"ב), וּבְמִצְרַיִם לֹא עָשָׂה אֶלָּא שְׁלֹשָׁה חֳדָשִׁים שֶׁהֲרֵי שְׁלָחוֹ פַרְעֹה מִיָּד, וַיֵּלֶךְ לְמַסָּעָיו עַד וַיָּבֹא וַיֵּשֶׁב בְּאֵלֹנֵי מַמְרֵא אֲשֶׁר בְּחֶבְרוֹן (שם י\"ג), שָׁם יָשַׁב עַד שֶׁנֶּהֱפְכָה סְדוֹם, מִיָּד וַיִּסַּע מִשָּׁם אַבְרָהָם מִפְּנֵי בוּשָׁה שֶׁל לוֹט וּבָא לְאֶרֶץ פְּלִשְׁתִּים, וּבֶן צ\"ט שָׁנָה הָיָה, שֶׁהֲרֵי בַשְּׁלִישִׁי לְמִילָתוֹ בָּאוּ אֶצְלוֹ הַמַּלְאָכִים, הֲרֵי כ\"ה שָׁנָה, וְכָאן כְּתִיב יָמִים רַבִּים, מְרֻבִּים עַל הָרִאשׁוֹנִים, וְלֹא בָא הַכָּתוּב לִסְתֹּם אֶלָּא לְפָרֵשׁ, וְאִם הָיוּ מְרֻבִּים עֲלֵיהֶם שְׁתֵּי שָׁנִים אוֹ יוֹתֵר הָיָה מְפָרְשָׁם, וְעַל כָּרְחֲךָ אֵינָם יְתֵרִים יוֹתֵר מִשָּׁנָה, הֲרֵי כ\"ו שָׁנָה; מִיָּד יָצָא מִשָּׁם וְחָזַר לְחֶבְרוֹן, וְאוֹתָהּ שָׁנָה קָדְמָה לִפְנֵי עֲקֵדָתוֹ שֶׁל יִצְחָק י\"ב שָׁנִים, בְּסֵדֶר עוֹלָם:", "rashi_en": "ימים רבים MANY DAYS (or, MORE DAYS) — More than those he sojourned in Hebron: in Hebron he had stayed 25 years and here 26. For he was 75 years old when he left Haran (Genesis 12:4), and of that same year it is said (Genesis 13:18) “And he came and dwelt by the terebinths of Mamre [which are in Hebron]” — for we do not find that he had settled down anywhere prior to settling there (at Hebron), since in every place where he went he was only like a traveller who pitches his camp and then goes on journeying, as it is said, (Genesis 13:12:6) “And Abraham passed on”; (Genesis 12:8) “And Abraham removed from thence”; (Genesis 12:10) “And there was a famine in the land and Abraham went down to Egypt”. In Egypt, too, he stayed only three months, for Pharaoh sent him away (Genesis 12:20). Immediately (Genesis 13:3) “He went on his journeys” until (Genesis 13:18) “He came and dwelt by the terebinths of Mamre which are in Hebron”. There he resided until Sodom was overthrown, and immediately afterwards (Genesis 20:1) “Abraham journeyed from thence” on account of the shame he felt at Lot’s doings and came to the land of the Philistines. He was then 99 years old, because it was on the third day of his circumcision that the angels came to him. Consequently you have 25 years from the time he settled in Hebron (the year he left his father’s house) until he came to the land of the Philistines. Now, here it is written that he sojourned in the land of the Philistines ימים רבים more days, which means more than the preceding days in Hebron. Scripture does not intend by these words to leave the number indefinite, but to state it explicitly, for if the “more days” exceeded the former period in Hebron by two years or more, it would have said so plainly, so that you must admit that the excess was only one year — that gives 26 years in the land of the Philistines. He immediately left there and returned to Hebron, and that year was 12 years before the Binding of Isaac. All this is explained in Seder Olam (See Note on Genesis 10:25)."}, {"ch": 22, "v": 1, "aliyah": 7, "heb": "וַיְהִ֗י אַחַר֙ הַדְּבָרִ֣ים הָאֵ֔לֶּה וְהָ֣אֱלֹהִ֔ים נִסָּ֖ה אֶת־אַבְרָהָ֑ם וַיֹּ֣אמֶר אֵלָ֔יו אַבְרָהָ֖ם וַיֹּ֥אמֶר הִנֵּֽנִי׃", "onk": "וַהֲוָה בָּתַר פִּתְגָּמַיָּא הָאִלֵּין וַייָ נַסִּי יָת אַבְרָהָם וַאֲמַר לֵיהּ אַבְרָהָם וַאֲמַר הָא אֲנָא:", "onk_en": "After these events, Elohim tested Avraham and said to him, Avraham! and he [Avraham] said, Here I am.", "pj": "וַהֲוָה בָּתַר פִּתְגָמַיָא הָאִילֵין מִן דִי נָצוּ יִצְחָק וְיִשְׁמָעֵאל יִשְׁמָעֵאל הֲוָה אָמַר לִי חֲמָא לְמֵירוּת יַת אַבָּא דַאֲנָא בְּרֵיהּ בּוּכְרַיָא וְיִצְחָק הֲוָה אָמַר לִי חָמֵי לְמֵירוּת יַת אַבָּא דַאֲנָא בַּר שָרָה אִנְתְּתֵיהּ וְאַנְתְּ בַּר הָגָר אַמְתָא דְאִמִי עָנֵי יִשְׁמָעֵאל וַאֲמַר אֲנָא זַכְּאַי יַתִּיר מִנָךְ דַאֲנָא אִתְגְזָרִית לִתְּלֵיסְרֵי שְׁנִין וְאִין הֲוָת צְבוֹתִי לִמְעַכְּבָא לָא הֲוֵינָא מָסַר נַפְשִׁי לְאִתְגַזְרָא וְאַנְתְּ אִתְגַזְרַת בַּר תְּמַנְיָא יוֹמִין אִילוֹ הֲוָה בָּךְ מַנְדְעָא דִלְמָא לָא הֲוֵיתָ מָסַר נַפְשָׁךְ לְאִתְגַזְרָא מְתִיב יִצְחָק וַאֲמַר הָא נָא יוֹמַיָא בַּר תְּלָתִין וְשִׁית שְׁנִין וְאִילוּ בָּעֵי קוּדְשָׁא בְּרִיךְ הוּא לְכוּלֵי אֵבְרַיי לָא הֲוֵיתִי מְעַכֵּב מִן יַד אִשְׁתְּמָעוּ פִּתְגָמִין הָאִילֵין קֳדָם מָרֵי עַלְמָא וּמִן יַד מֵימְרָא דַיְיָ נַסִי יַת אַבְרָהָם וַאֲמַר לֵיהּ אַבְרָהָם וַאֲמַר לֵיהּ הָא נָא", "pj_en": "And it was after these things that Izhak and Ishmael contended; and Ishmael said, It is right that I should inherit what is the father's because I am his firstborn son. And Izhak said, It is right that I should inherit what is the father's, because I am the son of Sarah his wife, and thou art the son of Hagar the handmaid of my mother. Ishmael answered and said, I am more righteous than thou, because I was circumcised at thirteen years; and if it had been my will to hinder, they should not have delivered me to be circumcised; but thou wast circumcised a child eight days; if thou hadst had knowledge, perhaps they could not have delivered thee to be circumcised. Izhak responded and said, Behold now, today I am thirty and six years old; and if the Holy One, blessed be He, were to require all my members, I would not delay. These words were heard before the Lord of the world, and the Word of the Lord at once tried Abraham, and said to him, Abraham! And he said, Behold me.", "tj": "וַהֲוָה בָּתַר פִּתְגָמַיָא הָאִילֵן וַיְיָ מְהַנְסֵי יַת אַבְרָהָם בְּנִסְיוֹנָא עֲשִירָאָה וַאֲמַר לֵיהּ אַבְרָהָם וַאֲמַר הָא אֲנָא:", "tj_en": "And it was after these things that the Lord tried Abraham with the tenth trial, and said to him, Abraham! And he said, Behold me.", "rashi": "<b>אחר הדברים האלה.<\/b> יֵשׁ מֵרַבּוֹתֵינוּ אוֹמְרִים (סנהדרין פ\"ט) אַחַר דְּבָרָיו שֶׁל שָׂטָן, שֶׁהָיָה מְקַטְרֵג וְאוֹמֵר מִכָּל סְעוּדָה שֶׁעָשָׂה אַבְרָהָם לֹא הִקְרִיב לְפָנֶיךָ פַּר אֶחָד אוֹ אַיִל אֶחָד; אָמַר לוֹ כְּלוּם עָשָׂה אֶלָּא בִּשְׁבִיל בְּנוֹ, אִלּוּ הָיִיתִי אוֹמֵר לוֹ זְבַח אוֹתוֹ לְפָנַי לֹא הָיָה מְעַכֵּב; וְיֵ\"אֹ אַחַר דְּבָרָיו שֶׁל יִשְׁמָעֵאל, שֶׁהָיָה מִתְפָּאֵר עַל יִצְחָק שֶׁמָּל בֶּן י\"ג שָׁנָה וְלֹא מִחָה, אָמַר לוֹ יִצְחָק בְּאֵבֶר א' אַתָּה מְיָרְאֵנִי? אִלּוּ אָמַר לִי הַקָּבָּ\"ה זְבַח עַצְמְךָ לְפָנַי, לֹא הָיִיתִי מְעַכֵּב.<br><br><b>הנני.<\/b> כָּךְ הִיא עֲנִיָּתָם שֶׁל חֲסִידִים, לְשׁוֹן עֲנָוָה הוּא וּלְשׁוֹן זִמּוּן:", "rashi_en": "אחר הדברים האלה AFTER THESE THINGS [or, WORDS] —Some of our Rabbis say (Sanhedrin 89b) that it means after the words of Satan who denounced Abraham saying, “Of all the banquets which Abraham prepared not a single bullock nor a single ram did he bring as a sacrifice to You ’. God replied to him, “Does he do anything at all except for his son’s sake? Yet if I were to bid him, “Sacrifice him to Me’’, he would not refuse’’. Others say that it means “after the words of Ishmael” who boasted to Isaac that he had been circumcised when he was thirteen years old without resisting. Isaac replied to him, “You think to intimidate me by mentioning the loss of one part of the body! If the Holy One, blessed be He, were to tell me, “Sacrifice yourself to Me” I would not refuse” (Sanhedrin 89b).<br><br>הנני HERE AM I — Such is the answer of the pious: it is an expression of meekness and readiness (Midrash Tanchuma, Vayera 22)."}, {"ch": 22, "v": 2, "aliyah": 7, "heb": "וַיֹּ֡אמֶר קַח־נָ֠א אֶת־בִּנְךָ֨ אֶת־יְחִֽידְךָ֤ אֲשֶׁר־אָהַ֙בְתָּ֙ אֶת־יִצְחָ֔ק וְלֶ֨ךְ־לְךָ֔ אֶל־אֶ֖רֶץ הַמֹּרִיָּ֑ה וְהַעֲלֵ֤הוּ שָׁם֙ לְעֹלָ֔ה עַ֚ל אַחַ֣ד הֶֽהָרִ֔ים אֲשֶׁ֖ר אֹמַ֥ר אֵלֶֽיךָ׃", "onk": "וַאֲמַר דְּבַר <b>כְּעַן<\/b> יָת בְּרָךְ יָת יְחִידָךְ דִּי רְחַמְתָּ יָת יִצְחָק וְאִיזֵל לָךְ לְאַרְעָא <b>פּוּלְחָנָא<\/b> וְאַסְקֵיהּ <b>קֳדָמַי<\/b> תַּמָּן לַעֲלָתָא עַל חַד מִן טוּרַיָּא דִּי אֵימָר לָךְ:", "onk_en": "He said, Please [<b>Now<\/b>] take your son, your only one, who you love—Yitzchok—and go to the land of Moriah [<b>worship<\/b>]. Sacrifice him [<b>before me<\/b>] as a burnt-offering on one of the mountains which I will designate to you.", "pj": "וַאֲמַר דְבַר כְּדוֹן יַת בְּרָךְ יַת יְחִידָךְ דְאַתְּ רָחֵם יַת יִצְחָק וְאִיזֵל לָךְ לְאַרַע פּוּלְחָנָא וְאַסֵיקוֹהִי תַּמָן לְעַלָתָא עַל חַד מִן טַוְרַיָא דְאֵימַר לָךְ", "pj_en": "And He said, Take now thy son, thy only one whom thou lovest, Izhak, and go into the land of worship, and offer him there, a whole burnt offering, upon one of the mountains that I will tell thee.", "tj": "לְטוּר מוֹרִיָה:", "tj_en": "At Mount Moriah.", "rashi": "<b>קח נא.<\/b> אֵין נָא אֶלָּא לְשׁוֹן בַּקָשָׁה, אָמַר לוֹ בְּבַקָּשָׁה מִמְּךָ, עֲמֹד לִי בְּזֶה הַנִּסָּיוֹן, שֶׁלֹּא יֹאמְרוּ הָרִאשׁוֹנוֹת לֹא הָיָה בָהֶן מָמָּשׁ:<br><br><b>את בנך.<\/b> אָמַר לוֹ שְׁנֵי בָנִים יֵשׁ לִי, אָמַר לוֹ אֶת יְחִידְךָ; אָמַר לוֹ זֶה יָחִיד לְאִמּוֹ וְזֶה יָחִיד לְאִמּוֹ, אָמַר לוֹ אֲשֶׁר אָהַבְתָּ; אָמַר לוֹ שְׁנֵיהֶם אֲנִי אוֹהֵב, אָמַר לוֹ אֶת יִצְחָק (סנהדרין פ\"ט). וְלָמָּה לֹא גִּלָּה לוֹ מִתְּחִלָּה? שֶׁלֹּא לְעַרְבְּבוֹ פִּתְאוֹם וְתָזוּחַ דַּעְתּוֹ עָלָיו וְתִטָּרֵף, וּכְדֵי לְחַבֵּב עָלָיו אֶת הַמִּצְוָה וְלִתֵּן לוֹ שָׂכָר עַל כָּל דִּבּוּר וְדִבּוּר:<br><br><b>ארץ המוריה.<\/b> יְרוּשָׁלַיִם, וְכֵן בְּדִבְרֵי הַיָּמִים לִבְנוֹת אֶת בֵּית ה' בִּירוּשָׁלִַם בְּהַר הַמּוֹרִיָּה (דברי הימים ב ג'). וְרַבּוֹתֵינוּ פֵּרְשׁוּ עַל שֵׁם שֶׁמִּשָּׁם הוֹרָאָה יוֹצְאָה לְיִשְׂרָאֵל. וְאֻנְקְלוֹס תִּרְגְּמוֹ עַל שֵׁם עֲבוֹדַת הַקְּטֹרֶת שֶׁיֵּשׁ בּוֹ מוֹר נֵרְדְּ וּשְׁאָר בְּשָׂמִים:<br><br><b>והעלהו.<\/b> לֹא אָמַר לוֹ שְׁחָטֵהוּ, לְפִי שֶׁלֹּא הָיָה חָפֵץ הַקָּבָּ\"ה לְשָׁחֳטוֹ אֶלָּא לְהַעֲלֵהוּ לָהָר לַעֲשׂוֹתוֹ עוֹלָה, וּמִשֶּׁהֶעֱלָהוּ אָמַר לוֹ הוֹרִידֵהוּ:<br><br><b>אחד ההרים.<\/b> הַקָּבָּ\"ה מַתְהֵא הַצַּדִּיקִים וְאַחַר כָּךְ מְגַלֶּה לָהֶם; וְכָל זֶה כְּדֵי לְהַרְבּוֹת שְׂכָרָן, וְכֵן אֶל הָאָרֶץ אֲשֶׁר אַרְאֶךָּ (בראשית י\"ב), וְכֵן בְּיוֹנָה וּקְרָא עָלֶיהָ אֶת הַקְּרִיאָה (יונה ג ב):", "rashi_en": "קח נא TAKE NOW — The word נא is used as a request: God said to him, “I beg of you, stand firm for me in this trial, so that people may not say that the previous trials were no real tests” (Sanhedrin 89b).<br><br>את בנך THY SON — Abraham said to God, “I have two sons”. “He answered him, “Thine only son”. Abraham said, “This one is the only son of his mother and the other is the only son of his mother”. God then said, “the one whom thou lovest”. Abraham replied, “I love both of them”. Whereupon God said “even Isaac”. Why did He not disclose this to him at the very first? So as not to confuse him suddenly lest his mind become distracted and bewildered and in his confused state he would involuntarily consent, when there would have been no merit in his sacrifice, and so that he might more highly value God’s command and that God might reward him for the increasing sacrifice demanded by obedience to each and every expression used here (Genesis Rabbah 55:7).<br><br>ארץ המוריה THE LAND OF MORIAH — This is Jerusalem, and so we find in Chronicles (2 Chronicles 3:1) “To build the house of the Lord at Jerusalem in Mount Moriah”.  Our Rabbis have explained that it is called Moriah — Instruction — because from it (i.e. from the Temple built on that mountain) instruction הוראה came forth to Israel (Genesis Rabbah 55:7). Onkelos translates it by “the land of the Divine Service”. He takes it as having reference to the offering of incense brought in the Temple on Moriah in which there were myrrh (מור) nard and other spices.<br><br>והעלהו AND OFFER HIM (literally, bring him up) — He did not say, “Slay him”, because the Holy One, blessed be He, did not desire that he should slay him, but he told him to bring him up to the mountain to prepare him as a burnt offering. So when he had taken him up, God said to him, “Bring him down” (Genesis Rabbah 56:8).<br><br>אחד ההרים ONE OF THE MOUNTAINS — The Holy One, blessed be He, first makes the righteous expectant and only afterwards discloses fully to them his intention — and all this in order to augment their reward. Similarly we have (Genesis 12:1) “[Go to] the land which I will show thee”, and similarly in the case of Jonah 3:2 “Make unto it the proclamation which I shall bid thee” (Genesis Rabbah 55:7). "}, {"ch": 22, "v": 3, "aliyah": 7, "heb": "וַיַּשְׁכֵּ֨ם אַבְרָהָ֜ם בַּבֹּ֗קֶר וַֽיַּחֲבֹשׁ֙ אֶת־חֲמֹר֔וֹ וַיִּקַּ֞ח אֶת־שְׁנֵ֤י נְעָרָיו֙ אִתּ֔וֹ וְאֵ֖ת יִצְחָ֣ק בְּנ֑וֹ וַיְבַקַּע֙ עֲצֵ֣י עֹלָ֔ה וַיָּ֣קׇם וַיֵּ֔לֶךְ אֶל־הַמָּק֖וֹם אֲשֶׁר־אָֽמַר־ל֥וֹ הָאֱלֹהִֽים׃", "onk": "וְאַקְדֵּים אַבְרָהָם בְּצַפְרָא וְזָרֵז יָת חֲמָרֵיהּ וּדְבַר יָת תְּרֵין עוּלֵימוֹהִי עִמֵּיהּ וְיָת יִצְחָק בְּרֵיהּ וְצַלַּח אָעֵי לַעֲלָתָא וְקָם וְאָזַל לְאַתְרָא דִּי אֲמַר לֵיהּ יְיָ:", "onk_en": "Avraham awoke early in the morning, saddled his donkey, and took his two assistants with him, and also his son, Yitzchok. He split the wood of the burnt-offering, rose, and went to the place that Elohim had designated to him.", "pj": "וְאַקְדֵים אַבְרָהָם בְּצַפְרָא וְזָרֵיז יַת חַמְרֵיהּ וּדְבַר יַת תְּרֵין טַלְיוֹ עִמֵיהּ יַת אֱלִיעֶזֶר וְיַת יִשְׁמָעֵאל וְיַת יִצְחָק בְּרֵיהּ וְקָטַע קֵיסִין דַקִיתָא וּתְאֵנָתָא וְדִיקְלָא דְחַזְיַין לְעָלָתָא וְקָם וְאָזַל לְאַתְרָא דְאָמַר לֵיהּ יְיָ", "pj_en": "And Abraham rose up in the morning and saddled his ass, and took two young men with him, Eliezer and Ishmael, and Izhak his son, and cut the small wood and the figs and the palm, which are provided for the whole burnt offering, and arose and went to the land of which the Lord had told him.", "tj": "", "tj_en": "", "rashi": "<b>וישכם.<\/b> נִזְדָּרֵז לַמִּצְוָה (פסחים ד'):<br><br><b>ויחבש.<\/b> הוּא בְעַצְמוֹ, וְלֹא צִוָּה לְאֶחָד מֵעֲבָדָיו, שֶׁהָאַהֲבָה מְקַלְקֶלֶת הַשּׁוּרָה:<br><br><b>את שני נעריו.<\/b> יִשְׁמָעֵאל וֶאֱלִיעֶזֶר, שֶׁאֵין אָדָם חָשׁוּב רַשַּׁאי לָצֵאת לַדֶּרֶךְ בְּלֹא ב' אֲנָשִׁים (בראשית רבה), שֶׁאִם יִצְטָרֵךְ הָאֶחָד לִנְקָבָיו וְיִתְרַחֵק, יִהְיֶה הַשֵּׁנִי עִמּוֹ:<br><br><b>ויבקע.<\/b> תַּרְגּוּם וְצַלַּח, כְּמוֹ וְצָלְחוּ הַיַּרְדֵּן (שמואל ב' י\"ט), לְשׁוֹן בִּקּוּעַ, פינדר\"א בלע\"ז:", "rashi_en": "וישכם AND HE ROSE EARLY — He was alert to fulfil the command (Pesachim 4a)<br><br>ויחבוש AND HE SADDLED [HIS ASS]—He himself: he did not order one of his servants to do so, for love disregards the rule imposed on one by his exalted position in life. (“Love” here means Love of God as displayed in obedience to His command.) (Genesis Rabbah 55:8)<br><br>את שני נעריו HIS TWO LADS — Ishmael and Eliezer. For a man of high standing should not travel without two men as attendants (Leviticus Rabbah 26:7) so that if one needs to ease himself and goes aside for this purpose the other will still remain with him (Midrash Tanchuma, Balak 8)<br><br>ויבקע AND HE CLEAVED [THE WOOD] — Its rendering in the Targum וצלח has the same meaning as the verb in (2 Samuel 19:18) And they rushed into the Jordan”, which signifies cleaving the waters; old French fendre; English to split."}, {"ch": 22, "v": 4, "aliyah": 7, "heb": "בַּיּ֣וֹם הַשְּׁלִישִׁ֗י וַיִּשָּׂ֨א אַבְרָהָ֧ם אֶת־עֵינָ֛יו וַיַּ֥רְא אֶת־הַמָּק֖וֹם מֵרָחֹֽק׃", "onk": "בְּיוֹמָא תְלִיתָאָה וּזְקַף אַבְרָהָם יָת עֵינוֹהִי וַחֲזָא יָת אַתְרָא מֵרָחִיק:", "onk_en": "On the third day, Avraham raised his eyes and saw the place from afar.", "pj": "בְּיוֹמָא תְּלִיתָאָה וּזְקַף אַבְרָהָם יַת עֵינוֹי וַחֲמָא עֲנַן אֲיַקְרָא קָטַר עַל טַוְורָא וְאִשְׁתְּמוֹדָעֵיהּ מִן רָחִיק", "pj_en": "On the third day Abraham lifted up his eyes and beheld the cloud of glory fuming on the mount, and it was discerned by him afar off.", "tj": "", "tj_en": "", "rashi": "<b>ביום השלישי.<\/b> לָמָה אֵחַר מִלְּהַרְאוֹתוֹ מִיָּד? כְּדֵי שֶׁלֹּא יֹאמְרוּ הֲמָמוֹ וְעִרְבְּבוֹ פִּתְאוֹם וְטָרַף דַּעְתּוֹ, וְאִלוּ הָיָה לוֹ שָׁהוּת לְהִמָּלֵךְ אֶל לִבּוֹ לֹא הָיָה עוֹשֶׂה:<br><br><b>וירא את המקום.<\/b> רָאָה עָנָן קָשׁוּר עַל הָהָר:", "rashi_en": "ביום השלישי ON THE THIRD DAY — Why did God delay and not show it to him at once? So that people should not say, “He confused and confounded him suddenly and bewildered his mind. If, however, he had had time for consideration, he would not have obeyed” (Midrash Tanchuma, Vayera 22).<br><br>וירא את המקום AND HE SAW THE PLACE — He saw a cloud lowering over the mountain (Genesis Rabbah 56:1). "}, {"ch": 22, "v": 5, "aliyah": 7, "heb": "וַיֹּ֨אמֶר אַבְרָהָ֜ם אֶל־נְעָרָ֗יו שְׁבוּ־לָכֶ֥ם פֹּה֙ עִֽם־הַחֲמ֔וֹר וַאֲנִ֣י וְהַנַּ֔עַר נֵלְכָ֖ה עַד־כֹּ֑ה וְנִֽשְׁתַּחֲוֶ֖ה וְנָשׁ֥וּבָה אֲלֵיכֶֽם׃", "onk": "וַאֲמַר אַבְרָהָם לְעוּלֵימוֹהִי אוֹרִיכוּ לְכוֹן הָכָא עִם חֲמָרָא וַאֲנָא וְעוּלֵימָא נִתְמְטֵי עַד כָּא וְנִסְגּוּד וּנְתוּב לְוַתְכוֹן:", "onk_en": "Avraham said to his assistants, Remain here with the donkey and I and the lad will go to that place. We will prostrate ourselves [in worship] and return to you.", "pj": "וַאֲמַר אַבְרָהָם לְעוּלֵימוֹי אוֹרִיכוּ לְכוֹן הָכָא עִם חַמְרָא וַאֲנָא וְעוּלֵימָא נִתְמְטֵי עַד כָּא לִבְּחוּנֵי אִין יִתְקַיֵים מַה דְאִתְבַּשְרִית כְּדֵין יְהוֹן בְּנָךְ וְנִסְגוֹד לְמָרֵי עַלְמָא וְנָתוּב לְוַתְכוֹן", "pj_en": "And Abraham said to his young men, Wait you here with the ass, and I and the young man will proceed yonder, to prove if that which was promised shall be established:--So shall be thy sons:--and we will worship the Lord of the world, and return t
