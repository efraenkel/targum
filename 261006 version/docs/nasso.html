<style>
:root {
  --bg: #FDFBF6; --ink: #1c1712; --ink-soft: #55493c; --rule: #d8cbb3; --torah: #16120d;
  --onk: #184f46; --onk-bg: #e2eeea; --onk-border: #184f46;
  --pj: #7a3317; --pj-bg: #f7e9de; --pj-border: #7a3317;
  --yer: #4e4a16; --yer-bg: #f1eed9; --yer-border: #4e4a16;
  --rashi: #3d4566; --rashi-bg: #e9eaf3; --rashi-border: #3d4566;
  --he: #2c261d; --he-bg: #efe9d8;
  --bm: #8a6d1f; --bm-bg: #f5ecd0;
  --chip-off-bg: #efe8d9; --chip-off-ink: #7a6d59;
  --sticky-bg: #FDFBF6; --fsize: 1; --font-main: 'David Libre', serif;
}
:root[data-theme="dark"] {
  --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
  --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
  --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
  --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
  --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
  --he: #efe6d4; --he-bg: #221e14;
  --bm: #e8c766; --bm-bg: #332c15;
  --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0a; --ink: #f5ecd9; --ink-soft: #c9bc9f; --rule: #433a2b; --torah: #fbf4e6;
    --onk: #9fe0d1; --onk-bg: #113330; --onk-border: #9fe0d1;
    --pj: #f3b58a; --pj-bg: #3a2416; --pj-border: #f3b58a;
    --yer: #e7df9e; --yer-bg: #332f17; --yer-border: #e7df9e;
    --rashi: #aab2e0; --rashi-bg: #22253b; --rashi-border: #aab2e0;
    --he: #efe6d4; --he-bg: #221e14;
    --bm: #e8c766; --bm-bg: #332c15;
    --chip-off-bg: #221d14; --chip-off-ink: #948563; --sticky-bg: #0e0d0a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-main); padding-bottom: env(safe-area-inset-bottom, 0px); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 0; background: var(--sticky-bg); border-bottom: 1px solid var(--rule); }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 700; color: var(--torah); font-family: 'Frank Ruhl Libre', serif; }
.icon-btns { display: flex; gap: 6px; flex: none; }
.icon-btn { border: 1.5px solid var(--rule); background: none; color: var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1rem; cursor: pointer; }
.subtitle { margin: 2px 0 10px; font-size: 0.8rem; color: var(--ink-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; padding-bottom: 10px; }
.chip { border: 1.5px solid currentColor; border-radius: 999px; padding: 5px 12px; font-size: 0.8rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; background: transparent; white-space: nowrap; font-weight: 600; }
.chip[data-on="true"].chip-onk { color: var(--onk); background: var(--onk-bg); }
.chip[data-on="true"].chip-pj  { color: var(--pj);  background: var(--pj-bg); }
.chip[data-on="true"].chip-yer { color: var(--yer); background: var(--yer-bg); }
.chip[data-on="true"].chip-rashi { color: var(--rashi); background: var(--rashi-bg); }
.chip[data-on="true"].chip-en  { color: var(--he);  background: var(--he-bg); border-style: dotted; }
.chip[data-on="true"].chip-bm  { color: var(--bm);  background: var(--bm-bg); }
.chip[data-on="false"] { color: var(--chip-off-ink); border-color: var(--chip-off-bg); background: var(--chip-off-bg); }
.bm-btn {
  flex: none; border: none; background: none; cursor: pointer;
  width: 30px; height: 30px; margin-inline-start: auto; padding: 0;
  font-size: 1.15rem; line-height: 1; color: var(--ink-soft); opacity: 0.55;
  display: inline-flex; align-items: center; justify-content: center;
}
.bm-btn.on { color: var(--bm); opacity: 1; }
.bm-btn:active { opacity: 0.8; }
.empty-bm-msg { text-align: center; color: var(--ink-soft); font-size: 0.88rem; padding: 40px 20px; line-height: 1.6; }
.export-row { display: flex; gap: 8px; margin-bottom: 8px; }
.export-btn { flex: 1; border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 9px 10px; font-size: 0.85rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.export-btn:active { background: var(--rule); }
.export-msg { font-size: 0.78rem; color: var(--ink-soft); min-height: 1.2em; text-align: center; }
.aliyah-nav, .chapter-nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; -ms-overflow-style: none; scrollbar-width: none; }
.aliyah-nav::-webkit-scrollbar, .chapter-nav::-webkit-scrollbar { display: none; }
.aliyah-btn, .chapter-btn { flex: none; border: 1px solid var(--rule); background: var(--bg); color: var(--ink-soft); border-radius: 8px; padding: 5px 11px; font-size: 0.78rem; font-family: 'Frank Ruhl Libre', serif; cursor: pointer; }
.chapter-btn { padding: 4px 9px; font-size: 0.73rem; opacity: 0.85; }
.aliyah-btn:active, .chapter-btn:active { background: var(--rule); }
.aliyah-btn.active, .chapter-btn.active { background: var(--torah); color: var(--bg); border-color: var(--torah); font-weight: 700; opacity: 1; }
.pos-indicator { font-size: 0.72rem; color: var(--ink-soft); padding: 0 0 6px; min-height: 1.2em; }
.topnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0 8px; font-size: 0.78rem; }
.topnav a, .topnav span.disabled { font-family: 'Frank Ruhl Libre', serif; color: var(--ink-soft); text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; white-space: nowrap; }
.topnav span.disabled { opacity: 0.35; }
.topnav a:active { background: var(--rule); }
.topnav .idx { flex: none; }
.offline-tip { display: none; margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--chip-off-bg); color: var(--ink-soft); font-size: 0.78rem; line-height: 1.5; }
.offline-tip.open { display: block; }
.panel { display: none; padding: 12px 0 14px; border-top: 1px solid var(--rule); }
.panel.open { display: block; }
.panel-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.panel-row:last-child { margin-bottom: 0; }
.panel-label { font-size: 0.82rem; color: var(--ink-soft); flex: none; }
select#fontSelect { font-family: var(--font-main); font-size: 0.95rem; color: var(--ink); background: var(--bg); border: 1.5px solid var(--rule); border-radius: 8px; padding: 6px 8px; flex: 1; }
.size-stepper { display: flex; gap: 6px; }
.size-btn { border: 1.5px solid var(--rule); background: var(--bg); color: var(--ink); border-radius: 8px; width: 36px; height: 34px; font-size: 1rem; cursor: pointer; font-family: 'Frank Ruhl Libre', serif; }
.size-btn:active { background: var(--rule); }
#spacer { width: 100%; }
main { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
.chapter-head { margin: 26px 0 8px; text-align: center; color: var(--ink-soft); font-size: 0.78rem; scroll-margin-top: var(--header-h, 170px); }
.aliyah-head { margin: 10px 0 4px; text-align: center; color: var(--ink-soft); font-size: 0.72rem; padding: 3px 0; border-top: 1px dashed var(--rule); border-bottom: 1px dashed var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse { padding: 14px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: var(--header-h, 170px); }
.verse-row { display: flex; gap: 9px; align-items: baseline; }
.vnum { flex: none; font-size: calc(0.7rem * var(--fsize)); color: var(--ink-soft); min-width: 1.4em; text-align: center; padding-top: 3px; }
.heb { font-size: calc(1.22rem * var(--fsize)); line-height: 1.65; color: var(--torah); font-weight: 600; font-family: 'Frank Ruhl Libre', serif; }
.targum-block { margin: 8px 0 0 1.85em; padding: 8px 12px; border-radius: 8px; border-right: 3px solid; font-family: var(--font-main); font-size: calc(1.08rem * var(--fsize)); line-height: 1.6; font-weight: 500; }
.targum-block.onk { background: var(--onk-bg); color: var(--onk); border-color: var(--onk-border); }
.targum-block.pj  { background: var(--pj-bg);  color: var(--pj);  border-color: var(--pj-border); }
.targum-block.yer { background: var(--yer-bg); color: var(--yer); border-color: var(--yer-border); }
.targum-block.rashi { background: var(--rashi-bg); color: var(--rashi); border-color: var(--rashi-border); }
.targum-label { display: block; font-family: 'Frank Ruhl Libre', serif; font-size: calc(0.7rem * var(--fsize)); font-weight: 700; opacity: 0.85; margin-bottom: 2px; }
.translation { margin-top: 6px; padding-top: 6px; border-top: 1px dashed currentColor; opacity: 0.9; font-size: calc(0.92rem * var(--fsize)); color: var(--he); font-weight: 400; }
.translation-en { font-family: 'Georgia', 'Times New Roman', serif; direction: ltr; text-align: left; }
.translation.missing { opacity: 0.5; font-style: italic; font-family: 'Frank Ruhl Libre', serif; direction: rtl; text-align: right; font-size: calc(0.8rem * var(--fsize)); }
footer { text-align: center; color: var(--ink-soft); font-size: 0.73rem; padding: 10px 16px 30px; }
.footnote-marker { font-size: 0.6em; color: var(--ink-soft); }
.footnote { font-size: 0.72em; font-weight: 400; font-style: normal; color: var(--ink-soft); }
</style>
</head>

const DATA = [{"ch": 4, "v": 21, "aliyah": 1, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying;", "pj": "וידבר וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "AND the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 22, "aliyah": 1, "heb": "נָשֹׂ֗א אֶת־רֹ֛אשׁ בְּנֵ֥י גֵרְשׁ֖וֹן גַּם־הֵ֑ם לְבֵ֥ית אֲבֹתָ֖ם לְמִשְׁפְּחֹתָֽם׃", "onk": "קַבֵּל יָת חֻשְׁבַּן בְּנֵי גֵרְשׁוֹן אַף אִנּוּן לְבֵית אֲבָהַתְהוֹן לְזַרְעֲיַתְהוֹן:", "onk_en": "Take the count of the sons of Gershon as well, according to the house of their fathers according to their families.", "pj": "קַבֵּל יַת חוּשְׁבַּן בְּנֵי גֵרְשׁוֹן אוּף הִינוּן לְבֵית אַבְהַתְהוֹן לִגְנִיסַתְהוֹן", "pj_en": "Take the account of the Beni Gershon also, ___", "tj": "", "tj_en": "", "rashi": "<b>נשא את ראש בני גרשון גם הם.<\/b> כְּמוֹ שֶׁצִּוִּיתִיךָ עַל בְּנֵי קְהָת, לִרְאוֹת כַּמָּה יֵשׁ שֶׁהִגִּיעוּ לִכְלַל עֲבוֹדָה:", "rashi_en": "נשא את ראש בני גרשון גם הם TAKE ALSO THE SUM OF THE SONS OF GERSHON - \"also\" implies: even as I have commanded you regarding the sons of Kohath; i.e. to see how many of them have already reached the age to be included amongst those fit for service."}, {"ch": 4, "v": 23, "aliyah": 1, "heb": "מִבֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָמַ֗עְלָה עַ֛ד בֶּן־חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקֹ֣ד אוֹתָ֑ם כׇּל־הַבָּא֙ לִצְבֹ֣א צָבָ֔א לַעֲבֹ֥ד עֲבֹדָ֖ה בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵלָּא עַד בַּר חַמְשִׁין שְׁנִין תִּמְנֵי יָתְהוֹן כָּל דְּאָתֵי לְחַיָּלָא חֵילָא לְמִפְלַח פָּלְחָנָא בְּמַשְׁכַּן זִמְנָא:", "onk_en": "From thirty years and above, until fifty years, you shall count them; all those who enter the division to serve in the Tent of Meeting.", "pj": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵילָא וְעַד בַּר חַמְשִׁין שְׁנִין תִּמְנֵי יַתְהוֹן כָּל דְאָתֵי לְחַיָילָא חֵילָא לְמֶעֱבַד עִבִידְתָּא בְּמַשְׁכַּן זִמְנָא", "pj_en": "from thirty years to fifty years, of all who come by bands to do the work of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 24, "aliyah": 1, "heb": "זֹ֣את עֲבֹדַ֔ת מִשְׁפְּחֹ֖ת הַגֵּרְשֻׁנִּ֑י לַעֲבֹ֖ד וּלְמַשָּֽׂא׃", "onk": "דֵּין פָּלְחַן זַרְעֲיַת גֵּרְשׁוֹן לְמִפְלַח וּלְמַטּוֹל:", "onk_en": "This is the service of the families of the Gershonites to serve, and to carry.", "pj": "דָא הִיא פּוּלְחָנַת גְנִיסַת גֵרְשׁוֹן לְמִפְלַח וּלְמַטוֹל", "pj_en": "And this is the service of the family of Gershon, to serve and to carry.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 25, "aliyah": 1, "heb": "וְנָ֨שְׂא֜וּ אֶת־יְרִיעֹ֤ת הַמִּשְׁכָּן֙ וְאֶת־אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕הוּ וּמִכְסֵ֛ה הַתַּ֥חַשׁ אֲשֶׁר־עָלָ֖יו מִלְמָ֑עְלָה וְאֶ֨ת־מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד׃", "onk": "וְיִטְּלוּן יָת יְרִיעַת מַשְׁכְּנָא וְיָת מַשְׁכַּן זִמְנָא חוֹפָאֵיהּ וְחוֹפָאָה דְסַסְגּוֹנָא דִּי עֲלוֹהִי מִלְּעֵלָּא וְיָת פְּרָסָא דִּתְרַע מַשְׁכַּן זִמְנָא:", "onk_en": "They shall carry the tapestries of the <i>Mishkon<\/i> and [of] the Tent of Meeting, its covering and the covering of <i>tachash<\/i> which is on top of it, and the screen for the entrance to the Tent of Meeting,", "pj": "וְיִטְלוּן יַת יְרִיעַת מַשְׁכְּנָא וְיַת מַשְׁכַּן זִמְנָא חוֹפָאֵיהּ וְחוֹפָאָה דְסַסְגוֹנָא דְעָלוֹי מִלְעֵילָא וְיַת פְּרָסָא דִתְרַע מַשְׁכַּן זִמְנָא", "pj_en": "They shall carry the curtains of the tabernacle, the tabernacle of ordinance, its covering, and the hyacinth covering which is upon it above; and the hanging of the gate of the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "<b>את יריעת המשכן.<\/b> עֶשֶׂר תַּחְתּוֹנוֹת:<br><br><b>ואת אהל מועד.<\/b> יְרִיעֹת עִזִּים הָעֲשׂוּיוֹת לְאֹהֶל עָלָיו:<br><br><b>מכסהו.<\/b> עוֹרוֹת אֵילִים מְאָדָּמִים:<br><br><b>מסך פתח.<\/b> וִילוֹן הַמִּזְרָחִי:", "rashi_en": "את יריעת המשכן THE CURTAINS OF THE TABERNACLE — the ten lower ones,<br><br>ואת אהל מועד AND THE TENT OF MEETING i.e. the curtains of goats’ skins which were made as a tent above it (the Tabernacle).<br><br>מכסהו ITS COVERING — the rams’ skins dyed red.<br><br>מסך פתח THE SCREEN FOR THE ENTRANCE — the Veil at the east side."}, {"ch": 4, "v": 26, "aliyah": 1, "heb": "וְאֵת֩ קַלְעֵ֨י הֶֽחָצֵ֜ר וְאֶת־מָסַ֣ךְ&thinsp;<b>׀<\/b> פֶּ֣תַח&thinsp;<b>׀<\/b> שַׁ֣עַר הֶחָצֵ֗ר אֲשֶׁ֨ר עַל־הַמִּשְׁכָּ֤ן וְעַל־הַמִּזְבֵּ֙חַ֙ סָבִ֔יב וְאֵת֙ מֵֽיתְרֵיהֶ֔ם וְאֶֽת־כׇּל־כְּלֵ֖י עֲבֹדָתָ֑ם וְאֵ֨ת כׇּל־אֲשֶׁ֧ר יֵעָשֶׂ֛ה לָהֶ֖ם וְעָבָֽדוּ׃", "onk": "וְיָת סְרָדֵי דַרְתָּא וְיָת פְּרָסָא דְמַעֲלָנָא דִּתְרַע דַּרְתָּא דִּי עַל מַשְׁכְּנָא וְעַל מַדְבְּחָא סְחוֹר סְחוֹר וְיָת אַטּוּנֵיהוֹן וְיָת כָּל מָנֵי פָּלְחַנְהוֹן וְיָת כָּל דִּי <b>יִתְמְסַר<\/b> לְהוֹן וְיִפְלְחוּן:", "onk_en": "the hanging [tapestries] of the courtyard, the screen for the entrance to the gate of the courtyard which are over the <i>Mishkon<\/i> and altar on all sides, their ropes and all of their service utensils and all that will be given [<b>delivered<\/b>] to them, and thus shall they serve.", "pj": "וְיַת וִוילַוָת דַרְתָּא וְיַת פְּרָסָא דְמַעֲלָנָא דִתְרַע דַרְתָּא דְעַל מַשְׁכְּנָא חֲזוֹר חֲזוֹר וְיַת אֲטוּנֵיהוֹן וְיַת כָּל מָאנֵי פּוּלְחַנְהוֹן וְיַת כָּל מַה דְיִתְמְסַר לְהוֹן וְיִפְלְחוּן", "pj_en": "and the curtains of the court, and the hanging for the gate of the court which is by the tabernacle round about, and their cords and all the vessels of their service, and all that is delivered to them to serve with.", "tj": "", "tj_en": "", "rashi": "<b>אשר על המשכן.<\/b> כְּלוֹמַר הַקְּלָעִים וְהַמָּסָךְ שֶׁל חָצֵר, הַסּוֹכְכִים וּמְגִנִּים עַל הַמִּשְׁכָּן וְעַל מִזְבַּח הַנְּחֹשֶׁת סָבִיב:<br><br><b>ואת כל אשר יעשה להם.<\/b> כְּתַרְגּוּמוֹ \"וְיָת כָּל דִּי יִתְּמְסַר לְהוֹן\" — לִבְנֵי גֵּרְשׁוֹן:", "rashi_en": "אשר על המשכן [AND THE HANGINGS OF THE ENCLOSURE, AND THE SCREEN FOR THE ENTRANCE OF THE GATE OF THE ENCLOSURE] WHICH ARE על המשכן — that is to say, the hangings and the screen of the court which together screen and shelter the Tabernacle and the copper altar on all sides.<br><br>ואת כל אשר יעשה להם — Understand this as the Targum does; “and everything that is handed over to them” — i.e. to the sons of Gershon."}, {"ch": 4, "v": 27, "aliyah": 1, "heb": "עַל־פִּי֩ אַהֲרֹ֨ן וּבָנָ֜יו תִּהְיֶ֗ה כׇּל־עֲבֹדַת֙ בְּנֵ֣י הַגֵּרְשֻׁנִּ֔י לְכׇ֨ל־מַשָּׂאָ֔ם וּלְכֹ֖ל עֲבֹדָתָ֑ם וּפְקַדְתֶּ֤ם עֲלֵהֶם֙ בְּמִשְׁמֶ֔רֶת אֵ֖ת כׇּל־מַשָּׂאָֽם׃", "onk": "עַל מֵימַר אַהֲרֹן וּבְנוֹהִי יְהֵי כָּל פָּלְחַן בְּנֵי גֵרְשׁוֹן לְכָל מַטּוּלְהוֹן וּלְכֹל פָּלְחַנְהוֹן וּתְמַנּוּן עֲלֵיהוֹן בְּמַטְּרָא יָת כָּל מַטּוּלְהוֹן:", "onk_en": "By instruction of Aharon and [one of] his sons shall be all the services of the sons of the Gershonites for all that they carry and for all their service. You shall fix specified appointments for them for everything they carry.", "pj": "עַל מֵימְרָא דְאַהֲרן וּבְנוֹי יְהֵי כָּל פּוּלְחַן בְּנֵי גֵרְשׁוֹן לְכָל מַטוּלְהוֹן וּלְכָל פּוּלְחַנְהוֹן וְתִמְנוּן עֲלֵיהוֹן בְּמַטָרָא יַת כָּל מַטוּלְהוֹן", "pj_en": "Upon the word of Aharon and his sons shall be all the service of the Beni Gershon, for all their burdens and service, and of their whole work shalt thou ordain the charge upon them.", "tj": "", "tj_en": "", "rashi": "<b>על פי אהרון ובניו.<\/b> וְאֵיזֶה מֵהַבָּנִים מְמֻנֶּה עֲלֵיהֶם? <b>ביד איתמר בן אהרון הכהן<\/b>:", "rashi_en": "על פי אהרן ובניו AT THE APPOINTMENT OF AARON AND HIS SONS [SHALL BE ALL THE SERVICE OF THE SONS OF THE GERSHONITES] — and which of his sons shall be appointed over them? Everything was (v. 28) “under the hand of Ithamar the son of Aaron the priest”."}, {"ch": 4, "v": 28, "aliyah": 1, "heb": "זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹ֛ת בְּנֵ֥י הַגֵּרְשֻׁנִּ֖י בְּאֹ֣הֶל מוֹעֵ֑ד וּמִ֨שְׁמַרְתָּ֔ם בְּיַד֙ אִֽיתָמָ֔ר בֶּֽן־אַהֲרֹ֖ן הַכֹּהֵֽן׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "דֵּין פָּלְחַן זַרְעֲיַת בְּנֵי גֵרְשׁוֹן בְּמַשְׁכַּן זִמְנָא וּמַטַּרְתְּהוֹן בִּידָא דְאִיתָמָר בַּר אַהֲרֹן כַּהֲנָא:", "onk_en": "This is the service of the families of the sons of the Gershonites in the Tent of Meeting. Their guardianship is in the hands of Isamar, the son of Aharon the <i>kohein.<\/i>", "pj": "דָא הִיא פוּלְחָנַת גְנִיסַת בְּנֵי גֵרְשׁוֹן בְּמַשְׁכַּן זִמְנָא וּמַטַרְתְּהוֹן בְּיַד אִיתָמָר בַּר אַהֲרן כַּהֲנָא", "pj_en": "This is the ministry of the family of the Beni Gershon, in the tabernacle of ordinance; and the care of them shall be in the hand of Ithamar bar Aharon the priest.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 29, "aliyah": 1, "heb": "בְּנֵ֖י מְרָרִ֑י לְמִשְׁפְּחֹתָ֥ם לְבֵית־אֲבֹתָ֖ם תִּפְקֹ֥ד אֹתָֽם׃", "onk": "בְּנֵי מְרָרִי לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן תִּמְנֵי יָתְהוֹן:", "onk_en": "The sons of Merori, according to their families and according to the house of their fathers you shall count them.", "pj": "בְּנֵי מְרָרִי לִגְנִיסַתְהוֹן לְבֵית אֲבָהַתְהוֹן תִּמְנֵי יַתְהוֹן", "pj_en": "The sons of Merari shalt thou number, ___", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 30, "aliyah": 1, "heb": "מִבֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָמַ֗עְלָה וְעַ֛ד בֶּן־חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑ם כׇּל־הַבָּא֙ לַצָּבָ֔א לַעֲבֹ֕ד אֶת־עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד׃", "onk": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵלָּא וְעַד בַּר חַמְשִׁין שְׁנִין תִּמְנִנּוּן כָּל דְּאָתֵי לְחֵילָא לְמִפְלַח יָת פָּלְחַן מַשְׁכַּן זִמְנָא:", "onk_en": "From thirty years and above until fifty years, you shall count them; all who enter the division to serve in the Tent of Meeting.", "pj": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵילָא וְעַד בַּר חַמְשִׁין שְׁנִין תִּמְנִינוּן כָּל דְאָתֵי לְחֵילָא לְמִפְלַח יַת פּוּלְחַן מַשְׁכַּן זִמְנָא", "pj_en": "from thirty years to fifty years, everyone who cometh with the band to minister in the work of the tabernacle of ordinance.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 31, "aliyah": 1, "heb": "וְזֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔ם לְכׇל־עֲבֹדָתָ֖ם בְּאֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַמִּשְׁכָּ֔ן וּבְרִיחָ֖יו וְעַמּוּדָ֥יו וַאֲדָנָֽיו׃", "onk": "וְדָא מַטְּרַת מַטּוּלְהוֹן לְכָל פָּלְחַנְהוֹן בְּמַשְׁכַּן זִמְנָא דַּפֵּי מַשְׁכְּנָא וְעַבְרוֹהִי וְעַמּוּדוֹהִי וְסַמְכוֹהִי:", "onk_en": "This is what they are entrusted to carry according to all their duties in the Tent of Meeting; the beams of the <i>Mishkon,<\/i> its bars, pillars and sockets.", "pj": "וְדָא מַטְרַת מַטוּלְהוֹן לְכָל פּוּלְחַנְהוֹן בְּמַשְׁכַּן זִמְנָא לוּחֵי מַשְׁכְּנָא וְנַגְרוֹי וְעַמוּדוֹי וְחוֹמְרוֹי", "pj_en": "And this shall be the charge of the burdens of all their service in the tabernacle of ordinance, the boards of the tabernacle, its bars, pillars, and bases;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 32, "aliyah": 1, "heb": "וְעַמּוּדֵי֩ הֶחָצֵ֨ר סָבִ֜יב וְאַדְנֵיהֶ֗ם וִיתֵֽדֹתָם֙ וּמֵ֣יתְרֵיהֶ֔ם לְכׇ֨ל־כְּלֵיהֶ֔ם וּלְכֹ֖ל עֲבֹדָתָ֑ם וּבְשֵׁמֹ֣ת תִּפְקְד֔וּ אֶת־כְּלֵ֖י מִשְׁמֶ֥רֶת מַשָּׂאָֽם׃", "onk": "וְעַמּוּדֵי דְדַרְתָּא סְחוֹר סְחוֹר וְסַמְכֵיהוֹן וְסִכֵּיהוֹן וְאַטּוּנֵיהוֹן לְכָל מָנֵיהוֹן וּלְכֹל פָּלְחַנְהוֹן וּבִשְׁמָהָן תְּמַנּוּן יָת מָנֵי מַטְּרַת מַטּוּלְהוֹן:", "onk_en": "The pillars around the courtyard, their sockets, stakes and ropes; with all their utensils and for all their service; and by name shall you appoint the utensils to the charge of those who will carry them.", "pj": "וְעַמוּדֵי דַרְתָּא חֲזוֹר חֲזוֹר וְחוּמְרֵיהוֹן וְסִיכֵיהוֹן וּמַתְחֵיהוֹן לְכָל מָאנֵיהוֹן וּלְכָל פּוּלְחַנְהוֹן וּבִשְׁמָהָן תִּמְנוּן יַת כָּל מָאנֵי מַטְרַת מַטוּלְהוֹן", "pj_en": "the pillars of the court also round about, their pins and their cords, with all the instruments of their whole service, and all those of the charge of their burdens, thou shalt number by their names.", "tj": "", "tj_en": "", "rashi": "<b>ויתדתם ומיתריהם.<\/b> שֶׁל עַמּוּדִים; שֶׁהֲרֵי יִתְדוֹת וּמֵיתְרֵי הַקְּלָעִים בְּמַשָּׂא בְנֵי גֵרְשׁוֹן הָיוּ, וִיתֵדוֹת וּמֵיתָרִים הָיוּ לַיְרִיעוֹת וְלַקְּלָעִים מִלְּמַטָּה, שֶׁלֹּא תַגְבִּיהֵם הָרוּחַ, וִיתֵדוֹת וּמֵיתָרִים הָיוּ לָעַמּוּדִים סָבִיב לִתְלוֹת בָּהֶם הַקְּלָעִים בִּשְׂפָתָם הָעֶלְיוֹנָה בִּכְלוּנְסוֹת וְקוּנְדָּסִין, כְּמוֹ שֶׁשְּׁנוּיָה בִמְלֶאכֶת הַמִּשְׁכָּן:", "rashi_en": "ויתדתם ומיתריהם [AND THE COLUMNS OF THE ENCLOSURE ROUND ABOUT IT AND THEIR SOCKETS] AND THEIR PINS, AND THEIR CORDS — i.e. the pins and cords of the columns only, because the pins and cords of the hangings were part of the burden of the Gershonites (not of the sons of Merari). There were, as a matter of fact, pegs and cords for the curtains and the hangings on their lower edges in order that the wind should not raise them, there were also pegs and cords for the columns, round about, upon which to suspend the hangings by their upper edges on poles and rails, just as it is set forth in the Boraitha dealing with the work of the Tabernacle (cf. Rashi on Exodus 27:10, 19; Numbers 3:26 and our Note thereon)."}, {"ch": 4, "v": 33, "aliyah": 1, "heb": "זֹ֣את עֲבֹדַ֗ת מִשְׁפְּחֹת֙ בְּנֵ֣י מְרָרִ֔י לְכׇל־עֲבֹדָתָ֖ם בְּאֹ֣הֶל מוֹעֵ֑ד בְּיַד֙ אִֽיתָמָ֔ר בֶּֽן־אַהֲרֹ֖ן הַכֹּהֵֽן׃", "onk": "דֵּין פָּלְחַן זַרְעֲיַת בְּנֵי מְרָרִי לְכָל פָּלְחַנְהוֹן בְּמַשְׁכַּן זִמְנָא בִּידָא דְאִיתָמָר בַּר אַהֲרֹן כַּהֲנָא:", "onk_en": "This is the service of the families of the sons of Merori for all their service in the Tent of Meeting, under the direction of Isamar, the son of Aharon, the <i>kohein.<\/i>", "pj": "דָא הִיא פּוּלְחָנַת גְנִיסַת בְּנֵי מְרָרִי לְכָל פּוּלְחַנְהוֹן בְּמַשְׁכַּן זִמְנָא בִּידָא דְאִיתָמָר בַּר אַהֲרן כַּהֲנָא רַבָּא", "pj_en": "This is the work of the family of Merari, according to all their service in the tabernacle of ordinance, under the hand of Ithamar bar Aharon the priest.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 34, "aliyah": 1, "heb": "וַיִּפְקֹ֨ד מֹשֶׁ֧ה וְאַהֲרֹ֛ן וּנְשִׂיאֵ֥י הָעֵדָ֖ה אֶת־בְּנֵ֣י הַקְּהָתִ֑י לְמִשְׁפְּחֹתָ֖ם וּלְבֵ֥ית אֲבֹתָֽם׃", "onk": "וּמְנָא משֶׁה וְאַהֲרֹן וְרַבְרְבֵי כְנִשְׁתָּא יָת בְּנֵי קְהָת לְזַרְעֲיַתְהוֹן וּלְבֵית אֲבָהַתְהוֹן:", "onk_en": "They counted—Moshe, Aharon and the leaders of the congregation—the sons of the Kehosites according to their families and according to the house of their fathers.", "pj": "וּמְנָא משֶׁה וְאַהֲרן יַת בְּנֵי קְהָת לִגְנִיסַתְהוֹן וּלְבֵית אֲבָהַתְהוֹן", "pj_en": "And Mosheh and Aharon numbered the sons of Kehath by their families, and by the house of their fathers,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 35, "aliyah": 1, "heb": "מִבֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָמַ֔עְלָה וְעַ֖ד בֶּן־חֲמִשִּׁ֣ים שָׁנָ֑ה כׇּל־הַבָּא֙ לַצָּבָ֔א לַעֲבֹדָ֖ה בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵלָּא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְּאָתֵי לְחֵילָא לְפָלְחָנָא בְּמַשְׁכַּן זִמְנָא:", "onk_en": "Those, from thirty years and above, until fifty years; all those who enter the division to serve in the Tent of Meeting.", "pj": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵילָא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְאָתֵי לְחֵילָא לְפוּלְחָנָא בְּמַשְׁכַּן זִמְנָא", "pj_en": "from thirty years to fifty years; every one who came with the band to serve in the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 36, "aliyah": 1, "heb": "וַיִּהְי֥וּ פְקֻדֵיהֶ֖ם לְמִשְׁפְּחֹתָ֑ם אַלְפַּ֕יִם שְׁבַ֥ע מֵא֖וֹת וַחֲמִשִּֽׁים׃", "onk": "וַהֲווֹ מְנְיָנֵיהוֹן לְזַרְעֲיַתְהוֹן תְּרֵין אַלְפִין שְׁבַע מְאָה וְחַמְשִׁין:", "onk_en": "Their numbers, according to their families were two thousand seven hundred and fifty.", "pj": "וַהֲווֹ סְכוּמְהוֹן לִגְנִיסַתְהוֹן תְּרֵין אַלְפִין וּשְׁבַע מְאָה וְחַמְשִׁין", "pj_en": "and the sums of them were two thousand seven hundred and fifty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 37, "aliyah": 1, "heb": "אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַקְּהָתִ֔י כׇּל־הָעֹבֵ֖ד בְּאֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְאַהֲרֹ֔ן עַל־פִּ֥י יְהֹוָ֖ה בְּיַד־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "אִלֵּין מִנְיָנֵי זַרְעֲיַת קְהָת כָּל דְּפָלַח בְּמַשְׁכַּן זִמְנָא דִּי מְנָא משֶׁה וְאַהֲרֹן עַל מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה:", "onk_en": "These are the numbers of the families of the Kehosites of all who serve in the Tent of Meeting whom Moshe and Aharon counted according to the word of Adonoy, through Moshe.", "pj": "אִלֵין מִנְיַן סְכוּמֵי גְנִיסַת קְהָת כָּל דְפָלַח בְּמַשְׁכַּן זִמְנָא דִי מְנָא משֶׁה וְאַהֲרן עַל פּוּם מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה", "pj_en": "These are the numbers of the family of Kehath, of all who ministered in the tabernacle of ordinance; whom Mosheh and Aharon numbered upon the mouth of the Word of the Lord by Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 38, "aliyah": 2, "heb": "וּפְקוּדֵ֖י בְּנֵ֣י גֵרְשׁ֑וֹן לְמִשְׁפְּחוֹתָ֖ם וּלְבֵ֥ית אֲבֹתָֽם׃", "onk": "וּמִנְיָנֵי בְּנֵי גֵרְשׁוֹן לְזַרְעֲיַתְהוֹן וּלְבֵית אֲבָהַתְהוֹן:", "onk_en": "The numbers of the sons of Gershon, according to their families and according to the house of their fathers.", "pj": "וּמִנְיַן סְכוּמֵי בְּנַי גֵרְשׁוֹן לִגְנִיסַתְהוֹן וּלְבֵית אֲבָהַתְהוֹן", "pj_en": "The numbers of the Beni Gershon, after the families of their father's house", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 39, "aliyah": 2, "heb": "מִבֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָמַ֔עְלָה וְעַ֖ד בֶּן־חֲמִשִּׁ֣ים שָׁנָ֑ה כׇּל־הַבָּא֙ לַצָּבָ֔א לַעֲבֹדָ֖ה בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵלָּא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְּאָתֵי לְחֵילָא לְפָלְחָנָא בְּמַשְׁכַּן זִמְנָא:", "onk_en": "Those, from thirty years and above, until fifty years; all who enter the division to serve in the Tent of Meeting.", "pj": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵילָא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְאָתֵי לְחֵילָא לְפוּלְחָנָא בְּמַשְׁכַּן זִמְנָא", "pj_en": "from thirty years to fifty years, every one who who came with the band to serve in the tabernacle of ordinance;", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 40, "aliyah": 2, "heb": "וַיִּֽהְיוּ֙ פְּקֻ֣דֵיהֶ֔ם לְמִשְׁפְּחֹתָ֖ם לְבֵ֣ית אֲבֹתָ֑ם אַלְפַּ֕יִם וְשֵׁ֥שׁ מֵא֖וֹת וּשְׁלֹשִֽׁים׃", "onk": "וַהֲווֹ מִנְיָנֵיהוֹן לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן תְּרֵין אַלְפִין וְשִׁית מְאָה וּתְלָתִין:", "onk_en": "Their numbers, according to their families, according to the house of their fathers were two thousand six hundred and thirty.", "pj": "וַהֲווֹ סְכוּמְהוֹן לִגְנִיסַתְהוֹן תְּרֵין אַלְפִין וְשִׁית מְאָה וּתְלָתִין", "pj_en": "the sums of them were two thousand six hundred and thirty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 41, "aliyah": 2, "heb": "אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כׇּל־הָעֹבֵ֖ד בְּאֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְאַהֲרֹ֖ן עַל־פִּ֥י יְהֹוָֽה׃", "onk": "אִלֵּין מִנְיָנֵי זַרְעֲיַת בְּנֵי גֵרְשׁוֹן כָּל דְּפָלַח בְּמַשְׁכַּן זִמְנָא דִּי מְנָא משֶׁה וְאַהֲרֹן עַל מֵימְרָא דַיְיָ:", "onk_en": "These are the numbers of the families of the sons of the Gershonites, of all those who serve in the Tent of Meeting, whom Moshe and Aharon counted, according to the word of Adonoy.", "pj": "אִלֵין מִנְיָנֵי סְכוּמֵי בְּנֵי גֵרְשׁוֹן כָּל דְיִפְלַח בְּמַשְׁכַּן זִמְנָא דִי מְנָא משֶׁה וְאַהֲרן עַל פּוּם מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה", "pj_en": "These are the numbers of the Beni Gershon, of all who ministered in the tabernacle of ordinance, whom Mosheh and Aharon numbered upon the mouth of the Word of the Lord by Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 42, "aliyah": 2, "heb": "וּפְקוּדֵ֕י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י לְמִשְׁפְּחֹתָ֖ם לְבֵ֥ית אֲבֹתָֽם׃", "onk": "וּמִנְיָנֵי זַרְעֲיַת בְּנֵי מְרָרִי לְזַרְעֲיַתְהוֹן לְבֵית אֲבָהַתְהוֹן:", "onk_en": "The numbers of the families of the sons of the Merorites according to their families, according to the house of their fathers.", "pj": "וּמִנְיַן סְכוּמֵי גְנִיסַת בְּנֵי מְרָרִי לִגְנִיסַתְהוֹן לְבֵית אֲבָהַתְהוֹן", "pj_en": "And the numbers of the Beni Merari, by the families of their father's house,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 43, "aliyah": 2, "heb": "מִבֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָמַ֔עְלָה וְעַ֖ד בֶּן־חֲמִשִּׁ֣ים שָׁנָ֑ה כׇּל־הַבָּא֙ לַצָּבָ֔א לַעֲבֹדָ֖ה בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵלָּא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְּאָתֵי לְחֵילָא לְפָלְחָנָא בְּמַשְׁכַּן זִמְנָא:", "onk_en": "Those, from thirty years and above, until fifty years; all who enter the division to serve in the Tent of Meeting.", "pj": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵילָא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְאָתֵי לְחֵילָא לְפוּלְחָנָא בְּמַשְׁכַּן זִמְנָא", "pj_en": "from thirty to fifty years, every one who came with the band to the service of the tabernacle of ordinance,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 44, "aliyah": 2, "heb": "וַיִּהְי֥וּ פְקֻדֵיהֶ֖ם לְמִשְׁפְּחֹתָ֑ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּמָאתָֽיִם׃", "onk": "וַהֲווֹ מִנְיָנֵיהוֹן לְזַרְעֲיַתְהוֹן תְּלָתָא אַלְפִין וּמָאתָן:", "onk_en": "Their numbers were, according to their families, three thousand two hundred.", "pj": "וַהֲווֹ סְכוּמְהוֹן לִגְנִיסַתְהוֹן תְּלַת אַלְפִין וּמָאתָן", "pj_en": "were three thousand two hundred.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 45, "aliyah": 2, "heb": "אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְאַהֲרֹ֔ן עַל־פִּ֥י יְהֹוָ֖ה בְּיַד־מֹשֶֽׁה׃", "onk": "אִלֵּין מִנְיָנֵי זַרְעֲיַת בְּנֵי מְרָרִי דִּי מְנָא משֶׁה וְאַהֲרֹן עַל מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה:", "onk_en": "These are the numbers of the families of the sons of the Merorites whom Moshe and Aharon counted according to the word of Adonoy, through Moshe.", "pj": "אִלֵין מִנְיָינֵי סְכוּמֵי גְנִיסַת בְּנֵי מְרָרִי דִי מְנָא משֶׁה וְאַהֲרן עַל פוּם מֵימְרָא דַיְיָ בִּידָא דְמשֶׁה", "pj_en": "These are the numbers of the Beni Merari, whom Mosheh and Aharon numbered upon the mouth of the Word of the Lord by Mosheh.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 46, "aliyah": 2, "heb": "כׇּֽל־הַפְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְאַהֲרֹ֛ן וּנְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת־הַלְוִיִּ֑ם לְמִשְׁפְּחֹתָ֖ם וּלְבֵ֥ית אֲבֹתָֽם׃", "onk": "כָּל מִנְיָנַיָּא דִּי מְנָא משֶׁה וְאַהֲרֹן וְרַבְרְבֵי יִשְׂרָאֵל יָת לֵוָאֵי לְזַרְעֲיַתְהוֹן וּלְבֵית אֲבָהַתְהוֹן:", "onk_en": "The total of the numbers counted by Moshe, Aharon and the leaders of the congregation [of] the Levites according to their families, according to the house of their fathers.", "pj": "כָּל סְכוּם מִנְיָינַיָא דִי מְנָא משֶׁה וְאַהֲרן וְרַבְרְבֵי יִשְרָאֵל יַת לֵיוָאֵי לִגְנִיסַתְהוֹן וּלְבֵית אֲבָהַתְהוֹן", "pj_en": "The whole sum of the Levites whom Mosheh and Aharon and the princes of Israel numbered,", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 47, "aliyah": 2, "heb": "מִבֶּ֨ן שְׁלֹשִׁ֤ים שָׁנָה֙ וָמַ֔עְלָה וְעַ֖ד בֶּן־חֲמִשִּׁ֣ים שָׁנָ֑ה כׇּל־הַבָּ֗א לַעֲבֹ֨ד עֲבֹדַ֧ת עֲבֹדָ֛ה וַעֲבֹדַ֥ת מַשָּׂ֖א בְּאֹ֥הֶל מוֹעֵֽד׃", "onk": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵלָּא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְּאָתֵי לְמִפְלַח פָּלְחַן פָּלְחָנָא וּפָלְחַן מַטּוּל בְּמַשְׁכַּן זִמְנָא:", "onk_en": "Those from thirty years and above, until fifty years; all who enter to serve the service of service and the service of carrying in the Tent of Meeting.", "pj": "מִבַּר תְּלָתִין שְׁנִין וּלְעֵילָא וְעַד בַּר חַמְשִׁין שְׁנִין כָּל דְאָתֵי לְחֵילָא לְמִפְלַח פּוּלְחַן מַטַרְתָּא וּפוּלְחַן מַטוֹל בְּמַשְׁכַּן זִמְנָא", "pj_en": "from thirty to fifty years, all coming by bands to fulfil the charge and service of the porterage of the tabernacle of ordinance,", "tj": "", "tj_en": "", "rashi": "<b>עבדת עבדה.<\/b> הִיא הַשִּׁיר בִּמְצִלְתַּיִם וְכִנּוֹרוֹת, שֶׁהִיא עֲבוֹדָה לַעֲבוֹדָה אַחֶרֶת (ערכין י\"א):<br><br><b>ועבדת משא.<\/b> כְּמַשְׁמָעוֹ:", "rashi_en": "עבדת עבדה THE SERVICE OF THE MINISTRY — (lit., a service of a service). This is the song of the Levites with accompaniment of cymbals and harps, this being the service attached to another service (the sacrificial service) (Arakhin 11a).<br><br>ועבדת משא is what it literally implies: AND THE SERVICE OF CARRYING."}, {"ch": 4, "v": 48, "aliyah": 2, "heb": "וַיִּהְי֖וּ פְּקֻדֵיהֶ֑ם שְׁמֹנַ֣ת אֲלָפִ֔ים וַחֲמֵ֥שׁ מֵא֖וֹת וּשְׁמֹנִֽים׃", "onk": "וַהֲווֹ מִנְיָנֵיהוֹן תְּמַנְיָא אַלְפִין וַחֲמֵשׁ מְאָה וְתַמְנָן:", "onk_en": "Their numbers were eight thousand five hundred and eighty.", "pj": "וַהֲווֹ סְכוּמְהוֹן תְּמַנְיָא אַלְפִין וַחֲמֵשׁ מְאָה וְתַמְנָן", "pj_en": "was eight thousand five hundred and eighty.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 4, "v": 49, "aliyah": 2, "heb": "עַל־פִּ֨י יְהֹוָ֜ה פָּקַ֤ד אוֹתָם֙ בְּיַד־מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל־עֲבֹדָת֖וֹ וְעַל־מַשָּׂא֑וֹ וּפְקֻדָ֕יו אֲשֶׁר־צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "עַל מֵימְרָא דַיְיָ מְנָא יָתְהוֹן בִּידָא דְמשֶׁה גְּבַר גְּבַר עַל פָּלְחָנֵיהּ וְעַל מַטּוּלֵיהּ וּמִנְיָנוֹהִי דִּי פַקִּיד יְיָ יָת משֶׁה:", "onk_en": "According to the word of Adonoy he counted them, by the hand of Moshe, each man according to his service and according to what he carries; and they were counted, as Adonoy commanded Moshe.", "pj": "עַל פּוּם מֵימְרָא דַיְיָ מְנָא יַתְהוֹן בִּידָא דְמשֶׁה גְבַר גְבַר עַל פּוּלְחָנֵיהּ וְעַל מַטוּלֵיהּ וּסְכוּמֵיהּ הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "By the mouth of the Word of the Lord were they numbered by Mosheh, every man according to his service and burden; and the numbering of them was as the Lord commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ופקדיו אשר צוה ה' את משה.<\/b> וְאוֹתָן הַפְּקוּדִים הָיוּ בְמִּצְוָה מִבֶּן שְׁלֹשִׁים שָׁנָה וְעַד בֶּן חֲמִשִּׁים:", "rashi_en": "ופקדיו אשר צוה ה' את משה — This means, and those appointed by him (Moses) were appointed under the terms of the command which God had given to Moses (v. 43): from thirty years to fifty years old."}, {"ch": 5, "v": 1, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 2, "aliyah": 3, "heb": "צַ֚ו אֶת־בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽישַׁלְּחוּ֙ מִן־הַֽמַּחֲנֶ֔ה כׇּל־צָר֖וּעַ וְכׇל־זָ֑ב וְכֹ֖ל טָמֵ֥א לָנָֽפֶשׁ׃", "onk": "פַּקֵּיד יָת בְּנֵי יִשְׂרָאֵל וִישַׁלְּחוּן מִן מַשְׁרִיתָא כָּל דִּסְגִיר וְכָל דְּדָאֵב וְכֹל דִּמְסָאָב <b>לִטְמֵי<\/b> נַפְשָׁא <b>דֶאֱנָשָׁא<\/b>:", "onk_en": "Command Bnei Yisroel that they must expel from the camp. anyone with <i>tzora’as,<\/i> and anyone from whom flows a [seminal] discharge and anyone who became defiled by a (departed) [<b>the bones of the<\/b>] soul [<b>of a person<\/b>].", "pj": "פַּקֵיד יַת בְּנֵי יִשְרָאֵל וְיִפְטְרוּן מִן מַשְׁרִיתָא כָּל דִמְצוֹרָע וְכָל דְדָאִיב וְכָל דִמְסָאָב לִטְמֵי נַפְשָׁא דְמִית", "pj_en": "Command the sons of Israel to send away from the camp every one who is leprous, or who hath an issue, or is unclean by having defiled himself (by touching) the dead.", "tj": "", "tj_en": "", "rashi": "<b>צו את בני ישראל וגו'.<\/b> פָּרָשָׁה זוֹ נֶאֶמְרָה בַּיּוֹם שֶׁהוּקַם הַמִּשְׁכָּן, וּשְׁמוֹנֶה פָרָשִׁיּוֹת נֶאֶמְרוּ בוֹ בַיּוֹם, כִּדְאִיתָא בְּמַסֶּכֶת גִּטִּין בְּפֶרֶק הַנִּזָּקִין (גיטין דף ס'):<br><br><b>וישלחו מן המחנה.<\/b> שָׁלֹשׁ מַחֲנוֹת הָיוּ שָׁם בִּשְׁעַת חֲנִיָּתָן, תּוֹךְ הַקְּלָעִים הִיא מַחֲנֵה שְׁכִינָה, חֲנִיַּת הַלְוִיִּם סָבִיב כְּמוֹ שֶׁמְּפֹרָשׁ בְּפָרָשַׁת בְּמִדְבַּר סִינַי, הִיא מַחֲנֵה לְוִיָּה, וּמִשָּׁם וְעַד סוֹף מַחֲנֵה הַדְּגָלִים לְכָל אַרְבַּע הָרוּחוֹת הִיא מַחֲנֵה יִשְׂרָאֵל; הַצָּרוּעַ נִשְׁתַּלַּח חוּץ לְכֻלָּן, הַזָּב מֻתָּר בְּמַחֲנֵה יִשְׂרָאֵל וּמְשֻׁלָּח מִן הַשְּׁתַיִם, וְטָמֵא לָנֶפֶשׁ מֻתָּר אַף בְּשֶׁל לְוִיָּה, וְאֵינוֹ מְשֻׁלָּח אֶלָּא מִשֶּׁל שְׁכִינָה, וְכָל זֶה דָּרְשׁוּ רַבּוֹתֵינוּ מִן הַמִּקְרָאוֹת בְּמַסֶּ' פְּסָחִים (דף ס\"ז):<br><br><b>טמא לנפש.<\/b> \"דִּמְסָאָב לִטְמֵי נַפְשָׁא דֶאֱנָשָׁא\", אוֹמֵר אֲנִי שֶׁהוּא לְשׁוֹן עַצְמוֹת אָדָם בִּלְשׁוֹן אֲרַמִּי. וְהַרְבֵּה יֵשׁ בִּבְ\"רַ, \"אַדְרִיאָנוּס שְׁחִיק טַמְיָא\", שְׁחִיק עֲצָמוֹת:", "rashi_en": "צו את בני ישראל וגו׳ COMMAND THE CHILDREN OF ISRAEL etc. — This section was spoken on the day when the Tabernacle was erected; there were eight sections spoken on that day, as is related in Treatise Gittin 60a, in the chapter beginning with the word הנזקין. <br><br>וישלחו מן המחנה [COMMAND THE CHILDREN OF ISRAEL] THAT THEY SEND AWAY FROM THE CAMP [EVERY LEPER etc.] — There were three camps one within the other whenever they encamped: the area within the hangings was the “camp of the Shechinah”, the encampment of the Levites round about this, as is described in the Sedrah במדבר סיני (Numbers 1:53), was the “camp of the Levites”, and from there outward up to the end of the encampment of the divisions in all the four directions was the “camp of the Israelites”. The leper was sent out from all of them; the person suffering from a flux was allowed to stay in the “camp of the Israelites”, but was sent out from the two inner camps, whilst a person who had become unclean by reason of a corpse was allowed to stay in the “camp of the Levites” also, and was sent out only from that of the Shechinah. All this have our Rabbis deduced in Treatise Pesachim 67a from the verses of our text.<br><br>טמא לנפש — Onkelos translates this by דמסאב לטמי נפשא דאנשא. I say that it (the word טמי in this rendering) is an expression in Aramaic for human bones, so that the Targum means: “whosoever is unclean by reason of the bones of a human being’’. There are many examples of the use of this word in Genesis Rabbah, as e.g. (Genesis Rabbah 78:1): Hadrian, שחיק טמיא, which means, “Hadrian may his bones be crushed!”"}, {"ch": 5, "v": 3, "aliyah": 3, "heb": "מִזָּכָ֤ר עַד־נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל־מִח֥וּץ לַֽמַּחֲנֶ֖ה תְּשַׁלְּח֑וּם וְלֹ֤א יְטַמְּאוּ֙ אֶת־מַ֣חֲנֵיהֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּתוֹכָֽם׃", "onk": "מִדְּכַר עַד נוּקְבָא תְּשַׁלְּחוּן לְמִבָּרָא לְמַשְׁרִיתָא תְּשַׁלְּחֻנּוּן וְלָא יְסַאֲבוּן יָת מַשְׁרִיתְהוֹן דִּי <b>שְׁכִנְתִּי<\/b> שָׁרְיָא בֵינֵיהוֹן:", "onk_en": "Whether male or female you shall send them out. Beyond the camp you shall send them, and they shall not defile their camps in which I dwell [<b>My Shechina dwells<\/b>] among them.", "pj": "מִדְכוּרָא וְעַד נוּקְבָא תְּשַׁלְחוּן לְמִבָּרָא לְמַשְׁרִיתָא תִּפְטוּרוּנוּן וְלָא יְסַאֲבוּן יַת מַשִׁרְיַיתְהוֹן דִשְׁכִינַת קוּדְשָׁא שַׁרְיָא בֵּינֵיהוֹן", "pj_en": "From a male to a female thou shalt send them away, and separate them without the camp, that they may not defile their tents; for the Shekinah of My Holiness dwelleth among you.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 4, "aliyah": 3, "heb": "וַיַּֽעֲשׂוּ־כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַיְשַׁלְּח֣וּ אוֹתָ֔ם אֶל־מִח֖וּץ לַֽמַּחֲנֶ֑ה כַּאֲשֶׁ֨ר דִּבֶּ֤ר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וַעֲבָדוּ כֵן בְּנֵי יִשְׂרָאֵל וְשַׁלְּחוּ יָתְהוֹן לְמִבָּרָא לְמַשְׁרִיתָא כְּמָא דִּי מַלִּיל יְיָ עִם משֶׁה כֵּן עֲבָדוּ בְּנֵי יִשְׂרָאֵל:", "onk_en": "Bnei Yisroel did so, and they sent them beyond the camp; just as Adonoy spoke to Moshe, so did Bnei Yisroel do.", "pj": "וַעֲבָדוּ כֵן בְּנֵי יִשְרָאֵל וּפַטְרוּ יַתְהוֹן לְמִבָּרָא לְמַשְׁרִיתָא הֵיכְמָא דְמַלֵיל יְיָ עִם משֶׁה הֵיכְדֵין עֲבָדוּ בְּנֵי יִשְרָאֵל", "pj_en": "And the sons of Israel did so, and sent them away from the camp; as the Lord had commanded Mosheh, so did the sons of Israel.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 5, "aliyah": 3, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 6, "aliyah": 3, "heb": "דַּבֵּר֮ אֶל־בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ־אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִכׇּל־חַטֹּ֣את הָֽאָדָ֔ם לִמְעֹ֥ל מַ֖עַל בַּיהֹוָ֑ה וְאָֽשְׁמָ֖ה הַנֶּ֥פֶשׁ הַהִֽוא׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל גְּבַר אוֹ אִתְּתָא אֲרֵי יַעְבְּדוּן מִכָּל חוֹבֵי אֱנָשָׁא <b>לְשַׁקָּרָא שְׁקָר קֳדָם<\/b> יְיָ וְיֵחוֹב אֱנָשָׁא הַהוּא:", "onk_en": "Speak to Bnei Yisroel: When a man or a woman commits any of the sins against man, acting treacherously [<b>untruthfully before<\/b>] against Adonoy, and that person is guilty.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל גְבַר אוֹ אִיתְּתָא דִי יַעֲבְדוּן מִכָּל חוֹבֵי אֱנָשָׁא לִמְשַׁקְרָא שְׁקַר קֳדָם יְיָ וְיִתְחַיֵיב בַּר נַשׁ הַהוּא", "pj_en": "Say to the children of Israel: A man or a woman who committeth any human sin, in acting perversely before the Lord, and hath become guilty;", "tj": "", "tj_en": "", "rashi": "<b>למעל מעל בה'.<\/b> הֲרֵי חָזַר וְכָתַב כָּאן פָּרָשַׁת גּוֹזֵל וְנִשְׁבָּע עַל שֶׁקֶר, הִיא הָאֲמוּרָה בְפָרָשַׁת וַיִּקְרָא \"וּמָעֲלָה מַעַל בַּה' וְכִחֵשׁ בַּעֲמִיתוֹ וְגוֹ'\", וְנִשְׁנֵית כָּאן בִּשְׁבִיל שְׁנֵי דְבָרִים שֶׁנִּתְחַדְּשׁוּ בָהּ, הָאֶחָד שֶׁכָּתַב \"וְהִתְוַדּוּ\", לִמֵּד שֶׁאֵינוֹ חַיָּב חֹמֶשׁ וְאָשָׁם עַ\"פִּ עֵדִים עַד שֶׁיּוֹדֶה בַדָּבָר, וְהַשֵּׁנִי עַל גֶּזֶל הַגֵּר שֶׁהוּא נָתוּן לַכֹּהֲנִים (עי' ספרי):", "rashi_en": "למעל מעל בה׳ [WHEN A MAN OR WOMAN SHALL DO ANY OF THE SINS AGAINST MAN,] TO ACT DECEITFULLY AGAINST THE LORD — Here, you see, Scripture writes down again the section dealing with a person who robs by violence from another, and swears falsely regarding it, — it is the same section that has already been stated in the Sedrah ויקרא (Lev 5:21), “[If a soul sin], and commits a trespass against the Lord, and deny unto his neighbour etc.” The reason why it is repeated here is because of two new points which are contained in it. The one is that it (Scripture) writes here, “and if they confess” which teaches that one is not liable to payment of the fifth (in addition to the capital; cf. Leviticus 5:24), nor to bring a guilt offering (cf. Leviticus 5:25) if he is convicted by the evidence of witnesses, but only when he himself confesses the matter (his guilt). The second new point is about something stolen from a proselyte (cf. Rashi on v. 8) — that it has to be handed over to the priests (cf. Sifrei Bamidbar 2)."}, {"ch": 5, "v": 7, "aliyah": 3, "heb": "וְהִתְוַדּ֗וּ אֶֽת־חַטָּאתָם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְהֵשִׁ֤יב אֶת־אֲשָׁמוֹ֙ בְּרֹאשׁ֔וֹ וַחֲמִישִׁת֖וֹ יֹסֵ֣ף עָלָ֑יו וְנָתַ֕ן לַאֲשֶׁ֖ר אָשַׁ֥ם לֽוֹ׃", "onk": "וִיוַדּוּן יָת חוֹבֵיהוֹן דִּי עֲבָדוּ וְיָתֵב יָת חוֹבְתֵיהּ בְּרֵישֵׁיהּ וְחֻמְשֵׁיהּ יוֹסֵף עֲלוֹהִי וְיִתֵּן לִדְחָב לֵיהּ:", "onk_en": "They shall confess the sins which they committed and return the principal amount [of the object] of his guilt, and add one fifth to that amount. He shall then give it to whom he is indebted.", "pj": "וְיוֹדוּן יַת חוֹבֵיהוֹן דְעָבָדוּ אִין מָמוֹנָא אֲנַס לְחַבְרֵיהּ וְיָתוּב יַת חוֹבְתֵיהּ בְּרֵישֵׁיהּ וְחוֹמֶשׁ דְמוֹי יוֹסֵף עֲלוֹי וְיִתֵּן קַרְנָא וְחוּמְשָׁא לְמַאן דְאִתְחַיֵיב לֵיהּ", "pj_en": "they shall make confession of their sins which they have committed. If he hath extorted money from his neighbour, he shall restore (the amount of) his sin in the principal thereof, and add to it a fifth of its value, and give (both) principal and fifth to him against whom he hath sinned.", "tj": "", "tj_en": "", "rashi": "<b>את אשמו בראשו.<\/b> הוּא הַקֶּרֶן שֶׁנִּשְׁבָּע עָלָיו (ב\"ק ק\"י):<br><br><b>לאשר אשם לו.<\/b> לְמִי שֶׁנִּתְחַיֵּב לוֹ (כתובות י\"ט):", "rashi_en": "את אשמו בראשו [HE SHALL RESTORE] THAT WHEREIN HE IS GUILTY, AS BEING THE CHIEF SUM — This means, he shall restore the principal about which he has sworn falsely (Bava Kamma 110a).<br><br>לאשר אשם לו [AND HE SHALL RESTORE THE PRINCIPAL … AND GIVE UNTO HIM] TO WHOM HE IS GUILTY — i.e. unto him to whom he (the claimant) owes money (Ketubot 19a)."}, {"ch": 5, "v": 8, "aliyah": 3, "heb": "וְאִם־אֵ֨ין לָאִ֜ישׁ גֹּאֵ֗ל לְהָשִׁ֤יב הָאָשָׁם֙ אֵלָ֔יו הָאָשָׁ֛ם הַמּוּשָׁ֥ב לַיהֹוָ֖ה לַכֹּהֵ֑ן מִלְּבַ֗ד אֵ֚יל הַכִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר־בּ֖וֹ עָלָֽיו׃", "onk": "וְאִם לֵית לִגְבַר פָּרִיק לַאֲתָבָא חוֹבְתָא לֵיהּ חוֹבְתָא דִּמְתֵב קֳדָם יְיָ לְכַהֲנָא בַּר מִדְּכַר כִּפּוּרַיָּא דִּי יְכַפֵּר בֵּיהּ עֲלוֹהִי:", "onk_en": "But if the man has no redeemer (relative) to whom the debt may be returned, the debt being returned then belongs to Adonoy, [then] to the <i>kohein.<\/i> This is besides the ram of forgiveness with which he [his sin] will be atoned.", "pj": "וְאִין לָא אִית לְגַבֵּיהּ פָּרִיק לְאָתָבָא חוֹבְתֵיהּ לֵיהּ חוֹבְתֵיהּ דִמְיֵיתַב קֳדָם יְיָ לְכַהֲנָא יִתֵּן בַּר מִדְכַר כִּפּוּרַיָא דִי יְכַפֵּר בֵּיהּ עֲלוֹי", "pj_en": "And if the man (hath died and) hath no kinsman to whom the debt may be rendered, the debt to be restored (shall he render) before the Lord; he shall give it to the priest, besides the ram for his atonement, by which atonement is to be made for him.", "tj": "", "tj_en": "", "rashi": "<b>ואם אין לאיש גאל.<\/b> שֶׁמֵּת הַתּוֹבֵעַ שֶׁהִשְׁבִּיעוֹ וְאֵין לוֹ יוֹרְשִׁים:<br><br><b>להשיב האשם אליו.<\/b> כְּשֶׁנִּמְלַךְ זֶה לְהִתְוַדּוֹת עַל עֲוֹנוֹ; וְאָמְרוּ רַבּוֹתֵינוּ וְכִי יֵשׁ לְךָ אָדָם בְּיִשְׂרָאֵל שֶׁאֵין לוֹ גּוֹאֲלִים, אוֹ בֵן, אוֹ אָח, אוֹ שְׁאֵר בָּשָׂר הַקָּרוֹב מִמִּשְׁפַּחַת אָבִיו לְמַעְלָה עַד יַעֲקֹב? אֶלָּא זֶה הַגֵּר שֶׁמֵּת וְאֵין לוֹ יוֹרְשִׁים (סנהדרין ס\"ח):<br><br><b>האשם המושב.<\/b> זֶה הַקֶּרֶן וְהַחֹמֶשׁ (בבא קמא ק\"י):<br><br><b>לה' לכהן.<\/b> קְנָאוֹ הַשֵּׁם וּנְתָנוֹ לַכֹּהֵן שֶׁבְּאוֹתוֹ מִשְׁמָר (ספרי):<br><br><b>מלבד איל הכפרים.<\/b> הָאָמוּר בְּוַיִּקְרָא שֶׁהוּא צָרִיךְ לְהָבִיא:", "rashi_en": "ואם אין לאיש גאל BUT IF THE MAN HAS NO KINSMAN — This means that the claimant who put him to the oath, died and has left no heirs,<br><br>להשיב האשם אליו TO WHOM THAT WHEREIN HE IS GUILTY COULD BE RESTORED, when he decided at a later period to confess his sin. — Our Rabbis asked (Sifrei Bamidbar 4:1; Bava Kamma 109a): But can you find anyone in Israel who has no kinsman whatsoever, neither a son nor a brother nor other relative near akin to him from his father’s family, going back as far as Jacob? But this person referred to is a proselyte who died and has no heirs (his heathen relatives not being entitled to succeed to his property) (Sifrei Bamidbar 4:1; Bava Kamma 109a).<br><br>האשם המושב THAT WHEREIN HE IS GUILTY AND WHICH HATH TO BE RESTORED — i.e. the principal (האשם) and the fifth thereof (המושב) (cf. Bava Kamma 110a),<br><br>לה’ לכהן BELONGS TO THE LORD, FOR THE PRIEST — This means the Lord becomes its owner and gives it to the priest of that Mishmar (shift) (Bava Kamma 109b).<br><br>מלבד איל הכפרים BESIDES THE RAM OF EXPIATION which is mentioned in the Sedrah ויקרא (Leviticus 5:25), as being incumbent upon him to offer."}, {"ch": 5, "v": 9, "aliyah": 3, "heb": "וְכׇל־תְּרוּמָ֞ה לְכׇל־קׇדְשֵׁ֧י בְנֵי־יִשְׂרָאֵ֛ל אֲשֶׁר־יַקְרִ֥יבוּ לַכֹּהֵ֖ן ל֥וֹ יִהְיֶֽה׃", "onk": "וְכָל אַפְרָשׁוּתָא לְכָל קוּדְשַׁיָּא דִבְנֵי יִשְׂרָאֵל דִּי יְקָרְבוּן לְכַהֲנָא דִּלֵּיהּ יְהֵא:", "onk_en": "Every <i>terumah<\/i>-gift of all the sacred things of Bnei Yisroel that they will bring to the <i>kohein,<\/i> shall be his.", "pj": "וְכָל אַפְרָשׁוּתָא לְכָל קוּדְשַׁיָא דִבְנֵי יִשְרָאֵל דִיקַרְבוּן לְכַהֲנָא דִילֵיהּ יְהוֹן", "pj_en": "And every separation of all consecrated things of the children of Israel which they bring to the priest shall be his.", "tj": "", "tj_en": "", "rashi": "<b>וכל תרומה וגו'.<\/b> אָמַר רַ' יִשְׁמָעֵאל וְכִי תְרוּמָה מַקְרִיבִין לַכֹּהֵן? וַהֲלֹא הוּא הַמְחַזֵּר אַחֲרֶיהָ לְבֵית הַגְּרָנוֹת, וּמַה תַּ\"ל אֲשֶׁר יַקְרִיבוּ לַכֹּהֵן? אֵלּוּ הַבִּכּוּרִים, שֶׁנֶּאֱמַר בָּהֶם (שמות כ\"ג), \"תָּבִיא בֵּית ה' אֱלֹהֶיךָ\", וְאֵינִי יוֹדֵעַ מַה יֵּעָשֶׂה בָהֶם, תַּ\"ל \"לַכֹּהֵן לוֹ יִהְיֶה\", בָּא הַכָּתוּב וְלִמֵּד עַל הַבִּכּוּרִים שֶׁיִּהְיוּ נִתָּנִין לַכֹּהֵן (ספרי):", "rashi_en": "וכל תרומה וגו׳ AND EVERY HEAVE OFFERING … WHICH THEY BRING UNTO THE PRIEST] — R. Ishmael asked, “Do they then have to bring the heave-offering to the priest; does he not have to go around the granaries begging for it? What, then, is the meaning of ‘which they bring unto the priest’? It refers to the first fruits of which it is said, (Exodus 23:19) ‘[The first of the first fruits of thy ground] thou shalt bring into the house of the Lord they God’, but I do not know what is to be done with them, (i.e., this is nowhere stated). Scripture therefore states here, ‘[and every heave-offering, …which they bring] unto the priest, shall be his’ — Scripture comes and teaches you with respect to the first fruits that they must be given to the priest” (Sifrei Bamidbar 5)."}, {"ch": 5, "v": 10, "aliyah": 3, "heb": "וְאִ֥ישׁ אֶת־קֳדָשָׁ֖יו ל֣וֹ יִהְי֑וּ אִ֛ישׁ אֲשֶׁר־יִתֵּ֥ן לַכֹּהֵ֖ן ל֥וֹ יִהְיֶֽה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וּגְבַר יָת <b>מַעֲשַׂר<\/b> קוּדְשֵׁיהּ דִּלֵּיהּ יְהוֹן גְּבַר דִּיִתֵּן לְכַהֲנָא דִּלֵּיהּ יְהֵא:", "onk_en": "A [<b>tenth of<\/b>] man’s sacred objects shall be his; whatever a man gives to the <i>kohein,<\/i> shall be his.", "pj": "וּגְבַר יַת מַעֲשֵר קוּדְשׁוֹי דִילֵיהּ יְהוֹן וְלָא חַסְרִין נִכְסוֹי גְבַר מַה דְיִתֵּן לְכַהֲנָא דִילֵיהּ יְהֵי", "pj_en": "The consecrated tithe, also, of any man shall be his, that his substance may not fail; whatever a man giveth unto the priest shall be his.", "tj": "", "tj_en": "", "rashi": "<b>ואיש את קדשיו לו יהיו.<\/b> לְפִי שֶׁנֶּאֶמְרוּ מַתְּנוֹת כְּהֻנָּה וּלְוִיָּה, יָכוֹל יָבוֹאוּ וְיִטְּלוּם בִּזְרוֹעַ, תַּ\"ל \"וְאִישׁ אֶת קֳדָשָׁיו לוֹ יִהְיוּ\", מַגִּיד שֶׁטּוֹבַת הֲנָאָתָן לַבְּעָלִים, וְעוֹד מִדְרָשִׁים הַרְבֵּה דָרְשׁוּ בוֹ בְּסִפְרֵי; וּמִ\"אַ וְאִישׁ אֶת קֳדָשָׁיו לוֹ יִהְיוּ, מִי שֶׁמְּעַכֵּב מַעַשְׂרוֹתָיו וְאֵינוֹ נוֹתְנָן, לוֹ יִהְיוּ הַמַּעַשְׂרוֹת — סוֹף שֶׁאֵין שָׂדֵהוּ עוֹשֶׂה אֶלָּא אֶחָד מֵעֲשָׂרָה שֶׁהָיְתָה לְמוּדָה לַעֲשׂוֹת (תנחומא ראה):<br><br><b>איש אשר יתן לכהן.<\/b> מַתָּנוֹת הָרְאוּיוֹת לוֹ:<br><br><b>לו יהיה.<\/b> מָמוֹן הַרְבֵּה (ברכות סג.):", "rashi_en": "ואיש את קדשיו לו יהיו AND EVERY MAN’S HOLY THINGS SHALL BE HIS — Because the gifts due to the priests and the Levites are merely mentioned in the Torah (Deuteronomy 18:1—8) (without any statement as to how they are to come into possession of them), therefore one might think they may come and take them by force. On this account, it states here, ‘‘and every man’s holy things shall be his” — in some respect — thus it teaches us that the טובת הנאה, the gratification of using them in this respect as he wishes, belongs to the owner. — Many other Halachic rules have they (the Rabbis) deduced about it (this statement) in Sifrei Bamidbar 6:2. — An Agadic explanation of ואיש את קדשיו לו יהיו is the following: Whosoever retains the tithes and does not give them to the Levite, only the tithes will be his, i.e., his field will ultimately yield no more than a tithe of what it was accustomed to yield (so that his whole possession will not exceed the gifts he should have given to the priests and the Levites; cf. Midrash Tanchuma, Re'eh 10).<br><br>איש אשר יתן לכהן, A MAN, HOWEVER, WHO GIVES TO THE PRIEST the gifts that are due to him,<br><br>לו יהיה HE SHALL HAVE great riches (Berakhot 63a)."}, {"ch": 5, "v": 11, "aliyah": 4, "heb": "וַיְדַבֵּ֥ר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וּמַלִּיל יְיָ עִם משֶׁה לְמֵימָר:", "onk_en": "Adonoy spoke to Moshe, saying;", "pj": "וּמַלֵיל יְיָ עִם משֶׁה לְמֵימָר", "pj_en": "And the Lord spake with Mosheh, saying:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 12, "aliyah": 4, "heb": "דַּבֵּר֙ אֶל־בְּנֵ֣י יִשְׂרָאֵ֔ל וְאָמַרְתָּ֖ אֲלֵהֶ֑ם אִ֥ישׁ אִישׁ֙ כִּֽי־תִשְׂטֶ֣ה אִשְׁתּ֔וֹ וּמָעֲלָ֥ה ב֖וֹ מָֽעַל׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן גְּבַר גְּבַר אֲרֵי תִסְטֵי אִתְּתֵיהּ <b>וּתְשַׁקֵּר בֵּיהּ שְׁקָר<\/b>:", "onk_en": "Speak to Bnei Yisroel and say to them: If any man’s wife goes astray and acts treacherously [<b>untruthfully<\/b>] toward him.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן גְבַר גְבַר אֲרוּם תִסְטֵי אִנְתְּתֵיהּ וּתְשַׁקֵר בֵּיהּ שְׁקָר", "pj_en": "Speak with the sons of Israel, and say to them: If the wife of any man go astray and commit wrongness against him,", "tj": "", "tj_en": "", "rashi": "<b>איש איש כי תשטה אשתו.<\/b> מַה כָּתוּב לְמַעְלָה מִן הָעִנְיָן? \"וְאִישׁ אֶת קֳדָשָׁיו לוֹ יִהְיוּ\", אִם אַתָּה מְעַכֵּב מַתְּנוֹת הַכֹּהֵן, חַיֶּיךָ שֶׁתִּצְטָרֵךְ לָבֹא אֶצְלוֹ לְהָבִיא לוֹ אֶת הַסּוֹטָה:<br><br><b>איש איש.<\/b> לְלַמֶּדְךָ שֶׁמּוֹעֶלֶת בִּשְׁתַּיִם – בְּאִישׁ מִלְחָמָה שֶׁלְּמַעְלָה, וְאִישָׁהּ מִלְּמַטָּה:<br><br><b>כי תשטה אשתו.<\/b> שָׁנוּ רַבּוֹתֵינוּ אֵין הַמְנָאֲפִין נוֹאֲפִין עַד שֶׁתִּכָּנֵס בָּהֶן רוּחַ שְׁטוּת, דִּכְתִיב \"כִּי תִשְׂטֶה\" וְכָתוּב בּוֹ \"נֹאֵף אִשָּׁה חֲסַר לֵב\" (משלי ו'); וּפְשׁוּטוֹ שֶׁל מִקְרָא: <b>כי תשטה<\/b> — תֵּט מִדַּרְכֵי צְנִיעוּת וְתֵחָשֵׁד בְּעֵינָיו, כְּמוֹ \"שְׂטֵה מֵעָלָיו וַעֲבֹר\" (שם ד'), \"אַל יֵשְׂטְ אֶל דְּרָכֶיהָ לִבֶּךָ\" (שם ז'):<br><br><b>ומעלה בו מעל.<\/b> וּמַהוּ הַמַּעַל? <b>ושכב איש אתה<\/b>:", "rashi_en": "איש איש כי תשטה אשתו IF ANY MAN’S WIFE GO ASIDE [AND ACT DECEITFULLY AGAINST HIM] — What is stated above, immediately before this section? ואיש את קדשיו לו יהיו: If you withhold the gifts due to the priest (cf. Rashi on v. 10), by your life, you will have to come to him in order to bring him your faithless wife for the ordeal by the waters (Berakhot 63a). (The translation therefore is: “A man who remains with his holy things, not giving them to the priest, לו יהיו they — the man and his wife — will become subject to him [require his services])”.<br><br>איש איש — The double expression איש איש is employed to teach you that she (the faithless wife) deals treacherously in two respects — against Him above Who bears the appelation of איש, as in the text \"[the Lord is] a Man of the war” (Exodus 15:3), and against her husband (אישה) here below (Midrash Tanchuma, Vaetchanan 5).<br><br>כי תשטה — Our Rabbis have taught (Midrash Tanchuma, Nasso 5): “Adulterers do never sin until a spirit of madness enters into them”, as it written, of her כי תשטה “if she becomes mad” (taking תִשְׂטֶה in the sense of תִשְׂטֶה, i.e. to become a שׁוֹטֶה, and so, too, of him Scripture writes, (Proverbs 6:32) “Whoso committeth adultery with a woman lacketh understanding”. — But the plain sense of the verse is that כי תשטה means: if she deviates from the path of modesty and thereby becomes suspect in his eyes. The word is similar to, (Proverbs 4:15) “turn away (שְׂטֵה) from it, and pass by”; (Proverbs 7:25) “Let not your heart turn (יַשְׂטְ) to her ways”.<br><br> ומעלה בו מעל AND SHE ACTS UNFAITHFULLY AGAINST HIM — Wherein consists this infidelity? ושכב איש אתה THAT A MAN LIETH WITH HER."}, {"ch": 5, "v": 13, "aliyah": 4, "heb": "וְשָׁכַ֨ב אִ֣ישׁ אֹתָהּ֮ שִׁכְבַת־זֶ֒רַע֒ וְנֶעְלַם֙ מֵעֵינֵ֣י אִישָׁ֔הּ וְנִסְתְּרָ֖ה וְהִ֣יא נִטְמָ֑אָה וְעֵד֙ אֵ֣ין בָּ֔הּ וְהִ֖וא לֹ֥א נִתְפָּֽשָׂה׃", "onk": "וְיִשְׁכֻּב גְּבַר יָתַהּ שָׁכְבַת זַרְעָא וִיהֵי <b>מְכַסָּא<\/b> מֵעֵינֵי בַעְלָהּ וּמִטַּמְּרָא וְהִיא מְסָאָבָא וְסָהִיד לֵית בַּהּ וְהִיא לָא אִתַּחָדָת:", "onk_en": "And a man has lain with her conjugally but it was hidden [<b>covered<\/b>] from her husband’s eyes and she was concealed and has become defiled and there is no witness against her, and she was not seized forcibly.", "pj": "וִישַׁמֵשׁ גְבַר חוֹרָן עִמָהּ תַּשְׁמִישׁ דְעָרִיס וִיהֵי מְכַסֵי מֵעֵינֵי בַּעֲלָהּ וּמִטַמְרָא וְהִיא מְסָאֲבָא וְסַהֲדוּ בְּרִיר לֵית דְמַסְהִיד בָּהּ וְהִיא לָא אִתְחָדָת", "pj_en": "and another man lie with her, and it be hidden from her husband's eyes, and be concealed, and she be contaminated: or, if the testimony be not clear which is witnessed against her, and she be not convicted;", "tj": "", "tj_en": "", "rashi": "<b>ושכב איש.<\/b> פְּרָט לְקָטָן וּמִי שֶׁאֵינוֹ אִישׁ (ספרי):<br><br><b>אתה שכבת זרע.<\/b> שְׁכִיבָתָהּ פּוֹסֶלֶת אוֹתָהּ, וְאֵין שְׁכִיבַת אֲחוֹתָהּ פּוֹסֶלֶת אוֹתָהּ (כְּמַעֲשֶׂה בִשְׁתֵּי אֲחָיוֹת שֶׁהָיוּ דּוֹמוֹת זוֹ לָזוֹ):<br><br><b>ונעלם מעיני אישה.<\/b> פְּרָט לְסוּמָא, הָא אִם הָיָה רוֹאֶה וּמְעַמְעֵם אֵין הַמַּיִם בּוֹדְקִין אוֹתָהּ (ספרי):<br><br><b>ונסתרה.<\/b> שִׁעוּר שֶׁתֵּרָאֶה לְטֻמְאַת בִּיאָה:<br><br><b>ועד אין בה.<\/b> הָא אִם יֵשׁ בָּהּ אֲפִלּוּ עֵד אֶחָד שֶׁאָמַר נִטְמֵאת לֹא הָיְתָה שׁוֹתָה (סוטה ד'):<br><br><b>ועד אין בה.<\/b> בְּטֻמְאָה, אֲבָל יֵשׁ עֵדִים לִסְתִירָה (שם ב'):<br><br><b>נתפשה.<\/b> נֶאֶנְסָה, כְּמוֹ \"וּתְפָשָׂהּ וְשָׁכַב עִמָּהּ\" (דברים כ\"ב):", "rashi_en": "ושכב איש AND A MAN LIETH [WITH HER] — a man, thus excluding a minor and a being that does not come under the term איש (i. e., an animal) (Sifrei Bamidbar 7:2; Sotah 24a).<br><br>אתה שכבת זרע [AND A MAN LIETH] WITH HER CARNALLY — This implies: that only her sexual intercourse with another man makes her unfit for continuing in marital relation with her husband, but the fact that her sister had sexual intercourse with him does not make her unfit for such (Yevamot 95a) [as was once the case with two sisters who greatly resembled each other (Tanchuma 5:2:6)]<br><br>תעלם מעיני אשה AND IT BE HID FROM THE EYES OF HER HUSBAND — Since it speaks of the eyes of the husband, it excludes the case of a blind man (i.e., a blind man cannot subject his wife to the ordeal). On the other hand, it states: “if it be concealed from his eyes”; it follows therefore that if he sees her improper conduct and wilfully closes his eyes to it the waters cannot try her (i.e., she cannot be subjected to the ordeal) (Sifrei Bamidbar 7:3; Sotah 27a).<br><br>ונסתרה AND SHE WAS ASIDE SECRETLY with him such a period of time wherein there was a possibility for her to become defiled by intercourse (Sotah 4a).<br><br>ועד אין בה AND THERE BE NO WITNESS AGAINST HER — But if there was even only one witness against her who stated that she was defiled she did not drink the מים המאררים, but was henceforth forbidden to her husband (Sotah 2b).<br><br>ועד אין בה AND THERE WAS NO WITNESS AGAINST HER, as regards defilement, but there were witnesses regarding her meeting with the man privily.<br><br>ונתפשה [AND SHE WAS NOT] SEIZED — i.e. subjected to force (Sifrei Bamidbar 7:3). Similar is, (Deuteronomy 22:28) “And seizes her (ותפשה) and lieth with her”."}, {"ch": 5, "v": 14, "aliyah": 4, "heb": "וְעָבַ֨ר עָלָ֧יו רֽוּחַ־קִנְאָ֛ה וְקִנֵּ֥א אֶת־אִשְׁתּ֖וֹ וְהִ֣וא נִטְמָ֑אָה אוֹ־עָבַ֨ר עָלָ֤יו רֽוּחַ־קִנְאָה֙ וְקִנֵּ֣א אֶת־אִשְׁתּ֔וֹ וְהִ֖יא לֹ֥א נִטְמָֽאָה׃", "onk": "וְיֶעְבַּר עֲלוֹהִי רוּחַ קִנְאָה וִיקַנֵּי יָת אִתְּתֵיהּ וְהִיא מְסָאָבָא אוֹ עֲבַר עֲלוֹהִי רוּחַ קִנְאָה וִיקַנֵּי יָת אִתְּתֵיהּ וְהִיא לָא מְסָאָבָא:", "onk_en": "[When] a spirit of jealousy comes upon him and he is jealous of his wife and she was defiled or, a spirit of jealousy comes upon him and he is jealous of his wife and she was not defiled,", "pj": "וִיעִבַּר עֲלוֹי רוּחַ קִנְאָתָא וִיקַנֵי יַת אִתְּתֵיהּ וְהִיא אִסְתְּאָבַת אוֹ עָבַר עֲלוֹי רוּחַ קִנְאֵיתָא וִיקַנֵא יַת אִתְּתֵיהּ וְהִיא לָא אִסְתְּאָבָת", "pj_en": "or, if the spirit of jealousy come upon him, and he be jealous of his wife, that she hath been defiled, or the spirit of jealousy come upon him, and he be jealous of his wife, though she hath not been defiled;", "tj": "", "tj_en": "", "rashi": "<b>ועבר עליו.<\/b> קֹדֶם לַסְּתִירָה:<br><br><b>רוח קנאה וקנה.<\/b> פֵּרְשׁוּ רַבּוֹתֵינוּ לְשׁוֹן הַתְרָאָה, שֶׁמַּתְרֶה בָהּ, אַל תִּסָּתְרִי עִם אִישׁ פְּלוֹנִי:<br><br><b>והוא נטמאה או עבר עליו וגו'.<\/b> כְּלוֹמַר הוּא הִתְרָה בָּהּ, וְעָבְרָה עַל הַתְרָאָתוֹ, וְאֵין יָדוּעַ אִם נִטְמְאָה אִם לָאו:", "rashi_en": "ועבר עליו AND [THE SPIRIT OF JEALOUSY] COME UPON HIM — i.e., had come upon him before her seclusion with the man.<br><br>רוח קנאה וקנא [AND] THE SPIRIT OF JEALOUSY [COME UPON HIM] וקנא — Our Rabbis said that it is an expression denoting warning — that he warns her: do not be aside privily with that man (Sotah 3a.)<br><br>והוא נטמאה או עבר עליו וגו׳ AND SHE BE DEFILED, OR IF [THE SPIRIT OF JEALOUSY] COME UPON HIM [AND SHE WAS NOT DEFILED] — that is to say, he warned her but she disregarded his warning, and it is uncertain whether she has been defiled or not (Sifrei Bamidbar 8)."}, {"ch": 5, "v": 15, "aliyah": 4, "heb": "וְהֵבִ֨יא הָאִ֣ישׁ אֶת־אִשְׁתּוֹ֮ אֶל־הַכֹּהֵן֒ וְהֵבִ֤יא אֶת־קׇרְבָּנָהּ֙ עָלֶ֔יהָ עֲשִׂירִ֥ת הָאֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא־יִצֹ֨ק עָלָ֜יו שֶׁ֗מֶן וְלֹֽא־יִתֵּ֤ן עָלָיו֙ לְבֹנָ֔ה כִּֽי־מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן׃", "onk": "וְיַיְתִי גַבְרָא יָת אִתְּתֵיהּ לְוָת כַּהֲנָא וְיַיְתִי יָת קֻרְבָּנַהּ עֲלַהּ חַד מִן עַסְרָא <b>בִּתְלַת סְאִין<\/b> קִמְחָא שְׂעָרִין לָא יְרִיק עֲלוֹהִי מִשְׁחָא וְלָא יִתֵּן עֲלוֹהִי לְבֻנְתָּא אֲרֵי מִנְחַת קִנְאָתָא הוּא מִנְחַת דּוּכְרָנָא מַדְכָּרַת חוֹבָא:", "onk_en": "that man shall bring his wife to the <i>kohein<\/i> and he shall bring her offering for her; [which is] one tenth of an <i>epha<\/i> [<b>three se’in<\/b>] of barley flour; he shall not pour oil over it and he shall not put frankincense on it, for it is a meal-offering of jealousy, a meal-offering of remembrance, recalling an iniquity.", "pj": "וּמְטוֹל דְלָא אַיְיתִי גַבְרָא הַהוּא אַפְרָשׁוּתָא וּמַעַשְרָא אִסְתְּקַף עֲלוֹי דְיַיתֵי יַת אִנְתְּתֵיהּ לְכַהֲנָא וּמְטוֹל דְאִיהִי אַטְעִימַת לְגִיוֹרָא תַפְנוּקִין אִסְתְּקַף עֲלָהּ דְיַיְתֵי יַת קוּרְבָּנָהּ דְקַיִץ עֲלָהּ מִדִילָהּ חַד מִן עַשְרָא בִּתְלַת סְאִין קִמְחָא דְשַעֲרֵי דְהִינוּן מֵיכְלָא דִבְעִירֵי לָא יְרִיק עֲלָהּ מִשְׁחָא וְלָא יִתֵּן עֲלָהּ לְבוֹנְתָּא אֲרוּם מִנְחַת קִנְאֵיתָא הִיא מִנְחַת דוּכְרָנָא מַדְכְּרַת חוֹבִין", "pj_en": "and though that man may have not brought separation or tythe, there is constraint upon him to bring his wife unto the priest. Now, because she may have brought delicacies to the adulterer, she ought to bring an appointed oblation of her own, a tenth of three sata of barley flour, that being the food of beasts: he shall not pour oil, nor put frankincense thereon; for it is a mincha (on account) of jealousy, a mincha of a memorial which calleth guilt to mind.", "tj": "", "tj_en": "", "rashi": "<b>קמח.<\/b> שֶׁלֹּא יְהֵא מִסֹּלֶת:<br><br><b>שערים.<\/b> וְלֹא חִטִּים, הִיא עָשְׂתָה מַעֲשֵׂה בְהֵמָה וְקָרְבָּנָהּ מַאֲכַל בְּהֵמָה (סוטה י\"ד):<br><br><b>לא יצק עליו שמן.<\/b> שֶׁלֹּא יְהֵא קָרְבָּנָהּ מְהֻדָּר, שֶׁהַשֶּׁמֶן קָרוּי אוֹר, וְהִיא עָשְׂתָה בַחֹשֶׁךְ:<br><br><b>ולא יתן עליו לבנה.<\/b> שֶׁהָאִמָּהוֹת נִקְרְאוּ לְבוֹנָה, שֶׁנֶּאֱמַר \"וְאֶל גִּבְעַת הַלְּבוֹנָה\" (שה\"ש ד'), וְהִיא פֵרְשָׁה מִדַּרְכֵיהֶן:<br><br><b>כי מנחת קנאת הוא.<\/b> הַקֶּמַח הַזֶּה, קֶמַח לָשׁוֹן זָכָר:<br><br><b>מנחת קנאת.<\/b> מְעוֹרֶרֶת עָלֶיהָ שְׁתֵּי קְנָאוֹת, קִנְאַת הַמָּקוֹם וְקִנְאַת הַבַּעַל (ספרי):", "rashi_en": "קמח implies that it shall not be of fine sifted flour.<br><br>It must be שערים BARLEY, and not wheat; because she committed a bestial act, therefore shall her offering consist of that which is food for beasts (Sifrei Bamidbar 8; Sotah 14a).<br><br>לא יצק עליו שמן HE SHALL POUR NO OIL UPON IT, so that her offering shall not be embellished (cf. Rashi on Leviticus 5:11) — and also because oil is called light (it is named יצהר from the root צהר, to give light; see Tanchuma) whilst she acted in darkness (Midrash Tanchuma, Nasso 3; cf. Sotah 15a).<br><br>ולא יתן עליו לבנה NOR SHALL HE PUT FRANKINCENSE THEREON — Because the matriarchs are symbolically termed frankincense, as it is said, (Songs 4:6) “I will get me … to the hill of frankincense” (which is taken as an allusion to the matriarchs), whilst she deviated from their paths (Midrash Tanchuma, Nasso 3).<br><br>כי מנחת קנאת הוא FOR IT IS A MEAL OFFERING OF JEALOUSY — i.e., this קמח is a meal offering of jealousy; for the word קמח is masculine and is therefore referred to by the masc. form.  <br><br>מנחת קנאת A MEAL OFFERING OF JEALOUSY — The plural קנאות is used because it arouses against her two outbreaks of jealousy — the jealousy of the Omnipresent and the jealousy of her husband (Tosefta Sotah 2; Sifrei Bamidbar 8; cf. Rashi’s second comment on איש איש v. 12)."}, {"ch": 5, "v": 16, "aliyah": 4, "heb": "וְהִקְרִ֥יב אֹתָ֖הּ הַכֹּהֵ֑ן וְהֶֽעֱמִדָ֖הּ לִפְנֵ֥י יְהֹוָֽה׃", "onk": "וִיקָרֵב יָתַהּ כַּהֲנָא וִיקִימִנַּהּ קֳדָם יְיָ:", "onk_en": "The <i>kohein<\/i> shall bring her near and station her before Adonoy.", "pj": "וִיקָרֵב יָתָהּ כַּהֲנָא וִיקִימִינָהּ קֳדָם יְיָ", "pj_en": "And the priest shall bring her near, and cause her to stand before the Lord.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 5, "v": 17, "aliyah": 4, "heb": "וְלָקַ֧ח הַכֹּהֵ֛ן מַ֥יִם קְדֹשִׁ֖ים בִּכְלִי־חָ֑רֶשׂ וּמִן־הֶֽעָפָ֗ר אֲשֶׁ֤ר יִהְיֶה֙ בְּקַרְקַ֣ע הַמִּשְׁכָּ֔ן יִקַּ֥ח הַכֹּהֵ֖ן וְנָתַ֥ן אֶל־הַמָּֽיִם׃", "onk": "וְיִסַּב כַּהֲנָא <b>מֵי כִיּוֹר<\/b> בְּמַן דַּחֲסָף וּמִן עַפְרָא דִּי יְהֵי <b>בִּיסוֹדֵי<\/b> מַשְׁכְּנָא יִסַּב כַּהֲנָא וְיִתֵּן לְמַיָּא:", "onk_en": "The <i>kohein<\/i> shall take sanctified waters [<b>water from the copper wash basin<\/b>] in a clay utensil, and of the earth that will be on the floor [<b>base<\/b>] of the <i>Mishkon<\/i>, the <i>kohein<\/i> shall take and put into the water.", "pj": "וְיִסַב כַּהֲנָא מַיִין קַדִישִׁין מִן כִּיוֹרָא בְּנַטְלָא וְיִתְּנִינוּן בְּמָאן דַחֲסַף מְטוֹל דְאִיהִי אַשְׁקְיַית לְגִיוֹרָא חֲמַר בָּסִים בְּמָאנִין יַקִירִין וּמִן עַפְרָא דִי יְהֵא בְּשִׁפּוּלֵי מַשְׁכְּנָא מְטוֹל דְסוֹף כָּל בִּישְרָא לְעַפְרָא יִסַב כַּהֲנָא וְיִתֵּן לְמַיָא", "pj_en": "And the priest shall take holy water from the laver with an ewer, and pour it into an earthen vessel; because she may have brought the adulterer sweet wine to drink in precious vases; and he shall take of the dust that is upon the ground of the tabernacle,-because the end of all flesh is dust,- and put it into the water.", "tj": "", "tj_en": "", "rashi": "<b>מים קדשים.<\/b> שֶׁקָּדְשׁוּ בַכִּיּוֹר, לְפִי שֶׁנַּעֲשָׂה מִנְּחֹשֶׁת מַרְאוֹת הַצּוֹבְאוֹת, וְזוֹ פֵרְשָׁה מִדַּרְכֵיהֶן, שֶׁהָיוּ נִבְעָלוֹת לְבַעְלֵיהֶן בְּמִצְרַיִם תַּחַת הַתַּפּוּחַ וְזוֹ קִלְקְלָה לְאַחֵר, תִּבָּדֵק בּוֹ:<br><br><b>בכלי חרש.<\/b> הִיא הִשְׁקָת אֶת הַנּוֹאֵף יַיִן מְשֻׁבָּח בְּכוֹסוֹת מְשֻׁבָּחִים, לְפִיכָךְ תִּשְׁתֶּה מַיִם הַמָּרִים בִּמְקִדָּה בְזוּיָה שֶׁל חֶרֶס (סוטה ט'):", "rashi_en": "מים קדשים HOLY WATER — i.e., water that has become holy through being in the laver. — The water was taken from the laver because that was made of the copper mirrors of the women who had gathered (Exodus 38:8) [at the entrance to the Tent of Meeting] and this woman deviated from their chaste ways. Because they had cherished their husbands’ love in Egypt (cf. Rashi on Exodus 38:8), while this woman depravedly gave herself over to another, she was to be examined through it (Bamidbar Rabbah 9 :14).<br><br>בכלי חרש IN AN EARTHEN VESSEL — She gave the adulterer excellent wine to drink in valuable goblets, therefore she shall drink the bitter water in a common earthenware cup. (Sotah 9a.)"}, {"ch": 5, "v": 18, "aliyah": 4, "heb": "וְהֶעֱמִ֨יד הַכֹּהֵ֥ן אֶֽת־הָאִשָּׁה֮ לִפְנֵ֣י יְהֹוָה֒ וּפָרַע֙ אֶת־רֹ֣אשׁ הָֽאִשָּׁ֔ה וְנָתַ֣ן עַל־כַּפֶּ֗יהָ אֵ֚ת מִנְחַ֣ת הַזִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּבְיַ֤ד הַכֹּהֵן֙ יִהְי֔וּ מֵ֥י הַמָּרִ֖ים הַמְאָֽרְרִֽים׃", "onk": "וִיקִים כַּהֲנָא יָת אִתְּתָא קֳדָם יְיָ וְיִפְרַע יָת רֵישָׁא דְאִתְּתָא וִיהֵב עַל <b>יְדָהָא<\/b> יָת מִנְחַת דּוּכְרָנָא מִנְחַת קִנְאָתָא הִיא וּבִידָא דְכַהֲנָא יְהוֹן מַיָּא מְרִירַיָּא מְלַטְטַיָּא:", "onk_en": "The <i>kohein<\/i> shall station the woman before Adonoy, and expose the woman’s hair, and place on her palms [<b>hands<\/b>] the meal-offering of remembrance; it is a meal-offering of jealousy and there will be in the <i>kohein’s<\/i> hand, the bitter, lethal waters.", "pj": "וְיוֹקִים כַּהֲנָא יַת אִיתְּתָא קֳדָם יְיָ וְיֶאֱסוֹר עַל חַרְצָא אַשְׁלָא מֵעִילוֹי חַדְיָיהָא מְטוֹל דְאִיהִי אַסְרַת חַרְצָהָא בְּצִילְצוֹלִין וְיִפְרַע יַת רֵישָׁא דְאִיתְּתָא מְטוֹל דְאִיהִי קַלְעַת שְעַר רֵישָׁא וְיִתֵּן עַל יְדָהָא יַת מִנְחַת דוּכְרָנָא מִנְחַת קִנְאֵיתָא הִיא וּבִידָא דְכַהֲנָא יְהוֹן מַיָא מְרִירַיָא בְּדוּקַיָא", "pj_en": "And the priest shall cause the woman to stand before the Lord, and bind a cord over her loins and upon her breast,- because she should have bound her loins with a girdle; and he shall uncover the woman's head, because she had tied a fillet upon her hair. And he shall put the mincha of memorial, the mincha of jealousy, into her hand; while in the hand of the priest shall be the bitter water of the trial.", "tj": "", "tj_en": "", "rashi": "<b>והעמיד הכהן וגו'.<\/b> וַהֲלֹא כְבָר נֶאֱמַר \"וְהֶעֱמִדָהּ לִפְנֵי ה'\"? אֶלָּא מַסִּיעִין הָיוּ אוֹתָהּ מִמָּקוֹם לְמָקוֹם כְּדֵי לְיַגְּעָהּ וְתִטָּרֵף דַּעְתָּהּ וְתוֹדֶה (סוטה ח'):<br><br><b>ופרע.<\/b> סוֹתֵר אֶת קְלִיעַת שְׂעָרָהּ, כְּדֵי לְבַזּוֹתָהּ, מִכָּאן לִבְנוֹת יִשְׂרָאֵל שֶׁגִּלּוּי הָרֹאשׁ גְּנַאי לָהֶן (כתובות ע\"ב):<br><br><b>לפני ה'.<\/b> בְּשַׁעַר נִקָּנוֹר, הוּא שַׁעַר הָעֲזָרָה הַמִּזְרָחִי, דֶּרֶךְ כָּל הַנִּכְנָסִים (סוטה ז'):<br><br><b>ונתן על כפיה.<\/b> לְיַגְּעָהּ, אוּלַי תִּטָּרֵף דַּעְתָּהּ וְתוֹדֶה, וְלֹא יִמָּחֶה שֵׁם הַמְיֻחָד עַל הַמָּיִם (שם י\"ד):<br><br><b>המרים.<\/b> עַל שֵׁם סוֹפָן, שֶׁהֵם מָרִים לָהּ (שם כ'):<br><br><b>המאררים.<\/b> הַמְחַסְּרִים אוֹתָהּ מִן הָעוֹלָם, לְשׁוֹן \"סִלּוֹן מַמְאִיר\" (יחזקאל כ\"ח), וְלֹא יִתָּכֵן לְפָרֵשׁ מַיִם אֲרוּרִים, שֶׁהֲרֵי קְדוֹשִׁים הֵן, וְלֹא אֲרוּרִים כָּתַב הַכָּתוּב, אֶלָּא מְאָרְרִים אֶת אֲחֵרִים, וְאַף אֻנְקְלוֹס לֹא תִרְגֵּם \"לִיטַיָּא\" אֶלָּא \"מְלַטְטַיָּא\" — שֶׁמַּרְאוֹת קְלָלָה בְּגוּפָהּ שֶׁל זוֹ:", "rashi_en": "והעמיד הכהן וגו׳ AND THE PRIEST SHALL PRESENT [THE WOMAN BEFORE THE LORD] — But has it not already been stated, (v. 16) “and he shall present her before the Lord”? But they used to move her about from place to place (and thus, as it were, present her many times) in order to wear her out so that her thoughts should become confused and she be unable to invent explanations of her conduct and so she would confess her guilt (Sotah 8a).<br><br>ופרע AND HE SHALL PUT IN DISORDER [THE WOMAN’S HAIR] — i.e. he pulls away her hair-plaits in order to make her look despicable. — We may learn from this that as regards married Jewish women an uncovered head is a disgrace to them (Sifrei Bamidbar 11).<br><br>לפני ה׳ [AND THE PRIEST SHALL PRESENT THE WOMAN] BEFORE THE LORD — i.e. in the gateway of Nicanor (cf. Rashi on Leviticus 14:11 and Note thereon) which was the eastern gate of the court, the passage for all who entered the court [and where she was therefore most exposed to public view] (Sotah 7a).<br><br>ונתן על כפיה AND HE SHALL PUT [THE MEAL-OFFERING OF MEMORIAL] IN HER HANDS — to wear her out even more (cf. Rashi on the beginning of the verse); — perhaps her thoughts would become confused now, so that she would confess her guilt and it would become unnecessary to blot out from the parchment the Divine Proper Name by the water (cf. Sifrei Bamidbar 11; Sotah 14a).<br><br>המרים THE BITTER [WATERS] — They were called bitter waters because of their final effect, viz., that they proved bitter for her (Sifrei Bamidbar 11; Sotah 20a).<br><br>המאררים means, the waters that make her disappear (pine away) from the world. It has the same meaning as, (Ezekiel. 28:24): “a removing (ממאיר) brier” (one that removed some of the flesh). It would not be correct to explain מים המאררים as מים ארורים, “cursed waters” for actually they are holy (cf. v. 17). Besides, even if the meaning has anything to do with “cursing”, Scripture does not write ארורים, “waters that are cursed”, but מאררים — “that bring a curse to others”; and Onkelos, too, does not render it by ליטיא — “cursed waters” but by מלטטיא — “waters that show a curse on the body of this woman”."}, {"ch": 5, "v": 19, "aliyah": 4, "heb": "וְהִשְׁבִּ֨יעַ אֹתָ֜הּ הַכֹּהֵ֗ן וְאָמַ֤ר אֶל־הָֽאִשָּׁה֙ אִם־לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔ךְ וְאִם־לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑ךְ הִנָּקִ֕י מִמֵּ֛י הַמָּרִ֥ים הַֽמְאָרְרִ֖ים הָאֵֽלֶּה׃", "onk": "וְיוֹמֵי יָתַהּ כַּהֲנָא וְיֵימַר לְאִתְּתָא אִם לָא שְׁכִיב גְּבַר יָתִיךְ וְאִם לָא סְטִית <b>לְאִסְתָּאָבָא בַּר<\/b> מִבַּעֲלִיךְ הֱוֵי זַכָּאָה מִמַּיָּא מְרִירַיָּא מְלַטְטַיָּא הָאִלֵּין:", "onk_en": "The <i>kohein<\/i> shall place her under oath and say to the woman: If a man has not lain with you [conjugally] and if you have not gone astray to be defiled while you were married to [<b>by someone other than<\/b>] your husband, you shall be absolved of these bitter, lethal waters.", "pj": "וְיוֹמֵי יָתָהּ כַּהֲנָא בִּשְׁבוּעַת שְׁמָא רַבָּא וְיַקִירָא וְיֵימַר כַּהֲנָא לְאִתְּתָא אִין לָא סָטִית לְאִסְתְּאָבָא בְּתַּשְׁמִישׁ דְעָרִיס בַּר מִן רְשׁוּתָא דְבַעֲלִיךְ תֶּהֱוֵי זַכָּאָה מִמַיָא מְרִירַיָא בְּדוּקַיָא הָאִלֵין", "pj_en": "And the priest shall adjure her by the adjuration of the Great and Glorious Name, and shall say to the woman: If thou hast not turned aside, to defile thyself by acting against the right of thy husband, be thou unhurt by these bitter waters of trial.", "tj": "חִרַקֵי מִן מַיָא בְּדוּקַיָא לְבֶדֶק הָאִלֵין:", "tj_en": "Be thou made innocent by these waters of trial by their probation.", "rashi": "<b>והשביע אתה וגו'.<\/b> וּמַה הִיא הַשְּׁבוּעָה? אִם לֹא שָׁכַב הִנָּקִי, הָא אִם שָׁכַב, חִנָּקִי, שֶׁמִּכְּלַל לָאו אַתָּה שׁוֹמֵעַ הֵן, אֶלָּא שֶׁמִּצְוָה לִפְתֹּחַ בְּדִינֵי נְפָשׁוֹת תְּחִלָּה לִזְכוּת (שם י\"ז; שבועות ל\"ו; סנהדרין ל\"ג):", "rashi_en": "והשביע אתה וגו׳ AND [THE PRIEST] SHALL ADJURE HER etc. — and wherein does this adjuration consist? In that he says to the woman, “if no man hath lain with thee … הנקי, be thou free”, which implies: “if, however, a man hath lain with thee, חנקי, thou deservest to be suffocated”, because from a negative statement you may deduce its converse, the positive statement. It is true that in an adjuration it would be more appropriate to make this threat of punishment if guilty, and to allow the converse to be derived from it, but here it mentions first what will happen if she has not sinned, since it intends to suggest that it is a duty in capital cases to begin the proceedings with the statement of something that bears upon the innocence of the accused (Sotah 17a; Shevuot 36a; Sanhedrin 33a)."}, {"ch": 5, "v": 20, "aliyah": 4, "heb": "וְאַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖ךְ וְכִ֣י נִטְמֵ֑את וַיִּתֵּ֨ן אִ֥ישׁ בָּךְ֙ אֶת־שְׁכׇבְתּ֔וֹ מִֽבַּלְעֲדֵ֖י אִישֵֽׁךְ׃", "onk": "וְאַתְּ אֲרֵי סְטִית <b>בַּר<\/b> מִבַּעֲלִיךְ וַאֲרֵי אִסְתָּאָבְתְּ וִיהַב גְּבַר בִּיךְ יָת שְׁכֻבְתֵּיהּ בַּר מִבַּעֲלִיךְ:", "onk_en": "[But] you, if you have gone astray while you were married to your husband, and if you have been defiled, and if a man has lain conjugally with you, [a man] other than your husband.", "pj": "וְאַנְתְּ אֲרוּם סַטְיָת בַּר מִן רְשׁוּתָא דְבַעֲלִיךְ וַאֲרוּם אִסְתְּאָבַת בְּתַּשְׁמִישׁ דְעָרִיס וִיהַב גְבַר בִּיךְ יַת תַּשְׁמִישֵׁיהּ בַּר מִן רְשׁוּתָא דְבַעֲלִיךְ", "pj_en": "But if thou hast turned aside against the right of thy husband, and art defiled in having shared the bed with a man against thy husband's right:-", "tj": "", "tj_en": "", "rashi": "<b>ואת כי שטית.<\/b> כִּי מְשַׁמֵּשׁ בִּלְשׁוֹן אִם:", "rashi_en": "ואת כי שטית BUT IF THOU HAST BUT IF THOU HAST GONE ASIDE ASIDE — The word כי must here be employed in the meaning of “if” (cf. Rashi on Genesis 18:15)."}, {"ch": 5, "v": 21, "aliyah": 4, "heb": "וְהִשְׁבִּ֨יעַ הַכֹּהֵ֥ן אֶֽת־הָאִשָּׁה֮ בִּשְׁבֻעַ֣ת הָאָלָה֒ וְאָמַ֤ר הַכֹּהֵן֙ לָֽאִשָּׁ֔ה יִתֵּ֨ן יְהֹוָ֥ה אוֹתָ֛ךְ לְאָלָ֥ה וְלִשְׁבֻעָ֖ה בְּת֣וֹךְ עַמֵּ֑ךְ בְּתֵ֨ת יְהֹוָ֤ה אֶת־יְרֵכֵךְ֙ נֹפֶ֔לֶת וְאֶת־בִּטְנֵ֖ךְ צָבָֽה׃", "onk": "וְיוֹמֵי כַהֲנָא יָת אִתְּתָא בְּמוֹמָתָא דִלְוָטָא וְיֵימַר כַּהֲנָא לְאִתְּתָא יְהֵב יְיָ יָתִיךְ לִלְוַט וּלְמוֹמֵי בְּגוֹ עַמִּיךְ בְּדִיהֵב יְיָ יָת יַרְכִּיךְ <b>מַסְיָא<\/b> וְיָת מְעַיְכִי <b>נְפִיחִין<\/b>:", "onk_en": "The <i>kohein<\/i> shall place the woman under oath with the oath of accursedness, and the <i>kohein<\/i> shall say to the woman: “Adonoy shall make you a curse and an oath among your people, when Adonoy causes your thigh to collapse [<b>fall away<\/b>] and your abdomen to swell.", "pj": "וְיוֹמֵי כַּהֲנָא יַת אִתְּתָא בְּקִיוּם זְנוּמְתָּא וְיֵימַר כַּהֲנָא לְאִתְּתָא יִתֵּן יְיָ יָתִיךְ לִלְוַט וְלִמְמוֹמֵי בְּגוֹ בְּנֵי עַמִיךְ בִּדְיִתֵּן יְיָ יַת יְרֵכוֹנֵךְ מִתְמַסְיָן וְיַת כַּרְסִיךְ מְנַפְחָא", "pj_en": "Then shall the priest adjure the woman by the oath of malediction, and say to the woman,-The Lord make thee a curse and an execration among the children of thy people, in causing thy thigh to corrupt, and thy belly to swell;.", "tj": "", "tj_en": "", "rashi": "<b>בשבעת האלה.<\/b> שְׁבוּעָה שֶׁל קְלָלָה:<br><br><b>יתן ה' אותך לאלה.<\/b> שֶׁיִּהְיוּ הַכֹּל מְקַלְלִין בִּיךְ — \"יְבוֹאֵךְ כְּדֶרֶךְ שֶׁבָּא לִפְלוֹנִית\":<br><br><b>ולשבעה.<\/b> שֶׁיִּהְיוּ הַכֹּל נִשְׁבָּעִין בִּיךְ —\"אִם לֹא יֶאֱרַע לִי כְּדֶרֶךְ שֶׁאֵרַע לִפְלוֹנִית\", וְכֵן הוּא אוֹמֵר \"וְהִנַּחְתֶּם שִׁמְכֶם לִשְׁבוּעָה לִבְחִירַי\" (ישעיהו ס\"ה), שֶׁהַצַּדִּיקִים נִשְׁבָּעִים בְּפֻרְעֲנוּתָן שֶׁל רְשָׁעִים, וְכֵן לְעִנְיַן הַבְּרָכָה, \"וְנִבְרְכוּ וְגוֹ'\" (בראשית י\"ב), \"בְּךָ יְבָרֵךְ יִשְׂרָאֵל לֵאמֹר\" (שם מ\"ח):<br><br><b>את ירכך.<\/b> בִּקְלָלָה הִקְדִּים יָרֵךְ לַבֶּטֶן, לְפִי שֶׁבָּהּ הִתְחִילָה בַעֲבֵרָה תְּחִלָּה (סוטה ח'):<br><br><b>צבה.<\/b> כְּתַרְגּוּמוֹ, נְפוּחָה:", "rashi_en": "בשבעת האלה [AND THE PRIEST SHALL ADJURE THE WOMAN] WITH AN ADJURATION OF CURSING — i.e., an oath which contains the curse.<br><br>יתן ה’ אותך לאלה THE LORD MAKE THEE AN EXECRATION — i.e. that everybody will curse through thee (i.e., by mention of thy name), saying, “May misfortune come upon you just as it came upon Mrs. so-and-so!” <br><br>ולשבעה [THE LORD MAKE THEE AN EXECRATION] AND AN OATH — This means, that everybody will swear through thee (i.e., by mention of thy name) — “If not (i.e., if I am not speaking the truth) may misfortune happen to me just as it happened to Mrs. So-and-so!” In a similar sense it states, (Isaiah 65:15) “and ye shall leave your name as an oath unto my chosen” which means that the righteous take an oath by mention of the punishment that came upon evil-doers. So, too, in reference to the blessing, does it state, (Genesis 12:3) “and through thee (i.e., by mention of thy name) shall bless themselves [all the families of the earth]”; (Genesis 48:20) “By thee shall Israel bless, saying, [God
