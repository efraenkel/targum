n": "and, after they had monished him, and he had wounded the witnesses who had found him pulling up wood, brought him to Mosheh and Aharon, and all the congregation.", "tj": "", "tj_en": "", "rashi": "<b>המצאים אתו מקשש.<\/b> שֶׁהִתְרוּ בוֹ וְלֹא הִנִּיחַ מִלְּקוֹשֵׁשׁ, אַף מִשֶׁמְּצָאוּהוּ וְהִתְרוּ בוֹ (שם; סנהדרין מ\"א):", "rashi_en": "המצאים אתו מקשש THEY THAT FOUND HIM PICKING UP WOOD — [The redundancy of the phrase המצאים אתו מקשש עצים intimates that] they warned him not to do this and yet he did not refrain from picking them up even after they had found him and warned him (cf. Sifrei Bamidbar 113; Sanhedrin 41a)."}, {"ch": 15, "v": 34, "aliyah": 7, "heb": "וַיַּנִּ֥יחוּ אֹת֖וֹ בַּמִּשְׁמָ֑ר כִּ֚י לֹ֣א פֹרַ֔שׁ מַה־יֵּעָשֶׂ֖ה לֽוֹ׃&nbsp;<span class=\"mam-spi-samekh\">{ס}<\/span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;", "onk": "<b>וְאַסְּרוּ<\/b> יָתֵיהּ בְּבֵית מַטְּרָא אֲרֵי לָא אִתְפְּרַשׁ לְהוֹן מָה דְיַעְבְּדוּן לֵיהּ:", "onk_en": "They placed [<b>bound<\/b>] him under guard since it was not specified, what was to be done to him.", "pj": "דֵין הוּא חַד מִן אַרְבָּעָה דִינִין דִי עָלוּ קֳדָם משֶׁה נְבִיָא וְדָן יַתְהוֹן עַל פּוּם מֵימְרָא דְקוּדְשָׁא מִנְהוֹן דִינֵי מָמוֹנָא וּמִנְהוֹן דִינֵי נַפְשָׁתָא בְּדִינֵי מָמוֹנָא הֲוָה משֶׁה זָרִיז וּבְדִינֵי נַפְשָׁתָא הֲוָה משֶׁה מָתוּן וּבְאִלְיֵין וּבְאִלְיֵין אָמַר משֶׁה לָא שַׁמְעִית מִן בִּגְלַל לְמַלְפָא רֵישֵׁי סַנְהֶדְרֵי דַעֲתִידִין לְמֵיקוּם דִיהֱווֹן זְרִיזִין בְּדִינֵי מָמוֹנָא וּמְתוּנִין בְּדִינֵי נַפְשָׁתָא וְלָא יְבַהְתוּן לִמְשַׁיְילָא דִינָא דְמִתְקַשֵׁי לְהוֹן אֲרוּם משֶׁה דַהֲוָה רַבְּהוֹן דְיִשְרָאֵל צָרִיךְ דְיֵימַר לָא שְׁמָעִית בְּגִין כֵּן אַצְנָעוּהִי בְּבֵית אֲסִירֵי אֲרוּם עַד כְּדוּן לָא אִתְפְּרַשׁ הָדֵין דִינָא יִתְעֲבֵיד בֵּיהּ", "pj_en": "This is one of four judgments which were brought before Mosheh the prophet, which he adjudged according to the Word of the Holy. Of these judgments some related to money, and some to life. In the judgments regarding money Mosheh was prompt, but in those affecting life he was deliberate, and in each he said, I have not heard, - to teach the princes of the future Sanhedrin to be prompt in decisions on mammon, and deliberate in those that involved life, nor to be ashamed to inquire for counsel in what may be difficult, forasmuch as Mosheh the Rabbi of Israel himself had need to say, I have not heard. Therefore put they him in confinement, because they had not yet heard the explanation of the judgment they should execute upon him.", "tj": "דין חד מן ארבע דינין כוליה כתוב למעלה במקלל ובטמא מת: וְאַצְנִיעוּ יָתֵיהּ בְּמַטְרָא עַד זְמַן דִי תִתְפְּרַשׁ לְהוֹן מִן קֳדָם יְיָ בְּאִילֵין דִינִין יִתְעֲבֵיד בֵּיהּ:", "tj_en": "This is one of four cases that are written above, on that of the blasphemer, and they who were defiled by the dead. And they put him in ward till the time when it should be plainly showed to them from before the Lord, with what judgment they were to deal with him.", "rashi": "<b>כי לא פרש מה יעשה לו.<\/b> בְּאֵיזוֹ מִיתָה יָמוּת, אֲבָל יוֹדְעִים הָיוּ שֶׁמְּחַלֵּל שַׁבָּת בְּמִיתָה (שם ע\"ח):", "rashi_en": "כי לא פרש מה יעשה לו [AND, THEY PLACED HIM IN WARD] BECAUSE IT WAS NOT EXPLAINED WHAT SHOULD BE DONE WITH HIM — i.e. what kind of death penalty he was to die had not yet been explained, but they were fully aware that one who desecrates the Sabbath is punishable by some death penalty (Sifrei Bamidbar 114; Sanhedrin 78b; cf. Rashi on Leviticus 24:12)."}, {"ch": 15, "v": 35, "aliyah": 7, "heb": "וַיֹּ֤אמֶר יְהֹוָה֙ אֶל־מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָאִ֑ישׁ רָג֨וֹם אֹת֤וֹ בָֽאֲבָנִים֙ כׇּל־הָ֣עֵדָ֔ה מִח֖וּץ לַֽמַּחֲנֶֽה׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה אִתְקְטָלָא יִתְקְטֵל גַּבְרָא מִרְגַּם יָתֵיהּ בְּאַבְנַיָּא כָּל כְּנִשְׁתָּא מִבָּרָא לְמַשְׁרִיתָא:", "onk_en": "Adonoy said to Moshe: “That man shall be put to death, the entire congregation shall stone him beyond the encampment.”", "pj": "וַאֲמַר יְיָ לְמשֶׁה אִתְקְטָלָא יִתְקְטֵיל גַבְרָא אַטְלוּ יָתֵיהּ בְאַבְנָא כָּל כְּנִישְׁתָּא מִבָּרָא לְמַשְׁרִיתָא", "pj_en": "And the Lord said to Mosheh: The man shall be surely put to death; the whole congregation shall stone him with stones without the camp;", "tj": "", "tj_en": "", "rashi": "<b>רגום.<\/b> עָשֹׂה, פשנ\"ט, וְכֵן הָלוֹךְ אלנ\"ט, וְכֵן \"זָכוֹר\" (שמות כ, ח) וְ\"שָׁמוֹר\" (דברים ה, יב):", "rashi_en": "רגום expresses the idea of “doing” something (that is, it is an infinitive or verbal noun); in O. F. faisant; (English = doing). Similarly הלוך allant, “going“, and so, too, זכור “remembering”, שמור “keeping”."}, {"ch": 15, "v": 36, "aliyah": 7, "heb": "וַיֹּצִ֨יאוּ אֹת֜וֹ כׇּל־הָעֵדָ֗ה אֶל־מִחוּץ֙ לַֽמַּחֲנֶ֔ה וַיִּרְגְּמ֥וּ אֹת֛וֹ בָּאֲבָנִ֖ים וַיָּמֹ֑ת כַּאֲשֶׁ֛ר צִוָּ֥ה יְהֹוָ֖ה אֶת־מֹשֶֽׁה׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "וְאַפִּיקוּ יָתֵיהּ כָּל כְּנִשְׁתָּא לְמִבָּרָא לְמַשְׁרִיתָא וּרְגָמוּ יָתֵיהּ בְּאַבְנַיָּא וּמִית כְּמָא דִי פַקִיד יְיָ יָת משֶׁה:", "onk_en": "The entire congregation brought him outside beyond the encampment, and they stoned him with stones, and he died, just as Adonoy commanded Moshe.", "pj": "וְהַנְפִּיקוּ יָתֵיהּ כָּל כְּנִישְׁתָּא מִבָּרָא לְמַשְׁרִיתָא וְאַטְלוּ יָתֵיהּ בְאַבְנַיָא וּמִית הֵיכְמָא דְפַקֵיד יְיָ יַת משֶׁה", "pj_en": "and the congregation led him forth without the camp, and stoned him with stones that he died, as the Lord had commanded Mosheh.", "tj": "", "tj_en": "", "rashi": "<b>ויציאו אתו.<\/b> מִכָּאן שֶׁבֵּית הַסְּקִילָה חוּץ וְרָחוֹק מִבֵּית דִּין (ספרי):", "rashi_en": "ויציאו אתו AND [ALL THE CONGREGATION] BROUGHT HIM OUTSIDE [THE CAMP] — From here we learn that the place of stoning was outside and distant from the seat of the Beth Din (Sifrei Bamidbar 114)."}, {"ch": 15, "v": 37, "aliyah": 7, "heb": "וַיֹּ֥אמֶר יְהֹוָ֖ה אֶל־מֹשֶׁ֥ה לֵּאמֹֽר׃", "onk": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר:", "onk_en": "And Adonoy spoke to Moshe, saying:", "pj": "וַאֲמַר יְיָ לְמשֶׁה לְמֵימָר", "pj_en": "And the Lord said unto Mosheh:", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 38, "aliyah": 7, "heb": "דַּבֵּ֞ר אֶל־בְּנֵ֤י יִשְׂרָאֵל֙ וְאָמַרְתָּ֣ אֲלֵהֶ֔ם וְעָשׂ֨וּ לָהֶ֥ם צִיצִ֛ת עַל־כַּנְפֵ֥י בִגְדֵיהֶ֖ם לְדֹרֹתָ֑ם וְנָ֥תְנ֛וּ עַל־צִיצִ֥ת הַכָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת׃", "onk": "מַלֵּל עִם בְּנֵי יִשְׂרָאֵל וְתֵימַר לְהוֹן וְיַעְבְּדוּן לְהוֹן כְּרוּסְפְּדִין עַל כַּנְפֵי כְסוּתְהוֹן לְדָרֵיהוֹן וְיִתְּנוּן עַל כְּרוּסְפְּדָא דְכַנְפָא חוּטָא דִתְכֶלְתָּא:", "onk_en": "Speak to Bnei Yisroel and tell them to make for themselves, <i>tzizis<\/i>-fringes on the corners of their garments—throughout their generations; and they will place with the fringes of each corner a thread of blue.", "pj": "מַלֵיל עִם בְּנֵי יִשְרָאֵל וְתֵימַר לְהוֹן וְיַעַבְדִין לְהוֹן צִיצְיָיתָא לָא מִן נִימַיָא וְלָא מִן סִיסַיָא וְלָא מִן גַרְדַיָא אֱלָהֵן לְשׁוּמְהוֹן יַעַבְדוּנוּן וְיִפְסְקוּן רֵישֵׁי חוּטֵיהוֹן וְיִתְּלוּן בַּחֲמֵשֶׁת קִיטְרִין אַרְבָּעָה בְּגוֹ תְלָתָא עַל אַרְבַּעַת אַנְפֵּי גוּלֵיהוֹן דְמִתְעַטְפִין בְּהוֹן לְדָרֵיהוֹן וְיִתְּנוּן עַל אַנְפָּא גוּלְיַתְהוֹן שְׁזִיר דְתִכְלָא", "pj_en": "Speak with the sons of Israel, and bid them make for themselves fringes, not of threads, nor of yarns, nor of fibres, but after a manner of their own (lesumhon) shall they make them, and shall cut off the heads of their filaments, and suspend by five ligatures, four in the midst of three, upon the four corners of their garment in which they enwrap themselves, unto their generations; and they shall put upon the edge of their robes an embroidery of hyacinth (shezir de-thikela).", "tj": "וְיַעַבְדוּן לְהוֹן צִיצִין עַל צְנָפַת דְגוֹלַתְהוֹן לְדָרֵיהוֹן וְיִתְּנוּן עַל צִיצִין דְגוֹלַתְהוֹן שְׁזִיר דְתִכְלָא:", "tj_en": "And let them make to themselves fringes for the edges of their robes, throughout their generations, and put upon the fringes of their robes an embroidery of hyacinth.", "rashi": "<b>ועשו להם ציצת.<\/b> עַל שֵׁם הַפְּתִילִים הַתְּלוּיִם בָּהּ, כְּמוֹ (יחזקאל ח'), \"וַיִּקָּחֵנִי בְּצִיצִת רֹאשִׁי\" (מנחות מ\"ב). דָּ\"אַ: <b>ציצת<\/b> עַל שֵׁם וּרְאִיתֶם אֹתוֹ, כְּמוֹ \"מֵצִיץ מִן הַחֲרַכִּים\" (שיר השירים ב'):<br><br><b>תכלת.<\/b> צֶבַע יָרֹק שֶׁל חִלָּזוֹן:", "rashi_en": "ועשו להם ציצת THAT THEY MAKE THEM A FRINGE — It is called צצית, because of the threads that hang down from it. Similar is, (Ezekiel 8:3) “and he caught me by the curls (ציצת) of my head’’. (The word denotes something twisted as threads or curls). — Another explanation is: it is called ציצת because of the command associated with it (v. 39) “and ye shall look at it”. Similar is, “looking (מציץ) from the lattice” (Song 2:9). (The word therefore denotes “something looked at”) (Sifrei Bamidbar 115).<br><br>תכלת BLUE PURPLE — It is the blue dye of (obtained from) the blood of the Chilazon (a kind of shell-fish)."}, {"ch": 15, "v": 39, "aliyah": 7, "heb": "וְהָיָ֣ה לָכֶם֮ לְצִיצִת֒ וּרְאִיתֶ֣ם אֹת֗וֹ וּזְכַרְתֶּם֙ אֶת־כׇּל־מִצְוֺ֣ת יְהֹוָ֔ה וַעֲשִׂיתֶ֖ם אֹתָ֑ם וְלֹֽא־תָת֜וּרוּ אַחֲרֵ֤י לְבַבְכֶם֙ וְאַחֲרֵ֣י עֵֽינֵיכֶ֔ם אֲשֶׁר־אַתֶּ֥ם זֹנִ֖ים אַחֲרֵיהֶֽם׃", "onk": "וִיהוֹן לְכוֹן לִכְרוּסְפְּדִין וְתֶחֱזוּן יָתֵיהּ וְתִדְכְּרוּן יָת כָּל פִּקּוּדַיָּא דַיְיָ וְתַעְבְּדוּן יָתְהוֹן וְלָא <b>תִטְּעוּן<\/b> בָּתַר הִרְהוּר לִבְּכוֹן וּבָתַר <b>חֵיזוּ<\/b> עֵינֵיכוֹן דִּי אַתּוּן טָעַן בַּתְרֵיהוֹן:", "onk_en": "And it will be to you for fringes and you will look upon it and you will remember all of Adonoy’s commandments and you will perform them; and you will not search [<b>stray<\/b>] after [the desire of] your hearts and after [<b>the sight<\/b>] your eyes which cause you to go astray.", "pj": "וִיהֵי לְמִצְוָתָא דְצִיצְיַת וְתֶחֱמוּן יָתֵיהּ בִּזְמַן דְאַתּוּן מִתְעַטְפִין בְּהוֹן בִּימָמָא וְתִדְכְּרוּן יַת כָּל פִּקוּדַי וְתַעַבְדוּן יַתְהוֹן וְלָא תִסְטוּן לְמִטְעֵי בָּתַר הִרְהוּר לִבְּכוֹן וּבָתַר חֵיזוּ עֵינֵיכוֹן דְאַתּוּן טָעַן בַּתְרֵיהוֹן", "pj_en": "And this shall be to you a precept for fringes, that you may look upon them at the time when you dress yourselves daily, and remember all My commandments to do them, and not go aside to wander after the imaginations of your heart and the sight of your eyes, after which you have gone astray.", "tj": "", "tj_en": "", "rashi": "<b>וזכרתם את כל מצות ה'.<\/b> שֶׁמִּנְיַן גִּימַטְרִיָּא שֶׁל צִיצִית שֵׁשׁ מֵאוֹת, וּשְׁמוֹנָה חוּטִין וַחֲמִשָּׁה קְשָׁרִים הֲרֵי תרי\"ג (תנחומא):<br><br><b>ולא תתורו אחרי לבבכם.<\/b> כְּמוֹ \"מִתּוּר הָאָרֶץ\" (במדבר י\"ג); הַלֵּב וְהָעֵינַיִם הֵם מְרַגְּלִים לַגּוּף, מְסַרְסְרִים לוֹ אֶת הָעֲבֵרוֹת, הָעַיִן רוֹאָה וְהַלֵּב חוֹמֵד וְהַגּוּף עוֹשֶׂה אֶת הָעֲבֵרָה (תנחומא):", "rashi_en": "וזכרתם את כל מצות ה׳ AND YE SHALL REMEMBER ALL THE COMMANDMENTS OF THE LORD — The ציצית will remind one of all the commandments because the numerical value of the letters of the word ציצית is six hundred, and there are eight threads and five knots in the fringes, so that you have six hundred and thirteen, which is also the number of the commandments of the Torah.<br><br>ולא תתרו אחרי לבבכם — The verb has the same meaning as in (Numbers 13:25), “and they returned from searching (מתור) the land”. (The translation therefore is: AND YE SHALL NOT SEARCH AFTER YOUR OWN HEART). The heart and the eyes are the “spies” of the body — they act as its agents for sinning: the eye sees, the heart covets and the body commits the sin (Midrash Tanchuma, Sh'lach 15; cf. Talmud Yerushalmi Berakhot 1:8)."}, {"ch": 15, "v": 40, "aliyah": 7, "heb": "לְמַ֣עַן תִּזְכְּר֔וּ וַעֲשִׂיתֶ֖ם אֶת־כׇּל־מִצְוֺתָ֑י וִהְיִיתֶ֥ם קְדֹשִׁ֖ים לֵאלֹֽהֵיכֶֽם׃", "onk": "בְּדִיל דְּתִדְכְּרוּן וְתַעְבְּדוּן יָת כָּל פִּקּוֹדָי וּתְהוֹן קַדִּישִׁין <b>קֳדָם<\/b> אֱלָהָכוֹן:", "onk_en": "In order that you will remember and perform all My commandments; and you will be holy unto [<b>before<\/b>] your God.", "pj": "מִן בִּגְלַל דְתִדְכְּרוּן וְתַעַבְדוּן יַת כָּל פִּקוּדַי וְתֶהֱווֹן קַדִישִׁין הֵי כְמַלְאָכַיָא דִמְשַׁמְשִׁין קֳדָם יְיָ אֱלָהָכוֹן", "pj_en": "To the end that you may remember and perform all My precepts, and be holy, like the angels who minister before the Lord your God.", "tj": "", "tj_en": "", "rashi": "", "rashi_en": ""}, {"ch": 15, "v": 41, "aliyah": 7, "heb": "אֲנִ֞י יְהֹוָ֣ה אֱלֹֽהֵיכֶ֗ם אֲשֶׁ֨ר הוֹצֵ֤אתִי אֶתְכֶם֙ מֵאֶ֣רֶץ מִצְרַ֔יִם לִהְי֥וֹת לָכֶ֖ם לֵאלֹהִ֑ים אֲנִ֖י יְהֹוָ֥ה אֱלֹהֵיכֶֽם׃&nbsp;<span class=\"mam-spi-pe\">{פ}<\/span><br>", "onk": "אֲנָא יְיָ אֱלָהָכוֹן דִּי אַפֵּקִית יָתְכוֹן מֵאַרְעָא דְמִצְרַיִם לְמֵהֲוֵי לְכוֹן לֵאֱלָהָא אֲנָא יְיָ אֱלָהָכוֹן:", "onk_en": "I am Adonoy, your God, Who brought you out of the land of Egypt to be your God. I am Adonoy your God.", "pj": "אֲנָא הוּא יְיָ אֱלָהָכוֹן דִי פְרָקִית וְאַפֵּקִית יַתְכוֹן פְּרִיקִין מֵאַרְעָא דְמִצְרַיִם מְטוֹל לְמֶהֱוֵי לְכוֹן לֶאֱלָהָא אֲנָא הוּא יְיָ אֱלָהָכוֹן", "pj_en": "I am the Lord your God who have delivered and brought you free out of the land of Mizraim, to be to you Eloha. I am the Lord your God.", "tj": "", "tj_en": "", "rashi": "<b>אני ה'.<\/b> נֶאֱמָן לְשַׁלֵּם שָׂכָר:<br><br><b>אלהיכם.<\/b> נֶאֱמָן לִפָּרַע:<br><br><b>אשר הוצאתי אתכם.<\/b> עַל מְנָת כֵּן פָּדִיתִי אֶתְכֶם שֶׁתְּקַבְּלוּ עֲלֵיכֶם גְּזֵרוֹתַי:<br><br><b>אני ה' אלהיכם.<\/b> עוֹד לָמָּה נֶאֱמַר? כְּדֵי שֶׁלֹּא יֹאמְרוּ יִשְׂרָאֵל מִפְּנֵי מָה אָמַר הַמָּקוֹם? לֹא שֶׁנַּעֲשֶׂה וְנִטֹּל שָֹכָר? אָנוּ לֹא עוֹשִׂים וְלֹא נוֹטְלִים שָׂכָר עַל כָּרְחֲכֶם אֲנִי מַלְכְּכֶם, וְכֵן הוּא אוֹמֵר (יחזקאל כ'), \"אִם לֹא בְּיָד חֲזָקָה … אֶמְלוֹךְ עֲלֵיכֶם\" (ספרי). דָּ\"אַ, לָמָּה נֶאֱמַר יְצִיאַת מִצְרַיִם? אֲנִי הוּא שֶׁהִבְחַנְתִּי בְמִצְרַיִם בֵּין טִפָּה שֶׁל בְּכוֹר לְשֶׁאֵינָהּ שֶׁל בְּכוֹר, אֲנִי הוּא עָתִיד לְהַבְחִין וְלִפָּרַע מִן הַתּוֹלֶה קָלָא אִילָן בְּבִגְדּוֹ וְאוֹמֵר תְּכֵלֶת הִיא. וּמִיסוֹדוֹ שֶׁל רַבִּי מֹשֶׁה הַדַּרְשָׁן הֶעְתַּקְתִּי: לָמָּה נִסְמְכָה פָרָשַׁת מְקוֹשֵׁשׁ לְפָרָשַׁת עֲ\"זָ? לוֹמַר שֶׁהַמְחַלֵּל אֶת הַשַּׁבָּת כְּעוֹבֵד עֲ\"זָ, שֶׁאַף הִיא שְׁקוּלָה כְּכָל הַמִּצְוֹת, וְכֵן הוּא אוֹמֵר בְּעֶזְרָא (נחמיה ט׳:י״ד) \"וְעַל הַר סִינַי יָרַדְתָּ וַתִּתֵּן לְעַמְּךָ תּוֹרָה וּמִצְוֹת וְאֶת שַׁבַּת קָדְשְׁךָ הוֹדַעְתָ לָהֶם\"; וְאַף פָּרָשַׁת צִיצִית לְכָךְ נִסְמְכָה לָאֵלּוּ לְפִי שֶׁאַף הִיא שְׁקוּלָה כְנֶגֶד כָּל הַמִּצְוֹת, שֶׁנֶּאֱמַר וַעֲשִׂיתֶם אֶת כָּל מִצְוֹתָי:<br><br><b>על כנפי בגדיהם.<\/b> כְּנֶגֶד \"וָאֶשָּׂא אֶתְכֶם עַל כַּנְפֵי נְשָׁרִים\" (שמות יט, ד) ; עַל אַרְבַּע כַּנְפוֹת, וְלֹא בַעֲלַת שָׁלֹשׁ וְלֹא בַעֲלַת חָמֵשׁ, כְּנֶגֶד אַרְבַּע לְשׁוֹנוֹת שֶׁל גְּאֻלָּה שֶׁנֶּאֱמַר בְּמִצְרַיִם \"וְהוֹצֵאתִי וְהִצַּלְתִּי וְגָאַלְתִּי וְלָקַחְתִּי\" (שמות ו'):<br><br><b>פתיל תכלת.<\/b> עַל שֵׁם שִׁכּוּל בְּכוֹרוֹת — תַּרְגּוּמוֹ שֶׁל שִׁכּוּל תִּכְלָא — וּמַכָּתָם הָיְתָה בַלַּיְלָה, וְכֵן צֶבַע הַתְּכֵלֶת דּוֹמֶה לָרָקִיעַ הַמַּשְׁחִיר לְעֵת עֶרֶב; וּשְׁמוֹנָה חוּטִין שֶׁבָּהּ כְּנֶגֶד שְׁמוֹנָה יָמִים שֶׁשָּׁהוּ יִשְׂרָאֵל מִשֶּׁיָּצְאוּ מִמִּצְרַיִם עַד שֶׁאָמְרוּ שִׁירָה עַל הַיָּם:", "rashi_en": "אני ה׳ I AM THE LORD Who am faithful to give reward.<br><br>אלהיכם YOUR GOD Who am certain to exact punishment (cf. Sifrei Bamidbar 115:1).<br><br>אשר הוצאתי אתכם [I AM THE LORD YOUR GOD] WHO BROUGHT YOU OUT [OF THE LAND OF EGYPT TO BE YOUR GOD] — On this condition I delivered you — that you should take upon yourselves My decrees (i.e. that I should be your God) (Sifrei Bamidbar 115:1).<br><br>אני ה׳ אלהיכם I AM THE LORD YOUR GOD — Why is this stated again? In order that the Israelites should not say, “Why has the Omnipresent said it ('אני ה)? Is it not in order that we should perform the commandments and receive reward (cf. Rashi on previous verse)!? We will not perform them and we shall not receive (we shall not expect) any reward!” Therefore it states again in general terms and without reference to the Exodus from Egypt, “I will be the Lord your God: in spite of yourselves I will be your King (I will exercise My sovereignty upon you). — In a similar sense it states, (Ezekiel 20:23) “Surely with a strong hand … will I reign over you” (Sifrei Bamidbar 115:1). — Another explanation: Why is the exodus from Egypt mentioned in connection with the fringes? In order to intimate: It was I who distinguished in Egypt between one who was a firstborn and one who was not (cf. Rashi on Leviticus 19:36); I shall also find out and exact punishment from him who attaches indigo-dyed wool (which resembles תכלת in colour) on his garments and pretends that it is תכלת (Bava Metzia 61b). From the work of Rabbi Moses the Preacher I copy the following: Why is the section speaking of the stick-gatherer placed in juxtaposition with the section (vv. 22—31) dealing with idolatry? In order to tell you that whoever desecrates the Sabbath is regarded as having worshipped idols, for it (the law of the Sabbath) also is alone of equal importance with the entire sum of the commandments (just as is the law of idolatry; cf. Rashi on v. 22). And so, too, it is said in the Book of Ezra, (Nehemia 9:13—14) “And Thou camest down upon Mount Sinai and gavest to Thy people … the Torah and commandments and Thou madest known unto them Thy holy Sabbath”. And the section dealing with the “Zizith” is also for the same reason placed in juxtaposition with these two sections, because it, too, is of equal importance with the sum total of the commandments, as it is said, (v. 40) “[That ye may remember] and do all My commandments\". <br><br>על כנפי בגדיהם ON THE BORDERS (lit., wings) OF THEIR GARMENTS — an allusion to God having delivered them from Egypt, as it states, (Exodus 19:4) “And I bore you on eagles’ wings” (cf. Rashi on this verse). The Zizith are to be placed on a garment having four corners but not on one that has three or on one that has five corners (cf. Zevachim 18b), thereby alluding to the four different terms used by God in describing the deliverance from Egypt, for it states, (Exodus 6:6—7) “And I will bring forth”, “and I shall deliver”, “and I shall redeem”, “and I shall take out”.<br><br>פתיל תכלת A THREAD OF BLUE PURPLE — an allusion to the bereavement (שכול) which the Egyptians suffered through the death of their firstborn, for the Targum (Aramaic) word corresponding to שכול, bereavement, is תכלה (similar in sound to תכלת). Further, the plague that befell them was at night, and so, too, the colour תכלת resembles the sky when it darkens at eventide (cf. Sifrei Bamidbar 115:1; Menachot 43b). The eight threads in it (the ציצית) are an allusion to the eight days that Israel waited from the time they went forth from Egypt until they sang the Song of Praise at the Red Sea."}];

function loadJSON(key, fallback) { try { const r = localStorage.getItem(key); if (r) return JSON.parse(r); } catch(e) {} return fallback; }
function saveJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

let prefs = loadJSON('targum-prefs-v6', { onk: true, pj: true, yer: true, rashi: false, en: false, bm: false });
document.querySelectorAll('.chip').forEach(btn => { btn.dataset.on = prefs[btn.dataset.key] ? 'true' : 'false'; });

let bookmarks = new Set(loadJSON('bookmarks-' + SLUG, []));
function saveBookmarks() { saveJSON('bookmarks-' + SLUG, [...bookmarks]); }

let theme = null;
try { theme = localStorage.getItem('theme'); } catch(e) {}
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.getElementById('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
});

const panel = document.getElementById('panel');
document.getElementById('fontBtn').addEventListener('click', () => { panel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const offlineTip = document.getElementById('offlineTip');
document.getElementById('offlineBtn').addEventListener('click', () => { offlineTip.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

const exportPanel = document.getElementById('exportPanel');
document.getElementById('exportBtn').addEventListener('click', () => { exportPanel.classList.toggle('open'); setTimeout(syncHeaderHeight, 0); });

function stripHtml(s) {
  return (s || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '');
}

function buildExportText() {
  const title = document.querySelector('h1').textContent;
  const lines = [title + ' — קטעים שסומנו', ''];
  let any = false;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (!bookmarks.has(key)) continue;
    any = true;
    lines.push('פרק ' + (CH_LETTERS[row.ch] || row.ch) + ', פסוק ' + row.v);
    lines.push(row.heb);
    const add = (label, text, en) => {
      if (!text) return;
      lines.push('  ' + label + ': ' + stripHtml(text));
      if (prefs.en && en) lines.push('    (EN: ' + stripHtml(en) + ')');
    };
    if (prefs.onk) add('אונקלוס', row.onk, row.onk_en);
    if (prefs.pj) add('יונתן', row.pj, row.pj_en);
    if (prefs.yer) add('ירושלמי', row.tj, row.tj_en);
    if (prefs.rashi) add('רש״י', row.rashi, row.rashi_en);
    lines.push('');
  }
  return any ? lines.join('\n') : null;
}

function showExportMsg(text) {
  const el = document.getElementById('exportMsg');
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 4000);
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  try {
    await navigator.clipboard.writeText(text);
    showExportMsg('הועתק ללוח!');
  } catch (e) {
    showExportMsg('ההעתקה נכשלה — נסו את כפתור ההורדה');
  }
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const text = buildExportText();
  if (!text) { showExportMsg('אין קטעים מסומנים עדיין'); return; }
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SLUG + '-bookmarks.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showExportMsg('ההורדה החלה');
});

const fontSelect = document.getElementById('fontSelect');
let savedFont = null;
try { savedFont = localStorage.getItem('reading-font'); } catch(e) {}
if (savedFont) { document.documentElement.style.setProperty('--font-main', savedFont); fontSelect.value = savedFont; }
fontSelect.addEventListener('change', () => {
  document.documentElement.style.setProperty('--font-main', fontSelect.value);
  try { localStorage.setItem('reading-font', fontSelect.value); } catch(e) {}
});

const SIZES = [0.85, 1, 1.15, 1.3, 1.45];
let sizeIdx = loadJSON('reading-size-idx', 1);
function applySize() { document.documentElement.style.setProperty('--fsize', SIZES[sizeIdx]); }
applySize();
document.getElementById('sizeUp').addEventListener('click', () => { sizeIdx = Math.min(sizeIdx + 1, SIZES.length - 1); applySize(); saveJSON('reading-size-idx', sizeIdx); });
document.getElementById('sizeDown').addEventListener('click', () => { sizeIdx = Math.max(sizeIdx - 1, 0); applySize(); saveJSON('reading-size-idx', sizeIdx); });

const nav = document.getElementById('aliyahNav');
const aliyahCount = DATA.reduce((m, r) => Math.max(m, r.aliyah || 0), 0);
for (let i = 1; i <= aliyahCount; i++) {
  const b = document.createElement('button');
  b.className = 'aliyah-btn';
  b.dataset.aliyah = i;
  b.textContent = 'עלייה ' + (ALIYAH_LETTERS[i] || i);
  b.addEventListener('click', () => { const el = document.getElementById('aliyah-' + i); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  nav.appendChild(b);
}

const chapterNav = document.getElementById('chapterNav');
const chapters = [...new Set(DATA.map(r => r.ch))];
if (chapters.length > 1) {
  for (const ch of chapters) {
    const b = document.createElement('button');
    b.className = 'chapter-btn';
    b.dataset.ch = ch;
    b.textContent = 'פרק ' + (CH_LETTERS[ch] || ch);
    b.addEventListener('click', () => { const el = document.getElementById('chapter-' + ch); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    chapterNav.appendChild(b);
  }
} else {
  chapterNav.style.display = 'none';
}

function targumEl(key, text, english) {
  const d = document.createElement('div');
  d.className = 'targum-block ' + key;
  let html = '<span class="targum-label">' + LABELS[key] + '</span>' + text;
  if (prefs.en) {
    if (english) html += '<div class="translation translation-en">' + english + '</div>';
    else html += '<div class="translation translation-en missing">No English available for this verse</div>';
  }
  d.innerHTML = html;
  return d;
}

function bookmarkBtn(key) {
  const bm = document.createElement('button');
  bm.className = 'bm-btn' + (bookmarks.has(key) ? ' on' : '');
  bm.dataset.key = key;
  bm.textContent = bookmarks.has(key) ? '★' : '☆';
  bm.setAttribute('aria-label', 'סמן קטע זה');
  bm.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bookmarks.has(key)) bookmarks.delete(key); else bookmarks.add(key);
    saveBookmarks();
    if (prefs.bm) {
      // filtering by bookmarks: unmarking must remove this verse from view
      const anchor = currentAnchorKey();
      render();
      restoreAnchor(anchor);
      updatePosition();
    } else {
      bm.classList.toggle('on');
      bm.textContent = bookmarks.has(key) ? '★' : '☆';
    }
  });
  return bm;
}

const main = document.getElementById('main');
function render() {
  main.innerHTML = '';
  let lastCh = null, lastAliyah = null, shown = 0;
  for (const row of DATA) {
    const key = row.ch + '-' + row.v;
    if (prefs.bm && !bookmarks.has(key)) continue;
    shown++;
    if (row.aliyah !== lastAliyah) {
      lastAliyah = row.aliyah;
      const a = document.createElement('div');
      a.className = 'aliyah-head'; a.id = 'aliyah-' + row.aliyah;
      a.dataset.aliyah = row.aliyah;
      a.textContent = 'עלייה ' + (ALIYAH_LETTERS[row.aliyah] || row.aliyah);
      main.appendChild(a);
    }
    if (row.ch !== lastCh) {
      lastCh = row.ch;
      const h = document.createElement('div');
      h.className = 'chapter-head'; h.id = 'chapter-' + row.ch;
      h.dataset.ch = row.ch;
      h.textContent = 'פרק ' + (CH_LETTERS[row.ch] || row.ch);
      main.appendChild(h);
    }
    const v = document.createElement('div');
    v.className = 'verse';
    v.dataset.key = key;
    v.dataset.ch = row.ch;
    v.dataset.aliyah = row.aliyah;
    const vr = document.createElement('div');
    vr.className = 'verse-row';
    vr.innerHTML = '<div class="vnum">' + row.v + '</div><div class="heb">' + row.heb + '</div>';
    vr.appendChild(bookmarkBtn(key));
    v.appendChild(vr);
    if (prefs.onk && row.onk) v.appendChild(targumEl('onk', row.onk, row.onk_en));
    if (prefs.pj && row.pj) v.appendChild(targumEl('pj', row.pj, row.pj_en));
    if (prefs.yer && row.tj) v.appendChild(targumEl('yer', row.tj, row.tj_en));
    if (prefs.rashi && row.rashi) v.appendChild(targumEl('rashi', row.rashi, row.rashi_en));
    main.appendChild(v);
  }
  if (prefs.bm && shown === 0) {
    const msg = document.createElement('div');
    msg.className = 'empty-bm-msg';
    msg.textContent = 'אין קטעים מסומנים בפרשה הזו. לחצו על ☆ ליד פסוק כדי לסמן אותו.';
    main.appendChild(msg);
  }
}

// --- keep your place in the text across toggles (no more jumping) ---
function currentAnchorKey() {
  const headerH = document.querySelector('header').offsetHeight;
  for (const v of main.querySelectorAll('.verse')) {
    if (v.getBoundingClientRect().bottom > headerH) return v.dataset.key;
  }
  return null;
}
function restoreAnchor(key) {
  const el = key ? main.querySelector('[data-key="' + CSS.escape(key) + '"]') : null;
  const prevBehavior = document.documentElement.style.scrollBehavior;
  document.documentElement.style.scrollBehavior = 'auto';  // instant, not animated
  if (el) {
    el.scrollIntoView({ block: 'start' });
  } else {
    // anchor verse no longer rendered (e.g. hidden by the bookmark filter) —
    // go to top rather than leave the page at an unrelated scroll position
    window.scrollTo(0, 0);
  }
  document.documentElement.style.scrollBehavior = prevBehavior;
}

// --- "where am I" indicator + nav highlighting, kept in sync while scrolling ---
let lastActiveCh = null, lastActiveAliyah = null;
function updatePosition() {
  const headerH = document.querySelector('header').offsetHeight;
  let curCh = null, curAliyah = null;
  main.querySelectorAll('.chapter-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curCh = el.dataset.ch;
  });
  main.querySelectorAll('.aliyah-head').forEach(el => {
    if (el.getBoundingClientRect().top <= headerH + 2) curAliyah = el.dataset.aliyah;
  });
  const posEl = document.getElementById('posIndicator');
  if (posEl) {
    const parts = [];
    if (curCh) parts.push('פרק ' + (CH_LETTERS[curCh] || curCh));
    if (curAliyah) parts.push('עלייה ' + (ALIYAH_LETTERS[curAliyah] || curAliyah));
    posEl.textContent = parts.join(' · ');
  }
  if (curCh !== lastActiveCh) {
    lastActiveCh = curCh;
    document.querySelectorAll('.chapter-btn').forEach(b => {
      const on = b.dataset.ch === curCh;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
  if (curAliyah !== lastActiveAliyah) {
    lastActiveAliyah = curAliyah;
    document.querySelectorAll('.aliyah-btn').forEach(b => {
      const on = b.dataset.aliyah === curAliyah;
      b.classList.toggle('active', on);
      if (on) b.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }
}
window.addEventListener('scroll', () => requestAnimationFrame(updatePosition), { passive: true });

document.querySelectorAll('.chip').forEach(btn => {
  const key = btn.dataset.key;
  btn.addEventListener('click', () => {
    prefs[key] = !prefs[key];
    btn.dataset.on = prefs[key] ? 'true' : 'false';
    saveJSON('targum-prefs-v6', prefs);
    const anchor = currentAnchorKey();
    render();
    restoreAnchor(anchor);
    updatePosition();
  });
});

function syncHeaderHeight() {
  const h = document.querySelector('header').offsetHeight;
  document.getElementById('spacer').style.height = h + 'px';
  document.documentElement.style.setProperty('--header-h', h + 'px');
}
window.addEventListener('resize', syncHeaderHeight);

render();
syncHeaderHeight();
updatePosition();
setTimeout(syncHeaderHeight, 150);
</script>
